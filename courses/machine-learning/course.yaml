# The trail. One level per chapter of the main source (Bishop and Bishop,
# Deep Learning: Foundations and Concepts, 20 chapters), lessons in trail order.
#
# A lesson entry with `file:` is built and playable; without it, it shows as
# a planned (greyed) node. `kind` is concept | guided | traps | intuition, plus
# the end-of-level kinds: map (content-map puzzle), review (automatic, no file:
# practises only this level's questions) and challenge (mixed problems).
# Guided nodes come in three flavours, named in the summary: guided problem,
# guided proof (proof: true in the file) and AI audit (a guided problem built
# on AI-written code, claims or results; course CLAUDE.md, Course method).
# Extra levels (eyebrow, no number) teach what the book lacks, from the other
# sources (course CLAUDE.md): x-trees after Level 6, x-rewards after Level 12,
# x-modern after Level 20.
# Exams: own levels exam-partial1 (after x-trees, covers 2-6 + x-trees),
# exam-partial2 (after Level 10, covers 7-10), exam-partial3 (after Level 15,
# covers 11-15 + x-rewards) and exam-final (after x-modern, covers 16-20 +
# x-modern). No exam covers more than 6 levels (root CLAUDE.md, Exam).
# Original exams.

title: Machine Learning
overview:
  text: >-
    How can a program learn to spot skin cancer, translate a sentence or paint a face, when nobody wrote down the rules? Machine learning builds machines that learn from examples, and today they write code and answer questions too. That makes a new skill precious: knowing what a model can do, when it fails, and whether a result deserves your trust. This course teaches the ideas behind modern learning machines, from fitting a curve to transformers and diffusion models, with puzzles where you guess first and check after. Along the way you audit code and claims written by an AI, so you learn to think with these tools without being fooled by them.
  sources:
    - who: Christopher M. Bishop and Hugh Bishop
      what: "Deep Learning: Foundations and Concepts (Springer, 2024). The guide for the whole course, from probability to transformers and diffusion models."
    - who: Gareth James, Daniela Witten, Trevor Hastie and Robert Tibshirani
      what: "An Introduction to Statistical Learning (Springer, 2013). Decision trees, random forests and boosting."
    - who: Richard S. Sutton and Andrew G. Barto
      what: "Reinforcement Learning: An Introduction (MIT Press, second edition). Bandits, Markov decision processes and learning values."
    - who: Simon J. D. Prince
      what: "Understanding Deep Learning (MIT Press, 2023). Reinforcement learning with networks, why deep learning works, and its ethics."
    - who: Christiano et al. (2017), Ouyang et al. (2022), Rafailov et al. (2023)
      what: "The papers behind learning from human preferences, RLHF for language models, and direct preference optimization."
    - who: Kaplan et al. (2020), Hoffmann et al. (2022)
      what: "Scaling laws for language models and compute-optimal training."

levels:
  - id: ch01
    number: 1
    title: "The Deep Learning Revolution"
    blurb: "A light tour: what a machine can learn from examples, a first curve fit that goes wrong in an instructive way, and how to work with an AI partner without trusting it blindly. Guessing is the point."
    lessons:
      - id: ch01-what-can-learn
        title: "What Can a Machine Learn?"
        kind: concept
        summary: "Spotting skin cancer, folding proteins, painting faces, writing text. What these systems share: a flexible function, many examples, and a way to measure error."
      - id: ch01-curve-fit
        title: "Fitting a Curve"
        kind: concept
        summary: "Noisy points from a hidden curve. Fit polynomials of growing degree, watch the training error vanish and the predictions explode, and meet the error function."
      - id: ch01-too-good
        title: "Too Good to Be True"
        kind: concept
        summary: "How do you know a model works on data it has never seen? Regularization, validation sets, cross-validation, and the first rule of data: never peek at the test set."
      - id: ch01-history
        title: "From Perceptrons to Deep Networks"
        kind: concept
        summary: "Seventy years of ideas in one lesson: single-layer networks, backpropagation, depth, and why scale changed everything."
      - id: ch01-ai-partner
        title: "Predict, Then Verify"
        kind: concept
        summary: "An AI assistant writes fluent code and confident claims. How to check them: guess the result first, then test the claim against the data. The skill this course trains."
      - id: ch01-traps
        title: "Intuition Traps"
        kind: traps
        summary: "Fast questions on what people (and chatbots) wrongly believe about learning machines: zero training error, more parameters, accuracy, and data."
      - id: ch01-map
        title: "Content Map: The Deep Learning Revolution"
        kind: map
        summary: "Rebuild the level as a concept map, box by box, and add its row to the problem-and-model table."
      - { id: ch01-review, title: Level Review, kind: review }
      - id: ch01-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems that combine the ideas of the level, including one AI-written result to audit."

  - id: ch02
    number: 2
    title: "Probabilities"
    blurb: "The language of uncertainty: sum and product rules, Bayes' theorem, densities, the Gaussian, maximum likelihood, entropy and the Kullback-Leibler divergence."
    lessons:
      - id: ch02-screening
        title: "The Screening Puzzle"
        kind: concept
        summary: "A test is 90% accurate and your result is positive. Are you probably ill? The sum and product rules, and Bayes' theorem from scratch."
      - id: ch02-densities
        title: "Densities and Expectations"
        kind: concept
        summary: "Probability for continuous quantities: densities, expectations, variance and covariance, and how densities change when you change variables."
      - id: ch02-gaussian-ml
        title: "The Gaussian and Maximum Likelihood"
        kind: concept
        summary: "Fit a bell curve to data by making the data as probable as possible, and find out why the fitted variance comes out too small."
      - id: ch02-ml-least-squares
        title: "Maximum Likelihood Is Least Squares"
        kind: guided
        summary: "Guided proof: Gaussian noise on a curve turns maximum likelihood into minimizing the sum of squared errors."
      - id: ch02-information
        title: "Information: Entropy and KL"
        kind: concept
        summary: "How many bits does a surprise cost? Entropy, maximum entropy, the Kullback-Leibler divergence and mutual information."
      - id: ch02-bayesian
        title: "Bayesian Learning"
        kind: concept
        summary: "Treat the model's parameters as uncertain too. Priors, posteriors, and regularization as a prior in disguise."
      - id: ch02-audit-screening
        title: "Audit: An AI Reads a Test Result"
        kind: guided
        summary: "Guided problem (AI audit): An AI assistant explains a positive test result and gets the base rate wrong. Find the error, fix the reasoning, and compute the right answer."
      - id: ch02-traps
        title: "Intuition Traps"
        kind: traps
        summary: "Base-rate neglect, independence versus zero correlation, densities above one, and other probability traps that catch people and language models alike."
      - id: ch02-intuition
        title: "Intuition Round"
        kind: intuition
        summary: "Quick recall of Bayes' theorem, the Gaussian, entropy and KL: mnemonics, limit checks, build cards and small numbers."
      - id: ch02-map
        title: "Content Map: Probabilities"
        kind: map
        summary: "Rebuild the level as a concept map, box by box, and add its row to the problem-and-model table."
      - { id: ch02-review, title: Level Review, kind: review }
      - id: ch02-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems that combine the ideas of the level, including one AI-written result to audit."

  - id: ch03
    number: 3
    title: "Standard Distributions"
    blurb: "The building blocks of probabilistic models: Bernoulli, binomial and multinomial, the multivariate Gaussian and its conditionals and marginals, the exponential family, and methods that let the data choose the shape."
    lessons:
      - id: ch03-discrete
        title: "Coins, Dice and Counts"
        kind: concept
        summary: "Bernoulli, binomial and multinomial distributions, and what maximum likelihood says after three heads in three tosses."
      - id: ch03-mv-gaussian
        title: "The Multivariate Gaussian"
        kind: concept
        summary: "The bell curve in many dimensions: its geometry, its moments, and where it fails."
      - id: ch03-gaussian-cond
        title: "Conditionals and Marginals of a Gaussian"
        kind: guided
        summary: "Guided proof: slicing or projecting a Gaussian gives a Gaussian, with formulas you can read."
      - id: ch03-gaussian-learning
        title: "Learning a Gaussian From Data"
        kind: concept
        summary: "Maximum likelihood, sequential updates, and Bayes' theorem for Gaussian variables."
      - id: ch03-mixtures-expfam
        title: "Mixtures and the Exponential Family"
        kind: concept
        summary: "Several bumps from one formula, circular data, and the family that unites the standard distributions through sufficient statistics."
      - id: ch03-nonparametric
        title: "Letting the Data Speak"
        kind: concept
        summary: "Histograms, kernel densities and nearest neighbours: models with no fixed shape, and the smoothing knob each one hides."
      - id: ch03-audit-bandwidth
        title: "Audit: An AI Picks a Bandwidth"
        kind: guided
        summary: "Guided problem (AI audit): An AI tunes a kernel density so it fits the training points best. Predict what goes wrong, then check it on held-out data."
      - id: ch03-traps
        title: "Intuition Traps"
        kind: traps
        summary: "Traps about Gaussians in high dimensions, maximum likelihood with tiny data, and nonparametric methods."
      - id: ch03-intuition
        title: "Intuition Round"
        kind: intuition
        summary: "Quick recall of the standard distributions and Gaussian identities."
      - id: ch03-map
        title: "Content Map: Standard Distributions"
        kind: map
        summary: "Rebuild the level as a concept map, box by box, and add its row to the problem-and-model table."
      - { id: ch03-review, title: Level Review, kind: review }
      - id: ch03-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems that combine the ideas of the level, including one AI-written result to audit."

  - id: ch04
    number: 4
    title: "Single-layer Networks: Regression"
    blurb: "Predicting numbers: linear regression with basis functions, the geometry of least squares, regularization, decision theory for regression and the bias-variance trade-off."
    lessons:
      - id: ch04-linear-regression
        title: "Linear Regression With Basis Functions"
        kind: concept
        summary: "A straight line can fit curves if you feed it the right features. Basis functions, the likelihood, and the least-squares solution."
      - id: ch04-normal-equations
        title: "The Normal Equations"
        kind: guided
        summary: "Guided proof: set the gradient of the squared error to zero and find the best weights in one formula, then see it as a projection."
      - id: ch04-regularized
        title: "Regularized Least Squares"
        kind: concept
        summary: "Weight decay in one line of algebra, sequential learning, and several outputs at once."
      - id: ch04-decision-regression
        title: "What Should a Prediction Be?"
        kind: concept
        summary: "Decision theory for regression: why the best guess under squared loss is the conditional mean, and when another loss changes the answer."
      - id: ch04-bias-variance
        title: "The Bias-Variance Trade-off"
        kind: concept
        summary: "Average over many training sets and the error splits into bias, variance and noise. A picture of underfitting and overfitting."
      - id: ch04-honest-splits
        title: "Splitting the Data Honestly"
        kind: concept
        summary: "Training, validation and test sets, leakage, and why every preprocessing step must be learned from the training set only."
      - id: ch04-audit-pipeline
        title: "Audit: An AI's Regression Pipeline"
        kind: guided
        summary: "Guided problem (AI audit): An AI writes a short regression pipeline that scores very well. Order the lines, find the leak, and predict the honest score."
      - id: ch04-traps
        title: "Intuition Traps"
        kind: traps
        summary: "R-squared on training data, extrapolation, scaling before the split, and more traps from AI-written regression code."
      - id: ch04-intuition
        title: "Intuition Round"
        kind: intuition
        summary: "Quick recall of least squares, the regularized solution and the bias-variance decomposition."
      - id: ch04-map
        title: "Content Map: Single-layer Networks: Regression"
        kind: map
        summary: "Rebuild the level as a concept map, box by box, and add its row to the problem-and-model table."
      - { id: ch04-review, title: Level Review, kind: review }
      - id: ch04-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems that combine the ideas of the level, including one AI-written result to audit."

  - id: ch05
    number: 5
    title: "Single-layer Networks: Classification"
    blurb: "Predicting categories: discriminant functions, decision theory with costs, how to measure a classifier, generative and discriminative classifiers, and logistic regression."
    lessons:
      - id: ch05-discriminants
        title: "Drawing a Line"
        kind: concept
        summary: "Discriminant functions for two and many classes, 1-of-K coding, and why least squares makes a poor classifier."
      - id: ch05-decisions
        title: "Decisions Under Costs"
        kind: concept
        summary: "Missing a cancer is worse than a false alarm. Misclassification rate, expected loss, the reject option, and separating inference from decision."
      - id: ch05-measuring
        title: "Measuring a Classifier"
        kind: concept
        summary: "Accuracy, the confusion matrix, precision and recall, and the ROC curve: what each number hides when one class is rare."
      - id: ch05-calibration
        title: "Does 90% Mean 90%?"
        kind: concept
        summary: "Calibration: reliability diagrams, the expected calibration error, why deep networks are often overconfident, and temperature scaling as a fix."
      - id: ch05-generative
        title: "Generative Classifiers"
        kind: concept
        summary: "Model how each class produces its data, then use Bayes' theorem. Gaussian class models, discrete features and the exponential family."
      - id: ch05-logistic
        title: "Logistic Regression"
        kind: concept
        summary: "Model the class probability directly: the logistic sigmoid, softmax for many classes, probit, and canonical link functions."
      - id: ch05-logistic-gradient
        title: "The Gradient of the Cross-entropy"
        kind: guided
        summary: "Guided proof: the error gradient of logistic regression is prediction minus target times input, the same shape as in linear regression."
      - id: ch05-audit-accuracy
        title: "Audit: 99% Accurate?"
        kind: guided
        summary: "Guided problem (AI audit): An AI reports a fraud detector with 99% accuracy on data where 1% of cases are fraud. Read the confusion matrix and decide what the model really does."
      - id: ch05-traps
        title: "Intuition Traps"
        kind: traps
        summary: "Accuracy on imbalanced classes, thresholds, calibrated versus confident, and probabilities that are not probabilities."
      - id: ch05-intuition
        title: "Intuition Round"
        kind: intuition
        summary: "Quick recall of the sigmoid, softmax, cross-entropy and the decision rules."
      - id: ch05-map
        title: "Content Map: Single-layer Networks: Classification"
        kind: map
        summary: "Rebuild the level as a concept map, box by box, and add its row to the problem-and-model table."
      - { id: ch05-review, title: Level Review, kind: review }
      - id: ch05-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems that combine the ideas of the level, including one AI-written result to audit."

  - id: ch06
    number: 6
    title: "Deep Neural Networks"
    blurb: "Why fixed features fail in high dimensions, multilayer networks and what they can represent, learned representations, error functions for each task, and mixture density networks."
    lessons:
      - id: ch06-curse
        title: "The Curse of Dimensionality"
        kind: concept
        summary: "Why a grid of features explodes in many dimensions, how strange high-dimensional spaces are, and why real data lives on thin manifolds."
      - id: ch06-multilayer
        title: "Multilayer Networks"
        kind: concept
        summary: "Let the network learn its own basis functions: hidden units, activation functions, universal approximation and weight-space symmetries."
      - id: ch06-representations
        title: "Deep Networks and Representations"
        kind: concept
        summary: "Depth as a hierarchy of features: distributed representations, transfer learning and contrastive learning."
      - id: ch06-error-functions
        title: "Choosing the Error Function"
        kind: concept
        summary: "The output unit and the error follow from the likelihood: regression, binary and multiclass classification."
      - id: ch06-mdn
        title: "Mixture Density Networks"
        kind: concept
        summary: "A robot arm with two ways to reach one point: when the average answer is wrong, predict a whole distribution."
      - id: ch06-audit-head
        title: "Audit: An AI's Classifier Head"
        kind: guided
        summary: "Guided problem (AI audit): An AI builds a network's last layer and loss. Softmax applied twice, the wrong loss, a sigmoid where a softmax belongs: find and fix them."
      - id: ch06-traps
        title: "Intuition Traps"
        kind: traps
        summary: "Traps about depth, universal approximation, high-dimensional geometry and output layers."
      - id: ch06-intuition
        title: "Intuition Round"
        kind: intuition
        summary: "Quick recall of output units, error functions and parameter counts."
      - id: ch06-map
        title: "Content Map: Deep Neural Networks"
        kind: map
        summary: "Rebuild the level as a concept map, box by box, and add its row to the problem-and-model table."
      - { id: ch06-review, title: Level Review, kind: review }
      - id: ch06-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems that combine the ideas of the level, including one AI-written result to audit."

  - id: x-trees
    eyebrow: Extra level · Trees
    title: "When Not to Use a Neural Network"
    blurb: "Tables of numbers, like medical records or sales data, are often learned best by trees. Decision trees, bagging, random forests and gradient boosting, and how to choose a model for the problem in front of you."
    lessons:
      - id: x-trees-trees
        title: "Decision Trees"
        kind: concept
        summary: "Twenty questions with data: split the inputs one feature at a time, grow the tree greedily, measure purity with the Gini index or entropy, and prune it back."
      - id: x-trees-by-hand
        title: "Grow a Tree by Hand"
        kind: guided
        summary: "Guided problem: choose the first two splits of a tree on a small patient table, computing the error of every candidate split."
      - id: x-trees-forests
        title: "Bagging and Random Forests"
        kind: concept
        summary: "One tree is unstable, many trees average out: the bootstrap, out-of-bag error, and random forests that decorrelate trees by hiding features."
      - id: x-trees-boosting
        title: "Boosting"
        kind: concept
        summary: "Many small trees in sequence, each fixing what the others got wrong: the boosting algorithm, shrinkage, and gradient boosting as gradient descent on functions."
      - id: x-trees-which-model
        title: "Which Model When?"
        kind: concept
        summary: "Tables, images, text and sound: what each model assumes, how much data it needs, how readable it is, and why every project starts with a simple baseline."
      - id: x-trees-audit
        title: "Audit: A Deep Network for a Spreadsheet"
        kind: guided
        summary: "Guided problem (AI audit): An AI trains a large network on 2,000 rows of tabular data, compares it with no baseline, and reads feature importance as cause. Predict what a forest would score and fix the claims."
      - id: x-trees-traps
        title: "Intuition Traps"
        kind: traps
        summary: "Traps about tree depth, why bagging helps, the learning rate of boosting, and what feature importance means."
      - id: x-trees-intuition
        title: "Intuition Round"
        kind: intuition
        summary: "Quick recall of the split criteria, the bagging variance argument and the boosting update."
      - id: x-trees-map
        title: "Content Map: Trees and Ensembles"
        kind: map
        summary: "Rebuild the level as a concept map, box by box, and add its row to the problem-and-model table."
      - { id: x-trees-review, title: Level Review, kind: review }
      - id: x-trees-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems that combine the ideas of the level, including one AI-written result to audit."

  - id: exam-partial1
    eyebrow: Partial exam
    hue: 3
    title: "Partial Exam: Probability and Single-layer Networks"
    blurb: "A timed exam on Levels 2 to 6 and the extra level on trees. No feedback until you submit, then your score and a review of every answer."
    lessons:
      - id: exam-partial1
        title: Partial Exam 1
        kind: exam
        summary: "60 minutes, ten points, about five questions on probability, distributions, regression, classification, deep networks and trees. Answers are checked only when you submit."

  - id: ch07
    number: 7
    title: "Gradient Descent"
    blurb: "How networks are trained: error surfaces, batch and stochastic gradient descent, initialization, momentum, learning-rate schedules, Adam, and normalization."
    lessons:
      - id: ch07-error-surfaces
        title: "Error Surfaces"
        kind: concept
        summary: "A landscape in a million dimensions: local quadratic approximation, minima and saddles, and what the gradient tells you."
      - id: ch07-sgd
        title: "Stochastic Gradient Descent"
        kind: concept
        summary: "Step downhill using a few examples at a time: batch, stochastic and mini-batch descent, and how to initialize."
      - id: ch07-convergence
        title: "Convergence: Ravines and Momentum"
        kind: concept
        summary: "Why gradient descent zigzags in a narrow valley, and how momentum and learning-rate schedules fix it."
      - id: ch07-quadratic-rate
        title: "Gradient Descent on a Bowl"
        kind: guided
        summary: "Guided proof: on a quadratic error, the eigenvalues of the Hessian set the largest safe learning rate and the speed of convergence."
      - id: ch07-adam
        title: "RMSProp and Adam"
        kind: concept
        summary: "A different step size for every weight: the adaptive methods most networks are trained with."
      - id: ch07-normalization
        title: "Normalization"
        kind: concept
        summary: "Data, batch and layer normalization: rescaling so the landscape becomes easier to descend."
      - id: ch07-audit-training
        title: "Audit: Reading a Training Curve"
        kind: guided
        summary: "Guided problem (AI audit): An AI's training run diverges, stalls or oscillates. Read the loss curves and diagnose the learning rate, the scale of the data or a bug."
      - id: ch07-traps
        title: "Intuition Traps"
        kind: traps
        summary: "Traps about learning rates, local minima, batch size and normalization."
      - id: ch07-intuition
        title: "Intuition Round"
        kind: intuition
        summary: "Quick recall of the update rules: plain, momentum, RMSProp, Adam."
      - id: ch07-map
        title: "Content Map: Gradient Descent"
        kind: map
        summary: "Rebuild the level as a concept map, box by box, and add its row to the problem-and-model table."
      - { id: ch07-review, title: Level Review, kind: review }
      - id: ch07-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems that combine the ideas of the level, including one AI-written result to audit."

  - id: ch08
    number: 8
    title: "Backpropagation"
    blurb: "Computing gradients efficiently: the chain rule through a network, backpropagation in general graphs, Jacobians and Hessians, and automatic differentiation."
    lessons:
      - id: ch08-chain-rule
        title: "Gradients by the Chain Rule"
        kind: concept
        summary: "How a change in one weight ripples to the error, and the errors that flow backwards through a network."
      - id: ch08-by-hand
        title: "Backprop by Hand"
        kind: guided
        summary: "Guided problem: one forward pass and one backward pass through a tiny network with real numbers."
      - id: ch08-general
        title: "Backpropagation in General Networks"
        kind: concept
        summary: "The algorithm for any feed-forward network, its cost, and checking it against numerical differentiation."
      - id: ch08-jacobian-hessian
        title: "The Jacobian and the Hessian"
        kind: concept
        summary: "Derivatives of outputs with respect to inputs, and the curvature of the error: what they cost and what they reveal."
      - id: ch08-autodiff
        title: "Automatic Differentiation"
        kind: concept
        summary: "Forward mode and reverse mode: how software computes exact derivatives of any program, and why reverse mode wins for training."
      - id: ch08-audit-gradient
        title: "Audit: An AI's Gradient Check"
        kind: guided
        summary: "Guided problem (AI audit): An AI writes a gradient by hand and a check that passes for the wrong reason. Find the bug in the derivative and in the test."
      - id: ch08-traps
        title: "Intuition Traps"
        kind: traps
        summary: "Traps about the cost of backpropagation, numerical derivatives and the two modes of automatic differentiation."
      - id: ch08-map
        title: "Content Map: Backpropagation"
        kind: map
        summary: "Rebuild the level as a concept map, box by box, and add its row to the problem-and-model table."
      - { id: ch08-review, title: Level Review, kind: review }
      - id: ch08-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems that combine the ideas of the level, including one AI-written result to audit."

  - id: ch09
    number: 9
    title: "Regularization"
    blurb: "How to make a network generalize: inductive bias, symmetry and equivariance, weight decay, learning curves and early stopping, double descent, parameter sharing, residual connections and model averaging."
    lessons:
      - id: ch09-inductive-bias
        title: "Inductive Bias"
        kind: concept
        summary: "No free lunch: every learner bets on some assumptions. Inverse problems, symmetry, invariance and equivariance."
      - id: ch09-weight-decay
        title: "Weight Decay"
        kind: concept
        summary: "Penalize large weights: consistent regularizers and generalized weight decay."
      - id: ch09-learning-curves
        title: "Learning Curves"
        kind: concept
        summary: "Watch training and validation error as training goes on: early stopping, and the surprise of double descent."
      - id: ch09-sharing
        title: "Parameter Sharing"
        kind: concept
        summary: "Tie weights together, softly or exactly, to build in what you already know."
      - id: ch09-residual
        title: "Residual Connections"
        kind: concept
        summary: "Add the input back to the output: why very deep networks become trainable."
      - id: ch09-averaging
        title: "Model Averaging and Dropout"
        kind: concept
        summary: "Many models vote better than one: ensembles, and dropout as a cheap ensemble."
      - id: ch09-audit-overfit
        title: "Audit: Is It Overfitting?"
        kind: guided
        summary: "Guided problem (AI audit): An AI reads a set of learning curves and recommends more parameters, more data or more regularization. Decide which advice is right."
      - id: ch09-audit-shift
        title: "Audit: It Worked in the Lab"
        kind: guided
        summary: "Guided problem (AI audit): A model trained on one hospital's scans fails at another. Covariate shift, label shift and shortcut features: predict which failure happened and how to test for it."
      - id: ch09-traps
        title: "Intuition Traps"
        kind: traps
        summary: "Traps about overfitting, double descent, dropout at test time and early stopping."
      - id: ch09-intuition
        title: "Intuition Round"
        kind: intuition
        summary: "Quick recall of the regularized error, early stopping and residual blocks."
      - id: ch09-map
        title: "Content Map: Regularization"
        kind: map
        summary: "Rebuild the level as a concept map, box by box, and add its row to the problem-and-model table."
