  - id: x-modern
    eyebrow: Extra level · Modern AI
    title: "Using and Auditing Modern AI"
    blurb: "The capstone: how today's language models are scaled, prompted and connected to tools, why they make things up, how to tell whether a benchmark means anything, and how to look inside a model."
    lessons:
      - id: x-modern-scaling
        title: "Scaling Laws"
        kind: concept
        summary: "Loss falls as a power law in parameters, data and compute: what the curves predict, and what they do not."
      - id: x-modern-compute-optimal
        title: "Spend a Compute Budget"
        kind: guided
        summary: "Guided problem: given a fixed amount of compute, choose the model size and the number of training tokens, and compare with models that were trained too short."
      - id: x-modern-in-context
        title: "Learning From the Prompt"
        kind: concept
        summary: "Few-shot examples and chains of thought change the answer without changing a single weight: in-context learning and its limits."
      - id: x-modern-tools
        title: "Retrieval, Tools and Agents"
        kind: concept
        summary: "Give the model a search engine, a calculator or a terminal: retrieval-augmented generation, tool use, agents, and how each one fails."
      - id: x-modern-hallucination
        title: "Why Models Make Things Up"
        kind: concept
        summary: "Hallucinated facts and citations, flattery toward the user, and confidence that does not track accuracy: where each comes from in training."
      - id: x-modern-benchmarks
        title: "Can You Trust the Benchmark?"
        kind: concept
        summary: "Test questions leaked into training data, leaderboards tuned on the test set, and scores that stop measuring what they meant to."
      - id: x-modern-interpretability
        title: "Looking Inside a Model"
        kind: concept
        summary: "Probes, attention maps that do not explain, features stored in superposition, and causal tests that change an activation and watch the output."
      - id: x-modern-fairness
        title: "Bias, Fairness and Harm"
        kind: concept
        summary: "Biased data gives biased models: competing definitions of fairness that cannot all hold at once, and who is affected when a model fails."
      - id: x-modern-audit
        title: "Audit: An AI Agent's Research Report"
        kind: guided
        summary: "Guided problem (AI audit): An AI agent writes a report with a benchmark result, a citation and a chart. Check each claim: contamination, a citation that does not exist, a cherry-picked run."
      - id: x-modern-traps
        title: "Intuition Traps"
        kind: traps
        summary: "Traps about emergent abilities, chain of thought as explanation, retrieval as a cure for errors, and what a probe proves."
      - id: x-modern-intuition
