  - id: x-rewards
    eyebrow: Extra level · Rewards
    title: "Learning From Rewards"
    blurb: "No labels, only a score after acting: reinforcement learning from bandits to policy gradients, and how it turns a language model into an assistant through human preferences, RLHF and DPO."
    lessons:
      - id: x-rewards-bandits
        title: "Explore or Exploit"
        kind: concept
        summary: "Ten slot machines and limited coins: action values, the greedy choice, epsilon-greedy exploration and upper confidence bounds."
      - id: x-rewards-mdp
        title: "Markov Decision Processes"
        kind: concept
        summary: "States, actions, rewards and policies: the return, the discount factor, value functions and the Bellman equation."
      - id: x-rewards-by-hand
        title: "Values by Hand"
        kind: guided
        summary: "Guided problem: compute the state values of a tiny grid world, one Bellman update at a time, and read off the best policy."
      - id: x-rewards-q-learning
        title: "Learning Values From Experience"
        kind: concept
        summary: "No model of the world, only trials: temporal-difference learning, Q-learning, and fitted Q-learning with a neural network."
      - id: x-rewards-policy-gradient
        title: "Policy Gradients"
        kind: guided
        summary: "Guided proof: the gradient of the expected return is the expected reward times the gradient of the log policy, and a baseline lowers its variance (REINFORCE, actor-critic)."
      - id: x-rewards-rlhf
        title: "Learning From Human Preferences"
        kind: concept
        summary: "People compare two answers, a reward model learns their taste, and reinforcement learning with a KL leash tunes the language model: the RLHF pipeline and reward hacking."
      - id: x-rewards-dpo
        title: "Direct Preference Optimization"
        kind: guided
        summary: "Guided proof: the best policy for a KL-regularized reward has a closed form, so the reward model can be skipped and preferences trained on directly."
      - id: x-rewards-reasoning
        title: "Rewards for Reasoning"
        kind: concept
        summary: "Reinforcement learning on problems with checkable answers, like maths and code: why it lengthens chains of thought, and what a correct final answer does not prove."
      - id: x-rewards-audit
        title: "Audit: A Reward That Gets Gamed"
        kind: guided
        summary: "Guided problem (AI audit): An AI designs a reward for a summarizer and claims RLHF made the model truthful. Predict how the reward will be gamed and what the training really optimizes."
      - id: x-rewards-traps
        title: "Intuition Traps"
        kind: traps
        summary: "Traps about exploration, discounting, on- and off-policy learning, and what human feedback can and cannot teach."
      - id: x-rewards-intuition
        title: "Intuition Round"
        kind: intuition
        summary: "Quick recall of the Bellman equation, the Q-learning update, the policy gradient and the DPO loss."
