id: ch09-challenge
title: Level Challenge
kind: challenge
cards:
  - type: text
    id: intro
    title: "Harder: the whole of Level 9 in five problems"
    body: |
      Five problems on **new settings** (not the two levers, the T-maze rat, the eight-subject age line, the voice in noise or the spurious blip of the lessons). They combine what this level taught: how to **fit a model to a subject's behaviour**, compare models by their **evidence**, **pool a group**, and read **false inference** as normal inference with an odd prior. Every number can be checked by hand with a calculator, and every answer comes with the reason. No hint about which formula to use: you recall it.

      The five problems:

      1. A Laplace fit: mode, posterior precision and approximate log evidence.
      2. Designing the analysis of a new experiment.
      3. A group with shrinkage and a Bayes factor.
      4. False inference: when a precise prior wins.
      5. Estimating an aberrant prior in patients and controls.

      Problems 1 to 3 come first, then 4 and 5.

  # ---------------------------------------------------------------- Problem 1
  - type: numeric
    id: p1-mode
    tag: Problem 1 · A Laplace fit
    prompt: |
      **Problem 1.** A scientist fits one parameter $\theta$ of a subject. The log likelihood of the observed choices, as a function of $\theta$, is
      $$\mathcal{L}(\theta)=-1.5\,(\theta-2)^2$$
      The prior on $\theta$ is Gaussian with mean $\eta=0.5$ and precision $\Pi^{(1)}=2$ (precision = inverse variance).

      The Laplace approximation puts the posterior at the mode $\mu$ of $\mathcal{L}(\theta)+\ln P(\theta)$. What is $\mu$?
    answer: 1.4
    tolerance: 0.005
    wrong:
      - { value: 2, feedback: 'That is the peak of the likelihood alone. The prior pulls the mode toward $\eta=0.5$; $\mu$ is a compromise.' }
      - { value: 1.25, feedback: 'That is the plain average of $2$ and $0.5$. The two pulls have different strengths: the likelihood has curvature $3$ and the prior has precision $2$, so the weights are $3$ and $2$, not equal.' }
    explanation: |
      At the mode the gradient of the likelihood balances the pull of the prior:
      $$-3(\mu-2)+2(0.5-\mu)=0$$
      so $5\mu=7$ and $\mu=1.4$. It is a precision-weighted average, $(3\cdot2+2\cdot0.5)/(3+2)$.

  - type: numeric
    id: p1-post
    tag: Problem 1 · A Laplace fit
    prompt: |
      Same fit: $\mathcal{L}(\theta)=-1.5\,(\theta-2)^2$, prior precision $\Pi^{(1)}=2$. What is the posterior precision $\Pi^{\text{post}}$ of the Laplace Gaussian?
    answer: 5
    tolerance: 0.005
    wrong:
      - { value: 3, feedback: 'That is the curvature of $-\mathcal{L}$ alone: the data''s contribution. The prior adds its own precision.' }
      - { value: -1, feedback: 'The sign is wrong. The Hessian of $\mathcal{L}$ is $-3$ and it is **subtracted**, so the data add $+3$ to the prior precision: $2-(-3)$.' }
    explanation: |
      $$\Pi^{\text{post}}=\Pi^{(1)}-\nabla_{\mu\mu}\mathcal{L}(\mu)=2-(-3)=5$$
      Independent pieces of information add their precisions: the prior contributes $2$ and the data $3$. The posterior is sharper than either.

  - type: numeric
    id: p1-evidence
    tag: Problem 1 · A Laplace fit
    prompt: |
      Use the mode $\mu=1.4$ and $\Pi^{\text{post}}=5$ of the same fit, with the prior mean $\eta=0.5$, $\Pi^{(1)}=2$ and $\mathcal{L}(\theta)=-1.5(\theta-2)^2$. Let $\varepsilon=\eta-\mu$. The approximate log evidence is
      $$\mathcal{L}(\mu)-\tfrac12\big(\varepsilon\cdot\Pi^{(1)}\varepsilon+\ln|\Pi^{\text{post}}|\big)$$
      Compute it (two decimals).
    answer: -2.15
    tolerance: 0.02
    wrong:
      - { value: -0.54, feedback: 'That is only $\mathcal{L}(\mu)$, the fit. The log evidence also pays for departing from the prior and for the sharpness of the posterior.' }
      - { value: -0.74, feedback: 'You dropped one of the two penalties (or gave $\varepsilon\cdot\Pi^{(1)}\varepsilon$ the wrong sign). Both are subtracted: $\tfrac12\varepsilon\Pi^{(1)}\varepsilon=0.81$ and $\tfrac12\ln5=0.80$.' }
    explanation: |
      Three pieces:
      $$\mathcal{L}(\mu)=-1.5\,(1.4-2)^2=-0.54$$
      $$\tfrac12\varepsilon\cdot\Pi^{(1)}\varepsilon=\tfrac12\cdot2\cdot(-0.9)^2=0.81$$
      $$\tfrac12\ln5=0.80$$
      Total: $-0.54-0.81-0.80=-2.15$. Fit minus the cost of leaving the prior minus the Occam penalty.

  - type: mcq
    id: p1-sharper
    tag: Problem 1 · A Laplace fit
    prompt: |
      The experiment is repeated with more trials, so the likelihood becomes $\mathcal{L}(\theta)=-3(\theta-2)^2$ (twice the curvature, same peak at $2$), and the prior is unchanged. What happens to $\mu$ and to $\Pi^{\text{post}}$?
    options:
      - text: '$\mu$ moves toward $2$ (it becomes $1.625$) and $\Pi^{\text{post}}$ grows (it becomes $8$).'
        correct: true
      - text: '$\mu$ stays at $1.4$ and only $\Pi^{\text{post}}$ changes.'
        feedback: |
          The mode balances the data's pull against the prior's. Doubling the data's strength changes that balance, so the mode moves toward the likelihood peak.
      - text: '$\mu$ moves toward the prior mean $0.5$, because more data make the model more cautious.'
        feedback: |
          More data give the likelihood more weight, not the prior. The weights are the precisions $6$ and $2$ now, against $3$ and $2$ before.
      - text: '$\Pi^{\text{post}}$ stays at $5$, because it only depends on the prior.'
        feedback: |
          $\Pi^{\text{post}}=\Pi^{(1)}-\nabla_{\mu\mu}\mathcal{L}$ includes the curvature of the likelihood, which doubled: $2+6=8$.
    explanation: |
      Now $-6(\mu-2)+2(0.5-\mu)=0$ gives $\mu=13/8=1.625$, and $\Pi^{\text{post}}=2+6=8$. More informative data pull the estimate to the likelihood peak and sharpen it.

  # ---------------------------------------------------------------- Problem 2
  - type: order
    id: p2-steps
    tag: Problem 2 · A new experiment
    prompt: |
      **Problem 2.** A lab studies how people choose between a **safe card** (always pays $1$) and a **risky deck** (pays $0$ or $4$). They want to know how strongly each participant weighs the payoffs, and whether this changes with the number of years of gambling experience.

      Put the steps of the analysis in order.
    steps:
      - 'Collect each participant''s choices and their years of experience.'
      - 'Formulate a generative model (POMDP) of the task.'
      - 'Specify the likelihood of the choices given the model''s parameters.'
      - 'Specify priors over the parameters.'
      - 'Solve for the posteriors and the evidence of each participant (variational Laplace).'
      - 'Run the group-level analysis (PEB) of the parameter against experience.'
    hint: 'Data first, then the model, then how it produces choices, then what you believe beforehand, then the fit, last the group.'
    explanation: |
      The data come first because the model is built for the task that produced them. The likelihood needs the model, the posterior needs the likelihood and the priors, and the group analysis uses the individual posteriors.

  - type: mcq
    id: p2-prior
    tag: Problem 2 · A new experiment
    prompt: |
      The model says the participant's preferences over outcomes are scaled by a **positive** number written $e^{\theta}$, and the fit is done on $\theta$. Which prior on $\theta$ is a sensible choice?
    options:
      - text: '$\theta\sim\mathcal{N}(0,1)$: it keeps the scale $e^{\theta}$ positive, centres it near $1$ and allows it to be a few times larger or smaller.'
        correct: true
      - text: 'A Gaussian prior on the scale $e^{\theta}$ itself, centred at $1$.'
        feedback: |
          A Gaussian puts mass on negative scales, which would reverse the participant's preferences. Fitting $\theta$ and writing the scale as $e^{\theta}$ is precisely what prevents that.
      - text: '$\theta\sim\mathcal{N}(0,10^4)$, "so the prior has no influence".'
        feedback: |
          A very broad prior is not neutral for model comparison: the Occam penalty $\tfrac12\ln|\Pi^{\text{post}}|$ and the cost of departing from the prior grow when the posterior is much sharper than the prior. It also allows absurd scales like $e^{50}$.
      - text: 'A prior sharply peaked at the value that fits the pilot data.'
        feedback: |
          The prior must be set before seeing the data to be fitted. A prior built on them double counts the data and inflates the evidence.
    explanation: |
      Positivity is built into the parametrisation, and a unit-variance prior on $\theta$ says that the scale is within a factor of about $e^{2}\approx7$ of $1$, which is plausible for a preference scale.

  - type: numeric
    id: p2-prob
    tag: Problem 2 · A new experiment
    prompt: |
      Take a participant with $\theta=0.5$. The model says the probability of choosing the risky deck is
      $$P(\text{risky})=\frac{1}{1+e^{-e^{\theta}d}}$$
      where $d=0.8$ is how much the risky deck is preferred, before scaling. What is $P(\text{risky})$ (three decimals)?
    answer: 0.789
    tolerance: 0.002
    wrong:
      - { value: 0.69, feedback: 'You used the exponent $d=0.8$ without the scale: $1/(1+e^{-0.8})=0.69$. The scale is $e^{\theta}=e^{0.5}=1.649$, so the exponent is $1.319$.' }
      - { value: 0.5, feedback: 'That is the probability for no preference ($d=0$). Here $d>0$ favours the risky deck.' }
    explanation: |
      $e^{0.5}=1.6487$, so the exponent is $1.6487\cdot0.8=1.319$ and
      $$P(\text{risky})=\frac{1}{1+e^{-1.319}}=\frac{1}{1+0.267}=0.789$$

  - type: numeric
    id: p2-lik
    tag: Problem 2 · A new experiment
    prompt: |
      The participant with $\theta=0.5$ has $P(\text{risky})=0.789$ on every trial (so $P(\text{safe})=0.211$). They are observed on three trials and choose **risky, risky, safe**. The log likelihood of the choices is the sum of the log probabilities of each choice, $\mathcal{L}=\sum_t\ln P(u_t\mid\theta)$. Compute it (two decimals).
    answer: -2.03
    tolerance: 0.02
    wrong:
      - { value: 0.131, feedback: 'That is the likelihood $0.789^2\cdot0.211$, not its log. The question asks for $\mathcal{L}=\ln$ of it, which is negative.' }
      - { value: -1.556, feedback: 'That is the term of the safe choice alone. The two risky choices add $2\ln0.789=-0.474$.' }
    explanation: |
      $$\begin{aligned}\mathcal{L}&=2\ln0.789+\ln0.211\\&=2(-0.237)-1.556\\&=-2.03\end{aligned}$$
      Equivalently, the likelihood is $0.789^2\cdot0.211=0.131$ and $\ln0.131=-2.03$.

  - type: mcq
    id: p2-recovery
    tag: Problem 2 · A new experiment
    prompt: |
      Before using real participants, the lab simulates fictive choices with a known $\theta=0.5$, with only $4$ trials, and fits them. The posterior mean comes out at $0.03$ with a posterior standard deviation of $0.95$, almost the prior ($\mathcal{N}(0,1)$). What does this say?
    options:
      - text: 'With so few trials the data barely constrain $\theta$: the design cannot recover the parameter, so it needs more trials (or a more informative design) before real data are collected.'
        correct: true
      - text: 'The fit is correct, because $0.03$ lies within one posterior standard deviation of $0.5$.'
        feedback: |
          The posterior sd is almost the prior sd: the data have barely sharpened anything. Being "within one sd" of the truth is then guaranteed by the prior and shows nothing about the method.
      - text: 'The model is wrong, because it did not return $0.5$.'
        feedback: |
          Recovery is judged against the posterior uncertainty, not the point value. Here the failure is not a wrong model but too little information: the posterior stayed at the prior.
      - text: 'The participants'' real behaviour will be informative anyway, so recovery tests are unnecessary.'
        feedback: |
          Real participants run the same number of trials. If the design cannot recover a parameter with known truth, it cannot with unknown truth either.
    explanation: |
      Parameter recovery with fictive data is a check of the design: if a known parameter is recovered with a narrow posterior, the real estimates can be trusted; if the posterior equals the prior, nothing was learned.

  # ---------------------------------------------------------------- Problem 3
  - type: text
    id: p3-setting
    tag: Problem 3 · A group of eight
    body: |
      **Problem 3.** The same experiment is run on eight participants. For each participant $i$ the first-level fit gave a posterior mean $m_i$ and a standard deviation of the preference-scale parameter $\theta_i$, with $x_i$ the years of experience:

      | $i$ | $x_i$ | $m_i$ | sd |
      |---|---|---|---|
      | 1 | 1 | 0.3 | 0.5 |
      | 2 | 2 | 0.9 | 0.4 |
      | 3 | 3 | 0.4 | 1.0 |
      | 4 | 5 | 1.9 | 0.5 |
      | 5 | 6 | 1.2 | 0.8 |
      | 6 | 8 | 2.0 | 0.4 |
      | 7 | 9 | 2.6 | 0.7 |
      | 8 | 11 | 2.1 | 1.25 |

      The group model is $\theta_i\sim\mathcal{N}(\beta_0+\beta_1x_i,\;1/\Pi^{(2)})$, with $\beta_0=0.4$, $\beta_1=0.2$ and group precision $\Pi^{(2)}=2$. The first-level precision is $\Pi_i=1/\text{sd}^2$ and $\ell_i=\beta_0+\beta_1x_i$ is the group line's prediction.

  - type: numeric
    id: p3-shrunk
    tag: Problem 3 · A group of eight
    prompt: |
      Participant $4$ has $x_4=5$ years, first-level mean $m_4=1.9$ and sd $0.5$ (so $\Pi_4=4$). The group line is $\ell=\beta_0+\beta_1x=0.4+0.2\cdot5$ and $\Pi^{(2)}=2$. The shrunk mean is
      $$\hat m=\frac{\Pi_i\,m+\Pi^{(2)}\,\ell}{\Pi_i+\Pi^{(2)}}$$
      What is $\hat m$ for this participant (three decimals)?
    answer: 1.733
    tolerance: 0.003
    wrong:
      - { value: 1.9, feedback: 'That is the unshrunk first-level mean. Re-reading it under the group prior pulls it toward the line.' }
      - { value: 1.65, feedback: 'That is the plain average of $1.9$ and the line $1.4$. The weights are the precisions $4$ and $2$, not equal.' }
    explanation: |
      $\ell=1.4$, so
      $$\hat m=\frac{4\cdot1.9+2\cdot1.4}{4+2}=\frac{10.4}{6}=1.733$$
      The new precision is $\Pi_i+\Pi^{(2)}=6$. The estimate moved a third of the way toward the line, since the data had twice the weight of the group.

  - type: mcq
    id: p3-moves
    tag: Problem 3 · A group of eight
    prompt: |
      With the table, the line $\ell=0.4+0.2x$ and $\Pi^{(2)}=2$, which of these participants has the estimate that **moves furthest** under shrinkage? (The shift is $\frac{\Pi^{(2)}}{\Pi_i+\Pi^{(2)}}\,|\ell-m|$.)
    options:
      - text: 'Participant 3 ($x=3$, $m=0.4$, sd $1.0$): the line predicts $1.0$, and the shift is $\tfrac{2}{3}\cdot0.6=0.40$.'
        correct: true
      - text: 'Participant 8 ($x=11$, $m=2.1$, sd $1.25$), the least precise of all: the shift is $\tfrac{2}{2.64}\cdot0.5=0.38$.'
        feedback: |
          Participant 8 is the least precise, so it has the largest fraction ($0.76$), but it lies only $0.5$ from the line. Participant 3 has a smaller fraction ($0.67$) but is $0.6$ away: the shift is fraction times distance.
      - text: 'Participant 4 ($x=5$, $m=1.9$, sd $0.5$): it is the furthest from the line in relative terms.'
        feedback: |
          Its precision is high ($4$), so it keeps most of its value: the shift is $\tfrac{2}{6}\cdot0.5=0.17$.
      - text: 'Participant 6 ($x=8$, $m=2.0$, sd $0.4$): it has the highest first-level precision.'
        feedback: |
          Participant 6 lies exactly on the line ($\ell=2.0$), so nothing moves, whatever its precision.
    explanation: |
      The shift is a product of two things: how little you trust the individual ($\Pi^{(2)}/(\Pi_i+\Pi^{(2)})$) and how far it is from the line. Participant 3 has a fraction $0.67$ and a distance $0.6$ (shift $0.40$); participant 8 has $0.76$ and $0.5$ (shift $0.38$).

  - type: numeric
    id: p3-bf
    tag: Problem 3 · A group of eight
    prompt: |
      Now the group model is compared with and without the slope. The log evidence is $\ln E=-21.4$ for the model with the slope $\beta_1$ free, and $\ln E=-24.2$ for the model with $\beta_1=0$. What is the Bayes factor $E_{\text{slope}}/E_{\text{no slope}}$ (one decimal)?
    answer: 16.4
    tolerance: 0.2
    wrong:
      - { value: 2.8, feedback: 'That is the difference of log evidences, $\ln$ of the Bayes factor. The factor itself is its exponential.' }
      - { value: 1.13, feedback: 'You divided the log evidences ($-21.4/-24.2$). Log evidences are subtracted, and the result exponentiated.' }
    explanation: |
      $$\ln\text{BF}=-21.4-(-24.2)=2.8$$
      $$\text{BF}=e^{2.8}=16.4$$

  - type: numeric
    id: p3-post
    tag: Problem 3 · A group of eight
    prompt: |
      Before looking at the data you gave the two models, with and without the slope, equal prior probability $\tfrac12$ each. The Bayes factor is $16.4$. What is the posterior probability of the model with the slope (two decimals)?
    answer: 0.94
    tolerance: 0.005
    wrong:
      - { value: 16.4, feedback: 'A probability cannot exceed $1$; $16.4$ is the ratio of the two models'' posterior probabilities.' }
      - { value: 0.06, feedback: 'That is the posterior probability of the model **without** the slope.' }
    explanation: |
      With equal priors the posterior odds equal the Bayes factor, $16.4:1$, so
      $$P(\text{slope})=\frac{16.4}{1+16.4}=0.94$$

  - type: mcq
    id: p3-read
    tag: Problem 3 · A group of eight
    prompt: |
      The analysis found a Bayes factor of $16.4$ for the slope. Which conclusion is justified?
    options:
      - text: 'The data favour a model in which the parameter changes with experience, over one where it does not; the size of the slope is read from the posterior of $\beta_1$, not from the Bayes factor.'
        correct: true
      - text: 'Each year of experience raises $\theta$ by exactly $0.2$, since the fitted slope is $0.2$.'
        feedback: |
          The value $\beta_1=0.2$ was a given of the exercise; even for a fitted slope, the Bayes factor only says the slope model is better, and the estimate has its own uncertainty.
      - text: 'There is a $16.4\%$ chance that the slope is real.'
        feedback: |
          A Bayes factor is a ratio of evidences, not a percentage. With equal prior odds it corresponds to $94\%$ for the slope model.
      - text: 'The slope is important, so participants with more experience must all lie above the line.'
        feedback: |
          The group model says the *mean* of $\theta_i$ changes with $x_i$; individuals scatter around the line with precision $\Pi^{(2)}$.
    explanation: |
      Model comparison answers "which model explains the group data better, accounting for complexity", and parameter estimation answers "how large". PEB gives both: the evidence for the slope and its posterior.

  # ---------------------------------------------------------------- Problem 4
  - type: numeric
    id: p4-mu
    tag: Problem 4 · A smell in the kitchen
    prompt: |
      **Problem 4.** A cook senses the strength of a smoky smell on a scale from $0$ (nothing) to $5$ (thick smoke). One-level model: the percept $\mu$ predicts the sensation, $g(\mu)=\mu$, and the cook expects, from the hour and the pan on the stove, a prior mean $\eta=4$. The nose delivers $y=1$. The sensory precision is $\Pi_y=3$ and the prior precision is $\Pi_v=1$.

      Free-energy minimisation sets the percept $\mu^*$. What is it?
    answer: 1.75
    tolerance: 0.005
    wrong:
      - { value: 2.5, feedback: 'That is the plain average of $1$ and $4$. The two sources have different precisions, $3$ and $1$, so they are weighted differently.' }
      - { value: 1, feedback: 'That is the sensation alone, which is what the percept would be with no prior at all ($\Pi_v=0$). Here the prior has precision $1$ and pulls the percept up.' }
    explanation: |
      The percept is the precision-weighted average of the sensation and the prior mean:
      $$\mu^*=\frac{\Pi_y\,y+\Pi_v\,\eta}{\Pi_y+\Pi_v}=\frac{3\cdot1+1\cdot4}{3+1}=1.75$$
      The nose is trusted three times more than the expectation, so the percept sits a quarter of the way from $y$ to $\eta$.

  - type: numeric
    id: p4-precise
    tag: Problem 4 · A smell in the kitchen
    prompt: |
      Same cook, same nose ($y=1$, $\Pi_y=3$) and same expectation $\eta=4$, but after a night of worrying about fires the prior has become much more precise, $\Pi_v=12$. What is the percept $\mu^*$ now (one decimal)?
    answer: 3.4
    tolerance: 0.05
    wrong:
      - { value: 1.75, feedback: 'That is the earlier percept, with $\Pi_v=1$. The prior precision has changed, so the weights have changed.' }
      - { value: 2.5, feedback: 'That is the plain average of $1$ and $4$. The weights are $3$ and $12$, and the larger one now belongs to the prior.' }
    explanation: |
      $$\mu^*=\frac{3\cdot1+12\cdot4}{3+12}=\frac{51}{15}=3.4$$
      The sensation is unchanged and almost "smoke-free", yet the percept is close to the expected thick smoke. Only a precision changed, not the inference rule.

  - type: mcq
    id: p4-both
    tag: Problem 4 · A smell in the kitchen
    prompt: |
      Keep $\eta=4$ for the prior mean, and let the prior be precise, $\Pi_v=12$, with $\Pi_y=3$. (a) The nose reports $y=1$ and the percept is $3.4$. (b) Now there really is a thick smoke, $y=4$, but suppose the prior mean had been $\eta=0$ ("nothing is burning"): the percept is $\mu^*=(3\cdot4+12\cdot0)/15=0.8$. What do (a) and (b) have in common?
    options:
      - text: 'In both the percept is dominated by the prior rather than by the senses: in (a) it invents smoke the nose barely reports, in (b) it hides smoke that the nose reports. Too precise a prior makes internally generated percepts resist conflicting input.'
        correct: true
      - text: 'In both the senses win, so the percept is accurate; the prior only matters when $\Pi_y=0$.'
        feedback: |
          With $\Pi_v=12$ against $\Pi_y=3$, the prior has four times the weight. The percepts $3.4$ and $0.8$ are far from the data $1$ and $4$.
      - text: 'Only (a) is a false inference; in (b) the percept is simply the cautious, correct answer.'
        feedback: |
          In (b) there is a thick smoke ($y=4$) and the percept says almost nothing. That is as much a false inference as (a): the percept does not follow the evidence, because the prior is too strong.
      - text: 'They show that the inference rule is broken: the precision-weighted average should never be used when the prior is precise.'
        feedback: |
          The rule is the same in both. What differs is the weights, and for a precise prior the rule correctly returns a percept close to the prior.
    explanation: |
      A hallucination as false perceptual inference can come from an imbalance of precisions in either direction: too much sensory precision overinterprets noisy input; too much prior precision makes the percept resist conflicting input, either by adding something the data do not show (a) or by hiding something they do (b).

  - type: numeric
    id: p4-delusion
    tag: Problem 4 · A smell in the kitchen
    prompt: |
      A toy for a belief that resists evidence. A person holds a strong belief, with prior mean $\eta=5$ and prior precision $\Pi_v=50$ on the same scale. A fresh observation says $y=0$, with sensory precision $\Pi_y=2$. Using the same rule, what is the percept $\mu^*$ (two decimals)?
    answer: 4.81
    tolerance: 0.01
    wrong:
      - { value: 0, feedback: 'That would be believing the observation completely. With $\Pi_v=50$ against $\Pi_y=2$ the prior holds almost all the weight.' }
      - { value: 2.5, feedback: 'That is the equal-weight average. The weights are $2$ and $50$.' }
    explanation: |
      $$\mu^*=\frac{2\cdot0+50\cdot5}{2+50}=\frac{250}{52}=4.81$$
      The evidence moves the belief by only $0.19$ of the $5$ units it contradicts. The inference is perfectly normal; what is aberrant is the prior precision. This is the sense in which computational models describe such conditions: normal inference, aberrant priors.

  # ---------------------------------------------------------------- Problem 5
  - type: numeric
    id: p5-shrunk
    tag: Problem 5 · Patients and controls
    prompt: |
      **Problem 5.** A lab measures how precisely each participant holds a prior, through the parameter $\theta_i$ of their model ($\Pi_v=e^{\theta_i}$, so $\theta_i$ is a real number). There are $6$ patients and $6$ controls. The group variable is $x_i=1$ for a patient and $0$ for a control, and the group model is
      $$\theta_i\sim\mathcal{N}(\beta_0+\beta_1x_i,\;1/\Pi^{(2)})$$
      with $\beta_0=0.3$, $\beta_1=0.8$ and $\Pi^{(2)}=4$.
      One patient has a first-level posterior mean $m=1.6$ with standard deviation $0.4$, so $\Pi_i=1/0.4^2=6.25$. Under the group model this patient is re-estimated as the precision-weighted combination of $m$ and the line value $\ell=\beta_0+\beta_1x$. What is the shrunk mean (three decimals)?
    answer: 1.405
    tolerance: 0.003
    wrong:
      - { value: 1.6, feedback: 'That is the unshrunk first-level mean. Under the group model it is pulled toward the line value.' }
      - { value: 0.3, feedback: 'You used the line of the controls ($x=0$). This is a patient, $x=1$, so $\ell=0.3+0.8=1.1$.' }
    explanation: |
      For a patient $\ell=0.3+0.8\cdot1=1.1$, and
      $$\hat m=\frac{\Pi_i\,m+\Pi^{(2)}\,\ell}{\Pi_i+\Pi^{(2)}}$$
      $$=\frac{6.25\cdot1.6+4\cdot1.1}{6.25+4}=\frac{14.4}{10.25}=1.405$$
      The patient is measured well, so the estimate moves only a little (by $0.195$) toward the patient line.

  - type: numeric
    id: p5-bf
    tag: Problem 5 · Patients and controls
    prompt: |
      The group level is run twice on all twelve participants: with the group variable (model "group effect", $\beta_1$ free) and without it (model "no group effect", $\beta_1=0$). The difference of log evidences is
      $$\ln E_{\text{group}}-\ln E_{\text{no group}}=3.2$$
      What is the Bayes factor $E_{\text{group}}/E_{\text{no group}}$ (one decimal)?
    answer: 24.5
    tolerance: 0.1
    wrong:
      - { value: 3.2, feedback: 'That is the log of the Bayes factor. The factor is its exponential.' }
      - { value: 0.96, feedback: 'That is the posterior probability of the group-effect model under equal prior odds, not the ratio.' }
    explanation: |
      $$\text{BF}=e^{3.2}=24.5$$
      With equal prior odds that is a posterior probability of $24.5/25.5=0.96$ for the model with a group effect.

  - type: mcq
    id: p5-claim
    tag: Problem 5 · Patients and controls
    prompt: |
      The Bayes factor is $24.5$ in favour of a group effect on the prior-precision parameter $\theta$ (patients higher). Which statement is supported by this analysis?
    options:
      - text: 'In this model of the task, the patients'' behaviour is better explained by a more precise prior than the controls'', accounting for model complexity. It is evidence for a difference in a parameter of the subject model, estimated without invasive measurement.'
        correct: true
      - text: 'The patients have a damaged brain region that holds the prior.'
        feedback: |
          The analysis only fits a parameter of a generative model to behaviour. It says nothing about which neural structure implements it, nor about damage.
      - text: 'Every patient has a more precise prior than every control.'
        feedback: |
          The group model compares means: individuals scatter around the group line with precision $\Pi^{(2)}$, and a Bayes factor does not say there is no overlap.
      - text: 'The result proves that the condition is caused by aberrant priors and could be treated by changing them.'
        feedback: |
          A better-fitting model is evidence for a description, not proof of cause, and it gives no treatment. It also depends on the task and on the model chosen.
    explanation: |
      Computational models of pathology are stories of aberrant priors, and the pipeline turns one into a testable estimate: a parameter per subject and a group comparison. The claim is bounded by the task, the model and the evidence; it is a hypothesis about the subject's own generative model.

  - type: mcq
    id: p5-pipeline
    tag: Problem 5 · Patients and controls
    prompt: |
      A reviewer worries that the estimates of $\theta_i$ are unreliable. Which step of the analysis does the worry concern, and which check addresses it?
    options:
      - text: 'The inversion step (the fit of each subject). Check it with fictive data: simulate choices from the model with known $\theta$ and see whether the fit recovers it (parameter recovery), and whether the model produces sensible behaviour (face validity).'
        correct: true
      - text: 'The group-level step. Check it by adding more controls until the Bayes factor exceeds $100$.'
        feedback: |
          Collecting data until the evidence passes a threshold does not test the reliability of the individual estimates, which is a question about the first level.
      - text: 'The data collection. Check it by asking the patients whether their prior is precise.'
        feedback: |
          The parameter belongs to the model of the behaviour and is not something a subject can report. The check is on the model, with simulated data of known truth.
      - text: 'The choice of the prior of the group level. Check it by raising $\Pi^{(2)}$ until the shrunk means all lie on the line.'
        feedback: |
          Raising $\Pi^{(2)}$ forces the estimates onto the line and so hides the problem instead of testing it.
    explanation: |
      Reliability of the per-subject estimates is a property of the inversion with its priors and likelihood. Simulating with known parameters tests recovery; checking that the model makes sensible behaviour is face validity. Only then do the group comparisons mean something.

  - type: text
    id: final-summary
    title: "What you now own: fitting models to behaviour"
    body: |
      **Variational Laplace.** A subject has parameters $\theta$ with prior $\mathcal{N}(\eta,\Pi^{(1)})$ (mean $\eta$, precision $\Pi^{(1)}$); the data are choices $\tilde u$, with log likelihood $\mathcal{L}(\theta)=\ln P(\tilde u\mid\theta,\tilde o,m)$. The posterior is Gaussian with the mode $\mu$ of $\mathcal{L}+\ln P(\theta)$ and precision
      $$\Pi^{\text{post}}=\Pi^{(1)}-\nabla_{\mu\mu}\mathcal{L}(\mu)$$
      With $\varepsilon=\eta-\mu$, the approximate log evidence (fit minus complexity) is
      $$\ln P(\tilde u\mid m)\approx\mathcal{L}(\mu)-\tfrac12\big(\varepsilon\cdot\Pi^{(1)}\varepsilon+\ln|\Pi^{\text{post}}|\big)$$

      **The pipeline.** Collect data; build a generative model (POMDP) of the task; write the likelihood of the choices; set the priors; invert the model for each subject (posterior and evidence); run the group level. Check it on fictive data: parameter recovery and face validity.

      **Group level (PEB).** With $x_i$ a covariate (age, or a group variable), the subject parameters follow
      $$\theta_i\sim\mathcal{N}(\beta_0+\beta_1x_i,\;1/\Pi^{(2)})$$
      Each subject, measured with mean $m_i$ and precision $\Pi_i$, is shrunk toward the line value $\ell_i=\beta_0+\beta_1x_i$:
      $$\hat m_i=\frac{\Pi_i\,m_i+\Pi^{(2)}\,\ell_i}{\Pi_i+\Pi^{(2)}}$$
      A hypothesis such as "there is a group effect" is a Bayes factor of evidences,
      $$\ln\text{BF}=\ln E_{\beta_1\text{ free}}-\ln E_{\beta_1=0}$$

      **False inference.** In a one-level model with $g(\mu)=\mu$, sensation $y$ and prior mean $\eta$, the percept is
      $$\mu^*=\frac{\Pi_y\,y+\Pi_v\,\eta}{\Pi_y+\Pi_v}$$
      Computational pathologies are told as aberrant priors with normal inference: an overly precise prior ($\Pi_v\gg\Pi_y$) makes percepts resist the data, and overly precise sensation overinterprets noise. The pipeline estimates such a precision as a parameter, such as $\Pi_v=e^{\theta}$, and compares groups.

      **Next:** the final chapter, *Active Inference as a Unified Theory of Sentient Behavior*, steps back from the models to the whole: predictive processing, action, decision theories, rationality and emotion, attention and learning, seen as one account.
