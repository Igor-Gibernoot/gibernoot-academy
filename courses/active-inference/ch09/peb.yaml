id: ch09-peb
title: "Parametric Empirical Bayes: Inference Across a Group"
kind: concept
own: |
  - **Two levels.** Fit each subject $i$ separately (first level): this gives a Gaussian posterior over that subject's parameter $\theta_i$ (for example the precision of prior preferences), with mean $m_i$ and precision $\Pi_i$ (inverse variance). The group question is asked at a second level: treat the $\theta_i$ as if they were generated by a general linear model with explanatory variables $X$ (one row per subject, one column per variable) and effect sizes $\beta$:
    {{ $$P(\theta\mid\beta,X)=\mathcal{N}\big(X\beta,\ \Pi^{(2)}\big)$$ }}
    where $\Pi^{(2)}$ is the **precision** (not the variance) of the subject-to-subject scatter around the line.
  - **Reading $X$ and $\beta$.** The first column of $X$ is all ones, so $\beta_0$ is the **average** value of the parameter over subjects; the second column holds, say, each subject's age $x_i$, so $\beta_1$ is the **slope** of parameter against age. For subject $i$ the group model predicts
    {{ $$\beta_0+\beta_1x_i$$ }}
  - **Shrinkage.** Once the group model is fitted, each subject's estimate is re-read under the group prior. With $\ell_i=\beta_0+\beta_1x_i$ the group prediction, the new mean and precision are
    {{ $$\hat m_i=\frac{\Pi_i\,m_i+\Pi^{(2)}\,\ell_i}{\Pi_i+\Pi^{(2)}},\qquad \Pi_i+\Pi^{(2)}$$ }}
    a precision-weighted average: imprecisely measured subjects are pulled toward the group line, precisely measured ones barely move.
  - **Does age matter?** Give $\beta$ priors, and compare the evidence for a model in which $\beta_1$ is free with the evidence for one with a **precise belief that $\beta_1=0$**. Bayesian model reduction does this from the fitted model, without refitting every subject. The log of the ratio of evidences (a log Bayes factor) says how much the data favour a slope, namely
    {{ $$\ln\frac{P(\text{data}\mid\beta_1\text{ free})}{P(\text{data}\mid\beta_1=0)}$$ }}
    positive means evidence for an effect of age.
  - **The pipeline.** Collect behaviour and group covariates, formulate a POMDP, specify the likelihood, specify priors, solve for posteriors and evidence (variational Laplace), then do the group-level analysis with PEB. Toy check: age 20, individual estimate $m=1.2$ with $\Pi_i=1.5625$, group line $\ell=0.7$, $\Pi^{(2)}=3$: shrunk mean $0.871$.
cards:
  - type: text
    id: hook
    title: "Ten volunteers, ten noisy numbers"
    body: |
      Last time we learned to fit one volunteer: from that person's choices we get a Gaussian posterior over a parameter $\theta$ of their generative model, a **mean** (the best estimate) and a **precision** (how sharply the data pin it down).

      Now an experimenter runs the task on several volunteers aged 20 to 67 and fits each one separately. The parameter is the **precision of prior preferences**: how strongly the volunteer wants the preferred outcome. Each volunteer yields one estimate with its own error bar. Some are precise (a long, clean session), some are sloppy.

      The scientific question lives at the **group level**: *does the precision of preferences change with age?* Before any formula, guess: how would you answer it from these ten numbers?

  - type: mcq
    id: why-not-correlate
    prompt: |
      Each of several volunteers has an estimated preference precision (a dot) and an error bar. A colleague proposes: "Ignore the bars, compute the ordinary correlation between the dots and the ages." What is wrong with that?
    options:
      - text: 'It treats a sloppy estimate and a precise one as equally trustworthy, throwing away the uncertainty each first-level fit already computed.'
        correct: true
      - text: 'A correlation can only be computed for discrete variables such as age groups.'
        feedback: |
          A correlation works for continuous variables. The problem is not the type of the data but that the dots are not equally reliable.
      - text: 'The first-level fits are always exactly correct, so nothing needs to be done.'
        feedback: |
          They are Gaussian approximations with finite precision. That is why each one carries an error bar.
    explanation: |
      A volunteer with a huge error bar should count for little in a group conclusion, and a precise one for a lot. The second-level model will weight subjects by their precisions, and it will also tell us how much of the scatter is **real** difference between people and how much is measurement noise.

  - type: text
    id: eq-9-5
    title: "A second model, for the parameters themselves"
    body: |
      The trick is to treat the fitted parameters **as if they were data generated by a second model**. Write $\theta$ for the vector of parameters of all subjects (one entry per subject) and propose a general linear model:

      $$P(\theta\mid\beta,X)=\mathcal{N}\big(X\beta,\ \Pi^{(2)}\big)$$

      Define every piece:

      - $X$ is a **matrix of explanatory variables**: one row per subject, one column per variable. The first column is all ones; the second might be each subject's age $x_i$.
      - $\beta$ is the **vector of effect sizes**, one entry per column of $X$.
      - $\Pi^{(2)}$ is the **precision** of the Gaussian (the superscript $(2)$ says "second level"; recall that a precision is an inverse variance, so a large $\Pi^{(2)}$ means the subjects lie tightly around the line).
      - $X\beta$ is the **mean**: row $i$ of $X\beta$ is the group model's prediction for subject $i$.

      Fitting it needs priors on $\beta$ too. The model is called **parametric empirical Bayes**: the first-level posteriors play the role of data, and the second level supplies priors for them.

  - type: mcq
    id: beta-meaning
    prompt: |
      Take $X$ with a first column of ones and a second column holding the ages $x_i$, so that subject $i$'s predicted parameter is $\beta_0+\beta_1x_i$. What do $\beta_0$ and $\beta_1$ mean?
    options:
      - text: '$\beta_0$ is the average parameter over subjects (the column of ones); $\beta_1$ is the slope of parameter against age, the effect of age.'
        correct: true
      - text: '$\beta_0$ is the age of the youngest subject; $\beta_1$ is the age of the oldest.'
        feedback: |
          Ages live in $X$, not in $\beta$. The entries of $\beta$ are effect sizes, one per explanatory variable.
      - text: '$\beta_0$ is the precision $\Pi^{(2)}$ and $\beta_1$ is the error bar of a subject.'
        feedback: |
          The scatter around the line is $\Pi^{(2)}$, a separate parameter of the second-level model. The $\beta$ entries describe the line itself.
    explanation: |
      The column of ones multiplies $\beta_0$ in every row, so it adds the same baseline for everybody. The age column multiplies $\beta_1$, so the prediction rises by $\beta_1$ for each extra year. If $\beta_1=0$, age does not matter.

  - type: widget
    id: line-widget
    widget: peb-regression
    config:
      subjects:
        - { x: 20, m: 1.2, sd: 0.8 }
        - { x: 25, m: 1.9, sd: 0.5 }
        - { x: 31, m: 1.4, sd: 1.0 }
        - { x: 38, m: 2.6, sd: 0.45 }
        - { x: 44, m: 2.3, sd: 0.9 }
        - { x: 52, m: 3.4, sd: 0.6 }
        - { x: 60, m: 3.1, sd: 0.4 }
        - { x: 67, m: 4.0, sd: 0.9 }
      xRange: [15, 72]
      yRange: [0, 5]
      beta0: -0.5
      beta1: 0.06
      pi2: 3
      beta0Range: [-3, 3]
      beta1Range: [-0.1, 0.15]
      pi2Range: [0.2, 20]
      shrink: false
      labels:
        x: '\text{age}'
    body: |
      Eight volunteers: each dot is a subject's estimated preference precision $\theta$ against age, the bar is one standard deviation of its first-level posterior. The red line is the group model $\beta_0+\beta_1x$. Drag $\beta_1$: the line tilts. Drag $\Pi^{(2)}$ (the group precision): the readout of evidence changes, because a very large $\Pi^{(2)}$ demands that every dot sits exactly on the line. Try to find the settings where the line runs through the cloud and the scatter looks right.

  - type: mcq
    id: widget-reading
    review: false
    prompt: |
      Eight subjects' estimates rise roughly linearly with age, each with an error bar. You set the group slope $\beta_1$ to $0.06$ (precision units per year) and the group precision $\Pi^{(2)}$ very large (say $20$). The dots clearly scatter around the line by more than their error bars allow. What should happen to the evidence for the model?
    options:
      - text: 'It drops: a large $\Pi^{(2)}$ claims that subjects deviate from the line only by a tiny amount, which the dots contradict. A smaller $\Pi^{(2)}$ fits better.'
        correct: true
      - text: 'It rises, because a larger precision always means a better model.'
        feedback: |
          Precision is a claim about how tightly the data cluster. Claiming more precision than the data have is penalised: the model is confidently wrong.
      - text: 'It does not change, because $\Pi^{(2)}$ is only a display setting.'
        feedback: |
          $\Pi^{(2)}$ is a parameter of the second-level model: it sets how far a subject may sit from the line, and so how probable the observed scatter is.
    explanation: |
      The probability of seeing a dot far from the line is tiny if the group precision is large. The data prefer a $\Pi^{(2)}$ that matches the real subject-to-subject scatter, which is what the second level estimates.

  - type: build
    id: build-xbeta
    prompt: |
      Row $i$ of $X$ is $(1,\ x_i)$, where $x_i$ is the age of subject $i$, and $\beta=(\beta_0,\beta_1)$. Build the group model's predicted mean for subject $i$, the $i$-th entry of $X\beta$.
    prefix: '(X\beta)_i ='
    tiles: ['\beta_0', '+', '\beta_1', 'x_i', '\Pi^{(2)}']
    answers:
      - ['\beta_0', '+', '\beta_1', 'x_i']
      - ['\beta_1', 'x_i', '+', '\beta_0']
    wrong:
      - answer: ['\beta_0', '+', '\Pi^{(2)}', 'x_i']
        feedback: |
          $\Pi^{(2)}$ is the precision of the scatter, not an effect size. The age is multiplied by $\beta_1$.
    hint: 'Row times column: $1\cdot\beta_0+x_i\cdot\beta_1$.'
    explanation: |
      Multiplying the row $(1,x_i)$ by the column $(\beta_0,\beta_1)^{\mathsf T}$ gives $1\cdot\beta_0+x_i\cdot\beta_1$.

  - type: numeric
    id: predict-theta
    prompt: |
      A second-level model has $\beta_0=-0.5$ and $\beta_1=0.06$ per year of age (the parameter is the preference precision). What parameter value does it predict for a subject aged $x=40$?
    answer: 1.9
    tolerance: 0.001
    wrong:
      - { value: 2.4, feedback: 'That is only $\beta_1x=0.06\cdot40$. Add the baseline $\beta_0=-0.5$ too.' }
    hint: 'Evaluate $\beta_0+\beta_1x$.'
    explanation: |
      $-0.5+0.06\cdot40=-0.5+2.4=1.9$. This is the **mean** of the Gaussian for that subject; the actual subject may deviate by an amount set by $\Pi^{(2)}$.

  - type: widget
    id: shrink-widget
    widget: peb-regression
    config:
      subjects:
        - { x: 20, m: 1.2, sd: 0.8 }
        - { x: 25, m: 1.9, sd: 0.5 }
        - { x: 31, m: 1.4, sd: 1.0 }
        - { x: 38, m: 2.6, sd: 0.45 }
        - { x: 44, m: 2.3, sd: 0.9 }
        - { x: 52, m: 3.4, sd: 0.6 }
        - { x: 60, m: 3.1, sd: 0.4 }
        - { x: 67, m: 4.0, sd: 0.9 }
      xRange: [15, 72]
      yRange: [0, 5]
      beta0: -0.5
      beta1: 0.06
      pi2: 3
      beta0Range: [-3, 3]
      beta1Range: [-0.1, 0.15]
      pi2Range: [0.2, 20]
      shrink: true
      labels:
        x: '\text{age}'
    title: "Shrinkage: the group improves each subject"
    body: |
      The group model also feeds back. A noisy subject's estimate is not the last word: the **other** subjects tell us what is typical at that age. Switch **shrinkage** on and off (the faded dot is the original estimate, the teal dot is its re-estimate under the group prior). Drag $\Pi^{(2)}$ from small to large. Which dots move most, and in which direction?

  - type: numeric
    id: shrunk-mean
    prompt: |
      A subject has a first-level estimate with mean $m=1.2$ and precision $\Pi_i=1.5625$ (an sd of $0.8$). The group line predicts $\ell=0.7$ for this subject's age, with group precision $\Pi^{(2)}=3$. The subject's re-estimate under the group prior is the precision-weighted average
      $$\hat m=\frac{\Pi_i\,m+\Pi^{(2)}\,\ell}{\Pi_i+\Pi^{(2)}}$$
      What is $\hat m$?
    answer: 0.8712
    tolerance: 0.001
    wrong:
      - { value: 0.95, feedback: 'That is the plain average of $1.2$ and $0.7$. The weights are the precisions $1.5625$ and $3$, not equal.' }
      - { value: 1.2, feedback: 'That would be no shrinkage at all, which happens only if $\Pi^{(2)}=0$.' }
    hint: 'Numerator $1.5625\cdot1.2+3\cdot0.7=1.875+2.1$; denominator $1.5625+3$.'
    explanation: |
      $\hat m=\dfrac{1.875+2.1}{4.5625}=\dfrac{3.975}{4.5625}\approx0.871$. The new precision is $\Pi_i+\Pi^{(2)}=4.5625$, higher than before: borrowing strength from the group sharpens the estimate. Since $\Pi^{(2)}=3$ is larger than $\Pi_i$, the estimate moved most of the way toward $0.7$.

  - type: mcq
    id: shrink-who
    prompt: |
      Two subjects of the same age both lie $0.5$ above the group line. One has a first-level precision of $\Pi_i=1$ (sloppy), the other $\Pi_i=6$ (precise). The group precision is $\Pi^{(2)}=3$. Under shrinkage, which moves further toward the line?
    options:
      - text: 'The sloppy one: its fraction of the way is $\Pi^{(2)}/(\Pi_i+\Pi^{(2)})=3/4$, against $3/9=1/3$ for the precise one.'
        correct: true
      - text: 'The precise one, because it has the larger precision.'
        feedback: |
          Precision of the individual estimate is the weight on the **estimate itself**. The more precise it is, the more the estimate is trusted and the less it moves.
      - text: 'Both move the same, because both are the same distance from the line.'
        feedback: |
          The distance is the same but the weights are not. The estimate moves by the fraction $\Pi^{(2)}/(\Pi_i+\Pi^{(2)})$ of that distance, which depends on $\Pi_i$.
    explanation: |
      Rewrite $\hat m=\ell+\dfrac{\Pi_i}{\Pi_i+\Pi^{(2)}}(m-\ell)$: the estimate keeps the fraction $\Pi_i/(\Pi_i+\Pi^{(2)})$ of its distance from the line. A subject you know little about is pulled to what the group predicts; a subject you know well keeps its own value.

  - type: text
    id: model-reduction
    title: "Does age matter?"
    body: |
      Now the scientific question. Does age affect the precision of preferences? In the model above that is the question whether $\beta_1$ differs from zero. We answer it by comparing **two models** with the evidence:

      - a model where $\beta_1$ is allowed to deviate from zero (a prior with some width), and
      - a model with a **precise belief that $\beta_1=0$** (a prior squeezed to zero).

      Having fitted the first, the evidence of the second follows **without refitting every subject**: this shortcut is called Bayesian model reduction (a reduced model differs from the full one only by a tighter prior). The log ratio of the two evidences is a **log Bayes factor**: positive means the data favour the slope, negative means they favour "no age effect".

      The widget shows both numbers in nats (the natural-log unit of information): the evidence of the group model with the slope you set, the evidence of the best flat model, and their difference. This uses flat priors on $\beta$, so there is no penalty for the extra parameter; it only shows how the fit compares.

  - type: widget
    id: evidence-widget
    widget: peb-regression
    config:
      subjects:
        - { x: 20, m: 1.2, sd: 0.8 }
        - { x: 25, m: 1.9, sd: 0.5 }
        - { x: 31, m: 1.4, sd: 1.0 }
        - { x: 38, m: 2.6, sd: 0.45 }
        - { x: 44, m: 2.3, sd: 0.9 }
        - { x: 52, m: 3.4, sd: 0.6 }
        - { x: 60, m: 3.1, sd: 0.4 }
        - { x: 67, m: 4.0, sd: 0.9 }
      xRange: [15, 72]
      yRange: [0, 5]
      beta0: -0.5
      beta1: 0.06
      pi2: 3
      beta0Range: [-3, 3]
      beta1Range: [-0.1, 0.15]
      pi2Range: [0.2, 20]
      shrink: false
      labels:
        x: '\text{age}'
      presets:
        - { label: 'Given line', beta0: -0.5, beta1: 0.06, pi2: 3, shrink: false }
        - { label: 'Best slope', fit: both }
        - { label: 'Best flat line', fit: flat }
    body: |
      With the preset **Given line** read the readouts: evidence with the slope free, evidence with the slope fixed to zero, and their difference. Then press **Best slope** and **Best flat line** and watch how the difference changes. Set $\beta_1$ by hand to $0$: what is the difference?

  - type: numeric
    id: bayes-factor
    prompt: |
      For eight subjects, a group model with a free slope has log evidence $-8.4994$ nats, and the model with a precise belief that $\beta_1=0$ has $-10.0683$ nats. What is the log Bayes factor (free minus zero)?
    answer: 1.5689
    tolerance: 0.01
    wrong:
      - { value: -1.5689, feedback: 'The sign is reversed. The log Bayes factor is $\ln E_{\text{free}}-\ln E_{\text{zero}}$, free first.' }
    hint: 'Subtract the log evidences; do not divide them.'
    explanation: |
      $-8.4994-(-10.0683)=1.5689$. Evidences multiply, so their **logarithms subtract**. The ratio of evidences is $e^{1.5689}\approx4.8$: the data are about five times more probable if age has this effect.

  - type: mcq
    id: bf-reading
    prompt: |
      After pressing **Best slope**, the free-slope log evidence exceeds the zero-slope log evidence by about $3.0$ nats. What do you conclude?
    options:
      - text: 'The data favour a nonzero age effect: they are about $e^{3}\approx20$ times more probable with a free slope than with a precise zero slope.'
        correct: true
      - text: 'Age explains $3\%$ of the variance of the parameter.'
        feedback: |
          A difference of log evidences is a ratio of probabilities of the data, not a variance fraction.
      - text: 'The slope is exactly $3.0$ per year.'
        feedback: |
          The slope $\beta_1$ is read from its own slider (here about $0.05$ per year). The difference of evidences measures how much better the model with a slope explains the data.
    explanation: |
      A log Bayes factor of $3$ is a ratio of about $20$ to $1$. It says that fixing the slope to zero loses a lot of explanatory power; it does not give the size of the effect, which is the posterior of $\beta_1$ itself.

  - type: mcq
    id: misconceptions
    prompt: |
      Which statement about the two-level scheme is right?
    options:
      - text: 'The first-level posteriors enter the second level **with their precisions**, so a poorly measured subject counts for little.'
        correct: true
      - text: 'Shrinkage biases every subject toward the group and so should be avoided when comparing individuals.'
        feedback: |
          Shrinkage is the Bayes-optimal re-estimate when the group prior is itself estimated from the data. It reduces the total error even though it moves individual estimates.
      - text: 'The second-level model needs the raw choices of all subjects at once.'
        feedback: |
          It only needs each subject's posterior (mean and precision) and their covariates, so each first-level fit can be done separately.
      - text: 'A slope $\beta_1$ larger than zero proves that age causes the change.'
        feedback: |
          The model compares evidence for an association between age and the parameter in these subjects; it says nothing about causes.
    explanation: |
      The scheme is hierarchical: individual fits, then a regression on them that weights by precision, then a feedback that sharpens the individual fits. The group question is answered by model evidence, not by a threshold on a point estimate.

  - type: order
    id: six-steps
    prompt: Put the six steps of a model-based analysis of choice behaviour in order.
    steps:
      - 'Collect the choices and the stimuli, plus group covariates such as age or patient versus control.'
      - 'Formulate a POMDP as a function from parameters to a fully specified model.'
      - 'Specify the likelihood: run the model to get the probability of the observed actions.'
      - 'Specify priors on the parameters, as expectations and precisions.'
      - 'Solve for each subject''s posterior and evidence (variational Laplace).'
      - 'Do the group-level analysis with parametric empirical Bayes.'
    hint: 'Each step needs the output of the one before it; the group analysis needs the individual fits.'
    explanation: |
      Data first; then a model that can be run for any parameters; the likelihood built on it; priors; individual inference; finally the second level, which needs every subject's posterior. The experiment can be repeated across animals or interventions, and the same pipeline applies.

  - type: text
    id: summary
    body: |
      **Next:** we will walk through this pipeline on a concrete experiment from start to end, deciding at each of the six steps what to write down.
