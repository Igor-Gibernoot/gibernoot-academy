outroTitle: Level 7 in one picture
outro: |
  **Perception.** An HMM has hidden states $s_\tau$ with likelihood $\mathbf A$, transitions $\mathbf B$ and prior $\mathbf D$; beliefs update from three messages,

  $$\begin{aligned}\dot{\mathbf v}_\tau&=\ln\mathbf A\cdot o_\tau+\ln(\mathbf B\mathbf s_{\tau-1})\\&\quad+\ln(\mathbf B^\dagger\mathbf s_{\tau+1})-\ln\mathbf s_\tau\end{aligned}$$

  **Planning.** Policies $\pi$ are scored by habit $\mathbf E$, the free energy $\mathbf F$ of the data seen and the expected free energy $\mathbf G$ of the outcomes to come, with $G=-\text{epistemic}-\text{pragmatic}$, equivalently ambiguity plus risk:

  $$\boldsymbol\pi=\sigma\big(\ln\mathbf E-\mathbf F-\gamma\,\mathbf G\big)$$

  **Learning and depth.** Dirichlet counts learn the likelihood and add a novelty term to $G$; a precision $\omega$ multiplies a log prior, $\sigma(\omega\ln\mathbf D)$; a slow higher level sets the prior of a fast lower level from its predicted outcomes.

  **Next:** the level challenge. Five harder problems that combine these pieces: a model of a new creature, the policy scores, a learning step and a two-level reading.
