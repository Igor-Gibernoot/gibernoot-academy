outroTitle: Level 10 in one picture
outro: |
  **Perception and action.** A creature with hidden cause $\mu$, prior mean $\eta$ and data $y$ weighs the data and the prior by their precisions; action is the same descent on $u$:

  $$\mu^*=\frac{\Pi_y\,y+\Pi_v\,\eta}{\Pi_y+\Pi_v}$$

  $$\dot u=\Pi_v\,(\eta-\mu)$$

  **Decision.** Not a value function but the expected free energy $G$ of each policy $\pi$, mixed with the habit prior $E$ and the free energy $F$:

  $$P(\pi)=\sigma(\ln E-F-G)$$

  **Attention, salience, learning.** Attention is the sensory precision $\Pi_y$; salience is the information gain inside $G$; and the trade-off is always

  $$F=\text{complexity}-\text{accuracy}$$
