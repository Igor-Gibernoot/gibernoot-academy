id: ch10-challenge
title: Level Challenge
kind: challenge
cards:
  - type: text
    id: intro
    title: "Harder: the whole of Level 10 in five problems"
    body: |
      Five problems on **new settings** (not the toy arm, the corridor, the shop-or-walk creature, the thermostat or the gaze shelf of the lessons). They combine what this level taught: **perception and action as the same descent**, **precision as attention**, **expected free energy** for choosing policies, **habit, perseveration and deliberation** mixed in one rule, and **homeostasis, salience and learning**. Every number can be checked by hand with a calculator, and every answer comes with the reason. No hint about which formula to use: you recall it.

      The five problems:

      1. An arm that moves: belief, prediction error and the reflex rate.
      2. Choosing a policy with expected free energy: risk, ambiguity and softmax.
      3. Habit against deliberation: one rule, three components.
      4. A homeostat that anticipates.
      5. Attention, salience and learning.

      Problems 1 to 3 come first, then 4 and 5.

  # ---------------------------------------------------------------- Problem 1
  - type: numeric
    id: p1-mu
    tag: Problem 1 · An arm that moves
    prompt: |
      **Problem 1.** A creature holds its arm at a sensed (proprioceptive) angle $y=4$. Its generative model predicts the sensed angle as $g(\mu)=\mu$, where $\mu$ is its belief about the angle. A descending prior has mean $\eta=10$ (the creature expects to see its arm at $10$). Precisions: $\Pi_y=1$ for the senses and $\Pi_v=4$ for the prior. The free energy is
      $$F=\tfrac12\Pi_y\,\epsilon_y^2+\tfrac12\Pi_v\,\epsilon_v^2$$
      with $\epsilon_y=y-g(\mu)$ and $\epsilon_v=\mu-\eta$. While the arm is held still ($y$ fixed), the belief settles at the minimum of $F$. What is $\mu$?
    answer: 8.8
    tolerance: 0.01
    wrong:
      - { value: 7, feedback: 'That is the plain average of $4$ and $10$. The two sources have different precisions ($1$ and $4$), so the prior counts four times more than the senses.' }
      - { value: 4, feedback: 'That is the sensed value: it would be the answer if the prior had no precision. The prior here is the more precise of the two and drags the belief toward $\eta$.' }
    explanation: |
      Setting $\partial F/\partial\mu=0$ gives a precision-weighted average:
      $$\mu=\frac{\Pi_y\,y+\Pi_v\,\eta}{\Pi_y+\Pi_v}=\frac{4+40}{5}=8.8$$

  - type: numeric
    id: p1-udot
    tag: Problem 1 · An arm that moves
    prompt: |
      Same creature: $y=4$, $g(\mu)=\mu$, $\eta=10$, $\Pi_y=1$, $\Pi_v=4$, belief settled at $\mu=8.8$. The signal $u$ sent to the reflex arc changes the sensed angle with $\partial y/\partial u=1$, and $u$ descends the same free energy. What is the rate $\dot u$?
    answer: 4.8
    tolerance: 0.01
    wrong:
      - { value: -4.8, feedback: 'The magnitude is right but the sign is not. $\dot u=-\partial F/\partial u$ and $\partial F/\partial u=\Pi_y\epsilon_y=-4.8$ (the sensed angle is **below** the prediction), so $\dot u$ is positive: the arm is driven up.' }
      - { value: 1.2, feedback: 'That is $\eta-\mu$ alone. The reflex rate carries a precision: how strongly the prior insists.' }
    explanation: |
      $\epsilon_y=4-8.8=-4.8$, so
      $$\dot u=-\frac{\partial y}{\partial u}\,\Pi_y\,\epsilon_y=4.8$$
      At rest the belief balances the two errors, $\Pi_y\epsilon_y=\Pi_v\epsilon_v$, so the same number is also $\Pi_v(\eta-\mu)=4\cdot1.2=4.8$. The prior's prediction is not a command: the reflex arc turns the sensory error into movement.

  - type: numeric
    id: p1-weak
    tag: Problem 1 · An arm that moves
    prompt: |
      The prior becomes imprecise: $\Pi_v=0.25$, with $y=4$, $\eta=10$, $\Pi_y=1$ and $g(\mu)=\mu$. Once the belief has settled, what is the reflex rate $\dot u$ (again with $\partial y/\partial u=1$)?
    answer: 1.2
    tolerance: 0.01
    wrong:
      - { value: 4.8, feedback: 'That is the rate for the precise prior $\Pi_v=4$. The belief now yields to the senses ($\mu=5.2$), so the mismatch with the prediction that action can discharge is much smaller.' }
      - { value: 1.5, feedback: 'That is $\Pi_v(\eta-y)=0.25\cdot6$, using the sensed value instead of the settled belief. The error that matters is $\eta-\mu$, and $\mu$ has moved to $5.2$.' }
    explanation: |
      $\mu=(4+2.5)/1.25=5.2$ and
      $$\dot u=\Pi_v(\eta-\mu)=0.25\cdot4.8=1.2$$
      A quarter of the earlier rate: an imprecise prior is revised by the senses, so little remains to be discharged by movement.

  - type: mcq
    id: p1-read
    tag: Problem 1 · An arm that moves
    prompt: |
      A creature has a belief $\mu$, a prior mean $\eta$ far from the sensed value $y$, and moves only if $\dot u$ is large. Which description fits an arm that actually **starts** to move toward $\eta$?
    options:
      - text: 'The prior is precise against the senses ($\Pi_v$ large against $\Pi_y$): the belief stays near $\eta$ despite the conflicting senses, and the reflex discharges the error.'
        correct: true
      - text: 'The senses are precise and the prior imprecise: the creature trusts what it feels, so it feels the need to move.'
        feedback: |
          Then the belief simply follows the senses ($\mu\approx y$), the conflict disappears into perception and nothing is left to drive the reflex.
      - text: 'The prior sends a motor command $u$ directly, and the senses play no role.'
        feedback: |
          The descending signal is a prediction, not a command. The movement comes from the reflex arc acting on the sensory prediction error.
      - text: 'The creature must first learn the exact inverse model that maps the target to a motor command.'
        feedback: |
          In active inference the generative (forward) model does the work and the inverse model shrinks to a simple reflex, with $\dot u=-(\partial y/\partial u)\,\Pi_y\epsilon_y$.
    explanation: |
      A precise prior keeps $\mu$ near $\eta$, so the senses keep disagreeing with the prediction; the sensory error is the one that action can remove by making the prediction true. This is why starting a movement also needs a transient sensory attenuation, turning $\Pi_y$ down.

  # ---------------------------------------------------------------- Problem 2
  - type: text
    id: p2-setting
    tag: Problem 2 · Choosing a policy
    body: |
      **Problem 2.** A foraging creature has two possible outcomes (call them *fruit* and *nothing*) and prefers fruit: its preferred distribution over outcomes is
      $$C=(0.6,\,0.4)$$
      It considers three policies. For each, its predicted outcome distribution $Q(\tilde y\mid\pi)$ and the **ambiguity** (the expected entropy of the likelihood under the policy) are:

      | Policy | $Q(\tilde y\mid\pi)$ | Ambiguity |
      |---|---|---|
      | A: stay in the open | $(0.6,\,0.4)$ | $0.5$ |
      | B: look under the leaves | $(0.9,\,0.1)$ | $0.1$ |
      | C: follow the stream | $(0.3,\,0.7)$ | $0.2$ |

      The expected free energy is $G(\pi)=\text{ambiguity}+\text{risk}$, and $P(\pi)=\sigma(-\gamma G(\pi))$.

  - type: numeric
    id: p2-risk
    tag: Problem 2 · Choosing a policy
    prompt: |
      Preferred outcomes $C=(0.6,0.4)$. Under policy B the creature predicts $Q=(0.9,0.1)$. What is the **risk** of B, in nats (natural logarithm, three decimals)?
    answer: 0.226
    tolerance: 0.002
    wrong:
      - { value: 0.311, feedback: 'You took the divergence the other way round, $D_{KL}[C\,\|\,Q]$. The risk is $D_{KL}[Q(\tilde y\mid\pi)\,\|\,P(\tilde y\mid C)]$: the predicted outcomes first, weighted by $Q$.' }
      - { value: 0.3, feedback: 'The risk is a Kullback-Leibler divergence $\sum_i Q_i\ln(Q_i/C_i)$, not a difference of probabilities.' }
    explanation: |
      $$\begin{aligned}
      \text{risk}&=0.9\ln\tfrac{0.9}{0.6}+0.1\ln\tfrac{0.1}{0.4}\\
      &=0.3649-0.1386=0.226
      \end{aligned}$$
      Policy A has risk $0$ (its prediction equals the preference); policy C has risk $0.184$.

  - type: numeric
    id: p2-g
    tag: Problem 2 · Choosing a policy
    prompt: |
      Policy B has ambiguity $0.1$ and risk $0.226$. Policy C has ambiguity $0.2$ and risk $0.184$. Policy A has ambiguity $0.5$ and risk $0$. What is the expected free energy $G$ of the policy with the **lowest** $G$ (three decimals)?
    answer: 0.326
    tolerance: 0.002
    wrong:
      - { value: 0.5, feedback: 'That is policy A: zero risk, but its ambiguity is large. Its outcomes tell the creature little about the hidden state, and $G$ counts that.' }
      - { value: 0.384, feedback: 'That is policy C ($0.2+0.184$). Policy B has the smaller sum.' }
    explanation: |
      $$\begin{aligned}
      G(A)&=0.5+0=0.500\\
      G(B)&=0.1+0.226=0.326\\
      G(C)&=0.2+0.184=0.384
      \end{aligned}$$
      $G$ is minimised, so B is the best policy.

  - type: mcq
    id: p2-why
    tag: Problem 2 · Choosing a policy
    prompt: |
      Policy A predicts exactly the preferred outcomes ($Q=C$), yet the creature does not rank it first. Why?
    options:
      - text: 'Its risk is zero, but its ambiguity is high: the outcomes it would meet are uninformative about the hidden state, and expected free energy also rewards policies that reduce uncertainty.'
        correct: true
      - text: 'Because a risk of zero is impossible: the KL divergence is always positive.'
        feedback: |
          The KL divergence is zero when the two distributions are equal. A risk of zero means the predicted outcomes match the preferences.
      - text: 'Because preferred outcomes are never chosen by the creature.'
        feedback: |
          Preferences are exactly what the risk term encodes; policies whose predicted outcomes fit them are favoured, other things equal.
      - text: 'Because $G$ is maximised, not minimised.'
        feedback: |
          $G$ is minimised, and the rule $P(\pi)=\sigma(-\gamma G)$ with the minus sign makes low $G$ more probable.
    explanation: |
      Expected free energy balances a pragmatic part (risk, fit to the preferences) and an epistemic part (ambiguity, the uncertainty that remains). Looking under the leaves is a little off the preferred mix, but it is far more informative.

  - type: numeric
    id: p2-prob
    tag: Problem 2 · Choosing a policy
    prompt: |
      With $G(A)=0.5$, $G(B)=0.326$, $G(C)=0.384$ and precision $\gamma=4$, what is $P(B)=\sigma(-\gamma G)_B$ (the softmax over the three policies; two decimals)?
    answer: 0.44
    tolerance: 0.005
    wrong:
      - { value: 0.33, feedback: 'That is the uniform value $1/3$: it is what the softmax gives for $\gamma=0$. Here $\gamma=4$ and the $G$ values differ.' }
      - { value: 0.74, feedback: 'That is $P(B)$ for a much larger precision, $\gamma=20$. With $\gamma=4$ the differences between the $G$ values are only mildly amplified.' }
    explanation: |
      The exponents are $-4G=(-2.000,\,-1.305,\,-1.535)$, so
      $$P(B)=\frac{e^{-1.305}}{e^{-2.000}+e^{-1.305}+e^{-1.535}}=0.436$$
      with $P(A)=0.22$ and $P(C)=0.35$.

  - type: mcq
    id: p2-gamma
    tag: Problem 2 · Choosing a policy
    prompt: |
      The same three policies are scored with $\gamma=0$ and then with $\gamma=20$. Which statement is right?
    options:
      - text: 'At $\gamma=0$ all three policies are equally probable ($1/3$ each); at $\gamma=20$ policy B takes about $74\%$ and A almost none.'
        correct: true
      - text: 'At $\gamma=0$ the creature always picks the lowest $G$; at $\gamma=20$ it picks at random.'
        feedback: |
          Reversed. $\gamma$ multiplies $G$ inside the softmax: zero precision makes $G$ irrelevant (uniform), large precision makes the choice nearly deterministic.
      - text: 'The probabilities do not depend on $\gamma$; it only rescales $G$ itself.'
        feedback: |
          $\gamma$ is the precision over policies: it sets how sharply the softmax separates them. It is a surrogate for the expected change of $F$ (a good policy has been found).
      - text: 'At $\gamma=20$ policy A is the most probable, since its risk is zero.'
        feedback: |
          A has the highest $G$ ($0.5$) because of its ambiguity, so a high precision makes it the **least** probable.
    explanation: |
      For $\gamma=20$ the probabilities are $(0.023,\,0.742,\,0.235)$. A high $\gamma$ (linked to dopamine and to motivation) expresses confidence that a good policy has been found.

  # ---------------------------------------------------------------- Problem 3
  - type: text
    id: p3-setting
    tag: Problem 3 · Habit against deliberation
    body: |
      **Problem 3.** A commuter chooses among three routes $\pi_1,\pi_2,\pi_3$. The habit prior $E$ (the prior probability of each route before looking at today's situation), the variational free energy $F$ of the route (how well today's observations fit it) and the expected free energy $G$ are:

      | Route | $E$ | $F$ | $G$ |
      |---|---|---|---|
      | $\pi_1$: the usual road | $0.7$ | $0.1$ | $1.0$ |
      | $\pi_2$: the new bridge | $0.2$ | $0.5$ | $0.4$ |
      | $\pi_3$: the back lane | $0.1$ | $0.3$ | $0.9$ |

      The probability of a route is a softmax of a sum of the three components: habit, perseveration and deliberation.

  - type: build
    id: p3-rule
    tag: Problem 3 · Habit against deliberation
    prompt: |
      Build the exponent that the softmax receives for each route, so that $P(\pi)=\sigma(\,\cdot\,)$. Here $E$ is the habit prior, $F$ the variational free energy and $G$ the expected free energy.
    prefix: 'P(\pi)=\sigma('
    suffix: ')'
    tiles: ['\ln E', '-F', '-G', '+G', '+F', 'E']
    answers:
      - ['\ln E', '-F', '-G']
      - ['\ln E', '-G', '-F']
      - ['-F', '\ln E', '-G']
      - ['-F', '-G', '\ln E']
      - ['-G', '\ln E', '-F']
      - ['-G', '-F', '\ln E']
    wrong:
      - answer: ['\ln E', '+F', '-G']
        feedback: 'The sign of $F$ is wrong. Observations that fit the current course of action (low $F$) make it persist, so $F$ enters with a minus sign, like $G$.'
      - answer: ['E', '-F', '-G']
        feedback: 'The habit enters through its logarithm: probabilities multiply, and the softmax exponentiates, so $\ln E$ gives back $E$ as a prior weight.'
    hint: 'Both free energies are minimised, so both lower the probability of a route when large; the prior multiplies, so it enters through its logarithm.'
    explanation: |
      $$P(\pi)=\sigma(\ln E-F-G)$$
      $G$ is the deliberative part, $F$ the perseverative part and $E$ the habitual part.

  - type: numeric
    id: p3-p1
    tag: Problem 3 · Habit against deliberation
    prompt: |
      A commuter has habit priors $E=(0.7,0.2,0.1)$, variational free energies $F=(0.1,0.5,0.3)$ and expected free energies $G=(1.0,0.4,0.9)$ for three routes. What is the probability of the **usual road**, route $1$ (two decimals)?
    answer: 0.68
    tolerance: 0.005
    wrong:
      - { value: 0.32, feedback: 'That is the probability of route $1$ if the habit is ignored, $\sigma(-F-G)$. Here the habit prior $E_1=0.7$ adds $\ln 0.7$ to its exponent while the others get smaller values.' }
      - { value: 0.7, feedback: 'That is just the habit prior $E_1$. The deliberative and perseverative parts also act: route $1$ has a large $G=1.0$.' }
    explanation: |
      The exponents $\ln E-F-G$ are
      $$\begin{aligned}
      \pi_1&:\ -0.357-0.1-1.0=-1.457\\
      \pi_2&:\ -1.609-0.5-0.4=-2.509\\
      \pi_3&:\ -2.303-0.3-0.9=-3.503
      \end{aligned}$$
      so $P=(0.676,\,0.236,\,0.087)$: the habit outweighs a worse $G$.

  - type: mcq
    id: p3-nohabit
    tag: Problem 3 · Habit against deliberation
    prompt: |
      Habit priors $E=(0.7,0.2,0.1)$, free energies $F=(0.1,0.5,0.3)$ and $G=(1.0,0.4,0.9)$. With the habit term **removed** (only $-F-G$ in the softmax), the probabilities become $(0.32,\,0.39,\,0.29)$. What does this tell the commuter's tutor?
    options:
      - text: 'Deliberation alone prefers the new bridge (lowest $G$), but the habit prior tips the combined choice to the usual road: the components coexist and are added in one rule.'
        correct: true
      - text: 'The commuter has two separate systems, and the habitual one has overridden the rational one.'
        feedback: |
          That is the dual-system picture. Here there is one scheme: the three components enter one softmax and are traded off continuously.
      - text: 'The bridge is bad because its $F$ is larger than that of the usual road.'
        feedback: |
          $F$ is only one part ($0.5$ against $0.1$). Without the habit the bridge is still the most probable route, because of its much lower $G$.
      - text: 'Removing the habit makes the choice random.'
        feedback: |
          The three probabilities $(0.32,0.39,0.29)$ are close but not equal; the free energies still discriminate between the routes.
    explanation: |
      Which component dominates depends on experience and on the resources available for deliberation: with strong habits the usual plan dominates even when it is not the best by $G$.

  - type: numeric
    id: p3-rut
    tag: Problem 3 · Habit against deliberation
    prompt: |
      Years of repetition make the habit overwhelming: $E=(0.98,0.01,0.01)$, with the same $F=(0.1,0.5,0.3)$ and $G=(1.0,0.4,0.9)$. What is the probability of the usual road now (two decimals)?
    answer: 0.98
    tolerance: 0.005
    wrong:
      - { value: 0.68, feedback: 'That was the value for the weaker habit $E_1=0.7$. With $E_1=0.98$ and the other two at $0.01$, $\ln E$ differs by about $4.6$ between the routes, which dwarfs the differences in $F+G$.' }
      - { value: 0.32, feedback: 'That is the probability with the habit ignored. Here the habit is dominant.' }
    explanation: |
      The exponents are
      $$\begin{aligned}
      \pi_1&:\ -0.020-0.1-1.0=-1.120\\
      \pi_2&:\ -4.605-0.5-0.4=-5.505\\
      \pi_3&:\ -4.605-0.3-0.9=-5.805
      \end{aligned}$$
      so $P(\pi_1)=0.979$. The habit is an almost fixed prior: the agent sticks to the usual road however good the bridge is. The $F$ and $G$ terms still matter, but only a very large $G$ would break the rut.

  # ---------------------------------------------------------------- Problem 4
  - type: numeric
    id: p4-error
    tag: Problem 4 · A homeostat that anticipates
    prompt: |
      **Problem 4.** A desert tortoise senses its body water through interoception (sensing the inside of the body). Its viable range is a **prior over interoceptive observations** centred on a set-point of $70$ (percent of ideal hydration). Its belief is held at that set-point, $\mu=70$, and the model predicts the sensation as $g(\mu)=\mu$. After a dry week the sensed value is $y=62$. What is the interoceptive prediction error $\epsilon_y=y-g(\mu)$?
    answer: -8
    wrong:
      - { value: 8, feedback: 'The magnitude is right but the sign is not: the error is $y-g(\mu)$, sensed minus predicted, and the tortoise is below its prediction.' }
      - { value: 132, feedback: 'That adds the two numbers. A prediction error is a difference: sensed minus predicted.' }
    explanation: |
      $$\epsilon_y=y-g(\mu)=62-70=-8$$
      The negative sign says the body is drier than predicted. An autonomic reflex (for instance seeking water, or conserving it) acts to cancel this error, as a motor reflex cancels a proprioceptive one.

  - type: mcq
    id: p4-allostasis
    tag: Problem 4 · A homeostat that anticipates
    prompt: |
      The tortoise smells rain far away and walks to a burrow with a pool **before** its hydration drops, and its model raises the set-point it will defend after the trip. Which description fits, and why?
    options:
      - text: '**Allostasis**: it acts before an error appears, using predictions, and may change the prior over interoceptive observations in advance.'
        correct: true
      - text: '**Homeostasis**: the reflex corrects the error $\epsilon_y$ once the sensed value has left its range.'
        feedback: |
          Homeostasis reacts after the sensed value leaves its range. Here no error exists yet when the tortoise moves; it acts on a prediction.
      - text: 'Neither: a prior over observations cannot change, only the sensed value $y$ changes.'
        feedback: |
          Priors over interoceptive observations are part of the generative model and can be adjusted in advance (as cardiac output is raised before a long run). That is the allostatic part.
      - text: '**Allostasis**, because the tortoise has stopped minimising free energy while it travels.'
        feedback: |
          It is still descending free energy. Anticipating means the descent uses predicted error before the actual error is large, not that the descent stops.
    explanation: |
      Homeostasis is reactive (correct $\epsilon_y$ after it appears); allostasis is predictive (act, and adjust the interoceptive priors, before it appears).

  - type: numeric
    id: p4-dfdt
    tag: Problem 4 · A homeostat that anticipates
    prompt: |
      Back at the dry moment, the sensory precision is $\Pi_y=0.25$ and the belief sits exactly at the set-point, so the free energy is $F=\tfrac12\Pi_y\,\epsilon_y^2$ with $\epsilon_y=-8$ (so $F=8$). The tortoise drinks for $5$ minutes; its sensation becomes $y=68$ (with $\mu=70$, $g(\mu)=\mu$). What is the average rate of change $dF/dt$ over those $5$ minutes, in units of $F$ per minute?
    answer: -1.5
    wrong:
      - { value: -7.5, feedback: 'That is the total change $F_{\text{end}}-F_{\text{start}}$. A rate divides by the elapsed time.' }
      - { value: 1.5, feedback: 'The size is right but $F$ fell, so the rate is negative.' }
    explanation: |
      With $\epsilon_y=68-70=-2$ the free energy is $\tfrac12\cdot0.25\cdot4=0.5$, so
      $$\frac{dF}{dt}\approx\frac{0.5-8}{5}=-1.5$$
      per minute.

  - type: mcq
    id: p4-valence
    tag: Problem 4 · A homeostat that anticipates
    prompt: |
      With the rate $dF/dt=-1.5$ of the drinking tortoise, which statement follows from the **proposal** that valence is read off the rate of change of $F$?
    options:
      - text: 'Free energy is falling, so the proposal gives **positive** valence. If valence had been negative while it was dehydrated and rose to positive on drinking, the proposal names that change **relief** (from low to high valence).'
        correct: true
      - text: 'Free energy is falling, so valence is **negative**: lower free energy means a smaller reward.'
        feedback: |
          The proposal ties negative valence to $dF/dt>0$ (free energy rising), not to a low value of $F$. A falling $F$ gives positive valence.
      - text: 'Valence is read off the value of $F$ itself: $F=0.5$ is small, so valence is zero.'
        feedback: |
          The proposal uses the **rate of change** of $F$, not its level. The same level can come with either sign, depending on whether $F$ is rising or falling.
      - text: 'The proposal is a proven law: any creature with $dF/dt<0$ feels positive emotion.'
        feedback: |
          It is a proposal for how valence may be computed, not an established law. Richer states such as relief or disappointment would need second time-derivatives.
    explanation: |
      Proposal: $dF/dt>0$ gives negative valence and $dF/dt<0$ positive valence. Relief is a change from low to high valence; disappointment is the opposite change.

  # ---------------------------------------------------------------- Problem 5
  - type: numeric
    id: p5-mu
    tag: Problem 5 · Attention, salience and learning
    prompt: |
      **Problem 5.** A sailor judges the wind from the sails ($y=9$). Her prior mean is $\eta=3$ with precision $\Pi_v=2$, and the model predicts $g(\mu)=\mu$. With free energy $F=\tfrac12\Pi_y\epsilon_y^2+\tfrac12\Pi_v\epsilon_v^2$, the belief settles at the minimum of $F$. She first treats the sails as imprecise ($\Pi_y=1$), then attends to them ($\Pi_y=4$). By how much does the settled belief $\mu^*$ move toward the data?
    answer: 2
    wrong:
      - { value: 7, feedback: 'That is $\mu^*$ after attending, not the shift. Subtract the value for $\Pi_y=1$ ($\mu^*=5$).' }
      - { value: 3, feedback: 'That would be the move if she moved all the way to the data. The prior still counts with $\Pi_v=2$, so the belief stops short.' }
    explanation: |
      Attention is the precision of the sensory input, and
      $$\mu^*=\frac{\Pi_y\,y+\Pi_v\,\eta}{\Pi_y+\Pi_v}$$
      gives $\mu^*=(9+6)/3=5$ for $\Pi_y=1$ and $\mu^*=(36+6)/6=7$ for $\Pi_y=4$. The belief moves by $2$ toward $y=9$.

  - type: mcq
    id: p5-salience
    tag: Problem 5 · Attention, salience and learning
    prompt: |
      The sailor must now decide where to look next: the horizon or the sails. Which statement keeps **attention** and **salience** apart correctly?
    options:
      - text: 'Attention is the precision $\Pi_y$ she gives to a channel she already has (how much it weighs in updating $\mu$). Salience is the expected information gain of a **policy**, such as turning her gaze, a term inside $G$: $G=-\text{information gain}-\text{pragmatic value}$.'
        correct: true
      - text: 'Attention and salience are the same quantity: both are the precision $\Pi_y$.'
        feedback: |
          They are often conflated because precise data are unambiguous, so they deserve attention and the actions that obtain them are salient. But precision belongs to beliefs about input; information gain belongs to a policy.
      - text: 'Salience is the pragmatic value in $G$: how well the outcome matches the preferences $C$.'
        feedback: |
          Pragmatic value is the other term of $G$. Salience is the epistemic term, the expected information gain.
      - text: 'A policy with a larger information gain has a larger $G$, so it is less likely to be chosen.'
        feedback: |
          $G$ is minimised and the information gain enters it with a minus sign, so more gain makes $G$ smaller and the policy more probable, through $P(\pi)=\sigma(-\gamma G)$.
    explanation: |
      Attention: a precision on already-measured data (gain control). Salience: the information-gain term of $G$ for the action that will acquire new data. Analogy: attention picks the best of what was measured; salience designs the next experiment.

  - type: numeric
    id: p5-counts
    tag: Problem 5 · Attention, salience and learning
    prompt: |
      The sailor learns the likelihood of a barometer reading $i$ given the hidden state $j$ = "a front is coming". The Dirichlet counts of that column, for the readings (falling, steady, rising), are $(a_{1j},a_{2j},a_{3j})=(3,1,2)$. She then sees the reading "rising" ($i=3$) in this state three more times, each time adding one to its count, $a_{ij}\leftarrow a_{ij}+1$. What is the expected likelihood $a_{3j}/a_{0j}$ of "rising" given a front, with $a_{0j}=\sum_i a_{ij}$? Give a decimal.
    answer: 0.5556
    tolerance: 0.001
    wrong:
      - { value: 0.3333, feedback: 'That is the value before learning ($2/6$). The counts changed: "rising" now has $5$ and the column total is $9$.' }
      - { value: 0.625, feedback: 'That divides by $8$, forgetting that the total $a_{0j}$ grew by $3$ as well: the column is $(3,1,5)$ with total $9$.' }
    explanation: |
      The column becomes $(3,1,5)$ and $a_{0j}=9$, so
      $$\frac{a_{3j}}{a_{0j}}=\frac59\approx0.556$$

  - type: mcq
    id: p5-structure
    tag: Problem 5 · Attention, salience and learning
    prompt: |
      Adding counts to the columns of the likelihood of a **fixed** model is one kind of learning. Which of the following is instead **structure learning**?
    options:
      - text: 'Discovering a hidden rule that explains several observations at once (a latent cause), such as one weather front that explains both the barometer and the cloud pattern.'
        correct: true
      - text: 'Changing $a_{3j}$ from $2$ to $5$ after seeing a reading three times.'
        feedback: |
          That is parameter learning: the model keeps its structure and only the counts (the likelihood values) change.
      - text: 'Raising $\Pi_y$ when the sails are inspected.'
        feedback: |
          That is attention, a change of precision within inference, not learning a new model.
      - text: 'Lowering $\gamma$ after a bad outcome.'
        feedback: |
          That changes the precision of beliefs about policies, not the structure of the generative model.
    explanation: |
      Parameter learning fills in numbers in a given model. Structure learning finds the model: hidden regularities that give causal understanding, parsimony and generalisation. Pruning parameters (model reduction) helps to find them.

  - type: text
    id: final-summary
    title: "What you now own: the whole of Level 10"
    body: |
      **Perception and action, one descent.** Hidden cause with belief $\mu$, prior mean $\eta$, observation $y$ and prediction $g(\mu)$. The errors are $\epsilon_y=y-g(\mu)$ (sensory) and $\epsilon_v=\mu-\eta$ (prior), with precisions $\Pi_y$ and $\Pi_v$, and
      $$F=\tfrac12\Pi_y\epsilon_y^2+\tfrac12\Pi_v\epsilon_v^2$$
      For $g(\mu)=\mu$ the settled belief is
      $$\mu^*=\frac{\Pi_y\,y+\Pi_v\,\eta}{\Pi_y+\Pi_v}$$
      Action $u$ (moving the sensation, $\partial y/\partial u=1$) descends the same $F$. At rest of the belief the reflex rate is
      $$\dot u=\Pi_v\,(\eta-\mu)$$
      Attention is the precision $\Pi_y$ of a sensory channel (a larger value pulls $\mu^*$ toward $y$).

      **Choosing policies.** A policy $\pi$ is a sequence of control states. The expected free energy, minimised, splits as
      $$G(\pi)=\text{risk}+\text{ambiguity}$$
      where risk is $D_{KL}[Q(\tilde y\mid\pi)\,\|\,P(\tilde y\mid C)]$ ($Q$ predicted outcomes against the preferences $C$) and ambiguity is the expected entropy of the likelihood. Equivalently
      $$\begin{aligned}G(\pi)={}&-\text{information gain}\\&-\text{pragmatic value}\end{aligned}$$
      Salience is the information-gain term of a policy (attention belongs to beliefs, salience to policies). With softmax $\sigma$ and precision $\gamma$,
      $$P(\pi)=\sigma(-\gamma G(\pi))$$

      **Habit, perseveration, deliberation.** With habit prior $E$ and variational free energy $F$ of each policy,
      $$P(\pi)=\sigma(\ln E-F-G)$$
      where $G$ is deliberative, $F$ perseverative and $E$ habitual. The free energy trades off
      $$F=\text{complexity}-\text{accuracy}$$

      **Body and emotion.** The viable range of a physiological variable is a prior over interoceptive observations (the set-point); the interoceptive error $\epsilon_y=y-g(\mu)$ is cancelled by autonomic reflexes. Homeostasis reacts after an error; allostasis acts before it. Proposed: valence is read off the rate of change of $F$,
      $$\frac{dF}{dt}>0\Rightarrow\text{negative},\qquad\frac{dF}{dt}<0\Rightarrow\text{positive}$$

      **Learning.** Parameter learning of a likelihood column adds a count when outcome $i$ is seen in state $j$,
      $$a_{ij}\leftarrow a_{ij}+1,\qquad \text{expected likelihood}=\frac{a_{ij}}{a_{0j}}$$
      with $a_{0j}=\sum_i a_{ij}$. Structure learning finds hidden rules (latent causes) and favours simpler models.

      **Next:** the review of Level 10 comes automatically; then the **final exam**, which covers Levels 6 to 10.
