  - { from: blanket, to: selfev, label: lets the inside model }
  - { from: steady, to: flow, label: needs }
  - { from: selfev, to: bound, label: is bounded by }
  - { from: flow, to: least, label: gives }
  - { from: bound, to: percact, label: reduced by }
  - { from: least, to: depth, label: extended in time }
  - { from: percact, to: depth, label: plus a future }
  - { from: depth, to: policy, label: scored by }
  - { from: policy, to: school, label: reconciles }
  - { from: steady, to: selfev, dashed: true }
outroTitle: Level 3 in one picture
outro: |
  A creature with external states $x$, internal states $\mu$ and blanket $b=(u,y)$ obeys $\mu\perp x\mid b$, and **persists** with a steady-state density $P(y)$ over its sensory states $y$. Its surprise is

  $$\mathfrak{I}(y)=-\ln P(y)$$

  **Left, the physics.** The flow descends the surprise, and the Hamiltonian principle of least Action applies to behaviour. **Right, the statistics.** Maximising model evidence is minimising surprise, and the variational free energy

  $$\begin{aligned}F\;&=D_{\mathrm{KL}}[Q(x)\,\|\,P(x\mid y)]\\&\quad-\ln P(y)\\&\ge\mathfrak{I}(y)\end{aligned}$$

  is a tractable upper bound. **Perception** lowers it through $\mu$, **action** through $y$.

  Adding a model with a future gives **policies** $\pi$ with the prior

  $$P(\pi)=\sigma(-G(\pi))$$

  ($G$ minimised, never negated). The enactive, cybernetic and predictive schools are three views of this one minimisation.
