    body: |
      Two circuits on the same six layers, chosen by the buttons. The first is predictive coding (continuous model). The second is the proposed circuit for the **discrete** model of the last level, with expectations $\mathbf s$ about states, $\mathbf s_\pi$ the expectations given a policy $\pi$, outcomes $\mathbf o$, the matrix $A$ and an error $\boldsymbol\varepsilon$. Press **Play messages** in each and compare the layers and the messages. The second diagram is simplified. Watch the shape, not the symbols: what leaves layer III upward in each?

  - type: mcq
    id: discrete-ascend
    prompt: |
      In the proposed circuit for the **discrete** (POMDP) model, error units $\boldsymbol\varepsilon$ sit in layer IV, the ascending signal from below lands there, and expectations $\mathbf s$ about hidden states sit in the pyramidal cells. What travels **between** areas?
    options:
      - text: 'Mixtures of expectations (the expectation $\mathbf s$ averaged over policies), not prediction errors.'
        correct: true
      - text: 'Prediction errors, exactly as in the continuous predictive coding circuit.'
        feedback: |
          Tempting, because the two circuits look alike and both update expectations by descending $F$. But here the errors stay local (layer IV); what is passed up and down is a mixture of expectations. Using a difference-of-beliefs message for the continuous model and an expectation message for the discrete one is a real difference between the two proposals.
      - text: 'The free energy $F$ itself, as a single number.'
        feedback: |
          $F$ is never a message in this scheme. Cells pass the gradient-relevant quantities (expectations or errors), not the scalar that is being minimised.
    explanation: |
      The overall structure survives (minimise an error, that is, a free energy gradient, by updating expectations), but the messages between regions are expectations. Averaging over policies requires the posterior beliefs about policies $\pi$, which could be computed subcortically, as the next lesson explores:
      $$\mathbf s=\sum_\pi \pi\;\mathbf s_\pi$$

  - type: mcq
    id: one-arrow
    prompt: |
      The message-passing diagram for predictive coding has the descending prediction **inhibiting layer III**. In the anatomical column the descending input arrives at layer II and at *excitatory* synapses on the interneurons of layer IV, not as an inhibitory synapse on layer III. How can the two diagrams be reconciled?
    options:
      - text: 'An arrow in a message-passing diagram need not be a single synapse: the descending input can excite an inhibitory interneuron in layer IV, which inhibits layer III (a disynaptic pathway).'
        correct: true
      - text: 'They cannot be reconciled, so the predictive coding mapping is refuted.'
        feedback: |
          That would follow only if every arrow were one synapse. An arrow stands for a *message* and a message can be relayed through intermediate cells. The mismatch is a prompt to look at disynaptic routes, not a refutation.
      - text: 'The descending input must secretly be inhibitory at its source, so the signs match.'
        feedback: |
          Long-range descending connections between areas are excitatory in the column. The inhibitory sign is obtained at the second synapse, onto layer III, from a local interneuron.
    explanation: |
      Message passing says what is computed (a subtraction of the prediction), not how many synapses carry it. An excitatory projection onto layer IV inhibitory interneurons, followed by their inhibition of layer III, gives the net inhibitory effect the algorithm needs.

  - type: text
    id: summary
    body: |
      **Next:** layer V sends a prediction out of the cortex entirely, to the spinal cord. If a prediction can drive the muscles, what is a motor command?
