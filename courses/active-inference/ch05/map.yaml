outroTitle: Level 5 in one picture
outro: |
  Belief updating needs **error units** (mismatches) and **expectation units** (beliefs), and in the proposal **ascending messages are errors, descending messages are predictions**:

  $$\epsilon_v^{(i)}=\mu_v^{(i)}-g^{(i+1)}(\cdot),\qquad\dot{\tilde\mu}-D\tilde\mu=-\nabla_{\tilde\mu}F$$

  **Left, continuous.** Layers carry the units; action is a reflex, $\dot u=-\nabla_u\tilde y(u)\cdot\tilde\Pi_y\,\tilde\epsilon_y$, and attenuating $\Pi_y$ never speeds it. **Right, discrete.** Areas exchange mixtures $\mathbf s=\sum_\pi\pi\,\mathbf s_\pi$, and the basal ganglia could compute

  $$\boldsymbol\pi=\sigma(\ln\mathbf E-\mathbf F-\mathbf G)$$

  **Middle.** Neuromodulators could set the precisions $\zeta,\omega,\gamma$: fast gain. Learning changes the model slowly. A discrete level sits on top of a continuous one through a prior mean $\eta_s$ going down and a likelihood $\tilde{\mathbf o}^{(2)}$ coming up.

  Every mapping is a hypothesis ("could be mapped to"), not a result.
