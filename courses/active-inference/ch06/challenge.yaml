id: ch06-challenge
title: Level Challenge
kind: challenge
cards:
  - type: text
    id: intro
    title: "Harder: the whole of Level 6 in five problems"
    body: |
      Five problems on **new systems** (not the door, the frog or the two feeders). They combine what this level taught: how to **design** a generative model. Every number can be checked by hand with a calculator, and every answer comes with the reason. No hints about which formula to use: you recall it. Logarithms are natural.

      The recipe, in four lines:

      - **System**: draw the Markov blanket. Sensory states $y$ go in, active states $u$ go out, internal states $\mu$ hold the model, and the loop is $x\to y\to\mu\to u\to x$.
      - **Form**: discrete or continuous or hybrid; shallow or deep; with or without temporal depth (planning).
      - **Variables**: states $s$, outcomes $o$, matrices $\mathbf A,\mathbf B,\mathbf C,\mathbf D,\mathbf E$ and the policy posterior $\boldsymbol\pi=\sigma(\ln\mathbf E-\mathbf F-\mathbf G)$.
      - **Process**: the real world that generates the data, which may differ from the model.

      1. Choose the blanket of a room with a thermostat.
      2. Choose the form of a watering robot and count what it costs.
      3. Set up and run a small model with six states.
      4. Process against model.
      5. Fixed against learned.

  # ---------------------------------------------------------------- Problem 1
  - type: mcq
    id: p1-assign
    tag: Problem 1 · Blanket of a thermostat
    prompt: |
      **Problem 1.** A thermostat keeps a room warm. It has a thermometer that gives a reading, and a switch that sets the power of a heater. The agent is the thermostat; the room's air temperature is outside it. Which assignment of Markov-blanket states is correct?
    options:
      - text: 'Sensory $y$ = the thermometer reading; active $u$ = the heater command; external $x$ = the room temperature; internal $\mu$ = the thermostat''s belief about the temperature.'
        correct: true
      - text: 'Sensory $y$ = the room temperature; active $u$ = the thermometer reading; internal $\mu$ = the heater.'
        feedback: |
          The room temperature is **external**: the thermostat never touches it directly, it only gets a reading through the thermometer. And the reading comes **in**, so it is sensory, not active.
      - text: 'Sensory $y$ = the heater command; active $u$ = the thermometer reading.'
        feedback: |
          The two are swapped. Sensory states are what the world does **to** the agent (the reading); active states are what the agent does **to** the world (the command).
      - text: 'There are no active states: a thermostat only measures.'
        feedback: |
          It also acts: the heater command changes the room, and that is what closes the loop. Without active states the thermostat could only watch the temperature, never regulate it.
    explanation: |
      The blanket $b=(u,y)$ separates inside from outside: the thermometer reading $y$ is how the room reaches the thermostat, the heater command $u$ is how the thermostat reaches the room, $\mu$ is what the thermostat believes inside, and $x$ (the air temperature) is hidden behind the blanket.

  - type: order
    id: p1-loop
    tag: Problem 1 · Blanket of a thermostat
    prompt: |
      Put the loop of the thermostat and its room in order, starting from the external state $x$ (the room's air temperature).
    steps:
      - '$x\to y$: the room temperature sets the thermometer reading.'
      - '$y\to\mu$: the reading updates the thermostat''s belief about the temperature.'
      - '$\mu\to u$: the belief sets the heater command.'
      - '$u\to x$: the heater changes the room temperature.'
    explanation: |
      The cycle is $x\to y\to\mu\to u\to x$. Internal states never act on the room directly (they act through $u$), and the room never reaches $\mu$ directly (it acts through $y$): that is what the blanket means.

  - type: mcq
    id: p1-tool
    tag: Problem 1 · Blanket of a thermostat
    prompt: |
      The blanket is now redrawn to include the **heater** in the agent (the heater element is part of the thermostat). The room's air stays outside. What changes?
    options:
      - text: 'The heater power becomes an internal state, and the active states are now the heat flowing from the heater''s surface into the air. The loop is still $x\to y\to\mu\to u\to x$.'
        correct: true
      - text: 'Nothing changes: the active state is still the heater command.'
        feedback: |
          The command now lies **inside** the blanket, so it is internal. Active states are the ones on the boundary that act on the outside; with the heater included, that is the heat leaving its surface.
      - text: 'The loop disappears, because the heater and the agent are now one object.'
        feedback: |
          The loop is a statement about the blanket, not about objects. Whatever the boundary, the inside only reaches the outside through $u$ and receives from it through $y$.
      - text: 'The whole room becomes internal, since the heater touches all of the air.'
        feedback: |
          Touching is not enough. The air is not part of the agent and still has dynamics the thermostat does not control; it stays external.
    explanation: |
      Moving the blanket changes **which variables are $u$ and $y$**, never the structure. Including a tool (here the heater) moves the active states from the tool's command to the tool's effect on the world, and what was a command becomes internal.

  - type: mcq
    id: p1-model
    tag: Problem 1 · Blanket of a thermostat
    prompt: |
      Which of these belongs to the thermostat's **generative model** (inside), rather than to the **process** (the real world, outside)?
    options:
      - text: 'The thermostat''s expectation that running the heater raises the temperature by about a degree per hour.'
        correct: true
      - text: 'The actual heat exchange between the room, the walls and the weather.'
        feedback: |
          That is the **process**: the real physics that produces the temperature and hence the reading. The thermostat may know nothing about the weather.
      - text: 'The true temperature of the air at this moment.'
        feedback: |
          It is an external state $x$, a part of the process. The model holds a **belief** about it, $\mu$.
    explanation: |
      The model is what the agent assumes about how data arise and how its actions act; the process is what really produces them. They may agree, but nothing forces them to.

  # ---------------------------------------------------------------- Problem 2
  - type: mcq
    id: p2-form
    tag: Problem 2 · Form and cost
    prompt: |
      **Problem 2.** A watering robot decides, once per hour, which of 3 garden beds to water or skip. Its moisture sensor gives one of a few categories (dry, fine, wet), and it must plan several hours ahead to avoid overwatering. Which form fits best?
    options:
      - text: 'Discrete time and discrete states, one timescale (shallow), with temporal depth: policies are sequences of actions evaluated through $\mathbf G$.'
        correct: true
      - text: 'Continuous time with generalized coordinates, since moisture is a physical quantity.'
        feedback: |
          Tempting, since moisture is continuous in reality. But the robot decides once per hour among a few choices and receives categories: that is a discrete problem, and continuous time suits smooth, fast quantities such as a limb moving.
      - text: 'A deep model with a fast continuous level and a slow discrete level.'
        feedback: |
          A hybrid needs a reason: a discrete choice that sets the targets of a continuous movement. Here there is only an hourly choice and no fast continuous signal to control.
      - text: 'Discrete time without temporal depth: one step ahead is enough.'
        feedback: |
          Planning several hours ahead is exactly what temporal depth means. A one-step model would water now whenever the moisture is low and could not see overwatering coming.
    explanation: |
      The choice follows the system: discrete decisions and categorical data give a discrete POMDP; one timescale makes it shallow; planning over action sequences gives temporal depth.

  - type: numeric
    id: p2-joint
    tag: Problem 2 · Form and cost
    prompt: |
      The robot's hidden states are its position (3 beds) and the soil moisture level (5 levels). Treated as **one joint state** with $3\times5$ values, how many entries has the transition matrix $\mathbf B$ of **one action**?
    answer: 225
    tolerance: 0.5
    wrong:
      - { value: 15, feedback: 'That is the number of joint states. $\mathbf B$ is a square matrix over them, with one entry for every (next state, current state) pair.' }
      - { value: 34, feedback: 'That is the cost of the factorised version, $3^2+5^2$, which treats the two factors separately.' }
    explanation: |
      There are $15$ joint states, so $\mathbf B$ is $15\times15$:
      $$15^2=225$$

  - type: numeric
    id: p2-fact
    tag: Problem 2 · Form and cost
    prompt: |
      Instead the hidden states are split into two **factors**, position (3 values) and moisture (5 values), each with its own transition matrix. How many entries do the two matrices of **one action** have in total?
    answer: 34
    tolerance: 0.5
    wrong:
      - { value: 225, feedback: 'That is the joint $\mathbf B$, $(3\times5)^2$. With two factors you store a $3\times3$ and a $5\times5$ matrix.' }
      - { value: 8, feedback: 'That is the number of states, $3+5$. A transition matrix over $n$ states has $n^2$ entries.' }
    explanation: |
      $$3^2+5^2=9+25=34$$
      Against $225$ for the joint matrix, and the gap grows quickly with more factors.

  - type: mcq
    id: p2-assume
    tag: Problem 2 · Form and cost
    prompt: |
      Splitting the hidden states into independent factors (position and moisture, each with its own $\mathbf B$) assumes that, given the action, each factor evolves by itself. Which fact would make this split wrong?
    options:
      - text: 'Watering changes the moisture of the bed where the robot stands, so the next moisture depends on the current position as well.'
        correct: true
      - text: 'Moisture has five levels while position has three.'
        feedback: |
          Different sizes are no obstacle: each factor simply has its own matrix.
      - text: 'The robot has two actions, water and skip.'
        feedback: |
          Actions are handled by one set of matrices per action; the number of actions says nothing about whether the factors interact.
      - text: 'The moisture sensor is noisy.'
        feedback: |
          Sensor noise lives in the likelihood $\mathbf A$, not in the transitions $\mathbf B$, and does not couple the factors.
    explanation: |
      The factorisation is a claim of **independent transitions**. When one factor's next value depends on another factor's current value, the factors interact and the cheap split no longer describes the world; a coupled (joint) matrix, or a different choice of states, is needed.

  # ---------------------------------------------------------------- Problem 3
  - type: mcq
    id: p3-setup
    tag: Problem 3 · A model with six states
    prompt: |
      **Problem 3.** A creature walks along a corridor of 6 cells and smells one of 3 odours (none, weak, strong). It has 2 policies over $T=2$ time steps (so one transition): *right* and *stay*. Which sizes are correct for its model?
    options:
      - text: '$\mathbf A$ is $3\times6$; each $\mathbf B$ is $6\times6$; $\mathbf C$ has 3 entries (odours); $\mathbf D$ has 6; $\mathbf E$ has 2.'
        correct: true
      - text: '$\mathbf A$ is $6\times3$; $\mathbf C$ has 6 entries; $\mathbf E$ has 6.'
        feedback: |
          $\mathbf A$ maps states to outcomes: one row per outcome (3), one column per state (6). Preferences $\mathbf C$ are over outcomes, and the habit prior $\mathbf E$ is over policies.
      - text: '$\mathbf A$ is $3\times6$; $\mathbf B$ is $3\times3$; $\mathbf D$ has 3.'
        feedback: |
          $\mathbf B$ and $\mathbf D$ live on the hidden states, of which there are 6, not on the 3 outcomes.
    explanation: |
      Outcomes (3) index the rows of $\mathbf A$ and the entries of $\mathbf C$. Hidden states (6) index the columns of $\mathbf A$, both sides of each $\mathbf B$, and $\mathbf D$. Policies (2) index $\mathbf E$.

  - type: numeric
    id: p3-post
    tag: Problem 3 · A model with six states
    prompt: |
      The model, with cells $1,\dots,6$ and odours (none, weak, strong):
      $$\mathbf D=(.4,\,.3,\,.15,\,.1,\,.03,\,.02)$$
      The likelihood $\mathbf A$ gives, for cells $(1,2)$, odour probabilities $(.8,.15,.05)$; for cells $(3,4)$, $(.1,.8,.1)$; for cells $(5,6)$, $(.05,.15,.8)$. The creature smells a **weak** odour at step 1. What is the posterior probability that it is in cell 3? (3 decimals)
    answer: 0.384
    tolerance: 0.002
    answerText: '0.384'
    wrong:
      - { value: 0.15, feedback: 'That is the prior $\mathbf D_3$. The observation must be used.' }
      - { value: 0.8, feedback: 'That is the likelihood $P(\text{weak}\mid\text{cell }3)$. The posterior multiplies by the prior and divides by the evidence $P(\text{weak})$.' }
    explanation: |
      Evidence: $P(\text{weak})=.15(.4+.3)+.8(.15+.1)+.15(.03+.02)=.3125$. Then
      $$\frac{.8\times.15}{.3125}=0.384$$
      The full posterior is $(.192,\,.144,\,.384,\,.256,\,.0144,\,.0096)$.

  - type: numeric
    id: p3-gstay
    tag: Problem 3 · A model with six states
    prompt: |
      Same creature, posterior at step 1 $\mathbf s_1=(.192,\,.144,\,.384,\,.256,\,.0144,\,.0096)$. Preferences over odours (none, weak, strong): $\mathbf C=(.1,\,.2,\,.7)$. The policy *stay* has $\mathbf B=\mathbf I$. The entropy of the odour distribution of a cell is $H=0.613$ for cells $1,2,5,6$ and $0.639$ for cells $3,4$. What is the expected free energy $\mathbf G$ of *stay* at step 2? (3 decimals)
    answer: 1.427
    tolerance: 0.01
    wrong:
      - { value: 0.797, feedback: 'That is only the risk term. Add the ambiguity, the expected entropy of the odours under the predicted state.' }
      - { value: 0.63, feedback: 'That is only the ambiguity (about $0.630$). Add the risk, the divergence of the predicted odours from the preferences $\mathbf C$.' }
    explanation: |
      Predicted state: $\mathbf s_2=\mathbf B\mathbf s_1=\mathbf s_1$. Predicted odours $\mathbf o_2=\mathbf A\mathbf s_2=(.334,\,.566,\,.100)$. Then
      $$\begin{aligned}\text{risk}&=\sum_i o_i\ln\tfrac{o_i}{C_i}=0.797\\\text{ambiguity}&=\mathbf H\cdot\mathbf s_2=0.630\end{aligned}$$
      and $\mathbf G=0.797+0.630=1.427$.

  - type: numeric
    id: p3-gright
    tag: Problem 3 · A model with six states
    prompt: |
      The policy *right* moves the creature one cell to the right with probability $.9$ and leaves it where it is with probability $.1$; cell 6 stays in cell 6. From the same $\mathbf s_1=(.192,\,.144,\,.384,\,.256,\,.0144,\,.0096)$, the same $\mathbf C=(.1,\,.2,\,.7)$ and the same entropies ($0.613$ for cells $1,2,5,6$; $0.639$ for cells $3,4$), what is the expected free energy $\mathbf G$ of *right* at step 2? (3 decimals)
    answer: 1.024
    tolerance: 0.01
    wrong:
      - { value: 1.427, feedback: 'That is the value for *stay*. Here the predicted state $\mathbf B\mathbf s_1$ has moved to the right.' }
      - { value: 0.397, feedback: 'That is only the risk. Add the ambiguity $\mathbf H\cdot\mathbf s_2$.' }
    explanation: |
      $\mathbf s_2=\mathbf B\mathbf s_1=(.0192,\,.1872,\,.168,\,.3712,\,.2318,\,.0226)$ and $\mathbf o_2=(.2318,\,.5005,\,.2678)$. Then
      $$\mathbf G=\underbrace{0.397}_{\text{risk}}+\underbrace{0.627}_{\text{ambiguity}}=1.024$$
      *Right* is lower than *stay* ($1.427$): it moves toward the cells that smell strong, the preferred odour.

  - type: numeric
    id: p3-pi
    tag: Problem 3 · A model with six states
    prompt: |
      Take $\mathbf G=(1.024,\,1.427)$ for (*right*, *stay*), the habit prior $\mathbf E=(.6,\,.4)$, and $\mathbf F=-\ln P(\text{weak})=-\ln .3125=1.163$ for both policies (the observation at step 1 does not depend on the policy). With $\boldsymbol\pi=\sigma(\ln\mathbf E-\mathbf F-\mathbf G)$, what is the probability of *right*? (3 decimals)
    answer: 0.692
    tolerance: 0.002
    answerText: '0.692'
    wrong:
      - { value: 0.599, feedback: 'That is $\sigma(-\mathbf G)$, without the habit: $\ln\mathbf E$ favours *right* ($.6$ against $.4$).' }
      - { value: 0.5, feedback: 'That would need equal arguments. Here $\mathbf G$ and $\mathbf E$ both favour *right*.' }
    explanation: |
      $\mathbf F$ is the same for both policies, so it cancels in the softmax. The difference of the arguments is
      $$\begin{aligned}&\ln\tfrac{.6}{.4}-(1.024-1.427)\\&=0.405+0.403=0.808\end{aligned}$$
      and
      $$\pi_{\text{right}}=\frac{1}{1+e^{-0.808}}=0.692$$
      The habit and the expected free energy each contribute about half of the preference.

  # ---------------------------------------------------------------- Problem 4
  - type: mcq
    id: p4-split
    tag: Problem 4 · Process against model
    prompt: |
      **Problem 4.** A drone hovers and measures its sideways drift speed $y$ (m/s) with a sensor. Inside, its generative model says: "the drift $v$ is zero, give or take a little", a Gaussian prior $\mathcal N(\eta,\Pi_v^{-1})$ with mean $\eta=0$ and precision $\Pi_v$. Outside, a steady wind really pushes the drone sideways at $3$ m/s. Which statement separates **model** from **process** correctly?
    options:
      - text: 'The model is the drone''s belief "no drift" (prior mean $\eta=0$); the process is the real world with the wind, which produces the readings $y$. The two differ, and the drone only ever sees $y$.'
        correct: true
      - text: 'The wind is part of the model, because it affects the drone.'
        feedback: |
          The model is what the agent **assumes**, and this agent assumes no wind. The wind belongs to the process, the real mechanism that generates the data, whether or not the agent represents it.
      - text: 'The process is the drone''s prior $\mathcal N(0,\Pi_v^{-1})$, since it is what generates its predictions.'
        feedback: |
          Predictions come from the model. The process is outside the blanket: the physics of wind, drone and sensor that really produces $y$.
      - text: 'Model and process must be the same, otherwise the drone cannot infer anything.'
        feedback: |
          They are often different: inference runs on the model, the data come from the process. A mismatch does not stop inference; it biases the result, which is exactly what the next questions measure.
    explanation: |
      The generative model sits inside the agent; the process sits outside and generates the observations. Here the process has a $3$ m/s drift and the model believes $0$ with precision $\Pi_v$.

  - type: numeric
    id: p4-mu
    tag: Problem 4 · Process against model
    prompt: |
      The sensor reads $y=3$ m/s with precision $\Pi_y=4$. The drone's prior on the drift is $\mathcal N(\eta,\Pi_v^{-1})$ with $\eta=0$ and $\Pi_v=2$. Its best estimate $\mu$ of the drift minimises the sum of the two precision-weighted squared errors $\tfrac12\Pi_y(y-\mu)^2+\tfrac12\Pi_v(\mu-\eta)^2$. What is $\mu$ (m/s)?
    answer: 2
    tolerance: 0.01
    answerText: '2'
    hint: 'Set the derivative with respect to $\mu$ to zero: the two precision-weighted errors balance.'
    wrong:
      - { value: 3, feedback: 'That is the data alone, as if the prior had zero precision. The drone also trusts its "no drift" prior with precision $\Pi_v=2$.' }
      - { value: 0, feedback: 'That is the prior alone. The data have precision $\Pi_y=4$, larger than $\Pi_v=2$, so they pull harder.' }
      - { value: 1.5, feedback: 'That is the plain average of $y$ and $\eta$. The compromise weights each by its precision.' }
    explanation: |
      The balance $\Pi_y(y-\mu)=\Pi_v(\mu-\eta)$ gives
      $$\mu=\frac{\Pi_y\,y+\Pi_v\,\eta}{\Pi_y+\Pi_v}=\frac{4\cdot3+2\cdot0}{4+2}=2$$
      Check: $\Pi_y(y-\mu)=4\cdot1=4$ and $\Pi_v(\mu-\eta)=2\cdot2=4$. The drone believes the drift is $2$ m/s, not $3$, and a prediction error $y-\mu=1$ remains.

  - type: numeric
    id: p4-tight
    tag: Problem 4 · Process against model
    prompt: |
      Same drone: $y=3$, $\Pi_y=4$, prior mean $\eta=0$. An engineer tries to make it "more sure of itself" by **tightening** the prior to $\Pi_v=8$. What is the new estimate $\mu$ (m/s)?
    answer: 1
    tolerance: 0.01
    answerText: '1'
    wrong:
      - { value: 2, feedback: 'That is the estimate for $\Pi_v=2$. The weights have changed.' }
      - { value: 3, feedback: 'A tighter prior pulls toward $\eta=0$, not toward the data.' }
    explanation: |
      $$\mu=\frac{4\cdot3+8\cdot0}{4+8}=1$$
      A tighter wrong prior makes the estimate **worse**: it is now $2$ m/s from the real drift $3$ m/s, against $1$ m/s before. Precision does not repair a prior centred on the wrong value.

  - type: mcq
    id: p4-fix
    tag: Problem 4 · Process against model
    prompt: |
      The wind drifts the drone at $3$ m/s. **Drone A** has a drift variable $v$ in its model, with prior $\mathcal N(0,\Pi_v^{-1})$, $\Pi_v=2$ (a wrong **prior**). **Drone B** has no drift variable at all: its model only describes the drone's position error, with no way to say "a steady push exists" (a wrong **model**). Sensor precision $\Pi_y=4$, reading $y=3$. Which statement is right?
    options:
      - text: 'For A, weakening the prior to $\Pi_v=0.5$ moves the estimate to $\mu=2.67$, closer to $3$; B needs its model form changed, since no precision setting can represent a variable it does not have.'
        correct: true
      - text: 'For A, tightening the prior to $\Pi_v=8$ moves the estimate closer to $3$.'
        feedback: |
          Tightening gives $\mu=1$ (prior mean $0$ weighs more). Only weakening, or moving the prior mean, brings $\mu$ toward $3$.
      - text: 'Both drones have a wrong model, so both need a new form.'
        feedback: |
          A has the right form (a drift variable) and only a wrong value for it, which is a wrong prior: a parameter fix. B lacks the variable, which is a wrong model.
      - text: 'Acting repairs both: if the drone thrusts against the wind, its model becomes correct.'
        feedback: |
          Acting changes the data, not the model. Thrusting against the drift can bring $y$ to the preferred value $0$ and the drone hovers, but the model still says "no wind" and the push stays unexplained; the persistent error (the wind the model cannot account for) is hidden, not removed.
    explanation: |
      For A, with $\Pi_v=0.5$:
      $$\mu=\frac{4\cdot3+0.5\cdot0}{4+0.5}=2.67$$
      A wrong prior is a value to fix (weaker precision, or a better prior mean). A wrong model is a missing structure. Action is a third route: it makes the data match the model's prediction ($y\to0$), which is useful for hovering but is not inference about the wind.

  # ---------------------------------------------------------------- Problem 5
  - type: numeric
    id: p5-update
    tag: Problem 5 · Fixed against learned
    prompt: |
      **Problem 5.** A weather station has two hidden states, *rain* and *dry*, and two readings, *wet* and *not wet*. Its likelihood $\mathbf A$ is learned from counts $\mathbf a$ (rows: readings; columns: states), starting with every count equal to $1$. It observes *wet*, $\mathbf o=(1,0)^\top$, and infers the state $\mathbf s=(.8,.2)^\top$ (rain, dry). It updates $\mathbf a\leftarrow\mathbf a+\mathbf o\otimes\mathbf s$, then normalises each column. What is the new $\mathbf A_{11}=P(\text{wet}\mid\text{rain})$? (3 decimals)
    answer: 0.643
    tolerance: 0.002
    answerText: '0.643'
    wrong:
      - { value: 1.8, feedback: 'That is the count $\mathbf a_{11}$, not a probability. Normalise the column: divide by its sum.' }
      - { value: 0.5, feedback: 'That is the value before learning (counts $1,1$). The update adds $\mathbf o\otimes\mathbf s$, so row *wet*, column *rain* gains $0.8$.' }
      - { value: 0.8, feedback: 'That is the posterior $\mathbf s_1$ itself, not the likelihood. The column is $(1+0.8,\,1)$ normalised.' }
    explanation: |
      $\mathbf o\otimes\mathbf s$ has first row $(.8,.2)$ and second row $(0,0)$, so
      $$\mathbf a=\begin{pmatrix}1.8&1.2\\1&1\end{pmatrix}$$
      Column *rain*: $1.8/(1.8+1)=0.643$. Column *dry*: $1.2/2.2=0.545$. The columns are normalised separately; each is a distribution over readings.

  - type: numeric
    id: p5-strength
    tag: Problem 5 · Fixed against learned
    prompt: |
      Same station, same observation *wet* and same posterior $\mathbf s=(.8,.2)$, but the counts start at $10$ instead of $1$ (every entry of $\mathbf a$ equals $10$): a **stronger** prior of flat shape. What is the new $\mathbf A_{11}=P(\text{wet}\mid\text{rain})$ after one update and column normalisation? (3 decimals)
    answer: 0.519
    tolerance: 0.002
    answerText: '0.519'
    wrong:
      - { value: 0.643, feedback: 'That is the result for counts starting at $1$. With counts of $10$ the same $0.8$ added is a smaller share of the total.' }
      - { value: 0.5, feedback: 'The update still moves $\mathbf A_{11}$ a little: $10.8$ out of $20.8$.' }
    explanation: |
      $$\mathbf A_{11}=\frac{10+0.8}{(10+0.8)+10}=\frac{10.8}{20.8}=0.519$$
      The total of the column is the **prior strength**; the new evidence is a fixed amount ($0.8$ here). The larger the starting counts, the less one observation moves $\mathbf A$.

  - type: mcq
    id: p5-prior
    tag: Problem 5 · Fixed against learned
    prompt: |
      The sensor's datasheet says that when it rains the sensor reads *wet* about $80\%$ of the time, with a little uncertainty. Which prior counts for the *rain* column of $\mathbf a$ (readings *wet*, *not wet*) express this best?
    options:
      - text: '$(8,\,2)$: the right proportions with a total of $10$, so the first observations refine the datasheet without overwriting it.'
        correct: true
      - text: '$(1,\,1)$: flat counts, since learning should start with no assumptions.'
        feedback: |
          Flat counts throw away what is known, and a single observation moves them a lot (from $0.5$ to $0.643$ above). They suit a sensor about which nothing is known.
      - text: '$(800,\,200)$: the right proportions with a very large total.'
        feedback: |
          The proportions are right but the strength is huge: thousands of observations would be needed to change it, so it is practically fixed. That is fine only if the datasheet is certain.
      - text: '$(0,\,0)$: zero counts, so only data count.'
        feedback: |
          A zero column cannot be normalised (division by $0$) and a count of exactly $0$ makes a reading impossible forever. Counts start above $0$.
    explanation: |
      Counts $(8,2)$ give $0.8$ for *wet* with strength $10$. After one observation of *wet* with posterior $(.8,.2)$:
      $$\frac{8+0.8}{8+0.8+2}=0.815$$
      The prior shape says what we believe; the total says how firmly.

  - type: numeric
    id: p5-slow
    tag: Problem 5 · Fixed against learned
    prompt: |
      Counts start with every entry equal to $10$. Each time, the station is certain it is raining ($\mathbf s=(1,0)$) and reads *wet* ($\mathbf o=(1,0)$), so $\mathbf a_{11}$ gains $1$ per observation and the rest of the *rain* column is unchanged. How many observations $n$ are needed before $\mathbf A_{11}=P(\text{wet}\mid\text{rain})$ reaches $0.9$?
    answer: 80
    tolerance: 0.5
    answerText: '80'
    wrong:
      - { value: 8, feedback: 'That is the number for counts starting at $1$. With counts of $10$ the prior is ten times stronger.' }
    explanation: |
      After $n$ observations $\mathbf A_{11}=\dfrac{10+n}{20+n}$. Setting it to $0.9$:
      $$10+n=0.9\,(20+n)$$
      so $n=80$. Check: $90/100=0.9$. Learning an entry of $\mathbf A$ is **slow**, and slower the stronger the prior.

  - type: mcq
    id: p5-fix
    tag: Problem 5 · Fixed against learned
    prompt: |
      A designer builds a generative model for a greenhouse robot. Which choice is the best use of learning?
    options:
      - text: 'Fix the parts known well (the model form, the calibrated $\mathbf A$ of a trusted sensor, the preferences $\mathbf C$) and learn only a quantity that is unknown, such as the leak rate in one transition matrix $\mathbf B$, with informative prior counts.'
        correct: true
      - text: 'Learn everything from flat counts, including the form: the robot will discover its states and matrices alone.'
        feedback: |
          Counts only fill in the entries of matrices whose **shape** is given. The set of states, outcomes and policies (the model form) must be chosen before any learning, and learning every entry from flat counts is slow (about 80 observations to reach 0.9 from counts of 10).
      - text: 'Learn the preferences $\mathbf C$ as well, so the robot wants whatever it observes most often.'
        feedback: |
          Preferences define what the designer wants. Learning them from experience would make the robot prefer what is common, not what is good.
      - text: 'Fix everything, including quantities never measured, so there are no free parameters.'
        feedback: |
          A fixed wrong value stays wrong (a wrong prior with infinite strength). Fixing is right only for what is known; an unknown quantity should be learned from data.
    explanation: |
      The order is: choose the form (states, outcomes, policies), then set what is known as fixed, then learn what is unknown with a prior whose shape and strength reflect what you know. Learning cannot add a state the form does not have.

  # ---------------------------------------------------------------- Summary
  - type: text
    id: summary
    title: Level 6 in one card
    body: |
      **Setup.** An agent has a Markov blanket: sensory states $y$ come in, active states $u$ go out, internal states $\mu$ hold its model, and external states $x$ are hidden. The loop is
      $$x\to y\to\mu\to u\to x$$
      The **model** is inside the agent. The **process** is the real world that generates $y$; the two can differ.

      **Form choices.** Discrete, continuous or hybrid; shallow or deep (several timescales); with or without temporal depth (planning).

      **Counting states.** Joint states multiply, factorised states add. For 3 objects at 4 locations, $\mathbf B$ has $12^2=144$ entries per action jointly and $3^2+4^2=25$ factorised.

      **Sizes.** $\mathbf A$: outcomes $\times$ states. $\mathbf B$: states $\times$ states, one per action. $\mathbf C$: one preference per outcome. $\mathbf D$: one prior per state. $\mathbf E$: one habit per policy.

      **Policies.**
      $$\boldsymbol\pi=\sigma(\ln\mathbf E-\mathbf F-\mathbf G)$$
      $$\mathbf G=\text{risk}+\text{ambiguity}$$
      With a flat $\mathbf E$ this is $\sigma(-\mathbf F-\mathbf G)$.

      **Learning.** Counts start above $0$, often at $1$. One update is
      $$\mathbf a\leftarrow\mathbf a+\mathbf o\otimes\mathbf s$$
      where $\mathbf a$ are the counts of the likelihood $\mathbf A$, $\mathbf o$ the observed outcome and $\mathbf s$ the state belief, and each column of $\mathbf a$ is normalised to give $\mathbf A$. The total of a column is the prior strength: larger means slower learning. Choose the form first, fix what is known, learn the rest.

      **Mismatch.** A hidden cause $v$ has a Gaussian prior $\mathcal N(\eta,\Pi_v^{-1})$ (mean $\eta$, precision $\Pi_v$); one datum $y$ has noise of precision $\Pi_y$. The best estimate $\mu$ of $v$ is
      $$\mu=\frac{\Pi_y\,y+\Pi_v\,\eta}{\Pi_y+\Pi_v}$$
      A tighter wrong prior is worse; a wrong prior is a value to fix, a wrong model is a missing structure.

      **Next:** perceptual processing in discrete models: how an agent infers hidden states from observations.
