outroTitle: Level 6 in one picture
outro: |
  **Recipe, in order.** (1) The system: a Markov blanket with external states $x$, internal states $\mu$, sensory states $y$ and active states $u$,

  $$x \to y \to \mu \to u \to x$$

  (2) The form: discrete, continuous or hybrid; shallow or deep (levels and timescales); with or without temporal depth, where policies are scored by

  $$P(\pi)=\sigma(\ln\mathbf E-F-G)$$

  (3) Variables and priors: states, observations and actions, with the tables $\mathbf A$ (likelihood), $\mathbf B$ (transitions), $\mathbf C$ (preferences), $\mathbf D$ (initial prior), $\mathbf E$ (habits), each fixed or learned. (4) The generative process: the world that really produces the observations and answers actions, which may differ from the model.

  The two-feeder creature (8 states, cue right with probability $0.9$) went through all four steps, and the finished model can be simulated or fitted to data.

  **Next:** the level challenge. Five harder problems that combine these choices on new systems: draw the blanket, pick the form, count the states, set the tables, and decide what the process does.
