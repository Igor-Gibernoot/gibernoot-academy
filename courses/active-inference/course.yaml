# The trail. One level per book chapter, lessons in trail order.
#
# A lesson entry with `file:` is built and playable; without it, it shows as
# a planned (greyed) node. `kind` is concept | guided | traps | intuition, plus
# the end-of-level kinds: map (content-map puzzle), review (automatic, no file:
# practises only this level's questions) and challenge (mixed problems).

title: Active Inference

levels:
  - id: ch01
    number: 1
    title: Overview
    blurb: 'How can a living thing persist in a changing world? The big question active inference answers, and a light preview of the road ahead.'
    lessons:
      - id: ch01-persist
        title: "How Does a Creature Stay Alive?"
        kind: concept
        file: ch01/persist.yaml
        summary: 'Why a living thing must keep its sensations within bounds, and why that makes acting and perceiving one problem.'
      - id: ch01-guessing
        title: "Perceiving Is Guessing"
        kind: concept
        file: ch01/guessing.yaml
        summary: 'Why the brain must guess hidden causes from noisy senses, and how prior belief and evidence combine.'
      - id: ch01-acting
        file: ch01/acting.yaml
        title: "Acting to Get the Senses You Expect"
        kind: concept
        summary: 'If you expect to feel warm, how can moving change the world to make it so? Preferences, plans and curiosity in one picture.'
      - id: ch01-map
        title: "Content Map"
        kind: map
        file: ch01/map.yaml
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch01-review, title: Level Review, kind: review }
      - id: ch01-challenge
        title: Level Challenge
        kind: challenge
        file: ch01/challenge.yaml
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch02
    number: 2
    title: The Low Road to Active Inference
    blurb: 'Start from perception as inference and arrive at free energy, then at the expected free energy that scores plans.'
    lessons:
      - id: ch02-perception-inference
        title: "Perception as Inference"
        kind: concept
        file: ch02/perception-inference.yaml
        summary: 'Bayes'' rule as a model of seeing: priors, likelihoods, posteriors, and why a hidden cause needs a generative model.'
      - id: ch02-approximate-inference
        title: "Optimal Inference Is Too Expensive"
        kind: concept
        file: ch02/approximate-inference.yaml
        summary: 'Why exact Bayes is out of reach for a brain, and what an approximate posterior must give up.'
      - id: ch02-action-inference
        title: "Action as Inference"
        kind: concept
        file: ch02/action-inference.yaml
        summary: 'Why changing the world can reduce the same mismatch that changing beliefs does.'
      - id: ch02-free-energy
        title: "Variational Free Energy"
        kind: concept
        file: ch02/free-energy.yaml
        summary: 'A quantity you can compute that bounds surprise: the gap between model and world, and its two readings.'
      - id: ch02-free-energy-bound
        title: "Guided Problem: Free Energy Bounds Surprise"
        kind: guided
        file: ch02/free-energy-bound.yaml
        summary: 'Derive $F \ge -\ln P(y)$ with a KL divergence and see when it is tight.'
      - id: ch02-free-energy-traps
        title: "Free Energy Traps"
        kind: traps
        file: ch02/free-energy-traps.yaml
        summary: 'A fast round on the mistakes made with surprise, free energy and approximate posteriors.'
      - id: ch02-expected-free-energy
        title: "Planning as Inference"
        kind: concept
        file: ch02/expected-free-energy.yaml
        summary: 'How to score a plan whose outcomes have not happened yet: the expected free energy.'
      - id: ch02-efe-parts
        title: "What Is Expected Free Energy?"
        kind: concept
        file: ch02/efe-parts.yaml
        summary: 'Risk and ambiguity, and pragmatic versus epistemic value.'
      - id: ch02-efe-decomposition
        title: "Guided Problem: Splitting the Expected Free Energy"
        kind: guided
        file: ch02/efe-decomposition.yaml
        summary: 'Rewrite $G$ in its decompositions step by step and read off what each term rewards.'
      - id: ch02-intuition-free-energy
        title: "Intuition: The Free Energy Family"
        kind: intuition
        file: ch02/intuition-free-energy.yaml
        summary: 'Quick recall of the main expressions of $F$ and $G$ with limit checks and a small numeric example.'
      - id: ch02-map
        title: "Content Map"
        kind: map
        file: ch02/map.yaml
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch02-review, title: Level Review, kind: review }
      - id: ch02-challenge
        title: Level Challenge
        kind: challenge
        file: ch02/challenge.yaml
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch03
    number: 3
    title: The High Road to Active Inference
    blurb: 'Start from what it means to be a persisting system with a boundary, and arrive at the same free energy.'
    lessons:
      - id: ch03-markov-blankets
        title: "Markov Blankets"
        kind: concept
        file: ch03/markov-blankets.yaml
        summary: 'Which variables separate an inside from an outside, and why that split carries the whole argument.'
      - id: ch03-self-evidencing
        title: "Surprise Minimization and Self-Evidencing"
        kind: concept
        file: ch03/self-evidencing.yaml
        summary: 'Why a system that persists behaves as if it were gathering evidence for its own existence.'
      - id: ch03-least-action
        title: "Surprise Minimization as Least Action"
        kind: concept
        file: ch03/least-action.yaml
        summary: 'Surprise along a path as an action, and the most likely trajectory.'
      - id: ch03-inference-dynamics
        title: "Inference, Cognition and Stochastic Dynamics"
        kind: concept
        file: ch03/inference-dynamics.yaml
        summary: 'How free energy, model evidence and surprise connect to stochastic dynamics.'
      - id: ch03-blanket-free-energy
        title: "Guided Problem: From Steady State to Free Energy"
        kind: guided
        file: ch03/blanket-free-energy.yaml
        summary: 'Start from a nonequilibrium steady state and derive that blanket states minimize free energy.'
      - id: ch03-models-policies
        title: "Models, Policies and Trajectories"
        kind: concept
        file: ch03/models-policies.yaml
        summary: 'What a policy is, what a trajectory is, and why an agent''s model includes its own future actions.'
      - id: ch03-reconciliation
        title: "Enactive, Cybernetic and Predictive Views"
        kind: concept
        file: ch03/reconciliation.yaml
        summary: 'How active inference absorbs three older theories of mind.'
      - id: ch03-blanket-traps
        title: "Blanket Traps"
        kind: traps
        file: ch03/blanket-traps.yaml
        summary: 'Misconceptions about Markov blankets, self-evidencing and the two roads.'
      - id: ch03-map
        title: "Content Map"
        kind: map
        file: ch03/map.yaml
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch03-review, title: Level Review, kind: review }
      - id: ch03-challenge
        title: Level Challenge
        kind: challenge
        file: ch03/challenge.yaml
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch04
    number: 4
    title: The Generative Models of Active Inference
    blurb: 'The two model families the rest of the book uses: discrete-time POMDPs and continuous-time predictive coding.'
    lessons:
      - id: ch04-bayes-to-fe
        title: "From Bayesian Inference to Free Energy"
        kind: concept
        file: ch04/bayes-to-fe.yaml
        summary: 'The variational step: replace the exact posterior by a tractable belief and minimize.'
      - id: ch04-generative-models
        title: "Generative Models"
        kind: concept
        file: ch04/generative-models.yaml
        summary: 'Likelihood, prior and factorized models; what a generative model is for.'
      - id: ch04-pomdp
        title: "Partially Observable Markov Decision Processes"
        kind: concept
        file: ch04/pomdp.yaml
        summary: 'The discrete-time model: hidden states, outcomes, transitions, policies.'
      - id: ch04-pomdp-active-inference
        title: "Active Inference in a POMDP"
        kind: concept
        file: ch04/pomdp-active-inference.yaml
        summary: 'Beliefs over states and policies, and how the expected free energy picks actions.'
      - id: ch04-laplace
        title: "Guided Problem: The Laplace Approximation"
        kind: guided
        file: ch04/laplace.yaml
        summary: 'Approximate a posterior by a Gaussian and derive the free energy that results.'
      - id: ch04-predictive-coding
        title: "A Generative Model for Predictive Coding"
        kind: concept
        file: ch04/predictive-coding.yaml
        summary: 'The continuous-time model: hidden causes, states, prediction errors.'
      - id: ch04-motor-reflexes
        title: "Predictive Coding with Motor Reflexes"
        kind: concept
        file: ch04/motor-reflexes.yaml
        summary: 'How prediction errors in proprioception drive movement.'
      - id: ch04-mean-field
        title: "Guided Problem: Mean-Field Variational Bayes"
        kind: guided
        file: ch04/mean-field.yaml
        summary: 'Derive the update of one factor of an approximate posterior with the others held fixed.'
      - id: ch04-model-traps
        title: "Generative Model Traps"
        kind: traps
        file: ch04/model-traps.yaml
        summary: 'Misconceptions about likelihoods, priors, states and policies.'
      - id: ch04-intuition-models
        title: "Intuition: The Two Model Families"
        kind: intuition
        file: ch04/intuition-models.yaml
        summary: 'Quick recall of the POMDP and predictive-coding equations.'
      - id: ch04-map
        title: "Content Map"
        kind: map
        file: ch04/map.yaml
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch04-review, title: Level Review, kind: review }
      - id: ch04-challenge
        title: Level Challenge
        kind: challenge
        file: ch04/challenge.yaml
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch05
    number: 5
    title: Message Passing and Neurobiology
    blurb: 'How belief updating could be implemented by cortical circuits, and what the neuromodulators do.'
    lessons:
      - id: ch05-microcircuits
        title: "Microcircuits and Messages"
        kind: concept
        file: ch05/microcircuits.yaml
        summary: 'Which neuronal populations could carry predictions and prediction errors.'
      - id: ch05-motor-subcortical
        title: "Motor Commands and Subcortical Structures"
        kind: concept
        file: ch05/motor-subcortical.yaml
        summary: 'Spinal reflexes, the basal ganglia and thalamus in the active inference picture.'
      - id: ch05-neuromodulation
        title: "Neuromodulation and Learning"
        kind: concept
        file: ch05/neuromodulation.yaml
        summary: 'Precision, dopamine and the other modulators, and synaptic plasticity as learning.'
      - id: ch05-hierarchies
        title: "Continuous and Discrete Hierarchies"
        kind: concept
        file: ch05/hierarchies.yaml
        summary: 'How a discrete model sits on top of a continuous one.'
      - id: ch05-neuro-traps
        title: "Neurobiology Traps"
        kind: traps
        file: ch05/neuro-traps.yaml
        summary: 'Over-reading the mapping between the equations and the brain.'
      - id: ch05-map
        title: "Content Map"
        kind: map
        file: ch05/map.yaml
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch05-review, title: Level Review, kind: review }
      - id: ch05-challenge
        title: Level Challenge
        kind: challenge
        file: ch05/challenge.yaml
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch06
    number: 6
    title: A Recipe for Designing Active Inference Models
    blurb: 'Four steps from a question about a system to a simulation.'
    lessons:
      - id: ch06-recipe
        title: "The Recipe in Four Steps"
        kind: concept
        file: ch06/recipe.yaml
        summary: 'What system, what form of model, what variables, what generative process.'
      - id: ch06-model-form
        title: "Discrete or Continuous, Shallow or Deep"
        kind: concept
        file: ch06/model-form.yaml
        summary: 'Choosing the form of the generative model and the timescales.'
      - id: ch06-model-setup
        title: "Setting Up the Variables"
        kind: concept
        file: ch06/model-setup.yaml
        summary: 'Which parts are fixed and which are learned.'
      - id: ch06-design-example
        title: "Guided Problem: Designing a Small Model"
        kind: guided
        file: ch06/design-example.yaml
        summary: 'Apply the recipe to a small decision task from scratch.'
      - id: ch06-recipe-traps
        title: "Recipe Traps"
        kind: traps
        file: ch06/recipe-traps.yaml
        summary: 'Common modeling mistakes when specifying a generative model.'
      - id: ch06-map
        title: "Content Map"
        kind: map
        file: ch06/map.yaml
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch06-review, title: Level Review, kind: review }
      - id: ch06-challenge
        title: Level Challenge
        kind: challenge
        file: ch06/challenge.yaml
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch07
    number: 7
    title: Active Inference in Discrete Time
    blurb: 'Perception, planning, information seeking, learning and hierarchy in the POMDP.'
    lessons:
      - id: ch07-perceptual-processing
        title: "Perceptual Processing"
        kind: concept
        summary: 'State inference by message passing in a POMDP.'
      - id: ch07-decision-planning
        title: "Decision-Making and Planning"
        kind: concept
        summary: 'Policy posteriors from expected free energy.'
      - id: ch07-state-inference
        title: "Guided Problem: Deriving the State Update"
        kind: guided
        summary: 'Derive the belief update for hidden states from the free energy.'
      - id: ch07-information-seeking
        title: "Information Seeking"
        kind: concept
        summary: 'The epistemic value of an action and why curiosity falls out of the maths.'
      - id: ch07-efe-derivation
        title: "Guided Problem: The Expected Free Energy of a Policy"
        kind: guided
        summary: 'Derive $G$ for a policy and read off its terms.'
      - id: ch07-learning-novelty
        title: "Learning and Novelty"
        kind: concept
        summary: 'Dirichlet priors, parameter learning and novelty-seeking.'
      - id: ch07-deep-inference
        title: "Hierarchical or Deep Inference"
        kind: concept
        summary: 'How a higher level provides context for a lower one.'
      - id: ch07-discrete-traps
        title: "Discrete-Time Traps"
        kind: traps
        summary: 'Mistakes with policies, precision and the epistemic term.'
      - id: ch07-intuition-discrete
        title: "Intuition: Discrete-Time Update Equations"
        kind: intuition
        summary: 'Quick recall of the belief, policy and learning updates.'
      - id: ch07-map
        title: "Content Map"
        kind: map
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch07-review, title: Level Review, kind: review }
      - id: ch07-challenge
        title: Level Challenge
        kind: challenge
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch08
    number: 8
    title: Active Inference in Continuous Time
    blurb: 'Movement, dynamical systems, synchrony and hybrid models.'
    lessons:
      - id: ch08-movement-control
        title: "Movement Control"
        kind: concept
        summary: 'Moving by fulfilling proprioceptive predictions.'
      - id: ch08-dynamical-systems
        title: "Dynamical Systems"
        kind: concept
        summary: 'Generalized coordinates and what a continuous model predicts over time.'
      - id: ch08-generalized-filtering
        title: "Guided Problem: Generalized Filtering"
        kind: guided
        summary: 'Derive the gradient descent on free energy in generalized coordinates.'
      - id: ch08-synchrony
        title: "Generalized Synchrony"
        kind: concept
        summary: 'Why two coupled systems that infer each other lock together.'
      - id: ch08-hybrid
        title: "Hybrid Models"
        kind: concept
        summary: 'A discrete decision layer sending priors to a continuous movement layer.'
      - id: ch08-continuous-traps
        title: "Continuous-Time Traps"
        kind: traps
        summary: 'Mistakes with prediction errors, precision and generalized coordinates.'
      - id: ch08-map
        title: "Content Map"
        kind: map
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch08-review, title: Level Review, kind: review }
      - id: ch08-challenge
        title: Level Challenge
        kind: challenge
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch09
    number: 9
    title: Model-Based Data Analysis
    blurb: 'Fitting an active inference model to the behaviour of a real subject.'
    lessons:
      - id: ch09-meta-bayesian
        title: "Meta-Bayesian Methods"
        kind: concept
        summary: 'Inferring the generative model of someone who is doing inference.'
      - id: ch09-variational-laplace
        title: "Variational Laplace"
        kind: concept
        summary: 'Fitting parameters with a Gaussian posterior.'
      - id: ch09-peb
        title: "Parametric Empirical Bayes"
        kind: concept
        summary: 'Group-level inference on parameters.'
      - id: ch09-analysis-steps
        title: "Instructions for Model-Based Analysis"
        kind: concept
        summary: 'The pipeline from task to model comparison.'
      - id: ch09-false-inference
        title: "Models of False Inference"
        kind: concept
        summary: 'Illusions, hallucinations and the model failures behind them.'
      - id: ch09-analysis-traps
        title: "Model-Fitting Traps"
        kind: traps
        summary: 'Mistakes in fitting and comparing models.'
      - id: ch09-map
        title: "Content Map"
        kind: map
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch09-review, title: Level Review, kind: review }
      - id: ch09-challenge
        title: Level Challenge
        kind: challenge
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch10
    number: 10
    title: Active Inference as a Unified Theory of Sentient Behavior
    blurb: 'How the framework relates to the other theories of brain and behaviour.'
    lessons:
      - id: ch10-predictive-processing
        title: "Predictive Brains and Perception"
        kind: concept
        summary: 'Predictive processing and the Bayesian brain hypothesis.'
      - id: ch10-action-theories
        title: "Action Control"
        kind: concept
        summary: 'Ideomotor theory, cybernetics and optimal control.'
      - id: ch10-decision-theories
        title: "Utility and Decision-Making"
        kind: concept
        summary: 'Bayesian decision theory, reinforcement learning and planning as inference.'
      - id: ch10-rationality-emotion
        title: "Bounded Rationality, Emotion and Homeostasis"
        kind: concept
        summary: 'Valence, allostasis and interoception.'
      - id: ch10-attention-learning
        title: "Attention, Rule Learning and Open Directions"
        kind: concept
        summary: 'Salience, causal inference, and social and machine learning applications.'
      - id: ch10-map
        title: "Content Map"
        kind: map
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch10-review, title: Level Review, kind: review }
      - id: ch10-challenge
        title: Level Challenge
        kind: challenge
        summary: 'Harder problems that combine the level''s concepts.'
