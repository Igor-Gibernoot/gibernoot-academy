outroTitle: Level 2 in one picture
outro: |
  Both branches start from the **generative model** $P(y,x)=P(y\mid x)\,P(x)$, a likelihood times a prior over the hidden state $x$ for an observation $y$.

  **Left, the present.** The exact posterior $P(x\mid y)$ is intractable, so the creature holds an approximate belief $Q(x)$ and minimises the variational free energy

  $$\begin{aligned}F[Q,y]=\;&D_{KL}[Q(x)\,\|\,P(x\mid y)]\\&-\ln P(y)\\\ge\;&-\ln P(y)\end{aligned}$$

  **Perception** lowers $F$ by changing $Q$; **action** lowers it by changing $y$. Either way surprise $-\ln P(y)$ is kept low.

  **Right, the future.** For each policy $\pi$ the creature predicts outcomes and scores the policy by the expected free energy

  $$\begin{aligned}G(\pi)&=\text{ambiguity}+\text{risk}\\&=-\text{gain}-\text{pragmatic}\end{aligned}$$

  (minimised, never negated), then turns the scores into beliefs with $P(\pi)=\sigma(-\gamma G)$.
