  - type: mcq
    id: p5-limits
    tag: Problem 5 · How sharp a choice
    prompt: |
      Policies have expected free energies $G=0.548,\ 0.697,\ 0.950$ and are chosen with $P(\pi)=\sigma(-\gamma G)$. Which statement is correct?
    options:
      - text: 'At $\gamma=0$ all policies are equally likely; as $\gamma$ grows the lowest-$G$ policy approaches probability $1$; and for every $\gamma>0$ the order of the probabilities is the order of $-G$.'
        correct: true
      - text: 'A large $\gamma$ can reorder the policies: for $\gamma=10$ the policy with the highest $G$ can overtake the others.'
        feedback: |
          $e^{-\gamma G}$ decreases with $G$ for every $\gamma>0$, so a lower $G$ always has a higher probability. $\gamma$ only stretches the differences: the ranking is fixed by $G$.
      - text: 'As $\gamma\to\infty$ every exponential $e^{-\gamma G}$ goes to $0$, so the choice becomes uniform.'
        feedback: |
          They all vanish, but at different speeds: the ratio of the first two is $e^{0.149\gamma}$, which grows. At $\gamma=10$ the probabilities are already about $0.80,\ 0.18,\ 0.01$.
      - text: 'A negative $\gamma$ changes nothing, because the softmax normalises the probabilities anyway.'
        feedback: |
          Normalising does not remove the sign. With $\gamma=-1$ the exponents flip and the probabilities are $0.274,\ 0.318,\ 0.409$: the **worst** policy is favoured. $\gamma$ is a positive precision.
    explanation: |
      At $\gamma=0$ the exponent vanishes and $P(\pi)=1/3$ each. At $\gamma=0.5$ it is $0.364,\ 0.338,\ 0.298$; at $1$, $0.395,\ 0.341,\ 0.264$; at $2$, $0.457,\ 0.339,\ 0.204$; at $10$, about $0.80,\ 0.18,\ 0.01$. The precision sets the **sharpness** (how decisively the lowest $G$ wins), never the **ranking**, which only $G$ decides.

  - type: text
    id: summary
    title: What you now own
    body: |
      - **Perception is a Bayes update, and surprise adds up.** With a hidden cause $x$ (rain, branch, bird: priors $0.5, 0.3, 0.2$) and an observation $y$ (a tap, likelihoods $0.2, 0.6, 0.5$), the evidence and the posterior are
        $$\begin{aligned}P(y)&=\sum_x P(y\mid x)P(x)\\ P(x\mid y)&=\frac{P(y\mid x)P(x)}{P(y)}\end{aligned}$$
        giving $P(y)=0.38$, posterior $(0.263,\,0.474,\,0.263)$ and surprise $-\ln P(y)=0.968$ nats. The posterior is the prior for the next observation: a second tap has evidence $0.4684$ (surprise $0.758$), and the total $1.726=-\ln(0.38\times0.4684)$.
      - **Free energy is a bound, and its excess is a divergence.** For a guess $Q(x)$ of the posterior in the same tap model,
        $$\begin{aligned}F&=\sum_x Q(x)\big[\ln Q(x)-\ln P(y,x)\big]\\ &=-\ln P(y)+D_{KL}[Q(x)\parallel P(x\mid y)]\\ &\ge-\ln P(y).\end{aligned}$$
        $Q=$ prior has $F=1.097$ (gap $0.129$), uniform $1.008$, all on the branch $1.715$, the exact posterior $0.968$: the best guess is the posterior, not its peak.
      - **Policies are scored by $G$ and chosen by a softmax.** For a policy $\pi$ with predicted outcomes $Q(\tilde{y}\mid\pi)$, preferences $P(\tilde{y}\mid C)$ and likelihood $P(\tilde{y}\mid\tilde{x})$ (hidden state $\tilde{x}$, outcome $\tilde{y}$),
        $$\begin{aligned}G&=\text{ambiguity}+\text{risk}\\ &=-\text{gain}-\text{pragmatic value}\end{aligned}$$
        with $P(\pi)=\sigma(-\gamma G)$ for the precision $\gamma$. A robin with preferences $(0.8,\,0.2)$ for (worm, no worm) scores Lawn, Mud, Bed at $G=0.548,\,0.697,\,0.950$: the lowest risk (Mud) and the lowest ambiguity (Bed) each lose to the policy that balances both (Lawn), and at $\gamma=1$ the probabilities are $0.395,\,0.341,\,0.264$.
      - **Perception moves $Q$, action moves $y$.** Porch light: hidden state $x\in\{\text{home},\text{away}\}$ with prior $P(x)=(0.7,\,0.3)$, observation $y\in\{\text{on},\text{off}\}$ with $P(\text{on}\mid x)=(0.9,\,0.2)$. For a guess $Q(x)$ the free energy (minimised) obeys
        $$\begin{aligned}F&=\sum_x Q(x)\big[\ln Q(x)-\ln P(y,x)\big]\\ &=-\ln P(y)+D_{KL}[Q(x)\parallel P(x\mid y)].\end{aligned}$$
        With the light **off** and $Q=$ prior, $F=1.679$; perception moves $Q$ to the posterior $(0.226,\,0.774)$ and $F$ falls to the surprise $1.171$. Action, switching the light **on**, changes $y$ itself: the floor drops to $-\ln P(\text{on})=0.371$, $F$ at the old $Q$ is $0.557$, and the new posterior is $(0.913,\,0.087)$. Perception shrinks the divergence; action changes the surprise.
      - **The precision $\gamma$ sets how sharp the choice is, never the ranking.** For policies with expected free energies $G(\pi)$ (minimised),
        $$\begin{aligned}P(\pi)&=\sigma(-\gamma G)=\frac{e^{-\gamma G(\pi)}}{\sum_{\pi'}e^{-\gamma G(\pi')}}\\ \frac{P(\pi)}{P(\pi')}&=e^{\gamma\,(G(\pi')-G(\pi))}.\end{aligned}$$
        For the robin's $G=0.548,\,0.697,\,0.950$: $\gamma=0$ gives $\tfrac13$ each, $\gamma=1$ gives $0.395,\,0.341,\,0.264$, $\gamma=2$ gives $0.457,\,0.339,\,0.204$, and $\gamma=10$ gives about $0.80$ to the lowest $G$. Large $\gamma$ approaches choosing the minimum of $G$; $\gamma<0$ would favour the worst policy.
