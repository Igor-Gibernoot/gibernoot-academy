id: ch01-challenge
title: Level Challenge
kind: challenge
cards:
  - type: text
    id: intro
    title: "Harder, still guess first"
    body: |
      Three problems that **combine** what Level 1 taught. Same rule as always: **guess first**; a wrong guess is fine and every answer comes with a reason. A pencil helps, but every number can be checked by hand.

      The toolkit, in three lines:

      - A creature keeps its sensations inside the range that keeps it alive. When what it **expects** to sense differs from what it **senses**, the gap is a **prediction error**, and it has two levers: *change its mind* (perceive) or *change the world* (act).
      - Perceiving is guessing the **hidden cause** (a thing you cannot observe, only infer) behind your sensations, mixing the **prior** (what you expected beforehand) with the **evidence** (how well each cause explains the sensation).
      - Acting is choosing a **policy** (a sequence of actions), scored on how well its predicted sensations fit your goals and on how much uncertainty it is expected to resolve.

      1. A fish in water that is too warm: error and the two levers.
      2. A splash in a pond: three possible causes, and a reversal.
      3. A cold creature choosing between going straight to warmth and looking around first.

  # ---------------------------------------------------------------- Problem 1
  - type: text
    id: p1-setup
    tag: Problem 1 · The fish and the warm water
    title: "Too warm for a fish"
    body: |
      A fish stays healthy only in water between $18$ and $26\,{}^\circ\text{C}$, and it **expects** to sense about $22\,{}^\circ\text{C}$. On a hot afternoon it drifts into a sunlit shallow patch and senses $30\,{}^\circ\text{C}$. Just below, there is deeper, cooler water at $22\,{}^\circ\text{C}$ that it can swim down to.

      Recall: the **prediction error** is the gap between what the creature expects to sense and what it senses, computed as expected minus sensed.

  - type: numeric
    id: p1-error
    tag: Problem 1 · The fish and the warm water
    prompt: |
      A fish expects to sense $22\,{}^\circ\text{C}$ and senses $30\,{}^\circ\text{C}$. Taking prediction error as expected minus sensed, what is the prediction error in ${}^\circ\text{C}$?
    answer: -8
    answerText: '-8'
    wrong:
      - { value: 8, feedback: 'The size is right but the sign is not. Expected minus sensed is $22-30=-8$: negative means the sensation is *warmer* than expected. Sensed minus expected would give $+8$.' }
      - { value: 52, feedback: 'You added the two temperatures. The error is their difference, not their sum: $22-30$.' }
    hint: Subtract the sensed value from the expected one, in that order.
    explanation: |
      $$\begin{aligned}\text{prediction error} &= \text{expected} - \text{sensed}\\ &= 22-30=-8\,{}^\circ\text{C}.\end{aligned}$$
      The sign tells the direction: the water is $8$ degrees *warmer* than the fish expects, and $30$ is outside its safe band $18$ to $26$.

  - type: mcq
    id: p1-lever
    tag: Problem 1 · The fish and the warm water
    prompt: |
      The fish senses $30\,{}^\circ\text{C}$ but expects $22\,{}^\circ\text{C}$, and its safe band is $18$ to $26\,{}^\circ\text{C}$. Which single move both removes the error **and** keeps the fish alive?
    options:
      - text: Swim down to the cooler water, so that it senses about $22\,{}^\circ\text{C}$ (change the world).
        correct: true
      - text: Change its expectation to "I expect $30\,{}^\circ\text{C}$" (change its mind).
        feedback: |
          Tempting, because the error becomes $30-30=0$ on paper. But the fish's body is still at $30\,{}^\circ\text{C}$, outside the band where it survives. Giving up the expectation does nothing for the body: it removes the *error*, not the *danger*.
      - text: Keep both the expectation and the position, and wait for the sun to move.
        feedback: |
          Doing nothing leaves the error at $-8$ and the fish outside its safe band for as long as it waits. Waiting is not a lever: neither the belief nor the world changes by the fish's own effort.
    explanation: |
      Both levers shrink the gap, but only **acting** moves the body back into the safe range. The expectation $22\,{}^\circ\text{C}$ is the fish's set-point (the value it tries to reach), and swimming is how it gets there.

  - type: mcq
    id: p1-belief-only
    tag: Problem 1 · The fish and the warm water
    prompt: |
      Suppose the fish **only** changes its belief, and keeps doing so every time it senses $30\,{}^\circ\text{C}$ ("this is just how water is"). What is the long-run result?
    options:
      - text: The prediction error shrinks toward $0$ but the fish stays at about $30\,{}^\circ\text{C}$, outside its safe band, so the real danger remains.
        correct: true
      - text: The prediction error stays at $-8$ forever, because beliefs never change.
        feedback: |
          Beliefs do change: that is exactly the first lever. Here, adopting "water is $30$" shrinks the error, which is why the lever is tempting.
      - text: The fish ends at $22\,{}^\circ\text{C}$, because belief and body always agree in the end.
        feedback: |
          A belief cannot heat or cool the body. Only actions (or the environment) change the temperature the fish actually senses, so the body stays where it is.
    explanation: |
      A creature that only perceives ends up with an accurate picture of how bad things are, and nothing better. To stay alive it must also act. The goal $22\,{}^\circ\text{C}$ has to stay a *prediction the world is made to fulfil*, not a belief that gives way.

  - type: order
    id: p1-order
    tag: Problem 1 · The fish and the warm water
    prompt: Put the fish's loop in order, from the first step to the last.
    steps:
      - 'It expects $22\,{}^\circ\text{C}$ and senses $30\,{}^\circ\text{C}$.'
      - 'The prediction error is $22-30=-8$: the water is warmer than expected.'
      - 'It acts: it swims down toward cooler water.'
      - 'It senses about $23\,{}^\circ\text{C}$, so the error shrinks to $22-23=-1$.'
    hint: Sense first, then compare, then act, then sense the new world.
    explanation: |
      This is the action-perception loop: sense, compare with the expectation, act, and sense again. The error went from $-8$ to $-1$ because the *world* changed, and the body is back inside $18$ to $26\,{}^\circ\text{C}$.

  # ---------------------------------------------------------------- Problem 2
  - type: text
    id: p2-setup
    tag: Problem 2 · A splash in the dark
    title: "Something splashes"
    body: |
      At night, beside a pond, you hear a loud splash. You cannot see what made it. Three **hidden causes** are possible. Before the splash, you thought:

      | Cause | Prior (before the splash) | Evidence (how well it explains a *loud* splash) |
      |---|---|---|
      | Frog | $0.6$ | $0.2$ |
      | Duck | $0.3$ | $0.5$ |
      | Otter | $0.1$ | $0.9$ |

      Recall: each cause's share of belief is proportional to prior times evidence, then rescaled so the shares add up to $100\%$.

  - type: numeric
    id: p2-belief
    tag: Problem 2 · A splash in the dark
    prompt: |
      Three possible causes of a splash have priors $0.6$ (frog), $0.3$ (duck), $0.1$ (otter) and evidence $0.2$, $0.5$, $0.9$. Multiply prior by evidence for each, rescale to add up to $100\%$, and give the belief in the **most believed** cause, in percent.
    answer: 41.7
    tolerance: 0.5
    answerText: '42'
    wrong:
      - { value: 33.3, feedback: 'That is the frog, whose share is $0.12/0.36$. The duck has the biggest product, $0.15$.' }
      - { value: 25, feedback: 'That is the otter, $0.09/0.36$. It explains the splash best, but its low prior holds it back.' }
      - { value: 90, feedback: 'You read off the largest evidence. The belief also needs the prior, and then the rescaling.' }
    hint: The three products add up to $0.36$; divide the biggest product by that sum.
    explanation: |
      Products: frog $0.6\times0.2=0.12$, duck $0.3\times0.5=0.15$, otter $0.1\times0.9=0.09$. Their sum is $0.36$, so
      $$\begin{aligned}\text{duck}&=\tfrac{0.15}{0.36}\approx 42\%\\ \text{frog}&\approx 33\%\\ \text{otter}&=25\%\end{aligned}$$

  - type: mcq
    id: p2-best-explainer
    tag: Trap
    prompt: |
      The otter explains a loud splash best (evidence $0.9$, the largest) yet ends with the **smallest** belief, $25\%$. A friend says "belief should simply follow the evidence, so the otter should win". Why does the otter lose?
    options:
      - text: Its prior is tiny ($0.1$); even the best explanation of the sound cannot lift a cause you thought very unlikely beforehand above the others.
        correct: true
      - text: The evidence was wrong, so the otter should have been believed anyway.
        feedback: |
          Nothing is wrong with the evidence here: the splash is loud and the otter would explain it well. The point is that belief mixes evidence with the prior; it does not copy the evidence.
      - text: Beliefs always favour the cause with the largest prior, and the frog has it.
        feedback: |
          If only the prior counted, the frog ($0.6$) would win; but the belief gives it just $33\%$, because its evidence ($0.2$) is poor. Prior alone is as wrong as evidence alone.
    explanation: |
      Belief $\propto$ prior $\times$ evidence. The otter's product is $0.1\times0.9=0.09$, the smallest of the three. It would win only if its prior were larger, or the evidence much sharper.

  - type: mcq
    id: p2-flatten
    tag: Problem 2 · A splash in the dark
    prompt: |
      Now it is foggy and your senses are noisy, so every cause explains the splash almost equally: the evidence becomes frog $0.4$, duck $0.5$, otter $0.6$ (priors still $0.6$, $0.3$, $0.1$). Which cause is now believed most?
    options:
      - text: The frog, with about $53\%$.
        correct: true
      - text: The duck, as before, because it won last time.
        feedback: |
          With flatter evidence the products are $0.24$, $0.15$, $0.06$, and the duck is now second. A cause that won with sharp evidence can lose it once the evidence stops separating the causes.
      - text: The otter, because it still has the largest evidence ($0.6$).
        feedback: |
          Its evidence is still the largest, but only slightly ($0.6$ against $0.4$). Its prior is $0.1$, so its product is $0.06$, the smallest.
    explanation: |
      Products: frog $0.6\times0.4=0.24$, duck $0.3\times0.5=0.15$, otter $0.1\times0.6=0.06$, summing to $0.45$. So
      $$\begin{aligned}\text{frog}&=\tfrac{0.24}{0.45}\approx 53\%\\ \text{duck}&\approx 33\%\\ \text{otter}&\approx 13\%\end{aligned}$$
      The leading cause **flipped**. When the senses are noisy, the evidence is weak and the **prior takes over**: the answer follows what you expected before hearing anything.

  # ---------------------------------------------------------------- Problem 3
  - type: text
    id: p3-setup
    tag: Problem 3 · Go, or look first?
    title: "A cold creature with two plans"
    body: |
      A creature is cold and wants to warm up. It knows one sunny rock, but it is **not sure** the rock is still warm, and it has never explored the far side of the clearing, where there might be a better spot. It compares three **policies** (sequences of actions). Each gets two numbers, bigger is better:

      - **Fit to goals**: how well the sensations it is predicted to bring match "warm".
      - **Uncertainty resolved**: how much the policy is expected to teach it about what it does not yet know (looking is informative).

      | Policy | Fit to goals | Uncertainty resolved |
      |---|---|---|
      | Walk straight to the known rock | $6$ | $0$ |
      | Look around the clearing first, then decide | $4$ | $3$ |
      | Stay put | $1$ | $0$ |

      The score of a policy is the sum of its two numbers. (In the course this score is the *expected free energy* of the policy, where lower is better; here the sign is flipped so that bigger is better.)

  - type: numeric
    id: p3-best
    tag: Problem 3 · Go, or look first?
    prompt: |
      Three policies have (fit to goals, uncertainty resolved) of $(6,0)$ for going straight to the rock, $(4,3)$ for looking around first, and $(1,0)$ for staying put. The score is the sum of the two numbers and bigger is better. What is the score of the best policy?
    answer: 7
    wrong:
      - { value: 6, feedback: 'That is the best on goals alone (the rock). Looking around has a lower fit ($4$) but resolves uncertainty ($3$), and the score counts both.' }
      - { value: 3, feedback: 'You took only the uncertainty part. The score adds the fit to goals as well: $4+3$.' }
    hint: Add the two numbers of each policy, then pick the biggest sum.
    explanation: |
      Rock: $6+0=6$. Looking around: $4+3=7$. Staying put: $1+0=1$. Looking around wins narrowly: giving up a little warmth ($4$ instead of $6$) pays for itself in what it teaches.

  - type: mcq
    id: p3-learned
    tag: Problem 3 · Go, or look first?
    prompt: |
      Next day, the creature has explored everything and knows the clearing. Looking around now reveals nothing new: (fit, uncertainty resolved) becomes $(4,0)$, while the rock stays at $(6,0)$. Which policy wins now?
    options:
      - text: Walk straight to the rock, with $6$ against $4$.
        correct: true
      - text: Look around first, because looking is always worth doing.
        feedback: |
          Looking is worth only what it teaches. With nothing left to learn, its second number is $0$ and it only costs warmth ($4$ against $6$).
      - text: Both tie, because the creature is now certain.
        feedback: |
          They tie only in the second part ($0$ and $0$). The first part still differs, $6$ against $4$, so the rock wins.
    explanation: |
      The same scoring rule now gives the opposite answer, because the uncertainty has been used up. No change of rule was needed, only a change in what there is left to learn.

  - type: mcq
    id: p3-no-switch
    tag: Trap
    prompt: |
      A student says: "The creature must decide when to switch from exploring to exploiting, so it needs a separate switch for that." What does the example of the two days show?
    options:
      - text: One score adds both parts; exploring dominates while uncertainty is high and fades by itself when it is gone, so no extra switch is needed.
        correct: true
      - text: There must be a hidden switch that turns off the exploring part on the second day.
        feedback: |
          Nothing was turned off. The second part of the score simply became $0$ because there was nothing left to learn; the rule itself never changed.
      - text: The creature should always explore first and only then exploit, in two separate stages.
        feedback: |
          That is a fixed schedule, and it would waste time looking when nothing is unknown (day two). The single score decides case by case.
    explanation: |
      In active inference, seeking information and seeking goals are not rivals with a referee between them: they are two parts of one score. A big unknown makes looking attractive; a known world makes going straight attractive.

  - type: text
    id: summary
    title: What you now own
    body: |
      - **Prediction error is expectation minus sensation.** A fish whose safe water is $18$ to $26\,{}^\circ\text{C}$ *expects* to sense $22\,{}^\circ\text{C}$ and senses $30\,{}^\circ\text{C}$. Its **prediction error** (the gap between what it expects and what it senses) is
        $$\begin{aligned}\text{prediction error} &= \text{expected} - \text{sensed}\\ &= 22-30=-8\,{}^\circ\text{C}\end{aligned}$$
        Only acting (swimming to cooler water) shrinks the error *and* keeps the body inside its safe range; changing the expectation to "$30$" removes the error on paper but not the danger.
      - **A belief is prior times evidence, rescaled.** With hidden causes (things you cannot observe, only infer from their effects on your senses), the **prior** is what you expected beforehand and the **evidence** is how well each cause explains the sensation. Each cause's share of belief follows
        $$\text{belief} \;\propto\; \text{prior} \times \text{evidence},$$
        then the shares are rescaled to add up to $100\%$. For priors $0.6, 0.3, 0.1$ and evidence $0.2, 0.5, 0.9$ the products are $0.12, 0.15, 0.09$ and the beliefs $33\%, 42\%, 25\%$. Neither the prior alone nor the evidence alone decides the belief: flatten the evidence to $0.4, 0.5, 0.6$ (noisy senses) and the first cause wins with $53\%$.
      - **A policy is scored on two parts that simply add.** A **policy** is a sequence of actions. Its score (the expected free energy, here written with the sign flipped so that bigger is better) adds
        $$\begin{aligned}\text{score} &= \text{fit to goals}\\ &\quad+\text{uncertainty resolved}\end{aligned}$$
        Looking around wins while there is still something to learn; once the surroundings are known, the second part is $0$ and the policy that heads for the goal wins, with no separate exploration switch.

      **Next:** problems 4 and 5, the last two of the Level Challenge, combine all the pieces at once, from the loop to the choice of policy.
