id: ch01-map
title: "Content Map: Overview"
kind: map
name: Level 1, Overview (how a creature stays alive by guessing and acting)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a sentence. An arrow goes from an idea to one that builds on it, and its label says how: read it as a sentence, for example "the loop *makes* surprise matter".

  You will rebuild the map of this level one box at a time. For each glowing box, pick the card that belongs there. As in every lesson of this level, **guessing is the point**: the other cards look alike, but each hides a classic mistake, and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: loop
    title: Creature and environment
    row: 1
    col: 1
    span: 3
    body: |
      A **creature** and its **environment** form a loop: the environment sends **observations** into the creature, and the creature sends **actions** back out, changing what it will observe next.
    decoys:
      - body: |
          A **creature** sits apart from its **environment** and only receives **observations**: it reads the world like a screen, and nothing it does changes what comes next.
        feedback: |
          Tempting, because we often picture perceiving as passive. But the creature also acts: moving, heating, eating. Actions change the environment, and that changes the next observations, which is why it is a loop.
      - body: |
          A **creature** sends **actions** into the **environment** and gets back **observations** that always show the environment exactly as it is.
        feedback: |
          Actions are right, but observations are only effects of hidden causes, often noisy. The creature never sees the world itself, only what it does to its senses (the second lesson).
    explanation: |
      This is the stage on which everything else happens: whatever the creature does, it does inside this action-perception loop.

  - id: surprise
    title: Surprise
    row: 2
    col: 1
    span: 3
    body: |
      **Surprise** measures how far the creature's current sensations are from the sensations that keep it intact (for a fish: water, not dry sand). A living thing must keep it low.
    decoys:
      - body: |
          **Surprise** is the feeling of shock when something unexpected and dramatic happens. A living thing should avoid shocks.
        feedback: |
          Here "surprise" is technical, not an emotion. A slow, unnoticed drift of body temperature out of the safe range is highly surprising in this sense, with no shock at all.
      - body: |
          **Surprise** measures how far the creature's current sensations are from the *world's* true state. A living thing must keep it low.
        feedback: |
          Surprise compares sensations with the sensations that keep the creature alive, not with some true state of the world. The creature only ever gets sensations.
    explanation: |
      Persisting means staying in the sensations that are compatible with being alive. Surprise is the score of how well that is going.

  - id: prior
    title: Prior
    row: 3
    col: 1
    body: |
      The **prior** is what you expected about the hidden cause **before** the sensation arrived, from past experience.
    decoys:
      - body: |
          The **prior** is what you conclude about the hidden cause **after** the sensation arrived.
        feedback: |
          That is the belief, the result of mixing. The prior is the starting ingredient, held before the sensation.
      - body: |
          The **prior** is the sensation itself, as it reaches your senses.
        feedback: |
          The sensation is the data. The prior is an expectation about the cause, which exists before any data comes in.
    explanation: |
      Priors are what make guessing possible when the senses are ambiguous or noisy.

  - id: evidence
    title: Evidence
    row: 3
    col: 2
    body: |
      The **evidence** says how well each possible cause would explain the sensation you actually got.
    decoys:
      - body: |
          The **evidence** says how likely each possible cause was beforehand, whatever you sensed.
        feedback: |
          That is the prior. Evidence looks at the sensation you got and asks which causes would produce it.
      - body: |
          The **evidence** is the cause itself: the sensation simply is the thing out there.
        feedback: |
          Sensations are effects, not causes. A rustle is not the animal; several animals could make it, which is why evidence can only score the possible causes.
    explanation: |
      Together with the prior, the evidence is the second ingredient of every guess.

  - id: error
    title: Prediction error
    row: 3
    col: 3
    body: |
      The **prediction error** is the gap between what you expect and what you sense:

      $$\begin{aligned}\text{prediction error} &= \text{expected} \\ &\quad - \text{sensed}\end{aligned}$$

      A large gap means large surprise.
    decoys:
      - body: |
          The **prediction error** is the gap between what you sense and what is really out there:

          $$\begin{aligned}\text{prediction error} &= \text{sensed} \\ &\quad - \text{real}\end{aligned}$$
        feedback: |
          The creature has no access to "what is really out there" to compare with. The error compares two things it does have: its expectation and its sensation.
      - body: |
          The **prediction error** is a mistake the creature must never make: if it appears, the creature has failed.
        feedback: |
          An error is not a failure but a signal. It is exactly the quantity that tells the creature something must change, by perceiving or by acting.
    explanation: |
      The error is how surprise shows up inside the creature, and both ways of reducing it start from here.

  - id: belief
    title: Belief
    row: 4
    col: 1
    span: 2
    body: |
      A **belief** is a spread of confidence over the possible hidden causes, found by mixing prior and evidence:

      $$\text{belief} \;\propto\; \text{prior} \times \text{evidence}.$$
    decoys:
      - body: |
          A **belief** follows the evidence only, as a spread of confidence over the causes:

          $$\text{belief} \;\propto\; \text{evidence}.$$
        feedback: |
          This ignores what you expected. With noisy senses the prior decides, and two creatures hearing the same sound can rightly believe different things.
      - body: |
          A **belief** is a single verdict, the one most likely cause, found by adding prior and evidence:

          $$\text{belief} = \text{prior} + \text{evidence}.$$
        feedback: |
          Two slips. A belief keeps the whole spread of confidence (69% cat, 31% dog). And the two ingredients combine by multiplying, then rescaling to add up to 100%.
    explanation: |
      Perceiving is guessing, and good guessing uses both ingredients.

  - id: act
    title: Lever 2, action
    row: 4
    col: 3
    body: |
      **Action** changes the world until the sensations match the expectation. A goal is a **prior prediction**, a set-point (like a thermostat's), and action is whatever reduces the prediction error to it.
    decoys:
      - body: |
          **Action** changes the expectation until it matches the sensations. A goal is whatever you currently sense.
        feedback: |
          That is the other lever, changing your mind. A cold creature that drops its expectation to match its cold body is still cold, and the room keeps pulling it down.
      - body: |
          **Action** is a reaction triggered by a stimulus, with no goal behind it: cold in, shiver out.
        feedback: |
          Reflexes exist, but as one special, habitual kind of policy. The general picture starts from a goal held as a prediction.
    explanation: |
      When the expectation is worth keeping, the world must be changed, not the expectation.

  - id: perceive
    title: Lever 1, perception
    row: 5
    col: 1
    body: |
      **Perception** changes your mind: when the mismatch comes from a wrong guess about the hidden cause, update the belief until it fits the sensations.
    decoys:
      - body: |
          **Perception** copies the world into the head directly, so no belief and no guessing are needed.
        feedback: |
          Senses give only effects; the causes stay hidden, so something must infer them. That inference is the belief.
      - body: |
          **Perception** changes the world until it fits your belief.
        feedback: |
          That describes action. Perception moves the belief towards the sensations and leaves the world as it is.
    explanation: |
      Perceiving and acting are two ways to serve the same imperative: keep surprise low.

  - id: policy
    title: Policy
    row: 5
    col: 3
    body: |
      A **policy** is a sequence of actions chosen in advance. It is scored by its **expected free energy**, computed from the sensations the policy is *predicted* to bring.
    decoys:
      - body: |
          A **policy** is a rule that maps each stimulus to a fixed response, scored by how often it was used in the past.
        feedback: |
          That is a habit, a special case. A policy is chosen by looking ahead at predicted sensations and how well they fit the goals.
      - body: |
          A **policy** is one single action, scored by the sensations it has already brought.
        feedback: |
          A policy is a sequence, and its score is about the future: predicted sensations, which is what the word "expected" in expected free energy means.
    explanation: |
      Planning is choosing among futures that are only predicted.

  - id: explore
    title: Exploring and exploiting
    row: 6
    col: 3
    body: |
      The score of a policy has two parts: how well predicted sensations fit the goals (**exploiting**) and how much uncertainty they resolve (**exploring**). Choosing the best policy balances both.
    decoys:
      - body: |
          Exploring and exploiting pull in opposite directions, so a creature needs a separate switch that decides, at each moment, which one to do.
        feedback: |
          Both sit inside one score, so the best policy balances them automatically. Exploring often pays back, because better knowledge makes goal-seeking more effective.
      - body: |
          Only exploiting is scored; curiosity is a random habit that does not enter the choice of policy.
        feedback: |
          Seeking informative sensations is part of the score itself. A creature that does not know where the warm spots are cannot plan well.
    explanation: |
      Curiosity and goal-seeking are two terms of one expected free energy.

edges:
  - { from: loop, to: surprise, label: makes it matter }
  - { from: surprise, to: error, label: shows up as }
  - [prior, belief]
  - [evidence, belief]
  - { from: belief, to: perceive, label: update }
  - { from: error, to: act, label: reduce by }
  - { from: act, to: policy, label: over time }
  - { from: policy, to: explore, label: scored by }
outroTitle: Level 1 in one picture
outro: |
  A creature persists by keeping **surprise** low. Inside, that appears as a **prediction error**, and there are two levers: **perceive** (mix prior and evidence into a belief, change your mind) or **act** (change the world to fulfil a goal held as a prior prediction). Planning scores whole **policies** by their expected free energy, which includes curiosity. Level 2 starts from perceiving as inference and derives free energy.
