id: ch01-persist
title: How Does a Creature Stay Alive?
kind: concept
own: |
  - **Persisting means staying in a small set of states.** A creature's **state** is how it is right now (body temperature, energy, position). {{ Only a narrow range of states is compatible with being alive }}, so a living thing must keep its sensations inside the range that goes with those states.
  - **Action and perception form a loop.** The creature emits **actions** that change its **environment** (everything outside its control, including its own body and other creatures), and the environment returns **observations** (what the creature senses). Each observation shapes the next action.
  - **Two ways to shrink a mismatch** between what you expect and what you sense: {{ change your expectation }} (perceive: *change your mind*) or {{ change the world so it matches }} (act: *change the world*).
  - **First principles, not a pile of special cases.** Active inference is a "neat" (unifying) theory: it starts from one imperative, keep the **surprise** of your sensations low, where surprise means {{ how far your current sensations are from the ones that keep you intact }}.
cards:
  - type: text
    id: welcome
    title: "Level 1: a light tour"
    body: |
      This level is a **light tour** of active inference, a theory of how living things (a bacterium, a fish, you) keep going in a changing world.

      **Guessing is the point.** Every card asks you to guess before the idea is explained, and wrong guesses are expected: each one comes with a reason. You need no maths and no earlier knowledge. Every technical word is explained the first time it appears, and the full details come in later Levels.

  - type: text
    id: hook
    title: "A creature in a room"
    body: |
      Picture a small warm-blooded creature in a room whose temperature changes during the day: some hours it is hot, some hours cold. The creature works well only while its body stays between about $36$ and $38\,{}^\circ\text{C}$. Outside that range it gets sick, and far outside it dies.

      Nobody tells the creature the safe range. It only has sensations: it feels warm, comfortable, or cold.

  - type: mcq
    id: guess-nothing
    prompt: |
      A creature works only with its body between $36$ and $38\,{}^\circ\text{C}$. The room slowly drifts to $45\,{}^\circ\text{C}$. What happens if the creature does **nothing** at all, for hours?
    options:
      - text: Its body warms toward the room's temperature and leaves the safe range.
        correct: true
      - text: Its body stays at the same temperature, because bodies are naturally stable.
        feedback: |
          Bodies are not stable on their own. A hot object next to a cooler one exchanges heat with it, so the body drifts toward its surroundings. Staying stable is *work* the creature must do (sweat, move to shade, ...).
      - text: Its body cools, because it was designed for cold.
        feedback: |
          Heat flows from the hotter thing to the cooler one. At $45\,{}^\circ\text{C}$ the room is hotter than the body, so the body gains heat.
    explanation: |
      Doing nothing is not neutral. The world keeps pushing the creature toward other states, so **staying put requires acting**: the creature only persists by actively holding itself inside a narrow range.

  - type: mcq
    id: persist-meaning
    prompt: |
      A **state** is a full description of how something is right now (for our creature: body temperature, energy store, where it is). Out of all the states the creature could possibly be in, which statement best describes what it means to **persist**?
    options:
      - text: Spending nearly all of its time in a small set of states compatible with being alive.
        correct: true
      - text: Visiting as many different states as possible, to be ready for anything.
        feedback: |
          Variety sounds safe, but most states are fatal ($10\,{}^\circ\text{C}$ or $60\,{}^\circ\text{C}$ body, no energy, ...). A creature that wandered through all states would soon be dead.
      - text: 'Never changing: staying in exactly one state forever.'
        feedback: |
          A living creature changes all the time (it eats, moves, warms and cools). What is kept is not one state but a *small set* of acceptable ones.
    explanation: |
      Think of all possible states as a huge landscape: nearly all of it is lethal, and a tiny region is "alive". A rock may sit anywhere; a living thing keeps coming back to its small region. This is the starting point of the whole theory: **to exist is to stay inside a small set of states.**

  - type: text
    id: loop
    title: "The loop between creature and world"
    body: |
      How can the creature stay in its region? It is in constant exchange with the world around it. We call that world the **environment**: the room, but also the creature's own body and other creatures. The word is intentionally generic.

      The creature does two things all the time:

      - it emits **actions** (move, sweat, eat) that change the environment;
      - it receives **observations**: the *sensations* the environment sends back (warm skin, a smell, a light).

      Think of it as a circle:

      ```
        ┌──────── observation ────────┐
        ▼                             │
      CREATURE ── action ──▶ ENVIRONMENT
      ```

      Because each observation shapes the next action, and each action changes the next observation, the circle never stops. This is the **action-perception loop**.

  - type: order
    id: loop-order
    prompt: |
      A creature and its environment are linked in a loop. Put one turn of the loop in order, starting with what the creature senses.
    steps:
      - The creature senses an observation (its skin feels cold).
      - It decides on an action (it walks toward a sunny patch).
      - The action changes the environment (the creature is now in the sun).
      - The environment returns a new observation (its skin feels warmer).
    hint: |
      Observations come *from* the environment *to* the creature; actions go the other way. The new observation depends on what the action did.
    explanation: |
      Each observation is the result of the previous action, and each action is chosen in view of the latest observation. That recursion is what makes the problem hard: many possible actions exist, but very few keep the creature alive.

  - type: mcq
    id: two-ways
    prompt: |
      A creature expects a warm room (about $22\,{}^\circ\text{C}$) but its skin reports cold air. There is a **mismatch** between what it expects and what it senses. Which responses can remove the mismatch? Select all that apply.
    multiple: true
    options:
      - text: Change the world, for example by switching on a heater, so the room becomes warm.
        correct: true
      - text: Change the expectation, for example by deciding that this room is simply a cold one.
        correct: true
      - text: Ignore the sensation and keep expecting a warm room, with nothing else changing.
        feedback: |
          Looking away does not remove the gap: the cold air is still there and the expectation is still wrong. The gap closes only if the expectation or the world changes.
    explanation: |
      There are exactly two levers: **bring your expectation in line with the world** (this is what we will call perceiving: *changing your mind*) or **bring the world in line with your expectation** (acting: *changing the world*). One theory will treat both as the same kind of job.

  - type: mcq
    id: which-lever
    prompt: |
      The creature's body is at $39\,{}^\circ\text{C}$ and it expects to be at $37\,{}^\circ\text{C}$. It resolves the mismatch by **changing the expectation** ("39 is fine, actually"). What is the problem?
    options:
      - text: The mismatch is gone in the creature's head, but its body is still outside the safe range, so it will still get sick.
        correct: true
      - text: 'Nothing is wrong: removing the mismatch is all that matters.'
        feedback: |
          If only the *feeling* of mismatch mattered, any creature could cure itself by lowering its standards. The body temperature is a fact of the world that stays dangerous whatever the creature believes.
      - text: Expectations can never be changed.
        feedback: |
          They can, and they should be when the world really is different (the room really is cold). The point is that some expectations, like the safe range, encode what keeps you alive and cannot just be dropped.
    explanation: |
      Some expectations must be *kept* (my body should be about $37\,{}^\circ\text{C}$), and then the only way to close the gap is to **act**. Others should be *updated* (the room is cold today). Telling which lever to pull is the heart of staying alive.

  - type: mcq
    id: neats
    prompt: |
      Living things are astonishingly varied: bacteria follow sugar, fish school, humans plan careers. Researchers disagree about what to do with this variety. **Scruffies** accept that each phenomenon needs its own special explanation. **Neats** look for one principle underneath them all. Which is the main attraction of the neat approach?
    options:
      - text: One principle could explain many phenomena, and could predict new ones that no special-case theory would suggest.
        correct: true
      - text: It needs fewer experiments, since the data no longer matter.
        feedback: |
          A principle is only worth keeping if its consequences match data. Neats still need experiments; they just try to derive as much as possible from the principle before looking.
      - text: It proves that scruffy, detailed explanations are always wrong.
        feedback: |
          Details are essential: a unifying theory has to reproduce them. It aims to *organize* them, not to cancel them.
    explanation: |
      The two attitudes are called "neats" and "scruffies". Neats build **top-down** (from first principles toward details), scruffies **bottom-up** (from data, using whatever works). Active inference is a neat project: it claims that behavior, perception and adaptation in living things can be derived from one starting point.

  - type: text
    id: surprise
    title: "The one imperative"
    body: |
      What could the starting point be? We just saw that a living creature must keep its sensations inside the range that goes with staying alive. Active inference turns this into one imperative: **minimize the surprise of your sensations.**

      Here **surprise** is a technical word and does *not* mean feeling shocked. It measures how far your current sensations are from the sensations that keep you intact. For a fish, sensing "being in water" is unsurprising; sensing "being on dry sand" is very surprising, because that sensation rarely goes with being alive.

      So surprise is low when you are where you should be, and high when you are somewhere your kind rarely survives. Later Levels make this precise, and show how a creature can lower surprise without ever computing it directly.

  - type: mcq
    id: trap-shock
    tag: Trap
    prompt: |
      In the technical sense used here, which sensation is **most surprising** for a fish?
    options:
      - text: Being on dry sand.
        correct: true
      - text: A loud, sudden noise in the water that does it no harm.
        feedback: |
          This one *feels* shocking, which is why it is tempting. But technical surprise is about whether the sensation fits the states that keep the fish alive, not about how startling it feels. A harmless noise does not take the fish out of its safe region.
      - text: Swimming in an unusual pattern in the middle of a quiet lake.
        feedback: |
          The pattern is unusual, but the sensations (wet, floating, the right temperature) are all ones the fish expects when alive. Unusual is not the same as unsurvivable.
    explanation: |
      Technical surprise is tied to **survival**, not to emotion. Sand is rare among the sensations of a living fish, so sensing it signals that something is badly wrong with the fish's state.

  - type: mcq
    id: trap-react
    tag: Trap
    prompt: |
      A student says: "A brain is a machine that just reacts: it receives an observation and then computes a response, and that is all." What does the action-perception loop say is missing?
    options:
      - text: 'The responses change the environment, so they also decide which observation arrives next: the creature helps create its own inputs.'
        correct: true
      - text: Nothing is missing; brains only react, and the environment ignores what the creature does.
        feedback: |
          If the environment ignored the creature, the loop would be a one-way street. But walking into the sun, eating, or turning your head all change what you will sense next.
      - text: Brains never react to anything; they only plan.
        feedback: |
          Reacting is part of the story (the cold skin does change what the creature does). The error is calling it *all* of the story.
    explanation: |
      Inputs are not handed out at random: **actions choose which observations you get**. So the problem is not "map input to output" but a circular one, in which the creature steers its own sensations toward the ones that keep it alive.

  - type: text
    id: roadmap
    title: "Puzzles for the road ahead"
    body: |
      Each puzzle below is one you can already state. The table says where it is answered.

      | Puzzle | Where it is resolved |
      |---|---|
      | How can a creature figure out what is out there from noisy senses? | Next lesson, then Level 2 |
      | How does acting make the senses match what it expects? | Lesson 3 of this level, Level 2 |
      | Why is surviving the same as keeping surprise low? | Level 3 |
      | What exactly is computed, and by whom? | Levels 4 and 5 |
      | How do I build such a model myself? | Levels 6 to 9 |

  - type: text
    id: summary
    body: |
      **Next: Perceiving Is Guessing.** The creature never sees the world directly, only noisy sensations. How can it work out what is really out there?
