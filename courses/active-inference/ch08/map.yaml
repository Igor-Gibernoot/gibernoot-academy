outroTitle: Level 8 in one picture
outro: |
  **Movement.** The model has no action; the process does. With $g(x)=x$, $f=v-x$ and belief $\mu$, action fulfils the prediction, and a spring adds momentum with $\omega=\sqrt{\kappa/m}$:

  $$u=v-\mu$$

  **Generalized filtering.** The belief $\tilde\mu=(\mu,\mu',\mu'',\dots)$ moves in a frame that travels with its own velocity, pushed by precision-weighted errors:

  $$\dot{\tilde\mu}-D\tilde\mu=-\nabla_{\tilde\mu}F$$

  **Dynamical systems and beyond.** Lotka-Volterra, $f=x\circ(v+\mathbf Ax)$, gives sequences; Lorenz gives itinerant chaos; two creatures with such models synchronize on $y=T(x)$ and take turns; a discrete level sets the continuous target by

  $$\tilde{\mathbf q}=\sum_oQ(o)\,\tilde\eta_o$$

  **Next:** the level review, then the level challenge: five harder problems that combine action and precision, a spring, a dynamical system, a generalized-filtering step and a hybrid prior.
