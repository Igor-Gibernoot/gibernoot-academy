      presets:
        - { label: 'our table', joint: [[0.16, 0.04], [0.06, 0.14]] }
    body: |
      **Problem 5 · Mean field.** Two hidden variables $x_1\in\{a,b\}$ (rows) and $x_2\in\{c,d\}$ (columns) produce the observed data $y$ with the joint $p(y,x_1,x_2)$ shown. The approximate belief is a product $q_1(x_1)\,q_2(x_2)$. Do not press the update buttons yet. Look at the exact posterior (middle): is it a product? Then try to get the gap $D_{KL}[q\parallel p(x\mid y)]$ as low as you can with the sliders alone.

  - type: numeric
    id: p5-q1
    tag: Problem 5 · Mean field
    prompt: |
      Two hidden variables $x_1,x_2\in\{1,2\}$ and data $y$ have the joint $p(y,x_1,x_2)$, rows $x_1$, columns $x_2$:
      $$\begin{pmatrix}0.16&0.04\\0.06&0.14\end{pmatrix}$$
      The mean-field belief $q_2=(0.3,\,0.7)$ is held fixed. Update $q_1$ by $\ln q_1(x_1)=\mathbb E_{q_2}[\ln p(y,x_1,x_2)]+\text{const}$. What is the new $q_1(x_1=1)$ (three decimals)?
    answer: 0.358
    tolerance: 0.003
    answerText: '0.358'
    wrong:
      - { value: 0.5, feedback: 'That is the **marginal** of the posterior, $p(x_1=1\mid y)$. The update uses the average of the **log** joint under $q_2$, not the plain sum over $x_2$, and it depends on the current $q_2$.' }
      - { value: 0.8, feedback: 'That is the share $0.16/(0.16+0.04)$ of the row $x_1=1$, reading only the row. The update compares the two **rows** $x_1=1$ and $x_1=2$, each weighted by $q_2$.' }
    hint: 'Row $x_1=1$: $0.3\ln0.16+0.7\ln0.04=-2.803$. Row $x_1=2$: $0.3\ln0.06+0.7\ln0.14=-2.220$. Then exponentiate and normalise.'
    explanation: |
      The expectation under $q_2$ of $\ln p$ in each row:
      $$\begin{aligned}x_1=1:&\ 0.3\ln0.16+0.7\ln0.04=-2.803,\\ x_1=2:&\ 0.3\ln0.06+0.7\ln0.14=-2.220.\end{aligned}$$
      Normalising the exponentials, $q_1(1)=\dfrac{1}{1+e^{0.583}}=0.358$, so $q_1=(0.358,\,0.642)$. It is the geometric average of the row entries (weights $q_2$), not the arithmetic one. This is the value of $q_1$ that minimises $F$ for the given $q_2$.

  - type: numeric
    id: p5-q2
    tag: Problem 5 · Mean field
    prompt: |
      Same joint, rows $x_1$, columns $x_2$:
      $$\begin{pmatrix}0.16&0.04\\0.06&0.14\end{pmatrix}$$
      After the update, $q_1=(0.358,\,0.642)$. Now update $q_2$ by $\ln q_2(x_2)=\mathbb E_{q_1}[\ln p(y,x_1,x_2)]+\text{const}$. What is the new $q_2(x_2=1)$ (three decimals)?
    answer: 0.488
    tolerance: 0.003
    answerText: '0.488'
    wrong:
      - { value: 0.55, feedback: 'That is the exact marginal $p(x_2=1\mid y)$. The update averages $\ln p$ under the current $q_1$, which is not the posterior marginal.' }
    hint: 'Column $x_2=1$: $0.358\ln0.16+0.642\ln0.06$. Column $x_2=2$: $0.358\ln0.04+0.642\ln0.14$.'
    explanation: |
      Averages of $\ln p$ under $q_1$:
      $$\begin{aligned}x_2=1:&\ 0.358\ln0.16\\ &\ +0.642\ln0.06=-2.463,\\ x_2=2:&\ 0.358\ln0.04\\ &\ +0.642\ln0.14=-2.411.\end{aligned}$$
      So $q_2(1)=1/(1+e^{0.052})=0.488$ and $q_2=(0.488,\,0.512)$. One sweep (both updates) has moved $q_2$ from $(0.3,0.7)$ to almost even odds.

  - type: numeric
    id: p5-gap
    tag: Problem 5 · Mean field
    prompt: |
      Same joint $\begin{pmatrix}0.16&0.04\\0.06&0.14\end{pmatrix}$ (so $p(y)=0.40$ and $-\ln p(y)=0.916$). The free energy is $F=\sum q\,(\ln q-\ln p(y,x))$, and the gap is $D_{KL}=F+\ln p(y)$. The start $q_1=(0.6,0.4)$, $q_2=(0.3,0.7)$ has $F=1.286$, a gap $0.370$. After one sweep, $q_1=(0.358,0.642)$ and $q_2=(0.488,0.512)$ have $F=1.093$. What is the gap now (three decimals)?
    answer: 0.176
    tolerance: 0.003
    answerText: '0.176'
    wrong:
      - { value: 1.093, tolerance: 0.003, feedback: 'That is $F$ itself. The gap is what is **above** the surprise: $F-(-\ln p(y))=F+\ln p(y)$.' }
    hint: '$-\ln p(y)=-\ln0.4=0.916$, and the gap is $F$ minus this.'
    explanation: |
      $$\text{gap}=1.093-0.916=0.176.$$
      The gap fell from $0.370$ to $0.176$ in one sweep: $F$ never rises, because each update is the best possible for its factor. Further sweeps end near $q_1=(0.505,0.495)$, $q_2=(0.570,0.430)$ with gap $0.146$.

  - type: mcq
    id: p5-floor
    tag: Problem 5 · Mean field
    prompt: |
      Alternating the updates of $q_1$ and $q_2$ for the joint $\begin{pmatrix}0.16&0.04\\0.06&0.14\end{pmatrix}$ settles at a gap of about $0.146$ nats, not $0$. Why, and how does this relate to message passing?
    options:
      - text: 'The exact posterior $\begin{pmatrix}0.4&0.1\\0.15&0.35\end{pmatrix}$ is **not a product** (the likelier column flips with the row), so no $q_1q_2$ reaches it; $0.146$ is the smallest gap of any product. Each update is a message: the new $q_1$ is built from the other factor''s belief $q_2$ averaged into the joint, and back.'
        correct: true
      - text: 'The updates stop too early; with more sweeps the gap would reach $0$, because each update moves $F$ closer to $-\ln p(y)$.'
        feedback: |
          Each update does lower $F$, but only within the family of products. The best member of the family is $0.146$ away, so no number of sweeps gets lower.
      - text: 'Because the update uses $\ln p$ and not $p$; with the plain sum the gap would reach $0$.'
        feedback: |
          The log average is exactly what minimises $F$ for one factor. Using the plain sum would give a worse belief, not a better one.
    explanation: |
      The posterior has rows $(0.4,0.1)$ and $(0.15,0.35)$: the ratio of the two columns is $4{:}1$ in one row and $3{:}7$ in the other, so it cannot equal $q_2(1):q_2(2)$ in both. The best product leaves a positive floor, here $0.146$ nats.

      In **message-passing** language, each factor $q_i$ is a node of a graph: its update is the local log-joint plus the messages from its neighbours, which are the expectations of $\ln p$ under the neighbours' beliefs. Updating the nodes in turn until nothing changes is mean-field message passing, and a loop between the nodes (the correlation) is what the approximation cannot represent.

  - type: text
    id: summary
    title: What you now own
    body: |
      - **Free energy is a bound.** For a guess $Q(x)$ over a hidden cause $x$ and data $y$ (minimised),
        $$\begin{aligned}F&=\sum_x Q(x)\,[\ln Q(x)-\ln P(x,y)]\\ &=-\ln P(y)+D_{KL}[Q(x)\parallel P(x\mid y)]\end{aligned}$$
        so its lowest value is the surprise $-\ln P(y)$, reached by the exact posterior. In a discrete model with policy $\pi$, expected free energy $\mathbf G$ and free energy $\mathbf F$, the policy belief is
        $$\pi=\sigma(-\mathbf G-\mathbf F)$$
      - **Laplace** puts a Gaussian on the mode of a posterior over a variable $x$ with joint density $p(y,x)$: with the mean $\mu$ where $\partial_x\ln p=0$ and the covariance $\Sigma$,
        $$\begin{aligned}q&=\mathcal N(\mu,\Sigma),\\ \Sigma^{-1}&=-\partial_x^2\ln p(y,x)\big|_{x=\mu}\end{aligned}$$
        It is only as tight as the posterior is Gaussian: a skewed posterior leaves a gap, and with no interior mode the recipe fails.
      - **Predictive coding** weighs errors by precisions. A hidden cause $\mu$ predicts data $y$ through $g(\mu)=\mu$, with prior mean $\eta$, sensory precision $\Pi_y$ and prior precision $\Pi_v$ (distributions $\mathcal N(m,\Pi^{-1})$). The errors are $\epsilon_y=y-\mu$ and $\epsilon_v=\mu-\eta$, and at the minimum of $F=\tfrac12(\Pi_y\epsilon_y^2+\Pi_v\epsilon_v^2)$
        $$\mu=\frac{\Pi_y\,y+\Pi_v\,\eta}{\Pi_y+\Pi_v}$$
      - **Action** moves the data to meet the prediction. If an arm angle $y$ depends on the muscle signal $u$, the reflex is
        $$\dot u=-\frac{\partial y}{\partial u}\,\Pi_y\,\epsilon_y\;\to\;\frac{\partial y}{\partial u}\,\frac{\Pi_y\Pi_v}{\Pi_y+\Pi_v}\,(\eta-y)$$
        at the belief minimum. It vanishes when $\Pi_y\to0$ (the senses carry no weight) and never exceeds $\frac{\partial y}{\partial u}\Pi_v(\eta-y)$ however large $\Pi_y$ is.
      - **Mean field** approximates a joint over two hidden variables $x_1,x_2$ by a product $Q=q_1(x_1)q_2(x_2)$ and updates one factor at a time from the other's average:
        $$\ln q_1(x_1)=\mathbb E_{q_2}[\ln p(y,x_1,x_2)]+\text{const}$$
        Each update lowers $F$, which settles at a floor above $-\ln p(y)$ whenever the exact posterior is correlated (not a product).

      **Next:** every method of this chapter (the free-energy bound, the discrete and Laplace models, predictive coding, mean field) updates beliefs by passing numbers between the parts of a model. The next topic makes this explicit as **message passing on a factor graph**, and asks how a brain made of neurons could carry such messages: which neural populations would hold the beliefs, and which would carry the prediction errors.
