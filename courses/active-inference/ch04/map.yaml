outroTitle: Level 4 in one picture
outro: |
  A **generative model** $P(x,y)=P(y\mid x)\,P(x)$ must be inverted, but the evidence $P(y)$ is intractable. So we minimise the **variational free energy** over a belief $Q$:

  $$\begin{aligned}F\;&=D_{\mathrm{KL}}[Q(x)\,\|\,P(x\mid y)]\\&\quad-\ln P(y)\end{aligned}$$

  **Left, discrete time.** Hidden states $s_\tau$, outcomes $o_\tau$ and policies $\pi$ are tied by the tables $\mathbf A,\mathbf B,\mathbf C,\mathbf D$. Beliefs are a product over time and descend $\mathbf F_\pi$, and policies get the prior $\boldsymbol\pi_0=\sigma(-\mathbf G)$ and then the posterior

  $$\boldsymbol\pi=\sigma(-\mathbf G-\mathbf F)$$

  **Right, continuous time.** Hidden states $x$, causes $v$ and data $y$ with precisions $\Pi$. A Gaussian (Laplace) belief makes $F$ a sum of precision-weighted squared errors,

  $$F=\tfrac12\,\tilde\epsilon\cdot\tilde\Pi\,\tilde\epsilon$$

  Perception moves the belief, $\dot{\tilde\mu}-D\tilde\mu=-\nabla_{\tilde\mu}F$, and action moves the data, $\dot u=-\nabla_uF$. Stacking levels sends predictions down and errors up.

  Both families minimise one thing: free energy, with $F$ and $G$ minimised, never negated.
