# The courses of Gibernoot Academy, in the order the home page lists them.
# Each `id` is a folder courses/<id>/ holding its course.yaml and lesson files
# (docs/NEW_COURSE.md). A course with `status: planned` shows as "coming soon"
# and needs no folder yet.
#   id      folder name and URL segment (#/<id>/...); never rename it once
#           studied, since progress is stored under it
#   title   shown on the card; `short` is the browser-tab title
#   eyebrow small label above the title (field, level)
#   blurb   one or two sentences, inline Markdown and $math$ allowed
#   hue     0-5, the card colour (same palette as the levels)

title: Gibernoot Academy
tagline: Problem-based trails, built to be understood.

courses:
  - id: diff-geometry-gr
    title: From Differential Geometry to General Relativity
    short: Geometry to Relativity
    eyebrow: Mathematics · Physics
    blurb: From vector spaces, charts and tensors to curvature, spacetime and Einstein's equations, one puzzle at a time.
    hue: 0

  - id: active-inference
    title: Active Inference
    short: Active Inference
    eyebrow: Neuroscience · Physics of Mind
    blurb: How a creature that wants to persist must perceive, act and plan, and why all three are one problem. From Bayes and free energy to models you can simulate.
    hue: 2

  - id: info-geometry
    title: Information Geometry and Its Applications
    short: Information Geometry
    eyebrow: Mathematics · Statistics · Machine Learning
    blurb: Probability distributions as a curved space, with divergences instead of distances. From Bregman and Legendre to the Pythagorean theorem, then to estimation, EM, natural gradient and learning.
    hue: 4

  - id: how-the-world-works
    title: How the World Works
    short: How the World Works
    eyebrow: Physics · Engineering
    blurb: Bikes, locks, fridges, planes, phones, chips, the internet and rockets, built from first principles. Each lesson takes one machine and uses it to teach one law of nature.
    hue: 1
