outroTitle: Chapter 7 in one picture
outro: |
  Read it top to bottom. Components alone give no length, so a manifold gets a **metric**: a symmetric $(0,2)$-tensor field with
  $$\det\big(g_{ij}(p)\big)\neq0,$$
  not necessarily positive. As a map it lowers and raises indices:
  $$\flat(\mathcal{X})_i = x^j\,g_{ji},$$
  $$g_{ij}\,(g^{-1})^{jk} = \delta^k_i.$$
  It has no eigenvalues, but a **signature** $(n_+,n_-)$ (Sylvester's law); spacetime is Lorentzian, $(3,1)$. It measures curves:
  $$L_{[a,b]}[\gamma] := \int_a^b\sqrt{\text{ᛇ}_\gamma\,g(v_\gamma,v_\gamma)}\,d\lambda,$$
  independent of the parametrization, proper time in spacetime. **Geodesics** are the curves of stationary length under **variations** with fixed endpoints; the **Euler-Lagrange equations**
  $$\frac{d}{d\lambda}\big[\partial_{d+m}\mathcal{L}_\mathscr{X}\big] = \partial_m\mathcal{L}_\mathscr{X}$$
  turn this, at constant speed, into the **geodesic equation**
  $$\ddot\gamma^k + \Gamma^k_{ij}\,\dot\gamma^i\dot\gamma^j = 0,$$
  whose **Christoffel symbols**
  $$\begin{aligned}\Gamma^k_{ji} = \tfrac12(g^{-1})^{km}\big(&\partial_ig_{mj}+\partial_jg_{mi}\\ &-\partial_mg_{ij}\big)\end{aligned}$$
  define the **Levi-Civita connection**, the only one that is torsion free and has $\nabla g = 0$. Its curvature, lowered, is the **Riemann–Christoffel curvature**
  $$(\mathrm{Riem}^\flat)_{ajkm} = g_{al}\,\mathrm{Riem}^l_{jkm},$$
  with four symmetries; it vanishes exactly for **flat** metrics. Contracting gives $\mathrm{Ric}$ and
  $$R = (g^{-1})^{mk}\,\mathrm{Ric}_{km},$$
  and the divergence-free **Einstein curvature**
  $$G = \mathrm{Ric} - \tfrac12R\,g.$$

  **Next: the Level Challenge.** Harder problems that combine the whole map. Can the contracted Christoffel symbols $\Gamma^k_{ki}$ be read off from a single function, the determinant of $g$, without computing a single $\Gamma$?
