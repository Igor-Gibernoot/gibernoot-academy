id: ch07-sphere
title: "Guided Problem: Meridians and Parallels of the Sphere"
kind: guided

cards:
  - type: text
    id: hook
    title: Flying due east
    body: |
      Look at a globe. Its **meridians** are the half circles from the north pole to the south pole (constant longitude); its **parallels** are the horizontal circles (constant latitude), the largest being the equator.

      A pilot leaves a city at latitude $30°$ north and flies **due east**: the compass always reads $90°$ and she follows the parallel of her city all the way around. A second pilot flies due east along the equator; a third flies due south along a meridian.

      Each of them keeps a constant compass heading. Which of them is flying "straight", along a geodesic of the sphere, the curve of stationary length?

  - type: mcq
    id: hook-guess
    title: Which parallels are straight?
    prompt: |
      On the round sphere, a **parallel** is a circle of constant latitude (the equator is the parallel at latitude $0°$). A geodesic is a curve of stationary length. Before any computation, guess: which parallels are geodesics?
    options:
      - text: 'Only the equator'
        correct: true
      - text: 'Every parallel: along it the latitude never changes, so it does not turn'
        feedback: |
          Constant latitude means "straight in the chart of latitude and longitude", and a chart can make a bent curve look straight (recall the circle $r = 1$ in the polar chart of the plane, a line in the chart and still bent). This lesson tests the parallels with the geodesic equation; all but one fail.
      - text: 'None: every parallel is a circle, and circles bend'
        feedback: |
          In the flat plane every circle bends, but the sphere is not flat. The equator is a circle in $\mathbb{R}^3$ and still, measured inside the sphere, it does not bend: it is the shortest route between nearby points of it.
      - text: 'The parallels at $45°$ north and south, besides the equator'
        feedback: |
          $45°$ is where the bending is **largest**, not where it vanishes: the computation of this lesson gives a bending proportional to $\sin\vartheta_0\cos\vartheta_0$, with $\vartheta_0$ the angle from the north pole, which is extreme at $\vartheta_0 = \pi/4$.
    explanation: |
      Only the equator. The other parallels bend toward the nearer pole: a pilot flying due east at $30°$ north is steering all the time. This lesson proves it from the metric of the sphere: its Christoffel symbols, the geodesic equation for meridians and parallels, a variation that shortens a parallel, and finally the curvature, $R = 2$.

  - type: text
    id: sphere-chart
    tag: Step 1 · The chart
    title: Latitude and longitude, as angles
    body: |
      The **unit sphere** is the surface
      $$S^2 := \{(a,b,c)\in\mathbb{R}^3 \mid a^2+b^2+c^2 = 1\}.$$
      Use two angles: the **polar angle** $\vartheta$ (read "theta", the angle measured from the north pole $(0,0,1)$; latitude is $90° - \vartheta$) and the **longitude** $\varphi$ (read "phi"). The chart $(\mathcal{U},\mathscr{X})$, $\mathscr{X} = (\vartheta,\varphi)$, has inverse
      $$\mathscr{X}^{-1}(\vartheta,\varphi) = \begin{pmatrix}\sin\vartheta\cos\varphi\\ \sin\vartheta\sin\varphi\\ \cos\vartheta\end{pmatrix}$$
      on the open rectangle $\vartheta\in(0,\pi)$, $\varphi\in(-\pi,\pi)$.

      **Domain.** $\mathcal{U}$ is $S^2$ minus the closed half circle $\{b = 0,\ a\le0\}$, which runs from the north pole through $(-1,0,0)$ to the south pole. The poles must go: at $\vartheta = 0$ every $\varphi$ gives the same point, so $\mathscr{X}$ could not be injective. The half circle at $\varphi = \pm\pi$ must go so that $\varphi$ has one value and the domain is open (the same cut as the polar chart of the plane).

  - type: text
    id: sphere-metric
    tag: Step 1 · The metric
    title: Lengths measured in space
    body: |
      A string laid on the globe has a length measured in $\mathbb{R}^3$. Turn this into a metric. A curve $\gamma$ on $S^2$ with chart components $\vartheta(\lambda)$, $\varphi(\lambda)$ is, in space, the curve $\mathscr{X}^{-1}(\vartheta(\lambda),\varphi(\lambda))$. By the chain rule its velocity arrow in $\mathbb{R}^3$ is
      $$\dot\vartheta\,\vec u_\vartheta + \dot\varphi\,\vec u_\varphi,$$
      where $\vec u_\vartheta := \partial\mathscr{X}^{-1}/\partial\vartheta$ and $\vec u_\varphi := \partial\mathscr{X}^{-1}/\partial\varphi$ are the arrows in $\mathbb{R}^3$ along the two coordinate lines. Its squared length, with the dot product $\cdot$ of $\mathbb{R}^3$, is $g_{ij}\dot\gamma^i\dot\gamma^j$ with
      $$g_{ij} := \vec u_i\cdot\vec u_j,$$
      writing $\vec u_1 := \vec u_\vartheta$, $\vec u_2 := \vec u_\varphi$. This defines the **round metric** of the sphere: symmetric, and positive definite since the two arrows are independent on $\mathcal{U}$. Compute the first arrow:
      $$\vec u_\vartheta = \begin{pmatrix}\cos\vartheta\cos\varphi\\ \cos\vartheta\sin\varphi\\ -\sin\vartheta\end{pmatrix},$$
      so $g_{11} = \cos^2\vartheta(\cos^2\varphi+\sin^2\varphi) + \sin^2\vartheta = 1$: along a meridian, $\vartheta$ itself measures length.

  - type: numeric
    id: g22
    tag: Step 1 · The metric
    title: Build the second component
    prompt: |
      On the unit sphere with chart $\mathscr{X} = (\vartheta,\varphi)$ (polar angle, longitude), the metric components are $g_{ij} = \vec u_i\cdot\vec u_j$, the dot products in $\mathbb{R}^3$ of the coordinate-line arrows of
      $$\mathscr{X}^{-1}(\vartheta,\varphi) = (\sin\vartheta\cos\varphi,\ \sin\vartheta\sin\varphi,\ \cos\vartheta).$$
      Compute $\vec u_\varphi := \partial\mathscr{X}^{-1}/\partial\varphi$ and then $g_{22} = \vec u_\varphi\cdot\vec u_\varphi$ at $\vartheta = \pi/6$.
    answer: 0.25
    answerText: '1/4'
    wrong:
      - { value: 0.5, feedback: 'That is $\sin(\pi/6)$, the length of $\vec u_\varphi$. The component $g_{22}$ is its **squared** length, $\vec u_\varphi\cdot\vec u_\varphi = \sin^2\vartheta = \tfrac14$.' }
      - { value: 0.75, feedback: 'That is $\cos^2(\pi/6)$. Differentiating in $\varphi$ leaves the factor $\sin\vartheta$ untouched: $\vec u_\varphi = (-\sin\vartheta\sin\varphi,\ \sin\vartheta\cos\varphi,\ 0)$, with squared length $\sin^2\vartheta$.' }
      - { value: 1, feedback: 'That would hold if every parallel had the length of the equator. Moving $\varphi$ by $d\varphi$ moves the point along a circle of radius $\sin\vartheta$ (its distance from the axis), so $g_{22} = \sin^2\vartheta$, here $\tfrac14$.' }
    hint: Only the first two entries depend on $\varphi$; the factor $\sin\vartheta$ stays as it is, and $\sin^2\varphi+\cos^2\varphi = 1$.
    explanation: |
      $\vec u_\varphi = (-\sin\vartheta\sin\varphi,\ \sin\vartheta\cos\varphi,\ 0)$, so
      $$g_{22} = \sin^2\vartheta\,(\sin^2\varphi+\cos^2\varphi) = \sin^2\vartheta,$$
      which is $\tfrac14$ at $\vartheta = \pi/6$. Moving in $\varphi$ runs along a circle of radius $\sin\vartheta$, the distance from the axis.

  - type: mcq
    id: g12
    tag: Step 1 · The metric
    title: The mixed component
    prompt: |
      On the unit sphere, chart $(\vartheta,\varphi)$, the coordinate-line arrows in $\mathbb{R}^3$ are
      $$\begin{gathered}\vec u_\vartheta = (\cos\vartheta\cos\varphi,\ \cos\vartheta\sin\varphi,\ -\sin\vartheta)\\ \vec u_\varphi = (-\sin\vartheta\sin\varphi,\ \sin\vartheta\cos\varphi,\ 0)\end{gathered}$$
      and $g_{12} = \vec u_\vartheta\cdot\vec u_\varphi$. What is $g_{12}$, and what does it say?
    options:
      - text: '$0$: meridians and parallels cross at right angles'
        correct: true
      - text: '$\sin\vartheta\cos\vartheta$: the grid is skewed away from the equator'
        feedback: |
          Each of the first two products carries $\sin\vartheta\cos\vartheta\sin\varphi\cos\varphi$, but with opposite signs: $-\sin\vartheta\cos\vartheta\cos\varphi\sin\varphi + \sin\vartheta\cos\vartheta\sin\varphi\cos\varphi = 0$, and the third product is $0$. On a globe the grid is square-cornered everywhere.
      - text: '$1$, since both arrows are tangent to the same sphere'
        feedback: |
          Being tangent to the sphere says each arrow is perpendicular to the position $(a,b,c)$, not that they are parallel to each other. Their dot product is $0$, not $1$.
    explanation: |
      $$\begin{aligned}g_{12} &= -\sin\vartheta\cos\vartheta\cos\varphi\sin\varphi\\ &\quad + \sin\vartheta\cos\vartheta\sin\varphi\cos\varphi + 0\\ &= 0.\end{aligned}$$
      So the round metric in this chart is
      $$g_{ij} = \mathrm{diag}(1,\sin^2\vartheta).$$

  - type: text
    id: family
    tag: Step 1 · A familiar family
    title: A member of the family
    body: |
      Recall from "Curvature of the Metric": for a chart $(r,\theta)$ with metric components $\mathrm{diag}(1,f(r)^2)$,
      $$\begin{gathered}\Gamma^1_{22} = -ff',\quad \Gamma^2_{12} = \Gamma^2_{21} = f'/f\\ \mathrm{Riem}^1_{212} = -ff''\end{gathered}$$
      with primes $d/dr$; $f = r$ is the flat plane, $f = \sinh r$ the hyperbolic plane. The sphere is the member with the first coordinate $\vartheta$ in the role of $r$ and
      $$f(\vartheta) = \sin\vartheta.$$
      Read it geometrically: the parallel at polar angle $\vartheta_0$ lies at distance $\vartheta_0$ from the north pole (along a meridian $g_{11} = 1$) and has length $2\pi\sin\vartheta_0$. For small $\vartheta_0$ this is about $2\pi\vartheta_0$, as for a circle in the plane, but it grows **less than linearly**, and shrinks again past the equator. Expect the opposite curvature to the hyperbolic plane. Steps 2 and 6 check the family formulas against a direct computation.

  - type: build
    id: gamma122-build
    tag: Step 2 · Christoffel symbols
    title: Which terms survive?
    prompt: |
      On the unit sphere, chart $(\vartheta,\varphi)$, $g_{ij} = \mathrm{diag}(1,\sin^2\vartheta)$; the only nonzero derivative of a component is $\partial_1g_{22} = 2\sin\vartheta\cos\vartheta$ ($\partial_1 = \partial/\partial\vartheta$). The Christoffel symbols are
      $$\Gamma^k_{ij} = \tfrac12(g^{-1})^{km}\big(\partial_ig_{mj}+\partial_jg_{mi}-\partial_mg_{ij}\big).$$
      Build $\Gamma^1_{22}$ from the terms that survive.
    prefix: '\Gamma^1_{22} ='
    tiles: ['-\tfrac12', '\tfrac12', '(g^{-1})^{11}', '(g^{-1})^{22}', '\partial_1g_{22}', '\partial_2g_{12}']
    answers:
      - ['-\tfrac12', '(g^{-1})^{11}', '\partial_1g_{22}']
      - ['-\tfrac12', '\partial_1g_{22}', '(g^{-1})^{11}']
    wrong:
      - { answer: ['\tfrac12', '(g^{-1})^{11}', '\partial_1g_{22}'], feedback: 'With $k = 1$, $i = j = 2$, the first two terms are $\partial_2g_{m2}$, which vanish (nothing depends on $\varphi$). The surviving term is the third, $-\partial_mg_{22}$ with $m = 1$, and it carries a minus sign.' }
      - { answer: ['-\tfrac12', '(g^{-1})^{22}', '\partial_1g_{22}'], feedback: 'The upper index $k = 1$ picks $(g^{-1})^{1m}$. The inverse metric is diagonal, so only $(g^{-1})^{11} = 1$ appears, not $(g^{-1})^{22} = 1/\sin^2\vartheta$.' }
      - { answer: ['-\tfrac12', '(g^{-1})^{11}', '\partial_2g_{12}'], feedback: '$g_{12} = 0$ everywhere and no component depends on $\varphi$, so $\partial_2g_{12} = 0$. The term that survives differentiates $g_{22}$ in $\vartheta$.' }
    hint: Set $k = 1$, $i = j = 2$. With a diagonal metric, $m$ must be $1$; which of the three derivatives is not zero?
    explanation: |
      $$\begin{aligned}\Gamma^1_{22} &= -\tfrac12(g^{-1})^{11}\partial_1g_{22}\\ &= -\tfrac12\cdot1\cdot2\sin\vartheta\cos\vartheta\\ &= -\sin\vartheta\cos\vartheta,\end{aligned}$$
      in agreement with the family formula $-ff' = -\sin\vartheta\cos\vartheta$.

  - type: mcq
    id: gamma212
    tag: Step 2 · Christoffel symbols
    title: The other nonzero symbol
    prompt: |
      Unit sphere, chart $(\vartheta,\varphi)$, $g_{ij} = \mathrm{diag}(1,\sin^2\vartheta)$, inverse $(g^{-1})^{ij} = \mathrm{diag}(1,1/\sin^2\vartheta)$, and only $\partial_1g_{22} = 2\sin\vartheta\cos\vartheta$ is nonzero. With
      $$\Gamma^k_{ij} = \tfrac12(g^{-1})^{km}\big(\partial_ig_{mj}+\partial_jg_{mi}-\partial_mg_{ij}\big),$$
      what is $\Gamma^2_{12}$?
    options:
      - text: '$\cot\vartheta = \cos\vartheta/\sin\vartheta$'
        correct: true
      - text: '$\sin\vartheta\cos\vartheta$'
        feedback: |
          That forgets the inverse metric. The upper index $2$ brings $(g^{-1})^{22} = 1/\sin^2\vartheta$, so $\tfrac12\cdot\frac{1}{\sin^2\vartheta}\cdot2\sin\vartheta\cos\vartheta = \cot\vartheta$.
      - text: '$2\cot\vartheta$'
        feedback: |
          Only one of the three terms survives: with $k = m = 2$, $i = 1$, $j = 2$, the bracket is $\partial_1g_{22} + \partial_2g_{21} - \partial_2g_{12} = \partial_1g_{22}$, and the $\tfrac12$ stays. A factor $2$ appears later, in the geodesic equation, where $\Gamma^2_{12}$ and $\Gamma^2_{21}$ both contribute.
      - text: '$0$, since $\vartheta$ and $\varphi$ are independent coordinates'
        feedback: |
          Independent coordinates can still have a metric whose components depend on one of them: $g_{22} = \sin^2\vartheta$ changes with $\vartheta$, and that derivative feeds $\Gamma^2_{12}$.
    explanation: |
      With $m = 2$: $\Gamma^2_{12} = \tfrac12\cdot\frac{1}{\sin^2\vartheta}\cdot2\sin\vartheta\cos\vartheta = \cot\vartheta$, and $\Gamma^2_{21} = \Gamma^2_{12}$ by symmetry. All other symbols ($\Gamma^1_{11}$, $\Gamma^1_{12}$, $\Gamma^2_{11}$, $\Gamma^2_{22}$) vanish. The family formula $f'/f = \cos\vartheta/\sin\vartheta$ agrees.

  - type: numeric
    id: gamma-quarter
    tag: Step 2 · Check
    title: Numbers at 45 degrees
    prompt: |
      On the unit sphere in the chart $(\vartheta,\varphi)$ (polar angle, longitude), the Christoffel symbol $\Gamma^1_{22}$ is $-\sin\vartheta\cos\vartheta$. Evaluate it at $\vartheta = \pi/4$.
    answer: -0.5
    answerText: '-1/2'
    wrong:
      - { value: 0.5, feedback: 'The sign is negative: $\Gamma^1_{22}$ comes from the third term $-\partial_1g_{22}$ of the Christoffel formula, and $\partial_1g_{22} = 2\sin\vartheta\cos\vartheta > 0$ in the northern half.' }
      - { value: -1, feedback: 'That is $-2\sin\vartheta\cos\vartheta = -\partial_1g_{22}$, without the $\tfrac12$ of the Christoffel formula.' }
    hint: $\sin(\pi/4) = \cos(\pi/4) = \tfrac{\sqrt2}{2}$.
    explanation: |
      $-\tfrac{\sqrt2}{2}\cdot\tfrac{\sqrt2}{2} = -\tfrac12$. At the same point $\Gamma^2_{12} = \cot(\pi/4) = 1$. At the equator $\vartheta = \pi/2$ both vanish.

  - type: mcq
    id: pole-trap
    tag: Step 2 · Trap
    title: Trouble at the pole?
    prompt: |
      On the unit sphere, chart $(\vartheta,\varphi)$ with $\vartheta$ the angle from the north pole, the Christoffel symbol $\Gamma^2_{12} = \cot\vartheta$ grows without bound as $\vartheta\to0$. What does this say about the north pole?
    options:
      - text: 'Nothing about the sphere: the chart fails there, not the geometry'
        correct: true
      - text: 'The sphere has a singular point at the pole'
        feedback: |
          Rotate the globe so that the north pole lands on the equator of a rotated chart. Rotations of $\mathbb{R}^3$ keep dot products, so the round metric looks the same in the rotated chart, and there all Christoffel symbols at that point are $0$ (at $\vartheta = \pi/2$). Christoffel symbols depend on the chart; a blow-up only shows that the chart degenerates (all $\varphi$ meet at the pole).
      - text: 'Geodesics cannot pass through the pole'
        feedback: |
          The meridians run straight through the pole, from one side to the other, and Step 3 shows they are geodesics. In a rotated chart the pole is an ordinary point; only this chart cannot see it.
    explanation: |
      The poles are outside the chart domain because the chart degenerates there: every $\varphi$ gives the same point. The geometry is the same at every point of the sphere (a rotation moves any point to any other and keeps the metric), and chart-dependent quantities such as $\Gamma^k_{ij}$ can blow up where a chart fails.

  - type: mcq
    id: geodesic-eqs
    tag: Step 2 · The geodesic equation
    title: The second equation
    prompt: |
      Recall the geodesic equation for a constant-speed curve, $\ddot\gamma^k + \Gamma^k_{ij}\dot\gamma^i\dot\gamma^j = 0$ (sum over $i,j$), where a dot is $d/d\lambda$. On the unit sphere, chart $(\vartheta,\varphi)$, the only nonzero symbols are $\Gamma^1_{22} = -\sin\vartheta\cos\vartheta$ and $\Gamma^2_{12} = \Gamma^2_{21} = \cot\vartheta$. The first equation reads $\ddot\vartheta - \sin\vartheta\cos\vartheta\,\dot\varphi^2 = 0$. What is the second ($k = 2$)?
    options:
      - text: '$\ddot\varphi + 2\cot\vartheta\,\dot\vartheta\,\dot\varphi = 0$'
        correct: true
      - text: '$\ddot\varphi + \cot\vartheta\,\dot\vartheta\,\dot\varphi = 0$'
        feedback: |
          The sum over $i,j$ has two terms with one index $1$ and one $2$: $\Gamma^2_{12}\dot\vartheta\dot\varphi$ and $\Gamma^2_{21}\dot\varphi\dot\vartheta$. They are equal, so together $2\cot\vartheta\,\dot\vartheta\dot\varphi$.
      - text: '$\ddot\varphi + \cot\vartheta\,\dot\varphi^2 = 0$'
        feedback: |
          $\dot\varphi^2$ goes with $\Gamma^2_{22}$ (both lower indices $2$), and $\Gamma^2_{22} = 0$. The nonzero symbol $\Gamma^2_{12}$ multiplies the mixed product $\dot\vartheta\dot\varphi$.
    explanation: |
      The geodesic equation of the round sphere, for constant speed:
      $$\ddot\vartheta - \sin\vartheta\cos\vartheta\,\dot\varphi^2 = 0$$
      $$\ddot\varphi + 2\cot\vartheta\,\dot\vartheta\,\dot\varphi = 0$$
      Both follow the family pattern: $-ff'$ times $\dot\varphi^2$ in the first, $2f'/f$ times $\dot\vartheta\dot\varphi$ in the second. With $f = r$ the same pattern gives the plane in polar components, $\ddot r - r\dot\theta^2 = 0$ and $\ddot\theta + \tfrac2r\dot r\dot\theta = 0$.

  - type: mcq
    id: meridian
    tag: Step 3 · Meridians
    title: Test a meridian
    prompt: |
      On the unit sphere, chart $(\vartheta,\varphi)$, test the meridian $\vartheta = \lambda$, $\varphi = \varphi_0$ (a constant in $(-\pi,\pi)$), $\lambda\in(0,\pi)$, against the constant-speed geodesic equations
      $$\ddot\vartheta - \sin\vartheta\cos\vartheta\,\dot\varphi^2 = 0$$
      $$\ddot\varphi + 2\cot\vartheta\,\dot\vartheta\,\dot\varphi = 0$$
      (the speed is $s^2 = \dot\vartheta^2 + \sin^2\vartheta\,\dot\varphi^2$). What do you find?
    options:
      - text: 'Constant speed $1$, both residuals $0$: a geodesic'
        correct: true
      - text: 'The first residual is $-\sin\lambda\cos\lambda$: it bends'
        feedback: |
          The term $-\sin\vartheta\cos\vartheta\,\dot\varphi^2$ needs motion in $\varphi$. On a meridian $\varphi$ is constant, $\dot\varphi = 0$, so the term vanishes; with $\ddot\vartheta = 0$ the first residual is $0$.
      - text: 'The second residual $2\cot\lambda$ is nonzero, since $\dot\vartheta = 1$'
        feedback: |
          The term is a product $2\cot\vartheta\,\dot\vartheta\,\dot\varphi$, and $\dot\varphi = 0$ kills it however large $\dot\vartheta$ is.
      - text: 'The equations do not apply, since the speed is not constant'
        feedback: |
          $s^2 = \dot\vartheta^2 + \sin^2\vartheta\,\dot\varphi^2 = 1 + 0$: the meridian runs at speed $1$, because $g_{11} = 1$ (the polar angle measures length along a meridian).
    explanation: |
      $\dot\vartheta = 1$, $\ddot\vartheta = 0$, $\dot\varphi = \ddot\varphi = 0$: speed $1$, and both residuals are $0$. Every meridian is a geodesic, run at unit speed. Its continuation through the poles closes it into a full **great circle** (a circle of radius $1$, centred at the origin).

  - type: text
    id: great-circles
    tag: Step 3 · Great circles
    title: Every great circle
    body: |
      The chart misses the poles, but the argument does not need them. A rotation of $\mathbb{R}^3$ maps the sphere to itself and keeps the dot product, so it keeps the length of every curve on the sphere. A curve of stationary length goes to a curve of stationary length: **rotations send geodesics to geodesics**.

      Every great circle (the sphere cut by a plane through the origin) is a meridian circle after a suitable rotation. Hence:
      $$\text{great circles are geodesics.}$$
      The equator is one of them (rotate the north pole onto $(1,0,0)$): it should pass the test of Step 4. The other parallels are not great circles: their planes miss the origin.

  - type: numeric
    id: parallel-speed
    tag: Step 4 · Parallels
    title: Speed on a parallel
    prompt: |
      On the unit sphere, chart $(\vartheta,\varphi)$ with metric $\mathrm{diag}(1,\sin^2\vartheta)$, run the parallel $\vartheta = \vartheta_0$, $\varphi = \lambda$ for $\lambda\in(-\pi,\pi)$. Its speed is $s = \sqrt{\dot\vartheta^2 + \sin^2\vartheta\,\dot\varphi^2}$. Compute $s$ for $\vartheta_0 = \pi/3$ (latitude $30°$ north).
    answer: 0.8660
    tolerance: 0.002
    answerText: '\sqrt3/2 \approx 0.866'
    wrong:
      - { value: 1, feedback: 'Speed $1$ in $\varphi$ is not speed $1$ on the sphere: one radian of longitude at polar angle $\vartheta_0$ is an arc of a circle of radius $\sin\vartheta_0$, so $s = \sin(\pi/3)$.' }
      - { value: 0.75, feedback: 'That is $s^2 = \sin^2(\pi/3)$. The speed is its square root, $\tfrac{\sqrt3}{2}$.' }
      - { value: 0.5, feedback: 'That is $\cos(\pi/3)$. The radius of the parallel is the distance from the axis, $\sin\vartheta_0$, not the height $\cos\vartheta_0$.' }
    explanation: |
      $\dot\vartheta = 0$, $\dot\varphi = 1$, so $s = \sin\vartheta_0 = \tfrac{\sqrt3}{2}\approx0.866$, the same at every $\lambda$. The speed is **constant**, so the constant-speed geodesic equation is the right test.

  - type: numeric
    id: parallel-residual
    tag: Step 4 · Parallels
    title: The residual of a parallel
    prompt: |
      On the unit sphere, chart $(\vartheta,\varphi)$, the parallel $\vartheta = \vartheta_0$, $\varphi = \lambda$ runs at constant speed $\sin\vartheta_0$. Insert it into the first geodesic equation and compute the residual
      $$\ddot\vartheta - \sin\vartheta\cos\vartheta\,\dot\varphi^2$$
      for $\vartheta_0 = \pi/3$ (three decimals).
    answer: -0.4330
    tolerance: 0.002
    answerText: '-\sqrt3/4 \approx -0.433'
    wrong:
      - { value: 0, feedback: 'Constant $\vartheta$ gives $\ddot\vartheta = 0$, but the Christoffel term remains: $-\sin\vartheta_0\cos\vartheta_0\cdot1^2 \neq 0$. A curve that is a straight line in the chart need not be a geodesic.' }
      - { value: 0.4330, feedback: 'The sign: the residual is $0 - \sin\vartheta_0\cos\vartheta_0\,\dot\varphi^2$, negative in the northern half where both factors are positive.' }
      - { value: -0.8660, feedback: 'That is $-\sin(\pi/3)$ alone. The Christoffel symbol $\Gamma^1_{22} = -\sin\vartheta\cos\vartheta$ also carries $\cos(\pi/3) = \tfrac12$.' }
    hint: $\ddot\vartheta = 0$ and $\dot\varphi = 1$; use $\sin(\pi/3) = \tfrac{\sqrt3}{2}$, $\cos(\pi/3) = \tfrac12$.
    explanation: |
      $$\begin{aligned}\ddot\vartheta - \sin\vartheta_0\cos\vartheta_0\,\dot\varphi^2 &= 0 - \tfrac{\sqrt3}{2}\cdot\tfrac12\\ &= -\tfrac{\sqrt3}{4}\approx-0.433.\end{aligned}$$
      The second equation holds: $\ddot\varphi = 0$ and $\dot\vartheta = 0$. One nonzero residual is enough: this parallel is **not** a geodesic.

  - type: mcq
    id: which-parallels
    tag: Step 4 · Parallels
    title: The puzzle, resolved
    prompt: |
      On the unit sphere, chart $(\vartheta,\varphi)$, the parallel $\vartheta = \vartheta_0$, $\varphi = \lambda$ (constant speed, $\vartheta_0\in(0,\pi)$) satisfies the second geodesic equation and leaves in the first the residual $-\sin\vartheta_0\cos\vartheta_0$. For which $\vartheta_0$ is the parallel a geodesic?
    options:
      - text: 'Only $\vartheta_0 = \pi/2$, the equator'
        correct: true
      - text: '$\vartheta_0 = \pi/4$ and $3\pi/4$, besides the equator'
        feedback: |
          At $\vartheta_0 = \pi/4$ the residual is $-\tfrac12$, the **largest** in size ($\sin\vartheta_0\cos\vartheta_0 = \tfrac12\sin2\vartheta_0$ peaks there). It vanishes only where a factor vanishes.
      - text: '$\vartheta_0 = \pi/2$ and the parallels near the poles, where $\sin\vartheta_0\approx0$'
        feedback: |
          Near a pole the residual is small, but small is not zero. These parallels are tiny circles, as bent as small circles in the plane; the residual is small only because they are run slowly (speed $\sin\vartheta_0$). $\sin\vartheta_0 = 0$ only at the poles themselves, outside the chart.
    explanation: |
      $\sin\vartheta_0 > 0$ on $(0,\pi)$, so the residual vanishes only when $\cos\vartheta_0 = 0$: $\vartheta_0 = \pi/2$. **The equator is the only parallel that is a geodesic**, as the great-circle argument predicted: of all parallels, only the equator's plane passes through the origin.

  - type: mcq
    id: equator-speed
    tag: Step 4 · Speed matters
    title: The equator, run unevenly
    prompt: |
      On the unit sphere, chart $(\vartheta,\varphi)$, run the equator unevenly: $\vartheta = \pi/2$, $\varphi = \lambda^2$ for $\lambda\in[1,2]$. Recall the constant-speed geodesic equation (G), $\ddot\gamma^k + \Gamma^k_{ij}\dot\gamma^i\dot\gamma^j = 0$, and the any-speed form (S), with right side $(\dot s/s)\,\dot\gamma^k$, $s$ the speed. Which is true?
    options:
      - text: 'It fails (G), with second residual $2$, and satisfies (S)'
        correct: true
      - text: 'It fails both: the equator is a geodesic only at constant speed'
        feedback: |
          Being a geodesic is a property of the path (stationary length does not depend on the parametrization); (S) is the test at any speed. Here $s = \sin(\pi/2)\cdot2\lambda = 2\lambda$, $\dot s/s = 1/\lambda$, and the right side of (S) for $k = 2$ is $\tfrac1\lambda\cdot2\lambda = 2$, matching the left side $\ddot\varphi = 2$.
      - text: 'It satisfies (G): all Christoffel symbols vanish on the equator'
        feedback: |
          They do vanish at $\vartheta = \pi/2$ ($\sin\cos = 0$, $\cot = 0$), but (G) also contains $\ddot\gamma^k$: $\ddot\varphi = 2\neq0$. Speeding up along the equator is an acceleration, which (G) rejects.
    explanation: |
      On the equator all $\Gamma = 0$, so the left side of (G) is $(\ddot\vartheta,\ddot\varphi) = (0,2)$. The speed is $s = 2\lambda$, so (S) asks for $(\dot s/s)(\dot\vartheta,\dot\varphi) = \tfrac1\lambda(0,2\lambda) = (0,2)$. ✓ The path is a geodesic; only the parametrization is uneven, exactly as the straight segment $r = \lambda^2$ in the plane.

  - type: text
    id: pilot
    tag: Step 4 · Physics
    title: The pilot is steering
    body: |
      Recall the **acceleration** of a curve, $a_\gamma := \nabla_{v_\gamma}v_\gamma$, with components $\ddot\gamma^k + \Gamma^k_{ji}\dot\gamma^j\dot\gamma^i$: the left side of (G). For the Levi-Civita connection a constant-speed geodesic is exactly a curve with $a_\gamma = 0$. For the parallel at $\vartheta_0$, run at $\dot\varphi = \omega$ (a constant),
      $$a_\gamma = -\sin\vartheta_0\cos\vartheta_0\,\omega^2\,\partial x_1,$$
      with $\partial x_1$ the basis vector along increasing $\vartheta$, that is, pointing **south**.

      An aircraft holding the parallel feels this acceleration in its seat: the plane must keep pushing sideways. In the northern half ($\vartheta_0 < \pi/2$) the coefficient is negative, so $a_\gamma$ points **north**, toward the pole: flying due east, the pilot is banking to the left, all the time. Let go of the controls and the plane follows the great circle tangent to the parallel, which drifts south and crosses the equator.

  - type: mcq
    id: pilot-q
    tag: Step 4 · Physics
    title: Which way to turn?
    prompt: |
      A pilot flies due east along the parallel at latitude $30°$ south, that is polar angle $\vartheta_0 = 2\pi/3$, at constant speed. On the unit sphere, chart $(\vartheta,\varphi)$, her acceleration is $a_\gamma = -\sin\vartheta_0\cos\vartheta_0\,\omega^2\,\partial x_1$, where $\omega = \dot\varphi$ and $\partial x_1$ points toward increasing $\vartheta$ (south). Which way must she keep pushing the plane?
    options:
      - text: 'South, toward the south pole'
        correct: true
      - text: 'North, toward the north pole'
        feedback: |
          That holds in the northern half. At $\vartheta_0 = 2\pi/3$, $\cos\vartheta_0 = -\tfrac12 < 0$, so $-\sin\vartheta_0\cos\vartheta_0 = +\tfrac{\sqrt3}{4} > 0$: $a_\gamma$ points along $+\partial x_1$, south. Each pilot pushes toward the **nearer** pole.
      - text: 'Nowhere: her compass heading is constant, so she flies straight'
        feedback: |
          A constant compass heading is "straight in the chart", and the chart lines are not the geodesics. The residual $\sin\vartheta_0\cos\vartheta_0\,\omega^2\neq0$ is a real acceleration she must supply.
      - text: 'It depends on her speed $\omega$'
        feedback: |
          The size grows with $\omega^2$, but $\omega^2 > 0$ never changes the sign. The direction is fixed by $\vartheta_0$ alone.
    explanation: |
      $-\sin(2\pi/3)\cos(2\pi/3) = -\tfrac{\sqrt3}{2}\cdot(-\tfrac12) = \tfrac{\sqrt3}{4}$, so $a_\gamma = \tfrac{\sqrt3}{4}\omega^2\,\partial x_1$, toward the south pole. Every parallel other than the equator bends toward its nearer pole.

  - type: text
    id: variation
    tag: Step 5 · A shorter route
    title: Push the parallel
    body: |
      A non-geodesic can be shortened. Take the half of the parallel $\vartheta_0 = \pi/3$ from longitude $-\pi/2$ to $\pi/2$: in the chart, $\gamma_\mathcal{U}(\lambda) = (\pi/3,\lambda)$ for $\lambda\in[-\pi/2,\pi/2]$, length $\pi\sin(\pi/3) = \tfrac{\sqrt3}{2}\pi\approx2.72$.

      Bend it with a deformation knob $\text{ᛊ}$ and the shape $\text{ᛉ}(\lambda) := (\cos\lambda,0)$, which vanishes at both ends (endpoints fixed):
      $$\gamma_{\text{ᛊ}}:\quad \vartheta = \tfrac\pi3 + \text{ᛊ}\cos\lambda,\quad \varphi = \lambda.$$
      $\text{ᛊ} > 0$ pushes the middle toward the equator, $\text{ᛊ} < 0$ toward the north pole. With $\dot\vartheta = -\text{ᛊ}\sin\lambda$, $\dot\varphi = 1$, the length is
      $$L(\text{ᛊ}) = \int_{-\pi/2}^{\pi/2}\sqrt{F}\,d\lambda,$$
      where
      $$\begin{aligned}F &:= \text{ᛊ}^2\sin^2\lambda\\ &\quad + \sin^2\!\big(\tfrac\pi3+\text{ᛊ}\cos\lambda\big).\end{aligned}$$

  - type: numeric
    id: first-variation
    tag: Step 5 · A shorter route
    title: The first variation
    prompt: |
      On the unit sphere, the half parallel $\vartheta = \pi/3$, $\varphi = \lambda\in[-\pi/2,\pi/2]$ is bent into $\vartheta = \tfrac\pi3+\text{ᛊ}\cos\lambda$, $\varphi = \lambda$ (endpoints fixed, $\text{ᛊ}$ a deformation knob), with length
      $$L(\text{ᛊ}) = \int_{-\pi/2}^{\pi/2}\sqrt{F}\,d\lambda,$$
      where
      $$\begin{aligned}F &:= \text{ᛊ}^2\sin^2\lambda\\ &\quad + \sin^2\!\big(\tfrac\pi3+\text{ᛊ}\cos\lambda\big).\end{aligned}$$
      Compute $\dfrac{dL}{d\text{ᛊ}}$ at $\text{ᛊ} = 0$.
    answer: 1
    answerText: '1'
    wrong:
      - { value: 0, feedback: 'Zero first variation for every shape would make the parallel a geodesic, and it is not. Differentiate under the integral: the $\text{ᛊ}^2$ term drops at $\text{ᛊ} = 0$, but $\sin^2(\tfrac\pi3+\text{ᛊ}\cos\lambda)$ has derivative $2\sin\tfrac\pi3\cos\tfrac\pi3\cos\lambda$.' }
      - { value: 2, feedback: 'That is $\int\cos\lambda\,d\lambda = 2$ without the factor $\cos\vartheta_0 = \cos\tfrac\pi3 = \tfrac12$. The integrand derivative is $\sin\vartheta_0\cos\vartheta_0\cos\lambda/\sin\vartheta_0 = \cos\vartheta_0\cos\lambda$.' }
      - { value: -1, feedback: 'The sign: at $\text{ᛊ} = 0$ the integrand derivative is $\cos\tfrac\pi3\cos\lambda \ge 0$ on the whole interval, so $L$ grows with $\text{ᛊ}$.' }
    hint: |
      $\frac{d}{d\text{ᛊ}}\sqrt{F} = \frac{F'}{2\sqrt F}$; at $\text{ᛊ} = 0$, $\sqrt F = \sin\tfrac\pi3$, and $\int_{-\pi/2}^{\pi/2}\cos\lambda\,d\lambda = 2$.
    explanation: |
      At $\text{ᛊ} = 0$ the derivative of the integrand is
      $$\frac{2\sin\frac\pi3\cos\frac\pi3\cos\lambda}{2\sin\frac\pi3} = \cos\tfrac\pi3\cos\lambda,$$
      so $\frac{dL}{d\text{ᛊ}}(0) = \tfrac12\cdot2 = 1$. In general it is $\cos\vartheta_0\int\cos\lambda\,d\lambda$: the factor $\cos\vartheta_0$ is the residual $-\sin\vartheta_0\cos\vartheta_0$ of the geodesic equation divided by $-$(speed $\sin\vartheta_0$). At the equator it vanishes, as it must for a geodesic.

  - type: mcq
    id: over-the-pole
    tag: Step 5 · A shorter route
    title: Which way is shorter?
    prompt: |
      On the unit sphere, the half parallel $\vartheta = \pi/3$ from longitude $-\pi/2$ to $\pi/2$ (length $\tfrac{\sqrt3}{2}\pi\approx2.72$) is bent into $\vartheta = \tfrac\pi3+\text{ᛊ}\cos\lambda$ with endpoints fixed, and $\frac{dL}{d\text{ᛊ}}(0) = 1$. Positive $\text{ᛊ}$ moves the middle toward the equator. Which statement is true?
    options:
      - text: 'Small negative $\text{ᛊ}$ (toward the pole) shortens it; the route over the pole along two meridians has length $2\pi/3\approx2.09$'
        correct: true
      - text: 'Small positive $\text{ᛊ}$ (toward the equator) shortens it, since the equator is the geodesic'
        feedback: |
          The equator is a geodesic, but it does not join these two endpoints. With $\frac{dL}{d\text{ᛊ}}(0) = 1 > 0$, moving toward the equator **lengthens** the curve; to first order $L(\text{ᛊ})\approx2.72 + \text{ᛊ}$, smaller for $\text{ᛊ} < 0$.
      - text: 'No small bend changes the length to first order: the parallel is stationary'
        feedback: |
          Stationary would mean $\frac{dL}{d\text{ᛊ}}(0) = 0$ for every shape, the definition of a geodesic. Here it is $1$, so the parallel is not even stationary, let alone shortest.
    explanation: |
      $L(\text{ᛊ})\approx\tfrac{\sqrt3}{2}\pi + \text{ᛊ}$: bending toward the pole shortens. Going all the way: the endpoints sit at polar angle $\pi/3$ on the meridians $\varphi = \pm\pi/2$, which together form one great circle through the north pole; the route along it has length $\tfrac\pi3+\tfrac\pi3 = \tfrac{2\pi}{3}\approx2.09 < 2.72$. This is why flights between cities on the same parallel arc toward the pole.

  - type: mcq
    id: riem
    tag: Step 6 · Curvature
    title: Is the sphere curved?
    prompt: |
      For a chart $(r,\theta)$ with metric $\mathrm{diag}(1,f(r)^2)$ the curvature component is $\mathrm{Riem}^1_{212} = -f\,f''$. The unit sphere in the chart $(\vartheta,\varphi)$ is this family with $f(\vartheta) = \sin\vartheta$. What is $\mathrm{Riem}^1_{212}$?
    options:
      - text: '$\sin^2\vartheta$'
        correct: true
      - text: '$-\sin^2\vartheta$'
        feedback: |
          That would hold for $f'' = +f$, the hyperbolic plane $f = \sinh$. For the sphere $f'' = (\sin\vartheta)'' = -\sin\vartheta$, so $-ff'' = +\sin^2\vartheta$.
      - text: '$-\sin\vartheta\cos\vartheta$'
        feedback: |
          That is $-ff'$, the Christoffel symbol $\Gamma^1_{22}$. Curvature takes one more derivative: $-ff''$.
      - text: '$0$: nonzero Christoffel symbols here are a chart effect, as in polar coordinates'
        feedback: |
          Nonzero Christoffel symbols alone prove nothing, true; but the test is $\mathrm{Riem}$, and here $-ff'' = \sin^2\vartheta\neq0$. The polar plane has $f = r$, $f'' = 0$; the sphere does not.
    explanation: |
      $f' = \cos\vartheta$, $f'' = -\sin\vartheta$, so $\mathrm{Riem}^1_{212} = \sin^2\vartheta$. Directly: $\mathrm{Riem}^1_{212} = \partial_1\Gamma^1_{22} - \Gamma^1_{22}\Gamma^2_{21}$, and
      $$\begin{aligned}&\partial_\vartheta(-\sin\vartheta\cos\vartheta) + \sin\vartheta\cos\vartheta\cot\vartheta\\ &= -\cos^2\vartheta + \sin^2\vartheta + \cos^2\vartheta\\ &= \sin^2\vartheta.\end{aligned}$$
      The sphere is curved: no chart, however clever, makes its metric components constant, so no flat map of the Earth keeps all distances.

  - type: numeric
    id: ricci-scalar
    tag: Step 6 · Curvature
    title: The Ricci scalar
    prompt: |
      On the unit sphere, chart $(\vartheta,\varphi)$, $g = \mathrm{diag}(1,\sin^2\vartheta)$ and $\mathrm{Riem}^1_{212} = \sin^2\vartheta$. In two dimensions $\rho := (\mathrm{Riem}^\flat)_{1212} = g_{11}\mathrm{Riem}^1_{212}$ and the Ricci scalar is $R = 2\rho/\det g$. Compute $R$ at $\vartheta = \pi/6$.
    answer: 2
    answerText: '2'
    wrong:
      - { value: 0.5, feedback: 'That is $2\rho = 2\sin^2(\pi/6)$ without dividing by $\det g = \sin^2(\pi/6) = \tfrac14$. The division is what makes $R$ chart independent.' }
      - { value: 1, feedback: 'That is $\rho/\det g = R/2$, the factor in $\mathrm{Ric} = \tfrac R2\,g$. The scalar itself has the $2$.' }
      - { value: 0.25, feedback: 'That is $\rho = \sin^2(\pi/6)$ itself, a component, which depends on the chart. $R = 2\rho/\det g$.' }
    explanation: |
      $\rho = 1\cdot\sin^2\vartheta$, $\det g = \sin^2\vartheta$, so
      $$R = \frac{2\sin^2\vartheta}{\sin^2\vartheta} = 2$$
      at every point, not only at $\pi/6$. The unit sphere has **constant positive** curvature $R = 2$, the mirror image of the hyperbolic plane's $R = -2$.

  - type: mcq
    id: ricci
    tag: Step 6 · Curvature
    title: The Ricci curvature
    prompt: |
      In two dimensions the Ricci curvature is $\mathrm{Ric} = \tfrac R2\,g$, with $R$ the Ricci scalar. On the unit sphere $R = 2$ everywhere. What is $\mathrm{Ric}$, in the chart $(\vartheta,\varphi)$?
    options:
      - text: '$\mathrm{Ric} = g$, components $\mathrm{diag}(1,\sin^2\vartheta)$'
        correct: true
      - text: '$\mathrm{Ric} = 2g$'
        feedback: |
          That uses $R$ in place of $\tfrac R2$. With $R = 2$, $\tfrac R2 = 1$.
      - text: '$\mathrm{diag}(1,1)$, since the curvature is the same everywhere'
        feedback: |
          The **scalar** $R$ is constant; $\mathrm{Ric}$ is a tensor field, and its components in this chart follow the metric's: $\mathrm{Ric}_{22} = \sin^2\vartheta$.
      - text: '$0$, since a Ricci contraction of a two-dimensional curvature vanishes'
        feedback: |
          In two dimensions $\mathrm{Ric} = 0$ forces $\mathrm{Riem} = 0$, and the sphere has $\mathrm{Riem}^1_{212} = \sin^2\vartheta\neq0$. So $\mathrm{Ric}\neq0$.
    explanation: |
      $\mathrm{Ric} = \tfrac22 g = g$. Check one component: $\mathrm{Ric}_{22} = \mathrm{Riem}^1_{212} + \mathrm{Riem}^2_{222} = \sin^2\vartheta + 0 = g_{22}$. ✓ A metric with $\mathrm{Ric}$ proportional to $g$ is called an **Einstein metric**; the sphere is the simplest.

  - type: order
    id: holonomy
    tag: Step 7 · Holonomy
    title: Around a triangle
    prompt: |
      On the unit sphere, carry a vector $z$ by parallel transport (Levi-Civita connection) around the triangle: north pole, down the meridian $\varphi = 0$ to the equator, east along the equator to $\varphi = \pi/2$, up the meridian $\varphi = \pi/2$ to the pole. The transport equation is $\dot z^k + \Gamma^k_{ji}z^j\dot\gamma^i = 0$, and the only nonzero symbols are $\Gamma^1_{22} = -\sin\vartheta\cos\vartheta$, $\Gamma^2_{12} = \Gamma^2_{21} = \cot\vartheta$. Put the argument in order.
    steps:
      - 'Start: $z$ points south along $\varphi = 0$, components $(z^1,z^2) = (1,0)$, that is $z = \partial x_1$.'
      - 'Down a meridian, $\dot\gamma = (1,0)$: the equations become $\dot z^1 = 0$ and $\dot z^2 = -\cot\vartheta\,z^2$, so $(1,0)$ stays $(1,0)$.'
      - 'Along the equator, $\dot\gamma = (0,1)$ at $\vartheta = \pi/2$: there $\sin\vartheta\cos\vartheta = 0$ and $\cot\vartheta = 0$, so $z$ keeps $(1,0)$.'
      - 'Up the meridian $\varphi = \pi/2$, $\dot\gamma = (-1,0)$: again $(1,0)$ stays $(1,0)$; $z$ still points south.'
      - 'At the pole, $z$ points south along $\varphi = \pi/2$, while it started south along $\varphi = 0$: turned by $90°$.'
    hint: On each leg, insert $\dot\gamma$ and $z = (1,0)$ into the transport equation and check that $\dot z = 0$.
    explanation: |
      Near the pole, $\vec u_\vartheta\to(\cos\varphi,\sin\varphi,0)$: the start is the arrow $(1,0,0)$, the end $(0,1,0)$, a rotation by $90°$, although $z$ was never turned. This is the holonomy previewed in Level 6, now proved. Check against the area: the triangle covers one eighth of the sphere, area $4\pi/8 = \pi/2$, and the turning angle is $\pi/2$ radians. On the unit sphere the angle always equals the enclosed area (stated here without proof), the large-loop version of "change $\approx$ curvature $\times$ area".

  - type: build
    id: radius-a
    tag: Step 8 · A sphere of radius a
    title: Scale the sphere
    prompt: |
      The sphere of radius $a > 0$ has chart inverse $\mathscr{X}^{-1}(\vartheta,\varphi) = a\,(\sin\vartheta\cos\varphi,\ \sin\vartheta\sin\varphi,\ \cos\vartheta)$, and the metric components are the dot products $g_{ij} = \vec u_i\cdot\vec u_j$ of the coordinate-line arrows $\vec u_\vartheta := \partial\mathscr{X}^{-1}/\partial\vartheta$, $\vec u_\varphi := \partial\mathscr{X}^{-1}/\partial\varphi$. Build $g_{22}$.
    prefix: 'g_{22} ='
    tiles: ['a^2', 'a', '\sin^2\vartheta', '\sin\vartheta', '\cos^2\vartheta']
    answers:
      - ['a^2', '\sin^2\vartheta']
      - ['\sin^2\vartheta', 'a^2']
    wrong:
      - { answer: ['a', '\sin^2\vartheta'], feedback: 'Each arrow carries a factor $a$, and $g_{22}$ is the dot product of $\vec u_\varphi$ with itself: $a\cdot a = a^2$. Lengths scale by $a$, squared lengths by $a^2$.' }
      - { answer: ['a^2', '\sin\vartheta'], feedback: 'That is $a$ times the length of $\vec u_\varphi$ for the unit sphere, not a squared length. $\vec u_\varphi\cdot\vec u_\varphi = a^2\sin^2\vartheta$.' }
    hint: Every entry of $\mathscr{X}^{-1}$, hence of each arrow, is multiplied by $a$.
    explanation: |
      $\vec u_\varphi = a(-\sin\vartheta\sin\varphi,\ \sin\vartheta\cos\varphi,\ 0)$, so $g_{22} = a^2\sin^2\vartheta$; likewise $g_{11} = a^2$. The metric is
      $$g_{ij} = a^2\,\mathrm{diag}(1,\sin^2\vartheta).$$

  - type: numeric
    id: radius-R
    tag: Step 8 · A sphere of radius a
    title: Curvature of a bigger sphere
    prompt: |
      The sphere of radius $a$ has metric $g_{ij} = a^2\,\mathrm{diag}(1,\sin^2\vartheta)$ in the chart $(\vartheta,\varphi)$; the unit sphere ($a = 1$) has Ricci scalar $R = 2$. Compute $R$ for $a = 2$.
    answer: 0.5
    answerText: '1/2'
    wrong:
      - { value: 2, feedback: 'The Christoffel symbols and $\mathrm{Riem}^i_{jkm}$ do not change when $g$ is multiplied by a constant, but $R = (g^{-1})^{mk}\mathrm{Ric}_{km}$ uses the inverse metric, which is divided by $a^2$. A bigger sphere is flatter.' }
      - { value: 1, feedback: 'That is $2/a$. Curvature has units of $1/\text{length}^2$ (two derivatives of the metric): $R = 2/a^2$.' }
      - { value: 8, feedback: 'That is $2a^2$: the scaling goes the other way. The Earth is far less curved than a tennis ball; a larger sphere has smaller $R$.' }
    hint: Multiplying $g$ by the constant $a^2$ leaves every $\Gamma^k_{ij} = \tfrac12(g^{-1})^{km}(\dots)$ unchanged, hence $\mathrm{Riem}^i_{jkm}$ and $\mathrm{Ric}_{km}$ too; only the inverse metric in $R = (g^{-1})^{mk}\mathrm{Ric}_{km}$ changes.
    explanation: |
      **Scaling.** $g\to a^2g$ leaves $\Gamma$, $\mathrm{Riem}^i_{jkm}$ and $\mathrm{Ric}$ unchanged, and divides $(g^{-1})^{mk}$ by $a^2$, so $R = 2/a^2$.

      **Family.** Use the distance from the pole $r := a\vartheta$ as first coordinate: $g = \mathrm{diag}(1,f(r)^2)$ with $f(r) = a\sin(r/a)$. Then $f'' = -\tfrac1a\sin(r/a)$, $\rho = -ff'' = \sin^2(r/a)$, $\det g = a^2\sin^2(r/a)$, and $R = 2\rho/\det g = 2/a^2$.

      For $a = 2$: $R = \tfrac12$.

  - type: text
    id: summary
    title: What you now own
    body: |
      **The puzzle, resolved.** Meridians and the equator are geodesics; every other parallel bends toward its nearer pole, so a pilot flying due east off the equator is steering all the time.

      - **Round metric** on the unit sphere $S^2 := \{(x,y,z)\in\mathbb{R}^3\mid x^2+y^2+z^2=1\}$, from dot products in $\mathbb{R}^3$, in the chart $(\vartheta,\varphi)$ (polar angle and longitude) of the parametrization $(x,y,z) = (\sin\vartheta\cos\varphi,\sin\vartheta\sin\varphi,\cos\vartheta)$ with $\vartheta\in(0,\pi)$, $\varphi\in(-\pi,\pi)$:
      $$g_{ij} = \mathrm{diag}(1,\sin^2\vartheta)$$
      the family $\mathrm{diag}(1,f^2)$ with $f(\vartheta) = \sin\vartheta$. Indices $1,2$ stand for $\vartheta,\varphi$; a dot is $d/d\lambda$ along a curve $\lambda\mapsto(\vartheta,\varphi)$.
      - **Christoffel symbols** (all others $0$):
      $$\begin{gathered}\Gamma^1_{22} = -\sin\vartheta\cos\vartheta\\ \Gamma^2_{12} = \Gamma^2_{21} = \cot\vartheta\end{gathered}$$
      - **Geodesic equation** (constant speed):
      $$\ddot\vartheta - \sin\vartheta\cos\vartheta\,\dot\varphi^2 = 0$$
      $$\ddot\varphi + 2\cot\vartheta\,\dot\vartheta\,\dot\varphi = 0$$
      - **Meridians** pass (speed $1$); by rotations, all **great circles** are geodesics. The **parallel** $\vartheta_0$ leaves the residual $-\sin\vartheta_0\cos\vartheta_0$, zero only at the equator; bending it toward the pole shortens it: deforming $\vartheta = \vartheta_0$, $\varphi = \lambda$ ($\lambda\in[a,b]$) to $\vartheta = \vartheta_0 + \text{ᛊ}\,\text{ᛉ}^1(\lambda)$ with $\text{ᛉ}^1(a) = \text{ᛉ}^1(b) = 0$ gives $\frac{dL}{d\text{ᛊ}}\big|_0 = \cos\vartheta_0\int_a^b\text{ᛉ}^1d\lambda$.
      - **Curvature** ($\mathrm{Riem}$, $\mathrm{Ric}$, $R$ those of the Levi-Civita connection of $g$, $R$ the Ricci scalar): $\mathrm{Riem}^1_{212} = \sin^2\vartheta$, $\mathrm{Ric} = g$, and
      $$R = 2,\quad\text{sphere of radius } a:\ R = \frac{2}{a^2}.$$
      - **Holonomy**: around the triangle made of the north pole, a meridian down to the equator, a quarter of the equator and a meridian back up, a parallel-transported vector turns by $90°$, the area $\pi/2$ of the triangle.

      **Next: "Metric Traps".** Fast questions on the level's tempting mistakes: straight in a chart versus geodesic, nonzero Christoffel symbols versus curvature, length versus energy, and which signature does what.
