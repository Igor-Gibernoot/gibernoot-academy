id: ch07-geodesic-equation
title: "Guided Problem: Deriving the Geodesic Equation"
kind: guided

cards:
  - type: text
    id: hook
    title: Two equations from nowhere
    body: |
      Take the Euclidean plane with its polar chart $\mathscr{Y} = (r,\theta)$, $\theta\in(-\pi,\pi)$, where the metric has components $g_{ij} = \mathrm{diag}(1,r^2)$. A curve $\gamma$ in the chart domain has polar components $r(\lambda) := \mathscr{Y}^1(\gamma(\lambda))$ and $\theta(\lambda) := \mathscr{Y}^2(\gamma(\lambda))$; a dot is $d/d\lambda$.

      Someone hands you two differential equations:
      $$\ddot r - r\,\dot\theta^2 = 0$$
      $$\ddot\theta + \tfrac{2}{r}\,\dot r\,\dot\theta = 0$$
      and claims: their solutions are the geodesics of the plane (the curves of stationary length), run at constant speed. Before deriving anything, test the claim on three curves:
      - the radial line $r = \lambda$, $\theta = 0$;
      - the circle $r = 1$, $\theta = \lambda$;
      - the radial line $r = \lambda^2$, $\theta = 0$, for $\lambda\in[1,2]$.

  - type: mcq
    id: hook-guess
    title: Which curves pass?
    prompt: |
      Euclidean plane, polar chart $(r,\theta)$, a dot is $d/d\lambda$. Which of the curves (i) $r = \lambda,\ \theta = 0$; (ii) $r = 1,\ \theta = \lambda$; (iii) $r = \lambda^2,\ \theta = 0$ with $\lambda\in[1,2]$ satisfy both equations
      $$\ddot r - r\,\dot\theta^2 = 0$$
      $$\ddot\theta + \tfrac{2}{r}\,\dot r\,\dot\theta = 0\ ?$$
    options:
      - text: 'Only (i)'
        correct: true
      - text: '(i) and (ii)'
        feedback: |
          On the circle $\ddot r = 0$ and $\ddot\theta = 0$, which looks like "no acceleration". But the first equation has the extra term $-r\dot\theta^2 = -1$, so it reads $0 - 1 = -1\neq0$. A circle bends; the extra term detects it.
      - text: '(i) and (iii)'
        feedback: |
          Curve (iii) runs along a straight segment, which seems to be the best possible path. Yet $\ddot r = 2$ and $\dot\theta = 0$, so $\ddot r - r\dot\theta^2 = 2\neq0$. Why a straight path fails is one of this lesson's puzzles.
      - text: 'All three'
        feedback: |
          Check the first equation: on the circle $\ddot r - r\dot\theta^2 = 0 - 1\cdot1^2 = -1$, and on (iii) $\ddot r - r\dot\theta^2 = 2 - 0 = 2$. Only (i) gives $0$.
    explanation: |
      (i): $\ddot r = 0$ and $\dot\theta = 0$, both equations hold. (ii): $\ddot r - r\dot\theta^2 = -1$. (iii): $\ddot r - r\dot\theta^2 = 2$, although its path is a straight segment. Where do these equations come from, and why do they reject (iii)? This lesson derives them from the length.

  - type: text
    id: setup
    title: The problem
    body: |
      Recall the setting. $\gamma$ is a smooth curve on a manifold $\mathcal{M}$ with metric $g$, studied on $[a,b]$, inside a chart $(\mathcal{U},\mathscr{X})$ of dimension $d$; $\gamma_\mathcal{U} := \mathscr{X}\circ\gamma$ is its chart representative, with components $\gamma^i$ and velocity components $\dot\gamma^i$. Its sign $\text{ᛇ}_\gamma = \mathrm{sgn}\,g(v_\gamma,v_\gamma)$ is never $0$ on $[a,b]$, so by continuity it is a constant, $+1$ or $-1$, and the speed $s_\gamma > 0$.

      The **Lagrangian** in the bundle chart, with position slots $\alpha$ and velocity slots $\beta$:
      $$\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{\text{ᛇ}_\gamma\,g_{ij}\,\beta^i\beta^j},$$
      with $g_{ij}$ evaluated at the point $\mathscr{X}^{-1}(\alpha)$. $\gamma$ is a **geodesic** if and only if the **Euler-Lagrange equations** hold:
      $$\frac{d}{d\lambda}P_m - Q_m = 0,\quad m = 1,\dots,d,$$
      where $P_m$ and $Q_m$ are the partial derivatives $\partial_{d+m}\mathcal{L}_\mathscr{X}$ (the $m$-th velocity slot) and $\partial_m\mathcal{L}_\mathscr{X}$ (the $m$-th position slot), evaluated at $(\gamma_\mathcal{U};\dot\gamma_\mathcal{U})$.

      **The problem:** turn these into an equation that gives $\ddot\gamma^k$ explicitly. Four moves: compute both partials, differentiate in $\lambda$, symmetrize, solve for $\ddot\gamma^k$.

  - type: mcq
    id: velocity-slot
    tag: Step 1 · Velocity slots
    title: Differentiate in a velocity slot
    prompt: |
      On a manifold with metric $g$ (components $g_{ij} = g_{ji}$ in a chart $\mathscr{X}$), the length Lagrangian is
      $$\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{\text{ᛇ}_\gamma\,g_{ij}\,\beta^i\beta^j},$$
      with $g_{ij}$ evaluated at $\mathscr{X}^{-1}(\alpha)$ and a constant sign $\text{ᛇ}_\gamma = \pm1$. What is $\partial_{d+m}\mathcal{L}_\mathscr{X}$, the derivative in the $m$-th velocity slot $\beta^m$?
    options:
      - text: '$\dfrac{\text{ᛇ}_\gamma\,g_{mj}\,\beta^j}{\mathcal{L}_\mathscr{X}}$'
        correct: true
      - text: '$\dfrac{\text{ᛇ}_\gamma\,g_{mj}\,\beta^j}{2\mathcal{L}_\mathscr{X}}$'
        feedback: |
          The root does give $\frac{1}{2\mathcal{L}_\mathscr{X}}$, but $\beta^m$ sits in **both** factors of $\beta^i\beta^j$. The product rule gives $\delta^i_m\beta^j + \beta^i\delta^j_m$, and with $g_{ij} = g_{ji}$ the two terms are equal: $2\,g_{mj}\beta^j$. The $2$ cancels.
      - text: '$\dfrac{\text{ᛇ}_\gamma\,\partial_m g_{ij}\,\beta^i\beta^j}{2\mathcal{L}_\mathscr{X}}$'
        feedback: |
          That differentiates the components $g_{ij}$, which depend on the **position** slots $\alpha$ only. In a velocity slot $g_{ij}$ is a constant; only $\beta^i\beta^j$ is differentiated.
      - text: '$\dfrac{\text{ᛇ}_\gamma\,g_{mm}\,\beta^m}{\mathcal{L}_\mathscr{X}}$'
        feedback: |
          That keeps only the diagonal term. $\beta^m$ also appears in the off-diagonal terms $g_{mj}\beta^m\beta^j$ with $j\neq m$; the sum over $j$ remains: $g_{mj}\beta^j$. Only for a diagonal metric does it reduce to $g_{mm}\beta^m$.
    explanation: |
      With $\partial\sqrt{f} = \partial f/(2\sqrt f)$ and $\partial\beta^i/\partial\beta^m = \delta^i_m$:
      $$\begin{aligned}&\partial_{d+m}\mathcal{L}_\mathscr{X}\\ &= \frac{\text{ᛇ}_\gamma\,g_{ij}\,(\delta^i_m\beta^j + \beta^i\delta^j_m)}{2\mathcal{L}_\mathscr{X}}\\ &= \frac{\text{ᛇ}_\gamma\,(g_{mj}\beta^j + g_{im}\beta^i)}{2\mathcal{L}_\mathscr{X}}\\ &= \frac{\text{ᛇ}_\gamma\,g_{mj}\,\beta^j}{\mathcal{L}_\mathscr{X}},\end{aligned}$$
      using $g_{im} = g_{mi}$ and renaming $i\to j$.

  - type: build
    id: position-slot
    tag: Step 1 · Position slots
    title: Differentiate in a position slot
    prompt: |
      The length Lagrangian $\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{\text{ᛇ}_\gamma\,g_{ij}\,\beta^i\beta^j}$ depends on the position slots $\alpha$ only through the components $g_{ij}$, evaluated at $\mathscr{X}^{-1}(\alpha)$. Write $\partial_m g_{ij}$ for the derivative of $g_{ij}\circ\mathscr{X}^{-1}$ in its $m$-th slot. Build $\partial_m\mathcal{L}_\mathscr{X}$.
    prefix: '\partial_m\mathcal{L}_\mathscr{X} ='
    tiles: ['\frac{\text{ᛇ}_\gamma}{2\mathcal{L}_\mathscr{X}}', '\frac{\text{ᛇ}_\gamma}{\mathcal{L}_\mathscr{X}}', '\partial_m g_{ij}', 'g_{mj}', '\beta^i\beta^j', '\beta^j']
    answers:
      - ['\frac{\text{ᛇ}_\gamma}{2\mathcal{L}_\mathscr{X}}', '\partial_m g_{ij}', '\beta^i\beta^j']
      - ['\frac{\text{ᛇ}_\gamma}{2\mathcal{L}_\mathscr{X}}', '\beta^i\beta^j', '\partial_m g_{ij}']
      - ['\partial_m g_{ij}', '\frac{\text{ᛇ}_\gamma}{2\mathcal{L}_\mathscr{X}}', '\beta^i\beta^j']
      - ['\partial_m g_{ij}', '\beta^i\beta^j', '\frac{\text{ᛇ}_\gamma}{2\mathcal{L}_\mathscr{X}}']
      - ['\beta^i\beta^j', '\frac{\text{ᛇ}_\gamma}{2\mathcal{L}_\mathscr{X}}', '\partial_m g_{ij}']
      - ['\beta^i\beta^j', '\partial_m g_{ij}', '\frac{\text{ᛇ}_\gamma}{2\mathcal{L}_\mathscr{X}}']
    wrong:
      - { answer: ['\frac{\text{ᛇ}_\gamma}{\mathcal{L}_\mathscr{X}}', '\partial_m g_{ij}', '\beta^i\beta^j'], feedback: 'The $\tfrac12$ of $\partial\sqrt f = \partial f/(2\sqrt f)$ survives here. In a velocity slot it was cancelled by the two factors $\beta^i\beta^j$; in a position slot only the single factor $g_{ij}$ depends on $\alpha$, so nothing doubles.' }
      - { answer: ['\frac{\text{ᛇ}_\gamma}{\mathcal{L}_\mathscr{X}}', 'g_{mj}', '\beta^j'], feedback: 'That is the velocity-slot derivative $\partial_{d+m}\mathcal{L}_\mathscr{X}$. In a position slot the velocities $\beta$ are constants and only $g_{ij}$ is differentiated, giving $\partial_m g_{ij}$ with both $\beta$ factors kept.' }
    hint: Use $\partial\sqrt f = \partial f/(2\sqrt f)$; in a position slot $\beta^i\beta^j$ is a constant factor.
    explanation: |
      $$\partial_m\mathcal{L}_\mathscr{X} = \frac{\text{ᛇ}_\gamma\,(\partial_m g_{ij})\,\beta^i\beta^j}{2\mathcal{L}_\mathscr{X}}.$$
      Check in the polar Euclidean plane, $\mathcal{L}_\mathscr{Y} = \sqrt{(\beta^1)^2 + r^2(\beta^2)^2}$: only $\partial_1g_{22} = 2r$ is nonzero, so $\partial_1\mathcal{L}_\mathscr{Y} = r(\beta^2)^2/\mathcal{L}_\mathscr{Y}$, which is $1$ at $r = 2$, $\beta = (0,1)$.

  - type: numeric
    id: polar-velocity-slot
    tag: Step 1 · Check
    title: A velocity slot in polar components
    prompt: |
      In the polar chart of the Euclidean plane the length Lagrangian is
      $$\mathcal{L}_\mathscr{Y}(r,\theta;\beta) = \sqrt{(\beta^1)^2 + r^2(\beta^2)^2},$$
      so $d = 2$ and $\partial_4$ is the derivative in the velocity slot $\beta^2$. Compute $\partial_4\mathcal{L}_\mathscr{Y}$ at $r = 2$, $\theta = 0$, $\beta = (0,1)$.
    answer: 2
    answerText: '2'
    wrong:
      - { value: 1, feedback: 'That has an extra $\tfrac12$. The derivative of $r^2(\beta^2)^2$ in $\beta^2$ is $2r^2\beta^2$, and the $2$ cancels the $\tfrac12$ of the root: $r^2\beta^2/\mathcal{L}_\mathscr{Y} = 4/2$.' }
      - { value: 4, feedback: 'That is $g_{22}\beta^2 = r^2\beta^2$ without the division by $\mathcal{L}_\mathscr{Y} = \sqrt{0 + 4\cdot1} = 2$.' }
    hint: The general formula is $\partial_{d+m}\mathcal{L}_\mathscr{X} = \text{ᛇ}_\gamma\,g_{mj}\beta^j/\mathcal{L}_\mathscr{X}$, here with $g_{2j}\beta^j = r^2\beta^2$.
    explanation: |
      $\mathcal{L}_\mathscr{Y} = \sqrt{0 + 4} = 2$ and $g_{2j}\beta^j = r^2\beta^2 = 4$, so $\partial_4\mathcal{L}_\mathscr{Y} = 4/2 = 2$. Differentiating the root directly gives the same: $r^2\beta^2/\sqrt{(\beta^1)^2 + r^2(\beta^2)^2}$.

  - type: text
    id: on-curve
    tag: Step 2 · On the curve
    title: Insert the curve
    body: |
      Evaluate at the curve, $\alpha = \gamma_\mathcal{U}(\lambda)$ and $\beta = \dot\gamma_\mathcal{U}(\lambda)$. There the Lagrangian is the speed, $\mathcal{L}_\mathscr{X} = s_\gamma(\lambda)$, so
      $$P_m = \frac{\text{ᛇ}_\gamma\,g_{mj}\,\dot\gamma^j}{s_\gamma}$$
      $$Q_m = \frac{\text{ᛇ}_\gamma\,(\partial_m g_{ij})\,\dot\gamma^i\dot\gamma^j}{2\,s_\gamma}$$
      with every $g_{ij}$ and $\partial_m g_{ij}$ evaluated at $\gamma(\lambda)$. Multiply the Euler-Lagrange equation $\dot P_m - Q_m = 0$ by $\text{ᛇ}_\gamma\,s_\gamma$, using $\text{ᛇ}_\gamma^2 = 1$:
      $$s_\gamma\,\frac{d}{d\lambda}\Big(\frac{g_{mj}\,\dot\gamma^j}{s_\gamma}\Big) - \tfrac12(\partial_m g_{ij})\,\dot\gamma^i\dot\gamma^j = 0.$$

  - type: mcq
    id: multiply-why
    tag: Step 2 · On the curve
    title: Is multiplying allowed?
    prompt: |
      Along a curve $\gamma$ with constant sign $\text{ᛇ}_\gamma = \pm1$ and speed $s_\gamma(\lambda)$, the Euler-Lagrange equations $\dot P_m - Q_m = 0$ are multiplied by $\text{ᛇ}_\gamma\,s_\gamma(\lambda)$. Why is the new equation still **equivalent** to the old one (a geodesic if and only if it holds)?
    options:
      - text: 'Because $\text{ᛇ}_\gamma\,s_\gamma(\lambda)\neq0$ for every $\lambda\in[a,b]$, so one can divide back'
        correct: true
      - text: 'Because $\text{ᛇ}_\gamma^2 = 1$'
        feedback: |
          $\text{ᛇ}_\gamma^2 = 1$ only simplifies the result (it removes the sign rune). Equivalence needs the factor to be nonzero: multiplying by a function that vanishes somewhere would create spurious solutions there.
      - text: 'Multiplying any equation by any function keeps it equivalent'
        feedback: |
          $E = 0$ implies $fE = 0$, but $fE = 0$ implies $E = 0$ only where $f\neq0$. Here $f = \text{ᛇ}_\gamma\,s_\gamma$ has $\text{ᛇ}_\gamma = \pm1$ and $s_\gamma > 0$, so it never vanishes.
      - text: 'Because the speed is constant'
        feedback: |
          Nothing has assumed constant speed yet; $s_\gamma(\lambda)$ may vary. What matters is that $s_\gamma > 0$, guaranteed by the nonzero sign: $s_\gamma = \sqrt{\text{ᛇ}_\gamma\,g(v_\gamma,v_\gamma)}$ with $g(v_\gamma,v_\gamma)\neq0$.
    explanation: |
      This is exactly why lightlike curves ($\text{ᛇ}_\gamma = 0$, $s_\gamma = 0$) are excluded: the Lagrangian $\sqrt{\cdot}$ is not differentiable there, and the factor $s_\gamma$ could not be divided out.

  - type: mcq
    id: constant-speed
    tag: Step 3 · The λ-derivative
    title: Use constant speed
    prompt: |
      Along a curve, let $X(\lambda)$ be a smooth function and $s$ a **constant** nonzero speed. What is
      $$s\,\frac{d}{d\lambda}\Big(\frac{X}{s}\Big)\ ?$$
    options:
      - text: '$\dot X$'
        correct: true
      - text: '$0$'
        feedback: |
          Constant speed does not mean constant velocity components: $X = g_{mj}\dot\gamma^j$ can change along the curve (a circle run at constant speed has changing velocity components). Only the factor $1/s$ is constant, so it moves out of the derivative.
      - text: '$\dot X/s$'
        feedback: |
          Pulling out the constant gives $\frac{d}{d\lambda}(X/s) = \dot X/s$, but the expression also has the factor $s$ in front: $s\cdot\dot X/s = \dot X$.
      - text: '$\dot X - X$'
        feedback: |
          A term like that would come from differentiating $1/s$, and for constant $s$ its derivative is $0$. Without constant speed the quotient rule gives $\dot X - (\dot s/s)X$; the extra term vanishes when $\dot s = 0$.
    explanation: |
      With $s$ constant, $1/s$ leaves the derivative and cancels against the $s$ in front. The Euler-Lagrange equation of the metric becomes
      $$\frac{d}{d\lambda}\big(g_{mj}\,\dot\gamma^j\big) - \tfrac12(\partial_m g_{ij})\,\dot\gamma^i\dot\gamma^j = 0.$$
      From now on assume constant speed; the variable-speed case comes back at the end.

  - type: build
    id: chain-rule
    tag: Step 3 · The λ-derivative
    title: The metric changes along the curve
    prompt: |
      The component $g_{mj}$ is a function on the chart domain, and along the curve it becomes $\lambda\mapsto g_{mj}(\gamma(\lambda))$. Recall: for a smooth function $f$, $(f\circ\gamma)' = v_\gamma(f)$, which in the chart is $\dot\gamma^i$ times the slot derivatives $\partial_i f$. Build the $\lambda$-derivative.
    prefix: '\tfrac{d}{d\lambda}\big[g_{mj}(\gamma(\lambda))\big] ='
    tiles: ['(\partial_i g_{mj})(\gamma(\lambda))', '\dot\gamma^i', '\ddot\gamma^i', '(\partial_m g_{ij})(\gamma(\lambda))', '\dot\gamma^m']
    answers:
      - ['(\partial_i g_{mj})(\gamma(\lambda))', '\dot\gamma^i']
      - ['\dot\gamma^i', '(\partial_i g_{mj})(\gamma(\lambda))']
    wrong:
      - { answer: ['(\partial_m g_{ij})(\gamma(\lambda))', '\dot\gamma^i'], feedback: 'The differentiated function is $g_{mj}$, with its own indices $m,j$ fixed; the chain rule adds a **new** summed index $i$ for the slot: $\partial_i g_{mj}$. Writing $\partial_m g_{ij}$ differentiates a different component in a fixed slot.' }
      - { answer: ['(\partial_i g_{mj})(\gamma(\lambda))', '\ddot\gamma^i'], feedback: 'The chain rule multiplies by the first derivative of the inner function, $\dot\gamma^i$. Second derivatives $\ddot\gamma$ appear only when $\dot\gamma^j$ itself is differentiated.' }
      - { answer: ['(\partial_i g_{mj})(\gamma(\lambda))', '\dot\gamma^m'], feedback: 'The summed index of the chain rule must match the slot of $\partial_i$: $\sum_i(\partial_i g_{mj})\dot\gamma^i$. $\dot\gamma^m$ carries the fixed index $m$ instead, and leaves $i$ unpaired.' }
    hint: Chain rule, with a sum over the slot index $i$ of $g_{mj}\circ\mathscr{X}^{-1}$.
    explanation: |
      $$\frac{d}{d\lambda}\big[g_{mj}(\gamma(\lambda))\big] = (\partial_i g_{mj})\,\dot\gamma^i.$$
      Polar example: $g_{22} = r^2$ along a curve changes at the rate $(\partial_1 g_{22})\,\dot r = 2r\dot r$, as differentiating $r(\lambda)^2$ directly confirms.

  - type: text
    id: expanded
    tag: Step 3 · The λ-derivative
    title: Product rule
    body: |
      The product rule on $g_{mj}\,\dot\gamma^j$, with the chain rule for the first factor, gives
      $$\begin{aligned}&\tfrac{d}{d\lambda}\big(g_{mj}\,\dot\gamma^j\big)\\ &= (\partial_i g_{mj})\,\dot\gamma^i\dot\gamma^j + g_{mj}\,\ddot\gamma^j.\end{aligned}$$
      Inserted into the constant-speed Euler-Lagrange equation:
      $$\begin{aligned}&g_{mj}\,\ddot\gamma^j + (\partial_i g_{mj})\,\dot\gamma^i\dot\gamma^j\\ &\quad - \tfrac12(\partial_m g_{ij})\,\dot\gamma^i\dot\gamma^j = 0.\end{aligned}$$
      Already a second-order equation. Two blemishes: the coefficient of $\dot\gamma^i\dot\gamma^j$ is not symmetric in $i$ and $j$, and $\ddot\gamma^j$ is still mixed by $g_{mj}$.

  - type: mcq
    id: swap-legal
    tag: Step 4 · Symmetrize
    title: Swapping summed indices
    prompt: |
      In a chart, with the sums over $i$ and $j$ implied (Einstein summation),
      $$S := (\partial_i g_{mj})\,\dot\gamma^i\dot\gamma^j.$$
      Is $S = (\partial_j g_{mi})\,\dot\gamma^i\dot\gamma^j$ for every curve?
    options:
      - text: 'Yes: rename the summed indices $i\leftrightarrow j$, then use $\dot\gamma^j\dot\gamma^i = \dot\gamma^i\dot\gamma^j$'
        correct: true
      - text: 'Yes, because $\partial_i g_{mj} = \partial_j g_{mi}$ for every metric'
        feedback: |
          The individual coefficients differ in general. Polar Euclidean, $m = 2$: $\partial_1g_{22} = 2r$ but $\partial_2g_{21} = 0$. Only the double sums agree: both equal $2r\,\dot r\,\dot\theta$.
      - text: 'Only for a diagonal metric'
        feedback: |
          The argument never looks at the values of $g$: summed indices are dummy labels, and the velocity components are real numbers that commute. It works for every metric.
      - text: 'No: $m$ is fixed, so $i$ and $j$ cannot be exchanged'
        feedback: |
          $m$ is a fixed free index and stays untouched. $i$ and $j$ are both summed, and a summed index may be renamed at will, as $\sum_i a_i = \sum_k a_k$.
    explanation: |
      Polar check, $m = 2$, where only $\partial_1g_{22} = 2r$ is nonzero: $(\partial_ig_{2j})\dot\gamma^i\dot\gamma^j$ keeps $i = 1,j = 2$ and gives $2r\,\dot r\,\dot\theta$; $(\partial_jg_{2i})\dot\gamma^i\dot\gamma^j$ keeps $i = 2,j = 1$ and gives $2r\,\dot\theta\,\dot r$. Equal sums, different terms.

  - type: order
    id: swap-order
    tag: Step 4 · Symmetrize
    title: Symmetrize, step by step
    prompt: |
      In a chart, with Einstein summation, put in order the argument that turns $S := (\partial_i g_{mj})\,\dot\gamma^i\dot\gamma^j$ into a form whose coefficient is symmetric in $i$ and $j$.
    steps:
      - 'Note that $S$ is a double sum over the indices $i$ and $j$; $m$ is fixed.'
      - 'Rename the summation labels $i\leftrightarrow j$: $S = (\partial_j g_{mi})\,\dot\gamma^j\dot\gamma^i$.'
      - 'Real numbers commute, $\dot\gamma^j\dot\gamma^i = \dot\gamma^i\dot\gamma^j$, so $S = (\partial_j g_{mi})\,\dot\gamma^i\dot\gamma^j$.'
      - 'Take half of each expression for $S$: $S = \tfrac12(\partial_i g_{mj} + \partial_j g_{mi})\,\dot\gamma^i\dot\gamma^j$.'
    hint: Renaming comes before commuting; averaging comes last.
    explanation: |
      The new coefficient $\tfrac12(\partial_i g_{mj} + \partial_j g_{mi})$ is unchanged by $i\leftrightarrow j$. Only the symmetric part of a coefficient survives contraction with $\dot\gamma^i\dot\gamma^j$, so symmetrizing loses nothing and makes the coefficient unique.

  - type: text
    id: lowered
    tag: Step 4 · Symmetrize
    title: The lowered form
    body: |
      $\partial_m g_{ij}$ is already symmetric in $i,j$ (because $g_{ij} = g_{ji}$). After symmetrizing, the equation of the expanded card reads
      $$g_{mj}\,\ddot\gamma^j + \Gamma_{mij}\,\dot\gamma^i\dot\gamma^j = 0,$$
      where, for each point of the chart domain,
      $$\begin{aligned}\Gamma_{mij} := \tfrac12\big(&\partial_i g_{mj} + \partial_j g_{mi}\\ &- \partial_m g_{ij}\big).\end{aligned}$$
      $\Gamma_{mij}$ is just a name for this combination of first derivatives of the metric: its first index $m$ is the equation's free index, the pair $i,j$ is contracted with the velocities, and it is symmetric in $i,j$. One move remains: $\ddot\gamma^j$ is still multiplied by $g_{mj}$.

  - type: build
    id: raise
    tag: Step 5 · Solve for the acceleration
    title: Undo the metric
    prompt: |
      In a chart, a constant-speed geodesic satisfies, for $m = 1,\dots,d$ (Einstein summation),
      $$g_{mj}\,\ddot\gamma^j + \Gamma_{mij}\,\dot\gamma^i\dot\gamma^j = 0.$$
      Recall: the inverse metric has components $(g^{-1})^{km}$ with $(g^{-1})^{km}g_{mj} = \delta^k_j$. Multiply by the right factor, sum over $m$, and build the equation for $\ddot\gamma^k$.
    prefix: '\ddot\gamma^k +'
    suffix: '= 0'
    tiles: ['(g^{-1})^{km}', 'g_{km}', '\Gamma_{mij}', '\dot\gamma^i\dot\gamma^j', '\ddot\gamma^j', '\delta^k_m']
    answers:
      - ['(g^{-1})^{km}', '\Gamma_{mij}', '\dot\gamma^i\dot\gamma^j']
      - ['(g^{-1})^{km}', '\dot\gamma^i\dot\gamma^j', '\Gamma_{mij}']
      - ['\Gamma_{mij}', '(g^{-1})^{km}', '\dot\gamma^i\dot\gamma^j']
      - ['\Gamma_{mij}', '\dot\gamma^i\dot\gamma^j', '(g^{-1})^{km}']
      - ['\dot\gamma^i\dot\gamma^j', '(g^{-1})^{km}', '\Gamma_{mij}']
      - ['\dot\gamma^i\dot\gamma^j', '\Gamma_{mij}', '(g^{-1})^{km}']
    wrong:
      - { answer: ['g_{km}', '\Gamma_{mij}', '\dot\gamma^i\dot\gamma^j'], feedback: 'Multiplying by $g_{km}$ gives $g_{km}g_{mj}\ddot\gamma^j$, which is not $\ddot\gamma^k$ (and $g_{km}g_{mj}$ is a same-height sum, not even chart independent). The inverse metric is what turns $g_{mj}$ into $\delta^k_j$.' }
      - { answer: ['\Gamma_{mij}', '\dot\gamma^i\dot\gamma^j'], feedback: 'Then the free index on the left would be $k$ and on the right $m$: the indices do not match. Freeing $\ddot\gamma^k$ requires multiplying the whole equation by $(g^{-1})^{km}$, including the $\Gamma$ term.' }
      - { answer: ['\delta^k_m', '\Gamma_{mij}', '\dot\gamma^i\dot\gamma^j'], feedback: '$\delta^k_m$ only renames $m$ to $k$; it is what you get **after** multiplying $g$ by its inverse, in the first term. The $\Gamma$ term is multiplied by the inverse metric itself, which is not the identity unless $g_{ij} = \delta_{ij}$.' }
    hint: Which factor turns $g_{mj}\,\ddot\gamma^j$ into $\ddot\gamma^k$? Multiply **both** terms by it.
    explanation: |
      $(g^{-1})^{km}g_{mj}\,\ddot\gamma^j = \delta^k_j\,\ddot\gamma^j = \ddot\gamma^k$, so
      $$\ddot\gamma^k + (g^{-1})^{km}\,\Gamma_{mij}\,\dot\gamma^i\dot\gamma^j = 0.$$
      Every step can be undone ($g^{-1}$ is invertible), so this is still equivalent to being a geodesic, for constant speed.

  - type: text
    id: geodesic-equation
    title: The geodesic equation
    body: |
      Define, at each point of the chart domain, the coefficients
      $$\Gamma^k_{ij} := (g^{-1})^{km}\,\Gamma_{mij},$$
      that is,
      $$\begin{aligned}\Gamma^k_{ij} = \tfrac12(g^{-1})^{km}\big(&\partial_i g_{mj} + \partial_j g_{mi}\\ &- \partial_m g_{ij}\big).\end{aligned}$$
      A curve with constant speed and nonzero sign is a geodesic if and only if, on $[a,b]$,
      $$\ddot\gamma^k + \Gamma^k_{ij}\,\dot\gamma^i\dot\gamma^j = 0.\tag{G}$$
      This is the **geodesic equation** in the chart $(\mathcal{U},\mathscr{X})$, with $\Gamma^k_{ij}$ evaluated at $\gamma(\lambda)$: $d$ second-order equations for $d$ unknown functions.

      Compare the autoparallel equation of a connection (Level 6), $\ddot\gamma^k + \Gamma^k_{ji}\,\dot\gamma^i\dot\gamma^j = 0$ (last lower index = direction). Same shape. Here the order of the lower indices does not matter, since $\Gamma^k_{ij} = \Gamma^k_{ji}$. The next lesson names these the **Christoffel symbols** of $g$.

  - type: mcq
    id: gamma-props
    title: What are these coefficients?
    prompt: |
      On a manifold with metric $g$, in a chart, define
      $$\begin{aligned}\Gamma^k_{ij} := \tfrac12(g^{-1})^{km}\big(&\partial_i g_{mj} + \partial_j g_{mi}\\ &- \partial_m g_{ij}\big).\end{aligned}$$
      Which statement is true?
    options:
      - text: '$\Gamma^k_{ij} = \Gamma^k_{ji}$ at every point'
        correct: true
      - text: 'They are the components of a $(1,2)$-tensor field'
        feedback: |
          In the cartesian chart of the Euclidean plane all $\partial_m g_{ij} = 0$, so every $\Gamma^k_{ij} = 0$; in the polar chart $\Gamma^1_{22} = -r\neq0$. A tensor with all components $0$ in one chart is $0$ in every chart, so these are not tensor components (like connection coefficients, they pick up a second-derivative term).
      - text: 'They depend on the curve $\gamma$'
        feedback: |
          The definition uses only $g$ and the chart: they are functions on the chart domain. The curve enters the geodesic equation only through where they are evaluated, $\gamma(\lambda)$, and through the factors $\dot\gamma^i\dot\gamma^j$.
      - text: 'They are only defined for constant-speed curves'
        feedback: |
          They are defined from the metric alone, with no curve at all. Constant speed was needed to bring the Euler-Lagrange equations into the form $\ddot\gamma^k + \Gamma^k_{ij}\dot\gamma^i\dot\gamma^j = 0$, not to define the coefficients.
    explanation: |
      Swapping $i\leftrightarrow j$ exchanges $\partial_i g_{mj}$ and $\partial_j g_{mi}$ and leaves $\partial_m g_{ij} = \partial_m g_{ji}$ unchanged, since $g_{ij} = g_{ji}$. So $\Gamma^k_{ij}$ is symmetric in its lower indices.

  - type: numeric
    id: polar-122
    tag: Polar check
    title: The first polar coefficient
    prompt: |
      Euclidean plane, polar chart $(r,\theta)$, metric components $g_{11} = 1$, $g_{22} = r^2$, $g_{12} = g_{21} = 0$; slot 1 is $r$, slot 2 is $\theta$. With
      $$\begin{aligned}\Gamma^k_{ij} = \tfrac12(g^{-1})^{km}\big(&\partial_i g_{mj} + \partial_j g_{mi}\\ &- \partial_m g_{ij}\big),\end{aligned}$$
      compute $\Gamma^1_{22}$ at a point with $r = 5$.
    answer: -5
    answerText: '-5'
    wrong:
      - { value: 5, feedback: 'The sign: for $k = 1$ only $m = 1$ contributes, and $\partial_2g_{12} = 0$ twice, so what remains is $-\partial_1g_{22} = -2r$, with a minus sign.' }
      - { value: -10, feedback: 'That is $-\partial_1g_{22} = -2r$ without the factor $\tfrac12$ in front.' }
      - { value: -0.2, feedback: 'That used $(g^{-1})^{22} = 1/r^2$, but $k = 1$ needs $(g^{-1})^{11} = 1$: the inverse metric of $\mathrm{diag}(1,r^2)$ is $\mathrm{diag}(1,1/r^2)$.' }
    hint: The inverse metric is $\mathrm{diag}(1,1/r^2)$, so for $k = 1$ only $m = 1$ survives; the only nonzero derivative of the metric is $\partial_1g_{22} = 2r$.
    explanation: |
      $$\begin{aligned}\Gamma^1_{22} &= \tfrac12\cdot1\cdot\big(0 + 0 - \partial_1g_{22}\big)\\ &= \tfrac12(-2r) = -r,\end{aligned}$$
      which is $-5$ at $r = 5$.

  - type: numeric
    id: polar-212
    tag: Polar check
    title: The mixed polar coefficient
    prompt: |
      Euclidean plane, polar chart $(r,\theta)$, metric $\mathrm{diag}(1,r^2)$, inverse $\mathrm{diag}(1,1/r^2)$; slot 1 is $r$, slot 2 is $\theta$. With
      $$\begin{aligned}\Gamma^k_{ij} = \tfrac12(g^{-1})^{km}\big(&\partial_i g_{mj} + \partial_j g_{mi}\\ &- \partial_m g_{ij}\big),\end{aligned}$$
      compute $\Gamma^2_{12}$ at a point with $r = 5$.
    answer: 0.2
    answerText: '1/r = 0.2'
    wrong:
      - { value: 0.4, feedback: 'That is $2/r$: the factor $\tfrac12$ is missing. Only $\partial_1g_{22} = 2r$ contributes (the terms $\partial_2g_{21}$ and $\partial_2g_{12}$ vanish), so $\tfrac12\cdot\tfrac{1}{r^2}\cdot2r = \tfrac1r$.' }
      - { value: 5, feedback: 'That forgets the inverse metric: for $k = 2$ the factor is $(g^{-1})^{22} = 1/r^2$, not $1$. $\tfrac12\cdot2r = r$ must still be divided by $r^2$.' }
      - { value: 0, feedback: 'For $k = 2$, $m = 2$, $i = 1$, $j = 2$, the first term is $\partial_1g_{22} = 2r\neq0$. Only the other two terms, $\partial_2g_{21}$ and $\partial_2g_{12}$, vanish.' }
    hint: For $k = 2$ only $m = 2$ survives, with $(g^{-1})^{22} = 1/r^2$. Which of $\partial_1g_{22}$, $\partial_2g_{21}$, $\partial_2g_{12}$ is nonzero?
    explanation: |
      $$\begin{aligned}\Gamma^2_{12} &= \tfrac12\cdot\tfrac1{r^2}\big(\partial_1g_{22} + \partial_2g_{21} - \partial_2g_{12}\big)\\ &= \tfrac12\cdot\tfrac1{r^2}\cdot2r = \tfrac1r,\end{aligned}$$
      which is $0.2$ at $r = 5$. By symmetry $\Gamma^2_{21} = 1/r$ too.

  - type: text
    id: polar-all
    tag: Polar check
    title: All six coefficients
    body: |
      In the polar chart $\mathscr{Y}$ the only nonzero coefficients are
      $$(\Gamma_\mathscr{Y})^1_{22} = -r$$
      $$(\Gamma_\mathscr{Y})^2_{12} = (\Gamma_\mathscr{Y})^2_{21} = \tfrac1r$$
      (the others, $\Gamma^1_{11},\Gamma^1_{12},\Gamma^2_{11},\Gamma^2_{22}$, contain only derivatives of constants or $\partial_2g_{22} = 0$). These are **exactly** the polar coefficients of the Euclidean connection $\nabla^{\mathrm{E}}$ from Level 6, computed there from "cartesian components constant" by the transformation law: $-r$ and $1/r$. The metric alone, through the length, has rebuilt the flat connection. In the cartesian chart all $\partial_m g_{ij} = 0$, so all $\Gamma^k_{ij} = 0$ and (G) reads $\ddot\gamma^k = 0$: straight lines at constant speed, as for $\nabla^{\mathrm{E}}$ too.

  - type: mcq
    id: factor-two
    tag: Polar check
    title: Where does the 2 come from?
    prompt: |
      In the polar chart of the Euclidean plane the nonzero coefficients are $\Gamma^1_{22} = -r$ and $\Gamma^2_{12} = \Gamma^2_{21} = 1/r$. Writing out the $k = 2$ component of $\ddot\gamma^k + \Gamma^k_{ij}\dot\gamma^i\dot\gamma^j = 0$ (with $\dot\gamma^1 = \dot r$, $\dot\gamma^2 = \dot\theta$), what multiplies $\dot r\,\dot\theta$?
    options:
      - text: '$\tfrac2r$'
        correct: true
      - text: '$\tfrac1r$'
        feedback: |
          The double sum over $i,j$ contains **two** terms with one $\dot r$ and one $\dot\theta$: $(i,j) = (1,2)$ and $(i,j) = (2,1)$. Each brings $\tfrac1r$, so together $\tfrac2r$.
      - text: '$-r$'
        feedback: |
          $-r$ is $\Gamma^1_{22}$, which belongs to the $k = 1$ equation and multiplies $\dot\theta^2$: $\ddot r - r\dot\theta^2 = 0$.
      - text: '$\tfrac{1}{r^2}$'
        feedback: |
          $\tfrac1{r^2}$ is the inverse-metric component $(g^{-1})^{22}$, already absorbed into $\Gamma^2_{12} = \tfrac12\cdot\tfrac1{r^2}\cdot2r = \tfrac1r$.
    explanation: |
      $\Gamma^2_{12}\dot r\dot\theta + \Gamma^2_{21}\dot\theta\dot r = \tfrac2r\dot r\dot\theta$, so (G) in polar components is
      $$\ddot r - r\,\dot\theta^2 = 0$$
      $$\ddot\theta + \tfrac2r\,\dot r\,\dot\theta = 0$$
      the two equations of the opening puzzle.

  - type: numeric
    id: horizontal-line
    tag: Polar check
    title: A straight line that is not radial
    prompt: |
      Euclidean plane. The horizontal line with cartesian components $(\lambda, 1)$ runs at speed $1$. In the polar chart it has
      $$r(\lambda) = \sqrt{1+\lambda^2}$$
      and $\theta(\lambda) = \operatorname{atan2}(1,\lambda)$, with $\dot\theta = -1/(1+\lambda^2)$. Compute $\ddot r$ at $\lambda = 0$.
    answer: 1
    answerText: '1'
    wrong:
      - { value: 0, feedback: 'A straight line need not have $\ddot r = 0$ in polar components. $\dot r = \lambda(1+\lambda^2)^{-1/2}$, and its derivative at $\lambda = 0$ is $(1+0)^{-1/2} - 0 = 1$.' }
    hint: $\dot r = \lambda\,(1+\lambda^2)^{-1/2}$; differentiate once more with the product rule and set $\lambda = 0$.
    explanation: |
      $\ddot r = (1+\lambda^2)^{-3/2}$, which is $1$ at $\lambda = 0$. The acceleration $\ddot r$ is not zero, but neither is $r\dot\theta^2 = 1\cdot(-1)^2 = 1$: they balance, $\ddot r - r\dot\theta^2 = 0$. In general $\ddot r = r\dot\theta^2 = (1+\lambda^2)^{-3/2}$, and the second equation holds too. The term $-r\dot\theta^2$ is the price of curved coordinate lines: a straight line seen in polar components "accelerates outwards".

  - type: text
    id: hook-resolve
    title: The puzzle, half resolved
    body: |
      The two equations of the opening puzzle are the geodesic equation (G) in polar components. So:
      - the radial line $r = \lambda$, $\theta = 0$ passes: straight, speed $1$;
      - the horizontal line $(\lambda,1)$ passes, though $\ddot r\neq0$: the $\Gamma$ terms balance it;
      - the circle $r = 1$, $\theta = \lambda$ fails: $\ddot r - r\dot\theta^2 = -1$, it bends.

      But the third curve, $r = \lambda^2$, $\theta = 0$ on $[1,2]$, runs along a straight segment, and its length does not care how fast it is run. Why does it fail?

  - type: mcq
    id: trap-speed
    tag: Trap
    title: A straight path rejected
    prompt: |
      Euclidean plane, polar chart. The curve $r = \lambda^2$, $\theta = 0$, $\lambda\in[1,2]$, traces the straight segment from $(1,0)$ to $(4,0)$, yet $\ddot r - r\dot\theta^2 = 2\neq0$, so it fails $\ddot\gamma^k + \Gamma^k_{ij}\dot\gamma^i\dot\gamma^j = 0$. Why?
    options:
      - text: 'That equation was derived for constant speed, and this curve has speed $2\lambda$'
        correct: true
      - text: 'It is not a geodesic: only the constant-speed run of a segment has stationary length'
        feedback: |
          Being a geodesic does not depend on the parametrization: a reparametrization maps variations to variations and keeps every length, so the derivative in $\text{ᛊ}$ is the same. This curve **is** a geodesic; the equation simply does not apply to it.
      - text: 'The polar chart fails at the origin'
        feedback: |
          The curve stays at $r\in[1,4]$, $\theta = 0$, well inside the polar chart domain. The trouble is in the derivation: one step pulled $1/s_\gamma$ out of a $\lambda$-derivative.
      - text: 'The coefficients $\Gamma^k_{ij}$ are computed wrongly'
        feedback: |
          They are right, and here they do not even matter: $\dot\theta = 0$ kills every $\Gamma$ term. The left side is $\ddot r = 2$, nonzero because the speed $2\lambda$ changes.
    explanation: |
      The step $s_\gamma\frac{d}{d\lambda}(X/s_\gamma) = \dot X$ used $\dot s_\gamma = 0$. A geodesic run at varying speed solves a different equation, built next.

  - type: text
    id: general-equation
    title: Any speed
    body: |
      Without constant speed, the quotient rule gives
      $$s_\gamma\,\frac{d}{d\lambda}\Big(\frac{X}{s_\gamma}\Big) = \dot X - \frac{\dot s_\gamma}{s_\gamma}\,X,$$
      with $X = g_{mj}\dot\gamma^j$. The extra term rides along through the symmetrization and the multiplication by $(g^{-1})^{km}$, which turns $g_{mj}\dot\gamma^j$ into $\dot\gamma^k$. Result: a curve with nonzero sign is a geodesic if and only if
      $$\ddot\gamma^k + \Gamma^k_{ij}\,\dot\gamma^i\dot\gamma^j = \frac{\dot s_\gamma}{s_\gamma}\,\dot\gamma^k.\tag{S}$$
      The right side is a multiple of the velocity: the curve may speed up or slow down along its own direction, never turn. For $\dot s_\gamma = 0$, (S) is (G).

  - type: numeric
    id: rhs-check
    tag: Trap
    title: The speed term pays the bill
    prompt: |
      Euclidean plane, polar chart. The curve $r = \lambda^2$, $\theta = 0$ on $[1,2]$ has speed $s_\gamma = 2\lambda$. For a geodesic at any speed,
      $$\ddot\gamma^k + \Gamma^k_{ij}\,\dot\gamma^i\dot\gamma^j = \frac{\dot s_\gamma}{s_\gamma}\,\dot\gamma^k.$$
      Compute the right side for $k = 1$ (where $\dot\gamma^1 = \dot r$) at $\lambda = 1.5$.
    answer: 2
    answerText: '2'
    wrong:
      - { value: 0, feedback: 'The speed $s_\gamma = 2\lambda$ is not constant: $\dot s_\gamma/s_\gamma = 2/(2\lambda) = 1/\lambda$, and $\dot r = 2\lambda$, so the product is $2$.' }
      - { value: 3, feedback: 'That is $\dot r = 2\lambda$ alone; it still has to be multiplied by $\dot s_\gamma/s_\gamma = 1/\lambda$.' }
    hint: $\dot s_\gamma/s_\gamma = 2/(2\lambda)$ and $\dot r = 2\lambda$.
    explanation: |
      $\frac{\dot s_\gamma}{s_\gamma}\dot r = \frac1\lambda\cdot2\lambda = 2$ for every $\lambda$, matching the left side $\ddot r - r\dot\theta^2 = 2$. The $k = 2$ component is $0 = 0$. So the curve satisfies (S): it is a geodesic, run at the wrong speed for (G).

  - type: mcq
    id: arc-length
    tag: Trap
    title: Repair the speed
    prompt: |
      Every geodesic with nonzero sign can be reparametrized to unit speed: with a reparametrization $\text{ᚱ}$ and new parameter $\mu$, choose $\mu = \text{ᚱ}^{-1}(\lambda) := L_{[a,\lambda]}[\gamma]$, the length run so far. For the Euclidean curve with cartesian components $(\lambda^2, 0)$, $\lambda\in[1,2]$ (speed $2\lambda$), what is $\mu$ as a function of $\lambda$?
    options:
      - text: '$\mu = \lambda^2 - 1$'
        correct: true
      - text: '$\mu = \lambda^2$'
        feedback: |
          $\mu$ must be the length run **so far**, so $\mu = 0$ at the start $\lambda = 1$: $\int_1^\lambda2t\,dt = \lambda^2 - 1$. $\lambda^2$ is the length from $\lambda = 0$, outside the interval.
      - text: '$\mu = 2\lambda$'
        feedback: |
          $2\lambda$ is the speed, the integrand, not the length. The length run so far is $\int_1^\lambda2t\,dt = \lambda^2 - 1$.
      - text: '$\mu = \lambda$'
        feedback: |
          Keeping $\lambda$ keeps speed $2\lambda$. The new parameter must grow at the rate the length grows: $d\mu/d\lambda = s_\gamma = 2\lambda$.
    explanation: |
      $\mu = \lambda^2 - 1$ runs over $[0,3]$, and $\delta := \gamma\circ\text{ᚱ}$ has cartesian components $(1+\mu, 0)$: speed $1$, polar $r = 1+\mu$, $\ddot r = 0$. Now (G) holds. In general $\text{ᚱ}' = 1/(s_\gamma\circ\text{ᚱ})$, so $s_\delta = |\text{ᚱ}'|\,s_\gamma\circ\text{ᚱ} = 1$. So "constant speed" costs nothing: every geodesic has a parametrization obeying (G).

  - type: mcq
    id: energy
    title: The energy shortcut
    prompt: |
      In a chart, replace the length Lagrangian by the **energy** Lagrangian
      $$\mathcal{E}_\mathscr{X}(\alpha;\beta) := \tfrac12\,g_{ij}\,\beta^i\beta^j$$
      ($g_{ij}$ at $\mathscr{X}^{-1}(\alpha)$, no square root). Its slot derivatives are $\partial_{d+m}\mathcal{E}_\mathscr{X} = g_{mj}\beta^j$ and $\partial_m\mathcal{E}_\mathscr{X} = \tfrac12(\partial_mg_{ij})\beta^i\beta^j$. What do its Euler-Lagrange equations become, with **no** assumption on the speed?
    options:
      - text: '$\ddot\gamma^k + \Gamma^k_{ij}\,\dot\gamma^i\dot\gamma^j = 0$, the constant-speed geodesic equation'
        correct: true
      - text: '$\ddot\gamma^k + \Gamma^k_{ij}\,\dot\gamma^i\dot\gamma^j = \frac{\dot s_\gamma}{s_\gamma}\dot\gamma^k$'
        feedback: |
          The speed term came from the $1/s_\gamma$ produced by the square root. Without the root, $\partial_{d+m}\mathcal{E}_\mathscr{X} = g_{mj}\beta^j$ has no $s_\gamma$, and the computation is the constant-speed one verbatim.
      - text: '$\ddot\gamma^k = 0$ in every chart'
        feedback: |
          That is the cartesian Euclidean case, where all $\partial_mg_{ij} = 0$. In the polar chart the energy gives $\ddot r - r\dot\theta^2 = 0$, with the $\Gamma$ term.
      - text: 'Nothing useful: the energy is not a length'
        feedback: |
          True, it is not a length, but its Euler-Lagrange equations are $\frac{d}{d\lambda}(g_{mj}\dot\gamma^j) - \tfrac12(\partial_mg_{ij})\dot\gamma^i\dot\gamma^j = 0$, the same as the constant-speed equation of this lesson.
    explanation: |
      $\frac{d}{d\lambda}(g_{mj}\dot\gamma^j) - \tfrac12(\partial_mg_{ij})\dot\gamma^i\dot\gamma^j = 0$ is exactly the equation reached after the constant-speed step. So the energy picks out geodesics **already** at constant speed, which is why physicists often start from it. The straight segment $(\lambda^2,0)$ fails it, as the previous lesson found ($\ddot\gamma^1 = 2$).

  - type: text
    id: summary
    title: What you now own
    body: |
      **The puzzle, resolved.** The polar equations of the Euclidean plane in the chart $(r,\theta)$, $\ddot r - r\dot\theta^2 = 0$, $\ddot\theta + \tfrac2r\dot r\dot\theta = 0$ are the geodesic equation of the Euclidean plane. The circle fails because it bends; $r = \lambda^2$ fails only because its speed changes.

      - **Setting**: $(\mathcal{M},g)$ a metric manifold of dimension $d$ with a chart, $g_{ij}$ the components of $g$, $(g^{-1})^{km}$ the inverse matrix, $\partial_m$ the derivative with respect to the $m$-th slot of $\mathcal{L}_\mathscr{X}(\alpha;\beta)$ (position slots $\alpha$, velocity slots $\beta$, $\partial_{d+m}$ for the velocity ones), $\gamma$ a curve with components $\dot\gamma^i$ of its velocity, sign $\text{ᛇ}_\gamma := \mathrm{sgn}\,g(v_\gamma,v_\gamma)$, speed $s_\gamma := \sqrt{\text{ᛇ}_\gamma\,g(v_\gamma,v_\gamma)}$.
      - **Slot derivatives** of $\mathcal{L}_\mathscr{X} = \sqrt{\text{ᛇ}_\gamma\,g_{ij}\beta^i\beta^j}$:
      $$\partial_{d+m}\mathcal{L}_\mathscr{X} = \frac{\text{ᛇ}_\gamma\,g_{mj}\,\beta^j}{\mathcal{L}_\mathscr{X}}$$
      $$\partial_m\mathcal{L}_\mathscr{X} = \frac{\text{ᛇ}_\gamma\,(\partial_mg_{ij})\,\beta^i\beta^j}{2\mathcal{L}_\mathscr{X}}$$
      - **Four moves**: insert the curve ($\mathcal{L}_\mathscr{X} = s_\gamma$), differentiate with the chain rule $\frac{d}{d\lambda}g_{mj} = (\partial_ig_{mj})\dot\gamma^i$, symmetrize by renaming summed indices, multiply by $(g^{-1})^{km}$.
      - **Coefficients** (symmetric in $i,j$, not a tensor):
      $$\begin{aligned}\Gamma^k_{ij} = \tfrac12(g^{-1})^{km}\big(&\partial_i g_{mj} + \partial_j g_{mi}\\ &- \partial_m g_{ij}\big)\end{aligned}$$
      - **Geodesic equation**, constant speed, nonzero sign:
      $$\ddot\gamma^k + \Gamma^k_{ij}\,\dot\gamma^i\dot\gamma^j = 0\tag{G}$$
      - **Any speed**:
      $$\ddot\gamma^k + \Gamma^k_{ij}\,\dot\gamma^i\dot\gamma^j = \frac{\dot s_\gamma}{s_\gamma}\,\dot\gamma^k\tag{S}$$
      and the arc length $\mu := \int_a^\lambda s_\gamma\,d\lambda'$ as parameter always gives speed $1$.
      - **Polar check**: $\Gamma^1_{22} = -r$, $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$, exactly the coefficients of the Euclidean connection $\nabla^{\mathrm{E}}$ (cartesian components constant) written in polar components, for the metric $g_{ij} = \mathrm{diag}(1,r^2)$.

      **Next: "The Levi-Civita Connection".** (G) has the shape of the autoparallel equation of a connection. Is there a connection whose coefficients are exactly these $\Gamma^k_{ij}$, so that geodesics (stationary length) and autoparallels (straightest curves) coincide? Yes, exactly one that is torsion free and respects the metric: the Levi-Civita connection.
