id: ch02-J-invertible
title: "Guided Problem: Why the Change of Basis Is Invertible"
kind: guided

cards:
  - type: text
    id: problem
    title: The problem
    body: |
      Let $\{\hat{x}_1,\dots,\hat{x}_d\}$ ("old") and $\{\hat{y}_1,\dots,\hat{y}_d\}$ ("new") be two bases of the same vector space $V$. The change-of-basis matrix $J$ writes old in terms of new:
      $$\hat{x}_i = \sum_{j=1}^d J_i^j\,\hat{y}_j .$$
      Everything about transformation laws used the inverse matrix $J^{-1}$. $J$ should be invertible "as a direct consequence of both sets being bases". Here you prove it.

      > **Show** that there is a matrix $K$ with
      > $$\sum_{j=1}^d J_i^j\,K_j^k = \delta_i^k$$
      > and
      > $$\sum_{j=1}^d K_i^j\,J_j^k = \delta_i^k$$
      > for all $i, k$,
      > that is, $JK = \mathbb{1}$ and $KJ = \mathbb{1}$, where $\mathbb{1}$ is the identity matrix.

      Recall: $\delta_i^k$ (Kronecker delta) is $1$ if $i = k$ and $0$ otherwise. A matrix with such a two-sided inverse $K$ is **invertible**, and $K$ is written $J^{-1}$.

  - type: mcq
    id: J-exists
    prompt: |
      Let $\{\hat{x}_i\}$ and $\{\hat{y}_j\}$ be two bases of $V$. Why do numbers $J_i^j$ with $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$ exist at all, and why are they unique?
    options:
      - text: 'Each $\hat{x}_i$ is a vector, and $\{\hat{y}_j\}$ is a basis, so $\hat{x}_i$ has unique components in it'
        correct: true
      - text: Because the two bases are related by a rotation
        feedback: |
          Nothing says the bases are related by a rotation; "rotation" even needs angles, which a vector space lacks. Any two bases work, shears included.
      - text: 'Because $J$ is invertible'
        feedback: |
          That is what we want to **prove**, so it cannot be used here. The existence of $J$ needs much less: just that $\{\hat{y}_j\}$ is a basis.
    explanation: |
      $J_i^j$ is simply **the $j$-th component of the old basis vector $\hat{x}_i$ in the new basis**. Existence uses that $\{\hat{y}_j\}$ spans $V$; uniqueness uses that it is linearly independent.

  - type: mcq
    id: K-exists
    prompt: |
      Let $\{\hat{x}_i\}$ and $\{\hat{y}_j\}$ be two bases of $V$, with $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$. To build a candidate inverse, we write each **new** vector in the old basis:
      $$\hat{y}_j = \sum_{k=1}^d K_j^k\,\hat{x}_k .$$
      Which fact guarantees that such numbers $K_j^k$ exist?
    options:
      - text: '$\{\hat{x}_k\}$ spans $V$'
        correct: true
      - text: '$\{\hat{y}_j\}$ is linearly independent'
        feedback: |
          Independence of the $\hat{y}_j$ is about writing things **in** the new basis. Here we write the $\hat{y}_j$ in the **old** basis, which needs the old basis to reach every vector.
      - text: '$J$ is invertible, so $K = J^{-1}$'
        feedback: |
          Circular: invertibility of $J$ is the claim. We build $K$ first, from the bases alone, and only then show that it inverts $J$.
    explanation: |
      This is the same reason $J$ exists, with the roles of the bases swapped. So far we have two matrices, $J$ (old in new) and $K$ (new in old). Nothing yet says they are related.

  - type: build
    id: build-JK
    prompt: |
      Two bases of $V$ are related by $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$ and $\hat{y}_j = \sum_k K_j^k\,\hat{x}_k$. Substitute the second relation into the first and swap the finite sums. Build the coefficient of $\hat{x}_k$:
    prefix: '\hat{x}_i = \sum_{k=1}^d \Big('
    suffix: '\Big)\,\hat{x}_k'
    tiles: ['\sum_{j=1}^d', '\sum_{k=1}^d', 'J_i^j', 'J_j^i', 'K_j^k', 'K_k^j']
    answers:
      - ['\sum_{j=1}^d', 'J_i^j', 'K_j^k']
      - ['\sum_{j=1}^d', 'K_j^k', 'J_i^j']
    wrong:
      - answer: ['\sum_{k=1}^d', 'J_i^j', 'K_j^k']
        feedback: |
          $k$ is already summed outside the bracket, and it labels which $\hat{x}_k$ we are looking at. Inside, the index that disappears is $j$, the label of the new basis vectors we substituted away.
      - answer: ['\sum_{j=1}^d', 'J_j^i', 'K_j^k']
        feedback: |
          The substituted relation is $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$: lower $i$ (which old vector), upper $j$ (which new one). Keep the index positions from the definition.
      - answer: ['\sum_{j=1}^d', 'J_i^j', 'K_k^j']
        feedback: |
          From $\hat{y}_j = \sum_k K_j^k\,\hat{x}_k$, the coefficient of $\hat{x}_k$ in $\hat{y}_j$ is $K_j^k$: lower $j$, upper $k$.
    hint: 'First write $\hat{x}_i = \sum_j J_i^j\,\big(\sum_k K_j^k\,\hat{x}_k\big)$, then collect what multiplies each $\hat{x}_k$.'
    explanation: |
      $$\begin{aligned}\hat{x}_i &= \sum_{j} J_i^j\,\Big(\sum_{k} K_j^k\,\hat{x}_k\Big)\\ &= \sum_{k}\Big(\sum_{j} J_i^j\,K_j^k\Big)\,\hat{x}_k .\end{aligned}$$
      Writing old in new and then new in old must bring us back to $\hat{x}_i$. The next step turns that into an equation for the numbers.

  - type: mcq
    id: compare
    prompt: |
      We have two expansions of the same basis vector $\hat{x}_i$ in the basis $\{\hat{x}_k\}$:
      $$\hat{x}_i = \sum_{k}\Big(\sum_{j} J_i^j\,K_j^k\Big)\,\hat{x}_k$$
      and
      $$\hat{x}_i = \sum_k \delta_i^k\,\hat{x}_k .$$
      Why may we conclude that $\sum_j J_i^j\,K_j^k = \delta_i^k$ for every $k$?
    options:
      - text: 'Components in the basis $\{\hat{x}_k\}$ are unique, because it is linearly independent'
        correct: true
      - text: Both sides equal $\hat{x}_i$, so they agree term by term
        feedback: |
          Equal sums need not agree term by term: $1 + 3 = 2 + 2$. Term-by-term agreement is exactly what linear independence provides.
      - text: 'Because $J$ is invertible'
        feedback: |
          That is the claim being proved. The comparison only needs uniqueness of components in $\{\hat{x}_k\}$.
    explanation: |
      Uniqueness of components gives, for all $i$ and $k$,
      $$\sum_{j=1}^d J_i^j\,K_j^k = \delta_i^k ,$$
      which in matrix language is $JK = \mathbb{1}$. Half of the claim is proved.

  - type: order
    id: KJ-proof
    prompt: |
      Two bases of $V$ are related by $\hat{x}_i = \sum_l J_i^l\,\hat{y}_l$ and $\hat{y}_j = \sum_i K_j^i\,\hat{x}_i$. Put in order the proof of the other half, $\sum_i K_j^i\,J_i^l = \delta_j^l$.
    steps:
      - '$\displaystyle \hat{y}_j = \sum_i K_j^i\,\hat{x}_i$'
      - '$\displaystyle = \sum_i K_j^i\,\Big(\sum_l J_i^l\,\hat{y}_l\Big)$'
      - '$\displaystyle = \sum_l\Big(\sum_i K_j^i\,J_i^l\Big)\,\hat{y}_l$'
      - 'Compare with $\hat{y}_j = \sum_l \delta_j^l\,\hat{y}_l$; components in $\{\hat{y}_l\}$ are unique, so $\sum_i K_j^i\,J_i^l = \delta_j^l$.'
    hint: Same idea with the roles swapped. Start from the new basis vector, go to old, and come back.
    explanation: |
      This time uniqueness of components in the **new** basis $\{\hat{y}_l\}$ does the work. Together:
      $$JK = \mathbb{1}\quad\text{and}\quad KJ = \mathbb{1},$$
      so $J$ is invertible with $J^{-1} = K$. We write $(J^{-1})_j^k := K_j^k$ and
      $$\hat{y}_j = \sum_{k=1}^d (J^{-1})_j^k\,\hat{x}_k .$$

  - type: mcq
    id: what-was-used
    prompt: |
      In the proof that the change-of-basis matrix $J$ (defined by $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$) is invertible, which properties of the two bases were used?
    options:
      - text: Spanning (so $J$ and $K$ exist) and independence (so the two comparisons work), for both bases
        correct: true
      - text: Only that both bases have $d$ elements
        feedback: |
          Counting is not enough: $\{\hat{x}_1,\ 2\,\hat{x}_1\}$ has $2$ elements in the plane but is not a basis, and no invertible $J$ relates it to a basis.
      - text: That both bases are orthonormal
        feedback: |
          Orthonormal needs lengths and angles, a metric. The proof never used one; it works for shears, stretches, any bases.
    explanation: |
      Spanning of $\{\hat{y}\}$ gives $J$; spanning of $\{\hat{x}\}$ gives $K$. Independence of $\{\hat{x}\}$ gives $JK = \mathbb{1}$; independence of $\{\hat{y}\}$ gives $KJ = \mathbb{1}$. Every half of "both sets are bases" was used exactly once.

  - type: numeric
    id: example-J
    prompt: |
      In the plane, the new basis is
      $$\hat{y}_1 = \hat{x}_1 + \hat{x}_2,\qquad \hat{y}_2 = \hat{x}_1 - \hat{x}_2 .$$
      With the convention $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$ (old in terms of new), what is $J_2^2$?
    answer: -0.5
    answerText: '-1/2'
    wrong:
      - value: -1
        feedback: |
          $-1$ is the coefficient of $\hat{x}_2$ in $\hat{y}_2$: that is $K_2^2$, new in terms of old. $J$ goes the other way. Solve for $\hat{x}_2$ in terms of $\hat{y}_1, \hat{y}_2$.
      - value: 0.5
        feedback: |
          Check the sign: $\hat{y}_1 - \hat{y}_2 = 2\,\hat{x}_2$.
    hint: 'Add and subtract the two relations: $\hat{y}_1 + \hat{y}_2 = 2\,\hat{x}_1$ and $\hat{y}_1 - \hat{y}_2 = 2\,\hat{x}_2$.'
    explanation: |
      $\hat{x}_1 = \tfrac12\,\hat{y}_1 + \tfrac12\,\hat{y}_2$ and $\hat{x}_2 = \tfrac12\,\hat{y}_1 - \tfrac12\,\hat{y}_2$, so
      $$J_1^1 = \tfrac12,\quad J_1^2 = \tfrac12,\quad J_2^1 = \tfrac12,\quad J_2^2 = -\tfrac12 .$$
      The new-in-old numbers are $K_1^1 = 1$, $K_1^2 = 1$, $K_2^1 = 1$, $K_2^2 = -1$.

  - type: numeric
    id: example-delta
    prompt: |
      For the bases $\hat{y}_1 = \hat{x}_1 + \hat{x}_2$, $\hat{y}_2 = \hat{x}_1 - \hat{x}_2$, the matrices are
      $$J_1^1 = J_1^2 = J_2^1 = \tfrac12,\quad J_2^2 = -\tfrac12$$
      (from $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$) and
      $$K_1^1 = K_1^2 = K_2^1 = 1,\quad K_2^2 = -1$$
      (from $\hat{y}_j = \sum_k K_j^k\,\hat{x}_k$).
      Compute $\sum_j J_1^j\,K_j^2 = J_1^1 K_1^2 + J_1^2 K_2^2$.
    answer: 0
    wrong:
      - value: 1
        feedback: |
          $J_1^1 K_1^2 = \tfrac12\cdot 1$ and $J_1^2 K_2^2 = \tfrac12\cdot(-1)$. Add them.
    explanation: |
      $\tfrac12 - \tfrac12 = 0 = \delta_1^2$, as the theorem predicts. The diagonal works too: $\sum_j J_2^j K_j^2 = \tfrac12\cdot 1 + (-\tfrac12)(-1) = 1 = \delta_2^2$.

  - type: mcq
    id: degenerate
    prompt: |
      In the plane with basis $\{\hat{x}_1, \hat{x}_2\}$, someone proposes the "new basis"
      $$\hat{y}_1 = \hat{x}_1 + \hat{x}_2,\qquad \hat{y}_2 = 2\,\hat{x}_1 + 2\,\hat{x}_2 .$$
      Where does the invertibility proof (for $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$) break?
    options:
      - text: 'At the very start: $\hat{x}_1$ cannot be written in terms of $\hat{y}_1, \hat{y}_2$, so $J$ does not exist'
        correct: true
      - text: '$K$ does not exist'
        feedback: |
          $K$ exists: we are told $\hat{y}_1 = \hat{x}_1 + \hat{x}_2$ and $\hat{y}_2 = 2\hat{x}_1 + 2\hat{x}_2$, so $K = \begin{pmatrix}1 & 1\\ 2 & 2\end{pmatrix}$. It just has no inverse.
      - text: Nowhere; $J$ is invertible
        feedback: |
          $\hat{y}_2 = 2\,\hat{y}_1$, so the two vectors lie on one line and every combination of them does too. They are not a basis.
    explanation: |
      $\hat{y}_1$ and $\hat{y}_2$ are parallel, so they span only a line. The step "write $\hat{x}_i$ in the new basis" fails, and with it everything after. "Both sets are bases" is a real hypothesis.

  - type: mcq
    id: sizes
    prompt: |
      Could a vector space have one basis with $2$ elements and another with $3$, related by an invertible matrix $J$?
    options:
      - text: 'No: all bases of $V$ have the same number of elements, and only square matrices can be inverted on both sides'
        correct: true
      - text: 'Yes, with a $2\times 3$ matrix $J$'
        feedback: |
          A $2\times 3$ matrix cannot have a two-sided inverse: it is like a map from a 3-element set to a 2-element set, which always merges something. And in fact all bases of $V$ have the same size, $d = \dim V$.
      - text: Only if the space is infinite-dimensional
        feedback: |
          The question is about finite bases of $2$ and $3$ elements, and these can never both be bases of the same space.
    explanation: |
      The number of elements in a basis is the dimension, the same for every basis. So $J$ is always a square $d\times d$ matrix, as the bijection picture requires: a translation between two descriptions that loses nothing and misses nothing.

  - type: text
    id: wrap
    title: Problem solved
    body: |
      For any two bases of $V$, with $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$, the matrix $J$ is invertible and its inverse writes new in terms of old:
      $$\hat{y}_i = \sum_{j=1}^d (J^{-1})_i^j\,\hat{x}_j ,$$
      $$\sum_{j=1}^d J_i^j\,(J^{-1})_j^k = \delta_i^k = \sum_{j=1}^d (J^{-1})_i^j\,J_j^k .$$

      **The proof in one line:** go old $\to$ new $\to$ old and you must come back where you started; uniqueness of components turns that into $JK = \mathbb{1}$, and the round trip the other way gives $KJ = \mathbb{1}$.

      **Next:** the dual bases $\{\hat{\mathfrak{x}}^i\}$ and $\{\hat{\mathfrak{y}}^i\}$ are also related by a matrix. Is it $J$, $J^{-1}$, or something new?
