outroTitle: Chapter 3 in one picture
outro: |
  Read it top to bottom. A **topology** says which sets are open; from it come the **standard** and **inherited** topologies and **continuity**, and continuity both ways gives **homeomorphisms**. A **chart** is a homeomorphism from an open patch onto an open set of $\mathbb{R}^d$; enough charts form an **atlas**, and with **Hausdorff** and **second countable** added we have a **topological manifold**. Where charts overlap, **transition maps** take numbers to numbers; asking them to be $C^\infty$ both ways gives **compatibility**, a **smooth structure** and a **smooth manifold**. Then **smooth maps** are tested on chart representatives, and **diffeomorphisms** are the smooth version of sameness.

  **Next level:** Chapter 4 builds vectors on a manifold, where there are no arrows to draw. A tangent vector at $p$ will be the velocity of a curve, acting on smooth functions as a directional derivative, and the tangent space $T_p\mathcal{M}$ will be a $d$-dimensional vector space.
