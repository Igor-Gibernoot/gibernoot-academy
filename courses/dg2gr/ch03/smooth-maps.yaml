id: ch03-smooth-maps
title: Smooth Maps and Diffeomorphisms
kind: concept
own: |
  - The **chart representative** of a map $\phi\colon\mathcal{M}\to\mathcal{N}$:
  {{ $$\Phi = \mathscr{Y}\circ\phi\circ\mathscr{X}^{-1},$$ }}
  from $d$ coordinates to $e$ coordinates, defined on an open set because $\phi$ is continuous.
  - A **smooth map**: {{ all representatives $C^\infty$ }}. Transition maps on both sides make the verdict chart-independent. Smooth functions ($\mathcal{N} = \mathbb{R}$) and smooth curves ($\mathcal{M} = \mathbb{R}$) are special cases. The doubling map of the unit circle $S^1$, which sends the point at angle $\theta$ to the point at angle $2\theta$, is smooth, with slope $2$ in the angle chart.
  - A **diffeomorphism**: a bijection, {{ smooth with smooth inverse }}. $p\mapsto p^3$ is one from $\mathbb{R}_y$ to $\mathbb{R}_x$ (the line with the smooth structure generated by the chart $y(p) = p^3$, resp. $x(p) = p$), but not from standard $\mathbb{R}$ to itself.
  - The hierarchy: continuous maps and homeomorphisms for topology, smooth maps and diffeomorphisms for smooth manifolds. Exotic $\mathbb{R}^4$ and exotic $S^7$ (the 7-dimensional sphere) are other smooth structures, homeomorphic but not diffeomorphic to the standard ones.

cards:
  - type: text
    id: hook
    title: Two smooth lines
    body: |
      Recall the two charts on the real line $\mathbb{R}$ (standard topology, points written $p$):
      $$x(p) = p$$
      and
      $$y(p) = p^3.$$
      Each one alone is a smooth atlas, but they are **not** $C^\infty$-compatible: the transition $b = a^3$ has the inverse $a = \sqrt[3]{b}$, which is not differentiable at $0$. So they generate two different maximal atlases, two different smooth structures on the same set. Name the two smooth manifolds
      $$\mathbb{R}_x := (\mathbb{R}, \mathcal{O}_\mathbb{R}, \{x\})_1$$
      and
      $$\mathbb{R}_y := (\mathbb{R}, \mathcal{O}_\mathbb{R}, \{y\})_1.$$
      They really differ: $f(p) = p$ is smooth on $\mathbb{R}_x$ (in chart $x$ it reads $a\mapsto a$) but not on $\mathbb{R}_y$ (in chart $y$ it reads $b\mapsto\sqrt[3]{b}$).

      Yet both are "a line you can do calculus on". Are they the same smooth manifold, or genuinely two?

  - type: mcq
    id: predict-same
    prompt: |
      Before any definitions, guess. On the set $\mathbb{R}$ take the smooth structure $\mathbb{R}_x$ generated by the chart $x(p) = p$, and the structure $\mathbb{R}_y$ generated by $y(p) = p^3$. The two charts are not $C^\infty$-compatible, so these are different maximal atlases. Should $\mathbb{R}_x$ and $\mathbb{R}_y$ count as the same smooth manifold?
    options:
      - text: 'Possibly: the structures differ, but some relabelling of the points might carry one onto the other'
        correct: true
      - text: 'Yes: same points and same open sets, so nothing can tell them apart'
        feedback: |
          Topology cannot tell them apart, but calculus can: $f(p) = p$ is smooth on $\mathbb{R}_x$ and not on $\mathbb{R}_y$, because in chart $y$ it reads $\sqrt[3]{b}$. Leaving the points fixed, the two structures disagree.
      - text: 'No: their maximal atlases are different sets of charts'
        feedback: |
          That makes them different structures **on the same set**. But "the same" usually means "the same up to renaming": $\mathbb{R}^2$ and the space of polynomials $a + bt$ are different sets, yet isomorphic as vector spaces. The right question is whether some renaming of points matches the two structures.
      - text: 'No: the identity map $p\mapsto p$ fails to match them, so no map can'
        feedback: |
          The identity is only one of many bijections $\mathbb{R}\to\mathbb{R}$. Two vector spaces are isomorphic when **some** linear bijection exists, not a particular one. We should test other maps too.
    explanation: |
      To answer we need two things: when a map **between** manifolds is smooth, and what it means for two smooth manifolds to be equivalent. Both are built in this lesson, and we will find an explicit map that matches $\mathbb{R}_y$ with $\mathbb{R}_x$.

  - type: text
    id: maps-in-charts
    title: Reading a map in charts
    body: |
      A map between manifolds sends points to points. On the unit circle $S^1$, the **doubling map** $D\colon S^1\to S^1$ doubles the angle:
      $$D(\cos t, \sin t) = (\cos 2t, \sin 2t).$$
      It is well defined: replacing $t$ by $t + 2\pi$ changes $2t$ by $4\pi$, the same point. It wraps the circle twice around itself.

      Points of $S^1$ cannot be subtracted, so "the derivative of $D$" means nothing yet. As for functions, we read $D$ through a chart: the angle chart $\theta\colon\mathcal{U}\to(0, 2\pi)$, defined on $\mathcal{U} = S^1\setminus\{(1, 0)\}$. Take a coordinate $\theta$, go to its point $p = \theta^{-1}(\theta)$, apply $D$, and read the angle of $D(p)$. That turns $D$ into an ordinary function of one real number.

  - type: widget
    id: doubling-explore
    title: Double the angle
    widget: circle-charts
    config:
      angle: 60
      show: A
      snap: 15
      presets:
        - { label: p at 60°, angle: 60 }
        - { label: Its image, angle: 120 }
        - { label: p at 240°, angle: 240 }
        - { label: p at 180°, angle: 180 }
    body: |
      The ring is the angle chart $\theta\in(0, 2\pi)$; its missing point $(1, 0)$ is hollow. The doubling map $D$ sends the point at angle $t$ to the point at angle $2t$.

      1. Put $p$ at $60°$ and read $\theta(p)$. Then move to the image $D(p)$, at $120°$, and read $\theta(D(p))$.
      2. Put $p$ at $240°$. Doubling gives $480°$: which point is that, and what is its $\theta$? Is it $2\theta(p)$?
      3. Put $p$ at $180°$. Where does $D$ send it? Does that image have a $\theta$ coordinate?

  - type: numeric
    id: doubling-lower
    prompt: |
      The doubling map $D\colon S^1\to S^1$ sends the point at angle $t$ to the point at angle $2t$. Use the angle chart $\theta\in(0, 2\pi)$, defined on $S^1$ without $(1, 0)$. Take the point $p$ with $\theta(p) = \tfrac43\pi$. Then $\theta(D(p)) = c\,\pi$. Enter $c$ (a fraction is fine).
    answer: 0.6666666667
    tolerance: 0.001
    answerText: '2/3'
    wrong:
      - value: 2.6666666667
        feedback: |
          $2\cdot\tfrac43\pi = \tfrac83\pi$ is the right point, but not a valid $\theta$ value: the chart only takes values in $(0, 2\pi)$. Subtract one full turn, $2\pi$.
      - value: 1.3333333333
        feedback: |
          That is $\theta(p)$ itself. Apply $D$ first: the angle doubles, then read it back in $(0, 2\pi)$.
    hint: Double the angle, then bring the result back into the range $(0, 2\pi)$ of the chart.
    explanation: |
      $D(p)$ sits at angle $\tfrac83\pi = 2\pi + \tfrac23\pi$, the same point as angle $\tfrac23\pi$. So $\theta(D(p)) = \tfrac23\pi = 2\theta(p) - 2\pi$.

  - type: text
    id: doubling-representative
    title: The chart representative of $D$
    body: |
      Reading $D$ in the chart $\theta$ on both sides gives its **chart representative**
      $$\theta\circ D\circ\theta^{-1}.$$
      It needs $p$ in $\mathcal{U}$ (so $\theta(p)$ exists) **and** $D(p)$ in $\mathcal{U}$ (so $\theta(D(p))$ exists). The second fails at $p = (-1, 0)$, where $\theta = \pi$: doubling sends it to $(1, 0)$, the missing point. So the domain is the open set $(0, \pi)\cup(\pi, 2\pi)$, and there
      $$\theta\circ D\circ\theta^{-1}(\theta) = \begin{cases} 2\theta, & 0 < \theta < \pi \\ 2\theta - 2\pi, & \pi < \theta < 2\pi \end{cases}$$
      The jump at $\theta = \pi$ is an artifact of the chart, like the jump of the angle transition maps: that point is outside the domain. On each piece the representative is an ordinary line.

  - type: numeric
    id: doubling-slope
    prompt: |
      The doubling map $D\colon S^1\to S^1$, $D(\cos t, \sin t) = (\cos 2t, \sin 2t)$, read in the angle chart $\theta\in(0, 2\pi)$ on both sides, has the chart representative $2\theta$ on $(0, \pi)$ and $2\theta - 2\pi$ on $(\pi, 2\pi)$. What is the derivative of this representative at $\theta = \tfrac43\pi$?
    answer: 2
    wrong:
      - value: 0
        feedback: |
          The constant $-2\pi$ has derivative $0$, but the term $2\theta$ still contributes. Differentiate $2\theta - 2\pi$ as a whole.
      - value: 1
        feedback: |
          Slope $1$ belongs to the transition maps $\theta\mapsto\theta + c$ between two angle charts. $D$ doubles the angle, so the slope doubles.
    hint: Near $\theta = \tfrac43\pi$ the representative is $2\theta - 2\pi$.
    explanation: |
      $\frac{d}{d\theta}(2\theta - 2\pi) = 2$, and all higher derivatives vanish; the same holds on $(0, \pi)$. So the representative is $C^\infty$ on its domain: $D$ stretches every small arc by the factor $2$, as the picture of "wrapping twice" suggests.

  - type: text
    id: def-smooth-map
    title: Smooth maps
    body: |
      Now in general. Let $\mathcal{M}$ be a smooth manifold of dimension $d$ with smooth atlas $\mathcal{A}_\mathcal{M}$, and $\mathcal{N}$ one of dimension $e$ with $\mathcal{A}_\mathcal{N}$. For a continuous map $\phi\colon\mathcal{M}\to\mathcal{N}$, a chart $(\mathcal{U}, \mathscr{X})$ of $\mathcal{M}$ and a chart $(\mathcal{V}, \mathscr{Y})$ of $\mathcal{N}$, the **chart representative** is
      $$\Phi := \mathscr{Y}\circ\phi\circ\mathscr{X}^{-1}.$$
      It eats $d$ coordinates and returns $e$ coordinates. Its domain is the set of coordinates of points $p$ with $p\in\mathcal{U}$ and $\phi(p)\in\mathcal{V}$:
      $$\mathscr{X}(\mathcal{U}\cap\text{preim}_\phi(\mathcal{V}))\subseteq\mathbb{R}^d.$$
      Recall: $\text{preim}_\phi(\mathcal{V})$ is the set of points that $\phi$ sends into $\mathcal{V}$.

      $\phi$ is **smooth** if every such representative is $C^\infty$ in the ordinary multivariable sense. For $D$ on the circle: $\Phi = \theta\circ D\circ\theta^{-1}$, and $\theta = \pi$ dropped out of the domain because $D$ sends that point outside $\mathcal{V} = \mathcal{U}$.

  - type: mcq
    id: why-continuous
    prompt: |
      A map $\phi\colon\mathcal{M}\to\mathcal{N}$ between smooth manifolds is called smooth when, for all charts $(\mathcal{U}, \mathscr{X})$ of $\mathcal{M}$ and $(\mathcal{V}, \mathscr{Y})$ of $\mathcal{N}$, the representative $\mathscr{Y}\circ\phi\circ\mathscr{X}^{-1}$ is $C^\infty$ on $\mathscr{X}(\mathcal{U}\cap\text{preim}_\phi(\mathcal{V}))$. The definition first asks $\phi$ to be **continuous**. Why?
    options:
      - text: 'So that $\mathcal{U}\cap\text{preim}_\phi(\mathcal{V})$ is open, and the representative is defined on an open set of $\mathbb{R}^d$, where derivatives make sense'
        correct: true
      - text: 'Because a smooth map must be a homeomorphism'
        feedback: |
          A constant map $\phi(p) = q_0$ is smooth (every representative is constant) and is far from a bijection. Continuity is asked of $\phi$, not invertibility.
      - text: 'Because charts are only homeomorphisms, so only continuity can be checked through them'
        feedback: |
          In a **smooth** atlas the transition maps are $C^\infty$, and that is exactly what lets derivatives be checked through charts. Continuity is required for a different reason: the shape of the representative's domain.
      - text: 'Because every continuous map is automatically smooth'
        feedback: |
          $p\mapsto|p|$ on $\mathbb{R}$ with chart $x(p) = p$ is continuous, but its representative $a\mapsto|a|$ has no derivative at $0$.
    explanation: |
      A derivative at a point needs room around it: an open neighbourhood inside the domain. Continuity makes $\text{preim}_\phi(\mathcal{V})$ open, the chart domain $\mathcal{U}$ is open, so their intersection is open, and the homeomorphism $\mathscr{X}$ carries it to an open set of $\mathbb{R}^d$.

  - type: text
    id: chart-independence
    title: Does the verdict depend on the charts?
    body: |
      $\mathcal{M}$ and $\mathcal{N}$ have many charts each. Suppose the representative $\Phi = \mathscr{Y}\circ\phi\circ\mathscr{X}^{-1}$ is smooth, and take other charts $(\tilde{\mathcal{U}}, \tilde{\mathscr{X}})$ of $\mathcal{M}$ and $(\tilde{\mathcal{V}}, \tilde{\mathscr{Y}})$ of $\mathcal{N}$, with representative
      $$\tilde\Phi := \tilde{\mathscr{Y}}\circ\phi\circ\tilde{\mathscr{X}}^{-1}.$$
      Is $\tilde\Phi$ smooth too? The trick: insert $\mathscr{Y}^{-1}\circ\mathscr{Y}$ and $\mathscr{X}^{-1}\circ\mathscr{X}$, which do nothing, wherever both charts are defined.

  - type: build
    id: build-independence
    prompt: |
      Let $\phi\colon\mathcal{M}\to\mathcal{N}$ be a map between smooth manifolds. Charts $(\mathcal{U}, \mathscr{X})$, $(\tilde{\mathcal{U}}, \tilde{\mathscr{X}})$ of $\mathcal{M}$ and $(\mathcal{V}, \mathscr{Y})$, $(\tilde{\mathcal{V}}, \tilde{\mathscr{Y}})$ of $\mathcal{N}$ give the representatives $\Phi = \mathscr{Y}\circ\phi\circ\mathscr{X}^{-1}$ and $\tilde\Phi = \tilde{\mathscr{Y}}\circ\phi\circ\tilde{\mathscr{X}}^{-1}$. Where all charts are defined, write $\tilde\Phi$ in terms of $\Phi$ and transition maps.
    prefix: '\tilde\Phi ='
    tiles: ['(\tilde{\mathscr{Y}}\circ\mathscr{Y}^{-1})', '\circ', '\Phi', '\circ', '(\mathscr{X}\circ\tilde{\mathscr{X}}^{-1})', '(\mathscr{Y}\circ\tilde{\mathscr{Y}}^{-1})', '(\tilde{\mathscr{X}}\circ\mathscr{X}^{-1})']
    answers:
      - ['(\tilde{\mathscr{Y}}\circ\mathscr{Y}^{-1})', '\circ', '\Phi', '\circ', '(\mathscr{X}\circ\tilde{\mathscr{X}}^{-1})']
    wrong:
      - answer: ['(\mathscr{Y}\circ\tilde{\mathscr{Y}}^{-1})', '\circ', '\Phi', '\circ', '(\tilde{\mathscr{X}}\circ\mathscr{X}^{-1})']
        feedback: |
          Check the types, reading right to left. $\tilde\Phi$ eats $\tilde{\mathscr{X}}$-coordinates, but $\tilde{\mathscr{X}}\circ\mathscr{X}^{-1}$ eats $\mathscr{X}$-coordinates. Both transitions point the wrong way.
      - answer: ['(\mathscr{X}\circ\tilde{\mathscr{X}}^{-1})', '\circ', '\Phi', '\circ', '(\tilde{\mathscr{Y}}\circ\mathscr{Y}^{-1})']
        feedback: |
          Compositions act right to left: the map written last acts first. $\tilde\Phi$ starts from $\tilde{\mathscr{X}}$-coordinates on $\mathcal{M}$, so the first step (rightmost) converts those to $\mathscr{X}$-coordinates; the $\mathcal{N}$-side transition comes last (leftmost).
    hint: 'Expand $\tilde\Phi = \tilde{\mathscr{Y}}\circ\mathscr{Y}^{-1}\circ\mathscr{Y}\circ\phi\circ\mathscr{X}^{-1}\circ\mathscr{X}\circ\tilde{\mathscr{X}}^{-1}$ and group.'
    explanation: |
      $$\tilde\Phi = (\tilde{\mathscr{Y}}\circ\mathscr{Y}^{-1})\circ\Phi\circ(\mathscr{X}\circ\tilde{\mathscr{X}}^{-1}).$$
      The right factor is a transition map of $\mathcal{M}$, smooth because $\mathcal{A}_\mathcal{M}$ is a smooth atlas; the left factor is a transition map of $\mathcal{N}$, smooth because $\mathcal{A}_\mathcal{N}$ is. A composition of smooth maps is smooth (chain rule), so $\tilde\Phi$ is smooth. Smoothness checked in **one** pair of charts around each point therefore holds in **all** pairs: it is a property of $\phi$, not of the charts.

  - type: text
    id: special-cases
    title: Functions and curves are smooth maps too
    body: |
      Give $\mathbb{R}$ its **standard smooth structure**, the one generated by the single chart $\text{id}_\mathbb{R}$ (id = identity, $\text{id}(p) = p$). Two special cases of smooth maps appear constantly:

      - A **smooth function** is a smooth map $f\colon\mathcal{M}\to\mathbb{R}$. Its representative is $\text{id}\circ f\circ\mathscr{X}^{-1} = f\circ\mathscr{X}^{-1}$, the chart representative of a function you already know.
      - A **smooth curve** is a smooth map $\gamma\colon\mathbb{R}\to\mathcal{M}$. Its representative is $\mathscr{X}\circ\gamma\circ\text{id}^{-1} = \mathscr{X}\circ\gamma$: the curve's coordinates as functions of the parameter $\lambda$.

      Curves will be the raw material of tangent vectors (Level 4).

  - type: mcq
    id: curve-representative
    prompt: |
      The curve $\gamma\colon\mathbb{R}\to S^1$, $\gamma(\lambda) = (\cos\lambda, \sin\lambda)$, runs around the unit circle. Read it in the angle chart $\theta\in(0, 2\pi)$, defined on $S^1$ without $(1, 0)$. What is the representative $\theta\circ\gamma$ for $\lambda$ in $(2\pi, 4\pi)$?
    options:
      - text: '$\lambda - 2\pi$'
        correct: true
      - text: '$\lambda$'
        feedback: |
          For $\lambda\in(2\pi, 4\pi)$ the value $\lambda$ is not in the chart's range $(0, 2\pi)$. The point $\gamma(\lambda)$ is the same as $\gamma(\lambda - 2\pi)$, so its angle is $\lambda - 2\pi$.
      - text: '$\cos\lambda$'
        feedback: |
          $\cos\lambda$ is the first **Cartesian** coordinate of $\gamma(\lambda)$, not its angle. The chart $\theta$ returns the angle in $(0, 2\pi)$.
      - text: '$2\lambda - 2\pi$'
        feedback: |
          That is the doubling map read in the angle chart. The curve $\gamma$ goes around once per $2\pi$ of $\lambda$, so it does not double anything.
    explanation: |
      The curve misses the domain of $\theta$ only when $\gamma(\lambda) = (1, 0)$, at $\lambda\in 2\pi\mathbb{Z}$. On each piece $(2\pi k, 2\pi(k+1))$, with $k$ an integer, the representative is $\lambda - 2\pi k$, slope $1$: the curve is smooth.

  - type: mcq
    id: identity-yx
    prompt: |
      On $\mathbb{R}$ take two smooth structures: $\mathbb{R}_x$, generated by the chart $x(p) = p$, and $\mathbb{R}_y$, generated by $y(p) = p^3$. Is the identity map $\text{id}(p) = p$, viewed as a map $\mathbb{R}_y\to\mathbb{R}_x$, smooth?
    options:
      - text: 'No: its representative $x\circ\text{id}\circ y^{-1}$ is $b\mapsto\sqrt[3]{b}$, not differentiable at $0$'
        correct: true
      - text: 'Yes: the identity map is always smooth'
        feedback: |
          The identity of a manifold to **itself** is smooth: its representatives are transition maps of one smooth atlas. Here the two sides carry different structures, so the representative $x\circ y^{-1}$ is a transition between incompatible charts.
      - text: 'Yes: its representative is $b\mapsto b^3$'
        feedback: |
          $b\mapsto b^3$ is $y\circ\text{id}\circ x^{-1}$, the identity read the other way, $\mathbb{R}_x\to\mathbb{R}_y$. For $\mathbb{R}_y\to\mathbb{R}_x$ start with $y^{-1}(b) = \sqrt[3]{b}$, then apply $x$.
      - text: 'No: it is not even continuous'
        feedback: |
          Both structures sit on the standard topology of $\mathbb{R}$, so the identity is continuous, even a homeomorphism. It fails only at the level of derivatives.
    explanation: |
      $$x\circ\text{id}\circ y^{-1}(b) = x(\sqrt[3]{b}) = \sqrt[3]{b},$$
      whose slope $\tfrac13 b^{-2/3}$ blows up at $b = 0$. Leaving points where they are, the two structures disagree.

  - type: mcq
    id: cube-representative
    prompt: |
      On $\mathbb{R}$ take two smooth structures: $\mathbb{R}_x$, generated by the chart $x(p) = p$, and $\mathbb{R}_y$, generated by $y(p) = p^3$. Consider $F\colon\mathbb{R}_y\to\mathbb{R}_x$, $F(p) = p^3$. What is its representative $x\circ F\circ y^{-1}(b)$?
    options:
      - text: '$b$'
        correct: true
      - text: '$b^3$'
        feedback: |
          That is $F(b)$: it skips $y^{-1}$ and treats the coordinate $b$ as if it were the point. The point with $y$-coordinate $b$ is $y^{-1}(b) = \sqrt[3]{b}$.
      - text: '$b^9$'
        feedback: |
          That applies $y$ instead of $y^{-1}$ first: $F(y(b)) = (b^3)^3$. To go from a coordinate back to a point, use $y^{-1}(b) = \sqrt[3]{b}$.
      - text: '$\sqrt[3]{b}$'
        feedback: |
          That is the representative of the identity $\mathbb{R}_y\to\mathbb{R}_x$. $F$ cubes the point after $y^{-1}$ takes the cube root, and the two cancel.
    explanation: |
      $$\begin{aligned}
      x\circ F\circ y^{-1}(b) &= x(F(\sqrt[3]{b})) \\
      &= (\sqrt[3]{b})^3 = b.
      \end{aligned}$$
      The identity of $\mathbb{R}$, as smooth as it gets: $F$ is smooth. In words, $x\circ F = y$: $F$ moves each point so that its new $x$-reading equals its old $y$-reading.

  - type: text
    id: def-diffeo
    title: Diffeomorphisms
    body: |
      A **diffeomorphism** is a bijection $\phi\colon\mathcal{M}\to\mathcal{N}$ such that
      $$\phi \text{ and } \phi^{-1} \text{ are both smooth.}$$
      If one exists, $\mathcal{M}$ and $\mathcal{N}$ are **diffeomorphic**. A diffeomorphism matches points one to one and carries smooth functions, curves and charts of one manifold to those of the other, so no calculus question can tell the two apart. This is the equivalence of smooth manifolds, as isomorphisms are for vector spaces and homeomorphisms for topological spaces.

      Smooth maps are continuous by definition, so a diffeomorphism is in particular a homeomorphism.

      For $F\colon\mathbb{R}_y\to\mathbb{R}_x$, $F(p) = p^3$, we found the representative $b\mapsto b$. $F$ is a bijection of $\mathbb{R}$ with inverse $F^{-1}(q) = \sqrt[3]{q}$. Is $F^{-1}\colon\mathbb{R}_x\to\mathbb{R}_y$ smooth?

  - type: numeric
    id: inverse-representative
    prompt: |
      On $\mathbb{R}$ take the smooth structures $\mathbb{R}_x$ (chart $x(p) = p$) and $\mathbb{R}_y$ (chart $y(p) = p^3$). The map $F^{-1}\colon\mathbb{R}_x\to\mathbb{R}_y$, $F^{-1}(q) = \sqrt[3]{q}$, has the representative $y\circ F^{-1}\circ x^{-1}$. What is its value at $a = 8$?
    answer: 8
    wrong:
      - value: 2
        feedback: |
          $2 = F^{-1}(8)$ is a **point** of $\mathbb{R}_y$. The representative returns its coordinate in the chart $y$: $y(2) = 2^3$.
      - value: 512
        feedback: |
          That is $y(8) = 8^3$, which skips $F^{-1}$. First $x^{-1}(8) = 8$, then $F^{-1}(8) = 2$, then $y(2)$.
    hint: Go step by step, right to left - $x^{-1}$, then $F^{-1}$, then $y$.
    explanation: |
      $$\begin{aligned}
      y\circ F^{-1}\circ x^{-1}(a) &= y(\sqrt[3]{a}) \\
      &= (\sqrt[3]{a})^3 = a,
      \end{aligned}$$
      so at $a = 8$ the value is $8$. The representative is $a\mapsto a$: $F^{-1}$ is smooth.

  - type: text
    id: resolution
    title: The two smooth lines are the same
    body: |
      Both $F\colon\mathbb{R}_y\to\mathbb{R}_x$, $F(p) = p^3$, and its inverse $F^{-1}(q) = \sqrt[3]{q}$ have the representative "identity":
      $$x\circ F\circ y^{-1}(b) = b$$
      and
      $$y\circ F^{-1}\circ x^{-1}(a) = a.$$
      So $F$ is a diffeomorphism and $\mathbb{R}_y$, $\mathbb{R}_x$ are **diffeomorphic**: as smooth manifolds they are the same line. The opening puzzle splits into two honest answers:

      - **As structures on the set $\mathbb{R}$** they differ: the identity $p\mapsto p$ is not a diffeomorphism between them.
      - **As smooth manifolds** they are equivalent: the map $F$ relabels points so that the ruler $y$ becomes the ruler $x$ (since $x\circ F = y$).

      The function $f(p) = p$ on $\mathbb{R}_x$ is not lost: it corresponds to $f\circ F(p) = p^3$ on $\mathbb{R}_y$, whose representative in chart $y$ is $b$.

  - type: mcq
    id: trap-smooth-homeo
    tag: Trap
    prompt: |
      Give $\mathbb{R}$ its standard smooth structure, generated by the chart $x(p) = p$, on **both** sides. The map $g(p) = p^3$ is smooth, bijective, and a homeomorphism (its inverse $\sqrt[3]{q}$ is continuous). Is $g$ a diffeomorphism?
    options:
      - text: 'No: the representative of $g^{-1}$ is $a\mapsto\sqrt[3]{a}$, not differentiable at $0$'
        correct: true
      - text: 'Yes: smooth, bijective, with continuous inverse'
        feedback: |
          A diffeomorphism needs a **smooth** inverse, not just a continuous one. Here $x\circ g^{-1}\circ x^{-1}(a) = \sqrt[3]{a}$ has an infinite slope at $a = 0$.
      - text: 'No: $g$ is not smooth, since its slope vanishes at $0$'
        feedback: |
          A zero derivative is perfectly smooth: $a^3$ has derivatives $3a^2$, $6a$, $6$, $0, \dots$, all defined everywhere. The trouble is in the inverse.
      - text: 'Yes: $p\mapsto p^3$ was a diffeomorphism from $\mathbb{R}_y$ to $\mathbb{R}_x$'
        feedback: |
          That used the structure generated by $y(p) = p^3$ on the domain. Whether a map is a diffeomorphism depends on the smooth structures on **both** sides, and here both carry the chart $x$.
    explanation: |
      The slope of $a^3$ vanishes at $0$, so the inverse has infinite slope there:
      $$\frac{d}{da}\sqrt[3]{a} = \frac{1}{3a^{2/3}}.$$
      In one variable: a smooth bijection is a diffeomorphism exactly when its derivative never vanishes. A smooth homeomorphism is not enough.

  - type: mcq
    id: which-diffeos
    multiple: true
    prompt: |
      Give $\mathbb{R}$ its standard smooth structure (chart $x(p) = p$) on both sides. Which of these maps $\mathbb{R}\to\mathbb{R}$ are diffeomorphisms? Select all that apply.
    options:
      - text: '$p\mapsto p + 1$'
        correct: true
      - text: '$p\mapsto 2p$'
        correct: true
      - text: '$p\mapsto p^3 + p$'
        correct: true
      - text: '$p\mapsto p^3$'
        feedback: |
          Smooth and bijective, but its derivative $3p^2$ vanishes at $0$, so the inverse $\sqrt[3]{q}$ has infinite slope at $q = 0$.
      - text: '$p\mapsto e^p$'
        feedback: |
          Smooth with derivative $e^p > 0$, but not onto $\mathbb{R}$: it only reaches $(0, \infty)$, so it is not a bijection $\mathbb{R}\to\mathbb{R}$. (As a map onto $(0, \infty)$ it would be a diffeomorphism, with inverse $\ln$.)
    explanation: |
      $p + 1$ and $2p$ have the smooth inverses $q - 1$ and $q/2$. For $g(p) = p^3 + p$ the derivative $3p^2 + 1 \ge 1$ never vanishes, $g$ grows from $-\infty$ to $\infty$, so it is a bijection, and its inverse is differentiable with
      $$(g^{-1})'(q) = \frac{1}{g'(g^{-1}(q))}.$$
      Differentiating this again and again shows $g^{-1}$ is $C^\infty$, even with no formula for $g^{-1}$.

  - type: text
    id: hierarchy
    title: The hierarchy of structures
    body: |
      Three layers, each adding data to the one before:

      - **Topological space** $(\mathcal{M}, \mathcal{O}_\mathcal{M})$. Adds open sets, which allow **continuity**. Maps: continuous. Equivalence: **homeomorphism**.
      - **Topological manifold** $(\mathcal{M}, \mathcal{O}_\mathcal{M}, \mathcal{A})_d$. Adds charts: locally $\mathcal{M}$ looks like $\mathbb{R}^d$. Maps: still continuous. Equivalence: still homeomorphism.
      - **Smooth manifold** $(\mathcal{M}, \mathcal{O}_\mathcal{M}, \mathcal{A}_{C^\infty})_d$. Adds smooth transition maps, which allow **chart-independent derivatives**. Maps: smooth. Equivalence: **diffeomorphism**.

      The basic example of all three is $\mathbb{R}^d$ with its standard topology and the single chart $\text{id}_{\mathbb{R}^d}$.

      Diffeomorphic implies homeomorphic. Is the converse true? Can two smooth manifolds be homeomorphic but not diffeomorphic?

  - type: text
    id: exotic
    title: Exotic smooth structures
    body: |
      $\mathbb{R}_x$ and $\mathbb{R}_y$ were different structures that turned out diffeomorphic. Sometimes no diffeomorphism exists at all:

      - **Exotic $\mathbb{R}^4$.** Four-dimensional space $\mathbb{R}^4$ carries uncountably many smooth structures that are homeomorphic to the standard one, but not diffeomorphic to it or to each other. In every other dimension $n$, all smooth structures on $\mathbb{R}^n$ are diffeomorphic to the standard one.
      - **Exotic spheres.** In 1956 John Milnor found smooth structures on the 7-dimensional sphere $S^7$ not diffeomorphic to the standard round one. Kervaire and Milnor later counted 28 (15 if mirror-image diffeomorphisms also count).

      So "the same topological manifold" does not fix "the same smooth manifold". It is curious that dimension $4$, the dimension of spacetime, is the exceptional one.

  - type: mcq
    id: exotic-meaning
    prompt: |
      An **exotic $\mathbb{R}^4$** is $\mathbb{R}^4$ with a smooth structure different from the standard one (generated by the chart $\text{id}_{\mathbb{R}^4}$). Which statement describes it correctly?
    options:
      - text: 'It is homeomorphic to standard $\mathbb{R}^4$, but no diffeomorphism to standard $\mathbb{R}^4$ exists'
        correct: true
      - text: 'Its maximal atlas just contains different charts, like the structure generated by $y(p) = p^3$ on $\mathbb{R}$'
        feedback: |
          Different charts alone do not make a structure exotic. On $\mathbb{R}$, the structure generated by $y(p) = p^3$ differs from the standard one, yet $F(p) = p^3$ is a diffeomorphism between them. Exotic means **no** diffeomorphism exists.
      - text: 'It has a different topology from standard $\mathbb{R}^4$'
        feedback: |
          The topology is the same: exotic $\mathbb{R}^4$'s are homeomorphic to standard $\mathbb{R}^4$. The difference shows only at the level of derivatives.
      - text: 'It is a topological manifold that admits no smooth atlas'
        feedback: |
          An exotic $\mathbb{R}^4$ **is** a smooth manifold: it has a smooth structure, just one not diffeomorphic to the standard one.
    explanation: |
      Homeomorphism is the equivalence of topological manifolds, diffeomorphism that of smooth manifolds. An exotic structure is one that is equivalent in the first sense but not in the second.

  - type: mcq
    id: trap-structures-not-diffeo
    tag: Trap
    shuffle: false
    prompt: |
      True or false: if two smooth structures on the same topological manifold are different (the union of their atlases is not a smooth atlas), then the two smooth manifolds are not diffeomorphic.
    options:
      - text: 'True'
        feedback: |
          On $\mathbb{R}$ the structures generated by $x(p) = p$ and $y(p) = p^3$ are different, since $\sqrt[3]{b}$ is not smooth. Yet $F(p) = p^3$ is a diffeomorphism from the $y$-structure to the $x$-structure: both representatives $x\circ F\circ y^{-1}$ and $y\circ F^{-1}\circ x^{-1}$ are the identity.
      - text: 'False'
        correct: true
    explanation: |
      "Different structures" compares charts with the **identity** map. "Diffeomorphic" asks whether **some** smooth bijection with smooth inverse exists. The second can hold when the first fails, as for $\mathbb{R}$ with $x$ and with $x^3$. Only exotic structures fail both.

  - type: mcq
    id: trap-smooth-bijection
    tag: Trap
    shuffle: false
    prompt: |
      True or false: a smooth bijection between smooth manifolds is always a diffeomorphism.
    options:
      - text: 'True'
        feedback: |
          Take $\mathbb{R}$ with the structure generated by $x(p) = p$ as domain and the one generated by $y(p) = p^3$ as target. The identity $p\mapsto p$ has representative $y\circ x^{-1}(a) = a^3$: smooth and bijective. Its inverse has representative $x\circ y^{-1}(b) = \sqrt[3]{b}$: not smooth at $0$.
      - text: 'False'
        correct: true
    explanation: |
      A diffeomorphism needs the **inverse** to be smooth too, and that is a separate condition. The identity from ($\mathbb{R}$, chart $p$) to ($\mathbb{R}$, chart $p^3$) is a smooth bijection, and so is $p\mapsto p^3$ on standard $\mathbb{R}$; in both, the inverse involves $\sqrt[3]{\cdot}$, which is not differentiable at $0$.

  - type: text
    id: wrap-up
    title: What you now own
    body: |
      **Next:** a guided problem that puts the whole chapter together: prove, step by step, that the circle $S^1$ is a smooth manifold.
