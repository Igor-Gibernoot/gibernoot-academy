outroTitle: Chapter 5 in one picture
outro: |
  Read it top to bottom. The **tangent** and **cotangent spaces** at each point are the fibres of two **bundles**, $T\mathcal{M}$ and $T^*\mathcal{M}$, each a manifold of dimension $2d$. Their **sections** are the **vector** and **covector fields**, one vector or covector at every point, with sections defined by
  $$\pi\circ\sigma = \mathrm{id}_\mathcal{B}.$$
  In a chart the fields have component functions, changing contravariantly and covariantly:
  $$\mathcal{X}|_\mathcal{U} = x^i\,\partial x_i,$$
  $$y^i = \frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\,x^j,$$
  $$\mathsf{X}|_\mathcal{U} = \mathtt{x}_i\,dx^i,$$
  $$\mathtt{y}_i = \frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^i}\,\mathtt{x}_j.$$
  Fields **act** and return functions:
  $$\mathsf{X}\lceil\mathcal{X}\rfloor = \mathtt{x}_i\,x^i,$$
  $$df\lceil\mathcal{X}\rfloor = \mathcal{X}\lfloor f\rceil.$$
  The **ring** $C^\infty(\mathcal{M})$, which is not a field, rescales them point by point, making **modules**:
  $$(f\,\mathcal{X})(p) = f(p)\,\mathcal{X}(p).$$
  Independent fields need not span; **frames** exist on chart domains, globally only on parallelizable manifolds (not $S^2$). **Tensor fields** are $C^\infty(\mathcal{M})$-linear in each slot, hence pointwise, with one Jacobian per index:
  $$T(f\,\mathcal{Z},\dots) = f\,T(\mathcal{Z},\dots).$$
  On the right, a covector field is **closed** if
  $$\partial x_j\lfloor\mathtt{x}_i\rceil = \partial x_i\lfloor\mathtt{x}_j\rceil,$$
  and **exact** if it is $df$; exact implies closed, the converse holds on a disc, and the **angle field** shows how a hole breaks it.

  **Next: the Level Challenge.** Harder problems that combine the whole map, ending in physics: the Minkowski metric $\eta = \mathrm{diag}(-1,1,1,1)$ of special relativity as a $(0,2)$ tensor field, pushed through a Lorentz boost with the tensor law. Which of its components survive the change of chart?
