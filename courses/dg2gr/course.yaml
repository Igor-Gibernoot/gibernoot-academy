# The trail. One level per book chapter, lessons in trail order.
#
# A lesson entry with `file:` is built and playable; without it, it shows as
# a planned (greyed) node. `kind` is concept | guided | traps, plus the three
# end-of-level kinds: map (content-map puzzle), review (automatic, no file:
# practises only this level's questions) and challenge (mixed problems).
# A level with `status: unwritten` shows as "not in the book yet" (unused now that the book is complete).

title: From Differential Geometry to General Relativity

levels:
  - id: ch01
    number: 1
    title: Introduction
    blurb: Why this course exists, the big questions it answers, and a preview of the road from vector spaces to Einstein's equations.
    lessons:
      - id: ch01-gravity
        title: Is Gravity a Force?
        kind: concept
        file: ch01/gravity.yaml
        summary: If free fall feels like nothing, what is gravity? Tides, and why coordinates are labels, not physics.
      - id: ch01-curvature
        title: Vectors, Derivatives and Curvature
        kind: concept
        file: ch01/curvature.yaml
        summary: Why a vector is not a list of numbers, why differentiating on a sphere needs a connection, and how a bug can detect curvature from inside.
      - id: ch01-spacetime
        title: "Measuring, Adding Up and Einstein's Law"
        kind: concept
        file: ch01/spacetime.yaml
        summary: Twins, areas, Newton as geometry and the Einstein equations; then decode the sentence that defines general relativity.

  - id: ch02
    number: 2
    title: Vector Spaces
    blurb: Vectors, covectors and tensors, and why their components transform the way they do.
    lessons:
      - id: ch02-maps
        title: Maps and Bijections
        kind: concept
        file: ch02/maps.yaml
        summary: When can a change of description be undone? Injective, surjective and bijective maps, composition, and how to repair polar coordinates.
      - id: ch02-axioms
        title: What Makes a Vector Space
        kind: concept
        file: ch02/axioms.yaml
        summary: Is the set of positive numbers, with multiplication as "addition", a vector space? The eight rules, and what they leave out.
      - id: ch02-dual
        title: Linear Maps and the Dual Space
        kind: concept
        file: ch02/dual.yaml
        summary: A gradient eats a step and returns a number. Linear maps, the vector space $\mathrm{Hom}(V,W)$, and the dual space of covectors.
      - id: ch02-basis
        title: Bases and the Dual Basis
        kind: concept
        file: ch02/basis.yaml
        summary: A basis turns vectors into numbers, and hands you a basis of $V^*$ for free. Why does each dual basis covector depend on the whole basis?
      - id: ch02-change-of-basis
        title: Same Arrow, Different Numbers
        kind: concept
        file: ch02/change-of-basis.yaml
        summary: Two observers describe one vector with different bases. Why do their numbers move *against* the basis? You'll derive the contravariant law yourself.
      - id: ch02-covector-law
        title: "Guided Problem: Do Covectors Transform the Same Way?"
        kind: guided
        file: ch02/covector-law.yaml
        summary: Derive the covector transformation law step by step, then prove that $\mathsf{X}(\mathcal{X})$ is the same in every basis.
      - id: ch02-transformation-traps
        title: Transformation Traps
        kind: traps
        file: ch02/transformation-traps.yaml
        summary: A fast round of the mistakes almost everyone makes with bases, indices and transformation laws.
      - id: ch02-J-invertible
        title: "Guided Problem: Why the Change of Basis Is Invertible"
        kind: guided
        file: ch02/J-invertible.yaml
        summary: We use $J^{-1}$ freely. Prove it exists, using nothing but the uniqueness of components in a basis.
      - id: ch02-dual-basis-law
        title: "Guided Problem: The Dual Basis Uses the Same J"
        kind: guided
        file: ch02/dual-basis-law.yaml
        summary: When the basis changes by $J$, how does the dual basis change? Derive it by evaluating on basis vectors, and recover the covector law.
      - id: ch02-intuition-transformations
        title: "Intuition: Which Law Gets J, Which Gets J⁻¹?"
        kind: intuition
        file: ch02/intuition-transformations.yaml
        summary: Four transformation laws, one anchor. Two quick checks (a scaling test and index balance) to rebuild any of them in seconds.
      - id: ch02-tensors
        title: Tensors as Multilinear Maps
        kind: concept
        file: ch02/tensors.yaml
        summary: Double both sides of a parallelogram and its area grows by 4. Machines that are linear in each slot, their components, and why one factor of $J$ or $J^{-1}$ appears per index.
      - id: ch02-tensor-product
        title: The Tensor Product
        kind: concept
        file: ch02/tensor-product.yaml
        summary: Is every two-slot machine a product of two covectors? Simple tensors, $V\otimes W$, the product basis, and why $T^{(r,s)}$ has dimension $d^{\,r+s}$.
      - id: ch02-map
        title: "Content Map: Vector Spaces"
        kind: map
        file: ch02/map.yaml
        summary: Rebuild the chapter's concept map box by box. For each box, pick the right card among look-alikes with subtle mistakes.
      - { id: ch02-review, title: Level Review, kind: review }
      - id: ch02-challenge
        title: Level Challenge
        kind: challenge
        file: ch02/challenge.yaml
        summary: Five problems on one change of basis. Transform vectors, covectors and tensors, split a tensor into symmetric and antisymmetric parts, find ranks, and count dimensions.

  - id: ch03
    number: 3
    title: Topological Manifolds
    blurb: Open sets, continuity, charts and atlases. Just enough structure to say "locally looks like $\mathbb{R}^d$".
    lessons:
      - id: ch03-open-sets
        title: Topological Spaces and Open Sets
        kind: concept
        file: ch03/open-sets.yaml
        summary: How do you say "nearby" when distance is the unknown? The three rules for open sets, closed sets, and why one set carries many topologies.
      - id: ch03-standard-topology
        title: The Standard and Inherited Topologies
        kind: concept
        file: ch03/standard-topology.yaml
        summary: Is $[0, 1)$ open? Balls and the standard topology on $\mathbb{R}^d$, why only finite intersections, and the topology a subset inherits.
      - id: ch03-homeomorphisms
        title: Continuity and Homeomorphisms
        kind: concept
        file: ch03/homeomorphisms.yaml
        summary: Is a circle the same space as the interval wrapped around it? Preimages, continuity without distances, and homeomorphisms.
      - id: ch03-hausdorff
        title: Hausdorff and Second Countable
        kind: concept
        file: ch03/hausdorff.yaml
        summary: Can a sequence converge to two points? Separating points with open sets, the line with two origins, and countable bases.
      - id: ch03-charts
        title: Charts and Transition Maps
        kind: concept
        file: ch03/charts.yaml
        summary: Can one angle label every point of a circle? Charts, coordinates, transition maps between overlapping charts, and the definition of a topological manifold.
      - id: ch03-atlases
        title: Atlases and Smooth Manifolds
        kind: concept
        file: ch03/atlases.yaml
        summary: Is $f(p) = p$ differentiable when the line is charted by $p^3$? Atlases, compatible charts, maximal atlases, and the definition of a smooth manifold.
      - id: ch03-smooth-maps
        title: Smooth Maps and Diffeomorphisms
        kind: concept
        file: ch03/smooth-maps.yaml
        summary: Are the line charted by $p$ and the line charted by $p^3$ the same smooth manifold? Smooth maps through chart representatives, smooth functions and curves, diffeomorphisms, and exotic structures.
      - id: ch03-circle
        title: "Guided Problem: The Circle Is a Smooth Manifold"
        kind: guided
        file: ch03/circle.yaml
        summary: Prove, step by step, that the circle with four half-circle charts is a smooth manifold, from the inherited topology to the transitions $\pm\sqrt{1 - s^2}$.
      - id: ch03-traps
        title: Manifold Traps
        kind: traps
        file: ch03/traps.yaml
        summary: Is a point open? Is a short interval the same space as the whole line? Twelve fast questions, each hiding a tempting mistake about topology, charts and smooth maps.
      - { id: ch03-map, title: "Content Map: Topological Manifolds", kind: map, file: ch03/map.yaml }
      - { id: ch03-review, title: Level Review, kind: review }
      - id: ch03-challenge
        title: Level Challenge
        kind: challenge
        file: ch03/challenge.yaml
        summary: Harder problems mixing topology, charts, atlases and smooth maps - a graph with a corner, stereographic charts from both poles, two smooth structures on one line, the line with two origins, and the doubling map of the circle.

  - id: ch04
    number: 4
    title: Tangent Spaces
    blurb: Vectors on a curved space are velocities of curves, and $T_p\mathcal{M}$ is where they live.
    lessons:
      - id: ch04-tangent-space
        title: Curves and the Tangent Space
        kind: concept
        file: ch04/tangent-space.yaml
        summary: With no space around a manifold, what is a velocity? Velocities as rates of change of scalar fields along curves, and the tangent space $T_p\mathcal{M}$.
      - id: ch04-velocity-operations
        title: "Guided Problem: Adding Velocities with Curves"
        kind: guided
        file: ch04/velocity-operations.yaml
        summary: Is the sum of two velocities again a velocity? Add curves in two different charts, get two different curves with one velocity, and prove that $T_p\mathcal{M}$ is closed under $\oplus_T$ and $\odot_T$.
      - id: ch04-coordinate-basis
        title: Coordinate Bases and the Jacobian
        kind: concept
        file: ch04/coordinate-basis.yaml
        summary: One velocity, two lists of numbers. The chart-induced basis $(\partial/\partial\mathscr{X}^i)_p$, components, the Jacobian, and how bases (covariant) and components (contravariant) change between charts.
      - id: ch04-chart-basis
        title: "Guided Problem: The Chart-Induced Basis"
        kind: guided
        file: ch04/chart-basis.yaml
        summary: We called $(\partial/\partial\mathscr{X}^i)_p$ a basis without proof. Show that each one is a velocity, that they span $T_p\mathcal{M}$ and are linearly independent, and conclude $\dim T_p\mathcal{M} = d$.
      - id: ch04-einstein
        title: Einstein Summation
        kind: concept
        file: ch04/einstein.yaml
        summary: Drop the summation signs. An index once up and once down in a term is summed; free indices must match. Rewrite the basis and component laws, the Kronecker delta and the inverse Jacobian in Einstein form.
      - id: ch04-cotangent
        title: The Cotangent Space
        kind: concept
        file: ch04/cotangent.yaml
        summary: A scalar field turns each velocity into a rate of change, linearly. The cotangent space $T_p^*\mathcal{M}$ as the dual of $T_p\mathcal{M}$, the differential $(df)_p$, why it is linear, $\dim T_p^*\mathcal{M} = d$, and why a covector is not an arrow.
      - id: ch04-cotangent-basis
        title: Differentials as a Basis
        kind: concept
        file: ch04/cotangent-basis.yaml
        summary: A chart's coordinate functions, differentiated, are the dual basis of its basis vectors. Covector components, the expansion of $(df)_p$, the transformation laws (basis contravariant, components covariant), the chart-free pairing, and why every covector is a differential.
      - id: ch04-intuition-jacobian
        title: "Intuition: Which Jacobian, ∂Y/∂X or ∂X/∂Y?"
        kind: intuition
        file: ch04/intuition-jacobian.yaml
        summary: Four chart-change laws, one chain rule. A scaling test and a cancellation test to rebuild any of them in seconds, with a polar–cartesian example.
      - id: ch04-tensor-space
        title: Tensor Spaces at a Point
        kind: concept
        file: ch04/tensor-space.yaml
        summary: A machine that eats two velocities at $p$ needs $d^2$ numbers. The tensor space $T_p^{(r,s)}\mathcal{M}$, products of the chart bases, components, $\dim = d^{\,r+s}$, and the transformation law with one Jacobian per index.
      - id: ch04-traps
        title: Tangent Space Traps
        kind: traps
        file: ch04/traps.yaml
        summary: Fast questions on the level's classic mistakes, from velocities and curve sums to the chart-induced basis, Einstein summation, covectors and tensor components.
      - id: ch04-map
        title: "Content Map: Tangent Spaces"
        kind: map
        file: ch04/map.yaml
        summary: Rebuild the level box by box, from curves and scalar fields to velocities, the tangent and cotangent spaces, chart bases, Jacobians and tensors, among decoys that hide the level's classic mistakes.
      - { id: ch04-review, title: Level Review, kind: review }
      - id: ch04-challenge
        title: Level Challenge
        kind: challenge
        file: ch04/challenge.yaml
        summary: Harder problems mixing the level's ideas, from the polar chart and reparametrized curves to the circle in two charts, tensor traces and a full tensor computation.

  - id: ch05
    number: 5
    title: Fields
    blurb: From one point to the whole manifold, with vector, covector and tensor fields.
    lessons:
      - id: ch05-vector-fields
        title: Vector Fields and the Tangent Bundle
        kind: concept
        file: ch05/vector-fields.yaml
        summary: One arrow at every point, each in its own tangent space. The tangent bundle $T\mathcal{M}$ as a $2d$-dimensional manifold, vector fields as smooth sections, component functions, and a field acting on scalar fields.
      - id: ch05-covector-fields
        title: Covector Fields and the Cotangent Bundle
        kind: concept
        file: ch05/covector-fields.yaml
        summary: A covector at every point, such as the differential $df$ of a height map. The cotangent bundle $T^*\mathcal{M}$, covector fields as smooth sections, the covariant law for component functions, the action on vector fields, and a field that is no $df$.
      - id: ch05-module
        title: "The $C^\\infty(\\mathcal{M})$-Module Structure"
        kind: concept
        file: ch05/module.yaml
        summary: Fields can be scaled by functions, a different factor at every point. The ring $C^\infty(\mathcal{M})$, which is not a field, the modules $\Gamma T\mathcal{M}$ and $\Gamma T^*\mathcal{M}$, independence without spanning, frames, and why the sphere has no global basis.
      - id: ch05-tensor-fields
        title: Tensor Fields
        kind: concept
        file: ch05/tensor-fields.yaml
        summary: Machines that eat several fields and return a function, linear over functions in each slot. $C^\infty(\mathcal{M})$-multilinearity, the pointwise principle, component functions, the chart-change law with Jacobian functions, and the compact notation for fields.
      - id: ch05-differentials
        title: "Guided Problem: Which Covector Fields Are Differentials?"
        kind: guided
        file: ch05/differentials.yaml
        summary: Every function gives a covector field df, but which covector fields come from a function? A local symmetry test, a construction on a disc, and an angle field that passes the test yet fails around the origin.
      - id: ch05-intuition-lie
        title: "Intuition: Signs and Slots of the Lie Derivative"
        kind: intuition
        file: ch05/intuition-lie.yaml
        summary: Which terms, which signs and which slots in the Lie derivative of a function, vector, covector and any tensor, and the commutator in components, with quick checks.
      - id: ch05-traps
        title: Field Traps
        kind: traps
        file: ch05/traps.yaml
        summary: A fast round of tempting mistakes about fields, from zero vectors and kinked sections to module bases, tensor tests and closed versus exact.
      - id: ch05-map
        title: "Content Map: Fields"
        kind: map
        file: ch05/map.yaml
        summary: Rebuild the chapter box by box, from tangent spaces and bundles to vector and covector fields, their actions, the ring and modules, frames, tensor fields, and closed versus exact.
      - { id: ch05-review, title: Level Review, kind: review }
      - id: ch05-challenge
        title: Level Challenge
        kind: challenge
        file: ch05/challenge.yaml
        summary: Harder problems combining the level. The rotation field in two charts and against two covector fields, the unit radial field and its dual coframe, zero divisors and fields killed by a function, closed versus exact, and a Minkowski boost.

  - id: exam-partial
    eyebrow: Partial exam
    hue: 3
    title: "Partial Exam: Manifolds"
    blurb: A timed exam on Levels 2 to 5. No feedback until you submit, then your score and a review of every answer.
    lessons:
      - id: exam-partial
        title: Partial Exam
        kind: exam
        file: exams/partial.yaml
        summary: One hour, ten points, four questions on the torus. Charts and transition maps, velocities of curves, the differential of a scalar field, and vector fields acting on functions. Answers are checked only when you submit.

  - id: ch06
    number: 6
    title: Covariant Derivative
    blurb: Differentiating vector fields needs extra structure, a connection, and its torsion and curvature characterize it.
    lessons:
      - id: ch06-connections
        title: Connections and Affine Manifolds
        kind: concept
        file: ch06/connections.yaml
        summary: Differentiating components depends on the chart. A connection is the extra structure that differentiates vector and tensor fields, fixed by five rules; the plane carries more than one.
      - id: ch06-christoffel
        title: Connection Coefficient Functions
        kind: concept
        file: ch06/christoffel.yaml
        summary: In a chart a connection is d³ functions Γ, which give every covariant derivative in components; they change chart with an extra second-derivative term, so they are not a tensor.
      - id: ch06-intuition-christoffel
        title: "Intuition: Reading, Signing and Changing Γ"
        kind: intuition
        file: ch06/intuition-christoffel.yaml
        summary: Which index is the direction, when Γ enters with a plus or a minus, and the two-part transformation law (tensor part plus extra term) with quick checks.
      - id: ch06-parallel-transport
        title: Parallel Transport and Autoparallels
        kind: concept
        file: ch06/parallel-transport.yaml
        summary: A connection carries a vector along a curve by a linear ODE, and the curves that carry their own velocity are the autoparallels. Whether a circle is straight depends on the connection.
      - id: ch06-torsion-curvature
        title: Torsion and Curvature
        kind: concept
        file: ch06/torsion-curvature.yaml
        summary: Two tensors hidden in a connection. Torsion measures whether swapping two derivatives matches the commutator; curvature measures whether a vector carried around a loop comes back to itself.
      - id: ch06-torsion-tensor
        title: "Guided Problem: Torsion Is a Tensor"
        kind: guided
        file: ch06/torsion-tensor.yaml
        summary: Neither the covariant derivative nor the commutator is a tensor, yet the torsion is. Prove it slot by slot and watch the two defects cancel.
      - id: ch06-three-connections
        title: "Guided Problem: Three Connections on the Plane"
        kind: guided
        file: ch06/three-connections.yaml
        summary: Compute torsion and curvature of three connections on the plane by hand (Euclidean, frame, curved), sort them into flat/curved and torsion/no torsion, solve the sinusoidal straightest curves and predict a loop's mismatch.
      - id: ch06-intuition-curvature
        title: "Intuition: Slots of Torsion, Curvature and Ricci"
        kind: intuition
        file: ch06/intuition-curvature.yaml
        summary: Which Riemann index is the output, the carried vector and the loop pair, which pairs are antisymmetric, the torsion sign with the commutator, and which index Ricci contracts.
      - id: ch06-traps
        title: Connection Traps
        kind: traps
        file: ch06/traps.yaml
        summary: Fast questions on the classic connection mistakes, from Γ's that look like a tensor and swapped indices to torsion seen by autoparallels and curvature removed at a point.
      - id: ch06-map
        title: "Content Map: Covariant Derivative"
        kind: map
        file: ch06/map.yaml
        summary: Rebuild the chapter's map box by box, from the chart-dependence of component derivatives to the connection, its coefficients, transport, autoparallels, torsion and curvature, among look-alike cards that hide the classic mistakes.
      - { id: ch06-review, title: Level Review, kind: review }
      - id: ch06-challenge
        title: Level Challenge
        kind: challenge
        file: ch06/challenge.yaml
        summary: "Five problems: the straightest curves of ∇ᵂ (circles, rays, logarithmic spirals), a connection that is curved and twisted, the sheared chart where coordinate lines bend, the difference of two connections as a tensor, and normal coordinates where every Γ vanishes at a point but the curvature survives."

  - id: ch07
    number: 7
    title: Metric
    blurb: Lengths, angles and geodesics, and the one connection the metric singles out.
    lessons:
      - id: ch07-metric
        title: The Metric and the Musical Maps
        kind: concept
        file: ch07/metric.yaml
        summary: Components alone cannot give a length. A metric is a symmetric (0,2)-tensor field whose musical map is invertible; it lowers and raises indices, and need not be positive (Minkowski).
      - id: ch07-signature
        title: Signature
        kind: concept
        file: ch07/signature.yaml
        summary: A metric has no eigenvalues, but Sylvester's law gives a chart-independent count of plus and minus signs, the signature. It sorts metrics into Riemannian, pseudo-Riemannian and Lorentzian, and only the latter two have null vectors.
      - id: ch07-length
        title: Length and Geodesics
        kind: concept
        file: ch07/length.yaml
        summary: A sign rune keeps the square root real, so the metric measures any curve, Euclidean or Minkowski, where length becomes proper time (the twin paradox). The length ignores how fast the path is run, and its stationary curves are the geodesics.
      - id: ch07-euler-lagrange
        title: Variations and the Euler-Lagrange Equations
        kind: concept
        file: ch07/euler-lagrange.yaml
        summary: Bend a curve in a chart with a knob ᛊ and a shape ᛉ that keeps the endpoints fixed, ask that the length not change to first order, and integration by parts turns this into differential equations at every point, the Euler-Lagrange equations.
      - id: ch07-geodesic-equation
        title: "Guided Problem: Deriving the Geodesic Equation"
        kind: guided
        file: ch07/geodesic-equation.yaml
        summary: Feed the metric's Lagrangian to the Euler-Lagrange equations, run the curve at constant speed, symmetrize and raise an index; out comes the geodesic equation, whose polar coefficients rebuild the flat connection.
      - id: ch07-levi-civita
        title: The Levi-Civita Connection
        kind: concept
        file: ch07/levi-civita.yaml
        summary: The geodesic equation has the shape of an autoparallel equation. Its coefficients, the Christoffel symbols, define the Levi-Civita connection, the only connection that is torsion free and keeps the metric constant, so its parallel transport preserves lengths and angles.
      - id: ch07-curvature
        title: Curvature of the Metric
        kind: concept
        file: ch07/curvature.yaml
        summary: Nonzero Christoffel symbols do not mean curvature; the Riemann tensor of the Levi-Civita connection does. Build a curved metric by hand, lower the index to see the four symmetries, and contract down to the Ricci scalar and the divergence-free Einstein curvature.
      - id: ch07-sphere
        title: "Guided Problem: Meridians and Parallels of the Sphere"
        kind: guided
        file: ch07/sphere.yaml
        summary: Build the round metric of the sphere from lengths in space, compute its Christoffel symbols, and test meridians and parallels against the geodesic equation; only the equator survives among the parallels, and the curvature comes out constant, R = 2.
      - id: ch07-traps
        title: Metric Traps
        kind: traps
        file: ch07/traps.yaml
        summary: Fast questions on the classic metric mistakes, from sums without g and reciprocal inverses to determinants, proper time, geodesics that are not shortest, and Christoffel symbols mistaken for curvature.
      - id: ch07-map
        title: "Content Map: Metric"
        kind: map
        file: ch07/map.yaml
        summary: Rebuild the chapter box by box, from a tangent space without lengths through the metric, its signature, length and geodesics, to the Levi-Civita connection and the curvatures it hands to Einstein's equations.
      - { id: ch07-review, title: Level Review, kind: review }
      - id: ch07-challenge
        title: Level Challenge
        kind: challenge
        file: ch07/challenge.yaml
        summary: "Harder problems that combine the level: contracted Christoffel symbols from the determinant of the metric (Jacobi's formula), a light ray in a medium bent by hand with a moving endpoint, lowering an index through ∇ together with why the energy Lagrangian fixes the speed while the length does not, the second variation (minimum, maximum or saddle), and why the Einstein curvature vanishes in two dimensions."

  - id: ch08
    number: 8
    title: Integrals
    blurb: Integration that does not depend on the chart, with volume forms and orientation.
    lessons:
      - id: ch08-volume-forms
        title: Volume Forms and Orientation
        kind: concept
        file: ch08/volume-forms.yaml
        summary: "Why integrating a chart representative depends on the chart (the unit disc has area π, but 2π in polar coordinates), volume forms and their scalar densities with the Levi-Civita symbol, the determinant law under a change of chart, and oriented atlases."
      - id: ch08-integration
        title: Integration on Manifolds
        kind: concept
        file: ch08/integration.yaml
        summary: "The integral of a function against a volume form inside one chart, why it is the same in every chart of an oriented atlas (and flips sign with the orientation), supports and partitions of unity, and the integral over a whole manifold, with the length of a circle glued from two angle charts."
      - id: ch08-metric-volume
        title: The Metric Volume Form
        kind: concept
        file: ch08/metric-volume.yaml
        summary: "How a metric picks one volume form, with density the square root of |det g| in every chart of an oriented atlas: why it glues (and needs the orientation), unit volume for orthonormal bases in any signature, the area 4π of the unit sphere, and spacetime volumes."
      - id: ch08-circle-length
        title: "Guided Problem: The Length of a Circle, Chart by Chart"
        kind: guided
        file: ch08/circle-length.yaml
        summary: "The whole integration machinery on a circle of radius R: an oriented atlas of two angle charts and a projection chart, the induced metric and its density in each, one arc measured in two charts (and in a chart of the wrong orientation), and the full length 2πR from a partition of unity."
      - id: ch08-intuition-metric
        title: "Intuition: Raising, Lowering and the Square Root of det g"
        kind: intuition
        file: ch08/intuition-metric.yaml
        summary: Which metric lowers and which raises (index placement), the scaling test g → λ²g for lowered, raised and density quantities, and how √|det g| changes between charts.
      - id: ch08-traps
        title: Integration Traps
        kind: traps
        file: ch08/traps.yaml
        summary: "Fast questions on the classic mistakes of integration on manifolds: the absolute Jacobian determinant, densities that are not scalars, ε as a symbol, mirror charts and oriented atlases, compact closures and supports, partitions of unity, and the square root of |det g|."
      - id: ch08-map
        title: "Content Map: Integrals"
        kind: map
        file: ch08/map.yaml
        summary: "Rebuild the Chapter 8 map box by box: from the chart dependence of naive integrals, through the change of variables, volume forms, the Levi-Civita symbol, scalar densities and oriented atlases, to integrals in one chart and over the whole manifold with partitions of unity, and the metric volume form with its lengths and areas."
      - { id: ch08-review, title: Level Review, kind: review }
      - id: ch08-challenge
        title: Level Challenge
        kind: challenge
        file: ch08/challenge.yaml
        summary: "Harder problems combining the level: why the closure of a region must be compact and inside the chart (an interval as a manifold, a chart whose density blows up at its edge), a partition of unity built by hand on the line with the roles of Hausdorff and second countability, the area of a torus over several charts, the spacetime volume of a causal diamond, and what rescaling the metric and the Möbius strip do to volume forms."

  - id: ch09
    number: 9
    title: Newton-Cartan Theory
    blurb: Newtonian gravity rewritten on a 4-dimensional manifold, with gravity living in the connection.
    lessons:
      - id: ch09-newtonian-spacetime
        title: Absolute Time and Newtonian Spacetime
        kind: concept
        file: ch09/newtonian-spacetime.yaml
        summary: "Why gravity looks like geometry (mass drops out of free fall, as for the Coriolis and centrifugal forces), then the stage: an absolute time t with dt never zero, the absolute spaces as its slices and absolute simultaneity, their tangent spaces ker dt, uniform flow ∇dt = 0 (no Γ with upper time index), and the Newtonian spacetime (M, O, A, ∇, t) with no spatial metric."
      - id: ch09-newton-axioms
        title: Newton's Axioms on a Manifold
        kind: concept
        file: ch09/newton-axioms.yaml
        summary: "Tangent vectors sorted by time content (future directed, spatial, past directed), worldlines that always move forward in absolute time, Newton I as the rule by which free particles define the connection (gravity is not a force), Newton II with spatial forces, and why it forces absolute time as the parameter: the time content of the acceleration is the second derivative of t along the worldline."
      - id: ch09-stratified
        title: Stratified Atlases
        kind: concept
        file: ch09/stratified.yaml
        summary: "Charts whose time coordinate is absolute time: why they exist around every event, the frozen time row of their Jacobians (grids may move but clocks agree), uniform flow as the vanishing of every Γ with upper time index (30 of 40 coefficients survive), and pseudo-forces: Γ-terms of Newton II that a change of grid creates or removes."
      - id: ch09-pseudo-forces
        title: Inertial Charts and Pseudo-Forces
        kind: concept
        file: ch09/pseudo-forces.yaml
        summary: Charts in which free particles move straight have all connection coefficients zero; from them, rigidly moving axes produce exactly the Coriolis, centrifugal, Euler and translational forces.
      - id: ch09-gravity-connection
        title: Gravity in the Connection
        kind: concept
        file: ch09/gravity-connection.yaml
        summary: "Free fall the same for every mass puts gravity into the connection, Γ^α₀₀ = ∂_αφ; uniform gravity is a pseudo-force removed by a freely falling chart, non-uniform gravity is curvature, Riem^α₀β₀ = ∂_β∂_αφ, and Poisson's equation becomes Ric₀₀ = 4πG_N ρ."
      - id: ch09-tidal
        title: Tidal Acceleration
        kind: concept
        file: ch09/tidal.yaml
        summary: "A chart falling with one particle removes gravity along that worldline only; nearby free particles obey the tidal equation, γ̈^α = −Riem^α₀β₀ γ^β: stretched toward the mass, squeezed across it, volume kept in vacuum, two ocean bulges."
      - id: ch09-point-mass
        title: "Guided Problem: A Point Mass in Newton-Cartan Theory"
        kind: guided
        file: ch09/point-mass.yaml
        summary: "One point mass through the whole chain: Γ^α₀₀ = G_NM x^α/|x|³, the full curvature off the axes, Ric₀₀ = 0 in vacuum, Kepler's third law and the co-rotating chart, a radial fall reaching the source in half an orbital period, and the tides in the chart falling with it."
      - id: ch09-traps
        title: Newton-Cartan Traps
        kind: traps
        file: ch09/traps.yaml
        summary: "Fast questions on this level's tempting mistakes: dt never zero, time content outside stratified charts, x⁰ = t exactly, the Newton II parameter, pseudo-forces vs curvilinear grids, Γ = 0 at one event, uniform vs curved fields, signs of Γ, Ric and the tidal equation, vacuum is not flat, and tides as 1/r³."
      - id: ch09-map
        title: "Content Map: Newton-Cartan Theory"
        kind: map
        file: ch09/map.yaml
        summary: "Rebuild the Chapter 9 map box by box: from absolute time, absolute spaces and uniform flow to Newtonian spacetime, worldlines and Newton's two laws, stratified and inertial charts with their pseudo-forces, and gravity in the connection with its curvature, field equation and tidal equation."
      - { id: ch09-review, title: Level Review, kind: review }
      - id: ch09-challenge
        title: Level Challenge
        kind: challenge
        file: ch09/challenge.yaml
        summary: "Harder problems combining the level: a ball whirled on a string and released, seen from the ground and from a carousel; a chart with bent clocks, where chart time and absolute time part ways; every chart inertial along with a given one, and a shearing grid that is not; a tunnel through a uniform planet, where every fall takes the same time and tides are exact; and a merry-go-round told apart from gravity by curvature."

  - id: ch10
    number: 10
    title: General Relativity
    blurb: Spacetime, observers and proper time, and the Einstein equations from an action.
    lessons:
      - id: ch10-spacetime
        title: Spacetime and Time Orientation
        kind: concept
        file: ch10/spacetime.yaml
        summary: "The sign of a Lorentzian metric sorts tangent vectors into timelike, lightlike and spacelike: the light cone at each point, a time orientation that picks its future half, and spacetime defined as a sextuple."
      - id: ch10-worldlines
        title: Worldlines and Proper Time
        kind: concept
        file: ch10/worldlines.yaml
        summary: "Massive and massless worldlines as postulates on the velocity, proper time as the metric length of a worldline (the time on a clock it carries), why it ignores the parametrization, and why the straight worldline carries the most time: the twins, computed."
      - id: ch10-observers
        title: Observers and What They Measure
        kind: concept
        file: ch10/observers.yaml
        summary: "An observer as a massive worldline with a Lorentz-orthonormal frame whose time axis is its velocity: dual covectors from the metric, components measured on its clock and rods, the 3-velocity, and why every observer measures light at speed 1 and nothing faster."
      - id: ch10-lorentz
        title: Lorentz Transformations from Observer Frames
        kind: concept
        file: ch10/lorentz.yaml
        summary: "Two observers meeting at an event: the matrix between their frames, the condition that makes it a Lorentz transformation, why only orthochronous ones occur, the 1+1 boosts, and why this is a statement about frames, not coordinates."
      - id: ch10-einstein-hilbert
        title: The Einstein Equations from an Action
        kind: concept
        file: ch10/einstein-hilbert.yaml
        summary: "The metric as the unknown: the Einstein–Hilbert action, what varying g means, the variations of the inverse metric, the volume density and the Ricci tensor (Palatini identity), why the second derivatives form a total divergence, the vacuum equations G = 0, and the matter term that gives G = 8πG_N T."
      - id: ch10-matter
        title: Coupling to Matter
        kind: concept
        file: ch10/matter.yaml
        summary: "Where the right-hand side comes from: T as the response of the matter action to the metric, T̂ = −2Θ − L g⁻¹ when L has no derivatives of g, checks with a constant term (p = −ρ) and a scalar field, electromagnetism and the Einstein–Maxwell equations, and why the matter equations make div T = 0."
      - id: ch10-schwarzschild
        title: "Guided Problem: Checking the Schwarzschild Metric"
        kind: guided
        file: ch10/schwarzschild.yaml
        summary: "Check by hand that the Schwarzschild metric is Ricci-flat: the connection coefficients one by one, the Ricci components (two conditions on f), why f = 1 - r_S/r and the Newtonian limit fix r_S, what the coordinate r measures, and the tidal tensor of Level 9 recovered."
      - id: ch10-traps
        title: Relativity Traps
        kind: traps
        file: ch10/traps.yaml
        summary: "Fast questions on this level's tempting mistakes: signs of timelike and spacelike, the cone is not a subspace, proper time vs coordinate time, the straight worldline is the longest, Lorentz matrices and speeds, Ricci-flat is not flat, the volume density, signs and sizes of T, and Schwarzschild's r, clocks and tides."
      - id: ch10-map
        title: "Content Map: General Relativity"
        kind: map
        file: ch10/map.yaml
        summary: "Rebuild the Chapter 10 map box by box: spacetime and its light cone, the time orientation, worldlines and proper time, observers and Lorentz matrices on one side; the Einstein-Hilbert action, the energy-momentum tensor, the Einstein equations, conservation, Schwarzschild and its tides on the other."
      - { id: ch10-review, title: Level Review, kind: review }
      - id: ch10-challenge
        title: Level Challenge
        kind: challenge
        file: ch10/challenge.yaml
        summary: "Harder problems combining the level: twins with two different speeds, the Lorentz matrix at the turnaround and what the home clock reads in between; a chart of accelerated observers, flat but with nonzero Christoffel symbols, where rapidities add; and which sources gravitate, from dust and light to vacuum energy and a scalar field that repels; the energy-momentum tensor of a plane light wave; and static clocks outside a star, with a modified metric whose Ricci tensor is that of an electric field."

  - id: exam-final
    eyebrow: Final exam
    hue: 3
    title: "Final Exam: Connection, Metric and Integration"
    blurb: A timed three-hour exam on Levels 6 to 10, on the unit sphere. No feedback until you submit, then your score and a review of every answer.
    lessons:
      - id: exam-final
        title: Final Exam
        kind: exam
        file: exams/final.yaml
        summary: Three hours, ten points, three questions on the unit sphere. A connection defined by one chart and its curves, the induced metric with its Levi-Civita connection and geodesics, and the volume form with integrals in two charts. Answers are checked only when you submit.
