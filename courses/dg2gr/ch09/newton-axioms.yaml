id: ch09-newton-axioms
title: Newton's Axioms on a Manifold
kind: concept

own: |
  - **Setting and symbols**: $\mathcal{M}$ is the 4-dimensional manifold of events and $t\in C^\infty(\mathcal{M})$ the absolute time, with $(dt)_p\neq0$ at every $p$. $\mathcal{S}_\tau := \mathrm{preim}_t(\{\tau\})$ is the absolute space at time $\tau$. $\nabla$ is the torsion-free connection on $\mathcal{M}$, with coefficients $\Gamma^i_{jk}$ in a chart $(\mathcal{U},\mathscr{X})$ (coordinates $x^i=\mathscr{X}^i$). For a worldline $\gamma\colon\mathbb{R}\to\mathcal{M}$: $v_\gamma := \gamma'$ is its velocity, $a_\gamma := \nabla_{v_\gamma}v_\gamma$ its acceleration, $\mathcal{F}_\gamma$ the force on it, $\gamma^i := \mathscr{X}^i\circ\gamma$, and a dot is $d/d\lambda$.
  - **Time content of a vector** $\mathcal{X}_p\in T_p\mathcal{M}$: future directed if $(dt)_p(\mathcal{X}_p)>0$, past directed if $<0$, and **spatial** if {{ $(dt)_p(\mathcal{X}_p) = 0$, that is $\mathcal{X}_p\in T_p\mathcal{S}_{t(p)}$ }}. Forces are spatial vector fields along the worldline.
  - **Worldline** of a particle of mass $m>0$: a smooth curve $\gamma\colon\mathbb{R}\to\mathcal{M}$ with {{ $(t\circ\gamma)'(\lambda) > 0$ for every $\lambda$ }} (future-directed velocity). It crosses each absolute space at most once; $\tau = \lambda^3$ fails at $\lambda = 0$ although it crosses each slice once.
  - **Newton I**: with no force, {{ $\nabla_{v_\gamma}v_\gamma = 0$ }}. A measurement rule: free particles fix $\nabla$, and gravity lives in $\nabla$, not among the forces.
  - **Newton II**: under a force $\mathcal{F}_\gamma$, {{ $a_\gamma = \mathcal{F}_\gamma/m$ }}, so forces are measured as deviations from the free motion.
  - **Absolute time is the parameter**: with $\tau := t\circ\gamma$ and uniform flow,
  {{ $$\tau'' = (dt)(a_\gamma)$$ }}
  so $a_\gamma$ is spatial iff $\tau(\lambda) = c_1\lambda + c_2$ with $c_1>0$; choose $\lambda\equiv t$.
  - **Newton II in a chart with $\mathscr{X}^0 = t$**: the time component is $0 = 0$, and the spatial components ($\alpha,\beta,\delta\in\{1,2,3\}$) read
  {{ $$\begin{aligned}\ddot\gamma^\alpha &+ \Gamma^\alpha_{\beta\delta}\dot\gamma^\beta\dot\gamma^\delta + 2\Gamma^\alpha_{0\beta}\dot\gamma^\beta\\ &+ \Gamma^\alpha_{00} = f^\alpha_\gamma/m\end{aligned}$$ }}

cards:
  - type: text
    id: hook
    title: Same path, two clocks
    body: |
      Take the simplest Newtonian spacetime: a chart $\mathscr{X} = (x^0,x^1,x^2,x^3)$ covering $\mathcal{M}$ with $x^0 = t$ (absolute time) and all connection coefficients $\Gamma^k_{ji} = 0$. Then a curve's acceleration $a_\gamma := \nabla_{v_\gamma}v_\gamma$ has components that are plain second derivatives, $a^k_\gamma = \ddot\gamma^k$ (dot $= d/d\lambda$).

      A ball sits at rest at the spatial origin. Two people describe its history by two curves $\mathbb{R}\to\mathcal{M}$:
      $$\gamma_A(\lambda) = (\lambda,0,0,0),$$
      $$\gamma_B(\lambda) = (\lambda+\lambda^3,0,0,0).$$
      Both trace the **same path**, the time axis at the origin (since $\lambda+\lambda^3$ runs over all of $\mathbb{R}$, increasing); they only tick along it differently.

  - type: mcq
    id: hook-predict
    title: Before any theory, predict
    prompt: |
      In a chart $(x^0,x^1,x^2,x^3)$ with $x^0 = t$ (absolute time) and all connection coefficients zero, a ball at rest at the spatial origin is described by two curves with the same path, $\gamma_A(\lambda) = (\lambda,0,0,0)$ and $\gamma_B(\lambda) = (\lambda+\lambda^3,0,0,0)$. Newton's second law says $m\,a = F$, and a force pushes **in space**, never "in time". Which descriptions can obey Newton's second law?
    options:
      - text: 'Only $\gamma_A$'
        correct: true
      - text: 'Both: same path, same physics'
        feedback: |
          The acceleration depends on the parametrization, not just the path: $\ddot\gamma_B^0 = 6\lambda$, a component along the time direction, which no force pushing in space can supply.
      - text: 'Only $\gamma_B$'
        feedback: |
          $\gamma_A$ has acceleration $\ddot\gamma_A = 0$, which matches the zero force on a ball at rest. It is $\gamma_B$ whose acceleration $(6\lambda,0,0,0)$ points along time.
      - text: 'Neither: a ball at rest has no worldline'
        feedback: |
          Resting means not moving in **space**; in spacetime the ball still advances in time, so its history is the time axis at the origin.
    explanation: |
      $\gamma_A$ has $a = 0$, while $\gamma_B$ has $a = (6\lambda,0,0,0)$, nonzero along time. The lesson turns this into a theorem: Newton's second law can hold only when the parameter **is** absolute time, up to units and origin.

  - type: text
    id: def-classify
    title: Future, spatial, past
    body: |
      To say which curves can describe particles and which vectors can describe forces, sort tangent vectors by their **time content**. Recall: $t$ is the absolute time, $(dt)_p(v) = v(t)$ is the rate of change of $t$ along $v\in T_p\mathcal{M}$, and $\ker(dt)_p = T_p\mathcal{S}_{t(p)}$ is the tangent space of the absolute space $\mathcal{S}_{t(p)}$ through $p$.

      A tangent vector $\mathcal{X}_p\in T_p\mathcal{M}$ is
      - **future directed** if $(dt)_p(\mathcal{X}_p) > 0$,
      - **spatial** if $(dt)_p(\mathcal{X}_p) = 0$, i.e. $\mathcal{X}_p\in T_p\mathcal{S}_{t(p)}$,
      - **past directed** if $(dt)_p(\mathcal{X}_p) < 0$.

      A vector field $\mathcal{X}_\gamma$ along a curve $\gamma$ is spatial if every value $\mathcal{X}_\gamma(\lambda)$ is. Only the absolute time is used: no metric, no notion of length.

  - type: widget
    id: widget-sides
    title: Two sides of the kernel line
    widget: time-slices
    config:
      time: wavy
      times: [wavy]
      p: [1, 0.5]
      kernel: true
      stack: true
      badge: false
    body: |
      A 1+1-dimensional spacetime ($a$ across, chart coordinate $\tau$ up) with $t = \tau + 0.3\sin a$. At $p = (1,0.5)$ the line $\ker(dt)_p$ holds the spatial directions; the orange lines are the displacements $w$ from $p$ with $(dt)_p(w) = +1$ and $= -1$. Drag $p$ around and watch the kernel line split the directions at $p$ into two sides.

  - type: mcq
    id: widget-future-side
    title: Which side is the future?
    review: false
    prompt: |
      In the widget, $t = \tau + 0.3\sin a$, and at $p$ the line $\ker(dt)_p$ is drawn with the orange level lines $(dt)_p(w) = +1$ and $(dt)_p(w) = -1$ on either side. Which tangent vectors at $p$ are future directed?
    options:
      - text: 'Those pointing to the side of the $+1$ level line'
        correct: true
      - text: 'Those pointing straight up, along $\tau$, only'
        feedback: |
          Straight up is one future-directed direction, but there are many: any vector with $(dt)_p(w) > 0$ qualifies, including tilted ones, even some pointing slightly downward.
      - text: 'Those along the kernel line'
        feedback: |
          Along the kernel $(dt)_p(w) = 0$: those are the spatial vectors, tangent to the slice through $p$.
      - text: 'Those pointing to the side of the $-1$ level line'
        feedback: |
          On that side $(dt)_p(w) < 0$: absolute time decreases. Those are past directed.
    explanation: |
      $(dt)_p$ is linear, so its sign is constant on each side of its kernel: the kernel line splits $T_p\mathcal{M}$ into a future half, a past half and the spatial line between them. In four dimensions the kernel is a 3-dimensional subspace, and the halves are the two sides of it.

  - type: mcq
    id: tilted-down
    title: A vector that points down
    prompt: |
      In a 1+1 spacetime with coordinates $(a,\tau)$ and absolute time $t = \tau + 0.3\sin a$, at $p = (1,0.5)$ one has (rounded) $(dt)_p = 0.16\,da + 1\,d\tau$. The vector $\mathcal{X}_p$ has components $(\mathcal{X}^a,\mathcal{X}^\tau) = (2,-0.3)$, so it points slightly **downward** in the picture. It is
    options:
      - text: 'future directed'
        correct: true
      - text: 'past directed, since it points to lower $\tau$'
        feedback: |
          "Up" in the picture is the chart coordinate $\tau$, not absolute time. What counts is $(dt)_p(\mathcal{X}_p) = 0.16\cdot2 + 1\cdot(-0.3) = 0.02 > 0$: the wavy slices drop as $a$ grows, so moving right gains time.
      - text: 'spatial'
        feedback: |
          Spatial needs $(dt)_p(\mathcal{X}_p) = 0$. Here $0.16\cdot2 - 0.3 = 0.02$, small but positive. The spatial direction at $p$ is $(1,-0.16)$, which falls by $0.16$ per unit of $a$, not by $0.15$.
    explanation: |
      $$(dt)_p(\mathcal{X}_p) = 0.16\cdot2 - 0.3 = 0.02 > 0.$$
      Only the sign of $(dt)_p(\mathcal{X}_p)$ decides; the picture's vertical is a coordinate artifact.

  - type: mcq
    id: classify-4d
    title: Sorting four vectors
    multiple: true
    prompt: |
      At an event $p$ of a 4-dimensional Newtonian spacetime, in a chart with coordinates $x^0,\dots,x^3$, the absolute time has differential $(dt)_p = \mathtt{t}_k\,(dx^k)_p$ with components $(\mathtt{t}_0,\mathtt{t}_1,\mathtt{t}_2,\mathtt{t}_3) = (1,2,0,0)$. Which of these vectors (components $x^0,\dots,x^3$) are **spatial**?
    options:
      - text: '$(0,0,5,1)$'
        correct: true
      - text: '$(2,-1,0,0)$'
        correct: true
      - text: '$(1,0,0,0)$'
        feedback: |
          $(dt)_p = 1\cdot1 = 1 > 0$: future directed. The time content is read from $(dt)_p$, not from a coordinate.
      - text: '$(-1,0,3,0)$'
        feedback: |
          $(dt)_p = 1\cdot(-1) + 0 = -1 < 0$: past directed. The large spatial-looking entry $3$ is multiplied by $\mathtt{t}_2 = 0$ and does not help.
    explanation: |
      $(dt)_p(\mathcal{X}) = \mathtt{t}_kx^k = x^0 + 2x^1$. For $(0,0,5,1)$: $0$. For $(2,-1,0,0)$: $2-2 = 0$, spatial although its $x^0$ component is $2$: in a chart whose $x^0$ is not $t$, a nonzero time **coordinate** component does not mean nonzero time **content**.

  - type: text
    id: def-worldline
    title: Worldlines move forward in time
    body: |
      Recall: the velocity $v_\gamma(\lambda)$ of a curve $\gamma$ acts on a function $f$ by $v_\gamma(\lambda)(f) = (f\circ\gamma)'(\lambda)$. So its time content is
      $$(dt)_{\gamma(\lambda)}\big(v_\gamma(\lambda)\big) = (t\circ\gamma)'(\lambda),$$
      the rate at which absolute time advances along $\gamma$.

      **Definition.** The **worldline** of a particle of mass $m>0$ is a smooth curve $\gamma\colon\mathbb{R}\to\mathcal{M}$ with future-directed velocity:
      $$(t\circ\gamma)'(\lambda) > 0\quad\forall\lambda\in\mathbb{R}.$$
      Then $t\circ\gamma$ is strictly increasing, hence injective: a particle meets each absolute space $\mathcal{S}_\tau$ **at most once**. No visits to the past, no two places at one instant.

  - type: numeric
    id: crossings
    title: A curve that turns back
    prompt: |
      In a chart $(x^0,x^1)$ of a 1+1 spacetime with $x^0 = t$ (absolute time), consider the curve $\gamma(\lambda) = (\lambda-\lambda^3,\ \lambda)$. How many times does it meet the absolute space $\mathcal{S}_0$, the slice $t = 0$?
    answer: 3
    wrong:
      - { value: 1, feedback: 'A worldline would meet it at most once, but this curve is not one. Solve $t(\gamma(\lambda)) = \lambda-\lambda^3 = 0$: all its roots count.' }
    hint: |
      $t(\gamma(\lambda)) = \lambda - \lambda^3 = \lambda(1-\lambda)(1+\lambda)$.
    explanation: |
      $\lambda-\lambda^3 = 0$ at $\lambda = -1,0,1$: three events, all simultaneous. Its time content $(t\circ\gamma)' = 1-3\lambda^2$ is negative for $|\lambda| > 1/\sqrt3$, so the curve runs back in time there: not a worldline.

  - type: mcq
    id: cube-not-worldline
    title: Once per slice is not enough
    prompt: |
      In a chart $(x^0,x^1)$ with $x^0 = t$ (absolute time), the curve $\gamma(\lambda) = (\lambda^3,\ 0)$ meets each slice $t = c$ exactly once (at $\lambda = c^{1/3}$). Is it a worldline, i.e. is $(t\circ\gamma)'(\lambda) > 0$ for every $\lambda$?
    options:
      - text: 'No: $(t\circ\gamma)'' = 3\lambda^2$ vanishes at $\lambda = 0$'
        correct: true
      - text: 'Yes: it meets each slice once, which is what a worldline means'
        feedback: |
          Meeting each slice at most once follows from the definition, but the definition asks more: a velocity with strictly positive time content at **every** parameter. At $\lambda = 0$ the velocity is the zero vector, which is spatial, not future directed.
      - text: 'Yes: $t\circ\gamma = \lambda^3$ is strictly increasing'
        feedback: |
          Strictly increasing does not mean positive derivative: $\lambda^3$ increases everywhere yet has derivative $0$ at $\lambda = 0$. There the curve's velocity is zero and the clock stands still along it.
    explanation: |
      $(t\circ\gamma)'(0) = 0$: the velocity at $\lambda = 0$ is the zero vector, so the curve momentarily "stops in time". The definition demands $(t\circ\gamma)' > 0$ everywhere, which also guarantees a nonzero velocity. Compare $\lambda+\lambda^3$, whose derivative $1+3\lambda^2$ is always positive.

  - type: text
    id: newton-one
    title: 'Newton I: free particles define straight'
    body: |
      Recall: a connection $\nabla$ gives each curve an **acceleration** $a_\gamma := \nabla_{v_\gamma}v_\gamma$, with components
      $$a^k_\gamma = \ddot\gamma^k + \Gamma^k_{ji}\,\dot\gamma^i\dot\gamma^j,$$
      where $\Gamma^k_{ji}$ are the connection coefficients (last lower index = direction).

      A **force** on the particle is a **spatial** vector field $\mathcal{F}_\gamma$ along its worldline.

      **Newton I.** If no force acts, the worldline is an autoparallel with zero acceleration:
      $$\nabla_{v_\gamma}v_\gamma = 0.$$

      This is not just a special case of the next axiom. It is a **measurement prescription**: we watch free particles and declare their worldlines straight, and this fixes $\nabla$. **Gravity is not a force**: a falling apple is free, and gravity is encoded in $\nabla$. This works on spacetime, not on space: a slow and a fast ball thrown from one point in the same direction bend differently, and only in spacetime does the speed tilt the initial direction.

  - type: mcq
    id: satellite
    title: What pushes the satellite?
    prompt: |
      In the Newtonian spacetime picture, forces are spatial vector fields $\mathcal{F}_\gamma$, and with no force a worldline satisfies $\nabla_{v_\gamma}v_\gamma = 0$ (Newton I). A satellite orbits the Earth with its engines off, in vacuum. Which force acts on it?
    options:
      - text: 'None: its worldline is an autoparallel of $\nabla$, and gravity lives in $\nabla$'
        correct: true
      - text: 'The gravitational force $GMm/r^2$ toward the Earth'
        feedback: |
          That is the old picture, with gravity on the force side. Here gravity sits in the connection: the curved orbit in space is a straight worldline in spacetime. A force would have to be detected as a deviation from free fall, and there is none.
      - text: 'A centripetal force keeping it on the circle'
        feedback: |
          "Centripetal" is not a separate force but the name of whatever supplies the circular acceleration. Here the orbit has $a_\gamma = 0$: nothing needs to supply anything.
    explanation: |
      Newton I is a definition by measurement: free particles, falling satellites included, trace the autoparallels, and they **define** $\nabla$. An accelerometer on the satellite reads zero, in agreement with $a_\gamma = 0$.

  - type: text
    id: newton-two
    title: 'Newton II: forces as deviations'
    body: |
      **Newton II.** If a force $\mathcal{F}_\gamma$ acts on a particle of mass $m$, its worldline satisfies
      $$a_\gamma = \frac{\mathcal{F}_\gamma}{m}.$$
      So forces are measured as **deviations** from the autoparallels that Newton I defined: first the free particles fix $\nabla$, then $\nabla$ gives every other worldline an acceleration, and $m$ times it is the force.

      Now a catch. Forces are spatial, so Newton II demands a spatial acceleration:
      $$(dt)_{\gamma(\lambda)}\big(a_\gamma(\lambda)\big) = 0.$$
      But $a_\gamma$ depends on how the path is parametrized. Which parametrizations make it spatial?

  - type: mcq
    id: newton-one-why
    title: Why two axioms?
    prompt: |
      Newton II says $a_\gamma = \mathcal{F}_\gamma/m$ with $a_\gamma = \nabla_{v_\gamma}v_\gamma$; Newton I says free particles satisfy $\nabla_{v_\gamma}v_\gamma = 0$. Why is Newton I not merely the case $\mathcal{F}_\gamma = 0$ of Newton II?
    options:
      - text: 'Newton II needs $\nabla$ to compute $a_\gamma$; Newton I is how $\nabla$ is measured, from free particles'
        correct: true
      - text: 'It is merely that case; stating it separately is tradition'
        feedback: |
          Newton II presupposes a known $\nabla$. Without a rule fixing $\nabla$, any worldline could be called free by choosing a connection that makes it straight. Newton I supplies that rule.
      - text: 'Because Newton I also covers massless particles'
        feedback: |
          Worldlines here belong to particles with $m > 0$. The difference is logical, not about mass: one axiom defines $\nabla$, the other uses it.
    explanation: |
      Order matters: observe free particles, read off $\nabla$ (Newton I); then measure forces on any other particle as $m\,a_\gamma$ (Newton II). Gravity never appears as a force because it was absorbed into $\nabla$ at the first step.

  - type: build
    id: build-tau-prime
    title: Time content of the velocity
    prompt: |
      Along a worldline $\gamma$ write $\tau := t\circ\gamma$, the absolute time as a function of the parameter $\lambda$. In a chart, $(dt) = \mathtt{t}_k\,dx^k$ with component functions $\mathtt{t}_k := \partial x_k\lfloor t\rceil$, and the velocity has components $\dot\gamma^k$. Since $\tau'(\lambda) = (dt)_{\gamma(\lambda)}(v_\gamma(\lambda))$, build $\tau'$ (sum over $k$, the $\mathtt{t}_k$ evaluated at $\gamma(\lambda)$).
    prefix: '\tau''(\lambda) ='
    tiles: ['\mathtt{t}_k', '\dot\gamma^k', '\ddot\gamma^k', '\Gamma^k_{ji}', '\mathtt{t}^k']
    answers:
      - ['\mathtt{t}_k', '\dot\gamma^k']
      - ['\dot\gamma^k', '\mathtt{t}_k']
    wrong:
      - { answer: ['\mathtt{t}_k', '\ddot\gamma^k'], feedback: 'A covector eats the vector it acts on: $(dt)$ acts on the **velocity**, whose components are $\dot\gamma^k$. The second derivatives appear only in $\tau''''$.' }
      - { answer: ['\mathtt{t}^k', '\dot\gamma^k'], feedback: 'Covector components carry a lower index and pair with an upper vector index. An upper $\mathtt{t}^k$ would need a metric to raise it, and a Newtonian spacetime has none.' }
    hint: |
      A covector acts on a vector by pairing components: $\mathsf{X}(\mathcal{Y}) = \mathtt{x}_ky^k$.
    explanation: |
      $$\tau' = \mathtt{t}_k\,\dot\gamma^k > 0,$$
      positive because the worldline is future directed.

  - type: build
    id: build-uniform-sub
    title: Where uniform flow enters
    prompt: |
      Differentiating $\tau' = \mathtt{t}_k\dot\gamma^k$ by the product and chain rules gives
      $$\tau'' = \dot\gamma^i\,\partial x_i\lfloor\mathtt{t}_k\rceil\,\dot\gamma^k + \mathtt{t}_k\ddot\gamma^k.$$
      Uniform flow, $\nabla dt = 0$, reads in components $\partial x_i\lfloor\mathtt{t}_k\rceil - \Gamma^j_{ki}\mathtt{t}_j = 0$ (last lower index of $\Gamma$ = direction). Build the replacement for $\partial x_i\lfloor\mathtt{t}_k\rceil$.
    prefix: '\partial x_i\lfloor\mathtt{t}_k\rceil ='
    tiles: ['\Gamma^j_{ki}', '\Gamma^k_{ji}', '\mathtt{t}_j', '\mathtt{t}_k', '-']
    answers:
      - ['\Gamma^j_{ki}', '\mathtt{t}_j']
      - ['\mathtt{t}_j', '\Gamma^j_{ki}']
    wrong:
      - { answer: ['-', '\Gamma^j_{ki}', '\mathtt{t}_j'], feedback: 'Move the term across the equals sign: $\partial x_i\lfloor\mathtt{t}_k\rceil - \Gamma^j_{ki}\mathtt{t}_j = 0$ gives a plus.' }
      - { answer: ['\Gamma^k_{ji}', '\mathtt{t}_k'], feedback: 'Here $k$ is a free lower index on the left, so it must stay a lower index on the right; the summed index $j$ pairs the upper index of $\Gamma$ with $\mathtt{t}_j$.' }
    hint: |
      Solve the uniform-flow equation for the derivative term.
    explanation: |
      $$\partial x_i\lfloor\mathtt{t}_k\rceil = \Gamma^j_{ki}\,\mathtt{t}_j,$$
      so the first term of $\tau''$ becomes $\Gamma^j_{ki}\mathtt{t}_j\dot\gamma^i\dot\gamma^k$: the derivatives of $\mathtt{t}_k$ turn into connection coefficients.

  - type: order
    id: order-tau-dd
    title: The time content of the acceleration
    prompt: |
      Along a worldline $\gamma$ with $\tau := t\circ\gamma$ and $(dt) = \mathtt{t}_k\,dx^k$, put the derivation of $\tau'' = (dt)(a_\gamma)$ in order (the acceleration has components $a^j = \ddot\gamma^j + \Gamma^j_{ki}\dot\gamma^k\dot\gamma^i$).
    steps:
      - |
        $\tau' = \mathtt{t}_k\dot\gamma^k$ (the differential acts on the velocity)
      - |
        Product and chain rules: $\tau'' = \dot\gamma^i\,\partial x_i\lfloor\mathtt{t}_k\rceil\,\dot\gamma^k + \mathtt{t}_k\ddot\gamma^k$
      - |
        Uniform flow: $\tau'' = \Gamma^j_{ki}\mathtt{t}_j\dot\gamma^i\dot\gamma^k + \mathtt{t}_k\ddot\gamma^k$
      - |
        Rename $k\to j$ in the last term and factor: $\tau'' = \mathtt{t}_j\big(\ddot\gamma^j + \Gamma^j_{ki}\dot\gamma^k\dot\gamma^i\big)$
      - |
        The bracket is $a^j$: $\tau'' = (dt)(a_\gamma)$
    hint: |
      Start from the first derivative, differentiate, substitute, then recognize the acceleration.
    explanation: |
      $$\tau''(\lambda) = (dt)_{\gamma(\lambda)}\big(a_\gamma(\lambda)\big).$$
      The time content of the acceleration is just the second derivative of absolute time along the worldline.

  - type: mcq
    id: uniform-essential
    title: Without uniform flow
    prompt: |
      Along a worldline $\gamma$ with $\tau := t\circ\gamma$, the identity $\tau'' = (dt)(a_\gamma)$ was derived using uniform flow, $\nabla dt = 0$. In a spacetime where $t$ does not flow uniformly, what changes?
    options:
      - text: '$\tau''''$ gains an extra term $(\nabla_{v_\gamma}dt)(v_\gamma)$, so a spatial acceleration no longer means $\tau'''' = 0$'
        correct: true
      - text: 'Nothing: the identity follows from the chain rule alone'
        feedback: |
          The chain rule gives $\partial x_i\lfloor\mathtt{t}_k\rceil$; turning it into $\Gamma^j_{ki}\mathtt{t}_j$, which is what builds $a_\gamma$, is exactly uniform flow. Without it a leftover term remains.
      - text: 'The velocity stops being future directed'
        feedback: |
          Being future directed is about $\tau' = (dt)(v_\gamma) > 0$ and involves no connection at all. Uniform flow enters only at the second derivative.
    explanation: |
      In general,
      $$\tau'' = (dt)(a_\gamma) + (\nabla_{v_\gamma}dt)(v_\gamma).$$
      Uniform flow kills the second term. Without it, spatial accelerations would no longer single out a clean family of parametrizations.

  - type: text
    id: affine
    title: 'Spatial acceleration means: the clock ticks evenly'
    body: |
      With uniform flow, $\tau'' = (dt)(a_\gamma)$. Hence $a_\gamma$ is spatial if and only if $\tau'' = 0$, i.e.
      $$\tau(\lambda) = c_1\lambda + c_2,$$
      with $c_1 = \tau' > 0$. The parameter **is** absolute time, up to a choice of units ($c_1$) and of origin ($c_2$). In any other parametrization $a_\gamma$ has a time component that no spatial force can match, and Newton II fails.

      So we choose $c_1 = 1$, $c_2 = 0$: every worldline is **parametrized by absolute time**, $\lambda\equiv t$. Then the time part of Newton II holds automatically.

  - type: numeric
    id: hook-number
    title: The time content of the second clock
    prompt: |
      In a chart $(x^0,\dots,x^3)$ with $x^0 = t$ (absolute time) and all connection coefficients zero, a ball at rest is described by $\gamma_B(\lambda) = (\lambda+\lambda^3,0,0,0)$. Using $\tau'' = (dt)(a_\gamma)$ with $\tau := t\circ\gamma_B$, compute $(dt)(a_{\gamma_B})$ at $\lambda = 2$.
    answer: 12
    wrong:
      - { value: 0, feedback: 'The ball is at rest in space, but this clock is uneven: $\tau = \lambda+\lambda^3$ has $\tau'''' = 6\lambda$, not zero.' }
      - { value: 13, feedback: 'That is $\tau''(2) = 1+3\cdot4$, the time content of the **velocity**. Differentiate once more.' }
    hint: |
      $\tau(\lambda) = \lambda+\lambda^3$; differentiate twice.
    explanation: |
      $\tau' = 1+3\lambda^2$, $\tau'' = 6\lambda = 12$ at $\lambda = 2$. A nonzero time content: the acceleration of $\gamma_B$ is not spatial.

  - type: mcq
    id: which-params
    title: Which clocks are allowed?
    multiple: true
    prompt: |
      A particle's path is traced with absolute time along it given by $\tau := t\circ\gamma$. A parametrization can obey Newton II only if it is a worldline ($\tau' > 0$ everywhere) with spatial acceleration, and with uniform flow $(dt)(a_\gamma) = \tau''$. Which of these $\tau(\lambda)$ qualify?
    options:
      - text: '$\tau(\lambda) = 3\lambda+2$'
        correct: true
      - text: '$\tau(\lambda) = \lambda$'
        correct: true
      - text: '$\tau(\lambda) = e^\lambda$'
        feedback: |
          $\tau' = e^\lambda > 0$, so it is a worldline, but $\tau'' = e^\lambda\neq0$: the acceleration has a time component.
      - text: '$\tau(\lambda) = -2\lambda+1$'
        feedback: |
          Affine, so $\tau'' = 0$, but $\tau' = -2 < 0$: the curve runs backward in time, so it is not a worldline. The constant $c_1$ must be positive.
      - text: '$\tau(\lambda) = \lambda+\lambda^3$'
        feedback: |
          A worldline ($\tau' = 1+3\lambda^2 > 0$), but $\tau'' = 6\lambda$ is nonzero away from $\lambda = 0$.
    explanation: |
      Allowed: $\tau = c_1\lambda + c_2$ with $c_1 > 0$. $3\lambda+2$ is absolute time in other units ($\lambda = (t-2)/3$); $\lambda$ itself is the standard choice $\lambda\equiv t$.

  - type: mcq
    id: trap-time-force
    title: A force in the time direction?
    prompt: |
      In a chart with $x^0 = t$ and all connection coefficients zero, the ball at rest described by $\gamma_B(\lambda) = (\lambda+\lambda^3,0,0,0)$ has acceleration $(6\lambda,0,0,0)$. A student says: "then a force $m(6\lambda,0,0,0)$ along the time direction acts on it". What is wrong?
    options:
      - text: 'Forces are spatial, $(dt)(\mathcal{F}_\gamma) = 0$; the time component comes from the uneven parametrization, which Newton II simply excludes'
        correct: true
      - text: 'Nothing: the ball is pushed forward in time'
        feedback: |
          The same ball, described by $\gamma_A(\lambda) = (\lambda,0,0,0)$, has zero acceleration. A physical force cannot appear or vanish by relabelling the parameter; this "force" lives only in the bookkeeping.
      - text: 'The acceleration is wrong: a ball at rest has $a = 0$ in every parametrization'
        feedback: |
          The computation is right: with all $\Gamma = 0$, $a^0 = \ddot\gamma^0 = 6\lambda$. Acceleration depends on the parametrization, not only on the path.
    explanation: |
      Same path, different clocks: $\gamma_A$ and $\gamma_B$ differ only in how fast the parameter runs. Since forces are spatial by definition, the only consistent reading is that Newton II holds for the absolute-time parametrization $\gamma_A$ and is not even applicable to $\gamma_B$.

  - type: text
    id: chart-split
    title: Newton II in a chart where x⁰ is t
    body: |
      Take a chart with $\mathscr{X}^0 = t$ and parametrize by absolute time, $\lambda\equiv t$. Indices: Latin $i,j,k\in\{0,1,2,3\}$, Greek $\alpha,\beta,\delta\in\{1,2,3\}$. Then $\gamma^0(t) = t$, so
      $$\dot\gamma^0 = 1,\quad \ddot\gamma^0 = 0.$$
      Write $f^k_\gamma := (dx^k)(\mathcal{F}_\gamma)$ for the force components. Newton II reads
      $$\ddot\gamma^k + \Gamma^k_{ji}\dot\gamma^i\dot\gamma^j = f^k_\gamma/m.$$
      Recall: in such a chart $\mathtt{t}_k = (1,0,0,0)$, and uniform flow means $\Gamma^0_{ji} = 0$ for all $j,i$.

  - type: mcq
    id: temporal-part
    title: The time component
    prompt: |
      In a chart with $\mathscr{X}^0 = t$ and the worldline parametrized by $t$ (so $\gamma^0(t) = t$), Newton II's $k = 0$ component is $\ddot\gamma^0 + \Gamma^0_{ji}\dot\gamma^i\dot\gamma^j = f^0_\gamma/m$, with $f^0_\gamma := (dx^0)(\mathcal{F}_\gamma)$. What does it say?
    options:
      - text: '$0 = 0$: it carries no information'
        correct: true
      - text: 'It fixes the time component of the force'
        feedback: |
          $f^0_\gamma = (dx^0)(\mathcal{F}_\gamma) = (dt)(\mathcal{F}_\gamma) = 0$, since forces are spatial. Nothing is left to fix.
      - text: 'It is the energy equation of the particle'
        feedback: |
          Each term vanishes on its own: $\ddot\gamma^0 = 0$ because $\gamma^0(t) = t$, $\Gamma^0_{ji} = 0$ by uniform flow, $f^0_\gamma = 0$ because forces are spatial. No dynamics remains.
    explanation: |
      $\ddot\gamma^0 = 0$ (parameter = absolute time), $\Gamma^0_{ji} = 0$ (uniform flow), $f^0_\gamma = 0$ (forces spatial). All the physics sits in the three spatial components.

  - type: build
    id: build-two-gamma
    title: Splitting the spatial sum
    prompt: |
      For a spatial index $\alpha$, split $\Gamma^\alpha_{ji}\dot\gamma^i\dot\gamma^j$ over $j,i\in\{0\}\cup\{1,2,3\}$, with $\dot\gamma^0 = 1$. The terms with exactly one time index are $\Gamma^\alpha_{0\beta}\dot\gamma^\beta + \Gamma^\alpha_{\beta0}\dot\gamma^\beta$ (sum over $\beta$). The connection is torsion-free, $\Gamma^\alpha_{\beta0} = \Gamma^\alpha_{0\beta}$. Build their sum.
    prefix: '\Gamma^\alpha_{0\beta}\dot\gamma^\beta + \Gamma^\alpha_{\beta0}\dot\gamma^\beta ='
    tiles: ['2', '\Gamma^\alpha_{0\beta}', '\dot\gamma^\beta', '0', '\Gamma^\alpha_{00}']
    answers:
      - ['2', '\Gamma^\alpha_{0\beta}', '\dot\gamma^\beta']
      - ['2', '\dot\gamma^\beta', '\Gamma^\alpha_{0\beta}']
    wrong:
      - { answer: ['0'], feedback: 'Torsion-free means the two coefficients are **equal** (their difference is the torsion), so the terms add, they do not cancel.' }
      - { answer: ['\Gamma^\alpha_{0\beta}', '\dot\gamma^\beta'], feedback: 'Both orderings $(j,i) = (0,\beta)$ and $(\beta,0)$ appear in the double sum; with equal coefficients they give the term twice.' }
    hint: |
      Torsion-free: swapping the two lower indices does not change the coefficient.
    explanation: |
      $$2\,\Gamma^\alpha_{0\beta}\dot\gamma^\beta.$$
      The other pieces: both indices time gives $\Gamma^\alpha_{00}\cdot1\cdot1$, both spatial gives $\Gamma^\alpha_{\beta\delta}\dot\gamma^\beta\dot\gamma^\delta$. Altogether:
      $$\begin{aligned}\ddot\gamma^\alpha &+ \Gamma^\alpha_{\beta\delta}\dot\gamma^\beta\dot\gamma^\delta + 2\Gamma^\alpha_{0\beta}\dot\gamma^\beta\\ &+ \Gamma^\alpha_{00} = f^\alpha_\gamma/m.\end{aligned}$$

  - type: numeric
    id: free-at-rest
    title: Released from rest
    prompt: |
      In a chart with $\mathscr{X}^0 = t$, a free particle ($f^\alpha_\gamma = 0$), parametrized by $t$, obeys
      $$\begin{aligned}\ddot\gamma^\alpha &+ \Gamma^\alpha_{\beta\delta}\dot\gamma^\beta\dot\gamma^\delta + 2\Gamma^\alpha_{0\beta}\dot\gamma^\beta\\ &+ \Gamma^\alpha_{00} = 0\end{aligned}$$
      ($\alpha,\beta,\delta\in\{1,2,3\}$). At an instant it is at rest in the chart ($\dot\gamma^\beta = 0$), at an event where $\Gamma^1_{00} = 9.8$. What is $\ddot\gamma^1$ there?
    answer: -9.8
    wrong:
      - { value: 9.8, feedback: 'Mind the side: $\Gamma^1_{00}$ sits on the left with $\ddot\gamma^1$, so moving it across gives a minus.' }
      - { value: 0, feedback: 'At rest kills the terms with $\dot\gamma^\beta$, but $\Gamma^1_{00}$ multiplies $\dot\gamma^0\dot\gamma^0 = 1$, which never vanishes.' }
    explanation: |
      $\ddot\gamma^1 = -\Gamma^1_{00} = -9.8$: a free particle released from rest accelerates, like a stone dropped near the ground with $g = 9.8$. No force acts; the connection does it. Terms in $\Gamma^\alpha_{00}$ look like gravity, terms in $\Gamma^\alpha_{0\beta}\dot\gamma^\beta$ (linear in velocity) like a Coriolis force; both will be identified later in this level.

  - type: mcq
    id: hook-return
    title: Back to the two clocks
    prompt: |
      In a chart $(x^0,\dots,x^3)$ with $x^0 = t$ and all connection coefficients zero, a ball at rest is described by $\gamma_A(\lambda) = (\lambda,0,0,0)$ and by $\gamma_B(\lambda) = (\lambda+\lambda^3,0,0,0)$, the same path. Which statement is right?
    options:
      - text: 'Both are worldlines, but only $\gamma_A$ has spatial (here zero) acceleration, so only $\gamma_A$ obeys the axioms'
        correct: true
      - text: '$\gamma_B$ is not a worldline'
        feedback: |
          $\tau' = 1+3\lambda^2 > 0$ for every $\lambda$: it is future directed. (It is $\lambda^3$ alone that fails, at $\lambda = 0$.) The problem with $\gamma_B$ is its acceleration, not its velocity.
      - text: 'Both obey Newton I, since they trace a straight path'
        feedback: |
          Newton I asks for $\nabla_{v_\gamma}v_\gamma = 0$, a property of the parametrized curve. $\gamma_B$ has $a = (6\lambda,0,0,0)\neq0$.
    explanation: |
      $\tau'' = (dt)(a_\gamma)$: $\gamma_A$ has $\tau'' = 0$, $\gamma_B$ has $\tau'' = 6\lambda$. Newton's axioms pick out, among all parametrizations of a path, those by absolute time: the clock of Newtonian physics is built into the axioms.

  - type: text
    id: summary
    body: |
      **Next:** charts whose time coordinate is absolute time. They have a name (stratified), they exist around every event, and changing from one to another can create or remove the $\Gamma$-terms of Newton II: the origin of pseudo-forces.
