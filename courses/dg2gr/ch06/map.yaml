outroTitle: Chapter 6 in one picture
outro: |
  Read it top to bottom. Derivatives of **components** change with the chart, because the transition map has second derivatives. A **connection** fixes this; it obeys five rules, with the product rule
  $$\nabla_{\mathcal{X}_p}(g\mathcal{Y}) = \mathcal{X}_p(g)\mathcal{Y}_p + g(p)\nabla_{\mathcal{X}_p}\mathcal{Y},$$
  and a manifold with one is an **affine manifold**. In a chart it is $d^3$ **coefficients**
  $$(\Gamma_\mathscr{X})^i_{jk} := dx^i\lceil\nabla_{\partial x_k}\partial x_j\rfloor,$$
  assembled by the $\pm\Gamma$ rule:
  $$(\nabla_\mathcal{X}\mathcal{Y})^k = \mathcal{X}\lfloor\tilde x^k\rceil + \Gamma^k_{ji}\tilde x^jx^i,$$
  $$(\nabla_\mathcal{X}\mathsf{X})_k = \mathcal{X}\lfloor\mathtt{x}_k\rceil - \Gamma^j_{ki}\mathtt{x}_jx^i.$$
  They change with an extra symmetric term, so $\Gamma$ is not a tensor:
  $$\begin{aligned}(\Gamma_\mathscr{Y})^i_{jk} &= \frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^s}\frac{\partial^2\mathscr{X}^s}{\partial\mathscr{Y}^k\partial\mathscr{Y}^j}\\ &\quad + (\text{tensor law of }\Gamma_\mathscr{X}).\end{aligned}$$
  Along a curve, **parallel transport** and **autoparallels** solve
  $$\dot z^k + \Gamma^k_{ji}z^j\dot\gamma^i = 0,$$
  $$\ddot\gamma^k + \Gamma^k_{ji}\dot\gamma^i\dot\gamma^j = \text{ᚱ}\,\dot\gamma^k.$$
  Two tensors characterize $\nabla$. The **torsion**, built with the **commutator**, is the antisymmetric part of $\Gamma$:
  $$\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}.$$
  The **Riemann curvature** measures the loop mismatch of transport, and **Ricci** is its contraction:
  $$\begin{aligned}\mathrm{Riem}^i_{jkm} &= \partial x_k\lfloor\Gamma^i_{jm}\rceil - \partial x_m\lfloor\Gamma^i_{jk}\rceil\\ &\quad + \Gamma^i_{nk}\Gamma^n_{jm} - \Gamma^i_{nm}\Gamma^n_{jk},\end{aligned}$$
  $$\mathrm{Ric}_{ab} = \mathrm{Riem}^m_{amb}.$$
  Both vanish exactly when some chart around each point has all $\Gamma = 0$.

  **Next: the Level Challenge.** Harder problems that combine the whole map. Under $\nabla^{\mathrm{W}}$, where the radial and angular unit fields are declared constant, which curves are the straightest ones: circles, rays, or spirals?
