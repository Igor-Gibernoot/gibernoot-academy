id: ch01-challenge
title: 'Level Challenge: The Electric Bicycle'
kind: challenge
cards:
  - type: text
    id: hook
    body: |
      **Level challenge: one machine, five problems.** The machine is an **electric bicycle**: a bicycle with a battery and a small motor that helps your legs. You will use what you met in this level: sizes, energy, tradeoffs and feedback.

      Typical (made-up but plausible) numbers for this bike:

      | Part | Value |
      |---|---|
      | Frame mass | $3$ kg |
      | Frame paint area | $0.8\ \mathrm{m^2}$ |
      | Battery | $500$ Wh |
      | Motor, electric power drawn | $250$ W |
      | Motor, useful power at the wheel | $200$ W |

      **Guessing is the point.** If you do not know how to start, guess, then check your guess against the numbers. A wrong guess teaches more than no guess.

  - type: widget
    id: sizes-ruler
    widget: log-ruler
    review: false
    config:
      min: -4
      max: 7
      unit: m
      decadeCount: true
      items:
        - { label: bike length, value: 1.8 }
        - { label: spoke thickness, value: 2.0e-3, fixed: false }
        - { label: distance ridden in a year, value: 3.0e6, fixed: false }
    body: |
      **Problem 1: sizes.** A ruler where each tick is ten times the one before. Place two guesses: the **thickness of one spoke** of the wheel (a spoke is one of the thin metal rods joining the hub to the rim) and the **total distance a commuter rides in a year**. Select a chip, drag it onto the ruler, then press Check.

  - type: numeric
    id: yearly-distance
    prompt: |
      A commuter rides the bicycle at $5$ m/s for $40$ minutes a day, on $250$ days a year. How far is that in a year, in **kilometres**?
    answer: 3000
    tolerance: 30
    answerText: '3000'
    wrong:
      - { value: 50, feedback: 'That is in kilometres per day with the minutes not converted: $5 \times 40 \times 250$ mixes metres per second with minutes. Convert $40$ min to seconds first ($2400$ s).' }
      - { value: 3000000, feedback: 'That is the right distance but in **metres**. The question asks for kilometres: divide by $1000$.' }
    hint: |
      Distance is speed times time. Put the time in seconds, multiply by the number of days, then convert metres to kilometres.
    explanation: |
      One day: $5\ \mathrm{m/s} \times 2400\ \mathrm{s} = 12\,000$ m $= 12$ km. A year: $12 \times 250 = 3000$ km. That is $3\times10^{6}$ m, about the width of a continent, from a modest daily ride.

  - type: numeric
    id: scaled-frame-mass
    prompt: |
      A bicycle frame made of steel tube has mass $3$ kg and a paint area of $0.8\ \mathrm{m^2}$. A giant version is built from the same steel with **every length doubled** (tube length, tube width, wall thickness). What is the giant frame's mass, in kg?
    answer: 24
    tolerance: 0.1
    answerText: '24'
    wrong:
      - { value: 6, feedback: 'You doubled the mass, as if only one length grew. Doubling **every** length makes the frame $2$ times longer, $2$ times wider and $2$ times thicker: three factors of $2$.' }
      - { value: 12, feedback: 'You used $2^2 = 4$, which is how an **area** grows (the paint). Mass follows the **volume** of steel, which grows by $2 \times 2 \times 2$.' }
    hint: |
      Mass is the amount of steel, so think about how a volume changes when each of its three lengths is doubled.
    explanation: |
      Volume (and with the same steel, mass) grows as $2\times2\times2 = 2^3 = 8$, so $3 \times 8 = 24$ kg. The paint area grows as $2^2 = 4$: $0.8 \times 4 = 3.2\ \mathrm{m^2}$.

  - type: mcq
    id: scaled-frame-why
    prompt: |
      A steel tube carries a load in proportion to its **cross-section** (the area of steel you would see if you cut it across). In the giant frame, with every length doubled, the cross-section is $4$ times larger but the mass is $8$ times larger. What does this say about the giant bike?
    shuffle: false
    options:
      - text: It is twice as strong for its weight, because it is twice as big.
        feedback: |
          Bigger does not mean stronger for its weight. Strength grew by $4$, weight by $8$, so strength **per kilogram** went down, not up.
      - text: It is the same strength for its weight, because the same steel is used.
        feedback: |
          The material is the same, but the shape is scaled: strength follows an area ($k^2$), weight follows a volume ($k^3$). They grow at different rates.
      - text: It is only half as strong for its weight, so a very large frame eventually cannot carry itself.
        correct: true
    explanation: |
      Strength per weight goes as $k^2/k^3 = 1/k$: doubling the size halves it. This is why ants carry many times their own weight and elephants cannot, and why big structures need cleverer shapes, not just more of the same.

  - type: numeric
    id: battery-megajoules
    prompt: |
      **Problem 2: energy.** The battery stores $500$ Wh (watt-hours; one watt-hour is the energy used by a $1$ W device running for one hour). How many **megajoules** (MJ; $1\ \mathrm{MJ} = 10^{6}$ J) is that?
    answer: 1.8
    tolerance: 0.01
    answerText: '1.8'
    wrong:
      - { value: 0.5, feedback: 'You only changed the prefix. A watt-hour is a watt for **3600 seconds**, so convert the hour to seconds first.' }
      - { value: 1800000, feedback: 'That is the right energy in **joules**, but the question asks for megajoules: divide by $10^{6}$.' }
    hint: |
      A device using $1$ W for $1$ s uses $1$ J. How many seconds are in an hour?
    explanation: |
      $500\ \mathrm{Wh} = 500 \times 3600\ \mathrm{J} = 1\,800\,000\ \mathrm{J} = 1.8$ MJ. For comparison, a $50$ g chocolate bar holds about $1.1$ MJ, so the battery holds less than two bars of food energy, and a bar costs far less.

  - type: numeric
    id: motor-heat
    prompt: |
      The motor takes $250$ W of electric power from the battery and pushes the bicycle with $200$ W of useful power at the wheel. The rest is **not destroyed**: energy is never destroyed. How many **watts** of heat does the motor release?
    answer: 50
    tolerance: 0.5
    answerText: '50'
    wrong:
      - { value: 200, feedback: 'That is the **useful** part, the power that reaches the wheel. The question asks for the part that does *not* reach the wheel.' }
      - { value: 20, feedback: 'You took $20\%$ of $100$, or mixed up the percentage with watts. Compare the two powers directly: what goes in minus what comes out as useful push.' }
    hint: |
      Energy in each second equals useful energy plus heat each second, so subtract.
    explanation: |
      $250 - 200 = 50$ W leaves as heat, warming the motor and wires. The **efficiency** is the fraction that is useful: $200/250 = 0.8$, or $80\%$.

  - type: mcq
    id: efficiency-not-power
    prompt: |
      Motor A takes $100$ W of electric power and is $90\%$ efficient. Motor B takes $250$ W and is $80\%$ efficient. Both are fitted to the same bicycle. Which one delivers more useful power to the wheel?
    shuffle: false
    options:
      - text: Motor A, because $90\%$ is more efficient than $80\%$.
        feedback: |
          A high efficiency only says what **fraction** is useful, not how large the power is. A gets $0.9 \times 100 = 90$ W of useful power.
      - text: Motor B, with $200$ W of useful power against $90$ W.
        correct: true
      - text: They deliver the same, since both turn most of the energy into push.
        feedback: |
          Fractions of different amounts give different amounts: $0.9\times100 = 90$ W and $0.8\times250 = 200$ W.
    explanation: |
      Useful power is efficiency times the power taken in. Efficiency is a **fraction** (a number between $0$ and $1$), not a power: a very efficient small motor can still be a weak one. It matters for how long the battery lasts, not for how hard the motor can push.

  - type: widget
    id: gear-hill
    widget: tradeoff-curve
    review: false
    config:
      param: { label: Gear ratio, range: [0.5, 5], value: 1, step: 0.1, decimals: 1 }
      x: { label: Speed, unit: m/s, a: 2, range: [0, 11], decimals: 1 }
      y: { label: Pull force, unit: N, a: 100, k: -1, range: [0, 220], decimals: 0 }
      needs: { xMin: 3, yMin: 50 }
      show: { feasible: true }
      readouts: [x, y, range, verdict]
    body: |
      **Problem 3: tradeoffs.** The motor delivers $200$ W of useful power to the wheel. The **gear ratio** (a bigger number is a higher gear) picks the speed and the pulling force on the curve below. The rider is climbing a gentle hill and wants **speed at least $3$ m/s and pulling force at least $50$ N**. Slide the gear ratio, and read the readout **range**.

  - type: mcq
    id: hill-ends
    prompt: |
      A bicycle delivers $200$ W of useful power. A rider needs speed at least $3$ m/s **and** pulling force at least $50$ N. The gear ratios that work run from $1.5$ to $2.0$. Which need sets the **lowest** gear ratio ($1.5$) and which sets the **highest** ($2.0$)?
    shuffle: false
    options:
      - text: the speed need sets the lowest ratio; the force need sets the highest
        correct: true
      - text: the force need sets the lowest ratio; the speed need sets the highest
        feedback: |
          Reversed. A higher gear gives more speed and less force, so in a low gear it is the speed that falls short, and in a high gear it is the force.
      - text: the speed need sets both ends
        feedback: |
          Raising the gear only helps speed. The speed need can only fail on the low side, and the force need then takes over on the high side.
    hint: |
      In a high gear you go fast but pull weakly ($F = P/v$ with $P = 200$ W). Which need fails first at each end?
    explanation: |
      At ratio $1.5$ the speed is $3$ m/s and the force $200/3 \approx 67$ N: a lower gear and the speed drops below $3$ m/s. At ratio $2.0$ the speed is $4$ m/s and the force $200/4 = 50$ N: a higher gear and the force drops below $50$ N.

  - type: numeric
    id: battery-power-needed
    prompt: |
      A steeper hill needs speed at least $4$ m/s **and** pulling force at least $60$ N, which is $240$ W of useful power: more than the $200$ W the bicycle delivers. A stronger motor, $80\%$ efficient like the old one, is fitted to give exactly $240$ W of useful power. How many **watts** must it draw from the battery?
    answer: 300
    tolerance: 1
    answerText: '300'
    wrong:
      - { value: 192, feedback: 'You multiplied by $0.8$, but efficiency makes the motor draw **more** than it delivers, never less. Only $80\%$ of what it takes in becomes useful.' }
      - { value: 240, feedback: 'That is the useful power. The motor also wastes some as heat, so it must take in more than $240$ W.' }
    hint: |
      Useful power is $0.8$ of the power taken in. What power taken in gives $240$ W?
    explanation: |
      $0.8 \times P_{\text{in}} = 240$ W, so $P_{\text{in}} = 240/0.8 = 300$ W. The heat is $300 - 240 = 60$ W. The price: the $500$ Wh battery now lasts $500/300 \approx 1.7$ hours instead of the $2$ hours it gave at $250$ W.

  - type: widget
    id: cruise-loop
    widget: feedback-loop
    review: false
    config:
      mode: onoff
      setpoint: 5
      outside: 0
      temp0: 2
      band: 0.4
      leak: 0.2
      power: 1.4
      dt: 0.5
      duration: 60
      range: [0, 8]
      unit: m/s
      decimals: 1
      outsideRange: [-2, 0]
      setpointRange: [3, 6]
      sliders: [outside]
      readouts: [room, sensed, setpoint, error, heater]
      showSensed: true
      legend: true
      labels:
        room: Speed
        sensed: Sensed speed
        setpoint: Setpoint
        outside: Slope pull-back
        error: Error
        heater: Motor
        time: time (s)
        slideOutside: Slope pull-back (m/s)
      presets:
        - { label: Flat road, outside: 0 }
        - { label: Steep hill, outside: -1.5 }
    body: |
      **Problem 4: feedback.** The motor assist works like a **cruise control**: a **sensor** on the wheel measures the speed, and the controller compares it with a **setpoint** (the target value) of $5$ m/s. As in a thermostat, it computes the **error**
      $$e = v_{\text{set}} - v_{\text{sensed}}$$
      and switches the motor **on** when $e$ is a little positive (too slow) and **off** when it is a little negative (too fast). The blue line is the speed, the orange dashed line the $5$ m/s setpoint, the gold shading the motor being on. The slider is a **disturbance**: the stronger the pull-back, the more a slope tries to slow the bicycle. Press **Run** on the flat road, then pick **Steep hill** and run again.

  - type: numeric
    id: cruise-error
    prompt: |
      The cruise control has a setpoint of $5$ m/s. Going up the hill, its sensor reports $3.5$ m/s. The error is the setpoint minus the sensed speed. What is the error, in m/s?
    answer: 1.5
    tolerance: 0.01
    answerText: '1.5'
    wrong:
      - { value: -1.5, feedback: 'You subtracted the other way round. The error is setpoint minus sensed, $5 - 3.5$. A positive error means **too slow**, so the motor should push.' }
      - { value: 8.5, feedback: 'You added the two speeds. The error is the **gap** between what we want and what the sensor says, so subtract.' }
    hint: |
      Error is setpoint minus sensed, as for the room thermostat.
    explanation: |
      $$e = 5 - 3.5 = 1.5\ \text{m/s}.$$
      The error is positive: the bicycle is $1.5$ m/s slower than the target, so the motor goes on.

  - type: mcq
    id: hill-share
    prompt: |
      In the run on the **steep hill** the motor was on for a larger share of the time than on the flat road, yet the speed stayed near $5$ m/s in both. Why?
    shuffle: false
    options:
      - text: the motor pushes harder on the hill, because it senses the slope
        feedback: |
          The motor has one power when it is on. It never measures the slope; it only sees the **speed** fall below the target.
      - text: the hill slows the bicycle more, so the speed drops below the target sooner and the error stays positive for longer
        correct: true
      - text: the loop forgets the target on a hill, and the rider must hold it
        feedback: |
          The target stays $5$ m/s. The loop does the work of holding it, and that is its whole purpose.
    hint: |
      What does the sensor see when a slope pulls the bicycle back, and what does the loop do with that?
    explanation: |
      The loop never needs to know about the hill. A disturbance shows up only as an error (the speed falls short), and the loop answers every positive error with motor power. A steeper slope means more of the time spent with $e>0$. This is why a closed loop copes with surprises that an open loop cannot.

  - type: mcq
    id: too-strong
    prompt: |
      An engineer wants the speed to return to $5$ m/s quickly after a bump, so she makes the correction very **strong**: any small error makes the motor push with a huge power. What goes wrong?
    shuffle: false
    options:
      - text: nothing, a stronger correction always gives a better result
        feedback: |
          Stronger is faster but not always better. The loop reacts to a measurement that is a little late, so a huge push **overshoots** the target before the sensor notices.
      - text: the speed overshoots the target, then the loop over-corrects the other way, and the speed swings up and down
        correct: true
      - text: the speed settles at a lower value than the target
        feedback: |
          A weak correction can leave a gap. A too-strong one does the opposite: it does not settle at all.
    hint: |
      Remember the slow sensor and the thermostat that reached $23$ °C instead of $22$ °C.
    explanation: |
      A big push moves the speed a long way before the loop sees the result. It then pushes back equally hard, and the speed **oscillates** around the target. The tradeoff is the same one as for the thermostat: a faster reaction against stability. Good loops pick a correction strong enough to be quick and gentle enough not to swing.

  - type: mcq
    id: wrong-sensor
    prompt: |
      The wheel sensor is badly set: it always reports **$90\%$** of the true speed. The loop works perfectly on the number it reads and holds it at $5$ m/s. What is the **true** speed of the bicycle?
    shuffle: false
    options:
      - text: $4.5$ m/s, since the sensor reads low
        feedback: |
          That multiplies $5$ by $0.9$, but it is the **reading** that is $0.9$ of the truth, not the other way round. The reading is held at $5$.
      - text: $5$ m/s, because a loop always fixes its own mistakes
        feedback: |
          A loop corrects the **sensed** value. It has no other way of knowing the truth, so a wrong sensor gives a wrong result with perfect confidence.
      - text: about $5.6$ m/s, because $5 = 0.9 \times v_{\text{true}}$
        correct: true
    hint: |
      The reading is $0.9$ times the true speed, and the reading is held at $5$.
    explanation: |
      $$0.9\, v_{\text{true}} = 5 \quad\Rightarrow\quad v_{\text{true}} = \frac{5}{0.9} \approx 5.56\ \text{m/s}.$$
      A feedback loop is only as good as its sensor: it makes the **measured** error zero, not the real one.

  - type: numeric
    id: hill-range
    prompt: |
      **Problem 5: combine.** On a long climb the bicycle goes at a steady $4$ m/s and the motor draws $300$ W from the full $500$ Wh battery. How far, in **kilometres**, can it climb before the battery is empty?
    answer: 24
    tolerance: 0.2
    answerText: '24'
    wrong:
      - { value: 1.67, feedback: 'That is the **time** in hours ($500/300$). The question asks for a distance: multiply the speed by the time in seconds, then convert to km.' }
      - { value: 24000, feedback: 'That is the right distance in **metres**. The question asks for kilometres: divide by $1000$.' }
    hint: |
      Time the battery lasts is its energy divided by the power drawn. Distance is speed times time.
    explanation: |
      Time: $500\ \mathrm{Wh}/300\ \mathrm{W} = 1.67$ h $= 6000$ s. Distance: $4\ \mathrm{m/s}\times 6000\ \mathrm{s} = 24\,000$ m $= 24$ km. Two ideas met: energy divided by power gives time, and speed times time gives distance.

  - type: numeric
    id: battery-scaled
    prompt: |
      A designer builds a bigger battery of the same shape with **every length $1.2$ times larger**, with the same cells inside. The old one stored $500$ Wh. How many **Wh** does the new one store?
    answer: 864
    tolerance: 2
    answerText: '864'
    wrong:
      - { value: 600, feedback: 'You scaled the energy by $1.2$, as if only one length grew. Stored energy follows the **volume** of cells, which grows with three lengths.' }
      - { value: 720, feedback: 'You used $1.2^2 = 1.44$, the rule for **areas**. The cells fill a volume, so use three factors.' }
    hint: |
      The energy stored is proportional to how many cells fit inside: a volume.
    explanation: |
      $$E = 500 \times 1.2^3 = 500\times1.728 = 864\ \text{Wh}.$$
      The mass of the battery grows by the same $1.728$, so the bicycle gets heavier too: bigger is never free.

  - type: mcq
    id: motor-heat-trap
    prompt: |
      On the climb the motor draws $300$ W and delivers $240$ W, so it releases $60$ W of heat inside a small case. A friend says: "That heat is just energy that is gone, so it does no harm." What is really happening?
    shuffle: false
    options:
      - text: the heat is gone and does nothing, since only useful power matters
        feedback: |
          Energy is never destroyed. The $60$ W ends up as thermal energy in the motor, every second.
      - text: the motor warms up until it loses heat to the air as fast as it makes it; a hotter motor may need cooling or a power limit
        correct: true
      - text: the heat flows back to the battery and adds to the range
        feedback: |
          Heat does not turn back into stored electric energy by itself. It is a loss: spread out and no longer useful.
    hint: |
      Recall the room with the always-on heater: it stopped warming only when losses matched the supply.
    explanation: |
      The motor warms until the heat it sheds into the air equals the $60$ W it makes. If that temperature is too high, the wires and magnets suffer. The designer then adds cooling fins, a lighter load, or a power limit. Efficiency matters for the range **and** for the heat.

  - type: text
    id: rebuild-task
    body: |
      **Rebuild it: a commuter e-bike.** Use everything above to design a bicycle for a commuter. The same battery shape, frame and motor family as before. The design must meet **all** of these:

      | Need | Value |
      |---|---|
      | Range on a flat road at $5$ m/s | at least $40$ km |
      | Climbing | speed at least $4$ m/s with pulling force at least $60$ N |
      | Frame mass | at most $12$ kg |
      | Speed | held at the target by a feedback loop |

      Flat riding at $5$ m/s needs $200$ W of useful power, which the motor draws as $250$ W (it is $80\%$ efficient). The climb is occasional, so it only needs to be possible, not to last. Start from numbers, not from the drawing. **Guess first**, then check.

  - type: numeric
    id: energy-needed
    prompt: |
      Riding $40$ km at $5$ m/s takes $8000$ s, and the motor draws $250$ W the whole time. How much energy must the battery hold, in **Wh**?
    answer: 556
    tolerance: 2
    answerText: '556'
    wrong:
      - { value: 500, feedback: 'That is the energy of the old battery, not the energy the ride needs. Multiply the power drawn by the time, with the time in hours.' }
      - { value: 2000000, feedback: 'That is the energy in **joules**: $250\times8000$. The question asks for watt-hours: divide by $3600$.' }
    hint: |
      Energy equals power times time; $1$ Wh is a watt for $3600$ s.
    explanation: |
      $$E = 250\ \text{W}\times 8000\ \text{s} = 2\times10^{6}\ \text{J}$$
      Divide by $3600$ to get watt-hours:
      $$\frac{2\times10^{6}}{3600} \approx 556\ \text{Wh}$$
      The old battery holds $500$ Wh, so **the set of needs cannot be met as it stands**: it would run out after $36$ km.

  - type: mcq
    id: fix-range
    prompt: |
      The $500$ Wh battery falls short of the $556$ Wh needed. The motor keeps drawing $250$ W while riding. Which change fixes the range without breaking another need?
    shuffle: false
    options:
      - text: ride at $4$ m/s instead of $5$ m/s, to go farther
        feedback: |
          At a fixed $250$ W draw the battery lasts the same $2$ hours, so a lower speed covers **less** distance ($4\times7200 = 28.8$ km), not more.
      - text: shift the gear to a higher ratio
        feedback: |
          The gear only trades speed for force. It does not change how much energy the battery holds or how fast it is drained.
      - text: make the battery $1.1$ times larger in every length, which stores about $665$ Wh
        correct: true
    hint: |
      You need more stored energy, and stored energy scales with a volume.
    explanation: |
      $500\times1.1^3 = 665$ Wh, which is more than $556$ Wh and gives a range of about $53$ km. Merely adding $10\%$ of energy ($550$ Wh) would still fall below $556$ Wh. The price is a heavier battery, which is why the frame mass limit comes next.

  - type: numeric
    id: frame-mass
    prompt: |
      The frame is built from the same steel as the $3$ kg frame, with **every length $1.5$ times larger** to suit a taller commuter. What is its mass, in kg? (The limit is $12$ kg.)
    answer: 10.125
    tolerance: 0.05
    answerText: '10.1'
    wrong:
      - { value: 4.5, feedback: 'You scaled the mass by $1.5$, as if only one length grew. Mass follows volume: three factors of $1.5$.' }
      - { value: 6.75, feedback: 'You used $1.5^2 = 2.25$, the rule for **areas**. Mass follows volume, so use $1.5^3$.' }
    hint: |
      Mass is proportional to the volume of steel.
    explanation: |
      $$m = 3\times1.5^3 = 3\times3.375 = 10.125\ \text{kg}.$$
      This is below the $12$ kg limit. A frame $2$ times larger would weigh $24$ kg and break it.

  - type: order
    id: design-order
    prompt: |
      Put the steps of the design in a sensible order.
    steps:
      - 'Write each need as a number: range, speed, force, mass.'
      - 'Turn needs into power: useful power is force times speed, and the motor draws more by the efficiency.'
      - 'Turn power and time into energy, and size the battery with the volume rule.'
      - 'Check the mass of frame and battery against the limit, using the length-cubed rule.'
      - 'Add the sensor and the loop, and test it against disturbances such as a hill.'
    hint: |
      Numbers first, then power, then energy, then mass, and the loop last, because it works on top of a design that can already do the job.
    explanation: |
      Each step needs the one before: power needs the needs, energy needs the power, and mass needs the battery size. The loop comes last because feedback cannot add power the machine does not have: it only decides well when to use it.

  - type: mcq
    id: final-check
    prompt: |
      The proposed design has a battery $1.1$ times larger in every length ($665$ Wh), a frame $1.5$ times larger ($10.1$ kg), a speed loop, and the **old** motor: $250$ W drawn, $200$ W useful. Which need does it still fail?
    shuffle: false
    options:
      - text: the range, since $665$ Wh is not enough for $40$ km
        feedback: |
          $665$ Wh at $250$ W lasts $2.66$ h, which at $5$ m/s is about $48$ km. Range is met.
      - text: the frame mass, since $10.1$ kg is more than $3$ kg
        feedback: |
          The limit is $12$ kg, not $3$ kg. $10.1$ kg is inside it.
      - text: the climb, since $4$ m/s with $60$ N needs $240$ W of useful power and the motor gives only $200$ W
        correct: true
    hint: |
      Check each row of the table against the design, using $P = F v$ for the climb.
    explanation: |
      $60\ \mathrm{N}\times4\ \mathrm{m/s} = 240$ W of useful power, more than $200$ W, so the old motor cannot do it. A motor giving $240$ W at $80\%$ draws $300$ W, which then also heats up by $60$ W. With it, **all** needs are met: the set of needs can be satisfied, but only after the energy, scaling and efficiency checks.

  - type: text
    id: summary
    body: |
      **What you used on one bicycle.**

      - **Scaling:** multiply every length by $k$; areas (paint, the cross-section that carries a load) grow by $k^2$, volumes, masses and the energy of a battery of the same cells by $k^3$. Strength per weight goes as $1/k$.
      - **Energy:** $1\ \mathrm{Wh} = 3600$ J; a battery of $E$ Wh feeding $P$ W lasts $E/P$ hours; the range is speed times that time; useful power is $\text{efficiency} \times P_{\text{in}}$, and the rest is heat that warms the machine. Efficiency is a fraction, not a power.
      - **Tradeoff:** at fixed useful power $P = F\cdot v$, a gear slides you along the curve $F = P/v$; if the needs region misses it, relax a need or raise $P$, which draws more from the battery.
      - **Feedback:** a sensor gives $v_{\text{sensed}}$ and the loop acts on the error
        $$e = v_{\text{set}} - v_{\text{sensed}}$$
        (positive means too slow, so push). It copes with disturbances such as a hill, swings if the correction is too strong or the sensor too slow, and holds the **sensed** value, so a wrong sensor gives a wrong speed.
      - **Designing:** write the needs as numbers, then power, energy, mass, and last the loop. Check every row of the table: in the commuter design the range needed $556$ Wh, the frame $1.5\times$ longer weighed $10.1$ kg and the climb needed $240$ W of useful power ($300$ W drawn).

