id: ch01-scales
title: How Big, How Fast, How Much?
kind: concept
own: |
  - **Order of magnitude** = a factor of 10. Sizes, speeds and amounts span huge ranges, so we compare them by their power of ten: for exponents $a$ and $b$,
    {{ $$\frac{10^{a}}{10^{b}} = 10^{a-b}$$ }}
    so $10^{8}$ is a thousand times $10^{5}$. A rough guess is good if it lands within a factor of 10.
  - **Scaling a shape.** If every length of an object is multiplied by $k$, then its surface area (paint) is multiplied by $k^2$ and its volume, hence its mass for the same material, by $k^3$:
    {{ $$A \to k^{2}A, \qquad V \to k^{3}V$$ }}
  - **Unit rule of thumb.** Speeds in metres per second (m/s) and kilometres per hour (km/h) differ by the factor 3.6:
    {{ $$1\ \mathrm{m/s} = 3.6\ \mathrm{km/h}$$ }}
    so $90$ km/h is $25$ m/s.
  - **Time rule of thumb.** One year is about
    {{ $$1\ \text{year} \approx 3\times10^{7}\ \text{s}$$ }}
  - **Back of the envelope.** To estimate a total, multiply a rate by a duration (or a count by a size): with $N$ the total, $r$ the amount per unit time and $T$ the time,
    {{ $$N = r \times T$$ }}
    then keep only the power of ten and one digit. Always carry the units.
cards:
  - type: text
    id: hook
    title: Before any theory, guess
    body: |
      This whole level is a light tour: you do **not** need to know any physics yet. Here the **guess is the point**. Every question in Level 1 can be answered from common sense, and a wrong guess teaches more than a skipped question. Guess first, then see why.

      Three puzzles, no calculator:
      - how heavy is a car,
      - how fast does a passenger plane fly,
      - how many people can hang from one steel cable the width of a thumb?

  - type: mcq
    id: car-mass
    prompt: |
      About how heavy is an ordinary family car (empty, in kilograms)?
    shuffle: false
    options:
      - text: about $10$ kg
        feedback: |
          That is the weight of a small child's bicycle plus a bag. A car carries people, an engine and a steel body: it is far heavier than something you could lift.
      - text: about $100$ kg
        feedback: |
          One adult weighs about $70$ kg. A car is much heavier than one adult; picture a dozen people.
      - text: about $1000$ kg
        correct: true
      - text: about $10\,000$ kg
        feedback: |
          That is a lorry or a big bus: ten of these cars.
      - text: about $100\,000$ kg
        feedback: |
          That is a loaded freight train wagon, many times a car.
    explanation: |
      A family car has a mass of about $1000$ to $2000$ kg (small cars near $1000$, big modern ones near $2000$), so **a tonne or two**. A good way to guess: it weighs as much as about twenty adults.

  - type: mcq
    id: plane-speed
    prompt: |
      A long-haul jet airliner cruises at about $900$ kilometres per hour (km/h). In **metres per second** (m/s), which is closest?
    shuffle: false
    options:
      - text: about $2.5$ m/s
        feedback: |
          That is a slow walk. In one second the plane would barely cross a room, and it would take days to cross an ocean.
      - text: about $25$ m/s
        feedback: |
          That is a car on a motorway ($90$ km/h). The plane is ten times faster than that.
      - text: about $250$ m/s
        correct: true
      - text: about $2500$ m/s
        feedback: |
          That is a rocket. A plane at that speed would be about seven times faster than sound.
    hint: |
      A km is $1000$ m and an hour is $3600$ s, so one km/h is about a third of a metre per second.
    explanation: |
      $900$ km/h means $900\,000$ m in $3600$ s:
      $$\frac{900\,000\ \text{m}}{3600\ \text{s}} = 250\ \text{m/s}$$
      The plane covers a football pitch (about $100$ m) in less than half a second.

  - type: mcq
    id: cable
    prompt: |
      A steel cable has a width (diameter) of $1$ cm, about half a thumb. A **force** is a push or a pull. Strong steel cable wire can pull with a force of about $10^{9}$ newtons for every square metre of its cross-section before it breaks (a **newton** is the weight of a small apple). An adult weighs about $700$ N. Roughly how many adults can hang from the cable?
    shuffle: false
    options:
      - text: about $1$
        feedback: |
          Steel is far stronger than that: a thin steel wire already holds a person easily.
      - text: about $10$
        feedback: |
          Closer, but ten adults is the weight of a cable thinner than a pencil lead. A $1$ cm cable is much stronger.
      - text: about $100$
        correct: true
      - text: about $1000$
        feedback: |
          That would need a cable about $3$ cm wide. A $1$ cm cable is not that strong.
    hint: |
      The cross-section is a circle of radius $0.5$ cm $= 0.005$ m, with area $\pi r^2$. Multiply by the strength, divide by the weight of one adult.
    explanation: |
      The cross-section area is
      $$A = \pi (0.005\ \text{m})^2 \approx 8\times10^{-5}\ \text{m}^2.$$
      The breaking force is $A \times 10^{9}\ \text{N/m}^2 \approx 8\times10^{4}$ N, so
      $$\frac{8\times10^{4}\ \text{N}}{700\ \text{N}} \approx 110\ \text{adults}.$$
      Ordinary building steel is weaker (about $4\times10^{8}$ N/m$^2$) but the cable wire is much stronger than that. Real cables are used with a large safety margin, but the **power of ten** is right: a cable you can wrap round your finger holds about a hundred people. That is why engineers love steel.

  - type: text
    id: powers
    title: Orders of magnitude
    body: |
      You just did something engineers do all day: you cared about the **power of ten**, not about the exact digits.

      A **power of ten** is $10$ multiplied by itself: $10^{3} = 10\times10\times10 = 1000$. The small raised number is the **exponent** (it counts the zeros; it is *not* "times three"). A negative exponent is a fraction: $10^{-3} = 0.001$. And $3\times10^{8}$ means $3$ followed by eight zeros.

      An **order of magnitude** is a factor of $10$. We say two numbers differ by "three orders of magnitude" when one is $10^{3} = 1000$ times the other. A guess that is right within one order of magnitude is a **good** guess.

  - type: mcq
    id: orders-gap
    prompt: |
      A grain of sand is about $10^{-3}$ m wide and a flea is about $10^{-3}$ m long too, but a mouse is about $10^{-1}$ m long. How many orders of magnitude longer is the mouse than the flea?
    shuffle: false
    options:
      - text: '$2$ orders, a factor of $100$'
        correct: true
      - text: '$-2$ orders, a factor of $0.01$'
        feedback: |
          The sign is reversed: $10^{-1}$ is *bigger* than $10^{-3}$, since $0.1 > 0.001$.
      - text: '$4$ orders, a factor of $10\,000$'
        feedback: |
          You added the exponents $1 + 3$. To compare sizes subtract them: $-1 - (-3) = 2$.
      - text: '$1$ order, a factor of $10$'
        feedback: |
          That would be $10^{-1}$ against $10^{-2}$. Here the exponents are $-1$ and $-3$, two steps apart.
    explanation: |
      Compare exponents by subtracting: $-1 - (-3) = 2$. So $10^{-1}/10^{-3} = 10^{2} = 100$: the mouse is a hundred times longer.

  - type: text
    id: ruler-intro
    title: A ruler for huge ranges
    body: |
      An ordinary ruler cannot show an atom and the Earth together. A **logarithmic ruler** can: each tick is **ten times** bigger than the one before it, so the ruler stays short while the numbers grow huge.

      Next card: three sizes are placed for you (the blue dots). Place the other two by your best guess. First select a chip, then drag on the ruler. Then press **Check**. The size of an **atom** is a few ten-billionths of a metre, and the Earth's **radius** is the distance from its centre to its surface.

  - type: widget
    id: ladder
    widget: log-ruler
    review: false
    config:
      min: -11
      max: 8
      unit: m
      decadeCount: true
      items:
        - { label: atom, value: 1.0e-10, fixed: false }
        - { label: hair width, value: 1.0e-4 }
        - { label: person, value: 1.7 }
        - { label: Earth radius, value: 6.4e6, fixed: false }

  - type: numeric
    id: atom-to-hair
    prompt: |
      A hair is about $10^{-4}$ m wide and an atom about $10^{-10}$ m. By how many **orders of magnitude** (factors of $10$) is the hair wider than an atom?
    answer: 6
    wrong:
      - { value: -6, feedback: 'The sign is flipped: the hair is the bigger one, so the gap is positive.' }
      - { value: 14, feedback: 'You added the exponents $4 + 10$. Subtract them: $-4 - (-10) = 6$.' }
    hint: |
      Count the ticks between the two dots on the ruler, or subtract the exponents.
    explanation: |
      $10^{-4}/10^{-10} = 10^{-4 + 10} = 10^{6}$. A hair is about **a million** atoms wide. On the ruler it is six ticks from the atom.

  - type: order
    id: speeds
    prompt: |
      Put these motions in order, from the **slowest** to the **fastest**: a garden snail, a person walking, a car on a motorway, a passenger plane, the Earth going round the Sun.
    steps:
      - 'garden snail'
      - 'person walking'
      - 'car on a motorway'
      - 'passenger plane'
      - 'Earth going round the Sun'
    hint: |
      The Earth goes round the Sun, a loop of about $10^{12}$ m, in a year (about $3\times10^{7}$ s).
    explanation: |
      Typical speeds: snail about $10^{-3}$ m/s (a few millimetres per second), walking about $1.4$ m/s, motorway car about $30$ m/s, plane about $250$ m/s, Earth about $30\,000$ m/s. The Earth is fastest although we feel nothing: we feel **changes** of speed, not speed itself.

  - type: widget
    id: speed-ruler
    widget: log-ruler
    review: false
    config:
      min: -4
      max: 5
      unit: m/s
      reveal: true
      slider: false
      readout: false
      decadeCount: true
      items:
        - { label: snail, value: 1.0e-3 }
        - { label: walking, value: 1.4 }
        - { label: car, value: 30 }
        - { label: plane, value: 250 }
        - { label: Earth round Sun, value: 3.0e4 }

  - type: numeric
    id: water
    prompt: |
      A person drinks about $2$ litres of water a day. Over a life of $80$ years (take $365$ days in a year), about how many **litres** is that?
    answer: 58400
    tolerance: 6000
    answerText: '58400'
    wrong:
      - { value: 730, feedback: 'That is only one year: $2 \times 365$. Multiply by the number of years too.' }
      - { value: 160, feedback: 'You multiplied litres per day by years and forgot the days in a year.' }
    hint: |
      Total = litres per day $\times$ days per year $\times$ years.
    explanation: |
      Each factor has a meaning: litres per day, days in a year, number of years.
      $$2 \times 365 \times 80 = 58\,400\ \text{litres}$$
      About $6\times10^{4}$ litres, a small swimming-pool worth, if you only look at the power of ten.

  - type: mcq
    id: twice
    prompt: |
      A statue is rebuilt **twice as tall, twice as wide and twice as deep**, from the same stone. How does its mass change?
    shuffle: false
    options:
      - text: it doubles ($\times 2$)
        feedback: |
          Doubling one length would double the mass, but here all three lengths double, so the volume doubles three times over.
      - text: it becomes four times larger ($\times 4$)
        feedback: |
          Four is right for a **surface** (paint needed): two lengths doubled. Mass follows volume, which has three lengths.
      - text: it becomes eight times larger ($\times 8$)
        correct: true
      - text: it becomes six times larger ($\times 6$)
        feedback: |
          You added $2 + 2 + 2$. Sizes multiply: $2 \times 2 \times 2$.
    explanation: |
      Volume is length $\times$ width $\times$ depth, each doubled: $2\times2\times2 = 8$. The paint, which covers the **surface** (two lengths), grows only $2\times2 = 4$ times. If every length is multiplied by $k$, the area is multiplied by $k^{2}$ and the volume by $k^{3}$. This is why a giant could not simply be a scaled-up human: its weight would grow faster than the strength of its bones.

  - type: numeric
    id: kmh
    prompt: |
      A car drives at $90$ km/h. What is its speed in **metres per second** (m/s)?
    answer: 25
    tolerance: 0.5
    wrong:
      - { value: 90, feedback: 'You did not convert: $90$ km/h and $90$ m/s are very different (the second is a racing car at full speed).' }
      - { value: 324, feedback: 'You multiplied by $3.6$ instead of dividing. Metres per second is the *smaller* number.' }
    hint: |
      $1$ km $= 1000$ m and $1$ h $= 3600$ s.
    explanation: |
      $$\frac{90 \times 1000\ \text{m}}{3600\ \text{s}} = 25\ \text{m/s}$$
      Rule of thumb: $1\ \text{m/s} = 3.6\ \text{km/h}$, so divide km/h by $3.6$.

  - type: build
    id: train
    prompt: |
      A train goes $180$ km/h. Build its speed in m/s, using $1\ \text{m/s} = 3.6\ \text{km/h}$.
    prefix: 'v ='
    tiles: ['180', '3.6', '\div', '\times']
    answers:
      - ['180', '\div', '3.6']
    wrong:
      - answer: ['180', '\times', '3.6']
        feedback: 'That gives $648$, a number bigger than the km/h value. Metres per second are the larger unit of speed, so the number must be smaller.'
    explanation: |
      $180 \div 3.6 = 50$ m/s. A train at $50$ m/s covers a football pitch in about two seconds.

  - type: text
    id: year-rule
    title: A second rule of thumb
    body: |
      How many seconds in a year? $365 \times 24 \times 3600 = 31\,536\,000$. Engineers remember it as

      $$1\ \text{year} \approx 3\times10^{7}\ \text{s}$$

      (it is almost exactly $\pi \times 10^{7}$ s). Use it to estimate any long-lasting process.

  - type: numeric
    id: heart
    prompt: |
      A heart beats about $70$ times a minute. Over $80$ years, about how many beats is that, in **billions** ($10^{9}$)? (Use $1$ year $\approx 3\times10^{7}$ s, so $1$ min $= 60$ s.)
    answer: 2.9
    tolerance: 0.4
    answerText: '2.9'
    hint: |
      Beats per second is $70/60 \approx 1.2$. Multiply by the seconds in $80$ years: $80 \times 3\times10^{7}$.
    explanation: |
      Rate times duration, each with its unit:
      $$1.2\ \tfrac{\text{beats}}{\text{s}} \times 2.4\times10^{9}\ \text{s} \approx 2.8\times10^{9}\ \text{beats}.$$
      An exact calculation with $365.25$ days gives $2.9$ billion. Both agree on the power of ten, which is all a back-of-envelope estimate needs.

  - type: text
    id: summary
    body: |
      **Next:** in *Everything Costs Energy* you will estimate where the energy of a phone charge, a meal and a bike ride goes, and see why some of it always ends up as heat.
