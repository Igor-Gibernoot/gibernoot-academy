id: ch01-energy
title: Everything Costs Energy
kind: concept
own: |
  - **Energy and power.** **Energy** $E$ is the ability to make things happen (heat, move, light up); its unit is the **joule** (J). **Power** $P$ is energy per second, in **watts** (W, $1\ \text{W} = 1\ \text{J/s}$). A device of power $P$ running for a time $t$ (in seconds) uses
    {{ $$E = P\,t$$ }}
    so a $2000$ W kettle running for $180$ s uses $3.6\times10^{5}$ J.
  - **Typical energies** (orders of magnitude): a phone battery $\approx 5\times10^{4}$ J, a chocolate bar $\approx 10^{6}$ J, a litre of petrol $\approx 3\times10^{7}$ J. Energy bills use the **kilowatt-hour**: a power of $1000$ W held for one hour,
    {{ $$1\ \text{kWh} = 3.6\times10^{6}\ \text{J}$$ }}
    A kW measures power; a kWh measures energy.
  - **Efficiency.** Only part of the energy a machine takes in does the job we want. With $E_{\text{useful}}$ the useful energy out and $E_{\text{total}}$ the energy put in,
    {{ $$\text{efficiency} = \frac{E_{\text{useful}}}{E_{\text{total}}}$$ }}
    which is a number between $0$ and $1$ (or a percentage).
  - **Energy is never used up, it is moved.** The part that is not useful does not vanish: in almost every machine (a bike rider, a bulb, an engine) it ends up as **heat** spread into the surroundings:
    {{ $$E_{\text{total}} = E_{\text{useful}} + E_{\text{heat}}$$ }}
cards:
  - type: text
    id: hook
    title: Before any theory, guess
    body: |
      Remember: in Level 1 the **guess is the point**. Everything here can be answered from common sense; a wrong guess teaches more than a skipped question.

      A phone is charged and then used for hours. A chocolate bar lets you cycle for a long time. A tank of petrol moves a car for hundreds of kilometres. Something is being stored and spent in all three.

      Puzzles for this lesson:
      - how many hours could a full phone battery keep a small lamp lit,
      - where does the energy of a bike ride actually go,
      - why does a bulb that is "on" feel hot?

  - type: text
    id: words
    title: Two words to get straight
    body: |
      **Energy** is the ability to make things happen: to heat water, to move a car, to light a lamp. You cannot see it, but you can count it. Its unit is the **joule** (J): lifting a small apple ($100$ g) by one metre costs about $1$ J.

      **Power** is how *fast* energy is spent: energy per second. Its unit is the **watt** (W), and $1\ \text{W} = 1$ joule every second. A kettle is rated $2000$ W: it takes $2000$ J from the wall every second.

      If a device has power $P$ (in W) and runs for a time $t$ (in seconds), the energy it uses is
      $$E = P\,t$$
      (a rate times a duration, as in the back-of-the-envelope rule of the lesson before).

  - type: numeric
    id: kettle
    prompt: |
      A kettle has a power of $2000$ W, that is, it uses $2000$ J every second. It runs for $3$ minutes ($180$ s) to boil water. How much energy does it use, in joules?
    answer: 360000
    tolerance: 0.01
    answerText: '360000 (3.6e5)'
    wrong:
      - { value: 2000, feedback: 'That is the energy used in just one second. The kettle runs for 180 seconds.' }
      - { value: 6000, feedback: 'You multiplied the power by the minutes (2000 x 3). The rule needs seconds: 3 min = 180 s.' }
    hint: |
      Energy = power x time, with the time in seconds: $2000 \times 180$.
    explanation: |
      Every second the kettle uses $2000$ J, and it runs for $180$ s, so
      $$\begin{aligned}E &= P\,t \\ &= 2000 \times 180\ \text{J} \\ &= 3.6\times10^{5}\ \text{J}\end{aligned}$$

  - type: order
    id: sizes
    prompt: |
      Put these three stores of energy in order, from the **smallest** to the **largest** amount of energy: a full phone battery, one litre of petrol, one chocolate bar ($50$ g).
    steps:
      - 'A full phone battery'
      - 'One chocolate bar (50 g)'
      - 'One litre of petrol'
    hint: |
      Think of what each one can do: charge a phone once, keep you cycling for an hour, or drive a car about $10$ km.
    explanation: |
      Typical values (not exact): the phone battery holds about $5\times10^{4}$ J, the chocolate bar about $10^{6}$ J (a bit over a million: about $20$ phone charges), and a litre of petrol about $3\times10^{7}$ J, about thirty chocolate bars. Fuels pack a huge amount of energy into a small volume, which is why we still use them for cars and planes.

  - type: widget
    id: energy-ruler
    widget: log-ruler
    review: false
    config:
      min: 3
      max: 8
      unit: J
      reveal: true
      slider: false
      readout: false
      decadeCount: true
      items:
        - { label: phone battery, value: 5.4e4 }
        - { label: chocolate bar, value: 1.1e6 }
        - { label: litre of petrol, value: 3.4e7 }
    body: |
      The same three energies on a ruler where each tick is ten times the one before. The petrol is about $600$ times the phone battery, between two and three ticks of ruler.

  - type: numeric
    id: phone
    prompt: |
      A phone battery is labelled $15$ **watt-hours** (Wh): a power of $15$ W kept for one hour. One hour is $3600$ s. How many joules is that?
    answer: 54000
    tolerance: 0.01
    answerText: '54000 (5.4e4)'
    wrong:
      - { value: 15, feedback: 'That is the power in watts, not the energy. Multiply by the number of seconds in an hour.' }
      - { value: 900, feedback: 'You used 60 s instead of 3600 s: an hour has 60 minutes of 60 seconds each.' }
    hint: |
      Energy = power x time, with the time in seconds: $15 \times 3600$.
    explanation: |
      $$\begin{aligned}E &= P\,t \\ &= 15 \times 3600\ \text{J} \\ &= 5.4\times10^{4}\ \text{J}\end{aligned}$$
      So one watt-hour is $3600$ J, and the kilowatt-hour used on electricity bills is $1000$ times more: $1\ \text{kWh} = 3.6\times10^{6}$ J.

  - type: mcq
    id: lamp
    prompt: |
      A full phone battery holds $54\,000$ J. A small lamp uses $10$ W, that is, $10$ J every second. For about how long could the battery keep the lamp lit (if all its energy went to the lamp)?
    shuffle: false
    options:
      - text: about $1$ minute
        feedback: |
          That would be $10 \times 60 = 600$ J, about one percent of the battery. The battery holds far more.
      - text: about $15$ minutes
        feedback: |
          That would be $10 \times 900 = 9000$ J, a sixth of the battery.
      - text: about $1.5$ hours
        correct: true
      - text: about $15$ hours
        feedback: |
          That would need $10 \times 54\,000$ J, ten times the battery.
    hint: |
      Time = energy divided by power.
    explanation: |
      Energy $= P\,t$, so
      $$t = \frac{E}{P} = \frac{54\,000\ \text{J}}{10\ \text{W}} = 5400\ \text{s} = 1.5\ \text{hours}.$$
      This is the answer to the first puzzle of the lesson: a phone battery lights a small lamp for an hour and a half.

  - type: mcq
    id: bike
    prompt: |
      A cyclist's body takes about $400$ J from food every second while riding steadily. The legs turn only about $100$ J of that every second into pushing the bike forward. Where does the rest go?
    shuffle: false
    options:
      - text: It is used up and disappears.
        feedback: |
          Tempting, because we say "I burned energy". But energy is never destroyed: it only changes form. The missing $300$ J per second must be somewhere.
      - text: It is stored in the muscles, so the cyclist gets stronger.
        feedback: |
          A little energy is stored, but not $300$ J every second for an hour: the cyclist would swell. A steady ride stores almost nothing.
      - text: It becomes heat, warming the body and the air (that is why you sweat).
        correct: true
      - text: It makes the bike go faster and faster.
        feedback: |
          Speed stays about constant on a steady ride. The energy that pushes the bike is the $100$ J already counted: it goes into pushing the air out of the way.
    explanation: |
      Energy is conserved: $400\ \text{J/s}$ in $= 100\ \text{J/s}$ useful $+\ 300\ \text{J/s}$ as heat. The body is a poor engine: three quarters of what you eat on a ride warms you up, and sweating carries that heat away. This also answers the second puzzle.

  - type: text
    id: efficiency
    title: Efficiency
    body: |
      The cyclist put in $400$ J and got $100$ J of useful work. The **efficiency** of a machine is the fraction of the energy put in that does the useful job:
      $$\text{efficiency} = \frac{E_{\text{useful}}}{E_{\text{total}}}$$
      Here $E_{\text{useful}}$ is the energy that does what we want, and $E_{\text{total}}$ is all the energy the machine takes in. The cyclist's efficiency is $100/400 = 1/4$, or $25\%$. It is never above $1$, since a machine cannot give out more than it takes in.

  - type: numeric
    id: bulb
    prompt: |
      An old filament bulb takes $50$ J from the wall every second. Only $5$ J of that every second leaves as light; the rest is heat. What is the efficiency of the bulb, as a fraction (a number between $0$ and $1$)?
    answer: 0.1
    tolerance: 0.02
    answerText: '0.1 (10%)'
    wrong:
      - { value: 10, feedback: 'You divided total by useful. Efficiency is useful over total, so it cannot be above 1.' }
      - { value: 0.9, feedback: 'That is the heat fraction (45 of 50). Efficiency counts the part that is useful: the light.' }
    hint: |
      Useful (light) divided by total (taken from the wall).
    explanation: |
      $$\text{efficiency} = \frac{5\ \text{J}}{50\ \text{J}} = 0.1 = 10\%.$$
      The other $45$ J every second is heat. This answers the third puzzle: a filament bulb is mostly a small heater that glows. (These are typical numbers; a modern LED bulb turns a larger share into light.)

  - type: mcq
    id: kwh
    prompt: |
      Your electricity bill says you used $30$ kWh this month. What kind of quantity is that, and why?
    shuffle: false
    options:
      - text: A power, because it has "watt" in it.
        feedback: |
          "kWh" is watts **times hours**, power times a duration. Power times time is energy ($E = P\,t$).
      - text: 'An energy, because it is $30$ kilowatts kept for one hour, or $1$ kilowatt for $30$ hours.'
        correct: true
      - text: A speed, because "per hour" is a speed.
        feedback: |
          There is no "per" here: it is a product, "kilowatt times hour", not a ratio. A kilowatt-hour is not a rate at all.
    explanation: |
      A kilowatt-hour is a power ($1000$ W) multiplied by a time ($3600$ s), so it is an energy: $1\ \text{kWh} = 1000 \times 3600 = 3.6\times10^{6}$ J. A wall socket is not "selling power": it sells energy. A kW tells you how fast a device uses it; the kWh is the total.

  - type: mcq
    id: used-up
    prompt: |
      A bulb is switched on for an hour, then off. Which statement is correct?
    shuffle: false
    options:
      - text: The energy it took from the wall has been destroyed.
        feedback: |
          Tempting, since the bulb is "used" and the electricity meter went up. But energy is never destroyed: it was moved from the power station to the room.
      - text: The energy was moved, not lost. It is now light and heat in the room, spread so thin that we cannot get it back to do useful work.
        correct: true
      - text: The energy is stored in the bulb, which is now heavier.
        feedback: |
          A bulb weighs the same before and after. It is only a converter: energy goes through it.
    explanation: |
      Energy is **conserved**: the total never changes, it only moves and changes form. "Used up" really means "turned into heat spread over the room", which is useless for most jobs. That is why we always need new fuel, and why all machines warm their surroundings a little.

  - type: text
    id: summary
    body: |
      **Next:** a machine that watches itself and corrects its own mistakes, like a thermostat. How can a heater know when to stop?
