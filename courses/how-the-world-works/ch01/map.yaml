outroTitle: Level 1 in one picture
outro: |
  **Sizes and units** let you guess a number to within a factor of $10$. **Energy** is moved, not used up: $E = P\,t$, and the efficiency tells how much of it is useful. **Feedback** measures the result and acts on the sign of the error $e = T_{\text{set}} - T_{\text{sensed}}$, and delay makes it overshoot. **Tradeoffs** limit what can be built to a curve, such as $P = F\cdot v$. Next, the **Level Review**, then the challenge.
