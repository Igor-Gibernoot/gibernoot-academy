id: ch01-map
title: "Content Map: How the World Works, a Light Tour"
kind: map
name: Level 1, a light tour (sizes, energy, feedback, tradeoffs)
intro: |
  Remember: in Level 1 the **guess is the point**. A wrong guess here costs nothing.

  Below is the **map of Level 1**: boxes for the main ideas, arrows from an idea to one built on it. For each empty box you will pick, among look-alike cards, the one that belongs there. Each wrong card hides a mistake that many people make, and the feedback says why it tempts.

  Four families of ideas: **sizes and units**, **energy**, **feedback** and **tradeoffs**. The last box points to the later levels of the course.
cols: 3
nodes:
  - id: shape
    title: Scaling a shape
    row: 1
    col: 1
    body: |
      Multiply every length of an object by $k$: its area (paint) is multiplied by $k^{2}$ and its volume, hence its mass, by $k^{3}$.
    decoys:
      - body: |
          Multiply every length of an object by $k$: its area is multiplied by $k$ and its volume, hence its mass, by $k^{2}$.
        feedback: |
          Area has two lengths in it (width times height), so it picks up $k$ twice. Volume has three. Everything is shifted one power too low here.
      - body: |
          Multiply every length of an object by $k$: its area is multiplied by $k^{3}$ and its volume, hence its mass, by $k^{2}$.
        feedback: |
          Swapped. A surface is flat, two lengths: $k^{2}$. A solid has three lengths: $k^{3}$.
    explanation: |
      Doubling every length ($k=2$) needs $4\times$ the paint but makes the object $8\times$ heavier. This is why a giant cannot be a scaled-up human.
  - id: order
    title: Order of magnitude
    row: 1
    col: 2
    body: |
      Ten times bigger is one **order of magnitude**. To compare $10^{a}$ with $10^{b}$, subtract the exponents:
      $$\frac{10^{a}}{10^{b}} = 10^{a-b}$$
      so $10^{8}$ is $1000$ times $10^{5}$.
    decoys:
      - body: |
          Ten times bigger is one **order of magnitude**. To compare $10^{a}$ with $10^{b}$, add the exponents:
          $$10^{a}\cdot 10^{b} = 10^{a+b}$$
          so $10^{8}$ is $13$ times $10^{5}$.
        feedback: |
          Adding exponents multiplies sizes. To ask "how many times bigger" you divide, and that subtracts the exponents.
      - body: |
          Ten times bigger is one **order of magnitude**. To compare $10^{a}$ with $10^{b}$, subtract the exponents:
          $$\frac{10^{a}}{10^{b}} = 10^{a-b}$$
          so $10^{8}$ is $3$ times $10^{5}$.
        feedback: |
          The subtraction is right, $8-5=3$, but the result is an exponent: the factor is $10^{3} = 1000$, not $3$.
    explanation: |
      A good rough guess lands within a factor of $10$ of the truth. Everything else in the level is built on comparing sizes this way.
  - id: units
    title: Unit rules of thumb
    row: 1
    col: 3
    body: |
      Speeds: $1\ \mathrm{m/s} = 3.6\ \mathrm{km/h}$, so $25$ m/s is $90$ km/h. Time: one year is about $3\times10^{7}$ s.
    decoys:
      - body: |
          Speeds: $1\ \mathrm{km/h} = 3.6\ \mathrm{m/s}$, so $25$ km/h is $90$ m/s. Time: one year is about $3\times10^{7}$ s.
        feedback: |
          Upside down. A metre per second is a *fast* unit (3600 s in an hour but 1000 m in a kilometre), so the number in km/h is the bigger one.
      - body: |
          Speeds: $1\ \mathrm{m/s} = 3.6\ \mathrm{km/h}$, so $25$ m/s is $90$ km/h. Time: one year is about $10^{6}$ s.
        feedback: |
          $10^{6}$ s is only about $12$ days. A year is about $365\times 24\times 3600 \approx 3\times10^{7}$ s.
    explanation: |
      These two numbers turn almost every back-of-the-envelope estimate (a total is a rate times a duration) into a quick sum.
  - id: kwh
    title: The kilowatt-hour
    row: 2
    col: 1
    body: |
      A **kilowatt-hour** is the energy of a power of $1000$ W held for one hour:
      $$1\ \text{kWh} = 3.6\times10^{6}\ \text{J}$$
      A kW measures power; a kWh measures energy.
    decoys:
      - body: |
          A **kilowatt-hour** is a power of $1000$ W sustained over an hour:
          $$1\ \text{kWh} = 1000\ \text{W}$$
          A kWh measures how powerful a device is.
        feedback: |
          Hours times power is an *energy*, not a power. Bills charge you for energy used, not for how strong the device is.
      - body: |
          A **kilowatt-hour** is the energy of a power of $1000$ W held for one hour:
          $$1\ \text{kWh} = 3.6\times10^{3}\ \text{J}$$
          A kW measures power; a kWh measures energy.
        feedback: |
          That would be $1000$ W for only $3.6$ s. One hour is $3600$ s, so $1000\times3600 = 3.6\times10^{6}$ J.
    explanation: |
      The hour hides the factor $3600$ s. The $3.6$ that turned m/s into km/h has the same origin.
  - id: energy
    title: Energy and power
    row: 2
    col: 2
    body: |
      **Power** $P$ is energy per second (watts, $1\ \text{W} = 1\ \text{J/s}$). A device of power $P$ running for a time $t$ uses the energy $E$:
      $$E = P\,t$$
    decoys:
      - body: |
          **Power** $P$ is energy per second (watts, $1\ \text{W} = 1\ \text{J/s}$). A device of power $P$ running for a time $t$ uses the energy $E$:
          $$E = \frac{P}{t}$$
        feedback: |
          Running longer must use *more* energy, but dividing by $t$ makes it smaller. Rate times duration, never rate over duration.
      - body: |
          **Power** $P$ is energy in joules (J). A device of power $P$ running for a time $t$ uses the energy $E$:
          $$E = P\,t$$
        feedback: |
          Joules measure energy, not power. Power is how *fast* energy is spent: joules per second, the watt.
    explanation: |
      A $2000$ W kettle running for $180$ s uses $3.6\times10^{5}$ J. The unit rules of thumb tell us how to convert the time into seconds first.
  - id: pfv
    title: Speed against force
    row: 2
    col: 3
    body: |
      A machine of fixed power $P$, pulling with force $F$ at speed $v$, obeys
      $$P = F\cdot v$$
      so doubling the speed at the same power halves the force.
    decoys:
      - body: |
          A machine of fixed power $P$, pulling with force $F$ at speed $v$, obeys
          $$P = \frac{F}{v}$$
          so doubling the speed at the same power doubles the force.
        feedback: |
          Then a faster machine would pull harder for free. A bicycle shows the opposite: in a high gear, going fast, pedalling is *harder*, because the same power is shared between speed and force.
      - body: |
          A machine of fixed power $P$, pulling with force $F$ at speed $v$, obeys
          $$P = F\cdot v$$
          so doubling the speed at the same power doubles the force.
        feedback: |
          The product is fixed, so when one factor doubles the other halves. A bicycle delivering $200$ W cannot give both $4$ m/s and $60$ N: that needs $240$ W.
    explanation: |
      Energy and tradeoffs meet here: a given amount of power is a budget that can be spent on speed or on force, not on both.
  - id: moved
    title: Energy is moved, not used up
    row: 3
    col: 1
    body: |
      The part of the energy that is not useful does not vanish: it ends up as **heat** spread into the surroundings.
      $$E_{\text{total}} = E_{\text{useful}} + E_{\text{heat}}$$
    decoys:
      - body: |
          The part of the energy that is not useful is used up: it disappears, so
          $$E_{\text{total}} = E_{\text{useful}}$$
        feedback: |
          Tempting, since the energy is no longer doing the job. But it never disappears: a bulb that is "on" feels hot because most of its energy became heat.
      - body: |
          The part of the energy that is not useful is destroyed by friction and heat, so the total after is smaller:
          $$E_{\text{useful}} + E_{\text{heat}} < E_{\text{total}}$$
        feedback: |
          Friction turns movement energy into heat; it does not destroy any. Counted with the heat, the books always balance.
    explanation: |
      A cyclist takes in about $400$ W of food energy; about $100$ W moves the bike, and the other $300$ W warms the rider and the air.
  - id: efficiency
    title: Efficiency
    row: 3
    col: 2
    body: |
      With $E_{\text{useful}}$ the useful energy out and $E_{\text{total}}$ the energy put in,
      $$\text{efficiency} = \frac{E_{\text{useful}}}{E_{\text{total}}}$$
      a number between $0$ and $1$ (or a percentage).
    decoys:
      - body: |
          With $E_{\text{useful}}$ the useful energy out and $E_{\text{total}}$ the energy put in,
          $$\text{efficiency} = \frac{E_{\text{total}}}{E_{\text{useful}}}$$
          a number that can be larger than $1$ for a good machine.
        feedback: |
          Turned upside down. A machine cannot give out more useful energy than it takes in, so the useful part is always the top of the fraction.
      - body: |
          With $E_{\text{useful}}$ the useful energy out and $E_{\text{total}}$ the energy put in,
          $$\text{efficiency} = \frac{E_{\text{useful}}}{E_{\text{total}}}$$
          so the more powerful the machine, the higher its efficiency.
        feedback: |
          Efficiency compares two energies of the same machine. A weak machine can be efficient and a huge one wasteful: power and efficiency are unrelated.
    explanation: |
      A filament bulb has an efficiency of about $10\%$: of $100$ J taken in, about $10$ J becomes light and $90$ J becomes heat.
  - id: curve
    title: Tradeoff curve
    row: 3
    col: 3
    body: |
      A **tradeoff** is a pair of qualities that cannot both be improved freely. The pairs a design can reach form a **curve of achievable pairs**. For a beam of thickness $t$: strength grows like $t^{2}$, weight about like $t$.
    decoys:
      - body: |
          A **tradeoff** is a pair of qualities that can always both be improved with a better design. The pairs a design can reach fill the whole plot. For a beam of thickness $t$: strength grows like $t^{2}$, weight about like $t$.
        feedback: |
          A tradeoff is a fact about physics, not a design mistake. Not every pair is reachable: only the points on the curve.
      - body: |
          A **tradeoff** is a pair of qualities that cannot both be improved freely. The pairs a design can reach form a **curve of achievable pairs**. For a beam of thickness $t$: strength grows like $t$, weight like $t^{2}$.
        feedback: |
          Swapped. Doubling $t$ gives $4\times$ the strength but less than $2\times$ the weight; that is why a thicker beam is a good buy, up to a point.
    explanation: |
      Every design problem in the rest of the course has this shape: two things you want, one curve of what nature allows.
  - id: needs
    title: Needs region and feasibility
    row: 4
    col: 3
    body: |
      The requirements form a **needs region** on the plot. A design is **feasible** when its point lies on the curve **and** inside the region. If the region misses the curve, relax a need or change the machine.
    decoys:
      - body: |
          The requirements form a **needs region** on the plot. A design is **feasible** when its point lies inside the region, wherever the curve is. If nothing is feasible, push harder on the same machine.
        feedback: |
          A point off the curve cannot be built. And when the region misses the curve, no effort with the same machine will help: you must relax a need or change the design.
      - body: |
          The requirements form a **needs region** on the plot. A design is **feasible** when its point lies on the curve, whatever the needs. If nothing is feasible, there is no best design.
        feedback: |
          Being on the curve is not enough: the design must also meet the needs. And "best" depends on the needs, not on the machine alone.
    explanation: |
      The beam with strength at least $400$ kN and weight at most $12$ kg/m is feasible for thicknesses from about $3.2$ cm to $5.5$ cm.
  - id: feedback
    title: Feedback loop
    row: 4
    col: 1
    body: |
      A **closed loop** measures its own result and uses it to decide what to do next: a **sensor** measures, a **setpoint** is the value we want, an **actuator** acts. An open loop acts without measuring.
    decoys:
      - body: |
          A **closed loop** acts on a fixed dial or timer, whatever the result: a **sensor** is not needed, the **setpoint** is the dial setting, and an **actuator** acts. A loop that measures is open.
        feedback: |
          Reversed. A toaster on a timer is open: it does not look at the toast. Closed means the result is fed back.
      - body: |
          A **closed loop** measures its own result and uses it to decide what to do next: the **actuator** measures, the **setpoint** is the value we get, a **sensor** acts.
        feedback: |
          The roles are mixed up. The sensor measures; the setpoint is the value we *want*; the actuator (the heater, for example) acts.
    explanation: |
      A thermostat holds a room near the setpoint whether it is $5$ °C or $15$ °C outside, while a heater left on follows the weather.
  - id: error
    title: The error and its sign
    row: 4
    col: 2
    body: |
      With setpoint $T_{\text{set}}$ and sensed temperature $T_{\text{sensed}}$ (in °C), the error is
      $$e = T_{\text{set}} - T_{\text{sensed}}$$
      and the heater is on exactly when $e > 0$: the **sign** decides.
    decoys:
      - body: |
          With setpoint $T_{\text{set}}$ and sensed temperature $T_{\text{sensed}}$ (in °C), the error is
          $$e = T_{\text{sensed}} - T_{\text{set}}$$
          and the heater is on exactly when $e > 0$: the **sign** decides.
        feedback: |
          The sign is reversed. With this definition $e>0$ means the room is already *too warm*, and the heater would heat it more.
      - body: |
          With setpoint $T_{\text{set}}$ and sensed temperature $T_{\text{sensed}}$ (in °C), the error is
          $$e = T_{\text{set}} - T_{\text{sensed}}$$
          and the heater is on longer the larger the size of $e$: the **size** decides.
        feedback: |
          An on/off thermostat only asks one yes/no question: is the room too cold? A room $1$ °C below and one $10$ °C below get the same command, "on".
    explanation: |
      Three degrees too cold: $e = +3$, heater on. Two degrees too warm: $e = -2$, heater off.
  - id: delay
    title: Delay causes overshoot
    row: 5
    col: 2
    body: |
      If the sensor reports an old temperature, the heater stays on too long after the room is warm enough, and the room swings **beyond** the band around the setpoint.
    decoys:
      - body: |
          If the sensor reports an old temperature, the heater switches off too early, and the room never reaches the setpoint: the thermostat is broken.
        feedback: |
          A late report means a late *switch*. A room that swings around its setpoint is usually a sign of a delay between acting and noticing, not of a broken part.
      - body: |
          A faster heater cures any overshoot, because the error is then corrected sooner, whatever the sensor delay.
        feedback: |
          A stronger heater makes the room warm faster during the same delay, so it overshoots by more. The remedy is a faster sensor or a gentler action.
    explanation: |
      It is like steering a car with a window that shows the road a few seconds late: you correct too late and weave from side to side.
  - id: tour
    title: Puzzles for the later levels
    row: 6
    col: 2
    body: |
      Every later level starts from an everyday puzzle you can guess first: a long wrench (turning effect $\tau = F\,d$), a warm fridge back (heat is moved), a ship that floats, a flash before thunder ($d = v\,t$), and so on.
    decoys:
      - body: |
          Every later level starts from a long definition list that you must memorise before any puzzle: a long wrench (turning effect $\tau = d/F$), and so on.
        feedback: |
          The course goes the other way round: puzzle first, guess, then the principle. And the turning effect grows with *both* force and distance, $\tau = F\,d$.
      - body: |
          Every later level starts from an everyday puzzle you can guess first: a long wrench (turning effect $\tau = F + d$), a warm fridge back (heat is created), a ship that floats.
        feedback: |
          Two slips: the turning effect is the product $F\,d$, not a sum, and a fridge does not create heat, it moves it from the inside to the outside.
    explanation: |
      Each of those puzzles reuses ideas from this level: sizes, energy, feedback and tradeoffs.
