id: ch01-tour
title: A Puzzle for Every Level
kind: concept
own: |
  - **A guess first, then the principle.** Each later level of the course starts from an everyday puzzle you can guess before any theory. The puzzles and their answers in one line each:
  - **Forces and Motion.** A long wrench loosens a stuck bolt because the turning effect of a push is
    {{ $$\tau = F\,d$$ }}
    where $\tau$ is the turning effect, $F$ the force and $d$ the distance from the bolt, so the same push, applied farther out, turns harder.
  - **Heat and Energy.** A fridge does not make cold; it **moves heat** from inside to outside, so the back is warm. **Fluids and Pressure.** A steel ship floats because it pushes aside water whose weight equals the ship's own weight (a $2000$ kg boat pushes aside $2$ m$^3$ of water, which has mass $1000$ kg per m$^3$).
  - **Electricity and Circuits.** Heat in a wire grows quickly with the current through it, so a power-hungry oven (about $10$ A) needs a thick cable and a lamp (about $0.04$ A) a thin one.
  - **Waves, Sound and Light.** Light is almost instant and sound is slow, so the gap between flash and thunder gives the distance of a storm:
    {{ $$d = v\,t$$ }}
    where $d$ is the distance, $t$ the delay and $v \approx 340$ m/s the speed of sound;
    **Matter and Chemistry.** Salt dissolves in the thin water film on ice and lowers the temperature at which water freezes, so the ice melts.
  - **Radio and Electromagnetic Waves.** A phone and a tower talk by varying an invisible wave of electric and magnetic fields in a pattern. **Information.** Each yes/no question can at best halve the possibilities, so one of $1000$ things needs
    {{ about $10$ questions, because $2^{10} = 1024$ }}.
  - **Semiconductors and Computing.** Chips get hot because billions of tiny switches each turn a little electrical energy into heat. **Networks and Cryptography.** Two strangers can share a secret in public with a step that is easy to do and practically impossible to undo (the paint-mixing picture). **Large Software Systems.** Bugs multiply because the number of ways the parts can interact grows far faster than the number of lines.
  - **Space.** A satellite does not escape gravity (it is still pulled about $90\%$ as hard as on the ground): it is
    {{ falling around the Earth, moving sideways so fast that the ground curves away beneath it }}.
    **The Frontier.** The rules built from big things fail for atoms and smaller: very small things behave like waves that come in fixed steps.
cards:
  - type: text
    id: hook
    title: A puzzle for every level
    body: |
      Remember: in Level 1 the **guess is the point**. You are not expected to know any of this yet. A wrong guess costs nothing and teaches more than a skipped question.

      The rest of the course is a trail of **levels**, each about one family of everyday machines. This lesson is a tour: **one small puzzle from each level that comes later**, in order. For each puzzle, first guess; then read why. The closing table shows which level solves which puzzle.

      Words you may not know are explained the first time they appear. If a word is still unclear, guess anyway.

  - type: mcq
    id: wrench
    title: Forces and Motion
    prompt: |
      A bolt is stuck. A wrench with a short handle will not turn it, but the same person pushing the same amount on a **long** handle can. Why does the long handle help?
    shuffle: false
    options:
      - text: The longer handle makes the person's arm push with more force.
        feedback: |
          Tempting, but the push of your hand is the same on both wrenches. What changes is where it is applied.
      - text: The same push applied farther from the bolt has a bigger turning effect.
        correct: true
      - text: A long wrench is made of more metal, so it is stronger than a short one.
        feedback: |
          The short wrench is not breaking; it is simply not turning the bolt. A bigger lump of metal does not turn harder by itself.
    hint: |
      Turning effect is the push (force) multiplied by the distance from the bolt to where you push.
    explanation: |
      Turning effect = force times distance. A push of $100$ N at $0.1$ m gives $10$ N·m; the same push at $0.3$ m gives $30$ N·m, three times as much. The levels on forces explain this idea (levers, gears) and use it to build bicycles and locks.

  - type: mcq
    id: fridge
    title: Heat and Energy
    prompt: |
      Put your hand behind a running fridge: it is warm. The inside is cold. What is the fridge doing?
    shuffle: false
    options:
      - text: It makes cold and pushes it into the box; the warm back is just waste from the motor.
        feedback: |
          Cold is not a thing that can be made: it is only the absence of heat. And the warm back is not mere waste, it is where the heat taken from inside is released.
      - text: It moves heat from the inside to the outside, and the back is where that heat is let out.
        correct: true
      - text: It destroys the heat inside the box, so the back is warm from the energy being thrown away.
        feedback: |
          Energy is never destroyed, only moved or changed into another form (you saw this when we followed a phone charge). Heat taken out of the box has to go somewhere.
    hint: |
      Think of a pump that moves water uphill: it does not remove the water, it relocates it. The fridge pumps heat.
    explanation: |
      A fridge is a **heat pump**: a motor uses electrical energy to carry heat from the cold inside to the warmer room. The room gets the heat from the food **plus** the electrical energy used. That is why a fridge with its door open cannot cool a kitchen: it heats it. The level on heat builds this from first principles.

  - type: mcq
    id: ship
    title: Fluids and Pressure
    prompt: |
      A steel nail sinks, but a steel ship, which is far heavier, floats. Why?
    shuffle: false
    options:
      - text: The ship is so big that gravity pulls on it less.
        feedback: |
          Gravity pulls harder on a heavier object, not less. The ship is pulled down hard; it is also pushed up hard.
      - text: The ship is hollow, so it pushes aside a large amount of water, and the water pushes back up with a force equal to the weight of that water.
        correct: true
      - text: Steel floats once it is thick enough, because thick steel is lighter than water.
        feedback: |
          Steel is about $8$ times as dense as water however thick it is. A ship floats because of its **shape**, not because its steel is light.
    hint: |
      Water pushes up on a floating object with a force equal to the weight of the water the object pushes aside.
    explanation: |
      The ship's hollow shape lets it push aside a huge volume of water. The upward push equals the weight of that water, which is large enough to equal the weight of the whole ship. A nail has a tiny shape and pushes aside too little water.

  - type: numeric
    id: ship-volume
    title: Fluids and Pressure
    prompt: |
      A floating boat has a total mass of $2000$ kg. It floats when it pushes aside water of the **same mass** as the boat. Water has a mass of $1000$ kg in every cubic metre. How many cubic metres of water does the boat push aside?
    answer: 2
    tolerance: 0.01
    answerText: '2'
    wrong:
      - { value: 2000000, feedback: 'You multiplied $2000 \times 1000$. To find a volume from a mass, divide by the mass per cubic metre.' }
      - { value: 0.5, feedback: 'You divided the other way round. $1000$ kg of water fills $1$ m$^3$, so $2000$ kg fills more than one.' }
    hint: |
      How many cubic metres hold $2000$ kg of water, if each holds $1000$ kg?
    explanation: |
      $2000\ \text{kg} / (1000\ \text{kg per m}^3) = 2\ \text{m}^3$. The boat sinks into the water until the hull has pushed aside exactly $2$ m$^3$, then it stops.

  - type: mcq
    id: cable
    title: Electricity and Circuits
    prompt: |
      An electric oven is plugged into the wall by a thick cable, but a small lamp uses a thin one. The oven draws a large **current** (current is the amount of electric charge flowing along the wire each second). Why does a large current need a thick cable?
    shuffle: false
    options:
      - text: Thick cable makes the electricity travel faster.
        feedback: |
          Wire thickness does not set how fast the signal travels. It sets how easily the charge can flow, and so how much the wire heats.
      - text: The wire heats up as charge flows through it, and a thin wire carrying a big current would get dangerously hot.
        correct: true
      - text: The oven needs more insulation, which makes the cable look thicker.
        feedback: |
          Insulation is a plastic coat; the thickness that matters is the copper inside it.
    hint: |
      Every wire heats a little when current flows, and the heat grows quickly with the current. A wide path lets the same current pass with less heating.
    explanation: |
      A typical oven of $2300$ W at $230$ V draws about $10$ A; a $10$ W lamp draws about $0.04$ A. Heating in a wire grows faster than the current itself, so $10$ A in a thin wire would heat it far too much. The same idea explains why fuses exist.

  - type: numeric
    id: thunder
    title: Waves, Sound and Light
    prompt: |
      You see a flash of lightning, and hear the thunder $3$ s later. Light arrives almost instantly (it covers $300\,000\,000$ m each second), but sound travels only $340$ m each second. About how far away, in metres, is the lightning?
    answer: 1020
    tolerance: 40
    answerText: '1020'
    wrong:
      - { value: 113, feedback: 'You divided $340$ by $3$. Distance is speed times time: $340\ \text{m/s} \times 3\ \text{s}$.' }
      - { value: 3000000000, feedback: 'That would use the speed of light, but the flash is not what you waited for. The $3$ s delay is the time sound took to arrive.' }
    hint: |
      Distance = speed times time. Use the speed of sound, since the light takes almost no time.
    explanation: |
      $340 \times 3 = 1020$ m, about a kilometre. Light needs only about $3\times10^{-6}$ s to cross that distance, so the whole delay is the sound's journey. Both flash and thunder are **waves** (patterns that travel through a medium or through space); light and sound are very different kinds, with very different speeds.

  - type: mcq
    id: salt-ice
    title: Matter and Chemistry
    prompt: |
      On an icy road, salt is spread and the ice melts even though the air is still below $0^\circ$C. Why? (The **freezing point** of water is the temperature at which it turns to ice. Salt dissolves in a thin film of water always present on the surface of ice.)
    shuffle: false
    options:
      - text: Salt gives off heat, which warms the ice above its melting point.
        feedback: |
          Tempting, but salt dissolving in water slightly cools, not warms. The melting comes from a change in the water itself.
      - text: Salty water freezes only at a lower temperature than pure water, so the ice can no longer stay frozen.
        correct: true
      - text: Salt crystals are sharp and cut the ice into water.
        feedback: |
          The crystals do not cut the ice mechanically. The effect works equally well with tiny, smooth grains; it is a change of chemistry.
    hint: |
      Dissolved salt makes the water harder to freeze: its freezing point drops well below $0^\circ$C.
    explanation: |
      With salt dissolved, the water film no longer freezes at $0^\circ$C but at a lower temperature, so the ice (which is at $0$ to $-5^\circ$C, say) melts into salty water. This is the same idea behind soap, shampoo and plastics: molecules and how they stick to each other decide what a material does.

  - type: mcq
    id: radio
    title: Radio and Electromagnetic Waves
    prompt: |
      A phone and a tower far away exchange your voice and messages with no wire between them. How do they do it?
    shuffle: false
    options:
      - text: They send ordinary sound through the air, very loudly.
        feedback: |
          Sound fades within a few hundred metres and the phone is not that loud. Sound also travels slowly. The link uses something that crosses kilometres almost instantly.
      - text: They vary an invisible wave of electric and magnetic fields (a **radio wave**) in a pattern that carries the message.
        correct: true
      - text: A wire is buried underground between each phone and the nearest tower.
        feedback: |
          A phone moves; there is no wire to it. The only connection is the wave travelling through the air.
    hint: |
      Light is a wave that crosses space with no wire. Radio is the same kind of wave, only invisible to the eye.
    explanation: |
      A radio wave travels at the speed of light. The sender changes it in a pattern (louder, softer, slightly shifted in time), and the receiver reads the pattern back as the message. The level on radio explains antennas, tuning and how many conversations share the air.

  - type: numeric
    id: twenty-questions
    title: Information
    prompt: |
      I think of one object among $1000$ equally likely ones. You may ask only yes/no questions. Each question can be chosen to cut the remaining objects **in half**. About how many questions do you need to be sure of the object?
    answer: 10
    tolerance: 0.4
    answerText: '10'
    wrong:
      - { value: 500, feedback: 'That is how many objects remain after **one** question. Keep halving.' }
      - { value: 1000, feedback: 'That is asking about each object in turn, which is the worst plan. Halving each time is much faster.' }
    hint: |
      Halve $1000$ again and again: $500$, $250$, $125$, and so on, until one remains. Count the halvings. (Powers of two: $2^{10} = 1024$.)
    explanation: |
      After $k$ halving questions about $1000/2^k$ objects remain, and $2^{10} = 1024$ is just above $1000$, so $10$ questions are enough (and $9$ are not, since $2^9 = 512$ is below $1000$). The number of yes/no answers needed measures **information**; it is the unit of every computer.

  - type: mcq
    id: chip-heat
    title: Semiconductors and Computing
    prompt: |
      A computer chip has no moving parts, yet it gets hot enough to need a fan. Why?
    shuffle: false
    options:
      - text: Its parts rub against each other, which produces friction.
        feedback: |
          A chip has nothing that moves mechanically. The heating comes from the electricity itself.
      - text: Electric energy is not stored by the chip; each tiny switch inside turns a little of it into heat as it flips, and there are billions of switches flipping billions of times a second.
        correct: true
      - text: Chips are heated by the sunlight that reaches them through the case.
        feedback: |
          A chip in a dark case still heats. The energy comes from the electrical supply.
    hint: |
      Recall from the lesson on energy: whenever energy is used, some of it ends up as heat. Here a huge number of tiny switches each add a small amount.
    explanation: |
      A **transistor** is a tiny electric switch (a modern chip has billions). Each flip needs a little energy, which finishes as heat. A small amount multiplied by billions of switches and billions of flips per second becomes tens of watts concentrated on a thumbnail-sized chip.

  - type: mcq
    id: secret
    title: Networks and Cryptography
    prompt: |
      Two strangers, Ana and Ben, want to agree on a secret colour, but everything they say is overheard by a spy. They publicly agree on a common paint, say yellow. Each secretly picks a private colour, mixes it into the yellow, and **sends the mixture** to the other. Each then mixes their own private colour into the mixture they received. They end with the same colour, but the spy cannot find it. What makes this work?
    shuffle: false
    options:
      - text: The spy cannot see, because the strangers whisper.
        feedback: |
          Everything is said in public; the spy hears all of it. The secret must survive even then.
      - text: Mixing paints is easy, but separating a mixture back into the original colours is practically impossible.
        correct: true
      - text: The strangers' private colours are sent to each other in code, so the spy learns nothing.
        feedback: |
          The private colours are never sent at all, only mixtures. That is what keeps them secret.
    hint: |
      The order of mixing does not matter for the final colour. Which of the two directions, mixing or unmixing, is the hard one?
    explanation: |
      Ana ends with yellow + Ana + Ben, and Ben with yellow + Ben + Ana: the same colour. The spy sees only yellow, yellow + Ana and yellow + Ben, and cannot unmix them. Real internet security uses mathematics in place of paint, where one direction (multiplying numbers) is easy and the other (splitting a huge number back into its factors) is extremely slow.

  - type: mcq
    id: bugs
    title: Large Software Systems
    prompt: |
      A **bug** is a mistake in a computer program. A program of a million lines nearly always contains bugs, even though skilled people wrote and tested it. Why?
    shuffle: false
    options:
      - text: Computers randomly make arithmetic errors, which look like bugs.
        feedback: |
          A computer repeats the same instructions exactly; arithmetic errors from the hardware are extremely rare. The bug is in the instructions.
      - text: Programmers are careless, so more lines means more careless mistakes in proportion.
        feedback: |
          Careful teams still ship bugs. If carelessness were the cause, bugs would grow only in proportion to the lines, but in practice they grow faster, because the interactions grow faster than the lines.
      - text: The number of ways the parts can interact grows much faster than the number of lines, so nobody can test every case.
        correct: true
    hint: |
      With $10$ parts there are $45$ pairs of parts that could interact; with $100$ parts there are $4950$. Compare the growth.
    explanation: |
      Ten times more parts gives about a hundred times more pairs, and there are also groups of three or more. Testing every combination is impossible, so some interactions are never tried. The level on large software explains how to make this manageable (modules, tests, redundancy).

  - type: mcq
    id: satellite
    title: Space
    prompt: |
      A satellite orbits $400$ km above the ground. At that height gravity is still about $90\%$ as strong as at the surface. Yet the satellite does not fall to the ground. Why?
    shuffle: false
    options:
      - text: There is no gravity in space.
        feedback: |
          Gravity is still $90\%$ as strong at that height. It weakens slowly with distance, and the Moon, $400\,000$ km away, still feels it.
      - text: It is falling all the time, but it moves sideways so fast that the ground curves away beneath it as fast as it drops.
        correct: true
      - text: It escapes gravity because rockets keep pushing it up.
        feedback: |
          Most satellites have no engine running. They coast; gravity alone keeps them in a circle.
    hint: |
      Throw a ball harder and harder horizontally: it lands farther each time. Now imagine a throw so fast that the Earth below curves away before it lands.
    explanation: |
      At $400$ km a satellite needs about $7.7$ km/s sideways, roughly $28\,000$ km/h. It falls, but never gets closer. An orbit is a fall that keeps missing the ground.

  - type: mcq
    id: frontier
    title: The Frontier
    prompt: |
      Our everyday rules (balls follow paths, energy changes smoothly) were found by studying objects we can see and hold. What should we expect for objects as small as a single atom?
    shuffle: false
    options:
      - text: 'The same rules, only on a smaller scale: an atom is a tiny ball following a path.'
        feedback: |
          This is the natural guess, and it is wrong. Experiments show tiny things do not follow the paths of tiny balls.
      - text: 'Different behaviour: they act like spread-out waves, with energies that come only in certain fixed steps.'
        correct: true
      - text: Nothing at all, because such small things have no energy.
        feedback: |
          Atoms have energy, and it is what makes light, chemistry and the glow of a lamp. It just comes in steps.
    hint: |
      There is no reason that rules built from big things must hold at sizes millions of times smaller. Experiments decide. The surprise is that things get "wave-like".
    explanation: |
      Electrons in an atom can only have certain energies, like the rungs of a ladder with nothing in between, and they behave like waves. That is why atoms give off light of precise colours. The frontier level covers this world, which also gives us lasers, chips and tiny machines.

  - type: text
    id: table
    title: Which level solves which puzzle
    body: |
      | Puzzle | Level that explains it |
      |---|---|
      | A long wrench and a stuck bolt | Forces and Motion |
      | The warm back of a fridge | Heat and Energy |
      | A steel ship that floats | Fluids and Pressure |
      | Thick cable for an oven | Electricity and Circuits |
      | Lightning before thunder | Waves, Sound and Light |
      | Salt melting ice | Matter and Chemistry |
      | Phone and tower, no wire | Radio and Electromagnetic Waves |
      | $10$ questions for $1000$ things | Information |
      | A chip that gets hot | Semiconductors and Computing |
      | A secret shared in public | Networks and Cryptography |
      | A million lines, many bugs | Large Software Systems |
      | A satellite that does not fall | Space |
      | Atoms that behave strangely | The Frontier |

  - type: text
    id: summary
    body: |
      **Next:** a round of fast questions, each built on a tempting wrong idea about sizes, energy, feedback and tradeoffs, in the lesson Traps.
