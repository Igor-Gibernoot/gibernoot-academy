id: ch04-fridge
title: The Refrigerator
kind: concept
own: |
  - **Setting.** A refrigerator keeps its inside at absolute temperature $T_c$ (kelvin) in a kitchen at $T_h$. Each second it takes heat $\dot Q_c$ (watts) out of the inside, uses electric work $\dot W$ (watts), and hands heat $\dot Q_h$ (watts) to the kitchen through the coils at the back or underneath. Heat does not flow from cold to hot by itself, so the machine must be paid in work.
  - **Energy balance.** Nothing is lost on the way, so what the kitchen receives is what was taken plus the work:
    {{ $$\dot Q_h = \dot Q_c + \dot W$$ }}
    With $\dot Q_c = 300$ W and $\dot W = 100$ W the kitchen receives $400$ W.
  - **Coefficient of performance.** The heat moved per unit of work paid for:
    {{ $$\mathrm{COP} = \frac{\dot Q_c}{\dot W}$$ }}
    The example above has $\mathrm{COP} = 3$. A bigger COP means a cheaper fridge.
  - **The loop.** A refrigerant circulates through a compressor (raises its pressure and temperature), the condenser coils (it gives heat to the kitchen and turns to liquid), an expansion valve (the pressure drops, the liquid turns cold) and the evaporator inside (the liquid boils at low pressure and absorbs heat). Boiling takes heat, so the low-pressure evaporator can sit below $4$ °C.
  - **The ceiling.** No machine beats the Carnot limit, with $T_c$ and $T_h$ in kelvin:
    {{ $$\mathrm{COP}_{\max} = \frac{T_c}{T_h - T_c}$$ }}
    For $4$ °C inside and $22$ °C outside it is $15.4$; for a freezer at $-18$ °C it is $6.38$. A smaller lift between inside and kitchen is cheaper.
  - **The wall sets the load.** The heat leaking through the walls is $\dot Q_c = \Delta T/R$ with $R = L/(kA)$ (thickness $L$, conductivity $k$, area $A$), and the machine must remove it:
    {{ $$\dot W = \frac{\dot Q_c}{\mathrm{COP}}$$ }}
    Better insulation lowers $\dot Q_c$ and so the electric power.
cards:
  - type: text
    id: hook
    title: The warm back of the fridge
    body: |
      Put your hand behind an old fridge, or under a newer one, and the air there is warm. The fridge is cooling your milk, so you might expect it to be cold all over. Before any theory, guess: **where does the heat that leaves the milk end up?**

  - type: mcq
    id: q-where
    prompt: |
      A fridge cools a bottle of milk from kitchen temperature down to about $4$ °C. The milk loses heat. Where does that heat go?
    options:
      - text: Out through coils at the back or underneath, into the kitchen air.
        correct: true
      - text: It is destroyed inside the fridge, which is why the inside gets cold.
        feedback: |
          Heat is energy, and energy is not destroyed. It has to be moved somewhere, and the only place left is the kitchen.
      - text: It stays in the fridge walls, which slowly warm up.
        feedback: |
          The walls are insulation: they stay near the inside temperature on one side and the kitchen on the other. If the heat piled up in them, they would keep heating without limit.
      - text: It leaves with the cold air each time the door opens.
        feedback: |
          Opening the door lets warm air **in**, which adds load. The fridge works with the door closed too, so the heat must have another way out.
    explanation: |
      The heat is carried out of the cabinet and released to the room by the coils (the **condenser**). That is why the back or underside is warm: it is the exhaust of a machine that moves heat out of a box.

  - type: text
    id: uphill
    title: Heat does not go uphill by itself
    body: |
      Leave a warm bottle in a cold room and it cools: heat flows from hot to cold with no help, the way water runs downhill. A fridge needs the opposite. The inside is **colder** than the kitchen, yet heat must leave it and enter the warmer kitchen.

      Water goes uphill only if a pump pushes it. Heat goes "uphill" only if a machine pays for it with work. Our fridge is a **heat pump** in this sense: it pumps heat from a cold place to a warmer one, using electricity. (Recall from the lesson Ovens, Thermoses and Warm Jackets: the walls only slow the downhill leak. The machine fights it.)

  - type: text
    id: parts
    title: Four parts and one fluid
    body: |
      A sealed loop of pipe carries a special fluid, the **refrigerant**, which is easy to turn from liquid to gas and back. Four parts act on it:

      - The **compressor** (the motor you hear) squeezes the gas into a smaller space. Its pressure and temperature rise: the gas leaves hot.
      - The **condenser** is the set of coils at the back or underneath. Hot gas passes through and gives its heat to the kitchen air. As it cools it turns into liquid (it **condenses**).
      - The **expansion valve** is a very narrow tube. The liquid is forced through it and its pressure drops sharply, and it comes out cold.
      - The **evaporator** is the set of cold coils inside the cabinet. The cold liquid takes heat from the inside and boils into gas (it **evaporates**).

      Then the gas goes back to the compressor and the trip begins again.

  - type: order
    id: q-loop
    prompt: |
      Follow the refrigerant of a fridge. It starts as cold low-pressure gas just leaving the coils inside the cabinet. Put its trip in order until it is back at the same point.
    steps:
      - The compressor squeezes the gas, which leaves hot and at high pressure.
      - The condenser coils release its heat to the kitchen, and it turns to liquid.
      - The expansion valve drops its pressure and it comes out cold.
      - The evaporator inside takes heat from the cabinet and the liquid boils back to gas.
    hint: The compressor is what pays for the whole trip, and the cold part must come right before the place that absorbs heat.
    explanation: |
      Hot gas in the condenser has to be hotter than the kitchen to give heat to it, and the liquid in the evaporator has to be colder than the food to take heat from it. The compressor makes the first possible and the valve makes the second possible.

  - type: text
    id: boil
    title: Why the pipe is cold, and why the coils are warm
    body: |
      Boiling takes heat: a pot on the stove must keep receiving heat to keep boiling, and sweat cools you as it evaporates. And the temperature at which a liquid boils depends on the **pressure**: water boils below $100$ °C on a mountain, where the air pressure is lower.

      The refrigerant is chosen to boil at a low temperature. Isobutane, used in many household fridges today, boils at about $-12$ °C at ordinary atmospheric pressure. After the valve, the liquid is at low pressure, so it boils at a temperature **below** the $4$ °C inside the cabinet. It boils there, takes heat from the food side, and the heat flows from the warmer cabinet to the colder pipe, which is ordinary downhill flow.

      Then the compressor raises the pressure, so the same fluid now condenses only at a temperature **above** the kitchen's. That is why the coils feel warm: they must be hotter than the room for heat to leave them downhill. Moving the fluid between low and high pressure lets one loop sit below the inside temperature at one end and above the room temperature at the other.

  - type: mcq
    id: q-boil
    prompt: |
      Inside a fridge cabinet at $4$ °C, the evaporator coil is colder than $4$ °C. Which explanation fits the machine?
    options:
      - text: The refrigerant arrives as a liquid at low pressure, so it boils below $4$ °C, and boiling absorbs heat.
        correct: true
      - text: The compressor sends cold air straight into the cabinet.
        feedback: |
          The refrigerant never enters the cabinet air: it stays sealed inside the pipes. The compressor makes the fluid **hot**; it is the valve and the boiling that make it cold.
      - text: Boiling is a hot process, so the refrigerant releases heat to the cabinet and the cabinet cools.
        feedback: |
          Boiling **takes** heat from its surroundings (think of a pot that needs the burner on). Here the surroundings are the cabinet, so the cabinet loses heat.
      - text: The refrigerant is a substance that makes cold, so it adds cold to the cabinet.
        feedback: |
          Cold is not a substance. A cold box is one that has had heat removed. The refrigerant only carries heat from inside to outside.
    explanation: |
      Low pressure lowers the boiling temperature below $4$ °C, and the boiling draws heat in from the warmer cabinet. The same pipe gives the heat back to the kitchen later, after the compressor has raised the pressure.

  - type: text
    id: history
    title: Who built the first one
    image:
      src: img/perkins.webp
      alt: Engraved portrait of Jacob Perkins, an elderly man in a high collar
      caption: Jacob Perkins (1766-1849) patented around 1834 the first vapour-compression machine that could freeze water, built and shown in 1835 by his associate John Hague.
      credit: Unknown author, Public domain, via Wikimedia Commons (National Library of Wales)
      link: https://commons.wikimedia.org/wiki/File:Portrait_of_Jacob_Perkins_Esqr_(4672666).jpg
    body: |
      The loop of this lesson is the **vapour-compression cycle**. Oliver Evans described such a closed cycle in 1805 but never built it. Jacob Perkins, an American inventor working in England, patented a machine around 1834 that cooled water and froze it, and his associate John Hague built and demonstrated it in 1835. It was not a commercial success.

      In the 1850s James Harrison in Geelong, Australia, built ice-making machines that were used commercially and patented a vapour-compression system in 1856. The first self-contained home units came much later: Frigidaire sold one in 1923.

  - type: text
    id: balance
    title: The energy balance of a fridge
    body: |
      Now count the energy. Per second, the fridge takes heat $\dot Q_c$ (the dot means "per second", so watts) out of the inside; the compressor motor uses electric work $\dot W$; and the coils give heat $\dot Q_h$ to the kitchen. Energy is neither made nor lost, the same bookkeeping as the shower, where the heater's power ended up in the water. Here everything that comes in must go out:
      $$\dot Q_h = \dot Q_c + \dot W.$$
      The kitchen receives the heat taken from the milk **and** the work that paid for it. To compare machines we use the **coefficient of performance**, COP: the heat moved for each unit of work spent,
      $$\mathrm{COP} = \frac{\dot Q_c}{\dot W}.$$
      A COP of $3$ means $3$ W of heat moved out of the cabinet for each watt of electricity.

  - type: widget
    id: w-flow
    widget: heat-pump-flow
    review: false
    config:
      Tc: 4
      Th: 22
      cop: 2
      qc: { value: 300, min: 100, max: 600, step: 50 }
      units: { heat: W }
      labels: { cold: Inside, room: Kitchen, pump: Compressor, Qc: Heat taken, W: Work in, Qh: Heat out, qcSlider: Heat taken from inside }
      show: { qcSlider: true, tempSliders: false, factorSlider: false, copSlider: false, handles: false, presets: false, limitWarning: false }
      readouts: [Qc, W, Qh, copC]
    body: |
      A fridge with a fixed COP of $2$. Drag the slider to change the heat taken from the inside, and watch the three arrows: heat taken, work in and heat out to the kitchen. Check that the heat out is always the other two added together, and that the work stays half the heat taken.

  - type: numeric
    id: q-qh
    prompt: |
      A fridge removes heat from its inside at $\dot Q_c = 300$ W. Its compressor uses electric work $\dot W = 100$ W. At what rate does it give heat to the kitchen, in watts?
    answer: 400
    tolerance: 1
    answerText: '400'
    wrong:
      - { value: 300, feedback: 'You counted only the heat taken from the inside. The kitchen also receives the work, which ends up as heat in the coils: $\dot Q_h = \dot Q_c + \dot W$.' }
      - { value: 200, feedback: 'You subtracted the work. The work is an extra input of energy, so the output is the larger one: $300 + 100$.' }
    hint: Everything entering the machine, heat from inside and electricity, leaves through the coils.
    explanation: |
      $$\dot Q_h = \dot Q_c + \dot W = 300 + 100 = 400\ \text{W}.$$
      The kitchen gets more heat than the fridge removed from its cabinet.

  - type: numeric
    id: q-cop
    prompt: |
      The same fridge takes $\dot Q_c = 300$ W from its inside and uses $\dot W = 100$ W of electric work. What is its coefficient of performance, $\mathrm{COP} = \dot Q_c/\dot W$?
    answer: 3
    tolerance: 0.01
    answerText: '3'
    wrong:
      - { value: 4, feedback: 'You divided the heat given to the kitchen, $400$ W, by the work. The COP of cooling counts the heat taken from the **inside**, which is what the fridge is for.' }
      - { value: 0.333, feedback: 'You inverted the ratio. The COP is the useful heat moved divided by the work paid, so a good machine has a large one.' }
    hint: Useful heat moved out of the cabinet, divided by the electricity used.
    explanation: |
      $$\mathrm{COP} = \frac{300}{100} = 3.$$
      Unlike a heater, which can at best turn each watt into one watt of heat, a heat pump can move **more** heat than the electricity it uses, because it only transports heat that already exists.

  - type: mcq
    id: q-door
    prompt: |
      On a hot day a friend says: "Leave the fridge door open and the kitchen will cool down." The fridge removes heat $\dot Q_c$ from the air in front of it and releases $\dot Q_h = \dot Q_c + \dot W$ through its coils into the same kitchen. What happens to the kitchen?
    options:
      - text: It warms slightly, by about the work $\dot W$ the compressor uses.
        correct: true
      - text: It cools, because cold air spills out of the open door.
        feedback: |
          The cold air that spills out came from heat the fridge took from the **same room**. All that matters is the net: the room loses $\dot Q_c$ at the door and gains $\dot Q_h$ at the coils.
      - text: Nothing changes, because the heat taken equals the heat released.
        feedback: |
          Heat released is **larger** than the heat taken, by the work $\dot W$: $\dot Q_h = \dot Q_c + \dot W$. The machine's electricity ends up in the room as heat.
      - text: It cools while the compressor runs and warms when it stops.
        feedback: |
          The compressor adds heat to the room whenever it runs. When it stops, the room is not cooled or warmed by the fridge any more.
    explanation: |
      Everything stays in the room: the net heat added is $\dot Q_h - \dot Q_c = \dot W$. An open fridge is a small electric heater with extra steps. A fridge only cools a place that is **separated** from the one where the coils sit.

  - type: text
    id: carnot
    title: A ceiling on the COP
    body: |
      How good can a COP be? Here the temperature gap matters. If the inside is only a little colder than the kitchen, the heat has a short "hill" to climb and little work is needed. The best any machine can do, set by the second law of thermodynamics, is the **Carnot limit**:
      $$\mathrm{COP}_{\max} = \frac{T_c}{T_h - T_c}.$$
      Here $T_c$ is the temperature of the inside and $T_h$ that of the kitchen, **in kelvin** (add $273.15$ to the Celsius value). For $4$ °C inside and $22$ °C outside, $T_c = 277.15$ K and $T_h - T_c = 18$ K, so
      $$\mathrm{COP}_{\max} = \frac{277.15}{18} = 15.4.$$
      Real machines reach only a fraction of the limit. Next you compare a fridge section ($4$ °C) with a freezer ($-18$ °C) in the same kitchen, for a machine that reaches $40\%$ of its limit.

  - type: widget
    id: w-lift
    widget: heat-pump-flow
    review: false
    config:
      Tc: 4
      Th: 22
      factor: 0.4
      qc: { value: 100, min: 100, max: 100, step: 10 }
      units: { heat: W }
      labels: { cold: Inside, room: Kitchen, pump: Compressor, Qc: Heat taken, W: Work in, Qh: Heat out }
      show: { qcSlider: false, tempSliders: true, factorSlider: false, copSlider: false, handles: true, presets: true, limitWarning: false }
      tempRange: { cold: [-30, 10, 1], hot: [10, 40, 1] }
      presets: [{ label: Freezer, Tc: -18 }, { label: Fridge, Tc: 4 }]
      readouts: [Qc, W, copC, carnotC]
    body: |
      The machine always moves $100$ W of heat out of the inside and reaches $40\%$ of the Carnot limit. Press **Freezer**, then **Fridge**, and also drag the inside or kitchen temperature. Watch how the electric work changes, and the COP.

  - type: numeric
    id: q-freezer
    prompt: |
      A freezer is kept at $-18$ °C in a kitchen at $22$ °C. Using $\mathrm{COP}_{\max} = T_c/(T_h - T_c)$ with temperatures in kelvin (add $273.15$), what is the Carnot limit? Give it to two decimals.
    answer: 6.38
    tolerance: 0.05
    answerText: '6.38'
    wrong:
      - { value: 11.6, feedback: 'You divided $T_c$ by the kitchen temperature $22$ °C, or by $T_h$ alone. The denominator is the **difference** $T_h - T_c = 40$ K.' }
      - { value: 0.45, feedback: 'You used Celsius: $18/40$. Ratios of temperatures need kelvin, where zero means no thermal motion at all.' }
    hint: $T_c = 255.15$ K, $T_h = 295.15$ K; the gap is $40$ K.
    explanation: |
      $$\begin{aligned}\mathrm{COP}_{\max} &= \frac{255.15}{295.15 - 255.15} \\ &= \frac{255.15}{40} = 6.38.\end{aligned}$$
      The fridge at $4$ °C had $15.4$: the freezer's limit is less than half.

  - type: mcq
    id: q-lift
    prompt: |
      At $40\%$ of the Carnot limit, a fridge section at $4$ °C has $\mathrm{COP} = 6.16$ and a freezer at $-18$ °C has $\mathrm{COP} = 2.55$, in the same $22$ °C kitchen. To remove $100$ W of heat, the freezer needs about $39$ W of electricity and the fridge about $16$ W. Why?
    options:
      - text: The freezer lifts heat across a bigger temperature gap, which costs more work per watt of heat moved.
        correct: true
      - text: The freezer holds more food, so it needs more heat removed per second.
        feedback: |
          Both machines were set to remove the same $100$ W. The difference comes from the work needed per watt, not from the amount of heat.
      - text: Colder things have more heat in them, so there is more to remove.
        feedback: |
          A colder body has **less** heat energy, not more. What grows is the effort to push a watt out of something colder into the same kitchen.
      - text: The kitchen is warmer for the freezer, so the lift is the same.
        feedback: |
          The kitchen stays at $22$ °C in both cases. Only the inside changes, from $4$ to $-18$ °C.
    explanation: |
      The lift grows from $18$ K to $40$ K, and the Carnot limit falls from $15.4$ to $6.38$. That is why the freezer costs more per watt of heat removed, and why a "smaller lift" (a fridge not set too cold) saves electricity.

  - type: text
    id: wall
    title: The walls set the load
    body: |
      What decides how much heat the fridge must remove? Mostly the heat that leaks in through the walls, the same conduction as in the lesson Ovens, Thermoses and Warm Jackets. Recall: a layer of thickness $L$, conductivity $k$ and area $A$ has resistance $R = L/(kA)$, and a temperature difference $\Delta T$ across it drives a flow
      $$\dot Q = \frac{\Delta T}{R}.$$
      **Setting.** A small fridge has walls with a total area $A = 4$ m$^2$, made of $L = 5$ cm of foam with $k = 0.033$ W/(m·K). The inside is $4$ °C and the kitchen $22$ °C, so $\Delta T = 18$ K. At steady state the fridge must remove exactly the heat that leaks in. The next two questions find it, then the electricity.

  - type: numeric
    id: q-leak
    prompt: |
      A fridge has foam walls of total area $A = 4$ m$^2$, thickness $L = 0.05$ m and conductivity $k = 0.033$ W/(m·K), with $18$ K between the kitchen and the inside. Using $R = L/(kA)$ and $\dot Q = \Delta T/R$, what heat flows in through the walls, in watts?
    answer: 47.5
    tolerance: 0.5
    answerText: '47.5'
    wrong:
      - { value: 0.0132, feedback: 'You multiplied by the thickness instead of dividing. Thicker foam leaks **less**.' }
      - { value: 14.3, feedback: 'You forgot the area, or used a single square metre. The heat flow is proportional to the total area of the walls, $4$ m$^2$.' }
    hint: First $R$ in K/W, then divide $18$ K by it.
    explanation: |
      $$R = \frac{0.05}{0.033\times 4} = 0.379\ \text{K/W}$$
      and so
      $$\dot Q_c = \frac{18}{0.379} = 47.5\ \text{W}.$$
      The fridge must take out $47.5$ W to hold its temperature.

  - type: numeric
    id: q-work
    prompt: |
      The fridge must remove $\dot Q_c = 47.5$ W to balance the leak, and its machine has $\mathrm{COP} = 3$. What electric power does the compressor use while this load is being removed, in watts?
    answer: 15.8
    tolerance: 0.2
    answerText: '15.8'
    wrong:
      - { value: 142.5, feedback: 'You multiplied by the COP. A COP above $1$ means the work is **smaller** than the heat moved: $\dot W = \dot Q_c/\mathrm{COP}$.' }
      - { value: 47.5, feedback: 'You treated the machine like a heater with COP $1$. A heat pump moves more heat than the work it uses.' }
    hint: From $\mathrm{COP} = \dot Q_c/\dot W$, solve for the work.
    explanation: |
      $$\dot W = \frac{\dot Q_c}{\mathrm{COP}} = \frac{47.5}{3} = 15.8\ \text{W}.$$
      If the foam were twice as thick, the leak and so the work would both be halved. Over a year this ideal case adds up to about $139$ kWh. A real fridge uses more: a full-size energy-efficient top-freezer model uses about $360$ kWh a year (roughly $40$ W on average), because it is bigger, is opened, gets warm food, and its machine is less ideal.

  - type: text
    id: summary
    body: |
      **Next:** the same machine, run in the other direction, can heat a house: air conditioning and heat pumps, where the refrigerant changing phase carries the heat and the COP decides the bill.
