outroTitle: Level 2 in one picture
outro: |
  **Balance** is a feedback loop; **torque** $\tau = F\,r$ and **gear ratios** trade force for speed, with power $P = \tau\omega$ unchanged. **Friction** $F = \mu m g$ removes the **kinetic energy** $\tfrac12 m v^{2}$, giving the braking distance $d = v^{2}/(2\mu g)$. **Momentum** $p = m v$ and **impulse** $F\,\Delta t = \Delta p$ explain crumple zones. A lock's keys number $D^{N}$. Together they make a design. Next, the **Level Review**, then the challenge.
