id: ch02-map
title: "Content Map: Forces and Motion"
kind: map
name: Level 2, Forces and Motion (balance, gears, friction, energy, impulse, locks)
intro: |
  Below is the **map of Level 2**: boxes for the main ideas, arrows from an idea to one built on it (a dashed arrow means "tool used in"). For each empty box you pick, among look-alike cards, the one that belongs there. Each wrong card hides a mistake that many people make, and the feedback says why it tempts.

  Four families of ideas: **balance and turning** (the bicycle loop, torque, gears), **friction and energy** (stopping, work, power), **time and force** (momentum, impulse) and **the lock** (how many keys). The last box combines them in one design.
cols: 3
nodes:
  - id: balance
    title: Balance is a feedback loop
    row: 1
    col: 1
    body: |
      A moving bicycle stays up because of a loop: the **sensor** feels the lean angle $\varphi$ (from the vertical), the **error** is the lean, and the **actuator** is the steering, which turns toward the fall. A turn of radius $r$ at speed $v$ needs the sideways acceleration $a = v^{2}/r$.
    decoys:
      - body: |
          A moving bicycle stays up because of a loop: the **sensor** feels the lean angle $\varphi$ (from the vertical), the **error** is the lean, and the **actuator** is the steering, which turns away from the fall. A turn of radius $r$ at speed $v$ needs the sideways acceleration $a = v^{2}/r$.
        feedback: |
          Turning away from the fall makes it worse. The steering must go under the falling side, like balancing a broom on a palm: the palm moves toward the lean.
      - body: |
          A moving bicycle stays up because a spinning wheel acts as a gyroscope that holds it upright: no loop is needed. A turn of radius $r$ at speed $v$ needs the sideways acceleration $a = v/r$.
        feedback: |
          The gyroscope effect is small, and bikes balance without it. Also the acceleration of a turn is $v^{2}/r$: it grows with the square of the speed, so doubling the speed needs $4\times$ the sideways push.
    explanation: |
      A rider at $5$ m/s in a turn of radius $10$ m needs $a = 2.5\ \mathrm{m/s^2}$, which means a lean of about $14^\circ$ ($\tan\varphi = a/g$).
  - id: torque
    title: Torque
    row: 1
    col: 2
    body: |
      The turning effect of a force $F$ acting at a perpendicular distance $r$ from the pivot is the **torque**
      $$\tau = F\,r\qquad(\text{N m})$$
      A lever balances when $F_{1}r_{1} = F_{2}r_{2}$.
    decoys:
      - body: |
          The turning effect of a force $F$ acting at a perpendicular distance $r$ from the pivot is the **torque**
          $$\tau = \frac{F}{r}\qquad(\text{N m})$$
          A lever balances when $F_{1}/r_{1} = F_{2}/r_{2}$.
        feedback: |
          Then a long wrench would turn *less*. Everyone knows a longer handle turns a stuck bolt more easily: torque grows with the distance.
      - body: |
          The turning effect of a force $F$ acting at a perpendicular distance $r$ from the pivot is the **torque**
          $$\tau = F + r\qquad(\text{N m})$$
          A lever balances when $F_{1} + r_{1} = F_{2} + r_{2}$.
        feedback: |
          A newton and a metre cannot be added: they are different kinds of quantity. The effect of a push is multiplied by its lever arm.
    explanation: |
      A $100$ N hand push at $0.3$ m gives $30$ N m, which holds a bolt that resists with $40$ N m; at $0.5$ m it gives $50$ N m and the bolt turns.
  - id: ratio
    title: Gear ratio
    row: 1
    col: 3
    body: |
      A driver gear with $N_{1}$ teeth turns a driven gear with $N_{2}$ teeth. The ratio changes torque and speed in opposite ways:
      $$\tau_{2} = \tau_{1}\,\frac{N_{2}}{N_{1}},\qquad \omega_{2} = \omega_{1}\,\frac{N_{1}}{N_{2}}$$
      where $\omega$ is the turning speed. Chainring $48$, cog $16$: ratio $3$.
    decoys:
      - body: |
          A driver gear with $N_{1}$ teeth turns a driven gear with $N_{2}$ teeth. The ratio changes torque and speed in the same way:
          $$\tau_{2} = \tau_{1}\,\frac{N_{2}}{N_{1}},\qquad \omega_{2} = \omega_{1}\,\frac{N_{2}}{N_{1}}$$
          where $\omega$ is the turning speed. Chainring $48$, cog $16$: ratio $3$.
        feedback: |
          Then the gears would give more of both for free. A bigger driven gear turns slower but pulls harder: you trade speed for torque, never gain both.
      - body: |
          A driver gear with $N_{1}$ teeth turns a driven gear with $N_{2}$ teeth. The ratio changes torque and speed in opposite ways:
          $$\tau_{2} = \tau_{1}\,\frac{N_{1}}{N_{2}},\qquad \omega_{2} = \omega_{1}\,\frac{N_{1}}{N_{2}}$$
          where $\omega$ is the turning speed. Chainring $48$, cog $16$: ratio $3$.
        feedback: |
          The torque line is upside down. Torque and speed must go in opposite ways, so the factor for $\tau$ is the inverse of the one for $\omega$.
    explanation: |
      With $12$ N m on a $30$-tooth driver and a $90$-tooth driven gear the torque becomes $36$ N m and the turning speed drops to a third.
  - id: friction
    title: Friction
    row: 2
    col: 1
    body: |
      Sliding friction has the size
      $$F = \mu N = \mu\,m g$$
      on level ground, with $\mu$ a pure number (about $0.7$ dry, $0.4$ wet, $0.1$ ice). A rolling wheel that does not slip grips better than a locked, sliding one; ABS keeps the wheel just short of locking, a feedback loop.
    decoys:
      - body: |
          Sliding friction has the size
          $$F = \mu N = \mu\,m g$$
          on level ground, with $\mu$ a pure number (about $0.7$ dry, $0.4$ wet, $0.1$ ice). A locked, sliding wheel grips better than a rolling one, so a hard stomp on the pedal is always best.
        feedback: |
          Reversed. A sliding tyre loses grip (the road acts on a skidding patch), and the car can no longer steer. ABS releases the brake just before locking to keep the better rolling grip.
      - body: |
          Sliding friction has the size
          $$F = \mu N = \mu\,m g$$
          on level ground, with $\mu$ measured in newtons (about $700$ dry, $400$ wet, $100$ ice). ABS keeps the wheel just short of locking.
        feedback: |
          $\mu$ is a ratio of two forces, so it has no unit. The force itself comes from multiplying it by the weight $mg$.
    explanation: |
      A $1000$ kg car on dry road ($\mu = 0.7$) has a friction force of $6860$ N; on a wet road ($0.4$), $3920$ N.
  - id: work
    title: Work and kinetic energy
    row: 2
    col: 2
    body: |
      A force $F$ pushing along a distance $d$ does the **work** $W = F\,d$ (joules). Moving a mass $m$ at speed $v$ stores the **kinetic energy**
      $$E_{k} = \tfrac12 m v^{2}$$
      and stopping it means removing exactly that energy: $F\,d = \tfrac12 m v^{2}$.
    decoys:
      - body: |
          A force $F$ pushing along a distance $d$ does the **work** $W = F\,d$ (joules). Moving a mass $m$ at speed $v$ stores the **kinetic energy**
          $$E_{k} = m v$$
          and stopping it means removing exactly that energy: $F\,d = m v$.
        feedback: |
          $m v$ is the momentum, a different quantity (units kg m/s, not joules). Kinetic energy grows with the square of the speed, and has the factor $\tfrac12$.
      - body: |
          A force $F$ pushing along a distance $d$ does the **work** $W = F\,t$ (joules). Moving a mass $m$ at speed $v$ stores the **kinetic energy**
          $$E_{k} = \tfrac12 m v^{2}$$
          and stopping it means removing exactly that energy: $F\,t = \tfrac12 m v^{2}$.
        feedback: |
          Work is force over a *distance*, not over a time. Force times time is the impulse, which is a different quantity (see the momentum box).
    explanation: |
      A $90$ kg e-bike and rider at $10$ m/s carry $\tfrac12\cdot 90\cdot 10^{2} = 4500$ J.
  - id: power
    title: Power
    row: 2
    col: 3
    body: |
      **Power** is work (or energy) per second. For a force $F$ pulling at speed $v$, or a turning shaft with torque $\tau$ and speed $\omega$:
      $$P = F\,v,\qquad P = \tau\,\omega$$
      A counterweight does not change the work needed; it lets a small motor supply it.
    decoys:
      - body: |
          **Power** is work (or energy) per second. For a force $F$ pulling at speed $v$, or a turning shaft with torque $\tau$ and speed $\omega$:
          $$P = F\,v,\qquad P = \frac{\tau}{\omega}$$
          A counterweight reduces the work needed to lift the cabin.
        feedback: |
          Both lines are slips. A turning shaft has the same form as the straight one, a product: $\tau\omega$. And lifting the cabin still takes $mgh$ of work; the counterweight provides some of it by falling.
      - body: |
          **Power** is the energy a machine stores. For a force $F$ pulling at speed $v$, or a turning shaft with torque $\tau$ and speed $\omega$:
          $$P = F\,v,\qquad P = \tau\,\omega$$
          A counterweight does not change the work needed; it lets a small motor supply it.
        feedback: |
          Power is a *rate*, joules per second (watts), not an amount of stored energy. A big battery can feed a small power.
    explanation: |
      A motor holding $1470$ N while raising the cabin at $2$ m/s gives $2.94$ kW; with no counterweight it would need $15.68$ kW.
  - id: kinetic
    title: Braking distance
    row: 3
    col: 1
    body: |
      Setting the friction work equal to the kinetic energy, $\mu m g\,d = \tfrac12 m v^{2}$, the mass cancels:
      $$d = \frac{v^{2}}{2\mu g}$$
      so doubling the speed gives a stopping distance $4\times$ longer. A car at $15$ m/s on a wet road ($\mu = 0.4$) needs about $28.7$ m.
    decoys:
      - body: |
          Setting the friction work equal to the kinetic energy, $\mu m g\,d = \tfrac12 m v^{2}$, the mass stays in the result:
          $$d = \frac{m v^{2}}{2\mu g}$$
          so a heavier vehicle always needs a longer distance on the same road.
        feedback: |
          Mass appears on both sides and cancels: a heavier vehicle has more energy to remove, but also a proportionally larger friction force. A $2000$ kg van and a $1000$ kg car stop in the same distance.
      - body: |
          Setting the friction work equal to the kinetic energy, $\mu m g\,d = \tfrac12 m v^{2}$, the mass cancels:
          $$d = \frac{v}{2\mu g}$$
          so doubling the speed gives a stopping distance twice as long.
        feedback: |
          The speed in the energy is squared, so it is squared in the distance. Going from $50$ to $100$ km/h needs four times the road, not twice.
    explanation: |
      On a dry road ($\mu = 0.7$) the same car needs $16.4$ m. Adding a $1$ s reaction time at $10$ m/s adds another $10$ m of travel before the brakes even start.
  - id: momentum
    title: Momentum
    row: 3
    col: 3
    body: |
      The **momentum** of a mass $m$ moving at speed $v$ is
      $$p = m v\qquad(\text{kg m/s})$$
      It is a different quantity from kinetic energy: $p$ grows in proportion to $v$, while $E_{k}$ grows as $v^{2}$.
    decoys:
      - body: |
          The **momentum** of a mass $m$ moving at speed $v$ is
          $$p = \tfrac12 m v^{2}\qquad(\text{kg m/s})$$
          It is the same quantity as kinetic energy.
        feedback: |
          That formula is the kinetic energy, in joules. Momentum is mass times speed, and, unlike energy, it points in a direction.
      - body: |
          The **momentum** of a mass $m$ moving at speed $v$ is
          $$p = \frac{m}{v}\qquad(\text{kg/(m/s)})$$
          It is smaller the faster the mass moves.
        feedback: |
          A faster mass is harder to stop, so its momentum must be larger. It is the product $m v$, not the ratio.
    explanation: |
      A $1200$ kg car at $15$ m/s has $p = 18000$ kg m/s; at $30$ m/s, double that, but its kinetic energy is four times larger.
  - id: impulse
    title: Impulse and crumple zones
    row: 4
    col: 3
    body: |
      A force $F$ acting for a time $\Delta t$ gives the **impulse** $J = F\,\Delta t$, which equals the change of momentum $\Delta p$. To stop a mass $m$ from $v$:
      $$F = \frac{m v}{\Delta t}$$
      A longer stop (a crumple zone, an airbag) has the same impulse but a smaller force.
    decoys:
      - body: |
          A force $F$ acting for a time $\Delta t$ gives the **impulse** $J = F\,\Delta t$, which equals the change of momentum $\Delta p$. To stop a mass $m$ from $v$:
          $$F = m v\,\Delta t$$
          A longer stop has a larger impulse, so a larger force.
        feedback: |
          The impulse is fixed by the mass and speed, $m v$; the time only decides how it is shared. A longer stop spreads the same impulse, so the force is divided by the time.
      - body: |
          A force $F$ acting for a time $\Delta t$ gives the **impulse** $J = F\,\Delta t$, which equals the change of kinetic energy. To stop a mass $m$ from $v$:
          $$F = \frac{m v}{\Delta t}$$
          A longer stop (a crumple zone, an airbag) has the same impulse but a smaller force.
        feedback: |
          Impulse equals the change of *momentum*, in N s. The change of kinetic energy is the work $F d$ over a distance. Same crash, two different bookkeepings.
    explanation: |
      The $1200$ kg car at $15$ m/s has $J = 18000$ N s: stopping in $0.1$ s takes $180$ kN, in $0.5$ s only $36$ kN.
  - id: shear
    title: The shear line
    row: 4
    col: 1
    body: |
      In a pin-tumbler lock each pin stack is split in two, and only the right key cut lifts the split exactly to the **shear line**, so the cylinder turns. With $N$ pins and $D$ depths there are at most
      $$D^{N}\ \text{keys}$$
      and manufacturing tolerance lowers the usable $D$. For $N = 5$, $D = 6$: $7776$ keys.
    decoys:
      - body: |
          In a pin-tumbler lock each pin stack is split in two, and any key lifting most of the pins to the **shear line** turns the cylinder. With $N$ pins and $D$ depths there are at most
          $$N^{D}\ \text{keys}$$
          and manufacturing tolerance lowers the usable $D$. For $N = 5$, $D = 6$: $15625$ keys.
        feedback: |
          Every pin must be at the shear line, not most of them: one pin off and the cylinder stays blocked. And each of the $N$ pins independently picks one of $D$ depths, giving $D^{N}$, not $N^{D}$.
      - body: |
          In a pin-tumbler lock each pin stack is split in two, and only the right key cut lifts the split exactly to the **shear line**, so the cylinder turns. With $N$ pins and $D$ depths there are at most
          $$N\times D\ \text{keys}$$
          and manufacturing tolerance lowers the usable $D$. For $N = 5$, $D = 6$: $30$ keys.
        feedback: |
          $N\times D$ is the number of tries a picker needs, one pin at a time. The number of keys multiplies the choices of all pins: $6\times6\times6\times6\times6 = 7776$.
    explanation: |
      Tolerance of one depth step leaves about $4$ usable depths: $4^{5} = 1024$ keys. Security pins (such as spool-shaped ones) make the picker's pin-by-pin approach harder.
  - id: combo
    title: Combining the pieces
    row: 4
    col: 2
    body: |
      A real stop adds a reaction distance to the braking distance: $d_{\text{total}} = v\,t_{\text{react}} + v^{2}/(2\mu g)$. A real design picks a gear ratio for the torque a hill needs and a crumple length for the force a body can take: each one meets the same tradeoff, speed against force.
    decoys:
      - body: |
          A real stop is only the braking distance, $d = v^{2}/(2\mu g)$: the rider reacts instantly. A real design picks the best gear ratio, which wins in every situation.
        feedback: |
          Two slips. A rider takes about $1$ s to react, adding $v\,t_{\text{react}}$ before the brakes begin ($10$ m at $10$ m/s). And no gear wins everywhere: a low ratio climbs, a high ratio cruises.
      - body: |
          A real stop adds a reaction distance to the braking distance: $d_{\text{total}} = v\,t_{\text{react}} \times v^{2}/(2\mu g)$. A real design never needs to trade anything.
        feedback: |
          Distances add: metres plus metres. And every design in this level traded something: gears speed for torque, airbags force for time, locks keys for tolerance.
    explanation: |
      The e-bike (90 kg, $10$ m/s, wet road) stops in $12.76$ m after the brake starts, but with a $1$ s reaction it needs $22.76$ m, more than the $20$ m to the junction.
