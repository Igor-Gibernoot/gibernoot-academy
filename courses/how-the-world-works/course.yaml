    lessons:
      - id: ch07-grid
        title: "The Grid: Supply Must Equal Demand"
        kind: concept
        summary: "Every second the power made must equal the power used; the grid frequency is the signal, and spinning machines are its buffer."
      - id: ch07-fission
        title: "Fission and the Nuclear Reactor"
        kind: concept
        summary: "How splitting a heavy nucleus releases energy, how a chain reaction is held steady, and what a reactor really is: a very hot kettle."
      - id: ch07-radiation
        title: "Radiation: Smoke Detectors, Geiger Counters and Dose"
        kind: concept
