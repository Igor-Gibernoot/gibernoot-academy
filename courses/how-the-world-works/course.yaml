      - id: ch07-wind
        title: "Wind Turbines"
        kind: concept
        summary: "Power grows with the cube of wind speed, and no turbine can take more than 59 percent of the wind: the Betz limit."
      - id: ch07-solarfarm
        title: "Solar Farms, Storage and the Evening Problem"
        kind: concept
