        kind: concept
        file: ch02/gears.yaml
        summary: "Trade force for distance: a bike's gears, wrenches and the idea of torque."
      - id: ch02-brakes
        title: "Brakes and Friction"
        kind: concept
        file: ch02/brakes.yaml
        summary: "Friction as the force that stops you, and where the kinetic energy goes."
      - id: ch02-brakes-heat
        title: "Brakes Turn Motion Into Heat"
        kind: concept
        file: ch02/brakes-heat.yaml
        summary: "How hot a brake disc gets, why a locked wheel stops worse than a rolling one, and ABS as a feedback loop."
      - id: ch02-lock
