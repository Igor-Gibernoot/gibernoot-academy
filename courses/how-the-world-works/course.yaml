# The trail. One level per theme, lessons in trail order. There is no main book:
# the level list is the course's own spine (see CLAUDE.md and REFERENCES.md).
#
# A lesson entry with `file:` is built and playable; without it, it shows as
# a planned (greyed) node. `kind` is concept | guided | traps | intuition, plus
# the end-of-level kinds: map (content-map puzzle), review (automatic, no file:
# practises only this level's questions) and challenge (a deep dive into one
# technology using every idea so far).
# Exams: own levels exam-partial1 (after Level 7, covers 2-7), exam-partial2 (after Level 13, covers 8-13)
# and exam-final (after Level 19, covers 14-19). No exam covers more than 6 levels (root CLAUDE.md, Exam).

title: How the World Works

levels:
  - id: ch01
    number: 1
    title: "Seeing the World as an Engineer"
    blurb: "A light tour: sizes, energy, signals and tradeoffs, through everyday puzzles you can guess before any theory."
    lessons:
      - id: ch01-scales
        title: "How Big, How Fast, How Much?"
        kind: concept
        file: ch01/scales.yaml
        summary: "Guess the size and speed of everyday things, and learn why orders of magnitude are the engineer's first tool."
      - id: ch01-energy
        title: "Everything Costs Energy"
        kind: concept
        file: ch01/energy.yaml
        summary: "Where the energy of a phone charge, a meal and a bike ride goes, and why some of it always ends up as heat."
      - id: ch01-feedback
        title: "The Thermostat and Other Loops"
        kind: concept
        file: ch01/feedback.yaml
        summary: "A machine that corrects itself: sensing, comparing, acting. Feedback in a thermostat, a toilet float and cruise control."
      - id: ch01-tradeoffs
        title: "Every Design Is a Compromise"
        kind: concept
        file: ch01/tradeoffs.yaml
        summary: "Strength against weight, speed against power: why no machine is best at everything."
      - id: ch01-tour
        title: "A Puzzle for Every Level"
        kind: concept
        file: ch01/tour.yaml
        summary: "One guessing puzzle for each later level, and a table that maps each puzzle to the level that solves it."
      - id: ch01-traps
        title: "Traps"
        kind: traps
        file: ch01/traps.yaml
        summary: "Fast questions, each built on a common misconception."
      - id: ch01-map
        title: "Content Map"
        kind: map
        file: ch01/map.yaml
        summary: "Rebuild the level's concept map box by box among look-alike decoys."
      - { id: ch01-review, title: Level Review, kind: review }
      - id: ch01-challenge
        title: "Level Challenge: The Electric Bicycle"
        kind: challenge
        file: ch01/challenge.yaml
        summary: "A short, playful problem set that uses sizes, energy and feedback together. (Deep dive.)"

