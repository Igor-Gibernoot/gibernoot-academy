id: ch03-map
title: "Content Map: Structures and Materials"
kind: map
name: Level 3, Structures and Materials (arches, beams, trusses, concrete and steel, sway, flutter, earthquakes)
intro: |
  Below is the **map of Level 3**: boxes for the main ideas, arrows from an idea to one built on it (a dashed arrow means "tool used in"). For each empty box you pick, among look-alike cards, the one that belongs there. Each wrong card hides a mistake that many people make, and the feedback says why it tempts.

  Three families of ideas: **shape** (the arch, the beam, the truss), **material** (concrete and steel) and **motion** (natural frequency, the tuned mass damper, wind flutter, earthquakes and base isolation). A structure must first carry its load, and then survive the way it moves.
cols: 3
nodes:
  - id: arch
    title: Arch thrust
    row: 1
    col: 1
    body: |
      An arch of span $L$ and rise $h$ under a uniform load $w$ (kN per metre of span) pushes sideways on its supports with the **thrust**
      $$H = \frac{w L^{2}}{8h}$$
      A flatter arch pushes harder. For $L = 40$ m, $h = 5$ m, $w = 10$ kN/m, $H = 400$ kN; with $h = 2.5$ m, $H = 800$ kN.
    decoys:
      - body: |
          An arch of span $L$ and rise $h$ under a uniform load $w$ (kN per metre of span) pushes sideways on its supports with the **thrust**
          $$H = \frac{w L^{2} h}{8}$$
          A taller arch pushes harder. For $L = 40$ m, $h = 5$ m, $w = 10$ kN/m, $H = 10\,000$ kN; with $h = 2.5$ m, $H = 5000$ kN.
        feedback: |
          Then a nearly flat arch would push almost nothing, yet a flat arch is the dangerous one: the load must be carried by an almost horizontal push. The rise goes in the denominator, so halving $h$ doubles $H$.
      - body: |
          An arch of span $L$ and rise $h$ under a uniform load $w$ (kN per metre of span) pushes sideways on its supports with the **thrust**
          $$H = \frac{w L^{2}}{8h}$$
          A flatter arch pushes less. For $L = 40$ m, $h = 5$ m, $w = 10$ kN/m, $H = 400$ kN; with $h = 2.5$ m, $H = 200$ kN.
        feedback: |
          The formula is right but the reading is upside down: halving $h$ halves the denominator and doubles $H$ to $800$ kN. This is why a flat bridge deck cannot be an arch without a strong tie or very firm abutments.
    explanation: |
      The thrust is a squeeze along the ring, so the arch suits stone and concrete. A suspension cable hangs in the same kind of curve but is pulled instead.
  - id: beam
    title: Bending of a beam
    row: 1
    col: 2
    body: |
      A beam of span $L$ with a load $P$ at midspan has the bending moment $M = PL/4$, and the stress at its extreme fibre is $\sigma = My/I$. For a rectangle of width $b$ and depth $h$
      $$I = \frac{b h^{3}}{12}$$
      so doubling the depth makes $I$ eight times larger. A $0.1\times0.3$ m plank on edge is $9$ times stiffer than laid flat.
    decoys:
      - body: |
          A beam of span $L$ with a load $P$ at midspan has the bending moment $M = PL/4$, and the stress at its extreme fibre is $\sigma = My/I$. For a rectangle of width $b$ and depth $h$
          $$I = \frac{b h^{2}}{12}$$
          so doubling the depth makes $I$ four times larger. A $0.1\times0.3$ m plank on edge is $3$ times stiffer than laid flat.
        feedback: |
          The depth enters as a cube, not a square: material far from the middle is both pulled harder and has a longer lever arm, and the two effects multiply. Doubling the depth gives $2^{3} = 8$.
      - body: |
          A beam of span $L$ with a load $P$ at midspan has the bending moment $M = PL/4$, and the stress at its extreme fibre is $\sigma = My/I$. For a rectangle of width $b$ and depth $h$
          $$I = \frac{b^{3} h}{12}$$
          so doubling the depth makes $I$ twice larger. A $0.1\times0.3$ m plank on edge is as stiff as laid flat.
        feedback: |
          That has the width and depth swapped. Everyone knows a plank is stiff on its edge and floppy flat; the depth (the direction of the load) carries the cube.
    explanation: |
      The I-beam uses this: most of the steel sits in two thin flanges far from the middle, and a thin web holds them apart.
  - id: truss
    title: The triangle and the truss
    row: 1
    col: 3
    body: |
      A frame of $j$ pin joints and $m$ bars is just rigid when
      $$m = 2j - 3$$
      The triangle ($j = 3$, $m = 3$) is the basic rigid shape, and every bar carries only tension or compression along its length. A hexagon needs $9$ bars, not $6$.
    decoys:
      - body: |
          A frame of $j$ pin joints and $m$ bars is just rigid when
          $$m = j$$
          Any closed polygon is rigid, and every bar carries only tension or compression along its length. A hexagon needs $6$ bars, not $9$.
        feedback: |
          A closed square of four bars can still shear into a rhombus. Only the triangle cannot change shape without a bar changing length; a hexagon of $6$ bars needs $3$ more diagonals.
      - body: |
          A frame of $j$ pin joints and $m$ bars is just rigid when
          $$m = 2j$$
          The triangle ($j = 3$) needs $6$ bars, and every bar carries only tension or compression along its length. A hexagon needs $12$ bars, not $9$.
        feedback: |
          That counts two freedoms per joint but forgets that the whole frame may move as one piece: $3$ of those freedoms (two shifts and one turn) are allowed. Subtract them and $m = 2j - 3$.
    explanation: |
      In a Warren truss of span $16$ m and height $3$ m under $40$ kN at midspan, the middle top bar is squeezed with $M/h = 160/3 = 53.3$ kN, and the middle bottom bar is pulled.
  - id: materials
    title: Concrete and steel
    row: 2
    col: 1
    body: |
      Stress is force per area, $\sigma = F/A$. Concrete is strong squeezed (typically about $20$ to $40$ MPa) and weak pulled (about a tenth of that). So **rebar** (steel, yield about $420$ MPa) goes at the bottom of a beam, where it is pulled, and **prestress** squeezes the concrete first: a bottom pull of $8$ MPa minus a prestress of $6$ MPa leaves only $2$ MPa.
    decoys:
      - body: |
          Stress is force per area, $\sigma = F\,A$. Concrete is strong squeezed (typically about $20$ to $40$ MPa) and weak pulled (about a tenth of that). So **rebar** (steel, yield about $420$ MPa) goes at the top of a beam, where it is pulled, and **prestress** squeezes the concrete first: a bottom pull of $8$ MPa minus a prestress of $6$ MPa leaves only $2$ MPa.
        feedback: |
          Two slips. A bigger area spreads the same force thinner, so $A$ divides: $\sigma = F/A$. And a beam resting on two ends sags, so its bottom is the stretched side; rebar there is where the concrete would crack.
      - body: |
          Stress is force per area, $\sigma = F/A$. Concrete is strong squeezed (typically about $20$ to $40$ MPa) and weak pulled (about a tenth of that). So **rebar** (steel, yield about $420$ MPa) goes at the bottom of a beam, where it is pulled, and **prestress** stretches the concrete first: a bottom pull of $8$ MPa plus a prestress of $6$ MPa gives $14$ MPa.
        feedback: |
          Prestress works the other way: steel cables kept in tension push the concrete into a squeeze before any load comes. The service pull then has to use up that squeeze first, and $8 - 6 = 2$ MPa is below the crack limit.
    explanation: |
      Steel and concrete expand almost equally with temperature ($12\times10^{-6}$ and $10\times10^{-6}$ per kelvin), which is why the two can be married without tearing apart.
  - id: natfreq
    title: Natural frequency and resonance
    row: 2
    col: 2
    body: |
      A tower of mass $m$ and stiffness $k$ (force per metre of sway) swings by itself at the **natural frequency**
      $$f_{0} = \frac{1}{2\pi}\sqrt{\frac{k}{m}}$$
      Pushed steadily at $f_{0}$ with damping ratio $\zeta$, it sways $D/(2\zeta)$, where $D$ is the sway under a steady push. For $m = 2.5\times10^{7}$ kg and $k = 2.2\times10^{7}$ N/m, $f_{0} = 0.149$ Hz; with $\zeta = 0.01$ the peak is $50\,D$.
    decoys:
      - body: |
          A tower of mass $m$ and stiffness $k$ (force per metre of sway) swings by itself at the **natural frequency**
          $$f_{0} = \frac{1}{2\pi}\sqrt{\frac{m}{k}}$$
          Pushed steadily at $f_{0}$ with damping ratio $\zeta$, it sways $D/(2\zeta)$, where $D$ is the sway under a steady push. A heavier tower sways faster, and a stiffer one slower.
        feedback: |
          Upside down. A stiffer tower snaps back harder and so swings faster; a heavier one is slower to move. Put $k$ on top and $m$ below.
      - body: |
          A tower of mass $m$ and stiffness $k$ (force per metre of sway) swings by itself at the **natural frequency**
          $$f_{0} = \frac{1}{2\pi}\sqrt{\frac{k}{m}}$$
          Pushed steadily at $f_{0}$ with damping ratio $\zeta$, it sways $2\zeta D$, where $D$ is the sway under a steady push. With $\zeta = 0.01$ the peak is only $0.02\,D$.
        feedback: |
          Then more damping would make resonance worse, and a nearly undamped tower would be safe. It is the reverse: the peak is $D/(2\zeta)$, so small damping gives a huge swing ($50\,D$ at $\zeta = 0.01$).
    explanation: |
      Resonance means a push repeated at the natural frequency builds up swing swing after swing, like pushing a child on a swing at the right moments.
  - id: tmd
    title: Tuned mass damper
    row: 2
    col: 3
    body: |
      A hanging mass with mass ratio $\mu = m_{d}/m$, tuned to $\nu = f_{d}/f_{0}\approx 1/(1+\mu)$, moves against the sway and turns the motion into heat. With $\zeta = 0.01$, a damper of $\mu = 2\%$ cuts the peak from $50\,D$ to $8.7\,D$; badly tuned ($\nu = 0.8$) it only reaches $26.8\,D$.
    decoys:
      - body: |
          A hanging mass with mass ratio $\mu = m_{d}/m$, tuned to $\nu = f_{d}/f_{0}\approx 1+\mu$, moves against the sway and turns the motion into heat. With $\zeta = 0.01$, a damper of $\mu = 2\%$ cuts the peak from $50\,D$ to $8.7\,D$; badly tuned ($\nu = 0.8$) it only reaches $26.8\,D$.
        feedback: |
          The tuning goes the other way: the damper is set slightly slower than the tower, $\nu\approx 1/(1+\mu) = 0.98$ for $\mu = 2\%$, not $1.02$.
      - body: |
          A hanging mass with mass ratio $\mu = m_{d}/m$, tuned to $\nu = f_{d}/f_{0}\approx 1/(1+\mu)$, works by its weight alone. With $\zeta = 0.01$, a damper of $\mu = 2\%$ cuts the peak from $50\,D$ to $8.7\,D$; badly tuned ($\nu = 0.8$) it does just as well.
        feedback: |
          Tuning is the whole point. A damper at $\nu = 0.8$ leaves $26.8\,D$, three times worse than the tuned $8.7\,D$. A light mass helps only because it moves against the sway at the right rhythm.
    explanation: |
      Taipei 101 hangs a steel ball of about $660$ tonnes near the top for the same job.
  - id: flutter
    title: Flutter (Tacoma Narrows)
    row: 3
    col: 1
    body: |
      In a wind of speed $U$ the twist of a deck has the effective damping
      $$\zeta_{\text{eff}} = \zeta_{s}\left(1 - \frac{U}{U_{c}}\right)$$
      Above the critical speed $U_{c}$ it is negative: the wind feeds the twist and each swing is bigger than the last. In the model $\zeta_{s} = 0.04$, $U_{c} = 35$ mph: at $52.5$ mph, $\zeta_{\text{eff}} = -0.02$ and the swing grows by $1.134$ per cycle.
    decoys:
      - body: |
          In a wind of speed $U$ the twist of a deck has the effective damping
          $$\zeta_{\text{eff}} = \zeta_{s}\left(1 + \frac{U}{U_{c}}\right)$$
          So wind only adds damping: the 1940 bridge fell because a steady wind matched its twist frequency by plain resonance, with vortices shed at about $0.2$ Hz.
        feedback: |
          Wind can take damping away as well as add it. In flutter the motion itself changes the wind force so that it pushes along with the twist. And the vortices of that wind shed at about $1$ Hz, not at the $0.2$ Hz twist, so plain resonance was not the cause.
      - body: |
          In a wind of speed $U$ the twist of a deck has the effective damping
          $$\zeta_{\text{eff}} = \zeta_{s}\left(1 - \frac{U}{U_{c}}\right)$$
          Above the critical speed $U_{c}$ the swing still decays, only slower, so a heavy enough deck is safe in any wind.
        feedback: |
          Above $U_{c}$ the sign flips and the damping is negative: the swing grows. More mass does not remove the sign change; the cure is to raise $U_{c}$ (a stiffer, deeper, more open deck).
    explanation: |
      The difference from resonance: no outside rhythm drives the bridge. A steady wind is enough, because the motion itself keeps feeding the energy in.
  - id: quake
    title: Earthquakes and soil period
    row: 3
    col: 2
    body: |
      A building of $N$ storeys has a period of roughly $T\approx 0.1\ \mathrm{s}\times N$. A soil layer of depth $H$ and shear-wave speed $v_{s}$ has its own period
      $$T_{\text{soil}} = \frac{4H}{v_{s}}$$
      The danger is when the two match. For $H = 40$ m and $v_{s} = 100$ m/s, $T_{\text{soil}} = 1.6$ s, which is the rough period of a $16$-storey block.
    decoys:
      - body: |
          A building of $N$ storeys has a period of roughly $T\approx 0.1\ \mathrm{s}\times N$. A soil layer of depth $H$ and shear-wave speed $v_{s}$ has its own period
          $$T_{\text{soil}} = \frac{H}{4v_{s}}$$
          The danger is when the two match. For $H = 40$ m and $v_{s} = 100$ m/s, $T_{\text{soil}} = 0.1$ s, which is the rough period of a $1$-storey house.
        feedback: |
          The factor $4$ belongs on top: a wave travels down and back and the layer rings in a quarter-wave, so $T = 4H/v_{s}$. A deeper, softer layer rings slower, not faster.
      - body: |
          A building of $N$ storeys has a period of roughly $T\approx 0.1\ \mathrm{s}\times N$. A soil layer of depth $H$ and shear-wave speed $v_{s}$ has its own period
          $$T_{\text{soil}} = \frac{4H}{v_{s}}$$
          The danger is when the two differ most. For $H = 40$ m and $v_{s} = 100$ m/s, $T_{\text{soil}} = 1.6$ s, which is far from every building.
        feedback: |
          Matching periods is resonance: the soil shakes the building at its own natural rhythm, and the swing builds up. Mexico City 1985 is the story: soft lake bed, buildings of the matching height.
    explanation: |
      The $0.1\ \mathrm{s}$ per storey rule is rough (some towers are well outside it), so it points to the risk and does not replace a calculation.
  - id: isolation
    title: Base isolation
    row: 3
    col: 3
    body: |
      Soft bearings under the building cut its stiffness $k$ by $16$, so $f_{0}$ falls to a quarter ($1$ Hz to $0.25$ Hz, $T$ from $1$ s to $4$ s). Ground shaking at $0.4$ Hz is then above $f_{0}$, and the response falls to $0.61\,D$ (with $\zeta = 0.15$). The price is a large movement in the bearings: $0.47$ m for $0.3$ m of ground.
    decoys:
      - body: |
          Soft bearings under the building cut its stiffness $k$ by $16$, so $f_{0}$ falls to a sixteenth ($1$ Hz to $0.06$ Hz, $T$ from $1$ s to $16$ s). Ground shaking at $0.4$ Hz is then above $f_{0}$, and the response falls to $0.61\,D$ (with $\zeta = 0.15$). The price is a large movement in the bearings: $0.47$ m for $0.3$ m of ground.
        feedback: |
          The frequency goes as $\sqrt{k/m}$, so dividing $k$ by $16$ divides $f_{0}$ by $\sqrt{16} = 4$, not by $16$.
      - body: |
          Soft bearings under the building cut its stiffness $k$ by $16$, so $f_{0}$ falls to a quarter ($1$ Hz to $0.25$ Hz, $T$ from $1$ s to $4$ s). A $2.5$ s isolation would also be safe at $0.4$ Hz shaking, and there is no price: the building simply stays still.
        feedback: |
          A period of $2.5$ s is a frequency of $0.4$ Hz, exactly the shaking: resonance again. And the building does not stay still; the bearings stretch, so a gap around the building is needed.
    explanation: |
      Isolation does not fight the shaking. It unplugs the building from it, by moving the natural frequency far below the frequencies the ground carries.
