outroTitle: Level 3 in one picture
outro: |
  A structure first carries its load. An **arch** pushes outward with $H = wL^{2}/(8h)$, a **beam** resists bending with $I = bh^{3}/12$, and a **truss** stays rigid with $m = 2j-3$ bars. **Concrete** is strong squeezed and weak pulled, so **steel** and prestress cover the pulled side. Then it must survive how it moves: its **natural frequency** $f_{0} = \frac{1}{2\pi}\sqrt{k/m}$ sets the resonance peak $D/(2\zeta)$, a **tuned mass damper** takes the peak down, **flutter** is wind feeding negative damping, and **earthquakes** are dangerous when the soil period $4H/v_{s}$ matches the building, which **base isolation** escapes by lowering $f_{0}$. Next, the **Level Review**, then the challenge.
