outroTitle: Level 4 in one picture
outro: |
  For particles with momenta $\mathbf p_\alpha$, the internal forces cancel in pairs (third law), so $\dot{\mathbf P} = \mathbf F^{\text{ext}}$ and $\mathbf P$ is constant when no outside force acts. A **rocket** pushes on its exhaust, $m\,dv = -v_{\text{ex}}\,dm$, so $v - v_0 = v_{\text{ex}}\ln(m_0/m)$. The **center of mass** $\mathbf R = \tfrac1M\sum m_\alpha\mathbf r_\alpha$ obeys $\mathbf F^{\text{ext}} = M\ddot{\mathbf R}$. For rotation, $\mathbf L = \mathbf r\times\mathbf p$ and $\mathbf N = \mathbf r\times\mathbf F$ give $\dot{\mathbf L} = \mathbf N$; a central force has $\mathbf N = \mathbf 0$ and so sweeps equal areas, $dA/dt = L/2m$. For many particles, $\dot{\mathbf L} = \mathbf N^{\text{ext}}$ holds when the internal forces obey the third law and are central.
