id: ch04-map
title: "Content Map: Momentum and Angular Momentum"
kind: map
name: Level 4, Momentum and Angular Momentum (momentum conservation, rockets, center of mass, angular momentum and torque, equal areas, angular momentum of many particles)

intro: |
  This map shows how the ideas of the level fit together. Each box is one idea. Try to rebuild each one from memory before you read the options.

  The level started with **momentum**: for a system of particles, the internal forces cancel in pairs and only outside forces change the total. Two consequences follow. A **rocket** pushes on its own exhaust, and the **center of mass** moves as if all the mass sat there. The same idea then turns to rotation: **angular momentum and torque** for one particle, **equal areas** when the force is central, and finally the **angular momentum of many particles**, where the internal torques cancel only under two conditions.

  For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake, and every wrong pick comes with a reason. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: momentum
    title: Momentum conservation
    row: 1
    col: 2
    body: |
      For particles $\alpha$ with momenta $\mathbf p_\alpha$, the total momentum obeys
      $$\mathbf P = \sum_\alpha \mathbf p_\alpha,$$
      $$\dot{\mathbf P} = \mathbf F^{\text{ext}}.$$
      The internal forces cancel in pairs by the third law. If $\mathbf F^{\text{ext}} = \mathbf 0$, then $\mathbf P$ is constant. Two masses, 2 kg at $+3$ m/s and 4 kg at $-1$ m/s, have $P = 2$ kg m/s, and stuck together they move at $1/3$ m/s.
    decoys:
      - body: |
          For particles $\alpha$ with momenta $\mathbf p_\alpha$, the total momentum obeys
          $$\mathbf P = \sum_\alpha \mathbf p_\alpha,$$
          $$\dot{\mathbf P} = \mathbf F^{\text{int}} + \mathbf F^{\text{ext}}.$$
          The internal forces change $\mathbf P$ when they are strong. If $\mathbf F^{\text{ext}} = \mathbf 0$, then $\mathbf P$ is constant only for gentle collisions. Two masses, 2 kg at $+3$ m/s and 4 kg at $-1$ m/s, have $P = 2$ kg m/s, and stuck together they move at $1/3$ m/s.
        feedback: |
          By the third law the internal forces come in equal and opposite pairs, so their sum is zero however strong they are. Only an outside force changes $\mathbf P$, which is why a violent collision still conserves it.
      - body: |
          For particles $\alpha$ with momenta $\mathbf p_\alpha$, the total momentum obeys
          $$\mathbf P = \sum_\alpha |\mathbf p_\alpha|,$$
          $$\dot{\mathbf P} = \mathbf F^{\text{ext}}.$$
          The internal forces cancel in pairs by the third law. If $\mathbf F^{\text{ext}} = \mathbf 0$, then $\mathbf P$ is constant. Two masses, 2 kg at $+3$ m/s and 4 kg at $-1$ m/s, have $P = 10$ kg m/s, and stuck together they move at $5/3$ m/s.
        feedback: |
          Momentum is a vector, so opposite motions subtract: $6 - 4 = 2$ kg m/s, not $6 + 4$. Adding the magnitudes gives a number that is not conserved.
    explanation: |
      Everything else in the level is this statement applied to a particular system, or its rotational twin.

  - id: rocket
    title: The rocket equation
    row: 2
    col: 1
    body: |
      A rocket of mass $m$ ejects exhaust at speed $v_{\text{ex}} > 0$ relative to itself, with $dm < 0$:
      $$m\,dv = -v_{\text{ex}}\,dm,$$
      $$\text{thrust} = -\dot m\,v_{\text{ex}},.$$
      $$v - v_0 = v_{\text{ex}}\ln\frac{m_0}{m}.$$
      With $v_{\text{ex}} = 2000$ m/s and $m_0/m = 5$, $\Delta v = 2000\ln 5 = 3219$ m/s.
    decoys:
      - body: |
          A rocket of mass $m$ ejects exhaust at speed $v_{\text{ex}} > 0$ relative to itself, with $dm < 0$:
          $$m\,dv = -v_{\text{ex}}\,dm,$$
          $$\text{thrust} = -\dot m\,v_{\text{ex}},.$$
          $$v - v_0 = v_{\text{ex}}\,\frac{m_0 - m}{m_0}.$$
          With $v_{\text{ex}} = 2000$ m/s and $m_0/m = 5$, $\Delta v = 2000 \times 0.8 = 1600$ m/s.
        feedback: |
          The mass shrinks as the fuel burns, so the same exhaust speed buys more and more speed per kilogram: $dv = -v_{\text{ex}}\,dm/m$ has $m$ in the denominator. Integrating gives a logarithm, not a straight line in the burned mass.
      - body: |
          A rocket of mass $m$ ejects exhaust at speed $v_{\text{ex}} > 0$ relative to **the ground**, with $dm < 0$:
          $$m\,dv = -v_{\text{ex}}\,dm,$$
          $$\text{thrust} = -\dot m\,v_{\text{ex}},.$$
          $$v - v_0 = v_{\text{ex}}\ln\frac{m_0}{m}.$$
          With $v_{\text{ex}} = 2000$ m/s and $m_0/m = 5$, $\Delta v = 2000\ln 5 = 3219$ m/s.
        feedback: |
          The law is built on the exhaust speed measured from the rocket, because the thrust is the push between the rocket and the gas it throws. A fixed ground-frame exhaust speed gives a different law, $v = v_{\text{ex}}(m_0/m - 1)$.
    explanation: |
      Pushing on exhaust, not on the air, is why a rocket works in empty space. Gravity adds a term: $v = v_{\text{ex}}\ln(m_0/m) - gt$ with up positive.

  - id: com
    title: Center of mass
    row: 2
    col: 3
    body: |
      With total mass $M = \sum_\alpha m_\alpha$,
      $$\mathbf R = \frac{1}{M}\sum_\alpha m_\alpha\mathbf r_\alpha,$$
      $$\mathbf P = M\dot{\mathbf R},$$
      $$\mathbf F^{\text{ext}} = M\ddot{\mathbf R}.$$
      It moves as one particle under the outside force, whatever the internal forces do, and it can lie outside the matter. A 1 kg handle at 0 and a 3 kg head at 1.2 m have $R = 0.9$ m.
    decoys:
      - body: |
          With total mass $M = \sum_\alpha m_\alpha$,
          $$\mathbf R = \frac{1}{N}\sum_\alpha \mathbf r_\alpha,$$
          $$\mathbf P = M\dot{\mathbf R},$$
          $$\mathbf F^{\text{ext}} = M\ddot{\mathbf R}.$$
          It moves as one particle under the outside force, whatever the internal forces do, and it can lie outside the matter. A 1 kg handle at 0 and a 3 kg head at 1.2 m have $R = 0.6$ m.
        feedback: |
          The center of mass is a mass-weighted average. A plain average of positions ignores that the head is three times heavier, so the point sits too far from it. The weighted value is $(1\cdot 0 + 3\cdot 1.2)/4 = 0.9$ m, close to the head.
      - body: |
          With total mass $M = \sum_\alpha m_\alpha$,
          $$\mathbf R = \frac{1}{M}\sum_\alpha m_\alpha\mathbf r_\alpha,$$
          $$\mathbf P = M\dot{\mathbf R},$$
          $$\mathbf F^{\text{ext}} + \mathbf F^{\text{int}} = M\ddot{\mathbf R}.$$
          It follows the outside force only when the internal forces vanish, and it always lies inside the matter. A 1 kg handle at 0 and a 3 kg head at 1.2 m have $R = 0.9$ m.
        feedback: |
          The internal forces cancel in pairs, so they never move the center of mass, and an explosion leaves its path unchanged. A bent boomerang shows that the point can sit in the empty gap.
    explanation: |
      This is the momentum box seen as one particle: $\dot{\mathbf P} = \mathbf F^{\text{ext}}$ with $\mathbf P = M\dot{\mathbf R}$.

  - id: angmom
    title: Angular momentum and torque
    row: 3
    col: 2
    body: |
      For one particle, about a fixed origin $O$,
      $$\mathbf L = \mathbf r\times\mathbf p,$$
      $$\mathbf N = \mathbf r\times\mathbf F,$$
      $$\dot{\mathbf L} = \mathbf N.$$
      Both depend on the origin. In the plane, $L_z = m(xv_y - yv_x)$. A free particle moving along $+x$ on the line $y = b$ above $O$ has $L_z = -mbv$ (clockwise), constant.
    decoys:
      - body: |
          For one particle, about a fixed origin $O$,
          $$\mathbf L = \mathbf r\cdot\mathbf p,$$
          $$\mathbf N = \mathbf r\cdot\mathbf F,$$
          $$\dot{\mathbf L} = \mathbf N.$$
          Both are numbers that depend on the origin. In the plane, $L_z = m(xv_y - yv_x)$. A free particle moving along $+x$ on the line $y = b$ above $O$ has $L_z = -mbv$ (clockwise), constant.
        feedback: |
          A dot product is a number and is zero for perpendicular vectors, but a particle moving in a circle has $\mathbf r\perp\mathbf p$ and plenty of angular momentum. The cross product is the one that measures the sideways part and points along the axis of rotation.
      - body: |
          For one particle, about a fixed origin $O$,
          $$\mathbf L = \mathbf r\times\mathbf p,$$
          $$\mathbf N = \mathbf r\times\mathbf F,$$
          $$\dot{\mathbf L} = \mathbf F.$$
          Both depend on the origin. In the plane, $L_z = m(xv_y - yv_x)$. A free particle moving along $+x$ on the line $y = b$ above $O$ has $L_z = 0$, since nothing pushes it.
        feedback: |
          The rate of change of $\mathbf L$ is the torque $\mathbf N$, not the force. The straight line is also not zero: its distance $b$ from $O$ gives $L_z = -mbv$, and it stays constant only because there is no torque.
    explanation: |
      This is the rotational twin of $\dot{\mathbf P} = \mathbf F$, with the torque in the role of the force.

  - id: areas
    title: Equal areas
    row: 4
    col: 1
    body: |
      The radius vector sweeps area at the rate
      $$\frac{dA}{dt} = \frac{L}{2m}.$$
      For a central force the torque is zero, so $L$ is constant and equal areas are swept in equal times, for any central force. With $m = 1$ kg and $L = 0.8$ kg m$^2$/s, $dA/dt = 0.4$ m$^2$/s.
    decoys:
      - body: |
          The radius vector sweeps area at the rate
          $$\frac{dA}{dt} = \frac{L}{m}.$$
          For a central force the torque is zero, so $L$ is constant and equal areas are swept in equal times, for any central force. With $m = 1$ kg and $L = 0.8$ kg m$^2$/s, $dA/dt = 0.8$ m$^2$/s.
        feedback: |
          The area is a triangle, half of the parallelogram spanned by $\mathbf r$ and $\mathbf v\,dt$, so a factor $1/2$ is needed: $dA = \tfrac12|\mathbf r\times\mathbf v|\,dt = (L/2m)\,dt$.
      - body: |
          The radius vector sweeps area at the rate
          $$\frac{dA}{dt} = \frac{L}{2m}.$$
          Equal areas in equal times holds only for an inverse-square force, because it needs $L$ constant. With $m = 1$ kg and $L = 0.8$ kg m$^2$/s, $dA/dt = 0.4$ m$^2$/s.
        feedback: |
          Constant $L$ needs only zero torque about the center, which any central force gives, whatever its dependence on distance. The inverse-square law matters for the shape of the orbit, not for equal areas.
    explanation: |
      Kepler's second law is this rule with the Sun as the center of the force.

  - id: many
    title: Angular momentum of many particles
    row: 4
    col: 3
    body: |
      With $\mathbf L = \sum_\alpha\mathbf r_\alpha\times\mathbf p_\alpha$ and $\mathbf r_{\alpha\beta} = \mathbf r_\alpha - \mathbf r_\beta$, a pair gives $\mathbf r_{\alpha\beta}\times\mathbf F_{\alpha\beta}$ by the third law. It vanishes if $\mathbf F_{\alpha\beta}$ is central, so
      $$\dot{\mathbf L} = \sum_\alpha\mathbf r_\alpha\times\mathbf F^{\text{ext}}_\alpha = \mathbf N^{\text{ext}}.$$
      Equal and opposite forces off the joining line (a couple) would still twist the pair.
    decoys:
      - body: |
          With $\mathbf L = \sum_\alpha\mathbf r_\alpha\times\mathbf p_\alpha$ and $\mathbf r_{\alpha\beta} = \mathbf r_\alpha - \mathbf r_\beta$, a pair gives $\mathbf r_{\alpha\beta}\times\mathbf F_{\alpha\beta}$ by the third law. It vanishes for **any** pair of equal and opposite forces, so
          $$\dot{\mathbf L} = \sum_\alpha\mathbf r_\alpha\times\mathbf F^{\text{ext}}_\alpha = \mathbf N^{\text{ext}}.$$
          A couple of equal and opposite forces never twists a pair.
        feedback: |
          Equal and opposite is not enough. Two forces of 3 N sideways on particles 2 m apart cancel as forces but give a torque of 6 N m. The cross product $\mathbf r_{\alpha\beta}\times\mathbf F_{\alpha\beta}$ is zero only when the force lies along the joining line.
      - body: |
          With $\mathbf L = \sum_\alpha\mathbf r_\alpha\times\mathbf p_\alpha$ and $\mathbf r_{\alpha\beta} = \mathbf r_\alpha - \mathbf r_\beta$, a central force gives a zero cross product, so each particle keeps its own angular momentum:
          $$\dot{\mathbf L}_\alpha = \mathbf N^{\text{ext}}_\alpha \ \text{ for every } \alpha,$$
          $$\dot{\mathbf L} = \mathbf N^{\text{ext}}.$$
          Equal and opposite forces off the joining line (a couple) would still twist the pair.
        feedback: |
          Only the total is protected. Internal forces still change each $\mathbf L_\alpha$: the pairing works on the sum, after the torques of the two partners are added. A skater pulling in her arms changes the angular momentum of her arms and keeps the total.
    explanation: |
      It needs both the third law (to pair the forces) and centrality (to kill the cross product). It extends the single-particle law, $\dot{\mathbf L} = \mathbf N$, to a whole system.

edges:
