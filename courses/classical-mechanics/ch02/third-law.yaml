id: ch02-third-law
title: Action, Reaction and Momentum
kind: concept
own: |
  Setting: a system of $N$ particles. Particle $\alpha$ (any of $1, \dots, N$) has mass $m_\alpha$, velocity $\mathbf{v}_\alpha$ and momentum $\mathbf{p}_\alpha = m_\alpha\mathbf{v}_\alpha$. Write $\mathbf{F}_{\alpha\beta}$ for the force on particle $\alpha$ exerted by particle $\beta$ (an internal force), and $\mathbf{F}^{\text{ext}}_\alpha$ for the net force on $\alpha$ from bodies outside the system (an external force).
  - **Third law.** If object 1 exerts a force on object 2, then object 2 exerts a reaction force back on object 1, equal in size and opposite in direction. The two forces act on different bodies, so they never cancel in the motion of either one.
    {{ $$\mathbf{F}_{12} = -\mathbf{F}_{21}$$ }}
  - **Total momentum.** Let $\mathbf{P} = \sum_\alpha \mathbf{p}_\alpha$ be the sum of all the momenta, and $\mathbf{F}^{\text{ext}} = \sum_\alpha \mathbf{F}^{\text{ext}}_\alpha$ the net external force on the system. Summing $\dot{\mathbf{p}}_\alpha = \sum_{\beta\neq\alpha}\mathbf{F}_{\alpha\beta} + \mathbf{F}^{\text{ext}}_\alpha$ over $\alpha$, the internal forces cancel in pairs by the third law, so only outside forces change $\mathbf{P}$.
    {{ $$\dot{\mathbf{P}} = \mathbf{F}^{\text{ext}}$$ }}
  - **Conservation of momentum.** With no net external force on the system, its total momentum does not change, however the particles push each other.
    {{ $$\mathbf{F}^{\text{ext}} = 0 \;\Rightarrow\; \mathbf{P} = \text{const}$$ }}
  - **Equivalence.** The converse also holds: if the total momentum of every isolated pair of particles is constant, then $\dot{\mathbf{p}}_1 + \dot{\mathbf{p}}_2 = \mathbf{F}_{12} + \mathbf{F}_{21} = 0$, which is the third law. So the third law and conservation of momentum say the same thing.
  - **Where it fails.** The third law compares two forces at the same time $t$, which loses meaning when simultaneity is relative (speeds near the speed of light $c$). Two moving charges also break it at slow speeds: the magnetic force on each is not opposite to that on the other, and the missing momentum is carried by the electromagnetic field. For speeds $v \ll c$ the magnetic force $F_{\text{mag}}$ compared with the Coulomb force $F_{\text{Coul}}$ is small, which is why the law holds in classical mechanics.
    {{ $$\frac{F_{\text{mag}}}{F_{\text{Coul}}} \sim \frac{v^2}{c^2}$$ }}
cards:
  - type: text
    id: hook
    title: What does the cart do to your hand?
    body: |
      The first two laws are about one object: what a force does to it. But a force never comes from nowhere. A hand pushes the cart, a horse pulls the wagon, a hammer hits the nail. **Every force has a second object, the one that exerts it.**

      Put your hand against a light cart on a smooth track and push it forward so that it speeds up. Your hand is pushing the cart. Before any law, ask what the cart is doing to your hand.

  - type: mcq
    id: hook-guess
    prompt: |
      Your hand pushes a cart so that it speeds up. At the instant you push, how does the force the cart exerts on your hand compare with the force your hand exerts on the cart?
    options:
      - text: The cart pushes back on the hand with a force of the same size, in the opposite direction
        correct: true
      - text: The cart exerts no force on the hand, because the cart is just an object that gets pushed
        feedback: |
          Try pushing a heavy cart and notice your hand: it is squeezed and your arm has to push to keep the contact. A thing that takes a force gives one back, or your hand would feel nothing.
      - text: The hand pushes harder than the cart pushes back, because the cart speeds up
        feedback: |
          The speeding up of the cart is decided by the force on the cart and its mass. It does not tell the two forces apart, since the hand and the cart are different bodies with different masses.
      - text: The cart pushes back harder, because it is heavier than the hand
        feedback: |
          Heavier bodies are harder to accelerate, but the size of the force between two bodies does not depend on which is heavier.
    explanation: |
      The two forces are equal in size and opposite in direction, whatever the masses. That claim goes beyond everyday experience, and it is Newton's third law.

  - type: text
    id: third-law
    title: Newton's third law
    body: |
      Take two objects, 1 and 2. Let $\mathbf{F}_{21}$ be the force exerted **on** object 2 **by** object 1 (the first index is the body that feels the force). **Newton's third law:** object 2 then exerts a reaction force on object 1 that is equal and opposite,

      $$\mathbf{F}_{12} = -\mathbf{F}_{21}$$

      The forces in a pair, the "action" and the "reaction", have the same size and opposite directions. Think of the Earth pulling on the Moon and the Moon pulling on the Earth, or of a proton and an electron.

      One point matters for everything that follows: **the two forces act on different bodies.** $\mathbf{F}_{21}$ changes the motion of object 2 and $\mathbf{F}_{12}$ changes the motion of object 1. They are never added to find the net force on a single object.

  - type: widget
    id: push-apart
    title: Push two bodies apart
    widget: two-body-push
    config:
      m1: 1
      m2: 3
      J: 2
      sliders: [m1, m2, J]
      ranges: { m1: [0.5, 3, 0.5], m2: [0.5, 3, 0.5], J: [0.5, 3, 0.5] }
      readouts: [p1, p2, P, v1, v2]
      show:
        extArrow: false
      units: { mass: kg, momentum: 'kg m/s', speed: m/s, force: N, impulse: 'N s' }
    body: |
      Two bodies at rest, of masses $m_1$ and $m_2$, are pushed apart by a short pair of forces (the force on body 1 is the blue curve, the force on body 2 is its opposite, the orange curve). The strength is set by $J$, the area under the force curve, called the impulse. Below are the momentum $p = mv$ of each body and their sum $P = p_1 + p_2$.

      **Try:** change $m_1$, $m_2$ and $J$, and watch $p_1$, $p_2$, $P$, and the speeds $v_1$ and $v_2$.

  - type: mcq
    id: push-apart-q
    review: false
    prompt: |
      Two bodies at rest, with masses $1\ \mathrm{kg}$ and $3\ \mathrm{kg}$, are pushed apart by a pair of equal and opposite forces. Which statement holds at the end of the push?
    options:
      - text: Their momenta are opposite and equal in size, $p_1 = -p_2$, so $P = 0$, but the lighter body moves 3 times faster
        correct: true
      - text: Their speeds are equal and opposite, so the momenta are equal in size
        feedback: |
          The forces are equal and opposite, which gives equal and opposite momenta, not equal speeds. With $p = mv$ the lighter body must have the larger speed.
      - text: The heavier body gets the larger momentum, because it is bigger
        feedback: |
          Both bodies feel a force of the same size for the same time, so both get the same size of momentum change. Mass only decides how that momentum splits into speed.
      - text: The total momentum $P$ ends up positive, because the pushing adds momentum
        feedback: |
          The pushing adds $+J$ to one body and $-J$ to the other, so it adds nothing to the sum.
    explanation: |
      Each body ends with momentum of size $J$, in opposite directions, so $P = 0$. Since $p = mv$, the speeds are in inverse ratio to the masses: $3\ \mathrm{kg}$ against $1\ \mathrm{kg}$ means the lighter body moves 3 times faster.

  - type: text
    id: setup
    title: Total momentum of two objects
    body: |
      The widget suggests that something stays fixed. Let us derive it. Besides the force between them, each object may feel an **external force** from bodies outside the pair, such as the Sun on the Earth and the Moon, or the wind on two skaters. Call these $\mathbf{F}^{\text{ext}}_1$ and $\mathbf{F}^{\text{ext}}_2$. The net force on each object is the sum of the force from the other and the external force, and the second law $\dot{\mathbf{p}} = \mathbf{F}$ gives

      $$\dot{\mathbf{p}}_1 = \mathbf{F}_{12} + \mathbf{F}^{\text{ext}}_1$$

      $$\dot{\mathbf{p}}_2 = \mathbf{F}_{21} + \mathbf{F}^{\text{ext}}_2$$

      Define the **total momentum** $\mathbf{P} = \mathbf{p}_1 + \mathbf{p}_2$. Its rate of change is $\dot{\mathbf{P}} = \dot{\mathbf{p}}_1 + \dot{\mathbf{p}}_2$.

  - type: mcq
    id: add-them
    prompt: |
      Two objects with $\dot{\mathbf{p}}_1 = \mathbf{F}_{12} + \mathbf{F}^{\text{ext}}_1$ and $\dot{\mathbf{p}}_2 = \mathbf{F}_{21} + \mathbf{F}^{\text{ext}}_2$ obey Newton's third law. What is $\dot{\mathbf{P}}$ for the total momentum $\mathbf{P} = \mathbf{p}_1 + \mathbf{p}_2$?
    options:
      - text: '$\mathbf{F}^{\text{ext}}_1 + \mathbf{F}^{\text{ext}}_2$, because $\mathbf{F}_{12} + \mathbf{F}_{21} = 0$'
        correct: true
      - text: '$\mathbf{F}_{12} + \mathbf{F}_{21}$, because the external forces do not count'
        feedback: |
          It is the other way around. The internal forces add to zero by the third law, and the external forces are the ones left.
      - text: '$0$, always'
        feedback: |
          The internal forces cancel, but any external force still changes the total momentum. Zero holds only when the net external force is zero.
      - text: '$2\mathbf{F}_{12} + \mathbf{F}^{\text{ext}}_1 + \mathbf{F}^{\text{ext}}_2$, because both objects feel the internal force'
        feedback: |
          The force on 2 is $\mathbf{F}_{21} = -\mathbf{F}_{12}$, not another copy of $\mathbf{F}_{12}$, so the two internal forces subtract.
    explanation: |
      Adding the two equations, $\mathbf{F}_{12} + \mathbf{F}_{21}$ drops out by the third law and what is left is $\mathbf{F}^{\text{ext}}_1 + \mathbf{F}^{\text{ext}}_2$.

  - type: text
    id: result
    title: Only outside forces change P
    body: |
      With $\mathbf{F}^{\text{ext}} = \mathbf{F}^{\text{ext}}_1 + \mathbf{F}^{\text{ext}}_2$, the net external force on the pair, the sum of the two equations is

      $$\dot{\mathbf{P}} = \mathbf{F}^{\text{ext}}$$

      As far as the total momentum is concerned, the internal forces have no effect. In particular, if there is no net external force, then $\dot{\mathbf{P}} = 0$, and

      $$\mathbf{F}^{\text{ext}} = 0 \;\Rightarrow\; \mathbf{P} = \text{const}$$

      This is the **principle of conservation of momentum**. Recall the widget: each body gained momentum, but one gained $+J$ and the other $-J$, so the sum stayed at zero.

  - type: numeric
    id: rifle-bullet
    prompt: |
      A rifle of mass $4\ \mathrm{kg}$ and a bullet of mass $0.02\ \mathrm{kg}$ are at rest together, so $\mathbf{P} = 0$. The rifle fires and the bullet leaves at $600\ \mathrm{m/s}$ along $+x$. Take the shot as so short that outside forces can be neglected, so the total momentum stays constant. What is the momentum $p = mv$ of the bullet along $x$, in $\mathrm{kg\,m/s}$?
    answer: 12
    wrong:
      - { value: 12000, feedback: 'The mass is $0.02\ \mathrm{kg}$, not $20\ \mathrm{kg}$: $p = 0.02 \times 600$.' }
    hint: The momentum of a body is its mass times its velocity, $p = mv$.
    explanation: |
      $p = mv = 0.02\ \mathrm{kg} \times 600\ \mathrm{m/s} = 12\ \mathrm{kg\,m/s}$.

  - type: numeric
    id: rifle-recoil
    prompt: |
      Same shot: the bullet has momentum $12\ \mathrm{kg\,m/s}$ along $+x$ and the total momentum before was $\mathbf{P} = 0$ and stays $0$. The rifle has mass $4\ \mathrm{kg}$. What is the **speed** of the rifle's recoil, in $\mathrm{m/s}$?
    answer: 3
    wrong:
      - { value: 600, feedback: 'The speeds are not equal. It is the momenta that are equal and opposite, and the rifle is much heavier than the bullet.' }
      - { value: 0.0033, feedback: 'This divides the wrong way. The rifle momentum is $12$ in size, and its speed is $p/m$ with $m = 4\ \mathrm{kg}$.' }
    hint: |
      With $P = 0$ the rifle momentum is $p_{\text{rifle}} = -12\ \mathrm{kg\,m/s}$. Divide by the rifle mass.
    explanation: |
      $P = p_{\text{bullet}} + p_{\text{rifle}} = 0$ gives $p_{\text{rifle}} = -12\ \mathrm{kg\,m/s}$, so $v_{\text{rifle}} = p_{\text{rifle}}/m_{\text{rifle}} = -12/4 = -3\ \mathrm{m/s}$. The rifle moves backwards at $3\ \mathrm{m/s}$, the heavier body with the smaller speed, just as in the widget.

  - type: text
    id: many
    title: Many particles
    body: |
      The same argument works for $N$ particles, and it is worth seeing in this notation. Label a particle by $\alpha$ or $\beta$, each running over $1, 2, \dots, N$. Let $\mathbf{F}_{\alpha\beta}$ be the force on $\alpha$ exerted by $\beta$ (a particle cannot push itself, so $\beta \neq \alpha$), and $\mathbf{F}^{\text{ext}}_\alpha$ the net external force on $\alpha$. The second law for particle $\alpha$ is

      $$\dot{\mathbf{p}}_\alpha = \sum_{\beta\neq\alpha}\mathbf{F}_{\alpha\beta} + \mathbf{F}^{\text{ext}}_\alpha$$

      The total momentum is $\mathbf{P} = \sum_\alpha \mathbf{p}_\alpha$, so $\dot{\mathbf{P}} = \sum_\alpha \dot{\mathbf{p}}_\alpha$. Put the pieces of the proof in order.

  - type: order
    id: many-proof
    prompt: Put the proof that $\dot{\mathbf{P}} = \mathbf{F}^{\text{ext}}$ in order.
    steps:
      - 'Differentiate $\mathbf{P} = \sum_\alpha \mathbf{p}_\alpha$ to get $\dot{\mathbf{P}} = \sum_\alpha \dot{\mathbf{p}}_\alpha$.'
      - 'Substitute the second law for each particle, giving a double sum of internal forces $\mathbf{F}_{\alpha\beta}$ plus the sum of the external forces $\mathbf{F}^{\text{ext}}_\alpha$.'
      - 'Pair each term $\mathbf{F}_{\alpha\beta}$ in the double sum with its partner $\mathbf{F}_{\beta\alpha}$, so that the double sum becomes a sum of pair sums $(\mathbf{F}_{\alpha\beta} + \mathbf{F}_{\beta\alpha})$.'
      - 'By the third law every pair sum $\mathbf{F}_{\alpha\beta} + \mathbf{F}_{\beta\alpha}$ is zero, so the whole double sum is zero.'
      - 'What remains is $\dot{\mathbf{P}} = \sum_\alpha \mathbf{F}^{\text{ext}}_\alpha = \mathbf{F}^{\text{ext}}$.'
    hint: First write $\dot{\mathbf{P}}$ in terms of the single-particle rates, and only then use the third law.
    explanation: |
      The double sum has $N(N-1)$ terms, one for each ordered pair of different particles. Pairing $\mathbf{F}_{\alpha\beta}$ with $\mathbf{F}_{\beta\alpha}$ gives half as many terms, each equal to zero by the third law. This is the step where the third law is needed.

  - type: text
    id: converse
    title: The other direction
    body: |
      We have shown that the third law gives conservation of momentum. The converse is also true, which is why the two statements are the same law seen from two sides.

      Suppose the total momentum is conserved for **every** group of particles that feels no external force. Pick any two particles, 1 and 2, and imagine them alone. Then $\mathbf{P} = \mathbf{p}_1 + \mathbf{p}_2$ is constant, so $\dot{\mathbf{p}}_1 + \dot{\mathbf{p}}_2 = 0$. With only the forces between them acting, $\dot{\mathbf{p}}_1 = \mathbf{F}_{12}$ and $\dot{\mathbf{p}}_2 = \mathbf{F}_{21}$, so

      $$\mathbf{F}_{12} + \mathbf{F}_{21} = 0$$

      That is the third law.

  - type: mcq
    id: converse-q
    prompt: |
      Suppose two particles are alone in space and their total momentum $\mathbf{P} = \mathbf{p}_1 + \mathbf{p}_2$ is observed to be constant. What follows about the force $\mathbf{F}_{12}$ on 1 by 2 and the force $\mathbf{F}_{21}$ on 2 by 1?
    options:
      - text: '$\mathbf{F}_{12} = -\mathbf{F}_{21}$, because $\dot{\mathbf{p}}_1 + \dot{\mathbf{p}}_2 = \mathbf{F}_{12} + \mathbf{F}_{21} = 0$'
        correct: true
      - text: Each of them is zero, because the momenta do not change
        feedback: |
          Only the sum $\mathbf{p}_1 + \mathbf{p}_2$ is constant. Each momentum can change, as in the rifle and bullet, as long as the changes are opposite.
      - text: '$\mathbf{F}_{12} = \mathbf{F}_{21}$, since both bodies feel the same push'
        feedback: |
          If the two forces were equal, the momentum changes would be equal and the sum would grow instead of staying constant.
    explanation: |
      $\mathbf{P}$ constant means $\dot{\mathbf{p}}_1 = -\dot{\mathbf{p}}_2$, and with no outside force these are the two internal forces.

  - type: widget
    id: broken
    title: Break the law, add a wind
    widget: two-body-push
    config:
      m1: 1
      m2: 3
      J: 2
      ext: 0
      ratio: 0.5
      lawToggle: true
      sliders: [ext]
      ranges: { ext: [0, 2, 1] }
      readouts: [p1, p2, P]
      tmax: 2
      show:
        forcePlot: true
      units: { mass: kg, momentum: 'kg m/s', speed: m/s, force: N, impulse: 'N s' }
    body: |
      The same push as before, with two new controls. The buttons switch between "Third law holds" (the force on body 2 is exactly opposite to that on body 1) and "Third law broken" (the force on body 2 is only half as large). The slider $F_{\text{ext}}$ adds a steady external force on body 1 during the whole window of $2\ \mathrm{s}$.

      **Try:** break the law and watch $P$ after the push. Then restore the law and raise $F_{\text{ext}}$.

  - type: numeric
    id: drift
    prompt: |
      Two bodies at rest are pushed so that body 1 receives an impulse $J = 2\ \mathrm{N\,s}$ along $+x$, and body 2 receives an impulse along $-x$ that is only **half as large** (the third law is broken). There are no outside forces. What is the total momentum $P = p_1 + p_2$ along $x$ afterwards, in $\mathrm{kg\,m/s}$?
    answer: 1
    wrong:
      - { value: 0, feedback: 'That would need an equal and opposite impulse on body 2, which is the third law. Here body 2 receives $-1\ \mathrm{N\,s}$, not $-2$.' }
      - { value: 3, feedback: 'The impulse on body 2 points the other way, so it subtracts: $2 - 1$, not $2 + 1$.' }
    hint: Each momentum equals the impulse the body received.
    explanation: |
      $p_1 = +2$ and $p_2 = -1$, so $P = 1\ \mathrm{kg\,m/s}$. Without the third law the total momentum is no longer conserved: the internal forces left something behind.

  - type: numeric
    id: wind
    prompt: |
      Two bodies obey the third law, so their internal forces cancel in pairs. A steady external force of $1\ \mathrm{N}$ along $+x$ acts on the pair for $2\ \mathrm{s}$, starting from $P = 0$. Using $\dot{P} = F^{\text{ext}}$ along $x$ for a constant force, what is the total momentum afterwards, in $\mathrm{kg\,m/s}$?
    answer: 2
    wrong:
      - { value: 0, feedback: 'The internal forces cancel, but the external force does not. $P$ is conserved only when $F^{\text{ext}} = 0$.' }
      - { value: 0.5, feedback: 'This divides the force by the time. A constant rate of change $\dot{P} = F^{\text{ext}}$ gives $P = F^{\text{ext}}\,t$.' }
    hint: A constant rate of change over a time $t$ changes $P$ by rate times time.
    explanation: |
      $P = F^{\text{ext}}\,t = 1\ \mathrm{N} \times 2\ \mathrm{s} = 2\ \mathrm{kg\,m/s}$, whatever the internal forces do.

  - type: text
    id: magnetic
    title: A case where the law fails
    body: |
      The third law is not a theorem. Within classical physics it is valid with such accuracy that it can be taken as exact, but there are two warnings.

      First, near the speed of light $c$ it cannot hold, because it equates $\mathbf{F}_{12}(t)$ and $\mathbf{F}_{21}(t)$ measured at the **same time** $t$, and two observers in relative motion do not agree on what is simultaneous.

      Second, and more surprising, it fails at slow speeds for the **magnetic force between two moving charges**. Take two positive charges $q_1$ and $q_2$. The charge $q_1$ moves along $x$, and $q_2$ moves along $y$. The moving $q_1$ is a current along $x$ and makes a magnetic field that points along $z$ near $q_2$. That field exerts a force $\mathbf{F}_{21}$ on $q_2$ that points along $x$. In the same way the moving $q_2$ makes a field that exerts a force $\mathbf{F}_{12}$ on $q_1$ along $y$.

  - type: mcq
    id: magnetic-q
    prompt: |
      Two positive charges move at right angles: $q_1$ along $x$ and $q_2$ along $y$. The magnetic force on $q_2$ due to $q_1$ points along $x$, and the magnetic force on $q_1$ due to $q_2$ points along $y$. What does this say about the total mechanical momentum $m_1\mathbf{v}_1 + m_2\mathbf{v}_2$ of the two charges?
    options:
      - text: It is not conserved, because the two forces are not opposite, and the missing momentum goes into the electromagnetic field
        correct: true
      - text: It is conserved, because the forces are equal in size
        feedback: |
          Equal size is not enough: the forces must also be opposite in direction. Here one points along $x$ and the other along $y$, so their sum is not zero.
      - text: It is conserved, because momentum is always conserved and the third law is only a rule of thumb
        feedback: |
          Momentum of the whole system is conserved, but the whole system includes the field. The mechanical momentum alone is not.
    explanation: |
      The two forces are perpendicular, so they do not cancel and $\dot{\mathbf{p}}_1 + \dot{\mathbf{p}}_2 \neq 0$. Electromagnetic fields carry momentum too, and the mechanical momentum lost by the charges goes into the fields.

  - type: numeric
    id: magnetic-size
    prompt: |
      For speeds much smaller than the speed of light $c = 3 \times 10^8\ \mathrm{m/s}$, the magnetic force between two moving charges is of order $v^2/c^2$ times the Coulomb force between them (which does obey the third law). Two charges each move at $v = 3 \times 10^6\ \mathrm{m/s}$. What is the ratio $v^2/c^2$?
    answer: 0.0001
    tolerance: 0.000005
    answerText: '0.0001'
    hint: The speed is $1\%$ of $c$.
    explanation: |
      $v/c = 10^{-2}$, so $v^2/c^2 = 10^{-4}$. Even at $1\%$ of the speed of light the violation is of order one part in ten thousand, which is why the third law is used freely in nonrelativistic mechanics.

  - type: mcq
    id: horse-cart
    prompt: |
      A horse pulls a cart. The cart pulls back on the horse with a force equal and opposite to the horse's pull on the cart. A student concludes that the two forces cancel, so the cart cannot accelerate. Where is the error?
    options:
      - text: The two forces act on different bodies, so they cannot cancel. The cart accelerates when the pull of the horse on it exceeds the opposing forces on the cart, such as friction
        correct: true
      - text: The pull of the horse on the cart is really larger than the pull of the cart on the horse
        feedback: |
          They are exactly equal and opposite. The third law holds even while the cart accelerates, and the size of the forces has nothing to do with which body moves.
      - text: The third law only holds when nothing moves
        feedback: |
          The law holds at every instant, moving or not. The rifle and bullet were accelerating while their forces were equal and opposite.
      - text: The cart's pull on the horse does not count, because the horse is alive
        feedback: |
          The third law makes no distinction between living and non-living bodies.
    explanation: |
      The net force on the cart is the sum of the forces **on the cart**: the horse's pull and the opposing friction. The reaction to the horse's pull acts on the horse, so it enters the motion of the horse, not the cart. Forces cancel in a sum only when they act on the same body.

  - type: text
    id: summary
    body: |
      **Next:** a single object on a slope, with gravity, a contact force and rubbing. The forces at its surface are exactly the kind that come in pairs, and you will resolve them along and across the slope with Newton's laws in Cartesian components.
