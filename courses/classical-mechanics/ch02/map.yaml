id: ch02-map
title: "Content Map: Newton's Laws"
kind: map
name: Level 2, Newton's Laws (frames and vectors, the three laws, cartesian and polar components)

intro: |
  This map shows how the ideas of the level fit together. Each box is one idea. Try to rebuild each one from memory before you read the options.

  The level started with **where and when**: two observers moving at a steady speed past each other describe the same motion with different positions and velocities, but the same acceleration. That fixes the stage for the **three laws**: the first picks out the frames in which they hold, the second links force and motion, the third makes forces come in pairs and keeps the total momentum of a system. Last come the **components**: the second law written in cartesian axes (a block on a slope) and in polar axes (a stone swung on a string).

  For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake, and every wrong pick comes with a reason. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: frames
    title: Frames and vectors
    row: 1
    col: 1
    body: |
      A frame $S'$ moves at a constant velocity $\mathbf{u}$ past a frame $S$. A position, a velocity and an acceleration then convert as
      $$\mathbf{r} = \mathbf{r}' + \mathbf{u}t,$$
      $$\mathbf{v} = \mathbf{v}' + \mathbf{u},$$
      $$\mathbf{a} = \mathbf{a}'.$$
      A ball thrown at 3 m/s along a train moving at 20 m/s moves at 23 m/s for the platform.
    decoys:
      - body: |
          A frame $S'$ moves at a constant velocity $\mathbf{u}$ past a frame $S$. A position, a velocity and an acceleration then convert as
          $$\mathbf{r} = \mathbf{r}' + \mathbf{u}t,$$
          $$\mathbf{v} = \mathbf{v}',$$
          $$\mathbf{a} = \mathbf{a}'.$$
          A ball thrown at 3 m/s along a train moving at 20 m/s moves at 3 m/s for the platform.
        feedback: |
          Differentiating $\mathbf{r} = \mathbf{r}' + \mathbf{u}t$ gives $\mathbf{v} = \mathbf{v}' + \mathbf{u}$: velocities depend on the frame. The platform sees the train's 20 m/s added to the ball's 3 m/s.
      - body: |
          A frame $S'$ moves at a constant velocity $\mathbf{u}$ past a frame $S$. A position, a velocity and an acceleration then convert as
          $$\mathbf{r} = \mathbf{r}' + \mathbf{u}t,$$
          $$\mathbf{v} = \mathbf{v}' + \mathbf{u},$$
          $$\mathbf{a} = \mathbf{a}' + \mathbf{u}.$$
          A ball thrown at 3 m/s along a train moving at 20 m/s moves at 23 m/s for the platform.
        feedback: |
          Differentiating $\mathbf{v} = \mathbf{v}' + \mathbf{u}$ once more kills $\mathbf{u}$, because it is constant. Both frames measure the same acceleration, $\mathbf{a} = \mathbf{a}'$.
    explanation: |
      Same acceleration in both frames is what lets one law hold for both observers.

  - id: inertial
    title: First law and inertial frames
    row: 1
    col: 2
    body: |
      A body with **no net force** moves at a constant velocity. This holds in an **inertial frame**, which is defined as a frame where the first law is true. Any frame moving at a constant velocity relative to an inertial frame is inertial too.
    decoys:
      - body: |
          A body with **no net force** stays **at rest**, and a moving body stops. This holds in an **inertial frame**, which is defined as a frame where the first law is true. Any frame moving at a constant velocity relative to an inertial frame is inertial too.
        feedback: |
          Without force, the velocity stays as it is, whatever it was. A puck on ice keeps sliding because friction is nearly absent, not because sliding needs a push.
      - body: |
          A body with **no net force** moves at a constant velocity. This holds in an **inertial frame**, which is defined as a frame where the first law is true. Any frame moving with a constant **acceleration** relative to an inertial frame is inertial too.
        feedback: |
          In an accelerating frame a free body appears to accelerate, so the first law fails there. Only a constant relative **velocity** keeps a frame inertial.
    explanation: |
      The first law is not a special case of the second: it selects the frames where the second may be used.

  - id: second
    title: Second law
    row: 1
    col: 3
    body: |
      In an inertial frame, with $\mathbf{p} = m\mathbf{v}$ the momentum, force sets the **change** of motion:
      $$\mathbf{F} = m\mathbf{a} = m\ddot{\mathbf{r}}, \qquad \mathbf{F} = \dot{\mathbf{p}}.$$
      The two forms agree when the mass is constant.
    decoys:
      - body: |
          In an inertial frame, with $\mathbf{p} = m\mathbf{v}$ the momentum, force is what keeps a body **moving**:
          $$\mathbf{F} = m\mathbf{v}, \qquad \mathbf{F} = \mathbf{p}.$$
          The two forms agree when the mass is constant.
        feedback: |
          A force that sets the velocity itself would make every moving body feel a force. A force sets the **rate of change** of the velocity, $m\mathbf{a}$, and of the momentum, $\dot{\mathbf{p}}$.
      - body: |
          In an inertial frame, with $\mathbf{p} = m\mathbf{a}$ the momentum, force sets the **change** of motion:
          $$\mathbf{F} = m\mathbf{a} = m\ddot{\mathbf{r}}, \qquad \mathbf{F} = \dot{\mathbf{p}}.$$
          The two forms agree when the mass is constant.
        feedback: |
          The momentum is mass times **velocity**, $\mathbf{p} = m\mathbf{v}$. With $\mathbf{p} = m\mathbf{a}$ the second form would give $m\dot{\mathbf{a}}$, which is not $m\mathbf{a}$.
    explanation: |
      The same law, written for a single particle, will be written for a system and in other coordinates below.

  - id: noninertial
    title: Accelerating frames
    row: 2
    col: 1
    body: |
      Let a frame $S'$ have its origin at $\mathbf{R}(t)$ in an inertial frame $S$. Then
      $$\mathbf{a}' = \mathbf{a} - \ddot{\mathbf{R}}.$$
      A free object ($\mathbf{a} = 0$) seen from a braking cart with $\ddot R = -2$ m/s$^2$ appears to speed up forward at $a' = +2$ m/s$^2$.
    decoys:
      - body: |
          Let a frame $S'$ have its origin at $\mathbf{R}(t)$ in an inertial frame $S$. Then
          $$\mathbf{a}' = \mathbf{a} + \ddot{\mathbf{R}}.$$
          A free object ($\mathbf{a} = 0$) seen from a braking cart with $\ddot R = -2$ m/s$^2$ appears to slow down at $a' = -2$ m/s$^2$.
        feedback: |
          The free object keeps its velocity while the cart slows, so it gains on the cart: it moves **forward** relative to it. The correct sign is $\mathbf{a}' = \mathbf{a} - \ddot{\mathbf{R}}$.
      - body: |
          Let a frame $S'$ have its origin at $\mathbf{R}(t)$ in an inertial frame $S$. Then
          $$\mathbf{a}' = \mathbf{a}.$$
          A free object ($\mathbf{a} = 0$) seen from a braking cart with $\ddot R = -2$ m/s$^2$ has $a' = 0$ as well.
        feedback: |
          $\mathbf{a} = \mathbf{a}'$ holds only for a **constant** relative velocity, when $\ddot{\mathbf{R}} = 0$. A braking cart is not inertial, and the law $\mathbf{F} = m\mathbf{a}'$ fails in it.
    explanation: |
      The first law tells you which frames to trust; this is the price of using any other.

  - id: third
    title: Third law
    row: 2
    col: 2
    body: |
      With $\mathbf{F}_{\alpha\beta}$ the force on body $\alpha$ by body $\beta$,
      $$\mathbf{F}_{12} = -\mathbf{F}_{21}.$$
      The two forces have equal size and opposite direction, and they act on **different bodies**.
    decoys:
      - body: |
          With $\mathbf{F}_{\alpha\beta}$ the force on body $\alpha$ by body $\beta$,
          $$\mathbf{F}_{12} = -\mathbf{F}_{21}.$$
          The two forces have equal size and opposite direction, and they act on the **same body**, so they cancel.
        feedback: |
          One force acts on body 1 and the other on body 2. Each changes a different motion, so they never cancel in the equation of one body, and things can accelerate.
      - body: |
          With $\mathbf{F}_{\alpha\beta}$ the force on body $\alpha$ by body $\beta$,
          $$\mathbf{F}_{12} = -\mathbf{F}_{21}.$$
          The two forces have opposite direction, and the **lighter** body feels the smaller one.
        feedback: |
          The two forces have equal size whatever the masses. The lighter body accelerates more, because $a = F/m$, but the force on it is the same size as the force it exerts.
    explanation: |
      Forces in pairs is what makes a system's total momentum behave simply.

  - id: momentum
    title: Total momentum
    row: 3
    col: 1
    body: |
      For a system, $\mathbf{P} = \sum_\alpha \mathbf{p}_\alpha$. The internal forces cancel in pairs by the third law, so
      $$\dot{\mathbf{P}} = \mathbf{F}^{\text{ext}}.$$
      A rifle (4 kg) and a bullet (0.02 kg, 600 m/s) start at rest with $\mathbf{F}^{\text{ext}} = 0$, so $\mathbf{P} = 0$ and the rifle recoils backward at 3 m/s.
    decoys:
      - body: |
          For a system, $\mathbf{P} = \sum_\alpha \mathbf{p}_\alpha$. The internal forces add up and push the whole system, so
          $$\dot{\mathbf{P}} = \mathbf{F}^{\text{int}} + \mathbf{F}^{\text{ext}}.$$
          A rifle (4 kg) and a bullet (0.02 kg, 600 m/s) start at rest with $\mathbf{F}^{\text{ext}} = 0$, so the explosion pushes both **forward**.
        feedback: |
          Internal forces come in pairs $\mathbf{F}_{12} + \mathbf{F}_{21} = 0$ and drop out of $\dot{\mathbf{P}}$. A system cannot push itself: the rifle goes backward as the bullet goes forward.
      - body: |
          For a system, $\mathbf{P} = \sum_\alpha \mathbf{p}_\alpha$. The internal forces cancel in pairs by the third law, so
          $$\dot{\mathbf{P}} = \mathbf{F}^{\text{ext}}.$$
          A rifle (4 kg) and a bullet (0.02 kg, 600 m/s) start at rest with $\mathbf{F}^{\text{ext}} = 0$, so the rifle recoils backward at 150 m/s.
        feedback: |
          The bullet's momentum is $0.02 \times 600 = 12$ kg m/s, so the rifle has $-12$ kg m/s, and its speed is $12/4 = 3$ m/s. The heavier body recoils slower.
    explanation: |
      With no external force, $\mathbf{P}$ is constant: this is momentum conservation, and it is the third law in disguise.

  - id: incline
    title: Cartesian components
    row: 2
    col: 3
    body: |
      The second law gives one equation per axis, $F_x = m\ddot x$ and so on. For a block on a slope of angle $\theta$, with $x$ down the slope and $y$ normal to it, and a kinetic friction $f = \mu_k N$:
      $$N = mg\cos\theta,$$
      $$\ddot x = g(\sin\theta - \mu_k\cos\theta).$$
      With $\theta = 30^\circ$ and $\mu_k = 0.2$, $\ddot x = 3.20$ m/s$^2$.
    decoys:
      - body: |
          The second law gives one equation per axis, $F_x = m\ddot x$ and so on. For a block on a slope of angle $\theta$, with $x$ down the slope and $y$ normal to it, and a kinetic friction $f = \mu_k N$:
          $$N = mg\sin\theta,$$
          $$\ddot x = g(\cos\theta - \mu_k\sin\theta).$$
          With $\theta = 30^\circ$ and $\mu_k = 0.2$, $\ddot x = 7.51$ m/s$^2$.
        feedback: |
          Along the normal the block does not move, so $N$ balances the weight's normal part, $mg\cos\theta$. At $\theta \to 0$ the normal force must be the whole weight, and $\sin 0 = 0$ gives none.
      - body: |
          The second law gives one equation per axis, $F_x = m\ddot x$ and so on. For a block on a slope of angle $\theta$, with $x$ down the slope and $y$ normal to it, and a kinetic friction $f = \mu_k N$:
          $$N = mg\cos\theta,$$
          $$\ddot x = g(\sin\theta - \mu_k).$$
          With $\theta = 30^\circ$ and $\mu_k = 0.2$, $\ddot x = 2.94$ m/s$^2$.
        feedback: |
          Friction is $f = \mu_k N = \mu_k mg\cos\theta$, not $\mu_k mg$. Dividing by $m$ leaves $\mu_k g\cos\theta$, so $\ddot x = g(\sin\theta - \mu_k\cos\theta) = 3.20$ m/s$^2$.
    explanation: |
      Picking axes along and across the motion turns a vector problem into two small ones.

  - id: polarunit
    title: Polar unit vectors and velocity
    row: 3
    col: 3
    body: |
      With $\hat{\mathbf r}$ along the radius and $\hat{\boldsymbol\varphi}$ along increasing angle, both turn as the particle moves:
      $$\frac{d\hat{\mathbf r}}{dt} = \dot\varphi\,\hat{\boldsymbol\varphi}, \qquad \frac{d\hat{\boldsymbol\varphi}}{dt} = -\dot\varphi\,\hat{\mathbf r}.$$
      Then $\mathbf r = r\hat{\mathbf r}$ gives
      $$\mathbf v = \dot r\,\hat{\mathbf r} + r\dot\varphi\,\hat{\boldsymbol\varphi}.$$
    decoys:
      - body: |
          With $\hat{\mathbf r}$ along the radius and $\hat{\boldsymbol\varphi}$ along increasing angle, both turn as the particle moves:
          $$\frac{d\hat{\mathbf r}}{dt} = \dot\varphi\,\hat{\boldsymbol\varphi}, \qquad \frac{d\hat{\boldsymbol\varphi}}{dt} = \dot\varphi\,\hat{\mathbf r}.$$
          Then $\mathbf r = r\hat{\mathbf r}$ gives
          $$\mathbf v = \dot r\,\hat{\mathbf r} + r\dot\varphi\,\hat{\boldsymbol\varphi}.$$
        feedback: |
          Turning $\hat{\boldsymbol\varphi}$ by a small angle tilts it **back toward the centre**, against $\hat{\mathbf r}$: $d\hat{\boldsymbol\varphi}/dt = -\dot\varphi\,\hat{\mathbf r}$. The minus sign is what later makes the acceleration point inward.
      - body: |
          With $\hat{\mathbf r}$ along the radius and $\hat{\boldsymbol\varphi}$ along increasing angle, both turn as the particle moves:
          $$\frac{d\hat{\mathbf r}}{dt} = \dot\varphi\,\hat{\boldsymbol\varphi}, \qquad \frac{d\hat{\boldsymbol\varphi}}{dt} = -\dot\varphi\,\hat{\mathbf r}.$$
          Then $\mathbf r = r\hat{\mathbf r}$ gives
          $$\mathbf v = \dot r\,\hat{\mathbf r} + \dot\varphi\,\hat{\boldsymbol\varphi}.$$
        feedback: |
          $\dot\varphi$ is an angle per second, not a speed. The sideways speed is the arc length rate, $r\dot\varphi$: at the same $\dot\varphi$, a point twice as far out moves twice as fast.
    explanation: |
      The unit vectors are not constant, and their turning is the source of the extra acceleration terms.

  - id: polaracc
    title: Polar acceleration
    row: 3
    col: 2
    body: |
      Differentiating $\mathbf v$ once more and using the turning rates gives
      $$a_r = \ddot r - r\dot\varphi^2, \qquad a_\varphi = r\ddot\varphi + 2\dot r\dot\varphi.$$
      A 0.2 kg stone on a 0.5 m string at $\dot\varphi = 4$ rad/s has $a_r = -8$ m/s$^2$, so the string pulls with 1.6 N.
    decoys:
      - body: |
          Differentiating $\mathbf v$ once more and using the turning rates gives
          $$a_r = \ddot r, \qquad a_\varphi = r\ddot\varphi + 2\dot r\dot\varphi.$$
          A 0.2 kg stone on a 0.5 m string at $\dot\varphi = 4$ rad/s has $a_r = 0$, so the string needs no pull.
        feedback: |
          The stone changes direction, so it accelerates inward even at constant $r$. The term $-r\dot\varphi^2 = -0.5 \times 16 = -8$ m/s$^2$ is that centripetal acceleration, and $0.2 \times 8 = 1.6$ N is the pull.
      - body: |
          Differentiating $\mathbf v$ once more and using the turning rates gives
          $$a_r = \ddot r - r\dot\varphi^2, \qquad a_\varphi = r\ddot\varphi.$$
          A 0.2 kg stone on a 0.5 m string at $\dot\varphi = 4$ rad/s has $a_r = -8$ m/s$^2$, so the string pulls with 1.6 N.
        feedback: |
          The sideways acceleration has a second term, $2\dot r\dot\varphi$. A bead sliding out along a rod that turns at a steady rate has $\ddot\varphi = 0$ but still $a_\varphi = 2\dot r\dot\varphi \neq 0$.
    explanation: |
      Each term has a cause: the radius changing, the direction turning, or both at once.

edges:
  - [frames, inertial]
  - [inertial, second]
  - [frames, noninertial]
  - { from: inertial, to: noninertial, dashed: true }
  - [second, third]
  - [third, momentum]
  - [second, incline]
  - [incline, polarunit]
  - [polarunit, polaracc]

outroTitle: Level 2 in one picture
outro: |
  Two frames moving at a steady relative velocity $\mathbf u$ agree on acceleration, $\mathbf a = \mathbf a'$, so the **first law** can pick out the inertial frames, and in them the **second law** reads $\mathbf F = m\mathbf a = \dot{\mathbf p}$. In any other frame, $\mathbf a' = \mathbf a - \ddot{\mathbf R}$ breaks it. The **third law**, $\mathbf F_{12} = -\mathbf F_{21}$, makes internal forces cancel, so $\dot{\mathbf P} = \mathbf F^{\text{ext}}$. To use the second law, choose axes: along and across a slope, $N = mg\cos\theta$ and $\ddot x = g(\sin\theta - \mu_k\cos\theta)$; or along the radius and the angle, $a_r = \ddot r - r\dot\varphi^2$ and $a_\varphi = r\ddot\varphi + 2\dot r\dot\varphi$.
