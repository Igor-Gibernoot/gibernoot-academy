id: ch01-map
title: "Content Map: The Three Pictures of Mechanics"
kind: map
name: Level 1, Predicting Motion (Newton's force law, Fermat's shortcut and the action, the phase plane)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea. Guessing is still the point: try to rebuild the tour from memory before you read the options.

  The tour showed one subject from three sides. In the **middle**, Newton: a force law, and a *state* (where things are and how fast they move) that fixes the future. On the **left**, the shortcut: light and thrown balls pick a path, and one number per path, the *action*, decides which. On the **right**, the map of all motions: position against momentum, where every motion is a curve and chaos shows up first.

  For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake, and every wrong pick comes with a reason. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: fermat
    title: Fermat's quickest route
    row: 1
    col: 1
    body: |
      A lifeguard runs faster on sand than she swims, so the **quickest** route bends at the shore. Light does the same crossing glass or water: it takes the path of shortest **time**, found by trying crossing points and keeping the best one.
    decoys:
      - body: |
          A lifeguard runs faster on sand than she swims, so the **shortest** route is the straight line to the victim. Light does the same crossing glass or water: it takes the path of shortest **length**.
        feedback: |
          The straight line is the shortest distance, but she is slower in water, so it is not the quickest. With A 20 m on sand and B 10 m in water, 40 m along, at 5 and 1.5 m/s, the straight crossing takes 17.8 s while a crossing nearer B takes 15.4 s.
      - body: |
          A lifeguard runs faster on sand than she swims, so the **quickest** route bends at the shore. Light does the same crossing glass or water: it takes the path that is **always the longest** in time, so it never bends.
        feedback: |
          Light bends where it enters glass or water, exactly because the bent path is the quicker one. Fermat's idea is a **shortest time** rule, not a longest one.
    explanation: |
      This was the first hint that nature compares whole paths, not only the next step.

  - id: action
    title: Lagrangian and action
    row: 2
    col: 1
    body: |
      Kinetic energy $T$ (motion) minus potential energy $V$ (stored by position) is the **Lagrangian**:
      $$L = T - V.$$
      The **action** gives one number to a whole path:
      $$S = \int_{t_1}^{t_2} L\,dt.$$
      A free ball going 2 m in 2 s ($m = 1$ kg) has $S = 1$ J s at steady speed, and $S = 2$ J s with uneven speed.
    decoys:
      - body: |
          Kinetic energy $T$ (motion) plus potential energy $V$ (stored by position) is the **Lagrangian**:
          $$L = T + V.$$
          The **action** gives one number to a whole path:
          $$S = \int_{t_1}^{t_2} L\,dt.$$
          A free ball going 2 m in 2 s ($m = 1$ kg) has $S = 1$ J s at steady speed, and $S = 2$ J s with uneven speed.
        feedback: |
          $T + V$ is the total energy, which a free fall keeps constant. The Lagrangian is the **difference** $T - V$: it measures how motion and position trade off along the path.
      - body: |
          Kinetic energy $T$ (motion) minus potential energy $V$ (stored by position) is the **Lagrangian**:
          $$L = T - V.$$
          The **action** is its value at one instant, the difference $T - V$ at the start of the path:
          $$S = L(t_1).$$
          A free ball going 2 m in 2 s ($m = 1$ kg) has $S = 1$ J s at steady speed, and $S = 2$ J s with uneven speed.
        feedback: |
          The action adds up $L$ over the **whole path**: $S = \int L\,dt$. A single instant cannot tell a steady path from an uneven one, yet they have different actions, $1$ and $2$ J s.
    explanation: |
      The action turns a hard question (which motion?) into a comparison of numbers, one per path.

  - id: stationary
    title: The true path is stationary
    row: 3
    col: 1
    body: |
      Among all paths with the same ends, the real one makes the action **stationary**: a small change of the path leaves $S$ unchanged to first order,
      $$\delta S = 0.$$
      It can be a minimum, a maximum or a saddle. It works in any coordinates, because $S$ is one number per path.
    decoys:
      - body: |
          Among all paths with the same ends, the real one makes the action **smallest**: every other path has a larger $S$,
          $$S_{\text{true}} < S_{\text{other}}.$$
          So the true path is always a minimum. It works in any coordinates, because $S$ is one number per path.
        feedback: |
          Stationary is weaker than smallest. For the thrown ball the true $S = -33.3$ J s, and a nearby path gives $-28$, which is **larger**; but for a long spring motion a nearby path can have a smaller $S$. "Least action" is a nickname.
      - body: |
          Among all paths with the same ends, the real one makes the action **stationary**: a small change of the path leaves $S$ unchanged to first order,
          $$\delta S = 0.$$
          It can be a minimum, a maximum or a saddle. It works only in cartesian coordinates, because $S$ needs straight axes.
        feedback: |
          $S$ is one number per path, so it does not care how you label positions. That is why the action is so useful: you may pick the coordinates that fit the problem.
    explanation: |
      The condition $\delta S = 0$ is a rule for the whole path, and it picks out the same motion Newton's law gives.

  - id: law
    title: Newton's law
    row: 1
    col: 2
    body: |
      A force changes the **velocity**, not just the position: the acceleration $\ddot{\mathbf r}$ (rate of change of velocity) obeys
      $$\mathbf{F} = m\ddot{\mathbf{r}}.$$
      With no force, a puck keeps sliding at steady speed.
    decoys:
      - body: |
          A force is needed to keep a thing **moving**: the velocity $\dot{\mathbf r}$ obeys
          $$\mathbf{F} = m\dot{\mathbf{r}}.$$
          With no force, a puck stops.
        feedback: |
          Friction stops a puck on a table, and friction is a force. Without any force the velocity stays as it is. The force sets the **change** of velocity, $m\ddot{\mathbf r}$.
      - body: |
          A force changes the **velocity**, not just the position: the acceleration $\ddot{\mathbf r}$ (rate of change of velocity) obeys
          $$\mathbf{F} = m\ddot{\mathbf{r}}.$$
          A heavy ball falls faster than a light one, because its force is larger.
        feedback: |
          The weight is larger, but so is the mass that resists: $mg = m\ddot y$ gives $\ddot y = g$ for any mass. Without air, a feather and a hammer fall together.
    explanation: |
      Everything on this side of the map comes from this one law and the state that feeds it.

  - id: state
    title: State and prediction
    row: 2
    col: 2
    body: |
      To predict a ball you need its **state**: the position **and** the velocity now. Then take small time steps: the force gives the acceleration, which updates the velocity, which updates the position. The same state always leads to the same future.
    decoys:
      - body: |
          To predict a ball you need only its **position** now. Then take small time steps: the force gives the acceleration, which updates the velocity, which updates the position. The same position always leads to the same future.
        feedback: |
          Two balls at the same place, one at rest and one thrown, share a position but have different futures. The position alone is not enough: the velocity is half of the state.
      - body: |
          To predict a ball you need its **state**: the position **and** the velocity now. Then take one big step to the end: the force gives the final position directly. Different states can lead to the same future.
        feedback: |
          The law gives acceleration, so the motion must be built in steps, each using the last one. And since the state fixes the future, two different states cannot lead to the same one.
    explanation: |
      "The state fixes the future" is the idea the phase plane will turn into a picture.

  - id: moon
    title: The Moon is a cannonball
    row: 3
    col: 2
    body: |
      A cannonball fired faster and faster from a mountain falls farther and farther away, until it **keeps missing** the Earth: an orbit. The Moon is such a ball, and the same law gives its acceleration toward the Earth: $9.8/3600 = 2.7\times10^{-3}\ \mathrm{m/s^2}$, the surface value at 60 times the distance.
    decoys:
      - body: |
          A cannonball fired faster and faster from a mountain falls farther and farther away, until it **leaves the law** and floats free: an orbit. The Moon needs a different law, with its own acceleration of about $9.8\ \mathrm{m/s^2}$.
        feedback: |
          An orbit is still falling: the ball keeps falling toward the Earth and keeps missing it. The Moon obeys the same law, and its acceleration is far smaller, $2.7\times10^{-3}\ \mathrm{m/s^2}$, because it is 60 times farther.
      - body: |
          A cannonball fired faster and faster from a mountain falls farther and farther away, until it **keeps missing** the Earth: an orbit. The Moon is such a ball, and the same law gives its acceleration toward the Earth: $9.8/60 = 0.16\ \mathrm{m/s^2}$, the surface value at 60 times the distance.
        feedback: |
          The pull weakens as the **square** of the distance, so 60 times farther gives $60^2 = 3600$ times less: $9.8/3600 = 2.7\times10^{-3}\ \mathrm{m/s^2}$, which matches the Moon's circular motion.
    explanation: |
      The apple and the Moon obey one law: this was Newton's test.

  - id: momentum
    title: Phase plane
    row: 1
    col: 3
    body: |
      Use the **momentum** $p = m\dot q$ (mass times velocity) with the position $q$. The pair $(q, p)$ is a point of the **phase plane**, and it is the full state: a whole motion is a curve in this plane.
    decoys:
      - body: |
          Use the **momentum** $p = m\ddot q$ (mass times acceleration) with the position $q$. The pair $(q, p)$ is a point of the **phase plane**, and it is the full state: a whole motion is a curve in this plane.
        feedback: |
          Momentum uses the **velocity** $\dot q$, not the acceleration. Position and momentum together fix the state, as position and velocity do.
      - body: |
          Use the **momentum** $p = m\dot q$ (mass times velocity) with the position $q$. The pair $(q, p)$ is a point of the **phase plane**, but position alone is the full state: the curve only adds a picture.
        feedback: |
          One number is not enough: the same position with different momenta gives different motions. The point $(q, p)$ carries the whole state.
    explanation: |
      This is the same state as before (position and velocity), now drawn as one point on a plane.

  - id: orbits
    title: Orbits are level curves of E
    row: 2
    col: 3
    body: |
      With no friction the energy $E$ stays fixed, so each motion stays on a **level curve** of $E$ in the $(q, p)$ plane. Curves **never cross**, because a point has one future. A swinging pendulum traces a closed loop; a spinning one runs on and on, and $q$ **wraps by $2\pi$**.
    decoys:
      - body: |
          With no friction the energy $E$ stays fixed, so each motion stays on a **level curve** of $E$ in the $(q, p)$ plane. Curves **can cross**, at a point where two motions meet. A swinging pendulum traces a closed loop; a spinning one runs on and on, and $q$ **wraps by $2\pi$**.
        feedback: |
          If two curves crossed, that point would have two futures, but the state fixes one. Curves may approach each other, never cross.
      - body: |
          With no friction the energy $E$ stays fixed, so each motion stays on a **level curve** of $E$ in the $(q, p)$ plane. Curves **never cross**, because a point has one future. A swinging pendulum traces a closed loop; a spinning one stops after one turn, and $q$ **wraps by $4\pi$**.
        feedback: |
          A spin is the same pendulum with enough energy to pass the top, so it keeps turning. The angle $q$ and $q + 2\pi$ are the same direction, so the plane wraps every $2\pi$.
    explanation: |
      The shape of the level curves shows the whole behaviour at a glance, without solving anything.

  - id: chaos
    title: Separatrix and friction
    row: 3
    col: 3
    body: |
      For the pendulum ($m = l = g = 1$, $E = p^2/2 + 1 - \cos q$) the curve with $E = 2$ is the **separatrix**: it divides swings from spins and passes through the unstable top. Friction turns the loops into a **spiral** that loses energy. Near the top, tiny differences grow: a first sign of **chaos**.
    decoys:
      - body: |
          For the pendulum ($m = l = g = 1$, $E = p^2/2 + 1 - \cos q$) the curve with $E = 1$ is the **separatrix**: it divides swings from spins and passes through the unstable top. Friction turns the loops into a **spiral** that loses energy. Near the top, tiny differences grow: a first sign of **chaos**.
        feedback: |
          At the top $q = \pi$ and $p = 0$, so $E = 0 + 1 - \cos\pi = 2$. A swing with $E = 1$ only climbs to the horizontal, well short of the top, so it is an ordinary loop.
      - body: |
          For the pendulum ($m = l = g = 1$, $E = p^2/2 + 1 - \cos q$) the curve with $E = 2$ is the **separatrix**: it divides swings from spins and passes through the unstable top. Friction turns the loops into **bigger loops** that gain energy. Near the top, tiny differences shrink: the motion is predictable.
        feedback: |
          Friction removes energy, so the orbit slides to lower $E$ and spirals in. Near the top, a ball poised on the point goes either way for a tiny nudge: small differences grow.
    explanation: |
      A pendulum that nearly reaches the top can take very long, and the choice between swing and spin is sensitive: the seed of chaos.

edges:
  - [fermat, action]
  - [action, stationary]
  - [law, state]
  - { from: state, to: moon, dashed: true }
  - [momentum, orbits]
  - [orbits, chaos]
  - { from: action, to: state, dashed: true }
  - [state, orbits]
  - [law, momentum]

outroTitle: Level 1 in one picture
outro: |
  Three pictures of one subject. **Newton** gives the law $\mathbf F = m\ddot{\mathbf r}$: know the state (position and velocity) and you can predict. **Lagrange** gives the action $S = \int (T - V)\,dt$: the true path is stationary, in any coordinates. **Hamilton** draws the state as a point $(q, p)$ with $p = m\dot q$, so every motion is a curve and the whole behaviour sits in one map. The same mechanics, seen three ways, each easy where the others are hard.
