id: ch01-traps
title: Intuition Traps
kind: traps
cards:
  - type: text
    id: hook
    title: Before any theory, guess
    body: |
      Remember: in this level the **guess is the point**. Everything here can be answered from common sense and the tour so far, and a wrong guess teaches more than a skipped question.

      This round is fast: one question per card, each built on a belief that many people hold. Wrong answers are welcome, because the feedback explains why each one is tempting. The questions revisit forces and falling, the shortcut rule of nature (the action), the map of all motions, and small differences at the start. If a question feels too easy, look for the catch.

  - type: mcq
    id: puck
    prompt: |
      A hockey puck slides on very smooth ice, so smooth that friction is almost zero. The puck moves at a steady speed along a straight line. Which force is needed to keep it going?
    options:
      - text: None. With no push or pull on it, the puck keeps its speed and direction
        correct: true
      - text: A small forward force, equal to the puck's weight
        feedback: |
          The weight points down and is cancelled by the ice pushing up, so it does nothing sideways. A force along the motion would speed the puck up, not keep it steady.
      - text: A small forward force, because otherwise it slows down by itself
        feedback: |
          Everyday objects do slow down, but because friction and air push backwards on them. Remove those and the slowing disappears.
      - text: A force that gets weaker as the puck goes, so that it never overshoots
        feedback: |
          A force is what makes the speed change. A steady speed means no net force at all.
    explanation: |
      A force changes the motion; it is not needed to maintain it. In Newton's law $\mathbf{F} = m\ddot{\mathbf{r}}$ (force equals mass times acceleration, the rate of change of the velocity), zero force means zero acceleration, so the velocity stays the same. The belief that motion needs a push comes from daily life, where friction is always there.

  - type: mcq
    id: feather
    prompt: |
      On the Moon, where there is no air, an astronaut lets go of a heavy hammer and a light feather from the same height at the same moment. What happens?
    options:
      - text: They land together
        correct: true
      - text: The hammer lands first, because the pull on it is bigger
        feedback: |
          The pull is bigger, but the hammer is also harder to speed up. Its larger mass in $F = ma$ cancels the larger pull, so the acceleration is the same.
      - text: The feather lands first, because it is lighter and easier to move
        feedback: |
          It is easier to move, but it is also pulled less. The two effects cancel exactly in gravity. On Earth the feather does float, but that is air pushing against it.
    explanation: |
      Near the ground the pull on a body of mass $m$ is $mg$, with $g$ a fixed number for the place. Newton's law gives $mg = ma$, so $a = g$, whatever the mass. Heavier things fall faster only when air gets in the way.

  - type: mcq
    id: station
    prompt: |
      Astronauts on a space station, about $400\ \mathrm{km}$ above the ground, float. Someone says: "They float because at that height there is no gravity". The pull of the Earth there is about $8.7\ \mathrm{m/s^2}$ per kilogram, compared with $9.8\ \mathrm{m/s^2}$ on the ground. What is wrong with the claim?
    options:
      - text: Gravity there is still about $90\%$ of its ground value. The station and the astronauts are both falling around the Earth, so they float relative to each other
        correct: true
      - text: Nothing is wrong, since $400\ \mathrm{km}$ is far enough for gravity to switch off
        feedback: |
          Gravity weakens with distance but never switches off. The Earth's radius is about $6371\ \mathrm{km}$, so $400\ \mathrm{km}$ is only a small step, and the pull drops by about a tenth.
      - text: Gravity there is weaker, about $10\%$ of its ground value, and that is what makes them float
        feedback: |
          Reading the numbers backwards: $8.7$ is close to $9.8$, not a tenth of it. A weaker pull would not make anything float anyway, since a body at rest above the ground would still fall.
    explanation: |
      The pull at the station is about $8.7\ \mathrm{m/s^2}$ (an approximate value, from the inverse-square law with the distance measured from the Earth's centre, about $6771\ \mathrm{km}$). The station is like Newton's cannonball, fired so fast that the ground curves away as fast as it drops. Station and crew fall together, so nothing presses the astronaut against the floor: free fall feels like weightlessness.

  - type: mcq
    id: moon-pull
    prompt: |
      The Moon is about $60$ Earth radii away. Someone says: "An apple falls because the Earth pulls it, but the Moon is far away and is not pulled by the Earth at all, so it just moves in a circle by itself". What is the best reply?
    options:
      - text: The Moon is pulled too, with the same law, only weaker. A pull $60^2 = 3600$ times smaller bends its straight path into a circle around the Earth
        correct: true
      - text: The Moon is pulled, but by a different force from the one on the apple
        feedback: |
          Newton's point was that it is the same force. At the Moon's distance the ground value $9.8\ \mathrm{m/s^2}$ divided by $3600$ gives about $2.7\times10^{-3}\ \mathrm{m/s^2}$, which is what the Moon's circle needs.
      - text: A circular motion needs no force, since the speed stays the same
        feedback: |
          A circle changes the direction of the velocity at every moment, and a change of velocity is an acceleration. The speed is steady, the velocity is not, so a force pointing to the centre is needed.
    explanation: |
      Without any force the Moon would go off along a straight line. The pull of the Earth, $3600$ times weaker than at the ground because the distance is $60$ times larger (inverse square), bends the path into a closed curve. The Moon is falling around the Earth in the same sense as the apple falls down.

  - type: mcq
    id: shortest
    prompt: |
      A lifeguard is on the sand, $20\ \mathrm{m}$ from the water's edge, and a swimmer is in the water, $10\ \mathrm{m}$ from the edge and $40\ \mathrm{m}$ further along the beach. The lifeguard runs at $5\ \mathrm{m/s}$ and swims at $1.5\ \mathrm{m/s}$. A friend says: "Take the straight line from lifeguard to swimmer, since the shortest path is the quickest". Is the friend right?
    options:
      - text: No. The straight line takes about $17.8\ \mathrm{s}$, and a route that runs farther on the sand and swims less takes about $15.4\ \mathrm{s}$
        correct: true
      - text: Yes. A straight line is the shortest, so it is also the quickest
        feedback: |
          It is the shortest in distance, but time is distance divided by speed, and the speeds differ. Metres on the sand cost less time than metres in the water, so the quickest route bends at the water's edge.
      - text: No. The quickest route is to run along the sand to the point nearest the swimmer, then swim straight
        feedback: |
          That helps and is already faster than the straight line ($15.6\ \mathrm{s}$), but it overshoots. The best point to enter the water is a little before it, about $37\ \mathrm{m}$ along, at $15.4\ \mathrm{s}$.
    explanation: |
      The straight line enters the water at $26.7\ \mathrm{m}$ along, giving $\sqrt{26.7^2 + 20^2}/5 + \sqrt{13.3^2 + 10^2}/1.5 \approx 17.8\ \mathrm{s}$. Entering at $37.3\ \mathrm{m}$ gives about $15.4\ \mathrm{s}$. Light does the same when it crosses from air into glass: it takes the quickest route, not the shortest one, which is why it bends. (The numbers are approximate to the first decimal.)

  - type: mcq
    id: least-everywhere
    prompt: |
      Someone summarizes the action rule as: "Nature always takes the path of **least** action, whatever the system and however long the motion". Which is the most accurate correction?
    options:
      - text: The real path makes the action stationary, so small changes of the path change $S$ only to second order. It is a minimum for simple cases such as a free ball, but a saddle for a spring over a long time
        correct: true
      - text: The real path always gives the largest action, not the smallest
        feedback: |
          Neither extreme is guaranteed. For a spring held over a long time, some small changes of the path lower $S$ and others raise it, so the real path is neither the lowest nor the highest.
      - text: The rule is false, since for a spring you can find a path with a lower action
        feedback: |
          The rule never promised the lowest. It promises that the real path is where $S$ is **stationary**, and that stays true for the spring.
    explanation: |
      "Least action" is a historical name. The precise rule is that the action is stationary on the real path: nearby paths give the same $S$ up to second order. For short motions this stationary point is a minimum, but a mass on a spring seen over a long time shows paths on both sides of it.

  - type: mcq
    id: instant
    prompt: |
      A student says: "The real path of a ball is the one with the smallest $T - V$ at every moment, since the action is $T - V$". What is wrong?
    options:
      - text: $T - V$ at one moment is $L$, the Lagrangian. The action is the sum of $L$ over all the moments of a path, and the rule compares whole paths by that sum, not moment by moment
        correct: true
      - text: Nothing, since choosing the smallest $T - V$ at each moment gives the smallest sum
        feedback: |
          Choosing a small value now can force large values later: the ball has to arrive at the end point on time. A smaller value at one moment does not make a smaller total, and the principle asks for stationary, not smallest.
      - text: The action is $T + V$, the total energy, which stays constant
        feedback: |
          $T + V$ is the energy, a different quantity. The action uses the **difference** $T - V$ and adds it up over time.
    explanation: |
      The action $S = \int L\,dt$ is a number for each whole path. The moments of the path are linked, since where the ball is now fixes where it can be next, so you cannot pick the best value moment by moment. You compare entire paths.

  - type: mcq
    id: position-only
    prompt: |
      Two balls are at the same height at the same instant. One is rising, the other is falling, and both feel only gravity. A friend says: "Same position, so they will do the same thing next". What is the correct statement?
    options:
      - text: They will not. Position alone does not fix the future. The state is position and speed together, and these two states differ in speed
        correct: true
      - text: They will, because gravity is the same at the same height
        feedback: |
          The force is the same, so the *change* of velocity is the same, but the velocities themselves differ. One ball first keeps rising for a while, the other already heads down.
      - text: They will not, because the one that rose earlier has more energy
        feedback: |
          Their energies could be equal. What differs is the direction of the velocity, and that, together with position, decides the path.
    explanation: |
      A prediction needs the position and the velocity now (and the force law). The pair is one point on the map of all motions, and one point has exactly one future. Two points with the same position and opposite speeds are different points, and they lead to different futures.

  - type: mcq
    id: self-cross
    prompt: |
      On the map of a frictionless pendulum (position $q$ across, momentum $p$ up), a friend draws **one** orbit that crosses itself, like a figure 8. Can that be a real motion?
    options:
      - text: No. At the crossing point the same state would lead to two different next steps, but one state has only one future
        correct: true
      - text: Yes, since the pendulum swings back and forth and passes the same place twice
        feedback: |
          It passes the same *place* twice, but with opposite speeds, and these are two different points of the map. A figure 8 needs the same place and the same speed.
      - text: Yes, but only if the pendulum is pushed at the crossing
        feedback: |
          A push would change the motion, and the map of the free pendulum has no pushes. Without an outside push, the future of each point is fixed.
    explanation: |
      On a closed orbit, once the state returns to a point it repeats everything that followed, so it traces the same loop again. A single orbit can close up, but it cannot cross itself or another orbit.

  - type: mcq
    id: top-edge
    prompt: |
      A pendulum spins steadily over the top. On its map, the angle $q$ is measured from the hanging position, so the top is at $q = \pi$ when reached by turning one way and $q = -\pi$ when reached by turning the other way. A friend says: "These are two different places on the map, so the orbit has an end at the edge". How many positions of the rod do $q = \pi$ and $q = -\pi$ describe?
    options:
      - text: One. They differ by a full turn, $2\pi$, so the rod points the same way, straight up. The orbit leaves one edge of the picture and re-enters at the other
        correct: true
      - text: Two. The rod pointing up after a turn to the right is not the same as after a turn to the left
        feedback: |
          Turning to the right or to the left by half a turn ends with the rod pointing the same way. Only the final direction of the rod matters for the position.
      - text: One, but only at rest
        feedback: |
          The rod is in the same position whether it moves or not. What can differ is the speed $p$, and on a spinning orbit that is the same at both edges.
    explanation: |
      Angles that differ by $2\pi$ are the same position. The orbit of a spinning pendulum has no end: it goes round and round, like a path on a cylinder whose two edges are glued together.

  - type: mcq
    id: friction-high
    prompt: |
      A pendulum with friction is released from rest at the angle $q = 2$ (radians). Friction removes energy but cannot add any. Could a later swing ever go to an angle larger than $2$?
    options:
      - text: No. Each swing loses energy, so it cannot reach the height from which it began, let alone a higher one
        correct: true
      - text: Yes, since a swing can overshoot when it comes back with speed
        feedback: |
          Speed at the bottom is paid for by energy of height. The most it can do is turn all of its energy back into height, which is the starting height at best. With friction there is less.
      - text: Yes, if the friction is very small, since then the energy can grow slightly
        feedback: |
          Friction only takes energy away, however small it is. A smaller friction means a slower loss, not a gain.
    explanation: |
      The energy $E = \tfrac12 p^2 + 1 - \cos q$ cannot grow without a push, and friction makes it fall at each swing. A swing is highest where the pendulum stops (all energy is height), so the turning heights decrease swing after swing, and the orbit spirals inward.

  - type: numeric
    id: chaos-time
    prompt: |
      In a system where a tiny error in the start doubles every $10\ \mathrm{s}$, an error of $0.001$ grows to $1$, a size that ruins the prediction, after about $10$ doublings, which is $100\ \mathrm{s}$. You then measure the start $1000$ times more precisely, so the error is $0.000001$. For about how many **seconds** is the prediction good now?
    answer: 200
    tolerance: 10
    wrong:
      - { value: 100000, feedback: 'You assumed a prediction that lasts $1000$ times longer, which is true when an error grows steadily. Here the error **doubles** each time, so a $1000$-fold better start gains only a fixed number of doublings.' }
      - { value: 100, feedback: 'That is the old time. A smaller starting error does help, but only a little.' }
    hint: |
      How many doublings take $0.000001$ to $1$? Remember that $2^{10} \approx 1000$.
    explanation: |
      A factor $1000$ is about $2^{10}$, which means ten more doublings, each of $10\ \mathrm{s}$: $100\ \mathrm{s}$ more, so about $200\ \mathrm{s}$ in total. Tiny differences in a sensitive system, like a ball started near a hilltop, grow so quickly that better measurements buy only a little extra time. This is why the weather is hard to forecast far ahead even though its laws are known.

  - type: text
    id: summary
    title: What you now own
    body: |
      The beliefs you tested, with the fact that replaces each.

      - **Force and motion.** A force changes the velocity; it is not needed to keep it. In $\mathbf{F} = m\ddot{\mathbf{r}}$, $\mathbf{F} = \mathbf{0}$ means a steady velocity. Near the ground the pull is $mg$, so every body falls with $a = g$. Free fall, around the Earth or toward it, feels like weightlessness, and the Moon is pulled by the same law as an apple, weaker by $60^2$.
      - **Quickest, not shortest.** Light and lifeguards choose the route of least time, which bends where the speed changes.
      - **Stationary action.** The action $S = \int L\,dt$, with $L = T - V$, is a number for a whole path, and the real path makes it stationary, not always least.
      - **State.** Position and velocity together fix the future. On the map of a frictionless pendulum, orbits do not cross or cross themselves, a spinning orbit wraps around ($q$ and $q + 2\pi$ are one position), and friction makes the energy fall so the orbit spirals into the bottom.
      - **Sensitivity.** Near an unstable point a tiny error in the start grows quickly, so a much better measurement buys little extra prediction time.

      **Next:** the content map, where you rebuild the picture of Newton's forces, Lagrange's action and Hamilton's phase space box by box.
