id: ch05-map
title: "Content Map: Energy"
kind: map
name: Level 5, Energy (work and kinetic energy, potential energy, force from a potential and the curl test, energy diagrams, stability, time from energy, many particles)

intro: |
  This map shows how the ideas of the level fit together. Each box is one idea. Try to rebuild each one from memory before you read the options.

  The level started with **work**: the line integral of the force, which changes the kinetic energy. When the work does not depend on the road, a **potential energy** exists, and the force is minus its gradient; the **curl** is the quick test. In one dimension the potential becomes a picture, the **energy diagram**, which gives the speed, the turning points, the **stability** of equilibria and the **time** of a trip. Finally the same bookkeeping covers **many particles**.

  For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake, and every wrong pick comes with a reason. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: work
    title: Work and kinetic energy
    row: 1
    col: 2
    body: |
      For a force $\mathbf F$ along a road from point 1 to point 2, with $T = \tfrac12 mv^2$,
      $$W(1\to2) = \int_1^2 \mathbf F\cdot d\mathbf r,$$
      $$T_2 - T_1 = W(1\to2).$$
      For $\mathbf F = (y, 2x)$ N from $(0,0)$ to $(1,1)$ m, the diagonal road gives $W = 1.5$ J, so a 2 kg bead from rest arrives at $\sqrt{1.5} = 1.22$ m/s.
    decoys:
      - body: |
          For a force $\mathbf F$ along a road from point 1 to point 2, with $T = \tfrac12 mv^2$,
          $$W(1\to2) = \int_1^2 \mathbf F\cdot d\mathbf r,$$
          $$T_2 - T_1 = W(1\to2).$$
          For $\mathbf F = (y, 2x)$ N from $(0,0)$ to $(1,1)$ m, the diagonal road gives $W = 1.5$ J, so a 2 kg bead from rest arrives at $1.5$ m/s.
        feedback: |
          The work is an energy, not a speed. It equals $T_2 - T_1 = \tfrac12 mv^2$, so $v = \sqrt{2W/m} = \sqrt{1.5} = 1.22$ m/s for $m = 2$ kg.
      - body: |
          For a force $\mathbf F$ along a road from point 1 to point 2, with $T = \tfrac12 mv^2$,
          $$W(1\to2) = \int_1^2 \mathbf F\cdot d\mathbf r,$$
          $$T_2 - T_1 = W(1\to2).$$
          For $\mathbf F = (y, 2x)$ N from $(0,0)$ to $(1,1)$ m, every road gives the same $W = 1.5$ J, since the ends are the same.
        feedback: |
          The work depends on the road in general. For this force, the axis-then-up road gives 2 J, the diagonal 1.5 J and the quarter circle $2 - \pi/4 = 1.21$ J. Road independence is a special property of some forces, not of the integral.
    explanation: |
      The theorem holds for any force and any road. Everything after it asks when the work can be replaced by something simpler.

  - id: conservative
    title: Potential energy
    row: 2
    col: 1
    body: |
      If $\mathbf F = \mathbf F(\mathbf r)$ and the work does not depend on the road, define, with a reference point $\mathbf r_0$,
      $$V(\mathbf r) = -\int_{\mathbf r_0}^{\mathbf r}\mathbf F\cdot d\mathbf r',$$
      $$W(1\to2) = V_1 - V_2.$$
      Then $E = T + V$ is constant, and with other forces $\Delta E = W_{\text{nc}}$. A 2 kg mass at 1.5 m has $V = mgy = 29.4$ J.
    decoys:
      - body: |
          If $\mathbf F = \mathbf F(\mathbf r)$ and the work does not depend on the road, define, with a reference point $\mathbf r_0$,
          $$V(\mathbf r) = +\int_{\mathbf r_0}^{\mathbf r}\mathbf F\cdot d\mathbf r',$$
          $$W(1\to2) = V_2 - V_1.$$
          Then $E = T + V$ is constant, and with other forces $\Delta E = W_{\text{nc}}$. A 2 kg mass at 1.5 m has $V = mgy = 29.4$ J.
        feedback: |
          Potential energy is the work you must do against the force, so $V$ carries a minus sign: $V = -\int\mathbf F\cdot d\mathbf r'$. With the plus sign, $T + V$ would not be constant: a falling mass gains $T$ and would also gain $V$.
      - body: |
          If $\mathbf F = \mathbf F(\mathbf r)$ and the work does not depend on the road, define, with a reference point $\mathbf r_0$,
          $$V(\mathbf r) = -\int_{\mathbf r_0}^{\mathbf r}\mathbf F\cdot d\mathbf r',$$
          $$W(1\to2) = V_1 - V_2.$$
          Then $E = T + V$ is always constant, friction included. A 2 kg mass at 1.5 m has $V = mgy = 29.4$ J.
        feedback: |
          $E = T + V$ is constant only if every force is conservative. Friction has no potential energy, and $\Delta E = W_{\text{nc}}$ counts what it removes: a 1 kg block with 3 N friction over a 2 m slide loses 6 J.
    explanation: |
      The reference point is arbitrary, since only differences $V_1 - V_2$ matter.

  - id: curl
    title: Force from a potential, the curl test
    row: 2
    col: 3
    body: |
      A conservative force is the downhill slope of $V$:
      $$F_x = -\frac{\partial V}{\partial x},\quad \mathbf F = -\nabla V.$$
      On a region without holes, $\mathbf F$ is conservative if and only if
      $$\frac{\partial F_y}{\partial x} - \frac{\partial F_x}{\partial y} = 0.$$
      From $V = x^2y + 2y$, $\mathbf F = (-4, -6)$ N at $(2,1)$. The field $(-y, x)/(x^2+y^2)$ has zero curl but work $2\pi$ around the unit circle: its region has a hole.
    decoys:
      - body: |
          A conservative force is the uphill slope of $V$:
          $$F_x = +\frac{\partial V}{\partial x},\quad \mathbf F = +\nabla V.$$
          On a region without holes, $\mathbf F$ is conservative if and only if
          $$\frac{\partial F_y}{\partial x} - \frac{\partial F_x}{\partial y} = 0.$$
          From $V = x^2y + 2y$, $\mathbf F = (4, 6)$ N at $(2,1)$. The field $(-y, x)/(x^2+y^2)$ has zero curl but work $2\pi$ around the unit circle: its region has a hole.
        feedback: |
          Forces push toward lower potential energy, as a ball rolls downhill: $\mathbf F = -\nabla V$. The sign is fixed by $W = V_1 - V_2 = -\Delta V$, so $V = x^2y + 2y$ gives $\mathbf F = (-4, -6)$ N.
      - body: |
          A conservative force is the downhill slope of $V$:
          $$F_x = -\frac{\partial V}{\partial x},\quad \mathbf F = -\nabla V.$$
          Wherever it holds, zero curl makes $\mathbf F$ conservative on any region:
          $$\frac{\partial F_y}{\partial x} - \frac{\partial F_x}{\partial y} = 0.$$
          From $V = x^2y + 2y$, $\mathbf F = (-4, -6)$ N at $(2,1)$. The field $(-y, x)/(x^2+y^2)$ has zero curl, so its work around the unit circle is $0$.
        feedback: |
          Zero curl is a local test. It proves road independence only on a region without holes. For $(-y, x)/(x^2+y^2)$ both partial derivatives equal $(y^2 - x^2)/r^4$, so the curl is zero, yet the work around the unit circle is $2\pi$.
    explanation: |
      The curl test is the shrinking-loop form of "zero work on every closed road".

  - id: diagram
    title: Energy diagram in one dimension
    row: 3
    col: 1
    body: |
      In one dimension the force is always conservative, and $E = \tfrac12 m\dot x^2 + V(x)$ gives
      $$\dot x = \pm\sqrt{\frac{2}{m}\,\bigl(E - V(x)\bigr)}.$$
      The motion stays where $E \ge V$ and turns where $V(x) = E$. A spring with $k = 50$ N/m and $E = 4$ J turns at $x = \sqrt{2E/k} = 0.4$ m.
    decoys:
      - body: |
          In one dimension the force is always conservative, and $E = \tfrac12 m\dot x^2 + V(x)$ gives
          $$\dot x = \pm\sqrt{\frac{2}{m}\,\bigl(E + V(x)\bigr)}.$$
          The motion stays where $E \ge -V$ and turns where $V(x) = -E$. A spring with $k = 50$ N/m and $E = 4$ J turns at $x = \sqrt{2E/k} = 0.4$ m.
        feedback: |
          The kinetic energy is what is left of $E$ after the potential energy is paid: $T = E - V$. A sign error here moves the turning points to the wrong places.
      - body: |
          In one dimension the force is always conservative, and $E = \tfrac12 m\dot x^2 + V(x)$ gives
          $$\dot x = \pm\sqrt{\frac{2}{m}\,\bigl(E - V(x)\bigr)}.$$
          The motion stays where $E \ge V$ and turns where $V'(x) = 0$. A spring with $k = 50$ N/m and $E = 4$ J turns at $x = 0$.
        feedback: |
          Where $V' = 0$ the force is zero, not the speed. At $x = 0$ the spring has its largest speed. The ball stops where $V = E$, which is where the kinetic energy vanishes.
    explanation: |
      The sign of $\dot x$ is chosen by looking at which way the ball moves. Equilibria, stability and travel times all read off the same graph.

  - id: stability
    title: Equilibrium and small oscillations
    row: 4
    col: 1
    body: |
      An equilibrium $x_0$ has $V'(x_0) = 0$. It is stable if $V''(x_0) > 0$, and then small motion is simple harmonic:
      $$\omega = \sqrt{\frac{V''(x_0)}{m}},$$
      $$\tau = 2\pi\sqrt{\frac{m}{V''(x_0)}}.$$
      For $V = x^4 - 2x^2$ and $m = 0.5$ kg at $x_0 = 1$ m, $V'' = 12x^2 - 4 = 8$, so $\tau = 2\pi\sqrt{0.5/8} = 1.57$ s.
    decoys:
      - body: |
          An equilibrium $x_0$ has $V'(x_0) = 0$. It is stable if $V''(x_0) < 0$, and then small motion is simple harmonic:
          $$\omega = \sqrt{\frac{V''(x_0)}{m}},$$
          $$\tau = 2\pi\sqrt{\frac{m}{V''(x_0)}}.$$
          For $V = x^4 - 2x^2$ and $m = 0.5$ kg at $x_0 = 1$ m, $V'' = 12x^2 - 4 = 8$, so $\tau = 2\pi\sqrt{0.5/8} = 1.57$ s.
        feedback: |
          A stable equilibrium is the bottom of a valley, where $V$ curves up: $V'' > 0$. At a hilltop $V'' < 0$, the restoring force becomes a push away, and $\omega$ would be imaginary.
      - body: |
          An equilibrium $x_0$ has $V'(x_0) = 0$. It is stable if $V''(x_0) > 0$, and then small motion is simple harmonic:
          $$\omega = \sqrt{\frac{V''(x_0)}{m}},$$
          $$\tau = 2\pi\sqrt{\frac{V''(x_0)}{m}}.$$
          For $V = x^4 - 2x^2$ and $m = 0.5$ kg at $x_0 = 1$ m, $V'' = 12x^2 - 4 = 8$, so $\tau = 2\pi\sqrt{8/0.5} = 25.1$ s.
        feedback: |
          The period is $2\pi/\omega$, so the mass goes in the numerator and $V''$ in the denominator. A stiffer valley (larger $V''$) oscillates faster, not slower, and a heavier mass oscillates slower.
    explanation: |
      Near a stable equilibrium every smooth valley looks like a spring with $k = V''(x_0)$. If $V'' = 0$ the test is silent and higher derivatives decide.

  - id: time
    title: Time from energy
    row: 4
    col: 2
    body: |
      Since $\dot x = dx/dt$ is known from the energy,
      $$t = \int_{x_0}^{x}\frac{dx'}{\dot x(x')}$$
      $$= \sqrt{\frac m2}\int_{x_0}^{x}\frac{dx'}{\sqrt{E - V(x')}}.$$
      Free fall, $V = -mgx$ with $x$ downward and $E = 0$, gives $t = \sqrt{2x/g} = 2.02$ s for 20 m. A spring with $m = 2$ kg and $k = 8$ N/m kicked at the origin with $A = 0.5$ m gives $t = \sqrt{m/k}\,\arcsin(x/A)$.
    decoys:
      - body: |
          Since $\dot x = dx/dt$ is known from the energy,
          $$t = \int_{x_0}^{x}\dot x(x')\,dx'$$
          $$= \sqrt{\frac 2m}\int_{x_0}^{x}\sqrt{E - V(x')}\,dx'.$$
          Free fall, $V = -mgx$ with $x$ downward and $E = 0$, gives $t = \sqrt{2x/g} = 2.02$ s for 20 m. A spring with $m = 2$ kg and $k = 8$ N/m kicked at the origin with $A = 0.5$ m gives $t = \sqrt{m/k}\,\arcsin(x/A)$.
        feedback: |
          Time is distance divided by speed, so the integrand is $dx/\dot x$, not $\dot x\,dx$. Slow stretches, near turning points, take long, and the integrand $1/\sqrt{E - V}$ is large there.
      - body: |
          Since $\dot x = dx/dt$ is known from the energy,
          $$t = \int_{x_0}^{x}\frac{dx'}{\dot x(x')}$$
          $$= \sqrt{\frac m2}\int_{x_0}^{x}\frac{dx'}{\sqrt{E - V(x')}}.$$
          Free fall, $V = -mgx$ with $x$ downward and $E = 0$, gives $t = \sqrt{2x/g} = 2.02$ s for 20 m. A spring with $m = 2$ kg and $k = 8$ N/m kicked at the origin with $A = 0.5$ m gives $t = \sqrt{m/k}\,\dfrac{x}{A}$.
        feedback: |
          The spring speed is not constant: $\dot x = \sqrt{k/m}\sqrt{A^2 - x^2}$ shrinks toward the turning point. The integral gives an inverse sine, which is the same as $x = A\sin(\sqrt{k/m}\,t)$, with $x = 0.5\sin 2t$ here.
    explanation: |
      The energy gives $t(x)$ even when the equation of motion is hard to solve; inverting the integral gives $x(t)$.

  - id: many
    title: Energy of many particles
    row: 3
    col: 3
    body: |
      For pair potentials $V_{\alpha\beta}(\mathbf r_\alpha - \mathbf r_\beta)$ and outside potentials $V^{\text{ext}}_\alpha$,
      $$V = \sum_\alpha\sum_{\beta>\alpha}V_{\alpha\beta} + \sum_\alpha V^{\text{ext}}_\alpha,$$
      $$E = T + V.$$
      Each pair is counted once. Carts of 2 kg and 1 kg joined by a spring with $k = 6$ N/m and natural length $0$, released at rest at $r = 2$ m, have $V = \tfrac12 kr^2 = 12$ J, so they pass the centre at 2 and 4 m/s.
    decoys:
      - body: |
          For pair potentials $V_{\alpha\beta}(\mathbf r_\alpha - \mathbf r_\beta)$ and outside potentials $V^{\text{ext}}_\alpha$,
          $$V = \sum_\alpha\sum_{\beta\neq\alpha}V_{\alpha\beta} + \sum_\alpha V^{\text{ext}}_\alpha,$$
          $$E = T + V.$$
          Each pair is counted twice. Carts of 2 kg and 1 kg joined by a spring with $k = 6$ N/m and natural length $0$, released at rest at $r = 2$ m, have $V = 2\times 12 = 24$ J, so they pass the centre at 2.83 and 5.66 m/s.
        feedback: |
          The sum over $\beta \ne \alpha$ visits the pair $(\alpha,\beta)$ and again $(\beta,\alpha)$, so it double counts. Either restrict to $\beta > \alpha$ or put a factor $\tfrac12$ in front. The spring stores $\tfrac12 kr^2 = 12$ J, once.
      - body: |
          For pair potentials $V_{\alpha\beta}(\mathbf r_\alpha - \mathbf r_\beta)$ and outside potentials $V^{\text{ext}}_\alpha$,
          $$V = \sum_\alpha\sum_{\beta>\alpha}V_{\alpha\beta} + \sum_\alpha V^{\text{ext}}_\alpha,$$
          $$E = T + V.$$
          Each pair is counted once. Carts of 2 kg and 1 kg joined by a spring with $k = 6$ N/m and natural length $0$, released at rest at $r = 2$ m, share the 12 J equally, so they pass the centre at 2.45 and 3.46 m/s.
        feedback: |
          The energy does not split equally. The spring forces on the two carts are equal and opposite, so the carts gain equal momentum, and $T = p^2/2m$ is larger for the lighter one. Here $T_1 = 4$ J and $T_2 = 8$ J, with speeds 2 and 4 m/s.
    explanation: |
      Internal potentials depend on the separation, so only the total $E$ is protected; with a non-conservative force, $dE = W_{\text{nc}}$.

edges:
  - [work, conservative]
  - [conservative, curl]
  - [conservative, diagram]
  - [diagram, stability]
  - [diagram, time]
