outroTitle: Level 5 in one picture
outro: |
  The **work** $W = \int\mathbf F\cdot d\mathbf r$ changes the kinetic energy, $T_2 - T_1 = W$. When the work is road independent, **potential energy** $V = -\int_{\mathbf r_0}^{\mathbf r}\mathbf F\cdot d\mathbf r'$ gives $W = V_1 - V_2$ and a constant $E = T + V$, with $\Delta E = W_{\text{nc}}$ for the other forces. The force is $\mathbf F = -\nabla V$, and zero curl ($\partial F_y/\partial x - \partial F_x/\partial y = 0$) is the local test, valid on regions without holes. In one dimension $\dot x = \pm\sqrt{2(E - V)/m}$ gives the allowed region, turning points where $V = E$, stable equilibria where $V'' > 0$ with $\omega = \sqrt{V''(x_0)/m}$, and the time $t = \sqrt{m/2}\int dx'/\sqrt{E - V}$. For many particles, $V$ adds each pair once plus the outside terms, and $E = T + V$.
