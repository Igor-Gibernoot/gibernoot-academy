# The trail. One level per topic of the course's own spine, lessons in trail order.
# Two main sources: Taylor for Levels 1-13 (undergraduate, pedagogical) and
# Goldstein for Levels 14-18 (graduate), with Goldstein (and Lemos for Noether and fields)
# as the second derivation where they treat the same topic. The level-to-section
# map is in this course's CLAUDE.md.
#
# A lesson entry with `file:` is built and playable; without it, it shows as
# a planned (greyed) node. `kind` is concept | guided | traps | intuition, plus
# the end-of-level kinds: map (content-map puzzle), review (automatic, no file:
# practises only this level's questions) and challenge (mixed problems).
# Exams: own levels exam-partial1 (after Level 6, covers 2-6), exam-partial2
# (after Level 12, covers 7-12) and exam-final (after Level 18, covers 13-18).
# No exam covers more than 6 levels (root CLAUDE.md, Exam). Original exams.

title: Classical Mechanics
overview:
  text: >-
    Throw a ball and you can say where it will land before it gets there. How is that possible? Classical mechanics is the art of predicting motion: falling apples, orbiting planets, spinning tops, swinging pendulums. It began with three short laws written by Newton, and grew into something stranger and deeper: nature seems to choose, among all possible paths, the one that makes a single quantity as small as possible, and every symmetry of the world hides something that never changes. These ideas became the language of all of physics, from quantum theory to chaos. If you like to guess first and check after, start here: every level is a game of puzzles, guided derivations and a final challenge.
  sources:
    - who: John R. Taylor
      what: "Classical Mechanics (University Science Books, 2005). The guide for Newton's laws through oscillations, orbits, rotation and normal modes."
    - who: Herbert Goldstein, Charles Poole and John Safko
      what: "Classical Mechanics, 3rd edition (Addison-Wesley, 2002). The guide for Hamiltonian mechanics, canonical transformations, Hamilton-Jacobi theory, chaos and classical fields."
    - who: Nivaldo A. Lemos
      what: "Analytical Mechanics (Cambridge University Press, 2018). The guide for symmetries, Noether's theorem, integrability and classical fields."

levels:
  - id: ch01
    number: 1
    title: "Predicting Motion"
    blurb: "A light tour: what it means to predict motion, nature's shortcut through the principle of least action, and a map of all possible motions. Guessing is the point."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 1, Newton's Laws of Motion (tone of the tour)"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Section 2.1"
    lessons:
      - id: ch01-prediction
        title: "Can You Predict the Future?"
        kind: concept
        file: ch01/prediction.yaml
        summary: "The apple and the Moon obey one law. Why knowing where things are and how fast they move fixes everything that comes next."
      - id: ch01-least-action
        title: "Nature's Shortcut"
        kind: concept
        file: ch01/least-action.yaml
        summary: "Light picks the fastest path, and a thrown ball picks a path too. A first look at the action, and why it makes hard problems easy."
      - id: ch01-phase-space
        title: "A Map of All Motions"
        kind: concept
        file: ch01/phase-space.yaml
        summary: "Draw position against momentum and a pendulum becomes a picture. Energy, conserved quantities, and a first glimpse of chaos."
      - id: ch01-traps
        title: Intuition Traps
        kind: traps
        file: ch01/traps.yaml
        summary: "A fast round of the everyday beliefs about motion that Newton overturned: forces that keep things moving, heavy things falling faster, and more."
      - id: ch01-map
        title: "Content Map: The Three Pictures of Mechanics"
        kind: map
        file: ch01/map.yaml
        summary: "Rebuild the tour: Newton's forces, Lagrange's action, Hamilton's phase space, and what each one is for."
      - { id: ch01-review, title: Level Review, kind: review }
      - id: ch01-challenge
        title: Level Challenge
        kind: challenge
        file: ch01/challenge.yaml
        summary: "Five puzzles that mix the three pictures: predict, find the shortcut, read the map. Built in two parts: problems 1 to 3 (skimming satellite, lifeguard, kicked pendulum), then 4 and 5."

  - id: ch02
    number: 2
    title: "Newton's Laws"
    blurb: "Space, time and reference frames, the three laws and what they really say, and Newton's second law in cartesian and polar coordinates."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 1, Newton's Laws of Motion"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Section 1.1"
    lessons:
      - id: ch02-space-time
        title: "Where and When: Frames and Vectors"
        kind: concept
        file: ch02/space-time.yaml
        summary: "Before any law, you need a stage. Reference frames, position vectors, dot and cross products, and velocity and acceleration as derivatives."
      - id: ch02-inertia
        title: "Inertia and F = ma"
        kind: concept
        file: ch02/inertia.yaml
        summary: "Does a moving thing need a push to keep moving? The first and second laws, mass, and why the first law defines inertial frames."
      - id: ch02-third-law
        title: "Action, Reaction and Momentum"
        kind: concept
        file: ch02/third-law.yaml
        summary: "Why the third law is the conservation of momentum in disguise, and the case where it fails: two moving charges."
      - id: ch02-cartesian
        title: "Guided Problem: A Block on an Incline"
        kind: guided
        file: ch02/cartesian.yaml
        summary: "Guided problem: solve the second law in cartesian components for a block sliding down a rough slope, from forces to motion."
      - id: ch02-polar
        title: "Newton in Polar Coordinates"
        kind: concept
        file: ch02/polar.yaml
        summary: "Why does a particle moving in a circle at steady speed accelerate? Polar unit vectors that turn as the particle moves."
      - id: ch02-polar-proof
        title: "Guided Proof: Acceleration in Polar Coordinates"
        kind: guided
        file: ch02/polar-proof.yaml
        summary: "Guided proof: derive the radial and angular parts of the acceleration, and meet the centripetal and Coriolis terms."
      - id: ch02-traps
        title: Newton Traps
        kind: traps
        file: ch02/traps.yaml
        summary: "A fast round of the classic mistakes with forces, frames and action-reaction pairs."
      - id: ch02-intuition
        title: "Intuition: Components and Unit Vectors"
        kind: intuition
        file: ch02/intuition.yaml
        summary: "Quick recall of the second law in cartesian and polar components, with dimension and limit checks."
      - id: ch02-map
        title: "Content Map: Newton's Laws"
        kind: map
        file: ch02/map.yaml
        summary: "Rebuild the level box by box, from frames and vectors to the three laws and polar components."
      - { id: ch02-review, title: Level Review, kind: review }
      - id: ch02-challenge
        title: Level Challenge
        kind: challenge
        file: ch02/challenge.yaml
        summary: "Harder problems that combine frames, the three laws and polar coordinates. Five problems: a crate on an accelerating cart, two skaters with a rope, a bead on a spiral, a block launched up a rough slope, a puck on a string."

  - id: ch03
    number: 3
    title: "Projectiles and Charged Particles"
    blurb: "Air resistance, linear and quadratic; terminal speed; and a charge spiralling in a magnetic field, solved with complex numbers."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 2, Projectiles and Charged Particles"
    lessons:
      - id: ch03-drag
        title: "Air Resistance"
        kind: concept
        file: ch03/drag.yaml
        summary: "Why does a raindrop stop speeding up? Linear and quadratic drag, and how to tell which one wins."
      - id: ch03-linear-drag
        title: "Linear Drag and Terminal Speed"
        kind: concept
        file: ch03/linear-drag.yaml
        summary: "Solve the motion with linear drag: the exponential approach to terminal speed, horizontal and vertical."
      - id: ch03-trajectory
        title: "Guided Problem: Range with Linear Drag"
        kind: guided
        file: ch03/trajectory.yaml
        summary: "Guided problem: a projectile with linear drag, its trajectory and how much range the air costs."
      - id: ch03-quadratic-drag
        title: "Quadratic Drag"
        kind: concept
        file: ch03/quadratic-drag.yaml
        summary: "A baseball and a skydiver: quadratic drag, terminal speed, and the hyperbolic tangent."
      - id: ch03-magnetic
        title: "A Charge in a Magnetic Field"
        kind: concept
        file: ch03/magnetic.yaml
        summary: "A force that never does work. Circular and helical motion, and the complex-number trick that solves it in one line."
      - id: ch03-traps
        title: Drag Traps
        kind: traps
        file: ch03/traps.yaml
        summary: "A fast round of tempting mistakes about drag, terminal speed and magnetic forces."
      - id: ch03-intuition
        title: "Intuition: Drag Laws and Gyration"
        kind: intuition
        file: ch03/intuition.yaml
        summary: "Quick recall of terminal speeds, time constants and the cyclotron frequency, with scaling checks."
      - id: ch03-map
        title: "Content Map: Projectiles and Charges"
        kind: map
        file: ch03/map.yaml
        summary: "Rebuild the level box by box: drag laws, their solutions and the charge in a field."
      - { id: ch03-review, title: Level Review, kind: review }
      - id: ch03-challenge
        title: Level Challenge
        kind: challenge
        file: ch03/challenge.yaml
        summary: "Harder problems that combine drag, projectiles and charged particles. A ball thrown up with drag, a projectile with drag, a charge spiralling in a field with drag, a fall where both drag terms compete, and an electron on a helix."

  - id: ch04
    number: 4
    title: "Momentum and Angular Momentum"
    blurb: "Conservation of momentum, rockets, the center of mass, angular momentum and Kepler's second law."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 3, Momentum and Angular Momentum"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Section 1.2"
    lessons:
      - id: ch04-rockets
        title: "How a Rocket Pushes on Nothing"
        kind: concept
        file: ch04/rockets.yaml
        summary: "In empty space there is nothing to push against. Conservation of momentum and the rocket equation."
      - id: ch04-center-of-mass
        title: "The Center of Mass"
        kind: concept
        file: ch04/center-of-mass.yaml
        summary: "A thrown hammer tumbles, yet one point follows a clean parabola. Why the center of mass moves like a single particle."
      - id: ch04-angular-momentum
        title: "Angular Momentum and Equal Areas"
        kind: concept
        file: ch04/angular-momentum.yaml
        summary: "Why does a planet sweep equal areas in equal times? Angular momentum, torque and central forces."
      - id: ch04-many-particles
        title: "Guided Proof: Angular Momentum of Many Particles"
        kind: guided
        file: ch04/many-particles.yaml
        summary: "Guided proof: the total angular momentum changes only by external torque, provided internal forces are central."
      - id: ch04-traps
        title: Momentum Traps
        kind: traps
        file: ch04/traps.yaml
        summary: "A fast round of tempting mistakes about momentum, rockets and torque."
      - id: ch04-intuition
        title: "Intuition: Conservation Laws"
        kind: intuition
        file: ch04/intuition.yaml
        summary: "Quick recall of the rocket equation, the center of mass and the torque law, with small numeric checks."
      - id: ch04-map
        title: "Content Map: Momentum and Angular Momentum"
        kind: map
        file: ch04/map.yaml
        summary: "Rebuild the level box by box, from momentum conservation to angular momentum of many particles."
      - { id: ch04-review, title: Level Review, kind: review }
      - id: ch04-challenge
        title: Level Challenge
        kind: challenge
        file: ch04/challenge.yaml
        summary: "Harder problems that combine rockets, the center of mass and angular momentum."

  - id: ch05
    number: 5
    title: "Energy"
    blurb: "Work and kinetic energy, conservative forces and potential energy, the curl test, and motion in one dimension read from an energy diagram."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 4, Energy"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Sections 1.1 and 1.2"
    lessons:
      - id: ch05-work
        title: "Work and Kinetic Energy"
        kind: concept
        file: ch05/work.yaml
        summary: "Push a box along two different roads: does the work depend on the road? The work-energy theorem and line integrals."
      - id: ch05-conservative
        title: "Conservative Forces and Potential Energy"
        kind: concept
        file: ch05/conservative.yaml
        summary: "When does a force come from a potential energy? Path independence, the gradient, and conservation of energy."
      - id: ch05-curl-proof
        title: "Guided Proof: Curl Zero Means Conservative"
        kind: guided
        file: ch05/curl-proof.yaml
        summary: "Guided proof: why a force with zero curl has path-independent work, and why central forces are conservative."
      - id: ch05-one-dimension
        title: "Energy Diagrams in One Dimension"
        kind: concept
        file: ch05/one-dimension.yaml
        summary: "Read a whole motion from one curve: turning points, equilibria and their stability."
      - id: ch05-time-from-energy
        title: "Guided Problem: Time from Energy"
        kind: guided
        file: ch05/time-from-energy.yaml
        summary: "Guided problem: find how long a motion takes from energy conservation alone, by one integral."
      - id: ch05-many-bodies
        title: "Energy of Many Particles"
        kind: concept
        file: ch05/many-bodies.yaml
        summary: "Two particles pulling on each other: interaction energy, internal and external forces, and the total energy."
      - id: ch05-traps
        title: Energy Traps
        kind: traps
        file: ch05/traps.yaml
        summary: "A fast round of tempting mistakes about work, potentials and conservation of energy."
      - id: ch05-intuition
        title: "Intuition: Potentials and Forces"
        kind: intuition
        file: ch05/intuition.yaml
        summary: "Quick recall of the force from a potential, the curl test and energy diagrams, with small numeric checks."
      - id: ch05-map
        title: "Content Map: Energy"
        kind: map
        file: ch05/map.yaml
        summary: "Rebuild the level box by box, from work to potential energy, one-dimensional motion and many particles."
      - { id: ch05-review, title: Level Review, kind: review }
      - id: ch05-challenge
        title: Level Challenge
        kind: challenge
        file: ch05/challenge.yaml
        summary: "Harder problems that combine work, potentials and energy diagrams."

  - id: ch06
    number: 6
    title: "Oscillations"
    blurb: "Simple harmonic motion near any minimum, damping, driving, resonance and Fourier series."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 5, Oscillations"
    lessons:
      - id: ch06-sho
        title: "Why Everything Oscillates"
        kind: concept
        file: ch06/sho.yaml
        summary: "Why does almost every system near equilibrium swing like a spring? Hooke's law, simple harmonic motion with sines and cosines, the period and the energy."
      - id: ch06-sho-forms
        title: "One Motion, Three Ways to Write It"
        kind: concept
        summary: "The phase-shifted cosine, the rotating complex number and a floating bottle: the forms of simple harmonic motion that damping and driving will need."
      - id: ch06-two-dimensions
        title: "Oscillators in Two Dimensions"
        kind: concept
        summary: "Ellipses and Lissajous figures: isotropic and anisotropic oscillators."
      - id: ch06-damped
        title: "Damped Oscillations"
        kind: concept
        summary: "A door closer must shut fast without slamming. Underdamped, critically damped and overdamped motion."
      - id: ch06-driven
        title: "Driven Oscillations and Resonance"
        kind: concept
        summary: "Push a swing at the right rhythm. Amplitude, phase and the resonance peak."
      - id: ch06-resonance-proof
        title: "Guided Proof: Width of Resonance and Q"
        kind: guided
        summary: "Guided proof: the width of the resonance peak and the quality factor, for weak damping."
      - id: ch06-fourier
        title: "Fourier Series and Any Periodic Drive"
        kind: concept
        summary: "A square-wave push is a sum of sine pushes. Fourier series, and the response of an oscillator to any periodic force."
      - id: ch06-traps
        title: Oscillation Traps
        kind: traps
        summary: "A fast round of tempting mistakes about frequency, damping and resonance."
      - id: ch06-intuition
        title: "Intuition: Oscillator Formulas"
        kind: intuition
        summary: "Quick recall of natural frequency, decay rates, amplitude and Q, with limit checks."
      - id: ch06-map
        title: "Content Map: Oscillations"
        kind: map
        summary: "Rebuild the level box by box, from simple harmonic motion to damping, driving and Fourier series."
      - { id: ch06-review, title: Level Review, kind: review }
      - id: ch06-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems that combine damping, resonance and Fourier series."

  - id: exam-partial1
    eyebrow: Partial exam
    hue: 3
    title: "Partial Exam: Newtonian Mechanics"
    blurb: A timed exam on Levels 2 to 6. No feedback until you submit, then your score and a review of every answer.
    lessons:
      - id: exam-partial1
        title: Partial Exam 1
        kind: exam
        summary: "One hour, ten points, about five questions on Newton's laws, drag, momentum, energy and oscillations. Answers are checked only when you submit."

  - id: ch07
    number: 7
    title: "Calculus of Variations"
    blurb: "Shortest paths and fastest slides: functionals, the Euler-Lagrange equation and its first integrals."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 6, Calculus of Variations"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Section 2.2"
    lessons:
      - id: ch07-shortest-path
        title: "The Shortest Path"
        kind: concept
        summary: "Calculus finds the best number; what finds the best curve? Functionals, and the straight line as the shortest path."
      - id: ch07-euler-lagrange
        title: "Guided Proof: The Euler-Lagrange Equation"
        kind: guided
        summary: "Guided proof: wiggle the curve, demand no first-order change, and derive the Euler-Lagrange equation."
      - id: ch07-brachistochrone
        title: "Guided Problem: The Brachistochrone"
        kind: guided
        summary: "Guided problem: which slide gets a bead down fastest? Not the straight one. The cycloid."
      - id: ch07-first-integrals
        title: "First Integrals and Many Variables"
        kind: concept
        summary: "When the integrand ignores one variable, one integration is done for free. Several unknown functions at once."
      - id: ch07-traps
        title: Variation Traps
        kind: traps
        summary: "A fast round of tempting mistakes about functionals, minima and the Euler-Lagrange equation."
      - id: ch07-intuition
        title: "Intuition: Euler-Lagrange"
        kind: intuition
        summary: "Quick recall of the Euler-Lagrange equation and its first integral, with checks on known curves."
      - id: ch07-map
        title: "Content Map: Calculus of Variations"
        kind: map
        summary: "Rebuild the level box by box, from functionals to the Euler-Lagrange equation and first integrals."
      - { id: ch07-review, title: Level Review, kind: review }
      - id: ch07-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder variational problems: soap films, geodesics and constrained curves."

  - id: ch08
    number: 8
    title: "Lagrange's Equations"
    blurb: "Hamilton's principle, generalized coordinates and constraints, d'Alembert's derivation, and constraint forces from Lagrange multipliers."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 7, Lagrange's Equations"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Sections 1.3 to 1.5 and 2.1 to 2.4"
    lessons:
      - id: ch08-hamilton-principle
        title: "Hamilton's Principle"
        kind: concept
        summary: "Mechanics as a variational problem: kinetic minus potential energy, and why its Euler-Lagrange equations are Newton's laws."
      - id: ch08-generalized
        title: "Generalized Coordinates and Constraints"
        kind: concept
        summary: "A bead on a wire needs one number, not three. Degrees of freedom, holonomic constraints and generalized coordinates."
      - id: ch08-dalembert
        title: "Guided Proof: From d'Alembert to Lagrange"
        kind: guided
        summary: "Guided proof: a second road to Lagrange's equations, through virtual displacements and forces of constraint that do no work."
      - id: ch08-spinning-hoop
        title: "Guided Problem: The Bead on a Spinning Hoop"
        kind: guided
        summary: "Guided problem: where does a bead settle on a hoop that spins? Equilibria that appear as the spin grows."
      - id: ch08-multipliers
        title: "Constraint Forces and Lagrange Multipliers"
        kind: concept
        summary: "Lagrange's method hides the forces of constraint. Lagrange multipliers bring them back."
      - id: ch08-velocity-potential
        title: "A Charge in a Field: Velocity-Dependent Potentials"
        kind: concept
        summary: "The magnetic force depends on velocity, yet it still fits in a Lagrangian. The generalized potential of a charge."
      - id: ch08-traps
        title: Lagrangian Traps
        kind: traps
        summary: "A fast round of tempting mistakes about generalized coordinates, constraints and the Lagrangian."
      - id: ch08-intuition
        title: "Intuition: Writing Lagrangians"
        kind: intuition
        summary: "Quick recall of how to build a Lagrangian and read off its equations, with checks against Newton."
      - id: ch08-map
        title: "Content Map: Lagrange's Equations"
        kind: map
        summary: "Rebuild the level box by box, from Hamilton's principle to constraints, d'Alembert and multipliers."
      - { id: ch08-review, title: Level Review, kind: review }
      - id: ch08-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems: double pendulum, sliding wedges and pendulums with moving supports."

  - id: ch09
    number: 9
    title: "Symmetry and Noether's Theorem"
    blurb: "Ignorable coordinates, the energy function, and why every continuous symmetry hides a conserved quantity."
    references:
      - "Nivaldo A. Lemos, *Analytical Mechanics* (Cambridge University Press, 2018), Sections 2.5 to 2.7 (symmetry properties, conservation of energy, Noether's theorem)"
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Section 7.8"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Sections 2.6 and 2.7"
    lessons:
      - id: ch09-cyclic
        title: "Ignorable Coordinates and Generalized Momenta"
        kind: concept
        summary: "If the Lagrangian does not see a coordinate, its momentum never changes. Generalized momenta and cyclic coordinates."
      - id: ch09-energy-function
        title: "When Is Energy Conserved?"
        kind: concept
        summary: "The energy function, when it is conserved, and when it is not the total energy."
      - id: ch09-equivalent-lagrangians
        title: "Same Physics, Different Lagrangians"
        kind: concept
        summary: "Two Lagrangians can give the same motion. Adding a total time derivative, and symmetries up to such a term."
      - id: ch09-noether
        title: "Noether's Theorem"
        kind: concept
        summary: "Translations give momentum, rotations give angular momentum, time shifts give energy. One theorem behind all three."
      - id: ch09-noether-proof
        title: "Guided Proof: Noether's Theorem"
        kind: guided
        summary: "Guided proof: from an infinitesimal symmetry of the action, including shifts of time, build the conserved quantity."
      - id: ch09-galilean-boost
        title: "Guided Problem: The Symmetry of a Moving Observer"
        kind: guided
        summary: "Guided problem: a Galilean boost changes the Lagrangian by a total derivative. What does Noether's theorem conserve?"
      - id: ch09-traps
        title: Symmetry Traps
        kind: traps
        summary: "A fast round of tempting mistakes about cyclic coordinates, energy and symmetries."
      - id: ch09-intuition
        title: "Intuition: Symmetry to Conservation"
        kind: intuition
        summary: "Quick recall of which symmetry gives which conserved quantity, with quick tests on Lagrangians."
      - id: ch09-map
        title: "Content Map: Symmetry and Noether"
        kind: map
        summary: "Rebuild the level box by box, from cyclic coordinates to the energy function and Noether's theorem."
      - { id: ch09-review, title: Level Review, kind: review }
      - id: ch09-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems: find every conserved quantity of a system from its symmetries."

  - id: ch10
    number: 10
    title: "Central Forces and Orbits"
    blurb: "The two-body problem, the effective potential, Kepler's laws, closed orbits, the Laplace-Runge-Lenz vector and scattering."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 8, Two-Body Central-Force Problems and Sections 14.1 to 14.6 (scattering, Rutherford)"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Sections 3.6, 3.9, 3.10 and 3.11 (Bertrand, Laplace-Runge-Lenz vector, scattering)"
      - "Nivaldo A. Lemos, *Analytical Mechanics* (Cambridge University Press, 2018), Section 1.7"
    lessons:
      - id: ch10-two-body
        title: "Two Bodies Become One"
        kind: concept
        summary: "Earth and Sun both move. The center of mass and relative coordinates turn two bodies into one, with a reduced mass."
      - id: ch10-effective-potential
        title: "The Effective Potential"
        kind: concept
        summary: "Why doesn't a comet fall straight into the Sun? The centrifugal barrier, and orbits read from a one-dimensional curve."
      - id: ch10-orbit-equation
        title: "Guided Proof: The Orbit Is a Conic"
        kind: guided
        summary: "Guided proof: the orbit equation in terms of one over the radius, and Kepler's ellipses for an inverse-square force."
      - id: ch10-kepler
        title: "Kepler's Laws"
        kind: concept
        summary: "Ellipses, equal areas and the period law, with energy and eccentricity."
      - id: ch10-orbit-changes
        title: "Guided Problem: Changing Orbits"
        kind: guided
        summary: "Guided problem: two engine burns move a satellite to a higher orbit. How big is each burn?"
      - id: ch10-closed-orbits
        title: "Closed Orbits and Precession"
        kind: concept
        summary: "Most force laws give rosettes, not ellipses. Bertrand's theorem, and orbits that precess."
      - id: ch10-lrl
        title: "The Hidden Symmetry: Laplace-Runge-Lenz Vector"
        kind: concept
        summary: "Why does the Kepler ellipse not turn? A conserved vector that points to the nearest approach."
      - id: ch10-scattering
        title: "Scattering and Cross Sections"
        kind: concept
        summary: "How Rutherford saw the nucleus: impact parameter, scattering angle and the cross section."
      - id: ch10-traps
        title: Orbit Traps
        kind: traps
        summary: "A fast round of tempting mistakes about orbits, reduced mass and Kepler's laws."
      - id: ch10-intuition
        title: "Intuition: Orbit Formulas"
        kind: intuition
        summary: "Quick recall of the effective potential, the orbit equation and Kepler's third law, with scaling checks."
      - id: ch10-map
        title: "Content Map: Central Forces"
        kind: map
        summary: "Rebuild the level box by box, from two bodies to orbits, closed orbits and scattering."
      - { id: ch10-review, title: Level Review, kind: review }
      - id: ch10-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems that combine orbits, energy and scattering."

  - id: ch11
    number: 11
    title: "Noninertial Frames"
    blurb: "Accelerating frames, the tides, rotating frames, centrifugal and Coriolis forces, and Foucault's pendulum."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 9, Mechanics in Noninertial Frames"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Sections 4.9 and 4.10"
      - "Nivaldo A. Lemos, *Analytical Mechanics* (Cambridge University Press, 2018), Section 3.6"
    lessons:
      - id: ch11-accelerating
        title: "Accelerating Frames"
        kind: concept
        summary: "A pendulum in an accelerating car hangs at an angle. Inertial forces, and when they are real enough to use."
      - id: ch11-tides
        title: "The Tides"
        kind: concept
        summary: "Why are there two high tides a day, not one? The tidal force as a difference of pulls."
      - id: ch11-rotation
        title: "Angular Velocity and Rotating Frames"
        kind: concept
        summary: "How fast does a vector change when seen from a turning frame? Angular velocity and the rule linking the two rates."
      - id: ch11-coriolis
        title: "Centrifugal and Coriolis Forces"
        kind: concept
        summary: "Why do hurricanes spin opposite ways in the two hemispheres? Newton's law in a rotating frame."
      - id: ch11-foucault
        title: "Guided Problem: Foucault's Pendulum"
        kind: guided
        summary: "Guided problem: a pendulum that proves the Earth turns, and the rate at which its plane rotates at each latitude."
      - id: ch11-traps
        title: Frame Traps
        kind: traps
        summary: "A fast round of tempting mistakes about inertial forces, tides and the Coriolis force."
      - id: ch11-intuition
        title: "Intuition: Inertial Forces"
        kind: intuition
        summary: "Quick recall of the centrifugal, Coriolis and tidal forces, with direction and size checks."
      - id: ch11-map
        title: "Content Map: Noninertial Frames"
        kind: map
        summary: "Rebuild the level box by box, from accelerating frames to tides, rotating frames and Foucault."
      - { id: ch11-review, title: Level Review, kind: review }
      - id: ch11-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems in accelerating and rotating frames."

  - id: ch12
    number: 12
    title: "Rigid Bodies"
    blurb: "The inertia tensor, principal axes, Euler's equations, Euler angles, the tennis racket theorem and the heavy top."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 10, Rotational Motion of Rigid Bodies (including Euler angles and the heavy top)"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Section 4.4 and Sections 5.1 to 5.7"
    lessons:
      - id: ch12-inertia-tensor
        title: "The Inertia Tensor"
        kind: concept
        summary: "Why does a lopsided wheel wobble? Angular momentum need not point along the spin. The inertia tensor."
      - id: ch12-principal-axes
        title: "Principal Axes"
        kind: concept
        summary: "Every body has three axes it can spin about without wobbling. An eigenvalue problem."
      - id: ch12-euler-equations
        title: "Guided Proof: Euler's Equations"
        kind: guided
        summary: "Guided proof: the torque law in the body's own turning frame, written along the principal axes."
      - id: ch12-free-rotation
        title: "Free Rotation and the Tennis Racket"
        kind: concept
        summary: "Toss a phone and it flips about its middle axis. Stability of free rotation, and the precession of a free symmetric top."
      - id: ch12-euler-angles
        title: "Euler Angles"
        kind: concept
        summary: "Three angles that fix any orientation, and the angular velocity written with them."
      - id: ch12-heavy-top
        title: "Guided Problem: The Heavy Symmetric Top"
        kind: guided
        summary: "Guided problem: why a spinning top does not fall. Its Lagrangian, precession and nutation."
      - id: ch12-traps
        title: Rigid Body Traps
        kind: traps
        summary: "A fast round of tempting mistakes about inertia, principal axes and spinning bodies."
      - id: ch12-intuition
        title: "Intuition: Moments and Spins"
        kind: intuition
        summary: "Quick recall of moments of inertia, Euler's equations and precession rates, with checks on simple shapes."
      - id: ch12-map
        title: "Content Map: Rigid Bodies"
        kind: map
        summary: "Rebuild the level box by box, from the inertia tensor to Euler's equations, Euler angles and the top."
      - { id: ch12-review, title: Level Review, kind: review }
      - id: ch12-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems on spinning, tumbling and precessing bodies."

  - id: exam-partial2
    eyebrow: Partial exam
    hue: 3
    title: "Partial Exam: Lagrangian Mechanics"
    blurb: A timed exam on Levels 7 to 12. No feedback until you submit, then your score and a review of every answer.
    lessons:
      - id: exam-partial2
        title: Partial Exam 2
        kind: exam
        summary: "One hour, ten points, about five questions on variations, Lagrangians, symmetries, orbits, rotating frames and rigid bodies. Answers are checked only when you submit."

  - id: ch13
    number: 13
    title: "Coupled Oscillations and Normal Modes"
    blurb: "Two carts and a spring, mass and stiffness matrices, small oscillations of any system, and from beads to waves."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 11, Coupled Oscillators and Normal Modes"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Sections 6.1 to 6.4"
    lessons:
      - id: ch13-two-carts
        title: "Two Coupled Carts"
        kind: concept
        summary: "Two pendulums joined by a spring trade their swing back and forth. Normal modes and beats."
      - id: ch13-matrices
        title: "Mass and Stiffness Matrices"
        kind: concept
        summary: "The general method: write the equations as matrices, and find the normal frequencies from one determinant."
      - id: ch13-small-oscillations
        title: "Guided Proof: Small Oscillations of Any System"
        kind: guided
        summary: "Guided proof: expand any Lagrangian near a stable equilibrium, and show the motion is a sum of independent modes."
      - id: ch13-triatomic
        title: "Guided Problem: A Linear Triatomic Molecule"
        kind: guided
        summary: "Guided problem: three atoms on a line, their normal modes, and the mode with zero frequency."
      - id: ch13-chain
        title: "From Beads to Waves"
        kind: concept
        summary: "A chain of many masses and springs: its modes, its dispersion, and the wave that appears in the limit."
      - id: ch13-traps
        title: Normal Mode Traps
        kind: traps
        summary: "A fast round of tempting mistakes about modes, frequencies and coupling."
      - id: ch13-intuition
        title: "Intuition: Finding Modes"
        kind: intuition
        summary: "Quick recall of the eigenvalue equation and mode shapes, with symmetry checks."
      - id: ch13-map
        title: "Content Map: Normal Modes"
        kind: map
        summary: "Rebuild the level box by box, from two carts to matrices, small oscillations and waves."
      - { id: ch13-review, title: Level Review, kind: review }
      - id: ch13-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems on coupled pendulums, molecules and chains."

  - id: ch14
    number: 14
    title: "Hamiltonian Mechanics"
    blurb: "The Legendre transform, Hamilton's equations, phase space, the modified variational principle, cyclic coordinates and Liouville's theorem."
    references:
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Sections 8.1 to 8.6"
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Chapter 13, Hamiltonian Mechanics"
    lessons:
      - id: ch14-legendre
        title: "The Legendre Transform"
        kind: concept
        summary: "Trade a velocity for a momentum without losing information. The Legendre transform, from a picture."
      - id: ch14-hamilton-equations
        title: "Hamilton's Equations"
        kind: concept
        summary: "One second-order equation becomes two first-order ones. The Hamiltonian, and when it is the energy."
      - id: ch14-phase-space
        title: "Phase Space Portraits"
        kind: concept
        summary: "Every state is a point and every motion a curve that never crosses another. The pendulum's portrait, and its separatrix."
      - id: ch14-variational-proof
        title: "Guided Proof: Hamilton's Equations from a Variational Principle"
        kind: guided
        summary: "Guided proof: vary positions and momenta independently in the action and obtain Hamilton's equations."
      - id: ch14-routhian
        title: "Cyclic Coordinates and the Routhian"
        kind: concept
        summary: "A cyclic coordinate drops out of the Hamiltonian at once. The Routhian, half Lagrangian and half Hamiltonian."
      - id: ch14-liouville
        title: "Liouville's Theorem"
        kind: concept
        summary: "A cloud of states moves like an incompressible fluid. Why phase-space volume is conserved."
      - id: ch14-traps
        title: Hamiltonian Traps
        kind: traps
        summary: "A fast round of tempting mistakes about the Hamiltonian, energy and phase space."
      - id: ch14-intuition
        title: "Intuition: From L to H"
        kind: intuition
        summary: "Quick recall of the Legendre transform and Hamilton's equations, with checks on known systems."
      - id: ch14-map
        title: "Content Map: Hamiltonian Mechanics"
        kind: map
        summary: "Rebuild the level box by box, from the Legendre transform to phase space and Liouville."
      - { id: ch14-review, title: Level Review, kind: review }
      - id: ch14-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems: Hamiltonians of charges, rotating frames and pendulums, and their portraits."

  - id: ch15
    number: 15
    title: "Canonical Transformations and Poisson Brackets"
    blurb: "Changes of variables that keep Hamilton's form, generating functions, the symplectic condition, Poisson brackets and symmetry generators."
    references:
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Sections 9.1 to 9.9"
      - "Nivaldo A. Lemos, *Analytical Mechanics* (Cambridge University Press, 2018), Sections 8.1 to 8.8"
    lessons:
      - id: ch15-canonical
        title: "Which Changes of Variables Keep Hamilton's Form?"
        kind: concept
        summary: "Mix positions and momenta freely, and Hamilton's equations usually break. Canonical transformations are the ones that keep them."
      - id: ch15-generating
        title: "Generating Functions"
        kind: concept
        summary: "One function builds a whole canonical transformation. The four kinds of generating function."
      - id: ch15-oscillator
        title: "Guided Problem: The Oscillator Made Trivial"
        kind: guided
        summary: "Guided problem: a canonical transformation that turns the harmonic oscillator into free motion on a circle."
      - id: ch15-symplectic
        title: "Guided Proof: The Symplectic Condition"
        kind: guided
        summary: "Guided proof: a transformation is canonical when its Jacobian matrix preserves one antisymmetric matrix."
      - id: ch15-poisson
        title: "Poisson Brackets"
        kind: concept
        summary: "One bracket that encodes all of Hamilton's equations. Its rules, and why it is the same in every canonical chart."
      - id: ch15-motion
        title: "Equations of Motion as Brackets"
        kind: concept
        summary: "How any quantity changes in time, constants of motion, and building new conserved quantities from old ones."
      - id: ch15-generators
        title: "Symmetry Generators"
        kind: concept
        summary: "Infinitesimal canonical transformations: momentum moves you, angular momentum turns you, the Hamiltonian evolves you. Noether, revisited."
      - id: ch15-traps
        title: Canonical Traps
        kind: traps
        summary: "A fast round of tempting mistakes about canonical transformations and brackets."
      - id: ch15-intuition
        title: "Intuition: Brackets and Generators"
        kind: intuition
        summary: "Quick recall of the fundamental brackets, generating functions and the symplectic test, with small checks."
      - id: ch15-map
        title: "Content Map: Canonical Transformations"
        kind: map
        summary: "Rebuild the level box by box, from canonical transformations to brackets and generators."
      - { id: ch15-review, title: Level Review, kind: review }
      - id: ch15-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems: test transformations, compute brackets of angular momentum, find generators."

  - id: ch16
    number: 16
    title: "Hamilton-Jacobi Theory and Action-Angle Variables"
    blurb: "The canonical transformation that freezes the motion, separation of variables, action-angle variables, and the waves behind the particles."
    references:
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Sections 10.1 to 10.8"
      - "Nivaldo A. Lemos, *Analytical Mechanics* (Cambridge University Press, 2018), Sections 9.1 to 9.6, 9.11 and 9.13"
    lessons:
      - id: ch16-hj-equation
        title: "The Hamilton-Jacobi Equation"
        kind: concept
        summary: "Find the transformation that makes every new variable constant, and the whole motion is solved. One partial differential equation."
      - id: ch16-oscillator
        title: "Guided Problem: The Oscillator by Hamilton-Jacobi"
        kind: guided
        summary: "Guided problem: solve the harmonic oscillator by the Hamilton-Jacobi equation, and see what the function of action means."
      - id: ch16-separation
        title: "Separation of Variables"
        kind: concept
        summary: "When the Hamilton-Jacobi equation splits into one equation per coordinate, and what each separation constant is."
      - id: ch16-action-angle
        title: "Action-Angle Variables"
        kind: concept
        summary: "Find the frequency of a periodic motion without solving it. Actions as areas in phase space, and angles that grow uniformly."
      - id: ch16-kepler
        title: "Guided Problem: Kepler in Action-Angle Variables"
        kind: guided
        summary: "Guided problem: the Kepler problem in action-angle variables, and why all its frequencies are equal."
      - id: ch16-optics
        title: "Waves Behind the Particles"
        kind: concept
        summary: "Surfaces of equal action move like wavefronts. Hamilton-Jacobi theory, geometrical optics, and the road to quantum mechanics."
      - id: ch16-traps
        title: Hamilton-Jacobi Traps
        kind: traps
        summary: "A fast round of tempting mistakes about the Hamilton-Jacobi equation and action variables."
      - id: ch16-intuition
        title: "Intuition: Actions and Frequencies"
        kind: intuition
        summary: "Quick recall of the Hamilton-Jacobi equation and of frequencies from actions, with checks on the oscillator."
      - id: ch16-map
        title: "Content Map: Hamilton-Jacobi Theory"
        kind: map
        summary: "Rebuild the level box by box, from the Hamilton-Jacobi equation to separation, action-angle variables and optics."
      - { id: ch16-review, title: Level Review, kind: review }
      - id: ch16-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems: separate, find actions and frequencies, and spot degeneracies."

  - id: ch17
    number: 17
    title: "Chaos and Integrability"
    blurb: "Nonlinear motion, period doubling, sensitive dependence, Poincaré sections, integrable systems on tori, and how KAM tori survive a push."
    references:
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Sections 12.4 to 12.9 (Nonlinear Mechanics and Chaos)"
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Sections 11.1 to 11.8"
      - "Nivaldo A. Lemos, *Analytical Mechanics* (Cambridge University Press, 2018), Sections 9.7 to 9.10 (integrable systems, tori)"
    lessons:
      - id: ch17-nonlinearity
        title: "When Superposition Fails"
        kind: concept
        summary: "Double the push and the motion no longer doubles. The driven damped pendulum and nonlinear behaviour."
      - id: ch17-period-doubling
        title: "The Road to Chaos"
        kind: concept
        summary: "Turn up the drive and the period doubles, again and again, then order breaks down. Bifurcation diagrams."
      - id: ch17-logistic
        title: "Guided Problem: Fixed Points of the Logistic Map"
        kind: guided
        summary: "Guided problem: fixed points of a simple map, when they are stable, and where the first doubling happens."
      - id: ch17-sensitivity
        title: "Sensitive Dependence and Lyapunov Exponents"
        kind: concept
        summary: "Two starts a hair apart drift apart exponentially. How fast, and why it kills long-term prediction."
      - id: ch17-poincare
        title: "Poincaré Sections"
        kind: concept
        summary: "Slice the motion once per cycle and look at the dots: a curve for order, a cloud for chaos."
      - id: ch17-integrable
        title: "Integrable Systems and Tori"
        kind: concept
        summary: "With as many conserved quantities as degrees of freedom, every motion winds on a doughnut. Integrability and invariant tori."
      - id: ch17-kam
        title: "KAM: How Order Survives"
        kind: concept
        summary: "Push an integrable system a little: most tori survive, some break into chaos. The KAM picture and the Hénon-Heiles system."
      - id: ch17-traps
        title: Chaos Traps
        kind: traps
        summary: "A fast round of tempting mistakes about chaos, randomness and integrability."
      - id: ch17-intuition
        title: "Intuition: Reading Chaos"
        kind: intuition
        summary: "Quick recall of stability of fixed points, Lyapunov growth and Poincaré sections, with small numeric checks."
      - id: ch17-map
        title: "Content Map: Chaos and Integrability"
        kind: map
        summary: "Rebuild the level box by box, from nonlinearity to period doubling, sensitivity, sections, tori and KAM."
      - { id: ch17-review, title: Level Review, kind: review }
      - id: ch17-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems: classify fixed points, estimate Lyapunov exponents and read Poincaré sections."

  - id: ch18
    number: 18
    title: "From Particles to Fields"
    blurb: "From a chain of beads to a string, the Lagrangian density, field equations, the field Hamiltonian, Noether's theorem for fields and the first relativistic field."
    references:
      - "Herbert Goldstein, Charles Poole and John Safko, *Classical Mechanics*, 3rd edition (Addison-Wesley, 2002), Sections 13.1 to 13.7"
      - "Nivaldo A. Lemos, *Analytical Mechanics* (Cambridge University Press, 2018), Sections 11.1 to 11.5 (Classical Field Theory)"
      - "John R. Taylor, *Classical Mechanics* (University Science Books, 2005), Sections 16.1 and 16.2"
    lessons:
      - id: ch18-beads-to-string
        title: "From Beads to a String"
        kind: concept
        summary: "Pack more and more beads onto a springy chain. In the limit the coordinates become a field and the Lagrangian a density."
      - id: ch18-field-lagrangian
        title: "The Lagrangian Density"
        kind: concept
        summary: "One action for a whole field: integrate a density over space and time, vary it, and get the field's Euler-Lagrange equation."
      - id: ch18-wave-equation
        title: "Guided Problem: The Wave Equation of a String"
        kind: guided
        summary: "Guided problem: from the string's Lagrangian density to the wave equation, its wave speed, and a travelling pulse."
      - id: ch18-field-hamiltonian
        title: "Momentum Density and the Field Hamiltonian"
        kind: concept
        summary: "Each point of a field has its own momentum. The Hamiltonian density, and the energy a wave carries."
      - id: ch18-noether-fields
        title: "Guided Proof: Noether's Theorem for Fields"
        kind: guided
        summary: "Guided proof: a symmetry of the Lagrangian density gives a local conservation law, a density and a current. Energy and momentum flow."
      - id: ch18-relativistic
        title: "A Relativistic Field"
        kind: concept
        summary: "Ask the action to look the same to every inertial observer and the Klein-Gordon equation follows. The door to quantum field theory."
      - id: ch18-traps
        title: Field Traps
        kind: traps
        summary: "A fast round of tempting mistakes about fields, densities and local conservation laws."
      - id: ch18-intuition
        title: "Intuition: Densities and Waves"
        kind: intuition
        summary: "Quick recall of Lagrangian densities, field equations and wave speeds, with unit and limit checks."
      - id: ch18-map
        title: "Content Map: From Particles to Fields"
        kind: map
        summary: "Rebuild the level box by box, from beads to the Lagrangian density, field equations, field Hamiltonian and Noether currents."
      - { id: ch18-review, title: Level Review, kind: review }
      - id: ch18-challenge
        title: Level Challenge
        kind: challenge
        summary: "Harder problems: build a Lagrangian density, derive its field equation and find its conserved currents."

  - id: exam-final
    eyebrow: Final exam
    hue: 3
    title: "Final Exam: Hamiltonian Mechanics and Beyond"
    blurb: A timed exam on Levels 13 to 18. No feedback until you submit, then your score and a review of every answer.
    lessons:
      - id: exam-final
        title: Final Exam
        kind: exam
        summary: "Two hours, ten points, about five questions on normal modes, Hamiltonians, canonical transformations, Hamilton-Jacobi theory, chaos and fields. Answers are checked only when you submit."
