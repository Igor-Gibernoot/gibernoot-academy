id: ch03-map
title: "Content Map: Projectiles and Charges"
kind: map
name: Level 3, Projectiles and Charged Particles (drag laws, linear and quadratic drag, a charge in a magnetic field)

intro: |
  This map shows how the ideas of the level fit together. Each box is one idea. Try to rebuild each one from memory before you read the options.

  The level started with **the drag force**, $f = bv + cv^2$, and with which of its two terms matters for a given body. The **linear** term gives equations that can be solved in closed form: a fall that levels off, a coasting body that stops at a finite distance, and a projectile whose range falls short of the vacuum range. The **quadratic** term gives a fall with a hyperbolic tangent and a coasting body that never stops. Last, a **charge in a magnetic field** feels a force that depends on the velocity too, but it only turns the motion.

  For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake, and every wrong pick comes with a reason. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: drag
    title: Drag force and which term wins
    row: 1
    col: 2
    body: |
      Drag opposes the velocity and depends on the speed $v$, with constants $b$ and $c$:
      $$\mathbf f = -f(v)\,\hat{\mathbf v}, \qquad f = bv + cv^2.$$
      The quadratic term wins when the ratio is large:
      $$\frac{f_{\text{quad}}}{f_{\text{lin}}} = \frac{cv}{b}.$$
      A baseball at 5 m/s has a ratio of about 600, so the linear term can be dropped.
    decoys:
      - body: |
          Drag opposes the velocity and depends on the speed $v$, with constants $b$ and $c$:
          $$\mathbf f = -f(v)\,\hat{\mathbf v}, \qquad f = bv + cv^2.$$
          The linear term wins when the ratio is large:
          $$\frac{f_{\text{lin}}}{f_{\text{quad}}} = \frac{cv}{b}.$$
          A baseball at 5 m/s has a ratio of about 600, so the quadratic term can be dropped.
        feedback: |
          The ratio $cv/b$ compares $cv^2$ with $bv$, and it grows with the speed. A fast, large body is dominated by $cv^2$. Only a slow, small body, such as an oil droplet, is dominated by $bv$.
      - body: |
          Drag **helps** the velocity along and depends on the speed $v$, with constants $b$ and $c$:
          $$\mathbf f = +f(v)\,\hat{\mathbf v}, \qquad f = bv + cv^2.$$
          The quadratic term wins when the ratio is large:
          $$\frac{f_{\text{quad}}}{f_{\text{lin}}} = \frac{cv}{b}.$$
          A baseball at 5 m/s has a ratio of about 600, so the linear term can be dropped.
        feedback: |
          Drag is a resistance: it points against the velocity, $-\hat{\mathbf v}$, and drains the speed. A force along the velocity would make every body speed up for free.
    explanation: |
      Everything below starts from this split: the body and the speed decide which term is kept.

  - id: sphere
    title: Drag on a sphere
    row: 2
    col: 2
    body: |
      For a sphere of diameter $D$ the constants scale as
      $$b = \beta D, \qquad c = \gamma D^2,$$
      with $\beta = 1.6\times10^{-4}$ N s/m$^2$ and $\gamma = 0.25$ N s$^2$/m$^4$ in air. Then
      $$\frac{f_{\text{quad}}}{f_{\text{lin}}} = \left(1.6\times10^{3}\ \mathrm{s/m^2}\right) D v,$$
      and doubling $D$ multiplies $b$ by 2 and $c$ by 4.
    decoys:
      - body: |
          For a sphere of diameter $D$ the constants scale as
          $$b = \beta D^2, \qquad c = \gamma D,$$
          with $\beta = 1.6\times10^{-4}$ N s/m$^2$ and $\gamma = 0.25$ N s$^2$/m$^4$ in air. Then
          $$\frac{f_{\text{quad}}}{f_{\text{lin}}} = \left(1.6\times10^{3}\ \mathrm{s/m^2}\right) D v,$$
          and doubling $D$ multiplies $b$ by 4 and $c$ by 2.
        feedback: |
          The quadratic drag comes from pushing aside the air in front of the body, so it grows with the cross-section, $\propto D^2$. The linear (viscous) drag grows only with the size, $\propto D$.
      - body: |
          For a sphere of diameter $D$ the constants scale as
          $$b = \beta D, \qquad c = \gamma D,$$
          with $\beta = 1.6\times10^{-4}$ N s/m$^2$ and $\gamma = 0.25$ N s$^2$/m$^4$ in air. Then
          $$\frac{f_{\text{quad}}}{f_{\text{lin}}} = \left(1.6\times10^{3}\ \mathrm{s/m^2}\right) Dv,$$
          and doubling $D$ multiplies both $b$ and $c$ by 2.
        feedback: |
          $c = \gamma D$ would not have the units of $c$ (kg/m) with the given $\gamma$ (N s$^2$/m$^4$). With $c = \gamma D^2$ the ratio is $\gamma D^2 v/(\beta D) = (\gamma/\beta)Dv$, which is the $1.6\times10^3\,Dv$ quoted, and doubling $D$ gives a factor 4 in $c$.
    explanation: |
      Bigger spheres get more quadratic: that is why a raindrop and a baseball sit in different regimes.

  - id: terminal
    title: Terminal speed
    row: 3
    col: 2
    body: |
      Falling, the weight $mg$ is balanced by the drag when the acceleration is zero. The balance gives
      $$v_{\text{ter}} = \frac{mg}{b} \ \ (\text{linear}),$$
      $$v_{\text{ter}} = \sqrt{\frac{mg}{c}} \ \ (\text{quadratic}).$$
      It does not depend on how the fall starts. For $m = 1$ kg: $v_{\text{ter}} = 98$ m/s with $b = 0.1$ kg/s, and $9.9$ m/s with $c = 0.1$ kg/m.
    decoys:
      - body: |
          Falling, the weight $mg$ is balanced by the drag when the acceleration is zero. The balance gives
          $$v_{\text{ter}} = \frac{mg}{b} \ \ (\text{linear}),$$
          $$v_{\text{ter}} = \frac{mg}{c} \ \ (\text{quadratic}).$$
          It does not depend on how the fall starts. For $m = 1$ kg: $v_{\text{ter}} = 98$ m/s with $b = 0.1$ kg/s, and $98$ m/s with $c = 0.1$ kg/m.
        feedback: |
          With quadratic drag the balance is $mg = cv^2$, so $v = \sqrt{mg/c}$. Dividing $mg$ by $c$ gives a number with units of m$^2$/s$^2$, not m/s. A body four times heavier is only twice as fast.
      - body: |
          Falling, the weight $mg$ is balanced by the drag when the acceleration is zero. The balance gives
          $$v_{\text{ter}} = \frac{mg}{b} \ \ (\text{linear}),$$
          $$v_{\text{ter}} = \sqrt{\frac{mg}{c}} \ \ (\text{quadratic}).$$
          It **depends on the release speed**: a body thrown down faster than $v_{\text{ter}}$ keeps the higher speed. For $m = 1$ kg: $v_{\text{ter}} = 98$ m/s with $b = 0.1$ kg/s, and $9.9$ m/s with $c = 0.1$ kg/m.
        feedback: |
          Above $v_{\text{ter}}$ the drag is larger than the weight, so the body slows down toward it. Below it, the body speeds up toward it. Either way the final speed is the same.
    explanation: |
      $v_{\text{ter}}$ is the scale that appears in every solution below, as the speed the fall levels off at.

  - id: lindrag
    title: Falling with linear drag
    row: 1
    col: 1
    body: |
      From $m\dot v = mg - bv$, with $\tau = m/b$ and a start from rest,
      $$v(t) = v_{\text{ter}}\left(1 - e^{-t/\tau}\right), \qquad \tau = \frac{m}{b}.$$
      For $m = 1$ kg and $b = 0.1$ kg/s, $\tau = 10$ s and after one $\tau$ the speed is $62$ m/s, about 63% of $v_{\text{ter}}$.
    decoys:
      - body: |
          From $m\dot v = mg - bv$, with $\tau = b/m$ and a start from rest,
          $$v(t) = v_{\text{ter}}\left(1 - e^{-t/\tau}\right), \qquad \tau = \frac{b}{m}.$$
          For $m = 1$ kg and $b = 0.1$ kg/s, $\tau = 0.1$ s and after one $\tau$ the speed is $9.8$ m/s, about 10% of $v_{\text{ter}}$.
        feedback: |
          $b/m$ is a rate (1/s), not a time. A heavier body is slower to react to the drag, so the time scale must grow with $m$: $\tau = m/b$. The terminal speed is also reached after many $\tau$, not 10 percent of it.
      - body: |
          From $m\dot v = mg - bv$, with $\tau = m/b$ and a start from rest,
          $$v(t) = v_{\text{ter}}\left(1 - e^{-t/\tau}\right), \qquad \tau = \frac{m}{b}.$$
          For $m = 1$ kg and $b = 0.1$ kg/s, $\tau = 10$ s and after one $\tau$ the speed is $98$ m/s, the terminal speed.
        feedback: |
          The exponential never reaches $v_{\text{ter}}$ in a finite time. After one $\tau$ the gap to $v_{\text{ter}}$ has shrunk only by a factor $e$: $1 - e^{-1} = 0.63$, so the speed is $62$ m/s.
    explanation: |
      The gap $v - v_{\text{ter}}$ decays exponentially, from above or below, and $\tau$ sets the pace.

  - id: coastlin
    title: Coasting with linear drag
    row: 2
    col: 1
    body: |
      With only the drag, $m\dot v_x = -bv_x$, so
      $$v_x = v_{x0}\,e^{-t/\tau},$$
      $$x_\infty = v_{x0}\,\tau.$$
      The body stops in a finite distance. With $v_{x0} = 20$ m/s and $\tau = 10$ s, $x_\infty = 200$ m.
    decoys:
      - body: |
          With only the drag, $m\dot v_x = -bv_x$, so
          $$v_x = v_{x0}\,e^{-t/\tau},$$
          $$x = v_{x0}\,\tau\ln\!\left(1 + \frac{t}{\tau}\right).$$
          The body never stops: $x$ grows without limit, slowly.
        feedback: |
          That is the position for quadratic drag. Linear drag gives an exponential speed, and the area under an exponential is finite: $\int_0^\infty v_{x0}e^{-t/\tau}dt = v_{x0}\tau$.
      - body: |
          With only the drag, $m\dot v_x = -bv_x$, so
          $$v_x = v_{x0}\,e^{-t/\tau},$$
          $$x_\infty = \frac{v_{x0}}{\tau}.$$
          The body stops in a finite distance. With $v_{x0} = 20$ m/s and $\tau = 10$ s, $x_\infty = 2$ m.
        feedback: |
          $v_{x0}/\tau$ has units of m/s$^2$, not metres. The distance is a speed times a time: $x_\infty = v_{x0}\tau = 200$ m, as if the body kept its initial speed for one time constant.
    explanation: |
      The finite $x_\infty$ is the horizontal asymptote of the next box: the projectile cannot pass it.

  - id: projectile
    title: Projectile with linear drag
    row: 3
    col: 1
    body: |
      With $y$ up, the path has a vertical asymptote at $x = v_{x0}\tau$ that the range never reaches. With $R_{\text{vac}} = 2v_{x0}v_{y0}/g$ the vacuum range,
      $$R \approx R_{\text{vac}}\left(1 - \frac{4}{3}\,\frac{v_{y0}}{v_{\text{ter}}}\right).$$
      It holds for $v_{y0} \ll v_{\text{ter}}$. At 20 m/s and 45$^\circ$ with $b = 0.1$ kg/s: 33.0 m against 40.8 m in a vacuum.
    decoys:
      - body: |
          With $y$ up, the path has a vertical asymptote at $x = v_{x0}\tau$ that the range never reaches. With $R_{\text{vac}} = 2v_{x0}v_{y0}/g$ the vacuum range,
          $$R \approx R_{\text{vac}}\left(1 + \frac{4}{3}\,\frac{v_{y0}}{v_{\text{ter}}}\right).$$
          It holds for $v_{y0} \ll v_{\text{ter}}$. At 20 m/s and 45$^\circ$ with $b = 0.1$ kg/s: 48.6 m against 40.8 m in a vacuum.
        feedback: |
          Drag only takes speed away, so the throw can only land closer than in a vacuum. The correction is negative, and it is smaller for a larger $v_{\text{ter}}$, as it should be when the drag is weak.
      - body: |
          With $y$ up, the path has a vertical asymptote at $x = v_{x0}\tau$ that the range always **reaches** at the landing. With $R_{\text{vac}} = 2v_{x0}v_{y0}/g$ the vacuum range,
          $$R \approx R_{\text{vac}}\left(1 - \frac{4}{3}\,\frac{v_{y0}}{v_{\text{ter}}}\right).$$
          It holds for any speed. At 20 m/s and 45$^\circ$ with $b = 0.1$ kg/s: 33.0 m against 40.8 m in a vacuum.
        feedback: |
          The asymptote $x = v_{x0}\tau$ is the distance the body would cover with no gravity, and falling makes it land well before it. The expansion also needs $v_{y0}/v_{\text{ter}}$ small, because it keeps only the first correction.
    explanation: |
      The range is the one result of the level that needs an approximation: its exact equation has no closed-form solution.

  - id: quad
    title: Falling with quadratic drag
    row: 1
    col: 3
    body: |
      From $m\dot v = mg - cv^2$, which is nonlinear, separating variables gives
      $$v(t) = v_{\text{ter}}\tanh\!\left(\frac{gt}{v_{\text{ter}}}\right).$$
      It starts as $v \approx gt$ and tends to $v_{\text{ter}} = \sqrt{mg/c}$. For $m = 1$ kg and $c = 0.1$ kg/m, at $t = 1$ s: $7.5$ m/s.
    decoys:
      - body: |
          From $m\dot v = mg - cv^2$, which is nonlinear, separating variables gives
          $$v(t) = v_{\text{ter}}\left(1 - e^{-gt/v_{\text{ter}}}\right).$$
          It starts as $v \approx gt$ and tends to $v_{\text{ter}} = \sqrt{mg/c}$. For $m = 1$ kg and $c = 0.1$ kg/m, at $t = 1$ s: $6.2$ m/s.
        feedback: |
          This is the shape for linear drag. With quadratic drag the speed approaches $v_{\text{ter}}$ differently: the drag is smaller at low speed, so the body speeds up more at first, and the curve is the hyperbolic tangent, $7.5$ m/s at 1 s.
      - body: |
          From $m\dot v = mg - cv^2$, which is nonlinear, separating variables gives
          $$v(t) = v_{\text{ter}}\tanh\!\left(\frac{v_{\text{ter}}\,t}{g}\right).$$
          It starts as $v \approx gt$ and tends to $v_{\text{ter}} = \sqrt{mg/c}$. For $m = 1$ kg and $c = 0.1$ kg/m, at $t = 1$ s: $v_{\text{ter}}$ almost.
        feedback: |
          The argument of $\tanh$ has to be a pure number. $gt/v_{\text{ter}}$ is (m/s$^2$ times s over m/s), but $v_{\text{ter}}t/g$ is in seconds squared. It would also give $v \approx v_{\text{ter}}^2t/g$ at small $t$, not $gt$.
    explanation: |
      The combination $v_{\text{ter}}/g$ is the time scale of the fall, the quadratic analogue of $\tau$.

  - id: coastquad
    title: Coasting with quadratic drag
    row: 2
    col: 3
    body: |
      With only the drag, $m\dot v = -cv^2$, so
      $$v = \frac{v_0}{1 + t/\tau},$$
      $$\tau = \frac{m}{c\,v_0},$$
      $$x = v_0\tau\ln\!\left(1 + \frac{t}{\tau}\right).$$
      The body never stops. With $m = 1$ kg, $c = 0.1$ kg/m and $v_0 = 10$ m/s, $\tau = 1$ s and at 2 s the speed is $3.3$ m/s.
    decoys:
      - body: |
          With only the drag, $m\dot v = -cv^2$, so
          $$v = v_0\,e^{-t/\tau},$$
          $$\tau = \frac{m}{c\,v_0},$$
          $$x_\infty = v_0\tau.$$
          The body stops in a finite distance. With $m = 1$ kg, $c = 0.1$ kg/m and $v_0 = 10$ m/s, $\tau = 1$ s and $x_\infty = 10$ m.
        feedback: |
          That is the linear-drag shape. As the body slows, the quadratic drag fades faster than the speed does, so the last part of the slowing down takes forever: $v \propto 1/t$, and $x$ grows like $\ln t$ without limit.
      - body: |
          With only the drag, $m\dot v = -cv^2$, so
          $$v = \frac{v_0}{1 + t/\tau},$$
          $$\tau = \frac{m}{c},$$
          $$x = v_0\tau\ln\!\left(1 + \frac{t}{\tau}\right).$$
          The body never stops. With $m = 1$ kg, $c = 0.1$ kg/m and $v_0 = 10$ m/s, $\tau = 10$ s and at 2 s the speed is $8.3$ m/s.
        feedback: |
          $m/c$ is a length (kg over kg/m), not a time. The time constant needs the starting speed, $\tau = m/(cv_0)$, so it is different for every launch. Here $\tau = 1$ s and the speed at 2 s is $10/3 = 3.3$ m/s.
    explanation: |
      Unlike the linear case, there is no single $\tau$ for the body: faster launches have a shorter $\tau$.

  - id: charge
    title: Charge in a magnetic field
    row: 3
    col: 3
    body: |
      With $\mathbf B = (0,0,B)$ and $\omega = qB/m$, the transverse velocity $\eta = v_x + iv_y$ obeys
      $$\dot\eta = -i\omega\,\eta,$$
      $$r = \frac{mv}{qB},$$
      $$T = \frac{2\pi}{|\omega|}.$$
      The charge circles clockwise for $q > 0$, with $v_z$ constant (a helix) and the speed constant (no work). An electron at $10^6$ m/s in 0.010 T: $r \approx 0.57$ mm.
    decoys:
      - body: |
          With $\mathbf B = (0,0,B)$ and $\omega = qB/m$, the transverse velocity $\eta = v_x + iv_y$ obeys
          $$\dot\eta = +i\omega\,\eta,$$
          $$r = \frac{mv}{qB},$$
          $$T = \frac{2\pi}{|\omega|}.$$
          The charge circles counterclockwise for $q > 0$, with $v_z$ constant (a helix) and the speed constant (no work). An electron at $10^6$ m/s in 0.010 T: $r \approx 0.57$ mm.
        feedback: |
          From $m\dot{\mathbf v} = q\mathbf v\times\mathbf B$ with $\mathbf B$ along $z$: $\dot v_x = \omega v_y$ and $\dot v_y = -\omega v_x$. Then $\dot\eta = \omega v_y - i\omega v_x = -i\omega(v_x + iv_y)$. The sign is minus, and a positive charge turns clockwise seen from $+z$.
      - body: |
          With $\mathbf B = (0,0,B)$ and $\omega = qB/m$, the transverse velocity $\eta = v_x + iv_y$ obeys
          $$\dot\eta = -i\omega\,\eta,$$
          $$r = \frac{qB}{mv},$$
          $$T = \frac{2\pi}{|\omega|}.$$
          The charge circles clockwise for $q > 0$, with $v_z$ constant (a helix) and the speed **growing** as it turns. An electron at $10^6$ m/s in 0.010 T: $r \approx 0.57$ mm.
        feedback: |
          The circle is larger for a faster charge: $r = v/\omega$, and $\omega$ does not depend on $v$, so $r \propto v$ and the period is the same for all speeds. The force is perpendicular to $\mathbf v$, so it does no work and the speed stays fixed.
    explanation: |
      The same idea of a velocity-dependent force, with a very different outcome: the drag drains the speed, the magnetic force only turns it.

edges:
  - [drag, sphere]
  - [sphere, terminal]
  - [drag, lindrag]
  - [drag, quad]
  - [lindrag, coastlin]
  - [coastlin, projectile]
  - { from: terminal, to: projectile, dashed: true }
  - [quad, coastquad]
  - { from: coastquad, to: charge, dashed: true }

outroTitle: Level 3 in one picture
outro: |
  Drag opposes the velocity, $f = bv + cv^2$, and the ratio $f_{\text{quad}}/f_{\text{lin}} = cv/b$ says which term to keep; for a sphere $b = \beta D$ and $c = \gamma D^2$. A fall levels off at $v_{\text{ter}} = mg/b$ (linear) or $\sqrt{mg/c}$ (quadratic). With **linear** drag, $v = v_{\text{ter}}(1 - e^{-t/\tau})$ with $\tau = m/b$, a coasting body stops at $x_\infty = v_{x0}\tau$, and a projectile lands at $R \approx R_{\text{vac}}(1 - 4v_{y0}/(3v_{\text{ter}}))$. With **quadratic** drag, $v = v_{\text{ter}}\tanh(gt/v_{\text{ter}})$, and a coasting body slows as $v_0/(1 + t/\tau)$ with $\tau = m/(cv_0)$ and never stops. A charge in a magnetic field has $\dot\eta = -i\omega\eta$ with $\omega = qB/m$: it circles with $r = mv/(qB)$ and $T = 2\pi/|\omega|$, and the force does no work.
