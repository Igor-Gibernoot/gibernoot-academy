id: ch09-tidal-2
title: Tidal Acceleration · Part 2
kind: concept

own: |
  - **Setting and symbols**: $\phi$ is the gravitational potential, $G_N$ Newton's constant, $\rho$ the mass density, $M$ a point mass at the origin of the sources chart (stratified, cartesian, non-rotating; coordinates $x^i$, $x^0=t$, $\alpha,\beta\in\{1,2,3\}$, dot $= d/dt$). $\mathscr{Y}$ is a stratified chart with coordinates $y^i$ whose origin falls freely, $\gamma^\alpha_\mathcal{V}$ the $\mathscr{Y}$-coordinates of a nearby free particle, $\mathrm{Riem}$ the curvature of the connection $\nabla$, $\mathrm{Ric}_{00} := \sum_\alpha\mathrm{Riem}^\alpha_{0\alpha0}$, and $V(t)$ the volume of a small ball of particles, $V_0$ its initial value.
  - **Tidal equation** (recalled): in the falling chart
  {{ $$\ddot\gamma^\alpha_\mathcal{V} = -\mathrm{Riem}^\alpha_{0\beta0}\,\gamma^\beta_\mathcal{V}$$ }}
  up to $\mathcal{O}(|\gamma_\mathcal{V}|^2)$, with $\mathrm{Riem}^\alpha_{0\beta0} = \partial_\beta\partial_\alpha\phi$ at the origin.
  - **Point mass**: at distance $r$ on the $x^1$ axis, {{ $\mathrm{Riem}^1_{010} = -2G_NM/r^3$ }} stretches a cloud along the line to the mass, and $\mathrm{Riem}^2_{020} = \mathrm{Riem}^3_{030} = G_NM/r^3$ squeeze it across. Tides fall off like $1/r^3$ (the pull like $1/r^2$); both sides of the cloud move away from its center, hence two ocean bulges.
  - **Volume**: a small ball released at rest keeps, to order $t^2$,
  {{ $$V(t) \approx V_0\,\big(1 - \tfrac12\mathrm{Ric}_{00}\,t^2\big)$$ }}
  so in vacuum ($\mathrm{Ric}_{00} = 4\pi G_N\rho = 0$) it changes shape but not volume.

cards:
  - type: text
    id: recall-tidal
    tag: Recall
    title: 'Recall: the tidal equation'
    body: |
      Recall, from the lesson Tidal Acceleration · Part 1: a point mass $M$ sits at the origin of a sources chart (stratified, cartesian, non-rotating) with coordinates $x^i$, $x^0 = t$, and gravitational potential $\phi = -G_NM/|x|$ ($G_N$ is Newton's constant). A stratified chart $\mathscr{Y}$ with coordinates $y^i$ has its origin falling freely. A nearby free particle has $\mathscr{Y}$-coordinates $\gamma^\alpha_\mathcal{V}$ ($\alpha\in\{1,2,3\}$, dot $= d/dt$), and in this chart $(\Gamma_\mathscr{Y})^\alpha_{00}\approx\mathrm{Riem}^\alpha_{0\beta0}\,\eta^\beta$ at offset $\eta$ (summing over $\beta$), zero at the origin only. It obeys the **tidal equation**
      $$\ddot\gamma^\alpha_\mathcal{V} = -\mathrm{Riem}^\alpha_{0\beta0}\,\gamma^\beta_\mathcal{V} + \mathcal{O}(|\gamma_\mathcal{V}|^2),$$
      with $\mathrm{Riem}^\alpha_{0\beta0} = \partial_\beta\partial_\alpha\phi$ at the origin.

  - type: text
    id: recall-point-mass
    tag: Recall
    title: 'Recall: the point mass'
    body: |
      At distance $r$ from the point mass on the $x^1$ axis,
      $$\mathrm{Riem}^1_{010} = -\frac{2G_NM}{r^3},$$
      $$\mathrm{Riem}^2_{020} = \mathrm{Riem}^3_{030} = \frac{G_NM}{r^3},$$
      and the mixed components vanish. The radial one stretches (offsets along $x^1$ accelerate outward), the other two squeeze. With $G_NM = 8$ at $r = 2$ the values are $-2$, $1$, $1$. Also recall $\mathrm{Riem}^\alpha_{0\beta0}$ is a component of the curvature, and the Ricci component is $\mathrm{Ric}_{00} = \sum_\alpha\mathrm{Riem}^\alpha_{0\alpha0} = 4\pi G_N\rho$, with $\rho$ the mass density.

  - type: text
    id: volume
    title: Shape, not volume
    body: |
      Release a small ball of particles at rest. To order $t^2$ each offset moves as
      $$\gamma^\alpha_\mathcal{V}(t) \approx \gamma^\alpha_\mathcal{V}(0) - \tfrac12 t^2\,\mathrm{Riem}^\alpha_{0\beta0}\gamma^\beta_\mathcal{V}(0),$$
      a linear map $\mathbb{1} - \tfrac12t^2 R$ with $R$ the matrix of $\mathrm{Riem}^\alpha_{0\beta0}$. Volumes scale by its determinant, which to this order is $1 - \tfrac12t^2(R^1_1 + R^2_2 + R^3_3)$. The sum is a trace, and recall that it is the Ricci component:
      $$\sum_\alpha\mathrm{Riem}^\alpha_{0\alpha0} = \mathrm{Ric}_{00} = 4\pi G_N\rho.$$
      So
      $$V(t) \approx V_0\,\big(1 - \tfrac12\mathrm{Ric}_{00}\,t^2\big).$$

  - type: mcq
    id: vacuum-volume
    title: Outside the planet
    prompt: |
      A small ball of free particles is released at rest at distance $2$ from a point mass ($G_NM = 8$), in vacuum, where $\mathrm{Riem}^1_{010} = -2$ and $\mathrm{Riem}^2_{020} = \mathrm{Riem}^3_{030} = 1$. To order $t^2$, the volume obeys $V(t)\approx V_0(1 - \tfrac12\mathrm{Ric}_{00}t^2)$ with $\mathrm{Ric}_{00} = \sum_\alpha\mathrm{Riem}^\alpha_{0\alpha0}$. What happens to the ball?
    options:
      - text: 'It stretches radially and squeezes in both transverse directions, keeping its volume to this order'
        correct: true
      - text: 'Its volume shrinks: gravity attracts everything toward everything'
        feedback: |
          $\mathrm{Ric}_{00} = -2 + 1 + 1 = 0$ here, so the $t^2$ term vanishes. Volume shrinks only where $\mathrm{Ric}_{00} = 4\pi G_N\rho > 0$, inside matter.
      - text: 'It keeps its shape: in free fall nothing changes'
        feedback: |
          The shape changes: offsets along $x^1$ accelerate outward ($-(-2)\gamma^1$), offsets across inward ($-(1)\gamma^2$). Only the volume is kept.
      - text: 'Its cross-section in the plane of $x^1, x^2$ keeps its area'
        feedback: |
          In that plane the trace is $-2 + 1 = -1$, so the area grows. The volume is kept only because the third direction, $\mathrm{Riem}^3_{030} = 1$, squeezes too.
    explanation: |
      Vacuum: $\mathrm{Ric}_{00} = 4\pi G_N\rho = 0$, the trace $-2 + 1 + 1 = 0$. Tidal forces outside matter change shape but not volume; inside matter they also shrink the volume.

  - type: text
    id: oceans
    title: Ocean tides
    body: |
      The Earth falls freely toward the Moon (more exactly, both fall around their common center). In the Earth's freely falling chart, the oceans are the crumbs: the water facing the Moon is pulled more than the Earth's center, the water on the far side less.

      Along the Earth–Moon line, $\mathrm{Riem}^1_{010} = -2G_NM/r^3 < 0$ ($M$ the Moon's mass, $r$ the Earth–Moon distance), so the tidal acceleration $-\mathrm{Riem}^1_{010}\gamma^1_\mathcal{V}$ has the same sign as the offset $\gamma^1_\mathcal{V}$. Across it, $\mathrm{Riem}^2_{020} > 0$ pulls the water in.

  - type: mcq
    id: two-bulges
    title: The far side bulges too
    prompt: |
      The oceans bulge both on the side facing the Moon and on the opposite side, so most coasts see two high tides a day. In the Earth's freely falling chart, with $x^1$ along the Earth–Moon line, the tidal acceleration is $-\mathrm{Riem}^1_{010}\gamma^1_\mathcal{V}$ with $\mathrm{Riem}^1_{010} = -2G_NM/r^3$. Why is there a bulge on the far side?
    options:
      - text: 'The far water is pulled less than the Earth''s center and is left behind: away from the center, just as the near water runs ahead'
        correct: true
      - text: 'The Earth''s rotation flings the far water outward'
        feedback: |
          Spinning flattens the Earth at the poles, the same on every meridian; it does not single out the side opposite the Moon. The bulges follow the Moon around as the Earth turns.
      - text: 'The Moon pushes the far side away from it'
        feedback: |
          Gravity only attracts: the Moon pulls the far water toward itself too. It pulls it less than it pulls the Earth's center, and in the falling chart only that difference counts.
      - text: 'The near bulge pushes water through the Earth to the other side'
        feedback: |
          No flow is needed: each side has its own tidal acceleration. $-\mathrm{Riem}^1_{010}\gamma^1_\mathcal{V}$ points away from the center for $\gamma^1_\mathcal{V} > 0$ and for $\gamma^1_\mathcal{V} < 0$ alike.
    explanation: |
      $-\mathrm{Riem}^1_{010} > 0$, so the tidal acceleration has the sign of the offset: outward on both sides. Two bulges along the line to the Moon, and low water across it, where $\mathrm{Riem}^2_{020} > 0$ squeezes.

  - type: mcq
    id: trap-gone
    title: 'Trap: weightless means no gravity?'
    prompt: |
      A station falls freely around a planet; its crew floats. Someone concludes: "inside a freely falling station gravity is gone, so the planet has no effect at all on what happens inside." Is that right?
    options:
      - text: 'No: gravity is removed only along the center''s worldline; nearby free objects still drift apart along the line to the planet and together across it'
        correct: true
      - text: 'Yes: in the freely falling chart all connection coefficients vanish'
        feedback: |
          Only at the origin. Elsewhere $(\Gamma_\mathscr{Y})^\alpha_{00}\approx\mathrm{Riem}^\alpha_{0\beta0}\eta^\beta$, nonzero wherever the curvature is, which is everywhere near a planet.
      - text: 'Yes, up to air currents and the station''s own mass'
        feedback: |
          Even in perfect vacuum with a massless station, the planet's tidal acceleration $-\mathrm{Riem}^\alpha_{0\beta0}\gamma^\beta_\mathcal{V}$ remains: it comes from the non-uniform field, which no chart removes.
    explanation: |
      Floating is the equivalence principle along one worldline. Over the size of the station, the tidal acceleration (tiny, but real) survives: this is the curvature, and it is why non-uniform gravity is more than a pseudo-force.

  - type: widget
    id: far-widget
    title: Twice as far
    widget: falling-cloud
    config: { GM: 8, c0: [2, 0], r0: 0.2, view: both, presets: [{ label: Near, c0: [2, 0] }, { label: Far, c0: [4, 0] }] }
    body: |
      Compare the ring at distance $2$ (**Near**) with the same ring at distance $4$ (**Far**). Read $\mathrm{Riem}^1_{010}$ in both, and press Play to see how slowly the far ring deforms.

  - type: numeric
    id: far-factor
    title: Strength or gradient?
    prompt: |
      A point mass has $G_NM = 8$. The pull $\partial_1\phi = G_NM/r^2$ at distance $r$ on the $x^1$ axis is $2$ at $r = 2$ and $0.5$ at $r = 4$: four times weaker. The radial tidal component is $\mathrm{Riem}^1_{010} = -2G_NM/r^3$. By what factor is $|\mathrm{Riem}^1_{010}|$ smaller at $r = 4$ than at $r = 2$?
    answer: 8
    wrong:
      - { value: 4, feedback: 'That is the ratio of the pulls, $G_NM/r^2$. Tides come from the derivative of the pull, which falls off one power faster: $1/r^3$.' }
      - { value: 2, feedback: 'Doubling $r$ divides $1/r^3$ by $2^3 = 8$, not by $2$.' }
    explanation: |
      $|\mathrm{Riem}^1_{010}|$ is $16/8 = 2$ at $r = 2$ and $16/64 = 0.25$ at $r = 4$: eight times weaker, while the pull is only four times weaker.

  - type: mcq
    id: trap-strength
    title: 'Trap: the stronger pull makes the bigger tide?'
    prompt: |
      The Sun pulls the Earth about $180$ times harder than the Moon does ($M_\text{Sun}/M_\text{Moon}\approx2.7\cdot10^7$, and the Sun is about $390$ times farther). Someone concludes that the Sun's tides must be about $180$ times the Moon's. In fact they are about half. Why?
    options:
      - text: 'Tides come from the curvature $\partial_\beta\partial_\alpha\phi\propto M/r^3$, not from the pull $\propto M/r^2$; the extra factor $1/390$ outweighs the Sun''s larger pull'
        correct: true
      - text: 'The Sun is too far for its gravity to reach the oceans'
        feedback: |
          The Sun's gravity reaches the Earth fully: it keeps the Earth in orbit. What is small is how much that pull changes across the Earth's diameter.
      - text: 'The Earth orbits the Sun, and orbiting cancels the Sun''s gravity entirely'
        feedback: |
          Free fall around the Sun cancels the Sun's gravity at the Earth's center only. The difference across the Earth remains; it is just small, because the Sun is so far away.
      - text: 'The Moon is denser than the Sun'
        feedback: |
          For the field outside a body only its mass and distance matter ($\phi = -G_NM/|x|$). Density plays no role.
    explanation: |
      Ratio of pulls: $2.7\cdot10^7/390^2\approx180$. Ratio of tides: $2.7\cdot10^7/390^3\approx0.46$. Tides measure how fast the pull changes from place to place, the second derivatives of $\phi$, which is why they fall off like $1/r^3$.

  - type: text
    id: summary
    body: |
      **Next:** a guided problem. Starting from $\phi = -G_NM/|x|$ alone, compute every $\Gamma^\alpha_{00}$, every $\mathrm{Riem}^\alpha_{0\beta0}$ at an arbitrary point (not only on an axis), and the Ricci curvature, and check that vacuum is indeed $\mathrm{Ric} = 0$ with $\mathrm{Riem}\neq0$.
