id: ch09-pseudo-forces-2
title: Inertial Charts and Pseudo-Forces · Part 2
kind: concept

own: |
  - **Setting**: $(\mathcal{U},\mathscr{X})$ is an inertial chart (a stratified chart, $x^0 = t$ the absolute time, with all connection coefficients zero) and $(\mathcal{V},\mathscr{Y})$ a chart whose axes rotate by the angle $\theta(t)$ about the third axis with origin at $b^\alpha(t)$ in $\mathscr{X}$ ($\alpha,\beta,\delta\in\{1,2,3\}$, dot $= d/dt$). A particle of mass $m$ under a force $f_\gamma$ has coordinates $\gamma^\alpha$ in $\mathscr{Y}$ and $\dot\gamma^0 = 1$. The coefficients are $\Gamma^1_{02} = \Gamma^1_{20} = -\dot\theta$, $\Gamma^2_{01} = \Gamma^2_{10} = \dot\theta$, $\Gamma^\alpha_{00}$ from $\ddot\theta$, $\dot\theta^2$ and $\ddot b$, and $\Gamma^\alpha_{\beta\delta} = 0$.
  - **Splitting Newton II**: $\ddot\gamma^\alpha + \Gamma^\alpha_{jk}\dot\gamma^j\dot\gamma^k = f^\alpha_\gamma/m$, and the terms with exactly one time index sum to $2\Gamma^\alpha_{0\beta}\dot\gamma^\beta$ because
  {{ $\Gamma^\alpha_{0\beta} = \Gamma^\alpha_{\beta0}$ }}
  (torsion free), the origin of the $2$ in the Coriolis force.
  - **The four pseudo-forces** (Coriolis, centrifugal, Euler, translational), with $\gamma^\alpha$ the particle's coordinates in $\mathscr{Y}$:
  {{ $$\begin{aligned}m\ddot\gamma^1 = f^1_\gamma &+ 2m\dot\theta\,\dot\gamma^2 + m\dot\theta^2\gamma^1\\ &+ m\ddot\theta\,\gamma^2\\ &- m(\cos\theta\,\ddot b^1 + \sin\theta\,\ddot b^2)\end{aligned}$$ }}
  Coriolis comes from $\Gamma^\alpha_{0\beta}$ and needs a velocity in $\mathscr{Y}$; the other three come from $\Gamma^\alpha_{00}$. A force-free puck at rest on inertial ice, seen from a carousel turning at $\dot\theta=\omega$, runs a clockwise circle: Coriolis $-2\omega^2 r$ beats centrifugal $+\omega^2 r$ and leaves the centripetal acceleration $-\omega^2r$.
  - **Not a pseudo-force**: terms $\Gamma^\alpha_{\beta\delta}$ come from curvilinear grids at rest, such as the polar grid of an inertial plane,
  {{ $$\ddot r - r\dot\varphi^2 = 0$$ }}
  with $\Gamma^r_{\varphi\varphi} = -r$; non-rigid charts produce other chart effects.

cards:
  - type: text
    id: recall-rigid
    title: "Recall: inertial chart and rigid axes"
    body: |
      A stratified chart has zeroth coordinate $x^0 = t$, the absolute time. An **inertial chart** $(\mathcal{U},\mathscr{X})$ is a stratified chart in which every connection coefficient vanishes, $\Gamma_\mathscr{X} = 0$ (without gravity, free particles of every velocity then move straight, $\ddot\gamma^\alpha = 0$). From it, a stratified chart $(\mathcal{V},\mathscr{Y})$ has the coefficients $(\Gamma_\mathscr{Y})^i_{jk} = \frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^s}\frac{\partial^2\mathscr{X}^s}{\partial\mathscr{Y}^k\partial\mathscr{Y}^j}$, made by the change of chart alone.
      For **rigidly moving axes** (rotating by $\theta(t)$ about the third axis, origin at $b^\alpha(t)$, $\alpha,\beta,\delta\in\{1,2,3\}$, dot $= d/dt$), with $x^1 = y^1\cos\theta - y^2\sin\theta + b^1$ and similarly for $x^2, x^3$, the only nonzero coefficients are
      $$\Gamma^1_{02} = \Gamma^1_{20} = -\dot\theta,\qquad \Gamma^2_{01} = \Gamma^2_{10} = \dot\theta,$$
      and $\Gamma^\alpha_{00}$, with
      $$\begin{aligned}\Gamma^1_{00} &= -\dot\theta^2y^1 - \ddot\theta\,y^2\\ &\quad + \cos\theta\,\ddot b^1 + \sin\theta\,\ddot b^2,\end{aligned}$$
      $$\Gamma^3_{00} = \ddot b^3.$$
      All $\Gamma^\alpha_{\beta\delta}$ vanish because the change is linear in space.

  - type: text
    id: recall-newton
    title: "Recall: the puck and Newton II"
    body: |
      In the hook, a puck rests on frictionless ice (an inertial chart), at distance $1$ from a vertical axis, while a carousel floor turns above it counterclockwise at $\omega = 1$. In the floor's coordinates $y$ the force-free puck runs a clockwise circle, $y = (\cos t, -\sin t)$, with $\ddot y = -y$: toward the center, with no force acting. Which coefficients say so? In a stratified chart, a particle of mass $m$ under a force $f_\gamma$, parametrized by absolute time ($\dot\gamma^0 = 1$), obeys
      $$\ddot\gamma^\alpha + \Gamma^\alpha_{jk}\dot\gamma^j\dot\gamma^k = \frac{f^\alpha_\gamma}{m}.$$

  - type: text
    id: split
    title: Splitting the $\Gamma$-term
    body: |
      Along a worldline parametrized by absolute time write $\gamma^\alpha := \mathscr{Y}^\alpha\circ\gamma$ for its coordinates in the moving chart (the widget's $y^\alpha$), so $\dot\gamma^0 = 1$. Spatial Newton II reads
      $$\ddot\gamma^\alpha + \Gamma^\alpha_{jk}\dot\gamma^j\dot\gamma^k = \frac{f^\alpha_\gamma}{m}.$$
      Split the double sum by how many of $j, k$ are $0$:
      $$\begin{aligned}\Gamma^\alpha_{jk}\dot\gamma^j\dot\gamma^k &= \Gamma^\alpha_{00}\\ &\quad + (\Gamma^\alpha_{0\beta} + \Gamma^\alpha_{\beta0})\dot\gamma^\beta\\ &\quad + \Gamma^\alpha_{\beta\delta}\dot\gamma^\beta\dot\gamma^\delta.\end{aligned}$$
      For rigid axes the last line is $0$.

  - type: mcq
    id: factor-two
    title: Where the 2 comes from
    prompt: |
      In a stratified chart with $\dot\gamma^0 = 1$, the terms of $\Gamma^\alpha_{jk}\dot\gamma^j\dot\gamma^k$ with exactly one time index sum to $2\Gamma^\alpha_{0\beta}\dot\gamma^\beta$. Where does the factor $2$ come from?
    options:
      - text: 'From the two index pairs $(j,k) = (0,\beta)$ and $(\beta,0)$, equal because the connection is torsion free'
        correct: true
      - text: 'From differentiating $(\dot\gamma^\beta)^2$, as in the power rule'
        feedback: |
          Nothing is differentiated here: the sum over $j$ and $k$ is just expanded. The $2$ counts terms, it is not an exponent brought down.
      - text: 'From the two rotating axes $y^1$ and $y^2$'
        feedback: |
          The factor $2$ appears for any stratified chart, rotating or not, and even in three rotating dimensions it stays $2$: it counts the slots where the time index can sit.
      - text: 'From the $\tfrac12$ in the formula for the coefficients'
        feedback: |
          There is no metric formula here: Newton-Cartan coefficients are not computed from a metric. The $2$ comes from the symmetry $\Gamma^\alpha_{0\beta} = \Gamma^\alpha_{\beta0}$.
    explanation: |
      $(\Gamma^\alpha_{0\beta} + \Gamma^\alpha_{\beta0})\dot\gamma^\beta = 2\Gamma^\alpha_{0\beta}\dot\gamma^\beta$ since the torsion-free connection has symmetric lower indices. This $2$ is the famous $2$ of the Coriolis force $2m\dot\theta\,\dot\gamma$.

  - type: text
    id: four-forces
    title: The four pseudo-forces
    body: |
      Insert the coefficients and move every $\Gamma$-term to the right. With $c = \cos\theta$, $s = \sin\theta$:
      $$\begin{aligned}m\ddot\gamma^1 = f^1_\gamma &+ 2m\dot\theta\,\dot\gamma^2 + m\dot\theta^2\gamma^1\\ &+ m\ddot\theta\,\gamma^2 - m(c\,\ddot b^1 + s\,\ddot b^2)\end{aligned}$$
      $$\begin{aligned}m\ddot\gamma^2 = f^2_\gamma &- 2m\dot\theta\,\dot\gamma^1 + m\dot\theta^2\gamma^2\\ &- m\ddot\theta\,\gamma^1 - m(-s\,\ddot b^1 + c\,\ddot b^2)\end{aligned}$$
      $$m\ddot\gamma^3 = f^3_\gamma - m\ddot b^3.$$
      Term by term, the pseudo-forces of classical mechanics:
      - **Coriolis** $\pm2m\dot\theta\,\dot\gamma$: from $\Gamma^\alpha_{0\beta}$; needs a velocity in the moving chart.
      - **centrifugal** $m\dot\theta^2\gamma$: from $\Gamma^\alpha_{00}$; points away from the rotation axis.
      - **Euler** $\pm m\ddot\theta\,\gamma$: from $\Gamma^\alpha_{00}$; only while the spin rate changes.
      - **translational** $-m\ddot b$ (in the moving axes): from $\Gamma^\alpha_{00}$; the same for every particle, the push felt in an accelerating vehicle.

  - type: mcq
    id: which-forces-rest
    title: Sitting on the carousel
    prompt: |
      A chart rotates relative to an inertial chart at constant angular speed ($\dot\theta = \omega\neq0$, $\ddot\theta = 0$) with fixed origin ($b = 0$). A particle is momentarily at rest in the rotating chart ($\dot\gamma^\alpha = 0$), away from the axis. In
      $$\begin{aligned}m\ddot\gamma^1 = f^1_\gamma &+ 2m\dot\theta\,\dot\gamma^2 + m\dot\theta^2\gamma^1\\ &+ m\ddot\theta\,\gamma^2 - m(c\,\ddot b^1 + s\,\ddot b^2),\end{aligned}$$
      which pseudo-forces (Coriolis, centrifugal, Euler, translational) are nonzero?
    options:
      - text: 'Only the centrifugal force'
        correct: true
      - text: 'Centrifugal and Coriolis'
        feedback: |
          Coriolis is $2m\dot\theta\,\dot\gamma$: it needs a velocity in the rotating chart, and here $\dot\gamma = 0$.
      - text: 'Centrifugal and Euler'
        feedback: |
          Euler is $m\ddot\theta\,\gamma$: it needs the spin rate to change. At constant $\omega$, $\ddot\theta = 0$.
      - text: 'All four: rotation produces all of them'
        feedback: |
          Each has its own trigger: Coriolis needs $\dot\gamma\neq0$, Euler needs $\ddot\theta\neq0$, translational needs $\ddot b\neq0$. Here only $\dot\theta^2\gamma\neq0$.
    explanation: |
      With $\dot\gamma = 0$, $\ddot\theta = 0$, $\ddot b = 0$ only $m\omega^2\gamma$ survives: the outward push a rider feels. The **Co-moving** preset of the rotating-grid widget shows it: the sum arrow equals the centrifugal one.

  - type: numeric
    id: hook-coriolis
    title: The puck, resolved
    prompt: |
      A force-free puck stays at $x = (1,0)$ on the ice; a chart rotates counterclockwise at $\dot\theta = 1$ ($\ddot\theta = 0$, $b = 0$). At $t = 0$ the puck has rotating coordinates $\gamma = (1, 0)$ and rotating velocity $\dot\gamma = (0, -1)$. Per unit mass the first components of the pseudo-forces are Coriolis $2\dot\theta\,\dot\gamma^2$ and centrifugal $\dot\theta^2\gamma^1$. What is the Coriolis component?
    answer: -2
    wrong:
      - value: 0
        feedback: |
          The puck is at rest on the ice but **moving** in the rotating chart, $\dot\gamma^2 = -1$, so the Coriolis term $2\cdot1\cdot(-1)$ does not vanish.
      - value: -1
        feedback: |
          $-1$ is the total $\ddot\gamma^1$. The Coriolis term alone is $2\dot\theta\,\dot\gamma^2 = 2\cdot1\cdot(-1)$.
    explanation: |
      Coriolis $-2$ (inward), centrifugal $+1$ (outward): the sum is $\ddot\gamma^1 = -1$, exactly the centripetal acceleration of the clockwise circle. The puck is pushed by nothing; the floor's chart books its circle as Coriolis beating centrifugal.

  - type: widget
    id: widget-cancel
    title: When the two cancel
    widget: rotating-grid
    config:
      omega: 1
      x0: [1, 0]
      v: [0, 0.5]
      view: rotating
      ghost: true
      presets:
        - { label: At rest, v: [0, 0] }
        - { label: Cancel, v: [0, 0.5] }
        - { label: Co-moving, v: [0, 1] }
    body: |
      The rotating chart only, at $\omega = 1$. The puck starts at $x_0 = (1,0)$ with inertial velocity $v = (0, 0.5)$ (preset **Cancel**); the faint dashed curve is its whole path in the rotating chart. At $t = 0$ read the gold Coriolis arrow, the green centrifugal arrow and their sum ÿ in the readout. Then drag $t$ forward.

  - type: numeric
    id: cancel-coriolis
    title: Coriolis at the start
    prompt: |
      A free particle starts at $x_0 = (1, 0)$ of an inertial chart with velocity $v = (0, 0.5)$; a chart rotates at $\dot\theta = \omega = 1$. At $t = 0$ (where the charts agree) its rotating velocity is $\dot\gamma = (0, -0.5)$. What is the first component of the Coriolis term per unit mass, $2\dot\theta\,\dot\gamma^2$?
    answer: -1
    wrong:
      - value: 1
        feedback: |
          $\dot\gamma^2 = -0.5$ is negative: the floor runs ahead of the particle. $2\cdot1\cdot(-0.5) = -1$.
      - value: -0.5
        feedback: |
          The Coriolis term has the factor $2$: $2\cdot1\cdot(-0.5)$.
    explanation: |
      Coriolis $(-1, 0)$ and centrifugal $\omega^2\gamma = (1, 0)$ cancel: $\ddot\gamma = 0$ at $t = 0$.

  - type: mcq
    id: cancel-straight
    title: Does it go straight?
    prompt: |
      A free particle seen in a chart rotating at $\omega = 1$ has, at $t = 0$, Coriolis $(-1, 0)$ and centrifugal $(1, 0)$ per unit mass, so its rotating acceleration is $\ddot\gamma = 0$ at that instant. Does it move on a straight line in the rotating chart?
    options:
      - text: 'No: the forces cancel only at that instant; its path in the rotating chart still curls'
        correct: true
      - text: 'Yes: zero acceleration means a straight line at constant velocity'
        feedback: |
          Zero acceleration at one instant is not zero acceleration for all time. As the particle moves, $\gamma$ and $\dot\gamma$ change, the two terms stop balancing, and the path bends (the dashed curve in the widget).
      - text: 'Yes, because the particle is free and free particles move straight'
        feedback: |
          Free particles move straight in the **inertial** chart. In the rotating chart their coordinates obey Newton II with the $\Gamma$-terms, which bend the coordinate path.
    explanation: |
      For $v = (0, 0.5)$, $\gamma^1 = \cos t + 0.5t\sin t$, $\gamma^2 = -\sin t + 0.5t\cos t$: $\ddot\gamma(0) = 0$, but at $t = 4$ the Coriolis term is about $(3.68, 1.86)$. Cancellation is a momentary balance, not inertial motion.

  - type: text
    id: polar-footnote
    title: What is not a pseudo-force
    body: |
      $\Gamma^\alpha_{\beta\delta}$ involves only the spatial second derivatives $\partial^2\mathscr{X}^\sigma/\partial\mathscr{Y}^\delta\partial\mathscr{Y}^\beta$, so it vanishes for every change **linear in the spatial coordinates**. It appears when the spatial grid is curvilinear, even at rest. Polar coordinates $(r, \varphi)$ in an inertial plane have $\Gamma^r_{\varphi\varphi} = -r$, and a free particle obeys
      $$\ddot r - r\dot\varphi^2 = 0.$$
      The term $-r\dot\varphi^2$ is part of the curvilinear expression of the acceleration, not counted as a pseudo-force: no axes move.

      Rigid motions are the most general changes from an inertial chart to cartesian axes moving with respect to it. Nothing forbids more exotic stratified charts, related by non-rigid changes (a grid that stretches or shears in time), whose $\Gamma$-terms take other forms. The four classical pseudo-forces are the small subset of chart effects produced by rigidly moving axes.

  - type: mcq
    id: polar-which
    title: Where $-r\dot\varphi^2$ lives
    prompt: |
      In an inertial plane, switch the spatial grid to polar coordinates $(r,\varphi)$, at rest (not rotating, not moving). A free particle obeys $\ddot r - r\dot\varphi^2 = 0$. Which kind of coefficient produces the term $-r\dot\varphi^2$?
    options:
      - text: '$\Gamma^\alpha_{\beta\delta}$ (both lower indices spatial): $\Gamma^r_{\varphi\varphi} = -r$, from a curvilinear grid at rest'
        correct: true
      - text: '$\Gamma^\alpha_{00}$: it is the centrifugal force $m\dot\theta^2r$'
        feedback: |
          It looks like centrifugal, but the grid does not rotate: $\dot\theta = 0$, so $\Gamma^\alpha_{00} = 0$. Here $\dot\varphi$ is the particle's own angular velocity, multiplied twice, the signature of a $\Gamma^\alpha_{\beta\delta}\dot\gamma^\beta\dot\gamma^\delta$ term.
      - text: '$\Gamma^\alpha_{0\beta}$: it is a Coriolis force'
        feedback: |
          Coriolis terms are linear in the velocity and need a moving grid. $-r\dot\varphi^2$ is quadratic in velocity and arises for a grid at rest.
    explanation: |
      The polar grid at rest is a change nonlinear in space, so $\Gamma^r_{\varphi\varphi} = -r$ appears in the $\Gamma^\alpha_{\beta\delta}$ slot. Classical mechanics keeps the name pseudo-force for the terms made by moving axes, $\Gamma^\alpha_{0\beta}$ and $\Gamma^\alpha_{00}$.

  - type: text
    id: summary
    body: |
      **Next:** switch gravity back on. Then no stratified chart makes every free fall straight everywhere, and the Newtonian potential enters the very same slot as the centrifugal and translational forces, $\Gamma^\alpha_{00}$: gravity in the connection.
