id: ch09-stratified
title: Stratified Atlases · Part 1
kind: concept

own: |
  - **Setting and symbols**: $\mathcal{M}$ is the 4-dimensional manifold of events, $\mathcal{A}$ its atlas of charts $(\mathcal{U},\mathscr{X})$, $t\in C^\infty(\mathcal{M})$ the absolute time with $(dt)_p\neq0$, and $\mathcal{S}_\tau := \mathrm{preim}_t(\{\tau\})$ the absolute space at time $\tau$.
  - **Stratified chart**: a chart $(\mathcal{U},\mathscr{X})$ with
  {{ $$\mathscr{X}^0 = t|_\mathcal{U}$$ }}
  so the absolute spaces are the slices $\mathscr{X}^0 = \text{const}$. They exist around every event ($(dt)_p\neq0$ lets $t$ replace some coordinate, by the inverse function theorem) and form the **stratified atlas** $\mathcal{A}_{\text{strat.}}\subseteq\mathcal{A}$. Latin $i,j,k\in\{0,1,2,3\}$, Greek $\alpha,\beta,\delta\in\{1,2,3\}$.
  - **Between stratified charts** the Jacobian has a fixed time row:
  {{ $$\begin{gathered}\frac{\partial\mathscr{Y}^0}{\partial\mathscr{X}^0} = 1\\ \frac{\partial\mathscr{Y}^0}{\partial\mathscr{X}^\beta} = 0\end{gathered}$$ }}
  while $\partial\mathscr{Y}^\alpha/\partial\mathscr{X}^0$ is arbitrary: the spatial grid may move, rotate or deform in time. Time components of vectors agree.
  - **Spatial vectors** ($v^0 = 0$, such as forces): {{ they transform with the $3\times3$ block $\partial\mathscr{Y}^\alpha/\partial\mathscr{X}^\beta$ only }}, while a velocity ($v^0 = 1$) also picks up the grid velocity $\partial\mathscr{Y}^\alpha/\partial\mathscr{X}^0$.

cards:
  - type: text
    id: hook
    title: Three grids, one spacetime
    body: |
      Take the simplest Newtonian spacetime: one chart $(\mathcal{U},\mathscr{X})$ covering all of $\mathcal{M}$, with coordinates $x^0,x^1,x^2,x^3$, where $x^0 = t$ (absolute time) and all connection coefficients $\Gamma^k_{ji}$ are zero. Observer **A** uses this chart. Free particles move on straight lines, $x^\alpha = v^\alpha t + c^\alpha$.

      Two more observers keep $t$ as their clock but lay out space with their own grids:
      - **B**, chart $\mathscr{Y}$: $y^0 = x^0$, $y^1 = x^1 - 2x^0$, $y^2 = x^2$, $y^3 = x^3$. B's grid point $y^1 = 0$ sits at $x^1 = 2t$: the grid **slides** at speed $2$.
      - **C**, chart $\mathscr{Z}$: $z^0 = x^0$, $z^1 = x^1 - (x^0)^2$, $z^2 = x^2$, $z^3 = x^3$. C's grid point $z^1 = 0$ sits at $x^1 = t^2$: the grid **accelerates**.

      Two questions, one per part of this lesson: do the three observers agree on **when** things happen, and do they agree on the connection (which paths count as free)? This part takes the first; Part 2 takes the second.

  - type: mcq
    id: hook-simultaneity
    title: Before any theory, predict
    prompt: |
      In a Newtonian spacetime with absolute time $t$, observer A uses coordinates $(x^0,\dots,x^3)$ with $x^0 = t$. Observer B uses $y^0 = x^0$, $y^1 = x^1 - 2x^0$ (grid sliding at speed 2), observer C uses $z^0 = x^0$, $z^1 = x^1 - (x^0)^2$ (grid accelerating); the other coordinates are copied. Who agrees with A on which events are simultaneous?
    options:
      - text: 'Both B and C'
        correct: true
      - text: 'B only: an accelerating grid makes the clocks drift'
        feedback: |
          C's clock is $z^0 = x^0 = t$, the same function on spacetime as A's. Accelerating the spatial grid changes the labels $z^1$, never the time label.
      - text: 'Neither: moving observers disagree on simultaneity'
        feedback: |
          That is special relativity, where the new time coordinate mixes in space ($t' = \gamma(t - vx)$). Here every chart reads time with the same function $t$, so "same $t$" means the same thing for everybody.
      - text: 'C only'
        feedback: |
          B's time coordinate $y^0 = x^0 = t$ is A's absolute time exactly; sliding the grid at constant speed does not touch it.
    explanation: |
      All three time coordinates equal the absolute time $t$, so two events have the same time coordinate for A iff they do for B and for C. Simultaneity is fixed by $t$, not by the grid.

  - type: text
    id: def-stratified
    title: Stratified charts
    body: |
      Recall: a Newtonian spacetime carries an absolute time $t\in C^\infty(\mathcal{M})$ with $(dt)_p\neq0$ at every event $p$, and its slices $\mathcal{S}_\tau := \mathrm{preim}_t(\{\tau\})$ are the absolute spaces.

      A chart $(\mathcal{U},\mathscr{X})$ is **stratified** if its zeroth coordinate is the absolute time itself:
      $$\mathscr{X}^0 = t|_\mathcal{U}.$$
      ($t|_\mathcal{U}$ is $t$ restricted to the chart domain $\mathcal{U}$.) Then the absolute spaces are the slices $\mathscr{X}^0 = \text{const}$: the chart is cut in layers ("strata") by time. All stratified charts of the atlas $\mathcal{A}$ form the **stratified atlas** $\mathcal{A}_{\text{strat.}}\subseteq\mathcal{A}$.

      From now on, Latin indices $i,j,k,\dots$ run over $\{0,1,2,3\}$ and Greek indices $\alpha,\beta,\delta,\dots$ over the spatial values $\{1,2,3\}$.

  - type: mcq
    id: which-stratified
    title: Which charts are stratified?
    multiple: true
    prompt: |
      In a Newtonian spacetime, $(\mathcal{U},\mathscr{X})$ is a chart with coordinates $x^0,\dots,x^3$ and $x^0 = t|_\mathcal{U}$ (absolute time). Each option defines new coordinates $(w^0,w^1,w^2,w^3)$ on $\mathcal{U}$ (assume each is a chart). A chart is stratified if its zeroth coordinate equals $t$. Which are stratified?
    options:
      - text: '$(x^0,\; x^1 + 5x^0,\; x^2,\; x^3)$'
        correct: true
      - text: '$(2x^0,\; x^1,\; x^2,\; x^3)$'
        feedback: |
          Its slices $2x^0 = \text{const}$ are still the absolute spaces, but the zeroth coordinate is $2t$, not $t$: the definition asks for $\mathscr{X}^0 = t$ exactly, so that every stratified chart reads the same time.
      - text: '$(x^0 + x^1,\; x^1,\; x^2,\; x^3)$'
        feedback: |
          Its slices $x^0 + x^1 = \text{const}$ tilt across the absolute spaces: events with the same $w^0$ can have different absolute times.
      - text: '$(x^0,\; x^1\cos x^0 + x^2\sin x^0,\; -x^1\sin x^0 + x^2\cos x^0,\; x^3)$'
        correct: true
    explanation: |
      Only the zeroth coordinate is constrained: it must be $t$. The spatial coordinates may depend on $x^0$ in any smooth invertible way, sliding ($x^1 + 5x^0$) or rotating with time. $2x^0$ and $x^0 + x^1$ are not $t$.

  - type: text
    id: existence
    title: Do they always exist?
    body: |
      Pick any chart $(\mathcal{U},\mathscr{X})$ around $p$ and write $\partial_\kappa$ for the partial derivative in $\mathbb{R}^4$ along slot $\kappa$. The component functions of $dt$ are $\mathtt{t}_k = \partial_k\big[t\circ\mathscr{X}^{-1}\big]$ (evaluated at $\mathscr{X}(\cdot)$). Since $(dt)_p\neq0$, some component is nonzero:
      $$\partial_\kappa\big[t\circ\mathscr{X}^{-1}\big]\big(\mathscr{X}(p)\big)\neq0.$$

      Replace the coordinate $\mathscr{X}^\kappa$ by $t|_\mathcal{U}$ and list $t$ first. The transition from $\mathscr{X}$ to the new map has a Jacobian made of three rows of the identity (the coordinates kept) and the row $(\mathtt{t}_0,\dots,\mathtt{t}_3)$; its determinant is $\pm\mathtt{t}_\kappa(p)\neq0$.

      **Inverse function theorem** (a fact of analysis): a smooth map $\mathbb{R}^n\to\mathbb{R}^n$ with nonzero Jacobian determinant at a point is, on a small open set around that point, a bijection onto an open set with smooth inverse. So, on a smaller neighborhood of $p$, the new map is a chart smoothly compatible with $\mathscr{X}$, hence a member of the maximal atlas, and it is stratified.

  - type: order
    id: order-existence
    title: Building a stratified chart
    prompt: |
      In a Newtonian spacetime ($t$ smooth, $(dt)_p\neq0$ at every event), put in order the argument that every event $p$ has a stratified chart around it.
    steps:
      - |
        Take any chart $(\mathcal{U},\mathscr{X})$ around $p$.
      - |
        $(dt)_p\neq0$ gives some $\kappa$ with $\partial_\kappa\big[t\circ\mathscr{X}^{-1}\big]\big(\mathscr{X}(p)\big)\neq0$.
      - |
        Replace $\mathscr{X}^\kappa$ by $t|_\mathcal{U}$, listed as the zeroth coordinate.
      - |
        The transition has Jacobian determinant $\pm\partial_\kappa\big[t\circ\mathscr{X}^{-1}\big]\big(\mathscr{X}(p)\big)\neq0$.
      - |
        Inverse function theorem: near $p$ the new map is a chart of the maximal atlas, with $\mathscr{X}^0 = t$.
    hint: |
      You need a coordinate along which $t$ actually changes before you can swap it for $t$.
    explanation: |
      Without $(dt)_p\neq0$ the argument breaks at the second step: if every $\mathtt{t}_\kappa(p)$ vanished, any swap would give a zero Jacobian determinant and no chart. "Time never stands still" is exactly what makes stratified charts exist.

  - type: numeric
    id: existence-numeric
    title: A swap by hand
    prompt: |
      A 1+1-dimensional spacetime has a chart with coordinates $(x^0,x^1)$ in which the absolute time reads $t = 3x^1 + (x^0)^2$. At the event $p$ with coordinates $(0,0)$ the components of $dt$ are $\mathtt{t}_0 = 2x^0 = 0$ and $\mathtt{t}_1 = 3$, so replace $x^1$ by $t$: the new coordinates are $(t, x^0)$. What is the **absolute value** of the Jacobian determinant of $(x^0,x^1)\mapsto(t,x^0)$ at $p$?
    answer: 3
    wrong:
      - value: 0
        feedback: |
          That is the determinant for $(t,x^1)$, which replaces $x^0$ instead: rows $(0,3)$ and $(0,1)$ give $0$, because $t$ does not change along $x^0$ at $p$. Replace the coordinate whose component $\mathtt{t}_\kappa$ is nonzero.
    hint: |
      Rows: derivatives of $t$ and of $x^0$ with respect to $(x^0,x^1)$, evaluated at $p$.
    explanation: |
      Rows $(\partial t/\partial x^0, \partial t/\partial x^1) = (0,3)$ and $(1,0)$:
      $$\det\begin{pmatrix}0&3\\1&0\end{pmatrix} = -3.$$
      The sign depends on the order of the coordinates; what matters is $|{-3}| = 3 = |\mathtt{t}_1(p)|\neq0$, so $(t,x^0)$ is a stratified chart near $p$.

  - type: text
    id: transition
    title: The time row is frozen
    body: |
      Take two stratified charts $(\mathcal{U},\mathscr{X})$ and $(\mathcal{V},\mathscr{Y})$. Their Jacobian at $p\in\mathcal{U}\cap\mathcal{V}$ is $(\text{ᛞ}_{\mathcal{V}\mathcal{U}})^i_j := (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p$ (first subscript: the chart of the row index $i$).

      Both zeroth coordinates are $t$, so on the overlap $\mathscr{Y}^0 = \mathscr{X}^0$: written in $\mathscr{X}$-coordinates, $y^0$ is just $x^0$. Differentiating,
      $$\frac{\partial\mathscr{Y}^0}{\partial\mathscr{X}^0} = 1,$$
      $$\frac{\partial\mathscr{Y}^0}{\partial\mathscr{X}^\beta} = 0.$$
      Nothing constrains $\partial\mathscr{Y}^\alpha/\partial\mathscr{X}^0$: it is **arbitrary**. Stratified charts agree on **when** an event happens, but their spatial grids may move, rotate or deform in time.

      The Jacobian is block triangular (time row $(1,0,0,0)$), so its determinant is $\det(\partial\mathscr{Y}^\alpha/\partial\mathscr{X}^\beta)$: the $3\times3$ spatial block must be invertible.

  - type: numeric
    id: jacobian-slide
    title: The sliding grid's Jacobian
    prompt: |
      Two stratified charts: $\mathscr{X}$ with coordinates $x^k$ and $\mathscr{Y}$ with $y^0 = x^0$, $y^1 = x^1 - 2x^0$, $y^2 = x^2$, $y^3 = x^3$ (B's grid, sliding at speed 2). What is the Jacobian entry $(\text{ᛞ}_{\mathcal{V}\mathcal{U}})^1_0 = \partial\mathscr{Y}^1/\partial\mathscr{X}^0$?
    answer: -2
    wrong:
      - value: 0
        feedback: |
          Only the time row is frozen ($\partial\mathscr{Y}^0/\partial\mathscr{X}^\beta = 0$). The spatial coordinate $y^1 = x^1 - 2x^0$ depends on $x^0$, so $\partial y^1/\partial x^0\neq0$.
      - value: 2
        feedback: |
          Check the sign: $y^1 = x^1 - 2x^0$, so $\partial y^1/\partial x^0 = -2$. The grid moves at $+2$, so B's labels of a fixed A-point decrease.
    explanation: |
      $\partial(x^1 - 2x^0)/\partial x^0 = -2$. This is one of the arbitrary entries $\partial\mathscr{Y}^\alpha/\partial\mathscr{X}^0$: minus the velocity of the grid.

  - type: numeric
    id: velocity-slide
    title: A resting ball seen by B
    prompt: |
      In a stratified chart $\mathscr{X}$ a ball rests at $x^1 = x^2 = x^3 = 0$; parametrized by $t$, its velocity has components $(v^0,v^1,v^2,v^3) = (1,0,0,0)$. In the stratified chart $\mathscr{Y}$ with $y^1 = x^1 - 2x^0$ (other coordinates copied), its velocity components are $v_\mathscr{Y}^i = (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)\,v^j$. What is $v_\mathscr{Y}^1$?
    answer: -2
    wrong:
      - value: 0
        feedback: |
          A ball at rest for A is not at rest for B: $v_\mathscr{Y}^1 = (\partial y^1/\partial x^0)\cdot1 + (\partial y^1/\partial x^1)\cdot0 = -2$. The arbitrary column $\partial\mathscr{Y}^\alpha/\partial\mathscr{X}^0$ acts on the time component $v^0 = 1$.
      - value: 2
        feedback: |
          B's grid moves at $+2$ along $x^1$, so relative to the grid the ball drifts at $-2$: $v_\mathscr{Y}^1 = (-2)\cdot1 = -2$.
    explanation: |
      $$v_\mathscr{Y}^1 = (-2)\cdot1 + 1\cdot0 = -2,$$
      and $v_\mathscr{Y}^0 = 1\cdot1 = 1$. Directly: on the worldline $y^1 = 0 - 2t$, whose derivative is $-2$.

  - type: mcq
    id: spatial-block
    title: What the grid velocity can touch
    prompt: |
      Between stratified charts the Jacobian has time row $(1,0,0,0)$ and arbitrary entries $\partial\mathscr{Y}^\alpha/\partial\mathscr{X}^0$. A **spatial** vector (one with $(dt)(v) = 0$) has components $v^k$ in $\mathscr{X}$. Which statement holds?
    options:
      - text: '$v^0 = 0$ in every stratified chart, and $v_\mathscr{Y}^\alpha = (\partial\mathscr{Y}^\alpha/\partial\mathscr{X}^\beta)\,v^\beta$'
        correct: true
      - text: '$v^0 = 0$ in $\mathscr{X}$ only; in a moving chart it gains a time component'
        feedback: |
          $v_\mathscr{Y}^0 = (\partial\mathscr{Y}^0/\partial\mathscr{X}^j)v^j = v^0$, since the time row is $(1,0,0,0)$. Being spatial is $(dt)(v) = v^0 = 0$, the same in every stratified chart.
      - text: 'Its spatial components pick up the grid velocity, $(\partial\mathscr{Y}^\alpha/\partial\mathscr{X}^0)$'
        feedback: |
          That column multiplies $v^0$, which is $0$ for a spatial vector. Velocities ($v^0 = 1$) pick up the grid velocity; spatial vectors such as forces do not.
    explanation: |
      $$v_\mathscr{Y}^\alpha = \frac{\partial\mathscr{Y}^\alpha}{\partial\mathscr{X}^0}v^0 + \frac{\partial\mathscr{Y}^\alpha}{\partial\mathscr{X}^\beta}v^\beta,$$
      and $v^0 = 0$ kills the first term. Forces and accelerations (spatial) transform with the $3\times3$ block alone.

  - type: mcq
    id: legit-transition
    title: A legitimate change of grid?
    prompt: |
      $\mathscr{X}$ is a stratified chart with coordinates $x^k$ (so $x^0 = t$). Which formula defines another **stratified** chart $(y^0,\dots,y^3)$ on the same domain?
    options:
      - text: '$y^0 = x^0$, $y^1 = x^1\cos x^0 + x^2\sin x^0$, $y^2 = -x^1\sin x^0 + x^2\cos x^0$, $y^3 = x^3$'
        correct: true
      - text: '$y^0 = x^0 + 5$, $y^\alpha = x^\alpha$'
        feedback: |
          A valid chart with the right slices, but $y^0 = t + 5\neq t$. Stratified means $\mathscr{Y}^0 = t$ exactly, so the time row of the Jacobian is $(1,0,0,0)$ and the values agree too.
      - text: '$y^0 = x^0$, $y^1 = x^0$, $y^2 = x^2$, $y^3 = x^3$'
        feedback: |
          The time row is right, but the spatial block $\partial y^\alpha/\partial x^\beta$ has a zero row ($y^1$ ignores $x^1,x^2,x^3$), so the determinant is $0$: this is not a chart.
      - text: '$y^0 = x^0 + x^1$, $y^\alpha = x^\alpha$'
        feedback: |
          Here $\partial y^0/\partial x^1 = 1\neq0$: the time row is not $(1,0,0,0)$, and $y^0$ is not $t$.
    explanation: |
      The rotating grid keeps $y^0 = t$, and its spatial block is a rotation (determinant $1$). The angle $x^0$ makes $\partial y^\alpha/\partial x^0\neq0$, which is allowed.

  - type: text
    id: summary
    body: |
      **Next:** the three observers agree on **when**, but do they agree on which paths are free? Uniform flow, $\nabla dt = 0$, kills the connection coefficients with an upper time index in a stratified chart, and a grid that accelerates brings back the others as pseudo-forces. That is the lesson Stratified Atlases · Part 2.
