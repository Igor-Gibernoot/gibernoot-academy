id: ch09-point-mass
title: "Guided Problem: A Point Mass in Newton-Cartan Theory"
kind: guided

cards:
  - type: text
    id: hook
    title: One mass, the whole machine
    body: |
      A single point mass is the simplest gravitating system, and the one Newton solved first: orbits, falls, tides. Newton-Cartan theory rewrites gravity as a connection on spacetime. Does the rewritten theory still reproduce Kepler's orbits and the familiar fall into a star? And what does it add?

      This lesson runs the whole chain on one point mass, step by step, with $G_NM = 8$ throughout:
      1. the connection coefficients everywhere;
      2. the full curvature, also off the axes;
      3. the vacuum equation, $\mathrm{Ric}_{00} = 0$;
      4. a circular orbit and Kepler's third law;
      5. the same orbit in a co-rotating chart;
      6. a radial fall into the mass;
      7. the chart falling with that body, and the tides it feels.

  - type: text
    id: setup
    title: The setting
    body: |
      Recall the **sources chart** $(\mathcal{U},\mathscr{X})$: a stratified chart ($x^0 = t$, absolute time), cartesian, non-rotating, at rest relative to the masses, with coordinates $x^i$ (Latin $i\in\{0,1,2,3\}$, Greek $\alpha,\beta\in\{1,2,3\}$, summed by Einstein's convention when repeated). In it, gravity with potential $\phi$ gives the only nonzero coefficients
      $$\Gamma^\alpha_{00} = \partial_\alpha\phi,$$
      with $\partial_\alpha\phi := \partial x_\alpha\lfloor\phi\rceil$. The curvature and the Ricci tensor then are
      $$\mathrm{Riem}^\alpha_{0\beta0} = \partial_\beta\partial_\alpha\phi,$$
      $$\mathrm{Ric}_{00} = \Delta\phi = 4\pi G_N\rho,$$
      with $\Delta\phi := \sum_\alpha\partial_\alpha\partial_\alpha\phi$ and $\rho$ the mass density.

      A **point mass** $M$ sits at the spatial origin. Write $|x| := \sqrt{\sum_\beta(x^\beta)^2}$ for the distance to it. Its potential is
      $$\phi = -\frac{G_NM}{|x|}.$$

  - type: mcq
    id: why-remove
    tag: Step 1 · The connection
    title: Where do we work?
    prompt: |
      A point mass $M$ sits at the spatial origin of the sources chart, with potential $\phi = -G_NM/|x|$, where $|x| := \sqrt{\sum_\beta(x^\beta)^2}$. The connection is $\Gamma^\alpha_{00} = \partial_\alpha\phi$. On which set of spacetime $\mathcal{M}$ is this a smooth connection?
    options:
      - text: '$\mathcal{M}$ minus the worldline of the mass: the events with $(x^1,x^2,x^3)\neq(0,0,0)$, at every time'
        correct: true
      - text: '$\mathcal{M}$ minus the single event at the origin at $t = 0$'
        feedback: |
          The mass does not exist for one instant only: it sits at the spatial origin at every time. At each time $t$, $\phi$ blows up at $|x| = 0$, so a whole line of events (the mass's worldline) must go.
      - text: 'All of $\mathcal{M}$: the mass is just a source, the connection is fine everywhere'
        feedback: |
          At $|x| = 0$ the potential $-G_NM/|x|$ is not even defined, and $\Gamma^\alpha_{00} = \partial_\alpha\phi$ grows without bound as $|x|\to0$. No smooth connection on $\mathcal{M}$ has these coefficients.
    explanation: |
      We work on
      $$\mathcal{U} := \{p\in\mathcal{M}\mid |x(p)|\neq0\},$$
      spacetime with the mass's worldline removed. There is no matter on $\mathcal{U}$: the mass sits exactly on what was removed. So $\rho = 0$ on $\mathcal{U}$, which Step 3 will check against the curvature.

  - type: build
    id: build-gamma
    tag: Step 1 · The connection
    title: The pull of a point mass
    prompt: |
      Point mass at the spatial origin, potential $\phi = -G_NM\,|x|^{-1}$ with $|x| := \sqrt{\sum_\beta(x^\beta)^2}$. By the chain rule, $\partial_\alpha|x| = x^\alpha/|x|$. Build the connection coefficient $\Gamma^\alpha_{00} = \partial_\alpha\phi$.
    prefix: '\Gamma^\alpha_{00} ='
    tiles: ['G_NM', 'x^\alpha', '/|x|^3', '/|x|^2', '-']
    answers:
      - ['G_NM', 'x^\alpha', '/|x|^3']
    wrong:
      - answer: ['G_NM', 'x^\alpha', '/|x|^2']
        feedback: |
          The size of the pull is $G_NM/|x|^2$, but the vector $x^\alpha$ has length $|x|$, not $1$. To get the right size, divide once more by $|x|$: $G_NM\,x^\alpha/|x|^3$ has length $G_NM/|x|^2$.
      - answer: ['-', 'G_NM', 'x^\alpha', '/|x|^3']
        feedback: |
          The minus of $\phi$ cancels against the minus of $\frac{d}{du}u^{-1} = -u^{-2}$: $\partial_\alpha(-G_NM|x|^{-1}) = +G_NM|x|^{-2}\,\partial_\alpha|x|$.
    hint: |
      $\partial_\alpha\big(|x|^{-1}\big) = -|x|^{-2}\,\partial_\alpha|x|$.
    explanation: |
      $$\begin{aligned}\partial_\alpha\phi &= -G_NM\,\big(-|x|^{-2}\big)\,\frac{x^\alpha}{|x|}\\ &= \frac{G_NM\,x^\alpha}{|x|^3}.\end{aligned}$$
      Its length is $G_NM/|x|^2$, Newton's inverse square law. All other $\Gamma^i_{jk}$ are $0$.

  - type: numeric
    id: gamma-below
    tag: Step 1 · The connection
    title: A particle below the mass
    prompt: |
      Point mass at the spatial origin with $G_NM = 8$, so that in the sources chart $\Gamma^\alpha_{00} = G_NM\,x^\alpha/|x|^3$ (all other coefficients zero). A free particle is momentarily at rest at $x = (0, 0, -2)$. Newton I gives $\ddot\gamma^\alpha_\mathcal{U} = -\Gamma^\alpha_{00}$ for its coordinates $\gamma^\alpha_\mathcal{U}$. What is its acceleration $\ddot\gamma^3_\mathcal{U}$?
    answer: 2
    wrong:
      - value: -2
        feedback: |
          $-2$ is $\Gamma^3_{00} = 8\cdot(-2)/2^3$ itself. The acceleration is minus the coefficient: $\ddot\gamma^3_\mathcal{U} = +2$, upward, toward the mass above.
      - value: 4
        feedback: |
          $4 = 8/2^1$ divides by $|x|$ once instead of three times. With $x^3 = -2$ and $|x| = 2$: $\Gamma^3_{00} = 8\cdot(-2)/8 = -2$.
    explanation: |
      $\Gamma^3_{00} = 8\cdot(-2)/2^3 = -2$, so $\ddot\gamma^3_\mathcal{U} = +2$: the particle is pulled up toward the mass, with magnitude $G_NM/|x|^2 = 8/4 = 2$. The sign of $x^\alpha$ makes the pull point to the origin from every side.

  - type: text
    id: riem-plan
    tag: Step 2 · Curvature everywhere
    title: Differentiate once more
    body: |
      The curvature of this connection is the matrix of second derivatives of $\phi$ (its **Hessian**):
      $$\mathrm{Riem}^\alpha_{0\beta0} = \partial_\beta\Gamma^\alpha_{00} = \partial_\beta\partial_\alpha\phi.$$
      Earlier we only computed it on the $x^1$ axis. Now we want it at every point of $\mathcal{U}$, so we differentiate
      $$\Gamma^\alpha_{00} = G_NM\,x^\alpha\,|x|^{-3}$$
      with respect to $x^\beta$. Both factors depend on $x^\beta$. Write $\delta_{\alpha\beta}$ for the Kronecker delta ($1$ if $\alpha = \beta$, else $0$), so that $\partial_\beta x^\alpha = \delta_{\alpha\beta}$.

  - type: mcq
    id: hessian
    tag: Step 2 · Curvature everywhere
    title: The full curvature
    prompt: |
      Point mass at the origin, $\Gamma^\alpha_{00} = G_NM\,x^\alpha\,|x|^{-3}$ with $|x| := \sqrt{\sum_\beta(x^\beta)^2}$, $\partial_\beta|x| = x^\beta/|x|$ and $\partial_\beta x^\alpha = \delta_{\alpha\beta}$ (Kronecker delta). Which is $\mathrm{Riem}^\alpha_{0\beta0} = \partial_\beta\Gamma^\alpha_{00}$?
    options:
      - text: '$G_NM\Big(\dfrac{\delta_{\alpha\beta}}{|x|^3} - \dfrac{3x^\alpha x^\beta}{|x|^5}\Big)$'
        correct: true
      - text: '$-\dfrac{3G_NM\,x^\alpha x^\beta}{|x|^5}$'
        feedback: |
          This differentiates only $|x|^{-3}$ and treats $x^\alpha$ as a constant. But $x^\alpha$ depends on $x^\beta$ too: the product rule adds $G_NM\,\delta_{\alpha\beta}/|x|^3$. Without it, the matrix would be $0$ on the axes away from the radial direction, and the squeezing across the line to the mass would be lost.
      - text: '$G_NM\Big(\dfrac{\delta_{\alpha\beta}}{|x|^3} - \dfrac{3x^\alpha x^\beta}{|x|^4}\Big)$'
        feedback: |
          The chain rule on $|x|^{-3}$ gives $-3|x|^{-4}\,\partial_\beta|x|$, and $\partial_\beta|x| = x^\beta/|x|$ brings one more $|x|$ into the denominator: $|x|^{-5}$. A quick check: both terms must have the same units, length$^{-3}$.
      - text: '$G_NM\Big(\dfrac{\delta_{\alpha\beta}}{|x|^3} - \dfrac{x^\alpha x^\beta}{|x|^5}\Big)$'
        feedback: |
          The exponent $-3$ of $|x|^{-3}$ comes down as a factor: $\partial_\beta|x|^{-3} = -3|x|^{-4}\,x^\beta/|x|$. Without the $3$ the trace would not vanish, and vacuum would not be vacuum.
    explanation: |
      Product rule:
      $$\begin{aligned}\partial_\beta\Gamma^\alpha_{00} &= G_NM\big(\delta_{\alpha\beta}|x|^{-3}\\ &\quad - 3x^\alpha|x|^{-4}\tfrac{x^\beta}{|x|}\big)\\ &= \frac{G_NM}{|x|^5}\big(|x|^2\delta_{\alpha\beta} - 3x^\alpha x^\beta\big).\end{aligned}$$
      It is symmetric in $\alpha$ and $\beta$, as second derivatives must be.

  - type: mcq
    id: other-axis
    tag: Step 2 · Curvature everywhere
    title: On another axis
    prompt: |
      Point mass at the origin with $G_NM = 8$, curvature
      $$\mathrm{Riem}^\alpha_{0\beta0} = \frac{G_NM}{|x|^5}\big(|x|^2\delta_{\alpha\beta} - 3x^\alpha x^\beta\big).$$
      On the $x^1$ axis at $(2,0,0)$ the diagonal $(\mathrm{Riem}^1_{010}, \mathrm{Riem}^2_{020}, \mathrm{Riem}^3_{030})$ is $(-2, 1, 1)$, all off-diagonal entries zero. What is the diagonal at $(0, 2, 0)$?
    options:
      - text: '$(1, -2, 1)$'
        correct: true
      - text: '$(-2, 1, 1)$'
        feedback: |
          The $-2$ belongs to the direction **toward the mass**, not to the first axis. At $(0,2,0)$ only $x^2\neq0$, so the term $-3x^\alpha x^\beta$ only hits $\alpha = \beta = 2$.
      - text: '$(-2, -2, 1)$'
        feedback: |
          At $(0,2,0)$, $x^1 = 0$, so $-3x^1x^1 = 0$ and $\mathrm{Riem}^1_{010} = 8\cdot4/32 = 1$: no stretching along $x^1$, which is now a transverse direction.
    explanation: |
      $|x| = 2$, $G_NM/|x|^5 = 8/32 = \tfrac14$. Diagonal: $\tfrac14(4 - 0) = 1$, $\tfrac14(4 - 12) = -2$, $\tfrac14(4 - 0) = 1$. The pattern is the same as on the $x^1$ axis, rotated: $-2G_NM/r^3$ along the line to the mass (stretch), $+G_NM/r^3$ across it (squeeze), with $r = |x|$.

  - type: text
    id: off-axis
    tag: Step 2 · Curvature everywhere
    title: Off the axes
    body: |
      Now a point that lies on no axis: the event at
      $$x = (\sqrt2, \sqrt2, 0),$$
      at distance $|x| = \sqrt{2 + 2} = 2$ from the mass, on the diagonal between the $x^1$ and $x^2$ axes. With $G_NM = 8$ the prefactor is again $G_NM/|x|^5 = \tfrac14$, and $|x|^2 = 4$. On an axis the curvature matrix was diagonal. Here $x^1x^2 = 2\neq0$.

  - type: numeric
    id: mixed
    tag: Step 2 · Curvature everywhere
    title: A mixed component
    prompt: |
      Point mass at the origin with $G_NM = 8$, curvature
      $$\mathrm{Riem}^\alpha_{0\beta0} = \frac{G_NM}{|x|^5}\big(|x|^2\delta_{\alpha\beta} - 3x^\alpha x^\beta\big).$$
      What is the mixed component $\mathrm{Riem}^1_{020}$ at $x = (\sqrt2, \sqrt2, 0)$?
    answer: -1.5
    wrong:
      - value: 0
        feedback: |
          Zero holds on the axes, where $x^1x^2 = 0$. Here $x^1x^2 = 2$ and $\delta_{12} = 0$, so only the second term survives: $\tfrac14(-3\cdot2)$.
      - value: -6
        feedback: |
          $-6 = -3x^1x^2$ is missing the prefactor $G_NM/|x|^5 = 8/32 = \tfrac14$.
      - value: 2.5
        feedback: |
          The Kronecker delta $\delta_{12}$ is $0$, not $1$: the term $|x|^2\delta_{\alpha\beta}$ only lives on the diagonal.
    explanation: |
      $$\begin{aligned}\mathrm{Riem}^1_{020} &= \tfrac14\big(4\cdot0 - 3\sqrt2\sqrt2\big)\\ &= -1.5.\end{aligned}$$
      Off the axes the tidal matrix is not diagonal in the sources chart: a displacement along $x^2$ produces a tidal acceleration along $x^1$.

  - type: numeric
    id: diag-off
    tag: Step 2 · Curvature everywhere
    title: A diagonal component
    prompt: |
      Point mass at the origin with $G_NM = 8$, curvature
      $$\mathrm{Riem}^\alpha_{0\beta0} = \frac{G_NM}{|x|^5}\big(|x|^2\delta_{\alpha\beta} - 3x^\alpha x^\beta\big).$$
      What is $\mathrm{Riem}^1_{010}$ at $x = (\sqrt2, \sqrt2, 0)$, where $|x| = 2$?
    answer: -0.5
    wrong:
      - value: -2
        feedback: |
          $-2$ is the value on the $x^1$ axis, where the whole stretch lies along $x^1$. Here the line to the mass is the diagonal, and $x^1$ only partly points along it: $\tfrac14(4 - 3\cdot2) = -0.5$.
      - value: 1
        feedback: |
          $1$ would be right if $x^1 = 0$. Here $x^1x^1 = 2$, so subtract $3\cdot2 = 6$ from $|x|^2 = 4$.
    explanation: |
      $\tfrac14(4 - 6) = -0.5$, and $\mathrm{Riem}^2_{020} = -0.5$ too, $\mathrm{Riem}^3_{030} = \tfrac14\cdot4 = 1$. So at $(\sqrt2,\sqrt2,0)$ the matrix is
      $$\begin{pmatrix}-0.5 & -1.5 & 0\\ -1.5 & -0.5 & 0\\ 0 & 0 & 1\end{pmatrix}.$$

  - type: mcq
    id: radial-direction
    tag: Step 2 · Curvature everywhere
    title: Same tides, rotated
    prompt: |
      Point mass at the origin, $G_NM = 8$. At $x = (\sqrt2,\sqrt2,0)$, distance $2$, the curvature matrix $R := (\mathrm{Riem}^\alpha_{0\beta0})$ is
      $$R = \begin{pmatrix}-0.5 & -1.5 & 0\\ -1.5 & -0.5 & 0\\ 0 & 0 & 1\end{pmatrix}.$$
      Multiply it by the direction to the mass, $(1,1,0)$, and by the transverse direction $(1,-1,0)$. What do you find?
    options:
      - text: '$R(1,1,0) = -2\,(1,1,0)$ and $R(1,-1,0) = 1\,(1,-1,0)$'
        correct: true
      - text: '$R(1,1,0) = (-0.5,-0.5,0)$ and $R(1,-1,0) = (-0.5,0.5,0)$'
        feedback: |
          This keeps only the diagonal. Row one times $(1,1,0)$ is $-0.5 - 1.5 = -2$, not $-0.5$: the mixed entries $-1.5$ count.
      - text: '$R(1,1,0) = 1\,(1,1,0)$ and $R(1,-1,0) = -2\,(1,-1,0)$'
        feedback: |
          Rows times $(1,1,0)$: $-0.5 - 1.5 = -2$; times $(1,-1,0)$: $-0.5 + 1.5 = 1$. The $-2$, the stretch, belongs to the direction toward the mass.
    explanation: |
      Both are eigenvectors: $-2 = -2G_NM/r^3$ along the line to the mass and $+1 = G_NM/r^3$ across it, with $r = 2$. The off-axis matrix is the on-axis one $\mathrm{diag}(-2,1,1)$ seen in rotated axes. The mixed entries only say that the line to the mass is not a coordinate axis. Tides depend on the distance and the direction to the mass, nothing else.

  - type: order
    id: trace-zero
    tag: Step 3 · Vacuum
    title: The trace cancels
    prompt: |
      Point mass at the origin, curvature
      $$\mathrm{Riem}^\alpha_{0\beta0} = G_NM\Big(\frac{\delta_{\alpha\beta}}{|x|^3} - \frac{3x^\alpha x^\beta}{|x|^5}\Big).$$
      Put the computation of $\mathrm{Ric}_{00} = \mathrm{Riem}^\alpha_{0\alpha0}$ in order.
    steps:
      - 'Set $\beta = \alpha$ and sum over $\alpha$: $\mathrm{Ric}_{00} = \sum_\alpha\partial_\alpha\partial_\alpha\phi = \Delta\phi$.'
      - 'The first term gives $G_NM\sum_\alpha\delta_{\alpha\alpha}/|x|^3 = 3G_NM/|x|^3$, the second $-3G_NM\sum_\alpha(x^\alpha)^2/|x|^5$.'
      - 'Since $\sum_\alpha(x^\alpha)^2 = |x|^2$, the second term is $-3G_NM/|x|^3$.'
      - 'The two cancel: $\mathrm{Ric}_{00} = 0$ at every point of $\mathcal{U}$.'
    explanation: |
      $$\begin{aligned}\mathrm{Ric}_{00} &= \frac{3G_NM}{|x|^3} - \frac{3G_NM|x|^2}{|x|^5}\\ &= 0.\end{aligned}$$
      Check at $(\sqrt2,\sqrt2,0)$: $-0.5 - 0.5 + 1 = 0$; on the axis, $-2 + 1 + 1 = 0$.

  - type: mcq
    id: vacuum-meaning
    tag: Step 3 · Vacuum
    title: Curved but empty
    prompt: |
      For a point mass, on $\mathcal{U}$ (spacetime minus the mass's worldline) the curvature $\mathrm{Riem}^\alpha_{0\beta0}$ is nonzero, while $\mathrm{Ric}_{00} = \Delta\phi = 0$. Recall the field equation $\mathrm{Ric}_{00} = 4\pi G_N\rho$. What does this say?
    options:
      - text: 'There is no matter on $\mathcal{U}$, yet spacetime is curved there: vacuum with tides'
        correct: true
      - text: 'There is no gravity on $\mathcal{U}$, since the field equation has zero source'
        feedback: |
          Zero source means $\mathrm{Ric}_{00} = 0$, the trace only. The curvature itself, which is what produces tides and makes free particles near each other drift apart, is not zero. The field equation fixes only the trace; the rest is set by the boundary conditions and the sources elsewhere, here the mass on the removed line.
      - text: 'The computation must be wrong: a mass is present, so $\rho\neq0$'
        feedback: |
          The mass sits at $|x| = 0$, on the worldline we removed. At every point of $\mathcal{U}$ the density is $0$, and the field equation holds there with $\rho = 0$.
    explanation: |
      $\rho = 0$ on $\mathcal{U}$, consistent with $\mathrm{Ric}_{00} = 0$. The curvature $\mathrm{diag}(-2,1,1)\,G_NM/r^3$ (in axes aligned with the line to the mass) has zero trace: it changes the shape of a small cloud of free particles, not its volume.

  - type: text
    id: orbit-setup
    tag: Step 4 · A circular orbit
    title: A body on a circle
    body: |
      Now some motion. A body of mass $m$ moves on a circle of radius $r_0$ around the mass with angular velocity $\omega$. Its coordinates in the sources chart are
      $$\gamma_\mathcal{U}(t) = r_0\,(\cos\omega t, \sin\omega t, 0).$$
      Recall Newton II in a stratified chart (with $\dot\gamma^0_\mathcal{U} = 1$): $m(\ddot\gamma^\alpha_\mathcal{U} + \Gamma^\alpha_{00}) = f^\alpha_\mathcal{U}$, with $f^\alpha_\mathcal{U}$ the components of the force. Here $|\gamma_\mathcal{U}| = r_0$ and
      $$\ddot\gamma^\alpha_\mathcal{U} = -\omega^2\gamma^\alpha_\mathcal{U}.$$
      Without gravity, a string would supply the inward force. Is a string still needed?

  - type: mcq
    id: orbit-force
    tag: Step 4 · A circular orbit
    title: What holds it on the circle?
    prompt: |
      Point mass at the origin, $\Gamma^\alpha_{00} = G_NM\,x^\alpha/|x|^3$ in the sources chart. A body of mass $m$ moves on $\gamma_\mathcal{U}(t) = r_0(\cos\omega t, \sin\omega t, 0)$, so $\ddot\gamma^\alpha_\mathcal{U} = -\omega^2\gamma^\alpha_\mathcal{U}$. Newton II reads $m(\ddot\gamma^\alpha_\mathcal{U} + \Gamma^\alpha_{00}) = f^\alpha_\mathcal{U}$. Which force does the motion need?
    options:
      - text: '$f^\alpha_\mathcal{U} = m\Big(\dfrac{G_NM}{r_0^3} - \omega^2\Big)\gamma^\alpha_\mathcal{U}$'
        correct: true
      - text: '$f^\alpha_\mathcal{U} = -m\,\omega^2\,\gamma^\alpha_\mathcal{U}$'
        feedback: |
          That is the string of the case without gravity, where $\Gamma = 0$. With the mass present, $m\Gamma^\alpha_{00} = mG_NM\gamma^\alpha_\mathcal{U}/r_0^3$ is part of the left side and supplies (some of) the inward acceleration.
      - text: '$f^\alpha_\mathcal{U} = -m\Big(\dfrac{G_NM}{r_0^3} + \omega^2\Big)\gamma^\alpha_\mathcal{U}$'
        feedback: |
          This adds the pull to the string instead of letting it replace the string. $\Gamma^\alpha_{00}$ enters with a plus sign next to $\ddot\gamma^\alpha_\mathcal{U}$: $m(-\omega^2 + G_NM/r_0^3)\gamma^\alpha_\mathcal{U}$.
    explanation: |
      $$\begin{aligned}f^\alpha_\mathcal{U} &= m\Big(-\omega^2 + \frac{G_NM}{r_0^3}\Big)\gamma^\alpha_\mathcal{U}.\end{aligned}$$
      It vanishes, and the body is **free** (an autoparallel), exactly when
      $$\omega^2 = \frac{G_NM}{r_0^3},$$
      **Kepler's third law** for circular orbits: the square of the period $2\pi/\omega$ is proportional to $r_0^3$.

  - type: numeric
    id: omega
    tag: Step 4 · A circular orbit
    title: The running orbit
    prompt: |
      Point mass with $G_NM = 8$. A free body (no force) moves on a circle of radius $r_0 = 2$ around it, at angular velocity $\omega>0$. Kepler's third law, from Newton II with $\Gamma^\alpha_{00} = G_NM\,x^\alpha/|x|^3$, reads $\omega^2 = G_NM/r_0^3$. What is $\omega$?
    answer: 1
    wrong:
      - value: 2
        feedback: |
          $2 = \sqrt{G_NM/r_0}$ uses $r_0$ instead of $r_0^3$. The pull per unit mass $G_NM/r_0^2 = 2$ must equal $\omega^2r_0 = 2\omega^2$.
      - value: 4
        feedback: |
          $4 = G_NM/r_0$: the cube is missing, and the square root too.
    explanation: |
      $\omega^2 = 8/2^3 = 1$, so $\omega = 1$ and the period is $2\pi$. From now on the orbit $\gamma$ runs at $r_0 = 2$, $\omega = 1$.

  - type: text
    id: corotating
    tag: Step 5 · The co-rotating chart
    title: Ride with the orbit
    body: |
      Recall the chart $(\mathcal{V},\mathscr{Y})$ whose axes rotate at $\omega$ about the $x^3$ axis, with coordinates $y^i$: $y^0 = t$ and
      $$\begin{aligned}y^1 &= x^1\cos\omega t + x^2\sin\omega t,\\ y^2 &= -x^1\sin\omega t + x^2\cos\omega t,\end{aligned}$$
      $y^3 = x^3$. Without gravity it has $\Gamma^1_{02} = -\omega$, $\Gamma^2_{01} = \omega$ (Coriolis) and $\Gamma^\alpha_{00} = -\omega^2y^\alpha$ for $\alpha = 1,2$ (centrifugal).

      With gravity, the transformation law adds one more term to $\Gamma^\alpha_{00}$: the spatial Jacobian is a rotation, which turns $x$ into $y$ and keeps $|y| = |x|$. So gravity keeps its form, $G_NM\,y^\alpha/|y|^3$. For $\alpha = 1, 2$:
      $$(\Gamma_\mathscr{Y})^\alpha_{00} = \Big(\frac{G_NM}{|y|^3} - \omega^2\Big)y^\alpha.$$

  - type: mcq
    id: orbit-at-rest
    tag: Step 5 · The co-rotating chart
    title: The orbit stands still
    prompt: |
      Point mass with $G_NM = 8$, circular orbit of radius $r_0 = 2$ at $\omega = 1$. In the chart co-rotating at $\omega$, the orbiting body sits at rest at $y = (2, 0, 0)$, and $(\Gamma_\mathscr{Y})^\alpha_{00} = (G_NM/|y|^3 - \omega^2)\,y^\alpha$ for $\alpha = 1,2$. Why does Newton II give zero force on it?
    options:
      - text: 'The centrifugal term $\omega^2r_0 = 2$ outward balances the pull $G_NM/r_0^2 = 2$ inward; the Coriolis term vanishes at rest'
        correct: true
      - text: 'In a rotating chart there is no gravity: only Coriolis and centrifugal terms appear'
        feedback: |
          Gravity is still there: rotating the axes turns $G_NM\,x^\alpha/|x|^3$ into $G_NM\,y^\alpha/|y|^3$, the same pull. It is cancelled by the centrifugal term, not removed.
      - text: 'The Coriolis term balances the pull'
        feedback: |
          The Coriolis term is proportional to the velocity $\dot\gamma^\beta_\mathcal{V}$, which is zero for a body at rest in this chart. Only $(\Gamma_\mathscr{Y})^\alpha_{00}$ acts on it.
    explanation: |
      $(\Gamma_\mathscr{Y})^1_{00} = (8/8 - 1)\cdot2 = 0$. In fact $(\Gamma_\mathscr{Y})^\alpha_{00}$ vanishes on the whole circle $|y| = r_0$, $y^3 = 0$: every point of it is a free circular orbit at rest in this chart. Gravity plays the role the string played without gravity.

  - type: numeric
    id: corot-outside
    tag: Step 5 · The co-rotating chart
    title: Farther out
    prompt: |
      Point mass with $G_NM = 8$, chart co-rotating at $\omega = 1$, where for $\alpha = 1,2$
      $$(\Gamma_\mathscr{Y})^\alpha_{00} = \Big(\frac{G_NM}{|y|^3} - \omega^2\Big)y^\alpha.$$
      A free particle is momentarily at rest in this chart at $y = (4, 0, 0)$, so Newton I gives $\ddot\gamma^1_\mathcal{V} = -(\Gamma_\mathscr{Y})^1_{00}$ (the Coriolis term vanishes at rest). What is $\ddot\gamma^1_\mathcal{V}$?
    answer: 3.5
    wrong:
      - value: -3.5
        feedback: |
          $-3.5$ is the coefficient $(8/64 - 1)\cdot4$ itself. The acceleration is minus it: $+3.5$, outward.
      - value: 0
        feedback: |
          Zero holds only on the circle $|y| = 2$, where Kepler's law matches $\omega = 1$. At radius $4$ the pull $8/16 = 0.5$ is much weaker than the centrifugal $\omega^2\cdot4 = 4$.
      - value: -0.5
        feedback: |
          $-0.5$ is the pull alone. In the rotating chart the centrifugal term $+\omega^2y^1 = +4$ acts too: $4 - 0.5 = 3.5$.
    explanation: |
      $(\Gamma_\mathscr{Y})^1_{00} = (8/64 - 1)\cdot4 = -3.5$, so the particle accelerates outward at $3.5$ in this chart. Seen from the sources chart: it moves at speed $\omega\cdot4 = 4$ on a circle of radius $4$, faster than the orbital speed there, so it flies outward.

  - type: text
    id: fall-setup
    tag: Step 6 · Radial fall
    title: Dropped from twice the radius
    body: |
      A second body $\zeta$ is released from rest at $t = 0$ at twice the orbital radius, $x = (2r_0, 0, 0) = (4, 0, 0)$, and falls straight toward the mass. Its coordinates in the sources chart are
      $$\zeta_\mathcal{U}(t) = \big(t, r(t), 0, 0\big),$$
      with $r(0) = 4$, $\dot r(0) = 0$, and $|\zeta_\mathcal{U}| = r$ while $r>0$. It is free: Newton II with zero force.

  - type: mcq
    id: fall-equation
    tag: Step 6 · Radial fall
    title: The equation of the fall
    prompt: |
      Point mass at the origin, $\Gamma^\alpha_{00} = G_NM\,x^\alpha/|x|^3$. A free body has coordinates $(t, r(t), 0, 0)$ in the sources chart, with $r>0$. Newton I reads $\ddot\zeta^\alpha_\mathcal{U} + \Gamma^\alpha_{00} = 0$. What does it give?
    options:
      - text: '$\ddot r = -G_NM/r^2$, and the other two components hold automatically'
        correct: true
      - text: '$\ddot r = -G_NM/r^3$'
        feedback: |
          $\Gamma^1_{00} = G_NM\,x^1/|x|^3$ at $x = (r,0,0)$ is $G_NMr/r^3 = G_NM/r^2$. The $r$ of $x^1$ cancels one power of $|x|^3$.
      - text: '$\ddot r = -G_NM/r^2$, but the motion also needs $\ddot\zeta^2_\mathcal{U} = -G_NM/r^2$, so it cannot stay on the axis'
        feedback: |
          On the axis $x^2 = x^3 = 0$, so $\Gamma^2_{00} = \Gamma^3_{00} = 0$: the pull has no sideways component, and $\ddot\zeta^2_\mathcal{U} = \ddot\zeta^3_\mathcal{U} = 0$ is exactly what a body starting at rest on the axis needs.
    explanation: |
      Component $1$: $\ddot r + G_NM\,r/r^3 = 0$, i.e. $\ddot r = -G_NM/r^2$. Components $2, 3$: $0 + 0 = 0$. So $\zeta$ is free by construction.

  - type: numeric
    id: fall-speed
    tag: Step 6 · Radial fall
    title: Speed halfway down
    prompt: |
      A body falls from rest at $r = 4$ toward a point mass with $G_NM = 8$, obeying $\ddot r = -G_NM/r^2$. Multiplying by $\dot r$ gives
      $$\frac{d}{dt}\Big(\tfrac12\dot r^2 - \frac{G_NM}{r}\Big) = 0,$$
      so $\tfrac12\dot r^2 - G_NM/r$ keeps its initial value. What is its speed $|\dot r|$ when it reaches $r = 2$?
    answer: 2
    wrong:
      - value: 2.8284
        feedback: |
          $\sqrt8$ comes from $\tfrac12\dot r^2 = G_NM/r$, which assumes the constant is $0$, a fall from infinitely far. Here the start at rest at $r = 4$ fixes it to $-8/4 = -2$: $\tfrac12\dot r^2 = 4 - 2$.
      - value: 4
        feedback: |
          $4$ is $\dot r^2$. The speed is its square root.
    explanation: |
      Initially $\tfrac12\cdot0 - 8/4 = -2$. At $r = 2$: $\tfrac12\dot r^2 = 8/2 - 2 = 2$, so $\dot r^2 = 4$ and $\dot r = -2$ (falling). In general
      $$\dot r^2 = \frac{2G_NM}{r} - \frac{G_NM}{r_0}.$$

  - type: text
    id: fall-solution
    tag: Step 6 · Radial fall
    title: Time as a function of distance
    body: |
      The fall $r(t)$ cannot be written with elementary functions, but its inverse can. With $x := r/(2r_0)\in(0,1]$ (the fraction of the starting distance) and $\omega^2 = G_NM/r_0^3$, for $t\geq0$:
      $$t(r) = \frac{2}{\omega}\Big(\sqrt{x(1-x)} + \arccos\sqrt x\Big).$$
      **Check.** Differentiating,
      $$\frac{dt}{dr} = -\frac{1}{\omega r_0}\sqrt{\frac{x}{1-x}},$$
      so $\dot r = (dt/dr)^{-1}$ gives
      $$\begin{aligned}\dot r^2 &= \omega^2r_0^2\Big(\frac{2r_0}{r} - 1\Big)\\ &= \frac{2G_NM}{r} - \frac{G_NM}{r_0},\end{aligned}$$
      the energy law, and $\ddot r = \tfrac12\,d(\dot r^2)/dr = -G_NM/r^2$. At $x = 1$: $t = 0$ and $\dot r = 0$, the initial conditions.

  - type: numeric
    id: fall-time-half
    tag: Step 6 · Radial fall
    title: When is it halfway?
    prompt: |
      A body falls from rest at $r = 4$ toward a point mass with $G_NM = 8$ (so $r_0 = 2$, $\omega = 1$). For $t\geq0$, with $x := r/4$,
      $$t(r) = 2\Big(\sqrt{x(1-x)} + \arccos\sqrt x\Big).$$
      At what time does it reach $r = 2$? (Decimals are fine.)
    answer: 2.5708
    tolerance: 0.002
    answerText: '$1 + \pi/2\approx2.571$'
    wrong:
      - value: 1.5708
        feedback: |
          That is only the $\arccos$ part times $2$. At $x = \tfrac12$, also $\sqrt{x(1-x)} = \tfrac12$, which contributes $2\cdot\tfrac12 = 1$.
      - value: 1.7854
        feedback: |
          This forgets the factor $2/\omega = 2$ in front of one term. Both terms are multiplied: $2(\tfrac12 + \tfrac\pi4)$.
    hint: |
      $\arccos\sqrt{1/2} = \arccos(1/\sqrt2) = \pi/4$.
    explanation: |
      $$\begin{aligned}t &= 2\big(\tfrac12 + \tfrac\pi4\big)\\ &= 1 + \tfrac\pi2\approx2.571.\end{aligned}$$
      A numerical integration of $\ddot r = -8/r^2$ confirms $r = 2$, $\dot r = -2$ at that time. The fall is slow at first: most of the time is spent on the first half of the way.

  - type: mcq
    id: fall-time-total
    tag: Step 6 · Radial fall
    title: Reaching the source
    prompt: |
      A body falls from rest at $r = 2r_0$ toward a point mass, $t(r) = \frac{2}{\omega}\big(\sqrt{x(1-x)} + \arccos\sqrt x\big)$ with $x := r/(2r_0)$ and $\omega^2 = G_NM/r_0^3$. The circular orbit of radius $r_0$ has period $2\pi/\omega$. How long does the fall to the source ($x\to0$) take?
    options:
      - text: '$\pi/\omega$: half the period of the circular orbit'
        correct: true
      - text: '$2\pi/\omega$: one full period of the circular orbit'
        feedback: |
          At $x\to0$: $\sqrt{x(1-x)}\to0$ and $\arccos0 = \pi/2$, so $t = \frac2\omega\cdot\frac\pi2 = \frac\pi\omega$, half the period.
      - text: 'Forever: the pull is too weak near the start'
        feedback: |
          The pull only grows on the way in ($G_NM/r^2$), and the formula gives a finite value at $x\to0$: $\pi/\omega$.
    explanation: |
      $t = \frac2\omega(0 + \tfrac\pi2) = \pi/\omega$; with $\omega = 1$, $t = \pi\approx3.14$. Equivalently, for a release from rest at distance $R$:
      $$t_{\text{fall}} = \frac\pi2\sqrt{\frac{R^3}{2G_NM}},$$
      which at $R = 4$, $G_NM = 8$ gives $\frac\pi2\cdot2 = \pi$. A Kepler picture explains the half: the fall is a squashed ellipse from $0$ to $2r_0$, with semi-major axis $r_0$, so it shares the period of the circle; the fall is half of that ellipse. By symmetry $r(-t) = r(t)$: before $t = 0$ it was rising. We use $t\in(-\pi/\omega, \pi/\omega)$.

  - type: text
    id: falling-chart
    tag: Step 7 · The falling chart
    title: Follow the falling body
    body: |
      Take the chart $(\mathcal{V},\mathscr{Y})$ with non-rotating axes and origin on $\zeta$: $b(t) := (r(t), 0, 0)$, coordinates $y^i$ with $y^0 = t$ and
      $$x^\alpha = y^\alpha + b^\alpha(t),$$
      on the events of $\mathcal{U}$ with $t\in(-\pi,\pi)$. Recall that such a shifted chart has the single kind of nonzero coefficient
      $$(\Gamma_\mathscr{Y})^\alpha_{00} = \partial_\alpha\phi(t, y + b) + \ddot b^\alpha,$$
      gravity plus the translational pseudo-force of the accelerated origin. Here $\ddot b = (\ddot r, 0, 0) = (-G_NM/r^2, 0, 0)$, so
      $$(\Gamma_\mathscr{Y})^\alpha_{00} = \frac{G_NM\,(y^\alpha + b^\alpha)}{|y + b|^3} - \frac{G_NM}{r^2}\,\delta_{\alpha1}.$$

  - type: mcq
    id: along-zeta
    tag: Step 7 · The falling chart
    title: Along the falling body
    prompt: |
      Point mass with $G_NM = 8$; a body falls radially, $b(t) = (r(t),0,0)$ with $\ddot r = -G_NM/r^2$. In the chart with $x^\alpha = y^\alpha + b^\alpha(t)$,
      $$(\Gamma_\mathscr{Y})^\alpha_{00} = \frac{G_NM(y^\alpha + b^\alpha)}{|y + b|^3} - \frac{G_NM}{r^2}\delta_{\alpha1},$$
      all other coefficients zero. Where do all the coefficients vanish?
    options:
      - text: 'At the origin $y = 0$, at every time: along the whole worldline of the falling body, and nowhere else nearby'
        correct: true
      - text: 'Only at the origin at $t = 0$, where the body is at rest'
        feedback: |
          At $y = 0$ and any $t$: $G_NM\,r/r^3 - G_NM/r^2 = 0$. The cancellation does not need the body to be at rest, only the chart's origin to fall with it at every instant.
      - text: 'On an open set around the falling body'
        feedback: |
          Then the curvature, built from derivatives of the coefficients, would vanish there. It does not: $\mathrm{Riem}^\alpha_{0\beta0} = \partial_\beta\partial_\alpha\phi\neq0$ on all of $\mathcal{U}$, and curvature is a tensor, the same in every chart.
    explanation: |
      At $y = 0$, component $1$ is $G_NM\,r/r^3 - G_NM/r^2 = 0$, components $2, 3$ are $0$. So the body $\zeta$ rests at the origin with zero force: an observer falling with it feels no gravity, along its entire worldline, a whole line of events rather than a single one. Around it, the coefficients are of first order in $y$: the tides.

  - type: numeric
    id: riem-far
    tag: Step 7 · The falling chart
    title: Tides at the start
    prompt: |
      Point mass with $G_NM = 8$. A body falls radially along the $x^1$ axis, momentarily at distance $r$. Expanding $(\Gamma_\mathscr{Y})^\alpha_{00}$ around the origin of its falling chart gives $(\Gamma_\mathscr{Y})^\alpha_{00}\approx\mathrm{Riem}^\alpha_{0\beta0}\,y^\beta$, with, on the axis,
      $$(\mathrm{Riem}^\alpha_{0\beta0}) = \frac{G_NM}{r^3}\,\mathrm{diag}(-2, 1, 1).$$
      What is $\mathrm{Riem}^1_{010}$ at the start of the fall, $r = 4$?
    answer: -0.25
    wrong:
      - value: -2
        feedback: |
          $-2$ is the value at $r = 2$, where $G_NM/r^3 = 1$. At $r = 4$: $G_NM/r^3 = 8/64 = 0.125$, times $-2$.
      - value: -1
        feedback: |
          $-1 = -2\cdot8/16$ divides by $r^2$. Tides come from the derivative of the pull $G_NM/r^2$, one more power: $r^3$.
      - value: 0.125
        feedback: |
          $0.125 = G_NM/r^3$ is the transverse entry $\mathrm{Riem}^2_{020}$. Along the line of fall the entry is $-2G_NM/r^3$.
    explanation: |
      $-2\cdot8/64 = -0.25$, and the transverse entries are $\mathrm{Riem}^2_{020} = \mathrm{Riem}^3_{030} = 0.125$. A free particle near the body obeys the tidal equation
      $$\ddot\gamma^\alpha_\mathcal{V} = -\mathrm{Riem}^\alpha_{0\beta0}\,\gamma^\beta_\mathcal{V}:$$
      $\ddot\gamma^1_\mathcal{V} = +0.25\,\gamma^1_\mathcal{V}$ (pulled apart along the fall), $\ddot\gamma^2_\mathcal{V} = -0.125\,\gamma^2_\mathcal{V}$ (pushed together across it).

  - type: numeric
    id: exact-vs-linear
    tag: Step 7 · The falling chart
    title: Exact versus linear
    prompt: |
      Point mass with $G_NM = 8$. A body is at rest at $r = 4$ on the $x^1$ axis, the origin of its falling chart. A free particle is at rest at offset $y = (0.2, 0, 0)$, i.e. at $x^1 = 4.2$. The tidal equation predicts $\ddot\gamma^1_\mathcal{V} = 0.25\cdot0.2 = 0.05$. Exactly, $\ddot\gamma^1_\mathcal{V} = -(\Gamma_\mathscr{Y})^1_{00}$, the difference between the body's pull $G_NM/4^2$ and the particle's pull $G_NM/4.2^2$. What is the exact value? (Decimals are fine.)
    answer: 0.04649
    tolerance: 0.0005
    answerText: '$0.5 - 8/4.2^2\approx0.0465$'
    wrong:
      - value: -0.04649
        feedback: |
          The particle is pulled less than the body (it is farther away), so it falls behind: its acceleration relative to the body points away from the mass, $+0.0465$.
      - value: 0.05
        feedback: |
          $0.05$ is the linear prediction. The exact value uses $8/4.2^2 = 0.4535$ instead of the straight-line estimate.
    explanation: |
      $$\begin{aligned}\ddot\gamma^1_\mathcal{V} &= \frac{8}{16} - \frac{8}{4.2^2}\\ &= 0.5 - 0.4535 = 0.0465.\end{aligned}$$
      The linear $0.05$ is off by $\mathcal{O}(|y|^2)$, about $7\%$ at offset $0.2$ (and on the inner side, at $3.8$, the exact value is $-0.054$). The tidal equation is the first-order part.

  - type: widget
    id: far-cloud
    tag: Step 7 · The falling chart
    title: A cloud around the falling body
    widget: falling-cloud
    config: { GM: 8, c0: [4, 0], r0: 0.2, view: both, linear: true }
    body: |
      A point mass with $G_NM = 8$ at the origin; a ring of free particles of radius $0.2$ around the falling body, released at rest at $(4, 0)$. The right panel is the falling chart, magnified. The readout shows $\mathrm{Riem}$ at the body; the dashed ellipse is the tidal equation's prediction. The gold readout compares the exact tidal accelerations with the linear ones. Press **Play** and watch how slowly the egg forms at first, and how fast it stretches near the end.

  - type: mcq
    id: tides-grow
    tag: Step 7 · The falling chart
    title: As it falls
    prompt: |
      A body falls radially from rest at $r = 4$ toward a point mass with $G_NM = 8$. In its falling chart the tidal matrix is $\frac{G_NM}{r(t)^3}\,\mathrm{diag}(-2,1,1)$. By what factor are the tides stronger when it passes $r = 2$ (at $t = 1 + \pi/2$) than at the start?
    options:
      - text: '$8$'
        correct: true
      - text: '$4$'
        feedback: |
          $4$ is the factor for the pull $G_NM/r^2$. Tides go like $1/r^3$: halving $r$ multiplies them by $2^3$.
      - text: '$2$'
        feedback: |
          Tides are not proportional to $1/r$; they come from the derivative of the pull $G_NM/r^2$, which goes like $1/r^3$.
    explanation: |
      At $r = 2$ the matrix is $\mathrm{diag}(-2, 1, 1)$, against $\mathrm{diag}(-0.25, 0.125, 0.125)$ at $r = 4$: a factor $8$. As $r\to0$ the tides grow without bound, while along $\zeta$ itself the coefficients stay exactly $0$: the falling observer feels nothing at her own position, but a body of finite size is torn apart.

  - type: text
    id: summary
    title: Wrap-up
    body: |
      **One point mass, the whole chain.** With $G_NM = 8$:

      Notation: in the sources chart (stratified, cartesian, non-rotating, at rest relative to the mass; coordinates $x^i$, $x^0=t$, $\alpha,\beta\in\{1,2,3\}$), a point mass $M$ at the origin has potential $\phi$, $|x| := \sqrt{\sum_\beta(x^\beta)^2}$ and $r := |x|$. $G_N$ is Newton's constant, $\rho$ the mass density, $\Gamma^i_{jk}$ the coefficients of the connection, $\mathrm{Riem}$, $\mathrm{Ric}$ its curvature and Ricci tensor, $\delta_{\alpha\beta}$ the Kronecker delta, $\mathcal{U}$ the domain of the chart (spacetime minus the worldline of the mass), $r_0$ the orbit radius, $\omega$ the angular velocity, $x := r/(2r_0)$ in the fall formula, dots are $d/dt$.

      | | formula | value |
      |---|---|---|
      | $\phi$ | $-G_NM/\lvert x\rvert$ | |
      | $\Gamma^\alpha_{00}$ | $G_NM x^\alpha/\lvert x\rvert^3$ | $2$ at $(2,0,0)$ |
      | $\mathrm{Riem}^\alpha_{0\beta0}$ | Hessian of $\phi$ | $\mathrm{diag}(-2,1,1)$ at $(2,0,0)$ |
      | $\mathrm{Ric}_{00}$ | $\Delta\phi$ | $0$ on $\mathcal{U}$ |

      - **Curvature everywhere**: $\mathrm{Riem}^\alpha_{0\beta0} = \frac{G_NM}{|x|^5}(|x|^2\delta_{\alpha\beta} - 3x^\alpha x^\beta)$; off the axes it has mixed entries ($-1.5$ at $(\sqrt2,\sqrt2,0)$), but it is always $-2G_NM/r^3$ along the line to the mass and $G_NM/r^3$ across it.
      - **Vacuum**: the trace $3G_NM/|x|^3 - 3G_NM/|x|^3$ vanishes; the mass sits on the removed worldline, so $\rho = 0$ on $\mathcal{U}$, yet spacetime is curved there.
      - **Orbit**: a circle is free iff $\omega^2 = G_NM/r_0^3$ (Kepler III); $r_0 = 2$ gives $\omega = 1$. In the co-rotating chart it rests, centrifugal $\omega^2r_0$ balancing the pull $G_NM/r_0^2$.
      - **Radial fall** from $2r_0 = 4$: $\ddot r = -G_NM/r^2$, $t(r) = \frac2\omega(\sqrt{x(1-x)} + \arccos\sqrt x)$; speed $2$ at $r = 2$ (time $1 + \pi/2$), the source reached at $\pi/\omega$, half an orbital period.
      - **Falling chart**: all coefficients vanish along the falling body; around it the tides $-\mathrm{Riem}$, $(+0.25, -0.125)$ at $r = 4$, growing like $1/r^3$.

      **Next: "Newton-Cartan Traps".** Fast questions on the misconceptions of this level: what counts as a pseudo-force, where gravity can be removed and where it cannot, vacuum versus flatness, and signs that slip between $\Gamma$, $\phi$ and the acceleration.
