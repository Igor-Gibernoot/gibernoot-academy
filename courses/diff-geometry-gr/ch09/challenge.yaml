id: ch09-challenge
title: Level Challenge · Part 1
kind: challenge

# Organization: intro, one block per problem (cards tagged "Problem N · …", ids
# prefixed pN-), then wrap-up. The Level Challenge is split in 3 parts of at most
# 32 cards; part 1 holds problem 1.

cards:
  - type: text
    id: intro
    title: Whirl and release
    body: |
      This challenge pushes each idea of the level to its edge. It comes in 3 parts; this is part 1 (problem 1). Keep pencil and paper at hand: every answer can be checked by hand.

      Recall the toolkit. A Newtonian spacetime is a 4-dimensional manifold $\mathcal{M}$ of events with an **absolute time** $t\in C^\infty(\mathcal{M})$, $(dt)_p\neq0$, and a torsion-free connection $\nabla$ with $\nabla dt = 0$ (time flows uniformly). A vector $\mathcal{X}_p$ is future directed, spatial or past directed as $(dt)_p(\mathcal{X}_p)$ is positive, zero or negative. A chart is **stratified** if its time coordinate is $t$ itself, $x^0 = t$, and **inertial** if moreover all its connection coefficients vanish. Indices: Latin $i,j,k\in\{0,1,2,3\}$, Greek $\alpha,\beta,\delta\in\{1,2,3\}$, Einstein summation. In a stratified chart, Newton II for a worldline $\gamma$ of mass $m$ and force components $f^\alpha$ reads
      $$\begin{aligned}m\ddot\gamma^\alpha = f^\alpha &- m\Gamma^\alpha_{\beta\delta}\dot\gamma^\beta\dot\gamma^\delta\\ &- 2m\Gamma^\alpha_{0\beta}\dot\gamma^\beta - m\Gamma^\alpha_{00},\end{aligned}$$
      dots being derivatives with respect to $t$. Between two charts $\mathscr{X}$, $\mathscr{Y}$, when $\Gamma_\mathscr{X} = 0$ only the inhomogeneous term survives:
      $$(\Gamma_\mathscr{Y})^i_{jk} = \frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^s}\frac{\partial^2\mathscr{X}^s}{\partial\mathscr{Y}^k\partial\mathscr{Y}^j}.$$

      1. Whirl and release: a ball on a string and a free ball, seen from the ground and from a carousel.

  # ---------------------------------------------------------------- Problem 1
  - type: text
    id: p1-setup
    tag: Problem 1 · Whirl and release
    title: A ball on a string
    body: |
      No gravity: $\mathcal{M} = \mathbb{R}^4$ with an inertial chart $(\mathcal{U},\mathscr{X})$, coordinates $x^i$, $x^0 = t$, all $(\Gamma_\mathscr{X})^k_{ji} = 0$.

      A ball of mass $m = 4$ is whirled on a string on a circle of radius $r_0 = 2$ about the third axis, at angular speed $\omega = \tfrac12$. Its worldline, with components $\gamma^i_\mathcal{U} := x^i\circ\gamma$, is
      $$\gamma_\mathcal{U}(t) = \big(t,\ 2\cos\tfrac t2,\ 2\sin\tfrac t2,\ 0\big).$$
      A second ball moves freely along the tangent of that circle at $(2,0,0)$:
      $$\chi_\mathcal{U}(t) = (t,\ 2,\ t,\ 0).$$
      Think of $\chi$ as the ball released at $t = 0$ when the string is cut. Both pass through the event with coordinates $(0,2,0,0)$.

  - type: numeric
    id: p1-same-velocity
    tag: Problem 1 · Whirl and release
    title: Same event, same velocity
    prompt: |
      In an inertial chart with $x^0 = t$, a ball on a string has worldline
      $$\gamma_\mathcal{U}(t) = \big(t,\ 2\cos\tfrac t2,\ 2\sin\tfrac t2,\ 0\big),$$
      and a free ball has $\chi_\mathcal{U}(t) = (t,2,t,0)$, with $\dot\chi_\mathcal{U} = (1,0,1,0)$. Compute $\dot\gamma^2_\mathcal{U}(0)$, the second spatial velocity component of the string ball at $t = 0$.
    answer: 1
    wrong:
      - { value: 0.5, feedback: 'That is $\omega = \tfrac12$ alone. Differentiating $2\sin\tfrac t2$ gives $2\cdot\tfrac12\cos\tfrac t2 = \cos\tfrac t2$: the speed on a circle is $r_0\omega = 2\cdot\tfrac12$.' }
      - { value: 2, feedback: 'That is the radius $r_0$. The chain rule brings down the factor $\omega = \tfrac12$: $\tfrac{d}{dt}\,2\sin\tfrac t2 = \cos\tfrac t2$, which is $1$ at $t = 0$.' }
    hint: Differentiate $2\sin\tfrac t2$ with the chain rule.
    explanation: |
      $$\dot\gamma_\mathcal{U}(t) = \big(1,\ -\sin\tfrac t2,\ \cos\tfrac t2,\ 0\big),$$
      so $\dot\gamma_\mathcal{U}(0) = (1,0,1,0) = \dot\chi_\mathcal{U}(0)$. Same event, same velocity: the two worldlines touch at $t = 0$, and from then on only the string tells them apart.

  - type: numeric
    id: p1-force
    tag: Problem 1 · Whirl and release
    title: The tension of the string
    prompt: |
      In an inertial chart (all connection coefficients zero) Newton II reads $m\ddot\gamma^\alpha_\mathcal{U} = f^\alpha_\mathcal{U}$. A ball of mass $m = 4$ has worldline
      $$\gamma_\mathcal{U}(t) = \big(t,\ 2\cos\tfrac t2,\ 2\sin\tfrac t2,\ 0\big).$$
      Compute the size $\sqrt{(f^1_\mathcal{U})^2+(f^2_\mathcal{U})^2+(f^3_\mathcal{U})^2}$ of the force the string must exert.
    answer: 2
    wrong:
      - { value: 0.5, feedback: 'That is the size of the acceleration, $r_0\omega^2 = 2\cdot\tfrac14$. Newton II multiplies it by the mass $m = 4$.' }
      - { value: 4, feedback: 'That is $m\,r_0\omega$, with one factor $\omega$ missing: each derivative of $\cos\tfrac t2$ brings down $\tfrac12$, so the acceleration carries $\omega^2 = \tfrac14$.' }
      - { value: 1, feedback: 'That is $m\omega^2$, without the radius. The acceleration is $-\omega^2\gamma^\alpha_\mathcal{U}$, and $\gamma_\mathcal{U}$ lies at distance $r_0 = 2$ from the axis.' }
    hint: 'Differentiate twice: $\ddot\gamma^\alpha_\mathcal{U} = -\omega^2\gamma^\alpha_\mathcal{U}$.'
    explanation: |
      $$\ddot\gamma_\mathcal{U} = \big(0,\ -\tfrac12\cos\tfrac t2,\ -\tfrac12\sin\tfrac t2,\ 0\big),$$
      so $f^\alpha_\mathcal{U} = -m\omega^2\gamma^\alpha_\mathcal{U} = -\gamma^\alpha_\mathcal{U}$, of constant size $m\omega^2r_0 = 2$, pointing at the axis. For $\chi$, $\ddot\chi_\mathcal{U} = 0$: no force, the free ball obeys Newton I.

  - type: mcq
    id: p1-spatial
    tag: Problem 1 · Whirl and release
    title: No time component
    prompt: |
      A ball on a string has worldline $\gamma_\mathcal{U}(t) = (t,\ 2\cos\tfrac t2,\ 2\sin\tfrac t2,\ 0)$ in an inertial chart, where $x^0 = t$. The string's force has components $f^k_\mathcal{U} := (dx^k)(\mathcal{F}_\gamma)$, and $f^0_\mathcal{U} = 0$. Why must the time component vanish?
    options:
      - text: 'A force is spatial, $(dt)(\mathcal{F}_\gamma) = 0$, and in a stratified chart $dt = dx^0$'
        correct: true
      - text: 'Because the circle lies in a plane of constant $x^3$'
        feedback: |
          That explains $f^3_\mathcal{U} = 0$, not $f^0_\mathcal{U}$. The time component vanishes for every force, whatever the path: forces are spatial by axiom.
      - text: 'It does not have to: $f^0_\mathcal{U} = 0$ only because $\omega$ is constant'
        feedback: |
          Any force has $f^0_\mathcal{U} = (dx^0)(\mathcal{F}_\gamma) = (dt)(\mathcal{F}_\gamma) = 0$ in a stratified chart. The same follows from Newton II: the time component reads $m\ddot\gamma^0_\mathcal{U} = f^0_\mathcal{U}$ with $\gamma^0_\mathcal{U} = t$, so $\ddot\gamma^0_\mathcal{U} = 0$ for any motion.
      - text: 'Because $t$ is not one of the chart''s coordinates'
        feedback: |
          In a stratified chart $t$ is exactly the coordinate $x^0$. That is why its differential $dx^0 = dt$ kills every force.
    explanation: |
      Forces are spatial: $(dt)(\mathcal{F}_\gamma) = 0$, they push within the slice of the moment. In a stratified chart $f^0_\mathcal{U} = (dx^0)(\mathcal{F}_\gamma) = (dt)(\mathcal{F}_\gamma) = 0$, consistent with $\ddot\gamma^0_\mathcal{U} = \ddot t = 0$.

  - type: text
    id: p1-corotating
    tag: Problem 1 · Whirl and release
    title: Ride the carousel
    body: |
      Now watch from a chart $(\mathcal{V},\mathscr{Y})$ that rotates with the string, $\theta = \omega t = \tfrac t2$:
      $$\begin{aligned}y^1 &= x^1\cos\tfrac t2 + x^2\sin\tfrac t2,\\ y^2 &= -x^1\sin\tfrac t2 + x^2\cos\tfrac t2,\end{aligned}$$
      with $y^0 = t$ and $y^3 = x^3$. It is stratified, with the coefficients of a rotating grid: $\Gamma^1_{02} = -\omega$, $\Gamma^2_{01} = \omega$, $\Gamma^\alpha_{00} = -\omega^2y^\alpha$ for $\alpha = 1,2$. Write $\chi^\alpha_\mathcal{V} := y^\alpha\circ\chi$. Per unit mass, Newton II becomes
      $$\begin{aligned}\ddot\chi^1_\mathcal{V} &= \tfrac{f^1_\mathcal{V}}{m} + 2\omega\dot\chi^2_\mathcal{V} + \omega^2\chi^1_\mathcal{V},\\ \ddot\chi^2_\mathcal{V} &= \tfrac{f^2_\mathcal{V}}{m} - 2\omega\dot\chi^1_\mathcal{V} + \omega^2\chi^2_\mathcal{V}:\end{aligned}$$
      the terms with $2\omega$ are **Coriolis**, those with $\omega^2$ **centrifugal**.

  - type: build
    id: p1-build
    tag: Problem 1 · Whirl and release
    title: The free ball on the carousel
    prompt: |
      The free ball has $\chi_\mathcal{U}(t) = (t,2,t,0)$ in an inertial chart. The co-rotating chart has
      $$y^1 = x^1\cos\tfrac t2 + x^2\sin\tfrac t2.$$
      Build $\chi^1_\mathcal{V}(t) := y^1(\chi(t))$, cosine term first.
    prefix: '\chi^1_\mathcal{V}(t) ='
    tiles: ['2\cos\tfrac t2', '+\,t\sin\tfrac t2', '-\,t\sin\tfrac t2', '+\,2\sin\tfrac t2', '+\,t\cos\tfrac t2']
    answers:
      - ['2\cos\tfrac t2', '+\,t\sin\tfrac t2']
    wrong:
      - { answer: ['2\cos\tfrac t2', '-\,t\sin\tfrac t2'], feedback: 'That is the sign of $y^2$''s formula, $-x^1\sin\tfrac t2$. For $y^1$ both terms carry $+$: $x^1\cos\tfrac t2 + x^2\sin\tfrac t2$ with $x^2 = t$.' }
      - { answer: ['2\cos\tfrac t2', '+\,2\sin\tfrac t2'], feedback: 'The ball''s $x^2$ is $t$, not $2$: it moves along the tangent, $\chi^2_\mathcal{U}(t) = t$.' }
    hint: Substitute $x^1 = 2$ and $x^2 = t$.
    explanation: |
      $$\begin{aligned}\chi^1_\mathcal{V} &= 2\cos\tfrac t2 + t\sin\tfrac t2,\\ \chi^2_\mathcal{V} &= -2\sin\tfrac t2 + t\cos\tfrac t2.\end{aligned}$$
      Differentiating, the $\sin$ and $\cos$ terms without $t$ cancel:
      $$\dot\chi_\mathcal{V} = \tfrac t2\big(\cos\tfrac t2,\ -\sin\tfrac t2\big),$$
      zero at $t = 0$.

  - type: numeric
    id: p1-start
    tag: Problem 1 · Whirl and release
    title: The first push
    prompt: |
      A free ball ($f = 0$) seen in a chart rotating at $\omega = \tfrac12$ starts at $\chi_\mathcal{V}(0) = (2,0,0)$ with $\dot\chi_\mathcal{V}(0) = 0$. Newton II per unit mass in that chart:
      $$\ddot\chi^1_\mathcal{V} = \tfrac{f^1_\mathcal{V}}{m} + 2\omega\dot\chi^2_\mathcal{V} + \omega^2\chi^1_\mathcal{V}.$$
      Compute $\ddot\chi^1_\mathcal{V}(0)$.
    answer: 0.5
    wrong:
      - { value: -0.5, feedback: 'The centrifugal term $+\omega^2\chi^1_\mathcal{V}$ pushes outward, away from the axis: $+\tfrac14\cdot2$.' }
      - { value: 2, feedback: 'That is $\chi^1_\mathcal{V}(0)$ alone. The centrifugal term carries $\omega^2 = \tfrac14$.' }
      - { value: 1, feedback: 'That is $\omega\,\chi^1_\mathcal{V}$; the centrifugal term has $\omega^2$, not $\omega$.' }
    hint: Only one term on the right is nonzero at $t = 0$.
    explanation: |
      $$\ddot\chi^1_\mathcal{V}(0) = 0 + 2\cdot\tfrac12\cdot0 + \tfrac14\cdot2 = \tfrac12.$$
      Check by differentiating $\dot\chi^1_\mathcal{V} = \tfrac t2\cos\tfrac t2$: at $t = 0$ it gives $\tfrac12$. From the carousel, the released ball starts at rest and drifts outward.

  - type: mcq
    id: p1-no-coriolis
    tag: Problem 1 · Whirl and release
    title: Where is Coriolis?
    prompt: |
      A ball is released from a string and moves freely; in the chart co-rotating with the string ($\Gamma^1_{02} = -\omega$, $\Gamma^2_{01} = \omega$, $\omega = \tfrac12$) its initial acceleration is purely centrifugal, with no Coriolis term. Why?
    options:
      - text: 'At release the ball is at rest in the co-rotating chart: its velocity equals the grid''s'
        correct: true
      - text: 'The Coriolis coefficients vanish at $t = 0$'
        feedback: |
          $\Gamma^1_{02} = -\tfrac12$ and $\Gamma^2_{01} = \tfrac12$ are constant. The Coriolis term $-2\Gamma^\alpha_{0\beta}\dot\chi^\beta_\mathcal{V}$ is zero because the velocity $\dot\chi_\mathcal{V}(0)$ is.
      - text: 'Coriolis vanishes on the circle of the string'
        feedback: |
          No position makes it vanish: it depends on the velocity only. Being proportional to position is the centrifugal term's feature.
      - text: 'Coriolis acts only on balls that feel a force'
        feedback: |
          Pseudo-forces act on every ball, forced or free: they come from the chart's coefficients. Here it vanishes at $t = 0$ only because $\dot\chi_\mathcal{V}(0) = 0$.
    explanation: |
      The Coriolis term is $-2\Gamma^\alpha_{0\beta}\dot\chi^\beta_\mathcal{V}$: proportional to the velocity in the moving chart. At $t = 0$ the ball moves at $(0,1,0)$, exactly like the grid point under it, so $\dot\chi_\mathcal{V}(0) = 0$. Once it drifts outward, Coriolis switches on.

  - type: numeric
    id: p1-later
    tag: Problem 1 · Whirl and release
    title: Half a turn later
    prompt: |
      A free ball in a chart rotating at $\omega = \tfrac12$ has, at $t = \pi$,
      $$\chi_\mathcal{V} = (\pi,\ -2,\ 0),\quad\dot\chi_\mathcal{V} = (0,\ -\tfrac\pi2,\ 0).$$
      With $f = 0$, Newton II per unit mass gives
      $$\ddot\chi^1_\mathcal{V} = 2\omega\dot\chi^2_\mathcal{V} + \omega^2\chi^1_\mathcal{V}.$$
      Compute $\ddot\chi^1_\mathcal{V}(\pi)$.
    answer: -0.7854
    tolerance: 0.01
    answerText: '-\pi/4\approx-0.785'
    wrong:
      - { value: 0.7854, feedback: 'That is the centrifugal term $\omega^2\chi^1_\mathcal{V} = \tfrac\pi4$ alone. The ball now moves, so Coriolis adds $2\omega\dot\chi^2_\mathcal{V} = -\tfrac\pi2$.' }
      - { value: -1.5708, feedback: 'That is the Coriolis term alone. The ball is at $\chi^1_\mathcal{V} = \pi$, so the centrifugal term $\tfrac\pi4$ adds to it.' }
      - { value: 2.3562, feedback: 'The Coriolis term is $+2\omega\dot\chi^2_\mathcal{V} = 1\cdot(-\tfrac\pi2)$, negative here because $\dot\chi^2_\mathcal{V}<0$.' }
    hint: 'Coriolis: $2\cdot\tfrac12\cdot(-\tfrac\pi2)$. Centrifugal: $\tfrac14\cdot\pi$.'
    explanation: |
      $$\begin{aligned}\ddot\chi^1_\mathcal{V} &= -\tfrac\pi2 + \tfrac\pi4\\ &= -\tfrac\pi4\approx-0.785.\end{aligned}$$
      Coriolis now beats the centrifugal push in this direction: it bends the path backwards, against the rotation.

  - type: numeric
    id: p1-check
    tag: Problem 1 · Whirl and release
    title: Check by differentiating
    prompt: |
      A free ball seen from a chart rotating at $\omega = \tfrac12$ has
      $$\dot\chi^2_\mathcal{V}(t) = -\tfrac t2\sin\tfrac t2.$$
      Differentiate once more and evaluate $\ddot\chi^2_\mathcal{V}$ at $t = \pi$.
    answer: -0.5
    wrong:
      - { value: -0.7854, feedback: 'That is $\ddot\chi^1_\mathcal{V}(\pi) = -\tfrac\pi4$, the other component. Differentiate $-\tfrac t2\sin\tfrac t2$: the product rule gives $-\tfrac12\sin\tfrac t2 - \tfrac t4\cos\tfrac t2$, and $\cos\tfrac\pi2 = 0$.' }
      - { value: 0, feedback: 'The product rule has two pieces: $-\tfrac12\sin\tfrac t2$ survives at $t = \pi$, giving $-\tfrac12$.' }
    hint: Product rule on $\tfrac t2\cdot\sin\tfrac t2$.
    explanation: |
      $$\ddot\chi^2_\mathcal{V} = -\tfrac12\sin\tfrac t2 - \tfrac t4\cos\tfrac t2,$$
      which is $-\tfrac12$ at $t = \pi$. Newton II predicts the same: $-2\omega\dot\chi^1_\mathcal{V} + \omega^2\chi^2_\mathcal{V} = 0 + \tfrac14(-2) = -\tfrac12$, with $\chi_\mathcal{V}(\pi) = (\pi,-2,0)$ and $\dot\chi^1_\mathcal{V}(\pi) = 0$. Pseudo-forces predict exactly what the chart sees.

  - type: numeric
    id: p1-distance
    tag: Problem 1 · Whirl and release
    title: Distance from the axis
    prompt: |
      A free ball has $\chi_\mathcal{U}(t) = (t,2,t,0)$ in an inertial chart, and at $t = \pi$ it sits at $(\chi^1_\mathcal{V},\chi^2_\mathcal{V}) = (\pi,-2)$ in a chart rotating about the third axis. Compute its distance $\sqrt{(y^1)^2+(y^2)^2}$ from the axis at $t = \pi$, to three decimals.
    answer: 3.724
    tolerance: 0.005
    answerText: '\sqrt{\pi^2+4}\approx3.724'
    wrong:
      - { value: 1.142, feedback: 'That is $\pi-2$, a difference of coordinates. The distance from the axis is $\sqrt{\pi^2+(-2)^2}$.' }
    hint: '$\sqrt{\pi^2 + 4}$.'
    explanation: |
      $$\sqrt{\pi^2+4}\approx3.724.$$
      In the inertial chart the ball is at $(2,\pi)$: the same distance. A rotation about the axis mixes $x^1$ and $x^2$ but keeps $(x^1)^2+(x^2)^2$, so both charts agree on how far the ball has drifted.

  - type: mcq
    id: p1-spiral
    tag: Problem 1 · Whirl and release
    title: The shape on the carousel
    prompt: |
      A ball is released from a string whirling counterclockwise at $\omega = \tfrac12$. In the chart co-rotating with the string, it starts at rest at $(2,0)$, is pushed outward by the centrifugal term, and Coriolis bends it against the rotation; at $t = \pi$ it is at $(\pi,-2)$. What does its path look like in that chart?
    options:
      - text: 'A spiral unwinding outward, turning clockwise'
        correct: true
      - text: 'A straight line, since the ball is free'
        feedback: |
          Straight in the inertial chart, yes. The rotating grid turns under it, so its coordinates in the moving chart trace a curve: $(2,0)$ at $t = 0$, $(\pi,-2)$ at $t = \pi$, not on one line through the start with the outward push.
      - text: 'The circle of radius $2$, since the ball keeps the string''s speed'
        feedback: |
          Staying on the circle needs the string. Without it, the distance from the axis grows, $\sqrt{4+t^2}$: $\approx3.72$ at $t = \pi$.
      - text: 'A spiral winding inward toward the axis'
        feedback: |
          The distance $\sqrt{4+t^2}$ only grows. The centrifugal term pushes outward; Coriolis turns the path but does not pull it in.
    explanation: |
      The distance from the axis is $\sqrt{4+t^2}$, growing, and the angle in the moving chart decreases (from $(2,0)$ to $(\pi,-2)$): a clockwise spiral leaving the circle. It is the **involute** of the circle, the curve traced by the end of a thread unwound from it. Same free ball, straight line or spiral: the shape belongs to the chart.

  - type: numeric
    id: p1-string
    tag: Problem 1 · Whirl and release
    title: The string on the carousel
    prompt: |
      A ball of mass $m = 4$ on a string, whirled at $\omega = \tfrac12$ on a circle of radius $2$, is at rest at $\gamma_\mathcal{V} = (2,0,0)$ in the co-rotating chart. Newton II there:
      $$\begin{aligned}m\ddot\gamma^1_\mathcal{V} = f^1_\mathcal{V} &+ 2m\omega\dot\gamma^2_\mathcal{V}\\ &+ m\omega^2\gamma^1_\mathcal{V}.\end{aligned}$$
      Compute the string's force component $f^1_\mathcal{V}$.
    answer: -2
    wrong:
      - { value: 2, feedback: 'That is the centrifugal term $m\omega^2\gamma^1_\mathcal{V}$ itself. The string must cancel it, so it points the other way: inward.' }
      - { value: 0, feedback: 'At rest the left side is zero, but the centrifugal term is not: $4\cdot\tfrac14\cdot2 = 2$. Something must balance it.' }
      - { value: -0.5, feedback: 'That is per unit mass. Newton II here carries $m = 4$: $f^1_\mathcal{V} = -m\omega^2\cdot2 = -2$.' }
    hint: At rest both sides' velocity and acceleration terms vanish.
    explanation: |
      $$0 = f^1_\mathcal{V} + 0 + 4\cdot\tfrac14\cdot2,$$
      so $f^1_\mathcal{V} = -2$: size $2$, pointing at the axis, the same force found in the inertial chart (a force is a vector, so only its components change). On the carousel the story reads differently: the string holds the ball still against the centrifugal pseudo-force. Cut it, and the centrifugal term wins.

  - type: text
    id: wrap-up
    title: What you now own
    body: |
      Problem 1, part 1 of 3 of the level challenge. The formulas to keep:

      Notation: $t$ is the absolute time; the inertial chart has coordinates $x^i$ and another stratified chart (rotating at angular velocity $\omega$) coordinates $y^i$, with $x^0=y^0=t$ and $\alpha,\beta,\delta\in\{1,2,3\}$; $\Gamma^i_{jk}$ are the coefficients of the connection $\nabla$ in the chart $y$; dots are $d/dt$.

      **1. Whirl and release**: in a chart rotating at $\omega$, a free ball feels the Coriolis term $-2\Gamma^\alpha_{0\beta}\dot y^\beta$ and the centrifugal term $-\Gamma^\alpha_{00} = \omega^2y^\alpha$; a string's tension balances them only for the ball that turns with the chart.

      **Next, part 2 of this challenge.** A chart whose time coordinate is not the absolute time (bent clocks), and then the complete list of charts that are inertial together with a given one, with a shearing grid that is not.
