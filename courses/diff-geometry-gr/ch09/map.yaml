outroTitle: Chapter 9 in one picture
outro: |
  Read it top to bottom. An **absolute time** $t$ with $(dt)_p\neq0$ slices spacetime into **absolute spaces**
  $$T_p\mathcal{S}_{t(p)} = \ker(dt)_p,$$
  and, given a connection, flows **uniformly**, $\nabla dt = 0$: together a torsion-free **Newtonian spacetime** $(\mathcal{M},\mathcal{O},\mathcal{A},\nabla,t)$, with no metric. **Worldlines** move forward in time, $(t\circ\gamma)'>0$, and **forces** are spatial. **Newton I** makes free particles the autoparallels that define $\nabla$; **Newton II**, $a_\gamma = \mathcal{F}_\gamma/m$, then forces $\lambda\equiv t$. In a **stratified chart**, $\mathscr{X}^0 = t$, uniform flow kills $\Gamma^0_{ki}$, and the rest appear as extra terms of Newton II. **Inertial charts** ($\Gamma = 0$) need $\mathrm{Riem} = 0$; moving axes turn their zero coefficients into **pseudo-forces** (Coriolis, centrifugal, Euler, translational). **Gravity** sits in the same slot,
  $$\Gamma^\alpha_{00} = \partial_\alpha\phi,$$
  and a uniform field is a pseudo-force, but a varying one leaves **curvature**,
  $$\mathrm{Riem}^\alpha_{0\beta0} = \partial_\beta\partial_\alpha\phi,$$
  which no chart removes. Its trace is the **field equation** $\mathrm{Ric}_{00} = 4\pi G_N\rho$, and in a falling chart it is all that remains, as the **tidal equation**
  $$\ddot\gamma^\alpha_\mathcal{V}\approx-\mathrm{Riem}^\alpha_{0\beta0}\gamma^\beta_\mathcal{V}.$$

  **Next: the Level Challenge.** Harder problems that combine the whole map. A ball whirled on a string and a ball let go at the same instant leave from the same event with the same velocity: how do a fixed chart, a co-rotating chart and, with a mass at the centre, the connection itself tell their stories?
