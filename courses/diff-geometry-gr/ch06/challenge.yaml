      **1. Straightest curves of $\nabla^{\mathrm{W}}$** (polar):
      $$\ddot r = 0,$$
      $$\ddot\theta + \tfrac1r\,\dot r\,\dot\theta = 0,$$
      solved by rays, circles and logarithmic spirals
      $$r = r_*\,e^{(c_1/c_2)\theta}.$$
      **2. The fourth box** $\nabla^{\mathrm{F}}$ (cartesian coefficients $\Gamma^1_{22} = \kappa a$, $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$, others $0$):
      $$\mathtt{T}^1_{12} = -2,$$
      $$\mathrm{Riem}^1_{212} = \kappa + 1,$$
      same straightest curves as $\nabla^{\kappa}$, different transport.

