      A tensor field has no Leibniz term, so adding any multiple of $\mathcal{Q}$ to a connection keeps exactly one: $\nabla^{\mathrm{E}} + \mathcal{Q} = \nabla^{\mathrm{W}}$, and $\nabla^{\mathrm{E}} + 2\mathcal{Q}$ is a new connection. The average is $\nabla^{\mathrm{E}} + \tfrac12\mathcal{Q}$. So: **every** connection is $\nabla^{\mathrm{E}}$ plus some $(1,2)$-tensor field, and the coefficients of that tensor in cartesian coordinates are exactly the connection's $\Gamma$'s.

  - type: text
    id: p4-own
    tag: Problem 4 · The difference is a tensor
    title: What you now own
    body: |
      - Setting: on the plane (points $(a,b)$, $r = \sqrt{a^2+b^2}$, cartesian and polar charts), $\nabla^{\mathrm{E}}$ differentiates cartesian components and $\nabla^{\mathrm{W}}$ (plane minus the origin) makes the unit radial and angular fields parallel; $\mathcal{X},\mathcal{Y}$ are vector fields, $g$ a smooth function, $\Gamma^{\mathrm{E}\,i}_{jk}$, $\Gamma^{\mathrm{W}\,i}_{jk}$ their coefficients.
      - The difference of two connections,
      $$\mathcal{Q}(\mathcal{X},\mathcal{Y}) := \nabla^{\mathrm{W}}_\mathcal{X}\mathcal{Y} - \nabla^{\mathrm{E}}_\mathcal{X}\mathcal{Y},$$
      is a $(1,2)$-tensor field: the Leibniz terms cancel,
      $$\mathcal{Q}(\mathcal{X},g\mathcal{Y}) = g\,\mathcal{Q}(\mathcal{X},\mathcal{Y}).$$
      - Components $Q^i_{jk} = \Gamma^{\mathrm{W}\,i}_{jk} - \Gamma^{\mathrm{E}\,i}_{jk}$ obey the plain law (the inhomogeneous terms cancel). Cartesian: $Q^2_{11} = \tfrac b{r^2}$, $Q^1_{22} = \tfrac a{r^2}$, $Q^2_{12} = -\tfrac a{r^2}$, $Q^1_{21} = -\tfrac b{r^2}$. Polar:
      $$Q^1_{22} = r,\quad Q^2_{12} = -\tfrac1r.$$
      - Since $\nabla^{\mathrm{E}}$ is torsion free,
      $$\mathtt{T}^{\mathrm{W}\,i}_{jk} = Q^i_{kj} - Q^i_{jk}.$$
      - Connection plus $(1,2)$-tensor field = connection; connection plus connection is not.

      **Next:** the opposite move. Not a tensor that no chart can remove, but a chart that removes every $\Gamma$, at one point.

  # ---------------------------------------------------------------- Problem 5
  - type: text
    id: p5-setup
    tag: Problem 5 · Normal coordinates
    title: Falling in a curved plane
    body: |
      An astronaut in a freely falling cabin feels no gravity: dropped crumbs float beside her. Yet, over minutes, two crumbs released side by side slowly drift apart or together: the **tides**. Something can be switched off, something cannot. Here is the mathematical version.

      On the plane, $\nabla^{\kappa}$ has the single cartesian coefficient $\Gamma^1_{22} = \kappa\,a$ ($\kappa$ a nonzero constant). It is torsion free and curved:
      $$\mathrm{Riem}^1_{212} = \kappa.$$
      At $p = (1,0)$ its only nonzero coefficient is $\Gamma^1_{22}(p) = \kappa$.

      **Guess:**
      - Can a new chart make **all** coefficients vanish at $p$?
      - On a whole neighbourhood of $p$?
      - Can it make $\mathrm{Riem}^1_{212}(p)$ vanish?

  - type: text
    id: p5-recipe
    tag: Problem 5 · Normal coordinates
    title: The recipe
    body: |
      Recall the transformation law of the coefficients, from a chart $\mathscr{X}$ to a chart $\mathscr{Y}$:
      $$\begin{aligned}(\Gamma_\mathscr{Y})^i_{jk} &= \frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^s}\frac{\partial^2\mathscr{X}^s}{\partial\mathscr{Y}^k\partial\mathscr{Y}^j}\\ &\quad + \frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^l}\frac{\partial\mathscr{X}^s}{\partial\mathscr{Y}^j}\frac{\partial\mathscr{X}^m}{\partial\mathscr{Y}^k}(\Gamma_\mathscr{X})^l_{sm}\end{aligned}$$
      The inhomogeneous first term is a tool: pick a chart whose Jacobian is the identity at $p$ and whose second derivatives cancel the $\Gamma$'s there. With $\bar x^i$ the cartesian coordinates shifted to vanish at $p$ and $\Gamma^i_{(jk)} := \tfrac12(\Gamma^i_{jk} + \Gamma^i_{kj})$ the symmetric part, the recipe is
      $$\mathscr{Y}^i = \bar x^i + \tfrac12\,\Gamma^i_{(jk)}(p)\,\bar x^j\bar x^k.$$
      For $\nabla^{\kappa}$ at $p = (1,0)$: $\bar x = (a - 1,\ b)$ and only $\Gamma^1_{22}(p) = \kappa$, so the new chart $\mathscr{Y} = (u,v)$ is
      $$u = (a - 1) + \tfrac\kappa2\,b^2,$$
      $$v = b.$$
      Its coordinate curves $v = \text{const}$ are horizontal lines, and $u = \text{const}$ are parabolas opening to the left.

  - type: build
    id: p5-inverse
    tag: Problem 5 · Normal coordinates
    title: Back to the plane
    prompt: |
      On the plane, the chart $\mathscr{Y} = (u,v)$ adapted to $\nabla^{\kappa}$ at $p = (1,0)$ is $u = (a - 1) + \tfrac\kappa2\,b^2$, $v = b$. Invert it: build $a$ as a function of $u, v$.
    prefix: 'a ='
    tiles: ['1 + u', '-\,\tfrac\kappa2\,v^2', '+\,\tfrac\kappa2\,v^2', '-\,\kappa\,v^2', '1 - u']
    answers:
      - ['1 + u', '-\,\tfrac\kappa2\,v^2']
    wrong:
      - { answer: ['1 + u', '+\,\tfrac\kappa2\,v^2'], feedback: 'Solve $u = a - 1 + \tfrac\kappa2 b^2$ for $a$: the quadratic term moves to the other side with a minus sign, $a = 1 + u - \tfrac\kappa2 v^2$.' }
      - { answer: ['1 + u', '-\,\kappa\,v^2'], feedback: 'The factor stays $\tfrac\kappa2$; only the sign flips. $\kappa$ will appear as a second derivative: $\partial^2a/\partial v^2 = -\kappa$.' }
    hint: 'Use $b = v$ and solve the first equation for $a$.'
    explanation: |
      $$a = 1 + u - \tfrac\kappa2\,v^2,$$
      $$b = v.$$
      The Jacobians at $p$ ($u = v = 0$, $b = 0$) are both the identity, since $\partial u/\partial b = \kappa b$ and $\partial a/\partial v = -\kappa v$ vanish there. The only nonzero second derivative is
      $$\frac{\partial^2a}{\partial v^2} = -\kappa.$$

