id: ch06-challenge
title: Level Challenge
kind: challenge

# Organization: intro, then one block per problem (cards tagged
# "Problem N · …", ids prefixed pN-), then wrap-up. Session 1 wrote
# problems 1-3; problems 4-5 and wrap-up go after the Problem 3 block.

cards:
  - type: text
    id: intro
    title: Straight, twisted, curved
    body: |
      This challenge pushes each idea of the level to its edge. Keep pencil and paper at hand: every answer can be checked by hand. Einstein summation is on.

      Recall the toolkit. The plane has points $(a,b)$, the cartesian chart $\mathscr{X}$ with basis fields $\partial x_1 = \partial/\partial a$, $\partial x_2 = \partial/\partial b$, and the polar chart $\mathscr{Y} = (r,\theta)$ with $\partial y_1 = \partial/\partial r$, $\partial y_2 = \partial/\partial\theta$. A connection $\nabla$ has, in a chart, the coefficient functions $\Gamma^i_{jk}$ defined by
      $$\nabla_{\partial x_k}\partial x_j = \Gamma^i_{jk}\,\partial x_i$$
      (the **last** lower index is the direction). A curve $\gamma$ with components $\gamma^k(\lambda)$ and velocity $v_\gamma$ (components $\dot\gamma^k$, dot $= d/d\lambda$) has acceleration $a_\gamma := \nabla_{v_\gamma}v_\gamma$ with components
      $$a^k_\gamma = \ddot\gamma^k + \Gamma^k_{ji}\,\dot\gamma^i\dot\gamma^j.$$
      It is **autoparallel** (a straightest curve) if $a_\gamma = \text{ᚱ}\,v_\gamma$ for some function $\text{ᚱ}(\lambda)$, and **autoparallelly transported** if $a_\gamma = 0$. A vector $\mathcal{Z}$ with components $z^k$ is transported along $\gamma$ when
      $$\dot z^k + \Gamma^k_{ji}\,z^j\dot\gamma^i = 0.$$
      Torsion and curvature have components
      $$\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk},$$
      $$\begin{aligned}\mathrm{Riem}^i_{jkm} &= \partial x_k\lfloor\Gamma^i_{jm}\rceil - \partial x_m\lfloor\Gamma^i_{jk}\rceil\\ &\quad + \Gamma^i_{nk}\Gamma^n_{jm} - \Gamma^i_{nm}\Gamma^n_{jk}.\end{aligned}$$
      Three connections recur: $\nabla^{\mathrm{E}}$ (all cartesian coefficients zero), $\nabla^{\mathrm{W}}$ (the unit radial and angular fields declared parallel) and $\nabla^{\kappa}$ (single cartesian coefficient $\Gamma^1_{22} = \kappa\,a$).

      1. The straightest curves of $\nabla^{\mathrm{W}}$: circles, rays or spirals?
      2. The fourth box: a connection that is curved **and** twisted, and what its straightest curves cannot see.
      3. The sheared chart: coordinate lines that are not straight, and coefficients that do not mean curvature.
      4. The difference of two connections: the object that **is** a tensor.
      5. Normal coordinates: removing every $\Gamma$ at a point, and the curvature that survives.

  # ---------------------------------------------------------------- Problem 1
  - type: text
    id: p1-setup
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: Guess first
    body: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ is built from the unit radial and angular fields
      $$e_1 := \tfrac1r(a\,\partial x_1 + b\,\partial x_2),$$
      $$e_2 := \tfrac1r(-b\,\partial x_1 + a\,\partial x_2),$$
      declared parallel: $\nabla^{\mathrm{W}}_\mathcal{Z}e_1 = \nabla^{\mathrm{W}}_\mathcal{Z}e_2 = 0$ for every vector field $\mathcal{Z}$. A field $w^1e_1 + w^2e_2$ (frame components $w^1, w^2$, smooth functions) is then differentiated by differentiating only its frame components:
      $$\nabla^{\mathrm{W}}_\mathcal{Z}(w^ae_a) = \mathcal{Z}\lfloor w^a\rceil\,e_a.$$
      $\nabla^{\mathrm{W}}$ is flat (vectors return unchanged around every loop) but has torsion.

      **Before any computation, guess.** Which of these are straightest curves of $\nabla^{\mathrm{W}}$?
      - circles about the origin;
      - rays leaving the origin;
      - **logarithmic spirals** $r = r_*\,e^{m\theta}$ ($r_* > 0$, $m \neq 0$ constants), the curves that cross every ray at the same angle.

      Keep your guess; the widget comes next, the proof after it.

  - type: widget
    id: p1-widget
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: Drive around the origin
    widget: parallel-transport
    config:
      curve: { type: circle, r0: 2 }
      connection: W
      connections: [W, E]
      z0: [1, 0]
      showAcceleration: true
      view: { x: -3.2, y: -3.2, w: 6.4, h: 6.4 }
      presets:
        - { label: 'circle, ∇ᵂ', curve: { type: circle, r0: 2 }, connection: W, z0: [1, 0] }
        - { label: 'circle, ∇ᴱ', curve: { type: circle, r0: 2 }, connection: E, z0: [1, 0] }
        - { label: 'ray, ∇ᵂ', curve: { type: radial, theta0: 0.785 }, connection: W, z0: [0, 1] }
        - { label: 'vertical line, ∇ᵂ', curve: { type: vertical, x0: 1 }, connection: W, z0: [0, 1] }
    body: |
      The gold point runs once around the circle $\delta_2(\lambda) = (2\cos\lambda, 2\sin\lambda)$ at constant speed; the velocity $v_\gamma$ and the acceleration $a_\gamma = \nabla_{v_\gamma}v_\gamma$ (dashed) start there. The badge **Autoparallel?** checks the whole curve.

      1. Play the circle under $\nabla^{\mathrm{W}}$, then under $\nabla^{\mathrm{E}}$. Read the badge and the acceleration each time.
      2. Try the ray and the vertical line under $\nabla^{\mathrm{W}}$.
      3. Watch the blue vector $\mathcal{Z}$ under $\nabla^{\mathrm{W}}$: it keeps a fixed angle to the radial direction. So does the velocity of the circle.

  - type: mcq
    id: p1-why-circle
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: Why the circle is straight
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ declares the unit radial and angular fields $e_1$, $e_2$ parallel, so $\nabla^{\mathrm{W}}_\mathcal{Z}(w^ae_a) = \mathcal{Z}\lfloor w^a\rceil\,e_a$. The circle $\delta_2(\lambda) = (2\cos\lambda, 2\sin\lambda)$ has acceleration $a_\gamma = \nabla^{\mathrm{W}}_{v_\gamma}v_\gamma = 0$. Why?
    options:
      - text: 'Its velocity is $2\,e_2$ at every point: the frame components $(0, 2)$ are constant, and $\nabla^{\mathrm{W}}$ differentiates only frame components'
        correct: true
      - text: 'Because $\nabla^{\mathrm{W}}$ is flat, and on a flat connection every closed curve is autoparallel'
        feedback: |
          Flatness is about **loops of transport**: a vector carried around a closed curve comes back unchanged. It says nothing about which curves are straightest. Under $\nabla^{\mathrm{E}}$, also flat, the same circle is not autoparallel: its acceleration points to the centre.
      - text: 'Its speed is constant, and constant speed means zero acceleration'
        feedback: |
          Constant speed is not enough: under $\nabla^{\mathrm{E}}$ the same circle, at the same constant speed, has a nonzero acceleration (cartesian components $(-2\cos\lambda, -2\sin\lambda)$, towards the centre). What matters is that the **direction** relative to the parallel frame does not change.
      - text: 'Its velocity is $\partial y_2$, a coordinate basis field, and basis fields are always parallel'
        feedback: |
          Basis fields are not parallel in general: under $\nabla^{\mathrm{W}}$, $\partial y_2 = r\,e_2$ has $\nabla^{\mathrm{W}}_{\partial y_1}\partial y_2 = \tfrac1r\,\partial y_2 \neq 0$. On the circle $r = 2$ is constant, and that is why it works here.
    explanation: |
      $v_\gamma = \partial y_2 = r\,e_2 = 2\,e_2$ along the circle, so the frame components are the constants $(0, 2)$ and
      $$\nabla^{\mathrm{W}}_{v_\gamma}v_\gamma = v_\gamma\lfloor 2\rceil\,e_2 = 0.$$
      For $\nabla^{\mathrm{W}}$, "straight" means "constant angle to the radial direction". Circles about the origin qualify: unlike for $\nabla^{\mathrm{E}}$, they are straightest curves of $\nabla^{\mathrm{W}}$.

  - type: text
    id: p1-coeffs
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: The polar coefficients
    body: |
      To find **all** straightest curves we need the equation. In polar, $e_1 = \partial y_1$ and $e_2 = \tfrac1r\,\partial y_2$, so $\partial y_2 = r\,e_2$ has frame components $(0, r)$. Differentiate with the rule "only frame components":
      $$\nabla^{\mathrm{W}}_{\partial y_1}\partial y_2 = \partial y_1\lfloor r\rceil\,e_2 = \tfrac1r\,\partial y_2,$$
      $$\nabla^{\mathrm{W}}_{\partial y_2}\partial y_2 = \partial y_2\lfloor r\rceil\,e_2 = 0,$$
      and $\nabla^{\mathrm{W}}\partial y_1 = \nabla^{\mathrm{W}}e_1 = 0$ in every direction. With $\nabla_{\partial y_k}\partial y_j = \Gamma^i_{jk}\,\partial y_i$ (last index = direction), the only nonzero polar coefficient is
      $$\Gamma^2_{21} = \tfrac1r,$$
      while $\Gamma^2_{12} = 0$. Compare $\nabla^{\mathrm{E}}$ in polar: $\Gamma^1_{22} = -r$ and $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$.

      Write the polar components of a curve as $r(\lambda)$, $\theta(\lambda)$; its velocity components are $\dot r$, $\dot\theta$.

  - type: mcq
    id: p1-radial
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: The radial equation
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ has the single nonzero polar coefficient $\Gamma^2_{21} = \tfrac1r$ (chart $\mathscr{Y} = (r,\theta)$, $\nabla_{\partial y_k}\partial y_j = \Gamma^i_{jk}\,\partial y_i$). A curve with polar components $r(\lambda)$, $\theta(\lambda)$ has acceleration components $a^k_\gamma = \ddot\gamma^k + \Gamma^k_{ji}\dot\gamma^i\dot\gamma^j$. What is the radial component $a^1_\gamma$?
    options:
      - text: '$\ddot r$'
        correct: true
      - text: '$\ddot r - r\dot\theta^2$'
        feedback: |
          That is $\nabla^{\mathrm{E}}$, whose polar coefficient $\Gamma^1_{22} = -r$ produces the centripetal term $-r\dot\theta^2$. Under $\nabla^{\mathrm{W}}$, $\nabla^{\mathrm{W}}_{\partial y_2}\partial y_2 = \partial y_2\lfloor r\rceil\,e_2 = 0$, so $\Gamma^1_{22} = 0$: no centripetal term.
      - text: '$\ddot r + \tfrac1r\,\dot r\dot\theta$'
        feedback: |
          The coefficient $\Gamma^2_{21}$ has upper index $2$: it enters the **angular** component $a^2_\gamma$, not the radial one. All coefficients with upper index $1$ vanish.
    explanation: |
      Every $\Gamma^1_{ji}$ is zero, so $a^1_\gamma = \ddot r$. Without a centripetal term, a straightest curve of $\nabla^{\mathrm{W}}$ does not need to bend toward the origin to stay on a circle.

  - type: build
    id: p1-build-angular
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: The angular equation
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ has the single nonzero polar coefficient $\Gamma^2_{21} = \tfrac1r$, while $\Gamma^2_{12} = 0$ (chart $\mathscr{Y} = (r,\theta)$, last lower index = direction). For a curve with polar components $r(\lambda)$, $\theta(\lambda)$, build the angular acceleration component $a^2_\gamma = \ddot\theta + \Gamma^2_{ji}\dot\gamma^i\dot\gamma^j$.
    prefix: 'a^2_\gamma = \ddot\theta +'
    tiles: ['\tfrac1r\,\dot r\dot\theta', '\tfrac2r\,\dot r\dot\theta', 'r\,\dot\theta^2', '\tfrac1r\,\dot r^2']
    answers:
      - ['\tfrac1r\,\dot r\dot\theta']
    wrong:
      - { answer: ['\tfrac2r\,\dot r\dot\theta'], feedback: 'That is $\nabla^{\mathrm{E}}$, where both $\Gamma^2_{12}$ and $\Gamma^2_{21}$ equal $\tfrac1r$. Under $\nabla^{\mathrm{W}}$ only the ordering $(j,i) = (2,1)$ survives: $\Gamma^2_{21}\,\dot\gamma^1\dot\gamma^2 = \tfrac1r\,\dot r\dot\theta$.' }
      - { answer: ['\tfrac1r\,\dot r^2'], feedback: 'In $\Gamma^2_{21}\dot\gamma^i\dot\gamma^j$ the lower indices $j = 2$, $i = 1$ pick one velocity of each kind: $\dot\gamma^1 = \dot r$ and $\dot\gamma^2 = \dot\theta$.' }
    hint: 'Of the four terms $\Gamma^2_{ji}\dot\gamma^i\dot\gamma^j$, only $(j,i) = (2,1)$ has a nonzero coefficient.'
    explanation: |
      $$a^2_\gamma = \ddot\theta + \tfrac1r\,\dot r\dot\theta.$$
      So the autoparallelly transported curves ($a_\gamma = 0$) of $\nabla^{\mathrm{W}}$ solve
      $$\ddot r = 0,$$
      $$\ddot\theta + \tfrac1r\,\dot r\dot\theta = 0.$$

  - type: build
    id: p1-conserved
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: What stays constant
    prompt: |
      On the plane minus the origin, the autoparallelly transported curves of $\nabla^{\mathrm{W}}$ (polar components $r(\lambda)$, $\theta(\lambda)$) solve $\ddot r = 0$ and $\ddot\theta + \tfrac1r\,\dot r\dot\theta = 0$. Multiplying the second equation by $r$ gives $r\ddot\theta + \dot r\dot\theta = 0$. Which quantity has this as its derivative?
    prefix: '\tfrac{d}{d\lambda}\big('
    suffix: '\big) = r\ddot\theta + \dot r\dot\theta'
    tiles: ['r\dot\theta', 'r^2\dot\theta', '\dot r\dot\theta', '\dot\theta/r']
    answers:
      - ['r\dot\theta']
    wrong:
      - { answer: ['r^2\dot\theta'], feedback: '$\tfrac{d}{d\lambda}(r^2\dot\theta) = r^2\ddot\theta + 2r\dot r\dot\theta = r(r\ddot\theta + 2\dot r\dot\theta)$: the factor $2$ is $\nabla^{\mathrm{E}}$''s equation $\ddot\theta + \tfrac2r\dot r\dot\theta = 0$. For $\nabla^{\mathrm{E}}$, $r^2\dot\theta$ (angular momentum per unit mass) is conserved, the law of equal areas of a free particle.' }
      - { answer: ['\dot r\dot\theta'], feedback: 'Product rule: $\tfrac{d}{d\lambda}(\dot r\dot\theta) = \ddot r\dot\theta + \dot r\ddot\theta$, which contains no $r\ddot\theta$.' }
    hint: 'Product rule on $r\cdot\dot\theta$.'
    explanation: |
      $\tfrac{d}{d\lambda}(r\dot\theta) = \dot r\dot\theta + r\ddot\theta$. Together with $\ddot r = 0$:
      $$\dot r = c_1,\quad r\dot\theta = c_2$$
      with constants $c_1, c_2$.

  - type: text
    id: p1-frame-route
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: The same result without Γ's
    body: |
      The two constants have a meaning. The velocity is
      $$v_\gamma = \dot r\,\partial y_1 + \dot\theta\,\partial y_2,$$
      and with $\partial y_1 = e_1$, $\partial y_2 = r\,e_2$:
      $$v_\gamma = \dot r\,e_1 + r\dot\theta\,e_2.$$
      So $(\dot r,\ r\dot\theta)$ are the **frame components** of the velocity. Since $\nabla^{\mathrm{W}}$ differentiates only frame components,
      $$a_\gamma = \tfrac{d\dot r}{d\lambda}\,e_1 + \tfrac{d(r\dot\theta)}{d\lambda}\,e_2,$$
      and $a_\gamma = 0$ says exactly: both frame components are constant. (Converting back, $\tfrac{d(r\dot\theta)}{d\lambda}\,e_2 = (\ddot\theta + \tfrac1r\dot r\dot\theta)\,\partial y_2$, the equation built with $\Gamma^2_{21}$.)

      Solving: $r = c_1\lambda + r_0$ and $\dot\theta = c_2/r$. The velocity keeps a **fixed angle** to $e_1$, the radial direction: $\tan(\text{angle}) = c_2/c_1$.

  - type: mcq
    id: p1-cases
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: Which curves are straight?
    multiple: true
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ makes the unit radial and angular fields $e_1$, $e_2$ parallel. Its autoparallelly transported curves are exactly those with constant velocity frame components, $\dot r = c_1$ and $r\dot\theta = c_2$ (polar components $r(\lambda)$, $\theta(\lambda)$). Which curves are straightest curves of $\nabla^{\mathrm{W}}$? Select all.
    options:
      - text: 'Rays leaving the origin'
        correct: true
      - text: 'Circles about the origin'
        correct: true
      - text: 'Logarithmic spirals $r = r_*\,e^{m\theta}$, $m \neq 0$'
        correct: true
      - text: 'Straight lines that miss the origin'
        feedback: |
          Along the line $b = 1$ the angle between the velocity and the radial direction $e_1$ changes (from about $180°$ far left, to $90°$ at $(0,1)$, to about $0°$ far right), so the frame components cannot both be constant. These are the straightest curves of $\nabla^{\mathrm{E}}$, not of $\nabla^{\mathrm{W}}$.
      - text: 'Circles that do not have the origin as centre'
        feedback: |
          On such a circle the angle between the velocity and the radial direction varies (it is $90°$ only at the two points nearest to and farthest from the origin), so $(\dot r, r\dot\theta)$ cannot be constant.
    explanation: |
      Three cases of $\dot r = c_1$, $r\dot\theta = c_2$:
      - $c_2 = 0$: $\theta$ is constant, a **ray**;
      - $c_1 = 0$: $r = r_0$, a **circle** about the origin at constant speed;
      - both nonzero: along the curve (with $\theta$ continued continuously),
      $$\frac{dr}{d\theta} = \frac{\dot r}{\dot\theta} = \frac{c_1}{c_2}\,r,$$
      so $r = r_*\,e^{(c_1/c_2)\theta}$: a **logarithmic spiral**, which crosses every ray at the same angle. All three guesses were right.

  - type: numeric
    id: p1-spiral
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: Where the spiral goes
    prompt: |
      On the plane minus the origin, the straightest curves of $\nabla^{\mathrm{W}}$ keep their velocity frame components $\dot r = c_1$ and $r\dot\theta = c_2$ constant (polar components $r(\lambda)$, $\theta(\lambda)$). One starts at $(1,0)$ ($r = 1$, $\theta = 0$) with $c_1 = c_2 = 1$, i.e. at $45°$ to the radial direction. Find $r$ when the curve reaches the $b$-axis, $\theta = \pi/2$ (three decimals).
    answer: 4.810
    tolerance: 0.005
    answerText: '$e^{\pi/2} \approx 4.810$'
    wrong:
      - { value: 2.571, feedback: '$1 + \pi/2$ treats $r$ as linear in $\theta$ (an Archimedean spiral). But $dr/d\theta = \dot r/\dot\theta = c_1/(c_2/r) = r$: the growth rate is proportional to $r$ itself, so $r$ is exponential in $\theta$.' }
      - { value: 1, feedback: 'With $c_1 = 1 \neq 0$ the radius grows: $\dot r = 1$. Only $c_1 = 0$ gives a circle.' }
    hint: 'Divide the two equations: $dr/d\theta = \dot r/\dot\theta$ with $\dot\theta = c_2/r$.'
    explanation: |
      $\frac{dr}{d\theta} = \frac{1}{1/r} = r$, so $r = e^{\theta}$ and at $\theta = \pi/2$:
      $$r = e^{\pi/2} \approx 4.810.$$
      In terms of $\lambda$: $r = 1 + \lambda$, $\theta = \ln(1+\lambda)$; it reaches $\theta = \pi/2$ at $\lambda = e^{\pi/2} - 1 \approx 3.81$.

  - type: numeric
    id: p1-spiral-euclid
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: The spiral under ∇ᴱ
    prompt: |
      The curve with polar components $r(\lambda) = 1 + \lambda$, $\theta(\lambda) = \ln(1+\lambda)$ is a logarithmic spiral, autoparallelly transported under $\nabla^{\mathrm{W}}$. Under $\nabla^{\mathrm{E}}$, whose polar coefficients are $\Gamma^1_{22} = -r$ and $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$, the radial acceleration component is
      $$a^1_\gamma = \ddot r - r\,\dot\theta^2.$$
      Compute it at $\lambda = 1$.
    answer: -0.5
    wrong:
      - { value: 0, feedback: 'The spiral is straight for $\nabla^{\mathrm{W}}$, not for $\nabla^{\mathrm{E}}$. Here $\ddot r = 0$ but $\dot\theta = 1/(1+\lambda) = \tfrac12$ at $\lambda = 1$, so the centripetal term $-r\dot\theta^2 = -2\cdot\tfrac14$ survives.' }
      - { value: -1, feedback: 'At $\lambda = 1$, $r = 2$ and $\dot\theta = \tfrac12$, so $r\dot\theta^2 = 2\cdot\tfrac14 = \tfrac12$, not $1$.' }
      - { value: 0.5, feedback: 'Sign: $\Gamma^1_{22} = -r$ makes the term $-r\dot\theta^2$; the acceleration points toward the origin.' }
    hint: 'At $\lambda = 1$: $r = 2$, $\dot r = 1$, $\ddot r = 0$, $\dot\theta = 1/(1+\lambda)$.'
    explanation: |
      $$a^1_\gamma = 0 - 2\cdot\left(\tfrac12\right)^2 = -\tfrac12.$$
      Also $a^2_\gamma = \ddot\theta + \tfrac2r\dot r\dot\theta = -\tfrac14 + \tfrac12 = \tfrac14$. The acceleration is not along the velocity $(1, \tfrac12)$, so the spiral is not a straightest curve of $\nabla^{\mathrm{E}}$. Under $\nabla^{\mathrm{W}}$: $a^1 = \ddot r = 0$ and $a^2 = -\tfrac14 + \tfrac12\cdot1\cdot\tfrac12 = 0$.

  - type: mcq
    id: p1-flat-trap
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: Flat, yet spirals
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ is flat ($\mathrm{Riem} = 0$) and has torsion; its straightest curves include logarithmic spirals. Recall: a connection is flat and torsion free exactly when around every point there is a chart in which all its coefficients vanish, and then its straightest curves are straight lines in that chart. What does this say about $\nabla^{\mathrm{W}}$?
    options:
      - text: 'Nothing: the theorem needs flat **and** torsion free, and $\nabla^{\mathrm{W}}$ has torsion, so no chart makes all its coefficients vanish'
        correct: true
      - text: 'There is a chart in which all its coefficients vanish, because flatness alone guarantees one'
        feedback: |
          If all coefficients vanished in some chart, they would be symmetric there, so the torsion (a tensor, antisymmetric part of the $\Gamma$'s) would vanish in every chart. But $\nabla^{\mathrm{W}}$ has $\mathtt{T}(\,\cdot\,,e_1,e_2) = \tfrac1r\,e_2 \neq 0$.
      - text: 'The theorem is contradicted: a flat connection must have straight lines as its straightest curves'
        feedback: |
          Flatness is about vectors returning unchanged around loops, not about the shape of straightest curves. The theorem only covers connections that are flat and torsion free; $\nabla^{\mathrm{W}}$ is outside it.
    explanation: |
      Straightest curves see only the symmetric part of the coefficients. For $\nabla^{\mathrm{W}}$ in polar that is $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1{2r}$: a torsion-free connection with the same spirals, rays and circles as straightest curves. It is **curved**: the curvature formula gives
      $$\mathrm{Riem}^2_{112} = -\tfrac1{2r^2} + \tfrac1{4r^2} = -\tfrac1{4r^2}.$$
      Same straightest curves, one connection flat with torsion, the other curved without.

  - type: text
    id: p1-own
    tag: Problem 1 · Straightest curves of ∇ᵂ
    title: What you now own
    body: |
      - Setting: the plane (points $(a,b)$, polar chart $(r,\theta)$, $r = \sqrt{a^2+b^2}$, $\theta = \operatorname{atan2}(b,a)$) minus the origin; $e_1 = (a,b)/r$ and $e_2 = (-b,a)/r$ are the unit radial and angular fields; $\nabla^{\mathrm{W}}$ is the connection making $e_1,e_2$ parallel, $\nabla^{\mathrm{E}}$ the one differentiating cartesian components (polar coefficients $\Gamma^1_{22} = -r$, $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$); $\gamma(\lambda) = (r(\lambda),\theta(\lambda))$ is a curve with velocity $v_\gamma$, dots are $d/d\lambda$; $c_1,c_2,r_*$ are constants.
      - $\nabla^{\mathrm{W}}$ in polar: only $\Gamma^2_{21} = \tfrac1r$, so its straightest curves solve
      $$\ddot r = 0,$$
      $$\ddot\theta + \tfrac1r\,\dot r\dot\theta = 0.$$
      - Equivalently, the velocity frame components are constant:
      $$v_\gamma = \dot r\,e_1 + r\dot\theta\,e_2,$$
      $$\dot r = c_1,\quad r\dot\theta = c_2.$$
      - Solutions: rays ($c_2 = 0$), circles about the origin ($c_1 = 0$), logarithmic spirals $r = r_*e^{(c_1/c_2)\theta}$: every curve at a fixed angle to the radial direction.
      - Under $\nabla^{\mathrm{E}}$ the angular equation has $\tfrac2r$ and conserves $r^2\dot\theta$; under $\nabla^{\mathrm{W}}$ it has $\tfrac1r$ and conserves $r\dot\theta$.

      **Next:** fill the last box of the table, curved and with torsion, and see what straightest curves miss.

  # ---------------------------------------------------------------- Problem 2
  - type: text
    id: p2-setup
    tag: Problem 2 · The fourth box
    title: Curved and twisted
    body: |
      Sort connections by two tensors, $\mathrm{Riem}$ and $\mathtt{T}$:

      | | torsion free | with torsion |
      |---|---|---|
      | **flat** | $\nabla^{\mathrm{E}}$ | $\nabla^{\mathrm{W}}$ |
      | **curved** | $\nabla^{\kappa}$ | $\nabla^{\mathrm{F}}$ |

      $\nabla^{\mathrm{F}}$ ("F" for fourth) adds a constant twist to $\nabla^{\kappa}$: on the plane, for a number $\kappa$, its cartesian coefficients are
      $$\Gamma^1_{22} = \kappa\,a,\quad \Gamma^1_{12} = 1,\quad \Gamma^1_{21} = -1,$$
      all others zero. Its torsion is
      $$\mathtt{T}^1_{12} = \Gamma^1_{21} - \Gamma^1_{12} = -2,$$
      and the curvature formula gives
      $$\mathrm{Riem}^1_{212} = \kappa - (1)(-1) = \kappa + 1.$$
      Compare $\nabla^{\kappa}$: $\mathtt{T} = 0$ and $\mathrm{Riem}^1_{212} = \kappa$. What else changes, and what does not?

  - type: mcq
    id: p2-riem-rest
    tag: Problem 2 · The fourth box
    title: The other components
    multiple: true
    prompt: |
      On the plane, $\nabla^{\mathrm{F}}$ has the cartesian coefficients $\Gamma^1_{22} = \kappa\,a$, $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$, all others zero, and
      $$\begin{aligned}\mathrm{Riem}^i_{jkm} &= \partial x_k\lfloor\Gamma^i_{jm}\rceil - \partial x_m\lfloor\Gamma^i_{jk}\rceil\\ &\quad + \Gamma^i_{nk}\Gamma^n_{jm} - \Gamma^i_{nm}\Gamma^n_{jk}.\end{aligned}$$
      Which components are nonzero (for $\kappa \neq -1$)? Select all.
    options:
      - text: '$\mathrm{Riem}^1_{212}$'
        correct: true
      - text: '$\mathrm{Riem}^1_{221}$'
        correct: true
      - text: '$\mathrm{Riem}^2_{112}$'
        feedback: |
          Every term with upper index $2$ contains a $\Gamma^2_{\cdot\cdot}$ (differentiated, or as the first factor), and all of them vanish. Nonzero $\mathrm{Riem}^2_{112}$ happened for $\nabla^{\mathrm{E}}$ in **polar**, term by term, and even there the terms cancelled.
      - text: '$\mathrm{Riem}^1_{112}$'
        feedback: |
          $\mathrm{Riem}^1_{112} = \partial x_1\lfloor\Gamma^1_{12}\rceil - \partial x_2\lfloor\Gamma^1_{11}\rceil + \Gamma^1_{11}\Gamma^1_{12} - \Gamma^1_{12}\Gamma^1_{11}$: constants differentiate to $0$ and $\Gamma^1_{11} = 0$.
    explanation: |
      $\mathrm{Riem}^1_{212} = \kappa + 1$ and, by antisymmetry in the last two indices, $\mathrm{Riem}^1_{221} = -(\kappa+1)$; all others vanish. (Both nonzero components vanish together at $\kappa = -1$.)

  - type: numeric
    id: p2-ricci
    tag: Problem 2 · The fourth box
    title: Its Ricci curvature
    prompt: |
      On the plane, $\nabla^{\mathrm{F}}$ has exactly two nonzero curvature components, $\mathrm{Riem}^1_{212} = \kappa + 1$ and $\mathrm{Riem}^1_{221} = -(\kappa + 1)$. Its Ricci curvature is $\mathrm{Ric}_{ab} = \mathrm{Riem}^m_{amb}$ (sum over $m$: the upper index against the **second** lower index). For $\kappa = 3$, find $\mathrm{Ric}_{22}$.
    answer: 4
    wrong:
      - { value: -4, feedback: 'That contracts the upper index with the **last** lower index, $\mathrm{Riem}^m_{22m} = \mathrm{Riem}^1_{221}$. The definition sums over the second lower index: $\mathrm{Ric}_{22} = \mathrm{Riem}^1_{212} + \mathrm{Riem}^2_{222}$.' }
      - { value: 3, feedback: 'That is $\nabla^{\kappa}$''s value. The twist adds $1$: $\mathrm{Riem}^1_{212} = \kappa + 1 = 4$.' }
      - { value: 0, feedback: '$\mathrm{Ric}_{22} = \mathrm{Riem}^1_{212} + \mathrm{Riem}^2_{222}$, and the first term is $\kappa + 1 = 4$.' }
    hint: 'Write out $\mathrm{Ric}_{22} = \mathrm{Riem}^1_{212} + \mathrm{Riem}^2_{222}$.'
    explanation: |
      $\mathrm{Ric}_{22} = (\kappa + 1) + 0 = 4$. The other components vanish, so
      $$\mathrm{Ric} = (\kappa+1)\,dx^2\otimes dx^2.$$

  - type: numeric
    id: p2-flat
    tag: Problem 2 · The fourth box
    title: When the twist cancels the curve
    prompt: |
      On the plane, $\nabla^{\mathrm{F}}$ has the cartesian coefficients $\Gamma^1_{22} = \kappa\,a$, $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$ (all others zero); its only nonzero curvature components are $\mathrm{Riem}^1_{212} = \kappa + 1 = -\mathrm{Riem}^1_{221}$. For which value of $\kappa$ is $\nabla^{\mathrm{F}}$ flat?
    answer: -1
    wrong:
      - { value: 0, feedback: 'At $\kappa = 0$ the derivative term vanishes, but the quadratic term $-\Gamma^1_{12}\Gamma^1_{21} = +1$ remains: $\mathrm{Riem}^1_{212} = 1$. The twist alone curves the connection.' }
    explanation: |
      $\kappa + 1 = 0$ gives $\kappa = -1$: then $\nabla^{\mathrm{F}}$ is flat with torsion ($\mathtt{T}^1_{12} = -2$), a cousin of $\nabla^{\mathrm{W}}$, built from the curved $\nabla^{-1}$ by adding a twist.

  - type: mcq
    id: p2-autoparallel
    tag: Problem 2 · The fourth box
    title: Its straightest curves
    prompt: |
      On the plane, $\nabla^{\mathrm{F}}$ has the cartesian coefficients $\Gamma^1_{22} = \kappa\,a$, $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$, all others zero. Its autoparallelly transported curves solve $\ddot\gamma^k + \Gamma^k_{ji}\dot\gamma^i\dot\gamma^j = 0$ ($\gamma^1, \gamma^2$: cartesian components). What is the first equation?
    options:
      - text: '$\ddot\gamma^1 + \kappa\,\gamma^1(\dot\gamma^2)^2 = 0$, the same as for $\nabla^{\kappa}$'
        correct: true
      - text: '$\ddot\gamma^1 + \kappa\,\gamma^1(\dot\gamma^2)^2 - 2\,\dot\gamma^1\dot\gamma^2 = 0$'
        feedback: |
          $-2$ is the torsion $\mathtt{T}^1_{12}$. In the sum, both orderings appear with the same product: $(\Gamma^1_{12} + \Gamma^1_{21})\,\dot\gamma^1\dot\gamma^2 = (1 - 1)\,\dot\gamma^1\dot\gamma^2 = 0$. The antisymmetric part cancels.
      - text: '$\ddot\gamma^1 + \kappa\,\gamma^1(\dot\gamma^2)^2 + \dot\gamma^1\dot\gamma^2 = 0$'
        feedback: |
          That keeps only the term with $\Gamma^1_{12}$. The double sum over $i, j$ also contains $\Gamma^1_{21}\,\dot\gamma^1\dot\gamma^2 = -\dot\gamma^1\dot\gamma^2$, which cancels it.
    explanation: |
      $$\ddot\gamma^1 + \kappa\,a\,(\dot\gamma^2)^2 + (\Gamma^1_{12} + \Gamma^1_{21})\,\dot\gamma^1\dot\gamma^2 = 0$$
      with $\Gamma^1_{12} + \Gamma^1_{21} = 0$ and $a = \gamma^1$, plus $\ddot\gamma^2 = 0$. Exactly $\nabla^{\kappa}$'s equations: the same sinusoids $a = A\cos(\sqrt\kappa\,(b - b_0) + \psi)$ for $\kappa > 0$. The straightest curves see only the symmetric part.

  - type: numeric
    id: p2-transport
    tag: Problem 2 · The fourth box
    title: Same curves, different transport
    prompt: |
      On the plane, $\nabla^{\mathrm{F}}$ has the cartesian coefficients $\Gamma^1_{22} = \kappa\,a$, $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$, all others zero; take $\kappa = 1$. Transport $\mathcal{Z}$ with components $z(0) = (0,1)$ along the vertical line $\gamma(\lambda) = (1, \lambda)$ with
      $$\dot z^k + \Gamma^k_{ji}\,z^j\dot\gamma^i = 0.$$
      Find $z^1$ at $\lambda = 1$ (three decimals).
    answer: -0.632
    tolerance: 0.005
    answerText: '$e^{-1} - 1 \approx -0.632$'
    wrong:
      - { value: -1, feedback: 'That is $\nabla^{\kappa}$, where $\dot z^1 = -\kappa\,a\,z^2 = -1$. Here the twist adds $\Gamma^1_{12}\,z^1\dot\gamma^2 = z^1$: the equation is $\dot z^1 = -z^1 - 1$, whose solution decays toward $-1$ without reaching it.' }
      - { value: 0, feedback: 'With $\dot\gamma = (0, 1)$, the term $\Gamma^1_{22}\,z^2\dot\gamma^2 = \kappa\,a\cdot1\cdot1 = 1$ is nonzero, so $z^1$ starts to change at once.' }
    hint: |
      $\dot\gamma = (0,1)$, so only $i = 2$ contributes: $\dot z^1 = -\Gamma^1_{12}z^1 - \Gamma^1_{22}z^2$ and $z^2$ stays $1$. Solve $\dot z^1 = -z^1 - 1$, $z^1(0) = 0$, with $z^1 = Ce^{-\lambda} - 1$.
    explanation: |
      $z^2 = 1$ and $\dot z^1 = -z^1 - \kappa$, so
      $$z^1 = \kappa\,(e^{-\lambda} - 1),$$
      $-0.632$ at $\lambda = 1$, $\kappa = 1$. Under $\nabla^{\kappa}$, $z^1 = -\kappa\lambda = -1$. Same straightest curves, different transport: the torsion shows in how vectors are carried, not in which curves are straight.

  - type: mcq
    id: p2-moral
    tag: Problem 2 · The fourth box
    title: What straightest curves cannot see
    multiple: true
    prompt: |
      On the plane, $\nabla^{\kappa}$ (cartesian coefficient $\Gamma^1_{22} = \kappa\,a$ only) is torsion free with $\mathrm{Riem}^1_{212} = \kappa$, and $\nabla^{\mathrm{F}}$ (the same plus $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$) has $\mathtt{T}^1_{12} = -2$ and $\mathrm{Riem}^1_{212} = \kappa + 1$. Both have the straightest curves $\ddot\gamma^1 + \kappa\,\gamma^1(\dot\gamma^2)^2 = 0$, $\ddot\gamma^2 = 0$. Which statements are true? Select all.
    options:
      - text: 'Two connections with the same straightest curves can differ in torsion'
        correct: true
      - text: 'Two connections with the same straightest curves can differ in curvature'
        correct: true
      - text: 'At $\kappa = -1$ a flat connection shares its straightest curves with a curved one'
        correct: true
      - text: 'Curvature can be read off from the straightest curves alone'
        feedback: |
          $\nabla^{\kappa}$ and $\nabla^{\mathrm{F}}$ share every straightest curve, yet $\mathrm{Riem}^1_{212}$ is $\kappa$ for one and $\kappa + 1$ for the other. The curves fix only the symmetric part of the $\Gamma$'s; the curvature also involves the antisymmetric part (through the quadratic terms).
      - text: 'Torsion can be detected by watching which curves are straightest'
        feedback: |
          In $\Gamma^k_{ji}\dot\gamma^i\dot\gamma^j$ the product $\dot\gamma^i\dot\gamma^j$ is symmetric in $i, j$, so the antisymmetric part of the $\Gamma$'s (minus half the torsion) cancels. Torsion is seen by **transport**, e.g. $z^1 = \kappa(e^{-\lambda} - 1)$ versus $-\kappa\lambda$ along $(1,\lambda)$.
    explanation: |
      At $\kappa = -1$, $\nabla^{\mathrm{F}}$ is flat with torsion and $\nabla^{-1}$ is curved without torsion, yet their straightest curves coincide. This matters in physics: free particles follow straightest curves, so watching free fall alone determines only the symmetric part of the connection.

  - type: text
    id: p2-own
    tag: Problem 2 · The fourth box
    title: What you now own
    body: |
      - Setting: the plane with points $(a,b)$, cartesian basis fields $\partial x_1,\partial x_2$, $\kappa$ a constant, $dx^2$ the covector field giving the second cartesian component; $\nabla^{\kappa}$ has the single cartesian coefficient $\Gamma^1_{22} = \kappa a$; $\mathtt{T}$ is torsion, $\mathrm{Riem}$ curvature, $\mathrm{Ric}_{ab} = \mathrm{Riem}^m_{amb}$.
      - $\nabla^{\mathrm{F}}$: the connection with cartesian coefficients $\Gamma^1_{22} = \kappa\,a$, $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$ (all others $0$), with
      $$\mathtt{T}^1_{12} = -2,$$
      $$\mathrm{Riem}^1_{212} = \kappa + 1 = -\mathrm{Riem}^1_{221},$$
      $$\mathrm{Ric} = (\kappa+1)\,dx^2\otimes dx^2;$$
      flat at $\kappa = -1$.
      - Straightest curves use only the symmetric part:
      $$\ddot\gamma^1 + \kappa\,\gamma^1(\dot\gamma^2)^2 = 0,\quad \ddot\gamma^2 = 0,$$
      the same as $\nabla^{\kappa}$.
      - Transport sees the twist: along the line $\lambda\mapsto(1,\lambda)$ for $\nabla^{\mathrm{F}}$, from $z = (z^1,z^2) = (0,1)$,
      $$z^1 = \kappa\,(e^{-\lambda} - 1)$$
      instead of $-\kappa\lambda$.
      - Same straightest curves do not mean same torsion, nor same curvature.

      **Next:** a chart in which the flat, torsion-free $\nabla^{\mathrm{E}}$ has a nonzero coefficient, and coordinate lines that are not straight.

  # ---------------------------------------------------------------- Problem 3
  - type: text
    id: p3-setup
    tag: Problem 3 · The sheared chart
    title: Coordinate lines that bend
    body: |
      On the plane take $\nabla^{\mathrm{E}}$ (all cartesian coefficients zero) and the **sheared chart** $\mathscr{Y} = (u, v)$,
      $$u = a,\quad v = b - a^2,$$
      defined on the whole plane, with inverse $a = u$, $b = v + u^2$. Its coordinate curves are the vertical lines $u = \text{const}$ and the parabolas $v = \text{const}$, i.e. $b = a^2 + \text{const}$.

      Its basis fields, $\partial y_j = \frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^j}\,\partial x_i$ with $\frac{\partial\mathscr{X}^2}{\partial u} = 2u = 2a$:
      $$\partial y_1 = \partial x_1 + 2a\,\partial x_2,$$
      $$\partial y_2 = \partial x_2.$$
      **Guess:** are the coordinate curves of a chart always straightest curves of a flat, torsion-free connection? Is a nonzero coefficient a sign of curvature?

  - type: numeric
    id: p3-count
    tag: Problem 3 · The sheared chart
    title: How many coefficients survive?
    prompt: |
      On the plane, $\nabla^{\mathrm{E}}$ has all cartesian coefficients zero. In the sheared chart $\mathscr{Y} = (u,v) = (a,\ b - a^2)$ the basis fields are $\partial y_1 = \partial x_1 + 2a\,\partial x_2$ and $\partial y_2 = \partial x_2$, and $\nabla^{\mathrm{E}}$ differentiates cartesian components. Of the eight coefficients $(\Gamma^{\mathrm{E}}_\mathscr{Y})^i_{jk}$, defined by $\nabla^{\mathrm{E}}_{\partial y_k}\partial y_j = \Gamma^i_{jk}\,\partial y_i$, how many are nonzero?
    answer: 1
    wrong:
      - { value: 0, feedback: 'The $\Gamma$''s are not tensor components: zero in the cartesian chart does not force zero here. $\partial y_1$ has the non-constant cartesian component $2a$, and $\partial y_1\lfloor 2a\rceil = 2$.' }
      - { value: 3, feedback: 'Check each pair separately. $\nabla^{\mathrm{E}}_{\partial y_2}\partial y_1$ differentiates $(1, 2a)$ along $\partial x_2 = \partial/\partial b$, which gives $0$: $2a$ does not depend on $b$. Only differentiating along $\partial y_1$ hits the $a$-dependence.' }
      - { value: 2, feedback: 'In polar, $\nabla^{\mathrm{E}}$ has the symmetric pair $\Gamma^2_{12} = \Gamma^2_{21}$. Here $\nabla^{\mathrm{E}}_{\partial y_2}\partial y_1 = \partial x_2\lfloor 2a\rceil\,\partial x_2 = 0$ and $\nabla^{\mathrm{E}}_{\partial y_1}\partial y_2 = \nabla^{\mathrm{E}}_{\partial y_1}\partial x_2 = 0$.' }
    hint: 'Compute the four derivatives $\nabla^{\mathrm{E}}_{\partial y_k}\partial y_j$ by differentiating the cartesian components $(1, 2a)$ and $(0, 1)$.'
    explanation: |
      Directly: only
      $$\nabla^{\mathrm{E}}_{\partial y_1}\partial y_1 = \partial y_1\lfloor 2a\rceil\,\partial x_2 = 2\,\partial y_2$$
      is nonzero, so $\Gamma^2_{11} = 2$ and the other seven vanish.

      By the transformation law: with $\Gamma_\mathscr{X} = 0$ only the second-derivative term survives,
      $$(\Gamma_\mathscr{Y})^i_{jk} = \frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^s}\,\frac{\partial^2\mathscr{X}^s}{\partial\mathscr{Y}^k\partial\mathscr{Y}^j}.$$
      Of $\mathscr{X} = (u,\ v + u^2)$ only $\partial^2\mathscr{X}^2/\partial u^2 = 2$ is nonzero, and $\partial v/\partial b = 1$, $\partial u/\partial b = 0$: again only $\Gamma^2_{11} = 2$.

  - type: build
    id: p3-equation
    tag: Problem 3 · The sheared chart
    title: Straight lines in sheared coordinates
    prompt: |
      On the plane, $\nabla^{\mathrm{E}}$ has in the sheared chart $\mathscr{Y} = (u,v) = (a,\ b - a^2)$ the single nonzero coefficient $\Gamma^2_{11} = 2$. A curve with $\mathscr{Y}$ components $u(\lambda)$, $v(\lambda)$ is autoparallelly transported when $\ddot\gamma^k + \Gamma^k_{ji}\dot\gamma^i\dot\gamma^j = 0$. The first equation is $\ddot u = 0$. Build the second.
    prefix: '0 = \ddot v +'
    tiles: ['2\,\dot u^2', '4\,\dot u\dot v', '2\,\dot u\dot v', '2u\,\dot u^2']
    answers:
      - ['2\,\dot u^2']
    wrong:
      - { answer: ['4\,\dot u\dot v'], feedback: 'The coefficient is $\Gamma^2_{11}$, both lower indices $1$: it multiplies $\dot\gamma^1\dot\gamma^1 = \dot u^2$. A mixed product $\dot u\dot v$ would need $\Gamma^2_{12}$ or $\Gamma^2_{21}$, both zero.' }
      - { answer: ['2\,\dot u\dot v'], feedback: 'The coefficient is $\Gamma^2_{11}$, so the product is $\dot\gamma^1\dot\gamma^1 = \dot u^2$, not $\dot u\dot v$.' }
      - { answer: ['2u\,\dot u^2'], feedback: '$2a = 2u$ is the cartesian component of $\partial y_1$, not a coefficient. Differentiating it along $\partial y_1$ gives the constant $\Gamma^2_{11} = 2$.' }
    hint: 'Only $(j,i) = (1,1)$ has a nonzero coefficient.'
    explanation: |
      $$\ddot u = 0,$$
      $$\ddot v + 2\,\dot u^2 = 0.$$
      These are the straight lines of the plane, written in $u, v$.

  - type: mcq
    id: p3-which
    tag: Problem 3 · The sheared chart
    title: Which curves are straight?
    multiple: true
    prompt: |
      On the plane, in the sheared chart $\mathscr{Y} = (u,v) = (a,\ b - a^2)$, the autoparallelly transported curves of $\nabla^{\mathrm{E}}$ solve $\ddot u = 0$ and $\ddot v + 2\,\dot u^2 = 0$. Which of these curves (given by their $\mathscr{Y}$ components, $c$ a constant) solve them? Select all.
    options:
      - text: '$u = c$, $v = \lambda$ (a coordinate curve)'
        correct: true
      - text: '$u = \lambda$, $v = \lambda - \lambda^2$'
        correct: true
      - text: '$u = \lambda$, $v = c$ (a coordinate curve)'
        feedback: |
          $\ddot v + 2\,\dot u^2 = 0 + 2 = 2 \neq 0$. In the plane this is the parabola $b = a^2 + c$; its $\mathscr{Y}$ components are linear in $\lambda$, but that makes it straight only for a connection whose coefficients vanish in $\mathscr{Y}$, and $\nabla^{\mathrm{E}}$'s do not.
      - text: '$u = \lambda$, $v = \lambda$'
        feedback: |
          $\ddot v + 2\,\dot u^2 = 0 + 2 \neq 0$. In the plane: $a = \lambda$, $b = v + u^2 = \lambda + \lambda^2$, a parabola.
    explanation: |
      - $u = c$, $v = \lambda$: $\ddot u = 0$, $\ddot v + 0 = 0$. In the plane, the vertical line $a = c$.
      - $u = \lambda$, $v = \lambda - \lambda^2$: $\ddot v = -2$ and $2\,\dot u^2 = 2$, sum $0$. In the plane $b = v + u^2 = \lambda$: the line $b = a$.

      One family of coordinate curves is straight, the other is not. Being a coordinate line is a property of the chart; being straight is a property of the connection.

  - type: numeric
    id: p3-tangent
    tag: Problem 3 · The sheared chart
    title: A line touching a parabola
    prompt: |
      On the plane, take the straight line $\gamma(\lambda) = (1 + \lambda,\ 1 + 2\lambda)$ (cartesian components). In the sheared chart $\mathscr{Y} = (u,v) = (a,\ b - a^2)$ it starts at $(u,v) = (1, 0)$. Find $\dot v$ at $\lambda = 0$.
    answer: 0
    wrong:
      - { value: 2, feedback: '$2$ is $\dot b$. But $v = b - a^2$ also changes with $a$: $\dot v = \dot b - 2a\,\dot a = 2 - 2\cdot1\cdot1 = 0$.' }
      - { value: 1, feedback: 'Differentiate $v = b - a^2$ along the curve: $\dot v = \dot b - 2a\,\dot a$, with $a = 1$, $\dot a = 1$, $\dot b = 2$.' }
    hint: 'Chain rule: $\dot v = \dot b - 2a\,\dot a$.'
    explanation: |
      $\dot v = 2 - 2 = 0$ and $\dot u = 1$. So at $\lambda = 0$ the line has the same point $(1,0)$ and the same velocity $(1,0)$ in $\mathscr{Y}$ as the coordinate curve $u = 1 + \lambda$, $v = 0$: the line is **tangent** to the parabola $b = a^2$ at $(1,1)$.

  - type: mcq
    id: p3-same-start
    tag: Problem 3 · The sheared chart
    title: Same start, two curves
    prompt: |
      On the plane with $\nabla^{\mathrm{E}}$, in the sheared chart $\mathscr{Y} = (u,v) = (a,\ b - a^2)$, two curves start at $(u,v) = (1,0)$ with the same velocity components $(1,0)$: the coordinate curve $u = 1 + \lambda$, $v = 0$ (the parabola $b = a^2$) and the straight line $(a,b) = (1 + \lambda, 1 + 2\lambda)$, for which $v = -\lambda^2$. The straightest-curve equations in $\mathscr{Y}$ are $\ddot u = 0$, $\ddot v + 2\,\dot u^2 = 0$. Which is autoparallelly transported?
    options:
      - text: 'Only the straight line: $\ddot v = -2$ balances $2\,\dot u^2 = 2$'
        correct: true
      - text: 'Only the coordinate curve, since its components are linear in $\lambda$'
        feedback: |
          For $v = 0$: $\ddot v + 2\,\dot u^2 = 2 \neq 0$. Components linear in $\lambda$ mean zero acceleration only when all coefficients vanish in that chart; here $\Gamma^2_{11} = 2$.
      - text: 'Both, since they start at the same point with the same velocity'
        feedback: |
          The equations are second order: a point and a velocity fix **one** solution. These two curves share point and velocity, so at most one of them can solve the equations, and the coordinate curve gives $2 \neq 0$.
    explanation: |
      For the line, $u = 1 + \lambda$ and $v = b - a^2 = 1 + 2\lambda - (1+\lambda)^2 = -\lambda^2$:
      $$\ddot v + 2\,\dot u^2 = -2 + 2 = 0.$$
      Point and velocity fix the straightest curve uniquely, and it is the line, not the parabola it touches.

  - type: mcq
    id: p3-flat
    tag: Problem 3 · The sheared chart
    title: A coefficient is not a curvature
    prompt: |
      On the plane, $\nabla^{\mathrm{E}}$ has in the sheared chart $\mathscr{Y} = (u,v) = (a,\ b - a^2)$ the single nonzero coefficient $\Gamma^2_{11} = 2$, a constant. What are its torsion and curvature?
    options:
      - text: 'Both zero: $\Gamma^2_{11}$ has equal lower indices, and every term of $\mathrm{Riem}$ vanishes'
        correct: true
      - text: 'Torsion zero, but curved, because a coefficient survives in this chart'
        feedback: |
          Curvature is computed, not read off a coefficient. $\mathrm{Riem}^2_{112} = \partial y_1\lfloor\Gamma^2_{12}\rceil - \partial y_2\lfloor\Gamma^2_{11}\rceil + \Gamma^2_{n1}\Gamma^n_{12} - \Gamma^2_{n2}\Gamma^n_{11} = 0 - 0 + 0 - 0$: the constant $2$ differentiates to zero and each product has a vanishing factor.
      - text: 'Torsion nonzero, since $\Gamma^2_{11}$ has no partner $\Gamma^2_{11}$ with swapped indices to cancel it'
        feedback: |
          Swapping the two lower indices of $\Gamma^2_{11}$ gives $\Gamma^2_{11}$ itself: $\mathtt{T}^2_{11} = \Gamma^2_{11} - \Gamma^2_{11} = 0$. Torsion components with equal lower indices always vanish.
      - text: 'It depends on the chart: flat in $\mathscr{X}$, curved in $\mathscr{Y}$'
        feedback: |
          $\mathrm{Riem}$ and $\mathtt{T}$ are tensors: zero in one chart means zero in every chart. Only the $\Gamma$'s depend on the chart.
    explanation: |
      $\mathtt{T} = 0$ and $\mathrm{Riem} = 0$ in $\mathscr{Y}$, as they must be, since both vanish in $\mathscr{X}$. This matches the theorem: flat and torsion free means **some** chart (here the cartesian one) has all coefficients zero, not every chart.

  - type: text
    id: p3-own
    tag: Problem 3 · The sheared chart
    title: What you now own
    body: |
      - Setting: the plane with points $(a,b)$, cartesian chart $\mathscr{X}$, $\nabla^{\mathrm{E}}$ the connection differentiating cartesian components. Sheared chart $\mathscr{Y} = (u,v)$ with $u = a$, $v = b - a^2$, basis fields $\partial y_1 = \partial/\partial u$, $\partial y_2 = \partial/\partial v$, $\partial x_i$ the cartesian ones:
      $$\partial y_1 = \partial x_1 + 2a\,\partial x_2,\quad \partial y_2 = \partial x_2;$$
      $\nabla^{\mathrm{E}}$ has the single coefficient
      $$\Gamma^2_{11} = \frac{\partial\mathscr{Y}^2}{\partial\mathscr{X}^s}\frac{\partial^2\mathscr{X}^s}{\partial u^2} = 2.$$
      - Straight lines in $\mathscr{Y}$:
      $$\ddot u = 0,\quad \ddot v + 2\,\dot u^2 = 0.$$
      - The vertical coordinate lines are straight, the parabolas $v = c$ are not, though both are coordinate curves. The line $b = a$ reads $u = \lambda$, $v = \lambda - \lambda^2$.
      - Point plus velocity fix one straightest curve: the tangent line at $(1,1)$, $v = -\lambda^2$, beats the parabola it touches.
      - $\Gamma \neq 0$ in a chart, yet $\mathtt{T} = 0$ and $\mathrm{Riem} = 0$: flat and torsion free means some chart with all $\Gamma = 0$, not every chart.

  # ---------------------------------------------------------------- Problem 4
  - type: text
    id: p4-setup
    tag: Problem 4 · The difference is a tensor
    title: Two non-tensors
    body: |
      Neither of our two flat connections has tensor coefficients. On the plane, $\nabla^{\mathrm{E}}$ has all cartesian coefficients $0$, yet in the polar chart
      $$(\Gamma^{\mathrm{E}}_\mathscr{Y})^1_{22} = -r,$$
      $$(\Gamma^{\mathrm{E}}_\mathscr{Y})^2_{12} = (\Gamma^{\mathrm{E}}_\mathscr{Y})^2_{21} = \tfrac1r.$$
      A tensor that vanishes in one chart vanishes in all, so these cannot be tensor components. $\nabla^{\mathrm{W}}$ (unit radial and angular fields $e_1, e_2$ declared parallel, plane minus the origin) has the single polar coefficient $(\Gamma^{\mathrm{W}}_\mathscr{Y})^2_{21} = \tfrac1r$, but four nonzero cartesian ones.

      Now subtract. For vector fields $\mathcal{X}$ (the direction) and $\mathcal{Y}$ on the plane minus the origin, define
      $$\mathcal{Q}(\mathcal{X},\mathcal{Y}) := \nabla^{\mathrm{W}}_\mathcal{X}\mathcal{Y} - \nabla^{\mathrm{E}}_\mathcal{X}\mathcal{Y},$$
      a vector field. We call it $\mathcal{Q}$, a fresh letter: $D$ would suggest "derivative", and an earlier $D$ (the derivative of a first component) was exactly a machine that failed to be a tensor.

      **Guess:** a difference of two non-tensors. Is $\mathcal{Q}$ a tensor field, or is it as chart-sensitive as each $\Gamma$?

  - type: build
    id: p4-leibniz
    tag: Problem 4 · The difference is a tensor
    title: The Leibniz terms meet
    prompt: |
      On the plane minus the origin, $\mathcal{Q}(\mathcal{X},\mathcal{Y}) := \nabla^{\mathrm{W}}_\mathcal{X}\mathcal{Y} - \nabla^{\mathrm{E}}_\mathcal{X}\mathcal{Y}$. Each connection obeys the Leibniz rule: for a smooth function $g$,
      $$\nabla_\mathcal{X}(g\mathcal{Y}) = \mathcal{X}\lfloor g\rceil\,\mathcal{Y} + g\,\nabla_\mathcal{X}\mathcal{Y}.$$
      Build $\mathcal{Q}(\mathcal{X}, g\mathcal{Y})$.
    prefix: '\mathcal{Q}(\mathcal{X},g\mathcal{Y}) ='
    tiles: ['g\,\mathcal{Q}(\mathcal{X},\mathcal{Y})', '+\,\mathcal{X}\lfloor g\rceil\mathcal{Y}', '+\,2\,\mathcal{X}\lfloor g\rceil\mathcal{Y}', '\mathcal{X}\lfloor g\rceil\,\mathcal{Q}(\mathcal{X},\mathcal{Y})']
    answers:
      - ['g\,\mathcal{Q}(\mathcal{X},\mathcal{Y})']
    wrong:
