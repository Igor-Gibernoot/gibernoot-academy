    title: What survives
    prompt: |
      On the plane, $\nabla^{\kappa}$ with $\kappa = 2$ has, in the chart $u = (a - 1) + b^2$, $v = b$, the single coefficient
      $$(\Gamma_\mathscr{Y})^1_{22} = 2u - 2v^2,$$
      which vanishes at $p = (1,0)$, where $u = v = 0$. Using
      $$\begin{aligned}\mathrm{Riem}^i_{jkm} &= \partial y_k\lfloor\Gamma^i_{jm}\rceil - \partial y_m\lfloor\Gamma^i_{jk}\rceil\\ &\quad + \Gamma^i_{nk}\Gamma^n_{jm} - \Gamma^i_{nm}\Gamma^n_{jk}\end{aligned}$$
      in this chart ($\partial y_1 = \partial/\partial u$), compute $\mathrm{Riem}^1_{212}$ at $p$.
    answer: 2
    wrong:
      - { value: 0, feedback: 'All $\Gamma$''s vanish at $p$, so the quadratic terms do; but $\mathrm{Riem}$ also contains **derivatives** of the $\Gamma$''s, and $\partial y_1\lfloor 2u - 2v^2\rceil = 2$ at $p$.' }
      - { value: -2, feedback: 'The derivative term with the plus sign is $\partial y_1\lfloor\Gamma^1_{22}\rceil$ (here $k = 1$, $m = 2$); the minus term $\partial y_2\lfloor\Gamma^1_{21}\rceil$ vanishes, since $\Gamma^1_{21} = 0$.' }
    hint: 'With $i = 1$, $j = 2$, $k = 1$, $m = 2$, the first term is $\partial y_1\lfloor\Gamma^1_{22}\rceil$.'
    explanation: |
      $$\mathrm{Riem}^1_{212} = \partial_u(2u - 2v^2) - 0 + 0 - 0 = 2 = \kappa.$$
      It had to be: $\mathrm{Riem}$ is a tensor, the Jacobians at $p$ are the identity, so its components at $p$ are the same in both charts, $\kappa$. A tensor that is nonzero at $p$ is nonzero in every chart. So no chart can make the $\Gamma$'s vanish on a whole neighbourhood of $p$: there $\mathrm{Riem}$ (built from the $\Gamma$'s and their derivatives) would vanish too.

  - type: mcq
    id: p5-what
    tag: Problem 5 · Normal coordinates
    title: What a chart can remove
    multiple: true
    prompt: |
      A chart change alters connection coefficients by the inhomogeneous term $\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^s}\frac{\partial^2\mathscr{X}^s}{\partial\mathscr{Y}^k\partial\mathscr{Y}^j}$, which is symmetric in $j, k$. On the plane, $\nabla^{\kappa}$ (cartesian $\Gamma^1_{22} = \kappa\,a$, $\kappa \neq 0$) is torsion free with $\mathrm{Riem}^1_{212} = \kappa$; $\nabla^{\mathrm{W}}$ (unit radial and angular fields parallel) is flat with nonzero torsion. Which can a suitable chart make vanish? Select all.
    options:
      - text: 'The symmetric part $\Gamma^i_{(jk)}$ of any connection, at one chosen point $p$'
        correct: true
      - text: 'All eight coefficients of $\nabla^{\kappa}$ at $p = (1,0)$'
        correct: true
      - text: 'All coefficients of $\nabla^{\kappa}$ on a whole neighbourhood of $p$'
        feedback: |
          Then $\mathrm{Riem}$, built from the $\Gamma$'s and their derivatives, would vanish on that neighbourhood. But $\mathrm{Riem}^1_{212} = \kappa \neq 0$ is a tensor component: nonzero in one chart means nonzero in every chart.
      - text: 'All coefficients of $\nabla^{\mathrm{W}}$ at a point'
        feedback: |
          The inhomogeneous term is symmetric in $j, k$, so it cannot touch the antisymmetric part $\tfrac12(\Gamma^i_{jk} - \Gamma^i_{kj}) = -\tfrac12\mathtt{T}^i_{jk}$, a tensor. $\nabla^{\mathrm{W}}$ has $\mathtt{T}^2_{12} = \tfrac1r \neq 0$ in polar, so some coefficient survives at every point.
      - text: '$\mathrm{Riem}^1_{212}$ of $\nabla^{\kappa}$ at $p$'
        feedback: |
          $\mathrm{Riem}$ is a tensor: its components at $p$ change by Jacobians, never from nonzero to zero. In the chart that kills every $\Gamma$ at $p$, $\mathrm{Riem}^1_{212}(p) = \partial_u\big(\kappa(u - \tfrac\kappa2v^2)\big) = \kappa$.
    explanation: |
      At one point a chart removes exactly the symmetric part of the $\Gamma$'s. What it cannot remove are tensors: the torsion (the antisymmetric part) and the curvature (built from **derivatives** of the $\Gamma$'s). The construction is the **normal coordinates** at $p$ (one common construction; another one builds them from the straightest curves through $p$).

  - type: text
    id: p5-physics
    tag: Problem 5 · Normal coordinates
    title: The equivalence principle
    body: |
      In the chart $(u,v)$ at $p$, the straightest-curve equation $\ddot\gamma^k + \Gamma^k_{ji}\dot\gamma^i\dot\gamma^j = 0$ reads, **at $p$**,
      $$\ddot\gamma^k = 0.$$
      
      No acceleration at all, as in empty space. This is the cabin: in free fall, gravity disappears at a point.

      The curvature is still there. Around a small loop of area $A$ (counterclockwise) near $p$, a transported vector changes by
      $$\Delta z^1 \approx -\mathrm{Riem}^1_{212}\,z^2\,A,$$
      and neighbouring straightest curves bend toward or away from each other. These are the crumbs drifting: **tidal effects are curvature**, and no choice of falling frame removes them.

      This is the **equivalence principle**: locally (at a point), gravity looks like no gravity; what remains, the tides, is a tensor. Later levels make it physics: the metric (Level 7), gravity as a connection (Level 9), general relativity (Level 10).

  - type: text
    id: p5-own
    tag: Problem 5 · Normal coordinates
    title: What you now own
    body: |
      - Setting: $\nabla$ is a torsion-free connection and $p$ a point; $\bar x^i$ are the coordinates of any chart that vanish at $p$, $\Gamma^i_{(jk)}(p) := \tfrac12\big(\Gamma^i_{jk} + \Gamma^i_{kj}\big)(p)$ the symmetric part of the coefficients of $\nabla$ in that chart at $p$; $\nabla^{\kappa}$ is the connection on the plane (points $(a,b)$) with single cartesian coefficient $\Gamma^1_{22} = \kappa a$ ($\kappa$ a nonzero constant), and $p = (1,0)$.
      - Normal coordinates at $p$, with $\bar x^i$ vanishing at $p$:
      $$\mathscr{Y}^i = \bar x^i + \tfrac12\,\Gamma^i_{(jk)}(p)\,\bar x^j\bar x^k.$$
      - For $\nabla^{\kappa}$ at $p = (1,0)$:
      $$u = (a - 1) + \tfrac\kappa2\,b^2,\quad v = b,$$
      $$a = 1 + u - \tfrac\kappa2\,v^2,$$
      and $\partial^2a/\partial v^2 = -\kappa$ cancels $\Gamma^1_{22}(p) = \kappa$.
      - The single coefficient in $(u,v)$:
      $$(\Gamma_\mathscr{Y})^1_{22} = \kappa\big(u - \tfrac\kappa2v^2\big),$$
      zero at $p$ only.
      - What survives: $\mathrm{Riem}^1_{212} = \kappa$ (a tensor), and for connections with torsion the antisymmetric part $-\tfrac12\mathtt{T}^i_{jk}$.
      - Equivalence principle: gravity vanishes at a point in free fall; tides are curvature.

  # ---------------------------------------------------------------- Wrap-up
  - type: text
    id: wrap-up
    title: What you now own
    body: |
      Five problems, one level. Setting: the plane has points $(a,b)$, $r = \sqrt{a^2+b^2}$, cartesian and polar charts; $\nabla^{\mathrm{E}}$ differentiates cartesian components (all cartesian $\Gamma = 0$); $\nabla^{\mathrm{W}}$ (plane minus the origin) makes the unit radial and angular fields parallel; $\nabla^{\kappa}$ has the single cartesian coefficient $\Gamma^1_{22} = \kappa a$ ($\kappa$ a constant); $\mathcal{X},\mathcal{Y}$ are vector fields, $g$ a smooth function, $\gamma$ a curve with dots $= d/d\lambda$, $\mathtt{T}$ torsion, $\mathrm{Riem}$ curvature. The formulas to keep:

      **1. Straightest curves of $\nabla^{\mathrm{W}}$** (polar):
      $$\ddot r = 0,$$
      $$\ddot\theta + \tfrac1r\,\dot r\,\dot\theta = 0,$$
      solved by rays, circles and logarithmic spirals
      $$r = r_*\,e^{(c_1/c_2)\theta}.$$
      **2. The fourth box** $\nabla^{\mathrm{F}}$ (cartesian coefficients $\Gamma^1_{22} = \kappa a$, $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$, others $0$):
      $$\mathtt{T}^1_{12} = -2,$$
      $$\mathrm{Riem}^1_{212} = \kappa + 1,$$
      same straightest curves as $\nabla^{\kappa}$, different transport.

      **3. Sheared chart** $(u,v)$ with $u = a$, $v = b - a^2$, for $\nabla^{\mathrm{E}}$ (coefficients in that chart):
      $$\Gamma^2_{11} = 2,$$
      $$\ddot u = 0,\quad \ddot v + 2\,\dot u^2 = 0;$$
      a nonzero $\Gamma$ with $\mathtt{T} = 0$ and $\mathrm{Riem} = 0$.

      **4. Difference of connections**, a $(1,2)$-tensor field:
      $$\mathcal{Q} := \nabla^{\mathrm{W}} - \nabla^{\mathrm{E}},$$
      $$\mathcal{Q}(\mathcal{X},g\mathcal{Y}) = g\,\mathcal{Q}(\mathcal{X},\mathcal{Y}),$$
      $$\mathtt{T}^{\mathrm{W}\,i}_{jk} = Q^i_{kj} - Q^i_{jk}.$$
      **5. Normal coordinates** $(u,v)$ for $\nabla^{\kappa}$ at $p = (1,0)$ ($\Gamma_\mathscr{Y}$ = coefficients in the chart $\mathscr{Y} = (u,v)$):
      $$u = (a - 1) + \tfrac\kappa2\,b^2,\quad v = b,$$
      $$(\Gamma_\mathscr{Y})^i_{jk}(p) = 0,$$
      $$\mathrm{Riem}^1_{212} = \kappa.$$
      The thread: $\Gamma$'s depend on the chart; torsion and curvature do not.

      **Next, Level 7: the metric.** So far a connection was a free choice: $\nabla^{\mathrm{E}}$, $\nabla^{\mathrm{W}}$, $\nabla^{\kappa}$, any of them plus any tensor. A ruler that measures lengths and angles changes that. Which connection does a ruler pick? The answer will be a single one, torsion free and keeping lengths of transported vectors: the **Levi-Civita connection**.
