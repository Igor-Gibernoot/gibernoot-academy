id: ch06-torsion-curvature
title: Torsion and Curvature · Part 1
kind: concept
own: |
  **The hook.** On the plane (points $(a,b)$, cartesian chart with basis fields $\partial x_1,\partial x_2$, $r := \sqrt{a^2+b^2}$) take three connections: $\nabla^{\mathrm{E}}$, all cartesian coefficients $0$; $\nabla^{\mathrm{W}}$, on the plane minus the origin, for which the unit radial and angular fields $e_1 = (a,b)/r$, $e_2 = (-b,a)/r$ are parallel; $\nabla^{\kappa}$, with $\kappa>0$ a constant, whose only nonzero cartesian coefficient is $\Gamma^1_{22} = \kappa a$. Carried once around the rectangle $[1,2]\times[0,1]$ from $(0,1)$, $\nabla^{\mathrm{E}}$ and $\nabla^{\mathrm{W}}$ bring every vector back, while $\nabla^{\kappa}$ does not ($\Delta z^1 = -1$): curvature, the subject of the next part. Torsion played no part in that mismatch.

  Notation: $f$ is a smooth function, $\mathcal{X},\mathcal{Y},\mathcal{Z}$ are vector fields with components $x^k$, $\tilde x^k$ in a chart, $\mathsf{X}$ is a covector field, $\mathcal{X}\lfloor f\rceil$ is the derivative of $f$ along $\mathcal{X}$, $\mathsf{X}\lceil\mathcal{Y}\rfloor$ the covector evaluated on the vector, $\Gamma^i_{jk}$ the coefficients of $\nabla$ (last lower index = direction), implicit sums over repeated indices.

  - **Commutator** (a vector field: the second derivatives cancel):
  {{ $$[\mathcal{X},\mathcal{Y}]\lfloor f\rceil := \mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil - \mathcal{Y}\lfloor\mathcal{X}\lfloor f\rceil\rceil$$ }}
  $$[\mathcal{X},\mathcal{Y}]^k = \mathcal{X}\lfloor\tilde x^k\rceil - \mathcal{Y}\lfloor x^k\rceil$$
  $$[\partial x_j,\partial x_k] = 0$$
  - **Torsion**, a $(1,2)$-tensor field, antisymmetric in its vector slots; torsion free $\iff$ $\Gamma^i_{jk} = \Gamma^i_{kj}$:
  {{ $$\begin{aligned}&\mathtt{T}(\mathsf{X},\mathcal{X},\mathcal{Y})\\ &:= \mathsf{X}\lceil\nabla_\mathcal{X}\mathcal{Y} - \nabla_\mathcal{Y}\mathcal{X} - [\mathcal{X},\mathcal{Y}]\rfloor\end{aligned}$$ }}
  {{ $$\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}$$ }}
  - **Examples**: $\nabla^{\mathrm{E}}$ and $\nabla^{\kappa}$ are torsion free (symmetric $\Gamma$'s); $\nabla^{\mathrm{W}}$ is flat but has $\mathtt{T}^1_{12} = -\tfrac b{r^2}$, $\mathtt{T}^2_{12} = \tfrac a{r^2}$, because its parallel frame $e_1,e_2$ does not commute, $[e_1,e_2] = -\tfrac1r e_2$. A connection with straight autoparallels can still have torsion (cartesian $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$ gives $\mathtt{T}^1_{12} = -2$).


cards:
  - type: text
    id: hook
    title: Once around a loop
    body: |
      Recall: a connection $\nabla$ carries a vector along a curve $\gamma$ by the **transport equation**
      $$\dot z^k + \Gamma^k_{ji}\,z^j\,\dot\gamma^i = 0,$$
      where $z^k$ are the components of the carried vector, $\dot\gamma^i$ those of the velocity (dot $= d/d\lambda$), and the coefficients are fixed by $\nabla_{\partial x_i}\partial x_j = \Gamma^k_{ji}\,\partial x_k$ (last lower index = direction).

      On the plane, with points $(a,b)$, cartesian basis fields $\partial x_1, \partial x_2$ and $r := \sqrt{a^2+b^2}$, take three connections:
      - $\nabla^{\mathrm{E}}$: all cartesian coefficients vanish, so transport keeps the **cartesian** components.
      - $\nabla^{\mathrm{W}}$ (plane minus the origin): it declares the unit radial and angular fields
      $$e_1 := \tfrac1r(a\,\partial x_1 + b\,\partial x_2)$$
      $$e_2 := \tfrac1r(-b\,\partial x_1 + a\,\partial x_2)$$
      parallel, so transport keeps the components along $e_1, e_2$: the vector turns with the polar angle.
      - $\nabla^{\kappa}$, for a constant $\kappa > 0$: a single nonzero cartesian coefficient, $\Gamma^1_{22} = \kappa\,a$, i.e. $\nabla^{\kappa}_{\partial x_2}\partial x_2 = \kappa\,a\,\partial x_1$.

      **Before any theory, guess.** Carry a vector once counterclockwise around a small rectangle. For which of the three does it come back to itself? Keep your guess.

  - type: widget
    id: loop-kappa
    title: Carry a vector around a rectangle
    widget: parallel-transport
    config:
      curve: { type: rectangle, x0: 1, x1: 2, b0: 0, b1: 1 }
      connection: kappa
      connections: [kappa, E]
      kappa: 1
      z0: [0, 1]
      holonomy: false
      showAcceleration: false
      view: { x: -1.6, y: -0.9, w: 4.6, h: 4.6 }
    body: |
      The gold point runs counterclockwise around the rectangle $[1,2]\times[0,1]$, one side per unit of $\lambda\in[0,4]$: bottom, right side up, top, left side down. The blue vector $\mathcal{Z}$ starts at $(1,0)$ with cartesian components $(0,1)$ and is transported along the way; the readout gives its components and the transport equation in numbers.

      1. Under $\nabla^{\kappa}$ (curved, $\kappa = 1$), play the whole loop. Where does $z^1$ change, and what is it at $\lambda = 4$?
      2. Switch to $\nabla^{\mathrm{E}}$ and play again.

  - type: numeric
    id: delta-kappa
    title: The mismatch after one loop
    prompt: |
      On the plane, the connection $\nabla^{\kappa}$ with $\kappa = 1$ has the single cartesian coefficient $\Gamma^1_{22} = \kappa\,a$, so its transport equation reads
      $$\dot z^1 = -\kappa\,a\,z^2\,\dot\gamma^2$$
      and $\dot z^2 = 0$. Carry $z = (0,1)$ from $(1,0)$ counterclockwise around the rectangle $[1,2]\times[0,1]$ (bottom, right side up, top, left side down). What is the change $\Delta z^1 = z^1(\text{end}) - z^1(\text{start})$?
    answer: -1
    wrong:
      - { value: 0, feedback: 'That is what $\nabla^{\mathrm{E}}$ gives. Under $\nabla^{\kappa}$ the vertical sides change $z^1$ at a rate $-\kappa\,a\,z^2\dot\gamma^2$, and the two sides sit at different $a$, so the changes do not cancel.' }
      - { value: -2, feedback: 'That is the right side alone ($a = 2$, going up: $-2$). Going down the left side, $a = 1$ and $\dot\gamma^2 = -1$, which gives back $+1$.' }
      - { value: -3, feedback: 'On the left side the point moves **down**, $\dot\gamma^2 = -1$, so that side contributes $+\kappa\cdot1\cdot1 = +1$, not $-1$.' }
      - { value: 1, feedback: 'Sign: going up the right side, $\dot z^1 = -\kappa\cdot2\cdot1\cdot1 = -2$, a decrease; the left side gives back only $+1$.' }
    hint: |
      On the horizontal sides $\dot\gamma^2 = 0$. On the right side $a = 2$, $\dot\gamma^2 = +1$ for one unit of $\lambda$; on the left side $a = 1$, $\dot\gamma^2 = -1$.
    explanation: |
      Horizontal sides: nothing changes. Right side: $\Delta z^1 = -1\cdot2\cdot1\cdot1 = -2$. Left side: $\Delta z^1 = -1\cdot1\cdot1\cdot(-1) = +1$. Total $\Delta z^1 = -1$, $\Delta z^2 = 0$: the vector comes back as $(-1,1)$, **not** itself. Under $\nabla^{\mathrm{E}}$ the cartesian components never move, so $\Delta z = 0$.

  - type: mcq
    id: which-return
    title: Who comes back?
    multiple: true
    prompt: |
      On the plane, a vector is carried once around a closed loop. $\nabla^{\mathrm{E}}$ keeps cartesian components; $\nabla^{\mathrm{W}}$ (plane minus the origin) keeps the components along the unit radial and angular fields $e_1, e_2$; $\nabla^{\kappa}$ has the single cartesian coefficient $\Gamma^1_{22} = \kappa\,a$, with transport $\dot z^1 = -\kappa\,a\,z^2\dot\gamma^2$, $\dot z^2 = 0$. Select every true statement.
    options:
      - text: 'Under $\nabla^{\mathrm{E}}$ every loop returns the vector to itself'
        correct: true
      - text: 'Under $\nabla^{\mathrm{W}}$ every loop avoiding the origin returns the vector to itself'
        correct: true
      - text: 'Under $\nabla^{\kappa}$ every vector changes around the rectangle $[1,2]\times[0,1]$'
        feedback: |
          The change of $z^1$ is proportional to $z^2$, and $\dot z^2 = 0$. A vector with $z^2 = 0$, such as $(1,0)$, never changes at all, on any loop. The mismatch is a **linear map** applied to the carried vector, and this one kills $(1,0)$.
      - text: 'Under $\nabla^{\mathrm{W}}$ the vector turns along the way, so it cannot come back to itself'
        feedback: |
          It turns with the polar angle of the point. After a loop the point is back where it started, with the same polar angle (or the angle plus $2\pi$ if the loop went around the origin), so the frame $e_1, e_2$ there is the same and the vector, with unchanged frame components, is the same too.
    explanation: |
      $\nabla^{\mathrm{E}}$ and $\nabla^{\mathrm{W}}$ each keep the components in a frame defined everywhere on their domain, so a vector comes back to itself. $\nabla^{\kappa}$ has no such frame: the loop changes $z^1$ by an amount proportional to $z^2$. The tensor that measures this, the **curvature**, is where the lesson is heading.

  - type: text
    id: order-matters
    title: Two orders of differentiation
    body: |
      Around a rectangle you move first along $\partial x_1$, then along $\partial x_2$, then back along each. The mismatch compares "first $x_1$, then $x_2$" with "first $x_2$, then $x_1$": the **order** of two covariant derivatives.

      Before comparing $\nabla_\mathcal{X}\nabla_\mathcal{Y}$ with $\nabla_\mathcal{Y}\nabla_\mathcal{X}$, ask the simpler question for plain derivatives. Recall: a vector field $\mathcal{X}$ acts on a smooth function $f$ giving the function $\mathcal{X}\lfloor f\rceil\colon p\mapsto\mathcal{X}(p)(f)$, and in a chart $\mathcal{X}|_\mathcal{U} = x^i\,\partial x_i$ with component functions $x^i$. Do $\mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil$ and $\mathcal{Y}\lfloor\mathcal{X}\lfloor f\rceil\rceil$ agree?

      First: is $f\mapsto\mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil$ itself a vector field?

  - type: mcq
    id: second-order
    title: A derivative of a derivative
    prompt: |
      Every vector field $\mathcal{X}$ obeys the Leibniz rule $\mathcal{X}\lfloor fg\rceil = \mathcal{X}\lfloor f\rceil\,g + f\,\mathcal{X}\lfloor g\rceil$. On the plane with cartesian chart $\mathscr{X}$, consider the map
      $$D(f) := \partial x_1\big\lfloor\partial x_1\lfloor f\rceil\big\rceil,$$
      the second partial derivative in $a$. Test it on $f = g = \mathscr{X}^1$ (the function $a$). Can $D$ be a vector field?
    options:
      - text: 'No: $D(a^2) = 2$, while the Leibniz rule would give $D(a)\,a + a\,D(a) = 0$'
        correct: true
      - text: 'Yes: it is $\partial x_1$ applied twice, and applying a vector field twice gives a vector field'
        feedback: |
          Applying a derivation twice produces second derivatives, and second derivatives break the Leibniz rule: $(fg)'' = f''g + 2f'g' + fg''$ has the extra cross term $2f'g'$. Here $D(a\cdot a) = 2$ but $D(a)=0$.
      - text: 'Yes: $D$ is $\mathbb{R}$-linear, which is all a vector field needs'
        feedback: |
          $\mathbb{R}$-linearity is not enough: a tangent vector also obeys the Leibniz rule (it is a derivative along a curve). $D$ fails it: $D(a^2) = 2 \neq 0 = D(a)\,a + a\,D(a)$.
    explanation: |
      A composite of two vector fields is a second-order operator, not a vector field. The surprise of the next card: the **difference** of the two orders is first-order again.

  - type: text
    id: commutator
    title: The commutator
    body: |
      The **commutator** of two vector fields $\mathcal{X}, \mathcal{Y}$ is defined by its action on every smooth $f$:
      $$[\mathcal{X},\mathcal{Y}]\lfloor f\rceil := \mathcal{X}\big\lfloor\mathcal{Y}\lfloor f\rceil\big\rceil - \mathcal{Y}\big\lfloor\mathcal{X}\lfloor f\rceil\big\rceil.$$
      Compute in a chart, with $\mathcal{X}|_\mathcal{U} = x^i\,\partial x_i$ and $\mathcal{Y}|_\mathcal{U} = \tilde x^j\,\partial x_j$. By the Leibniz rule,
      $$\begin{aligned}\mathcal{X}\big\lfloor\mathcal{Y}\lfloor f\rceil\big\rceil &= x^i\,\partial x_i\big\lfloor\tilde x^j\,\partial x_j\lfloor f\rceil\big\rceil\\ &= x^i\,\partial x_i\lfloor\tilde x^j\rceil\,\partial x_j\lfloor f\rceil\\ &\quad + x^i\tilde x^j\,\partial x_i\big\lfloor\partial x_j\lfloor f\rceil\big\rceil.\end{aligned}$$
      The term $x^i\,\partial x_i\lfloor\tilde x^j\rceil\,\partial x_j\lfloor f\rceil$ has only first derivatives of $f$; the last term has second derivatives. Swapping the roles of $\mathcal{X}$ and $\mathcal{Y}$ gives the same shape. In the difference, the second-derivative terms are
      $$x^i\tilde x^j\big(\partial x_i\lfloor\partial x_j\lfloor f\rceil\rceil - \partial x_j\lfloor\partial x_i\lfloor f\rceil\rceil\big).$$

  - type: mcq
    id: why-cancel
    title: Why the second derivatives cancel
    prompt: |
      In a chart $(\mathcal{U},\mathscr{X})$, for vector fields $\mathcal{X} = x^i\,\partial x_i$ and $\mathcal{Y} = \tilde x^j\,\partial x_j$, the commutator $[\mathcal{X},\mathcal{Y}]\lfloor f\rceil := \mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil - \mathcal{Y}\lfloor\mathcal{X}\lfloor f\rceil\rceil$ contains the second-derivative terms
      $$x^i\tilde x^j\big(\partial x_i\lfloor\partial x_j\lfloor f\rceil\rceil - \partial x_j\lfloor\partial x_i\lfloor f\rceil\rceil\big).$$
      Why do they vanish?
    options:
      - text: '$\partial x_i\lfloor\partial x_j\lfloor f\rceil\rceil = \partial_i\partial_j[f\circ\mathscr{X}^{-1}]\circ\mathscr{X}$, and mixed partial derivatives of a smooth function on $\mathbb{R}^d$ agree (Schwarz)'
        correct: true
      - text: 'Because $x^i\tilde x^j = \tilde x^j x^i$: functions commute'
        feedback: |
          The prefactor is the same in both terms, true, but that alone does not make the bracket vanish: the bracket compares $\partial x_i\lfloor\partial x_j\lfloor f\rceil\rceil$ with the derivatives in the other order. What kills it is that those two agree, which is Schwarz's theorem applied to $f\circ\mathscr{X}^{-1}$.
      - text: 'Because $\partial x_i\lfloor\tilde x^j\rceil = 0$ for basis fields'
        feedback: |
          Component functions such as $\tilde x^j$ are arbitrary smooth functions, and their derivatives generally do not vanish; they produce exactly the first-order terms that survive. The second-order terms cancel for a different reason: mixed partials of $f\circ\mathscr{X}^{-1}$ agree.
    explanation: |
      What survives has only first derivatives of $f$, so $[\mathcal{X},\mathcal{Y}]$ is again a **vector field**, even though $\mathcal{X}\lfloor\mathcal{Y}\lfloor\,\cdot\,\rceil\rceil$ alone is not. The special case $\mathcal{X} = \partial x_j$, $\mathcal{Y} = \partial x_k$ gives
      $$[\partial x_j,\partial x_k] = 0.$$

  - type: build
    id: commutator-components
    title: Components of the commutator
    prompt: |
      In a chart, $\mathcal{X} = x^i\,\partial x_i$ and $\mathcal{Y} = \tilde x^j\,\partial x_j$. Expanding with the Leibniz rule, $\mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil$ contains the first-order term $\mathcal{X}\lfloor\tilde x^k\rceil\,\partial x_k\lfloor f\rceil$ (plus second derivatives of $f$, which cancel in the commutator). Build the $k$-th component of $[\mathcal{X},\mathcal{Y}]$, defined by $[\mathcal{X},\mathcal{Y}]\lfloor f\rceil := \mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil - \mathcal{Y}\lfloor\mathcal{X}\lfloor f\rceil\rceil$.
    prefix: '[\mathcal{X},\mathcal{Y}]^k ='
    tiles: ['\mathcal{X}\lfloor\tilde x^k\rceil', '\mathcal{Y}\lfloor x^k\rceil', '-', '+', '\mathcal{X}\lfloor x^k\rceil', '\mathcal{Y}\lfloor\tilde x^k\rceil']
    answers:
      - ['\mathcal{X}\lfloor\tilde x^k\rceil', '-', '\mathcal{Y}\lfloor x^k\rceil']
    wrong:
      - { answer: ['\mathcal{Y}\lfloor x^k\rceil', '-', '\mathcal{X}\lfloor\tilde x^k\rceil'], feedback: 'That is $[\mathcal{Y},\mathcal{X}] = -[\mathcal{X},\mathcal{Y}]$. The first term of the definition, $\mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil$, has $\mathcal{X}$ differentiating the components $\tilde x^k$ of $\mathcal{Y}$, with a plus sign.' }
      - { answer: ['\mathcal{X}\lfloor x^k\rceil', '-', '\mathcal{Y}\lfloor\tilde x^k\rceil'], feedback: 'Each field differentiates the **other** field''s components: in $\mathcal{X}\lfloor\tilde x^j\,\partial x_j\lfloor f\rceil\rceil$, the Leibniz rule makes $\mathcal{X}$ hit $\tilde x^j$, the components of $\mathcal{Y}$.' }
    hint: |
      In $\mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil$, which components does $\mathcal{X}$ differentiate? Then subtract the same with the roles swapped.
    explanation: |
      $$[\mathcal{X},\mathcal{Y}] = \big(\mathcal{X}\lfloor\tilde x^k\rceil - \mathcal{Y}\lfloor x^k\rceil\big)\,\partial x_k.$$
      Two consequences: basis fields of a chart commute (constant components), and for a smooth function $g$,
      $$[\mathcal{X}, g\,\mathcal{Y}] = \mathcal{X}\lfloor g\rceil\,\mathcal{Y} + g\,[\mathcal{X},\mathcal{Y}],$$
      since $\mathcal{X}\lfloor g\,\tilde x^k\rceil = \mathcal{X}\lfloor g\rceil\,\tilde x^k + g\,\mathcal{X}\lfloor\tilde x^k\rceil$.

  - type: numeric
    id: commutator-number
    title: A commutator in numbers
    prompt: |
      On the plane, points $(a,b)$, cartesian basis fields $\partial x_1, \partial x_2$, take $\mathcal{X} = \partial x_2$ and the swirl $\mathcal{Y} = -b\,\partial x_1 + a\,\partial x_2$. With $f = a^2b$, compute
      $$[\mathcal{X},\mathcal{Y}]\lfloor f\rceil = \mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil - \mathcal{Y}\lfloor\mathcal{X}\lfloor f\rceil\rceil$$
      at the point $(3,1)$.
    answer: -6
    wrong:
      - { value: 0, feedback: 'Basis fields of one chart commute, but the swirl is not one: its components $-b$, $a$ vary, and $\partial x_2$ differentiates them. $\mathcal{Y}\lfloor f\rceil = -2ab^2 + a^3$, so $\mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil = -4ab$, while $\mathcal{X}\lfloor f\rceil = a^2$ and $\mathcal{Y}\lfloor a^2\rceil = -2ab$.' }
      - { value: 6, feedback: 'Sign: $\mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil = -4ab = -12$ and $\mathcal{Y}\lfloor\mathcal{X}\lfloor f\rceil\rceil = -2ab = -6$, so the difference is $-12 - (-6) = -6$.' }
      - { value: -12, feedback: 'That is only $\mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil = -4ab$. Subtract $\mathcal{Y}\lfloor\mathcal{X}\lfloor f\rceil\rceil = \mathcal{Y}\lfloor a^2\rceil = -2ab = -6$.' }
    hint: |
      Either compute both orders directly, or use the components $[\mathcal{X},\mathcal{Y}]^k = \mathcal{X}\lfloor\tilde x^k\rceil - \mathcal{Y}\lfloor x^k\rceil$ with $x^k = (0,1)$ and $\tilde x^k = (-b, a)$.
    explanation: |
      By components: $\mathcal{X}\lfloor\tilde x^k\rceil = (\partial x_2\lfloor -b\rceil, \partial x_2\lfloor a\rceil) = (-1, 0)$ and $\mathcal{Y}\lfloor x^k\rceil = 0$ (constant components), so
      $$[\partial x_2,\mathcal{Y}] = -\partial x_1,$$
      and $-\partial x_1\lfloor a^2b\rceil = -2ab = -6$ at $(3,1)$. Directly: $-4ab - (-2ab) = -2ab$. ✓

  - type: mcq
    id: which-commute
    title: Which pairs commute?
    multiple: true
    prompt: |
      On the plane minus the origin, with cartesian basis fields $\partial x_1,\partial x_2$, polar chart $\mathscr{Y} = (r,\theta)$ with basis fields $\partial y_1$ (radial) and $\partial y_2$ (angular), the swirl $\mathcal{Y} = -b\,\partial x_1 + a\,\partial x_2$, and the unit fields $e_1 = \partial y_1$, $e_2 = \tfrac1r\,\partial y_2$. Select every pair whose commutator is zero.
    options:
      - text: '$[\partial x_1, \partial x_2]$'
        correct: true
      - text: '$[\partial y_1, \partial y_2]$'
        correct: true
      - text: '$[\partial x_2, \mathcal{Y}]$'
        feedback: |
          The swirl's cartesian components $(-b, a)$ depend on $b$, and $\partial x_2\lfloor -b\rceil = -1$: the commutator is $-\partial x_1$.
      - text: '$[e_1, e_2]$'
        feedback: |
          $e_1, e_2$ are a frame but not the basis fields of any chart. With $[\mathcal{X}, g\,\mathcal{Y}] = \mathcal{X}\lfloor g\rceil\,\mathcal{Y} + g\,[\mathcal{X},\mathcal{Y}]$:
          $$[\partial y_1, \tfrac1r\partial y_2] = \partial y_1\lfloor\tfrac1r\rceil\,\partial y_2 = -\tfrac1{r^2}\,\partial y_2,$$
          that is $[e_1,e_2] = -\tfrac1r\,e_2 \neq 0$.
    explanation: |
      The basis fields of **any** chart commute (mixed partials of $f\circ\mathscr{Y}^{-1}$ agree). A frame whose fields fail to commute, like $e_1, e_2$, cannot come from a chart. Keep $[e_1,e_2] = -\tfrac1r e_2$: it reappears as the torsion of $\nabla^{\mathrm{W}}$.

  - type: text
    id: torsion-def
    title: Torsion
    body: |
      For $\nabla^{\mathrm{E}}$, the covariant derivative differentiates cartesian components, $\nabla^{\mathrm{E}}_\mathcal{X}\mathcal{Y} = \mathcal{X}\lfloor\tilde x^k\rceil\,\partial x_k$, so by the commutator's components
      $$\nabla^{\mathrm{E}}_\mathcal{X}\mathcal{Y} - \nabla^{\mathrm{E}}_\mathcal{Y}\mathcal{X} = [\mathcal{X},\mathcal{Y}].$$
      For a general connection this can fail, and the failure gets a name. The **torsion** of $\nabla$ is the $(1,2)$-tensor field
      $$\begin{aligned}&\mathtt{T}(\mathsf{X},\mathcal{X},\mathcal{Y})\\ &:= \mathsf{X}\big\lceil\nabla_\mathcal{X}\mathcal{Y} - \nabla_\mathcal{Y}\mathcal{X} - [\mathcal{X},\mathcal{Y}]\big\rfloor,\end{aligned}$$
      with one covector-field slot $\mathsf{X}$ (sans-serif, orange in pictures) and two vector-field slots. Recall: $\mathsf{X}\lceil\mathcal{Z}\rfloor$ is the function $p\mapsto\mathsf{X}_p(\mathcal{Z}(p))$.

      Swapping $\mathcal{X}$ and $\mathcal{Y}$ flips every term, so $\mathtt{T}$ is **antisymmetric** in its two vector slots.

      Its components in a chart are $\mathtt{T}^i_{jk} := \mathtt{T}(dx^i, \partial x_j, \partial x_k)$. The commutator term drops, because $[\partial x_j,\partial x_k] = 0$:
      $$\mathtt{T}^i_{jk} = dx^i\big\lceil\nabla_{\partial x_j}\partial x_k - \nabla_{\partial x_k}\partial x_j\big\rfloor.$$

  - type: build
    id: torsion-components
    title: Torsion in terms of Γ
    prompt: |
      The connection coefficients are defined by $\nabla_{\partial x_i}\partial x_j = \Gamma^k_{ji}\,\partial x_k$ (last lower index = direction). The torsion components are
      $$\mathtt{T}^i_{jk} = dx^i\big\lceil\nabla_{\partial x_j}\partial x_k - \nabla_{\partial x_k}\partial x_j\big\rfloor.$$
      Build them from the $\Gamma$'s.
    prefix: '\mathtt{T}^i_{jk} ='
    tiles: ['\Gamma^i_{kj}', '\Gamma^i_{jk}', '-', '+', '\Gamma^k_{ij}']
    answers:
      - ['\Gamma^i_{kj}', '-', '\Gamma^i_{jk}']
    wrong:
      - { answer: ['\Gamma^i_{jk}', '-', '\Gamma^i_{kj}'], feedback: 'Index order: in $\nabla_{\partial x_j}\partial x_k$ the field differentiated is $\partial x_k$ and the direction is $\partial x_j$, so the coefficient is $\Gamma^i_{kj}$ (differentiated index first, direction last). That term comes with a plus sign.' }
      - { answer: ['\Gamma^i_{kj}', '+', '\Gamma^i_{jk}'], feedback: 'The second term of the torsion, $-\nabla_{\partial x_k}\partial x_j = -\Gamma^i_{jk}\,\partial x_i$, enters with a minus sign: the torsion measures the **antisymmetric** part of the coefficients.' }
    hint: |
      Write $\nabla_{\partial x_j}\partial x_k = \Gamma^i_{kj}\,\partial x_i$ (direction $j$ last) and $\nabla_{\partial x_k}\partial x_j$ likewise, then apply $dx^i$.
    explanation: |
      $\nabla_{\partial x_j}\partial x_k = \Gamma^i_{kj}\,\partial x_i$ and $\nabla_{\partial x_k}\partial x_j = \Gamma^i_{jk}\,\partial x_i$, and $dx^i\lceil\partial x_l\rfloor = \delta^i_l$, so
      $$\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}.$$
      The $\Gamma$'s are not tensor components, but this antisymmetric combination is.

  - type: text
    id: torsion-tensor
    title: Why the commutator is there
    body: |
      $\nabla_\mathcal{X}\mathcal{Y}$ is not $C^\infty(\mathcal{M})$-linear in $\mathcal{Y}$: by the product rule, for a smooth function $g$,
      $$\nabla_\mathcal{X}(g\,\mathcal{Y}) = \mathcal{X}\lfloor g\rceil\,\mathcal{Y} + g\,\nabla_\mathcal{X}\mathcal{Y},$$
      while in the direction slot $\nabla_{g\mathcal{Y}}\mathcal{X} = g\,\nabla_\mathcal{Y}\mathcal{X}$. So the first two terms of the torsion give
      $$\begin{aligned}&\nabla_\mathcal{X}(g\mathcal{Y}) - \nabla_{g\mathcal{Y}}\mathcal{X}\\ &= \mathcal{X}\lfloor g\rceil\,\mathcal{Y} + g\big(\nabla_\mathcal{X}\mathcal{Y} - \nabla_\mathcal{Y}\mathcal{X}\big),\end{aligned}$$
      and the commutator gives
      $$[\mathcal{X}, g\,\mathcal{Y}] = \mathcal{X}\lfloor g\rceil\,\mathcal{Y} + g\,[\mathcal{X},\mathcal{Y}].$$
      Subtracting, the term with the derivative of $g$ cancels: $\mathtt{T}(\mathsf{X},\mathcal{X},g\,\mathcal{Y}) = g\,\mathtt{T}(\mathsf{X},\mathcal{X},\mathcal{Y})$. The other slots behave the same way; the full proof, slot by slot, is the guided problem Torsion Is a Tensor, later in this level.

  - type: mcq
    id: why-commutator-in-T
    title: Without the commutator
    prompt: |
      For a connection $\nabla$ and vector fields $\mathcal{X},\mathcal{Y}$, consider the candidate $S(\mathsf{X},\mathcal{X},\mathcal{Y}) := \mathsf{X}\lceil\nabla_\mathcal{X}\mathcal{Y} - \nabla_\mathcal{Y}\mathcal{X}\rfloor$, the torsion without its commutator term $-[\mathcal{X},\mathcal{Y}]$. Why is $S$ not a tensor field?
    options:
      - text: 'Replacing $\mathcal{Y}$ by $g\,\mathcal{Y}$ adds $\mathcal{X}\lfloor g\rceil\,\mathsf{X}\lceil\mathcal{Y}\rfloor$, which depends on the derivative of $g$, not only on its value'
        correct: true
      - text: 'Because $\nabla_\mathcal{X}\mathcal{Y}$ is not $C^\infty(\mathcal{M})$-linear in the direction $\mathcal{X}$'
        feedback: |
          It is: $\nabla_{g\mathcal{X}}\mathcal{Y} = g\,\nabla_\mathcal{X}\mathcal{Y}$ is one of the connection's rules. The trouble is the **other** slot, where the product rule produces $\mathcal{X}\lfloor g\rceil\,\mathcal{Y}$.
      - text: '$S$ is a tensor field; the commutator is added only to make the torsion of $\nabla^{\mathrm{E}}$ vanish'
        feedback: |
          Test $S$ with $g\,\mathcal{Y}$: the product rule gives $S(\mathsf{X},\mathcal{X},g\mathcal{Y}) = g\,S(\mathsf{X},\mathcal{X},\mathcal{Y}) + \mathcal{X}\lfloor g\rceil\,\mathsf{X}\lceil\mathcal{Y}\rfloor$. The extra term spoils $C^\infty$-linearity, so $S$ is not a tensor field. The commutator supplies exactly the opposite term.
    explanation: |
      A tensor field must be $C^\infty(\mathcal{M})$-linear in every slot, so its value at $p$ depends only on the slot fields at $p$. $S$ picks up $\mathcal{X}\lfloor g\rceil\,\mathsf{X}\lceil\mathcal{Y}\rfloor$; since $[\mathcal{X}, g\,\mathcal{Y}] = \mathcal{X}\lfloor g\rceil\,\mathcal{Y} + g\,[\mathcal{X},\mathcal{Y}]$, subtracting the commutator removes it.

  - type: text
    id: torsion-free
    title: Torsion free means symmetric
    body: |
      A connection is **torsion free** if $\mathtt{T} = 0$, i.e.
      $$\nabla_\mathcal{X}\mathcal{Y} - \nabla_\mathcal{Y}\mathcal{X} = [\mathcal{X},\mathcal{Y}]$$
      for all vector fields. By $\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}$, in any chart this is the **symmetry** $\Gamma^i_{jk} = \Gamma^i_{kj}$. Because $\mathtt{T}$ is a tensor field, symmetry in one chart forces it in every chart.

      - $\nabla^{\mathrm{E}}$: all cartesian $\Gamma$'s vanish, so torsion free. In polar its coefficients $\Gamma^1_{22} = -r$, $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$ are nonzero, but symmetric, as they must be.
      - $\nabla^{\kappa}$: its only coefficient $\Gamma^1_{22} = \kappa a$ is trivially symmetric, so torsion free.

      Recall the connection with cartesian coefficients $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$: its autoparallels are ordinary straight lines (only the symmetric part of $\Gamma$ enters the autoparallel equation), yet transporting $(0,1)$ along $(\lambda,0)$ gave $(\lambda,1)$, a tilt. Now that tilt has a name.

  - type: numeric
    id: antisym-torsion
    title: The tilting connection
    prompt: |
      On the plane, a connection has cartesian coefficients $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$, all others zero (convention $\nabla_{\partial x_i}\partial x_j = \Gamma^k_{ji}\,\partial x_k$). Its autoparallels are the ordinary straight lines. Compute the torsion component $\mathtt{T}^1_{12}$, using $\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}$.
    answer: -2
    wrong:
      - { value: 0, feedback: 'Straight autoparallels do not mean zero torsion: the autoparallel equation sees only the symmetric part of $\Gamma$, here $0$. The torsion is the antisymmetric part: $\mathtt{T}^1_{12} = \Gamma^1_{21} - \Gamma^1_{12} = -1 - 1 = -2$.' }
      - { value: 2, feedback: 'Index order: $\mathtt{T}^1_{12} = \Gamma^1_{21} - \Gamma^1_{12}$ (swap the lower indices for the first term), which is $-1 - 1 = -2$.' }
    hint: |
      With $i = 1$, $j = 1$, $k = 2$: the first term is $\Gamma^1_{21}$.
    explanation: |
      $\mathtt{T}^1_{12} = \Gamma^1_{21} - \Gamma^1_{12} = -1 - 1 = -2$, and $\mathtt{T}^1_{21} = +2$. Two connections with the same autoparallels can differ by their torsion; this one is $\nabla^{\mathrm{E}}$ plus a pure torsion part.

  - type: text
    id: weitzenbock
    title: A flat connection with torsion
    body: |
      Now $\nabla^{\mathrm{W}}$, which declares $e_1 = \tfrac1r(a\,\partial x_1 + b\,\partial x_2)$ and $e_2 = \tfrac1r(-b\,\partial x_1 + a\,\partial x_2)$ parallel. Invert: $\partial x_1 = \tfrac1r(a\,e_1 - b\,e_2)$. By the product rule, with $\nabla^{\mathrm{W}}e_1 = \nabla^{\mathrm{W}}e_2 = 0$, only the coefficient functions get differentiated:
      $$\nabla^{\mathrm{W}}_{\partial x_1}\partial x_1 = \partial x_1\lfloor\tfrac ar\rceil e_1 - \partial x_1\lfloor\tfrac br\rceil e_2.$$
      With $\partial x_1\lfloor\tfrac ar\rceil = \tfrac{b^2}{r^3}$ and $\partial x_1\lfloor\tfrac br\rceil = -\tfrac{ab}{r^3}$ this is $\tfrac b{r^3}(b\,e_1 + a\,e_2) = \tfrac b{r^2}\,\partial x_2$. All four derivatives together give the nonzero cartesian coefficients
      $$\begin{gathered}\Gamma^2_{11} = \tfrac b{r^2},\quad \Gamma^2_{12} = -\tfrac a{r^2},\\ \Gamma^1_{21} = -\tfrac b{r^2},\quad \Gamma^1_{22} = \tfrac a{r^2}.\end{gathered}$$
      They are not symmetric: $\Gamma^1_{21}\neq\Gamma^1_{12} = 0$.

  - type: numeric
    id: weitzenbock-torsion
    title: Torsion of the frame connection
    prompt: |
      On the plane minus the origin, $r = \sqrt{a^2+b^2}$, the connection $\nabla^{\mathrm{W}}$ has the nonzero cartesian coefficients
      $$\begin{gathered}\Gamma^2_{11} = \tfrac b{r^2},\quad \Gamma^2_{12} = -\tfrac a{r^2},\\ \Gamma^1_{21} = -\tfrac b{r^2},\quad \Gamma^1_{22} = \tfrac a{r^2}\end{gathered}$$
      (convention $\nabla_{\partial x_i}\partial x_j = \Gamma^k_{ji}\,\partial x_k$). Compute the torsion component $\mathtt{T}^2_{12} = \Gamma^2_{21} - \Gamma^2_{12}$ at the point $(3,4)$.
    answer: 0.12
    tolerance: 0.001
    answerText: '3/25'
    wrong:
      - { value: -0.12, feedback: 'Order: $\mathtt{T}^2_{12} = \Gamma^2_{21} - \Gamma^2_{12} = 0 - (-\tfrac a{r^2}) = +\tfrac a{r^2}$.' }
      - { value: 0.6, feedback: 'The coefficients have $r^2$ in the denominator: $\tfrac a{r^2} = \tfrac3{25}$, not $\tfrac ar = \tfrac35$.' }
      - { value: 0, feedback: '$\Gamma^2_{21}$ is zero but $\Gamma^2_{12} = -\tfrac a{r^2}$ is not, so the difference does not vanish.' }
    hint: |
      $\Gamma^2_{21}$ is not in the list, so it is $0$. At $(3,4)$, $r^2 = 25$.
    explanation: |
      $\mathtt{T}^2_{12} = 0 - (-\tfrac3{25}) = \tfrac3{25}$, and likewise $\mathtt{T}^1_{12} = \Gamma^1_{21} - \Gamma^1_{12} = -\tfrac b{r^2} = -\tfrac4{25}$. Together
      $$\mathtt{T}(\,\cdot\,,\partial x_1,\partial x_2) = \tfrac1{r^2}(-b\,\partial x_1 + a\,\partial x_2),$$
      the swirl divided by $r^2$. In the frame it is even simpler: since $\nabla^{\mathrm{W}}e_a = 0$, only the commutator survives, $\mathtt{T}(\,\cdot\,,e_1,e_2) = -[e_1,e_2] = \tfrac1r\,e_2$. A connection that makes a non-chart frame parallel has torsion measuring how much the frame fails to commute.

  - type: widget
    id: weitzenbock-widget
    title: Straight, but tilting
    widget: parallel-transport
    config:
      curve: { type: vertical, x0: 1 }
      connection: W
      connections: [W, E]
      compareE: true
      torsion: true
      z0: [0, 1]
      presets:
        - { label: 'Vertical line a = 1', curve: { type: vertical, x0: 1 }, connection: W, z0: [0, 1] }
        - { label: 'Radial line at 45°', curve: { type: radial, theta0: 0.785 }, connection: W, z0: [0, 1] }
    body: |
      The gold point climbs the vertical line $\gamma_1(\lambda) = (1,\lambda)$. Under $\nabla^{\mathrm{W}}$ the blue $\mathcal{Z}$ is transported; the dashed **∇ᴱ copy** is the start vector with its cartesian components unchanged, and the readout gives the angle from it to $\mathcal{Z}$, plus $\mathtt{T}^1_{12}, \mathtt{T}^2_{12}$ at the current point.

      1. Play under $\nabla^{\mathrm{W}}$. Compare the angle with the change of the point's polar angle.
      2. Watch the dashed acceleration $a_\gamma = \nabla_{v_\gamma}v_\gamma$ and the "Autoparallel?" badge.
      3. Try the radial line preset.

  - type: mcq
    id: weitzenbock-seen
    title: What the frame connection does
    multiple: true
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ keeps the components of a vector along the unit radial and angular fields $e_1, e_2$; its nonzero cartesian coefficients are $\Gamma^2_{11} = \tfrac b{r^2}$, $\Gamma^2_{12} = -\tfrac a{r^2}$, $\Gamma^1_{21} = -\tfrac b{r^2}$, $\Gamma^1_{22} = \tfrac a{r^2}$, with torsion $\mathtt{T}^1_{12} = -\tfrac b{r^2}$, $\mathtt{T}^2_{12} = \tfrac a{r^2}$. Select every true statement.
    options:
      - text: 'Along the vertical line $\gamma_1(\lambda) = (1,\lambda)$, $\nabla^{\mathrm{W}}$ turns a transported vector, relative to its $\nabla^{\mathrm{E}}$ copy, by exactly the change of polar angle of the point'
        correct: true
      - text: '$\gamma_1$ is not an autoparallel of $\nabla^{\mathrm{W}}$: its acceleration has cartesian components $(\Gamma^1_{22}, \Gamma^2_{22}) = (\tfrac1{r^2}, 0)$, not parallel to the velocity $(0,1)$'
        correct: true
      - text: 'Along radial lines through the origin, $\nabla^{\mathrm{W}}$ and $\nabla^{\mathrm{E}}$ transport the same way'
        correct: true
      - text: 'Since the vector turns relative to $\nabla^{\mathrm{E}}$, $\nabla^{\mathrm{W}}$ is curved'
        feedback: |
          Turning relative to **another** connection says nothing about curvature. Curvature is about loops: under $\nabla^{\mathrm{W}}$ every loop (avoiding the origin) returns a vector to itself, because its frame components never change. $\nabla^{\mathrm{W}}$ is flat; what it has is torsion.
    explanation: |
      Under $\nabla^{\mathrm{W}}$ a vector turns with the polar angle: along a radial line the angle is constant, so it agrees with $\nabla^{\mathrm{E}}$ (radial lines are autoparallels of both); along $\gamma_1$ the polar angle changes, so it tilts. With $\dot\gamma = (0,1)$, $\ddot\gamma = 0$, the acceleration is $a^k = \Gamma^k_{22}$: $(\tfrac a{r^2}, 0)$ with $a = 1$. A line that is straight for $\nabla^{\mathrm{E}}$ is not straight for $\nabla^{\mathrm{W}}$. Since $\nabla^{\mathrm{E}}$ is torsion free, the antisymmetric part of $\Gamma^{\mathrm{W}} - \Gamma^{\mathrm{E}}$ is exactly the torsion of $\nabla^{\mathrm{W}}$.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Next: Torsion and Curvature · Part 2.** Torsion explained why a frame connection like $\nabla^{\mathrm{W}}$ tilts vectors along straight lines, yet it said nothing about the loop on which $\nabla^{\kappa}$ failed to return a vector. What tensor measures that mismatch, how is it computed from the $\Gamma$'s, and how does it relate to the area of the loop?
