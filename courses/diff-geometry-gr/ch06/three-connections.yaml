id: ch06-three-connections
title: "Guided Problem: Three Connections on the Plane · Part 1"
kind: guided

cards:
  - type: text
    id: hook
    title: Three connections, four boxes
    body: |
      On the plane, with points $(a,b)$, cartesian chart $\mathscr{X}$ (basis fields $\partial x_1, \partial x_2$) and $r := \sqrt{a^2+b^2}$, place three connections:
      - $\nabla^{\mathrm{E}}$: all cartesian coefficients vanish, so transport keeps **cartesian** components.
      - $\nabla^{\mathrm{W}}$ (plane minus the origin): the unit radial and angular fields $e_1, e_2$ are declared parallel.
      - $\nabla^{\kappa}$, for a constant $\kappa>0$: one nonzero cartesian coefficient, $\Gamma^1_{22} = \kappa\,a$.

      Two yes/no questions sort every connection: does it have **torsion**, is it **curved**? That makes four boxes:

      | | torsion free | with torsion |
      |---|---|---|
      | **flat** | ? | ? |
      | **curved** | ? | ? |

      **The problem:** compute the torsion and the curvature of each connection by hand, and place it in its box. Before any computation, guess where each one lands, and which box stays empty. Keep your guess. This part computes $\nabla^{\mathrm{E}}$ and $\nabla^{\mathrm{W}}$; Part 2 computes $\nabla^{\kappa}$, fills the table, and finds a connection for the empty box.

  - type: widget
    id: three-on-a-line
    title: Three ways to carry a vector
    widget: parallel-transport
    config:
      curve: { type: vertical, x0: 1, range: [-1, 1] }
      connection: W
      connections: [E, W, kappa]
      kappa: 1
      compareE: true
      torsion: true
      z0: [0, 1]
      showAcceleration: false
      view: { x: -2.6, y: -1.6, w: 5, h: 5 }
    body: |
      The gold point climbs the vertical segment $\gamma_1(\lambda) = (1,\lambda)$, $\lambda\in[-1,1]$, from $(1,-1)$ to $(1,1)$. The blue vector $\mathcal{Z}$ starts with cartesian components $(0,1)$ and is transported; the dashed **∇ᴱ copy** is the start vector with its cartesian components unchanged, and the readout gives the angle from it to $\mathcal{Z}$.

      1. Play under $\nabla^{\mathrm{W}}$. Watch the angle, and the polar angle of the point (it goes from $-45°$ to $45°$).
      2. Switch to $\nabla^{\kappa}$ ($\kappa = 1$) and play again.
      3. Switch to $\nabla^{\mathrm{E}}$.

  - type: numeric
    id: tilt-angle
    title: How far does the frame connection turn?
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ keeps the components of a vector along the unit radial field $e_1$ and the unit angular field $e_2$, so a transported vector turns with the polar angle of the point. Transport a vector along the vertical segment from $(1,-1)$ to $(1,1)$. By how many degrees has it turned, compared with its copy whose cartesian components stay constant?
    answer: 90
    tolerance: 0.5
    wrong:
      - { value: 45, feedback: 'That is the polar angle at the end, $45°$. The start point $(1,-1)$ has polar angle $-45°$, so the change is $90°$.' }
      - { value: 0, feedback: 'That is $\nabla^{\mathrm{E}}$, which keeps cartesian components. $\nabla^{\mathrm{W}}$ keeps the components along $e_1, e_2$, and these fields turn as the point moves around the origin.' }
    hint: |
      The polar angle of $(1,-1)$ is $-45°$, that of $(1,1)$ is $45°$.
    explanation: |
      The frame $e_1, e_2$ turns by the change of polar angle, $45° - (-45°) = 90°$, and the transported vector, with constant frame components, turns with it.

  - type: mcq
    id: tilt-not-curvature
    title: Does turning mean curved?
    prompt: |
      Along the vertical segment from $(1,-1)$ to $(1,1)$ on the plane, a vector transported by $\nabla^{\mathrm{W}}$ (unit radial and angular fields parallel) and one transported by $\nabla^{\kappa}$ (single cartesian coefficient $\Gamma^1_{22} = \kappa\,a$) both end up turned relative to the copy that keeps its cartesian components, while $\nabla^{\mathrm{E}}$ (all cartesian coefficients zero) does not turn it. What does this tell you about curvature?
    options:
      - text: 'Nothing yet: along an open curve this only compares two connections; curvature is decided by the tensor $\mathrm{Riem}$ (equivalently, by loops)'
        correct: true
      - text: '$\nabla^{\mathrm{W}}$ and $\nabla^{\kappa}$ are curved, $\nabla^{\mathrm{E}}$ is flat'
        feedback: |
          "Turned relative to $\nabla^{\mathrm{E}}$" is a comparison between two connections along one path, not a property of either one. Curvature asks whether transport around a **closed loop** returns a vector to itself; the lesson computes it, and one of these two will turn out flat.
      - text: '$\nabla^{\mathrm{E}}$ is curved, since the other two disagree with it'
        feedback: |
          Disagreement is symmetric: it says the connections differ, not which (if any) is curved. Curvature is a property of one connection, measured by its own $\mathrm{Riem}$.
    explanation: |
      Any two connections transport differently along most curves. To sort them into the boxes you need each one's own tensors, $\mathtt{T}$ and $\mathrm{Riem}$, computed next.

  - type: text
    id: tools
    title: The two tests
    body: |
      Recall the conventions. The coefficients of $\nabla$ in a chart are fixed by
      $$\nabla_{\partial x_k}\partial x_j = \Gamma^i_{jk}\,\partial x_i,$$
      last lower index = direction. The **torsion** components and the **Riemann curvature** components are
      $$\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk},$$
      $$\begin{aligned}\mathrm{Riem}^i_{jkm} &= \partial x_k\lfloor\Gamma^i_{jm}\rceil - \partial x_m\lfloor\Gamma^i_{jk}\rceil\\ &\quad + \Gamma^i_{nk}\Gamma^n_{jm} - \Gamma^i_{nm}\Gamma^n_{jk}.\end{aligned}$$
      Both are **tensors**: zero in one chart means zero in every chart. Torsion free means the $\Gamma$'s are symmetric in their lower indices. In two dimensions, by the antisymmetry $\mathrm{Riem}^i_{jkm} = -\mathrm{Riem}^i_{jmk}$, the curvature is flat exactly when its four components $\mathrm{Riem}^i_{j12}$ vanish.

      **First, $\nabla^{\mathrm{E}}$.** In the cartesian chart every $\Gamma$ is $0$, so both tests are passed at once. To see the tensor property at work, redo them in the polar chart $\mathscr{Y} = (r,\theta)$, where the $\Gamma$'s do not vanish.

  - type: text
    id: e-polar
    title: The polar coefficients of ∇ᴱ
    body: |
      The polar basis fields, in cartesian terms:
      $$\partial y_1 = \tfrac1r(a\,\partial x_1 + b\,\partial x_2),$$
      $$\partial y_2 = -b\,\partial x_1 + a\,\partial x_2.$$
      $\partial y_1$ acts on functions as $\partial/\partial r$ and $\partial y_2$ as $\partial/\partial\theta$; with $a = r\cos\theta$, $b = r\sin\theta$:
      $$\partial y_2\lfloor a\rceil = -b,\quad \partial y_2\lfloor b\rceil = a.$$
      $\nabla^{\mathrm{E}}$ differentiates only the cartesian components (its cartesian $\Gamma$'s vanish). So
      $$\begin{aligned}\nabla^{\mathrm{E}}_{\partial y_1}\partial y_2 &= \partial y_1\lfloor -b\rceil\,\partial x_1 + \partial y_1\lfloor a\rceil\,\partial x_2\\ &= \tfrac1r(-b\,\partial x_1 + a\,\partial x_2)\\ &= \tfrac1r\,\partial y_2,\end{aligned}$$
      giving $\Gamma^2_{21} = \tfrac1r$. Likewise $\nabla^{\mathrm{E}}_{\partial y_2}\partial y_1$ differentiates $\tfrac ar = \cos\theta$ and $\tfrac br = \sin\theta$ in $\theta$, which also gives $\tfrac1r\,\partial y_2$: $\Gamma^2_{12} = \tfrac1r$. And $\nabla^{\mathrm{E}}_{\partial y_1}\partial y_1 = 0$, since $\cos\theta$, $\sin\theta$ do not change with $r$.

  - type: mcq
    id: e-y2y2
    title: The last one
    prompt: |
      On the plane, $\nabla^{\mathrm{E}}$ has all cartesian coefficients zero, so it differentiates only cartesian components. The polar basis field $\partial y_2 = -b\,\partial x_1 + a\,\partial x_2$ acts on functions as $\partial/\partial\theta$ (with $a = r\cos\theta$, $b = r\sin\theta$), and $\partial y_1 = \tfrac1r(a\,\partial x_1 + b\,\partial x_2)$. What is $\nabla^{\mathrm{E}}_{\partial y_2}\partial y_2$?
    options:
      - text: '$-r\,\partial y_1$'
        correct: true
      - text: '$0$'
        feedback: |
          $\partial y_2$ has constant **polar** components $(0,1)$, but $\nabla^{\mathrm{E}}$ keeps **cartesian** components, and those of $\partial y_2$, $(-b, a)$, change with $\theta$: $\partial y_2\lfloor -b\rceil = -a$, $\partial y_2\lfloor a\rceil = -b$.
      - text: '$r\,\partial y_1$'
        feedback: |
          Sign: $\partial y_2\lfloor -b\rceil\,\partial x_1 + \partial y_2\lfloor a\rceil\,\partial x_2 = -a\,\partial x_1 - b\,\partial x_2$, which points **toward** the origin, $-r\,\partial y_1$.
      - text: '$\tfrac1r\,\partial y_2$'
        feedback: |
          That is $\nabla^{\mathrm{E}}_{\partial y_1}\partial y_2$ (direction $\partial y_1$). Along $\partial y_2$ the result is $-a\,\partial x_1 - b\,\partial x_2$, a radial vector.
    explanation: |
      $$\begin{aligned}\nabla^{\mathrm{E}}_{\partial y_2}\partial y_2 &= -a\,\partial x_1 - b\,\partial x_2\\ &= -r\,\partial y_1,\end{aligned}$$
      so $\Gamma^1_{22} = -r$: moving around a circle, the angular field turns inward. All nonzero polar coefficients of $\nabla^{\mathrm{E}}$:
      $$\Gamma^1_{22} = -r,\quad \Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r.$$

  - type: mcq
    id: e-torsion
    title: Torsion of ∇ᴱ in polar
    prompt: |
      In the polar chart, the connection $\nabla^{\mathrm{E}}$ (all cartesian coefficients zero) has the nonzero coefficients $\Gamma^1_{22} = -r$ and $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$. The torsion components are $\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}$. What is the torsion?
    options:
      - text: '$\mathtt{T} = 0$: the only pair that could differ, $\Gamma^2_{12}$ and $\Gamma^2_{21}$, is equal, and $\Gamma^1_{22}$ has equal lower indices'
        correct: true
      - text: '$\mathtt{T}\neq0$: the coefficients are nonzero and depend on $r$'
        feedback: |
          Torsion is the **antisymmetric** part of the $\Gamma$'s, $\Gamma^i_{kj} - \Gamma^i_{jk}$. Nonzero but symmetric coefficients give zero torsion; their size and position dependence do not matter.
      - text: 'It cannot be decided in polar; one must return to the cartesian chart'
        feedback: |
          The formula $\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}$ holds in every chart, and here it gives $0$ term by term. That it agrees with the cartesian result is exactly the tensor property.
    explanation: |
      $\mathtt{T}^2_{12} = \Gamma^2_{21} - \Gamma^2_{12} = \tfrac1r - \tfrac1r = 0$, and every other component is a difference of zeros or of $\Gamma^1_{22}$ with itself. Zero in polar, as in cartesian: the same tensor.

  - type: build
    id: e-riem
    title: A curvature component in polar
    prompt: |
      In the polar chart $(r,\theta)$, $\nabla^{\mathrm{E}}$ has the nonzero coefficients $\Gamma^1_{22} = -r$ and $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$; $\partial y_1$ acts as $\partial/\partial r$, $\partial y_2$ as $\partial/\partial\theta$. Keep only the nonzero terms of
      $$\begin{aligned}\mathrm{Riem}^2_{112} &= \partial y_1\lfloor\Gamma^2_{12}\rceil - \partial y_2\lfloor\Gamma^2_{11}\rceil\\ &\quad + \Gamma^2_{n1}\Gamma^n_{12} - \Gamma^2_{n2}\Gamma^n_{11}.\end{aligned}$$
    prefix: '='
    tiles: ['-\tfrac{1}{r^2}', '+', '\tfrac{1}{r^2}', '\tfrac{1}{r}', '-1']
    answers:
      - ['-\tfrac{1}{r^2}', '+', '\tfrac{1}{r^2}']
      - ['\tfrac{1}{r^2}', '-\tfrac{1}{r^2}']
    wrong:
      - { answer: ['-\tfrac{1}{r^2}'], feedback: 'That is the derivative term $\partial y_1\lfloor\tfrac1r\rceil$ alone. The quadratic term $\Gamma^2_{n1}\Gamma^n_{12}$ survives for $n = 2$: $\Gamma^2_{21}\Gamma^2_{12} = \tfrac1r\cdot\tfrac1r$.' }
      - { answer: ['-\tfrac{1}{r^2}', '+', '\tfrac{1}{r}'], feedback: 'The quadratic term is a product of two coefficients, $\Gamma^2_{21}\Gamma^2_{12} = \tfrac1r\cdot\tfrac1r = \tfrac1{r^2}$.' }
      - { answer: ['-1', '+', '\tfrac{1}{r^2}'], feedback: '$-1$ is $\partial y_1\lfloor -r\rceil$, the derivative of $\Gamma^1_{22}$, which belongs to $\mathrm{Riem}^1_{212}$. Here the derivative term is $\partial y_1\lfloor\Gamma^2_{12}\rceil = \tfrac{d}{dr}\tfrac1r$.' }
    hint: |
      $\Gamma^2_{11} = 0$ and $\Gamma^n_{11} = 0$ for both $n$. In $\Gamma^2_{n1}\Gamma^n_{12}$ only $n = 2$ survives, since $\Gamma^2_{11} = 0$.
    explanation: |
      $$\begin{aligned}\mathrm{Riem}^2_{112} &= -\tfrac1{r^2} - 0 + \tfrac1r\cdot\tfrac1r - 0\\ &= 0.\end{aligned}$$
      The same cancellation happens in $\mathrm{Riem}^1_{212} = \partial y_1\lfloor -r\rceil + (-\Gamma^1_{22}\Gamma^2_{21}) = -1 + 1 = 0$, while $\mathrm{Riem}^1_{112}$ and $\mathrm{Riem}^2_{212}$ vanish term by term (each term contains a zero coefficient). All four vanish: $\nabla^{\mathrm{E}}$ is **flat and torsion free**, in polar as in cartesian.

  - type: text
    id: w-frame
    title: "The frame connection"
    body: |
      $\nabla^{\mathrm{W}}$ lives on the plane minus the origin. Its frame is
      $$e_1 := \tfrac1r(a\,\partial x_1 + b\,\partial x_2),$$
      $$e_2 := \tfrac1r(-b\,\partial x_1 + a\,\partial x_2),$$
      and it is **defined** by $\nabla^{\mathrm{W}}_\mathcal{Z}e_a = 0$ for every vector field $\mathcal{Z}$ and $a = 1, 2$. Every vector field is $\mathcal{W} = w^a e_a$ with smooth functions $w^a$, so the product rule fixes everything:
      $$\nabla^{\mathrm{W}}_\mathcal{Z}\mathcal{W} = \mathcal{Z}\lfloor w^a\rceil\,e_a.$$
      Only the frame components get differentiated.

      In polar the frame is almost the chart basis: comparing with the polar basis fields,
      $$e_1 = \partial y_1,\quad e_2 = \tfrac1r\,\partial y_2,$$
      that is, $\partial y_2 = r\,e_2$, with frame components $(0, r)$.

  - type: mcq
    id: w-polar
    title: ∇ᵂ in polar
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ declares $e_1 = \partial y_1$ and $e_2 = \tfrac1r\,\partial y_2$ parallel ($\partial y_1, \partial y_2$: polar basis fields, acting as $\partial/\partial r$, $\partial/\partial\theta$), so $\nabla^{\mathrm{W}}_\mathcal{Z}(w^ae_a) = \mathcal{Z}\lfloor w^a\rceil\,e_a$. Since $\partial y_2 = r\,e_2$, what is $\nabla^{\mathrm{W}}_{\partial y_1}\partial y_2$?
    options:
      - text: '$\tfrac1r\,\partial y_2$'
        correct: true
      - text: '$0$, because the frame is parallel'
        feedback: |
          $e_2$ is parallel, but $\partial y_2 = r\,e_2$ has the frame component $r$, and $\partial y_1\lfloor r\rceil = 1$. The product rule gives $1\cdot e_2 = \tfrac1r\,\partial y_2$.
      - text: '$\partial y_2$'
        feedback: |
          The product rule gives $\partial y_1\lfloor r\rceil\,e_2 = e_2$, and $e_2$ is $\tfrac1r\,\partial y_2$, not $\partial y_2$.
      - text: '$-r\,\partial y_1$'
        feedback: |
          That is $\nabla^{\mathrm{E}}_{\partial y_2}\partial y_2$, another connection and another pair of fields. Under $\nabla^{\mathrm{W}}$ nothing ever acquires an $e_1$ part from $e_2$: only frame components are differentiated.
    explanation: |
      $\nabla^{\mathrm{W}}_{\partial y_1}\partial y_2 = \partial y_1\lfloor r\rceil\,e_2 = \tfrac1r\,\partial y_2$, so $\Gamma^2_{21} = \tfrac1r$. The other three vanish: $\nabla^{\mathrm{W}}\partial y_1 = \nabla^{\mathrm{W}}e_1 = 0$, and $\nabla^{\mathrm{W}}_{\partial y_2}\partial y_2 = \partial y_2\lfloor r\rceil\,e_2 = 0$. So the **only** nonzero polar coefficient is
      $$\Gamma^2_{21} = \tfrac1r,$$
      while $\Gamma^2_{12} = 0$. Compare $\nabla^{\mathrm{E}}$: $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$, $\Gamma^1_{22} = -r$.

  - type: numeric
    id: w-polar-torsion
    title: Torsion, first way
    prompt: |
      In the polar chart, $\nabla^{\mathrm{W}}$ (unit radial and angular fields parallel) has the single nonzero coefficient $\Gamma^2_{21} = \tfrac1r$, with the convention $\nabla_{\partial y_k}\partial y_j = \Gamma^i_{jk}\,\partial y_i$. The torsion components are $\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}$. Compute $\mathtt{T}^2_{12}$ at a point with $r = 5$.
    answer: 0.2
    tolerance: 0.001
    answerText: '1/5'
    wrong:
      - { value: -0.2, feedback: 'Order: $\mathtt{T}^2_{12} = \Gamma^2_{21} - \Gamma^2_{12} = \tfrac1r - 0$. The value $-\tfrac15$ is $\mathtt{T}^2_{21}$.' }
      - { value: 0, feedback: 'That is $\nabla^{\mathrm{E}}$, where $\Gamma^2_{12} = \Gamma^2_{21}$. Under $\nabla^{\mathrm{W}}$, $\Gamma^2_{12} = 0$ (since $\nabla^{\mathrm{W}}_{\partial y_2}e_1 = 0$) while $\Gamma^2_{21} = \tfrac1r$.' }
      - { value: 5, feedback: 'The coefficient is $\tfrac1r$, not $r$: $\nabla^{\mathrm{W}}_{\partial y_1}\partial y_2 = \partial y_1\lfloor r\rceil\,e_2 = e_2 = \tfrac1r\,\partial y_2$.' }
    hint: |
      $\Gamma^2_{12}$ is not in the list, so it is $0$.
    explanation: |
      $\mathtt{T}^2_{12} = \tfrac15 - 0 = \tfrac15$; in general
      $$\mathtt{T}(\,\cdot\,,\partial y_1,\partial y_2) = \tfrac1r\,\partial y_2.$$
      Nonzero: $\nabla^{\mathrm{W}}$ **has torsion**. The cartesian chart must agree, since torsion is a tensor; that needs the cartesian coefficients.

  - type: build
    id: w-cart-build
    title: A cartesian coefficient by the product rule
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ makes $e_1 = \tfrac1r(a\,\partial x_1 + b\,\partial x_2)$ and $e_2 = \tfrac1r(-b\,\partial x_1 + a\,\partial x_2)$ parallel, so it differentiates only frame components. Inverting the frame,
      $$\partial x_2 = \tfrac br\,e_1 + \tfrac ar\,e_2.$$
      Build
      $$\nabla^{\mathrm{W}}_{\partial x_1}\partial x_2$$
    prefix: '='
    tiles: ['\partial x_1\lfloor\tfrac br\rceil e_1', '+', '\partial x_1\lfloor\tfrac ar\rceil e_2', '\partial x_2\lfloor\tfrac br\rceil e_1', '\tfrac br e_1']
    answers:
      - ['\partial x_1\lfloor\tfrac br\rceil e_1', '+', '\partial x_1\lfloor\tfrac ar\rceil e_2']
      - ['\partial x_1\lfloor\tfrac ar\rceil e_2', '+', '\partial x_1\lfloor\tfrac br\rceil e_1']
    wrong:
      - { answer: ['\partial x_2\lfloor\tfrac br\rceil e_1', '+', '\partial x_1\lfloor\tfrac ar\rceil e_2'], feedback: 'The direction is $\partial x_1$ (the subscript of $\nabla$), so every frame component is differentiated by $\partial x_1$, i.e. in $a$.' }
      - { answer: ['\tfrac br e_1', '+', '\partial x_1\lfloor\tfrac ar\rceil e_2'], feedback: 'The component $\tfrac br$ is not kept: it is **differentiated**. The other product-rule term, $\tfrac br\,\nabla^{\mathrm{W}}_{\partial x_1}e_1$, is zero because $e_1$ is parallel.' }
    hint: |
      Product rule on each term: $\nabla_{\partial x_1}(g\,e_a) = \partial x_1\lfloor g\rceil\,e_a + g\,\nabla_{\partial x_1}e_a$, and the second part vanishes.
    explanation: |
      $$\nabla^{\mathrm{W}}_{\partial x_1}\partial x_2 = \partial x_1\lfloor\tfrac br\rceil e_1 + \partial x_1\lfloor\tfrac ar\rceil e_2.$$
      With $\partial x_1\lfloor r\rceil = \tfrac ar$, the two derivatives are
      $$\partial x_1\lfloor\tfrac br\rceil = -\tfrac{ab}{r^3},\quad \partial x_1\lfloor\tfrac ar\rceil = \tfrac{b^2}{r^3}.$$

  - type: numeric
    id: w-cart-number
    title: The coefficient at (3, 4)
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ (with $e_1 = \tfrac1r(a\,\partial x_1 + b\,\partial x_2)$ and $e_2 = \tfrac1r(-b\,\partial x_1 + a\,\partial x_2)$ parallel) gives
      $$\nabla^{\mathrm{W}}_{\partial x_1}\partial x_2 = -\tfrac{ab}{r^3}\,e_1 + \tfrac{b^2}{r^3}\,e_2.$$
      At the point $(3,4)$, what is its $\partial x_1$ component, i.e. $\Gamma^1_{21}$?
    answer: -0.16
    tolerance: 0.001
    answerText: '-4/25'
    wrong:
      - { value: -0.096, feedback: 'That is the coefficient $-\tfrac{ab}{r^3} = -\tfrac{12}{125}$ of $e_1$. Convert to cartesian: $e_1$ has $\partial x_1$ component $\tfrac35$ and $e_2$ has $-\tfrac45$.' }
      - { value: 0.16, feedback: 'Sign: $e_2$ has $\partial x_1$ component $-\tfrac br = -\tfrac45$, so its term gives $\tfrac{16}{125}\cdot(-\tfrac45)$, negative like the first.' }
      - { value: 0, feedback: 'That is the $\partial x_2$ component, which does vanish: $-\tfrac{12}{125}\cdot\tfrac45 + \tfrac{16}{125}\cdot\tfrac35 = 0$. The question asks for the $\partial x_1$ component.' }
    hint: |
      At $(3,4)$: $r = 5$, $e_1 = \tfrac35\partial x_1 + \tfrac45\partial x_2$, $e_2 = -\tfrac45\partial x_1 + \tfrac35\partial x_2$, $-\tfrac{ab}{r^3} = -\tfrac{12}{125}$, $\tfrac{b^2}{r^3} = \tfrac{16}{125}$.
    explanation: |
      $$\begin{aligned}&-\tfrac{12}{125}\cdot\tfrac35 + \tfrac{16}{125}\cdot(-\tfrac45)\\ &= -\tfrac{36+64}{625} = -\tfrac4{25}.\end{aligned}$$
      In general $\nabla^{\mathrm{W}}_{\partial x_1}\partial x_2 = -\tfrac b{r^2}\,\partial x_1$. The other three derivatives go the same way, giving all nonzero cartesian coefficients:
      $$\begin{gathered}\Gamma^2_{11} = \tfrac b{r^2},\quad \Gamma^2_{12} = -\tfrac a{r^2},\\ \Gamma^1_{21} = -\tfrac b{r^2},\quad \Gamma^1_{22} = \tfrac a{r^2}.\end{gathered}$$

  - type: mcq
    id: w-cart-torsion
    title: Torsion, second way
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ has the nonzero cartesian coefficients
      $$\begin{gathered}\Gamma^2_{11} = \tfrac b{r^2},\quad \Gamma^2_{12} = -\tfrac a{r^2},\\ \Gamma^1_{21} = -\tfrac b{r^2},\quad \Gamma^1_{22} = \tfrac a{r^2}\end{gathered}$$
      (convention $\nabla_{\partial x_k}\partial x_j = \Gamma^i_{jk}\,\partial x_i$; torsion $\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}$). Which is $\mathtt{T}(\,\cdot\,,\partial x_1,\partial x_2) = \mathtt{T}^i_{12}\,\partial x_i$?
    options:
      - text: '$\tfrac1{r^2}(-b\,\partial x_1 + a\,\partial x_2)$'
        correct: true
      - text: '$\tfrac1{r^2}(b\,\partial x_1 - a\,\partial x_2)$'
        feedback: |
          Order: $\mathtt{T}^i_{12} = \Gamma^i_{21} - \Gamma^i_{12}$. For $i = 1$: $-\tfrac b{r^2} - 0$; for $i = 2$: $0 - (-\tfrac a{r^2})$. You computed $\mathtt{T}^i_{21}$.
      - text: '$0$, because only $\Gamma^1_{22}$ and $\Gamma^2_{11}$ can pair with themselves'
        feedback: |
          $\Gamma^1_{21}$ and $\Gamma^2_{12}$ have no partner: $\Gamma^1_{12} = 0$ and $\Gamma^2_{21} = 0$. Each unpaired off-diagonal coefficient is torsion.
      - text: '$\tfrac1{r^2}(-b\,\partial x_1 + a\,\partial x_2) + \tfrac1{r^2}(a\,\partial x_1 + b\,\partial x_2)$'
        feedback: |
          $\Gamma^1_{22}$ and $\Gamma^2_{11}$ have equal lower indices, so they cancel in $\Gamma^i_{kj} - \Gamma^i_{jk}$; they never contribute to torsion.
    explanation: |
      $\mathtt{T}^1_{12} = -\tfrac b{r^2}$ and $\mathtt{T}^2_{12} = \tfrac a{r^2}$, so
      $$\mathtt{T}(\,\cdot\,,\partial x_1,\partial x_2) = \tfrac1{r^2}(-b\,\partial x_1 + a\,\partial x_2),$$
      the swirl divided by $r^2$. Nonzero, as in polar.

  - type: mcq
    id: w-frame-torsion
    title: Torsion, third way
    prompt: |
      The torsion of a connection is the tensor with $\mathtt{T}(\,\cdot\,,\mathcal{X},\mathcal{Y}) = \nabla_\mathcal{X}\mathcal{Y} - \nabla_\mathcal{Y}\mathcal{X} - [\mathcal{X},\mathcal{Y}]$, where $[\mathcal{X},\mathcal{Y}]$ is the commutator. On the plane minus the origin, $\nabla^{\mathrm{W}}$ makes the unit radial and angular fields $e_1, e_2$ parallel, and these fields satisfy $[e_1,e_2] = -\tfrac1r\,e_2$. What is $\mathtt{T}(\,\cdot\,,e_1,e_2)$?
    options:
      - text: '$\tfrac1r\,e_2$'
        correct: true
      - text: '$0$, since the frame is parallel'
        feedback: |
          Parallel frame kills the two $\nabla$ terms, $\nabla^{\mathrm{W}}_{e_1}e_2 = \nabla^{\mathrm{W}}_{e_2}e_1 = 0$, but not the commutator, which involves no connection at all. What remains is $-[e_1,e_2]$.
      - text: '$-\tfrac1r\,e_2$'
        feedback: |
          The commutator enters with a minus sign: $\mathtt{T}(\,\cdot\,,e_1,e_2) = 0 - 0 - [e_1,e_2] = +\tfrac1r\,e_2$.
    explanation: |
      $$\begin{aligned}\mathtt{T}(\,\cdot\,,e_1,e_2) &= -[e_1,e_2]\\ &= \tfrac1r\,e_2.\end{aligned}$$
      Here the source is visible: a connection that makes a **non-chart** frame parallel has torsion measuring how much the frame fails to commute. (Chart basis fields always commute, so declaring $\partial x_1, \partial x_2$ parallel, as $\nabla^{\mathrm{E}}$ does, gives no torsion.)

  - type: mcq
    id: w-three-agree
    title: Three answers, one tensor
    multiple: true
    prompt: |
      For $\nabla^{\mathrm{W}}$ on the plane minus the origin, three computations gave
      $$\mathtt{T}(\,\cdot\,,\partial y_1,\partial y_2) = \tfrac1r\,\partial y_2,$$
      $$\mathtt{T}(\,\cdot\,,\partial x_1,\partial x_2) = \tfrac1{r^2}(-b\,\partial x_1 + a\,\partial x_2),$$
      $$\mathtt{T}(\,\cdot\,,e_1,e_2) = \tfrac1r\,e_2,$$
      with $\partial y_1 = e_1$, $\partial y_2 = r\,e_2$, and $e_2 = \tfrac1r(-b\,\partial x_1 + a\,\partial x_2)$. Select every true statement.
    options:
      - text: 'The cartesian and frame results are the same vector field'
        correct: true
      - text: 'The polar result is $r$ times the frame result'
        correct: true
      - text: 'All three must be the same vector field, because torsion is a tensor'
        feedback: |
          A tensor does not give the same output for different **inputs**. Here the inputs differ: $\partial y_2 = r\,e_2$, so by linearity $\mathtt{T}(\,\cdot\,,\partial y_1,\partial y_2) = r\,\mathtt{T}(\,\cdot\,,e_1,e_2)$. What the tensor property guarantees is that the three are related by exactly this linearity.
      - text: 'The cartesian and frame results disagree, so one of the computations is wrong'
        feedback: |
          They agree: $\tfrac1r\,e_2 = \tfrac1{r^2}(-b\,\partial x_1 + a\,\partial x_2)$. At $(3,4)$ both have cartesian components $(-\tfrac4{25}, \tfrac3{25})$.
    explanation: |
      Expanding $e_1, e_2$ in $\partial x_1, \partial x_2$ and using linearity and antisymmetry,
      $$\mathtt{T}(\,\cdot\,,e_1,e_2) = D\,\mathtt{T}(\,\cdot\,,\partial x_1,\partial x_2),$$
      where $D$ is the determinant of the frame's cartesian components,
      $$D = \tfrac ar\cdot\tfrac ar - \tfrac br\cdot\big(-\tfrac br\big) = 1:$$
      the frame is a rotation of the cartesian basis, so the two results coincide. For the polar basis the determinant is $r$ (since $\partial y_2 = r\,e_2$), hence the factor $r$.

  - type: mcq
    id: w-flat
    title: Is ∇ᵂ curved?
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ is defined by $\nabla^{\mathrm{W}}_\mathcal{Z}e_1 = \nabla^{\mathrm{W}}_\mathcal{Z}e_2 = 0$ for every vector field $\mathcal{Z}$. Its curvature is the tensor
      $$\begin{aligned}&\mathrm{Riem}(\,\cdot\,,\mathcal{Z},\mathcal{X},\mathcal{Y})\\ &= \nabla_\mathcal{X}\nabla_\mathcal{Y}\mathcal{Z} - \nabla_\mathcal{Y}\nabla_\mathcal{X}\mathcal{Z}\\ &\quad - \nabla_{[\mathcal{X},\mathcal{Y}]}\mathcal{Z}.\end{aligned}$$
      What is $\mathrm{Riem}$, and why?
    options:
      - text: '$0$: with $\mathcal{Z} = e_a$ every term differentiates a parallel field, and $\mathrm{Riem}$ is $C^\infty$-linear in $\mathcal{Z}$, so it vanishes for every $\mathcal{Z} = w^ae_a$'
        correct: true
      - text: 'Nonzero: the cartesian coefficients depend on the position'
        feedback: |
          Position-dependent coefficients do not mean curvature (the polar coefficients of $\nabla^{\mathrm{E}}$ depend on $r$ and it is flat). Feed the frame to $\mathrm{Riem}$: every term is a covariant derivative of $e_a$, which is zero.
      - text: 'Nonzero: the torsion $\tfrac1r\,e_2$ feeds into the curvature through the $[\mathcal{X},\mathcal{Y}]$ term'
        feedback: |
          The term $\nabla_{[\mathcal{X},\mathcal{Y}]}e_a$ differentiates $e_a$ along the commutator, and $e_a$ is parallel along **every** direction, so it is $0$. Torsion and curvature are separate tensors.
    explanation: |
      $\mathrm{Riem}(\,\cdot\,,e_a,\mathcal{X},\mathcal{Y}) = 0 - 0 - 0$, and $C^\infty$-linearity in the carried slot gives $\mathrm{Riem}(\,\cdot\,,w^ae_a,\mathcal{X},\mathcal{Y}) = w^a\cdot0 = 0$. In polar it is immediate too: every term of $\mathrm{Riem}^i_{j12}$ contains a coefficient whose last index is $2$ (all zero) or $\partial y_2\lfloor\Gamma^2_{21}\rceil = \partial_\theta\tfrac1r = 0$. $\nabla^{\mathrm{W}}$ is **flat, with torsion**: transport is path independent (the vector just follows the frame), yet the frame fails to commute.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Setting.** The plane has points $(a,b)$, $r := \sqrt{a^2+b^2}$, cartesian chart with basis fields $\partial x_1,\partial x_2$, polar chart $(r,\theta)$ with basis fields $\partial y_1,\partial y_2$. Two of the three connections: $\nabla^{\mathrm{E}}$ has all cartesian coefficients $0$ (it differentiates cartesian components); $\nabla^{\mathrm{W}}$, on the plane minus the origin, makes the unit radial and angular fields $e_1 = (a,b)/r$, $e_2 = (-b,a)/r$ parallel. Here $\Gamma^i_{jk}$ are coefficients (last lower index = direction), $\mathtt{T}$ the torsion, $\mathrm{Riem}$ the curvature, $\mathcal{Z}$ a vector field, $\mathcal{X}\lfloor g\rceil$ the derivative of $g$ along $\mathcal{X}$.

      - **$\nabla^{\mathrm{E}}$**, polar coefficients (from $\nabla^{\mathrm{E}}$ differentiating cartesian components):
      $$\Gamma^1_{22} = -r,\quad \Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$$
      symmetric, so $\mathtt{T} = 0$; the curvature cancels term by term in pairs:
      $$\mathrm{Riem}^1_{212} = -1 + 1 = 0$$
      $$\mathrm{Riem}^2_{112} = -\tfrac1{r^2} + \tfrac1{r^2} = 0$$
      so $\nabla^{\mathrm{E}}$ is flat and torsion free in polar as in cartesian.
      - **$\nabla^{\mathrm{W}}$** ($\nabla^{\mathrm{W}}e_a = 0$, so for a field $w^ae_a$ with component functions $w^a$, $\nabla^{\mathrm{W}}_\mathcal{Z}(w^ae_a) = \mathcal{Z}\lfloor w^a\rceil e_a$); polar: only
      $$\Gamma^2_{21} = \tfrac1r;$$
      cartesian:
      $$\begin{gathered}\Gamma^2_{11} = \tfrac b{r^2},\quad \Gamma^2_{12} = -\tfrac a{r^2},\\ \Gamma^1_{21} = -\tfrac b{r^2},\quad \Gamma^1_{22} = \tfrac a{r^2}.\end{gathered}$$
      Torsion three ways:
      $$\mathtt{T}(\,\cdot\,,\partial y_1,\partial y_2) = \tfrac1r\,\partial y_2$$
      $$\mathtt{T}(\,\cdot\,,\partial x_1,\partial x_2) = \tfrac{-b\,\partial x_1 + a\,\partial x_2}{r^2}$$
      $$\mathtt{T}(\,\cdot\,,e_1,e_2) = -[e_1,e_2] = \tfrac1r\,e_2$$
      and $\mathrm{Riem} = 0$ (every term differentiates a parallel $e_a$): flat, with torsion.
      - **The lessons so far:** nonzero $\Gamma$'s prove nothing (the polar $\Gamma$'s of the flat $\nabla^{\mathrm{E}}$ do not vanish); only the tensors $\mathtt{T}$ and $\mathrm{Riem}$ decide; flat does not imply torsion free.

      **Next: "Guided Problem: Three Connections on the Plane · Part 2".** The third connection $\nabla^{\kappa}$, curved and torsion free, its sinusoidal straightest curves and the mismatch of a transported vector around a loop, the full table of four boxes, and a connection that fills the empty one.
