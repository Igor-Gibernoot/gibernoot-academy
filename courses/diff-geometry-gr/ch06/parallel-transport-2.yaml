id: ch06-parallel-transport-2
title: Parallel Transport and Autoparallels · Part 2
kind: concept
own: |
  - **Setting**: $\mathcal{M}$ is a manifold with a connection $\nabla$ and a chart with coefficients $\Gamma^k_{ji}$ (implicit sums over repeated indices); $\gamma\colon I\to\mathcal{M}$ is a smooth curve with coordinates $\gamma^k(\lambda)$, velocity $v_\gamma$ (components $\dot\gamma^k$, dots = $d/d\lambda$); $\text{ᚱ}$ is a smooth function of $\lambda$; the covariant derivative along $\gamma$ has components $(\nabla_{v_\gamma}\mathcal{X}_\gamma)^k = \dot x^k_\gamma + \Gamma^k_{ji}x^j_\gamma\dot\gamma^i$.
  - **Acceleration** {{ $a_\gamma := \nabla_{v_\gamma}v_\gamma$ }}, $a^k_\gamma = \ddot\gamma^k + \Gamma^k_{ji}\dot\gamma^i\dot\gamma^j$. **Autoparallel** {{ $a_\gamma = \text{ᚱ}\,v_\gamma$ }}, **autoparallelly transported** $a_\gamma = 0$:
  {{ $$\ddot\gamma^k + \Gamma^k_{ji}\,\dot\gamma^i\dot\gamma^j = 0\tag{A}$$ }}
  Only the symmetric part of $\Gamma$ enters (A).
  - **The plane** (points $(a,b)$, cartesian chart, polar chart $\mathscr{Y} = (r,\theta)$ with basis fields $\partial y_1,\partial y_2$; $\nabla^{\mathrm{E}}$ differentiates cartesian components, $\nabla^{\mathrm{P}}$ polar ones; the circle $\delta_{r_0}(\lambda) := (r_0\cos\lambda,\ r_0\sin\lambda)$ of radius $r_0>0$): under $\nabla^{\mathrm{E}}$ transport keeps cartesian components, autoparallels are constant-speed lines; along $\delta_{r_0}$ the transported polar components $z^1,z^2$ obey $\dot z^1 = r_0z^2$, $\dot z^2 = -z^1/r_0$, and the acceleration of the circle is $a_\delta := \nabla^{\mathrm{E}}_{v_\delta}v_\delta = -r_0\,\partial y_1$ (towards the centre). Under $\nabla^{\mathrm{P}}$ the circle is the straight one.
  - **Holonomy**: transport is defined along a curve, and two curves from $p$ to $q$ can carry a vector to different results; around a closed loop a vector can come back {{ different from the start }} (on the plane with $\nabla^{\mathrm{E}}$ it returns to itself: the cartesian components never move).

cards:
  - type: text
    id: recall-transport
    title: "Recall: covariant derivative along a curve, acceleration"
    body: |
      On a manifold with a connection $\nabla$ and a chart with coefficients $\Gamma^k_{ji}$ (sums over repeated indices), take a smooth curve $\gamma$ with coordinates $\gamma^k(\lambda)$ and velocity $v_\gamma$ with components $\dot\gamma^k$ (dot $= d/d\lambda$). The covariant derivative of a field $\mathcal{X}_\gamma$ along $\gamma$, with components $x^k_\gamma$, is
      $$(\nabla_{v_\gamma}\mathcal{X}_\gamma)^k = \dot x^k_\gamma + \Gamma^k_{ji}\,x^j_\gamma\,\dot\gamma^i,$$
      and $\mathcal{X}_\gamma$ is **parallelly transported** if this vanishes. The **acceleration** is $a_\gamma := \nabla_{v_\gamma}v_\gamma$ (it needs a connection), and $\gamma$ is **autoparallel** if $a_\gamma = \text{ᚱ}\,v_\gamma$ for some function $\text{ᚱ}$ (velocity keeps its direction), **autoparallelly transported** if $a_\gamma = 0$ (the lesson Parallel Transport and Autoparallels · Part 1 built these).

      On the plane there are two connections: $\nabla^{\mathrm{E}}$ differentiates **cartesian** components, $\nabla^{\mathrm{P}}$ differentiates **polar** ones (chart $(r,\theta)$, $\theta\in(-\pi,\pi)$). The coefficients of $\nabla^{\mathrm{E}}$ in the polar chart are $\Gamma^1_{22} = -r$ and $\Gamma^2_{12} = \Gamma^2_{21} = 1/r$, and the question left open is the opening one: the circle $\delta_{r_0}(\lambda) = (r_0\cos\lambda,\ r_0\sin\lambda)$, is it straight?

  - type: text
    id: autoparallel-eq
    title: The autoparallel equation
    body: |
      Apply the chart formula (C) to the velocity itself: its components are $x^k_\gamma = \dot\gamma^k$, whose derivative is the second derivative
      $$\ddot\gamma^k(\lambda) := (\mathscr{X}^k\circ\gamma)''(\lambda).$$
      So the acceleration has components
      $$a^k_\gamma = \ddot\gamma^k + \Gamma^k_{ji}\,\dot\gamma^i\,\dot\gamma^j.$$
      Since the $(\partial x_k)_{\gamma(\lambda)}$ form a basis, "autoparallel" becomes, component by component,
      $$\ddot\gamma^k + \Gamma^k_{ji}\,\dot\gamma^i\dot\gamma^j = \text{ᚱ}\,\dot\gamma^k$$
      and "autoparallelly transported" ($\text{ᚱ}\equiv0$) is the **autoparallel equation**
      $$\ddot\gamma^k + \Gamma^k_{ji}\,\dot\gamma^i\dot\gamma^j = 0\tag{A}$$
      with $\Gamma^k_{ji}$ at $\gamma(\lambda)$: $d$ second-order ODEs for the chart representative $(\mathscr{X}\circ\gamma)(\lambda)$. In general relativity, freely falling bodies follow such curves (for the connection built from the metric, Level 7): (A) is the law of motion that replaces Newton's $\ddot x = F/m$, with gravity hidden in the $\Gamma$'s.

  - type: mcq
    id: euclid-autoparallels
    title: Straight lines come back
    prompt: |
      The autoparallel equation $\ddot\gamma^k + \Gamma^k_{ji}\,\dot\gamma^i\dot\gamma^j = 0$ decides which curves are autoparallelly transported. For $\nabla^{\mathrm{E}}$ on the plane, every coefficient vanishes in the cartesian chart. Which curves solve it?
    options:
      - text: 'The lines $\lambda\mapsto(a_0,b_0) + \lambda\,(u,w)$, run at constant speed'
        correct: true
      - text: 'All straight lines, however they are parametrized'
        feedback: |
          The equation is $\ddot\gamma^k = 0$, which also fixes the **speed**. The line $\lambda\mapsto(\lambda^3, 0)$ has $\ddot\gamma^1 = 6\lambda\neq0$: it is autoparallel (its acceleration is along its velocity), but not autoparallelly transported.
      - text: 'Every curve, since the coefficients are zero'
        feedback: |
          Zero coefficients remove the $\Gamma$ term, but $\ddot\gamma^k$ remains: $\ddot\gamma^k = 0$. A circle has $\ddot\gamma^k\neq0$.
    explanation: |
      $\ddot\gamma^k = 0$ integrates twice to $\gamma^k(\lambda) = \gamma^k(0) + \lambda\,\dot\gamma^k(0)$. The autoparallels of $\nabla^{\mathrm{E}}$ are the straight lines of school geometry, now characterized by a connection rather than by a ruler.

  - type: mcq
    id: symmetric-part
    title: What the autoparallels see
    prompt: |
      On the plane, define a connection $\nabla$ by its cartesian coefficients ($\nabla_{\partial x_i}\partial x_j = \Gamma^k_{ji}\,\partial x_k$):
      $$\Gamma^1_{12} = 1,\quad\Gamma^1_{21} = -1,$$
      all others zero. Its autoparallelly transported curves solve $\ddot\gamma^k + \Gamma^k_{ji}\,\dot\gamma^i\dot\gamma^j = 0$. Which curves are they?
    options:
      - text: 'The constant-speed straight lines, the same as for $\nabla^{\mathrm{E}}$'
        correct: true
      - text: 'Curves that spiral, because the coefficients are nonzero'
        feedback: |
          Look at the sum for $k = 1$: $\Gamma^1_{12}\dot\gamma^2\dot\gamma^1 + \Gamma^1_{21}\dot\gamma^1\dot\gamma^2 = (1 - 1)\,\dot\gamma^1\dot\gamma^2 = 0$. The product $\dot\gamma^i\dot\gamma^j$ is symmetric in $i,j$, so it cancels the antisymmetric coefficients.
      - text: 'There are none, since the coefficients are not symmetric'
        feedback: |
          Any choice of coefficients defines a connection, and the autoparallel equation always has solutions (one for each starting point and velocity, by the ODE theorem). Here the $\Gamma$ term cancels and the equation is $\ddot\gamma^k = 0$.
    explanation: |
      Because $\dot\gamma^i\dot\gamma^j = \dot\gamma^j\dot\gamma^i$, only the **symmetric part** $\tfrac12(\Gamma^k_{ji} + \Gamma^k_{ij})$ enters the autoparallel equation (A). Two connections with the same symmetric part have the same autoparallels. The antisymmetric part is invisible to them, but not to parallel transport: see the next question.

  - type: numeric
    id: antisym-transport
    title: Same straight lines, different transport
    prompt: |
      On the plane, a connection has cartesian coefficients $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$, all others zero (convention $\nabla_{\partial x_i}\partial x_j = \Gamma^k_{ji}\,\partial x_k$). Its autoparallels are the ordinary straight lines. Transport the vector $z(0) = (0,1)$ along the line $\gamma(\lambda) = (\lambda, 0)$, using $\dot z^k + \Gamma^k_{ji}\,z^j\,\dot\gamma^i = 0$. What is the first component $z^1$ at $\lambda = 1$?
    answer: 1
    tolerance: 0.01
    wrong:
      - { value: 0, feedback: 'That is transport under $\nabla^{\mathrm{E}}$. Here $\dot\gamma = (1,0)$, so for $k = 1$ only $i = 1$ survives: $\dot z^1 + \Gamma^1_{21}z^2 = \dot z^1 - z^2 = 0$, and $z^2$ stays $1$.' }
      - { value: -1, feedback: 'Sign: the term is $\Gamma^1_{21}z^2\dot\gamma^1 = -z^2$, so $\dot z^1 - z^2 = 0$ and $\dot z^1 = +z^2 = 1$.' }
    hint: |
      With $\dot\gamma = (1,0)$ only the direction index $i = 1$ survives. Find the equations for $z^2$ (all $\Gamma^2 = 0$) and then for $z^1$.
    explanation: |
      $\dot z^2 = 0$ gives $z^2 = 1$; then $\dot z^1 = -\Gamma^1_{21}z^2 = 1$, so $z^1 = \lambda$ and $z(1) = (1,1)$. Along a straight line that this connection itself calls straight, a transported vector still tilts. The antisymmetric part of the coefficients, invisible to autoparallels, is the **torsion** of the next lesson.

  - type: text
    id: vertical-polar
    title: A straight line in polar coordinates
    body: |
      The vertical line $\gamma_{x_0}(\lambda) = (x_0,\lambda)$, $x_0>0$, solves the autoparallel equation (A) for $\nabla^{\mathrm{E}}$ in the cartesian chart: $\ddot\gamma^k = 0$. A solution of a chart-independent condition ($a_\gamma = 0$) must solve the polar version too, where the representative is curved and the $\Gamma$'s are $-r$ and $1/r$. With $r = \sqrt{x_0^2+\lambda^2}$ and $\theta = \arctan(\lambda/x_0)$:
      $$\begin{gathered}\dot\gamma^1 = \frac{\lambda}{\sqrt{x_0^2+\lambda^2}}\\ \dot\gamma^2 = \frac{x_0}{x_0^2+\lambda^2}\end{gathered}$$
      $$\begin{gathered}\ddot\gamma^1 = \frac{x_0^2}{(x_0^2+\lambda^2)^{3/2}}\\ \ddot\gamma^2 = -\frac{2x_0\lambda}{(x_0^2+\lambda^2)^2}\end{gathered}$$
      In polar form the autoparallel equation (A) reads
      $$\begin{gathered}\ddot\gamma^1 - r\,(\dot\gamma^2)^2 = 0\\ \ddot\gamma^2 + \tfrac2r\,\dot\gamma^1\dot\gamma^2 = 0\end{gathered}$$
      (in the second line, $\Gamma^2_{12}$ and $\Gamma^2_{21}$ both contribute). Check it at $x_0 = 1$, $\lambda = 1$, where $r = \sqrt2$, $\dot\gamma = (1/\sqrt2,\ 1/2)$ and $\ddot\gamma = (1/(2\sqrt2),\ -1/2)$.

  - type: numeric
    id: vertical-k1
    title: Check the radial equation
    prompt: |
      Under $\nabla^{\mathrm{E}}$ in the polar chart ($\Gamma^1_{22} = -r$, $\Gamma^2_{12} = \Gamma^2_{21} = 1/r$), the radial component of the autoparallel equation is $\ddot\gamma^1 - r\,(\dot\gamma^2)^2 = 0$. Along the vertical line $\gamma_1(\lambda) = (1,\lambda)$, at $\lambda = 1$: $r = \sqrt2$ and $\dot\gamma^2 = \dot\theta = 1/2$. What value of $\ddot\gamma^1$ does the equation demand? (Three decimals.)
    answer: 0.3536
    tolerance: 0.002
    answerText: '\sqrt2/4 \approx 0.354'
    wrong:
      - { value: 0.7071, feedback: 'Square the velocity component: $(\dot\gamma^2)^2 = 1/4$, so $r(\dot\gamma^2)^2 = \sqrt2/4$, not $\sqrt2/2$.' }
      - { value: -0.3536, feedback: 'Sign: the equation is $\ddot\gamma^1 = +r(\dot\gamma^2)^2$, because $\Gamma^1_{22} = -r$ enters with a plus.' }
    hint: |
      $\ddot\gamma^1 = r\,(\dot\gamma^2)^2$.
    explanation: |
      $\ddot\gamma^1 = \sqrt2\cdot\tfrac14 = \tfrac{\sqrt2}4\approx0.354$. Differentiating $r = \sqrt{1+\lambda^2}$ twice gives $(1+\lambda^2)^{-3/2} = 2^{-3/2} = \tfrac{\sqrt2}4$ at $\lambda = 1$. ✓ The radius speeds up its growth exactly as the $\Gamma$ term requires, a "centrifugal" term of the polar chart.

  - type: numeric
    id: vertical-k2
    title: Check the angular equation
    prompt: |
      Under $\nabla^{\mathrm{E}}$ in the polar chart, $\Gamma^2_{12} = \Gamma^2_{21} = 1/r$ and the angular component of the autoparallel equation is $\ddot\gamma^2 + \Gamma^2_{12}\dot\gamma^1\dot\gamma^2 + \Gamma^2_{21}\dot\gamma^2\dot\gamma^1 = 0$. Along the vertical line $\gamma_1(\lambda) = (1,\lambda)$, at $\lambda = 1$: $r = \sqrt2$, $\dot\gamma^1 = 1/\sqrt2$, $\dot\gamma^2 = 1/2$. Compute the $\Gamma$ term $\Gamma^2_{12}\dot\gamma^1\dot\gamma^2 + \Gamma^2_{21}\dot\gamma^2\dot\gamma^1$.
    answer: 0.5
    tolerance: 0.005
    wrong:
      - { value: 0.25, feedback: 'That counts only one of $\Gamma^2_{12}$, $\Gamma^2_{21}$. The sum over $i,j$ contains both $(i,j) = (1,2)$ and $(2,1)$, each giving $\tfrac1{\sqrt2}\cdot\tfrac1{\sqrt2}\cdot\tfrac12 = \tfrac14$.' }
    hint: |
      Each of the two terms equals $\tfrac1{\sqrt2}\cdot\tfrac1{\sqrt2}\cdot\tfrac12$.
    explanation: |
      $2\cdot\tfrac14 = \tfrac12$, so the equation demands $\ddot\gamma^2 = -\tfrac12$, and indeed $-2x_0\lambda/(x_0^2+\lambda^2)^2 = -2/4 = -\tfrac12$. ✓ A curved polar representative, yet a straight line: the $\Gamma$'s exactly undo the bending that the chart introduces.

  - type: text
    id: circle-accel
    title: The circle's acceleration
    body: |
      Now the circle under $\nabla^{\mathrm{E}}$. In polar coordinates $\dot\delta = (0,1)$ and $\ddot\delta = (0,0)$, so
      $$\begin{aligned}a^1 &= 0 + \Gamma^1_{22}\cdot1\cdot1 = -r_0\\ a^2 &= 0 + 2\cdot\tfrac1{r_0}\cdot0\cdot1 = 0\end{aligned}$$
      $$a_\delta = -r_0\,\partial y_1.$$
      In cartesian coordinates, $\ddot\delta = (-r_0\cos\lambda, -r_0\sin\lambda)$, the same vector (along the curve $\partial y_1 = \cos\lambda\,\partial x_1 + \sin\lambda\,\partial x_2$): it points to the centre. The velocity is $\partial y_2$, around the circle. So $a_\delta$ is not a multiple of $v_\delta$: the circle is **not even autoparallel** for $\nabla^{\mathrm{E}}$.

  - type: mcq
    id: reparametrize
    title: Can a new parameter help?
    prompt: |
      Under $\nabla^{\mathrm{E}}$, the circle $\delta_{r_0}$ has velocity $v = \partial y_2$ and acceleration $a = -r_0\,\partial y_1$ (towards the centre). Reparametrize it: $\delta_{r_0}\circ\text{ᚱ}$ with a smooth $\text{ᚱ}\colon\mathbb{R}\to\mathbb{R}$, $\mu\mapsto\lambda = \text{ᚱ}(\mu)$, $\text{ᚱ}'\neq0$. The chain rule ($v_{\delta\circ\text{ᚱ}} = \text{ᚱ}'\,v$) and the chart formula (C) give the new acceleration
      $$\text{ᚱ}''\,v + (\text{ᚱ}')^2\,a.$$
      Can some choice of $\text{ᚱ}$ make the circle autoparallel (acceleration a multiple of velocity)?
    options:
      - text: |
          No: the new parameter only adds multiples of $v$, while the part $(\text{ᚱ}')^2 a$, along $\partial y_1$, never vanishes
        correct: true
      - text: |
          Yes: choose $\text{ᚱ}$ so that the speed changes in a way that cancels the acceleration
        feedback: |
          Changing the speed only produces the term $\text{ᚱ}''\,v$, along $\partial y_2$. The part $(\text{ᚱ}')^2\,a = -(\text{ᚱ}')^2r_0\,\partial y_1$ points to the centre and is nonzero since $\text{ᚱ}'\neq0$. No multiple of $\partial y_2$ cancels a $\partial y_1$ component.
      - text: |
          Yes: run the circle at constant speed, $\text{ᚱ}(\mu) = \mu$
        feedback: |
          That is the original parametrization, with $a = -r_0\,\partial y_1$ not a multiple of $v = \partial y_2$. Constant speed does not make a curve straight; it must also not turn.
    explanation: |
      Being autoparallel is a property of the **path**, independent of the parametrization, and the circle fails it for $\nabla^{\mathrm{E}}$. Being autoparallelly transported also depends on the parametrization: the radial curve $\lambda\mapsto\lambda^2(\cos\theta_0,\sin\theta_0)$ is autoparallel but not autoparallelly transported.

  - type: widget
    id: autoparallel-widget
    title: Which curves are straight?
    widget: parallel-transport
    config:
      curve: { type: circle, r0: 2 }
      connection: E
      connections: [E, P]
      z0: [1, 0]
      showAcceleration: true
      badge: true
      residual: false
      trail: false
      view: { x: -3.2, y: -3.2, w: 6.4, h: 6.4 }
      presets:
        - { label: 'Circle, ∇ᴱ', curve: { type: circle, r0: 2 }, connection: E, z0: [1, 0], lambda: 0.8 }
        - { label: 'Circle, ∇ᴾ', curve: { type: circle, r0: 2 }, connection: P, z0: [0, 1], lambda: 0.8 }
        - { label: 'Vertical, ∇ᴱ', curve: { type: vertical, x0: 1 }, connection: E, z0: [0, 1], lambda: 1 }
        - { label: 'Vertical, ∇ᴾ', curve: { type: vertical, x0: 1 }, connection: P, z0: [0, 1], lambda: 1 }
        - { label: 'Radial λ², ∇ᴱ', curve: radial-squared, connection: E, z0: [1, 1], lambda: 1.5 }
    body: |
      The gold point is $\gamma(\lambda)$; from it start the velocity $v_\gamma$ (solid) and the acceleration $a_\gamma = \nabla_{v_\gamma}v_\gamma$ (dashed), computed with the chosen connection. The badge **Autoparallel?** checks the whole curve: "Yes, even autoparallelly transported" ($a_\gamma = 0$), "Yes, but not autoparallelly transported" ($a_\gamma = \text{ᚱ}\,v_\gamma$), or "No".

      1. Press the two circle presets. Compare the dashed arrow and the badge.
      2. Press the two vertical-line presets.
      3. Press "Radial λ², ∇ᴱ": the point runs along a ray, $\gamma(\lambda) = \lambda^2(\cos\theta_0,\sin\theta_0)$. Read $a_\gamma$ and $v_\gamma$.

  - type: mcq
    id: hook-resolved
    title: Is the circle straight? Resolved
    multiple: true
    prompt: |
      On the plane, $\nabla^{\mathrm{E}}$ has zero coefficients in the cartesian chart, and $\nabla^{\mathrm{P}}$ has zero coefficients in the polar chart $\mathscr{Y} = (r,\theta)$ (defined off the half-line $\{b = 0,\ a\le0\}$). A curve is autoparallelly transported if its acceleration $a_\gamma = \nabla_{v_\gamma}v_\gamma$ vanishes. Select every true statement about the circle $\delta_{r_0}(\lambda) = (r_0\cos\lambda, r_0\sin\lambda)$ and the vertical line $\gamma_{x_0}(\lambda) = (x_0,\lambda)$, $x_0>0$.
    options:
      - text: 'Under $\nabla^{\mathrm{P}}$ the circle is autoparallelly transported (where the chart is defined)'
        correct: true
      - text: 'Under $\nabla^{\mathrm{E}}$ the circle is not even autoparallel'
        correct: true
      - text: 'Under $\nabla^{\mathrm{P}}$ the vertical line is autoparallel, since it is a straight line'
        feedback: |
          "Straight line" is the verdict of $\nabla^{\mathrm{E}}$. Under $\nabla^{\mathrm{P}}$, with zero polar coefficients, the acceleration is $\ddot\gamma^k$ in polar coordinates, $(1/(2\sqrt2),\ -1/2)$ at $x_0 = \lambda = 1$, while the velocity is $(1/\sqrt2,\ 1/2)$: not proportional. So it is not autoparallel for $\nabla^{\mathrm{P}}$.
      - text: 'The circle is autoparallel or not regardless of the connection, since it is a fixed set of points'
        feedback: |
          The acceleration $\nabla_{v_\gamma}v_\gamma$ is computed **with** a connection. Under $\nabla^{\mathrm{P}}$ the circle has constant polar velocity components $(0,1)$ and zero coefficients, so $a = 0$; under $\nabla^{\mathrm{E}}$, $a = -r_0\,\partial y_1\neq0$.
    explanation: |
      Under $\nabla^{\mathrm{P}}$ the polar representative of $\delta_{r_0}$ is $(r_0,\lambda)$, with $\ddot\gamma^k = 0$ and $\Gamma^{\mathrm{P}}_\mathscr{Y} = 0$: autoparallelly transported. The roles swap for the vertical line. "Straight" belongs to the pair (curve, connection), not to the curve. The answer to the hook: the circle is straight for $\nabla^{\mathrm{P}}$ only.

  - type: numeric
    id: radial-squared
    title: Autoparallel, not transported
    prompt: |
      On the plane with $\nabla^{\mathrm{E}}$ (cartesian coefficients zero, so $a_\gamma$ has cartesian components $\ddot\gamma^k$), take the ray run as
      $$\gamma(\lambda) = \lambda^2\,(\cos\theta_0,\ \sin\theta_0),\quad \lambda>0.$$
      Its acceleration is a multiple of its velocity, $a_\gamma(\lambda) = \text{ᚱ}(\lambda)\,v_\gamma(\lambda)$, so it is autoparallel. Find $\text{ᚱ}(1.5)$ (three decimals).
    answer: 0.6667
    tolerance: 0.005
    answerText: '2/3'
    wrong:
      - { value: 1.5, feedback: 'That is $\lambda$, not $\text{ᚱ}(\lambda)$. With $v = 2\lambda\,u$ and $a = 2u$ ($u$ the unit direction), $a = \tfrac1\lambda v$.' }
      - { value: 0, feedback: '$a_\gamma = 0$ would make the curve autoparallelly transported. Here the speed $2\lambda$ grows, so $\ddot\gamma = 2u\neq0$.' }
      - { value: 3, feedback: 'That is the speed $2\lambda$ at $\lambda = 1.5$. The ratio is $a/v = 2/(2\lambda) = 1/\lambda$.' }
    hint: |
      With $u = (\cos\theta_0,\sin\theta_0)$: $v_\gamma = 2\lambda\,u$ and $a_\gamma = 2u$.
    explanation: |
      $a_\gamma = 2u = \tfrac1\lambda\,(2\lambda u)$, so $\text{ᚱ}(\lambda) = 1/\lambda$ and $\text{ᚱ}(1.5) = 2/3$. The path is a straight ray, run at increasing speed: the direction never turns, but the speed changes. The new parameter $\mu = \lambda^2$ makes it autoparallelly transported.

  - type: text
    id: holonomy
    title: Going all the way round
    body: |
      Transport under $\nabla^{\mathrm{E}}$ along the full circle, $\lambda$ from $0$ to $2\pi$: the polar components $(\cos\lambda, -\tfrac1{r_0}\sin\lambda)$ return to $(1,0)$, and the cartesian components never moved. The vector comes back to itself.

      That is special. Transport is defined **along a curve**, and two curves from $p$ to $q$ may carry the same vector to different results. Then the transported vectors are not the values of any vector field on $\mathcal{M}$, and a vector carried around a closed loop can come back **rotated**. A preview (stated here without proof): on a sphere, carry a vector from the north pole down to the equator, a quarter of the way along it, and back up, always "without turning"; it returns rotated by $90°$. This failure to return is the **holonomy** of $\nabla$. For $\nabla^{\mathrm{E}}$ there is none: the plane is flat. What measures it is the **curvature**.

  - type: mcq
    id: holonomy-check
    title: Back where you started
    prompt: |
      On the plane, a vector starting at $(r_0,0)$ with cartesian components $(1,0)$ is transported once around the circle $\delta_{r_0}(\lambda) = (r_0\cos\lambda, r_0\sin\lambda)$ under $\nabla^{\mathrm{E}}$. Along the way its polar components are $z^1 = \cos\lambda$, $z^2 = -\tfrac1{r_0}\sin\lambda$. What comes back at $\lambda = 2\pi$?
    options:
      - text: 'The same vector, $\partial x_1$: no holonomy'
        correct: true
      - text: 'The vector rotated by $2\pi$ relative to the polar basis, so a different vector'
        feedback: |
          At $\lambda = 2\pi$ the polar basis is back to its starting position too, and $(z^1,z^2) = (\cos2\pi, -\tfrac1{r_0}\sin2\pi) = (1,0)$: the same vector. The rotation **relative to the basis** happened only because the basis turned.
      - text: 'Nothing can be said, because polar coordinates fail at $\lambda = \pi$'
        feedback: |
          The chart $\theta\in(-\pi,\pi)$ misses the point at $\lambda = \pi$, but $\nabla^{\mathrm{E}}$ lives on the whole plane: in cartesian components the transport is $\dot z^k = 0$ along the whole circle. (It is $\nabla^{\mathrm{P}}$ that stops at $\lambda = \pi$, since it is defined only on the chart domain.)
    explanation: |
      Cartesian components stay $(1,0)$ all the way. For $\nabla^{\mathrm{E}}$ transport is independent of the path: the plane with $\nabla^{\mathrm{E}}$ is flat.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Next: "Torsion and Curvature · Part 1".** Two things this lesson left open become tensors: the antisymmetric part of the $\Gamma$'s, which autoparallels ignore but which tilted a transported vector along a straight line (**torsion**), and the failure of transport around a loop to return a vector to itself (**curvature**).
