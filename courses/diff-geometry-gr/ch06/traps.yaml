id: ch06-traps
title: Connection Traps
kind: traps

cards:
  - type: text
    id: intro
    title: Trap round
    body: |
      Fast round: each question hides a tempting mistake from this level, from the connection coefficients to curvature. Answer quickly, then read the feedback, especially when you got it right for a shaky reason.

      Notation used below: the plane has points $(a,b)$, the cartesian chart $\mathscr{X}$ with basis fields $\partial x_1 = \partial/\partial a$, $\partial x_2 = \partial/\partial b$, and the polar chart $\mathscr{Y} = (r,\theta)$ with $\partial y_1 = \partial/\partial r$, $\partial y_2 = \partial/\partial\theta$. A connection $\nabla$ has coefficient functions $\Gamma^i_{jk}$ in a chart, defined by
      $$\nabla_{\partial x_k}\partial x_j = \Gamma^i_{jk}\,\partial x_i$$
      (upper index: output component; first lower index: differentiated basis field; **last** lower index: direction). Three connections recur:
      - $\nabla^{\mathrm{E}}$: all cartesian coefficients zero (it differentiates cartesian components);
      - $\nabla^{\mathrm{W}}$, on the plane minus the origin: the unit radial and angular fields $e_1 = \partial y_1$, $e_2 = \tfrac1r\partial y_2$ are declared parallel;
      - $\nabla^{\kappa}$, for a number $\kappa$: the single nonzero cartesian coefficient $\Gamma^1_{22} = \kappa\,a$.

  - type: numeric
    id: gamma-not-tensor
    title: Zero in one chart
    prompt: |
      On the plane, $\nabla^{\mathrm{E}}$ has all cartesian coefficients zero. Take the sheared chart $\mathscr{Y} = (u, v)$ with
      $$u = a,\quad v = b - a^2,$$
      whose basis fields are $\partial y_1 = \partial x_1 + 2a\,\partial x_2$ and $\partial y_2 = \partial x_2$. Using $\nabla^{\mathrm{E}}_{\partial y_1}\partial y_1 = (\Gamma^{\mathrm{E}}_\mathscr{Y})^i_{11}\,\partial y_i$, find $(\Gamma^{\mathrm{E}}_\mathscr{Y})^2_{11}$ at $p = (3,1)$.
    answer: 2
    wrong:
      - { value: 0, feedback: 'Zero would follow if the $\Gamma$''s were tensor components (zero in one chart, zero in all). They are not: $\nabla^{\mathrm{E}}$ differentiates the cartesian components $(1, 2a)$ of $\partial y_1$, and $\partial y_1\lfloor 2a\rceil = 2$, so $\nabla^{\mathrm{E}}_{\partial y_1}\partial y_1 = 2\,\partial x_2 = 2\,\partial y_2$.' }
      - { value: 6, feedback: '$6 = 2a$ at $a = 3$ is the cartesian component of $\partial y_1$ itself, not of its derivative. Differentiate it along $\partial y_1$: $\partial y_1\lfloor 2a\rceil = 2$.' }
    hint: |
      $\nabla^{\mathrm{E}}$ differentiates cartesian components: apply $\partial y_1$ to the components $(1, 2a)$ of $\partial y_1$.
    explanation: |
      $\partial y_1\lfloor 1\rceil = 0$ and $\partial y_1\lfloor 2a\rceil = 2$, so
      $$\nabla^{\mathrm{E}}_{\partial y_1}\partial y_1 = 2\,\partial x_2 = 2\,\partial y_2.$$
      Hence $(\Gamma^{\mathrm{E}}_\mathscr{Y})^2_{11} = 2$ everywhere. The transformation law agrees: with $\Gamma_\mathscr{X} = 0$ only the inhomogeneous term survives,
      $$\frac{\partial\mathscr{Y}^2}{\partial\mathscr{X}^s}\frac{\partial^2\mathscr{X}^s}{\partial u^2} = 1\cdot 2 = 2,$$
      since $\mathscr{X} = (u,\ v + u^2)$. Coefficients that vanish in one chart need not vanish in another: the $\Gamma$'s are not a tensor.

  - type: numeric
    id: index-order
    title: Which index is the direction?
    prompt: |
      On the plane minus the origin, $r = \sqrt{a^2+b^2}$, the connection $\nabla^{\mathrm{W}}$ has the nonzero cartesian coefficients
      $$\begin{gathered}\Gamma^2_{11} = \tfrac b{r^2},\quad \Gamma^2_{12} = -\tfrac a{r^2},\\ \Gamma^1_{21} = -\tfrac b{r^2},\quad \Gamma^1_{22} = \tfrac a{r^2},\end{gathered}$$
      with $\nabla_{\partial x_k}\partial x_j = \Gamma^i_{jk}\,\partial x_i$ (last lower index = direction). At $p = (3,4)$, what is the $\partial x_1$-component of $\nabla^{\mathrm{W}}_{\partial x_2}\partial x_1$?
    answer: 0
    wrong:
      - { value: -0.16, feedback: 'That is $\Gamma^1_{21} = -b/r^2 = -4/25$, with the direction first. Here the direction is $\partial x_2$ ($k = 2$) and the differentiated field $\partial x_1$ ($j = 1$): the coefficient is $\Gamma^1_{12}$, which is not in the list, so it is $0$.' }
      - { value: -0.12, feedback: 'That is $\Gamma^2_{12} = -a/r^2$, the $\partial x_2$-component. The question asks for the $\partial x_1$-component, upper index $1$: $\Gamma^1_{12} = 0$.' }
    hint: |
      Differentiated field $j = 1$, direction $k = 2$, output $i = 1$.
    explanation: |
      $$\nabla^{\mathrm{W}}_{\partial x_2}\partial x_1 = \Gamma^1_{12}\,\partial x_1 + \Gamma^2_{12}\,\partial x_2 = -\tfrac a{r^2}\,\partial x_2.$$
      Its $\partial x_1$-component is $\Gamma^1_{12} = 0$, while $\Gamma^1_{21} = -4/25$ at $(3,4)$. For a connection with torsion, swapping the two lower indices changes the number: the order is part of the definition.

  - type: mcq
    id: scalar-rule
    title: Does f care about the connection?
    prompt: |
      On the plane minus the origin, take the function $f = r = \sqrt{a^2+b^2}$ and the direction $(\partial x_1)_p$ at $p = (3,4)$. Compare $\nabla_{(\partial x_1)_p}f$ for $\nabla^{\mathrm{E}}$, $\nabla^{\mathrm{W}}$ and $\nabla^{\kappa}$ with $\kappa = 2$. What do you find?
    options:
      - text: 'All three give $0.6$'
        correct: true
      - text: 'Only $\nabla^{\mathrm{E}}$ gives $0.6$; the other two add a $\Gamma$ correction'
        feedback: |
          $\Gamma$ corrections come from differentiating basis fields, and a function has none. The rule for functions is fixed for every connection: $\nabla_{\mathcal{X}_p}f = \mathcal{X}_p(f)$, here $\partial_a r = a/r = 0.6$.
      - text: '$\nabla^{\mathrm{W}}$ gives $0$, since it keeps radial quantities constant'
        feedback: |
          $\nabla^{\mathrm{W}}$ keeps the **frame components** of transported vectors constant; it says nothing new about functions. $r$ grows along $\partial x_1$ at $(3,4)$ at rate $a/r = 0.6$, whatever the connection.
      - text: 'The three differ, since every covariant derivative depends on the connection'
        feedback: |
          True for vector, covector and tensor fields, false for functions: their derivative along $\mathcal{X}_p$ needs no comparison of different tangent spaces, only the values of $f$, so no extra structure enters.
    explanation: |
      Scalar rule, the same for every connection:
      $$\nabla_{\mathcal{X}_p}f = \mathcal{X}_p(f).$$
      Here $(\partial x_1)_p(r) = a/r = 3/5$. A connection is needed only to differentiate objects whose components refer to a basis.

  - type: numeric
    id: covector-sign
    title: The sign for covectors
    prompt: |
      In the polar chart, $\nabla^{\mathrm{E}}$ has the nonzero coefficients $\Gamma^1_{22} = -r$ and $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$ (last lower index = direction). Covector fields obey
      $$(\nabla_\mathcal{X}\mathsf{X})_k = \mathcal{X}\lfloor\mathtt{x}_k\rceil - \Gamma^j_{ki}\,\mathtt{x}_j\,x^i.$$
      Take $\mathsf{X} = dy^1$ ($= dr$, components $(1,0)$) and $\mathcal{X} = \partial y_2$ (components $(0,1)$). Find $(\nabla^{\mathrm{E}}_{\partial y_2}dy^1)_2$ at $p = (3,4)$.
    answer: 5
    wrong:
      - { value: -5, feedback: 'That uses $+\Gamma$, the vector rule. For covectors the correction enters with a minus: $-\Gamma^1_{22}\cdot1\cdot1 = -(-5) = 5$. The sign is forced by $(\nabla_\mathcal{X}\mathsf{X})\lceil\mathcal{Y}\rfloor = \mathcal{X}\lfloor\mathsf{X}\lceil\mathcal{Y}\rfloor\rceil - \mathsf{X}\lceil\nabla_\mathcal{X}\mathcal{Y}\rfloor$.' }
      - { value: 0, feedback: 'The components $(1,0)$ are constant, so the first term vanishes, but the correction does not: $-\Gamma^1_{22}\,\mathtt{x}_1\,x^2 = r = 5$.' }
      - { value: 0.2, feedback: 'The correction for component $k = 2$ with $\mathtt{x}_j$ nonzero only for $j = 1$ and direction $i = 2$ uses $\Gamma^1_{22} = -r$, not $\Gamma^2_{12}$: the result is $-(-r) = 5$.' }
    hint: |
      Only $j = 1$ (the nonzero component) and $i = 2$ (the direction) contribute: the coefficient is $\Gamma^1_{22}$.
    explanation: |
      $$\begin{aligned}(\nabla^{\mathrm{E}}_{\partial y_2}dy^1)_2 &= 0 - \Gamma^1_{22}\cdot 1\cdot 1\\ &= r = 5.\end{aligned}$$
      Check in cartesian components: $dr = \tfrac ar dx^1 + \tfrac br dx^2$, and $\partial y_2 = -b\,\partial x_1 + a\,\partial x_2$ gives $\partial y_2\lfloor\tfrac ar\rceil = -\tfrac br$, $\partial y_2\lfloor\tfrac br\rceil = \tfrac ar$, so
      $$\nabla^{\mathrm{E}}_{\partial y_2}dr = \tfrac1r(-b\,dx^1 + a\,dx^2) = r\,d\theta.$$
      Rule of thumb: $+\Gamma$ for each upper index, $-\Gamma$ for each lower one.

  - type: numeric
    id: two-slots
    title: Which slot pulls functions out?
    prompt: |
      On the plane with $\nabla^{\mathrm{E}}$, let $g = b$ and $\mathcal{Y} = b\,\partial x_1$. The direction slot is $C^\infty$-linear: $\nabla^{\mathrm{E}}_{g\,\partial x_2}\mathcal{Y} = g\,\nabla^{\mathrm{E}}_{\partial x_2}\mathcal{Y}$. At $p = (2,3)$, what is the $\partial x_1$-component of
      $$\nabla^{\mathrm{E}}_{\partial x_2}(g\,\mathcal{Y})?$$
    answer: 6
    wrong:
      - { value: 3, feedback: 'That pulls $g$ out of the **differentiated** slot as if it were the direction slot: $g(p)\,\nabla_{\partial x_2}\mathcal{Y} = 3$. In that slot Leibniz holds, $\nabla_\mathcal{X}(g\mathcal{Y}) = \mathcal{X}\lfloor g\rceil\mathcal{Y} + g\nabla_\mathcal{X}\mathcal{Y}$, which adds $\partial_b(b)\cdot b = 3$.' }
      - { value: 9, feedback: '$9 = b^2$ is the component of $g\,\mathcal{Y} = b^2\,\partial x_1$ itself. Its derivative along $\partial x_2$ is $\partial_b(b^2) = 2b = 6$.' }
      - { value: 1, feedback: '$1 = \partial_b(b)$ is $\nabla^{\mathrm{E}}_{\partial x_2}\mathcal{Y}$, before multiplying by $g$. Leibniz gives $1\cdot 3 + 3\cdot1 = 6$.' }
    hint: |
      $\nabla^{\mathrm{E}}$ differentiates cartesian components: $g\,\mathcal{Y} = b^2\,\partial x_1$.
    explanation: |
      $$\begin{aligned}\nabla^{\mathrm{E}}_{\partial x_2}(b\,\mathcal{Y}) &= \partial x_2\lfloor b\rceil\,\mathcal{Y} + b\,\nabla^{\mathrm{E}}_{\partial x_2}\mathcal{Y}\\ &= 3\,\partial x_1 + 3\,\partial x_1 = 6\,\partial x_1\end{aligned}$$
      while $\nabla^{\mathrm{E}}_{b\,\partial x_2}\mathcal{Y} = 3\,\partial x_1$. Direction slot: $C^\infty$-linear. Differentiated slot: Leibniz.

  - type: mcq
    id: needs-neighbourhood
    title: Zero at the point
    prompt: |
      On the plane with $\nabla^{\mathrm{E}}$, the vector fields $\mathcal{Y} = 0$ and $\mathcal{Y}' = b\,\partial x_1$ agree at $p = (0,0)$: both vanish there. Is $\nabla^{\mathrm{E}}_{(\partial x_2)_p}\mathcal{Y}' = \nabla^{\mathrm{E}}_{(\partial x_2)_p}\mathcal{Y} = 0$?
    options:
      - text: 'No: $\nabla^{\mathrm{E}}_{(\partial x_2)_p}\mathcal{Y}'' = (\partial x_1)_p$, because the derivative sees $\mathcal{Y}''$ near $p$'
        correct: true
      - text: 'Yes: $\mathcal{Y}''(p) = 0$, and the covariant derivative is linear'
        feedback: |
          Linear over numbers, yes, but it is a **derivative**: it compares $\mathcal{Y}'$ at nearby points. $\mathcal{Y}'$ grows along $\partial x_2$, its component $b$ has $\partial_b b = 1$, so the result is $(\partial x_1)_p\neq0$.
      - text: 'Yes: a connection is $C^\infty$-linear in both slots, so it only uses values at $p$'
        feedback: |
          Only the **direction** slot is $C^\infty$-linear (so only $\mathcal{X}_p$ matters). The differentiated slot obeys Leibniz, which is exactly what makes it depend on the field around $p$.
    explanation: |
      $\nabla_{\mathcal{X}_p}\mathcal{Y}$ needs the direction only at $p$ but the field $\mathcal{Y}$ on a neighbourhood of $p$ (in fact along any curve through $p$ with velocity $\mathcal{X}_p$). This is why the direction can be a single vector while the differentiated object must be a field.

  - type: mcq
    id: autoparallel-words
    title: Straight, but speeding up
    multiple: true
    prompt: |
      On the plane with $\nabla^{\mathrm{E}}$ (cartesian coefficients zero, so the acceleration $a_\gamma = \nabla_{v_\gamma}v_\gamma$ has cartesian components $\ddot\gamma^k$), take
      $$\gamma(\lambda) = (e^\lambda,\ e^\lambda).$$
      Recall: $\gamma$ is **autoparallel** if $a_\gamma = \text{ᚱ}\,v_\gamma$ for some function $\text{ᚱ}$ of $\lambda$, and **autoparallelly transported** if $a_\gamma = 0$. Select every true statement.
    options:
      - text: '$\gamma$ is autoparallel, with $\text{ᚱ} = 1$'
        correct: true
      - text: 'The new parameter $\mu = e^\lambda$ turns its path into an autoparallelly transported curve'
        correct: true
      - text: '$\gamma$ is autoparallelly transported, since its path is a straight line'
        feedback: |
          The path is straight, but the speed grows: $v_\gamma = e^\lambda(1,1)$ and $a_\gamma = e^\lambda(1,1)\neq0$. Autoparallelly transported curves also keep their speed.
      - text: '$\gamma$ is not autoparallel, since its acceleration is not zero'
        feedback: |
          "Autoparallel" allows acceleration **along** the velocity: $a_\gamma = 1\cdot v_\gamma$. Only the direction must be kept; that is the weaker of the two words.
    explanation: |
      $a_\gamma = e^\lambda(1,1) = v_\gamma$, so $\gamma$ is autoparallel with $\text{ᚱ}\equiv1$, not autoparallelly transported. Reparametrized by $\mu = e^\lambda$, the same path is $\mu\mapsto(\mu,\mu)$ with zero second derivative. The same pair of words exists for any field along a curve: **parallel** ($\nabla_{v_\gamma}\mathcal{X}_\gamma = \text{ᚱ}\,\mathcal{X}_\gamma$) and **parallelly transported** ($=0$); "auto" means the field is the velocity itself.

  - type: numeric
    id: path-dependence
    title: Two routes, one destination
    prompt: |
      On the plane, $\nabla^{\kappa}$ with $\kappa = 1$ transports a vector with components $z = (z^1, z^2)$ by
      $$\dot z^1 = -\kappa\,a\,z^2\,\dot\gamma^2,\quad\dot z^2 = 0.$$
      Carry $z = (0,1)$ from $(0,0)$ to $(1,1)$ along route A: right along the $a$-axis to $(1,0)$, then up to $(1,1)$. What is $z^1$ on arrival?
    answer: -1
    wrong:
      - { value: 0, feedback: 'That is the arrival along route B (up first along $a = 0$, where $\dot z^1 = 0$, then right, where $\dot\gamma^2 = 0$). On route A the vertical leg runs at $a = 1$: $\Delta z^1 = -1\cdot1\cdot1\cdot1 = -1$. Transport depends on the route.' }
      - { value: 1, feedback: 'Check the sign: $\dot z^1 = -\kappa\,a\,z^2\dot\gamma^2 = -1$ on the vertical leg at $a = 1$, over a $\lambda$-interval of length $1$.' }
    hint: |
      Only the vertical leg changes $z^1$ ($\dot\gamma^2\neq0$ there), and on it $a = 1$.
    explanation: |
      Route A gives $(-1,1)$, route B gives $(0,1)$. Going out along A and back along B is a counterclockwise loop around the unit square, and the mismatch matches the curvature law:
      $$\Delta z^1 = -\mathrm{Riem}^1_{212}\,z^2\times\text{area} = -1.$$
      With curvature, "the same vector at another point" has no meaning without a route.

  - type: mcq
    id: torsion-path
    title: Does torsion make transport route dependent?
    prompt: |
      On the plane minus the origin, $\nabla^{\mathrm{W}}$ keeps the components of a vector along the unit radial and angular fields $e_1, e_2$; it has torsion but zero curvature. Carry $(\partial x_1)_{(1,0)} = (e_1)_{(1,0)}$ to $(0,1)$ along the quarter circle and, separately, along the two segments through $(1,1)$. What arrives?
    options:
      - text: 'The same vector both ways, $(e_1)_{(0,1)} = (\partial x_2)_{(0,1)}$'
        correct: true
      - text: 'Different vectors: $\nabla^{\mathrm{W}}$ has torsion, so transport depends on the route'
        feedback: |
          Route dependence is measured by the **curvature**: a loop's mismatch is governed by $\mathrm{Riem}$. Torsion measures something else (whether swapping two derivatives matches the commutator). Here the frame components $(1,0)$ stay constant on every route, so both routes give $e_1$ at the end.
      - text: 'The same vector both ways, $(\partial x_1)_{(0,1)}$'
        feedback: |
          Keeping cartesian components is $\nabla^{\mathrm{E}}$. $\nabla^{\mathrm{W}}$ keeps frame components, so the vector stays $e_1$, which at $(0,1)$ points along $\partial x_2$.
      - text: 'Different vectors: the cartesian coefficients of $\nabla^{\mathrm{W}}$ are nonzero'
        feedback: |
          Nonzero $\Gamma$'s make transport look complicated in one chart, but say nothing about route dependence. In the frame $e_1, e_2$ the transport is trivial: constant components.
    explanation: |
      $\nabla^{\mathrm{W}}$ is flat: every route gives the same result, here $e_1$ at $(0,1)$, which is $\partial x_2$ there. (On a region with holes a flat connection can still give a mismatch around a hole; $\nabla^{\mathrm{W}}$ does not even do that, since its frame is defined all around the origin.) Torsion and curvature are independent properties: $\nabla^{\mathrm{W}}$ is flat with torsion.

  - type: mcq
    id: commutator-order
    title: Partial derivatives commute, so…
    prompt: |
      On the plane, $\mathcal{X} = b\,\partial x_1$ and $\mathcal{Y} = \partial x_2$. A student argues: "$[\mathcal{X},\mathcal{Y}]\lfloor f\rceil = \mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil - \mathcal{Y}\lfloor\mathcal{X}\lfloor f\rceil\rceil$ involves the mixed derivatives $\partial_a\partial_b f$ and $\partial_b\partial_a f$, which are equal, so $[\mathcal{X},\mathcal{Y}] = 0$." What is $[\mathcal{X},\mathcal{Y}]$?
    options:
      - text: '$-\partial x_1$'
        correct: true
      - text: '$0$'
        feedback: |
          The second derivatives do cancel, but $\mathcal{Y}$ also differentiates the **component** $b$ of $\mathcal{X}$: $\mathcal{Y}\lfloor\mathcal{X}\lfloor f\rceil\rceil = \partial_b(b\,\partial_af) = \partial_af + b\,\partial_b\partial_af$. The first-order leftover $-\partial_af$ survives.
      - text: '$b\,\partial_a\partial_b - \partial_b(b\,\partial_a)$, a second-order operator'
        feedback: |
          Expanded, the second-order pieces $b\,\partial_a\partial_b f$ cancel, and what remains is first order: $-\partial_a f$. The commutator of two vector fields is again a vector field.
      - text: '$\partial x_1$'
        feedback: |
          Order matters: $[\mathcal{X},\mathcal{Y}]^k = \mathcal{X}\lfloor\tilde x^k\rceil - \mathcal{Y}\lfloor x^k\rceil$ with $x = (b,0)$, $\tilde x = (0,1)$ gives $0 - \partial_b b = -1$. $\partial x_1$ is $[\mathcal{Y},\mathcal{X}]$.
    explanation: |
      $$[\mathcal{X},\mathcal{Y}]^k = \mathcal{X}\lfloor\tilde x^k\rceil - \mathcal{Y}\lfloor x^k\rceil$$
      gives $[b\,\partial x_1,\partial x_2] = -\partial x_1$. Check on $f = ab$: $\mathcal{X}\lfloor\mathcal{Y}\lfloor f\rceil\rceil = b$ and $\mathcal{Y}\lfloor\mathcal{X}\lfloor f\rceil\rceil = 2b$, difference $-b = -\partial x_1\lfloor ab\rceil$. Chart basis fields commute because their components are constant; fields with varying components, like $b\,\partial x_1$, or the frame $e_1, e_2$ (with $[e_1,e_2] = -\tfrac1r e_2$), need not.

  - type: numeric
    id: commutator-both-terms
    title: Both fields get differentiated
    prompt: |
      On the plane, $\mathcal{X} = b\,\partial x_1$ (components $x = (b, 0)$) and $\mathcal{Y} = a\,\partial x_2$ (components $\tilde x = (0, a)$). The commutator has components
      $$[\mathcal{X},\mathcal{Y}]^k = \mathcal{X}\lfloor\tilde x^k\rceil - \mathcal{Y}\lfloor x^k\rceil.$$
      Find the $\partial x_1$-component of $[\mathcal{X},\mathcal{Y}]$ at $p = (2,3)$.
    answer: -2
    wrong:
      - { value: 0, feedback: 'That keeps only the first term, $\mathcal{X}\lfloor\tilde x^1\rceil = 0$. The second term differentiates the components of $\mathcal{X}$ along $\mathcal{Y}$: $-\mathcal{Y}\lfloor b\rceil = -a\,\partial_b b = -a = -2$.' }
      - { value: 2, feedback: 'Sign: the second term enters with a minus, $-\mathcal{Y}\lfloor x^1\rceil = -a$. $+2$ belongs to $[\mathcal{Y},\mathcal{X}] = -[\mathcal{X},\mathcal{Y}]$.' }
      - { value: 3, feedback: '$3 = b$ is the $\partial x_2$-component, $\mathcal{X}\lfloor a\rceil = b\,\partial_a a = b$. The $\partial x_1$-component is $-\mathcal{Y}\lfloor b\rceil = -a = -2$.' }
    hint: |
      $k = 1$: $\tilde x^1 = 0$, and $x^1 = b$ is differentiated by $\mathcal{Y} = a\,\partial_b$.
    explanation: |
      $$[b\,\partial x_1,\ a\,\partial x_2] = -a\,\partial x_1 + b\,\partial x_2,$$
      which is $-2\,\partial x_1 + 3\,\partial x_2$ at $(2,3)$. Each field differentiates the other's components; the two terms are what make $[\mathcal{X},\mathcal{Y}] = -[\mathcal{Y},\mathcal{X}]$.

  - type: numeric
    id: torsion-free-swap
    title: Torsion free, so the order does not matter?
    prompt: |
      On the plane, $\nabla^{\mathrm{E}}$ is torsion free. A student reasons: "torsion free means $\nabla_\mathcal{X}\mathcal{Y} = \nabla_\mathcal{Y}\mathcal{X}$; with $\mathcal{X} = \partial x_1$, $\mathcal{Y} = a\,\partial x_2$ we have $\nabla^{\mathrm{E}}_{a\,\partial x_2}\partial x_1 = 0$, so $\nabla^{\mathrm{E}}_{\partial x_1}(a\,\partial x_2) = 0$ too." What is the $\partial x_2$-component of $\nabla^{\mathrm{E}}_{\partial x_1}(a\,\partial x_2)$?
    answer: 1
    wrong:
      - { value: 0, feedback: 'Torsion free means $\nabla_\mathcal{X}\mathcal{Y} - \nabla_\mathcal{Y}\mathcal{X} = [\mathcal{X},\mathcal{Y}]$, not $0$. Here $[\partial x_1, a\,\partial x_2] = \partial x_2$, and indeed $\nabla^{\mathrm{E}}_{\partial x_1}(a\,\partial x_2) = \partial_a(a)\,\partial x_2 = \partial x_2$.' }
    hint: |
      $\nabla^{\mathrm{E}}$ differentiates the cartesian components $(0, a)$ along $\partial x_1 = \partial/\partial a$.
    explanation: |
      $\nabla^{\mathrm{E}}_{\partial x_1}(a\,\partial x_2) = \partial x_2$ and $\nabla^{\mathrm{E}}_{a\,\partial x_2}\partial x_1 = 0$. Their difference equals the commutator, so the torsion vanishes:
      $$\nabla_\mathcal{X}\mathcal{Y} - \nabla_\mathcal{Y}\mathcal{X} - [\mathcal{X},\mathcal{Y}] = 0.$$
      Only for commuting fields (such as chart basis fields) does torsion free give $\nabla_\mathcal{X}\mathcal{Y} = \nabla_\mathcal{Y}\mathcal{X}$, i.e. $\Gamma^i_{jk} = \Gamma^i_{kj}$.

  - type: numeric
    id: torsion-antisymmetric
    title: Torsion from which part?
    prompt: |
      On the plane, a connection has the cartesian coefficients $\Gamma^1_{12} = 3$, $\Gamma^1_{21} = 1$, all others zero ($\nabla_{\partial x_k}\partial x_j = \Gamma^i_{jk}\,\partial x_i$). The torsion components are
      $$\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}.$$
      Compute $\mathtt{T}^1_{12}$.
    answer: -2
    wrong:
      - { value: 4, feedback: '$4 = \Gamma^1_{12} + \Gamma^1_{21}$ is (twice) the **symmetric** part. Torsion is built from the antisymmetric part, the only combination of $\Gamma$''s that transforms as a tensor: $\Gamma^1_{21} - \Gamma^1_{12} = -2$.' }
      - { value: 2, feedback: 'Either the sign is flipped ($\Gamma^1_{12} - \Gamma^1_{21}$) or this is the average $\tfrac12(3+1)$ of the symmetric part. With $j = 1$, $k = 2$: $\mathtt{T}^1_{12} = \Gamma^1_{21} - \Gamma^1_{12} = 1 - 3 = -2$.' }
      - { value: 0, feedback: 'Torsion vanishes when the $\Gamma$''s are symmetric in the lower indices. Here $\Gamma^1_{12} = 3\neq1 = \Gamma^1_{21}$.' }
    hint: |
      $j = 1$, $k = 2$: $\mathtt{T}^1_{12} = \Gamma^1_{21} - \Gamma^1_{12}$.
    explanation: |
      $\mathtt{T}^1_{12} = 1 - 3 = -2$ and $\mathtt{T}^1_{21} = +2$. The symmetric part $\Gamma^1_{(12)} = 2$ does not enter the torsion at all.

  - type: build
    id: autoparallel-sym
    title: What the straightest curves see
    prompt: |
      On the plane, a connection has the cartesian coefficients $\Gamma^1_{12} = 3$, $\Gamma^1_{21} = 1$, all others zero. A curve with velocity components $\dot\gamma^1,\dot\gamma^2$ has acceleration components $a^k_\gamma = \ddot\gamma^k + \Gamma^k_{ji}\,\dot\gamma^i\dot\gamma^j$ (sum over $i$ and $j$). Build $a^1_\gamma$.
    prefix: 'a^1_\gamma = \ddot\gamma^1 +'
    tiles: ['4', '3', '2', '-2', '\dot\gamma^1\dot\gamma^2', '(\dot\gamma^2)^2']
    answers:
      - ['4', '\dot\gamma^1\dot\gamma^2']
    wrong:
      - answer: ['3', '\dot\gamma^1\dot\gamma^2']
        feedback: |
          Both orderings appear in the double sum: $(j,i) = (1,2)$ gives $\Gamma^1_{12}\dot\gamma^2\dot\gamma^1 = 3\,\dot\gamma^1\dot\gamma^2$, and $(j,i) = (2,1)$ gives $\Gamma^1_{21}\dot\gamma^1\dot\gamma^2 = 1\cdot\dot\gamma^1\dot\gamma^2$. Total $4$.
      - answer: ['-2', '\dot\gamma^1\dot\gamma^2']
        feedback: |
          $-2$ is the torsion $\mathtt{T}^1_{12}$, the antisymmetric part. In the sum the antisymmetric part cancels, because $\dot\gamma^1\dot\gamma^2 = \dot\gamma^2\dot\gamma^1$; only the sum $3 + 1$ survives.
      - answer: ['2', '\dot\gamma^1\dot\gamma^2']
        feedback: |
          $2$ is the symmetric part $\tfrac12(\Gamma^1_{12} + \Gamma^1_{21})$, but it multiplies the product twice (once for each ordering of $i,j$): $2\cdot2 = 4$.
    hint: |
      Write out the two terms with $\{i,j\} = \{1,2\}$; $\Gamma^1_{22} = \Gamma^1_{11} = 0$.
    explanation: |
      $$a^1_\gamma = \ddot\gamma^1 + (\Gamma^1_{12} + \Gamma^1_{21})\,\dot\gamma^1\dot\gamma^2 = \ddot\gamma^1 + 4\,\dot\gamma^1\dot\gamma^2.$$
      Only the symmetric part of the $\Gamma$'s reaches the autoparallels: torsion is invisible to them.

  - type: mcq
    id: same-autoparallels
    title: Remove the torsion, keep the curves
    prompt: |
      On the plane, a connection $\nabla$ has the cartesian coefficients $\Gamma^1_{12} = 3$, $\Gamma^1_{21} = 1$, all others zero; it has torsion $\mathtt{T}^1_{12} = -2$. Which **torsion-free** connection has exactly the same autoparallels (solutions of $\ddot\gamma^k + \Gamma^k_{ji}\dot\gamma^i\dot\gamma^j = 0$)?
    options:
      - text: '$\Gamma^1_{12} = \Gamma^1_{21} = 2$, all others zero'
        correct: true
      - text: 'All coefficients zero: removing the torsion removes the $\Gamma$''s'
        feedback: |
          That gives $\ddot\gamma^1 = 0$, but $\nabla$ has $\ddot\gamma^1 + 4\,\dot\gamma^1\dot\gamma^2 = 0$: different curves. Removing torsion removes only the antisymmetric part and keeps the symmetric part $2$.
      - text: '$\Gamma^1_{12} = \Gamma^1_{21} = 4$, all others zero'
        feedback: |
          Then the equation reads $\ddot\gamma^1 + 8\,\dot\gamma^1\dot\gamma^2 = 0$: both orderings of $i,j$ contribute. To match $4\,\dot\gamma^1\dot\gamma^2$, each coefficient must be $2$.
      - text: 'None: torsion bends the autoparallels, so no torsion-free connection shares them'
        feedback: |
          In the sum $\Gamma^k_{ji}\dot\gamma^i\dot\gamma^j$ the product is symmetric in $i,j$, so the antisymmetric part (the torsion) cancels. Torsion changes how vectors are carried, not which curves are straightest.
    explanation: |
      Every set of coefficients splits into a symmetric part plus an antisymmetric part, and the antisymmetric part is minus half the torsion. The symmetrized connection, here $\Gamma^1_{(12)} = \tfrac12(3+1) = 2$, is torsion free and has the same autoparallels: $\ddot\gamma^1 + 4\,\dot\gamma^1\dot\gamma^2 = 0$.

  - type: mcq
    id: symmetric-every-chart
    title: Symmetric in one chart only?
    prompt: |
      A connection has $\Gamma^i_{jk} = \Gamma^i_{kj}$ in the cartesian chart of the plane. The $\Gamma$'s are not tensor components: they change chart with an inhomogeneous term $\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^s}\frac{\partial^2\mathscr{X}^s}{\partial\mathscr{Y}^k\partial\mathscr{Y}^j}$. Are its polar coefficients symmetric in the lower indices too?
    options:
      - text: 'Yes, in every chart: the antisymmetric part is (minus) the torsion, a tensor, so zero in one chart means zero in all'
        correct: true
      - text: 'Not necessarily: the $\Gamma$''s are not a tensor, so the inhomogeneous term can break the symmetry'
        feedback: |
          The inhomogeneous term is a mixed second derivative, symmetric in $j,k$ (Schwarz's theorem). It cancels in $\Gamma^i_{jk} - \Gamma^i_{kj}$, which therefore transforms as a tensor. Example: $\nabla^{\mathrm{E}}$ has polar $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$.
      - text: 'Only if all the cartesian $\Gamma$''s are zero'
        feedback: |
          Zero is not needed. The antisymmetric part $\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}$ is a tensor whatever the $\Gamma$'s are, and a tensor that vanishes in one chart vanishes in all.
    explanation: |
      "Symmetric $\Gamma$'s" is a chart-free statement: it means torsion free. "Zero $\Gamma$'s" is not chart free: $\nabla^{\mathrm{E}}$ has zero cartesian but nonzero polar coefficients.

  - type: build
    id: ricci-build
    title: Which index is contracted?
    prompt: |
      On a 2-dimensional manifold, the Ricci curvature is the contraction $\mathrm{Ric}_{ab} = \mathrm{Riem}^m_{amb}$ (sum over $m$): the upper index is summed against the **second lower** index. Build $\mathrm{Ric}_{11}$.
    prefix: '\mathrm{Ric}_{11} ='
    tiles: ['\mathrm{Riem}^1_{111}', '\mathrm{Riem}^2_{121}', '\mathrm{Riem}^2_{112}', '\mathrm{Riem}^2_{211}', '+']
    answers:
      - ['\mathrm{Riem}^1_{111}', '+', '\mathrm{Riem}^2_{121}']
      - ['\mathrm{Riem}^2_{121}', '+', '\mathrm{Riem}^1_{111}']
    wrong:
      - answer: ['\mathrm{Riem}^1_{111}', '+', '\mathrm{Riem}^2_{112}']
        feedback: |
          That sums the upper index against the **last** lower index. By the antisymmetry $\mathrm{Riem}^i_{jkm} = -\mathrm{Riem}^i_{jmk}$ this gives $-\mathrm{Ric}_{11}$: the wrong sign.
      - answer: ['\mathrm{Riem}^1_{111}', '+', '\mathrm{Riem}^2_{211}']
        feedback: |
          That sums against the **first** lower index, leaving $a = b = 1$ in the antisymmetric pair: $\mathrm{Riem}^2_{211} = -\mathrm{Riem}^2_{211} = 0$. Ricci contracts with the middle index, $m$ in $\mathrm{Riem}^m_{amb}$.
    hint: |
      Put $a = b = 1$ in $\mathrm{Riem}^m_{amb}$ and write the terms $m = 1$ and $m = 2$.
    explanation: |
      $$\mathrm{Ric}_{11} = \mathrm{Riem}^1_{111} + \mathrm{Riem}^2_{121},$$
      and $\mathrm{Riem}^1_{111} = 0$ (equal last two indices). So $\mathrm{Ric}_{11} = \mathrm{Riem}^2_{121} = -\mathrm{Riem}^2_{112}$.

  - type: numeric
    id: ricci-not-zero
    title: Antisymmetric, yet a nonzero trace
    prompt: |
      On a 2-dimensional manifold, suppose that at a point
      $$\mathrm{Riem}^1_{212} = 5,\quad \mathrm{Riem}^2_{112} = -2,$$
      and $\mathrm{Riem}^1_{112} = \mathrm{Riem}^2_{212} = 0$; the rest follows from $\mathrm{Riem}^i_{jkm} = -\mathrm{Riem}^i_{jmk}$. With $\mathrm{Ric}_{ab} = \mathrm{Riem}^m_{amb}$, find $\mathrm{Ric}_{11}$.
    answer: 2
    wrong:
      - { value: 0, feedback: 'Antisymmetry in the last two indices kills contractions **of those two** indices, but Ricci contracts the upper index with the middle one. $\mathrm{Ric}_{11} = \mathrm{Riem}^1_{111} + \mathrm{Riem}^2_{121} = 0 + 2$.' }
      - { value: -2, feedback: 'That reads $\mathrm{Riem}^2_{112}$, contracting with the last index. Ricci needs $\mathrm{Riem}^2_{121} = -\mathrm{Riem}^2_{112} = +2$.' }
      - { value: 5, feedback: '$5$ enters $\mathrm{Ric}_{22} = \mathrm{Riem}^1_{212} + \mathrm{Riem}^2_{222} = 5$. For $\mathrm{Ric}_{11}$ put $a = b = 1$: $\mathrm{Riem}^1_{111} + \mathrm{Riem}^2_{121} = 2$.' }
    hint: |
      $\mathrm{Ric}_{11} = \mathrm{Riem}^1_{111} + \mathrm{Riem}^2_{121}$; use the antisymmetry to read $\mathrm{Riem}^2_{121}$.
    explanation: |
      $$\begin{aligned}\mathrm{Ric}_{11} &= \mathrm{Riem}^1_{111} + \mathrm{Riem}^2_{121}\\ &= 0 + 2 = 2\end{aligned}$$
      Likewise $\mathrm{Ric}_{22} = 5$ and $\mathrm{Ric}_{12} = \mathrm{Riem}^1_{112} + \mathrm{Riem}^2_{122} = 0$. The Ricci tensor carries real information; in general relativity it is what matter sources.

  - type: numeric
    id: gamma-zero-riem-not
    title: All Γ's zero at a point
    prompt: |
      On the plane, $\nabla^{\kappa}$ with $\kappa = 2$ has the single cartesian coefficient $\Gamma^1_{22} = \kappa\,a$, so at the origin **all** its cartesian coefficients vanish. The curvature components are
      $$\begin{aligned}\mathrm{Riem}^i_{jkm} &= \partial x_k\lfloor\Gamma^i_{jm}\rceil - \partial x_m\lfloor\Gamma^i_{jk}\rceil\\ &\quad + \Gamma^i_{nk}\Gamma^n_{jm} - \Gamma^i_{nm}\Gamma^n_{jk}.\end{aligned}$$
      Find $\mathrm{Riem}^1_{212}$ at $(0,0)$.
    answer: 2
    wrong:
      - { value: 0, feedback: 'The products $\Gamma\Gamma$ vanish at the origin, but the **derivatives** of the $\Gamma$''s do not: $\partial x_1\lfloor\Gamma^1_{22}\rceil = \partial_a(2a) = 2$. Making the $\Gamma$''s vanish at one point never removes curvature.' }
      - { value: -2, feedback: 'With $i = 1$, $j = 2$, $k = 1$, $m = 2$ the surviving term is $+\partial x_1\lfloor\Gamma^1_{22}\rceil = +2$; the term $-\partial x_2\lfloor\Gamma^1_{21}\rceil$ is zero.' }
    hint: |
      $i = 1$, $j = 2$, $k = 1$, $m = 2$: the first term is $\partial x_1\lfloor\Gamma^1_{22}\rceil$.
    explanation: |
      $\mathrm{Riem}^1_{212}(0,0) = \partial_a(\kappa a) = \kappa = 2$, the same as everywhere else. For a torsion-free connection a suitable chart (normal coordinates) makes all $\Gamma$'s vanish at any one chosen point, but not their derivatives: curvature survives. Locally the laws look like special relativity at a point, never on a whole neighbourhood of a curved spacetime.

  - type: text
    id: summary
    title: What you now own
    body: |
      Setting: $\nabla$ is a connection on a manifold, with coefficients $\Gamma^i_{jk}$ in a chart with coordinates $x^i$ and basis fields $\partial x_i$ (repeated indices are summed); $\mathcal{X},\mathcal{Y}$ are vector fields with components $x^i$, $\tilde x^i$, $\mathsf{X}$ a covector field with components $\mathtt{x}_k$, $f,g$ smooth functions, $\mathcal{X}\lfloor g\rceil$ the derivative of $g$ along $\mathcal{X}$; $\gamma$ is a curve with velocity $v_\gamma$, coordinates $\gamma^k(\lambda)$ and acceleration $a_\gamma := \nabla_{v_\gamma}v_\gamma$, $\text{ᚱ}$ a function of the parameter; $\mathtt{T}$ is the torsion and $\mathrm{Riem}$ the curvature of $\nabla$, $\Delta z^1$ the change of the first component of a vector transported once around a small counterclockwise loop in the $(x^1,x^2)$ plane (with components $z^1,z^2$).

      The traps, turned into rules:

      - $\Gamma$'s are not a tensor (zero in one chart, not in another), and the last lower index is the direction:
      $$\nabla_{\partial x_k}\partial x_j = \Gamma^i_{jk}\,\partial x_i.$$
      - Functions need no connection:
      $$\nabla_{\mathcal{X}_p}f = \mathcal{X}_p(f).$$
      - $+\Gamma$ per upper index, $-\Gamma$ per lower index:
      $$(\nabla_\mathcal{X}\mathsf{X})_k = \mathcal{X}\lfloor\mathtt{x}_k\rceil - \Gamma^j_{ki}\,\mathtt{x}_jx^i.$$
      - Direction slot $C^\infty$-linear (only $\mathcal{X}_p$ matters), differentiated slot Leibniz (the field near $p$ matters):
      $$\nabla_{g\mathcal{X}}\mathcal{Y} = g\,\nabla_\mathcal{X}\mathcal{Y},$$
      $$\nabla_\mathcal{X}(g\mathcal{Y}) = \mathcal{X}\lfloor g\rceil\mathcal{Y} + g\,\nabla_\mathcal{X}\mathcal{Y}.$$
      - Autoparallel ($a_\gamma = \text{ᚱ}\,v_\gamma$) is weaker than autoparallelly transported ($a_\gamma = 0$).
      - Route dependence of transport is curvature, not torsion:
      $$\Delta z^1 = -\mathrm{Riem}^1_{212}\,z^2\times\text{area}.$$
      - The commutator is a vector field, with both terms:
      $$[\mathcal{X},\mathcal{Y}]^k = \mathcal{X}\lfloor\tilde x^k\rceil - \mathcal{Y}\lfloor x^k\rceil.$$
      - Torsion free means $\nabla_\mathcal{X}\mathcal{Y} - \nabla_\mathcal{Y}\mathcal{X} = [\mathcal{X},\mathcal{Y}]$; torsion is the antisymmetric part, the same condition in every chart:
      $$\mathtt{T}^i_{jk} = \Gamma^i_{kj} - \Gamma^i_{jk}.$$
      - Autoparallels see only the symmetric part $\Gamma^k_{(ji)} := \tfrac12(\Gamma^k_{ji} + \Gamma^k_{ij})$:
      $$\Gamma^k_{ji}\,\dot\gamma^i\dot\gamma^j = \Gamma^k_{(ji)}\,\dot\gamma^i\dot\gamma^j.$$
      - Ricci contracts the upper with the middle index, and need not vanish:
      $$\mathrm{Ric}_{ab} = \mathrm{Riem}^m_{amb}.$$
      - $\Gamma(p) = 0$ in some chart does not give $\mathrm{Riem}(p) = 0$: curvature lives in the derivatives of the $\Gamma$'s.

      **Next:** the content map of this level. You will rebuild the chain from connections and their coefficients to transport, torsion and curvature, box by box, among decoys.
