  - type: text
    id: wrap-up
    title: What you now own
    body: |
      Problems 3 and 4, part 2 of 3 of the level challenge. Setting: the plane has points $(a,b)$, $r = \sqrt{a^2+b^2}$, cartesian and polar charts; $\nabla^{\mathrm{E}}$ differentiates cartesian components (all cartesian $\Gamma = 0$); $\nabla^{\mathrm{W}}$ (plane minus the origin) makes the unit radial and angular fields parallel; $\mathcal{X},\mathcal{Y}$ are vector fields, $g$ a smooth function, $\gamma$ a curve with dots $= d/d\lambda$, $\mathtt{T}$ torsion, $\mathrm{Riem}$ curvature. The formulas to keep:

      **3. Sheared chart** $(u,v)$ with $u = a$, $v = b - a^2$, for $\nabla^{\mathrm{E}}$ (coefficients in that chart):
      $$\Gamma^2_{11} = 2,$$
      $$\ddot u = 0,\quad \ddot v + 2\,\dot u^2 = 0;$$
      a nonzero $\Gamma$ with $\mathtt{T} = 0$ and $\mathrm{Riem} = 0$.

      **4. Difference of connections**, a $(1,2)$-tensor field:
      $$\mathcal{Q} := \nabla^{\mathrm{W}} - \nabla^{\mathrm{E}},$$
      $$\mathcal{Q}(\mathcal{X},g\mathcal{Y}) = g\,\mathcal{Q}(\mathcal{X},\mathcal{Y}),$$
      $$\mathtt{T}^{\mathrm{W}\,i}_{jk} = Q^i_{kj} - Q^i_{jk}.$$

