id: ch04-challenge-2
title: Level Challenge · Part 2
kind: challenge

# Organization: intro, one block per problem (cards tagged "Problem N · …", ids
# prefixed pN-), then wrap-up. The Level Challenge is split in 2 parts of at most
# 32 cards; part 2 holds problems 3, 4 and 5.

cards:
  - type: text
    id: intro
    title: Charts, traces and tensors
    body: |
      This challenge pushes each idea of the level to its edge. It comes in 2 parts; this is part 2 (problems 3, 4 and 5). Keep pencil and paper at hand: every answer can be checked by hand.

      Recall the toolkit. The **velocity** of a curve $\gamma$ through $p = \gamma(\lambda_0)$ is the map $v_{\gamma,p}(f) := (f\circ\gamma)'(\lambda_0)$ on smooth fields $f\in C^\infty(\mathcal{M})$; the velocities form the **tangent space** $T_p\mathcal{M}$, of dimension $d$. A chart $(\mathcal{U}, \mathscr{X})$ gives it the **chart-induced basis** $(\partial/\partial\mathscr{X}^i)_p$, and components change with the **Jacobian** $(\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p$. The **cotangent space** $T_p^*\mathcal{M}$ holds the linear maps $T_p\mathcal{M}\to\mathbb{R}$, with the **differential** $(df)_p(v) := v(f)$ and the dual basis $(d\mathscr{X}^i)_p$. Tensors $T_p^{(r,s)}\mathcal{M}$ are multilinear maps on $r$ covectors and $s$ velocities. Einstein summation is on.

      3. The circle in two charts, angle and stereographic.
      4. The trace: an honest invariant, and a sum that only looks like one.
      5. A full tensor computation: $v\otimes(df)_p$ in two charts.


  # ---------------------------------------------------------------- Problem 3
  - type: text
    id: p3-setup
    tag: Problem 3 · Circle in two charts
    title: Angle and stereographic charts
    body: |
      On the circle $S^1 = \{(q_1, q_2) : q_1^2 + q_2^2 = 1\}$ take two charts:

      - the **angle** chart $\theta$ on $\mathcal{U} = S^1\setminus\{(1,0)\}$, $\theta\in(0, 2\pi)$, with inverse $\theta^{-1}(t) = (\cos t, \sin t)$;
      - the **stereographic** chart from the north pole $(0,1)$, on $\mathcal{V} = S^1\setminus\{(0,1)\}$:
      $$\sigma(q) = \frac{q_1}{1 - q_2}.$$

      Each chart has one coordinate, so each basis has one vector, $(\partial/\partial\theta)_p$ or $(\partial/\partial\sigma)_p$, and the Jacobian is a single number. We name components by the chart: $v^\theta$, $v^\sigma$ for a velocity, $\mathtt{x}^p_\theta$, $\mathtt{y}^p_\sigma$ for a covector.

      Work at $p = (\tfrac{\sqrt3}{2}, \tfrac12)$, where $\theta_p = \pi/6$ and $\sigma_p = \sqrt3$.

  - type: numeric
    id: p3-jacobian
    tag: Problem 3 · Circle in two charts
    prompt: |
      On $S^1$, the angle chart $\theta\in(0,2\pi)$ (inverse $t\mapsto(\cos t, \sin t)$) and the stereographic chart $\sigma(q) = q_1/(1-q_2)$ have the transition map
      $$\sigma(\theta^{-1}(t)) = \frac{\cos t}{1 - \sin t}.$$
      Compute the Jacobian $(d\sigma/d\theta)_p$ at $p = (\tfrac{\sqrt3}{2}, \tfrac12)$, where $\theta_p = \pi/6$.
    answer: 2
    wrong:
      - value: 0.5
        feedback: |
          $\tfrac12$ is the reverse rate $(d\theta/d\sigma)_p$. The question asks how fast $\sigma$ changes per unit of $\theta$.
      - value: 1.7320508
        feedback: |
          $\sqrt3$ is the **value** $\sigma_p$ of the coordinate at $p$, not its rate of change.
    hint: 'Quotient rule, then $\sin^2 t + \cos^2 t = 1$ simplifies the numerator to $1 - \sin t$.'
    explanation: |
      $$\begin{aligned}\frac{d}{dt}\frac{\cos t}{1-\sin t} &= \frac{-\sin t(1-\sin t) + \cos^2 t}{(1-\sin t)^2}\\ &= \frac{1-\sin t}{(1-\sin t)^2} = \frac{1}{1 - \sin t}.\end{aligned}$$
      At $t = \pi/6$: $1/(1-\tfrac12) = 2$. Another route: the transition equals $\tan(\tfrac t2 + \tfrac\pi4)$, whose derivative is $\tfrac12(1 + \sigma^2)$, again $\tfrac12(1 + 3) = 2$.

  - type: mcq
    id: p3-stretch
    tag: Problem 3 · Circle in two charts
    prompt: |
      On $S^1$, the Jacobian from the angle chart $\theta$ to the stereographic chart $\sigma(q) = q_1/(1-q_2)$ (projection from the north pole $(0,1)$) is
      $$\frac{d\sigma}{d\theta} = \frac{1}{1 - \sin\theta}.$$
      What does it do across the overlap of the two charts?
    options:
      - text: 'It is smallest, $\tfrac12$, at the south pole $(0,-1)$, and grows without bound near the north pole $(0,1)$'
        correct: true
      - text: 'It is constant, since both charts measure the same circle uniformly'
        feedback: |
          $\theta$ measures arc length uniformly, but $\sigma$ does not: it projects the circle from $(0,1)$ onto a line, and arcs near the projection point are flung far away. $1/(1-\sin\theta)$ visibly changes with $\theta$.
      - text: 'It is zero at the north pole, where $\sigma$ is undefined'
        feedback: |
          The north pole is not in the domain of $\sigma$, so nothing is evaluated there. Approaching it, $\sin\theta\to 1$ and $1/(1-\sin\theta)\to\infty$: the opposite of zero.
    explanation: |
      $1 - \sin\theta$ is largest ($2$) at $\theta = 3\pi/2$, the south pole, and tends to $0$ near $\theta = \pi/2$. Near the north pole a small step in $\theta$ is a huge step in $\sigma$. The Jacobian is never $0$, as a change of chart requires.

  - type: numeric
    id: p3-velocity
    tag: Problem 3 · Circle in two charts
    prompt: |
      On $S^1$, the curve $\gamma(\lambda) = (\cos(\tfrac\pi6 + 3\lambda),\ \sin(\tfrac\pi6 + 3\lambda))$ passes through $p = (\tfrac{\sqrt3}{2}, \tfrac12)$ at $\lambda = 0$. In the angle chart its velocity has component $v^\theta = (\theta\circ\gamma)'(0) = 3$. The Jacobian to the stereographic chart $\sigma(q) = q_1/(1-q_2)$ at $p$ is $(d\sigma/d\theta)_p = 2$. Compute the stereographic component $v^\sigma$.
    answer: 6
    wrong:
      - value: 1.5
        feedback: |
          Dividing by the Jacobian is the covector law. A velocity component is a rate, $v^\sigma = (\sigma\circ\gamma)'(0)$, and the chain rule multiplies: $v^\sigma = (d\sigma/d\theta)_p\,v^\theta$.
      - value: 3
        feedback: |
          $3$ is the component in the angle chart. The velocity is the same, but $\sigma$ changes twice as fast as $\theta$ at $p$, so its component doubles.
    hint: 'Chain rule: $(\sigma\circ\gamma)''(0) = (d\sigma/d\theta)_p\cdot(\theta\circ\gamma)''(0)$.'
    explanation: |
      $$v^\sigma = 2\cdot 3 = 6.$$
      So $v = 3(\partial/\partial\theta)_p = 6(\partial/\partial\sigma)_p$, and in particular $(\partial/\partial\theta)_p = 2(\partial/\partial\sigma)_p$.

  - type: build
    id: p3-dtheta
    tag: Problem 3 · Circle in two charts
    prompt: |
      On $S^1$, at $p = (\tfrac{\sqrt3}{2}, \tfrac12)$, the angle chart $\theta$ and the stereographic chart $\sigma$ have Jacobian $(d\sigma/d\theta)_p = 2$, so the basis vectors satisfy $(\partial/\partial\theta)_p = 2(\partial/\partial\sigma)_p$. Express the dual basis covector $(d\theta)_p$ in terms of $(d\sigma)_p$.
    prefix: '(d\theta)_p ='
    tiles: ['\tfrac12', '2', '\sqrt3', '(d\sigma)_p', '(d\theta)_p']
    answers:
      - ['\tfrac12', '(d\sigma)_p']
    wrong:
      - answer: ['2', '(d\sigma)_p']
        feedback: |
          That copies the factor of the basis vectors. Test it: feed $(\partial/\partial\theta)_p = 2(\partial/\partial\sigma)_p$. The left side gives $(d\theta)_p((\partial/\partial\theta)_p) = 1$; the right side would give $2\cdot 2 = 4$. The dual covector must scale the **opposite** way.
      - answer: ['\sqrt3', '(d\sigma)_p']
        feedback: |
          $\sqrt3$ is the coordinate value $\sigma_p$, not a rate. The coefficient is $(d\theta/d\sigma)_p$.
    hint: 'Law: $(d\theta)_p = (d\theta/d\sigma)_p\,(d\sigma)_p$. Or demand $(d\theta)_p((\partial/\partial\theta)_p) = 1$.'
    explanation: |
      $$(d\theta)_p = \Big(\frac{d\theta}{d\sigma}\Big)_p(d\sigma)_p = \tfrac12(d\sigma)_p.$$
      Check: $\tfrac12(d\sigma)_p(2(\partial/\partial\sigma)_p) = \tfrac12\cdot 2 = 1$. Basis vectors scale by $2$, dual covectors by $\tfrac12$.

  - type: numeric
    id: p3-covector
    tag: Problem 3 · Circle in two charts
    prompt: |
      On $S^1$, let $f$ be the height, $f(q) = q_2$. In the angle chart $f = \sin\theta$, so at $p = (\tfrac{\sqrt3}{2}, \tfrac12)$ ($\theta_p = \pi/6$)
      $$(df)_p = \mathtt{x}^p_\theta\,(d\theta)_p,\quad \mathtt{x}^p_\theta = \cos\tfrac\pi6 = \tfrac{\sqrt3}{2}.$$
      With $(d\theta)_p = \tfrac12(d\sigma)_p$ for the stereographic chart $\sigma$, find the stereographic component $\mathtt{y}^p_\sigma$ in $(df)_p = \mathtt{y}^p_\sigma(d\sigma)_p$ (a decimal is fine).
    answer: 0.4330127
    tolerance: 0.001
    answerText: '\sqrt3/4 \approx 0.433'
    wrong:
      - value: 1.7320508
        feedback: |
          $\sqrt3 = 2\cdot\tfrac{\sqrt3}{2}$ multiplies by the Jacobian, the law of vector components. Covector components follow the inverse: $\mathtt{y}^p_\sigma = (d\theta/d\sigma)_p\,\mathtt{x}^p_\theta$.
      - value: 0.8660254
        feedback: |
          $\tfrac{\sqrt3}{2}$ is the angle-chart component, copied. Changing the chart changes the component: substitute $(d\theta)_p = \tfrac12(d\sigma)_p$.
    hint: '$(df)_p = \tfrac{\sqrt3}{2}(d\theta)_p = \tfrac{\sqrt3}{2}\cdot\tfrac12(d\sigma)_p$.'
    explanation: |
      $\mathtt{y}^p_\sigma = \tfrac{\sqrt3}{2}\cdot\tfrac12 = \tfrac{\sqrt3}{4}$. Second route, straight from the stereographic chart: its inverse is
      $$\sigma^{-1}(s) = \Big(\frac{2s}{s^2+1},\ \frac{s^2-1}{s^2+1}\Big),$$
      so $f = (s^2-1)/(s^2+1)$ in this chart, with derivative $4s/(s^2+1)^2$. At $s = \sqrt3$: $4\sqrt3/16 = \sqrt3/4$.

  - type: numeric
    id: p3-pairing
    tag: Problem 3 · Circle in two charts
    prompt: |
      On $S^1$ at $p = (\tfrac{\sqrt3}{2}, \tfrac12)$, in the stereographic chart $\sigma$, the height $f(q) = q_2$ has $(df)_p = \tfrac{\sqrt3}{4}(d\sigma)_p$, and the velocity of $\gamma(\lambda) = (\cos(\tfrac\pi6 + 3\lambda), \sin(\tfrac\pi6 + 3\lambda))$ at $\lambda = 0$ is $v = 6(\partial/\partial\sigma)_p$. Compute $(df)_p(v)$ (a decimal is fine).
    answer: 2.5980762
    tolerance: 0.001
    answerText: '3\sqrt3/2 \approx 2.598'
    wrong:
      - value: 5.1961524
        feedback: |
          $3\sqrt3 = \tfrac{\sqrt3}{2}\cdot 6$ pairs the **angle-chart** covector component with the **stereographic** vector component. Components can only be paired within one chart: $\mathtt{y}^p_\sigma v^\sigma$ or $\mathtt{x}^p_\theta v^\theta$.
      - value: 1.2990381
        feedback: |
          $\tfrac{\sqrt3}{4}\cdot 3$ mixes the charts the other way: stereographic covector component with the angle-chart vector component $v^\theta = 3$. In the stereographic chart, $v^\sigma = 6$.
    hint: '$(df)_p(v) = \mathtt{y}^p_\sigma\,v^\sigma$, since $(d\sigma)_p((\partial/\partial\sigma)_p) = 1$.'
    explanation: |
      $$\tfrac{\sqrt3}{4}\cdot 6 = \tfrac{3\sqrt3}{2}\approx 2.598.$$
      In the angle chart: $\mathtt{x}^p_\theta v^\theta = \tfrac{\sqrt3}{2}\cdot 3$, the same. And directly: $f(\gamma(\lambda)) = \sin(\tfrac\pi6 + 3\lambda)$ has derivative $3\cos\tfrac\pi6 = \tfrac{3\sqrt3}{2}$ at $0$. Three routes, one number.

  - type: mcq
    id: p3-why
    tag: Problem 3 · Circle in two charts
    prompt: |
      On $S^1$ at $p$, from the angle chart $\theta$ to the stereographic chart $\sigma$ (Jacobian $(d\sigma/d\theta)_p = 2$), the velocity component went from $v^\theta = 3$ to $v^\sigma = 6$, and the covector component of $(df)_p$ from $\tfrac{\sqrt3}{2}$ to $\tfrac{\sqrt3}{4}$. Why is the pairing $(df)_p(v)$ the same in both charts?
    options:
      - text: 'The vector component is multiplied by the Jacobian and the covector component by its inverse, so their product cannot change'
        correct: true
      - text: 'On a one-dimensional manifold every component is chart-independent'
        feedback: |
          The components did change, $3\to 6$ and $\tfrac{\sqrt3}{2}\to\tfrac{\sqrt3}{4}$. Dimension one only makes the Jacobian a single number; it still rescales components.
      - text: 'Because both charts increase in the same direction around the circle'
        feedback: |
          The orientation only fixes the **sign** of the Jacobian. With a decreasing chart, e.g. $-\theta$, the Jacobian is $-1$, both components flip sign, and the pairing is still unchanged. Invariance comes from the opposite laws, whatever the sign.
    explanation: |
      $$\begin{aligned}\mathtt{y}^p_\sigma v^\sigma &= \Big(\frac{d\theta}{d\sigma}\Big)_p\mathtt{x}^p_\theta\,\Big(\frac{d\sigma}{d\theta}\Big)_p v^\theta\\ &= \mathtt{x}^p_\theta\, v^\theta,\end{aligned}$$
      because the two rates multiply to $1$, the one-dimensional inverse identity. In $d$ dimensions the same cancellation is $(\partial\mathscr{X}^i/\partial\mathscr{Y}^k)_p(\partial\mathscr{Y}^k/\partial\mathscr{X}^j)_p = \delta^i_j$.

  # ---------------------------------------------------------------- Problem 4
  - type: text
    id: p4-setup
    tag: Problem 4 · The trace
    title: Summing the diagonal
    body: |
      Take a $(1,1)$-tensor $T\in T_p^{(1,1)}\mathcal{M}$ (one covector slot, then one velocity slot). In a chart $(\mathcal{U},\mathscr{X})$ its components are $(T_\mathcal{U})^i_j$, a $d\times d$ array with row $i$ (upper) and column $j$ (lower). Its **trace** is the sum of the diagonal, which Einstein summation writes in four symbols:
      $$(T_\mathcal{U})^i_i = (T_\mathcal{U})^1_1 + \dots + (T_\mathcal{U})^d_d.$$
      The repeated $i$ sits once up and once down, so this is a genuine Einstein sum.

      Now take a $(0,2)$-tensor $S$ with components $(S_\mathcal{U})_{ij}$. Its diagonal can be summed too, but both indices are down. A same-height repeat is **not** an Einstein sum, so the sum must be written out:
      $$\sum_{i=1}^d (S_\mathcal{U})_{ii}.$$

      Question of this problem: does each diagonal sum give the same number in every chart? Recall the law for a $(1,1)$-tensor, one Jacobian factor per index, all evaluated at $p$:
      $$(T_\mathcal{V})^k_l = \frac{\partial\mathscr{Y}^k}{\partial\mathscr{X}^i}\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^l}(T_\mathcal{U})^i_j.$$

  - type: order
    id: p4-proof
    tag: Problem 4 · The trace
    prompt: |
      Prove that the trace of a $(1,1)$-tensor $T$ is the same in the charts $(\mathcal{U},\mathscr{X})$ and $(\mathcal{V},\mathscr{Y})$, i.e. $(T_\mathcal{V})^k_k = (T_\mathcal{U})^i_i$. All Jacobians are evaluated at $p$. Put the steps in order.
    steps:
      - 'Start from the law $(T_\mathcal{V})^k_l = \frac{\partial\mathscr{Y}^k}{\partial\mathscr{X}^i}\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^l}(T_\mathcal{U})^i_j$.'
      - 'Set $l = k$; now $k$ is repeated up and down, so it is summed: $(T_\mathcal{V})^k_k = \frac{\partial\mathscr{Y}^k}{\partial\mathscr{X}^i}\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^k}(T_\mathcal{U})^i_j$.'
      - 'The factors are numbers, so reorder: the sum over $k$ is $\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^k}\frac{\partial\mathscr{Y}^k}{\partial\mathscr{X}^i}$.'
      - 'By the inverse identity this sum is $\delta^j_i$, so $(T_\mathcal{V})^k_k = \delta^j_i(T_\mathcal{U})^i_j$.'
      - '$\delta^j_i$ keeps only the terms with $j = i$: $(T_\mathcal{V})^k_k = (T_\mathcal{U})^i_i$.'
    hint: 'The inverse identity reads $\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^k}\frac{\partial\mathscr{Y}^k}{\partial\mathscr{X}^i} = \delta^j_i$: it needs one $\partial\mathscr{Y}/\partial\mathscr{X}$ and one $\partial\mathscr{X}/\partial\mathscr{Y}$ sharing the summed index.'
    explanation: |
      The upper index brings a factor $\partial\mathscr{Y}/\partial\mathscr{X}$, the lower one a factor $\partial\mathscr{X}/\partial\mathscr{Y}$; contracting them makes the two factors meet and cancel to $\delta$. In matrix language (Jacobian $J$ with entries $(\partial\mathscr{Y}^k/\partial\mathscr{X}^i)_p$) the law is
      $$T_\mathcal{V} = J\,T_\mathcal{U}\,J^{-1},$$
      and the trace is unchanged under such a similarity. Nothing here used that the charts are linear: only the inverse identity at the single point $p$.

  - type: numeric
    id: p4-A
    tag: Problem 4 · The trace
    prompt: |
      Running example: on $\mathbb{R}^2$, charts $\mathscr{X}(q) = (2q_1, -q_2)$ and $\mathscr{Y}(q) = (q_1, q_2e^{q_1})$, at $p = (1,1)$:
      $$\Big(\frac{\partial\mathscr{Y}}{\partial\mathscr{X}}\Big)_p = \begin{pmatrix}1/2&0\\e/2&-e\end{pmatrix},$$
      $$\Big(\frac{\partial\mathscr{X}}{\partial\mathscr{Y}}\Big)_p = \begin{pmatrix}2&0\\1&-1/e\end{pmatrix}$$
      (row = upper index). The $(1,1)$-tensor $A = (\partial x_1)_p\otimes(dx^1)_p$ has $\mathscr{X}$-components $(A_\mathcal{U})^i_j = \delta^i_1\delta^1_j$, trace $1$. Compute its trace in the chart $\mathscr{Y}$, $(A_\mathcal{V})^k_k$.
    answer: 1
    answerText: '1'
    wrong:
      - value: 3.7182818
        feedback: |
          $1 + e$ adds **every** entry of the $\mathscr{Y}$-matrix $\begin{pmatrix}1&0\\e&0\end{pmatrix}$. The trace adds only the diagonal, $(A_\mathcal{V})^1_1 + (A_\mathcal{V})^2_2$; the entry $e$ is off the diagonal.
      - value: 0.5
        feedback: |
          $\tfrac12 = (\partial\mathscr{Y}^1/\partial\mathscr{X}^1)_p$ transforms only the upper index. The lower index needs its own factor $(\partial\mathscr{X}^1/\partial\mathscr{Y}^l)_p$, which brings a $2$ for $l = 1$: one Jacobian factor per index.
      - value: 2
        feedback: |
          $2$ is the dimension, $\delta^i_i = 2$, the trace of the identity tensor. $A$ is not the identity: its only nonzero $\mathscr{X}$-component is $(A_\mathcal{U})^1_1 = 1$.
    hint: 'Only $i = j = 1$ contributes, so $(A_\mathcal{V})^k_l = (\partial\mathscr{Y}^k/\partial\mathscr{X}^1)_p\,(\partial\mathscr{X}^1/\partial\mathscr{Y}^l)_p$: column 1 of the first matrix times row 1 of the second.'
    explanation: |
      Column 1 of $(\partial\mathscr{Y}/\partial\mathscr{X})_p$ is $(\tfrac12, \tfrac e2)$, row 1 of $(\partial\mathscr{X}/\partial\mathscr{Y})_p$ is $(2, 0)$, so
      $$A_\mathcal{V} = \begin{pmatrix}1&0\\e&0\end{pmatrix}.$$
      Trace $1 + 0 = 1$, as in $\mathscr{X}$, even though the matrix itself changed: the diagonal entries can move around, their sum cannot.

  - type: numeric
    id: p4-S
    tag: Problem 4 · The trace
    prompt: |
      Running example at $p = (1,1)$, with
      $$\Big(\frac{\partial\mathscr{X}}{\partial\mathscr{Y}}\Big)_p = \begin{pmatrix}2&0\\1&-1/e\end{pmatrix}$$
      (row = upper index). The $(0,2)$-tensor $S$ has $\mathscr{X}$-components $(S_\mathcal{U})_{ij} = \delta_{ij}$, so $\sum_i (S_\mathcal{U})_{ii} = 2$. Its law is
      $$(S_\mathcal{V})_{kl} = \frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^k}\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^l}\delta_{ij}.$$
      Compute $\sum_k (S_\mathcal{V})_{kk}$ in the chart $\mathscr{Y}$ (a decimal is fine).
    answer: 5.1353353
    tolerance: 0.001
    answerText: '5 + 1/e^2 \approx 5.135'
    wrong:
      - value: 2
        feedback: |
          $2$ assumes the diagonal sum is invariant, as the trace of a $(1,1)$-tensor is. Here both indices are lower: two factors $\partial\mathscr{X}/\partial\mathscr{Y}$ and no $\partial\mathscr{Y}/\partial\mathscr{X}$ to cancel them. Compute the entries.
      - value: 9.4863201
        feedback: |
          $\tfrac14 + \tfrac54e^2$ uses the matrix $(\partial\mathscr{Y}/\partial\mathscr{X})_p$, the law of **upper** indices. A lower index takes $(\partial\mathscr{X}/\partial\mathscr{Y})_p$.
      - value: 4.1353353
        feedback: |
          $4 + 1/e^2$ squares only the diagonal entries $2$ and $-1/e$ of $(\partial\mathscr{X}/\partial\mathscr{Y})_p$. With $\delta_{ij}$, $(S_\mathcal{V})_{kk} = \sum_i \big((\partial\mathscr{X}^i/\partial\mathscr{Y}^k)_p\big)^2$: square **every** entry of column $k$ and add, so column 1 gives $2^2 + 1^2 = 5$.
    hint: '$\delta_{ij}$ sets $j = i$, so $(S_\mathcal{V})_{kk} = \sum_i \big((\partial\mathscr{X}^i/\partial\mathscr{Y}^k)_p\big)^2$, the squared length of column $k$ of the matrix.'
    explanation: |
      Column 1 is $(2, 1)$, column 2 is $(0, -1/e)$:
      $$S_\mathcal{V} = \begin{pmatrix}5&-1/e\\-1/e&1/e^2\end{pmatrix}.$$
      Diagonal sum $5 + 1/e^2\approx 5.135\neq 2$. The same numbers $\delta$ that gave an invariant trace for the $(1,1)$-tensor give no invariant here: the law of $S$ is $S_\mathcal{V} = M^{\mathsf T}S_\mathcal{U}M$ with $M = (\partial\mathscr{X}/\partial\mathscr{Y})_p$, not a similarity.

  - type: mcq
    id: p4-why
    tag: Problem 4 · The trace
    prompt: |
      A $(1,1)$-tensor $T$ and a $(0,2)$-tensor $S$ both have components equal to the identity matrix in a chart $\mathscr{X}$. In a second chart $\mathscr{Y}$, the trace $(T_\mathcal{V})^k_k$ is still $d$, but $\sum_k (S_\mathcal{V})_{kk}$ is in general not. What makes the difference?
    options:
      - text: 'The trace pairs an upper with a lower index, so a Jacobian factor meets its inverse and they cancel; two lower indices bring two inverse factors and nothing cancels'
        correct: true
      - text: 'Nothing: any sum of diagonal components is invariant, and a different value means a computing error'
        feedback: |
          Tempting because the trace of a $(1,1)$-tensor is invariant. But in the running example $S_{ij} = \delta_{ij}$ in $\mathscr{X}$ becomes $\begin{pmatrix}5&-1/e\\-1/e&1/e^2\end{pmatrix}$ in $\mathscr{Y}$, diagonal sum $\approx 5.135\neq 2$. Invariance must be proved from the law, and for $S$ the proof fails.
      - text: 'The matrix decides: equal identity matrices in $\mathscr{X}$ behave the same in every chart'
        feedback: |
          A matrix of components is the tensor seen in one chart only; the index positions decide how it changes. $\delta^i_j$ and $\delta_{ij}$ are the same array in $\mathscr{X}$ but different tensors, and in $\mathscr{Y}$ their matrices differ.
      - text: 'The trace is invariant only for linear chart changes; for the curved chart $\mathscr{Y}(q) = (q_1, q_2e^{q_1})$ neither sum survives'
        feedback: |
          The proof uses only the inverse identity of the Jacobians at the point $p$, true for any pair of smooth charts. In the running example the trace of $A = (\partial x_1)_p\otimes(dx^1)_p$ is $1$ in both charts, although $\mathscr{Y}$ is not linear.
    explanation: |
      Contraction of an upper with a lower index is the invariant operation: $(\partial\mathscr{X}^j/\partial\mathscr{Y}^k)_p(\partial\mathscr{Y}^k/\partial\mathscr{X}^i)_p = \delta^j_i$. Einstein's rule (sum only over an up-down pair) is built to flag exactly the sums that mean something in every chart; a same-height sum like $\sum_i S_{ii}$ needs extra structure to become meaningful (with a metric, Level 7).

  # ---------------------------------------------------------------- Problem 5
  - type: text
    id: p5-setup
    tag: Problem 5 · A full tensor computation
    title: One tensor, two charts, every route
    body: |
      Running example: on $\mathbb{R}^2$ (points $q = (q_1,q_2)$), at $p = (1,1)$, charts $\mathscr{X}(q) = (2q_1, -q_2)$ on $\mathcal{U}$ and $\mathscr{Y}(q) = (q_1, q_2e^{q_1})$ on $\mathcal{V}$. Take

      - the velocity $v$ with standard components $(1,2)$: $\mathscr{X}$-components $x^i_p = (2,-2)$, $\mathscr{Y}$-components $y^i_p = (1, 3e)$;
      - the field $f = q_1^2 + q_2$: $(df)_p$ has $\mathscr{X}$-components $\mathtt{x}^p_i = (1,-1)$ and $\mathscr{Y}$-components $\mathtt{y}^p_i = (1, 1/e)$.

      Build the $(1,1)$-tensor
      $$T := v\otimes(df)_p,$$
      which eats a covector $\mathsf{X}_p$ and a velocity $u$:
      $$T(\mathsf{X}_p, u) = \mathsf{X}_p(v)\,(df)_p(u).$$
      Goal: its components in both charts, by the law and by feeding basis elements, and its trace.

  - type: build
    id: p5-X
    tag: Problem 5 · A full tensor computation
    prompt: |
