      $(dx^i)_p(v) = x^i_p$ and $(df)_p((\partial x_j)_p) = \mathtt{x}^p_j$, so $(T_\mathcal{U})^i_j = x^i_p\,\mathtt{x}^p_j$: column times row. With $(2,-2)$ and $(1,-1)$:
      $$T_\mathcal{U} = \begin{pmatrix}2&-2\\-2&2\end{pmatrix}.$$

