      and $(df)_p(v) = v(f) = 4$ is the running example's number. The trace of $v\otimes\mathsf{X}_p$ is the pairing $\mathsf{X}_p(v)$: contracting the two indices feeds the covector its vector.


  - type: text
    id: wrap-up
    title: What you now own
    body: |
      Problems 3, 4 and 5, part 2 of 2 of the level challenge. Setting: $\mathcal{M}$ is a manifold, $p\in\mathcal{M}$, $f$ is a smooth scalar field, $v$ a velocity at $p$, and $(df)_p(v) := v(f)$. The running example is $\mathcal{M} = \mathbb{R}^2$ (points $q = (q_1,q_2)$), $p = (1,1)$, $f(q) := q_1^2 + q_2$, and $v$ the velocity with cartesian components $(1,2)$, so that $(df)_p(v) = 4$.

      3. **Circle.** On $S^1 := \{(q_1,q_2)\in\mathbb{R}^2 \mid q_1^2+q_2^2=1\}$, the angle chart $\theta$ (inverse $\theta^{-1}(t) := (\cos t,\sin t)$) and the stereographic chart $\sigma(q) := q_1/(1-q_2)$ rescale components in opposite ways; the pairing does not care.
      4. **Trace.** For a $(1,1)$-tensor $T$ with components $(T_\mathcal{U})^i_j$ in a chart $\mathscr{X}$ on $\mathcal{U}$, the contraction $(T_\mathcal{U})^i_i$ is invariant; for a $(0,2)$-tensor $S$ the same-height sum $\sum_i(S_\mathcal{U})_{ii}$ is not.
      5. **A full tensor.** With $\mathscr{X}(q) := (2q_1,-q_2)$ and $\mathscr{Y}(q) := (q_1, q_2e^{q_1})$, the tensor $T := v\otimes(df)_p$, defined by $T(\mathsf{X}_p,u) := \mathsf{X}_p(v)\,(df)_p(u)$, was computed in both charts, by the law and by feeding basis elements; its trace is $(df)_p(v) = 4$.


      The common thread: components belong to a chart, the objects $v$, $(df)_p$, $T$ do not, and every invariant number comes from an up-down pairing.

      **Next, Level 5: Fields.** Everything so far lived at one point $p$. A physical velocity field, or the electromagnetic field, is a choice at **every** point: a vector field picks a $v_p\in T_p\mathcal{M}$ for each $p$, smoothly. How do you say "smoothly" when each $v_p$ lives in its own space $T_p\mathcal{M}$? That is the first puzzle of the next level.
