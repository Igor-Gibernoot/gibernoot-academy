id: ch04-cotangent-basis
title: Differentials as a Basis · Part 1
kind: concept
own: |
  Setting: a chart $\mathscr{X}\colon\mathcal{U}\to\mathbb{R}^d$ around $p$ in a $d$-dimensional manifold $\mathcal{M}$; $T_p\mathcal{M}$ is the space of velocities at $p$ with basis $(\partial/\partial\mathscr{X}^i)_p$ (where $(\partial/\partial\mathscr{X}^i)_p(f) := \partial_i[f\circ\mathscr{X}^{-1}](\mathscr{X}(p))$), and components $v^i$ of a velocity $v$; $T_p^*\mathcal{M}$ is the space of linear maps $T_p\mathcal{M}\to\mathbb{R}$ (covectors $\mathsf{X}_p$), with $(df)_p(v) := v(f)$. Sums over repeated indices run over $1,\dots,d$.
  - **Dual chart-induced basis.** The differentials of the coordinate functions satisfy
  {{ $$(d\mathscr{X}^i)_p\Big(\Big(\frac{\partial}{\partial\mathscr{X}^j}\Big)_p\Big) = \delta^i_j$$ }}
  ($\delta^i_j=1$ if $i=j$, else $0$), so $(d\mathscr{X}^i)_p$ reads the $i$-th component of a velocity and is pictured as the line where $\mathscr{X}^i$ is constant.
  - **Components and pairing** of a covector $\mathsf{X}_p$:
  {{ $$\mathtt{x}^p_i := \mathsf{X}_p\Big(\Big(\frac{\partial}{\partial\mathscr{X}^i}\Big)_p\Big),\qquad \mathsf{X}_p = \mathtt{x}^p_i\,(d\mathscr{X}^i)_p,$$ }}
  {{ $$\mathsf{X}_p(v) = \mathtt{x}^p_i\,v^i.$$ }}
  - **Differential in a chart:**
  {{ $$(df)_p = \partial_i\big[f\circ\mathscr{X}^{-1}\big]\big(\mathscr{X}(p)\big)\,(d\mathscr{X}^i)_p.$$ }}
  - Running example: on $\mathbb{R}^2$ with $\mathscr{X}(q) := (2q_1,-q_2)$, $\mathscr{Y}(q) := (q_1,q_2e^{q_1})$, $f(q) := q_1^2+q_2$ and $p := (1,1)$, the components of $(df)_p$ are $(1,-1)$ in $\mathscr{X}$ and $(1,1/e)$ in $\mathscr{Y}$, and for the velocity $v$ with standard components $(1,2)$
  $$(df)_p(v) = 4\quad\text{in both charts.}$$

cards:
  - type: text
    id: hook
    title: A chart hands us d fields
    body: |
      Recall: the **cotangent space** $T_p^*\mathcal{M} := \mathrm{Hom}_\mathbb{R}(T_p\mathcal{M}, \mathbb{R})$ is the set of linear maps from velocities at $p$ to numbers. Every scalar field $f$ gives one, its **differential**
      $$(df)_p(v) := v(f),$$
      the rate of change of $f$ along the velocity $v$.

      A chart $(\mathcal{U}, \mathscr{X})$ around $p$ comes with $d$ special fields: its **coordinate functions** $\mathscr{X}^i\colon\mathcal{U}\to\mathbb{R}$, where $\mathscr{X}^i(q)$ is the $i$-th coordinate of the point $q$. Each has a differential $(d\mathscr{X}^i)_p$. (Strictly, $\mathscr{X}^i$ lives only on $\mathcal{U}$; recall that a velocity only looks near $p$, so $v(\mathscr{X}^i)$ makes sense, exactly as when we fed $\mathscr{X}^i$ to the basis vectors.)

      The same chart also gave us the **chart-induced basis** of $T_p\mathcal{M}$:
      $$\Big(\frac{\partial}{\partial\mathscr{X}^j}\Big)_p(f) := \partial_j\big[f\circ\mathscr{X}^{-1}\big](\mathscr{X}(p)).$$
      So one chart produces $d$ vectors and $d$ covectors at $p$. How are they related?

  - type: mcq
    id: predict
    title: Predict first
    prompt: |
      A chart $(\mathcal{U}, \mathscr{X})$ around $p$ gives the basis vectors $(\partial/\partial\mathscr{X}^j)_p$ of $T_p\mathcal{M}$ and the differentials $(d\mathscr{X}^i)_p$ of its coordinate functions, where $(d\mathscr{X}^i)_p(v) := v(\mathscr{X}^i)$. Before computing, guess the number
      $$(d\mathscr{X}^i)_p\Big(\Big(\frac{\partial}{\partial\mathscr{X}^j}\Big)_p\Big).$$
    options:
      - text: '$1$ if $i = j$ and $0$ otherwise, for every chart and every point'
        correct: true
      - text: 'It depends on the chart and on $p$, like a Jacobian entry'
        feedback: |
          Jacobian entries appear when **two** charts are compared. Here both objects come from the **same** chart, and each is defined by that chart's own coordinates, so their pairing is pinned down by the definitions alone. Compute it in the next card.
      - text: 'It cannot be computed without a metric'
        feedback: |
          A metric is needed to turn vectors into covectors or to measure lengths, but not to feed a vector into a covector: that pairing is just evaluation of a linear map. Both objects here are defined from the chart alone.
      - text: '$1$ for every $i$ and $j$'
        feedback: |
          That would make all the $(d\mathscr{X}^i)_p$ give the same value on each basis vector. But $(\partial/\partial\mathscr{X}^j)_p$ is the velocity of the curve along which **only** the $j$-th coordinate changes, so the other coordinate functions do not change along it.
    explanation: |
      $\delta^i_j$, the Kronecker delta ($1$ if $i = j$, $0$ otherwise). Moving along the $j$-th coordinate curve changes only the $j$-th coordinate, at unit rate.

  - type: text
    id: compute
    title: Compute it
    body: |
      Unpack the two definitions. First the differential, then the basis vector:
      $$\begin{aligned}(d\mathscr{X}^i)_p\Big(\Big(\tfrac{\partial}{\partial\mathscr{X}^j}\Big)_p\Big) &= \Big(\tfrac{\partial}{\partial\mathscr{X}^j}\Big)_p(\mathscr{X}^i)\\ &= \partial_j\big[\mathscr{X}^i\circ\mathscr{X}^{-1}\big](\mathscr{X}(p)).\end{aligned}$$
      The map $\mathscr{X}^i\circ\mathscr{X}^{-1}$ goes from $\mathbb{R}^d$ to $\mathbb{R}$. Which function is it, and what is its $j$-th partial derivative?

  - type: mcq
    id: projection
    title: The composite
    prompt: |
      For a chart $(\mathcal{U}, \mathscr{X})$ with coordinate functions $\mathscr{X}^i$, what is the map $\mathscr{X}^i\circ\mathscr{X}^{-1}\colon\mathscr{X}(\mathcal{U})\to\mathbb{R}$, and its partial derivative $\partial_j$ at $\mathscr{X}(p)$?
    options:
      - text: 'The $i$-th projection $(a^1,\dots,a^d)\mapsto a^i$; $\partial_j$ of it is $\delta^i_j$'
        correct: true
      - text: 'The identity of $\mathbb{R}^d$; $\partial_j$ of it is $1$'
        feedback: |
          $\mathscr{X}\circ\mathscr{X}^{-1}$ is the identity, but $\mathscr{X}^i$ is only the $i$-th component of $\mathscr{X}$. So $\mathscr{X}^i\circ\mathscr{X}^{-1}$ takes a point $(a^1,\dots,a^d)$ of $\mathbb{R}^d$ back to $\mathcal{M}$ and reads its $i$-th coordinate: the result is the number $a^i$, not a point of $\mathbb{R}^d$.
      - text: 'It depends on the chart, so $\partial_j$ of it is the Jacobian entry $(\partial\mathscr{X}^i/\partial\mathscr{X}^j)_p$, unknown in general'
        feedback: |
          Whatever the chart, going to $\mathcal{M}$ with $\mathscr{X}^{-1}$ and coming back with $\mathscr{X}^i$ just reads off the $i$-th number you started with. The "Jacobian of a chart with itself" is always the identity matrix.
    explanation: |
      $\mathscr{X}^i\circ\mathscr{X}^{-1}(a^1,\dots,a^d) = a^i$. Its derivative in the $j$-th slot is $1$ if $j = i$ and $0$ otherwise, at every point. Hence
      $$(d\mathscr{X}^i)_p\Big(\Big(\tfrac{\partial}{\partial\mathscr{X}^j}\Big)_p\Big) = \delta^i_j.$$

  - type: text
    id: dual-basis
    title: The dual basis, again
    body: |
      Recall from Chapter 2: given a basis $\hat{x}_1,\dots,\hat{x}_d$ of a vector space $V$, the **dual cobasis** $\hat{\mathfrak{x}}^1,\dots,\hat{\mathfrak{x}}^d$ of $V^*$ is defined by
      $$\hat{\mathfrak{x}}^i(\hat{x}_j) = \delta^i_j,$$
      and it is a basis of $V^*$. The covector $\hat{\mathfrak{x}}^i$ reads off the $i$-th component of a vector.

      We just found that the differentials $(d\mathscr{X}^i)_p$ satisfy exactly this condition against the chart-induced basis. So the set
      $$\big\{(d\mathscr{X}^1)_p,\dots,(d\mathscr{X}^d)_p\big\}$$
      is the dual basis of $\big\{(\partial/\partial\mathscr{X}^j)_p\big\}$, the **dual chart-induced basis** of $T_p^*\mathcal{M}$. Nothing new had to be built: the chart's own coordinate functions, differentiated, are the dual basis.

      In particular, for a velocity $v = v^j\,(\partial/\partial\mathscr{X}^j)_p$ (Einstein summation over $j$):
      $$(d\mathscr{X}^i)_p(v) = v^j\,\delta^i_j = v^i.$$

  - type: numeric
    id: read-component
    title: Reading a component
    prompt: |
      A chart $(\mathcal{U}, \mathscr{X})$ on a 2-dimensional manifold gives the basis $(\partial/\partial\mathscr{X}^1)_p$, $(\partial/\partial\mathscr{X}^2)_p$ of $T_p\mathcal{M}$, and $(d\mathscr{X}^i)_p((\partial/\partial\mathscr{X}^j)_p) = \delta^i_j$. Take
      $$v = 3\Big(\tfrac{\partial}{\partial\mathscr{X}^1}\Big)_p - 5\Big(\tfrac{\partial}{\partial\mathscr{X}^2}\Big)_p.$$
      What is $(d\mathscr{X}^2)_p(v)$?
    answer: -5
    wrong:
      - { value: 3, feedback: '$(d\mathscr{X}^2)_p$ returns $1$ on the **second** basis vector and $0$ on the first, so it picks the coefficient of $(\partial/\partial\mathscr{X}^2)_p$.' }
      - { value: -2, feedback: 'The covector does not add up the coefficients: by linearity it gives $3\cdot 0 + (-5)\cdot 1$.' }
    hint: 'Use linearity: $(d\mathscr{X}^2)_p(v) = 3\,\delta^2_1 - 5\,\delta^2_2$.'
    explanation: |
      $3\cdot 0 + (-5)\cdot 1 = -5$. The differential of the $i$-th coordinate function reads the $i$-th component of a velocity.

  - type: widget
    id: explore-x
    title: Watch the differentials read components
    widget: chart-basis
    config:
      charts: [X]
      p: [1, 1]
      v: [1, 2]
      dragP: false
      presets:
        - { label: 'First basis vector', charts: [X], p: [1, 1], v: [0.5, 0] }
        - { label: 'Second basis vector', charts: [X], p: [1, 1], v: [0, -1] }
        - { label: 'Along the vertical', charts: [X], p: [1, 1], v: [0, 1.5] }
    body: |
      The plane $\mathbb{R}^2$ (points $q = (q_1, q_2)$) with the chart $\mathscr{X}(q) = (2q_1, -q_2)$ and its coordinate lines, at $p = (1, 1)$. The purple arrows are $(\partial/\partial\mathscr{X}^1)_p$ and $(\partial/\partial\mathscr{X}^2)_p$; the blue arrow is a velocity $v$, and the readout gives its components $(\mathscr{X}^i\circ\gamma)'(0) = v(\mathscr{X}^i)$. By definition that number **is** $(d\mathscr{X}^i)_p(v)$: the readout is the two differentials at work.

      1. Press **First basis vector** and **Second basis vector**: read $(d\mathscr{X}^1)_p$ and $(d\mathscr{X}^2)_p$ on each.
      2. Press **Along the vertical**, then drag $v$ up and down along the vertical line $q_1 = 1$ through $p$. Which component stays $0$?

  - type: mcq
    id: kernel-picture
    title: The picture of a differential
    review: false
    prompt: |
      In the plane with the chart $\mathscr{X}(q) = (2q_1, -q_2)$ at $p = (1, 1)$: dragging the velocity $v$ along the vertical line $q_1 = 1$ through $p$, which number stays $0$?
    options:
      - text: '$(d\mathscr{X}^1)_p(v)$: on that line $\mathscr{X}^1 = 2q_1$ does not change'
        correct: true
      - text: '$(d\mathscr{X}^2)_p(v)$'
        feedback: |
          Moving vertically changes $q_2$, hence $\mathscr{X}^2 = -q_2$, at a nonzero rate. What stays constant along the vertical line is $\mathscr{X}^1 = 2q_1$, so its differential vanishes there.
      - text: 'Both, since the vertical line is a coordinate line'
        feedback: |
          A coordinate line is a line along which **one** coordinate is constant and the other changes. The vertical line through $p$ is where $\mathscr{X}^1$ is constant; $\mathscr{X}^2$ still changes along it.
    explanation: |
      $(d\mathscr{X}^1)_p$ sends to $0$ exactly the velocities along the line where $\mathscr{X}^1$ is constant, the line of $(\partial/\partial\mathscr{X}^2)_p$. Recall that a covector is pictured as the line of velocities it sends to $0$, not as an arrow. So $(d\mathscr{X}^1)_p$ is pictured by the coordinate line on which $\mathscr{X}^1$ is constant, which points along the **other** basis vector.

  - type: mcq
    id: kernel-trap
    title: Which line is it?
    prompt: |
      A chart $(\mathcal{U}, \mathscr{X})$ on a 2-dimensional manifold gives at $p$ the basis vectors $(\partial/\partial\mathscr{X}^1)_p$, $(\partial/\partial\mathscr{X}^2)_p$ and the covectors $(d\mathscr{X}^1)_p$, $(d\mathscr{X}^2)_p$, with $(d\mathscr{X}^i)_p((\partial/\partial\mathscr{X}^j)_p) = \delta^i_j$. A covector is pictured as the line of velocities it sends to $0$. Which line pictures $(d\mathscr{X}^1)_p$?
    options:
      - text: 'The line of multiples of $(\partial/\partial\mathscr{X}^2)_p$'
        correct: true
      - text: 'The line of multiples of $(\partial/\partial\mathscr{X}^1)_p$'
        feedback: |
          Tempting, since both carry the label $1$. But $(d\mathscr{X}^1)_p$ gives $1$ on $(\partial/\partial\mathscr{X}^1)_p$, not $0$. The velocities it kills are those along which $\mathscr{X}^1$ does not change: the multiples of $(\partial/\partial\mathscr{X}^2)_p$.
      - text: 'It is the arrow $(\partial/\partial\mathscr{X}^1)_p$ itself'
        feedback: |
          A covector is not an element of $T_p\mathcal{M}$; it eats elements of $T_p\mathcal{M}$. Matching it with one arrow would need extra structure (the metric). Without it, the honest picture is the line it sends to $0$.
    explanation: |
      $(d\mathscr{X}^1)_p((\partial/\partial\mathscr{X}^2)_p) = \delta^1_2 = 0$, so the line through $(\partial/\partial\mathscr{X}^2)_p$ is killed, while $(\partial/\partial\mathscr{X}^1)_p$ gives $1$.

  - type: text
    id: independence
    title: Why it is a basis
    body: |
      Chapter 2 tells us that a dual basis is a basis, but let's see it directly here; the argument also shows how to find components.

      **Linear independence.** Suppose a combination vanishes, $a_i\,(d\mathscr{X}^i)_p = 0$ with $a_i\in\mathbb{R}$ (the zero covector, which gives $0$ on every velocity). Feed it the basis vector $(\partial/\partial\mathscr{X}^j)_p$, for a fixed $j$:
      $$0 = a_i\,(d\mathscr{X}^i)_p\Big(\Big(\tfrac{\partial}{\partial\mathscr{X}^j}\Big)_p\Big) = a_i\,\delta^i_j.$$
      The coefficients carry a **lower** index because they multiply covectors with an upper one.

  - type: mcq
    id: delta-sum
    title: Contract the delta
    prompt: |
      With Einstein summation over $i = 1,\dots,d$, and $\delta^i_j$ the Kronecker delta ($1$ if $i = j$, $0$ otherwise), what is $a_i\,\delta^i_j$ for a fixed $j$?
    options:
      - text: '$a_j$'
        correct: true
      - text: '$a_1 + \dots + a_d$'
        feedback: |
          That would need $\delta^i_j = 1$ for every $i$. In the sum over $i$, only the term with $i = j$ survives; all others are multiplied by $0$.
      - text: '$d\cdot a_j$'
        feedback: |
          This mixes it up with $\delta^i_i = d$, where the sum runs over the diagonal. Here $j$ is fixed and only one term of the sum is nonzero.
    explanation: |
      $a_i\,\delta^i_j = a_j$: the delta replaces the summed index by the free one. So $a_i\,(d\mathscr{X}^i)_p = 0$ forces $a_j = 0$ for every $j$: the differentials are linearly independent.

  - type: text
    id: components
    title: Components of a covector
    body: |
      **Spanning.** Take any covector $\mathsf{X}_p\in T_p^*\mathcal{M}$ and define its **components** in the chart $\mathscr{X}$ as its values on the basis vectors:
      $$\mathtt{x}^p_i := \mathsf{X}_p\Big(\Big(\tfrac{\partial}{\partial\mathscr{X}^i}\Big)_p\Big)\in\mathbb{R}.$$
      (Typewriter $\mathtt{x}$ with a lower index; the $p$ is a label, not an index.) The claim is
      $$\mathsf{X}_p = \mathtt{x}^p_i\,(d\mathscr{X}^i)_p.$$
      Two covectors are equal when they give the same number on every velocity $v = v^j\,(\partial/\partial\mathscr{X}^j)_p$. Recall that covectors are added and scaled value by value.

  - type: order
    id: spanning-proof
    title: Prove the expansion
    prompt: |
      Let $\mathsf{X}_p\in T_p^*\mathcal{M}$ have components $\mathtt{x}^p_i := \mathsf{X}_p((\partial/\partial\mathscr{X}^i)_p)$ in a chart $(\mathcal{U},\mathscr{X})$, and let $v = v^i\,(\partial/\partial\mathscr{X}^i)_p$ (Einstein summation). Put the chain in order, starting from the left side.
    steps:
      - '$\big(\mathtt{x}^p_i\,(d\mathscr{X}^i)_p\big)(v)$'
      - '$= \mathtt{x}^p_i\,(d\mathscr{X}^i)_p(v)$ (covectors act value by value)'
      - '$= \mathtt{x}^p_i\,v^i$ ($(d\mathscr{X}^i)_p$ reads the $i$-th component)'
      - '$= v^i\,\mathsf{X}_p\big((\partial/\partial\mathscr{X}^i)_p\big)$ (definition of $\mathtt{x}^p_i$)'
      - '$= \mathsf{X}_p(v)$ (linearity of $\mathsf{X}_p$)'
    hint: 'Start by letting the combination act value by value, then use $(d\mathscr{X}^i)_p(v) = v^i$, then pack the components back into $\mathsf{X}_p$.'
    explanation: |
      The two covectors agree on every $v$, so $\mathsf{X}_p = \mathtt{x}^p_i\,(d\mathscr{X}^i)_p$. With independence, the $(d\mathscr{X}^i)_p$ form a basis of $T_p^*\mathcal{M}$, and again $\dim T_p^*\mathcal{M} = d$. On the way we got the pairing in components:
      $$\mathsf{X}_p(v) = \mathtt{x}^p_i\,v^i.$$

  - type: build
    id: build-expansion
    title: Write the expansion
    prompt: |
      In a chart $(\mathcal{U}, \mathscr{X})$ around $p$, a covector $\mathsf{X}_p\in T_p^*\mathcal{M}$ has components $\mathtt{x}^p_i := \mathsf{X}_p((\partial/\partial\mathscr{X}^i)_p)$. Using Einstein summation, expand $\mathsf{X}_p$ in the dual chart-induced basis.
    prefix: '\mathsf{X}_p ='
    tiles: ['\mathtt{x}^p_i', '(d\mathscr{X}^i)_p', '\big(\tfrac{\partial}{\partial\mathscr{X}^i}\big)_p', '(d\mathscr{X}_i)_p', '\mathtt{x}_p^i']
    answers:
      - ['\mathtt{x}^p_i', '(d\mathscr{X}^i)_p']
      - ['(d\mathscr{X}^i)_p', '\mathtt{x}^p_i']
    wrong:
      - answer: ['\mathtt{x}^p_i', '\big(\tfrac{\partial}{\partial\mathscr{X}^i}\big)_p']
        feedback: 'That is a combination of basis **vectors**, an element of $T_p\mathcal{M}$, not of $T_p^*\mathcal{M}$. The index heights warn you too: an index in a denominator counts as lower, so both $i$ are down and no sum is allowed.'
      - answer: ['\mathtt{x}_p^i', '(d\mathscr{X}^i)_p']
        feedback: 'Both $i$ are upper, so Einstein summation does not apply. Covector components carry a **lower** index, matching the upper index of the basis covectors $(d\mathscr{X}^i)_p$.'
    hint: 'Components with a lower index times basis covectors with an upper index.'
    explanation: |
      $\mathsf{X}_p = \mathtt{x}^p_i\,(d\mathscr{X}^i)_p$: one $i$ down, one up, summed. The coordinate functions $\mathscr{X}^i$ carry upper indices, so their differentials do too.

  - type: text
    id: df-components
    title: The components of a differential
    body: |
      Apply this to $\mathsf{X}_p = (df)_p$. Its components are its values on the basis vectors, and $(df)_p(v) := v(f)$:
      $$\mathtt{x}^p_i = (df)_p\Big(\Big(\tfrac{\partial}{\partial\mathscr{X}^i}\Big)_p\Big) = \partial_i\big[f\circ\mathscr{X}^{-1}\big](\mathscr{X}(p)).$$
      So, with $F := f\circ\mathscr{X}^{-1}$ the chart representative of $f$,
      $$(df)_p = \partial_iF(\mathscr{X}(p))\,(d\mathscr{X}^i)_p.$$
      This is the $df = \tfrac{\partial f}{\partial x}dx + \tfrac{\partial f}{\partial y}dy$ of calculus, now with a precise meaning: each $(d\mathscr{X}^i)_p$ is a linear map on velocities, not an "infinitesimal".

      **Running example.** On $\mathbb{R}^2$, $f(q) = q_1^2 + q_2$ at $p = (1, 1)$, and the chart $\mathscr{X}(q) = (2q_1, -q_2)$, so $\mathscr{X}(p) = (2, -1)$ and
      $$\mathscr{X}^{-1}(a^1, a^2) = \big(\tfrac{a^1}{2}, -a^2\big).$$

  - type: numeric
    id: c3-x1
    title: First component in the chart X
    prompt: |
      On $\mathbb{R}^2$ take $f(q) = q_1^2 + q_2$, $p = (1, 1)$ and the chart $\mathscr{X}(q) = (2q_1, -q_2)$, with inverse $\mathscr{X}^{-1}(a^1, a^2) = (a^1/2, -a^2)$ and $\mathscr{X}(p) = (2, -1)$. The chart representative is
      $$F(a^1, a^2) = \tfrac14(a^1)^2 - a^2.$$
      Compute $\mathtt{x}^p_1 = \partial_1F(\mathscr{X}(p))$, the first component of $(df)_p$ in the chart $\mathscr{X}$.
    answer: 1
    wrong:
      - { value: 2, feedback: 'That is $\partial f/\partial q_1 = 2q_1$ at $p$, the component in the standard coordinates. In the chart $\mathscr{X}$ we differentiate $F$ with respect to $a^1 = 2q_1$: $\partial_1F = a^1/2$.' }
      - { value: 4, feedback: 'Differentiate $\tfrac14(a^1)^2$: the result is $\tfrac12 a^1$, then set $a^1 = 2$.' }
    hint: '$\partial_1F = \tfrac12 a^1$; evaluate at $a^1 = 2$.'
    explanation: |
      $\partial_1F = a^1/2 = 1$ at $\mathscr{X}(p) = (2, -1)$. The chart $\mathscr{X}$ stretches $q_1$ by $2$, so the rate per unit of $\mathscr{X}^1$ is half the rate per unit of $q_1$.

  - type: numeric
    id: c3-x2
    title: Second component in the chart X
    prompt: |
      On $\mathbb{R}^2$ take $f(q) = q_1^2 + q_2$, $p = (1, 1)$ and the chart $\mathscr{X}(q) = (2q_1, -q_2)$. The chart representative is $F(a^1, a^2) = \tfrac14(a^1)^2 - a^2$ and $\mathscr{X}(p) = (2, -1)$. Compute $\mathtt{x}^p_2 = \partial_2F(\mathscr{X}(p))$.
    answer: -1
    wrong:
      - { value: 1, feedback: 'That is $\partial f/\partial q_2$, the standard component. The chart reverses the second axis, $a^2 = -q_2$, so $F$ contains $-a^2$.' }
    hint: '$F$ depends on $a^2$ only through $-a^2$.'
    explanation: |
      $\partial_2F = -1$. So in the chart $\mathscr{X}$
      $$(df)_p = (d\mathscr{X}^1)_p - (d\mathscr{X}^2)_p.$$

  - type: numeric
    id: c3-y1
    title: First component in the chart Y
    prompt: |
      On $\mathbb{R}^2$ take $f(q) = q_1^2 + q_2$, $p = (1, 1)$ and the chart $\mathscr{Y}(q) = (q_1, q_2e^{q_1})$, with inverse $\mathscr{Y}^{-1}(b^1, b^2) = (b^1, b^2e^{-b^1})$ and $\mathscr{Y}(p) = (1, e)$. The chart representative is
      $$G(b^1, b^2) = (b^1)^2 + b^2e^{-b^1}.$$
      Compute $\mathtt{y}^p_1 = \partial_1G(\mathscr{Y}(p))$, the first component of $(df)_p$ in the chart $\mathscr{Y}$.
    answer: 1
    wrong:
      - { value: 2, feedback: 'That keeps only the derivative of $(b^1)^2$. The term $b^2e^{-b^1}$ also depends on $b^1$: its derivative is $-b^2e^{-b^1}$, which is $-e\cdot e^{-1} = -1$ at $\mathscr{Y}(p)$.' }
      - { value: 3, feedback: 'Watch the sign: the derivative of $e^{-b^1}$ is $-e^{-b^1}$.' }
    hint: '$\partial_1G = 2b^1 - b^2e^{-b^1}$; set $b^1 = 1$, $b^2 = e$.'
    explanation: |
      $\partial_1G = 2 - e\cdot e^{-1} = 1$. Even though $\mathscr{Y}^1 = q_1$ is the same function as the standard $q_1$, the component is not $2$: a partial derivative depends on which coordinates are held fixed, and here it is $\mathscr{Y}^2$, not $q_2$.

  - type: numeric
    id: c3-y2
    title: Second component in the chart Y
    prompt: |
      On $\mathbb{R}^2$ take $f(q) = q_1^2 + q_2$, $p = (1, 1)$ and the chart $\mathscr{Y}(q) = (q_1, q_2e^{q_1})$, with $\mathscr{Y}(p) = (1, e)$ and chart representative $G(b^1, b^2) = (b^1)^2 + b^2e^{-b^1}$. Compute $\mathtt{y}^p_2 = \partial_2G(\mathscr{Y}(p))$.
    answer: 0.36788
    tolerance: 0.001
    answerText: '1/e ≈ 0.368'
    wrong:
      - { value: 1, feedback: 'The factor $e^{-b^1}$ multiplies $b^2$: $\partial_2G = e^{-b^1}$, at $b^1 = 1$.' }
      - { value: 2.71828, feedback: 'The exponent is negative: $\partial_2G = e^{-b^1} = e^{-1}$.' }
    hint: '$G$ depends on $b^2$ through $b^2e^{-b^1}$.'
    explanation: |
      $\partial_2G = e^{-1}$. So in the chart $\mathscr{Y}$
      $$(df)_p = (d\mathscr{Y}^1)_p + \tfrac1e(d\mathscr{Y}^2)_p.$$
      Different numbers from the chart $\mathscr{X}$, same covector. How can we be sure it is the same?

  - type: numeric
    id: c3-pairing
    title: Same number in both charts
    prompt: |
      On $\mathbb{R}^2$ at $p = (1, 1)$, the differential of $f = q_1^2 + q_2$ has components $\mathtt{x}^p_i = (1, -1)$ in the chart $\mathscr{X}(q) = (2q_1, -q_2)$ and $\mathtt{y}^p_i = (1, 1/e)$ in the chart $\mathscr{Y}(q) = (q_1, q_2e^{q_1})$. The velocity with standard components $(1, 2)$ has components $(2, -2)$ in $\mathscr{X}$ and $(1, 3e)$ in $\mathscr{Y}$. Compute $\mathtt{y}^p_i\,v^i$ with the $\mathscr{Y}$ numbers.
    answer: 4
    wrong:
      - { value: 2, feedback: 'You may have multiplied $\tfrac1e$ by $e$ instead of $3e$: the second term is $\tfrac1e\cdot 3e = 3$.' }
    hint: '$\mathtt{y}^p_1v^1 + \mathtt{y}^p_2v^2 = 1\cdot 1 + \tfrac1e\cdot 3e$.'
    explanation: |
      $1 + 3 = 4$. In $\mathscr{X}$: $1\cdot 2 + (-1)(-2) = 4$. Directly: $(df)_p(v) = 2v^1 + v^2 = 2 + 2 = 4$ in standard components. The number $\mathsf{X}_p(v)$ needs no chart; the charts only split it into different products. The next part of this lesson shows why this always works, in any two charts.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Next: Differentials as a Basis · Part 2.** The components of $(df)_p$ were different in the charts $\mathscr{X}$ and $\mathscr{Y}$, yet the pairing gave $4$ in both. How exactly do the dual basis and the components change from one chart to another, why does the pairing never change, and is every covector a differential $(df)_p$?
