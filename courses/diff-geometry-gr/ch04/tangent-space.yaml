id: ch04-tangent-space
title: Curves and the Tangent Space · Part 1
kind: concept
own: |
  Setting: $\mathcal{M}$ is a smooth manifold; $C^\infty(\mathcal{M})$ is the set of its smooth scalar fields $f\colon\mathcal{M}\to\mathbb{R}$, a real vector space with the point-by-point operations $(f\oplus g)(q) := f(q)+g(q)$ and $(\alpha\odot f)(q) := \alpha\,f(q)$; $p\in\mathcal{M}$; a **smooth curve** is a map $\gamma\colon\mathbb{R}\to\mathcal{M}$ whose chart representatives $\mathscr{X}\circ\gamma$ are $C^\infty$, and it passes through $p$ at $\lambda_0$ when $\gamma(\lambda_0)=p$.
  - **Velocity without arrows.** For such a curve, the velocity of $\gamma$ at $p$ is the map that sends each scalar field to its rate of change along the curve:
  {{ $$v_{\gamma,p}(f) := (f\circ\gamma)'(\lambda_0).$$ }}
  It uses only curves and scalar fields, so it works on any manifold, with no surrounding space.
  - **Linearity.** Because $\oplus$ and $\odot$ are point by point and the derivative of a sum is the sum of derivatives,
  $$v_{\gamma,p}(f\oplus g) = v_{\gamma,p}(f)+v_{\gamma,p}(g),$$
  $$v_{\gamma,p}(\alpha\odot f) = \alpha\,v_{\gamma,p}(f),$$
  so $v_{\gamma,p}\in\mathrm{Hom}\big(C^\infty(\mathcal{M}),\mathbb{R}\big)$ (Hom = homomorphism, the linear maps).
  - **Equality of velocities.** Two velocities at $p$ are equal when
  {{ $$v_{\gamma_1,p}(f) = v_{\gamma_2,p}(f)\quad\text{for every } f\in C^\infty(\mathcal{M});$$ }}
  agreeing on one field is not enough. Different curves (one bent, one straight) can share one velocity, because {{ $(f\circ\gamma)'(\lambda_0)$ sees only first order at $p$ }}.
  - Running example: on $\mathbb{R}^2$ (points $q=(q_1,q_2)$) with $p=(1,1)$, $\gamma_1(\lambda)=(\lambda,1)$ at $\lambda_0=1$ and $\gamma_2(\lambda)=(1,2\lambda)$ at $\lambda_0=\tfrac12$, and $f(q) := q_1^2+q_2$:
  $$(f\circ\gamma_1)'(1) = (\lambda^2+1)'\big|_{\lambda=1} = 2,$$
  $$(f\circ\gamma_2)'(\tfrac12) = (1+2\lambda)'\big|_{\lambda=1/2} = 2.$$

cards:
  - type: text
    id: hook
    title: A velocity with nowhere to point
    body: |
      In the plane $\mathbb{R}^2$ the velocity of a curve $\gamma$ at $\lambda = 0$ is an arrow:
      $$\gamma'(0) = \lim_{\lambda\to 0}\frac{\gamma(\lambda) - \gamma(0)}{\lambda}.$$
      This formula **subtracts points**. That works in $\mathbb{R}^2$, where points are pairs of numbers, but a manifold has no subtraction of points. Picture the circle $S^1$ as a world of its own, with no plane around it: a bug crawling on it cannot draw an arrow "off" the circle, because there is no off. Spacetime is like that too: there is no bigger space around it for velocity arrows to live in.

      Still, the bug clearly moves at some rate. Describe its motion with the angle chart $\theta\in(0, 2\pi)$ (defined on $S^1$ without the point $(1, 0)$). Bug 1 follows
      $$\theta(\gamma_1(\lambda)) = \theta_p + \lambda,$$
      bug 2 follows
      $$\theta(\gamma_2(\lambda)) = \theta_p + 2\lambda.$$
      Both are at the same point $p$ at $\lambda = 0$, moving the same way.

  - type: mcq
    id: predict-twice
    prompt: |
      Before any definitions, guess. On the circle $S^1$, with the angle chart $\theta\in(0, 2\pi)$, curve $\gamma_1$ follows $\theta(\gamma_1(\lambda)) = \theta_p + \lambda$ and curve $\gamma_2$ follows $\theta(\gamma_2(\lambda)) = \theta_p + 2\lambda$. Both pass through the point $p$ at $\lambda = 0$. Whatever "velocity at $p$" ends up meaning on $S^1$, should the two velocities be the same?
    options:
      - text: 'No: $\gamma_2$ covers angle twice as fast, so its velocity should be twice that of $\gamma_1$'
        correct: true
      - text: 'Yes: both trace the same circle in the same direction through the same point'
        feedback: |
          Same path and direction is not the same motion: after a parameter time $\lambda$, $\gamma_2$ has turned twice as far. In the plane, $\lambda\mapsto(\lambda, 0)$ and $\lambda\mapsto(2\lambda, 0)$ trace the same line, and their velocities $(1, 0)$ and $(2, 0)$ differ. A good definition on $S^1$ should keep that.
      - text: 'The question has no answer: without a surrounding plane there is no velocity at all'
        feedback: |
          There is no **arrow**, but the bugs still move: the angle changes at a definite rate, and so does anything we could measure along the way (a temperature on the circle, say). The plan of this lesson is to define velocity from such rates of change, without any surrounding space.
    explanation: |
      Our intuition says "twice as fast, twice the velocity". The task is a definition of velocity that uses only the manifold (points, charts, smooth functions) and still delivers that. The trick: watch how fast a **function** changes along the curve.

  - type: widget
    id: circle-explore
    title: Measuring along a curve
    widget: curve-velocity
    config:
      circle: true
      angle: 60
      f: x
      curves:
        - { w: 1 }
        - { w: 0.5, a: 0.5 }
      presets:
        - label: Same speed
          curves:
            - { w: 1 }
            - { w: 1, a: -0.5 }
    body: |
      The point $p$ sits at $60°$ on $S^1$. Each curve passes through $p$ at $\lambda = 0$ and follows $\theta(\gamma(\lambda)) = \theta_p + \lambda w + \lambda^2 a$: $w$ sets how fast it starts, $a$ bends it (speeds it up or slows it down later). The scalar field is $f(q) = q_1$, the first coordinate of the point $q$, a smooth function on the circle. The number to watch is $(f\circ\gamma)'(0)$: how fast $f$ changes as the bug passes $p$.

      1. Start: $\gamma_1$ has $w = 1$, $\gamma_2$ has $w = 0.5$. Compare their two readouts $(f\circ\gamma)'(0)$.
      2. Press **Same speed**: both start with $w = 1$, but $\gamma_2$ is bent. Do the curves differ? Do the readouts?
      3. Drag the hollow bend handle of $\gamma_2$ around. What changes, and what stays fixed?

  - type: mcq
    id: bend-no-effect
    prompt: |
      On the circle $S^1$ with the angle chart $\theta$, take the point $p$ with $\theta_p = \pi/3$ and two curves through $p$ at $\lambda = 0$:
      $$\theta(\gamma_1(\lambda)) = \theta_p + \lambda,$$
      $$\theta(\gamma_2(\lambda)) = \theta_p + \lambda + \tfrac12\lambda^2.$$
      Let $f(q) = q_1$, so $f(\gamma(\lambda)) = \cos\theta(\gamma(\lambda))$. Which is true?
    options:
      - text: 'The curves are different maps, yet $(f\circ\gamma_1)''(0) = (f\circ\gamma_2)''(0)$'
        correct: true
      - text: 'The bend changes the curve, so $(f\circ\gamma_2)''(0)$ differs from $(f\circ\gamma_1)''(0)$'
        feedback: |
          The bend term $\tfrac12\lambda^2$ has derivative $\lambda$, which vanishes at $\lambda = 0$. By the chain rule, $(f\circ\gamma_2)'(0) = -\sin\theta_p\cdot(1 + \lambda)|_{\lambda=0} = -\sin\theta_p$, exactly as for $\gamma_1$. The bend only matters away from $p$.
      - text: 'The curves are the same map, since they pass through $p$ in the same direction'
        feedback: |
          At $\lambda = 1$, $\gamma_1$ is at angle $\theta_p + 1$ and $\gamma_2$ at $\theta_p + 1.5$: different points, so different maps. What they share is only their behaviour **at** $\lambda = 0$, to first order.
    explanation: |
      $(f\circ\gamma)'(0)$ only sees the curve to first order at $p$: here $-\sin\theta_p\cdot w$, with $w$ the starting rate. So the curve with $w = 1$ gives $-\tfrac{\sqrt3}{2}\approx -0.87$, and the one with $w = 0.5$ gives half of that. This number is the seed of the definition of velocity.

  - type: text
    id: recall-ingredients
    title: 'Recall: curves and scalar fields'
    body: |
      Two ingredients, both from smooth manifolds. Let $\mathcal{M}$ be a smooth manifold of dimension $d$.

      - A **curve** is a map $\gamma\colon\mathbb{R}\to\mathcal{M}$, $\lambda\mapsto\gamma(\lambda)$. Giving $\mathbb{R}$ its standard chart $\mathrm{id}_\mathbb{R}$ (id = identity), $\gamma$ is **smooth** when every chart representative $\mathscr{X}\circ\gamma$ is $C^\infty$. It **passes through** $p\in\mathcal{M}$ at the parameter $\lambda_0$ if $\gamma(\lambda_0) = p$.
      - A **scalar field** (smooth function) is a smooth $f\colon\mathcal{M}\to\mathbb{R}$: every $f\circ\mathscr{X}^{-1}$ is $C^\infty$. Their set is $C^\infty(\mathcal{M})$.

      $C^\infty(\mathcal{M})$ is a real vector space, with operations defined point by point:
      $$(f\oplus g)(p) := f(p) + g(p)$$
      and
      $$(\alpha\odot f)(p) := \alpha\cdot f(p),$$
      for $f, g\in C^\infty(\mathcal{M})$ and $\alpha\in\mathbb{R}$. The circles $\oplus$, $\odot$ remind us that these are new operations on functions, built from $+$ and $\cdot$ of numbers.

  - type: mcq
    id: why-differentiable
    prompt: |
      Let $\gamma\colon\mathbb{R}\to\mathcal{M}$ be a smooth curve on a smooth manifold $\mathcal{M}$ and $f\colon\mathcal{M}\to\mathbb{R}$ a smooth function. Neither one can be differentiated directly, since $\mathcal{M}$ has no calculus of its own. Why is $f\circ\gamma\colon\mathbb{R}\to\mathbb{R}$ an ordinary differentiable function?
    options:
      - text: 'Near any $\lambda_0$, pick a chart $\mathscr{X}$ around $\gamma(\lambda_0)$: $f\circ\gamma = (f\circ\mathscr{X}^{-1})\circ(\mathscr{X}\circ\gamma)$, a composition of $C^\infty$ maps between spaces $\mathbb{R}^n$'
        correct: true
      - text: 'Because $f\circ\gamma$ goes from $\mathbb{R}$ to $\mathbb{R}$, and every such function is differentiable'
        feedback: |
          Plenty of functions $\mathbb{R}\to\mathbb{R}$ are not differentiable, like $|\lambda|$ at $0$. Being a map between copies of $\mathbb{R}$ only makes the question meaningful; smoothness of $f$ and $\gamma$ is what makes the answer yes.
      - text: 'Because $\mathcal{M}$ sits inside some $\mathbb{R}^n$, where $f$ and $\gamma$ can be differentiated'
        feedback: |
          A manifold need not sit inside anything: its definition is a set, a topology and an atlas. The argument must only use charts, and it does: insert $\mathscr{X}^{-1}\circ\mathscr{X}$ (the identity on the chart domain) between $f$ and $\gamma$.
    explanation: |
      On the chart domain $\mathscr{X}^{-1}\circ\mathscr{X}$ is the identity, so $f\circ\gamma = (f\circ\mathscr{X}^{-1})\circ(\mathscr{X}\circ\gamma)$ near $\lambda_0$. Both pieces are $C^\infty$ by definition, and the ordinary chain rule says their composition is $C^\infty$. So $(f\circ\gamma)'(\lambda_0)$ is a well-defined real number.

  - type: text
    id: def-velocity
    title: Velocity as a rate of change
    body: |
      Here is the definition, built only from curves and scalar fields. Let $\gamma$ be a smooth curve through $p$ at $\lambda_0$, so $\gamma(\lambda_0) = p$. Its **velocity at $p$** is the map
      $$v_{\gamma,p}\colon C^\infty(\mathcal{M})\to\mathbb{R}$$
      that sends each scalar field to its rate of change along $\gamma$ at $p$:
      $$v_{\gamma,p}(f) := (f\circ\gamma)'(\lambda_0).$$
      Read it as a measuring device: feed it a field $f$ (a temperature, a coordinate, anything smooth), and it returns how fast $f$ changes as the curve passes $p$.

      So a vector is no longer an arrow. It is a **machine that eats functions** and returns numbers. Two velocities are equal when they are equal as maps:
      $$v_{\gamma_1,p} = v_{\gamma_2,p}$$
      means $v_{\gamma_1,p}(f) = v_{\gamma_2,p}(f)$ for **every** $f\in C^\infty(\mathcal{M})$.

  - type: order
    id: linear-proof
    prompt: |
      Let $\gamma$ be a smooth curve on a smooth manifold $\mathcal{M}$ with $\gamma(\lambda_0) = p$, and $v_{\gamma,p}(f) := (f\circ\gamma)'(\lambda_0)$ for $f\in C^\infty(\mathcal{M})$. Put the proof of $v_{\gamma,p}(f\oplus g) = v_{\gamma,p}(f) + v_{\gamma,p}(g)$ in order.
    steps:
      - 'By the definition of $\oplus$, for every $\lambda$: $((f\oplus g)\circ\gamma)(\lambda) = f(\gamma(\lambda)) + g(\gamma(\lambda))$.'
      - 'So the real function $(f\oplus g)\circ\gamma$ is the ordinary sum of $f\circ\gamma$ and $g\circ\gamma$.'
      - 'The derivative of a sum of differentiable real functions is the sum of their derivatives.'
      - 'Evaluating at $\lambda_0$: $v_{\gamma,p}(f\oplus g) = (f\circ\gamma)''(\lambda_0) + (g\circ\gamma)''(\lambda_0) = v_{\gamma,p}(f) + v_{\gamma,p}(g)$.'
    hint: Start from what $f\oplus g$ does to a single point, then differentiate.
    explanation: |
      The same argument with $(\alpha\odot f)(\gamma(\lambda)) = \alpha\cdot f(\gamma(\lambda))$ gives $v_{\gamma,p}(\alpha\odot f) = \alpha\cdot v_{\gamma,p}(f)$. So $v_{\gamma,p}$ is **linear**: an element of $\mathrm{Hom}(C^\infty(\mathcal{M}), \mathbb{R})$ (Hom = homomorphism, the linear maps), the dual space of the vector space of scalar fields.

  - type: numeric
    id: c3-gamma1
    prompt: |
      On $\mathcal{M} = \mathbb{R}^2$ (points $q = (q_1, q_2)$) take the curve $\gamma_1(\lambda) = (\lambda, 1)$, which passes through $p = (1, 1)$ at $\lambda_0 = 1$, and the scalar field $f(q) = q_1^2 + q_2$. Compute $v_{\gamma_1,p}(f) = (f\circ\gamma_1)'(\lambda_0)$.
    answer: 2
    wrong:
      - value: 0
        feedback: |
          Evaluating at $\lambda = 0$ uses the wrong parameter: $\gamma_1(0) = (0, 1)$ is not $p$. The curve passes through $p$ at $\lambda_0 = 1$, so the derivative is taken there.
      - value: 1
        feedback: |
          That is the derivative of the first component of $\gamma_1$, not of $f\circ\gamma_1$. Compose first: $f(\gamma_1(\lambda)) = \lambda^2 + 1$.
    hint: Write out $f(\gamma_1(\lambda))$ as a function of $\lambda$, differentiate, and evaluate where $\gamma_1$ is at $p$.
    explanation: |
      $f(\gamma_1(\lambda)) = \lambda^2 + 1$, so $(f\circ\gamma_1)'(\lambda) = 2\lambda$, and at $\lambda_0 = 1$ this is $2$. Note the parameter: a curve may pass through $p$ at any $\lambda_0$, and the derivative is taken there.

  - type: numeric
    id: c3-gamma2
    prompt: |
      On $\mathcal{M} = \mathbb{R}^2$ (points $q = (q_1, q_2)$) take the curve $\gamma_2(\lambda) = (1, 2\lambda)$, which passes through $p = (1, 1)$ at $\lambda_0 = \tfrac12$, and the scalar field $f(q) = q_1^2 + q_2$. Compute $v_{\gamma_2,p}(f)$.
    answer: 2
    wrong:
      - value: 1
        feedback: |
          That is $\lambda_0$ times the slope, or the value of something at $\lambda_0 = \tfrac12$. Compose first: $f(\gamma_2(\lambda)) = 1 + 2\lambda$, whose derivative is the same at every $\lambda$.
      - value: 0
        feedback: |
          The first entry of $\gamma_2$ is constant, so $q_1^2$ contributes nothing; but the second entry $2\lambda$ grows, and $f$ contains $q_2$.
    hint: Write out $f(\gamma_2(\lambda))$ as a function of $\lambda$.
    explanation: |
      $f(\gamma_2(\lambda)) = 1 + 2\lambda$, with derivative $2$ everywhere, so $v_{\gamma_2,p}(f) = 2$. The same number as for $\gamma_1(\lambda) = (\lambda, 1)$ at $\lambda_0 = 1$: is that the same velocity?

  - type: mcq
    id: one-f-not-enough
    prompt: |
      On $\mathbb{R}^2$, the curves $\gamma_1(\lambda) = (\lambda, 1)$ (through $p = (1, 1)$ at $\lambda_0 = 1$) and $\gamma_2(\lambda) = (1, 2\lambda)$ (through $p$ at $\lambda_0 = \tfrac12$) both give $v_{\gamma,p}(f) = 2$ for $f(q) = q_1^2 + q_2$. Are $v_{\gamma_1,p}$ and $v_{\gamma_2,p}$ the same velocity?
    options:
      - text: 'No: for $g(q) = q_2$ they give $0$ and $2$'
        correct: true
      - text: 'Yes: they agree on the field $f$'
        feedback: |
          A velocity is a map on **all** scalar fields; agreeing on one field is like two vectors having the same dot product with one fixed vector. Try $g(q) = q_2$: $g(\gamma_1(\lambda)) = 1$ has derivative $0$, while $g(\gamma_2(\lambda)) = 2\lambda$ has derivative $2$.
      - text: 'The question makes no sense: the curves pass through $p$ at different parameters'
        feedback: |
          The parameter $\lambda_0$ is just where each curve happens to be at $p$; each velocity is a derivative at its own $\lambda_0$. Both are maps $C^\infty(\mathbb{R}^2)\to\mathbb{R}$, so they can be compared field by field.
    explanation: |
      Equality of velocities means equality on every $f$. One field can coincide by accident: $\gamma_1$ moves right at rate $1$ and $\gamma_2$ up at rate $2$, and $f = q_1^2 + q_2$ happens to grow at rate $2$ in both directions at $p$.

  - type: widget
    id: plane-explore
    title: Same curve, same velocity?
    widget: curve-velocity
    config:
      p: [1, 1]
      f: x2y
      curves:
        - { v: [1, 0.5] }
        - { v: [1, 0.5], a: [0, -0.75] }
      presets:
        - label: Trap
          f: x
          curves:
            - { v: [1, 0] }
            - { v: [1, 2] }
    body: |
      Back in the plane, at $p = (1, 1)$. Here each curve passes through $p$ at $\lambda = 0$: $\gamma(\lambda) = p + \lambda v + \lambda^2 a$. That is no restriction: a curve through $p$ at $\lambda_0$ can be shifted to $\lambda\mapsto\gamma(\lambda + \lambda_0)$, which passes at $0$ with the same velocity. The blue handle sets $v$, the hollow handle bends the curve (sets $a$). The field buttons choose $f$; the second panel graphs $f(\gamma(\lambda))$ for both curves with their tangent lines at $\lambda = 0$.

      1. At the start the curves differ (one is bent). Compare their $(f\circ\gamma)'(0)$ for each field $x$, $y$, $x^2 + y$.
      2. Press **Trap** and read the badge with $f = x$. Then switch to $f = y$.
      3. Drag either blue handle until the badge says **Same velocity**. What must match?

  - type: mcq
    id: different-curves-same-v
    prompt: |
      On $\mathbb{R}^2$ take $p = (1, 1)$ and two curves through $p$ at $\lambda = 0$:
      $$\gamma_1(\lambda) = p + \lambda\,(1, \tfrac12),$$
      $$\gamma_2(\lambda) = p + \lambda\,(1, \tfrac12) + \lambda^2(0, -\tfrac34).$$
      Which is true?
    options:
      - text: 'The curves are different, but $v_{\gamma_1,p} = v_{\gamma_2,p}$'
        correct: true
      - text: 'Different curves always give different velocities'
        feedback: |
          The bend term $\lambda^2(0, -\tfrac34)$ has derivative $2\lambda(0, -\tfrac34)$, which vanishes at $\lambda = 0$. So for every $f$ the chain rule gives the same $(f\circ\gamma)'(0)$ for both curves. Many curves share one velocity.
      - text: 'They have the same velocity only for some fields $f$, so the velocities differ'
        feedback: |
          Agreement on one field would not be enough, true. But here the agreement holds for every $f$: $(f\circ\gamma)'(0)$ depends only on $p$ and the first-order term $(1, \tfrac12)$, which the two curves share.
    explanation: |
      Velocity forgets everything about a curve except its first-order behaviour at $p$. So the set of all velocities at $p$ (the tangent space, defined in Part 2) has each of its elements coming from infinitely many curves.

  - type: text
    id: wrap-up
    title: What you now own
    body: |
      **Next:** Curves and the Tangent Space · Part 2 computes the machine in $\mathbb{R}^d$ with the chain rule (only the components $v^i$ matter, and feeding in the coordinate functions reads them out), then defines the tangent space $T_p\mathcal{M}$ with its addition and scalar multiplication, settles the opening question on the circle (twice as fast is $2\odot_T v$), and reads the four-velocity of a worldline.
