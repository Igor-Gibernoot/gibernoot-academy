outroTitle: Chapter 4 in one picture
outro: |
  Read it top to bottom. A **smooth curve** and the **scalar fields** define the **velocity** $v_{\gamma,p}(f) := (f\circ\gamma)'(\lambda_0)$, a directional derivative with no arrow behind it. All velocities at $p$, added **field by field**, form the **tangent space** $T_p\mathcal{M}$. A **chart** gives the **chart-induced basis** $(\partial/\partial\mathscr{X}^i)_p$, so $\dim T_p\mathcal{M} = d$; two charts give **components** related by the **Jacobian**, contravariantly, while the basis changes covariantly.

  On the right, the **dual of** $T_p\mathcal{M}$ is the **cotangent space**; each field gives a **differential** $(df)_p(v) := v(f)$, and the differentials of the coordinates are the **dual basis**, with covariant components. **Einstein summation** writes both sets of laws with the up-down rule, and at the bottom **tensors** combine them: one Jacobian factor per index. The **running example** is where every one of these laws was checked with numbers.

  **Next: the Level Challenge.** Harder problems that combine the whole map: proving facts about velocities, bases and duals, and pushing the running example and new charts through the transformation laws of vectors, covectors and tensors.
