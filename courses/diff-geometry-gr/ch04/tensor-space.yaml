id: ch04-tensor-space
title: Tensor Spaces at a Point · Part 1
kind: concept
own: |
  Setting: $p$ is a point of a $d$-dimensional manifold $\mathcal{M}$; a chart $\mathscr{X}$ around $p$ gives the basis $(\partial x_i)_p := (\partial/\partial\mathscr{X}^i)_p$ of $T_p\mathcal{M}$ (velocities) and the dual basis $(dx^i)_p := (d\mathscr{X}^i)_p$ of $T_p^*\mathcal{M}$ (covectors), with $(dx^i)_p((\partial x_j)_p)=\delta^i_j$; sums over repeated indices are implied.
  - **$(r,s)$-tensor space** $T_p^{(r,s)}\mathcal{M}$: {{ multilinear maps with $r$ covector slots (first) and $s$ velocity slots }}, so a $(r,s)$-tensor eats $r$ covectors and $s$ velocities and returns a number. $(0,1)$: covectors; $(1,0)$: velocities; $(0,0)$: numbers; $(1,1)$: linear maps $T_p\mathcal{M}\to T_p\mathcal{M}$; $(0,2)$: bilinear forms, such as the metric (Level 7).
  - **Product of covectors** (slot order matters; the first factor eats the first slot):
  $$(\mathsf{X}\otimes\mathsf{Y})(u,w) := \mathsf{X}(u)\,\mathsf{Y}(w).$$
  - **Components** are values on basis elements, one upper index per covector slot and one lower per velocity slot:
  {{ $$(T_\mathcal{U})^{i_1\dots i_r}_{j_1\dots j_s} = T\big((dx^{i_1})_p,\dots,(\partial x_{j_s})_p\big),$$ }}
  and the tensor products of the chart bases form a basis:
  $$T = (T_\mathcal{U})^{i_1\dots i_r}_{j_1\dots j_s}\,(\partial x_{i_1})_p\otimes\cdots\otimes(dx^{j_s})_p.$$
  - **Dimension:** each of the $r+s$ indices runs over $d$ values,
  {{ $$\dim T_p^{(r,s)}\mathcal{M} = d^{\,r+s}.$$ }}
  For example, $T=(T_\mathcal{U})_{ij}(dx^i)_p\otimes(dx^j)_p$ for a $(0,2)$-tensor and $T=(T_\mathcal{U})^i_j(\partial x_i)_p\otimes(dx^j)_p$ for a $(1,1)$-tensor.

cards:
  - type: text
    id: hook
    title: A machine that eats two velocities
    body: |
      In Level 7 we will meet the **metric**, the object that measures lengths and angles in spacetime. At a point $p$ it takes **two** velocities $u, w\in T_p\mathcal{M}$ and returns one number, and it is linear in each of them separately (double $u$ and the output doubles, add two velocities in the second slot and the outputs add).

      Recall: $T_p\mathcal{M}$ is the tangent space at $p$ (velocities of curves through $p$), of dimension $d$, and a chart $(\mathcal{U}, \mathscr{X})$ around $p$ gives it the basis $(\partial x_i)_p := (\partial/\partial\mathscr{X}^i)_p$.

      Before any theory: how much information is stored in such a machine? How many numbers do you need to know it completely, on spacetime ($d = 4$)?

  - type: numeric
    id: predict-count
    title: Predict first
    prompt: |
      A map $g\colon T_p\mathcal{M}\times T_p\mathcal{M}\to\mathbb{R}$ is **bilinear**: linear in the first velocity with the second held fixed, and linear in the second with the first held fixed. Here $\dim T_p\mathcal{M} = 4$. How many numbers are needed, in general, to know $g$ on every pair of velocities?
    answer: 16
    wrong:
      - { value: 8, feedback: 'That is $4 + 4$, as if each slot carried its own list of four numbers. But the output depends on the **pair** of inputs: the value on each pair of basis vectors $g((\partial x_i)_p, (\partial x_j)_p)$ is free, and there are $4\times 4$ such pairs.' }
      - { value: 10, feedback: 'That is the count for a **symmetric** map, $g(u, w) = g(w, u)$, where the value on $(\partial x_1)_p, (\partial x_2)_p$ equals the value on $(\partial x_2)_p, (\partial x_1)_p$. The metric will be symmetric, but a general bilinear map need not be, so each ordered pair counts: $4\times 4$.' }
      - { value: 4, feedback: 'Four numbers describe a single covector, which eats **one** velocity. With two slots, every ordered pair of basis vectors gives an independent value: $4\times 4$.' }
    hint: 'Expand $u = u^i(\partial x_i)_p$ and $w = w^j(\partial x_j)_p$ (Einstein summation) and use bilinearity: which numbers remain?'
    explanation: |
      By bilinearity,
      $$g(u, w) = u^i\,w^j\,g\big((\partial x_i)_p, (\partial x_j)_p\big),$$
      so $g$ is fixed by its values on the $4\times 4 = 16$ ordered pairs of basis vectors. These are its **components**. This lesson builds the space such machines live in.

  - type: text
    id: recall-ch2
    title: Recall tensors on a vector space
    body: |
      Recall from Chapter 2: for a real vector space $V$ of dimension $d$ with dual $V^*$ (its covectors, linear maps $V\to\mathbb{R}$), an **$(r,s)$-tensor** is a map
      $$T\colon\underbrace{V^*\times\cdots\times V^*}_{r}\times\underbrace{V\times\cdots\times V}_{s}\to\mathbb{R}$$
      that is **multilinear**: linear in each of its $r+s$ slots separately, with the others held fixed. The $r$ covector slots come **first**, then the $s$ vector slots. The symbol $\times$ is the Cartesian product: an input is a list of $r$ covectors and $s$ vectors.

      At a point $p$ of a manifold we already have a vector space and its dual: $V = T_p\mathcal{M}$ and $V^* = T_p^*\mathcal{M}$, the cotangent space. So nothing new has to be invented.

  - type: text
    id: definition
    title: The tensor space at p
    body: |
      For a $d$-dimensional manifold $\mathcal{M}$ and a point $p\in\mathcal{M}$, the **$(r,s)$-tensor space at $p$**, written $T_p^{(r,s)}\mathcal{M}$, is the set of multilinear maps
      $$T\colon\underbrace{T_p^*\mathcal{M}\times\cdots}_{r}\times\underbrace{T_p\mathcal{M}\times\cdots}_{s}\to\mathbb{R},$$
      $$\big(\mathsf{X}^{(1)},\dots,\mathsf{X}^{(r)},\mathcal{X}_{(1)},\dots,\mathcal{X}_{(s)}\big)\mapsto T(\dots).$$
      The labels in parentheses, $\mathsf{X}^{(1)}$ or $\mathcal{X}_{(2)}$, only say **which slot** an input fills; they are not coordinate indices.

      Adding two such maps, or scaling one by a number, value by value, gives again a multilinear map, so $T_p^{(r,s)}\mathcal{M}$ is a real vector space. The metric of Level 7 is an element of $T_p^{(0,2)}\mathcal{M}$.

  - type: mcq
    id: type-of-machine
    title: Reading the type
    prompt: |
      An $(r,s)$-tensor at $p$ has $r$ slots for covectors in $T_p^*\mathcal{M}$ (listed first) and $s$ slots for velocities in $T_p\mathcal{M}$. A machine $R(\mathsf{X}, u, w, z)$ eats one covector $\mathsf{X}$ and three velocities $u, w, z$ at $p$, and is linear in each slot. To which space does $R$ belong?
    options:
      - text: '$T_p^{(1,3)}\mathcal{M}$'
        correct: true
      - text: '$T_p^{(3,1)}\mathcal{M}$'
        feedback: |
          The first number counts the **covector** slots, the second the **velocity** slots. $R$ has one covector slot and three velocity slots. The habit of reading "(inputs, outputs)" or "(vectors, covectors)" is what makes this swap tempting.
      - text: '$T_p^{(0,4)}\mathcal{M}$'
        feedback: |
          Four slots in total, but they are not all of the same kind: the slot for $\mathsf{X}$ takes covectors, elements of $T_p^*\mathcal{M}$, not velocities. Each covector slot counts in $r$.
    explanation: |
      One covector slot, three velocity slots: type $(1,3)$. The Riemann curvature of Level 6 has exactly this type.

  - type: mcq
    id: special-cases
    title: Old friends as tensors
    prompt: |
      $T_p^{(r,s)}\mathcal{M}$ is the space of multilinear maps with $r$ covector slots ($T_p^*\mathcal{M}$) followed by $s$ velocity slots ($T_p\mathcal{M}$). Which identifications are correct? Select all that apply.
    multiple: true
    options:
      - text: '$T_p^{(0,1)}\mathcal{M} = T_p^*\mathcal{M}$: one velocity slot, linear, so a covector'
        correct: true
      - text: '$T_p^{(1,0)}\mathcal{M}$ is identified with $T_p\mathcal{M}$: a velocity $v$ acts on covectors by $\mathsf{X}\mapsto\mathsf{X}(v)$'
        correct: true
      - text: '$T_p^{(0,0)}\mathcal{M}$ is $\mathbb{R}$: no slots, just a number'
        correct: true
      - text: '$T_p^{(1,0)}\mathcal{M} = T_p^*\mathcal{M}$, since a $(1,0)$-tensor has one slot'
        feedback: |
          One slot, but a **covector** slot: a $(1,0)$-tensor eats covectors. A covector eats velocities, so it is a $(0,1)$-tensor. Counting slots without asking what they eat is the whole trap.
    explanation: |
      $(0,1)$: covectors. $(1,0)$: velocities, through $v\mapsto(\mathsf{X}\mapsto\mathsf{X}(v))$; this identification of $T_p\mathcal{M}$ with the dual of $T_p^*\mathcal{M}$ is a bijection because the dimension is finite (Chapter 2). $(0,0)$: numbers. We will also see that $(1,1)$-tensors are linear maps $T_p\mathcal{M}\to T_p\mathcal{M}$ and $(0,2)$-tensors are bilinear forms, like the metric.

  - type: widget
    id: explore
    title: A (0,2)-tensor at work
    widget: machine-playground
    config:
      slots: 2
      name: T
      tensor: [[1, -1], [-1, 1]]
      partial: true
      u: [2, 1]
      v: [1, 2]
      snap: 0.5
      presets:
        - { label: 'Both on the kernel line', u: [1, 1], v: [2, 2] }
        - { label: 'Signed area', tensor: [[0, 1], [-1, 0]] }
    body: |
      The running example: on the plane, $f(q) = q_1^2 + q_2$ at $p = (1,1)$, with the chart $\mathscr{X}(q) = (2q_1, -q_2)$. Recall that its differential has components $(1, -1)$ in this chart, $(df)_p = (dx^1)_p - (dx^2)_p$. The machine is
      $$T(\mathcal{X}, \mathcal{Y}) := (df)_p(\mathcal{X})\cdot(df)_p(\mathcal{Y}),$$
      with the two velocities $\mathcal{X}, \mathcal{Y}$ drawn by their $\mathscr{X}$-components $x^i$, $y^i$. The orange level lines are the covector $T(\mathcal{X}, \cdot\,)$ you get by filling only the first slot; the readout writes the dual basis with Chapter 2's symbols $\hat{\mathfrak{x}}^i$, here standing for $(dx^i)_p$.

      1. Drag $\mathcal{X}$ around: do the orange lines ever turn, or do they only get denser or flip?
      2. Press **Both on the kernel line**. Then **Signed area** shows a $(0,2)$-tensor that is not a product; **Reset** returns.

  - type: mcq
    id: widget-zero
    title: When does T give zero?
    review: false
    prompt: |
      In the widget, $T(\mathcal{X}, \mathcal{Y}) = (df)_p(\mathcal{X})\cdot(df)_p(\mathcal{Y})$ with $(df)_p = (dx^1)_p - (dx^2)_p$. For which inputs is $T(\mathcal{X}, \mathcal{Y}) = 0$?
    options:
      - text: 'Exactly when at least one of the two velocities has $x^1 = x^2$, i.e. lies in the kernel of $(df)_p$'
        correct: true
      - text: 'Only when $\mathcal{X}$ and $\mathcal{Y}$ are parallel'
        feedback: |
          That is the zero set of the **signed area** preset, a different $(0,2)$-tensor. For the product machine, parallel inputs such as $\mathcal{X} = \mathcal{Y}$ with components $(2, 1)$ give $(df)_p(\mathcal{X})^2 = 1 \neq 0$.
      - text: 'Only when one of the inputs is the zero velocity'
        feedback: |
          The zero velocity does give $0$, but so does any non-zero velocity with $(df)_p(\mathcal{X}) = x^1 - x^2 = 0$, for example components $(1, 1)$: a product vanishes as soon as one factor does.
    explanation: |
      A product of two numbers vanishes when one factor does. So $T(\mathcal{X}, \mathcal{Y}) = 0$ when $x^1 = x^2$ or $y^1 = y^2$. That is also why the orange lines of $T(\mathcal{X}, \cdot\,)$ never turn: they are always the lines of $(df)_p$, scaled by the number $(df)_p(\mathcal{X})$.

  - type: text
    id: tensor-product
    title: Multiplying covectors and vectors
    body: |
      The widget's machine is a **tensor product**. Recall from Chapter 2: for covectors $\mathsf{X}, \mathsf{Y}\in T_p^*\mathcal{M}$,
      $$(\mathsf{X}\otimes\mathsf{Y})(u, w) := \mathsf{X}(u)\cdot\mathsf{Y}(w),$$
      a $(0,2)$-tensor: the **first** factor eats the **first** slot. For a velocity $v$ and a covector $\mathsf{Y}$,
      $$(v\otimes\mathsf{Y})(\mathsf{X}, w) := \mathsf{X}(v)\cdot\mathsf{Y}(w),$$
      a $(1,1)$-tensor (velocity factors first, matching the slot order). Products of more factors work the same way, one factor per slot.

      The most important products use the chart's bases: $(\partial x_i)_p$ of $T_p\mathcal{M}$ and its dual $(dx^i)_p := (d\mathscr{X}^i)_p$ of $T_p^*\mathcal{M}$, with $(dx^i)_p\big((\partial x_j)_p\big) = \delta^i_j$. For a velocity $u = u^i(\partial x_i)_p$, recall $(dx^i)_p(u) = u^i$.

  - type: numeric
    id: product-value
    title: Evaluate a product
    prompt: |
      A chart $\mathscr{X}$ around $p$ on a 2-dimensional manifold gives the dual basis $(dx^i)_p$, which reads components: $(dx^i)_p(u) = u^i$. The product of covectors acts by $(\mathsf{X}\otimes\mathsf{Y})(u, w) := \mathsf{X}(u)\cdot\mathsf{Y}(w)$. Take velocities with components $u = (3, 1)$ and $w = (2, 5)$. What is
      $$\big((dx^1)_p\otimes(dx^2)_p\big)(u, w)\,?$$
    answer: 15
    wrong:
      - { value: 2, feedback: 'That is $u^2 w^1 = 1\cdot 2$, the value of $(dx^2)_p\otimes(dx^1)_p$. The first factor eats the first slot: $(dx^1)_p(u) = u^1 = 3$, then $(dx^2)_p(w) = w^2 = 5$.' }
      - { value: 6, feedback: 'That is $u^1 w^1$: both factors read the first component. The second factor is $(dx^2)_p$, which reads the **second** component of $w$.' }
      - { value: 11, feedback: 'The product multiplies one number from each slot; it does not add the pairings. $u^1\cdot w^2 = 3\cdot 5$.' }
    explanation: |
      $(dx^1)_p(u)\cdot(dx^2)_p(w) = u^1\,w^2 = 3\cdot 5 = 15$.

  - type: text
    id: components-02
    title: Components of a (0,2)-tensor
    body: |
      Take any $T\in T_p^{(0,2)}\mathcal{M}$. Its **components** in the chart $(\mathcal{U}, \mathscr{X})$ are its values on pairs of basis vectors:
      $$(T_\mathcal{U})_{ij} := T\big((\partial x_i)_p, (\partial x_j)_p\big).$$
      The label $\mathcal{U}$ records the chart; it is not an index. As in the hook, bilinearity gives, for $u = u^i(\partial x_i)_p$ and $w = w^j(\partial x_j)_p$,
      $$T(u, w) = (T_\mathcal{U})_{ij}\,u^i w^j.$$
      Now use the product: $u^i w^j = \big((dx^i)_p\otimes(dx^j)_p\big)(u, w)$. So $T$ and a certain combination of the products $(dx^i)_p\otimes(dx^j)_p$ give the same number on **every** pair $(u, w)$. Build that combination.

  - type: build
    id: build-02
    title: Expand a (0,2)-tensor
    prompt: |
      A $(0,2)$-tensor $T$ at $p$ satisfies $T(u, w) = (T_\mathcal{U})_{ij}\,u^iw^j$ for all velocities, where $(T_\mathcal{U})_{ij} := T((\partial x_i)_p, (\partial x_j)_p)$ and $u^i w^j = ((dx^i)_p\otimes(dx^j)_p)(u, w)$. Write $T$ in the product basis (Einstein summation).
    prefix: 'T ='
    tiles: ['(T_\mathcal{U})_{ij}', '(dx^i)_p', '\otimes', '(dx^j)_p', '(T_\mathcal{U})^{ij}', '(\partial x_i)_p']
    answers:
      - ['(T_\mathcal{U})_{ij}', '(dx^i)_p', '\otimes', '(dx^j)_p']
      - ['(dx^i)_p', '\otimes', '(dx^j)_p', '(T_\mathcal{U})_{ij}']
    wrong:
      - { answer: ['(T_\mathcal{U})_{ij}', '(dx^j)_p', '\otimes', '(dx^i)_p'], feedback: 'Slot order: this product sends $(u, w)$ to $u^jw^i$, so the sum gives $(T_\mathcal{U})_{ij}w^iu^j = T(w, u)$, the tensor with its slots swapped. The first factor must carry the index of the first slot, $i$.' }
      - { answer: ['(T_\mathcal{U})^{ij}', '(dx^i)_p', '\otimes', '(dx^j)_p'], feedback: 'Components of a tensor with two **velocity** slots carry **lower** indices; and with $i, j$ up in both the component and the dual basis, Einstein summation would not apply (an index is summed only once up and once down).' }
    hint: 'Each term needs one component and two covectors; the index of the first slot goes on the first factor.'
    explanation: |
      $$T = (T_\mathcal{U})_{ij}\,(dx^i)_p\otimes(dx^j)_p .$$
      Both sides give $(T_\mathcal{U})_{ij}u^iw^j$ on every pair $(u, w)$, so they are the same map.

  - type: order
    id: basis-proof
    title: Why the products form a basis
    prompt: |
      Prove that the $d^2$ products $(dx^k)_p\otimes(dx^l)_p$ are linearly independent in $T_p^{(0,2)}\mathcal{M}$, where $(dx^k)_p((\partial x_i)_p) = \delta^k_i$. Put the steps in order.
    steps:
      - 'Suppose $a_{kl}\,(dx^k)_p\otimes(dx^l)_p = 0$, the zero map, for some numbers $a_{kl}$.'
      - 'Feed it the pair $\big((\partial x_i)_p, (\partial x_j)_p\big)$, for fixed $i, j$: the zero map gives $0$.'
      - 'Each product gives $(dx^k)_p((\partial x_i)_p)\cdot(dx^l)_p((\partial x_j)_p) = \delta^k_i\,\delta^l_j$.'
      - 'The sum collapses: $a_{kl}\,\delta^k_i\delta^l_j = a_{ij}$, so $a_{ij} = 0$.'
      - 'This holds for every $i, j$: all coefficients vanish, so the products are independent.'
    hint: 'Start from a vanishing combination and test it on basis vectors, as for the dual basis.'
    explanation: |
      Independent, and they span (the expansion of any $T$), so they form a basis: $\dim T_p^{(0,2)}\mathcal{M} = d^2$, which for $d = 4$ is the $16$ of the hook.

  - type: text
    id: general-components
    title: Any type (r, s)
    body: |
      Nothing used that there were two slots of the same kind. For $T\in T_p^{(r,s)}\mathcal{M}$, the components in the chart $(\mathcal{U}, \mathscr{X})$ are its values on basis elements: dual basis covectors in the covector slots, basis vectors in the velocity slots,
      $$(T_\mathcal{U})^{i_1\dots i_r}_{j_1\dots j_s} := T\big((dx^{i_1})_p,\dots,(\partial x_{j_s})_p\big).$$
      Each covector slot gives an **upper** index, each velocity slot a **lower** one. The expansion is
      $$T = (T_\mathcal{U})^{i_1\dots}_{j_1\dots}\,(\partial x_{i_1})_p\otimes\cdots\otimes(dx^{j_s})_p,$$
      with $r$ factors $(\partial x_i)_p$ first, then $s$ factors $(dx^j)_p$, and the products form a basis. Each of the $r+s$ indices runs over $d$ values independently, so
      $$\dim T_p^{(r,s)}\mathcal{M} = d^{\,r+s}.$$
      Equivalently, $T_p^{(r,s)}\mathcal{M}$ can be defined as the tensor product $T_p\mathcal{M}\otimes\cdots\otimes T_p^*\mathcal{M}$ ($r$ factors $T_p\mathcal{M}$, then $s$ factors $T_p^*\mathcal{M}$), as in Chapter 2.

  - type: build
    id: build-11
    title: Expand a (1,1)-tensor
    prompt: |
      A $(1,1)$-tensor $T$ at $p$ has one covector slot, then one velocity slot. Its components in the chart $\mathscr{X}$ are $(T_\mathcal{U})^i_j := T((dx^i)_p, (\partial x_j)_p)$, and products of a velocity and a covector act by $(v\otimes\mathsf{Y})(\mathsf{X}, w) := \mathsf{X}(v)\,\mathsf{Y}(w)$. Write $T$ in the product basis (Einstein summation).
    prefix: 'T ='
    tiles: ['(T_\mathcal{U})^i_j', '(\partial x_i)_p', '\otimes', '(dx^j)_p', '(dx^i)_p', '(\partial x_j)_p']
    answers:
      - ['(T_\mathcal{U})^i_j', '(\partial x_i)_p', '\otimes', '(dx^j)_p']
      - ['(\partial x_i)_p', '\otimes', '(dx^j)_p', '(T_\mathcal{U})^i_j']
    wrong:
      - { answer: ['(T_\mathcal{U})^i_j', '(dx^j)_p', '\otimes', '(\partial x_i)_p'], feedback: 'Right factors, wrong order. The first slot of $T$ eats covectors, and a covector is fed to the **velocity** factor: $\mathsf{X}((\partial x_i)_p)$. So the velocity factor comes first, matching the slot order.' }
      - { answer: ['(T_\mathcal{U})^i_j', '(dx^i)_p', '\otimes', '(\partial x_j)_p'], feedback: 'Then the index $i$ would sit up twice and $j$ down twice in the term, which Einstein summation does not allow. The covector slot is filled by $(dx^i)_p$, and the factor that responds to it is the velocity $(\partial x_i)_p$.' }
    hint: 'Feed $((dx^k)_p, (\partial x_l)_p)$ to your answer: it must return $(T_\mathcal{U})^k_l$.'
    explanation: |
      $$T = (T_\mathcal{U})^i_j\,(\partial x_i)_p\otimes(dx^j)_p .$$
      Check: on $((dx^k)_p, (\partial x_l)_p)$ each product gives $\delta^k_i\,\delta^j_l$, leaving $(T_\mathcal{U})^k_l$.

  - type: mcq
    id: component-reading
    title: Which number is which
    prompt: |
      A $(1,2)$-tensor $T$ at $p$ has components $(T_\mathcal{U})^i_{jk} := T\big((dx^i)_p, (\partial x_j)_p, (\partial x_k)_p\big)$ in the chart $\mathscr{X}$. Which number is $(T_\mathcal{U})^2_{13}$?
    options:
      - text: '$T\big((dx^2)_p, (\partial x_1)_p, (\partial x_3)_p\big)$'
        correct: true
      - text: '$T\big((dx^1)_p, (\partial x_2)_p, (\partial x_3)_p\big)$'
        feedback: |
          The upper index belongs to the covector slot, which is filled by $(dx^{\text{upper}})_p$: here $(dx^2)_p$. The lower indices, in order, label the velocities $(\partial x_1)_p$ and $(\partial x_3)_p$.
      - text: '$T\big((dx^2)_p, (\partial x_3)_p, (\partial x_1)_p\big)$'
        feedback: |
          That is $(T_\mathcal{U})^2_{31}$. The lower indices are read left to right as the velocity slots: first $1$, then $3$. Swapping them is a different number unless $T$ happens to be symmetric in those slots.
    explanation: |
      Upper index into the covector slot, lower indices in order into the velocity slots.

  - type: mcq
    id: one-one-as-map
    title: A (1,1)-tensor is a linear map
    prompt: |
      A $(1,1)$-tensor $T$ at $p$ eats a covector and a velocity. Filling only the velocity slot with $w$ leaves the map $\mathsf{X}\mapsto T(\mathsf{X}, w)$, linear in the covector. What kind of object is it, and what is $w\mapsto T(\cdot\,, w)$?
    options:
      - text: 'A $(1,0)$-tensor, i.e. a velocity; so $T$ gives a linear map $T_p\mathcal{M}\to T_p\mathcal{M}$'
        correct: true
      - text: 'A covector; so $T$ gives a linear map $T_p\mathcal{M}\to T_p^*\mathcal{M}$'
        feedback: |
          That happens when you fill one slot of a $(0,2)$-tensor (the widget's orange lines). Here the remaining slot eats **covectors**, so what is left is a $(1,0)$-tensor, which is identified with a velocity.
      - text: 'A number; filling one slot always gives a number'
        feedback: |
          A number appears only when **every** slot is filled. One slot of $T$ is still empty, waiting for a covector.
    explanation: |
      $T(\cdot\,, w)$ eats covectors linearly, so it is a $(1,0)$-tensor, identified with a velocity. Its components are $(dx^i)_p\mapsto(T_\mathcal{U})^i_j\,w^j$: the matrix $(T_\mathcal{U})^i_j$ (row $i$, column $j$) acting on the column $w^j$.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Next: "Tensor Spaces at a Point · Part 2".** Components depend on the chart. How do they change when we pass to another chart $\mathscr{Y}$? One Jacobian per index, derived by feeding basis elements and by re-expanding, then a numeric check on a running example.
