id: ch04-cotangent-basis-2
title: Differentials as a Basis · Part 2
kind: concept
own: |
  - **Setting:** two charts $\mathscr{X}$, $\mathscr{Y}$ around $p$ in a $d$-dimensional manifold $\mathcal{M}$, with dual chart-induced bases $(d\mathscr{X}^i)_p$, $(d\mathscr{Y}^i)_p$ of $T_p^*\mathcal{M}$ (the space of linear maps $T_p\mathcal{M}\to\mathbb{R}$); a covector $\mathsf{X}_p$ has components $\mathtt{x}^p_j := \mathsf{X}_p((\partial/\partial\mathscr{X}^j)_p)$ and $\mathtt{y}^p_i := \mathsf{X}_p((\partial/\partial\mathscr{Y}^i)_p)$, a velocity $v$ has components $v^j$ and $\tilde v^i$ in the two charts, and repeated indices are summed over $1,\dots,d$.
  - Laws: $(d\mathscr{Y}^i)_p = (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p(d\mathscr{X}^j)_p$ (**contravariant**: row $i$ of the Jacobian, like velocity components), {{ $\mathtt{y}^p_i = (\partial\mathscr{X}^j/\partial\mathscr{Y}^i)_p\,\mathtt{x}^p_j$ }} (**covariant**: the inverse Jacobian, like the basis vectors).
  - Chart-free pairing: {{ $\mathtt{y}^p_i\tilde v^i = \mathtt{x}^p_jv^j$ }}, because the two Jacobians are inverse matrices, $(\partial\mathscr{X}^j/\partial\mathscr{Y}^i)_p(\partial\mathscr{Y}^i/\partial\mathscr{X}^k)_p = \delta^j_k$.
  - Running example: on $\mathbb{R}^2$ with $\mathscr{X}(q) := (2q_1,-q_2)$, $\mathscr{Y}(q) := (q_1,q_2e^{q_1})$, $p := (1,1)$, the Jacobian $(\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p$ is the matrix with rows $(1/2,0)$ and $(e/2,-e)$, so {{ $(d\mathscr{Y}^2)_p = \tfrac e2(d\mathscr{X}^1)_p - e\,(d\mathscr{X}^2)_p$ }}.
  - Every covector is {{ some $(df)_p$ }} (use a bump function: a smooth field equal to a given linear function near $p$ and $0$ far away). Shorthand: $(dx^i)_p := (d\mathscr{X}^i)_p$ and $(dy^i)_p := (d\mathscr{Y}^i)_p$.

cards:
  - type: text
    id: recall-dual
    title: "Recall: the dual basis of a chart"
    body: |
      A chart $(\mathcal{U}, \mathscr{X})$ around $p$ in a $d$-dimensional manifold $\mathcal{M}$ gives the basis $(\partial/\partial\mathscr{X}^j)_p$ of the velocities $T_p\mathcal{M}$, defined by $(\partial/\partial\mathscr{X}^j)_p(f) := \partial_j[f\circ\mathscr{X}^{-1}](\mathscr{X}(p))$. The differentials of its coordinate functions, $(d\mathscr{X}^i)_p(v) := v(\mathscr{X}^i)$, form the **dual chart-induced basis** of the covectors $T_p^*\mathcal{M}$ (linear maps $T_p\mathcal{M}\to\mathbb{R}$):
      $$(d\mathscr{X}^i)_p\Big(\Big(\tfrac{\partial}{\partial\mathscr{X}^j}\Big)_p\Big) = \delta^i_j.$$
      A covector $\mathsf{X}_p$ has **components** $\mathtt{x}^p_i := \mathsf{X}_p((\partial/\partial\mathscr{X}^i)_p)$, so that (Einstein summation)
      $$\mathsf{X}_p = \mathtt{x}^p_i\,(d\mathscr{X}^i)_p,\qquad \mathsf{X}_p(v) = \mathtt{x}^p_i\,v^i,$$
      where $v^i = (d\mathscr{X}^i)_p(v)$ are the components of a velocity $v$. This holds for every chart, and for a field $f$ the components of $(df)_p$ are $\partial_i[f\circ\mathscr{X}^{-1}](\mathscr{X}(p))$. These are the facts of the lesson Differentials as a Basis · Part 1.

  - type: text
    id: recall-example
    title: "Recall: the running example"
    body: |
      On $\mathbb{R}^2$ (points $q = (q_1,q_2)$) take the charts $\mathscr{X}(q) = (2q_1,-q_2)$ and $\mathscr{Y}(q) = (q_1,q_2e^{q_1})$, the field $f(q) = q_1^2+q_2$ and the point $p = (1,1)$. The covector $(df)_p$ has components $(1,-1)$ in $\mathscr{X}$ and $(1,1/e)$ in $\mathscr{Y}$: different lists of numbers. The velocity with standard components $(1,2)$ has components $(2,-2)$ in $\mathscr{X}$ and $(1,3e)$ in $\mathscr{Y}$, and in both charts the pairing is $\mathtt{x}^p_iv^i = \mathtt{y}^p_i\tilde v^i = 4$. This lesson explains how the components of covectors change between charts, and why the number $4$ cannot depend on the chart.
  - type: widget
    id: explore-xy
    title: Two charts, two dual bases
    widget: chart-basis
    config:
      charts: [X, Y]
      p: [1, 1]
      v: [1, 2]
      chain: true
      dragP: false
    body: |
      Now both charts of the running example at $p = (1, 1)$: $\mathscr{X}(q) = (2q_1, -q_2)$ (solid lines) and $\mathscr{Y}(q) = (q_1, q_2e^{q_1})$ (dashed). The blue readouts of each chart are the values of its dual basis on $v$:
      $$(d\mathscr{X}^i)_p(v) = (2, -2),$$
      $$(d\mathscr{Y}^i)_p(v) = (1, 3e).$$
      The readout also shows the Jacobian $(\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p$ (row $i$, column $j$) and the law "components in $\mathscr{Y}$ = Jacobian $\cdot$ components in $\mathscr{X}$". Drag $v$: that law holds for **every** $v$. Read it as a statement about covectors.

  - type: text
    id: basis-law
    title: How the dual basis changes
    body: |
      Recall the component law for velocities, for two charts $(\mathcal{U},\mathscr{X})$ and $(\mathcal{V},\mathscr{Y})$ with $p\in\mathcal{U}\cap\mathcal{V}$:
      $$\dot\gamma^i_\mathcal{V}(\lambda_0) = \Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p\dot\gamma^j_\mathcal{U}(\lambda_0).$$
      Here $\dot\gamma^i_\mathcal{U}(\lambda_0)$ and $\dot\gamma^i_\mathcal{V}(\lambda_0)$ are the components of $v = v_{\gamma,p}$ in each chart. But a component is a dual basis covector at work: $\dot\gamma^i_\mathcal{V}(\lambda_0) = (d\mathscr{Y}^i)_p(v)$ and $\dot\gamma^j_\mathcal{U}(\lambda_0) = (d\mathscr{X}^j)_p(v)$. So for every $v$,
      $$(d\mathscr{Y}^i)_p(v) = \Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p(d\mathscr{X}^j)_p(v).$$
      Two covectors that agree on every velocity are equal.

  - type: build
    id: build-basis-law
    title: The basis law
    prompt: |
      For two charts $(\mathcal{U},\mathscr{X})$ and $(\mathcal{V},\mathscr{Y})$ around $p$, the components of every velocity obey $\dot\gamma^i_\mathcal{V}(\lambda_0) = (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p\,\dot\gamma^j_\mathcal{U}(\lambda_0)$, and $(d\mathscr{Y}^i)_p$, $(d\mathscr{X}^j)_p$ read those components. Write $(d\mathscr{Y}^i)_p$ in the basis $(d\mathscr{X}^j)_p$ (Einstein summation).
    prefix: '(d\mathscr{Y}^i)_p ='
    tiles: ['\Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p', '\Big(\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^i}\Big)_p', '(d\mathscr{X}^j)_p', '\big(\tfrac{\partial}{\partial\mathscr{X}^j}\big)_p']
    answers:
      - ['\Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p', '(d\mathscr{X}^j)_p']
      - ['(d\mathscr{X}^j)_p', '\Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p']
    wrong:
      - answer: ['\Big(\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^i}\Big)_p', '(d\mathscr{X}^j)_p']
        feedback: 'That is the inverse Jacobian, which converts the basis **vectors** $(\partial/\partial\mathscr{Y}^i)_p$. Its free $i$ sits in a denominator, so it counts as lower, while the left side has $i$ up: the heights do not match.'
      - answer: ['\Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p', '\big(\tfrac{\partial}{\partial\mathscr{X}^j}\big)_p']
        feedback: 'That is a combination of basis vectors, an element of $T_p\mathcal{M}$; the left side is a covector. Also both $j$ are lower (denominators), so no sum is allowed.'
    hint: 'Read the component law of velocities with $(d\mathscr{Y}^i)_p(v)$ on the left and $(d\mathscr{X}^j)_p(v)$ on the right, then drop the $v$.'
    explanation: |
      $(d\mathscr{Y}^i)_p = (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p\,(d\mathscr{X}^j)_p$: row $i$ of the Jacobian, exactly like vector components. So the dual basis covectors are **contravariant**, while the basis vectors $(\partial/\partial\mathscr{X}^i)_p$ (column $i$) are covariant. Swapping the roles of the charts gives $(d\mathscr{X}^i)_p = (\partial\mathscr{X}^i/\partial\mathscr{Y}^j)_p\,(d\mathscr{Y}^j)_p$.

  - type: numeric
    id: c3-basis-law
    title: The basis law in numbers
    prompt: |
      On $\mathbb{R}^2$ at $p = (1, 1)$ take the charts $\mathscr{X}(q) = (2q_1, -q_2)$ and $\mathscr{Y}(q) = (q_1, q_2e^{q_1})$, with Jacobian (row $i$, column $j$)
      $$\Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p = \begin{pmatrix} 1/2 & 0\\ e/2 & -e\end{pmatrix}.$$
      In $(d\mathscr{Y}^2)_p = c_1\,(d\mathscr{X}^1)_p + c_2\,(d\mathscr{X}^2)_p$, what is $c_2$?
    answer: -2.71828
    tolerance: 0.001
    answerText: '-e ≈ -2.718'
    wrong:
      - { value: 0, feedback: 'That is the entry in row 1, column 2. The covector $(d\mathscr{Y}^2)_p$ uses row $2$: $(\partial\mathscr{Y}^2/\partial\mathscr{X}^j)_p$, and $c_2$ is its column-2 entry.' }
      - { value: 1.35914, feedback: 'That is $e/2$, the coefficient $c_1$ of $(d\mathscr{X}^1)_p$ (row 2, column 1). $c_2$ is the row-2, column-2 entry.' }
    hint: '$(d\mathscr{Y}^2)_p = (\partial\mathscr{Y}^2/\partial\mathscr{X}^j)_p\,(d\mathscr{X}^j)_p$: read row $2$.'
    explanation: |
      $c_2 = -e$, so {{ $(d\mathscr{Y}^2)_p = \tfrac e2(d\mathscr{X}^1)_p - e\,(d\mathscr{X}^2)_p$ }}. Check directly: on the overlap $\mathscr{Y}^2 = q_2e^{q_1} = -\mathscr{X}^2e^{\mathscr{X}^1/2}$, whose derivative in $\mathscr{X}^2$ at $\mathscr{X}(p) = (2,-1)$ is $-e$. Also check: $(df)_p = (d\mathscr{Y}^1)_p + \tfrac1e(d\mathscr{Y}^2)_p = \tfrac12(d\mathscr{X}^1)_p + \tfrac12(d\mathscr{X}^1)_p - (d\mathscr{X}^2)_p$, as found in the chart $\mathscr{X}$.

  - type: mcq
    id: which-jacobian
    title: Which matrix?
    prompt: |
      For two charts $(\mathcal{U},\mathscr{X})$ and $(\mathcal{V},\mathscr{Y})$ around $p$, a covector $\mathsf{X}_p$ has components $\mathtt{x}^p_j$ in $\mathscr{X}$ and $\mathtt{y}^p_i$ in $\mathscr{Y}$ (values on each chart's basis vectors). Velocity components obey $\dot\gamma^i_\mathcal{V} = (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p\,\dot\gamma^j_\mathcal{U}$. Before deriving it, predict from the index heights: which is the law for the covector components?
    options:
      - text: '$\mathtt{y}^p_i = (\partial\mathscr{X}^j/\partial\mathscr{Y}^i)_p\,\mathtt{x}^p_j$'
        correct: true
      - text: '$\mathtt{y}^p_i = (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p\,\mathtt{x}^p_j$'
        feedback: |
          That is the velocity law copied over. Its free $i$ is upper on the right and lower on the left, a sign it cannot be right. In numbers (the running example at $p = (1,1)$, $(df)_p$ for $f = q_1^2 + q_2$): it would give $\mathtt{y}^p_1 = \tfrac12\cdot 1 = \tfrac12$, but the direct computation gives $1$.
      - text: '$\mathtt{y}^p_i = (\partial\mathscr{Y}^j/\partial\mathscr{X}^i)_p\,\mathtt{x}^p_j$'
        feedback: |
          The indices balance, but this matrix converts the basis vectors the other way, $(\partial/\partial\mathscr{X}^i)_p = (\partial\mathscr{Y}^j/\partial\mathscr{X}^i)_p(\partial/\partial\mathscr{Y}^j)_p$. It would give $\mathscr{X}$-components from $\mathscr{Y}$-components: $\mathtt{x}^p_i = (\partial\mathscr{Y}^j/\partial\mathscr{X}^i)_p\,\mathtt{y}^p_j$. To get the $\mathtt{y}$'s you need the inverse.
      - text: '$\mathtt{y}^p_i = (\partial\mathscr{X}^i/\partial\mathscr{Y}^j)_p\,\mathtt{x}^p_j$'
        feedback: |
          Check the heights: $\mathscr{X}^i$ in a numerator carries an upper $i$, while $\mathtt{y}^p_i$ has it lower, and $j$ appears twice as lower ($\mathscr{Y}^j$ in a denominator and $\mathtt{x}^p_j$). This is the row of the inverse Jacobian, not its column.
    explanation: |
      The next card derives it. Covector components follow the basis vectors: $\mathtt{y}^p_i = (\partial\mathscr{X}^j/\partial\mathscr{Y}^i)_p\,\mathtt{x}^p_j$. The index heights alone pick it: free $i$ low on both sides, summed $j$ once up and once down.

  - type: text
    id: component-law
    title: How the components change, first route
    body: |
      Now the components of a covector $\mathsf{X}_p$. In each chart they are its values on that chart's basis vectors: $\mathtt{x}^p_j = \mathsf{X}_p((\partial/\partial\mathscr{X}^j)_p)$ and $\mathtt{y}^p_i = \mathsf{X}_p((\partial/\partial\mathscr{Y}^i)_p)$. Recall the basis law for vectors, with the charts in this order:
      $$\Big(\frac{\partial}{\partial\mathscr{Y}^i}\Big)_p = \Big(\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^i}\Big)_p\Big(\frac{\partial}{\partial\mathscr{X}^j}\Big)_p.$$
      Feed it to $\mathsf{X}_p$ and use linearity:
      $$\mathtt{y}^p_i = \Big(\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^i}\Big)_p\,\mathtt{x}^p_j.$$
      Column $i$ of the **inverse** Jacobian, exactly like the basis vectors: covector components are **covariant**. A second route, through the dual bases, gives the same law.

  - type: text
    id: component-law-2
    title: How the components change, second route
    body: |
      Expand the same covector in both dual bases:
      $$\mathtt{x}^p_j\,(d\mathscr{X}^j)_p = \mathsf{X}_p = \mathtt{y}^p_i\,(d\mathscr{Y}^i)_p.$$
      Substitute the basis law $(d\mathscr{Y}^i)_p = (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p\,(d\mathscr{X}^j)_p$ on the right:
      $$\mathtt{x}^p_j\,(d\mathscr{X}^j)_p = \mathtt{y}^p_i\Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p(d\mathscr{X}^j)_p.$$
      Both sides now use the basis $\{(d\mathscr{X}^j)_p\}$. The covectors of a basis are linearly independent, so a covector has only one list of components in it: the coefficients of each $(d\mathscr{X}^j)_p$ must agree.

  - type: build
    id: build-component-law-2
    title: Compare the coefficients
    prompt: |
      Charts $\mathscr{X}$, $\mathscr{Y}$ around $p$; a covector has components $\mathtt{x}^p_j$ in $\mathscr{X}$ and $\mathtt{y}^p_i$ in $\mathscr{Y}$. From
      $$\mathtt{x}^p_j\,(d\mathscr{X}^j)_p = \mathtt{y}^p_i\Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p(d\mathscr{X}^j)_p,$$
      read off the coefficient of $(d\mathscr{X}^j)_p$ (Einstein summation, no $\Sigma$).
    prefix: '\mathtt{x}^p_j ='
    tiles: ['\big(\tfrac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\big)_p', '\big(\tfrac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^j}\big)_p', '\mathtt{y}^p_i', '\mathtt{y}^p_j']
    answers:
      - ['\big(\tfrac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\big)_p', '\mathtt{y}^p_i']
      - ['\mathtt{y}^p_i', '\big(\tfrac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\big)_p']
    wrong:
      - answer: ['\big(\tfrac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^j}\big)_p', '\mathtt{y}^p_i']
        feedback: |
          No Jacobian was inverted in the substitution: the matrix multiplying $(d\mathscr{X}^j)_p$ on the right is $(\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p$, and comparing coefficients only drops the basis covector. The heights also fail: $i$ would be up in $\mathscr{X}^i$ and down in $\mathtt{y}^p_i$, but $j$ down twice.
      - answer: ['\big(\tfrac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\big)_p', '\mathtt{y}^p_j']
        feedback: |
          Then $j$ is down twice and $i$ is free on the right only. The sum over $i$ in $\mathtt{y}^p_i(d\mathscr{Y}^i)_p$ is still there after substituting, so $\mathtt{y}^p_i$ keeps the dummy $i$.
    hint: 'Drop $(d\mathscr{X}^j)_p$ from both sides; what multiplies it on the right?'
    explanation: |
      $$\mathtt{x}^p_j = \Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p\,\mathtt{y}^p_i.$$
      This gives the $\mathscr{X}$-components from the $\mathscr{Y}$-components. To match the first route, multiply by $(\partial\mathscr{X}^j/\partial\mathscr{Y}^k)_p$ and sum over $j$. The two Jacobians are inverse matrices, $(\partial\mathscr{X}^j/\partial\mathscr{Y}^k)_p(\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p = \delta^i_k$, so
      $$\Big(\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^k}\Big)_p\mathtt{x}^p_j = \delta^i_k\,\mathtt{y}^p_i = \mathtt{y}^p_k,$$
      the first route's law with $k$ in place of $i$.

  - type: numeric
    id: c3-component-law
    title: The component law in numbers
    prompt: |
      On $\mathbb{R}^2$ at $p = (1, 1)$, with the charts $\mathscr{X}(q) = (2q_1, -q_2)$ and $\mathscr{Y}(q) = (q_1, q_2e^{q_1})$, the inverse Jacobian is (row $i$, column $j$)
      $$\Big(\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^j}\Big)_p = \begin{pmatrix} 2 & 0\\ 1 & -1/e\end{pmatrix}.$$
      The differential of $f = q_1^2 + q_2$ has $\mathscr{X}$-components $\mathtt{x}^p_j = (1, -1)$. Use $\mathtt{y}^p_i = (\partial\mathscr{X}^j/\partial\mathscr{Y}^i)_p\,\mathtt{x}^p_j$ to compute $\mathtt{y}^p_1$.
    answer: 1
    wrong:
      - { value: 2, feedback: 'That uses row 1 of the matrix, $(2, 0)$. The law sums over the **upper** index $j$ of $\mathscr{X}^j$ with $i = 1$ fixed below: column 1, $(2, 1)$.' }
      - { value: 3, feedback: 'Column 1 is right, $(2, 1)$, but $\mathtt{x}^p_2 = -1$: $2\cdot 1 + 1\cdot(-1)$.' }
    hint: '$\mathtt{y}^p_1 = (\partial\mathscr{X}^1/\partial\mathscr{Y}^1)_p\,\mathtt{x}^p_1 + (\partial\mathscr{X}^2/\partial\mathscr{Y}^1)_p\,\mathtt{x}^p_2$: column 1.'
    explanation: |
      $2\cdot 1 + 1\cdot(-1) = 1$, the value found directly from $G = f\circ\mathscr{Y}^{-1}$. Column 2 gives $\mathtt{y}^p_2 = 0\cdot 1 + (-\tfrac1e)(-1) = \tfrac1e$, also as found directly.

  - type: text
    id: invariance
    title: Why the pairing never changes
    body: |
      Now the general reason for the $4$ in both charts. Write $v$ with components $\dot\gamma^k_\mathcal{U}$ in $\mathscr{X}$ and $\dot\gamma^i_\mathcal{V}$ in $\mathscr{Y}$, and use both laws:
      $$\begin{aligned}\mathtt{y}^p_i\,\dot\gamma^i_\mathcal{V} &= \Big(\tfrac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^i}\Big)_p\mathtt{x}^p_j\\ &\quad\cdot\Big(\tfrac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^k}\Big)_p\dot\gamma^k_\mathcal{U}\\ &= \delta^j_k\,\mathtt{x}^p_j\,\dot\gamma^k_\mathcal{U}\\ &= \mathtt{x}^p_j\,\dot\gamma^j_\mathcal{U}.\end{aligned}$$
      The second step is the inverse identity $(\partial\mathscr{X}^j/\partial\mathscr{Y}^i)_p(\partial\mathscr{Y}^i/\partial\mathscr{X}^k)_p = \delta^j_k$. The components of the covector change with the inverse of the matrix that changes the components of the vector, so the two changes cancel. That is the whole point of "covariant" versus "contravariant".

  - type: mcq
    id: invariance-why
    title: What makes it cancel?
    prompt: |
      For two charts $\mathscr{X}$, $\mathscr{Y}$ around $p$, a covector's components obey $\mathtt{y}^p_i = (\partial\mathscr{X}^j/\partial\mathscr{Y}^i)_p\,\mathtt{x}^p_j$ and a velocity's components obey $\dot\gamma^i_\mathcal{V} = (\partial\mathscr{Y}^i/\partial\mathscr{X}^k)_p\,\dot\gamma^k_\mathcal{U}$. Why is $\mathtt{y}^p_i\,\dot\gamma^i_\mathcal{V} = \mathtt{x}^p_j\,\dot\gamma^j_\mathcal{U}$?
    options:
      - text: 'The two Jacobians are inverse matrices, so their product summed over $i$ is $\delta^j_k$'
        correct: true
      - text: 'Each Jacobian is the identity matrix'
        feedback: |
          They are not, in general: for the charts of the running example at $p = (1, 1)$ the Jacobian is $\begin{pmatrix}1/2&0\\e/2&-e\end{pmatrix}$. The individual components do change (from $(2,-2)$ to $(1,3e)$ for $v$); only the sum of products survives.
      - text: 'The components of a covector never depend on the chart'
        feedback: |
          They do: $(df)_p$ for $f = q_1^2 + q_2$ at $p = (1,1)$ has components $(1, -1)$ in $\mathscr{X}$ and $(1, 1/e)$ in $\mathscr{Y}$. What is chart-independent is the covector itself and its value on a velocity.
    explanation: |
      $(\partial\mathscr{X}^j/\partial\mathscr{Y}^i)_p(\partial\mathscr{Y}^i/\partial\mathscr{X}^k)_p = \delta^j_k$, the chain rule for $\mathscr{X}\circ\mathscr{Y}^{-1}\circ\mathscr{Y}\circ\mathscr{X}^{-1} = \mathrm{id}$. Of course: $\mathsf{X}_p(v)$ was defined without any chart, so every chart must give the same number.

  - type: text
    id: every-covector
    title: Every covector is a differential
    body: |
      One more consequence of the expansion. Is every covector the differential $(df)_p$ of some field? Take $\mathsf{X}_p = \mathtt{x}^p_i\,(d\mathscr{X}^i)_p$. The obvious candidate is
      $$f = \mathtt{x}^p_i\,\big(\mathscr{X}^i - \mathscr{X}^i(p)\big),$$
      since $(df)_p = \mathtt{x}^p_i\,(d\mathscr{X}^i)_p$ (constants have zero differential). The catch: this $f$ lives only on the chart domain $\mathcal{U}$, not on all of $\mathcal{M}$.

      The fix is a **bump function**: a smooth $\psi$ on $\mathcal{M}$ equal to $1$ near $p$ and $0$ outside a compact set inside $\mathcal{U}$ (its existence is stated here without proof). Then $\psi\cdot f$, extended by $0$, is a smooth field on all of $\mathcal{M}$, equal to $f$ near $p$. A velocity only looks near $p$, so $(d(\psi f))_p = (df)_p = \mathsf{X}_p$. Hence **every** covector at $p$ is a differential.

  - type: mcq
    id: bump-why
    title: Why the bump?
    prompt: |
      To show that a covector $\mathsf{X}_p = \mathtt{x}^p_i\,(d\mathscr{X}^i)_p$ is the differential of a field, one takes $f = \mathtt{x}^p_i\,(\mathscr{X}^i - \mathscr{X}^i(p))$ on the chart domain $\mathcal{U}$ and multiplies it by a bump function $\psi$ (smooth, $1$ near $p$, $0$ outside a compact set inside $\mathcal{U}$). Why is $\psi$ needed?
    options:
      - text: 'A differential is defined for fields on all of $\mathcal{M}$, and $f$ is only defined on $\mathcal{U}$'
        correct: true
      - text: 'To change the value of $(df)_p$ so that it matches $\mathsf{X}_p$'
        feedback: |
          $\psi = 1$ near $p$, so $\psi f = f$ near $p$ and the differential at $p$ is unchanged. The bump does not adjust the covector; it only makes the field exist everywhere.
      - text: 'To make the field vanish at $p$'
        feedback: |
          $f$ already vanishes at $p$ because of the $-\mathscr{X}^i(p)$, and that is irrelevant anyway: adding a constant does not change a differential. The bump is about the domain.
    explanation: |
      Fields in $C^\infty(\mathcal{M})$ must be defined on all of $\mathcal{M}$; coordinate functions usually are not. The bump extends $f$ by $0$ away from $p$ without touching it near $p$. On $\mathbb{R}^2$ with the global chart $\mathscr{X}$ no bump is needed: $(df)_p$ for $f = q_1^2 + q_2$ is also $(dg)_p$ for $g = (\mathscr{X}^1 - 2) - (\mathscr{X}^2 + 1)$. Many fields give the same covector.

  - type: text
    id: shorthand
    title: A shorthand
    body: |
      As for vectors (recall $(\partial x_i)_p := (\partial/\partial\mathscr{X}^i)_p$), we shorten the basis covectors:
      $$(dx^i)_p := (d\mathscr{X}^i)_p,$$
      $$(dy^i)_p := (d\mathscr{Y}^i)_p.$$
      A covector $\mathsf{X}_p$ and a second one $\mathsf{Y}_p$ then read
      $$\mathsf{X}_p = \mathtt{x}^p_i(dx^i)_p = \mathtt{y}^p_i(dy^i)_p,$$
      $$\mathsf{Y}_p = \tilde{\mathtt{x}}^p_i(dx^i)_p = \tilde{\mathtt{y}}^p_i(dy^i)_p,$$
      and the two laws become
      $$(dy^i)_p = \Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p(dx^j)_p,$$
      $$\mathtt{y}^p_i = \Big(\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^i}\Big)_p\mathtt{x}^p_j.$$
      The height of the index tells the rule: upper index (basis covectors, vector components) transforms with row $i$ of $(\partial\mathscr{Y}/\partial\mathscr{X})_p$; lower index (basis vectors, covector components) with column $i$ of the inverse. **Beware look-alikes:** $x^i_p$ (upper $i$, a vector's component), $\mathtt{x}^p_i$ (typewriter, lower $i$, a covector's component) and $(dx^i)_p$ (a covector) are three different things.

  - type: mcq
    id: lookalikes
    title: Spot the covector
    prompt: |
      In the shorthand for a chart $\mathscr{X}$ at $p$: $(\partial x_i)_p := (\partial/\partial\mathscr{X}^i)_p$, $(dx^i)_p := (d\mathscr{X}^i)_p$, a vector $\mathcal{X}_p = x^i_p(\partial x_i)_p$ and a covector $\mathsf{X}_p = \mathtt{x}^p_i(dx^i)_p$. Which of these is an element of $T_p^*\mathcal{M}$?
    options:
      - text: '$(dx^2)_p$'
        correct: true
      - text: '$\mathtt{x}^p_2$'
        feedback: |
          It belongs to a covector, but it is a **number**: the value $\mathsf{X}_p((\partial x_2)_p)$. Components are real numbers; the covector is the whole combination $\mathtt{x}^p_i(dx^i)_p$.
      - text: '$(\partial x_2)_p$'
        feedback: |
          A lower index does not make something a covector. $(\partial x_2)_p$ is a basis **vector**, an element of $T_p\mathcal{M}$; its index is low because the $\mathscr{X}^2$ sits in a denominator.
      - text: '$x^2_p$'
        feedback: |
          An upper index does not make something a vector or a covector: $x^2_p$ is a number, the second component of the vector $\mathcal{X}_p$ in the chart $\mathscr{X}$.
    explanation: |
      Only $(dx^2)_p = (d\mathscr{X}^2)_p$ is a covector. Index height tells how a thing transforms, not what kind of object it is.

  - type: numeric
    id: reverse-law
    title: Going back
    prompt: |
      On $\mathbb{R}^2$ at $p = (1, 1)$, with the charts $\mathscr{X}(q) = (2q_1, -q_2)$ and $\mathscr{Y}(q) = (q_1, q_2e^{q_1})$:
      $$\Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p = \begin{pmatrix} 1/2 & 0\\ e/2 & -e\end{pmatrix},$$
      $$\Big(\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^j}\Big)_p = \begin{pmatrix} 2 & 0\\ 1 & -1/e\end{pmatrix}$$
      (row $i$, column $j$). In shorthand, $(dx^2)_p = c_1(dy^1)_p + c_2(dy^2)_p$. What is $c_1$?
    answer: 1
    wrong:
      - { value: 1.35914, feedback: 'That is $e/2$, from the Jacobian $(\partial\mathscr{Y}/\partial\mathscr{X})_p$, which expresses the $(dy^i)_p$ in terms of the $(dx^j)_p$. Going back needs $(dx^i)_p = (\partial\mathscr{X}^i/\partial\mathscr{Y}^j)_p(dy^j)_p$, the inverse.' }
      - { value: 0, feedback: 'That is row 1, column 2 of the inverse. For $(dx^2)_p$ the upper index $2$ picks **row 2**: $(1, -1/e)$.' }
    hint: '$(dx^i)_p = (\partial\mathscr{X}^i/\partial\mathscr{Y}^j)_p\,(dy^j)_p$, the same row rule with the charts swapped.'
    explanation: |
      Row 2 of the inverse: $(dx^2)_p = (dy^1)_p - \tfrac1e(dy^2)_p$. Check: $\mathscr{X}^2 = -q_2 = -\mathscr{Y}^2e^{-\mathscr{Y}^1}$, whose derivative in $\mathscr{Y}^1$ at $\mathscr{Y}(p) = (1, e)$ is $e\cdot e^{-1} = 1$.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Next: Tensor Spaces at a Point · Part 1.** At each $p$ we now have two vector spaces of dimension $d$, $T_p\mathcal{M}$ and $T_p^*\mathcal{M}$, each with a basis from the chart. Chapter 2 built tensors over any vector space. What are tensors at $p$, which basis do they get from a chart, and how many Jacobians does each component pick up when the chart changes?
