id: ch04-tangent-space-2
title: Curves and the Tangent Space · Part 2
kind: concept
own: |
  - **Setting:** $\mathcal{M}$ is a manifold, $C^\infty(\mathcal{M})$ its smooth scalar fields $f\colon\mathcal{M}\to\mathbb{R}$, $p\in\mathcal{M}$, $\gamma$ a smooth curve with $\gamma(\lambda_0)=p$, and the **velocity** $v_{\gamma,p}(f) := (f\circ\gamma)'(\lambda_0)$, a linear map $C^\infty(\mathcal{M})\to\mathbb{R}$ that uses no space around $\mathcal{M}$; $\partial_if$ is the $i$-th partial derivative.
  - In $\mathbb{R}^d$, with $v^i := (\gamma^i)'(0)$ the components of the curve at $p$: {{ $(f\circ\gamma)'(0) = \sum_{i=1}^d v^i\,\partial_i f(p)$ }}. Only the first-order behaviour at $p$ counts, so different curves can share one velocity, and the coordinate functions read out the components $v^i$.
  - The **tangent space** $T_p\mathcal{M}$: {{ all velocities at $p$ }}, with $\oplus_T$ and $\odot_T$ defined {{ field by field }}:
    $$(v\oplus_T w)(f) := v(f) + w(f),$$
    $$(\alpha\odot_T v)(f) := \alpha\,v(f).$$
  - On the circle $S^1$ with angle chart $\theta$, curves $\gamma_1$ ($\theta = \theta_p+\lambda$) and $\gamma_2$ ($\theta = \theta_p+2\lambda$) through $p$ give $v_{\gamma_2,p} = 2\odot_T v_{\gamma_1,p}$: twice as fast gives twice the velocity. The four-velocity of a worldline lives in $T_p\mathcal{M}$.

cards:
  - type: text
    id: recall-velocity
    tag: Recall
    title: 'Recall: velocity as a machine on functions'
    body: |
      Recall, from the lesson Curves and the Tangent Space · Part 1: on a smooth manifold $\mathcal{M}$ (no space around it, so no arrows), $C^\infty(\mathcal{M})$ is the vector space of smooth scalar fields $f\colon\mathcal{M}\to\mathbb{R}$. For a smooth curve $\gamma\colon\mathbb{R}\to\mathcal{M}$ with $\gamma(\lambda_0) = p$, the **velocity at $p$** is the linear map
      $$v_{\gamma,p}(f) := (f\circ\gamma)'(\lambda_0),$$
      the rate of change of $f$ along $\gamma$ at $p$. Two velocities are equal when they agree on **every** field, and different curves (say one bent) can share one velocity, because $(f\circ\gamma)'(\lambda_0)$ only sees the curve to first order at $p$.

  - type: text
    id: chain-rule
    title: What the machine sees in $\mathbb{R}^d$
    body: |
      Why does only the first-order term matter? In $\mathbb{R}^d$ we can compute. Write a smooth curve with $\gamma(0) = p$ in components, $\gamma(\lambda) = (\gamma^1(\lambda), \dots, \gamma^d(\lambda))$ (upper indices label components, they are not powers), and call
      $$v^i := (\gamma^i)'(0)$$
      its **components** at $p$. Let $\partial_i f$ be the ordinary partial derivative of $f$ with respect to its $i$-th entry. The multivariable chain rule differentiates $f(\gamma^1(\lambda), \dots, \gamma^d(\lambda))$ entry by entry.

  - type: build
    id: chain-build
    prompt: |
      In $\mathbb{R}^d$, let $\gamma$ be a smooth curve with $\gamma(0) = p$ and components $v^i := (\gamma^i)'(0)$, and let $f$ be a smooth function with partial derivatives $\partial_i f$. Build the multivariable chain rule for $(f\circ\gamma)'(0)$.
    prefix: '(f\circ\gamma)''(0) ='
    tiles: ['\sum_{i=1}^d', 'v^i', '\partial_i f(p)', '\partial_i f(0)', '\gamma^i(0)']
    answers:
      - ['\sum_{i=1}^d', 'v^i', '\partial_i f(p)']
      - ['\sum_{i=1}^d', '\partial_i f(p)', 'v^i']
    wrong:
      - answer: ['\sum_{i=1}^d', 'v^i', '\partial_i f(0)']
        feedback: |
          $f$ lives on $\mathbb{R}^d$, not on the parameter line: its partial derivatives are evaluated at the point $\gamma(0) = p$, not at the parameter value $0$.
      - answer: ['\sum_{i=1}^d', '\gamma^i(0)', '\partial_i f(p)']
        feedback: |
          $\gamma^i(0)$ is the $i$-th coordinate of the point $p$ itself, not a rate of change. The chain rule multiplies by the derivatives $(\gamma^i)'(0) = v^i$.
      - answer: ['\sum_{i=1}^d', '\partial_i f(p)', '\gamma^i(0)']
        feedback: |
          $\gamma^i(0)$ is the $i$-th coordinate of the point $p$ itself, not a rate of change. The chain rule multiplies by the derivatives $(\gamma^i)'(0) = v^i$.
    hint: Each entry of $f$ changes at rate $(\gamma^i)'(0)$, and $f$ responds to entry $i$ with $\partial_i f$ at the current point.
    explanation: |
      $$(f\circ\gamma)'(0) = \sum_{i=1}^d v^i\,\partial_i f(p).$$
      Only $p$ and the components $v^i$ appear: the bend and every higher-order term drop out. And two curves with the same components give the same number for **every** $f$, so the same velocity.

  - type: numeric
    id: chain-number
    prompt: |
      On $\mathbb{R}^2$ take the curve $\gamma(\lambda) = (1 + 3\lambda,\ 1 - 2\lambda + \lambda^2)$ through $p = (1, 1)$ at $\lambda = 0$, and $f(q) = q_1^2 + q_2$. Use $(f\circ\gamma)'(0) = \sum_i v^i\,\partial_i f(p)$ to compute $v_{\gamma,p}(f)$.
    answer: 4
    wrong:
      - value: 6
        feedback: |
          That is only the $i = 1$ term, $v^1\,\partial_1 f(p) = 3\cdot 2$. Add the $i = 2$ term $v^2\,\partial_2 f(p) = (-2)\cdot 1$.
      - value: 1
        feedback: |
          That adds the components $3 + (-2)$ without the weights $\partial_i f(p)$. Here $\partial_1 f = 2q_1$ is $2$ at $p$, and $\partial_2 f = 1$.
      - value: 2
        feedback: |
          The $\lambda^2$ term has zero derivative at $\lambda = 0$, so $v^2 = -2$, not $-2 + 2$. Only first-order terms count.
    hint: 'Components: $v^1 = 3$, $v^2 = -2$. Partial derivatives at $p$: $\partial_1 f = 2q_1$ and $\partial_2 f = 1$.'
    explanation: |
      $v = (3, -2)$ and $\partial f(p) = (2, 1)$, so
      $$v_{\gamma,p}(f) = 3\cdot 2 + (-2)\cdot 1 = 4.$$
      Check directly: $f(\gamma(\lambda)) = (1 + 3\lambda)^2 + 1 - 2\lambda + \lambda^2$ has derivative $6 - 2 = 4$ at $0$.

  - type: widget
    id: chain-explore
    title: The chain rule, live
    widget: curve-velocity
    config:
      p: [1, 1]
      f: theta
      chain: true
      curves:
        - { v: [1, 0.5] }
        - { v: [-1, 1] }
    body: |
      Curves through $p = (1, 1)$ at $\lambda = 0$, and the polar angle $\theta$. Careful: $\theta$ is **not** in $C^\infty(\mathbb{R}^2)$, the fields a velocity accepts, since it has no value at the origin and jumps from $2\pi$ to $0$ across the positive $x$-axis. So take an $f \in C^\infty(\mathbb{R}^2)$ equal to $\theta$ on a disc around $p$ and smoothly switched off before the jump. For $\lambda$ near $0$ every curve through $p$ stays in that disc, so $(f\circ\gamma)'(0) = (\theta\circ\gamma)'(0)$: the readout, computed with $\theta$, gives $v_{\gamma,p}(f)$. It now expands $(f\circ\gamma)'(0) = \partial_1 f(p)\,v^1 + \partial_2 f(p)\,v^2$ in numbers.

      1. Drag a blue handle along the dashed orange ray through $p$ (a level line of $\theta$). What is $(\theta\circ\gamma)'(0)$ there?
      2. Switch to $f = x$, then $f = y$. Compare $(f\circ\gamma)'(0)$ with the components $(v^1, v^2)$.

  - type: mcq
    id: coordinate-functions
    prompt: |
      On $\mathbb{R}^2$ let $\gamma$ be a smooth curve through $p$ at $\lambda = 0$ with components $v^i = (\gamma^i)'(0)$. Take the coordinate function $y(q) = q_2$ as the scalar field. What is $v_{\gamma,p}(y)$?
    options:
      - text: '$v^2$'
        correct: true
      - text: '$v^1 + v^2$'
        feedback: |
          The chain rule weights each component by $\partial_i y(p)$. Here $\partial_1 y = 0$ ($y$ ignores $q_1$) and $\partial_2 y = 1$, so only $v^2$ survives.
      - text: '$q_2$ evaluated at $p$'
        feedback: |
          That is $y(p)$, the value of the field, not its rate of change along $\gamma$. The velocity returns derivatives: $(y\circ\gamma)'(0) = (\gamma^2)'(0)$.
    explanation: |
      $(y\circ\gamma)(\lambda) = \gamma^2(\lambda)$, so $v_{\gamma,p}(y) = (\gamma^2)'(0) = v^2$; likewise $v_{\gamma,p}(x) = v^1$ for $x(q) = q_1$. Feeding the machine the coordinate functions **reads out the components**. So nothing is lost: in $\mathbb{R}^d$ the machine $v_{\gamma,p}$ knows the arrow $v$, and the arrow determines the machine.

  - type: numeric
    id: read-component
    prompt: |
      On $\mathbb{R}^2$ take the curve $\gamma(\lambda) = (1 + 3\lambda,\ 1 - 2\lambda + \lambda^2)$ through $p = (1, 1)$ at $\lambda = 0$, and the coordinate function $y(q) = q_2$. Compute $v_{\gamma,p}(y)$.
    answer: -2
    wrong:
      - value: 3
        feedback: |
          That is the rate of the first coordinate, $v_{\gamma,p}(x)$ for $x(q) = q_1$. The field $y$ reads the second entry, $1 - 2\lambda + \lambda^2$.
      - value: 1
        feedback: |
          That is $y(p)$, the value at $p$. The velocity returns the derivative of $y(\gamma(\lambda)) = 1 - 2\lambda + \lambda^2$ at $\lambda = 0$.
    hint: $y(\gamma(\lambda))$ is just the second entry of $\gamma(\lambda)$.
    explanation: |
      $y(\gamma(\lambda)) = 1 - 2\lambda + \lambda^2$, with derivative $-2 + 2\lambda$, which is $-2$ at $0$. This is the component $v^2$.

  - type: text
    id: def-tangent-space
    title: The tangent space $T_p\mathcal{M}$
    body: |
      On a general manifold we keep the machine and drop the arrow. The **tangent space** to $\mathcal{M}$ at $p$ is the set of all velocities at $p$:
      $$T_p\mathcal{M} := \{v_{\gamma,p}\mid\gamma\text{ smooth through }p\}.$$
      Its elements are called **vectors** (tangent vectors) at $p$. Each one is a linear map $C^\infty(\mathcal{M})\to\mathbb{R}$, and each is the velocity of many curves.

      To be a vector space it needs an addition and a scalar multiplication. Both are defined field by field, the way $\oplus$ was defined point by point:
      $$(v_{\gamma_1,p}\oplus_T v_{\gamma_2,p})(f) := v_{\gamma_1,p}(f) + v_{\gamma_2,p}(f),$$
      $$(\alpha\odot_T v_{\gamma,p})(f) := \alpha\cdot v_{\gamma,p}(f).$$
      The subscript $T$ marks operations on tangent vectors.

  - type: mcq
    id: resolve-hook
    prompt: |
      On $S^1$ with the angle chart $\theta$, curve $\gamma_1$ follows $\theta(\gamma_1(\lambda)) = \theta_p + \lambda$ and curve $\gamma_2$ follows $\theta(\gamma_2(\lambda)) = \theta_p + 2\lambda$, so $\gamma_2(\lambda) = \gamma_1(2\lambda)$. Both pass through $p$ at $\lambda = 0$. How are their velocities related?
    options:
      - text: '$v_{\gamma_2,p} = 2\odot_T v_{\gamma_1,p}$'
        correct: true
      - text: '$v_{\gamma_2,p} = v_{\gamma_1,p}$, since the two curves have the same image'
        feedback: |
          The velocity sees how fast the curve passes $p$, not just its path. By the chain rule, $(f\circ\gamma_2)'(0) = \frac{d}{d\lambda}f(\gamma_1(2\lambda))|_{0} = 2\,(f\circ\gamma_1)'(0)$ for every $f$.
      - text: '$v_{\gamma_2,p} = \tfrac12\odot_T v_{\gamma_1,p}$'
        feedback: |
          $\gamma_2$ reaches each angle in half the parameter time, so fields change **faster** along it. The chain rule gives $\frac{d}{d\lambda}f(\gamma_1(2\lambda)) = 2\,(f\circ\gamma_1)'(2\lambda)$: a factor $2$, not $\tfrac12$.
    explanation: |
      For every $f$, $(f\circ\gamma_2)'(0) = 2\,(f\circ\gamma_1)'(0) = (2\odot_T v_{\gamma_1,p})(f)$, so the two maps are equal. This settles the opening question without any plane around $S^1$: twice as fast means twice the velocity, as an equation in $T_p S^1$.

  - type: numeric
    id: sum-number
    prompt: |
      On $\mathbb{R}^2$, $\gamma_1(\lambda) = (\lambda, 1)$ passes through $p = (1, 1)$ at $\lambda_0 = 1$, and $\gamma_2(\lambda) = (1, 2\lambda)$ passes through $p$ at $\lambda_0 = \tfrac12$. For $f(q) = q_1^2 + q_2$, compute $(v_{\gamma_1,p}\oplus_T v_{\gamma_2,p})(f)$.
    answer: 4
    wrong:
      - value: 2
        feedback: |
          Each velocity alone gives $2$: $f(\gamma_1(\lambda)) = \lambda^2 + 1$ has derivative $2$ at $\lambda = 1$, and $f(\gamma_2(\lambda)) = 1 + 2\lambda$ has derivative $2$. The sum $\oplus_T$ adds the two numbers.
    hint: By definition, $(v_{\gamma_1,p}\oplus_T v_{\gamma_2,p})(f) = v_{\gamma_1,p}(f) + v_{\gamma_2,p}(f)$.
    explanation: |
      $2 + 2 = 4$. Check with components: the sum has components $(1, 0) + (0, 2) = (1, 2)$, and $\sum_i v^i\,\partial_i f(p) = 1\cdot 2 + 2\cdot 1 = 4$.

  - type: mcq
    id: sum-curve
    prompt: |
      For velocities $v_{\gamma_1,p}, v_{\gamma_2,p}\in T_p\mathcal{M}$ on a smooth manifold $\mathcal{M}$, the sum $\oplus_T$ is defined field by field. For $T_p\mathcal{M}$ to be closed under it, the sum must again be the velocity of some curve through $p$. Why not simply take the curve $\lambda\mapsto\gamma_1(\lambda) + \gamma_2(\lambda)$?
    options:
      - text: 'Points of a manifold cannot be added; even in $\mathbb{R}^2$ that curve passes through $2p$ at $\lambda = 0$, not through $p$'
        correct: true
      - text: 'It works, but only when both curves pass through $p$ at the same $\lambda_0$'
        feedback: |
          Even with matching parameters, $\gamma_1(\lambda_0) + \gamma_2(\lambda_0) = p + p$, which needs an addition of points that a manifold does not have. In $\mathbb{R}^2$, where it exists, the result is $2p$, the wrong point.
      - text: 'It works on every manifold, because $\oplus$ already adds functions point by point'
        feedback: |
          $\oplus$ adds the **values** of two functions, which are real numbers. A curve's values are points of $\mathcal{M}$, and there is no rule for adding points.
    explanation: |
      The fix is to add in a chart: add the chart representatives $\mathscr{X}\circ\gamma_1$ and $\mathscr{X}\circ\gamma_2$ in $\mathbb{R}^d$, subtract $\mathscr{X}(p)$ to stay at $p$, and map back. The resulting **curve** depends on the chart, yet its **velocity** does not, and it equals $v_{\gamma_1,p}\oplus_T v_{\gamma_2,p}$. Proving this is the next guided problem.

  - type: text
    id: physics
    title: 'Physics: the four-velocity'
    body: |
      In relativity a particle traces a **worldline**, a curve $\gamma$ in spacetime $\mathcal{M}$, usually parametrized by its proper time $\tau$ (the time its own clock reads; the metric defines it, in the level on the metric). Its **four-velocity** at the event $p = \gamma(\tau_0)$ is exactly $v_{\gamma,p}\in T_p\mathcal{M}$.

      No arrow sticks out of spacetime, and none is needed. If $T$ is a temperature field on spacetime, then
      $$v_{\gamma,p}(T) = (T\circ\gamma)'(\tau_0)$$
      is the rate at which a thermometer carried by the particle sees the temperature change, per tick of its own clock. The four-velocity is the machine that answers "how fast does this field change for this observer?" for every field at once.

  - type: mcq
    id: physics-meaning
    prompt: |
      A particle moves along a worldline $\gamma$ in spacetime $\mathcal{M}$, parametrized by its proper time $\tau$ (the time on its own clock), and is at the event $p = \gamma(\tau_0)$. $T$ is a smooth temperature field on $\mathcal{M}$. What does $v_{\gamma,p}(T)$ measure?
    options:
      - text: 'The rate at which the particle''s thermometer reading changes, per unit of its own time, at $p$'
        correct: true
      - text: 'The temperature at the event $p$'
        feedback: |
          That is $T(p)$, the value of the field. The velocity returns a derivative, $(T\circ\gamma)'(\tau_0)$: how fast the reading changes, not what it reads.
      - text: 'How fast the temperature changes at $p$ in time, the same for every observer'
        feedback: |
          Different worldlines through $p$ give different numbers: an observer moving towards a heater sees $T$ rise faster than one at rest. $v_{\gamma,p}(T)$ depends on the curve, which is why it describes a velocity.
    explanation: |
      $v_{\gamma,p}(T) = (T\circ\gamma)'(\tau_0)$ is the rate of change of $T$ along this particular worldline at $p$. Swap $T$ for any other field and the same four-velocity gives that field's rate; together these numbers are the vector.

  - type: text
    id: wrap-up
    title: What you now own
    body: |
      **Next:** a guided problem. Is $v_{\gamma_1,p}\oplus_T v_{\gamma_2,p}$ really the velocity of some curve? Add the curves in a chart, watch the curve change with the chart, and prove that its velocity does not.
