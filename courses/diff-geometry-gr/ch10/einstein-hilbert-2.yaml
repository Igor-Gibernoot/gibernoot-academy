id: ch10-einstein-hilbert-2
title: The Einstein Equations from an Action · Part 2
kind: concept

own: |
  - **Setting**: $g$ is a Lorentzian metric on the spacetime $\mathcal{M}$ (inverse $(g^{-1})^{ab}$, Levi-Civita connection $\nabla$), $\mathrm{Ric}_{ab}$ its Ricci tensor, $R := (g^{-1})^{ab}\mathrm{Ric}_{ab}$ the scalar curvature, $G_N$ Newton's constant, $\kappa = -1/(16\pi G_N)$; a hat means all indices raised with $g^{-1}$ (as in $\hat G^{ij}$), and $\text{ᛉ}$ is a symmetric $(0,2)$ tensor field (a variation of $g$) vanishing with its derivative on the boundary of the region $\mathcal{D}$.
  - **Result**: the variation of the Einstein–Hilbert action $S_\mathcal{D}[g] = \kappa\int_{\mathcal{D}}\sqrt{-\det g}\,R\,d^4x$ is
  {{ $$\delta S_\mathcal{D} = -\kappa\int_{\mathcal{D}}\sqrt{-\det g}\;\hat G^{ij}\,\text{ᛉ}_{ij}\,d^4x$$ }}
  with $G = \mathrm{Ric}-\tfrac12R\,g$, so the metric is critical for every admissible $\text{ᛉ}$ iff $G = 0$ (vacuum; in 4D this is $\mathrm{Ric}=0$, not $\mathrm{Riem}=0$, since the trace of $G$ is $-R$).
  - **Matter**: for a matter action $S_M$ (its fields and Lagrangian density $\mathcal{L}_M$ are defined in the next lesson), defining the symmetric tensor $T$ by $\delta S_M = -\tfrac12\int\sqrt{-\det g}\,\hat T^{ij}\,\text{ᛉ}_{ij}\,d^4x$, the total action is critical iff
  {{ $$G_{ab} = 8\pi G_N\,T_{ab}$$ }}
  - **Trace-reversed form**: with $T := (g^{-1})^{ab}T_{ab}$ the trace,
  {{ $$\mathrm{Ric}_{ab} = 8\pi G_N\Big(T_{ab} - \tfrac12\,T\,g_{ab}\Big)$$ }}
  for matter at rest with density $\rho$ it gives $\mathrm{Ric}_{00} = 4\pi G_N\rho$, the Newtonian relation between tides and density.

cards:
  - type: text
    id: recall-action
    title: "Recall: the action and its variation"
    body: |
      The metric $g$ (Lorentzian, signature $(+,-,-,-)$, inverse $(g^{-1})^{ab}$, Levi-Civita connection $\nabla$) is the unknown. For a region $\mathcal{D}$ of the spacetime with compact closure in a chart with coordinates $x$, the **Einstein–Hilbert action** is
      $$S_\mathcal{D}[g] = \kappa\int_{\mathcal{D}}\sqrt{-\det g}\;R\;d^4x,$$
      $$\kappa = -\frac{1}{16\pi G_N},$$
      with $R := (g^{-1})^{ab}\mathrm{Ric}_{ab}$ the scalar curvature built from the Ricci tensor $\mathrm{Ric}$, and $G_N$ Newton's constant. A variation is $g_\text{ᛊ} = g + \text{ᛊ}\,\text{ᛉ}$, with $\text{ᛊ}\in\mathbb{R}$ small and $\text{ᛉ}$ a symmetric $(0,2)$ tensor field (a rune, not a number) which vanishes together with its first derivatives on $\partial\mathcal{D}$; $\delta F := \frac{d}{d\text{ᛊ}}F_\text{ᛊ}\big|_0$. The metric is **critical** if $\delta S_\mathcal{D} = 0$ for every admissible $\text{ᛉ}$.

  - type: text
    id: recall-variations
    title: "Recall: the three variations"
    body: |
      By the product rule, $\delta\big(\sqrt{-\det g}\,R\big)$ has three parts, whose ingredients are
      $$\delta (g^{-1})^{ab} = -(g^{-1})^{ar}(g^{-1})^{bs}\,\text{ᛉ}_{rs},$$
      $$\delta\sqrt{-\det g} = \tfrac12\sqrt{-\det g}\,(g^{-1})^{ij}\,\text{ᛉ}_{ij},$$
      and the Palatini identity $\delta\,\mathrm{Ric}_{ab} = (\nabla_mC)^m_{ab} - (\nabla_bC)^m_{am}$, with $C^k_{ab} := \delta\Gamma^k_{ab}$ a tensor ($\Gamma$ the Christoffel symbols). The contraction $(g^{-1})^{ab}\delta\mathrm{Ric}_{ab}$ is a divergence, so $\sqrt{-\det g}\,(g^{-1})^{ab}\delta\mathrm{Ric}_{ab} = \partial_mF^m$ is a total derivative whose integral vanishes because $\text{ᛉ}$ and $\partial\text{ᛉ}$ vanish on $\partial\mathcal{D}$. What is left is the terms with $\text{ᛉ}_{ij}$ undifferentiated: the volume term and the inverse-metric term. Next: collect them.

  - type: build
    id: collect
    title: Collect the coefficient of $\text{ᛉ}_{ij}$
    prompt: |
      Collect, in $\delta(\sqrt{-\det g}\,R)$, the terms with undifferentiated $\text{ᛉ}$. The volume term gives $\tfrac12\sqrt{-\det g}\,(g^{-1})^{ij}\,R\,\text{ᛉ}_{ij}$ and the term (B) gives $-\sqrt{-\det g}\,\hat{\mathrm{Ric}}^{ij}\,\text{ᛉ}_{ij}$, where $\hat{\mathrm{Ric}}^{ij} := (g^{-1})^{ia}(g^{-1})^{jb}\mathrm{Ric}_{ab}$. Build the coefficient of $-\sqrt{-\det g}\;\text{ᛉ}_{ij}$.
    prefix: '\hat G^{ij} ='
    tiles: ['\hat{\mathrm{Ric}}^{ij}', '-', '+', '\tfrac12\,R\,(g^{-1})^{ij}', 'R\,(g^{-1})^{ij}', '2R\,(g^{-1})^{ij}']
    answers:
      - ['\hat{\mathrm{Ric}}^{ij}', '-', '\tfrac12\,R\,(g^{-1})^{ij}']
    wrong:
      - answer: ['\hat{\mathrm{Ric}}^{ij}']
        feedback: 'This forgets the volume term. If the volume element were held fixed, the vacuum equation would still be $\mathrm{Ric}=0$, but with matter the equation would be wrong (see the traps below).'
      - answer: ['\hat{\mathrm{Ric}}^{ij}', '+', '\tfrac12\,R\,(g^{-1})^{ij}']
        feedback: 'Sign check: the volume term enters as $+\tfrac12 R(g^{-1})^{ij}\text{ᛉ}_{ij}$ while the Ricci term is $-\hat{\mathrm{Ric}}^{ij}\text{ᛉ}_{ij}$. Factoring out the common $-1$ leaves a relative minus.'
    hint: 'Factor $-1$ out of $-\hat{\mathrm{Ric}}^{ij} + \tfrac12R(g^{-1})^{ij}$.'
    explanation: |
      $\tfrac12R(g^{-1})^{ij} - \hat{\mathrm{Ric}}^{ij} = -\big(\hat{\mathrm{Ric}}^{ij} - \tfrac12R(g^{-1})^{ij}\big) = -\hat G^{ij}$, the **Einstein curvature** with raised indices, $G = \mathrm{Ric} - \tfrac12R\,g$.

  - type: text
    id: result
    title: The result
    body: |
      Collecting, and dropping the boundary term,
      $$\frac{d}{d\text{ᛊ}}S_\mathcal{D}[g_\text{ᛊ}]\Big|_0 = -\kappa\int_\mathcal{D}\sqrt{-\det g}\;\hat G^{ij}\,\text{ᛉ}_{ij}\,d^4x,$$
      with $\hat G^{ij} = (g^{-1})^{ia}(g^{-1})^{jb}G_{ab}$.
      If this vanishes for **every** admissible $\text{ᛉ}$, then $\hat G^{ij} = 0$ at every point of $\mathcal{D}$. Reason: if $\hat G^{kl}>0$ somewhere (use $-\text{ᛉ}$ if negative), choose $\text{ᛉ}_{ij}$ a smooth bump supported in a small ball, proportional to $\delta^k_i\delta^l_j + \delta^l_i\delta^k_j$: the integral is then non-zero. Lowering the indices (which loses nothing, $\hat G = 0\iff G = 0$):
      $$\boxed{G = \mathrm{Ric} - \tfrac12R\,g = 0}$$
      the **vacuum Einstein equations**.
      Back to the hook: the requirement "simplest scalar built from $g$" led to $R$, and **the equations of the metric are second order**, though $R$ contains second derivatives, because those sit in a total derivative.

  - type: numeric
    id: trace
    title: The trace of $G$
    prompt: |
      In dimension $4$, the trace $(g^{-1})^{ab}G_{ab}$ of $G_{ab} = \mathrm{Ric}_{ab} - \tfrac12R\,g_{ab}$ is a multiple of $R$. At a point where $R = 3$, what is the trace?
    answer: -3
    tolerance: 0.001
    answerText: '-3'
    wrong:
      - { value: 3, feedback: 'The sign: $(g^{-1})^{ab}\mathrm{Ric}_{ab} = R$, and $(g^{-1})^{ab}g_{ab} = 4$ (not $1$), so the trace is $R - 2R = -R$.' }
      - { value: 1.5, feedback: 'Remember $(g^{-1})^{ab}g_{ab} = \delta^a_a = 4$ in dimension $4$, so the second term is $\tfrac12\cdot4\,R = 2R$.' }
      - { value: 0, feedback: 'That would need $(g^{-1})^{ab}g_{ab} = 2$; in dimension $4$ it is $4$.' }
    hint: '$(g^{-1})^{ab}\mathrm{Ric}_{ab} = R$ and $(g^{-1})^{ab}g_{ab} = 4$.'
    explanation: |
      $R - \tfrac12R\cdot4 = -R = -3$. So $G = 0$ implies $R = 0$, and then $\mathrm{Ric} = G + \tfrac12R\,g = 0$: in 4D, $G = 0\iff\mathrm{Ric} = 0$.

  - type: mcq
    id: ricci-flat
    title: Vacuum is not flat
    prompt: |
      A spacetime satisfies $G = 0$ everywhere (vacuum). Which conclusion is justified?
    options:
      - text: '$\mathrm{Ric} = 0$, but $\mathrm{Riem}$ can be non-zero: tidal effects remain'
        correct: true
      - text: '$\mathrm{Riem} = 0$: spacetime is flat'
        feedback: |
          Ricci-flat is weaker. The Riemann tensor of a point mass outside the mass (the Newton-Cartan point-mass problem) has $\mathrm{Riem}^\alpha{}_{0\beta0}$ non-zero, but its trace $\mathrm{Ric}_{00} = 0$ there: the tidal tensor is traceless. That is a vacuum solution with curvature.
      - text: '$R\neq0$ in general'
        feedback: |
          The trace of $G = 0$ gives $-R = 0$ in 4D, so $R = 0$.
      - text: 'There is no vacuum solution except Minkowski'
        feedback: |
          Schwarzschild, a point mass with the Newtonian tides of the Newton-Cartan point mass, is a vacuum solution with $\mathrm{Riem}\neq0$ (checked in a later lesson).
    explanation: |
      The Einstein tensor (equivalently the Ricci tensor) is the 10-component trace part of the 20-component Riemann tensor. In vacuum the trace part vanishes and the rest (the tides) is free.

  - type: text
    id: matter
    title: Adding matter
    body: |
      Matter fields have their own action $S_M[g,\Phi] = \int_\mathcal{D}\sqrt{-\det g}\,\mathcal{L}_M\,d^4x$, built from the matter fields $\Phi$, their derivatives and the metric. The **energy-momentum tensor** $T$ is *defined* as its response to the metric, so that a deformation $\text{ᛉ}$ changes $S_M$ by
      $$\delta S_M = -\frac12\int_\mathcal{D}\sqrt{-\det g}\;\hat T^{ij}\,\text{ᛉ}_{ij}\,d^4x,$$
      where $\hat T^{ij} := (g^{-1})^{ia}(g^{-1})^{jb}T_{ab}$ and $T$ a symmetric $(0,2)$-tensor field. Like a current as the response of the action to the electromagnetic potential, $T$ is the response to $g$.

      Now require the **total** action $S_\mathcal{D} + S_M$ to be critical under $g$:
      $$\delta(S_\mathcal{D}+S_M) = \int_\mathcal{D}\sqrt{-\det g}\,Q^{ij}\,\text{ᛉ}_{ij}\,d^4x,$$
      $$Q^{ij} := \tfrac{1}{16\pi G_N}\hat G^{ij} - \tfrac12\hat T^{ij},$$
      using $-\kappa = \frac{1}{16\pi G_N}$. This must vanish for every admissible $\text{ᛉ}$, so $Q^{ij} = 0$, and after lowering indices,
      $$\boxed{G_{ab} = 8\pi G_N\,T_{ab}}$$
      The choice of $\kappa$ is what makes the factor $8\pi G_N$ appear.

  - type: mcq
    id: kappa-role
    title: What the constant does
    prompt: |
      Suppose the action had a different constant, $S_\mathcal{D} = \tilde\kappa\int\sqrt{-\det g}\,R\,d^4x$, with the same matter action. What changes?
    options:
      - text: 'Vacuum: nothing, since $G = 0$ does not involve $\tilde\kappa$. With matter: $G = -\dfrac{1}{2\tilde\kappa}\,T$, so $\tilde\kappa$ sets the coupling strength'
        correct: true
      - text: 'Nothing at all, with or without matter'
        feedback: |
          Without matter, yes. With matter, the two terms of the variation are $-\tilde\kappa\hat G^{ij}$ and $-\tfrac12\hat T^{ij}$, so the ratio fixes the coefficient of $T$ in the equation.
      - text: 'The vacuum equation becomes $G = \tilde\kappa\,g$'
        feedback: |
          A term $\propto g$ would come from adding a *volume* term to the action (a cosmological constant), not from rescaling $\kappa$.
      - text: 'The equations become fourth order'
        feedback: |
          The order is set by the integrand ($R$), not by the constant in front.
    explanation: |
      $-\tilde\kappa\hat G^{ij} - \tfrac12\hat T^{ij} = 0$ gives $G = -\frac{1}{2\tilde\kappa}T$. With $\tilde\kappa = -\frac{1}{16\pi G_N}$ this is $8\pi G_N T$, a convention fixed by comparison with Newtonian gravity, where $\mathrm{Ric}_{00} = 4\pi G_N\rho$ (the Newton-Cartan lessons).

  - type: text
    id: trace-reverse
    title: Solving for Ricci
    body: |
      Take the trace of $G_{ab} = 8\pi G_N T_{ab}$ with $(g^{-1})^{ab}$: the left side is $-R$, so $R = -8\pi G_N\,T$, where $T := (g^{-1})^{ab}T_{ab}$ is the trace. Putting this back into $\mathrm{Ric}_{ab} = G_{ab} + \tfrac12R\,g_{ab}$,
      $$\mathrm{Ric}_{ab} = 8\pi G_N\Big(T_{ab} - \tfrac12\,T\,g_{ab}\Big).$$
      Test it: matter at rest with energy density $\rho$, at a point where $g = \eta = \mathrm{diag}(1,-1,-1,-1)$ and $T_{ab} = \mathrm{diag}(\rho,0,0,0)$. Then $T = (g^{-1})^{00}T_{00} = \rho$.

  - type: numeric
    id: ric-00
    title: The Newtonian limit
    prompt: |
      With $T_{ab} = \mathrm{diag}(\rho,0,0,0)$ and $g = \eta$ at the point, compute $\mathrm{Ric}_{00}$ from $\mathrm{Ric}_{ab} = 8\pi G_N\big(T_{ab} - \tfrac12Tg_{ab}\big)$. Give it in units of $\pi G_N\rho$.
    answer: 4
    tolerance: 0.001
    answerText: '4'
    wrong:
      - { value: 8, feedback: 'That drops the trace term: $8\pi G_N T_{00} = 8\pi G_N\rho$. The correction $-\tfrac12Tg_{00} = -\tfrac12\rho$ halves it.' }
      - { value: 12, feedback: 'The sign of the trace term: $T_{00} - \tfrac12T g_{00} = \rho - \tfrac12\rho$, with $g_{00} = +1$.' }
    hint: '$T = \rho$, $g_{00} = 1$, so $T_{00} - \tfrac12Tg_{00} = \rho - \tfrac12\rho$.'
    explanation: |
      $\mathrm{Ric}_{00} = 8\pi G_N\cdot\tfrac12\rho = 4\pi G_N\rho$: exactly the Newtonian relation between tides and density found in the Newton-Cartan lessons (the trace of the tidal tensor, $\Delta\phi = 4\pi G_N\rho$). This is the check that fixes $\kappa = -1/(16\pi G_N)$.

  - type: numeric
    id: ric-11
    title: Pressure from nothing?
    prompt: |
      Same data, $T_{ab} = \mathrm{diag}(\rho,0,0,0)$ and $g = \eta$ (so $g_{11} = -1$). The matter has no stress ($T_{11} = 0$), but the trace term contributes. Give $\mathrm{Ric}_{11}$ in units of $\pi G_N\rho$.
    answer: 4
    tolerance: 0.001
    answerText: '4'
    wrong:
      - { value: 0, feedback: '$T_{11} = 0$ is not the end: $\mathrm{Ric}_{11}$ also contains $-\tfrac12T g_{11}$, with the non-zero trace $T = \rho$.' }
      - { value: -4, feedback: 'The sign: $g_{11} = -1$, so $-\tfrac12T g_{11} = +\tfrac12\rho$.' }
    hint: '$\mathrm{Ric}_{11} = 8\pi G_N\big(0 - \tfrac12\rho\,g_{11}\big)$.'
    explanation: |
      $8\pi G_N\cdot\tfrac12\rho = 4\pi G_N\rho$. Ricci has non-zero space components even if the matter has no stress: spatial curvature is sourced by the energy density too (a Newtonian theory has no such effect).

  - type: mcq
    id: trap-r2
    title: Why not a different scalar, such as $R^2$?
    prompt: |
      Someone proposes the action $\int\sqrt{-\det g}\,R^2\,d^4x$ instead. $R^2$ is a scalar, built from $g$, chart independent. What is the main problem compared with $R$?
    options:
      - text: '$R^2$ is quadratic in the second derivatives of $g$: the total-derivative trick fails, and the field equations contain fourth derivatives of $g$ (e.g. $\nabla\nabla R$)'
        correct: true
      - text: '$R^2$ is not a scalar'
        feedback: |
          It is: the square of a scalar function is a scalar. The difficulty is not invariance but the order of the equations.
      - text: '$R^2$ is not chart independent'
        feedback: |
          It is chart independent, as $R$ is. Chart independence does not single out $R$.
      - text: '$R^2$ makes the action vanish in vacuum'
        feedback: |
          Not in general: $R^2 = 0$ in vacuum because $R = 0$ there (the trace of $G=0$), but that is a property of the solutions of the Einstein equations, not of the action $R^2$.
    explanation: |
      For $R$, the second derivatives of $\text{ᛉ}$ appear **linearly**, inside the Palatini divergence, and integrate away. For $R^2$ the variation is $2R\,\delta R$, and $R$ multiplies the divergence: integrating by parts moves two derivatives onto $R$ itself, giving a fourth-order equation. Such $f(R)$ theories are studied, but they are different theories with extra degrees of freedom; $R$ is the simplest.

  - type: mcq
    id: trap-volume
    title: Forgetting the density
    prompt: |
      A student varies only $R$ and holds the volume density fixed, $\delta\sqrt{-\det g} = 0$. Which statement about the resulting equation is correct?
    options:
      - text: 'In vacuum it still gives $\mathrm{Ric} = 0$ (same solutions), but with matter it gives $\mathrm{Ric}_{ab} = 8\pi G_N T_{ab}$ with no trace term, which is wrong: e.g. it would give $\mathrm{Ric}_{11} = 0$ for matter at rest'
        correct: true
      - text: 'It gives the same equation as the correct computation in all cases'
        feedback: |
          Only in vacuum, where $R = 0$ kills the volume term $\tfrac12R\,g^{ij}$. With matter, $R\neq0$ and the term matters (it produced $\mathrm{Ric}_{11} = 4\pi G_N\rho$ above).
      - text: 'It gives no equation at all'
        feedback: |
          It gives $\mathrm{Ric}=\dots$, but the wrong one. The volume density is a function of $g$ and varies with it: nothing is "fixed" in the action except $\mathcal{M}$ and its smooth structure.
      - text: 'It violates the boundary conditions'
        feedback: |
          The boundary conditions are about $\text{ᛉ}$ on $\partial\mathcal{D}$, not about which factor of the integrand is varied.
    explanation: |
      Everything in the integrand depends on $g$, including the measure. This is also the origin of the $-\tfrac12R\,g$ in $G$, which makes the Einstein tensor divergence-free (conserved source).

  - type: mcq
    id: trap-independent
    title: The connection follows the metric
    prompt: |
      In this derivation, how is the connection $\nabla$ treated when the metric is varied?
    options:
      - text: 'It is the Levi-Civita connection of $g_\text{ᛊ}$ at each $\text{ᛊ}$, so $\delta\Gamma = C$ is determined by $\text{ᛉ}$'
        correct: true
      - text: 'It is fixed: $\nabla$ is the Levi-Civita connection of $g$, and only the metric varies'
        feedback: |
          Then $\nabla g_\text{ᛊ}\neq0$ and $R$ would no longer be the Ricci scalar of $g_\text{ᛊ}$. In the action, every ingredient is recomputed from the metric being tested.
      - text: 'It is varied independently of $g$, with extra field equations'
        feedback: |
          That is the Palatini variation, a different procedure: for this action it leads to the same field equations (not shown here), but it is not what was done in the lesson.
      - text: 'It does not enter the action'
        feedback: |
          It does: $R$ is built from $\Gamma$ and $\partial\Gamma$.
    explanation: |
      The name "Palatini identity" for $\delta\mathrm{Ric}$ refers to the formula alone; the variation here is of the metric only, with $\Gamma[g_\text{ᛊ}]$.

  - type: text
    id: summary
    body: |
      **Next:** the Einstein equations $G = 8\pi G_N\,T$ now follow from one scalar $R$ plus the response $T$ of the matter action. But what is $T$ for real matter? The next lesson computes it for fields (starting from an action with no derivatives of $g$, then electromagnetism) and shows why its divergence vanishes: local energy and momentum conservation, a consequence of the Bianchi identity.
