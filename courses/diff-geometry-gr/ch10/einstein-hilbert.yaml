id: ch10-einstein-hilbert
title: The Einstein Equations from an Action · Part 1
kind: concept

own: |
  - **Setting**: $g$ is a Lorentzian metric on the spacetime $\mathcal{M}$, $(g^{-1})^{ab}$ its inverse matrix in a chart with coordinates $x$, $\Gamma^k_{ab}$ the Christoffel symbols and $\nabla$ the Levi-Civita connection of $g$, $\mathrm{Ric}_{ab}$ the Ricci tensor and
  $$R := (g^{-1})^{ab}\,\mathrm{Ric}_{ab}$$
  the scalar curvature; $G_N$ is Newton's constant.
  - **Action**: the metric is the unknown, and the Einstein–Hilbert action of a region $\mathcal{D}$ (compact closure in a chart) is
  {{ $$S_\mathcal{D}[g] = \kappa\int_{\mathcal{D}}\sqrt{-\det g}\;R\;d^4x$$ }}
  with $\kappa = -1/(16\pi G_N)$, variations $g_{\text{ᛊ}} = g + \text{ᛊ}\,\text{ᛉ}$, $\text{ᛊ}\in\mathbb{R}$ small, $\text{ᛉ}$ a symmetric $(0,2)$ tensor field, $\text{ᛉ}$ and $\partial\text{ᛉ}$ zero on $\partial\mathcal{D}$, and $\delta F := \frac{d}{d\text{ᛊ}}F_\text{ᛊ}\big|_0$.
  - **Three variations**: with $(g^{-1})^{ab}$ the inverse metric,
  {{ $$\delta (g^{-1})^{ab} = -(g^{-1})^{ar}(g^{-1})^{bs}\,\text{ᛉ}_{rs}$$ }}
  {{ $$\delta\sqrt{-\det g} = \tfrac12\sqrt{-\det g}\;(g^{-1})^{ij}\,\text{ᛉ}_{ij}$$ }}
  and the Palatini identity, with $C^k_{ab} := \delta\Gamma^k_{ab}$ a tensor,
  {{ $$\delta\,\mathrm{Ric}_{ab} = (\nabla_{m}C)^m_{ab} - (\nabla_{b}C)^m_{am}$$ }}
  - **Total derivative**: $(g^{-1})^{ab}\,\delta\mathrm{Ric}_{ab}$ is a divergence, $\nabla_mV^m$ for a vector field $V$ built from $C$, and
  {{ $$\sqrt{-\det g}\,\nabla_mV^m = \partial_m(\sqrt{-\det g}\,V^m)$$ }}
  whose integral over $\mathcal{D}$ vanishes because $\text{ᛉ}$ and $\partial\text{ᛉ}$ vanish on $\partial\mathcal{D}$.

cards:
  - type: text
    id: hook
    title: What do we extremize?
    body: |
      Geodesics came from a principle: among all curves with the same endpoints, the critical ones for the **length** $\int\sqrt{g(v,v)}\,d\lambda$ are the straight lines of the geometry. The metric $g$ was given, and the curve was the unknown.

      Now turn it around. Let the **metric itself be the unknown**: among all Lorentzian metrics on a region of spacetime, which one is *critical* for some number $S[g]$?

      Requirements for the integrand of $S[g] = \int(\ \ )\,d^4x$:
      - built **only from $g$** and its derivatives (no extra structure);
      - **independent of the chart**: a scalar, integrated against the volume density;
      - not so complicated that it needs high derivatives of $g$.

      Before any theory, guess what it should be.

  - type: mcq
    id: hook-predict
    title: Before any theory, guess
    prompt: |
      Which scalar, built from the metric $g$ and its derivatives, is the **simplest** candidate for the integrand of $S[g]$ (integrated over a region of spacetime, with the volume density $\sqrt{-\det g}$)?
    options:
      - text: 'The constant $1$ (so $S$ is the spacetime volume)'
        feedback: |
          It is a legitimate scalar, but its variation gives $(g^{-1})^{ij} = 0$ (see the volume-density card below), impossible for a metric: no spacetime is critical for volume alone. It carries no information about curvature.
      - text: 'The Ricci scalar $R = (g^{-1})^{ab}\mathrm{Ric}_{ab}$'
        correct: true
      - text: 'The squared Riemann tensor $\mathrm{Riem}\cdot\mathrm{Riem}$ (all indices contracted)'
        feedback: |
          A scalar too, but it contains the **square** of second derivatives of $g$. Its equations would involve four derivatives of the metric. The simplest curvature scalar is the one **linear** in the curvature, $R$.
      - text: 'A component such as $g_{00}$'
        feedback: |
          A single component is not a scalar: it changes with the chart, so its integral has no chart-independent meaning.
    explanation: |
      Scalars that are linear in curvature: only the Ricci scalar $R$ (the trace of the Ricci tensor, which is itself a trace of the Riemann tensor). It is the lesson's candidate; later we check that it produces **second-order** equations, which the other scalars do not.

  - type: text
    id: recall-volume
    title: Recall the volume density
    body: |
      Recall (integration on manifolds): in a chart $(\mathcal{U},\mathscr{X})$ with coordinates $x^0,\dots,x^3$, write $g_{ij}$ for the components of $g$ and $\det g$ for the determinant of the matrix $(g_{ij})$. In a Lorentzian spacetime with signature $(+,-,-,-)$, $\det g<0$. The integral of a function $F$ over a region $\mathcal{D}$ is
      $$\int_{\mathcal{D}}\Omega^g F = \int_{\mathscr{X}(\mathcal{D})}\sqrt{-\det g}\;F\;d^4x.$$
      Here $\Omega^g$ is the volume form of $g$ and $\sqrt{-\det g}$ ($=\sqrt{|\det g|}$) the **volume density** of the chart: between two charts it picks up $|\det(\partial x/\partial y)|$, exactly the factor that makes $d^4x$ transform. This is why the integrand must carry $\sqrt{-\det g}$: without it, the integral of a scalar would depend on the chart.

  - type: mcq
    id: volume-needed
    title: Why $\sqrt{-\det g}$
    prompt: |
      Two charts cover a region $\mathcal{D}$, and $F$ is a scalar function. Why is $\int F\,d^4x$ (no density) not a good candidate for a chart-independent action?
    options:
      - text: 'Changing chart multiplies $d^4x$ by the Jacobian determinant, so $\int F\,d^4x$ gives different numbers; the factor $\sqrt{-\det g}$ cancels exactly that'
        correct: true
      - text: 'Because $F$ is not a function of $x$'
        feedback: |
          $F$ is a smooth function; it is represented in each chart. The problem is the measure $d^4x$, not $F$.
      - text: 'Because $\det g$ is positive in Lorentzian signature'
        feedback: |
          It is negative with signature $(+,-,-,-)$, which is why the density is $\sqrt{-\det g}$ and not $\sqrt{\det g}$. That is about the sign inside the root, not about why a density is needed.
      - text: 'It is chart independent already, since a scalar does not change'
        feedback: |
          The **values** of $F$ do not change, but the coordinate volume $d^4x$ does (compare $dx\,dy$ and $r\,dr\,d\theta$). The density restores invariance.
    explanation: |
      Compare $dx\,dy$ with $r\,dr\,d\theta$: the extra factor $r = \sqrt{\det g_{\text{polar}}}$ is the volume density of the polar chart.

  - type: text
    id: action-def
    title: The Einstein–Hilbert action
    body: |
      Setting: a spacetime of dimension $4$, signature $(+,-,-,-)$, Levi-Civita connection $\nabla$ (the unique torsion-free one with $\nabla g = 0$), a chart $(\mathcal{U},\mathscr{X})$, and a region $\mathcal{D}$ whose closure is compact and lies in $\mathcal{U}$ (so integrals are finite). Index sums are implied; $(g^{-1})^{ab}$ are the components of the inverse metric (matrix inverse of $(g_{ab})$).

      The **Einstein–Hilbert action** of $\mathcal{D}$ is
      $$S_\mathcal{D}[g] := \kappa\int_{\mathcal{D}}\sqrt{-\det g}\;R\;d^4x,$$
      $$\kappa := -\frac{1}{16\pi G_N}.$$
      $G_N$ is Newton's constant, with $c = 1$. The constant $\kappa$ is a convention chosen so that matter will come with the factor $8\pi G_N$ at the end; it does not change which metrics are critical in vacuum.

      One difference with geodesics: here there is **no background**. $R$, $\sqrt{-\det g}$ and $\Gamma$ are all computed from the metric being tested. The connection is not varied on its own; it follows $g$ through the Levi-Civita formula.

  - type: numeric
    id: scaling
    title: A scaling check
    prompt: |
      In dimension $4$, replace the metric by $\tilde g = 2g$ (constant factor). The Levi-Civita connection and $\mathrm{Ric}_{ab}$ are unchanged. By what factor does the integrand $\sqrt{-\det g}\,R$ change? (Remember $R = (g^{-1})^{ab}\mathrm{Ric}_{ab}$ and $\det$ of a $4\times4$ matrix.)
    answer: 2
    tolerance: 0.001
    answerText: '2'
    wrong:
      - { value: 4, feedback: 'That is the factor of $\sqrt{-\det g}$ alone ($\det(2g) = 16\det g$, root gives $4$). $R$ also changes: the inverse metric gets a factor $1/2$.' }
      - { value: 0.5, feedback: 'That is the factor of $R$ alone ($(g^{-1})^{ab}\to\tfrac12(g^{-1})^{ab}$). The volume density grows by $4$.' }
      - { value: 8, feedback: 'The density gives $4$, and $R$ gives $\tfrac12$ (not $2$): the inverse metric shrinks.' }
    hint: '$\sqrt{-\det(2g)} = \sqrt{16}\sqrt{-\det g}$, and $(2g)^{-1} = \tfrac12g^{-1}$.'
    explanation: |
      $\sqrt{-\det\tilde g} = 4\sqrt{-\det g}$ and $\tilde R = \tfrac12R$, so the integrand grows by $4\cdot\tfrac12 = 2$. In general, $g\to\lambda^2g$ gives $\lambda^4\cdot\lambda^{-2} = \lambda^2$.

  - type: text
    id: variation-def
    title: What "varying $g$" means
    body: |
      For a curve, one deforms $\gamma\to\gamma+\text{ᛊ}\,\eta$ with fixed endpoints. For a metric, deform

      $$g_\text{ᛊ} := g + \text{ᛊ}\,\text{ᛉ},\qquad \text{ᛊ}\in\mathbb{R},$$
      where $\text{ᛉ}$ (a rune, **not** a number) is a symmetric $(0,2)$-tensor field, with components $\text{ᛉ}_{ij}$. For $|\text{ᛊ}|$ small, $g_\text{ᛊ}$ is still Lorentzian: $\det g_\text{ᛊ}$ is continuous in $\text{ᛊ}$ and negative at $\text{ᛊ}=0$, on the compact support of $\text{ᛉ}$.

      The "endpoints" are now the boundary $\partial\mathcal{D}$ of the region: require $\text{ᛉ} = 0$ **and its first derivatives $= 0$** there, so the metric and its first derivatives agree for all members of the family. The first derivatives matter because $R$ contains second derivatives of $g$.

      For anything computed from $g_\text{ᛊ}$,
      $$\delta F := \frac{d}{d\text{ᛊ}}F_\text{ᛊ}\Big|_{\text{ᛊ}=0},\qquad\text{e.g. }\ \delta g_{ij} = \text{ᛉ}_{ij}.$$
      $\delta$ obeys the product and chain rules and commutes with $\partial_k$. The metric is **critical** if $\frac{d}{d\text{ᛊ}}S_\mathcal{D}[g_\text{ᛊ}]\big|_0 = 0$ for every admissible $\text{ᛉ}$.

  - type: mcq
    id: admissible
    title: Which $\text{ᛉ}$ are allowed
    prompt: |
      In $g_\text{ᛊ} = g + \text{ᛊ}\,\text{ᛉ}$, which condition on $\text{ᛉ}$ is **required** for $g_\text{ᛊ}$ to be a candidate metric (before any boundary condition)?
    options:
      - text: '$\text{ᛉ}_{ij} = \text{ᛉ}_{ji}$ (symmetric)'
        correct: true
      - text: '$\text{ᛉ}_{ij} = -\text{ᛉ}_{ji}$ (antisymmetric)'
        feedback: |
          A metric is symmetric, and $g_{ij}$ symmetric plus an antisymmetric piece is not. Antisymmetric $\text{ᛉ}$ would also drop out of $\text{ᛉ}_{ij}(\hat G)^{ij}$ below.
      - text: '$\text{ᛉ}_{ij}$ has signature $(+,-,-,-)$'
        feedback: |
          Nothing is required of the signature of $\text{ᛉ}$: only $g_\text{ᛊ}$ must be Lorentzian, and for small $|\text{ᛊ}|$ it is automatically.
      - text: '$\text{ᛉ} = g$ only'
        feedback: |
          That is one admissible direction (a rescaling), but not the only one: **every** symmetric $\text{ᛉ}$ counts, and arbitrariness of $\text{ᛉ}$ is what turns the integral condition into a pointwise equation at the end.
    explanation: |
      Symmetric $\text{ᛉ}$ (10 independent components in dimension 4), with $\text{ᛉ}$ and $\partial\text{ᛉ}$ vanishing on $\partial\mathcal{D}$.

  - type: text
    id: strategy
    title: The plan
    body: |
      Write the integrand as $\sqrt{-\det g}\,R$ and differentiate. By the product rule, and $R = (g^{-1})^{ab}\mathrm{Ric}_{ab}$,
      $$\begin{aligned}\delta\big(\sqrt{-\det g}\,R\big) = {}&\delta\sqrt{-\det g}\;R\\ &+ \sqrt{-\det g}\,\delta (g^{-1})^{ab}\,\mathrm{Ric}_{ab}\\ &+ \sqrt{-\det g}\,(g^{-1})^{ab}\,\delta\mathrm{Ric}_{ab}.\end{aligned}$$
      Three ingredients: (A) the volume density $\delta\sqrt{-\det g}$, (B) the inverse metric $\delta (g^{-1})^{ab}$, (C) the Ricci tensor $\delta\mathrm{Ric}_{ab}$. Then: collect everything that carries **derivatives** of $\text{ᛉ}$ into one divergence, drop it with the boundary conditions, and read off what multiplies $\text{ᛉ}_{ij}$.

  - type: order
    id: inverse-derivation
    title: (B) The inverse metric
    prompt: Put the derivation of $\delta (g^{-1})^{ab}$ in order.
    steps:
      - 'For every $\text{ᛊ}$: $(g_\text{ᛊ}^{-1})^{ar}\,(g_\text{ᛊ})_{rs} = \delta^a_s$ (inverse matrices).'
      - 'Differentiate at $\text{ᛊ}=0$ with the product rule: $\delta (g^{-1})^{ar}\,g_{rs} + (g^{-1})^{ar}\,\text{ᛉ}_{rs} = 0$, since the right side is constant.'
      - 'Multiply by $(g^{-1})^{sb}$ and use $g_{rs}(g^{-1})^{sb} = \delta^b_r$: $\delta (g^{-1})^{ab} + (g^{-1})^{ar}(g^{-1})^{sb}\,\text{ᛉ}_{rs} = 0$.'
      - 'Solve: $\delta (g^{-1})^{ab} = -(g^{-1})^{ar}\,(g^{-1})^{bs}\,\text{ᛉ}_{rs}$.'
    hint: Start from the identity that holds for every $\text{ᛊ}$.
    explanation: |
      The same trick as $\frac{d}{dt}(1/f) = -f'/f^2$, with matrices: $\delta(g^{-1}) = -g^{-1}(\delta g)\,g^{-1}$. It is **not** the entrywise reciprocal of $\text{ᛉ}$.

  - type: numeric
    id: inverse-check
    title: Check $\delta (g^{-1})$ by hand
    prompt: |
      Take $g = \mathrm{diag}(1,-1,-1,-1)$ and $\text{ᛉ}_{11} = 2$ (all other components $0$). So $(g_\text{ᛊ})_{11} = -1+2\text{ᛊ}$, and $(g_\text{ᛊ}^{-1})^{11} = 1/(-1+2\text{ᛊ})$. Compute $\delta (g^{-1})^{11}$, the derivative at $\text{ᛊ} = 0$.
    answer: -2
    tolerance: 0.001
    answerText: '-2'
    wrong:
      - { value: 2, feedback: 'The sign is lost: $\frac{d}{d\text{ᛊ}}\frac{1}{-1+2\text{ᛊ}} = \frac{-2}{(-1+2\text{ᛊ})^2}$, negative. In the formula, $-(g^{-1})^{11}(g^{-1})^{11}\text{ᛉ}_{11} = -(-1)(-1)(2)$.' }
      - { value: -0.5, feedback: 'The inverse of $\text{ᛉ}_{11}=2$ is not what enters. The formula multiplies $\text{ᛉ}_{11}$ by $(g^{-1})^{11}$ twice.' }
      - { value: 1, feedback: 'Compute the derivative of $1/(-1+2\text{ᛊ})$ at $0$ (chain rule), or use $-(g^{-1})^{11}(g^{-1})^{11}\text{ᛉ}_{11}$.' }
    hint: 'Both routes: the chain rule on $1/(-1+2\text{ᛊ})$, or the formula $-(g^{-1})^{ar}(g^{-1})^{bs}\text{ᛉ}_{rs}$ with $a=b=r=s=1$.'
    explanation: |
      $\frac{d}{d\text{ᛊ}}(-1+2\text{ᛊ})^{-1}\big|_0 = -2/(-1)^2 = -2$, and the formula gives $-(-1)(-1)\cdot2 = -2$. Both agree.

  - type: text
    id: volume-variation
    title: (A) The volume density
    body: |
      Write $g_\text{ᛊ} = g + \text{ᛊ}\,\text{ᛉ} = g\,(1 + \text{ᛊ}M)$ in matrix form, with $M := g^{-1}\text{ᛉ}$, i.e. $M^k{}_j = (g^{-1})^{kl}\text{ᛉ}_{lj}$. Then
      $$\begin{aligned}\det g_\text{ᛊ} &= \det g\;\det(1+\text{ᛊ}M)\\ &= \det g\,\big(1 + \text{ᛊ}\,\mathrm{tr}\,M\\ &\qquad + O(\text{ᛊ}^2)\big),\end{aligned}$$
      because in the Leibniz sum for $\det(1+\text{ᛊ}M)$ every permutation other than the identity has at least two off-diagonal factors, each $O(\text{ᛊ})$, so it is $O(\text{ᛊ}^2)$; the identity gives $\prod_k(1+\text{ᛊ}M^k{}_k) = 1+\text{ᛊ}\,\mathrm{tr}\,M+O(\text{ᛊ}^2)$. Taking the square root, $\sqrt{1+x}\approx1+x/2$:
      $$\begin{aligned}\delta\sqrt{-\det g} &= \tfrac12\sqrt{-\det g}\;\mathrm{tr}\,M\\ &= \tfrac12\sqrt{-\det g}\\ &\quad\cdot(g^{-1})^{ij}\,\text{ᛉ}_{ij}.\end{aligned}$$
      The volume changes in proportion to the **trace** of the deformation measured by $g$.

  - type: numeric
    id: volume-check
    title: Check with a stretch
    prompt: |
      $g = \mathrm{diag}(1,-1,-1,-1)$ and $\text{ᛉ} = \mathrm{diag}(0,2,2,2)$: $g_\text{ᛊ} = \mathrm{diag}(1,-1+2\text{ᛊ},-1+2\text{ᛊ},-1+2\text{ᛊ})$, so $\sqrt{-\det g_\text{ᛊ}} = (1-2\text{ᛊ})^{3/2}$. What is $\delta\sqrt{-\det g}\,/\sqrt{-\det g}$ at $\text{ᛊ}=0$, computed by the formula $\frac12(g^{-1})^{ij}\text{ᛉ}_{ij}$?
    answer: -3
    tolerance: 0.001
    answerText: '-3'
    wrong:
      - { value: 3, feedback: 'The signs: $(g^{-1})^{ii} = -1$ for the three space directions, each with $\text{ᛉ}_{ii} = 2$, so the trace is $-6$, not $+6$.' }
      - { value: -6, feedback: 'The trace is $-6$, but the formula has the factor $\tfrac12$: the square root halves the logarithmic derivative.' }
      - { value: 0, feedback: 'The time slot contributes $0$ since $\text{ᛉ}_{00}=0$, but the three space slots contribute $\tfrac12\cdot3\cdot(-1)(2)$.' }
    hint: 'Sum $\tfrac12 (g^{-1})^{ii}\text{ᛉ}_{ii}$ over $i = 1,2,3$. Cross-check: derivative of $(1-2\text{ᛊ})^{3/2}$ at $0$.'
    explanation: |
      $\frac12\big[(-1)(2)\cdot3\big] = -3$, and $\frac{d}{d\text{ᛊ}}(1-2\text{ᛊ})^{3/2}\big|_0 = -3$. The three stretched space directions have $g_{ii}=-1+2\text{ᛊ}$, i.e. their magnitude **shrinks**.

  - type: numeric
    id: volume-scaling
    title: Volume density under rescaling
    prompt: |
      Now $\text{ᛉ} = g$, i.e. $g_\text{ᛊ} = (1+\text{ᛊ})\,g$, in dimension $4$. Using $\delta\sqrt{-\det g} = \frac12\sqrt{-\det g}\,(g^{-1})^{ij}\text{ᛉ}_{ij}$, what is $\delta\sqrt{-\det g}\,/\sqrt{-\det g}$? (Check: $\sqrt{-\det g_\text{ᛊ}} = (1+\text{ᛊ})^2\sqrt{-\det g}$.)
    answer: 2
    tolerance: 0.001
    answerText: '2'
    wrong:
      - { value: 4, feedback: 'That is the trace $(g^{-1})^{ij}g_{ij} = 4$; the formula has the factor $\tfrac12$.' }
      - { value: 1, feedback: 'The trace of the identity on a $4$-dimensional space is $4$, not $2$; with the $\tfrac12$ you get $2$.' }
    hint: '$(g^{-1})^{ij}g_{ij} = \delta^i_i = 4$.'
    explanation: |
      $\tfrac12\cdot4 = 2$, matching $\frac{d}{d\text{ᛊ}}(1+\text{ᛊ})^2\big|_0 = 2$.

  - type: text
    id: ricci-variation
    title: (C) The Ricci tensor
    body: |
      In a chart, with $\mathrm{Ric}_{ab} = \mathrm{Riem}^m{}_{amb}$,
      $$\mathrm{Ric}_{ab} = \partial_m\Gamma^m_{ab} - \partial_b\Gamma^m_{am} + \Gamma^m_{rm}\Gamma^r_{ab} - \Gamma^m_{rb}\Gamma^r_{am}.$$
      This holds for **every** metric, so it holds for $g_\text{ᛊ}$; differentiate in $\text{ᛊ}$. Everything is expressed through the variation of the connection,
      $$\begin{aligned}C^k_{ji} := \delta\Gamma^k_{ji} = \tfrac12\,(g^{-1})^{km}\Big(&(\nabla_i\text{ᛉ})_{mj}\\ &+ (\nabla_j\text{ᛉ})_{mi}\\ &- (\nabla_m\text{ᛉ})_{ij}\Big),\end{aligned}$$
      where $\nabla_i := \nabla_{\partial/\partial x^i}$. To get this, differentiate the Christoffel formula (with (B) for $(g^{-1})^{kn}$), then compare with the three covariant derivatives of $\text{ᛉ}$: the $\partial\text{ᛉ}$ terms match, and the leftover $\Gamma\text{ᛉ}$ terms combine exactly into the $-\Gamma$ corrections of $\nabla\text{ᛉ}$ (one $-\Gamma$ per lower index).

  - type: mcq
    id: C-tensor
    title: A tensor from non-tensors
    prompt: |
      The Christoffel symbols $\Gamma^k_{ji}$ are **not** the components of a tensor (their transformation law has an extra inhomogeneous term), yet $C^k_{ji} = \delta\Gamma^k_{ji}$ is. Why?
    options:
      - text: 'The inhomogeneous term depends only on the chart change, not on the metric, so it is the same for $g_\text{ᛊ}$ and $g$ and cancels in the derivative in $\text{ᛊ}$'
        correct: true
      - text: 'Because $\text{ᛉ}$ is a tensor, so everything built from it is'
        feedback: |
          Not automatic: $\text{ᛉ}$ is a tensor, but $\Gamma$ (a connection coefficient) is not, and what we differentiate is $\Gamma_\text{ᛊ}$. What saves us is a cancellation.
      - text: 'Because $\delta$ is zero on $\partial\mathcal{D}$'
        feedback: |
          That is the boundary condition, unrelated to whether $C$ is a tensor in the interior.
      - text: 'It is not a tensor; only $\Gamma$ itself is'
        feedback: |
          It is the other way round: $\Gamma$ is not a tensor, $C$ is (the difference of two connections is a tensor).
    explanation: |
      Under a chart change, $\Gamma_\text{ᛊ}$ and $\Gamma$ both get the **same** extra second-derivative term. Subtract (or differentiate in $\text{ᛊ}$) and it disappears: what is left transforms as a $(1,2)$-tensor. This is why covariant derivatives of $C$ make sense.

  - type: text
    id: palatini
    title: The Palatini identity
    body: |
      Insert $\delta\Gamma = C$ into the $\text{ᛊ}$-derivative of the Ricci formula. Every product $\Gamma\,\delta\Gamma$ finds its place in a **covariant derivative** of $C$ (one $+\Gamma$ for the upper index, one $-\Gamma$ for each lower index), and the two leftover terms cancel by the symmetry $\Gamma^r_{bm} = \Gamma^r_{mb}$ (torsion-free). The result:
      $$\boxed{\begin{aligned}\delta\,\mathrm{Ric}_{ab} = &(\nabla_mC)^m_{ab}\\ &- (\nabla_bC)^m_{am}\end{aligned}}$$
      This is the **Palatini identity**.
      Nothing in it is a bare derivative of $\text{ᛉ}$ times a non-tensor: it is an honest tensor equation, a divergence-like combination of the tensor $C$.

  - type: text
    id: trace-palatini
    title: Contract it to get a divergence
    body: |
      Contract with $(g^{-1})^{ab}$. Because $\nabla g = 0$, the inverse metric passes through $\nabla$:
      $$(g^{-1})^{ab}\,\delta\mathrm{Ric}_{ab} = \nabla_mV^m,$$
      with the vector field
      $$V^m := (g^{-1})^{ab}C^m_{ab} - (g^{-1})^{am}C^n_{an}.$$
      Now recall the formula for the divergence of a vector field (from the lesson Integration on Manifolds): since $\Gamma^n_{nm} = \partial_m\ln\sqrt{-\det g}$,
      $$\sqrt{-\det g}\;\nabla_mV^m = \partial_m\big(\sqrt{-\det g}\;V^m\big).$$
      So $\sqrt{-\det g}\,(g^{-1})^{ab}\delta\mathrm{Ric}_{ab}$ is an ordinary **total derivative** $\partial_mF^m$, with $F^m := \sqrt{-\det g}\,V^m$.

      Why this matters: $\delta\mathrm{Ric}$ contains the **second** derivatives of $\text{ᛉ}$, i.e. the dangerous terms that could give fourth-order equations. They all sit inside one divergence.

  - type: mcq
    id: boundary-term
    title: Why the divergence drops out
    prompt: |
      $\int_\mathcal{D}\partial_mF^m\,d^4x$ is a sum of integrals of derivatives, so by the fundamental theorem of calculus it equals $F^m$ evaluated on the boundary $\partial\mathcal{D}$. Here $F^m$ is linear in $\text{ᛉ}$ **and** $\partial\text{ᛉ}$ (through $C$). Which boundary condition makes the integral vanish?
    options:
      - text: '$\text{ᛉ} = 0$ and $\partial\text{ᛉ} = 0$ on $\partial\mathcal{D}$'
        correct: true
      - text: '$\text{ᛉ} = 0$ on $\partial\mathcal{D}$ alone'
        feedback: |
          Tempting, as for geodesics with fixed endpoints. But $F^m$ contains $\partial\text{ᛉ}$ (through $C = \tfrac12 g^{-1}\nabla\text{ᛉ}\dots$), and $\partial\text{ᛉ}$ does not have to vanish just because $\text{ᛉ}$ does. A leftover boundary term is what the Gibbons–Hawking–York term would cancel.
      - text: 'Nothing: the integral of a divergence is always zero'
        feedback: |
          Only if the vector field vanishes on the boundary, or on a closed manifold without boundary. On a region with boundary, the integral equals the flux through $\partial\mathcal{D}$.
      - text: '$g = 0$ on $\partial\mathcal{D}$'
        feedback: |
          The metric cannot vanish: it is Lorentzian everywhere. The condition is on the **variation** $\text{ᛉ}$.
    explanation: |
      Order two of $R$ in $g$ is why the first derivatives are held fixed: the fixed data are the metric and its first derivatives on $\partial\mathcal{D}$, as the position (and velocity) are fixed for higher-order Lagrangians.

  - type: order
    id: proof-order
    title: The structure of the variation
    prompt: Put the steps of the variation of $S_\mathcal{D}$ in order.
    steps:
      - 'Differentiate under the integral: $\delta\big(\sqrt{-\det g}\,R\big)$ by the product rule, giving (A), (B), (C).'
      - 'Insert $\delta\sqrt{-\det g}$, $\delta (g^{-1})^{ab}$ and the Palatini identity for $\delta\mathrm{Ric}_{ab}$.'
      - 'Collect: the terms with $\text{ᛉ}_{ij}$ undifferentiated, plus one total derivative $\partial_mF^m$.'
      - 'Integrate over $\mathcal{D}$: the divergence gives a boundary term, which vanishes since $\text{ᛉ}$, $\partial\text{ᛉ}$ vanish on $\partial\mathcal{D}$.'
      - 'The integral $\int(\dots)^{ij}\text{ᛉ}_{ij}$ vanishes for **every** admissible $\text{ᛉ}$, so the coefficient vanishes at every point.'
    hint: Expand first, collect second, drop the boundary third, use arbitrariness last.
    explanation: |
      The same five-step pattern as for geodesics (Euler–Lagrange): differentiate, integrate by parts, drop the endpoints, conclude from arbitrariness of the variation.

