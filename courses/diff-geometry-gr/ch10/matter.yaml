id: ch10-matter
title: Coupling to Matter · Part 1
kind: concept

own: |
  - **Setting**: $g$ is the Lorentzian metric of the spacetime (inverse $(g^{-1})^{ab}$, $\nabla$ its Levi-Civita connection, $G_N$ Newton's constant), $\text{ᛉ}$ a symmetric $(0,2)$ tensor field with which we vary $g$ (compact support), $\Phi$ the matter fields and $\mathcal{L}_M$ the matter Lagrangian density; $G = \mathrm{Ric}-\tfrac12R\,g$ is the Einstein tensor, with $R$ the scalar curvature, and the Einstein equation reads $G = 8\pi G_N T$; a hat means all indices raised with $g^{-1}$.
  - **Energy-momentum tensor**: for a matter action $S_M = \int\sqrt{-\det g}\,\mathcal{L}_M\,d^4x$, the symmetric tensor $T$ is the response of $S_M$ to the metric,
  {{ $$\delta S_M = -\tfrac12\int\sqrt{-\det g}\;\hat T^{ij}\,\text{ᛉ}_{ij}\,d^4x$$ }}
  where $\hat T^{ij}$ is $T_{ab}$ with both indices raised by $(g^{-1})^{ab}$, just as a current is the response of the action to the potential.
  - **No derivatives of $g$ in $\mathcal{L}_M$**: if $\delta\mathcal{L}_M = \Theta^{ij}\,\text{ᛉ}_{ij}$ ($\Theta$ symmetric), then
  {{ $$\hat T^{ij} = -2\,\Theta^{ij} - \mathcal{L}_M\,(g^{-1})^{ij}$$ }}
  the second term coming from the volume density.
  - **Constant term**: $\mathcal{L}_M = -\lambda$ ($\lambda\in\mathbb{R}$) gives {{ $T_{ab} = \lambda g_{ab}$ }} (energy density $\rho = \lambda$ and pressure $p = -\rho$ at $g = \mathrm{diag}(1,-1,-1,-1)$): it repels, $\mathrm{Ric}_{00} = -8\pi G_N\lambda$.
  - **Scalar field** $\phi$ (a function on spacetime) with potential $V(\phi)$, $\mathcal{L}_M = \tfrac12(g^{-1})^{ab}\partial_a\phi\,\partial_b\phi - V(\phi)$: {{ $T_{ab} = \partial_a\phi\,\partial_b\phi - g_{ab}\mathcal{L}_M$ }}, with $\rho = \tfrac12\dot\phi^2 + V$ and $p = \tfrac12\dot\phi^2 - V$ for a field depending on time only. The sign of the kinetic term is fixed by $T_{00}\ge0$.

cards:
  - type: text
    id: hook
    title: Where does the right-hand side come from?
    body: |
      The lesson The Einstein Equations from an Action · Part 2 ended with $G = 8\pi G_N\,T$, with a symmetric $(0,2)$-tensor field $T$ on the right that we defined, but never computed for any real matter. Does it have to be guessed, field by field?

      No, and the reason is an old idea from electromagnetism. A **charge current** $J$ is not put in by hand: it is the **response of the action to the potential**. If the matter action changes by $\delta S$ when the potential changes by $\delta A$, then $J$ is the coefficient of that change.

      Gravity has exactly the same structure, with the metric playing the role of the potential:
      $$\text{current } J \leftrightarrow \text{response to } A$$

      $$T\leftrightarrow\text{response to } g.$$
      So once we know the **action of a kind of matter**, its $T$ follows. In this lesson we compute it for a constant term and a scalar field; the next part treats the electromagnetic field and asks why energy and momentum come out conserved.

  - type: mcq
    id: hook-predict
    title: Before any theory, guess
    prompt: |
      Matter is described by fields $\Phi$ and an action $S_M[g,\Phi]$. Which statement about its energy-momentum tensor $T$ is the most reasonable?
    options:
      - text: '$T$ is obtained from $S_M$ by asking how $S_M$ responds to a change of the metric $g$'
        correct: true
      - text: '$T$ is a new field with its own equation, to be postulated separately for every kind of matter'
        feedback: |
          It would work, but it would waste the action. Since $S_M$ already depends on $g$, its response to $g$ is determined: $T$ is *computed*, not postulated.
      - text: '$T$ is obtained by varying $S_M$ with respect to the matter fields $\Phi$'
        feedback: |
          Varying $\Phi$ (with $g$ fixed) gives the **matter field equations**, e.g. Maxwell''s equations. $T$ comes from the other variation: of $g$ with $\Phi$ fixed.
      - text: '$T$ is the Ricci tensor of $g$'
        feedback: |
          That is the left side of the Einstein equations (up to the trace term). $T$ is a property of the matter.
    explanation: |
      Two independent variations of the total action: of $\Phi$ at fixed $g$ (the matter equations) and of $g$ at fixed $\Phi$ (the Einstein equations, with $T$ as the source).

  - type: text
    id: recall
    title: Recall the definition
    body: |
      Recall: the matter action is
      $$S_M[g,\Phi] = \int_\mathcal{D}\sqrt{-\det g}\;\mathcal{L}_M\,d^4x,$$
      where $\Phi$ stands for the matter fields (tensor fields on spacetime) and the **Lagrangian** $\mathcal{L}_M$ is a scalar function built from $\Phi$, its derivatives and $g$. A metric variation is $g_\text{ᛊ} = g + \text{ᛊ}\,\text{ᛉ}$ with $\text{ᛉ}$ symmetric and zero near $\partial\mathcal{D}$, and $\delta F := \frac{d}{d\text{ᛊ}}F_\text{ᛊ}\big|_0$.

      The energy-momentum tensor $T$ is *defined* by
      $$\delta S_M = -\frac12\int_\mathcal{D}\sqrt{-\det g}\;\hat T^{ij}\,\text{ᛉ}_{ij}\,d^4x,$$
      $$\hat T^{ij} := (g^{-1})^{ia}(g^{-1})^{jb}\,T_{ab},$$
      for every admissible $\text{ᛉ}$. Since $\text{ᛉ}$ is an arbitrary symmetric tensor, only the symmetric part of the coefficient matters: this fixes $T$ uniquely and symmetric.

      Also recall from the lesson The Einstein Equations from an Action · Part 1 the variation of the volume density:
      $$\delta\sqrt{-\det g} = \tfrac12\sqrt{-\det g}\;(g^{-1})^{ij}\,\text{ᛉ}_{ij}.$$

  - type: text
    id: derive
    title: When $\mathcal{L}_M$ has no derivatives of $g$
    body: |
      The simplest case: $\mathcal{L}_M$ depends on $g$ itself, but not on its derivatives. Then the change of $\mathcal{L}_M$ under $g\to g+\text{ᛊ}\,\text{ᛉ}$ is linear in $\text{ᛉ}$, with no derivative of $\text{ᛉ}$ in it:
      $$\delta\mathcal{L}_M = \Theta^{ij}\,\text{ᛉ}_{ij},$$
      where $\Theta^{ij}$ is a symmetric array computed from $\Phi$ and $g$ (the coefficient of $\text{ᛉ}_{ij}$).

      Now apply the product rule to the integrand $\sqrt{-\det g}\,\mathcal{L}_M$:
      $$\begin{aligned}\delta\big(\sqrt{-\det g}\,\mathcal{L}_M\big) = \sqrt{-\det g}\,\Big(&\tfrac12(g^{-1})^{ij}\mathcal{L}_M\\&+ \Theta^{ij}\Big)\text{ᛉ}_{ij}.\end{aligned}$$
      Compare with $-\frac12\sqrt{-\det g}\,\hat T^{ij}\,\text{ᛉ}_{ij}$. Both coefficients of $\text{ᛉ}_{ij}$ are symmetric, so they must be equal, and $\hat T^{ij}$ can be read off.

  - type: build
    id: derive-build
    title: Read off $\hat T^{ij}$
    prompt: |
      Matching $\sqrt{-\det g}\,\big(\tfrac12(g^{-1})^{ij}\mathcal{L}_M + \Theta^{ij}\big)$ with $-\tfrac12\sqrt{-\det g}\,\hat T^{ij}$, where $\delta\mathcal{L}_M = \Theta^{ij}\text{ᛉ}_{ij}$, build $\hat T^{ij}$.
    prefix: '\hat T^{ij} ='
    tiles: ['-2\,\Theta^{ij}', '-\mathcal{L}_M\,(g^{-1})^{ij}', '+\mathcal{L}_M\,(g^{-1})^{ij}', '-\Theta^{ij}', '+2\,\Theta^{ij}', '-\tfrac12\mathcal{L}_M\,(g^{-1})^{ij}']
    answers:
      - ['-2\,\Theta^{ij}', '-\mathcal{L}_M\,(g^{-1})^{ij}']
    wrong:
      - answer: ['-2\,\Theta^{ij}', '+\mathcal{L}_M\,(g^{-1})^{ij}']
        feedback: |
          Multiply $\tfrac12\mathcal{L}_M(g^{-1})^{ij} + \Theta^{ij} = -\tfrac12\hat T^{ij}$ by $-2$: both terms change sign, so the volume term is $-\mathcal{L}_M(g^{-1})^{ij}$.
      - answer: ['-\Theta^{ij}', '-\tfrac12\mathcal{L}_M\,(g^{-1})^{ij}']
        feedback: |
          That solves for $\tfrac12\hat T$. The factor $-\tfrac12$ in front of $\hat T$ in the definition means multiplying by $-2$, not by $-1$.
    hint: 'Multiply the matched equation $\tfrac12\mathcal{L}_M(g^{-1})^{ij} + \Theta^{ij} = -\tfrac12\hat T^{ij}$ by $-2$.'
    explanation: |
      $$\hat T^{ij} = -2\,\Theta^{ij} - \mathcal{L}_M\,(g^{-1})^{ij}.$$
      The first term is the response of $\mathcal{L}_M$ itself; the second comes from the volume density, and is present even if $\mathcal{L}_M$ were a constant.

  - type: mcq
    id: volume-term
    title: Where the second term comes from
    prompt: |
      In $\hat T^{ij} = -2\Theta^{ij} - \mathcal{L}_M(g^{-1})^{ij}$, what is the origin of the term $-\mathcal{L}_M(g^{-1})^{ij}$?
    options:
      - text: 'The variation of the volume density $\sqrt{-\det g}$, which also depends on $g$'
        correct: true
      - text: 'The variation of $\mathcal{L}_M$ itself, which is already the term $\Theta^{ij}$'
        feedback: |
          $\Theta^{ij}$ is exactly the response of $\mathcal{L}_M$. The extra term has another source.
      - text: 'A boundary term, which does not vanish for a general $\text{ᛉ}$'
        feedback: |
          $\text{ᛉ}$ vanishes near $\partial\mathcal{D}$, and no integration by parts was needed here (no derivatives of $g$ in $\mathcal{L}_M$).
      - text: 'An arbitrary choice of normalization of $T$'
        feedback: |
          The normalization $-\tfrac12$ is a convention, but the *relative* weight of the two terms is fixed: it comes from the product rule.
    explanation: |
      The action is an integral over a region measured by $g$ itself. Changing $g$ changes the volume element, and this contributes even when $\mathcal{L}_M$ does not depend on $g$ at all.

  - type: text
    id: constant
    title: "Check 1: a constant Lagrangian"
    body: |
      Take the simplest matter action: $\mathcal{L}_M = -\lambda$ with $\lambda$ a constant. It has no field and does not depend on $g$ (apart from the volume element), so $\Theta^{ij} = 0$ and
      $$\hat T^{ij} = -\mathcal{L}_M\,(g^{-1})^{ij} = \lambda\,(g^{-1})^{ij}$$

      $$\Longrightarrow\quad T_{ab} = \lambda\,g_{ab}.$$
      At a point where $g = \eta = \mathrm{diag}(1,-1,-1,-1)$, write $T_{ab} = \mathrm{diag}(\rho,p,p,p)$: $\rho$ is the **energy density** and $p$ the **pressure**. Here the energy density is $\rho = T_{00} = \lambda$.

  - type: numeric
    id: constant-p
    title: The pressure of a constant
    prompt: |
      For $\mathcal{L}_M = -\lambda$ with $\lambda = 3$, at a point where $g = \eta = \mathrm{diag}(1,-1,-1,-1)$, we found $T_{ab} = \lambda\,g_{ab}$. What is the pressure $p = T_{11}$?
    answer: -3
    tolerance: 0.001
    answerText: '-3'
    wrong:
      - { value: 3, feedback: 'That forgets the sign of the metric: $T_{11} = \lambda\,g_{11}$ and $g_{11} = -1$. A constant Lagrangian has *negative* pressure, $p = -\rho$.' }
      - { value: 0, feedback: 'The matter has no fields, but $T_{ab} = \lambda g_{ab}$ is non-zero in every direction, including space.' }
    hint: '$T_{11} = \lambda\,g_{11}$ and $g_{11} = -1$.'
    explanation: |
      $T_{11} = 3\cdot(-1) = -3 = -\rho$. This is the equation of state of a **vacuum energy** (a cosmological constant): $p = -\rho$.

  - type: numeric
    id: constant-ric
    title: Does it attract?
    prompt: |
      Use $\mathrm{Ric}_{ab} = 8\pi G_N\big(T_{ab} - \tfrac12 T\,g_{ab}\big)$, with $T := (g^{-1})^{ab}T_{ab}$ the trace. For $T_{ab} = \lambda\,g_{ab}$ in four dimensions at $g = \eta$, compute $\mathrm{Ric}_{00}$ in units of $\pi G_N\lambda$. (Newtonian dust, $T = \mathrm{diag}(\rho,0,0,0)$, has $\mathrm{Ric}_{00} = +4\pi G_N\rho>0$: attraction.)
    answer: -8
    tolerance: 0.001
    answerText: '-8'
    wrong:
      - { value: 8, feedback: 'Check the trace: $T = (g^{-1})^{ab}\lambda g_{ab} = 4\lambda$ in four dimensions, so $T_{00} - \tfrac12Tg_{00} = \lambda - 2\lambda = -\lambda$.' }
      - { value: 4, feedback: 'That is the dust value $4\pi G_N\rho$. For the constant term the pressure is not zero, and the trace is $4\lambda$.' }
    hint: '$T_{00} = \lambda$, $T = 4\lambda$, $g_{00} = 1$.'
    explanation: |
      $\mathrm{Ric}_{00} = 8\pi G_N\big(\lambda - \tfrac12\cdot4\lambda\big) = -8\pi G_N\lambda$. In general, $\mathrm{Ric}_{00} = 4\pi G_N(\rho + 3p)$; here $\rho + 3p = \lambda - 3\lambda = -2\lambda<0$: the constant term **repels**. Its Einstein equation $G = 8\pi G_N\lambda\,g$ is the cosmological constant term.

  - type: text
    id: scalar
    title: "Check 2: a scalar field"
    body: |
      A **scalar field** is a function $\phi$ on spacetime. Its simplest Lagrangian, with signature $(+,-,-,-)$ and a potential $V(\phi)$ (a given function of $\phi$), is
      $$\mathcal{L}_M = \tfrac12\,(g^{-1})^{ab}\,\partial_a\phi\,\partial_b\phi - V(\phi).$$
      The first term depends on $g$ only through the inverse metric. Recall $\delta(g^{-1})^{ab} = -(g^{-1})^{ar}(g^{-1})^{bs}\,\text{ᛉ}_{rs}$, and write $\partial^i\phi := (g^{-1})^{ia}\partial_a\phi$ (raised index).

  - type: mcq
    id: scalar-theta
    title: The coefficient $\Theta^{ij}$
    prompt: |
      For $\mathcal{L}_M = \tfrac12(g^{-1})^{ab}\partial_a\phi\,\partial_b\phi - V(\phi)$, with $\partial^i\phi = (g^{-1})^{ia}\partial_a\phi$, what is $\Theta^{ij}$ in $\delta\mathcal{L}_M = \Theta^{ij}\,\text{ᛉ}_{ij}$?
    options:
      - text: '$-\tfrac12\,\partial^i\phi\,\partial^j\phi$'
        correct: true
      - text: '$+\tfrac12\,\partial^i\phi\,\partial^j\phi$'
        feedback: |
          The sign: the inverse metric varies with a minus sign, $\delta(g^{-1})^{ab} = -(g^{-1})^{ar}(g^{-1})^{bs}\text{ᛉ}_{rs}$. A larger $g$ gives a smaller $g^{-1}$.
      - text: '$-\tfrac12\,(g^{-1})^{ij}\,\mathcal{L}_M$'
        feedback: |
          That is a volume-density type term, and it is not part of $\Theta$ (it enters separately in $\hat T^{ij}$). $\Theta$ is the response of $\mathcal{L}_M$ alone.
      - text: '$-\tfrac12\,V(\phi)\,(g^{-1})^{ij}$'
        feedback: |
          $V(\phi)$ does not depend on $g$ at all, so it does not contribute to $\Theta$.
    explanation: |
      Only the kinetic term depends on $g$: $\delta\big(\tfrac12(g^{-1})^{ab}\big)\partial_a\phi\,\partial_b\phi = -\tfrac12\,\partial^r\phi\,\partial^s\phi\,\text{ᛉ}_{rs}$. So $\Theta^{rs} = -\tfrac12\partial^r\phi\,\partial^s\phi$, symmetric as required.

  - type: text
    id: scalar-T
    title: The energy-momentum tensor of a scalar field
    body: |
      Insert $\Theta^{ij} = -\frac12\partial^i\phi\,\partial^j\phi$ in $\hat T^{ij} = -2\Theta^{ij} - \mathcal{L}_M(g^{-1})^{ij}$ and lower the indices:
      $$T_{ab} = \partial_a\phi\,\partial_b\phi - g_{ab}\,\mathcal{L}_M.$$
      Test it at a point where $g = \eta$, for a field that depends on time only, so that $\partial_0\phi = \dot\phi$ and $\partial_i\phi = 0$. Then $\mathcal{L}_M = \tfrac12\dot\phi^2 - V$.

  - type: numeric
    id: scalar-rho
    title: Energy density of a scalar
    prompt: |
      At a point with $g = \eta$, a scalar field with $\dot\phi = 2$ (time derivative), no spatial gradient, and $V(\phi) = 1$. Compute the energy density $\rho = T_{00}$ from $T_{ab} = \partial_a\phi\,\partial_b\phi - g_{ab}\mathcal{L}_M$.
    answer: 3
    tolerance: 0.001
    answerText: '3'
    wrong:
      - { value: 4, feedback: 'That is $\partial_0\phi\,\partial_0\phi$ alone. The term $-g_{00}\mathcal{L}_M$ (from the volume density) also contributes, with $\mathcal{L}_M = \tfrac12\dot\phi^2 - V$.' }
      - { value: 5, feedback: 'Sign slip in $\mathcal{L}_M$: it is $\tfrac12\dot\phi^2 - V = 2 - 1 = 1$, and $T_{00} = 4 - 1\cdot g_{00}$.' }
      - { value: 1, feedback: 'That is $\mathcal{L}_M$ itself. $T_{00} = \dot\phi^2 - \mathcal{L}_M$.' }
    hint: '$\mathcal{L}_M = \tfrac12\cdot4 - 1 = 1$, and $T_{00} = \dot\phi^2 - g_{00}\mathcal{L}_M$.'
    explanation: |
      $T_{00} = 4 - 1\cdot1 = 3 = \tfrac12\dot\phi^2 + V = 2 + 1$: kinetic energy plus potential energy, as a Hamiltonian would say.

  - type: numeric
    id: scalar-p
    title: Pressure of a scalar
    prompt: |
      Same data: $g = \eta$, $\dot\phi = 2$, no spatial gradient, $V = 1$. Compute the pressure $p = T_{11}$.
    answer: 1
    tolerance: 0.001
    answerText: '1'
    wrong:
      - { value: -1, feedback: 'Sign: $T_{11} = \partial_1\phi\,\partial_1\phi - g_{11}\mathcal{L}_M = 0 - (-1)\mathcal{L}_M = +\mathcal{L}_M$.' }
      - { value: 3, feedback: 'That is the energy density. The pressure is $T_{11}$, and $\partial_1\phi = 0$ here.' }
      - { value: 0, feedback: 'The gradient term vanishes, but $-g_{11}\mathcal{L}_M = +\mathcal{L}_M$ does not.' }
    hint: '$\partial_1\phi = 0$, $g_{11} = -1$, and $\mathcal{L}_M = 1$.'
    explanation: |
      $T_{11} = 0 + \mathcal{L}_M = \tfrac12\dot\phi^2 - V = 1$. In general $\rho = \tfrac12\dot\phi^2 + V$ and $p = \tfrac12\dot\phi^2 - V$: a potential-dominated field ($\dot\phi\to0$) has $p = -\rho$, like the constant of Check 1, which is the case $\dot\phi = 0$, $V = \lambda$.

  - type: mcq
    id: scalar-sign
    title: Which sign of the kinetic term?
    prompt: |
      Someone writes the scalar Lagrangian with the opposite kinetic sign, $\mathcal{L}' = -\tfrac12(g^{-1})^{ab}\partial_a\phi\,\partial_b\phi - V$. Repeating the computation at $g=\eta$ with $\partial_i\phi=0$ and $\partial_0\phi = \dot\phi$, what happens to $T_{00}$?
    options:
      - text: '$T_{00} = -\tfrac12\dot\phi^2 + V$: the kinetic part of the energy becomes negative (a "ghost")'
        correct: true
      - text: 'Nothing: $T_{00}$ is still $\tfrac12\dot\phi^2 + V$'
        feedback: |
          $\Theta$ flips sign with the kinetic term, and so does the $\partial\phi\,\partial\phi$ part of $T$: $T_{ab} = -\partial_a\phi\,\partial_b\phi - g_{ab}\mathcal{L}'$, giving $T_{00} = -\dot\phi^2 + \tfrac12\dot\phi^2 + V$.
      - text: '$T_{00} = 0$, since the two sign changes cancel'
        feedback: |
          Nothing cancels: $\Theta$ and $\mathcal{L}$ both flip, but $V$ does not.
      - text: '$T_{00}$ cannot be computed, because the action is not covariant'
        feedback: |
          It is a perfectly good scalar Lagrangian; it simply gives the wrong-sign energy.
    explanation: |
      The sign of the kinetic term is not a free convention: with signature $(+,-,-,-)$, only $+\tfrac12(g^{-1})^{ab}\partial_a\phi\,\partial_b\phi$ gives $T_{00} = \tfrac12\dot\phi^2 + \tfrac12|\nabla\phi|^2 + V\ge0$ (for $V\ge0$). The requirement $T_{00}\ge0$ selects the sign of the Lagrangian.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Next: Coupling to Matter · Part 2.** The recipe "$T$ is the response of the matter action to $g$" worked for a constant and a scalar field. What is $T$ for the electromagnetic field, which equations come from varying the potential and which from varying the metric, and why does matter automatically conserve energy and momentum, as the Bianchi identity demands?
