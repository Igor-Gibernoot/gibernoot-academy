id: ch10-spacetime
title: Spacetime and Time Orientation · Part 1
kind: concept

own: |
  - **Signature** $(n_+,n_-) = (1,3)$, i.e. $(+,-,-,-)$: at each point $p$ of the spacetime $\mathcal{M}$ (a 4-dimensional manifold with a Lorentzian metric $g$, a smooth choice of symmetric bilinear form $g_p$ on each tangent space $T_p\mathcal{M}$), some basis of $T_p\mathcal{M}$ gives
  {{ $$g_p = \mathrm{diag}(1,-1,-1,-1).$$ }}
  (The other convention, $(-,+,+,+)$, flips the sign of every inequality below.) In 1+1 dimensions with chart coordinates $a$ (space) and $\tau$ (time), Minkowski has
  $$g = d\tau\otimes d\tau - da\otimes da,$$
  so a vector $\mathcal{X}_p = (X^a,X^\tau)$ has
  $$g_p(\mathcal{X}_p,\mathcal{X}_p) = (X^\tau)^2 - (X^a)^2$$
  (upper indices are labels, not powers).
  - **Classes** of a non-zero $\mathcal{X}_p\in T_p\mathcal{M}$: classified by the squared length $g_p(\mathcal{X}_p,\mathcal{X}_p)$ (signature $(+,-,-,-)$):
  {{ $$\begin{aligned} \text{timelike:}\quad & g_p(\mathcal{X}_p,\mathcal{X}_p) > 0,\\ \text{lightlike (null):}\quad & g_p(\mathcal{X}_p,\mathcal{X}_p) = 0,\\ \text{spacelike:}\quad & g_p(\mathcal{X}_p,\mathcal{X}_p) < 0. \end{aligned}$$ }}
  **Causal** = timelike or lightlike. The zero vector has no class.
  - The lightlike vectors form the **light cone** at $p$, in $T_p\mathcal{M}$ with $g_p = \mathrm{diag}(1,-1,-1,-1)$ the set
  {{ $$(X^0)^2 = (X^1)^2 + (X^2)^2 + (X^3)^2,$$ }}
  a cone (closed under non-zero scaling) but not a subspace (two null vectors can add to a timelike one). The picture's Euclidean lengths and angles mean nothing: $(3,3)$ has $g = 0$, and $(0,2)$ has a larger $g$ than the longer arrow $(2.5,3)$.
  - A metric whose components vary with the point, such as
  $$g = d\tau\otimes d\tau - \bigl(da - \tfrac a4\,d\tau\bigr)\otimes\bigl(da - \tfrac a4\,d\tau\bigr)$$
  in the chart $(a,\tau)$, tilts the cones from point to point; each cone lives in its own tangent space.

cards:
  - type: text
    id: hook
    title: Two flashes and a ball
    body: |
      In an empty laboratory, use a space coordinate $a$ along a line and a time coordinate $\tau$, in units where light covers one unit of $a$ per unit of $\tau$ (the speed of light is $1$).

      At one event, $a = 0$ and $\tau = 0$, a lamp fires two flashes, one running to the left and one to the right. At that same event a ball is thrown to the right, as hard as you like. Nothing pushes the ball afterwards.

  - type: mcq
    id: hook-predict
    title: Before any theory, predict
    prompt: |
      At one event a lamp fires two light flashes, one to the left and one to the right, and a ball is thrown to the right from the same event, as hard as you like (in units where light covers one unit of distance per unit of time). Can the ball ever catch either flash?
    options:
      - text: 'No: neither flash, however hard the ball is thrown'
        correct: true
      - text: 'Yes, the right flash, if the ball is thrown faster than light'
        feedback: |
          That assumes a ball can be thrown faster than light. Every attempt fails: a body with mass always moves slower than light, however much energy goes in. This lesson shows the geometric statement behind it: the ball's direction in spacetime is of a different kind than the flash's.
      - text: 'Yes, the left flash, since the ball moves away from it more slowly'
        feedback: |
          The ball moves to the right, the left flash to the left: their distance only grows. Catching the left flash would need the ball to turn around and outrun light.
      - text: 'It depends on who watches: some observers see the ball win'
        feedback: |
          Whether two things meet is an event or no event: every observer agrees on it. Observers disagree on times and distances, not on whether two worldlines cross.
    explanation: |
      Neither flash can be caught. By the end of this lesson the reason is a sign: the flash's direction in spacetime has $g = 0$, the ball's has $g > 0$, and a direction with $g > 0$ stays strictly inside the cone that the flashes trace.

  - type: text
    id: stage
    title: A Lorentzian metric, with signs (+, −)
    body: |
      Recall: a **metric** $g$ gives, at each point $p$ of a manifold $\mathcal{M}$, a symmetric non-degenerate bilinear map $g_p$ on the tangent space $T_p\mathcal{M}$. Its **signature** $(n_+,n_-)$ counts the positive and negative entries of the diagonal form it takes in a suitable basis, the same counts in every basis (Sylvester). A metric is **Lorentzian** when exactly one sign is in the minority.

      Spacetime is 4-dimensional and from now on we take
      $$(n_+,n_-) = (1,3),$$
      that is $(+,-,-,-)$: at every $p$ some basis of $T_p\mathcal{M}$ gives
      $$g_p = \mathrm{diag}(1,-1,-1,-1).$$
      The positive direction is time, the three negative ones are space.

  - type: text
    id: plane
    title: The picture in 1+1 dimensions
    body: |
      To draw, keep one space dimension: a 2-dimensional spacetime with chart coordinates $a$ (space, across) and $\tau$ (time, up), signature $(+,-)$. The flat example is the **Minkowski** metric
      $$g = d\tau\otimes d\tau - da\otimes da.$$
      A tangent vector $\mathcal{X}_p$ at $p$ has components written in the order
      $$\mathcal{X}_p = (X^a, X^\tau),$$
      space first, as the pictures read left to right. (In four dimensions the time coordinate usually comes first, as $x^0$.) The upper indices are labels, not powers; $(X^\tau)^2$ is the component $X^\tau$ squared. So
      $$g_p(\mathcal{X}_p,\mathcal{X}_p) = (X^\tau)^2 - (X^a)^2.$$

  - type: widget
    id: cone-widget
    title: The sign of g
    widget: light-cones
    config:
      metric: minkowski
      views: [minkowski]
      p: [0, 0]
      X: [1, 2]
      orientation: false
      presets:
        - { label: 'Up', metric: minkowski, p: [0, 0], X: [1, 2] }
        - { label: 'Diagonal', metric: minkowski, p: [0, 0], X: [1, 1] }
        - { label: 'Sideways', metric: minkowski, p: [0, 0], X: [2, 1] }
    body: |
      Minkowski metric $g = d\tau\otimes d\tau - da\otimes da$, base point $p = (0,0)$. The blue arrow is a vector $\mathcal{X}_p = (X^a, X^\tau)$; drag its tip and watch the sign of $g_p(\mathcal{X}_p,\mathcal{X}_p)$. Find where it is positive, where negative, and where it is zero (the two ink lines through $p$).

  - type: numeric
    id: g-of-12
    title: One number
    prompt: |
      In the Minkowski metric $g = d\tau\otimes d\tau - da\otimes da$, with components ordered $(X^a, X^\tau)$, take $\mathcal{X}_p = (1, 2)$. Compute $g_p(\mathcal{X}_p,\mathcal{X}_p)$.
    answer: 3
    wrong:
      - { value: 5, feedback: 'That is the Euclidean squared length $1^2 + 2^2$. The metric subtracts the space part: $(X^\tau)^2 - (X^a)^2$.' }
      - { value: -3, feedback: 'That is $(X^a)^2 - (X^\tau)^2$, the opposite sign convention. Here $g = d\tau\otimes d\tau - da\otimes da$: the time part enters with $+$.' }
      - { value: 1, feedback: 'That is $X^\tau - X^a$, without squaring. Each component enters squared: $(X^\tau)^2 - (X^a)^2$.' }
    hint: '$g_p(\mathcal{X}_p,\mathcal{X}_p) = (X^\tau)^2 - (X^a)^2$ with $X^a = 1$, $X^\tau = 2$.'
    explanation: |
      $$g_p(\mathcal{X}_p,\mathcal{X}_p) = 2^2 - 1^2 = 3.$$
      Positive: the time part wins.

  - type: build
    id: build-bilinear
    title: Two different vectors
    prompt: |
      In the Minkowski metric $g = d\tau\otimes d\tau - da\otimes da$, with components ordered $(X^a, X^\tau)$ and $(Y^a, Y^\tau)$, build $g_p(\mathcal{X}_p,\mathcal{Y}_p)$.
    prefix: 'g_p(\mathcal{X}_p,\mathcal{Y}_p) ='
    tiles: ['X^\tau Y^\tau', '-', 'X^a Y^a', '+', 'X^a Y^\tau', 'X^\tau Y^a']
    answers:
      - ['X^\tau Y^\tau', '-', 'X^a Y^a']
    wrong:
      - { answer: ['X^\tau Y^\tau', '+', 'X^a Y^a'], feedback: 'That is the Euclidean dot product. The term $-\,da\otimes da$ gives the space part a minus sign.' }
      - { answer: ['X^a Y^\tau', '-', 'X^\tau Y^a'], feedback: '$d\tau\otimes d\tau$ eats the $\tau$ components of both vectors: $d\tau(\mathcal{X}_p)\,d\tau(\mathcal{Y}_p) = X^\tau Y^\tau$. Mixed terms would need $d\tau\otimes da$, which this metric does not contain.' }
    hint: '$(d\tau\otimes d\tau)(\mathcal{X}_p,\mathcal{Y}_p) = d\tau(\mathcal{X}_p)\,d\tau(\mathcal{Y}_p)$, and $d\tau(\mathcal{X}_p) = X^\tau$.'
    explanation: |
      $$g_p(\mathcal{X}_p,\mathcal{Y}_p) = X^\tau Y^\tau - X^aY^a.$$
      With $\mathcal{Y}_p = \mathcal{X}_p$ it gives back $(X^\tau)^2 - (X^a)^2$.

  - type: text
    id: classes
    title: Timelike, lightlike, spacelike
    body: |
      The sign of $g_p(\mathcal{X}_p,\mathcal{X}_p)$ sorts the non-zero vectors of $T_p\mathcal{M}$ into three kinds. A non-zero $\mathcal{X}_p$ is
      - **timelike** if $g_p(\mathcal{X}_p,\mathcal{X}_p) > 0$,
      - **lightlike** (or **null**) if $g_p(\mathcal{X}_p,\mathcal{X}_p) = 0$,
      - **spacelike** if $g_p(\mathcal{X}_p,\mathcal{X}_p) < 0$,

      and **causal** if it is timelike or lightlike. The zero vector gets no class.

      In Minkowski: $(1,2)$ is timelike ($3$), $(1,1)$ lightlike ($0$), $(2,1)$ spacelike ($1 - 4 = -3$). A flash of light moves along a lightlike direction; the lesson on worldlines makes this, and the role of timelike directions, a postulate.

  - type: mcq
    id: classify-21
    title: Which kind?
    prompt: |
      In the Minkowski metric $g = d\tau\otimes d\tau - da\otimes da$, with components ordered $(X^a, X^\tau)$, classify $\mathcal{X}_p = (3, -2)$.
    options:
      - text: 'Spacelike: $g_p(\mathcal{X}_p,\mathcal{X}_p) = 4 - 9 = -5$'
        correct: true
      - text: 'Timelike: $g_p(\mathcal{X}_p,\mathcal{X}_p) = 9 - 4 = 5$'
        feedback: |
          That squares the components in the wrong slots: $X^a = 3$ is the space component, which enters with the minus sign. $g_p = (X^\tau)^2 - (X^a)^2 = 4 - 9$.
      - text: 'Neither: the minus sign in $X^\tau = -2$ makes it a past vector, which has no class'
        feedback: |
          Every non-zero vector has a class, and the class depends only on the sign of $g_p(\mathcal{X}_p,\mathcal{X}_p)$, where $X^\tau$ appears squared. Pointing down in time does not exclude a vector.
      - text: 'Lightlike: its components have the same size up to sign'
        feedback: |
          $|X^a| = 3$ and $|X^\tau| = 2$ differ. Lightlike in Minkowski means $|X^a| = |X^\tau|$, the diagonals.
    explanation: |
      $$g_p(\mathcal{X}_p,\mathcal{X}_p) = (-2)^2 - 3^2 = -5 < 0.$$
      It points more sideways than in time: spacelike.

  - type: mcq
    id: which-null
    title: Find the null vectors
    multiple: true
    prompt: |
      In the Minkowski metric $g = d\tau\otimes d\tau - da\otimes da$, with components ordered $(X^a, X^\tau)$, which vectors are lightlike? Select all that apply.
    options:
      - text: '$(-3, 3)$'
        correct: true
      - text: '$(2, -2)$'
        correct: true
      - text: '$(0, 0)$'
        feedback: |
          $g_p(0,0) = 0$, but the classes are for non-zero vectors only: the zero vector is not lightlike. The light cone is made of non-zero vectors.
      - text: '$(1, 2)$'
        feedback: |
          $g_p = 4 - 1 = 3 > 0$: timelike.
    explanation: |
      Lightlike in Minkowski means $(X^\tau)^2 = (X^a)^2$ with $\mathcal{X}_p\neq0$: the two diagonals, in either direction. $(2,-2)$ points down and to the right, still lightlike.

  - type: text
    id: other-convention
    title: The other sign convention
    body: |
      Earlier, we met Minkowski as $\mathrm{diag}(-1,1)$, and spacetime as $\mathrm{diag}(-1,1,1,1)$: the convention $(-,+,+,+)$, signature $(3,1)$. Both conventions are in common use. Switching multiplies $g$ by $-1$, so every inequality involving $g$ flips:
      - timelike: $g_p(\mathcal{X}_p,\mathcal{X}_p) < 0$,
      - spacelike: $g_p(\mathcal{X}_p,\mathcal{X}_p) > 0$,
      - lightlike: still $= 0$.

      The physics is the same; only the bookkeeping of signs changes. From now on we use $(+,-,-,-)$: **timelike is positive**, which will make a clock's time the plain square root $\sqrt{g(v,v)}$.

  - type: mcq
    id: convention-switch
    title: Same vector, other convention
    prompt: |
      In the convention $(-,+,+,+)$ the 1+1 Minkowski metric is $g' = -d\tau\otimes d\tau + da\otimes da$. With components ordered $(X^a, X^\tau)$, what is $g'_p(\mathcal{X}_p,\mathcal{X}_p)$ for $\mathcal{X}_p = (1,2)$, and what kind of vector is it?
    options:
      - text: '$-3$, timelike'
        correct: true
      - text: '$-3$, spacelike'
        feedback: |
          The number is right, but in the convention $(-,+,+,+)$ negative means timelike. The kind of a vector is physics, so it cannot change with the convention: $(1,2)$ points more in time than in space either way.
      - text: '$3$, timelike'
        feedback: |
          That is the value in $(+,-,-,-)$. Switching conventions multiplies $g$ by $-1$: $g' = -4 + 1 = -3$.
      - text: '$5$, timelike'
        feedback: |
          That is the Euclidean squared length $1 + 4$; the two terms have opposite signs in any Lorentzian convention.
    explanation: |
      $$g'_p(\mathcal{X}_p,\mathcal{X}_p) = -2^2 + 1^2 = -3.$$
      The number flips sign, the class does not: timelike is $< 0$ in $(-,+,+,+)$ and $> 0$ in $(+,-,-,-)$.

  - type: text
    id: light-cone
    title: The light cone
    body: |
      The lightlike vectors of $T_p\mathcal{M}$ form the **light cone** at $p$:
      $$\{\mathcal{X}_p\neq0 : g_p(\mathcal{X}_p,\mathcal{X}_p) = 0\}.$$
      It is a **cone**: scaling by any $\lambda\neq0$ multiplies $g_p(\mathcal{X}_p,\mathcal{X}_p)$ by $\lambda^2$, so lightlike stays lightlike. In 1+1 Minkowski it is the two diagonals; in four dimensions, with $g_p = \mathrm{diag}(1,-1,-1,-1)$ in a suitable basis, it is
      $$(X^0)^2 = (X^1)^2 + (X^2)^2 + (X^3)^2,$$
      a real double cone around the time axis. Timelike vectors fill its inside, spacelike vectors its outside.

  - type: mcq
    id: cone-not-subspace
    title: Is the cone a subspace?
    prompt: |
      In 1+1 Minkowski, $g = d\tau\otimes d\tau - da\otimes da$, components ordered $(X^a, X^\tau)$, both $(1,1)$ and $(-1,1)$ are lightlike. Is the light cone at $p$ (the lightlike vectors of $T_p\mathcal{M}$) a vector subspace?
    options:
      - text: 'No: $(1,1) + (-1,1) = (0,2)$ has $g = 4$, timelike'
        correct: true
      - text: 'Yes: it is closed under scaling, so it is a subspace'
        feedback: |
          A subspace must also be closed under addition (and contain $0$). Scaling keeps a vector on its line; adding two null vectors from different lines leaves the cone.
      - text: 'Yes: $g$ is bilinear, so the vectors with $g = 0$ form a kernel'
        feedback: |
          The condition $g_p(\mathcal{X}_p,\mathcal{X}_p) = 0$ is quadratic in $\mathcal{X}_p$, not linear: $g_p(\mathcal{X}+\mathcal{Y},\mathcal{X}+\mathcal{Y})$ picks up the cross term $2g_p(\mathcal{X},\mathcal{Y})$. A kernel would come from a linear condition.
      - text: 'No, because the zero vector is timelike'
        feedback: |
          The zero vector has no class at all (it is excluded by definition), but that alone is not the main failure: the sum of two lightlike vectors can be timelike.
    explanation: |
      $$g_p\big((0,2),(0,2)\big) = 4 - 0 = 4 > 0.$$
      The cross term $2g_p\big((1,1),(-1,1)\big) = 2(1 + 1) = 4$ is what the sum gains.

  - type: widget
    id: tilted-widget
    title: A cone at every point
    widget: light-cones
    config:
      metric: tilted
      views: [minkowski, tilted]
      p: [2, 0]
      X: [1, 1]
      field: true
      badge: false
      orientation: false
      view: { x: -1.5, y: -2.5, w: 6, h: 5 }
    body: |
      A curved-looking metric: with $s := a/4$ and $\sigma := da - s\,d\tau$,
      $$g = d\tau\otimes d\tau - \sigma\otimes\sigma,$$
      so $g_p(\mathcal{X}_p,\mathcal{X}_p) = (X^\tau)^2 - (X^a - sX^\tau)^2$. Small cones are drawn at many points: they lean right where $a > 0$, left where $a < 0$. Each one is drawn at its base point but lives in the tangent space there. Now only numbers show: drag $p$ and $\mathcal{X}_p$ and read $g_p(\mathcal{X}_p,\mathcal{X}_p)$ off the readout.

  - type: numeric
    id: tilted-value
    title: The diagonal is not null here
    prompt: |
      Metric $g = d\tau\otimes d\tau - \sigma\otimes\sigma$ with $\sigma := da - s\,d\tau$ and $s := a/4$, so $g_p(\mathcal{X}_p,\mathcal{X}_p) = (X^\tau)^2 - (X^a - sX^\tau)^2$ with components ordered $(X^a, X^\tau)$. At $p = (2, 0)$ (so $a = 2$), compute $g_p(\mathcal{X}_p,\mathcal{X}_p)$ for $\mathcal{X}_p = (1, 1)$.
    answer: 0.75
    wrong:
      - { value: 0, feedback: 'That is the Minkowski habit: "the 45° diagonal is null". Here $s = 2/4 = 0.5$, so $X^a - sX^\tau = 0.5$, not $1$.' }
      - { value: -1.25, feedback: 'That uses $X^a + sX^\tau = 1.5$. The metric has $\sigma = da - s\,d\tau$: $X^a - sX^\tau = 1 - 0.5$.' }
    hint: 'At $a = 2$, $s = 0.5$. Compute $X^a - sX^\tau$ first, then square it.'
    explanation: |
      $$\begin{aligned}g_p(\mathcal{X}_p,\mathcal{X}_p) &= 1^2 - (1 - 0.5)^2\\ &= 0.75.\end{aligned}$$
      Timelike: at this point the cone leans right, and the diagonal $(1,1)$ falls inside it.

  - type: mcq
    id: tilted-null
    title: Where are the null lines?
    prompt: |
      Metric $g_p(\mathcal{X}_p,\mathcal{X}_p) = (X^\tau)^2 - (X^a - sX^\tau)^2$ with $s := a/4$, components ordered $(X^a, X^\tau)$. At $p = (2,0)$, which two directions are lightlike?
    options:
      - text: '$(1.5, 1)$ and $(-0.5, 1)$'
        correct: true
      - text: '$(1, 1)$ and $(-1, 1)$'
        feedback: |
          Those are Minkowski's diagonals. Here $s = 0.5$, and $(1,1)$ gives $1 - 0.25 = 0.75 \neq 0$.
      - text: '$(2.5, 1)$ and $(1.5, 1)$'
        feedback: |
          Lightlike needs $X^a - sX^\tau = \pm X^\tau$, i.e. $X^a = (0.5 \pm 1)X^\tau$. $(2.5,1)$ gives $(1)^2 - (2)^2 = -3$: spacelike.
      - text: '$(0.5, 1)$ and $(-0.5, 1)$'
        feedback: |
          $(0.5,1)$ gives $X^a - sX^\tau = 0$, so $g = 1$: it is the most timelike direction, the axis of the cone, not an edge.
    explanation: |
      $X^a - 0.5X^\tau = \pm X^\tau$ gives $X^a = 1.5X^\tau$ or $X^a = -0.5X^\tau$. Check $(1.5,1)$:
      $$1^2 - (1.5 - 0.5)^2 = 0.$$
      The cone at $(2,0)$ is the Minkowski cone sheared to the right by $s = 0.5$.

  - type: text
    id: own-tangent-space
    title: Each cone in its own tangent space
    body: |
      The light cone at $p$ is a subset of $T_p\mathcal{M}$, not of $\mathcal{M}$: drawing it at $p$ is a convenience. Cones at different points live in different vector spaces, so "the cone at $q$ leans more than the cone at $p$" is a statement about the chart's components, not a comparison inside one space.

      And at each single point, a basis exists where $g_p = \mathrm{diag}(1,-1)$ (in four dimensions $\mathrm{diag}(1,-1,-1,-1)$): in that basis every cone looks like Minkowski's. At $p = (2,0)$ above, the basis $(0.5,1)$, $(1,0)$ does it. What varies from point to point is how the cones fit together, and that is where curvature will live.

  - type: mcq
    id: euclid-trap
    title: The longest arrow
    prompt: |
      In 1+1 Minkowski, $g = d\tau\otimes d\tau - da\otimes da$, components ordered $(X^a, X^\tau)$, three vectors are drawn from one point: $\mathcal{X} = (0,2)$, $\mathcal{Y} = (2.5, 3)$ and $\mathcal{Z} = (3, 3)$. Which has the largest $g_p(\cdot,\cdot)$ with itself?
    options:
      - text: '$\mathcal{X} = (0,2)$, the shortest arrow in the drawing: $g = 4$'
        correct: true
      - text: '$\mathcal{Z} = (3,3)$, the longest arrow in the drawing'
        feedback: |
          $\mathcal{Z}$ is lightlike: $g = 9 - 9 = 0$. It is non-zero and drawn about $4.2$ long, but its $g$ vanishes. The drawing shows Euclidean lengths, which the metric ignores.
      - text: '$\mathcal{Y} = (2.5,3)$: it is longer and still timelike'
        feedback: |
          $g = 9 - 6.25 = 2.75 < 4$. Tilting a timelike vector toward the cone lowers its $g$, even as the arrow gets longer on paper.
      - text: 'All three are equal: they all reach about the same height'
        feedback: |
          The height is $X^\tau$ alone; the sideways part enters with a minus sign: $4$, $2.75$ and $0$.
    explanation: |
      $$\begin{aligned}g(\mathcal{X},\mathcal{X}) &= 4 - 0 = 4,\\ g(\mathcal{Y},\mathcal{Y}) &= 9 - 6.25 = 2.75,\\ g(\mathcal{Z},\mathcal{Z}) &= 9 - 9 = 0.\end{aligned}$$
      Euclidean lengths and angles of the picture mean nothing in spacetime: only $g$ measures.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Next: Spacetime and Time Orientation · Part 2.** The metric cannot tell the future half of a light cone from the past half, since $g_p(-\mathcal{X}_p,-\mathcal{X}_p) = g_p(\mathcal{X}_p,\mathcal{X}_p)$. What extra datum fixes the future, which vectors are then future directed, and what is a spacetime exactly? Then the ball and the two flashes of the opening puzzle get their answer.
