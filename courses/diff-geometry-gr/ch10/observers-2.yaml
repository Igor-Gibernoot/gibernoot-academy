id: ch10-observers-2
title: Observers and What They Measure · Part 2
kind: concept

own: |
  - **Setting**: $\mathcal{M}$ is the spacetime with Lorentzian metric $g$ of signature $(+,-,-,-)$; a massive worldline $\gamma$ is a curve with timelike, future directed velocity $v_\gamma$, and $s_\gamma := \sqrt{g(v_\gamma,v_\gamma)}$ is its speed. Indices $a,b$ run over $0,\dots,3$, $\alpha$ over $1,2,3$; $\delta^a_b$ is $1$ if $a=b$ and $0$ otherwise.
  - **Observer and measured components**: an observer is a massive worldline $\gamma$ with a frame $e_a$ ($a=0,\dots,3$) along it, $g(e_a,e_b) = \eta_{ab}$ and $e_0 = v_\gamma$, so it runs on its own proper time; with the dual basis $\epsilon^a$, every vector is $\mathcal{X} = \epsilon^a(\mathcal{X})\,e_a$, its time component {{ $\epsilon^0(\mathcal{X}) = g(v_\gamma,\mathcal{X})$ }} read on the clock, the spatial ones on the rods.
  - **3-velocity** (units $c=1$) of a massive or massless particle with worldline $\delta$ through the observer's event, with $\epsilon^0(v_\delta) = g(v_\gamma,v_\delta) > 0$: $u_\delta := u^\alpha e_\alpha$,
  {{ $$u^\alpha := \frac{\epsilon^\alpha(v_\delta)}{\epsilon^0(v_\delta)}$$ }}
  unchanged by reparametrizing $\delta$ (a positive factor cancels).
  - **Speed bound**: expanding $v_\delta$ in the frame,
  {{ $$\begin{aligned}g(v_\delta,v_\delta) &= \big(\epsilon^0(v_\delta)\big)^2\\ &\quad\cdot\Big(1 - \sum_\alpha(u^\alpha)^2\Big)\end{aligned}$$ }}
  so $\sum_\alpha(u^\alpha)^2 < 1$ for massive particles and $= 1$ for light, for every observer.
  - **Traps**: a chart speed is not a 3-velocity (in the chart $(a,t)$ with $t = \tau/2$ the light ray $(\lambda,\lambda)$ covers $2$ units of $a$ per unit of $t$, yet every observer still measures {{ speed $1$ }}), and a frame $e'$ that breaks $g(e_a,e_b) = \eta_{ab}$ or $e_0 = v_\gamma$ is not an observer. A spacelike vector has no speed: {{ $\epsilon^0$ can change sign with the observer }}.

cards:
  - type: text
    id: recall-observers
    tag: Recall
    title: 'Recall: observers and measured components'
    body: |
      Recall, from the lesson Observers and What They Measure · Part 1: on a spacetime $\mathcal{M}$ with Lorentzian metric $g$ of signature $(+,-,-,-)$, an **observer** is a pair $(\gamma,e)$ of a massive worldline $\gamma$ and four smooth vector fields $e_a(\lambda)$ ($a=0,1,2,3$) along it with
      $$g(e_a,e_b) = \eta_{ab},\qquad e_0 = v_\gamma,$$
      where $\eta_{ab} = \mathrm{diag}(1,-1,-1,-1)$ and $v_\gamma$ is the velocity of $\gamma$; so $g(v_\gamma,v_\gamma)=1$ and the observer is parametrized by its own proper time. The dual basis is $\epsilon^0 := g(e_0,\cdot)$, $\epsilon^\alpha := -g(e_\alpha,\cdot)$ ($\alpha=1,2,3$), with $\epsilon^a(e_b) = \delta^a_b$, and every vector at $\gamma(\lambda)$ decomposes as
      $$\mathcal{X} = \epsilon^a(\mathcal{X})\,e_a,$$
      the numbers $\epsilon^a(\mathcal{X})$ being its **components measured by the observer**: the time component $\epsilon^0(\mathcal{X}) = g(v_\gamma,\mathcal{X})$ is read on the observer's clock, the spatial ones $\epsilon^\alpha(\mathcal{X}) = -g(e_\alpha,\mathcal{X})$ on its rods. Light has the same speed for all of them, as the Doppler example showed.

  - type: text
    id: three-velocity
    title: The 3-velocity
    body: |
      Let $\delta$ be the worldline of a massive or massless particle passing through the observer's event, $p = \gamma(\lambda_1) = \delta(\lambda_2)$, with velocity $v_\delta := v_{\delta(\lambda_2)}$, and take $e_a$, $\epsilon^a$ at $\lambda_1$. Recall $(\dagger)$: two future-directed causal vectors, at least one of them timelike, have positive $g$. Here $v_\gamma$ is timelike, so
      $$\epsilon^0(v_\delta) = g(v_\gamma, v_\delta) > 0.$$
      The **3-velocity** of $\delta$, the spatial displacement per unit of the observer's time, is
      $$u_\delta := u^\alpha\,e_\alpha,$$
      $$u^\alpha := \frac{\epsilon^\alpha(v_\delta)}{\epsilon^0(v_\delta)}.$$
      The observer measures itself at rest: for $\delta = \gamma$, $\epsilon^\alpha(e_0) = \delta^\alpha_0 = 0$.

      **Two letters $u$.** The slider $u$ (no index) of the observer-frame widgets is the observer's speed relative to the chart. It is itself a 3-velocity: the rest observer measures $e_0 = (u,1)/\sqrt{1-u^2}$ with time $1/\sqrt{1-u^2}$ and space $u/\sqrt{1-u^2}$, ratio $u$. The badge's speed $|X^1/X^0|$ is $|u^1|$ of $\mathcal{X}$ for the purple observer.

  - type: numeric
    id: measure-velocity
    title: A particle, seen by T
    prompt: |
      In 1+1 Minkowski spacetime, $g(\mathcal{X},\mathcal{Y}) = X^\tau Y^\tau - X^aY^a$ (components $(a,\tau)$). Observer T has $e_0 = (0.75, 1.25)$, $e_1 = (1.25, 0.75)$, and $\epsilon^0 = g(e_0,\cdot)$, $\epsilon^1 = -g(e_1,\cdot)$. A particle passes through T's event with velocity $v_\delta = (1,2)$. What is its 3-velocity component $u^1 = \epsilon^1(v_\delta)/\epsilon^0(v_\delta)$? (Decimal, 3 places.)
    answer: -0.142857
    answerText: '-1/7 ≈ -0.143'
    tolerance: 0.002
    wrong:
      - { value: -0.1, feedback: 'That is the Newtonian subtraction $0.5 - 0.6$. Measured components come from $T$''s clock and rods: $\epsilon^0(v_\delta) = 1.75$, $\epsilon^1(v_\delta) = -0.25$.' }
      - { value: 0.5, feedback: 'That is the chart speed $1/2$, what the rest observer measures. Use T''s covectors: $\epsilon^0(v_\delta) = 1.25\cdot2 - 0.75\cdot1$.' }
      - { value: -0.25, feedback: 'That is $\epsilon^1(v_\delta)$ alone. The 3-velocity divides by the time component $\epsilon^0(v_\delta) = 1.75$.' }
    hint: '$\epsilon^0(v_\delta) = 1.25\cdot2 - 0.75\cdot1$ and $\epsilon^1(v_\delta) = -(0.75\cdot2 - 1.25\cdot1)$.'
    explanation: |
      $$\epsilon^0(v_\delta) = 2.5 - 0.75 = 1.75,$$
      $$\epsilon^1(v_\delta) = -(1.5 - 1.25) = -0.25,$$
      so $u^1 = -0.25/1.75 = -1/7\approx-0.143$, not the Newtonian $0.5 - 0.6 = -0.1$. (It matches the relativistic rule $(0.5-0.6)/(1 - 0.5\cdot0.6)$, which this lesson does not need.)

  - type: mcq
    id: reparam-velocity
    title: Run it twice as fast
    prompt: |
      Observer T ($e_0 = (0.75,1.25)$, $e_1 = (1.25,0.75)$ in 1+1 Minkowski spacetime, components $(a,\tau)$) measures a particle with velocity $v_\delta = (1,2)$ and finds $u^1 = \epsilon^1(v_\delta)/\epsilon^0(v_\delta) = -1/7$. The same path is reparametrized to run twice as fast, so the velocity at that event becomes $(2,4)$. What 3-velocity does T measure now?
    options:
      - text: '$-1/7$: the factor $2$ multiplies numerator and denominator'
        correct: true
      - text: '$-2/7$: twice as fast in the parameter means twice the speed'
        feedback: |
          The parameter of $\delta$ is not anyone's clock. Both $\epsilon^1(v_\delta)$ and $\epsilon^0(v_\delta)$ are linear in $v_\delta$, so both double and the ratio is unchanged. The 3-velocity is distance per unit of the *observer's* time.
      - text: '$-1/14$'
        feedback: |
          Only the time component doubling would halve the ratio, but $\epsilon^1$ is linear too: $\epsilon^1(2v_\delta) = 2\epsilon^1(v_\delta)$. The factor cancels.
      - text: 'Undefined: the reparametrized curve is no longer a worldline'
        feedback: |
          A reparametrization with positive derivative keeps the velocity timelike and future directed, so the new curve is still a massive worldline, with the same path.
    explanation: |
      Reparametrizing by $\text{ᚱ}$ with $\text{ᚱ}' > 0$ multiplies $v_\delta$ by $\text{ᚱ}' > 0$; numerator and denominator of $u^\alpha$ scale alike. The 3-velocity depends only on the path of $\delta$.

  - type: order
    id: speed-bound
    title: Nothing outruns light
    prompt: |
      An observer has frame $e_a$ with $g(e_a,e_b) = \eta_{ab}$, $\eta = \mathrm{diag}(1,-1,-1,-1)$, dual covectors $\epsilon^a$, and measures a particle velocity $v_\delta$ with $\epsilon^0(v_\delta) > 0$ and $u^\alpha := \epsilon^\alpha(v_\delta)/\epsilon^0(v_\delta)$. Put in order the proof of the speed bound.
    steps:
      - 'Expand in the frame: $v_\delta = \epsilon^a(v_\delta)\,e_a$.'
      - 'Bilinearity of $g$: $g(v_\delta,v_\delta) = \epsilon^a(v_\delta)\,\epsilon^b(v_\delta)\,g(e_a,e_b)$.'
      - 'Condition 1, $g(e_a,e_b) = \eta_{ab}$: $g(v_\delta,v_\delta) = (\epsilon^0(v_\delta))^2 - \sum_\alpha(\epsilon^\alpha(v_\delta))^2$.'
      - 'Factor out $(\epsilon^0(v_\delta))^2 > 0$: $g(v_\delta,v_\delta) = (\epsilon^0(v_\delta))^2\,(1 - \sum_\alpha(u^\alpha)^2)$.'
      - 'Massive, $g(v_\delta,v_\delta) > 0$: $\sum_\alpha(u^\alpha)^2 < 1$. Massless, $g(v_\delta,v_\delta) = 0$: $\sum_\alpha(u^\alpha)^2 = 1$.'
    hint: 'Start by writing $v_\delta$ in the observer''s basis; the sign of $g(v_\delta,v_\delta)$ comes last.'
    explanation: |
      $$\begin{aligned}g(v_\delta,v_\delta) &= \big(\epsilon^0(v_\delta)\big)^2\\ &\quad\cdot\Big(1 - \sum_\alpha(u^\alpha)^2\Big).\end{aligned}$$
      The left side does not depend on the observer; its sign is fixed by the particle. Check with T and $v_\delta = (1,2)$: $1.75^2\,(1 - 1/49) = 3.0625\cdot48/49 = 3 = 4 - 1$.

  - type: mcq
    id: bound-consequences
    title: What the bound says
    multiple: true
    prompt: |
      Signature $(+,-,-,-)$. For every observer and every particle passing through its event, $g(v_\delta,v_\delta) = (\epsilon^0(v_\delta))^2(1 - \sum_\alpha(u^\alpha)^2)$ with $\epsilon^0(v_\delta) > 0$. Which statements follow? Select all that apply.
    options:
      - text: 'Every observer measures light at speed exactly $1$'
        correct: true
      - text: 'Every observer measures every massive particle at a speed below $1$'
        correct: true
      - text: 'A fast enough observer measures a slow massive particle at a speed above $1$'
        feedback: |
          The sign of $g(v_\delta,v_\delta) > 0$ belongs to the particle, not to the observer, and it forces $\sum_\alpha(u^\alpha)^2 < 1$ for every observer. In the observer-frame widget of Part 1: a timelike $\mathcal{X}$ keeps its speed below $1$ for every slider $u$.
      - text: 'An observer moving at $0.6$ after a light ray measures it at $1 - 0.6 = 0.4$'
        feedback: |
          That is the Newtonian subtraction of velocities. Light has $g(v_\delta,v_\delta) = 0$, so $\sum_\alpha(u^\alpha)^2 = 1$ for every observer. At $0.6$ the measured components were $(0.5, 0.5)$: speed $1$.
    explanation: |
      The left side's sign is observer independent: positive for massive particles, zero for light. Since $(\epsilon^0)^2 > 0$, the bracket has the same sign: speed below $1$, or exactly $1$, for everyone.

  - type: widget
    id: spacelike-widget
    title: A vector with no speed
    widget: observer-frame
    config:
      u: 0.6
      X: [2, 1]
      compare: true
    body: |
      $\mathcal{X} = (2,1)$ is spacelike: $g(\mathcal{X},\mathcal{X}) = 1 - 4 = -3$. The rest observer measures time $X^\tau = 1$; the purple observer at $0.6$ measures a negative $X^0$. Move $u$ from $0$ upward and watch $X^0$ change sign: the badge never shows a speed. The bound above was about particle velocities, where $\epsilon^0 > 0$ is guaranteed; here it is not.

  - type: numeric
    id: simultaneous
    title: When is the time component zero?
    prompt: |
      In 1+1 Minkowski spacetime, $g(\mathcal{X},\mathcal{Y}) = X^\tau Y^\tau - X^aY^a$ (components $(a,\tau)$). An observer with chart speed $u$ has $e_0 = (u,1)/\sqrt{1-u^2}$. For the spacelike vector $\mathcal{X} = (2,1)$, for which $u$ is the measured time component $X^0 = g(e_0,\mathcal{X})$ zero?
    answer: 0.5
    tolerance: 0.001
    wrong:
      - { value: 2, feedback: 'Solving $u - 2 = 0$ swaps the roles: $g(e_0,\mathcal{X}) \propto 1\cdot X^\tau - u\,X^a = 1 - 2u$.' }
      - { value: 1, feedback: 'No observer reaches $u = 1$. Solve $1\cdot X^\tau - u\,X^a = 1 - 2u = 0$.' }
    hint: '$g(e_0,\mathcal{X}) = (1\cdot X^\tau - u\,X^a)/\sqrt{1-u^2}$.'
    explanation: |
      $$X^0 = \frac{1 - 2u}{\sqrt{1-u^2}} = 0 \iff u = 0.5.$$
      That observer sees the two ends of $\mathcal{X}$ as simultaneous ($\mathcal{X}$ lies along its ruler $e_1$); a faster one finds $X^0 < 0$. A spacelike vector has no observer-independent time order, and no measured speed: it is never a particle velocity.

  - type: text
    id: not-every-frame
    title: Not every frame is an observer
    body: |
      Any basis $e'$ may be chosen along $\gamma$, and the components $\epsilon'^a(\mathcal{X})$ in its dual basis are perfectly good numbers. But if $e'$ breaks a condition, $(\gamma, e')$ is simply **not an observer**: its components are not clock and rod readings. Such bases stay useful (chart-induced bases; lightlike bases in the study of radiation), just not as measurements. Three traps follow.

  - type: mcq
    id: trap-lightlike-axis
    title: A tilted ruler
    prompt: |
      In 1+1 Minkowski spacetime ($g(\mathcal{X},\mathcal{Y}) = X^\tau Y^\tau - X^aY^a$, components $(a,\tau)$), the rest observer has $e_0 = (0,1)$, $e_1 = (1,0)$. Replace the ruler by $e'_1 := e_1 + e_0 = (1,1)$. In the basis $\{e_0, e'_1\}$ the vector $\mathcal{X} = (1,2)$ is $1\cdot e_0 + 1\cdot e'_1$. Is the coefficient $1$ of $e_0$ a time read on the observer's clock?
    options:
      - text: 'No: $g(e''_1,e''_1) = 0\neq-1$, so this is not an observer; that coefficient mixes clock and rod readings'
        correct: true
      - text: 'Yes: the time axis is still $e_0 = v_\gamma$, so condition 2 holds'
        feedback: |
          Condition 2 alone is not enough. The clock reading is $g(v_\gamma,\mathcal{X}) = 2$, but the dual covector of $e_0$ in this basis is no longer $g(e_0,\cdot)$: it gives $X^\tau - X^a = 1$, contaminated by the space part. Condition 1 fails, since $e'_1$ is lightlike.
      - text: 'Yes: any basis containing $v_\gamma$ gives measured components'
        feedback: |
          Changing the other basis vectors changes every dual covector, including the one paired with $e_0$. Here it reads $1$ instead of the clock's $2$. Only a Lorentz-orthonormal frame turns components into measurements.
      - text: 'No, because $e''_1$ is not a basis vector at all'
        feedback: |
          $\{e_0, e'_1\} = \{(0,1),(1,1)\}$ is a basis: the two vectors are independent. The problem is not independence but orthonormality: $g(e'_1,e'_1) = 1 - 1 = 0$.
    explanation: |
      The rest observer measures $\mathcal{X} = (1,2)$ as time $2$ (clock) and distance $1$ (rod). The tilted basis gives $(1, 1)$: its first coefficient is $2 - 1$, a mixture. Rulers must be unit and orthogonal to $v_\gamma$.

  - type: mcq
    id: trap-other-observer
    title: The right frame, the wrong observer
    prompt: |
      In 1+1 Minkowski spacetime (components $(a,\tau)$), twin H has worldline $\gamma(\lambda) = (0,\lambda)$. At the event $(0,0)$ take the frame $e'_0 = (0.75,1.25)$, $e'_1 = (1.25,0.75)$: Lorentz-orthonormal, with $e'_0$ future directed. Is $(\gamma, e')$ an observer at that event?
    options:
      - text: 'No: $e''_0\neq v_\gamma = (0,1)$; $e''$ is the frame of another observer through that event, moving at $0.6$'
        correct: true
      - text: 'Yes: the frame is Lorentz-orthonormal, which is what makes components measurements'
        feedback: |
          Orthonormality is condition 1. Condition 2 also requires the time axis to be $\gamma$'s velocity, here $(0,1)$. With $e'_0 = (0.75,1.25)$ the time component $g(e'_0,\mathcal{X})$ is read on a clock moving at $0.6$, not on H's clock.
      - text: 'No: a Lorentz-orthonormal frame must have $e_0 = (0,1)$'
        feedback: |
          Every observer has its own Lorentz-orthonormal frames; $e'$ is the frame of twin T. What fails is the pairing with H's worldline, not the frame.
    explanation: |
      Lorentz-orthonormal frames with future-directed time axis are exactly the frames of observers through the event, one for each velocity $e'_0$. The frame $e'$ belongs to T, whose clock reads $X^0 = 4$ for $(3,5)$; H's clock reads $5$.

  - type: mcq
    id: trap-chart-speed
    title: Light at speed 2?
    prompt: |
      In 1+1 Minkowski spacetime ($g = d\tau\otimes d\tau - da\otimes da$, points $(a,\tau)$), use the new chart coordinates $a$ and $t := \tau/2$. The light ray $(\lambda,\lambda)$ has $a = 2t$, so it covers $2$ units of $a$ per unit of $t$. Does this contradict the speed bound?
    options:
      - text: 'No: $da/dt$ is a chart speed, not a 3-velocity; every observer still measures $1$'
        correct: true
      - text: 'Yes: light moves faster than $1$ in this chart, so the bound fails'
        feedback: |
          The bound is about $u^\alpha = \epsilon^\alpha(v_\delta)/\epsilon^0(v_\delta)$, built from an observer's clock and rods. A chart coordinate is a label: in the chart $(a,t)$ the metric reads $4\,dt\otimes dt - da\otimes da$, and the ray is still lightlike, $4 - 4 = 0$.
      - text: 'No, because $t := \tau/2$ is not a valid chart'
        feedback: |
          It is a perfectly good chart: a smooth invertible change of coordinates. Charts may label events as they like; that is why their speeds measure nothing.
    explanation: |
      Measured quantities come from an observer's frame, never from coordinate labels. The rest observer measures the ray as $(X^0,X^1) = (1,1)$, speed $1$, whatever chart is used. Only in the original chart, for the observer at rest in it, do chart speed and 3-velocity coincide (the widgets' slider $u$).

  - type: text
    id: summary
    title: What you now own
    body: |
      **Next:** two observers at the same event. Their frames $e$ and $\tilde{e}$ are both bases of $T_p\mathcal{M}$, so $\tilde{e}_a = \Lambda^b_a\,e_b$ with $\Lambda^b_a := \epsilon^b(\tilde{e}_a)$. Both are Lorentz-orthonormal: what does that force on the matrix $\Lambda$? The answer is the **Lorentz transformations**, and with them time dilation and length contraction as one-line consequences.
