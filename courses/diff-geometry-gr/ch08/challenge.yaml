id: ch08-challenge
title: Level Challenge
kind: challenge

# Organization: intro, then one block per problem (cards tagged
# "Problem N · …", ids prefixed pN-), then wrap-up. Session 1 wrote
# problems 1-3; part 2 added problems 4-5 and the wrap-up card.

cards:
  - type: text
    id: intro
    title: Five problems on integrals
    body: |
      This challenge pushes each idea of the level to its edge. Keep pencil and paper at hand: every answer can be checked by hand.

      Recall the toolkit. On an oriented manifold $(\mathcal{M},\mathcal{O},\mathcal{A}^\uparrow)$ ($\mathcal{O}$ the topology, $\mathcal{A}^\uparrow$ an oriented atlas) a volume form $\Omega$ has, in each chart $(\mathcal{U},\mathscr{X})$, a **scalar density** $\omega_\mathscr{X}$, and between two charts
      $$\omega_\mathscr{Y} = \det\Big(\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^j}\Big)\,\omega_\mathscr{X}.$$
      For an open region $\mathcal{D}\subseteq\mathcal{U}$ whose closure $\overline{\mathcal{D}}$ is compact and contained in $\mathcal{U}$, the one-chart integral of a smooth $f$ is
      $$\begin{aligned}\int_\mathcal{D}\Omega f :=&\int_{\mathscr{X}(\mathcal{D})}d^d\alpha\,(\omega_\mathscr{X}\circ\mathscr{X}^{-1})(\alpha)\\ &\qquad\cdot(f\circ\mathscr{X}^{-1})(\alpha),\end{aligned}$$
      with $d^d\alpha := d\alpha^1\cdots d\alpha^d$. A partition of unity $\{\text{ᚹ}_n\}$ (rune ᚹ, "wynn") glues such pieces into $\int_\mathcal{M}\Omega f$, and a metric $g$ picks the metric volume form $\Omega^g$, with density $\omega^g_\mathscr{X} = \sqrt{|\det g_\mathscr{X}|}$ in every chart of $\mathcal{A}^\uparrow$.

      1. Why the closure must be compact: what the hypothesis buys, on an open interval and at the edge of a chart where the density blows up.
      2. Building a partition of unity: a function flat at $0$, a staircase partition of $\mathbb{R}$, and where Hausdorff and second countability enter.
      3. The area of a torus: induced metric, two patches in two charts, a chart of the wrong orientation, and a partition over four charts.
      4. Spacetime volume of a causal diamond: Minkowski spacetime in light-cone coordinates, why $|\det g|$, and why every observer agrees.
      5. Rescaling and orientability: how $\Omega^g$ changes when lengths are rescaled, an infinite area in the hyperbolic half-plane, and the Möbius strip, which has no volume form.

  # ---------------------------------------------------------------- Problem 1
  - type: text
    id: p1-setup
    tag: Problem 1 · Why the closure must be compact
    title: What the hypothesis buys
    body: |
      The one-chart integral demands that the closure $\overline{\mathcal{D}}$ be **compact** and **contained in $\mathcal{U}$**. Recall the two words:
      - the **closure** $\overline{\mathcal{D}}$ is the smallest closed set of $\mathcal{M}$ containing $\mathcal{D}$: the region plus its boundary points. In $\mathbb{R}$, the closure of $(-1,1)$ is $[-1,1]$.
      - a set is **compact** if every family of open sets covering it has a finite subfamily that still covers it. In $\mathbb{R}^d$ the compact sets are exactly the closed and bounded ones (the Heine–Borel theorem, not proved here).

      Two facts about compact sets: a **continuous image** of a compact set is compact, and a **continuous function** on a compact set is bounded (its image is compact, hence bounded).

      **Claim:** under the hypothesis, $|\int_\mathcal{D}\Omega f|<\infty$ for every smooth $f$. This problem proves it, then breaks each half of the hypothesis on purpose to see what goes wrong.

  - type: order
    id: p1-proof
    tag: Problem 1 · Why the closure must be compact
    title: The finiteness proof
    prompt: |
      Claim: if $\mathcal{D}\subseteq\mathcal{U}$ is open with $\overline{\mathcal{D}}$ compact and contained in the chart domain $\mathcal{U}$, then $|\int_\mathcal{D}\Omega f|<\infty$. Write
      $$h(\alpha) := (\omega_\mathscr{X}\circ\mathscr{X}^{-1})(\alpha)\,(f\circ\mathscr{X}^{-1})(\alpha),$$
      the integrand, a continuous function on $\mathscr{X}(\mathcal{U})$. Recall: continuous images of compact sets are compact, and compact subsets of $\mathbb{R}^d$ are bounded. Put the proof in order.
    steps:
      - '$\mathscr{X}$ is continuous on $\mathcal{U}\supseteq\overline{\mathcal{D}}$, so $\mathscr{X}(\overline{\mathcal{D}})$ is compact.'
      - 'Compact in $\mathbb{R}^d$ means bounded: $\mathscr{X}(\mathcal{D})\subseteq\mathscr{X}(\overline{\mathcal{D}})\subseteq[-L,L]^d$ for some $L>0$.'
      - '$h$ is continuous on the compact set $\mathscr{X}(\overline{\mathcal{D}})$, so $|h|\le C$ there for some $C\ge0$.'
      - 'Estimate: $|\int_\mathcal{D}\Omega f|\le\int_{\mathscr{X}(\mathcal{D})}d^d\alpha\,|h(\alpha)|$.'
      - 'Bound the integrand by $C$ and the region by the cube: the total is at most $C\,(2L)^d<\infty$.'
    hint: First make the region bounded, then the integrand; only then estimate.
    explanation: |
      $$\begin{aligned}\Big|\int_\mathcal{D}\Omega f\Big| &\le\int_{\mathscr{X}(\mathcal{D})}d^d\alpha\,|h(\alpha)|\\ &\le C\int_{[-L,L]^d}d^d\alpha\\ &= C\,(2L)^d.\end{aligned}$$
      Both halves of the hypothesis were used: compactness of $\overline{\mathcal{D}}$ (for the two bounds), and $\overline{\mathcal{D}}\subseteq\mathcal{U}$, since $\mathscr{X}$ and $h$ are only defined on $\mathcal{U}$ and $\mathscr{X}(\mathcal{U})$. The result is an ordinary integral of a bounded continuous function over a bounded set.

  - type: numeric
    id: p1-bound
    tag: Problem 1 · Why the closure must be compact
    title: The bound in numbers
    prompt: |
      Euclidean plane, points $(a,b)$, cartesian chart $\mathscr{X}$ (density $\omega_\mathscr{X} = 1$), $f(a,b) = a^2+b^2$, and $\mathcal{D}$ the open disc of radius $2$ centred at the origin. The finiteness proof bounds
      $$\Big|\int_\mathcal{D}\Omega f\Big|\le C\,(2L)^d,$$
      where $\mathscr{X}(\overline{\mathcal{D}})\subseteq[-L,L]^d$ and $|h|\le C$ on $\mathscr{X}(\overline{\mathcal{D}})$, with $h$ the integrand. Take the smallest $L$ and $C$ that work and compute the bound.
    answer: 64
    tolerance: 0.01
    wrong:
      - { value: 16, feedback: 'That is $(2L)^d = 4^2$, the area of the square $[-2,2]^2$. The integrand is not $1$: on the closed disc $h = a^2+b^2$ reaches $C = 4$ at the rim, so the bound is $4\cdot16$.' }
      - { value: 25.1327, feedback: 'That is the actual value $8\pi$. The proof only gives an upper bound, cruder but much easier: the largest integrand times the area of a square containing the region.' }
    hint: The closed disc fits in $[-2,2]^2$, and $a^2+b^2\le4$ on it.
    explanation: |
      $L = 2$, $d = 2$, $C = 4$: the bound is $4\cdot4^2 = 64$. The true value, in polar coordinates, is
      $$\int_0^{2\pi}\!\!\int_0^2 r^2\,r\,dr\,d\theta = 8\pi\approx25.1.$$
      Crude, but finite: that is all the proof needs.

  - type: mcq
    id: p1-closure-in-m
    tag: Problem 1 · Why the closure must be compact
    title: An interval as a whole manifold
    prompt: |
      Let the manifold be the open interval $\mathcal{M} = (0,1)$ itself (an open subset of $\mathbb{R}$), with the single chart $\mathscr{X}(p) = p$, the volume form of density $\omega_\mathscr{X} = 1$, the function $f(p) = 1/p$, and the region $\mathcal{D} = \mathcal{M}$. Then
      $$\int_\mathcal{D}\Omega f = \int_0^1\frac{dp}{p} = \infty.$$
      Which part of the hypothesis fails?
    options:
      - text: 'The closure of $\mathcal{D}$ in $\mathcal{M}$ is $\mathcal{M}$ itself, which is not compact'
        correct: true
      - text: '$f$ is not smooth, since it blows up at $0$'
        feedback: |
          $0$ is not a point of $\mathcal{M} = (0,1)$, and on $(0,1)$ the function $1/p$ is smooth. It only blows up as $p$ approaches a point the manifold does not contain.
      - text: 'Nothing fails: the closure is $[0,1]$, which is compact'
        feedback: |
          The closure is taken in $\mathcal{M}$, the smallest closed subset **of $\mathcal{M}$** containing $\mathcal{D}$; $[0,1]$ is not even a subset of $\mathcal{M}$. Inside $\mathcal{M}$, $\mathcal{D} = \mathcal{M}$ is already closed, so its closure is $(0,1)$, not compact.
      - text: '$\mathcal{D}$ is not contained in the chart domain'
        feedback: |
          The chart domain is $\mathcal{U} = \mathcal{M} = \mathcal{D}$, so the containment holds. The failure is compactness.
    explanation: |
      In $\mathcal{M} = (0,1)$ the closure of $\mathcal{D} = \mathcal{M}$ is $\mathcal{M}$. It is not compact: the open sets $(\tfrac1n,1)$, $n = 2,3,\dots$, cover it, but finitely many of them leave out $(0,\tfrac1N]$. Compactness is relative to the manifold: the same interval inside $\mathbb{R}$ has compact closure $[0,1]$, and every smooth function on $\mathbb{R}$ is bounded there, but $1/p$ is not a smooth function on $\mathbb{R}$.

  - type: numeric
    id: p1-cutoff
    tag: Problem 1 · Why the closure must be compact
    title: Stopping short of the edge
    prompt: |
      Manifold $\mathcal{M} = (0,1)$ with the chart $\mathscr{X}(p) = p$, density $\omega_\mathscr{X} = 1$, and $f(p) = 1/p$. The region $\mathcal{D}_\epsilon := (\epsilon,\tfrac12)$, with $0<\epsilon<\tfrac12$, has closure $[\epsilon,\tfrac12]$ in $\mathcal{M}$: compact and inside the chart domain. Compute $\int_{\mathcal{D}_\epsilon}\Omega f$ for $\epsilon = \tfrac1{100}$.
    answer: 3.912
    tolerance: 0.005
    answerText: '\ln 50\approx3.912'
    wrong:
      - { value: 4.605, feedback: 'That is $\ln100$, the integral up to $1$. The region stops at $\tfrac12$: $\ln\tfrac12-\ln\tfrac1{100} = \ln50$.' }
      - { value: -3.912, feedback: 'The integral of $1/p$ is $\ln p$, evaluated as upper minus lower: $\ln\tfrac12-\ln\tfrac1{100} = \ln50>0$, positive like the integrand.' }
    hint: '$\int dp/p = \ln p$; evaluate from $\epsilon$ to $\tfrac12$.'
    explanation: |
      $$\int_\epsilon^{1/2}\frac{dp}{p} = \ln\frac{1}{2\epsilon} = \ln50\approx3.912.$$
      Finite for every $\epsilon>0$, as the proof promises, with the bound $C = 1/\epsilon$ on the integrand. As $\epsilon\to0$, $C$ and the integral both grow without limit: the closure approaches the missing point $0$.

  - type: text
    id: p1-edge-setup
    tag: Problem 1 · Why the closure must be compact
    title: Reaching the edge of a chart
    body: |
      Now keep compactness and break containment. Manifold $\mathcal{M} = \mathbb{R}$ with the identity chart $\mathscr{X}(p) = p$ (coordinate $\alpha$), density $\omega_\mathscr{X} = 1$, and $f = 1$, so integrals are lengths.

      Recall: the chart $\tan(\pi(p-\tfrac12))$ on $(0,1)$ stretches the region $(0,1)$ onto all of $\mathbb{R}$, an unbounded region. Here is another way to reach the edge. The chart $(\mathcal{U},\mathscr{Y})$ with $\mathcal{U} = (0,\infty)$ and
      $$\mathscr{Y}(p) := p^2,$$
      coordinate $\beta\in(0,\infty)$, inverse $\mathscr{Y}^{-1}(\beta) = \sqrt\beta$. Both directions are smooth on $(0,\infty)$, and $d\mathscr{Y}/dp = 2p>0$, so $\mathscr{Y}$ belongs to the oriented atlas.

      Take $\mathcal{D} = (0,1)$. Its closure $[0,1]$ is compact, but the endpoint $0$ is not in $\mathcal{U}$. This time the region stays bounded in the chart: $\mathscr{Y}(\mathcal{D}) = (0,1)$.

  - type: numeric
    id: p1-edge-density
    tag: Problem 1 · Why the closure must be compact
    title: The density near the edge
    prompt: |
      On $\mathbb{R}$, the identity chart $\mathscr{X}(p) = p$ has density $\omega_\mathscr{X} = 1$. The chart $\mathscr{Y}(p) := p^2$ on $\mathcal{U} = (0,\infty)$ has coordinate $\beta$ and inverse $\mathscr{Y}^{-1}(\beta) = \sqrt\beta$. In one dimension the density law reads
      $$\omega_\mathscr{Y} = \frac{d\mathscr{X}}{d\mathscr{Y}}\,\omega_\mathscr{X}.$$
      Compute $(\omega_\mathscr{Y}\circ\mathscr{Y}^{-1})(\beta)$ at $\beta = \tfrac1{100}$.
    answer: 5
    tolerance: 0.001
    wrong:
      - { value: 0.2, feedback: 'That is $d\mathscr{Y}/dp = 2p = 2\sqrt\beta$, the Jacobian the wrong way round. The law needs the old coordinate differentiated by the new one: $d\sqrt\beta/d\beta$.' }
      - { value: 1, feedback: 'A scalar density is not a scalar field: it changes with the chart. Only in the identity chart is it $1$; in $\mathscr{Y}$ it picks up $d\mathscr{X}/d\mathscr{Y}$.' }
    hint: Write $\mathscr{X}$ as a function of $\beta$, namely $\sqrt\beta$, and differentiate.
    explanation: |
      $$(\omega_\mathscr{Y}\circ\mathscr{Y}^{-1})(\beta) = \frac{d\sqrt\beta}{d\beta} = \frac{1}{2\sqrt\beta} = 5$$
      at $\beta = \tfrac1{100}$. The chart squeezes the region near $p = 0$ into very little coordinate, so the density must grow to compensate: it blows up as $\beta\to0$. The integral still gives the right length, as an improper integral:
      $$\int_0^1\frac{d\beta}{2\sqrt\beta} = \big[\sqrt\beta\,\big]_0^1 = 1.$$

  - type: mcq
    id: p1-edge-step
    tag: Problem 1 · Why the closure must be compact
    title: Which step breaks
    prompt: |
      On $\mathbb{R}$ (identity chart with density $1$, $f = 1$), the chart $\mathscr{Y}(p) = p^2$ on $(0,\infty)$ has density $1/(2\sqrt\beta)$ in its coordinate $\beta$. Integrate over $\mathcal{D} = (0,1)$ in this chart; $\overline{\mathcal{D}} = [0,1]$ is compact but $0$ is outside the chart domain. The finiteness proof has two bounds: (1) the region $\mathscr{Y}(\mathcal{D})$ is bounded, (2) the integrand is bounded on it. Which fails?
    options:
      - text: 'Only (2): the region $(0,1)$ is bounded, the integrand $1/(2\sqrt\beta)$ is not'
        correct: true
      - text: 'Only (1): the region is unbounded'
        feedback: |
          That is what happens with the chart $\tan(\pi(p-\tfrac12))$, which stretches $(0,1)$ onto $\mathbb{R}$. Here $\mathscr{Y}(\mathcal{D}) = (0,1)$ is bounded; the density blows up instead.
      - text: 'Neither: the integral converges to $1$, so the hypothesis holds'
        feedback: |
          Converging is not the hypothesis. The hypothesis is about the closure, and $0\in\overline{\mathcal{D}}$ is not in the chart domain. The integral converges only as an improper integral, thanks to the mild blow-up of $1/(2\sqrt\beta)$; the proof's bound $|h|\le C$ fails.
      - text: '$\mathscr{Y}$ is not in the oriented atlas, so its density means nothing'
        feedback: |
          $d\mathscr{Y}/dp = 2p>0$ on $(0,\infty)$, and $\mathscr{Y}$ is smooth with smooth inverse there: it is a fine chart of the oriented atlas. The problem is only the region, which reaches its edge.
    explanation: |
      When $\overline{\mathcal{D}}$ leaves the chart domain, either bound of the proof can fail: the region in coordinates (tan chart) or the integrand (the chart $p^2$). Shrinking to $(\tfrac12,1)$, with closure $[\tfrac12,1]\subseteq(0,\infty)$, restores both: the density is at most $1/(2\sqrt{1/4}) = 1$ there.

  - type: mcq
    id: p1-lesson
    tag: Problem 1 · Why the closure must be compact
    title: Each half, its job
    prompt: |
      The one-chart integral $\int_\mathcal{D}\Omega f$ requires $\overline{\mathcal{D}}$ (i) compact and (ii) contained in the chart domain $\mathcal{U}$. Examples: $1/p$ on the manifold $(0,1)$ diverges; on $\mathbb{R}$ with density $1$, the charts $\tan(\pi(p-\tfrac12))$ and $p^2$ give the length of $(0,1)$ only as improper integrals. What does each half buy?
    options:
      - text: '(i) keeps the integral finite; (ii) lets one chart show it as an ordinary integral of a bounded function over a bounded set'
        correct: true
      - text: '(ii) keeps the integral finite; without it the integral diverges'
        feedback: |
          Both edge-of-chart examples still give the finite value $1$, the true length. What fails without (ii) is the form of the answer: an improper integral, whose convergence rests on how the integrand behaves at the edge.
      - text: 'Neither matters: every open region of a manifold has a finite integral'
        feedback: |
          $1/p$ on the manifold $(0,1)$, and $f = 1$ on $(0,\infty)\subseteq\mathbb{R}$, both give $\infty$. Compactness is what rules them out.
      - text: 'They make the value the same in every chart'
        feedback: |
          Chart independence comes from the density law together with the oriented atlas ($\det>0$ on overlaps). The closure condition is about finiteness and about using a single chart.
    explanation: |
      Compactness of $\overline{\mathcal{D}}$ makes the integral finite; containment in $\mathcal{U}$ makes a single chart prove it with an ordinary integral. A region too big for one chart is cut into pieces that each fit: that is the job of a partition of unity, built by hand in the next problem.

  # ---------------------------------------------------------------- Problem 2
  - type: text
    id: p2-setup
    tag: Problem 2 · Building a partition of unity
    title: Smooth, yet switched off
    body: |
      Recall: a **partition of unity** subordinate to an open cover $\{\mathcal{U}_a\}$ is a family of smooth $\text{ᚹ}_n\colon\mathcal{M}\to[0,1]$, each with support (the closure of the set where it is nonzero) inside some $\mathcal{U}_a$, **locally finite** (each point has a neighbourhood meeting finitely many supports), with $\sum_n\text{ᚹ}_n = 1$. Their existence was stated without proof; this problem builds one on $\mathbb{R}$ and locates where the axioms of a manifold enter.

      Everything rests on one function of a single variable (unrelated to the metric):
      $$g(t) := \begin{cases}e^{-1/t}, & t>0,\\ 0, & t\le0.\end{cases}$$
      Recall the smooth step built from it,
      $$h(s) := \frac{g(\tfrac12+s)}{g(\tfrac12+s)+g(\tfrac12-s)},$$
      with $h(s) = 0$ for $s\le-\tfrac12$, $h(s) = 1$ for $s\ge\tfrac12$, and $h(s)+h(-s) = 1$. But a function glued from two smooth pieces can have a corner, like $|t|$ at $0$. Is $g$ really smooth at $t = 0$?

  - type: build
    id: p2-derivative
    tag: Problem 2 · Building a partition of unity
    title: The first derivative
    prompt: |
      Let $g(t) := e^{-1/t}$ for $t>0$ and $g(t) := 0$ for $t\le0$. Build $g'(t)$ for $t>0$ (chain rule).
    prefix: "g'(t) ="
    tiles: ['e^{-1/t}', '\frac{1}{t^2}', '-\frac{1}{t^2}', '\frac{1}{t}']
    answers:
      - ['e^{-1/t}', '\frac{1}{t^2}']
      - ['\frac{1}{t^2}', 'e^{-1/t}']
    wrong:
      - { answer: ['e^{-1/t}', '-\frac{1}{t^2}'], feedback: 'The inner function is $-1/t = -t^{-1}$, whose derivative is $+t^{-2}$: two minus signs cancel. And $g$ grows for $t>0$, so $g''$ must be positive.' }
      - { answer: ['e^{-1/t}'], feedback: 'The exponential reproduces itself, but the chain rule multiplies by the derivative of the exponent $-1/t$, which is $1/t^2$.' }
      - { answer: ['e^{-1/t}', '\frac{1}{t}'], feedback: 'The exponent is $-1/t$, not $\ln t$: its derivative is $1/t^2$, not $1/t$.' }
    hint: Derivative of the exponent $-t^{-1}$ times the exponential.
    explanation: |
      $$g'(t) = \frac{1}{t^2}\,e^{-1/t},\qquad t>0.$$
      Differentiating again only produces more powers of $1/t$: every derivative is a polynomial in $1/t$ times $e^{-1/t}$.

  - type: numeric
    id: p2-flat
    tag: Problem 2 · Building a partition of unity
    title: How flat near zero
    prompt: |
      For $t>0$, $g(t) = e^{-1/t}$ has slope $g'(t) = t^{-2}e^{-1/t}$. Compute this slope at $t = \tfrac1{10}$ (four significant figures are plenty).
    answer: 0.00454
    tolerance: 0.00003
    answerText: '100\,e^{-10}\approx0.00454'
    wrong:
      - { value: 0.0000454, feedback: 'That is $e^{-10}$ alone. The factor $t^{-2} = 100$ is missing; even with it, the slope is tiny.' }
      - { value: 0.000454, feedback: 'The factor is $t^{-2} = 100$, not $t^{-1} = 10$.' }
    hint: '$t^{-2} = 100$ and $e^{-10}\approx4.54\times10^{-5}$.'
    explanation: |
      $100\,e^{-10}\approx0.00454$: the power $100$ loses badly to the exponential. In general, with $x := 1/t$,
      $$t^{-m}e^{-1/t} = x^me^{-x}\to0\quad(x\to\infty)$$
      for every power $m$: the exponential beats any polynomial.

  - type: mcq
    id: p2-smooth
    tag: Problem 2 · Building a partition of unity
    title: Why it is smooth at zero
    prompt: |
      $g(t) := e^{-1/t}$ for $t>0$, $g(t) := 0$ for $t\le0$. Why is $g$ smooth (all derivatives exist and are continuous) at $t = 0$?
    options:
      - text: 'For $t>0$ each derivative is a polynomial in $1/t$ times $e^{-1/t}$, which tends to $0$; so every derivative exists at $0$, equals $0$, and matches the left side'
        correct: true
      - text: 'It is continuous at $0$ and smooth on each side, which is enough'
        feedback: |
          $|t|$ is continuous at $0$ and smooth on each side, yet has a corner: slopes $-1$ and $+1$ meet. Each derivative must also match from both sides, which here requires $t^{-m}e^{-1/t}\to0$.
      - text: 'It equals its Taylor series at $0$'
        feedback: |
          Its Taylor series at $0$ has all coefficients $g^{(k)}(0) = 0$, so it is the zero series, while $g(t)>0$ for $t>0$. $g$ is smooth but **not** analytic, and that is exactly why bump functions can exist: an analytic function that vanishes on an interval vanishes everywhere.
      - text: 'It is a composition of smooth functions on all of $\mathbb{R}$'
        feedback: |
          $-1/t$ is not defined at $t = 0$, so $e^{-1/t}$ is not a composition of functions smooth on $\mathbb{R}$. Smoothness at $0$ needs the limit argument.
    explanation: |
      At $0$, the right-hand difference quotient of each derivative is again of the form $t^{-m}e^{-1/t}\to0$, and the left-hand one is $0$. So $g^{(k)}(0) = 0$ for every $k$, and each $g^{(k)}$ is continuous. Hence $h$, built from $g$ by sums and a quotient with nonvanishing denominator, is smooth too.

  - type: text
    id: p2-staircase
    tag: Problem 2 · Building a partition of unity
    title: A staircase on the line
    body: |
      Cover $\mathbb{R}$ by the open intervals
      $$\mathcal{U}_n := (n-1,\,n+1),\qquad n\in\mathbb{Z}.$$
      Shift and squeeze the step: for each $n$,
      $$H_n(p) := h(2p-2n+1)$$
      is $0$ for $p\le n-\tfrac34$, $1$ for $p\ge n-\tfrac14$, and never decreases (neither does $h$). So $H_n$ climbs from $0$ to $1$ just left of $n$, and $H_{n+1}$ climbs just left of $n+1$.

      Goal: smooth $\text{ᚹ}_n\ge0$ with support inside $\mathcal{U}_n$, adding up to exactly $1$.

  - type: build
    id: p2-build
    tag: Problem 2 · Building a partition of unity
    title: Steps into a partition
    prompt: |
      On $\mathbb{R}$, the smooth steps $H_n(p) := h(2p-2n+1)$, $n\in\mathbb{Z}$, are $0$ for $p\le n-\tfrac34$, $1$ for $p\ge n-\tfrac14$, and nondecreasing. Build $\text{ᚹ}_n$ from them so that $\text{ᚹ}_n\ge0$, its support lies in $\mathcal{U}_n = (n-1,n+1)$, and the sum over $n$ collapses to $1$.
    prefix: '\text{ᚹ}_n ='
    tiles: ['H_n', '-', '+', 'H_{n+1}', 'H_{n-1}']
    answers:
      - ['H_n', '-', 'H_{n+1}']
      - ['-', 'H_{n+1}', '+', 'H_n']
    wrong:
      - { answer: ['H_{n+1}', '-', 'H_n'], feedback: 'The steps never decrease and $H_{n+1}$ climbs later, so $H_{n+1}\le H_n$: this difference is $\le0$. A partition of unity takes values in $[0,1]$.' }
      - { answer: ['H_n', '+', 'H_{n+1}'], feedback: 'A sum of steps is $2$ far to the right, and adding over all $n$ gives infinitely many terms near $2$. A difference makes the sum telescope.' }
      - { answer: ['H_n'], feedback: '$H_n = 1$ on the whole half-line $p\ge n-\tfrac14$: its support is not inside $(n-1,n+1)$, and infinitely many $H_n$ equal $1$ at each point.' }
      - { answer: ['H_{n-1}', '-', 'H_n'], feedback: 'This is a partition of unity, but for the wrong cover: it is nonzero on $(n-\tfrac74,\,n-\tfrac14)$, which sticks out of $\mathcal{U}_n = (n-1,n+1)$ on the left. Shift by one.' }
    hint: A difference of two neighbouring steps is a bump, and a sum of differences telescopes.
    explanation: |
      $$\text{ᚹ}_n(p) = h(2p-2n+1)-h(2p-2n-1).$$
      It is nonzero only on $(n-\tfrac34,\,n+\tfrac34)$, so its support $[n-\tfrac34,n+\tfrac34]$ lies in $\mathcal{U}_n$; it is in $[0,1]$ since $H_{n+1}\le H_n$. At a fixed $p$, for $N$ large,
      $$\sum_{n=-N}^{N}\text{ᚹ}_n(p) = H_{-N}(p)-H_{N+1}(p) = 1-0.$$

  - type: numeric
    id: p2-value
    tag: Problem 2 · Building a partition of unity
    title: Halfway between two integers
    prompt: |
      On $\mathbb{R}$, $\text{ᚹ}_n(p) := h(2p-2n+1)-h(2p-2n-1)$, where $h$ is a smooth step: $h(s) = 0$ for $s\le-\tfrac12$, $h(s) = 1$ for $s\ge\tfrac12$, and $h(s)+h(-s) = 1$ for all $s$. Compute $\text{ᚹ}_3(3.5)$.
    answer: 0.5
    answerText: '\tfrac12'
    wrong:
      - { value: 1, feedback: 'The first step is $h(2) = 1$, but the second is $h(2\cdot3.5-6-1) = h(0)$, not $0$: from $h(0)+h(0) = 1$, $h(0) = \tfrac12$.' }
      - { value: 0, feedback: 'Only the second step is at its midpoint: $h(2\cdot3.5-6+1) = h(2) = 1$ and $h(0) = \tfrac12$.' }
    hint: Evaluate both arguments; the symmetry at $s = 0$ gives $h(0)$.
    explanation: |
      $\text{ᚹ}_3(3.5) = h(2)-h(0) = 1-\tfrac12 = \tfrac12$, and likewise $\text{ᚹ}_4(3.5) = h(0)-h(-2) = \tfrac12$: the two neighbours share the point equally, and the sum is $1$.

  - type: numeric
    id: p2-local
    tag: Problem 2 · Building a partition of unity
    title: How many at once
    prompt: |
      On $\mathbb{R}$, $\text{ᚹ}_n(p) := h(2p-2n+1)-h(2p-2n-1)$ for $n\in\mathbb{Z}$, with $h(s) = 0$ for $s\le-\tfrac12$, $h(s) = 1$ for $s\ge\tfrac12$, $h$ strictly between $0$ and $1$ in between. How many of the $\text{ᚹ}_n$ are nonzero at $p = 3.3$?
    answer: 2
    wrong:
      - { value: 1, feedback: '$\text{ᚹ}_4(3.3) = h(-0.4)-h(-2.4) = h(-0.4)$, and $-0.4>-\tfrac12$, so $h(-0.4)>0$. Both $\text{ᚹ}_3$ and $\text{ᚹ}_4$ are on.' }
      - { value: 3, feedback: '$\text{ᚹ}_2(3.3) = h(3.6)-h(1.6) = 1-1 = 0$: by $p = 3.3$ both steps of $\text{ᚹ}_2$ have finished climbing.' }
    hint: '$\text{ᚹ}_n$ is nonzero exactly on $(n-\tfrac34,n+\tfrac34)$.'
    explanation: |
      $\text{ᚹ}_3$ and $\text{ᚹ}_4$: $3.3$ is within $\tfrac34$ of $3$ and of $4$ only. The supports are intervals of length $\tfrac32$ centred at the integers, so a small interval around any point meets at most three of them: **locally finite**, although there are infinitely many functions.

  - type: mcq
    id: p2-refine
    tag: Problem 2 · Building a partition of unity
    title: Too many charts
    prompt: |
      The integral over a manifold needs a partition of unity subordinate to the cover by the chart domains of the oriented atlas $\mathcal{A}^\uparrow$. On $\mathbb{R}$, a maximal $\mathcal{A}^\uparrow$ contains, for every $c\in\mathbb{R}$, the identity chart restricted to $(c-1,c+1)$. Why can't a partition of unity give each chart domain its own nonzero function?
    options:
      - text: 'Each point lies in infinitely many of those domains, so the functions could not be locally finite; one first picks fewer sets, like $(n-1,n+1)$, $n\in\mathbb{Z}$'
        correct: true
      - text: 'Overlapping domains would count the overlap twice'
        feedback: |
          Overlaps are harmless: the weights $\text{ᚹ}_n$ add up to $1$ at each point, so nothing is counted twice. The problem is how many sets overlap at each point.
      - text: 'A partition of unity may only contain finitely many functions'
        feedback: |
          The staircase $\text{ᚹ}_n$, $n\in\mathbb{Z}$, has infinitely many functions and is a fine partition of unity: only finitely many are nonzero near each point. That is the requirement, local finiteness.
      - text: 'Charts whose domains overlap are not allowed in the same atlas'
        feedback: |
          Atlases are made of overlapping charts; the transition maps on overlaps are what compatibility and orientation are about.
    explanation: |
      Every $p$ lies in all $(c-1,c+1)$ with $|c-p|<1$: uncountably many sets, and every neighbourhood of $p$ meets them all. So the proof first **refines** the cover: it chooses open sets, each inside some chart domain, finitely many near each point. A space where every open cover has such a locally finite refinement is called **paracompact**; it is the property partitions of unity really rest on.

  - type: order
    id: p2-existence
    tag: Problem 2 · Building a partition of unity
    title: The existence proof in outline
    prompt: |
      Outline of why every open cover $\{\mathcal{U}_a\}$ of a manifold (Hausdorff, second countable) admits a subordinate partition of unity. Bump functions: smooth, $\ge0$, positive at a chosen point, with compact support. Put the steps in order.
    steps:
      - 'Second countability: countably many basic open sets with compact closures cover $\mathcal{M}$.'
      - 'From them, compact sets $\mathcal{K}_1\subseteq\mathcal{K}_2\subseteq\dots$ exhaust $\mathcal{M}$, each inside the interior of the next.'
      - 'Cut $\mathcal{M}$ into compact rings $\mathcal{K}_{j+1}\setminus\mathrm{int}\,\mathcal{K}_j$.'
      - 'Compactness of each ring: finitely many bump functions, each with support in some $\mathcal{U}_a$, suffice to have one positive at every point of the ring.'
      - 'Each point meets only the bumps of nearby rings: the family is locally finite.'
      - 'Divide each bump by the sum of all bumps, a finite and positive sum near each point.'
    hint: Countably many sets first, then compact pieces, then finitely many bumps per piece, and normalize last.
    explanation: |
      Second countability enters only at the start, supplying countably many sets and hence an exhaustion by countably many compact sets. Hausdorff enters through "compact sets are closed" (needed for closures and for extending bumps by zero). Compactness reduces each ring to finitely many bumps; the last step is
      $$\text{ᚹ}_n := \frac{\varphi_n}{\sum_k\varphi_k},$$
      for bumps $\varphi_n$, smooth because near each point the sum is finite.

  - type: mcq
    id: p2-hausdorff
    tag: Problem 2 · Building a partition of unity
    title: Two origins, one contradiction
    prompt: |
      The line with two origins: two copies of $\mathbb{R}$ glued at every $t\neq0$, keeping two origins $0_A$ and $0_B$ (every neighbourhood of either contains the points $t\neq0$ near $0$). Cover it by $\mathcal{U}_A$ (copy $A$, contains $0_A$ but not $0_B$) and $\mathcal{U}_B$. Suppose $\text{ᚹ}_A+\text{ᚹ}_B = 1$ with $\mathrm{supp}\,\text{ᚹ}_A\subseteq\mathcal{U}_A$, $\mathrm{supp}\,\text{ᚹ}_B\subseteq\mathcal{U}_B$. Since $0_A\notin\mathrm{supp}\,\text{ᚹ}_B$, $\text{ᚹ}_B = 0$ near $0_A$. What does continuity then force for $\text{ᚹ}_A(0_B)$?
    options:
      - text: '$1$, contradicting $0_B\notin\mathrm{supp}\,\text{ᚹ}_A$'
        correct: true
      - text: '$0$, with no contradiction'
        feedback: |
          $\text{ᚹ}_A = 1-\text{ᚹ}_B = 1$ at every $t\neq0$ near $0$. Those points crowd around $0_B$ too, so continuity forces $\text{ᚹ}_A(0_B) = 1$, while the support condition forces $0$. Both cannot hold.
      - text: '$\tfrac12$, shared between the two origins'
        feedback: |
          Nothing splits the value: $\text{ᚹ}_A = 1$ at all $t\neq0$ near $0$, and continuity at $0_B$ copies that value, $1$.
      - text: 'It is undefined, because $0_B$ is not in $\mathcal{U}_A$'
        feedback: |
          $\text{ᚹ}_A$ is a function on the whole manifold; outside its support it is $0$. The trouble is that continuity demands $1$ there instead.
    explanation: |
      $\text{ᚹ}_A = 1$ at all $t\neq0$ close to $0$, and every neighbourhood of $0_B$ contains such $t$, so $\text{ᚹ}_A(0_B) = 1$. But $0_B\notin\mathcal{U}_A\supseteq\mathrm{supp}\,\text{ᚹ}_A$ gives $\text{ᚹ}_A(0_B) = 0$. No such partition exists: without Hausdorff, partitions of unity can fail.

  - type: mcq
    id: p2-long-line
    tag: Problem 2 · Building a partition of unity
    title: Too long to integrate
    prompt: |
      The long line is built by gluing uncountably many intervals end to end: connected, Hausdorff, locally like $\mathbb{R}$, but not second countable (no countable basis of open sets). Why can it have no countable partition of unity subordinate to its chart domains, as the integral over a manifold uses?
    options:
      - text: 'The supports would put the whole space inside countably many chart domains, and then rational balls in those charts would give a countable basis'
        correct: true
      - text: 'It is not Hausdorff'
        feedback: |
          The long line is Hausdorff; it fails only second countability. Hausdorff failures are the line with two origins.
      - text: 'Smooth steps cannot be defined on it'
        feedback: |
          Locally it looks like $\mathbb{R}$, so bump functions exist inside every chart. The obstruction is global: too many charts are needed.
      - text: 'It is compact, so no partition is needed'
        feedback: |
          It is not compact (it is far too long), and compactness would not remove the need for a partition: the circle is compact and still needs two charts.
    explanation: |
      Every point has some $\text{ᚹ}_n>0$, so the countably many supports cover the space, each inside a chart domain $\mathcal{U}_k$. The preimages $\mathscr{X}_k^{-1}(B)$ of the balls $B$ with rational centres and radii then form a countable basis. The long line has none, so integrals over it cannot be glued from chart integrals: second countability is not a technicality.

  # ---------------------------------------------------------------- Problem 3
  - type: text
    id: p3-setup
    tag: Problem 3 · The area of a torus
    title: A doughnut in charts
    body: |
      A **torus** with radii $R>\rho>0$ is the surface in $\mathbb{R}^3$ swept by a circle of radius $\rho$ whose centre runs round a horizontal circle of radius $R$. Points $(a,b,c)\in\mathbb{R}^3$; chart $\mathscr{X} = (\vartheta,\varphi)$, with $\vartheta$ the angle round the tube ($\vartheta = 0$ on the outer rim) and $\varphi$ the angle round the vertical axis, both in $(0,2\pi)$. Its inverse:
      $$\begin{aligned}a &= (R+\rho\cos\vartheta)\cos\varphi,\\ b &= (R+\rho\cos\vartheta)\sin\varphi,\\ c &= \rho\sin\vartheta.\end{aligned}$$
      $\mathscr{X}$ misses two circles: the outer rim $\vartheta = 0$ and the cross-section $\varphi = 0$.

      The metric is **induced** from $\mathbb{R}^3$: with the coordinate-line arrows $\vec u_\vartheta := \partial\mathscr{X}^{-1}/\partial\vartheta$ and $\vec u_\varphi := \partial\mathscr{X}^{-1}/\partial\varphi$, the components are the dot products $g_{ij} = \vec u_i\cdot\vec u_j$. Orient the torus by declaring $\mathscr{X}$ positive. The area of a region is its integral of $f = 1$ against $\Omega^g$.

  - type: mcq
    id: p3-guess
    tag: Problem 3 · The area of a torus
    title: Guess first
    prompt: |
      A torus in $\mathbb{R}^3$: the surface swept by a circle of radius $\rho$ whose centre runs round a circle of radius $R>\rho$. Before computing, guess its area.
    options:
      - text: '$4\pi^2R\rho$'
        correct: true
      - text: '$2\pi^2R\rho^2$'
        feedback: |
          That is the **volume** of the solid torus: the disc area $\pi\rho^2$ times the path length $2\pi R$. Area needs the circumference $2\pi\rho$, not the disc.
      - text: '$4\pi^2(R+\rho)\rho$'
        feedback: |
          That treats every point as if it went round the outer rim, at distance $R+\rho$ from the axis. The inner side is closer, at distance down to $R-\rho$, and runs a shorter way round.
      - text: '$4\pi\rho^2$'
        feedback: |
          That is a sphere of radius $\rho$. The torus area must grow with $R$: a bigger ring has a longer tube.
    explanation: |
      $4\pi^2R\rho = (2\pi\rho)(2\pi R)$: the tube's circumference times the length of its centre line, as for a cylinder bent into a ring. The outer half is stretched and the inner half compressed, and the computation below shows the two effects cancel exactly.

  - type: mcq
    id: p3-metric
    tag: Problem 3 · The area of a torus
    title: The induced metric
    prompt: |
      Torus with radii $R>\rho>0$, chart $(\vartheta,\varphi)$ with inverse
      $$\begin{aligned}a &= (R+\rho\cos\vartheta)\cos\varphi,\\ b &= (R+\rho\cos\vartheta)\sin\varphi,\\ c &= \rho\sin\vartheta.\end{aligned}$$
      The induced metric has components $g_{ij} = \vec u_i\cdot\vec u_j$, the dot products in $\mathbb{R}^3$ of $\vec u_\vartheta := \partial\mathscr{X}^{-1}/\partial\vartheta$ and $\vec u_\varphi := \partial\mathscr{X}^{-1}/\partial\varphi$. Which matrix is $(g_{ij})$?
    options:
      - text: '$\mathrm{diag}(\rho^2,\,(R+\rho\cos\vartheta)^2)$'
        correct: true
      - text: '$\mathrm{diag}(1,\,(R+\rho\cos\vartheta)^2)$'
        feedback: |
          $\vec u_\vartheta = \rho(-\sin\vartheta\cos\varphi,-\sin\vartheta\sin\varphi,\cos\vartheta)$ carries the factor $\rho$: one radian round a tube of radius $\rho$ covers length $\rho$, so $g_{\vartheta\vartheta} = \rho^2$.
      - text: '$\mathrm{diag}(\rho^2,\,R^2)$'
        feedback: |
          Going round the axis, a point travels on a horizontal circle of radius $R+\rho\cos\vartheta$, its distance to the axis, not $R$: $\vec u_\varphi = (R+\rho\cos\vartheta)(-\sin\varphi,\cos\varphi,0)$.
      - text: '$\begin{pmatrix}\rho^2&\rho(R+\rho\cos\vartheta)\\ \rho(R+\rho\cos\vartheta)&(R+\rho\cos\vartheta)^2\end{pmatrix}$'
        feedback: |
          The off-diagonal entry is the dot product $\vec u_\vartheta\cdot\vec u_\varphi$, not the product of the lengths. Here it is $0$: the two coordinate lines cross at right angles. (This matrix even has determinant $0$, which no metric allows.)
    hint: 'Compute $\vec u_\vartheta = \rho(-\sin\vartheta\cos\varphi,-\sin\vartheta\sin\varphi,\cos\vartheta)$ and $\vec u_\varphi = (R+\rho\cos\vartheta)(-\sin\varphi,\cos\varphi,0)$.'
    explanation: |
      $|\vec u_\vartheta|^2 = \rho^2$, $|\vec u_\varphi|^2 = (R+\rho\cos\vartheta)^2$, and
      $$\begin{aligned}\frac{\vec u_\vartheta\cdot\vec u_\varphi}{\rho(R+\rho\cos\vartheta)} &= \sin\vartheta\cos\varphi\sin\varphi\\ &\quad-\sin\vartheta\sin\varphi\cos\varphi\\ &= 0.\end{aligned}$$
      So $\det g_\mathscr{X} = \rho^2(R+\rho\cos\vartheta)^2$.

  - type: numeric
    id: p3-density
    tag: Problem 3 · The area of a torus
    title: The density on the inner side
    prompt: |
      Torus with radii $R = 3$, $\rho = 1$, chart $\mathscr{X} = (\vartheta,\varphi)$ declared positive, induced metric
      $$(g_{ij}) = \mathrm{diag}\big(\rho^2,(R+\rho\cos\vartheta)^2\big).$$
      Compute the density $\omega^g_\mathscr{X}$ of the metric volume form at $\vartheta = \tfrac{2\pi}3$.
    answer: 2.5
    tolerance: 0.001
    wrong:
      - { value: 6.25, feedback: 'That is $\det g_\mathscr{X} = (3-\tfrac12)^2$. The density is its square root: areas scale with lengths, not squared lengths.' }
      - { value: 4, feedback: 'That is $\rho(R+\rho)$, the value on the outer rim $\vartheta = 0$. At $\vartheta = \tfrac{2\pi}3$, $\cos\vartheta = -\tfrac12$: the point is on the inner side.' }
      - { value: 3, feedback: 'That is $\rho R$, the value on the top circle $\vartheta = \tfrac\pi2$. Here $\cos\vartheta = -\tfrac12$ lowers it.' }
    hint: '$\omega^g_\mathscr{X} = \sqrt{|\det g_\mathscr{X}|} = \rho\,(R+\rho\cos\vartheta)$, positive because $R>\rho$.'
    explanation: |
      $$\omega^g_\mathscr{X} = \rho\,(R+\rho\cos\vartheta) = 1\cdot(3-\tfrac12) = 2.5.$$
      The density is largest on the outer rim ($4$) and smallest on the inner rim ($2$): the inner side is squeezed.

  - type: numeric
    id: p3-inner
    tag: Problem 3 · The area of a torus
    title: The inner patch
    prompt: |
      Torus with $R = 3$, $\rho = 1$, chart $\mathscr{X} = (\vartheta,\varphi)\in(0,2\pi)^2$, density $\omega^g_\mathscr{X} = \rho(R+\rho\cos\vartheta)$. The inner patch $\mathcal{D}_{\mathrm{in}}$: $\tfrac\pi2<\vartheta<\tfrac{3\pi}2$, $\tfrac\pi2<\varphi<\tfrac{3\pi}2$ (closure inside the chart domain). Compute its area.
    answer: 23.3257
    tolerance: 0.01
    answerText: '\pi(3\pi-2)\approx23.33'
    wrong:
      - { value: 29.6088, feedback: 'That is $3\pi^2$, the area of a straight cylinder patch with density $\rho R = 3$. The $\cos\vartheta$ term does not vanish here: on $(\tfrac\pi2,\tfrac{3\pi}2)$, $\cos\vartheta<0$.' }
      - { value: 35.892, feedback: 'Sign slip: $[\sin\vartheta]_{\pi/2}^{3\pi/2} = -1-1 = -2$, so the cosine term subtracts. The inner side has less area than a cylinder, not more.' }
    hint: Integrate $3+\cos\vartheta$ over $\vartheta$, then multiply by the $\varphi$-width $\pi$.
    explanation: |
      $$\begin{aligned}\int_{\pi/2}^{3\pi/2}(3+\cos\vartheta)\,d\vartheta &= 3\pi+[\sin\vartheta]_{\pi/2}^{3\pi/2}\\ &= 3\pi-2,\end{aligned}$$
      times $\pi$ for $\varphi$: area $\pi(3\pi-2)\approx23.33$.

  - type: text
    id: p3-second-chart
    tag: Problem 3 · The area of a torus
    title: The outer patch needs another chart
    body: |
      The outer patch $\mathcal{D}_{\mathrm{out}}$: $-\tfrac\pi2<\vartheta<\tfrac\pi2$, same $\varphi$ range. Its closure contains the outer rim $\vartheta = 0$, which $\mathscr{X}$ misses, so $\mathscr{X}$ cannot integrate it.

      Take the chart $\mathscr{Y}$ given by the same formulas with $\vartheta\in(-\pi,\pi)$ and $\varphi\in(0,2\pi)$. On the overlap, the $\vartheta$ of $\mathscr{Y}$ equals that of $\mathscr{X}$ or that minus $2\pi$, and $\varphi$ is unchanged: the Jacobian is the identity, determinant $1>0$. So $\mathscr{Y}$ belongs to the oriented atlas, and since $\cos$ has period $2\pi$, its metric components and density are given by the same formula, $\omega^g_\mathscr{Y} = \rho(R+\rho\cos\vartheta)$.

  - type: numeric
    id: p3-outer
    tag: Problem 3 · The area of a torus
    title: The outer patch
    prompt: |
      Torus with $R = 3$, $\rho = 1$, chart $\mathscr{Y}$ with $\vartheta\in(-\pi,\pi)$, $\varphi\in(0,2\pi)$, in the oriented atlas, density $\omega^g_\mathscr{Y} = \rho(R+\rho\cos\vartheta)$. The outer patch: $-\tfrac\pi2<\vartheta<\tfrac\pi2$, $\tfrac\pi2<\varphi<\tfrac{3\pi}2$. Compute its area.
    answer: 35.892
    tolerance: 0.01
    answerText: '\pi(3\pi+2)\approx35.89'
    wrong:
      - { value: 23.3257, feedback: 'That is the inner patch, where $\cos\vartheta<0$. On $(-\tfrac\pi2,\tfrac\pi2)$, $\cos\vartheta>0$ and $[\sin\vartheta]_{-\pi/2}^{\pi/2} = +2$.' }
      - { value: 29.6088, feedback: 'That is $3\pi^2$, as if the density were the constant $\rho R = 3$. The outer side is farther from the axis: the cosine term adds $2\pi$.' }
    hint: Integrate $3+\cos\vartheta$ from $-\tfrac\pi2$ to $\tfrac\pi2$, then multiply by $\pi$.
    explanation: |
      $(3\pi+2)\cdot\pi\approx35.89$. Inner plus outer: $6\pi^2\approx59.22$, half the torus (half a turn in $\varphi$, both halves of the tube; the two seam circles $\vartheta = \pm\tfrac\pi2$ have zero area). The outer half beats the inner half by exactly $4\pi$.

  - type: numeric
    id: p3-mirror
    tag: Problem 3 · The area of a torus
    title: Swapping the coordinates
    prompt: |
      Torus with $R = 3$, $\rho = 1$, oriented by declaring $\mathscr{X} = (\vartheta,\varphi)\in(0,2\pi)^2$ positive; $\Omega^g$ has density $\rho(R+\rho\cos\vartheta)$ in $\mathscr{X}$. The chart $\mathscr{Z} := (\varphi,\vartheta)$ lists the same angles in the other order. Using the density law for $\Omega^g$ in $\mathscr{Z}$, compute the one-chart integral of $f = 1$ over the inner patch $\tfrac\pi2<\vartheta,\varphi<\tfrac{3\pi}2$ in $\mathscr{Z}$.
    answer: -23.3257
    tolerance: 0.01
    answerText: '-\pi(3\pi-2)\approx-23.33'
    wrong:
      - { value: 23.3257, feedback: '$\sqrt{|\det g|}$ is the density only in charts of the oriented atlas. Swapping the coordinates has Jacobian $\begin{pmatrix}0&1\\1&0\end{pmatrix}$, determinant $-1$, so the density law gives $\omega^g_\mathscr{Z} = -\rho(R+\rho\cos\vartheta)$.' }
    hint: 'Density law: $\omega_\mathscr{Z} = \det(\partial\mathscr{X}^i/\partial\mathscr{Z}^j)\,\omega_\mathscr{X}$, and swapping two coordinates has determinant $-1$.'
    explanation: |
      $\omega^g_\mathscr{Z} = -\rho(R+\rho\cos\vartheta)$, so the same patch gives $-\pi(3\pi-2)\approx-23.33$. A chart of the wrong orientation does not change the area; it reports it with the opposite sign. Areas are computed with charts of $\mathcal{A}^\uparrow$ only.

  - type: numeric
    id: p3-cover
    tag: Problem 3 · The area of a torus
    title: Two charts are not enough
    prompt: |
      On the torus, choose for each angle the range $(0,2\pi)$ or $(-\pi,\pi)$: four charts. $\mathscr{X}$ has both angles in $(0,2\pi)$, so it misses the circles $\vartheta = 0$ and $\varphi = 0$. $\mathscr{W}$ has both angles in $(-\pi,\pi)$, so it misses the circles $\vartheta = \pi$ and $\varphi = \pi$. How many points of the torus lie in **neither** domain?
    answer: 2
    wrong:
      - { value: 0, feedback: 'On the circle, angle ranges $(0,2\pi)$ and $(-\pi,\pi)$ do cover everything. On the torus a point is missed if **either** angle hits a cut: the point $(\vartheta,\varphi) = (0,\pi)$ lies on a missing circle of each chart.' }
      - { value: 4, feedback: '$(0,0)$ lies in $\mathscr{W}$ and $(\pi,\pi)$ lies in $\mathscr{X}$. Only the mixed points $(0,\pi)$ and $(\pi,0)$ are missed by both.' }
    hint: Missed by $\mathscr{X}$ means $\vartheta = 0$ or $\varphi = 0$; missed by $\mathscr{W}$ means $\vartheta = \pi$ or $\varphi = \pi$. Combine.
    explanation: |
      Missed by both: ($\vartheta = 0$ or $\varphi = 0$) and ($\vartheta = \pi$ or $\varphi = \pi$), which leaves $(\vartheta,\varphi) = (0,\pi)$ and $(\pi,0)$. A third chart with mixed ranges, such as $\mathscr{Y}$, is needed; using all four keeps the next construction symmetric.

  - type: numeric
    id: p3-total
    tag: Problem 3 · The area of a torus
    title: The whole torus
    prompt: |
      Torus with $R = 3$, $\rho = 1$, chart $\mathscr{X} = (\vartheta,\varphi)\in(0,2\pi)^2$, density $\rho(R+\rho\cos\vartheta)$. $\mathscr{X}$ misses only two circles, a set of zero area, which can be dropped. Compute the area of the whole torus.
    answer: 118.4353
    tolerance: 0.05
    answerText: '12\pi^2\approx118.44'
    wrong:
      - { value: 375.0356, feedback: 'That is $\int\!\!\int(3+\cos\vartheta)^2 = 38\pi^2$: the determinant without the square root.' }
      - { value: 59.2176, feedback: 'That is $6\pi^2$, the half torus $\tfrac\pi2<\varphi<\tfrac{3\pi}2$. The full turn in $\varphi$ has width $2\pi$.' }
      - { value: 157.9137, feedback: 'That is $16\pi^2 = 4\pi^2(R+\rho)\rho$, as if the whole torus had the outer-rim density $4$. The cosine term averages to zero over a full turn.' }
    hint: Over a full turn, $\int_0^{2\pi}\cos\vartheta\,d\vartheta = 0$.
    explanation: |
      $$\begin{aligned}\int_0^{2\pi}\!\!\int_0^{2\pi}\rho(R+\rho\cos\vartheta)\,d\vartheta\,d\varphi &= 2\pi\cdot2\pi\rho R\\ &= 4\pi^2R\rho,\end{aligned}$$
      $12\pi^2\approx118.44$ at $R = 3$, $\rho = 1$: the guess $(2\pi\rho)(2\pi R)$ was right.

  - type: mcq
    id: p3-partition
    tag: Problem 3 · The area of a torus
    title: The same answer from a partition
    prompt: |
      Torus with radii $R>\rho$, covered by the four charts whose angles $\vartheta,\varphi$ each range over $(0,2\pi)$ or $(-\pi,\pi)$, all in the oriented atlas, each with density $\rho(R+\rho\cos\vartheta)$. Since $\cos\vartheta$ and $\cos\varphi$ are defined at every point, the products
      $$h(\pm\cos\vartheta)\,h(\pm\cos\varphi)$$
      ($h$ the smooth step, $h(s)+h(-s) = 1$; minus sign for the range $(0,2\pi)$, plus for $(-\pi,\pi)$) form a partition of unity subordinate to the four charts. Why do the four chart integrals add up to $4\pi^2R\rho$?
    options:
      - text: 'Each integrand vanishes near the edges of its square and has period $2\pi$, so each can be moved to $(0,2\pi)^2$; there the four weights add to $1$'
        correct: true
      - text: 'Each of the four pieces equals a quarter of the area, $\pi^2R\rho$'
        feedback: |
          In $\varphi$ each weight averages to $\tfrac12$, but in $\vartheta$ the weight $h(-\cos\vartheta)$ favours the inner side, where the density is smaller. So the pieces are unequal; only their sum is fixed.
      - text: 'The overlaps are counted twice, so their areas must be subtracted at the end'
        feedback: |
          The weights add up to $1$ at every point, so each point contributes exactly once in total. Nothing is double counted, and nothing needs subtracting.
      - text: 'Only one chart contributes; the other three integrals vanish'
        feedback: |
          Every weight is positive somewhere (each product is $1$ near some point), so every piece is a positive area. They share the torus, they do not ignore it.
    explanation: |
      Each piece is $\iint\rho(R+\rho\cos\vartheta)\,\text{ᚹ}\,d\vartheta\,d\varphi$ over its chart's square. The supports avoid the cut circles, and all functions involved have period $2\pi$ in both angles, so every piece equals the integral of its own integrand over $(0,2\pi)^2$. Adding,
      $$\begin{aligned}&\big(h(-\cos\vartheta)+h(\cos\vartheta)\big)\\ &\cdot\big(h(-\cos\varphi)+h(\cos\varphi)\big) = 1,\end{aligned}$$
      leaves $\iint_{(0,2\pi)^2}\rho(R+\rho\cos\vartheta) = 4\pi^2R\rho$: the shortcut "drop a set of zero area" agrees with the definition.

  # ---------------------------------------------------------------- Problem 4
  - type: text
    id: p4-setup
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: Two events and everything between them
    body: |
      Take 1+1 Minkowski spacetime: $\mathcal{M} = \mathbb{R}^2$ with points $(t,a)$ (time $t$, position $a$, units with the speed of light $c = 1$), the inertial chart $\mathscr{X} = (t,a)$, and the metric $\eta$ with components
      $$\eta_\mathscr{X} = \begin{pmatrix}-1&0\\0&1\end{pmatrix}.$$
      Orient $\mathcal{M}$ so that $\mathscr{X}$ is in the oriented atlas $\mathcal{A}^\uparrow$. Then $\omega^g_\mathscr{X} = \sqrt{|{-1}|} = 1$.

      Take two events: $O = (0,0)$ and $P = (2,0)$, the same place two time units apart. The **causal diamond** $\mathcal{D}$ is the set of events that a signal from $O$ can reach and that can still send a signal to $P$ (signals no faster than light):
      $$|a|<t\ \text{ and }\ |a|<2-t.$$
      Its boundary is made of four light rays, at $45°$ in the $(t,a)$ plane.

      A second observer, moving relative to the first, puts $P$ at time $\tfrac52$ instead of $2$. Do the two observers agree on the spacetime volume of $\mathcal{D}$? This problem computes it in three charts.

  - type: mcq
    id: p4-square
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: The diamond in light-cone coordinates
    prompt: |
      On 1+1 Minkowski spacetime with points $(t,a)$, the causal diamond between $O = (0,0)$ and $P = (2,0)$ is
      $$\mathcal{D} = \{\,|a|<t,\ |a|<2-t\,\}.$$
      The **light-cone chart** $\mathscr{Y} = (u,v)$ has $u := t-a$ and $v := t+a$, constant along the light rays. What is $\mathscr{Y}(\mathcal{D})$?
    options:
      - text: 'The square $0<u<2$, $0<v<2$'
        correct: true
      - text: 'The square $-1<u<1$, $-1<v<1$'
        feedback: |
          That square is centred at $u = v = 0$, the event $O$ itself. But inside $\mathcal{D}$ we have $t>|a|$, so $u = t-a>0$ and $v = t+a>0$: the square starts at $O$, it does not surround it.
      - text: 'The rectangle $0<u<2$, $0<v<1$'
        feedback: |
          The diamond is symmetric under $a\mapsto-a$, which swaps $u$ and $v$, so the two sides must be equal. From $|a|<2-t$: $v = t+a<2$ and $u = t-a<2$.
      - text: 'A diamond again, since a linear change of chart keeps the shape'
        feedback: |
          A linear chart change keeps straight lines straight but changes angles. The four edges of $\mathcal{D}$ are light rays, $u = 0$, $v = 0$, $u = 2$, $v = 2$: in $(u,v)$ they are coordinate lines, so the region is a square aligned with the axes.
    explanation: |
      The four conditions are
      $$\begin{gathered}t-a>0,\quad t+a>0,\\ 2-t-a>0,\quad 2-t+a>0,\end{gathered}$$
      that is $u>0$, $v>0$, $v<2$, $u<2$. Light-cone coordinates turn the causal diamond into a coordinate square.

  - type: numeric
    id: p4-jacobian
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: Same orientation?
    prompt: |
      On 1+1 Minkowski spacetime, the inertial chart is $\mathscr{X} = (t,a)$ and the light-cone chart is $\mathscr{Y} = (u,v)$ with $u = t-a$, $v = t+a$ (in this order). Compute the Jacobian determinant
      $$\det\Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big),$$
      row $i$ from $(u,v)$, column $j$ from $(t,a)$.
    answer: 2
    wrong:
      - { value: -2, feedback: 'The matrix has rows $(\partial u/\partial t,\ \partial u/\partial a) = (1,-1)$ and $(\partial v/\partial t,\ \partial v/\partial a) = (1,1)$, determinant $1\cdot1-(-1)\cdot1 = 2$. A $-2$ comes from listing the rows as $(v,u)$.' }
      - { value: 0.5, feedback: '$\tfrac12$ is the determinant of the inverse direction, $\partial(t,a)/\partial(u,v)$. Here the rows are $u,v$ and the columns $t,a$.' }
    hint: 'Row 1 is $(\partial u/\partial t,\ \partial u/\partial a) = (1,-1)$.'
    explanation: |
      $$\det\begin{pmatrix}1&-1\\1&1\end{pmatrix} = 2>0.$$
      So $\{\mathscr{X},\mathscr{Y}\}$ is an oriented atlas: $\mathscr{Y}$ belongs to the same $\mathcal{A}^\uparrow$ as $\mathscr{X}$. The inverse is $t = \tfrac12(u+v)$, $a = \tfrac12(v-u)$, with determinant $\tfrac12$.

  - type: mcq
    id: p4-order
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: Which order is oriented?
    prompt: |
      On 1+1 Minkowski spacetime, orient by the inertial chart $\mathscr{X} = (t,a)$. With $u = t-a$ and $v = t+a$, which of the charts $(u,v)$ and $(v,u)$ (same functions, listed in a different order) belong to the oriented atlas $\mathcal{A}^\uparrow$ of $\mathscr{X}$?
    options:
      - text: 'Only $(u,v)$'
        correct: true
      - text: 'Only $(v,u)$'
        feedback: |
          $(v,u)$ has Jacobian rows $(1,1)$ and $(1,-1)$, determinant $-1-1 = -2<0$: it reverses the orientation. $(u,v)$ has rows $(1,-1)$, $(1,1)$, determinant $+2$.
      - text: 'Both, since they are the same two functions'
        feedback: |
          A chart is an ordered list of coordinates. Swapping two coordinates swaps two rows of the Jacobian and flips the sign of its determinant, so exactly one of the two orders agrees with $\mathscr{X}$.
      - text: 'Neither, since a light-cone chart mixes time and space'
        feedback: |
          Orientation only asks for the sign of a Jacobian determinant; it does not care which coordinate is "time". $(u,v)$ has determinant $+2$ with respect to $(t,a)$.
    explanation: |
      $$\begin{aligned}\det\frac{\partial(u,v)}{\partial(t,a)} &= +2,\\ \det\frac{\partial(v,u)}{\partial(t,a)} &= -2.\end{aligned}$$
      The formula $\omega^g = \sqrt{|\det g|}$ may only be used in $(u,v)$; in $(v,u)$ the density of $\Omega^g$ is $-\sqrt{|\det g|}$.

  - type: mcq
    id: p4-metric
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: The metric in the light-cone chart
    prompt: |
      On 1+1 Minkowski spacetime, $\eta_\mathscr{X} = \mathrm{diag}(-1,1)$ in the inertial chart $\mathscr{X} = (t,a)$. The light-cone chart $\mathscr{Y} = (u,v)$ has inverse $t = \tfrac12(u+v)$, $a = \tfrac12(v-u)$. Recall the congruence law
      $$\mathbf{G}_\mathscr{Y} = \mathbf{A}^{\mathsf{T}}\mathbf{G}_\mathscr{X}\mathbf{A},$$
      with $\mathbf{A}^i_j = \partial\mathscr{X}^i/\partial\mathscr{Y}^j$. What is $\mathbf{G}_\mathscr{Y}$?
    options:
      - text: '$\begin{pmatrix}0&-\tfrac12\\-\tfrac12&0\end{pmatrix}$'
        correct: true
      - text: '$\begin{pmatrix}0&2\\2&0\end{pmatrix}$'
        feedback: |
          This uses the Jacobian in the wrong direction, $\partial\mathscr{Y}/\partial\mathscr{X}$, with rows $(1,-1)$ and $(1,1)$. Metric components transform with
          $$\mathbf{A} = \frac{\partial\mathscr{X}}{\partial\mathscr{Y}} = \begin{pmatrix}\frac12&\frac12\\-\frac12&\frac12\end{pmatrix}.$$
      - text: '$\begin{pmatrix}-1&0\\0&1\end{pmatrix}$'
        feedback: |
          The metric is a tensor field, but its **components** change with the chart. Only special charts (boosts of the inertial one) keep $\mathrm{diag}(-1,1)$.
      - text: '$\begin{pmatrix}0&\tfrac12\\\tfrac12&0\end{pmatrix}$'
        feedback: |
          Check the sign with a vector: $\partial/\partial u+\partial/\partial v$ has $(t,a)$-components $(1,0)$, a time direction, so its squared length must be negative. With off-diagonal $+\tfrac12$ it would be $0+\tfrac12+\tfrac12+0 = +1$.
    explanation: |
      Directly:
      $$\begin{aligned}-dt^2+da^2 &= -\tfrac14(du+dv)^2\\ &\quad+\tfrac14(dv-du)^2\\ &= -du\,dv,\end{aligned}$$
      shared equally by the two off-diagonal entries: $g_{uv} = g_{vu} = -\tfrac12$, $g_{uu} = g_{vv} = 0$ (both coordinate vectors are lightlike).

  - type: numeric
    id: p4-det
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: The determinant
    prompt: |
      On 1+1 Minkowski spacetime, in the light-cone chart $\mathscr{Y} = (u,v)$, $u = t-a$, $v = t+a$, the metric components are
      $$\mathbf{G}_\mathscr{Y} = \begin{pmatrix}0&-\tfrac12\\-\tfrac12&0\end{pmatrix}.$$
      Compute $\det g_\mathscr{Y}$.
    answer: -0.25
    answerText: '-\tfrac14'
    wrong:
      - { value: 0.25, feedback: 'The determinant is $0\cdot0-(-\tfrac12)(-\tfrac12) = -\tfrac14$: the product of the off-diagonal entries is subtracted.' }
      - { value: -0.5, feedback: 'Multiply the off-diagonal entries, $(-\tfrac12)\cdot(-\tfrac12) = \tfrac14$, then subtract that from the diagonal product $0$.' }
    hint: 'For a $2\times2$ matrix with rows $(p,q)$ and $(r,s)$, the determinant is $ps-qr$.'
    explanation: |
      $\det g_\mathscr{Y} = -\tfrac14$. Check with the law $\det g_\mathscr{Y} = (\det\mathbf{A})^2\det g_\mathscr{X}$: $(\tfrac12)^2\cdot(-1) = -\tfrac14$. A Lorentzian metric in two dimensions has negative determinant in every chart.

  - type: mcq
    id: p4-abs
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: Why the absolute value
    prompt: |
      The metric volume form has density $\omega^g_\mathscr{Y} = \sqrt{|\det g_\mathscr{Y}|}$ in every chart of the oriented atlas. On 1+1 Minkowski spacetime in the light-cone chart, $\det g_\mathscr{Y} = -\tfrac14$. Why does the definition use $|\det g|$ rather than $\det g$?
    options:
      - text: 'A Lorentzian metric has $\det g<0$ in every chart, and the square root of a negative number is not a real density'
        correct: true
      - text: 'To make the density independent of the chart'
        feedback: |
          The density still depends on the chart: $1$ in $(t,a)$, $\tfrac12$ in $(u,v)$. The absolute value only fixes the sign of the number under the root; chart independence of the integral comes from the density law.
      - text: 'To make the volume form independent of the orientation'
        feedback: |
          $\Omega^g$ still depends on the orientation: the formula holds only in charts of $\mathcal{A}^\uparrow$, and the opposite orientation gives $-\Omega^g$. The absolute value concerns $\det g$, not the determinant of a Jacobian.
      - text: 'Because $\det g$ can vanish at some points'
        feedback: |
          A metric is non-degenerate, so $\det g_\mathscr{X}\neq0$ everywhere; the absolute value does nothing about zeros. It handles the **sign**, which is negative for a Lorentzian metric.
    explanation: |
      $\det g$ picks up $(\det\mathbf{A})^2>0$ under a chart change, so its sign never changes: positive for Riemannian metrics, negative for Lorentzian ones (one minus sign). $\sqrt{|{-\tfrac14}|} = \tfrac12$. In general relativity one often writes $\sqrt{-\det g}$, the same thing.

  - type: numeric
    id: p4-volume-uv
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: The volume in the light-cone chart
    prompt: |
      On 1+1 Minkowski spacetime, the causal diamond between $(t,a) = (0,0)$ and $(2,0)$ is, in the light-cone chart $\mathscr{Y} = (u,v)$ ($u = t-a$, $v = t+a$, in the oriented atlas), the square $0<u<2$, $0<v<2$. The metric there has $\det g_\mathscr{Y} = -\tfrac14$. Compute the spacetime volume
      $$\int_\mathcal{D}\Omega^g\cdot1.$$
    answer: 2
    wrong:
      - { value: 4, feedback: '$4$ is the coordinate area of the square, $2\cdot2$. Each unit square in $(u,v)$ carries spacetime volume $\omega^g_\mathscr{Y} = \sqrt{|{-\tfrac14}|} = \tfrac12$.' }
      - { value: 1, feedback: 'That uses $\tfrac14$, the determinant without the square root. The density is $\sqrt{|\det g|} = \tfrac12$.' }
      - { value: 8, feedback: 'That multiplies by $2$, the Jacobian determinant $\partial(u,v)/\partial(t,a)$. The density law uses the opposite direction, $\det(\partial\mathscr{X}/\partial\mathscr{Y}) = \tfrac12$: the light-cone coordinates are stretched, so each coordinate square holds less volume.' }
    hint: 'The density is $\omega^g_\mathscr{Y} = \sqrt{|\det g_\mathscr{Y}|}$, a constant here.'
    explanation: |
      $$\int_0^2\!\!\int_0^2\tfrac12\,du\,dv = \tfrac12\cdot4 = 2.$$
      The density law agrees: $\omega_\mathscr{Y} = \det(\partial\mathscr{X}^i/\partial\mathscr{Y}^j)\,\omega_\mathscr{X} = \tfrac12\cdot1$.

  - type: numeric
    id: p4-volume-ta
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: Check in the inertial chart
    prompt: |
      On 1+1 Minkowski spacetime, the inertial chart $\mathscr{X} = (t,a)$ has $\omega^g_\mathscr{X} = 1$. The causal diamond between $(0,0)$ and $(2,0)$ is the coordinate diamond with vertices $(0,0)$, $(1,1)$, $(2,0)$, $(1,-1)$. Compute its spacetime volume in this chart.
    answer: 2
    wrong:
      - { value: 4, feedback: '$4$ is the area of the bounding box $0<t<2$, $-1<a<1$. The diamond is half of it: at time $t$ its width is $2\min(t,2-t)$.' }
      - { value: 1, feedback: 'The diamond has two diagonals of length $2$, and its area is $\tfrac12\cdot2\cdot2 = 2$; $1$ is only one of its two triangles.' }
    hint: 'At time $t$ the diamond contains the positions $|a|<\min(t,2-t)$. Or use the rhombus area: half the product of the diagonals.'
    explanation: |
      $$\int_0^2 2\min(t,2-t)\,dt = 2,$$
      matching the light-cone value $2$. Two charts of $\mathcal{A}^\uparrow$, two different integrands, one volume.

  - type: mcq
    id: p4-closure
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: Is the one-chart integral allowed?
    prompt: |
      The one-chart integral $\int_\mathcal{D}\Omega f$ requires an open region $\mathcal{D}$ in a chart domain $\mathcal{U}$ with closure $\overline{\mathcal{D}}$ compact and contained in $\mathcal{U}$. On 1+1 Minkowski spacetime, is it allowed for the causal diamond between $(0,0)$ and $(2,0)$, in the inertial chart $(t,a)$ or the light-cone chart $(u,v) = (t-a,t+a)$?
    options:
      - text: 'Yes: the closure is the closed diamond, closed and bounded, and both charts have domain all of $\mathbb{R}^2$'
        correct: true
      - text: 'No: the boundary is made of light rays, of zero length, so the region is degenerate'
        feedback: |
          The hypothesis is topological: compact closure inside the chart domain. The metric plays no role in it. That the edges have zero proper length does not affect the volume, which is $2$.
      - text: 'Only in the light-cone chart, where the region is a coordinate square'
        feedback: |
          The definition allows any open region with compact closure in the chart domain, not only coordinate rectangles. In $(t,a)$ the diamond is a rhombus, and its integral is $2$ as well.
      - text: 'No: the closure contains the events $(0,0)$ and $(2,0)$, which are not in the region'
        feedback: |
          The closure always contains boundary points that the open region lacks; the demand is only that those points lie in the chart domain. Here the domain is all of $\mathbb{R}^2$, so they do.
    explanation: |
      $\overline{\mathcal{D}} = \{|a|\le t,\ |a|\le2-t\}$ is closed and bounded in $\mathbb{R}^2$, hence compact, and both charts are defined on all of $\mathbb{R}^2$. For a chart with a smaller domain, for example one that missed the event $P$, the condition would fail and a partition of unity would be needed.

  - type: numeric
    id: p4-boost
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: A moving observer
    prompt: |
      On 1+1 Minkowski spacetime, an observer moving at speed $\tfrac35$ uses the boosted chart
      $$\begin{aligned}t' &= \tfrac14(5t-3a),\\ a' &= \tfrac14(5a-3t).\end{aligned}$$
      Their light-cone coordinates are $u' = t'-a' = 2u$ and $v' = t'+a' = \tfrac12v$, where $u = t-a$, $v = t+a$. Since $u'v' = uv$, the metric in $(u',v')$ is again $-du'\,dv'$, with $\det g = -\tfrac14$. The causal diamond $0<u<2$, $0<v<2$ becomes $0<u'<4$, $0<v'<1$. Compute its spacetime volume in the chart $(u',v')$, which is in the oriented atlas.
    answer: 2
    wrong:
      - { value: 4, feedback: '$4$ is the coordinate area $4\cdot1$. The density in $(u'',v'')$ is still $\sqrt{|{-\tfrac14}|} = \tfrac12$.' }
      - { value: 2.5, feedback: '$\tfrac52$ is the time between the tips for this observer. The volume is $\tfrac12\cdot4\cdot1$.' }
    hint: 'Same density as in the unprimed light-cone chart, a different coordinate rectangle.'
    explanation: |
      $$\tfrac12\cdot(4\cdot1) = 2.$$
      The diamond is stretched along one light ray and squeezed along the other by the same factor $2$. The moving observer sees the tips at $(t',a') = (0,0)$ and $(\tfrac52,-\tfrac32)$, more time apart, yet the volume is the same.

  - type: mcq
    id: p4-why-same
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: Why every observer agrees
    prompt: |
      On 1+1 Minkowski spacetime, the causal diamond between $(t,a) = (0,0)$ and $(2,0)$ has spacetime volume $2$, computed in the inertial chart, the light-cone chart and the light-cone chart of an observer moving at speed $\tfrac35$ (for whom the tips are $\tfrac52$ apart in time). Why must every inertial observer find $2$?
    options:
      - text: '$\int_\mathcal{D}\Omega^g$ depends only on $\mathcal{D}$, $g$ and the orientation; each chart of the oriented atlas just gives a different integrand for the same number'
        correct: true
      - text: 'Because the boost is a rotation of the $(t,a)$ plane, which preserves Euclidean areas'
        feedback: |
          A boost is not a Euclidean rotation: it moves $(2,0)$ to $(\tfrac52,-\tfrac32)$, farther from the origin in the Euclidean sense. Its Jacobian determinant is $\tfrac{25-9}{16} = 1$, which is why the coordinate areas agree here; the general reason is chart independence.
      - text: 'It is special to the speed $\tfrac35$, where the numbers happen to work out'
        feedback: |
          At speed $\beta$ the light-cone coordinates scale as $u' = ku$, $v' = v/k$ with $k = \sqrt{(1+\beta)/(1-\beta)}$; the rectangle $2k\times2/k$ always has area $4$. And chart independence covers every chart, not just boosts.
      - text: 'They do not all agree: volume is relative, like time intervals'
        feedback: |
          Time intervals depend on the observer because they are components in a chart. The volume is an integral of the tensor field $\Omega^g$ over a set of events, which no chart can change.
    explanation: |
      The integral is defined chart-independently: the density law makes the integrand change by exactly the Jacobian factor of the change of variables. The time between the tips is observer-dependent ($2$ or $\tfrac52$); the volume, like the proper time, is not.

  - type: numeric
    id: p4-tau
    tag: Problem 4 · Spacetime volume of a causal diamond
    title: Volume from proper time
    prompt: |
      On 1+1 Minkowski spacetime, let $O$ and $Q$ be two events with $Q$ in the causal future of $O$ and proper time $\tau$ between them. In the inertial chart of an observer who sees both at the same place, $O = (0,0)$ and $Q = (\tau,0)$, and the causal diamond is the square $0<u<\tau$, $0<v<\tau$ in that observer's light-cone chart, where $\omega^g = \tfrac12$. For $\tau = 3$, compute the spacetime volume of the diamond.
    answer: 4.5
    answerText: '\tfrac92'
    wrong:
      - { value: 9, feedback: '$9 = \tau^2$ is the coordinate area of the square. Multiply by the density $\tfrac12$.' }
      - { value: 3, feedback: 'The square has side $\tau$ in both directions, so the volume grows with the square of $\tau$: it is $\tfrac12\tau^2$.' }
    hint: 'Volume $= \tfrac12\cdot\tau\cdot\tau$.'
    explanation: |
      $$\mathrm{vol}(\mathcal{D}) = \tfrac12\tau^2 = \tfrac92.$$
      For the tips $(0,0)$ and $(2,0)$: $\tau = 2$, volume $2$. The volume depends only on the proper time, which every observer agrees on.

  # ---------------------------------------------------------------- Problem 5
  - type: text
    id: p5-setup
    tag: Problem 5 · Rescaling and orientability
    title: Stretch the ruler, change the volume
    body: |
      Let $(\mathcal{M},\mathcal{O},\mathcal{A}^\uparrow,g)$ be an oriented metric manifold of dimension $d$, and $\psi\in C^\infty(\mathcal{M})$ any smooth function. The **rescaled metric** (a conformal rescaling) is
      $$\tilde g := e^{2\psi}g.$$
      At each point it multiplies every squared length by $e^{2\psi}$, so lengths by $e^{\psi}$: a ruler whose unit changes from point to point.

      Before computing: if every length is multiplied by $3$, a $d$-dimensional volume should be multiplied by $3^d$. Does the metric volume form agree?

      Then two surfaces where volumes behave unexpectedly: the hyperbolic half-plane, where a region inside a bounded box has infinite area, and the Möbius strip, where no volume form exists at all.

  - type: build
    id: p5-det
    tag: Problem 5 · Rescaling and orientability
    title: The determinant after rescaling
    prompt: |
      On an oriented metric manifold of dimension $d$, take $\tilde g := e^{2\psi}g$ with $\psi$ a smooth function. In a chart $\mathscr{X}$, $(\tilde g_\mathscr{X})_{ij} = e^{2\psi}(g_\mathscr{X})_{ij}$. Build $\det\tilde g_\mathscr{X}$.
    prefix: '\det\tilde g_\mathscr{X} ='
    tiles: ['e^{2d\psi}', 'e^{2\psi}', 'e^{d\psi}', '\det g_\mathscr{X}', 'd']
    answers:
      - ['e^{2d\psi}', '\det g_\mathscr{X}']
      - ['\det g_\mathscr{X}', 'e^{2d\psi}']
    wrong:
      - { answer: ['e^{2\psi}', '\det g_\mathscr{X}'], feedback: 'The determinant is not linear: scaling a $d\times d$ matrix by $c$ multiplies each of its $d$ rows by $c$, so the determinant by $c^d$. With $c = e^{2\psi}$: $e^{2d\psi}$.' }
      - { answer: ['e^{d\psi}', '\det g_\mathscr{X}'], feedback: 'That is the factor for the square root, $\sqrt{|\det\tilde g|}$. The determinant itself gets $(e^{2\psi})^d = e^{2d\psi}$.' }
    hint: 'Each of the $d$ rows of the matrix carries a factor $e^{2\psi}$, and the determinant is linear in each row.'
    explanation: |
      $$\det\tilde g_\mathscr{X} = e^{2d\psi}\det g_\mathscr{X}.$$
      Taking $\sqrt{|\cdot|}$, with $e^{2d\psi}>0$:
      $$\tilde\omega_\mathscr{X} = e^{d\psi}\,\omega^g_\mathscr{X},$$
      so $\Omega^{\tilde g} = e^{d\psi}\,\Omega^g$, with the same orientation (the factor is positive).

  - type: numeric
    id: p5-ratio
    tag: Problem 5 · Rescaling and orientability
    title: Volumes in four dimensions
    prompt: |
      On a 4-dimensional oriented metric manifold, rescale $\tilde g := e^{2\psi}g$ with the constant $\psi = \ln2$, so every length doubles. By what factor is the metric volume density multiplied, $\tilde\omega_\mathscr{X}/\omega^g_\mathscr{X}$?
    answer: 16
    wrong:
      - { value: 4, feedback: '$4 = e^{2\psi}$ is the factor on the metric components, squared lengths. The density gets $\sqrt{e^{2d\psi}} = e^{d\psi}$ with $d = 4$.' }
      - { value: 256, feedback: '$256 = e^{2d\psi}$ is the factor on $\det g$. The density is its square root, $e^{d\psi} = 16$.' }
      - { value: 2, feedback: '$2 = e^{\psi}$ is the factor on lengths. A 4-dimensional volume has four length directions: $2^4$.' }
    hint: '$\tilde\omega = e^{d\psi}\omega^g$.'
    explanation: |
      $e^{4\ln2} = 2^4 = 16$: lengths double in four directions. The metric volume form confirms the guess $3^d$ (here $2^4$), and the formula $e^{d\psi}$ also holds when $\psi$ varies from point to point.

  - type: numeric
    id: p5-hyperbolic-density
    tag: Problem 5 · Rescaling and orientability
    title: The half-plane density
    prompt: |
      The upper half-plane $\mathbb{H} := \{(u,w)\mid w>0\}$ with the chart $\mathscr{X} = (u,w)$ (oriented by this chart) carries the hyperbolic metric $g_{ij} = \delta_{ij}/w^2$: a rescaling $e^{2\psi}\delta$ of the Euclidean metric with $\psi = -\ln w$. Compute the density $\omega^g_\mathscr{X}$ at a point with $w = \tfrac12$.
    answer: 4
    wrong:
      - { value: 2, feedback: '$2 = 1/w = e^{\psi}$ is the length factor. In two dimensions the density is $e^{2\psi} = 1/w^2$.' }
      - { value: 16, feedback: '$16 = 1/w^4$ is $\det g$. The density is its square root, $1/w^2$.' }
    hint: '$\det g = 1/w^4$; take the square root.'
    explanation: |
      $$\omega^g_\mathscr{X} = \sqrt{\tfrac1{w^4}} = \tfrac1{w^2},$$
      $4$ at $w = \tfrac12$. Near the edge $w = 0$ every coordinate square carries more and more area.

  - type: numeric
    id: p5-strip
    tag: Problem 5 · Rescaling and orientability
    title: A strip of the half-plane
    prompt: |
      On the upper half-plane $\{(u,w)\mid w>0\}$ with metric $g_{ij} = \delta_{ij}/w^2$ (density $1/w^2$ in the chart $(u,w)$), compute the area of the region $0<u<1$, $1<w<2$.
    answer: 0.5
    answerText: '\tfrac12'
    wrong:
      - { value: 1, feedback: '$1$ is the Euclidean area of the square. Here every point carries the density $1/w^2$, which is below $1$ for $w>1$.' }
      - { value: 0.6931, feedback: '$\ln2$ comes from the density $1/w$, the length factor. In two dimensions the area density is $1/w^2$.' }
      - { value: 0.2917, feedback: '$\tfrac7{24}$ comes from $1/w^4 = \det g$, without the square root.' }
    hint: '$\int_1^2 w^{-2}\,dw = \big[-\tfrac1w\big]_1^2$.'
    explanation: |
      $$\int_0^1\!\!\int_1^2\frac{dw\,du}{w^2} = 1-\tfrac12 = \tfrac12.$$
      The closure $[0,1]\times[1,2]$ is compact and lies inside $\mathbb{H}$, so the one-chart integral applies.

  - type: numeric
    id: p5-tower
    tag: Problem 5 · Rescaling and orientability
    title: Towards the edge
    prompt: |
      On the upper half-plane $\{(u,w)\mid w>0\}$ with metric $g_{ij} = \delta_{ij}/w^2$ (density $1/w^2$ in the chart $(u,w)$), compute the area of the region $0<u<1$, $\tfrac1{10}<w<1$.
    answer: 9
    wrong:
      - { value: 0.9, feedback: '$0.9$ is the Euclidean area. Near $w = 0.1$ the density is $100$.' }
      - { value: 2.3026, feedback: '$\ln10$ comes from the density $1/w$. The area density is $1/w^2$.' }
      - { value: 10, feedback: '$10$ is $1/w$ at the lower limit only. The antiderivative is $-\tfrac1w$, and the upper limit $w = 1$ contributes $-1$: $-1+10 = 9$.' }
    hint: '$\int_{1/n}^1 w^{-2}\,dw = n-1$.'
    explanation: |
      $$\int_0^1\!\!\int_{1/10}^1\frac{dw\,du}{w^2} = 10-1 = 9.$$
      With $\tfrac1n<w<1$ the area is $n-1$, which grows without bound.

  - type: mcq
    id: p5-unbounded
    tag: Problem 5 · Rescaling and orientability
    title: A bounded box, infinite area
    prompt: |
      On the upper half-plane $\mathbb{H} = \{(u,w)\mid w>0\}$ with metric $g_{ij} = \delta_{ij}/w^2$, the regions $0<u<1$, $\tfrac1n<w<1$ have area $n-1$. Consider $\mathcal{D} := \{0<u<1,\ 0<w<1\}$, which fits in a bounded box. What is true?
    options:
      - text: 'Its area is infinite, and the one-chart integral excludes it: its closure in $\mathbb{H}$, $[0,1]\times(0,1]$, is not compact'
        correct: true
      - text: 'Its area is $1$, since the box is bounded'
        feedback: |
          Bounded coordinates do not mean finite area: the density $1/w^2$ blows up at the edge $w = 0$, and the areas $n-1$ of the growing strips are unbounded.
      - text: 'Its closure is $[0,1]\times[0,1]$, which is compact, so the integral is allowed and finite'
        feedback: |
          The closure is taken in the manifold $\mathbb{H}$, which contains no point with $w = 0$. In $\mathbb{H}$ the closure is $[0,1]\times(0,1]$, not closed in $\mathbb{R}^2$, hence not compact.
      - text: 'Its area is infinite because the metric is not smooth at $w = 0$'
        feedback: |
          $w = 0$ is not part of $\mathbb{H}$, and on $\mathbb{H}$ the metric is smooth. The integral fails because $\mathcal{D}$ reaches the edge of the manifold, where the compactness hypothesis is broken.
    explanation: |
      This is the "why the closure must be compact" story again, now with a metric: the density is bounded on every compact set of $\mathbb{H}$, but $\mathcal{D}$ reaches the missing edge. The hyperbolic plane has infinite total area, though in coordinates it looks like an ordinary half-plane.

  - type: text
    id: p5-mobius
    tag: Problem 5 · Rescaling and orientability
    title: The Möbius strip
    body: |
      Build the **Möbius strip** $\mathcal{M}$ from the band $\mathbb{R}\times(-1,1)$ with points $(\theta,s)$, by declaring the point a full turn further, flipped, to be the same point:
      $$(\theta+2\pi,\,-s)\sim(\theta,s).$$
      Give it the flat metric $d\theta^2+ds^2$; the flip $s\mapsto-s$ keeps it, so it is well defined.

      Two charts cover it:
      - $\mathscr{X} = (\theta,s)$, choosing the representative with $\theta\in(0,2\pi)$;
      - $\mathscr{Y} = (\theta',s')$, choosing the representative with $\theta'\in(-\pi,\pi)$.

      Their overlap has two pieces. On $0<\theta<\pi$ both pick the same representative: $\theta' = \theta$, $s' = s$. On $\pi<\theta<2\pi$, the $\mathscr{Y}$ representative is a full turn back, flipped: $\theta' = \theta-2\pi$, $s' = -s$.

  - type: numeric
    id: p5-mobius-jac
    tag: Problem 5 · Rescaling and orientability
    title: The flipped piece
    prompt: |
      Möbius strip: the band $\mathbb{R}\times(-1,1)$ with $(\theta+2\pi,-s)$ glued to $(\theta,s)$. Chart $\mathscr{X} = (\theta,s)$ uses $\theta\in(0,2\pi)$, chart $\mathscr{Y} = (\theta',s')$ uses $\theta'\in(-\pi,\pi)$. On the overlap piece $\pi<\theta<2\pi$, $\theta' = \theta-2\pi$ and $s' = -s$. Compute $\det(\partial\mathscr{Y}^i/\partial\mathscr{X}^j)$ there.
    answer: -1
    wrong:
      - { value: 1, feedback: 'The shift $\theta-2\pi$ has derivative $1$, but $s'' = -s$ has derivative $-1$: the Jacobian is $\mathrm{diag}(1,-1)$.' }
    hint: 'The Jacobian is diagonal.'
    explanation: |
      $$\det\begin{pmatrix}1&0\\0&-1\end{pmatrix} = -1,$$
      while on the other piece $0<\theta<\pi$ the determinant is $+1$. One overlap, two signs: $\{\mathscr{X},\mathscr{Y}\}$ is not an oriented atlas.

  - type: mcq
    id: p5-mobius-flip
    tag: Problem 5 · Rescaling and orientability
    title: Flip a chart?
    prompt: |
      Möbius strip with charts $\mathscr{X} = (\theta,s)$, $\theta\in(0,2\pi)$, and $\mathscr{Y} = (\theta',s')$, $\theta'\in(-\pi,\pi)$. The Jacobian determinant $\det(\partial\mathscr{Y}^i/\partial\mathscr{X}^j)$ is $+1$ on the overlap piece $0<\theta<\pi$ and $-1$ on $\pi<\theta<2\pi$. Does replacing $\mathscr{Y}$ by its flipped version $(\theta',-s')$ give an oriented atlas?
    options:
      - text: 'No: the flip changes both signs, giving $-1$ on the first piece and $+1$ on the second'
        correct: true
      - text: 'Yes: the flip turns the $-1$ into $+1$'
        feedback: |
          Flipping a chart multiplies its Jacobian determinant by $-1$ on the **whole** overlap. The piece $0<\theta<\pi$ then gets $-1$. The trouble is the mixed signs, not one sign.
      - text: 'Yes, if $\mathscr{X}$ is flipped too'
        feedback: |
          Flipping both charts multiplies the determinant by $(-1)^2 = 1$: back to $+1$ and $-1$.
      - text: 'It does not matter: a determinant of $-1$ has absolute value $1$, which is all that integration needs'
        feedback: |
          Integrating a volume form uses the density law with the **signed** determinant, so the sign matters. Absolute values suffice only for a different kind of object, which measures unsigned area.
    explanation: |
      Flipping changes the sign everywhere on the overlap, so mixed signs stay mixed. This only shows that these two charts fail; that no choice at all works needs an argument that uses no charts.

  - type: mcq
    id: p5-no-form
    tag: Problem 5 · Rescaling and orientability
    title: No volume form on the strip
    prompt: |
      Möbius strip: the band $\mathbb{R}\times(-1,1)$ with points $(\theta,s)$ and $(\theta+2\pi,-s)$ glued. The gluing takes the band's vector $\partial/\partial s$ at $(\theta+2\pi,0)$ to $-\partial/\partial s$ at $(\theta,0)$. Suppose $\Omega$ were a volume form, and define for every $\theta\in\mathbb{R}$
      $$F(\theta) := \Omega\Big(\frac{\partial}{\partial\theta},\frac{\partial}{\partial s}\Big)\Big|_{(\theta,0)}.$$
      $F$ is continuous and $F(\theta+2\pi) = -F(\theta)$. Why is this a contradiction?
    options:
      - text: '$F(0)$ and $F(2\pi)$ have opposite signs, so the continuous $F$ vanishes in between; but $\Omega_p\neq0$ and the two vectors form a basis'
        correct: true
      - text: 'The flat metric forces $F$ to be constant, and a constant cannot change sign'
        feedback: |
          $\Omega$ is any volume form, not tied to the metric, so $F$ need not be constant. The argument uses only continuity: a continuous function that changes sign has a zero.
      - text: '$F$ could vanish identically; the contradiction is that the strip has a boundary'
        feedback: |
          $F\equiv0$ would mean $\Omega$ vanishes on a basis, so $\Omega_p = 0$, which a volume form forbids. And this open strip, $s\in(-1,1)$, contains no boundary points.
      - text: 'It only rules out $\Omega$ in the chart $\mathscr{X}$; another chart might allow it'
        feedback: |
          $F$ is defined from $\Omega$ and two vectors, with no chart: a volume form is a tensor field, and its values do not depend on charts.
    explanation: |
      By the intermediate value theorem, $F(\theta_0) = 0$ for some $\theta_0\in(0,2\pi)$, so $\Omega$ vanishes on a basis there: contradiction. The Möbius strip has **no volume form**. Since every oriented manifold has one (stated earlier without proof), it has no oriented atlas either: it is **not orientable**.

  - type: numeric
    id: p5-mobius-area
    tag: Problem 5 · Rescaling and orientability
    title: The area still exists
    prompt: |
      Möbius strip: the band $\mathbb{R}\times(-1,1)$ with $(\theta+2\pi,-s)$ glued to $(\theta,s)$, flat metric $d\theta^2+ds^2$. There is no volume form, but the chart values $\sqrt{|\det g_\mathscr{X}|}$ change between charts by the **absolute value** of the Jacobian determinant, and such an object can be integrated on any manifold, oriented or not (stated here without proof). In the chart $\mathscr{X} = (\theta,s)$, $\theta\in(0,2\pi)$, which misses only the line $\theta = 0$ (zero area), compute the area of the strip.
    answer: 12.5664
    tolerance: 0.01
    answerText: '4\pi\approx12.57'
    wrong:
      - { value: 0, feedback: 'Nothing cancels: with the absolute value every piece of the strip counts positively. Cancellation would come from a signed density, which is exactly what the Möbius strip cannot have.' }
      - { value: 6.2832, feedback: '$2\pi$ is the length of the core circle. The strip also has width $2$, from $s = -1$ to $s = 1$.' }
    hint: 'Density $1$ on $(0,2\pi)\times(-1,1)$.'
    explanation: |
      $$\int_0^{2\pi}\!\!\int_{-1}^1 1\,ds\,d\theta = 4\pi.$$
      A volume form gives **oriented** volumes and needs an orientation; the object built with $|\det|$ (also called a density, or the Riemannian measure) gives unsigned areas on any manifold. On an oriented manifold the two agree in the charts of $\mathcal{A}^\uparrow$.

  # ---------------------------------------------------------------- Wrap-up
  - type: text
    id: wrap-up
    title: What you now own
    body: |
      Five problems, one level. The formulas to keep. Throughout, $(\mathcal{M},\mathcal{O},\mathcal{A}^\uparrow)$ is an oriented manifold of dimension $d$, $(\mathcal{U},\mathscr{X})\in\mathcal{A}^\uparrow$ a chart with coordinates $\alpha$ and scalar density $\omega_\mathscr{X}$, $\mathcal{D}\subseteq\mathcal{U}$ an open region and $f$ a smooth function.

      **1. Compact closure**: if $\overline{\mathcal{D}}$ is compact and inside $\mathcal{U}$, then $\mathscr{X}(\overline{\mathcal{D}})\subseteq[-L,L]^d$ for some $L>0$, the integrand $(\omega_\mathscr{X}\circ\mathscr{X}^{-1})(f\circ\mathscr{X}^{-1})$ is bounded by some $C$ there, and
      $$\Big|\int_\mathcal{D}\Omega f\Big|\le C\,(2L)^d<\infty;$$
      without it, $\int_0^1dp/p$ (the density $1/p$ blowing up at the edge $p=0$ of the chart) and the strip $0<w<1$ (with $0<u<1$) of the hyperbolic half-plane $\{(u,w)\mid w>0\}$, metric $(du^2+dw^2)/w^2$, density $1/w^2$, diverge.

      **2. Partition of unity** $\{\text{ᚹ}_n\}$ on $\mathbb{R}$ subordinate to $\mathcal{U}_n := (n-1,n+1)$, $n\in\mathbb{Z}$: from $g(t) := e^{-1/t}$ for $t>0$ and $g(t):=0$ for $t\le0$, the smooth step
      $$h(s) := \frac{g(\tfrac12+s)}{g(\tfrac12+s)+g(\tfrac12-s)},$$
      (equal to $0$ for $s\le-\tfrac12$ and to $1$ for $s\ge\tfrac12$), the shifted steps $H_n(p) := h(2p-2n+1)$ and the staircase
      $$\text{ᚹ}_n = H_n-H_{n+1};$$
      Hausdorff and second countability make one exist on every manifold.

      **3. A torus** of radii $R>\rho>0$, chart $(\vartheta,\varphi)\in(0,2\pi)^2$ with $a = (R+\rho\cos\vartheta)\cos\varphi$, $b = (R+\rho\cos\vartheta)\sin\varphi$, $c = \rho\sin\vartheta$ and the metric induced from $\mathbb{R}^3$: $\omega^g = \rho(R+\rho\cos\vartheta)$, area
      $$4\pi^2R\rho.$$
      **4. A causal diamond** between events $O=(0,0)$ and $Q=(\tau,0)$ of 1+1 Minkowski spacetime (metric $\eta=\mathrm{diag}(-1,1)$ in the coordinates $(t,a)$, $c=1$): in the light-cone chart $u := t-a$, $v := t+a$ one finds $\det g = -\tfrac14$, $\omega^g = \tfrac12$, and the volume is
      $$\tfrac12\tau^2,$$
      the same for every observer.

      **5. Rescaling**: for a smooth function $\psi$, the metric $\tilde g := e^{2\psi}g$ gives
      $$\Omega^{\tilde g} = e^{d\psi}\,\Omega^g;$$
      the Möbius strip (the band $\mathbb{R}\times(-1,1)$ of points $(\theta,s)$ with $(\theta+2\pi,-s)\sim(\theta,s)$, metric $d\theta^2+ds^2$) has no volume form, yet $\sqrt{|\det g|}$ with $|\det|$ still measures its area, $4\pi$.

      And the level in one formula, for a function $f$ of compact support, a partition of unity $\{\text{ᚹ}_n\}$ with $\mathrm{supp}\,\text{ᚹ}_n\subseteq\mathcal{U}_n$, charts $\mathscr{X}_n$ of $\mathcal{A}^\uparrow$ on $\mathcal{U}_n$ and a metric $g$ with components $g_{\mathscr{X}_n}$:
      $$\begin{aligned}\int_\mathcal{M}f = \sum_n&\int d^d\alpha\,\sqrt{|\det g_{\mathscr{X}_n}|}\\ &\cdot\big((\text{ᚹ}_nf)\circ\mathscr{X}_n^{-1}\big).\end{aligned}$$
      **Next, Level 9: Newton–Cartan theory.** A falling apple and a falling feather (in vacuum) follow the same path, whatever their masses. No other force does that, except the pseudo-forces of accelerated frames, which come from the chart. What if gravity is one of them, written into the connection of a 4-dimensional spacetime with an **absolute time**? The first lesson builds that spacetime.
