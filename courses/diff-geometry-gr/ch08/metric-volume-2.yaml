id: ch08-metric-volume-2
title: The Metric Volume Form · Part 2
kind: concept

own: |
  - **Setting**: an oriented metric manifold $(\mathcal{M},\mathcal{O},\mathcal{A}^\uparrow,g)$ of dimension $d$ (any signature), with chart-induced components $g_{ij}$ in a chart $\mathscr{X}\in\mathcal{A}^\uparrow$, and its metric volume form $\Omega^g$ with scalar density
  {{ $$\omega^g_\mathscr{X} = \sqrt{|\det g_\mathscr{X}|}$$ }}
  - **Unit volume**: if the chart-induced basis at $p$ is orthonormal ($g_{ij}(p) = 0$ for $i\neq j$, $g_{ii}(p) = \pm1$), then {{ $\omega^g_\mathscr{X}(p) = 1$ }}, in any signature (Minkowski metric $\eta=\mathrm{diag}(-1,1,\dots,1)$: $\sqrt{|\det\eta|} = 1$). Only $|\det g| = 1$ is needed, not orthonormality (the light-cone chart of 1+1 Minkowski has $g = \begin{pmatrix}0&1\\1&0\end{pmatrix}$ and $\omega^g = 1$).
  - **Unit sphere** $\{a^2+b^2+c^2=1\}\subset\mathbb{R}^3$, chart $(\vartheta,\varphi)$ with polar angle $\vartheta\in(0,\pi)$ and azimuth $\varphi\in(-\pi,\pi)$, metric $\mathrm{diag}(1,\sin^2\vartheta)$: $\omega^g = \sin\vartheta$, and the poles and the cut meridian (zero area) can be dropped, giving the area $\int_{-\pi}^{\pi}\!\int_0^\pi\sin\vartheta\,d\vartheta\,d\varphi = 4\pi$.
  - **Integral of a function** $f$ with compact support, $\int_\mathcal{M}f := \int_\mathcal{M}\Omega^gf$, valid for any signature, for a partition of unity $\{\text{ᚹ}_n\}$ (smooth, values in $[0,1]$, sum $1$) with $\mathrm{supp}\,\text{ᚹ}_n\subseteq\mathcal{U}_n$, $(\mathcal{U}_n,\mathscr{X}_n)\in\mathcal{A}^\uparrow$:
  {{ $$\begin{aligned}\int_\mathcal{M}f =&\sum_n\int_{\mathscr{X}_n(\mathcal{U}_n)}d^d\alpha\\ &\cdot\sqrt{|\det g_{\mathscr{X}_n}|}\circ\mathscr{X}_n^{-1}\\ &\cdot(\text{ᚹ}_nf)\circ\mathscr{X}_n^{-1}\end{aligned}$$ }}
  A spacetime volume is the same in every chart: on 1+1 Minkowski, the region $0<t<1$, $0<a<3$ has volume $3$ in the inertial chart and in the chart $(2t,2a)$ (density $\tfrac14$, region $2\times6$).

cards:
  - type: text
    id: recall-definition
    title: "Recall: the metric volume form"
    body: |
      On an **oriented metric manifold** $(\mathcal{M},\mathcal{O},\mathcal{A}^\uparrow,g)$ (topology $\mathcal{O}$, oriented atlas $\mathcal{A}^\uparrow$: every Jacobian between its charts has positive determinant; metric $g$ of any signature) write $\det g_\mathscr{X} := \det((g_\mathscr{X})_{ij})$ for the determinant of the metric components in a chart $\mathscr{X}\in\mathcal{A}^\uparrow$. It is never zero and obeys $\det g_\mathscr{Y} = (\det\text{ᛞ}_{\mathcal{U}\mathcal{V}})^2\det g_\mathscr{X}$. The **metric volume form** $\Omega^g$ has, in every such chart, the components
      $$(\Omega^g_\mathscr{X})_{i_1\dots i_d} := \sqrt{|\det g_\mathscr{X}|}\;\varepsilon_{i_1\dots i_d},$$
      so its scalar density is $\omega^g_\mathscr{X} = \sqrt{|\det g_\mathscr{X}|}$. It glues into one volume form exactly because the orientation makes $|\det\text{ᛞ}_{\mathcal{U}\mathcal{V}}| = \det\text{ᛞ}_{\mathcal{U}\mathcal{V}}$ on overlaps. Euclidean plane: $\omega^g = 1$ in cartesian and $r$ in polar coordinates; for a small coordinate square of side $\Delta$ at $p$ (Riemannian metric), the true area over $\Delta^2$ tends to $\sqrt{\det g(p)}$.

  - type: text
    id: orthonormal
    title: Unit volume for an orthonormal basis
    body: |
      Recall Sylvester's law of inertia: at each point some basis makes the metric diagonal with entries $\pm1$, an **orthonormal** basis. Suppose the chart-induced basis $(\partial/\partial\mathscr{X}^i)_p$ is orthonormal at $p$:
      $$g_{ij}(p) = 0\ (i\neq j),\quad g_{ii}(p) = \pm1.$$
      Then $\det g_\mathscr{X}(p)$ is a product of $\pm1$'s, so $|\det g_\mathscr{X}(p)| = 1$ and
      $$\omega^g_\mathscr{X}(p) = 1.$$
      Meaning: $\Omega^g_p$, fed the basis vectors, gives $(\Omega^g_\mathscr{X})_{1\dots d} = \omega^g_\mathscr{X}\varepsilon_{1\dots d} = 1$. **The parallelepiped spanned by an orthonormal basis has unit volume**, the metric version of "the unit square has area $1$".

      This holds in **any signature**. Minkowski spacetime in an inertial chart has $\eta = \mathrm{diag}(-1,1,1,1)$, $\det\eta = -1$, and $\sqrt{|\det\eta|} = 1$: this is why the absolute value is in the definition. In general relativity the volume element is written $\sqrt{-\det g}\,d^4\alpha$, which is the same thing since $\det g<0$ there.

  - type: numeric
    id: minkowski-scaled
    title: A rescaled clock and ruler
    prompt: |
      On 1+1 Minkowski spacetime (points $(t,a)$) the metric is $\eta = \mathrm{diag}(-1,1)$ in the inertial chart $\mathscr{X} = (t,a)$. In the chart $\mathscr{Y} = (2t,2a)$ its component matrix is $\mathrm{diag}(-\tfrac14,\tfrac14)$. What is the metric volume form's density $\omega^g_\mathscr{Y} = \sqrt{|\det g_\mathscr{Y}|}$?
    answer: 0.25
    answerText: '1/4'
    wrong:
      - value: -0.0625
        feedback: |
          $-\tfrac1{16}$ is $\det g_\mathscr{Y}$ itself. Take its absolute value and then the square root: $\sqrt{1/16} = \tfrac14$.
      - value: 1
        feedback: |
          $1$ is the density in the orthonormal chart $\mathscr{X}$. The basis of $\mathscr{Y}$ is not orthonormal: its vectors have $\eta(\partial y_i,\partial y_i) = \mp\tfrac14$.
      - value: 4
        feedback: |
          The density goes the other way: $\mathscr{X} = \mathscr{Y}/2$, so the Jacobian $\partial\mathscr{X}^i/\partial\mathscr{Y}^j = \mathrm{diag}(\tfrac12,\tfrac12)$ has determinant $\tfrac14$, and $\omega_\mathscr{Y} = \tfrac14\cdot1$.
    hint: |
      $\det\mathrm{diag}(-\tfrac14,\tfrac14) = -\tfrac1{16}$.
    explanation: |
      $\sqrt{|-\tfrac1{16}|} = \tfrac14$. Check with the density law: $\partial\mathscr{X}^i/\partial\mathscr{Y}^j = \mathrm{diag}(\tfrac12,\tfrac12)$, determinant $\tfrac14>0$ (same orientation), so $\omega_\mathscr{Y} = \tfrac14\,\omega_\mathscr{X} = \tfrac14$. A cell $\Delta\beta^1\times\Delta\beta^2$ of the new coordinates is a quarter of the size in proper time times proper length.

  - type: mcq
    id: unit-volume-converse
    title: Unit volume, not orthonormal
    prompt: |
      On 1+1 Minkowski spacetime the light-cone chart has metric components $\begin{pmatrix}0&1\\1&0\end{pmatrix}$: both basis vectors are lightlike (null). Which statement is true?
    options:
      - text: '$\omega^g = 1$ in this chart, although the basis is not orthonormal'
        correct: true
      - text: '$\omega^g = 0$, because the basis vectors are null'
        feedback: |
          Null vectors have zero "length", but the volume form measures the parallelepiped they span, which depends on $\det g = 0\cdot0-1\cdot1 = -1$. So $\omega^g = \sqrt{|-1|} = 1$; a volume form is never zero.
      - text: '$\omega^g$ is undefined, because $\det g<0$'
        feedback: |
          The definition uses $\sqrt{|\det g|}$, exactly so that negative determinants (any Lorentzian metric) are allowed: $\sqrt{|-1|} = 1$.
      - text: '$\omega^g = 1$ shows the basis is orthonormal'
        feedback: |
          Orthonormal implies $\omega^g = 1$, not conversely: here $g_{11} = g_{22} = 0$, not $\pm1$, yet $|\det g| = 1$.
    explanation: |
      $\det\begin{pmatrix}0&1\\1&0\end{pmatrix} = -1$, so $\omega^g = 1$. Unit volume needs only $|\det g| = 1$; orthonormality is one way to get it. (Check: one such chart is $((a+t)/\sqrt2,\,(a-t)/\sqrt2)$, whose Jacobian with respect to the inertial chart $(t,a)$ has determinant $+1$.)

  - type: text
    id: sphere
    title: The sphere
    body: |
      Back to the guess of Part 1. On the unit sphere $S^2$ with the chart $\mathscr{X} = (\vartheta,\varphi)$, $\vartheta\in(0,\pi)$, $\varphi\in(-\pi,\pi)$, the round metric (dot products of the chart's tangent vectors in $\mathbb{R}^3$) is
      $$\mathbf{G}_\mathscr{X} = \mathrm{diag}(1,\sin^2\vartheta).$$
      Orient $S^2$ so that $\mathscr{X}$ is a positive chart (the sphere is orientable; with this choice the chart's two basis vectors followed by the outward normal form a right-handed triple in $\mathbb{R}^3$). Then
      $$\omega^g_\mathscr{X} = \sqrt{\sin^2\vartheta} = |\sin\vartheta| = \sin\vartheta,$$
      the last step because $\sin\vartheta>0$ on $(0,\pi)$. The guess of Part 1 is the metric's own answer: $\sqrt{g_{\vartheta\vartheta}}\,d\vartheta$ and $\sqrt{g_{\varphi\varphi}}\,d\varphi = \sin\vartheta\,d\varphi$ are the side lengths of a small cell.

  - type: numeric
    id: sphere-ratio
    title: Predict the shrinking cell
    prompt: |
      On the unit sphere with chart $(\vartheta,\varphi)$ and round metric $\mathrm{diag}(1,\sin^2\vartheta)$, take the coordinate square of side $\Delta$ centred at $\vartheta = \pi/3$. As $\Delta\to0$, what does the ratio (true area of the cell)$/\Delta^2$ tend to? (Three decimals.)
    answer: 0.8660254
    tolerance: 0.002
    answerText: '\sin(\pi/3) = \sqrt3/2 \approx 0.866'
    wrong:
      - value: 0.75
        feedback: |
          $0.75 = \sin^2(\pi/3) = \det g$. The area of the cell is $\sqrt{\det g}\,\Delta^2$ to first order: take the square root.
      - value: 1
        feedback: |
          $1$ would mean the chart does not distort areas. Away from the equator the circles of latitude are shorter than the equator, so cells there are smaller than $\Delta^2$.
      - value: 0.5
        feedback: |
          $0.5 = \cos(\pi/3)$. The circle of latitude at $\vartheta$ has radius $\sin\vartheta$ (distance from the axis), not $\cos\vartheta$ (height above the equator plane).
    hint: |
      The cell's area is about $\sqrt{\det g(p)}\,\Delta^2$.
    explanation: |
      $\sqrt{\det g} = \sin(\pi/3) = \sqrt3/2\approx0.866$. For finite $\Delta$ the exact area (a band of the sphere between two circles of latitude, cut by two meridians) is $\Delta(\cos\vartheta_1 - \cos\vartheta_2) = 2\Delta\sin\vartheta\sin(\Delta/2)$, so the ratio is $\sin\vartheta\cdot\frac{\sin(\Delta/2)}{\Delta/2}$, slightly below $0.866$ and tending to it.

  - type: widget
    id: sphere-widget
    title: The ratio tends to the density
    widget: area-cell
    config:
      chart: sphere
      p: [1.0472, 0]
      d: 0.5
      presets:
        - { label: 'Equator', chart: sphere, p: [1.5708, 0], d: 0.5 }
        - { label: 'Near the pole', chart: sphere, p: [0.35, 0], d: 0.5 }
        - { label: 'Δ small', chart: sphere, p: [1.0472, 0], d: 0.05 }
    body: |
      Check your prediction. At $\vartheta = \pi/3$ with $\Delta = 0.5$ the true area (gold) and the purple parallelogram $\sqrt{\det g}\,\Delta^2$ differ by about $1\%$: the cell is curved, the parallelogram lies in the tangent plane at $p$. Shrink $\Delta$ (or press "Δ small"): the ratio true area$/\Delta^2$ tends to $\sin\vartheta = \sqrt{\det g}$ at $p$. Then compare the equator ($\sin\vartheta = 1$) with the pole.

  - type: numeric
    id: sphere-patch
    title: A patch of the sphere
    prompt: |
      On the unit sphere with chart $(\vartheta,\varphi)$ ($\vartheta$ polar angle, $\varphi$ longitude), the metric volume form has density $\omega^g = \sin\vartheta$. Find the area of the region $\tfrac\pi3<\vartheta<\tfrac{2\pi}3$, $0<\varphi<\tfrac\pi2$ (its closure lies inside the chart domain, so the one-chart integral applies).
    answer: 1.5707963
    tolerance: 0.001
    answerText: '\pi/2 \approx 1.571'
    wrong:
      - value: 1.6449341
        feedback: |
          That is $\tfrac\pi3\cdot\tfrac\pi2$, the area of the coordinate rectangle with $\omega = 1$. Include the density: $\int_{\pi/3}^{2\pi/3}\sin\vartheta\,d\vartheta = 1$.
      - value: 1
        feedback: |
          $1$ is the $\vartheta$-integral alone. Multiply by the length of the $\varphi$-interval, $\tfrac\pi2$.
    hint: |
      $\int\sin\vartheta\,d\vartheta = -\cos\vartheta$, and $\cos\tfrac\pi3 = \tfrac12$, $\cos\tfrac{2\pi}3 = -\tfrac12$.
    explanation: |
      $$\begin{aligned}\int_0^{\pi/2}\!\!\int_{\pi/3}^{2\pi/3}\sin\vartheta\,d\vartheta\,d\varphi &= 1\cdot\tfrac\pi2\\ &= \tfrac\pi2.\end{aligned}$$
      The band around the equator between latitudes $\pm30°$ has area $2\pi$, a quarter of it is $\tfrac\pi2$: cells near the equator count fully, cells near the poles count little.

  - type: text
    id: poles-and-cut
    title: What the chart misses
    body: |
      To get the whole sphere, be careful. The chart $(\vartheta,\varphi)$ misses the two poles and the cut meridian $\varphi = \pm\pi$ (a closed half circle from pole to pole). Recall the one-chart integral: a region may be integrated in a chart only if its closure is compact and contained in the chart domain. The whole chart domain fails this, since its closure is all of $S^2$.

      The honest route is the gluing recipe: add a second chart covering the missing half circle (for example, the same angles measured from a different axis), take a partition of unity $\{\text{ᚹ}_1,\text{ᚹ}_2\}$ subordinate to the two domains ($\text{ᚹ}$, "wynn": smooth functions in $[0,1]$ summing to $1$), and add the two one-chart integrals.

      To actually compute, we use a fact **stated here without proof**: a set of zero area, such as a curve or finitely many points, can be dropped without changing an integral. The glued total therefore equals the integral over the chart domain alone, computed as an ordinary (improper) integral over the open rectangle $(0,\pi)\times(-\pi,\pi)$. Plausibility check: the region $\epsilon<\vartheta<\pi-\epsilon$, $|\varphi|<\pi-\epsilon$ is allowed for every small $\epsilon>0$, and its area $2\cos\epsilon\,(2\pi-2\epsilon)$ tends to the full value as $\epsilon\to0$.

  - type: numeric
    id: sphere-total
    title: The area of the sphere
    prompt: |
      The unit sphere's area is the integral of the metric volume form, which in the chart $(\vartheta,\varphi)$ has density $\sin\vartheta$. Dropping the poles and the cut meridian (a set of zero area, which does not change the integral), compute $\int_{-\pi}^{\pi}\!\int_0^\pi\sin\vartheta\,d\vartheta\,d\varphi$.
    answer: 12.566371
    tolerance: 0.001
    answerText: '4\pi \approx 12.566'
    wrong:
      - value: 19.739209
        feedback: |
          That is $2\pi^2$, the integral of $1$ over the chart rectangle: the density $\sin\vartheta$ was left out.
      - value: 6.2831853
        feedback: |
          $2\pi$ is the $\varphi$-integral alone. The $\vartheta$-integral is $\int_0^\pi\sin\vartheta\,d\vartheta = 2$, so the total is $4\pi$.
      - value: 2
        feedback: |
          $2$ is the $\vartheta$-integral alone. Multiply by the $\varphi$-range $2\pi$.
    hint: |
      $\int_0^\pi\sin\vartheta\,d\vartheta = [-\cos\vartheta]_0^\pi$.
    explanation: |
      $2\cdot2\pi = 4\pi$, the area of the unit sphere, and nobody chose the density: the round metric did. In the $\epsilon$-regions of the previous reasoning, $2\cos\epsilon\,(2\pi-2\epsilon)\to4\pi$ as well.

  - type: text
    id: integral-formula
    title: Integrating with the metric
    body: |
      On an oriented metric manifold the metric volume form is the default, and one writes $\int_\mathcal{M}f := \int_\mathcal{M}\Omega^gf$ for a smooth $f$ with compact support. Inserting $\omega^g = \sqrt{|\det g|}$ into the gluing recipe, with a partition of unity $\{\text{ᚹ}_n\}$, $\mathrm{supp}\,\text{ᚹ}_n\subseteq\mathcal{U}_n$ for charts $(\mathcal{U}_n,\mathscr{X}_n)\in\mathcal{A}^\uparrow$ with coordinates $\alpha$:
      $$\begin{aligned}\int_\mathcal{M}f =&\sum_n\int_{\mathscr{X}_n(\mathcal{U}_n)}d^d\alpha\\ &\cdot\sqrt{|\det g_{\mathscr{X}_n}|}\circ\mathscr{X}_n^{-1}\\ &\cdot(\text{ᚹ}_nf)\circ\mathscr{X}_n^{-1}.\end{aligned}$$
      Every ingredient is computable: the metric components in each chart, a determinant, a root, and calculus integrals. It is **valid for any signature**: only $|\det g|$ enters. On spacetime this is the integral of general relativity: total charge, or the action $\int_\mathcal{M}\mathcal{L}$ whose extremum gives the field equations.

  - type: numeric
    id: spacetime-volume
    title: A spacetime volume
    prompt: |
      On 1+1 Minkowski spacetime, the region $0<t<1$, $0<a<3$ in the inertial chart $\mathscr{X} = (t,a)$ has spacetime volume $1\cdot3 = 3$ (density $1$). Recompute it in the chart $\mathscr{Y} = (2t,2a)$, where the metric volume form has density $\omega^g_\mathscr{Y} = \tfrac14$: integrate $\tfrac14$ over the image of the region in $\mathscr{Y}$-coordinates.
    answer: 3
    answerText: '3'
    wrong:
      - value: 0.75
        feedback: |
          That is $\tfrac14\cdot3$: the density was applied, but the region was not mapped. In $\mathscr{Y}$-coordinates it is $0<\beta^1<2$, $0<\beta^2<6$, area $12$.
      - value: 12
        feedback: |
          $12$ is the coordinate area of the image $(0,2)\times(0,6)$. Multiply by the density $\tfrac14$.
    hint: |
      The image is the rectangle $0<\beta^1<2$, $0<\beta^2<6$.
    explanation: |
      $\tfrac14\cdot2\cdot6 = 3$. The coordinate area grows by $\det(\partial\mathscr{Y}^i/\partial\mathscr{X}^j) = 4$ and the density shrinks by $\tfrac14$: the spacetime volume, built from $\sqrt{|\det g|}$, is the same in both charts, even though $\det g<0$.

  - type: text
    id: summary
    body: |
      **Next:** "Guided Problem: The Length of a Circle, Chart by Chart". Take a circle of radius $R$ with its metric, compute $\sqrt{|\det g|}$ in two different charts, check that they glue, and assemble the length $2\pi R$ from a partition of unity, piece by piece.
