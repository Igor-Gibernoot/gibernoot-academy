id: ch07-levi-civita-2
title: The Levi-Civita Connection · Part 2
kind: concept
own: |
  - **Setting**: $(\mathcal{M},g)$ a metric manifold with a chart, $g_{ij}$ the components of $g$, summation over repeated indices, $\gamma$ a curve with velocity $v_\gamma$ and components $\dot\gamma^i$, $\text{ᛇ}_\gamma := \mathrm{sgn}\,g(v_\gamma,v_\gamma)$, $s_\gamma := \sqrt{\text{ᛇ}_\gamma\,g(v_\gamma,v_\gamma)}$. The **Levi-Civita connection** $\nabla^{\mathrm{LC}}$ is {{ the only torsion-free, metric-compatible connection }}, with the Christoffel symbols of $g$ as coefficients, so its autoparallel equation is the geodesic equation.
  - **Transport keeps the metric**: for fields $\mathcal{X}_\gamma,\mathcal{Y}_\gamma$ along $\gamma$,
  {{ $$\begin{aligned}&\tfrac{d}{d\lambda}g(\mathcal{X}_\gamma,\mathcal{Y}_\gamma)\\ &= g(\nabla_{v_\gamma}\mathcal{X}_\gamma,\mathcal{Y}_\gamma) + g(\mathcal{X}_\gamma,\nabla_{v_\gamma}\mathcal{Y}_\gamma)\end{aligned}$$ }}
  so parallel transport keeps lengths and angles, and along an autoparallelly transported curve $g(v_\gamma,v_\gamma)$, $\text{ᛇ}_\gamma$ and $s_\gamma$ are constant: these curves are the constant-speed geodesics, plus the **null geodesics** ($\text{ᛇ}_\gamma = 0$).
  - **Not the same**: autoparallels depend on $\nabla$, geodesics only on $g$. On the Euclidean plane with polar chart $(r,\theta)$, $\nabla^{\mathrm{W}}$ (the unit radial and unit angular fields declared parallel) is compatible but has torsion, and $\nabla^{\mathrm{P}}$ (polar components constant, all $\Gamma^k_{ij} = 0$) is torsion free but not compatible; an {{ antisymmetric addition to the coefficients keeps every autoparallel and adds torsion }}, so exactly one connection with these autoparallels is torsion free.

cards:
  - type: text
    id: recall-lc
    title: "Recall: the Levi-Civita connection"
    body: |
      On a manifold with metric $g$ and a chart, with summation over repeated indices, the **Christoffel symbols** are
      $$\begin{aligned}\Gamma^k_{ij} := \tfrac12(g^{-1})^{km}\big(&\partial_i g_{mj} + \partial_j g_{mi}\\ &- \partial_m g_{ij}\big),\end{aligned}$$
      where $(g^{-1})^{km}$ is the inverse matrix of $g_{ij}$ and $\partial_i$ the derivative along the $i$-th coordinate. They are symmetric in $i,j$, and the connection with these coefficients in every chart is the **Levi-Civita connection** $\nabla^{\mathrm{LC}}$ (the lesson The Levi-Civita Connection · Part 1 built it). It is **torsion free**, $\Gamma^k_{ij} = \Gamma^k_{ji}$, and **metric compatible**, $\nabla_\mathcal{X}g = 0$, meaning in a chart
      $$\partial_k g_{ij} - \Gamma^m_{ik}\,g_{mj} - \Gamma^m_{jk}\,g_{im} = 0,$$
      and it is the only connection with both properties. Its autoparallel equation $\ddot\gamma^k + \Gamma^k_{ij}\dot\gamma^i\dot\gamma^j = 0$ is the geodesic equation for a constant-speed curve $\gamma$ ($\dot\gamma^i$ its velocity components, dot $= d/d\lambda$).

  - type: text
    id: recall-plane
    title: "Recall: three connections on the plane"
    body: |
      The Euclidean plane has metric $g = dx^1\otimes dx^1 + dx^2\otimes dx^2$, and in the polar chart $\mathscr{Y} = (r,\theta)$, $\theta\in(-\pi,\pi)$, $g = \mathrm{diag}(1,r^2)$. Three connections have these **polar** coefficients $\Gamma^k_{ji}$ (those not listed vanish):
      - $\nabla^{\mathrm{E}}$ (cartesian components constant): $\Gamma^1_{22} = -r$, $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$, the Christoffel symbols of $g$, so $\nabla^{\mathrm{E}} = \nabla^{\mathrm{LC}}$;
      - $\nabla^{\mathrm{P}}$ (polar components constant): all $\Gamma^k_{ji} = 0$;
      - $\nabla^{\mathrm{W}}$ (the unit radial and angular fields declared parallel): only $\Gamma^2_{21} = \tfrac1r$.

  - type: numeric
    id: trap-w-compatible
    tag: Trap
    title: Score the frame connection
    prompt: |
      Euclidean plane, polar chart: $g_{11} = 1$, $g_{22} = r^2$, $g_{12} = 0$. The connection $\nabla^{\mathrm{W}}$ (unit radial and angular fields parallel) has a single nonzero polar coefficient, $\Gamma^2_{21} = \tfrac1r$ (so $\nabla_{\partial y_1}\partial y_2 = \tfrac1r\partial y_2$), while $\Gamma^2_{12} = 0$. Compute at $r = 5$
      $$\begin{aligned}&(\nabla^{\mathrm{W}}_{\partial y_1}g)_{22}\\ &= \partial_1 g_{22} - \Gamma^m_{21}\,g_{m2} - \Gamma^m_{21}\,g_{2m}.\end{aligned}$$
    answer: 0
    answerText: '0'
    wrong:
      - { value: 10, feedback: 'That uses $\Gamma^2_{12} = 0$ in place of $\Gamma^2_{21}$. The direction is $\partial y_1$, so it sits in the **last** lower index: the coefficients needed are $\Gamma^m_{21}$, and $\Gamma^2_{21} = \tfrac15$.' }
      - { value: 5, feedback: 'Two $\Gamma$ terms, one for each lower index of $g$: $10 - 5 - 5$.' }
    hint: Only $m = 2$ contributes; $\partial_1 g_{22} = 2r$ and $\Gamma^2_{21}g_{22} = r$.
    explanation: |
      $10 - 5 - 5 = 0$. The other components vanish too (every remaining $\Gamma$ is $0$ and $g_{12} = 0$), so $\nabla^{\mathrm{W}}$ **is** metric compatible. No surprise: its parallel frame $e_1, e_2$ is orthonormal, so transported vectors keep their lengths, as the widget showed on the vertical line.

  - type: mcq
    id: trap-w-lc
    tag: Trap
    title: Compatible, so Levi-Civita?
    prompt: |
      On the Euclidean plane minus the origin, $\nabla^{\mathrm{W}}$ declares the unit radial and angular fields $e_1, e_2$ parallel. It is metric compatible for the Euclidean metric $g$. Its polar coefficients are $\Gamma^2_{21} = \tfrac1r$, $\Gamma^2_{12} = 0$, all others $0$. Is $\nabla^{\mathrm{W}}$ the Levi-Civita connection of $g$?
    options:
      - text: 'No: its torsion $\mathtt{T}^2_{12} = \Gamma^2_{21} - \Gamma^2_{12} = \tfrac1r$ is nonzero'
        correct: true
      - text: 'Yes: metric compatibility is what defines the Levi-Civita connection'
        feedback: |
          Compatibility is half the characterization. Many connections are compatible (any one whose parallel frames are orthonormal); the theorem needs torsion free **as well**, and $\nabla^{\mathrm{W}}$ fails it: $\Gamma^2_{21}\neq\Gamma^2_{12}$.
      - text: 'Yes: it has the same autoparallels as the Euclidean connection'
        feedback: |
          It does not: its straightest curves are rays, circles about the origin and logarithmic spirals, not straight lines. And even equal autoparallels would not make it Levi-Civita, as the next card shows.
      - text: 'No: it is not metric compatible after all'
        feedback: |
          It is: $(\nabla^{\mathrm{W}}_{\partial y_1}g)_{22} = 2r - r - r = 0$ and the other components vanish. A vector transported by $\nabla^{\mathrm{W}}$ turns but keeps its length. The failure is elsewhere.
    explanation: |
      $\nabla^{\mathrm{W}}$ and $\nabla^{\mathrm{E}}$ are both compatible; only $\nabla^{\mathrm{E}}$ is torsion free, and indeed the Christoffel symbols are $\nabla^{\mathrm{E}}$'s. The score: $\nabla^{\mathrm{P}}$ fails compatibility, $\nabla^{\mathrm{W}}$ fails torsion freeness, $\nabla^{\mathrm{E}} = \nabla^{\mathrm{LC}}$ passes both.

  - type: mcq
    id: trap-antisym
    tag: Trap
    title: Same straightest curves, same connection?
    prompt: |
      On the plane, a connection $\nabla$ has cartesian coefficients $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$, all others $0$. In its autoparallel equation
      $$\ddot\gamma^k + \Gamma^k_{ji}\,\dot\gamma^i\dot\gamma^j = 0$$
      the two terms cancel, $(\Gamma^1_{12} + \Gamma^1_{21})\dot\gamma^1\dot\gamma^2 = 0$, so its autoparallelly transported curves are exactly the straight lines at constant speed, the geodesics of the Euclidean metric. Is $\nabla$ the Levi-Civita connection of the Euclidean metric?
    options:
      - text: 'No: it has torsion $\mathtt{T}^1_{12} = -2$, and only the torsion-free part is fixed by the curves'
        correct: true
      - text: 'Yes: its autoparallels are the geodesics, and that is what the Levi-Civita connection was built for'
        feedback: |
          The autoparallel equation contains $\Gamma^k_{ji}\dot\gamma^i\dot\gamma^j$, symmetric in $i, j$, so it sees only the symmetric part of the coefficients. Adding any antisymmetric part keeps every autoparallel. The Levi-Civita connection is the one with the geodesics as autoparallels **and** no torsion.
      - text: 'Yes, because in the cartesian chart its coefficients sum to zero'
        feedback: |
          Coefficients summing to zero in pairs is not coefficients being zero. Transport tells them apart: carrying $(0,1)$ along $(\lambda,0)$ with this $\nabla$ gives $(\lambda,1)$, while the Euclidean connection keeps $(0,1)$.
      - text: 'It cannot be decided without a second chart'
        feedback: |
          One chart suffices. The torsion is a tensor: $\mathtt{T}^1_{12} = \Gamma^1_{21} - \Gamma^1_{12} = -2\neq0$ in this chart means $\mathtt{T}\neq0$, in every chart.
    explanation: |
      $\mathtt{T}^1_{12} = \Gamma^1_{21} - \Gamma^1_{12} = -1 - 1 = -2$. It is not even compatible: $(\nabla_{\partial x_2}g)_{11} = -\Gamma^1_{12} - \Gamma^1_{12} = -2$. The autoparallels fix only the symmetric part of a connection; among **torsion-free** connections they fix it completely.

  - type: mcq
    id: how-many
    title: The opening question, answered
    prompt: |
      On a manifold with metric $g$, how many connections have as autoparallelly transported curves exactly the constant-speed geodesics of $g$?
    options:
      - text: 'Infinitely many, but exactly one of them is torsion free: the Levi-Civita connection'
        correct: true
      - text: 'Exactly one, the Levi-Civita connection'
        feedback: |
          Add to the Christoffel symbols any coefficients antisymmetric in the lower indices (in the plane, $\Gamma^1_{12} = 1$, $\Gamma^1_{21} = -1$): the term $\Gamma^k_{ji}\dot\gamma^i\dot\gamma^j$ does not change, so neither do the autoparallels. Uniqueness needs the torsion to vanish.
      - text: 'None in general; only flat metrics have one'
        feedback: |
          The Levi-Civita connection exists for every metric, flat or not, and its autoparallel equation is the geodesic equation term by term. Existence came from uniqueness: the Christoffel symbols of overlapping charts define the same connection.
      - text: 'One for each chart, since the Christoffel symbols depend on the chart'
        feedback: |
          The numbers depend on the chart, the connection does not: on an overlap, the connections built from two charts are both torsion free and compatible, hence equal.
    explanation: |
      The curves fix $\Gamma^k_{ij} + \Gamma^k_{ji}$, so the symmetric part. Torsion free fixes the rest: $\nabla^{\mathrm{LC}}$. Notice that compatibility then comes for free; equivalently, compatibility plus torsion free single out the same connection without mentioning curves at all.

  - type: mcq
    id: trap-tensor
    tag: Trap
    title: Zero symbols, zero derivative?
    prompt: |
      In the cartesian chart of the Euclidean plane, every Christoffel symbol of $g = dx^1\otimes dx^1 + dx^2\otimes dx^2$ vanishes. Which statement follows?
    options:
      - text: 'In that chart, $(\nabla^{\mathrm{LC}}_\mathcal{X}\mathcal{Y})^k$ is the plain derivative $\mathcal{X}\lfloor\tilde x^k\rceil$ of the cartesian components $\tilde x^k$ of $\mathcal{Y}$'
        correct: true
      - text: 'The Christoffel symbols vanish in every chart of the plane'
        feedback: |
          They are not tensor components, so vanishing in one chart says nothing about another: in the polar chart $\Gamma^1_{22} = -r$ and $\Gamma^2_{12} = \tfrac1r$, because the polar basis turns and stretches.
      - text: '$\nabla^{\mathrm{LC}}_\mathcal{X}\mathcal{Y} = 0$ for all vector fields $\mathcal{X},\mathcal{Y}$'
        feedback: |
          The component formula is $(\nabla_\mathcal{X}\mathcal{Y})^k = \mathcal{X}\lfloor\tilde x^k\rceil + \Gamma^k_{ji}\tilde x^jx^i$. Zero $\Gamma$'s remove only the second term; for the swirl $\mathcal{Y} = -b\,\partial x_1 + a\,\partial x_2$, $\nabla_{\partial x_2}\mathcal{Y} = -\partial x_1\neq0$.
      - text: 'Christoffel symbols vanish only for the Euclidean plane, in any chart'
        feedback: |
          They depend on the chart: polar components of the same Euclidean metric give nonzero symbols. Whether **some** chart makes them vanish around a point is a property of the metric, tied to its curvature (next lesson).
    explanation: |
      With all $\Gamma = 0$ in cartesian components, $\nabla^{\mathrm{LC}}$ differentiates cartesian components directly: it is $\nabla^{\mathrm{E}}$. In polar components the same connection needs the $\Gamma$ terms.

  - type: text
    id: transport-keeps
    title: Transport keeps the metric
    body: |
      Take fields $\mathcal{X}_\gamma$, $\mathcal{Y}_\gamma$ along a curve $\gamma$, with components $x^i$, $y^j$, and recall the chart formula (C) of Level 6, $(\nabla_{v_\gamma}\mathcal{X}_\gamma)^i = \dot x^i + \Gamma^i_{mk}x^m\dot\gamma^k$. Differentiate $g(\mathcal{X}_\gamma,\mathcal{Y}_\gamma) = g_{ij}x^iy^j$ with the product and chain rules:
      $$\begin{aligned}&\tfrac{d}{d\lambda}(g_{ij}x^iy^j)\\ &= (\partial_kg_{ij})\dot\gamma^kx^iy^j + g_{ij}\dot x^iy^j + g_{ij}x^i\dot y^j.\end{aligned}$$
      Replace $\dot x^i = (\nabla_{v_\gamma}\mathcal{X}_\gamma)^i - \Gamma^i_{mk}x^m\dot\gamma^k$, the same for $\dot y^j$, and rename summed indices. The $\Gamma$ terms join $\partial_kg_{ij}$ into exactly the compatibility expression:
      $$\begin{aligned}&\tfrac{d}{d\lambda}g(\mathcal{X}_\gamma,\mathcal{Y}_\gamma)\\ &= \dot\gamma^kx^iy^j\,(\nabla_{\partial x_k}g)_{ij}\\ &\quad + g(\nabla_{v_\gamma}\mathcal{X}_\gamma,\mathcal{Y}_\gamma) + g(\mathcal{X}_\gamma,\nabla_{v_\gamma}\mathcal{Y}_\gamma).\end{aligned}$$
      For a metric-compatible connection, such as $\nabla^{\mathrm{LC}}$, the first line on the right is $0$.

  - type: mcq
    id: transport-consequence
    title: What transport preserves
    prompt: |
      For a metric-compatible connection and fields $\mathcal{X}_\gamma,\mathcal{Y}_\gamma$ along a curve $\gamma$,
      $$\begin{aligned}&\tfrac{d}{d\lambda}g(\mathcal{X}_\gamma,\mathcal{Y}_\gamma)\\ &= g(\nabla_{v_\gamma}\mathcal{X}_\gamma,\mathcal{Y}_\gamma) + g(\mathcal{X}_\gamma,\nabla_{v_\gamma}\mathcal{Y}_\gamma).\end{aligned}$$
      Both fields are parallelly transported, $\nabla_{v_\gamma}\mathcal{X}_\gamma = \nabla_{v_\gamma}\mathcal{Y}_\gamma = 0$. Which of these stay constant along $\gamma$?
    multiple: true
    options:
      - text: '$g(\mathcal{X}_\gamma,\mathcal{Y}_\gamma)$'
        correct: true
      - text: '$g(\mathcal{X}_\gamma,\mathcal{X}_\gamma)$'
        correct: true
      - text: 'The components $x^i$ of $\mathcal{X}_\gamma$ in a chart'
        feedback: |
          Components change whenever the basis does: under $\nabla^{\mathrm{E}}$ the polar components of a transported vector change around a circle, while its length stays fixed. Only chart-free quantities built with $g$ are protected.
    explanation: |
      Both terms on the right vanish, so every inner product of transported vectors is constant, in particular each length (take $\mathcal{Y}_\gamma = \mathcal{X}_\gamma$) and, in a Riemannian metric, each angle. Transport carries an orthonormal basis to an orthonormal basis.

  - type: numeric
    id: speed-p
    tag: Trap
    title: Speed along a polar straight curve
    prompt: |
      Euclidean plane, polar chart, metric components $\mathrm{diag}(1,r^2)$. The connection $\nabla^{\mathrm{P}}$ has all polar coefficients $0$, so its autoparallel equation is $\ddot r = 0$, $\ddot\theta = 0$; the curve $r = 1 + \lambda$, $\theta = \lambda$ ($0\le\lambda<\pi$) solves it. At $\lambda = 0$, $g(v_\gamma,v_\gamma) = 1 + 1 = 2$. What is $g(v_\gamma,v_\gamma)$ at $\lambda = 1$?
    answer: 5
    answerText: '5'
    wrong:
      - { value: 2, feedback: 'Constant $g(v_\gamma,v_\gamma)$ along autoparallelly transported curves needs a metric-compatible connection, and $\nabla^{\mathrm{P}}$ is not. Compute: $\dot r^2 + r^2\dot\theta^2$ with $r = 2$.' }
      - { value: 3, feedback: 'The angular term carries the metric component $g_{22} = r^2 = 4$, not $r = 2$: $1 + 4\cdot1$.' }
    hint: $g(v_\gamma,v_\gamma) = \dot r^2 + r^2\dot\theta^2$ with $\dot r = \dot\theta = 1$.
    explanation: |
      $1 + 2^2\cdot1 = 5$, up from $2$: this "straightest" curve of $\nabla^{\mathrm{P}}$ (a spiral) speeds up. For $\nabla^{\mathrm{LC}}$ that cannot happen: with $\mathcal{X}_\gamma = \mathcal{Y}_\gamma = v_\gamma$ and $\nabla_{v_\gamma}v_\gamma = 0$, $g(v_\gamma,v_\gamma)$ is constant.

  - type: text
    id: constant-speed
    title: Geodesics and autoparallels, reconciled
    body: |
      Take $\nabla = \nabla^{\mathrm{LC}}$ and an autoparallelly transported curve, $\nabla_{v_\gamma}v_\gamma = 0$. Setting $\mathcal{X}_\gamma = \mathcal{Y}_\gamma = v_\gamma$:
      $$\tfrac{d}{d\lambda}g(v_\gamma,v_\gamma) = 0.$$
      So $g(v_\gamma,v_\gamma)$ is constant, hence the sign $\text{ᛇ}_\gamma$ and the speed $s_\gamma$ are constant. Recall that (G) was derived **assuming** constant speed; now any solution of (G) has it automatically, so nothing was lost.

      Two cases:
      - $\text{ᛇ}_\gamma\neq0$: the curve is a constant-speed geodesic, a curve of stationary length. Conversely every constant-speed geodesic solves (G).
      - $\text{ᛇ}_\gamma = 0$ (possible only for an indefinite metric): the length is $0$ and the variational definition does not apply. These solutions are called **null geodesics**; in spacetime they will be light rays.

      For a general connection the two notions differ: **autoparallels depend on $\nabla$, geodesics only on $g$.**

  - type: mcq
    id: null-geodesic
    title: A light ray stays a light ray
    prompt: |
      Minkowski plane, points $(t,a)$, metric $\eta = -dx^1\otimes dx^1 + dx^2\otimes dx^2$ in the chart $\mathscr{X} = (t,a)$, where all Christoffel symbols vanish. A curve solves $\ddot\gamma^k + \Gamma^k_{ij}\dot\gamma^i\dot\gamma^j = 0$ and starts with the lightlike velocity $\partial x_1 + \partial x_2$. What can you say about its velocity later on?
    options:
      - text: 'It stays lightlike: $\eta(v_\gamma,v_\gamma) = 0$ for all $\lambda$, a null geodesic'
        correct: true
      - text: 'It becomes timelike: a light ray slows down'
        feedback: |
          With all Christoffel symbols $0$ the equation is $\ddot\gamma^k = 0$, so the velocity stays $\partial x_1 + \partial x_2$. In general, $\eta(v_\gamma,v_\gamma)$ is constant along solutions because the Levi-Civita connection is metric compatible.
      - text: 'Nothing: the geodesic equation was derived for nonzero sign, so it says nothing here'
        feedback: |
          The derivation from the length needed $\text{ᛇ}_\gamma\neq0$, but the equation itself, as the autoparallel equation of $\nabla^{\mathrm{LC}}$, makes sense for any starting velocity. Its solutions with $\text{ᛇ}_\gamma = 0$ are the null geodesics.
      - text: 'Its length grows linearly in $\lambda$'
        feedback: |
          The length is $\int\sqrt{\text{ᛇ}_\gamma\,\eta(v_\gamma,v_\gamma)}\,d\lambda$ with $\eta(v_\gamma,v_\gamma) = -1 + 1 = 0$ all along: the length is $0$, which is why stationary length could not define these curves.
    explanation: |
      Solutions are $(t_0 + \lambda, a_0 + \lambda)$, the light ray, with $\eta(v_\gamma,v_\gamma) = -1 + 1 = 0$ throughout. Compatibility guarantees the same in any chart and for any metric: the sign of the velocity never changes along an autoparallel of $\nabla^{\mathrm{LC}}$.

  - type: text
    id: summary
    body: |
      **Next: "Curvature of the Metric · Part 1".** A metric now comes with its own connection, so it has a curvature: $\mathrm{Riem}$ of $\nabla^{\mathrm{LC}}$, computed from $g$ alone. The polar chart has nonzero Christoffel symbols, yet the plane is flat; the sphere has them too, and is not. Which part of $\partial g$ and $\partial^2 g$ tells a curved metric from a flat one written in strange coordinates?
