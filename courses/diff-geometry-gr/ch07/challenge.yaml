id: ch07-challenge
title: Level Challenge
kind: challenge

# Organization: intro, then one block per problem (cards tagged
# "Problem N · …", ids prefixed pN-), then wrap-up. Session 1 wrote
# problems 1-3; part 2 adds problems 4-5 to the intro list, their blocks
# after the Problem 3 block, and the wrap-up card.

cards:
  - type: text
    id: intro
    title: Determinants, light rays, shortcuts
    body: |
      This challenge pushes each idea of the level to its edge. Keep pencil and paper at hand: every answer can be checked by hand. Einstein summation is on.

      Recall the toolkit. In a chart $\mathscr{X}$ the metric $g$ has components $g_{ij}$ (symmetric, $\det(g_{ij})\neq0$), the inverse metric has components $(g^{-1})^{ij}$ with
      $$g_{ij}\,(g^{-1})^{jk} = \delta^k_i,$$
      and $\partial_k$ is the derivative in the $k$-th chart slot. The **Christoffel symbols** of the Levi-Civita connection $\nabla^{\mathrm{LC}}$ are $\Gamma^k_{ij} = (g^{-1})^{km}\,\Gamma_{mij}$, with
      $$\begin{aligned}\Gamma_{mij} := \tfrac12\big(&\partial_ig_{mj} + \partial_jg_{mi}\\ &- \partial_mg_{ij}\big).\end{aligned}$$
      A curve with components $\gamma^k(\lambda)$ (dot $= d/d\lambda$, speed $s_\gamma$) is a constant-speed geodesic when it solves
      $$\ddot\gamma^k + \Gamma^k_{ij}\,\dot\gamma^i\dot\gamma^j = 0, \tag{G}$$
      and a geodesic at any speed when the right-hand side is $(\dot s_\gamma/s_\gamma)\,\dot\gamma^k$ instead, equation (S).

      1. Contracted Christoffel symbols: $d$ functions hidden in one determinant.
      2. A light ray in a medium: a variation computed by hand, twice, and an endpoint that moves.
      3. Lowering an index through $\nabla$, and why the energy Lagrangian fixes the speed while the length does not.
      4. Minimum or saddle: the second variation of the length, in the half-plane, in Minkowski and on the sphere.
      5. Einstein curvature in two dimensions: why it vanishes, and why the divergence-free combination is $\mathrm{Ric} - \tfrac12Rg$.

  # ---------------------------------------------------------------- Problem 1
  - type: text
    id: p1-setup
    tag: Problem 1 · Contracted Christoffel symbols
    title: Guess first
    body: |
      In four dimensions the Christoffel symbols $\Gamma^k_{ij}$ ($\Gamma^k_{ij} = \Gamma^k_{ji}$) are $40$ functions. Physics often needs only their **contraction** $\Gamma^k_{ki}$ (sum over $k$), just $4$ functions. It appears in the **divergence** of a vector field $\mathcal{Y}$ with components $y^m$, the covariant derivative with its direction index contracted against the component index:
      $$(\nabla_{\partial x_k}\mathcal{Y})^k = \partial_ky^k + \Gamma^k_{jk}\,y^j.$$
      Divergences measure what flows out of a small region (fluid, charge, energy), so they are everywhere in physics.

      **Claim of this problem:** all of $\Gamma^k_{ki}$ comes from one single function, the determinant of the metric components. Before the proof, compute a case where you know every symbol.

  - type: numeric
    id: p1-polar-direct
    tag: Problem 1 · Contracted Christoffel symbols
    title: The contraction in polar
    prompt: |
      The Euclidean plane in the polar chart $(r,\theta)$ has metric components $\mathrm{diag}(1,r^2)$ and the nonzero Christoffel symbols
      $$\Gamma^1_{22} = -r,$$
      $$\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r.$$
      Compute the contraction $\Gamma^k_{k1} = \Gamma^1_{11} + \Gamma^2_{21}$ at $r = 4$.
    answer: 0.25
    tolerance: 0.001
    answerText: '1/4'
    wrong:
      - { value: 0.5, feedback: 'The contraction sums over the single index $k$: one term $\Gamma^1_{11}$ ($k = 1$) and one term $\Gamma^2_{21}$ ($k = 2$). Counting $\Gamma^2_{12}$ and $\Gamma^2_{21}$ separately adds the same term twice.' }
      - { value: -3.75, feedback: '$\Gamma^1_{22} = -r$ does not have the pattern $\Gamma^k_{k1}$: its upper index $1$ matches no lower index $2$ in the right slots. Only $\Gamma^1_{11} = 0$ and $\Gamma^2_{21} = \tfrac1r$ enter.' }
    hint: Only two symbols have the pattern $\Gamma^k_{k1}$; one of them is zero.
    explanation: |
      $\Gamma^k_{k1} = 0 + \tfrac1r = \tfrac14$ at $r = 4$, and $\Gamma^k_{k2} = \Gamma^1_{12} + \Gamma^2_{22} = 0$. Now look at the determinant of the components: $\det g = r^2$, so $\sqrt{\det g} = r$ and
      $$\partial_r\ln\sqrt{\det g} = \partial_r\ln r = \tfrac1r.$$
      The same function. The rest of this problem proves that this is no accident:
      $$\Gamma^k_{ki} = \partial_i\ln\sqrt{|\det g|}.$$

  - type: text
    id: p1-plan
    tag: Problem 1 · Contracted Christoffel symbols
    title: Three steps
    body: |
      Write $\det g := \det(g_{ij})$, a smooth function on the chart domain that never vanishes. The proof has three steps:
      1. the derivative of the **inverse** metric, in terms of $\partial_kg_{ij}$;
      2. the derivative of the **determinant** (Jacobi's formula);
      3. the contraction of the Christoffel formula, where two of its three terms cancel.

      Step 1 starts from the identity $(g^{-1})^{ar}\,g_{rs} = \delta^a_s$. Its right-hand side is a constant ($0$ or $1$), so differentiating it with $\partial_c$ gives $0$, and the Leibniz rule splits the left-hand side into two terms:
      $$0 = \partial_c(g^{-1})^{ar}\,g_{rs} + (g^{-1})^{ar}\,\partial_cg_{rs}.$$

  - type: build
    id: p1-inverse
    tag: Problem 1 · Contracted Christoffel symbols
    title: The derivative of the inverse
    prompt: |
      Metric components $g_{rs}$, inverse $(g^{-1})^{ab}$, $\partial_c$ the $c$-th slot derivative. Differentiating $(g^{-1})^{ar}g_{rs} = \delta^a_s$ gives
      $$0 = \partial_c(g^{-1})^{ar}\,g_{rs} + (g^{-1})^{ar}\,\partial_cg_{rs}.$$
      Multiply by $(g^{-1})^{sb}$ (sum over $s$) and use $g_{rs}(g^{-1})^{sb} = \delta^b_r$ and the symmetry of $g^{-1}$. Build $\partial_c(g^{-1})^{ab}$.
    prefix: '\partial_c(g^{-1})^{ab} ='
    tiles: ['-', '(g^{-1})^{ar}', '(g^{-1})^{bs}', '\partial_cg_{rs}', '\frac{1}{\partial_cg_{ab}}']
    answers:
      - ['-', '(g^{-1})^{ar}', '(g^{-1})^{bs}', '\partial_cg_{rs}']
      - ['-', '(g^{-1})^{bs}', '(g^{-1})^{ar}', '\partial_cg_{rs}']
      - ['-', '(g^{-1})^{ar}', '\partial_cg_{rs}', '(g^{-1})^{bs}']
      - ['-', '(g^{-1})^{bs}', '\partial_cg_{rs}', '(g^{-1})^{ar}']
      - ['-', '\partial_cg_{rs}', '(g^{-1})^{ar}', '(g^{-1})^{bs}']
      - ['-', '\partial_cg_{rs}', '(g^{-1})^{bs}', '(g^{-1})^{ar}']
    wrong:
      - { answer: ['(g^{-1})^{ar}', '(g^{-1})^{bs}', '\partial_cg_{rs}'], feedback: 'The two terms of the Leibniz rule add up to $0$, so moving one to the other side flips its sign. If $g$ grows, its inverse must shrink: in polar $(g^{-1})^{22} = 1/r^2$ decreases while $g_{22} = r^2$ increases.' }
      - { answer: ['-', '\frac{1}{\partial_cg_{ab}}'], feedback: 'Components of the inverse are not reciprocals of components (recall $\begin{pmatrix}2&1\\1&1\end{pmatrix}^{-1} = \begin{pmatrix}1&-1\\-1&2\end{pmatrix}$), and neither are their derivatives. The inverse enters twice, once for each free index $a$, $b$.' }
      - { answer: ['\frac{1}{\partial_cg_{ab}}'], feedback: 'Components of the inverse are not reciprocals of components (recall $\begin{pmatrix}2&1\\1&1\end{pmatrix}^{-1} = \begin{pmatrix}1&-1\\-1&2\end{pmatrix}$), and the Leibniz rule produces a minus sign.' }
    hint: Moving a term across $0 = \ldots + \ldots$ flips its sign; then each free index ($a$, $b$) needs one factor of $g^{-1}$.
    explanation: |
      Multiplying by $(g^{-1})^{sb}$ turns the first term into $\partial_c(g^{-1})^{ab}$, so
      $$\partial_c(g^{-1})^{ab} = -(g^{-1})^{ar}(g^{-1})^{bs}\,\partial_cg_{rs}.$$
      In matrices: $\partial_c(\mathbf{G}^{-1}) = -\mathbf{G}^{-1}(\partial_c\mathbf{G})\mathbf{G}^{-1}$, the matrix version of $(1/x)' = -x'/x^2$.

  - type: numeric
    id: p1-inverse-check
    tag: Problem 1 · Contracted Christoffel symbols
    title: Check on polar
    prompt: |
      In the polar chart $(r,\theta)$ of the Euclidean plane, $g = \mathrm{diag}(1,r^2)$. Use the rule
      $$\partial_c(g^{-1})^{ab} = -(g^{-1})^{ar}(g^{-1})^{bs}\,\partial_cg_{rs}$$
      with $a = b = 2$, $c = 1$ (the $r$-slot) to compute $\partial_r(g^{-1})^{22}$ at $r = 2$.
    answer: -0.25
    tolerance: 0.001
    answerText: '-1/4'
    wrong:
      - { value: 0.25, feedback: 'Size right, sign wrong. The rule has a minus sign: $g_{22} = r^2$ grows with $r$, so its inverse $1/r^2$ must shrink.' }
      - { value: -4, feedback: 'That is $-\partial_rg_{22} = -2r$ alone. The two inverse factors $(g^{-1})^{22} = 1/r^2$ are missing: $-\tfrac{1}{r^2}\cdot\tfrac{1}{r^2}\cdot2r$.' }
    hint: Only $r = s = 2$ contributes, with $(g^{-1})^{22} = 1/r^2$ and $\partial_rg_{22} = 2r$.
    explanation: |
      $$-\tfrac{1}{r^2}\cdot\tfrac{1}{r^2}\cdot2r = -\tfrac{2}{r^3} = -\tfrac14$$
      at $r = 2$. Directly: $\partial_r(r^{-2}) = -2r^{-3}$. ✓

  - type: text
    id: p1-jacobi-setup
    tag: Problem 1 · Contracted Christoffel symbols
    title: Determinant to first order
    body: |
      Step 2. Move along the $k$-th coordinate line through a point $q$, by a parameter $t$. The matrix of components changes as
      $$\mathbf{A} + t\,\mathbf{B} + O(t^2),$$
      with $\mathbf{A} := (g_{ij}(q))$ and $\mathbf{B} := (\partial_kg_{ij}(q))$. So $\partial_k\det g$ at $q$ is the $t$-derivative at $t = 0$ of $\det(\mathbf{A}+t\mathbf{B})$. Since $\mathbf{A}$ is invertible, factor it out with $\det(\mathbf{M}\mathbf{N}) = \det\mathbf{M}\det\mathbf{N}$:
      $$\det(\mathbf{A}+t\mathbf{B}) = \det\mathbf{A}\,\det(\mathbf{I}+t\,\mathbf{C}),$$
      where $\mathbf{C} := \mathbf{A}^{-1}\mathbf{B}$ and $\mathbf{I}$ is the identity matrix. Everything now rests on $\det(\mathbf{I}+t\,\mathbf{C})$ near $t = 0$.

  - type: mcq
    id: p1-jacobi-2x2
    tag: Problem 1 · Contracted Christoffel symbols
    title: The first-order term
    prompt: |
      For a $2\times2$ matrix $\mathbf{C}$ with entries $c_{ij}$ and the identity $\mathbf{I}$,
      $$\det(\mathbf{I}+t\,\mathbf{C}) = (1+tc_{11})(1+tc_{22}) - t^2c_{12}c_{21}.$$
      What is the coefficient of $t$?
    options:
      - text: '$c_{11}+c_{22} = \mathrm{tr}\,\mathbf{C}$, the trace'
        correct: true
      - text: '$\det\mathbf{C} = c_{11}c_{22}-c_{12}c_{21}$'
        feedback: |
          $\det\mathbf{C}$ is the coefficient of $t^2$: both of its products carry two entries, each with a factor $t$. To first order only the diagonal entries survive, one at a time.
      - text: '$c_{12}+c_{21}$'
        feedback: |
          The off-diagonal entries appear only in the product $t^2c_{12}c_{21}$, which is second order. In any size, a non-identity permutation picks at least two off-diagonal entries, so they never reach first order.
      - text: '$c_{11}c_{22}$'
        feedback: |
          That product comes with $t^2$. Expanding $(1+tc_{11})(1+tc_{22}) = 1 + t(c_{11}+c_{22}) + t^2c_{11}c_{22}$, the first-order part is the sum of the diagonal entries.
    explanation: |
      $\det(\mathbf{I}+t\mathbf{C}) = 1 + t\,\mathrm{tr}\,\mathbf{C} + O(t^2)$. The same holds in any dimension: in the sum over permutations, the identity gives $\prod_i(1+tc_{ii}) = 1 + t\,\mathrm{tr}\,\mathbf{C} + O(t^2)$, and every other permutation picks at least two off-diagonal entries, each of order $t$.

  - type: text
    id: p1-jacobi
    tag: Problem 1 · Contracted Christoffel symbols
    title: Jacobi's formula
    body: |
      With $\det(\mathbf{I}+t\mathbf{C}) = 1 + t\,\mathrm{tr}\,\mathbf{C} + O(t^2)$, the factorization gives
      $$\frac{d}{dt}\det(\mathbf{A}+t\mathbf{B})\Big|_{t=0} = \det\mathbf{A}\;\mathrm{tr}(\mathbf{A}^{-1}\mathbf{B}).$$
      With $\mathbf{A} = (g_{ij})$, $\mathbf{B} = (\partial_kg_{ij})$, the trace is $(g^{-1})^{ji}\,\partial_kg_{ij} = (g^{-1})^{ij}\,\partial_kg_{ij}$ ($g^{-1}$ is symmetric). This is **Jacobi's formula**:
      $$\partial_k\det g = \det g\;(g^{-1})^{ij}\,\partial_kg_{ij}.$$
      Dividing by $\det g$: the logarithmic derivative of the determinant is the trace of $\mathbf{G}^{-1}\partial_k\mathbf{G}$. Check on polar: $\det g = r^2$ gives $\partial_r\det g = 2r$, and $r^2\cdot\tfrac1{r^2}\cdot2r = 2r$. ✓

  - type: numeric
    id: p1-jacobi-numeric
    tag: Problem 1 · Contracted Christoffel symbols
    title: Jacobi in numbers
    prompt: |
      A symmetric matrix depends on $t$ as
      $$\mathbf{G}(t) = \begin{pmatrix}2+t&1\\1&1+3t\end{pmatrix}.$$
      At $t = 0$, $\mathbf{A} = \begin{pmatrix}2&1\\1&1\end{pmatrix}$ has $\det\mathbf{A} = 1$ and $\mathbf{A}^{-1} = \begin{pmatrix}1&-1\\-1&2\end{pmatrix}$, and $\mathbf{B} = \mathbf{G}'(0)$. Compute $\frac{d}{dt}\det\mathbf{G}(t)$ at $t = 0$ with Jacobi's formula $\det\mathbf{A}\,\mathrm{tr}(\mathbf{A}^{-1}\mathbf{B})$, and check it by expanding the determinant.
    answer: 7
    tolerance: 0.001
    wrong:
      - { value: 4, feedback: 'That is $\mathrm{tr}\,\mathbf{B} = 1+3$, without $\mathbf{A}^{-1}$. The trace is of $\mathbf{A}^{-1}\mathbf{B}$: the second diagonal entry is weighted by $(\mathbf{A}^{-1})_{22} = 2$, giving $1\cdot1 + 2\cdot3 = 7$.' }
      - { value: 3, feedback: 'That is $\det\mathbf{B} = 1\cdot3$, a second-order quantity. The derivative at $t = 0$ is the trace term, $\mathrm{tr}(\mathbf{A}^{-1}\mathbf{B}) = 7$.' }
    hint: '$\mathbf{B} = \mathrm{diag}(1,3)$. The diagonal of $\mathbf{A}^{-1}\mathbf{B}$ is $(1\cdot1,\ 2\cdot3)$.'
    explanation: |
      $\mathbf{A}^{-1}\mathbf{B} = \begin{pmatrix}1&-3\\-1&6\end{pmatrix}$, trace $7$, times $\det\mathbf{A} = 1$. Directly:
      $$\begin{aligned}\det\mathbf{G}(t) &= (2+t)(1+3t) - 1\\ &= 1 + 7t + 3t^2,\end{aligned}$$
      whose derivative at $0$ is $7$. ✓

  - type: mcq
    id: p1-contract
    tag: Problem 1 · Contracted Christoffel symbols
    title: Two terms cancel
    prompt: |
      Step 3. Contract the Christoffel symbols of $\nabla^{\mathrm{LC}}$ over the upper and the first lower index (sums over $m$ and $l$):
      $$\begin{aligned}\Gamma^m_{mk} = \tfrac12(g^{-1})^{ml}\big(&\partial_kg_{lm} + \partial_mg_{lk}\\ &- \partial_lg_{mk}\big).\end{aligned}$$
      Which terms of the bracket cancel after the contraction?
    options:
      - text: 'The last two: renaming the summed indices $m\leftrightarrow l$ in one turns it into the other, because $g^{-1}$ and $g$ are symmetric'
        correct: true
      - text: 'The first two, $\partial_kg_{lm}$ and $\partial_mg_{lk}$'
        feedback: |
          They have the same sign, so they could only add. Also $\partial_kg_{lm}$ is differentiated in the **free** direction $k$, while $\partial_mg_{lk}$ is differentiated in a summed direction: no renaming of dummies maps one to the other.
      - text: 'The first and the last'
        feedback: |
          In $\partial_kg_{lm}$ the derivative is in the free direction $k$; in $\partial_lg_{mk}$ it is in the summed direction $l$. Renaming dummies cannot move $k$ into the derivative slot, so these two never match.
      - text: 'None: all three survive the contraction'
        feedback: |
          Rename $m\leftrightarrow l$ in $(g^{-1})^{ml}\partial_lg_{mk}$: it becomes $(g^{-1})^{lm}\partial_mg_{lk} = (g^{-1})^{ml}\partial_mg_{lk}$ by the symmetry of $g^{-1}$. That is exactly the middle term, with the opposite sign.
    explanation: |
      $(g^{-1})^{ml}\partial_lg_{mk} = (g^{-1})^{ml}\partial_mg_{lk}$ after the renaming, so the last two terms cancel and
      $$\Gamma^m_{mk} = \tfrac12(g^{-1})^{ml}\,\partial_kg_{lm}.$$
      Only the derivative in the free direction $k$ survives: exactly the trace that Jacobi's formula needs.

  - type: text
    id: p1-result
    tag: Problem 1 · Contracted Christoffel symbols
    title: The determinant formula
    body: |
      Combine step 3 with Jacobi's formula:
      $$\Gamma^m_{mk} = \tfrac12(g^{-1})^{ml}\,\partial_kg_{lm} = \frac{\partial_k\det g}{2\det g}.$$
      For a positive function $\partial\ln f = \partial f/f$ and $\tfrac12\ln f = \ln\sqrt f$; for a negative one, $\partial\ln|f| = \partial f/f$ as well. So
      $$\Gamma^m_{mk} = \partial_k\ln\sqrt{|\det g|}.$$
      Since $\Gamma^m_{mk} = \Gamma^m_{km}$, the divergence of a vector field becomes
      $$(\nabla_{\partial x_k}\mathcal{Y})^k = \frac{1}{\sqrt{|\det g|}}\,\partial_k\big(\sqrt{|\det g|}\,y^k\big),$$
      as the Leibniz rule on the right shows. No Christoffel symbol is left: only one function, $\sqrt{|\det g|}$.

  - type: mcq
    id: p1-abs
    tag: Problem 1 · Contracted Christoffel symbols
    title: Why the absolute value
    prompt: |
      For the Levi-Civita connection, the contraction of the Christoffel symbols is
      $$\Gamma^m_{mk} = \partial_k\ln\sqrt{|\det g|},$$
      with $\det g := \det(g_{ij})$ in the chart. Why the absolute value, rather than $\ln\sqrt{\det g}$?
    options:
      - text: 'For a Lorentzian metric $\det g < 0$ (for example $\mathrm{diag}(-1,1,1,1)$); $\partial\ln|f| = \partial f/f$ works for either sign, and it is $\partial f/f$ that the proof produces'
        correct: true
      - text: 'To make the contraction positive'
        feedback: |
          The absolute value is inside the logarithm, before differentiating; $\Gamma^m_{mk}$ can still have either sign (on the sphere $\cot\vartheta < 0$ in the southern hemisphere).
      - text: 'Because $\det g$ is positive anyway, and the bars are a convention'
        feedback: |
          Only for Riemannian metrics. The determinant has sign $(-1)^{n_-}$, with $n_-$ the number of minus signs of the signature: negative for spacetime, signature $(3,1)$.
      - text: 'Because $\det g$ may vanish at some points'
        feedback: |
          A metric is non-degenerate, so $\det g\neq0$ everywhere in the chart. The bars handle the sign, not zeros.
    explanation: |
      The proof gives $\Gamma^m_{mk} = \partial_k\det g/(2\det g)$, which is $\partial_k\ln\sqrt{|\det g|}$ for either sign. For spacetime $\det g < 0$ (signature $(3,1)$, sign $(-1)^1$), and $\sqrt{-\det g}$ is the factor that will weigh volumes of spacetime.

  - type: numeric
    id: p1-sphere
    tag: Problem 1 · Contracted Christoffel symbols
    title: Check on the sphere
    prompt: |
      The unit sphere in the chart $(\vartheta,\varphi)$ ($\vartheta$ = angle from the north pole, $\varphi$ = longitude) has metric components $\mathrm{diag}(1,\sin^2\vartheta)$ and nonzero Christoffel symbols $\Gamma^1_{22} = -\sin\vartheta\cos\vartheta$, $\Gamma^2_{12} = \Gamma^2_{21} = \cot\vartheta$. Compute the contraction $\Gamma^k_{k1}$ at $\vartheta = \pi/3$, once from the symbols and once from
      $$\Gamma^k_{k1} = \partial_\vartheta\ln\sqrt{|\det g|}.$$
    answer: 0.57735
    tolerance: 0.002
    answerText: '1/√3 ≈ 0.577'
    wrong:
      - { value: 1.1547, feedback: 'That is $\partial_\vartheta\ln\det g = 2\cot\vartheta$: the square root halves it. From the symbols: $\Gamma^1_{11} + \Gamma^2_{21} = 0 + \cot\vartheta$.' }
      - { value: -0.43301, feedback: 'That is $\Gamma^1_{22} = -\sin\vartheta\cos\vartheta$, which does not have the pattern $\Gamma^k_{k1}$. The contraction is $\Gamma^1_{11} + \Gamma^2_{21}$.' }
    hint: '$\det g = \sin^2\vartheta$, so $\sqrt{|\det g|} = \sin\vartheta$ on $(0,\pi)$.'
    explanation: |
      From the symbols: $\Gamma^1_{11} + \Gamma^2_{21} = 0 + \cot\vartheta$. From the determinant: $\partial_\vartheta\ln\sin\vartheta = \cot\vartheta$. At $\pi/3$: $\cot(\pi/3) = 1/\sqrt3\approx0.577$. ✓ And $\Gamma^k_{k2} = 0$, since nothing depends on $\varphi$.

  - type: numeric
    id: p1-bowl
    tag: Problem 1 · Contracted Christoffel symbols
    title: A bowl
    prompt: |
      A bowl in space: above each point of the plane with polar coordinates $(r,\theta)$, the surface sits at height $r^2/4$. Measuring lengths in space gives, in the chart $(r,\theta)$, the metric components
      $$g = \mathrm{diag}\big(1+\tfrac{r^2}{4},\ r^2\big).$$
      Compute the contraction $\Gamma^k_{k1}$ ($1$ = the $r$-slot) at $r = 2$, either from $\Gamma^k_{k1} = \partial_r\ln\sqrt{|\det g|}$ or from the two symbols $\Gamma^1_{11}$ and $\Gamma^2_{21}$. Both routes must agree.
    answer: 0.75
    tolerance: 0.001
    answerText: '3/4'
    wrong:
      - { value: 0.5, feedback: 'That is $\Gamma^2_{21} = \tfrac1r$ alone, the flat-plane value. Here $g_{11} = 1+\tfrac{r^2}{4}$ depends on $r$, so $\Gamma^1_{11} = \tfrac12(g^{-1})^{11}\partial_rg_{11} = \frac{r/2}{2(1+r^2/4)} = \tfrac14$ also contributes.' }
      - { value: 0.25, feedback: 'That is $\Gamma^1_{11}$ alone. The contraction also has $\Gamma^2_{21} = \tfrac12(g^{-1})^{22}\partial_rg_{22} = \tfrac1r = \tfrac12$.' }
      - { value: 1.5, feedback: 'That is $\partial_r\ln\det g$, twice the answer: the square root brings a factor $\tfrac12$.' }
    hint: '$\det g = r^2\,(1+\tfrac{r^2}{4})$, so $\ln\sqrt{\det g} = \ln r + \tfrac12\ln(1+\tfrac{r^2}{4})$.'
    explanation: |
      From the determinant, with $W := 1+\tfrac{r^2}{4}$ ($W = 2$ at $r = 2$):
      $$\partial_r\ln\big(r\sqrt W\big) = \tfrac1r + \frac{r}{4W} = \tfrac12 + \tfrac14.$$
      From the symbols: $\Gamma^1_{11} = \tfrac12\cdot\tfrac1W\cdot\tfrac r2 = \tfrac14$ and $\Gamma^2_{21} = \tfrac12\cdot\tfrac1{r^2}\cdot2r = \tfrac12$. Both give $\tfrac34$. ✓

  - type: mcq
    id: p1-not-covector
    tag: Problem 1 · Contracted Christoffel symbols
    title: A covector field?
    prompt: |
      The contraction $\Gamma^k_{ki} = \partial_i\ln\sqrt{|\det g|}$ has one lower index. On the Euclidean plane it is $(0,0)$ in the cartesian chart (metric components $\delta_{ij}$) and $(\tfrac1r,0)$ in the polar chart (components $\mathrm{diag}(1,r^2)$). Are the numbers $\Gamma^k_{ki}$ the components of a covector field?
    options:
      - text: 'No: the components of a covector field vanish in every chart if they vanish in one, and here they do not; $\det g$ is not a scalar field, it changes with the chart'
        correct: true
      - text: 'Yes: it is the differential of the function $\ln\sqrt{|\det g|}$, and differentials are covector fields'
        feedback: |
          A differential $df$ is a covector field when $f$ is one function on the manifold. But $\det g$ depends on the chart: $1$ in cartesian, $r^2$ in polar. Each chart differentiates a different function, so the results do not transform as covector components.
      - text: 'Yes: contracting an upper with a lower index always gives a tensor'
        feedback: |
          Contraction makes tensors out of **tensors**. The Christoffel symbols are not tensor components (their transformation law has an extra second-derivative term), so neither is their contraction.
    explanation: |
      Under a change of chart with Jacobian matrix $\mathbf{A}$ (old by new), $\mathbf{G}_\mathscr{Y} = \mathbf{A}^{\mathsf T}\mathbf{G}_\mathscr{X}\mathbf{A}$, so $\det g$ picks up the factor $(\det\mathbf{A})^2$ and $\ln\sqrt{|\det g|}$ shifts by $\ln|\det\mathbf{A}|$. Cartesian to polar: $\det\mathbf{A} = r$, the shift $\ln r$, the extra term $\tfrac1r$: an inhomogeneous term, the fingerprint of the Christoffel symbols.

  - type: text
    id: p1-shows
    tag: Problem 1 · Contracted Christoffel symbols
    title: What it shows
    body: |
      - Derivative of the inverse: $\partial_c(g^{-1})^{ab} = -(g^{-1})^{ar}(g^{-1})^{bs}\,\partial_cg_{rs}$.
      - Jacobi's formula: $\partial_k\det g = \det g\,(g^{-1})^{ij}\,\partial_kg_{ij}$, from $\det(\mathbf{I}+t\mathbf{C}) = 1 + t\,\mathrm{tr}\,\mathbf{C} + O(t^2)$.
      - Contracting the Christoffel formula kills two of its three terms, and
      $$\Gamma^m_{mk} = \partial_k\ln\sqrt{|\det g|}.$$

      So the $d$ contracted symbols need only one function, and the divergence is $\frac{1}{\sqrt{|\det g|}}\partial_k(\sqrt{|\det g|}\,y^k)$. That function is not a scalar field: it carries the chart's own stretching, $\det\mathbf{A}$. This is exactly what a **density for volumes** must do, and $\sqrt{|\det g|}$ comes back in Level 8.

  # ---------------------------------------------------------------- Problem 2
  - type: text
    id: p2-setup
    tag: Problem 2 · A light ray in a medium
    title: Guess first
    body: |
      Light in a medium with refractive index $n$ takes the path of stationary **optical length** $\int n\,ds$ ($ds$ = Euclidean length element): Fermat's principle. So light rays are geodesics of the metric $n^2\times$(Euclidean).

      Take the upper half-plane $\mathbb{H} := \{(u,w)\in\mathbb{R}^2\mid w > 0\}$ with the cartesian chart $\mathscr{X} = (u,w)$ and index $n = 1/w$, which falls with height. The metric has components
      $$g_{ij} = \frac{\delta_{ij}}{w^2}.$$
      Consider the horizontal path $\gamma(\lambda) = (\lambda,1)$, $\lambda\in[-1,1]$, from $(-1,1)$ to $(1,1)$.

      **Before any computation, guess:** does the light ray between these two points follow the horizontal path, bow upward, or bow downward?

  - type: mcq
    id: p2-guess
    tag: Problem 2 · A light ray in a medium
    title: Which way does light bow?
    prompt: |
      On the upper half-plane $\{(u,w)\mid w>0\}$, the metric $g_{ij} = \delta_{ij}/w^2$ measures optical length in a medium of refractive index $n = 1/w$. Light from $(-1,1)$ to $(1,1)$ follows a curve of stationary length. Compared with the horizontal segment $w = 1$, the ray:
    options:
      - text: 'bows upward, into the region where $n$ is smaller, so each unit of Euclidean distance costs less'
        correct: true
      - text: 'follows the horizontal segment, by symmetry'
        feedback: |
          The left-right symmetry of the endpoints only says the ray is symmetric about $u = 0$. The medium is not symmetric up-down: $n = 1/w$ is smaller above, so a detour upward can pay for its extra Euclidean length.
      - text: 'bows downward'
        feedback: |
          Below the segment $n = 1/w$ is **larger**: every unit of Euclidean distance costs more, and the detour is longer too. Both effects increase the optical length.
    explanation: |
      A slight upward bump costs extra Euclidean length only at second order (the bump's slope squared) but gains at first order from the lower index. The next cards make this precise: the first variation is negative for every upward bump.

  - type: mcq
    id: p2-lagrangian
    tag: Problem 2 · A light ray in a medium
    title: The Lagrangian
    prompt: |
      On the upper half-plane with chart $(u,w)$ and metric components $g_{ij} = \delta_{ij}/w^2$, the length Lagrangian is $\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{g_{ij}\,\beta^i\beta^j}$ ($g_{ij}$ at the point with coordinates $\alpha = (\alpha^1,\alpha^2)$, velocity slots $\beta$; the metric is positive definite, so the sign rune is $1$). Which formula is it?
    options:
      - text: '$\dfrac{\sqrt{(\beta^1)^2+(\beta^2)^2}}{\alpha^2}$'
        correct: true
      - text: '$\dfrac{\sqrt{(\beta^1)^2+(\beta^2)^2}}{(\alpha^2)^2}$'
        feedback: |
          The factor $1/w^2$ sits **inside** the square root: $\sqrt{\beta\cdot\beta/(\alpha^2)^2} = \sqrt{\beta\cdot\beta}/\alpha^2$. Optical length is $n$ (not $n^2$) times Euclidean length.
      - text: '$\dfrac{(\beta^1)^2+(\beta^2)^2}{(\alpha^2)^2}$'
        feedback: |
          That is $g_{ij}\beta^i\beta^j$ itself, twice the energy Lagrangian. The length Lagrangian has the square root, which makes the length independent of the parametrization.
      - text: '$\sqrt{(\beta^1)^2+(\beta^2)^2}$'
        feedback: |
          That is the Euclidean Lagrangian. The metric $\delta_{ij}/w^2$ adds the index $n = 1/w$ evaluated at the position slot $\alpha^2$.
    explanation: |
      $\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{\beta\cdot\beta}/\alpha^2$: Euclidean speed times $n = 1/w$. Along $\gamma(\lambda) = (\lambda,1)$, $\alpha = (\lambda,1)$ and $\beta = (1,0)$, so $\mathcal{L}_\mathscr{X} = 1$ and the length is $2$.

  - type: numeric
    id: p2-direct
    tag: Problem 2 · A light ray in a medium
    title: Bend it, directly
    prompt: |
      Upper half-plane, chart $(u,w)$, length Lagrangian $\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{(\beta^1)^2+(\beta^2)^2}/\alpha^2$. Deform $\gamma(\lambda) = (\lambda,1)$, $\lambda\in[-1,1]$, with the knob $\text{ᛊ}$ and the shape $\text{ᛉ}(\lambda) = (0,\,1-\lambda^2)$ (zero at both ends):
      $$\gamma_{\text{ᛊ}}(\lambda) = \big(\lambda,\ 1+\text{ᛊ}(1-\lambda^2)\big).$$
      Its length is
      $$L(\text{ᛊ}) = \int_{-1}^{1}\frac{\sqrt{1+4\text{ᛊ}^2\lambda^2}}{1+\text{ᛊ}(1-\lambda^2)}\,d\lambda.$$
      Compute $\frac{dL}{d\text{ᛊ}}$ at $\text{ᛊ} = 0$ by differentiating under the integral.
    answer: -1.33333
    tolerance: 0.005
    answerText: '-4/3'
    wrong:
      - { value: 1.33333, feedback: 'Sign: $\frac{d}{d\text{ᛊ}}\frac{1}{1+\text{ᛊ}h} = -h$ at $\text{ᛊ} = 0$. Lifting the path lowers the index $1/w$, so the length decreases.' }
      - { value: 0, feedback: 'The numerator gives $0$: $\frac{d}{d\text{ᛊ}}\sqrt{1+4\text{ᛊ}^2\lambda^2} = 0$ at $\text{ᛊ} = 0$ (the extra Euclidean length is second order). The denominator does not: the index changes to first order.' }
      - { value: -2, feedback: 'That is $-\int_{-1}^11\,d\lambda$. The integrand is $-(1-\lambda^2)$, the shape itself, whose integral is $2 - \tfrac23 = \tfrac43$.' }
    hint: At $\text{ᛊ} = 0$ the numerator has zero derivative; the denominator gives $-(1-\lambda^2)$.
    explanation: |
      $$\frac{dL}{d\text{ᛊ}}\Big|_0 = -\int_{-1}^{1}(1-\lambda^2)\,d\lambda = -\tfrac43.$$
      Negative: an upward bump shortens the optical path, as guessed. So the horizontal path is not a geodesic.

  - type: mcq
    id: p2-residual
    tag: Problem 2 · A light ray in a medium
    title: The Euler-Lagrange residual
    prompt: |
      Upper half-plane, $\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{(\beta^1)^2+(\beta^2)^2}/\alpha^2$, curve $\gamma(\lambda) = (\lambda,1)$. Along the curve put $Q_m := \partial_m\mathcal{L}_\mathscr{X}$ (position slots), $P_m := \partial_{2+m}\mathcal{L}_\mathscr{X}$ (velocity slots), and $E_m := Q_m - \dot P_m$. What is $(E_1,E_2)$?
    options:
      - text: '$(0,-1)$'
        correct: true
      - text: '$(0,0)$: a straight line in the chart solves the equations'
        feedback: |
          Straight in the chart is not straight for the metric. $Q_2 = \partial_{\alpha^2}\big(\sqrt{\beta\cdot\beta}/\alpha^2\big) = -\sqrt{\beta\cdot\beta}/(\alpha^2)^2 = -1$ along the curve, and nothing cancels it.
      - text: '$(0,1)$'
        feedback: |
          Sign: $\partial_w(1/w) = -1/w^2$, so $Q_2 = -1$. Also $P_2 = \beta^2/(\alpha^2\sqrt{\beta\cdot\beta}) = 0$, so $E_2 = Q_2 = -1$.
      - text: '$(-1,0)$'
        feedback: |
          The horizontal slots are harmless: $\mathcal{L}_\mathscr{X}$ does not depend on $\alpha^1$ ($Q_1 = 0$), and $P_1 = \beta^1/(\alpha^2\sqrt{\beta\cdot\beta}) = 1$ is constant ($\dot P_1 = 0$). The trouble is vertical.
    explanation: |
      Along $\alpha = (\lambda,1)$, $\beta = (1,0)$: $Q_1 = 0$, $Q_2 = -1$, $P_1 = 1$, $P_2 = 0$, all constant. So $E = (0,-1)$: the curve fails the Euler-Lagrange equations in the vertical slot.

  - type: text
    id: p2-compare
    tag: Problem 2 · A light ray in a medium
    title: Two routes, one number
    body: |
      Recall the first variation: for a shape $\text{ᛉ}$ vanishing at both ends,
      $$\frac{dL}{d\text{ᛊ}}\Big|_0 = \int E_m\,\text{ᛉ}^m\,d\lambda.$$
      With $E = (0,-1)$ and $\text{ᛉ} = (0,1-\lambda^2)$:
      $$\int_{-1}^{1}(-1)(1-\lambda^2)\,d\lambda = -\tfrac43,$$
      the number found by differentiating the length directly. ✓

      The residual is computed **once**; then every shape costs one integral. Since $E_2 = -1 < 0$ along the whole path, every upward bump ($\text{ᛉ}^2 \geq 0$, not identically zero) shortens it.

  - type: numeric
    id: p2-second-shape
    tag: Problem 2 · A light ray in a medium
    title: Another bump
    prompt: |
      Upper half-plane, metric $g_{ij} = \delta_{ij}/w^2$ in the chart $(u,w)$. Along $\gamma(\lambda) = (\lambda,1)$, $\lambda\in[-1,1]$, the Euler-Lagrange residual of the length is $E = (E_1,E_2) = (0,-1)$, and the first variation is $\frac{dL}{d\text{ᛊ}}\big|_0 = \int E_m\text{ᛉ}^m\,d\lambda$ for shapes vanishing at both ends. Compute it for the shape
      $$\text{ᛉ}(\lambda) = \big(0,\ \cos\tfrac{\pi\lambda}{2}\big).$$
    answer: -1.27324
    tolerance: 0.005
    answerText: '-4/π ≈ -1.273'
    wrong:
      - { value: 1.27324, feedback: 'Sign: $E_2 = -1$, and the shape is positive inside, so the integral is negative.' }
      - { value: -0.63662, feedback: 'Antiderivative: $\int\cos\tfrac{\pi\lambda}{2}\,d\lambda = \tfrac{2}{\pi}\sin\tfrac{\pi\lambda}{2}$, which goes from $-\tfrac2\pi$ to $\tfrac2\pi$: total $\tfrac4\pi$.' }
    hint: '$\int_{-1}^{1}\cos\tfrac{\pi\lambda}{2}\,d\lambda = \tfrac2\pi\big[\sin\tfrac{\pi\lambda}{2}\big]_{-1}^{1}$.'
    explanation: |
      $$-\int_{-1}^{1}\cos\tfrac{\pi\lambda}{2}\,d\lambda = -\tfrac{4}{\pi}\approx-1.273.$$
      No new derivative of $\mathcal{L}_\mathscr{X}$ was needed: the residual did the work.

  - type: numeric
    id: p2-slide
    tag: Problem 2 · A light ray in a medium
    title: An endpoint that moves
    prompt: |
      Upper half-plane, chart $(u,w)$, length Lagrangian $\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{(\beta^1)^2+(\beta^2)^2}/\alpha^2$. Along $\gamma(\lambda) = (\lambda,1)$, $\lambda\in[-1,1]$, the residual is $E = (0,-1)$. Now use the shape
      $$\text{ᛉ}(\lambda) = \big(\tfrac{\lambda+1}{2},\ 0\big),$$
      which is $0$ at $\lambda = -1$ but $(1,0)$ at $\lambda = 1$: the right endpoint slides to $(1+\text{ᛊ},1)$. Compute $\frac{dL}{d\text{ᛊ}}$ at $\text{ᛊ} = 0$.
    answer: 1
    tolerance: 0.001
    wrong:
      - { value: 0, feedback: 'That is $\int E_m\text{ᛉ}^m\,d\lambda = \int0\cdot\tfrac{\lambda+1}{2}\,d\lambda$, the formula for shapes that **vanish at both ends**. Integration by parts left the boundary term $\big[P_m\text{ᛉ}^m\big]_{-1}^{1}$, with $P_1 = 1$ along the curve: it gives $1\cdot1 - 1\cdot0 = 1$.' }
      - { value: -1, feedback: 'Sign: sliding the right endpoint to the right, along the direction of motion, makes the path longer. Directly, $\gamma_{\text{ᛊ}} = \big(\lambda+\text{ᛊ}\tfrac{\lambda+1}{2},1\big)$ has $L = 2+\text{ᛊ}$.' }
    hint: Compute the length directly ($w = 1$ stays fixed), or add the boundary term $\big[P_m\text{ᛉ}^m\big]_{-1}^{1}$ with $P_1 = 1$, $P_2 = 0$.
    explanation: |
      Directly: $\gamma_{\text{ᛊ}}(\lambda) = \big(\lambda+\text{ᛊ}\tfrac{\lambda+1}{2},\,1\big)$ has velocity $(1+\tfrac{\text{ᛊ}}{2},0)$ and $w = 1$, so $L = 2+\text{ᛊ}$ and the derivative is $1$. With the formula:
      $$\frac{dL}{d\text{ᛊ}}\Big|_0 = \big[P_m\text{ᛉ}^m\big]_{-1}^{1} + \int E_m\text{ᛉ}^m\,d\lambda = 1 + 0.$$
      The Euler-Lagrange equations know nothing about moving endpoints; the boundary term does.

  - type: numeric
    id: p2-lift-end
    tag: Problem 2 · A light ray in a medium
    title: Lift the endpoint instead
    prompt: |
      Upper half-plane, chart $(u,w)$, length Lagrangian $\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{(\beta^1)^2+(\beta^2)^2}/\alpha^2$. Along $\gamma(\lambda) = (\lambda,1)$, $\lambda\in[-1,1]$: residual $E = (0,-1)$, velocity-slot derivatives $P = (1,0)$, and
      $$\frac{dL}{d\text{ᛊ}}\Big|_0 = \big[P_m\text{ᛉ}^m\big]_{-1}^{1} + \int E_m\text{ᛉ}^m\,d\lambda.$$
      Use the shape $\text{ᛉ}(\lambda) = \big(0,\ \tfrac{\lambda+1}{2}\big)$: the right endpoint is lifted to $(1,1+\text{ᛊ})$. Compute $\frac{dL}{d\text{ᛊ}}$ at $\text{ᛊ} = 0$.
    answer: -1
    tolerance: 0.001
    wrong:
      - { value: 0, feedback: 'The boundary term is $0$ here ($P_2 = 0$: the lift is perpendicular to the motion), but the interior is not: $\int_{-1}^{1}(-1)\tfrac{\lambda+1}{2}\,d\lambda = -1$.' }
      - { value: 0.5, feedback: 'That adds a boundary term $\tfrac12$ that is not there: $P_2 = 0$, since the velocity $(1,0)$ has no vertical part. Only the interior integral $-1$ remains.' }
    hint: '$P_2 = 0$, so only the integral survives: $\int_{-1}^{1}\tfrac{\lambda+1}{2}\,d\lambda = 1$.'
    explanation: |
      Boundary term $P_2\cdot1 - P_2\cdot0 = 0$; interior $-\int_{-1}^{1}\tfrac{\lambda+1}{2}\,d\lambda = -1$. Check directly: $\gamma_{\text{ᛊ}} = \big(\lambda,1+\text{ᛊ}\tfrac{\lambda+1}{2}\big)$ has $\mathcal{L}_\mathscr{X} = \sqrt{1+\text{ᛊ}^2/4}\,/\,\big(1+\text{ᛊ}\tfrac{\lambda+1}{2}\big)$, with $\text{ᛊ}$-derivative $-\tfrac{\lambda+1}{2}$ at $0$. ✓

      In general $P_m = g_{mj}\dot\gamma^j/s_\gamma$: the boundary term is $g(\text{unit velocity},\ \text{endpoint shift})$. Sliding along the motion counts fully; lifting perpendicular to it counts zero.

  - type: text
    id: p2-shows
    tag: Problem 2 · A light ray in a medium
    title: What it shows
    body: |
      - Differentiating the length directly and integrating the residual $E_m = Q_m - \dot P_m$ against the shape give the same number ($-\tfrac43$): the residual measures, point by point, how much a curve fails to be a geodesic.
      - One residual serves every shape: $-\tfrac4\pi$ for the cosine bump with no new derivative.
      - If an endpoint moves, the boundary term returns:
      $$\frac{dL}{d\text{ᛊ}}\Big|_0 = \big[P_m\text{ᛉ}^m\big] + \int E_m\text{ᛉ}^m\,d\lambda,$$
      with $\big[P_m\text{ᛉ}^m\big]$ the metric component of the endpoint shift along the unit velocity.
      - Light in a medium with $n = 1/w$ arcs upward, toward lower index. The metric $\delta_{ij}/w^2$ is the **hyperbolic half-plane**, whose geodesics are vertical lines and half-circles centered on $w = 0$.

  # ---------------------------------------------------------------- Problem 3
  - type: text
    id: p3-setup
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: Guess first
    body: |
      Physicists lower indices inside derivatives without blinking: from a velocity $u^m$ they form $u_i := g_{im}u^m$ and write "$\nabla_ku_i = g_{im}\nabla_ku^m$". In our notation: is
      $$\nabla_\mathcal{Z}\big(\flat(\mathcal{Y})\big) = \flat\big(\nabla_\mathcal{Z}\mathcal{Y}\big)$$
      for all vector fields $\mathcal{Z}$, $\mathcal{Y}$? Recall $\flat(\mathcal{Y})_i = y^mg_{mi}$ and, for any connection with coefficients $\Gamma^i_{jk}$ (last lower index = direction), the component rules
      $$(\nabla_{\partial x_k}\mathcal{Y})^m = \partial_ky^m + \Gamma^m_{jk}\,y^j,$$
      $$(\nabla_{\partial x_k}\mathsf{X})_i = \partial_k\mathtt{x}_i - \Gamma^j_{ik}\,\mathtt{x}_j,$$
      $$\begin{aligned}(\nabla_{\partial x_k}g)_{ij} = \partial_kg_{ij} &- \Gamma^m_{ik}\,g_{mj}\\ &- \Gamma^m_{jk}\,g_{im}.\end{aligned}$$
      **Guess:** always, never, or only for some connections?

  - type: mcq
    id: p3-difference
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: The difference
    prompt: |
      A connection $\nabla$ with coefficients $\Gamma^i_{jk}$ (last lower index = direction) acts on components as $(\nabla_{\partial x_k}\mathcal{Y})^m = \partial_ky^m + \Gamma^m_{jk}y^j$ and $(\nabla_{\partial x_k}\mathsf{X})_i = \partial_k\mathtt{x}_i - \Gamma^j_{ik}\mathtt{x}_j$. With $\flat(\mathcal{Y})_i = g_{im}y^m$, expand both sides and subtract (rename summed indices where needed). What is
      $$\big(\nabla_{\partial x_k}\flat(\mathcal{Y})\big)_i - g_{im}(\nabla_{\partial x_k}\mathcal{Y})^m\ ?$$
    options:
      - text: '$(\nabla_{\partial x_k}g)_{im}\,y^m$, the covariant derivative of the metric fed $\mathcal{Y}$'
        correct: true
      - text: '$0$ for every connection'
        feedback: |
          The terms $g_{im}\partial_ky^m$ cancel, but three others remain: $(\partial_kg_{im} - \Gamma^n_{ik}g_{nm} - \Gamma^n_{mk}g_{in})\,y^m$. That bracket is $(\nabla_{\partial x_k}g)_{im}$, which vanishes only for some connections.
      - text: '$(\partial_kg_{im})\,y^m$'
        feedback: |
          That forgets the two $\Gamma$ terms: one from the covector rule ($-\Gamma^n_{ik}g_{nm}y^m$) and one from the vector rule multiplied by $g_{im}$ ($-g_{in}\Gamma^n_{mk}y^m$ after renaming). With them, the bracket is the covariant derivative of $g$, a tensor; $\partial_kg_{im}$ alone is not.
      - text: 'A torsion term, $(\Gamma^n_{ki} - \Gamma^n_{ik})\,g_{nm}y^m$'
        feedback: |
          Torsion would compare $\Gamma^n_{ik}$ with $\Gamma^n_{ki}$. Here both $\Gamma$ terms carry the direction $k$ in the last slot; what they build together with $\partial_kg_{im}$ is $(\nabla_{\partial x_k}g)_{im}$.
    explanation: |
      Left: $\partial_k(g_{im}y^m) - \Gamma^n_{ik}g_{nm}y^m$. Right: $g_{im}\partial_ky^m + g_{in}\Gamma^n_{mk}y^m$ (renamed $m\leftrightarrow n$). Subtracting:
      $$\big(\partial_kg_{im} - \Gamma^n_{ik}g_{nm} - \Gamma^n_{mk}g_{in}\big)y^m,$$
      which is $(\nabla_{\partial x_k}g)_{im}\,y^m$. So $\nabla$ and $\flat$ commute exactly when $\nabla g = 0$.

  - type: mcq
    id: p3-which
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: Which connections?
    multiple: true
    prompt: |
      On the Euclidean plane, $\big(\nabla_{\partial x_k}\flat(\mathcal{Y})\big)_i - g_{im}(\nabla_{\partial x_k}\mathcal{Y})^m = (\nabla_{\partial x_k}g)_{im}\,y^m$ for every connection. For which of these connections does lowering commute with differentiating, $\nabla_\mathcal{Z}\flat(\mathcal{Y}) = \flat(\nabla_\mathcal{Z}\mathcal{Y})$ for all $\mathcal{Z}$, $\mathcal{Y}$? Select all that apply.
    options:
      - text: '$\nabla^{\mathrm{E}}$: all cartesian coefficients zero (the Levi-Civita connection of the plane)'
        correct: true
      - text: '$\nabla^{\mathrm{W}}$: the unit radial and angular fields declared parallel (has torsion)'
        correct: true
      - text: '$\nabla^{\mathrm{P}}$: all polar coefficients zero (torsion free)'
        feedback: |
          Torsion free is not the point. $\nabla^{\mathrm{P}}$ keeps the polar components of $\partial y_2$ constant while its length $r$ grows: $(\nabla^{\mathrm{P}}_{\partial y_1}g)_{22} = \partial_rr^2 = 2r\neq0$. So lowering and differentiating disagree.
    explanation: |
      The test is metric compatibility, $\nabla g = 0$, nothing else. $\nabla^{\mathrm{E}}$ (the Levi-Civita connection) passes; $\nabla^{\mathrm{W}}$ passes too, despite its torsion, because it carries an orthonormal frame parallel; $\nabla^{\mathrm{P}}$ fails. Physicists may lower freely because they use $\nabla^{\mathrm{LC}}$, which is compatible.

  - type: numeric
    id: p3-p-numeric
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: Where ∇ᴾ fails
    prompt: |
      Euclidean plane, polar chart $(r,\theta)$, $g = \mathrm{diag}(1,r^2)$, and $\nabla^{\mathrm{P}}$ with all polar coefficients zero. Take $\mathcal{Y} = \partial y_2$ (polar components $(0,1)$). Then $\nabla^{\mathrm{P}}_{\partial y_1}\mathcal{Y} = 0$, so $\flat(\nabla^{\mathrm{P}}_{\partial y_1}\mathcal{Y}) = 0$. Now lower first: $\flat(\mathcal{Y})$ has components $(0,r^2)$. Compute $\big(\nabla^{\mathrm{P}}_{\partial y_1}\flat(\mathcal{Y})\big)_2$ at $r = 3$.
    answer: 6
    tolerance: 0.001
    wrong:
      - { value: 0, feedback: 'That would mean lowering commutes with $\nabla^{\mathrm{P}}$. With all coefficients zero, the covector rule is just $\partial_r$ of the components: $\partial_r(r^2) = 2r$.' }
      - { value: 9, feedback: 'That is the component $r^2$ itself, not its derivative. With zero coefficients, $(\nabla^{\mathrm{P}}_{\partial y_1}\flat(\mathcal{Y}))_2 = \partial_r(r^2) = 2r$.' }
    hint: With all coefficients zero, the covector rule is $(\nabla_{\partial y_1}\mathsf{X})_i = \partial_r\mathtt{x}_i$.
    explanation: |
      $\partial_r(r^2) = 2r = 6$, against $0$ on the other side. The mismatch is $(\nabla^{\mathrm{P}}_{\partial y_1}g)_{22}\,y^2 = 2r\cdot1 = 6$, as the general difference formula predicts.

  - type: numeric
    id: p3-lc-numeric
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: Where ∇ᴸᶜ agrees
    prompt: |
      Euclidean plane, polar chart $(r,\theta)$, $g = \mathrm{diag}(1,r^2)$, Levi-Civita Christoffel symbols $\Gamma^1_{22} = -r$, $\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r$. Take $\mathcal{Y} = \partial y_2$ (polar components $(0,1)$), so $\nabla^{\mathrm{LC}}_{\partial y_1}\mathcal{Y} = \Gamma^i_{21}\,\partial y_i = \tfrac1r\,\partial y_2$. Compute $\flat\big(\nabla^{\mathrm{LC}}_{\partial y_1}\mathcal{Y}\big)_2$ at $r = 3$.
    answer: 3
    tolerance: 0.001
    wrong:
      - { value: 0.33333, feedback: 'That is the vector component $\tfrac1r$ before lowering. Lowering multiplies by $g_{22} = r^2$: $\tfrac1r\cdot r^2 = r$.' }
      - { value: 6, feedback: 'That is $\partial_r(r^2)$, the derivative of the lowered components without the connection term. The covector rule subtracts $\Gamma^2_{21}\cdot r^2 = r$, and either way the answer is $r$.' }
    hint: Lower with $g_{22} = r^2$.
    explanation: |
      $\flat(\tfrac1r\partial y_2)_2 = \tfrac1r\cdot r^2 = r = 3$. Lowering first and then differentiating, the covector rule gives
      $$\partial_r(r^2) - \Gamma^2_{21}\,r^2 = 2r - r = r,$$
      also $3$. ✓ Same number both ways, because $\nabla^{\mathrm{LC}}g = 0$.

  - type: text
    id: p3-energy
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: Energy versus length
    body: |
      Second half. Recall the **energy Lagrangian** and the length Lagrangian, in a chart with $d$ slots:
      $$\mathcal{E}_\mathscr{X}(\alpha;\beta) := \tfrac12\,g_{ij}\,\beta^i\beta^j,$$
      $$\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{\text{ᛇ}_\gamma\,g_{ij}\,\beta^i\beta^j}.$$
      The Euler-Lagrange equations of $\mathcal{E}_\mathscr{X}$,
      $$\frac{d}{d\lambda}\big[\partial_{d+m}\mathcal{E}_\mathscr{X}\big] = \partial_m\mathcal{E}_\mathscr{X},$$
      are exactly (G), with **no** assumption on the speed; those of $\mathcal{L}_\mathscr{X}$ give (S).

      **Claim:** every solution of the energy equations automatically has constant $g(v_\gamma,v_\gamma)$, hence constant speed. The length equations promise nothing of the kind. The proof rests on one property of how each Lagrangian scales with the velocity $\beta$.

  - type: mcq
    id: p3-homog
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: Feeding the velocity back
    prompt: |
      The energy Lagrangian $\mathcal{E}_\mathscr{X}(\alpha;\beta) = \tfrac12g_{ij}\beta^i\beta^j$ has velocity-slot derivatives $\partial_{d+m}\mathcal{E}_\mathscr{X} = g_{mj}\beta^j$. What is $\beta^m\,\partial_{d+m}\mathcal{E}_\mathscr{X}$ (sum over $m$)?
    options:
      - text: '$2\,\mathcal{E}_\mathscr{X}$'
        correct: true
      - text: '$\mathcal{E}_\mathscr{X}$'
        feedback: |
          $\beta^mg_{mj}\beta^j = g_{ij}\beta^i\beta^j$, which is twice $\tfrac12g_{ij}\beta^i\beta^j$. A function quadratic in $\beta$ returns twice itself; only a function of degree one in $\beta$, like the length Lagrangian, returns itself.
      - text: '$0$'
        feedback: |
          $\beta^mg_{mj}\beta^j = g(\beta,\beta)$ is the squared length of the velocity, not zero in general.
      - text: '$\tfrac12\mathcal{E}_\mathscr{X}$'
        feedback: |
          $\beta^mg_{mj}\beta^j = g_{ij}\beta^i\beta^j = 2\cdot\tfrac12g_{ij}\beta^i\beta^j$: the factor goes the other way.
    explanation: |
      $\beta^m\,g_{mj}\beta^j = 2\mathcal{E}_\mathscr{X}$. This is Euler's rule for homogeneous functions: if $f(c\beta) = c^nf(\beta)$, then $\beta^m\partial_mf = nf$. The energy has degree $n = 2$; the length Lagrangian $\sqrt{\ldots}$ has degree $n = 1$, so $\beta^m\partial_{d+m}\mathcal{L}_\mathscr{X} = \mathcal{L}_\mathscr{X}$.

  - type: order
    id: p3-constant-speed
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: Energy solutions keep their speed
    prompt: |
      Let $\gamma$ solve the Euler-Lagrange equations $\frac{d}{d\lambda}[\partial_{d+m}\mathcal{E}_\mathscr{X}] = \partial_m\mathcal{E}_\mathscr{X}$ of the energy Lagrangian $\mathcal{E}_\mathscr{X} = \tfrac12g_{ij}\beta^i\beta^j$, all evaluated on $(\gamma^i;\dot\gamma^i)$. Prove that $\mathcal{E}_\mathscr{X}$ is constant along $\gamma$. Put the steps in order.
    steps:
      - 'Chain rule: $\frac{d}{d\lambda}\mathcal{E}_\mathscr{X} = \partial_m\mathcal{E}_\mathscr{X}\,\dot\gamma^m + \partial_{d+m}\mathcal{E}_\mathscr{X}\,\ddot\gamma^m$.'
      - 'Replace $\partial_m\mathcal{E}_\mathscr{X}$ by $\frac{d}{d\lambda}[\partial_{d+m}\mathcal{E}_\mathscr{X}]$, using the equations.'
      - 'Leibniz backwards: the sum is $\frac{d}{d\lambda}\big(\partial_{d+m}\mathcal{E}_\mathscr{X}\,\dot\gamma^m\big)$.'
      - 'Degree two: $\dot\gamma^m\partial_{d+m}\mathcal{E}_\mathscr{X} = 2\mathcal{E}_\mathscr{X}$, so $\frac{d}{d\lambda}\mathcal{E}_\mathscr{X} = 2\frac{d}{d\lambda}\mathcal{E}_\mathscr{X}$.'
      - 'Hence $\frac{d}{d\lambda}\mathcal{E}_\mathscr{X} = 0$: $g(v_\gamma,v_\gamma)$ is constant along $\gamma$.'
    hint: Start with the chain rule, use the equations once, recognize a product rule, then feed the velocity back.
    explanation: |
      The equations turn $\frac{d}{d\lambda}\mathcal{E}$ into $\frac{d}{d\lambda}(2\mathcal{E})$, and only $0$ equals its own double. So $g(v_\gamma,v_\gamma) = 2\mathcal{E}_\mathscr{X}$ is constant: the speed $s_\gamma = \sqrt{\text{ᛇ}_\gamma g(v_\gamma,v_\gamma)}$ is constant, and the sign never changes along the curve.

  - type: mcq
    id: p3-length-tautology
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: The same proof for the length
    prompt: |
      For the energy Lagrangian $\mathcal{E}_\mathscr{X} = \tfrac12g_{ij}\beta^i\beta^j$ (degree $2$ in $\beta$, so $\beta^m\partial_{d+m}\mathcal{E}_\mathscr{X} = 2\mathcal{E}_\mathscr{X}$), the chain rule, the Euler-Lagrange equations and Leibniz give $\frac{d}{d\lambda}\mathcal{E} = \frac{d}{d\lambda}(2\mathcal{E})$, so $\mathcal{E}$ is constant on solutions. Run the same steps for the length Lagrangian $\mathcal{L}_\mathscr{X} = \sqrt{\text{ᛇ}_\gamma g_{ij}\beta^i\beta^j}$, of degree $1$. What do you get?
    options:
      - text: '$\frac{d}{d\lambda}\mathcal{L} = \frac{d}{d\lambda}\mathcal{L}$: true for every curve, so no condition on the speed'
        correct: true
      - text: '$\frac{d}{d\lambda}\mathcal{L} = 0$: length solutions have constant speed too'
        feedback: |
          With degree $1$, $\dot\gamma^m\partial_{d+m}\mathcal{L}_\mathscr{X} = \mathcal{L}_\mathscr{X}$ (not $2\mathcal{L}_\mathscr{X}$), and the argument closes on itself. It cannot fix the speed: the length does not depend on the parametrization, so any reparametrization of a solution is again a solution.
      - text: '$\frac{d}{d\lambda}\mathcal{L} = 2\frac{d}{d\lambda}\mathcal{L}$'
        feedback: |
          The factor $2$ came from the degree of the energy. The length Lagrangian has degree $1$: $\mathcal{L}_\mathscr{X}(\alpha;c\beta) = |c|\,\mathcal{L}_\mathscr{X}(\alpha;\beta)$, so $\beta^m\partial_{d+m}\mathcal{L}_\mathscr{X} = \mathcal{L}_\mathscr{X}$.
    explanation: |
      Degree $1$ makes the argument a tautology. That is the reparametrization freedom seen from the equations: the $d$ length equations leave the speed profile free, which is why (S) has the extra term $(\dot s_\gamma/s_\gamma)\dot\gamma^k$.

  - type: numeric
    id: p3-curve
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: A curve that slows down
    prompt: |
      Upper half-plane, chart $(u,w)$, metric $g_{ij} = \delta_{ij}/w^2$. Its Christoffel symbols with upper index $2$ are $\Gamma^2_{11} = \tfrac1w$, $\Gamma^2_{22} = -\tfrac1w$, $\Gamma^2_{12} = 0$. Run up the vertical line $u = 0$ as $w(\lambda) = \lambda$, $\lambda\in[1,2]$. Compute the second component of (G) at $\lambda = 2$:
      $$\ddot w + \Gamma^2_{ij}\,\dot\gamma^i\dot\gamma^j.$$
    answer: -0.5
    tolerance: 0.001
    answerText: '-1/2'
    wrong:
      - { value: 0, feedback: 'The curve is straight in the chart and $\ddot w = 0$, but the $\Gamma$ term survives: $\Gamma^2_{22}\dot w^2 = -\tfrac1w\cdot1$. Uniform motion in the chart is not uniform for the metric.' }
      - { value: 0.5, feedback: 'Sign: $\Gamma^2_{22} = \tfrac12(g^{-1})^{22}\partial_wg_{22} = \tfrac12w^2\cdot(-\tfrac{2}{w^3}) = -\tfrac1w$.' }
    hint: '$\dot u = 0$, $\dot w = 1$, $\ddot w = 0$; only $\Gamma^2_{22}$ contributes.'
    explanation: |
      $0 + \Gamma^2_{22}\cdot1^2 = -\tfrac1w = -\tfrac12$ at $\lambda = 2$. So $w = \lambda$ fails (G), hence fails the energy equations. The first component, $\ddot u + 2\Gamma^1_{12}\dot u\dot w$, is $0$, since $\dot u = 0$.

  - type: mcq
    id: p3-curve-verdict
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: Geodesic or not?
    prompt: |
      Upper half-plane, metric $g_{ij} = \delta_{ij}/w^2$. The curve $u = 0$, $w(\lambda) = \lambda$ ($\lambda\in[1,2]$) has speed $s_\gamma = \dot w/w = 1/\lambda$, and the second component of (G), $\ddot w + \Gamma^2_{ij}\dot\gamma^i\dot\gamma^j$, equals $-1/\lambda$ (the first is $0$). Which statement is right?
    options:
      - text: 'It solves (S) and the length equations but not the energy equations; it had to fail the latter, since $\mathcal{E} = \tfrac{1}{2\lambda^2}$ is not constant'
        correct: true
      - text: 'It is not a geodesic at all: it fails (G)'
        feedback: |
          (G) is the constant-speed form. (S) allows any speed: its right-hand side is $(\dot s_\gamma/s_\gamma)\dot w = (-\tfrac1\lambda)\cdot1 = -\tfrac1\lambda$, exactly the left-hand side. The image, the vertical line, is a geodesic; only the parametrization is not uniform.
      - text: 'It solves every one of the equations, since it runs along a straight line'
        feedback: |
          Straight in the chart, yes, but its speed $1/\lambda$ falls, and the energy equations force constant speed. (G) fails with residual $-\tfrac1\lambda$.
      - text: 'It solves the energy equations but not the length equations'
        feedback: |
          Backwards. The energy equations are (G), which fails here. The length equations are (S), which holds.
    explanation: |
      $\dot s_\gamma/s_\gamma = -\tfrac1\lambda$, so (S) holds: the vertical line is a geodesic, run at a falling speed. The energy $\mathcal{E}_\mathscr{X} = \tfrac12\dot w^2/w^2 = \tfrac{1}{2\lambda^2}$ is not constant, so by the constant-speed theorem the energy equations had to fail. Reparametrized at constant speed, $w = e^\mu$: then $\ddot w - \dot w^2/w = e^\mu - e^\mu = 0$, and (G) holds.

  - type: text
    id: p3-shows
    tag: Problem 3 · Lowering through ∇, energy vs length
    title: What it shows
    body: |
      - For any connection, lowering and differentiating differ by the derivative of the metric:
      $$\begin{aligned}&\big(\nabla_{\partial x_k}\flat(\mathcal{Y})\big)_i - g_{im}(\nabla_{\partial x_k}\mathcal{Y})^m\\ &\quad= (\nabla_{\partial x_k}g)_{im}\,y^m.\end{aligned}$$
      They commute exactly for metric-compatible connections: $\nabla^{\mathrm{LC}}$ (and $\nabla^{\mathrm{W}}$), not $\nabla^{\mathrm{P}}$ ($6$ against $0$ at $r = 3$). This is why physicists move indices freely inside $\nabla^{\mathrm{LC}}$.
      - The energy Lagrangian has degree $2$ in the velocity, so its solutions keep $g(v_\gamma,v_\gamma)$ constant: (G) builds in the constant speed. The length has degree $1$, which leaves the speed free: (S).
      - The energy also reaches the **null geodesics**, where $g(v_\gamma,v_\gamma) = 0$ and the square root of the length Lagrangian cannot be differentiated. The price: $\int\mathcal{E}$, unlike the length, depends on the parametrization.

  # ---------------------------------------------------------------- Problem 4
  - type: text
    id: p4-setup
    tag: Problem 4 · Minimum or saddle
    title: Guess first
    body: |
      Recall the variations of a curve $\gamma$: a **shape** $\text{ᛉ}$ (components $\text{ᛉ}^i(\lambda)$ in a chart, vanishing at both ends) and a deformation knob $\text{ᛊ}$ give the varied curves $\gamma_{\text{ᛊ}}$, with chart components $\gamma^i + \text{ᛊ}\,\text{ᛉ}^i$. A geodesic is a curve whose length is **stationary**: for every shape,
      $$\frac{d}{d\text{ᛊ}}L[\gamma_{\text{ᛊ}}]\Big|_{\text{ᛊ}=0} = 0.$$
      For an ordinary function, $f'(0) = 0$ allows a minimum, a maximum or a saddle; the sign of the next term decides. Here, expanding in $\text{ᛊ}$,
      $$L[\gamma_{\text{ᛊ}}] = L[\gamma] + C\,\text{ᛊ}^2 + O(\text{ᛊ}^3),$$
      and the sign of the number $C$ (the **second variation**, up to a factor $\tfrac12$) decides for that shape.

      **Before computing, guess** the sign of $C$ in three cases: a geodesic of the hyperbolic half-plane, the worldline of a clock at rest in Minkowski spacetime (with proper time instead of length), and an equator arc of length $\tfrac{3\pi}{2}$ on the unit sphere. "Geodesics are shortest" says $C > 0$ every time. Keep your guesses.

  - type: mcq
    id: p4-velocity
    tag: Problem 4 · Minimum or saddle
    title: Push the vertical geodesic sideways
    prompt: |
      Upper half-plane, chart $(u,w)$ with $w > 0$, metric $g_{ij} = \delta_{ij}/w^2$. The curve $\gamma$: $u = 0$, $w = e^\mu$, $\mu\in[0,1]$, has speed $\dot w/w = 1$ and is a geodesic. Push it sideways with the shape $\text{ᛉ} = (h,0)$, where $h(0) = h(1) = 0$:
      $$u = \text{ᛊ}\,h(\mu),\qquad w = e^\mu.$$
      What is $g(v,v)$ for the velocity $v$ of the varied curve (prime $= d/d\mu$)?
    options:
      - text: '$1 + \text{ᛊ}^2\,h''^2\,e^{-2\mu}$'
        correct: true
      - text: '$1 + \text{ᛊ}^2\,h''^2$'
        feedback: |
          The sideways part is also divided by $w^2$: the metric is $(\dot u^2 + \dot w^2)/w^2$, and $\dot u^2/w^2 = \text{ᛊ}^2h'^2/e^{2\mu}$. The same push costs less length high up, where $w$ is large.
      - text: '$1 + 2\text{ᛊ}\,h''\,e^{-\mu} + \text{ᛊ}^2\,h''^2\,e^{-2\mu}$'
        feedback: |
          A cross term would need an off-diagonal metric component $g_{12}$, and here $g_{12} = 0$. The velocity components $(\text{ᛊ}h', e^\mu)$ enter only squared, one at a time.
      - text: '$(1 + \text{ᛊ}^2\,h''^2)\,e^{-2\mu}$'
        feedback: |
          The vertical part is $\dot w^2/w^2 = e^{2\mu}/e^{2\mu} = 1$, not $e^{-2\mu}$: only the sideways part $\text{ᛊ}^2h'^2$ is divided by $e^{2\mu}$ without being cancelled.
    explanation: |
      Velocity components $(\dot u,\dot w) = (\text{ᛊ}h', e^\mu)$ at height $w = e^\mu$:
      $$g(v,v) = \frac{\text{ᛊ}^2h'^2 + e^{2\mu}}{e^{2\mu}} = 1 + \text{ᛊ}^2h'^2e^{-2\mu}.$$
      The metric depends on $w$ only, and a sideways push leaves $w$ unchanged, so no other term appears.

  - type: build
    id: p4-build
    tag: Problem 4 · Minimum or saddle
    title: The coefficient of ᛊ²
    prompt: |
      Upper half-plane, metric $\delta_{ij}/w^2$. The vertical geodesic $u = 0$, $w = e^\mu$ ($\mu\in[0,1]$, length $1$), pushed sideways to $u = \text{ᛊ}h(\mu)$ with $h(0) = h(1) = 0$, has length
      $$L(\text{ᛊ}) = \int_0^1\sqrt{1 + \text{ᛊ}^2h'^2e^{-2\mu}}\,d\mu.$$
      Use $\sqrt{1+x} = 1 + \tfrac12x + O(x^2)$ and build $C$ in $L(\text{ᛊ}) = 1 + C\,\text{ᛊ}^2 + O(\text{ᛊ}^4)$.
    prefix: 'C ='
    tiles: ['\tfrac12', '2', '\int_0^1', '(h^{\prime})^2', 'h^2', 'e^{-2\mu}', 'e^{2\mu}']
    answers:
      - ['\tfrac12', '\int_0^1', '(h^{\prime})^2', 'e^{-2\mu}']
      - ['\tfrac12', '\int_0^1', 'e^{-2\mu}', '(h^{\prime})^2']
      - ['\int_0^1', '\tfrac12', '(h^{\prime})^2', 'e^{-2\mu}']
      - ['\int_0^1', '\tfrac12', 'e^{-2\mu}', '(h^{\prime})^2']
    wrong:
      - { answer: ['\int_0^1', '(h^{\prime})^2', 'e^{-2\mu}'], feedback: 'The square root halves the small term: $\sqrt{1+x}\approx1+\tfrac12x$. Without the $\tfrac12$ you have the coefficient of $L^2$, not of $L$.' }
      - { answer: ['\tfrac12', '\int_0^1', 'h^2', 'e^{-2\mu}'], feedback: 'The length sees the velocity, so the shape enters through its derivative $h^{\prime}$. The metric does not depend on $u$, so the value $h$ of the push never appears.' }
    hint: 'Here $x = \text{ᛊ}^2h^{\prime2}e^{-2\mu}$; integrate $1 + \tfrac12x$ over $[0,1]$.'
    explanation: |
      $$C = \tfrac12\int_0^1h'^2\,e^{-2\mu}\,d\mu.$$
      There is no $\text{ᛊ}$ term at all: the first variation vanishes, as it must on a geodesic. The integrand is a square times a positive function, so $C > 0$ for every nonzero shape of this kind.

  - type: numeric
    id: p4-number
    tag: Problem 4 · Minimum or saddle
    title: A shape by hand
    prompt: |
      Upper half-plane, metric $\delta_{ij}/w^2$, vertical geodesic $u = 0$, $w = e^\mu$, $\mu\in[0,1]$, pushed sideways to $u = \text{ᛊ}h(\mu)$. Its length is $1 + C\,\text{ᛊ}^2 + O(\text{ᛊ}^4)$ with
      $$C = \tfrac12\int_0^1h'^2e^{-2\mu}\,d\mu.$$
      Take $h(\mu) = \mu(1-\mu)\,e^\mu$, which vanishes at $\mu = 0, 1$. Compute $C$.
    answer: 0.183333
    tolerance: 0.001
    answerText: '11/60'
    wrong:
      - { value: 0.366667, feedback: 'That is $\int_0^1(1-\mu-\mu^2)^2d\mu = \tfrac{11}{30}$; the square root contributes the factor $\tfrac12$.' }
      - { value: 0.166667, feedback: 'Recheck the product rule: $h^{\prime} = e^\mu(1-2\mu) + e^\mu(\mu-\mu^2) = e^\mu(1-\mu-\mu^2)$, with a $-\mu^2$ term.' }
    hint: '$h^{\prime} = e^\mu(1-\mu-\mu^2)$, so $h^{\prime2}e^{-2\mu} = (1-\mu-\mu^2)^2 = 1-2\mu-\mu^2+2\mu^3+\mu^4$.'
    explanation: |
      The factor $e^\mu$ in $h$ was chosen to cancel $e^{-2\mu}$:
      $$\begin{aligned}C &= \tfrac12\int_0^1(1-\mu-\mu^2)^2\,d\mu\\ &= \tfrac12\big(1 - 1 - \tfrac13 + \tfrac12 + \tfrac15\big)\\ &= \tfrac12\cdot\tfrac{11}{30} = \tfrac{11}{60}.\end{aligned}$$
      Positive: pushing the geodesic sideways makes it longer.

  - type: mcq
    id: p4-exact
    tag: Problem 4 · Minimum or saddle
    title: How much does the sign say?
    prompt: |
      Upper half-plane, metric $\delta_{ij}/w^2$. The vertical geodesic $u = 0$, $w = e^\mu$ ($\mu\in[0,1]$), pushed sideways to $u = \text{ᛊ}h(\mu)$ with $h(0) = h(1) = 0$, has length
      $$L(\text{ᛊ}) = \int_0^1\sqrt{1 + \text{ᛊ}^2h'^2e^{-2\mu}}\,d\mu.$$
      Which conclusion is right?
    options:
      - text: 'Every nonzero sideways push makes the curve longer, for every $\text{ᛊ}$, not only small ones'
        correct: true
      - text: '$C > 0$ for $h = \mu(1-\mu)e^\mu$ only; another shape could give $C < 0$'
        feedback: |
          The integrand of $C = \tfrac12\int_0^1h'^2e^{-2\mu}d\mu$ is never negative, whatever $h$ is. The sign was decided before choosing a shape.
      - text: 'Some nonzero sideways push keeps the length exactly $1$'
        feedback: |
          Length $1$ needs $h'^2e^{-2\mu} = 0$ everywhere, so $h' = 0$: $h$ is constant, and $h(0) = 0$ makes it zero. No nonzero push does it.
      - text: 'This proves the vertical segment is shorter than every other curve between its endpoints'
        feedback: |
          Only sideways shapes $(h,0)$ were tested. A general curve can also move up and down, $(h,k)$, and that family needs its own computation. Passing one family of tests is not passing all of them.
    explanation: |
      $\sqrt{1+x}\ge1$ for $x\ge0$, with equality only at $x = 0$, so $L(\text{ᛊ})\ge1$ for every $\text{ᛊ}$, with equality only when $h' = 0$, that is $h = 0$. For these shapes the geodesic is a strict minimum, not only to second order.

  - type: numeric
    id: p4-minkowski
    tag: Problem 4 · Minimum or saddle
    title: A clock at rest, wiggled
    prompt: |
      Minkowski plane, points $(t,a)$, $\eta_{ij} = \mathrm{diag}(-1,1)$. The clock at rest $(\lambda,0)$, $\lambda\in[0,1]$, is a geodesic with proper time $1$. Wiggle it: $(\lambda,\ \text{ᛊ}h(\lambda))$ with $h = \lambda(1-\lambda)$. Then $\eta(v,v) = -1 + \text{ᛊ}^2h'^2 < 0$ for $|\text{ᛊ}| < 1$ (timelike, sign $-1$), and the proper time is
      $$\tau(\text{ᛊ}) = \int_0^1\sqrt{1 - \text{ᛊ}^2h'^2}\,d\lambda.$$
      Write $\tau(\text{ᛊ}) = 1 + C\,\text{ᛊ}^2 + O(\text{ᛊ}^4)$. Compute $C$.
    answer: -0.166667
    tolerance: 0.001
    answerText: '-1/6'
    wrong:
      - { value: 0.166667, feedback: 'The timelike sign flips the sign of $\eta(v,v)$ under the root: $\sqrt{-\eta(v,v)} = \sqrt{1-\text{ᛊ}^2h^{\prime2}}$. The space part now lowers the result.' }
      - { value: -0.333333, feedback: '$\int_0^1(1-2\lambda)^2d\lambda = \tfrac13$ is right, but the square root halves it: $\sqrt{1-x}\approx1-\tfrac12x$.' }
    hint: '$h^{\prime} = 1-2\lambda$, $\int_0^1(1-2\lambda)^2d\lambda = \tfrac13$, and $\sqrt{1-x} = 1-\tfrac12x+O(x^2)$.'
    explanation: |
      $$C = -\tfrac12\int_0^1(1-2\lambda)^2\,d\lambda = -\tfrac12\cdot\tfrac13 = -\tfrac16.$$
      Negative for this shape, and for every shape: the integrand $h'^2$ is never negative and enters with a minus sign.

  - type: mcq
    id: p4-minkowski-meaning
    tag: Problem 4 · Minimum or saddle
    title: Which extreme?
    prompt: |
      Minkowski plane, $\eta = \mathrm{diag}(-1,1)$. A clock at rest $(\lambda,0)$ on $[0,1]$ is wiggled to $(\lambda,\text{ᛊ}h(\lambda))$, $h$ vanishing at both ends. Its proper time is
      $$\tau(\text{ᛊ}) = 1 - \tfrac12\text{ᛊ}^2\int_0^1h'^2\,d\lambda + O(\text{ᛊ}^4).$$
      What does this say about the inertial worldline?
    options:
      - text: 'Against these wiggles it is a maximum of proper time: any traveller who moves and returns ages less'
        correct: true
      - text: 'It is a minimum, as for lengths in the plane'
        feedback: |
          The coefficient of $\text{ᛊ}^2$ is negative. In Euclidean signature moving sideways adds length; in Lorentzian signature the spatial part enters $-\eta(v,v)$ with a minus sign and removes proper time.
      - text: 'Nothing: with an indefinite metric the second variation has no meaning'
        feedback: |
          The sign of $\eta(v,v)$ is constant along each varied curve (timelike for small $\text{ᛊ}$), so $\tau$ is an ordinary function of $\text{ᛊ}$, and its expansion means what it always means.
      - text: 'A saddle: some wiggles add proper time'
        feedback: |
          For these spatial wiggles every nonzero $h$ gives $-\tfrac12\int h'^2 < 0$. None adds proper time.
    explanation: |
      This is the twin paradox in one line: the twin who stays inertial ages most. Same calculus as the half-plane, opposite sign, because the signature puts a minus in front of the spatial velocity.

  - type: mcq
    id: p4-sphere-expand
    tag: Problem 4 · Minimum or saddle
    title: Tilt the equator
    prompt: |
      Unit sphere, chart $(\vartheta,\varphi)$ (polar angle, longitude), metric $g = \mathrm{diag}(1,\sin^2\vartheta)$. An equator arc at unit speed is $\vartheta = \tfrac\pi2$, $\varphi = \varphi_0 + \lambda$, $\lambda\in[0,\ell]$, a geodesic. Tilt it with the shape $(h,0)$, $h(0) = h(\ell) = 0$:
      $$\vartheta = \tfrac\pi2 + \text{ᛊ}h(\lambda),\qquad\varphi = \varphi_0 + \lambda.$$
      What is $g(v,v)$ for the varied curve, up to $O(\text{ᛊ}^4)$?
    options:
      - text: '$1 + \text{ᛊ}^2\big(h''^2 - h^2\big)$'
        correct: true
      - text: '$1 + \text{ᛊ}^2h''^2$'
        feedback: |
          The longitude part also changes: $\dot\varphi^2\sin^2\vartheta$ with $\sin(\tfrac\pi2+x) = \cos x$, so it is $\cos^2(\text{ᛊ}h) = 1 - \text{ᛊ}^2h^2 + O(\text{ᛊ}^4)$. Off the equator the parallels are shorter.
      - text: '$1 + \text{ᛊ}^2\big(h''^2 + h^2\big)$'
        feedback: |
          Sign: $\cos^2x = 1 - x^2 + O(x^4)$. Moving off the equator brings you onto a shorter parallel, which lowers the longitude part.
      - text: '$1 + 2\text{ᛊ}h + O(\text{ᛊ}^2)$'
        feedback: |
          No first-order term: $\sin^2(\tfrac\pi2 + x) = \cos^2x$ is even in $x$, since the equator is the longest parallel. That is the first variation vanishing pointwise.
    explanation: |
      Velocity components $(\text{ᛊ}h', 1)$:
      $$\begin{aligned}g(v,v) &= \text{ᛊ}^2h'^2 + \cos^2(\text{ᛊ}h)\\ &= 1 + \text{ᛊ}^2(h'^2 - h^2) + O(\text{ᛊ}^4).\end{aligned}$$
      With $\sqrt{1+x}\approx1+\tfrac12x$, the length is $\ell + C\text{ᛊ}^2 + O(\text{ᛊ}^4)$ with
      $$C = \tfrac12\int_0^\ell\big(h'^2 - h^2\big)\,d\lambda.$$
      Now two terms compete: the derivative pushes $C$ up, the shorter parallels push it down.

  - type: numeric
    id: p4-sphere-short
    tag: Problem 4 · Minimum or saddle
    title: A short arc
    prompt: |
      Unit sphere, $g = \mathrm{diag}(1,\sin^2\vartheta)$. An equator arc of length $\ell$, tilted to $\vartheta = \tfrac\pi2 + \text{ᛊ}h(\lambda)$ ($\lambda\in[0,\ell]$, $h(0) = h(\ell) = 0$), has length $\ell + C\,\text{ᛊ}^2 + O(\text{ᛊ}^4)$ with
      $$C = \tfrac12\int_0^\ell\big(h'^2 - h^2\big)\,d\lambda.$$
      Take $\ell = \tfrac\pi2$ and the single bump $h = \sin(\pi\lambda/\ell) = \sin2\lambda$. Compute $C$.
    answer: 1.178097
    tolerance: 0.002
    answerText: '3π/8 ≈ 1.178'
    wrong:
      - { value: 2.356194, feedback: 'You have $\int_0^\ell(h^{\prime2}-h^2)d\lambda = \tfrac{3\pi}{4}$; $C$ carries the factor $\tfrac12$ from the square root.' }
      - { value: 0.392699, feedback: 'The factor $2$ in $h^{\prime} = 2\cos2\lambda$ is squared: $h^{\prime2} = 4\cos^22\lambda$, not $2\cos^22\lambda$.' }
    hint: 'On $[0,\tfrac\pi2]$, $\int\sin^22\lambda\,d\lambda = \int\cos^22\lambda\,d\lambda = \tfrac\pi4$ (half the length).'
    explanation: |
      $$\begin{aligned}C &= \tfrac12\Big(4\cdot\tfrac\pi4 - \tfrac\pi4\Big)\\ &= \tfrac{3\pi}{8}\approx1.178 > 0.\end{aligned}$$
      In general, for $h = \sin(\pi\lambda/\ell)$, both integrals of $\sin^2$ and $\cos^2$ are $\ell/2$, so
      $$C(\ell) = \frac\ell4\Big(\frac{\pi^2}{\ell^2} - 1\Big).$$

  - type: numeric
    id: p4-sphere-long
    tag: Problem 4 · Minimum or saddle
    title: A long arc
    prompt: |
      Unit sphere, $g = \mathrm{diag}(1,\sin^2\vartheta)$, longitude $\varphi\in(-\pi,\pi)$. The equator arc $\varphi = -\tfrac{3\pi}{4} + \lambda$, $\lambda\in[0,\tfrac{3\pi}{2}]$ (from $-\tfrac{3\pi}4$ to $\tfrac{3\pi}4$ through $\varphi = 0$) solves the geodesic equation. Tilted to $\vartheta = \tfrac\pi2 + \text{ᛊ}h$ with the bump $h = \sin(\pi\lambda/\ell)$, an arc of length $\ell$ has length $\ell + C\text{ᛊ}^2 + O(\text{ᛊ}^4)$ with
      $$C(\ell) = \frac\ell4\Big(\frac{\pi^2}{\ell^2} - 1\Big).$$
      Compute $C$ for this arc.
    answer: -0.654498
    tolerance: 0.002
    answerText: '-5π/24 ≈ -0.654'
    wrong:
      - { value: 0.654498, feedback: 'With $\ell = \tfrac{3\pi}{2}$, $\pi^2/\ell^2 = \tfrac49 < 1$: the bracket is negative.' }
      - { value: -1.308997, feedback: 'Check the prefactor: $\ell/4 = \tfrac{3\pi}{8}$, not $\tfrac{3\pi}{4}$.' }
    hint: '$\pi^2/\ell^2 = \tfrac49$ and $\ell/4 = \tfrac{3\pi}{8}$.'
    explanation: |
      $$C = \tfrac{3\pi}{8}\Big(\tfrac49 - 1\Big) = -\tfrac{5\pi}{24}\approx-0.654.$$
      Negative: tilting the long arc slightly toward a pole **shortens** it. The geodesic is not a minimum. It is not a maximum either: the wiggly shape $h = \sin(3\pi\lambda/\ell)$ has $\pi^2/\ell^2$ replaced by $9\pi^2/\ell^2 = 4$, and $C > 0$. A saddle.

  - type: numeric
    id: p4-conjugate-number
    tag: Problem 4 · Minimum or saddle
    title: Where the sign flips
    prompt: |
      Unit sphere. An equator arc of length $\ell$ tilted by the bump $h = \sin(\pi\lambda/\ell)$ toward a pole has length $\ell + C(\ell)\,\text{ᛊ}^2 + O(\text{ᛊ}^4)$ with
      $$C(\ell) = \frac\ell4\Big(\frac{\pi^2}{\ell^2} - 1\Big).$$
      At which arc length $\ell > 0$ does $C$ change sign?
    answer: 3.141593
    tolerance: 0.005
    answerText: 'π'
    wrong:
      - { value: 6.283185, feedback: '$2\pi$ is the full equator. The bracket $\pi^2/\ell^2 - 1$ vanishes earlier, at $\ell^2 = \pi^2$.' }
      - { value: 1.570796, feedback: 'At $\ell = \tfrac\pi2$, $\pi^2/\ell^2 = 4$ and $C = \tfrac{3\pi}{8} > 0$. The bracket vanishes at $\ell = \pi$.' }
    hint: 'Set the bracket to zero.'
    explanation: |
      $C(\pi) = 0$: at length $\pi$ the tilt $h = \sin\lambda$ costs nothing to second order. Geometrically, the tilted curves are, to first order, the great circles through the starting point, and they all meet again at length $\pi$, at the **antipode** of the start. That point is called the first **conjugate point**.

  - type: mcq
    id: p4-trap
    tag: Problem 4 · Minimum or saddle
    title: Stationary means shortest?
    prompt: |
      Unit sphere. The equator arc from longitude $-\tfrac{3\pi}{4}$ eastward to $\tfrac{3\pi}{4}$ (length $\tfrac{3\pi}{2}$) solves the geodesic equation. Tilting it by $h = \sin(2\lambda/3)$ gives the length $\tfrac{3\pi}{2} - \tfrac{5\pi}{24}\text{ᛊ}^2 + O(\text{ᛊ}^4)$. Which statement is right?
    options:
      - text: 'It is a geodesic but not the shortest curve: it stops being shortest once it reaches the antipode of its start, the first conjugate point, at length $\pi$'
        correct: true
      - text: 'It is the shortest curve between its endpoints, since it solves the geodesic equation'
        feedback: |
          Solving the equation means stationary, not shortest. The other way round the equator is $2\pi - \tfrac{3\pi}2 = \tfrac\pi2$, and even the nearby tilted curves are shorter, since their $\text{ᛊ}^2$ coefficient is $-\tfrac{5\pi}{24}$.
      - text: 'It stops being shortest only somewhere beyond the antipode, after the tilt coefficient has become negative'
        feedback: |
          The coefficient $C(\ell) = \tfrac\ell4(\pi^2/\ell^2 - 1)$ is zero exactly at $\ell = \pi$, the antipode, and negative for every $\ell > \pi$. The conjugate point is the antipode itself, not a point past it.
      - text: 'It is the longest curve between its endpoints'
        feedback: |
          No curve is longest: wiggles add length without bound. The wiggle $h = \sin(2\lambda)$ (three bumps on this arc) gives a positive coefficient, so the arc is a saddle, not a maximum.
    explanation: |
      Stationary length is not shortest length. An arc of a great circle is a local minimum up to length $\pi$; once it passes the antipode of its start, where all great circles from the start meet again, some nearby curve is shorter. Here the shorter route the other way is $\tfrac\pi2$, against $\tfrac{3\pi}{2}$.

  - type: text
    id: p4-shows
    tag: Problem 4 · Minimum or saddle
    title: What it shows
    body: |
      - On a geodesic the first variation vanishes; the sign of the $\text{ᛊ}^2$ coefficient decides, shape by shape, between longer and shorter.
      - Half-plane, sideways push $u = \text{ᛊ}h$: $C = \tfrac12\int h'^2e^{-2\mu}d\mu > 0$ ($\tfrac{11}{60}$ for $h = \mu(1-\mu)e^\mu$), a minimum.
      - Minkowski, clock at rest: $C = -\tfrac12\int h'^2d\lambda < 0$ ($-\tfrac16$), a maximum of proper time: the twin paradox.
      - Sphere, equator arc of length $\ell$:
      $$C = \tfrac12\int_0^\ell(h'^2 - h^2)\,d\lambda,$$
      positive for $\ell < \pi$ ($\tfrac{3\pi}8$ at $\ell = \tfrac\pi2$), negative beyond the antipode ($-\tfrac{5\pi}{24}$ at $\tfrac{3\pi}{2}$). The $-h^2$ comes from curvature: positive curvature lets geodesics refocus, and past the first conjugate point a geodesic is no longer shortest.

  # ---------------------------------------------------------------- Problem 5
  - type: text
    id: p5-setup
    tag: Problem 5 · Einstein curvature in two dimensions
    title: Guess first
    body: |
      Recall the curvatures of the metric: the Ricci curvature $\mathrm{Ric}_{ab}$, the **Ricci scalar** $R := (g^{-1})^{ab}\mathrm{Ric}_{ab}$, and the **Einstein curvature**
      $$G := \mathrm{Ric} - \tfrac12R\,g.$$
      In two dimensions the Riemann–Christoffel curvature $\mathrm{Riem}^\flat$ has a single independent component $\rho := (\mathrm{Riem}^\flat)_{1212}$, and contracting it gives, with $\det g := \det(g_{ij})$,
      $$\mathrm{Ric}_{ab} = \frac{\rho}{\det g}\,g_{ab},\qquad R = \frac{2\rho}{\det g}.$$
      Einstein's equations of gravity (Level 10) will read $G = 8\pi T$, with $T$ the energy and momentum of matter. **Guess first:** on a curved surface, the sphere of $R = 2$ say, how big is $G$?

  - type: numeric
    id: p5-coefficient
    tag: Problem 5 · Einstein curvature in two dimensions
    title: Compute G in general
    prompt: |
      In two dimensions, with $\rho := (\mathrm{Riem}^\flat)_{1212}$ and $\det g := \det(g_{ij})$,
      $$\mathrm{Ric}_{ab} = \frac{\rho}{\det g}g_{ab},\qquad R = \frac{2\rho}{\det g}.$$
      The Einstein curvature $G := \mathrm{Ric} - \tfrac12Rg$ is then a multiple of $\frac{\rho}{\det g}g_{ab}$:
      $$G_{ab} = c\,\frac{\rho}{\det g}\,g_{ab}.$$
      Find $c$.
    answer: 0
    tolerance: 0.001
    answerText: '0'
    wrong:
      - { value: -1, feedback: 'That is $\mathrm{Ric} - Rg$: you dropped the $\tfrac12$. With it, $\tfrac12\cdot\tfrac{2\rho}{\det g} = \tfrac{\rho}{\det g}$, exactly the Ricci coefficient.' }
      - { value: 2, feedback: 'The $\tfrac12Rg$ term is subtracted, not added: $1 - \tfrac12\cdot2 = 0$.' }
    hint: '$\tfrac12R = \rho/\det g$.'
    explanation: |
      $$\begin{aligned}G_{ab} &= \frac{\rho}{\det g}g_{ab} - \frac12\cdot\frac{2\rho}{\det g}g_{ab}\\ &= 0.\end{aligned}$$
      $G = 0$ on **every** surface, curved or not. In two dimensions, $\mathrm{Ric} = \tfrac R2g$: Ricci curvature is the metric times half the scalar.

  - type: numeric
    id: p5-check
    tag: Problem 5 · Einstein curvature in two dimensions
    title: Check on a curved example
    prompt: |
      Slit plane, polar-type chart $(r,\theta)$ with metric $g = \mathrm{diag}(1, r^4)$. Its curvatures are
      $$\mathrm{Ric} = \mathrm{diag}\big(-\tfrac{2}{r^2},\,-2r^2\big),\qquad R = -\tfrac{4}{r^2}.$$
      Compute the Einstein component $G_{22} = \mathrm{Ric}_{22} - \tfrac12R\,g_{22}$ at $r = 2$.
    answer: 0
    tolerance: 0.001
    answerText: '0'
    wrong:
      - { value: -8, feedback: 'That is $\mathrm{Ric}_{22} = -8$ alone. Subtract $\tfrac12Rg_{22} = \tfrac12(-1)(16) = -8$ as well.' }
      - { value: 8, feedback: 'That is $\mathrm{Ric}_{22} - Rg_{22} = -8 + 16$, without the $\tfrac12$.' }
      - { value: -16, feedback: 'Sign: $-\tfrac12Rg_{22}$ with $R = -1$ is $+8$, so $-8 + 8 = 0$.' }
    hint: 'At $r = 2$: $\mathrm{Ric}_{22} = -8$, $R = -1$, $g_{22} = 16$.'
    explanation: |
      $$G_{22} = -8 - \tfrac12(-1)(16) = 0,$$
      and $G_{11} = -\tfrac12 - \tfrac12(-1)(1) = 0$. The metric is curved ($R = -1$ at $r = 2$), yet $G = 0$. On the unit sphere, $\mathrm{Ric} = g$ and $R = 2$ give $G = g - g = 0$ as well.

  - type: numeric
    id: p5-riem
    tag: Problem 5 · Einstein curvature in two dimensions
    title: R alone fixes the curvature
    prompt: |
      In two dimensions $R = 2\rho/\det g$, so the single component $\rho = (\mathrm{Riem}^\flat)_{1212}$ is $\tfrac R2\det g$, and the whole Riemann–Christoffel curvature follows from $R$. On the unit sphere, chart $(\vartheta,\varphi)$, $g = \mathrm{diag}(1,\sin^2\vartheta)$, $R = 2$. Compute $(\mathrm{Riem}^\flat)_{1212}$ at $\vartheta = \tfrac\pi6$.
    answer: 0.25
    tolerance: 0.001
    answerText: '1/4'
    wrong:
      - { value: 0.5, feedback: 'That is $R\det g$. The component is $\tfrac R2\det g = 1\cdot\sin^2\tfrac\pi6$.' }
      - { value: 1, feedback: '$\det g = \sin^2\vartheta = \tfrac14$ at $\vartheta = \tfrac\pi6$, not $1$ (that is the equator).' }
    hint: '$\det g = \sin^2\tfrac\pi6 = \tfrac14$.'
    explanation: |
      $$(\mathrm{Riem}^\flat)_{1212} = \tfrac22\cdot\tfrac14 = \tfrac14.$$
      Check by lowering: $\mathrm{Riem}^1{}_{212} = \sin^2\vartheta$ on the sphere, and $g_{11}\,\mathrm{Riem}^1{}_{212} = \sin^2\tfrac\pi6 = \tfrac14$. In two dimensions one number per point, $R$, is all the curvature there is.

  - type: mcq
    id: p5-physics
    tag: Problem 5 · Einstein curvature in two dimensions
    title: Gravity in a flat world
    prompt: |
      In two dimensions the Einstein curvature $G := \mathrm{Ric} - \tfrac12Rg$ vanishes for every metric, curved or not. Suppose a two-dimensional world obeyed Einstein's equations $G = 8\pi T$, with $T$ the energy and momentum of matter. What follows?
    options:
      - text: '$T = 0$: no matter is allowed, and every metric solves the vacuum equations, so the equations say nothing about the curvature'
        correct: true
      - text: 'Space must be flat'
        feedback: |
          $G = 0$ does not force $R = 0$: the sphere has $R = 2$ and $G = 0$. Every curved surface satisfies $G = 0$, so the vacuum equation imposes nothing.
      - text: 'The equations fix the Ricci scalar: $R = 8\pi$ times the trace of $T$'
        feedback: |
          The trace of $G$ is $R - \tfrac12R\cdot2 = 0$ in two dimensions, so taking the trace only gives $0 = 8\pi\,(\text{trace of }T)$. $R$ drops out.
      - text: 'Gravity works as in four dimensions, only weaker'
        feedback: |
          The left side is identically zero, so matter cannot source anything. That is a qualitative change, not a weaker coupling: two-dimensional general relativity has no dynamics.
    explanation: |
      With $G\equiv0$, $G = 8\pi T$ forces $T = 0$ and leaves the metric completely free. Einstein's theory needs at least three dimensions to say anything, and in four the vacuum equations $G = 0$ still allow curvature (gravitational waves, the field outside a star).

  - type: numeric
    id: p5-divergence
    tag: Problem 5 · Einstein curvature in two dimensions
    title: The divergence-free combination
    prompt: |
      The **divergence** of a symmetric $(0,2)$-tensor field $S$ is $(\operatorname{div}S)_n := (g^{-1})^{kl}(\nabla_{\partial x_k}S)_{ln}$, with $\nabla = \nabla^{\mathrm{LC}}$. Two facts, in any dimension: the **contracted Bianchi identity**
      $$\operatorname{div}\mathrm{Ric} = \tfrac12\,dR,$$
      and $\nabla g = 0$, so $(\operatorname{div}(Rg))_n = \partial_nR$. For which number $c$ is $\mathrm{Ric} + c\,R\,g$ divergence free for every metric?
    answer: -0.5
    tolerance: 0.001
    answerText: '-1/2'
    wrong:
      - { value: -1, feedback: '$\mathrm{Ric} - Rg$ has divergence $\tfrac12\partial_nR - \partial_nR = -\tfrac12\partial_nR$, not zero unless $R$ is constant.' }
      - { value: 0.5, feedback: 'Then the divergence is $\tfrac12\partial_nR + \tfrac12\partial_nR = \partial_nR$: the two terms must cancel, not add.' }
    hint: 'The divergence of $\mathrm{Ric} + cRg$ is $(\tfrac12 + c)\,\partial_nR$.'
    explanation: |
      $$\big(\operatorname{div}(\mathrm{Ric} + cRg)\big)_n = \big(\tfrac12 + c\big)\partial_nR,$$
      zero for every metric only when $c = -\tfrac12$. That singles out the Einstein curvature $G = \mathrm{Ric} - \tfrac12Rg$: $\operatorname{div}G = 0$ is the contracted Bianchi identity in its usual form.

  - type: mcq
    id: p5-bianchi
    tag: Problem 5 · Einstein curvature in two dimensions
    title: Trivial here, essential there
    prompt: |
      The Einstein curvature $G := \mathrm{Ric} - \tfrac12Rg$ satisfies $(g^{-1})^{kl}(\nabla_{\partial x_k}G)_{ln} = 0$ for every metric. In two dimensions $G = 0$. Which statement about this identity is right?
    options:
      - text: 'In two dimensions it reads $0 = 0$; in four, where $G\neq0$ in general, it is a real identity that makes $G = 8\pi T$ consistent with the conservation of energy and momentum, $\operatorname{div}T = 0$'
        correct: true
      - text: 'It is an extra equation one imposes on the metric, alongside $G = 8\pi T$'
        feedback: |
          It holds for **every** metric: it follows from the definitions (the differential Bianchi identity, contracted). Nothing is imposed; it is a consequence of the geometry.
      - text: 'Ricci curvature is divergence free too, so $\mathrm{Ric} = 8\pi T$ would serve equally well'
        feedback: |
          $\operatorname{div}\mathrm{Ric} = \tfrac12dR$, which is nonzero wherever $R$ varies. $\mathrm{Ric} = 8\pi T$ would force $dR = 0$, an unphysical constraint on matter.
      - text: 'In four dimensions $G = 0$ too, so the identity is trivial there as well'
        feedback: |
          In four dimensions the trace of $G$ is $R - \tfrac12R\cdot4 = -R$, nonzero whenever $R\neq0$. The two-dimensional cancellation $1 - \tfrac12\cdot2 = 0$ is special.
    explanation: |
      Matter conserves energy and momentum: $\operatorname{div}T = 0$. An equation $(\text{curvature}) = 8\pi T$ can only be consistent if the curvature side is divergence free for every metric, and $G$ is the combination built from Ric and $Rg$ that is.

  - type: text
    id: p5-shows
    tag: Problem 5 · Einstein curvature in two dimensions
    title: What it shows
    body: |
      - In two dimensions all curvature is the scalar $R$:
      $$\mathrm{Ric} = \tfrac R2\,g,\qquad(\mathrm{Riem}^\flat)_{1212} = \tfrac R2\det g,$$
      and therefore $G = 0$ for every surface (checked on $\mathrm{diag}(1,r^4)$ at $r = 2$ and on the sphere).
      - Einstein's equations $G = 8\pi T$ in two dimensions force $T = 0$ and leave the metric free: no dynamics.
      - $\operatorname{div}\mathrm{Ric} = \tfrac12dR$ singles out $c = -\tfrac12$: $G = \mathrm{Ric} - \tfrac12Rg$ is divergence free for every metric. Trivial in two dimensions, it is what makes gravity compatible with conservation in four.

  - type: text
    id: wrap-up
    title: What you now own
    body: |
      Five problems, one level. The formulas to keep:

      Setting: a metric $g$ with chart components $g_{ij}$, $\det g$ the determinant of the matrix $(g_{ij})$, $\Gamma^k_{ij}$ its Christoffel symbols (repeated indices summed), $\flat(\mathcal{X})\lceil\mathcal{Y}\rfloor := g(\mathcal{X},\mathcal{Y})$, $\nabla$ a connection, $\text{ᛊ}$ the deformation parameter and $\text{ᛉ}$ the shape of a deformation $\gamma_\text{ᛊ}$ of a curve $\gamma$, $L$ the length.

      **1. Contracted Christoffel symbols** (sum over $m$) from one determinant, and the divergence of a vector field $\mathcal{Y}$ with components $y^k$:
      $$\Gamma^m_{mk} = \partial_k\ln\sqrt{|\det g|},$$
      and the divergence of a vector field
      $$\frac{1}{\sqrt{|\det g|}}\,\partial_k\big(\sqrt{|\det g|}\,y^k\big).$$
      **2. A light ray in a medium**, the upper half-plane $\{(u,w)\in\mathbb{R}^2\mid w>0\}$ with $g_{ij} = \delta_{ij}/w^2$ (refractive index $n = 1/w$): with $P_m := \partial_{2+m}\mathcal{L}_\mathscr{X}$ and $E_m := \partial_m\mathcal{L}_\mathscr{X} - \dot P_m$ along $\gamma$ ($\mathcal{L}_\mathscr{X}$ the length Lagrangian), the first variation for free ends is
      $$\big[P_m\text{ᛉ}^m\big] + \int E_m\text{ᛉ}^m\,d\lambda.$$
      **3. Lowering through $\nabla$**:
      $$\begin{aligned}&\big(\nabla_{\partial x_k}\flat(\mathcal{Y})\big)_i - g_{im}(\nabla_{\partial x_k}\mathcal{Y})^m\\ &\quad= (\nabla_{\partial x_k}g)_{im}\,y^m,\end{aligned}$$
      zero for metric-compatible connections; the energy fixes the speed, the length does not.

      **4. Minimum or saddle**: on the unit sphere, an equator arc of length $\ell$ tilted to $\vartheta = \tfrac\pi2 + \text{ᛊ}h(\lambda)$ ($\lambda\in[0,\ell]$, $h(0) = h(\ell) = 0$, $\vartheta$ the polar angle) has length $\ell + C\,\text{ᛊ}^2 + O(\text{ᛊ}^4)$ with
      $$C = \tfrac12\int_0^\ell(h'^2 - h^2)\,d\lambda,$$
      a minimum before the first conjugate point (the antipode), a saddle after; in Minkowski, a maximum of proper time.

      **5. Two dimensions**: with $\mathrm{Ric}$ the Ricci curvature, $R$ the Ricci scalar and $G := \mathrm{Ric} - \tfrac12Rg$ the Einstein curvature, $\mathrm{Ric} = \tfrac R2g$, so $G = 0$; and in any dimension $G$ is the divergence-free combination,
      $$\operatorname{div}\big(\mathrm{Ric} - \tfrac12Rg\big) = 0.$$
      **Next, Level 8: integrals.** The unit disc has area $\pi$. In cartesian coordinates, $\int\!\!\int da\,db = \pi$. In the polar chart, the same set is $r\in(0,1)$, $\theta\in(-\pi,\pi)$, and $\int\!\!\int dr\,d\theta = 2\pi$. Which one is the area? Integrating chart representatives depends on the chart. The cure is the factor $\sqrt{|\det g|}$ from Problem 1 ($= r$ in polar), which returns as the **metric volume form**.
