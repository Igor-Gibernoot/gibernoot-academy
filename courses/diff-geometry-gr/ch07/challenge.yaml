id: ch07-challenge
title: Level Challenge · Part 1
kind: challenge

# Organization: intro, one block per problem (cards tagged "Problem N · …", ids
# prefixed pN-), then wrap-up. The Level Challenge is split in 3 parts of at most
# 32 cards; part 1 holds problem 1.

cards:
  - type: text
    id: intro
    title: Determinants
    body: |
      This challenge pushes each idea of the level to its edge. It comes in 3 parts; this is part 1 (problem 1). Keep pencil and paper at hand: every answer can be checked by hand. Einstein summation is on.

      Recall the toolkit. In a chart $\mathscr{X}$ the metric $g$ has components $g_{ij}$ (symmetric, $\det(g_{ij})\neq0$), the inverse metric has components $(g^{-1})^{ij}$ with
      $$g_{ij}\,(g^{-1})^{jk} = \delta^k_i,$$
      and $\partial_k$ is the derivative in the $k$-th chart slot. The **Christoffel symbols** of the Levi-Civita connection $\nabla^{\mathrm{LC}}$ are $\Gamma^k_{ij} = (g^{-1})^{km}\,\Gamma_{mij}$, with
      $$\begin{aligned}\Gamma_{mij} := \tfrac12\big(&\partial_ig_{mj} + \partial_jg_{mi}\\ &- \partial_mg_{ij}\big).\end{aligned}$$
      A curve with components $\gamma^k(\lambda)$ (dot $= d/d\lambda$, speed $s_\gamma$) is a constant-speed geodesic when it solves
      $$\ddot\gamma^k + \Gamma^k_{ij}\,\dot\gamma^i\dot\gamma^j = 0, \tag{G}$$
      and a geodesic at any speed when the right-hand side is $(\dot s_\gamma/s_\gamma)\,\dot\gamma^k$ instead, equation (S).

      1. Contracted Christoffel symbols: $d$ functions hidden in one determinant.

  # ---------------------------------------------------------------- Problem 1
  - type: text
    id: p1-setup
    tag: Problem 1 · Contracted Christoffel symbols
    title: Guess first
    body: |
      In four dimensions the Christoffel symbols $\Gamma^k_{ij}$ ($\Gamma^k_{ij} = \Gamma^k_{ji}$) are $40$ functions. Physics often needs only their **contraction** $\Gamma^k_{ki}$ (sum over $k$), just $4$ functions. It appears in the **divergence** of a vector field $\mathcal{Y}$ with components $y^m$, the covariant derivative with its direction index contracted against the component index:
      $$(\nabla_{\partial x_k}\mathcal{Y})^k = \partial_ky^k + \Gamma^k_{jk}\,y^j.$$
      Divergences measure what flows out of a small region (fluid, charge, energy), so they are everywhere in physics.

      **Claim of this problem:** all of $\Gamma^k_{ki}$ comes from one single function, the determinant of the metric components. Before the proof, compute a case where you know every symbol.

  - type: numeric
    id: p1-polar-direct
    tag: Problem 1 · Contracted Christoffel symbols
    title: The contraction in polar
    prompt: |
      The Euclidean plane in the polar chart $(r,\theta)$ has metric components $\mathrm{diag}(1,r^2)$ and the nonzero Christoffel symbols
      $$\Gamma^1_{22} = -r,$$
      $$\Gamma^2_{12} = \Gamma^2_{21} = \tfrac1r.$$
      Compute the contraction $\Gamma^k_{k1} = \Gamma^1_{11} + \Gamma^2_{21}$ at $r = 4$.
    answer: 0.25
    tolerance: 0.001
    answerText: '1/4'
    wrong:
      - { value: 0.5, feedback: 'The contraction sums over the single index $k$: one term $\Gamma^1_{11}$ ($k = 1$) and one term $\Gamma^2_{21}$ ($k = 2$). Counting $\Gamma^2_{12}$ and $\Gamma^2_{21}$ separately adds the same term twice.' }
      - { value: -3.75, feedback: '$\Gamma^1_{22} = -r$ does not have the pattern $\Gamma^k_{k1}$: its upper index $1$ matches no lower index $2$ in the right slots. Only $\Gamma^1_{11} = 0$ and $\Gamma^2_{21} = \tfrac1r$ enter.' }
    hint: Only two symbols have the pattern $\Gamma^k_{k1}$; one of them is zero.
    explanation: |
      $\Gamma^k_{k1} = 0 + \tfrac1r = \tfrac14$ at $r = 4$, and $\Gamma^k_{k2} = \Gamma^1_{12} + \Gamma^2_{22} = 0$. Now look at the determinant of the components: $\det g = r^2$, so $\sqrt{\det g} = r$ and
      $$\partial_r\ln\sqrt{\det g} = \partial_r\ln r = \tfrac1r.$$
      The same function. The rest of this problem proves that this is no accident:
      $$\Gamma^k_{ki} = \partial_i\ln\sqrt{|\det g|}.$$

  - type: text
    id: p1-plan
    tag: Problem 1 · Contracted Christoffel symbols
    title: Three steps
    body: |
      Write $\det g := \det(g_{ij})$, a smooth function on the chart domain that never vanishes. The proof has three steps:
      1. the derivative of the **inverse** metric, in terms of $\partial_kg_{ij}$;
      2. the derivative of the **determinant** (Jacobi's formula);
      3. the contraction of the Christoffel formula, where two of its three terms cancel.

      Step 1 starts from the identity $(g^{-1})^{ar}\,g_{rs} = \delta^a_s$. Its right-hand side is a constant ($0$ or $1$), so differentiating it with $\partial_c$ gives $0$, and the Leibniz rule splits the left-hand side into two terms:
      $$0 = \partial_c(g^{-1})^{ar}\,g_{rs} + (g^{-1})^{ar}\,\partial_cg_{rs}.$$

  - type: build
    id: p1-inverse
    tag: Problem 1 · Contracted Christoffel symbols
    title: The derivative of the inverse
    prompt: |
      Metric components $g_{rs}$, inverse $(g^{-1})^{ab}$, $\partial_c$ the $c$-th slot derivative. Differentiating $(g^{-1})^{ar}g_{rs} = \delta^a_s$ gives
      $$0 = \partial_c(g^{-1})^{ar}\,g_{rs} + (g^{-1})^{ar}\,\partial_cg_{rs}.$$
      Multiply by $(g^{-1})^{sb}$ (sum over $s$) and use $g_{rs}(g^{-1})^{sb} = \delta^b_r$ and the symmetry of $g^{-1}$. Build $\partial_c(g^{-1})^{ab}$.
    prefix: '\partial_c(g^{-1})^{ab} ='
    tiles: ['-', '(g^{-1})^{ar}', '(g^{-1})^{bs}', '\partial_cg_{rs}', '\frac{1}{\partial_cg_{ab}}']
    answers:
      - ['-', '(g^{-1})^{ar}', '(g^{-1})^{bs}', '\partial_cg_{rs}']
      - ['-', '(g^{-1})^{bs}', '(g^{-1})^{ar}', '\partial_cg_{rs}']
      - ['-', '(g^{-1})^{ar}', '\partial_cg_{rs}', '(g^{-1})^{bs}']
      - ['-', '(g^{-1})^{bs}', '\partial_cg_{rs}', '(g^{-1})^{ar}']
      - ['-', '\partial_cg_{rs}', '(g^{-1})^{ar}', '(g^{-1})^{bs}']
      - ['-', '\partial_cg_{rs}', '(g^{-1})^{bs}', '(g^{-1})^{ar}']
    wrong:
      - { answer: ['(g^{-1})^{ar}', '(g^{-1})^{bs}', '\partial_cg_{rs}'], feedback: 'The two terms of the Leibniz rule add up to $0$, so moving one to the other side flips its sign. If $g$ grows, its inverse must shrink: in polar $(g^{-1})^{22} = 1/r^2$ decreases while $g_{22} = r^2$ increases.' }
      - { answer: ['-', '\frac{1}{\partial_cg_{ab}}'], feedback: 'Components of the inverse are not reciprocals of components (recall $\begin{pmatrix}2&1\\1&1\end{pmatrix}^{-1} = \begin{pmatrix}1&-1\\-1&2\end{pmatrix}$), and neither are their derivatives. The inverse enters twice, once for each free index $a$, $b$.' }
      - { answer: ['\frac{1}{\partial_cg_{ab}}'], feedback: 'Components of the inverse are not reciprocals of components (recall $\begin{pmatrix}2&1\\1&1\end{pmatrix}^{-1} = \begin{pmatrix}1&-1\\-1&2\end{pmatrix}$), and the Leibniz rule produces a minus sign.' }
    hint: Moving a term across $0 = \ldots + \ldots$ flips its sign; then each free index ($a$, $b$) needs one factor of $g^{-1}$.
    explanation: |
      Multiplying by $(g^{-1})^{sb}$ turns the first term into $\partial_c(g^{-1})^{ab}$, so
      $$\partial_c(g^{-1})^{ab} = -(g^{-1})^{ar}(g^{-1})^{bs}\,\partial_cg_{rs}.$$
      In matrices: $\partial_c(\mathbf{G}^{-1}) = -\mathbf{G}^{-1}(\partial_c\mathbf{G})\mathbf{G}^{-1}$, the matrix version of $(1/x)' = -x'/x^2$.

  - type: numeric
    id: p1-inverse-check
    tag: Problem 1 · Contracted Christoffel symbols
    title: Check on polar
    prompt: |
      In the polar chart $(r,\theta)$ of the Euclidean plane, $g = \mathrm{diag}(1,r^2)$. Use the rule
      $$\partial_c(g^{-1})^{ab} = -(g^{-1})^{ar}(g^{-1})^{bs}\,\partial_cg_{rs}$$
      with $a = b = 2$, $c = 1$ (the $r$-slot) to compute $\partial_r(g^{-1})^{22}$ at $r = 2$.
    answer: -0.25
    tolerance: 0.001
    answerText: '-1/4'
    wrong:
      - { value: 0.25, feedback: 'Size right, sign wrong. The rule has a minus sign: $g_{22} = r^2$ grows with $r$, so its inverse $1/r^2$ must shrink.' }
      - { value: -4, feedback: 'That is $-\partial_rg_{22} = -2r$ alone. The two inverse factors $(g^{-1})^{22} = 1/r^2$ are missing: $-\tfrac{1}{r^2}\cdot\tfrac{1}{r^2}\cdot2r$.' }
    hint: Only $r = s = 2$ contributes, with $(g^{-1})^{22} = 1/r^2$ and $\partial_rg_{22} = 2r$.
    explanation: |
      $$-\tfrac{1}{r^2}\cdot\tfrac{1}{r^2}\cdot2r = -\tfrac{2}{r^3} = -\tfrac14$$
      at $r = 2$. Directly: $\partial_r(r^{-2}) = -2r^{-3}$. ✓

  - type: text
    id: p1-jacobi-setup
    tag: Problem 1 · Contracted Christoffel symbols
    title: Determinant to first order
    body: |
      Step 2. Move along the $k$-th coordinate line through a point $q$, by a parameter $t$. The matrix of components changes as
      $$\mathbf{A} + t\,\mathbf{B} + O(t^2),$$
      with $\mathbf{A} := (g_{ij}(q))$ and $\mathbf{B} := (\partial_kg_{ij}(q))$. So $\partial_k\det g$ at $q$ is the $t$-derivative at $t = 0$ of $\det(\mathbf{A}+t\mathbf{B})$. Since $\mathbf{A}$ is invertible, factor it out with $\det(\mathbf{M}\mathbf{N}) = \det\mathbf{M}\det\mathbf{N}$:
      $$\det(\mathbf{A}+t\mathbf{B}) = \det\mathbf{A}\,\det(\mathbf{I}+t\,\mathbf{C}),$$
      where $\mathbf{C} := \mathbf{A}^{-1}\mathbf{B}$ and $\mathbf{I}$ is the identity matrix. Everything now rests on $\det(\mathbf{I}+t\,\mathbf{C})$ near $t = 0$.

  - type: mcq
    id: p1-jacobi-2x2
    tag: Problem 1 · Contracted Christoffel symbols
    title: The first-order term
    prompt: |
      For a $2\times2$ matrix $\mathbf{C}$ with entries $c_{ij}$ and the identity $\mathbf{I}$,
      $$\det(\mathbf{I}+t\,\mathbf{C}) = (1+tc_{11})(1+tc_{22}) - t^2c_{12}c_{21}.$$
      What is the coefficient of $t$?
    options:
      - text: '$c_{11}+c_{22} = \mathrm{tr}\,\mathbf{C}$, the trace'
        correct: true
      - text: '$\det\mathbf{C} = c_{11}c_{22}-c_{12}c_{21}$'
        feedback: |
          $\det\mathbf{C}$ is the coefficient of $t^2$: both of its products carry two entries, each with a factor $t$. To first order only the diagonal entries survive, one at a time.
      - text: '$c_{12}+c_{21}$'
        feedback: |
          The off-diagonal entries appear only in the product $t^2c_{12}c_{21}$, which is second order. In any size, a non-identity permutation picks at least two off-diagonal entries, so they never reach first order.
      - text: '$c_{11}c_{22}$'
        feedback: |
          That product comes with $t^2$. Expanding $(1+tc_{11})(1+tc_{22}) = 1 + t(c_{11}+c_{22}) + t^2c_{11}c_{22}$, the first-order part is the sum of the diagonal entries.
    explanation: |
      $\det(\mathbf{I}+t\mathbf{C}) = 1 + t\,\mathrm{tr}\,\mathbf{C} + O(t^2)$. The same holds in any dimension: in the sum over permutations, the identity gives $\prod_i(1+tc_{ii}) = 1 + t\,\mathrm{tr}\,\mathbf{C} + O(t^2)$, and every other permutation picks at least two off-diagonal entries, each of order $t$.

  - type: text
    id: p1-jacobi
    tag: Problem 1 · Contracted Christoffel symbols
    title: Jacobi's formula
    body: |
      With $\det(\mathbf{I}+t\mathbf{C}) = 1 + t\,\mathrm{tr}\,\mathbf{C} + O(t^2)$, the factorization gives
      $$\frac{d}{dt}\det(\mathbf{A}+t\mathbf{B})\Big|_{t=0} = \det\mathbf{A}\;\mathrm{tr}(\mathbf{A}^{-1}\mathbf{B}).$$
      With $\mathbf{A} = (g_{ij})$, $\mathbf{B} = (\partial_kg_{ij})$, the trace is $(g^{-1})^{ji}\,\partial_kg_{ij} = (g^{-1})^{ij}\,\partial_kg_{ij}$ ($g^{-1}$ is symmetric). This is **Jacobi's formula**:
      $$\partial_k\det g = \det g\;(g^{-1})^{ij}\,\partial_kg_{ij}.$$
      Dividing by $\det g$: the logarithmic derivative of the determinant is the trace of $\mathbf{G}^{-1}\partial_k\mathbf{G}$. Check on polar: $\det g = r^2$ gives $\partial_r\det g = 2r$, and $r^2\cdot\tfrac1{r^2}\cdot2r = 2r$. ✓

  - type: numeric
    id: p1-jacobi-numeric
    tag: Problem 1 · Contracted Christoffel symbols
    title: Jacobi in numbers
    prompt: |
      A symmetric matrix depends on $t$ as
      $$\mathbf{G}(t) = \begin{pmatrix}2+t&1\\1&1+3t\end{pmatrix}.$$
      At $t = 0$, $\mathbf{A} = \begin{pmatrix}2&1\\1&1\end{pmatrix}$ has $\det\mathbf{A} = 1$ and $\mathbf{A}^{-1} = \begin{pmatrix}1&-1\\-1&2\end{pmatrix}$, and $\mathbf{B} = \mathbf{G}'(0)$. Compute $\frac{d}{dt}\det\mathbf{G}(t)$ at $t = 0$ with Jacobi's formula $\det\mathbf{A}\,\mathrm{tr}(\mathbf{A}^{-1}\mathbf{B})$, and check it by expanding the determinant.
    answer: 7
    tolerance: 0.001
    wrong:
      - { value: 4, feedback: 'That is $\mathrm{tr}\,\mathbf{B} = 1+3$, without $\mathbf{A}^{-1}$. The trace is of $\mathbf{A}^{-1}\mathbf{B}$: the second diagonal entry is weighted by $(\mathbf{A}^{-1})_{22} = 2$, giving $1\cdot1 + 2\cdot3 = 7$.' }
      - { value: 3, feedback: 'That is $\det\mathbf{B} = 1\cdot3$, a second-order quantity. The derivative at $t = 0$ is the trace term, $\mathrm{tr}(\mathbf{A}^{-1}\mathbf{B}) = 7$.' }
    hint: '$\mathbf{B} = \mathrm{diag}(1,3)$. The diagonal of $\mathbf{A}^{-1}\mathbf{B}$ is $(1\cdot1,\ 2\cdot3)$.'
    explanation: |
      $\mathbf{A}^{-1}\mathbf{B} = \begin{pmatrix}1&-3\\-1&6\end{pmatrix}$, trace $7$, times $\det\mathbf{A} = 1$. Directly:
      $$\begin{aligned}\det\mathbf{G}(t) &= (2+t)(1+3t) - 1\\ &= 1 + 7t + 3t^2,\end{aligned}$$
      whose derivative at $0$ is $7$. ✓

  - type: mcq
    id: p1-contract
    tag: Problem 1 · Contracted Christoffel symbols
    title: Two terms cancel
    prompt: |
      Step 3. Contract the Christoffel symbols of $\nabla^{\mathrm{LC}}$ over the upper and the first lower index (sums over $m$ and $l$):
      $$\begin{aligned}\Gamma^m_{mk} = \tfrac12(g^{-1})^{ml}\big(&\partial_kg_{lm} + \partial_mg_{lk}\\ &- \partial_lg_{mk}\big).\end{aligned}$$
      Which terms of the bracket cancel after the contraction?
    options:
      - text: 'The last two: renaming the summed indices $m\leftrightarrow l$ in one turns it into the other, because $g^{-1}$ and $g$ are symmetric'
        correct: true
      - text: 'The first two, $\partial_kg_{lm}$ and $\partial_mg_{lk}$'
        feedback: |
          They have the same sign, so they could only add. Also $\partial_kg_{lm}$ is differentiated in the **free** direction $k$, while $\partial_mg_{lk}$ is differentiated in a summed direction: no renaming of dummies maps one to the other.
      - text: 'The first and the last'
        feedback: |
          In $\partial_kg_{lm}$ the derivative is in the free direction $k$; in $\partial_lg_{mk}$ it is in the summed direction $l$. Renaming dummies cannot move $k$ into the derivative slot, so these two never match.
      - text: 'None: all three survive the contraction'
        feedback: |
          Rename $m\leftrightarrow l$ in $(g^{-1})^{ml}\partial_lg_{mk}$: it becomes $(g^{-1})^{lm}\partial_mg_{lk} = (g^{-1})^{ml}\partial_mg_{lk}$ by the symmetry of $g^{-1}$. That is exactly the middle term, with the opposite sign.
    explanation: |
      $(g^{-1})^{ml}\partial_lg_{mk} = (g^{-1})^{ml}\partial_mg_{lk}$ after the renaming, so the last two terms cancel and
      $$\Gamma^m_{mk} = \tfrac12(g^{-1})^{ml}\,\partial_kg_{lm}.$$
      Only the derivative in the free direction $k$ survives: exactly the trace that Jacobi's formula needs.

  - type: text
    id: p1-result
    tag: Problem 1 · Contracted Christoffel symbols
    title: The determinant formula
    body: |
      Combine step 3 with Jacobi's formula:
      $$\Gamma^m_{mk} = \tfrac12(g^{-1})^{ml}\,\partial_kg_{lm} = \frac{\partial_k\det g}{2\det g}.$$
      For a positive function $\partial\ln f = \partial f/f$ and $\tfrac12\ln f = \ln\sqrt f$; for a negative one, $\partial\ln|f| = \partial f/f$ as well. So
      $$\Gamma^m_{mk} = \partial_k\ln\sqrt{|\det g|}.$$
      Since $\Gamma^m_{mk} = \Gamma^m_{km}$, the divergence of a vector field becomes
      $$(\nabla_{\partial x_k}\mathcal{Y})^k = \frac{1}{\sqrt{|\det g|}}\,\partial_k\big(\sqrt{|\det g|}\,y^k\big),$$
      as the Leibniz rule on the right shows. No Christoffel symbol is left: only one function, $\sqrt{|\det g|}$.

  - type: mcq
    id: p1-abs
    tag: Problem 1 · Contracted Christoffel symbols
    title: Why the absolute value
    prompt: |
      For the Levi-Civita connection, the contraction of the Christoffel symbols is
      $$\Gamma^m_{mk} = \partial_k\ln\sqrt{|\det g|},$$
      with $\det g := \det(g_{ij})$ in the chart. Why the absolute value, rather than $\ln\sqrt{\det g}$?
    options:
      - text: 'For a Lorentzian metric $\det g < 0$ (for example $\mathrm{diag}(-1,1,1,1)$); $\partial\ln|f| = \partial f/f$ works for either sign, and it is $\partial f/f$ that the proof produces'
        correct: true
      - text: 'To make the contraction positive'
        feedback: |
          The absolute value is inside the logarithm, before differentiating; $\Gamma^m_{mk}$ can still have either sign (on the sphere $\cot\vartheta < 0$ in the southern hemisphere).
      - text: 'Because $\det g$ is positive anyway, and the bars are a convention'
        feedback: |
          Only for Riemannian metrics. The determinant has sign $(-1)^{n_-}$, with $n_-$ the number of minus signs of the signature: negative for spacetime, signature $(3,1)$.
      - text: 'Because $\det g$ may vanish at some points'
        feedback: |
          A metric is non-degenerate, so $\det g\neq0$ everywhere in the chart. The bars handle the sign, not zeros.
    explanation: |
      The proof gives $\Gamma^m_{mk} = \partial_k\det g/(2\det g)$, which is $\partial_k\ln\sqrt{|\det g|}$ for either sign. For spacetime $\det g < 0$ (signature $(3,1)$, sign $(-1)^1$), and $\sqrt{-\det g}$ is the factor that will weigh volumes of spacetime.

  - type: numeric
    id: p1-sphere
    tag: Problem 1 · Contracted Christoffel symbols
    title: Check on the sphere
    prompt: |
      The unit sphere in the chart $(\vartheta,\varphi)$ ($\vartheta$ = angle from the north pole, $\varphi$ = longitude) has metric components $\mathrm{diag}(1,\sin^2\vartheta)$ and nonzero Christoffel symbols $\Gamma^1_{22} = -\sin\vartheta\cos\vartheta$, $\Gamma^2_{12} = \Gamma^2_{21} = \cot\vartheta$. Compute the contraction $\Gamma^k_{k1}$ at $\vartheta = \pi/3$, once from the symbols and once from
      $$\Gamma^k_{k1} = \partial_\vartheta\ln\sqrt{|\det g|}.$$
    answer: 0.57735
    tolerance: 0.002
    answerText: '1/√3 ≈ 0.577'
    wrong:
      - { value: 1.1547, feedback: 'That is $\partial_\vartheta\ln\det g = 2\cot\vartheta$: the square root halves it. From the symbols: $\Gamma^1_{11} + \Gamma^2_{21} = 0 + \cot\vartheta$.' }
      - { value: -0.43301, feedback: 'That is $\Gamma^1_{22} = -\sin\vartheta\cos\vartheta$, which does not have the pattern $\Gamma^k_{k1}$. The contraction is $\Gamma^1_{11} + \Gamma^2_{21}$.' }
    hint: '$\det g = \sin^2\vartheta$, so $\sqrt{|\det g|} = \sin\vartheta$ on $(0,\pi)$.'
    explanation: |
      From the symbols: $\Gamma^1_{11} + \Gamma^2_{21} = 0 + \cot\vartheta$. From the determinant: $\partial_\vartheta\ln\sin\vartheta = \cot\vartheta$. At $\pi/3$: $\cot(\pi/3) = 1/\sqrt3\approx0.577$. ✓ And $\Gamma^k_{k2} = 0$, since nothing depends on $\varphi$.

  - type: numeric
    id: p1-bowl
    tag: Problem 1 · Contracted Christoffel symbols
    title: A bowl
    prompt: |
      A bowl in space: above each point of the plane with polar coordinates $(r,\theta)$, the surface sits at height $r^2/4$. Measuring lengths in space gives, in the chart $(r,\theta)$, the metric components
      $$g = \mathrm{diag}\big(1+\tfrac{r^2}{4},\ r^2\big).$$
      Compute the contraction $\Gamma^k_{k1}$ ($1$ = the $r$-slot) at $r = 2$, either from $\Gamma^k_{k1} = \partial_r\ln\sqrt{|\det g|}$ or from the two symbols $\Gamma^1_{11}$ and $\Gamma^2_{21}$. Both routes must agree.
    answer: 0.75
    tolerance: 0.001
    answerText: '3/4'
    wrong:
      - { value: 0.5, feedback: 'That is $\Gamma^2_{21} = \tfrac1r$ alone, the flat-plane value. Here $g_{11} = 1+\tfrac{r^2}{4}$ depends on $r$, so $\Gamma^1_{11} = \tfrac12(g^{-1})^{11}\partial_rg_{11} = \frac{r/2}{2(1+r^2/4)} = \tfrac14$ also contributes.' }
      - { value: 0.25, feedback: 'That is $\Gamma^1_{11}$ alone. The contraction also has $\Gamma^2_{21} = \tfrac12(g^{-1})^{22}\partial_rg_{22} = \tfrac1r = \tfrac12$.' }
      - { value: 1.5, feedback: 'That is $\partial_r\ln\det g$, twice the answer: the square root brings a factor $\tfrac12$.' }
    hint: '$\det g = r^2\,(1+\tfrac{r^2}{4})$, so $\ln\sqrt{\det g} = \ln r + \tfrac12\ln(1+\tfrac{r^2}{4})$.'
    explanation: |
      From the determinant, with $W := 1+\tfrac{r^2}{4}$ ($W = 2$ at $r = 2$):
      $$\partial_r\ln\big(r\sqrt W\big) = \tfrac1r + \frac{r}{4W} = \tfrac12 + \tfrac14.$$
      From the symbols: $\Gamma^1_{11} = \tfrac12\cdot\tfrac1W\cdot\tfrac r2 = \tfrac14$ and $\Gamma^2_{21} = \tfrac12\cdot\tfrac1{r^2}\cdot2r = \tfrac12$. Both give $\tfrac34$. ✓

  - type: mcq
    id: p1-not-covector
    tag: Problem 1 · Contracted Christoffel symbols
    title: A covector field?
    prompt: |
      The contraction $\Gamma^k_{ki} = \partial_i\ln\sqrt{|\det g|}$ has one lower index. On the Euclidean plane it is $(0,0)$ in the cartesian chart (metric components $\delta_{ij}$) and $(\tfrac1r,0)$ in the polar chart (components $\mathrm{diag}(1,r^2)$). Are the numbers $\Gamma^k_{ki}$ the components of a covector field?
    options:
      - text: 'No: the components of a covector field vanish in every chart if they vanish in one, and here they do not; $\det g$ is not a scalar field, it changes with the chart'
        correct: true
      - text: 'Yes: it is the differential of the function $\ln\sqrt{|\det g|}$, and differentials are covector fields'
        feedback: |
          A differential $df$ is a covector field when $f$ is one function on the manifold. But $\det g$ depends on the chart: $1$ in cartesian, $r^2$ in polar. Each chart differentiates a different function, so the results do not transform as covector components.
      - text: 'Yes: contracting an upper with a lower index always gives a tensor'
        feedback: |
          Contraction makes tensors out of **tensors**. The Christoffel symbols are not tensor components (their transformation law has an extra second-derivative term), so neither is their contraction.
    explanation: |
      Under a change of chart with Jacobian matrix $\mathbf{A}$ (old by new), $\mathbf{G}_\mathscr{Y} = \mathbf{A}^{\mathsf T}\mathbf{G}_\mathscr{X}\mathbf{A}$, so $\det g$ picks up the factor $(\det\mathbf{A})^2$ and $\ln\sqrt{|\det g|}$ shifts by $\ln|\det\mathbf{A}|$. Cartesian to polar: $\det\mathbf{A} = r$, the shift $\ln r$, the extra term $\tfrac1r$: an inhomogeneous term, the fingerprint of the Christoffel symbols.

  - type: text
    id: p1-shows
    tag: Problem 1 · Contracted Christoffel symbols
    title: What it shows
    body: |
      - Derivative of the inverse: $\partial_c(g^{-1})^{ab} = -(g^{-1})^{ar}(g^{-1})^{bs}\,\partial_cg_{rs}$.
      - Jacobi's formula: $\partial_k\det g = \det g\,(g^{-1})^{ij}\,\partial_kg_{ij}$, from $\det(\mathbf{I}+t\mathbf{C}) = 1 + t\,\mathrm{tr}\,\mathbf{C} + O(t^2)$.
      - Contracting the Christoffel formula kills two of its three terms, and
      $$\Gamma^m_{mk} = \partial_k\ln\sqrt{|\det g|}.$$

      So the $d$ contracted symbols need only one function, and the divergence is $\frac{1}{\sqrt{|\det g|}}\partial_k(\sqrt{|\det g|}\,y^k)$. That function is not a scalar field: it carries the chart's own stretching, $\det\mathbf{A}$. This is exactly what a **density for volumes** must do, and $\sqrt{|\det g|}$ comes back in Level 8.

  - type: text
    id: wrap-up
    title: What you now own
    body: |
      Problem 1, part 1 of 3 of the level challenge. The formulas to keep:

      Setting: a metric $g$ with chart components $g_{ij}$, $\det g$ the determinant of the matrix $(g_{ij})$, and $\Gamma^k_{ij}$ its Christoffel symbols (repeated indices summed).

      **1. Contracted Christoffel symbols** (sum over $m$) from one determinant, and the divergence of a vector field $\mathcal{Y}$ with components $y^k$:
      $$\Gamma^m_{mk} = \partial_k\ln\sqrt{|\det g|},$$
      and the divergence of a vector field
      $$\frac{1}{\sqrt{|\det g|}}\,\partial_k\big(\sqrt{|\det g|}\,y^k\big).$$

      **Next, part 2 of this challenge.** A light ray in the upper half-plane: does it bow up or down? Its variation is computed by hand twice, with an endpoint that moves. Then: may an index be lowered inside $\nabla$, and why does the energy Lagrangian fix the speed while the length does not?
