id: ch07-euler-lagrange-2
title: Variations and the Euler-Lagrange Equations · Part 2
kind: concept
own: |
  - **Setting**: $(\mathcal{M},g)$ a metric manifold of dimension $d$, $(\mathcal{U},\mathscr{X})$ a chart, $\gamma\colon[a,b]\to\mathcal{M}$ a smooth curve with $\dot\gamma^i$ the components of $v_\gamma$, sign $\text{ᛇ}_\gamma$ and speed $s_\gamma$; $\mathcal{L}_\mathscr{X}(\alpha;\beta)$ is the Lagrangian in the bundle chart (position slots $\alpha$, velocity slots $\beta$, $\partial_k$ the derivative in the $k$-th of the $2d$ slots), and $\gamma$ is a geodesic when its length is stationary under every variation with fixed endpoints.
  - **Euler-Lagrange equations**: $\gamma$ is a geodesic if and only if, for $m = 1,\dots,d$,
  {{ $$\frac{d}{d\lambda}\big[\partial_{d+m}\mathcal{L}_\mathscr{X}\big] - \partial_m\mathcal{L}_\mathscr{X} = 0$$ }}
  both partials evaluated at $(\gamma_\mathcal{U};\dot\gamma_\mathcal{U})$. Cartesian Euclidean plane ($g_{ij} = \delta_{ij}$): {{ $\frac{d}{d\lambda}(\dot\gamma^m/s_\gamma) = 0$ }}, straight lines run at any speed.
  - **Other Lagrangians**: the proof works for any $C^2$ Lagrangian; the energy Lagrangian $\tfrac12\big((\beta^1)^2+(\beta^2)^2\big)$ gives {{ $\ddot\gamma^m = 0$ }}, straight lines at constant speed. The length is unchanged by reparametrization, so its equations fix the path, not the speed.
  - **Caveats**: stationary is not minimal (the inertial worldline in Minkowski is a maximum), and the equations assume fixed endpoints. Being a geodesic {{ does not depend on the chart }} used to write the deformations: the derivative only sees the first-order shape.

cards:
  - type: text
    id: recall-el
    title: "Recall: variations and the Euler-Lagrange equations"
    body: |
      On a manifold $\mathcal{M}$ with metric $g$ of dimension $d$, take a chart $(\mathcal{U},\mathscr{X})$ and a smooth curve $\gamma\colon[a,b]\to\mathcal{M}$ with chart representative $\gamma_\mathcal{U} := \mathscr{X}\circ\gamma$, velocity components $\dot\gamma^i$, sign $\text{ᛇ}_\gamma := \mathrm{sgn}\,g(v_\gamma,v_\gamma)\neq0$ and speed $s_\gamma$. It is a **geodesic** if its length $L_{[a,b]}[\gamma] = \int_a^bs_\gamma\,d\lambda$ is stationary under every variation $\mathscr{X}^{-1}(\gamma_\mathcal{U}+\text{ᛊ}\,\text{ᛉ})$ with fixed endpoints ($\text{ᛉ}(a) = \text{ᛉ}(b) = 0$). The lesson Variations and the Euler-Lagrange Equations · Part 1 showed that, with the Lagrangian $\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{\text{ᛇ}_\gamma\,g_{ij}(\mathscr{X}^{-1}(\alpha))\beta^i\beta^j}$ ($\alpha$ the $d$ position slots, $\beta$ the $d$ velocity slots, $\partial_k$ the derivative in the $k$-th of the $2d$ slots), $\gamma$ is a geodesic if and only if for $m = 1,\dots,d$
      $$\frac{d}{d\lambda}\big[\partial_{d+m}\mathcal{L}_\mathscr{X}\big] - \partial_m\mathcal{L}_\mathscr{X} = 0,$$
      both partials evaluated at $(\gamma_\mathcal{U};\dot\gamma_\mathcal{U})$, and the proof works for any $C^2$ Lagrangian.

  - type: text
    id: cartesian-check
    title: Check in the Euclidean plane
    body: |
      Cartesian chart, $\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{(\beta^1)^2+(\beta^2)^2}$. The position derivatives vanish, $\partial_m\mathcal{L}_\mathscr{X} = 0$, and the velocity ones are
      $$\partial_{2+m}\mathcal{L}_\mathscr{X} = \frac{\beta^m}{\sqrt{(\beta^1)^2+(\beta^2)^2}}.$$
      On the curve, $\beta^m = \dot\gamma^m$ and the root is the speed $s_\gamma$. The Euler-Lagrange equations read
      $$\frac{d}{d\lambda}\Big(\frac{\dot\gamma^m}{s_\gamma}\Big) = 0,\quad m = 1,2.$$
      So $\dot\gamma/s_\gamma$, the velocity divided by its length, is a constant vector.

  - type: mcq
    id: cartesian-solutions
    title: Which curves solve it?
    prompt: |
      In the cartesian chart of the Euclidean plane, the Euler-Lagrange equations of the length Lagrangian $\mathcal{L}_\mathscr{X}(\alpha;\beta) = \sqrt{(\beta^1)^2+(\beta^2)^2}$ are
      $$\frac{d}{d\lambda}\Big(\frac{\dot\gamma^m}{s_\gamma}\Big) = 0,\quad m = 1,2,$$
      with speed $s_\gamma = \sqrt{(\dot\gamma^1)^2+(\dot\gamma^2)^2} > 0$. Which curves solve them?
    options:
      - text: 'Straight lines, run at any (nonzero) speed, even a varying one'
        correct: true
      - text: 'Straight lines run at constant speed only'
        feedback: |
          The equations only fix the direction $\dot\gamma/s_\gamma$. With direction $u$ constant, $\dot\gamma = s_\gamma\,u$ for any positive function $s_\gamma$: for instance $\gamma(\lambda) = (\lambda^2,0)$ on $[1,2]$ has $\dot\gamma/s_\gamma = (1,0)$ although its speed $2\lambda$ changes.
      - text: 'Straight lines and circles'
        feedback: |
          On a circle the direction $\dot\gamma/s_\gamma$ turns, so its derivative is not $0$. Circles are not stationary: pulling an arc of one towards its chord shortens it at first order.
      - text: 'Every curve, since the position slots never appear'
        feedback: |
          The absence of position slots kills the term $\partial_m\mathcal{L}_\mathscr{X}$, but the other term $\frac{d}{d\lambda}(\dot\gamma^m/s_\gamma)$ remains and must vanish. That is a real condition: the direction must stay fixed.
    explanation: |
      $\dot\gamma = s_\gamma\,u$ with a fixed unit vector $u$ integrates to $\gamma_\mathcal{U}(\lambda) = \gamma_\mathcal{U}(a) + \big(\int_a^\lambda s_\gamma\big)\,u$: a straight segment. The hook's segment is one of them, as it should be.

  - type: text
    id: energy
    title: A Lagrangian without the root
    body: |
      The proof never used the root, so try the simplest Lagrangian of physics, the kinetic energy of a free particle of unit mass, in the cartesian chart of the Euclidean plane:
      $$\mathcal{E}_\mathscr{X}(\alpha;\beta) := \tfrac12\big((\beta^1)^2+(\beta^2)^2\big).$$
      Its action $\int\mathcal{E}\,d\lambda$ is not the length. The Euler-Lagrange equations: $\partial_m\mathcal{E}_\mathscr{X} = 0$ and $\partial_{2+m}\mathcal{E}_\mathscr{X} = \beta^m$, so
      $$\ddot\gamma^m = 0,\quad m = 1,2.$$
      This is Newton's free particle. Its solutions are straight lines run at **constant** speed: a stricter condition than the length's.

  - type: numeric
    id: energy-test
    title: Same path, two Lagrangians
    prompt: |
      Euclidean plane, cartesian chart. The curve $\gamma(\lambda) = (\lambda^2,\ 0)$, $\lambda\in[1,2]$, runs along a straight line with velocity components $(\dot\gamma^1,\dot\gamma^2) = (2\lambda,0)$. For the energy Lagrangian $\mathcal{E}_\mathscr{X}(\alpha;\beta) = \tfrac12\big((\beta^1)^2+(\beta^2)^2\big)$, the $m = 1$ Euler-Lagrange expression is
      $$\frac{d}{d\lambda}\big[\partial_3\mathcal{E}_\mathscr{X}\big] - \partial_1\mathcal{E}_\mathscr{X}.$$
      Evaluate it on this curve.
    answer: 2
    wrong:
      - { value: 0, feedback: '$0$ is what the length Lagrangian gives on this curve: $\dot\gamma^1/s_\gamma = 2\lambda/2\lambda = 1$, constant. For $\mathcal{E}_\mathscr{X}$, $\partial_3\mathcal{E}_\mathscr{X} = \beta^1 = 2\lambda$, whose $\lambda$-derivative is $2$.' }
      - { value: 4, feedback: 'The velocity slot is $\beta^1 = \dot\gamma^1 = 2\lambda$; its $\lambda$-derivative is $2$. The position term $\partial_1\mathcal{E}_\mathscr{X}$ is $0$, since $\mathcal{E}_\mathscr{X}$ has no position slots.' }
    hint: '$\partial_3\mathcal{E}_\mathscr{X} = \beta^1$, which on the curve is $\dot\gamma^1 = 2\lambda$; and $\partial_1\mathcal{E}_\mathscr{X} = 0$.'
    explanation: |
      The result is $\ddot\gamma^1 = 2\neq0$: $\gamma$ is **not** stationary for the energy, although it is for the length (there $\frac{d}{d\lambda}(2\lambda/2\lambda) = 0$). Same path, different verdicts: the energy cares about the speed, the length does not.

  - type: mcq
    id: reparam-freedom
    title: Why the length cannot fix the speed
    prompt: |
      The length functional is reparametrization invariant: $L_{\text{ᚱ}^{-1}([a,b])}[\gamma\circ\text{ᚱ}] = L_{[a,b]}[\gamma]$ for every diffeomorphism $\text{ᚱ}\colon\mathbb{R}\to\mathbb{R}$. What does this imply for the Euler-Lagrange equations of the length Lagrangian $\mathcal{L}(\mathcal{X}_p) = \sqrt{\text{ᛇ}_\gamma\,g_p(\mathcal{X}_p,\mathcal{X}_p)}$?
    options:
      - text: 'If $\gamma$ solves them, so does every reparametrization $\gamma\circ\text{ᚱ}$: they fix the path, not the speed'
        correct: true
      - text: 'They have no solutions, since a reparametrized curve changes the length'
        feedback: |
          Reparametrizing does **not** change the length: that is exactly the invariance. Varying $\gamma\circ\text{ᚱ}$ is the same as varying $\gamma$ and reparametrizing, so stationarity passes from one to the other.
      - text: 'They pick out the constant-speed parametrization'
        feedback: |
          That is the energy Lagrangian $\tfrac12 g(v,v)$, whose action is **not** reparametrization invariant. In the Euclidean plane $\gamma(\lambda) = (\lambda^2,0)$ solves the length's equations with speed $2\lambda$, not constant.
      - text: 'Nothing: invariance of $L$ says nothing about its stationary curves'
        feedback: |
          It says a lot: a deformation of $\gamma\circ\text{ᚱ}$ is a reparametrized deformation of $\gamma$, with the same length. So the derivatives in $\text{ᛊ}$ agree, and both curves are stationary or neither is.
    explanation: |
      The $d$ length equations cannot determine the $d$ functions $\gamma^m_\mathcal{U}(\lambda)$ completely: one free function, the speed profile, always remains. That is why the next step chooses a parametrization (constant speed) before simplifying them.

  - type: mcq
    id: trap-minimum
    title: Stationary means shortest?
    prompt: |
      A smooth curve $\gamma$ with $\text{ᛇ}_\gamma\neq0$ satisfies the Euler-Lagrange equations of the length Lagrangian on $[a,b]$, so $\frac{d}{d\text{ᛊ}}L_{[a,b]}[\gamma_{\text{ᛊ}}]\big|_0 = 0$ for every variation with fixed endpoints. Which conclusion is justified?
    options:
      - text: 'Only that the length has no first-order change: it may be a minimum, a maximum or a saddle'
        correct: true
      - text: '$\gamma$ is the shortest curve between its endpoints'
        feedback: |
          Tempting, from the Euclidean segment. But a zero derivative is also met at a maximum: in Minkowski the inertial worldline of the twin at rest has proper time $10$, every slanted timelike detour less (twin B: $8$). There a solution of the equations is a **maximum**.
      - text: '$\gamma$ is the longest curve between its endpoints'
        feedback: |
          That holds for the timelike inertial worldline in Minkowski, not in general: in the Euclidean plane the straight segment, which solves the equations, is the **shortest** curve, as the hook showed ($L = 1 + \tfrac{\pi^2}{4}\text{ᛊ}^2$).
      - text: 'Nothing about first order: the equations only control the second derivative'
        feedback: |
          It is the other way round. The equations are equivalent to the vanishing of the **first** derivative $\frac{dL}{d\text{ᛊ}}\big|_0$; whether it is a minimum or maximum would need the second derivative, which they do not control.
    explanation: |
      Like $f'(x_0) = 0$ for a function of one variable, stationarity says nothing about which kind of critical point it is. Telling minima from maxima would need the second derivative $\frac{d^2L}{d\text{ᛊ}^2}$.

  - type: mcq
    id: trap-free-end
    title: Letting an endpoint move
    prompt: |
      In the derivation of the Euler-Lagrange equations, integration by parts gives, for each $m$, the boundary term $P_m(b)\,\text{ᛉ}^m(b) - P_m(a)\,\text{ᛉ}^m(a)$, with $P_m := (\partial_{d+m}\mathcal{L}_\mathscr{X})(\gamma_\mathcal{U};\dot\gamma_\mathcal{U})$. Suppose the endpoint at $b$ were **free**: shapes with $\text{ᛉ}(a) = 0$ but any $\text{ᛉ}(b)$. What changes?
    options:
      - text: 'The Euler-Lagrange equations still hold, plus a new condition $P_m(b) = 0$ for every $m$'
        correct: true
      - text: 'Nothing: the boundary term always vanishes'
        feedback: |
          It vanished only because $\text{ᛉ}(b) = 0$. With $\text{ᛉ}^m(b)$ free, the term $P_m(b)\,\text{ᛉ}^m(b)$ survives and must vanish separately for every choice of $\text{ᛉ}^m(b)$.
      - text: 'The Euler-Lagrange equations no longer hold'
        feedback: |
          Shapes that vanish at both ends are still allowed among the free-end ones, and they alone force the Euler-Lagrange equations. The free end adds a condition; it removes none.
      - text: 'The new condition is $Q_m(b) = 0$, with $Q_m := (\partial_m\mathcal{L}_\mathscr{X})(\gamma_\mathcal{U};\dot\gamma_\mathcal{U})$'
        feedback: |
          The position derivative $Q_m$ stays inside the integral; only the velocity term was integrated by parts, so only $P_m$ appears at the boundary.
    explanation: |
      First the shapes with $\text{ᛉ}(b) = 0$ give the equations, which kill the integral; then any $\text{ᛉ}(b)$ leaves $\sum_mP_m(b)\,\text{ᛉ}^m(b) = 0$. For the length, $P_m\neq0$ (it is $\text{ᛇ}_\gamma\,g_{mj}\dot\gamma^j/s_\gamma$, a nonzero covector), so no free-end stationary curve exists: fixing the endpoints is what makes the problem sensible.

  - type: text
    id: chart-independence
    title: Does the chart matter?
    body: |
      The variation was built through the chart $\mathscr{X}$. Take another chart $(\mathcal{V},\mathscr{Y})$ also containing $\gamma([a,b])$, with representative $\gamma_\mathcal{V} := \mathscr{Y}\circ\gamma$, and a family linear in $\mathscr{Y}$: $\mathscr{Y}\circ\gamma_{\text{ᛊ}} = \gamma_\mathcal{V} + \text{ᛊ}\,\text{ᛉ}_\mathscr{Y}$, with $\text{ᛉ}_\mathscr{Y}(a) = \text{ᛉ}_\mathscr{Y}(b) = 0$. Seen in $\mathscr{X}$ it is not linear, but Taylor in $\text{ᛊ}$ gives
      $$\mathscr{X}\circ\gamma_{\text{ᛊ}} = \gamma_\mathcal{U} + \text{ᛊ}\,\tilde{\text{ᛉ}} + O(\text{ᛊ}^2),$$
      with $\tilde{\text{ᛉ}}^i = (\text{ᛞ}_{\mathcal{U}\mathcal{V}})^i_j\,\text{ᛉ}_\mathscr{Y}^j$ (the Jacobian $\partial\mathscr{X}^i/\partial\mathscr{Y}^j$ along $\gamma$), again $0$ at $a$ and $b$.

      The chain rule step of the derivation only used the first $\text{ᛊ}$-derivative of the slots at $\text{ᛊ} = 0$; the $O(\text{ᛊ}^2)$ terms drop out. So this $\mathscr{Y}$-family has the same $\frac{dL}{d\text{ᛊ}}\big|_0$ as the $\mathscr{X}$-variation with shape $\tilde{\text{ᛉ}}$. Stationary for all $\mathscr{X}$-variations implies stationary for all $\mathscr{Y}$-variations, and by symmetry conversely: **being a geodesic does not depend on the chart.**

  - type: mcq
    id: trap-chart
    title: Chart-made deformations
    prompt: |
      A variation $\gamma_{\text{ᛊ}} = \mathscr{X}^{-1}(\gamma_\mathcal{U}+\text{ᛊ}\,\text{ᛉ})$ is linear in $\text{ᛊ}$ in the chart $\mathscr{X}$ but in general not in another chart $\mathscr{Y}$. In the Euclidean plane, the length Lagrangian has no position slots in cartesian components but a position slot $r$ in polar ones. What follows for "being a geodesic"?
    options:
      - text: 'It is chart independent: $\frac{dL}{d\text{ᛊ}}\big|_0$ only sees the first-order shape, which each chart turns into another allowed shape'
        correct: true
      - text: 'A curve can be a geodesic in the cartesian chart but not in the polar one'
        feedback: |
          The length $L_{[a,b]}[\gamma_{\text{ᛊ}}]$ is a number attached to curves on the manifold, and a family linear in polar coordinates is, in cartesian ones, $\gamma_\mathcal{U}+\text{ᛊ}\,\tilde{\text{ᛉ}}+O(\text{ᛊ}^2)$ with $\tilde{\text{ᛉ}}$ vanishing at the endpoints. The first derivative ignores the $O(\text{ᛊ}^2)$ part, so the two charts agree.
      - text: 'It is chart independent because the Euler-Lagrange equations look the same in every chart'
        feedback: |
          The equations do **not** look the same: in cartesian components the position term is $0$, in polar ones $\partial_r\mathcal{L}_\mathscr{Y} = r(\beta^2)^2/\mathcal{L}_\mathscr{Y}$ is not. Different-looking equations, same solutions: the reason is the first-order argument.
      - text: 'It depends on the chart, so one fixes the cartesian chart by convention'
        feedback: |
          A general manifold has no cartesian chart, and no convention is needed: a family linear in one chart is linear to first order in any other, with a shape that still vanishes at the endpoints, and only first order enters $\frac{dL}{d\text{ᛊ}}\big|_0$.
    explanation: |
      Chart-dependent tools, chart-independent result. The individual terms $\partial_m\mathcal{L}_\mathscr{X}$ and $\frac{d}{d\lambda}\partial_{d+m}\mathcal{L}_\mathscr{X}$ change from chart to chart, but their difference vanishes in one chart exactly when it vanishes in every other.

  - type: text
    id: summary
    body: |
      **Next:** plug the metric's Lagrangian $\sqrt{\text{ᛇ}_\gamma\,g_{ij}\beta^i\beta^j}$ into the Euler-Lagrange equations and simplify, using the freedom to run the curve at constant speed. A guided problem: out come $d$ second-order equations for $\gamma_\mathcal{U}$, and a combination of derivatives of $g_{ij}$ that looks very much like the Christoffel symbols of Level 6: the **geodesic equation**.
