id: ch07-length
title: Length and Geodesics · Part 1
kind: concept
own: |
  - **Setting**: $(\mathcal{M},g)$ a metric manifold with a chart, $g_{ij}$ the components of $g$, $\dot\gamma^i$ the chart components of the velocity $v_\gamma$. Examples: the Euclidean plane ($g_{ij} = \delta_{ij}$) and the Minkowski plane with coordinates $(t,x)$, $g_{ij} = \mathrm{diag}(-1,1)$, speeds as fractions of light speed.
  - **Sign and speed** of a $C^1$ curve $\gamma$ with velocity $v_\gamma$ on a metric manifold $(\mathcal{M},g)$: the sign rune $\text{ᛇ}_\gamma(\lambda) := \mathrm{sgn}\big(g(v_\gamma,v_\gamma)\big)\in\{-1,0,+1\}$ and
  {{ $$s_\gamma := \sqrt{\text{ᛇ}_\gamma\,g(v_\gamma,v_\gamma)}$$ }}
  in a chart $s_\gamma = \sqrt{\text{ᛇ}_\gamma\,g_{ij}\,\dot\gamma^i\dot\gamma^j}$. Riemannian: $\text{ᛇ}_\gamma = +1$ wherever $v_\gamma\neq0$. Indefinite: $\text{ᛇ}_\gamma = 0$ also on null velocities, and $s_\gamma$ is taken piecewise, on intervals where $\text{ᛇ}_\gamma$ is constant.
  - **Length** between parameter values $a<b$, a functional (it eats a whole curve):
  {{ $$L_{[a,b]}[\gamma] := \int_a^b s_\gamma(\lambda)\,d\lambda$$ }}
  In the Euclidean plane, a circle of radius $5$ once round: $10\pi$, in any chart. A light ray has length $0$. For a timelike worldline in Minkowski ($\text{ᛇ}_\gamma = -1$) it is the time the clock reads: at rest $1$ per unit of $t$, at speed $v$ only {{ $\sqrt{1-v^2} = 1/\kappa$ }}, with the Lorentz factor $\kappa := 1/\sqrt{1-v^2}$ (twin paradox: $8$ against $10$ at $v = \tfrac35$: a twin who goes out and back at that speed, $5$ units of $t$ each way, reads $8$ when the stay-at-home twin reads $10$).

cards:
  - type: text
    id: hook
    title: Two runners on one track
    body: |
      Recall the Euclidean metric on the plane with points $(a,b)$: in the cartesian chart $\mathscr{X}$, $g = dx^1\otimes dx^1 + dx^2\otimes dx^2$, and a vector $\mathcal{X}_p$ has magnitude $\sqrt{g_p(\mathcal{X}_p,\mathcal{X}_p)}$.

      Two runners go once round the circle of radius $5$ about the origin:
      $$\gamma(\lambda) = (5\cos\lambda,\ 5\sin\lambda),$$
      for $\lambda\in[0,2\pi]$, and twice as fast,
      $$\delta(\lambda) = (5\cos2\lambda,\ 5\sin2\lambda),$$
      for $\lambda\in[0,\pi]$. The parameter $\lambda$ is a stopwatch: $\delta$ finishes in half the time.

      Before any theory, guess: if "length" means "add up the magnitude of the velocity along the run", do the two runs get the same length?

  - type: mcq
    id: hook-guess
    title: Guess the lengths
    prompt: |
      On the Euclidean plane, $\gamma(\lambda) = (5\cos\lambda, 5\sin\lambda)$ for $\lambda\in[0,2\pi]$ and $\delta(\lambda) = (5\cos2\lambda, 5\sin2\lambda)$ for $\lambda\in[0,\pi]$ both go once round the circle of radius $5$. "Length" = integral over $\lambda$ of the magnitude $\sqrt{g(v,v)}$ of the velocity $v$. Compare the two lengths.
    options:
      - text: 'They agree: $\delta$ is twice as fast for half as long'
        correct: true
      - text: '$\delta$''s run is twice as long, because its velocity is twice as big'
        feedback: |
          The magnitude of $\delta$'s velocity is indeed $10$ against $5$, but it is integrated over $[0,\pi]$ instead of $[0,2\pi]$. Doubling the integrand and halving the interval cancel: $10\cdot\pi = 5\cdot2\pi$.
      - text: '$\gamma$''s run is twice as long, because it lasts twice as long'
        feedback: |
          Duration alone is the parameter range, $2\pi$ against $\pi$. That is how long the stopwatch ran, not how far the runner went; the integrand, the magnitude of the velocity, is twice as big for $\delta$.
      - text: 'It depends on the chart used to compute the magnitudes'
        feedback: |
          $g_p(v,v)$ is a tensor evaluated on a vector: a number that every chart agrees on. Polar and cartesian components give the same magnitude; the lesson checks it.
    explanation: |
      Both give $10\pi$, the circumference. Part 2 of this lesson proves this is no accident: the length does not care how fast the curve is run, only which path it traces. But first a problem with the square root.

  - type: text
    id: clock-hook
    title: A clock breaks the square root
    body: |
      Recall the Minkowski metric on $\mathbb{R}^2$ with points $(t,a)$ (time, position, $c = 1$): in the chart $\mathscr{X}(t,a) = (t,a)$,
      $$\eta = -dx^1\otimes dx^1 + dx^2\otimes dx^2.$$
      A clock sitting at the origin traces the **worldline** (its curve in spacetime)
      $$\gamma(\lambda) = (\lambda,\ 0).$$
      Try the same recipe: compute $\eta(v_\gamma, v_\gamma)$ and take its square root.

  - type: numeric
    id: clock-value
    title: The clock's "magnitude squared"
    prompt: |
      Minkowski metric $\eta = -dx^1\otimes dx^1 + dx^2\otimes dx^2$ on $\mathbb{R}^2$ with points $(t,a)$ and chart $\mathscr{X} = (t,a)$. A clock at rest has worldline $\gamma(\lambda) = (\lambda, 0)$, so its velocity has components $(\dot\gamma^1,\dot\gamma^2) = (1,0)$. What is $\eta(v_\gamma,v_\gamma)$?
    answer: -1
    wrong:
      - { value: 1, feedback: 'The first term of $\eta$ carries a minus sign: $\eta(v_\gamma,v_\gamma) = -(\dot\gamma^1)^2 + (\dot\gamma^2)^2 = -1 + 0$.' }
      - { value: 0, feedback: '$0$ is the value for a light ray, whose velocity $(1,1)$ makes the two terms cancel. Here only the first term contributes: $-(1)^2 + 0^2 = -1$.' }
    hint: Evaluate $-(\dot\gamma^1)^2 + (\dot\gamma^2)^2$.
    explanation: |
      $\eta(v_\gamma,v_\gamma) = -1$ at every $\lambda$, and $\sqrt{-1}$ is not a real number. Yet a clock at rest should accumulate exactly one unit of time per unit of $t$. The fix: take the square root of $|\eta(v_\gamma,v_\gamma)|$, written with a sign.

  - type: text
    id: sign-speed
    title: Sign and speed
    body: |
      Let $\gamma\colon\mathbb{R}\to\mathcal{M}$ be a curve, at least $C^1$ (continuously differentiable), with velocity $v_\gamma(\lambda) := v_{\gamma(\lambda)}\in T_{\gamma(\lambda)}\mathcal{M}$, on a manifold with a metric $g$. The **sign** of $\gamma$ is written with the rune $\text{ᛇ}$ (read "sign"):
      $$\text{ᛇ}_\gamma(\lambda) := \mathrm{sgn}\Big(g_{\gamma(\lambda)}\big(v_\gamma(\lambda),v_\gamma(\lambda)\big)\Big),$$
      where $\mathrm{sgn}$ (signum) gives $-1$, $0$ or $+1$ for a negative, zero or positive number. The **speed** of $\gamma$ is
      $$s_\gamma(\lambda) := \sqrt{\text{ᛇ}_\gamma(\lambda)\,g_{\gamma(\lambda)}\big(v_\gamma,v_\gamma\big)}.$$
      The product $\text{ᛇ}\cdot g(v,v)$ is never negative, so the root always exists. In a chart $(\mathcal{U},\mathscr{X})$, with $\dot\gamma^i := (\mathscr{X}^i\circ\gamma)'$ the components of $v_\gamma$ and $g_{ij}$ evaluated at $\gamma(\lambda)$ (Einstein summation):
      $$s_\gamma = \sqrt{\text{ᛇ}_\gamma\,g_{ij}\,\dot\gamma^i\dot\gamma^j}.$$
      For a Riemannian metric, $\text{ᛇ}_\gamma = +1$ wherever $v_\gamma\neq0$: the sign is only needed for indefinite metrics.

  - type: numeric
    id: speed-delta
    title: The fast runner's speed
    prompt: |
      Euclidean plane, cartesian chart, $g_{ij} = \mathrm{diag}(1,1)$. The curve $\delta(\lambda) = (5\cos2\lambda,\ 5\sin2\lambda)$ has velocity components $(\dot\delta^1,\dot\delta^2) = (-10\sin2\lambda,\ 10\cos2\lambda)$. What is its speed $s_\delta(\lambda) = \sqrt{\text{ᛇ}_\delta\,g_{ij}\dot\delta^i\dot\delta^j}$ (here $\text{ᛇ}_\delta = +1$)?
    answer: 10
    wrong:
      - { value: 100, feedback: '$100$ is $g_{ij}\dot\delta^i\dot\delta^j = 100\sin^2 2\lambda + 100\cos^2 2\lambda$, the speed squared. Take the square root.' }
      - { value: 5, feedback: '$5$ is the radius, and the speed of the slow runner $\gamma(\lambda) = (5\cos\lambda,5\sin\lambda)$. The factor $2$ inside $\cos2\lambda$ comes out of each derivative.' }
    hint: $\sin^2 + \cos^2 = 1$.
    explanation: |
      $s_\delta = \sqrt{100(\sin^22\lambda + \cos^22\lambda)} = 10$, constant. The slow runner has $s_\gamma = 5$. The speed is a property of the **parametrized** curve: same circle, different speeds.

  - type: text
    id: length-def
    title: The length functional
    body: |
      The **length** of $\gamma$ between parameter values $a<b$ adds up the speed:
      $$L_{[a,b]}[\gamma] := \int_a^b s_\gamma(\lambda)\,d\lambda.$$
      $L_{[a,b]}$ is a **functional**: its input is not a number but a whole curve (any $C^1$ curve), its output is a real number. Square brackets $[\gamma]$ mark the curve argument.

      Requirements: $s_\gamma$ must be integrable on $[a,b]$. For a $C^1$ curve and a Riemannian metric, $s_\gamma$ is the root of a continuous non-negative function, hence continuous, and the integral exists. Nothing here uses a connection: the metric alone measures curves.

      For the runners: $L_{[0,2\pi]}[\gamma] = 5\cdot2\pi$ and $L_{[0,\pi]}[\delta] = 10\cdot\pi$, both $10\pi$.

  - type: numeric
    id: circle-polar
    title: The circle in polar components
    prompt: |
      Euclidean plane, polar chart $\mathscr{Y} = (r,\theta)$, where $g$ has components $(g_\mathscr{Y})_{kl} = \mathrm{diag}(1, r^2)$. The curve $\gamma(\lambda) = (5\cos\lambda, 5\sin\lambda)$ has polar components $r = 5$, $\theta = \lambda$ (up to a constant $2\pi$ after crossing the cut), so $(\dot\gamma^1,\dot\gamma^2) = (0,1)$. Compute $L_{[0,2\pi]}[\gamma]$.
    answer: 31.4159
    tolerance: 0.01
    answerText: '10\pi \approx 31.416'
    wrong:
      - { value: 6.2832, feedback: 'That is $\int_0^{2\pi}1\,d\lambda$: the component $(g_\mathscr{Y})_{22} = r^2$ was dropped. With it, $g_{kl}\dot\gamma^k\dot\gamma^l = 25$ and the speed is $5$.' }
      - { value: 157.08, feedback: 'That is $\int_0^{2\pi}25\,d\lambda$, the integral of $g(v_\gamma,v_\gamma)$ without the square root. The speed is $\sqrt{25} = 5$.' }
    hint: $g_{kl}\dot\gamma^k\dot\gamma^l = 1\cdot0^2 + r^2\cdot1^2$ with $r = 5$.
    explanation: |
      $s_\gamma = \sqrt{0 + 25\cdot1} = 5$, and $L = 5\cdot2\pi = 10\pi$, the same as in cartesian components, where $\dot\gamma = (-5\sin\lambda, 5\cos\lambda)$ and $s_\gamma = \sqrt{25} = 5$. The two charts give the same speed because $g(v_\gamma,v_\gamma)$ is a scalar. (The polar chart misses the point $(-5,0)$ on its cut; leaving out one parameter value does not change an integral.)

  - type: mcq
    id: polar-slip
    title: A speed in polar components
    prompt: |
      Euclidean plane, polar chart $(r,\theta)$ with $(g_\mathscr{Y})_{kl} = \mathrm{diag}(1, r^2)$. The curve with polar components $r = 5$, $\theta = 2\lambda$ has components $(\dot\gamma^1,\dot\gamma^2) = (0, 2)$. What is its speed?
    options:
      - text: '$10$'
        correct: true
      - text: '$2$'
        feedback: |
          $\sqrt{(\dot\gamma^1)^2 + (\dot\gamma^2)^2} = 2$ treats the polar components as if the metric were $\mathrm{diag}(1,1)$. The angle component is weighted by $g_{22} = r^2 = 25$: an angle change of $1$ moves you $5$ units on this circle.
      - text: '$100$'
        feedback: |
          $100 = g_{kl}\dot\gamma^k\dot\gamma^l = 25\cdot4$ is $g(v,v)$, the speed squared. The speed is its square root.
      - text: '$\sqrt{29}$'
        feedback: |
          $\sqrt{25 + 4}$ adds the metric entry and the squared component instead of multiplying them. The term is $g_{22}\,(\dot\gamma^2)^2 = 25\cdot4$.
    explanation: |
      $s = \sqrt{1\cdot0^2 + 25\cdot2^2} = \sqrt{100} = 10$: the fast runner $\delta$ again, now in polar components, with the same speed as in cartesian ones.

  - type: text
    id: null-curve
    title: Curves of length zero
    body: |
      Back to Minkowski, $\eta_{ij} = \mathrm{diag}(-1,1)$. A light ray through the origin traces
      $$\gamma(\lambda) = (\lambda,\ \lambda),$$
      with components $\dot\gamma = (1,1)$, so
      $$\eta(v_\gamma,v_\gamma) = -1 + 1 = 0.$$
      Then $\text{ᛇ}_\gamma = 0$, $s_\gamma = 0$, and $L_{[a,b]}[\gamma] = 0$ for every $a<b$: a **null** (lightlike) curve has zero length, although it moves and its velocity is not zero. In a Riemannian metric this is impossible: $s_\gamma = 0$ only where $v_\gamma = 0$.

      Recall the names for this sign convention: a vector $\mathcal{X}$ is **timelike** if $\eta(\mathcal{X},\mathcal{X})<0$ ($\text{ᛇ} = -1$), **spacelike** if $>0$ ($\text{ᛇ} = +1$), **lightlike** if $=0$.

  - type: mcq
    id: null-which
    title: Which have length zero?
    multiple: true
    prompt: |
      Minkowski metric on $\mathbb{R}^2$, points $(t,a)$, $\eta(v,v) = -(\dot\gamma^1)^2 + (\dot\gamma^2)^2$. Select **all** curves with $L_{[0,1]}[\gamma] = 0$.
    options:
      - text: '$\gamma(\lambda) = (\lambda,\ \lambda)$'
        correct: true
      - text: '$\gamma(\lambda) = (\lambda,\ -\lambda)$'
        correct: true
      - text: '$\gamma(\lambda) = (0,\ 0)$'
        correct: true
      - text: '$\gamma(\lambda) = (\lambda,\ 0)$'
        feedback: |
          The clock at rest: $\eta(v,v) = -1$, $\text{ᛇ} = -1$, speed $\sqrt{(-1)(-1)} = 1$, length $1$. A negative $\eta(v,v)$ gives a positive speed, not zero.
      - text: '$\gamma(\lambda) = (0,\ \lambda)$'
        feedback: |
          $\eta(v,v) = +1$: spacelike, speed $1$, length $1$. It is a ruler lying along the $a$-axis at the instant $t = 0$.
      - text: '$\gamma(\lambda) = (2\lambda,\ \lambda)$'
        feedback: |
          $\eta(v,v) = -4 + 1 = -3 \neq 0$: timelike, speed $\sqrt3$, length $\sqrt3$. Only velocities with $|\dot\gamma^1| = |\dot\gamma^2|$ are null.
    explanation: |
      The two light rays have null velocity ($-1+1 = 0$); the constant curve has $v_\gamma = 0$, so $\text{ᛇ}_\gamma = 0$ too. Zero length does not mean "standing still" in Minkowski.

  - type: text
    id: piecewise
    title: A sign that changes
    body: |
      $\text{ᛇ}_\gamma$ need not be constant. In Minkowski, take
      $$\gamma(\lambda) = \big(\lambda,\ \tfrac12\lambda^2\big),$$
      with $\dot\gamma = (1, \lambda)$ and
      $$\eta(v_\gamma,v_\gamma) = \lambda^2 - 1.$$
      For $0\le\lambda<1$ it is negative ($\text{ᛇ}_\gamma = -1$, timelike, slower than light), at $\lambda = 1$ it is zero, beyond it positive ($\text{ᛇ}_\gamma = +1$, faster than light). So
      $$s_\gamma = \sqrt{1-\lambda^2} \text{ on } [0,1],$$
      $$s_\gamma = \sqrt{\lambda^2-1} \text{ on } [1,\infty).$$
      For an indefinite metric, $s_\gamma$ is defined **piecewise**, on intervals where $\text{ᛇ}_\gamma$ is constant; mixing a timelike and a spacelike stretch in one length rarely means anything physical.

  - type: numeric
    id: piecewise-speed
    title: Speed after the switch
    prompt: |
      Minkowski metric, $\eta(v,v) = -(\dot\gamma^1)^2 + (\dot\gamma^2)^2$. The curve $\gamma(\lambda) = (\lambda, \tfrac12\lambda^2)$ has $\dot\gamma = (1,\lambda)$. What is its speed $s_\gamma = \sqrt{\text{ᛇ}_\gamma\,\eta(v_\gamma,v_\gamma)}$ at $\lambda = 2$?
    answer: 1.7321
    tolerance: 0.01
    answerText: '\sqrt3 \approx 1.732'
    wrong:
      - { value: 2.2361, feedback: '$\sqrt5 = \sqrt{1 + 4}$ uses the Euclidean $+$ sign on the first term. With $\eta$: $-1 + 4 = 3$.' }
      - { value: 3, feedback: '$3$ is $\eta(v_\gamma,v_\gamma)$ itself. The speed is its square root (with $\text{ᛇ}_\gamma = +1$).' }
    hint: $\eta(v,v) = -1 + \lambda^2$ at $\lambda = 2$; its sign is $\text{ᛇ}_\gamma$.
    explanation: |
      $\eta(v_\gamma,v_\gamma) = 3 > 0$, so $\text{ᛇ}_\gamma(2) = +1$ and $s_\gamma(2) = \sqrt3$. At $\lambda = 0$ instead, $\eta = -1$, $\text{ᛇ} = -1$ and $s_\gamma = 1$: the sign rune flips the negative value before the root.

  - type: text
    id: proper-time
    title: Length of a worldline is clock time
    body: |
      For a timelike worldline ($\text{ᛇ}_\gamma = -1$),
      $$s_\gamma = \sqrt{-\eta(v_\gamma,v_\gamma)},$$
      and its length $L$ is the **proper time** $\tau$: the time read by a clock carried along the worldline. (This is the physical interpretation of the metric, made a postulate when spacetime is set up in Level 10.)

      Check with the clock at rest, $\gamma(\lambda) = (\lambda,0)$: $\text{ᛇ}_\gamma = -1$, $s_\gamma = \sqrt{-(-1)} = 1$, so
      $$L_{[0,T]}[\gamma] = T.$$
      A clock at rest at $a = 0$ reads the coordinate time $t$: that is what the chart's $t$ means. Now let a clock move.

  - type: numeric
    id: moving-clock
    title: A moving clock
    prompt: |
      Minkowski metric on $\mathbb{R}^2$, points $(t,a)$, $\eta(v,v) = -(\dot\gamma^1)^2 + (\dot\gamma^2)^2$. A clock moves at speed $\tfrac35$ (in units of $c$): $\gamma(\lambda) = (\lambda,\ \tfrac35\lambda)$. How much proper time $L_{[0,5]}[\gamma]$ does it read between $t = 0$ and $t = 5$?
    answer: 4
    wrong:
      - { value: 5, feedback: '$5$ is the coordinate time elapsed, what a clock **at rest** reads. The moving clock has $\eta(v,v) = -1 + \tfrac{9}{25} = -\tfrac{16}{25}$ and speed $\tfrac45$.' }
      - { value: 5.831, feedback: '$\sqrt{34} = 5\sqrt{1 + \tfrac{9}{25}}$ is the Euclidean length of the segment as drawn on paper. Minkowski has a minus sign: $-1 + \tfrac{9}{25}$.' }
      - { value: 3.2, feedback: '$\tfrac{16}{25}\cdot5$ integrates $-\eta(v,v)$ without the square root. The speed is $\sqrt{16/25} = \tfrac45$.' }
    hint: $\text{ᛇ}_\gamma = -1$ and $s_\gamma = \sqrt{1 - (3/5)^2}$, constant.
    explanation: |
      $s_\gamma = \sqrt{1 - \tfrac{9}{25}} = \tfrac45$, so $L_{[0,5]} = 4$. In general $s_\gamma = \sqrt{1-v^2} = 1/\kappa$, with the Lorentz factor $\kappa := 1/\sqrt{1-v^2}$ ($\kappa = \tfrac54$ here): **time dilation** is the metric measuring a slanted worldline.

  - type: numeric
    id: twin
    title: The twin paradox in numbers
    prompt: |
      Minkowski metric, points $(t,a)$. Twin A stays at $a = 0$ from $t = 0$ to $t = 10$. Twin B flies out at speed $\tfrac35$, $\gamma(\lambda) = (\lambda, \tfrac35\lambda)$ for $\lambda\in[0,5]$, turns at the event $(5,3)$ and flies back, $\gamma(\lambda) = (\lambda, \tfrac35(10-\lambda))$ for $\lambda\in[5,10]$, meeting A at $(10,0)$. How much proper time does B's clock read in total? (The worldline has a corner at $\lambda = 5$: compute the two stretches separately and add.)
    answer: 8
    wrong:
      - { value: 10, feedback: '$10$ is what twin A reads. On both stretches of B, $\eta(v,v) = -1 + \tfrac{9}{25}$ (the sign of $\dot\gamma^2$ does not matter, it is squared), so B''s speed is $\tfrac45$.' }
      - { value: 4, feedback: '$4$ is only the outbound stretch $[0,5]$. The return stretch $[5,10]$ has the same speed $\tfrac45$ and adds another $4$.' }
    hint: Speed $\tfrac45$ on both stretches; total parameter range $10$.
    explanation: |
      $L = 4 + 4 = 8 = 10/\kappa$ with $\kappa = \tfrac54$. The twins meet again with different ages, $8$ against $10$. No paradox: proper time is the length of a worldline, and the two worldlines between the same two events are different curves, so they have different lengths. B's corner is where B (not A) feels the acceleration.

  - type: mcq
    id: twin-longest
    title: Which worldline is longest?
    prompt: |
      Minkowski metric on $\mathbb{R}^2$, points $(t,a)$, $\eta = -dx^1\otimes dx^1 + dx^2\otimes dx^2$. Among timelike worldlines from the event $(0,0)$ to the event $(10,0)$ (twin A at rest reads $10$; twin B, out at speed $\tfrac35$ and back, reads $8$), which statement is right?
    options:
      - text: 'The straight worldline at rest has the most proper time; every slanted detour reads less'
        correct: true
      - text: 'B''s detour is longer, as on paper, so it reads more'
        feedback: |
          On paper (Euclidean picture) B's worldline is longer, $2\sqrt{34}\approx11.7$. But the Minkowski minus sign makes every bit of motion **subtract**: $s = \sqrt{1 - v^2}\le1$, with equality only at rest.
      - text: 'All timelike worldlines between the same events read the same time'
        feedback: |
          That would make time absolute, as in Newton. The computed values $10$ and $8$ differ: proper time depends on the worldline.
      - text: 'Which one reads more depends on the chart'
        feedback: |
          $s_\gamma$ is built from $g(v_\gamma,v_\gamma)$, a scalar, so $L$ is the same in every chart. Both twins hold their clocks side by side at $(10,0)$ and compare: a chart-independent fact.
    explanation: |
      Along any timelike worldline from $(0,0)$ to $(10,0)$, $s = \sqrt{1-v^2}\le1$, so $L\le10$, with $10$ only for the clock at rest. In Euclidean space the straight segment is the **shortest** curve; in Minkowski the straight (inertial) worldline is the **longest**. Keep this for the end of the lesson.


  - type: text
    id: summary
    body: |
      **Next:** Length and Geodesics · Part 2 asks what happens when the same path is run at a different speed (the speed changes, the length does not), and uses the length to define the straightest curves, the **geodesics**.
