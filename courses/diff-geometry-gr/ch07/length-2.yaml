id: ch07-length-2
title: Length and Geodesics · Part 2
kind: concept
own: |
  - **Setting**: $(\mathcal{M},g)$ a metric manifold with a chart, $g_{ij}$ the components of $g$, $\dot\gamma^i$ the chart components of the velocity $v_\gamma$. Examples: the Euclidean plane ($g_{ij} = \delta_{ij}$) and the Minkowski plane with coordinates $(t,x)$, $g_{ij} = \mathrm{diag}(-1,1)$, speeds as fractions of light speed.
  - **Recalled**: on a metric manifold $(\mathcal{M},g)$ a $C^1$ curve $\gamma$ with velocity $v_\gamma$ has sign $\text{ᛇ}_\gamma = \mathrm{sgn}\,g(v_\gamma,v_\gamma)$, speed $s_\gamma = \sqrt{\text{ᛇ}_\gamma\,g(v_\gamma,v_\gamma)}$ and length $L_{[a,b]}[\gamma] = \int_a^b s_\gamma\,d\lambda$ (the proper time of a timelike worldline).
  - **Reparametrization**: a diffeomorphism $\text{ᚱ}\colon\mathbb{R}\to\mathbb{R}$ ($\text{ᚱ}'\neq0$, so orientation preserving or reversing), $\delta := \gamma\circ\text{ᚱ}$. The speed is **not** invariant:
  {{ $$s_\delta(\mu) = |\text{ᚱ}'(\mu)|\,s_\gamma\big(\text{ᚱ}(\mu)\big)$$ }}
  but the factor $|\text{ᚱ}'|$ is exactly the one the substitution $\lambda = \text{ᚱ}(\mu)$ needs, so
  {{ $$L_{\text{ᚱ}^{-1}([a,b])}[\gamma\circ\text{ᚱ}] = L_{[a,b]}[\gamma]$$ }}
  The length belongs to the path traced (counted as often as it is traced, in either direction); $\int g(v_\gamma,v_\gamma)\,d\lambda$, without the root, does not.
  - **Geodesics** (made precise next): curves whose length is {{ stationary }} under small deformations with fixed endpoints; in Minkowski space the inertial worldline has the **most** proper time ($10$ against $8$ for the twin who goes out and back at speed $\tfrac35$), so "stationary", not "shortest".

cards:
  - type: text
    id: recall-length
    tag: Recall
    title: 'Recall: sign, speed and length'
    body: |
      Recall, from the lesson Length and Geodesics · Part 1: on a manifold with a metric $g$, a $C^1$ curve $\gamma$ with velocity $v_\gamma$ has **sign** $\text{ᛇ}_\gamma := \mathrm{sgn}\,g(v_\gamma,v_\gamma)\in\{-1,0,+1\}$, **speed**
      $$s_\gamma := \sqrt{\text{ᛇ}_\gamma\,g(v_\gamma,v_\gamma)},$$
      and **length** (a functional of the whole curve)
      $$L_{[a,b]}[\gamma] := \int_a^b s_\gamma(\lambda)\,d\lambda.$$
      On the Euclidean plane ($g_{ij} = \delta_{ij}$ in the cartesian chart) two runners go once round the circle of radius $5$: $\gamma(\lambda) = (5\cos\lambda, 5\sin\lambda)$ on $[0,2\pi]$ with speed $5$, and $\delta(\lambda) = (5\cos2\lambda, 5\sin2\lambda)$ on $[0,\pi]$ with speed $10$, both of length $10\pi$. On the Minkowski plane with coordinates $(t,a)$ and $\eta = \mathrm{diag}(-1,1)$, the length of a timelike worldline is the proper time read by a clock carried along it, $\sqrt{1-v^2}$ per unit of $t$ at speed $v$: twin A at rest from $t=0$ to $t=10$ reads $10$, twin B out and back at $v = \tfrac35$ reads $8$. Null curves (light rays, $\eta(v,v) = 0$) have length $0$.

  - type: text
    id: reparam
    title: Running the same path differently
    body: |
      Recall the rune $\text{ᚱ}$ (read "R", for reparametrization): a function $\text{ᚱ}\colon\mathbb{R}\to\mathbb{R}$, $\mu\mapsto\text{ᚱ}(\mu)$, and the new curve
      $$\delta := \gamma\circ\text{ᚱ},$$
      which visits the points of $\gamma$, with the new parameter $\mu$. Here $\text{ᚱ}$ must be a **diffeomorphism** (smooth bijection with smooth inverse), equivalently a smooth bijection with $\text{ᚱ}'(\mu)\neq0$ everywhere. ($\text{ᚱ}(\mu) = \mu^3$ is a smooth bijection but fails: $\text{ᚱ}'(0) = 0$ and $\mu = \lambda^{1/3}$ is not differentiable at $0$.)

      $\text{ᚱ}'$ is continuous and never $0$, so it keeps one sign: $\text{ᚱ}$ is **orientation preserving** ($\text{ᚱ}'>0$) or **orientation reversing** ($\text{ᚱ}'<0$). The parameter interval of $\delta$ is $[\tilde a,\tilde b] := \text{ᚱ}^{-1}([a,b])$, with $\text{ᚱ}(\tilde a) = a$, $\text{ᚱ}(\tilde b) = b$ if preserving and $\text{ᚱ}(\tilde a) = b$, $\text{ᚱ}(\tilde b) = a$ if reversing.

      The runners: $\delta(\mu) = \gamma(2\mu)$, so $\text{ᚱ}(\mu) = 2\mu$ and $\text{ᚱ}^{-1}([0,2\pi]) = [0,\pi]$. Recall also how velocities change (chain rule on $f\circ\gamma\circ\text{ᚱ}$):
      $$v_\delta(\mu) = \text{ᚱ}'(\mu)\,v_\gamma\big(\text{ᚱ}(\mu)\big).$$

  - type: mcq
    id: speed-reparam
    title: How the speed changes
    prompt: |
      $\gamma$ is a curve on a manifold with metric $g$, $\text{ᚱ}\colon\mathbb{R}\to\mathbb{R}$ a reparametrization ($\text{ᚱ}'\neq0$) and $\delta := \gamma\circ\text{ᚱ}$, so that $v_\delta(\mu) = \text{ᚱ}'(\mu)\,v_\gamma(\text{ᚱ}(\mu))$. With the speed $s := \sqrt{\text{ᛇ}\,g(v,v)}$, what is $s_\delta(\mu)$?
    options:
      - text: '$|\text{ᚱ}''(\mu)|\,s_\gamma\big(\text{ᚱ}(\mu)\big)$'
        correct: true
      - text: '$\text{ᚱ}''(\mu)\,s_\gamma\big(\text{ᚱ}(\mu)\big)$'
        feedback: |
          For an orientation reversing $\text{ᚱ}$ this would be a negative speed. The root sees $\text{ᚱ}'(\mu)^2$, and $\sqrt{\text{ᚱ}'^2} = |\text{ᚱ}'|$.
      - text: '$\text{ᚱ}''(\mu)^2\,s_\gamma\big(\text{ᚱ}(\mu)\big)$'
        feedback: |
          $\text{ᚱ}'^2$ is how $g(v,v)$, the speed **squared**, scales (by bilinearity). The speed is its root, so the factor is $|\text{ᚱ}'|$.
      - text: '$s_\gamma\big(\text{ᚱ}(\mu)\big)$: the speed does not change'
        feedback: |
          The runners refute it: $\delta(\mu) = \gamma(2\mu)$ has speed $10$, while $\gamma$ has speed $5$ at the same point. The speed belongs to the parametrized curve.
    explanation: |
      By bilinearity, $g(v_\delta,v_\delta) = \text{ᚱ}'(\mu)^2\,g(v_\gamma,v_\gamma)$ at $\text{ᚱ}(\mu)$. Since $\text{ᚱ}'^2>0$, both have the same sign: $\text{ᛇ}_\delta = \text{ᛇ}_\gamma\circ\text{ᚱ}$. Taking the root gives
      $$s_\delta(\mu) = |\text{ᚱ}'(\mu)|\,s_\gamma\big(\text{ᚱ}(\mu)\big).$$
      For the runners: $|\text{ᚱ}'| = 2$, $10 = 2\cdot5$.

  - type: text
    id: substitution
    title: The factor the integral needs
    body: |
      Integrate $s_\delta$ over $[\tilde a,\tilde b]$ and substitute $\lambda = \text{ᚱ}(\mu)$, so $d\lambda = \text{ᚱ}'(\mu)\,d\mu$. If $\text{ᚱ}$ preserves orientation, $|\text{ᚱ}'| = \text{ᚱ}'$ and the limits $\tilde a,\tilde b$ go to $a,b$:
      $$\begin{aligned} L_{[\tilde a,\tilde b]}[\delta] &= \int_{\tilde a}^{\tilde b} s_\gamma\big(\text{ᚱ}(\mu)\big)\,\text{ᚱ}'(\mu)\,d\mu\\ &= \int_a^b s_\gamma(\lambda)\,d\lambda\\ &= L_{[a,b]}[\gamma].\end{aligned}$$
      The factor $|\text{ᚱ}'|$ that spoils the speed is exactly the Jacobian $d\lambda/d\mu$ of the change of integration variable. The speed changes, its integral does not.

  - type: build
    id: reverse-build
    title: The reversed case
    prompt: |
      $\delta := \gamma\circ\text{ᚱ}$ with $\text{ᚱ}$ orientation **reversing** ($\text{ᚱ}'<0$, so $|\text{ᚱ}'| = -\text{ᚱ}'$), parameter interval $[\tilde a,\tilde b] = \text{ᚱ}^{-1}([a,b])$ with $\text{ᚱ}(\tilde a) = b$ and $\text{ᚱ}(\tilde b) = a$. Then
      $$L_{[\tilde a,\tilde b]}[\delta] = -\int_{\tilde a}^{\tilde b} s_\gamma\big(\text{ᚱ}(\mu)\big)\,\text{ᚱ}'(\mu)\,d\mu.$$
      Substitute $\lambda = \text{ᚱ}(\mu)$ and build the result.
    prefix: 'L_{[\tilde a,\tilde b]}[\delta] ='
    tiles: ['-', '\int_b^a', '\int_a^b', 's_\gamma(\lambda)\,d\lambda', '|\text{ᚱ}''(\lambda)|']
    answers:
      - ['-', '\int_b^a', 's_\gamma(\lambda)\,d\lambda']
      - ['\int_a^b', 's_\gamma(\lambda)\,d\lambda']
    wrong:
      - { answer: ['\int_b^a', 's_\gamma(\lambda)\,d\lambda'], feedback: 'The limits are right ($\text{ᚱ}(\tilde a) = b$), but the minus sign from $|\text{ᚱ}''| = -\text{ᚱ}''$ was dropped. Without it the result is $-L_{[a,b]}[\gamma]$, a negative length.' }
      - { answer: ['-', '\int_a^b', 's_\gamma(\lambda)\,d\lambda'], feedback: 'The lower limit $\tilde a$ goes to $\text{ᚱ}(\tilde a) = b$, not $a$: a reversing $\text{ᚱ}$ swaps the ends. With $\int_a^b$ and the minus sign the length would come out negative.' }
    hint: The new lower limit is $\text{ᚱ}(\tilde a)$; keep the minus sign in front.
    explanation: |
      $-\int_b^a s_\gamma\,d\lambda = \int_a^b s_\gamma\,d\lambda = L_{[a,b]}[\gamma]$: the minus sign from $|\text{ᚱ}'| = -\text{ᚱ}'$ undoes the swap of the limits. Without the square root in $s_\gamma$, the factor would be $\text{ᚱ}'$ and running a path backwards would flip the sign of its length.

  - type: order
    id: invariance-proof
    title: Reparametrization invariance
    prompt: |
      Prove that $L_{\text{ᚱ}^{-1}([a,b])}[\gamma\circ\text{ᚱ}] = L_{[a,b]}[\gamma]$ for every diffeomorphism $\text{ᚱ}\colon\mathbb{R}\to\mathbb{R}$ and $C^1$ curve $\gamma$ with speed $s_\gamma = \sqrt{\text{ᛇ}_\gamma\,g(v_\gamma,v_\gamma)}$. Put the steps in order.
    steps:
      - 'Set $\delta := \gamma\circ\text{ᚱ}$ and $[\tilde a,\tilde b] := \text{ᚱ}^{-1}([a,b])$. Since $\text{ᚱ}''$ is continuous and never $0$, it has one sign.'
      - 'Chain rule on $(f\circ\gamma)\circ\text{ᚱ}$ for every $f$: $v_\delta(\mu) = \text{ᚱ}''(\mu)\,v_\gamma(\text{ᚱ}(\mu))$.'
      - 'Bilinearity of $g$: $g(v_\delta,v_\delta) = \text{ᚱ}''(\mu)^2\,g(v_\gamma,v_\gamma)$, with the same sign, so $\text{ᛇ}_\delta = \text{ᛇ}_\gamma\circ\text{ᚱ}$.'
      - 'Square root: $s_\delta(\mu) = |\text{ᚱ}''(\mu)|\,s_\gamma(\text{ᚱ}(\mu))$.'
      - 'Substitute $\lambda = \text{ᚱ}(\mu)$, $d\lambda = \text{ᚱ}''(\mu)\,d\mu$, in $\int_{\tilde a}^{\tilde b}s_\delta\,d\mu$.'
      - 'Preserving: $|\text{ᚱ}''| = \text{ᚱ}''$ and the limits become $a, b$. Reversing: $|\text{ᚱ}''| = -\text{ᚱ}''$ and the limits become $b, a$; the minus sign swaps them back. Either way the result is $\int_a^b s_\gamma\,d\lambda$.'
    hint: Velocities first, then the metric, then the root, then the integral.
    explanation: |
      Each step uses one fact: the chain rule (velocities), bilinearity (the metric), $\sqrt{x^2} = |x|$ (the speed), substitution (the integral). Nothing needs a connection or a chart. Where $\text{ᛇ}_\gamma$ changes sign, apply the argument to each interval on which it is constant.

  - type: numeric
    id: trap-twice
    title: Twice round
    prompt: |
      Euclidean plane. The curve $\gamma(\lambda) = (5\cos\lambda, 5\sin\lambda)$ has constant speed $5$. Its image over $[0,4\pi]$ is the same set of points as over $[0,2\pi]$: the circle of radius $5$. What is $L_{[0,4\pi]}[\gamma]$?
    answer: 62.832
    tolerance: 0.02
    answerText: '20\pi \approx 62.83'
    wrong:
      - { value: 31.416, feedback: '$10\pi$ is the circumference, the length of going round **once**. Over $[0,4\pi]$ the curve goes round twice; the integral of a positive speed over a parameter range twice as long is twice as big.' }
    hint: $\int_0^{4\pi}5\,d\lambda$.
    explanation: |
      $L = 5\cdot4\pi = 20\pi$. The length is not a property of the image (the set of points): it is a property of the **path traced**, counted as often as it is traced. A reparametrization is a bijection of the parameter line, so it cannot change how many times the path is traced; that is why it cannot change the length.

  - type: mcq
    id: trap-backwards
    title: Running backwards
    prompt: |
      Euclidean plane. $\gamma(\lambda) = (5\cos\lambda, 5\sin\lambda)$ on $[0,2\pi]$ runs once round the circle of radius $5$ counterclockwise, with length $10\pi$. The reversed curve $\delta(\mu) := \gamma(-\mu)$ runs it clockwise. What is the length of $\delta$ over $\text{ᚱ}^{-1}([0,2\pi]) = [-2\pi, 0]$, where $\text{ᚱ}(\mu) = -\mu$?
    options:
      - text: '$10\pi$'
        correct: true
      - text: '$-10\pi$'
        feedback: |
          A negative length would need a negative speed, but $s_\delta = |\text{ᚱ}'|\,s_\gamma\circ\text{ᚱ} = |-1|\cdot5 = 5\ge0$, integrated from $-2\pi$ up to $0$. The square root in the speed makes the length blind to direction.
      - text: '$0$: the run goes back over the same points'
        feedback: |
          $\delta$ alone goes round once; nothing cancels. Zero would come from going round counterclockwise and then clockwise **and** counting the second run with a minus sign, which lengths never do.
      - text: 'Undefined, because $[-2\pi, 0]$ has its ends in the wrong order'
        feedback: |
          $\text{ᚱ}^{-1}([0,2\pi]) = [-2\pi,0]$ is an honest interval with $-2\pi < 0$. What reverses is which end maps to which: $\text{ᚱ}(-2\pi) = 2\pi = b$.
    explanation: |
      $s_\delta = 5$ on $[-2\pi,0]$, so $L = 5\cdot2\pi = 10\pi$. Reversing orientation is an allowed reparametrization, and the length is invariant under it.

  - type: numeric
    id: trap-energy
    title: Forgetting the square root
    prompt: |
      Euclidean plane. The runners $\gamma(\lambda) = (5\cos\lambda,5\sin\lambda)$ on $[0,2\pi]$ (speed $5$) and $\delta(\lambda) = (5\cos2\lambda,5\sin2\lambda)$ on $[0,\pi]$ (speed $10$) trace the same circle once. Instead of the length, compute $\int_0^\pi g(v_\delta,v_\delta)\,d\lambda$ for $\delta$, the integral of the speed **squared**.
    answer: 314.159
    tolerance: 0.1
    answerText: '100\pi \approx 314.16'
    wrong:
      - { value: 157.08, feedback: '$50\pi = \int_0^{2\pi}25\,d\lambda$ is the value for the slow runner $\gamma$. For $\delta$, $g(v_\delta,v_\delta) = 100$ over a range of $\pi$.' }
      - { value: 31.416, feedback: '$10\pi$ is the length, $\int s_\delta\,d\lambda$. The question integrates $g(v_\delta,v_\delta) = s_\delta^2 = 100$.' }
    hint: $g(v_\delta,v_\delta) = 10^2$ on $[0,\pi]$.
    explanation: |
      $\int_0^\pi 100\,d\lambda = 100\pi$, while the slow runner gives $\int_0^{2\pi}25\,d\lambda = 50\pi$. Same path, different values: under $\text{ᚱ}$ the integrand scales by $\text{ᚱ}'^2$ but $d\lambda$ only by $\text{ᚱ}'$. The integral of $g(v,v)$ depends on the parametrization; the length is the integral of its **root**, and only the root has the right scaling.

  - type: text
    id: geodesic
    title: Straight lines from lengths
    body: |
      Recall the question a metric was meant to answer: which connection does a ruler pick, and which curves are "straight"? The length gives a first answer without any connection.

      In the Euclidean plane, the straight segment is the **shortest** curve between its endpoints. So call a curve a **geodesic** if its length is **stationary** under every small deformation that keeps the endpoints fixed: deforming it a little changes $L$ only to second order, as at a minimum, a maximum or a saddle of an ordinary function.

      Why "stationary" and not "shortest": in Minkowski the inertial twin A, the straight worldline, has the **most** proper time ($10$ against $8$). A straight worldline is a maximum of $L$, not a minimum.

      One requirement: to differentiate $L$ under deformations, $s_\gamma = \sqrt{\text{ᛇ}_\gamma\,g(v,v)}$ must be differentiable, which fails where $g(v,v) = 0$. So geodesics in this sense need $\text{ᛇ}_\gamma\neq0$ along the curve; null curves are left out.

  - type: mcq
    id: geodesic-why
    title: Why "stationary"?
    prompt: |
      A **geodesic** is defined as a curve whose length $L_{[a,b]}$ is stationary (unchanged to first order) under small deformations with fixed endpoints, rather than one of least length. Which fact forces "stationary" instead of "shortest"?
    options:
      - text: 'In Minkowski, the inertial worldline between two events has the most proper time, not the least'
        correct: true
      - text: 'Lengths can be negative in Minkowski, so "shortest" has no meaning'
        feedback: |
          Lengths are never negative: $s_\gamma = \sqrt{\text{ᛇ}_\gamma\,g(v,v)}\ge0$. The sign rune exists exactly to keep the root real and non-negative.
      - text: 'The length depends on the parametrization, so there is no single shortest curve'
        feedback: |
          The length is reparametrization invariant: $L_{\text{ᚱ}^{-1}([a,b])}[\gamma\circ\text{ᚱ}] = L_{[a,b]}[\gamma]$. It is the speed that depends on the parametrization.
      - text: 'Shortest curves need a connection to be defined'
        feedback: |
          The length uses only the metric: $s_\gamma$ is built from $g$ and the velocity. No connection enters $L_{[a,b]}$, and comparing lengths of curves needs nothing more.
    explanation: |
      Twin A at rest reads $10$, every slanted timelike detour reads less ($8$ for twin B at speed $\tfrac35$). The straight worldline maximizes proper time, so a definition that should capture "straight" in both Euclidean space and spacetime must ask only that the length be stationary.


  - type: text
    id: summary
    body: |
      **Next:** how do you find a curve whose length is stationary? Deform it in a chart by a small amount, a deformation parameter written with the rune $\text{ᛊ}$, ask $\frac{d}{d\text{ᛊ}}L = 0$, and the calculus of variations turns this into a differential equation for the curve: the **Euler-Lagrange equations**.
