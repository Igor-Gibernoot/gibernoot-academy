id: ch07-metric
title: The Metric and the Musical Maps · Part 1
kind: concept

own: |
  - **Setting**: $\mathcal{M}$ a manifold with a chart $(\mathcal{U},\mathscr{X})$; $\Gamma T\mathcal{M}$ and $\Gamma T^*\mathcal{M}$ are its smooth vector fields and covector fields; $\mathcal{X},\mathcal{Y}$ are vector fields with components $x^i,\tilde x^i$; $\partial x_i$ is the $i$-th coordinate basis vector field; $\delta_{ij}$ is the identity matrix.
  - **Why**: a tangent space has no lengths, and "square root of the sum of squared components" only works in cartesian charts: at the point with cartesian coordinates $(3,4)$ of the plane, where polar $r = 5$, the polar components $(0,1)$ belong to an arrow of length $5$.
  - **Metric** $g$: a $(0,2)$-tensor field that is symmetric, {{ $g(\mathcal{X},\mathcal{Y}) = g(\mathcal{Y},\mathcal{X})$ }}, and whose **musical map**
  {{ $$\flat(\mathcal{X})\lceil\mathcal{Y}\rfloor := g(\mathcal{X},\mathcal{Y})$$ }}
  is a bijection $\Gamma T\mathcal{M}\to\Gamma T^*\mathcal{M}$. Checked pointwise: non-degenerate, {{ $\det\big(g_{ij}(p)\big)\neq0$ }} at every $p$. Positivity is **not** required (Minkowski $\eta$ is a metric). Metric manifold $(\mathcal{M},\mathcal{O},\mathcal{A},g)$.
  - **Components** {{ $g_{ij} := g(\partial x_i,\partial x_j)$ }}, symmetric, with $g(\mathcal{X},\mathcal{Y})|_\mathcal{U} = x^i\tilde x^jg_{ij}$; the Euclidean plane (dot product): $\delta_{ij}$ in cartesian coordinates, $\mathrm{diag}(1,r^2)$ in polar coordinates $(r,\theta)$.

cards:
  - type: text
    id: hook
    title: How long is this arrow?
    body: |
      Take the plane $\mathbb{R}^2$, points $(a,b)$, with two charts: the cartesian chart $\mathscr{X}(a,b) = (a,b)$ and the polar chart $\mathscr{Y} = (r,\theta)$, $r = \sqrt{a^2+b^2}$, $\theta\in(-\pi,\pi)$, on $\mathcal{V}$ = the plane minus the half-line $\{b=0,\ a\le0\}$. Recall the chart-induced basis vectors $(\partial x_i)_p$ and $(\partial y_i)_p$ at a point $p$.

      At $p = (3,4)$ a friend hands you a tangent vector $v$ by its **polar** components:
      $$(y^1, y^2) = (0, 1).$$
      Before any theory, guess: how long is $v$? The school rule "square root of the sum of the squared components" says $\sqrt{0^2+1^2} = 1$. Is that right?

      Keep your guess. A tangent space $T_p\mathcal{M}$ is a vector space: it can add and scale arrows, but nothing in its axioms says how long an arrow is.

  - type: widget
    id: same-arrow
    title: Same arrow, many component lists
    widget: chart-basis
    config:
      charts:
        - { chart: cartesian, name: '\mathscr{X}' }
        - { chart: polar, name: '\mathscr{Y}', cut: left }
      p: [3, 4]
      v: [-4, 3]
      jacobian: false
      view: { x: -2.5, y: -0.75, w: 9, h: 9 }
      presets:
        - { label: 'p = (3, 4), polar (0, 1)', p: [3, 4], v: [-4, 3] }
        - { label: 'p = (1, 0), polar (0, 1)', p: [1, 0], v: [0, 1] }
        - { label: 'p = (0, 2), polar (0, 1)', p: [0, 2], v: [-2, 0] }
        - { label: 'p = (3, 4), polar (5, 0)', p: [3, 4], v: [3, 4] }
    body: |
      Solid lines: the cartesian chart $\mathscr{X}$; dashed: the polar chart $\mathscr{Y} = (r,\theta)$, undefined on the dotted half-line. The draggable arrow is $v$; the readout lists its components in each chart.

      1. Press the first three presets. Each time the polar components are $(0,1)$, but the arrow has a different length: the polar basis vector $(\partial y_2)_p$ (dashed purple) grows with the distance to the origin.
      2. Drag the tip of $v$ and watch: the cartesian components change exactly as the arrow does, the polar ones do not.

  - type: mcq
    id: hook-length
    title: The honest length
    prompt: |
      In the plane with polar chart $\mathscr{Y} = (r,\theta)$, at $p = (3,4)$ the polar basis vectors have standard components $(\partial y_1)_p = (3/5,\ 4/5)$ and $(\partial y_2)_p = (-4,\ 3)$. A tangent vector $v$ at $p$ has polar components $(y^1,y^2) = (0,1)$. What is its ordinary (Euclidean) length?
    options:
      - text: '$5$'
        correct: true
      - text: '$1$'
        feedback: |
          That is the sum-of-squares rule applied to the **polar** components. The rule is only valid for components in an orthonormal basis, like the cartesian one. Here $v = (\partial y_2)_p = (-4,3)$, which has length $\sqrt{16+9} = 5$.
      - text: '$\sqrt2$'
        feedback: |
          Adding the lengths of basis vectors, or treating both components as $1$, does not give a length. With $(y^1,y^2) = (0,1)$, $v$ is exactly $(\partial y_2)_p = (-4,3)$, of length $5$.
      - text: 'It cannot be computed, even knowing the polar chart'
        feedback: |
          From the components **alone** it cannot; but here we also know the plane's ordinary ruler and the chart, so we can convert: $v = 0\cdot(\partial y_1)_p + 1\cdot(\partial y_2)_p = (-4,3)$, length $5$. The lesson turns "the ruler" into a tensor field.
    explanation: |
      $v = (\partial y_2)_p = (-4,3)$ and $\sqrt{(-4)^2+3^2} = 5 = r$. The guess $1$ fails because a unit step in $\theta$ moves a distance $r$. Components are numbers relative to a basis; a length needs extra information about the basis vectors themselves: how long they are and at what angle they meet.

  - type: text
    id: missing-ingredient
    title: The missing ingredient
    body: |
      In cartesian components the length of $v$ is
      $$|v| = \sqrt{\delta_{ij}\,x^ix^j},$$
      with $\delta_{ij} = 1$ if $i = j$ and $0$ otherwise (Einstein summation over the repeated $i, j$). That recipe has two weaknesses:
      - it is **chart-dependent**: the same recipe on polar components gave $1$ instead of $5$;
      - on a general manifold (a sphere, spacetime) there is **no** cartesian chart to prefer.

      What a length really uses is an inner product: a machine that eats two vectors at $p$ and returns a number, linearly in each, so that $|v|^2$ is "$v$ fed twice" and the angle between two vectors comes from feeding both. Put one such machine at every point, varying smoothly, and you have a tensor field. In general relativity this field is the gravitational field itself.

  - type: mcq
    id: which-type
    title: Which tensor type?
    prompt: |
      Recall that a $(r,s)$-tensor at $p$ takes $r$ covectors and $s$ vectors at $p$ and returns a real number, linearly in each slot. A "ruler" at $p$ must take two tangent vectors $u, w \in T_p\mathcal{M}$ and return a number (their inner product), linearly in each. Which type is it?
    options:
      - text: '$(0,2)$'
        correct: true
      - text: '$(2,0)$'
        feedback: |
          The first number counts **covector** slots. A $(2,0)$-tensor eats two covectors; feeding it tangent vectors needs a way to turn vectors into covectors first, which is exactly what this lesson will build.
      - text: '$(1,1)$'
        feedback: |
          A $(1,1)$-tensor has one covector slot and one vector slot. It can be read as a linear map from vectors to vectors, not as a pairing of two vectors into a number.
      - text: '$(0,1)$'
        feedback: |
          A $(0,1)$-tensor is a covector: it eats **one** vector. An inner product needs two inputs.
    explanation: |
      Two vector slots, no covector slots: a $(0,2)$-tensor $g_p$, and as a field a $(0,2)$-tensor field $g$, which eats two vector fields and returns a smooth function, $C^\infty(\mathcal{M})$-linearly in each slot.

  - type: text
    id: definition
    title: The metric
    body: |
      A **metric** $g$ on a smooth manifold $(\mathcal{M},\mathcal{O},\mathcal{A})$ is a $(0,2)$-tensor field
      $$g\colon\Gamma T\mathcal{M}\times\Gamma T\mathcal{M}\to C^\infty(\mathcal{M})$$
      ($\Gamma T\mathcal{M}$ = the vector fields) with two properties.

      1. **Symmetry:** for all vector fields $\mathcal{X},\mathcal{Y}$,
      $$g(\mathcal{X},\mathcal{Y}) = g(\mathcal{Y},\mathcal{X}).$$
      2. **Invertible musical map.** Feeding a metric only one field leaves a machine waiting for the second: a covector field. This is the **musical map** $\flat$ ("flat"),
      $$\flat\colon\Gamma T\mathcal{M}\to\Gamma T^*\mathcal{M},$$
      $$\flat(\mathcal{X})\lceil\mathcal{Y}\rfloor := g(\mathcal{X},\mathcal{Y}).$$
      Recall that $\mathsf{X}\lceil\mathcal{Y}\rfloor$ is a covector field $\mathsf{X}$ acting on a vector field $\mathcal{Y}$, the function $p\mapsto\mathsf{X}_p(\mathcal{Y}(p))$. The requirement: $\flat$ is **bijective**, every covector field is $\flat(\mathcal{X})$ for exactly one vector field $\mathcal{X}$.

      A smooth manifold with a metric is a **metric manifold** $(\mathcal{M},\mathcal{O},\mathcal{A},g)$. The name: a flat $\flat$ lowers a note, and $\flat$ will lower an index.

  - type: mcq
    id: flat-linear
    title: What comes for free
    multiple: true
    prompt: |
      Let $g$ be a symmetric $(0,2)$-tensor field and define $\flat(\mathcal{X})\lceil\mathcal{Y}\rfloor := g(\mathcal{X},\mathcal{Y})$ for vector fields $\mathcal{X},\mathcal{Y}$. Select every statement that holds **automatically**, whatever $g$ is.
    options:
      - text: '$\flat(\mathcal{X})$ is a covector field, because $g$ is $C^\infty(\mathcal{M})$-linear in its **second** slot'
        correct: true
      - text: '$\flat(f\,\mathcal{X}+\mathcal{Z}) = f\,\flat(\mathcal{X}) + \flat(\mathcal{Z})$, because $g$ is $C^\infty(\mathcal{M})$-linear in its **first** slot'
        correct: true
      - text: '$\flat$ is bijective, because it is $C^\infty(\mathcal{M})$-linear'
        feedback: |
          Linear maps can fail to be bijective: the zero tensor $g = 0$ is symmetric and gives the linear map $\flat = 0$, which hits only the zero covector field. Bijectivity is the real condition in the definition.
    explanation: |
      A covector field is a $C^\infty(\mathcal{M})$-linear map from vector fields to functions; $\mathcal{Y}\mapsto g(\mathcal{X},\mathcal{Y})$ is one by linearity of $g$ in the second slot. Linearity in the first slot makes $\flat$ itself $C^\infty(\mathcal{M})$-linear. So the only genuine requirement on $\flat$ is that it be **bijective**.

  - type: text
    id: pointwise
    title: Checking it point by point
    body: |
      Bijectivity of $\flat$ is a statement about whole fields, but it can be checked at each point. At $p$, the value $g_p$ gives a linear map
      $$\flat_p\colon T_p\mathcal{M}\to T_p^*\mathcal{M},$$
      $$\flat_p(\mathcal{X}_p)(\mathcal{Y}_p) := g_p(\mathcal{X}_p,\mathcal{Y}_p),$$
      with $\flat(\mathcal{X})_p = \flat_p(\mathcal{X}_p)$. Since $T_p\mathcal{M}$ and $T_p^*\mathcal{M}$ have the same dimension $d$, these are equivalent:
      - $\flat$ is bijective;
      - every $\flat_p$ is an isomorphism;
      - every $\flat_p$ has kernel $\{0\}$: $g$ is **non-degenerate**, meaning $g_p(\mathcal{X}_p,\mathcal{Y}_p) = 0$ for **all** $\mathcal{Y}_p$ forces $\mathcal{X}_p = 0$;
      - in every chart, $\det\big(g_{ij}(p)\big)\neq0$ at every $p$ (the components $g_{ij}$ come in a moment).

      Why a singular $\flat_{p_0}$ at a single point already breaks bijectivity: take a covector field whose value at $p_0$ lies outside the image of $\flat_{p_0}$; no vector field can be sent to it, since $\flat(\mathcal{X})_{p_0} = \flat_{p_0}(\mathcal{X}_{p_0})$.

      Notice what is **not** required: positivity, $g_p(v,v) > 0$. Dropping it is what lets spacetime in.

  - type: mcq
    id: which-metrics
    title: Metric or not?
    multiple: true
    prompt: |
      On $\mathbb{R}^2$ with the cartesian chart, basis fields $\partial x_1,\partial x_2$ and dual covector fields $dx^1, dx^2$, recall $(\mathsf{X}\otimes\mathsf{Y})(\mathcal{Z},\mathcal{W}) = \mathsf{X}\lceil\mathcal{Z}\rfloor\,\mathsf{Y}\lceil\mathcal{W}\rfloor$. A metric must be symmetric and non-degenerate. Select every metric.
    options:
      - text: '$dx^1\otimes dx^1 + dx^2\otimes dx^2$'
        correct: true
      - text: '$-dx^1\otimes dx^1 + dx^2\otimes dx^2$'
        correct: true
      - text: '$dx^1\otimes dx^1$'
        feedback: |
          Symmetric but degenerate: $g(\partial x_2,\mathcal{Y}) = dx^1\lceil\partial x_2\rfloor\,dx^1\lceil\mathcal{Y}\rfloor = 0$ for every $\mathcal{Y}$, so $\flat(\partial x_2) = 0$ and $\flat$ is not injective. Its matrix $\mathrm{diag}(1,0)$ has determinant $0$.
      - text: '$dx^1\otimes dx^2$'
        feedback: |
          Not symmetric: $g(\partial x_1,\partial x_2) = 1$ but $g(\partial x_2,\partial x_1) = 0$. It is also degenerate: its matrix $\begin{pmatrix}0&1\\0&0\end{pmatrix}$ has determinant $0$.
    explanation: |
      The first is the Euclidean metric, matrix $\mathrm{diag}(1,1)$; the second is Minkowski's $\eta$ in two dimensions, matrix $\mathrm{diag}(-1,1)$, determinant $-1\neq0$. A negative entry is allowed: only symmetry and non-degeneracy are asked.

  - type: mcq
    id: injective-not-enough
    title: Injective is not enough
    prompt: |
      On $\mathbb{R}$ with chart $\mathscr{X}(t) = t$, basis field $\partial x_1$ and $dx^1$, let $g := (\mathscr{X}^1)^2\,dx^1\otimes dx^1$, so $g(x\,\partial x_1,\tilde x\,\partial x_1) = t^2x\tilde x$. One checks that $g(\mathcal{X},\mathcal{Y}) = 0$ for all $\mathcal{Y}$ forces $\mathcal{X} = 0$ (then $t^2x(t) = 0$, so $x = 0$ for $t\neq0$, and at $t = 0$ by continuity). Is $g$ a metric?
    options:
      - text: 'No: $g_0 = 0$, and $dx^1$ is not $\flat$ of any smooth vector field'
        correct: true
      - text: 'Yes: $\flat$ is injective, and an injective linear map between spaces of the same dimension is bijective'
        feedback: |
          "Same dimension" works point by point, for $\flat_p\colon T_p\mathcal{M}\to T_p^*\mathcal{M}$. The space of all vector fields is infinite-dimensional over $\mathbb{R}$, and a module over $C^\infty(\mathcal{M})$, where that argument fails. Here $\flat_0 = 0$ at the origin.
      - text: 'Yes: it is symmetric and nonzero'
        feedback: |
          Being nonzero somewhere is not enough: non-degeneracy is needed at **every** point. At $t = 0$ the matrix is $(0)$, determinant $0$.
    explanation: |
      $\flat(x\,\partial x_1) = t^2x\,dx^1$, so reaching $dx^1$ needs $x(t) = 1/t^2$, which is not even defined at $0$. Injective on fields is strictly weaker than bijective; the pointwise test $\det\big(g_{ij}(p)\big)\neq0$ for every $p$ catches it at once.

  - type: text
    id: components
    title: Components of the metric
    body: |
      In a chart $(\mathcal{U},\mathscr{X})$ the **components of the metric** are the functions
      $$g_{ij} := g(\partial x_i,\partial x_j)\in C^\infty(\mathcal{U}),$$
      with $g_{ij} = g_{ji}$ by symmetry: a symmetric matrix of functions. Expand $\mathcal{X}|_\mathcal{U} = x^i\,\partial x_i$ and $\mathcal{Y}|_\mathcal{U} = \tilde x^j\,\partial x_j$; since $g$ is $C^\infty$-linear in both slots, the functions $x^i,\tilde x^j$ come out.

      With two charts write $(g_\mathscr{X})_{ij}$ and $(g_\mathscr{Y})_{kl}$. Recall the law of any $(0,2)$-tensor field, one Jacobian factor per lower index, old coordinates differentiated by new:
      $$(g_\mathscr{Y})_{kl} = \frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^k}\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^l}\,(g_\mathscr{X})_{ij}.$$

  - type: build
    id: build-g-xy
    title: The metric on two fields
    prompt: |
      In a chart $(\mathcal{U},\mathscr{X})$ let $\mathcal{X}|_\mathcal{U} = x^i\,\partial x_i$, $\mathcal{Y}|_\mathcal{U} = \tilde x^j\,\partial x_j$, and $g_{ij} := g(\partial x_i,\partial x_j)$. Using $C^\infty$-linearity of $g$ in each slot (Einstein summation), build $g(\mathcal{X},\mathcal{Y})$ on $\mathcal{U}$.
    prefix: 'g(\mathcal{X},\mathcal{Y})|_\mathcal{U} ='
    tiles: ['x^i', '\tilde x^j', 'g_{ij}', '(g^{-1})^{ij}', '\delta_{ij}']
    answers:
      - ['x^i', '\tilde x^j', 'g_{ij}']
      - ['\tilde x^j', 'x^i', 'g_{ij}']
      - ['g_{ij}', 'x^i', '\tilde x^j']
      - ['x^i', 'g_{ij}', '\tilde x^j']
    wrong:
      - { answer: ['x^i', '\tilde x^j', '\delta_{ij}'], feedback: 'That is the cartesian Euclidean recipe. In a general chart, or for a general metric, the basis fields are not orthonormal, and $g(\partial x_i,\partial x_j) = g_{ij}$ need not be $\delta_{ij}$.' }
      - { answer: ['x^i', '\tilde x^j', '(g^{-1})^{ij}'], feedback: 'Two upper indices $i, j$ on the components, two upper ones on $(g^{-1})^{ij}$: Einstein summation needs each repeated index once up and once down. Pulling out the functions leaves $g(\partial x_i,\partial x_j) = g_{ij}$.' }
    explanation: |
      $$\begin{aligned}g(\mathcal{X},\mathcal{Y})|_\mathcal{U} &= g(x^i\partial x_i,\ \tilde x^j\partial x_j)\\ &= x^i\tilde x^j\,g(\partial x_i,\partial x_j)\\ &= x^i\tilde x^j\,g_{ij}.\end{aligned}$$
      For $\mathcal{X} = \mathcal{Y}$ this is the squared length $x^ix^jg_{ij}$, which reduces to the sum of squares only where $g_{ij} = \delta_{ij}$.

  - type: text
    id: euclidean
    title: The Euclidean metric in two charts
    body: |
      On the plane, define the **Euclidean metric** by its cartesian components:
      $$g := dx^1\otimes dx^1 + dx^2\otimes dx^2,$$
      so $(g_\mathscr{X})_{ij} = \delta_{ij}$. It is the plane's ordinary ruler, now as a tensor field.

      To get its polar components, the law needs $\partial\mathscr{X}^i/\partial\mathscr{Y}^k$, the cartesian coordinates $(a,b) = (r\cos\theta, r\sin\theta)$ differentiated by $(r,\theta)$ (row $i$ cartesian, column $k$ polar):
      $$\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^k} = \begin{pmatrix}a/r & -b\\ b/r & a\end{pmatrix}.$$
      Its columns are the standard components of $\partial y_1$ and $\partial y_2$. With $(g_\mathscr{X})_{ij} = \delta_{ij}$ the law collapses to a sum of products of columns:
      $$(g_\mathscr{Y})_{kl} = \sum_i \frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^k}\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^l}.$$
      (The $\Sigma$ is written because both $i$'s sit downstairs in the fractions: this is not Einstein summation, it comes from $\delta_{ij}$ killing the terms with $i\neq j$.)

  - type: numeric
    id: polar-g22
    title: The angular component
    prompt: |
      On the plane with the Euclidean metric $g$, $(g_\mathscr{X})_{ij} = \delta_{ij}$ in the cartesian chart. The polar chart $\mathscr{Y} = (r,\theta)$ has Jacobian functions $\partial\mathscr{X}^i/\partial\mathscr{Y}^k = \begin{pmatrix}a/r & -b\\ b/r & a\end{pmatrix}$ (row $i$ cartesian, column $k$ polar). Using $(g_\mathscr{Y})_{kl} = \frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^k}\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^l}(g_\mathscr{X})_{ij}$, compute $(g_\mathscr{Y})_{22}$ at $p = (3,4)$.
    answer: 25
    wrong:
      - { value: 5, feedback: 'That is $r$, the length of $(\partial y_2)_p = (-4,3)$. The component $(g_\mathscr{Y})_{22} = g(\partial y_2,\partial y_2)$ is its **squared** length: $(-4)^2 + 3^2 = 25$.' }
      - { value: 1, feedback: '$1$ would hold if $\partial y_2$ had unit length. Its standard components are column 2 of the Jacobian, $(-b, a) = (-4,3)$, so $g(\partial y_2,\partial y_2) = 16 + 9 = 25$.' }
      - { value: 0.04, feedback: 'That is $1/r^2$, which belongs to the **inverse** metric. The component $(g_\mathscr{Y})_{22}$ itself is $b^2 + a^2 = r^2 = 25$.' }
    hint: |
      With $\delta_{ij}$ only $i = j$ survives: $(g_\mathscr{Y})_{22} = (\partial\mathscr{X}^1/\partial\mathscr{Y}^2)^2 + (\partial\mathscr{X}^2/\partial\mathscr{Y}^2)^2$.
    explanation: |
      $$(g_\mathscr{Y})_{22} = (-b)^2 + a^2 = r^2 = 25.$$
      Likewise $(g_\mathscr{Y})_{11} = a^2/r^2 + b^2/r^2 = 1$ and $(g_\mathscr{Y})_{12} = -ab/r + ab/r = 0$. So in polar coordinates
      $$(g_\mathscr{Y})_{kl} = \begin{pmatrix}1&0\\0&r^2\end{pmatrix}:$$
      the polar basis is orthogonal, $\partial y_1$ has length $1$, $\partial y_2$ has length $r$.

  - type: text
    id: resolve-hook
    title: Back to the arrow
    body: |
      The hook's vector at $p = (3,4)$ had polar components $(y^1,y^2) = (0,1)$. Now its squared length can be computed **in the polar chart alone**, with the polar components of the metric:
      $$\begin{aligned}g(v,v) &= y^ky^l\,(g_\mathscr{Y})_{kl}\\ &= (y^1)^2 + r^2(y^2)^2\\ &= 0 + 25\cdot1 = 25,\end{aligned}$$
      so $|v| = 5$, the honest answer. The guess $1$ secretly used $\delta_{kl}$ in a chart where the metric is $\mathrm{diag}(1,r^2)$.

      The lesson: components of a vector say nothing about length; components of the **metric** carry the missing information, and the pair (vector components, metric components) gives the same number in every chart.

  - type: numeric
    id: length-polar
    title: A length in polar coordinates
    prompt: |
      On the plane with the Euclidean metric, whose polar components are $(g_\mathscr{Y})_{kl} = \mathrm{diag}(1, r^2)$ in the chart $\mathscr{Y} = (r,\theta)$, take the tangent vector $v$ at $p = (0,3)$ with polar components $(y^1,y^2) = (1,1)$. What is its length $\sqrt{g(v,v)}$?
    answer: 3.1623
    tolerance: 0.01
    answerText: '$\sqrt{10}\approx3.162$'
    wrong:
      - { value: 1.4142, tolerance: 0.01, feedback: 'That is $\sqrt{1^2+1^2}$, the sum-of-squares rule on polar components, which ignores $(g_\mathscr{Y})_{22} = r^2 = 9$.' }
      - { value: 2, feedback: 'That is $\sqrt{1 + r}$: the angular term carries $r^2$, not $r$. $g(v,v) = 1 + 9\cdot1 = 10$.' }
      - { value: 10, feedback: '$10$ is $g(v,v)$, the **squared** length. Take the square root.' }
    hint: |
      $g(v,v) = (y^1)^2 + r^2(y^2)^2$ with $r = 3$.
    explanation: |
      $g(v,v) = 1 + 9 = 10$, so $|v| = \sqrt{10}$. Check with arrows: at $(0,3)$, $(\partial y_1)_p = (0,1)$ and $(\partial y_2)_p = (-3,0)$, so $v = (-3,1)$, of length $\sqrt{10}$.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Next:** "The Metric and the Musical Maps · Part 2". The metric $g$ turns vectors into lengths; Part 2 uses its musical map $\flat$ to turn vectors into covectors (lowering an index), builds the inverse metric (raising an index, the gradient), and shows that a metric need not be positive, with Minkowski space as the example.
