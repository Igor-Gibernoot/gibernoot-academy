      On the torus, with $f\circ\mathscr{X}^{-1} = (2+\cos\varphi)\cos\theta$, the field $\mathcal{Y} = \partial x_2 = \partial/\partial\varphi$ acts as $\mathcal{Y}\lfloor f\rceil = \partial_\varphi(f\circ\mathscr{X}^{-1})$. Evaluate the function $\mathcal{Y}\lfloor f\rceil$ at the point with $(\theta,\varphi) = (\tfrac\pi3,\tfrac\pi2)$.
    answer: -0.5
