      $\mathcal{Y}\lfloor f\rceil = -\sin\varphi\cos\theta = -1\cdot\tfrac12$. At $p_0$ ($\theta = 0$, $\varphi = \tfrac\pi2$) it gives $-1$, matching $\mathcal{Y}_{p_0}(f)$ of Question 3.

  - type: numeric
    id: q4c
    points: 0.5
    tag: Question 4 · Vector fields
    title: (c) The sum of two fields
    prompt: |
      On the torus, in the angle chart, $\mathcal{X} = \partial x_1$ and $\mathcal{Y} = \partial x_2$. The sum $\mathcal{X}\oplus_\Gamma\mathcal{Y}$ is the vector field whose component functions are the sums of the component functions, and its action on scalars is the sum of the two actions, $(\mathcal{X}\oplus_\Gamma\mathcal{Y})\lfloor f\rceil = \mathcal{X}\lfloor f\rceil + \mathcal{Y}\lfloor f\rceil$. Evaluate $(\mathcal{X}\oplus_\Gamma\mathcal{Y})\lfloor f\rceil$ at the point with $(\theta,\varphi) = (\tfrac\pi3,\tfrac\pi2)$, where $\mathcal{X}\lfloor f\rceil = -\sqrt3$ and $\mathcal{Y}\lfloor f\rceil = -\tfrac12$.
    answer: -2.2320508
    tolerance: 0.001
    answerText: '-√3 - 1/2'
    wrong:
      - { value: 0.866, feedback: 'You multiplied the two actions, $\sqrt3\cdot\tfrac12$. Vector fields add component by component, so their actions on $f$ **add**.' }
      - { value: -1, feedback: 'That is the value at $p_0$ ($0+(-1)$). Here the point is $(\tfrac\pi3,\tfrac\pi2)$.' }
    explanation: |
      $(\mathcal{X}\oplus_\Gamma\mathcal{Y})|_\mathcal{U} = \partial x_1 + \partial x_2$, and
      $$\begin{aligned}(\mathcal{X}\oplus_\Gamma\mathcal{Y})\lfloor f\rceil = &-(2+\cos\varphi)\sin\theta\\&- \sin\varphi\cos\theta,\end{aligned}$$
      which is $-\sqrt3-\tfrac12\approx-2.232$ at this point and $-1$ at $p_0$.
