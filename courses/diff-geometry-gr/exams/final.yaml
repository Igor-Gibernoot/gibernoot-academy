      $$\int_{\mathcal{D}}\Omega^g f=\int_{\mathscr{X}(\mathcal{D})}d^2\alpha\ \omega^g_{\mathscr{X}}(\alpha)\,(f\circ\mathscr{X}^{-1})(\alpha).$$

