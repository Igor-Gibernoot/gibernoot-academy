  # ------------------------------------------------------------- Question 2
  - type: mcq
    id: q2a-g
    points: 0.3
    tag: Question 2 · The induced metric and its geodesics
    title: (a) The components of g
    prompt: |
      Let $f_1,f_2,f_3:\mathcal{M}\to\mathbb{R}$ be $p\mapsto a$, $p\mapsto b$, $p\mapsto c$. The metric induced from $\mathbb{R}^3$ is $g(\mathcal{X}_1,\mathcal{X}_2):=\sum_{k=1}^3 df_k\lceil\mathcal{X}_1\rfloor\,df_k\lceil\mathcal{X}_2\rfloor$, so in the angle chart

      $$(g_{\mathscr{X}})_{ij}(\alpha)=\sum_{k=1}^3\partial_i[f_k\circ\mathscr{X}^{-1}](\alpha)\,\partial_j[f_k\circ\mathscr{X}^{-1}](\alpha),$$

      with $f_1\circ\mathscr{X}^{-1}=\sin\alpha_1\cos\alpha_2$, $f_2\circ\mathscr{X}^{-1}=\sin\alpha_1\sin\alpha_2$, $f_3\circ\mathscr{X}^{-1}=\cos\alpha_1$. Which matrix is $(g_{\mathscr{X}})_{ij}(\alpha)$?
    options:
      - text: '$\begin{bmatrix}1&0\\0&\sin^2\alpha_1\end{bmatrix}$'
        correct: true
      - text: '$\begin{bmatrix}1&0\\0&\sin\alpha_1\end{bmatrix}$'
        feedback: |
          That is $\mathrm{diag}(1,\omega^g)$, mixing the metric with the density $\sqrt{\det g}=\sin\alpha_1$. The component is a **sum of squares**: $\sin^2\alpha_2+\cos^2\alpha_2$ times $\sin^2\alpha_1$.
      - text: '$\begin{bmatrix}1&0\\0&\cos^2\alpha_1\end{bmatrix}$'
        feedback: |
          $\cos^2$ would be right for a latitude measured from the equator. With $\alpha_1$ measured from the north pole, $\partial_2[f_k\circ\mathscr{X}^{-1}]=(-\sin\alpha_1\sin\alpha_2,\sin\alpha_1\cos\alpha_2,0)$ has squared length $\sin^2\alpha_1$.
      - text: '$\begin{bmatrix}1&0\\0&1\end{bmatrix}$'
        feedback: |
          That would be a flat metric. A circle of latitude $\alpha_1=$ const has radius $\sin\alpha_1<1$, so the length of $\partial_2$ shrinks towards the poles.
    explanation: |
      With $s_i=\sin\alpha_i$, $c_i=\cos\alpha_i$ and $k=1,2,3$,
      $$\partial_1[f_k\circ\mathscr{X}^{-1}]=(c_1c_2,\ c_1s_2,\ -s_1),$$
      $$\partial_2[f_k\circ\mathscr{X}^{-1}]=(-s_1s_2,\ s_1c_2,\ 0),$$
      $$\begin{aligned}(g_{\mathscr{X}})_{11}&=\cos^2\alpha_1+\sin^2\alpha_1=1,\\(g_{\mathscr{X}})_{12}&=0,\\(g_{\mathscr{X}})_{22}&=\sin^2\alpha_1,\end{aligned}$$
      $$(g_{\mathscr{X}})_{ij}=\begin{bmatrix}1&0\\0&\sin^2\alpha_1\end{bmatrix}.$$

