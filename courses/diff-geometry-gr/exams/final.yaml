  - type: mcq
    id: q2a-sig
    points: 0.2
    tag: Question 2 · The induced metric and its geodesics
    title: (a) The signature
    prompt: |
      With $(g_{\mathscr{X}})_{ij}=\mathrm{diag}(1,\sin^2\alpha_1)$ and $\alpha_1\in(0,\pi)$, what is the signature $(n_+,n_-)$ of $g$ at every point of $\mathcal{U}$ (number of positive and negative eigenvalues)?
    options:
      - text: '$(2,0)$: $g(\mathcal{X},\mathcal{X})=(x^1)^2+\sin^2\alpha_1\,(x^2)^2>0$ for $\mathcal{X}\neq0$, since $\sin\alpha_1>0$ on $(0,\pi)$'
        correct: true
