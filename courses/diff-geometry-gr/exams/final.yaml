    prompt: |
      In the projection chart the integrand is $1$ (density times $f\circ\mathscr{Y}^{-1}$), so

      $$\int_{\mathcal{D}}\Omega^g f=\int_{\mathscr{Y}(\mathcal{D})}d^2\beta\ \omega^g_{\mathscr{Y}}(\beta)\,(f\circ\mathscr{Y}^{-1})(\beta)=\int_{\mathscr{Y}(\mathcal{D})}d^2\beta,$$

      the area of the half annulus $\mathscr{Y}(\mathcal{D})=\{\beta_1>0,\ \tfrac14<\beta_1^2+\beta_2^2<\tfrac34\}$. Use planar polar variables, $(\beta_1,\beta_2)=(r\cos\psi,r\sin\psi)$, $d\beta_1d\beta_2=r\,dr\,d\psi$. Compute it. Give a decimal.
    answer: 0.7853982
    tolerance: 0.001
    answerText: 'π/4 ≈ 0.7854'
    wrong:
      - { value: 1.1499027, feedback: 'The Jacobian factor $r$ of the polar variables is missing: $\pi\int dr=\pi(\tfrac{\sqrt3}{2}-\tfrac12)$. Remember $d\beta_1d\beta_2=r\,dr\,d\psi$.' }
      - { value: 1.5707963, feedback: 'That is the area of the **full** annulus $\tfrac14<r^2<\tfrac34$ ($\psi\in(-\pi,\pi)$). The condition $a=\beta_1>0$ keeps only $\psi\in(-\tfrac\pi2,\tfrac\pi2)$.' }
    explanation: |
      $$\begin{aligned}\int_{-\pi/2}^{\pi/2}d\psi\int_{1/2}^{\sqrt3/2}dr\,r&=\pi\Big[\frac{r^2}{2}\Big]_{1/2}^{\sqrt3/2}\\&=\frac\pi2\Big(\frac34-\frac14\Big)=\frac\pi4,\end{aligned}$$
      the same value as in the angle chart.

  - type: mcq
    id: q3c-agree
    points: 0.25
    tag: Question 3 · Volume form and integrals
    title: (c) Why the two integrals agree
    prompt: |
      The two integrals, over the rectangle $\mathscr{X}(\mathcal{D})$ with $\omega^g_{\mathscr{X}}f=\sin\alpha_1\cos\alpha_1$ and over the half annulus $\mathscr{Y}(\mathcal{D})$ with $\omega^g_{\mathscr{Y}}f=1$, both give $\pi/4$. Why must they agree?
    options:
      - text: 'The density transforms with $\det\big(\partial\mathscr{X}/\partial\mathscr{Y}\big)>0$, exactly the factor of the change of variables, so $\int d^2\beta\,\omega^g_{\mathscr{Y}}h=\int d^2\alpha\,\omega^g_{\mathscr{X}}h$ for a scalar $h$ and compatible orientations'
        correct: true
      - text: 'The rectangle and the half annulus have the same Euclidean area'
        feedback: |
          They do not: the rectangle has area $\tfrac\pi6\cdot\pi=\tfrac{\pi^2}{6}\approx1.645$, the half annulus $\tfrac\pi4\approx0.785$. The agreement comes from the densities, not the areas.
      - text: 'Because $\omega^g_{\mathscr{X}}=\omega^g_{\mathscr{Y}}$ at corresponding points'
        feedback: |
          They are different: $\sin\alpha_1$ versus $1/\sqrt{1-\beta_1^2-\beta_2^2}=1/\cos\alpha_1$. The densities are not scalars; their ratio is the Jacobian determinant.
      - text: 'A coincidence of this particular $f$; for other scalar fields the two charts would give different integrals'
        feedback: |
          The integral of $\Omega^g f$ over $\mathcal{D}$ is chart independent for every scalar field $f$ (and every oriented-compatible pair of charts), because it is defined on the manifold, not in coordinates.
    explanation: |
      Under a chart change the density picks up the determinant of the Jacobian, which is exactly the factor from the change of integration variables (orientations agree, determinant positive), so
      $$\begin{aligned}\int_{\mathcal{D}}\Omega^g f&=\int_{\mathscr{X}(\mathcal{D})}d^2\alpha\,\omega^g_{\mathscr{X}}\,(f\circ\mathscr{X}^{-1})\\&=\int_{\mathscr{Y}(\mathcal{D})}d^2\beta\,\omega^g_{\mathscr{Y}}\,(f\circ\mathscr{Y}^{-1})=\frac\pi4.\end{aligned}$$
