      with $g=\eta=\mathrm{diag}(1,-1,-1,-1)$. At a point the energy–momentum tensor is that of a fluid at rest, $T_{ab}=\mathrm{diag}(\rho,p,p,p)$, with $\rho=4$ and $p=1$. What is $\mathrm{Ric}_{00}$? Give a decimal.
