id: exam-final
title: Final Exam
kind: exam

# Exam lesson (js/exam.js). 3 h, 10 points, three original questions on Levels 9 and 10:
# Q1 Newtonian gravity as a connection (3), Q2 spacetime and Einstein's equations (3),
# Q3 Newton against Einstein around a point mass (4). The professor's sphere exam is exam-partial2.
# Setting card first, then cards tagged "Question N · …", ids qN-…, `points:` per card.

minutes: 180

rules: |
  This is the **final exam**: Newtonian gravity as a connection and relativistic spacetime (Levels 9 and 10).

  - **Three hours**, **10 points**, 3 questions (3 + 3 + 4 points). The bar at the top counts the time down; when it ends, the exam is submitted for you.
  - **No feedback while you work.** Pick or type an answer and press *Next*. You can go back and change any answer until you submit.
  - The points are shown on each card; a question is split into small cards, one per step.
  - At the end, a submit slide shows which questions are still empty. Unanswered questions count as wrong.
  - After submitting you get your score, and a **review** with your answer, the correct one and the explanation for each question.
  - Work on **paper first**, and do not open your notes. The computations are short: what counts is the correct use of the concepts.

  The first card sets the units and conventions. Every question restates what it needs.

debrief: |
    Use the review to see where points went. The skills behind the three questions:

    - **Gravity as a connection** (Q1, 3 points): a potential gives $\Gamma^\alpha_{00}=\partial_\alpha\phi$, free fall $\ddot\gamma^\alpha=-\partial_\alpha\phi$, the field equation $\mathrm{Ric}_{00}=\Delta\phi=4\pi G_N\rho$ (zero trace does not mean flat), the tidal equation
      $$\ddot\eta^\alpha=-\partial_\alpha\partial_\beta\phi\,\eta^\beta,$$
      and the Coriolis and centrifugal terms of a rotating chart, $\ddot y^1=2\omega\dot y^2+\omega^2y^1$.
    - **Spacetime and Einstein's equations** (Q2, 3 points): proper time $\int\sqrt{g(v_\gamma,v_\gamma)}\,d\lambda$ (the straight worldline is the longest), frame components $\tilde X=\Lambda^{-1}X$, the trace-reversed equations
      $$\mathrm{Ric}=8\pi G_N\big(T-\tfrac12\,T^{\,m}{}_m\,g\big),$$
      and the static metric with $f=1-2G_NM/r$, from $\mathrm{Ric}_{22}=1-(rf)'=0$.
    - **Newton against Einstein** (Q3, 4 points): Kepler's third law $\omega^2=G_NM/r^3$, the radial tide $-2G_NM/r^3$ against $\tfrac12ff''=-f\,2G_NM/r^3$, and the clock of a circular orbit,
      $$\frac{d\tau}{dt}=\sqrt{f-r^2\omega^2}=\sqrt{1-\frac{3G_NM}{r}}.$$

    **Next:** the course is complete. Review the levels where points went.

cards:
  - type: text
    id: setting
    title: The setting
    body: |
      The three questions are independent and use no figure; each one states its own setting. They cover Newtonian gravity written as a connection (Level 9) and relativistic spacetime (Level 10), and the third question puts both around the same point mass.

      Units: $c=1$ in relativistic questions. Sums over repeated indices are implied. In spacetime questions the metric has signature $(+,-,-,-)$, so timelike vectors have $g>0$. Greek indices run over the space directions, $\alpha\in\{1,2,3\}$, and $G_N$ is Newton's constant.

  # ------------------------------------------------------------- Question 1
  - type: numeric
    id: q1a-accel
    points: 0.6
    tag: Question 1 · Gravity as a connection
    title: (a) Acceleration of a particle at rest
    prompt: |
      Newtonian spacetime has an inertial chart $(\mathcal{U},\mathscr{X})$ with coordinates $(t,x^1,x^2,x^3)$, where $t$ is absolute time. Far from any source, a gravitational potential $\phi$ is turned into a connection whose only non-zero coefficients are

      $$(\Gamma_{\mathscr{X}})^\alpha_{00}=\partial_\alpha\phi,\qquad\alpha\in\{1,2,3\},$$

      so that a free-falling worldline obeys $\ddot\gamma^\alpha=-\partial_\alpha\phi$. In a region around the origin the potential is

      $$\phi(x)=\tfrac12\big(2(x^1)^2-(x^2)^2-(x^3)^2\big).$$

      A free particle is released **at rest** at the point $x=(2,1,-3)$. What is the component $\ddot\gamma^2$ of its acceleration at the moment of release? Give a decimal.
    answer: 1
    tolerance: 0.001
    answerText: '$-\partial_2\phi=x^2=1$'
    wrong:
      - { value: -1, feedback: 'Sign slip: $\partial_2\phi=-x^2=-1$, and the acceleration is $-\partial_2\phi$, so it is $+1$ (pushed **away** from the axis, because $\phi$ decreases along $x^2$).' }
      - { value: -4, feedback: 'That is $-\partial_1\phi=-2x^1$, the first component. The question asks for the second one.' }
      - { value: 0, feedback: 'The particle is at rest, so the velocity terms vanish, but the term $\Gamma^2_{00}$ does not: it is what accelerates a particle that sits still.' }
    explanation: |
      At rest only $\dot\gamma^0=1$ is non-zero, so
      $$\ddot\gamma^2=-(\Gamma_{\mathscr{X}})^2_{00}=-\partial_2\phi=x^2=1.$$

  - type: mcq
    id: q1b-vacuum
    points: 0.4
    tag: Question 1 · Gravity as a connection
    title: (b) Does this potential need a source?
    prompt: |
      The field equation of the Newtonian theory is $\mathrm{Ric}_{00}=\Delta\phi=4\pi G_N\rho$, with $\Delta\phi=\sum_\alpha\partial_\alpha\partial_\alpha\phi$ and $\rho$ the mass density. For $\phi=\tfrac12\big(2(x^1)^2-(x^2)^2-(x^3)^2\big)$, which statement is true?
    options:
      - text: '$\Delta\phi=0$, so $\rho=0$ in the region: it is a vacuum solution, yet the curvature $\mathrm{Riem}^\alpha_{0\beta0}=\partial_\alpha\partial_\beta\phi$ does not vanish'
        correct: true
      - text: '$\Delta\phi=0$, so the connection is flat and the chart is inertial'
        feedback: |
          $\Delta\phi$ is only the trace of $\mathrm{Riem}^\alpha_{0\beta0}=\partial_\alpha\partial_\beta\phi=\mathrm{diag}(2,-1,-1)$. A zero trace does not make the matrix zero, so the connection is **not** flat.
      - text: '$\Delta\phi=4$, so $\rho=1/(\pi G_N)$'
        feedback: |
          That adds the absolute values of the three second derivatives. The signs matter: $2-1-1=0$.
      - text: '$\Delta\phi=-2$, so the source has negative mass density'
        feedback: |
          The second derivatives are $2$, $-1$ and $-1$; their sum is $0$, not $-2$ (that would drop one term).
    explanation: |
      The matrix of second derivatives is
      $$\partial_\alpha\partial_\beta\phi=\begin{bmatrix}2&0&0\\0&-1&0\\0&0&-1\end{bmatrix},$$
      with trace $0$. Hence $\mathrm{Ric}_{00}=0$ and $\rho=0$, but $\mathrm{Riem}\neq0$: this is the pure tidal field of a distant source.

  - type: numeric
    id: q1c-tidal
    points: 0.6
    tag: Question 1 · Gravity as a connection
    title: (c) The tidal equation
    prompt: |
      Two free particles are both released at rest, very close to each other, near the origin. Their offset $\eta^\beta$ (the difference of their coordinates) obeys the tidal equation

      $$\ddot\eta^\alpha=-\mathrm{Riem}^\alpha_{0\beta0}\,\eta^\beta=-\partial_\alpha\partial_\beta\phi\ \eta^\beta,$$

      with $\phi=\tfrac12\big(2(x^1)^2-(x^2)^2-(x^3)^2\big)$. At the moment of release the offset is $\eta=(0.1,\,0.2,\,0)$. What is $\ddot\eta^2$? Give a decimal.
    answer: 0.2
    tolerance: 0.001
    answerText: '$-(-1)(0.2)=0.2$'
    wrong:
      - { value: -0.2, feedback: 'Sign slip: $\partial_2\partial_2\phi=-1$, so $\ddot\eta^2=-(-1)\,\eta^2=+\eta^2$. The particles drift **apart** along $x^2$.' }
      - { value: -0.1, feedback: 'The offset component is $\eta^2=0.2$, not $0.1$ (that is $\eta^1$).' }
      - { value: 0.4, feedback: 'The entry for $x^2$ is $-1$, not $-2$; the $2$ belongs to the $x^1$ direction.' }
    explanation: |
      The matrix is diagonal, $\mathrm{diag}(2,-1,-1)$, so each component decouples:
      $$\begin{aligned}\ddot\eta^1&=-2\eta^1=-0.2,\\\ddot\eta^2&=+\eta^2=0.2,\\\ddot\eta^3&=0.\end{aligned}$$
      Along $x^1$ the particles are squeezed together, along $x^2$ and $x^3$ they are stretched apart.

  - type: numeric
    id: q1d-fall
    points: 0.8
    tag: Question 1 · Gravity as a connection
    title: (d) Release from rest on the x² axis
    prompt: |
      A free particle is released from rest at $x=(0,1,0)$ at time $t=0$. On the $x^2$ axis the equation of motion is $\ddot\gamma^2=-\partial_2\phi=\gamma^2$, with $\gamma^2(0)=1$ and $\dot\gamma^2(0)=0$. What is $\gamma^2$ at $t=1$? Give a decimal.
    answer: 1.5430806
    tolerance: 0.002
    answerText: 'cosh 1 ≈ 1.543'
    wrong:
      - { value: 1.5, feedback: 'That is the truncated series $1+\tfrac12t^2$. The next term $t^4/24$ also contributes: the exact solution of $\ddot\gamma=\gamma$ is $\cosh t$.' }
      - { value: 0.5403023, feedback: 'That is $\cos 1$, the solution of $\ddot\gamma=-\gamma$ (an oscillator). Here the sign is the opposite, so the particle runs away instead of oscillating.' }
      - { value: 2.7182818, feedback: 'That is $e^1$. The solution with zero initial velocity is $\tfrac12(e^t+e^{-t})$, since $\dot\gamma(0)=0$ kills the difference.' }
    explanation: |
      The equation $\ddot\gamma^2=\gamma^2$ has general solution $Ae^t+Be^{-t}$. The conditions $\gamma^2(0)=1$, $\dot\gamma^2(0)=0$ give $A=B=\tfrac12$, so
      $$\gamma^2(t)=\cosh t,\qquad\gamma^2(1)=\cosh 1\approx1.543.$$

  - type: numeric
    id: q1e-coriolis
    points: 0.6
    tag: Question 1 · Gravity as a connection
    title: (e) A rotating chart
    prompt: |
      Now ignore the potential (take $\phi=0$) and look at a chart $(\mathcal{V},\mathscr{Y})$ that rotates about the $x^3$ axis with constant angular velocity $\omega=2$ relative to the inertial chart. A free particle has, in the rotating chart, position $y=(0.5,\,0.25)$ and velocity $\dot y=(1,\,-1.5)$ in the plane $y^3=0$. Its acceleration in the rotating chart is the sum of a Coriolis and a centrifugal term:

      $$\ddot y^1=2\omega\,\dot y^2+\omega^2y^1,\qquad\ddot y^2=-2\omega\,\dot y^1+\omega^2y^2.$$

      What is $\ddot y^1$? Give a decimal.
    answer: -4
    tolerance: 0.001
    answerText: '$2\cdot2\cdot(-1.5)+4\cdot0.5=-4$'
    wrong:
      - { value: 6, feedback: 'The Coriolis term is $2\omega\dot y^2=4\cdot(-1.5)=-6$, negative because $\dot y^2$ is negative.' }
      - { value: -6, feedback: 'That is the Coriolis term alone. The centrifugal term $\omega^2y^1=2$ is missing.' }
      - { value: -3, feedback: 'That is $\ddot y^2$, the other component: $-2\omega\dot y^1+\omega^2y^2=-4+1$.' }
    explanation: |
      Coriolis part: $2\omega\dot y^2=2\cdot2\cdot(-1.5)=-6$. Centrifugal part: $\omega^2y^1=4\cdot0.5=2$. Their sum is $-4$. These two terms are the non-zero coefficients $\Gamma^\alpha_{0\beta}$ and $\Gamma^\alpha_{00}$ of the connection in the rotating chart; the particle is free, so they come only from the chart.

  # ------------------------------------------------------------- Question 2
  - type: numeric
    id: q2a-twin
    points: 0.5
    tag: Question 2 · Spacetime and Einstein's equations
    title: (a) Proper time of a traveler
    prompt: |
      Flat spacetime has a chart $(t,x)$ with the Minkowski metric of signature $(+,-)$,

      $$g(X,X)=(X^t)^2-(X^x)^2,$$

      and the proper time along a worldline is $\int\sqrt{g(v_\gamma,v_\gamma)}\,d\lambda$. A traveler leaves the event $(0,0)$, moves in a straight line to the event $(13,12)$, and then in a straight line to $(26,0)$. What is the total proper time elapsed on the traveler's clock? Give a decimal.
    answer: 10
    tolerance: 0.001
    answerText: '$2\sqrt{13^2-12^2}=10$'
    wrong:
      - { value: 26, feedback: 'That is the proper time of a clock that stays at $x=0$ (its velocity is $(1,0)$, so $g=1$). The traveler moves, so its clock runs slower.' }
      - { value: 5, feedback: 'That is only one leg. The trip has two legs, each lasting $\sqrt{169-144}=5$.' }
      - { value: 50, feedback: 'The Minkowski square is $(X^t)^2-(X^x)^2$, with a **minus**. Adding the squares would give the Euclidean length, $\sqrt{13^2+12^2}=\sqrt{313}$.' }
    explanation: |
      On each straight leg $v_\gamma$ is constant, so the proper time is $\sqrt{g(\Delta,\Delta)}$ with $\Delta$ the displacement. Outward, $\Delta=(13,12)$, so $\sqrt{169-144}=5$. Inward, $\Delta=(13,-12)$ gives $5$ again. The total is $10$, against $26$ for the stay-at-home clock.

  - type: mcq
    id: q2a-longest
    points: 0.3
    tag: Question 2 · Spacetime and Einstein's equations
    title: (a) Which clock is ahead?
    prompt: |
      The stay-at-home clock at $x=0$ reads $26$ and the traveler's clock reads $10$ when they meet again at $(26,0)$. Which statement explains this?
    options:
      - text: 'Among causal worldlines joining two events, the straight one has the **longest** proper time; any kink or detour shortens it'
        correct: true
      - text: 'The traveler is accelerating, and acceleration makes any clock run fast'
        feedback: |
          It is the opposite. The proper time along a causal worldline is at most that of the straight line between the same endpoints, so a detour makes the clock **read less**.
      - text: 'Proper time is the Euclidean length of the path, and the traveler path is shorter'
        feedback: |
          The Euclidean path is the **longer** one here ($\sqrt{313}\cdot2$ against $26$ in coordinate units), and in any case proper time uses the Minkowski square with a minus sign.
      - text: 'Both clocks must read the same, because they start and end at the same events'
        feedback: |
          Proper time depends on the whole worldline, not only on its endpoints: two clocks that separate and meet again generally disagree.
    explanation: |
      With signature $(+,-)$ the triangle inequality is reversed for timelike paths: the direct path has the largest proper time, here $26$, and the broken path has $5+5=10$.

  - type: numeric
    id: q2b-boost
    points: 0.5
    tag: Question 2 · Spacetime and Einstein's equations
    title: (b) Components in the frame of a moving observer
    prompt: |
      An observer moves with speed $u=0.8$ (units $c=1$) relative to the chart $(t,x)$, so $\gamma_u=1/\sqrt{1-u^2}=5/3$. The components of a vector $X$ in the observer's frame are $\tilde X=\Lambda^{-1}X$, where, for a boost along $x$,

      $$\tilde X^0=\gamma_u\,(X^0-uX^1),\qquad\tilde X^1=\gamma_u\,(X^1-uX^0).$$

      The vector has chart components $X=(X^0,X^1)=(5,3)$. What is $\tilde X^0$? Give a decimal.
    answer: 4.3333333
    tolerance: 0.002
    answerText: '$\tfrac53(5-0.8\cdot3)=13/3\approx4.333$'
    wrong:
      - { value: 6.3333333, feedback: 'Sign slip: the observer moves along $+x$, so the frame components subtract: $X^0-uX^1$, not $X^0+uX^1$ (which is the inverse boost).' }
      - { value: 2.6, feedback: 'The factor $\gamma_u=5/3$ is missing: $5-0.8\cdot3=2.6$ must be multiplied by it.' }
      - { value: -1.6666667, feedback: 'That is $\tilde X^1$, the second component.' }
    explanation: |
      $$\tilde X^0=\tfrac53(5-2.4)=\tfrac{13}{3},\qquad\tilde X^1=\tfrac53(3-4)=-\tfrac53.$$
      Check: $g$ is preserved, $\tilde X^0{}^2-\tilde X^1{}^2=\tfrac{169-25}{9}=16=5^2-3^2$.

  - type: numeric
    id: q2c-ric00
    points: 0.4
    tag: Question 2 · Spacetime and Einstein's equations
    title: (c) The Ricci tensor of a fluid
    prompt: |
      In units with $8\pi G_N=1$ the Einstein equations in the trace-reversed form are

      $$\mathrm{Ric}=T-\tfrac12\,T^{\,m}{}_m\,g,\qquad T^{\,m}{}_m=\rho-3p\ \text{ for a fluid at rest},$$

      with $g=\eta=\mathrm{diag}(1,-1,-1,-1)$. At a point the energy–momentum tensor is that of a fluid at rest, $T_{ab}=\mathrm{diag}(\rho,p,p,p)$, with $\rho=4$ and $p=1$. What is $\mathrm{Ric}_{00}$? Give a decimal.
    answer: 3.5
    tolerance: 0.001
    answerText: '$4-\tfrac12(4-3)(1)=3.5$'
    wrong:
      - { value: 4, feedback: 'That is $T_{00}=\rho$. The trace term $-\tfrac12Tg_{00}$ must be subtracted: $T=\rho-3p=1$.' }
      - { value: 4.5, feedback: 'Sign slip: $g_{00}=+1$ in this signature, so the trace term is **subtracted**, $-\tfrac12\cdot1\cdot1=-\tfrac12$.' }
      - { value: 1.5, feedback: 'That is $\mathrm{Ric}_{11}$ ($=p-\tfrac12T\,g_{11}=1+\tfrac12$). The question asks for the time-time component.' }
    explanation: |
      The trace is $T^{\,m}{}_m=\rho-3p=1$, so
      $$\begin{aligned}\mathrm{Ric}_{00}&=T_{00}-\tfrac12\cdot1\cdot g_{00}\\&=4-\tfrac12=3.5=\tfrac12(\rho+3p),\end{aligned}$$
      the combination that makes pressure gravitate as well.

  - type: numeric
    id: q2c-ric11
    points: 0.4
    tag: Question 2 · Spacetime and Einstein's equations
    title: (c) A space component
    prompt: |
      Same fluid, $\rho=4$ and $p=1$, $T^{\,m}{}_m=1$, $g=\mathrm{diag}(1,-1,-1,-1)$ and $\mathrm{Ric}=T-\tfrac12\,T^{\,m}{}_m\,g$. What is $\mathrm{Ric}_{11}$? Give a decimal.
    answer: 1.5
    tolerance: 0.001
    answerText: '$1-\tfrac12(1)(-1)=1.5$'
    wrong:
      - { value: 0.5, feedback: 'Sign slip: $g_{11}=-1$, so $-\tfrac12Tg_{11}=+\tfrac12$.' }
      - { value: 1, feedback: 'That is $T_{11}=p$. The trace term $-\tfrac12Tg_{11}=+\tfrac12$ is missing.' }
      - { value: 3.5, feedback: 'That is $\mathrm{Ric}_{00}$, the time-time component.' }
    explanation: |
      $\mathrm{Ric}_{11}=T_{11}-\tfrac12T\,g_{11}=1-\tfrac12\cdot1\cdot(-1)=1.5=\tfrac12(\rho-p)$.

  - type: numeric
    id: q2d-static
    points: 0.5
    tag: Question 2 · Spacetime and Einstein's equations
    title: (d) A static clock near a mass
    prompt: |
      Outside a spherical mass, with $G_NM=1$, the metric is

      $$g=f\,dt\otimes dt-\frac1f\,dr\otimes dr-r^2\,d\theta\otimes d\theta-r^2\sin^2\theta\,d\phi\otimes d\phi,\qquad f=1-\frac2r.$$

      A clock stays at fixed $r=5$ (and fixed angles) while the coordinate time $t$ advances by $10$. Its proper time is $\int\sqrt{g(v,v)}\,d\lambda$ with $v=(1,0,0,0)$ in the coordinates $(t,r,\theta,\phi)$. How much proper time does it record? Give a decimal.
    answer: 7.7459667
    tolerance: 0.002
    answerText: '$10\sqrt{1-2/5}=10\sqrt{0.6}\approx7.746$'
    wrong:
      - { value: 10, feedback: 'That is the coordinate time. The clock at finite $r$ records less, by the factor $\sqrt f$ with $f=0.6$.' }
      - { value: 6, feedback: 'The factor is $\sqrt f$, not $f$: $g(v,v)=f$ and proper time takes the square root.' }
      - { value: 12.9099445, feedback: 'That is $10/\sqrt f$, the factor for a radial **length**, not for the clock rate.' }
    explanation: |
      For the static worldline $v=(1,0,0,0)$, so $g(v,v)=f(5)=1-\tfrac25=0.6$ and
      $$\tau=\int_0^{10}\sqrt{0.6}\,dt=10\sqrt{0.6}\approx7.746.$$

  - type: mcq
    id: q2e-vacuum
    points: 0.4
    tag: Question 2 · Spacetime and Einstein's equations
    title: (e) Which f solves the vacuum equations?
    prompt: |
      A static spherical metric $g=f\,dt\otimes dt-\frac1f\,dr\otimes dr-r^2\,d\theta\otimes d\theta-r^2\sin^2\theta\,d\phi\otimes d\phi$ with $G_NM=1$. In vacuum ($\mathrm{Ric}=0$) its angular component is $\mathrm{Ric}_{22}=1-(rf)'$, where the prime is $d/dr$. Which choice of $f$ satisfies $\mathrm{Ric}_{22}=0$ and decays to $1$ at large $r$ with the right Newtonian limit for a positive mass?
    options:
      - text: '$f=1-\dfrac2r$'
        correct: true
      - text: '$f=1-\dfrac2{r^2}$'
        feedback: |
          Then $rf=r-2/r$, $(rf)'=1+2/r^2$ and $\mathrm{Ric}_{22}=-2/r^2\neq0$: this $f$ needs a source (an electric-field-like energy density).
      - text: '$f=1-2r$'
        feedback: |
          Then $rf=r-2r^2$, $(rf)'=1-4r$ and $\mathrm{Ric}_{22}=4r\neq0$. It also does not tend to $1$ at large $r$.
      - text: '$f=1-\dfrac2r+\dfrac1{r^2}$'
        feedback: |
          Then $rf=r-2+1/r$, $(rf)'=1-1/r^2$ and $\mathrm{Ric}_{22}=1/r^2\neq0$: the extra term sources an electromagnetic field (the charged case), not a vacuum.
    explanation: |
      $\mathrm{Ric}_{22}=0$ means $(rf)'=1$, so $rf=r-c$ and $f=1-c/r$. Matching the Newtonian limit $g_{00}\approx1+2\phi$ with $\phi=-G_NM/r$ gives $c=2G_NM=2$, the Schwarzschild solution.

  # ------------------------------------------------------------- Question 3
  - type: numeric
    id: q3a-kepler
    points: 0.8
    tag: Question 3 · From Newton to Einstein around a point mass
    title: (a) A circular orbit in the Newtonian theory
    prompt: |
      A point mass $M$ sits at the origin of an inertial chart, with $G_NM=1$. Its potential is $\phi=-G_NM/|x|$, so a free particle obeys $\ddot\gamma^\alpha=-\partial_\alpha\phi$. A free particle moves on a circle of radius $r=4$ around the mass, with constant angular speed $\omega$ (angle per unit of absolute time $t$). What is $\omega$? Give a decimal.
    answer: 0.125
    tolerance: 0.0005
    answerText: '$\omega^2=G_NM/r^3=1/64$, so $\omega=1/8$'
    wrong:
      - { value: 0.25, feedback: 'Check the balance: the centripetal acceleration is $\omega^2r$ and the pull is $G_NM/r^2$, so $\omega^2=G_NM/r^3=1/64$, not $1/16$.' }
      - { value: 0.015625, feedback: 'That is $\omega^2=1/64$. The question asks for $\omega$ itself, the square root.' }
      - { value: 0.5, feedback: 'That is the orbital **speed** $\sqrt{G_NM/r}=\tfrac12$. The angular speed divides it by $r=4$.' }
    explanation: |
      The inward acceleration is $\partial_r\phi=G_NM/r^2=\tfrac1{16}$, and a circle needs $\omega^2r$. So $\omega^2\cdot4=\tfrac1{16}$, i.e. $\omega^2=\tfrac1{64}$ and $\omega=\tfrac18=0.125$ (Kepler's third law).

  - type: numeric
    id: q3b-newtidal
    points: 0.8
    tag: Question 3 · From Newton to Einstein around a point mass
    title: (b) The radial tidal coefficient
    prompt: |
      With the same potential $\phi=-1/r$ (so $G_NM=1$), the tidal equation $\ddot\eta^\alpha=-\mathrm{Riem}^\alpha_{0\beta0}\,\eta^\beta$ has $\mathrm{Riem}^\alpha_{0\beta0}=\partial_\alpha\partial_\beta\phi$. Along the radial direction the relevant entry is $\partial_r\partial_r\phi=\dfrac{d^2\phi}{dr^2}$. Evaluate it at $r=4$. Give a decimal.
    answer: -0.03125
    tolerance: 0.0002
    answerText: 'second derivative of $-1/r$: $-2/r^3=-2/64$'
    wrong:
      - { value: 0.03125, feedback: 'Sign slip: $\phi''=+1/r^2$ and differentiating once more gives $-2/r^3$, negative. (Negative means stretching along the line to the mass.)' }
      - { value: 0.0625, feedback: 'That is the first derivative $\phi''=1/r^2=\tfrac1{16}$, the acceleration itself, not its gradient.' }
      - { value: -0.0625, feedback: 'Differentiating $r^{-2}$ brings down a factor $-2$: $\tfrac{d}{dr}(r^{-2})=-2r^{-3}$, giving $-2/64$.' }
    explanation: |
      $$\begin{aligned}\phi&=-\frac1r,\qquad\phi'=\frac1{r^2},\\\phi''&=-\frac2{r^3}=-\frac2{64}=-0.03125.\end{aligned}$$
      Then $\ddot\eta^r=+0.03125\,\eta^r$: stretching along the radius.

  - type: numeric
    id: q3c-reltidal
    points: 0.8
    tag: Question 3 · From Newton to Einstein around a point mass
    title: (c) The same tide in the Schwarzschild metric
    prompt: |
      In general relativity the field of the same mass ($G_NM=1$) is the metric, with signature $(+,-,-,-)$ and $(t,r,\theta,\phi)$ coordinates,

      $$g=f\,dt\otimes dt-\frac1f\,dr\otimes dr-r^2\,d\theta\otimes d\theta-r^2\sin^2\theta\,d\phi\otimes d\phi,\qquad f=1-\frac2r.$$

      For a static metric of this form, the radial tidal component of the curvature is $\mathrm{Riem}^1_{010}=\tfrac12\,f\,f''$, with $f''=d^2f/dr^2$. Evaluate it at $r=4$. Give a decimal.
    answer: -0.015625
    tolerance: 0.0002
    answerText: '$f=\tfrac12$, $f''''=-4/r^3=-\tfrac1{16}$, so $\tfrac12\cdot\tfrac12\cdot(-\tfrac1{16})=-\tfrac1{64}$'
    wrong:
      - { value: -0.03125, feedback: 'That is the Newtonian value $-2/r^3$. The relativistic one has the extra factor $f=\tfrac12$ at $r=4$.' }
      - { value: -0.0625, feedback: 'That is $f''''=-4/r^3$ alone. The formula is $\tfrac12ff''''$: multiply by $f=\tfrac12$ and by $\tfrac12$.' }
      - { value: 0.015625, feedback: 'Sign slip: $f=1-2/r$ gives $f''=2/r^2$ and $f''''=-4/r^3$, negative.' }
    explanation: |
      $$f=1-\frac2r,\quad f'=\frac2{r^2},\quad f''=-\frac4{r^3},$$
      so at $r=4$: $f=\tfrac12$, $f''=-\tfrac1{16}$ and $\mathrm{Riem}^1_{010}=\tfrac12\cdot\tfrac12\cdot(-\tfrac1{16})=-\tfrac1{64}=-0.015625$.

  - type: mcq
    id: q3d-compare
    points: 0.6
    tag: Question 3 · From Newton to Einstein around a point mass
    title: (d) Newton against Einstein
    prompt: |
      At $r=4$ the Newtonian radial tidal entry is $-0.03125$ and the Schwarzschild one, $\mathrm{Riem}^1_{010}$, is $-0.015625$, with $f=\tfrac12$ there. Which statement is correct?
    options:
      - text: 'The relativistic entry equals the Newtonian one times $f$ ($\mathrm{Riem}^1_{010}=-f\,\dfrac{2G_NM}{r^3}$), so the two agree when $f\to1$, far from the mass; both signs say the same: stretching along the radius'
        correct: true
      - text: 'They differ because the Newtonian theory has no curvature at all'
        feedback: |
          Newton–Cartan theory has curvature $\mathrm{Riem}^\alpha_{0\beta0}=\partial_\alpha\partial_\beta\phi$: it is exactly the tide. What it lacks is a metric of spacetime.
      - text: 'They must be equal, since both describe the same mass'
        feedback: |
          They are equal only when $f\to1$. Near the mass the chart time $t$ and the proper time of a static clock differ by $\sqrt f$, and the components change accordingly.
      - text: 'The relativistic value has the opposite sign, so it squeezes along the radius'
        feedback: |
          Both are negative; with $\ddot\eta^\alpha=-\mathrm{Riem}^\alpha_{0\beta0}\eta^\beta$ both stretch along the radius.
    explanation: |
      $\mathrm{Riem}^1_{010}=\tfrac12ff''=\tfrac12f\cdot\big(-\tfrac4{r^3}\big)=-f\,\tfrac{2G_NM}{r^3}$ with $G_NM=1$. For $r\gg2G_NM$, $f\to1$ and the Newtonian tide is recovered.

  - type: numeric
    id: q3e-orbitclock
    points: 1
    tag: Question 3 · From Newton to Einstein around a point mass
    title: (e) The clock of the orbiting particle
    prompt: |
      In the Schwarzschild metric above ($f=1-2/r$), a clock rides the circular orbit of radius $r=4$ in the plane $\theta=\pi/2$, with the angular speed of part (a) (in this metric the same value $\omega=\tfrac18$ per unit of $t$ is a free circular orbit). Its worldline is $(t,r,\theta,\phi)=(\lambda,\,4,\,\tfrac\pi2,\,\omega\lambda)$, and its proper time is $\int\sqrt{g(v,v)}\,d\lambda$ with $v=(1,0,0,\omega)$. How much proper time passes while $t$ advances by $10$? Give a decimal.
    answer: 5
    tolerance: 0.001
    answerText: '$g(v,v)=f-r^2\omega^2=\tfrac12-\tfrac14=\tfrac14$, so $10\sqrt{1/4}=5$'
    wrong:
      - { value: 7.0710678, feedback: 'That is the clock at rest at $r=4$ ($10\sqrt f$). The orbiting clock also moves, which slows it further: $g(v,v)=f-r^2\omega^2$.' }
      - { value: 10, feedback: 'That is the coordinate time. Both the depth in the potential and the speed make the clock run slow.' }
      - { value: 8.6602540, feedback: 'That uses only the speed term, $1-r^2\omega^2=\tfrac34$. The metric coefficient of $dt^2$ is $f=\tfrac12$, not $1$.' }
    explanation: |
      With $\sin\theta=1$,
      $$g(v,v)=f-r^2\omega^2=\frac12-16\cdot\frac1{64}=\frac14,$$
      so $\tau=10\sqrt{1/4}=5$: half of the coordinate time. The static clock at the same radius would record $7.07$; the motion costs the rest.
