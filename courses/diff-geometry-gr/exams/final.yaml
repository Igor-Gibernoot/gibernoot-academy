      - text: '$(1,0)$: the second component degenerates near the poles'
        feedback: |
          $\sin\alpha_1$ vanishes only at $\alpha_1=0,\pi$, the poles, which are not in the chart domain; throughout $\mathcal{U}$ the determinant $\sin^2\alpha_1$ is non-zero, so the signature has two entries summing to $2$.
      - text: '$(0,2)$: a sphere is curved, so the metric is negative definite'
