          With $\dot\alpha_2=0$ the second equation holds **identically** (every term has a factor $\dot\alpha_2$ or $\ddot\alpha_2$), and it imposes nothing on $\alpha_1$.
    explanation: |
      With $\dot\alpha_2=\ddot\alpha_2=0$ the second equation is trivial and the first becomes $\ddot\alpha_1=0$, so $\alpha_1(\lambda)=\bar\alpha_1+v\lambda$, and the speed is $\sqrt{g_{11}\dot\alpha_1^2}=|v|$. Every meridian is a geodesic, traversed at constant rate in $\alpha_1$.

  - type: numeric
    id: q2d-par
    points: 0.18
    tag: Question 2 · The induced metric and its geodesics
    title: (d)(ii)(B) Parallels
    prompt: |
      Now look for **parallels**, $\alpha_1(\lambda)=\bar\alpha_1$ constant, with $\dot\alpha_2\neq0$, among the solutions of $\ddot\alpha_1-\sin\alpha_1\cos\alpha_1\,\dot\alpha_2^2=0$, $\ \ddot\alpha_2+2\cot\alpha_1\,\dot\alpha_1\dot\alpha_2=0$. For which value $\bar\alpha_1\in(0,\pi)$ is the parallel a geodesic? Give a decimal (radians).
    answer: 1.5707963
    tolerance: 0.001
    answerText: 'π/2 ≈ 1.5708 (the equator)'
    wrong:
      - { value: 0.7853982, feedback: 'The parallel $\alpha_1=\pi/4$ is the purple dashed curve of the figure: it is **not** a geodesic. With $\dot\alpha_1=\ddot\alpha_1=0$ the first equation leaves $-\sin\bar\alpha_1\cos\bar\alpha_1\,\dot\alpha_2^2=0$, which fails when $\cos\bar\alpha_1\neq0$.' }
      - { value: 0, feedback: 'The poles $\alpha_1=0,\pi$ are not in $(0,\pi)$ and are not parallels of positive length; there $\sin\bar\alpha_1=0$ (the circle degenerates to a point), but the condition on a genuine parallel with $\dot\alpha_2\neq0$ is $\cos\bar\alpha_1=0$.' }
      - { value: 3.1415927, feedback: 'The pole $\alpha_1=\pi$ is a single point, not a parallel; also it lies outside the open interval $(0,\pi)$. The vanishing factor that matters is $\cos\bar\alpha_1$.' }
    explanation: |
      With $\dot\alpha_1=\ddot\alpha_1=0$ the second equation gives $\ddot\alpha_2=0$, so $\alpha_2=\bar\alpha_2+\omega\lambda$, $\omega\neq0$, and the first becomes $-\sin\bar\alpha_1\cos\bar\alpha_1\,\omega^2=0$. Since $\sin\bar\alpha_1>0$ and $\omega\neq0$, we need $\cos\bar\alpha_1=0$: $\bar\alpha_1=\pi/2$.

  - type: order
    id: q2d-par-order
    points: 0.18
    tag: Question 2 · The induced metric and its geodesics
    title: (d)(ii)(B) The argument for parallels
    prompt: |
      Put in order the argument that decides which parallels, $\alpha_1(\lambda)=\bar\alpha_1$ with $\dot\alpha_2\neq0$, solve the geodesic equation $\ddot\alpha_1-\sin\alpha_1\cos\alpha_1\,\dot\alpha_2^2=0$, $\ddot\alpha_2+2\cot\alpha_1\,\dot\alpha_1\dot\alpha_2=0$.
    steps:
      - 'Impose $\dot\alpha_1=\ddot\alpha_1=0$ in both equations'
      - 'The second equation becomes $\ddot\alpha_2=0$: $\alpha_2=\bar\alpha_2+\omega\lambda$ with $\omega\neq0$ constant'
      - 'The first equation becomes $-\sin\bar\alpha_1\cos\bar\alpha_1\,\omega^2=0$'
      - 'Since $\omega\neq0$ and $\sin\bar\alpha_1>0$, it requires $\cos\bar\alpha_1=0$'
      - 'Hence only $\bar\alpha_1=\pi/2$: the equator is the only parallel that is a geodesic'
    explanation: |
      Imposing the ansatz first simplifies both equations; the second only fixes the speed along the parallel, and the first is a condition on $\bar\alpha_1$ alone, solved only by the equator.

  - type: numeric
    id: q2d-gamma-acc
    points: 0.15
    tag: Question 2 · The induced metric and its geodesics
    title: (d)(iii) Is γ a geodesic of g?
    prompt: |
      On the meridian $\alpha_2=0$ the geodesics of $g$ are those with $\ddot\alpha_1=0$. The curve $\gamma(\lambda)=\mathscr{Y}^{-1}(\lambda,0)=(\lambda,0,\sqrt{1-\lambda^2})$ has $c=\cos\alpha_1=\sqrt{1-\lambda^2}$, so $\alpha_1(\lambda)=\arcsin\lambda$. What is $\ddot\alpha_1$ at $\lambda=\tfrac12$? Give a decimal.
    answer: 0.7698004
    tolerance: 0.001
    answerText: 'λ(1-λ²)^(-3/2) at λ=1/2: 0.7698'
    wrong:
      - { value: 0, feedback: 'That is the value for $\delta$, with $\alpha_1=\lambda$. For $\gamma$, $\alpha_1=\arcsin\lambda$ is not linear in $\lambda$.' }
      - { value: 1.1547005, feedback: 'That is the **first** derivative $\dot\alpha_1=(1-\lambda^2)^{-1/2}$ at $\lambda=\tfrac12$. One more derivative is needed.' }
      - { value: 0.5773503, feedback: 'Exponent slip: $\frac{d}{d\lambda}(1-\lambda^2)^{-1/2}=\lambda(1-\lambda^2)^{-3/2}$, with exponent $-\tfrac32$.' }
    explanation: |
      $$\begin{aligned}\dot\alpha_1&=(1-\lambda^2)^{-1/2},\\\ddot\alpha_1&=\lambda(1-\lambda^2)^{-3/2}\neq0\ \text{ on }(0,1),\end{aligned}$$
      which is $0.5\cdot0.75^{-3/2}\approx0.7698$ at $\lambda=\tfrac12$. And $\delta$, with $\alpha_1=\lambda$, has $\ddot\alpha_1=0$.

  - type: mcq
    id: q2d-compare
    points: 0.15
    tag: Question 2 · The induced metric and its geodesics
    title: (d)(iii) Comparing the two connections
    prompt: |
      Both $\gamma(\lambda)=\mathscr{Y}^{-1}(\lambda,0)$ and $\delta(\lambda)=\mathscr{X}^{-1}(\lambda,0)$ run along the meridian $\alpha_2=0$. For $\nabla^{\mathrm{P}}$ (Question 1) $\gamma$ is autoparallelly transported and $\delta$ is only autoparallel. For the geodesics of $g$ (meridians are geodesics when $\ddot\alpha_1=0$, and $\ddot\alpha_1$ of $\gamma$ is non-zero), which statement is right?
    options:
      - text: '$\delta$ is a geodesic of $g$ and $\gamma$ is not: it is the other way round, but both connections share the meridian as an autoparallel curve, not its uniform parametrization'
        correct: true
      - text: 'Both are geodesics of $g$, since both trace the same meridian'
        feedback: |
          A geodesic is a **parametrized** curve (constant speed for the Levi-Civita connection). $\gamma$ has $\ddot\alpha_1\neq0$: it runs at varying speed along the meridian.
      - text: '$\gamma$ is a geodesic of $g$ and $\delta$ is not, the same pattern as for $\nabla^{\mathrm{P}}$'
        feedback: |
          Reversed. For $g$, $\delta$ has $\alpha_1=\lambda$, so $\ddot\alpha_1=0$ and constant speed $1$; $\gamma$ has $\alpha_1=\arcsin\lambda$.
      - text: 'Neither is a geodesic of $g$, because the meridian is not a straight line in the projection chart'
        feedback: |
          Straightness in the projection chart concerns $\nabla^{\mathrm{P}}$, not $g$; the meridian is a great-circle arc, so it is a geodesic when traversed at constant speed, which $\delta$ does.
    explanation: |
      $\delta$ is a geodesic of $g$ ($\ddot\alpha_1=0$), $\gamma$ is not ($\ddot\alpha_1\neq0$). For $\nabla^{\mathrm{P}}$ it is the other way round. The two connections share the meridian as an autoparallel **curve** (image), but not its "uniform" parametrization.

  # ------------------------------------------------------------- Question 3
  - type: numeric
    id: q3a-detV
    points: 0.12
    tag: Question 3 · Volume form and integrals
    title: (a) The determinant of ᛞ_VU
    prompt: |
      Take the Jacobian of the transition from the angle chart to the projection chart,

      $$\text{ᛞ}_{\mathcal{V}\mathcal{U}}(\alpha)=\begin{bmatrix}\cos\alpha_1\cos\alpha_2&-\sin\alpha_1\sin\alpha_2\\ \cos\alpha_1\sin\alpha_2&\sin\alpha_1\cos\alpha_2\end{bmatrix}.$$

      What is $\det\text{ᛞ}_{\mathcal{V}\mathcal{U}}(\alpha)$ at a point with $\alpha_1=\tfrac\pi6$ (the value does not depend on $\alpha_2$)? Give a decimal.
    answer: 0.4330127
    tolerance: 0.001
    answerText: 'sin(π/6) cos(π/6) = √3/4 ≈ 0.433'
    wrong:
      - { value: 0.8660254, feedback: 'That is $\cos\alpha_1$ alone. The determinant is $\cos\alpha_1\cos\alpha_2\cdot\sin\alpha_1\cos\alpha_2+\sin\alpha_1\sin\alpha_2\cdot\cos\alpha_1\sin\alpha_2=\sin\alpha_1\cos\alpha_1(\cos^2\alpha_2+\sin^2\alpha_2)$.' }
      - { value: 0.5, feedback: 'That is $\sin\alpha_1$ alone: the factor $\cos\alpha_1$ is missing.' }
      - { value: -0.4330127, feedback: 'Sign slip: the product of the off-diagonal entries is $(-\sin\alpha_1\sin\alpha_2)(\cos\alpha_1\sin\alpha_2)$, and it is **subtracted**, so its minus sign gives a plus.' }
    explanation: |
      $$\begin{aligned}\det\text{ᛞ}_{\mathcal{V}\mathcal{U}}(\alpha)&=\sin\alpha_1\cos\alpha_1\,(\cos^2\alpha_2+\sin^2\alpha_2)\\&=\sin\alpha_1\cos\alpha_1,\end{aligned}$$
      equal to $\tfrac12\cdot\tfrac{\sqrt3}{2}=\tfrac{\sqrt3}{4}\approx0.433$ at $\alpha_1=\pi/6$.

  - type: numeric
    id: q3a-detU
    points: 0.09
    tag: Question 3 · Volume form and integrals
    title: (a) The determinant of ᛞ_UV
    prompt: |
      The Jacobian in the other direction is

      $$\text{ᛞ}_{\mathcal{U}\mathcal{V}}(\beta)=\begin{bmatrix}\dfrac{\beta_1}{\sqrt{\beta_1^2+\beta_2^2}\sqrt{1-\beta_1^2-\beta_2^2}}&\dfrac{\beta_2}{\sqrt{\beta_1^2+\beta_2^2}\sqrt{1-\beta_1^2-\beta_2^2}}\\[2ex]-\dfrac{\beta_2}{\beta_1^2+\beta_2^2}&\dfrac{\beta_1}{\beta_1^2+\beta_2^2}\end{bmatrix}.$$

      Evaluate $\det\text{ᛞ}_{\mathcal{U}\mathcal{V}}(\beta)$ at $\beta=(\tfrac12,0)$. (This is the point with $\alpha_1=\tfrac\pi6$, $\alpha_2=0$.) Give a decimal.
    answer: 2.3094011
    tolerance: 0.001
    answerText: '1/(sin(π/6) cos(π/6)) = 4/√3 ≈ 2.309'
    wrong:
      - { value: 0.4330127, feedback: 'That is $\det\text{ᛞ}_{\mathcal{V}\mathcal{U}}$ at the same point. The two Jacobians are inverse matrices, so their determinants are **reciprocal**.' }
      - { value: 1.1547005, feedback: 'The entries at $\beta=(\tfrac12,0)$ are $\frac{1/2}{\frac12\cdot\frac{\sqrt3}{2}}=\frac{2}{\sqrt3}$ and $\frac{1/2}{1/4}=2$; their product is $\frac{4}{\sqrt3}$, not just one of them.' }
      - { value: -2.3094011, feedback: 'Sign slip: with $\beta_2=0$ the off-diagonal entries vanish ($\beta_2=0$ in both), so the determinant is the product of the diagonal entries, both positive.' }
    explanation: |
      $$\det\text{ᛞ}_{\mathcal{U}\mathcal{V}}(\beta)=\frac{1}{\sqrt{\beta_1^2+\beta_2^2}\sqrt{1-\beta_1^2-\beta_2^2}},$$
      which is $\frac{1}{\frac12\cdot\frac{\sqrt3}{2}}=\frac{4}{\sqrt3}\approx2.309$ at $\beta=(\tfrac12,0)$. At $\beta=\text{ᛖ}_{\mathcal{U}\mathcal{V}}(\alpha)$ the product $\sqrt{\beta_1^2+\beta_2^2}\sqrt{1-\beta_1^2-\beta_2^2}$ equals $\sin\alpha_1\cos\alpha_1$, so the two determinants are inverse to each other.

  - type: mcq
    id: q3a-atlas
    points: 0.09
    tag: Question 3 · Volume form and integrals
    title: (a) Same oriented atlas?
    prompt: |
      $\det\text{ᛞ}_{\mathcal{V}\mathcal{U}}(\alpha)=\sin\alpha_1\cos\alpha_1$ and $\det\text{ᛞ}_{\mathcal{U}\mathcal{V}}(\beta)=\dfrac{1}{\sqrt{\beta_1^2+\beta_2^2}\sqrt{1-\beta_1^2-\beta_2^2}}$. On the overlap $\mathcal{U}\cap\mathcal{V}$ we have $\alpha_1\in(0,\tfrac\pi2)$ and $0<\beta_1^2+\beta_2^2<1$. Can $(\mathcal{U},\mathscr{X})$ and $(\mathcal{V},\mathscr{Y})$ belong to the same oriented atlas?
    options:
      - text: 'Yes: both determinants are positive everywhere on the overlap, so the charts are orientation compatible'
        correct: true
      - text: 'No: the determinant is not $1$, so the transition does not preserve areas'
        feedback: |
          Orientation compatibility asks only for a **positive** Jacobian determinant, not for determinant $1$ (area preservation is a different, much stronger, condition, and it is not a chart property).
      - text: 'No: $\sin\alpha_1\cos\alpha_1$ vanishes at $\alpha_1=\tfrac\pi2$, so the sign is not constant'
        feedback: |
          $\alpha_1=\tfrac\pi2$ is the equator, the boundary of $\mathcal{V}$, which is **not** in the overlap (the overlap has $\alpha_1\in(0,\tfrac\pi2)$). Inside it the product is strictly positive.
      - text: 'No: the two determinants are different functions, so one chart must be reoriented'
        feedback: |
          They are different functions of different coordinates, but they are **reciprocal** at corresponding points, and both are positive. Reorienting is only needed when a determinant is negative.
    explanation: |
      $\det\text{ᛞ}_{\mathcal{V}\mathcal{U}}>0$ and $\det\text{ᛞ}_{\mathcal{U}\mathcal{V}}>0$ on the overlap (reciprocal at corresponding points), so the two charts can belong to the same oriented atlas.

  - type: mcq
    id: q3b-wx
    points: 0.12
    tag: Question 3 · Volume form and integrals
    title: (b) The density in the angle chart
    figure:
      widget: sphere
      config:
        view: region
        labels: { region: 'Figure 4 · the region' }
    prompt: |
      The metric volume form $\Omega^g$ has components $(\Omega^g_{\mathscr{X}})_{ij}(\alpha)=\omega^g_{\mathscr{X}}(\alpha)\,\varepsilon_{ij}$, with $\varepsilon_{12}=-\varepsilon_{21}=1$ and the scalar density $\omega^g_{\mathscr{X}}(\alpha)=\sqrt{|\det g_{\mathscr{X}}(\alpha)|}$. For $(g_{\mathscr{X}})_{ij}=\mathrm{diag}(1,\sin^2\alpha_1)$, what is $\omega^g_{\mathscr{X}}(\alpha)$ on $\alpha_1\in(0,\pi)$?
    options:
      - text: '$\sin\alpha_1$'
        correct: true
      - text: '$\sin^2\alpha_1$'
        feedback: |
          That is $\det g_{\mathscr{X}}$. The density is its **square root**, $\sqrt{\sin^2\alpha_1}=|\sin\alpha_1|=\sin\alpha_1$.
      - text: '$1/\sin\alpha_1$'
        feedback: |
          That would be the density of the inverse metric, $\sqrt{\det g^{-1}}$. The volume form uses $\sqrt{|\det g|}$.
      - text: '$1$'
        feedback: |
          That is the density of the **flat** metric in coordinates $(\alpha_1,\alpha_2)$. The area element on the sphere shrinks towards the poles: $\omega^g_{\mathscr{X}}=\sin\alpha_1$.
    explanation: |
      $\det g_{\mathscr{X}}=\sin^2\alpha_1$, so $\omega^g_{\mathscr{X}}=\sqrt{\sin^2\alpha_1}=\sin\alpha_1$, positive on $(0,\pi)$.

  - type: mcq
    id: q3b-omega
    points: 0.12
    tag: Question 3 · Volume form and integrals
    title: (b) The components of the volume form
    prompt: |
      With $\omega^g_{\mathscr{X}}(\alpha)=\sin\alpha_1$ and $(\Omega^g_{\mathscr{X}})_{ij}(\alpha)=\omega^g_{\mathscr{X}}(\alpha)\,\varepsilon_{ij}$ ($\varepsilon_{12}=-\varepsilon_{21}=1$), which pair $\big((\Omega^g_{\mathscr{X}})_{12},(\Omega^g_{\mathscr{X}})_{21}\big)$ is correct?
    options:
      - text: '$(\sin\alpha_1,\ -\sin\alpha_1)$'
        correct: true
      - text: '$(\sin\alpha_1,\ \sin\alpha_1)$'
        feedback: |
          That would be a symmetric tensor. A volume form is **antisymmetric**: swapping the two arguments flips the sign, $\varepsilon_{21}=-\varepsilon_{12}$.
      - text: '$(-\sin\alpha_1,\ \sin\alpha_1)$'
        feedback: |
          Reversed signs: $(\Omega^g_{\mathscr{X}})_{12}=\omega^g\varepsilon_{12}=+\sin\alpha_1$ for the positive orientation.
      - text: '$(\sin^2\alpha_1,\ -\sin^2\alpha_1)$'
        feedback: |
          The antisymmetry is right but the density is $\sqrt{\det g}=\sin\alpha_1$, not $\det g$.
    explanation: |
      $$(\Omega^g_{\mathscr{X}})_{12}(\alpha)=\sin\alpha_1,\qquad(\Omega^g_{\mathscr{X}})_{21}(\alpha)=-\sin\alpha_1,$$
      and the diagonal components vanish.

  - type: mcq
    id: q3b-sub
    points: 0.06
    tag: Question 3 · Volume form and integrals
    title: (b) Expressing sin α₁ in the projection chart
    prompt: |
      To use the transformation law $\omega^g_{\mathscr{Y}}(\beta)=\det\big(\tfrac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^j}\big)(\beta)\,\omega^g_{\mathscr{X}}(\alpha)$ with $\alpha=\text{ᛖ}_{\mathcal{V}\mathcal{U}}(\beta)$, we need $\sin\alpha_1$ as a function of $\beta$. Recall $\alpha_1=\arccos\sqrt{1-\beta_1^2-\beta_2^2}$. What is $\sin\alpha_1$?
    options:
      - text: '$\sqrt{\beta_1^2+\beta_2^2}$'
        correct: true
      - text: '$\sqrt{1-\beta_1^2-\beta_2^2}$'
        feedback: |
          That is $\cos\alpha_1$ (the $c$ coordinate). We have $\cos\alpha_1=\sqrt{1-\beta_1^2-\beta_2^2}$ and $\sin\alpha_1=\sqrt{1-\cos^2\alpha_1}$.
      - text: '$\beta_1^2+\beta_2^2$'
        feedback: |
          That is $\sin^2\alpha_1$; we need the square root. (Geometrically, $\sin\alpha_1$ is the distance from the $c$-axis, the radius of the parallel.)
      - text: '$\beta_1\cos\alpha_2+\beta_2\sin\alpha_2$ with arbitrary $\alpha_2$'
        feedback: |
          That is not a function of $\beta$ alone. Since $\beta=\sin\alpha_1(\cos\alpha_2,\sin\alpha_2)$, the length of $\beta$ is $\sin\alpha_1$.
    explanation: |
      $\sin^2\alpha_1=1-\cos^2\alpha_1=1-(1-\beta_1^2-\beta_2^2)=\beta_1^2+\beta_2^2$, so $\sin\alpha_1=\sqrt{\beta_1^2+\beta_2^2}$ (positive on $(0,\pi/2)$).

  - type: numeric
    id: q3b-wy
    points: 0.15
    tag: Question 3 · Volume form and integrals
    title: (b) The density in the projection chart
    prompt: |
      Use the transformation law

      $$\omega^g_{\mathscr{Y}}(\beta)=\det\Big(\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^j}\Big)(\beta)\ \omega^g_{\mathscr{X}}(\alpha),\qquad\alpha=\text{ᛖ}_{\mathcal{V}\mathcal{U}}(\beta),$$

      with $\det\big(\tfrac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^j}\big)=\dfrac{1}{\sqrt{\beta_1^2+\beta_2^2}\sqrt{1-\beta_1^2-\beta_2^2}}$, $\ \omega^g_{\mathscr{X}}=\sin\alpha_1$ and $\sin\alpha_1=\sqrt{\beta_1^2+\beta_2^2}$. What is $\omega^g_{\mathscr{Y}}$ at $\beta=(\tfrac12,0)$? Give a decimal.
    answer: 1.1547005
    tolerance: 0.001
    answerText: '1/√(1-1/4) = 2/√3 ≈ 1.155'
    wrong:
      - { value: 2.3094011, feedback: 'That is the determinant alone. The law multiplies it by $\omega^g_{\mathscr{X}}=\sin\alpha_1=\tfrac12$ at this point.' }
      - { value: 0.5, feedback: 'That is $\omega^g_{\mathscr{X}}=\sin\alpha_1$ alone, copied from the angle chart. The density is **not** a scalar: it picks up the determinant of the Jacobian.' }
      - { value: 0.8660254, feedback: 'That is $\sqrt{1-\beta_1^2-\beta_2^2}$, the **inverse** of the correct factor. The $\sqrt{\beta_1^2+\beta_2^2}$ cancels, leaving $1/\sqrt{1-\beta_1^2-\beta_2^2}$.' }
    explanation: |
      $$\begin{aligned}\omega^g_{\mathscr{Y}}(\beta)&=\frac{\sqrt{\beta_1^2+\beta_2^2}}{\sqrt{\beta_1^2+\beta_2^2}\sqrt{1-\beta_1^2-\beta_2^2}}\\&=\frac{1}{\sqrt{1-\beta_1^2-\beta_2^2}},\end{aligned}$$
      which is $1/\sqrt{3/4}=2/\sqrt3\approx1.155$ at $\beta=(\tfrac12,0)$. It grows towards the rim of the disk, where the projection compresses the sphere.

  - type: mcq
    id: q3c-xd
    points: 0.15
    tag: Question 3 · Volume form and integrals
    title: (c) The region in the angle chart
    figure:
      widget: sphere
      config:
        view: region
        labels: { region: 'Figure 4 · the region' }
    prompt: |
      Consider the region $\mathcal{D}:=\{p=(a,b,c)\in\mathcal{M}\mid a>0,\ \tfrac12<c<\tfrac{\sqrt3}{2}\}$ and the scalar field $f(p):=c$. At $p=\mathscr{X}^{-1}(\alpha)$ we have $c=\cos\alpha_1$ and $a=\sin\alpha_1\cos\alpha_2$. What is $\mathscr{X}(\mathcal{D})$?
    options:
      - text: '$\big(\tfrac\pi6,\tfrac\pi3\big)\times\big(-\tfrac\pi2,\tfrac\pi2\big)$'
        correct: true
      - text: '$\big(\tfrac\pi3,\tfrac\pi2\big)\times\big(-\tfrac\pi2,\tfrac\pi2\big)$'
        feedback: |
          That treats $\tfrac12<c<\tfrac{\sqrt3}{2}$ as $\tfrac12<\sin\alpha_1<\tfrac{\sqrt3}{2}$ or similar. Here $c=\cos\alpha_1$ is **decreasing** on $(0,\pi)$: $\cos\tfrac\pi3=\tfrac12$ and $\cos\tfrac\pi6=\tfrac{\sqrt3}{2}$, so $\alpha_1\in(\tfrac\pi6,\tfrac\pi3)$.
      - text: '$\big(\tfrac\pi6,\tfrac\pi3\big)\times\big(0,\pi\big)$'
        feedback: |
          $a=\sin\alpha_1\cos\alpha_2>0$ requires $\cos\alpha_2>0$, that is $\alpha_2\in(-\tfrac\pi2,\tfrac\pi2)$; the interval $(0,\pi)$ would give $b>0$ instead.
      - text: '$\big(\tfrac\pi6,\tfrac\pi3\big)\times\big(-\pi,\pi\big)$'
        feedback: |
          That drops the condition $a>0$ and covers the whole ring $\tfrac12<c<\tfrac{\sqrt3}{2}$. Only the half with $\cos\alpha_2>0$ belongs to $\mathcal{D}$.
    explanation: |
      $\cos$ is decreasing on $(0,\pi)$, so $\tfrac12<\cos\alpha_1<\tfrac{\sqrt3}{2}\iff\tfrac\pi6<\alpha_1<\tfrac\pi3$; and $a>0\iff\cos\alpha_2>0\iff\alpha_2\in(-\tfrac\pi2,\tfrac\pi2)$.

  - type: mcq
    id: q3c-yd
    points: 0.15
    tag: Question 3 · Volume form and integrals
    title: (c) The region in the projection chart
    figure:
      widget: sphere
      config:
        view: region
        labels: { region: 'Figure 4 · the region' }
    prompt: |
      At $p=\mathscr{Y}^{-1}(\beta)$ we have $a=\beta_1$ and $c=\sqrt{1-\beta_1^2-\beta_2^2}$. For the same region $\mathcal{D}=\{a>0,\ \tfrac12<c<\tfrac{\sqrt3}{2}\}$, what is $\mathscr{Y}(\mathcal{D})$?
    options:
      - text: '$\big\{\beta_1>0,\ \tfrac14<\beta_1^2+\beta_2^2<\tfrac34\big\}$, a half annulus'
        correct: true
      - text: '$\big\{\beta_1>0,\ \tfrac12<\beta_1^2+\beta_2^2<\tfrac{\sqrt3}{2}\big\}$'
        feedback: |
          The bounds on $c$ were copied without squaring. $c^2=1-\beta_1^2-\beta_2^2\in(\tfrac14,\tfrac34)$ gives $\beta_1^2+\beta_2^2=1-c^2\in(\tfrac14,\tfrac34)$.
      - text: '$\big\{\beta_1>0,\ \tfrac14<\beta_1^2+\beta_2^2<\tfrac34\big\}$ but with $\beta_1^2+\beta_2^2=c^2$, so the annulus is $\tfrac12<\sqrt{\beta_1^2+\beta_2^2}<\tfrac{\sqrt3}{2}$ and $\beta_2>0$'
        feedback: |
          Two slips: the radius range $\tfrac12<r<\tfrac{\sqrt3}{2}$ is right but comes from $r=\sin\alpha_1$, not $c$; and the sign condition is on $a=\beta_1$, not on $\beta_2$.
      - text: '$\big\{\beta_1>0,\ \tfrac14<1-\beta_1^2-\beta_2^2<\tfrac34\big\}$ with $\beta_1$ unrestricted'
        feedback: |
          The ring condition is right but $a=\beta_1>0$ must be imposed: that keeps only the half plane $\beta_1>0$.
    explanation: |
      $\tfrac12<c<\tfrac{\sqrt3}{2}\iff\tfrac14<1-\beta_1^2-\beta_2^2<\tfrac34\iff\tfrac14<\beta_1^2+\beta_2^2<\tfrac34$, and $a=\beta_1>0$. In polar variables of the plane, $\beta=(r\cos\psi,r\sin\psi)$: $r\in(\tfrac12,\tfrac{\sqrt3}{2})$, $\psi\in(-\tfrac\pi2,\tfrac\pi2)$.

  - type: numeric
    id: q3c-integrand
    points: 0.12
    tag: Question 3 · Volume form and integrals
    title: (c) The integrand in the projection chart
    figure:
      widget: sphere
