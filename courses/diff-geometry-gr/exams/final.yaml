id: exam-final
title: Final Exam
kind: exam

# Exam lesson (js/exam.js). 3 h, 10 points, five questions. Q1-Q3 are the professor's
# final exam on the unit sphere (Levels 6 to 8), their points scaled by 0.6: 1.8 + 2.4 + 1.8.
# Q4 (Level 9, Newtonian gravity as a connection) and Q5 (Level 10, spacetime and Einstein's
# equations) are original, 2 points each. Setting card first, then cards tagged
# "Question N · …", ids qN-…, `points:` per card.

minutes: 180

rules: |
  This is the **final exam**: connections, metrics and integration on the unit sphere (Levels 6 to 8), then Newtonian gravity and relativistic spacetime (Levels 9 and 10).

  - **Three hours**, **10 points**, 5 questions (1.8 + 2.4 + 1.8 + 2 + 2 points). The bar at the top counts the time down; when it ends, the exam is submitted for you.
  - **No feedback while you work.** Pick or type an answer and press *Next*. You can go back and change any answer until you submit.
  - The points are shown on each card; a question is split into small cards that follow the parts of the original exam.
  - At the end, a submit slide shows which questions are still empty. Unanswered questions count as wrong.
  - After submitting you get your score, and a **review** with your answer, the correct one and the explanation for each question.
  - Work on **paper first**, and do not open your notes. The computations are short: what counts is the correct use of the concepts.

  The setting (the sphere, two charts, the transition maps and their Jacobians) is the first card and serves Questions 1 to 3. Questions 4 and 5 do not use the sphere: each one states its own setting.

debrief: |
    Use the review to see where points went. The skills behind the five questions:

    - **A connection from one chart** (Q1, 1.8 points): vanishing coefficients in one chart give non-vanishing ones in another, through the inhomogeneous term of the transformation law,
      $$(\Gamma_{\mathscr{X}})^i_{jk}=\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^s}\frac{\partial^2\mathscr{Y}^s}{\partial\mathscr{X}^k\partial\mathscr{X}^j}+\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^l}\frac{\partial\mathscr{Y}^s}{\partial\mathscr{X}^j}\frac{\partial\mathscr{Y}^r}{\partial\mathscr{X}^k}(\Gamma_{\mathscr{Y}})^l_{sr},$$
      and the acceleration decides the class of a curve:
      $$a^k=\ddot\gamma^k+\Gamma^k_{ji}\dot\gamma^i\dot\gamma^j,$$
      $a=0$ transported, $a\parallel v$ autoparallel, otherwise neither.
    - **Metric, Levi-Civita, compatibility, geodesics** (Q2, 2.4 points): induced metric and signature, Christoffel symbols from the metric, a single component of $\nabla g$ decides compatibility,
      $$(\nabla_{\partial x_k}g)_{ij}=\partial_k g_{ij}-\Gamma^m_{ik}g_{mj}-\Gamma^m_{jk}g_{im},$$
      and constant-speed geodesics solve the autoparallel equation (meridians and the equator only).
    - **Volume form and integrals** (Q3, 1.8 points): orientation from the sign of the Jacobian determinant, the density and its law,
      $$\omega^g_{\mathscr{X}}=\sqrt{|\det g_{\mathscr{X}}|},\qquad \omega^g_{\mathscr{Y}}=\det\Big(\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^j}\Big)\,\omega^g_{\mathscr{X}},$$
      and the integral of a scalar against $\Omega^g$ is chart independent,
      $$\int_{\mathcal{D}}\Omega^g f=\int_{\mathscr{X}(\mathcal{D})}d^2\alpha\,\omega^g_{\mathscr{X}}\,(f\circ\mathscr{X}^{-1}).$$

    - **Gravity as a connection** (Q4, 2 points): a potential gives $\Gamma^\alpha_{00}=\partial_\alpha\phi$, free fall $\ddot\gamma^\alpha=-\partial_\alpha\phi$, the field equation $\mathrm{Ric}_{00}=\Delta\phi=4\pi G_N\rho$ (zero trace does not mean flat), the tidal equation
      $$\ddot\eta^\alpha=-\partial_\alpha\partial_\beta\phi\,\eta^\beta,$$
      and the Coriolis and centrifugal terms of a rotating chart, $\ddot y^1=2\omega\dot y^2+\omega^2y^1$.
    - **Spacetime and Einstein's equations** (Q5, 2 points): proper time $\int\sqrt{g(v_\gamma,v_\gamma)}\,d\lambda$ (the straight worldline is the longest), frame components $\tilde X=\Lambda^{-1}X$, the trace-reversed equations
      $$\mathrm{Ric}=8\pi G_N\big(T-\tfrac12\,T^{\,m}{}_m\,g\big),$$
      and the static metric with $f=1-2G_NM/r$, from $\mathrm{Ric}_{22}=1-(rf)'=0$.

    **Next:** the course is complete. Review the levels where points went.

cards:
  - type: text
    id: setting
    title: The setting, the unit sphere
    figure:
      widget: sphere
      config:
        view: domain
        labels: { domain: 'Figure 1 · the setting' }
    body: |
      Questions 1 to 3 use the same manifold and charts (Questions 4 and 5 are independent and state their own setting). The unit sphere is

      $$\mathcal{M} := \big\{p=(a,b,c)\in\mathbb{R}^3\ \big|\ a^2+b^2+c^2=1\big\},$$

      with the topology induced from $\mathbb{R}^3$. Here $a,b,c$ always denote the cartesian coordinates of a point $p\in\mathcal{M}$. It is parametrized by a polar angle $\alpha_1$, measured from the north pole $N=(0,0,1)$, and an azimuthal angle $\alpha_2$:

      $$\Phi(\alpha_1,\alpha_2) := (\sin\alpha_1\cos\alpha_2,\ \sin\alpha_1\sin\alpha_2,\ \cos\alpha_1).$$

      **Two charts.**

      - The **angle chart** $(\mathcal{U},\mathscr{X})$: $\mathcal{U}:=\mathcal{M}\setminus\{b=0,\ a\le0\}$ (the half meridian with its poles is removed), $\mathscr{X}(p)=(\arccos c,\ \operatorname{atan2}(b,a))=:\alpha=(\alpha_1,\alpha_2)$, with image $(0,\pi)\times(-\pi,\pi)$ and inverse $\mathscr{X}^{-1}=\Phi$.
      - The **projection chart** $(\mathcal{V},\mathscr{Y})$: $\mathcal{V}:=\{p\in\mathcal{M}\mid c>0\}$ (the open northern hemisphere), $\mathscr{Y}(p)=(a,b)=:\beta=(\beta_1,\beta_2)$, with image the open unit disk $\beta_1^2+\beta_2^2<1$ and inverse $\mathscr{Y}^{-1}(\beta)=\big(\beta_1,\beta_2,\sqrt{1-\beta_1^2-\beta_2^2}\big)$.

      The function $\operatorname{atan2}(y,x)$ is the angle $\varphi\in(-\pi,\pi]$ with $(x,y)=\sqrt{x^2+y^2}(\cos\varphi,\sin\varphi)$; on $\mathcal{U}$ it takes values in $(-\pi,\pi)$.

      **Notation.** A function $h$ on a chart domain is evaluated through its chart representatives, $h(p)=(h\circ\mathscr{X}^{-1})(\alpha)=(h\circ\mathscr{Y}^{-1})(\beta)$, and $\partial_k[h\circ\mathscr{X}^{-1}](\alpha)=\frac{\partial}{\partial\alpha_k}(h\circ\mathscr{X}^{-1})(\alpha)$. Objects whose name carries the chart, such as $(\Gamma_{\mathscr{X}})^i_{jk}$, $(g_{\mathscr{X}})_{ij}$ or $\omega^g_{\mathscr{X}}$, are written directly as functions of the coordinates of that chart. Sums over repeated indices are implied.

      **Transition maps.** On $\mathcal{U}\cap\mathcal{V}$ the coordinates $\alpha$ and $\beta$ describe the same point when $\beta=\text{ᛖ}_{\mathcal{U}\mathcal{V}}(\alpha)$:

      $$\text{ᛖ}_{\mathcal{U}\mathcal{V}}(\alpha)=(\mathscr{Y}\circ\mathscr{X}^{-1})(\alpha)=(\sin\alpha_1\cos\alpha_2,\ \sin\alpha_1\sin\alpha_2),$$

      $$\text{ᛖ}_{\mathcal{V}\mathcal{U}}(\beta)=(\mathscr{X}\circ\mathscr{Y}^{-1})(\beta)=\Big(\arccos\sqrt{1-\beta_1^2-\beta_2^2},\ \operatorname{atan2}(\beta_2,\beta_1)\Big).$$

      **Jacobians** $(\text{ᛞ}_{\mathcal{V}\mathcal{U}})^i{}_j=\partial\mathscr{Y}^i/\partial\mathscr{X}^j$ (row $i$, column $j$) and $(\text{ᛞ}_{\mathcal{U}\mathcal{V}})^i{}_j=\partial\mathscr{X}^i/\partial\mathscr{Y}^j$:

      $$\text{ᛞ}_{\mathcal{V}\mathcal{U}}(\alpha)=\begin{bmatrix}\cos\alpha_1\cos\alpha_2&-\sin\alpha_1\sin\alpha_2\\ \cos\alpha_1\sin\alpha_2&\sin\alpha_1\cos\alpha_2\end{bmatrix},$$

      $$\text{ᛞ}_{\mathcal{U}\mathcal{V}}(\beta)=\begin{bmatrix}\dfrac{\beta_1}{\sqrt{\beta_1^2+\beta_2^2}\sqrt{1-\beta_1^2-\beta_2^2}}&\dfrac{\beta_2}{\sqrt{\beta_1^2+\beta_2^2}\sqrt{1-\beta_1^2-\beta_2^2}}\\[2ex]-\dfrac{\beta_2}{\beta_1^2+\beta_2^2}&\dfrac{\beta_1}{\beta_1^2+\beta_2^2}\end{bmatrix}.$$

      At $\beta=\text{ᛖ}_{\mathcal{U}\mathcal{V}}(\alpha)$ the second one can be written in terms of $\alpha$:

      $$\text{ᛞ}_{\mathcal{U}\mathcal{V}}(\alpha)=\begin{bmatrix}\dfrac{\cos\alpha_2}{\cos\alpha_1}&\dfrac{\sin\alpha_2}{\cos\alpha_1}\\[2ex]-\dfrac{\sin\alpha_2}{\sin\alpha_1}&\dfrac{\cos\alpha_2}{\sin\alpha_1}\end{bmatrix}.$$

      The two charts do not cover $\mathcal{M}$, but they can be completed into a smooth atlas by adding rotated copies; those extra charts are not needed. Finally $\alpha_0\in(0,\tfrac\pi2)$ is a fixed value of $\alpha_1$, used in Question 1.

  # ------------------------------------------------------------- Question 1
  - type: mcq
    id: q1a-second
    points: 0.24
    tag: Question 1 · The projection connection
    title: (a) Second derivatives of the projection
    prompt: |
      On the northern hemisphere $\mathcal{V}$ we define the connection $\nabla^{\mathrm{P}}$ by declaring all its coefficient functions to vanish in the projection chart,

      $$(\Gamma^{\mathrm{P}}_{\mathscr{Y}})^i_{jk}(\beta)=0\quad\forall\beta\in\mathscr{Y}(\mathcal{V}),\qquad\text{i.e.}\qquad\nabla^{\mathrm{P}}_{\partial y_k}\partial y_j=0,$$

      with the convention $\nabla_{\partial x_k}\partial x_j=(\Gamma_{\mathscr{X}})^i_{jk}\,\partial x_i$. To find its coefficients in the angle chart we need $\partial_k\partial_j[\mathscr{Y}^s\circ\mathscr{X}^{-1}](\alpha)$. Recall $(\mathscr{Y}^2\circ\mathscr{X}^{-1})(\alpha)=\sin\alpha_1\sin\alpha_2$. Which matrix is $\partial_k\partial_j[\mathscr{Y}^2\circ\mathscr{X}^{-1}](\alpha)$ (row $k$, column $j$)?
    options:
      - text: '$\begin{bmatrix}-\sin\alpha_1\sin\alpha_2&\cos\alpha_1\cos\alpha_2\\ \cos\alpha_1\cos\alpha_2&-\sin\alpha_1\sin\alpha_2\end{bmatrix}$'
        correct: true
      - text: '$\begin{bmatrix}-\sin\alpha_1\cos\alpha_2&-\cos\alpha_1\sin\alpha_2\\ -\cos\alpha_1\sin\alpha_2&-\sin\alpha_1\cos\alpha_2\end{bmatrix}$'
        feedback: |
          That is the matrix for $\mathscr{Y}^1\circ\mathscr{X}^{-1}=\sin\alpha_1\cos\alpha_2$, the other component. For $\mathscr{Y}^2$ the factor in $\alpha_2$ is $\sin\alpha_2$, whose derivative is $\cos\alpha_2$.
      - text: '$\begin{bmatrix}-\sin\alpha_1\sin\alpha_2&\cos\alpha_1\cos\alpha_2\\ \cos\alpha_1\cos\alpha_2&\sin\alpha_1\sin\alpha_2\end{bmatrix}$'
        feedback: |
          Sign slip in the entry $(2,2)$: $\partial_2\partial_2(\sin\alpha_1\sin\alpha_2)=-\sin\alpha_1\sin\alpha_2$, because differentiating $\sin$ twice returns $-\sin$.
      - text: '$\begin{bmatrix}-\sin\alpha_1\sin\alpha_2&-\cos\alpha_1\cos\alpha_2\\ -\cos\alpha_1\cos\alpha_2&-\sin\alpha_1\sin\alpha_2\end{bmatrix}$'
        feedback: |
          Sign slip in the mixed entries: $\partial_1\partial_2(\sin\alpha_1\sin\alpha_2)=\cos\alpha_1\cos\alpha_2$, a product of two first derivatives, both positive.
    explanation: |
      Write $s_i=\sin\alpha_i$ and $c_i=\cos\alpha_i$. Then
      $$\partial_k\partial_j[\mathscr{Y}^2\circ\mathscr{X}^{-1}]=\begin{bmatrix}-s_1s_2&c_1c_2\\ c_1c_2&-s_1s_2\end{bmatrix}_{kj},$$
      and similarly, for $\mathscr{Y}^1\circ\mathscr{X}^{-1}=\sin\alpha_1\cos\alpha_2$,
      $$\partial_k\partial_j[\mathscr{Y}^1\circ\mathscr{X}^{-1}]=\begin{bmatrix}-s_1c_2&-c_1s_2\\ -c_1s_2&-s_1c_2\end{bmatrix}_{kj}.$$

  - type: mcq
    id: q1a-law
    points: 0.18
    tag: Question 1 · The projection connection
    title: (a) The transformation law with Γ_Y = 0
    multiple: true
    prompt: |
      The coefficients of a connection transform as

      $$(\Gamma_{\mathscr{X}})^i_{jk}=\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^s}\frac{\partial^2\mathscr{Y}^s}{\partial\mathscr{X}^k\partial\mathscr{X}^j}+\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^l}\frac{\partial\mathscr{Y}^s}{\partial\mathscr{X}^j}\frac{\partial\mathscr{Y}^r}{\partial\mathscr{X}^k}\,(\Gamma_{\mathscr{Y}})^l_{sr}.$$

      For $\nabla^{\mathrm{P}}$, where $(\Gamma^{\mathrm{P}}_{\mathscr{Y}})^l_{sr}=0$ in the projection chart, which statements hold on $\mathscr{X}(\mathcal{U}\cap\mathcal{V})$?
    options:
      - text: 'Only the first (inhomogeneous) term survives, and its prefactor is $\partial\mathscr{X}^i/\partial\mathscr{Y}^s$, the entries of $\text{ᛞ}_{\mathcal{U}\mathcal{V}}$'
        correct: true
      - text: '$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^i_{jk}$ is symmetric in $j\leftrightarrow k$ (Schwarz), so there are only $6$ independent functions'
        correct: true
      - text: '$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^i_{jk}=0$ as well: a connection whose coefficients vanish in one chart vanishes in all of them'
        feedback: |
          Coefficients are **not** the components of a tensor: their law has the extra inhomogeneous term. Only tensor components that vanish in one chart vanish in all.
      - text: 'The prefactor of the surviving term is $\partial\mathscr{Y}^i/\partial\mathscr{X}^s$, the entries of $\text{ᛞ}_{\mathcal{V}\mathcal{U}}$'
        feedback: |
          The free index $i$ belongs to the chart $\mathscr{X}$ (we want $\Gamma_{\mathscr{X}}$), so the prefactor carries $\mathscr{X}^i$ in the numerator: $\partial\mathscr{X}^i/\partial\mathscr{Y}^s$.
    explanation: |
      With $\Gamma_{\mathscr{Y}}=0$,
      $$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^i_{jk}=\frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^s}\frac{\partial^2\mathscr{Y}^s}{\partial\mathscr{X}^k\partial\mathscr{X}^j},$$
      symmetric in $j,k$ because partial derivatives commute. The $\Gamma$'s are not tensor components: the same connection has vanishing coefficients in $\mathscr{Y}$ and non-vanishing ones in $\mathscr{X}$.

  - type: mcq
    id: q1a-nonzero
    points: 0.18
    tag: Question 1 · The projection connection
    title: (a) Which coefficients survive?
    multiple: true
    prompt: |
      Using $(\Gamma^{\mathrm{P}}_{\mathscr{X}})^i_{jk}=\dfrac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^s}\dfrac{\partial^2\mathscr{Y}^s}{\partial\mathscr{X}^k\partial\mathscr{X}^j}$, with the rows $\big(\tfrac{\cos\alpha_2}{\cos\alpha_1},\tfrac{\sin\alpha_2}{\cos\alpha_1}\big)$ and $\big(-\tfrac{\sin\alpha_2}{\sin\alpha_1},\tfrac{\cos\alpha_2}{\sin\alpha_1}\big)$ of $\text{ᛞ}_{\mathcal{U}\mathcal{V}}$ and the second derivatives of $\sin\alpha_1\cos\alpha_2$ and $\sin\alpha_1\sin\alpha_2$, which of the six independent functions $(\Gamma^{\mathrm{P}}_{\mathscr{X}})^i_{jk}$ ($j\le k$) are **not** identically zero?
    options:
      - text: '$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{11}$'
        correct: true
      - text: '$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{22}$'
        correct: true
      - text: '$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{12}$'
        correct: true
      - text: '$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{12}$'
        feedback: |
          It vanishes by cancellation: $\frac{\cos\alpha_2}{\cos\alpha_1}(-\cos\alpha_1\sin\alpha_2)+\frac{\sin\alpha_2}{\cos\alpha_1}(\cos\alpha_1\cos\alpha_2)=-\cos\alpha_2\sin\alpha_2+\sin\alpha_2\cos\alpha_2=0$.
      - text: '$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{11}$'
        feedback: |
          It vanishes by cancellation: $-\frac{\sin\alpha_2}{\sin\alpha_1}(-\sin\alpha_1\cos\alpha_2)+\frac{\cos\alpha_2}{\sin\alpha_1}(-\sin\alpha_1\sin\alpha_2)=\sin\alpha_2\cos\alpha_2-\cos\alpha_2\sin\alpha_2=0$.
      - text: '$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{22}$'
        feedback: |
          It vanishes by cancellation, exactly like $(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{11}$: the two terms are $\sin\alpha_2\cos\alpha_2$ and $-\cos\alpha_2\sin\alpha_2$.
    explanation: |
      Of the six functions only three are non-zero, $(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{11}$, $(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{22}$ and $(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{12}=(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{21}$. The other three vanish because the two terms of the sum over $s$ cancel.

  - type: numeric
    id: q1a-g111
    points: 0.15
    tag: Question 1 · The projection connection
    title: (a) The coefficient Γ¹₁₁
    prompt: |
      For $i=j=k=1$,
      $$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{11}=\frac{\cos\alpha_2}{\cos\alpha_1}\,\partial_1\partial_1[\mathscr{Y}^1\circ\mathscr{X}^{-1}]+\frac{\sin\alpha_2}{\cos\alpha_1}\,\partial_1\partial_1[\mathscr{Y}^2\circ\mathscr{X}^{-1}],$$
      with $\mathscr{Y}^1\circ\mathscr{X}^{-1}=\sin\alpha_1\cos\alpha_2$ and $\mathscr{Y}^2\circ\mathscr{X}^{-1}=\sin\alpha_1\sin\alpha_2$. Evaluate it at a point with $\alpha_1=\tfrac\pi3$ (the value does not depend on $\alpha_2$). Give a decimal.
    answer: -1.7320508
    tolerance: 0.001
    answerText: '-√3 ≈ -1.732'
    wrong:
      - { value: 1.7320508, feedback: 'Sign slip: $\partial_1\partial_1\sin\alpha_1=-\sin\alpha_1$, so the sum is $-\frac{\sin\alpha_1}{\cos\alpha_1}(\cos^2\alpha_2+\sin^2\alpha_2)=-\tan\alpha_1$.' }
      - { value: -0.5773503, feedback: 'That is $-\cot\alpha_1$. The result is $-\sin\alpha_1/\cos\alpha_1=-\tan\alpha_1$: the prefactor $1/\cos\alpha_1$ sits in the numerator row of $\text{ᛞ}_{\mathcal{U}\mathcal{V}}$.' }
      - { value: 0, feedback: 'The two terms do not cancel for $(i,j,k)=(1,1,1)$: both equal $-\frac{\sin\alpha_1}{\cos\alpha_1}$ times $\cos^2\alpha_2$ and $\sin^2\alpha_2$ and they **add** to $-\tan\alpha_1$. Cancellations happen only in the mixed or $i=2$ entries.' }
    explanation: |
      $$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{11}=-\frac{\sin\alpha_1}{\cos\alpha_1}(\cos^2\alpha_2+\sin^2\alpha_2)=-\tan\alpha_1,$$
      which at $\alpha_1=\pi/3$ is $-\sqrt3\approx-1.7321$. By the same computation $(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{22}=-\tan\alpha_1$.

  - type: numeric
    id: q1a-g212
    points: 0.15
    tag: Question 1 · The projection connection
    title: (a) The coefficient Γ²₁₂
    prompt: |
      For $i=2$, $(j,k)=(1,2)$,
      $$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{12}=-\frac{\sin\alpha_2}{\sin\alpha_1}\,\partial_2\partial_1[\mathscr{Y}^1\circ\mathscr{X}^{-1}]+\frac{\cos\alpha_2}{\sin\alpha_1}\,\partial_2\partial_1[\mathscr{Y}^2\circ\mathscr{X}^{-1}],$$
      with $\mathscr{Y}^1\circ\mathscr{X}^{-1}=\sin\alpha_1\cos\alpha_2$ and $\mathscr{Y}^2\circ\mathscr{X}^{-1}=\sin\alpha_1\sin\alpha_2$. Evaluate it at a point with $\alpha_1=\tfrac\pi3$ (the value does not depend on $\alpha_2$). Give a decimal.
    answer: 0.5773503
    tolerance: 0.001
    answerText: '1/√3 ≈ 0.577'
    wrong:
      - { value: 1.7320508, feedback: 'That is $\tan\alpha_1$. The result is $\frac{\cos\alpha_1}{\sin\alpha_1}(\sin^2\alpha_2+\cos^2\alpha_2)=\cot\alpha_1$.' }
      - { value: -0.5773503, feedback: 'Sign slip: the first term is $-\frac{\sin\alpha_2}{\sin\alpha_1}\cdot(-\cos\alpha_1\sin\alpha_2)=+\frac{\cos\alpha_1}{\sin\alpha_1}\sin^2\alpha_2$, positive, and the second is $+\frac{\cos\alpha_1}{\sin\alpha_1}\cos^2\alpha_2$.' }
      - { value: 0, feedback: 'That would need the two terms to cancel, as they do for $(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{12}$. Here the signs of the second derivatives differ from that case and the terms **add**.' }
    explanation: |
      $$(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{12}=\frac{\cos\alpha_1}{\sin\alpha_1}(\sin^2\alpha_2+\cos^2\alpha_2)=\cot\alpha_1,$$
      which at $\alpha_1=\pi/3$ is $1/\sqrt3\approx0.5774$. Summary: the only non-zero coefficients are
      $$\begin{aligned}(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{11}&=(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{22}=-\tan\alpha_1,\\(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{12}&=(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{21}=\cot\alpha_1.\end{aligned}$$

  - type: mcq
    id: q1b-eq
    points: 0.24
    tag: Question 1 · The projection connection
    title: (b) The autoparallel equations
    figure:
      widget: sphere
      config:
        view: curves
        alpha0: 0.7853981633974483
        labels: { curves: 'Figure 2 · the curves' }
    prompt: |
      The non-zero coefficients of $\nabla^{\mathrm{P}}$ in the angle chart are $(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{11}=(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{22}=-\tan\alpha_1$ and $(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{12}=(\Gamma^{\mathrm{P}}_{\mathscr{X}})^2_{21}=\cot\alpha_1$, and all coefficients vanish in the projection chart. The acceleration of a curve in a chart is $a^k=\ddot\gamma^k+(\Gamma)^k_{ji}\,\dot\gamma^i\dot\gamma^j$, and the autoparallel equations are $a^k=0$. Which pair of systems is correct? (In the angle chart write $(\alpha_1(\lambda),\alpha_2(\lambda))=\mathscr{X}\circ\gamma$; in the projection chart $(\beta_1(\lambda),\beta_2(\lambda))=\mathscr{Y}\circ\gamma$.)
    options:
      - text: '$\mathscr{Y}$: $\ddot\beta_1=\ddot\beta_2=0$. $\mathscr{X}$: $\ddot\alpha_1-\tan\alpha_1(\dot\alpha_1^2+\dot\alpha_2^2)=0$, $\ \ddot\alpha_2+2\cot\alpha_1\,\dot\alpha_1\dot\alpha_2=0$'
        correct: true
      - text: '$\mathscr{Y}$: $\ddot\beta_1=\ddot\beta_2=0$. $\mathscr{X}$: $\ddot\alpha_1+\tan\alpha_1(\dot\alpha_1^2+\dot\alpha_2^2)=0$, $\ \ddot\alpha_2+2\cot\alpha_1\,\dot\alpha_1\dot\alpha_2=0$'
        feedback: |
          Sign slip: the coefficient is $-\tan\alpha_1$, and it enters as $+\Gamma\,\dot\gamma\dot\gamma$, giving $-\tan\alpha_1(\dots)$.
      - text: '$\mathscr{Y}$: $\ddot\beta_1=\ddot\beta_2=0$. $\mathscr{X}$: $\ddot\alpha_1-\tan\alpha_1\,\dot\alpha_1^2=0$, $\ \ddot\alpha_2+2\cot\alpha_1\,\dot\alpha_1\dot\alpha_2=0$'
        feedback: |
          The coefficient $(\Gamma^{\mathrm{P}}_{\mathscr{X}})^1_{22}=-\tan\alpha_1$ is also non-zero, so the term $-\tan\alpha_1\,\dot\alpha_2^2$ must appear in the first equation.
      - text: '$\mathscr{Y}$: $\ddot\beta_1=\ddot\beta_2=0$. $\mathscr{X}$: $\ddot\alpha_1-\tan\alpha_1(\dot\alpha_1^2+\dot\alpha_2^2)=0$, $\ \ddot\alpha_2+\cot\alpha_1\,\dot\alpha_1\dot\alpha_2=0$'
        feedback: |
          The mixed term gets a factor $2$: $(\Gamma)^2_{12}\dot\alpha_2\dot\alpha_1$ and $(\Gamma)^2_{21}\dot\alpha_1\dot\alpha_2$ both contribute to the sum over $i,j$.
    explanation: |
      $$\begin{aligned}(\mathcal{V},\mathscr{Y}):\ &\ddot\beta_k=0,\quad k=1,2,\\ (\mathcal{U},\mathscr{X}):\ &\ddot\alpha_1-\tan\alpha_1\big(\dot\alpha_1^2+\dot\alpha_2^2\big)=0,\\ &\ddot\alpha_2+2\cot\alpha_1\,\dot\alpha_1\dot\alpha_2=0.\end{aligned}$$
      In $\mathscr{Y}$ the solutions are straight lines $\beta(\lambda)=u+\lambda w$: sections of the hemisphere by vertical planes.

  - type: mcq
    id: q1b-gamma
    points: 0.12
    tag: Question 1 · The projection connection
    title: (b) The curve γ
    prompt: |
      A curve is **autoparallelly transported** if its acceleration vanishes, $a=0$; it is **autoparallel** if $a=\rho\,v$ for some function $\rho(\lambda)$ ($v$ its velocity), that is, if it is a reparametrization of a transported curve; otherwise it is **neither**.

      Consider $\gamma(\lambda):=\mathscr{Y}^{-1}(\lambda,0)=(\lambda,0,\sqrt{1-\lambda^2})$, $\lambda\in(0,1)$, for the connection $\nabla^{\mathrm{P}}$ (all coefficients vanish in $\mathscr{Y}$). Which class is $\gamma$ in?
    options:
      - text: 'Autoparallelly transported: in $\mathscr{Y}$, $\beta(\lambda)=(\lambda,0)$ has $\ddot\beta=0$, so $a=0$'
        correct: true
      - text: 'Autoparallel but not transported: it is a straight line in $\mathscr{Y}$ but its parametrization must be non-uniform'
        feedback: |
          Uniform parametrization is exactly what $\ddot\beta=0$ says: in $\mathscr{Y}$ the curve $\lambda\mapsto(\lambda,0)$ has constant velocity $(1,0)$ and zero acceleration.
      - text: 'Neither: it is not a geodesic of the sphere (a great circle arc at uniform speed)'
        feedback: |
          This question is about $\nabla^{\mathrm{P}}$, not about the metric. Geodesics of the induced metric are a different matter (Question 2).
      - text: 'Cannot be decided without also computing the acceleration in the angle chart'
        feedback: |
