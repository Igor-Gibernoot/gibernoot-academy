    explanation: |
      Only $\partial_1 g_{22}\neq0$, and it feeds exactly two independent coefficients, $(\Gamma^{\mathrm{LC}}_{\mathscr{X}})^1_{22}$ (through $-\partial_1g_{22}$) and $(\Gamma^{\mathrm{LC}}_{\mathscr{X}})^2_{12}$ (through $+\partial_1g_{22}$).

