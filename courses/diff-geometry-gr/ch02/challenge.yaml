id: ch02-challenge
title: Level Challenge · Part 1
kind: challenge

# The Level Challenge is split in 2 parts of at most 32 cards; part 1 holds problems 1 and 2.

cards:
  - type: text
    id: intro
    title: Vectors, covectors and tensors
    body: |
      This challenge mixes everything in the level. It comes in 2 parts; this is part 1 (problems 1 and 2). Keep pencil and paper at hand: every answer can be checked by hand, and most need a few lines of work.

      Almost every problem uses the same new basis of the plane $V = \mathbb{R}^2$, written in the old basis $\hat{x}_1, \hat{x}_2$:
      $$\begin{aligned}
      \hat{y}_1 &= 2\,\hat{x}_1 + \hat{x}_2 \\
      \hat{y}_2 &= 3\,\hat{x}_1 + 2\,\hat{x}_2
      \end{aligned}$$
      Recall the convention: the change of basis matrix $J$ writes **old in terms of new**,
      $$\hat{x}_i = \sum_{j=1}^2 J_i^j\,\hat{y}_j ,$$
      so these two lines give the entries of $J^{-1}$: $\hat{y}_i = \sum_j (J^{-1})_i^j\,\hat{x}_j$.

      1. Vectors, covectors and the dual basis under this change.
      2. Tensors of type $(0,2)$ and $(1,1)$ under the same change.


  # ---------------------------------------------------------------- Problem 1
  - type: mcq
    id: find-J
    tag: Problem 1 · Vectors and covectors
    prompt: |
      A new basis of the plane is
      $$\begin{aligned}
      \hat{y}_1 &= 2\,\hat{x}_1 + \hat{x}_2 \\
      \hat{y}_2 &= 3\,\hat{x}_1 + 2\,\hat{x}_2
      \end{aligned}$$
      The change of basis matrix $J$ is defined by $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$ (old in terms of new). What is $\hat{x}_1$ in the new basis?
    options:
      - text: '$\hat{x}_1 = 2\,\hat{y}_1 - \hat{y}_2$'
        correct: true
      - text: '$\hat{x}_1 = 2\,\hat{y}_1 + 3\,\hat{y}_2$'
        feedback: |
          This reads the coefficients of $\hat{x}_1$ off the given lines ($2$ in $\hat{y}_1$, $3$ in $\hat{y}_2$), as if the table could be read backwards. It can't: test it, $2\,\hat{y}_1 + 3\,\hat{y}_2 = 13\,\hat{x}_1 + 8\,\hat{x}_2$. Going from new-in-old to old-in-new means **inverting** the matrix.
      - text: '$\hat{x}_1 = \tfrac12\,\hat{y}_1 + \tfrac13\,\hat{y}_2$'
        feedback: |
          Taking reciprocals entry by entry is not inverting a matrix. Test it: $\tfrac12\,\hat{y}_1 + \tfrac13\,\hat{y}_2 = 2\,\hat{x}_1 + \tfrac76\,\hat{x}_2$, not $\hat{x}_1$.
      - text: '$\hat{x}_1 = 2\,\hat{y}_1 - 3\,\hat{y}_2$'
        feedback: |
          Test it: $2\,\hat{y}_1 - 3\,\hat{y}_2 = (4 - 9)\,\hat{x}_1 + (2 - 6)\,\hat{x}_2 = -5\,\hat{x}_1 - 4\,\hat{x}_2$. Look for a combination that kills $\hat{x}_2$: $2\,\hat{y}_1$ and $\hat{y}_2$ both contain $2\,\hat{x}_2$.
    explanation: |
      Kill $\hat{x}_2$: $2\,\hat{y}_1 - \hat{y}_2 = (4 - 3)\,\hat{x}_1 + (2 - 2)\,\hat{x}_2 = \hat{x}_1$. Likewise $-3\,\hat{y}_1 + 2\,\hat{y}_2 = \hat{x}_2$. So
      $$\begin{aligned}
      \hat{x}_1 &= 2\,\hat{y}_1 - \hat{y}_2 \\
      \hat{x}_2 &= -3\,\hat{y}_1 + 2\,\hat{y}_2
      \end{aligned}$$
      and $J_1^1 = 2$, $J_1^2 = -1$, $J_2^1 = -3$, $J_2^2 = 2$. Note that $J$ is not symmetric ($J_1^2 \neq J_2^1$), so swapping its indices is a real mistake here, not a harmless one.

  - type: numeric
    id: vector-y1
    tag: Problem 1 · Vectors and covectors
    prompt: |
      Two bases of the plane are related by $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$ with
      $$J_1^1 = 2,\quad J_1^2 = -1,\quad J_2^1 = -3,\quad J_2^2 = 2 .$$
      Vector components transform as $y^i = \sum_k J_k^i\,x^k$. The vector $\mathcal{X} = 5\,\hat{x}_1 + 3\,\hat{x}_2$ has old components $(x^1, x^2) = (5, 3)$. What is $y^1$?
    answer: 1
    wrong:
      - value: 7
        feedback: |
          That is $\sum_k J_1^k\,x^k = 2\cdot 5 + (-1)\cdot 3$: the summed index sits in the wrong slot (the transpose of $J$). In $y^i = \sum_k J_k^i\,x^k$ the summed $k$ is the **lower** index of $J$.
      - value: 19
        feedback: |
          That is $\sum_k (J^{-1})_k^1\,x^k = 2\cdot 5 + 3\cdot 3$, using the coefficients of the new basis in the old. Vector components move **against** the basis: if the basis goes with $J^{-1}$, the components go with $J$.
      - value: 13
        feedback: |
          That is $2\cdot 5 + 1\cdot 3$, the first row of the new-basis table. The new components come from $J$ (old in terms of new), with the summed index lower: $y^1 = J_1^1\,x^1 + J_2^1\,x^2$.
    hint: '$y^1 = J_1^1\,x^1 + J_2^1\,x^2$.'
    explanation: |
      $$y^1 = J_1^1\,x^1 + J_2^1\,x^2 = 2\cdot 5 - 3\cdot 3 = 1$$
      and $y^2 = J_1^2\,x^1 + J_2^2\,x^2 = -5 + 6 = 1$. Check against the new basis $\hat{y}_1 = 2\,\hat{x}_1 + \hat{x}_2$, $\hat{y}_2 = 3\,\hat{x}_1 + 2\,\hat{x}_2$:
      $$\hat{y}_1 + \hat{y}_2 = 5\,\hat{x}_1 + 3\,\hat{x}_2 = \mathcal{X} .$$

  - type: numeric
    id: covector-y2
    tag: Problem 1 · Vectors and covectors
    prompt: |
      A new basis of the plane is $\hat{y}_1 = 2\,\hat{x}_1 + \hat{x}_2$, $\hat{y}_2 = 3\,\hat{x}_1 + 2\,\hat{x}_2$. A covector $\mathsf{X}$ has components $(\mathtt{x}_1, \mathtt{x}_2) = (2, -1)$ in the old dual basis, so $\mathsf{X}(\mathcal{Y}) = 2\,y^1 - y^2$ for a vector $\mathcal{Y}$ with old components $(y^1, y^2)$. What is its new component $\mathtt{y}_2$?
    answer: 4
    wrong:
      - value: -8
        feedback: |
          That uses $J$, the matrix of $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$: $J_2^1\cdot 2 + J_2^2\cdot(-1) = -6 - 2$. Covector components transform **with** the basis, so the new ones come from the new basis vectors in the old, which is $J^{-1}$.
      - value: 0
        feedback: |
          That is $1\cdot 2 + 2\cdot(-1)$, the second **column** of the new-basis table (the coefficients of $\hat{x}_2$). You need the second **row**, $\hat{y}_2 = 3\,\hat{x}_1 + 2\,\hat{x}_2$.
      - value: 3
        feedback: |
          That is $\mathtt{y}_1 = \mathsf{X}(\hat{y}_1) = 2\cdot 2 - 1$. The question asks for $\mathtt{y}_2 = \mathsf{X}(\hat{y}_2)$.
    hint: 'The components of a covector are its values on the basis vectors: $\mathtt{y}_2 = \mathsf{X}(\hat{y}_2)$.'
    explanation: |
      $$\mathtt{y}_2 = \mathsf{X}(\hat{y}_2) = 2\cdot 3 - 1\cdot 2 = 4$$
      and $\mathtt{y}_1 = \mathsf{X}(\hat{y}_1) = 2\cdot 2 - 1 = 3$. This is the law $\mathtt{y}_j = \sum_i (J^{-1})_j^i\,\mathtt{x}_i$: the same table of numbers as the basis vectors, so covector components are covariant.

  - type: numeric
    id: pairing
    tag: Problem 1 · Vectors and covectors
    prompt: |
      In a new basis $\hat{y}_1 = 2\,\hat{x}_1 + \hat{x}_2$, $\hat{y}_2 = 3\,\hat{x}_1 + 2\,\hat{x}_2$ of the plane, the vector $\mathcal{X} = 5\,\hat{x}_1 + 3\,\hat{x}_2$ has components $(y^1, y^2) = (1, 1)$, and the covector $\mathsf{X}$ with old components $(\mathtt{x}_1, \mathtt{x}_2) = (2, -1)$ has new components $(\mathtt{y}_1, \mathtt{y}_2) = (3, 4)$. Compute $\mathsf{X}(\mathcal{X})$ from the **new** components.
    answer: 7
    wrong:
      - value: 27
        feedback: |
          That is $3\cdot 5 + 4\cdot 3$: new covector components paired with **old** vector components. Each formula $\sum_i \mathtt{y}_i\,y^i$ only works with both sets of components taken in matching (dual) bases.
      - value: 1
        feedback: |
          That is $2\cdot 1 + (-1)\cdot 1$: **old** covector components paired with **new** vector components. Use the new components of both, $\mathtt{y}_1\,y^1 + \mathtt{y}_2\,y^2$.
    hint: '$\mathsf{X}(\mathcal{X}) = \mathtt{y}_1\,y^1 + \mathtt{y}_2\,y^2$.'
    explanation: |
      $$\mathtt{y}_1\,y^1 + \mathtt{y}_2\,y^2 = 3 + 4 = 7 ,$$
      and from the old components, $\mathtt{x}_1\,x^1 + \mathtt{x}_2\,x^2 = 2\cdot 5 - 1\cdot 3 = 7$. The pairing is a number defined without any basis; the factor $J$ in the vector components and the $J^{-1}$ in the covector components cancel.

  - type: mcq
    id: dual-y1
    tag: Problem 1 · Vectors and covectors
    prompt: |
      A new basis of the plane is $\hat{y}_1 = 2\,\hat{x}_1 + \hat{x}_2$, $\hat{y}_2 = 3\,\hat{x}_1 + 2\,\hat{x}_2$, so that with $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$,
      $$J_1^1 = 2,\quad J_1^2 = -1,\quad J_2^1 = -3,\quad J_2^2 = 2 .$$
      The new dual basis is defined by $\hat{\mathfrak{y}}^i(\hat{y}_j) = \delta^i_j$. What is $\hat{\mathfrak{y}}^1$ in the old dual basis $\hat{\mathfrak{x}}^1, \hat{\mathfrak{x}}^2$?
    options:
      - text: '$\hat{\mathfrak{y}}^1 = 2\,\hat{\mathfrak{x}}^1 - 3\,\hat{\mathfrak{x}}^2$'
        correct: true
      - text: '$\hat{\mathfrak{y}}^1 = 2\,\hat{\mathfrak{x}}^1 + \hat{\mathfrak{x}}^2$'
        feedback: |
          This copies the components of $\hat{y}_1$, as if "the dual basis follows the basis". Test it on $\hat{y}_2 = 3\,\hat{x}_1 + 2\,\hat{x}_2$: it gives $6 + 2 = 8$, not $0$. The dual basis transforms **against** the basis.
      - text: '$\hat{\mathfrak{y}}^1 = 2\,\hat{\mathfrak{x}}^1 - \hat{\mathfrak{x}}^2$'
        feedback: |
          That uses $J_1^1, J_1^2$, the entries with the wrong index summed. The law is $\hat{\mathfrak{y}}^i = \sum_j J_j^i\,\hat{\mathfrak{x}}^j$: for $i = 1$ the coefficients are $J_1^1 = 2$ and $J_2^1 = -3$. Test yours on $\hat{y}_1$: $4 - 1 = 3$, not $1$.
      - text: '$\hat{\mathfrak{y}}^1 = \tfrac12\,\hat{\mathfrak{x}}^1 + \hat{\mathfrak{x}}^2$'
        feedback: |
          Reciprocals of the entries do not invert anything. Test it on $\hat{y}_1 = 2\,\hat{x}_1 + \hat{x}_2$: $\tfrac12\cdot 2 + 1 = 2$, not $1$.
    explanation: |
      The dual basis law is $\hat{\mathfrak{y}}^i = \sum_j J_j^i\,\hat{\mathfrak{x}}^j$ (the vector-component pattern), so
      $$\begin{aligned}
      \hat{\mathfrak{y}}^1 &= 2\,\hat{\mathfrak{x}}^1 - 3\,\hat{\mathfrak{x}}^2 \\
      \hat{\mathfrak{y}}^2 &= -\hat{\mathfrak{x}}^1 + 2\,\hat{\mathfrak{x}}^2
      \end{aligned}$$
      Check: $\hat{\mathfrak{y}}^1(\hat{y}_1) = 4 - 3 = 1$ and $\hat{\mathfrak{y}}^1(\hat{y}_2) = 6 - 6 = 0$. Also $3\,\hat{\mathfrak{y}}^1 + 4\,\hat{\mathfrak{y}}^2 = 2\,\hat{\mathfrak{x}}^1 - \hat{\mathfrak{x}}^2$: the covector with new components $(3, 4)$ is the old $(2, -1)$.

  - type: numeric
    id: dual-reads
    tag: Problem 1 · Vectors and covectors
    prompt: |
      For the new basis $\hat{y}_1 = 2\,\hat{x}_1 + \hat{x}_2$, $\hat{y}_2 = 3\,\hat{x}_1 + 2\,\hat{x}_2$ of the plane, the first new dual basis covector is
      $$\hat{\mathfrak{y}}^1 = 2\,\hat{\mathfrak{x}}^1 - 3\,\hat{\mathfrak{x}}^2 .$$
      Evaluate $\hat{\mathfrak{y}}^1(\mathcal{X})$ for $\mathcal{X} = 5\,\hat{x}_1 + 3\,\hat{x}_2$.
    answer: 1
    wrong:
      - value: 19
        feedback: |
          Check the sign: $\hat{\mathfrak{y}}^1(\mathcal{X}) = 2\,x^1 - 3\,x^2$, and $3\,x^2 = 9$ is subtracted.
      - value: 5
        feedback: |
          That is $\hat{\mathfrak{x}}^1(\mathcal{X}) = x^1$, the old first component. $\hat{\mathfrak{y}}^1$ is a different covector: $2\,\hat{\mathfrak{x}}^1 - 3\,\hat{\mathfrak{x}}^2$.
    explanation: |
      $\hat{\mathfrak{y}}^1(\mathcal{X}) = 2\cdot 5 - 3\cdot 3 = 1$, which is exactly $y^1$, the first component of $\mathcal{X} = \hat{y}_1 + \hat{y}_2$ in the new basis. That is what a dual basis is for: $\hat{\mathfrak{y}}^i$ **reads off** the $i$-th new component, $\hat{\mathfrak{y}}^i(\mathcal{X}) = y^i$.

  - type: widget
    id: check-widget
    title: Check it by dragging
    widget: basis-playground
    config:
      vector: [5, 3]
      covector: [2, -1]
      dual: 1
      basis: [[1, 0], [0, 1]]
      snap: 0.5
      presets:
        - { label: 'Challenge basis', basis: [[2, 1], [3, 2]] }
    body: |
      The vector $\mathcal{X} = 5\,\hat{x}_1 + 3\,\hat{x}_2$ and the covector $\mathsf{X} = 2\,\hat{\mathfrak{x}}^1 - \hat{\mathfrak{x}}^2$ are fixed. Press **Challenge basis** to set $\hat{y}_1 = (2, 1)$, $\hat{y}_2 = (3, 2)$ and compare the readout with your answers: $y = (1, 1)$, $\mathtt{y} = (3, 4)$, pairing $7$, and $\hat{\mathfrak{y}}^1 = 2\,\hat{\mathfrak{x}}^1 - 3\,\hat{\mathfrak{x}}^2$ (its level lines are drawn).

      Then **drag only $\hat{y}_2$** and watch $\hat{\mathfrak{y}}^1$.

  - type: mcq
    id: dual-whole-basis
    tag: Problem 1 · Vectors and covectors
    review: false
    prompt: |
      In the widget, $\hat{y}_1 = 2\,\hat{x}_1 + \hat{x}_2$ is held fixed and only $\hat{y}_2$ is dragged. What happens to the dual basis covector $\hat{\mathfrak{y}}^1$?
    options:
      - text: 'It changes: $\hat{\mathfrak{y}}^1$ must vanish on $\hat{y}_2$, so it turns with $\hat{y}_2$'
        correct: true
      - text: 'Nothing: $\hat{\mathfrak{y}}^1$ only depends on $\hat{y}_1$'
        feedback: |
          $\hat{\mathfrak{y}}^1$ is defined by **two** conditions, $\hat{\mathfrak{y}}^1(\hat{y}_1) = 1$ and $\hat{\mathfrak{y}}^1(\hat{y}_2) = 0$. The second involves $\hat{y}_2$: its level line through the origin must contain $\hat{y}_2$.
      - text: 'Only its size changes, never its direction'
        feedback: |
          The level line $\hat{\mathfrak{y}}^1 = 0$ is the line of $\hat{y}_2$, so when $\hat{y}_2$ turns, the level lines turn with it.
    explanation: |
      Each dual basis covector depends on the **whole** basis: $\hat{\mathfrak{y}}^1$ has its zero line along $\hat{y}_2$ and takes the value $1$ at the tip of $\hat{y}_1$. This is why the dual basis law involves the whole matrix $J$.

  # ---------------------------------------------------------------- Problem 2
  - type: text
    id: p2-intro
    title: 'Problem 2: tensors under the same change'
    body: |
      Recall the transformation law: **one factor per index**, $J$ for each upper index and $J^{-1}$ for each lower index. For the two types with two indices,
      $$\tilde{T}_{ij} = \sum_{k,l} (J^{-1})_i^k\,(J^{-1})_j^l\,T_{kl}$$
      and
      $$\tilde{T}^i_j = \sum_{k,l} J_k^i\,(J^{-1})_j^l\,T^k_l .$$
      For the basis $\hat{y}_1 = 2\,\hat{x}_1 + \hat{x}_2$, $\hat{y}_2 = 3\,\hat{x}_1 + 2\,\hat{x}_2$:
      $$\begin{aligned}
      (J^{-1})_1^1 &= 2, & (J^{-1})_1^2 &= 1, \\
      (J^{-1})_2^1 &= 3, & (J^{-1})_2^2 &= 2, \\
      J_1^1 &= 2, & J_1^2 &= -1, \\
      J_2^1 &= -3, & J_2^2 &= 2 .
      \end{aligned}$$

  - type: numeric
    id: dot-new
    tag: Problem 2 · Tensors
    prompt: |
      The dot product $D(\mathcal{X}, \mathcal{Y}) = x^1y^1 + x^2y^2$ is a $(0,2)$-tensor with components $D_{ij} = \delta_{ij}$ in the basis $\hat{x}_1, \hat{x}_2$ ($1$ if $i = j$, else $0$). Take the new basis
      $$\begin{aligned}
      \hat{y}_1 &= 2\,\hat{x}_1 + \hat{x}_2 \\
      \hat{y}_2 &= 3\,\hat{x}_1 + 2\,\hat{x}_2
      \end{aligned}$$
      What is $\tilde{D}_{12} = D(\hat{y}_1, \hat{y}_2)$?
    answer: 8
    wrong:
      - value: 0
        feedback: |
          That assumes the components $\delta_{ij}$ survive the change of basis. The machine $D$ is the same, but you now feed it different vectors: $D(\hat{y}_1, \hat{y}_2) = 2\cdot 3 + 1\cdot 2$.
      - value: -8
        feedback: |
          That uses $J$ (old in terms of new) in both slots: $J_1^1 J_2^1 + J_1^2 J_2^2 = -6 - 2$. The new components are $D$ evaluated on the **new** basis vectors, written in the old basis: that is $J^{-1}$, one factor per lower index.
      - value: 5
        feedback: |
          That is $\tilde{D}_{11} = D(\hat{y}_1, \hat{y}_1) = 4 + 1$. The question asks for $D(\hat{y}_1, \hat{y}_2)$.
    hint: 'With old components $\hat{y}_1 = (2, 1)$ and $\hat{y}_2 = (3, 2)$, $D(\hat{y}_1, \hat{y}_2) = 2\cdot 3 + 1\cdot 2$.'
    explanation: |
      $\tilde{D}_{12} = 6 + 2 = 8$. All four:
      $$\tilde{D}_{11} = 5,\quad \tilde{D}_{12} = \tilde{D}_{21} = 8,\quad \tilde{D}_{22} = 13 .$$
      In the law, $\tilde{D}_{12} = \sum_{k,l} (J^{-1})_1^k (J^{-1})_2^l\,\delta_{kl} = \sum_k (J^{-1})_1^k (J^{-1})_2^k$: two factors of $J^{-1}$, which do not cancel.

  - type: numeric
    id: identity-new
    tag: Problem 2 · Tensors
    prompt: |
      The identity $(1,1)$-tensor $I(\mathsf{X}, \mathcal{X}) = \mathsf{X}(\mathcal{X})$ has components $I^k_l = \delta^k_l$ in the basis $\hat{x}_1, \hat{x}_2$. Two bases are related by $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$, with
      $$\begin{aligned}
      J_1^1 &= 2, & J_1^2 &= -1, \\
      J_2^1 &= -3, & J_2^2 &= 2, \\
      (J^{-1})_2^1 &= 3, & (J^{-1})_2^2 &= 2 .
      \end{aligned}$$
      Using the law $\tilde{I}^i_j = \sum_{k,l} J_k^i\,(J^{-1})_j^l\,I^k_l$, compute $\tilde{I}^1_2$.
    answer: 0
    wrong:
      - value: 8
        feedback: |
          That is $\sum_k (J^{-1})_1^k (J^{-1})_2^k$, the $(0,2)$ law with two factors of $J^{-1}$, the computation for the dot product. The upper index of a $(1,1)$-tensor gets $J$, not $J^{-1}$.
      - value: -12
        feedback: |
          That is $\sum_k J_k^1\,J_2^k = (-6) + (-6)$, with $J$ in both places. The lower index gets $J^{-1}$: $\sum_k J_k^1\,(J^{-1})_2^k$.
    hint: 'The $\delta^k_l$ collapses the double sum to $\sum_k J_k^1\,(J^{-1})_2^k = J_1^1 (J^{-1})_2^1 + J_2^1 (J^{-1})_2^2$.'
    explanation: |
      $$\begin{aligned}
      \tilde{I}^1_2 &= J_1^1\,(J^{-1})_2^1 + J_2^1\,(J^{-1})_2^2 \\
      &= 2\cdot 3 + (-3)\cdot 2 = 0 .
      \end{aligned}$$
      Likewise $\tilde{I}^1_1 = 2\cdot 2 + (-3)\cdot 1 = 1$. Directly: $\tilde{I}^i_j = \hat{\mathfrak{y}}^i(\hat{y}_j) = \delta^i_j$, by the definition of the dual basis.

  - type: mcq
    id: why-identity
    tag: Problem 2 · Tensors
    prompt: |
      In the basis $\hat{x}_1, \hat{x}_2$, both the dot product $D$ (a $(0,2)$-tensor) and the identity $I$ (a $(1,1)$-tensor) have the identity matrix as components. After the change to $\hat{y}_1 = 2\,\hat{x}_1 + \hat{x}_2$, $\hat{y}_2 = 3\,\hat{x}_1 + 2\,\hat{x}_2$, the identity still has components $\delta^i_j$ but the dot product has $\tilde{D}_{12} = 8$. Why the difference?
    options:
      - text: 'The $(1,1)$ law has one $J$ and one $J^{-1}$, which cancel; the $(0,2)$ law has two $J^{-1}$, which do not'
        correct: true
      - text: 'The identity is symmetric and the dot product is not'
        feedback: |
          The dot product is symmetric too: $D(\mathcal{X}, \mathcal{Y}) = D(\mathcal{Y}, \mathcal{X})$. Symmetry is not what decides it; the **type** of the tensor is.
      - text: 'The dot product is not really a tensor'
        feedback: |
          It is: it eats two vectors and is linear in each slot, so it is a $(0,2)$-tensor. Its components change because tensors' components change; only the machine is basis-independent.
      - text: 'Same matrix in one basis means same matrix in every basis'
        feedback: |
          Equal component arrays in **one** basis say nothing about other bases when the types differ: each type has its own law. Here $\tilde{D}_{12} = 8$ while $\tilde{I}^1_2 = 0$.
    explanation: |
      With the dual basis, $\tilde{I}^i_j = \hat{\mathfrak{y}}^i(\hat{y}_j) = \delta^i_j$ by definition. The dot product has no such luck: $\tilde{D}_{ij} = D(\hat{y}_i, \hat{y}_j)$ records the lengths and angles of the new basis vectors. (A $(0,2)$-tensor like $D$ is the prototype of the **metric**, Level 7.)

  - type: order
    id: trace-invariant
    tag: Problem 2 · Tensors
    prompt: |
      The **trace** of a $(1,1)$-tensor is $\sum_i T^i_i$ (sum of the diagonal components). Prove it is the same in every basis. Use the law
      $$\tilde{T}^i_j = \sum_{k,l} J_k^i\,(J^{-1})_j^l\,T^k_l$$
      and the fact that
      $$\sum_i J_k^i\,(J^{-1})_i^l = \delta^l_k$$
      (substitute $\hat{y}_i = \sum_l (J^{-1})_i^l\,\hat{x}_l$ into $\hat{x}_k = \sum_i J_k^i\,\hat{y}_i$ and compare components). Put the steps in order.
    steps:
      - '$\displaystyle \sum_i \tilde{T}^i_i = \sum_i \sum_{k,l} J_k^i\,(J^{-1})_i^l\,T^k_l$'
      - '$\displaystyle = \sum_{k,l} \Big(\sum_i J_k^i\,(J^{-1})_i^l\Big)\,T^k_l$'
      - '$\displaystyle = \sum_{k,l} \delta^l_k\,T^k_l$'
      - '$\displaystyle = \sum_k T^k_k$'
    hint: Set $j = i$ in the law, move the sum over $i$ inside, use the identity, and let the delta collapse the sum over $l$.
    explanation: |
      The trace pairs an **upper** index with a **lower** one, so their factors $J$ and $J^{-1}$ meet and cancel. Example: the identity has trace $2$ in every basis (the dimension), and any simple $(1,1)$-tensor $v\otimes\mathsf{v}$ has trace $\mathsf{v}(v)$, a pairing.

  - type: numeric
    id: trace-02
    tag: Problem 2 · Tensors
    prompt: |
      The dot product $D$ on the plane has components $D_{ij} = \delta_{ij}$ in the basis $\hat{x}_1, \hat{x}_2$, so $\sum_i D_{ii} = 2$. In the new basis $\hat{y}_1 = 2\,\hat{x}_1 + \hat{x}_2$, $\hat{y}_2 = 3\,\hat{x}_1 + 2\,\hat{x}_2$, its components are $\tilde{D}_{ij} = D(\hat{y}_i, \hat{y}_j)$. Compute $\sum_i \tilde{D}_{ii}$.
    answer: 18
    wrong:
      - value: 2
        feedback: |
          That assumes "the trace is invariant". It is for a $(1,1)$-tensor, where an upper and a lower index meet. Here both indices are **lower**: each brings a $J^{-1}$, and nothing cancels. Compute $D(\hat{y}_1, \hat{y}_1) + D(\hat{y}_2, \hat{y}_2)$.
      - value: 21
        feedback: |
          The diagonal is $\tilde{D}_{11}$ and $\tilde{D}_{22}$ only: $D(\hat{y}_1, \hat{y}_1) = 4 + 1$ and $D(\hat{y}_2, \hat{y}_2) = 9 + 4$.
    explanation: |
      $\tilde{D}_{11} + \tilde{D}_{22} = 5 + 13 = 18 \neq 2$. Summing two **lower** indices is not a basis-independent operation: it depends on the basis you happen to use. **Index placement is a type check**: only an upper index summed against a lower one gives a basis-independent result.


  - type: text
    id: wrap
    title: What you now own
    body: |
      Problems 1 and 2, part 1 of 2 of the level challenge. You ran the tools of the level on one change of basis of the plane $V=\mathbb{R}^2$, from the old basis $\{\hat{x}_i\}$ to the new one $\{\hat{y}_i\}$, with $\hat{x}_i = \sum_j J_i^j\,\hat{y}_j$ ($J$ an invertible matrix of numbers):

      - **Old from new is $J$, new from old is $J^{-1}$.** Vector components and the dual basis go with $J$ (contravariant, upper index); basis vectors and covector components with $J^{-1}$ (covariant, lower index). Each dual covector depends on the whole basis.
      - **One factor per index.** A $(1,1)$-tensor with components $T^i_j$ gets $J$ and $J^{-1}$, so the identity keeps $\delta^i_j$ and the trace $\sum_i T^i_i$ is invariant; a $(0,2)$-tensor with components $T_{ij}$ gets two $J^{-1}$, so neither holds.

      **Next:** part 2 of the Level Challenge: splitting a $(0,2)$-tensor into symmetric and antisymmetric parts, a $(1,1)$-tensor as a linear map with its rank, and counting dimensions.
