outroTitle: Chapter 2 in one picture
outro: |
  Read it top to bottom. The axioms give **linear maps** and **bases**. Linear maps into $\mathbb{R}$ give the **dual space**, and a basis gives a **dual basis**. Comparing two bases gives $J$ and the **transformation laws**, with opposite behaviour for vectors and covectors. **Tensors** combine all of it, and the **tensor product** builds every tensor as a sum of products of vectors and covectors.

  **Next level:** Chapter 3 leaves the flat vector space behind. To talk about curved spacetime we first need to say what it means for a space to look like $\mathbb{R}^d$ up close: topology, charts and manifolds.
