id: ch05-vector-fields
title: Vector Fields and the Tangent Bundle · Part 1
kind: concept
own: |
  - Let $\mathcal{M}$ be a smooth manifold of dimension $d$, with charts $\mathscr{X}\colon\mathcal{U}\to\mathbb{R}^d$ and $\mathscr{Y}\colon\mathcal{V}\to\mathbb{R}^d$ (coordinates $x^i$, $y^i$). The **tangent bundle** $T\mathcal{M} = \dot\bigcup_p T_p\mathcal{M}$ (disjoint union of the tangent spaces), disjoint so that the projection $\pi(v_{\gamma,p}) = p$ is well defined; with the bundle charts {{ $\xi_{\mathscr{X}}(\mathcal{X}_p) = (\mathscr{X}(p)\,;\,x^i_p)$ }} ($x^i_p$ the components of $\mathcal{X}_p\in T_p\mathcal{M}$) it is a smooth manifold of dimension $2d$.
  - A **smooth vector field** is a smooth section, $\mathcal{X}\colon\mathcal{M}\to T\mathcal{M}$ with {{ $\pi\circ\mathcal{X} = \mathrm{id}_\mathcal{M}$ }}; they form the set $\Gamma T\mathcal{M}$.
  - On a chart, $\mathcal{X}|_\mathcal{U} = x^i\,\partial x_i$ with **component functions** {{ $x^i = \mathcal{X}|_\mathcal{U}\lfloor\mathscr{X}^i\rceil$ }}; smooth means smooth components, and the law {{ $y^i = (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)\,x^j$ }} with point-dependent Jacobian makes this chart independent.

cards:
  - type: text
    id: hook
    title: A wind map
    body: |
      Open a weather app and look at the wind map: one arrow at **every** point of the Earth's surface, the sphere $S^2$. Physics is full of such objects: the velocity of a fluid at each point, the four-velocity of each grain of a dust cloud in spacetime.

      Recall that an arrow at a point $p$ of a manifold $\mathcal{M}$ is a velocity, an element of the tangent space $T_p\mathcal{M}$. So the wind map is a rule
      $$p\mapsto\mathcal{X}(p)\in T_p\mathcal{M},$$
      and each arrow lives in a **different** vector space.

      Meteorologists say the wind "varies smoothly": nearby points carry nearly the same arrow. Before any theory: can that sentence even be made precise?

  - type: mcq
    id: predict-subtract
    title: Predict first
    prompt: |
      On a manifold $\mathcal{M}$, a wind field puts a velocity $v\in T_p\mathcal{M}$ at a point $p$ and a velocity $w\in T_q\mathcal{M}$ at a nearby point $q\neq p$. To say "the wind barely changes from $p$ to $q$", we would like to compute $v - w$. Is $v - w$ defined?
    options:
      - text: 'No: $v$ and $w$ belong to two different vector spaces, and subtraction is only defined inside one vector space'
        correct: true
      - text: 'Yes: on the Earth both arrows are vectors of $\mathbb{R}^3$, so subtract them there'
        feedback: |
          Tempting, because the sphere sits inside $\mathbb{R}^3$ and we picture its arrows as arrows of $\mathbb{R}^3$. But that uses the surrounding space, which a general manifold (spacetime!) does not have. Even on the sphere, $v - w$ computed in $\mathbb{R}^3$ is not tangent to the sphere at $p$ or at $q$, so it is not an element of any $T_p\mathcal{M}$.
      - text: 'Yes: take a chart around both points and subtract the components'
        feedback: |
          That produces a list of numbers, but not a chart-independent object: the chart-induced bases at $p$ and at $q$ change differently when you change chart (the Jacobian depends on the point), so "components at $p$ minus components at $q$" can vanish in one chart and not in another. The idea of using charts is right, though, and it is how we will define smoothness.
    explanation: |
      $T_p\mathcal{M}$ and $T_q\mathcal{M}$ are different vector spaces: vectors of one cannot be added to, or subtracted from, vectors of the other. Still, "the arrows vary smoothly" will get a precise meaning: we will collect **all** tangent spaces into one smooth manifold, the tangent bundle, and ask the rule $p\mapsto\mathcal{X}(p)$ to be a smooth map into it. (Comparing vectors at different points, as in $v - w$, needs extra structure: the connection, Level 6.)

  - type: text
    id: recall
    title: 'Recall: one point at a time'
    body: |
      Recall the pointwise theory of Level 4, for a $d$-dimensional smooth manifold $\mathcal{M}$:

      - $T_p\mathcal{M}$ is the $d$-dimensional real vector space of velocities $\mathcal{X}_p := v_{\gamma,p}$ of curves $\gamma$ through $p$; a velocity acts on scalar fields $f\in C^\infty(\mathcal{M})$ by $v_{\gamma,p}(f) := (f\circ\gamma)'(\lambda_0)$.
      - A chart $(\mathcal{U},\mathscr{X})$ around $p$ gives the **chart-induced basis** $(\partial x_i)_p := (\partial/\partial\mathscr{X}^i)_p$, which acts by
      $$(\partial x_i)_p(f) = \partial_i[f\circ\mathscr{X}^{-1}](\mathscr{X}(p)).$$
      - Every velocity expands as $\mathcal{X}_p = x^i_p\,(\partial x_i)_p$ (Einstein summation over $i = 1,\dots,d$), with components $x^i_p = \mathcal{X}_p(\mathscr{X}^i) = (dx^i)_p(\mathcal{X}_p)$.
      - A second chart $(\mathcal{V},\mathscr{Y})$ gives components $y^i_p$, related by the contravariant law
      $$y^i_p = \Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p\,x^j_p.$$

      Everything so far sits at **one** point. Now let $p$ move.

  - type: widget
    id: swirl
    title: Building a field by hand
    widget: chart-basis
    config:
      charts:
        - { chart: cartesian, name: '\mathscr{X}' }
        - { chart: polar, name: '\mathscr{Y}', cut: left }
      p: [1, 1]
      v: [-1, 1]
      view: { x: -2, y: -2, w: 5, h: 5 }
      presets:
        - { label: 'p = (2, 0)', p: [2, 0], v: [0, 2] }
        - { label: 'p = (0, −1)', p: [0, -1], v: [1, 0] }
        - { label: 'p = (−1, 1)', p: [-1, 1], v: [-1, -1] }
        - { label: 'Origin', p: [0, 0], v: [0, 0] }
    body: |
      In the plane with points $q = (q_1, q_2)$, the **swirl** puts at each point $q$ the velocity with standard components $(-q_2, q_1)$: the velocity of the circle around the origin through $q$, run counterclockwise at one radian per unit of parameter. Solid lines: the cartesian chart $\mathscr{X}$; dashed: the polar chart $\mathscr{Y} = (r,\theta)$ with $\theta\in(-\pi,\pi)$, undefined on the dotted half-line $q_1\le 0$, $q_2 = 0$.

      The widget shows one point at a time: you build the field arrow by arrow.
      1. At $p = (1,1)$ the arrow is already the swirl's, $(-1, 1)$. Read its components in both charts.
      2. Press the presets: each moves $p$ and sets the arrow to the swirl's arrow there. Watch both lists of components.
      3. Try one yourself: drag $p$ to $(1, -1)$ and drag the arrow to $(1, 1)$.

  - type: mcq
    id: swirl-components
    title: What the polar chart sees
    review: false
    prompt: |
      In the plane, the swirl field puts at each point $q = (q_1,q_2)$ the velocity with cartesian components $(-q_2, q_1)$. In the widget, at the points $(1,1)$, $(2,0)$, $(0,-1)$, $(-1,1)$, what are the components of the swirl's arrow in the polar chart $\mathscr{Y} = (r,\theta)$?
    options:
      - text: '$(0, 1)$ at every one of these points'
        correct: true
      - text: '$(-q_2, q_1)$, the same as in the cartesian chart'
        feedback: |
          Components belong to a chart: the polar basis $(\partial/\partial r)_p$, $(\partial/\partial\theta)_p$ differs from the cartesian one, so the same arrow has different components. Here the arrow is exactly the polar basis vector $(\partial/\partial\theta)_p$, which gives $(0,1)$.
      - text: '$(0, r)$: the arrows get longer away from the origin, so their polar components must grow'
        feedback: |
          The arrows do grow (length $r$), but so does the polar basis vector $(\partial/\partial\theta)_p$: its length is $r$ too, since a step $d\theta$ moves you $r\,d\theta$ along the circle. Arrow and basis vector grow together, so the component stays $1$.
    explanation: |
      At every point where the polar chart is defined, the swirl's arrow is exactly $(\partial/\partial\theta)_p$: no radial part, one unit of $\theta$ per unit of parameter. One rule, two descriptions: varying components $(-q_2, q_1)$ in the cartesian chart, constant components $(0,1)$ in the polar one. At the origin the arrow is zero, and the polar chart is not even defined there.

  - type: text
    id: bundle
    title: One set for all the arrows
    body: |
      A rule $p\mapsto\mathcal{X}(p)\in T_p\mathcal{M}$ is a **map**, so it needs one target set that contains every tangent space. The **tangent bundle** of $\mathcal{M}$ is the disjoint union of all of them,
      $$T\mathcal{M} := \mathop{\dot{\bigcup}}_{p\in\mathcal{M}} T_p\mathcal{M}.$$
      The dot on $\bigcup$ means **disjoint**: each element remembers the point it came from, so you may think of an element of $T\mathcal{M}$ as a pair $(p, v)$ with $v\in T_p\mathcal{M}$.

      Because of that memory, there is a well-defined **projection**
      $$\pi\colon T\mathcal{M}\to\mathcal{M},\quad \pi(v_{\gamma,p}) := p,$$
      sending each vector to its base point. The set of vectors that $\pi$ sends to one $p$, its **fibre** over $p$, is exactly $T_p\mathcal{M}$.

  - type: mcq
    id: why-disjoint
    title: Why disjoint?
    prompt: |
      The tangent bundle is defined as the **disjoint** union $T\mathcal{M} = \dot{\bigcup}_{p} T_p\mathcal{M}$, where each element remembers its base point. Recall that a velocity $v_{\gamma,p}$ is a map $C^\infty(\mathcal{M})\to\mathbb{R}$, $f\mapsto(f\circ\gamma)'(\lambda_0)$. What would go wrong with the ordinary union $\bigcup_p T_p\mathcal{M}$ of these sets of maps?
    options:
      - text: 'The zero velocity at $p$ and the zero velocity at $q\neq p$ are the same map $f\mapsto 0$, so the plain union merges them and the projection $\pi$ could not say where that vector sits'
        correct: true
      - text: 'Nothing: tangent spaces at different points never share an element, so the dot is only decoration'
        feedback: |
          Almost true, and that is why the trap works. As maps $C^\infty(\mathcal{M})\to\mathbb{R}$, the zero velocity of a constant curve at $p$ and that at $q$ are both $f\mapsto 0$: the same map. Nonzero velocities at different points do differ (a bump function that is $1$ near $p$ and $0$ near $q$ tells them apart), but the zeros collide, and $\pi$ of that one map would have to be both $p$ and $q$.
      - text: 'The ordinary union would not be a vector space'
        feedback: |
          Neither is the disjoint union: $T\mathcal{M}$ is not a vector space at all, since vectors at different points cannot be added. Only each fibre $T_p\mathcal{M}$ is a vector space. The issue is a different one: the plain union identifies the zero vectors of all the tangent spaces.
    explanation: |
      All zero velocities are the same map $f\mapsto 0$. The disjoint union keeps one zero vector per point, the pair $(p, 0)$, so every element of $T\mathcal{M}$ has a unique base point and $\pi$ is well defined.

  - type: text
    id: bundle-charts
    title: The tangent bundle is a manifold
    body: |
      To speak of a **smooth** map into $T\mathcal{M}$, the set $T\mathcal{M}$ must be a smooth manifold. Charts come for free. A chart $(\mathcal{U},\mathscr{X})$ of $\mathcal{M}$ describes a vector over $\mathcal{U}$ by $2d$ numbers: the $d$ coordinates of its base point and its $d$ components. Writing $T\mathcal{U}$ for the set of vectors based in $\mathcal{U}$, the **bundle chart** is
      $$\xi_{\mathscr{X}}\colon T\mathcal{U}\to\mathscr{X}(\mathcal{U})\times\mathbb{R}^d,$$
      $$\xi_{\mathscr{X}}(\mathcal{X}_p) := \big(\mathscr{X}(p)\,;\,x^1_p,\dots,x^d_p\big).$$
      It is a bijection: base point and components determine the vector, and every choice occurs.

      On an overlap, write $\alpha = \mathscr{X}(p)$ and $\beta = (x^1_p,\dots,x^d_p)$. The base point changes by the transition map $\text{ᛖ}_{\mathcal{U}\mathcal{V}} := \mathscr{Y}\circ\mathscr{X}^{-1}$, the components by its Jacobian $(\text{ᛞ}_{\mathcal{V}\mathcal{U}})^i_j(\alpha) := (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p$ (first subscript = chart of the row index):
      $$\begin{aligned}(\xi_{\mathscr{Y}}\circ\xi_{\mathscr{X}}^{-1})&(\alpha;\beta)\\ &= \big(\text{ᛖ}_{\mathcal{U}\mathcal{V}}(\alpha)\,;\,(\text{ᛞ}_{\mathcal{V}\mathcal{U}})^i_j(\alpha)\,\beta^j\big).\end{aligned}$$
      $\text{ᛖ}_{\mathcal{U}\mathcal{V}}$ is $C^\infty$, hence so are the entries of its Jacobian, and the second block is linear in $\beta$: the transition is $C^\infty$. Declaring a set of vectors **open** when it looks open in every bundle chart gives a topology on $T\mathcal{M}$ in which every $\xi_{\mathscr{X}}$ is a homeomorphism and $\pi$ is continuous (stated here without proof). So $T\mathcal{M}$ is a smooth manifold with the atlas of all bundle charts.

  - type: numeric
    id: dim-tm
    title: How big is the bundle?
    prompt: |
      Spacetime is a manifold $\mathcal{M}$ of dimension $d = 4$. A bundle chart $\xi_{\mathscr{X}}(\mathcal{X}_p) = (\mathscr{X}(p)\,;\,x^1_p,\dots,x^d_p)$ describes each vector of the tangent bundle $T\mathcal{M}$ by the coordinates of its base point and its components. What is the dimension of the manifold $T\mathcal{M}$?
    answer: 8
    wrong:
      - { value: 4, feedback: 'That is the dimension of one fibre $T_p\mathcal{M}$. A point of $T\mathcal{M}$ also has to say **where** the vector sits: $4$ coordinates for the base point plus $4$ components.' }
      - { value: 16, feedback: 'Sixteen counts a $4\times4$ array, like the Jacobian or a $(0,2)$-tensor. A single vector of $T\mathcal{M}$ needs only its base point ($4$ numbers) and its components ($4$ numbers).' }
    hint: 'Count the entries of $\xi_{\mathscr{X}}(\mathcal{X}_p)$ when $d = 4$.'
    explanation: |
      $\dim T\mathcal{M} = 2d = 8$: $d$ coordinates locate the base point, $d$ more the vector over it. For the sphere $S^2$ of the wind map, $T S^2$ is $4$-dimensional.

  - type: text
    id: sections
    title: Sections
    body: |
      In general, a **bundle** is a smooth surjective map $\pi\colon\mathcal{E}\to\mathcal{B}$ between smooth manifolds, with **total space** $\mathcal{E}$ and **base space** $\mathcal{B}$. A **section** is a map $\sigma\colon\mathcal{B}\to\mathcal{E}$ that picks one element in each fibre:
      $$\pi\circ\sigma = \mathrm{id}_{\mathcal{B}},$$
      where $\mathrm{id}_{\mathcal{B}}$ is the identity map of $\mathcal{B}$, $p\mapsto p$.

      A **smooth vector field** on $\mathcal{M}$ is a smooth section of the tangent bundle:
      $$\mathcal{X}\colon\mathcal{M}\to T\mathcal{M},\quad \pi\circ\mathcal{X} = \mathrm{id}_\mathcal{M}.$$
      The condition says $\mathcal{X}(p)\in T_p\mathcal{M}$: the arrow assigned to $p$ sits at $p$. We write $\mathcal{X}(p) = \mathcal{X}_p$, and
      $$\Gamma T\mathcal{M} := \{\text{smooth vector fields on }\mathcal{M}\},$$
      where $\Gamma$ stands for "sections of".

  - type: mcq
    id: which-sections
    title: Which maps are sections?
    multiple: true
    prompt: |
      Take the bundle $\pi\colon\mathbb{R}^2\to\mathbb{R}$, $\pi(a,b) := a$: the fibre over $a$ is the vertical line through $(a, 0)$. A section is a map $\sigma\colon\mathbb{R}\to\mathbb{R}^2$ with $\pi\circ\sigma = \mathrm{id}_\mathbb{R}$. Which maps are sections? Select all that apply.
    options:
      - text: '$\sigma(a) = (a, a^2)$'
        correct: true
      - text: '$\rho(a) = (a, \sin a)$'
        correct: true
      - text: '$\tau(a) = (a + 1, 0)$'
        feedback: |
          $\pi(\tau(a)) = a + 1\neq a$: $\tau$ picks a point in the fibre over $a + 1$, not over $a$. A smooth, innocent-looking map, but it puts the arrow at the wrong place.
      - text: '$\kappa(a) = (a^2, a)$'
        feedback: |
          $\pi(\kappa(a)) = a^2$, which equals $a$ only for $a = 0, 1$. Having the right shape, a pair, is not enough: the **first** entry, the base point, must be $a$ itself.
    explanation: |
      A section of this bundle is exactly a map $a\mapsto(a, g(a))$, the graph of a function $g$. So $\sigma$ ($g = a^2$) and $\rho$ ($g = \sin a$) are sections; $\tau$ and $\kappa$ land in the wrong fibre. A vector field is the same idea with the fibre $\mathbb{R}$ replaced by $T_p\mathcal{M}$.

  - type: text
    id: components
    title: Component functions
    body: |
      Let $\mathcal{X}$ be a section of $T\mathcal{M}$ and $(\mathcal{U},\mathscr{X})$ a chart. Write $\mathcal{X}|_\mathcal{U}$ for its restriction to $\mathcal{U}$ (the same rule, used only at points of $\mathcal{U}$). At each $p\in\mathcal{U}$ the vector $\mathcal{X}(p)$ has components in the chart-induced basis; letting $p$ move turns them into $d$ **component functions**
      $$x^i\colon\mathcal{U}\to\mathbb{R},\quad x^i(p) := \mathcal{X}(p)(\mathscr{X}^i).$$
      Dropping $p$ from the basis vectors gives the **chart-induced basis fields** $\partial x_i := \partial/\partial\mathscr{X}^i$, the maps $p\mapsto(\partial x_i)_p$ on $\mathcal{U}$, and the expansion at each point becomes one equation of fields:
      $$\mathcal{X}|_\mathcal{U} = x^i\,\partial x_i.$$

      In the bundle chart, the field looks like this: for $\alpha\in\mathscr{X}(\mathcal{U})$,
      $$\begin{aligned}(\xi_{\mathscr{X}}\circ\mathcal{X}\circ\mathscr{X}^{-1})&(\alpha)\\ &= \big(\alpha\,;\,(x^i\circ\mathscr{X}^{-1})(\alpha)\big).\end{aligned}$$
      The first block is the identity, smooth no matter what; all the information is in the second.

  - type: mcq
    id: smooth-iff
    title: When is a section smooth?
    prompt: |
      A section $\mathcal{X}$ of $T\mathcal{M}$ (a vector $\mathcal{X}(p)\in T_p\mathcal{M}$ at each $p$) has, in a chart $(\mathcal{U},\mathscr{X})$, component functions $x^i(p) := \mathcal{X}(p)(\mathscr{X}^i)$, and its representative in the bundle chart $\xi_{\mathscr{X}}$ is $\alpha\mapsto\big(\alpha\,;\,(x^i\circ\mathscr{X}^{-1})(\alpha)\big)$. On $\mathcal{U}$, when is $\mathcal{X}$ a smooth map into $T\mathcal{M}$?
    options:
      - text: 'Exactly when every component function $x^i$ is smooth on $\mathcal{U}$, i.e. every $x^i\circ\mathscr{X}^{-1}$ is $C^\infty$'
        correct: true
      - text: 'Always: a section is smooth by definition, because $\pi\circ\mathcal{X} = \mathrm{id}$ is smooth'
        feedback: |
          $\pi\circ\mathcal{X} = \mathrm{id}$ only fixes the **first** block of the representative, the base point $\alpha$. The second block, the components, can be any functions at all, even discontinuous ones: the arrow could flip at random from point to point. Smoothness is an extra condition.
      - text: 'When the arrows have smoothly varying lengths'
        feedback: |
          "Length" needs a way to measure vectors, a metric (Level 7), which we do not have. And even with one, the direction could still jump while the length stays fixed. The test uses only the chart: smooth component functions.
    explanation: |
      A map between manifolds is smooth when its chart representatives are, and here the representative is $\alpha\mapsto(\alpha\,;\,x^i\circ\mathscr{X}^{-1}(\alpha))$. Its first block is always smooth, so $\mathcal{X}$ is smooth on $\mathcal{U}$ exactly when its component functions are. A smooth vector field is a section whose component functions are smooth in every chart.

  - type: mcq
    id: abs-section
    title: A section with a kink
    prompt: |
      On the plane $\mathbb{R}^2$ with the cartesian chart $\mathscr{X}(q) = (a, b)$ and basis fields $\partial x_1$, $\partial x_2$, let $\mathcal{W} := |b|\,\partial x_1$: at each point, the vector with component functions $(|b|, 0)$. Which statement is true?
    options:
      - text: '$\mathcal{W}$ is a section of $T\mathbb{R}^2$, even a continuous one, but not a smooth vector field'
        correct: true
      - text: '$\mathcal{W}$ is not a section, because the vector vanishes on the line $b = 0$'
        feedback: |
          A section may take the value zero: the zero vector of $T_p\mathcal{M}$ is still an element of $T_p\mathcal{M}$, so $\pi(\mathcal{W}(p)) = p$ holds everywhere. Vanishing somewhere is allowed; the swirl vanishes at the origin and is perfectly smooth.
      - text: '$\mathcal{W}$ is a smooth vector field, since it varies continuously and has no jumps'
        feedback: |
          Continuity is not smoothness. The component $|b|$ has a kink at $b = 0$: its derivative jumps from $-1$ to $1$, so $|b|$ is not $C^\infty$ and the criterion "smooth component functions" fails.
    explanation: |
      $\mathcal{W}(p)\in T_p\mathbb{R}^2$ for every $p$, so it is a section, and $|b|$ is continuous. But $|b|$ is not differentiable on $b = 0$, so $\mathcal{W}\notin\Gamma T\mathbb{R}^2$.

  - type: text
    id: chart-independence
    title: Smooth in one chart, smooth in all
    body: |
      "Smooth in every chart" sounds like infinitely many checks. It is not. Let $(\mathcal{V},\mathscr{Y})$ be a second chart, with component functions $y^i$ of the same field. At each $p\in\mathcal{U}\cap\mathcal{V}$ the vector $\mathcal{X}(p)$ is one vector, so the contravariant law holds point by point. Letting $p$ move, it becomes an identity of **functions** on the overlap:
      $$y^i = \frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\,x^j,$$
      where $\partial\mathscr{Y}^i/\partial\mathscr{X}^j$ now denotes the function $p\mapsto(\partial\mathscr{Y}^i/\partial\mathscr{X}^j)_p$. The Jacobian **depends on the point**, but its entries are smooth functions, because the transition map is $C^\infty$. Products and sums of smooth functions are smooth, so smooth $x^j$ give smooth $y^i$.

      So it is enough to check smoothness in charts that cover $\mathcal{M}$: the answer is the same in every chart of the atlas.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Next:** Part 2 of this lesson puts the machinery to work on a running example, the egg-carton surface: the vertical field and the swirl in two charts, a field **acting** on a scalar field (the derivative along its arrows), and two traps about basis fields.
