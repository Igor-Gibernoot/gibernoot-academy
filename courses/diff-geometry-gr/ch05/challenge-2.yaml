  # ---------------------------------------------------------------- Wrap-up
  - type: text
    id: wrap-up
    title: What you now own
    body: |
      Problems 4 and 5, part 2 of 2 of the level challenge. Level 5 turned single tensors at a point into **fields**: one smooth choice per point, components that are functions. With $\mathscr{X}$ the old and $\mathscr{Y}$ the new chart, a $(0,2)$-tensor field transforms with one Jacobian factor per slot:
      $$(T_\mathcal{V})_{kl} = \frac{\partial\mathscr{X}^i}{\partial\mathscr{Y}^k}\frac{\partial\mathscr{X}^j}{\partial\mathscr{Y}^l}(T_\mathcal{U})_{ij}$$
      and tensor fields are exactly the $C^\infty$-linear machines:
      $$T(f\mathcal{Z}_1 + \mathcal{Z}_2,\dots) = f\,T(\mathcal{Z}_1,\dots) + T(\mathcal{Z}_2,\dots)$$
      A covector field $\mathsf{X} = \mathtt{x}_i\,dx^i$ is exact if $\mathsf{X} = df$; it is closed if
      $$\partial x_j\lfloor\mathtt{x}_i\rceil = \partial x_i\lfloor\mathtt{x}_j\rceil, \tag{S}$$
      which is enough on a ball, not around a hole, as loop integrals detect:
      $$\int_\gamma df = f(\text{end}) - f(\text{start})$$

      **Next, Level 6.** We can now let a vector field act on functions, but not yet **differentiate a vector field** along another. The obvious idea, differentiating its components, is not a tensor: $\partial x_1\lfloor z^1\rceil$ changes meaning with the chart, and the constant field $\partial x_1$ has non-constant polar components. Is it changing or not? Answering needs new structure: the **covariant derivative** $\nabla$, the first step toward curvature and gravity.
