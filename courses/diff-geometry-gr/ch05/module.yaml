id: ch05-module
title: The $C^\infty(\mathcal{M})$-Module Structure · Part 1
kind: concept
own: |
  - The **ring** $(C^\infty(\mathcal{M}),\oplus_{C^\infty},\odot_{C^\infty})$: commutative and unitary, not a field; $f$ is invertible iff {{ it never vanishes }}; zero divisors such as $\psi(t)$ and $\psi(-t)$ on $\mathbb{R}$, where $\psi(t) := e^{-1/t}$ for $t>0$ and $\psi(t):=0$ for $t\leq0$ (smooth, with $\psi(t)\,\psi(-t)=0$ at every $t$).
  - **Cancellation fails**: since $\psi(t)\,\psi(-t)=0=\psi(t)\cdot 0$ with $\psi(-t)\neq0$, a nonzero function cannot always be divided away, and {{ $f\,\mathcal{X} = f\,\mathcal{W}$ does not imply $\mathcal{X}=\mathcal{W}$ }} when the function $f$ has zeros.
  - **Modules**: vector-space axioms with ring scalars. $(\Gamma T\mathcal{M},\oplus_\Gamma,\odot_\Gamma)$ and $(\Gamma T^*\mathcal{M},\oplus^*_\Gamma,\odot^*_\Gamma)$, with {{ $(f\,\mathcal{X})(p) = f(p)\,\mathcal{X}(p)$ }} for $f\in C^\infty(\mathcal{M})$, $\mathcal{X}$ a vector field: only values of $f$ enter.
  - In a chart $\mathscr{X}$ with basis fields $\partial x_i$, the operations act on component functions: {{ $(f\,\mathcal{X}+\mathcal{Y})^i = f\,X^i + Y^i$ }}, where $X^i$, $Y^i$ are the components of $\mathcal{X}$, $\mathcal{Y}$. A function can kill a field at the points where it vanishes, and no function can undo that.

cards:
  - type: text
    id: hook
    title: Normalise the swirl
    body: |
      In the plane with points $q = (q_1, q_2)$, the **swirl** $\mathcal{Y}$ puts at each point $q$ the velocity with standard components $(-q_2, q_1)$: the velocity of the circle around the origin through $q$. Its length (the length of its standard components) is
      $$r(q) := \sqrt{q_1^2 + q_2^2},$$
      so it is long far out and short near the origin.

      A physicist often wants a field of **unit** length, for instance a direction field with no speed information. The obvious recipe: at every point, divide the arrow by its length,
      $$q\mapsto\frac{1}{r(q)}\,\mathcal{Y}(q).$$
      This multiplies a field by a **function**, a different number at every point. Two questions for this lesson and the next: what kind of algebra do "fields times functions" obey, and does this algebra still have bases, the way every vector space does? This part takes the first question; Part 2 takes the second.

      (Length here uses the standard components of $\mathbb{R}^2$; a length defined on any manifold needs the metric, Level 7.)

  - type: widget
    id: rescale
    title: Rescaling arrow by arrow
    widget: chart-basis
    config:
      charts:
        - { chart: cartesian, name: '\mathscr{X}' }
      p: [2, 0]
      v: [0, 2]
      view: { x: -1, y: -1.5, w: 4.5, h: 4.5 }
      presets:
        - { label: 'Swirl at (2, 0)', p: [2, 0], v: [0, 2] }
        - { label: 'Unit at (2, 0)', p: [2, 0], v: [0, 1] }
        - { label: 'Swirl at (0.5, 0)', p: [0.5, 0], v: [0, 0.5] }
        - { label: 'Unit at (0.5, 0)', p: [0.5, 0], v: [0, 1] }
        - { label: 'Unit at (−0.5, 0)', p: [-0.5, 0], v: [0, -1] }
        - { label: 'Unit at (0, 0.5)', p: [0, 0.5], v: [-1, 0] }
        - { label: 'Origin', p: [0, 0], v: [0, 0] }
    body: |
      The plane with the cartesian chart $\mathscr{X}(q) = (q_1, q_2)$; the gold point is $p$, the purple arrows are the basis vectors at $p$, and the blue arrow is a velocity at $p$ with its components listed. The widget shows one point at a time.

      1. Press "Swirl at $(2,0)$", then "Unit at $(2,0)$": the arrow shrinks by the factor $1/r = 1/2$.
      2. Press "Swirl at $(0.5,0)$", then "Unit at $(0.5,0)$": now the factor is $1/r = 2$, the arrow **grows**. One field, multiplied by a function: a different factor at every point.
      3. Press the three "Unit" presets near the origin: at distance $\tfrac12$ the unit arrows point up, down and left. Imagine $p$ moving into the origin from different sides.
      4. Press "Origin": the swirl is the zero vector there. Which factor would turn it into a unit arrow?

  - type: mcq
    id: predict-unit
    title: Predict first
    prompt: |
      In the plane, the swirl $\mathcal{Y}$ has standard components $(-q_2, q_1)$ at $q = (q_1,q_2)$, and length $r(q) = \sqrt{q_1^2+q_2^2}$. Is there a smooth function $f$ on the **whole** plane such that the field $q\mapsto f(q)\,\mathcal{Y}(q)$ has length $1$ at every point?
    options:
      - text: 'No: at the origin $\mathcal{Y}$ is the zero vector, and $f(0)$ times the zero vector is zero, whatever $f$ is'
        correct: true
      - text: 'Yes: $f = 1/r$'
        feedback: |
          $1/r$ works at every point except the origin, where $r = 0$ and $1/r$ is not defined. On the whole plane $1/r$ is not a function at all, let alone a smooth one. And no other choice rescues it: at the origin the swirl is zero, and any number times zero is zero.
      - text: 'No, because the plane carries no smooth field of length $1$ at all'
        feedback: |
          The plane has many: the field with constant standard components $(1, 0)$ has length $1$ everywhere. The obstruction is not the plane, it is the swirl's zero at the origin, which no factor can undo.
    explanation: |
      Multiplying by a function can shrink and stretch, but it cannot **divide**: $f(0)\cdot 0 = 0$ for every $f$. On the plane minus the origin, $1/r$ is smooth and gives the unit swirl. Near the origin the unit arrows point in every direction (up at $(0.5,0)$, down at $(-0.5,0)$), so even a non-smooth patch at the origin could not make it continuous. The algebra of "fields times functions" has no division: that is the theme of this lesson.

  - type: mcq
    id: predict-basis
    title: Guess the answer
    prompt: |
      In a $d$-dimensional vector space every vector is a unique combination of $d$ basis vectors with real coefficients. Now take all smooth vector fields on a $d$-dimensional manifold $\mathcal{M}$, and allow smooth **functions** as coefficients. Before any theory, guess: are there always $d$ fields $e_1,\dots,e_d$ such that every smooth field is uniquely $f^1 e_1 + \dots + f^d e_d$ with smooth functions $f^a$?
    options:
      - text: 'Not always: on some manifolds there are, on others there are not'
        correct: true
      - text: 'Always, since every tangent space $T_p\mathcal{M}$ has a basis'
        feedback: |
          Each tangent space has a basis, but the bases chosen point by point must fit together into **smooth fields**, and that can be impossible. We will meet a manifold (the sphere) where every smooth field vanishes somewhere, so no $d$ fields can give a basis at every point.
      - text: 'Never: functions as coefficients are too many to allow uniqueness'
        feedback: |
          On the plane the two fields $\partial x_1$, $\partial x_2$ of the cartesian chart work: every smooth field is uniquely $x^1\,\partial x_1 + x^2\,\partial x_2$ with its smooth component functions. So "never" is false; the honest answer depends on the manifold.
    explanation: |
      On the plane such fields exist (the cartesian basis fields), on the sphere they do not. To see why, we first need the algebra: the functions form a **ring**, and the fields form a **module** over it.

  - type: text
    id: ring
    title: Functions multiply functions
    body: |
      Recall that scalar fields $C^\infty(\mathcal{M})$ (smooth functions $\mathcal{M}\to\mathbb{R}$) form a real vector space with $(f\oplus g)(p) := f(p)+g(p)$ and $(\alpha\odot f)(p) := \alpha\cdot f(p)$, $\alpha\in\mathbb{R}$. Now let a function multiply a function, point by point: for $f, g\in C^\infty(\mathcal{M})$,
      $$(f\oplus_{C^\infty} g)(p) := f(p) + g(p),$$
      $$(f\odot_{C^\infty} g)(p) := f(p)\cdot g(p).$$
      Both results are smooth again (sums and products of smooth functions).

      A **commutative unitary ring** $(R,+,\cdot)$ is a set with an addition making it an Abelian (commutative) group, and a multiplication that is associative, commutative, distributes over $+$, and has a neutral element $1$ (the unit). A **field** (in the algebraic sense: $\mathbb{R}$, $\mathbb{Q}$, not a vector field) is such a ring with $1\neq 0$ where every $r\neq 0$ has an inverse $r^{-1}$, $r\cdot r^{-1} = 1$.

      Every axiom of $(C^\infty(\mathcal{M}),\oplus_{C^\infty},\odot_{C^\infty})$ holds because it holds for real numbers at each point $p$. The zero is the zero field $0\colon p\mapsto 0$, the unit is $1\colon p\mapsto 1$. So it is a **commutative unitary ring**. Is it a field?

  - type: mcq
    id: inverses
    title: Which functions can be inverted?
    multiple: true
    prompt: |
      On $\mathcal{M} = \mathbb{R}$ with coordinate $t$, the ring $C^\infty(\mathbb{R})$ multiplies functions point by point, with unit the constant function $1$. A function $f$ has an inverse if some smooth $g$ satisfies $f(t)\,g(t) = 1$ for every $t$. Select all functions that have an inverse.
    options:
      - text: '$f(t) = 1 + t^2$'
        correct: true
      - text: '$f(t) = e^t$'
        correct: true
      - text: '$f(t) = -3$ (a constant)'
        correct: true
      - text: '$f(t) = t$'
        feedback: |
          $t$ is not the zero function, but it vanishes at $t = 0$, and there $f(0)\,g(0) = 0\neq 1$ for every $g$. Over a field "nonzero" means "invertible"; in this ring nonzero means "not zero **everywhere**", which is not enough.
      - text: '$f(t) = \cos t$'
        feedback: |
          $\cos t$ vanishes at $t = \pi/2$ (and infinitely often), and at such a point no value $g(\pi/2)$ can give $0\cdot g(\pi/2) = 1$. Away from its zeros, $1/\cos t$ exists, but not on all of $\mathbb{R}$.
    explanation: |
      $f$ is invertible exactly when it **never vanishes**: then $1/f$ is smooth (a quotient with nonzero denominator), and if $f(q) = 0$ somewhere, $f(q)\,g(q) = 0\neq1$. So $1+t^2$, $e^t$ and $-3$ are invertible, while $t$ and $\cos t$ are nonzero functions with no inverse. Hence $C^\infty(\mathcal{M})$ is a ring but **not a field** (on any manifold of dimension $d\geq1$, where a function such as a coordinate can vanish somewhere without vanishing everywhere).

  - type: text
    id: zero-divisors
    title: Two nonzero functions with product zero
    body: |
      It gets stranger. On $\mathbb{R}$ take
      $$\psi(t) := \begin{cases} e^{-1/t} & t > 0\\ 0 & t\leq 0.\end{cases}$$
      It is smooth on all of $\mathbb{R}$, including $t = 0$ (stated here without proof: every derivative of $e^{-1/t}$ tends to $0$ as $t\to0^+$). It is zero on the left half-line and positive on the right one. Its mirror image $\psi(-t)$ is positive on the left and zero on the right.

      Neither $f := \psi(t)$ nor $g := \psi(-t)$ is the zero function, yet at every $t$ one of the two factors is zero, so
      $$f\odot_{C^\infty} g = 0.$$
      Nonzero elements whose product is zero are called **zero divisors**. Real numbers have none: $\alpha\beta = 0$ forces $\alpha = 0$ or $\beta = 0$.

      The real numbers have not disappeared: identify $\alpha\in\mathbb{R}$ with the constant function $p\mapsto\alpha$. Then the old scaling is a special case of the new product, $\alpha\odot f = \alpha\odot_{C^\infty} f$. A set that is at once a real vector space and a compatible ring is called an $\mathbb{R}$-**algebra**.

  - type: mcq
    id: cancel
    title: Can you cancel a factor?
    prompt: |
      On $\mathbb{R}$, let $\psi(t) := e^{-1/t}$ for $t>0$ and $\psi(t) := 0$ for $t\leq0$ (a smooth function), $f(t) := \psi(t)$ and $h(t) := \psi(-t)$. Products are taken point by point. Which statement is true?
    options:
      - text: '$f\,h = f\cdot 0$ although $h\neq 0$: a nonzero factor $f$ cannot be cancelled'
        correct: true
      - text: '$f\,h = 0$ forces $h = 0$, since $f$ is not the zero function'
        feedback: |
          That is the rule for real numbers, where a nonzero number can be divided away. Here $h(t) = \psi(-t)$ is positive for every $t<0$, so $h\neq0$; the product vanishes because at each point **one of the two** factors is zero, $f$ on the left and $h$ on the right.
      - text: '$f\,h$ is not smooth, because $\psi$ is glued from two pieces'
        feedback: |
          $\psi$ is smooth (all its derivatives at $0$ vanish from both sides), and so is the product of smooth functions. Here the product is even the simplest smooth function there is: the zero function.
    explanation: |
      For $t>0$, $h(t) = \psi(-t) = 0$; for $t\leq 0$, $f(t) = 0$. So $f\,h = 0 = f\cdot 0$ with $h\neq 0$: in the ring $C^\infty(\mathbb{R})$ cancellation fails. Expect the same for fields: $f\,\mathcal{X} = f\,\mathcal{W}$ will not imply $\mathcal{X} = \mathcal{W}$ when $f$ has zeros.

  - type: text
    id: field-operations
    title: Adding fields, scaling by functions
    body: |
      Now the official version of "$g\,\mathcal{X}$". For vector fields $\mathcal{X}_1, \mathcal{X}_2, \mathcal{X}\in\Gamma T\mathcal{M}$ (the smooth vector fields) and $f\in C^\infty(\mathcal{M})$, define new fields by their action on every scalar field $g$:
      $$(\mathcal{X}_1\oplus_\Gamma\mathcal{X}_2)\lfloor g\rceil := \mathcal{X}_1\lfloor g\rceil\oplus_{C^\infty}\mathcal{X}_2\lfloor g\rceil,$$
      $$(f\odot_\Gamma\mathcal{X})\lfloor g\rceil := f\odot_{C^\infty}\mathcal{X}\lfloor g\rceil.$$
      Recall $\mathcal{X}\lfloor g\rceil(p) := \mathcal{X}(p)(g)$. At a point, the second rule reads $(f\odot_\Gamma\mathcal{X})(p)(g) = f(p)\cdot\mathcal{X}(p)(g)$. Since two tangent vectors at $p$ are equal when they agree on every $g$, this says simply
      $$(f\odot_\Gamma\mathcal{X})(p) = f(p)\,\mathcal{X}(p),$$
      the vector $\mathcal{X}(p)$ scaled by the **number** $f(p)$ in $T_p\mathcal{M}$; likewise $(\mathcal{X}_1\oplus_\Gamma\mathcal{X}_2)(p) = \mathcal{X}_1(p)+\mathcal{X}_2(p)$. In a chart the component functions add and get multiplied by $f$, so the results are smooth fields again.

      Covector fields $\mathsf{X},\mathsf{Y}\in\Gamma T^*\mathcal{M}$ work the same way, through their action $\mathsf{X}\lceil\mathcal{X}\rfloor(p) := \mathsf{X}_p(\mathcal{X}(p))$ on vector fields:
      $$(\mathsf{X}\oplus^*_\Gamma\mathsf{Y})\lceil\mathcal{X}\rfloor := \mathsf{X}\lceil\mathcal{X}\rfloor\oplus_{C^\infty}\mathsf{Y}\lceil\mathcal{X}\rfloor,$$
      $$(h\odot^*_\Gamma\mathsf{X})\lceil\mathcal{X}\rfloor := h\odot_{C^\infty}\mathsf{X}\lceil\mathcal{X}\rfloor.$$
      Short forms from now on: $f\,\mathcal{X}$, $\mathcal{X}_1+\mathcal{X}_2$, $h\,\mathsf{X}$, $\mathsf{X}+\mathsf{Y}$.

  - type: text
    id: module-def
    title: Modules
    body: |
      Let $(R,+,\cdot)$ be a commutative unitary ring. An $R$-**module** is a set $G$ with an addition $\oplus$ making it an Abelian group (zero element $0_G$) and a scaling $\odot\colon R\times G\to G$ such that, for all $r,s\in R$ and $u,w\in G$:
      $$\begin{gathered}r\odot(u\oplus w) = (r\odot u)\oplus(r\odot w)\\ (r+s)\odot u = (r\odot u)\oplus(s\odot u)\\ (r\cdot s)\odot u = r\odot(s\odot u)\\ 1\odot u = u\end{gathered}$$
      These are word for word the vector-space axioms; the only change is that the scalars form a ring. **A vector space is exactly a module over a field.**

      With $R = C^\infty(\mathcal{M})$, the vector fields $(\Gamma T\mathcal{M},\oplus_\Gamma,\odot_\Gamma)$ form a $C^\infty(\mathcal{M})$-module, the zero element being the zero field $p\mapsto 0_p$ (the zero vector of each $T_p\mathcal{M}$). So do the covector fields $(\Gamma T^*\mathcal{M},\oplus^*_\Gamma,\odot^*_\Gamma)$. Each axiom is checked point by point.

  - type: mcq
    id: axiom-check
    title: Checking one axiom
    prompt: |
      Let $\mathcal{X}$ be a smooth vector field and $f, g$ smooth functions on $\mathcal{M}$, with $(f\odot_\Gamma\mathcal{X})(p) = f(p)\,\mathcal{X}(p)$. Why does the module axiom
      $$(f\odot_{C^\infty} g)\odot_\Gamma\mathcal{X} = f\odot_\Gamma(g\odot_\Gamma\mathcal{X})$$
      hold?
    options:
      - text: 'At each $p$ both sides are $f(p)\,g(p)\,\mathcal{X}(p)$, and scaling a vector of $T_p\mathcal{M}$ by $f(p)g(p)$ equals scaling by $g(p)$, then by $f(p)$'
        correct: true
      - text: 'It needs the Leibniz rule, because the product $f\,g$ appears'
        feedback: |
          The Leibniz rule describes a vector **acting on** a product of functions, $v(fg) = f(p)\,v(g) + g(p)\,v(f)$. Here the product $fg$ is not being differentiated: it only **scales** the field, and only its values $f(p)g(p)$ enter. No derivative of $f$ or $g$ appears.
      - text: 'It holds only where $f$ and $g$ are nonzero, since there one may divide'
        feedback: |
          No division is used anywhere. Where $f(p) = 0$ both sides are the zero vector at $p$, so the identity holds there too. The axiom is an identity of real-number scaling in the vector space $T_p\mathcal{M}$, true for every value of $f(p)$ and $g(p)$.
    explanation: |
      Evaluate both sides at $p$:
      $$\begin{aligned}\big((fg)\odot_\Gamma\mathcal{X}\big)(p) &= \big(f(p)g(p)\big)\mathcal{X}(p)\\ &= f(p)\big(g(p)\,\mathcal{X}(p)\big)\\ &= \big(f\odot_\Gamma(g\odot_\Gamma\mathcal{X})\big)(p).\end{aligned}$$
      The middle step is the axiom $(\alpha\beta)v = \alpha(\beta v)$ of the real vector space $T_p\mathcal{M}$. Every module axiom of $\Gamma T\mathcal{M}$ is inherited this way from the vector-space axioms of the tangent spaces, one point at a time.

  - type: text
    id: egg-operations
    title: The operations in the running example
    body: |
      On the egg-carton surface (chart $\mathscr{X}(a,b,c) = (a,b)$ on all of $\mathcal{M}$), with $\mathcal{X} = \partial x_2$, the swirl $\mathcal{Y} = -b\,\partial x_1 + a\,\partial x_2$ and the height $f = \cos a\cos b + 1$, the module operations act on component functions:
      $$\begin{aligned}\mathcal{X}\oplus_\Gamma\mathcal{Y} &= (X^i + \tilde X^i)\,\partial x_i\\ &= -b\,\partial x_1 + (1+a)\,\partial x_2,\end{aligned}$$
      $$\begin{aligned}f\odot_\Gamma\mathcal{X} &= (f\,X^i)\,\partial x_i\\ &= (\cos a\cos b + 1)\,\partial x_2.\end{aligned}$$
      The second line is where a module parts ways with a vector space: the factor is a function, so it stretches $\mathcal{X}$ by $2$ at $(a,b) = (0,0)$, leaves it at $(\pi/2, 0)$, and kills it at $(\pi, 0)$, where $f = -1\cdot1 + 1 = 0$. Since $f\geq0$, it never reverses the field. And at $(\pi,0)$ no function can undo the scaling.

  - type: numeric
    id: egg-sum
    title: Components of a sum
    prompt: |
      On the egg-carton surface with chart $\mathscr{X}(a,b,c) = (a,b)$, let $\mathcal{X} = \partial x_2$, the swirl $\mathcal{Y} = -b\,\partial x_1 + a\,\partial x_2$ and $f = \cos a\cos b + 1$. What is the $\partial x_2$-component of the field $(f\odot_\Gamma\mathcal{X})\oplus_\Gamma\mathcal{Y}$ at the point with $a = 0$, $b = \pi$?
    answer: 0
    wrong:
      - { value: 1, feedback: 'That is the component of $\mathcal{X}+\mathcal{Y}$ without the factor $f$, or with $f$ read as $1$. Here $f(0,\pi) = \cos0\cos\pi + 1 = -1 + 1 = 0$, so $f\,\mathcal{X}$ contributes $0$; the swirl contributes $a = 0$.' }
      - { value: 2, feedback: 'You may have used $\cos\pi = 1$. In fact $\cos\pi = -1$, so $f(0,\pi) = 1\cdot(-1) + 1 = 0$ and $f\,\mathcal{X}$ vanishes at this point; the swirl adds $a = 0$.' }
    hint: |
      Components add and get multiplied by the value of $f$: the $\partial x_2$-component is $f\cdot1 + a$. Evaluate $f$ at $(0,\pi)$.
    explanation: |
      The $\partial x_2$-component of $f\,\mathcal{X} + \mathcal{Y}$ is $f + a = \cos a\cos b + 1 + a$. At $(0,\pi)$: $1\cdot(-1) + 1 + 0 = 0$. (The $\partial x_1$-component is $-b = -\pi$, so the field there is $-\pi\,\partial x_1$, not zero.)

  - type: numeric
    id: covector-scale
    title: Scaling a covector field
    prompt: |
      On the egg-carton surface with chart $\mathscr{X}(a,b,c) = (a,b)$, the height $f = \cos a\cos b + 1$ has differential $df$ with components $(-\sin a\cos b,\ -\cos a\sin b)$, and $\mathcal{X} = \partial x_2$. Compute the function $(f\odot^*_\Gamma df)\lceil\mathcal{X}\rfloor$ at the point with $a = 0$, $b = \pi/3$.
    answer: -1.299038
    tolerance: 0.001
    answerText: '-3\sqrt3/4 \approx -1.299'
    wrong:
      - { value: -0.866025, feedback: 'That is $df\lceil\mathcal{X}\rfloor = -\cos a\sin b = -\sqrt3/2$ alone. The factor $f$ multiplies the result: $f(0,\pi/3) = \cos0\cos(\pi/3) + 1 = 3/2$.' }
      - { value: -1.732051, feedback: 'You may have used $f = 2$, the height at $(0,0)$. At $b = \pi/3$, $\cos b = 1/2$, so $f = 3/2$.' }
    hint: |
      By definition $(f\odot^*_\Gamma df)\lceil\mathcal{X}\rfloor = f\cdot df\lceil\mathcal{X}\rfloor$, and $df\lceil\mathcal{X}\rfloor$ is the $\partial x_2$-component of $df$, because $\mathcal{X} = \partial x_2$.
    explanation: |
      $(f\,df)\lceil\mathcal{X}\rfloor = f\cdot df\lceil\partial x_2\rfloor = (\cos a\cos b + 1)(-\cos a\sin b)$. At $(0,\pi/3)$:
      $$\tfrac32\cdot\Big(-\tfrac{\sqrt3}{2}\Big) = -\tfrac{3\sqrt3}{4}\approx-1.299.$$
      Only the **value** of $f$ enters, no derivative of $f$: the scaling acts point by point.

  - type: text
    id: summary
    title: What you now own
    body: |
      **The first question, answered.** "Fields times functions" obey the algebra of a **module** over the commutative unitary ring $C^\infty(\mathcal{M})$, not over a field: a function with a zero has no inverse, and there are zero divisors. So normalising the swirl fails exactly where $r=0$.

      **Next:** does this module have a basis, the way every vector space does? Independent fields can fail to span, a basis must be a basis at every point, and on the sphere the hairy ball theorem forbids one. The lesson The $C^\infty(\mathcal{M})$-Module Structure · Part 2 builds frames, global frames and the circle, torus and sphere.
