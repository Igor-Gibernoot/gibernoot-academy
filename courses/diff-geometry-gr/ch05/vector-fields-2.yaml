id: ch05-vector-fields-2
title: Vector Fields and the Tangent Bundle · Part 2
kind: concept
own: |
  - A **smooth vector field** $\mathcal{X}$ on a smooth manifold $\mathcal{M}$ (a smooth section of the tangent bundle $T\mathcal{M}$) has, in a chart $\mathscr{X}$, smooth component functions $x^i$, and a second chart $\mathscr{Y}$ gives {{ $y^i = (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)\,x^j$ }}; it also **eats scalar fields**: for a smooth function $f$ the scalar field {{ $\mathcal{X}\lfloor f\rceil(p) = \mathcal{X}(p)(f) = x^i(p)\,\mathtt{x}^p_i$ }}, with $\mathtt{x}^p_i$ the components of $(df)_p$, so that chart-independently $\mathcal{X}\lfloor f\rceil(p)$ is a number.
  - Example: on the egg-carton surface $\mathcal{M} = \{c = \cos a\cos b + 1\}$ with chart $\mathscr{X}(a,b,c) = (a,b)$ and polar chart $\mathscr{Y} = (r,\theta)$ ($r = \sqrt{a^2+b^2}$, defined off the half-line $b=0$, $a\le0$), the **vertical field** has components $(0,1)$ in $\mathscr{X}$ and, in the polar chart,
    $$\mathcal{X}|_\mathcal{V} = \frac{b}{r}\,\partial y_1 + \frac{a}{r^2}\,\partial y_2,$$
    which blows up at $r\to0$ because the origin is outside $\mathscr{Y}$, not because $\mathcal{X}$ is broken.
  - The **swirl** has components {{ $(-b,\ a)$ }} in $\mathscr{X}$ and {{ $(0,\ 1)$ }} in the polar chart, i.e. $\partial y_2$, and it vanishes at the origin; acting on the height $f = \cos a\cos b+1$ it gives $\mathcal{Y}\lfloor f\rceil = b\sin a\cos b - a\cos a\sin b$ in either chart.
  - A chart basis field lives only on its chart's domain: $\partial y_2$ extends over the origin as the swirl, but {{ $\partial y_1$ does not extend }} (its components $(a/r, b/r)$ have no limit at the origin), and two smooth fields can fail to be a basis at some points ($\mathcal{X}$ and the swirl, on the whole line $b = 0$).

cards:
  - type: text
    id: recall-fields
    tag: Recall
    title: 'Recall: fields, bundle and the transformation law'
    body: |
      Recall, from the lesson Vector Fields and the Tangent Bundle · Part 1: on a smooth manifold $\mathcal{M}$ of dimension $d$, the **tangent bundle** $T\mathcal{M}$ is the disjoint union of all the tangent spaces $T_p\mathcal{M}$, with projection $\pi\colon T\mathcal{M}\to\mathcal{M}$, $\pi(\mathcal{X}_p) = p$. A **smooth vector field** is a smooth section $\mathcal{X}\colon\mathcal{M}\to T\mathcal{M}$, $\pi\circ\mathcal{X} = \mathrm{id}_\mathcal{M}$: one arrow $\mathcal{X}(p)\in T_p\mathcal{M}$ per point.

      On a chart $(\mathcal{U},\mathscr{X})$ it expands as $\mathcal{X}|_\mathcal{U} = x^i\,\partial x_i$ (Einstein summation), with component functions $x^i = \mathcal{X}|_\mathcal{U}\lfloor\mathscr{X}^i\rceil$, and smooth means smooth components. A second chart $(\mathcal{V},\mathscr{Y})$ gives the same field components
      $$y^i = \frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\,x^j,$$
      with a Jacobian that depends on the point. Now two concrete fields on one surface.

  - type: text
    id: running-example
    title: The running example
    body: |
      The running example is the egg-carton surface: the graph of the height function $h(a,b) := \cos a\cos b + 1$,
      $$\mathcal{M} := \{(a,b,c)\in\mathbb{R}^3 \mid c = h(a,b)\},$$
      with two charts:

      - $(\mathcal{U},\mathscr{X})$, $\mathcal{U} = \mathcal{M}$, $\mathscr{X}(a,b,c) := (a,b)$: it reads the surface as the flat plane, so a picture in the plane is a picture of $\mathcal{M}$ through $\mathscr{X}$ (as in the swirl widget of Part 1).
      - $(\mathcal{V},\mathscr{Y})$, polar: $\mathscr{Y}(a,b,c) := (r, \operatorname{atan2}(b,a))$ with $r := \sqrt{a^2+b^2}$ and angle in $(-\pi,\pi)$, on $\mathcal{V} = \mathcal{M}$ minus the points with $a\le 0$, $b = 0$ (the angle jumps there).

      The Jacobian, row $i$ for $\mathscr{Y}$, column $j$ for $\mathscr{X}$:
      $$\Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p = \begin{pmatrix} a/r & b/r \\ -b/r^2 & a/r^2\end{pmatrix}.$$

      **First field.** Through each point passes one vertical curve $\gamma_{x_0}(\lambda) := (x_0, \lambda, h(x_0,\lambda))$. Let $\mathcal{X}(p)$ be the velocity of the one through $p$. In the chart $\mathscr{X}$, $(\mathscr{X}\circ\gamma_{x_0})(\lambda) = (x_0,\lambda)$, so its component functions, written $X^i$ in this example, are $(X^1, X^2) = (0, 1)$ everywhere:
      $$\mathcal{X}|_\mathcal{U} = \partial x_2.$$
      Constant, hence smooth, components: $\mathcal{X}\in\Gamma T\mathcal{M}$.

  - type: numeric
    id: x-in-polar
    title: The vertical field in polar components
    prompt: |
      On the egg-carton surface $\mathcal{M}$ (graph of $h(a,b) = \cos a\cos b + 1$), the field $\mathcal{X}$ has components $(X^1, X^2) = (0,1)$ in the chart $\mathscr{X}(a,b,c) = (a,b)$. The polar chart $\mathscr{Y} = (r, \operatorname{atan2}(b,a))$, $r = \sqrt{a^2+b^2}$, has Jacobian
      $$\Big(\frac{\partial\mathscr{Y}^i}{\partial\mathscr{X}^j}\Big)_p = \begin{pmatrix} a/r & b/r \\ -b/r^2 & a/r^2\end{pmatrix}$$
      (row $i$ for $\mathscr{Y}$). Using $Y^i = (\partial\mathscr{Y}^i/\partial\mathscr{X}^j)\,X^j$, compute the angular component $Y^2$ at the point with $a = 3$, $b = 4$.
    answer: 0.12
    answerText: '3/25'
    wrong:
      - { value: 0.6, feedback: 'That is $a/r = 3/5$, the entry of row $1$. The angular component uses row $2$, whose entries carry $r^2$: $Y^2 = -\tfrac{b}{r^2}\cdot 0 + \tfrac{a}{r^2}\cdot 1$.' }
      - { value: 0.8, feedback: 'That is $Y^1 = b/r = 4/5$, the radial component. The angular one is row $2$ of the Jacobian times $(0,1)$: $a/r^2$.' }
      - { value: -0.16, feedback: 'That is $-b/r^2$, the entry that multiplies $X^1$. But $X^1 = 0$; the surviving term is the one with $X^2 = 1$, namely $a/r^2$.' }
    hint: 'Only $X^2 = 1$ is nonzero, so $Y^2$ is the entry in row $2$, column $2$ of the Jacobian. Here $r = 5$.'
    explanation: |
      $$Y^2 = -\frac{b}{r^2}\cdot 0 + \frac{a}{r^2}\cdot 1 = \frac{3}{25} = 0.12.$$
      In general $(Y^1, Y^2) = (b/r,\ a/r^2)$:
      $$\mathcal{X}|_\mathcal{V} = \frac{b}{r}\,\partial y_1 + \frac{a}{r^2}\,\partial y_2.$$
      The same field: constant components in one chart, non-constant ones in the other.

  - type: mcq
    id: origin-blowup
    title: Is the vertical field broken at the origin?
    prompt: |
      On the egg-carton surface, the vertical field $\mathcal{X}$ has components $(0,1)$ in the chart $\mathscr{X}(a,b,c) = (a,b)$ and components $(b/r,\ a/r^2)$, $r = \sqrt{a^2+b^2}$, in the polar chart $\mathscr{Y}$ (defined off the half-line $a\le 0$, $b = 0$). The polar components blow up as $r\to 0$. What does this say about $\mathcal{X}$ at the origin?
    options:
      - text: 'Nothing bad: the origin is not in the polar chart domain, so the polar formula never applies there; smoothness at the origin is checked in $\mathscr{X}$, where the components are $(0,1)$'
        correct: true
      - text: '$\mathcal{X}$ is not smooth at the origin, because one of its component formulas diverges there'
        feedback: |
          A component formula only speaks for the points of its chart. The polar chart excludes the origin, so $a/r^2$ is never evaluated there. Near the origin the growth of $a/r^2$ reflects the polar basis vector $\partial y_2$ shrinking (its length is $r$), not anything wrong with $\mathcal{X}$.
      - text: '$\mathcal{X}$ is smooth on $\mathcal{V}$ only, so it is a vector field on $\mathcal{V}$ but not on $\mathcal{M}$'
        feedback: |
          $\mathcal{X}$ is defined at every point of $\mathcal{M}$ by the vertical curves, and the chart $\mathscr{X}$ covers all of $\mathcal{M}$ with constant components $(0,1)$. That is enough: $\mathcal{X}\in\Gamma T\mathcal{M}$. The polar description is just a second view on part of $\mathcal{M}$.
    explanation: |
      Smoothness is checked with charts that **contain** the point. The polar chart misses the origin and the cut; the chart $\mathscr{X}$ covers everything with components $(0,1)$. Large component values near the edge of a chart domain are a property of the chart's basis, not of the field.

  - type: text
    id: second-field
    title: The swirl on the egg carton
    body: |
      **Second field.** Through each point other than the origin passes one horizontal circle $\delta_{r_0}(\lambda) := (r_0\cos\lambda,\ r_0\sin\lambda,\ h(r_0\cos\lambda, r_0\sin\lambda))$, with $r_0 > 0$; at the origin take the constant curve $\delta_0$. Let $\mathcal{Y}(p)$ be the velocity of the one through $p$.

      - In the polar chart, $(\mathscr{Y}\circ\delta_{r_0})(\lambda) = (r_0, \lambda)$, so the components are $(0,1)$: $\mathcal{Y}|_\mathcal{V} = \partial y_2$.
      - In the chart $\mathscr{X}$, $(\mathscr{X}\circ\delta_{r_0})(\lambda) = (r_0\cos\lambda, r_0\sin\lambda)$ has derivative $(-r_0\sin\lambda, r_0\cos\lambda) = (-b, a)$ at $p$:
      $$\mathcal{Y}|_\mathcal{U} = -b\,\partial x_1 + a\,\partial x_2.$$

      This is the swirl of the plane picture in Part 1, seen through $\mathscr{X}$. Its components $(-b, a)$ are polynomials, smooth on all of $\mathcal{M}$, including across the cut and at the origin, where $\mathcal{Y}$ is the zero vector.

  - type: build
    id: swirl-law
    title: Check the law
    prompt: |
      On the egg-carton surface, the swirl field $\mathcal{Y}$ has components $(\tilde X^1, \tilde X^2) = (-b, a)$ in the chart $\mathscr{X}(a,b,c) = (a,b)$. The polar Jacobian has second row $(-b/r^2,\ a/r^2)$, $r = \sqrt{a^2+b^2}$. Build the polar component $\tilde Y^2 = (\partial\mathscr{Y}^2/\partial\mathscr{X}^j)\,\tilde X^j$.
    prefix: '\tilde Y^2 ='
    tiles: ['-\tfrac{b}{r^2}(-b)', '+', '\tfrac{a}{r^2}\,a', '\tfrac{a}{r}(-b)', '\tfrac{b}{r}\,a']
    answers:
      - ['-\tfrac{b}{r^2}(-b)', '+', '\tfrac{a}{r^2}\,a']
      - ['\tfrac{a}{r^2}\,a', '+', '-\tfrac{b}{r^2}(-b)']
    wrong:
      - answer: ['\tfrac{a}{r}(-b)', '+', '\tfrac{b}{r}\,a']
        feedback: 'That is row $1$ of the Jacobian, which gives the **radial** component $\tilde Y^1 = 0$. The angular component $\tilde Y^2$ uses row $2$, $(-b/r^2, a/r^2)$.'
    hint: 'Row $2$ of the Jacobian, entry by entry, times the components $(-b, a)$.'
    explanation: |
      $$\tilde Y^2 = \frac{b^2}{r^2} + \frac{a^2}{r^2} = 1,$$
      and row $1$ gives $\tilde Y^1 = -\tfrac{ab}{r} + \tfrac{ab}{r} = 0$: the law turns $(-b, a)$ into $(0, 1)$, exactly the components read off the circles.

  - type: text
    id: action
    title: A field eats a scalar field
    body: |
      A velocity eats a function and returns a number. A field does it at every point at once. For $f\in C^\infty(\mathcal{M})$ define the scalar field $\mathcal{X}\lfloor f\rceil\colon\mathcal{M}\to\mathbb{R}$ by
      $$\mathcal{X}\lfloor f\rceil(p) := \mathcal{X}(p)(f),$$
      the derivative of $f$ along the arrow that $\mathcal{X}$ places at $p$. The brackets $\lfloor\ \rceil$ mark this action on functions. Three readings of one object:

      1. **Point first:** $p\mapsto\mathcal{X}(p)\in T_p\mathcal{M}$, a section.
      2. **Function first:** $f\mapsto\mathcal{X}\lfloor f\rceil$, an $\mathbb{R}$-linear map $C^\infty(\mathcal{M})\to C^\infty(\mathcal{M})$.
      3. **Both:** $\mathcal{X}\lfloor f\rceil(p)\in\mathbb{R}$, a number.

      In a chart, expanding $\mathcal{X}(p) = x^i(p)\,(\partial x_i)_p$ gives
      $$\mathcal{X}\lfloor f\rceil(p) = x^i(p)\,\mathtt{x}^p_i,$$
      with $\mathtt{x}^p_i = \partial_i[f\circ\mathscr{X}^{-1}](\mathscr{X}(p))$ the components of $(df)_p$. In particular the component functions are the field acting on the coordinates: $x^i = \mathcal{X}|_\mathcal{U}\lfloor\mathscr{X}^i\rceil$.

  - type: mcq
    id: what-is-number
    title: Function or number?
    multiple: true
    prompt: |
      Let $\mathcal{X}\in\Gamma T\mathcal{M}$ be a smooth vector field, $f\in C^\infty(\mathcal{M})$ a scalar field and $p\in\mathcal{M}$ a point. The action is $\mathcal{X}\lfloor f\rceil(p) := \mathcal{X}(p)(f)$. Which of these are **real numbers**? Select all that apply.
    options:
      - text: '$\mathcal{X}\lfloor f\rceil(p)$'
        correct: true
      - text: '$\mathcal{X}(p)(f)$'
        correct: true
      - text: '$\mathcal{X}\lfloor f\rceil$'
        feedback: |
          No point has been fed yet: $\mathcal{X}\lfloor f\rceil$ is a scalar field, a function $\mathcal{M}\to\mathbb{R}$ that returns the directional derivative of $f$ at every point. Confusing the field with its value at one point is the same slip as confusing $\sin$ with $\sin(1)$.
      - text: '$\mathcal{X}(p)$'
        feedback: |
          $\mathcal{X}(p)$ is a vector, an element of $T_p\mathcal{M}$: it still waits for a function. Only after it eats $f$ does it return a number.
    explanation: |
      $\mathcal{X}\lfloor f\rceil(p) = \mathcal{X}(p)(f)$ is the number where the three readings meet; $\mathcal{X}\lfloor f\rceil$ is a scalar field and $\mathcal{X}(p)$ a vector.

  - type: text
    id: example-action
    title: The fields climb the egg carton
    body: |
      On the egg-carton surface take the scalar field $f(a,b,c) := \cos a\cos b + 1$ (the height). Its chart representative is $f\circ\mathscr{X}^{-1}(\alpha_1,\alpha_2) = \cos\alpha_1\cos\alpha_2 + 1$, so the components of $(df)_p$ at $p = (a, b, c)$ are
      $$(\mathtt{x}^p_1, \mathtt{x}^p_2) = (-\sin a\cos b,\ -\cos a\sin b).$$
      For the vertical field, with components $(0,1)$,
      $$\mathcal{X}\lfloor f\rceil = -\cos a\sin b,$$
      read as a function of $p = (a,b,c)$: a new scalar field, smooth again.

  - type: numeric
    id: xf-value
    title: Climbing or descending?
    prompt: |
      On the egg-carton surface (graph of $h(a,b) = \cos a\cos b + 1$, chart $\mathscr{X}(a,b,c) = (a,b)$), the vertical field $\mathcal{X}$ has components $(0,1)$ and the height $f = \cos a\cos b + 1$ has $(df)_p$-components $(-\sin a\cos b,\ -\cos a\sin b)$. Compute $\mathcal{X}\lfloor f\rceil(p)$ at the point with $a = 0$, $b = \pi/2$.
    answer: -1
    wrong:
      - { value: 1, feedback: 'Check the sign: $\mathcal{X}\lfloor f\rceil = -\cos a\sin b$, and at $a = 0$, $b = \pi/2$ both $\cos a$ and $\sin b$ equal $1$. Along the vertical curve $\lambda\mapsto(0,\lambda)$ the height is $\cos\lambda + 1$, which is going **down** at $\lambda = \pi/2$.' }
      - { value: 0, feedback: 'That is the first component, $-\sin a\cos b$, which is multiplied by $X^1 = 0$. The field has $X^2 = 1$, so it picks the second component, $-\cos a\sin b$.' }
    hint: '$\mathcal{X}\lfloor f\rceil(p) = X^i(p)\,\mathtt{x}^p_i$ with $(X^1, X^2) = (0,1)$.'
    explanation: |
      $$\begin{aligned}\mathcal{X}\lfloor f\rceil(p) &= 0\cdot\mathtt{x}^p_1 + 1\cdot\mathtt{x}^p_2\\ &= -\cos 0\,\sin\tfrac{\pi}{2} = -1.\end{aligned}$$
      Directly: along $\gamma_0(\lambda) = (0, \lambda, h(0,\lambda))$ the height is $\cos\lambda + 1$, with derivative $-\sin\tfrac{\pi}{2} = -1$ at $\lambda = \pi/2$. The vertical field descends there.

  - type: numeric
    id: yf-value
    title: The swirl on the height
    prompt: |
      On the egg-carton surface (chart $\mathscr{X}(a,b,c) = (a,b)$), the swirl field $\mathcal{Y}$ has components $(-b, a)$, and the height $f = \cos a\cos b + 1$ has $(df)_p$-components $(-\sin a\cos b,\ -\cos a\sin b)$. Compute $\mathcal{Y}\lfloor f\rceil(p)$ at the point with $a = \pi$, $b = \pi/2$.
    answer: 3.14159265
    tolerance: 0.01
    answerText: 'π ≈ 3.1416'
    wrong:
      - { value: -3.14159265, feedback: 'Watch the signs: $\cos\pi = -1$, so $\mathtt{x}^p_2 = -\cos\pi\sin\tfrac{\pi}{2} = +1$, and the second component of $\mathcal{Y}$ is $a = \pi$. The product is $+\pi$.' }
      - { value: -1.57079633, feedback: 'That is $-b = -\pi/2$, the first component of $\mathcal{Y}$, times $1$. But the first $(df)_p$-component is $-\sin\pi\cos\tfrac{\pi}{2} = 0$, so that term vanishes; the second, $a\cdot\mathtt{x}^p_2 = \pi\cdot 1$, survives.' }
      - { value: 0, feedback: 'Only the first term vanishes ($\sin\pi = 0$). The second is $a\cdot(-\cos a\sin b) = \pi\cdot 1$.' }
    hint: 'First compute $(\mathtt{x}^p_1, \mathtt{x}^p_2)$ at $a = \pi$, $b = \pi/2$, then pair with $(-b, a) = (-\pi/2, \pi)$.'
    explanation: |
      $(\mathtt{x}^p_1, \mathtt{x}^p_2) = (-\sin\pi\cos\tfrac{\pi}{2},\ -\cos\pi\sin\tfrac{\pi}{2}) = (0, 1)$, so
      $$\mathcal{Y}\lfloor f\rceil(p) = -\tfrac{\pi}{2}\cdot 0 + \pi\cdot 1 = \pi.$$
      As a function, $\mathcal{Y}\lfloor f\rceil = b\sin a\cos b - a\cos a\sin b$.

  - type: mcq
    id: yf-polar
    title: The same action in the polar chart
    prompt: |
      On the egg-carton surface, the swirl $\mathcal{Y}$ has components $(-b, a)$ in the chart $\mathscr{X}(a,b,c) = (a,b)$ and $(0,1)$ in the polar chart $\mathscr{Y} = (r, \theta)$. In the chart $\mathscr{X}$ one finds $\mathcal{Y}\lfloor f\rceil = b\sin a\cos b - a\cos a\sin b$ for the height $f = \cos a\cos b + 1$. In the polar chart, $\mathcal{Y}\lfloor f\rceil(p) = 0\cdot\mathtt{y}^p_1 + 1\cdot\mathtt{y}^p_2$, where $\mathtt{y}^p_2 = \partial_\theta[f\circ\mathscr{Y}^{-1}]$ and $f\circ\mathscr{Y}^{-1}(r,\theta) = \cos(r\cos\theta)\cos(r\sin\theta) + 1$. What does the polar computation give on $\mathcal{V}$?
    options:
      - text: 'The same function $b\sin a\cos b - a\cos a\sin b$, now obtained as a $\theta$-derivative'
        correct: true
      - text: 'A different function: the components $(0,1)$ and $(-b, a)$ differ, so the results must differ'
        feedback: |
          Components differ, but so do the components of $(df)_p$, and in the opposite way (contravariant against covariant), so the pairing $\tilde Y^i\,\mathtt{y}^p_i = \tilde X^i\,\mathtt{x}^p_i$ is chart independent. Here: $\partial_\theta\cos(r\cos\theta) = r\sin\theta\,\sin(r\cos\theta) = b\sin a$ and $\partial_\theta\cos(r\sin\theta) = -r\cos\theta\,\sin(r\sin\theta) = -a\sin b$.
      - text: '$0$: in the polar chart the swirl has no radial component, so it cannot change the height'
        feedback: |
          The swirl moves along circles, and the height of the egg carton changes along a circle (it is not rotationally symmetric). Zero radial component kills only the $\mathtt{y}^p_1$ term; the $\theta$-derivative of the height remains.
    explanation: |
      By the product rule, with $a = r\cos\theta$, $b = r\sin\theta$:
      $$\begin{aligned}\partial_\theta[f\circ\mathscr{Y}^{-1}] &= b\sin a\cos b\\ &\quad - a\cos a\sin b,\end{aligned}$$
      the same scalar field: $\mathcal{Y}\lfloor f\rceil(p) = \mathcal{Y}(p)(f)$ never mentioned a chart.

  - type: mcq
    id: trap-radial
    title: 'Trap: a basis field beyond its chart'
    prompt: |
      On the egg-carton surface, the polar chart $\mathscr{Y} = (r,\theta)$ is defined on $\mathcal{V}$: everything except the points with $a\le 0$, $b = 0$ (so the origin is excluded). Its basis field $\partial y_2$ coincides on $\mathcal{V}$ with the swirl $\mathcal{Y}$, which extends smoothly to all of $\mathcal{M}$ with components $(-b,a)$. The other basis field $\partial y_1 = \partial/\partial r$ has components $(a/r,\ b/r)$ in the chart $\mathscr{X}(a,b,c) = (a,b)$. Does $\partial y_1$ extend to a smooth vector field on all of $\mathcal{M}$?
    options:
      - text: 'No: near the origin $(a/r, b/r)$ points straight away from it, in every direction at once, so no value at the origin makes it even continuous'
        correct: true
      - text: 'Yes, like $\partial y_2$: every chart-induced basis field extends once you rewrite it in another chart'
        feedback: |
          $\partial y_2$ was lucky: its components $(-b, a)$ happen to be polynomials. A basis field is defined only on its chart's domain, and whether it extends is a separate question. For $\partial y_1$, approaching the origin along $b = 0$, $a > 0$ gives $(1,0)$, along $a = 0$, $b > 0$ gives $(0,1)$: no single vector at the origin fits.
      - text: 'Only the cut is a problem: it extends to $\mathcal{M}$ minus the origin, and setting it to $0$ at the origin finishes the job'
        feedback: |
          The first half is right: $(a/r, b/r)$ is smooth across the half-line $a < 0$, $b = 0$. But setting the value $0$ at the origin does not help: nearby arrows have components of size $1$ ($(a/r)^2 + (b/r)^2 = 1$), so the field would jump.
    explanation: |
      A field built from chart basis fields lives, a priori, only on that chart's domain. Some extend ($\partial y_2$, as the swirl), some do not ($\partial y_1$ at the origin). Even the extension of $\partial y_2$ is no longer a basis field there: at the origin it is the zero vector.

  - type: mcq
    id: trap-basis
    title: 'Trap: where do two fields span?'
    prompt: |
      On the egg-carton surface, in the chart $\mathscr{X}(a,b,c) = (a,b)$, the vertical field $\mathcal{X}$ has components $(0,1)$ and the swirl $\mathcal{Y}$ has components $(-b, a)$. The swirl vanishes at the origin. At which points $p$ do $\mathcal{X}(p)$ and $\mathcal{Y}(p)$ **fail** to be a basis of $T_p\mathcal{M}$?
    options:
      - text: 'On the whole line $b = 0$, not just at the origin'
        correct: true
      - text: 'Only at the origin, where $\mathcal{Y}$ is zero'
        feedback: |
          The origin is the obvious failure, but not the only one. Two vectors in a $2$-dimensional space fail to be a basis when they are parallel: the determinant of the component columns, $0\cdot a - 1\cdot(-b) = b$, vanishes on all of $b = 0$. There $\mathcal{Y} = a\,\partial x_2$ is parallel to $\mathcal{X} = \partial x_2$.
      - text: 'Nowhere: two smooth vector fields with different component functions are always independent'
        feedback: |
          Different **functions** can still give parallel **vectors** at particular points. Independence is a pointwise question: at $p$ compare the two vectors in $T_p\mathcal{M}$. At $(a, 0)$: $\mathcal{X} = (0,1)$ and $\mathcal{Y} = (0, a)$, parallel.
    explanation: |
      $\det\begin{pmatrix}0 & -b\\ 1 & a\end{pmatrix} = b$, so the two fields give a basis exactly off the line $b = 0$. Whether $d$ fields give a basis at **every** point is a global question, and the answer can be no for any choice: that is the theme of the next lessons.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Next:** the same construction one floor up. Gluing all the cotangent spaces $T_p^*\mathcal{M}$ gives the **cotangent bundle**, and its sections are **covector fields**, such as the differential $df$ of a scalar field, at every point at once.
