        title: "Stationary Time Series and Linear Systems"
        kind: concept
        summary: 'Spectra and transfer functions as points of a manifold.'
      - id: ch10-manifolds
        title: "Finite-Dimensional System Manifolds"
        kind: concept
        summary: 'AR, MA and ARMA families.'
      - id: ch10-dual
        title: "Dual Geometry of the System Manifold"
        kind: concept
        summary: 'e- and m-connections on systems.'
      - id: ch10-arma
        title: "Geometry of AR, MA and ARMA"
        kind: guided
        summary: 'Worked projections between model orders.'
      - id: ch10-traps
        title: "Traps: Time Series"
        kind: traps
        summary: 'Fast questions on spectra and model orders.'
      - id: ch10-map
        title: "Content Map"
