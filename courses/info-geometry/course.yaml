# The trail. One level per book chapter, lessons in trail order.
#
# A lesson entry with `file:` is built and playable; without it, it shows as
# a planned (greyed) node. `kind` is concept | guided | traps | intuition, plus
# the end-of-level kinds: map (content-map puzzle), review (automatic, no file:
# practises only this level's questions) and challenge (mixed problems).
# Exams: own levels exam-partial (after Level 7) and exam-final (after Level 13).

title: Information Geometry and Its Applications

levels:
  - id: ch01
    number: 1
    title: "Manifold, Divergence and Dually Flat Structure"
    blurb: 'From points on a curved set of probabilities to a divergence, a Legendre pair of coordinates and a Pythagorean theorem.'
    lessons:
      - id: ch01-why
        title: "Why Geometry of Probabilities?"
        kind: concept
        file: ch01/why.yaml
        summary: 'A light tour: why the set of distributions is a space, what distance between two beliefs could mean, and what the course builds.'
      - id: ch01-manifold
        title: "Manifolds and Coordinates"
        kind: concept
        file: ch01/manifold.yaml
        summary: 'A manifold as a set with coordinates; the same set, many coordinate systems; examples such as the Gaussians and the simplex.'
      - id: ch01-divergence
        title: "Divergence Between Two Points"
        kind: concept
        file: ch01/divergence.yaml
        summary: 'Why a distance between distributions need not be symmetric: the definition of a divergence, squared distance, KL and examples.'
      - id: ch01-bregman
        title: "Convex Functions and Bregman Divergence"
        kind: concept
        file: ch01/bregman.yaml
        summary: 'A convex potential generates a divergence: the gap between the function and its tangent.'
      - id: ch01-legendre
        title: "The Legendre Transformation"
        kind: concept
        file: ch01/legendre.yaml
        summary: 'Two dual coordinate systems and two dual potentials, and why the pair undoes itself.'
      - id: ch01-dually-flat
        title: "Dually Flat Structure"
        kind: concept
        summary: 'Affine and dual affine coordinates, the metric as a Hessian, dual bases and parallel transport.'
      - id: ch01-pythagoras
        title: "Generalized Pythagorean and Projection Theorems"
        kind: concept
        summary: 'When divergences add like squared lengths, and why the projection onto a flat submanifold is the closest point.'
      - id: ch01-proof-pythagoras
        title: "Proof of the Pythagorean Theorem"
        kind: guided
        summary: 'Derive the three-point identity and the Pythagorean theorem step by step.'
      - id: ch01-alternating
        title: "Divergence Between Submanifolds"
        kind: guided
        summary: 'Alternating minimization between two flat submanifolds, a worked case.'
      - id: ch01-map
        title: "Content Map"
        kind: map
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch01-review, title: Level Review, kind: review }
      - id: ch01-challenge
        title: Level Challenge
        kind: challenge
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch02
    number: 2
    title: "Exponential Families and Mixture Families"
    blurb: 'Probability families with a built-in dually flat geometry, and what the Pythagorean theorem buys in statistics.'
    lessons:
      - id: ch02-exp-family
        title: "Exponential Families"
        kind: concept
        summary: 'Natural parameters, the potential and its role as a Bregman generator.'
      - id: ch02-examples
        title: "Gaussian and Discrete Examples"
        kind: concept
        summary: 'The Gaussian and the discrete distribution written as exponential families, with their dual coordinates.'
      - id: ch02-mixture
        title: "Mixture Families and e-flat, m-flat"
        kind: concept
        summary: 'Mixtures versus exponentials: two kinds of straight lines on the same manifold.'
      - id: ch02-kernel
        title: "Kernel Exponential Family and Infinite Dimensions"
        kind: concept
        summary: 'What survives when the manifold has infinitely many coordinates.'
      - id: ch02-applications
        title: "Applications of the Pythagorean Theorem"
        kind: guided
        summary: 'Maximum entropy, mutual information and maximum likelihood as projections.'
      - id: ch02-traps
        title: "Traps: Exponential and Mixture Families"
        kind: traps
        summary: 'Common confusions between e- and m-flat, natural and expectation parameters.'
      - id: ch02-map
        title: "Content Map"
        kind: map
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch02-review, title: Level Review, kind: review }
      - id: ch02-challenge
        title: Level Challenge
        kind: challenge
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch03
    number: 3
    title: "Invariant Geometry of Probability Distributions"
    blurb: 'Why Fisher information and the KL divergence are singled out when statistics must not depend on how data are coarse-grained.'
    lessons:
      - id: ch03-invariance
        title: "Invariance and Information Monotonicity"
        kind: concept
        summary: 'Coarse graining, sufficient statistics and the invariance criterion.'
      - id: ch03-f-div
        title: "f-Divergences"
        kind: concept
        summary: 'The family of invariant divergences: KL, chi-square, alpha-divergence.'
      - id: ch03-properties
        title: "Properties of f-Divergence and KL"
        kind: guided
        summary: 'Monotonicity, convexity and the KL identities, proved step by step.'
      - id: ch03-fisher
        title: "Fisher Information: the Unique Invariant Metric"
        kind: concept
        summary: 'Why the Fisher metric is forced, and the cubic tensor beside it.'
      - id: ch03-positive
        title: "Positive Measures"
        kind: concept
        summary: 'f-divergence beyond normalization.'
      - id: ch03-traps
        title: "Traps: Invariance and Divergences"
        kind: traps
        summary: 'Fast questions on symmetry, invariance and what Fisher information measures.'
      - id: ch03-map
        title: "Content Map"
        kind: map
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch03-review, title: Level Review, kind: review }
      - id: ch03-challenge
        title: Level Challenge
        kind: challenge
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch04
    number: 4
    title: "Alpha-Geometry, Tsallis Entropy and Positive-Definite Matrices"
    blurb: 'A one-parameter family of geometries, deformed exponentials, and flat divergences on matrices.'
    lessons:
      - id: ch04-uniqueness
        title: "Invariant and Flat Divergence: KL is Unique"
        kind: concept
        summary: 'When invariance and flatness together force KL, and the alpha case on positive measures.'
      - id: ch04-alpha-geometry
        title: "Alpha-Geodesics and Alpha-Projection"
        kind: concept
        summary: 'Alpha-geodesics, the alpha-Pythagorean theorem and projection.'
      - id: ch04-alpha-mean
        title: "Alpha-Mean and Alpha-Integration"
        kind: concept
        summary: 'Averaging beliefs and experts through the alpha-mean.'
      - id: ch04-tsallis
        title: "Tsallis q-Entropy and Deformed Exponentials"
        kind: concept
        summary: 'q-logarithm, q-exponential family and the escort geometry.'
      - id: ch04-uv
        title: "(u,v)-Divergence and Matrix Divergences"
        kind: concept
        summary: 'Flat divergences on positive vectors and invariant ones on positive-definite matrices.'
      - id: ch04-misc
        title: "Miscellaneous Divergences"
        kind: concept
        summary: 'gamma-, Jensen-Shannon and related divergences.'
      - id: ch04-traps
        title: "Traps: Alpha-Geometry"
        kind: traps
        summary: 'Fast questions on alpha, duality and q-deformation.'
      - id: ch04-intuition
        title: "Intuition: Divergences at a Glance"
        kind: intuition
        summary: 'Quick recall of the main divergence formulas of Levels 1 to 4.'
      - id: ch04-map
        title: "Content Map"
        kind: map
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch04-review, title: Level Review, kind: review }
      - id: ch04-challenge
        title: Level Challenge
        kind: challenge
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch05
