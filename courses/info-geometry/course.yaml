      - id: ch07-first-order
        title: "First-Order Asymptotics"
        kind: concept
        summary: 'Efficiency, the Cramer-Rao bound and the Fisher information.'
      - id: ch07-higher-order
        title: "Higher-Order Asymptotics"
        kind: concept
        summary: 'Curvature terms in the error of an estimator.'
      - id: ch07-testing
        title: "Asymptotic Theory of Hypothesis Testing"
        kind: concept
        summary: 'Error exponents and divergence.'
      - id: ch07-traps
        title: "Traps: Asymptotic Inference"
        kind: traps
        summary: 'Fast questions on bias, efficiency and projections.'
      - id: ch07-map
        title: "Content Map"
        kind: map
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch07-review, title: Level Review, kind: review }
      - id: ch07-challenge
        title: Level Challenge
        kind: challenge
        summary: 'Harder problems that combine the level''s concepts.'

