      - id: ch06-tensor
        title: "Metric and Cubic Tensor from Divergence"
        kind: guided
        summary: 'Read the metric and the cubic tensor from the expansion of a divergence.'
      - id: ch06-dually-flat
        title: "Dually Flat Manifold and Canonical Divergence"
        kind: concept
        summary: 'Flatness of both connections and the canonical divergence.'
      - id: ch06-foliation
        title: "Dual Foliations and Mixed Coordinates"
        kind: concept
        summary: 'Mixed coordinates and the decomposition of divergence.'
      - id: ch06-neurons
        title: "Neural Firing and Spike Interactions"
        kind: guided
        summary: 'Higher-order interactions of spikes, worked.'
      - id: ch06-iit
        title: "System Complexity and Integrated Information"
        kind: concept
        summary: 'Integrated information as a divergence from a split model.'
      - id: ch06-io
        title: "Input-Output Analysis in Economics"
        kind: concept
        summary: 'A dual-geometry view of the input-output tables.'
      - id: ch06-traps
        title: "Traps: Dual Geometry"
        kind: traps
        summary: 'Fast questions on duality and flatness.'
      - id: ch06-intuition
        title: "Intuition: Dual Geometry at a Glance"
        kind: intuition
        summary: 'Quick recall of the main duality formulas.'
      - id: ch06-map
        title: "Content Map"
        kind: map
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch06-review, title: Level Review, kind: review }
      - id: ch06-challenge
        title: Level Challenge
        kind: challenge
        summary: 'Harder problems that combine the level''s concepts.'

