      - id: ch09-estimating
        title: "Estimating Functions"
        kind: concept
        summary: 'Unbiased estimating equations and their information-geometric meaning.'
      - id: ch09-semipar
        title: "Information Geometry of Estimating Functions"
        kind: concept
        summary: 'Tangent spaces and the efficient estimating function.'
      - id: ch09-solutions
