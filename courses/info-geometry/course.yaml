        title: "Manifold and Tangent Space"
        kind: concept
        summary: 'Tangent vectors and bases on a manifold.'
      - id: ch05-metric
        title: "Riemannian Metric"
        kind: concept
        summary: 'Length, angle and the metric tensor.'
      - id: ch05-connection
        title: "Affine Connection and Covariant Derivative"
        kind: concept
        summary: 'How to compare vectors at different points, tensors and the covariant derivative.'
      - id: ch05-geodesic
        title: "Geodesics and Parallel Transport"
        kind: concept
        summary: 'Straight lines and transport along curves.'
      - id: ch05-curvature
        title: "Riemann-Christoffel Curvature"
        kind: concept
        summary: 'Round-the-world transport and flatness.'
      - id: ch05-levi-civita
        title: "Levi-Civita Connection"
        kind: guided
        summary: 'Derive the metric connection from compatibility with the metric.'
      - id: ch05-embedding
        title: "Submanifolds and Embedding Curvature"
        kind: concept
        summary: 'How a submanifold sits inside a manifold.'
      - id: ch05-traps
        title: "Traps: Differential Geometry"
        kind: traps
        summary: 'Fast questions on connections, curvature and tensors.'
      - id: ch05-map
        title: "Content Map"
        kind: map
        summary: 'Rebuild the chapter''s concept map box by box among look-alike decoys.'
      - { id: ch05-review, title: Level Review, kind: review }
      - id: ch05-challenge
        title: Level Challenge
        kind: challenge
        summary: 'Harder problems that combine the level''s concepts.'

  - id: ch06
