    body: |
      Beliefs over three outcomes $a,b,c$. $K$ is a **finite segment** of a mixture line and $S$ is a closed **arc** (a circle of beliefs). They cross. We look for the closest pair $P\in K$, $Q\in S$ for $D[P:Q]$, starting from the marked belief $Q_0$ on $S$ and alternating the two projections. **Guess:** does the zigzag necessarily end at a crossing of $K$ and $S$?

  - type: numeric
    id: p5-step
    tag: Problem 5 · Alternating minimization
    prompt: |
      In alternating minimization the belief $P_t=(0.3,0.2,0.5)$ of $K$ is frozen, and the next belief is $Q_{t+1}=\arg\min_{Q\in S}D[P_t:Q]$, with $D[A:B]=\sum_iA_i\ln(A_i/B_i)$. Here $S$ is the mixture line $q_3=0.2$, so $Q=(q_1,\,0.8-q_1,\,0.2)$. Find $q_1$ at the minimum.
    answer: 0.48
    tolerance: 0.002
    hint: |
      Only the terms with $Q$ matter: minimize $-0.3\ln q_1-0.2\ln(0.8-q_1)$. Set the derivative to $0$: $\frac{0.3}{q_1}=\frac{0.2}{0.8-q_1}$.
    wrong:
      - { value: 0.3, feedback: 'That copies $P_1$. The free components of $Q$ must add up to $0.8$, not $0.5$, so they are rescaled.' }
      - { value: 0.4, feedback: 'That splits $0.8$ equally. The minimizer keeps the ratio $P_1:P_2=3:2$, not $1:1$.' }
    explanation: |
      The free components keep the ratio of $P_t$: $q_1:q_2=0.3:0.2$ with $q_1+q_2=0.8$, so
      $$q_1=0.8\cdot\tfrac35=0.48,\qquad q_2=0.32 .$$
      This is the mixture projection of $P_t$ onto $S$. The divergence is $D[P_t:Q_{t+1}]=0.2231$.

  - type: order
    id: p5-loop
    tag: Problem 5 · Alternating minimization
    prompt: Put the alternating minimization of $D[P:Q]$ over $P\in K$ and $Q\in S$ in order.
    steps:
      - 'Start from a belief $Q_0\in S$.'
      - 'Freeze $Q_t$ and set $P_t=\arg\min_{P\in K}D[P:Q_t]$.'
      - 'Freeze $P_t$ and set $Q_{t+1}=\arg\min_{Q\in S}D[P_t:Q]$.'
      - 'Each step cannot increase $D$; repeat until $D$ stops decreasing.'
    hint: 'First slot free for $K$, then second slot free for $S$.'
    explanation: |
      The two projections alternate and each one minimizes over a set that contains the previous point, so $D[P_{t-1}:Q_t]\ge D[P_t:Q_t]\ge D[P_t:Q_{t+1}]\ge0$. A non-increasing sequence bounded below converges.

  - type: mcq
    id: p5-local
    tag: Problem 5 · Alternating minimization
    prompt: |
      Alternating minimization between two sets $K$ and $S$ of beliefs never increases $D[P:Q]$. When $K$ is a short segment and $S$ an arc that crosses it, the algorithm can stop at $D\approx0.0040$ although a crossing has $D=0$. Why is that possible?
    options:
      - text: 'Each step only finds the best point for one frozen argument; the limit is a point where neither projection can improve, and that need not be the global minimum of $D$ over the pair.'
        correct: true
      - text: 'Because $D$ may increase at some step, so the sequence can leave the minimum.'
        feedback: |
          $D$ never increases: each step minimizes over a set containing the previous point. The sequence settles down, but settling does not mean reaching the lowest value.
      - text: 'Because $D[P:Q]$ is zero only when $P$ and $Q$ are far apart.'
        feedback: |
          Reversed: $D[P:Q]=0$ exactly when $P=Q$, so a crossing has $D=0$.
      - text: 'Because the KL divergence is symmetric, so the two projections cancel.'
        feedback: |
          $D$ is not symmetric, and the two projections use different slots. Nothing cancels.
    explanation: |
      Uniqueness of the limit needs structure: one set flat and the other dual flat, so that both projections are unique and the pair has a single minimum. Here the segment ends and the arc curves, so a limit can sit at the end of the segment, a **local** minimum. Another start reaches the crossing.

  - type: numeric
    id: p5-stuck
    tag: Problem 5 · Alternating minimization
    prompt: |
      Alternating minimization of $D[P:Q]$ between a finite segment $K$ and an arc $S$ that cross. From one start the values go $0.0643,\,0.0199,\,0.0120,\,0.0048,\,0.0040,\,0.0040$ and stop at $0.00397$. From another start they go $0.00035,\,0.00002,\dots$ and reach the crossing. What is $D[K:S]=\min_{P\in K,\,Q\in S}D[P:Q]$ for this pair?
    answer: 0
    tolerance: 0.0001
    wrong:
      - { value: 0.0040, feedback: 'That is where the first start got stuck, an upper bound only. The crossing belongs to both sets, so $P=Q$ there and $D=0$.' }
    explanation: |
      $D[K:S]=0$, attained at the crossing $(0.543,0.380,0.076)$, since $D\ge0$ with equality iff $P=Q$. The first run's end value $0.0040$ is only a local minimum. The run ended $0.0643-0.0040=0.0603$ below its first value, yet $0.0040$ above the true minimum.

  - type: text
    id: summary
    title: What you now own
    body: |
      **Metric.** On a convex potential $\psi(\xi)$, $\xi=(\xi_1,\dots,\xi_n)$, the metric matrix and its dual are
      $$G=\big(\partial_i\partial_j\psi\big),\qquad G^*=G^{-1},$$
      with $ds^2=g_{ij}\,d\xi^id\xi^j=2D$ (indices up, summed when repeated, as in the dually flat lesson).

      **Dual coordinates.** With $\xi^*=\nabla\psi(\xi)$ and
      $$\psi^*(\xi^*)=\xi\cdot\xi^*-\psi(\xi),$$
      the divergence has three forms (Bregman, Legendre, dual Bregman):
      $$\begin{aligned}D[P:Q]&=\psi(\xi_P)-\psi(\xi_Q)\\&\quad-\xi^*_Q\cdot(\xi_P-\xi_Q)\\&=\psi(\xi_P)+\psi^*(\xi^*_Q)\\&\quad-\xi_P\cdot\xi^*_Q\\&=D_{\psi^*}[Q:P] .\end{aligned}$$

      **Geodesic and dual geodesic.** The geodesic is straight in $\xi$, the dual geodesic is straight in $\xi^*$:
      $$\xi(t)=at+b,\qquad \xi^*(t)=at+b .$$
      On the simplex of beliefs $p=(p_1,p_2,p_3)$ with the negentropy potential, $\psi=\sum_ip_i\ln p_i-p_i$, $\xi=p$ and $\xi^*=\ln p$ (up to a shift common to all components): the geodesic is a **mixture** path, the dual geodesic an **exponential** path.

      **Pythagoras.** If the dual geodesic $PQ$ is perpendicular to the geodesic $QR$ at $Q$,
      $$D[R:P]=D[Q:P]+D[R:Q],$$
      and if the geodesic $PQ$ is perpendicular to the dual geodesic $QR$,
      $$D[P:R]=D[P:Q]+D[Q:R].$$
      The foot of the projection onto a flat set minimizes the divergence.

      **Alternating minimization** of $D[P:Q]$ over $P\in K$, $Q\in S$:
      $$\begin{aligned}P_t&=\arg\min_{P\in K}D[P:Q_t],\\Q_{t+1}&=\arg\min_{Q\in S}D[P_t:Q],\end{aligned}$$
      with $D$ never increasing; the limit is the closest pair when the first set $K$ is flat and the second set $S$ is dual flat, and only a local minimum in general.

      **Next:** the families of distributions that realize these straight curves, **exponential families and mixture families**, and the dual coordinates they give.
