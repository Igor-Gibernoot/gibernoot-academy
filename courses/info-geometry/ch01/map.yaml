outroTitle: Level 1 in one picture
outro: |
  A divergence $D[P:Q]$ is a squared-distance-like gap between points of a manifold; its short-range form gives the metric, $ds^2=2D$.

  A convex potential $\psi$ makes a Bregman divergence, and its Legendre transform $\psi^*$ gives the dual coordinates $\xi^*=\nabla\psi(\xi)$. Together they make a dually flat space: geodesics straight in $\xi$, dual geodesics straight in $\xi^*$, metrics $\mathbf G$ and $\mathbf G^*=\mathbf G^{-1}$.

  There, a dual geodesic orthogonal to a geodesic gives
  $$D[R:P]=D[Q:P]+D[R:Q],$$
  hence a unique projection onto a flat set, and alternating projections between a flat and a dual flat set converge to $D[K:S]$.
