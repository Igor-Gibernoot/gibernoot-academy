id: exam-partial2
title: Partial Exam 2
kind: exam

# Exam lesson (js/exam.js). Original exam (no professor's exam): all numbers checked by script (twice).
# Covers Levels 8 to 13. Five questions of 2 points; every question restates what it needs.

minutes: 60

rules: |
  This is **Partial Exam 2** on Levels 8 to 13: the nature of God, science and religion, consciousness, altered states, religious experience, and why humans believe.

  - **One hour**, **10 points**, 5 questions of 2 points each. The bar at the top counts the time down; when it ends, the exam is submitted for you.
  - **No feedback while you work.** Pick or type an answer and press *Next*. You can go back and change any answer until you submit.
  - Each card shows its points. Some questions let you select **all** that apply; read the card.
  - At the end, a submit slide shows which questions are still empty. **Unanswered questions count as wrong.**
  - After submitting you get your score and a **review** of every card: your answer, the correct one, why each tempting wrong answer fails, and the explanation.
  - Work on **paper first** and keep your notes closed. Numeric answers may be typed as decimals or fractions; three decimals are enough unless the card says otherwise.
  - The exam never asks you to say which side is right about God, mind or religion. It asks what a view assumes, what a number shows, and what a claim must pay for.

  The setting (a summer school) is the first card. Every question restates what it needs.

debrief: |
  Use the review to see where points went. The skills behind the five questions (2 points each):

  - **God, time, science and miracles** (Q1): the Lorentz time formula $t_B=\gamma(\tau-ua)$ and the relativity of "now", the difference between pantheism ($G=W$), panentheism ($W\subsetneq G$) and classical theism ($G\neq W$), the odds form of Bayes' rule with $n$ independent witnesses,
    $$\text{posterior odds}=\left(\frac{P(E\mid M)}{q}\right)^{\!n}\cdot\text{prior odds},$$
    and the difference between epistemic and ontological openness in divine action.
  - **Mind and altered states** (Q2): a toy integration score (smallest number of links crossing a split), the zombie argument and which premise a reply attacks, the standard error of an effect size $d$, and choosing the right denominator for a rate.
  - **Experience** (Q3): the $z$ statistic $z=(\hat p-p_0)/\sqrt{p_0(1-p_0)/n}$, the multiple-tests inflation $1-0.95^k$, a brain explanation as a likelihood ratio, and the common core versus interpretation in the study of mysticism.
  - **Why humans believe** (Q4): the break-even $p^*=C_{\text{alarm}}/(C_{\text{alarm}}+C_{\text{miss}})$, the public-goods free rider, what a debunking argument can and cannot show, and the margin of error $1.96\sqrt{p(1-p)/n}$, which covers sampling only.
  - **Weighing a claim** (Q5): the steps of an odds calculation, the three layers (established fact, live debate, faith commitment), a shared flaw that caps the likelihood ratio near $1/c$, and why equal evidence can leave different people far apart.

  **Next:** the course turns from ideas about God and belief to the traditions themselves, beginning with Judaism and the Torah: how the Hebrew Bible was made and how it has been read.

cards:
  - type: text
    id: setting
    title: The setting, the Ardenne Summer School
    body: |
      The **Ardenne Summer School** runs five sessions in one week: a seminar on the nature of God, a debate on science and religion, a lab visit on consciousness, a workshop on mystical experience, and a field talk on why humans believe.

      The questions are independent. **Every question restates what it needs.** Probabilities are given as decimals; "odds" means the probability of a hypothesis divided by the probability of its rival. Where a question describes someone's view, it is described *according to* that person: the exam asks what follows from it, not whether it is true. All people, villages, studies and numbers in the questions are invented for the exam.

  # ------------------------------------------------------------- Question 1
  - type: numeric
    id: q1-time
    points: 0.5
    tag: Question 1 · The nature of God and time
    title: (a) Whose "now"?
    prompt: |
      A speaker argues that if God is "in time", God needs one privileged "now". To test it, use units where light travels one unit of distance per unit of time. Alice is at rest. Bob moves along the line joining them at speed $u=0.8$ relative to Alice, so $\gamma = 1/\sqrt{1-u^2}$.

      An event $E$ happens at distance $a=5$ from Alice and at Alice's time $\tau=2$. Bob's clock agrees with Alice's at the origin. Using $t_B=\gamma(\tau-ua)$, what time does Bob assign to $E$? (Three decimals.)
    answer: -3.333
    tolerance: 0.005
    answerText: '-10/3 ≈ -3.333'
    wrong:
      - value: 3.333
        feedback: |
          The magnitude is right but the sign matters. $\tau-ua = 2-4 = -2$ is negative, so Bob dates $E$ **before** the moment his clock reads zero.
      - value: -2
        feedback: |
          This is $\tau-ua$ without the factor $\gamma = 5/3$. The formula multiplies by $\gamma$.
      - value: 10
        feedback: |
          This uses $\tau+ua$. The sign in the formula is minus: the term $ua$ shifts Bob's time of a distant event the opposite way to Alice's.
    explanation: |
      With $u=0.8$, $\gamma = 1/\sqrt{1-0.64} = 5/3$. Then $ua = 0.8\times5 = 4$, so
      $$t_B=\gamma(\tau-ua)=\tfrac53\,(2-4)=-\tfrac{10}{3}\approx-3.333.$$
      The event is later than the origin for Alice ($\tau=2$) but earlier for Bob. Since $a>\tau$ (the event is spacelike separated from the origin), observers in relative motion disagree about the order. This is why many thinkers hold that no single "now" is built into physics, and why the eternal-versus-everlasting debate meets relativity.

  - type: mcq
    id: q1-panen
    points: 0.5
    multiple: true
    tag: Question 1 · The nature of God and time
    title: (b) Panentheism
    prompt: |
      Let $G$ be God and $W$ the world (everything in the universe). Pantheism says $G=W$, classical theism says $G\neq W$ with $G$ distinct from and not contained in $W$, and **panentheism** says $W\subsetneq G$ (the world is inside God, and God is more than the world). **Select all** statements that a panentheist, in this sense, accepts.
    options:
      - text: Everything in the world is in God.
        correct: true
      - text: God is not identical to the world, because something of God lies beyond it.
        correct: true
      - text: God and the world are one and the same thing, with nothing of God beyond the world.
        feedback: |
          That is pantheism, $G=W$. Panentheism keeps the "pan" (all in God) but adds the "en" (in) with a remainder: God exceeds the world.
      - text: The world is wholly outside God, a separate creation that God does not contain.
        feedback: |
          That is the classical picture, $G\neq W$ with the world outside God. A panentheist says the opposite about containment.
      - text: God is a part of the world, and nothing of the world lies beyond God.
        feedback: |
          This reverses the inclusion. Panentheism has $W\subsetneq G$, the world is the part, God the whole.
    explanation: |
      The three positions differ in one relation. Pantheism: $G=W$. Panentheism: $W\subsetneq G$, so the world is in God and God exceeds it, which makes $G\neq W$ true as well. Classical theism: the world is distinct from God and not contained in God. Defenders of panentheism read "in" in several ways (dependence, mind and body, part and whole), so the label alone does not fix the view.

  - type: numeric
    id: q1-miracle
    points: 0.6
    tag: Question 1 · Science, religion and miracles
    title: (c) Three witnesses
    prompt: |
      At the debate, a speaker reports a miracle $M$ at a shrine. Her prior is $P(M)=10^{-6}$. Each witness reports it ($E_i$) with probability $P(E_i\mid M)=0.8$ if it happened, and with probability $q=P(E_i\mid\neg M)=0.01$ if it did not (mistake, exaggeration or invention). Given the state of the world, the witnesses are independent.

      Three witnesses report it. What is $P(M\mid E_1,E_2,E_3)$? (Three decimals.)
    answer: 0.339
    tolerance: 0.002
    answerText: '0.512/1.512 ≈ 0.339'
    wrong:
      - value: 0.512
        feedback: |
          $0.512$ are the posterior **odds**, not a probability. Convert with $p=\text{odds}/(1+\text{odds})$.
      - value: 0.5
        feedback: |
          This takes $P(E_i\mid M)=1$, so each witness multiplies the odds by $100$ and the odds become $1$. Here each witness is only $0.8/0.01=80$ times more likely under $M$.
      - value: 0.8
        feedback: |
          $0.8$ is the likelihood $P(E_i\mid M)$ for one witness, not the probability of the miracle given the reports.
    explanation: |
      Each witness has likelihood ratio $0.8/0.01=80$, and independence lets the ratios multiply: $80^3=512{,}000$. Prior odds are about $10^{-6}$, so
      $$\text{posterior odds}=512{,}000\times10^{-6}=0.512,$$
      $$P=\frac{0.512}{1.512}\approx0.339.$$
      Three independent witnesses move a one-in-a-million claim to about one in three, not to certainty. The result depends on the prior and on the independence of the witnesses, which is where the believer and the skeptic disagree.

  - type: mcq
    id: q1-action
    points: 0.4
    tag: Question 1 · Science, religion and miracles
    title: (d) What the chaos proposal needs
    prompt: |
      A theologian proposes that God acts in the world without breaking any law of nature: in chaotic systems, tiny differences in the start grow, so God could nudge an outcome below any measurable precision. A critic replies that this shows only that **we** cannot predict the outcome. What must the proposal add to answer the critic?
    options:
      - text: That the openness is in the world itself (the laws really leave the outcome undetermined), not only in our limited knowledge.
        correct: true
      - text: That chaotic systems are random, so no law governs them.
        feedback: |
          Standard chaotic systems are deterministic: the same exact start gives the same outcome. The unpredictability comes from sensitivity to the start, not from the absence of law.
      - text: That God must sometimes break the laws of physics after all.
        feedback: |
          The proposal was built to avoid that. Adding law-breaking would turn it into a different view of miracles.
      - text: That scientists will eventually measure the start with perfect precision.
        feedback: |
          Perfect measurement would remove the openness for a deterministic chaotic system, and would leave God no room to act at that point.
    explanation: |
      The critic separates epistemic openness (we cannot know the outcome in practice) from ontological openness (the world's laws leave it undetermined). Chaos supplies the first. For divine action to occur through it, the second must hold or be argued: for example through an indeterministic view of nature, or through an extra "top-down" influence that is not a force. Without that, a deterministic chaotic system has one lawful outcome and nothing for God to choose.

  # ------------------------------------------------------------- Question 2
  - type: numeric
    id: q2-integration
    points: 0.5
    tag: Question 2 · Mind and consciousness
    title: (a) A toy integration score
    prompt: |
      In the lab, a toy network has four units $A,B,C,D$ and five links, each of weight $1$: $A\text{–}B$, $A\text{–}C$, $B\text{–}C$, $B\text{–}D$, $C\text{–}D$ (there is no $A\text{–}D$ link). The **toy integration** score is the smallest number of links that cross any split of the units into two non-empty groups. (It is a toy, not the real $\Phi$ of integrated information theory.)

      What is the toy score of this network?
    answer: 2
    tolerance: 0.001
    answerText: '2'
    wrong:
      - value: 3
        feedback: |
          Splitting off $B$ alone cuts $3$ links ($A\text{–}B$, $B\text{–}C$, $B\text{–}D$), but a smaller cut exists. The score is the minimum over all splits.
      - value: 4
        feedback: |
          The split $\{A,D\}\mid\{B,C\}$ cuts $4$ links; it is one split among seven, not the smallest.
      - value: 5
        feedback: |
          $5$ is the total number of links. A split cuts only those that run between the two groups.
    explanation: |
      There are $2^{4-1}-1=7$ splits. Cutting off $A$ alone crosses $A\text{–}B$ and $A\text{–}C$ ($2$ links); cutting off $D$ alone crosses $B\text{–}D$ and $C\text{–}D$ ($2$). Cutting off $B$ or $C$ alone crosses $3$, and the splits $\{A,B\}\mid\{C,D\}$, $\{A,C\}\mid\{B,D\}$ cross $3$, while $\{A,D\}\mid\{B,C\}$ crosses $4$. The minimum is $2$. A low score marks a network that falls apart easily into two nearly separate parts.

  - type: mcq
    id: q2-zombie
    points: 0.5
    tag: Question 2 · Mind and consciousness
    title: (b) Which premise?
    prompt: |
      The zombie argument runs: P1, a zombie (a being physically identical to us but with no experience) is conceivable. P2, whatever is conceivable in this way is metaphysically possible. P3, if such zombies are possible, physicalism is false. C, physicalism is false. A reply says: "People could conceive that Hesperus is not Phosphorus, yet they are the same planet, so that was never possible. Conceivability can mislead about what is possible." Which premise does this reply attack?
    options:
      - text: P2, the step from conceivable to metaphysically possible.
        correct: true
      - text: P1, because zombies are not conceivable at all.
        feedback: |
          The reply grants that the scenario can be conceived (that is the point of the Hesperus example). Denying P1 is a different reply, made by those who say the zombie hunch is confused.
      - text: P3, because physicalism does not need to rule out zombies.
        feedback: |
          P3 links possibility to the falsity of physicalism. The Hesperus reply says nothing about that link; it questions whether the scenario is really possible.
      - text: The validity of the argument, because C does not follow from P1 to P3.
        feedback: |
          The argument is valid: if all three premises are true, C follows. The reply attacks the truth of a premise, not the logic.
    explanation: |
      The Hesperus and Phosphorus case is the standard example of something conceivable that is impossible, because the two names refer to the same object (an a posteriori identity). If such cases exist for the physical and the experiential too, P2 fails. Other critics deny P1, and defenders answer that the cases differ. The validity check (do the premises give C?) is separate from asking which premise is true.

  - type: numeric
    id: q2-effect
    points: 0.5
    tag: Question 2 · Altered states
    title: (c) How sure is the effect?
    prompt: |
      The lab runs a trial of a meditation course against a waiting list, with $n=50$ people in each group. The standardized effect is $d=0.4$ (the mean difference divided by the standard deviation). For equal groups of size $n$, an approximate standard error is
      $$\mathrm{SE}(d)=\sqrt{\frac{2}{n}+\frac{d^2}{4n}}.$$
      What is $\mathrm{SE}(d)$? (Three decimals.)
    answer: 0.202
    tolerance: 0.002
    answerText: '0.202'
    wrong:
      - value: 0.396
        feedback: |
          $1.96\times\mathrm{SE}\approx0.396$ is the half-width of the $95\%$ confidence interval, not the standard error itself.
      - value: 0.04
        feedback: |
          $2/n=0.04$ is the variance term only. The standard error is the square root of the sum of both terms.
      - value: 0.4
        feedback: |
          $0.4$ is the effect $d$ itself. The standard error measures how much $d$ would vary between repeated trials of this size.
    explanation: |
      $\dfrac{2}{50}=0.04$ and $\dfrac{0.4^2}{4\times50}=0.0008$, so $\mathrm{SE}=\sqrt{0.0408}\approx0.202$. A $95\%$ interval is about $d\pm1.96\,\mathrm{SE}$, that is $0.4\pm0.40$, from about $0.00$ to $0.80$: a typical effect, but a very wide range of possible sizes. Quadrupling $n$ would halve the standard error. Even a clear difference from the waiting list does not show that meditation beats an active treatment.

  - type: numeric
    id: q2-nde
    points: 0.5
    tag: Question 2 · Altered states
    title: (d) The right denominator
    prompt: |
      A hospital studies cardiac arrests. Over a year there were $700$ arrests; $60$ patients survived; $40$ of the survivors were interviewed within a week; and $9$ of these interviewees scored $7$ or more on the Greyson near-death experience scale (16 items scored 0 to 2 each; $7$ or more counts as a near-death experience). Among the survivors who **could be asked**, what percentage reported a near-death experience?
    answer: 22.5
    tolerance: 0.1
    answerText: '9/40 = 22.5%'
    wrong:
      - value: 15
        feedback: |
          $9/60$ divides by all survivors, including $20$ who were never interviewed and whose experience is unknown.
      - value: 1.29
        feedback: |
          $9/700$ divides by all arrests. Most arrested patients died and could not be asked, so this mixes survival with experience.
      - value: 9
        feedback: |
          $9$ is the number of reports. A rate needs the number of people who could have given one.
    explanation: |
      A rate is $k/n$ with $n$ the people who could report: $9/40=22.5\%$. Dividing by $60$ ($15\%$) treats uninterviewed survivors as having no experience, and dividing by $700$ ($1.3\%$) answers a different question. Quoted rates of near-death experience differ widely partly because studies choose different denominators, which is why a rate must always say "of whom".

  # ------------------------------------------------------------- Question 3
  - type: numeric
    id: q3-z
    points: 0.5
    tag: Question 3 · Experience and testing it
    title: (a) A surprising guesser
    prompt: |
      At the workshop, a participant guesses which of four hidden pictures a partner is "sending", with chance $p_0=0.25$ per trial. Over $n=100$ trials she is right $38$ times, so $\hat p=0.38$. The test statistic is
      $$z=\frac{\hat p-p_0}{\sqrt{p_0(1-p_0)/n}}.$$
      What is $z$? (One decimal.)
    answer: 3
    tolerance: 0.05
    answerText: '3.0'
    wrong:
      - value: 2.68
        feedback: |
          This puts the observed $\hat p=0.38$ in the standard error. The test asks how surprising the result is **if chance holds**, so the standard error uses $p_0=0.25$.
      - value: 0.13
        feedback: |
          $0.13$ is the difference $\hat p-p_0$, the numerator. It must be divided by the standard error $\sqrt{0.25\times0.75/100}\approx0.0433$.
      - value: 0.4
        feedback: |
          $0.4$ is $\hat p-p_0$ divided by $\sqrt{p_0(1-p_0)}\approx0.433$ only, with the sample size forgotten. The standard error also divides by $\sqrt n=10$, giving $0.0433$.
    explanation: |
      Under chance the standard error is $\sqrt{0.25\times0.75/100}=\sqrt{0.001875}\approx0.0433$, so $z=0.13/0.0433\approx3.0$. A result three standard errors above chance would be rare ($p\approx0.001$ one-sided) for a single pre-registered test. It says little unless the test was fixed in advance, as the next part shows.

  - type: numeric
    id: q3-many
    points: 0.5
    tag: Question 3 · Experience and testing it
    title: (b) Many looks
    prompt: |
      The organisers admit that this participant was one of a pool of tests: they ran $k=14$ **independent** tests of chance-level guessing, each declared "significant" at the $5\%$ level (so each has a $5\%$ chance of a false alarm when only chance operates). What is the probability that **at least one** of the $14$ tests looks significant even though only chance is at work? (Three decimals.)
    answer: 0.512
    tolerance: 0.002
    answerText: '1 - 0.95^14 ≈ 0.512'
    wrong:
      - value: 0.05
        feedback: |
          $0.05$ is the false-alarm chance of **one** test. With fourteen tries, the chance of at least one false alarm is much larger.
      - value: 0.7
        feedback: |
          $14\times0.05=0.7$ adds the chances, which overcounts the overlaps. It works as an upper bound only for small totals.
      - value: 0.488
        feedback: |
          $0.95^{14}\approx0.488$ is the probability that **no** test looks significant. The question asks for at least one, the complement.
    explanation: |
      The chance that a given test does not raise a false alarm is $0.95$, and for $14$ independent tests it is $0.95^{14}\approx0.488$. So at least one false alarm has probability $1-0.488\approx0.512$. Running many tests and reporting the successes turns a $5\%$ rule into a coin flip; this is why a result must be judged against everything that was tried.

  - type: numeric
    id: q3-neuro
    points: 0.5
    tag: Question 3 · Experience and brain explanations
    title: (c) A helmet and a presence
    prompt: |
      A researcher claims that a "sensed presence" ($E$) is a real contact with something outside the person ($X$). Her prior is $P(X)=0.2$. She knows that a sham-controlled magnetic helmet makes some people report a presence, and judges $P(E\mid X)=0.6$ and $P(E\mid\neg X)=0.3$ (the probability of such an experience when nothing is there, given brain processes like these).

      What is $P(X\mid E)$? (Three decimals.)
    answer: 0.333
    tolerance: 0.002
    answerText: '1/3 ≈ 0.333'
    wrong:
      - value: 0.5
        feedback: |
          $0.5$ are the posterior **odds** ($0.25\times2$), not a probability. Convert with $\text{odds}/(1+\text{odds})$.
      - value: 0.6
        feedback: |
          $0.6$ is the likelihood $P(E\mid X)$, not the probability of $X$ given $E$.
      - value: 0.2
        feedback: |
          That would hold only if the brain explanation made $E$ just as likely with or without $X$ (a likelihood ratio of $1$). Here the ratio is $0.6/0.3=2$, so the probability rises a little.
    explanation: |
      Prior odds $0.2:0.8=0.25$. Likelihood ratio $0.6/0.3=2$. Posterior odds $0.25\times2=0.5$, so
      $$P(X\mid E)=\frac{0.5}{1.5}=\frac13\approx0.333.$$
      A brain explanation defeats the experience as evidence only to the degree that it brings the likelihood ratio toward $1$. If the experience were as likely without $X$ as with it, the probability would stay at $0.2$; the existence of a mechanism alone does not settle that.

  - type: numeric
    id: q3-core
    points: 0.3
    tag: Question 3 · Mysticism
    title: (d) A common core
    prompt: |
      A scholar lists the features reported in three traditions. Tradition 1: $\{a,b,c,d,e\}$. Tradition 2: $\{b,c,d,f\}$. Tradition 3: $\{c,d,e,g\}$. The proposed **common core** is the set of features that appear in all three. How many features does it contain?
    answer: 2
    tolerance: 0.001
    answerText: '2 (c and d)'
    wrong:
      - value: 3
        feedback: |
          $\{b,c,d\}$ is the overlap of traditions 1 and 2 only. Tradition 3 lacks $b$.
      - value: 7
        feedback: |
          Seven features ($a$ to $g$) appear in **some** tradition: the union. The core is the intersection.
      - value: 4
        feedback: |
          $4$ is the size of tradition 2 (or tradition 3) alone. The core is what survives intersection with the others.
    explanation: |
      The core is the intersection $T_1\cap T_2\cap T_3=\{c,d\}$, which has $2$ elements. A critic of the common-core idea (the constructivist view) would reply that even $c$ and $d$ are described differently in each tradition, so the shared label hides different experiences.

  - type: build
    id: q3-report
    points: 0.2
    tag: Question 3 · Mysticism
    title: (e) Report = ?
    prompt: |
      According to the common-core view, a report from tradition $i$ combines what all share with what its tradition adds. Complete the line for the report $r_i$.
    prefix: 'r_i ='
    suffix: ''
    tiles: ['\text{core}', '+', '\text{interpretation}_i', '\times', '\text{core}_i']
    answers:
      - ['\text{core}', '+', '\text{interpretation}_i']
      - ['\text{interpretation}_i', '+', '\text{core}']
    wrong:
      - answer: ['\text{core}', '\times', '\text{interpretation}_i']
        feedback: 'The common-core view is additive: a shared experience plus a tradition-specific description. A product would make the two inseparable, which is nearer the constructivist reading.'
      - answer: ['\text{core}_i', '+', '\text{interpretation}_i']
        feedback: 'The core is the same for every $i$ on this view (it carries no subscript). A core that differs by tradition would be the constructivist claim.'
    explanation: |
      The common-core view writes $r_i=\text{core}+\text{interpretation}_i$: one shared core and a tradition-dependent interpretation. The constructivist replies that the interpretation shapes the experience itself, so the report cannot be split this way.

  # ------------------------------------------------------------- Question 4
  - type: numeric
    id: q4-alarm
    points: 0.5
    tag: Question 4 · Why humans believe
    title: (a) The cautious villager
    prompt: |
      A village story: a hunter hears a rustle that might be a predator. If he ignores a real predator, the cost is $C_{\text{miss}}=40$. If he reacts to a false alarm, the cost is $C_{\text{alarm}}=2$. Let $p$ be the probability that a rustle is a predator. Reacting costs $(1-p)C_{\text{alarm}}$ on average, and ignoring costs $pC_{\text{miss}}$.

      At what value of $p$ do the two policies cost the same? (Three decimals.)
    answer: 0.048
    tolerance: 0.001
    answerText: '2/42 ≈ 0.048'
    wrong:
      - value: 0.05
        feedback: |
          $0.05$ is close but not the break-even. Set $pC_{\text{miss}}=(1-p)C_{\text{alarm}}$: $40p=2-2p$, so $p=2/42\approx0.048$.
      - value: 20
        feedback: |
          $20$ is the ratio $C_{\text{miss}}/C_{\text{alarm}}$, not a probability.
      - value: 0.952
        feedback: |
          $40/42$ swaps the costs. The threshold is the cost of the false alarm over the total, $C_{\text{alarm}}/(C_{\text{alarm}}+C_{\text{miss}})$.
    explanation: |
      Setting $40p=2(1-p)$ gives $42p=2$, so
      $$p^*=\frac{C_{\text{alarm}}}{C_{\text{alarm}}+C_{\text{miss}}}=\frac{2}{42}\approx0.048.$$
      Above $4.8\%$ it pays to react, even though $95\%$ of reactions are false alarms. An over-sensitive detector of agents can therefore be cheap to keep. Whether this explains religious belief (as a by-product) or is merely one ingredient is a live debate.

  - type: numeric
    id: q4-public
    points: 0.5
    tag: Question 4 · Why humans believe
    title: (b) The free rider
    prompt: |
      In a village game, $n=5$ players each hold $e=10$ coins and may put them in a common pot. The pot is multiplied by $m=3$ and shared **equally** among all five players. Four players put in all $10$; the fifth keeps hers.

      How many coins does the player who kept hers end with?
    answer: 34
    tolerance: 0.001
    answerText: '34'
    wrong:
      - value: 30
        feedback: |
          $30$ is what each player gets if **all five** contribute ($3\times50/5$). Here one player keeps her coins.
      - value: 24
        feedback: |
          $24$ is only her share of the pot ($3\times40/5$). She also keeps her own $10$ coins.
      - value: 10
        feedback: |
          She keeps $10$, but she also receives a share of the pot to which the others contributed.
    explanation: |
      The pot is $4\times10=40$, multiplied by $3$ gives $120$, and each of the $5$ players receives $24$. The free rider ends with $10+24=34$. A contributor ends with $24$, and had everyone contributed each would have $30$. The free rider beats the cooperators ($34$ against $24$) while the group does worse than full cooperation; this is the puzzle that group-level accounts of religion (costly signals, shared rituals, watching gods) try to solve.

  - type: mcq
    id: q4-debunk
    points: 0.5
    multiple: true
    tag: Question 4 · Why humans believe
    title: (c) What a debunking argument shows
    prompt: |
      A critic argues: "The belief in a watching deity arises from a mental tendency that would produce the belief whether or not such a deity exists, and there is no independent support for it." **Select all** that this debunking argument, if its premises hold, would establish or require.
    options:
      - text: The belief is not justified by the process that produced it (it is unjustified), without showing the belief is false.
        correct: true
      - text: A believer can answer it by giving independent support, such as a good argument or evidence that does not rely on the same process.
        correct: true
      - text: The question "would the process give this belief if it were false?" is the key test of the argument.
        correct: true
      - text: The belief is false, because we know where it came from.
        feedback: |
          This is the genetic fallacy. A true belief can have a bad or humble origin; a debunking argument targets justification, not truth.
      - text: The belief is true, because it is natural for humans to hold it.
        feedback: |
          Being natural does not show truth: many natural tendencies mislead (the jammed thermometer reads a steady value whatever the temperature).
    explanation: |
      A debunking argument has a causal premise (the real cause of the belief), a premise that the process would give the belief whether or not it is true, and a premise that nothing independent supports it. Its conclusion is that the belief is **unjustified**, not that it is false. The standard replies add independent support or deny the second premise (for example, by arguing that the process is reliable when properly working). Neither "false" nor "true" follows from the origin alone.

  - type: numeric
    id: q4-margin
    points: 0.5
    tag: Question 4 · Science, religion and surveys
    title: (d) The margin of a survey
    prompt: |
      A random survey of $n=900$ members of a country's scientific society finds that $40\%$ say they believe in a personal God. The approximate $95\%$ margin of error for a proportion is $1.96\sqrt{p(1-p)/n}$. What is the margin, in **percentage points**? (One decimal.)
    answer: 3.2
    tolerance: 0.05
    answerText: '3.2 points'
    wrong:
      - value: 1.6
        feedback: |
          This is $\sqrt{p(1-p)/n}$ in points without the factor $1.96$ (one standard error), which gives only about a $68\%$ interval.
      - value: 0.032
        feedback: |
          $0.032$ is the right size as a fraction, but the question asks for percentage points: $0.032\times100=3.2$.
      - value: 10
        feedback: |
          $10$ is far too wide for $n=900$: $\sqrt{0.24/900}\approx0.0163$, so even $1.96$ standard errors is only $3.2$ points.
    explanation: |
      $\sqrt{0.4\times0.6/900}=\sqrt{0.000267}\approx0.01633$, and $1.96\times0.01633\approx0.032$, that is $3.2$ points. The true share is then probably between about $37\%$ and $43\%$. The margin covers **sampling** only: it says nothing about bias if the sample is not random, if the question wording is loaded, or if "belief in a personal God" means different things to different respondents.

  # ------------------------------------------------------------- Question 5
  - type: order
    id: q5-order
    points: 0.6
    tag: Question 5 · Weighing a claim
    title: (a) Order an odds calculation
    prompt: |
      A reviewer wants to judge a surprising claim $H$ from a reported result $E$. Put her steps in the right order.
    steps:
      - 'Write the prior odds $P(H)/P(\lnot H)$ before looking at the result.'
      - 'Estimate how likely the result is if the claim is true, $P(E\mid H)$.'
      - 'Estimate how likely the same result is if the claim is false, $P(E\mid\lnot H)$, counting flukes, hidden analyses and shared flaws.'
      - 'Form the likelihood ratio $P(E\mid H)/P(E\mid\lnot H)$.'
      - 'Multiply the prior odds by the likelihood ratio to get the posterior odds.'
      - 'Convert the posterior odds $O$ to a probability with $O/(1+O)$.'
    explanation: |
      The prior comes first so the result cannot be used to set it. Then both likelihoods, the false-claim one with all its ways of producing a false positive, then the ratio, the product with the prior odds, and finally the conversion from odds to probability. Skipping the estimate of $P(E\mid\lnot H)$ is the usual way a surprising result seems more convincing than it is.

  - type: mcq
    id: q5-layers
    points: 0.4
    tag: Question 5 · Weighing a claim
    title: (b) Three layers
    prompt: |
      In the village of Marl, a shrine is said to heal. Three sentences are offered. (i) "In a 2024 survey of $300$ villagers, $150$ said they had been healed after a visit." (ii) "These reports are best explained by group ritual and expectation, not by anything beyond nature." (iii) "The healings are acts of a divine being." Which assignment of layers is the most careful?
    options:
      - text: (i) established fact (a recorded survey result), (ii) a live debate among interpreters, (iii) a faith or metaphysical commitment.
        correct: true
      - text: (i) a live debate, (ii) established fact, (iii) a faith commitment.
        feedback: |
          Sentence (ii) is an interpretation of why people report healing; scholars of ritual, medicine and religion disagree about the mix of causes. That is a debate, not a recorded fact.
      - text: (i) established fact, (ii) established fact, (iii) a live debate.
        feedback: |
          A survey count is a fact (about reports, not about healings), but (ii) is an explanation under dispute, and (iii) rests on commitments about what exists beyond nature.
      - text: All three are established fact, because villagers sincerely hold them.
        feedback: |
          Sincerity shows what people believe, not that the claim is established. Facts about reports differ from explanations and from commitments.
    explanation: |
      The first sentence reports a count: it is established (that people said so), though it does not say what caused the reported healing. The second proposes a mechanism, which is a live explanatory debate. The third makes a claim about a divine being, which depends on worldview commitments about what exists. Keeping the layers apart is the course's main discipline: never pass a commitment off as a fact, in either direction.

  - type: numeric
    id: q5-shared
    points: 0.6
    tag: Question 5 · Weighing a claim
    title: (c) Five labs, one flaw
    prompt: |
      Five labs report that a treatment works ($E$: all five report a positive result). Suppose the claim $H$ is true. Then $P(E\mid H)=0.6$. Suppose $H$ is false. Then either all five labs share one hidden flaw, with probability $c=0.005$ (and then all five report positives), or there is no shared flaw (probability $0.995$) and each lab independently gets a false positive with probability $0.05$.

      What is the likelihood ratio $P(E\mid H)/P(E\mid\lnot H)$? (Nearest whole number.)
    answer: 120
    tolerance: 1
    answerText: '≈120'
    wrong:
      - value: 1920000
        feedback: |
          This ignores the shared flaw and uses only $0.05^5\approx3.1\times10^{-7}$ for the false-claim case. Independent flukes become negligible; the shared flaw dominates.
      - value: 200
        feedback: |
          $1/c=200$ is the ceiling of the ratio when $P(E\mid H)=1$. Here $P(E\mid H)=0.6$, so the ratio is $0.6/0.005\approx120$.
      - value: 0.6
        feedback: |
          $0.6$ is the numerator alone. A likelihood ratio divides by $P(E\mid\lnot H)$.
    explanation: |
      $P(E\mid\lnot H)=c+(1-c)\,0.05^5=0.005+0.995\times3.125\times10^{-7}\approx0.0050003$. So the ratio is $0.6/0.0050003\approx120$. Five independent confirmations would give a ratio near two million, but a flaw common to all five caps the ratio near $P(E\mid H)/c$: more replications of the same flawed design do not help. Replications must differ in the ways that could hide the flaw.

  - type: mcq
    id: q5-weigh
    points: 0.4
    tag: Question 5 · Weighing a claim
    title: (d) Equal evidence, different conclusions
    prompt: |
      Two reviewers, **Ines** (prior probability $10^{-6}$ that the treatment's mechanism is real) and **Jorge** (prior $0.1$), both accept the same likelihood ratio of $120$ from the five labs. After updating, they still disagree strongly. Which statement is the most accurate?
    options:
      - text: Their disagreement now lies in the priors, which come from background commitments the data alone do not settle; the shared likelihood ratio moved both of them.
        correct: true
      - text: The ratio of $120$ means that the claim is $120$ times more likely than not, so both must conclude it is probably true.
        feedback: |
          A likelihood ratio multiplies the **prior odds**. For Ines, odds $10^{-6}\times120\approx10^{-4}$ remain tiny; for Jorge, odds $0.111\times120\approx13$ give about $93\%$.
      - text: Jorge is irrational, because anyone who sees the same evidence must reach the same probability.
        feedback: |
          Bayes' rule needs a prior; two rational agents with different priors reach different posteriors. The question is where the priors come from and whether they are defensible.
      - text: The evidence had no effect, because they disagreed before and after.
        feedback: |
          Both moved: Ines from $10^{-6}$ to about $1.2\times10^{-4}$, Jorge from $0.1$ to about $0.93$. A fixed likelihood ratio changes everyone's odds by the same factor.
    explanation: |
      Ines: prior odds $\approx10^{-6}$, times $120$ gives about $1.2\times10^{-4}$. Jorge: prior odds $0.1/0.9=0.111$, times $120$ gives $13.3$, that is about $0.93$. The same evidence moved both by the same factor, and they still differ, because the priors differ by a factor of about $10^{5}$. Where the priors come from (background knowledge, worldview, trust in the mechanism) is the real disagreement, and it is what the course asks readers to name.
