id: ch16-challenge
title: "Level Challenge: Reading the Qur'an Fairly (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: a leaf, a chain and a verse"
    body: |
      Problems 1 and 2 use **invented** numbers and names, built to practise on cases you have never seen; nothing in them is a claim about a real manuscript or a real narrator. Problem 3 uses a real verse, quoted in the Sahih International translation, and real commentators, each introduced as "according to".

      In each problem the same material is handled by two kinds of reader, and the card says which.

      - **[H] The historian's tools.** Date the material, compare versions, ask who depended on whom. These yield *more or less probable*, never *proved*.
      - **[M] The Muslim reading.** According to Muslims, the Qur'an is God's speech, the Prophet's sayings guide the community, and the classical commentators and jurists read both with learning. These are held on grounds beyond what a manuscript shows, and many Muslim scholars also use [H] tools.
      - **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. A claim never moves up a layer by being repeated.

      Problems 4 and 5 (a case from kalam or law, then the closing weighing) come in part 2.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      Five tools from the level, each stated so it can be used alone.

      - **Radiocarbon range.** A laboratory dates the death of the animal whose skin became the leaf, as a range with a probability (for example $600$ to $680$ CE at $95.4\%$). It does not date the writing.
      - **Qira'at.** Recognised ways of reciting the Qur'an. According to the tradition, Ibn Mujahid (died $936$) fixed seven as standard. They differ in small points and share one written skeleton.
      - **Isnad and matn.** A hadith has a chain of narrators (*isnad*) and a text (*matn*). A **common link** is a narrator through whom many chains pass; Schacht (1902-69) read it as the likely origin of the saying, Motzki (1948-2019) compared wording across versions to test that.
      - **Grading.** According to Ibn Hajar (1372-1449), *sahih* needs a connected chain, upright narrators, full precision, no hidden defect and no oddity; *hasan* has lighter precision.
      - **Tafsir.** Classical commentary (*tafsir*) explains a verse by its recorded occasion (*asbab al-nuzul*), by other verses and by language.

  # ---------------- Problem 1 ----------------
  - type: text
    id: p1-setup
    title: "Problem 1 · A leaf and two readings"
    body: |
      **Problem 1.** An invented parchment leaf, **Leaf L**, carries the opening chapter of the Qur'an in an early script. A laboratory reports a calibrated radiocarbon range of $600$ to $680$ CE at $95.4\%$ for the skin.

      The line for verse 4 can be read two ways. Recall that early script often leaves out the long vowel mark, so one written form can be read either as *malik* ("king") or as *mālik* ("owner"). The Sahih International translation renders 1:4 "Sovereign of the Day of Recompense". Both readings are among the recognised *qira'at*.

      The task: say what the date limits, what the variant does to the book, and how a follower of Sinai (2014) and a follower of Wansbrough (1977) would each use the leaf.

  - type: numeric
    id: p1-width
    title: "How wide is the range?"
    prompt: |
      Leaf L's calibrated radiocarbon range runs from $600$ to $680$ CE. How many years wide is the range?
    answer: 80
    wrong:
      - { value: 632, feedback: "632 is the year of the Prophet's death, a date in the story, not the width of the range. The width is the end of the range minus its start." }
      - { value: 48, feedback: "48 is 680 minus 632, the distance from the Prophet's death to the end of the range. The width compares the two ends of the range." }
    hint: Subtract the start of the range from its end.
    explanation: |
      $680-600=80$ years. The laboratory says the animal died somewhere in that window with 95.4% probability, so about 4.6% of the probability lies outside it.

  - type: numeric
    id: p1-after
    title: "How late can it be?"
    prompt: |
      The Prophet died in $632$ CE. Taking the latest end of Leaf L's range, $680$, how many years after the Prophet's death is that?
    answer: 48
    wrong:
      - { value: 80, feedback: "80 is the width of the range. The question compares the end of the range with the year 632." }
      - { value: 32, feedback: "32 is 632 minus 600, the start of the range. The question is about the end of the range, 680." }
    hint: Subtract 632 from 680.
    explanation: |
      $680-632=48$ years. Note also that the start of the range, $600$, is $32$ years before $632$: the skin may be older than the Prophet's death.

  - type: mcq
    id: p1-limits
    title: "What does the date limit?"
    prompt: |
      Leaf L's skin has a calibrated range of $600$ to $680$ CE at $95.4\%$. Which statement about what the date shows is correct?
    options:
      - text: "The animal died within the range, so the text cannot have been written on this leaf earlier than that range, and it sets a ceiling on how late the copied text can be. It does not by itself say when the text was first composed, or when the ink was applied if the skin was stored or reused."
        correct: true
        feedback: |
          Yes. The writing cannot be older than the animal, and the text copied cannot be younger than the writing. The range limits the text from above; it does not show how much earlier the text was composed.
      - text: "The leaf was written within the range, so the text was composed in the range."
        feedback: |
          Two steps are skipped. The date is for the skin, not the writing, and the text copied can be older than the copy. The date gives a ceiling, not a composition date.
      - text: "The 95.4% means the leaf is 95.4% likely to date from the Prophet's lifetime."
        feedback: |
          The percentage is the probability that the skin's date lies inside the whole range. It says nothing about the Prophet's lifetime in particular (the range reaches 48 years past his death).
    explanation: |
      Label: **established** (the laboratory range, if the sample is sound), **debate** (what link between skin, writing and text one may assume). The inference "skin date, therefore text date" needs an argument of its own.

  - type: mcq
    id: p1-sinai-wans
    title: "How would each side use the leaf?"
    prompt: |
      Sinai (2014) holds, in essence, that the traditional account of a text standardised under Uthman (reigned $644$ to $656$), with small corrections up to about $700$, is the best default. Wansbrough (1977) held that the text took its final form late, towards the end of the 8th century. Leaf L (skin $600$ to $680$, standard-looking text) is found. Which pairing is fair?
    options:
      - text: "Sinai's side says the leaf fits an early standard text (it does not prove one, since the range reaches 680). Wansbrough's followers would have to argue that the leaf does not hold the full standard text, or that the writing is far later than the skin, because a standard text before 680 is hard to fit with a late 8th-century form."
        correct: true
        feedback: |
          Yes. Each side applies the same ceiling to its own claim: a dated leaf counts for an early date if it holds the text and the writing is close to the skin, and each of those two links can be contested.
      - text: "Sinai's side says the leaf proves the Qur'an was written under Uthman; Wansbrough's followers would accept this and drop their position."
        feedback: |
          The range is 600 to 680, not 644 to 656, and the writing may be later than the skin. A leaf fits Sinai's default without proving it, and a debate is rarely ended by one leaf.
      - text: "Both would ignore the leaf, since dates from science cannot be used on religious texts."
        feedback: |
          Historians on both sides use such dates. The point is how much weight the leaf carries, which depends on how closely the writing is tied to the skin and how much of the text the leaf holds.
    explanation: |
      Label: **debate**. A leaf that shows a text in the 7th century is evidence against a very late date, but only as strong as the link from skin to writing to full text. This is why a lone leaf seldom decides a question about the whole book.

  - type: mcq
    id: p1-variant
    title: "Does the variant change the book?"
    prompt: |
      On Leaf L the line for 1:4 can be read *malik* ("king") or *mālik* ("owner"). Which statement is fair to both a Muslim scholar and a historian?
    options:
      - text: "According to Muslim scholars both readings are authentically reported and may be recited, so the variant is a recognised difference within one book. According to historians, two readings that share one written skeleton point to a common early text from which the differences arose; they do not point to two books."
        correct: true
        feedback: |
          Yes. The two sides agree on what the variant is (a small difference in recitation on a shared skeleton) and differ on how to explain it: through recorded recitation by the Prophet and the early community, or through the history of an early written text.
      - text: "According to historians the variant proves the text was corrupted, and Muslim scholars deny any variants exist."
        feedback: |
          Muslim scholars have long catalogued the recognised readings (seven standard ones, later ten and fourteen). Historians treat variants as evidence about the early text; one small variant between two accepted readings is not corruption.
      - text: "The variant makes the passage mean the opposite in one reading."
        feedback: |
          King and owner are different words for authority over the Day, but both say that God rules that Day. The difference in meaning is small, which is typical of the recognised readings.
    explanation: |
      Label: **established** (the readings exist and are recognised), **debate** (their origin), **commitment** (whether recitation reaches back to the Prophet). The variant is a case where two readers can look at the same page and agree on everything but the last layer.

  - type: mcq
    id: p1-layers
    title: "Which layer?"
    prompt: |
      Select every statement that belongs to **layer one or two** (fact or scholarly debate), as opposed to layer three (faith commitment).
    multiple: true
    options:
      - text: "Leaf L's skin has a calibrated range of 600 to 680 CE at 95.4%."
        correct: true
        feedback: |
          Correct: a laboratory result (layer one, if the sample is sound).
      - text: "A leaf in that range with a standard-looking text counts against a late 8th-century final form, but only as strongly as the link from skin to writing to full text."
        correct: true
        feedback: |
          Correct: an inference with stated limits, a layer-two judgment.
      - text: "The text of the Qur'an is God's speech, so any date of the skin is secondary to its source."
        feedback: |
          Muslims hold this, and it is faith (layer three). It is not a result of any date, and a date cannot confirm or refute it.
      - text: "No reading differs from another, since a revealed text cannot have variants."
        feedback: |
          This mixes the layers: the recognised readings do differ, which is layer one, and whether revelation allows several readings is a matter the tradition itself answers (it recognises several).
    explanation: |
      A fair report keeps the three layers visible: the lab number, the debate about what it shows, and the commitment about what the text is.

  # ---------------- Problem 2 ----------------
  - type: text
    id: p2-setup
    title: "Problem 2 · A saying and its chains"
    body: |
      **Problem 2.** An invented saying, **S**, is ascribed to the Prophet. It is found in five collections. All names and dates below are invented.

      The chain runs from the Prophet's Companion **Rafi** (died $680$) to **Sulayman** ($d.\ 700$) to **Hamza ibn Nasr** ($d.\ 740$). Four collectors reach S through four different pupils of Hamza; their chains share nothing above Hamza. The fifth collector reaches S through **Tariq**, a pupil of Sulayman, bypassing Hamza.

      Collector 1's chain has narrators who are all upright and precise. Collector 2's chain is connected and upright, but one narrator, **Dawud**, is known for an uneven memory. The four versions of the text through Hamza differ in small details, and each has a detail the others lack. Tariq's version matches Hamza's in two distinctive details.

      The task: grade the chains, order the argument, name the dispute between Schacht and Motzki, and say what this shows about the premise "late sources".

  - type: numeric
    id: p2-share
    title: "How many chains pass through Hamza?"
    prompt: |
      Five collectors have chains for S. Four of them pass through Hamza ibn Nasr, the fifth does not. What percentage of the five chains pass through Hamza?
    answer: 80
    tolerance: 0.5
    wrong:
      - { value: 4, feedback: "4 is the number of chains, not the share. A share compares 4 with the total of 5, as a percentage." }
      - { value: 20, feedback: "20% is the share that do not pass through Hamza (1 of 5). The question is about the four that do." }
    hint: Divide the chains through Hamza by all the chains.
    explanation: |
      $4/5=80\%$. When most chains fan out from one narrator, that narrator is the **common link**. This is the pattern Schacht and Juynboll studied.

  - type: numeric
    id: p2-gap
    title: "How long after the Prophet is the common link?"
    prompt: |
      The Prophet died in $632$ CE, and the common link, Hamza ibn Nasr, died in $740$. How many years is Hamza's death after the Prophet's?
    answer: 108
    wrong:
      - { value: 40, feedback: "40 is the gap between Sulayman's death (700) and Hamza's (740). The question compares Hamza with the Prophet's death in 632." }
      - { value: 1372, feedback: "1372 is 740 plus 632. A gap between two dates is a difference, not a sum: subtract 632 from 740." }
    hint: Subtract 632 from 740.
    explanation: |
      $740-632=108$ years. Whatever Hamza's pupils report, the chain claims three links across that gap: Rafi, Sulayman, Hamza. Schacht's question is who made the link between the Prophet and Rafi; Motzki's is how much of the text came to Hamza from earlier.

  - type: order
    id: p2-order
    title: "Order the chain"
    prompt: "Put the chain of S in the order a collector would give it, from the earliest source to the collection."
    steps:
      - "The Prophet (died 632)"
      - "Rafi, a Companion (died 680)"
      - "Sulayman (died 700)"
      - "Hamza ibn Nasr, the common link (died 740)"
      - "One of Hamza's four pupils, then the collector"
    hint: Order by who is closest to the Prophet.
    explanation: |
      Reading a chain from the collection backwards is how the evidence is met; reading it forward is how the tradition tells it. Only Hamza is a point many chains share, which is why it is the first place a historian can stand with confidence.

  - type: mcq
    id: p2-grade
    title: "Grade the two chains"
    prompt: |
      According to Ibn Hajar, a chain is *sahih* when it is connected, its narrators upright and precise, and it has no hidden defect and no oddity. It is *hasan* when it meets these except that a narrator's precision is lighter. Collector 1's chain: connected, all upright and precise. Collector 2's chain: connected, all upright, but Dawud has an uneven memory. Which grading is right?
    options:
      - text: "Collector 1's chain is sahih; Collector 2's chain is hasan, because Dawud's memory is lighter but he is upright."
        correct: true
        feedback: |
          Yes. The grade follows the weakest narrator on the checklist. Dawud meets the upright condition and falls short of full precision, which is exactly the hasan case.
      - text: "Both chains are sahih, because every narrator is upright."
        feedback: |
          Upright is one condition of five. Precision is a separate one, and Dawud fails it in the full sense.
      - text: "Collector 2's chain is invented, since any narrator with uneven memory makes a chain false."
        feedback: |
          A lighter memory lowers the grade; it does not make a chain false. The tradition has a ladder (sahih, hasan, weak) because narrators vary.
    explanation: |
      Label: **faith-and-learning inside the tradition**. The grade answers "how far may a Muslim rely on this?" by the tradition's own checklist. It does not by itself answer "did the Prophet say it?" in a historian's sense; that is the question Schacht and Motzki dispute.

  - type: mcq
    id: p2-dispute
    title: "Schacht and Motzki on the common link"
    prompt: |
      Hamza is the common link of S. Which pairing states the dispute fairly?
    options:
      - text: "According to Schacht, the common link or a pupil may have put the saying into the Prophet's mouth, with the chain above him spun later. According to Motzki, comparing the wording of the pupils' versions (each has details the others lack, so they are not copies of each other) shows that the material came from Hamza, and a match with Tariq's version through Sulayman can push the origin back to Sulayman."
        correct: true
        feedback: |
          Yes. Both accept Hamza as the earliest secure point. They differ on how far a comparison of versions can carry the date back, and on whether the part of the chain above the link is evidence or later addition.
      - text: "According to Schacht the chain is always true; according to Motzki it is always false."
        feedback: |
          Reversed and too sweeping. Schacht was the sceptic about chains, and Motzki the one who tested them.
      - text: "Both say the dispute is settled because the narrators were all upright."
        feedback: |
          Uprightness is part of the tradition's grading. Neither historian treats it as settling the origin of the saying, which is a question about dating by comparing versions.
    explanation: |
      Label: **debate**. The method is Motzki's *isnad-cum-matn* analysis: compare chains and wordings together. It needs many versions to work, and it is open to the reply that pupils might agree because they share a later source.

  - type: numeric
    id: p2-push
    title: "How far back does Motzki push it?"
    prompt: |
      Tariq's version, through Sulayman (died $700$), matches Hamza's (died $740$) in two distinctive details, and Hamza and Tariq are independent pupils of Sulayman. If this is accepted, how many years earlier than Hamza's death does the saying's origin move, taking Sulayman's death as the date?
    answer: 40
    wrong:
      - { value: 68, feedback: "68 is 700 minus 632, the gap from the Prophet to Sulayman. The question compares Sulayman with Hamza." }
      - { value: 108, feedback: "108 is the gap from the Prophet to Hamza. The question is how much closer to the Prophet the origin moves." }
    hint: Subtract Sulayman's death year from Hamza's.
    explanation: |
      $740-700=40$ years. The saying would then be traced to Sulayman, $700-632=68$ years after the Prophet. That still leaves 68 years uncovered by this method, and a sceptic may say the shared details come from a source after Sulayman.

  - type: mcq
    id: p2-late
    title: "What does this show about 'late sources'?"
    prompt: |
      The premise: "The collections were written down about 200 years after the Prophet, so nothing in them can be early." (Bukhari died 870, Muslim 875; 870 - 632 = 238.) What does the work on the common link show about this premise?
    options:
      - text: "A late collection can contain earlier material, and comparing versions can sometimes date it; so lateness of the book does not decide the date of its contents. But the method has a limit: it reaches the common link, and what lies above it is a matter of debate, so the premise is weakened but not replaced by 'the sayings are the Prophet's'."
        correct: true
        feedback: |
          Yes. Both Schacht and Motzki do dating work on the contents; they differ on how far it goes. The premise confuses the date of the book with the date of the material.
      - text: "It shows the premise is true, since the common link is later than the Prophet."
        feedback: |
          The common link is later than the Prophet but earlier than the collections, so the work dates material to before the collections. The premise says nothing early survives, and this is a counterexample to the "nothing" part.
      - text: "It shows the premise is false, so every saying goes back to the Prophet."
        feedback: |
          Too far. The method dates a saying to its common link or partial link; it does not carry every saying to the Prophet, which is what the tradition holds on faith and scholars argue case by case.
    explanation: |
      Label: **debate** (how far back), **commitment** (the tradition's view that the transmission reaches the Prophet). A fair reader says what the method shows (an earlier date than the book) and what it does not (the Prophet).

  - type: mcq
    id: p2-who
    title: "Who may say what?"
    prompt: |
      Select every statement a fair reader can make without crossing a layer.
    multiple: true
    options:
      - text: "According to Ibn Hajar's checklist, Collector 2's chain is hasan."
        correct: true
        feedback: |
          Correct: a claim inside the tradition's own method, framed as such.
      - text: "The material in S goes back to Hamza ibn Nasr, by the shared pupils' versions; whether it goes back to the Prophet is disputed."
        correct: true
        feedback: |
          Correct: it states the earliest secure point and the open question.
      - text: "S is the Prophet's word, since its chain is hasan."
        feedback: |
          The grade measures reliability by the tradition's checklist. Whether a hasan report is the Prophet's word is a further claim: held by Muslims on the grading plus faith in the transmitters, and argued by historians case by case.
      - text: "S is late, since Bukhari died in 870."
        feedback: |
          The date of the collection is a ceiling for the date of the material, not the date of it. This is the "late sources" premise: the date of a book is not the date of its contents.
    explanation: |
      Naming whose method each statement uses keeps it inside its layer.

  # ---------------- Problem 3 ----------------
  - type: text
    id: p3-setup
    title: "Problem 3 · One verse, three readers"
    body: |
      **Problem 3.** One real verse, **Qur'an 2:256**, in the Sahih International translation:

      > There shall be no compulsion in [acceptance of] the religion. The right course has become distinct from the wrong.

      It is read by three kinds of reader.

      - **A classical commentator** (*mufassir*), explaining the verse through its recorded occasion and other verses. According to one report in the Abu Dawud collection, given on the authority of Ibn Abbas, some Ansar (the Medinan helpers of the Prophet) had children among the Banu Nadir, a Jewish tribe being expelled from Medina; the Ansar said "We shall not leave our children", and the verse was revealed. Ibn Kathir (the commentator) read the verse to mean that no one is to be forced into Islam because its proofs are plain.
      - **A historian**, who asks when the verse arose, how the occasion reports were transmitted, and what the setting in Medina was. Surah 2 is traditionally placed in the Medinan period, an account that historians such as Arnold (1913) follow.
      - **A modern Muslim scholar**, for example Tabataba'i, who reads the verse as a general prohibition of compelling anyone, because truth is self-evident, and Motahhari, who holds that jihad in the sense of defence does not conflict with the verse.

      The task: assign claims to layers, answer an objection, see how Muslims differ, and say what would count as evidence.

  - type: mcq
    id: p3-layers
    title: "Which layer is each claim?"
    prompt: |
      Match each claim to its layer. Which pairing is correct?
    options:
      - text: "'The verse is in Surah 2 and the Sahih International text reads as quoted' is layer one. 'The Abu Dawud report ties the verse to the Ansar children, but historians debate how early such occasion reports were fixed' is layer two. 'The verse is part of God's speech and so binds all believers' is layer three."
        correct: true
        feedback: |
          Yes. The text of the verse is a matter of record; the occasion report and its dating are a live debate; the status of the verse as revelation is faith.
      - text: "'The verse was revealed because the Ansar did not want to leave their children' is layer one, since it is in a hadith collection."
        feedback: |
          A report in a collection shows that the report exists, not that the occasion is established fact. How early and how reliable such reports are is itself debated.
      - text: "'No one can be forced to believe' is layer one, since the verse says so."
        feedback: |
          What the verse means (general prohibition, a limited one, or cancelled) is exactly what readers dispute. The words are layer one; their reading is layers two and three.
    explanation: |
      The same sentence can carry three layers. A fair report separates the quoted words, the argued reading, and the commitment.

  - type: mcq
    id: p3-objection
    title: "Which reply answers the objection?"
    prompt: |
      An objection: "Another verse, often called the verse of the sword (9:5), commands fighting the idolaters, so 2:256 cannot be a general rule." Which reply is a reply to *this objection* (stated as its defenders would)?
    options:
      - text: "Motahhari: jihad in the founding sense is defensive, so a command to fight in defence does not conflict with the ban on compulsion in belief. Others, citing Ibn Taymiyya, hold the verse is neither limited nor abrogated."
        correct: true
        feedback: |
          Yes. Both replies deny that the later verse cancels the earlier one; one by reading the later verse as defensive, the other by holding that the earlier text stands.
      - text: "The verse was revealed about some Ansar children, so it has nothing to say about anyone else."
        feedback: |
          This is a different answer: it limits the verse by its occasion. Most commentators answered that the wording is general and the occasion only shows where it was said, so it does not meet the objection that another verse cancels it.
      - text: "Qur'an 9:5 is not in the Qur'an."
        feedback: |
          No Muslim or historian says this. The verse is in the text; the dispute is over what it does to 2:256.
    explanation: |
      Label: **debate inside the tradition**. The objection assumes that the later verse overrides; the replies challenge that assumption, one by reading the later verse narrowly and one by denying the cancellation.

  - type: mcq
    id: p3-rivals
    title: "How do Muslims differ?"
    prompt: |
      Select every reading that some Muslim commentators have held about 2:256, according to the classical and modern literature.
    multiple: true
    options:
      - text: "A general prohibition: no one may be compelled to accept the religion, since its proofs are clear (Ibn Kathir; in modern times Tabataba'i)."
        correct: true
        feedback: |
          Correct, and a common view. It reads the verse at full width.
      - text: "Limited to the People of the Book who pay the poll tax (a view reported from early commentators including Qatada, al-Hasan and al-Dahhak)."
        correct: true
        feedback: |
          Correct. It reads the verse as a rule about one group, so forced conversion of others is a separate question.
      - text: "Abrogated by the verse of the sword (reported from al-Suddi and some later commentators), though most scholars hold the verse is not abrogated."
        correct: true
        feedback: |
          Correct. Abrogation (*naskh*) means a later ruling replaces an earlier one; the dispute here is whether it applies.
      - text: "The verse means that Islam does not ask for any belief at all."
        feedback: |
          No commentator reads it so. The verse speaks of compulsion in accepting the religion; it presupposes that a religion with content is being accepted.
    explanation: |
      Steelman each. The general reading takes the plain words; the limited reading takes the occasion seriously; the abrogation reading takes the Qur'an's order of verses seriously. Each answers a real feature of the text, and they differ on which weighs most.

  - type: mcq
    id: p3-evidence
    title: "What would count as evidence?"
    prompt: |
      A historian says: "2:256 was a Medinan verse spoken when the community was in a position of political strength." Which would count as evidence for or against this claim?
    options:
      - text: "An early, independently dated record of the verse's setting or an early commentary agreeing on it. Reports about the occasion, such as the Abu Dawud one, are evidence only as far as their chains can be tested, since they were written down later."
        correct: true
        feedback: |
          Yes. The claim is about time and place, so the evidence must be dated records of the setting; the report exists, but its age is the thing to be tested.
      - text: "A theological argument that God would not have allowed compulsion."
        feedback: |
          That is a faith-based argument about what the verse should mean. It does not date the verse. It is a legitimate argument inside a tradition, but not evidence for a claim of history.
      - text: "The fact that most Muslims hold the verse is not abrogated."
        feedback: |
          This shows what Muslims hold about the verse's force, which is a different question from when it was spoken or in what circumstances.
    explanation: |
      Label: **debate** (the dating), with evidence of the type historians use. The same verse has a historical question and a legal one (what it requires), and each needs its own evidence.

  - type: mcq
    id: p3-fair
    title: "A fair summary"
    prompt: |
      A Muslim, a historian and a sceptic read 2:256 together. Which summary would each accept as fair?
    options:
      - text: "The words are agreed. The occasion is reported by tradition and its age is debated. How wide the verse reaches is disputed among Muslims, with reasons on each side. Whether the verse is God's speech is a faith commitment that the historian's tools do not test."
        correct: true
        feedback: |
          Yes. Each can accept it because it names whose claim each sentence is, and none of it asks a reader to give up their layer-three commitment.
      - text: "The verse shows Islam teaches religious freedom, as every honest reader must conclude."
        feedback: |
          This pronounces one reading of the debate as the only honest one. Muslims differ on the width of the verse, and a fair summary reports that.
      - text: "The verse shows Islam teaches coercion, since it has been said that it was abrogated."
        feedback: |
          This picks one reading as if no other existed. Most scholars hold the verse is not abrogated, and the abrogation view has its own defenders and its own objections.
    explanation: |
      Neither pronouncement is fair: each takes one side of a dispute inside the tradition and presents it as the verse's meaning.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      The setting: a dated leaf of the Qur'an, a set of hadith, and one verse (Qur'an 2:256, Sahih International). Every claim below is made *according to* someone, and sits in one of three layers: established fact, scholarly debate, or faith commitment.

      - **A radiocarbon date is a date for the skin.** In the invented case the calibrated range was $600$ to $680$ CE at $95.4\%$. The writing cannot be older than the animal, and the text copied cannot be younger than the writing:
      $$t_{\text{skin}}\le t_{\text{writing}}$$
      and
      $$t_{\text{text}}\le t_{\text{writing}}$$
      So a leaf sets a **ceiling** on how late the text can be, not a floor on how early. According to Sinai it fits an early standard text; according to Wansbrough's followers it must be shown to hold the full text.
      - **A variant reading is a different reading, not a different book.** The two readings of 1:4 (*malik*, "king", and *mālik*, "owner") share one written skeleton. According to Muslim scholars both are authentically reported; according to historians the shared skeleton points to a common early text.
      - **A common link dates a spread, not a source.** If every chain to a collector passes through one narrator who died in $740$, then
      $$\text{gap}=t_{\text{common link}}-632$$
      which is $740-632=108$ years.
      According to Schacht the link, or a pupil, may have made the saying; according to Motzki, comparing the wording of the pupils' versions can push the date back (to $700$ here, $40$ years earlier). A late collection does not mean late contents.
      - **Grading is a checklist.** According to Ibn Hajar, a hadith is **sahih** when the chain is connected, the narrators upright and precise, and there is no hidden defect and no oddity; if precision is only lighter, **hasan**.
      - **One verse, three kinds of claim.** In Qur'an 2:256 ("There shall be no compulsion in [acceptance of] the religion"), a classical commentator's occasion report, a historian's date, and a modern scholar's reading answer different questions. Muslims differ: general prohibition, limited to a group, or abrogated. What would settle each is **different evidence**, and faith commitments are not settled by manuscripts.

      **Next:** part 2 takes a case from kalam or law (for example Ghazali and Averroes on whether fire causes burning, or a ruling reached by analogy against one reached by reason) and a closing weighing of the three layers across Islam and the Qur'an.
