id: ch16-kalam
title: "Kalam and Philosophy: Ghazali, Avicenna, Averroes"
kind: concept
own: |
  The question: if God made and knows everything, how do reason and revelation fit together, and are natural causes real? Everything is taught according to someone: the schools and thinkers named, and historians.
  - **Kalam.** *Kalam* (Arabic "speech") is {{ Islamic theology by argument }}: rational defence and analysis of belief. Early debates concerned free will, God's attributes and whether the Qur'an is created. The Mu'tazila (founder Wasil ibn Ata, d. 748) held that the Qur'an is created, to protect God's unity and justice; Ash'ari (874 to 936) and traditionalists such as Ahmad ibn Hanbal (780 to 855) held that God's speech is eternal and not created. The state inquisition (*mihna*) under al-Ma'mun began in 833 and was ended under al-Mutawakkil.
  - **Falsafa and Avicenna.** *Falsafa* is philosophy in the Greek tradition written in Arabic. Ibn Sina (Avicenna, c. 980 to 1037) separated what could be or not be (contingent) from what exists through itself (necessary):
  $$\text{contingent being}\ \Rightarrow\ \text{an external cause is needed}$$
  {{ $$\text{chain of contingents}\ \Rightarrow\ \text{a necessary existent, identified with God}$$ }}
  - **Ghazali.** In *The Incoherence of the Philosophers* (about 1095) al-Ghazali (about 1056 or 1058 to 1111) attacked Avicenna's doctrines in twenty discussions. He charged unbelief on three: the {{ world having no beginning in time, God knowing only universals and not particulars, and the denial of bodily resurrection }}. On causation he denied that the link between cause and effect is necessary: when fire meets cotton, God is the real cause of the burning.
  $$\text{fire touches cotton, then cotton burns:}\quad \text{observed together, not logically necessary}$$
  - **Averroes.** Ibn Rushd (Averroes, 1126 to 1198) replied in *The Incoherence of the Incoherence* (c. 1180) that if created things have no real power, {{ knowledge, which is knowing things through their causes, is undermined }}. In the *Decisive Treatise* he held that demonstrated truth and revelation do not contradict, and that when they seem to, scripture is read by *ta'wil* (non-literal interpretation) by those trained for it.
  $$\text{demonstration}\ \text{and}\ \text{revelation}\ \Rightarrow\ \text{no true conflict (if read rightly)}$$
  - **Three layers.** Established: the thinkers, works, dates and the inquisition happened. Live debate: how far Ghazali's critique shaped later philosophy (scholars now reject the idea that he "ended" it) and how close he is to Hume. Commitment: whether God acts directly or through real causes, and how far reason may interpret scripture.

cards:
  - type: mcq
    id: hook
    title: "Guess: reason or revelation first?"
    prompt: |
      Guessing is the point. A believer holds that God knows everything and can do anything. Fire touches cotton and the cotton burns. Medieval thinkers in the Muslim world asked: does fire really make the cotton burn, or does God burn it each time, so that fire is only the occasion? And more generally, if reason and scripture seem to disagree, which gives way? What would you expect?
    options:
      - text: "Thoughtful people held several answers, and each rested on a serious concern: protecting God's power and freedom, or protecting the reality of the natural order and the force of reason."
        correct: true
        feedback: |
          Yes. This lesson follows three thinkers who gave different answers, all inside the same faith, and asks which premise each rests on.
      - text: "Only unbelievers asked such questions; believers just followed scripture."
        feedback: |
          The questions were asked by devout scholars, often to defend belief. Whether reason has a role in faith was a debate inside the tradition.
      - text: "Everyone agreed that reason must always give way to scripture."
        feedback: |
          Some held something close to this. Others held that a demonstrated truth cannot contradict revelation, so scripture must be read differently. Both camps were believers.
    explanation: |
      Keep three layers apart: what happened (history), what scholars debate, and what believers or sceptics commit to. We teach each position according to its own defenders.

  - type: text
    id: kalam
    title: "Kalam: speech about God"
    body: |
      *Kalam* is Arabic for "speech" or "discussion". It names a tradition of Islamic theology that defends and analyses belief by argument; its practitioners are called *mutakallimun*. The early debates were not about whether God exists but about questions that scripture raises without settling:

      - **Free will.** If God knows and decrees everything, are people responsible for what they do?
      - **God's attributes.** The Qur'an speaks of God's knowledge, power and speech. Are these parts of God, and if so, is God still one?
      - **The Qur'an.** Is it God's speech created at a time, or eternal?

      Recall the lesson The Kalam Argument: it argues from a beginning of the universe to a cause, and was named after this tradition. Here we meet the tradition itself, and its debates were about God and scripture more than about the universe.

  - type: text
    id: mutazila
    title: "Two answers: Mu'tazila and Ash'ari"
    body: |
      The **Mu'tazila** were a school of rationalist theologians; according to tradition its founder was **Wasil ibn Ata** (died 748). They put God's *justice* and God's *unity* first. They held that people really author their acts (otherwise punishing them would be unjust) and that the Qur'an is created: if it were eternal, something besides God would be eternal too, and God's unity would be compromised.

      **Al-Ash'ari** (874 to 936) was himself first a Mu'tazilite. According to the traditional account, he left them and became one of their leading critics. He and the traditionalists put God's *power* and the plain sense of scripture first. Their argument: God's speech belongs to God, as does God's knowledge, and God's knowledge is eternal, so God's speech is eternal and not created.

  - type: text
    id: mihna
    title: "The Mihna: when a doctrine became a test"
    body: |
      Under the caliph **al-Ma'mun** (ruled 813 to 833) Mu'tazili views became the official doctrine. In **833** he began the *mihna*, an inquisition ("test") in which officials, judges among them, had to say that the Qur'an was created. It was continued by his successors al-Mu'tasim and al-Wathiq and was ended by al-Mutawakkil; sources differ on the exact year, between about 847 and 851.

      **Ahmad ibn Hanbal** (780 to 855), the Baghdad scholar for whom the Hanbali school is named, refused to say it. He was imprisoned and flogged; popular feeling in Baghdad ran strongly in his favour, and he was released. For many Sunni Muslims he became the figure who stood by the plain words of scripture against the state. Historians stress that the mihna was a political and religious event: a caliph claiming authority over doctrine, and scholars refusing it.

  - type: mcq
    id: motives
    title: "What was each side protecting?"
    prompt: |
      In the debate over the Qur'an, the Mu'tazila said it was created and the traditionalists said it was not. According to their own arguments, what was each side mainly trying to protect?
    options:
      - text: "The Mu'tazila protected God's unity, since an eternal Qur'an would be something besides God that is eternal; the traditionalists protected the Qur'an's status as God's own speech, which is an attribute of God and so eternal."
        correct: true
        feedback: |
          Yes. Both sides wanted to honour God and scripture. They differed on which premise should govern: strict unity, or that speech and knowledge belong to God.
      - text: "The Mu'tazila wanted to lower the Qur'an's authority, and the traditionalists wanted to raise it."
        feedback: |
          The Mu'tazila did not think the Qur'an was less authoritative. They held it was God's word and also that it was created. Reading their view as hostility to scripture is a caricature.
      - text: "The traditionalists wanted to defend free will, and the Mu'tazila wanted to defend predestination."
        feedback: |
          It is the other way round. The Mu'tazila defended human free will as part of God's justice, and the Ash'ari and traditionalists stressed God's power over all acts.
    explanation: |
      Steelmanning both: the Mu'tazila say that without strict unity monotheism erodes; the traditionalists say that reasoning should not dilute what scripture says plainly. The disagreement is about method and premises, not about faith versus unbelief.

  - type: text
    id: avicenna
    title: "Falsafa: Avicenna"
    image:
      src: img/avicenna.webp
      alt: Old miniature-style portrait of a bearded man in a turban and robes
      caption: Ibn Sina (Avicenna, c. 980 to 1037), shown in a later artist's portrait; no likeness from his lifetime is known.
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Avicenna-miniatur.jpg"
    body: |
      *Falsafa* means philosophy, in the Greek tradition (Aristotle above all), written in Arabic. Its great figure is **Ibn Sina**, known in Latin as **Avicenna** (c. 980 to 1037), a philosopher and physician from the region of Bukhara whose *Book of Healing* covers logic, physics, the soul and metaphysics.

      Avicenna separated things that **could** exist or not exist (contingent) from what exists **through itself** (necessary). A contingent thing becomes actual only through something outside it. A chain of contingent things, he argued, needs something that is necessary through itself, and that necessary existent is God. Recall the lesson Guided proof: The Cosmological Argument; this is the family of argument it called contingency, and the reasoning does not depend on the world having a beginning.

      He also wrote the *Flying Man*: imagine a person created suddenly, suspended in the air, with no sensation of body or the world. He would still be aware that he exists, which, Avicenna argued, shows that the self is not just the body.

  - type: mcq
    id: avicenna-vs-kalam
    title: "Avicenna's argument and a beginning"
    prompt: |
      Avicenna's argument runs: contingent things need an external cause, a chain of contingent things needs a necessary existent. The kalam argument (as defended by William Lane Craig) runs: whatever begins to exist has a cause; the universe began to exist. What is the difference in the key premise?
    options:
      - text: "Avicenna's argument asks why a contingent thing exists at all, even if it has always existed, so it does not need a beginning in time; the kalam argument needs the universe to have a beginning."
        correct: true
        feedback: |
          Yes. For Avicenna a world with no beginning could still depend, at every moment, on a necessary cause. This is why he is regarded as a philosopher of "dependence", and the kalam as a philosopher of "beginning".
      - text: "Both need the world to have a first moment."
        feedback: |
          Only the kalam argument does. Al-Ghazali read the philosophers as holding an eternal world (the next cards), with God as the cause of its existence rather than of a starting.
      - text: "Avicenna's argument was about the soul, not about the world."
        feedback: |
          The Flying Man is about the soul, but the contingency argument is about the world and God. Two different arguments by the same thinker.
    explanation: |
      Which premise a critic rejects differs. Against Avicenna one asks why a chain of contingent things needs more than itself; against the kalam one asks whether the universe began and whether a beginning needs a cause.

  - type: text
    id: ghazali
    title: "Al-Ghazali's Incoherence"
    image:
      src: img/ghazali.webp
      alt: Pen and ink sketch of a bearded man in a large turban
      caption: A modern sketch of al-Ghazali, the theologian and jurist who wrote against the philosophers; no likeness from his lifetime is used here.
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Al-Ghaz%C4%81l%C4%AB,_Sayr_mulhimah_min_al-Sharq_wa-al-Gharb.png"
    body: |
      **Al-Ghazali** (1058 to 1111; some sources put his birth about 1056) was a jurist and theologian who taught at the Nizamiyya college in Baghdad. Around **1095** he wrote *The Incoherence of the Philosophers* (*Tahafut al-falasifa*), after studying the philosophers, mainly Avicenna, closely. The book has twenty discussions: sixteen on metaphysics and four on natural science. According to al-Ghazali the philosophers failed to meet their own standard of proof.

      On three points he went further and said that teaching them publicly amounts to unbelief (*kufr*):

      1. that the world has **no beginning** in time;
      2. that God knows only **universals** (kinds), not particular events;
      3. that there is no **bodily** resurrection, only a spiritual one.

      The other doctrines he called errors but not unbelief.

  - type: mcq
    id: ghazali-fair
    title: "What did Ghazali accept?"
    prompt: |
      Which description of al-Ghazali's attack is fair?
    options:
      - text: "He used logic, which he praised, to argue that the philosophers did not prove their metaphysics, while leaving physics, mathematics and logic standing."
        correct: true
        feedback: |
          Yes. He criticised philosophy by its own standards of demonstration; he did not reject reasoning or the other sciences.
      - text: "He rejected all reasoning and all knowledge outside scripture."
        feedback: |
          He wrote works on logic and an account of the philosophers' own views. His quarrel was with the claims of metaphysics, not with reason.
      - text: "He accepted the philosophers' view of God's knowledge but rejected their view of the soul."
        feedback: |
          He rejected both the claim that God knows only kinds and the denial of bodily resurrection. These were two of his three charges.
    explanation: |
      Scholars note that his attack on metaphysics went alongside a lasting place for logic in later theology. One cannot read him as simply an enemy of reason.

  - type: text
    id: causation
    title: "Cotton and fire"
    body: |
      The seventeenth discussion is about causation. We see cotton touch fire and burn, and we say fire caused the burning. Al-Ghazali asks what we have actually observed. We see one thing after another, but not the necessity that is claimed to link them.

      He then says that, according to him, the link between what is usually called cause and effect is not **necessary**. A world where fire touches cotton and the cotton does not burn is conceivable, and so possible for God. He holds that God is the real cause of the burning, either directly or through angels. The regularity is, in this view, the habit of God's action, which God could set aside, and that is why he takes miracles to be possible.

      Scholars disagree on how far he held **occasionalism**, the view that created things have no causal power and God acts directly on each occasion. Some read the discussion as committed to it; others read it as laying out occasionalism as one option, next to a view in which created causes act by God's will. That reading says what he denied was *necessity*, not all causation.

  - type: mcq
    id: ghazali-law
    title: "Ghazali and a scientist's laws"
    prompt: |
      A scientist says: "Fire and cotton always behave the same way, which is what we mean by a law of nature." Al-Ghazali accepts the regularity. Which statement fairly states where they differ?
    options:
      - text: "He agrees the regularity holds and can be relied on; he denies that it is a necessity in the things themselves, since God's will is the real cause and could act otherwise. The scientist, as scientist, adds no claim about God either way."
        correct: true
        feedback: |
          Yes. The regularity is a fact (layer 1); whether it rests on necessity in things or on God's habit is metaphysics (layer 3). Science works the same either way, which is part of why both sides can use the same laws.
      - text: "He denies that fire and cotton behave regularly."
        feedback: |
          He accepts regularity and says God's habit is consistent. What he denies is that this makes it logically necessary.
      - text: "He is saying that science is impossible."
        feedback: |
          He does not say that. Scholars note that because he accepted regularity, his view leaves room for prediction and practice, while keeping room for miracles.
    explanation: |
      Compare David Hume, from the lesson Why the Sun Will Rise Tomorrow and the lesson Miracles and the Laws of Nature: he too said we observe succession but not necessary connection. Scholars compare the two but disagree on how close they are: Hume's argument is about what reason can know, and it led him to scepticism about religion, while al-Ghazali's aims to defend God's power and miracles.

  - type: text
    id: averroes
    title: "Averroes answers"
    image:
      src: img/averroes.webp
      alt: Pen and ink sketch of a bearded man in a turban
      caption: A modern sketch of Ibn Rushd (Averroes), the judge and philosopher from Cordoba who answered al-Ghazali; no likeness from his lifetime is used here.
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Ibn_Rushd,_Sayr_mulhimah_min_al-Sharq_wa-al-Gharb.png"
    body: |
      **Ibn Rushd**, known in Latin as **Averroes** (1126 to 1198), was born in Cordoba, was a judge (*qadi*) and later court physician to the Almohad caliph, and wrote commentaries on Aristotle so closely read in Europe that he was called "the Commentator". Around 1180 he wrote *The Incoherence of the Incoherence* (*Tahafut al-tahafut*) to answer al-Ghazali.

      His reply on causes: if created things have no real power of their own, then nothing can be known by its causes, and knowledge itself, understood as knowing things through their causes, is undermined; he defended real efficacy for created causes. Defenders of al-Ghazali answer that he did not deny causal regularity, only necessity, and that real knowledge of regularity is left.

      Averroes also argued, following Aristotle, that the world has always existed, and that this does not warrant a charge of unbelief.

  - type: mcq
    id: averroes-cause
    title: "A reply on causes"
    prompt: |
      Averroes holds that natural causes are real. Which sentence states his best argument against al-Ghazali's reading of fire and cotton?
    options:
      - text: "If fire has no power to burn, we can say nothing about what a thing is or does, and science, which explains things through their causes, loses its footing."
        correct: true
        feedback: |
          Yes. In his view denying causes makes knowledge, and also divine wisdom shown in an ordered world, unintelligible. A defender of Ghazali replies that regular habit gives all the knowledge science needs.
      - text: "Fire burns cotton because God has given up acting in the world."
        feedback: |
          Averroes was a believer who held that God is the first cause. He denied that created things lack real power, not that God exists and acts.
      - text: "Miracles are impossible, so occasionalism is false."
        feedback: |
          He had a different account of how scripture speaks of miracles; the argument here is about knowledge and causes, not about ruling miracles out.
    explanation: |
      Each side has a premise: for Ghazali, God's freedom must not be bound by necessity; for Averroes, a world without real causes cannot be known or be a sign of wisdom.

  - type: order
    id: dates
    title: "Order the thinkers"
    prompt: "Put these figures in the order they died, earliest first."
    steps:
      - "Ahmad ibn Hanbal (855)"
      - "al-Ash'ari (936)"
      - "Avicenna (1037)"
      - "al-Ghazali (1111)"
      - "Averroes (1198)"
    hint: "Ibn Hanbal lived in Baghdad when the mihna was running; al-Ghazali answers Avicenna and Averroes answers al-Ghazali."
    explanation: |
      Each answers an earlier one: al-Ash'ari answers the Mu'tazila, al-Ghazali answers Avicenna, and Averroes answers al-Ghazali, about 85 years after the Incoherence of the Philosophers was written.

  - type: mcq
    id: eternity
    title: "An eternal world and a beginning"
    prompt: |
      Which pairing is correct about the world's beginning?
    options:
      - text: "Avicenna and Averroes, following Aristotle, held that the world has always existed and depends on God; al-Ghazali held that it began, and charged the contrary view with unbelief. The kalam argument takes al-Ghazali's side of this question and tries to show a beginning from philosophy."
        correct: true
        feedback: |
          Yes. The kalam argument you met in the lesson The Kalam Argument is thus a move in this old debate: it grants that whatever begins needs a cause and argues that the universe began.
      - text: "All three held that the world began at a first moment."
        feedback: |
          Avicenna and Averroes did not. For them an eternal world was fully compatible with God as its cause.
      - text: "Averroes held that the world is eternal and so there is no God."
        feedback: |
          He held that God is the first cause of an eternal world. An eternal world and a divine cause were compatible for him.
    explanation: |
      Layer 2 and 3: whether a beginning can be proved, and whether an eternal world is compatible with the Qur'an, are debated. Modern physics adds its own question, discussed in the lessons on the beginning of the universe.

  - type: text
    id: tawil
    title: "Ta'wil: reading beyond the letter"
    body: |
      When reason and the plain words of scripture seem to disagree, what then? **Ta'wil** is interpretation that moves a word from its plain sense to another sense the language allows, for example "the hand of God" read as God's power. According to Averroes's *Decisive Treatise* (1178), scholars summarise his view this way:

      - truth does not contradict truth, so a sound demonstration cannot truly conflict with revelation;
      - when it seems to, scripture is read by *ta'wil*;
      - people differ in training: most should take scripture in its plain sense; those trained in demonstration may interpret it; and interpretations should not be pressed on those not prepared for them.

      Literalists reply that this puts philosophers above scripture and that the plain sense is what the community received. Averroes's defenders reply that apparent conflicts must be resolved somehow, and that careful non-literal reading by the trained is the way that keeps both.

  - type: mcq
    id: tawil-q
    title: "Does ta'wil mean scripture is wrong?"
    prompt: |
      A critic says that Averroes taught a "double truth": religion says one thing, philosophy another, and both are true. According to scholars of his work, what is the fair reply?
    options:
      - text: "He held that there is one truth, reached in different ways: demonstration for philosophers, persuasion and example for most people. A conflict is only apparent and is resolved by reading scripture non-literally. The label 'double truth' came from later opponents."
        correct: true
        feedback: |
          Yes. Scholars note that no author of a double truth doctrine in this sense has been found; it appears in the writings of opponents.
      - text: "He taught that philosophy is false when it disagrees with scripture."
        feedback: |
          He taught the opposite: a demonstrated result is not given up, and scripture is read to agree with it.
      - text: "He taught that scripture is only for the uneducated and has no truth for philosophers."
        feedback: |
          He held that scripture carries truth for all, in forms fit for each class of reader.
    explanation: |
      Whether this model protects scripture or lets reason override it is where critics and defenders part, as the closing card says.

  - type: mcq
    id: traps
    title: "Two common mistakes"
    prompt: |
      Which statements are mistakes? Select all that apply.
    multiple: true
    options:
      - text: "Al-Ghazali's book ended philosophy in the Muslim world."
        correct: true
        feedback: |
          Modern historians reject this story. Philosophy continued after him, in new forms that engaged his critique; some historians even say his critique shaped it. How large his role was is still debated.
      - text: "Averroes was a secular thinker who rejected religion."
        correct: true
        feedback: |
          He was a Muslim judge who held that the law is true and held that the law is true. Calling him secular reads a later European meaning back into him.
      - text: "Al-Ghazali accepted that fire and cotton regularly behave the same way."
        feedback: |
          This is true. He denied necessity, not regularity.
      - text: "The Mu'tazila and their opponents were all believers who differed about God and scripture."
        feedback: |
          True. The debates were inside the faith.
    explanation: |
      Two myths: one says a single book killed philosophy, the other makes Averroes a modern secularist. Both flatten a longer, more varied story.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      First: **does reason or revelation govern?** Mu'tazila, Averroes and many modern rationalists give reason a large role in interpreting scripture; traditionalists and literalists hold that plain scripture should limit speculation. This rests on a value and a premise about how a text is best read.

      Second: **are natural causes real?** Occasionalists protect God's freedom and miracles; defenders of real causes protect the intelligibility of nature. Science uses regularities either way, so this is a metaphysical choice (layer 3).

      Third: **can the world's beginning be shown?** Al-Ghazali and the kalam tradition say yes; Avicenna and Averroes say an eternal world is coherent and depends on God. The evidence from physics is discussed elsewhere in the course, and a sceptic asks whether premises such as "whatever begins has a cause" reach so far. None of these questions is settled by the history, and thoughtful believers of different views hold each side.

  - type: text
    id: summary
    body: |
      **Next:** the mystical path in Islam, Sufism: what the inner life of devotion looked like, and how it was received.
