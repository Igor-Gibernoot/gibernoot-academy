id: ch16-quran
title: "The Qur'an: Revelation and Compilation"
kind: concept
own: |
  The question: how did the Qur'an, the scripture of Islam, pass from words first heard aloud to the written text read today? Everything is taught according to someone: the Muslim tradition (which holds the words were revealed to Muhammad and then carefully gathered), the early manuscripts themselves (physical evidence), and modern historians (who weigh both).
  - **The tradition's account.** According to Muslim tradition the Qur'an ("recitation") was revealed to Muhammad in parts over about {{ 23 years }} (610 to 632) through the angel Gabriel, and is divided into 114 chapters (*surahs*) of verses (*ayahs*).
  - **Collection.** According to a report in the hadith collection of al-Bukhari, Abu Bakr (first caliph) had Zayd ibn Thabit gather the scattered written and memorized material into sheets, which later passed to Hafsa, Umar's daughter. Under Uthman (caliph 644 to 656), after disputes over recitation, Zayd and others made copies from them, sent {{ copies to the main cities }}, and had other versions burned.
  - **Early manuscripts.** Two leaves in Birmingham (parts of surahs 18 to 20, early Hijazi script) were radiocarbon dated to 568 to 645 CE at 95.4% confidence; a leaf of the Sanaa palimpsest to 578 to 669. A radiocarbon date gives the age of the {{ parchment (the animal) }}, not the day the text was written, so it sets a limit and does not settle the date.
  - **Readings.** Medieval scholars accepted more than one authoritative reading (*qira'at*) of many words; Ibn Mujahid (died 936) listed {{ seven }} canonical ones. They concern the consonantal skeleton (*rasm*) read with different vowels or dots, not whole different books.
  - **The scholarly debate.** Wansbrough (1977) argued the text closed only about the end of the eighth century; Sinai (2014) concludes the traditional early date should be the default, with some correction possible until about 700; Neuwirth reads text and community as growing together; Donner argues for an early fixed corpus. They differ on one premise: {{ how much a late tradition can be trusted about early events }}.
  - **Three layers.** Established: the manuscripts and their radiocarbon dates; the existence of the readings. Live debate: when exactly the text was fixed. Commitment: that the words are God's revelation (Muslims affirm it; historians as historians neither affirm nor deny it).

cards:
  - type: mcq
    id: hook
    title: "Guess: a message heard aloud"
    prompt: |
      Guessing is the point; no background is needed. A message is first spoken aloud, in pieces, over many years, to people who mostly do not write. Its followers want it kept exactly. What would a community most reasonably do?
    options:
      - text: "Memorize and recite it together so that many people hold the same words, and also write it down as soon as writing is practical, comparing the copies."
        correct: true
        feedback: |
          A good guess, and close to what the tradition reports for the Qur'an: reciters who held it in memory, and written sheets. Each checks the other, and the lesson looks at how well the record shows it.
      - text: "Rely on memory alone: writing would only add mistakes."
        feedback: |
          Memory is strong in oral cultures, but a few reciters can die or differ. Writing gives a fixed copy to compare with, and that is part of the story told here.
      - text: "Wait several centuries until scholars can reconstruct the best version."
        feedback: |
          A community that holds a message sacred usually acts at once. What came later was study, not the first keeping.
    explanation: |
      Keep three layers apart: what the manuscripts establish, what historians debate, and what a tradition holds by faith. Muslims hold that the Qur'an is God's word; historians as historians ask how the text was kept and written, and that is the subject here. Recall the lesson Muhammad and the Sources for His Life: the sources for his life are late, while the Qur'an is claimed to be much closer to him.

  - type: text
    id: tradition
    title: "The tradition's account of revelation"
    body: |
      The word **Qur'an** means "recitation": according to the Muslim tradition, the first command the angel **Gabriel** gave Muhammad in the cave of Hira, about 610 CE, was "recite". Muslims hold that the words were revealed to him in parts over about 23 years, until his death in 632, often in answer to events in his community. The Qur'an is divided into 114 chapters, each called a **surah**, made of verses, each called an **ayah**. The chapters are not set in the order they are held to have been revealed: they run roughly from the longest to the shortest.

      For Muslims the Qur'an is the word of God, not Muhammad's own composition, and its Arabic wording is part of that claim. Whether it is revelation is a matter of faith; historians as historians neither affirm nor deny it. This lesson asks a different question: how do we know how the words were kept and written down? On the life of the prophet, see the lesson Muhammad and the Sources for His Life.

  - type: mcq
    id: layers
    title: "Which layer?"
    prompt: |
      Consider two sentences. (A) "The Qur'an was revealed to Muhammad through the angel Gabriel." (B) "Some parchment leaves of the Qur'an survive that were radiocarbon dated to the seventh century." Which description is most accurate?
    options:
      - text: "(B) is a physical finding that anyone can check with the same laboratory methods; (A) is what the tradition holds, a statement of faith that radiocarbon and history cannot test either way."
        correct: true
        feedback: |
          Yes. Muslims affirm (A). A historian can report that the tradition says it, and can study the manuscripts, but a laboratory cannot detect an angel. (B) is open to anyone's check.
      - text: "Both are scientific claims, and the radiocarbon result in (B) therefore proves (A)."
        feedback: |
          A date for a parchment says when an animal died. It says nothing about where the words came from, so it neither confirms nor refutes (A).
      - text: "Neither can be known, since religious texts are beyond evidence."
        feedback: |
          Too broad. The age of a parchment is an ordinary measurable fact. Only the claim about its ultimate source is outside the reach of such methods.
    explanation: |
      "According to the tradition..." reports what a community holds without endorsing or denying it. Believers and historians can both accept (B); only believers affirm (A).

  - type: text
    id: collection
    title: "Collection: Abu Bakr and Uthman, according to the tradition"
    body: |
      According to a report in the collection of hadith (short accounts of what the prophet and his companions said or did) by **al-Bukhari**, the Qur'an at Muhammad's death existed in the memories of reciters and in scattered written form. After many reciters were killed in battle, **Umar** urged the first caliph, **Abu Bakr**, to gather it, and Abu Bakr charged **Zayd ibn Thabit** with doing so. The sheets stayed with Abu Bakr, then Umar, then **Hafsa**, Umar's daughter.

      The same collection reports that under the third caliph, **Uthman** (ruled 644 to 656), a companion named **Hudhayfa** came back from a military campaign alarmed that soldiers from Syria and from Iraq were reciting differently. Uthman asked Hafsa for the sheets, and Zayd and other men copied them into complete books. They were told to write in the dialect of the Quraysh where they disagreed with Zayd. Copies were sent to the main cities, and, according to the report, other versions were burned. Because of this, Muslims often call the standard text the Uthmanic codex.

  - type: order
    id: stages
    title: "Order the stages"
    prompt: "According to the tradition's account, put these in order, earliest first."
    steps:
      - "Revelation is received in parts over about 23 years, and companions hold it in memory and in scattered written form"
      - "After many reciters are killed in battle, Abu Bakr has Zayd ibn Thabit gather the material into sheets"
      - "The sheets pass to Umar, then to his daughter Hafsa"
      - "Hudhayfa warns Uthman that soldiers from Syria and Iraq recite differently"
      - "Uthman has copies made from Hafsa's sheets and sent to the main cities"
    hint: "Think of cause and effect: the worry about lost reciters comes before the sheets, and the quarrel over recitation comes before the copies."
    explanation: |
      Each step answers a worry: reciters dying, then differences between regions. This is the tradition's own account, preserved in Arabic sources written down later. Historians ask how much of it reaches back to the events, which is why the physical manuscripts matter.

  - type: mcq
    id: why-uthman
    title: "What problem was solved?"
    prompt: |
      According to the tradition, what was Uthman's copying meant to fix?
    options:
      - text: "Differences in how the same text was recited in different regions, by giving the cities one written standard to compare with."
        correct: true
        feedback: |
          Yes: the report puts the trigger in the quarrel between soldiers from Syria and Iraq. The remedy is a common written reference.
      - text: "The fact that nothing of the Qur'an had been written before his reign."
        feedback: |
          The account itself says Zayd had sheets from Abu Bakr and Umar. Uthman's step was to copy and distribute, not to invent writing.
      - text: "A decision to add new chapters to make the book more complete."
        feedback: |
          The tradition says the opposite: copying from the existing sheets, and removing rival versions, not adding material.
    explanation: |
      Notice what the story claims and what it does not: it says a common standard was made and spread. It does not by itself prove it. Historians test it against early manuscripts.

  - type: text
    id: birmingham
    title: "Early manuscripts: Birmingham"
    image:
      src: img/birmingham-quran.webp
      alt: "A parchment leaf of the Birmingham Qur'an manuscript, covered with lines of early Arabic script"
      caption: "A leaf of the Birmingham manuscript, with parts of surahs 18 to 20 in early Hijazi script; the University of Birmingham reports a radiocarbon date for the parchment of 568 to 645 CE at 95.4% confidence."
      credit: "Anonymous Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Birmingham_Quran_manuscript_folio_1_recto.jpg"
    body: |
      The physical evidence is old parchment. Two leaves held by the University of Birmingham, bought in the 1930s by the scholar Alphonse Mingana, carry parts of surahs 18 to 20 in **Hijazi**, an early form of Arabic script. In 2015 the university reported that radiocarbon dating at the Oxford Radiocarbon Accelerator Unit placed the parchment between 568 and 645 CE with 95.4% confidence. The university itself says that it is impossible to say whether this is the oldest Qur'an manuscript in the world.

      Radiocarbon dating measures how much carbon-14 is left in material that was once alive, here the animal skin. A range such as 568 to 645 is a statement about probability: about 95 chances in 100 that the true date lies inside it.

  - type: numeric
    id: gap
    title: "How far past 632?"
    prompt: |
      Muhammad died in 632 CE. The radiocarbon range for the Birmingham parchment is 568 to 645 CE. By how many years does the late end of the range pass the year of Muhammad's death?
    answer: 13
    wrong:
      - value: 64
        feedback: |
          That is 632 - 568, how far the early end of the range lies before the death, not past it.
      - value: 77
        feedback: |
          That is the full width of the range, 645 - 568, not the distance beyond 632.
    hint: "Both numbers are CE years: subtract the death year from the late end of the range."
    explanation: |
      645 - 632 = 13 years. The early end, 568, lies 632 - 568 = 64 years before the death. So the range covers both Muhammad's lifetime and the years just after it. It does not tell where in the range the writing falls, which is the next card.

  - type: mcq
    id: dating-limits
    title: "What a radiocarbon date can and cannot say"
    prompt: |
      A critic of the Birmingham result notes that radiocarbon dates the animal skin, not the text, and that the range reaches back to 568. What is the most careful conclusion?
    options:
      - text: "The parchment is probably from the seventh century; the text was written after the animal died, perhaps soon after but not necessarily, so other evidence (script, spelling, verse markers) must narrow it."
        correct: true
        feedback: |
          Right. The date is a lower limit for the writing, not a date of writing. Scholars cited in the press coverage, such as David Thomas, made this point, and others have argued from the script and verse markers that the text could be somewhat later. Several lines of evidence together decide.
      - text: "The text was written in Muhammad's lifetime, since 568 is before 632."
        feedback: |
          The range also runs to 645, after his death, and the animal may have died before the scribe wrote. A range endpoint is not a writing date.
      - text: "Radiocarbon is useless here because it cannot date parchment."
        feedback: |
          It can date parchment, within a range. The limits are in what it measures, not in whether it works.
    explanation: |
      Good practice is to combine physical dating (radiocarbon), handwriting style (palaeography), spelling and decoration. No single method gives the writing date alone.

  - type: text
    id: sanaa
    title: "Early manuscripts: the Sanaa palimpsest"
    body: |
      A **palimpsest** is a parchment page whose first writing was scraped or washed off and written over. In 1972, during restoration work in the Great Mosque of Sanaa in Yemen, a hoard of old Qur'an fragments was found. Some are palimpsests. Their upper text matches the standard Uthmanic text; the faded **lower text** is an earlier writing underneath. A radiocarbon test of one leaf from the same manuscript gave a range of 578 to 669 CE at 95%.

      Scholars agree that the lower text differs here and there from the standard text. They disagree about what it means. Behnam Sadeghi and Uwe Bergmann (2010) argued that it represents an independent early textual tradition, and that reading is itself contested. Others note that, by the tradition's own account, early copies differed and Uthman's standard text was made to reduce such differences, so a different early copy does not show that the standard text came later. One reading of the same page, two conclusions: the question is which premise each starts from.

  - type: text
    id: qiraat
    title: "Readings: the qira'at"
    body: |
      Arabic of the time was written with a **consonantal skeleton** (*rasm*): letters without the short vowels and, in many cases, without the dots that tell similar letters apart. According to Britannica, the standardization of Uthman applied to this skeleton, and medieval scholars accepted more than one authoritative reading of many words. A reading is called a ***qira'a*** (plural *qira'at*): a recognised way of pronouncing and pointing the skeleton, passed down by chains of teachers.

      In Baghdad, **Ibn Mujahid** (died 936) wrote a book listing **seven** readings, drawn from seven earlier masters; later scholars added others, with lists of ten and fourteen. Why he chose seven is not documented, and scholars still debate whether he meant to exclude other readings.

  - type: mcq
    id: variants
    title: "What variant readings show"
    prompt: |
      Someone says: "There are ten canonical readings, so the Qur'an has ten different versions and no one knows the original." Which reply is fairest?
    options:
      - text: "The readings are different ways of reading one shared skeleton, accepted together by the tradition; whether this is a strength (a controlled range) or a problem (so the text was never uniform) depends on the premise, and the manuscripts help test it."
        correct: true
        feedback: |
          Yes. It keeps what is established (the readings exist and share the skeleton) separate from how it is read. Believers see a preserved, authorised range; some critics see a sign that the text kept being shaped. Both can start from the same facts.
      - text: "The readings prove that nothing in the Qur'an can be trusted."
        feedback: |
          They concern how a shared skeleton is read, mostly small matters of vowels and dots. They are not different books, so this overstates them.
      - text: "The readings are of no interest to historians, because the faith settles it."
        feedback: |
          Faith and history ask different questions. A historian can still ask when and how the readings arose, and several scholars do.
    explanation: |
      The key distinction is between the skeleton, which the tradition says Uthman's copies fixed, and the pointing, which allowed several authorised ways to read. Whether the skeleton itself closed early is the next card's debate.

  - type: text
    id: scholars
    title: "Scholars side by side"
    body: |
      When did the consonantal skeleton reach its fixed form? Four voices, each according to their own work.

      **John Wansbrough** (*Quranic Studies*, 1977) argued from literary form that the text came to a closed canon only gradually, about the end of the eighth century, long after the tradition says. Most later scholars do not accept this very late date. **Nicolai Sinai** (2014) concluded that the traditional date, under Uthman, should be the default, with some parts perhaps corrected or added until about 700. **Angelika Neuwirth**, who started the Corpus Coranicum project with Sinai and others, reads the text as having grown together with the early Muslim community in a process of communication, and treats the later codified form as a final stage of that process. **Fred Donner** (*Narratives of Islamic Origins*, 1998) is cited as arguing for an early fixed corpus, against late-canon theories such as Wansbrough's. Reading the same early manuscripts, a 2019 study by Marijn van Putten found a pattern of shared spelling oddities that it argued points to a single written ancestor of the text.

      So most scholars place the fixing in the seventh century; they differ over how early, and over how much the tradition's story may be trusted.

  - type: mcq
    id: premise
    title: "Where do they differ?"
    prompt: |
      Wansbrough puts the fixing about the end of the eighth century; Sinai puts it under Uthman or soon after. What is the central premise on which they differ?
    options:
      - text: "How far later Arabic tradition, written after 750, can be trusted about what happened in the 640s, and how much weight early manuscripts and internal features of the text should carry against it."
        correct: true
        feedback: |
          Yes. Wansbrough doubted the later narrative stories and relied on literary form; Sinai argues the tradition's core is supported by manuscripts and by the text itself. It is a dispute about which evidence deserves most weight.
      - text: "Whether God exists, since the date depends on it."
        feedback: |
          Neither work rests on that. Historians of every belief hold views on both sides, and the dispute is about sources and method.
      - text: "Whether the Qur'an has 114 surahs, which they count differently."
        feedback: |
          The number of surahs is not in dispute. The dispute is about the date of fixing and the reliability of the sources.
    explanation: |
      Naming the premise lets two sides disagree usefully: each can say what new evidence (a manuscript, a dated inscription) would make them change their date.

  - type: text
    id: views
    title: "The Muslim view and the historian's questions"
    body: |
      According to Muslim tradition, the Qur'an has been preserved as it was revealed, by memory and by writing, through a chain of reciters that continues today. Many Muslims add that the existence of the readings and the care taken over them is itself part of that preservation. For believers this is a statement about God's protection of the text, so it is not something a manuscript can confirm or refute.

      A historian asks narrower questions that anyone can ask, whatever they believe: which parts of the tradition's story do the manuscripts support (the Uthmanic copies and the text's wording seem to), what does the earliest physical evidence say (the Birmingham and Sanaa leaves), and what is left uncertain (the exact date and process of fixing). Some Muslim scholars take part in this work too. The two ways of reading the text do not need to compete, but they should not be mixed up.

  - type: mcq
    id: fair
    title: "Which statement is fair?"
    prompt: |
      Which of these statements about the Qur'an's history is stated fairly, naming its source?
    options:
      - text: "According to the Muslim tradition the Qur'an was gathered under Abu Bakr and copied under Uthman; historians test this against early manuscripts and mostly place the fixing of the text in the seventh century, with debate over how early."
        correct: true
        feedback: |
          Yes: it labels the tradition's account as the tradition's, and reports where historians stand, with the live debate marked as live.
      - text: "The Qur'an was written by Uthman, as historians have proved."
        feedback: |
          No historian says it was authored by him; the tradition says he had existing material copied. "Proved" also overstates what the evidence reaches.
      - text: "The Qur'an was shaped over centuries, which is the consensus of scholars."
        feedback: |
          That is Wansbrough's view of 1977, which most later scholars do not accept. Calling it the consensus is wrong.
    explanation: |
      The pattern from the course: say whose claim it is, mark what is established and what is debated, and do not turn a faith claim or a minority view into a settled fact.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the Qur'an as literature. The lesson The Qur'an as Literature and the Claim of Inimitability looks at its style and structure, and at the argument, made by Muslim tradition, that it cannot be imitated, stated fairly and beside its critics.
