id: ch16-law
title: "Law, Schools and the Sunni and Shia Paths"
kind: concept
own: |
  The question: after Muhammad's death in 632 CE, how did Muslims decide new cases, and why did the community divide into Sunni and Shia paths? Everything is taught according to someone: Sunni jurists, Shia jurists, and historians.
  - **Sharia and fiqh.** According to Muslim tradition, *sharia* ("the path") is {{ God's way for human life as a whole }}; *fiqh* is the human, scholarly work of working out its rulings, so it can differ between scholars. Sharia is a method and a tradition of reasoning, not one written code.
  - **Sunni sources of law.** Classical Sunni jurists derive rulings from four sources: the {{ Qur'an, the sunnah (hadith), consensus (*ijma*) and analogy (*qiyas*) }}. In analogy a ruling is carried from a text to a new case that shares its cause (*illa*): wine is forbidden, and a new drink that intoxicates shares the cause, so it falls under the same ruling. Twelver Shia jurists use the Qur'an and sunnah (which for them includes the reports of the Imams), consensus, and reason (*aql*) in place of analogy.
  - **Schools.** A *madhhab* is a school of law named after an early jurist. The four Sunni schools are Hanafi (Abu Hanifa, 699 to 767), Maliki (Malik ibn Anas, about 711 to 795), Shafi'i (al-Shafi'i, 767 to 820) and Hanbali (Ahmad ibn Hanbal, 780 to 855). The Shia Twelver school is {{ Ja'fari, named after the sixth Imam Ja'far al-Sadiq (about 702 to 765) }}. Schools are different legal methods inside one faith, not separate religions.
  - **The succession.** After 632, according to Sunni Muslims, the community chose its leader, Abu Bakr; according to Shia Muslims, Muhammad had already named Ali at Ghadir Khumm. The two sides read the same words, "whoever I am his *mawla*, Ali is his *mawla*", differently: as {{ friend or supporter (Sunni) versus leader and authority (Shia) }}.
  - **Shia branches.** Twelvers hold that there are twelve Imams, divinely appointed and infallible, the twelfth now in hiding; Ismailis follow a different line of Imams after Ja'far al-Sadiq; Zaydis hold that any worthy descendant of Hasan or Husayn who rises to lead may be Imam. Shia legal reasoning leans on the Imams' reports.
  - **Three layers.** Established: the schools, dates, the succession dispute and the Battle of Karbala (680 CE) happened. Live debate: how the early community decided and how law grew. Commitment: whether Ali was designated, and whose reading of sharia is right. Believers hold these and the study of history does not settle them.

cards:
  - type: mcq
    id: hook
    title: "Guess: a case nobody mentioned"
    prompt: |
      Guessing is the point. A community of believers lives by a scripture and by the example of its founder, who has just died. A new case arises that neither mentions, say a new kind of trade contract. There is no ruler whose word settles it. What would you try first?
    options:
      - text: "Look for the closest case that the scripture or the founder's example does address, and carry the ruling over if the reason behind it applies. Ask respected scholars, and see where they agree."
        correct: true
        feedback: |
          This is close to what Muslim jurists did, and the lesson names each step: the sources, analogy, consensus. It is also a pattern that shows up in legal systems everywhere.
      - text: "Let each person decide privately, since there is no authority."
        feedback: |
          A community that wants a shared way of life needs shared reasoning. Muslim jurists did leave real room for individual effort (it is called *ijtihad*), but within agreed methods.
      - text: "Forbid anything the texts do not mention."
        feedback: |
          Some jurists were cautious in this way, but the majority tradition held that what is not forbidden is generally permitted and that reasoned extension is needed. Otherwise the texts could not cover a growing empire.
    explanation: |
      Keep the three layers apart: facts (who the jurists were, what the schools are), live debate (how law and the early community developed), and faith (what Muslims hold about God's guidance). The lesson also shows where Sunni and Shia Muslims differ, each stated as its own followers state it.

  - type: text
    id: sharia
    title: "Sharia: a path, not one code"
    body: |
      The Arabic word *sharia* means "path", originally the path to a watering place. According to Muslim tradition it is God's way for human life: worship, family, trade, ethics. **Fiqh** (Arabic for "understanding") is the human work of figuring out the rulings of that path in particular cases. Many scholars put it this way: sharia is the divine path; fiqh is what scholars conclude about it, so fiqh can differ between scholars and be revised.

      That is why there is no single book called "the sharia". There are large bodies of fiqh by jurists, written in several schools, and in the modern world states take bits of it (family law most often) and write them into national codes. Where sharia is described only as a list of punishments, many scholars call that an oversimplification of a method of reasoning that mainly concerned prayer, family, contracts and manners.

  - type: mcq
    id: sharia-fiqh
    title: "Sharia or fiqh?"
    prompt: |
      Two scholars of the same school reach different rulings on a new medical question after studying the same texts. According to the distinction taught by most Muslim scholars, what has happened?
    options:
      - text: "Two fiqh conclusions differ, since fiqh is human understanding of the path and can vary. Whether one is closer to the path is something each scholar argues."
        correct: true
        feedback: |
          Yes. Disagreement is normal inside fiqh, and classical collections often record several opinions on one question.
      - text: "One of them has changed the sharia."
        feedback: |
          Believers hold that the path itself is God's and cannot be changed by scholars. What scholars offer is their best understanding of it, and that is why they can differ.
      - text: "Nothing is wrong, because the texts say nothing about medicine and so no ruling is possible."
        feedback: |
          Jurists did not stop where texts were silent; they reasoned from principles and analogy, as the next cards show.
    explanation: |
      This distinction lets a believer hold "the path is divine" and "my school's ruling is one scholar's best reading" together.

  - type: text
    id: sources
    title: "Where the rulings come from"
    body: |
      According to the classical Sunni theory of law (*usul al-fiqh*, the "roots" of fiqh), there are four sources, in order:

      1. the **Qur'an**;
      2. the **sunnah**, the Prophet's example, documented by hadith (recall the lesson Hadith, Sunnah and Chains of Transmission);
      3. **ijma**, the consensus of the qualified scholars of a time;
      4. **qiyas**, reasoning by analogy from a text to a new case.

      The jurist **al-Shafi'i** (767 to 820), in his *Risala*, systematised how the first two work together and argued for the authority of the Prophet's sunnah next to the Qur'an. Historians note that the fourfold list in this exact form is not found in his own books; it was shaped later by jurists such as al-Baqillani. Twelver Shia jurists have a parallel list: the Qur'an; the sunnah, which for them also includes the reports of the twelve Imams; consensus; and **reason** (*aql*) in place of analogy. Both sides add that independent effort to reach a ruling is called **ijtihad**.

  - type: mcq
    id: qiyas
    title: "A worked analogy"
    prompt: |
      According to classical jurists, the Qur'an forbids wine. Jurists extended the ruling to other intoxicating drinks. Which step is the heart of reasoning by analogy (*qiyas*)?
    options:
      - text: "Find the reason (*illa*) behind the text's ruling, intoxication, and check that the new drink shares it. If it does, the same ruling applies."
        correct: true
        feedback: |
          Yes. The method has three parts: a text with a ruling, a new case, and a shared cause that links them.
      - text: "Check whether the new drink looks like wine, in colour and taste."
        feedback: |
          It is a natural guess. The jurists' question is about the *reason* for the ruling, not appearance. A clear drink that intoxicates falls under the ruling, a red drink that does not intoxicate does not.
      - text: "Ask whether most people in the town already refuse the drink."
        feedback: |
          Practice is evidence for consensus, a different source. Analogy works from the text's own reason.
    explanation: |
      Here the cause is stated by the jurists, not by the verse itself; that is why critics (and Shia jurists, who prefer reason to analogy) say it can be stretched, and why defenders say it gives a discipline: the cause must be named and checked.

  - type: text
    id: schools
    title: "Schools of law"
    body: |
      A **madhhab** is a school of law: a family of scholars sharing a method and a body of rulings, named after an early jurist. According to Sunni tradition there are four, and the Shia Twelver school is a fifth system.

      | School | Jurist | Lived (CE) | Strong today |
      |---|---|---|---|
      | Hanafi | Abu Hanifa | 699 to 767 | South and Central Asia |
      | Maliki | Malik ibn Anas | c. 711 to 795 | North and West Africa |
      | Shafi'i | al-Shafi'i | 767 to 820 | East Africa, Southeast Asia |
      | Hanbali | Ahmad ibn Hanbal | 780 to 855 | Arabia (Saudi Arabia, Qatar) |
      | Ja'fari (Twelver Shia) | Ja'far al-Sadiq | c. 702 to 765 | Iran, Iraq |

      Abu Hanifa was born in Kufa and died in Baghdad; Malik lived in Medina and compiled the *Muwatta*; Ahmad ibn Hanbal lived in Baghdad. The schools differ in how much they weigh sources beyond the four: for example the Maliki gave weight to the practice of Medina, the Hanafi to juristic preference (*istihsan*), the Hanbali leaned heavily on hadith. Scholars note that the schools grew out of study circles around local masters, and that the founders did not set up the schools themselves; later students did.

  - type: order
    id: schools-order
    title: "Order the jurists"
    prompt: "Put these jurists in the order they died, earliest first."
    steps:
      - "Ja'far al-Sadiq (765)"
      - "Abu Hanifa (767)"
      - "Malik ibn Anas (795)"
      - "al-Shafi'i (820)"
      - "Ahmad ibn Hanbal (855)"
    hint: "Two of them died within two years of each other, in the 760s."
    explanation: |
      Ja'far al-Sadiq and Abu Hanifa were of the same generation in the same region, and died two years apart. All five lived within the first two and a half centuries after the Prophet. Remember that these dates are for the men; the schools took shape in the generations after them.

  - type: text
    id: succession
    title: "632: who leads after Muhammad?"
    body: |
      When Muhammad died in 632, the community had to decide who would lead it. According to the account preserved in Sunni sources, leaders of the Medinan helpers (the Ansar) met at a hall called the Saqifa, and **Abu Bakr**, a close companion of Muhammad, was chosen as the first **caliph** (successor). He ruled from 632 to 634. Ali was at the time preparing Muhammad's body for burial and was not at the meeting. Sunni Muslims hold that the Prophet left the choice to the community, so the choice of Abu Bakr was legitimate, and that Ali later became the fourth caliph, from 656 to his assassination in 661.

      According to Shia Muslims (from *shi'at Ali*, "the party of Ali"), Muhammad had named Ali as his successor in a sermon at a place called **Ghadir Khumm**, on the way back from his last pilgrimage, so the choice at the Saqifa set aside a decision already made by God and the Prophet. Historians agree that Ali was absent from the Saqifa, and that Abu Bakr was chosen; what Ghadir meant is the question.

  - type: mcq
    id: ghadir
    title: "One sentence, two readings"
    prompt: |
      Both Sunni and Shia sources report that Muhammad took Ali by the hand at Ghadir Khumm and said, in essence, "He whose *mawla* I am, Ali is his *mawla*." *Mawla* can mean friend, supporter, or patron, or it can mean a master or leader. Which statement describes the disagreement fairly?
    options:
      - text: "Both sides accept that the event and words are reported; Sunnis read *mawla* as friend or supporter and see an honouring of Ali, while Shia read it as leader and see a designation of him as successor."
        correct: true
        feedback: |
          Yes. The dispute is about what one word meant in context and what the setting (a halt in the desert, a crowd gathered, a public gesture) implies. Each side offers arguments, and the disagreement is not settled by the sentence alone.
      - text: "Sunnis deny that the event ever happened."
        feedback: |
          Sunni sources report the event; their view is that the words honour Ali and do not name a successor.
      - text: "Shia hold that the words mean only friend, but that Ali was successor for another reason."
        feedback: |
          Shia sources read the words as a designation of Ali as leader; the reading of *mawla* as "leader, one owed obedience" is the centre of their case.
    explanation: |
      A steelman of each: Sunni scholars argue that if Muhammad had meant to name a successor he would have said so plainly, and that the community's later choice shows what the Companions understood. Shia scholars argue that the gathering on a hot road, the public gesture and the context of the sermon make no sense for a mere compliment, and that the Prophet would not leave so great a matter unresolved. Whichever is right is a question of interpretation and of faith, not of data.

  - type: text
    id: karbala
    title: "Karbala, 680"
    image:
      src: img/karbala-shrine.webp
      alt: Old black-and-white photograph of the interior of the shrine of Imam Husayn in Karbala, Iraq, with a lattice enclosure, hanging lamps and visitors standing around it
      caption: The shrine of Imam Husayn in Karbala, Iraq, an early photograph of a place of pilgrimage for Shia Muslims, at the site associated with the battle of 680.
      credit: "Imam Husayn Shrine media department, Public domain, via Wikimedia Commons"
      link: https://commons.wikimedia.org/wiki/File:Imam_Husayn_and_abbas_Shrine_in_Karbala_4.jpg
    body: |
      After Ali's death in 661, the Umayyad family held the caliphate, and when Mu'awiya's son **Yazid** succeeded him in 680, **Husayn**, the younger son of Ali and grandson of the Prophet, refused to give him his pledge. Invited by people of Kufa to lead them, he set out with a small group, about seventy men according to one account, and was intercepted by Umayyad forces at **Karbala**, in southern Iraq. On the tenth of Muharram, 61 on the Muslim calendar (10 October 680), he was killed with most of his family and companions.

      Historians agree that the battle took place and Husayn was killed. Shia Muslims commemorate it every year, as the day of **Ashura**, with mourning gatherings, recitations and processions, and forty days later with a pilgrimage to Karbala. According to Shia tradition he is the "prince of martyrs", who stood against tyranny; the memory of it shapes Shia identity. Sunni and Shia accounts of Yazid and of the memory of Husayn differ, and each tradition tells them in its own way.

  - type: mcq
    id: layers
    title: "Fact, debate or faith?"
    prompt: |
      Which one of these claims is placed in the layer of *established history* (not debate or faith) by most historians of any belief?
    options:
      - text: "Husayn ibn Ali was killed at Karbala in 680 by Umayyad forces."
        correct: true
        feedback: |
          Yes. Accounts differ on detail (numbers, words said), but the event itself is not in dispute among historians.
      - text: "Muhammad designated Ali as his successor at Ghadir Khumm."
        feedback: |
          That the event occurred is widely reported; but whether it was a designation is a matter of interpretation of one sentence and of faith for each side.
      - text: "Husayn's death was a sacrifice that redeems or guides the community."
        feedback: |
          This is a faith commitment, held by Shia Muslims as a meaning of the event; history can establish the event, not its meaning.
    explanation: |
      Learn to label each statement: the event (layer 1), how to read a sentence (layer 2, live debate), and its religious meaning (layer 3).

  - type: text
    id: branches
    title: "Imams and the branches of Shia Islam"
    body: |
      For Shia Muslims the leader of the community is an **Imam** ("one who stands in front"). The Shia branches differ about who the Imams are.

      **Twelvers** (the largest branch, with most people in Iran, Iraq and Azerbaijan) hold that twelve male descendants of Muhammad, from Ali to Muhammad al-Mahdi, were appointed by God and are infallible. According to Twelvers, the twelfth Imam is alive but hidden (the "occultation") and will return. After Ja'far al-Sadiq, the **Ismailis** followed his son Isma'il, or Isma'il's son Muhammad, and have their own line of Imams, while the Twelvers followed his younger son Musa al-Kazim. The **Zaydis**, found mostly in the highlands of Yemen, trace themselves to Zayd ibn Ali, who led an unsuccessful revolt against the Umayyads around 740. They hold that any worthy descendant of Hasan or Husayn who rises to lead can be Imam, without infallibility, and their law is close to the Hanafi school.

      Shia Muslims are estimated at 10 to 13 percent of all Muslims. For Twelvers, the reports of the Imams count as a source of law beside the Prophet's, which is why their collections, such as al-Kulayni's *al-Kafi*, include them.

  - type: numeric
    id: calendar
    title: "Years between"
    prompt: |
      Muhammad died in 632 CE and Ahmad ibn Hanbal, the last of the four Sunni founders, died in 855 CE. How many years passed between those deaths?
    answer: 223
    answerText: '223'
    wrong:
      - value: 233
        feedback: |
          Check the subtraction: 855 minus 632 is 223, not 233.
      - value: 87
        feedback: |
          87 is the gap from 632 to 719; the question asks for the gap to 855.
    hint: Subtract the earlier year from the later.
    explanation: |
      $855 - 632 = 223$. The schools took shape in this stretch, which is why they cite the Companions and the earlier generations as links in a chain rather than as eyewitnesses.

  - type: mcq
    id: core
    title: "Shared core"
    prompt: |
      Which description is fair about what Sunni and Shia Muslims share?
    options:
      - text: "They share the Qur'an, the profession of faith, the five daily prayers, almsgiving, fasting in Ramadan and pilgrimage. They differ chiefly on leadership after Muhammad, on which reports count, and on some points of law and ritual."
        correct: true
        feedback: |
          Yes. Shia practice adds items (such as the khums, a fifth-share tax, in Twelver practice, and Ashura mourning) and classifies the foundations differently, but the central practices are held in common.
      - text: "They have different scriptures."
        feedback: |
          Both use the same Qur'an. The difference is in what else counts as authoritative: the Imams' reports for Shia, the Companions' reports for Sunni.
      - text: "They differ in everything, since they are different religions."
        feedback: |
          Both describe themselves as Muslim; the split is a division within one religion, over leadership and authority, like divisions inside other traditions.
    explanation: |
      The five pillars of Sunni Islam are the profession of faith, prayer, almsgiving, fasting and pilgrimage. Twelver Shia list five foundations of belief (including the Imamate) and ten practices, which include the same acts.

  - type: mcq
    id: traps
    title: "Two common slips"
    prompt: |
      Which statement is accurate?
    options:
      - text: "The four Sunni schools are different legal methods in one community, and most Sunnis follow one of them in detail (*taqlid*, following an established authority) while qualified jurists exercise *ijtihad* (independent reasoning)."
        correct: true
        feedback: |
          Yes. Schools recognise each other as valid. Debates continue about how far ijtihad should be open; since the 18th century reformers have called for more of it, while others defend the schools.
      - text: "The four schools are Sunni sects that regard each other as outside Islam."
        feedback: |
          They are not sects in that sense. A person may change school, and the four recognise each other's rulings as legitimate.
      - text: "Ijtihad means breaking from the texts to follow one's own opinion."
        feedback: |
          Ijtihad is disciplined reasoning from the sources by a qualified jurist, not personal taste.
    explanation: |
      The two words show an old tension: stability and reliability on one side, adaptation to new cases on the other.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      Three questions divide thoughtful people here, and each rests on a different premise.

      Was Ali designated? Sunni scholars answer no, on the reading of *mawla* and on the choice of the Companions, and many Shia scholars answer yes, on the reading of the sermon and on the need for divinely guided leadership. The historical sources are shared; the difference is how to read one phrase and whether the community or God appoints a leader.

      Where does legal authority lie? Sunnis lean on the Companions' and scholars' consensus and on analogy; Twelver Shia lean on the infallible Imams and on reason. A sceptical historian asks, as in the lesson on hadith, how early the reports go back; a believer asks what guidance God has secured.

      How fixed should law be? Defenders of established schools stress stability and the wisdom of earlier jurists; reformers stress ijtihad and changing circumstances. This is a question about values and not only about facts.

  - type: text
    id: summary
    body: |
      **Next:** the great thinkers who asked how reason and revelation fit together. Was the Qur'an created or eternal? Does God act through causes, and is the world eternal? The next lesson is Kalam and Philosophy: Ghazali, Avicenna and Averroes.
