id: ch16-sufism
title: "Sufism"
kind: concept
own: |
  The question: can the self be "emptied" in love of God, and is that a path of devotion or a danger? Everything is taught according to someone: the Sufi masters and their followers, jurists and critics, and historians.
  - **Sufism.** *Sufism* (Arabic *tasawwuf*) is {{ the inner, mystical path within Islam }}. Its early figures were ascetics such as Hasan al-Basri (c. 642 to 728) and Rabi'a al-Adawiyya (c. 716 to 801, dates uncertain). It is not a separate sect: Sufis are Sunni and Shia, and belong to *orders* (*tariqa*) led by a *shaykh* and practise *dhikr* (remembrance of God).
  - **Fana and baqa.** According to Sufis, *fana* is the passing away of the self's awareness of anything but God, and *baqa* is abiding in God afterwards:
  $$\text{fana}\ (\text{passing away})\ \longrightarrow\ \text{baqa}\ (\text{abiding})$$
  - **Sober and intoxicated.** Later manuals pair al-Bistami (d. about 874) with *sukr*, intoxication, and al-Junayd (d. 910) with *sahw*, {{ sobriety: coming back to ordinary awareness and keeping the law after the experience }}. Al-Hallaj, executed in Baghdad in 922, said *Ana al-Haqq*, "I am the Truth": opponents read it as a claim to be God, defenders as God speaking through a self that had passed away.
  - **Ghazali.** After a crisis in 1095 al-Ghazali (1058 to 1111) left his post in Baghdad. According to his autobiography *Deliverance from Error*, kalam, philosophy and the Ismaili teaching each fell short, and Sufi practice gave what he sought. He wrote *The Revival of the Religious Sciences* to join law, theology and the inner life.
  - **Rumi and Ibn Arabi.** Rumi (1207 to 1273) wrote the *Masnavi*; his followers founded the {{ Mevlevi order, whose ceremony is the whirling *sema* }}. Ibn Arabi (1165 to 1240) is linked with *wahdat al-wujud*, "the unity of being". Defenders read it as a subtle teaching that creatures depend wholly on God; critics such as Ibn Taymiyya (1263 to 1328) read it as erasing the line between God and the world.
  - **Law and path.** According to many Sufis the law (*shariah*), the path (*tariqa*) and the truth (*haqiqa*) {{ belong together: the law is the foundation, not a shell to discard }}. Radical voices disagreed.
  - **Three layers.** Established: the people, works, dates and the execution of 922. Live debate: how much of the stories of Rabi'a is history, and why Hallaj was killed (religion or politics). Commitment: whether the experiences are real contact with God, and which reading of *wahdat al-wujud* is right.

cards:
  - type: mcq
    id: hook
    title: "Guess: emptying the self"
    prompt: |
      Guessing is the point. Some Muslims taught that the deepest prayer is to love God so much that the self "passes away", and that nothing remains in awareness but God. Others feared that such talk can slide into claiming to be God. What would you expect the tradition to have done with this?
    options:
      - text: "It split into several readings: some prized the experience, some warned that it needs the guard of law and sobriety, and some condemned certain sayings. All of them were inside the tradition."
        correct: true
        feedback: |
          Yes. This lesson follows the Sufi path and the debates about it, each side according to its own defenders.
      - text: "Everyone accepted it, since mystics are never criticised."
        feedback: |
          Many jurists and theologians were wary, and one famous mystic was executed. Mysticism has been both honoured and contested.
      - text: "Everyone rejected it as foreign to Islam."
        feedback: |
          Great scholars practised and defended it, and historians such as John Renard stress that it is no aberrant cult. Some critics rejected parts of it, not all.
    explanation: |
      Keep the layers apart: the history (who said what, when), the scholarly debates, and the faith question whether such experiences are contact with God.

  - type: text
    id: what
    title: "What Sufism is"
    body: |
      **Sufism** is the name usually given to the inner or mystical path within Islam. Its Arabic name is *tasawwuf*, which literally means "to make oneself a Sufi", and Sufis relate it to *tazkiya*, the purification of the self. According to Sufis it is the part of the faith concerned with the heart: sincerity, remembrance of God, and love.

      Where does the word "Sufi" come from? The most common explanation, which the classical writers al-Qushayri and Ibn Khaldun favoured, is *suf*, "wool", for the woollen garments of early ascetics. Other proposals have been made: purity (*safa*), the "People of the Bench" (*ahl al-suffa*, poor companions of Muhammad), and even the Greek *sophos*, "wise". The wool derivation is the usual one, and scholarly reference works judge the others weaker.

  - type: text
    id: ascetics
    title: "The first ascetics"
    body: |
      **Hasan al-Basri** (c. 642 to 728), who lived in Basra, preached against worldliness and stressed a reverent fear of God. Later Sufis placed him in their chains of teachers leading back to Muhammad. Few writings under his name are authentic, and much of his biography comes from edifying stories.

      **Rabi'a al-Adawiyya** (of Basra) is the best-known woman among the early Sufis. The usual dates are about 716 to 801, but historians note that these come from much later and are uncertain. She left no writings that can be tied to her, and some stories mix her with two other women called Rabi'a. According to Sufi tradition she first taught worship out of love of God rather than fear of punishment or hope of reward. In essence, a prayer attributed to her says: if I worship out of fear of hell, burn me in hell; if out of hope of paradise, shut me out of it; but if I worship for You alone, do not hide Your beauty from me. Much of what is told of her comes from the poet Farid al-Din Attar in the early 13th century, so the vivid scenes count as tradition more than as verified history.

  - type: mcq
    id: rabia-motive
    title: "What was Rabi'a's point?"
    prompt: |
      According to the Sufi tradition about Rabi'a, what is the point of her prayer about hell and paradise?
    options:
      - text: "To say that worship should not be a bargain: loving God for God's own sake, apart from punishment or reward, is the purest form."
        correct: true
        feedback: |
          Yes. The tradition presents it as a purification of motive. Critics could reply that scripture itself speaks of reward and warning, and defenders answer that she did not deny them, only asked what lies beneath them.
      - text: "To deny that hell and paradise exist."
        feedback: |
          Nothing in the tradition says she denied them. The prayer assumes them and asks the worshipper to look past them.
      - text: "To show that fear of God is useless."
        feedback: |
          Hasan al-Basri, in the same city, taught reverent fear. Sufis later held fear and love together. Her stress was on the purity of motive, not on abolishing fear.
    explanation: |
      Layers: that the stories are told of her is established; how much is historical is debated; whether love without reward is the deepest worship is a commitment. A believer sees a spiritual insight, a sceptic a moving ethic, and both can recognise the point.

  - type: text
    id: orders
    title: "Orders, masters and remembrance"
    image:
      src: img/sufi-sama-manuscript.webp
      alt: Painting from a 15th-century manuscript of an ornate hall with a seated master, men in robes around him and several dancing in the middle
      caption: A manuscript painting made at Herat in 1485 of Sufis performing sama, listening to music with movement, as an illustration of a poem by Amir Khusrau.
      credit: "Unknown painter in Herat, 15. Century, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Sufis_Performing_Sama_(CBL_Per_163.6).jpg"
    body: |
      Over the centuries Sufi practice took shape in teaching circles and in **orders** (*tariqa*, plural *turuq*; the word means "path" or "way"). In an order a **disciple** (*murid*) studies under a **shaykh**, a master, often for years. Orders trace a chain of teachers back to Muhammad and each has its own customs.

      The central practice is **dhikr**, "remembrance": repeating a phrase from the Qur'an, often with set breathing, posture or movement, to keep God in mind. Some orders add *sama*, listening to music and poetry, and in one famous order, the Mevlevi, whirling.

  - type: text
    id: sober
    title: "Sober and intoxicated"
    body: |
      Recall the lesson Mystics Across Traditions: according to Sufis, *fana* is the passing away of the self's awareness of anything but God, and *baqa* is abiding in God afterwards.

      Sufi writers spoke of two stances toward such states. **Sukr** is "intoxication": being overwhelmed, sometimes blurting out startling words (*shath*, "ecstatic utterance"). **Sahw** is "sobriety": coming back, according to this view, with ordinary awareness restored and conduct still bound by the law. Later manuals paired the first with **al-Bistami** (born in Bistam in Iran, died about 874) and the second with **al-Junayd** (died 910 in Baghdad, where he taught). Al-Junayd held that Sufi experience must stay governed by the law, orthodox belief and good conduct, and that those who have passed away are returned to their senses by God.

      One scholar of the topic, Jawid Mojaddedi, argues that the pairing of these two men is a later construction, since earlier writers did not cast them as exemplars of two types. So the tidy contrast is itself a piece of history. Al-Junayd did not deny that the intoxicated experiences are real; he preferred the stance that returns.

  - type: text
    id: hallaj
    title: "Al-Hallaj and the cry of 922"
    body: |
      **Al-Hallaj** (about 858 to 922) was a Sufi who lived and was tried in Baghdad. He is remembered for the phrase *Ana al-Haqq*, usually translated "I am the Truth", where *al-Haqq* ("the Truth, the Real") is also one of the names of God. He was executed in Baghdad in March 922 under the caliph al-Muqtadir.

      Two readings. **Opponents**, among them many jurists, took the phrase as a claim to be God, or God entering a human being (*hulul*), which they judged incompatible with God's transcendence. **Defenders**, and later much of the Sufi tradition, read it as the voice of a self that had passed away (*fana*) so that God speaks through it; in one of his own works it is presented as taking part in the Truth through its signs, not as a plain claim to divinity.

      Why was he killed? Historians disagree. The formal charge involved the Qarmatians, a rebel movement, and a remark that one could circle the Kaaba of the heart. Some scholars stress politics: heresy was prosecuted when it was convenient to the powerful. The sources also differ on where he spoke and how he died, so treat the details with care.

  - type: mcq
    id: hallaj-read
    title: "Two readings, one sentence"
    prompt: |
      Which pair of statements correctly gives the two main readings of al-Hallaj's *Ana al-Haqq*?
    options:
      - text: "According to critics, it claims that a man is God; according to defenders, it is the speech of a self that has passed away, with God speaking through it."
        correct: true
        feedback: |
          Yes. Each side takes the same words and the same word *Haqq* and reads them under a different premise about what the self can be in that state.
      - text: "According to critics, it is a harmless poem; according to defenders, it is a political call to rebel."
        feedback: |
          Reversed and wrong. The critics saw blasphemy. The political charge was brought by accusers, and defenders did not read the words as a rebellion.
      - text: "According to historians, it is certain that he said it only in a mosque before the court."
        feedback: |
          The sources disagree on where he said it. The earliest report is from hostile writers, and later accounts speak of private consultations.
    explanation: |
      A critic of the defenders asks how one tells the voice of God from a man's self-deception. A defender replies that the saying belongs to the language of an experience, not to a claim to be a rival to God. The question stays open.

  - type: text
    id: ghazali
    title: "Al-Ghazali turns inward"
    body: |
      Recall the lesson Kalam and Philosophy: Ghazali, Avicenna, Averroes: al-Ghazali (1058 to 1111; some sources give about 1056 for his birth) was a jurist and head of the Nizamiyya college in Baghdad who wrote *The Incoherence of the Philosophers* around 1095.

      That same year he suffered a crisis: he lost appetite and could hardly lecture. Physicians judged the cause spiritual. He left Baghdad (saying he was going on pilgrimage), gave away his wealth, and spent about ten years in seclusion, mostly in Damascus, Jerusalem and Tus. His autobiography *Deliverance from Error* (*al-Munqidh min al-Dalal*) tells, according to him, how he examined kalam, philosophy and the Ismaili teaching, found each short of what he sought, and concluded that Sufi practice gave a certainty of the heart that argument alone did not. In his great work *The Revival of the Religious Sciences* he set out to join law, theology and the inner life.

      Scholars note that this is a story told by Ghazali himself, and historians debate how far the crisis was religious and how far personal or political. Believers who treasure his turn and critics who doubt the account agree on the dates and works.

  - type: mcq
    id: ghazali-turn
    title: "What did Ghazali do with reason?"
    prompt: |
      According to Ghazali's own account, how did he relate argument and Sufi practice?
    options:
      - text: "He examined kalam and philosophy closely and judged that argument alone does not give the certainty he wanted; Sufi practice, he held, did, so he joined law, theology and the inner life."
        correct: true
        feedback: |
          Yes. He did not drop law or theology. The Revival is a book of law, belief and heart together.
      - text: "He abandoned Islam for mysticism."
        feedback: |
          The opposite. He remained a jurist and a defender of belief, and Sufism, he held, completed it.
      - text: "He proved that mysticism is a form of philosophy."
        feedback: |
          He distrusted the philosophers' claims on metaphysics. For him the Sufi path gave something different from demonstration.
    explanation: |
      Skeptics ask whether an experience can settle what an argument could not. His admirers answer that he never claimed to replace reasoning, but to add to it. Which is right depends on what evidence one grants to inner experience, a question met in the mysticism lesson.

  - type: text
    id: rumi
    title: "Rumi and the Mevlevi"
    image:
      src: img/mevlevi-sema.webp
      alt: Photograph of whirling dervishes in white robes and tall hats bowing together in a ceremony hall
      caption: Mevlevi dervishes bowing in unison in the sema, a ceremony that, according to UNESCO's description, stands for spiritual ascent and reunion with the Divine.
      credit: "Quinn Dombrowski, CC BY-SA 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Turkish_whirling_dervishes_of_Mevlevi_Order,_bowing_in_unison_during_the_Sema_ceremony.jpg"
    body: |
      **Jalal al-Din Rumi** was born on 30 September 1207 in Wakhsh (today in Tajikistan; his family came from Balkh) and died on 17 December 1273 in Konya. On 15 November 1244 he met the wandering dervish **Shams of Tabriz**. According to the tradition the meeting changed his life, and the grief at Shams's disappearance poured into the lyric poems of the *Divan*.

      His great work, the *Masnavi*, is a long poem in Persian in six books of paired lines, roughly 27,000 lines in all, using stories to teach the soul's longing to return to its source. His followers, with his son Sultan Walad, founded the **Mevlevi order** after his death, known in the West as the whirling dervishes. Their ceremony, the *sema*, is on UNESCO's list of the intangible heritage of humanity; UNESCO also notes that many performances today are shortened for tourists.

  - type: mcq
    id: rumi-q
    title: "Who founded the Mevlevi?"
    prompt: |
      A traveller says: "Rumi founded the whirling dervish order in order to make a show of his poems." What is the best correction?
    options:
      - text: "The order was formed by his followers and his son Sultan Walad after his death in 1273, and its sema is a devotional ceremony that its practitioners understand as a spiritual journey; later tourist shows are a separate matter."
        correct: true
        feedback: |
          Yes. The tradition places the founding after his death, and UNESCO separates the ritual from the commercial performances.
      - text: "Rumi founded it in his youth in Balkh."
        feedback: |
          He was born in 1207 and the order grew in Konya, where he died in 1273.
      - text: "The order was founded by al-Ghazali."
        feedback: |
          Al-Ghazali died in 1111, a century and a half before Rumi's death.
    explanation: |
      A modern sceptic may say any ritual can be empty, and a practitioner answers that this does not touch what it is for. The history here is simply dates and sources.

  - type: text
    id: arabi
    title: "Ibn Arabi and the unity of being"
    body: |
      **Ibn Arabi** (1165 to 1240) was born in Murcia in Spain and died in Damascus. He wrote *The Bezels of Wisdom* (*Fusus al-Hikam*, composed in Damascus in 1229) and the huge *Meccan Openings* (*al-Futuhat al-Makkiyya*). He is linked with the doctrine of ***wahdat al-wujud***, "the unity of being". Reference works note that the phrase is not his own: it seems to be first ascribed to him in the polemics of Ibn Taymiyya.

      According to defenders it is a subtle teaching that only God truly exists in himself, and that creatures exist wholly through God, like images in a mirror; defenders add that this is close to the Ash'ari formula. Critics read it as monism, that God and the world are one thing, and say it erases the line between Creator and creation.

      **Ibn Taymiyya** (1263 to 1328, born in Harran, died in prison in Damascus) was among the sharpest critics. Historians stress that he was not simply anti-Sufi. He was affiliated with the Qadiriyya order, praised many Sufi masters, and objected to specific things: veneration of saints and travelling to tombs, and the influence of Ibn Arabi's teaching.

  - type: mcq
    id: wujud-q
    title: "Critics and defenders of the unity of being"
    prompt: |
      Which statement about Ibn Taymiyya and Ibn Arabi is fair?
    options:
      - text: "Ibn Taymiyya criticised Ibn Arabi's teaching, and Ibn Arabi's defenders replied that critics misread the phrase; yet Ibn Taymiyya also praised many Sufis and belonged to a Sufi order."
        correct: true
        feedback: |
          Yes. The quarrel was over one school of Sufi metaphysics and over saint veneration, not a rejection of all inner devotion.
      - text: "Ibn Taymiyya rejected Sufism entirely, and all Sufis followed Ibn Arabi."
        feedback: |
          Both halves fail. He was linked with the Qadiriyya, and many Sufis never taught the unity of being.
      - text: "Ibn Arabi himself used the phrase wahdat al-wujud throughout his works."
        feedback: |
          Reference works say he did not use it; it was ascribed to him later, first in the polemics of Ibn Taymiyya.
    explanation: |
      A fair reader sees a debate between two serious concerns: protecting the difference between God and the world, and expressing the depth of God's presence.

  - type: order
    id: dates
    title: "Put them in order by death"
    prompt: Put these Sufi figures in the order of their deaths, earliest first.
    steps:
      - "Rabi'a al-Adawiyya (801, traditional date)"
      - "Al-Junayd (910)"
      - "Al-Hallaj (922)"
      - "Al-Ghazali (1111)"
      - "Ibn Arabi (1240)"
      - "Rumi (1273)"
    hint: The ninth century comes first; al-Hallaj was executed twelve years after al-Junayd died. Rumi and Ibn Arabi are both of the thirteenth century.
    explanation: |
      801, 910, 922, 1111, 1240, 1273. Rumi, though younger by about forty years, died last; Ibn Arabi (born 1165) died in 1240, when Rumi was thirty-three.

  - type: text
    id: law
    title: "The path and the law"
    body: |
      The great question of Sufism is its relation to the law (*shariah*). According to Sufi teachers the law (*shariah*), the path (*tariqa*) and the truth (*haqiqa*) depend on one another. In the orthodox Sufi view, the law is an enduring foundation: the path is walked on top of prayer, fasting and the rules, and Ibn Arabi held that a guide who neglects even one rule of the law is not a true shaykh, whatever miracles he shows. Al-Junayd's "sobriety" has the same shape.

      More radical voices, historians note, treated the law as an outer shell to be passed beyond once inner truth is seen, and antinomian groups such as the Qalandariyya rejected many conventions. Jurists and rigorist critics worry that saint veneration and ecstatic speech can slip into practices without a basis in scripture; defenders answer that the best masters were just as strict as the jurists. Both sides cite the same tradition.

  - type: mcq
    id: traps
    title: "Common slips"
    multiple: true
    prompt: |
      Select all that are mistakes about Sufism.
    options:
      - text: "Sufism is a separate sect, like Sunni or Shia."
        correct: true
        feedback: |
          A mistake. Sufis are found among Sunni and Shia, and belong to orders; reference works stress it is no aberrant sect.
      - text: "All Sufis seek ecstasy and whirl."
        correct: true
        feedback: |
          A mistake. Whirling belongs to the Mevlevi. Many orders stress dhikr, study and sobriety, and al-Junayd preferred sobriety.
      - text: "Fana means annihilation as in death."
        correct: true
        feedback: |
          A mistake. Reference works describe it as passing away of awareness of anything but God, followed by baqa, abiding.
      - text: "Al-Hallaj's execution shows what all Muslims thought of mystics."
        correct: true
        feedback: |
          A mistake. Many jurists and mystics disagreed, historians dispute the motives, and Sufi tradition later honoured him.
      - text: "Al-Ghazali combined law, theology and Sufi practice in his Revival."
        feedback: |
          That is accurate: the Revival is his attempt to bring them together.
    explanation: |
      The tradition is large, with many styles, and each slip takes one style or one episode for the whole.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      First: **are the experiences contact with God?** A believing Sufi says the heart can know God directly, and points to lives and fruits. A sceptic says that strong states can be explained by training and the brain, and that they differ between traditions. The lesson Mystics Across Traditions set out the arguments; here it is a matter of evidence and of what one grants to inner experience (layer 3).

      Second: **what are the safeguards?** Defenders of the path say the law and a master keep it safe; critics fear saints, tombs and ecstatic words. This rests on a value, how much freedom the inner life should have, and on a premise about scripture.

      Third: **what did the stories happen to be?** Historians weigh how much in Rabi'a's life and in the lives of the early saints is fact and how much devotion. A believer may hold the stories true in spirit whatever the facts. None of these questions is settled by the history, and thoughtful Muslims, non-Muslims and sceptics hold each side.

  - type: text
    id: summary
    body: |
      **Next:** three books share Abraham, Moses and Jesus, each telling the figures differently. The lesson Shared Figures reads them side by side.
