id: ch16-isnad
title: "Guided problem: Grading a Chain of Transmission"
kind: guided
cards:
  - type: text
    id: recall
    title: "Recall, and the task"
    body: |
      Recall from the lesson Hadith, Sunnah and Chains of Transmission: a *hadith* is a report of what the Prophet Muhammad said, did or approved. It has an *isnad* (the chain of named narrators, "A heard it from B, who heard it from C...") and a *matn* (the text). According to Ibn Hajar al-Asqalani (1372 to 1449), the classical standard calls a hadith *sahih* ("sound") when five conditions hold: every narrator is trustworthy, every narrator preserves the report accurately, the chain is connected so that each narrator could have received it from the one before, there is no hidden defect, and it does not contradict a better-attested report. It is *hasan* ("fair") when one narrator falls a little short of full accuracy, and *da'if* ("weak") when the chain is broken or a narrator is criticised. A report carried by so many chains that agreement to lie is implausible is *mutawatir*; any other is *ahad*. According to Schacht and Juynboll, the *common link* is the earliest narrator at which many chains of one report converge.

      This lesson is one problem with its own numbers. You will grade one chain the classical way, and then ask what a modern historian would add. **Every person, date and text below is invented for the exercise** and stands for no real narrator. Guessing first is welcome: the questions follow the logic of the method.

  - type: text
    id: setup
    title: "The invented report"
    body: |
      A collector called Ibn Rashid (invented, died 880 CE) records this report in his book:

      *"Qays said: the Prophet said, 'Whoever believes in God and the last day should honour his neighbour.'"*

      The chain he gives runs from him back to the Prophet through five narrators. Our (invented) biographical dictionary says this about each of them. Years are CE.

      | Narrator | Born | Died | Note in the biographical dictionary |
      |---|---|---|---|
      | Qays | 600 | 680 | A Companion, someone who met the Prophet |
      | Sa'id | 650 | 725 | A Successor (met Companions), upright, careful |
      | Idris | 690 | 760 | Upright and honest; memory "mostly accurate, with occasional slips" |
      | Harun | 765 | 815 | Upright, famous for a strong memory |
      | Dawud | 780 | 860 | Upright and accurate |

      The chain reads: Ibn Rashid heard it from Dawud, who heard it from Harun, who heard it from Idris, who heard it from Sa'id, who heard it from Qays, who heard it from the Prophet (died 632).

  - type: mcq
    id: could-meet
    title: "Who could have met?"
    prompt: |
      In an invented chain, the narrators lived: Qays 600 to 680, Sa'id 650 to 725, Idris 690 to 760, Harun 765 to 815, Dawud 780 to 860. Each claims to have heard the report in person from the one before. For which neighbouring pair is the claim impossible by the dates alone?
    options:
      - text: "Harun hearing from Idris"
        correct: true
        feedback: |
          Yes. Idris died in 760 and Harun was born in 765, so they never lived at the same time. The claim "I heard it from him" cannot be true.
      - text: "Idris hearing from Sa'id"
        feedback: |
          Sa'id lived until 725 and Idris was born in 690, so Idris was 35 when Sa'id died. They overlapped for decades.
      - text: "Sa'id hearing from Qays"
        feedback: |
          Qays died in 680, when Sa'id was 30. A Successor of Qays's generation meeting him is entirely plausible.
      - text: "Dawud hearing from Harun"
        feedback: |
          Dawud was born in 780 and Harun died in 815, so Dawud was 35 at Harun's death. They overlapped.
    explanation: |
      Classical scholars did exactly this check with birth and death dates, called knowing whether a pupil could have met the teacher. It is a test that can fail for certain: a dead man cannot teach.

  - type: numeric
    id: gap
    title: "How big is the gap?"
    prompt: |
      Idris died in 760 CE and Harun was born in 765 CE. By how many years does the lifetime of Idris end before the lifetime of Harun begins?
    answer: 5
    answerText: "5 years"
    hint: "Subtract the death year of the teacher from the birth year of the pupil."
    wrong:
      - value: 25
        feedback: "That is 765 minus 740, mixing in a wrong date. Use the death year of Idris (760) and the birth year of Harun (765)."
    explanation: |
      $765 - 760 = 5$ years. A pupil born five years after his teacher died cannot have attended his lessons. The chain is broken between Idris and Harun. Possible fixes within the tradition: a missing narrator between them, or a mistake in a date. A scholar would look for another version of the report to see which.

  - type: mcq
    id: memory
    title: "An honest man with an imperfect memory"
    prompt: |
      Set the break aside for a moment and look at Idris alone. The dictionary says he was upright and honest, and that his memory was "mostly accurate, with occasional slips". If this were the only flaw in an otherwise connected chain, which grade fits it best, according to the classical scheme?
    options:
      - text: "Hasan (fair): he is trustworthy, but one narrator falls a little short of full accuracy."
        correct: true
        feedback: |
          Yes. The classical scheme separates trustworthiness (*adl*, honesty and good character) from accuracy (*dabt*, reliable memory or notes). Idris passes the first and falls slightly short on the second, which is exactly the hasan case.
      - text: "Sahih (sound): honesty is what matters, and he is honest."
        feedback: |
          An honest narrator can still misremember. A sound report needs both qualities, and the dictionary says Idris's memory slips occasionally.
      - text: "Da'if (weak): any narrator with a flaw makes the report worthless."
        feedback: |
          The scheme is graded, not all-or-nothing. A small gap in accuracy gives hasan; da'if is for a broken chain or a serious criticism. Many scholars add that other chains can lift a hasan report.
    explanation: |
      Two different questions are asked of every narrator: is he honest, and is he accurate? A saint with a poor memory and a liar with a good memory fail in different ways.

  - type: order
    id: steps
    title: "The grading routine"
    prompt: "Put the classical grading routine in order, in essence as scholars applied it."
    steps:
      - "Collect the chain or chains the report is given with"
      - "Check that the chain is connected: each narrator could have met and heard from the one before"
      - "Check every narrator for honesty and for accuracy"
      - "Check the report for a hidden defect and for conflict with better-attested reports"
      - "Assign a grade: sahih, hasan or da'if"
    hint: "Cheap, decisive checks come first; a broken chain settles the matter before character is weighed."
    explanation: |
      The order is a teaching order. A chain that fails the connection test is already weak, whatever the character of its narrators; character and accuracy matter once the chain holds together; the last checks look at the text against other reports.

  - type: mcq
    id: five-conditions
    title: "Apply the five conditions"
    prompt: |
      The invented chain: Qays, Sa'id, Idris, Harun, Dawud, with the break between Idris and Harun and Idris's occasional memory slips. Assume no hidden defect and no conflict with other reports. Which of Ibn Hajar's conditions does the chain fail? Select all that apply.
    multiple: true
    options:
      - text: "The chain is connected"
        correct: true
        feedback: "Yes: Idris (died 760) and Harun (born 765) could not have met."
      - text: "Every narrator preserves the report accurately"
        correct: true
        feedback: "Yes, slightly: Idris's memory slips fall short of full accuracy."
      - text: "Every narrator is trustworthy"
        feedback: "The dictionary calls all five upright, so this condition is met."
      - text: "The report does not contradict an established report"
        feedback: "We assumed no conflict, so this condition is met."
    explanation: |
      One failed condition is enough to stop the report being sahih. The break is the serious one and gives da'if; the memory slip alone would give hasan. When defects are of different weight, the heavier decides the grade.

  - type: mcq
    id: mutawatir
    title: "Could it be mutawatir?"
    prompt: |
      The invented report goes back to one Companion, Qays, who passed it to one Successor, Sa'id, who passed it to one pupil, Idris; after Idris it spreads to many pupils. According to the classical definition, a mutawatir report is carried by so many chains, at every level, that agreement to lie is implausible. Is this report mutawatir?
    options:
      - text: "No: at the first levels there is a single narrator, so it is ahad, however many pupils follow later."
        correct: true
        feedback: |
          Yes. Classical scholars required the large number at every stage. Here the first levels are single strands, so the report is *ahad*. (Scholars differ on the minimum number for mutawatir; some say three, some five, and the exact figure is debated.)
      - text: "Yes: many narrators at the end is enough."
        feedback: |
          The count must hold at every level of the chain. A wide fan at the bottom does not help if everything passes through one man at the top.
      - text: "Yes: a sound chain makes any report mutawatir."
        feedback: |
          Soundness and mutawatir are different properties. A sound report with a single strand is still ahad; mutawatir is about the number of independent routes.
    explanation: |
      Note the point for what follows: a report that fans out only below a single man is the typical shape that modern historians study with the common link.

  - type: text
    id: converge
    title: "More versions of the same report"
    body: |
      A scholar searches four collections (invented: W, X, Y, Z) and finds the same saying with these chains. Each is read from the collector at the bottom upward.

      | Collection | Chain, from the teacher of the collector up to the Prophet |
      |---|---|
      | W | Yusuf, from Idris, from Sa'id, from Qays |
      | X | Yusuf, from Idris, from Sa'id, from Qays |
      | Y | Hafs, from Idris, from Sa'id, from Qays |
      | Z | Nu'man, from Idris, from Qays |

      In collection W the collector's teacher is Hamdan, in X it is Ismail: both heard it from Yusuf. Yusuf, Hafs and Nu'man are all pupils of Idris, and all lived within the span of his teaching years. The lone chain through Harun (whose birth falls after Idris's death) is not among these.

      Schacht's name for the point where chains meet is the *common link*. Juynboll, who developed the idea, also described a *partial common link* (PCL): a narrator below the common link at which a smaller group of chains meets again.

  - type: mcq
    id: find-link
    title: "Find the links"
    prompt: |
      Collections W and X both go through Yusuf, from Idris. Y goes through Hafs, from Idris. Z goes through Nu'man, from Idris. All four go back to Idris. Which statement is right?
    options:
      - text: "Idris is the common link (all four chains pass through him); Yusuf is a partial common link (two chains meet again at him)."
        correct: true
        feedback: |
          Yes. All chains converge on Idris, so he is the earliest point at which the evidence of the chains meets. Yusuf is a smaller convergence below him, with two pupils passing the report on.
      - text: "Qays is the common link, since all chains reach him."
        feedback: |
          Qays is the end of the chains, but one man at the end of a single strand is what a forger could also claim. The common link is where many *separate* lines come together after having spread out. Above Idris there is only one strand (and Z skips Sa'id), so nothing there is confirmed by independent lines.
      - text: "There is no common link because the chains do not all reach the Prophet by different routes."
        feedback: |
          Different routes to the Prophet are what make a report mutawatir. A common link needs only that many independent lines of pupils meet in one teacher, which is true of Idris.
    explanation: |
      The chains diverge below Idris (Yusuf, Hafs, Nu'man) and converge on him. Above him there is a single line through Sa'id (and Z gives a different path).

  - type: numeric
    id: dating
    title: "Dating the report"
    prompt: |
      Take Idris as the common link. He died in 760 CE; the Prophet died in 632 CE. How many years after the Prophet's death did the common link die?
    answer: 128
    answerText: "128 years"
    hint: "Subtract the Prophet's death year from Idris's."
    explanation: |
      $760 - 632 = 128$ years. The earliest point reached by the converging chains is Idris, who taught during roughly the preceding decades. Ibn Rashid, who wrote it down, died in 880, 120 years after Idris. So on the sceptic's reading the report can be traced with confidence back to Idris's lifetime, over a century after the Prophet, and not to the Prophet himself.

  - type: mcq
    id: two-readings
    title: "Two readings of the same chain"
    prompt: |
      Everyone agrees that Idris is the common link of the invented report. According to the classical hadith scholars on one side and Schacht and Juynboll on the other, what does the stretch above Idris (Sa'id, Qays, the Prophet) mean?
    options:
      - text: "Classical scholars take the stretch above Idris as information to be tested link by link; Schacht and Juynboll hold that a single strand above the common link may have been added later, so only Idris is historically certain."
        correct: true
        feedback: |
          Yes. The classical method trusts a chain that passes its tests; the critical method asks who could have supplied the chain and when, and treats the single strand above the point of convergence as the weak spot, since a later person could have attached an authority.
      - text: "Both agree that the stretch above Idris is proven, since Idris could not lie."
        feedback: |
          Neither side argues that. The classical scholars test the narrators; the sceptics question whether the stretch was attached later, and no one assumes a man could not lie.
      - text: "Both hold that the whole chain is invented because the break shows the others are false."
        feedback: |
          The break affects only one chain, and the converging chains do not contain it. Neither tradition says that one defect condemns all.
    explanation: |
      Notice that the two readings use the same table. The disagreement is about what a single strand proves, not about the dates.

  - type: mcq
    id: motzki
    title: "Comparing the wording"
    prompt: |
      Motzki's *isnad-cum-matn* method compares chains and texts together. Suppose the pupils Yusuf, Hafs and Nu'man each report the saying about honouring the neighbour, and their wordings agree in several unusual phrases that none of them could easily have borrowed from another, while each also has a few small differences of his own. Which conclusion fits Motzki's reasoning best?
    options:
      - text: "The shared unusual phrases point to a common source in Idris's teaching, and the individual differences suggest each pupil passed it on independently."
        correct: true
        feedback: |
          Yes. If pupils had copied one another, the differences would be copied too; wording that is shared but varied is what independent transmission from one teacher looks like. It dates the text to Idris's time, about 760.
      - text: "The agreement proves the Prophet spoke those words."
        feedback: |
          The method dates a text to the time of its source, here Idris. Reaching the Prophet would need independent lines above Idris, which this table does not supply.
      - text: "The differences show the report was invented, since a true report would be word-for-word the same."
        feedback: |
          Memory and oral teaching normally give variation. Total identity would suggest copying. Small differences around a shared core are the expected pattern.
    explanation: |
      Sceptics reply that a collector or pupil may have built chains and borrowed wording at the same time; the method also needs many versions to give reliable results, and it narrows the gap rather than closing it.

  - type: mcq
    id: final-grade
    title: "The final grade and what it means"
    prompt: |
      An invented chain runs Qays, Sa'id, Idris, Harun, Dawud, with Idris (died 760) and Harun (born 765) unable to have met, plus a set of four other chains that all converge on Idris. Graded the classical way and then read historically, which summary is fairest?
    options:
      - text: "The lone chain is da'if because of the break; the converging chains support a report that goes back at least to Idris. Whether it goes back to the Prophet depends on how much weight one gives to the lone strand that links Idris to Qays."
        correct: true
        feedback: |
          Yes. It separates the grade of one chain (da'if) from the dating of the report (to Idris), and leaves the final inference open, as scholars do.
      - text: "The report is sahih, since four collections include it."
        feedback: |
          Number of collections is not a condition. Each chain is judged on its own and some may be weak; the multiple versions matter as support, not as a grade.
      - text: "The report is false, since one chain is broken."
        feedback: |
          A broken chain makes that chain weak, not the report false. Classical scholars said weak reports may be true; they simply could not be relied on for law on that chain alone.
    explanation: |
      A grade is a statement about the evidence on paper: dates, narrators and wording. It does not measure the Prophet's words directly.

  - type: text
    id: part-ways
    title: "Where thoughtful people part ways"
    body: |
      Established: collections, chains and grading rules exist, and a chain can fail simple checks such as dates. Live debate: how far back a chain really goes. Classical Muslim scholars hold that a chain of upright, accurate narrators is real evidence of what the Prophet said. Schacht and Juynboll, according to their own work, held that chains were often built or extended later, and that the safest date is the common link. Motzki and others replied that comparing texts with chains can reach earlier than Schacht allowed, though critics note the method dates the source of the variants, which is not the Prophet himself.

      Who is right turns on three things: whether one assumes narrators reported honestly unless shown otherwise or the opposite, how much weight a single unconfirmed strand deserves, and what counts as independent. Faith commitments stay separate. A Muslim may hold that the Prophet's example is binding and trust the classical method; a historian may hold that the chain proves only a date. The study of chains cannot prove or refute the commitment itself.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Method.** You graded an invented chain the classical way: first, could each narrator have met the one before (a death year before a birth year breaks the chain: $765 - 760 = 5$ years); then honesty and accuracy of each narrator; then hidden defects and conflict with better reports; then a grade (sahih, hasan, da'if). You saw why many pupils below one teacher do not make a report mutawatir. You found a common link ($760 - 632 = 128$ years after the Prophet) and a partial common link, and read the same table two ways: classical scholars testing links, Schacht and Juynboll doubting a single strand above the common link, Motzki comparing wordings.

      **Left open.** Whether single strands above a common link are history or later attribution; this is a question about evidence, and it does not decide the faith question.

      **Next:** the lesson Law, Schools and the Sunni and Shia Paths asks how these reports and the Qur'an became a system of law, why different schools of law arose, and how the early dispute over leadership of the community led to the Sunni and Shia paths.
