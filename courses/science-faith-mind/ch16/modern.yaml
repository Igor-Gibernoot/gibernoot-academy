id: ch16-modern
title: "Islam, Science and the Modern World"
kind: concept
own: |
  The question: how have Muslims related to science, in the medieval centuries and since the nineteenth century, and is there one "Islamic" answer? Everything is taught according to someone: historians of science, Muslim reformers, critics and surveys.
  - **Classical science.** According to historians, from the late eighth century scholars in Baghdad and elsewhere translated Greek, Syriac, Persian and Indian works into Arabic and went beyond them. The "House of Wisdom" as a university-like academy is {{ disputed: Dimitri Gutas and others hold that the sources show a library and a wider scholarly milieu, not a formal institution }}. A famous example: al-Khwarizmi's treatise *al-Jabr* (c. 820) solves $x^2+10x=39$ by completing the square, adding $25$ to both sides:
    $$(x+5)^2 = 64,\qquad x = 3.$$
  - **Method.** Ibn al-Haytham (c. 965 to c. 1040) argued, from pain and afterimages after bright light, that {{ vision comes from light entering the eye, not rays leaving it }}. Historians such as Sabra see a new concept of experiment; others warn against calling him "the first scientist".
  - **The decline story.** The claim that Ghazali's critique of philosophy killed Islamic science is {{ contested: George Saliba points to later work at the Maragha observatory (from 1259) and in Damascus, and Ghazali himself wrote that denying mathematics in the name of Islam harms religion }}. Why science later weakened is still debated.
  - **Modern reform.** Afghani (1838/9 to 1897) and Abduh (1849 to 1905) answered European power and science by urging reform and the use of reason; Abduh was Grand Mufti of Egypt from 1899. Their views differ on details such as evolution.
  - **Three modern strategies.** *Islamization of knowledge* (al-Faruqi: rework the modern disciplines on Islamic principles); *scientific miracles* (*i'jaz 'ilmi*: the Qur'an anticipates modern findings, popularised by Bucaille in 1976), which critics answer that {{ the claims are vague, came after the discoveries, or were already known in antiquity }}; and *harmonisation* (Guessoum: evolution does not contradict core Muslim beliefs). Abdus Salam, Nobel laureate in physics 1979, held in essence that science is one and universal.
  - **Evolution.** In the 2013 Pew report, in 22 countries asked, humans and other living things evolved over time was the view of at least half of Muslims in 13. Acceptance ran from 79% in Kazakhstan and 78% in Lebanon to 30% in Pakistan, and 67% of Iraqis rejected it. {{ So there is no single Muslim answer }}; the answers vary by country.
  - **Three layers.** Established: the texts, dates and survey figures. Live debate: the nature of the House of Wisdom, causes of decline, how original each scientist was. Commitment: whether the Qur'an may be read as predicting science, and what "Islamic science" should mean.

cards:
  - type: mcq
    id: hook
    title: "Guess: where did medieval Muslim science come from?"
    prompt: |
      Guessing is the point. Between about the ninth and thirteenth centuries, scholars writing in Arabic made lasting advances in algebra, optics, astronomy and medicine. Before reading how historians explain this, what would you expect?
    options:
      - text: Scholars from many peoples and religions translated Greek, Persian, Syriac and Indian works into Arabic, then criticised and extended them.
        correct: true
        feedback: |
          Yes. This is the broad picture historians give, with many debates inside it. The lesson looks at the evidence, at the "golden age" label, and then at what Muslims have said about science since the nineteenth century.
      - text: It grew entirely from the Qur'an, with no help from earlier Greek or Persian learning.
        feedback: |
          The sources do not say so. Scholars openly used Greek texts, and the translators were often Christians writing in Syriac and Arabic. Many Muslim thinkers also saw Greek learning as compatible with their faith, which is part of the story.
      - text: Muslims only preserved Greek books and added nothing of their own.
        feedback: |
          Too little. As we will see, al-Khwarizmi in algebra, Ibn al-Haytham in optics and Ibn al-Nafis in anatomy worked on problems and made claims the Greeks did not.
    explanation: |
      Historians weigh transmission (what was passed on) against originality (what was added), and they disagree about the balance for each person.

  - type: text
    id: house
    title: "Translation, and a house that may not have existed"
    body: |
      According to historians, from the late eighth century Greek, Syriac, Persian and Indian works were translated into Arabic in Baghdad, the Abbasid capital, over about two centuries. The most productive translator was Hunayn ibn Ishaq (809-873), a Christian physician of the Church of the East, to whom about 116 works are credited, mostly Greek medicine such as Galen.

      The tradition speaks of a **House of Wisdom** (*Bayt al-Hikma*) under the caliph al-Ma'mun (r. 813-833), a grand academy where scholars worked and debated. Here historians part ways. Dimitri Gutas (1998) pointed out that few early sources use the name and that none of the Greek-Arabic translations mentions it, and argued that the phrase may refer to a library or to Baghdad's wider scholarly community. Others, including Ihsanoglu, argue that the university-like picture was built in the nineteenth and twentieth centuries and that it was in essence al-Ma'mun's palace library. Still others see it as an older royal library that grew under him. Everyone agrees that the translation movement was real and large, and that it was not confined to one building.

  - type: mcq
    id: house-q
    title: "What the debate is about"
    prompt: |
      Historians dispute the "House of Wisdom". Which statement describes the disagreement fairly?
    options:
      - text: They agree that a large translation movement happened in Baghdad, but dispute whether the House of Wisdom was a formal academy or mainly a library and a wider scholarly milieu.
        correct: true
        feedback: |
          Right. The movement is well documented; the institution's form is what the sources leave open.
      - text: Historians dispute whether any translation from Greek into Arabic ever took place.
        feedback: |
          No. The translations survive in large numbers, and the names of translators such as Hunayn are well attested. The dispute concerns the institution, not the translations.
      - text: Historians agree that the House of Wisdom was a modern-style university with degrees and departments.
        feedback: |
          This is the picture the revisionists question. Gutas and others hold that the sources do not support an academy of that kind.
    explanation: |
      Layers: the translations and the translators are established. The nature of the House is a live debate among historians. Nothing here depends on faith.

  - type: text
    id: khwarizmi
    title: "Al-Khwarizmi and the completion of a square"
    body: |
      Muhammad ibn Musa al-Khwarizmi worked in Baghdad in the early ninth century. His treatise *al-Jabr* ("completion", c. 820) gave systematic rules for linear and quadratic equations and proved them with geometric figures. The title word gave us "algebra", and the Latin form of his name, *Algoritmi*, gave us "algorithm". Historians agree on this reach; they differ on how original he was, since some earlier methods were known.

      His standard example is "a square and ten roots equal thirty-nine", in our symbols
      $$x^2 + 10x = 39.$$
      The method is to add the square of half of the ten, which is $5^2 = 25$, to both sides, so that the left side becomes a perfect square. This is called **completing the square**.

  - type: numeric
    id: khwarizmi-q
    title: "Complete the square"
    prompt: |
      Following al-Khwarizmi's method for $x^2 + 10x = 39$ with $x > 0$: adding $25$ to both sides gives $(x+5)^2 = 64$. What is $x$?
    answer: 3
    wrong:
      - value: 8
        feedback: |
          $8$ is the square root of $64$, which is $x+5$, not $x$. Subtract the $5$ that was added inside the bracket.
      - value: 13
        feedback: |
          $x+5 = 8$ gives $x = 3$. Adding the $5$ instead of subtracting it gives $13$.
    hint: |
      Take the square root of $64$, then remove the $5$.
    explanation: |
      $(x+5)^2 = 64$ gives $x + 5 = 8$, so $x = 3$. Check: $3^2 + 10\cdot 3 = 9 + 30 = 39$. Al-Khwarizmi's numbers only needed the positive root, since a negative length had no meaning for his geometric figure.

  - type: text
    id: haytham
    title: "Ibn al-Haytham on how we see"
    image:
      src: img/ibn-al-haytham.webp
      alt: Engraved allegory with a robed figure on a pedestal holding a sheet with a geometric diagram
      caption: In the frontispiece of Hevelius's Selenographia (1647), Alhazen (Ibn al-Haytham) stands for reason and Galileo for the senses, a European view of him some six centuries after his death.
      credit: "Adolph Boÿ, engraved by Jeremias Falck, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Ibn_al-Haytham_crop.jpg"
    body: |
      Ibn al-Haytham (born about 965 in Basra, died about 1040 in Cairo; Latin name *Alhazen*) wrote the *Book of Optics* (*Kitab al-Manazir*) between 1011 and 1021. Many Greek thinkers, Euclid and Ptolemy among them, held the **extramission** view: seeing happens when rays leave the eye and touch the object. He argued for **intromission**: light comes from each point of an illuminated object into the eye.

      Among his arguments, according to modern accounts, are that gazing at the sun hurts the eye and leaves a lingering spot, which fits something arriving in the eye and does not fit the eye merely sending out a ray. He also studied the dark chamber with a small hole (the *camera obscura*) to show how images form and invert, and he used it to watch a partial solar eclipse.

      Historians weigh his place differently. A. I. Sabra saw in the *Optics* a distinct concept of experiment appearing for the first time. G. J. Toomer was sceptical of such claims, noting that Ibn al-Haytham should not be separated from the earlier thinkers he built on. Titles such as "father of modern optics" are broad judgments, not settled history. His own explanation also had gaps: why only rays that strike the eye perpendicularly count was not clearly justified.

  - type: mcq
    id: haytham-q
    title: "Which observation counts against rays leaving the eye?"
    prompt: |
      Ibn al-Haytham argued that vision is light entering the eye, not rays leaving it. Which observation supports his side?
    options:
      - text: After looking at the sun the eye hurts and shows a lingering spot, as though something strong had arrived in it.
        correct: true
        feedback: |
          Yes. A pain and an afterimage come from something acting on the eye, so the eye is receiving, not only sending. This is one of the arguments reported from his Optics.
      - text: A person with open eyes can see in a dark room.
        feedback: |
          This is the reverse: if seeing needs light from outside, we cannot see in a dark room. Extramission has trouble explaining why vision fails in the dark; an eye with its own rays would not need a lamp.
      - text: Cats' eyes seem to glow at night.
        feedback: |
          A glow in the dark does not show rays leaving the eye (it is reflected light), and the argument was not made this way. It also fails to tell the two theories apart.
    explanation: |
      Notice the form of the reasoning: a visible effect (pain, afterimage, failure in the dark) is used to choose between two models. That kind of test is what historians like Sabra mean when they speak of a new use of experiment.

  - type: text
    id: others
    title: "Two more cases: a mountain and a lung"
    body: |
      **Al-Biruni** (born 973 in Khwarazm, died in Ghazni in 1048, though some sources give about 1050) estimated the Earth's radius by climbing a mountain at Nandana, in what is now Pakistan. He measured its height and the dip of the horizon seen from the top, and used trigonometry. His result is close to the modern value, though how close depends on the length of the cubit used, and he did not allow for atmospheric bending of light. He also wrote a large comparative study of India, learning Sanskrit to read Indian sources.

      **Ibn al-Nafis** (born about 1210 in Damascus, died in Cairo in 1288) criticised Galen's claim, repeated by Avicenna's school, that blood passes from the right to the left heart through invisible pores in the dividing wall. He argued that the wall is solid, and proposed that blood goes from the right side to the lungs and returns to the left side. This is called the **pulmonary transit**. Historians stress that he described the passage through the lungs, not the circulation of blood through the whole body, which William Harvey presented about three centuries later. Whether he based his view on dissecting is also disputed.

  - type: mcq
    id: others-q
    title: "Credit what each did"
    prompt: |
      Select every statement that fairly describes what the sources say.
    multiple: true
    options:
      - text: Al-Biruni estimated the size of the Earth from a mountain's height and the dip of the horizon.
        correct: true
        feedback: |
          Right. The method is trigonometry on two measurements.
      - text: Ibn al-Nafis proposed that blood passes from the right heart to the left through the lungs, against Galen's pores.
        correct: true
        feedback: |
          Right. This is the pulmonary transit.
      - text: Ibn al-Nafis described the complete circulation of blood through the whole body.
        feedback: |
          Historians say his insight was confined to the lungs. The full circulation is Harvey's, about three centuries later, though his work was a step toward it.
      - text: Al-Biruni's result was exact, since he allowed for atmospheric refraction.
        feedback: |
          He did not allow for refraction, and the closeness of his result depends on how the cubit is converted.
    explanation: |
      Fair credit names the claim and its limit. Both men worked critically on their predecessors, which is why historians count them as scientists in the full sense, without turning them into figures from a story of unbroken progress.

  - type: text
    id: decline
    title: "Did Ghazali kill science?"
    body: |
      A familiar story says that Islamic science declined after al-Ghazali (recall the lesson on kalam) attacked the philosophers in *The Incoherence of the Philosophers* (c. 1095), so that religion won over reason. Historians have challenged it. George Saliba, in *Islamic Science and the Making of the European Renaissance* (2007), argues that this "classical narrative" made scholars stop looking: work of high level continued after Ghazali. His main examples are the observatory at Maragha, begun in 1259 under the Mongol ruler Hulagu with Nasir al-Din al-Tusi as its first director, where the Tusi couple, a geometric device that addressed problems in Ptolemy's astronomical models, was developed, and later astronomy in Damascus.

      As for Ghazali himself, according to the translation of his autobiography *Deliverance from Error*, he said the mathematical sciences (arithmetic, geometry, astronomy) have nothing to do with religious belief or denial, and that to defend Islam by denying them would harm religion. His criticism was aimed at certain philosophical claims, as the lesson on kalam showed.

      Saliba's view is also disputed: one reviewer thought he claims too much for or against Ghazali, and he says little himself about why decline came, perhaps after the sixteenth century. The label "golden age" has the same difficulty: it is often dated from about 786 to the Mongol sack of Baghdad in 1258, and some historians warn that measuring it against the later Scientific Revolution in Europe may impose standards foreign to that culture.

  - type: mcq
    id: decline-q
    title: "A tempting one-line history"
    prompt: |
      Select every statement that is a mistake.
    multiple: true
    options:
      - text: Al-Ghazali's critique of the philosophers ended scientific work in the Muslim world.
        correct: true
        feedback: |
          A mistake as stated. Work such as that at Maragha (from 1259) came after him, and Ghazali himself wrote that rejecting mathematics in the name of Islam would harm religion. Whether his influence discouraged some kinds of inquiry is a different, debated question.
      - text: There was an "Islamic golden age" and everything in it was original and without debts to earlier learning.
        correct: true
        feedback: |
          A mistake. The translation movement shows large debts to Greek, Persian, Syriac and Indian learning, as the Greeks themselves had debts to others.
      - text: Historians disagree about how to explain the later weakening of science in Muslim lands.
        feedback: |
          Accurate. Even Saliba, who rejects the Ghazali story, says little about the cause.
      - text: Some historians doubt that the House of Wisdom was an academy.
        feedback: |
          Accurate. Gutas and others have questioned the usual picture.
    explanation: |
      Both mistakes turn a complicated record into a story with a hero or a villain. The fair summary: a real tradition, with debts and with debates, whose later course is still argued.

  - type: text
    id: reform
    title: "The nineteenth century: Afghani and Abduh"
    image:
      src: img/abduh.webp
      alt: Black and white photograph of an elderly man in a turban and robe
      caption: Muhammad Abduh (1849-1905), a teacher at al-Azhar and from 1899 the Grand Mufti of Egypt, argued that Muslims must use reason to meet a changed world.
      credit: "The original uploader was Zerida at English Wikipedia., Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Muhammad_Abduh.jpg"
    body: |
      By the nineteenth century Britain, France and Russia ruled or pressed on much of the Muslim world, and European science and technology were visibly ahead. Many Muslim writers asked what had gone wrong and what to do. One answer is called **Islamic modernism**: reform religious thought so that Islam and modern learning fit together.

      Jamal al-Din al-Afghani (1838/9-1897; his birthplace is disputed between Afghanistan and Iran) preached Muslim unity against imperialism. His *Refutation of the Materialists* (1881) is among the earliest Islamic replies to Darwin, though critics said it misdescribed evolutionary biology; later he accepted animal evolution but not human evolution, because humans have souls.

      His student Muhammad Abduh (1849-1905) worked with him on the journal *al-Urwa al-Wuthqa* (Paris, 1884), tried to reform teaching at al-Azhar, and became Grand Mufti of Egypt in 1899. He held that intelligence is given so that people are guided by knowledge, and that education should include science and the training of reason.

  - type: mcq
    id: reform-q
    title: "Reform or rejection?"
    prompt: |
      According to the sources above, which is the best description of Islamic modernism in the nineteenth century?
    options:
      - text: Reformers such as Afghani and Abduh held that Muslims should use reason and learn modern science, while disagreeing with some Western ideas, such as Darwin on human origins in Afghani's case.
        correct: true
        feedback: |
          Yes. The movement combined openness to science with reform of religious thought and, for Afghani, resistance to imperialism.
      - text: Reformers held that science and Islam are enemies and that Muslims must abandon modern learning.
        feedback: |
          This is the opposite of what Abduh argued. Some later Muslim writers held rejectionist views, but this movement sought a fit.
      - text: Reformers held that the Qur'an must be rewritten in the light of European science.
        feedback: |
          No. They proposed new readings and new education, not a new text.
    explanation: |
      Even among the two leading modernists the views differ on details. That variety is the theme of the rest of the lesson.

  - type: text
    id: strategies
    title: "Three modern strategies"
    image:
      src: img/salam.webp
      alt: Photograph of an older man with a white beard in a suit, smiling
      caption: Abdus Salam (1926-1996) shared the 1979 Nobel Prize in Physics with Sheldon Glashow and Steven Weinberg for the theory unifying the weak and electromagnetic interactions.
      credit: "Molendijk, Bart / Anefo, CC BY-SA 3.0 nl, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Abdus_Salam_1987_(cropped).jpg"
    body: |
      From the 1970s three strategies became prominent. They are not the only ones, and many Muslims hold none of them.

      **Islamization of knowledge.** Ismail al-Faruqi (his book *Islamization of Knowledge* appeared in 1982, and he helped found the International Institute of Islamic Thought in 1981) proposed that the modern disciplines be mastered and then recast on Islamic principles. Critics fear that it mixes religion into science, limits academic freedom and imposes one reading of Islam.

      **Scientific miracles** (*i'jaz 'ilmi*). The French physician Maurice Bucaille (1920-1998) argued in *The Bible, the Qur'an and Science* (1976) that the Qur'an's statements agree with modern science, which he saw as a sign of divine origin. Abdul Majeed al-Zindani and others developed the claim, and the movement grew into a large literature. (Recall the lesson on the form of the Qur'an: i'jaz is the claim that the Qur'an cannot be matched.)

      **Harmonisation.** Nidhal Guessoum, in *Islam's Quantum Question* (2011), argued that evolution does not contradict core Muslim beliefs and that a careful reading of the Qur'an and the sciences can fit. A reviewer found tension in his aim of a "theistic science" combined with a clear boundary for scientific method.

      The physicist **Abdus Salam**, a Muslim laureate, saw the matter differently from the first. According to reports of the preface he wrote to Pervez Hoodbhoy's book *Islam and Science* (1991), he held in essence that there is no "Islamic science", only science, which is universal. Yet in his Nobel banquet speech he quoted the Qur'an (67:3-4) and said that seeking deeper understanding of nature is the creed of all physicists.

  - type: mcq
    id: strategies-q
    title: "Match the strategy"
    prompt: |
      A writer says: "The Qur'an says that humans were formed in stages in the womb, and embryology found exactly these stages, so the Qur'an must come from God." Which strategy is this?
    options:
      - text: "Scientific miracles (i'jaz 'ilmi): verses are read as anticipating discoveries, and the match is offered as evidence of divine origin."
        correct: true
        feedback: |
          Yes. The pattern is: find a verse, find a modern finding, claim the match is too good to be human.
      - text: "Islamization of knowledge: rebuilding the disciplines on Islamic principles."
        feedback: |
          That strategy concerns the foundations and curricula of the disciplines, not matching single verses to findings.
      - text: "Harmonisation: showing that a scientific theory does not contradict core beliefs."
        feedback: |
          Harmonisation answers a conflict. The writer here is not removing a conflict; he offers a match as proof of revelation.
    explanation: |
      The same sentence can be read as devotion, as apologetics, or as bad science. The next card asks what would make such a claim testable.

  - type: text
    id: ijaz
    title: "Testing a scientific-miracle claim"
    body: |
      Proponents argue that some verses state facts that nobody in the seventh century could have known, so their source must be divine. The claim has been defended by Muslims who find it moving and supported by publications and television programmes.

      Critics include Muslim scholars. Ziauddin Sardar called the movement a global craze that needs "mental gymnastics". Nidhal Guessoum says the real issue is the place of the Qur'an within science. Taner Edis argues that nearly anything can be read into a holy book. Among the objections raised: the claimed facts were already known in antiquity (for example, Greek scientists were dissecting human bodies by the third century BCE, so "three darknesses" in the womb, claimed for Qur'an 39:6, could have been observed earlier); the verses are too vague to count as miracles; and a claim that is revised each time science changes is not a test. Some also object on religious grounds: a faith resting on science will fall when science changes. Zafar Ishaq Ansari, for one, says the view that the Qur'an contains all knowledge is not the mainstream view.

      A claim that could be tested would say, before the discovery, something specific that was then found.

  - type: mcq
    id: ijaz-q
    title: "What would make a claim stronger?"
    prompt: |
      According to critics of scientific-miracle claims, which feature would make a claim of this kind harder to dismiss?
    options:
      - text: The verse states something specific that was not known in its time, and the reading was fixed before the discovery.
        correct: true
        feedback: |
          Yes. A specific statement, fixed in advance and unknown at the time, is what the critics say is usually missing.
      - text: The verse can be read, with some effort, as saying whatever science now says.
        feedback: |
          This is the weakness the critics point to. A flexible reading that follows the science after the fact cannot be wrong, so it cannot count as evidence.
      - text: Many people on television find the match impressive.
        feedback: |
          Popularity is not evidence. Many people can be moved by a match that experts consider loose.
    explanation: |
      Critics ask the same questions of any prediction. A believing Muslim may reply that the Qur'an's claim to be a sign does not depend on such a test (layer 3), and many Muslim scholars would add that the Qur'an is a book of guidance, not a textbook of science.

  - type: text
    id: evolution
    title: "What Muslims say about evolution: the numbers"
    body: |
      The best-known cross-country figures come from the Pew Research Center's 2013 report *The World's Muslims: Religion, Politics and Society*, based on face-to-face interviews in 39 countries and territories. The question on evolution, put in 22 of them, offered two views: that humans and other living things have evolved over time, or that humans have remained in their present form since the beginning of time.

      In 13 of the 22 countries, at least half of Muslims said they have evolved. The highest were Kazakhstan (79%) and Lebanon (78%). Tunisia was 45% and Malaysia 37%. In Pakistan 30% agreed, 38% disagreed and 32% did not know. Iraq was the only country in the Middle East and North Africa where a majority (67%) rejected evolution. In Bosnia-Herzegovina and Kosovo more devout Muslims were less likely to accept it, but Pew found no significant gap by devotion in other regions.

      Critics note that another study using written surveys of Pakistani and Malaysian Muslims found lower acceptance, and that a survey figure depends on how the question is worded. Salman Hameed's 2008 article in *Science* warned that creationism was already influential in the Muslim world, led by the Turkish writer Adnan Oktar, who writes as Harun Yahya. In 2015 Hameed wrote that he no longer agreed with his 2008 paper: Muslims respond to evolution in complex ways, and many accept even human evolution.

  - type: mcq
    id: evolution-q2
    title: "What do the numbers support?"
    prompt: |
      In the 2013 Pew survey Kazakhstan was at 79% and Pakistan at 30% for the view that humans and other living things evolved over time. Which conclusion do these figures support?
    options:
      - text: Muslims' views on evolution vary a great deal between countries, so "what Muslims think" has no single answer.
        correct: true
        feedback: |
          Yes. A gap of $79 - 30 = 49$ percentage points between two countries rules out one Muslim view. Why they differ (education, politics, local history) is a further question these data do not answer.
      - text: Islam causes rejection of evolution, since in some countries most Muslims reject it.
        feedback: |
          The data show a correlation with country, not a cause. The same religion shows high acceptance in other countries, so religion alone cannot be the whole explanation.
      - text: In every Muslim-majority country most people accept evolution.
        feedback: |
          Not so: Pew found that Iraq had 67% rejecting, and in Pakistan fewer than a third agreed.
    explanation: |
      Counting: 22 countries asked and 13 with at least half agreeing leaves $22 - 13 = 9$ with fewer than half.
      Layers: the figures are established, with the caveat of method. Why acceptance varies is a live debate. Whether evolution is compatible with the Qur'an is argued by Muslims on all sides (layer 3).

  - type: text
    id: salam
    title: "A Nobel laureate and a legal wall"
    body: |
      Abdus Salam was born in 1926 in Jhang, in British India (now Pakistan), and died in 1996 in Oxford. He shared the 1979 Nobel Prize in Physics with Glashow and Weinberg. In 1964 he founded the International Centre for Theoretical Physics in Trieste.

      Salam was an **Ahmadi**. The Ahmadiyya is a movement founded in British India in the late nineteenth century by Mirza Ghulam Ahmad (1835-1908). Its members call themselves Muslims, but mainstream Muslims, who hold that Muhammad was the final prophet, reject the founder's claim to prophethood. In September 1974 the Pakistani Parliament, under Prime Minister Zulfikar Ali Bhutto, amended the constitution to declare Ahmadis non-Muslim for legal purposes. Salam left Pakistan in protest. His tombstone first read "First Muslim Nobel Laureate", and the word "Muslim" was later removed by the government.

      Whether Ahmadis are Muslims is a theological dispute among Muslims, and a legal one in Pakistan, which this course does not decide. For our question the case shows two facts: a Muslim-born scientist won the highest prize in physics, and who counts as a Muslim in a country can shape who is honoured for science there.

  - type: mcq
    id: salam-q
    title: "Handling a delicate case"
    prompt: |
      Which statement about Abdus Salam is stated in neutral, checkable terms?
    options:
      - text: Salam was an Ahmadi, shared the 1979 Nobel Prize in Physics, and left Pakistan after its 1974 constitutional amendment declared Ahmadis non-Muslim for legal purposes.
        correct: true
        feedback: |
          Yes. Each part is a documented event, and the sentence does not settle the theological question.
      - text: Salam was not a real Muslim, so his prize says nothing about Muslims and science.
        feedback: |
          This takes a side in a theological dispute and uses it to dismiss a fact. The course does not decide who is a Muslim; Salam called himself one and spoke of faith as part of his work.
      - text: Everyone agrees that Ahmadis are Muslims, and the 1974 amendment had no effect.
        feedback: |
          Not so. Mainstream Muslims reject the founder's claim to prophethood, and the amendment had legal effects, which is why Salam left.
    explanation: |
      Describing a tradition as its members do ("Ahmadis call themselves Muslims") and reporting what others hold ("most other groups reject the founder's claims") keeps both views visible without choosing.

  - type: mcq
    id: voices
    title: "Many voices, one question"
    prompt: |
      Here are six views on how Islam and science relate. Select every pairing of a person with a position that is correct as described.
    multiple: true
    options:
      - text: Al-Faruqi, who proposed recasting the modern disciplines on Islamic principles (Islamization of knowledge).
        correct: true
        feedback: |
          Right.
      - text: Guessoum, who argues that evolution does not contradict core Muslim beliefs.
        correct: true
        feedback: |
          Right.
      - text: Abdus Salam, who in essence held that science is one and universal, with no "Islamic science".
        correct: true
        feedback: |
          Right, according to the reports of his preface to Hoodbhoy's book. Hoodbhoy himself, a Pakistani physicist, wrote against what he saw as the "Islamization" of science.
      - text: Bucaille, who argued that the Qur'an contains scientific statements that match modern findings.
        correct: true
        feedback: |
          Right. His 1976 book is the best-known source of the scientific-miracles movement.
      - text: Afghani, who held that humans cannot have evolved from other animals, which he maintained from his first writing on the subject to his last.
        feedback: |
          Not so. He first wrote against Darwin in 1881, and later accepted evolution in general, rejecting only human evolution. His position shifted.
    explanation: |
      Five names, five positions, and the variety is larger still: there are Muslims who hold literal creationism, Muslims who accept evolution in full, and many who have never thought about it. Nobody speaks for all.

  - type: mcq
    id: traps
    title: "Spot the slip"
    prompt: |
      Select every statement that is a mistake.
    multiple: true
    options:
      - text: Medieval Muslim science was just a copy of the Greeks, so nothing original came from it.
        correct: true
        feedback: |
          A mistake. Al-Jabr, Ibn al-Haytham's Optics and Ibn al-Nafis's criticism of Galen are examples of new claims, though historians debate how new each was.
      - text: Muslims today all reject evolution.
        correct: true
        feedback: |
          A mistake. Pew found at least half accepting it in 13 of 22 countries.
      - text: The "scientific miracles" movement is supported by all Muslim scholars.
        correct: true
        feedback: |
          A mistake. Muslim scholars and scientists are among its critics, on scientific and on religious grounds.
      - text: Historians disagree on whether the House of Wisdom was a formal academy.
        feedback: |
          Accurate. The sources are thin and read differently.
    explanation: |
      Each slip replaces variety with one story. The fair picture keeps the debts and the originality, the acceptance and the rejection, the supporters and the critics.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      First: **what counts as the achievement?** One historian stresses translation and continuity, another originality and method. The same texts feed both views, and the weight given to each person differs.

      Second: **what should a religion say about science?** A Muslim may hold that the Qur'an is a source of facts, that it is guidance whose language leaves science to scientists, or that sciences should be rebuilt on Islamic principles. These are commitments (layer 3), and thoughtful Muslims hold each.

      Third: **how far do surveys speak for a religion?** The figures show that views differ by country. Why they differ, and what they would be without schools, politics and money, is a causal question that the numbers alone do not settle.

  - type: text
    id: summary
    body: |
      **Next:** the Level 16 traps round collects the misconceptions of this level, from the Qur'an's text and the hadith to kalam, Sufism, the shared prophets and modern science.
