id: ch16-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: Islam and the Qur'an"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: how the Qur'an was gathered, the claim that it cannot be imitated, the hadith and their chains, the schools of law and the split between Sunni and Shia, kalam and philosophy, Sufism, the figures the three books share, and science in the Muslim world. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone, and the feedback keeps the course's three layers apart: **established fact** (texts, finds, dates), **scholarly debate** (say which), and **faith commitment** (what a tradition holds). The *Qur'an* is the Muslim scripture; a *hadith* is a report of what the Prophet Muhammad said or did; *Sunni* and *Shia* are the two largest branches of Islam; $c.$ means about; years are CE.

  - type: mcq
    id: trap-once
    title: "One book, written down at once?"
    prompt: |
      A student says: "The Qur'an must have been written as one finished book in Muhammad's lifetime (he died in 632), or else it was invented much later. There is no middle." Which reply fits the evidence best?
    options:
      - text: "There is a middle. According to a report in al-Bukhari's hadith collection, the material was gathered into sheets under Abu Bakr (caliph 632 to 634) by Zayd ibn Thabit, and under Uthman (caliph 644 to 656) copies of a standard text were sent out. Historians also have early manuscripts: radiocarbon dating of two leaves in Birmingham gives 568 to 645 at 95.4%. How close the text is to what was recited in Muhammad's lifetime is argued, from 'very close' to 'a later shaping'."
        correct: true
        feedback: |
          Yes. The reports give a story of collection in stages; the manuscripts give a hard limit on how late the text can be; and scholars read the two together in different ways.
      - text: "The report of Uthman's copies is the only evidence, so the text was settled in 650 and nothing earlier can be shown."
        feedback: |
          The report is one source, but manuscripts add independent evidence. The Birmingham leaves (parchment dated 568 to 645) and a Sanaa leaf (578 to 669) are physical objects, and the date range of the first begins before any caliph named Uthman.
      - text: "The Birmingham leaves prove that the whole text of today was written down in Muhammad's lifetime."
        feedback: |
          They are two leaves, containing parts of surahs 18 to 20, and the date is a range for the parchment, not for the writing. They set a limit on how late those parts could be; they do not date the other 111 surahs.
    explanation: |
      Layers: the manuscripts and their radiocarbon ranges are established; how the text was gathered and how much it changed are scholarly debates (Wansbrough's late dating against the early dating of most others); that the Qur'an is revelation is a commitment of Muslims. An all-or-nothing story skips the middle where the evidence lies.

  - type: numeric
    id: trap-birmingham
    title: "How late can the Birmingham parchment be?"
    prompt: |
      The two Birmingham leaves were dated by radiocarbon to 568 to 645 CE at 95.4% confidence. Muhammad died in 632. Counting from 632, what is the largest number of years after his death that the parchment's date range allows?
    answer: 13
    tolerance: 0.5
    answerText: '13'
    wrong:
      - { value: 77, feedback: 'That is $645 - 568$, the width of the range. The question asks how far past 632 the range extends, so the start of the range does not enter.' }
      - { value: 63, feedback: 'That is $632 - 568$, the part of the range before his death. It shows that the parchment could be older than the Prophet, not how late it could be.' }
    hint: |
      Only the end of the range, 645, matters for "how late".
    explanation: |
      $645 - 632 = 13$ years. A radiocarbon date gives the age of the animal skin, not of the writing, and a range at 95.4% still leaves a 4.6% chance of falling outside. So this is a limit that makes a late invention hard to hold for these leaves, not a date for the whole book.

  - type: mcq
    id: trap-ijaz-translate
    title: "Inimitable means untranslatable?"
    prompt: |
      *I'jaz* is the doctrine that the Qur'an is **inimitable**: no one can produce a text like it. A student says: "So the Qur'an cannot be translated, and nothing of it can be understood in another language." Which reply is best?
    options:
      - text: "Two ideas are mixed. I'jaz is a claim about the Arabic text's style and form, which Muslim scholars hold cannot be matched. Translations are made and read by Muslims everywhere, but they are traditionally called renderings of the meanings (Pickthall titled his 1930 version The Meaning of the Glorious Koran), because the form cannot cross over."
        correct: true
        feedback: |
          Yes. Saying the form cannot be reproduced is not saying that the meaning cannot be conveyed. Many bilingual editions print the Arabic beside the English for this reason.
      - text: "Inimitable means that nobody has ever tried to write anything like it."
        feedback: |
          The doctrine is about a challenge. The Qur'an itself dares opponents to produce something like it (for example 17:88 and 2:23), and later scholars debated what the challenge showed. The claim is that attempts fail, not that none were made.
      - text: "Translations are forbidden, so Muslims read only Arabic."
        feedback: |
          Translations exist in a great many languages and are widely used. The tradition insists on keeping the Arabic as the Qur'an itself and on calling translations interpretations, which is a different thing from a ban.
    explanation: |
      Established: the verses of challenge and the practice of calling translations renderings of meaning. Debated: what the form's alleged inimitability proves; critics say a test that the judges define themselves is circular. Commitment: that the Qur'an is beyond imitation.

  - type: mcq
    id: trap-sahih
    title: "Sahih means true in every detail?"
    prompt: |
      A hadith is graded *sahih* ("sound") by a classical scholar. A student says: "So every word of it is certainly true history." Which reply is best?
    options:
      - text: "No. For Ibn Hajar al-Asqalani (1372 to 1449), sahih names a report that passes five conditions: a connected chain, upright narrators, accurate narrators, no hidden defect, and no contradiction of a better-attested report. It is a grade given by testing the chain and the text, and most sahih reports are single-line (*ahad*) ones, a lower status than *mutawatir*."
        correct: true
        feedback: |
          Yes. The grade says that the report passed the tests of the method. It is a strong claim for those who accept the method, and modern historians ask further questions the method did not ask, such as the common link.
      - text: "Sahih means the hadith is mutawatir, carried by so many chains that no collusion is possible."
        feedback: |
          Mutawatir is a separate, higher status. Most sahih reports are ahad (carried by fewer chains). The grades are different labels.
      - text: "Sahih means only that the narrators were famous."
        feedback: |
          Fame is not one of the conditions. The test is about character, accuracy, connection and the absence of defect.
    explanation: |
      Established: what the classical conditions are. Debated: how far they reach back to what the Prophet said (Goldziher and Schacht were doubtful; Azami and Motzki defend more). Commitment: the authority that Sunni and Shia give to the reports differs, as the law lesson showed.

  - type: mcq
    id: trap-five
    title: "Which is not one of the five?"
    prompt: |
      Select every statement that is **not** one of Ibn Hajar's five conditions for a report to be called sahih.
    multiple: true
    options:
      - text: The report must be written down in the Prophet's own lifetime.
        correct: true
        feedback: |
          Not a condition. Early writing was limited, and the classical method tests the chain of persons, not the date of the first writing.
      - text: The report must be carried by every Muslim community, in the same words.
        correct: true
        feedback: |
          Not a condition for sahih. A report carried by so many chains that collusion is implausible is called mutawatir, a separate grade.
      - text: Every narrator is trustworthy in character (*adl*) and accurate (*dabt*).
        feedback: |
          This is among the five, as two of the conditions.
      - text: The report has no hidden defect (*illa*) and does not contradict a better-attested one.
        feedback: |
          Among the five: the last two conditions.
    explanation: |
      The five: connected chain, upright narrators, accurate narrators, no hidden defect, no contradiction of a better-attested report. Nothing in them is about how early the text was first written.

  - type: mcq
    id: trap-common-link
    title: "A common link is the inventor?"
    prompt: |
      In a bundle of chains for one hadith, many separate lines of narrators all pass through one man, here called Idris, and above him there is a single strand back to the Prophet. A student says: "The common link is the forger, so the hadith is false." Another says: "Many chains reach him, so it must be authentic." Which reply is best?
    options:
      - text: "Neither follows. Schacht and Juynboll read the common link as the earliest person the evidence can reach, and many such readers suspect that the single strand above him was made later. Motzki and others hold that the common link was a real teacher who collected the report, and that evidence from chains together with the variant texts can date the sources. The pattern shows where spreading begins; what lies above that point is the debate."
        correct: true
        feedback: |
          Yes. A common link tells us that the report was circulating by his time. Whether he made it up, passed it on faithfully or shaped it is argued from the texts and the chains.
      - text: "The common link is always the Prophet, since all chains lead there in the end."
        feedback: |
          The common link is the point where chains first converge below the top, not the end of the chain. Above him there may be only one thin line.
      - text: "A common link proves that the chains were forged independently by each narrator."
        feedback: |
          The opposite: the pattern shows many lines meeting at a single man, which is why it is studied. Independent forgery would not make separate lines converge on one person.
    explanation: |
      Established: the pattern of chains in the collections. Debated: what the common link did, with the sceptical and the defending schools reading the same pattern differently. Commitment: the weight a believer gives to the transmitted sunnah.

  - type: numeric
    id: trap-gap
    title: "From the common link back to the Prophet"
    prompt: |
      In the invented example of the lesson on chains, the common link, Idris, died in 760. The Prophet died in 632. Roughly how many years separate the two deaths?
    answer: 128
    tolerance: 0.5
    answerText: '128'
    wrong:
      - { value: 1392, feedback: 'That adds the two years. A gap between dates is a subtraction.' }
      - { value: 28, feedback: 'A slip in the tens place: $760 - 632 = 128$, not 28.' }
    hint: |
      Subtract the earlier year from the later one.
    explanation: |
      $760 - 632 = 128$ years. The number matters for the argument: the evidence of many independent lines starts well after the Prophet, and the sceptic asks what happened in the interval while the defender points to teachers and students who lived inside it.

  - type: mcq
    id: trap-schools
    title: "The four schools are four sects?"
    prompt: |
      A student says: "Hanafi, Maliki, Shafi'i and Hanbali are four Sunni sects, each saying the others are not true Muslims." Which reply is best?
    options:
      - text: "A *madhhab* is a school of law: a method and a body of rulings named after an early jurist (Abu Hanifa 699 to 767, Malik c. 711 to 795, al-Shafi'i 767 to 820, Ahmad ibn Hanbal 780 to 855). The four recognise each other's rulings as legitimate, and a person may change school. They differ on method and details, not on who counts as a Muslim."
        correct: true
        feedback: |
          Yes. A school is closer to a tradition of legal reasoning, like different approaches to one body of law, than to a separate faith community.
      - text: "They are four separate religions that share a book."
        feedback: |
          All four hold the same Qur'an, the same five pillars, and the same basic creed. The differences concern how to reach rulings and what they say in particular cases.
      - text: "They are all the same: the schools give identical rulings on every question."
        feedback: |
          They differ on many details (the sources they rank, the role of reasoning by analogy, particular rulings). Not identical, and not hostile.
    explanation: |
      Established: the names, dates and regions. Debated: how the schools formed and how much they reflect later projection onto early jurists. Commitment: which school one follows, or whether one follows a school at all.

  - type: mcq
    id: trap-ghadir
    title: "Sunni and Shia disagree about a word?"
    prompt: |
      Sunni and Shia tell of a speech at Ghadir Khumm in 632 in which Muhammad said of Ali: "Whoever I am *mawla* to, Ali is *mawla* to him." A student says: "So they disagree about whether the event happened." Which reply is best?
    options:
      - text: "Mostly no. The event and its words are widely reported on both sides. The disagreement is over what *mawla* means: Sunni readers tend to take it as 'friend' or 'beloved ally', while Shia readers take it as 'leader' or 'master', so that Ali was named as successor. Both readings are tied to the question of who should have led after 632, which the Saqifa meeting seemed to answer in Abu Bakr's favour."
        correct: true
        feedback: |
          Yes. Same speech, different meaning of one word, and a different view of authority after the Prophet.
      - text: "Shia deny that Muhammad said anything about Ali."
        feedback: |
          The Shia stress the speech. The disagreement is not over its existence.
      - text: "Sunni and Shia disagree on God and the Qur'an too, so they are really two religions."
        feedback: |
          They share the Qur'an, God's oneness and the prophethood of Muhammad. The main split began as a question of leadership and grew into different bodies of law and tradition.
    explanation: |
      Established: that the speech is reported and that Abu Bakr was chosen. Debated: how to read mawla in its setting. Commitment: whether leadership passed by designation, as Shia hold, or by the community's choice, as Sunni hold.

  - type: mcq
    id: trap-ghazali-cause
    title: "Ghazali denied that fire burns cotton?"
    prompt: |
      In the seventeenth discussion of *The Incoherence of the Philosophers* (c. 1095), al-Ghazali (c. 1056 to 1111) discusses cotton touching fire. A student says: "He denied that cause and effect are regular, so he opposed science." Which reply is best?
    options:
      - text: "He agrees that cotton burns whenever it meets fire. What he denies is that the burning follows by **necessity** from the fire itself, since for him God's will is the real cause and could act otherwise. Scholars debate how far this was full occasionalism; on the reading that he denied necessity and not regularity, a scientist can use the same laws."
        correct: true
        feedback: |
          Yes. Regularity is observed fact; necessity is a metaphysical claim. Averroes replied that denying real causes would undermine knowledge, and Ghazali's defenders say that regularity is left standing.
      - text: "He held that fire never has any effect, and that cotton burns by chance."
        feedback: |
          Not chance: for him God acts, regularly and by habit. Chance would be a denial of God's order.
      - text: "He held that science is false and should be forbidden."
        feedback: |
          In his autobiography, in the translation, he says mathematics has nothing to do with religious belief or denial, and that defending Islam by denying it would harm religion.
    explanation: |
      Layers: the text of the discussion is established; its right reading (occasionalism or not) is a live debate; whether God is the sole cause is a commitment. The Hume comparison is also debated.

  - type: mcq
    id: trap-double
    title: "Averroes taught a double truth?"
    prompt: |
      A critic says: "Averroes (Ibn Rushd, 1126 to 1198) taught that religion and philosophy can contradict each other and both be true." What do scholars of his work say?
    options:
      - text: "He held one truth reached by different roads: demonstration for philosophers, rhetoric and example for most people. In his *Decisive Treatise* (1178) a conflict between scripture and demonstration is only apparent and is resolved by reading the scripture non-literally (*ta'wil*). The label 'double truth' was attached by later opponents."
        correct: true
        feedback: |
          Yes. Whether his rule of interpretation is wise is debated, but 'two contradictory truths' is not what he said.
      - text: "He taught that scripture is false when it conflicts with philosophy."
        feedback: |
          He held scripture true, and read it so that no conflict remained. He also held that eternity of the world was not unbelief.
      - text: "He rejected philosophy and defended only scripture."
        feedback: |
          He was a philosopher, a judge (*qadi*) and a physician who wrote commentaries on Aristotle.
    explanation: |
      Established: the titles and dates. Debated: how he saw the limits of interpretation. A tidy slogan ('double truth') hid a more careful view.

  - type: mcq
    id: trap-sufi-alien
    title: "Sufism is an alien sect?"
    prompt: |
      A student says: "Sufism is not part of Islam. It is a separate sect, borrowed from outside, with whirling dervishes and poetry." Which reply is best?
    options:
      - text: "Sufis themselves, and most historians, see it as part of Islam: *tasawwuf*, the inner path of purifying the heart and remembering God (*dhikr*), shown by early figures such as Hasan al-Basri (c. 642 to 728). Its guides stressed that the inner path and the outward law go together. Some practices are contested by other Muslims, and some scholars debate outside influences, but Sufis are Sunni or Shia, not a third branch."
        correct: true
        feedback: |
          Yes. The word *Sufi* probably comes from *suf*, wool, as worn by early ascetics. Sufism runs through the schools of law and both major branches.
      - text: "Sufis reject the law and the pillars of Islam."
        feedback: |
          Some wandering groups (the Qalandiyya) did, but the main orders insisted on the law; Junayd (d. 910) was known as a sober teacher bound by it.
      - text: "Sufism was invented in the twelfth century as a response to the Crusades."
        feedback: |
          Sufi figures appear in the eighth and ninth centuries. Rumi (1207 to 1273) and Ibn Arabi (1165 to 1240) are later.
    explanation: |
      Established: early figures, orders and the link with the law. Debated: the sources of the movement and how far later forms depart from early ones. Commitment: the value of the inner path, and whether practices such as saint veneration are right.

  - type: mcq
    id: trap-taymiyya
    title: "Ibn Taymiyya was against all Sufis?"
    prompt: |
      Ibn Taymiyya (1263 to 1328) criticised Ibn Arabi's teaching and some Sufi practices. A student says: "So he was anti-Sufi." Which reply is closest to historians' accounts?
    options:
      - text: "He was affiliated with the Qadiriyya order and praised many Sufi masters. His objections were to particular things: veneration of saints and travel to tombs, and the teaching he associated with Ibn Arabi, whose phrase 'unity of being' (*wahdat al-wujud*) he read as erasing the line between God and the world. Defenders of Ibn Arabi say critics misread it."
        correct: true
        feedback: |
          Yes. A critic of some Sufi ideas is not an opponent of all Sufism.
      - text: "He wrote nothing on Sufism."
        feedback: |
          He wrote on it often, praising some masters and criticising some practices.
      - text: "He coined 'unity of being' as his own teaching."
        feedback: |
          Reference works note the phrase seems to be first ascribed to Ibn Arabi in the polemics of Ibn Taymiyya himself; it is not Ibn Arabi's own wording.
    explanation: |
      Established: his writings and affiliation. Debated: how to read Ibn Arabi's language, and how much weight to give each side's reading. One Muslim thinker can be a critic and a friend of Sufism at once.

  - type: mcq
    id: trap-copies
    title: "The Qur'an copies the Bible?"
    prompt: |
      Abraham, Moses and Jesus appear in the Torah, the Gospels and the Qur'an, with differences. A student says: "The Qur'an just copied the Bible, with mistakes." Which reply is best?
    options:
      - text: "The overlap is real, and the stories differ in details. Historians read it in different ways: as borrowing, as a shared stock of tradition, or, as Gabriel Said Reynolds (2010) argues, as the Qur'an in conversation with Jewish and Christian scripture. Muslims hold that the Qur'an is revelation that confirms and corrects earlier scriptures. Whether 'copy' is the right word depends on the premise one starts from."
        correct: true
        feedback: |
          Yes. 'Copy' assumes the answer to the main question, and the Qur'an does not retell the Bible verse by verse; it selects, changes and comments.
      - text: "There is no overlap at all, since the books are about different men."
        feedback: |
          The Qur'an names Abraham, Moses (136 times, by one common count) and Jesus, and lists them with the earlier prophets (2:136).
      - text: "The overlap proves that all three books are revelation."
        feedback: |
          An overlap fits several explanations, from shared revelation to shared tradition. It does not decide among them.
    explanation: |
      Layers: the texts are established; the relation between them is debated by historians; revelation is a commitment. Even the word 'copy' hides a premise.

  - type: mcq
    id: trap-jesus
    title: "Muslims reject Jesus?"
    prompt: |
      A student says: "Muslims reject Jesus, because they are a rival religion." Which reply is closest to the Qur'an and to Muslim belief?
    options:
      - text: "According to the Qur'an, Jesus (*Isa*) is the Messiah, born of the virgin Mary (3:45), a messenger of God, and honoured by Muslims, who do not call him the Son of God. For the end of his life, 4:157 says 'they did not kill him, nor did they crucify him', and Muslims read it in several ways (a substitute, or a rescue, or something else). Muslims hold that God raised him, and many believe he will return."
        correct: true
        feedback: |
          Yes. Jesus is a major prophet in Islam. The differences with Christian belief are about his divinity and his crucifixion, and historians (Crossan, Ehrman, Dunn and others) hold that a crucifixion under Pilate is among the best-attested facts, which Muslim readers of 4:157 take in their own way.
      - text: "Islam holds that Jesus never existed."
        feedback: |
          The Qur'an has a surah named for his mother Mary and speaks of Jesus in several others.
      - text: "Muslims and Christians hold the same beliefs about Jesus, with different names."
        feedback: |
          Not so. They differ on whether he is God's Son, on the Trinity, and on what happened at the end of his life.
    explanation: |
      Established: what the Qur'an and the Gospels each say. Debated: how historians weigh each. Commitment: who Jesus was and what happened to him, held differently by Christians and Muslims.

  - type: mcq
    id: trap-ghazali-science
    title: "Ghazali killed Islamic science?"
    prompt: |
      A popular story says Islamic science declined after al-Ghazali attacked the philosophers (c. 1095). Which reply is best?
    options:
      - text: "Historians such as George Saliba (2007) call this a 'classical narrative' that made scholars stop looking: high-level work continued after Ghazali, for example at the Maragha observatory (begun in 1259), where the Tusi couple was developed. Ghazali himself wrote that rejecting mathematics in the name of Islam would harm religion. Why science later weakened is still debated, and Saliba is disputed too."
        correct: true
        feedback: |
          Yes. The date of the story is wrong and so is its target; the real causes of change are still argued over.
      - text: "Science thrived without interruption until the twentieth century."
        feedback: |
          This overcorrects. Historians do discuss a weakening, perhaps after the sixteenth century, and disagree about why.
      - text: "Ghazali wrote the Incoherence in 1259, so he could not have affected Maragha."
        feedback: |
          Wrong date: the Incoherence is c. 1095, and Maragha is 1259. The point is that work at Maragha came after Ghazali.
    explanation: |
      Established: Maragha and the dates. Debated: causes of decline and the weight of Ghazali's influence. Both a hero story and a villain story are one-line histories.

  - type: mcq
    id: trap-evolution
    title: "All Muslims reject evolution?"
    prompt: |
      The Pew Research Center's 2013 report on Muslims asked about evolution in 22 countries. A student says: "Muslims all reject evolution." Which reply do the figures support?
    options:
      - text: "No. Views vary greatly by country: 79% of Muslims in Kazakhstan and 78% in Lebanon said humans and other living things evolved over time, 30% in Pakistan, and in Iraq 67% rejected it. 'What Muslims think' has no single answer, and the way a question is worded changes the figure."
        correct: true
        feedback: |
          Yes. Muslims also differ on the theological question, and some, like Guessoum, argue that evolution does not conflict with core Muslim beliefs, while others hold literal creationism.
      - text: "Yes, since Islam teaches creation by God, and that rules out evolution."
        feedback: |
          Many Muslims hold God as creator and accept evolution; how to read the creation accounts is argued among Muslims on all sides.
      - text: "In every Muslim-majority country most people accept it."
        feedback: |
          Not so: Iraq had 67% rejecting, and in Pakistan fewer than a third agreed.
    explanation: |
      Layers: the survey figures are established, with caveats about method. Why they vary is a live debate. Whether evolution fits the Qur'an is a question Muslims answer differently.

  - type: numeric
    id: trap-pew
    title: "A share of countries"
    prompt: |
      In the 2013 Pew report, at least half of Muslims said humans and other living things evolved over time in 13 of the 22 countries asked. What percentage of those 22 countries is that? Round to a whole number.
    answer: 59
    tolerance: 0.6
    answerText: '59'
    wrong:
      - { value: 50, feedback: '"At least half" refers to the share of Muslims inside each country. The question asks about the share of countries.' }
      - { value: 13, feedback: '13 is the count of countries, not a percentage.' }
    hint: |
      Divide 13 by 22 and multiply by 100.
    explanation: |
      $13/22 \approx 0.59$, so 59% of the countries surveyed. It is a share of countries, not of Muslims: the countries differ greatly in size, and Pew's countries are a sample of 22, not all Muslim-majority lands.

  - type: mcq
    id: trap-miracles
    title: "Scientific miracles are the mainstream view?"
    prompt: |
      The movement of "scientific miracles" (*i'jaz 'ilmi*) holds that the Qur'an anticipates modern findings. Maurice Bucaille (1920 to 1998) argued this in 1976. A student says: "All Muslim scholars support it." Which reply is best?
    options:
      - text: "It is popular, but not universal. Muslim scholars and scientists are among its critics on scientific grounds (verses are fitted to findings after the fact) and on religious grounds (the Qur'an is guidance, not a textbook). Others, such as Guessoum, seek a harmony between the sciences and a careful reading, without treating verses as predictions."
        correct: true
        feedback: |
          Yes. Defenders see a sign of divine origin; critics see a test that can only be passed after the answer is known. Muslims hold each position.
      - text: "It was rejected by all Muslim scholars from the start."
        feedback: |
          It grew into a large literature and has many followers and writers, including Abdul Majeed al-Zindani.
      - text: "It has been shown to be confirmed by experiments."
        feedback: |
          A claim that a verse fits a finding is an interpretation, not an experiment, and critics note how readings change when the science changes.
    explanation: |
      Established: the books and who wrote them. Debated: whether the readings are fair. Commitment: whether the Qur'an is a source of scientific facts or of guidance. A movement can be popular and contested at once.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      The traps share one habit: replacing a range of views with one slogan. The real disagreements sit in a few places.

      First, **how much the early evidence can bear**. Historians who trust the traditional account of the Qur'an's collection, and those who place the text's shaping later, read the same reports and manuscripts and weigh them differently. The same holds for the hadith: the chains are data, and the sceptic and the defender read the common link in opposite ways.

      Second, **what a tradition's own authorities decide**. The legal schools, the Sunni and Shia views of leadership, and the Sufi and critics' views of the inner path are commitments about authority (layer 3) that no manuscript can settle.

      Third, **how the sacred relates to the modern**. Whether the Qur'an speaks about science, or only guides, and how one reads the books shared with Jews and Christians, depend on a premise about revelation that is held, not proved.

  - type: text
    id: summary
    title: "What this round tested"
    body: |
      Each trap was a shortcut one step too far. **The Qur'an's text**: it was gathered in stages according to the reports (Abu Bakr, Zayd ibn Thabit, Uthman), and leaves in Birmingham give parchment dates of 568 to 645, which is at most $645 - 632 = 13$ years after Muhammad's death. **I'jaz**: inimitable is a claim about the form of the Arabic, not a claim that meaning cannot be conveyed. **Hadith**: sahih means five conditions are met (connected chain, upright and accurate narrators, no hidden defect, no contradiction of a better report), not certainty in every detail, and a common link shows where spreading begins, not who invented. **Law**: the four schools are legal methods that recognise one another, and Sunni and Shia read the Ghadir word *mawla* as 'friend' and 'leader'. **Kalam**: Ghazali denies necessity, not regularity, and Averroes taught one truth by two roads, not a double truth. **Sufism**: part of Islam, and Ibn Taymiyya criticised particular practices without being anti-Sufi. **Shared figures**: the Qur'an overlaps the Bible and relates to it in ways historians argue about, and Jesus is a major prophet for Muslims. **Modern**: Ghazali did not end science, Pew finds that acceptance of evolution varies from 79% to 30%, and $13/22 \approx 59\%$ of countries asked had at least half accepting, and scientific miracles are popular and contested.

      Where thoughtful people part ways: in how much the early evidence can bear, in which authority decides between readings, and in the premise about revelation brought to the question.

      **Next:** a quick recall of the level's main distinctions (the lesson Quick Recall), and then its content map.
