id: ch16-shared
title: "Shared Figures: Abraham, Moses, Jesus in Three Books"
kind: concept
own: |
  The question: when the Torah, the Gospels and the Qur'an all speak of Abraham, Moses and Jesus, are they telling the same story, and what would "the same" mean? Everything is taught according to someone: each book, each tradition, and historians. Bible quotations are from the World English Bible, Qur'an quotations from the Sahih International translation.
  - **Abraham.** According to Genesis, Abraham is the man of the covenant, promised to be "the father of a multitude of nations" (Genesis 17:4), and the man who is told to offer his son Isaac. According to the Qur'an he is a *hanif* ("one inclining toward truth"), a Muslim in the sense of one who submits, whom God "took as an intimate friend" (4:125), and the Qur'an's account of the sacrifice {{ does not name the son, who agrees to it }}. According to the Qur'an he and Ishmael raised the foundations of the House (2:127), the Kaaba.
  - **Moses.** According to the Torah he is the lawgiver at Sinai, to whom "Yahweh spoke ... face to face" (Exodus 33:11). According to the Qur'an he is {{ the prophet named most often (136 times by one common count) }}, and "Allah spoke to Moses with direct speech" (4:164).
  - **Jesus.** According to the Gospels Jesus is the Christ, the Son of God (John 20:31), crucified (Mark 15:37) and, according to Christians, risen. According to the Qur'an he is "the Messiah, Jesus the son of Mary", born of Mary and "but a messenger of Allah" (4:171), and {{ it says "they did not kill him, nor did they crucify him" (4:157), and Muslims read this verse in several ways }}.
  - **Two ways to see the other's text.** According to most Muslim scholars, earlier scriptures were altered (*tahrif*); the word covers both a change of text (*tahrif al-nass*) and a wrong reading of the meaning (*tahrif al-ma'na*). According to many Christians, the new covenant fulfils the old, and the Church has not replaced the Jewish people; some call the older form *supersessionism* (replacement). Jewish tradition does not accept Jesus as Messiah, holding that the changes expected of the Messiah have not happened.
  - **Historians and believers.** Historians read the three books as texts with histories and compare them. Most agree {{ that Jesus was baptised by John and crucified under Pilate }}. Believers of each tradition hold revelation as the source of their book, and that is a commitment (layer 3), neither proved nor refuted by the comparison.
  - **Three layers.** Established: what each book says, verse by verse. Live debate: how the books relate (borrowing, shared sources, or a common tradition), which son was meant, how to read 4:157. Commitment: whether any book is revelation, and what it means to say that two accounts describe the same man.

cards:
  - type: mcq
    id: hook
    title: "Guess: one Abraham, three books?"
    prompt: |
      Guessing is the point. Three books, the Torah (the Jewish Bible's first five books), the Gospels (the Christian New Testament accounts of Jesus) and the Qur'an (the Muslim scripture), all speak of Abraham, Moses and Jesus. Before reading them side by side, what would you expect?
    options:
      - text: Each book names some of the same people, but tells different things about them, and each tradition explains that difference in its own way.
        correct: true
        feedback: |
          Yes. The names overlap a great deal, the stories partly overlap, and the differences are where the questions are. This lesson reads the passages and keeps what each book says apart from what historians say and from what believers hold.
      - text: The three books tell exactly the same stories, so the differences are only the language.
        feedback: |
          Not so. The Torah has no Jesus at all, and the Gospels tell of Abraham only briefly. Even the stories that appear in two books are told with changes, as we will see.
      - text: The books share nothing but a few names that happen to coincide.
        feedback: |
          Too strong. The Qur'an itself lists them together: "We make no distinction between any of them" (2:136, after naming Abraham, Ishmael, Isaac, Jacob, Moses and Jesus). The overlap is real and large.
    explanation: |
      So the lesson asks two questions: what does each book say, and what would it mean for two accounts to be about the same person?

  - type: text
    id: abraham-genesis
    title: "Abraham in Genesis"
    image:
      src: img/caravaggio-isaac.webp
      alt: Painting of an old man gripping a boy by the head while holding a knife, an angel seizing his arm, and a ram at the side
      caption: Caravaggio's Sacrifice of Isaac (1603, Uffizi) shows Genesis 22 as a painter of Christian Italy saw it, with the angel stopping the knife and the ram beside them.
      credit: "Caravaggio, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Sacrifice_of_Isaac-Caravaggio_(Uffizi).jpg"
    body: |
      According to the book of Genesis, God makes a **covenant** (a solemn agreement) with Abram and renames him Abraham. In the World English Bible, God says: "You will be the father of a multitude of nations" (Genesis 17:4). The covenant includes circumcision (Genesis 17).

      Then comes the great test, Genesis 22. God says to him, in the same translation: "Now take your son, your only son, whom you love, even Isaac, and go into the land of Moriah. Offer him there as a burnt offering" (Genesis 22:2). As the story is told, Abraham sets out, binds Isaac, and takes the knife. An angel calls to him from heaven and stops him, and he offers a ram caught in a thicket instead. Jewish tradition calls the story the *Akedah*, "the binding". Early Christian writers often read Isaac as a foreshadowing of Christ, and Hebrews 11:17-19 speaks of Abraham's faith that God could raise Isaac from the dead.

  - type: text
    id: abraham-quran
    title: "Abraham in the Qur'an"
    body: |
      The Qur'an also tells of Abraham (*Ibrahim*). According to it he is "neither a Jew nor a Christian, but ... one inclining toward truth, a Muslim [submitting to Allah]" (3:67, Sahih International). The word translated "inclining toward truth" is *hanif*, a title for the upright monotheist. And "Allah took Abraham as an intimate friend" (4:125). The Bible also calls him a friend: "Abraham my friend" (Isaiah 41:8, World English Bible), and Muslims call him *Khalil Allah*, "friend of God".

      The sacrifice appears in 37:99 to 37:113. There Abraham asks for a righteous child and receives "good tidings of a forbearing boy" (37:101). When the boy has grown, Abraham says: "I have seen in a dream that I [must] sacrifice you, so see what you think." The son answers: "O my father, do as you are commanded. You will find me, if Allah wills, of the steadfast" (37:102). "We called to him, 'O Abraham, you have fulfilled the vision'" and "ransomed him with a great sacrifice" (37:104-107). Only afterwards: "We gave him good tidings of Isaac" (37:112).

      So in the Qur'an's text the son is **not named**. Which son was meant has been argued inside Islam. Early scholars such as Ibn Qutayba and al-Tabari argued for Isaac, while most Muslims came to hold that it was Ishmael, partly because the birth of Isaac is announced after the story. The festival of Eid al-Adha commemorates the submission of Abraham and his son. The Qur'an also says that Abraham, with Ishmael, was "raising the foundations of the House" (2:127), which Muslim tradition identifies with the Kaaba in Mecca (recall the lesson Arabia Before Islam).

  - type: mcq
    id: abraham-q
    title: "Which book says what of Abraham?"
    prompt: |
      Select every statement that is correct about what the texts themselves say.
    multiple: true
    options:
      - text: Genesis 22 names the son as Isaac; the Qur'an's account of the sacrifice (37:99-113) does not name him.
        correct: true
        feedback: |
          Right. This is a difference in the texts, not an interpretation.
      - text: Both the Bible and the Qur'an call Abraham a friend of God.
        correct: true
        feedback: |
          Right. Isaiah 41:8 says "Abraham my friend" and 4:125 says God "took Abraham as an intimate friend". The title is shared.
      - text: In the Qur'an's account the son is told of the plan and agrees to it.
        correct: true
        feedback: |
          Right. In 37:102 Abraham asks "see what you think", and the son replies "do as you are commanded". In Genesis 22 Isaac asks about the lamb, but is not told the plan.
      - text: The Qur'an says that God did not substitute anything for the son.
        feedback: |
          It says the opposite: "We ransomed him with a great sacrifice" (37:107). Genesis names a ram (22:13); the Qur'an says only "a great sacrifice".
      - text: Genesis calls Abraham a hanif, a Muslim.
        feedback: |
          *Hanif* is the Qur'an's title (3:67). Genesis has its own titles: the man of the covenant, the father of a multitude of nations.
    explanation: |
      Layers: what the verses say is established. Which son the Qur'an meant is a live debate inside Islam. Whether the two stories come from one event is a faith question or a historian's question, depending on who is asked.

  - type: text
    id: moses
    title: "Moses"
    body: |
      According to the Torah, Moses leads Israel out of Egypt, receives the law at Sinai, and speaks with God: "Yahweh spoke to Moses face to face, as a man speaks to his friend" (Exodus 33:11, World English Bible). In Jewish tradition the Torah is the revelation given to Israel through him. (Recall the lesson The Torah and the Documentary Hypothesis for how historians read the authorship of the five books.)

      According to the Qur'an, Moses (*Musa*) is a messenger sent to Pharaoh and to the Israelites. The story includes the staff that becomes a serpent, the plagues, the crossing of the sea and the revelation at Sinai (*Tur*). Muslims call him *Kalim Allah*, "the one God spoke with", from "And Allah spoke to Moses with [direct] speech" (4:164, Sahih International). He is the person named most often in the Qur'an, 136 times by one common count; other counts differ by how names and titles are counted. The Qur'an also names a scripture, the *Tawrat* (Torah), given to Moses.

      So here the overlap is large (Egypt, Pharaoh, the sea, Sinai). The shape differs: the Torah tells it as the founding story of a people with its law, while the Qur'an tells it, in separate retellings across many chapters, as one in a line of messengers.

  - type: text
    id: jesus
    title: "Jesus in the Gospels and the Qur'an"
    body: |
      According to the Gospels, Jesus is the Messiah and Son of God. The Gospel of John says why it was written: "that you may believe that Jesus is the Christ, the Son of God" (John 20:31, World English Bible). It tells of his death on the cross: "Jesus cried out with a loud voice, and gave up the spirit" (Mark 15:37). According to Christians he rose from the dead. (Recall the lesson What Can History Say About a Miracle Claim? for how the sources for the resurrection are weighed.)

      According to the Qur'an, Jesus (*Isa*) is born of Mary (*Maryam*), who has a chapter named for her. The angels announce "a word from Him, whose name will be the Messiah, Jesus, the son of Mary" (3:45, Sahih International). He is like Adam: "He created him from dust; then He said to him, 'Be,' and he was" (3:59). And: "The Messiah, Jesus the son of Mary, was but a messenger of Allah ... Exalted is He above having a son" (4:171). So the Qur'an gives him the title Messiah and honours him highly, but does not call him God's son.

      The Torah, of course, has no Jesus. Jewish tradition, for its part, does not accept Jesus as the Messiah: it expects the Messiah to bring a set of changes in the world (the return of the exiles, a time of peace) that it holds did not happen, and it holds belief in his divinity to be incompatible with strict monotheism.

  - type: text
    id: crucifixion
    title: "Verse 4:157 and the cross"
    body: |
      The Qur'an speaks of those who said "Indeed, we have killed the Messiah, Jesus the son of Mary, the messenger of Allah". And then: "they did not kill him, nor did they crucify him; but [another] was made to resemble him to them" (4:157, Sahih International). The next verse says: "Rather, Allah raised him to Himself" (4:158). Other translations word the middle clause differently, for instance "it appeared so" to them, and the wording is part of the debate.

      Muslim readers have taken it in several ways. The most common reading is **substitution**: someone else was made to look like Jesus and was crucified in his place, and Jesus was raised alive. Early reports name different substitutes. Another reading holds that God caused him to die and then raised him. Some modern Muslim writers read the verse in a symbolic way: Mahmoud Ayoub took it as denying that humans can destroy God's Word, not as denying that Jesus died. According to the tradition, Jesus will return at the end of time.

      Historians work differently. They ask which events can be established by the usual methods for ancient history. Most scholars, including Christian, Jewish and secular ones such as John Dominic Crossan, Bart Ehrman and James Dunn, hold that Jesus was crucified under Pontius Pilate. John Meier, for one, argues that Christians would hardly have invented the painful death of their own leader, and non-Christian writers such as Josephus and Tacitus mention it. That is a historians' conclusion, layer 2. A believing Muslim reads the Qur'an as God's own word on the matter and holds it above later historical sources. That is a commitment, layer 3, and the historians' method does not decide between them.

  - type: mcq
    id: crucifixion-q
    title: "Reading the same verse"
    prompt: |
      According to the Qur'an's own text at 4:157-158 (Sahih International), which of these is stated?
    options:
      - text: They did not kill him nor crucify him, and Allah raised him to Himself.
        correct: true
        feedback: |
          Yes. The verses say this much. How "did not kill him" fits with history and with other readings is where the readings part.
      - text: Jesus was crucified, died, and was raised after three days.
        feedback: |
          That is the Gospels' account, held by Christians. The Qur'an's text says nothing of three days or a resurrection from the cross.
      - text: Jesus was crucified, but only his body died.
        feedback: |
          No Qur'an verse here says this. Some Christian and Muslim writers read texts spiritually, but this is not what 4:157 says.
      - text: The Qur'an says the crucifixion never took place in Jerusalem.
        feedback: |
          The verses do not name a place. They deny the killing and crucifixion of Jesus and say it was made to appear so to others.
    explanation: |
      The text and its readings are different layers. The substitution view is a reading of the words "was made to resemble him"; the symbolic view is another; both are held by Muslims.

  - type: text
    id: tahrif
    title: "How Muslims explain the differences: tahrif"
    body: |
      Why do the books differ? According to most Muslim scholars the Qur'an itself is the unaltered word of God, and earlier scriptures, the *Tawrat* (Torah), the *Zabur* (Psalms) and the *Injil* (Gospel), were revelations too, but the differences arise because they were changed. The word is **tahrif**, "alteration". The Qur'an confirms what came before it: it was revealed "confirming that which preceded it of the Scripture and as a criterion over it" (5:48, Sahih International).

      Scholars distinguish two kinds. **Tahrif al-ma'na** is an alteration of *meaning*: the text is the same, but it was misread. **Tahrif al-nass** is an alteration of the *text* itself. Ibn Hazm (11th century) argued the second, listing what he took to be contradictions and errors in the Hebrew Bible. Modern scholars such as Ilka Lindstedt argue that the Qur'an itself speaks of misreading more than of textual corruption, and Abdullah Saeed holds that Jewish and Christian scriptures can still be seen as books of God.

      Historians have a different story for the differences between the books: texts have histories (copies, translations, editing), as the lessons on the Torah and the Gospels showed, and the Qur'an arose in an Arabia where Jewish and Christian ideas were known. Gabriel Said Reynolds (*The Qur'an and Its Biblical Subtext*, 2010) argues that the Qur'an is best read as in conversation with Jewish and Christian scripture, which he thinks medieval commentators sometimes separated from it.

  - type: mcq
    id: tahrif-q
    title: "Two kinds of alteration"
    prompt: |
      According to Muslim scholars who discuss *tahrif*, which statement separates *tahrif al-ma'na* from *tahrif al-nass*?
    options:
      - text: Al-ma'na says the meaning was misread while the words stand; al-nass says the words themselves were changed.
        correct: true
        feedback: |
          Yes. The two have different consequences. If only the meaning was distorted, the books can be re-read; if the text was changed, the question is which parts are original.
      - text: Al-ma'na is about the Gospel and al-nass is about the Torah.
        feedback: |
          Both kinds have been discussed for all earlier scriptures. The distinction is about what was altered, not which book.
      - text: Al-ma'na means Muslims deny that the earlier books were revelation; al-nass means they accept them.
        feedback: |
          The reverse of the usual view. Most Muslim scholars say the earlier books were revealed. The question is what happened to them.
    explanation: |
      Layers: that the idea exists, and who held it, is established. Whether any earlier book was changed, and how, is argued by Muslim scholars and by historians, each by their own methods.

  - type: text
    id: supersession
    title: "And how others see the Qur'an and each other"
    body: |
      The same question runs the other way. According to many Christians, the new covenant in Christ *fulfils* the covenant of the Torah; the older name for a strong form of this is **supersessionism**, the view that the Church has replaced the Jewish people as God's people. Critics call it "replacement theology", and defenders often say "fulfilment" instead. After 1965 the Catholic Church's declaration *Nostra Aetate* turned away from the harder form, drawing on Romans 11: it says that God "holds the Jews most dear for the sake of their Fathers" and that the Jews "should not be presented as rejected or accursed by God". 

      In Jewish tradition the Gospels and the Qur'an are not part of Jewish scripture. Maimonides (1138 or 1135 to 1204), in one passage, thought the later rise of Christianity and Islam might in some way clear the way for the Messiah, while he also judged Jesus harshly. Different Jewish writers have spoken differently.

      Islam, too, is described as the final and most authentic expression of Abrahamic monotheism, which some outsiders call supersession as well. Muslims can point to the Qur'an's respect for the earlier prophets: "We make no distinction between any of them" (2:136).

  - type: mcq
    id: stance-q
    title: "Stating a view as its holders do"
    prompt: |
      A student writes: "The Christian view of the Jewish covenant is that it is cancelled." Which reply states the range of Christian views most fairly?
    options:
      - text: Some Christians have held that the Church replaced Israel, but many, especially since 1965, say the new covenant fulfils the old and that God has not rejected the Jewish people.
        correct: true
        feedback: |
          Yes. Christians differ on the question, and the Catholic declaration Nostra Aetate (1965) is one marker of a shift. Notice that the reply gives the range and does not pick a side.
      - text: All Christians have always held it, because the New Testament says so.
        feedback: |
          Too strong. Romans 11, which Nostra Aetate cites, is read by many as saying God has not rejected his people. Christians read the New Testament in different ways.
      - text: No Christian has ever held it, because the word is only an insult.
        feedback: |
          Historians do find replacement ideas in some writers, and the word "supersessionism" is used as a name for them. Some critics do use "replacement theology" as a criticism, which is why defenders prefer "fulfilment".
    explanation: |
      The course rule applies to every tradition: describe it as its adherents do, then give the scholarly view as scholarly.

  - type: mcq
    id: same-q
    title: "What would make it the same figure?"
    prompt: |
      Two readers agree that all three books name Abraham. What must they still settle before saying that the books describe "the same Abraham"?
    multiple: true
    options:
      - text: Whether "the same" means the same historical man, or the same figure as remembered in a tradition.
        correct: true
        feedback: |
          Yes. Since the 1970s scholars such as Thompson and Van Seters have argued that the patriarchal stories are late literary works rather than records, so for them "the same Abraham" can only mean the same remembered figure. A believer may mean a real person known through revelation.
      - text: Whether the differences are because of different traditions, changed texts, or one revelation told in different ways.
        correct: true
        feedback: |
          Yes. Historians, Muslim scholars and Christians offer different explanations for the differences, as the cards above showed.
      - text: Which book has the longest account.
        feedback: |
          Length decides nothing about sameness. Genesis tells much of Abraham's life; the Qur'an tells parts of it in many places.
    explanation: |
      Both sentences are about what "the same" means, not about which side is right.

  - type: mcq
    id: traps
    title: "Spot the slip"
    prompt: |
      Select every statement that is a mistake.
    multiple: true
    options:
      - text: The Qur'an is a copy of the Bible, so the figures must be the same.
        correct: true
        feedback: |
          A mistake as a summary. Some historians see a close conversation with Jewish and Christian traditions, but the Qur'an retells the stories differently, and Muslims hold it to be God's own word. "Copy" claims too much in both directions.
      - text: The three books agree on all that they say about Jesus.
        correct: true
        feedback: |
          A mistake. The Torah has no Jesus, and the Gospels and the Qur'an differ on his sonship and on the cross.
      - text: Muslims revere Jesus and Moses as prophets.
        feedback: |
          Accurate. Moses is the most named, and Jesus is a messenger and Messiah in the Qur'an.
      - text: Muslims of every school agree on how to read 4:157.
        correct: true
        feedback: |
          A mistake. Substitution is the most common reading, and other readings exist.
    explanation: |
      The slips either merge the books or erase the differences. The fair picture keeps both the overlap and the differences.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      First: **is a book revelation?** A believer holds the Torah, the Gospels or the Qur'an to be from God, in the way their tradition says, and may then explain the differences by alteration, fulfilment or restoration. A sceptic or a historian does not use that premise and explains differences by history. The comparison itself does not prove either (layer 3).

      Second: **what happened to the texts?** Muslim scholars, Christian scholars, Jewish scholars and secular historians give different accounts of how texts changed and how the Qur'an relates to the older books. Evidence such as manuscripts bears on this and is the one place where all can look at the same data.

      Third: **what does "the same figure" mean?** The same historical man, the same remembered figure, or the same person as revealed? Each answer is held by thoughtful people, and none is decided by quoting verses alone.

  - type: text
    id: summary
    body: |
      **Next:** the Qur'an was revealed in the seventh century, and Muslims have met modern science and politics for two hundred years. The lesson Islam, Science and the Modern World looks at how Muslims have answered, with many different voices.
