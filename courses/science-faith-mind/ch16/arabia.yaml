id: ch16-arabia
title: "Arabia Before Islam"
kind: concept
own: |
  The setting: the Arabian peninsula in the sixth and early seventh centuries CE, between two empires, the Byzantine (Christian, from Constantinople) and the Sasanian (Persian, mostly Zoroastrian). Everything is taught according to someone: inscriptions and foreign chronicles (what we can document), Muslim histories written later (the tradition's own account), and modern historians (who weigh both).
  - **Between two empires.** Arab client kingdoms served as buffers: the Ghassanids for Byzantium (Miaphysite Christians; al-Harith received the title patricius in 529) and the Lakhmids for Persia. The Byzantine-Sasanian war of {{ 602 to 628 }} is the background of the Qur'an's passage on the Romans (30:2-4).
  - **Mecca and trade.** The Quraysh tribe guarded the Kaaba, a sanctuary with a truce on fighting. According to Muslim sources Mecca grew rich on caravans (Qur'an 106 mentions a winter and a summer journey); Patricia Crone (1987) argued that {{ Meccan trade was modest and not part of the great spice routes }}, and the debate is live.
  - **Religion of the pagans.** Tribes honoured many deities (al-Lat, al-Uzza, Manat, Hubal). Our fullest account, Ibn al-Kalbi's Book of Idols (he lived 737 to 819), was written {{ two centuries after Muhammad }}, so scholars use it with caution. The Qur'an itself says some pagans held that Allah created the world and that their gods only bring them nearer to him (29:61; 39:3).
  - **Jews and Christians.** Jewish tribes lived in Medina, Khaybar and Tayma, and the Himyarite kingdom in Yemen turned to Judaism; Christians were strong in Najran, among the Ghassanids and in Aksum (Ethiopia). In {{ 523 }} the Jewish Himyarite king Dhu Nuwas massacred Christians in Najran, and Aksum (Christian) then conquered Himyar.
  - **Hanifs and "jahiliyya".** *Hanif* is the Qur'an's word for a pure monotheist, tied to Abraham; whether a hanif movement existed before Islam is debated. *Jahiliyya* ("ignorance") is used in the Qur'an for a way of life; later literature turned it into a name for the whole pre-Islamic era, a picture historians no longer adopt.
  - **Three layers.** Established: the inscriptions, the empires, the Najran events. Live debate: the size of Meccan trade, the reliability of the Book of Idols, who the Jews of Medina were, the hanifs. Commitment: that the Qur'an is God's word to this setting (Muslims affirm it; historians as historians neither affirm nor deny it).

cards:
  - type: mcq
    id: hook
    title: "Guess: a message in a crowded land"
    prompt: |
      Guessing is the point; no background is needed. Imagine a land of desert and oasis towns, with no single king. Camel caravans cross it. To the north-west lies one great Christian empire and to the north-east a rival Persian one. In the south a kingdom has changed its religion more than once. Which first guess about its religious life is most reasonable?
    options:
      - text: "A mixture: local tribal gods, plus Jews, Christians and others, carried in by trade, war and the two empires. A new preacher would speak to people who already knew some of these ideas."
        correct: true
        feedback: |
          A good first guess. Trade and empires move ideas as well as goods, and this lesson follows how.
      - text: "One simple, uniform religion, since there were no cities or books."
        feedback: |
          Remote does not mean uniform. The documents we have, inscriptions and foreign chronicles, show several religions side by side. Lack of a king did not mean lack of contact.
      - text: "No religion at all until a prophet arrived, since there is no record of it."
        feedback: |
          There is a record: inscriptions, foreign writers, and later Muslim histories. Each has limits, which is part of this lesson, but "no religion" is not what any of them say.
    explanation: |
      Keep three layers apart throughout: what inscriptions and foreign chronicles establish, what historians debate, and what each tradition holds by faith. The faith layer (that the Qur'an is revelation) belongs to the next lessons; here we only set the scene.

  - type: text
    id: land
    title: "Desert, oasis, tribe"
    body: |
      The Arabian peninsula is mostly desert. Life centred on oases, where people farmed dates and kept towns, and on the grazing lands of nomads, the *bedouin*, who herded camels and moved with the seasons. Without a state, people relied on the **tribe**, a group claiming a shared ancestor, which protected its members and avenged them. The region in the west, along the Red Sea coast, is called the **Hijaz**; Mecca and the oasis later called Medina (then Yathrib) both lie there.

      Tribes met at markets and sanctuaries, and for some periods agreed to a truce on fighting. According to Muslim histories, poetry was the great art of the time: orally composed, it praised the tribe and carried its memory. Remember this when we reach the Qur'an, which was first heard by a poetry-loving people.

  - type: text
    id: empires
    title: "Two empires and their Arab allies"
    body: |
      Arabia lay between two rival superpowers. The **Byzantine** (Eastern Roman) Empire was Christian. The **Sasanian** Empire of Persia was ruled by a dynasty that supported Zoroastrianism (the Persian religion of the good god Ahura Mazda and his struggle against evil). Neither tried to conquer the desert, but both kept Arab allies on the border as buffers and as raiders against each other.

      The **Ghassanids** served Byzantium. According to the sources, their king al-Harith ibn Jabalah received the high title *patricius* from the emperor Justinian in 529 CE, and the Ghassanids were Miaphysite Christians (they held that in Christ divine and human natures are one). The **Lakhmids**, centred at al-Hira, were allied with Persia. The Ghassanids and Lakhmids fought one another as well as for their patrons.

  - type: order
    id: timeline
    title: "Five dates in order"
    prompt: "Put these events in the order they happened."
    steps:
      - "The Namara inscription, an early text in a script close to Arabic, dated 328 CE"
      - "The Jewish king Dhu Nuwas of Himyar massacres Christians at Najran (523 CE)"
      - "The Byzantine emperor Justinian gives al-Harith the Ghassanid king the title patricius (529 CE)"
      - "The last great Byzantine-Sasanian war begins (602 CE)"
      - "That war ends (628 CE)"
    hint: "All five are CE years, so smaller numbers come first."
    explanation: |
      328, then 523, 529, 602 and 628. The first three belong to a world of client kings and rival empires that was already old when Muhammad was born (tradition says about 570 CE); the last two are the war that dominated his adult life.

  - type: numeric
    id: gap
    title: "How old is the written Arabic?"
    prompt: |
      The Namara inscription, an epitaph for the Lakhmid king Imru' al-Qays, is dated 328 CE. Dhu Nuwas massacred the Christians of Najran in 523 CE. How many years lie between them?
    answer: 195
    wrong:
      - value: 95
        feedback: |
          A slip in the hundreds: 523 minus 328 is 195, not 95. Both dates are CE, so we simply subtract.
      - value: 851
        feedback: |
          That adds the two years instead of finding the gap between them.
    hint: "Both are CE years: subtract the earlier from the later."
    explanation: |
      523 - 328 = 195 years. Written Arabic, in a script that was still moving away from Nabataean letters (scholars disagree whether the text is early Arabic or late Nabataean), was already almost two centuries old when Najran fell.

  - type: text
    id: mecca
    title: "Mecca, the Quraysh and the Kaaba"
    image:
      src: img/kaaba-1886.webp
      alt: "A nineteenth-century photograph of the cube-shaped Kaaba draped in cloth, surrounded by pilgrims."
      caption: "The Kaaba during the pilgrimage in a photograph of 1886; it shows the shrine of the nineteenth century, not of Muhammad's time, which the sources describe only in words."
      credit: "Post of Switzerland, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Kaaba_during_the_Hajj_-_1886.jpg"
    body: |
      Mecca was the home of the **Quraysh**, the tribe into which, according to Muslim tradition, Muhammad was born. They were the custodians of the **Kaaba**, a cube-shaped shrine. According to Muslim tradition Abraham and his son Ishmael raised its foundations (the Qur'an says so in 2:127), and before Islam it held about 360 idols, one for each day of the year, with a chief idol, Hubal.

      Muslim sources describe the Kaaba as a sanctuary where tribes came on pilgrimage under a truce, and Mecca as a "sacred" place where violence was forbidden. Historians accept that Mecca was a shrine town, but weigh the size of its role differently: Peter Webb, for example, argues it was mainly a local shrine rather than a pan-Arabian pilgrimage centre.

  - type: text
    id: trade
    title: "Was Mecca a trading empire?"
    body: |
      A common account says Mecca's prosperity rested on caravans carrying spices and luxuries between Yemen and Syria, and that this wealth and its tensions prepared the ground for a religious message. Muslim sources support the picture of merchants, and the Qur'an has a short chapter, 106, in which the Quraysh are reminded of their "winter and summer journey" (usually read as trade trips to Yemen and Syria), and told to worship the Lord of "this House".

      In 1987 the historian **Patricia Crone** published *Meccan Trade and the Rise of Islam*. She argued that the trade was much smaller than imagined, that Mecca was not on the great spice routes, and that the Muslim sources telling the story were written long after the events. Reviewers divided: some called her critique devastating; others, like R. B. Serjeant, said it leaned on the absence of evidence and that the traditions contain a core of fact.

  - type: mcq
    id: trade-layers
    title: "Fact or debate: Meccan trade"
    prompt: |
      Qur'an chapter 106 mentions a "winter and summer journey" of the Quraysh. Patricia Crone (1987) argued that Meccan trade was modest and not part of the great spice routes. Her critics replied that her case rests largely on absence of evidence. Which description is most accurate?
    options:
      - text: "That the Quraysh made seasonal journeys is in the text; how big and how important to Mecca the trade was is a live debate among historians, because the evidence is thin and later."
        correct: true
        feedback: |
          Yes. The sentence in the Qur'an is a documented text; the economic reading of it is an interpretation, which Crone challenged and others defended.
      - text: "Crone proved that Mecca had no trade, so chapter 106 must be a later addition."
        feedback: |
          She argued it was small and not a spice-route hub, not that it was absent, and she did not claim to prove chapter 106 late. Overstating a thesis is the slip here.
      - text: "The size of Meccan trade is established fact, since the Muslim histories describe it in detail."
        feedback: |
          Detail in a source written long after the events is not by itself established. Historians ask what an independent record, such as inscriptions or foreign writers, would show, and here that is exactly what is scarce.
    explanation: |
      This is the pattern of the lesson: a text or inscription gives a fixed point; what it implies about size, cause and importance is argued; and what the story means for faith is a third question.

  - type: text
    id: caravan
    title: "A caravan city of the north"
    image:
      src: img/hegra-tomb.webp
      alt: "A rock-cut tomb facade in a sandstone outcrop in the desert, with an inscription band above the door."
      caption: "A Nabataean rock-cut tomb at Hegra (Mada'in Salih) in north-west Arabia, built around the first century CE by a people who ran the incense caravan trade; the band above the door is an inscription in Nabataean script."
      credit: "Following Hadrian, CC BY-SA 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Qasr_al-Bint_necropolis,_Tomb_21,_Hegra_(Mada%27in_Salih),_the_kingdom%27s_second_Nabatean_capital_after_Petra,_Saudi_Arabia_-_53535196660.jpg"
    body: |
      Caravan trade in Arabia is documented much earlier and further north. The **Nabataeans**, an Arab people whose capital was Petra and whose second city was Hegra (Mada'in Salih, in the Hijaz), held, according to the sources, a monopoly on trade in incense, myrrh and spices until Rome annexed their kingdom in 106 CE. Their tombs and inscriptions survive.

      Why does this matter here? Because it shows how the north of the Hijaz was already linked to Syria and the wider world, with writing in use, centuries before Muhammad. Whatever the size of Mecca's own trade, the peninsula was not cut off.

  - type: text
    id: gods
    title: "Many gods, and a high god"
    body: |
      According to Muslim tradition, the Arabs before Islam honoured many deities, often at sanctuaries of particular tribes: **al-Lat**, **al-Uzza** and **Manat** (the Qur'an names the three together, 53:19-20) and **Hubal**, whom Ibn al-Kalbi calls the chief god of the Quraysh. Our fullest account is the *Book of Idols* of **Hisham ibn al-Kalbi** (737 to 819), a list of idols and shrines. Scholars debate how far to trust it: it was composed two centuries after Muhammad by a Muslim scholar, and other evidence for these cults is thin (for Hubal, outside Muslim sources, one Nabataean inscription).

      The Qur'an adds a further point. It says that when pagans are asked who created heaven and earth, "they will say Allah" (29:61, in essence), and that they worship their gods only so that these "bring us nearer to Allah" (39:3). Allah, *the* God, was thus already a known name.

  - type: mcq
    id: book-of-idols
    title: "Using the Book of Idols"
    prompt: |
      The Book of Idols, by the Muslim scholar Ibn al-Kalbi (737 to 819), lists idols and shrines of pre-Islamic Arabia. It was written about two centuries after Muhammad. How should a historian use it?
    options:
      - text: "As valuable but later testimony, checked against inscriptions, foreign writers and the Qur'an; some of its detail may be accurate, some shaped by the later Muslim view of the 'age of idols'."
        correct: true
        feedback: |
          Yes. Nobody can dismiss it, since it preserves much; nobody can treat it as a camera, since its author wrote from inside a later tradition.
      - text: "As a fully reliable record, since the author was a scholar close to the sources."
        feedback: |
          He was a scholar, but two centuries away from the events, with his own view of what the 'age of idols' meant. A late source can be good and still need checking.
      - text: "Not at all, since it was written by a Muslim and therefore must be biased."
        feedback: |
          Bias is a reason to check, not to discard. Dismissing a source by who wrote it, instead of testing its claims, is a mistake in both directions.
    explanation: |
      The same method will apply to every later source for the life of Muhammad and the Qur'an: weigh how close it stands to the events and what independent evidence confirms it.

  - type: mcq
    id: allah
    title: "Two readings of one verse"
    prompt: |
      According to the Qur'an (29:61 and 39:3), pagans of Muhammad's Arabia agreed that Allah created the world, and worshipped lesser gods only to bring them nearer to him. Two readings are offered. One says this shows pagan religion had a high god who was God in the same sense Muslims worship. The other says the verses present the Qur'an's own description of its opponents, which may be polemical. Which statement is most careful?
    options:
      - text: "The text is documented; whether it describes the pagans fairly is a question of interpretation, and both readings can be held, since inscriptions of the fifth and sixth centuries in north and west Arabia increasingly invoke only Allah."
        correct: true
        feedback: |
          Yes. The inscriptions give some outside support for a growing focus on one god, but they do not settle how the pagans of Mecca spoke.
      - text: "Since the Qur'an says it, it must be exactly how all Arabs thought, so there is no debate."
        feedback: |
          A source describing its opponents is not neutral evidence about them. Muslims may accept it as revealed truth; a historian still asks what the evidence outside the Qur'an adds.
      - text: "Since the Qur'an is polemical, the verses are worthless as history."
        feedback: |
          Polemic reports what opponents are said to have believed, and may still preserve their words. Throwing it out loses information; so does believing it without checking.
    explanation: |
      Notice the two frames: for a Muslim these verses are God's own description; for a historian they are an early text to be weighed against other evidence. Neither frame requires dropping the other for this lesson.

  - type: text
    id: hanif
    title: "Hanifs: pure monotheists before Islam?"
    body: |
      The Qur'an uses the word **hanif** about a person who turns away from false gods to the one God, and it strongly ties it to Abraham, who in 3:67 is neither a Jew nor a Christian but a *hanif*. Muslim tradition adds that a few Arabs before Muhammad, such as Zayd ibn Amr and Waraqah ibn Nawfal, followed this pure religion without joining Judaism or Christianity.

      Scholars divide. Britannica notes no evidence of a true hanif cult in pre-Islamic Arabia, though individuals may have rejected the old gods. Others, such as the revisionist historian Yehuda Nevo, see the hanifs as part of a wider monotheistic trend. The exact sense of the word is called "obscure" by Michael Cook.

  - type: text
    id: jews
    title: "Jews in Arabia"
    body: |
      Jewish communities lived in the oases of **Medina** (then Yathrib), **Khaybar** and **Tayma**. In Medina the sources name three large Jewish tribes: the **Banu Qaynuqa**, the **Banu Nadir** and the **Banu Qurayza**. We meet them again with Muhammad's life.

      Who were they? Later Muslim genealogies, by writers such as al-Sam'ani, say some descended from migrants from Judea. Others suggest they were Arabs who had converted. The extant sources do not decide it. What the sources agree on is that they bore Arabic names, spoke Arabic, and lived by the same tribal customs as their neighbours.

      In the south, the kingdom of **Himyar** (in what is now Yemen) turned to monotheism over several centuries; by the 520s its king, Dhu Nuwas, was Jewish.

  - type: text
    id: christians
    title: "Christians and the Najran massacre"
    body: |
      Christians were strongest in the northwest and northeast of Arabia (the Ghassanid and Lakhmid lands) and in **Najran**, an oasis town in the south. Najran's Christians were Miaphysite. In **523 CE**, according to a Greek martyrdom account and a letter by Simeon of Beth Arsham, the Himyarite king **Dhu Nuwas** killed the leader Arethas and many of his followers (the numbers vary in the sources: one gives 340 followers; later accounts give far larger figures). Sources give the motive differently: revenge for a burned synagogue, or fear that Najran served as a Byzantine base on the trade route.

      The Byzantine emperor Justin I asked the Christian king of **Aksum** (Ethiopia), Kaleb, to intervene. Aksum conquered Himyar, whose kingdom ended around 525 to 530 CE (sources differ). So by Muhammad's lifetime a region of Arabia had gone from Jewish to Christian rule by war, and each side kept memories of martyrs.

  - type: text
    id: abraha
    title: "Abraha and the elephant"
    body: |
      After Aksum conquered Himyar, a governor named **Abraha** ruled Yemen. His own inscriptions at **Murayghan** record campaigns in central Arabia against Arab tribes, in the middle of the sixth century. Muslim tradition holds that in the "Year of the Elephant", about 570 CE, the year of Muhammad's birth, Abraha marched on Mecca with an elephant and God destroyed his army; Qur'an chapter 105 refers to "the companions of the elephant".

      What can we say? The inscriptions confirm Abraha and his campaigns, and a recently studied fragment may mention elephants. None describes an attack on Mecca. Some historians see the Mecca story as a later tradition that explained the short chapter 105; the Muslim account holds that the Qur'an itself states the event.

  - type: mcq
    id: abraha-layers
    title: "What do the inscriptions show?"
    prompt: |
      The Murayghan inscriptions of Abraha record his campaigns in central Arabia in the mid-sixth century. The Qur'an (105) refers to the "companions of the elephant", and Muslim tradition dates an attack on Mecca to about 570 CE. Which statement is most careful?
    options:
      - text: "Abraha and his campaigns are documented; an attack on Mecca is not recorded in them, so historians divide on how the Qur'an's chapter and the tradition fit the events. Muslims read the chapter as stating the event."
        correct: true
        feedback: |
          Yes: a documented person, an undocumented episode, and a text that is read in two frames. Neither the historian nor the believer has to deny the other's starting point to say this.
      - text: "The inscriptions prove that the Mecca expedition happened exactly as told."
        feedback: |
          They do not mention Mecca at all, only other campaigns. Proof needs the specific event.
      - text: "The inscriptions prove that the story is false, since Mecca is not named."
        feedback: |
          Silence in an inscription about one campaign is weak evidence against another. It leaves the story unconfirmed, not disproved.
    explanation: |
      The pattern again: what is documented, what is not, and what a tradition holds. "Not confirmed" and "refuted" are different statements.

  - type: text
    id: romans
    title: "The Qur'an hears the news from the north"
    body: |
      Between 602 and 628 the Byzantine and Sasanian empires fought the longest and most destructive of their wars. The Persians took Jerusalem in 614 CE. Qur'an 30:2-4 begins by saying that the Romans have been defeated "in the nearest land" and will be victorious "within a few years" (the Arabic is commonly read as three to nine). Muslim commentators link it to the Persian victories and the later Byzantine recovery under Heraclius; peace followed in 628.

      Some modern scholars read the passage within the political and apocalyptic expectations of the seventh century, and a few question the standard translation. For us the point is simpler: whether it is revelation or a response to the news, the Qur'an was spoken in a world that followed the fortunes of these two empires closely.

  - type: mcq
    id: jahiliyya
    title: "The 'age of ignorance'"
    prompt: |
      Muslim tradition calls the time before Islam *al-jahiliyya*, often translated "ignorance". The Qur'an uses the word four times, and later literature made it the name of a whole era. Historians do not adopt that picture of a uniformly barbaric age. Which statement is most careful?
    options:
      - text: "In the Qur'an the word describes a way of life or moral state (of those who rejected the message); later writers turned it into a name for the period, and historians find the pre-Islamic world more varied: poetry, trade, writing, and Jews, Christians and others."
        correct: true
        feedback: |
          Yes. The label is a judgement made within the faith, and the pictures of this lesson are what the historian sets beside it.
      - text: "The word simply and neutrally means 'the pre-Islamic period', so the matter is closed."
        feedback: |
          In the Qur'an it describes a way of life, not a calendar period, and the later era-label carries the judgement that the time was benighted.
      - text: "Historians deny that anything bad happened in pre-Islamic Arabia."
        feedback: |
          No one says that. The question is whether one broad label fits a varied, connected world.
    explanation: |
      Understanding the setting in its own terms helps in both directions: it does not erase what the Qur'an criticises, and it does not force the whole age into one word.

  - type: mcq
    id: layers
    title: "Which layer?"
    prompt: |
      Match the claim to its layer. "The Quraysh were the custodians of the Kaaba and Mecca was a shrine town." "Muhammad's message answered a social crisis caused by wealth from trade." "The Qur'an is God's word, sent to an Arabia that knew Jews, Christians and pagans." Which assignment is best?
    options:
      - text: "First: accepted by historians and Muslim tradition (with debate on how large the role was). Second: a historical thesis, now disputed (Crone). Third: a faith commitment, which a historian as historian neither affirms nor denies."
        correct: true
        feedback: |
          Yes. Each layer has its own evidence and its own kind of question.
      - text: "All three are established fact."
        feedback: |
          Only the first has independent support, and even it is debated in size. The second is a thesis historians dispute; the third is not the kind of claim history can settle.
      - text: "All three are mere opinion, since nobody was there."
        feedback: |
          Opinions differ in how much evidence supports them. Inscriptions and foreign chronicles support some claims much better than others.
    explanation: |
      The next lesson meets the hardest version of the same question: what the sources can and cannot tell us about Muhammad's life.

  - type: text
    id: summary
    body: |
      **Next:** Muhammad and the Sources for His Life, where the same method meets the earliest biographies and how historians weigh them beside the tradition's own account.
