id: ch16-map
title: "Content Map: Islam and the Qur'an"
kind: map
name: Level 16, Islam and the Qur'an (Arabia before Islam, the life of Muhammad, the making of the Qur'an, the claim of inimitability, hadith and their chains, law and the Sunni-Shia split, kalam and philosophy, Sufism, the shared figures, science and the modern world, the three layers)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 16 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (two terms swapped, a scholar's view reversed, a date or a number moved, a layer mislabelled), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: arabia
    title: Arabia before Islam
    row: 1
    col: 1
    body: |
      Between the Byzantine and the Sasanian empires, Arab client kingdoms served as buffers: the **Ghassanids** for Byzantium and the **Lakhmids** for Persia; the two empires fought from 602 to 628. According to Muslim sources Mecca grew rich on caravans; Crone (1987) argued that Meccan trade was **modest**. Ibn al-Kalbi's *Book of Idols* was written about **two centuries** after Muhammad, so it is used with caution. In 523 the Jewish Himyarite king Dhu Nuwas massacred Christians in Najran.
    decoys:
      - body: |
          Between the Byzantine and the Sasanian empires, Arab client kingdoms served as buffers: the **Lakhmids** for Byzantium and the **Ghassanids** for Persia; the two empires fought from 602 to 628. According to Muslim sources Mecca grew rich on caravans; Crone (1987) argued that Meccan trade was **modest**. Ibn al-Kalbi's *Book of Idols* was written about **two centuries** after Muhammad, so it is used with caution. In 523 the Jewish Himyarite king Dhu Nuwas massacred Christians in Najran.
        feedback: |
          The kingdoms are swapped. The Ghassanids (Miaphysite Christians) served Byzantium; the Lakhmids served Persia.
      - body: |
          Between the Byzantine and the Sasanian empires, Arab client kingdoms served as buffers: the **Ghassanids** for Byzantium and the **Lakhmids** for Persia; the two empires fought from 602 to 628. According to Muslim sources Mecca grew rich on caravans; Crone (1987) argued that Meccan trade was **large and on the great spice routes**. Ibn al-Kalbi's *Book of Idols* was written **in Muhammad's lifetime**, so it is taken at face value. In 523 the Jewish Himyarite king Dhu Nuwas massacred Christians in Najran.
        feedback: |
          Two slips. Crone argued the opposite: trade was modest and not part of the great spice routes. And Ibn al-Kalbi (737 to 819) wrote two centuries after Muhammad, so scholars use his account with caution.
    explanation: |
      The ground floor of the level: a peninsula between two empires, with Jews, Christians and pagans, known through inscriptions, foreign chronicles and much later Muslim histories.

  - id: muhammad
    title: The life of Muhammad
    row: 1
    col: 2
    body: |
      According to the tradition Muhammad was born in Mecca about 570, received his first revelation at Hira about 610, made the *Hijra* to Medina in **622** and died in 632. Ibn Ishaq's biography (he died c. 767) is lost and read through **Ibn Hisham** (died 833), about **135 years** after 632. Coins and the Dome of the Rock (72 AH, 691 to 692) **name Muhammad** as God's messenger. Wansbrough (1977) saw late salvation history; Donner and Motzki argued early material can be recovered by studying chains and texts together.
    decoys:
      - body: |
          According to the tradition Muhammad was born in Mecca about 570, received his first revelation at Hira about 610, made the *Hijra* to Medina in **622** and died in 632. Ibn Ishaq's biography (he died c. 767) **survives complete**, and Ibn Hisham (died 833) wrote a rival one, about **35 years** after 632. Coins and the Dome of the Rock (72 AH, 691 to 692) **name Muhammad** as God's messenger. Wansbrough (1977) saw late salvation history; Donner and Motzki argued early material can be recovered by studying chains and texts together.
        feedback: |
          Ibn Ishaq's original is lost; we read it through Ibn Hisham's abridged and edited version. And 767 is about 135 years after 632, not 35.
      - body: |
          According to the tradition Muhammad was born in Mecca about 570, received his first revelation at Hira about 610, made the *Hijra* to Medina in **622** and died in 632. Ibn Ishaq's biography (he died c. 767) is lost and read through **Ibn Hisham** (died 833), about **135 years** after 632. Coins and the Dome of the Rock (72 AH, 691 to 692) **name Muhammad** as God's messenger. Wansbrough (1977) argued early material can be recovered; Donner and Motzki saw late salvation history.
        feedback: |
          The scholars are swapped. Wansbrough read the narratives as late salvation history with a small historical core; Donner and Motzki argued that early material can be recovered and dated.
    explanation: |
      Little is documented from outside and early; the detailed life is the tradition's, written later. The live debate is how much of it can be confirmed.

  - id: quran
    title: The making of the Qur'an
    row: 1
    col: 3
    body: |
      According to tradition the Qur'an ("recitation") was revealed over **23 years** (610 to 632) and has **114** surahs. Abu Bakr had Zayd ibn Thabit gather the material; under Uthman (644 to 656) copies went to the main cities. A radiocarbon date, such as 568 to 645 for the Birmingham leaves, gives the age of the **parchment**, not of the writing. Ibn Mujahid (died 936) listed **seven** canonical readings, which differ in vowels or dots, not in whole books. Sinai (2014) takes the early date as the default; Wansbrough (1977) argued the text closed about the end of the eighth century.
    decoys:
      - body: |
          According to tradition the Qur'an ("recitation") was revealed over **23 years** (610 to 632) and has **114** surahs. Abu Bakr had Zayd ibn Thabit gather the material; under Uthman (644 to 656) copies went to the main cities. A radiocarbon date, such as 568 to 645 for the Birmingham leaves, gives the **day the text was written**. Ibn Mujahid (died 936) listed **seven** canonical readings, which are **seven different books**. Sinai (2014) takes the early date as the default; Wansbrough (1977) argued the text closed about the end of the eighth century.
        feedback: |
          Radiocarbon dates the animal that gave the parchment, so it only sets a limit. And the seven readings share one consonantal skeleton and differ in vowels or dots.
      - body: |
          According to tradition the Qur'an ("recitation") was revealed over **23 years** (610 to 632) and has **114** surahs. Abu Bakr had Zayd ibn Thabit gather the material; under Uthman (644 to 656) copies went to the main cities. A radiocarbon date, such as 568 to 645 for the Birmingham leaves, gives the age of the **parchment**, not of the writing. Ibn Mujahid (died 936) listed **seven** canonical readings, which differ in vowels or dots, not in whole books. Wansbrough (2014) takes the early date as the default; Sinai (1977) argued the text closed about the end of the eighth century.
        feedback: |
          The scholars are swapped. Wansbrough (1977) argued for a late closing; Sinai (2014) concludes the traditional early date should be the default.
    explanation: |
      How words first heard aloud became a written text: a tradition of careful collection, early manuscripts that fit it, and a debate over exactly when the text was fixed.

  - id: form
    title: The claim of inimitability
    row: 2
    col: 2
    body: |
      *I'jaz* means "inimitability". The surahs are ordered roughly from **longest to shortest**, not by date. The challenge comes in steps: the **whole Qur'an, ten surahs, one surah**. The classical argument: (P1) the challenge was made to skilled Arabic speakers; (P2) they did not meet it; (P3) the best explanation is a quality beyond human ability. Al-Jurjani located it in ***nazm***, the arrangement of words. Critics press on P3 and on circularity. Al-Nazzam held *sarfa*: the text could be matched, but God **turned people away**.
    decoys:
      - body: |
          *I'jaz* means "inimitability". The surahs are ordered roughly **by date of revelation**. The challenge comes in steps: **one surah, ten surahs, the whole Qur'an**. The classical argument: (P1) the challenge was made to skilled Arabic speakers; (P2) they did not meet it; (P3) the best explanation is a quality beyond human ability. Al-Jurjani located it in ***nazm***, the arrangement of words. Critics press on P3 and on circularity. Al-Nazzam held *sarfa*: the text could be matched, but God **turned people away**.
        feedback: |
          The order is roughly longest to shortest (286 verses down to 3), not chronological, and the challenge is cited from the whole Qur'an (17:88) down to ten surahs (11:13) and one surah (10:38, 2:23).
      - body: |
          *I'jaz* means "inimitability". The surahs are ordered roughly from **longest to shortest**, not by date. The challenge comes in steps: the **whole Qur'an, ten surahs, one surah**. The classical argument: (P1) the challenge was made to skilled Arabic speakers; (P2) they did not meet it; (P3) the best explanation is a quality beyond human ability. Al-Jurjani located it in ***saj'***, rhymed prose. Critics press on P3 and on circularity. Al-Nazzam held *sarfa*: the text is **unmatchable by its own nature**.
        feedback: |
          Two slips. Al-Jurjani's quality is nazm, the arrangement of words in sentences. And sarfa is the rival view: the text could be matched, but God turned people away from trying.
    explanation: |
      An argument with a valid form whose premises are disputed, and a reminder that Muslims themselves disagreed about where the miracle lies.

  - id: hadith
    title: Hadith and their chains
    row: 2
    col: 1
    body: |
      A *hadith* has an **isnad** (the chain of narrators) and a **matn** (the text). Bukhari (died 870) and Muslim (died 875) rank highest among the six books of Sunni Islam. A hadith is **sahih** when the chain is connected, the narrators are trustworthy and accurate, and there is no hidden defect; **hasan** when one narrator falls a little short of full accuracy; **da'if** when the chain is broken or a narrator is criticised. According to Schacht (1950), many hadith reflect later debates projected back; Motzki argued that the collection of Abd al-Razzaq preserves first-century material.
    decoys:
      - body: |
          A *hadith* has an **isnad** (the chain of narrators) and a **matn** (the text). Bukhari (died 870) and Muslim (died 875) rank highest among the six books of Sunni Islam. A hadith is **hasan** when the chain is connected, the narrators are trustworthy and accurate, and there is no hidden defect; **sahih** when one narrator falls a little short of full accuracy; **da'if** when the chain is broken or a narrator is criticised. According to Schacht (1950), many hadith reflect later debates projected back; Motzki argued that the collection of Abd al-Razzaq preserves first-century material.
        feedback: |
          The grades are swapped. Sahih ("sound") meets all the conditions; hasan ("fair") has one narrator slightly short of full accuracy.
      - body: |
          A *hadith* has a **matn** (the chain of narrators) and an **isnad** (the text). Bukhari (died 870) and Muslim (died 875) rank highest among the six books of Sunni Islam. A hadith is **sahih** when the chain is connected, the narrators are trustworthy and accurate, and there is no hidden defect; **hasan** when one narrator falls a little short of full accuracy; **da'if** when the chain is broken or a narrator is criticised. According to Motzki, many hadith reflect later debates projected back; Schacht (1950) argued that the collection of Abd al-Razzaq preserves first-century material.
        feedback: |
          Two slips. The isnad is the chain and the matn the text. And the scholars are swapped: Schacht was the sceptic, Motzki the one who dated material earlier.
    explanation: |
      How reports of the Prophet were graded and how far back they can be traced: a classical method, a sceptical critique, and a reply that compares chains and texts together.

  - id: shared
    title: Shared figures
    row: 2
    col: 3
    body: |
      According to the Qur'an the sacrifice story **does not name the son**, and Abraham and Ishmael raised the House (2:127). The Qur'an names **Moses** most often (136 times by one common count). Of the crucifixion it says "they did not kill him, nor did they crucify him" (4:157), and Muslims read this verse in **several ways**. Muslim scholars distinguish *tahrif al-nass*, a change of the text, from *tahrif al-ma'na*, a wrong reading of the meaning. Most historians agree that Jesus was baptised by John and crucified under Pilate.
    decoys:
      - body: |
          According to the Qur'an the sacrifice story **names the son as Isaac**, and Abraham and Ishmael raised the House (2:127). The Qur'an names **Jesus** most often (136 times by one common count). Of the crucifixion it says "they did not kill him, nor did they crucify him" (4:157), and Muslims read this verse in **several ways**. Muslim scholars distinguish *tahrif al-nass*, a change of the text, from *tahrif al-ma'na*, a wrong reading of the meaning. Most historians agree that Jesus was baptised by John and crucified under Pilate.
        feedback: |
          The Qur'an's account leaves the son unnamed (Tabari and Ibn Qutayba took him as Isaac, most Muslims as Ishmael), and the prophet it names most often is Moses.
      - body: |
          According to the Qur'an the sacrifice story **does not name the son**, and Abraham and Ishmael raised the House (2:127). The Qur'an names **Moses** most often (136 times by one common count). Of the crucifixion it says "they did not kill him, nor did they crucify him" (4:157), and Muslims read this verse in **one way only**. Muslim scholars distinguish *tahrif al-ma'na*, a change of the text, from *tahrif al-nass*, a wrong reading of the meaning. Most historians agree that Jesus was baptised by John and crucified under Pilate.
        feedback: |
          Two slips. Muslims have read 4:157 in several ways. And the terms are swapped: tahrif al-nass is a change of the text, tahrif al-ma'na a wrong reading of the meaning.
    explanation: |
      Three books, three figures: each tradition reads the others' accounts through its own, and the comparison shows what each says without deciding whose is revelation.

  - id: law
    title: Law and the two paths
    row: 3
    col: 1
    body: |
      *Sharia* is God's way for human life as a whole; *fiqh* is the human, scholarly work of working out its rulings, so it can differ. Classical Sunni jurists use four sources: the Qur'an, the sunnah, consensus (*ijma*) and analogy (*qiyas*); Twelver Shia jurists use **reason** (*aql*) in place of analogy. The four Sunni schools are Hanafi (Abu Hanifa), Maliki (Malik), Shafi'i and Hanbali (Ahmad ibn Hanbal); the Twelver school is **Ja'fari**. On "whoever I am his *mawla*, Ali is his *mawla*", Sunnis read **friend** and Shia read **leader**.
    decoys:
      - body: |
          *Fiqh* is God's way for human life as a whole; *sharia* is the human, scholarly work of working out its rulings, so it can differ. Classical Sunni jurists use four sources: the Qur'an, the sunnah, consensus (*ijma*) and analogy (*qiyas*); Twelver Shia jurists use **reason** (*aql*) in place of analogy. The four Sunni schools are Hanafi (Abu Hanifa), Maliki (Malik), Shafi'i and Hanbali (Ahmad ibn Hanbal); the Twelver school is **Ja'fari**. On "whoever I am his *mawla*, Ali is his *mawla*", Sunnis read **friend** and Shia read **leader**.
        feedback: |
          The two terms are swapped. Sharia is God's way; fiqh is the human scholarly effort to work out rulings from it.
      - body: |
          *Sharia* is God's way for human life as a whole; *fiqh* is the human, scholarly work of working out its rulings, so it can differ. Classical Sunni jurists use four sources: the Qur'an, the sunnah, consensus (*ijma*) and **reason** (*aql*); Twelver Shia jurists use analogy (*qiyas*). The four Sunni schools are Hanafi (Abu Hanifa), Maliki (Malik), Shafi'i and Hanbali (Ahmad ibn Hanbal); the Twelver school is **Ja'fari**. On "whoever I am his *mawla*, Ali is his *mawla*", Sunnis read **leader** and Shia read **friend**.
        feedback: |
          Two slips. Sunni jurists use analogy (qiyas) and Twelver Shia use reason (aql). And Sunnis read mawla as friend or supporter, Shia as leader and authority.
    explanation: |
      How a community with one revelation built several legal methods, and how the question of who leads after 632 split it into two paths.

  - id: kalam
    title: Kalam and philosophy
    row: 3
    col: 2
    body: |
      *Kalam* is Islamic theology by argument. The Mu'tazila held that the Qur'an is **created**; Ash'ari (874 to 936) and Ahmad ibn Hanbal held that God's speech is **eternal**. Avicenna (c. 980 to 1037) argued from contingent beings to a necessary existent. In *The Incoherence of the Philosophers* (c. 1095) al-Ghazali denied that the link between cause and effect is **necessary**, not that fire burns cotton regularly. Averroes (1126 to 1198) replied that denying real causes undermines knowledge, and held that demonstrated truth and revelation do not contradict.
    decoys:
      - body: |
          *Kalam* is Islamic theology by argument. The Mu'tazila held that the Qur'an is **eternal**; Ash'ari (874 to 936) and Ahmad ibn Hanbal held that God's speech is **created**. Avicenna (c. 980 to 1037) argued from contingent beings to a necessary existent. In *The Incoherence of the Philosophers* (c. 1095) al-Ghazali denied that the link between cause and effect is **necessary**, not that fire burns cotton regularly. Averroes (1126 to 1198) replied that denying real causes undermines knowledge, and held that demonstrated truth and revelation do not contradict.
        feedback: |
          Reversed. The Mu'tazila held the Qur'an is created, to protect God's unity; Ash'ari and Ibn Hanbal held God's speech is eternal and not created.
      - body: |
          *Kalam* is Islamic theology by argument. The Mu'tazila held that the Qur'an is **created**; Ash'ari (874 to 936) and Ahmad ibn Hanbal held that God's speech is **eternal**. Avicenna (c. 980 to 1037) argued from contingent beings to a necessary existent. In *The Incoherence of the Philosophers* (c. 1095) al-Ghazali denied that fire **ever burns** cotton. Averroes (1126 to 1198) replied that denying real causes undermines knowledge, and held that **two truths**, one of philosophy and one of revelation, may contradict.
        feedback: |
          Two slips. Ghazali denied that the link is logically necessary (God is the real cause), not that the regularity occurs. And Averroes held that demonstrated truth and revelation do not truly conflict; the "double truth" reading is not his.
    explanation: |
      Reason and revelation argued over the Qur'an's status, God's causal role and how far scripture may be read non-literally, with Ghazali and Averroes as the two poles.

  - id: sufism
    title: Sufism
    row: 3
    col: 3
    body: |
      *Sufism* (*tasawwuf*) is the inner, mystical path within Islam; Sufis belong to orders (*tariqa*) led by a *shaykh*. **Fana** is the passing away of the self's awareness of anything but God, and **baqa** is abiding in God afterwards. Later manuals pair al-Bistami (d. c. 874) with **sukr** (intoxication) and al-Junayd (d. 910) with **sahw** (sobriety). Rumi (1207 to 1273) is linked with the **Mevlevi** order and the *sema*; Ibn Arabi (1165 to 1240) with ***wahdat al-wujud***, which Ibn Taymiyya (1263 to 1328) criticised.
    decoys:
      - body: |
          *Sufism* (*tasawwuf*) is the inner, mystical path within Islam; Sufis belong to orders (*tariqa*) led by a *shaykh*. **Fana** is the passing away of the self's awareness of anything but God, and **baqa** is abiding in God afterwards. Later manuals pair al-Bistami (d. c. 874) with **sahw** (sobriety) and al-Junayd (d. 910) with **sukr** (intoxication). Rumi (1207 to 1273) is linked with the **Mevlevi** order and the *sema*; Ibn Arabi (1165 to 1240) with ***wahdat al-wujud***, which Ibn Taymiyya (1263 to 1328) criticised.
        feedback: |
          The pairing is swapped. Bistami is the master of sukr, intoxication in God; Junayd is the master of sahw, returning to ordinary awareness and keeping the law.
      - body: |
          *Sufism* (*tasawwuf*) is the inner, mystical path within Islam; Sufis belong to orders (*tariqa*) led by a *shaykh*. **Baqa** is the passing away of the self's awareness of anything but God, and **fana** is abiding in God afterwards. Later manuals pair al-Bistami (d. c. 874) with **sukr** (intoxication) and al-Junayd (d. 910) with **sahw** (sobriety). Ibn Arabi (1165 to 1240) is linked with the **Mevlevi** order and the *sema*; Rumi (1207 to 1273) with ***wahdat al-wujud***, which Ibn Taymiyya (1263 to 1328) criticised.
        feedback: |
          Two slips. Fana is the passing away and baqa the abiding that follows. And Rumi's followers founded the Mevlevi order, while wahdat al-wujud is linked with Ibn Arabi.
    explanation: |
      The inner path: an experience of the self emptied in God, a debate over whether it stays within the law, and two great figures read in different ways by friends and critics.

  - id: modern
    title: Science and the modern world
    row: 4
    col: 2
    body: |
      The "House of Wisdom" as a formal academy is **disputed** (Gutas). Al-Khwarizmi (c. 820) solves $x^2+10x=39$ by adding $25$ to both sides:
      $$(x+5)^2 = 64,\qquad x = 3.$$
      Ibn al-Haytham (c. 965 to c. 1040) argued that vision comes from light **entering** the eye. Saliba points to later work at the Maragha observatory (from 1259) against the story that Ghazali ended Islamic science. In the 2013 Pew report, at least half of Muslims accepted evolution in **13 of 22** countries (Kazakhstan 79%, Pakistan 30%), so there is **no single answer**.
    decoys:
      - body: |
          The "House of Wisdom" as a formal academy is **disputed** (Gutas). Al-Khwarizmi (c. 820) solves $x^2+10x=39$ by adding $25$ to both sides:
          $$(x+5)^2 = 49,\qquad x = 2.$$
          Ibn al-Haytham (c. 965 to c. 1040) argued that vision comes from light **entering** the eye. Saliba points to later work at the Maragha observatory (from 1259) against the story that Ghazali ended Islamic science. In the 2013 Pew report, at least half of Muslims accepted evolution in **13 of 22** countries (Kazakhstan 79%, Pakistan 30%), so there is **no single answer**.
        feedback: |
          Adding 25 to both sides gives 39 + 25 = 64, so $(x+5)^2 = 64$, $x+5 = 8$ and $x = 3$. Adding 10 instead of 25 does not complete the square.
      - body: |
          The "House of Wisdom" as a formal academy is **disputed** (Gutas). Al-Khwarizmi (c. 820) solves $x^2+10x=39$ by adding $25$ to both sides:
          $$(x+5)^2 = 64,\qquad x = 3.$$
          Ibn al-Haytham (c. 965 to c. 1040) argued that vision comes from rays **leaving** the eye. Saliba points to later work at the Maragha observatory (from 1259) against the story that Ghazali ended Islamic science. In the 2013 Pew report, at least half of Muslims accepted evolution in **13 of 22** countries (Pakistan 79%, Kazakhstan 30%), so there is **one Muslim answer**.
        feedback: |
          Three slips. Ibn al-Haytham argued that light enters the eye, against the older rays-from-the-eye view. In the survey Kazakhstan was at 79% and Pakistan at 30%. And the answers vary by country, so no single Muslim answer exists.
    explanation: |
      A history of science with debated origins and a present of several strategies and several answers, which shows why "the Muslim view of science" is not one view.

  - id: layers
    title: The three layers
    row: 4
    col: 3
    body: |
      On a claim about Islam and the Qur'an, the **inscriptions, manuscripts, dates and what each text says** are established fact; the **size of Meccan trade, how early the biographies and hadith are, and when the text was fixed** are a live debate; that the Qur'an is **God's word and Muhammad a prophet** is a faith commitment. Historians as historians neither affirm nor deny it, and a radiocarbon date does not settle it.
    decoys:
      - body: |
          On a claim about Islam and the Qur'an, the **inscriptions, manuscripts, dates and what each text says** are a faith commitment; the **size of Meccan trade, how early the biographies and hadith are, and when the text was fixed** are a live debate; that the Qur'an is **God's word and Muhammad a prophet** is established fact. Historians as historians neither affirm nor deny it, and a radiocarbon date does not settle it.
        feedback: |
          The layers are mixed up. Manuscripts and dates are established; revelation and prophethood are commitments that no historian's result can prove or refute.
      - body: |
          On a claim about Islam and the Qur'an, the **inscriptions, manuscripts, dates and what each text says** are established fact; the **size of Meccan trade, how early the biographies and hadith are, and when the text was fixed** are a live debate; that the Qur'an is **God's word and Muhammad a prophet** is a faith commitment. Historians have **refuted it**, and a radiocarbon date settles it.
        feedback: |
          Whether the Qur'an is revelation goes beyond what history can decide in either direction, and a radiocarbon date sets a limit on the age of the parchment, nothing more.
    explanation: |
      The habit the whole level teaches: before arguing a claim, say which layer it belongs to.

