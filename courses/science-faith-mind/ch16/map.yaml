outroTitle: Level 16 in one picture
outro: |
  Islam arose in a peninsula between two empires, and its first centuries are known through inscriptions, coins and manuscripts beside much later Muslim histories. Muhammad's life is told by a tradition written down generations afterwards; the Qur'an was gathered and copied early, and the claim of inimitability is an argument whose premises critics dispute. Hadith and their chains fed the schools of law, the question of leadership split the community into two paths, and kalam, philosophy and Sufism argued over reason, causes and the inner life. The Qur'an shares figures with the Torah and the Gospels, and Muslims have met modern science in many different ways. What stays open is the third layer: what the evidence shows is argued, and whether the Qur'an is God's word is a commitment.
