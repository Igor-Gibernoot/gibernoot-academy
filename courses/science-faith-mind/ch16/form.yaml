id: ch16-form
title: "The Qur'an as Literature and the Claim of Inimitability"
kind: concept
own: |
  The question: Muslims hold that the Qur'an is so unlike human speech that no one can match it, a claim called *i'jaz* ("inimitability"). Is that claim an argument, what does it assume, and what would test it? Everything is taught according to someone: the Muslim tradition and its classical writers, and critics, Muslim and non-Muslim.
  - **Form.** The Qur'an has 114 chapters (*surahs*) of verses (*ayahs*), ordered roughly from {{ longest to shortest }}, not by date of revelation; the longest (al-Baqara) has 286 verses and the shortest (al-Kawthar) 3. Its style is often called *saj'* (rhymed, rhythmic prose), and it is meant to be heard and recited under the rules of *tajwid*.
  - **The challenge.** According to Muslims, the Qur'an itself challenges doubters to produce its like, in steps of {{ the whole Qur'an, ten surahs, one surah }} (cited at 17:88, 11:13, 10:38 and 2:23).
  - **The classical argument.** According to defenders such as al-Jahiz, al-Baqillani and al-Jurjani, the argument runs: (P1) the challenge was made to skilled Arabic speakers; (P2) they did not meet it; (P3) the best explanation is that the Qur'an has a quality beyond human ability; (C) so it is not of human origin. Al-Jurjani located the quality in *nazm*, {{ the arrangement of words in sentences }}.
  - **Where critics press.** The argument is valid in form, so critics attack the premises: that "no one matched it" has been tested (P2), that {{ taste is a measurable test of origin }} (P3), and the circularity worry that the standard is set by the text itself.
  - **A rival Muslim view.** The theologian al-Nazzam (died in the 840s) held *sarfa*: the text could be matched, but God {{ turned people away }} from trying. Few accepted it; it shows that Muslims themselves disputed where the miracle lies.
  - **Three layers.** Established: the form, the counts, the verses and who wrote what. Live debate: how to test literary uniqueness at all. Commitment: that the Qur'an is God's word, which Muslims affirm and which stylistic study alone can neither confirm nor refute.

cards:
  - type: mcq
    id: hook
    title: "Guess: what would prove a text cannot be imitated?"
    prompt: |
      Guessing is the point; no background is needed. Someone claims that a certain text is so special that no human could ever write anything like it. What would it most reasonably take to support that claim?
    options:
      - text: "Many skilled writers trying seriously to match it and failing, and then a reason why their failure points to something beyond skill, not just to taste or time."
        correct: true
        feedback: |
          A good guess. It names the two parts of any such claim: an observation (they tried and failed) and an explanation (why). The lesson looks at how defenders of the Qur'an's inimitability argue both parts, and where critics push.
      - text: "The author's own statement that it cannot be imitated."
        feedback: |
          A claim in the text itself is where the question starts, not where it ends. Anyone could say it of any text, so by itself it cannot settle the matter.
      - text: "A large number of admirers who find it beautiful."
        feedback: |
          Admiration is real evidence of impact. But many people admire many works; beauty alone does not show that matching is impossible.
    explanation: |
      Keep three layers apart: facts about the text (form, counts, who said what), live debate (how to test literary uniqueness), and faith (that the Qur'an is God's word). This lesson works on the first two and states the third as what Muslims hold.

  - type: text
    id: form
    title: "The form of the Qur'an"
    body: |
      Recall from the lesson The Qur'an: Revelation and Compilation: the Qur'an has 114 chapters, each a **surah**, made of verses, each an **ayah**. According to the Muslim tradition its Arabic wording is part of what is revealed, which is why it is read aloud in Arabic even by Muslims who speak other languages.

      Much of it is written in **saj'**, usually translated "rhymed prose": lines of uneven length that end in a repeated sound, with a strong beat, but not the fixed meters of classical Arabic poetry. Scholars discuss whether "saj'" fits the whole text. It is also a text to be *heard*. The art of reciting it correctly is **tajwid** (roughly "making good"): rules for pronouncing each letter, for lengthening vowels and for pausing. The word Qur'an itself means "recitation".

  - type: mcq
    id: order
    title: "What the order of the surahs shows"
    prompt: |
      The 114 surahs are arranged roughly from the longest (the second, al-Baqara, with 286 verses) to the shortest (the 108th, al-Kawthar, with 3). What can be concluded from that arrangement?
    options:
      - text: "Reading from the first page to the last is not reading in the order of revelation: the order follows length, with exceptions, so which surah was revealed when is a separate question."
        correct: true
        feedback: |
          Yes. The tradition holds that the verses were revealed in parts over about 23 years, and it has its own lists of earlier (Meccan) and later (Medinan) surahs; scholars also propose orders. The printed order is not that sequence.
      - text: "The shortest surahs are the oldest and the longest the newest."
        feedback: |
          A tempting rule, and some scholars have used verse length as a clue, but it is a hypothesis, not a fact. Many long surahs are held to contain early material, and the printed order is not a time order.
      - text: "The text is arranged as an argument, each surah leading to the next."
        feedback: |
          Some modern readers look for links between neighboring surahs, but the overall arrangement is by length, not by a continuous argument.
    explanation: |
      This matters for the claim studied next: the Qur'an is not a narrative or a treatise read in sequence, so judging its "style" means judging many short and long units of different kinds.

  - type: numeric
    id: rahman
    title: "A refrain in surah 55"
    prompt: |
      Surah 55 (ar-Rahman) has 78 verses in the Kufan count. The question "Which then of your Lord's blessings do you both deny?" recurs in it as a refrain, 31 times, each time as one whole verse. How many verses of the surah are *not* the refrain?
    answer: 47
    wrong:
      - value: 31
        feedback: |
          That is the number of refrain verses. The question asks for the others.
      - value: 109
        feedback: |
          That adds the two numbers, 78 + 31, as though the refrain were extra to the 78. It is already inside the 78 verses.
    hint: "The refrain verses are part of the 78; take them away."
    explanation: |
      78 - 31 = 47. So 31 of 78 verses, about two fifths, are the refrain. Verse counts differ a little between traditions of counting (the Madina and Mecca counts give 77), so this uses the Kufan count of 78. A repeating line like this is one of the features that makes the text suited to recitation.

  - type: text
    id: challenge
    title: "The challenge verses"
    body: |
      Muslims point to verses where the Qur'an invites doubters to match it. Cited by number only: at **17:88** the challenge is to produce the like of the whole Qur'an, even with the help of humans and jinn; at **11:13** it is ten surahs like it; at **10:38** and **2:23** it is a single surah. The verses at 52:33-34 pose it first as a question about those who say the Prophet invented the text. Many commentators read the sequence as a challenge that *steps down*: whole book, then ten surahs, then one.

      Muslims read these as a standing challenge to all who doubt. Historians and critics note that the verses state the challenge; whether anyone seriously took it up, and under what conditions, is something the sources report only in a few traditions, which the next cards come back to.

  - type: order
    id: ladder
    title: "Order the challenge"
    prompt: "According to the way classical commentators read the verses, put the challenge in the order it gets easier, hardest first."
    steps:
      - "Produce the like of the whole Qur'an (17:88)"
      - "Produce ten surahs like it (11:13)"
      - "Produce a single surah like it (10:38 and 2:23)"
    hint: "The demand shrinks from the entire book to one chapter, and the shortest surah has only 3 verses."
    explanation: |
      That a single short surah is the smallest challenge is why the shortest surahs, such as al-Kawthar, are the usual test case in discussion. Whether a three-line unit can show "inimitability" is itself part of the debate in the cards that follow.

  - type: text
    id: writers
    title: "Classical writers on i'jaz"
    body: |
      The word *i'jaz* (inimitability, literally "making others unable") became a technical term in Muslim theology by about the ninth century. Four names, each according to their own work.

      **Al-Jahiz**, a writer of the ninth century, argued in a book on the proofs of prophethood that Muhammad's Arab contemporaries, though famed for eloquence and hostile to him, did not take up the challenge. This led some thinkers to link the miracle to the style of the text. **Al-Nazzam**, a Mu'tazilite theologian (a school that stressed reason), who died in the 840s, proposed instead *sarfa* ("turning away"): God turned capable people away from trying, so the text could in principle be matched. Only a few accepted this. **Al-Baqillani** (died 1013), an Ash'ari theologian in Baghdad, wrote a systematic book, *I'jaz al-Qur'an*. **Abd al-Qahir al-Jurjani** (died 1078; some sources give 1081), a grammarian and literary theorist, wrote *Dala'il al-i'jaz* ("Signs of inimitability"), where he argued the quality lies in *nazm*: the choice and arrangement of words, so that meaning and grammar fit together in a way a speaker could not match by picking fine words alone.

  - type: mcq
    id: nazm
    title: "Where is the quality, according to al-Jurjani?"
    prompt: |
      Two readers disagree. One says the Qur'an is inimitable because its individual words are rare and beautiful. The other, following al-Jurjani, says the quality is in *nazm*. What does *nazm* mean, and why does that move matter?
    options:
      - text: "Nazm is the way words are arranged and linked in a sentence; locating the quality there says it lies in how meaning is built, not in a list of special words that anyone could copy."
        correct: true
        feedback: |
          Right. Any single word can be borrowed. If the quality is in how words fit together to carry meaning, imitation becomes a harder, more subtle target, and the claim is about whole sentences, not vocabulary.
      - text: "Nazm is the meter, which the Qur'an follows exactly as classical poetry does."
        feedback: |
          Not quite. The Qur'an is distinguished from fixed-meter poetry, and nazm is about arrangement of words and grammar, not poetic meter.
      - text: "Nazm is the claim that God turned people away from imitating it."
        feedback: |
          That is the rival idea of al-Nazzam, sarfa. Al-Jurjani, according to a study of his work, criticised sarfa and located the quality in the text itself.
    explanation: |
      Notice the contrast: sarfa puts the miracle in a divine act (the text could be copied but is not), nazm puts it in the text. These differ on what exactly is claimed to be beyond human power.

  - type: text
    id: argument
    title: "The argument, stated as defenders would"
    body: |
      Put as a guided argument, in the form its defenders would accept:

      **P1.** The challenge was addressed to people who were masters of Arabic and had every reason, religious and political, to answer it.

      **P2.** They did not produce anything judged to match it, and in the centuries since, no one has been accepted by the community of Arabic speakers as having done so.

      **P3.** The best explanation of P1 and P2 together is that the Qur'an has a quality beyond human ability.

      **C.** So it did not come from a human author, and Muhammad's claim to be a messenger is supported.

      The step from P1 and P2 to C is valid only if P3 is true: if there is a better explanation, the argument fails at P3, not in its logic. Defenders add that the claim is not only about style but about what the text says.

  - type: mcq
    id: premise
    title: "Which premise would a critic reject?"
    prompt: |
      A critic reads the argument above and says: "I accept that Muhammad's contemporaries did not match the Qur'an. I do not accept that this shows a superhuman source." Which premise is the critic rejecting?
    options:
      - text: "P3: the inference from 'not matched' to 'beyond human ability' is rejected, since other explanations exist (the challenge may not have been taken seriously, each great work is unique, taste differs)."
        correct: true
        feedback: |
          Yes. The critic grants P2 and doubts that it demands the explanation in P3. Uniqueness is not the same as impossibility to imitate, and a text can be unmatched for many reasons.
      - text: "The conclusion C, while accepting that the argument is valid whatever P3 says."
        feedback: |
          If P1 to P3 are all true, validity would force C. The critic who accepts P1 and P2 and still rejects C must reject P3, the step that links them.
      - text: "P1: the critic denies that Arabic speakers existed."
        feedback: |
          The critic here explicitly accepts the facts about the contemporaries. The disagreement is about what those facts show.
    explanation: |
      Validity and truth are separate checks. The defender's reasoning is valid; the critic's quarrel is that P3 is an inference to the best explanation, and best is judged against rivals.

  - type: text
    id: critics
    title: "How would you test it? The circularity worry"
    body: |
      Critics, Muslim and non-Muslim, raise questions about the test itself. How would one decide that something *matches* the Qur'an? A panel of Arabic speakers would judge by taste, and taste is shaped by the Qur'an, which has been the model of classical Arabic prose for fourteen centuries. This is the **circularity worry**: the measure of excellence is set partly by the text being measured.

      Defenders reply that a text can be a standard and still be exceptional: the claim is that nothing written in the same language has persuaded its readers of an equal quality. They add that the judgment of many generations of speakers, over many generations, is evidence. Critics answer that admiration shows impact, which a text that has been central for a long time would have anyway.

  - type: mcq
    id: circle
    title: "Which reply answers the circularity worry?"
    prompt: |
      Critic: "The panel judging whether a new text matches the Qur'an uses Arabic taste formed by the Qur'an, so it cannot be a neutral test." Which response would a defender consider the strongest?
    options:
      - text: "Propose a test that does not rely on the Qur'an's own taste, for instance blind comparison by readers trained only in other Arabic prose and poetry, and say in advance what result would count as success."
        correct: true
        feedback: |
          Yes. A claim becomes testable when its conditions are set in advance. The criticism is then answered by how the test is designed, not by refusing it.
      - text: "Say that the claim cannot be tested and that this proves it."
        feedback: |
          Untestable and proved are opposite. If no result could count against it, the claim would be a commitment, not an argument.
      - text: "Point out that Muslims believe the Qur'an is divine."
        feedback: |
          That states the faith commitment. It is legitimate as a statement of faith, but it does not answer a critic who asks for evidence outside the faith.
    explanation: |
      This is the course's usual question: what would count as evidence against it? Without an answer, a claim moves from the second layer (live debate) to the third (commitment). Both are honest positions, as long as they are labelled.

  - type: mcq
    id: excellence
    title: "Excellence is not origin"
    prompt: |
      A reader says: "I am convinced the Qur'an is among the greatest works of Arabic literature. So it must come from God." Which reply is fairest?
    options:
      - text: "The first claim is about literary quality, which many non-Muslim scholars also grant; the second is about origin, which needs a further premise that nothing human could reach that quality."
        correct: true
        feedback: |
          Yes. Many great works are admired without being thought divine. The step from "greatest" to "superhuman" is the premise P3 of the argument.
      - text: "Greatness in literature is never real; it is only opinion, so the first claim is empty."
        feedback: |
          Too strong. People can reasonably compare works by technique, structure and effect on readers, even if some taste remains.
      - text: "If the literature is great enough, the origin question disappears."
        feedback: |
          The two questions stay separate: how good a text is and who or what it came from. An excellent text can have an ordinary human source.
    explanation: |
      Believers and non-believers can agree on the first claim and differ on the second. That is a clear example of the course's rule: agree on the layer where the evidence is shared, and name where the disagreement begins.

  - type: mcq
    id: sarfa
    title: "A Muslim view that the text could be matched"
    prompt: |
      Al-Nazzam's *sarfa* says God turned capable people away from imitating the Qur'an. What does that view show about the claim of inimitability?
    options:
      - text: "That Muslims themselves disagreed about where the miracle lies: in the text, as al-Jurjani held, or in God's act of preventing imitation."
        correct: true
        feedback: |
          Yes. The doctrine is not one position but a family of them, all agreeing that the Qur'an is a sign, and disagreeing about its mechanism.
      - text: "That all Muslim scholars held the Qur'an cannot be matched by any human."
        feedback: |
          Most did hold it unmatched in practice, but the sarfa view says the unmatched status comes from divine prevention, and later scholars argued against it.
      - text: "That the Qur'an is not considered a miracle by Muslims."
        feedback: |
          Al-Nazzam still held it to be a sign. He differed on how the sign works.
    explanation: |
      A fair presentation shows the range inside the tradition, not only the critics outside it. Few accepted sarfa, and al-Jurjani criticised it, yet it was argued by a major Mu'tazilite theologian.

  - type: mcq
    id: layers
    title: "Which layer?"
    prompt: |
      Three sentences. (A) "The Qur'an has 114 surahs, ordered roughly by length." (B) "No human text could match the style of the Qur'an." (C) "The Qur'an is the word of God." Which labelling is most accurate?
    options:
      - text: "(A) is a checkable fact about the text; (B) is live debate, since it depends on how matching is tested; (C) is a faith commitment that Muslims affirm and that stylistic study can neither confirm nor refute."
        correct: true
        feedback: |
          Yes. Most of the lesson sits in the middle layer: the facts are shared, the tests are argued, and the faith claim is outside what the tests can reach.
      - text: "All three are checkable facts, since the Qur'an is a written text."
        feedback: |
          The text exists and can be counted, so (A) is fact. (B) and (C) are claims about its limits and source, and those are not read off the page.
      - text: "All three are only opinions, so there is nothing to say about any of them."
        feedback: |
          (A) is simply true or false and can be checked. Calling everything opinion erases the difference between a count and a conviction.
    explanation: |
      Sorting claims by layer is the habit this course trains: it lets believer and critic agree on what they can and disagree on what they must.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the Qur'an is only one source of Islam. The lesson Hadith, Sunnah and Chains of Transmission asks how reports of the Prophet's words and acts were collected, why Muslims gave them a chain of named narrators, and how scholars graded them.
