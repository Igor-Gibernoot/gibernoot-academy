id: ch16-hadith
title: "Hadith, Sunnah and Chains of Transmission"
kind: concept
own: |
  The question: after Muhammad's death in 632 CE, Muslims needed to know what he had said and done, since according to the Muslim tradition his example guides law and worship. How were reports of him collected and graded, and how far back can scholars trace them? Everything is taught according to someone: classical Muslim scholars of hadith, and modern historians, Muslim and non-Muslim.
  - **Terms.** A *hadith* is a {{ report of what the Prophet said, did or approved }}; its two parts are the *isnad* (the named chain of narrators, "A heard it from B, who heard it from C...") and the *matn* (the text of the report). The *sunnah* is the Prophet's example as a way to follow, which hadith are used to document.
  - **Collection.** According to the tradition, the caliph Umar II (reigned 717 to 720) had scholars such as al-Zuhri (died about 742) write reports down. The great collections date from the third Muslim century: al-Bukhari (died 870) and Muslim (died 875) are ranked highest, and with Abu Dawud, al-Tirmidhi, al-Nasa'i and Ibn Majah they form the {{ six books }} of Sunni Islam. Shi'i Muslims have their own canon (the Four Books, beginning with al-Kulayni).
  - **Classical grading.** A hadith is *sahih* ("sound") when {{ its chain is connected, every narrator is trustworthy (*adl*) and accurate (*dabt*), and the report has no hidden defect and does not contradict a better-attested one }}; *hasan* ("fair") when one narrator falls a little short of full accuracy; *da'if* ("weak") when the chain is broken or a narrator is criticised. A report carried by so many chains that collusion is implausible is *mutawatir*; any other is *ahad*.
  - **The sceptical view.** According to Goldziher (1890) and Schacht (1950), many hadith, especially legal ones, reflect {{ the debates of the first two centuries, projected back onto the Prophet }}, and chains tend to grow backwards. Schacht's "common link" is the earliest narrator at which many chains of one report converge, taken as its likely originator.
  - **The reply.** Motzki (1948 to 2019) compared chains and texts together (*isnad-cum-matn* analysis) and argued that the collection of Abd al-Razzaq preserves material from the first Muslim century, dating Meccan legal tradition decades earlier than Schacht allowed. Sceptics reply that a collector may have invented the chains himself.
  - **Three layers.** Established: the collections, authors, and the grading rules exist. Live debate: how much of the material is early. Commitment: that the Prophet's example is binding guidance, which Muslims hold and which the study of chains neither proves nor refutes.

cards:
  - type: mcq
    id: hook
    title: "Guess: how would you test a saying?"
    prompt: |
      Guessing is the point; no background is needed. In the year 850 CE a scholar in Baghdad hears a saying attributed to the Prophet Muhammad, who died in 632. The scholar is told: "A heard it from B, who heard it from C, who heard it from a man who knew the Prophet." The saying is now two centuries old in the telling. Which check would you try first?
    options:
      - text: "Look at the people in the chain: could each have met the one before, and were they honest and good at remembering? Also see whether the saying fits what else is known of the Prophet."
        correct: true
        feedback: |
          A good guess, and close to what hadith scholars actually did: they studied the narrators (who they were, when they lived, how reliable) and also compared the report with others. The lesson shows how this was formalised, and what modern historians ask in addition.
      - text: "Accept it if it is beautifully worded and sounds wise."
        feedback: |
          Wisdom is not a sign of origin. Wise sayings were attributed to many famous people. Hadith scholars asked about the path the words took, not only how they sound.
      - text: "Accept it if enough people believe it today."
        feedback: |
          Belief shows how a report was received, not where it came from. Both classical scholars and modern historians want a test that works even before anyone believed it.
    explanation: |
      Keep three layers apart: facts (what the collections contain, who compiled them), live debate (how early the reports are), and faith (that the Prophet's example is binding for Muslims). This lesson works on the first two and states the third as what Muslims hold.

  - type: text
    id: terms
    title: "Hadith and sunnah"
    body: |
      A **hadith** (Arabic for "report" or "account") is a short report of what the Prophet Muhammad said, did, or silently approved. Each has two parts. The **isnad** (Arabic "support") is the chain of named people who passed it on: "A told me from B, from C, from a Companion, that the Prophet said...". The **matn** is the text of the report itself.

      The **sunnah** is a different word. It originally meant a customary way of acting; in Islamic law it came to mean mainly the example of the Prophet, the way Muslims are to follow. Hadith are the reports that document that example. Shi'i Muslims also count reports of the Prophet's household (the Ahl al-Bayt), and Sunni Muslims count reports of his Companions as well.

      Recall from the lesson Muhammad and the Sources for His Life that reports like these also built the early biographies; here the focus is on reports used for law and belief.

  - type: mcq
    id: which-is-which
    title: "Isnad or matn?"
    prompt: |
      A report begins: "Salim told me, from his teacher Hamid, from a Companion: the Prophet said that a guest should be honoured." Which statement is correct?
    options:
      - text: "The names Salim, Hamid and the Companion make up the isnad; the saying about honouring a guest is the matn."
        correct: true
        feedback: |
          Yes. A scholar can ask about each name (when did he live, was he reliable) and separately about the saying itself.
      - text: "The whole passage is the sunnah and has no separate parts."
        feedback: |
          The sunnah is the Prophet's example as a way to follow. A hadith is one report that documents it, and each report has its chain and its text.
      - text: "The saying about the guest is the isnad, because it is the support for the rule."
        feedback: |
          It is a natural mix-up. The matn is the content that is supported; the isnad is the chain of people that supports it.
    explanation: |
      The invented example only shows the shape. Notice that the two parts allow two kinds of criticism: of the people, and of the content.

  - type: text
    id: why
    title: "Why the reports mattered"
    body: |
      According to the Muslim tradition, the Qur'an is God's word and the Prophet's life shows how to live by it. Classical jurists argued that the Qur'an commands things such as the daily prayers and almsgiving, while the detail of how to do them is known through the Prophet's example. That made reports of him a source of law and practice.

      The jurist **al-Shafi'i** (767 to 820 CE, born in Gaza, died in Egypt) is credited with giving this a systematic form in his book on the foundations of law, the *Risala*. According to scholars such as Daniel Brown and John Burton, he gave the Prophet's sunnah final authority next to the Qur'an, and through his influence "sunnah" came to mean mainly the Prophet's practice. Once hadith carried legal weight, the question *which reports can be trusted?* became urgent.

      Not all Muslims agree on this. Some modern movements, often called Qur'anists, hold that the Qur'an alone is the source of religious law, while others give hadith a secondary role. Their critics answer that the Qur'an alone does not give the detail of worship. Both sides argue from within Islam.

  - type: text
    id: collection
    title: "From memory to books"
    body: |
      The tradition holds that the Prophet's sayings were first carried by his Companions and then by the generation after them, the Successors, mostly by memory and teaching. According to Muslim sources, the Umayyad caliph **Umar II** (reigned 717 to 720) ordered scholars to write reports down, and **al-Zuhri** (died about 742) is named as the compiler who put them in books. Historians accept that Zuhri was an early and central figure, but they disagree on his role: Goldziher held that Zuhri forged reports at the rulers' request, while Azami and Motzki dispute the historicity of the story Goldziher relied on.

      No pre-Umayyad collection survives. Among the earliest surviving texts are a papyrus scroll of Ibn Lahi'a (died 790) and the *Muwatta* of Malik, usually called the earliest written hadith collection. The large collections came in the third Muslim century, roughly the ninth century CE, two hundred years and more after the Prophet. Sunni sources were documented 200 to 300 years later than the events, Shi'i collections later still, which is why the question of dating is so sharp.

      According to Muslim scholars, this gap was bridged by a living practice: reports were learned from a teacher in person and passed on with the teacher's permission, and travelling scholars checked narrators against one another.

  - type: order
    id: timeline
    title: "Order the names"
    prompt: "Put these in the order they lived or died, earliest first."
    steps:
      - "Muhammad dies (632 CE)"
      - "Al-Zuhri dies (about 742 CE)"
      - "Al-Shafi'i dies (820 CE)"
      - "Al-Bukhari dies (870 CE)"
    hint: "Think of the gaps: a century passes between the first two, then three generations of scholars."
    explanation: |
      Al-Bukhari, the compiler of the most highly ranked collection, died 238 years after the Prophet. The collectors were not witnesses; they depended on chains, and that is why chains matter.

  - type: text
    id: sixbooks
    title: "The canonical collections"
    image:
      src: img/bukhari-manuscript.webp
      alt: Tooled brown leather binding with a central medallion, from a hand-made volume described as a section of the Sahih of al-Bukhari
      caption: Binding of a section of a copy of the Sahih of al-Bukhari made in Egypt or Syria in the 14th or 15th century, one of many hand-made volumes through which the collection travelled.
      credit: "LACMA, Public domain, via Wikimedia Commons"
      link: https://commons.wikimedia.org/wiki/File:Section_of_the_Sahih_of_al-Bukhari_LACMA_M.73.5.600.jpg
    body: |
      In Sunni Islam six collections are called canonical, the "six books". The two ranked highest are together called the *Sahihayn* ("the two sound ones"): the *Sahih* of **al-Bukhari** (810 to 870 CE, born in Bukhara) and the *Sahih* of **Muslim ibn al-Hajjaj** (died 875, of Nishapur), friends who met in Nishapur. Four more follow them.

      | Collection | Compiler | Died (CE) |
      |---|---|---|
      | Sahih al-Bukhari | al-Bukhari | 870 |
      | Sahih Muslim | Muslim | 875 |
      | Sunan Abi Dawud | Abu Dawud | 888 |
      | Sunan al-Tirmidhi | al-Tirmidhi | 892 |
      | Sunan al-Nasa'i | al-Nasa'i | 915 |
      | Sunan Ibn Majah | Ibn Majah | 887 |

      Some Maliki scholars do not count Ibn Majah among the six. Shi'i Muslims have their own canon, the "Four Books", the first of which was compiled by al-Kulayni (died 329 in the Muslim calendar).

  - type: numeric
    id: selection
    title: "How selective was al-Bukhari?"
    prompt: |
      According to the tradition, al-Bukhari memorised some 600,000 narrations and chose from them for his *Sahih*. The collection holds about 2,600 different reports once repetitions are removed (the count with repetitions is 7,563). About what percent of the 600,000 are the distinct reports he kept? Give your answer to one decimal place.
    answer: 0.4
    tolerance: 0.05
    wrong:
      - value: 1.26
        feedback: |
          That divides 7,563 by 600,000. The repeated copies are the same report entered under several chapter headings, so the distinct count, 2,600, is the one to use.
      - value: 4.3
        feedback: |
          Check the decimal: 2,600 over 600,000 is a few thousandths, not a few hundredths.
    hint: "Divide 2,600 by 600,000 and multiply by 100."
    explanation: |
      $2600/600000 \approx 0.0043$, about 0.4 percent. The 600,000 figure is the tradition's own claim about his memory, not a count anyone can check. It does show the idea behind the project: collect widely, then keep only what meets a strict standard.

  - type: text
    id: grading
    title: "Grading a report"
    body: |
      Classical scholars did not grade by taste. In the later systematic form given by Ibn Hajar, a report is **sahih** ("sound") when five conditions hold. Every narrator is trustworthy (*adl*: upright in character), and every narrator preserved the report accurately (*dabt*: by memory or by careful writing). The chain is **connected** (*ittisal*): each narrator could have received it from the one before. And the report has no hidden defect (*illa*) and does not contradict a report already accepted (*shudhudh*).

      A **hasan** ("fair") report meets the sahih standard except that one narrator is a little less accurate. A **da'if** ("weak") report fails because the chain is broken or a narrator is criticised. For example a **mursal** report is one where a Successor skips the Companion and cites the Prophet directly.

      Reports were also classed by how many chains carry them. A **mutawatir** report comes by so many chains that collusion to invent it is considered implausible. Any other is **ahad** ("single"). Ibn Hajar held that mutawatir reports give certain knowledge, while ahad reports give probable knowledge unless corroborated; other scholars, such as Ibn Hazm, held that ahad reports can also give certain knowledge.

  - type: mcq
    id: grade-case
    title: "Which grade fits?"
    prompt: |
      A hadith has a chain of five narrators, and the sources agree that all are trustworthy and accurate. But the third narrator was born only after the fourth narrator died, so he could not have heard from him. How would a classical scholar grade it, and why?
    options:
      - text: "Weak (da'if) because the chain is not connected: a narrator cannot have received it from someone who died before he was born."
        correct: true
        feedback: |
          Yes. A chain is only as strong as its links, and here one link is impossible. Honest narrators do not repair a gap in the chain.
      - text: "Sound (sahih), because every narrator is trustworthy and accurate."
        feedback: |
          Two of the five conditions are met (adl and dabt), but connection is also required, and here it fails.
      - text: "Fair (hasan), because most of the conditions are met."
        feedback: |
          Hasan is a different case: the chain is connected, and only one narrator is slightly less accurate. A broken link is a failure of connection, not a small weakness.
    explanation: |
      Notice how much of the system rests on biography: knowing when each narrator lived and whom he met. This is the work of the science of narrators, which the next lesson uses.

  - type: mcq
    id: mutawatir
    title: "What mutawatir tries to answer"
    prompt: |
      According to classical scholars, what is the idea behind giving a very high status to a mutawatir report?
    options:
      - text: "If a report comes by many independent chains at every stage, it is implausible that all those people agreed on a falsehood, so the report is accepted as certain."
        correct: true
        feedback: |
          Right. The argument is about independence: many separate lines of transmission that nevertheless agree. It is the same reasoning as in any case where many unconnected witnesses agree.
      - text: "Any report in the collection of al-Bukhari is mutawatir."
        feedback: |
          No. Many sound reports in the Sahihayn are ahad: carried by few chains. Mutawatir is about the number of chains, not the book.
      - text: "A report is mutawatir if the narrators are all famous scholars."
        feedback: |
          Fame is not the test. The test is the number and independence of the chains.
    explanation: |
      A sceptic would ask the matching question: are the many chains really independent, or did later transmitters copy one another's lines? That is exactly where the modern debate starts.

  - type: text
    id: goldziher
    title: "The sceptical turn: Goldziher and Schacht"
    body: |
      The Hungarian scholar **Ignaz Goldziher** (1850 to 1921) published his *Muhammedanische Studien* in 1889 to 1890. According to Goldziher, much of the hadith literature reflects the legal and doctrinal controversies of the two centuries after Muhammad rather than the Prophet's own words, and each side of a controversy could be given supporting hadith with a chain. He therefore held that the content of a report is a better guide to its origin than its isnad, and he pointed to anachronisms in the matn.

      **Joseph Schacht** (1902 to 1969) developed this for law in *The Origins of Muhammadan Jurisprudence* (1950). According to Schacht, early legal doctrines were mostly traced to earlier jurists and Companions and almost never to the Prophet; Prophetic hadith in law were largely **projected back** onto him later, from about 720 CE onward, and chains tended to grow backwards, so that the more perfect the isnad, the later the report.

      Schacht also noted that the chains of one report often converge on a single narrator. The Dutch scholar **G. H. A. Juynboll** (1935 to 2010), in *Muslim Tradition* (1983), made this into a method: this earliest point where chains converge is the **common link**, taken as the likely originator of the report, from whom one can date it.

  - type: mcq
    id: backward
    title: "What does 'projecting back' say?"
    prompt: |
      According to Schacht, what happened to many legal hadith in the first two Muslim centuries?
    options:
      - text: "Rulings that jurists worked out in their own time were attributed to earlier authorities, and later to the Prophet himself, as the chains were extended backward."
        correct: true
        feedback: |
          Yes. The claim is about attribution over time: a view held later is credited to older and older names, until the Prophet. It does not say that every report is false, and it was mainly about legal hadith.
      - text: "All hadith were invented from nothing by rulers."
        feedback: |
          That overstates it. Schacht's thesis was about the attribution of legal doctrine to authorities, and later scholars, including those who agree with parts of it, hold different views of other material.
      - text: "The chains were true, but the texts were changed later."
        feedback: |
          Schacht's suspicion fell on the chains: he held that they were extended backward. Goldziher, by contrast, gave the content priority.
    explanation: |
      The thesis is a historian's claim about how a body of tradition grew, and it can be tested only against the chains and texts we have. Classical scholars knew forgery existed and built the grading system against it; the dispute is how far that system succeeded.

  - type: text
    id: motzki
    title: "The reply: Motzki and early dating"
    body: |
      **Harald Motzki** (1948 to 2019) held that Schacht relied on questionable assumptions. He argued for comparing, report by report, the chains and the texts together (*isnad-cum-matn* analysis, developed in the 1990s by Motzki and independently by Gregor Schoeler). Where reports share a source, the same detail appearing in versions that reach us by different routes suggests an older original, and unlike versions can show where a text was altered.

      His main test case was the *Musannaf* of **Abd al-Razzaq al-San'ani** (died 211 AH, about 827 CE), which preserves material from earlier scholars whose own books are lost. In *The Origins of Islamic Jurisprudence: Meccan Fiqh before the Classical Schools* (2002), Motzki concluded that these Meccan strands were credible as reports of the first Muslim century, and that the beginning of Islamic legal tradition should be dated some 50 to 75 years earlier than Schacht held. Motzki and others also argued that early legal reasoning used the Prophet's hadith less than later law, and that its use grew during the second Muslim century.

      Not every reviewer accepts his method. A critic can ask whether Abd al-Razzaq invented the earlier sources that he names.

  - type: mcq
    id: same-evidence
    title: "One overlap, two readings"
    prompt: |
      Four collections contain a report with nearly identical wording, each by a different chain, but all four chains pass through one man, a scholar who lived about 720 CE. What are two fair readings?
    options:
      - text: "Motzki-style: the scholar was a real transmitter who passed on an older report, so the report is at least as early as him. Schacht-style: the scholar may himself have been the source or the one who attached the Prophet's name, so the report dates only to him."
        correct: true
        feedback: |
          Yes. Both readings take the overlap seriously and date the report to about 720 or earlier. They differ on what lay before that name: an older report that he collected, or something he started. The overlap alone cannot decide, so scholars bring in other evidence.
      - text: "Only the sceptical reading is reasonable: any overlap proves forgery."
        feedback: |
          Overlap does not prove forgery. It shows a shared source at a certain point; whether that source was a collector or an inventor is the open question.
      - text: "Only the traditional reading is reasonable: any overlap proves the Prophet said it."
        feedback: |
          Overlap shows a shared source at a certain point in the chain. It cannot by itself reach back to the Prophet, who is two or three generations earlier.
    explanation: |
      Both sides therefore agree on the evidence and disagree on how to read it: a collector or a forger. A third reading is also possible: the report may be early on one point and invented in its details. Wording this carefully is the main skill of the next lesson.

  - type: mcq
    id: layers
    title: "Which layer is the claim in?"
    prompt: |
      Sort the claim "The collection of al-Bukhari was compiled in the ninth century CE and contains more than 2,000 distinct reports" and the claim "The Prophet said what a given sound hadith attributes to him". Which pair of layers is it?
    options:
      - text: "The first is established fact; the second is, for a given report, a matter of live debate among historians and, for Muslims, also a commitment of faith about the Prophet's guidance."
        correct: true
        feedback: |
          Yes. The first can be checked in the manuscripts and the catalogues. The second depends on how early a report can be dated and on what a believer holds, so a historian and a believer may reach it by different routes.
      - text: "Both are established fact, because al-Bukhari graded the report sound."
        feedback: |
          Grading is a judgement made by a scholar using rules. It is a historical fact that he made it, but whether the Prophet said the words is the question being graded.
      - text: "Both are faith, because everything in the collection is part of religion."
        feedback: |
          Faith commitments are not required to say when a book was compiled or how many distinct reports it holds. Those can be checked by anyone.
    explanation: |
      This is the same separation used throughout the course: what can be checked, what scholars argue about, and what a tradition holds as faith.

  - type: mcq
    id: part-ways
    title: "Where thoughtful people part ways"
    prompt: |
      A classical hadith scholar, a Qur'anist, and a sceptical historian all read the same isnad of a report. On which premise do they most disagree?
    options:
      - text: "Whether a chain that looks sound is reliable evidence of what the Prophet said: the classical scholar says yes under strict conditions, the historian asks how chains could have been fabricated, and the Qur'anist asks whether the Prophet's example should bind beyond the Qur'an."
        correct: true
        feedback: |
          Yes. These are different premises, and each is argued within its own frame. The first two are about evidence (do the conditions guarantee early origin?), the third is about authority (what binds a Muslim).
      - text: "Whether the collections exist: some of them dispute it."
        feedback: |
          The collections, their compilers and their approximate dates are not disputed. The debate is about how early and how reliable the material is.
      - text: "Whether narrators lived in the places the sources say, which decides everything."
        feedback: |
          Biography matters, and it was the core of classical grading, but even when the narrators are real the question remains whether a real narrator passed on a real report or made one up.
    explanation: |
      Disagreement here is not ignorance of the facts. It comes from what each side counts as good evidence and what each holds binding. A classical scholar and a historian can use the same chains and draw different conclusions.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the lesson Guided Problem: Grading a Chain of Transmission takes one invented report and its chain and grades it step by step: the narrators' dates, reliability, and links, then reads the same chain the way a modern historian would.
