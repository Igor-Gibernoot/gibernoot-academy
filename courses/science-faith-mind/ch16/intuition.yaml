id: ch16-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: Islam studied as history, text and thought, from Arabia before the Qur'an to the modern world (years are CE). Every answer below is *according to* some tradition, scholar or text.
  - **The Qur'an.** According to Muslim tradition, Abu Bakr had Zayd ibn Thabit collect the revelation; the sheets passed to Umar and then to his daughter Hafsa; Uthman (caliph 644 to 656) had copies made and sent to garrison towns. A radiocarbon test of the Birmingham leaves gave 568 to 645 at 95.4% confidence, so the latest possible date is $645-632={{ 13 }}$ years after Muhammad's death in 632.
  - **Hadith grading.** A hadith (report of what the Prophet said or did) has an *isnad* (chain of narrators) and a *matn* (text). Ibn Hajar's *sahih* needs five conditions: {{ connected chain, upright narrators, accurate narrators, no hidden defect, no clash with a better-attested report }}. *Hasan* means one narrator slightly less accurate; *da'if* means a broken chain or a criticised narrator; *mutawatir* means so many chains that collusion is implausible; any other report is *ahad*. A common link is the earliest narrator where many chains meet.
  - **Schools and branches.** Ja'far al-Sadiq (died 765), Abu Hanifa (767), Malik (795), al-Shafi'i (820), Ahmad ibn Hanbal (855) are the namesakes of the Ja'fari (Shia) and the four Sunni schools. Sunnis and Shia part over succession: Ghadir Khumm and the word *mawla* ("friend" for Sunnis, "leader" for Shia), the meeting at Saqifa (632, Abu Bakr chosen), Ali's caliphate (656 to 661) and Karbala ({{ 10 October 680 }}).
  - **Kalam and philosophy.** Ghazali (died 1111) denied that the link between fire and burning is {{ logically necessary }}, not that fire regularly burns; Averroes (died 1198) replied in the *Incoherence of the Incoherence*.
  - **Sufism.** *Sukr* (intoxication) is later paired with al-Bistami (died about 874), *sahw* (sobriety) with al-Junayd (died 910); the pairing is itself a later construction.
  - **Shared figures.** *Tahrif al-nass* is a change of the {{ text }}; *tahrif al-ma'na* is a change of the {{ meaning }} (a misreading).
  - **Modern.** Al-Khwarizmi (c. 820) solved $x^2+10x=39$ by completing the square: $(x+5)^2=64$, so $x=3$. In Pew's 2013 survey of 22 countries, at least half of Muslims accepted evolution in 13 countries, which is $13/22\approx59\%$ of the countries asked and not 59% of Muslims.

cards:
  - type: text
    id: welcome
    title: "Quick recall: Islam, the Qur'an and the tradition"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main distinctions and numbers: how the Qur'an was collected, the grading of hadith, the schools and the two branches, the kalam question about causes, the Sufi pair of stances, the two meanings of *tahrif*, and a few figures from science and from a survey.

      Three kinds of card: **mnemonics**, **build and order cards**, and **numeric cards that give you data only**: you choose the method yourself.

      As always, every answer is *according to* someone or some tradition. Nothing here asks which faith is true.

  - type: order
    id: collection
    title: "The Qur'an's collection, according to tradition"
    prompt: |
      According to the Muslim tradition of how the Qur'an was gathered into one text, put these steps in order, earliest first.
    steps:
      - 'Abu Bakr, the first caliph, has Zayd ibn Thabit collect the revelation into sheets.'
      - 'The sheets pass to the second caliph, Umar.'
      - 'After Umar they are kept by his daughter Hafsa.'
      - 'Uthman (caliph 644 to 656) has copies made from them and sent to the garrison towns.'
    hint: 'Three keepers in the order of the caliphs and her father, and the copies come at the end.'
    explanation: |
      Mnemonic: **Abu Bakr, Zayd, Umar, Hafsa, Uthman**: collect, keep, keep, copy. This is how the tradition tells it; historians weigh how far the story and the dates can be tested by manuscripts.

  - type: mcq
    id: uthman-copies
    title: "What did Uthman's copies do?"
    prompt: |
      According to the tradition, what was the aim of the copies sent to the garrison towns?
    options:
      - text: 'To give each town the same standard text (the same skeleton of letters), the other versions being set aside.'
        correct: true
      - text: 'To create a new revelation for the towns.'
        feedback: |
          Uthman is not said to have added anything. The tradition says he had the existing text copied.
      - text: 'To translate the Qur’an into the languages of the towns.'
        feedback: |
          The copies were in Arabic. Translations came later and are called renderings of the meaning.
      - text: 'To settle exactly how every word is vowelled and recited.'
        feedback: |
          The skeleton of letters was fixed, but several authoritative ways of reciting it remained, which is why the seven readings of Ibn Mujahid exist.
    explanation: |
      Mnemonic: **one skeleton, several recitations**.

  - type: numeric
    id: birmingham
    title: "A radiocarbon date against a death"
    prompt: |
      A Qur'an manuscript in Birmingham has its parchment dated by radiocarbon, at 95.4% confidence, to between 568 and 645 CE. Muhammad died in 632 CE. By how many years does the latest possible date fall after his death?
    answer: 13
    tolerance: 0.1
    answerText: '13'
    wrong:
      - { value: 77, feedback: 'That is the width of the date range, 645 minus 568. The question compares the end of the range with the death.' }
      - { value: 64, feedback: 'That is the gap between 568 and 632. The latest date is the one that matters here.' }
    hint: 'The question compares one end of the range with a fixed date: a difference of two years.'
    explanation: |
      $645-632=13$ years. The test dates the animal that gave the parchment, not the ink, and the range is wide. So the leaves are very early, but the test cannot show that they are older than Muhammad's death.

  - type: build
    id: five-conditions
    title: "Ibn Hajar's five conditions"
    prompt: |
      According to Ibn Hajar, a hadith is *sahih* when five conditions hold. Build them in this order: the chain, the character of the narrators, their accuracy, a hidden defect, a clash with a better-attested report.
    tiles: ['\text{connected}', '\text{upright}', '\text{accurate}', '\text{no hidden defect}', '\text{no clash}', '\text{famous}', '\text{early}']
    answers:
      - ['\text{connected}', '\text{upright}', '\text{accurate}', '\text{no hidden defect}', '\text{no clash}']
    wrong:
      - answer: ['\text{famous}', '\text{upright}', '\text{accurate}', '\text{early}', '\text{no clash}']
        feedback: |
          Fame and early date are not among the conditions. A report can be well known or old and still fail on a broken chain.
    hint: 'Chain first, then the two qualities of each narrator, then two checks on the report itself.'
    explanation: |
      Mnemonic: **connected, upright (*adl*), accurate (*dabt*), no hidden defect, no clash**. A sahih report meets all five. Failing one is enough to stop it being sahih.

  - type: mcq
    id: grades
    title: "Four grades and two counts"
    prompt: |
      Which pairing of term and meaning is right?
    options:
      - text: '*Hasan*: all conditions met except that one narrator is slightly less accurate. *Da’if*: a broken chain or a criticised narrator. *Mutawatir*: so many chains that collusion is implausible. *Ahad*: any other report.'
        correct: true
      - text: '*Hasan*: a broken chain. *Da’if*: a slight memory slip. *Mutawatir*: a report with one chain. *Ahad*: a report with many.'
        feedback: |
          Reversed on every term. A broken chain is the typical da'if case, and mutawatir is the report with the most chains.
      - text: '*Hasan* and *da’if* both mean the report is false and should be dropped.'
        feedback: |
          The scheme is graded. A hasan report is accepted for many purposes, and a da'if one is weak but is not the same as invented.
      - text: '*Mutawatir* means the report was written down by Bukhari.'
        feedback: |
          Mutawatir describes how widely the report was transmitted, not who collected it.
    explanation: |
      Mnemonic: **hasan = a little less accurate; da'if = broken or criticised; mutawatir = many chains; ahad = the rest**. Scholars disagree on the minimum number of chains for mutawatir (some say three, some five).

  - type: numeric
    id: idris
    title: "A common link and a date"
    prompt: |
      Take an invented report ascribed to the Prophet. All the chains that survive pass through one narrator, Idris, who died in 760 CE. The Prophet died in 632 CE. How many years after the Prophet's death did Idris die?
    answer: 128
    tolerance: 0.1
    answerText: '128'
    wrong:
      - { value: 632, feedback: 'That is the year of the Prophet''s death, not the gap.' }
      - { value: 1392, feedback: 'That adds the two years. The gap is a difference.' }
    hint: 'Both years are given; the gap between two dates is a difference.'
    explanation: |
      $760-632=128$ years. Sceptics such as Schacht read a common link as the likely source of the report, which would make the story date from Idris's time. Defenders such as Motzki answer that the chains below the link can still preserve something older. Both read the same chains.

  - type: mcq
    id: isnad-matn
    title: "Isnad or matn?"
    prompt: |
      A scholar studies a report. Which task belongs to the *isnad* and which to the *matn*?
    options:
      - text: 'Checking whether two narrators could have met belongs to the isnad; checking whether the wording contradicts a better-attested report belongs to the matn.'
        correct: true
      - text: 'Checking the wording belongs to the isnad; checking the narrators belongs to the matn.'
        feedback: |
          Swapped. The isnad is the chain of names; the matn is the text.
      - text: 'Both tasks belong to the isnad.'
        feedback: |
          The wording of the report is its matn. Isnad-cum-matn analysis compares both together.
      - text: 'Only the isnad matters to the classical grading.'
        feedback: |
          The five conditions include the absence of a clash with a better-attested report, which looks at the text.
    explanation: |
      Mnemonic: **isnad = who, matn = what**.

  - type: order
    id: founders
    title: "Order the schools by their founders' deaths"
    prompt: |
      Put these five founders in order of their death years, earliest first.
    steps:
      - 'Ja’far al-Sadiq (765), after whom the Shia Ja’fari school is named.'
      - 'Abu Hanifa (767), founder of the Hanafi school.'
      - 'Malik (795), founder of the Maliki school.'
      - 'Al-Shafi’i (820), founder of the Shafi’i school.'
      - 'Ahmad ibn Hanbal (855), founder of the Hanbali school.'
    hint: 'Three men died between 765 and 795, and the last two came after 800. The Shia imam and the Hanafi founder died two years apart.'
    explanation: |
      765, 767, 795, 820, 855. Mnemonic: **Ja'far, Abu Hanifa, Malik, Shafi'i, Ahmad**. The four Sunni schools are Hanafi, Maliki, Shafi'i, Hanbali; Ja'fari is the main Shia school.

  - type: order
    id: succession
    title: "Order the events of the split"
    prompt: |
      Put these events in order, earliest first.
    steps:
      - 'At Ghadir Khumm (632), Muhammad says of Ali the words "whoever I am *mawla* to, Ali is *mawla* to".'
      - 'Muhammad dies (632).'
      - 'At Saqifa (632), a gathering chooses Abu Bakr as leader of the community.'
      - 'Ali is caliph (656 to 661).'
      - 'At Karbala (10 October 680), Husayn is killed.'
    hint: 'Three things in 632 come before Ali''s caliphate. Ghadir is on the way back from Muhammad''s last pilgrimage.'
    explanation: |
      Mnemonic: **Ghadir, death, Saqifa, Ali, Karbala**. Sunnis read *mawla* at Ghadir as "friend"; Shia read it as "leader". Saqifa is where Abu Bakr was chosen while Ali, according to the traditions, was preparing Muhammad's burial.

  - type: mcq
    id: kalam-necessity
    title: "Ghazali, necessity and regularity"
    prompt: |
      Cotton touches fire and burns, every time we look. According to Ghazali, what do we actually observe, and what do we not?
    options:
      - text: 'We observe the burning following the contact, again and again; we do not observe a logically necessary link between them. He does not deny the regularity.'
        correct: true
      - text: 'We never observe cotton burning, since all appearances are false.'
        feedback: |
          Ghazali accepts the observation. His claim is about the link, not about whether fire burns.
      - text: 'We observe the necessary link directly, and he only disputes the dates.'
        feedback: |
          The link is exactly what he says is not observed. In his view God is the cause, who acts in a habitual way.
      - text: 'He says the regularity is false and cotton never burns.'
        feedback: |
          Opponents of his view sometimes heard it this way, but he denies necessity, not regularity.
    explanation: |
      Mnemonic: **Ghazali denies necessity, not regularity**. Averroes (died 1198) replied in the *Incoherence of the Incoherence* that denying causes would end knowledge. Scaling check: the claim is about the word "because", not about the pattern.

  - type: mcq
    id: sukr-sahw
    title: "Intoxicated and sober"
    prompt: |
      Later Sufi manuals pair two stances with two men. Which pairing is right?
    options:
      - text: '*Sukr* (intoxication) with al-Bistami (died about 874); *sahw* (sobriety) with al-Junayd (died 910).'
        correct: true
      - text: '*Sukr* with al-Junayd; *sahw* with al-Bistami.'
        feedback: |
          Swapped. Al-Junayd taught in Baghdad that Sufi experience stays governed by the law and returns to ordinary awareness.
      - text: '*Sukr* with Rumi; *sahw* with Averroes.'
        feedback: |
          Averroes was a philosopher and judge in Cordoba, not a Sufi. The pair belongs to the ninth and tenth centuries.
      - text: 'Both words name al-Hallaj, executed in 922.'
        feedback: |
          Al-Hallaj is remembered for *Ana al-Haqq*, a famous ecstatic utterance, but the pair is Bistami and Junayd.
    explanation: |
      Mnemonic: **Bistami drunk, Junayd sober**. The scholar Mojaddedi argues that the pairing is a later construction, so even the tidy contrast is a piece of history.

  - type: order
    id: sufis
    title: "Order the Sufi thinkers by death"
    prompt: |
      Put these thinkers in order of their deaths, earliest first.
    steps:
      - 'Al-Junayd (910).'
      - 'Al-Hallaj (922).'
      - 'Al-Ghazali (1111).'
      - 'Ibn Arabi (1240).'
      - 'Rumi (1273).'
      - 'Ibn Taymiyya (1328).'
    hint: 'Two thinkers of the early tenth century, then Ghazali, then two of the thirteenth century, then the fourteenth.'
    explanation: |
      910, 922, 1111, 1240, 1273, 1328. Mnemonic: **Junayd and Hallaj, Ghazali, Ibn Arabi, Rumi, Ibn Taymiyya**. Ibn Arabi died 33 years after Rumi was born in 1207, and Rumi 33 years after him. Ibn Taymiyya was not simply against Sufism.

  - type: mcq
    id: tahrif
    title: "Two kinds of tahrif"
    prompt: |
      According to Muslim scholars who discuss *tahrif* ("alteration") of earlier scriptures, which statement separates its two kinds?
    options:
      - text: '*Tahrif al-nass* is a change in the text itself; *tahrif al-ma''na* is a misreading of the meaning while the words stand.'
        correct: true
      - text: '*Tahrif al-ma''na* is about the Gospel and *tahrif al-nass* is about the Torah.'
        feedback: |
          The two kinds are not assigned to different books. Each can be argued of any earlier scripture.
      - text: '*Tahrif al-ma''na* means the earlier books were never revelation.'
        feedback: |
          Both kinds presuppose that there was a revelation which was later altered or misread.
      - text: 'They are the same thing under two names.'
        feedback: |
          The difference matters. A claim of changed text can be tested against manuscripts; a claim of misread meaning is about interpretation.
    explanation: |
      Mnemonic: **nass = the words, ma'na = the sense**. Many classical Muslim scholars stressed the second; Ibn Hazm (11th century) argued the first. Christians and Jews reject both claims for their own books.

  - type: numeric
    id: khwarizmi
    title: "A problem from al-Khwarizmi"
    prompt: |
      Al-Khwarizmi (about 820) asks: a square and ten of its roots together make 39. In modern notation, $x^2+10x=39$ for a positive number $x$. Find $x$.
    answer: 3
    tolerance: 0.001
    answerText: '3'
    wrong:
      - { value: 8, feedback: 'That is $x+5=\sqrt{64}$, the side of the completed square, not the unknown itself.' }
      - { value: -13, feedback: 'This is a second root of the equation, which the question rules out by asking for a positive number.' }
    hint: 'Think of the family of quadratics solved by making the left side a perfect square.'
    explanation: |
      Adding $25$ to both sides gives $x^2+10x+25=64$, that is $(x+5)^2=64$. So $x+5=8$ and $x=3$. The $25$ is the square of half the coefficient, $(10/2)^2$. The negative root $-13$ did not count as a solution for al-Khwarizmi, who worked with lengths and areas.

  - type: numeric
    id: pew-share
    title: "Countries against people"
    prompt: |
      In the Pew survey of 2013, Muslims were asked in 22 countries whether humans and other living things evolved over time. In 13 of the countries, at least half agreed. What percentage of the countries asked is that? Give a decimal.
    answer: 59.1
    tolerance: 0.2
    answerText: '59.1'
    wrong:
      - { value: 13, feedback: 'That is the number of countries, not a percentage.' }
      - { value: 41, feedback: 'That is the share of the countries where less than half agreed (9 of 22).' }
    hint: 'Share-versus-count check: a share compares a part with the whole of the same kind of thing. Here the things are countries.'
    explanation: |
      $13/22\approx0.591$, about $59.1\%$ of the countries. It does not say that 59% of Muslims accept evolution: the countries differ in size, and acceptance ran from 79% in Kazakhstan and 78% in Lebanon to 30% in Pakistan, while 67% of Iraqis rejected it. So there is no single Muslim answer.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **The setting:** Islam studied as history, text and thought; every answer is *according to* someone.

      **The Qur'an.** Tradition: Abu Bakr, Zayd, Umar, Hafsa, Uthman (644 to 656): collect, keep, keep, copy. One skeleton of letters, several recitations. The Birmingham leaves, dated by radiocarbon to 568 to 645 at 95.4%, end $645-632=13$ years after Muhammad's death.

      **Hadith.** Isnad is the chain, matn the text. Sahih needs five conditions: connected chain, upright narrators, accurate narrators, no hidden defect, no clash with a better-attested report. Hasan means slightly less accurate; da'if means broken or criticised; mutawatir means many chains; ahad is the rest. An invented common link who died in 760 lies $760-632=128$ years after the Prophet.

      **Schools and branches.** Ja'far al-Sadiq 765, Abu Hanifa 767, Malik 795, al-Shafi'i 820, Ahmad 855. Ghadir, death, Saqifa, Ali, Karbala (10 October 680) mark the split; *mawla* is read "friend" or "leader".

      **Kalam, Sufism and shared figures.** Ghazali denies necessity, not regularity; Averroes replied in the *Incoherence of the Incoherence*. Bistami is paired with sukr, Junayd with sahw, a later pairing. *Tahrif al-nass* is a change of the text, *tahrif al-ma'na* a misreading of the meaning.

      **Modern.** Al-Khwarizmi's $x^2+10x=39$ becomes
      $$(x+5)^2=64,\qquad x=3.$$
      In Pew's survey, $13/22\approx59\%$ of the countries asked, not of Muslims, had at least half accepting evolution.

      **Next:** the content map of this level: rebuild its concept map box by box among look-alike decoys.
