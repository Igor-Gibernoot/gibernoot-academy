id: ch16-muhammad
title: "Muhammad and the Sources for His Life"
kind: concept
own: |
  The question: how do we know about the life of Muhammad, the prophet of Islam (c. 570 to 632 CE, according to the Muslim tradition)? Everything is taught according to someone: the Muslim tradition (which holds he was a prophet and tells his life in detail), non-Muslim and material evidence (short, outside, earlier), and modern historians (who weigh both).
  - **The tradition's outline.** According to Muslim tradition Muhammad was born in Mecca about 570, received his first revelation in the cave of Hira about 610, migrated to Medina in the *Hijra* of {{ 622 }}, and died in 632.
  - **The sira.** The earliest full biographies (*sira*) were written after the Abbasid revolution. Ibn Ishaq (died c. 767) wrote the first great one, but his original is lost; we read it through the abridged and edited version of {{ Ibn Hisham (died 833) }}. Al-Waqidi (747 to 823) and his secretary Ibn Sa'd (784 to 845) added campaign detail and biographical dictionaries. The oldest of these works, Ibn Ishaq's, was composed about {{ 135 years }} after 632.
  - **Outside and material evidence.** A Greek text, the Doctrina Jacobi (set in 634), reports a prophet among the Saracens (Arabs) who comes armed; an Armenian history attributed to Sebeos (finished after 661) names Mahmet, a merchant who preached. Coins from the 680s and the Dome of the Rock inscriptions (72 AH, 691 to 692 CE) {{ name Muhammad as God's messenger }}. They are brief and mostly from outsiders, but they were written within the 7th century.
  - **The scholarly debate.** Wansbrough (1977) argued the traditional narratives are late salvation history with a small historical core; Crone and Cook (*Hagarism*, 1977) built a different account from non-Muslim sources, and later retracted much of it. Donner (1998) and Motzki argued that {{ early material can be recovered and dated by studying chains of transmission and the texts together }}. Most historians accept that Muhammad lived; the live debate is how much of the detailed biography can be confirmed.
  - **The Constitution of Medina.** A text preserved by Ibn Hisham (and, separately, by Abu Ubayd) that sets out rules for the believers and the Jewish and other groups of Medina, dated by scholars to about 622 to 624. Its {{ lack of a chain of narrators }} would fail the Muslim tradition's own tests, yet many historians value it as an early document; whether it is one text or several is debated.
  - **Three layers.** Established: the early dates of the outside texts, coins and inscriptions; the existence of the later biographies. Live debate: how far the sira preserves early memory. Commitment: that Muhammad received revelation from God (Muslims affirm it; historians as historians neither affirm nor deny it).

cards:
  - type: mcq
    id: hook
    title: "Guess: a life written late"
    prompt: |
      Guessing is the point; no background is needed. Suppose you must write the life of a person who died long ago. The earliest full biography you have was composed about a century and a half after the death, and the author's own original is lost; only a later, edited copy survives. What is the most reasonable first approach?
    options:
      - text: "Use it, but look for older or independent evidence to check it against, and note where later concerns may have shaped the story."
        correct: true
        feedback: |
          A good first guess. This is how historians treat any late source: neither throw it away nor trust it blindly, but ask what could confirm it. The lesson follows that method for Muhammad, and shows where faithful readers and historians read the same texts differently.
      - text: "Trust it fully: a long tradition of retelling means nothing was changed."
        feedback: |
          Long retelling can preserve things, but it can also add, smooth and reshape. Nothing in the age of a source alone guarantees accuracy in either direction.
      - text: "Reject it entirely, since anything written late is invented."
        feedback: |
          Late does not mean invented. A late source may carry early memory. The work is to find out which parts, and the tools for that are the subject of this lesson.
    explanation: |
      Keep three layers apart: what the sources establish, what historians debate about them, and what a tradition holds by faith. Muslims hold that Muhammad was a prophet; historians as historians neither affirm nor deny that, and ask what the evidence supports.

  - type: text
    id: tradition
    title: "The tradition's own account"
    body: |
      According to the Muslim tradition, **Muhammad** was born in Mecca about 570 CE into the Quraysh, the tribe that guarded the Kaaba (recall from the lesson Arabia Before Islam: a trading and shrine town in the Hijaz, between the Byzantine and Persian empires). Orphaned young, he became a merchant. Around the age of forty, about 610, he went to pray alone in a cave on Mount **Hira** near Mecca, where, Muslims hold, the angel Gabriel brought him the first words of the Qur'an.

      He preached one God and met opposition from the leaders of Mecca. In 622 he and his followers left for the oasis of Yathrib, later called Medina, a move called the **Hijra** ("migration"), from which the Muslim calendar counts its years. In Medina he led a growing community, fought and negotiated with Mecca, and took Mecca in 629 or 630 with little fighting. He died in Medina in 632.

      This is the outline Muslims hold. Whether he received revelation is a question of faith. The question for this lesson is a different one: what is the *evidence* for the outline, who wrote it down and when?

  - type: mcq
    id: tradition-layers
    title: "Which layer?"
    prompt: |
      Consider two sentences. (A) "Muhammad received the first revelation from the angel Gabriel in the cave of Hira." (B) "Biographies of Muhammad were written down in Arabic in the eighth and ninth centuries CE." Which description is most accurate?
    options:
      - text: "(B) is a statement of documented history that anyone can check against the surviving books; (A) is what the tradition holds, a statement of faith that history as a discipline cannot test either way."
        correct: true
        feedback: |
          Yes. Muslims affirm (A). A historian can report that the tradition says it and study how it is told, but cannot confirm or refute an angel. (B) is a plain fact about manuscripts and authors.
      - text: "Both are historical claims, and a historian must either confirm or reject each one."
        feedback: |
          A historian can test claims that leave traces: books, dates, coins. A claim about an angel leaves none of the kind that history uses, so history can describe the belief but not settle it.
      - text: "Both are matters of faith, since all religious history is faith."
        feedback: |
          Too broad. That the biographies were written in the eighth and ninth centuries is checked on the books themselves by believers and non-believers alike.
    explanation: |
      Reporting what a tradition holds ("according to the tradition...") is not the same as endorsing or denying it. Both the believer and the historian can accept (B); only the believer affirms (A).

  - type: text
    id: sira
    title: "The sira: the first great biographies"
    body: |
      The word **sira** (Arabic for "way of life", a biography) names the genre of lives of the prophet. The first great one was written by **Ibn Ishaq** (died in Baghdad in 767 CE, about 150 in the Muslim calendar), a scholar from Medina who, according to the sources, compiled it for the Abbasid caliph al-Mansur. He built it from oral reports (*hadith*, short accounts of what the prophet said or did) that he gathered and dictated to his students.

      The original of Ibn Ishaq's biography did not survive. What we read is a version put together by **Ibn Hisham** (died 833), who copied much of Ibn Ishaq through earlier students but abbreviated it, annotated it and sometimes changed it. So the most famous biography of Muhammad reaches us at second hand, through an editor working about two centuries after the events.

  - type: numeric
    id: gap
    title: "How long after?"
    prompt: |
      Muhammad died in 632 CE. Ibn Ishaq, the author of the first great biography, died in 767 CE. How many years after Muhammad's death did Ibn Ishaq die?
    answer: 135
    wrong:
      - value: 145
        feedback: |
          That subtracts 622, the year of the Hijra, instead of 632, the year of the death.
      - value: 1399
        feedback: |
          That adds the two years instead of finding the gap between them.
    hint: "Both are CE years: subtract the earlier from the later."
    explanation: |
      767 - 632 = 135 years. Ibn Ishaq was working from reports passed on by people who were themselves a generation or two removed from the prophet. Ibn Hisham, who edited him, died in 833, which is 833 - 632 = 201 years after the death.

  - type: order
    id: timeline
    title: "Who wrote when?"
    prompt: "Put these in order, earliest first (CE years of death)."
    steps:
      - "Muhammad dies in Medina (632)"
      - "Ibn Ishaq, author of the first great biography, dies (767)"
      - "Al-Waqidi, historian of Muhammad's campaigns, dies (823)"
      - "Ibn Hisham, editor of Ibn Ishaq, dies (833)"
      - "Ibn Sa'd, author of a large biographical dictionary, dies (845)"
    hint: "All are CE years, so smaller numbers come first."
    explanation: |
      632, 767, 823, 833, 845. Every one of the great Arabic biographies we have was written after the Abbasid dynasty took power in 750. That does not make them false, but it means the reader must ask who preserved what, and for whom.

  - type: text
    id: waqidi
    title: "Al-Waqidi, Ibn Sa'd and the hadith critics"
    body: |
      **Al-Waqidi** (born in Medina about 747, died 823) wrote a *Book of Campaigns* (*Kitab al-Maghazi*) on Muhammad's military expeditions, building on Ibn Ishaq and adding detail that Ibn Ishaq lacks. His student and secretary **Ibn Sa'd** (784 or 785 to 845) wrote the *Great Book of Generations* (*Kitab al-Tabaqat al-Kabir*), a biographical dictionary whose first volumes are a life of the prophet and whose later ones list his companions and the scholars who followed.

      Medieval Muslim scholars themselves were critical of al-Waqidi: al-Shafi'i, a founder of one of the law schools, is reported to have called his books lies, though some later scholars accepted him for battle narratives. Patricia Crone, a modern historian, added a different worry: when a later author supplies precise details that earlier authors lack, the precision may be a sign of invention, not of better memory. Here believers and historians can agree on the question (how reliable is a given reporter?) while disagreeing on the answer.

  - type: mcq
    id: lost-original
    title: "What a lost original costs"
    prompt: |
      We read Ibn Ishaq through Ibn Hisham, who abbreviated and annotated him, and Ibn Hisham died about two centuries after Muhammad. According to a careful historian, what does this fact allow us to say?
    options:
      - text: "That we cannot be sure how closely the surviving text matches what Ibn Ishaq wrote, and that Ibn Ishaq himself is a link in a chain of earlier reports; so claims need support from other sources where possible."
        correct: true
        feedback: |
          Right. It is a limit on certainty, not a verdict. Other students of Ibn Ishaq preserved parts of his text, and scholars compare them to see what Ibn Hisham changed.
      - text: "That everything in the sira is therefore false."
        feedback: |
          A gap in transmission raises a question; it does not answer it. Only checking each report, against others, can show which are early.
      - text: "That the lost original proves the biography was deliberately hidden."
        feedback: |
          Most ancient books are lost because copies were not made or kept. Nothing in the loss itself points to concealment.
    explanation: |
      Two separate worries are mixed in this case: transmission (how well did the text survive?) and source (how good were the reports Ibn Ishaq used?). Historians keep them apart.

  - type: text
    id: outside
    title: "Voices from outside, within a generation"
    body: |
      If the Muslim biographies are late, are there earlier witnesses? A few, written by non-Muslims, mostly in Greek, Syriac and Armenian.

      The **Doctrina Jacobi**, a Greek text of a debate between Jews and a Jewish convert to Christianity, is set in July 634 and, according to most scholars, was composed about then (a few argue for a later date). In one scene a Jew reports that a prophet has appeared among the *Saracens* (the Greek word for Arabs), and a learned old man answers that a true prophet does not come armed with a sword. In essence: someone is claimed as a prophet, he fights, and outsiders are suspicious, within two years of the traditional death.

      The Armenian history attributed to **Sebeos** (scholars debate the author; the work was finished after 661, since it runs to the end of the first Arab civil war, and includes a short biography of Muhammad) tells how a merchant called Mahmet (Muhammad) presented himself as a preacher, taught the people to worship the God of Abraham, and gathered the descendants of Ishmael. This broadly fits the tradition, but the account is brief and differs in details.

  - type: mcq
    id: outside-use
    title: "How much do outside voices prove?"
    prompt: |
      The Doctrina Jacobi and Sebeos name a prophet-leader of the Arabs within about a generation of 632. What can a historian reasonably conclude, and what not?
    options:
      - text: "That a leader called Muhammad was known to outsiders very soon after the traditional date. They do not give his life in detail, they come from observers who were not Muslims, and they themselves have debated dates."
        correct: true
        feedback: |
          Yes. They are valuable because they are early and independent of the Muslim sira, and limited because they are short and second-hand.
      - text: "That the Muslim biographies are therefore proved correct in every detail."
        feedback: |
          A few outside sentences cannot confirm a long biography. They support the outline and say little about the details.
      - text: "Nothing at all, since outsiders were hostile and so unreliable."
        feedback: |
          Hostile or distant witnesses are still evidence; the historian reads them critically, as with every source. Their value is that they are not shaped by the Muslim community's later needs.
    explanation: |
      The principle: an independent source, even a brief and unfriendly one, can be worth more for what it confirms than a rich source whose independence cannot be tested. It cannot make up for the detail it lacks.

  - type: text
    id: material
    title: "Coins and stone"
    body: |
      Material evidence is early and cannot be rewritten by later copyists. In the 680s, in Iran, governors struck silver coins on the Sasanian model (the Persian pattern, with a royal bust) and added in Arabic, on the rim, "In the name of God, Muhammad is the messenger of God"; one such coin from Bishapur, catalogued in the British Museum's collection by John Walker, is dated 66 in the Muslim calendar (685 to 686 CE). Whether it is the very first with the phrase is not settled.

      The **Dome of the Rock** in Jerusalem, completed in 72 in the Muslim calendar (691 to 692 CE) under the caliph Abd al-Malik, carries long inscriptions inside it. According to the standard account they include the earliest surviving inscriptions proclaiming Islam and the prophet Muhammad, and passages from the Qur'an about Jesus. The date is read by most historians as the year of completion; some read it as the year construction began.

      So within 60 years of 632, Muhammad's name is a public symbol on coins and in stone. That fixes him as a historical presence, though not as the figure of any detailed biography.

  - type: text
    id: debate
    title: "A sceptical turn: Wansbrough, Crone and Cook"
    body: |
      In the 1970s some Western historians pressed a stronger scepticism. **John Wansbrough** (1928 to 2002) argued in *Quranic Studies* (1977) and *The Sectarian Milieu* (1978) that the classical narratives of Islam's origins were literary: a "salvation history" shaped, like the Old Testament's, to give a community an origin, with a small historical core, and with the Qur'an fixed only in the eighth or ninth century. In the same year **Patricia Crone and Michael Cook** published *Hagarism*, which built an account from the non-Muslim sources of the seventh century, arguing that the early movement was inspired by Jewish messianism and differed greatly from the traditional picture.

      The works were provocative and much debated. Later scholarship rejected the dating of the Qur'an that Wansbrough proposed, since manuscripts of the Qur'an have been radiocarbon-dated to the seventh century (the next lesson returns to this). Crone and Cook themselves later withdrew many of the claims of *Hagarism*, while Crone still held that the classical tradition was not a simple record.

  - type: mcq
    id: debate-card
    title: "What did the sceptics claim?"
    prompt: |
      According to Wansbrough, why should a historian be cautious about the classical Muslim narratives of Muhammad's life?
    options:
      - text: "Because he held they were shaped by later communities as a story of origins, comparable to salvation history elsewhere, and so contain only a small historical core that is hard to separate out."
        correct: true
        feedback: |
          That is his argument, as scholars report it. It is a thesis about the literary nature of the sources, which others contest.
      - text: "Because he proved that Muhammad never existed."
        feedback: |
          Wansbrough did not make that claim. His doubt was about how much of the detailed story is reliable, not about whether a leader existed. A few other scholars have proposed stronger theses, which are widely rejected.
      - text: "Because he showed that the Qur'an was written during Muhammad's lifetime."
        feedback: |
          It is the opposite: he dated the fixing of the Qur'an to the eighth or ninth century, a dating many later scholars reject because of early manuscripts.
    explanation: |
      A sceptical thesis can be useful even when it is mostly wrong, because it forces others to say exactly what evidence supports their dating. Wansbrough's critics did that, using manuscripts, coins and the chains of transmission.

  - type: text
    id: recovery
    title: "A different turn: dating the traditions"
    body: |
      Other historians argued that the early material can be partly recovered. **Fred Donner**, in *Narratives of Islamic Origins* (1998), asked what concerns shaped the earliest Muslim historical writing (prophecy, community, leadership) and argued that the Qur'an text is early and that early Muslim historical writing reflects the community's later concerns. In *Muhammad and the Believers* (2010) he proposed that Muhammad led a movement of "Believers" which included pious Jews and Christians, and which only slowly became a separate religion; Crone replied that the direct evidence for that was thin.

      **Harald Motzki** (1948 to 2019) studied the *isnad* (the chain of named transmitters attached to a report) together with the *matn* (its text). He argued that when the same report appears in several collections with different chains, the overlap shows a common source that can be dated, in some cases to the first Muslim century. His sample from the collection of Abd al-Razzaq led him to judge that collection credible as a source of early reports, a conclusion disputed by sceptics. He wrote on *The Biography of Muhammad: The Issue of the Sources* (2000).

  - type: mcq
    id: debate-sides
    title: "Two ways to work"
    prompt: |
      Suppose a report about Muhammad appears in three separate collections, each with a different chain of transmitters, yet with nearly the same wording. How might Motzki and a sceptic read this differently?
    options:
      - text: "Motzki would say the overlap suggests an older common source behind the three chains; a sceptic might reply that the chains themselves could have been made up later to look independent."
        correct: true
        feedback: |
          Yes. The disagreement is about whether chains are evidence or decoration. Both sides accept the same facts about the texts and weigh them differently.
      - text: "Both would agree it must be a forgery, since three versions never match."
        feedback: |
          Neither says so. Similar wording across independent chains is exactly what Motzki treats as a sign of an old source.
      - text: "Both would agree the report is certainly authentic, because it appears more than once."
        feedback: |
          The sceptic's point is that repetition could come from copying or deliberate invention, so repetition alone does not settle it.
    explanation: |
      This is the core method disagreement in the field. It is not a disagreement about faith but about how to weigh evidence, which is why believing and non-believing historians appear on both sides.

  - type: text
    id: medina
    title: "A document inside the sira: the Constitution of Medina"
    body: |
      Inside Ibn Hisham's biography is a short text, nearly without narrative, which scholars call the **Constitution of Medina** (or the *sahifa*, "document"). It sets out terms of a community in Medina: the believers, from different clans, form one group (*umma*) distinct from others; the groups of Medina, including Jewish clans, have defined obligations; fighting among them is regulated. It is also preserved separately, in the *Book of Revenues* (*Kitab al-Amwal*) of Abu Ubayd.

      Unlike most of the sira, it has no chain of narrators, so by the Muslim tradition's own tests it would not rank as well supported. Yet many historians see its terse, practical style, its language and its lack of later themes as signs of an early document, and date it to about 622 to 624. R. B. Serjeant argued it is a collection of eight distinct agreements from the first years in Medina; others see one text. Scholars like W. Montgomery Watt placed it near 622.

  - type: mcq
    id: medina-card
    title: "Using the document"
    prompt: |
      The Constitution of Medina has no isnad, yet many historians treat it as early. Which reasoning behind that treatment is sound?
    options:
      - text: "Historical documents can be judged by their content and form: a practical text unlike later storytelling, and with terms that later writers would have little reason to invent, may be early even without a chain."
        correct: true
        feedback: |
          Yes. This is how historians treat charters and treaties of any period. The conclusion is a probability, and the single versus several documents question remains debated.
      - text: "Any text inside Ibn Hisham must be authentic, because he was an editor."
        feedback: |
          Editing does not guarantee authenticity. The case for this text rests on its own features, not on its container.
      - text: "A text without a chain must be a later fabrication, because chains are the only test of age."
        feedback: |
          That treats the Muslim tradition's tool as the only possible tool. Historians also use language, content and coherence, as they do for non-Muslim and ancient texts.
    explanation: |
      Note the pattern: the same document is read by believers as part of the prophet's practice in Medina and by historians as a possible early source, and these two readings do not exclude each other.

  - type: text
    id: frames
    title: "Two frames, kept visible"
    body: |
      A Muslim reader holds that the sira records the life of a messenger of God, that the transmitters were pious and carefully tested, and that the tradition's account is reliable in its main lines. The historian asks a different question that does not require denying that: *what independent evidence confirms each part?* Where outside texts, coins, stone and the Qur'an itself agree with the tradition, the historian is confident. Where only the later biographies speak, the historian says "according to the tradition" and keeps the claim open.

      These frames can sit side by side. A believer can welcome a historian's finding that the Dome of the Rock names Muhammad in 692; a historian can recognise that the tradition's dense memory of a community is itself a historical fact needing explanation. They part ways on one premise: whether the tradition's own testimony counts as evidence by itself.

  - type: mcq
    id: frames-card
    title: "Where the frames part"
    prompt: |
      Two readers study the same oldest biography. One says "it is reliable because the transmitters were pious and tested." The other says "I rely on it only for what outside or material evidence confirms." Where exactly do they differ?
    options:
      - text: "In how much weight the tradition's own testimony carries alone; they can agree on the facts about the texts, and on the many points where outside evidence and the tradition agree."
        correct: true
        feedback: |
          Right. The disagreement is about the standard of evidence, not about what the books say. It also shows why the historian's silence on revelation is a method, not a denial.
      - text: "In whether Muhammad existed; the historian doubts it and the believer does not."
        feedback: |
          Most historians accept that he lived. The doubt in the debate is about how much of the detailed biography can be confirmed.
      - text: "In nothing; the two approaches always give the same results."
        feedback: |
          They overlap on the outline but can differ on details and on dates, as the sceptical and recovery schools show.
    explanation: |
      Naming the premise at which views split is the aim of this course: here, whether a community's own early memory counts as evidence on its own, or needs outside confirmation.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the source Muslims hold above every biography is the Qur'an itself. In the lesson The Qur'an: Revelation and Compilation we ask how it is said to have come, how it was collected under the caliph Uthman, what the oldest manuscripts show, and what the variant readings are.
