id: ch16-challenge-2
title: "Level Challenge: Reading the Qur'an Fairly (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: fire, wine and a closing weighing"
    body: |
      Part 2 stands alone. Problem 4 has two halves: a laboratory scene (invented) for the old dispute between al-Ghazali and Averroes, and a drink (invented) for how jurists reason. Problem 5 weighs the whole level. Every claim is made *according to* someone, and labelled:

      - **[H] The historian's tools**: dates, texts, who depended on whom. They yield *more or less probable*, never *proved*.
      - **[M] The Muslim reading**: according to Muslims the Qur'an is God's speech and the Prophet's example guides the community; classical scholars read both with learning, and many also use [H] tools.
      - **Three layers**: (1) established fact, (2) scholarly consensus or live debate, (3) faith or metaphysical commitment. A claim never moves up a layer by being repeated.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      - **Ghazali** (1058 to 1111; some sources say 1056), jurist and theologian. About 1095 he wrote *The Incoherence of the Philosophers*: twenty discussions (sixteen on metaphysics, four on natural science) and three charges of unbelief (the world has no beginning; God knows only kinds, not particular events; no bodily resurrection). On causes he denied **necessity** between what we call cause and effect, not the regularity.
      - **Avicenna** (about 980 to 1037), the philosopher Ghazali argued against, who distinguished the **necessary** being (God) from **contingent** things.
      - **Averroes** (Ibn Rushd, 1126 to 1198), judge and philosopher of Cordoba, who answered in *The Incoherence of the Incoherence* (about 1180). Denying real causes, he argued, undermines knowledge, which is knowing things through their causes.
      - **Sources of law.** Classical Sunni jurists use four: the Qur'an, the sunna (the Prophet's example, preserved in hadith), consensus (*ijma*) and analogy (*qiyas*). In analogy a ruling is carried from a text to a new case that shares its reason (*illa*). Twelver Shia jurists use the Qur'an, the sunna (including the reports of the Imams), consensus, and **reason** (*aql*) in place of analogy.

  # ---------------- Problem 4, first half ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · A flame and a ball of cotton"
    body: |
      **Problem 4.** In an invented laboratory, a technician, Dr. Amal, holds a ball of dry cotton in a flame, and the cotton burns. She repeats it 1,000 times with 1,000 fresh balls and gets 1,000 burnings. A student asks: "Does that show that the fire *has to* burn the cotton?"

      The task: say what a follower of al-Ghazali and a follower of Averroes would each answer, whether any experiment could separate them, and where each claim sits among the three layers.

  - type: numeric
    id: p4-metaphysics
    title: "How much of the Incoherence is metaphysics?"
    prompt: |
      Al-Ghazali's *Incoherence of the Philosophers* has twenty discussions: sixteen on metaphysics and four on natural science. What percentage of the discussions are on metaphysics?
    answer: 80
    wrong:
      - { value: 16, feedback: "16 is the count of metaphysics discussions, not the percentage. The percentage is that count divided by the total of 20, times 100." }
      - { value: 20, feedback: "20 is the total number of discussions, and 4 of 20 would be 20%, the natural science share. The question is about the other 16." }
    hint: Divide 16 by 20 and multiply by 100.
    explanation: |
      $$\frac{16}{20}\times 100 = 80\%$$
      The causation discussion (the seventeenth) is one of the four on natural science, a point worth remembering: the dispute over fire is about nature, but its premises are about God and about what a cause is.

  - type: mcq
    id: p4-ghazali
    title: "What does Ghazali say about the 1,000 burnings?"
    prompt: |
      Dr. Amal's 1,000 burnings are in front of us. According to al-Ghazali, which statement is correct?
    options:
      - text: "The 1,000 burnings are real and can be relied on. What we observe is one event after another; the claimed necessity linking them is not observed. According to him God's will is the real cause, and God could act otherwise, which is why miracles are possible."
        correct: true
        feedback: |
          Yes. He accepts the regularity and denies that it is a necessity in the things themselves. How far he held occasionalism (that created things have no causal power at all) is debated among scholars; what he clearly denied is necessity.
      - text: "The 1,000 burnings are illusions, since nothing in nature ever behaves the same way twice."
        feedback: |
          He did not deny regularity. God's habit, in his view, is consistent, and that is what makes prediction possible.
      - text: "The burnings prove that fire has the power to burn cotton by its own nature, so miracles must be impossible."
        feedback: |
          That is closer to the view he opposed. For him the experiments do not show a necessity, and the possibility of miracles is exactly what he wished to protect.
    explanation: |
      [M] with a philosophical argument: the premise is that God's freedom must not be bound by a necessity in created things. The regularity is layer one; whether it rests on necessity or on God's habit is layer three.

  - type: mcq
    id: p4-averroes
    title: "What does Averroes reply?"
    prompt: |
      A student quotes al-Ghazali: "The experiment shows only succession, not necessity." According to Averroes, which reply is his best?
    options:
      - text: "If created things have no real power of their own, then nothing can be known through its causes, and knowledge, understood as knowing things through their causes, is undermined. Fire does burn because it has a nature, though God remains the first cause."
        correct: true
        feedback: |
          Yes. Defenders of al-Ghazali answer that regularity gives all the knowledge science needs; the two sides then disagree about what "knowing" requires.
      - text: "God does not exist, so the burnings must have natural causes."
        feedback: |
          Averroes was a believer; he held God to be the first cause and also held that created causes are real. His quarrel with al-Ghazali was inside belief.
      - text: "Experiments are unreliable, so the 1,000 burnings prove nothing."
        feedback: |
          Averroes trusted the study of nature. His complaint was that denying real causes leaves experiments with nothing to be about.
    explanation: |
      The dispute is a clash of two premises, both held by believers: for al-Ghazali, God's freedom is not to be bound by necessity; for Averroes, a world without real causes cannot be known.

  - type: mcq
    id: p4-evidence
    title: "Could any experiment separate them?"
    prompt: |
      Dr. Amal is asked: "Is there a further experiment that could show whether the burning rests on a necessity in the fire, or on God's habit?" Which answer is the most careful?
    options:
      - text: "Both views predict the same 1,000 burnings, so counting more cannot separate them. What would count as evidence is a philosophical argument (about what a cause is, or what knowledge needs), not a laboratory result. A report of fire failing to burn would be a different matter: it would be handled as a claim about a miracle or an error."
        correct: true
        feedback: |
          Yes. When two views make the same predictions, data cannot choose between them. That is why the dispute has lasted: it is layer three, argued by reasons, not decided by instruments.
      - text: "Yes: the more burnings, the more likely al-Ghazali is wrong."
        feedback: |
          A larger number of burnings fits both. Al-Ghazali expected the regularity; he did not predict exceptions to it.
      - text: "No, because science and religion cannot be discussed together."
        feedback: |
          They can, as the dispute itself shows: both men were learned in both. The point is narrower: this question is metaphysical, so it needs arguments, not a thermometer.
    explanation: |
      Compare the lesson on miracles and the laws of nature: whether an exception would be a miracle or a measurement error is a question with its own evidence and its own priors. The fire-and-cotton question, though, is not about exceptions at all.

  - type: mcq
    id: p4-hume
    title: "Is this just Hume?"
    prompt: |
      The philosopher David Hume argued that we observe one event following another but never the necessary connection between them. A student says: "So al-Ghazali was Hume in a turban." Which reply is fair?
    options:
      - text: "The two share the point that observation shows succession, not necessity, and scholars compare them, but they disagree on how close they are. Hume asked what reason can know, and his argument fed scepticism about religion; al-Ghazali's argument served God's power and the possibility of miracles."
        correct: true
        feedback: |
          Yes. The same observation is put to opposite uses, and that is a good reason not to treat a shared argument as a shared conclusion.
      - text: "They are the same argument with the same conclusion, 750 years apart."
        feedback: |
          The shared step is real, but the conclusions differ: one is a defence of divine action, the other a limit on what reason can know. Scholars also dispute how far the arguments match.
      - text: "They have nothing in common, since one was a believer and the other a sceptic."
        feedback: |
          Overcorrected. Both noticed that necessity is not seen. The comparison is disputed, not empty.
    explanation: |
      [H]: the history of an idea is a fact; whether two arguments are the same is a live debate among scholars.

  - type: mcq
    id: p4-double
    title: "Two truths?"
    prompt: |
      A student says: "Averroes believed in a 'double truth': something true in religion and false in philosophy." What is the fair reply?
    options:
      - text: "He is usually read as saying the opposite: that scripture and demonstration, rightly understood, do not contradict, and where the literal sense of a text clashes with demonstration, the text is to be read by interpretation (*ta'wil*). The 'double truth' label is a later misattribution."
        correct: true
        feedback: |
          Yes. In his *Decisive Treatise* (1178) he argues that philosophy and law are compatible and that interpretation is the means. Whether his own proposal convinces every Muslim is another matter; many classical scholars thought it went too far.
      - text: "He said so openly in the *Decisive Treatise*, which gives two sets of truths for two classes of readers."
        feedback: |
          He distinguished readers by their training, but he did not say that two contradictory truths exist. The word 'double' misleads.
      - text: "He never wrote about the relation of religion and philosophy."
        feedback: |
          He wrote about little else in that treatise. The point is what he said, not whether he spoke.
    explanation: |
      A misattribution is a layer-one question about what a text says; whether his solution works is layer two or three.

  - type: mcq
    id: p4-rival
    title: "Who else was in the room?"
    prompt: |
      Al-Ghazali and Averroes were not the only Muslim voices on causation. Which statement is fair?
    options:
      - text: "Avicenna, whom al-Ghazali opposed, held that created things have real causal roles within a chain that depends on the necessary being. Al-Ghazali's own view is read in different ways: some scholars read him as an occasionalist, others as presenting occasionalism as one option alongside created causes acting by God's will."
        correct: true
        feedback: |
          Yes. 'The Muslim view' of causation does not exist: classical Muslims held several, and even one thinker is read in more than one way.
      - text: "All classical Muslim thinkers held the same view of causation, since the Qur'an settles it."
        feedback: |
          The scholars quoted the same scripture and differed. A text rarely settles a philosophical question on its own.
      - text: "Only al-Ghazali was a believer; the philosophers had left Islam."
        feedback: |
          Avicenna and Averroes were Muslims, and Averroes was also a judge. Al-Ghazali charged some of Avicenna's teachings with unbelief, but the philosophers saw themselves as inside the tradition.
    explanation: |
      [H]: who held what is a question for texts. [M]: whether the charge of unbelief was fair is a judgement by a tradition, which not all Muslims shared.

  - type: numeric
    id: p4-gap
    title: "How long between the books?"
    prompt: |
      Al-Ghazali wrote the *Incoherence of the Philosophers* about 1095, and Averroes wrote the *Incoherence of the Incoherence* about 1180. How many years apart are they?
    answer: 85
    wrong:
      - { value: 87, feedback: "87 is 1198 minus 1111, the gap between the two men's deaths. The question is about the two books, about 1095 and 1180." }
      - { value: 54, feedback: "54 is 1180 minus 1126, the gap between the birth of Averroes and his book. The question compares the two book dates." }
    hint: Subtract 1095 from 1180.
    explanation: |
      $$1180-1095=85\text{ years}$$
      The first answer to al-Ghazali came from a man born 31 years after the *Incoherence* was written, so the debate went on through books, not conversation.

  # ---------------- Problem 4, second half ----------------
  - type: text
    id: p4b-setup
    title: "Problem 4, second half · A new drink"
    body: |
      Now the law. In an invented town a merchant sells **sahar**, a drink of fermented honey that intoxicates, and a second drink, **ruman**, a red juice that does not. A Sunni jurist and a Twelver Shia jurist are asked whether the Qur'an's ruling on wine reaches either drink.

      The task: how each would reason, and what stays disputed.

  - type: mcq
    id: p4b-sunni
    title: "Reasoning by analogy"
    prompt: |
      A classical Sunni jurist holds that the Qur'an forbids wine and finds the reason (*illa*) of the ruling in intoxication. Which conclusion follows by *qiyas* (analogy) for sahar and ruman?
    options:
      - text: "Sahar falls under the same ruling because it shares the reason, intoxication; ruman does not, since it lacks the reason. Looking red like wine is not the reason."
        correct: true
        feedback: |
          Yes. The method asks what the text's reason is and checks whether the new case has it. The step of naming the reason is where critics and defenders argue: the jurists, not the verse itself, state it.
      - text: "Both are forbidden, since both are drinks served in the same way as wine."
        feedback: |
          Resemblance of use is not the reason. Analogy needs the ruling's own reason, here intoxication, and ruman lacks it.
      - text: "Neither is forbidden, since the Qur'an names only wine."
        feedback: |
          The majority tradition held that the texts could not name every case, which is why analogy was accepted. A strict naming rule would leave a growing empire without rulings.
    explanation: |
      [M] method, [H] description of the method: Sunni jurists took qiyas as the fourth source after the Qur'an, the sunna and consensus.

  - type: mcq
    id: p4b-shia
    title: "Reason in place of analogy"
    prompt: |
      A Twelver Shia jurist uses the Qur'an, the sunna (which includes the reports of the Imams), consensus, and reason (*aql*). Which statement about the list is correct?
    options:
      - text: "Aql takes the place that qiyas holds in the Sunni list. It does not simply permit anything: it is disciplined reasoning, and many Shia jurists would also lean on the Imams' reports for the case at hand."
        correct: true
        feedback: |
          Yes. The two lists differ in their fourth item and in what counts as sunna, and they often reach similar rulings on a case like sahar. How they get there differs, and the difference reflects different views of authority.
      - text: "Aql means each believer may decide by personal taste, so Shia law has no method."
        feedback: |
          Reason in this sense is a trained method, used by qualified jurists (*mujtahids*), not taste.
      - text: "Shia jurists reject the Qur'an in favour of the Imams."
        feedback: |
          They begin with the Qur'an. The Imams' reports are a second source, and they are what a Shia jurist treats as the sunna.
    explanation: |
      Where does authority lie? Sunnis lean on the Companions and scholars' consensus; Twelver Shia lean on the infallible Imams and on reason. A historian asks how early each report goes back; a believer asks what guidance God has secured.

  - type: numeric
    id: p4b-gap
    title: "How long after the Prophet?"
    prompt: |
      The founders of the four Sunni schools died in different years: Abu Hanifa in 767, Malik in about 795, al-Shafi'i in 820 and Ahmad ibn Hanbal in 855. The Prophet died in 632. How many years after the Prophet's death did the last of these four die?
    answer: 223
    wrong:
      - { value: 88, feedback: "88 is 855 minus 767, the span between the first and last of the four founders' deaths. The question measures from the Prophet's death in 632." }
      - { value: 135, feedback: "135 is 767 minus 632, the gap for Abu Hanifa, the earliest of the four. The question asks about the last, Ahmad ibn Hanbal." }
    hint: Subtract 632 from 855.
    explanation: |
      $$855-632=223\text{ years}$$
      The schools thus took shape across more than two centuries, which is why a fair account calls fiqh a tradition of reasoning built up over time.

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-setup
    title: "Problem 5 · Weighing Islam and the Qur'an fairly"
    body: |
      **Problem 5.** A reader finishes Level 16 and says: "Everything about Islam is either history or belief, and it is easy to tell which." The task is to test this against the whole level: sort claims by layer, say what would count as evidence for each, and say where thoughtful Muslims, historians and sceptics part ways and why.

  - type: mcq
    id: p5-facts
    title: "Which claims are layer one?"
    prompt: |
      Select all the claims that are established fact (layer one), as the level presented them.
    multiple: true
    options:
      - text: "A radiocarbon test dated the animal skin of the Birmingham Qur'an leaf to 568 to 645 CE at 95.4% probability."
        correct: true
        feedback: |
          Yes: a laboratory result on the skin. It does not date the writing by itself.
      - text: "In the 2013 Pew report, at least half of Muslims said humans and other living things evolved over time in 13 of the 22 countries asked."
        correct: true
        feedback: |
          Yes: a survey result, with the countries named. It does not say what Islam teaches, only what those Muslims answered.
      - text: "Al-Ghazali wrote about 1095 a book with twenty discussions attacking the philosophers."
        correct: true
        feedback: |
          Yes: what a book says and roughly when it was written are matters of record.
      - text: "The Qur'an is God's speech, word for word."
        feedback: |
          According to Muslims, yes, and that is a commitment (layer three). A manuscript cannot show it either way.
      - text: "The common link of a hadith chain is the person who made up the saying."
        feedback: |
          According to Schacht, often so; according to Motzki, not necessarily. That is a live debate (layer two), not a fact.
    explanation: |
      Layer one is what data and texts show on their own. Notice that none of the three facts says what the data mean: each needs a further argument, which is where layers two and three begin.

  - type: mcq
    id: p5-debate
    title: "Which claims are layer two?"
    prompt: |
      Which of these is a scholarly debate (layer two), as the level presented it?
    options:
      - text: "How much of the traditional biography of Muhammad can be confirmed, given that Ibn Ishaq, the author of the earliest surviving full biography, died in 767, about 135 years after the Prophet."
        correct: true
        feedback: |
          Yes. The first phrase is a fact and the question of how much can be confirmed is a live debate: Wansbrough, Donner, Motzki and others differ.
      - text: "Whether the sacrificed son in Qur'an 37 was Isaac or Ishmael is a matter of revelation, so no historian may discuss it."
        feedback: |
          Historians discuss how early Muslims read it: the son is unnamed in the verses, early scholars such as al-Tabari and Ibn Qutayba read Isaac, and most Muslims now read Ishmael. The reading is a layer-two question; whether God commanded it is layer three.
      - text: "Whether God sent the Qur'an to the Prophet."
        feedback: |
          That is layer three, a faith or metaphysical commitment. Historians study the text's history; they do not claim to settle its origin in God either way.
    explanation: |
      Layer two is where qualified, informed people disagree about evidence. The test: could further evidence move the question? New manuscripts could, for Muhammad's biography; no manuscript could settle whether the Qur'an is revealed.

  - type: mcq
    id: p5-evidence
    title: "What would count as evidence?"
    prompt: |
      Match the kind of evidence to the question it could affect. Select the correct pair.
    options:
      - text: "A new dated manuscript could affect the history of the Qur'anic text; a newly found chain of narrators could affect how a hadith is graded; neither can decide whether the Qur'an is God's speech, which is argued on grounds outside the manuscript, for example a person's view of the text's beauty or of their own experience."
        correct: true
        feedback: |
          Yes. Evidence is relative to the question: each layer has its own kind. A claim about revelation is held on grounds beyond what a manuscript shows, as the level said for believers and sceptics alike.
      - text: "A new dated manuscript would settle whether the Qur'an is God's speech."
        feedback: |
          A date can limit when a text existed. It cannot show its source, so it answers a layer-one question and leaves layer three where it was.
      - text: "Nothing could count as evidence for anything about Islam, so every claim is a matter of opinion."
        feedback: |
          Overcorrected. A date, a chain or a survey is evidence for its own question, and the layers exist to keep these questions apart.
    explanation: |
      The same logic ran through the level: the leaf, the chain, the verse and the fire each had a kind of evidence that fitted one question and not another.

  - type: mcq
    id: p5-parting
    title: "Where do people part ways?"
    prompt: |
      A believing Muslim scholar, a secular historian and a sceptic read the same early manuscript and the same hadith collections. According to the level, where is the likeliest place for their conclusions to differ?
    options:
      - text: "In the premises each brings (for example whether revelation is possible), in the values attached (what a tradition's long authority is worth) and in the kinds of evidence each finds weighty (a chain of transmitters, a manuscript date, a personal experience). The facts they all accept can be the same."
        correct: true
        feedback: |
          Yes. The level showed the same pattern at every point: shared data, different premises, values and weights of evidence.
      - text: "In the facts: believers do not accept laboratory dates and sceptics do not accept any texts."
        feedback: |
          Many Muslim scholars accept and use radiocarbon dating and manuscript criticism, and many sceptics read the tradition's texts closely. The split is rarely about whether a date is a date.
      - text: "In intelligence: the side with the better argument is plain to see."
        feedback: |
          Informed people on every side differ; calling the others unintelligent is a way to skip the premise that separates them.
    explanation: |
      [H] and [M] can work side by side on layer one. Their disagreements come at layers two and three, and a fair summary names which premise, value or kind of evidence it is.

  - type: mcq
    id: p5-fair
    title: "A fair summary"
    prompt: |
      Which closing sentence about the Qur'an and its history would a Muslim scholar, a historian and a sceptic each be able to call fair?
    options:
      - text: "Radiocarbon dates the skin of early manuscripts, and some leaves fall within a few decades of the Prophet's death; historians debate what that implies for the text's earliest form; Muslims hold on other grounds that the text is God's speech, and a manuscript date cannot settle that either way."
        correct: true
        feedback: |
          Yes. It names the facts, says where the debate is, and says where a commitment begins without arguing for or against it.
      - text: "Radiocarbon proves the Qur'an is exactly as it was in the Prophet's day."
        feedback: |
          Dating the skin proves neither completeness nor wording, and the claim pushes a layer-two question up to layer one.
      - text: "Since the sources are late, nothing can be known about early Islam, and Muslims who believe otherwise are mistaken."
        feedback: |
          This denies the evidence that exists (inscriptions, coins, manuscripts, early texts) and also pronounces on the commitment, which is not decided by the sources either.
    explanation: |
      A fair summary has three parts: what the evidence shows, what is argued among informed people, and where faith begins.

  - type: order
    id: p5-order
    title: "Order the Level 16 events"
    prompt: "Put these in order of date, earliest first (the Muslim tradition's dates where the event is given by the tradition)."
    steps:
      - "The Hijra (migration to Medina), 622"
      - "The Prophet's death, 632"
      - "The Mihna begins under al-Ma'mun, 833"
      - "Ahmad ibn Hanbal dies, 855"
      - "Al-Ghazali's Incoherence, about 1095"
      - "Averroes's Incoherence of the Incoherence, about 1180"
    hint: The Prophet's death is 632, ten years after the Hijra.
    explanation: |
      Gaps: $632-622=10$, $833-632=201$, $855-833=22$, $1095-855=240$, $1180-1095=85$ years. The debates of the level run over more than five centuries from the Prophet to Averroes ($1180-632=548$).

  - type: text
    id: summary
    title: "What you now own"
    body: |
      The setting: the dispute over fire and cotton between al-Ghazali (died 1111) and Averroes (died 1198), the ways Sunni and Twelver Shia jurists reason, and the three layers applied to Islam and the Qur'an. Every claim is made *according to* someone.

      - **Ghazali against necessity.** The *Incoherence* has $20$ discussions, $16$ on metaphysics, so
      $$\frac{16}{20}=80\%$$
      are metaphysical. On causes he accepts the regularity and denies the necessity: fire burns cotton by God's habit, which God could set aside. Data cannot decide between his view and Averroes's, because both predict the same burnings.
      - **Averroes's reply.** Denying real causes undermines knowing things through their causes. The two books are about $1180-1095=85$ years apart. The 'double truth' label for Averroes is a later misattribution.
      - **Two ways to reason in law.** Sunni jurists use the Qur'an, the sunna, consensus and *qiyas*: carry a ruling to a new case that shares its reason (*illa*). Twelver Shia jurists use the Qur'an, the sunna including the Imams' reports, consensus and *aql* in place of *qiyas*. The last of the four Sunni founders died $855-632=223$ years after the Prophet.
      - **Three layers.** Layer one is data and texts (a dated skin, a survey, what a book says); layer two is informed debate (how much of the biography can be confirmed); layer three is commitment (that the Qur'an is God's speech). A claim never moves up a layer by being repeated.
      - **Where people part ways.** Over premises, values and kinds of evidence, not usually over whether a date is a date. A fair summary names the facts, the debate and where faith begins.

      Level 16 gave no verdict on whether Islam is true. It gave the questions: what does this text say, who says so, which layer, and what would count as evidence.

      **Next:** the Level Review replays this level's questions at spaced intervals. Then the next level, Hindu Thought, begins with the question of what the word Hinduism names at all.
