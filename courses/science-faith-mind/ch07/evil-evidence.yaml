id: ch07-evil-evidence
title: "The Evidential Problem of Evil"
kind: concept
own: |
  The setting: the **evidential problem of evil** does not say that God and evil contradict each other (the logical problem, answered by a possible story). It says the suffering we observe is *evidence* that makes God less probable. Write $G$ for "an all-powerful, all-knowing, wholly good God exists", $E$ for "suffering of the kind and amount we observe, such as a fawn burned in a forest fire and left to suffer for days", and $P(\cdot)$ for probability.
  - **Rowe's argument (1979).** A **pointless evil** is an evil that God, if God exists, could have prevented without losing an outweighing good or having to permit an equal or worse evil. According to Rowe, in his own later summary:
  {{ $$\text{1. Probably, there are pointless evils.}$$ }}
  and, as a premise most parties accept,
  {{ $$\text{2. If } G \text{ then there are no pointless evils.}$$ }}
  so probably $G$ is false. The fawn, whose suffering no free choice explains, is the test case.
  - **The weak joint.** Premise 1 rests on an inference: "we can think of no good that justifies this suffering, so probably there is none". It is only as strong as the reason to think that, if such a good existed, we would know of it.
  - **Skeptical theism (Wykstra, 1984).** One may say the inference fails: if there were a God-purposed good, we would probably not see it (we would not conclude "no fleas" from seeing no fleas, though we would conclude "no dog" from seeing no dog). The reply's price, according to Rowe (2006): the same doubt about what God knows and wants undercuts our reasons to expect, for instance, a life after death.
  - **The Bayesian form (Draper, 1989).** Compare $G$ with a rival, the hypothesis of indifference $I$ (no non-human person acts out of care for or malice toward sentient beings). Evidence favours $G$ or $I$ according to which makes $E$ more likely, in odds form:
  {{ $$\frac{P(G\mid E)}{P(I\mid E)}=\frac{P(E\mid G)}{P(E\mid I)}\cdot\frac{P(G)}{P(I)}$$ }}
  If $P(E\mid G)<P(E\mid I)$, the evidence lowers $G$; it need not be impossible on $G$, only less expected.
  - **Where people part ways.** On whether we can judge how likely $E$ is given $G$ (the skeptical theist says we cannot), on the prior $P(G)$ (other arguments, experience, faith), and on whether theism or indifference fits the pattern of pain and pleasure. Rowe himself held that a theist with other strong reasons can be rational (his "friendly atheism").
cards:
  - type: mcq
    id: hook
    title: "Guess: no reason in sight"
    prompt: |
      Guess before any theory. Lightning strikes a dead tree in a distant forest and a fire starts. A fawn is trapped, badly burned, and lies in agony for days before it dies. No one sees it, and no free choice of any person caused it. Suppose a very wise, powerful, perfectly good being could have prevented it, and you try hard but cannot think of any good that would be lost if it were prevented. Does your failing to find a reason say something about whether there is one?
    options:
      - text: 'It says something, but not everything: it is some evidence that there is no such reason, and how much depends on whether we would expect to see such a reason if it existed.'
        correct: true
        feedback: |
          This is the core of the whole debate. Both sides will accept the first half; they disagree about the second, whether we would expect to see the reason.
      - text: 'Nothing at all: whatever we cannot think of tells us nothing about what exists.'
        feedback: |
          Too strong. If you search a small room carefully for a lamp and find none, that really is evidence there is none. Failing to find something sometimes counts; the question is when.
      - text: 'It proves there is no reason, since we have looked as hard as we can.'
        feedback: |
          Too strong the other way. Our best effort may still be limited: a child who cannot think of why the doctor gives an injection has not shown there is no reason.
    explanation: |
      Hold on to your guess. This lesson is about an argument built on exactly this step, and about the two kinds of reply to it. Note the shift from the previous lesson: there the question was whether God and evil can be *consistent*; here it is how *probable* a good God is, given the suffering we see.

  - type: text
    id: rowe
    title: "Rowe's fawn"
    body: |
      According to Rowe himself, in 1979 **William L. Rowe** (1931-2015), a philosopher of religion at Purdue University, published "The Problem of Evil and Some Varieties of Atheism" (*American Philosophical Quarterly* 16, 1979). He chose a case of suffering that nobody chooses: a fawn horribly burned in a forest fire started by lightning, suffering terribly for days before death ends its life. In his later words, "unlike humans, fawns are not credited with free will", so the fawn's suffering cannot be blamed on a misuse of free will.

      This is the **evidential problem of evil**: not "God and evil cannot both exist", but "the evils we find make it unlikely that a good God exists". Rowe asks whether the fawn's suffering is a **pointless evil**: an evil that God, if God exists, could have prevented without thereby losing an outweighing good or having to permit an evil equally bad or worse.

  - type: mcq
    id: pointless-def
    title: "What is a pointless evil?"
    prompt: |
      In Rowe's sense, which of these is a **pointless evil** (assuming God exists)?
    options:
      - text: 'An evil that God could have prevented without losing some outweighing good and without having to permit an equal or worse evil.'
        correct: true
        feedback: |
          Yes. "Pointless" is not "meaningless to the sufferer" or "unexplained to us": it is about whether preventing it would have cost anything that outweighs it.
      - text: 'An evil whose purpose we cannot discover.'
        feedback: |
          That is an evil we do not *see* the point of. Rowe's definition is about whether a point exists, not whether we can find it; the whole debate is how to get from the first to the second.
      - text: 'Any evil that God did not prevent.'
        feedback: |
          Then every evil would be pointless by definition. On Rowe's definition, an evil God permitted *in order to* secure a greater good is not pointless, and the theist can say many evils are like this.
    explanation: |
      Notice that the definition leaves room for a theist: some evils may serve outweighing goods. The argument is about whether *all* the evils we see can be of that kind.

  - type: mcq
    id: p2
    title: "Why accept the second premise?"
    prompt: |
      Rowe's argument has a premise that says: if God exists (all-powerful, all-knowing, wholly good), then there are no pointless evils. According to Rowe, this premise is generally admitted to be true. Which reasoning best supports it?
    options:
      - text: 'A being who is all-knowing and all-powerful could prevent any evil at no cost, and a wholly good being would prevent an evil unless preventing it lost a greater good or let in an equal or worse evil. A pointless evil is by definition one where neither cost applies.'
        correct: true
        feedback: |
          Yes. The premise follows from the meanings of the words, which is why most of the debate is elsewhere.
      - text: 'Experience shows that good beings never allow suffering.'
        feedback: |
          Parents and doctors allow or cause suffering for good reasons all the time. The premise does not say good beings prevent *all* suffering, only all suffering that serves no outweighing purpose.
      - text: 'It is a fact about the universe that has been measured.'
        feedback: |
          The premise is conceptual: it spells out what an all-powerful, all-knowing, wholly good being would do. Measurements enter in the other premise.
    explanation: |
      So a critic of the argument will usually accept this premise and attack the other one, the claim that pointless evils probably exist.

  - type: order
    id: argument
    title: "Build Rowe's argument"
    prompt: |
      Put Rowe's reasoning in order, from the case to the conclusion.
    steps:
      - 'In the fawn case, no good we can think of seems to require God to permit that suffering, and none seems to require an equal or worse evil if it were prevented.'
      - 'So the fawn''s suffering is probably a pointless evil: probably there is no outweighing good that justifies it.'
      - 'Probably, then, there are pointless evils (the fawn is one example).'
      - 'But if God exists, there are no pointless evils.'
      - 'Therefore, probably God does not exist.'
    hint: Rowe first argues from the particular case to a probable premise, then applies the conditional that follows from what "God" means.
    explanation: |
      In Rowe's own later summary: "1. Probably, there are pointless evils. 2. If God exists, there are no pointless evils, therefore 3. Probably, God does not exist." The steps above unpack why he thinks the first line is probable. The conclusion follows from the two premises; the dispute is about whether the first is really probable.

  - type: mcq
    id: weak-joint
    title: "Where would a critic push?"
    prompt: |
      Rowe's support for "probably, there are pointless evils" is that we can think of no good that would justify the fawn's suffering. Which step is the most natural target for a critic who accepts that God would prevent pointless evils?
    options:
      - text: 'The step from "we can think of no justifying good" to "probably there is none": it assumes that if a justifying good existed, we would probably be able to think of it.'
        correct: true
        feedback: |
          Yes. This is the joint where the main reply, skeptical theism, pushes. Rowe's inference is an inductive one, and an induction is only as good as the sample: are the goods we can think of a fair sample of all goods?
      - text: 'The step from "no pointless evils if God exists" to "if no pointless evils then God exists".'
        feedback: |
          Rowe does not use that reverse direction. He argues only that if God exists there are no pointless evils, and that pointless evils probably exist.
      - text: 'The claim that the fawn really suffered.'
        feedback: |
          Almost no one disputes it. Some do question how much animals feel, but the argument can be run with any suffering that is real and not caused by a free choice.
    explanation: |
      Rowe's own phrase for the key premise is that we cannot "think of, or even imagine" a good that would justify the suffering. Whether our inability to imagine it is good evidence is the live question.

  - type: mcq
    id: dog-fleas
    title: "Dog or fleas?"
    prompt: |
      A philosopher, Stephen Wykstra, makes a point with a garage. You look into your garage and see no dog: you are entitled to conclude there is no dog. You look in and see no fleas: you are *not* entitled to conclude there are no fleas. What explains the difference?
    options:
      - text: 'If a dog were in the garage you would very probably see it; if there were fleas in the garage you would probably not see them. Not seeing something counts against it only when you would expect to see it if it were there.'
        correct: true
        feedback: |
          Yes. The principle is about *expectation of seeing*. Wykstra applies it to the fawn: if there were a good that God had in view for permitting it, would we expect to know of it?
      - text: 'Dogs are more likely to be in garages than fleas are.'
        feedback: |
          The prior chance is not the point; it is whether the search would have found the thing if it were there.
      - text: 'Fleas do not exist.'
        feedback: |
          They do, which is the point: they can be present and unseen.
    explanation: |
      According to Rowe's own account of Wykstra's reply (the paper dates from 1984), the claim is that our failure to see a justifying good is no reason to think there is none, because goods known to God are quite likely not knowable by us. If that is right, the failure to find one is what we should expect *whether or not* God exists.

  - type: mcq
    id: skeptical
    title: "Skeptical theism: a fair reply?"
    prompt: |
      The reply that we are "in no position to judge" whether a good justifies the fawn's suffering is called **skeptical theism**. A critic answers: "Even granting a gap between God's knowledge and ours, the fawn lay in agony for days. Is there some good that God could secure only by allowing five days of suffering, rather than four, or one, or an instant death?" Which response would a skeptical theist give?
    options:
      - text: 'We cannot rule that out: for all we know, God''s reasons depend on details and goods we cannot grasp, and our not seeing why this much suffering is needed is what we should expect if the gap is large.'
        correct: true
        feedback: |
          Yes, in essence this is the reply Rowe himself describes (the passage is from his 2006 paper). Its strength is that it doesn't need a specific good; its price is on the next card.
      - text: 'Yes, there is a known good that requires exactly five days.'
        feedback: |
          Skeptical theists do not claim to know any such good; that is the point of the position. A specific answer would be a theodicy (a proposed real reason), which the next lesson takes up.
      - text: 'The fawn did not really suffer.'
        feedback: |
          Skeptical theism concedes the suffering; it questions what we can infer from our failure to see its point.
    explanation: |
      Note the layers: (1) the fawn's suffering is a fact; (2) whether our inability to see a point is evidence there is none is a live debate; (3) the claim that a larger good exists is a faith or metaphysical commitment, not a datum.

  - type: mcq
    id: price
    title: "The price of the reply"
    prompt: |
      Rowe replied that skeptical theism has a cost for believers. A Christian theist, for example, may hope for a glorious life after death because a perfectly good God would surely give the faithful the greatest good. If we are "in the dark" about the goods God knows and how they are realised, what follows for that hope, according to Rowe?
    options:
      - text: 'The same doubt applies: if we cannot tell what God would allow for the sake of unknown goods, we are also in the dark about whether God will bring about the life after death we hope for. The believer must then rest that hope on revelation, not on this reasoning.'
        correct: true
        feedback: |
          In essence yes (Rowe, 2006). Skeptical theists reply that the cases differ: revelation, or what God has said, may give grounds for the hope that a general doubt about God's reasons does not remove. Whether the two doubts can be kept apart is still argued.
      - text: 'Nothing: skeptical theism concerns only animals.'
        feedback: |
          It is a general thesis about the limits of our grasp of God''s reasons, so it applies wherever we infer what a good God would do.
      - text: 'It proves the hope is false.'
        feedback: |
          Rowe''s point is that the hope loses one of its supports, not that it is refuted.
    explanation: |
      Where thoughtful people part ways: whether skepticism about God's reasons can be made narrow enough to answer the argument from evil without also weakening the believer's own inferences. Skeptical theists such as Michael Bergmann have defended a careful version; Rowe thought the position would not stay narrow.

  - type: widget
    id: grid
    widget: frequency-grid
    config:
      N: 1000
      prior: 0.5
      sens: 0.2
      fpr: 0.6
      sliders:
        prior: { fixed: true }
        sens: { fixed: true }
        fpr: { fixed: true }
      show: { posterior: false }
      reset: false
      labels:
        prior: "A good God exists"
        sens: "Suffering like ours, if a good God"
        fpr: "Suffering like ours, if not"
        tp: "God, suffering like ours"
        fn: "God, other pattern"
        fp: "No God, suffering like ours"
        tn: "No God, other pattern"
        posterior: "God, given suffering like ours"
    body: |
      A toy model, with invented numbers. Each dot is one of 1,000 imagined worlds. **Green**: a good God exists and the suffering looks like ours. **Blue**: a good God exists but the suffering looks different. **Red**: no such God and the suffering looks like ours. **Grey**: no God, different pattern. Our world has the pattern, so look only at green and red. How do they compare?
    review: false

  - type: numeric
    id: grid-posterior
    title: "Reading the toy model"
    prompt: |
      In a toy model, half of 1,000 imagined worlds have a good God (500) and half do not (500). Suppose, with invented numbers, that suffering like ours appears in 20% of the worlds with a good God and in 60% of the worlds without one. Looking only at the worlds where suffering looks like ours, what percentage of them have a good God?
    answer: 25
    tolerance: 0.5
    answerText: '25'
    wrong:
      - value: 50
        feedback: |
          50% is the share before looking at the evidence. Among the worlds with suffering like ours, there are $0.2\times500=100$ with God and $0.6\times500=300$ without.
      - value: 20
        feedback: |
          20% is how often the pattern appears *if* God exists. The question asks the reverse: of the worlds with the pattern, how many have God? Count the pattern's worlds: $100+300=400$.
    hint: Count the worlds with the pattern on each side, then take the share on the God side.
    explanation: |
      With God: $0.2\times 500 = 100$ worlds show the pattern. Without God: $0.6\times 500 = 300$. Among the $400$ worlds with the pattern, $100$ have God: $100/400 = 25\%$. The evidence moved the probability from 50% to 25% because the pattern is three times as likely without God as with. The numbers are invented; the lesson is the structure.

  - type: mcq
    id: draper
    title: "Draper's version: likelihoods"
    prompt: |
      Paul Draper (1989, in the journal *Noûs*) put the argument in this comparative form. He compares theism with the hypothesis of indifference $I$ (neither the nature nor the condition of sentient beings on earth results from benevolent or malevolent acts of non-human persons), and argues that the observed pattern of pain and pleasure is much more probable on $I$ than on theism. Which statement describes his kind of argument correctly?
    options:
      - text: 'The evidence need not contradict theism: it only needs to be less expected on theism than on its rival, and then it lowers the odds of theism (for example when the pattern is three times as likely on the rival).'
        correct: true
        feedback: |
          Yes. It is a Bayesian comparison: what matters is the ratio $P(E\mid G)/P(E\mid I)$. This also answers the "we cannot prove it is pointless" worry in part, since it does not ask for a proof.
      - text: 'He shows that the fawn is a pointless evil.'
        feedback: |
          That is Rowe''s route. Draper''s argument goes round it: it asks which hypothesis predicts the pattern better, without needing any single evil to be shown pointless.
      - text: 'He shows that theism is logically inconsistent with pain.'
        feedback: |
          That is the logical problem of evil, answered by the free-will defence in the lesson The Logical Problem of Evil. Draper''s claim is probabilistic.
    explanation: |
      The critic's best reply is aimed at one number: can we say how likely the pattern is on theism, given our ignorance of God's reasons? That is where skeptical theism re-enters. Also note that Hume (Dialogues, Part XI, 1779) had argued in this spirit that a world of mixed good and bad does not show a perfectly good cause, which is the older form of the thought.

  - type: numeric
    id: odds
    title: "Odds with other numbers"
    prompt: |
      A theist starts with $P(G)=0.8$ and the rival $I$ with $P(I)=0.2$ (take only these two). Suppose $P(E\mid G)=0.1$ and $P(E\mid I)=0.5$. After learning $E$, what is the probability of $G$, as a percentage? (Give one decimal.)
    answer: 44.4
    tolerance: 0.2
    answerText: '44.4'
    wrong:
      - value: 80
        feedback: |
          80% is the prior, before the evidence. The evidence is five times as likely on $I$ as on $G$, so the odds on $G$ shrink.
      - value: 20
        feedback: |
          Not quite. The ratio of likelihoods is $0.1/0.5=0.2$, but it multiplies the prior odds $0.8/0.2=4$, not the prior probability.
    hint: Use the odds form. The prior odds are 4, and the evidence multiplies them by a likelihood ratio.
    explanation: |
      Prior odds $=0.8/0.2=4$. Likelihood ratio $=0.1/0.5=0.2$. Posterior odds $=4\times0.2=0.8$, so $P(G\mid E)=0.8/(1+0.8)=0.444$. A strong prior survives much of the evidence, which is how a theist with other strong reasons can stay rational (Rowe said so). A skeptical theist would instead dispute the $0.1$.

  - type: mcq
    id: parting
    title: "Where do people part ways?"
    prompt: |
      Two readers study the same argument. One concludes the fawn case is moderate evidence against God; the other is unmoved. According to this lesson, which difference could explain it without either making a logical error?
    multiple: true
    options:
      - text: 'They disagree about how likely the pattern of suffering is if a good God exists, because one thinks we cannot judge God''s reasons and the other thinks we can.'
        correct: true
        feedback: |
          Yes: the likelihood $P(E\mid G)$, the core of skeptical theism.
      - text: 'They start with different prior probabilities for God, because of other arguments or experiences.'
        correct: true
        feedback: |
          Yes: in the odds form the prior multiplies the likelihood ratio, as the last numeric card showed.
      - text: 'One of them does not believe the fawn suffered.'
        feedback: |
          Possible for some, but it is not what the lesson's argument turns on, and the argument can be run on any real suffering.
      - text: 'The argument is a deductive proof, so only one of them can be right.'
        feedback: |
          Rowe''s conclusion is "probably", and the argument is inductive/probabilistic. Reasonable people can differ about its inputs.
    explanation: |
      That is the mark of an evidential argument: it can raise or lower a probability without forcing anyone. Rowe's own "friendly atheism" says that a theist with other strong grounds can reasonably hold that some good unknown to us justifies the fawn's suffering, while an atheist can reasonably hold the opposite.

  - type: mcq
    id: trap
    title: "Trap: the lazy conclusion"
    prompt: |
      A student says: "Skeptical theism shows that evil is no evidence against God at all, since we can never know God's reasons." Another says: "Rowe's argument proves there is no God." Which statement is fairest?
    options:
      - text: 'Neither: skeptical theism, if right, undercuts the inference to "pointless", but it also leaves open that we cannot say God is likely; and Rowe''s argument, if right, lowers the probability of God, it does not prove atheism.'
        correct: true
        feedback: |
          Yes. Each side's best form claims less than its slogan: one says the evidence is hard to weigh, the other says it weighs against God, not that it refutes God.
      - text: 'The first student is right: ignorance of reasons removes all evidence.'
        feedback: |
          Wide skepticism cuts both ways: if we cannot judge God''s reasons, we cannot judge that evil is *expected* on theism either, so the theist cannot use the pattern as a point in favour.
      - text: 'The second student is right: the argument is valid, so atheism follows.'
        feedback: |
          Valid with a probabilistic first premise yields only a probable conclusion, and the premise is the disputed one.
    explanation: |
      This is the trap of the topic: treating a probabilistic argument as a proof, or skepticism about reasons as a proof of theism.

  - type: mcq
    id: resolve
    title: "Resolve the hook"
    prompt: |
      Back to the fawn: you cannot think of any good that would be lost by preventing its suffering. According to this lesson, does that failure count against the existence of a justifying good?
    options:
      - text: 'It counts to the extent that we would expect to see such a good if there were one. Rowe thinks we would; skeptical theists, such as Wykstra, think we would probably not. The argument is then settled by that expectation together with the prior.'
        correct: true
        feedback: |
          Right. Your first guess was the right frame: some evidence, with the weight depending on whether the reason would be visible to us.
      - text: 'It never counts, because the unknown is always unknown.'
        feedback: |
          This would also forbid concluding there is no dog from an empty garage. The question is whether we would see it if it were there.
      - text: 'It always proves there is none.'
        feedback: |
          It would then prove too much: a child who cannot think of a reason for an injection would have proved there is none.
    explanation: |
      Where thoughtful people part ways: the visibility of reasons (the likelihood), the prior for God, and how to weigh a vivid single case against a broad pattern.

  - type: text
    id: summary
    body: |
      **Next:** the theodicies. Some philosophers do not stop at "for all we know": they propose real reasons God might have for allowing suffering (such as growth of character) and critics ask whether they work for the fawn and for the many cases they were not made for.
