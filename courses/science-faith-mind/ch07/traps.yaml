id: ch07-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: evil, hiddenness, simplicity, the wager and agnosticism"
    body: |
      Fast round. Each question hides a **tempting shortcut** about the ideas met in this level: the logical and the evidential problem of evil, theodicies and defenses, the argument from divine hiddenness, Occam's razor and the burden of proof, Pascal's wager, and agnosticism. Every shortcut is a *useful idea turned too far*.

      Nothing here asks whether God exists. Answers are given *according to* someone, and where thoughtful people differ the feedback shows both sides.

  - type: mcq
    id: logical-evidential
    title: "Consistency answers everything?"
    prompt: |
      Plantinga's free-will defense shows that "God is all-powerful and wholly good" and "evil exists" can be true together. A student says: "So the problem of evil is solved." What does the defense actually settle?
    options:
      - text: 'Only the logical problem: the three claims are not contradictory, because a merely possible story makes them all true. The evidential problem asks something else: whether the suffering we observe is still good evidence against God.'
        correct: true
      - text: 'Everything: if the claims are consistent, the evil we see is no evidence against God.'
        feedback: |
          Consistent does not mean likely. A coin landing heads a hundred times in a row is consistent with a fair coin, yet it is strong evidence against fairness. Rowe and Draper argue in that way about suffering.
      - text: 'Nothing: a possible story proves nothing, so the logical problem stays open.'
        feedback: |
          To refute "these claims are inconsistent" a possible story is exactly what is needed: one possible world where all three hold. That is why Plantinga needs only possibility, not truth.
      - text: 'That God is not responsible for evil, since the free creatures chose it.'
        feedback: |
          The defense does not say this is how things are. It says this could be how things are. Whether God would still be responsible is a further question that people answer differently.
    explanation: |
      Two questions, two burdens. Against "inconsistent" a possible story is enough. Against "improbable" one must argue about how likely the evidence is if God exists, which is where the evidential problem and skeptical theism fight.

  - type: mcq
    id: defense-truth
    title: "A defense claims it is true?"
    prompt: |
      A critic says: "Plantinga has no evidence that transworld depravity is true, so his defense fails." What is the best reply, according to defenders of the free-will defense?
    options:
      - text: 'A defense does not claim its story is true or even probable. Against the claim that the set of claims is contradictory, it is enough that the story is possible. A theodicy, which names God''s actual reasons, would need more.'
        correct: true
      - text: 'The story is certainly true, because free will is a great good.'
        feedback: |
          Defenders do not claim that. The value of freedom is part of the story, but the defense says only that it is possible that God could not have made free creatures who never do wrong.
      - text: 'Evidence is never needed in philosophy.'
        feedback: |
          Evidence is needed when the claim is that something is true or likely. The logical problem claims impossibility, and one possible counterexample answers that.
      - text: 'The critic is right, and a defense must be shown to be probable.'
        feedback: |
          That is the standard for a theodicy or for answering the evidential problem. Against the logical problem the standard is lower, which is why the defense is useful there.
    explanation: |
      The standard depends on the target. To refute "contradictory", show possibility. To refute "improbable", argue about probability. A critic and a defender often talk past each other by using different standards.

  - type: mcq
    id: natural-evil
    title: "Does freedom cover earthquakes?"
    prompt: |
      The free-will defense explains wrongdoing as the misuse of a great good, free choice. A student says: "So it explains the fawn burned in a forest fire started by lightning." Which reply is correct?
    options:
      - text: 'By itself it reaches moral evil, which comes from human choices. Natural evil (disease, earthquakes, animal pain) needs more: an extra story, such as supernatural agents (Plantinga and Lewis suggested this, though many find it improbable), soul-making, or a revised idea of God.'
        correct: true
      - text: 'Yes: all suffering ultimately comes from someone''s free choice.'
        feedback: |
          A lightning-caused fire involves no choice by anyone we know of. Extending freedom to every cause would need an extra, contested assumption such as supernatural agents.
      - text: 'No, and so the free-will defense is refuted.'
        feedback: |
          It does not claim to cover natural evil. It answers one problem (moral evil) and leaves another, which other replies try to reach.
      - text: 'It does not matter, because natural evil is not evil.'
        feedback: |
          The fawn''s suffering is the standard example of what the evidential argument starts from. Denying that it counts is itself a position that needs argument.
    explanation: |
      Each reply in this level reaches some evils and strains on others: free will on natural evil, soul-making on animals and children, skeptical theism on its price. Ask of every reply: *which evil does it not reach?*

  - type: mcq
    id: probable
    title: "Rowe: certain, or probable?"
    prompt: |
      A student summarises Rowe's argument as "There certainly are pointless evils, so God does not exist." According to Rowe, what is wrong with this summary?
    options:
      - text: 'He does not claim certainty. His first premise is "Probably, there are pointless evils" (evils God could have prevented without losing an outweighing good), and his conclusion is that probably God does not exist.'
        correct: true
      - text: 'Nothing: he claims to prove it with certainty.'
        feedback: |
          Rowe''s argument is evidential. Its conclusion is probable, not proved, and Rowe himself held that a theist with other strong reasons can be rational.
      - text: 'He claims pointless evils are possible, not probable.'
        feedback: |
          Possible pointless evil is not enough for his conclusion. The step that matters is from "possible" to "probable", and that is where critics push.
      - text: 'He argues that every evil is pointless.'
        feedback: |
          He needs only some pointless evil: the fawn is meant as a test case, not as a claim about all evils.
    explanation: |
      Because the premise is probabilistic, the argument is only as strong as the reason to think the evil is truly pointless. That is exactly the joint a skeptical theist attacks.

  - type: mcq
    id: fleas
    title: "No good in sight, so none?"
    prompt: |
      We look and see no good that justifies the fawn's long suffering. Rowe infers: "so probably there is none." A skeptical theist compares this to looking for a dog and for fleas in a room. What is the comparison for?
    options:
      - text: 'If there were a dog we would see it, so not seeing one is good evidence of none. If there were fleas we might well not see them. The inference from "we see no good" to "there is none" is strong only if, were there a God-purposed good, we would probably see it.'
        correct: true
      - text: 'It shows that no good exists, as in a room with no dog.'
        feedback: |
          The comparison shows the opposite point: it can be reasonable to conclude "none" when we would expect to see the thing, and unreasonable when we would not. Which case this is, is the debate.
      - text: 'It shows that suffering is as unimportant as fleas.'
        feedback: |
          The comparison is about what we can detect, not about how serious something is.
      - text: 'It shows that absence of evidence is never evidence of absence.'
        feedback: |
          Absence of evidence is evidence of absence when we would expect to find the evidence (the dog). The skeptical theist says we should not expect to find it here; the critic says we should.
    explanation: |
      Both sides agree on the general principle. They disagree on how well human minds can detect the possible reasons of a being with far more knowledge. The next trap shows the price of answering "badly".

  - type: mcq
    id: skeptical
    title: "Skeptical theism proves a reason?"
    prompt: |
      A student says: "Skeptical theism shows God has a good reason for the fawn's suffering." What does it actually claim, and what is its price according to critics such as Rowe?
    options:
      - text: 'It names no reason. It says that if God has reasons, we would probably not grasp them, so our failure to find one is weak evidence. The price: the same doubt about what God knows and wants weakens our confidence in what God would reveal or provide, such as a life after death.'
        correct: true
      - text: 'It names a reason, free will, and shows that the reason is true.'
        feedback: |
          That is the free-will theodicy. Skeptical theism is a different strategy: it declines to name reasons and attacks the inference that there are none.
      - text: 'It proves that God exists, because we cannot see the reasons.'
        feedback: |
          It does not argue for God at all. It only blocks one argument against God, and works only for someone who already takes God as a live option.
      - text: 'It costs nothing, since doubt about God''s reasons applies only to evil.'
        feedback: |
          That is what critics deny. If we cannot judge what a God would allow, we also cannot judge what a God would promise or arrange elsewhere.
    explanation: |
      A defense of this kind buys safety from the argument by giving up confident expectations about what God would do. Defenders reply that the doubt is limited to deep, unseen goods; critics say that limit is hard to draw.

  - type: numeric
    id: bayes-odds
    title: "Evidence weaker on one side"
    prompt: |
      Compare theism $G$ with indifference $I$ after observing suffering $E$. A reader's prior odds are $P(G)/P(I) = 2$. The evidence is $4$ times as likely under $I$ as under $G$, that is $P(E\mid G)/P(E\mid I) = 0.25$. A student says "the evidence is $4$ to $1$ against $G$, so the odds are now $1/4$". What are the posterior odds $P(G\mid E)/P(I\mid E)$?
    answer: 0.5
    tolerance: 0.01
    wrong:
      - { value: 0.25, feedback: "That is the likelihood ratio alone. It drops the prior odds, so it is only right when the prior odds are 1 to 1." }
      - { value: 8, feedback: "That multiplies the prior odds by 4, but the evidence favours I, so the ratio is 0.25, not 4. Evidence against a hypothesis lowers its odds." }
      - { value: 2, feedback: "That ignores the evidence. The odds change when the likelihood ratio is not 1." }
    hint: "Posterior odds = likelihood ratio times prior odds."
    explanation: |
      $0.25 \times 2 = 0.5$. The evidence lowered the odds of $G$ from $2$ to $0.5$ (a fall by a factor of $4$) but did not make $G$ impossible: a reader who began quite confident can stay a theist, while one who began at even odds would end at $0.25$. How strong the prior should be, and whether anyone can estimate $P(E\mid G)$, is where people part ways.

  - type: mcq
    id: adams
    title: "Outweighed is enough?"
    prompt: |
      A student says: "An evil is justified once the good it leads to elsewhere is larger than the evil." According to Marilyn McCord Adams, what is missing for horrendous evils, those that give a person reason to doubt that their life could be good on the whole?
    options:
      - text: 'Defeat within that person''s life: the evil must be integrated into a life that is, overall, good for that person. Outweighing by goods elsewhere (for others, or later for the world) does not do this.'
        correct: true
      - text: 'Nothing: outweighing by a larger total good is always sufficient.'
        feedback: |
          That is the greater-good principle, which Adams accepts for ordinary evils. Her point is that for horrendous evils the person who suffers must also be given a life they can count as good.
      - text: 'A proof that the evil was necessary for the good.'
        feedback: |
          Necessity is the other clause of the greater-good test (could a lesser cost have done?). Adams adds a requirement about the sufferer, not only about the means.
      - text: 'An admission that explaining an evil excuses it.'
        feedback: |
          The opposite: explaining an evil is not excusing it. A reason for permitting an evil may still leave the sufferer wronged unless the evil is defeated in their life.
    explanation: |
      Total value and the value of one life are different measures. Adams's point, according to supporters, is that a good God must care about each person's life; critics ask whether defeat can be shown to be available to all, including those who die young.

  - type: mcq
    id: hiddenness-evil
    title: "Hiddenness is the problem of evil?"
    prompt: |
      A student says: "The hiddenness argument is the problem of evil in other words, so the free-will defense answers it." Which reply is correct?
    options:
      - text: 'They are different arguments. Evil starts from suffering and asks why a good God permits it; hiddenness starts from sincere non-belief and asks why a loving God, who seeks a relationship, would allow its absence. A reply to one need not answer the other.'
        correct: true
      - text: 'They are the same: non-belief is a kind of suffering.'
        feedback: |
          Schellenberg''s argument does not depend on suffering. A person can be content and still not believe. The premise is about what a loving God would make available for relationship.
      - text: 'Hiddenness is weaker, because belief is not necessary for a relationship.'
        feedback: |
          Whether belief is needed is the very premise critics argue about (Moser''s reply goes that way). It is not a reason to confuse the two arguments.
      - text: 'Hiddenness is stronger, because it proves God does not exist.'
        feedback: |
          It is a valid argument whose premises are disputed (relationship needs belief, God is always open, non-resistant non-belief occurs). It does not prove its conclusion.
    explanation: |
      The free-will defense explains why a good God might permit wrongdoing. Hiddenness asks about a different good, personal relationship, so the replies are different too: epistemic distance for freedom, or purposive availability of evidence.

  - type: numeric
    id: hidden-odds
    title: "Updating on sincere non-belief"
    prompt: |
      Let $G$ be "a perfectly loving, personal God exists" and $D$ the observation that there are capable, non-resisting people who do not believe. A reader's prior is $P(G) = P(\lnot G) = 0.5$. They judge $P(D\mid G) = 0.3$ and $P(D\mid\lnot G) = 0.6$. A student says "so $P(G\mid D) = 0.5$, since the odds are $0.5$". What is $P(G\mid D)$?
    answer: 0.333
    tolerance: 0.005
    wrong:
      - { value: 0.5, feedback: "The posterior odds are 0.5, but odds are not a probability. Odds 1 to 2 means a probability of 1 out of 3." }
      - { value: 0.3, feedback: "0.3 is P(D given G), a likelihood. The posterior probability needs the prior and the other likelihood too." }
    hint: "Posterior odds = (0.3 / 0.6) times (0.5 / 0.5). Then probability = odds / (1 + odds)."
    explanation: |
      Odds $= (0.3/0.6)\times 1 = 0.5$, so $P(G\mid D) = 0.5/1.5 = 1/3$. A reply that raises $P(D\mid G)$ (for example, freedom needing epistemic distance) lifts the number; a critic who thinks $P(D\mid\lnot G)$ is even higher lowers it. The arithmetic is easy; the disagreement is about the inputs.

  - type: mcq
    id: simplicity-fit
    title: "Simpler always wins?"
    prompt: |
      Two hypotheses explain the same data. $H_1$ is much simpler but predicts the data poorly ($P(E\mid H_1)$ is tiny); $H_2$ is more complicated and predicts them well. A student says: "By Occam's razor, take $H_1$." What does the Bayesian reading of simplicity say?
    options:
      - text: 'Fit enters through the likelihoods, simplicity through the prior. A prior advantage cannot repair a tiny likelihood, so simplicity is a tie-breaker for hypotheses that fit about equally well.'
        correct: true
      - text: 'The razor always picks the simpler hypothesis, whatever the fit.'
        feedback: |
          Then a rule that predicted nothing would beat any real theory. Simplicity is a reason when the fit is about equal, not a replacement for fit.
      - text: 'The razor picks the hypothesis with the more complicated story, to be safe.'
        feedback: |
          It does not. A narrow hypothesis can win precisely when the data fall inside what it predicts (the machine that printed one of 5 numbers: a factor of 20 over the any-number rule).
      - text: 'Simplicity is irrelevant to probability.'
        feedback: |
          Many philosophers (Swinburne among them) hold that simplicity raises the prior; others dispute it. Either way, it is discussed as one input among others.
    explanation: |
      Neptune shows the same: positing an unseen planet looked less simple than leaving mechanics alone, yet it kept the theory simple and fit the data. "Simpler" is not always "posits fewer things".

  - type: mcq
    id: ockham
    title: "Did Ockham say it?"
    prompt: |
      A student says: "Ockham wrote that entities must not be multiplied beyond necessity, so the razor is a law of science." Which reply is correct?
    options:
      - text: 'The slogan is named after William of Ockham (c. 1287-1347) but is not found in his texts; his own rule was roughly to posit only on the ground of reason, experience or infallible authority. And as a rule of method it is a guide for choosing among hypotheses, not a law of nature.'
        correct: true
      - text: 'Ockham wrote exactly that sentence, so it is a law of nature.'
        feedback: |
          The slogan is not in his texts, and a rule for how to reason is not a statement about how the world is. The world may be complicated even if our best hypothesis is simple.
      - text: 'The razor says the world is simple.'
        feedback: |
          It says nothing about the world directly. It guides which hypothesis to prefer, and its justification is itself debated (prior probability, predictive power).
      - text: 'The razor proves that supernatural things do not exist.'
        feedback: |
          It can count the supernatural as a cost, but defenders of theism, like Swinburne, count the cost differently. The razor settles nothing until the counting is agreed.
    explanation: |
      A razor on its own does not choose between naturalism and theism: each side says its hypothesis is simpler, with different counting rules (kinds of thing, number of things, number of assumptions).

  - type: mcq
    id: burden
    title: "Presumption of atheism means denial?"
    prompt: |
      According to Antony Flew (1972), debate about God should begin from a "presumption of atheism". A student takes this to mean "the default is that God does not exist, and the atheist need not argue". Which reply is correct?
    options:
      - text: 'Flew meant atheism in the sense of not believing, as a court starts from a presumption of innocence: whoever says God exists must give reasons. Critics reply that the right default depends on how probable theism is before the arguments. And burden attaches to claims: "no God exists" is a claim that also owes reasons.'
        correct: true
      - text: 'Flew meant that atheists need no reasons for anything they say.'
        feedback: |
          The burden attaches to whoever asserts something, positive or negative. A narrow atheist who says "there is no God" asserts something too.
      - text: 'Flew meant that theists have lost the debate in advance.'
        feedback: |
          A presumption is a starting point that arguments can overturn, as with innocence in court.
      - text: 'Everyone agrees where the burden lies.'
        feedback: |
          The question is itself disputed, which is why the word "default" needs to be defined before debating.
    explanation: |
      The practical point: when someone says "the burden is on you", ask what claim is being made, and what its prior probability is. Often the real disagreement is about priors.

  - type: numeric
    id: breakeven
    title: "How small a chance is worth it?"
    prompt: |
      In a finite version of Pascal's wager, wagering for God costs $c = 8$ (in some unit of well-being) if God does not exist and gains $g = 200$ if God exists; wagering against pays $0$ either way. The chance $p$ that God exists makes the two wagers equal when $p \cdot g = (1-p)\cdot c$. A student says "$p = c/g = 0.04$". What is the break-even $p$?
    answer: 0.0385
    tolerance: 0.0005
    wrong:
      - { value: 0.04, feedback: "That is c/g. It ignores that the cost applies only with probability 1 - p, so the cost side is (1 - p) times c, not c." }
      - { value: 0.9615, feedback: "That is 1 - p, the chance that God does not exist, not the break-even chance." }
    hint: "Solve p times 200 = (1 - p) times 8 for p."
    explanation: |
      $200p = 8 - 8p$ gives $p = 8/208 \approx 0.0385$. A bigger reward lowers the break-even chance, and if the reward is infinite, any $p > 0$ is enough. That is why critics attack the infinity, the probabilities and the table of acts, not the arithmetic.

  - type: mcq
    id: wager-proof
    title: "The Wager proves God exists?"
    prompt: |
      A student says: "Pascal's wager is a proof that God exists." According to Pascal and to most commentators, what kind of argument is it?
    options:
      - text: 'A practical argument about what to do when reason cannot settle the question: if the reward for wagering for God is infinite and every other payoff finite, wagering for God has the higher expected value for every probability above zero. It makes no claim that God exists.'
        correct: true
      - text: 'A proof from the premise that the universe had a beginning.'
        feedback: |
          That is the kalam argument (whatever begins to exist has a cause). The Wager does not argue for God''s existence from features of the world at all.
      - text: 'A proof that it is rational to believe at will.'
        feedback: |
          Pascal knew belief cannot be switched on by will. He suggested acting as if one believed (holy water, masses), hoping belief would follow. Critics ask whether that works.
      - text: 'An argument that only works if God is exactly as likely as not.'
        feedback: |
          The infinite version works for any probability above zero. Hacking (1972) objected to the equal-odds premise in one of the versions, but the main argument does not need it.
    explanation: |
      Keep the layers apart: the Wager is decision theory (layer 2, live debate about its table), not evidence that God exists. Its step from premises to conclusion is the least contested part.

  - type: mcq
    id: many-gods
    title: "Many gods, so atheism?"
    prompt: |
      Diderot (1746) and Mackie (1982) pressed the many-gods objection: a rival god B might punish those who wager for A. A student says: "So the objection shows no god exists." What does the objection actually show?
    options:
      - text: 'It shows that the table of acts and states is too small: with rival gods, the expected value of wagering for A can cancel (for example 0.02 x 1000 + 0.02 x (-1000) + 0.96 x (-10) = -9.6), and with two infinite rewards, p x infinity is infinite for every p > 0, so probabilities no longer help. It does not show that any god does or does not exist.'
        correct: true
      - text: 'It shows that every god is equally likely.'
        feedback: |
          Nothing in the objection fixes the probabilities. The wager needs them, and the objection says the numbers cannot be read off from a single option.
      - text: 'It refutes the claim that the reward is infinite.'
        feedback: |
          It does not touch that claim. It adds rivals with their own rewards and punishments.
      - text: 'It shows the Wager would work if only one god were possible.'
        feedback: |
          Pascal''s own argument targets a specific God. Defenders say the live options are fewer than the objection suggests; critics say that restriction needs argument.
    explanation: |
      The objection is a limit on the decision-theoretic table, not a proof of atheism. Defenders reply that not all gods are equally credible or equally capable of rewarding wagering; critics ask who decides.

  - type: mcq
    id: agnostic-axis
    title: "Agnostic: halfway between?"
    prompt: |
      A student places the three words on one line: "theist, agnostic, atheist, with the agnostic in the middle." According to the way Huxley and later philosophers use the words, what is wrong with this line?
    options:
      - text: 'Belief and knowledge are separate questions. Theist and atheist answer "what do you believe?"; agnostic answers "what can be known?". So there are agnostic theists (believe but claim no knowledge) and agnostic atheists (lack belief without claiming knowledge).'
        correct: true
      - text: 'Nothing: the agnostic believes God exists with probability one half.'
        feedback: |
          A credence of one half can rest on strong evidence (a known fair coin) or on none (a coin of unknown bias). Agnosticism is about the state of knowledge, and not a number alone.
      - text: 'The agnostic simply has not thought about it.'
        feedback: |
          That is closer to apathy, or to not having considered the question. Agnostics in the philosophical sense often thought hard before suspending judgement.
      - text: 'Agnostics are atheists who are afraid to say so.'
        feedback: |
          Some people do use the word that way, but the philosophical sense is about knowledge. Huxley coined it (around 1869) to describe a stance on what can be demonstrated.
    explanation: |
      Two axes: believe or not, and claim to know or not. The line hides the second axis. The grid of the lesson on agnosticism shows each combination.

  - type: mcq
    id: strong-agnostic
    title: "Strong agnosticism is the modest option?"
    prompt: |
      A student says: "Saying 'nobody can know whether God exists' is the humblest position, since it claims nothing." Why do critics call strong agnosticism the most demanding form?
    options:
      - text: 'It is a claim about the limits of all possible evidence for everyone, not only a report of one person''s doubt. Critics ask how one could know that, and whether the claim then refutes itself; defenders reply that it may rest on arguments about what any evidence could show.'
        correct: true
      - text: 'It claims that God does not exist.'
        feedback: |
          It claims neither. It says that nothing can settle the matter, which is a claim about knowledge.
      - text: 'It is demanding because it says "I do not know".'
        feedback: |
          That is weak agnosticism: I do not know, and perhaps someone could. It is the modest form.
      - text: 'It is not demanding at all, because every claim about knowledge is modest.'
        feedback: |
          Claiming that no one could ever know is as strong as claiming that someone knows: both would need reasons.
    explanation: |
      Weak agnosticism says "I do not know"; strong agnosticism says "no one can know". Practical agnosticism says the question makes no difference to how one lives, though staying out of the wager is still an act.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Eighteen traps, one pattern: each turned a *useful* idea into a shortcut.

      - **Evil, logical and evidential**: the free-will defense shows only that $O$, $G$, $E$ are consistent, $\Diamond(O \land G \land E)$; a possible story is enough against "contradictory" but says nothing about how likely the evil is. A defense is not a theodicy and claims no truth. By itself it reaches moral evil, not the fawn.
      - **Rowe and the replies**: "probably, there are pointless evils" is probabilistic. "We see no good" is evidence of "none" only if we would probably see it (dog, not fleas). Skeptical theism names no reason, and its price is doubt about what God would reveal. Adams: defeat within a life, not outweighing elsewhere.
      - **Updating**: posterior odds $=$ likelihood ratio $\times$ prior odds ($0.25 \times 2 = 0.5$); odds are not a probability ($\text{odds } 0.5 \Rightarrow P = 1/3$). Hiddenness starts from sincere non-belief, not from suffering.
      - **Simplicity and burden**: fit lives in the likelihoods, simplicity in the prior, so simplicity breaks ties but cannot rescue a poor fit. The slogan is not in Ockham's texts. Burden attaches to claims, positive or negative; Flew's "presumption of atheism" means not believing.
      - **Wager and agnosticism**: break-even $p = c/(g+c)$ ($8/208 \approx 0.0385$); the infinite version is practical, not a proof, and rival gods break the table. Agnosticism is about knowledge, not a midpoint of belief, and "no one can know" is stronger than "I do not know".

      **Next:** *Quick Recall*, the main formulas and distinctions of this level at a glance.
