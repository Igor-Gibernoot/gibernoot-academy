id: ch07-intuition
title: Quick Recall
kind: intuition

cards:
  - type: text
    id: welcome
    title: "Quick recall: evil, hiddenness, simplicity, the wager, agnosticism"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: the logical and the evidential problem of evil, the replies to evil, the argument from divine hiddenness, Occam's razor and the burden of proof, Pascal's wager, and agnosticism.

      Three kinds of card: **mnemonics** (the shape of an argument), **build cards** (assemble a formula or a chain) and **checks** (does it behave sensibly?). Small numeric cases give you data only: choose the right tool yourself.

      As always, answers are given *according to* a thinker or a view. Nothing here asks you to decide whether God exists.

  - type: mcq
    id: two-problems
    title: "Logical or evidential?"
    prompt: |
      Let $O$ = "God is omnipotent", $G$ = "God is wholly good" and $E$ = "evil exists". According to J. L. Mackie, $O$, $G$ and $E$ cannot all be true together (the *logical* problem). According to William Rowe, $E$ makes God improbable (the *evidential* problem). Which task answers the logical problem?
    options:
      - text: 'Show a possible story in which $O$, $G$ and $E$ are all true; a defense need not be the real story, only possible.'
        correct: true
      - text: 'Show that the real story is the one in which $O$, $G$ and $E$ are all true.'
        feedback: |
          That is a *theodicy*, a claim about God's actual reasons. It is more than the logical problem asks for.
      - text: 'Show that $E$ is not very probable on the hypothesis that God exists.'
        feedback: |
          Probabilities belong to the evidential problem. Against a claim of *inconsistency*, one possible world with all three is enough.
      - text: 'Show that $E$ is an illusion.'
        feedback: |
          Denying that evil exists would remove $E$, but that is a different move from showing the three are consistent.
    explanation: |
      Mnemonic: **logical = consistent? (one possible story); evidential = how probable?**. Consistency is written $\Diamond(O\land G\land E)$ ("possibly all three"). Showing it does not show the story is true or that evil is not evidence.

  - type: build
    id: bridge-build
    title: "Mackie's bridge principle"
    prompt: |
      To derive a contradiction from $O$, $G$ and $E$, Mackie needs an added principle: a being who is omnipotent and wholly good eliminates evil. Assemble it.
    prefix: ''
    tiles: ['(O\land G)', '\Rightarrow', '\lnot E', 'E', '(O\lor G)']
    answers:
      - ['(O\land G)', '\Rightarrow', '\lnot E']
    wrong:
      - answer: ['(O\lor G)', '\Rightarrow', '\lnot E']
        feedback: |
          "Or" says that being only powerful, or only good, would be enough to remove evil. A good but weak being, or a powerful but indifferent one, need not.
    hint: Both properties are needed together, and the result is that no evil exists.
    explanation: |
      Mnemonic: **powerful and good, so no evil**. Together with $E$ this gives a contradiction. Plantinga's reply attacks the bridge: a good being might allow evil if free creatures are the only way to some greater good.

  - type: build
    id: odds-build
    title: "The odds form"
    prompt: |
      For evidence $E$, a good God $G$ and the hypothesis of indifference $I$, the odds after seeing $E$ equal the *likelihood ratio* times the *prior odds*. Assemble the right side.
    prefix: '\dfrac{P(G\mid E)}{P(I\mid E)} ='
    tiles: ['\dfrac{P(E\mid G)}{P(E\mid I)}', '\times', '\dfrac{P(G)}{P(I)}', '\dfrac{P(G)}{P(E)}']
    answers:
      - ['\dfrac{P(E\mid G)}{P(E\mid I)}', '\times', '\dfrac{P(G)}{P(I)}']
      - ['\dfrac{P(G)}{P(I)}', '\times', '\dfrac{P(E\mid G)}{P(E\mid I)}']
    wrong:
      - answer: ['\dfrac{P(E\mid G)}{P(E\mid I)}']
        feedback: |
          That is the likelihood ratio alone. It ignores how plausible each view was before the evidence.
    hint: What the evidence says, times what you thought before.
    explanation: |
      Posterior odds equal likelihood ratio times prior odds. In the evidential problem people part ways on both factors: on how surprising suffering is if God exists, and on the prior.

  - type: mcq
    id: scaling
    title: "Does it scale sensibly?"
    prompt: |
      In the odds form, the posterior odds of $G$ against $I$ equal the likelihood ratio $\frac{P(E\mid G)}{P(E\mid I)}$ times the prior odds $\frac{P(G)}{P(I)}$. A reader keeps the likelihood ratio fixed and doubles the prior odds. What happens to the posterior odds?
    options:
      - text: They double.
        correct: true
      - text: They stay the same, because the evidence decides everything.
        feedback: |
          Evidence multiplies the prior odds; it does not replace them. Two readers with the same evidence but different priors end with different odds.
      - text: The posterior *probability* of $G$ doubles.
        feedback: |
          Odds double, not probability. Probability is $\frac{\text{odds}}{1+\text{odds}}$, which can never pass $1$.
      - text: They halve.
        feedback: |
          A larger prior pushes the posterior up, not down, when the ratio is unchanged.
    explanation: |
      Mnemonic: **odds scale linearly in each factor**. Bigger prior odds or a bigger likelihood ratio give bigger posterior odds; a ratio of $1$ leaves the prior untouched.

  - type: mcq
    id: which-reply
    title: "Which reply is which?"
    prompt: |
      Five replies to the evil of a fawn dying slowly in a forest fire: free will, soul-making, skeptical theism, process theology and Marilyn McCord Adams's defeat. According to its defenders, which one says in essence that God cannot unilaterally stop such events because God's power works by persuasion, not control?
    options:
      - text: Process theology.
        correct: true
      - text: Free will.
        feedback: |
          The free-will reply says that a world with freely choosing creatures is a great good that requires the *possibility* of wrong. It is aimed mainly at evil that creatures do, not at a fire.
      - text: Soul-making.
        feedback: |
          Soul-making says a world in which characters grow needs real challenge and hardship. It keeps God's power intact.
      - text: Skeptical theism.
        feedback: |
          Skeptical theism keeps God's power and says only that God's reasons may be beyond us. It names no reason.
    explanation: |
      Mnemonic: **free will = freedom of creatures; soul-making = growth through hardship; skeptical theism = we cannot judge; process = a God who persuades; Adams = horrendous evils defeated within the sufferer's own life**. Each is a different strategy, and critics have a standard objection to each.

  - type: build
    id: hidden-build
    title: "The shape of the hiddenness argument"
    prompt: |
      Let $G$ = "a perfectly loving personal God exists" and $D$ = "there are people capable of a relationship with God who are not resisting and still do not believe". According to J. L. Schellenberg, $G$ rules out $D$, yet $D$ holds. Assemble the argument.
    prefix: ''
    tiles: ['G \Rightarrow \lnot D', ',\;', 'D', '\therefore', '\lnot G', 'G']
    answers:
      - ['G \Rightarrow \lnot D', ',\;', 'D', '\therefore', '\lnot G']
    wrong:
      - answer: ['G \Rightarrow \lnot D', ',\;', 'D', '\therefore', 'G']
        feedback: |
          From "if $G$ then not $D$" and $D$ you cannot conclude $G$; the denial of the consequent gives the denial of $G$.
    hint: Deny the consequent, conclude the denial of the antecedent.
    explanation: |
      Mnemonic: **modus tollens: if loving God, then no nonresistant nonbelief; there is such nonbelief; so no such God**. The form is valid. Critics deny $G\Rightarrow\lnot D$ (God may allow it for a greater good, such as freedom) or deny $D$ (nobody is truly nonresistant).

  - type: numeric
    id: hidden-update
    title: "A small hiddenness update"
    prompt: |
      Before the evidence, a reader gives $G$ probability $0.6$ and its denial $\lnot G$ probability $0.4$. The chance of finding such nonresistant nonbelief is $0.2$ if $G$ is true and $0.5$ if $\lnot G$ is true. After finding it, what are the odds of $G$ against $\lnot G$?
    answer: 0.6
    tolerance: 0.005
    answerText: '0.6 (3 to 5)'
    wrong:
      - { value: 1.5, feedback: "That is the starting odds, $0.6/0.4$. The evidence has not been used." }
      - { value: 0.4, feedback: "That is the evidence alone, $0.2/0.5$. The starting odds were not $1$ to $1$." }
    hint: "Two factors: what the evidence says, and what you thought before."
    explanation: |
      The evidence favours $\lnot G$ by a factor of $0.2/0.5 = 0.4$. The starting odds were $0.6/0.4 = 1.5$. The new odds are $0.4 \times 1.5 = 0.6$, about a $37.5\%$ chance for $G$: a drop, but not to zero.

  - type: numeric
    id: narrow-factor
    title: "The narrow rule"
    prompt: |
      A machine prints one number from $1$ to $100$. Rule $S$ says it prints one of $5$ particular numbers, each equally likely. Rule $C$ says it prints any of the $100$ numbers, each equally likely. The machine prints $3$, which is one of the $5$ numbers of $S$. By what factor does this print favour $S$ over $C$?
    answer: 20
    tolerance: 0.1
    answerText: '20'
    wrong:
      - { value: 0.05, feedback: "That is the ratio inverted. $S$ gives the print the larger chance, so the factor in favour of $S$ is above $1$." }
      - { value: 5, feedback: "That is the number of values $S$ allows. Compare the chance each rule gave to the print itself." }
    hint: How likely was this exact print under each rule?
    explanation: |
      Under $S$ the chance is $\tfrac15$; under $C$ it is $\tfrac1{100}$. The ratio is $\tfrac{1/5}{1/100}=20$. A narrow rule risks more, so it gains more when the data fall inside it (and would be dead if the print were outside its five). This is why simplicity, in the sense of fewer or tighter commitments, can be a tie-breaker among rules that fit.

  - type: numeric
    id: wager-breakeven
    title: "Break-even from costs and gains"
    prompt: |
      Wagering for God costs $5$ units of well-being if God does not exist and gains $95$ units if God exists. Wagering against pays $0$ either way. For what chance $p$ that God exists are the two choices worth the same on average?
    answer: 0.05
    tolerance: 0.0005
    answerText: '0.05'
    wrong:
      - { value: 0.0526, feedback: "That is $5/95$, which ignores that the cost of $5$ is paid only with probability $1-p$." }
      - { value: 0.95, feedback: "That is $1-p$, the chance that God does not exist, not the break-even chance." }
    hint: Set the average outcome of the wager for God equal to $0$, the average of the other choice.
    explanation: |
      The average outcome is $95p-5(1-p)=100p-5$, which is $0$ at $p=0.05$. A bigger gain lowers the break-even chance. Critics attack the table (other gods, whether belief can be chosen), not the arithmetic.

  - type: mcq
    id: infinite-limit
    title: "A limit check: an infinite reward"
    prompt: |
      In Pascal's wager, suppose the reward if God exists is infinite, the cost of wagering for God if God does not exist is a finite $c$, and a reader's chance that God exists is a tiny $p=0.000001$. According to the expected-value argument, which choice has the higher average outcome?
    options:
      - text: 'Wagering for God: any $p>0$ times an infinite reward is infinite, which beats any finite cost.'
        correct: true
      - text: Wagering against, because $p$ is so small.
        feedback: |
          Smallness helps only against a finite reward. Multiplying any positive $p$ by infinity still gives infinity.
      - text: Neither, because infinite and finite cannot be compared.
        feedback: |
          Critics do raise worries about infinite utilities, but within the argument as stated the comparison is easy: infinite beats finite.
      - text: It depends only on $c$.
        feedback: |
          A finite $c$ cannot offset an infinite gain. Only $p=0$ would remove the pull.
    explanation: |
      Mnemonic: **infinite times any positive chance is infinite**. Hence the power of the argument and the focus of its critics: rival gods with their own infinite rewards, whether a strict zero chance is rational, and whether belief can be chosen.

  - type: mcq
    id: grid
    title: "Belief against knowledge"
    prompt: |
      A person says: "I believe there is a God, but I do not claim to know it, and I think someone might know it." Using two separate questions (do you believe? do you claim knowledge?), how is this person best described, according to the usage since Thomas Huxley (1825-1895)?
    options:
      - text: An agnostic theist with a weak agnosticism.
        correct: true
      - text: An atheist, because lacking knowledge means lacking belief.
        feedback: |
          Belief and knowledge are separate questions. This person believes, so is a theist; they only decline to claim knowledge.
      - text: A strong agnostic, since they admit uncertainty.
        feedback: |
          Strong agnosticism claims that *nobody* can know, even in principle. This person allows that someone might know.
      - text: A practical agnostic, since they are undecided.
        feedback: |
          Practical agnosticism adds that the question makes no difference to how one lives. Nothing here says that.
    explanation: |
      Mnemonic: **belief and knowledge are two axes; strong = nobody can know; weak = I do not know, perhaps someone can; practical = unsettled and irrelevant to my life**. Authors draw these boundaries differently, so ask exactly what is being claimed.

  - type: mcq
    id: burden-simplicity
    title: "Burden and simplicity"
    prompt: |
      Which pair of statements about Occam's razor and the burden of proof is correct?
    options:
      - text: The burden attaches to claims, positive or negative, not to sides; simplicity helps choose among hypotheses that fit the data about equally.
        correct: true
      - text: The burden always falls on the one who believes; simplicity shows which hypothesis is true.
        feedback: |
          Someone who says "no God exists" also asserts something and owes reasons for it. And simplicity is a guide for choosing among about-equal fits, not a proof of truth.
      - text: The burden falls on the side that speaks second; simplicity beats a better fit.
        feedback: |
          Who argues first is a further disputed question. And a simpler hypothesis that fits the data worse loses: simplicity breaks ties, it does not override fit.
      - text: There is no burden in philosophy; simplicity means the fewest words.
        feedback: |
          Reasons are owed for any claim. Simplicity is about the number or kind of commitments (entities, or independent assumptions), not word count.
    explanation: |
      Mnemonic: **burden follows the claim; simplicity breaks ties in fit**. According to Antony Flew (1972), in essence, debate should start from a presumption of atheism in the sense of not believing, as a court starts from presumed innocence; critics say the right default depends on the prior probability of theism.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Logical problem:** with $O$ = God is omnipotent, $G$ = God is wholly good, $E$ = evil exists, Mackie argues from the added principle
        $$(O\land G)\Rightarrow\lnot E$$
        that $O$, $G$, $E$ are inconsistent. A defense shows
        $$\Diamond(O\land G\land E)$$
        (possibly all three) by a possible story, not necessarily the real one.
      - **Evidential problem:** with $G$ = a good God, $I$ = indifference and $E$ = suffering like a fawn's in a forest fire, Rowe's case becomes
        $$\frac{P(G\mid E)}{P(I\mid E)}=\frac{P(E\mid G)}{P(E\mid I)}\times\frac{P(G)}{P(I)}$$
        Replies: free will, soul-making, skeptical theism (a defense, naming no reason), process theology, Adams's defeat within a life.
      - **Hiddenness:** with $D$ = nonresistant nonbelief exists, Schellenberg argues by modus tollens
        $$G\Rightarrow\lnot D,\quad D\ \therefore\ \lnot G$$
      - **Simplicity:** Rule $S$ (5 of 100 numbers) against $C$ (all 100) gives a Bayes factor $\frac{1/5}{1/100}=20$ when the print falls inside $S$. Simplicity breaks ties in fit; the burden attaches to claims, positive or negative.
      - **Wager:** with chance $p$ that God exists, gain $g$ if so and cost $c$ if not, the break-even chance satisfies
        $$p\,g=(1-p)\,c\ \Longrightarrow\ p=\frac{c}{g+c}$$
        An infinite reward makes any $p>0$ enough; critics raise rival gods and the question of whether belief can be chosen.
      - **Agnosticism:** belief and knowledge are two questions. Strong: nobody can know. Weak: I do not know, perhaps someone can. Practical: unsettled and irrelevant to my life.

      People part ways on whether a defense is enough, on the likelihoods and priors in the odds form, on the default for the burden of proof, and on the table of acts in the wager.

      **Next:** the content map, where you rebuild this level's concept map box by box. After the level's review and challenge comes the first partial exam.
