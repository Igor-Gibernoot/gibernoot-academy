id: ch07-theodicy
title: "Theodicies and Their Critics"
kind: concept
own: |
  The setting: the **problem of evil** asks how a God who is all-powerful and wholly good fits with the suffering we observe. Write $G$ for "such a God exists", $E$ for "suffering of the kind and amount we observe (a fawn burned in a forest fire, left to suffer for days)", and $I$ for the hypothesis of indifference (no non-human person acts out of care or malice toward sentient beings). A **theodicy** names the reasons God may really have; a **defense** only shows that such reasons are possible or likely, without naming them.
  - **Greater-good theodicy.** God permits an evil $e$ only if there is a good $g$ that outweighs it and that God could not get without permitting $e$ (or an evil as bad). Here $V$ measures value and $\mathrm{Needs}(g,e)$ means "$g$ cannot be had without $e$":
  {{ $$\begin{aligned}\mathrm{Allowed}(e)\Rightarrow\ &\exists g\,\big(V(g)>V(e)\\&\land\ \mathrm{Needs}(g,e)\big)\end{aligned}$$ }}
  Its test is the second clause: could a lesser cost have secured the same good?
  - **Soul-making (Hick, 1966, after Irenaeus).** According to Hick, God's purpose in creating was to develop free moral agents who grow from the "image" toward the "likeness" of God, in a world with real hardship and with God at an epistemic distance. It strains on animal suffering, on children, and on horrendous evils that destroy rather than build.
  - **Free will and privation (Augustine, 354-430).** Moral evil comes from the misuse of a great good, free will, and evil is a privation (a lack of good) rather than a substance. It strains on natural evil, which no human choice causes.
  - **Skeptical theism is a defense, not a theodicy.** It names no reasons: it says that if God has reasons, we would probably not grasp them, so our failure to find one is weak evidence. In the odds form it attacks the claim that $E$ is much less likely on $G$ than on $I$:
  {{ $$\frac{P(G\mid E)}{P(I\mid E)}=\frac{P(E\mid G)}{P(E\mid I)}\cdot\frac{P(G)}{P(I)}$$ }}
  A theodicy that worked would raise $P(E\mid G)$ toward $P(E\mid I)$; skeptical theism says we cannot judge this ratio. The price: the same doubt weakens our confidence about what God would reveal or provide.
  - **Process theology (Whitehead, Griffin).** According to process thinkers, God acts by persuasion, never by unilateral control, so God could not have prevented the fawn alone. The cost: the classical claim that God can bring about any possible state of affairs is dropped.
  - **Adams on horrendous evils.** Evils that give a person reason to doubt that their life could be good on the whole need to be *defeated* within that person's life, not merely outweighed by goods elsewhere:
  {{ $$\begin{aligned}&\text{defeat within a life}\\&\neq\ \text{outweighing elsewhere}\end{aligned}$$ }}
  - **Where people part ways.** On whether the goods named are worth their price, on whether natural evil and animal suffering are reached, and on whether to revise the concept of God rather than the argument. Explaining an evil is not excusing it.
cards:
  - type: mcq
    id: hook
    title: "Guess: a good that needs pain"
    prompt: |
      Guess before any theory. A mountaineering coach says: "No one gets real courage without facing real danger, and courage is worth having." Suppose that is true. Does it show that every particular danger and every particular pain, such as a fawn burned and suffering for days, was needed for some good?
    options:
      - text: 'No: it might show that some hardship is needed for courage, but not that this amount, or this case, was needed.'
        correct: true
        feedback: |
          This is the central difficulty of every proposal in this lesson: a good can need *some* cost without needing *this* cost. Keep it as the test.
      - text: 'Yes: if courage needs danger, then every danger is justified.'
        feedback: |
          That slides from "some" to "all". A smaller danger, or a safer training, might have given the same courage.
      - text: 'No: courage is not a real good, so nothing is justified.'
        feedback: |
          That denies the premise we agreed to suppose. The question is not whether courage is good but whether its goodness reaches this pain.
    explanation: |
      Hold on to the guess. The proposals below are attempts to name a good that needs the evils we see, and each is tested by whether the cost is really required.

  - type: text
    id: defense-theodicy
    title: "Defense or theodicy?"
    body: |
      Recall the logical problem of evil. Write $G$ for "an all-powerful, wholly good God exists" and $E$ for "evil exists". To answer a charge of inconsistency one shows that $G$ and $E$ can both be true, with a story that need only be possible: a **defense**.

      The evidential problem asks more. According to the Stanford Encyclopedia, a **theodicy** says that for every actual evil one can describe a state of affairs it is reasonable to believe exists and that would give God a morally sufficient reason for allowing it. A defense, in the evidential setting, need only show that it is likely such reasons exist, without saying what they are.

      Write $I$ for the hypothesis of indifference. If a theodicy worked, the suffering $E$ we see would be about as expected on $G$ as on $I$, and the odds form

      $$\frac{P(G\mid E)}{P(I\mid E)}=\frac{P(E\mid G)}{P(E\mid I)}\cdot\frac{P(G)}{P(I)}$$

      would no longer tilt against $G$.

  - type: mcq
    id: bayes-link
    title: "What a theodicy would change"
    prompt: |
      In the odds form above, $G$ is "a good God exists", $I$ is "indifference" and $E$ is the suffering we observe. Which term does a successful theodicy mainly try to raise?
    options:
      - text: '$P(E\mid G)$: how likely the suffering is if God exists, because God would then have reasons to allow it.'
        correct: true
        feedback: |
          Yes. A theodicy says: given the good that needs it, $E$ is just what we should expect on $G$.
      - text: '$P(G)$: the prior probability of God, before looking at suffering.'
        feedback: |
          The prior comes from other arguments and from experience. A theodicy works on the likelihood, not the prior.
      - text: '$P(E\mid I)$: how likely the suffering is if no one cares.'
        feedback: |
          Raising this would help the atheist. A theodicy tries to raise the likelihood under $G$.
    explanation: |
      This also shows what a theodicy risks: the more specific its good, the more it can be tested against cases it does not reach.

  - type: build
    id: greater-good
    title: "The greater-good principle"
    prompt: |
      A **greater-good theodicy** says God allows an evil $e$ only if some good $g$ both outweighs it and could not be had without permitting it. Let $V(x)$ be the value of $x$ and $\mathrm{Needs}(g,e)$ mean "$g$ cannot be had without $e$". Build the condition.
    prefix: '\mathrm{Allowed}(e)\Rightarrow'
    tiles: ['\exists g', 'V(g)>V(e)', '\land', '\mathrm{Needs}(g,e)', '\forall g', '\lor', 'V(g)<V(e)']
    answers:
      - ['\exists g', 'V(g)>V(e)', '\land', '\mathrm{Needs}(g,e)']
      - ['\exists g', '\mathrm{Needs}(g,e)', '\land', 'V(g)>V(e)']
    wrong:
      - answer: ['\exists g', 'V(g)>V(e)', '\lor', '\mathrm{Needs}(g,e)']
        feedback: |
          With "or", an outweighing good that does not need the evil at all would do. Then God could have the good without the cost, and the evil would be needless.
      - answer: ['\forall g', 'V(g)>V(e)', '\land', '\mathrm{Needs}(g,e)']
        feedback: |
          "For all goods" is far too strong: one good that outweighs and needs the evil is enough.
    hint: 'One good, which is both bigger than the evil and unobtainable without it.'
    explanation: |
      Both clauses matter. The first (outweighing) is about value; the second (needing) is about whether a cheaper route existed. Most disputes are about the second.

  - type: mcq
    id: lesser-cost
    title: "The test: could a lesser cost have done?"
    prompt: |
      A theodicy claims: "The good $g$ is patient endurance, and it needs suffering." A critic replies: "Endurance can be gained from a headache; a fawn's five days in a fire are far more than endurance needs." Which clause of the greater-good principle is the critic attacking?
    options:
      - text: 'The need clause: a smaller evil would have secured the same good, so this evil is not needed.'
        correct: true
        feedback: |
          Yes. The critic grants that $g$ is good and may need some suffering, and denies that it needs *this much*.
      - text: 'The outweighing clause: endurance is worth less than suffering.'
        feedback: |
          The critic did not compare values; the point is about a cheaper route to the same good.
      - text: 'Neither: the critic is only expressing sympathy.'
        feedback: |
          It is an argument: it names a specific alternative (a headache) that would have done the work.
    explanation: |
      This is why cases of extreme or useless-looking suffering are the stress test for any greater-good proposal. The defender may answer that a world with graded, predictable suffering would remove the point of the exercise; the critic asks how that reply fits a fawn that no one witnesses.

  - type: text
    id: soul-making
    title: "Soul-making"
    body: |
      According to **John Hick** (1922-2012), a philosopher of religion, the idea goes back to **Irenaeus**, a second-century bishop of Lyon, and Hick identified it as the Irenaean theodicy in *Evil and the God of Love* (1966). Irenaeus, in the work *Against Heresies* (c. 180), pictures humans as not created finished: made in God's "image", with the "likeness" still to be grown into.

      Hick's version, in essence: God's purpose in creating was to bring free moral agents to maturity, which cannot be handed over ready-made, so the world is a "vale of soul-making". Two features: people must meet real hardship and real choices, and God stays at an **epistemic distance** (not overwhelmingly evident), so that faith is a free response. Hick presents this against the older Augustinian story of a perfect creation followed by a fall, which he found hard to square with evolution.

      Hick's hope, according to the Internet Encyclopedia of Philosophy, is that God will eventually draw all people to himself, so the process is forward-looking.

  - type: mcq
    id: soul-explains
    title: "What soul-making explains"
    prompt: |
      A man's long illness leads him to patience and compassion for others. Which of these is the *best* use of soul-making according to Hick's idea?
    options:
      - text: 'Hardship can be the setting in which free agents grow in character, a good that a comfortable, risk-free world could not hand over ready-made.'
        correct: true
        feedback: |
          Yes: character built through one's own response to difficulty is the good the theodicy points to.
      - text: 'Every illness makes its sufferer a better person.'
        feedback: |
          Hick's claim is not that suffering always improves. It is that a world in which growth is possible needs real difficulty. Some people are crushed, and the theodicy must say something about them.
      - text: 'Suffering is good in itself, so more is always better.'
        feedback: |
          Soul-making treats suffering as a cost for the sake of growth, not as good in itself.
    explanation: |
      The theodicy is strongest where suffering and growth can be linked: moral and spiritual difficulties, dangers faced and overcome.

  - type: mcq
    id: soul-strains
    title: "Where soul-making strains"
    prompt: |
      Which of these are objections commonly raised to soul-making? Select all that apply.
    multiple: true
    options:
      - text: 'Animal suffering, including predation that goes back millions of years, seems to serve no moral growth.'
        correct: true
      - text: 'Young children who die, or people who die before developing morally, do not seem to gain what the theodicy values.'
        correct: true
      - text: 'Some evils destroy the human spirit rather than building it.'
        correct: true
      - text: 'It cannot be stated clearly, because "character" is a meaningless word.'
        feedback: |
          Critics do not say this. The objections grant that character growth is real and ask whether it reaches these cases.
    explanation: |
      These three objections are given in the Stanford Encyclopedia and elsewhere (Tooley on animals and children). A defender may answer with the afterlife or with the claim that the pattern as a whole serves growth; critics ask whether that fits the individual sufferer.

  - type: text
    id: augustine
    title: "Free will and privation"
    image:
      src: img/augustine.webp
      alt: "A 6th-century fresco portrait of Augustine of Hippo"
      caption: "Augustine of Hippo (354-430), in the earliest known portrait, a 6th-century fresco in the Lateran in Rome; he argued against the Manichaean view that evil is an independent substance."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Augustine_Lateran.jpg"
    body: |
      **Augustine** (354-430), bishop of Hippo, was for nine years a hearer in the Manichaean sect, which explained evil by a rival evil power. According to the Stanford Encyclopedia he later rejected an evil substance, adopting the view that evil is **privation**: a lack or corruption of the good, not a thing in itself (*De natura boni*, 399).

      On moral evil he argued, in *De libero arbitrio* (begun 388), that free will is a great good but not an absolute one, so it can be misused and become the source of moral evil. This is the older line behind the free-will defense of Plantinga: God is not the author of the wrong choice.

      Two critics' replies. To the free-will line: natural evils such as disease and earthquakes do not come from human choices, and valuing freedom does not mean we think nobody should ever intervene. To the privation view: a critic may ask whether calling pain a "lack" fits the fact that pain is felt as something present.

  - type: mcq
    id: augustine-critic
    title: "Which reply reaches the fawn?"
    prompt: |
      According to Augustine's free-will line, moral evil comes from creatures misusing their freedom. A lightning-caused fire burns a fawn. Which statement is the fairest?
    options:
      - text: 'The free-will line explains wrongdoing but not obviously this suffering, since no human choice caused it; defenders have proposed non-human agents, which critics find speculative.'
        correct: true
        feedback: |
          Yes. Some defenders (the Stanford Encyclopedia mentions Lewis and Plantinga) have suggested supernatural agents; the entry judges this very improbable. Others say nothing, or turn to other theodicies.
      - text: 'It explains the fawn completely, because all suffering comes from human choice.'
        feedback: |
          That is false of this case: the fire was started by lightning and nobody chose it.
      - text: 'It shows that the fawn did not really suffer.'
        feedback: |
          The privation view says evil is a lack of good, but it does not deny that suffering is felt; the objection is that it seems to fit pain poorly.
    explanation: |
      This is why the free-will line is paired, in most discussions, with other proposals for natural evil.

  - type: order
    id: skeptical-order
    title: "Skeptical theism: a rival strategy"
    prompt: Put the skeptical-theist reply to the evidential argument in order.
    steps:
      - 'The argument says: we find no good that justifies the fawn''s suffering, so probably there is none.'
      - 'Skeptical theist: if God exists, God''s knowledge of goods and their links far exceeds ours.'
      - 'So even if a justifying good existed, we would probably not see it.'
      - 'So our failure to find one is weak evidence that there is none.'
      - 'No particular good is named: the reply is a defense, not a theodicy.'
    hint: 'Start with the claim being attacked, end by saying what the reply does not do.'
    explanation: |
      Compare soul-making: it names a good and can be tested against cases. Skeptical theism names none and so cannot be refuted by a counterexample, which is both its strength and, for critics, its weakness.

  - type: mcq
    id: skeptical-rival
    title: "Rival, not ally?"
    prompt: |
      A theodicy says "here is the reason". Skeptical theism (Wykstra, 1984) says "we should not expect to see the reason". What is the tension between them?
    options:
      - text: 'A theodicy that names a good invites the test "does it reach this case?", while skeptical theism says our judgments about such tests are unreliable; critics say skeptical theism also weakens other judgments about God.'
        correct: true
        feedback: |
          Yes. Many thinkers use both: theodicies for some evils, skeptical theism for the rest. Critics (Rowe, 2006) ask whether the doubt then spreads to what God would reveal or provide.
      - text: 'They contradict each other, so a believer must choose one.'
        feedback: |
          Not a contradiction: one can think some reasons are accessible and others are not.
      - text: 'Skeptical theism is a theodicy that names the reason in secret.'
        feedback: |
          It names no reason. It makes a claim about what we can know.
    explanation: |
      The price, as in the lesson The Evidential Problem of Evil: if our grasp of God's reasons is so weak, why trust our expectations of what God would do anywhere else?

  - type: text
    id: process
    title: "Process theology: a different God"
    image:
      src: img/whitehead.webp
      alt: "Black and white photograph of the philosopher Alfred North Whitehead"
      caption: "Alfred North Whitehead (1861-1947), whose book Process and Reality (1929) is the root of process theology."
      credit: "Wellcome Collection, CC BY 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Alfred_North_Whitehead._Photograph._Wellcome_V0027330_(cropped).jpg"
    body: |
      The previous proposals keep the classical God and look for reasons. **Process theology** revises the God. It begins with **Alfred North Whitehead** (1861-1947) and his *Process and Reality* (1929). According to the Stanford Encyclopedia, a central claim is that God acts by **persuasion, not coercion**: coercion, meaning one actual entity unilaterally determining another's decision, is something no individual can do in process metaphysics.

      **David Ray Griffin** (1939-2022) applied this to evil in *God, Power, and Evil: A Process Theodicy* (1976). He warns against the "omnipotence fallacy": the assumption that whatever is logically possible can be brought about by an omnipotent being acting alone. Process thinkers hold that a world with real good and real risk is better than a riskless one, and that God shares in the suffering.

      So God could not alone have stopped the fire or the fawn's pain; the cost is the classical claim of unlimited power.

  - type: mcq
    id: process-cost
    title: "The price of the process view"
    prompt: |
      According to process theologians, God cannot unilaterally prevent evils. What objection do traditional theists raise?
    options:
      - text: 'It denies God the power to prevent even gratuitous suffering, which a God worthy of worship (on the classical view) should have; and some ask whether lawful nature already shows divine coercion.'
        correct: true
        feedback: |
          Yes, as the Stanford Encyclopedia reports: the objection is that the classical God has this power and then must explain why it is not used, while the process God never had it. Process replies that this classical power is the mistake.
      - text: 'It denies that God exists.'
        feedback: |
          Process theology holds that God exists, but with a different kind of power.
      - text: 'It makes God cause the fawn''s suffering.'
        feedback: |
          Quite the opposite: God is not the cause of the fire; the dispute is about what God could prevent.
    explanation: |
      Here the debate has moved from "what reasons?" to "what kind of God?". Thoughtful people part ways on whether to revise the concept of God or keep it and answer harder.

  - type: mcq
    id: natural-evil
    title: "The fawn: who reaches it?"
    prompt: |
      A fawn, burned by a lightning-started fire, suffers for days. No human freely chose this. Which pairing of proposal and difficulty is fair?
    options:
      - text: 'Soul-making: the fawn does not grow in character. Free will: no human choice. Skeptical theism: names no reason but denies we should expect to see one. Process: God could not have prevented it alone.'
        correct: true
        feedback: |
          Yes. Each proposal reaches the fawn in a different way, and each pays a different price. Whether any reaches it well is a live debate.
      - text: 'Soul-making explains the fawn fully, because suffering always builds character.'
        feedback: |
          Animals are the standard objection to soul-making.
      - text: 'The free-will defense explains the fawn fully, since freedom explains everything.'
        feedback: |
          Free will explains wrongdoing, not a lightning fire.
    explanation: |
      Natural evil is the stress test. Compare the lesson The Evidential Problem of Evil: Rowe chose the fawn because no free choice explains it.

  - type: text
    id: adams
    title: "Adams: defeat within a life"
    image:
      src: img/adams.webp
      alt: "Photograph of the philosopher Marilyn McCord Adams"
      caption: "Marilyn McCord Adams (1943-2017), philosopher and Episcopal priest, who argued that horrendous evils must be defeated within the sufferer's own life."
      credit: "Kaihsu Tai, CC BY 2.5, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:MarilynMcCordAdams20060625.jpg"
    body: |
      **Marilyn McCord Adams** (1943-2017) wrote *Horrendous Evils and the Goodness of God* (1999). She defines **horrendous evils** as evils whose doing or suffering gives a person prima facie reason to doubt whether their life could be a great good to them on the whole.

      Her claim, in essence: for such evils it is not enough to say that a good elsewhere outweighs them. God's goodness to each person requires that these evils be **defeated** in that person's own life, by giving them positive meaning through unity with a great enough good within that life. According to a standard summary, she appeals to Christian resources for how this can happen.

      This changes the test: the question is no longer "does some global good need this evil?" but "can this evil be woven into a life that is good for the one who lived it?"

  - type: mcq
    id: adams-test
    title: "Defeat versus outweighing"
    prompt: |
      A theodicy says: "A child's torture is outweighed by the great good it brings the world." Adams would press which objection?
    options:
      - text: 'That a good elsewhere, even a large one, does not make the victim''s own life good on the whole; for horrendous evils the good must reach the sufferer inside that life.'
        correct: true
        feedback: |
          Yes. Outweighing adds goods across lives; defeat asks that this life, the one that contained the evil, be good on the whole.
      - text: 'That horrendous evils do not exist.'
        feedback: |
          Adams takes them to exist and be very bad. Her point is about what answering them requires.
      - text: 'That the good is too small to outweigh.'
        feedback: |
          Size is not her point: even a very large global good, she holds, does not suffice.
    explanation: |
      Critics reply that defeat may require an afterlife or religious resources some do not accept; defenders say a God worth the name would supply them. Labelled: faith commitment, not established fact.

  - type: mcq
    id: trap
    title: "Trap: explaining is not excusing"
    prompt: |
      Someone says: "If a theodicy explains why God allowed the fawn's suffering, then it shows the suffering was not really bad." Is that right?
    options:
      - text: 'No: a theodicy says the evil was real, and that God had a sufficient reason to allow it. Real evil, with a reason, is still evil.'
        correct: true
        feedback: |
          Yes. Greater-good, soul-making and defeat views all call the evil a real cost. Some critics add that an explanation can still feel like an insult to a sufferer; that is a moral objection to offering it, not a logical one.
      - text: 'Yes: if there is a good reason, the thing is not an evil.'
        feedback: |
          Then there would be nothing to explain. A surgeon's cut is painful and permitted for a reason; the pain is still a cost.
      - text: 'No: no explanation could ever exist.'
        feedback: |
          Whether one exists is exactly the debate; this card is only about what an explanation would mean.
    explanation: |
      Separate three claims: the evil is real; it has a justifying reason; the reason is known to us. Each theory in this lesson affirms the first, differs on the second, and treats the third differently.

  - type: mcq
    id: resolve
    title: "Resolve the hook"
    prompt: |
      Back to the coach, who says courage needs some real danger: does that show that a fawn's days of suffering in a fire were needed? According to this lesson, what does each family of reply do with the gap between "some" and "this"?
    options:
      - text: 'Theodicies try to show the need (soul-making, free will); skeptical theism says we cannot see the need; process views deny God could prevent it alone; Adams adds that the good must reach the sufferer.'
        correct: true
        feedback: |
          Yes. Each is an attempt to close the gap between "some hardship" and "this hardship", and each pays a price: reach, speculation, a revised God, or an appeal to faith.
      - text: 'All of them prove the gap does not exist.'
        feedback: |
          None claims a proof. They are proposals, each with strains.
      - text: 'All of them concede the gap cannot be closed.'
        feedback: |
          Skeptical theism and process views do not accept that either; they dissolve it differently.
    explanation: |
      Where thoughtful people part ways: how much weight to give a single stark case, whether the goods named are worth their price, and whether to revise the concept of God or keep it and accept mystery.

  - type: text
    id: summary
    body: |
      **Next:** divine hiddenness. Instead of suffering, Schellenberg asks why a loving God would leave some people without belief even when they are open to it, and what the replies about freedom and relationship say.
