outroTitle: Level 7 in one picture
outro: |
  The **logical problem** says $O$, $G$ and $E$ are inconsistent (bridge $(O\land G)\Rightarrow\lnot E$); a **defense** shows only that $\Diamond(O\land G\land E)$, and the **free-will defense** does so with counterfactuals of freedom and transworld depravity, claimed as possible. The **evidential problem** (Rowe, Draper) shifts the odds when $P(E\mid G)<P(E\mid I)$; replies (**soul-making**, **skeptical theism** as a defense, **process theology**, Adams's defeat within a life) each pay a price. **Hiddenness** runs $G\Rightarrow\lnot D$ by modus tollens. **Parsimony** is a tie-breaker (Bayes factor 20 in the toy), the **burden of proof** attaches to claims, the **wager** is practical, and **agnosticism** separates belief from knowledge. People part ways on which premise, prior or value to accept, not on the logic.
