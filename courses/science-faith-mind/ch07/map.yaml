id: ch07-map
title: "Content Map: Evil, Hiddenness and Doubt"
kind: map
name: Level 7, Evil, Hiddenness and Doubt (the logical problem of evil, defense versus theodicy, the free-will defense, the evidential problem, replies to evil, divine hiddenness, parsimony, the burden of proof, Pascal's wager, agnosticism)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 7 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a logical claim confused with a probable one, a defense called a theodicy, "and" swapped for "or", a burden given to one side only), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: logical
    title: Logical problem of evil
    row: 1
    col: 1
    body: |
      $O$ = God is omnipotent, $G$ = God is wholly good, $E$ = evil exists. Mackie (1955) adds two principles (a good being eliminates evil as far as it can; an omnipotent being has no limits), giving the bridge $(O\land G)\Rightarrow\lnot E$. Then $O$ **and** $G$ **and** $E$ cannot all hold: the claim is **inconsistency**.
    decoys:
      - body: |
          $O$ = God is omnipotent, $G$ = God is wholly good, $E$ = evil exists. Mackie (1955) adds two principles, giving the bridge $(O\lor G)\Rightarrow\lnot E$. Then $O$ **or** $G$ together with $E$ cannot hold: the claim is **inconsistency**.
        feedback: |
          The bridge needs "and": evil is excluded only by a being that is both able and willing to prevent it. With "or", a God who is merely good but weak would already contradict $E$, which Mackie never claimed.
      - body: |
          $O$ = God is omnipotent, $G$ = God is wholly good, $E$ = evil exists. Mackie (1955) shows that $O$, $G$ and $E$ **alone** contradict each other, with **no added principles**: the claim is **inconsistency**.
        feedback: |
          The three claims alone are not contradictory. The contradiction appears only with the added principles about what a good and an omnipotent being would do, and that is exactly where a theist can push back.
    explanation: |
      The starting point of the level: a claim about logic, not about probability. It is answered by showing a possibility.

  - id: defense
    title: Defense versus theodicy
    row: 1
    col: 2
    body: |
      To refute "inconsistent" it is enough to show the set is **consistent**: a story that is merely **possible**, $\Diamond(O\land G\land E)$. That is a **defense**. A **theodicy** goes further and claims the **real reasons** God has for permitting evil, so it carries a heavier burden.
    decoys:
      - body: |
          To refute "inconsistent" the story must be **true**, so that $O\land G\land E$ holds in the actual world. That is a **defense**. A **theodicy** only needs the story to be **possible**, so it carries a lighter burden.
        feedback: |
          Reversed. Consistency needs only a possible world where all three claims hold, and the possible-story answer is the defense. A theodicy claims the actual reasons, so it is the more demanding of the two.
      - body: |
          To refute "inconsistent" it is enough to show the set is **consistent**, $\Diamond(O\land G\land E)$, and the story must also be **probable** in the actual world. That is a **defense**. A theodicy names the real reasons.
        feedback: |
          Probability is a different question. For the logical problem, possibility is enough; whether the evil we see is likely given God is the evidential problem, met next.
    explanation: |
      This distinction is reused all level: skeptical theism, for instance, will turn out to be a defense, not a theodicy.

  - id: freewill
    title: Free-will defense
    row: 1
    col: 3
    body: |
      Plantinga (1974): God cannot **cause** a free choice. Whether a free creature **would** choose right in a situation is a **counterfactual of freedom**, true independently of God's will, and it limits the **feasible** worlds $F$. **Transworld depravity**: $\forall w\in F:\mathrm{Free}(c,w)\Rightarrow\mathrm{Wrong}(c,w)$. It is claimed only to be **possible**.
    decoys:
      - body: |
          Plantinga (1974): God **can cause** a free choice, but chooses not to. Whether a free creature would choose right is a **counterfactual of freedom**, set by God's will. **Transworld depravity**: $\forall w\in F:\mathrm{Free}(c,w)\Rightarrow\mathrm{Wrong}(c,w)$. It is claimed only to be **possible**.
        feedback: |
          A caused choice is not free, so God cannot cause it and keep it free. And the counterfactual of freedom is true or false independently of God's will, which is why it can make some worlds unattainable.
      - body: |
          Plantinga (1974): God cannot cause a free choice. Whether a free creature would choose right is a **counterfactual of freedom**, independent of God's will. **Transworld depravity**: $\forall w\in F:\mathrm{Free}(c,w)\Rightarrow\mathrm{Wrong}(c,w)$. It is claimed to be **true** of every creature.
        feedback: |
          A defense needs only possibility. Plantinga claims no more than that transworld depravity is possible; claiming it true would turn the defense into a theodicy and make it far harder to defend.
    explanation: |
      The best-known answer to the logical problem. It leaves natural evil, and the evidential problem, untouched.

  - id: evidential
    title: Evidential problem of evil
    row: 2
    col: 1
    body: |
      Suffering is not claimed to contradict God, only to be **evidence** against. Rowe (1979): probably there are **pointless evils** (the fawn), and if $G$ then there are none. In **odds form**, with $I$ = indifference: $\frac{P(G\mid E)}{P(I\mid E)}=\frac{P(E\mid G)}{P(E\mid I)}\cdot\frac{P(G)}{P(I)}$. It bites when $P(E\mid G)<P(E\mid I)$.
    decoys:
      - body: |
          Suffering is claimed to **contradict** God. Rowe (1979): there **certainly are** pointless evils, and if $G$ then there are none. In **odds form**, with $I$ = indifference: $\frac{P(G\mid E)}{P(I\mid E)}=\frac{P(E\mid G)}{P(E\mid I)}\cdot\frac{P(G)}{P(I)}$. It bites when $P(E\mid G)<P(E\mid I)$.
        feedback: |
          That is the logical problem again. Rowe's claim is about probability: "probably" there are pointless evils, so the conclusion is only that $G$ is probably false, and it rests on an inference from "we see no reason".
      - body: |
          Suffering is not claimed to contradict God, only to be **evidence** against. Rowe (1979): probably there are pointless evils, and if $G$ then there are none. In **odds form**: $\frac{P(G\mid E)}{P(I\mid E)}=\frac{P(E\mid G)}{P(E\mid I)}\cdot\frac{P(G)}{P(I)}$. It bites when $P(E\mid G)>P(E\mid I)$.
        feedback: |
          The inequality is reversed. Evidence lowers $G$ against $I$ when it is less expected on $G$ than on $I$, that is, when $P(E\mid G)<P(E\mid I)$.
    explanation: |
      The same event, suffering, is used differently: not to refute God by logic, but to shift the odds.

  - id: replies
    title: Replies to the evidential problem
    row: 2
    col: 2
    body: |
      **Soul-making** (Hick): hardship develops free moral agents; it strains on animals and horrendous evils. **Skeptical theism**: we would probably not grasp God's reasons, so it names none: a **defense**. **Process theology**: God persuades, never controls. **Adams**: horrendous evils must be **defeated within the person's life**, not just outweighed elsewhere.
    decoys:
      - body: |
          **Soul-making** (Hick): hardship develops free moral agents; it strains on animals and horrendous evils. **Skeptical theism**: it names the real reasons God has: a **theodicy**. **Process theology**: God persuades, never controls. **Adams**: horrendous evils must be defeated within the person's life.
        feedback: |
          Skeptical theism says the opposite of naming reasons: that if God has reasons we would probably not grasp them. It therefore counts as a defense, which attacks the claim that $E$ is much less likely on $G$ than on $I$.
      - body: |
          **Soul-making** (Hick): hardship develops free moral agents; it strains on animals and horrendous evils. **Skeptical theism**: we would probably not grasp God's reasons: a **defense**. **Process theology**: God can do anything and chooses to persuade. **Adams**: a good elsewhere is enough to **outweigh** any evil.
        feedback: |
          Two slips. Process thinkers drop the claim that God can do anything: God acts only by persuasion. And Adams argued that outweighing by goods elsewhere is not enough for horrendous evils; they need defeat within that person's life.
    explanation: |
      Each reply buys something and pays something. The map has them in one box because they all answer the same odds ratio.

  - id: hidden
    title: Divine hiddenness
    row: 2
    col: 3
    body: |
      Schellenberg (1993): a perfectly loving God is always open to relationship with every capable person, and a relationship needs belief. So $G\Rightarrow\lnot D$, where $D$ = **nonresistant nonbelievers** exist. Since $D$ is claimed, **modus tollens** gives $\lnot G$. Replies: freedom and **epistemic distance**, relationship, skeptical theism.
    decoys:
      - body: |
          Schellenberg (1993): a perfectly loving God is always open to relationship with every capable person, and a relationship needs belief. So $G\Rightarrow\lnot D$, where $D$ = **suffering exists**. Since $D$ is claimed, **modus tollens** gives $\lnot G$. Replies: freedom, relationship, skeptical theism.
        feedback: |
          Hiddenness is not the problem of evil. $D$ is the existence of sincere, non-resisting nonbelief, not of suffering, so the evil replies do not automatically answer it.
      - body: |
          Schellenberg (1993): a perfectly loving God is always open to relationship with every capable person, and a relationship needs belief. So $G\Rightarrow\lnot D$, where $D$ = **nonresistant nonbelievers** exist. Since $D$ is claimed, **affirming the consequent** gives $\lnot G$.
        feedback: |
          The form is modus tollens: from $G\Rightarrow\lnot D$ and $D$ we deny the antecedent's truth, $\lnot G$. Affirming the consequent is the invalid pattern, and the argument does not use it.
    explanation: |
      A different starting fact (non-belief, not pain) with the same style of reply: freedom, and doubt about what we can judge.

  - id: parsimony
    title: Parsimony
    row: 3
    col: 1
    body: |
      The razor (named after Ockham) prefers the hypothesis that **posits less**, but only as a **tie-breaker** when the fit is about equal. A narrow rule $S$ (5 of 100 numbers) against a flexible rule $C$ gives Bayes factor $\frac{1/5}{1/100}=20$ if the data fall inside it, and $S$ is **dead** if they fall outside.
    decoys:
      - body: |
          The razor (named after Ockham) prefers the hypothesis that **posits less**, and it **overrides fit** when the two disagree. A narrow rule $S$ (5 of 100 numbers) against a flexible rule $C$ gives Bayes factor $\frac{1/5}{1/100}=20$ if the data fall inside it, and $S$ is dead if they fall outside.
        feedback: |
          Simplicity cannot rescue a bad fit. If $P(E\mid S)$ is tiny, no prior advantage repairs it; simplicity decides only when the fit is about equal.
      - body: |
          The razor (named after Ockham) prefers the hypothesis that **posits less**, but only as a tie-breaker when the fit is about equal. A narrow rule $S$ (5 of 100 numbers) against a flexible rule $C$ gives Bayes factor $\frac{1/100}{1/5}=\frac1{20}$ if the data fall inside it.
        feedback: |
          The ratio is upside down. The narrow rule makes data inside it more likely ($\frac15$ against $\frac1{100}$), so the factor favours $S$ by 20. A narrow hypothesis wins when the data fall inside it.
    explanation: |
      The toy machine shows why simplicity is a tie-breaker and why a narrow hypothesis is risky: it can be killed.

  - id: burden
    title: Burden of proof
    row: 3
    col: 2
    body: |
      Flew (1972): start from a **presumption of atheism** in the sense of **not believing**, as a court presumes innocence. Critics: the right default depends on the **prior**. The burden attaches to **claims**, positive or negative: "God exists" and "no God exists" both owe reasons. **Methodological** naturalism is a method; **metaphysical** naturalism is a claim.
    decoys:
      - body: |
          Flew (1972): start from a **presumption of atheism** in the sense of **not believing**, as a court presumes innocence. Critics: the right default depends on the prior. The burden attaches to **the side that believes**; a denial owes nothing. **Methodological** naturalism is a method; **metaphysical** naturalism is a claim.
        feedback: |
          Burden attaches to claims, not to sides. Saying "there is no God" or "there is nothing supernatural" is itself an assertion about what exists and owes reasons too.
      - body: |
          Flew (1972): start from a **presumption of atheism** in the sense of **denying God**, as a court presumes innocence. Critics: the right default depends on the prior. The burden attaches to **claims**. **Metaphysical** naturalism is a method; **methodological** naturalism is a claim.
        feedback: |
          Two slips. Flew's presumption was about not believing, not about denying. And the naturalisms are swapped: methodological naturalism is the working policy of science, metaphysical naturalism is the claim about what exists.
    explanation: |
      A rule about who must give reasons, which both sides can use against each other.

  - id: wager
    title: Pascal's wager
    row: 3
    col: 3
    body: |
      Act (wager for or against) versus state (God exists or not): $\mathrm{EV}=p\cdot(\text{payoff if God})+(1-p)\cdot(\text{payoff if not})$. Break-even $p=\frac{c}{g+c}$. With an **infinite reward**, any $p>0$ gives infinite EV. Critics: **many gods** (two infinite rewards cancel the argument), mixed strategies, $p=0$. It is **practical**, not a proof.
    decoys:
      - body: |
          Act versus state: $\mathrm{EV}=p\cdot(\text{payoff if God})+(1-p)\cdot(\text{payoff if not})$. Break-even $p=\frac{g}{g+c}$. With an **infinite reward**, any $p>0$ gives infinite EV. Critics: many gods, mixed strategies, $p=0$. It is **practical**, not a proof.
        feedback: |
          Gain and cost are swapped. Setting $\mathrm{EV}=pg-(1-p)c=0$ gives $p=\frac{c}{g+c}$; for $g=1000$, $c=10$ this is about $0.0099$, and a bigger reward lowers the chance needed.
      - body: |
          Act versus state: $\mathrm{EV}=p\cdot(\text{payoff if God})+(1-p)\cdot(\text{payoff if not})$. Break-even $p=\frac{c}{g+c}$. With an **infinite reward**, any $p>0$ gives infinite EV. Critics: many gods. It is a **proof that God exists**.
        feedback: |
          The wager is about what to do under uncertainty, not about whether God exists. Its step from premises to conclusion is the least contested part; the debate is over the table, the infinity and the probabilities.
    explanation: |
      The decision-theory cousin of the level's probability arguments: the question changes from "what is likely?" to "what should I do?".

  - id: agnostic
    title: Agnosticism
    row: 4
    col: 2
    body: |
      Huxley (about 1869): **knowledge** is a separate question from **belief**, so one can be an agnostic theist or atheist. **Strong**: nobody can know. **Weak**: I do not know. **Practical**: it makes no difference to how I live. Balanced evidence, $\frac{P(E\mid G)}{P(E\mid\lnot G)}=1$, leaves the odds at the **prior**. Staying out is still an **act**.
    decoys:
      - body: |
          Huxley (about 1869): **belief** and knowledge are the same question, so an agnostic is someone halfway between theist and atheist. **Strong**: nobody can know. **Weak**: I do not know. **Practical**: it makes no difference to how I live. Balanced evidence leaves the odds at the prior.
        feedback: |
          Belief and knowledge are separate questions, so agnosticism is not a midpoint on the belief scale. A person can believe $G$ and say it is not known, or lack belief and say the same.
      - body: |
          Huxley (about 1869): **knowledge** is a separate question from **belief**. **Strong**: I do not know, and perhaps someone could. **Weak**: nobody can know. **Practical**: it makes no difference to how I live. Balanced evidence leaves the odds at the prior.
        feedback: |
          Strong and weak are swapped. Strong agnosticism is the more demanding claim, that nobody can know even in principle; weak agnosticism says only that I do not know and perhaps someone could.
    explanation: |
      The level's closing stance: what to do with open questions, honestly, without pretending to certainty.

edges:
