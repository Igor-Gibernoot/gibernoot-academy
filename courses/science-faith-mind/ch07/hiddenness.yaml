id: ch07-hiddenness
title: "Divine Hiddenness"
kind: concept
own: |
  The setting: the **hiddenness argument** does not start from suffering. It starts from sincere non-belief. Write $G$ for "a perfectly loving, personal God exists" and $D$ for "there are people who are capable of a personal relationship with God, are not resisting God, and yet do not believe God exists". Such people are **nonresistant nonbelievers**. According to J. L. Schellenberg (*Divine Hiddenness and Human Reason*, 1993), $G$ and $D$ do not fit together.
  - **The argument.** A perfectly loving God is always open to relationship with every capable person; a relationship needs belief that the other exists; so if $G$ were true, nonresistant nonbelief would not occur. Since it seems to occur, $G$ is false:
  {{ $$G\Rightarrow\lnot D$$ }}
  and $D$ is claimed, so by modus tollens
  {{ $$(G\Rightarrow\lnot D)\ \text{and}\ D\ \Rightarrow\ \lnot G$$ }}
  The logic is valid; critics reject a premise (usually "relationship needs belief", "God is always open in this way", or "$D$ really occurs").
  - **Replies from freedom (Hick, Swinburne, Murray).** According to these authors, a clearer presence of God could undermine free moral choice or amount to coercion, so God keeps an epistemic distance. It strains on why such freedom needs *nonresistant* people to lack belief, and on the many believers who are not thereby unfree.
  - **Reply from relationship (Moser).** According to Moser, evidence of God is *purposively available*: offered in ways fitted to God's aim of transforming a person's will, not as neutral proof. It strains on whether it quietly makes all non-belief resistance.
  - **Skeptical theism.** If God has reasons we cannot grasp for permitting nonresistant nonbelief, then $D$ is weaker evidence against $G$. Its price (met in the lesson on evil): the same doubt weakens what we may infer about what God would reveal.
  - **Evidence form.** Let $\lnot G$ mean "no such God". Then the odds update on $D$ is
  {{ $$\frac{P(G\mid D)}{P(\lnot G\mid D)}=\frac{P(D\mid G)}{P(D\mid\lnot G)}\cdot\frac{P(G)}{P(\lnot G)}$$ }}
  With $P(G)=P(\lnot G)=0.5$, $P(D\mid G)=0.2$, $P(D\mid\lnot G)=0.8$ the odds are
  {{ $$\frac{0.2}{0.8}\cdot 1=\frac14,\quad P(G\mid D)=0.2$$ }}
   A reply that raises $P(D\mid G)$ to $0.6$ lifts it to about $0.43$.
  - **Not the problem of evil.** Evil asks why a good God allows *suffering*; hiddenness asks why a loving God allows *the absence of belief that relationship needs*. Answers to one do not automatically answer the other.
cards:
  - type: mcq
    id: hook
    title: "Guess: the searching child"
    prompt: |
      Guess before any theory. A loving parent has a child who sincerely wants to know whether the parent exists, and who has searched honestly for years without finding any sign. Which verdict seems most natural to you about a parent who allows this for as long as the child lives?
    options:
      - text: 'It is hard to square with deep love: love seeks to be known by the one it loves.'
        correct: true
        feedback: |
          This is the intuition behind the hiddenness argument. Keep it as a hypothesis, not a proof: the replies below say a parent (or a God) might have reasons that the child cannot see.
      - text: 'It is fine: a parent owes a child nothing of that kind.'
        feedback: |
          This is a possible reply, but it does not fit the setup: we said the parent *loves* the child and the child *sincerely seeks*. The question is what love involves.
      - text: 'It proves the parent does not exist.'
        feedback: |
          Too fast. Even if the intuition is right, a parent might be unable to reach the child, or might have reasons we cannot see. The argument must say why those do not work.
    explanation: |
      The guess is the seed of the hiddenness argument. We will make it exact, then test it against the best replies, and return to the child at the end.

  - type: text
    id: schellenberg
    title: "Schellenberg and the new question"
    image:
      src: img/schellenberg.webp
      alt: "Photograph of the philosopher John Schellenberg"
      caption: "John L. Schellenberg (born 1959), Canadian philosopher of religion at Mount Saint Vincent University, who made the sincere seeker the centre of the argument."
      credit: "Philosophy at the University of Edinburgh, CC BY 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:John_Schellenberg_-_Philosophy_at_the_University_of_Edinburgh_(cropped).png"
    body: |
      Recall the lessons on evil. There we wrote $G$ for "a good God exists" and asked how suffering $E$ bears on $G$. Divine hiddenness changes the evidence: not suffering, but **belief**.

      **J. L. Schellenberg** (born 1959) set out the argument in *Divine Hiddenness and Human Reason* (Cornell University Press, 1993). In essence he argues that if there is a personal God who is perfectly loving, then a person who is able to relate to God and is not at fault for lacking belief would be in a position to relate to God, which requires believing that God exists. Yet there seem to be such people.

      His first term for them was *inculpable* or *reasonable* non-belief; later he used the wider term **nonresistant non-belief**. A **nonresistant nonbeliever** is a person who (i) is not resisting God, (ii) is capable of a meaningful conscious relationship, and (iii) does not believe God exists. **Resistance** here means a kind of free resistance, such as turning away from evidence on purpose or deliberately closing the door to a relationship.

      Write $D$ for "nonresistant nonbelievers exist". Throughout this lesson, $G$ is "a perfectly loving, personal God exists".

      *Layers:* that people lack belief is a plain observation of everyday life; whether any of it is *nonresistant* is live debate; whether God would allow it is a metaphysical commitment on both sides.

  - type: mcq
    id: nonresistant
    title: "Resistant or not?"
    prompt: |
      According to Schellenberg, a **nonresistant nonbeliever** is capable of a relationship with God, does not believe God exists, and is *not resisting* God. Which person fits?
    options:
      - text: 'Lena has read, prayed and searched for years, wishes the answer were yes, and still finds the evidence does not convince her.'
        correct: true
        feedback: |
          Right: capable, open, not shutting any door, and still without belief. This is the kind of case the argument needs.
      - text: 'Marco avoids every argument and every believer because he fears he might be convinced, and does not want his life to change.'
        feedback: |
          That is resistance: he is closing the door himself. Even for Schellenberg, a God could allow this kind of non-belief, since the person chose it.
      - text: 'Tomás has never heard of any religion and is a newborn.'
        feedback: |
          A newborn is not yet capable of a meaningful conscious relationship with God, so the second condition fails. (Cases of people who lack the concept entirely are discussed too, but they are not the central case.)
      - text: 'Ana believes in God strongly but belongs to a different tradition from her neighbours.'
        feedback: |
          Ana believes, so the third condition (non-belief in God's existence) fails. Hiddenness is about the absence of belief, not about which tradition is right.
    explanation: |
      Three conditions: not resisting, capable, not believing. The argument depends on whether people meeting all three really exist, which is why the cases of Lena and Marco are separated.

  - type: text
    id: love
    title: "What does perfect love involve?"
    body: |
      How does Schellenberg get from "perfect love" to belief? In essence he says that perfect love involves benevolence and also aiming at a **relationship** with the loved one: conscious, reciprocal and positively meaningful, valued for its own sake. Such love does not cease. So the least that perfect love requires is that God is **always open** to a relationship with each capable person: no door is ever closed from God's side.

      Add the step that makes belief necessary: to take part in a conscious, reciprocal relationship with someone, you must at least believe that someone is there. A person cannot greet, trust or answer a being they do not think exists.

      Now the argument can be written in numbered steps.

  - type: order
    id: build-order
    title: "Order the argument"
    prompt: |
      Put the steps of the hiddenness argument in order, from God's nature to the conclusion.
    steps:
      - 'A perfectly loving God is always open to a personal relationship with every person who is capable of one.'
      - 'So anyone capable and not resisting is in a position to relate to God.'
      - 'Relating to God requires believing that God exists, so such a person would believe.'
      - 'Yet there are capable people who are not resisting and do not believe (nonresistant nonbelief, $D$).'
      - 'So the God of perfect love does not exist.'
    hint: |
      Start with what love involves, then what follows for a capable and non-resisting person, then what relationship needs, then the facts, then the verdict.
    explanation: |
      In symbols the first three steps say $G\Rightarrow\lnot D$. The fourth claims $D$. The fifth is *modus tollens*: from $G\Rightarrow\lnot D$ and $D$, conclude $\lnot G$. The logic is valid; everything is in the premises.

  - type: mcq
    id: premise
    title: "Which premise does a critic reject?"
    prompt: |
      Take the premises: **P1** perfect love means God is always open to relationship with every capable, non-resisting person; **P2** relating to God requires believing God exists; **P3** nonresistant nonbelievers exist. A critic says: "What love aims at is a transformed relationship, and merely proving that God exists does nothing for that." Which premise is this critic pressing?
    options:
      - text: 'P1 (and the link to P2): what love aims at is a transformed relationship, not just belief that God exists.'
        correct: true
        feedback: |
          Roughly right: this contests what God's openness requires. On this view, giving bare evidence that God exists does not bring a person closer; God works on the will.
      - text: 'P3 only: he says nobody lacks belief.'
        feedback: |
          This critic does not deny that people lack belief. Some critics of the argument question P3 (are those cases truly nonresistant?), but that is a different move.
      - text: 'The logic: he says modus tollens is invalid.'
        feedback: |
          The logic is not in dispute. The argument is valid; the debate is about premises.
    explanation: |
      A valid argument pushes the dispute onto its premises. Replies attack P1 (what love requires), P2 (what relationship requires), or P3 (whether the non-belief is really nonresistant). Skeptical theism, below, attacks the link from "God would" to "we can tell".

  - type: mcq
    id: freedom
    title: "Reply 1: freedom and epistemic distance"
    prompt: |
      According to Hick (the theodicy lesson), God keeps an **epistemic distance** so that human moral choice is genuinely free. According to Swinburne and to Murray, in essence, a clearer presence of God could make choosing the good too compelling, or amount to a kind of coercion. Which is the main strain on this reply for Schellenberg's case?
    options:
      - text: 'It must explain why *nonresistant* non-belief is needed for freedom, when many believers also choose freely, and why God could not be as clear to the seeker as to the believer.'
        correct: true
        feedback: |
          This is the heart of the strain: freedom explains why God might allow *resistance*, but the argument is about people who are not resisting. Schellenberg grants that God could allow culpable resistance; he doubts that free will requires non-belief in those who seek.
      - text: 'It proves that freedom is not valuable.'
        feedback: |
          No: the reply grants that freedom is valuable. The question is whether the particular distance imposed is needed for it.
      - text: 'It only works if there is no suffering.'
        feedback: |
          Suffering is a different problem. The strain here concerns belief and freedom, not pain.
    explanation: |
      The reply is serious: a world where God's reality is overwhelming might make choice less free. The reply is weaker if the same freedom is compatible with the clear presence that believers report. Two views stay open: that distance is needed for real choice, and that it is not needed for those who seek.

  - type: text
    id: relationship
    title: "Reply 2: relationship and trust"
    body: |
      **Paul K. Moser**, in *The Elusive God* (Cambridge University Press, 2008) and earlier essays, argues in essence that we should expect evidence of God to be **purposively available**: given in ways that fit God's purposes in self-revelation, which on his account aim to transform a person's will and bring them into a loving relationship, not to supply neutral proof for spectators. On this view God is hidden from some people at some times because they are unwilling to be transformed, and so are not well placed to receive or respond to such evidence.

      A second thought joins it: believing *that* God exists is not the same as trusting or loving God. If the aim of love is a relationship of trust, merely informing someone of God's existence would not reach it, and may even make someone worse.

      According to critics, the cost is that this reply seems to turn every case of non-belief into a case of resistance, which is exactly what Schellenberg denies.

  - type: mcq
    id: relationship-q
    title: "A strain on the relationship reply"
    prompt: |
      Moser argues that evidence of God is *purposively available*, tied to transforming the will. Which question must the reply still answer, to meet Schellenberg's case of a seeker who wants a relationship?
    options:
      - text: 'Why would God not give such a seeker at least the starting belief that God exists, since the seeker is already willing?'
        correct: true
        feedback: |
          Yes: if the seeker is not resisting, "unwillingness to be transformed" does not seem to apply. The reply must show that even the willing lack evidence for a reason, not by accident.
      - text: 'Why is a relationship valuable at all?'
        feedback: |
          Both sides agree it is. The disagreement is about how it begins.
      - text: 'Why do some people believe without evidence?'
        feedback: |
          That is a different question about how belief forms, not about the hiddenness reply.
    explanation: |
      The view has a rival reading: the seeker has not been shown nothing but has not been shown what fits a relationship. Whether that satisfies the argument is a live disagreement.

  - type: mcq
    id: skeptical
    title: "Reply 3: skeptical theism and its price"
    prompt: |
      Skeptical theism says we may not be in a position to know whether God has reasons we cannot grasp for permitting nonresistant non-belief, so we should not accept the premise that God would prevent it. What price did the same move pay in the lesson on the evidential problem of evil?
    options:
      - text: 'The doubt about God''s reasons can spread: if we cannot tell what reasons God might have for allowing suffering, we also cannot tell what God would reveal or provide.'
        correct: true
        feedback: |
          Right. The same humility that blocks the argument also blocks inference about what God would do, including why God would reveal anything at all.
      - text: 'It shows that God does not exist.'
        feedback: |
          It does not: it is a defense. Its price is general doubt about our reasoning on God's reasons.
      - text: 'It names God''s exact reason for hiddenness.'
        feedback: |
          Skeptical theism names no reason. That is its point, and its price.
    explanation: |
      Schellenberg rejects this reply. Defenders say it is the honest position. The two sides disagree on whether our grasp of what love requires is strong enough to rule out hidden reasons.

  - type: numeric
    id: bayes-1
    title: "Does non-belief lower the odds?"
    prompt: |
      Toy numbers (not data). Let $G$ be "a perfectly loving God exists", $\lnot G$ "no such God", and $D$ "nonresistant nonbelievers exist". Suppose $P(G)=P(\lnot G)=0.5$, $P(D\mid G)=0.2$ (such non-belief is unlikely if God exists, but not impossible) and $P(D\mid\lnot G)=0.8$. What is $P(G\mid D)$, in percent?
    answer: 20
    tolerance: 0.5
    answerText: '20'
    hint: |
      Odds form: the likelihood ratio is $0.2/0.8$ and the prior odds are $1$.
    wrong:
      - { value: 50, feedback: 'That is the prior. Observing $D$ changes it, because $D$ is less expected if $G$.' }
      - { value: 25, feedback: 'Odds $1:4$ become a probability of $1/(1+4)=20\%$, not $25\%$; $25\%$ would be the odds written as if they were a probability.' }
    explanation: |
      Odds: $\dfrac{P(G\mid D)}{P(\lnot G\mid D)}=\dfrac{0.2}{0.8}\cdot 1=\dfrac14$. As a probability, $\dfrac{1}{1+4}=0.2$. Direct check: $\dfrac{0.2\cdot0.5}{0.2\cdot0.5+0.8\cdot0.5}=0.2$.

  - type: numeric
    id: bayes-2
    title: "After a reply raises P(D | G)"
    prompt: |
      Keep $P(G)=P(\lnot G)=0.5$ and $P(D\mid\lnot G)=0.8$. Suppose a reply (freedom, relationship or hidden reasons) is successful enough that you now judge $P(D\mid G)=0.6$. What is $P(G\mid D)$, in percent, to one decimal?
    answer: 42.9
    tolerance: 0.1
    answerText: '42.9'
    hint: |
      Likelihood ratio $0.6/0.8$, prior odds $1$.
    explanation: |
      Odds $=0.6/0.8=0.75$, so $P=0.75/1.75=3/7\approx0.4286$. Direct: $\dfrac{0.3}{0.3+0.4}=0.4286$. A reply does not need to *refute* the argument: it only needs to make non-belief less surprising on $G$. Whether $0.6$ is reasonable is exactly where people part ways.

  - type: mcq
    id: trap
    title: "Trap: hiddenness is the problem of evil"
    prompt: |
      A student says: "If I have a theodicy for suffering, I already have the answer to divine hiddenness." Which is the best response?
    options:
      - text: 'Not automatically: the evidence differs ($D$, absence of belief, versus $E$, suffering), and a reason to permit pain (say, soul-making) may not explain why a seeker lacks the belief that relationship needs.'
        correct: true
        feedback: |
          Right. The goods named for pain (courage, growth) do not obviously need a sincere seeker to lack belief. Some replies, such as epistemic distance, do bridge the two; that is a link to be argued, not assumed.
      - text: 'Yes: both come from the same premise about God''s goodness.'
        feedback: |
          They share a premise about God''s goodness, but the evidence and the goods at issue differ. A shared premise does not make a shared answer.
      - text: 'No: hiddenness has nothing to do with God''s goodness.'
        feedback: |
          It is built on God''s goodness, specifically perfect love. Only the evidence differs.
    explanation: |
      Two arguments, two kinds of evidence. They can be combined, and some replies (epistemic distance, skeptical theism) apply to both, but each needs its own check.

  - type: mcq
    id: parting
    title: "Where do people part ways?"
    prompt: |
      Which of these are real points where thoughtful people part ways on hiddenness? Select all that apply.
    multiple: true
    options:
      - text: 'Whether relating to God requires belief that God exists, or only openness to God.'
        correct: true
        feedback: |
          A live premise: some say trust can begin without firm belief.
      - text: 'Whether the non-belief we see is truly nonresistant.'
        correct: true
        feedback: |
          Yes: believers often suspect hidden resistance; non-believers point to sincere seekers.
      - text: 'Whether the argument is logically invalid.'
        feedback: |
          Validity is agreed; the dispute is over premises.
    explanation: |
      Disagreements: what love requires, what a relationship needs, whether the non-belief is nonresistant, and whether hidden reasons can be assumed.

  - type: mcq
    id: resolve
    title: "Resolve the hook"
    prompt: |
      Back to the loving parent and the searching child. After the lesson, which statement is most accurate?
    options:
      - text: 'The intuition that love seeks to be known is the first premise of the argument; the replies (freedom, relationship, hidden reasons) each challenge whether it applies to a God, and each has a cost.'
        correct: true
        feedback: |
          Right: the guess was the argument in miniature. What remains open is which premise to reject, and why.
      - text: 'The analogy proves the argument, since parents are all-knowing.'
        feedback: |
          A human parent is not all-knowing, which is one place the analogy may fail.
      - text: 'The analogy is irrelevant because God is not like a parent.'
        feedback: |
          Many replies stress the differences, but the argument rests on what perfect love involves, which the parent only illustrates.
    explanation: |
      The child shows what is at stake; the argument asks whether a perfectly loving God would do what a loving parent would. Thoughtful people answer differently.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** parsimony. If the arguments for and against God leave the weighing open, what can *simplicity* and the *burden of proof* decide, and who must argue for what?
