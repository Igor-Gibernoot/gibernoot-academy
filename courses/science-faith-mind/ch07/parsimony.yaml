id: ch07-parsimony
title: "Occam, Burden of Proof and Naturalism"
kind: concept
own: |
  The setting: two rival hypotheses $H_1$ and $H_2$ (for example "the world contains only natural things" and "it also contains a God") and some evidence $E$. **Parsimony** is the preference for the hypothesis that posits less: fewer kinds of thing, fewer individual things, or fewer assumptions and adjustable numbers. The slogan "entities are not to be multiplied beyond necessity" is named after William of Ockham (c. 1287-1347) but is not found in his texts.
  - **Simplicity breaks only ties in fit.** According to the Bayesian reading, fit enters through the likelihoods and simplicity through the prior (and through how widely a hypothesis spreads its predictions):
  {{ $$\frac{P(H_1\mid E)}{P(H_2\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_2)}\cdot\frac{P(H_1)}{P(H_2)}$$ }}
  A simpler hypothesis cannot rescue a bad fit: if $P(E\mid H_1)$ is tiny, no prior advantage repairs it. Simplicity decides only when the fit is about equal.
  - **A narrow hypothesis wins when the data fall inside it.** Let a machine print one number from 1 to 100. A simple rule $S$ says "one of 5 numbers, equally likely"; a flexible rule $C$ says "any of the 100". If the machine prints one of the 5 numbers, the likelihoods are $P(E\mid S)=\tfrac15$ and $P(E\mid C)=\tfrac1{100}$, so the ratio (the Bayes factor) is
  {{ $$\frac{P(E\mid S)}{P(E\mid C)}=\frac{1/5}{1/100}=20$$ }}
  If the machine prints a number outside the 5, $P(E\mid S)=0$ and $S$ is dead.
  - **Two kinds of naturalism.** *Methodological naturalism* is a working policy of science: explain by natural causes and test them, without ruling on what else exists. *Metaphysical* (ontological) naturalism is a claim about what exists: {{ there is nothing supernatural }}. The razor and the burden of proof apply to the second, which is a claim; the first is a method.
  - **Burden of proof.** According to Antony Flew (1972), in essence, debate about God should start from a *presumption of atheism* in the sense of *not believing*, as a court starts from a presumption of innocence: whoever says God exists must give reasons. Critics reply that the right default depends on how probable theism is before the arguments, and that lacking evidence is not always a reason to deny. Burden attaches to claims, not to sides: {{ whoever asserts something, positive or negative, owes reasons for that assertion }}, whether it is "God exists" or "no God exists".
  - **Parsimony and God.** According to Richard Swinburne (born 1934), in essence, theism is simple: one person with limitless power, knowledge and freedom explains much, and simpler hypotheses have higher prior probability. Critics reply that limitless properties are not obviously simple, and that the hypothesis needs extra assumptions (for example about evil). A naturalist counts one more kind of being as a cost. So both sides invoke the razor with different counting rules, and it settles nothing until the counting is agreed.
cards:
  - type: mcq
    id: hook
    title: "Guess: the simple story"
    prompt: |
      Guess before any theory. In one night, three shops are broken into, in three towns 300 km apart, all within the same ten minutes. Story A: one burglar did all three. Story B: three different burglars. Story A is simpler (one culprit instead of three). Which story is more probably true?
    options:
      - text: 'Story B: the evidence (the same ten minutes, towns 300 km apart) makes Story A almost impossible, whatever its simplicity.'
        correct: true
        feedback: |
          Yes. Simplicity was never the whole question: the first thing to ask is whether each story *fits the evidence*. One person cannot be in three places at once.
      - text: 'Story A: simpler explanations are more likely to be true.'
        feedback: |
          This is the tempting slogan. But a story that cannot produce the evidence is not rescued by being short.
      - text: 'They are equally likely; simplicity never matters.'
        feedback: |
          Too strong. If the break-ins were only in one street an hour apart, the one-burglar story would deserve a real edge. Simplicity can matter; this lesson asks exactly when.
    explanation: |
      The slogan "prefer the simpler explanation" is useful but easy to over-read. We will say what it can decide (when stories fit the evidence about equally), what it cannot, and who must argue for what when the question is God and naturalism. At the end we return to the burglars.

  - type: text
    id: razor
    title: "Occam's razor, in two or three forms"
    image:
      src: img/ockham.webp
      alt: "Medieval pen sketch of a friar labelled as William of Ockham in a manuscript of 1341"
      caption: "A sketch of William of Ockham (c. 1287-1347) from a manuscript of his Logic written in 1341, the best-known contemporary likeness."
      credit: "William of Ockham, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:William_of_Ockham_-_Logica_1341.jpg"
    body: |
      **Occam's razor** (also spelled Ockham's) is the advice not to posit more than you need. It is named after **William of Ockham** (c. 1287-1347), an English Franciscan friar and philosopher. According to the Stanford Encyclopedia, the familiar slogan "entities must not be multiplied beyond necessity" does not appear in his texts. In essence his own rule was that one should not posit something unless reason, experience or an infallible authority (for him, Scripture) requires it.

      Today the razor comes in different forms, because "less" can be counted in different ways:

      - **fewer kinds of thing** (qualitative parsimony: a theory with one kind of stuff beats a theory with two);
      - **fewer individual things** (quantitative parsimony: one planet more or less);
      - **fewer assumptions or adjustable numbers** (the *statement* of the theory is shorter or less fine-tuned).

      The forms can pull against each other. Astronomers once posited an unseen planet, Neptune, to explain the odd orbit of Uranus. That added a thing, yet it made celestial mechanics simpler overall, because it removed a whole puzzle. Also note the word "necessity": a posit is allowed when the evidence needs it.

  - type: mcq
    id: neptune
    title: "Did Neptune break the razor?"
    prompt: |
      Astronomers noticed that Uranus did not follow the orbit predicted from the Sun and the known planets. They posited one more planet, unseen, and its pull explained the orbit. Which statement about Occam's razor is correct?
    options:
      - text: 'The razor was not broken: the extra planet was *needed* to explain the evidence, and it made the whole account simpler by removing an unexplained discrepancy.'
        correct: true
        feedback: |
          Yes. The razor says do not posit *beyond necessity*, not never posit. A posit that earns its place by explaining something is exactly what the evidence can demand.
      - text: 'The razor was broken: it forbids ever adding an entity.'
        feedback: |
          That is a misreading. If the razor forbade every new entity, no unseen planet, atom or gene could ever be discovered.
      - text: 'The razor says the simplest theory is always correct, so the planet was a mistake.'
        feedback: |
          The razor is not a guarantee of truth, and this planet turned out to exist. Parsimony guides which hypothesis to take seriously first; evidence decides.
    explanation: |
      Parsimony is a rule about *unneeded* posits. What counts as needed is decided by how well the theory fits the evidence, which is the next point.

  - type: widget
    id: line-fits
    title: "Two curves, same fit"
    widget: curve-fit-lab
    config:
      points: [[1, 0.9], [3, 2.1], [5, 2.9], [7, 4.2], [9, 5.0]]
      xRange: [0, 10.5]
      yRange: [-1, 7]
      degree: 2
      degreeRange: [1, 4]
      compare: [1]
      tolerance: 0.3
      holdout: null
      edit: false
      show:
        simplest: true
        residuals: true
        holdout: false
        buttons: false
        tolerance: false
    body: |
      Five measurements and polynomial curves fitted to them. The **degree** is the highest power of $x$ (degree 1 is a line, degree 2 a parabola). The **RMS** is the typical vertical gap between curve and dots. A curve counts as *fitting* when its RMS is at most $0.3$. Move the slider and read which curve is highlighted as the **simplest that fits**.
    review: false

  - type: widget
    id: bend-fits
    title: "Two curves, different fit"
    widget: curve-fit-lab
    config:
      points: [[1, 0.2], [3, 2.6], [5, 4.1], [7, 4.0], [9, 1.9]]
      xRange: [0, 10.5]
      yRange: [-1, 7]
      degree: 1
      degreeRange: [1, 4]
      compare: [2]
      tolerance: 0.3
      holdout: null
      edit: false
      show:
        simplest: true
        residuals: true
        holdout: false
        buttons: false
        tolerance: false
    body: |
      A second set of five measurements, with the same rule: a curve *fits* when its RMS is at most $0.3$. Try degree 1 (a straight line), then raise the degree, and watch which curve is highlighted as the simplest that fits.
    review: false

  - type: mcq
    id: fits-q
    title: "What simplicity decided"
    prompt: |
      In one data set a straight line (degree 1) and a parabola (degree 2) both fit within the tolerance. In another data set the straight line misses the points by far more than the tolerance and the parabola fits. Which description of the role of simplicity is correct?
    options:
      - text: 'Where both fit, simplicity prefers the line; where the line does not fit, fit decides and the more complex curve is kept.'
        correct: true
        feedback: |
          Right. Simplicity works among curves that already fit about equally well; it does not override a clear misfit.
      - text: 'The line should be chosen in both data sets, because it is simpler.'
        feedback: |
          In the second set the line cannot reproduce the data (a clear bend), so choosing it throws away the evidence. A hypothesis that fails the evidence is not rescued by simplicity.
      - text: 'The parabola should be chosen in both data sets, because it fits at least as well.'
        feedback: |
          Fitting at least as well is automatic for a more flexible curve (it contains the line as a special case). A success that could not have failed says little; when the fit is equal, the simpler curve is the safer bet against fitting noise.
      - text: 'Simplicity shows which curve is true.'
        feedback: |
          Nothing here shows truth. At best simplicity is a guide to which curve will predict new points well; that is a claim about method, not a proof.
    explanation: |
      Simplicity is a tie-breaker for hypotheses that fit about equally well. It is a reason to prefer, not a proof, and never a replacement for fit.

  - type: text
    id: bayes-view
    title: "The Bayesian view: why a narrow hypothesis can win"
    body: |
      Recall Bayes' rule in odds form for two hypotheses $H_1$, $H_2$ and evidence $E$ (the lessons on evil):

      $$\frac{P(H_1\mid E)}{P(H_2\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_2)}\cdot\frac{P(H_1)}{P(H_2)}$$

      Here $P(H)$ is how probable $H$ is before the evidence (the **prior**), and $P(E\mid H)$ is how probable the evidence is if $H$ is true (the **likelihood**). The ratio of the likelihoods is the **Bayes factor**.

      According to the statisticians William Jefferys and James Berger (American Scientist, 1992), in essence, Bayesian reasoning gives Occam's razor in a nearly automatic form: a hypothesis that spreads its probability over many possible outcomes gives each outcome little, so if the data fall in the range a *narrower* hypothesis predicts, the narrower one gains. It is still debated how fully this removes the need to choose priors.

      Toy case. A machine prints one number from 1 to 100. Rule $S$ (simple) says: "it prints one of 5 particular numbers, each equally likely". Rule $C$ (flexible) says: "it prints any of the 100 numbers, each equally likely". The machine prints 3, which is one of $S$'s five.

  - type: numeric
    id: bayes-factor
    title: "The Bayes factor of the narrow rule"
    prompt: |
      A machine prints one number from 1 to 100. Rule $S$ says it prints one of 5 particular numbers, each with equal chance. Rule $C$ says it prints any of the 100 numbers, each with equal chance. The machine prints 3, one of the 5 numbers of $S$. What is the Bayes factor $\dfrac{P(E\mid S)}{P(E\mid C)}$, where $E$ is "it printed 3"?
    answer: 20
    tolerance: 0.01
    answerText: '20'
    wrong:
      - value: 0.05
        feedback: |
          You inverted the ratio. $S$ gives 3 the chance $\tfrac15$, which is *larger* than $C$'s $\tfrac1{100}$, so the factor in favour of $S$ is above 1.
      - value: 5
        feedback: |
          That is $\tfrac{1}{1/5}$. The Bayes factor compares the two likelihoods: $\tfrac{1/5}{1/100}$.
      - value: 0.2
        feedback: |
          That is just $P(E\mid S)$. The Bayes factor divides it by $P(E\mid C)=\tfrac1{100}$.
    hint: |
      Each rule spreads one unit of probability evenly over the numbers it allows. Find $P(E\mid S)$ and $P(E\mid C)$ first.
    explanation: |
      $P(E\mid S)=\tfrac15$ and $P(E\mid C)=\tfrac1{100}$, so the ratio is $\tfrac{1/5}{1/100}=\tfrac{100}{5}=20$. With equal priors, the odds for $S$ are 20 to 1, about 95%. If the machine had printed 57, outside $S$'s five, $P(E\mid S)=0$ and the narrow rule would be dead: it risked more, so it gains more when it is right and loses everything when it is wrong.

  - type: text
    id: naturalism
    title: "Naturalism, in two senses"
    body: |
      Before asking what the razor says about God, we need the rival it is usually applied to. **Naturalism** is a word with no single precise meaning, says the Stanford Encyclopedia. Two senses matter here:

      - **Methodological naturalism**: a *working policy* of inquiry. Science looks for natural causes that can be tested, and does not use "a supernatural agent did it" as an explanation inside the experiment. It does not by itself say that nothing else exists. (Some philosophers of religion use the term in other ways, so check which one a writer means.)
      - **Metaphysical** (also called **ontological**) **naturalism**: a *claim about what exists*, namely that reality contains only natural things and nothing **supernatural** (a being or force outside the natural order, such as God, spirits or souls that exist apart from bodies).

      The first is a method; the second is a thesis. A scientist who is a believer can follow the method and reject the thesis; a scientist who accepts the thesis usually also follows the method.

      *Layers:* that science works by testable natural explanations is established; whether the method's success supports the thesis is live debate; the thesis itself is a metaphysical commitment, as is its denial.

  - type: mcq
    id: naturalism-q
    title: "Which claim does the razor test?"
    prompt: |
      A physicist says: "My model contains no supernatural causes, because I can only test natural ones." A philosopher says: "Nothing supernatural exists; adding a God only adds an unneeded entity." Which statement is the most accurate?
    options:
      - text: 'The physicist states a method; the philosopher states a claim about what exists, and only that claim is a candidate for the razor.'
        correct: true
        feedback: |
          Right. A policy of what to test does not posit or deny anything; "nothing supernatural exists" does, so it needs support, and the razor is an argument offered for it.
      - text: 'Both state the same thing: methodological naturalism implies that God does not exist.'
        feedback: |
          It does not. A method restricts what is used as an explanation in testing; it does not rule on what exists. Many scientists who are believers follow the method.
      - text: 'Neither can be doubted, since science assumes them.'
        feedback: |
          Science assumes the method for practical reasons. The thesis that nothing else exists goes beyond what the method itself shows, and defenders and critics both argue about it.
    explanation: |
      Keeping the two senses apart prevents a common slide: "science only uses natural explanations, so science shows nothing else exists". The first is a rule of the game; the second is a result that must be argued.

  - type: text
    id: burden
    title: "Burden of proof: who must argue for what"
    body: |
      The **burden of proof** is the duty to give reasons first, because the other side may fairly refuse to accept a claim without them. In the debate about God it is itself disputed, and it helps to separate three different claims:

      - **"God exists"** (theism): a claim, so it needs reasons.
      - **"God does not exist"** (atheism in the narrow sense): also a claim, so it needs reasons.
      - **"I am not convinced that God exists"** (atheism in the broad sense, also "lacking belief"): a report about oneself, and no claim about the world.

      The philosopher **Antony Flew** (1923-2010) defended a **presumption of atheism** in a 1972 paper, in essence in the second, broad sense. He compared it to the presumption of innocence in English law: a court starts by not believing the accused is guilty, and the prosecution must show otherwise. He called it a neutral procedure, and held that those who say God exists must first give a coherent account of what "God" means and show that it applies. He also kept his "negative atheist" apart from the agnostic, who has already granted that the idea of God makes sense.

      Replies: (i) agnostics and many theists ask why the starting point is not simply "open", or why not being convinced counts as a default; (ii) the Stanford Encyclopedia notes that such fights are often sidetracked by bad analogies (Santa Claus, the teapot orbiting the Sun), and argues that atheism is the correct default only if theism has a sufficiently low initial probability; (iii) some theists hold that belief in God can be reasonable without being argued from premises at all. So Flew's rule is a view about how to run the discussion, and each side can accept the procedure while disputing how probable theism is to begin with.

  - type: mcq
    id: burden-q
    title: "Who owes reasons?"
    prompt: |
      Three people speak. Ana: "God exists." Ben: "God does not exist." Cleo: "I have heard the arguments and I am not convinced either way." Using the three claims above, which statement is correct?
    options:
      - text: 'Ana and Ben each assert something about the world and each owe reasons for it; Cleo reports her state of mind and asserts nothing that needs support.'
        correct: true
        feedback: |
          Yes. A burden attaches to a claim, not to a side. A person who denies also asserts. Who must argue *first* is the further disputed question.
      - text: 'Only Ana owes reasons, because she asserts the positive claim.'
        feedback: |
          "God does not exist" is also an assertion: it says reality lacks something. The idea that the burden is always on the positive claim fails here; the usual cases (nobody owes proof that there is no teapot) work because the prior probability of the thing is very low, which is the very point disputed.
      - text: 'Only Ben owes reasons, because denying is bolder than believing.'
        feedback: |
          There is no general rule that denial is bolder. A denial can be better or worse supported than a belief; each needs reasons for what it asserts.
      - text: 'Nobody owes reasons, because the existence of God cannot be known.'
        feedback: |
          Whether it can be known is itself a claim (agnosticism of one kind) and is disputed. Even then, a speaker who asserts or denies still has to say why.
    explanation: |
      Flew's presumption protects Cleo's stance, not Ben's assertion. Whether the starting point of the whole discussion should be "not convinced" (Flew) or "open" (many agnostics) or something set by prior probability (the Stanford Encyclopedia) is the live question.

  - type: text
    id: swinburne
    title: "Does parsimony favour naturalism or God?"
    image:
      src: img/swinburne.webp
      alt: "Photograph of the philosopher Richard Swinburne in a bookshop"
      caption: "Richard Swinburne (born 1934), British philosopher of religion, who argues that theism is a simple hypothesis."
      credit: "Ziel, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Richard_Swinburne_2009_(3x4_cropped).jpg"
    body: |
      Each side claims the razor, because each counts differently.

      **The naturalist count.** The natural world is known; a God would be one more kind of being added to it. If God is not needed to explain the evidence, the razor says leave God out. This counts *kinds of thing*.

      **Swinburne's count.** The philosopher **Richard Swinburne** (born 1934; *The Existence of God*, 2nd ed. 2004) argues, in essence, that what matters for the prior probability of a hypothesis is the simplicity of the hypothesis itself, and that theism is very simple: a single person, with the properties of power, knowledge and freedom taken to the limit, rather than a vast number of unrelated causes. According to him, a simpler hypothesis has a higher prior, other things equal. This counts *the number and complexity of the posited properties*.

      Critics reply: (i) is a limitless property simple, or does a limitless being still have many separate powers? (objections raised by critics such as Gwiazda and Czobel, who ask whether a being with limitless knowledge and power has many separate powers); (ii) simplicity may matter mainly because simple theories are easier to test, and it is unclear how theism is tested; (iii) to answer the problem of evil, the theist adds assumptions (for example about an afterlife), which lowers the simplicity. Naturalists in turn face the question of whether "no God" is as simple as it seems, since it must explain why the universe has these laws at all.

      So the same razor can be turned in both directions. It is not settled by saying "simpler", but by agreeing on **what is counted**, and then on how well each hypothesis **fits** the evidence.

  - type: mcq
    id: swinburne-q
    title: "A razor with two edges"
    prompt: |
      A naturalist says: "Parsimony favours naturalism, since it posits one less kind of being." A theist says: "Parsimony favours theism, since one simple person explains what naturalism needs many unrelated facts to explain." Which statement is the most accurate?
    options:
      - text: 'They count different things (kinds of being versus the complexity of the whole explanation), so parsimony alone does not decide until the counting rule is agreed and the fit with the evidence is compared.'
        correct: true
        feedback: |
          Yes. Both appeal to the razor honestly, but the razor does not say what to count. The disagreement moves to the counting rule, to fit, and to whether simplicity should raise a prior at all.
      - text: 'The naturalist is right, because the razor means fewest kinds of thing and God is an extra kind.'
        feedback: |
          Fewest kinds is one reading of the razor, not the only one. Swinburne counts the simplicity of the hypothesis, and under that count the comparison is disputed.
      - text: 'The theist is right, because one cause is always simpler than many.'
        feedback: |
          "One cause" is not automatically simpler: critics ask whether a limitless person is simple and whether the hypothesis needs extra assumptions. A count of one can hide a long list of properties.
      - text: 'Parsimony is meaningless, since both sides can claim it.'
        feedback: |
          That is too quick. Where hypotheses fit equally well and the counting is agreed, simplicity does real work. The lesson is its limits, not its uselessness.
    explanation: |
      Both claims use the razor honestly; neither is a refutation of the other. What would move the debate forward: an agreed counting rule, the likelihoods of the evidence under each side, and whether simplicity is evidence of truth at all (the question left open in the lessons on underdetermination).

  - type: order
    id: order
    title: "From 'which posits less?' to a weighed verdict"
    prompt: |
      Put in order a careful way of using parsimony to compare two hypotheses about the same evidence.
    steps:
      - 'List what each hypothesis posits (kinds of thing, number of things, assumptions), saying which count is being used.'
      - 'Ask what each hypothesis predicts about the evidence: the likelihood $P(E\mid H)$ for each.'
      - 'Check whether the fit to the evidence is about equal; a clear misfit settles the matter against the worse fit.'
      - 'If the fit is about equal, let simplicity adjust the prior odds $P(H_1)/P(H_2)$ and say how much weight you give it.'
      - 'Combine prior and likelihoods into posterior odds and name what stays open (the counting rule, the prior).'
    hint: |
      You cannot weigh a posit before you know what is counted, and simplicity only enters after the fit has been compared.
    explanation: |
      Counting comes first, because "less" has several meanings. Fit comes before simplicity, because simplicity is a tie-breaker. Only then do the priors and likelihoods combine, and the final step is honesty about which inputs a thoughtful person might set differently.

  - type: numeric
    id: combine
    title: "Simplicity and fit together"
    prompt: |
      Two hypotheses explain some evidence $E$. Hypothesis $S$ (fewer assumptions) has prior $P(S)=0.3$ and predicts the evidence with $P(E\mid S)=0.2$. Hypothesis $C$ (more assumptions) has prior $P(C)=0.1$ and predicts it with $P(E\mid C)=0.6$. Suppose one of these two is true. What is $P(S\mid E)$?
    answer: 0.5
    tolerance: 0.005
    answerText: '0.5'
    wrong:
      - value: 0.75
        feedback: |
          That uses only the priors, $\tfrac{0.3}{0.3+0.1}$. The evidence fits $C$ three times better, which pulls the answer down.
      - value: 0.25
        feedback: |
          That uses only the likelihoods, $\tfrac{0.2}{0.2+0.6}$. The prior favours $S$ three to one, which pulls it up.
    hint: |
      Multiply each prior by its likelihood, then divide $S$'s product by the sum of both products.
    explanation: |
      The products are $0.3\times0.2=0.06$ for $S$ and $0.1\times0.6=0.06$ for $C$. They are equal, so $P(S\mid E)=\tfrac{0.06}{0.06+0.06}=0.5$. Simplicity gave $S$ a $3:1$ prior advantage, and the fit gave $C$ a $3:1$ likelihood advantage; they cancel. The numbers are a toy: the point is that simplicity is one input in the product, and a poor fit can cancel it.

  - type: mcq
    id: traps
    title: "Two slogans to doubt"
    multiple: true
    prompt: |
      Select the statements that are **mistakes**.
    options:
      - text: '"The simpler hypothesis is the true one."'
        correct: true
        feedback: |
          Simplicity can raise a prior or guard against fitting noise, but it never guarantees truth; the world need not be simple, and a simple hypothesis that fails the evidence is simply wrong.
      - text: '"There is no evidence for it, so it is false."'
        correct: true
        feedback: |
          Absence of grounds is not always a ground against. If nobody has evidence about the next coin toss, that is no reason to deny "heads". It is a reason against only when we would expect evidence to exist if the claim were true.
      - text: '"When two hypotheses fit the evidence equally well, a simpler one is the better starting bet."'
        feedback: |
          This is the defensible core of the razor (a guide for choosing, not a proof).
      - text: '"A person who denies a claim also has reasons to give."'
        feedback: |
          True: a denial is also an assertion about the world, so it carries its own burden.
    explanation: |
      Two over-readings: simplicity as proof, and "no evidence" as disproof. The careful claims are that simplicity is a tie-breaker and that every assertion, positive or negative, owes its reasons.

  - type: mcq
    id: resolve
    title: "Back to the burglars"
    prompt: |
      Back to the three break-ins in three towns in the same ten minutes. After the lesson, which verdict on "one burglar is the simpler story" is the best?
    options:
      - text: 'Simplicity would matter only if both stories fit the evidence about equally; here the one-burglar story fails the timing, so fit settles it.'
        correct: true
        feedback: |
          Right. It is the lesson in miniature: first compare fit, then let simplicity break ties, and say what is being counted.
      - text: 'The story with fewer burglars is always preferred, but the timing is a coincidence.'
        feedback: |
          Calling the timing a coincidence is a way of ignoring the evidence. The two stories do not fit it equally.
      - text: 'Parsimony is never relevant to detectives.'
        feedback: |
          Had the break-ins been in one street, one hour apart, with the same method, the one-burglar story would deserve a real edge.
    explanation: |
      Simplicity has a role (a tie-breaker and a guard against overfitting) and limits (it cannot overrule the evidence, and its counting can be contested). The same structure holds for naturalism and theism: both sides count, then compare fit, then weigh.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** Pascal's Wager. Suppose the arguments leave belief in God uncertain. Pascal asked whether one can still decide by weighing stakes rather than evidence, and the next lesson works that out with numbers: expected value with infinite stakes, and why the many-gods objection matters.
