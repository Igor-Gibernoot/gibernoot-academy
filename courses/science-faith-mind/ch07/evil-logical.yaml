id: ch07-evil-logical
title: "Guided proof: The Logical Problem of Evil"
kind: guided
proof: true
own: |
  The setting: the **logical problem of evil** asks whether three claims can all be true together: $O$ = "God is omnipotent (all-powerful)", $G$ = "God is wholly good", $E$ = "evil exists". A set of claims is **consistent** when some possible world makes all of them true, and $\Diamond$ means "possibly".
  - **Mackie's inconsistency (1955).** The three claims alone do not contradict each other; Mackie adds two principles: a good being always eliminates evil as far as it can, and there are no limits to what an omnipotent being can do. Together they give the bridge
  {{ $$(O \land G) \Rightarrow \lnot E$$ }}
  and since $E$ is true, the set $\{O, G, E\}$ would be contradictory. A theist can reject either added principle: a good being may allow some evil for a good reason, and omnipotence does not include doing the logically impossible.
  - **What it takes to answer him.** To refute "inconsistent" it is enough to show the set is **consistent**, with a story that is merely *possible*, not true or probable (a **defense**; a **theodicy** would claim the real reasons):
  {{ $$\Diamond\,(O \land G \land E)$$ }}
  - **The free-will defense (Plantinga, 1974).** A world with creatures who freely choose rightly is more valuable than one of automata, but God cannot cause a free choice (a caused choice is not free). So God may not be able to bring about a world with freedom and no wrongdoing: whether a free creature $c$ in situation $S$ *would* choose right is a **counterfactual of freedom**, true or false independently of God's will. The worlds God can actually bring about are the **feasible** ones, those consistent with these counterfactuals.
  - **Transworld depravity.** A creaturely essence $c$ (what the individual would be like in each situation) suffers from transworld depravity when, in every feasible world $w$ in which $c$ is significantly free, it does at least one wrong. Writing $F$ for the set of feasible worlds:
  {{ $$\forall w \in F:\ \mathrm{Free}(c,w) \Rightarrow \mathrm{Wrong}(c,w)$$ }}
  Plantinga claims only that it is *possible* that every creaturely essence is like this; then God could not have made free creatures without any wrong, and $O$, $G$, $E$ are consistent.
  - **What it shows, and what it leaves.** Consistency only: it does not say this story is true, that the evil in the world is likely given God (the evidential problem), or by itself explain natural evil such as disease or earthquakes. People part ways on whether freedom of this strong (libertarian) kind is coherent and valuable enough, and on whether transworld depravity is really possible.
cards:
  - type: mcq
    id: hook
    title: "Guess: freedom with no wrongdoing"
    prompt: |
      Guess before any theory. Imagine a powerful and perfectly good maker who wants creatures that **really choose** between right and wrong for themselves (not puppets that only look as if they choose). Could that maker simply *guarantee* that every one of them always chooses right?
    options:
      - text: 'It seems not: if the maker guarantees the outcome, the choice is no longer really the creature''s own, so a guarantee and real freedom pull against each other.'
        correct: true
        feedback: |
          This is the intuition behind the whole defence in this lesson. It is not yet a proof, and some philosophers deny it; we will see exactly what it needs.
      - text: 'Yes: a powerful enough maker can arrange anything, including that free creatures always choose right.'
        feedback: |
          This is the natural first thought, and it is the one the critic Mackie pressed. Its weak point is the phrase "free creatures" together with "arranged": if the maker arranges the choice, in what sense is it the creature's own?
      - text: 'It depends only on how many creatures there are.'
        feedback: |
          Numbers do not matter to the puzzle: the tension between guaranteeing a result and leaving a choice open is the same for one creature as for a billion.
    explanation: |
      Hold on to your guess. The **logical problem of evil** is the question whether the following three claims can all be true at once: God is all-powerful, God is wholly good, and evil exists. The free-will defence says the tension you just felt is what makes them compatible. By the end you will resolve the puzzle exactly.

  - type: text
    id: mackie
    title: "Mackie's set of three"
    body: |
      According to the Stanford Encyclopedia of Philosophy, **J. L. Mackie** (1917-1981) defended an *incompatibility* version of the argument from evil in his essay "Evil and Omnipotence" (*Mind*, 1955). Such an argument says that certain facts about evil are logically incompatible with God.

      Define three claims (the course writes them with letters):

      - $O$: God is **omnipotent** (all-powerful).
      - $G$: God is **wholly good**.
      - $E$: **evil exists** (suffering, cruelty, wrongdoing).

      Mackie holds that a theist who accepts all three is not just short of evidence but contradicting herself: his word for the position is "positively irrational", because the beliefs cannot all be true together.

  - type: mcq
    id: bare-set
    title: "Is the bare set contradictory?"
    prompt: |
      Take only the three claims: $O$ ("God is all-powerful"), $G$ ("God is wholly good") and $E$ ("evil exists"). Looking at these three sentences **alone**, with no other principle about goodness or power, do they contradict each other?
    options:
      - text: 'No: nothing in the three sentences, as they stand, makes one of them false when the other two are true. A contradiction needs a further premise linking them.'
        correct: true
        feedback: |
          Right. A set of sentences is inconsistent only if some line of reasoning derives a contradiction from it. Here the derivation needs extra premises about what goodness and power *do*, and Mackie knows it.
      - text: 'Yes: "evil exists" is the opposite of "God is good".'
        feedback: |
          "Evil exists" says there is evil somewhere. "God is good" says God has a certain character. These two sentences are not opposites: a good person can live in a world with crime.
      - text: 'Yes: a wholly good, all-powerful God would simply have no evil to show.'
        feedback: |
          That is exactly the extra premise, not part of the three claims. It may be reasonable, but it must be stated and examined, which is the next step.
    explanation: |
      Logic checks **consistency**: can all the claims be true together? For the bare three the answer is yes; by script, the truth assignment with $O$, $G$ and $E$ all true violates no rule. So the argument has to add premises, and the dispute moves to them.

  - type: mcq
    id: extra
    title: "The two added principles"
    prompt: |
      Mackie adds principles to make the set contradictory. Which two does he add? (Select both.)
    multiple: true
    options:
      - text: 'A good being always eliminates evil as far as it can.'
        correct: true
        feedback: |
          Yes: goodness is "opposed" to evil, so a good being does not leave removable evil in place.
      - text: 'There are no limits to what an omnipotent being can do.'
        correct: true
        feedback: |
          Yes: if power has no limit, then there is no evil the being *could not* remove.
      - text: 'Evil is only an illusion.'
        feedback: |
          Mackie takes evil to be real; his argument is that its existence clashes with God. Denying evil is a different way out (and not Mackie's premise).
      - text: 'God is not free to create anything at all.'
        feedback: |
          The opposite: his second principle makes God's power unlimited.
    explanation: |
      In essence: goodness always eliminates evil as far as it can, and omnipotence has no limits. Joined to the three claims they give a contradiction, as the next cards show. A critic's job is to find which of these two principles is too strong.

  - type: order
    id: derive
    title: "Derive the contradiction"
    prompt: |
      Put Mackie's derivation in order, starting from $O$, $G$ and the two added principles.
    steps:
      - 'God is omnipotent, so there are no limits to what God can do: God can eliminate any evil.'
      - 'God is wholly good, so God eliminates evil as far as God can.'
      - 'Combine the two: God eliminates all evil.'
      - 'So there is no evil.'
      - 'But evil exists ($E$): contradiction.'
    hint: 'Power first, then goodness, then combine and compare with the facts.'
    explanation: |
      Valid reasoning: if both added principles hold, no world with $O$ and $G$ contains evil. Notice what the derivation shows: not that God does not exist, but that **the four claims** ($O$, $G$, $E$ and the added principles) cannot all be true. Something has to be given up.

  - type: build
    id: bridge
    title: "The bridge formula"
    prompt: |
      With the two added principles, "if God is omnipotent **and** wholly good, then there is no evil" becomes one sentence. Build it, using $\land$ for "and", $\Rightarrow$ for "if ... then" and $\lnot E$ for "evil does not exist".
    prefix: 'Bridge:'
    tiles: ['O', '\land', 'G', '\Rightarrow', '\lnot E', 'E', '\lor']
    answers:
      - ['O', '\land', 'G', '\Rightarrow', '\lnot E']
    wrong:
      - answer: ['O', '\land', 'G', '\Rightarrow', 'E']
        feedback: 'This says an omnipotent, wholly good God *implies* that evil exists: the reverse of Mackie''s premise.'
      - answer: ['O', '\lor', 'G', '\Rightarrow', '\lnot E']
        feedback: 'With "or", either power alone would already imply no evil. The argument needs **both** power and goodness: a weak good being or a powerful bad one could leave evil in place.'
    hint: 'Both properties on the left, the absence of evil on the right.'
    explanation: |
      The bridge $(O \land G) \Rightarrow \lnot E$ together with $O$, $G$ and $E$ is inconsistent: from $O$ and $G$ we get $\lnot E$, which contradicts $E$. A brute-force check of all assignments confirms it: with the two added principles included, there is no assignment making all six sentences true; dropping either principle leaves a consistent set.

  - type: mcq
    id: reject
    title: "Which premise would a theist reject?"
    prompt: |
      The derivation is valid. A theist who accepts $O$, $G$ and $E$ must therefore reject one of the added principles. Which rejection is both possible and reasonable?
    options:
      - text: 'Reject "a good being always eliminates evil as far as it can": a good being may allow some evil if removing it would cost something it values more, or if removing it is not possible without losing a greater good.'
        correct: true
        feedback: |
          Yes, this is the usual route. A surgeon causes pain because a greater good needs it; a parent lets a child fall learning to walk. Goodness is then compatible with tolerated evil **when there is a sufficient reason**.
      - text: 'Reject the rule of logic that a contradiction cannot be true.'
        feedback: |
          That would end the argument by ending argument itself. A theist who wants to be taken seriously keeps logic and rejects a premise.
      - text: 'Reject $E$, since evil is only a matter of opinion.'
        feedback: |
          This is a different escape (denying that evil is real), not the standard reply. Most defenders accept that real suffering and wrongdoing exist.
    explanation: |
      Two targets: the first principle (a good being may have reasons to allow evil) and the second (omnipotence does not include doing what is logically impossible, so "can do anything" needs care). Both replies end up in the same place: the added principles are **not obviously true**. And that is all a theist needs against a charge of *inconsistency*, as the next cards show.

  - type: mcq
    id: consistency
    title: "How do you show consistency?"
    prompt: |
      Mackie says $\{O, G, E\}$ (with his principles) cannot all be true. To answer him, a defender wants to show the claims *can* all be true together. What is enough?
    options:
      - text: 'One possible situation in which all of them hold, even if nobody believes it is the real one.'
        correct: true
        feedback: |
          Yes: consistency means "true together in some possible world". One coherent story with $O$, $G$ and $E$ all true suffices; it need not be true, plausible, or even believed.
      - text: 'A proof that the story is true of our world.'
        feedback: |
          That is far too much. Proving the story true would be a **theodicy** (the real reasons for evil). To answer "inconsistent" you only need possibility.
      - text: 'A proof that evil is probably good for us.'
        feedback: |
          That is again a claim about probability and truth, not about consistency.
    explanation: |
      According to the Stanford Encyclopedia a **defense** is generally an attempt to show there is no logical incompatibility between evil and God. In symbols, to answer Mackie one shows
      $$\Diamond\,(O \land G \land E).$$
      This is a modest goal on purpose: a story that is *possible* defeats a claim that the set is *impossible*.

  - type: text
    id: fwd
    title: "The free-will defence"
    image:
      src: img/plantinga.webp
      alt: "Alvin Plantinga smiling during a lecture"
      caption: "Alvin Plantinga (born 1932), an American philosopher, set out the free-will defence in God, Freedom, and Evil and The Nature of Necessity (both 1974)."
      credit: "Jonathunder, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:AlvinPlantinga.JPG"
      place: bottom
    body: |
      **Alvin Plantinga** (born 1932) took Mackie's essay as his starting point. His story, the **free-will defence**, runs in essence like this:

      - A world with creatures who are **significantly free** (free to do right or wrong) and who mostly do right is more valuable than a world of creatures with no choice.
      - But God cannot *cause* a free creature to choose right: a caused choice is not free.
      - So the creatures might do wrong, and then moral evil exists, though God is omnipotent and wholly good.

      The Stanford Encyclopedia puts the core idea this way: "The good of libertarian free will requires, in short, the possibility of moral evil." Plantinga's conclusion, in his words quoted by a critic, is that the three claims are consistent: "Accordingly (1) is consistent with (2); the Free Will Defence is successful."

  - type: mcq
    id: mackie-reply
    title: "Mackie's counter: why not always right?"
    prompt: |
      Mackie anticipated this reply. He says God was not forced to choose between innocent automata and creatures who sometimes do wrong: God had a better option, to make beings who **freely always act right**. Why might a defender say this option is not available?
    options:
      - text: 'Whether a free creature would choose right in a given situation is not up to God; if the true facts are that it would go wrong somewhere, God could only avoid wrongdoing by not giving it the choice.'
        correct: true
        feedback: |
          Yes. This is Plantinga's central move. "Omnipotent" means God can do what is logically possible to do; it does not mean God can make true a statement about what a free creature would freely choose.
      - text: 'God is not really omnipotent after all.'
        feedback: |
          The defence keeps omnipotence. It limits only what omnipotence *means*: power over what is logically possible. Even a God who can do anything possible cannot do the logically impossible, such as causing a choice to be both caused and free.
      - text: 'Free creatures are always worse than robots.'
        feedback: |
          The defence says the opposite: freedom is a great good, which is why God would want it.
    explanation: |
      This reply depends on two things the next cards make precise: what "would freely choose" means, and that these facts might not be up to God. Note also what Mackie's reply assumes: that being free is compatible with being certain to do right (a view called compatibilism). Plantinga's defence uses the stronger, libertarian kind of freedom, where the choice is not settled in advance by prior causes. Philosophers argue about which is right.

  - type: text
    id: counterfactuals
    title: "Counterfactuals of freedom and feasible worlds"
    body: |
      A **counterfactual of freedom** is a statement of the form "if creature $c$ were placed in situation $S$, $c$ would freely do $A$". Suppose such a statement is true. Then God, by *creating* $c$ and placing $c$ in $S$, cannot also make $c$ do right: any world where $c$ freely does right in $S$ is simply not one God can bring about, because the true counterfactual rules it out.

      The worlds God can actually bring about are the **feasible** worlds (those consistent with all the counterfactuals of freedom that are true). Logically possible worlds are many more.

      A small toy shows the idea. A creature, Cara, may be put by God in situation $S_1$, in $S_2$, in both, or in neither (so not made free at all). Suppose it is true that:

      - in $S_1$ Cara would freely do wrong;
      - in $S_2$ Cara would freely do wrong.

      A world is *good-and-free* if Cara is placed in at least one situation (so she is free) and does no wrong in any of them.

  - type: numeric
    id: toy-count
    title: "Count the feasible good worlds"
    prompt: |
      God chooses which of Cara's two situations $S_1$, $S_2$ to put her in (none, only $S_1$, only $S_2$, or both: 4 options). It is true that Cara would freely do wrong in $S_1$ and would freely do wrong in $S_2$. How many of the 4 options give a world where Cara is free (put in at least one situation) and does **no** wrong?
    answer: 0
    hint: 'Check each option: any option that includes a situation includes a wrong act.'
    explanation: |
      The four options are: none (no freedom, so not free), only $S_1$ (wrong), only $S_2$ (wrong), both (wrong twice). By script: zero good-and-free worlds. No matter how much God wants Cara free and good, there is no feasible way: the facts about what she would freely do block it.

  - type: numeric
    id: toy-count-2
    title: "Change one counterfactual"
    prompt: |
      Now suppose that in $S_1$ Cara would freely do wrong, but in $S_2$ she would freely do **right**. Again God picks none, only $S_1$, only $S_2$, or both. How many of the 4 options give a world where Cara is free and does no wrong?
    answer: 1
    hint: 'Only one option puts her in a situation without including the situation where she goes wrong.'
    explanation: |
      Only "just $S_2$" works: it makes her free and she does right. "Both" includes $S_1$, where she does wrong; "only $S_1$" is wrong; "none" has no freedom. So whether a good free world is feasible depends on the *true counterfactuals*, which in this story are not up to God.

  - type: mcq
    id: twd
    title: "Transworld depravity, stated carefully"
    prompt: |
      Plantinga says a creaturely essence (what an individual would do in each situation) suffers from **transworld depravity** when, in every feasible world in which it is significantly free, it does at least one wrong. Which claim does he actually make about it?
    options:
      - text: 'It is *possible* that every creaturely essence suffers from transworld depravity. If so, God could not have created free creatures with moral good and no moral evil.'
        correct: true
        feedback: |
          Yes. He does not say it is true; the defence needs only that it is logically possible. Critics who quote him write that "it is possible that every creaturely essence suffers from transworld depravity."
      - text: 'Every human being is actually depraved in every possible world.'
        feedback: |
          This inflates the claim into a thesis about actual humans. The concept is modal and limited to *feasible* worlds, and Plantinga asserts only its possibility.
      - text: 'God caused creatures to be depraved so that they would sin.'
        feedback: |
          The opposite: the defence says the depravity is a fact about what the creatures would freely do, not something God arranged.
    explanation: |
      The scope matters: a claim about *possibility* needs only one coherent scenario, and if that scenario holds, the set $\{O, G, E\}$ is consistent. In the toy, Cara with both counterfactuals "wrong" is transworld depraved: every feasible free world contains a wrong. Plantinga needs only that every essence could be so.

  - type: mcq
    id: shows-what
    title: "What does a possible-worlds argument show?"
    prompt: |
      Suppose the free-will defence works as intended. What has it shown?
    options:
      - text: 'That the claims "God is omnipotent", "God is wholly good" and "evil exists" are logically consistent: a possible scenario makes all three true.'
        correct: true
        feedback: |
          Yes. A possible-worlds argument establishes possibility. This blocks the claim that the set is contradictory, and it stops there.
      - text: 'That God exists.'
        feedback: |
          A consistency result is not a proof of God. It says an argument against God of one kind (inconsistency) fails, not that any argument for God works.
      - text: 'That the actual evil in the world is probably explained by free will.'
        feedback: |
          That would be a claim about probability and about reality. The defence tells a story that *might be* true; it does not claim it is true or likely. Whether a theist can hold that evil is not strong evidence against God is the **evidential** problem, taken up in the next lesson.
    explanation: |
      Two different questions: (1) are the claims **consistent**, which a possible story answers? (2) how **probable** is God given the amount and kind of evil, which needs evidence about this world? According to the Stanford Encyclopedia, Plantinga's early work was mainly about compatibility; the second question is where later debate moved.

  - type: mcq
    id: trap-logical-evidential
    title: "Trap: logical or evidential?"
    prompt: |
      A critic says: "The sheer amount of suffering in the world makes it unlikely that a good, all-powerful God exists." A student replies: "But Plantinga showed that evil is logically compatible with God." Does the reply answer the critic?
    options:
      - text: 'No: the critic is making an *evidential* claim (unlikely), not a *logical* one (impossible). Consistency does not settle probability.'
        correct: true
        feedback: |
          Right. The reply answers a different, stronger claim. Even a consistent story can be very improbable given what we observe, and evidence about the world is what the critic relies on.
      - text: 'Yes: if evil is compatible with God, it cannot count against God in any way.'
        feedback: |
          Compatible does not mean *neutral*: a hypothesis can be consistent with the data and still be made less likely by it.
      - text: 'Yes: the critic is logically inconsistent.'
        feedback: |
          The critic is not saying the theist contradicts herself, only that the evidence favours another view.
    explanation: |
      The Stanford Encyclopedia also distinguishes: an incompatibility argument aims at **inconsistency**; an evidential argument aims at making God **unlikely**. Answering one does not answer the other. This is the trap of the whole topic.

  - type: mcq
    id: trap-natural
    title: "Trap: does it cover earthquakes?"
    prompt: |
      The free-will defence explains why God might permit **moral evil** (wrongdoing by free creatures). A student says: "So it also explains why God permits cancer and earthquakes." Is that right?
    options:
      - text: 'Not as it stands: those are *natural* evils, not caused by human free choices. A defender needs a further story (Plantinga suggests that possibly natural evil is due to the free activity of non-human persons), and critics doubt such stories.'
        correct: true
        feedback: |
          Yes. Plantinga writes that "possibly natural evil is due to the free activity of a set of non-human persons" (a critic quotes this, page 192). Since the goal is only consistency, a *possible* scenario is enough; the critic Raymond Bradley replies that it leaves the responsibility with God by a principle of command responsibility. Others look for a different account.
      - text: 'Yes: free will explains everything, since all suffering ultimately comes from human choices.'
        feedback: |
          Most suffering from disease, famine or earthquake does not trace to any human choice. Moral and natural evil are distinguished for this reason.
      - text: 'No: the free-will defence only works for moral evil, so natural evil disproves God.'
        feedback: |
          Too fast. The claim is only that the defence *alone* does not cover natural evil. The theist has other moves, and a disproof would need an argument that they all fail.
    explanation: |
      Two layers: (1) the free-will defence addresses **moral evil**; (2) a possible story for natural evil is a further move, whose strength is disputed. Later lessons take up natural evil again.

  - type: mcq
    id: resolve
    title: "Resolve the hook"
    prompt: |
      Back to the opening puzzle: a powerful, perfectly good maker wants truly free creatures. According to the free-will defence, why might it be impossible to guarantee that they never do wrong?
    options:
      - text: 'Because what a free creature would choose in a situation is a fact not settled by the maker''s will; it is possible that, whichever free creatures the maker could actually bring about, each would go wrong somewhere.'
        correct: true
        feedback: |
          Exactly: transworld depravity, a possibility. It makes the guarantee unavailable *without* limiting the maker's power over what is possible. Critics respond by questioning libertarian freedom or the possibility claim itself.
      - text: 'Because the maker is not powerful enough.'
        feedback: |
          The defence keeps omnipotence: the limit is logical, not a lack of power.
      - text: 'Because free creatures are worse than automata.'
        feedback: |
          The defence says freedom is a great good, worth the risk.
    explanation: |
      So your first guess was the defence's core intuition, and Mackie's objection is its main rival. Where thoughtful people part ways: (1) is libertarian freedom coherent and valuable enough? (2) is transworld depravity really possible, or is it an ad hoc stipulation? The Internet Encyclopedia of Philosophy says that "all parties admit" that the defence successfully rebuts the logical problem as formulated by atheists in the mid-twentieth century; what remains disputed is the evidential problem.

  - type: text
    id: summary
    body: |
      **Next:** the evidential problem of evil. Even if evil and God are logically consistent, how likely is a good God given the *kind and amount* of suffering, and what does a case such as a fawn dying slowly in a forest fire show?
