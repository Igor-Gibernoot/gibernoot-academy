id: ch07-agnostic
title: "Agnosticism and Its Varieties"
kind: concept
own: |
  The setting: let $G$ be the claim "God exists" (the God of classical theism), and $\lnot G$ its denial. Two different questions can be asked about $G$. *What do you believe?* (theist: believes $G$; atheist in the broad sense: lacks that belief; in the narrow sense: believes $\lnot G$.) *What can be known?* An **agnostic**, a word coined around 1869 by T. H. Huxley (1825-1895), answers the second: neither $G$ nor $\lnot G$ is known.
  - **Strong, weak and practical agnosticism.** *Strong*: nobody can know, even in principle (the most demanding claim, since it is about the limits of all possible evidence). *Weak*: I do not know, and perhaps someone could. *Practical* (apathetic, pragmatic): perhaps unsettled, but it makes no difference to how I live. Belief and knowledge are separate questions, so a person can be an agnostic theist or an agnostic atheist.
  - **When suspending judgement fits.** After weighing the evidence $E$, the odds of $G$ against $\lnot G$ are
  {{ $$\frac{P(G\mid E)}{P(\lnot G\mid E)}=\frac{P(E\mid G)}{P(E\mid \lnot G)}\cdot\frac{P(G)}{P(\lnot G)}$$ }}
  If the evidence is balanced, meaning
  {{ $$\frac{P(E\mid G)}{P(E\mid \lnot G)}=1$$ }}
  then the odds stay at the prior odds: the evidence has not moved you. Huxley's negative principle (in his words): do not pretend that conclusions are certain which are not demonstrated or demonstrable.
  - **Credence is not ignorance.** A credence of $0.5$ can rest on strong evidence (a coin known to be fair) or on none (a coin of unknown bias, either $0.8$ or $0.2$ heads, equally likely). The first stays at $0.5$ after a head; the second rises to $0.68$ for the next toss. Agnosticism can be an honest *state of weak or unstable evidence*, not a number alone.
  - **Staying out is still an act.** Pascal's wager (the acts are living as if $G$ or not, the states are $G$ true or false, with $p=P(G)$) has expected value
  {{ $$\begin{aligned}\mathrm{EV}={}&p\cdot(\text{payoff if }G)\\&+(1-p)\cdot(\text{payoff if }\lnot G)\end{aligned}$$ }}
  and refusing to decide is one of the acts. So an agnostic about belief still has to choose how to live.
  - **Where thoughtful people part ways.** Whether strong agnosticism refutes itself (does "nobody can know" claim to know too much?), whether the default is "not believing" (Flew) or "open", and whether agnosticism is honesty or evasion.
cards:
  - type: mcq
    id: hook
    title: "Guess: what is she saying?"
    prompt: |
      A friend says, in a calm voice: "I just don't know whether God exists." Guess, before any theory: what is she reporting?
    options:
      - text: 'It could be two different things: how far she believes it, or whether it can be known at all. We need to separate those two questions.'
        correct: true
        feedback: |
          Yes. "I don't know" can mean "I have no belief either way" or "no one is in a position to know". Those are different claims, and the lesson names them.
      - text: 'She believes God does not exist, in a polite way.'
        feedback: |
          Tempting, because "I don't know" can be a soft "no". But a person who believes there is no God would say so; someone who truly does not know has not made up her mind either way.
      - text: 'She is refusing to answer, so she says nothing about the question.'
        feedback: |
          Not quite. "I don't know" is an answer about her own state, and it can be a considered one. Whether it is an honest one, or an evasion, is something we test later in the lesson.
    explanation: |
      We will see that "agnostic" is not simply a third belief next to "God exists" and "God does not exist". It answers a different question, and it comes in several strengths. At the end we return to your friend.

  - type: text
    id: huxley
    title: "Huxley and the word"
    image:
      src: img/huxley.webp
      alt: "Studio photograph of Thomas Henry Huxley, an older man with white side-whiskers, seated and looking at the camera"
      caption: "Thomas Henry Huxley (1825-1895), the English biologist who coined the word agnostic."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Henry_Huxley_1874.JPG"
    body: |
      The word **agnostic** was coined by the biologist **Thomas Henry Huxley** (1825-1895). According to Britannica it was first used in public in 1869 at the Metaphysical Society in London, though historians dispute the exact occasion; Huxley himself says only that he invented it for that Society. He built it from the Greek *a-* ("without") and *gnosis* ("knowledge"), as the opposite of the early Christian "Gnostics" who, he said, professed to know so much about things of which he was ignorant.

      In his 1889 essay "Agnosticism" Huxley states it as a rule of method, not a belief. The negative half is, in his words: "In matters of the intellect do not pretend that conclusions are certain which are not demonstrated or demonstrable." According to the Stanford Encyclopedia, applied to God this says: since neither theism nor atheism is adequately supported, suspend judgement.

      Three words, then, answer *two different questions*:

      - **Belief**: *Do you believe that God exists?* A **theist** says yes. An **atheist** says no, either by *lacking* the belief (broad sense) or by *believing God does not exist* (narrow sense, the one philosophers usually mean).
      - **Knowledge**: *Is it known whether God exists?* An **agnostic** says: no, neither answer is known.

      *Layers.* The word's history is established fact. Whether the question can be settled is a live debate. What anyone concludes about God is a faith or metaphysical commitment, and the lesson takes no side.

  - type: mcq
    id: sort
    title: "Belief or knowledge?"
    prompt: |
      Which of these statements are claims **about knowledge** (about what is or can be known), and not only reports of what a person believes? Select all that apply.
    multiple: true
    options:
      - text: '"I believe that God exists."'
        feedback: |
          This reports a belief. It says what she holds, not whether anyone knows it. Many believers hold a belief while saying it is not known in the strict sense.
      - text: '"Nobody can know whether God exists."'
        correct: true
      - text: '"I lack the belief that God exists."'
        feedback: |
          This reports a state of mind (no belief), not a claim about what is knowable. It is the broad sense of atheism and it is also compatible with agnosticism.
      - text: '"The evidence we have does not establish whether God exists."'
        correct: true
    explanation: |
      The second and fourth statements are about what is or can be known or established. The first and third only say what the speaker believes. According to the Stanford Encyclopedia, one can consistently believe that theism (or atheism) is true while denying that it is *known* to be true. That is why belief and knowledge need separate boxes.

  - type: mcq
    id: strong-weak
    title: "Strong or weak?"
    prompt: |
      Two people both call themselves agnostics about God.

      - **Ana** says: "I don't know whether God exists. Perhaps someone, someday, will find out."
      - **Ben** says: "Nobody can know, ever. The question lies beyond any possible evidence."

      Which claim is the harder to defend, and why?
    options:
      - text: 'Ben''s. He makes a claim about the limits of all possible evidence, for everyone, in principle.'
        correct: true
        feedback: |
          Yes. Ben is a **strong** agnostic. His claim needs an argument that no experiment, experience or reasoning could ever settle the matter. Ana is a **weak** (or empirical) agnostic: she reports where she stands and leaves the door open.
      - text: 'Ana''s. Saying "I don''t know" about something so big is a bigger claim than saying it cannot be known.'
        feedback: |
          Saying "I don't know" is a report about one person, easy to check against herself. Ben's claim is about everybody, forever, which needs far more support.
      - text: 'They are equally demanding; "unknown" and "unknowable" differ only in wording.'
        feedback: |
          They differ in strength. "Unknown now" is compatible with a future answer; "unknowable" rules one out. Confusing them is a common slip.
    explanation: |
      According to the Stanford Encyclopedia, the strongest forms of epistemological agnosticism say that neither belief has positive epistemic status of any sort (for example, that neither is rationally permissible). Weak agnosticism claims much less: only that, for now or for me, the answer is not known.

  - type: mcq
    id: practical
    title: "A third kind: practical agnosticism"
    prompt: |
      Pat says: "Maybe the question can be settled, maybe not. Either way it changes nothing about how I live or what I do, so I don't spend time on it." How does Pat's position differ from Ana's (weak agnosticism)?
    options:
      - text: 'Ana''s position is about knowledge (the question is open); Pat''s is also about its importance for life: the question is set aside as practically irrelevant.'
        correct: true
        feedback: |
          Yes. This is sometimes called **practical**, **pragmatic** or **apathetic** agnosticism, a close relative of *apatheism* (indifference to whether gods exist, a term popularized by the journalist Jonathan Rauch in 2003). Pat adds a view about life, not only about knowledge.
      - text: 'Pat is a strong agnostic, because he refuses to consider the question.'
        feedback: |
          Strong agnosticism is a claim that nobody *can* know. Pat does not claim that; he says the question does not matter to him.
      - text: 'There is no difference: any agnostic ignores the question.'
        feedback: |
          Ana may care a great deal and read widely while still lacking an answer. Not knowing and not caring are different, and a pragmatic position needs its own defense: is it really true that the answer would change nothing? We test that with Pascal soon.
    explanation: |
      So far three varieties: **strong** (nobody can know), **weak** (I do not know; perhaps someone can) and **practical** (unsettled, and irrelevant to how I live). Treat the labels with care: authors draw the boundaries differently, and reference works do not all list practical agnosticism as a type. The labels are tools for asking exactly what is being claimed.

  - type: text
    id: grid
    title: "Belief and knowledge: a grid"
    body: |
      Because belief and knowledge are separate questions, put them on two axes:

      | | Claims to know | Does not claim to know |
      |---|---|---|
      | **Believes God exists** | gnostic theist | agnostic theist |
      | **Does not believe it** | gnostic atheist | agnostic atheist |

      Here "gnostic" is used in its plain sense: someone who claims to know the answer. According to the Stanford Encyclopedia, "agnostic atheists" are people who say their atheism is not irrational but lacks the status that turns a true belief into knowledge, and some fideists (people who hold that faith does not rest on proof) are extreme epistemological agnostics while having faith.

      The grid is a convenient tool, not a law. Some thinkers dislike it, since in the narrow sense "atheism" is a claim and in the broad sense it is only a lack of belief. The grid works best with the broad sense.

  - type: mcq
    id: grid-q
    title: "Which cell?"
    prompt: |
      Dana prays every day and believes that God exists. Asked whether she *knows* it the way she knows her address, she says: "No. I hold it by faith; I can't claim to know it." Which cell of the grid (belief by knowledge claim) is Dana in?
    options:
      - text: 'Agnostic theist: she believes, and does not claim knowledge.'
        correct: true
        feedback: |
          Yes. Faith without a claim to knowledge is the standard example of this cell, and some fideists defend it explicitly.
      - text: 'Agnostic atheist: anyone who does not claim to know is an atheist.'
        feedback: |
          "Atheist" answers the belief question. Dana believes, so she is not an atheist in either sense, whatever she says about knowing.
      - text: 'Gnostic theist: believing is knowing.'
        feedback: |
          The slip is to merge belief with knowledge. Dana separates them herself; the grid exists to respect that.
    explanation: |
      The grid shows that "agnostic" does not mean "neither theist nor atheist". It is a different axis. In the Stanford Encyclopedia's discussion, if agnosticism is taken as the proposition "neither theism nor atheism is known", then it no longer labels people who are neither theists nor atheists. Those who use the older word in the psychological sense (suspending judgement) mean something narrower: someone who believes neither that God exists nor that God does not.

  - type: mcq
    id: flew
    title: "Where does the burden sit?"
    prompt: |
      Recall from the lesson Occam, Burden of Proof and Naturalism: the philosopher Antony Flew (1923-2010), in a 1972 paper, argued in essence for a **presumption of atheism** in the broad sense of *not believing*, as a court presumes innocence until the case is made. Which reply could an agnostic fairly give?
    options:
      - text: 'A default of not believing fits agnosticism too. What it does not give is a reason to assert that God does not exist; that further claim carries a burden of its own.'
        correct: true
        feedback: |
          Yes. The presumption protects the stance "I am not convinced", which the agnostic shares. It does not justify the narrow, positive denial. A denial is also an assertion about reality.
      - text: 'The presumption is false, because the burden always sits on the person who says no.'
        feedback: |
          Burdens attach to claims, not to sides. A denial is a claim too, and who owes reasons first in a given debate is disputed (it depends partly on prior probability, as the Stanford Encyclopedia notes).
      - text: 'Flew was himself an agnostic, so the presumption is an agnostic principle.'
        feedback: |
          Flew presented his presumption as a neutral starting procedure and, according to summaries of the paper, did not himself take the agnostic position. The agnostic can use the neutral point while differing in the conclusion.
    explanation: |
      Some agnostics reply even more strongly that the starting point should be "open", not "not believing". Flew's side answers that "open" is already a position. Where thoughtful people part: which default is neutral, and whether a neutral default exists at all. (Paraphrase: the paper itself was not read in full for this lesson.)

  - type: numeric
    id: pascal
    title: "Staying out is still an act"
    prompt: |
      Recall from the lesson Guided Proof: Pascal's Wager: the **expected value** of an act weights each payoff by the probability of its state,

      $$\begin{aligned}\mathrm{EV}={}&p\cdot(\text{payoff if }G)\\&+(1-p)\cdot(\text{payoff if }\lnot G)\end{aligned}$$

      where $p=P(G)$, the probability that God exists. Toy numbers: if you live as if $G$ is true, you gain $+1000$ if God exists and lose $10$ if not. If you live as if it is false, the payoff is $0$ either way. Your probability for $G$ is $p=0.02$. What is the expected value of living as if $G$ is true?
    answer: 10.2
    tolerance: 0.01
    wrong:
      - { value: 20, feedback: 'You counted only the first term, $0.02\times1000$. The cost $-10$ occurs with probability $0.98$ and subtracts $9.8$.' }
      - { value: -9.8, feedback: 'You counted only the second term. The gain of $1000$ occurs with probability $0.02$ and adds $20$.' }
    hint: 'Two terms: $0.02\times1000$ plus $0.98\times(-10)$.'
    explanation: |
      $0.02\times1000=20$ and $0.98\times(-10)=-9.8$, so $\mathrm{EV}=20-9.8=10.2$, against $0$ for living as if $G$ is false. According to Pascal (1623-1662), in essence, "you must wager. It is not optional": not deciding is not an exit, because how you live is itself one of the acts. A practical agnostic who says "it changes nothing" is therefore making a claim that the table above can test. Critics reply that this table is too simple (rival gods, other costs, whether belief can be chosen); that debate is in the Pascal lesson. The point here is only that **suspending belief is not suspending action**.

  - type: text
    id: fits
    title: "When does suspension fit the evidence?"
    body: |
      Huxley's rule is not "always doubt" but "proportion what you claim to what has been shown". Take two hypotheses, $G$ (God exists) and $\lnot G$ (not). Recall the odds form of Bayes' rule, where $E$ is all the evidence:

      $$\frac{P(G\mid E)}{P(\lnot G\mid E)}=\frac{P(E\mid G)}{P(E\mid \lnot G)}\cdot\frac{P(G)}{P(\lnot G)}$$

      The first factor is the **Bayes factor** (the same thing as the *likelihood ratio* of the earlier lessons on Bayes' rule): how much more likely the evidence is if $G$ is true than if it is false. If it equals $1$, the evidence leaves the odds where they were.

      A toy, with made-up numbers. Start with prior $P(G)=0.5$. There are two independent pieces of evidence. Evidence $A$ (say, some feature of the world that theists find natural): $P(A\mid G)=0.6$, $P(A\mid\lnot G)=0.2$. Evidence $B$ (something skeptics find natural): $P(B\mid G)=0.2$, $P(B\mid\lnot G)=0.6$. The two are independent given each hypothesis, so their Bayes factors multiply.

  - type: numeric
    id: balanced
    title: "Balanced evidence"
    prompt: |
      With prior $P(G)=0.5$ and the evidence $A$ and $B$ described above ($A$: $P(A\mid G)=0.6$, $P(A\mid\lnot G)=0.2$; $B$: $P(B\mid G)=0.2$, $P(B\mid\lnot G)=0.6$; independent given each hypothesis), what is $P(G\mid A\text{ and }B)$?
    answer: 0.5
    tolerance: 0.001
    wrong:
      - { value: 0.75, feedback: 'That is the answer after $A$ alone (odds $3$, so $3/4$). You have to include $B$, which pulls back by the same factor.' }
      - { value: 0.25, feedback: 'That is the answer after $B$ alone. You have to include $A$ as well.' }
    hint: 'Bayes factors multiply: $\frac{0.6}{0.2}\times\frac{0.2}{0.6}$, then apply it to the prior odds.'
    explanation: |
      The Bayes factors are $3$ for $A$ and $\tfrac13$ for $B$, so together $3\times\tfrac13=1$. The posterior odds equal the prior odds, $1$, so $P(G\mid A,B)=0.5$. **Balanced** evidence is exactly the case in which the data have not moved you, and withholding a verdict (staying at the prior) is the proportionate response. The Stanford Encyclopedia notes an argument of this shape (Le Poidevin) that neither theism nor atheism is known, because there is no firm basis for judging either more probable on the total evidence. Others reject that premise: if one hypothesis had a very low prior, the same evidence would favour the other, and suspension would not be the right reply.

  - type: numeric
    id: coin
    title: "50/50 is not ignorance"
    prompt: |
      A **fair coin** and a **mystery coin** both give credence $0.5$ to heads on the next toss. The mystery coin is known to be one of two kinds, equally likely: bias $0.8$ (heads with probability $0.8$) or bias $0.2$. You toss each once and see **heads**. What is now your credence that the next toss of the *mystery coin* shows heads? (The fair coin stays at $0.5$.)
    answer: 0.68
    tolerance: 0.005
    wrong:
      - { value: 0.5, feedback: 'That would be right for the fair coin. For the mystery coin, one head is evidence that it is the $0.8$ kind.' }
      - { value: 0.8, feedback: 'That would treat the coin as certainly the $0.8$ kind. One head makes it likelier, not certain: $P(0.8\text{-kind})=0.8$, not $1$.' }
    hint: 'First update the kind: $P(0.8\text{-kind}\mid\text{head})=\frac{0.8\cdot0.5}{0.8\cdot0.5+0.2\cdot0.5}$. Then average the next-toss chance over the two kinds.'
    explanation: |
      After a head, $P(0.8\text{-kind})=0.4/0.5=0.8$. The next toss is heads with probability $0.8\times0.8+0.2\times0.2=0.64+0.04=0.68$. The two coins had the same credence $0.5$ but very different *resilience*: the fair coin's $0.5$ rests on knowledge, the mystery coin's on symmetry of ignorance. This is a warning for agnosticism: "I am at 50/50" can mean either "the evidence is balanced and I have looked" or "I have not looked". A number alone does not say which. (Whether suspending judgement is best modelled by a credence at all is a live debate; this is one model.)

  - type: mcq
    id: evasion
    title: "Honest suspension or evasion?"
    prompt: |
      Huxley's critics, such as the writer W. H. Mallock in an essay titled "Cowardly Agnosticism", argued that some agnosticism hides a refusal to face a conclusion. Which of these describe a suspension of judgement that is **not** honest? Select all that apply.
    multiple: true
    options:
      - text: 'Someone who has studied the main arguments, finds them roughly balanced, and holds off a verdict.'
        feedback: |
          This is the honest case Huxley describes: the claim is proportioned to what has been shown, after the work of looking.
      - text: 'Someone who says "nobody can know" to avoid reading the arguments, though a verdict would be uncomfortable.'
        correct: true
      - text: 'Someone who uses "we can''t know" for God but treats equally weak evidence on other topics as settled, so the standard shifts with the topic.'
        correct: true
      - text: 'Someone who suspends judgement because a specific decisive observation is expected soon.'
        feedback: |
          This is reasonable. If a relevant test is coming, waiting is what the evidence recommends.
    explanation: |
      The test is not the label but the **reasons**: has the person looked, and is the standard the same across topics? The Stanford Encyclopedia adds a different caution: "I don't know" is not a *direct* answer to the question "does God exist?", since the direct answers are yes and no. It is an answer about the speaker, which can be fine, but it does not replace the question. Mallock's own case, in essence, was that Huxley's principles amount in practice to denying God and the soul, and that Huxley refused to say so. Huxley's side replies that a method which claims no more than the evidence shows is the opposite of cowardice.

  - type: mcq
    id: selfdefeat
    title: "Does strong agnosticism refute itself?"
    prompt: |
      A common objection to strong agnosticism ("nobody can know whether God exists"): to say a thing is unknowable you must already know a great deal about it, so the claim claims too much and undermines itself. Which reply is the best defense of the strong agnostic?
    options:
      - text: 'The claim can rest on an argument about the evidence, for example that there is no firm basis for judging either side more probable, without claiming to know what God is or is not. And "unknowable about this topic" does not turn into "nothing is knowable".'
        correct: true
        feedback: |
          Yes. A claim about the limits of knowledge of one subject needs reasons about the evidence, not omniscience about the subject. Critics reply that the argument's premises are themselves disputed, so the burden shifts to the strong agnostic's premises.
      - text: 'The objection is right, so strong agnosticism is simply false and weak agnosticism is the only coherent kind.'
        feedback: |
          This goes too far. The objection shows strong agnosticism needs an argument. It does not show that no such argument exists. Weak agnosticism is safer, not the only coherent option.
      - text: 'A strong agnostic need not give any argument, because "unknowable" is only a feeling.'
        feedback: |
          Then it would be a report of her mood, not the claim that nobody can know. The strong claim is a proposition about all possible evidence and needs support like any proposition.
    explanation: |
      This is a live debate. The weak agnostic avoids the objection (she claims only her own present ignorance), but at the price of a weaker conclusion: someone may know. The strong agnostic keeps the interesting conclusion but takes on a hard burden. Both sides agree on the format of the question: what exactly are the premises about evidence? (The objection is stated here as critics commonly put it; the Stanford Encyclopedia does not itself pose it.)

  - type: mcq
    id: resolve
    title: "Back to your friend"
    prompt: |
      Your friend adds: "I've read the main arguments on both sides. They seem balanced to me, so I neither believe God exists nor believe God does not. I won't claim that no one could ever settle it, though." Which description fits her best?
    options:
      - text: 'A weak agnostic who suspends judgement: she lacks both beliefs, and claims only that she does not know.'
        correct: true
        feedback: |
          Yes. She separates belief (neither) from knowledge (she does not know), declines the strong claim that nobody can, and has done the looking. By the grid she is an agnostic and, in the broad sense, not a theist (an atheist only in the broad sense of lacking the belief).
      - text: 'A strong agnostic, since she suspends judgement on both sides.'
        feedback: |
          Strong agnosticism is a claim about all possible evidence; she explicitly refuses it.
      - text: 'A practical agnostic, since she is undecided.'
        feedback: |
          Practical agnosticism adds that the question is irrelevant to how one lives. She reads the arguments carefully, so for her it clearly matters.
    explanation: |
      So "I just don't know" can be a careful position with a specific meaning, or a loose phrase. The lesson's tools tell them apart: which question is answered (belief or knowledge), how strong the claim is (strong, weak, practical), and whether the reasons are real (balanced evidence, same standard on every topic, the choice of how to live still made).

  - type: text
    id: summary
    body: |
      **Next:** Level 7 ends with a traps round on the errors people make about the God debate: confusing a defense with a theodicy, assuming the burden always sits on the denier, treating the wager as a proof, and now "agnostic means undecided and nothing more". Try to spot the slip before the explanation.
