id: ch07-challenge-2
title: "Level Challenge: Weigh the Objection (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: hiddenness weighed, agnosticism pressed"
    body: |
      Part 2 stands alone. Two problems and a final weighing. Here is the toolkit, restated.

      - **Hiddenness (Schellenberg).** Let $G$ = "a perfectly loving personal God exists" and $D$ = "nonresistant nonbelievers exist" (people who are not resisting God, are capable of a relationship, and do not believe God exists). The argument: $G\Rightarrow\lnot D$ (love keeps God open to relationship, which needs belief), and $D$ is observed, so $\lnot G$. The logic (modus tollens) is valid; the fight is over the premises.
      - **Odds form of Bayes' rule.** With rival $\lnot G$ ("no such God"):
      $$\frac{P(G\mid D)}{P(\lnot G\mid D)}=\frac{P(D\mid G)}{P(D\mid\lnot G)}\times\frac{P(G)}{P(\lnot G)}$$
      The first factor is the **Bayes factor**. A probability from odds is $\text{odds}/(1+\text{odds})$. Factors of independent pieces of evidence multiply.
      - **Belief and knowledge are two axes.** Belief: does one hold that God exists? Knowledge: does one claim to know? Grid cells: gnostic or agnostic theist, gnostic or agnostic atheist. **Strong** agnosticism claims nobody can know; **weak** claims only that I do not know; **practical** adds that the question is set aside as irrelevant to life.
      - **Pascal's wager** presses the agnostic: not wagering is itself an act, with $\mathrm{EV}=p\cdot(\text{payoff if God})+(1-p)\cdot(\text{payoff if not})$.

      Every number below is invented to practise the method; they are nobody's actual views.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · Weigh the hiddenness argument"
    body: |
      **Problem 4.** Iris keeps a diary. For six years she has asked, in earnest, whether anyone is there. She has read, visited services, prayed and waited, and she would welcome a yes. She is not turning away. She still does not believe. On the day she reads Schellenberg she writes: "If this is right, then my honest emptiness is evidence against a loving God."

      Take her case as a sample of $D$. You will build the argument, find where critics press, pair each reply with what it leaves standing, and put numbers on the cost.

  - type: order
    id: p4-chain
    title: "Build the premise chain"
    prompt: |
      Put the argument from Iris's diary in order, from the nature of God to the conclusion.
    steps:
      - 'P1: A perfectly loving God ($G$) is always open to a personal relationship with anyone who is capable of one and not resisting.'
      - 'P2: Being in such a relationship requires believing that God exists, so an open and capable person would believe.'
      - 'P3: Yet there are capable people, such as Iris, who are not resisting and do not believe ($D$).'
      - 'C: So a perfectly loving God does not exist ($\lnot G$).'
    hint: 'First what love involves, then what a relationship needs, then the observed case, then the verdict.'
    explanation: |
      P1 and P2 together say $G\Rightarrow\lnot D$. P3 asserts $D$. The conclusion $\lnot G$ is modus tollens. Valid logic means that to reject $C$ you must reject P1, P2 or P3.

  - type: mcq
    id: p4-critic
    title: "Which premise does the critic press?"
    prompt: |
      In the argument "P1: a perfectly loving God is open to relationship with every capable, nonresisting person; P2: relationship requires believing God exists; P3: Iris-like people exist; so no such God", a critic answers: "Iris says she is not resisting, but nobody is a perfectly transparent judge of their own motives; deep down she may be shielding herself from a change she fears." Which premise does the critic press?
    options:
      - text: 'P3: the claim that this really is a case of nonresistant nonbelief.'
        correct: true
        feedback: |
          Yes. The critic does not deny that Iris lacks belief, only that she is truly nonresistant. Schellenberg's reply is that this reading must be argued case by case and cannot be assumed for every seeker.
      - text: 'P1: the claim that love is open to relationship.'
        feedback: |
          The critic accepts what love involves and doubts that the case fits the definition of $D$.
      - text: 'The validity of modus tollens.'
        feedback: |
          The logic is not in dispute: if $G\Rightarrow\lnot D$ and $D$ hold, then $\lnot G$ follows. The dispute is about premises.
    explanation: |
      Three entry points: **P1/P2** (what love or relationship requires), **P3** (whether the nonbelief is truly nonresistant), and the whole step from "God would" to "we can tell" (skeptical theism). The reply here is a P3 reply.

  - type: mcq
    id: p4-pair-1
    title: "Pair the reply with what it leaves standing"
    prompt: |
      Reply A (Hick-style **epistemic distance**): God keeps some distance so that a person's moral and spiritual choices are genuinely free. If it succeeds, what does it leave standing, and what is the strain?
    options:
      - text: 'It leaves standing a reason for God to allow *resistance*, but it must explain why freedom needs nonbelief in someone who seeks and is not resisting, who is not choosing against anything.'
        correct: true
        feedback: |
          Yes. Freedom explains why God might not force belief on someone fleeing, while Iris is not fleeing. The reply needs a further link from freedom to her emptiness.
      - text: 'It leaves standing nothing: it shows freedom is worthless.'
        feedback: |
          It does the opposite: it takes freedom to be valuable. The strain is that its value does not obviously require Iris's nonbelief.
      - text: 'It leaves standing the claim that Iris does believe.'
        feedback: |
          That would deny P3, which is a different reply (and Reply A does not do it).
    explanation: |
      A reply answers one premise and leaves others standing. Reply A leaves P3 (Iris exists) standing and aims at P1 (God must be open in the way Schellenberg says).

  - type: mcq
    id: p4-pair-2
    title: "Pair the next reply"
    prompt: |
      Reply B (Moser-style **relationship without belief**): what God aims at is a transformed relationship of trust, not neutral proof for spectators, so evidence is purposively available to those willing to be changed; and believing *that* God exists is not yet trusting God. What does it leave standing, and what is its price?
    options:
      - text: 'It leaves standing the observation that Iris lacks belief, but it risks redescribing every case of nonbelief as unwillingness, which is what P3 denies for Iris.'
        correct: true
        feedback: |
          Yes. If the willing seeker also lacks the evidence on purpose, the reply must say why. If it says she is unwilling after all, it has moved to Reply C.
      - text: 'It leaves standing a proof that God exists.'
        feedback: |
          It offers a possible reason for the pattern of evidence, not a proof.
      - text: 'It leaves standing that belief is irrelevant to every relationship.'
        feedback: |
          It claims belief *that* is not yet trust, not that belief is irrelevant. P2 is weakened, not discarded.
    explanation: |
      Reply B presses P2 (belief is not enough, and bare evidence is not the aim). Its price is the seeker: why would God not give a willing person at least the starting belief?

  - type: mcq
    id: p4-pair-3
    title: "And the third reply"
    prompt: |
      Reply C (**skeptical theism**): we are in no position to know what reasons God might have for permitting Iris's nonbelief, so we may not move from "I see no good reason" to "there is none". What price did the same move pay in the lesson on the evidential problem of evil, and does it pay it here?
    options:
      - text: 'The doubt spreads: if we cannot tell what reasons God might have, we also cannot tell what God would reveal or provide, so it weakens the inference behind any religious expectation as well. It pays the same price here.'
        correct: true
        feedback: |
          Yes. Defenders say that is simply honest; Schellenberg says our grasp of what love requires is good enough to rule out hidden reasons.
      - text: 'It is refuted by the diary entry itself.'
        feedback: |
          The diary is the evidence $D$. Skeptical theism accepts the evidence and challenges the inference from it.
      - text: 'It names God''s actual reason for the silence.'
        feedback: |
          Skeptical theism names no reason; that is its design and its price.
    explanation: |
      Reply C leaves $D$ and P1 standing as statements and doubts the *inference* that we can tell God's reasons. It is a defense, not a theodicy.

  - type: numeric
    id: p4-num-1
    title: "What does Iris's case do to the odds?"
    prompt: |
      Toy numbers. $G$ = "a perfectly loving God exists", $\lnot G$ = "no such God", $D$ = "nonresistant nonbelievers exist". Take $P(G)=0.5$. Suppose $P(D\mid G)=0.1$ and $P(D\mid\lnot G)=0.8$. What is $P(G\mid D)$, in percent (one decimal)?
    answer: 11.1
    tolerance: 0.1
    wrong:
      - { value: 50, feedback: 'That is the prior. The evidence $D$ is eight times likelier without $G$, so the odds must move.' }
      - { value: 12.5, feedback: 'That is the ratio $0.1/0.8$ read as a probability. It is the Bayes factor ($1/8$), which must still multiply the prior odds of $1$ and then be turned into a probability: odds $1/8$ give $(1/8)/(1+1/8)=1/9$.' }
    hint: 'Bayes factor $0.1/0.8$; prior odds $0.5/0.5=1$; then odds$/(1+$odds$)$.'
    explanation: |
      Posterior odds $=\tfrac{0.1}{0.8}\times1=\tfrac18$, so $P(G\mid D)=\tfrac{1/8}{1+1/8}=\tfrac19\approx11.1\%$. Check directly: $\dfrac{0.5\times0.1}{0.5\times0.1+0.5\times0.8}=\dfrac{0.05}{0.45}=\tfrac19$.

  - type: numeric
    id: p4-num-2
    title: "A reply that raises the likelihood"
    prompt: |
      Reply A or B, if it works, makes nonresistant nonbelief less surprising on $G$: say it raises $P(D\mid G)$ from $0.1$ to $0.4$, with $P(G)=0.5$ and $P(D\mid\lnot G)=0.8$ as before. What is $P(G\mid D)$ now, in percent (one decimal)?
    answer: 33.3
    tolerance: 0.1
    wrong:
      - { value: 11.1, feedback: 'That is the answer with the old $P(D\mid G)=0.1$. Use the new value $0.4$.' }
      - { value: 40, feedback: 'You used $P(D\mid G)$ itself as the answer. The posterior also weighs $P(D\mid\lnot G)=0.8$: $0.4/0.8=0.5$ is the Bayes factor.' }
    hint: 'Bayes factor $0.4/0.8=\tfrac12$, prior odds $1$.'
    explanation: |
      Posterior odds $=\tfrac{0.4}{0.8}\times1=\tfrac12$, so $P(G\mid D)=\tfrac{1/2}{1+1/2}=\tfrac13\approx33.3\%$. A successful reply triples the posterior (from $1/9$ to $1/3$) but does not return it to the prior $0.5$.

  - type: mcq
    id: p4-neutral
    title: "How much must a reply achieve?"
    prompt: |
      With $P(G)=0.5$ and $P(D\mid\lnot G)=0.8$, what value of $P(D\mid G)$ would make the observation $D$ leave $P(G)$ exactly at $0.5$?
    options:
      - text: '$0.8$: the Bayes factor is $1$, so the evidence does not move the odds.'
        correct: true
      - text: '$0.5$: it must equal the prior.'
        feedback: |
          The likelihood is compared with the *other* likelihood, not with the prior. Here $0.5/0.8<1$ still lowers the odds.
      - text: '$0$: God never permits such cases.'
        feedback: |
          That gives $P(G\mid D)=0$, the strongest form of the argument (this is $G\Rightarrow\lnot D$ read as certain).
    explanation: |
      The argument becomes a matter of degree. Replies need not remove the force of $D$ entirely to matter: they need to move $P(D\mid G)$ toward $P(D\mid\lnot G)$. Schellenberg replies that no good reason makes it that close; defenders say our confidence in the toy numbers $0.1$ is itself poorly grounded.

  - type: mcq
    id: p4-parting
    title: "Where do thoughtful people part ways?"
    prompt: |
      After the replies and the numbers, a believer and a critic who both read Iris's diary still differ. Which is the most plausible place?
    options:
      - text: 'How likely $D$ is on $G$ (what perfect love requires, whether such seekers are really nonresistant) and what prior $G$ starts with; the arithmetic is shared.'
        correct: true
      - text: 'Whether the odds form of Bayes'' rule is valid.'
        feedback: |
          Both use the same rule; they feed it different inputs.
      - text: 'Whether Iris keeps a diary.'
        feedback: |
          The case is a toy. The dispute is whether such cases are as the argument describes.
    explanation: |
      Layer by layer: that some people lack belief is observation; whether any of it is *nonresistant* is live debate; what love requires of an all-powerful being is a metaphysical commitment on both sides.

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-setup
    title: "Problem 5 · Agnosticism under pressure"
    body: |
      **Problem 5.** Three friends are asked, at a dinner, whether God exists.

      - **Kai:** "I've read the main arguments on both sides and they seem balanced. I neither believe God exists nor believe God does not. I make no claim about whether anyone could ever settle it."
      - **Lou:** "I don't believe in God, but I won't say I know there isn't one; I just haven't been given a reason."
      - **Mo:** "Nobody can know. Don't ask me again. It changes nothing about how I live, so I don't think about it."

      A fourth guest, Nell, says: "Suspending judgement isn't neutral. Pascal showed that you have to bet." You will place each friend, judge when suspending fits, and weigh Nell's push.

  - type: mcq
    id: p5-grid
    title: "Place Lou on the grid"
    prompt: |
      Lou says: "I don't believe in God, but I won't say I know there isn't one." On the grid (belief by claim to know), which cell is Lou in?
    options:
      - text: 'Agnostic atheist: she lacks belief and does not claim knowledge, using "atheist" in the broad sense of lacking belief.'
        correct: true
      - text: 'Gnostic atheist: lacking belief is knowing there is no God.'
        feedback: |
          That merges the two axes. Lou lacks belief and explicitly disclaims knowledge.
      - text: 'Agnostic theist: she is agnostic, so she must half-believe.'
        feedback: |
          "Agnostic" answers the knowledge axis, not the belief axis. Lou does not believe, so she is not a theist.
      - text: 'No cell: an agnostic cannot be an atheist.'
        feedback: |
          Only if "atheist" means *claims there is no God* (the narrow sense). In the broad sense, lacking the belief, the two are compatible; the grid works best with that sense.
    explanation: |
      Belief and knowledge are two questions. Lou answers the first with "no belief" and the second with "I do not claim to know". With the narrow sense of "atheism" she would be an agnostic who is neither theist nor atheist; the broad sense puts her in the lower-right cell.

  - type: mcq
    id: p5-classify
    title: "Strong, weak or practical?"
    prompt: |
      Match each friend to the best label. Kai: "balanced, no claim that it can never be settled". Mo: "nobody can know, and it changes nothing for me". Which assignment is right?
    options:
      - text: 'Kai is a weak agnostic who suspends judgement; Mo is a strong agnostic with a practical stance as well.'
        correct: true
        feedback: |
          Mo says two things: a knowledge claim ("nobody can know", strong) and a life claim ("it changes nothing", practical). The second is a separate commitment that needs its own defence.
      - text: 'Kai is strong; Mo is weak.'
        feedback: |
          Reversed: Kai explicitly disclaims the claim that nobody could settle it (so weak), while Mo asserts it (strong).
      - text: 'Both are practical agnostics.'
        feedback: |
          Kai plainly cares: she read both sides. Practical agnosticism adds that the question is irrelevant to life.
    explanation: |
      **Strong**: nobody can know. **Weak**: I do not know. **Practical**: unsettled and irrelevant to how I live. Mo combines two and carries two burdens: an argument about the limits of evidence, and the claim that the answer would change nothing.

  - type: mcq
    id: p5-suspend
    title: "When does suspension fit?"
    prompt: |
      Following Huxley, claims should be proportioned to what has been shown. Which of these is a fitting reason to suspend judgement on whether $G$ (God exists)? Select all that apply.
    multiple: true
    options:
      - text: 'After looking carefully, the Bayes factor of the total evidence is close to $1$ and the prior is near the middle.'
        correct: true
      - text: 'A decisive test is expected soon, and waiting costs little.'
        correct: true
      - text: 'It would be uncomfortable to conclude either way, so best not to examine the arguments.'
        feedback: |
          This is the evasion Huxley's critics charged: the suspension has no reasons behind it. Honest suspension follows the looking.
      - text: 'The standard is "we cannot know" for God, but equally weak evidence on other topics is treated as settled.'
        feedback: |
          A standard that changes with the topic is not proportioning claims to evidence.
    explanation: |
      The test is not the label but the **reasons**: has the person looked, is the evidence really balanced or the decisive test close, and is the same standard used across topics?

  - type: numeric
    id: p5-bayes
    title: "Evidence that moves the middle"
    prompt: |
      Kai starts at $P(G)=0.5$. A new piece of evidence $E$ turns up, with $P(E\mid G)=0.32$ and $P(E\mid\lnot G)=0.08$. What is her $P(G\mid E)$, as a decimal?
    answer: 0.8
    tolerance: 0.005
    wrong:
      - { value: 0.5, feedback: 'That is the prior. A Bayes factor of $0.32/0.08=4$ must move the odds.' }
      - { value: 4, feedback: 'That is the Bayes factor, not a probability. Posterior odds $=4\times1=4$, and $P=\text{odds}/(1+\text{odds})$.' }
    hint: 'Bayes factor $0.32/0.08$; prior odds $1$; then odds$/(1+$odds$)$.'
    explanation: |
      Posterior odds $=4\times1=4$, so $P(G\mid E)=4/5=0.8$. A Bayes factor of $4$ takes a prior of $0.5$ to $0.8$: once the evidence has real weight, "I am at 50/50" is no longer where the evidence leaves her.

  - type: numeric
    id: p5-bayes-2
    title: "Another piece pulls back"
    prompt: |
      Now a second piece of evidence $F$, independent of $E$ given each hypothesis, with $P(F\mid G)=0.1$ and $P(F\mid\lnot G)=0.2$. Starting from the prior $0.5$, what is $P(G\mid E\text{ and }F)$, as a decimal (two places)?
    answer: 0.67
    tolerance: 0.005
    wrong:
      - { value: 0.8, feedback: 'That is the value after $E$ alone. $F$ has Bayes factor $\tfrac12$ and pulls the odds down.' }
      - { value: 0.33, feedback: 'That is $F$ alone from $0.5$. You must keep $E$ too: the factors multiply, $4\times\tfrac12=2$.' }
    hint: 'Multiply the Bayes factors: $4\times\tfrac12$. Prior odds $1$.'
    explanation: |
      Posterior odds $=4\times\tfrac12\times1=2$, so $P=2/3\approx0.67$. Suspension is not a fixed state: it holds exactly while the factors multiply to about $1$ and moves as soon as they do not.

  - type: mcq
    id: p5-push
    title: "Nell's push: you must bet"
    prompt: |
      Nell says: "Pascal showed that not choosing is itself a choice. So suspending belief cannot be neutral." Mo's practical agnosticism says the answer changes nothing. Which assessment is fairest?
    options:
      - text: 'Nell is right that how one lives is an act, so "it changes nothing" is a claim that can be tested against a table of payoffs; but the table (which gods, what rewards, whether belief can be chosen) is itself disputed, so the push does not settle the matter.'
        correct: true
        feedback: |
          Yes. It leaves standing the weak agnostic who simply reports her credence and her way of living, and it forces the practical agnostic to defend her claim of irrelevance.
      - text: 'Nell refutes agnosticism: the wager proves that one must believe.'
        feedback: |
          The wager concerns acting. Critics reply that one cannot simply choose to believe, and rival gods change the table.
      - text: 'Nell is wrong because suspending an act is the same as doing nothing.'
        feedback: |
          Pascal's point is that abstaining still leaves you in some way of living; "doing nothing" is one of the acts on the table.
    explanation: |
      The wager presses practical agnosticism most, because it says the answer would change nothing. A weak agnostic can accept that action must go on and still hold her credence open. What none of them can avoid is choosing how to live.

  - type: mcq
    id: p5-parting
    title: "Where do thoughtful people part ways?"
    prompt: |
      After placing Kai, Lou and Mo and hearing Nell, a thoughtful agnostic and a thoughtful theist still differ. Which is the most plausible place?
    options:
      - text: 'Whether the total evidence really balances (the Bayes factor near $1$ and the priors) and whether the question matters to how one should live; the grid and the arithmetic are shared.'
        correct: true
      - text: 'Whether belief and knowledge are separate questions at all.'
        feedback: |
          Both sides can use the two axes; the grid exists so that this is not the quarrel.
      - text: 'Whether Huxley coined the word "agnostic".'
        feedback: |
          That is history (1869, on the usual account), not the dispute.
    explanation: |
      Once again the parting is in the **inputs**: how the evidence weighs and what stakes the question carries, not in the logic or the vocabulary.

  # ---------------- Final weighing ----------------
  - type: mcq
    id: w-reach
    title: "How far does each objection reach?"
    prompt: |
      The level weighed five things: the logical problem of evil, the evidential problem, the hiddenness argument, Ockham's razor (the burden of proof) and the wager. Which pairing of an objection with what a good reply leaves standing is correct?
    options:
      - text: 'A defense (a possible story) answers the logical problem of evil, but leaves the evidential problem standing: improbability is not inconsistency.'
        correct: true
        feedback: |
          Yes. A possible story shows the claims *can* be true together; it does not show that the evidence is not, on balance, better explained by indifference.
      - text: 'A successful theodicy refutes the argument from hiddenness, since both are about suffering.'
        feedback: |
          Hiddenness is about nonbelief, not suffering. A theodicy for suffering does not by itself explain why a seeker is left without belief.
      - text: 'The razor shows God does not exist, since a simpler world has no God.'
        feedback: |
          The razor is a tie-breaker among equally good fits. Whether the God hypothesis fits equally well, and what counts as simple, are the disputes.
      - text: 'Pascal''s wager answers the problem of evil by showing that suffering is outweighed by infinite reward.'
        feedback: |
          The wager is about what to do given a probability, not about evidence for or against God. It never addresses suffering or nonbelief.
    explanation: |
      Reach, in order: the **logical** problem asks for possibility (a defense is enough); the **evidential** and **hiddenness** problems ask for probability (replies must change likelihoods or priors); the **razor** and **burden** shape the prior; the **wager** moves from belief to action. A reply to one is not a reply to the others.

  - type: mcq
    id: w-left
    title: "What stays standing"
    prompt: |
      In the whole level, each objection met replies. Which statement describes honestly what remains after the best replies have been given?
    options:
      - text: 'Each objection survives as a question about inputs (likelihoods, priors, payoffs, what a good God would do) rather than as a refutation; and each reply has its bill: a defense claims little, a theodicy takes on a burden, skeptical theism spreads doubt.'
        correct: true
      - text: 'All the objections have been refuted, so belief is rationally compelled.'
        feedback: |
          Nothing in the level supports that. Each reply pays a price and leaves a live debate.
      - text: 'All the replies have failed, so atheism is rationally compelled.'
        feedback: |
          The same holds in reverse. The arguments push the odds in some toy cases, but real inputs are disputed.
      - text: 'Nothing remains: the objections cancel one another.'
        feedback: |
          They are not symmetrical. Each addresses a different question, and neither side can drop a premise for free.
    explanation: |
      The method to carry out of the level: sort the objection, find the premise or input a reply presses, state what the reply leaves standing and what it costs. The verdict is each reader's to reach.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Hiddenness as a chain.** $G$ = a perfectly loving personal God exists, $D$ = nonresistant nonbelievers exist. Love gives openness, relationship needs belief, so $G\Rightarrow\lnot D$; with $D$, modus tollens gives $\lnot G$. Replies press P1/P2 (epistemic distance, relationship without bare belief), P3 (is the nonbelief really nonresistant?), or the inference itself (skeptical theism, which spreads doubt). Each leaves something standing.
      - **Replies are measured in the odds.** $\dfrac{P(G\mid D)}{P(\lnot G\mid D)}=\dfrac{P(D\mid G)}{P(D\mid\lnot G)}\times\dfrac{P(G)}{P(\lnot G)}$. With prior $0.5$ and $P(D\mid\lnot G)=0.8$: $P(D\mid G)=0.1$ gives $1/9\approx11.1\%$; raising it to $0.4$ gives $1/3$; at $0.8$ the evidence does nothing.
      - **Agnosticism has three questions.** Belief (theist or not), knowledge claim (gnostic or agnostic), and importance (practical). Strong: nobody can know. Weak: I do not know. Suspension fits when the total Bayes factor is near $1$ after real looking; with prior $0.5$, a factor $4$ gives $0.8$, and a further factor $\tfrac12$ gives $2/3$.
      - **The push to decide.** Abstaining is an act, so the practical agnostic's "it changes nothing" can be tested against a payoff table; the table is itself disputed, so the wager forces the question without settling it.
      - **Reach and bill.** Logical (possibility; a defense answers it), evidential and hiddenness (probability; replies must shift likelihoods), razor and burden (priors), wager (action). Where thoughtful people part ways: the inputs, not the logic.

      **Next:** the level review comes next, played automatically; then the first partial exam, which covers the levels from knowing and science to God and the evidence against and for.
