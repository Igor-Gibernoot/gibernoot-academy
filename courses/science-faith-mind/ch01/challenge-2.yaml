id: ch01-challenge-2
title: "Level Challenge: Sort the Questions (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: debates and a final question"
    body: |
      **Recall.** Questions differ in the **kind of answer** they can have:

      - **Measurable fact**: a careful count or measurement could settle it.
      - **Logical or conceptual**: it follows from the meaning of the words or from valid reasoning.
      - **Faith commitment**: a claim resting on trust in a tradition or worldview, beyond what a test can show.
      - **Value**: a question of what is right, fair or worth doing.

      There are four **lenses** (ways of looking): **science** (tests and measurements), **philosophy** (careful reasoning about meaning and arguments), **theology** (careful thinking about God and religion, as a tradition does it) and **lived experience** (what it is like to live through something).

      The **method** for a big question: (1) clarify it and pin down ambiguous words, (2) split it into parts, (3) classify each part by kind of answer, (4) choose the lens or lenses that fit, (5) attribute each answer with "according to ..." and say where views part: at a premise, a value or the evidence.

      As in every Level 1 lesson, **guessing is the point**: pick, then read why. Problem 4 judges reasons inside a debate; Problem 5 is a final question for you to take apart.

  - type: text
    id: p4-debate
    title: "Problem 4 · A debate"
    body: |
      **Problem 4.** A town closed its central street, Old Street, to cars. Two neighbours argue. (The numbers are invented for this exercise.)

      > **Marta (a cyclist):** "The town's air sensors show pollution on Old Street fell by a third since the ban. So the ban is right."
      >
      > **Joel (a shop owner):** "Shops on Old Street lost customers. And you cycle everywhere, so of course you like the ban. Anyway, you want every car off every road in the country, which is absurd."
      >
      > **Marta:** "Not at all: I only said the centre."
      >
      > **Joel:** "Old Street was built for carts and then for cars. It has always carried traffic, so traffic is what it is for."

      Take the debate apart one move at a time. Nobody here is a villain: each speaker has a real concern.

  - type: mcq
    id: p4-mixed
    title: "Marta's first claim"
    prompt: |
      Marta says: "Pollution on Old Street fell by a third, so the ban is right." This one sentence mixes two kinds of answer. Which pair?
    options:
      - text: A measurable fact (pollution fell) and a value (the ban is *right*).
        correct: true
      - text: A faith commitment (pollution fell) and a measurable fact (the ban is right).
        feedback: |
          Sensors can measure pollution, so no trust beyond a test is needed for the first part. And "right" is not something a sensor reads out.
      - text: A conceptual claim (pollution fell) and a faith commitment (the ban is right).
        feedback: |
          "Pollution fell" is not true by the meaning of words; it could have come out the other way. And judging a street ban needs no creed, only a view about what matters.
      - text: Two measurable facts. Both can be checked with sensors.
        feedback: |
          Only the first. Even with perfect numbers, someone can accept them and still ask whether cleaner air is worth lost shop income. That extra step is a value.
    explanation: |
      The fact (a third less pollution) is checked by science. The word "right" adds a value: it says the fall matters more than the costs. A good reply keeps them apart, accepting the data while asking about the weighing.

  - type: mcq
    id: p4-person
    title: "Joel's second move"
    prompt: |
      Joel says: "You cycle everywhere, so of course you like the ban." Marta's claim was that pollution fell. What is wrong with Joel's move?
    options:
      - text: It judges the claim by the speaker's motive, not by the evidence. Marta may have a reason to like the ban, yet the sensors can still be right.
        correct: true
      - text: Nothing is wrong; a person who benefits can never be trusted.
        feedback: |
          Too strong. Benefit is a reason to look at the evidence carefully, since people can fool themselves, but it does not make the evidence false. Joel also benefits from his own view, being a shop owner.
      - text: It is a measurable fact, so only a sensor could answer it.
        feedback: |
          That Marta cycles is a fact, yes, but it does not bear on whether the air got cleaner. The slip is the relevance, not the type.
      - text: It is a faith commitment about cyclists.
        feedback: |
          No trust in a tradition is involved. It is a remark about the speaker, offered instead of a reply about the data.
    explanation: |
      Where a claim comes from, or who says it, is a poor test of whether it is true. Motive is useful for one thing: it tells us where to check twice. The fair reply to Marta is about the sensors (are they placed well? was the weather the same?). This works the same way in religious debates, where "you only believe that because you were raised that way" and "you only doubt that because you are an atheist" are both weak.

  - type: mcq
    id: p4-straw
    title: "Joel's third move"
    prompt: |
      Joel says Marta "wants every car off every road in the country". She only said the town centre. What is this move?
    options:
      - text: A distorted version of her view that is easy to attack ("straw man"), put in place of what she actually said.
        correct: true
      - text: A fair summary, since banning cars somewhere leads to banning them everywhere.
        feedback: |
          That is a guess about where her view would lead, offered as if it were her claim. She may accept the ban in one place and not in another; Joel would have to show why one leads to the other.
      - text: A measurable fact about how many roads she wants closed.
        feedback: |
          Nothing was counted. It is a claim about her opinion, and she has just said it is false.
      - text: A value judgement that streets matter more than air.
        feedback: |
          Joel does not say that here. He misreports what Marta said, which is a different slip from holding a value.
    explanation: |
      A **straw man** replaces someone's view with a weaker one and defeats that. The remedy, used throughout this course, is the opposite habit: state the other view so well that its holder says "yes, that is what I think", and only then reply. Marta did well to correct it at once.

  - type: mcq
    id: p4-origin
    title: "Joel's fourth move"
    prompt: |
      Joel says: "Old Street was built for carts and then cars, so traffic is what it is *for*." Which description fits best?
    options:
      - text: He slides from how the street came to be used (its history) to what it ought to be used for now (a purpose chosen by the town).
        correct: true
      - text: He proves with history that Old Street can only ever carry cars.
        feedback: |
          Streets were repurposed many times: markets, parades, walkways. The past shows what happened, not what must happen.
      - text: He is right, because a purpose is whatever something was first made for.
        feedback: |
          Some purposes do stay with the maker's intention (a hammer). But a street belongs to a living town that can decide what it wants. Whether purposes come from origins or from choices is itself a question for philosophy.
      - text: He makes a faith claim about carts.
        feedback: |
          No tradition or trust is involved; the history is plausible and can be checked. The issue is what follows from it.
    explanation: |
      A **how-it-came-about** story (history, cause) does not by itself settle a **what-should-it-be-for** question (purpose, value). This is the same pattern as in the rainbow lesson: a cause and a meaning are different questions. Joel's history is good evidence about the past; the town's choice is about the future.

  - type: mcq
    id: p4-lenses
    title: "Which lens?"
    multiple: true
    prompt: |
      Select **all** the true statements about the lenses used in the debate.
    options:
      - text: 'Marta''s air sensors are the **science** lens: measurement and comparison before and after.'
        correct: true
      - text: Joel's account of what the lost customers mean for his family is the **lived experience** lens, since it reports what it is like to live through the change.
        correct: true
      - text: 'Asking whether a town may weigh clean air against private income is the **philosophy** lens: it reasons about what ought to count.'
        correct: true
      - text: Joel's history of the street is the **theology** lens.
        feedback: |
          Theology is careful thinking about God and religion as a tradition does it. Nothing religious appears. Joel's history is evidence from the past, closer to science (a historian's records) than to theology.
      - text: Only the science lens gives a real answer to the debate.
        feedback: |
          Science can settle the pollution figures and the shop takings, but not by itself how to weigh them. Several lenses each add a part of the answer.
    explanation: |
      Three lenses meet in one debate, which is typical. No lens was wasted: the sensors give data, the shop owner gives the cost to a life, and philosophy asks how to weigh them.

  - type: mcq
    id: p4-parting
    title: "Where do they part?"
    prompt: |
      Suppose both accept the sensor data (pollution down by a third) and the shop data (takings down). They still disagree about the ban. Where do they part?
    options:
      - text: 'At a value: how much cleaner air is worth compared with lost income, and whose income counts first.'
        correct: true
      - text: At the evidence, since they have different sensors.
        feedback: |
          We assumed they accept the same data. Disagreement that survives agreed facts is not about the facts.
      - text: At a premise about the meaning of the word "street".
        feedback: |
          They use the word in the same way. A question about words would be settled by defining them.
      - text: They do not truly disagree; one of them must be misreading the numbers.
        feedback: |
          Two people can read the same numbers correctly and still weigh them differently. Assuming the other must be confused is the first step to caricature.
    explanation: |
      Agreed facts plus different weights = a **difference of value**. It is not shameful: it is where debate becomes a conversation about what the town wants to be. Notice that no one has been declared the winner, only the point of parting made visible.

  - type: order
    id: p4-reply
    title: "A fair reply"
    prompt: Marta wants to answer Joel fairly. Put her steps in the best order.
    steps:
      - 'Restate Joel''s worry in words he would accept: "Shops lost customers, and that matters to families."'
      - 'Grant what is true in it and ask for the data: "Let us look at the takings over a full year, not a month."'
      - 'Set aside the remark about her bicycle: it does not change what the sensors read.'
      - 'Name the real gap: "We may agree on the numbers and still weigh clean air and income differently."'
    hint: Understand first, then check the facts, then clear the side-remarks, then name the value.
    explanation: |
      Restating first shows that you heard the concern and prevents a straw man. Checking the facts comes before arguing values, so the values are about the right numbers. Naming the gap last turns a quarrel into a question both can work on.

  - type: text
    id: p5-question
    title: "Problem 5 · The final question"
    body: |
      **Problem 5.** Now you take one apart, with no debate to guide you. Here is the question:

      > "Can a computer really think, and if it can, would it be wrong to switch it off?"

      Use the five-step method. Nothing is taken for granted: people who work on machines, philosophers, and religious thinkers all disagree about parts of it.

  - type: mcq
    id: p5-words
    title: "Step 1: pin down the words"
    prompt: |
      Which word most needs pinning down before anyone can answer "Can a computer really think?"
    options:
      - text: '"Think". It could mean "solve problems and answer questions" or "have inner experience, so that there is something it is like to be the computer".'
        correct: true
      - text: '"Computer". Everyone agrees what it means, so nothing needs pinning down anywhere.'
        feedback: |
          "Computer" is clear enough here. The trouble is that the question looks single but "think" hides two different questions.
      - text: '"Switch off". It has only one meaning.'
        feedback: |
          True that it is plain, but the question was about the first part. Words like "wrong" matter later, in the value part.
      - text: 'No word. The question is already clear.'
        feedback: |
          If "think" means solving problems, a calculator already does. If it means having an inner life, that is a far harder question. The same words, two different problems.
    explanation: |
      "Think" can mean **doing** (computing, answering) or **experiencing** (feeling, being aware). Pinning down which is meant is half the work. Many arguments about machines are two people using one word in two ways.

  - type: mcq
    id: p5-split
    title: "Step 2: split it"
    prompt: |
      Which split of the question is best?
    options:
      - text: (a) Can a computer solve problems in the way people do? (b) Could a computer have an inner experience? (c) If it did, would that make switching it off wrong?
        correct: true
      - text: (a) Is the computer powerful? (b) Is the computer expensive? (c) Is it sold in shops?
        feedback: |
          Those are facts about computers but not parts of this question. A split must keep the original meaning, not replace it by easier questions.
      - text: (a) Can a computer think? (b) Can a computer think really? (c) Can a computer really think?
        feedback: |
          Three versions of the same sentence. A split must separate different kinds of answer, not reword one.
      - text: 'Keep it as one question: splitting always loses the point.'
        feedback: |
          Unsplit, one person can answer about problem solving while the other answers about feeling, and both think they disagree. Splitting is exactly what lets us find what they disagree about.
    explanation: |
      Part (a) concerns what the machine does, (b) what it experiences, and (c) what we ought to do if (b) is yes. Notice that (c) depends on (b): if no experience, the value question may look different. That dependence is itself a finding.

  - type: mcq
    id: p5-kinds
    title: "Steps 3 and 4: kind and lens"
    prompt: |
      Take part (c): "If a computer had an inner experience of its own, would switching it off be wrong?" What kind of answer and which lenses fit best?
    options:
      - text: A value question. Philosophy (what ought to matter, and why) fits first; traditions in theology and people's lived experience of loss add further views.
        correct: true
      - text: A measurable fact. Science can read the answer off the wires.
        feedback: |
          Science can tell us what the machine is doing, but "wrong" is not a reading on any instrument. A measurement cannot say what we owe to a being.
      - text: A conceptual question settled only by defining "switch off".
        feedback: |
          The words are clear. The difficulty is whether an experiencing being has a claim on us, which a definition cannot decide.
      - text: A faith commitment. Only believers can say.
        feedback: |
          Religious traditions do have views about who counts morally, but so do secular philosophers. Neither group has a monopoly on this question.
    explanation: |
      Part (c) is a **value** question, and the lenses combine: philosophy argues about what grounds a claim (the ability to suffer? to think about oneself?), theology asks how traditions regard persons and creation, and lived experience asks what it is like to lose someone, or something, we care for.

  - type: mcq
    id: p5-evidence
    title: "What would count as evidence?"
    prompt: |
      For part (b), "could a computer have inner experience?", which of these would count as the *strongest direct* evidence that it does?
    options:
      - text: None of these is decisive. A machine can be built to say "I feel pain" without anything being felt, so behaviour alone does not settle it. Evidence would have to come from a worked-out account of what produces experience.
        correct: true
      - text: The computer says convincingly, "I am conscious."
        feedback: |
          A program can be written to say anything, including this. The words show what it was built or trained to output, not that anything is felt. That point is accepted by many who think machines could one day be conscious.
      - text: The computer solves hard problems faster than people.
        feedback: |
          Solving problems is part (a), what it does. Whether doing is accompanied by experiencing is the open question.
      - text: A poll showing most people believe it is conscious.
        feedback: |
          A poll reports what people think, which can be moved by how the machine talks. It measures our reactions, not the machine.
    explanation: |
      This is a real difficulty with other minds in general: we infer a friend's experience from behaviour and from shared biology. With a machine the second support is missing. Whether behaviour is enough is one of the places where thoughtful people part, and we return to it in the Levels on the mind.

  - type: mcq
    id: p5-parting
    title: "Step 5: where do views part?"
    prompt: |
      One thinker holds that experience depends on the living, physical stuff of a brain, so a computer cannot have it. Another holds that what matters is the pattern of information processing, whatever it runs on, so a computer could. Where exactly do they part?
    options:
      - text: At a premise about what produces experience (a substance or a pattern). It is not yet settled by agreed evidence, so it stays open.
        correct: true
      - text: At a value, since each simply prefers brains or machines.
        feedback: |
          Neither is stating a preference. Each makes a claim about what experience depends on; the value question (c) only arises after that.
      - text: At the measurable facts, which everyone already agrees on.
        feedback: |
          The facts about brains and computers are largely agreed. What differs is which facts matter for experience, a premise.
      - text: 'They do not part: one of them has misunderstood the word "think".'
        feedback: |
          Both can define the word in the same way (having experience) and still differ on what produces it.
    explanation: |
      The split gave us three kinds of parting: **evidence** (part a, partly open), **premise** (part b, what produces experience), **value** (part c, what we owe). Naming them separately is the answer to the original question, not a way to avoid it: nobody has been called right.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Level 1 is complete.** You can name the **four kinds of answer** (measurable fact, conceptual, faith commitment, value) and the **four lenses** (science, philosophy, theology, lived experience).
      - **Method** for any big question: clarify the words, split it, classify each part, choose the lens, say "according to whom", and name where views part (premise, value or evidence).
      - **Judging a debate**: separate fact from value in one sentence; judge a claim by its evidence, not by who says it; state the other view fairly (no straw man); do not slide from how something came about to what it ought to be for.
      - **Disagreement that survives agreed facts** is usually a difference of premise or value, and naming it is progress.

      What stays open: nothing here said who is right about machines, streets or faith. It gave you the tools to ask well.

      **Next:** Level 2, **How Science Knows**, starts with the lesson Why the Sun Will Rise Tomorrow: you will meet the old puzzle of why past evidence should say anything about the future, and what science does about it.
