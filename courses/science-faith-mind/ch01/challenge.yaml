id: ch01-challenge
title: "Level Challenge: Sort the Questions (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: sorting questions"
    body: |
      Level 1 gave you four **lenses** (ways of looking at a question): **science**, **philosophy**, **theology** (careful thinking about God and religion, as a tradition does it) and **lived experience** (what it is like to live through something). This challenge uses them on fresh questions. As in every Level 1 lesson, **guessing is the point**: pick, then read why.

      Questions also differ in the **kind of answer** they can have:

      - **Measurable fact**: a careful count or measurement could settle it.
      - **Logical or conceptual**: it follows from the meaning of the words or from valid reasoning.
      - **Faith commitment**: a claim that rests on trust in a tradition or a worldview, beyond what a test can show.
      - **Value**: a question of what is right, fair or worth doing.

      Three problems here: sort by kind of answer, choose the lenses, then split a question into parts. Problems 4 and 5 come in part 2.

  - type: mcq
    id: p1-fact
    title: "Problem 1 · Sorting by kind of answer"
    prompt: |
      **Problem 1.** Five questions, five sorts. First: *"Do adults who sleep 5 hours a night score lower on a memory test than adults who sleep 8 hours?"* What kind of answer can it have?
    options:
      - text: A measurable fact. Test both groups on the same memory task and compare the scores.
        correct: true
      - text: A value. Whether sleep matters is a matter of taste.
        feedback: |
          Whether you *like* sleeping is taste, but the question asks about scores, which can be counted. Nothing about "right" or "fair" is in it.
      - text: A faith commitment. Nobody can know what sleep does to a mind.
        feedback: |
          Plenty is known by testing. A faith commitment is a claim a test cannot reach; here a test is exactly what would settle it.
      - text: Logical. It follows from the meaning of the word "sleep".
        feedback: |
          The word "sleep" does not contain memory scores. The answer could have turned out either way, which is the sign that we must look at the world.
    explanation: |
      A question whose answer **could have come out differently** and can be checked by counting is a measurable fact. Nothing here says the answer is easy, only that a fair comparison of many people could settle it.

  - type: mcq
    id: p1-logic
    title: "Question 2"
    prompt: |
      *"Could there be a bachelor (an unmarried man) who is married?"* What kind of answer can it have?
    options:
      - text: Logical or conceptual. The word "bachelor" already means unmarried, so the idea contradicts itself.
        correct: true
      - text: A measurable fact. We would have to survey every man in the world.
        feedback: |
          A survey would find none, but no survey is needed: the answer follows from what the word means. A finished survey could not make a married bachelor possible.
      - text: A value. Some people would find it unfair.
        feedback: |
          Fairness has no part in it. The problem is a clash inside the words themselves.
      - text: A faith commitment. It depends on the worldview you trust.
        feedback: |
          Believers and skeptics agree on it equally. When everybody who understands the words must agree, the question is about meaning, not trust.
    explanation: |
      A **conceptual** question is settled by the meaning of the terms or by valid reasoning, not by looking at the world. The same sort of question appears later in philosophy: whether an idea is self-contradictory, or only strange.

  - type: mcq
    id: p1-mixed
    title: "Question 3 mixes kinds"
    prompt: |
      *"Is it right to fine drivers who go over the speed limit?"* One sentence, but it hides more than one kind of answer. Which description is best?
    options:
      - text: It mixes two kinds. Whether fines reduce crashes is a measurable fact; whether it is fair to punish people this way is a value.
        correct: true
      - text: It is purely a measurable fact. If fines reduce crashes, they are right.
        feedback: |
          The facts feed the answer, but "right" needs a value too: someone who cares more about personal freedom than about fewer crashes can accept the same data and still disagree.
      - text: It is purely a value. Facts about crashes are irrelevant.
        feedback: |
          If fines made no difference to safety, most defenders of fines would lose their best reason. The facts matter, they just do not finish the job.
      - text: It is a faith commitment, because laws come from authorities.
        feedback: |
          Laws come from authorities, but the question asks whether the rule is *right*. That is a value question, helped by facts.
    explanation: |
      Many everyday questions are **mixed**: facts tell us what a rule would do, values tell us whether that outcome is what we want. Two people can agree on every fact and still part ways on the value. Noticing which part of an argument is which is the first skill of this level.

  - type: mcq
    id: p1-faith
    title: "Question 4"
    prompt: |
      *"Is there any form of life after death?"* Which sort of answer can it have?
    options:
      - text: Mainly a faith commitment (or its rejection). According to many traditions the answer is yes, in different forms; according to naturalists (who hold that only the natural world exists) it is no; a test cannot reach the question as asked.
        correct: true
      - text: A measurable fact, since death can be observed.
        feedback: |
          We can observe the end of bodily functions. Whether *something continues* after is exactly what no instrument measures, so the claim goes beyond data. Some researchers study reports of near-death experiences, but those reports are about what people recall from a nearby state, which both sides read differently.
      - text: Logical. It follows from the word "life".
        feedback: |
          Nothing in the word "life" settles the matter. Philosophers do argue about it (is a mind the same thing as a brain?), but that is a debate about premises, not a result from definitions.
      - text: A value. It is only about what we hope.
        feedback: |
          Hope enters, but traditions and skeptics alike claim to say what is *so*, not only what is good. The claim is about reality, even if a test cannot confirm it.
    explanation: |
      Here it helps to keep three things apart (a habit of this course): what we **observe** (bodies stop working), what is **debated** (what a mind is, how to read near-death reports) and the **commitment** (continues or not). We label the last one as a faith or worldview commitment, in either direction, not as established fact.

  - type: mcq
    id: p1-multi
    title: "Question 5"
    multiple: true
    prompt: |
      Which of these can, **in principle**, be settled by measurement alone? Select all that apply.
    options:
      - text: "Is the tallest species of tree on Earth taller than 100 metres?"
        correct: true
      - text: "Is Mount Everest higher than the mountain K2?"
        correct: true
      - text: "Is a quiet Sunday morning better than a busy Saturday night?"
        feedback: |
          "Better" depends on what the person values. People who agree on every fact (noise, cost, time) still choose differently. It is a value.
      - text: "Can a flat triangle drawn on a page have angles adding to 200 degrees?"
        feedback: |
          In flat geometry this is settled by reasoning from the definitions, not by measuring drawn triangles (drawn ones are never exact). It is conceptual. (Curved surfaces behave differently, a later topic.)
    explanation: |
      Heights are measurable: the tallest trees, the coast redwoods, measure above 100 m, and Everest is higher than K2. Taste and definitions are not measured, though each can still be argued well or badly.

  - type: mcq
    id: p2-prayer
    title: "Problem 2 · Choosing the lens"
    prompt: |
      **Problem 2.** Someone asks: *"Does prayer work?"* Which is the best first move?
    options:
      - text: Ask what "work" means, then give each meaning its own lens. For example, "lowers stress or speeds recovery" is a question for science; "does God answer" is for theology and philosophy; "what it does in a life" is for lived experience.
        correct: true
      - text: Let science answer the whole question, since "work" means "has an effect".
        feedback: |
          Science can test effects it can measure (blood pressure, stress, recovery). Many believers mean something else by "work": being heard, or being changed. A scientific result then answers only one of the meanings.
      - text: Let theology answer the whole question, since prayer is a religious act.
        feedback: |
          Theology says what a tradition holds prayer is for. Whether prayer *measurably* changes anything is a separate claim, and a thoughtful believer may welcome it being studied, or may object to testing it. Either way the questions need separating.
      - text: Say it is just opinion and no lens applies.
        feedback: |
          Parts of it are measurable and parts are carefully arguable. "Just opinion" skips the sorting that this level teaches.
    explanation: |
      Ambiguous words ("work") hide several questions. **Pin down the words first**; then sorting is easy. Believers and skeptics both gain from this step, since it stops two people from arguing about two different questions.

  - type: mcq
    id: p2-trial
    title: "A large test of prayer"
    prompt: |
      A large US trial published in 2006 (the STEP study) followed about 1,800 heart-surgery patients. Strangers in prayer groups prayed for some of them; a comparison group had no such prayers. It found no reduction in complications for the prayed-for group. What does this result address?
    options:
      - text: 'One narrow meaning: whether prayers by strangers measurably lowered complications. It leaves open what prayer does for those who pray, and whether God answers prayer in ways a trial cannot detect.'
        correct: true
      - text: Whether any prayer in any sense is worthless.
        feedback: |
          The trial measured one outcome under one design. It says nothing about comfort, meaning or discipline, which are what many who pray have in mind.
      - text: Nothing at all, since science cannot study religion.
        feedback: |
          It did study a definite claim (prayers by strangers lower complications), and found nothing. Science can test the measurable part of a claim without ruling on the rest.
      - text: That believers must have been right all along.
        feedback: |
          A null result (finding no effect) gives no support to that. The rival reading, held by some believers, is that God is not a lever to be tested; that is a theological position, not a result of the trial.
    explanation: |
      According to skeptics, the trial is fair evidence about the measurable claim. According to many believers, it tests the wrong thing, because prayer is a relationship and not a treatment. Both can say the result is what it is; they part ways on **what prayer is**, a premise, not on the data.

  - type: mcq
    id: p2-meat
    title: "Is it wrong to eat meat?"
    prompt: |
      Take another big question: *"Is it wrong to eat meat?"* Which description of what each lens adds is best?
    options:
      - text: Science supplies facts (what animals feel, nutrition, effects on climate). Philosophy examines the arguments (does animal suffering count, and how much?). Theology reports what traditions hold. Lived experience shows how the choice fits culture, family and conscience. No single lens settles it.
        correct: true
      - text: Science decides it, because only facts can show whether something is wrong.
        feedback: |
          Facts say what happens to animals, but "wrong" is a value. The same data lead one person to give up meat and another to keep eating it. Science informs the question without closing it.
      - text: Theology decides it, because right and wrong come only from religion.
        feedback: |
          Some people ground ethics in religion and some do not. Even within religions the answers differ: some traditions, such as Jainism, teach non-harm to animals and many Hindu and Buddhist followers avoid meat, while other traditions permit it with rules. So theology gives several answers, not one.
      - text: Lived experience decides it, because everyone just eats what they grew up with.
        feedback: |
          Habit is powerful and part of the story, but it does not tell us whether the habit is justified. Philosophers ask exactly that.
    explanation: |
      A **combination of lenses** is often the right tool. Notice the pattern: science gives facts, philosophy tests the reasons, theology gives a tradition's view and experience gives the person's setting. The conclusion still needs a value, which no lens supplies for free.

  - type: mcq
    id: p2-according
    title: "According to whom?"
    prompt: |
      Two sentences about eating meat. **(A)** According to the philosopher Peter Singer (born 1946), what matters is the suffering of any creature that can suffer, so the way animals are farmed counts morally. **(B)** According to Genesis 9:3, spoken to Noah's family after the flood, "every moving thing that lives shall be food for you." Which pairing of lens and kind of claim fits best?
    options:
      - text: "(A) philosophy, an ethical argument from a value; (B) theology, a statement of a tradition's scripture. They answer from different foundations and neither refutes the other."
        correct: true
      - text: "(A) science, a measurement; (B) lived experience, a diary entry."
        feedback: |
          Singer's claim is an argument about what ought to matter, not a measurement. Genesis is a sacred text held by a tradition, not a personal report.
      - text: "Both are philosophy, so only one can be right."
        feedback: |
          They come from different sources. One is an argument from a value, one is scripture. Different traditions read and weigh scripture differently, and many who share (B) accept limits on how animals should be treated.
      - text: "(B) is science because it describes what animals are."
        feedback: |
          The verse says what humans may do, not what animals are. It is a permission, given within a faith.
    explanation: |
      The habit of saying "**according to**" shows where each claim stands. Each view is strong from inside its own source, and when views clash, ask which **premise or value** they do not share rather than which side is louder.

  - type: mcq
    id: p2-parting
    title: "Where they part"
    prompt: |
      Two friends agree on every fact: pigs feel pain, farms cause some suffering, meat provides protein. One keeps eating meat; the other stopped. Where do they most likely part ways?
    options:
      - text: On a value or premise, such as how much animal suffering should weigh against human tradition, taste and needs.
        correct: true
      - text: On a fact, since people with the same facts must reach the same decision.
        feedback: |
          The setup says they agree on the facts. The same facts can support different decisions because the facts do not say how much each thing should weigh.
      - text: On a logical error, since one of them must be reasoning badly.
        feedback: |
          Both may reason validly from different starting points. A valid argument from different values reaches different conclusions.
      - text: They do not really disagree; both are right.
        feedback: |
          They do disagree about what to do. Understanding the source of the disagreement does not make it vanish, but it shows what a conversation could target.
    explanation: |
      Disagreements part at three places: a **premise** (what we assume to be so), a **value** (what matters, and how much) or the **evidence** (what the facts are or how to read them). Finding which one is in play is the main service of this course.

  - type: mcq
    id: p3-split
    title: "Problem 3 · Splitting a compound question"
    prompt: |
      **Problem 3.** *"Do dreams predict the future, and should I pay attention to mine?"* This is really several questions. Which split gives each part a fitting lens and kind of evidence?
    options:
      - text: "(a) Do dream contents match later events more than chance would give? Science, records and counts. (b) What are dreams, as brain activity? Science. (c) Do dreams carry meaning for the dreamer? Lived experience and psychology, reports and interpretation. (d) Do some traditions read dreams as messages? Theology, according to each tradition."
        correct: true
      - text: "One question, answered by asking people whether their dreams came true."
        feedback: |
          People remember the hits and forget the misses, so that is the cherry-picking trap from earlier in this level. It also folds three different questions into one.
      - text: "(a) Science for everything, since dreams happen in a brain."
        feedback: |
          The brain activity is a scientific question. Whether a dream *means* something to you, or what a tradition says about it, is not settled by brain scans.
      - text: "(a) Theology for everything, since dreams are mysterious."
        feedback: |
          Mystery is not a lens. Some parts are open to counting, and the lens for each part follows from the kind of answer that part can have.
    explanation: |
      Splitting means asking, part by part: **what kind of answer** can this have, and **what would count as evidence**? Part (a) wants counted hits and misses; part (c) wants careful reports of what people experience; part (d) wants the tradition's own texts and teachers.

  - type: numeric
    id: p3-chance
    title: "Part (a): how many hits by luck?"
    prompt: |
      A toy check for part (a). Suppose **10,000** people each remember **one** dream tonight, and for any single dream there is a **1 in 1,000** chance (pure luck) that it will loosely resemble some event in the news within a week. About how many "dreams that came true" should we expect from luck alone?
    answer: 10
    hint: Expected count = number of dreams times the chance for each one.
    explanation: |
      $10{,}000 \times \tfrac{1}{1000} = 10$. Even if each dream is very unlikely to match, with thousands of dreamers a few matches **are expected by luck**, and each makes a vivid story. So the right test counts hits **and misses** over everyone and compares with the luck level. (Toy numbers, not a measured rate.)

  - type: mcq
    id: p3-howwhy
    title: "A how-versus-why trap"
    prompt: |
      Someone says: "Science explained how a rainbow forms, drops of water bending and splitting sunlight, so asking what a rainbow *means* has no point." What is the slip?
    options:
      - text: It treats an answer to "how does it happen?" as if it answered "what does it mean to us, or is there a purpose?". The questions differ, so one answer need not cancel the other.
        correct: true
      - text: There is no slip; once the cause is known, no other question remains.
        feedback: |
          The cause answers "how". Whether a rainbow is beautiful, or is a sign in a tradition (as in Genesis 9, where it is a sign of a promise, according to that text), is a different question.
      - text: The speaker should have said science cannot explain the rainbow.
        feedback: |
          Science explains the how very well. The slip is claiming that this explanation settles the other questions.
      - text: The slip is that a rainbow has no cause.
        feedback: |
          It has a well-understood physical cause. The slip lies in the jump from that cause to "no meaning".
    explanation: |
      A **how** explanation (the process) and a **why** explanation (a purpose or meaning) can both be true. The reverse slip also exists: using "it has a purpose" to deny that it has a physical cause. Whether any purpose exists at all is one place where views part, and we meet it in later levels.

  - type: order
    id: p3-method
    title: "A method for any big question"
    prompt: Put the steps of the sorting method in order.
    steps:
      - 'State the question in one clear sentence and pin down ambiguous words.'
      - 'Split it into parts if it is really several questions.'
      - 'For each part, ask what kind of answer it can have: fact, conceptual, faith commitment or value.'
      - 'Choose the lens or lenses that fit, and say what would count as evidence there.'
      - 'Say according to whom each answer is given, and where views part: premise, value or evidence.'
    hint: Clarify, split, classify, choose, then attribute.
    explanation: |
      The order matters: classifying a muddy question gives muddy results, and choosing a lens before the kind of answer is known can mean answering the wrong question well.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Four kinds of answer**: measurable fact, conceptual (from meaning or reasoning), faith commitment (trust beyond a test) and value (what is right or worth doing). Many everyday questions mix them.
      - **Four lenses**: science, philosophy, theology and lived experience, often combined; each adds a different part of an answer.
      - **Splitting and pinning down words** (like "work") turns one muddy question into several clear ones, each with its own evidence.
      - **How versus why**: a cause does not cancel a meaning, and a meaning does not cancel a cause.
      - **Where views part**: at a premise, a value or the evidence, and saying "according to whom" shows which.

      What stays open: nothing here said which answers to the big questions are true; it only gave you the tools to ask them well.

      **Next:** part 2 of the challenge has problems 4 and 5, which combine everything: telling a good reason from a bad one inside a longer debate, and a final question to take apart yourself.
