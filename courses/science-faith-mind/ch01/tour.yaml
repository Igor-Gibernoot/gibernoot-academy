id: ch01-tour
title: A Puzzle for Every Level
kind: concept
own: |
  - **Every later level starts from a question you can already feel.** The tour gave one guessing puzzle for each of them, and the answers were not the point: the point was to see {{ which premise, value or kind of evidence the answer turns on }}.
  - **Good tests can fail.** According to the philosopher **Karl Popper** (1902-1994), a test is informative when {{ it could have shown the idea wrong }}, so trying only cases that fit teaches little. A **selection effect** is a bias in which cases we get to see, as when only the survivors, the winners or the observers are left to ask.
  - **Pictures of the same facts can differ.** Brain scans, a kettle boiling, a story in an ancient text or a feeling of unity can each be read in two or more ways (physical or non-physical, "how" or "why", literal or interpreted). According to different thinkers, each reading is reasonable, and the data alone often {{ does not decide between them }}.
  - **Origin is not truth.** Explaining why people hold a belief (a hunter's alarm, a childhood, a culture) is a different question from asking whether the belief is true; each needs its own kind of evidence, and the first does not by itself settle the second.
  - **Where thoughtful people part ways.** Across the course the disagreements come down to three things: a {{ premise }} one side accepts and the other rejects, a {{ value }} weighed differently, or a {{ kind of evidence }} counted more or less. Naming which one is the first step of every level.
cards:
  - type: text
    id: welcome
    title: "A puzzle for every level"
    body: |
      Same promise, in one line: in every Level 1 lesson, **guessing is the point**, and wrong guesses come with a reason.

      This lesson is a tour. The course has many levels after this one, and for each you will meet **one small puzzle** you can try with common sense alone. No answers are announced as winners: where thoughtful people disagree, the explanation says what they disagree about. Every technical word is explained the first time it appears.

  - type: mcq
    id: p-science
    title: "Puzzle: testing a rule"
    prompt: |
      I have a secret rule for three numbers. The triple **2, 4, 6** fits it. You guess the rule is "each number is 2 more than the one before". You may test one more triple and I will say yes or no. Which test could teach you the most?
    options:
      - text: "5, 3, 1 (going down), because a \"no\" would not surprise you, but a \"yes\" would show your guess is too narrow."
        correct: true
      - text: "10, 12, 14, because it follows your guess."
        feedback: |
          If the answer is "yes" you learn almost nothing: your guess predicted it. Tests that can only agree with your idea are weak.
      - text: "8, 10, 12, because it is a different triple from 2, 4, 6."
        feedback: |
          It is a new triple but it still follows "add 2", so it cannot separate your guess from broader rules such as "any rising numbers".
      - text: "No test can help, since a rule can never be known."
        feedback: |
          We can never be sure, but some tests teach more than others. That difference is the whole idea.
    explanation: |
      A good test is one that **could have gone against you**. The philosopher Karl Popper (1902-1994) made this central to science. Others, including followers of Thomas Kuhn (1922-1996), stress that scientists also work inside shared frameworks. The level on *How Science Knows* studies how both views fit together.

  - type: mcq
    id: p-reality
    title: "Puzzle: what does a brain scan show?"
    prompt: |
      A scanner shows that a particular pattern of brain activity appears every time a person feels joy, and never otherwise. Which statement is **safest** to draw from the scan alone?
    options:
      - text: "Joy and that brain pattern go together; the scan alone does not tell us whether joy *is* the pattern, is caused by it, or is something else that travels with it."
        correct: true
      - text: "Joy is nothing but that pattern, so there is no inner feeling."
        feedback: |
          According to **materialists** (those who hold that only matter and its behavior exist) this may be right, but the scan does not prove it. It shows a correlation, and other readings fit the same data.
      - text: "Joy is a separate non-physical thing that the brain merely receives."
        feedback: |
          According to some **dualists** (those who hold that mind and matter are two kinds of thing) this is a coherent view, but the scan does not prove it either.
      - text: "The scan proves that joy is not real."
        feedback: |
          A pattern in the brain does not make the feeling unreal; at most it says what accompanies it.
    explanation: |
      The same facts, several readings: the level *Views of Reality* lays them side by side (materialism, idealism, dualism and others) and asks what each assumes.

  - type: mcq
    id: p-math
    title: "Puzzle: a full hotel with endless rooms"
    prompt: |
      A hotel has infinitely many rooms, numbered 1, 2, 3, and so on, and every room is occupied. A new guest arrives. The manager says: "No problem." How could she make room, without evicting anyone?
    options:
      - text: "Ask the guest in room 1 to move to room 2, the guest in room 2 to room 3, and so on: everyone moves one room up and room 1 is free."
        correct: true
      - text: "She cannot: a full hotel is full."
        feedback: |
          That is true for a hotel with finitely many rooms. With endless rooms, every guest can still have a next room to move into.
      - text: "Put the new guest in the last room."
        feedback: |
          There is no last room: the numbers never end. That is exactly what makes the trick possible.
      - text: "Ask half the guests to leave."
        feedback: |
          Nobody needs to leave. Each guest simply moves to the room with the next number.
    explanation: |
      A classic puzzle often credited to the mathematician David Hilbert (1862-1943). It shows that infinite collections behave unlike finite ones. The level *Mathematics and Why It Works* goes on to ask how such abstract facts can describe the world, and whether mathematics is invented or discovered: **Platonists** (who hold that mathematical objects exist independently of us) and **formalists** (who treat mathematics as rules of a game) answer differently.

  - type: mcq
    id: p-origins
    title: "Puzzle: a lucky universe?"
    prompt: |
      A lottery has 1,000,000 tickets and one winner. The winner exclaims: "Out of a million, it was me! This must have been arranged for me." Which reply is **most reasonable**?
    options:
      - text: "Someone had to win; being surprised that *the winner* is the winner does not show an arrangement. We would need to know how the draw was run."
        correct: true
      - text: "Yes: a one-in-a-million event can only happen if it was arranged."
        feedback: |
          Rare events happen all the time when there are many chances: every possible draw is equally rare. Rarity alone does not show a plan.
      - text: "Nothing is surprising about it, so no question is left."
        feedback: |
          Too quick. If the draw were rigged, the same result would be expected. The question of *how it was run* remains.
      - text: "The ticket must have been special."
        feedback: |
          If the draw is fair, no ticket is special beforehand.
    explanation: |
      This is the shape of an argument in the level *Origins and Fine-Tuning*: the constants of physics look "just right" for life. According to some thinkers this suggests design; according to others it reflects a **selection effect** (only universes with observers have anyone asking) or many universes. The level asks which assumptions each reply needs.

  - type: mcq
    id: p-godfor
    title: "Puzzle: dominoes with no start"
    prompt: |
      Every domino fell because the one before it pushed it. A philosopher argues: "So there must have been a first push." What does this argument quietly assume?
    options:
      - text: "That a chain of 'because' cannot go back forever, or, if it can, still needs something outside it."
        correct: true
      - text: "That dominoes are heavy."
        feedback: |
          Weight plays no role. The argument is about the *shape* of the chain of causes, not the objects.
      - text: "Nothing: it follows by logic alone."
        feedback: |
          Look again: nothing in "every domino was pushed by the one before" forces a first one. An endless row has no first domino and each still has a pusher. The claim needs an extra premise.
      - text: "That the first push was an accident."
        feedback: |
          Nothing is said about accident or purpose. The argument only claims that some first push exists.
    explanation: |
      According to supporters of a **first-cause** argument (the cosmological and kalam arguments, studied in *Arguments for God*), an endless chain explains nothing, so something uncaused must exist; **God** here is the word for a supreme being, whose nature differs between traditions. According to critics, an endless chain is no contradiction, or the first cause need not be God. The disagreement is about a **premise** (a starting claim), which is what the level asks you to find.

  - type: mcq
    id: p-godagainst
    title: "Puzzle: a parent who can stop it"
    prompt: |
      Imagine a parent who knows everything, can do anything, and loves a child perfectly. The child suffers terribly for no reason anyone can see. Which of these is **a real way out** that thoughtful people have proposed? Choose the one that does not simply deny the problem.
    options:
      - text: "The parent may have reasons beyond our view, for instance a good that could not exist without the suffering (many theists reply this way)."
        correct: true
      - text: "Suffering does not really exist."
        feedback: |
          Some traditions say the world is not what it seems, but this reply usually denies the facts rather than answering the puzzle as posed, where the suffering is given.
      - text: "Loving someone means wanting them to suffer."
        feedback: |
          Hardly any position defends this; it changes the word "loves" until it means something else.
      - text: "Knowing everything and doing anything are the same as loving."
        feedback: |
          Power and knowledge are not love. The puzzle needs all three to hold together.
    explanation: |
      This is the **problem of evil**, central to the level *Arguments Against God*. According to **atheists** (those who hold that no god exists) it is a reason to doubt such a being; according to theists, it can be answered (free will, a greater good, limits on what can be known). Where they part ways: whether we can know what a being would have reasons to do.

  - type: mcq
    id: p-natgod
    title: "Puzzle: the stone problem"
    prompt: |
      Can an all-powerful being create a stone so heavy that it cannot lift it? Which view best handles the puzzle?
    options:
      - text: "According to many philosophers, 'a stone that an all-powerful being cannot lift' is a self-contradiction, like a square circle, so failing to do it is not a lack of power."
        correct: true
      - text: "Yes it can, and then it cannot lift it, so it is not all-powerful."
        feedback: |
          Either answer seems to break the idea. That is why the puzzle is famous. The view above avoids the trap by asking what "all-powerful" should mean.
      - text: "No it cannot, which proves that no such being exists."
        feedback: |
          That follows only if "all-powerful" means able to do even contradictions. Many theologians do not mean that.
      - text: "The question has no connection to what religions teach."
        feedback: |
          Believers across traditions have long discussed what divine power includes, which is why the puzzle is useful.
    explanation: |
      The level *The Nature of God* studies such attributes (power, knowledge, goodness, eternity). According to some thinkers God's power is limited only by logic; according to others, a being beyond logic is possible, or the words stretch beyond ordinary sense. A word like "all-powerful" has to be defined before it can be argued about.

  - type: mcq
    id: p-sciref
    title: "Puzzle: why is the kettle boiling?"
    prompt: |
      Two answers to "Why is the kettle boiling?": (a) "Because the gas flame heats the water until its molecules move fast enough to turn into steam." (b) "Because I want a cup of tea." Which is right?
    options:
      - text: "Both: they answer different questions, how it happens and what it is for."
        correct: true
      - text: "Only (a), because it is physical, and wanting is not a real cause."
        feedback: |
          Wanting tea is why *you* lit the flame. Ignoring it leaves out a real part of the story.
      - text: "Only (b), because purposes explain more than molecules."
        feedback: |
          The molecular story explains the boiling itself. Without it the purpose would not heat anything.
      - text: "They contradict each other, so one must be false."
        feedback: |
          They do not contradict: they are two levels of explanation of one event.
    explanation: |
      Some thinkers apply this to *Science and Religion*: science answers "how" questions, religion "why" or "what for" questions, so they do not conflict (a view often called "non-overlapping magisteria", after Stephen Jay Gould, 1941-2002). Others reply that religions also make claims about how the world is, such as about origins or miracles, so they can conflict. The level compares four ways of relating the two.

  - type: mcq
    id: p-mind
    title: "Puzzle: Mary and the colour red"
    prompt: |
      Mary is a brilliant scientist who has lived all her life in a black-and-white room. She knows every physical fact about colour and vision: light, eyes and brains. One day she steps out and sees a ripe tomato. Does she learn something new?
    options:
      - text: "It seems so (she learns what red looks like), and that is the puzzle: either there are facts beyond physical facts, or learning what an experience is like is not learning a new fact."
        correct: true
      - text: "No: she already knew everything, so nothing is left to learn."
        feedback: |
          This is one serious reply (some philosophers give it), but it must explain why seeing red still feels like discovery. Many people find "nothing new" hard to accept at first.
      - text: "She learns that tomatoes are red."
        feedback: |
          She could know from descriptions that tomatoes are called red; the puzzle is about the *experience* of red.
      - text: "The puzzle shows the colour does not exist."
        feedback: |
          Nothing in the story says that. The question is about what physical knowledge leaves out, if anything.
    explanation: |
      This is the thought experiment of the philosopher Frank Jackson (1982). It opens the level *Consciousness*, which is about **consciousness** (the fact that there is something it is like to be you). According to physicalists, the physical facts are all the facts; according to others, they leave out what experience feels like. We keep both on the table.

  - type: mcq
    id: p-altered
    title: "Puzzle: a dream that feels real"
    prompt: |
      In a vivid dream, everything feels completely real: you are sure you are awake. What does that feeling of being sure tell you about whether the dream is real?
    options:
      - text: "Very little: the brain can produce the feeling of certainty without anything outside matching it, so sureness alone is no test."
        correct: true
      - text: "A lot: such a strong feeling would not be produced for nothing."
        feedback: |
          Strong feelings appear in dreams, fear and illusions. Strength of feeling is not a record of what is outside.
      - text: "It proves the dream is real."
        feedback: |
          Then every dream would be real. The feeling comes with real and unreal experience alike.
      - text: "It proves everything we experience is a dream."
        feedback: |
          Too far. The dream shows that feelings of reality can mislead, not that all experience does.
    explanation: |
      The level *Altered States of Mind* (dreams, meditation, drugs and near-death experiences) asks what such states show. The same lesson helps: what was **documented** (reports, brain measurements) is separated from what is **interpreted** (whether the experience was of something real). Researchers and the people who have such experiences often read the same report differently.

  - type: mcq
    id: p-mystic
    title: "Puzzle: do different people share one experience?"
    prompt: |
      People from very different religions report a deep sense of unity or peace. Suppose you want to know whether this suggests a **common core** behind their experiences. Which finding would count as the stronger clue?
    options:
      - text: "People who have never heard of each other's traditions describe the same features in unprompted words."
        correct: true
      - text: "People from the same tradition describe it in the words of their own tradition."
        feedback: |
          Expected either way: people use the language they know. It does not separate a common core from a tradition shaping the experience.
      - text: "One famous person says that all religions are the same."
        feedback: |
          Authority is not evidence of what the others experienced.
      - text: "Everybody agrees that the experience felt good."
        feedback: |
          A feeling of well-being is common to many experiences, religious or not, and says little about their source.
    explanation: |
      According to the "common core" view (**perennialism**), mystics in all traditions meet the same reality in different words. According to **constructivists**, the tradition shapes the experience itself, so there is no single core. The level *Religious Experience and Mysticism* tests both views against reports.

  - type: mcq
    id: p-why
    title: "Puzzle: the rustle in the grass"
    prompt: |
      Our ancestors heard a rustle in the grass. It might be the wind (harmless) or a hidden predator (deadly). Mistaking wind for a predator costs a little energy; mistaking a predator for wind can cost a life. What kind of mind does this favor?
    options:
      - text: "One that tends to see someone or something behind events, even when nothing is there (a bias toward over-detecting agents)."
        correct: true
      - text: "One that never reacts to sounds."
        feedback: |
          That mind would be eaten. Missing a real predator costs far more than a false alarm.
      - text: "One that waits for proof before it ever reacts."
        feedback: |
          Waiting for proof is slow, and in this setup slow can be fatal.
      - text: "One that does not distinguish wind from predators at all."
        feedback: |
          The tendency is not blindness but a bias in one direction: false alarms are cheap.
    explanation: |
      According to some researchers in the **cognitive science of religion**, such a bias may help explain why humans readily imagine minds behind events. The level *Why Humans Believe* asks what such explanations show. A strict view says explaining the **origin** of a belief tells us nothing about whether it is true; a qualified view says it can lower our trust in the process behind the belief. This is the origin-versus-truth debate you met in *Outside Our Bubble*, and it is a live one.

  - type: mcq
    id: p-torah
    title: "Puzzle: an eye for an eye"
    prompt: |
      An ancient law in the Hebrew Bible (Exodus 21:24) says "an eye for an eye". Suppose you must apply it fairly in a real court. Which difficulty arises if you take it **literally**?
    options:
      - text: "Harm is hard to make exactly equal: a person who has lost one eye is harmed more by losing the other than a person with two."
        correct: true
      - text: "There is no difficulty: a literal reading is easy to apply."
        feedback: |
          Try it: how do you take "the same" from a person already missing a limb, or from someone whose injury cannot be repeated? Equal harm is not so simple.
      - text: "The law cannot apply to eyes, only to teeth."
        feedback: |
          The phrase lists several body parts; the difficulty is about equal harm, not which part.
      - text: "Any reading must be wrong."
        feedback: |
          Many readings are possible; the question is how a community decides between them.
    explanation: |
      According to the rabbinic tradition (the Mishnah, tractate Bava Kamma 8:1, and the Talmud, Bava Kamma 83b-84a), the verse is read as requiring monetary compensation for injury. Other readers have understood it as a literal limit on revenge. The level *Judaism and the Torah* shows how a tradition of interpretation works, and why it argues over meaning for centuries.

  - type: mcq
    id: p-gospels
    title: "Puzzle: four witnesses"
    prompt: |
      Four witnesses describe the same car crash. They disagree on the car's color and on who spoke first, but all say the crash happened at the same junction. What would a careful investigator conclude?
    options:
      - text: "The core (a crash at that junction) is well supported because independent accounts agree on it; the differences in details need separate explanation, such as memory or point of view."
        correct: true
      - text: "Nothing happened, since the witnesses disagree."
        feedback: |
          Disagreement on details is normal. The agreement on the core is the stronger signal.
      - text: "The most detailed witness must be right on everything."
        feedback: |
          More detail is not more accuracy; vivid details can be invented by memory.
      - text: "Disagreement proves that all four were lying."
        feedback: |
          Honest witnesses often differ. Lying is one explanation among many, not the default.
    explanation: |
      Historians who study the four Gospels (the early Christian accounts of the life of Jesus) use this kind of reasoning: where do the accounts agree, where do they differ, and why? According to Christians, the Gospels are inspired testimony to real events; historians as historians ask what can be established with the evidence. The level *Christianity and the Gospels* keeps those two kinds of claim visible.

  - type: mcq
    id: p-quran
    title: "Puzzle: keeping a text exact"
    prompt: |
      A long text is passed on by memory and recitation before any copy is widely written. Which practice would best protect it from slow change?
    options:
      - text: "Many people memorize it, recite it together, and check each other, so an error in one person is caught by the rest."
        correct: true
      - text: "One trusted person memorizes it and everyone else asks that person."
        feedback: |
          A single source can be mistaken, and nobody checks the text against anything else.
      - text: "Everyone retells it in their own words."
        feedback: |
          Then the wording would drift quickly. Fixed wording needs fixed checking.
      - text: "Nobody learns it, since it can be looked up."
        feedback: |
          This keeps no oral check at all and relies entirely on written copies.
    explanation: |
      According to Muslim tradition, the Qur'an was recited and memorized from the time of the Prophet Muhammad (c. 570-632 CE) and later collected in writing; recitation by many believers is one of the ways it is kept. Historians study the process of its writing and early copies, and some debate details of the timeline. The level *Islam and the Qur'an* separates what the tradition holds from what scholars find in manuscripts.

  - type: mcq
    id: p-self
    title: "Puzzle: where is the chariot?"
    prompt: |
      Take a chariot apart: wheels, axle, frame, reins, all in separate piles. Ask, "Is the chariot the wheels? the axle? the frame?" Each answer is no. Where, then, is **the chariot**? Which reply do you find most natural?
    options:
      - text: "'Chariot' is a name for the parts put together in a certain way; there is no extra thing beyond them."
        correct: true
      - text: "The chariot is a hidden object inside the parts."
        feedback: |
          Nothing is found when the parts are searched. This is the reply the puzzle is meant to question.
      - text: "The chariot is in the owner's mind."
        feedback: |
          A chariot can be pulled by horses whatever anyone thinks, so the name is not only a mental thing.
      - text: "The puzzle shows there are no parts."
        feedback: |
          The parts are quite real; the puzzle is about whether the whole is something more.
    explanation: |
      According to an ancient Buddhist text, the *Questions of King Milinda*, this is the argument used to say that there is no unchanging **self** (*anatta*, "not-self") behind the parts of a person: body, feelings, thoughts. According to the Upanishads and later Hindu thought, there is such a self (*atman*) that is the same through changes. The two levels *Hindu Thought* and *Buddhist Thought* explore these two answers to one question: what, if anything, is "you"?

  - type: mcq
    id: p-world
    title: "Puzzle: an old story and a coastline"
    prompt: |
      Many communities pass on stories by word of mouth. Some Aboriginal Australian stories speak of coasts that were once dry land. A team of researchers compared 21 such stories with the geological record. If a story really kept a memory of events, what would you expect to find?
    options:
      - text: "A match between details of the story and independent evidence about the land and sea of that time, for instance a coastline that moved."
        correct: true
      - text: "No match: stories never keep anything true."
        feedback: |
          Too strong. Stories can keep real information for a long time, though how long, and how reliably, is debated.
      - text: "A match is guaranteed: every old story is accurate."
        feedback: |
          No. Stories also change and add things. A match has to be checked, not assumed.
      - text: "The story proves what the people believe about the sacred."
        feedback: |
          A match with the coast could support the story's memory of events; beliefs about the sacred are a different kind of claim.
    explanation: |
      Patrick Nunn and Nicholas Reid (2016) argued that such stories are consistent with the rise of the sea after the last ice age, more than 7,000 years ago; this claim is debated among scholars of oral tradition. The level *Other Traditions Around the World* describes traditions as their members do, and says plainly what is documented and what is faith.

  - type: mcq
    id: p-spirit
    title: "Puzzle: telling a medium from a good guesser"
    prompt: |
      A medium says she is passing messages from a person who has died. She gives details that astonish the listener: a name, a favorite song. How could a test separate real information from clever guessing (reading cues and making broad statements)?
    options:
      - text: "Ask for specific details that nobody present could know or look up, and have the listener judge blind which of several sets of messages was meant for them."
        correct: true
      - text: "Ask whether the listener was moved by the message."
        feedback: |
          Being moved is real, but a good guesser can move people. Feeling does not separate the two explanations.
      - text: "Count how many statements were right, ignoring the wrong ones."
        feedback: |
          This is cherry-picking: counting hits while ignoring misses makes any guesser look good.
      - text: "Accept it, because no test is possible."
        feedback: |
          Tests are possible, and Spiritists and critics have both proposed some.
    explanation: |
      **Spiritism** (the doctrine set out by Allan Kardec, 1804-1869) holds that spirits of the dead can communicate with the living. According to its followers, mediums have given genuine information; according to critics, the results fit cold reading and chance. The level *Spiritism* asks: what is claimed, what is documented, and what would count as a fair test.

  - type: numeric
    id: p-aliens
    title: "Puzzle: how many neighbors?"
    prompt: |
      Our galaxy, the Milky Way, has about 100 billion stars. Suppose, as a pure guess, that only **one star in a billion** ends up with a civilization that can talk across space. About how many such civilizations would there be?
    answer: 100
    tolerance: 0.001
    answerText: '100'
    hint: "One in a billion of 100 billion: how many billions fit in 100 billion?"
    explanation: |
      100 billion divided by 1 billion is 100. Change the guess to one in a trillion and the answer drops to a tenth of one civilization. The result swings with a guess nobody can check, which is why the level *Aliens and the Cosmic Perspective* looks at the Drake equation (a way to organize those guesses) and at Fermi's question, "where is everybody?" (Enrico Fermi, 1950).

  - type: mcq
    id: p-language
    title: "Puzzle: does 'loves' mean the same?"
    prompt: |
      A believer says "God loves us". A mother says "I love my child". Is the word "loves" used in exactly the same sense?
    options:
      - text: "Possibly not: some thinkers say the word is used by analogy (similar, not identical), others that it is a symbol or a picture, and others that it is meant literally."
        correct: true
      - text: "Yes, exactly, since a word has only one meaning."
        feedback: |
          Words shift with the thing they describe: "healthy" means different things for a person, a diet and a climate.
      - text: "No, and so the sentence says nothing."
        feedback: |
          A sentence can carry meaning even if the word is stretched. Whether it does here is what the debate is about.
      - text: "It does not matter what 'loves' means."
        feedback: |
          It matters: what we mean decides what could count as evidence for or against the claim.
    explanation: |
      According to Thomas Aquinas (1225-1274), such words apply to God by **analogy**. According to others, religious language is symbolic or expresses attitudes rather than facts; others hold it is literal. The level *Language, Meaning and Religious Language* compares these.

  - type: mcq
    id: p-faith
    title: "Puzzle: do you know your ticket loses?"
    prompt: |
      You hold one ticket in a fair lottery of one million tickets. You are almost certain it will lose. Do you **know** it will lose?
    options:
      - text: "It depends on what 'know' demands: if knowing requires ruling out every chance of error, then no; if high certainty is enough, then yes. Thoughtful people disagree on the standard."
        correct: true
      - text: "Yes, since the odds are 999,999 to 1."
        feedback: |
          High odds are strong, but many people hesitate to say "I know" about a ticket, and the puzzle asks why.
      - text: "No, since anything can happen."
        feedback: |
          Taken seriously this would mean we know almost nothing, including ordinary facts. Most thinkers look for a middle path.
      - text: "The question has no possible answer."
        feedback: |
          It has several answers, each tied to a view of what knowledge requires.
    explanation: |
      Relatedly, *Faith, Reason and Knowledge* asks how faith (trust, hope, belief without full proof) differs from knowledge and how much certainty any belief can have. **Fallibilists** accept that we can know things while some chance of error remains; stricter views demand more.

  - type: mcq
    id: p-life
    title: "Puzzle: the experience machine"
    prompt: |
      A machine can give you any life you choose, perfectly pleasant and seeming completely real, but it is a simulation and you would not remember choosing it. Suppose you would refuse. Which belief about a good life does your refusal suggest?
    options:
      - text: "That a good life is more than pleasant feelings: we also want to actually do things and be in touch with reality."
        correct: true
      - text: "That pleasure is the only thing that matters."
        feedback: |
          If pleasure were all that mattered, the machine would be the best offer on the table.
      - text: "That the machine would not really work."
        feedback: |
          The puzzle stipulates it works. The test is whether feeling is all you want.
      - text: "That refusing proves nothing about values."
        feedback: |
          People do disagree on what it shows, but your choice is at least a clue to what you value.
    explanation: |
      The philosopher Robert Nozick (1938-2002) proposed this in 1974 against the view that only pleasure matters (**hedonism**, from the Greek word for pleasure). According to hedonists, the intuition can be explained away; others take it as showing other goods. The level *Philosophies of Life* sets several such views side by side.

  - type: mcq
    id: p-death
    title: "Puzzle: is death bad for the one who dies?"
    prompt: |
      The ancient philosopher Epicurus (341-270 BCE) argued, in a letter, in words close to these: when I exist, death is not here, and when death is here, I do not exist; so death is nothing to me. Which reply do many philosophers give?
    options:
      - text: "Death can be bad by depriving us of the good life we would otherwise have had, even if we never feel the loss."
        correct: true
      - text: "Epicurus is right and there is nothing more to say."
        feedback: |
          Many philosophers have accepted his view, but others find it incomplete. It leaves out what dying takes away.
      - text: "Death is bad because dying hurts."
        feedback: |
          Dying can hurt, but Epicurus is speaking of being dead, not of the pain of dying.
      - text: "We cannot talk about death at all."
        feedback: |
          Philosophers and traditions have talked about it for thousands of years.
    explanation: |
      This is the **deprivation** reply (defended by Thomas Nagel, born 1937). The level *Meaning, Ethics and Death* looks at it beside what religions and secular views say, including belief in an afterlife (according to many traditions) and acceptance without one (according to others).

