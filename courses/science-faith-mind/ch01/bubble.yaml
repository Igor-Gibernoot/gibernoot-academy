id: ch01-bubble
title: Outside Our Bubble
kind: concept
own: |
  - **Most beliefs are inherited.** A **belief** is something you hold to be true; a **worldview** is the whole picture of reality (God or no God, what a person is, what matters) that your beliefs form together. Surveys of religion consistently find that the worldview people hold as adults follows the one they were raised in far more often than chance would give. Mixing a starting expectation (the **prior**: how common each view is around you) with a mild piece of **evidence** (anything that counts for or against a view) works like
    $$\text{belief} \;\propto\; \text{prior} \times \text{evidence},$$
    where $\propto$ means "proportional to" and the shares are rescaled to add up to $100\%$. Example: three views A, B, C with priors $0.8,\,0.1,\,0.1$ and evidence $0.5,\,0.6,\,0.55$ give View A a share of
    $$\frac{0.8\times0.5}{0.8\times0.5+0.1\times0.6+0.1\times0.55}\approx 78\%,$$
    so {{ mild evidence barely moves a belief that starts with a strong prior; only strong evidence, or a flat prior, lets the evidence decide }}.
  - **Inherited is not the same as false, and trusting others is normal.** **Testimony** is believing something because someone else told you. Almost everything you know (the Moon is about $384{,}000$ km away) rests on it. According to Hume (1711-1776) we trust testimony because experience shows it is usually reliable; according to Reid (1710-1796) we trust by default unless given a reason not to. Either way the real question is {{ how reliable the source is }}.
  - **Why someone believes is a different question from whether it is true.** Arguing that a belief is false only because of where or how someone came to hold it is the **genetic fallacy** (a *fallacy* is a pattern of reasoning that looks fine but fails). It cuts both ways: {{ it cannot show that a belief is false, for a believer or for a sceptic }}. Some philosophers reply that an origin can matter when the process that produced the belief would have produced it {{ whether or not it was true }}; this is a live debate.
  - **An honest question** needs willingness to be wrong (knowing what would change your mind), a **steelman** of every view (stating it in the form its best defenders would accept, the opposite of a strawman), and the habit of saying {{ "according to" }} whose claim it is. The course aims at the right questions, not at declaring a winner.
cards:
  - type: text
    id: welcome
    title: "Guessing is the point"
    body: |
      Welcome to the first lesson of a course on the biggest questions: what is real, how do we know, is there a God, what is a mind?

      **Level 1 is a light tour, and in every lesson of it guessing is the point.** You will be asked things you have not been taught yet. Wrong guesses are expected, each comes with a reason, and nothing here is graded as a test of what you already know. Every technical word is explained the first time it appears, and no earlier knowledge or mathematics is needed.

      One more promise. This course tries to show **several ways to see each question**, in the form each view's best defenders would accept. It does not tell you what to conclude. A believer, an atheist and an agnostic should each be able to read it and say "that is fair".

  - type: mcq
    id: hook
    title: "Born here or there"
    prompt: |
      Picture twins separated at birth. One is raised in a town where almost everyone holds one picture of the world, call it **View A** (a *worldview* is a whole picture of reality: whether there is a God, what a person is, what matters). The other is raised in a far-away town where almost everyone holds a different picture, **View B**.

      Before any theory, **guess**: when the twins are adults, what is most likely?
    options:
      - text: Each most likely holds the view of the town they grew up in, although some of each will change their mind.
        correct: true
      - text: Birthplace makes no difference. Both end up with the same view, because the truth is the same for everybody.
        feedback: |
          Tempting, because the truth *is* the same for everybody. But what people end up *believing* is a different matter, and it depends on what they heard, whom they trusted and what seemed normal. Whether a belief is true is a separate question from how people come to hold it (we return to this).
      - text: Each is certain to hold the view of the town they grew up in. Nobody ever changes.
        feedback: |
          Too strong. Many people do change their worldview as adults, some after long thought. The upbringing is a strong push, not a prison.
      - text: Each tends to reject the view of the town they grew up in, because people rebel.
        feedback: |
          Some people do rebel, but they are a minority. Surveys of religion in many countries find that most adults keep the broad worldview of their upbringing.
    explanation: |
      Surveys across many countries find that the religion (or lack of one) people hold as adults follows the one they grew up in much more often than chance would give, with a real minority who change. That is an established observation. What it *means* is a question we start to open here.

  - type: widget
    id: mixer-bubble
    widget: belief-mixer
    config:
      causes:
        - { name: "View A", prior: 0.8, evidence: 0.5 }
        - { name: "View B", prior: 0.1, evidence: 0.6 }
        - { name: "View C", prior: 0.1, evidence: 0.55 }
      sharp: true
      toggle: false
      labels:
        prior: "Around you: how common each view is where you grew up"
        evidence: "A mild piece of evidence: how well each view fits it"
        belief: "What you end up believing"
        reset: "Reset"
      presets:
        - { label: "Grew up among View A", prior: [0.8, 0.1, 0.1] }
        - { label: "Grew up among View B", prior: [0.1, 0.8, 0.1] }
        - { label: "A mixed town", prior: [0.4, 0.3, 0.3] }
    body: |
      A toy to see the twins' puzzle in numbers. Three imaginary views, A, B and C. The **top sliders** show how common each view was where you grew up (your starting expectation). The **middle sliders** show how well each view fits a mild piece of **evidence** (anything that counts for or against a view) that you meet later; here the three fit it almost equally, with B and C a little better than A. The **bars** show what you end up believing.

      Try it: (1) press the three preset buttons and watch the bars; (2) drag one top slider and see how far the bars follow; (3) drag a middle slider up and see how much it takes to change the result.

  - type: numeric
    id: bubble-number
    review: false
    prompt: |
      Three views A, B, C. A person grew up where the views were common in the proportions $0.8$, $0.1$ and $0.1$ (their starting expectation). They then meet a mild piece of evidence that fits the views $0.5$, $0.6$ and $0.55$ well. Each view's share of belief is its expectation times its fit, rescaled so the three shares add up to $100\%$.

      What percentage of belief does View A keep? (Round to a whole number.)
    answer: 78
    tolerance: 1
    wrong:
      - { value: 80, feedback: 'That is the starting expectation. The evidence moved it a little, from $80\%$ to about $78\%$: the shares must be rescaled after multiplying.' }
      - { value: 33, feedback: 'That would be the share if all three views began equally likely. This person grew up where View A was common, and that starting expectation counts.' }
    hint: Multiply each starting expectation by its fit ($0.8\times0.5$, $0.1\times0.6$, $0.1\times0.55$), then divide View A's product by the sum of the three.
    explanation: |
      The three products are $0.40$, $0.06$ and $0.055$, which add up to $0.515$. View A keeps $0.40/0.515\approx 77.7\%\approx 78\%$.

      The lesson of the number: evidence that fits all three views about equally hardly moves a person who starts with a strong expectation.

  - type: widget
    id: mixer-outside
    widget: belief-mixer
    config:
      causes:
        - { name: "View A", prior: 0.34, evidence: 0.5 }
        - { name: "View B", prior: 0.33, evidence: 0.6 }
        - { name: "View C", prior: 0.33, evidence: 0.55 }
      sharp: true
      toggle: false
      labels:
        prior: "Outside any bubble: no view is more common"
        evidence: "The evidence: how well each view fits it"
        belief: "What you end up believing"
        reset: "Reset"
      presets:
        - { label: "Flat start, mild evidence", prior: [0.34, 0.33, 0.33], evidence: [0.5, 0.6, 0.55] }
        - { label: "Flat start, strong evidence for B", prior: [0.34, 0.33, 0.33], evidence: [0.2, 0.9, 0.2] }
        - { label: "Grew up among A, strong evidence for B", prior: [0.8, 0.1, 0.1], evidence: [0.2, 0.9, 0.2] }
        - { label: "Grew up among A, overwhelming evidence for B", prior: [0.8, 0.1, 0.1], evidence: [0.05, 0.95, 0.05] }
    body: |
      Now imagine standing **outside the bubble**: the top sliders start flat, as if no view were more common than another around you. Compare the presets. What decides the result when the start is flat? And how strong must the evidence be to move someone who grew up among View A?

  - type: mcq
    id: bubble-lesson
    prompt: |
      A toy model mixes a person's starting expectation (how common each view was around them) with the evidence for each view, and shows that people who grew up among View A tend to end up with View A even when the evidence is mild. What does this toy show?
    options:
      - text: How a belief can be formed and why upbringing weighs so much; it does not show that View A is true or false.
        correct: true
      - text: That View A is false, because it was only held for reasons of upbringing.
        feedback: |
          The toy describes *how* beliefs form, not *whether* they are true. A person raised among View A and a person raised among View B are both pushed by their surroundings, so if "pushed by surroundings" proved falsehood it would prove every view false, the person's own included.
      - text: That the evidence never matters.
        feedback: |
          Not so. With a flat start the evidence decides, and strong enough evidence moves even a strong starting expectation. It takes more evidence the stronger the expectation.
      - text: That View A must be true, since most people around you hold it.
        feedback: |
          How common a view is around you tells you about your surroundings, not directly about the world. Many once-common views were later given up. Popularity can be a clue (it may mean many people had good reasons), but it is not proof.
    explanation: |
      The toy separates two questions that are easy to blur: **how did I come to believe this?** and **is it true?** The first is about causes in my life; the second is about the world. The rest of the lesson keeps them apart.

  - type: text
    id: testimony
    title: "Most of what you know, you were told"
    image:
      - src: img/hume.webp
        alt: Painted portrait of David Hume in a brown coat and red cap, by Allan Ramsay
        caption: David Hume (1711-1776), Scottish philosopher, here in Allan Ramsay's portrait; he held that trust in testimony rests on experience of how reliable sources have been.
        credit: "Allan Ramsay, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Allan_Ramsay_-_David_Hume,_1711_-_1776._Historian_and_philosopher_-_PG_3521_-_National_Galleries_of_Scotland.jpg"
      - src: img/reid.webp
        alt: Painted portrait of Thomas Reid in dark clothes, by Henry Raeburn
        caption: Thomas Reid (1710-1796), Scottish philosopher, in Henry Raeburn's portrait; he held that we trust what we are told by default and give up that trust only when we find a reason to doubt.
        credit: "Henry Raeburn, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Henry_Raeburn_(1756-1823)_-_Thomas_Reid_(1710%E2%80%931796),_Professor_of_Moral_Philosophy_at_Glasgow_University_-_84.30_-_Fyvie_Castle.jpg"
    body: |
      Look at how many of your beliefs you checked yourself. That the Moon is about $384{,}000$ km away, that a city you have never visited exists, that the Earth is about $4.5$ billion years old: for nearly all of these you rely on **testimony**, a word meaning that you believe something *because someone else told you*, in a book, a lesson, a news report or a conversation.

      That is not a flaw. Nobody could check everything alone. Philosophers who study testimony give two views of why trusting others can be reasonable:

      - According to **David Hume** (1711-1776), we are right to trust testimony because experience shows us that people and sources of a given kind are *usually* reliable. Trust rests on a track record.
      - According to **Thomas Reid** (1710-1796), trusting what we are told is a natural default that we start with, and we should give it up only when we find a reason to doubt.

      Both agree on what matters most: not *whether* a belief came from others, but **how reliable the source is**.

  - type: mcq
    id: testimony-q
    prompt: |
      You believe the Moon is about $384{,}000$ km from the Earth, but you have never measured it. Someone says: "You only believe that because teachers told you, so it is just an inherited belief." According to both Hume and Reid, what is the best reply?
    options:
      - text: Believing something because a reliable source told you is a normal and often good way to know; what matters is how reliable the sources are, and this one has been checked in many independent ways.
        correct: true
      - text: Only beliefs you have checked yourself count as knowledge, so I should measure it or stop believing it.
        feedback: |
          If only first-hand checks counted, almost nobody would "know" almost anything: not the Moon's distance, nor the existence of other countries. Neither Hume nor Reid asks for this. They ask how reliable the source is.
      - text: Inherited beliefs are always true, because earlier generations were wiser.
        feedback: |
          Inherited beliefs can be true or false; so can the ones you worked out yourself. Being handed down says nothing either way. The test is the reliability of the chain behind it.
      - text: Teachers are never wrong, so there is nothing to answer.
        feedback: |
          Sources can be wrong, and good sources get corrected over time. The reply is not "sources are perfect" but "sources can be assessed for reliability, and these are good ones".
    explanation: |
      Hume would add that you can point to a track record (the distance has been measured by radar and laser echoes, among other methods); Reid would add that you are entitled to trust unless given a reason to doubt. In both pictures, the useful question is *how reliable is the source?*, never just *where did the belief come from?*

  - type: mcq
    id: genetic-1
    title: "A common slip"
    prompt: |
      Someone argues: "You believe in your religion only because your parents raised you in it. So your belief is false."

      What does this argument actually show?
    options:
      - text: Nothing about whether the religion is true. It shows why the person holds the belief (a cause in their life), not whether the belief is correct.
        correct: true
      - text: That the belief is false, since a belief with a cause like that cannot be true.
        feedback: |
          A belief can have an ordinary cause and still be true: you may believe the Moon is far away because your teacher said so, and that is true. A cause of a belief and the truth of the belief are different things.
      - text: That the belief is true, because the parents must have had good reasons.
        feedback: |
          Mirror-image slip. Parents may have had good reasons or poor ones; the fact that they passed a belief on does not settle it either way.
      - text: That the person is not allowed to examine the belief afterwards.
        feedback: |
          The opposite: the observation is a good *reason to examine*. It just cannot replace the examination.
    explanation: |
      Arguing that a belief is false *because of how someone came to hold it* is called the **genetic fallacy** (a *fallacy* is a pattern of reasoning that looks fine but fails; "genetic" here refers to the *origin* of the belief). The origin of a belief is one question; its truth is another, and has to be settled by evidence and argument.

  - type: mcq
    id: genetic-2
    prompt: |
      The same argument, aimed the other way. Someone says to a scientist: "You believe in atoms only because your teachers and textbooks told you. So atoms do not exist." Which statement is the best judgement of this argument?
    options:
      - text: 'It fails for the same reason: how the scientist came to believe in atoms does not show whether atoms exist. The scientist''s reasons (experiments, predictions) are what to examine.'
        correct: true
      - text: It succeeds, because a belief that comes from teachers is not independent evidence.
        feedback: |
          Teachers are a way to *pass on* evidence, such as experiments anyone can repeat. A belief received from teachers can still rest on strong evidence; the question is what the evidence is, not who handed it over.
      - text: It fails, but only because atoms are science and science is exempt from this kind of question.
        feedback: |
          No claim is exempt. The argument fails for any belief, scientific or religious, for the same logical reason. What science offers is evidence that can be examined, not immunity from questions.
      - text: It succeeds for atoms but would fail for religion.
        feedback: |
          The argument has exactly the same form in both cases, so it stands or falls the same way in both. A rule that is used against one side but excused for the other is not a rule.
    explanation: |
      Notice the symmetry. If "you believe it because of your upbringing" worked as a proof of falsehood, it would refute **every** belief, including the beliefs of whoever uses the argument. So it proves nothing against anyone, believer or sceptic. What *does* work is looking at the reasons.

  - type: mcq
    id: debunk
    prompt: |
      Some philosophers reply to the point above. They accept that "you believe it because of your upbringing" does not make the belief false, but they hold that an origin *can* matter. According to these philosophers, when does it give a real reason for doubt?
    options:
      - text: When the process that produced the belief would have produced it whether or not it was true (for instance, a process that would have given the same belief in any town, true or not).
        correct: true
      - text: Whenever the belief was learned from other people.
        feedback: |
          That would condemn nearly all knowledge (see the Moon's distance). The worry is only about processes that do not track the truth.
      - text: Whenever the belief is comforting.
        feedback: |
          Comfort alone does not make a belief false or doubtful; a comforting belief can be true. It becomes a reason for care when it is the *reason* the belief is held, and nothing tracks truth.
      - text: Never. Origins are always irrelevant.
        feedback: |
          That is the strict version of the genetic-fallacy point, and many philosophers hold it. The reply in this card is the rival view: that some origins do carry information about reliability. Which view is better is a live debate, and later levels return to it.
    explanation: |
      Here are two views, both held by serious thinkers. **Strict:** origin never bears on truth; only reasons do. **Qualified:** origin bears on truth when it shows the process was unreliable (a thermometer stuck at 20 degrees would give "20" in any room, so its reading tells you nothing about this room). Which one fits better for religious beliefs, for moral beliefs, for scientific ones is an open question that thoughtful people still debate (not a settled fact), and later levels return to it.

  - type: text
    id: honest
    title: "What an honest question needs"
    body: |
      So where does that leave a question like "is there a God?" or "what is a mind?" Three habits make a question honest, and this course uses them throughout:

      1. **Willingness to be wrong.** Before looking, ask: *what would change my mind?* If the answer is "nothing", it is not a question yet.
      2. **A steelman of every view.** A **strawman** is a weak version of a rival view that is easy to knock down. A **steelman** is the opposite: the view stated in the strongest form its best defenders would accept. You only understand a view when its defenders say "yes, that is what we mean".
      3. **"According to".** Every claim comes from someone: a thinker, a text, a tradition, an experiment. Naming the source makes visible the limit of the answer.

  - type: mcq
    id: honest-q
    multiple: true
    prompt: |
      Which of these are habits of an honest question (select all that apply)?
    options:
      - text: Asking beforehand what evidence would change my mind.
        correct: true
      - text: Stating a rival view in the form its best defenders would accept.
        correct: true
      - text: Saying whose claim it is ("according to this text", "according to this scientist").
        correct: true
      - text: Choosing the answer first and then looking for support.
        feedback: |
          This is what an honest question avoids. If the answer is chosen in advance, nothing could count against it, and the search is only decoration.
      - text: Describing the rival view in its weakest form so that the contrast is clear.
        feedback: |
          That is the strawman. It makes your own view look good but teaches you nothing about the other, and the other side would not recognise it.
      - text: Assuming that people who disagree have not thought about it.
        feedback: |
          Thoughtful people disagree about these questions for reasons of different premises, values and kinds of evidence. Finding out which is part of the work.
    explanation: |
      The three habits are not rules of politeness; they are what lets a question have an answer at all. A question you cannot be wrong about, or that fights only a weak version of the other side, cannot teach you anything.

  - type: mcq
    id: steelman-1
    prompt: |
      A critic says: "Religious people believe things for no reason at all." Which restatement is closest to how many thoughtful religious people would put their own view (a steelman)?
    options:
      - text: 'They hold that their reasons are of a different kind from laboratory proof: arguments from philosophy, personal and shared experience, the testimony of a tradition and the sense of meaning, which they find reasonable even though they cannot be measured.'
        correct: true
      - text: They believe because they are afraid of death.
        feedback: |
          Some people may find comfort in religion, but this is a claim about *motives*, not a statement of the view in the form its defenders accept. (And it is a genetic-fallacy move if used to say the belief is false.)
      - text: They believe whatever their leaders tell them to believe.
        feedback: |
          Many believers do rely on a tradition's authority, but thoughtful ones usually say they also weigh arguments and experience. This version leaves the best reasons out, which is what makes it a strawman.
      - text: They believe in something, so there must be some truth in all religions.
        feedback: |
          This is not what most defenders of one religion would say, and many would reject it. A steelman is the view *as its defenders put it*, not a more agreeable view invented for them.
    explanation: |
      A steelman does not mean agreeing. You may think the reasons are weak. But you must be able to state them in a way the believer recognises, before you reply. (Whether those reasons are good is exactly the kind of question the course will examine, case by case.)

  - type: mcq
    id: steelman-2
    prompt: |
      The mirror case. A believer says: "Atheists believe life is meaningless and anything is allowed." Which restatement is closest to how many thoughtful atheists would put their own view (a steelman)?
    options:
      - text: 'They hold that there is no God, and many say meaning and morals do not need one: that we can find purpose in relationships, work, curiosity and care for others, and reason about right and wrong without a divine command.'
        correct: true
      - text: They hold that nothing matters, and they live accordingly.
        feedback: |
          A few thinkers hold a bleak view, but most atheists say the opposite and live lives full of meaning. This is the caricature, not the view as its defenders state it.
      - text: They hold that all religious people are foolish.
        feedback: |
          Many atheists have deep respect for religious friends and for religious thinkers; the claim that all believers are foolish is a strawman of the atheist's attitude.
      - text: They have not looked at the arguments.
        feedback: |
          Many atheists have studied the arguments at length, just as many believers have. Assuming the other side has not thought is a way to avoid the question.
    explanation: |
      Same habit, other side. Notice also that "atheist" means someone who holds that there is no God, and "agnostic" someone who holds that we cannot know either way; both are positions with arguments, and later levels examine them fairly.

  - type: mcq
    id: according-to
    prompt: |
      Compare two sentences. (1) "There is no permanent, unchanging self." (2) "According to Buddhist teaching, there is no permanent, unchanging self." What does adding "according to Buddhist teaching" do?
    options:
      - text: It shows whose claim it is, so the reader can see the limits of the answer and weigh it against other views; it says nothing yet about whether the claim is true.
        correct: true
      - text: It means the claim is probably false.
        feedback: |
          It does not. "According to" is not a warning. The phrase "according to modern astronomy, the Earth orbits the Sun" is true; it only tells you the source.
      - text: It means the claim is only an opinion, not worth discussing.
        feedback: |
          Many claims in every tradition and in science are carefully argued. Naming the source lets you check the reasons; it does not downgrade them.
      - text: It makes the sentence vague, so a clear statement is better without it.
        feedback: |
          It makes the sentence more exact: sentence (1) sounds like a fact of the world; (2) says who holds it. Questions about that claim can then be asked of that tradition ("what is its argument?") and set beside rival views.
    explanation: |
      You will see "according to" all through the course, for religions and for science alike. It is the language of an honest question: *this source says this; here is why; here is what rivals say.*

  - type: text
    id: summary
    body: |
      **Next:** *Four Lenses on One Question*. Take one huge question, **why is there something rather than nothing?**, and watch how science, philosophy, theology and lived experience each look at it. First, a guess: which of the four do you think will have the most to say?
