id: ch01-reasons
title: What Counts as a Good Reason?
kind: concept
own: |
  - **Five kinds of reason.** A **reason** is something that gives us ground to hold a claim. **Evidence** is a fact that makes a claim more or less likely (a measurement, a record, a pattern in many cases). An **argument** is a chain of reasons: starting claims called **premises** lead to a **conclusion**. **Testimony** is what someone else tells us they saw or know. **Experience** is what we ourselves perceive or live through. **Trust** is our willingness to rely on a source, and it lies behind most testimony, since we rarely check what we are told.
  - **Each kind has a typical failure.** Evidence fails when it is {{ cherry-picked (only the cases that fit were shown) or too few }}. An argument fails when it is {{ circular (the conclusion is already assumed in a premise) or when a premise is false }}. Testimony fails when the witness is mistaken or dishonest, even if sincere. Experience fails through {{ illusion and memory error, which feel exactly like the real thing }}. Trust fails when it is placed in a source that has no way of knowing.
  - **Trust can outweigh thin evidence.** In a toy with two claims, suppose we trust the source of claim 1 and of claim 2 in the proportions $0.9$ and $0.1$, and the evidence fits them $0.4$ and $0.6$. Each claim's share of belief is its trust times its fit, rescaled to add up to $100\%$:
  $$\frac{0.9\times 0.4}{0.9\times 0.4+0.1\times 0.6}\approx 86\%$$
  So claim 1 keeps about $86\%$ although the evidence slightly favors claim 2. This describes how belief can behave; it does not say that it should.
  - **Two views on trust.** According to **Reid** (1710-1796), {{ default trust in what we are told is reasonable until there is a reason to doubt }}. According to **Hume** (1711-1776), {{ trust should rest on a track record: how often the source has been right }}. Where thoughtful people part ways: how much trust may count as a reason in itself, and whether experience, a case of one, is evidence for others.
cards:
  - type: text
    id: welcome
    title: "Guessing is still the point"
    body: |
      Same promise as before: in every Level 1 lesson, **guessing is the point**. Wrong guesses are expected, and each comes with a reason. Every technical word is explained the first time it appears.

      This lesson asks a plain question: when we say "I have a reason to believe that", **what kinds of reason are there, and how can each one go wrong?**

  - type: mcq
    id: hook
    title: "Two arguments, one winner?"
    prompt: |
      Two people each try to convince you that a herbal tea cures colds.

      **Anna** tells you a vivid story: her aunt drank the tea, and two days later her cold was gone. **Ben** says: "A hospital gave the tea to 1,000 people with colds and a plain, tasteless drink to 1,000 others, without telling them which was which. Colds lasted the same time in both groups."

      Before any theory, **guess**: whose reason is stronger, and why?
    options:
      - text: Ben's, because it compares many people against a fair baseline, so luck and coincidence have little room.
        correct: true
      - text: Anna's, because a real person who really got better is more convincing than numbers.
        feedback: |
          The story is vivid, and vivid things feel strong. But colds usually go away by themselves in a few days, so her aunt might have recovered with or without the tea. One case cannot tell the two apart.
      - text: They are equally strong, since each is only one person's opinion.
        feedback: |
          Ben is not giving an opinion about one person. He is reporting what happened across 2,000 people, with a comparison group. That is a different kind of reason, and it carries more weight.
      - text: Neither says anything at all about the tea.
        feedback: |
          Both say something. Anna's story is weak but not worthless (it could prompt a test). Ben's is much stronger.
    explanation: |
      A vivid story feels strong because we picture it, but a story is **one case**. Ben's result is a **comparison** of many cases: the same illness, with and without the tea. That comparison is what makes it hard to blame coincidence. Not every reason is equally good, and this lesson names the kinds.

  - type: text
    id: kinds
    title: "Five kinds of reason"
    body: |
      A **reason** is something that gives us ground to hold a claim. People mostly use five kinds.

      - **Evidence**: a fact that makes a claim more or less likely, such as a measurement, a record or a pattern seen in many cases.
      - **Argument**: a chain of reasons. The starting claims are called **premises**; they lead to a **conclusion**. ("All metals expand when heated; iron is a metal; so iron expands when heated.")
      - **Testimony**: what someone else tells us they saw or know. ("The shop closes at six.")
      - **Experience**: what we ourselves perceive or live through. ("I felt the floor shake.")
      - **Trust**: our willingness to rely on a source without checking it ourselves. It is not a fifth fact about the world; it is what makes testimony work.

      Real conversations mix them. The next cards ask you to tell them apart.

  - type: mcq
    id: kinds-q
    title: "Which kind is it?"
    prompt: |
      A doctor says: "The scan shows a small fracture, so you should not run for six weeks." Which description fits best?
    options:
      - text: 'The scan is evidence; the sentence as a whole is an argument (premise: the scan shows a fracture; conclusion: do not run); and you rely on the doctor through trust.'
        correct: true
      - text: It is only experience, because the doctor saw the scan.
        feedback: |
          The doctor's own looking at the scan is experience for the doctor. For you, who did not see it, the doctor's report is testimony, and the scan itself is evidence.
      - text: It is only trust; evidence and argument do not appear.
        feedback: |
          Trust is present, since you probably cannot read the scan yourself. But the scan is a fact that makes the fracture likely, and "so you should not run" is a step from that fact to a conclusion.
      - text: It is only an argument, because a doctor spoke.
        feedback: |
          Speaking does not make something an argument. Here there is an argument, but it rests on evidence (the scan) and on your trust in the doctor.
    explanation: |
      Most everyday reasons are **bundles**. Pulling them apart is the skill: what is the fact, what is the step from fact to conclusion, and whose word are we relying on?

  - type: mcq
    id: testimony-q
    prompt: |
      A friend tells you: "The train line is closed today." You have not seen the station. Which kind of reason do you have, and what does it depend on?
    options:
      - text: 'Testimony, which depends on how much you trust your friend: whether they were in a position to know and are honest.'
        correct: true
      - text: Evidence of the same strength as a train timetable you read yourself, since it is the same fact.
        feedback: |
          The fact is the same, but the route to you is not. A friend can be mistaken or have misread a sign. Weigh the source, not only the claim.
      - text: Experience, because you now believe it.
        feedback: |
          Experience means perceiving something yourself. Hearing about it from a friend is testimony.
      - text: No reason at all, since you did not check it yourself.
        feedback: |
          Almost everything you know about places you have not visited came this way. Testimony is a real reason, though its strength depends on the source.
    explanation: |
      Testimony is how knowledge travels: history, geography, news, much of science textbooks. That makes **trust** one of the most important and most discussed kinds of reason.

  - type: text
    id: fail
    title: "Every kind can fail"
    body: |
      Each kind of reason has its own typical way of going wrong. Try to guess before reading the next cards.

      - **Evidence** can be **cherry-picked** (only the cases that fit are shown) or too thin (a handful of cases).
      - An **argument** can be **circular** (a premise already assumes the conclusion) or can start from a false premise.
      - **Testimony** can fail because the witness is mistaken, or dishonest; a sincere witness can still be wrong.
      - **Experience** can be an illusion or a faulty memory, which feel just like the real thing.
      - **Trust** can be placed in a source that has no way of knowing.

  - type: mcq
    id: cherry
    title: "Spot the failure: evidence"
    prompt: |
      An advertisement says: "Four customers who used our diet plan lost 10 kilograms each!" It does not say how many customers used the plan. What is the most likely weakness?
    options:
      - text: 'The evidence may be cherry-picked: if thousands used the plan, four successes say little about how a typical customer fares.'
        correct: true
      - text: Nothing; four people is plenty to prove a plan works.
        feedback: |
          Four cases can be a start, but without knowing how many tried and how many did not lose weight, they cannot tell us what usually happens.
      - text: The customers must be lying.
        feedback: |
          Nothing suggests lying. The problem can exist even if every word is true: showing only the successes hides the rest.
      - text: Diet plans can never be tested.
        feedback: |
          They can, with a comparison like Ben's tea trial. The advertisement just does not provide one.
    explanation: |
      Cherry-picking lets true statements add up to a misleading picture. The question to ask is always: **out of how many?** and **compared with what?**

  - type: mcq
    id: circular
    title: "Spot the failure: argument"
    prompt: |
      Someone argues: "This book is always right, because the book itself says that it is always right." What kind of failure is this, and is there a second way to see it?
    options:
      - text: 'It is circular: the premise ("the book says it is always right") only helps if we already trust the book. Defenders of such a book reply that a circle is hard to avoid for any source we use to judge itself, and look for outside support too.'
        correct: true
      - text: 'It is a false premise: books never say anything about themselves.'
        feedback: |
          Books can say things about themselves. The premise may be true; the trouble is that it only convinces someone who already believes the conclusion.
      - text: It is perfectly sound, since the premise supports the conclusion.
        feedback: |
          A valid-looking step is not enough. If accepting the premise already requires accepting the conclusion, the argument gives a reader who doubts no new reason.
      - text: It is not an argument at all, because it has no premises.
        feedback: |
          It has one premise and one conclusion. Its weakness is that they lean on each other.
    explanation: |
      According to critics, circular arguments cannot move someone who starts from doubt. A second view, held by some philosophers, notes that **every** way of checking our reasoning (even logic or the senses) is judged using something of the same kind, so a perfectly circle-free starting point may not exist. The usual response is to look for support from outside the circle, not to give up on reasons.

  - type: mcq
    id: witness
    title: "Spot the failure: testimony and experience"
    prompt: |
      Two honest witnesses of a car accident give different accounts of the color of the car. Neither is lying. What does this show?
    options:
      - text: 'Sincerity is not accuracy: a witness can sincerely report a memory or perception that is wrong.'
        correct: true
      - text: At least one of them must be lying.
        feedback: |
          Memory and perception are not recordings. Honest people can misremember or misperceive, especially in a stressful moment, with no lie involved.
      - text: Testimony is never worth anything.
        feedback: |
          Too strong. Agreement among several independent witnesses, or details that can be checked, can make testimony strong. The point is to weigh it, not discard it.
      - text: Color cannot be seen, so no one could know.
        feedback: |
          People see colors well in good light. The difference here comes from memory and circumstances, not from color being unknowable.
    explanation: |
      The same applies to our own **experience**: an illusion or a mistaken memory feels, from the inside, exactly like the real thing. That is why we look for a second source (another witness, a record, an instrument) when the stakes are high.

  - type: widget
    id: mixer-trust
    widget: belief-mixer
    config:
      causes:
        - { name: "Claim 1", prior: 0.9, evidence: 0.4 }
        - { name: "Claim 2", prior: 0.1, evidence: 0.6 }
      sharp: true
      toggle: false
      labels:
        prior: "Trust: how much you trust the source of each claim"
        evidence: "Evidence: how well each claim fits the facts"
        belief: "What you end up believing"
        reset: "Reset"
      presets:
        - { label: "Trust source 1, thin evidence", prior: [0.9, 0.1], evidence: [0.4, 0.6] }
        - { label: "Equal trust, same evidence", prior: [0.5, 0.5], evidence: [0.4, 0.6] }
        - { label: "Trust source 1, strong evidence for 2", prior: [0.9, 0.1], evidence: [0.05, 0.95] }
    body: |
      A toy with two imaginary claims. You trust the source of Claim 1 a lot and the source of Claim 2 little (**top sliders**). The facts fit Claim 2 only slightly better (**middle sliders**). The **bars** show where belief ends up: trust times fit, rescaled so the two add up to $100\%$.

      Try it: (1) press the three presets in turn; (2) drag a top slider and watch how far the bars follow; (3) drag a middle slider up and see how much evidence it takes to move a trusting reader.

  - type: numeric
    id: mixer-number
    review: false
    prompt: |
      Two claims. A reader trusts their sources in the proportions $0.9$ and $0.1$. The facts fit the two claims $0.4$ and $0.6$. Each claim's share of belief is its trust times its fit, rescaled so the two shares add up to $100\%$.

      What percentage of belief does Claim 1 keep? (Round to a whole number.)
    answer: 86
    tolerance: 1
    hint: |
      Multiply trust by fit for each claim: $0.9\times0.4$ and $0.1\times0.6$. Then divide the first by the sum of the two.
    explanation: |
      Claim 1 scores $0.9\times0.4=0.36$ and Claim 2 scores $0.1\times0.6=0.06$. The sum is $0.42$, so Claim 1 keeps $0.36/0.42\approx 86\%$. Trust, by a factor of $9$, outweighed evidence that favored Claim 2 only by a factor of $1.5$.

  - type: mcq
    id: trust-views
    title: "Is that reasonable?"
    prompt: |
      In the toy, a trusting reader keeps Claim 1 at about $86\%$ although the facts slightly favor Claim 2. Two thinkers disagree about whether this is reasonable. **According to Thomas Reid** (1710-1796), we are right to trust what we are told unless we have a reason to doubt. **According to David Hume** (1711-1776), trust should rest on a track record. Which statement matches Hume?
    options:
      - text: Trust a source to the degree that it has been right before; a source with no record deserves less trust.
        correct: true
      - text: Trust is reasonable by default; the burden is on whoever wants us to doubt.
        feedback: |
          That is Reid's view: default trust, withdrawn only when there is a reason to doubt.
      - text: Never trust anyone; only check things yourself.
        feedback: |
          Neither thinker says that. Almost nothing we know could be checked by one person in a lifetime.
      - text: Trust is a feeling and cannot be reasonable or unreasonable.
        feedback: |
          Both thinkers treat trust as something that can be better or worse justified. They disagree on what justifies it.
    explanation: |
      This is a **live debate** (a real disagreement among thoughtful people). Reid's view fits how children learn language and facts; Hume's view fits the caution we use with strangers or with claims that are unusual. In the toy, the strongest reading of Hume is that the $0.9$ should be earned by a record, not granted by default.

  - type: mcq
    id: trap-anecdote
    title: "Spot the failure: a single case"
    prompt: |
      Someone says: "My grandfather never wore a seatbelt and lived to 90, so seatbelts are not worth it." Which is the best reply?
    options:
      - text: One case cannot show what happens on average; the claim concerns a risk across many drivers, and survivors are more likely to tell their story.
        correct: true
      - text: The grandfather must be lying about his age.
        feedback: |
          Nothing suggests that. The case can be true and still not support the conclusion.
      - text: Personal stories never mean anything.
        feedback: |
          Too strong. A story can be true, can raise a question and can be a first clue. It just cannot settle a question about averages.
      - text: Seatbelts are worth it because most people say so.
        feedback: |
          Popularity is a different weak reason. The case for seatbelts rests on crash data from many accidents, not on how many people believe it.
    explanation: |
      This is Anna's tea story again: vivid, true, and one case. Quality of reason depends on the question. For "what happens on average?", many cases with a fair comparison carry the weight.

  - type: mcq
    id: experience-views
    title: "Does my experience count as evidence?"
    prompt: |
      A person says: "I felt a deep peace while praying, and that is evidence for me that something greater exists." Two views are common. Which pair of views is described correctly?
    options:
      - text: Some philosophers hold that a vivid experience is itself a reason for the person who has it, unless there is a reason to doubt it. Others reply that, since experiences can be illusions and differ across people, an experience is evidence only after being checked against other sources.
        correct: true
      - text: All philosophers agree that experiences count as no evidence at all.
        feedback: |
          They do not agree on this. Many hold that perception itself is an experience, so rejecting all experience would also reject seeing and hearing.
      - text: All philosophers agree that experience is as strong as an instrument measurement.
        feedback: |
          Not so. Even those who count experience as a reason usually grant that it can be mistaken and weigh it.
      - text: The only dispute is whether the person is sincere.
        feedback: |
          Sincerity is not the issue. The dispute is about what a sincere experience shows, to the person and to others.
    explanation: |
      This is a **live debate**, and a later level studies it in depth (Religious Experience). Note what both sides share: they do not mock the experience. They differ over whether it is a reason by itself, and over what it supports: a feeling of peace, or a claim about the world. Naming that difference is more useful than choosing a side now.

  - type: text
    id: summary
    body: |
      **Next:** *A Puzzle for Every Level*. Now that we have the kinds of reason, one guessing puzzle for each level of the course shows what questions lie ahead.
