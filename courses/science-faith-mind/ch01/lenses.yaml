id: ch01-lenses
title: Four Lenses on One Question
kind: concept
own: |
  - **One question, four lenses.** Take the question "why is there something rather than nothing?". A **lens** is a way of looking, with its own tools and its own kind of answer. According to **science** (the study of nature by observation, measurement and testable theories), the best-supported picture is that the **universe** (everything that exists in space and time) has developed over about $13.8$ billion years from a hot, dense early state; science describes {{ how the universe developed, but a state of "nothing" cannot be tested }}, so the question of why there is anything at all lies at or beyond its edge.
  - **Philosophy and theology answer differently.** **Philosophy** (careful thinking about the most basic questions) asks what the question assumes. According to the **principle of sufficient reason** (everything that exists has an explanation), {{ the existence of the universe itself needs an explanation }}; a critic replies that the principle may hold for things inside the universe but not for the whole, or that "no explanation" may be the end of the line. **Theology** (reasoning within a faith about what its God is and does) says, according to **theists** (people who hold that God exists), that {{ God is the source of all being, and the universe exists because God gives it existence }}; this is a faith commitment, and "whose God" matters (the God of Judaism, Christianity and Islam is not the Brahman of Hindu thought).
  - **Lived experience** is the lens of wonder: the awe that makes the question matter at all. It does not give an explanation, but {{ it shows why people ask, and what the answer would mean to them }}.
  - **Different lenses give different kinds of answer**, so an answer in one is not automatically an answer in another. Thoughtful people part ways over which {{ premise (does everything need an explanation?), value (what counts as a satisfying answer?) and kind of evidence }} they accept.
cards:
  - type: text
    id: welcome
    title: "Guessing is still the point"
    body: |
      Same promise as before: in every Level 1 lesson, **guessing is the point**. You will be asked things you have not been taught, wrong guesses are expected, and each comes with a reason. Every technical word is explained the first time it appears.

      This lesson takes one enormous question and looks at it four ways. The aim is not to find the winner, but to see **how different the ways of looking are**.

  - type: mcq
    id: hook
    title: "The oldest puzzle"
    prompt: |
      Here is the question: **"Why is there something rather than nothing?"** Why does a universe exist at all (the *universe* is everything that exists in space and time), when there might have been nothing?

      Before any theory, **guess**: four ways of looking are science (the study of nature by observation and experiment), philosophy (careful thinking about the most basic questions), theology (reasoning inside a faith about what its God is and does) and lived experience (the wonder and awe that make a person ask). Which of them have something to say about this question? Select all that apply.
    options:
      - text: Science, the study of nature by observation and experiment.
        correct: true
        feedback: Science has a lot to say about how the universe developed, as the next cards show.
      - text: Philosophy, careful thinking about the most basic questions.
        correct: true
        feedback: Philosophy has a lot to say about what the question itself assumes.
      - text: Theology, reasoning inside a faith about what its God is and does.
        correct: true
        feedback: Theology has a lot to say about what is given as the source of being.
      - text: Lived experience, the wonder and awe that make a person ask.
        correct: true
        feedback: Lived experience is where the question comes from in the first place.
      - text: None of them; a question this big has nothing useful to be said about it.
        feedback: Tempting, because the question is so large. But each way of looking can say something, even if only about what the question assumes or why it matters.
    multiple: true
    explanation: |
      Every one of the four has something to say, but each says a **different kind of thing**. That difference is the topic of the lesson. Which lens a person finds most promising often depends on what they count as a satisfying answer.

  - type: text
    id: science
    title: "Lens 1: science"
    body: |
      **Science** is the study of nature by observation, measurement and theories that can be tested. According to cosmologists (scientists who study the universe as a whole), the **universe** has developed over about $13.8$ billion years from an extremely hot, dense early state, and has been expanding and cooling since. That is a description of *how* it developed, backed by many independent observations.

      But "nothing" is hard for science to reach. Science works on things it can observe or predict. A state of absolutely no space, time, matter or laws is not something an experiment can prepare or measure. So, according to many scientists, the question "why is there anything at all?" lies at or beyond the edge of what science can test. A second view: some physicists propose that the universe could arise from a "nothing" that still has physical laws in it (the quantum vacuum, an empty state that still has rules). Critics reply that this "nothing" is already something.

  - type: mcq
    id: science-q
    prompt: |
      According to many scientists, why is "why is there something rather than nothing?" hard for science to answer directly?
    options:
      - text: A state of absolutely nothing, with no space, time, matter or laws, is not something that can be observed or tested, so science has no data about it.
        correct: true
      - text: Because scientists are not interested in big questions.
        feedback: |
          Many scientists are very interested; some write whole books on it. The limit is about what can be tested, not about interest.
      - text: Because the universe has always existed, so the question has no meaning.
        feedback: |
          Whether the universe had a beginning is itself debated. Many cosmologists describe an early hot, dense state about $13.8$ billion years ago, though what came before, if anything, is open. Either way, this is not the reason given.
      - text: Because science has already shown that the universe came from nothing.
        feedback: |
          Not an established result. Some proposals start from an "empty" state that still has physical laws, and critics note this is not truly nothing. The question remains open.
    explanation: |
      Science says a great deal about *how* the universe developed. The step from there to *why there is anything at all* needs a state of nothing to examine, and science has no way to observe one. That is a statement about the limits of the tool, not a defeat of it.

  - type: text
    id: philosophy
    title: "Lens 2: philosophy"
    body: |
      **Philosophy** is careful thinking about the most basic questions, using **arguments** (a chain of reasons leading to a conclusion). It does not run experiments. It asks what a question *assumes* and what would count as an answer.

      The question assumes that the existence of the universe needs an explanation. One famous principle says so: the **principle of sufficient reason** says that everything that exists has an explanation. The philosopher Gottfried Leibniz (1646-1716) used it to ask exactly our question.

      Two views. **According to defenders of the principle**, if some things have explanations and the whole universe has none, that would be an unexplained gap. **According to critics** such as Bertrand Russell (1872-1970), in a famous radio debate: the universe may simply be "there", and asking for an explanation of the whole may be asking more than the principle can give: it may apply to things *inside* the universe and not to the whole.

  - type: mcq
    id: philosophy-q
    prompt: |
      The principle of sufficient reason says that everything that exists has an explanation. A critic says: "That works for things inside the universe, but not for the universe as a whole. The universe may just be, with no further explanation." What exactly does the critic dispute?
    options:
      - text: Whether the principle applies to the whole universe and not only to things inside it.
        correct: true
      - text: Whether the universe exists.
        feedback: |
          The critic agrees that the universe exists. What is in dispute is whether its existence requires an explanation.
      - text: Whether philosophers should think about big questions at all.
        feedback: |
          The critic is doing philosophy: arguing about what a principle covers. The dispute is about the principle, not about whether to think.
      - text: Whether science can explain things inside the universe.
        feedback: |
          The critic accepts that things inside the universe have explanations. The point is about the whole.
    explanation: |
      Philosophy does not answer by measurement. It makes visible a **premise** (a starting claim of an argument): that everything needs an explanation. Whoever accepts that premise feels the question's force; whoever rejects it for the whole universe may find the question has no answer, and that this is acceptable.

  - type: text
    id: theology
    title: "Lens 3: theology"
    body: |
      **Theology** is reasoning within a faith about what its God is and does. A **theist** is a person who holds that God exists, and the word *God* needs care: the God of Judaism, Christianity and Islam, a single creator, is not the same idea as, for example, Brahman in some Hindu traditions, the ultimate reality behind everything. Whose God matters.

      **According to many theists** (in the Jewish, Christian and Islamic traditions), the answer is that God is the source of all being: the universe exists because God gives it existence, and God exists in a different way, not needing a cause. This is a **faith commitment**, not a result of measurement.

      A second view, from some **non-theists**: even if the reply is accepted, the same question can be asked of God ("why is there a God rather than nothing?"), and saying God needs no cause may only move the mystery. Theists reply that God is not one more thing in the universe, so the question applies differently. Whether this reply works is a live debate.

  - type: mcq
    id: theology-q
    prompt: |
      According to many theists in the Jewish, Christian and Islamic traditions, how do they answer "why is there something rather than nothing?"
    options:
      - text: The universe exists because God, who needs no cause, gives it existence.
        correct: true
      - text: The universe exists because experiments have proved that God exists.
        feedback: |
          Theists do not say this is an experimental result. They present it as a faith commitment, sometimes supported by philosophical arguments, which later levels will examine.
      - text: The universe exists by chance, and there is no further answer.
        feedback: |
          This is closer to one non-theist reply (that the universe may simply be). It is not the answer given by the theists in question.
      - text: The question has no meaning, so it should not be asked.
        feedback: |
          Some philosophers say so, but theists take the question as meaningful, and answer it with God as the source of being.
    explanation: |
      Notice the *kind* of answer: it names a source of everything, rather than describing how the universe developed. Whether the answer is convincing depends on the premises one accepts, which is why philosophers and theologians debate it.

  - type: text
    id: lived
    title: "Lens 4: lived experience"
    body: |
      The fourth lens is not a theory at all. **Lived experience** is what it is like to be a person who asks. Many people say the question first strikes them as **wonder** or **awe**, at night under the stars, at a birth, at a death, when suddenly it seems astonishing that there is anything at all. The philosopher Ludwig Wittgenstein (1889-1951) wrote that what is astonishing is not how the world is, but *that* it is.

      Two views of what this feeling shows. **According to some**, the awe is a clue, a sign pointing to something beyond the everyday. **According to others**, the feeling is real and valuable, but it is a fact about *us*: it explains why we ask, not what the answer is.

  - type: mcq
    id: match
    title: "Kinds of answer"
    prompt: |
      Match each lens to the *kind of answer* it gives to "why is there something rather than nothing?". Which pairing is right?
    options:
      - text: 'Science: how the universe developed. Philosophy: what the question assumes. Theology: a source of being, according to a faith. Lived experience: why the question matters to a person.'
        correct: true
      - text: 'Science: the final reason there is a universe. Philosophy: a laboratory test. Theology: a measurement. Lived experience: a proof.'
        feedback: |
          Each lens is given the wrong kind of answer. Science describes and tests; philosophy examines assumptions; theology names a source within a faith; experience shows why it matters. Mixing them up is the mistake this lesson is about.
      - text: 'Science: why the question matters to a person. Philosophy: how the universe developed. Theology: what the question assumes. Lived experience: a source of being.'
        feedback: |
          These are shuffled. How the universe developed is science; why the question matters is lived experience; naming a source of being is theology.
      - text: All four give the same kind of answer, in different words.
        feedback: |
          They do not. A description of how things developed, an examination of assumptions, a claim about a source of being and a feeling of wonder are four different kinds of thing.
    explanation: |
      Four lenses, four kinds of answer. None is automatically wrong for being a different kind; each answers a different version of "why".

  - type: mcq
    id: cannot
    prompt: |
      Which statement says correctly what a lens does **not** claim?
    options:
      - text: Science, in describing how the universe developed, does not claim to show whether there is a God or a purpose behind it; it does not test that.
        correct: true
      - text: Theology, in naming God as source of being, claims to have measured God in the laboratory.
        feedback: |
          Theology reasons within a faith; it does not claim a laboratory measurement.
      - text: Philosophy claims to settle the question once and for all by experiment.
        feedback: |
          Philosophy works by argument and does not run experiments; its conclusions are debated, not settled by experiment.
      - text: Lived experience claims to be a scientific theory.
        feedback: |
          Awe is not a theory. It is a human response.
    explanation: |
      Seeing what a lens does *not* claim is as useful as seeing what it does. A scientist who says "science does not test God" is not saying there is no God, and a believer who says "God is the source of being" is not claiming a result of measurement.

  - type: mcq
    id: parting
    title: "Where thoughtful people part ways"
    prompt: |
      Two thoughtful people look at the same question. One says "the universe just is, and that needs no explanation". The other says "the universe must have an explanation outside itself". They have read the same science. What is the most likely source of their disagreement?
    options:
      - text: A different premise, whether everything needs an explanation, together with a different sense of what counts as a satisfying answer.
        correct: true
      - text: One of them has not read the science.
        feedback: |
          We said they have read the same science. Science describes how the universe developed; it does not decide this premise.
      - text: One of them is not thoughtful.
        feedback: |
          Thoughtful people have held both positions for centuries. Disagreement does not mean one side has not thought.
      - text: The science shows clearly which of them is right.
        feedback: |
          The science is the same for both, and it does not reach the state of nothing. The disagreement lies elsewhere: in premises and values.
    explanation: |
      Three things usually separate people here: a **premise** (does everything need an explanation?), a **value** (what makes an answer satisfying: a description, a first cause, or acceptance of mystery?), and the **kind of evidence** a person accepts (measurement, argument, tradition, experience). Naming which one is at work is half of understanding the disagreement.

  - type: mcq
    id: trap
    title: "A common slip"
    prompt: |
      A student says: "Science has explained how the universe developed, so science has answered why there is something rather than nothing." What is wrong with this?
    options:
      - text: An answer to "how did it develop?" is not automatically an answer to "why is there anything at all?"; they are different questions, answered by different kinds of reasons.
        correct: true
      - text: Nothing; if science explains how, it explains why.
        feedback: |
          "How did it develop?" starts from a universe that already exists. "Why is there anything at all?" asks about the existence itself. An answer to the first leaves the second standing for those who ask it.
      - text: Science has proved that the universe has no purpose.
        feedback: |
          Science does not test purpose. This is a claim of a different kind, and the lesson shows why it cannot be borrowed from science.
      - text: The student should have used theology instead, because it always gives better answers.
        feedback: |
          No lens always wins. Using theology to answer a "how" question would be the same slip in the other direction.
    explanation: |
      The slip works in both directions: a result in one lens is not automatically an answer in another. "Science says" cannot by itself settle a question of purpose, and "my faith says" cannot by itself settle a question of how old the universe is.

  - type: text
    id: summary
    body: |
      **Next:** *What Counts as a Good Reason?* Each lens used some kind of reason: evidence, argument, testimony, experience, trust. What are they, and where can each one fail?
