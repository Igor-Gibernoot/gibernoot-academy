id: ch01-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: guessing is still the point"
    body: |
      Fast round. Each question hides a **tempting mistake** that careful people make about beliefs and reasons. As in every Level 1 lesson, **guessing is the point**: pick quickly, then read the feedback, especially when you were right for a shaky reason.

      Nothing here asks whether any religion or worldview is true. Every trap is about **how we reason**, and each one can catch a believer, a skeptic and a scientist alike.

  - type: mcq
    id: story-vs-data
    title: "The vivid story"
    prompt: |
      A student says: "My friend wore her lucky socks to an exam and got the top mark. Another study of 500 students found that sock choice makes no difference to marks. But I *saw* it work, so I trust my friend's story more than the study." What is the mistake?
    options:
      - text: A vivid single case feels stronger than it is. One success is what chance alone produces now and then; the study of 500 shows what usually happens.
        correct: true
      - text: There is no mistake; seeing something beats reading about it.
        feedback: |
          Seeing one case is real information, but it is a case of one. Among many students, a few do well wearing any socks, and each of them has a vivid story.
      - text: Stories can never be evidence of anything.
        feedback: |
          Too strong. A story can be a good starting clue (it may suggest what to test). The slip is letting it outweigh a fair comparison of many cases.
      - text: The study must be wrong, because lucky objects really work.
        feedback: |
          Nothing in the setup says the study is flawed. Doubting it only because it clashes with a story puts the vivid case ahead of the data.
    explanation: |
      **Evidence** is a fact that makes a claim more or less likely. A story is the memorable tip of a pile of cases, and we never see the cases where the socks did nothing. Ask: *out of how many?* and *compared with what?*

  - type: mcq
    id: genetic
    title: "Where it came from"
    prompt: |
      Someone says: "You only believe in your religion because you were born into a family that practises it. So your belief is false." (Replace "religion" by any worldview: the same sentence can be aimed at a scientist's belief in atoms or a skeptic's disbelief.) What is the best reply?
    options:
      - text: 'How a belief was acquired does not by itself decide whether it is true. To judge it, we must look at the reasons that support it now.'
        correct: true
      - text: 'The person is right: any belief that comes from upbringing is false.'
        feedback: |
          Then your belief that the Earth is round would be false too, since most of us first heard it from parents and teachers. Upbringing is a route, not a verdict.
      - text: 'The sentence is fine, but only when aimed at religion.'
        feedback: |
          The logic does not depend on the topic. If it fails against atoms it fails against religion, and if it worked against religion it would work against atoms.
      - text: 'Origins never matter at all, so there is nothing to discuss.'
        feedback: |
          Too far. Some philosophers argue that if a belief would be held *whatever* the truth, because only upbringing produced it, that weakens our confidence in it (a "debunking" argument). That is a live debate about how much it weakens, not a proof of falsity.
    explanation: |
      The tempting step "it came from there, so it is false" is called the **genetic fallacy** (a *fallacy* is a pattern of reasoning that looks sound but is not). The strict view says origin is irrelevant to truth; a qualified view says origin can be a reason to *re-examine* a belief. Both agree it cannot, alone, show the belief false.

  - type: mcq
    id: strawman
    title: "Whose view is it?"
    prompt: |
      A debate: Dana says, "Skeptics think anything that cannot be put in a test tube is worthless, so they cannot appreciate music or love." Which description fits Dana's move, and what would a fair (steelman) version do?
    options:
      - text: 'It is a strawman (a weak caricature that is easy to knock down). A steelman would state the skeptic''s view as a thoughtful skeptic would accept it, for instance: claims about the world should be backed by evidence, while music and love can be valuable without being claims of that kind.'
        correct: true
      - text: 'It is a steelman, because it makes the skeptic''s view as clear and strong as possible.'
        feedback: |
          A steelman is the strongest form *its defenders would accept*. Few skeptics would accept "worthless", so this is the opposite of a steelman.
      - text: 'It is fair, since some skeptics do say this.'
        feedback: |
          A few might, but the test is whether the *best* defenders would accept the description. Arguing against the weakest version proves little about the view itself.
      - text: 'A steelman would have to agree with the skeptic.'
        feedback: |
          No. Steelmanning means stating a view at its strongest, not accepting it. You can then disagree for stronger reasons.
    explanation: |
      Judge a view only after restating it so that its best defenders say "yes, that is what we mean". This works for every position in this course, whoever holds it.

  - type: mcq
    id: all-same
    title: "All roads, one summit?"
    prompt: |
      A speaker says: "All the great religions teach the same thing at heart, so their disagreements do not matter." What is the most careful response?
    options:
      - text: 'According to some thinkers (perennialists) there is a shared core, but many scholars and many believers reply that the traditions differ on basic questions, such as whether God is a person, whether we live once or many lives, and what is the goal of life. Whether the shared core outweighs the differences is a live debate.'
        correct: true
      - text: 'The speaker is right: the traditions are identical in their teachings.'
        feedback: |
          The traditions overlap on some moral teachings, yet disagree on questions they themselves consider central (for example one life or many). "Identical" is much stronger than any scholar claims.
      - text: 'The speaker is wrong: the traditions have nothing in common.'
        feedback: |
          Also too strong. Many share concern for compassion, for example. The mistake is the all-or-nothing form.
      - text: 'Disagreements do not matter, because the truth cannot be known.'
        feedback: |
          That is a different position (a form of skepticism) and it needs its own argument. Believers in each tradition usually think the disagreements matter a great deal.
    explanation: |
      "They all say the same" sounds respectful but can hide real differences, and believers often feel it erases what makes their tradition their own. Look at what each tradition says *according to itself* before comparing.

  - type: mcq
    id: science-god
    title: "Has science settled it?"
    prompt: |
      Someone says: "Science has proved that God does not exist." Another says: "Science has proved that God exists." Which statement about both is best?
    options:
      - text: 'Both overreach. Science tests claims about measurable things in nature; whether a being beyond nature exists is, according to many scientists and philosophers, not something its methods can settle either way. Others hold that some versions of God can be tested, so how far science reaches here is itself debated.'
        correct: true
      - text: 'The first is right, because science explains everything without God.'
        feedback: |
          Explaining many things without mentioning God does not show there is no God, just as explaining a car without mentioning its designer does not show it had none. Whether a further question remains is exactly what people debate.
      - text: 'The second is right, because science cannot explain everything.'
        feedback: |
          Gaps in explanation are not proof of anything; a gap may be filled later, or the question may be of another kind. "We cannot explain it" is not evidence for one particular answer.
      - text: 'Both are right, since science and religion are the same thing.'
        feedback: |
          They are different enterprises with different methods and aims; even people who see them as friendly partners do not claim they are the same.
    explanation: |
      "Science says" needs a precise object: *which* claim, tested *how*? Claims such as the age of the universe are scientific. Claims about purpose or about a being beyond nature raise questions of another kind, and how they connect to science is a debate we meet later.

  - type: mcq
    id: trust-evidence
    title: "Trust is not a measurement"
    prompt: |
      A man says: "I trust my doctor completely, so whatever she says is already proved." What does this get wrong?
    options:
      - text: 'Trust is a reason to *accept* what a source says, not proof that it is correct. Good trust depends on whether the source is likely to know, and can still be checked (a second opinion, a test).'
        correct: true
      - text: 'Nothing; if you trust someone fully, what they say is true by definition.'
        feedback: |
          Trusting makes us *accept* a claim; it does not make the claim true. Even excellent doctors make mistakes, which is why second opinions exist.
      - text: 'Trust is never a reason, so he should believe nothing she says until he checks it all himself.'
        feedback: |
          Nobody can check everything. According to Reid (1710-1796), default trust in what we are told is reasonable until there is a reason to doubt; according to Hume (1711-1776), trust should rest on a track record. Both treat trust as a reason, of different strength.
      - text: 'Trust matters only for religion.'
        feedback: |
          We rely on trust all the time: for medicine, for maps, for history, for most of what science we have not personally tested.
    explanation: |
      Trust lies behind most of what we know, so it counts as a reason. But "I trust the source" and "the source is right" are different statements; the gap between them is why we ask whether a source could really know.

  - type: mcq
    id: hits-misses
    title: "Count the misses too"
    prompt: |
      A forecaster says: "Last year I predicted 100 events. These 5 happened, so I am a great forecaster!" He shows only the 5 hits. What is the problem?
    options:
      - text: 'It is cherry-picking: without the other 95 misses, 5 hits could be just what chance produces. A fair record shows hits and misses together.'
        correct: true
      - text: 'There is no problem; 5 successes is 5 successes.'
        feedback: |
          Five hits out of 100 is a 5% record, which may be no better than guessing. The number alone means nothing without the total.
      - text: 'He must be lying about the 5 hits.'
        feedback: |
          The 5 hits may all be true. The trouble is what the presentation leaves out, which is how selective evidence misleads honestly.
      - text: 'Forecasts can never be judged.'
        feedback: |
          They can, by keeping the whole record. That is exactly what he avoids.
    explanation: |
      **Cherry-picking** is showing only the cases that fit. The same slip appears when we remember the times a hunch came true and forget the times it did not. Ask for the whole record, hits and misses.

  - type: mcq
    id: circle
    title: "Round and round"
    prompt: |
      Someone argues: "My horoscope is accurate, because the astrologer who wrote it says it is, and the astrologer is reliable because horoscopes like mine are accurate." What is wrong?
    options:
      - text: 'The argument is circular: each claim is supported only by the other, so someone who doubts one has no reason to accept the other. We need support from outside the loop.'
        correct: true
      - text: 'One of its premises is true, so the argument is good.'
        feedback: |
          A true premise does not rescue a circle. Even if both statements happened to be true, the argument gives no independent reason to believe either.
      - text: 'It is not circular, since it has two different claims.'
        feedback: |
          Two different claims can still form a circle when each is justified only by the other.
      - text: 'All arguments are circular, so this is no worse than any other.'
        feedback: |
          Some philosophers say a fully circle-free starting point may not exist, but they still look for outside support. This loop offers none: it never meets the world.
    explanation: |
      A **circular argument** assumes in a premise what it wants to prove. A good test: could a patient doubter, starting from doubt, be moved by it? Here, no.

  - type: mcq
    id: sincere
    title: "Sincere is not the same as right"
    prompt: |
      A witness says: "I clearly saw a tall figure in the road at night, and I would swear to it." Two people hearing this argue. Who reasons better?
    options:
      - text: 'The one who says that the sincerity makes it likely that the witness reports what they experienced, but that being sincere does not make the experience accurate: dim light, expectation and memory can all produce a vivid mistaken image.'
        correct: true
      - text: 'The one who says that a sincere witness cannot be wrong.'
        feedback: |
          Sincerity concerns honesty, not accuracy. A person can be completely honest and completely mistaken.
      - text: 'The one who says the witness must be lying, because nobody sees things at night.'
        feedback: |
          There is no reason to suspect lying, and people do see things at night. The question is how reliable such a report is, not whether it is dishonest.
      - text: 'The one who says the report is worthless, since it is only one person.'
        feedback: |
          One report is weak but not worthless. It can be a clue, and it becomes stronger if independent witnesses agree.
    explanation: |
      **Testimony** is what someone tells us they saw or know. It can fail in two ways: the witness is dishonest, or honestly mistaken. Sincerity rules out only the first.

  - type: mcq
    id: experience
    title: "Worthless or conclusive?"
    prompt: |
      Two people discuss a person who says, "I felt a strong presence in the room." Anna says: "Experience is worthless; it is all in the head." Ben says: "Experience is the best proof there is; I felt it, so it is real." Which comment best describes both?
    options:
      - text: 'Both go too far. Experience is a real kind of reason for the person who has it, but it can be an illusion that feels exactly like the real thing, so others may ask for more. What it shows, and for whom, is a live debate.'
        correct: true
      - text: 'Anna is right: since experiences can be illusions, they count for nothing.'
        feedback: |
          Eyesight can fool us too, yet we do not call seeing worthless. Fallible is not the same as useless; we give an experience weight and check it where we can.
      - text: 'Ben is right: if it felt real, it is real.'
        feedback: |
          Dreams feel real while they last. Feeling real is part of what an illusion is.
      - text: 'Neither: we should never talk about experiences.'
        feedback: |
          Experiences are among the most basic reasons we have, so avoiding them would leave out much of what people actually go by.
    explanation: |
      Many people treat their own experience as a strong reason for themselves, while it counts for others more like a report to be weighed. Both Anna and Ben turn "can be mistaken" or "can be right" into "always".

  - type: mcq
    id: only-opinion
    title: "Only an opinion?"
    prompt: |
      In an argument someone says: "That is just your opinion, and everyone is entitled to their opinion, so we cannot say that any view is better than another." What is the slip?
    options:
      - text: 'Having a right to hold an opinion does not make all opinions equally well supported. Views can be compared by their reasons: evidence, soundness of argument, how they handle objections.'
        correct: true
      - text: 'There is no slip; if everyone may hold a view, all views are equally good.'
        feedback: |
          Being entitled to a view is about freedom, not quality. Someone may freely believe the Moon is made of cheese; that does not make the view as good as the rest.
      - text: 'Opinions should be forbidden when they are not proved.'
        feedback: |
          Nobody needs proof to be allowed an opinion. The point is only that opinions differ in how well they are supported.
      - text: 'The slip is to think reasons matter at all in such matters.'
        feedback: |
          This is just another view, and it also needs reasons to be believed. Most people on all sides give reasons for what they hold.
    explanation: |
      This is the opposite trap to arrogance: using "everyone has a view" to avoid comparing reasons. We can respect people and still ask which views are better supported.

  - type: mcq
    id: lottery
    title: "Too unlikely to be chance?"
    prompt: |
      A lottery has 10 million tickets, and one is drawn. The winner exclaims: "The chance of *this* ticket winning was one in ten million, so the draw must have been rigged for me!" What is wrong with this reasoning?
    options:
      - text: 'Someone had to win, and every ticket was equally unlikely. A very unlikely outcome is not evidence of design unless we have a reason to expect a design (or a way to compare the two stories).'
        correct: true
      - text: 'Nothing; a one in ten million event cannot happen by chance.'
        feedback: |
          Rare events happen all the time: *some* ticket always wins. The rarity belongs to the specific winner, not to the fact that there is a winner.
      - text: 'The winner should conclude that the draw was fair, because the winner won.'
        feedback: |
          Winning is not evidence of fairness either. The slip is to read a conclusion off the rarity alone, in either direction.
      - text: 'Probabilities cannot be used for single events.'
        feedback: |
          They can; the problem is not the use of probability but concluding design from a small number without comparing it to what a rigged draw would predict.
    explanation: |
      Unlikely does not mean designed. Later levels return to this form of argument for the universe itself ("fine-tuning"), where people part ways on exactly how it compares with the lottery. The trap here is only the shortcut: **rare, therefore planned**.

  - type: mcq
    id: disagree
    title: "If they disagree..."
    prompt: |
      Thoughtful, honest people disagree about whether there is a God. Someone concludes: "So nobody is right, or at least nobody can say who is right." What is the mistake?
    options:
      - text: 'Disagreement shows that the question is hard or that people weigh premises, values or evidence differently. It does not show that there is no answer or that all answers are equally good. Mapping where and why people part ways is how we make progress.'
        correct: true
      - text: 'There is no mistake: if experts disagree, there is no truth to find.'
        feedback: |
          Experts once disagreed about whether continents move, and the matter was settled by evidence. Disagreement can persist because a question is hard, not because it has no answer.
      - text: 'The mistake is that the disagreeing people are not honest.'
        feedback: |
          Honest and well-informed people can still disagree, often because they start from different premises or give different weight to the same evidence.
      - text: 'The mistake is that one side must simply be ignored.'
        feedback: |
          Ignoring a side does not help; the best way to see why people differ is to state each side as its best defenders would.
    explanation: |
      This is the aim of the course: not to declare a winner but to find the exact point where views divide: a **premise** (a starting claim), a value, or a kind of evidence.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Thirteen traps, one pattern: each one turned a *useful* idea into a shortcut.

      - **A vivid story is not a trend**; ask *out of how many*, *compared with what*.
      - **Origins do not decide truth** (the genetic fallacy), though they can prompt a second look.
      - **State views as their best defenders would** (steelman, not strawman); no tradition is simply "the same" as the others.
      - **"Science has proved (or disproved) God"** needs a precise claim and a precise test.
      - **Trust, sincerity and experience are real reasons**, but not proofs.
      - **Cherry-picking and circular arguments** hide what is missing.
      - **Everyone may hold an opinion, but opinions differ in support**; **rare is not planned**; **disagreement is a map, not a verdict**.

      **Next:** the *Content Map*. Rebuild the whole Level 1 map, box by box, among look-alike decoys.
