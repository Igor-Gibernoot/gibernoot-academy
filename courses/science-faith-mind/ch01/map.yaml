id: ch01-map
title: "Content Map: The Big Questions"
kind: map
name: Level 1, The Big Questions (how to ask about science, faith and mind honestly)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a sentence. An arrow goes from an idea to one that builds on it, and a label on the arrow says how.

  You will rebuild the map of this level one box at a time. For each glowing box, pick the card that belongs there. As in every Level 1 lesson, **guessing is the point**: the other cards look alike, but each hides a classic mistake (a wrong attachment, a half-truth, a word used for something it does not mean), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: honest
    title: An honest question
    row: 1
    col: 1
    span: 3
    body: |
      An honest question needs willingness to be wrong, a **steelman** of every view (a view stated as its best defenders would accept it), and the habit of saying "**according to**" whose claim it is.
    decoys:
      - body: |
          An honest question needs a **strawman** of every view (a view stated in its weakest form, so that it is easy to test), and the habit of saying "**everyone knows**" whose claim it is.
        feedback: |
          A strawman is the opposite of a steelman: beating a weak version of a view shows nothing about the real one. And "everyone knows" hides the source, while "according to" shows the limit of the answer.
      - body: |
          An honest question needs a firm answer chosen beforehand, a **steelman** only of the views we already share, and the habit of saying "**according to**" whose claim it is.
        feedback: |
          An answer chosen beforehand is not a question. The steelman has to be fair to every view, above all to the ones we do not share.
    explanation: |
      This box is the root: every other idea of the level is a tool for asking honestly.

  - id: bubble
    title: Inherited beliefs
    row: 2
    col: 1
    body: |
      Most of our **beliefs** (what we hold to be true) are inherited from where we were born and whom we met. That is not the same as false: most of what we know rests on **testimony** (believing what others tell us), so the real question is how reliable the source is.
    decoys:
      - body: |
          Most of our **beliefs** are chosen freely after weighing all the evidence. A belief that is inherited is false, because it was never tested.
        feedback: |
          Surveys find that adults mostly hold the worldview they were raised in. And inherited does not mean false: a belief can be passed down and still be true.
      - body: |
          Most of our **beliefs** are inherited, so **testimony** is never a reason: only what we have checked ourselves counts as knowledge.
        feedback: |
          Nobody checks that the Moon is about 384,000 km away. Almost all knowledge rests on testimony; what matters is how reliable the source is.
    explanation: |
      Hume and Reid disagree on why we may trust testimony (track record versus default trust), but both ask about the source.

  - id: lenses
    title: Four lenses
    row: 2
    col: 2
    body: |
      One question can be seen through four **lenses**: science, philosophy, theology and lived experience. Each has its own tools and its own kind of answer, so an answer in one lens is not automatically an answer in another.
    decoys:
      - body: |
          One question can be seen through four **lenses**: science, philosophy, theology and lived experience. Only one of them is right, and the others are mistaken ways of asking.
        feedback: |
          The lenses are not rivals for one prize. They ask different things: how something developed, what a question assumes, what a faith holds, why it matters to us.
      - body: |
          One question can be seen through four **lenses**: science, philosophy, theology and lived experience. They all give the same kind of answer, so the order of the lenses does not matter.
        feedback: |
          Their answers differ in kind. Science describes how, philosophy examines assumptions, theology speaks inside a faith, and lived experience shows why people ask.
    explanation: |
      Example: "Why is there something rather than nothing?" Science describes how the universe developed, but a state of "nothing" cannot be tested.

  - id: reasons
    title: Kinds of reason
    row: 2
    col: 3
    body: |
      A **reason** can be **evidence**, an **argument**, **testimony**, **experience** or **trust**, and each has its typical failure: cherry-picked evidence, a circular argument, a mistaken witness, an illusion or memory error, trust in a source that cannot know.
    decoys:
      - body: |
          A **reason** can be **evidence**, an **argument**, **testimony**, **experience** or **trust**, and only evidence can fail: the other four are safe when they are sincere.
        feedback: |
          Every kind can fail. A sincere witness can be mistaken, and an experience can be an illusion that feels exactly like the real thing.
      - body: |
          A **reason** can be **evidence**, an **argument**, **testimony**, **experience** or **trust**, and an argument is circular when one of its premises is false.
        feedback: |
          A false premise is a different failure. An argument is circular when its conclusion is already assumed in a premise.
    explanation: |
      Trust can even outweigh thin evidence in how belief behaves. Whether it should is one place where thoughtful people part ways.

  - id: genetic
    title: Origin is not truth
    row: 3
    col: 1
    body: |
      Why someone believes is a different question from whether it is true. Arguing that a belief is false only because of where it came from is the **genetic fallacy**, and it cuts both ways: it cannot refute a believer or a sceptic.
    decoys:
      - body: |
          Why someone believes is a different question from whether it is true. Arguing that a belief is false only because of where it came from is **cherry-picking**, and it only works against believers.
        feedback: |
          Cherry-picking means showing only the cases that fit. Arguing from origin is the genetic fallacy, and it fails against any side.
      - body: |
          Why someone believes is the same question as whether it is true: a belief we can explain by upbringing is always false.
        feedback: |
          Upbringing explains why we hold a belief, not whether it is true. Some philosophers argue that an origin can matter in special cases, but never as an automatic refutation.
    explanation: |
      Compare the lens of philosophy: the question "is it true?" asks for reasons, not for a life story.

  - id: traps
    title: Shortcuts that fail
    row: 3
    col: 3
    body: |
      Common traps turn a useful idea into a shortcut: a vivid story over a fair comparison, **cherry-picking** (only the hits), a **circular** argument, and "rare, therefore planned" (the winner of a lottery was unlikely, yet someone had to win).
    decoys:
      - body: |
          Common traps turn a useful idea into a shortcut: a vivid story over a fair comparison, a **steelman** of one's own side only, and "rare, therefore impossible".
        feedback: |
          Rare events happen all the time: some lottery ticket always wins. And a steelman of one's own side only is not a steelman at all.
      - body: |
          Common traps turn a useful idea into a shortcut: a vivid story over a fair comparison, **cherry-picking** (only the misses), and "disagreement, therefore nobody is right".
        feedback: |
          Cherry-picking shows only the cases that fit, usually the hits. And disagreement only shows that a question is hard or that people weigh premises, values or evidence differently.
    explanation: |
      Each trap is a reasoning slip that can catch a believer, a sceptic and a scientist alike.

  - id: parting
    title: Where views part
    row: 4
    col: 1
    span: 3
    body: |
      Thoughtful people part ways over a **premise** (a starting claim they accept or reject), a **value** (what counts as a satisfying answer), or a **kind of evidence** they accept. Mapping that exact point is the progress the course aims at, rather than declaring a winner.
    decoys:
      - body: |
          Thoughtful people who disagree must be dishonest or uninformed. Disagreement shows that the question has no answer, so the course aims at declaring a winner.
        feedback: |
          Honest, well-informed people can disagree because they start from different premises or weigh evidence differently. Hard is not the same as unanswerable.
      - body: |
          Thoughtful people part ways only over the **facts**, never over values: once all the data are in, every honest person ends up in the same place.
        feedback: |
          Values matter too (what counts as a satisfying answer), and so does the choice of which kinds of evidence to accept.
    explanation: |
      This is the aim of the course: the right questions, with the exact point where views divide.

edges:
  - { from: honest, to: bubble }
  - { from: honest, to: lenses }
  - { from: honest, to: reasons }
  - { from: bubble, to: genetic, label: warns of }
  - { from: reasons, to: traps, label: fail as }
  - { from: genetic, to: parting }
  - { from: lenses, to: parting }
  - { from: traps, to: parting }

outroTitle: Level 1 in one picture
outro: |
  An honest question (steelman, "according to") looks at **inherited beliefs**, **four lenses** and **kinds of reason**. Origins and shortcuts are the usual slips, and in the end views part over a **premise**, a **value** or a **kind of evidence**. Next: the Level Review, then the Level Challenge.
