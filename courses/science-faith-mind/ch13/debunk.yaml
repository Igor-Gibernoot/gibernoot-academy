id: ch13-debunk
title: "Guided proof: Does Explaining Belief Explain It Away?"
kind: guided
proof: true
own: |
  The setting: a person holds a belief $B$ (a religious belief, a moral belief, a belief about the room temperature), and someone offers a causal story $S$ of how people come to hold beliefs of that kind (upbringing, a mental by-product, an adaptation). The question is whether learning $S$ lowers the reader's confidence that $B$ is true.
  - **Genetic fallacy.** Rejecting $B$ only because of where it came from, with no further argument, is {{ the genetic fallacy }}: how a belief arose does not by itself settle whether it is true, since true beliefs also have causes (teachers, eyesight, schooling).
  - **Debunking argument.** The strongest version has three premises and a conclusion. P1: $S$ is the real cause of the belief. P2: $S$ would have produced the belief {{ whether or not $B$ is true }}. P3: there is no independent support for $B$. C: the belief is unjustified, which is a different claim from "$B$ is false".
  - **Why it works or fails.** A cause undermines a belief when the process is insensitive to the truth, as in a jammed thermometer that always reads 20. A cause does not undermine it when the process tracks the truth, as in eyesight in daylight, or when independent support exists.
  - **Bayes in odds form.** Let $E$ be the fact that the belief seems true to the believer. Then
  $$\frac{P(B\mid E)}{P(\neg B\mid E)} = \text{LR}\cdot\frac{P(B)}{P(\neg B)}$$
  with the likelihood ratio
  $$\text{LR} = \frac{P(E\mid B)}{P(E\mid \neg B)}$$
  A full debunking story makes {{ $\text{LR} = 1$ }}, so the odds return to the prior; a story that leaves the process reliable keeps $\text{LR} > 1$.
  - **Replies.** Independent support (P3 fails), or the view that, if $B$ is true, the process is how the truth reaches us (P2 fails). According to Plantinga, whether religious belief is warranted {{ cannot be settled apart from whether it is true }}; the debunker answers that this assumes what is in dispute.
  - **Three layers.** That people hold beliefs through these causes is established; whether a given causal story undermines a given belief is a live debate; whether the belief is true is a faith or metaphysical commitment.

cards:
  - type: text
    id: recall
    title: "Recall: causes of belief"
    body: |
      Recall from the lessons Religion and the Group and Culture, Diversity and Secularisation. Scholars offer causal stories of why people believe in gods. In the **by-product** view, religion is a side effect of mental tools evolved for other jobs (such as spotting agents behind a rustle). In the **adaptation** view, religion itself was selected for what it does, for example helping large groups cooperate. In **cultural transmission**, children learn what to believe from the adults around them, with biases such as copying the majority and copying admired models. These stories describe how belief arises and spreads.

      This lesson asks a different question: if one of these stories is true, does it count against the belief? It is a guided proof, so each step is a question.

  - type: mcq
    id: hook
    title: "Guess: does learning the cause matter?"
    prompt: |
      Guessing is the point; no theory yet. Sam was raised in a faith by devout parents and holds it sincerely. Sam reads a well-run study showing that most people end up with the religion of their parents. (The same study shows that people raised without religion mostly stay without it.) Does this study, by itself, show that Sam's belief is false?
    options:
      - text: 'No. It shows how beliefs spread, and a belief can be true or false whatever its cause. What it may do is raise a different question about whether Sam has good grounds.'
        correct: true
        feedback: |
          Yes. A cause of a belief is not a proof that it is false. The study may still matter for a gentler reason, which this lesson sorts out: whether Sam's confidence rested on something the cause makes doubtful.
      - text: 'Yes. If upbringing explains the belief, the belief is false.'
        feedback: |
          This jumps from "has a cause" to "is false". Every belief has a cause, including the belief that two plus two is four (taught by a teacher). If having a cause made beliefs false, none could be true.
      - text: 'No, and the study is irrelevant to Sam in every way.'
        feedback: |
          Too quick in the other direction. Even if the study does not show the belief false, it can matter to how confident Sam should be, if Sam took the strength of the conviction as a sign of truth. The lesson separates these two things.
    explanation: |
      Two claims are easy to run together: "this belief is false" and "this belief is not well supported." The cause of a belief bears on the second only in particular conditions, and finding them is the work of the lesson. Note too that the study cuts both ways: people raised without religion also mostly keep their parents' stance.

  - type: text
    id: genetic
    title: "Origin versus truth"
    body: |
      Logicians call it the **genetic fallacy** when someone rejects a claim only because of where it came from (its origin, its source, the motives of those who first held it), with no argument about the claim itself. The reason is simple: truth and origin are different questions. A true claim can come from a bad source (a lucky guess, a prejudiced person, a dream) and a false claim can come from a good one.

      A small example. A student learns the rule for adding fractions from a teacher she trusts. A critic says: "You only believe it because your teacher told you, so it is false." That reasoning fails. The student's belief has a cause, the teacher, and the rule is also true, because it can be checked: slicing two pizzas and counting the pieces gives the same answer as the rule. The check does not depend on the teacher at all.

  - type: mcq
    id: spot
    title: "Which argument commits the fallacy?"
    prompt: |
      Two arguments. (A) "You believe the fraction-adding rule only because your teacher said so, so the rule is false." (B) "Your thermometer shows 20 °C because its needle is jammed at 20 and always shows 20, so its reading tells us nothing about the room temperature." Which one commits the genetic fallacy?
    options:
      - text: 'Only A. It moves from the cause of the belief to the falsity of its content, with nothing about the rule itself.'
        correct: true
        feedback: |
          Yes. B is different: it does not say the reading is false (the room may well be at 20), only that this cause gives no evidence about the room, since the needle would show 20 whatever the temperature. B is the shape of a debunking argument, which the next cards set out.
      - text: 'Only B. It dismisses the thermometer because of how its reading was produced.'
        feedback: |
          B says something stronger than "it has a cause": it says the cause would produce the same reading whatever the temperature. That is a claim about whether the reading carries information, not a jump to "the reading is false".
      - text: 'Both, because both judge a belief by its cause.'
        feedback: |
          They share the focus on causes, but only A treats the cause as proof of falsity. B draws a narrower conclusion, that the reading is no evidence, and it supports that with a specific feature of the cause (insensitivity to the truth).
    explanation: |
      The difference is the whole lesson in miniature. "It has a cause, so it is false" is a fallacy. "Its cause would have produced it whether or not it were true, so it gives no evidence" is a real argument that can be examined premise by premise.

  - type: text
    id: argument
    title: "The debunking argument"
    body: |
      A **debunking argument** tries to show that a belief is unjustified by exposing its cause. Here is the strongest version, in the form this course uses for arguments, for a belief $B$ held through a causal story $S$.

      - **P1.** $S$ is the real cause of the belief $B$ (the causal story is true).
      - **P2.** $S$ would have produced the belief whether or not $B$ is true.
      - **P3.** There is no independent support for $B$, that is, no evidence or argument for $B$ that does not rely on the belief-forming process $S$.
      - **C.** So the belief $B$ is unjustified.

      Notice the conclusion. It says "unjustified", not "false". The belief could still be true by luck, but the believer has lost a reason to count it as probably true. The argument was developed for many beliefs: Freud's *The Future of an Illusion* (1927) argued from wish-fulfilment about religious ideas, and Street's 2006 article, later in this lesson, argued about moral beliefs.

  - type: mcq
    id: which-p2
    title: "Which premise does this reply attack?"
    prompt: |
      A believer replies to the debunking argument: "If the God I believe in exists and wants people to know Him, then a process like upbringing or a natural tendency to see purpose could be exactly how people come to know Him. So it is false that the process would produce the belief whether or not it is true." Which premise does this reply attack?
    options:
      - text: 'P2: it says that, if the belief is true, the process is one that tracks the truth, so the belief would not form equally well if it were false.'
        correct: true
        feedback: |
          Yes. The reply accepts the causal story (P1) and does not offer independent evidence (P3). It disputes P2, the claim that the process is blind to the truth. Whether that reply is fair is a further question, taken up later in the lesson.
      - text: 'P1: it denies that the causal story is the true cause of the belief.'
        feedback: |
          The reply grants the story. It does not deny that upbringing or mental tendencies are involved; it says they could be the means by which a true belief is formed.
      - text: 'P3: it supplies independent evidence for God.'
        feedback: |
          No independent evidence is offered here. Such evidence would be an argument for the belief that does not run through the belief-forming process (for example a cosmological or moral argument from earlier lessons).
    explanation: |
      Each reply to a debunking argument attacks one premise. The cards that follow use the same method: ask which premise a critic rejects, and why.

  - type: mcq
    id: which-p3
    title: "Why does a scientist's belief survive?"
    prompt: |
      A physicist believes in atoms. She was taught this in school, so her belief has a cause in upbringing and training, which is a causal story of the same kind as Sam's. Yet most people think the debunking argument does not work against her belief. Which premise fails in her case?
    options:
      - text: 'P3: there is independent support, such as experiments on Brownian motion, X-ray scattering and chemical proportions, which do not rely on her teacher.'
        correct: true
        feedback: |
          Yes. If she had never been taught about atoms, the experiments would still point to them. Because that support exists apart from the schooling, learning the schooling story leaves her confidence mostly intact.
      - text: 'P1: schooling is not really the cause of her belief.'
        feedback: |
          Schooling is a real cause of what she believes. Her belief has a cause and a good justification at the same time; these do not exclude each other.
      - text: 'None: the argument is simply less strong against science than against religion.'
        feedback: |
          The argument has the same form in both cases. What differs is whether P3 holds. Whether independent support exists for a religious belief is exactly what believers and critics dispute, so the answer there is a matter of debate, not a built-in difference of the argument.
    explanation: |
      This is why the argument is not the genetic fallacy: it asks for independent support. Where it exists (atoms), the cause is harmless. Where it is disputed (religious belief), the debate moves to whether it exists.

  - type: text
    id: faulty
    title: "When the story does undermine a belief"
    body: |
      Return to the jammed thermometer. You read 20 °C and believe the room is at that temperature. A technician then tells you the needle is stuck and always shows 20 °C. Your belief may still be true, but you no longer have a reason to think so, because the instrument would have said the same on a freezing or a baking day. The cause is a process **insensitive** to the truth: change the facts, and the belief does not change.

      A second case: a person is convinced that a lottery ticket will win because they badly want it to. If the wish alone produced the conviction, learning that fact removes the conviction's value as evidence. In *The Future of an Illusion* (1927), Freud argued that religious ideas are illusions of this wish-driven kind. According to commentators, he stressed that an illusion is defined by the role of wish in producing it and is not necessarily false. The debunking argument is stronger when it shows the process is insensitive; the wish story is one way to claim that.

  - type: mcq
    id: sensitive
    title: "Which case undermines the belief?"
    prompt: |
      Case 1: you believe there is a tree in front of you because you see it in daylight with healthy eyes; a biologist explains in detail how your visual system produced the image. Case 2: you believe a coin landed heads because a machine that flips and reports at random told you so. Which explanation of how the belief was produced undermines it?
    options:
      - text: 'Case 2: the process would report heads or tails at random, so the report is the same whether or not the coin landed heads.'
        correct: true
        feedback: |
          Yes. The test is whether the process would have given a different result had the facts been different. The random machine would not; vision in daylight would.
      - text: 'Case 1: the biologist has shown that your belief is just the output of a mechanism.'
        feedback: |
          Having a mechanism is not the problem. Every belief is produced by some mechanism. In Case 1 the mechanism responds to the tree: with no tree, you would not see one. Explaining it in detail does not remove that link.
      - text: 'Both, because both are causal stories.'
        feedback: |
          Both are causal stories, but causal stories alone do not undermine. What undermines is the specific feature that the process ignores the truth (P2). Case 1 lacks it.
    explanation: |
      A useful question to ask of any causal story: if the belief were false, would the process still have produced it? A yes undermines (P2 holds); a no does not.

  - type: text
    id: reliable
    title: "When the story does not undermine a belief"
    body: |
      Now the opposite case. Seeing a tree in daylight is a reliable process: it produces the belief "a tree is there" when a tree is there and usually not otherwise. Learning how the process works explains why the belief is true instead of undermining it. Many beliefs are of this kind: those from memory, from simple arithmetic, from a trusted instrument that has been checked.

      This gives the debunker's burden. To undermine a belief the debunker must show not only a cause, but that the cause is insensitive to the truth, or that it would work equally well for true and false beliefs. The believer's task is the mirror: to show that the process tracks truth or that independent support exists. Both sides are arguing about premises, and neither can claim the cause alone settles it.

  - type: widget
    id: odds-widget
    title: "Watch the odds move"
    widget: odds-updater
    config:
      prior: 0.1
      lr: 9
      priorSlider: false
      presets:
        - { label: "Reliable process: LR 9", lr: 9 }
        - { label: "Weakly sensitive: LR 3", lr: 3 }
        - { label: "Insensitive process: LR 1", lr: 1 }
    body: |
      A toy case. Before taking into account that the belief $B$ seems true to the believer, the prior probability of $B$ is $0.1$. The likelihood ratio (LR) says how many times likelier the seeming is if $B$ is true than if $B$ is false. Press the three presets and watch the orange row (what the seeming adds) and the posterior probability. At LR $=1$ the seeming adds nothing: the posterior falls back to the prior.
    review: false

  - type: numeric
    id: post-reliable
    title: "Odds with a reliable process"
    prompt: |
      Use Bayes' rule in odds form: posterior odds $=$ LR $\times$ prior odds, where odds $=p/(1-p)$ for a probability $p$. A belief $B$ has prior probability $0.2$. The belief seems true to the believer, and the process behind that seeming is reliable, with likelihood ratio LR $=12$ (the seeming is twelve times likelier if $B$ is true than if it is false). What is the posterior probability of $B$?
    answer: 0.75
    tolerance: 0.005
    answerText: '0.75'
    wrong:
      - { value: 2.4, feedback: 'You multiplied the prior probability $0.2$ by $12$. The rule multiplies odds, not probabilities: the prior odds are $0.2/0.8 = 0.25$.' }
      - { value: 3, feedback: 'That is the posterior odds ($12 \times 0.25 = 3$). Convert back with $p = \text{odds}/(1+\text{odds}) = 3/4$.' }
    hint: |
      Prior odds are $0.2/0.8$. Multiply by the LR, then turn odds back into a probability with $p = \text{odds}/(1+\text{odds})$.
    explanation: |
      Prior odds $0.2/0.8 = 0.25$. Posterior odds $= 12 \times 0.25 = 3$. Posterior probability $= 3/(1+3) = 0.75$. A reliable process lifts a belief with prior $0.2$ to $0.75$.

  - type: numeric
    id: post-weak
    title: "Odds after a partial debunking"
    prompt: |
      Same belief $B$ with prior probability $0.2$, and posterior odds $=$ LR $\times$ prior odds (odds $=p/(1-p)$). A causal story now shows the process is only weakly sensitive to the truth, lowering the likelihood ratio from $12$ to LR $=2$. What is the posterior probability of $B$? (Give a decimal; fractions are accepted.)
    answer: 0.3333
    tolerance: 0.005
    answerText: '1/3 ≈ 0.333'
    wrong:
      - { value: 0.2, feedback: 'That is what a full debunking (LR $=1$) would give: the posterior returns to the prior. Here LR is $2$, so something is still added.' }
      - { value: 0.5, feedback: 'You may have used posterior odds $0.5$ as if it were a probability. Odds $0.5$ corresponds to probability $0.5/1.5 = 1/3$.' }
    hint: |
      Prior odds $=0.25$. Multiply by $2$ and convert back to a probability.
    explanation: |
      Prior odds $0.25$. Posterior odds $=2 \times 0.25 = 0.5$. Posterior probability $=0.5/1.5 = 1/3$. The debunking story did not leave the belief at zero or at the prior; it moved it part of the way down, from $0.75$ to about $0.33$. Debunking comes in degrees, and a complete debunking is LR $=1$.

  - type: mcq
    id: validity
    title: "Validity is separate from truth"
    prompt: |
      Take the argument: P1 (the causal story is true), P2 (the process would produce the belief whether or not it is true), P3 (no independent support), C (so the belief is unjustified). Someone adds a further line, C′: "So the belief is false." Which statement is correct?
    options:
      - text: 'C follows from P1-P3 if they are all true (the argument is valid), but C′ does not follow: a belief can be unjustified and still true.'
        correct: true
        feedback: |
          Yes. Validity asks only whether the conclusion follows if the premises are true. Whether the premises are true is a separate question, and it is where the critic and the believer disagree. Reaching C′ would need an extra premise, for instance that the belief is false on other grounds.
      - text: 'Both C and C′ follow, since an unjustified belief is false.'
        feedback: |
          Unjustified does not mean false. A guess that turns out right is a true belief with no justification.
      - text: 'Neither follows, because causes never bear on justification.'
        feedback: |
          They sometimes do: the jammed thermometer shows a cause can remove a belief''s justification. The argument is valid for C, and what remains is whether its premises hold.
    explanation: |
      Keep two questions apart: is the argument valid (does C follow from the premises?) and are its premises true? Replies target the second. And even a sound argument for C leaves open whether the belief is true.

  - type: text
    id: replies
    title: "Two replies, and what they assume"
    body: |
      Believers and others have given two main kinds of reply. The first is to **supply independent support** (P3 fails): arguments or evidence that do not run through the belief-forming process, such as the cosmological, design, moral or religious-experience arguments met in earlier lessons. Critics reply that those arguments are themselves disputed, so the first reply stands or falls with them.

      The second is to **deny P2** by holding that, if the belief is true, the process is how the truth reaches us. According to Alvin Plantinga, in *Warranted Christian Belief* (2000), objections of the Freud-Marx kind are not independent of the question whether Christian belief is true: if it is true, belief in God can be produced by a properly functioning faculty, and then it would have warrant. Kelly James Clark and Justin Barrett argued in a 2010 paper (*Faith and Philosophy*) that research on how minds form belief in superhuman agents fits Plantinga's picture, since God might have produced such tendencies through guided evolution, and that beliefs from such a faculty can be trusted until defeated. Critics, such as Hans Van Eyghen, answer that the tendencies research documents are not specifically the religious beliefs the defenders have in mind.

  - type: mcq
    id: reply-assumes
    title: "What does the second reply assume?"
    prompt: |
      The second reply says: if God exists and the belief is true, the process of belief formation can be a truth-tracking process, so P2 is false. A critic answers that this reply assumes what is in dispute. What exactly does the reply assume, and what can its defender say back?
    options:
      - text: 'It assumes that the belief is true (that God exists), since the process only tracks truth if there is something to track. The defender answers that P2 assumes the opposite: that the belief is false or that no such process exists.'
        correct: true
        feedback: |
          Yes. Whether the process is truth-tracking depends on whether the belief is true, so the dispute moves back to that question, as Plantinga argued. The debunker's side can say that this leaves the believer with only conditional comfort: if true, then the process is fine. Neither side has a neutral way to decide, apart from independent support for or against.
      - text: 'It assumes that science is unreliable.'
        feedback: |
          The reply accepts the science of how belief forms. It disagrees with the claim that the process is truth-blind, which depends on what is true.
      - text: 'It assumes nothing; it is a pure logical point.'
        feedback: |
          The logic is fine: if the belief is true, a process can track it. But the reply uses a premise about what is true, and that is the premise under debate.
    explanation: |
      This is a point on which thoughtful people part ways: for the believer, the truth of the belief cannot be left out of the question; for the critic, a good argument must not assume it. The part left to settle is independent support.

  - type: text
    id: street
    title: "Not only religion"
    body: |
      The same shape of argument is used far beyond religion. Sharon Street's article "A Darwinian Dilemma for Realist Theories of Value" (*Philosophical Studies*, 2006) argued about moral and other evaluative beliefs. In her argument, evolution strongly shaped our evaluative judgments. A realist about value holds that there are moral facts independent of what anyone thinks. Street argues that realists face a dilemma. Either they say evolution's influence on our judgments has no relation to those independent facts, which makes it a coincidence if our judgments are right (a skeptical result). Or they say evolution selected us for tracking those facts, which she argues is scientifically implausible. Many replies exist; one holds that a process can be reliable even when it was not selected for tracking.

      Notice that P2 appears here too: the causal story would have produced these beliefs whether or not there are independent moral facts. So the argument is not about religion. It is about any belief with a natural cause.

  - type: mcq
    id: symmetry
    title: "A teaser: who else is exposed?"
    prompt: |
      Suppose a debunking argument against religious belief works as stated: a natural cause, and no independent support. A thoughtful reader asks whether the same shape could be run against other beliefs, including the belief that there is no God (atheism), since that belief also has natural causes. What must be checked before concluding anything?
    options:
      - text: 'The same three premises, applied to the other belief: is there a causal story, would the process produce the belief whether or not it is true, and is there independent support?'
        correct: true
        feedback: |
          Yes. The argument is a template. It does not favour either side; whoever uses it has to apply it to every belief, their own included. The next lesson does that for belief and unbelief.
      - text: 'Nothing: atheism has no causes because it is the absence of belief.'
        feedback: |
          Researchers study causes of unbelief just as they study causes of belief (for example the roles of analytic thinking and of cultural context), and some views of atheism hold positive claims, such as that no gods exist. Either way, the template can be applied.
      - text: 'Nothing: any belief with a natural cause is false.'
        feedback: |
          That is the genetic fallacy again, and it would sweep away every belief, including the debunker''s own.
    explanation: |
      A fair test of the argument is that it can be applied consistently. If it works only in one direction, it is not an argument but a preference.

  - type: text
    id: layers
    title: "Three layers"
    body: |
      Established fact: people hold beliefs through causes such as upbringing, mental tendencies and group life; and a cause alone does not show a belief false, since true beliefs have causes too.

      Live debate: whether a given causal story is truth-blind (P2), whether independent support exists (P3), and whether replies such as "if true, the process is reliable" assume what is in dispute. Thoughtful people part ways on which premise carries the weight, on what counts as independent support, and on what a neutral starting point would be.

      Faith or metaphysical commitment: whether the belief itself is true. No causal story, by itself, settles that.

  - type: text
    id: summary
    body: |
      **Next:** The Same Argument Against Atheism. If the debunking argument is a template, it should apply to unbelief and to moral intuitions as well. The next lesson asks whether it does, and what that does to the argument.
