id: ch13-origins
title: "Where Religion Comes From"
kind: concept
own: |
  The setting: archaeologists and anthropologists ask how early religion can be known, using what survives (graves, carvings, buildings) and what living hunter-gatherer peoples say and do. Every step from object to belief is an inference, so each claim comes with the school or study that makes it.
  - **From object to belief.** An object shows a belief only after three separate steps: the act was deliberate, it was not merely practical, and it carried a meaning of a belief kind. {{ Each step can fail on its own }}, so the chain is only as strong as its weakest link.
  - **Neanderthal burial.** According to Rendu and colleagues (2014), the La Chapelle-aux-Saints skeleton lay in a modified pit and was covered fast; according to Dibble and colleagues (2015) the same evidence is ambiguous. According to Hunt and colleagues (2023), the pollen at the Shanidar 4 burial in Iraq is better explained by {{ burrowing bees }} than by flowers laid on the dead. Both sides agree that burial itself does not reveal what, if anything, the mourners believed.
  - **Early art.** The Lion-man of Hohlenstein-Stadel (a Swabian ivory figure, about 31 cm, a human body with a lion's head) is about 40,000 years old, and Chauvet cave paintings about 36,000. Both show that people imagined and made images of beings not seen in nature. The gap in years between two finds with dates $t_1>t_2$ (years before now) is
  {{ $$\Delta t = t_1 - t_2$$ }}
  so the Lion-man precedes Göbekli Tepe (about 11,500 years ago) by about $28{,}500$ years.
  - **Göbekli Tepe.** According to Klaus Schmidt (1953-2014), the T-shaped limestone pillars (up to about 5.5 m high, many with animal reliefs) of Göbekli Tepe in southeastern Turkey, built from about 9500 BCE, were a ritual centre built by hunter-gatherers before farming was established. Others hold that people also lived there, so the site was {{ a settlement with a strong ritual side }}.
  - **Hunter-gatherer religion.** According to Tylor (1871), animism, belief in spiritual beings, is the minimal religion; according to Bird-David (1999), among the Nayaka of South India it is a way of knowing through relations with beings of the environment. According to Peoples, Duda and Marlowe (2016), in a sample of $N=33$ hunter-gatherer societies, animism is the oldest trait and gods active in human affairs were absent in early humans. If a trait occurs in a fraction $p$ of $N$ societies, the expected count is
  $$n \approx pN,$$
  so $p=0.15$ gives about 5 societies.
  - **Three layers.** That ritual, burial and art are old is established where dated; whether they show belief, and which belief, is a live debate among archaeologists; whether any such belief is true is a faith or metaphysical commitment that no dig can settle.
cards:
  - type: mcq
    id: hook
    title: "Guess: who built the first temple?"
    prompt: |
      Guessing is the point; no theory yet. In southeastern Turkey, archaeologists dig out rings of huge carved limestone pillars, the tallest more than 5 metres high, many carved with foxes, boars, snakes and other animals. Each pillar was cut, shaped and raised by hand with stone tools. Which description of the builders fits the dating best?
    options:
      - text: 'Farmers of a large kingdom, with metal tools, about 3,000 years ago.'
        feedback: |
          This is how the monuments of later kingdoms were built, so it is the natural first guess. But the site is far older: it was begun before metal tools and before large states existed.
      - text: 'People living about 11,500 years ago, in a world of foragers who, as far as the evidence shows, had not yet made farming their way of life.'
        correct: true
        feedback: |
          Yes. The site is Göbekli Tepe, and the surprise is the order of events: monumental building seems to come early, not only after farming and cities.
      - text: 'Nobody, because the pillars are natural rock formations.'
        feedback: |
          The pillars were cut and carved: they have T-shaped heads, carved arms and animal reliefs, which no natural process makes.
    explanation: |
      The lesson asks a plain question with a hard answer: how can we know anything about what people believed before writing? We start at this site, then move to graves, early art and living hunter-gatherers.

  - type: text
    id: gobekli
    title: "Göbekli Tepe"
    image:
      src: img/gobekli-pillar.webp
      alt: "A T-shaped limestone pillar at Göbekli Tepe, with a carved animal and a stylised arm"
      caption: "A T-shaped pillar at Göbekli Tepe: the shaft is read as a body (some pillars carry carved arms and hands) and the top as a head."
      credit: "Zhengan, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:G%C3%B6bekli_Tepe_Pillar.JPG"
    body: |
      **Göbekli Tepe** ("Potbelly Hill" is a common rendering; the name is Turkish) lies about 15 km from Şanlıurfa in southeastern Turkey. According to the German Archaeological Institute, it dates from about 9500 calBC to about 8000 calBC, and its T-shaped pillars are up to about 5.5 m high. UNESCO inscribed it in 2018, describing it as one of the first manifestations of human-made monumental architecture.

      The German archaeologist Klaus Schmidt (1953-2014) began work there in the mid-1990s and read it as a ritual centre where bands of hunter-gatherers gathered for building projects and feasts, which popular writers called the "world's first temple". The monumental complex shows no clear evidence of agriculture.

      Since Schmidt's death, other scholars and the later digs have argued that people also lived at the site: findings published in 2019 point to domestic structures, cereal processing and a water supply. The German Archaeological Institute now describes it as a settlement with a pronounced ritual component.

  - type: mcq
    id: temple-q
    title: "Temple or village?"
    prompt: |
      At Göbekli Tepe, one reading (Klaus Schmidt's) calls the site a ritual centre built by foragers. A later reading says people also lived there, with houses, grinding stones and a water supply. What does the second finding do to the first reading?
    options:
      - text: 'It refutes it: a place where people lived cannot have been a ritual site.'
        feedback: |
          Living and ritual do not exclude each other: many villages have a shrine, and many shrines have a village. The finding changes the picture, it does not erase the ritual side.
      - text: 'It changes what "ritual centre" can mean: the monuments may have been the ritual part of a community that also lived there, and the strong claim of a site used only for worship loses support.'
        correct: true
        feedback: |
          Yes. The evidence of the carvings and the effort of building still point to something beyond daily needs. What shrank is the claim that nobody lived there.
      - text: 'It confirms it, since people who gather must have had a religion.'
        feedback: |
          Gathering and building together can be explained in more than one way, so this is circular. The carvings and the scale are the real evidence for ritual, not the gathering itself.
    explanation: |
      Notice the pattern: the first reading arose from the monuments, the second from digging the ordinary parts of the site. More digging changed the story, which is how this field works.

  - type: text
    id: ladder
    title: "From an object to a belief"
    body: |
      Before moving on, it helps to say how an archaeologist could ever pass from a thing in the ground to a belief in a mind. Three steps are needed, and each can fail on its own.

      **Deliberate.** The arrangement was done on purpose, not made by water, animals or a landslide. **Not merely practical.** The act had no everyday use, or cost more than the use would need (burying a body can be sanitary, building a wall can be defence). **A belief kind of meaning.** It points to something the people took to be beyond the ordinary: spirits, an afterlife, a being.

      These three steps are this lesson's working test, not a quotation of any one scholar. Archaeologists differ on how strong the evidence must be at each step, and that difference runs through everything that follows.

  - type: order
    id: ladder-order
    title: "The ladder, in order"
    prompt: |
      Put the steps in the order in which an archaeologist would need to establish them before saying that a burial shows a belief in an afterlife.
    steps:
      - 'A body lies in a hollow that was dug on purpose and covered soon after death.'
      - 'The hollow and the covering are not explained by hygiene or by hiding the body from animals.'
      - 'Objects or a pattern in the grave carry meanings that point beyond this life.'
      - 'So the people probably believed that the dead continue in some way.'
    hint: First the act, then its purpose, then its meaning, and only then the belief.
    explanation: |
      Each line leans on the one before it. Skipping the second step is the common slip: a deliberate pit shows care, which a practical motive could also explain. The later cards show where each case stands.

  - type: text
    id: shanidar
    title: "Neanderthal burial: the flowers of Shanidar"
    body: |
      Neanderthals lived in Europe and western Asia until about 45,000 years ago. In Shanidar cave in Iraq the skeleton called Shanidar 4 was found in 1960 by Ralph Solecki's team. Soil samples sent to France were studied by Arlette Leroi-Gourhan, who reported in 1975 clusters of pollen from several plants. The popular conclusion, the "flower burial", was that mourners laid flowers on the dead, which would show care and perhaps belief.

      In 2023 a team led by Chris Hunt (Liverpool John Moores University) argued in the *Journal of Archaeological Science* that burrowing bees, which store pollen in clumps, were a better explanation. The pollen could be ancient, but the bees do away with the evidence of a deliberate act. Hunt's team still suggests that the positions and timing of several bodies show Neanderthals returning to bury their dead in the same place over time.

  - type: mcq
    id: shanidar-q
    title: "What the bee reading changes"
    prompt: |
      A 1975 report found clusters of pollen around a Neanderthal skeleton, read as flowers laid on the body. A 2023 study proposes that burrowing bees brought the pollen. Which statement is best supported by both studies together?
    options:
      - text: 'Neanderthals never buried their dead.'
        feedback: |
          The bee reading does not say this. It concerns only the pollen. The team still thinks the repeated placing of bodies in one spot suggests burial customs.
      - text: 'The step from pollen to deliberate flower-laying is no longer safe, so the case for a belief now rests on other evidence, such as the placement of the dead.'
        correct: true
        feedback: |
          Yes. The first rung of the ladder (deliberate) is weakened for the flowers, though not for the burial itself. And even a deliberate burial does not by itself say what the mourners believed.
      - text: 'The flowers were real, so the Neanderthals must have believed in an afterlife.'
        feedback: |
          This jumps two rungs at once. Even if flowers had been laid on the body, it would show care for the dead; whether it showed belief in an afterlife is a further question.
    explanation: |
      A critic of the bee reading points out that neither pollen nor bees can be dated directly, so it remains an interpretation too. Both sides agree that something about the way the dead were treated is worth explaining.

  - type: text
    id: chapelle
    title: "Another test case: La Chapelle-aux-Saints"
    body: |
      At La Chapelle-aux-Saints in France, a Neanderthal skeleton was found in 1908. In 2014 Rendu and colleagues, after new fieldwork between 1999 and 2012, argued in the *Proceedings of the National Academy of Sciences* that the body lay in a pit that had been modified and was covered soon after death, since the bones show little weathering and no sign of animal damage. They wrote that they cannot know whether the practice was ritual or merely practical.

      In 2015 Dibble and colleagues replied in the *Journal of Archaeological Science* that the evidence either fails these criteria or fits other interpretations equally well, and called the case ambiguous at best.

  - type: mcq
    id: chapelle-q
    title: "Reading the exchange"
    prompt: |
      Rendu and colleagues (2014) say a Neanderthal body was deliberately buried but that burial may have been practical rather than ritual. Dibble and colleagues (2015) say the evidence is ambiguous even about deliberate burial. Which rung of the ladder (deliberate, not merely practical, belief kind of meaning) does each side dispute?
    options:
      - text: 'Rendu and colleagues accept deliberate burial and leave open whether it was more than practical; Dibble and colleagues question even the first rung.'
        correct: true
        feedback: |
          Yes. Their disagreement is about the first rung, and both leave the third rung (what it meant) unreached.
      - text: 'Both dispute only the third rung, the belief kind of meaning.'
        feedback: |
          Dibble and colleagues dispute whether the burial was deliberate at all, which is the first rung.
      - text: 'Rendu and colleagues claim a belief in an afterlife; Dibble and colleagues deny it.'
        feedback: |
          Rendu and colleagues made no such claim: they wrote that the practice might be merely pragmatic. The dispute is lower down the ladder.
    explanation: |
      A reader who wants to say that Neanderthals had religion needs all three rungs. At present the evidence reaches the first for some sites and is contested for others.

  - type: text
    id: art
    title: "Early art: beings that nobody had seen"
    image:
      src: img/lion-man.webp
      alt: "The Lion-man figurine from Hohlenstein-Stadel cave, a carved ivory figure with a human body and a lion's head"
      caption: "The Lion-man of Hohlenstein-Stadel, carved from mammoth ivory about 40,000 years ago and reassembled from more than 200 fragments; it is displayed in the Ulm Museum."
      credit: "Thilo Parg, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Loewenmensch2.jpg"
    body: |
      The Upper Palaeolithic is the last part of the Old Stone Age, when modern humans lived in Europe. Two famous finds come from it. The **Lion-man** of Hohlenstein-Stadel cave in Germany, about 31 cm tall, joins a human body to a lion's head; it is about 40,000 years old and is among the oldest known figurative art. And the **Chauvet cave** in France, with over 1,000 drawings of animals, dates to about 36,000 years ago; UNESCO inscribed it in 2014.

      The Lion-man is a creature that nobody could have seen in nature. According to many archaeologists, that suggests a mind able to combine things it knows into something that does not exist, which is one of the abilities religion seems to use. According to others, we cannot say what the figure meant to its makers: a spirit, a story, a hunter's dream or a joke are all possible.

  - type: mcq
    id: art-q
    title: "What the Lion-man can show"
    prompt: |
      A carved figure from about 40,000 years ago has a human body and a lion's head. Which conclusion goes no further than the evidence?
    options:
      - text: 'Its makers worshipped a lion god.'
        feedback: |
          Worship is a claim about practice and belief, and nothing in the figure tells us that people prayed to it. Many other roles are possible.
      - text: 'Its makers could imagine and make an image of a being that does not occur in nature.'
        correct: true
        feedback: |
          Yes. This is the first rung only: the figure was made on purpose and combines two kinds of creatures. What it meant stays open.
      - text: 'Its makers had no religion, since there is no written text with it.'
        feedback: |
          Absence of writing is not evidence of absence of belief: writing came tens of thousands of years later in all cases we know.
    explanation: |
      Layered claims again: that the figure was made, and when, is established; that it was religious is a debate; what it meant is not recoverable from the figure alone.

  - type: numeric
    id: gap
    title: "How far apart in time?"
    prompt: |
      The Lion-man is about 40,000 years old. Göbekli Tepe's pillars were raised about 11,500 years ago. How many years before Göbekli Tepe was the Lion-man carved?
    answer: 28500
    tolerance: 600
    answerText: '28,500'
    wrong:
      - { value: 51500, feedback: 'That adds the two ages. Both are measured back from now, so the gap between two events is the difference.' }
    hint: Both numbers count years back from today, so the gap is a difference.
    explanation: |
      $40{,}000-11{,}500=28{,}500$ years. This is more than twice the age of Göbekli Tepe itself: the people who raised the pillars were much closer in time to us than to the maker of the Lion-man, so image-making and, perhaps, ritual are far older than monuments.

  - type: text
    id: animism
    title: "Living hunter-gatherers as a window"
    body: |
      A second source of evidence is living peoples who still hunt and gather. The anthropologist Edward Tylor (1832-1917), in *Primitive Culture* (1871), proposed as a minimum definition of religion the belief in spiritual beings, and called the simplest form of it **animism**: the idea that the world is full of beings with spirit, not only humans.

      Tylor treated animism as a mistaken first attempt at explaining dreams and death. Nurit Bird-David, working with the Nayaka of South India (fieldwork in 1978-79), argued in 1999 in *Current Anthropology* that this misreads it: among the Nayaka, animism is a way of knowing through relations, in which beings of the environment are treated as persons one shares a life with, so it is a relational way of knowing and not a failed theory.

  - type: mcq
    id: animism-q
    title: "Two readings of animism"
    prompt: |
      A forager says a river is a person to be asked and thanked. According to Tylor (1871), what is this? According to Bird-David (1999), what is it?
    options:
      - text: 'Tylor: an early attempt to explain the world through spirit beings. Bird-David: a way of knowing through relations with beings one lives among.'
        correct: true
        feedback: |
          Yes. They agree that the belief is widespread among hunter-gatherers; they disagree on whether it is a mistake in explaining nature or a different, relational way of knowing.
      - text: 'Tylor: a relational way of knowing. Bird-David: a primitive error.'
        feedback: |
          This swaps them. Bird-David wrote against the view that animism is a failed explanation, which is Tylor's.
      - text: 'Both: proof that spirits exist.'
        feedback: |
          Neither makes this claim. Both are describing the belief, not arguing for it.
    explanation: |
      Where thoughtful people part ways: whether to treat such beliefs as a theory about causes (to be tested against science) or as a practice of relationship (which does not compete with science in the same way).

  - type: text
    id: peoples
    title: "A statistical look"
    body: |
      In 2016 Hervey Peoples, Pavel Duda and Frank Marlowe published "Hunter-Gatherers and the Origins of Religion" in *Human Nature*. They coded 33 hunter-gatherer societies for seven religious traits: animism, belief in an afterlife, shamanism, ancestor worship, high gods (a creator or supreme being), and two "active" versions, active ancestor worship and active high gods, those who intervene in human affairs.

      Using an evolutionary tree of the societies, they concluded that animism is the oldest trait, present in the common ancestor of today's hunter-gatherers, that belief in an afterlife came next, followed by shamanism and ancestor worship, and that gods active in human affairs were absent in early humans. They found active high gods in only about 15% of the sample. They note that living foragers are not copies of ancient ones.

  - type: numeric
    id: peoples-q
    title: "Counting societies"
    prompt: |
      In a sample of 33 hunter-gatherer societies, about 15% have active high gods (a supreme being who intervenes in human affairs). About how many societies is that? Round to a whole number.
    answer: 5
    tolerance: 0.5
    answerText: '5'
    hint: A fraction of a total is the fraction times the total.
    explanation: |
      $0.15\times33=4.95$, so about 5 societies. A sample this small means a change of one society moves the share by about 3 points, so the percentage should be read loosely.

  - type: mcq
    id: window-q
    title: "How far can the window be trusted?"
    prompt: |
      A critic says: "Living hunter-gatherers tell us what religion was like 100,000 years ago." What is the best reply?
    options:
      - text: 'They are the same as ancient peoples, so the critic is right.'
        feedback: |
          Living foragers have had as many thousands of years of change as anyone, and many have been in contact with farmers, traders and missionaries.
      - text: 'They are a useful comparison for what egalitarian foraging societies tend to have, but not a record of the past; the inference to ancestors must be argued and stays uncertain.'
        correct: true
        feedback: |
          Yes. The authors of the 2016 study say the same: living foragers are a window into traits that fit that way of life, not copies of ancient groups.
      - text: 'They tell us nothing about the past, so the comparison should be dropped.'
        feedback: |
          Too strong: when the same trait appears across many separate groups, that is evidence worth weighing. The caution is about the strength of the conclusion, not about dropping the evidence.
    explanation: |
      A supporter of the method replies that tracing traits on an evolutionary tree is built exactly to separate shared ancestry from chance, and a critic that the tree and the coding choices carry assumptions of their own.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    prompt: |
      Sort three claims. (a) Göbekli Tepe was begun about 9500 BCE. (b) The builders of Göbekli Tepe held beliefs about spirits or ancestors. (c) Such beliefs are true. Which sorting fits the three layers?
    options:
      - text: '(a) established by dating methods, (b) a live debate among archaeologists, (c) a faith or metaphysical commitment.'
        correct: true
        feedback: |
          Yes. A date is a result with error bars; whether carvings show belief rests on how much meaning we read into them; and truth of the belief is beyond what archaeology can test.
      - text: '(a) a live debate, (b) established, (c) a live debate.'
        feedback: |
          The date is a measurement, and (b) is exactly what is under dispute, since the ladder from carving to belief is long.
      - text: '(a), (b) and (c) are all established, since the site is real.'
        feedback: |
          That a site is real says nothing about what its builders believed or whether they were right.
    explanation: |
      Notice that explaining where a belief came from, the subject of the rest of this level, leaves the question of its truth to be settled elsewhere.

  - type: text
    id: summary
    body: |
      **Next:** Minds Built to See Agents. We have asked where religion shows in the ground and among foragers; the next lesson asks what in the human mind makes beliefs in spirits and gods so easy to form, starting with a rustle in the grass and the question of why we first suspect someone, not something.
