id: ch13-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: scholars ask where religious belief comes from (evolution, cognition, culture), what rituals do for communities, and whether such causal stories undermine the belief. Every answer below is *according to* some school or study.
  - **Debunking template.** For a belief $B$ and a causal story $S$: P1, $S$ is the real cause; P2, $S$ would give the belief {{ whether or not $B$ is true }}; P3, no independent support. Conclusion C: the belief is {{ unjustified, not false }}. The same template applies to belief and to unbelief.
  - **Odds form of Bayes' rule.** Let $E$ be the fact that $B$ seems true to the believer. With likelihood ratio $\text{LR} = P(E\mid B)/P(E\mid\neg B)$:
  {{ $$\frac{P(B\mid E)}{P(\neg B\mid E)} = \text{LR}\cdot\frac{P(B)}{P(\neg B)}$$ }}
  A fully truth-blind process has $\text{LR}=1$, so the odds return to the prior.
  - **Agency detection.** With $p$ the chance a rustle is an agent, $C_{\text{miss}}$ the cost of ignoring a real agent and $C_{\text{alarm}}$ the cost of reacting to nothing, reacting is the better policy when
  {{ $$p > \frac{C_{\text{alarm}}}{C_{\text{alarm}}+C_{\text{miss}}}$$ }}
  - **Costly signal.** With benefit of acceptance $b$, cost $c_C$ for a committed member and $c_F$ for a faker, a ritual sorts the two when
  {{ $$c_C < b < c_F$$ }}
  - **Who says what.** According to Durkheim, ritual binds the group; Malinowski, magic grows with danger; Geertz, religion is a system of symbols giving meaning; van Gennep and Turner, passage runs separation, liminality (the margin), incorporation; Rappaport, ritual is fixed form; Whitehouse, a doctrinal and an imagistic mode.
  - **Three layers.** Data and history are established; which explanation wins is a live debate; whether a god exists is a faith or metaphysical commitment.

cards:
  - type: text
    id: welcome
    title: "Quick recall: why humans believe"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: the three layers of a claim, the debunking argument and the odds form of Bayes' rule, agency detection as a cost balance, costly signals, by-product against adaptation, three readings of secularisation, and the schools of ritual.

      Three kinds of card: **mnemonics**, **build and order cards**, and **numeric cards that give you data only**: you choose the rule yourself.

      As always, every answer is *according to* someone or some view. Nothing here asks whether any god exists.

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Every claim in this level sits in one of three layers: **established fact**, **live scholarly debate**, or **faith or metaphysical commitment**. Which assignment is right for these three claims? (a) Human minds flag ambiguous rustles as agents in experiments (a mechanism). (b) Religion was selected because it helped groups (a function). (c) A god exists (a worldview).
    options:
      - text: '(a) established, (b) live debate, (c) faith or metaphysical commitment.'
        correct: true
      - text: '(a) live debate, (b) established, (c) faith or metaphysical commitment.'
        feedback: |
          Swapped. Experiments on agency detection are replicated findings, while whether religion was shaped by selection for group benefit is disputed between adaptation, by-product and mixed views.
      - text: '(a) established, (b) established, (c) live debate.'
        feedback: |
          Whether a god exists is not settled by any study of how belief arises, so it is a commitment, not a scholarly debate about data. And (b) is disputed.
      - text: 'All three are established, since all three can be studied.'
        feedback: |
          A claim can be studied and still be open. Only the data and history are established; the explanation is debated; the truth about a god is a commitment.
    explanation: |
      Mnemonic: **fact, debate, commitment**: what happened, why it happened, what it means. Never pass a commitment off as a fact, in either direction.

  - type: build
    id: debunk-build
    title: "The debunking argument"
    prompt: |
      A debunking argument against a belief $B$, using a causal story $S$ of how people come to hold it, has three premises and a conclusion. Build it in order: the real cause, then the process that would give the belief anyway, then the missing support, then the conclusion.
    tiles: ['\text{P1: S is the real cause}', '\text{P2: S gives B whether or not true}', '\text{P3: no independent support}', '\text{C: B is unjustified}', '\text{C: B is false}', '\text{P2: S tracks the truth}']
    answers:
      - ['\text{P1: S is the real cause}', '\text{P2: S gives B whether or not true}', '\text{P3: no independent support}', '\text{C: B is unjustified}']
    wrong:
      - answer: ['\text{P1: S is the real cause}', '\text{P2: S gives B whether or not true}', '\text{P3: no independent support}', '\text{C: B is false}']
        feedback: |
          The argument can at most show the belief is unjustified. Whether $B$ is false needs separate reasons: true beliefs have causes too, and rejecting a belief only for its origin is the genetic fallacy.
    hint: 'The conclusion is about justification, not about truth.'
    explanation: |
      Mnemonic: **cause, blind, bare, so unjustified**. It fails if the process tracks the truth (P2 fails) or if independent support exists (P3 fails). The template applies equally to belief and to unbelief.

  - type: mcq
    id: lr-one
    title: "Limit check: a blind process"
    prompt: |
      A person starts with a prior probability $0.2$ that a belief $B$ is true. A causal story shows the process behind the belief would have produced it whether or not $B$ is true, so the likelihood ratio $\text{LR}=P(E\mid B)/P(E\mid\neg B)$ equals $1$. What is the probability of $B$ after this evidence $E$?
    options:
      - text: 'Still $0.2$: the odds are multiplied by $1$, so the prior is unchanged.'
        correct: true
      - text: '$0$: a blind process shows the belief is false.'
        feedback: |
          A blind process makes the belief's seeming truth uninformative; it does not count against $B$. Only the prior remains, which is not zero.
      - text: '$0.5$: with no information we say fifty-fifty.'
        feedback: |
          No new information does not erase the prior. The prior $0.2$ stays. Fifty-fifty would need prior odds of $1$.
      - text: '$0.75$.'
        feedback: |
          That is the answer for $\text{LR}=12$: prior odds $0.25$ times $12$ give odds $3$, which is probability $0.75$. With $\text{LR}=1$ nothing is gained.
    explanation: |
      Limit check: $\text{LR}=1$ leaves the odds unchanged, and $\text{LR}>1$ raises them (prior $0.2$ with $\text{LR}=12$ gives $0.75$). A full debunking story pushes $\text{LR}$ toward $1$, not toward $0$.

  - type: build
    id: hadd-build
    title: "Agency detection as a cost balance"
    prompt: |
      A rustle is an agent with probability $p$. Ignoring a real agent costs $C_{\text{miss}}$; reacting to nothing costs $C_{\text{alarm}}$. Reacting wins once its expected cost $(1-p)C_{\text{alarm}}$ drops below the cost of ignoring, $p\,C_{\text{miss}}$. Build the break-even probability $p^*$.
    prefix: 'p^* ='
    tiles: ['\frac{C_{\text{alarm}}}{C_{\text{alarm}}+C_{\text{miss}}}', '\frac{C_{\text{miss}}}{C_{\text{alarm}}+C_{\text{miss}}}', '\frac{C_{\text{alarm}}}{C_{\text{miss}}}', '\frac{C_{\text{alarm}}+C_{\text{miss}}}{C_{\text{alarm}}}']
    answers:
      - ['\frac{C_{\text{alarm}}}{C_{\text{alarm}}+C_{\text{miss}}}']
    wrong:
      - answer: ['\frac{C_{\text{miss}}}{C_{\text{alarm}}+C_{\text{miss}}}']
        feedback: |
          Swapped. When a miss is very costly, the threshold should be small (react to faint signs). This version grows with $C_{\text{miss}}$, which is backwards.
    hint: 'Set $p\,C_{\text{miss}} = (1-p)\,C_{\text{alarm}}$ and solve for $p$. Costly misses must push the threshold down.'
    explanation: |
      Scaling check: if $C_{\text{miss}}\gg C_{\text{alarm}}$ the threshold is tiny, so a detector that is wrong most of the time is still the best policy. This is the by-product camp's starting point; it says nothing about whether the beliefs it produces are true.

  - type: build
    id: signal-build
    title: "The costly-signal window"
    prompt: |
      A ritual costs $c_C$ to a committed member and $c_F$ to a faker, and acceptance into the group is worth $b$. Assemble the condition under which the ritual sorts the two types: committed members find it worth paying, fakers do not.
    tiles: ['c_C', '<', 'b', '<', 'c_F', '>']
    answers:
      - ['c_C', '<', 'b', '<', 'c_F']
    wrong:
      - answer: ['c_F', '<', 'b', '<', 'c_C']
        feedback: |
          This would need the faker's cost to be the lower one. A costly signal works because it costs a committed member little and a faker much.
    hint: 'The benefit must be above the committed member''s cost and below the faker''s cost.'
    explanation: |
      Mnemonic: **the benefit sits in the window between the two costs**. If $b$ rises past $c_F$, fakers also find the signal worth paying and it stops sorting; if $b$ falls below $c_C$, nobody pays.

  - type: mcq
    id: origin-stories
    title: "By-product, adaptation or both"
    prompt: |
      Three views of why religion exists: (1) it is a side effect of mental tools that evolved for other jobs (agency detection, theory of mind); (2) it was itself selected for what it does for groups; (3) the tools were by-products but culture then shaped religion for group benefit. Which attribution is right?
    options:
      - text: '(1) Boyer and Atran; (2) D. S. Wilson; (3) a mixed view.'
        correct: true
      - text: '(1) D. S. Wilson; (2) Boyer and Atran; (3) a mixed view.'
        feedback: |
          Swapped. Wilson holds that religion was selected for what it does for groups (adaptation); Boyer and Atran treat it as a by-product.
      - text: '(1) and (2) are the same view, since both are about evolution.'
        feedback: |
          Both use evolution, but they differ on what was selected: the mental tools for other jobs, or religion itself.
      - text: '(3) is excluded, because the two stories cannot be combined.'
        feedback: |
          They can be combined: by-product tools may be shaped by cultural selection into practices that help groups.
    explanation: |
      Mnemonic: **by-product = the tools, adaptation = the religion, both = tools then culture**. Which one is right is a live debate.

  - type: mcq
    id: secular-three
    title: "Three readings of secularisation"
    prompt: |
      Religion has declined in some countries and risen in others. Which pairing of reading and author is right?
    options:
      - text: 'Existential security (Norris and Inglehart): belief stays high where life is vulnerable. Supply (Stark and Finke): participation is high where many churches compete. Pluralism (Berger, 1967): many faiths side by side weaken the taken-for-granted status of each.'
        correct: true
      - text: 'Existential security (Berger): many faiths weaken each other. Supply (Norris and Inglehart): poverty keeps belief high. Pluralism (Stark and Finke): competition lowers participation.'
        feedback: |
          Scrambled. Stark and Finke argue competition raises participation, and poverty and danger are the Norris-Inglehart security story.
      - text: 'All three say science disproves religion, in different words.'
        feedback: |
          None of the three says that. They give social causes (safety, market supply, loss of the taken-for-granted) that leave the question of truth untouched.
      - text: 'Berger (1967) held modernity must secularise, and never changed his mind.'
        feedback: |
          Berger withdrew that claim in 1999 and spoke of a resurgent religion in much of the world, while still noting that pluralism challenges belief.
    explanation: |
      Mnemonic: **safety, supply, plausibility**. Each fits some data; which explains most is a live debate.

  - type: numeric
    id: r-squared
    title: "How much does a correlation explain?"
    prompt: |
      Across 31 studies, the correlation between analytic thinking style and religious belief is $r=-0.18$. What percentage of the variation in belief does this share with analytic style? Round to one decimal place.
    answer: 3.2
    tolerance: 0.1
    answerText: '3.2'
    wrong:
      - { value: 18, feedback: 'That reads $r$ itself as a percentage. A correlation of $0.18$ is not $18\%$ of the variation: the shared share is measured on a squared scale.' }
      - { value: -3.2, feedback: 'The sign of $r$ shows direction only. A share of variation cannot be negative.' }
    hint: 'The share of variation in common is the correlation squared, as a percentage.'
    explanation: |
      $0.18^2=0.0324$, about $3.2\%$. A modest correlation explains little, so by itself it cannot show that a process is truth-blind, in either direction.

  - type: mcq
    id: schools
    title: "Who said what about ritual"
    prompt: |
      Match each anthropologist to the main idea: Durkheim, Malinowski, Geertz, Turner, Rappaport, Whitehouse.
    options:
      - text: 'Durkheim: ritual binds the group. Malinowski: magic grows with danger and uncertainty. Geertz: a system of symbols giving meaning. Turner: the margin (liminality) and communitas. Rappaport: fixed form. Whitehouse: doctrinal and imagistic modes.'
        correct: true
      - text: 'Durkheim: danger. Malinowski: binding the group. Geertz: fixed form. Turner: symbols. Rappaport: the margin. Whitehouse: effervescence.'
        feedback: |
          Scrambled. Collective effervescence and binding are Durkheim; danger and uncertainty are Malinowski; fixed form is Rappaport.
      - text: 'All six say ritual is only a mistaken belief about nature.'
        feedback: |
          These schools ask what ritual does for people (bind, comfort, mean, transition, stabilise), whatever one thinks of its claims about the world.
      - text: 'Only Durkheim treats ritual as a social matter.'
        feedback: |
          Malinowski, Turner and Whitehouse also study ritual in social terms: uncertainty in a community, the status transitions of its members, the way traditions are transmitted.
    explanation: |
      Mnemonic: **binds, danger, meaning, margin, form, modes**: Durkheim, Malinowski, Geertz, Turner, Rappaport, Whitehouse. The answers can be compared rather than ranked.

  - type: order
    id: passage-order
    title: "The three phases of a rite of passage"
    prompt: |
      According to van Gennep, a rite of passage moves a person from one social status to another. Put its three phases in order.
    steps:
      - 'Separation: the person leaves the old status and place.'
      - 'Liminality (the margin): the person is between statuses, and ordinary ranks are loosened.'
      - 'Incorporation: the person is received into the new status.'
    hint: 'Leave, in between, arrive.'
    explanation: |
      Turner studied the middle phase and named the bond that can form there **communitas**. Mnemonic: **leave, margin, arrive**.

  - type: numeric
    id: signal-numbers
    title: "A signal with new costs"
    prompt: |
      A group asks members to undergo a ritual. A committed member counts its cost as $3$ units and a faker counts it as $11$ units. Acceptance is worth a whole number of units $b$ to everyone. What is the largest whole number $b$ for which the ritual still sorts committed members from fakers?
    answer: 10
    answerText: '10'
    wrong:
      - { value: 11, feedback: 'At $11$ a faker is exactly indifferent, so the ritual no longer keeps fakers out. The benefit must be strictly below the faker''s cost.' }
      - { value: 3, feedback: 'That is the committed member''s cost, the lower end. The benefit must be above it, and the question asks for the largest value that still works.' }
    hint: 'Committed members must find acceptance worth the cost, and fakers must not. Find the window and take its top.'
    explanation: |
      Committed members pay if $b>3$; fakers decline if $b<11$. So $3<b<11$, and the largest whole number inside is $10$. At $b=11$ or more, fakers pay too and the signal no longer separates the types.

  - type: numeric
    id: odds-numbers
    title: "An odds update with new numbers"
    prompt: |
      A reader gives a belief prior probability $0.25$. Then learns that a certain experience is $6$ times as likely to arise if the belief is true as if it is false. What is the probability of the belief after this evidence? Give a decimal.
    answer: 0.6667
    tolerance: 0.005
    answerText: '2/3'
    wrong:
      - { value: 1.5, feedback: 'That is the prior multiplied by $6$, which is not a probability. The multiplication works on odds, not on probabilities.' }
      - { value: 2, feedback: 'That is the posterior odds ($\tfrac13\times6=2$). The question asks for a probability: convert the odds back.' }
    hint: 'Work with odds for the update, then convert back to a probability.'
    explanation: |
      Prior odds are $0.25/0.75=\tfrac13$. Multiplying by the likelihood ratio $6$ gives odds $2$, which is probability $2/3\approx0.667$. Had the experience been equally likely either way, the answer would stay $0.25$.

  - type: numeric
    id: alarm-numbers
    title: "A cheaper false alarm"
    prompt: |
      A forager hears a rustle. Ignoring a real predator costs $198$ units; reacting when nothing is there costs $2$ units. Above what probability that the rustle is a predator is reacting the better policy? Give a decimal.
    answer: 0.01
    tolerance: 0.0005
    answerText: '0.01'
    wrong:
      - { value: 0.5, feedback: 'Fifty-fifty would be the threshold only if the two mistakes cost the same. Here a miss costs far more, so the threshold is far lower.' }
      - { value: 0.99, feedback: 'That swaps the roles of the costs: it would be the threshold if false alarms were the expensive mistake.' }
    hint: 'Compare the expected cost of ignoring with the expected cost of reacting, and find the probability where they are equal.'
    explanation: |
      Equal expected costs: $p\cdot198=(1-p)\cdot2$, so $200p=2$ and $p=0.01$. A detector that is wrong $99$ times in $100$ is still worth obeying.

  - type: text
    id: summary
    body: |
      **Next:** the content map of this level: rebuild its concept map box by box among look-alike decoys.
