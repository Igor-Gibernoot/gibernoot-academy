id: ch13-group
title: "Religion and the Group"
kind: concept
own: |
  The setting: a group of people who must trust one another, and a scholarly question about what religion does for such groups. A **free rider** is a member who takes the benefits of cooperation without paying its cost, and a **costly signal** is a display that is expensive enough to be hard to fake.
  - **Costly signals.** According to Irons (2001), building on Zahavi's handicap principle (1975), a ritual or taboo can show commitment to a group because it costs a committed member little and a faker much. With benefit of acceptance $b$, cost $c_C$ for the committed and $c_F$ for fakers, the signal sorts the two types when
  {{ $$c_C < b < c_F$$ }}
  and it fails once $b$ passes $c_F$, because then fakers also find it worth paying.
  - **The cooperation problem.** In a public-goods game with $n$ players, endowment $e$ and multiplier $m$ on the common pot (split equally), one coin given up returns only
  {{ $$\frac{m}{n}$$ }}
  to the giver, so when $m < n$ each player gains by keeping the coin, although all do better if all give. Religion is proposed, according to several authors, as one way to keep free riders in check, through signals, reputation and watching gods.
  - **Big gods.** According to Norenzayan (2013), belief in {{ watchful, morally concerned gods }} helped very large groups of strangers to cooperate. The evidence is mixed: experiments on being watched have faced replication doubts, and the historical order of large societies and moralising gods is disputed.
  - **Group selection.** According to D. S. Wilson and Sober (1994), selection acts at several levels at once: within a group selfish members beat altruists, between groups altruistic groups beat selfish groups. The gene-level critics (Williams 1966, Dawkins 1976) reply that {{ within-group selection usually outweighs between-group selection, so group benefit rarely explains a trait }}.
  - **Three layers.** That costly rituals and cues of being watched can change behaviour in some settings is established; whether religion is a by-product, an adaptation of individuals, or shaped by selection among groups is a live debate; whether any god exists is a faith or metaphysical commitment that none of these studies tests.

cards:
  - type: text
    id: recall
    title: "Recall: where we stand"
    body: |
      Recall from the lesson Minds Built to See Agents. An **agent** is a being that acts on goals. Cognitive scientists of religion argue that human minds flag ambiguous signs (a rustle) as the work of an agent because missing a real agent costs far more than a false alarm, and that concepts which break one or two expectations (a ghost that walks through walls but still wants things) are easy to remember and pass on.

      Two stories of origin were left open. In the **by-product** view (Boyer, Atran), religion is a side effect of mental tools that evolved for other jobs. In the **adaptation** view (D. S. Wilson), religion itself was selected because of what it does for groups. This lesson looks at that second claim: what could religion do for a group, and does the evidence say it did?

  - type: mcq
    id: hook
    title: "Guess: whom would you trust?"
    prompt: |
      Guessing is the point; no theory yet. A village of 40 people shares a grain store. Anyone could take extra grain at night and no one would see. A newcomer asks to join the sharing. Which sign would make you most willing to trust her?
    options:
      - text: 'She says loudly and often that she is trustworthy.'
        feedback: |
          Words cost nothing, so a cheat can say them as easily as an honest person. That is why a bare promise is a weak sign.
      - text: 'She spends two years working for the village, unpaid, before asking for a share.'
        correct: true
        feedback: |
          Yes, roughly. A long, costly effort is hard to keep up if you plan to cheat soon after, so it tells you something that talk cannot.
      - text: 'She is warm and friendly to everyone in the village.'
        feedback: |
          Friendliness is pleasant but cheap, and a clever cheat can show it too.
    explanation: |
      Hold on to the idea: a sign is believable when faking it would be expensive. This is the heart of the first half of the lesson.

  - type: text
    id: signals
    title: "Costly signals"
    body: |
      The biologist Amotz Zahavi proposed in 1975 the **handicap principle**: a signal can be honest because it is costly, and a weak individual could not afford to fake it (the peacock's heavy tail is the classic example). The anthropologist William Irons applied the logic to religion in a chapter published in 2001, "Religion as a Hard-to-Fake Sign of Commitment." His idea, in essence: long rituals, food taboos and other demanding practices are signs that a person is committed to the group, because they are costly.

      Make it precise with invented numbers. A group has two kinds of newcomers: the **committed**, who will contribute to the group, and **fakers**, who only want the benefits. Joining the group's ritual costs a committed person $c_C = 2$ units of effort a month, because it fits their life, and a faker $c_F = 8$, because they must pretend. Being accepted is worth $b = 5$ units to anyone.

      | Type | Gain from acceptance | Cost of the ritual | Net |
      |---|---|---|---|
      | Committed | $5$ | $2$ | $+3$ |
      | Faker | $5$ | $8$ | $-3$ |

      Only the committed find the ritual worth paying, so the group can read the ritual as a sign of commitment.

  - type: numeric
    id: signal-threshold
    title: "When does the sorting fail?"
    prompt: |
      Use the table: committed newcomers pay $c_C = 2$ units for the ritual, fakers pay $c_F = 8$, and acceptance is worth $b$ units to anyone. A newcomer joins the ritual if the benefit is at least the cost. As $b$ rises, at which value of $b$ do fakers become willing to join, so the ritual no longer tells the types apart?
    answer: 8
    hint: |
      A faker joins when the benefit $b$ is at least what the ritual costs a faker.
    wrong:
      - { value: 2, feedback: 'At $b = 2$ the committed start to join. The question asks when fakers do.' }
      - { value: 5, feedback: 'At $b = 5$ the committed gain 3 and fakers still lose 3, so the sorting works. Fakers need a larger benefit.' }
    explanation: |
      Fakers join once $b \ge c_F = 8$. The ritual sorts the two types exactly when $c_C < b < c_F$, here $2 < b < 8$. If the rewards of membership grow large, even a costly signal gets faked, and the group has to raise the price.

  - type: mcq
    id: signal-why
    title: "What makes the signal work"
    prompt: |
      In the toy model above, which feature makes the ritual a reliable sign of commitment?
    options:
      - text: 'The ritual is long and unpleasant for everyone in exactly the same way.'
        feedback: |
          If the ritual cost fakers and the committed the same, it could not tell them apart: either both would pay it or neither would. What matters is that the cost differs by type.
      - text: 'The ritual costs a faker more than the acceptance is worth, but costs a committed person less.'
        correct: true
        feedback: |
          Yes. The signal sorts people because the cost is high for fakers and low for the committed, with the benefit between the two.
      - text: 'The ritual has a true religious meaning.'
        feedback: |
          Whether the beliefs are true plays no part in the signalling logic. A costly practice of any content would carry the same information, which is also a limit of the theory: it does not say why religion in particular.
    explanation: |
      Critics add two limits: it does not explain why cultures pick the particular signals they do, and a ritual that is easy to attend and easy to fake (showing up at a service) is not very costly. Defenders reply that the theory predicts which demands get stricter in groups where free riding is a bigger threat.

  - type: text
    id: signals-evidence
    title: "A test with communes and kibbutzim"
    body: |
      Richard Sosis and Eric Bressler (2003, *Cross-Cultural Research*) studied nineteenth-century communes in the United States, groups that had to share work to survive. They asked whether communes imposing costlier requirements on members lasted longer. In essence they found that, among religious communes, the ones with the most costly demands lasted longest, and that this pattern did not show up in secular communes. An earlier analysis by Sosis (2000) had found that religious communes outlasted secular ones. Published summaries give different counts of communes, so the exact sample sizes are not given here.

      Sosis and Bradley Ruffle (2003, *Current Anthropology*) ran field experiments on Israeli kibbutzim, settlements built around shared work. In essence they found that members of religious kibbutzim cooperated more in the experiments than members of secular ones, and that the difference was linked to ritual participation, using the fact that men and women on religious kibbutzim differ in how much ritual they perform.

  - type: mcq
    id: signals-limit
    title: "What the commune data can and cannot show"
    prompt: |
      The commune result says: among religious communes, those with costlier requirements lasted longer. Which rival explanation could produce the same pattern without the signalling story being right?
    options:
      - text: 'Strong leaders or shared hardship may have both demanded more and held the group together, so the demands are a marker of cohesion, not its cause.'
        correct: true
        feedback: |
          Yes. A correlation does not say which way the effect runs, or whether a third factor drives both. Signalling theorists reply that the effect appears within religious groups only, which a plain leadership story would need extra assumptions to explain.
      - text: 'Longer-lived communes simply had more years in which to be studied.'
        feedback: |
          Survival time is the very quantity measured, so this does not rival the pattern; it would not by itself make costlier demands go with longer life.
      - text: 'Nothing: a survival pattern like this proves the signalling mechanism.'
        feedback: |
          Historical data of this kind show an association. Proving a mechanism would need more, such as experiments or a way to separate cause from selection of committed people.
    explanation: |
      This is typical of the whole field: the pattern is real in the data, and thoughtful scholars part ways on what produces it. The kibbutz experiments are one step closer to a test, since they measured behaviour directly.

  - type: text
    id: pgg
    title: "The cooperation problem"
    body: |
      Why would groups need signals at all? Take a standard experiment, the **public-goods game**. Four players each hold $e = 10$ coins. Each may put any number of coins into a common pot. The pot is multiplied by $m = 1.6$ and split equally among the four, whether or not a player gave.

      Each player's payoff is what she kept plus her quarter of the multiplied pot. One coin she puts in becomes $1.6$ coins in the pot, of which she gets back a quarter:
      $$\frac{m}{n} = \frac{1.6}{4} = 0.4.$$
      So giving one coin costs her 1 coin and returns her 0.4 coins, while keeping it returns 1.

  - type: numeric
    id: pgg-freerider
    title: "The free rider's payoff"
    prompt: |
      Four players each hold 10 coins. Each may put coins in a common pot; the pot is multiplied by 1.6 and split equally among all four. Three players put in all 10 coins, and the fourth keeps her 10 coins. How many coins does the fourth player end with in total?
    answer: 22
    hint: |
      The pot holds 30 coins. After multiplying and splitting four ways, each player receives the same share, including the one who gave nothing.
    wrong:
      - { value: 16, feedback: 'That is what each player gets if all four give everything ($1.6\times 40/4$). Here the fourth keeps her 10 coins as well.' }
      - { value: 12, feedback: 'That is her share of the pot ($1.6\times 30/4$). She also still holds her own 10 coins.' }
    explanation: |
      The pot is $30 \times 1.6 = 48$ coins and each share is $48/4 = 12$. The free rider has her 10 kept coins plus 12, which is 22. Each of the three givers ends with $0$ kept $+\,12 = 12$.

  - type: numeric
    id: pgg-all
    title: "If everyone gives"
    prompt: |
      Same game: four players, 10 coins each, pot multiplied by 1.6 and split equally. This time all four put in all 10 coins. How many coins does each player end with?
    answer: 16
    hint: |
      The pot holds 40 coins before multiplying.
    explanation: |
      The pot is $40\times1.6 = 64$ coins, each share is $64/4 = 16$. So everyone gives and ends with 16, but any one player who switches to keeping her coins would get 22 while the others fall to 12. If all four keep, each ends with only 10. Cooperation beats universal selfishness, yet a single player always gains by cheating: that is the free-rider problem.

  - type: mcq
    id: pgg-fixes
    title: "What could keep free riders in check?"
    prompt: |
      In the public-goods game each player gains by keeping her coins, though all do better if all give. Which of these would, in principle, change the temptation?
    multiple: true
    options:
      - text: 'Others can see who gave and who did not, and reward or avoid cheats later.'
        correct: true
        feedback: |
          Yes. A reputation for cheating makes future partners unwilling, which adds a cost to free riding.
      - text: 'A cost imposed on those who keep their coins, such as punishment.'
        correct: true
        feedback: |
          Yes. If cheating loses more than the 6 coins it gains in the example, the temptation reverses.
      - text: 'A believable sign, shown before joining, that a newcomer is a cooperator.'
        correct: true
        feedback: |
          Yes. A costly signal lets the group admit mostly committed people, which is the idea of the first half.
      - text: 'Raising the number of coins each player holds from 10 to 20.'
        feedback: |
          Scaling everything up changes the sizes of the payoffs but not their comparison: a coin still returns 0.4 to the giver and 1 if kept.
    explanation: |
      Reputation, punishment and signals are the three ingredients. Scholars of religion ask whether belief in watching gods adds a fourth: an observer who cannot be avoided.

  - type: text
    id: watching
    title: "Does being watched change behaviour?"
    body: |
      Melissa Bateson, Daniel Nettle and Gilbert Roberts (2006, *Biology Letters*) put a poster over the honesty box in a university coffee room, where staff pay for drinks on trust. On alternating weeks the poster showed flowers or a pair of eyes. Payments were nearly three times higher in the weeks with the eyes. A 2019 meta-analysis by Dear, Dutton and Fox, in *Evolution and Human Behavior*, pooled experiments on eye images and antisocial behaviour and concluded that eyes do reduce it, while other meta-analyses of prosocial outcomes such as donations found no reliable effect or a small one.

      For gods, Azim Shariff and Ara Norenzayan (2007, *Psychological Science*) found that people primed with God-related words gave more money to an anonymous stranger in the dictator game, in which one person decides how to split a sum. A preregistered replication by Cristina Gomes and Michael McCullough (2015, *Journal of Experimental Psychology: General*) found no significant effect. Shariff and Norenzayan answered that the replication participants already gave generously in the control condition, leaving little room for an effect. The size and reliability of religious priming are still contested.

  - type: mcq
    id: watching-read
    title: "How to read mixed evidence"
    prompt: |
      One experiment finds that eyes on a poster raise honest payments. A replication of a different priming experiment finds nothing. A critic says, "So the idea that being watched changes behaviour is refuted." How should this be answered?
    options:
      - text: 'It is too fast: the results concern different studies and settings, so the honest summary is that the effect seems real for some cues and settings and is unsettled for others.'
        correct: true
        feedback: |
          Yes. A failed replication of one design does not refute a different design, and a single positive result does not establish the broad claim either. The sensible stance is to say which effects have held up and which have not.
      - text: 'It is correct: one failed replication refutes every watching effect.'
        feedback: |
          A failed replication weakens that specific result. The coffee-room study and the priming study test different things, and meta-analyses give a mixed picture, not zero.
      - text: 'It is wrong: the poster result is a published experiment, so it must hold everywhere.'
        feedback: |
          Publication does not guarantee generality. Small effects in one setting often shrink when tested again in others.
    explanation: |
      This is a case of layer 2 in the three layers: the effect of cues of being watched is partly established and partly disputed, and scholars who agree on the data still weigh it differently.

  - type: text
    id: biggods
    title: "Big gods and big societies"
    body: |
      Ara Norenzayan's *Big Gods: How Religion Transformed Cooperation and Conflict* (Princeton University Press, 2013) argues that belief in watchful, morally concerned gods helped human groups grow far beyond the size where everyone knows everyone. Where reputation cannot reach strangers, an all-seeing god may stand in for the neighbour's eyes. The book also notes that the same belief can sharpen conflict between groups.

      Some data fit this. Benjamin Purzycki and colleagues (2016, *Nature*) ran games in eight societies and found that beliefs in gods who are knowing and punishing went with fairer treatment of distant co-religionists. In small hunter-gatherer groups, where everyone is watched by neighbours, the picture differs: in the sample of 33 foraging societies coded by Peoples, Duda and Marlowe (2016), only about 15% had active high gods.

      Whether big gods came first or large societies came first is disputed. Harvey Whitehouse and colleagues published in *Nature* in 2019 an analysis of historical data that found social complexity tended to come before moralising gods. The paper was retracted in 2021 after critics (Beheim and colleagues) said missing evidence had been treated as absence, and a corrected analysis was published in 2022. Specialists still disagree over the order.

  - type: mcq
    id: biggods-test
    title: "What would count against the big-gods idea?"
    prompt: |
      The big-gods idea says that belief in watchful, moralising gods helped large groups of strangers cooperate. Which finding would count most against it as an account of how large societies arose?
    options:
      - text: 'Careful historical data showing that large, complex societies regularly arose well before any belief in moralising gods appeared.'
        correct: true
        feedback: |
          Yes. If the societies came first, the gods cannot have been what made them possible, though they might still have helped keep them stable.
      - text: 'Many members of large societies are not religious today.'
        feedback: |
          That shows modern societies can run on other institutions (courts, police, trust). Norenzayan himself notes it. It does not say what happened at the start.
      - text: 'Some small societies have strong moral rules without any high god.'
        feedback: |
          True, and consistent with the claim: the idea is that big gods matter for very large groups, where neighbours' eyes do not reach.
    explanation: |
      Order in time is what the historical debate is about. A fair statement: moralising gods may have both followed complexity and helped sustain it, and the data so far do not settle the order.

  - type: text
    id: groupsel
    title: "Selection among groups"
    image:
      - src: img/dsw-wilson.webp
        alt: Photograph of David Sloan Wilson, an older man with glasses
        caption: David Sloan Wilson (born 1949) argued in Darwin's Cathedral (2002) that religions are mainly group-level adaptations that spread by cultural group selection.
        credit: "Slowking4, CC BY 2.0, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:David_sloan_wilson_8315462.jpg"
      - src: img/dawkins.webp
        alt: Portrait photograph of Richard Dawkins in 2005
        caption: Richard Dawkins (born 1941), in The Selfish Gene (1976), treated the gene as the unit that selection favours and was sceptical of group selection.
        credit: "Cstreet (Christopher G. Street) , Bransgore , Dorset , England, UK., Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Professor_Richard_Dawkins_-_March_2005.jpg"
        beside: true
    body: |
      The biologists David Sloan Wilson and Elliott Sober (1994, *Behavioral and Brain Sciences*) argued that selection acts at several levels at once. Inside a group, a selfish member does better than an altruist; but a group of altruists can do better than a group of selfish members. If the second force outweighs the first, traits that help groups can spread even though they cost individuals. In the human case Wilson applied this to religion, with cultural groups competing, in *Darwin's Cathedral* (University of Chicago Press, 2002).

      George C. Williams (1926-2010) in *Adaptation and Natural Selection* (1966) argued against explaining traits by the good of the group or the species, and Richard Dawkins's *The Selfish Gene* (1976) built on this to treat the gene as the basic unit of selection. The critics' core reply, in essence: within-group selection is usually much stronger than between-group selection, because groups seldom differ enough and last long enough, so the group-benefit story rarely does the work. Wilson answers that the gene-level view and the multilevel view can describe the same facts, and that the real question is how large the between-group part is for human cultural groups.

  - type: mcq
    id: groupsel-predict
    title: "Two views, two predictions"
    prompt: |
      A cooperative ritual costs each member some effort, and groups that practise it outcompete neighbours. Which statement best fits each side of the debate?
    options:
      - text: 'A multilevel theorist expects the ritual can spread because between-group gains exceed within-group losses; a gene-level critic expects it spreads only if it also benefits the individuals or their kin, or if groups hardly mix and differ strongly.'
        correct: true
        feedback: |
          Yes. Both sides use the same ingredients (within-group cost, between-group gain, how much groups differ). They differ in how large the between-group part usually is and in how they prefer to describe it.
      - text: 'A multilevel theorist denies that individual selection exists, and the gene-level critic denies that groups ever compete.'
        feedback: |
          Neither claim is held. Wilson keeps within-group selection as one of the two forces, and the critics accept that groups compete, doubting that this usually shapes traits.
      - text: 'Both sides predict the ritual cannot spread, since it costs individuals.'
        feedback: |
          The multilevel side predicts it can spread when the group advantage is large enough. The disagreement is exactly about when that happens.
    explanation: |
      A fair summary: the logic of multilevel selection is accepted by many; how much it explains human religion is the live debate.

  - type: mcq
    id: both
    title: "By-product, adaptation, or both?"
    prompt: |
      A scholar proposes: minds flag agents because that helped ancestors avoid predators, and later, groups whose gods watched their moral conduct cooperated better and outlasted other groups, so such beliefs spread. How should this account be classed?
    options:
      - text: 'As both: the agent-seeing mind is a by-product of mental tools evolved for other jobs, and the cooperation effects shaped which religions spread.'
        correct: true
        feedback: |
          Yes. The two stories do not exclude each other. One explains why the beliefs are easy to form, the other why some versions persisted.
      - text: 'Only as a by-product account, since it begins with agency detection.'
        feedback: |
          The second half of the proposal invokes effects on groups, which the by-product view alone does not add.
      - text: 'Only as an adaptation account, since it mentions cooperation.'
        feedback: |
          The first half says the mental tools were not selected for religion, which is the by-product claim.
    explanation: |
      Several scholars hold such blended positions. A further question is left open: what a causal story of how belief arose does to the truth of the belief; the lesson Does Explaining Belief Explain It Away? takes it up.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    prompt: |
      Sort three claims. (a) In a coffee-room experiment, payments for drinks were higher in weeks when a poster showed eyes. (b) Religion exists because groups with moralising gods outcompeted others. (c) A watching God exists. Which sorting fits the three layers?
    options:
      - text: '(a) established in that setting, (b) a live debate among scholars, (c) a faith or metaphysical commitment.'
        correct: true
        feedback: |
          Yes. (a) is a reported result with a published design (and similar cues are still debated across settings), (b) is the contested causal story, and (c) is beyond what these studies can test.
      - text: '(a) a faith commitment, (b) established, (c) a live debate.'
        feedback: |
          The order is reversed. (b) is exactly what scholars disagree on, and (a) is an experimental result.
      - text: 'All three are established facts.'
        feedback: |
          Only (a) is an experimental result, and only for its setting. (b) is contested and (c) is not a finding of any study.
    explanation: |
      A reader who believes and a reader who does not can accept the same data on signals and cooperation and draw different conclusions about whether the beliefs are true.

  - type: text
    id: summary
    body: |
      **Next:** Culture, Diversity and Secularisation. If religion helps groups, why do some societies hold belief strongly, while in others it declines and in others it rises? The next lesson turns from how belief began to why it varies across places and times.
