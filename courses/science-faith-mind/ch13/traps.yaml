id: ch13-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: why humans believe"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: where religion comes from, minds that see agents, religion and the group, culture and secularisation, debunking arguments, the same argument turned on unbelief, and the anthropology of ritual. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone, and where thoughtful people differ the feedback shows both sides. Notation as in the lessons: a debunking argument has premises P1 (the belief has a real cause), P2 (that process would give the belief whether or not it is true) and P3 (nothing independent supports it), and concludes that the belief is unjustified, not that it is false. LR is a likelihood ratio, and posterior odds equal prior odds times LR.

  - type: mcq
    id: genetic-fallacy
    title: "A natural cause, so it is false?"
    prompt: |
      A student says: "Cognitive scientists have found natural mental causes for belief in gods, so the belief is false." Which reply is best?
    options:
      - text: 'Showing that a belief has a natural cause does not show it is false. The origin of a belief bears on its truth only if the process would produce it whether or not it is true (P2) and nothing independent supports it (P3). Both are separate claims that need their own evidence.'
        correct: true
        feedback: |
          Yes. A cause-based rejection that skips P2 and P3 is the genetic fallacy: judging a claim by its origin. Even a successful debunking argument concludes that the belief is unjustified, which is weaker than false.
      - text: 'If the cause is natural, the belief is true, because nature is reliable.'
        feedback: |
          This is the mirror shortcut. Natural causes include reliable ones (eyesight) and unreliable ones (a jammed thermometer). Whether the process tracks the truth is the question.
      - text: 'Natural causes are irrelevant to belief, because only arguments matter.'
        feedback: |
          Too strong. If the process would give the belief whether it were true or not, that bears on how much the belief can be trusted. The shortcut errs by treating the cause as decisive, not by looking at it.
    explanation: |
      The cause of a belief is evidence about its reliability only through P2 and P3. Without them, "it has a cause" is expected on every view, believer or sceptic.

  - type: mcq
    id: byproduct-adaptation
    title: "By-product means worthless, adaptation means true?"
    prompt: |
      In the by-product view (Boyer, Atran) religion is a side effect of mental tools that evolved for other jobs. In the adaptation view (D. S. Wilson) religion itself was selected for what it does for groups. A student says: "If religion is a by-product, it is worthless, and if it is an adaptation, it is true." What is wrong?
    options:
      - text: 'Neither origin story settles truth or value. A by-product can be useful (many useful things are side effects), and an adaptation can be useful while false: selection favours what works for survival and cooperation, not what is true.'
        correct: true
        feedback: |
          Yes. Both are claims about why the trait spread. Whether any god exists is a layer-3 question that neither evolutionary story answers.
      - text: 'A by-product is always true and an adaptation is always false.'
        feedback: |
          This swaps the shortcut without removing it. Neither story entails truth or falsity.
      - text: 'Both stories are known to be established fact.'
        feedback: |
          The origin of religion is a live debate among researchers, and a third view holds that it is both: a by-product at first, later shaped by selection.
    explanation: |
      How a trait arose and whether what it represents is real are different questions. Success at spreading and success at being right are not the same measure.

  - type: mcq
    id: hadd-proof
    title: "The detector proves it either way?"
    prompt: |
      Barrett (2000), building on Guthrie (1993), named the hyperactive agency detection device (HADD): a mind that flags ambiguous signs, like a rustle, as the work of an agent. A student says: "So HADD proves gods exist, since the mind is built to find agents." Another says: "HADD proves they do not, since it fires falsely." Which comment is closest to the lesson?
    options:
      - text: 'Neither. HADD explains why agent-beliefs come easily, because missing a real predator costs far more than a false alarm. It does not say whether a given agent, divine or not, is there. Whether it supports any conclusion depends on the debunking test: would the detector fire just as much whether or not an agent were there?'
        correct: true
        feedback: |
          Yes. A detector that fires on many false alarms can still be the best policy, and a detector that sometimes hits shows that detectors can work. The truth question needs more than the mechanism.
      - text: 'It proves gods exist, because evolution would not build a detector for nothing.'
        feedback: |
          Evolution built it for rustles and predators, where a false alarm is cheap. The same design can fire on a shadow, and a detector built for survival is not thereby a detector of gods.
      - text: 'It proves gods do not exist, because the detector is wrong most of the time.'
        feedback: |
          Being wrong most of the time is compatible with being good policy (in the toy numbers, reacting pays when a rustle hides a predator about one time in a hundred). And wrong on many rustles does not mean wrong on every agent claim.
    explanation: |
      A mechanism for forming beliefs is a premise (P1) in a debunking argument, not the conclusion. The step from "the detector fires easily" to "so the belief is unjustified" needs P2 and P3, and the believer may deny P2.

  - type: mcq
    id: costly-ritual
    title: "Any costly ritual builds trust?"
    prompt: |
      In a toy model of costly signals, a ritual costs a committed member $c_C$ and a free rider (someone who would join only for the benefits) $c_F$, and joining brings a benefit $b$. A signal sorts committed members from free riders only if $c_C < b < c_F$. A student says: "Any costly ritual builds trust." Take $c_C = 2$, $c_F = 3$, $b = 5$. What happens?
    options:
      - text: 'The ritual does not sort: the free rider pays 3 and still gains 5, so free riders join as well, and the cost tells the group nothing about who is committed.'
        correct: true
        feedback: |
          Yes. Cost builds trust only when it is high enough that a faker would not pay it ($b < c_F$) and low enough that the committed will ($c_C < b$). Here the second condition holds and the first fails.
      - text: 'It sorts, because $c_C < b$ and the ritual is costly.'
        feedback: |
          Half of the condition. The committed pay and gain, but the free rider also finds it worthwhile, because $c_F = 3$ is less than $b = 5$.
      - text: 'It sorts, because the cost $c_F = 3$ is larger than $c_C = 2$.'
        feedback: |
          A cost gap alone is not enough. What matters is where the benefit $b$ sits between the two costs. Here $b = 5$ is above both.
    explanation: |
      The signal works as a filter only inside the window $c_C < b < c_F$. Too cheap and fakers pass; too expensive and even the committed stay out. This is why the lesson called it a hard-to-fake sign, not merely a costly one.

  - type: mcq
    id: wilson-dawkins
    title: "Group selection is the same as by-product?"
    prompt: |
      A student says: "D. S. Wilson's group selection view of religion just says religion is a by-product, so Wilson and Dawkins agree." Which statement fits the lesson?
    options:
      - text: 'They differ. Wilson and Sober (1994) argued that selection acts at several levels at once, so groups of cooperators can outcompete groups of selfish members, and religion may be a group-level adaptation. The gene-level critics (Williams 1966, Dawkins 1976) doubted that group selection usually shapes traits. By-product views, such as Boyer''s and Atran''s, say religion was not selected for at all.'
        correct: true
        feedback: |
          Yes. Three positions: group-level adaptation (Wilson), individual or gene-level skepticism about group adaptation (Williams, Dawkins), and by-product (Boyer, Atran). Some researchers mix them.
      - text: 'Wilson''s view is that religion is a by-product, and Dawkins''s view is that it is an adaptation.'
        feedback: |
          This reverses both. Wilson argued for adaptation at the group level; the by-product label belongs to Boyer and Atran's camp.
      - text: 'Group selection says that groups, not individuals, are all that evolve, so within-group competition plays no role.'
        feedback: |
          Wilson keeps within-group selection as one force: selfish members beat altruists inside a group, while altruistic groups beat selfish ones between groups. Both levels count.
    explanation: |
      "Selected for" and "a side effect of" are opposite claims about the same trait. The group-selection debate is about the level at which selection acts, a separate axis from by-product against adaptation.

  - type: mcq
    id: secularisation
    title: "Modernity always empties religion?"
    prompt: |
      A student says: "As societies modernise, religion disappears. Weber's disenchantment shows it." Three rival readings of religious change were studied: existential security (Norris and Inglehart), supply-side or religious economy (Stark and Finke), and plausibility under pluralism (Berger). Which statement is best?
    options:
      - text: 'The picture is contested. Norris and Inglehart tie lower religiosity to existential security (safety and predictability) and so expect decline where security is high, with exceptions such as the United States. Stark and Finke argue that competition among religious suppliers keeps participation up. Berger first linked pluralism to lost plausibility, then revised his view. Data such as rising "nones" and growing evangelical shares in Brazil show different trends in different places.'
        correct: true
        feedback: |
          Yes. A single story of steady decline fits some countries and misses others, and the rival explanations disagree about the cause, not only about the data.
      - text: 'All three agree that modern societies always lose religion.'
        feedback: |
          They do not agree. Stark and Finke emphasise how supply and competition can sustain religion, and Berger himself later revised his secularisation thesis.
      - text: 'Religion never changes with modernisation.'
        feedback: |
          This overcorrects. Pew data show a rising share of US adults with no religion, and Brazil shows shifts in affiliation. Change happens, in different forms in different places.
    explanation: |
      "Religion declines with modernity" is a hypothesis with some support and some counter-cases. Explaining the pattern, as security, supply or pluralism, is a further and still open step.

  - type: mcq
    id: debunk-one-way
    title: "Debunking works against religion only?"
    prompt: |
      A student says: "Debunking arguments only ever work against religious belief." In the lesson the same three premises (a real cause, a process that gives the belief whether or not it is true, and no independent support) were applied to other beliefs. What is the best reply?
    options:
      - text: 'The form is neutral. Street (2006) used a debunking-style dilemma against moral realism, and the lesson on reversing the argument applied P1 to P3 to unbelief as well, where its causes (thinking style, security, few credible cues) are real too. What matters in each case is whether P2 and P3 can be defended.'
        correct: true
        feedback: |
          Yes. A symmetric test is a mark of a fair argument: the premises are the same wherever they are applied, and each case stands or falls on them.
      - text: 'It works only against religion because religion alone has natural causes.'
        feedback: |
          Every belief has natural causes, including belief in scientific theories and in atheism. Singling one out would need a reason beyond "it has a cause".
      - text: 'It works against every belief equally, so no one can know anything.'
        feedback: |
          Many beliefs pass the test: eyesight would not give a belief in a nearby tree if no tree were there. Debunking depends on P2, and that fails for reliable processes.
    explanation: |
      A debunking argument is a template, not a weapon aimed at one side. Used fairly, it asks of every belief whether its source would give it regardless of the facts.

  - type: mcq
    id: eaan-target
    title: "The EAAN targets atheism?"
    prompt: |
      Plantinga's evolutionary argument against naturalism (EAAN) uses N for naturalism, E for evolution, and R for the claim that our cognitive faculties are reliable. A student says: "It is an argument against atheism." What does it actually target?
    options:
      - text: 'According to Plantinga, the probability $P(R \mid N \text{ and } E)$ is low or inscrutable, which targets the combination of naturalism and evolution, not atheism as such. An atheist who is not a naturalist, or one who rejects the claim about probabilities (as Fitelson and Sober did), is not touched in the same way.'
        correct: true
        feedback: |
          Yes. The argument targets one package, N together with E. Critics dispute the probability claim, and some theists accept E without N, so the argument is aimed at a view about the world, not at a position about God.
      - text: 'It targets evolution alone, and shows that evolution is false.'
        feedback: |
          Plantinga accepts evolution in his argument. His claim is that evolution combined with naturalism undermines trust in our faculties.
      - text: 'It targets any belief in a mind, and so it also refutes theism.'
        feedback: |
          Plantinga holds that theism does not face the same problem, because a God who wants us to know can ground reliable faculties. Critics reply that this needs its own argument, but that is a reply to the argument, not what it targets.
    explanation: |
      The EAAN is aimed at naturalism combined with evolution. Whether it works depends on its probability step, which the critics reject.

  - type: numeric
    id: analytic-atheism
    title: "Analytic thinking causes atheism?"
    prompt: |
      A meta-analysis of 31 studies with 15,078 participants (Pennycook and colleagues, 2016) found a correlation of about $r = -0.18$ between analytic thinking and religious belief. A student says: "So analytic thinking causes atheism." As a first check, what percentage of the variation in belief is shared with analytic thinking, $r^2 \times 100$? Give the answer in percent, to one decimal.
    answer: 3.2
    tolerance: 0.05
    answerText: '3.2'
    wrong:
      - { value: 18, feedback: 'The correlation $r = 0.18$ is not a percentage of shared variation. Squaring it gives the share: $0.18^2 = 0.0324$.' }
      - { value: 0.0324, feedback: 'Right quantity, but the answer is asked in percent: $0.0324 \times 100 = 3.2$.' }
    hint: |
      The share of variation two variables have in common is the square of their correlation.
    explanation: |
      $r^2 = 0.18^2 = 0.0324$, about $3.2\%$. A modest correlation does not give a direction: belief may shape thinking style, a third factor such as upbringing may shape both, and a famous experiment with Rodin's *Thinker* did not replicate in a large preregistered attempt (941 participants). Researchers describe several routes to unbelief, so analytic thinking is at most one among them.

  - type: mcq
    id: durkheim-fooling
    title: "A social function means believers are fooling themselves?"
    prompt: |
      According to Durkheim (1858-1917), in *The Elementary Forms of Religious Life* (1912), ritual builds the sacred through collective effervescence and binds the group. A student says: "So Durkheim shows believers are fooling themselves about their gods." Which reply is best?
    options:
      - text: 'A claim about what ritual does for a community is a claim about its function, not about whether its objects exist. A believer can accept that ritual binds a community and hold that the community also meets something real; a sceptic can accept the same function and conclude otherwise. The function does not decide between them.'
        correct: true
        feedback: |
          Yes. Durkheim's own argument was about the social source of the sacred, and how far it explains the object away is exactly the layer-2 and layer-3 question of the level.
      - text: 'Function and truth are the same question, so a social function proves the gods are real.'
        feedback: |
          This mirrors the shortcut. A function does not prove the object is real either: many practices bind communities with a mistaken or no object.
      - text: 'Durkheim argued that rituals have no effects on anyone.'
        feedback: |
          The opposite. His account depends on strong effects: the energy of the gathering and the sense of something larger than any member.
    explanation: |
      What a practice does and what it is about are two layers. The function is a matter of study and debate; whether the object is real is a commitment the function does not settle.

  - type: mcq
    id: malinowski-fear
    title: "Ritual appears wherever people are afraid?"
    prompt: |
      According to Malinowski (1884-1942), as described in the lesson, Trobriand fishers used magic before open-sea fishing, which is uncertain and dangerous, and not before fishing in the lagoon, which is safe and reliable. A student says: "So ritual shows up wherever people are afraid." Which reading is closest to Malinowski's claim?
    options:
      - text: 'In essence, Malinowski linked magic to uncertainty and danger: where the outcome is reliable and the risk low, as in the lagoon, there was little magic, and where outcomes are uncertain and dangerous, as in the open sea, magic was prominent. It is a claim about where ritual clusters, not that fear alone produces all ritual.'
        correct: true
        feedback: |
          Yes. The claim is a pattern, with conditions: uncertainty and danger. Critics note that rituals also occur in calm, secure settings (a wedding, a graduation), which Durkheim's group-binding account addresses better.
      - text: 'Ritual appears only where people are afraid, and never in safe settings.'
        feedback: |
          Too strong. Rituals in secure settings exist and are explained by other functions, such as marking status changes or binding a group.
      - text: 'Malinowski argued that fear alone is the origin of religion.'
        feedback: |
          His point was narrower: a link between uncertainty, danger and magic. It is a pattern in one setting, and it is not a theory that fear is the whole origin of religion.
    explanation: |
      Pattern claims name their conditions. "Where danger and uncertainty are high" is a testable condition; "wherever people are afraid" turns it into a slogan that calm rituals refute.

  - type: mcq
    id: thick-description
    title: "Thick description means a longer description?"
    prompt: |
      Geertz (1926-2006) borrowed the term thick description from the philosopher Gilbert Ryle (as recorded in the lesson) and used it in 1973. Note A: "At dawn, forty adults stood in a circle, lowered their heads for two minutes and then sat down." Note B: "At dawn, the village gathered to remember the dead of the flood; lowering the head, in this community, is how one addresses the dead and not the living." A student says: "B is thicker because it is longer." What is the best correction?
    options:
      - text: 'Thickness is about meaning, not length. B is thick because it records what the act means to those who do it, the layers of significance in their world, and not only the outward movements. A very long note listing only gestures would still be thin.'
        correct: true
        feedback: |
          Yes. For Geertz, the task of the anthropologist is to read the meanings an act carries, which is why he spoke of religion as a system of symbols.
      - text: 'Thick description means describing the act in as much physical detail as possible.'
        feedback: |
          More physical detail still gives only the outward form. The meaning in the participants' world is what thickens a description.
      - text: 'Thick description means giving the observer''s own opinion of the act.'
        feedback: |
          The aim is the meaning for the participants, read as carefully as possible. The observer's verdict is a different thing, and Geertz warned against substituting it.
    explanation: |
      The difference between a wink and a blink is not in the muscles; it is in what is meant. Thick description records that difference.

  - type: mcq
    id: liminal-crowd
    title: "The margin phase is incorporation, and communitas is just a crowd?"
    prompt: |
      Van Gennep (1873-1957) described rites of passage in three phases: separation, a margin (liminal) phase, and incorporation. Turner (1920-1983) studied the middle phase and named the bond that can form there communitas. A student says: "The margin phase is when people are welcomed back into society, and communitas is just what a crowd feels." What is the best correction?
    options:
      - text: 'The welcome back is incorporation, the third phase. The margin (liminal) phase is the middle, in which people are between statuses and ordinary ranks are loosened. Communitas, according to Turner, is the sense of equality and shared humanity that can form among people who go through that phase together, which a mere crowd, held together by nothing but being at the same place, does not need to have.'
        correct: true
        feedback: |
          Yes. The order is separation, margin, incorporation. Whether every culture's rites show communitas in this form is a point on which scholars still argue.
      - text: 'The margin phase is the first, when people leave their old status, and incorporation is the middle.'
        feedback: |
          Separation is the first phase. The margin follows, and incorporation, the return to a new place in society, closes the sequence.
      - text: 'Communitas means the social ranks of a group, the structure that the ritual keeps in place.'
        feedback: |
          It is nearly the opposite: communitas is the bond felt when structure and rank are suspended.
    explanation: |
      The sequence is separation, margin, incorporation. The structure-suspending middle is what makes Turner's communitas possible.

  - type: mcq
    id: rappaport-group
    title: "A ritual is anything done in a group?"
    prompt: |
      A student says: "A ritual is anything people do together: a crowd at a football match, or friends chatting." According to Rappaport (1926-1997), in *Ritual and Religion in the Making of Humanity* (1999), which feature marks a ritual?
    options:
      - text: 'In essence, Rappaport defined ritual as the performance of more or less invariant sequences of formal acts and utterances that the performers did not invent. The mark is a fixed, inherited form, not being in a group and not a religious content: a graduation march qualifies, and free chat does not.'
        correct: true
        feedback: |
          Yes. Rappaport also argued that the fixed form keeps a tradition stable and bounds how far it can be reinterpreted.
      - text: 'Any action done in a group, whatever its form.'
        feedback: |
          Free chat is done in a group without a fixed sequence. By this definition it is not a ritual, because the form is spontaneous.
      - text: 'Any act addressed to a god or spirit.'
        feedback: |
          Rappaport's definition concerns form, not content. A prayer in one's own words is not ritual by it, and a secular ceremony with a fixed order is.
    explanation: |
      The definition picks out the form: invariant, formal, inherited. Content and company are separate matters.

  - type: mcq
    id: doctrinal-word
    title: "Doctrinal means religions with doctrines?"
    prompt: |
      According to Whitehouse (*Modes of Religiosity*, 2004), religious transmission tends toward a doctrinal mode or an imagistic mode. A student says: "The doctrinal mode is for religions that have doctrines, and the imagistic mode is for ones that have images." What is the best correction?
    options:
      - text: 'The names describe how practice is remembered and passed on. The doctrinal mode is frequent, taught, regulated and typical of large communities; the imagistic mode is rare, intense, vivid and typical of small groups. Both can live in the same tradition, so the modes are tendencies, not types of religion.'
        correct: true
        feedback: |
          Yes. A weekly sermon builds doctrine by repetition, a once-in-a-lifetime ordeal leaves an image-like memory, and one church or tradition can contain both.
      - text: 'Doctrinal means a religion with a written creed, and imagistic means a religion with statues or paintings.'
        feedback: |
          The words refer to memory and transmission, not to creeds or statues. A tradition with statues can be doctrinal in its transmission.
      - text: 'Every religion is entirely doctrinal.'
        feedback: |
          Whitehouse's point is that rare, intense rituals such as terrifying initiations work differently from frequent teaching, and each leaves a different kind of memory.
    explanation: |
      The modes link the frequency and intensity of ritual to memory and group size, which joins the anthropology of ritual to the cognitive and group-level work earlier in the level.

  - type: mcq
    id: one-study
    title: "One study proves the function, or heart rates refute the sacred?"
    prompt: |
      Konvalinka and colleagues (*PNAS*, 2011) recorded heart rates at a fire-walking festival in San Pedro Manrique, Spain: 12 fire-walkers, 9 related spectators and 17 unrelated visitors. Arousal in fire-walkers matched that of related spectators strongly, and that of unrelated visitors less. One student says: "This proves that ritual binds groups." Another says: "Measuring heart rates shows the sacred is only physiology." Which assessment is best?
    options:
      - text: 'Neither. A single festival with 38 people is a small natural study: it is consistent with an empathic link between performers and people close to them, and the authors themselves found the picture more subtle than collective effervescence alone. It measures one part of the claim, and it cannot decide what the participants experience as sacred or whether there is anything beyond the physiology.'
        correct: true
        feedback: |
          Yes. A good study shows a pattern in a sample, with limits. A measurement of the body does not decide the object of a belief, which is the same distinction of mechanism and object met in every lesson of the level.
      - text: 'It proves the function, because heart rates cannot lie.'
        feedback: |
          The measurement is real, but the sample is small and chosen by the festival, and the pattern is an association. It supports a link between ritual and shared arousal, and a theory needs more than one such study.
      - text: 'It refutes the sacred, because the sacred has no heart rate.'
        feedback: |
          A body measure shows what accompanies the experience. It does not show that the experience is of nothing, in the same way that a brain scan of seeing does not show there is nothing to see.
    explanation: |
      Studies mark where a finding stops: one sample, one place, one measure. Replication across settings and a theory of what the measure means are the next steps, and neither is an answer to the metaphysical question.

  - type: numeric
    id: konvalinka-n
    title: "How many were measured?"
    prompt: |
      In the Konvalinka study at the San Pedro Manrique fire-walking festival, heart rates were recorded from 12 fire-walkers, 9 related spectators and 17 unrelated visitors. How many people were measured in all?
    answer: 38
    answerText: '38'
    wrong:
      - { value: 29, feedback: 'That leaves out one group. The total includes all three: fire-walkers, related spectators and unrelated visitors.' }
      - { value: 21, feedback: 'That adds only the fire-walkers and related spectators. The 17 unrelated visitors were measured too.' }
    hint: |
      Add the three groups.
    explanation: |
      $12 + 9 + 17 = 38$. A study this size gives a pattern worth noting, not a law.

  - type: mcq
    id: layers-refutation
    title: "A scholarly function refutes the believer's reading?"
    prompt: |
      Ritual can be read in several ways: as a way of binding the community (Durkheim), of coping with danger (Malinowski), of carrying meaning (Geertz), of passing through a change (van Gennep, Turner), or as a fixed form (Rappaport). A student says: "These scholarly readings replace the believer's own account, so the believer's reading is refuted." Which statement fits the course's three layers?
    options:
      - text: 'The scholarly readings describe what ritual does and how it is shaped, which are matters of established fact or scholarly debate (layers 1 and 2). The believer''s reading, that the rite addresses something real, is a faith commitment (layer 3). A function can be documented without settling whether the rite reaches what believers say it reaches, so the two readings can coexist or compete, but one does not refute the other by being a different kind of claim.'
        correct: true
        feedback: |
          Yes. Whether a scholarly account is a rival to the believer's reading or a complement to it depends on a further premise (for example, that the function would arise whether or not the object is real, which is P2 again).
      - text: 'Scholarly readings are layer-3 commitments, and the believer''s reading is established fact.'
        feedback: |
          This swaps the layers. Scholars describe what is observable and debatable; the believer's claim about the object is a commitment, held on faith or on an argument.
      - text: 'All the readings have the same status, because every claim is only an opinion.'
        feedback: |
          They differ. A measured heart rate or a documented ritual sequence is a fact; which theory explains it is a live debate; what the rite finally reaches is a commitment.
    explanation: |
      Keeping the layers apart is the main defence against every shortcut of the round: each turns a function, a cause or a correlation (layers 1 and 2) into a verdict on the object (layer 3), or the reverse.

  - type: text
    id: summary
    title: "What this round tested"
    body: |
      Each trap was a shortcut one step too far. **Causes**: a natural cause does not make a belief false, and a debunking argument needs P2 (the process would give the belief whether or not it is true) and P3 (no independent support), and then concludes the belief is unjustified, not false; the form works against any belief, including unbelief, and the EAAN targets naturalism combined with evolution, not atheism. **Origins**: by-product does not mean worthless and adaptation does not mean true; HADD explains why agent-beliefs come easily and proves nothing about gods, either way; Wilson's group-level adaptation, the gene-level critics' doubt and the by-product camp are three different positions. **Groups**: a costly signal sorts only when $c_C < b < c_F$ (with $c_C = 2$, $c_F = 3$, $b = 5$ it does not). **Culture**: secularisation is contested between existential security, supply-side competition and plausibility under pluralism. **Unbelief**: $r = -0.18$ shares only $r^2 \approx 3.2\%$ of the variation and gives no direction. **Ritual**: a social function does not show believers are fooling themselves (Durkheim), Malinowski linked magic to uncertainty and danger, thick description is about meaning and not length (Geertz), the order is separation, margin, incorporation with communitas in the margin (van Gennep, Turner), ritual is fixed inherited form (Rappaport), the doctrinal and imagistic modes are about transmission and memory (Whitehouse), and a small study such as the 38 people measured in Konvalinka's fire-walking study marks where a finding stops. Under all of them, the three layers: facts and functions are not verdicts on the object.

      Where thoughtful people part ways is in whether a mechanism, once granted, leaves the object open, in how much weight independent support carries, and in which of the rival explanations of religious change fits the data best.

      **Next:** a quick recall of the level's main formulas and distinctions (the lesson Quick Recall), and then its content map.
