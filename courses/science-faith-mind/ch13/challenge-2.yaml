id: ch13-challenge-2
title: "Level Challenge: Explaining Belief, Judging Belief (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: the same village, two more problems"
    body: |
      The two problems in this part take place in the same invented village, Hollin, with its belief in a watchful presence, the Keeper, at the old spring, and its skeptical neighbour Maro and believing neighbour Ilse. Every name and number is made up. The problems are independent, so the toolkit is restated.

      - **Debunking argument.** P1: the belief has a real cause. P2: that process would have produced the belief whether or not it is true. P3: there is no independent support for the belief. C: the belief is unjustified (not shown false). The test is "would the process give this belief if it were false?"; a critic who accepts the cause but rejects the argument must reject P2 or P3.
      - **Odds.** With $X$ the claim and $E$ the evidence,
      $$\begin{aligned}\text{posterior odds}={}&\frac{P(E\mid X)}{P(E\mid\neg X)}\\&\times\text{prior odds}\end{aligned}$$
      and the odds $o$ turn back into a probability by $p=o/(1+o)$.
      - **Costly signal.** A ritual costs a committed member $c_C$ and a faker $c_F$, and membership is worth $b$ to both. Following the idea that honest signals are costly (a toy version of the handicap principle),
      $$c_C<b<c_F$$
      means the committed join and the fakers stay out.
      - **Agency detection.** Reacting to an ambiguous sign beats ignoring it when the chance $p$ of a real agent exceeds $p^*=\dfrac{C_{\text{alarm}}}{C_{\text{alarm}}+C_{\text{miss}}}$.
      - **Three layers:** established fact, live debate, faith or metaphysical commitment.

      Problem 4 is about culture and ritual, and problem 5 weighs the whole level.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · The two generations of Hollin"
    body: |
      **Problem 4.** A visiting sociologist asks adults in Hollin whether they believe the Keeper watches the spring. Of $300$ adults born before the valley road was built, $240$ say yes. Of $300$ adults born after it, $150$ say yes.

      In the same decades three things happened in Hollin. Harvests stopped failing and a clinic opened (life became much safer). A second gathering, led by a travelling preacher, began to compete with the spring shrine for members. And the road brought traders and neighbours who hold other beliefs, so a young person now meets people who do not believe in the Keeper.

      Three readings of the fall in belief are on offer. **Existential security** (Pippa Norris and Ronald Inglehart, *Sacred and Secular*, 2004): when survival is no longer in doubt, people feel less need for religion. **Supply and competition** (Rodney Stark and Roger Finke, *Acts of Faith*, 2000): demand for religion stays roughly constant, and what changes is how well religious groups compete for members. **Plausibility and pluralism** (Peter Berger, *The Sacred Canopy*, 1967): a belief feels certain when everyone around you shares it, and meeting people who do not weakens that feeling.

      Your task: say how big the fall is, what each reading predicts elsewhere, and what data would separate them.

  - type: numeric
    id: p4-fall
    title: "How large is the fall?"
    prompt: |
      In Hollin, $240$ of $300$ adults born before the road believe in the Keeper, and $150$ of $300$ born after it do. By what fraction of the older share did belief fall? Give a percentage.
    answer: 37.5
    tolerance: 0.05
    answerText: '37.5'
    hint: |
      Find each share first ($240/300$ and $150/300$), subtract, and compare the drop with the older share.
    wrong:
      - { value: 30, feedback: "That is the drop in percentage points, $80\\%-50\\%$. The question asks for the drop as a fraction of the older share, $30/80$." }
      - { value: 62.5, feedback: "That is the younger share relative to the older, $50/80$, the part that remains rather than the part that fell." }
    explanation: |
      The shares are $240/300=80\%$ and $150/300=50\%$. The drop is $30$ percentage points, which is $30/80=37.5\%$ of the older share. That is an established fact about the survey. Why the drop happened is another matter: all three changes came together in Hollin.

  - type: mcq
    id: p4-predict
    title: "What does each reading predict elsewhere?"
    prompt: |
      Consider another village, Quarry Ford. It also got a road and a clinic, so life there is just as safe now, but it still has only one shrine, which all the families attend, and almost everyone in the valley shares the same belief. Three readings of the fall in belief in Hollin: existential security, supply and competition, plausibility and pluralism. Which pairing of reading and prediction for Quarry Ford is right?
    options:
      - text: 'Existential security predicts belief falls there too, since life is safe. Supply and competition predicts the lone shrine stays weak and unengaged, since it has no rival pushing it. Pluralism predicts belief stays firm, since nobody there meets a different view.'
        correct: true
      - text: 'Existential security predicts belief stays firm, since safety makes people grateful. Supply predicts it falls. Pluralism predicts it falls.'
        feedback: |
          Safety is read by this view as lowering the felt need for religion, not as raising it. And pluralism needs a mix of views to bite; with none, it has nothing to erode.
      - text: 'All three predict the same thing for Quarry Ford, since belief in Hollin fell for all three reasons at once.'
        feedback: |
          In Hollin the three changes arrived together, so Hollin cannot tell the readings apart. A village where the changes come apart is exactly where they make different predictions.
    explanation: |
      Hollin is a poor test because safety, rival gatherings and contact with other views all grew together. Quarry Ford has safety without rivals and without contact, so the readings come apart: security predicts a fall, supply predicts a sluggish monopoly (not necessarily a loss of belief), and pluralism predicts firmness. The readings are also not exclusive; each could be partly right.

  - type: mcq
    id: p4-separate
    title: "Which comparison separates them?"
    prompt: |
      Two valley villages are equally safe, with the same road and clinic. In village M one shrine serves everyone. In village R three gatherings compete for members and families meet people of other beliefs. A researcher can measure two things in each: how often people attend and how certain they are the Keeper exists. Which result would favour supply and competition over existential security?
    options:
      - text: 'Attendance is higher in R than in M, although the two are equally safe.'
        correct: true
      - text: 'Attendance and certainty are the same in M and R.'
        feedback: |
          That is what existential security predicts, since the two villages are equally safe. It would count against supply and against pluralism.
      - text: 'Certainty is lower in R than in M.'
        feedback: |
          That favours the pluralism reading (meeting other views weakens plausibility). It is silent on supply, which is about activity and membership rather than certainty.
    explanation: |
      Holding safety fixed removes the security reading from the contest: it predicts no difference. Higher attendance in R then points to competition (supply), and lower certainty in R to pluralism. Both could appear together, which is why the researcher measures two things. A 2002 study by David Voas, Daniel Olson and Alasdair Crockett found no compelling evidence that pluralism raises or lowers participation in the way the supply argument claims, which shows how live the debate is.

  - type: mcq
    id: p4-berger
    title: "What does Berger's change of mind show?"
    prompt: |
      Peter Berger argued in 1967 that pluralism erodes the plausibility of belief, and so favoured the expectation that modern societies grow less religious. In 1999 he edited a volume, *The Desecularization of the World*, arguing that this expectation had been falsified by the continued strength of religion in much of the world. What is a fair lesson for Hollin?
    options:
      - text: 'A reading of why belief changes is a hypothesis: it can be tested against new data and given up, so none of the three readings should be held as a settled fact.'
        correct: true
      - text: 'Because Berger changed his mind, his 1967 reading must be false for Hollin.'
        feedback: |
          His later view concerned the world as a whole, not Hollin. A thinker's change of mind is not a refutation of the earlier idea in every case; it only shows that the idea was open to test.
      - text: 'Because he changed his mind, thinkers cannot be trusted and the question has no answer.'
        feedback: |
          Updating on evidence is what a good method does. The open question is which reading fits which place, not whether any can be known.
    explanation: |
      Berger is useful here because he held a reading, then reported that the world did not fit it. In Hollin the question stays open until a village where the three changes come apart is surveyed, which is the logic of the last two cards.

  - type: text
    id: p4-rite
    title: "Problem 4, part two · The rite at the mill"
    body: |
      Hollin has a rite for fifteen-year-olds. At dawn each youth leaves the family house, has their hair cut, and gives up their old coat. For three nights they stay together in the loft of the old mill, fast, wear identical grey smocks, and do tasks side by side with no family names used; elders tell riddles and no one has rank over another. On the fourth morning they are carried across the spring bridge, given an adult's shawl, and seated with the elders at the spring feast.

      Arnold van Gennep (1873 to 1957) described in *Les rites de passage* (1909) that many rites that move a person from one position in society to another have three phases: **separation** (leaving the old position), **transition** (the in-between, the threshold; the Latin for threshold is *limen*) and **incorporation** (being received into the new position). Victor Turner (1920 to 1983), in *The Ritual Process* (1969), took up the middle phase, which he called **liminality** (being on the threshold), and described the equal, rank-free bond of those in it as **communitas**.

  - type: order
    id: p4-phases
    title: "Order the phases of the rite"
    prompt: |
      The Hollin rite for fifteen-year-olds has three phases in the order van Gennep described. Put the events in the order they happen.
    steps:
      - 'Dawn: the youth leaves the family house, has their hair cut and gives up the old coat.'
      - 'Three nights in the mill loft: fasting, identical grey smocks, tasks side by side, no family names.'
      - 'Fourth morning: carried over the spring bridge, given the adult shawl, seated with the elders.'
    hint: |
      Leaving first, then the in-between, then being received.
    explanation: |
      The events are in the order of the rite, and they match the three phases: separation, transition (liminality), incorporation. The order is also logical: no one can be received into a position before they have left the old one.

  - type: mcq
    id: p4-communitas
    title: "Which detail is communitas?"
    prompt: |
      Turner picked out, in the middle phase of a rite of passage, the bond of people who have been stripped of rank and treated as equals (communitas). Which detail of the Hollin rite shows it?
    options:
      - text: 'In the mill loft, all youths wear identical grey smocks, family names are not used, and no one has rank over another.'
        correct: true
      - text: 'At dawn the hair is cut and the old coat is given up.'
        feedback: |
          That is the leaving, the separation phase. It does remove a mark of the old position, but communitas is the equality of the in-between, not the leaving.
      - text: 'The youth is given an adult shawl and a seat among the elders.'
        feedback: |
          That is incorporation: the youth takes a place in the new structure of ranks, the opposite of the rank-free middle.
    explanation: |
      Turner's point is that the middle phase suspends the ordinary structure (families, ranks) for a while, and that the shared equality makes a strong bond. The haircut belongs to separation and the shawl to incorporation.

  - type: mcq
    id: p4-readings
    title: "Three anthropologists read the same rite"
    prompt: |
      Three readings of why Hollin keeps the rite. (a) It makes the group visible and felt: the shared fast and shared work renew the bonds that hold the village together. (b) It eases the anxiety of an uncertain moment, when youths face the dangers and duties of adult life, by giving them something to do. (c) Its meaning lies in what the smock, the fast and the riddles say to the people in it, found by describing the rite closely. Which pairing names the thinkers correctly: Emile Durkheim (1858 to 1917), Bronislaw Malinowski (1884 to 1942), Clifford Geertz (1926 to 2006)?
    options:
      - text: '(a) Durkheim, (b) Malinowski, (c) Geertz.'
        correct: true
      - text: '(a) Malinowski, (b) Durkheim, (c) Geertz.'
        feedback: |
          These are swapped. Durkheim's emphasis is on the group and its bonds (the sacred as society felt by its members); Malinowski's, in the example of fishing in the lagoon against fishing in the open sea, is on magic and ritual as a response to uncertainty and danger.
      - text: '(a) Durkheim, (b) Geertz, (c) Malinowski.'
        feedback: |
          Geertz is the one who stresses meaning and the close description of what a practice says to those in it (thick description). Malinowski stresses what a practice does for an anxious person.
    explanation: |
      The readings are not exclusive: a rite can bind a group, calm nerves and carry meaning. They differ in what they ask the observer to look at: the group, the person under stress, or the meaning for the participants. None of them says whether the Keeper exists. They are layer-2 accounts of why the rite is kept, not layer-3 claims about what the rite is about.

  - type: mcq
    id: p4-cred
    title: "Which act is a credibility-enhancing display?"
    prompt: |
      The youths of Hollin are told by four adults that the Keeper is real. Joseph Henrich (2009) called an act a **credibility-enhancing display** (CRED) when it is costly for the person unless they truly hold the belief they profess, so learners can trust the belief is sincerely held. Which adult gives a CRED?
    options:
      - text: 'The miller, who gave up three nights of paid work each year to fast at the spring and pays for its upkeep from his own savings.'
        correct: true
      - text: 'A preacher, paid for each sermon, who speaks very forcefully about the Keeper.'
        feedback: |
          Forceful speech costs nothing, and the pay gives a reason to say it whether he believes it or not.
      - text: 'A trader who wears a charm of the Keeper, bought cheaply, to please customers in the valley.'
        feedback: |
          A cheap charm worn for business reasons would be worn whatever the trader believed, so it shows nothing about sincerity.
    explanation: |
      A CRED is evidence of sincerity, not of truth. The miller's costly acts would make little sense if he did not believe, so the youths may learn the belief with more confidence. Notice how this fits the debunking test: the learners' route to the belief is sensitive to what the model believes, but a sincere model can still be mistaken. Whether the Keeper is real is untouched.

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-setup
    title: "Problem 5 · Weighing the two arguments"
    body: |
      **Problem 5.** Maro says: "You believe in the Keeper because you were raised to. The cause is a blind process, nothing independent supports the belief, so your belief is unjustified." Ilse answers: "You do not believe because you grew up safe, in a town with a clinic, among people who rarely talk of such things. That cause is just as blind. Nothing independent supports your unbelief, so yours is unjustified too." (Maro and Ilse are invented.)

      Ilse then adds fresh evidence. The miller's log shows that in forty years, including three drought years, the spring never ran dry. She says a chance of this is $0.9$ if the Keeper keeps the spring, and Maro says it is $0.6$ if there is no Keeper, because springs in the valley seldom fail. Their starting views differ: Ilse's chance of a Keeper is $0.10$, Maro's is $0.02$.

      Your task: compare the two arguments, find where each turns, update both, and say what is left open.

  - type: mcq
    id: p5-symmetry
    title: "Is Ilse's argument weaker in form?"
    prompt: |
      Maro's argument against belief has the form P1 (a real cause), P2 (the process would give the belief whether or not it is true), P3 (no independent support), C (unjustified). Ilse's argument against unbelief has the same four steps, with a different cause. What follows about the two?
    options:
      - text: 'They stand or fall together in form. If the form is valid for one, it is for the other; any difference lies in whether each premise is true of each side.'
        correct: true
      - text: 'Maro''s argument is stronger because belief in a Keeper is the unusual claim.'
        feedback: |
          Which claim is unusual is a matter of the prior, not of the form. The form of the argument does not depend on the claim being argued about.
      - text: 'Ilse''s argument is the genetic fallacy and Maro''s is not.'
        feedback: |
          Both conclude "unjustified", not "false", and both work only if P2 and P3 hold. If one is a genetic fallacy because it argues from origin alone, so is the other.
    explanation: |
      This is the symmetry from the lesson on the reverse direction: explaining a belief and explaining a non-belief are the same kind of move. A cause is a cause. What decides each case is whether the process is blind to the truth (P2) and whether anything independent is left (P3).

  - type: mcq
    id: p5-weight
    title: "Which premise carries the weight?"
    prompt: |
      Consider the two arguments side by side.

      | | Against belief | Against unbelief |
      |---|---|---|
      | P1 | Raised in believing homes (survey) | Raised safe, in a secure town |
      | P2 | Upbringing would give the belief anyway | Security would give the unbelief anyway |
      | P3 | No independent support | No independent support |

      Which statement says where the dispute turns for both arguments?
    options:
      - text: 'P1 is a fact of the surveys and neither side denies it; the dispute turns on P2 (is the process blind to the truth?) and P3 (is there independent support?), which is the same question for both.'
        correct: true
      - text: 'P1 is the weak premise on both sides, since surveys cannot show causes.'
        feedback: |
          Surveys can show strong links, such as the ratio of $3$ in part 1. The believers and the skeptics here mostly grant the cause; they dispute what follows from it.
      - text: 'P3 is already settled against belief and for unbelief, since unbelief makes no claim.'
        feedback: |
          Unbelief makes a claim too (that no Keeper watches), and the symmetry card shows the same form of attack. P3 is open for both.
    explanation: |
      The method is useful because it relocates the disagreement. It is not about whether the causes exist but about whether a process that would give the belief either way leaves any reason standing, and about whether outside support exists. Both sides must answer the same two questions.

  - type: numeric
    id: p5-ilse
    title: "Ilse updates"
    prompt: |
      The spring never ran dry in forty years. The chance of that is $0.9$ if there is a Keeper and $0.6$ if not. Ilse's chance of a Keeper before this is $0.10$. Using the odds form, what is her chance afterwards? Give a percentage to two decimals.
    answer: 14.29
    tolerance: 0.01
    answerText: '14.29'
    hint: |
      The prior odds are $0.10/0.90=1/9$; the ratio is $0.9/0.6=1.5$. Multiply, then turn the odds back into a probability.
    wrong:
      - { value: 15, feedback: "That multiplies the prior probability by the ratio ($0.10\\times1.5$). The ratio multiplies the odds, not the probability." }
      - { value: 16.67, feedback: "That is the posterior odds, $1/6$, written as if they were a probability. Odds of $1$ to $6$ mean $1$ part in $7$." }
    explanation: |
      The prior odds are $0.10/0.90=1/9$, the likelihood ratio is $0.9/0.6=1.5$, so the posterior odds are
      $$\tfrac19\times\tfrac32=\tfrac16$$
      and the probability is $\frac{1/6}{1+1/6}=\frac17\approx14.29\%$. Evidence with a ratio of $1.5$ is a small push.

  - type: numeric
    id: p5-maro
    title: "Maro updates with the same data"
    prompt: |
      Same data and the same two chances ($0.9$ and $0.6$), but Maro's chance of a Keeper before this is $0.02$. What is his chance afterwards? Give a percentage to two decimals.
    answer: 2.97
    tolerance: 0.01
    answerText: '2.97'
    hint: |
      The prior odds are $0.02/0.98=1/49$. Multiply by $1.5$ and convert back with $p=o/(1+o)$.
    wrong:
      - { value: 4.5, feedback: "That is a different sum: it is not the odds route." }
    explanation: |
      The prior odds are $1/49$ and the posterior odds are $\tfrac{1}{49}\times\tfrac32=\tfrac{3}{98}$, so the probability is $\frac{3/98}{1+3/98}=\frac{3}{101}\approx2.97\%$. With such a small prior the odds route and the "multiply the probability" shortcut nearly agree, but only the odds route stays correct when the prior is large.

  - type: mcq
    id: p5-gap
    title: "What does the remaining gap show?"
    prompt: |
      After the same data, Ilse is at about $14.3\%$ and Maro at about $3.0\%$, both moved up by the same factor $1.5$ in the odds. A friend says: "Since they saw the same log, they should now agree." What is the best reply?
    options:
      - text: 'The same data moved them by the same factor, so their gap came from the priors and from how each judged the two chances; a larger ratio, or many independent pieces, would be needed to bring them together.'
        correct: true
      - text: 'Bayes'' rule says priors do not matter, so one of them has made an error.'
        feedback: |
          Priors matter, especially when the evidence is weak. With a ratio of only $1.5$ they stay far apart. Bayes' rule does not fix a prior; it says how to move from one.
      - text: 'Since the data favoured a Keeper, Maro must now accept Ilse''s $14.3\%$.'
        feedback: |
          Maro starts from his own prior and reaches $3.0\%$ using the same rule. Accepting the data does not mean accepting someone else''s starting point.
    explanation: |
      Note a further limit: the two chances $0.9$ and $0.6$ were stated by the two sides, and a different account of what a Keeper would do would change them. The log is a fact (layer 1); the chances are judgements (layer 2 at best). The priors reflect wider commitments (layer 3). The method does not remove the gap. It shows exactly where it sits.

  - type: order
    id: p5-order
    title: "Order a fair weighing"
    prompt: |
      Put the steps of a fair weighing of a belief and its denial in order.
    steps:
      - 'State both arguments in the same form: cause, blind process, lack of independent support, conclusion.'
      - 'Grant the causes that the data show, and apply the test "would the process give this if it were false?" to each side.'
      - 'Ask what independent support each side has, and write down the chances it implies.'
      - 'Update from each side''s prior with the odds form and see how far apart the results are.'
      - 'Label what remains: fact, live debate or faith commitment, and name the premise or prior where they part.'
    hint: |
      Form first, then the test, then evidence, then numbers, then labels.
    explanation: |
      The order matters: numbers come after the form and the test, because the ratio depends on what each side counts as support, and labels come last because they describe what the weighing left unsettled.

  - type: mcq
    id: p5-layers
    title: "Which layer does each claim belong to?"
    prompt: |
      Sort three claims. (a) In the United States, adults with no religion rose from $16.1\%$ in 2007 to $22.8\%$ in 2014 (Pew surveys). (b) Rites of passage keep a village together mainly by binding its members, rather than mainly by calming their anxiety. (c) The universe is not the work of a mind that cares for it.
    options:
      - text: '(a) established fact; (b) live debate among anthropologists; (c) faith or metaphysical commitment.'
        correct: true
      - text: '(a) live debate; (b) established fact; (c) established fact.'
        feedback: |
          The survey percentages are a record. And (b) is contested between schools of anthropology, while (c) cannot be settled by any survey or ritual study.
      - text: '(a) established fact; (b) faith commitment; (c) live debate.'
        feedback: |
          (b) is an empirical-interpretive question that scholars argue by evidence, not a creed. (c) is not a scholarly question about the facts; it is a stance on what reality is like.
    explanation: |
      The same sorting applies to belief and unbelief alike: "there is a mind behind the world" and "there is not" are both layer 3. The level's methods cover layers 1 and 2 well and mark the border of layer 3 clearly, which is the main gain.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Problem 4, culture and ritual.** In Hollin the share of believers fell from $240/300=80\%$ to $150/300=50\%$, a drop of $30/80=37.5\%$ of the older share. Existential security (Norris and Inglehart), supply and competition (Stark and Finke) and plausibility and pluralism (Berger, 1967) fit it, but safety, rivals and contact with other views arrived together, so only a village where they come apart (safe but without rivals) separates them. A rite of passage has separation, transition (liminality, with the rank-free bond Turner called communitas) and incorporation (van Gennep). Durkheim reads such a rite as binding the group, Malinowski as easing anxiety, Geertz as meaning found by close description. A credibility-enhancing display (Henrich 2009) is a costly act that makes sense only if the actor believes, so it is evidence of sincerity, not of truth.
      - **Problem 5, weighing.** The argument against belief and the argument against unbelief have the same form, P1 cause, P2 blind process, P3 no independent support, C unjustified, so they stand or fall together. Both sides grant the causes; the dispute turns on P2 and P3. With a ratio $0.9/0.6=1.5$,
      $$\begin{aligned}\text{prior }0.10&\to\tfrac19\times\tfrac32=\tfrac16\to14.29\%\\\text{prior }0.02&\to\tfrac1{49}\times\tfrac32=\tfrac3{98}\to2.97\%\end{aligned}$$
      so the same data left the gap that the priors made. Order of work: same form, test, support, odds, labels.
      - **Method.** Sort each claim into established fact, live debate, or faith commitment, and name the premise, the chance or the prior where thoughtful people part ways.

      **Next:** Partial Exam 2, on Levels 8 to 13 (the nature of God, science and religion, consciousness, altered states, experience and why humans believe), comes before Level 14.
