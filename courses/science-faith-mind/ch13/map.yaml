outroTitle: Level 13 in one picture
outro: |
  Archaeology shows how early belief can be read and how little a ritual centre proves alone. Minds built to see agents and cooperate give a by-product story, the group and its costly signals give an adaptation story, culture explains why the outcome differs from place to place, and the anthropologists ask what rituals do for those who perform them. The debunking argument asks whether such a cause drains the justification for a belief, the odds form measures how much, and the same test applies to unbelief. What stays open is the third layer: whether any belief is true.
