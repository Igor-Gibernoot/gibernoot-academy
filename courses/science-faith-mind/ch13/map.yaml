id: ch13-map
title: "Content Map: Why Humans Believe"
kind: map
name: Level 13, Why Humans Believe (archaeology of belief, agency detection and counterintuitive ideas, costly signals and cooperation, three readings of cultural change, the debunking argument, the odds form of Bayes' rule, accounts of unbelief, rites of function and meaning, rites of passage, the three layers)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 13 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a rung of the ladder skipped, a cost swapped, a school given the wrong claim, a premise misread, a layer mislabelled), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: origins
    title: Where religion comes from
    row: 1
    col: 1
    body: |
      To read belief from remains, archaeologists climb a ladder of three rungs: the practice was **deliberate**, it was **not merely practical**, and it carried a **meaning of a belief kind**. At Göbekli Tepe (about 9500 to 8000 BCE), hunter-gatherers raised T-shaped pillars 3 to 5.5 m high; Klaus Schmidt read it as a ritual centre, others as a settlement with a ritual part. According to Peoples, Duda and Marlowe (2016), active high gods appear in only about 15% of 33 hunter-gatherer societies.
    decoys:
      - body: |
          To read belief from remains, archaeologists climb a ladder of three rungs: the practice was **deliberate**, it was **not merely practical**, and it carried a **meaning of a belief kind**. At Göbekli Tepe (about 9500 to 8000 BCE), hunter-gatherers raised T-shaped pillars 3 to 5.5 m high; Klaus Schmidt read it as a ritual centre, others as a settlement with a ritual part. According to Peoples, Duda and Marlowe (2016), active high gods appear in about 85% of 33 hunter-gatherer societies.
        feedback: |
          The figure is reversed. In that sample active high gods were uncommon among hunter-gatherers (about 15%, around 5 of 33), so powerful moralising gods look like a later development.
      - body: |
          To read belief from remains, archaeologists need only one rung: the practice was **deliberate**, and a deliberate burial or monument is then proof of belief. At Göbekli Tepe (about 9500 to 8000 BCE), hunter-gatherers raised T-shaped pillars 3 to 5.5 m high; Klaus Schmidt read it as a ritual centre, others as a settlement with a ritual part.
        feedback: |
          Deliberate is only the bottom rung. A careful act can be practical (a tidy burial for hygiene), and even a non-practical one must be shown to carry a belief-kind meaning before it counts as evidence of belief.
    explanation: |
      The root of the level: before asking why people believe, ask what the earliest evidence of belief would look like and how much it can bear.

  - id: cognition
    title: Minds built to see agents
    row: 1
    col: 2
    body: |
      According to Guthrie (1993) and Barrett (2000), a **hyperactive agency detection device** (HADD) errs towards seeing an agent, because a missed predator costs far more than a false alarm. With $p$ the chance the rustle is a predator, $C_{\text{miss}}$ the cost of ignoring it and $C_{\text{alarm}}$ the cost of reacting:
      $$p^{*}=\frac{C_{\text{alarm}}}{C_{\text{alarm}}+C_{\text{miss}}}$$
      is the break-even chance above which reacting pays (for $C_{\text{alarm}}=1$, $C_{\text{miss}}=100$, about 1%). Boyer adds that ideas with one or two violations of intuition are remembered best.
    decoys:
      - body: |
          According to Guthrie (1993) and Barrett (2000), a **hyperactive agency detection device** (HADD) errs towards seeing an agent, because a missed predator costs far more than a false alarm. With $p$ the chance the rustle is a predator, $C_{\text{miss}}$ the cost of ignoring it and $C_{\text{alarm}}$ the cost of reacting:
          $$p^{*}=\frac{C_{\text{miss}}}{C_{\text{alarm}}+C_{\text{miss}}}$$
          is the break-even chance above which reacting pays (for $C_{\text{alarm}}=1$, $C_{\text{miss}}=100$, about 99%). Boyer adds that ideas with one or two violations of intuition are remembered best.
        feedback: |
          The costs are swapped. Setting $pC_{\text{miss}}=(1-p)C_{\text{alarm}}$ gives $C_{\text{alarm}}$ on top; when a miss is costly, the break-even chance is tiny, so reacting to a 2% rustle pays.
      - body: |
          According to Guthrie (1993) and Barrett (2000), a **hyperactive agency detection device** (HADD) errs towards seeing an agent, because a false alarm costs far more than a missed predator. With $p$ the chance the rustle is a predator, $C_{\text{miss}}$ the cost of ignoring it and $C_{\text{alarm}}$ the cost of reacting:
          $$p^{*}=\frac{C_{\text{alarm}}}{C_{\text{alarm}}+C_{\text{miss}}}$$
          is the break-even chance above which reacting pays. Boyer adds that ideas with many violations of intuition are remembered best.
        feedback: |
          The asymmetry runs the other way: the device is jumpy because ignoring a real predator is the expensive error. And the memorable ideas are the minimally counterintuitive ones (one or two violations); many violations are too strange to be kept.
    explanation: |
      The by-product reading of religion starts here: tools that evolved for other jobs, such as spotting predators and reading minds, may also make gods easy to think.

  - id: group
    title: Religion and the group
    row: 1
    col: 3
    body: |
      According to Irons (2001), building on Zahavi's handicap principle (1975), a costly ritual shows commitment: it costs a committed member $c_C$ and a faker $c_F$, and it sorts them when the benefit $b$ of acceptance satisfies
      $$c_C<b<c_F$$
      In a public-goods game with $n=4$, endowment $e=10$ and multiplier $m=1.6$, all giving yields $16$ each, a lone free rider gets $22$ (the others $12$), and all keeping yields $10$. Whether religion is a by-product, an adaptation, or both stays a live debate.
    decoys:
      - body: |
          According to Irons (2001), building on Zahavi's handicap principle (1975), a costly ritual shows commitment: it costs a committed member $c_C$ and a faker $c_F$, and it sorts them when the benefit $b$ of acceptance satisfies
          $$c_F<b<c_C$$
          In a public-goods game with $n=4$, endowment $e=10$ and multiplier $m=1.6$, all giving yields $16$ each, a lone free rider gets $22$ (the others $12$), and all keeping yields $10$. Whether religion is a by-product, an adaptation, or both stays a live debate.
        feedback: |
          The costs are swapped. The signal works because it is cheap enough for the committed ($c_C<b$) and too dear for the faker ($b<c_F$).
      - body: |
          According to Irons (2001), building on Zahavi's handicap principle (1975), a costly ritual shows commitment: it costs a committed member $c_C$ and a faker $c_F$, and it sorts them when the benefit $b$ of acceptance satisfies
          $$c_C<b<c_F$$
          In a public-goods game with $n=4$, endowment $e=10$ and multiplier $m=1.6$, all giving yields $16$ each, a lone free rider gets $12$ (the others $22$), and all keeping yields $10$. Whether religion is a by-product, an adaptation, or both stays a live debate.
        feedback: |
          The payoffs are swapped. The free rider keeps her 10 and also gets a share of the pot, $10+12=22$; each giver ends with only the share, $12$.
    explanation: |
      The adaptation reading: religion, or some of its rituals, may have helped groups trust one another and keep free riders out.

  - id: culture
    title: Culture and secularisation
    row: 2
    col: 3
    body: |
      Three rival readings of why belief varies and shifts. **Existential security** (Norris and Inglehart, 2004): religiosity stays high where life is vulnerable and declines where people feel safe. **Religious economies** (Stark and Finke, 2000): demand is roughly constant and differences come from supply, so competing churches raise participation. **Plausibility** (Berger, 1967): in a mixed society a belief no longer feels obvious but like a choice. A gap between groups fits any of them without proving one.
    decoys:
      - body: |
          Three rival readings of why belief varies and shifts. **Existential security** (Norris and Inglehart, 2004): religiosity stays high where life is vulnerable and declines where people feel safe. **Religious economies** (Stark and Finke, 2000): demand is roughly constant and differences come from supply, so a single state church raises participation. **Plausibility** (Berger, 1967): in a mixed society a belief no longer feels obvious but like a choice. A gap between groups fits any of them without proving one.
        feedback: |
          Stark and Finke argue that competition raises participation, and that a monopoly church tends to lower it. Supply matters, but the free-market direction is the opposite of this card.
      - body: |
          Three rival readings of why belief varies and shifts. **Existential security** (Norris and Inglehart, 2004): religiosity stays high where life is safe and declines where people feel vulnerable. **Religious economies** (Stark and Finke, 2000): demand is roughly constant and differences come from supply, so competing churches raise participation. **Plausibility** (Berger, 1967): in a mixed society a belief no longer feels obvious but like a choice. A gap between groups proves the first one.
        feedback: |
          Two slips. The security theory says insecurity raises religiosity, not safety. And a gap between groups never proves a theory: age, region or schooling could drive it, or the direction could be reversed.
    explanation: |
      Cognition and the group give general tendencies; culture explains why they come out so differently from place to place and time to time.

  - id: debunk
    title: The debunking argument
    row: 2
    col: 2
    body: |
      A **debunking argument** has three premises: P1, a real cause explains why we hold the belief; P2, that process would have given us the belief whether or not it is true; P3, nothing independent supports the belief. Conclusion C: the belief is **unjustified**, not shown **false**. The test is "would the process give it if false?". Replies: supply independent support, or deny P2 (Plantinga, Clark and Barrett).
    decoys:
      - body: |
          A **debunking argument** has three premises: P1, a real cause explains why we hold the belief; P2, that process would have given us the belief only if it is true; P3, nothing independent supports the belief. Conclusion C: the belief is **false**. The test is "would the process give it if false?". Replies: supply independent support, or deny P2 (Plantinga, Clark and Barrett).
        feedback: |
          P2 says the process would give the belief whether or not it is true; that is what drains the evidence. And the conclusion is only that the belief is unjustified. Calling it false is the genetic fallacy.
      - body: |
          A **debunking argument** has three premises: P1, a real cause explains why we hold the belief; P2, that process would have given us the belief whether or not it is true; P3, nothing independent supports the belief. Conclusion C: the belief is **unjustified**, not shown **false**. The test is "is there a cause?". Replies: none, because any cause refutes the belief.
        feedback: |
          Every belief has a cause, including our trusted ones, so a cause alone proves nothing. The test is whether the process would give the belief even if it were false, and the replies are independent support or denying P2.
    explanation: |
      The turning point of the level: explaining where a belief comes from is not the same as judging it, and the argument shows exactly when it might be.

  - id: odds
    title: Cause as evidence
    row: 3
    col: 3
    body: |
      In the odds form of Bayes' rule, posterior odds equal the likelihood ratio times the prior odds. If the cause would produce the belief equally whether or not it is true, the ratio is $1$ and the prior is unchanged. With prior $0.2$ (odds $1:4$): ratio $12$ gives odds $3$, probability $0.75$; ratio $2$ gives $1/3$; ratio $1$ gives $0.2$.
    decoys:
      - body: |
          In the odds form of Bayes' rule, posterior odds equal the likelihood ratio times the prior odds. If the cause would produce the belief equally whether or not it is true, the ratio is $1$ and the posterior is even odds. With prior $0.2$ (odds $1:4$): ratio $12$ gives odds $3$, probability $0.75$; ratio $2$ gives $1/3$; ratio $1$ gives $0.5$.
        feedback: |
          A ratio of 1 multiplies the odds by 1, so nothing changes: the posterior stays at the prior, $0.2$. Even odds would need the evidence to favour the claim by 4 to 1.
      - body: |
          In the odds form of Bayes' rule, posterior odds equal the likelihood ratio times the prior odds. If the cause would produce the belief equally whether or not it is true, the ratio is $1$ and the prior is unchanged. With prior $0.2$ (odds $1:4$): ratio $12$ gives probability $12\times0.2=2.4$; ratio $2$ gives $0.4$; ratio $1$ gives $0.2$.
        feedback: |
          The ratio multiplies the odds, not the probability (a probability cannot reach $2.4$). Odds $1/4\times12=3$ convert to probability $3/(1+3)=0.75$.
    explanation: |
      The same argument in numbers: a debunking cause matters exactly to the extent that it makes the belief likelier if it is false, and a ratio near 1 leaves the belief where it was.

  - id: reverse
    title: The same test for unbelief
    row: 3
    col: 2
    body: |
      Unbelief has causes too. Pennycook et al. (2016, 31 studies, $N=15{,}078$) found a correlation $r=-0.18$ between analytic thinking and belief, so $r^2\approx3.2\%$ of the variation is shared. Four routes to unbelief: mindblind, analytic, existential security and credibility. The P1 to P3 test applies equally to both sides; Plantinga's argument targets naturalism with evolution, not atheism.
    decoys:
      - body: |
          Unbelief has causes too. Pennycook et al. (2016, 31 studies, $N=15{,}078$) found a correlation $r=-0.18$ between analytic thinking and belief, so $r^2\approx18\%$ of the variation is shared. Four routes to unbelief: mindblind, analytic, existential security and credibility. The P1 to P3 test applies equally to both sides; Plantinga's argument targets naturalism with evolution, not atheism.
        feedback: |
          The shared variation is $r^2$, not $r$: $0.18^2\approx0.032$, about 3%. A small correlation leaves almost all of the variation to other causes.
      - body: |
          Unbelief has causes too. Pennycook et al. (2016, 31 studies, $N=15{,}078$) found a correlation $r=-0.18$ between analytic thinking and belief, so $r^2\approx3.2\%$ of the variation is shared. Four routes to unbelief: mindblind, analytic, existential security and credibility. The P1 to P3 test applies only to belief, since reasoning has no debunkable causes; Plantinga's argument targets atheism.
        feedback: |
          Thinking is caused too, so the symmetry holds: a cause of unbelief does not make it false either. And Plantinga's argument targets the combination of naturalism and evolution, which atheists may or may not hold.
    explanation: |
      The mirror of the debunking argument: if causes undermined belief, they would undermine unbelief equally, and the honest course is to apply one standard to both.

  - id: ritual
    title: What rituals do
    row: 2
    col: 1
    body: |
      Anthropologists answer in different ways. According to Durkheim (1858-1917), gathering in ritual produces **collective effervescence** and the sacred stands for the group. According to Malinowski (1884-1942), magic appears where danger and uncertainty are high (open-sea fishing) and not where skill suffices (the lagoon). According to Geertz (1926-2006), religion is a **system of symbols**, read by thick description of the meanings an act carries.
    decoys:
      - body: |
          Anthropologists answer in different ways. According to Durkheim (1858-1917), gathering in ritual produces **collective effervescence** and the sacred stands for the group. According to Malinowski (1884-1942), magic appears where skill suffices (the lagoon) and not where danger is high (open-sea fishing). According to Geertz (1926-2006), religion is a **system of symbols**, read by thick description of the meanings an act carries.
        feedback: |
          Malinowski's Trobriand contrast runs the other way: ritual and magic were tied to the dangerous, uncertain open-sea trips, while the safe lagoon fishing needed none.
      - body: |
          Anthropologists answer in different ways. According to Durkheim (1858-1917), ritual is a private act of the individual and the sacred stands for the self. According to Malinowski (1884-1942), magic appears where danger and uncertainty are high (open-sea fishing) and not where skill suffices (the lagoon). According to Geertz (1926-2006), religion is a **system of symbols**, read by thick description of the meanings an act carries.
        feedback: |
          Durkheim's emphasis is social: gathering produces a shared surge of feeling that binds the group, and the sacred stands for the group itself.
    explanation: |
      Where the cognitive accounts ask why the idea of gods is easy, these ask what the ritual does for the people who perform it: calm their fear, bind them, or give them meaning.

  - id: passage
    title: Rites of passage and form
    row: 3
    col: 1
    body: |
      According to van Gennep (1909), a rite of passage has three phases: **separation**, **liminality** (the threshold, being between statuses) and **incorporation**. Turner (1969) studied the middle phase, where ordinary ranks loosen, and named the bond that can form there **communitas**. According to Rappaport (1999), ritual is the performance of more or less invariant sequences of formal acts that the performers did not invent.
    decoys:
      - body: |
          According to van Gennep (1909), a rite of passage has three phases: **separation**, **incorporation** and **liminality** (the threshold, being between statuses), in that order. Turner (1969) studied the middle phase, where ordinary ranks loosen, and named the bond that can form there **communitas**. According to Rappaport (1999), ritual is the performance of more or less invariant sequences of formal acts that the performers did not invent.
        feedback: |
          The order is separation, liminality, incorporation: the person leaves the old status, is in between, and then joins the new one. Incorporation cannot come before the threshold.
      - body: |
          According to van Gennep (1909), a rite of passage has three phases: **separation**, **liminality** (the threshold, being between statuses) and **incorporation**. Turner (1969) studied the first phase, where ordinary ranks are kept, and named the bond that can form there **communitas**. According to Rappaport (1999), ritual is a free improvisation that the performers invent on the spot.
        feedback: |
          Turner's interest was the middle, liminal phase, where ranks loosen and communitas can arise. And for Rappaport a ritual's form is fixed and received, which is part of what it does.
    explanation: |
      The structure inside many rituals: a passage has a shape, and its middle is where the group feeling Durkheim describes can be strongest.

  - id: layers
    title: The three layers
    row: 4
    col: 2
    body: |
      Every claim in the level sits in one of three layers. **Established fact**: minds flag agents, costly rituals change behaviour, belief varies with security. **Live debate**: whether religion is a by-product or an adaptation, and which theory of secularisation fits best. **Faith or metaphysical commitment**: whether a belief is true. An explanation of belief, taken alone, moves a claim between none of them.
    decoys:
      - body: |
          Every claim in the level sits in one of three layers. **Established fact**: religion is a by-product of agency detection. **Live debate**: whether minds flag agents and whether costly rituals change behaviour. **Faith or metaphysical commitment**: whether a belief is true. An explanation of belief, taken alone, moves a claim between none of them.
        feedback: |
          The layers are mixed up. That minds flag agents is established in experiments; whether religion is a by-product is the live debate.
      - body: |
          Every claim in the level sits in one of three layers. **Established fact**: minds flag agents, costly rituals change behaviour, belief varies with security. **Live debate**: whether religion is a by-product or an adaptation, and which theory of secularisation fits best. **Faith or metaphysical commitment**: whether a belief is true. Once a belief is explained by a cause, its truth is settled in the first layer.
        feedback: |
          A cause of a belief does not settle its truth. Truth stays in the third layer unless independent evidence is brought, and the debunking argument shows only when a cause removes justification.
    explanation: |
      The close of the level: it explains belief and unbelief in many ways and leaves the question of truth where the evidence and the commitments leave it.

