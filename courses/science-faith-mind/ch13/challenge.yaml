id: ch13-challenge
title: "Level Challenge: Explaining Belief, Judging Belief (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: one village, one toolkit"
    body: |
      The three problems in this part take place in one invented village, Hollin, built to practise the method. Every name and number is made up. In the village there is a belief that a watchful presence, the Keeper, lives at the old spring; a costly ritual, the three-night salt vigil beside it; and a skeptical neighbour, Maro, who thinks that explaining the belief explains it away. The problems are independent, so the toolkit is restated here.

      - **Debunking argument.** Maro's argument has three premises and a conclusion.
        - P1: the belief has a real cause (a process that produced it).
        - P2: that process would have produced the belief whether or not it is true.
        - P3: there is no independent support for the belief.
        - C: the belief is unjustified (not shown false).
      - **The test.** Ask: would the process give this belief if it were false? A process that would not is sensitive to the truth; one that would is blind to it. A critic who accepts the cause but rejects the argument must reject P2 or P3.
      - **Genetic fallacy.** Judging a claim true or false from its origin alone. Origin matters only when it bears on how reliable the process was.
      - **Costly signal.** A ritual costs $c_C$ to a committed member and $c_F$ to someone faking, and group membership is worth $b$ to both. Following the idea that honest signals are costly (Amotz Zahavi's handicap principle, taken here only as a toy),
      $$c_C<b<c_F$$
      means the committed join and the fakers stay out.
      - **Public-goods game.** $n$ players each hold $e$ coins and may give any amount to a pool. The pool is multiplied by $m$ and split equally among all $n$, so each coin given returns $m/n$ to the giver. With $1<m<n$, everyone giving beats everyone keeping, but each player does better by keeping.
      - **Two camps.** In the cognitive science of religion, Pascal Boyer (*Religion Explained*, 2001) and Scott Atran (*In Gods We Trust*, 2002) hold that religion is a by-product of mental tendencies that evolved for other purposes. David Sloan Wilson (*Darwin's Cathedral*, 2002) argues that religion is an adaptation that helps groups cooperate.
      - **Odds.** With $X$ the claim and $E$ the evidence,
      $$\begin{aligned}\text{posterior odds}={}&\frac{P(E\mid X)}{P(E\mid\neg X)}\\&\times\text{prior odds}\end{aligned}$$
      The ratio is the likelihood ratio; if it is near $1$, the evidence adds little.
      - **Agency detection.** Reacting to an ambiguous sign beats ignoring it when the chance $p$ of a real agent exceeds $p^*=\dfrac{C_{\text{alarm}}}{C_{\text{alarm}}+C_{\text{miss}}}$.
      - **Three layers:** established fact, live debate, faith or metaphysical commitment.

      Three problems here. Problems 4 and 5 (culture and anthropology, then a weighing across the level) come in part 2.

  # ---------------- Problem 1 ----------------
  - type: text
    id: p1-setup
    title: "Problem 1 · The survey at the spring"
    body: |
      **Problem 1.** A visiting sociologist surveys $300$ adults in Hollin. Of the $200$ raised in homes that hold the belief in the Keeper, $180$ hold it as adults. Of the $100$ raised in other homes, $30$ do. In all, $210$ of the $300$ believe.

      Maro reads the result and says: "Upbringing causes the belief. A belief with a cause like that cannot be trusted." Ilse, a believer, answers: "The Keeper is why the grandparents knew to teach it." (Maro and Ilse are invented.)

      Your task: say what the survey shows, which premise each speaker accepts or rejects, and what Maro's conclusion can and cannot be.

  - type: numeric
    id: p1-rate
    title: "How strong is the upbringing effect?"
    prompt: |
      In Hollin, $180$ of $200$ adults raised in believing homes hold the belief in the Keeper, and $30$ of $100$ adults raised in other homes do. Divide the first rate by the second. Give the ratio as a number.
    answer: 3
    tolerance: 0.01
    answerText: '3'
    hint: |
      Find each rate as a fraction of its own group first ($180$ out of $200$, and $30$ out of $100$), then divide.
    wrong:
      - { value: 6, feedback: "That divides the counts, $180/30$. The two groups have different sizes ($200$ and $100$), so compare rates inside each group." }
      - { value: 0.33, feedback: "That is the ratio turned upside down (the rate of the second group over the first)." }
    explanation: |
      The rates are $180/200=0.90$ and $30/100=0.30$, and $0.90/0.30=3$. Belief is three times as common among those raised in it. That is a cause (P1 is established as a fact of the survey) but also a reminder that $30\%$ of the other group believes anyway, so upbringing is not the whole story.

  - type: mcq
    id: p1-premise
    title: "Which premise does Ilse reject?"
    prompt: |
      Maro argues: P1, the belief in the Keeper is caused by upbringing; P2, upbringing would give the belief whether or not a Keeper exists; P3, nothing independent supports it; C, the belief is unjustified. Ilse replies: "The Keeper is why the grandparents knew to teach it, so the teaching is a channel of the truth." Which premise is she rejecting?
    options:
      - text: 'P2: she denies that the process is blind to the truth, claiming the teaching would not have arisen without a Keeper.'
        correct: true
        feedback: |
          Yes. She accepts the cause (P1) and says the process is tied to the truth. Her reply is open to a worry: it assumes the Keeper exists in order to say the process tracks the Keeper. That is why P3 matters.
      - text: 'P1: she denies that upbringing causes the belief.'
        feedback: |
          She grants the cause. The survey shows it, and her sentence uses it ("the grandparents taught it").
      - text: 'The step from the premises to C: she thinks the argument is invalid.'
        feedback: |
          The argument is valid as stated: if P1 to P3 held, C would follow. Her objection is to a premise, not to the step.
    explanation: |
      The critic can reject P1 (no such cause), P2 (the cause would not produce the belief if it were false) or P3 (there is independent support). Ilse takes P2. Whether the reply works depends on whether she can back it without assuming the Keeper, which is the live debate.

  - type: mcq
    id: p1-test
    title: "Would the process give it if false?"
    prompt: |
      Hollin children learn two things from their elders. (a) The date each year when the spring floods, which the elders read from records kept by the miller, changed whenever the flood changed. (b) That the Keeper grows angry when someone shouts at the spring, taught the same way for as long as anyone remembers, whatever happens at the spring. Apply the test "would the process give this belief if it were false?" to each.
    options:
      - text: 'The teaching of (a) would not give a wrong date for long, since the records change when the floods do; the teaching of (b) would be passed down whether or not there is a Keeper. So (a) is sensitive to truth and (b) is not, as far as this test goes.'
        correct: true
      - text: 'Both pass equally, since both come from elders.'
        feedback: |
          The source being the same elders is not the test. The test is whether the content would change if the facts were different. The flood date is tied to records that follow the floods; the Keeper teaching is not tied to anything checkable.
      - text: 'Both fail, because any belief learned from other people is blind to the truth.'
        feedback: |
          Learning from others is how most knowledge arrives, including (a). What matters is whether the passing-on is checked against the world.
    explanation: |
      The test does not say (b) is false. It says the process behind it would deliver the belief either way, so the process cannot count as evidence. Notice also that the test's answer for (b) is "as far as this test goes": independent support (P3) could still exist.

  - type: mcq
    id: p1-genetic
    title: "What is wrong with Maro's slogan?"
    prompt: |
      Maro says: "The grandparents taught it, so it is false." According to the usual analysis, what is the mistake, and what is the repair that makes his point a fair one?
    options:
      - text: 'The genetic fallacy: judging a claim false from its origin alone. The repair is the debunking argument, which concludes only that the belief is unjustified, and only if the process is blind to the truth (P2) and no independent support exists (P3).'
        correct: true
      - text: 'There is no mistake: every belief with a social cause is false.'
        feedback: |
          Beliefs learned from society include true ones, such as the flood date. If a social cause made beliefs false, no teacher could teach anything true.
      - text: 'The mistake is that Maro has no right to speak, since he has not been to the spring.'
        feedback: |
          That judges Maro by his position rather than his argument, which is the same kind of mistake pointing the other way. His argument stands or falls on P2 and P3.
    explanation: |
      Origin by itself shows nothing about truth. The fair version of Maro's point is weaker: if the process is blind to the truth and nothing else supports the belief, the believer has lost the reason they had. That does not make the belief false, and the next card turns to what would count as support.

  - type: mcq
    id: p1-support
    title: "What would count as independent support?"
    prompt: |
      Ilse wants to meet P3 with evidence that does not come from the teaching in Hollin. Which of these is best?
    options:
      - text: 'A record, written in advance by a visitor from a place with no such teaching, of a prediction about the spring that came true, which any observer could check.'
        correct: true
      - text: 'A second village raised on the same teaching also holds the belief.'
        feedback: |
          Agreement among people who got the belief from the same source adds nothing: the same process produced it twice. The test asks whether support comes from a route that does not run through the teaching.
      - text: 'Hollin elders say the belief is very old.'
        feedback: |
          Age shows the process has passed it on for a long time. A process blind to the truth could pass a false belief on for as long.
    explanation: |
      Support is independent when it would not exist if the belief were false and when it does not run through the process under attack. Whether any such support exists for the Keeper is the open question between Maro and Ilse; the method only says what would count.

  - type: order
    id: p1-order
    title: "Order Maro's argument"
    prompt: |
      Put Maro's argument in order, from the first premise to the conclusion.
    steps:
      - 'P1: The belief in the Keeper has a real cause, upbringing in believing homes.'
      - 'P2: That process would give the belief whether or not there is a Keeper.'
      - 'P3: Nothing independent of the process supports the belief.'
      - 'C: The belief is unjustified (this does not show it false).'
    hint: |
      The cause comes first, then what the cause is blind to, then the absence of other support, then the conclusion.
    explanation: |
      The conclusion draws on all three. Dropping P1 loses the target of the argument, dropping P2 lets a trustworthy process through, and dropping P3 leaves the belief standing on other grounds. Because C says "unjustified", not "false", it escapes the genetic fallacy.

  # ---------------- Problem 2 ----------------
  - type: text
    id: p2-setup
    title: "Problem 2 · The salt vigil"
    body: |
      **Problem 2.** Hollin's men and women who want a place in the harvest guild must first keep the salt vigil: three nights beside the spring, fasting, without sleep. Guild members share storage, loans and labour at harvest, and a member who takes more than a share harms the others. Elders say that people who keep the vigil are "bound to the Keeper".

      Two explanations are on offer. One says the vigil exists because it sorts committed members from people who would only take the benefits. The other says belief in the Keeper is a by-product of ordinary mental habits, and the vigil is only how the belief happens to be acted out. (The village is invented.)

      Your task: test the sorting idea with numbers, relate it to a public-goods game, and say what would separate the two explanations.

  - type: numeric
    id: p2-range
    title: "How many benefits make the vigil sort?"
    prompt: |
      Each night of the vigil is costly, and in total the vigil costs a committed person $c_C=3$ units and a person who is faking and does not care about the guild $c_F=14$ units. Guild membership is worth $b$ units to either. Sorting works if the committed join ($b>c_C$) and the fakers stay out ($b<c_F$). If $b$ is a whole number, for how many values of $b$ does the vigil sort?
    answer: 10
    tolerance: 0.01
    answerText: '10'
    hint: |
      List the whole numbers strictly above $3$ and strictly below $14$. The ends are not allowed: at $b=3$ the committed gain nothing, and at $b=14$ the fakers do not lose.
    wrong:
      - { value: 11, feedback: "That is $14-3$, the width of the range, which counts the ends. Both ends fail the strict inequalities, so $b=3$ and $b=14$ are excluded." }
      - { value: 12, feedback: "That includes one end. Neither $b=3$ nor $b=14$ works: the committed would gain $0$, or the fakers would also gain nothing, so those values do not sort cleanly." }
    explanation: |
      The whole numbers from $4$ to $13$ are $10$ values. If $b$ is small (say $2$) even the committed stay out; if $b$ is large (say $20$) fakers pay the cost and join. A vigil sorts well only in the middle band, so the same costly ritual can fail by being too cheap for fakers or too dear for everyone.

  - type: mcq
    id: p2-cheaper
    title: "What if fakers find the vigil easier?"
    prompt: |
      The vigil costs the committed $c_C=3$ and the fakers $c_F=14$, and membership is worth $b=8$, so the vigil sorts. A fashion spreads in which people learn to endure the vigil cheaply, so the cost to a faker falls to $c_F=6$ while $c_C$ stays $3$. What happens, according to the toy model?
    options:
      - text: 'The vigil stops sorting: since $b=8$ is now above $c_F=6$, fakers gain $2$ by joining, and the committed and the fakers both join.'
        correct: true
      - text: 'It sorts even better, because every cost has fallen.'
        feedback: |
          Only the cost to fakers fell. Sorting needs $c_F$ to stay above $b$, and $6<8$. The vigil only filters while it stays dear for someone who does not care.
      - text: 'Nobody joins, because a vigil that anyone can pass is worthless.'
        feedback: |
          The committed still gain ($8-3=5$) and the fakers now gain too ($8-6=2$). The value of the ritual disappears, but joining does not.
    explanation: |
      The condition $c_C<b<c_F$ has two sides, and the new fashion breaks the right one. In real communities the rule suggests rituals that must stay hard to fake, which is why a faked or watered-down version loses its force, according to the signalling idea. Whether actual rituals work this way is a matter for the field studies, not for the toy.

  - type: numeric
    id: p2-game
    title: "The free rider in a public-goods game"
    prompt: |
      Five herders ($n=5$) each hold $e=20$ coins. Each may put any amount into a common pool. The pool is multiplied by $m=2.5$ and split equally among the five. Four herders give all $20$ coins and the fifth gives nothing. How many coins does the fifth herder end with?
    answer: 60
    tolerance: 0.01
    answerText: '60'
    hint: |
      The pool holds $4\times20$ coins before the multiplier. After it is multiplied and split five ways, each herder (the fifth included) receives one fifth. The fifth also still holds the $20$ it kept.
    wrong:
      - { value: 50, feedback: "That is what each herder gets if all five give: $2.5\\times20$. Here the fifth gave nothing and receives the same share of a smaller pool, but also keeps its own $20$." }
      - { value: 40, feedback: "That is the share from the pool alone. The fifth herder also kept its own $20$ coins." }
      - { value: 20, feedback: "That is only what the fifth kept. It also receives a share of the multiplied pool." }
    explanation: |
      The pool is $4\times20=80$, multiplied by $2.5$ gives $200$, and one fifth is $40$. The fifth herder keeps $20$ and receives $40$, so ends with $60$. If all five had given, each would have ended with $50$. The free rider beats the cooperators ($60$ against $40$ each for the four, who get only the $40$ share) and also beats the all-give outcome ($50$). This is why groups that depend on cooperation have a problem to solve, and why a sorting device such as the vigil would be useful if it worked.
    review: true

  - type: mcq
    id: p2-filter
    title: "What does the vigil do in the game?"
    prompt: |
      In the five-herder game, the return per coin given is $m/n=0.5$, so a herder who gives a coin loses half of it if others hold constant. Suppose the guild lets only people who kept the salt vigil join the game, and the vigil does sort the committed from the fakers. According to the sorting idea, what does it change?
    options:
      - text: 'It filters the players: if fakers stay out, the people in the game are the committed, who are more willing to give, so the group avoids the free-rider problem without any punishment.'
        correct: true
      - text: 'It changes the multiplier $m$, since the Keeper adds coins to the pool.'
        feedback: |
          The game has no such supernatural term, and the sorting idea does not need one. It works by changing who plays.
      - text: 'It changes the arithmetic so that giving becomes better than keeping for every player.'
        feedback: |
          The arithmetic of a single game is the same. What changes is the mix of players. Giving is still costly for a player who cares nothing for the group.
    explanation: |
      The sorting idea does not alter the payoffs, it changes who is in the room. That is the claim the evidence has to test: do communities with costly rituals really have more cooperative members, and do those communities last longer? Studies of communes and of kibbutzim have looked at this, with mixed results and disputed interpretations, so the claim sits in the live-debate layer.

  - type: mcq
    id: p2-camps
    title: "By-product or adaptation?"
    prompt: |
      Two scholars look at Hollin's vigil. A by-product theorist (in the line of Boyer and Atran) says belief in a watchful Keeper arises from ordinary habits such as agency detection. An adaptation theorist (in the line of Wilson) says the ritual spread because villages that had it cooperated and lasted. Which evidence would **favour the adaptation view** over a by-product-only view?
    options:
      - text: 'Villages with costly rituals outlast comparable villages without them, and the more demanding the ritual the longer they last, when other factors are held fixed.'
        correct: true
      - text: 'People in every village can imagine watchful spirits easily, even children.'
        feedback: |
          This fits the by-product view, which expects the tendency to be everywhere because it comes from ordinary cognition. It says nothing about whether the ritual helped groups.
      - text: 'The vigil is tiring and costly.'
        feedback: |
          Both camps agree that the vigil is costly. Cost alone fits the sorting idea but does not show the ritual was selected for its effects, rather than being a by-product of belief.
    explanation: |
      A third class is "both": the tendency is a by-product, and a cultural practice that builds on it was then favoured because it helped groups. The camps are best seen as answering different questions (where the belief comes from, why a practice spread), and the evidence for the second is what is hardest to obtain. None of this says whether the belief is true: that remains the layer-3 question the debunking argument cannot settle.

  # ---------------- Problem 3 ----------------
  - type: text
    id: p3-setup
    title: "Problem 3 · What the spring does to a walker"
    body: |
      **Problem 3.** Walkers at night beside the Hollin spring often report feeling watched. A reader, Tomas, is trying to decide how far this should raise his confidence that something watches there. Before hearing any of the evidence he puts the chance at $0.30$. (This is a toy prior, and the claim "something watches there" is a metaphysical one: only the arithmetic is the point.)

      Tomas thinks that if a Keeper really watched, $90$ of $100$ night walkers would feel it. The comparison valley has a creek of the same size, no story of a Keeper, and $72$ of $100$ night walkers there still report feeling watched. (The numbers are invented.)

      Your task: update, see what a ratio near $1$ means, and use the agency-detection break-even to explain why the feeling is common.

  - type: numeric
    id: p3-post
    title: "How far should the feeling move Tomas?"
    prompt: |
      Tomas's prior probability for "something watches the spring" is $0.30$. He expects $90$ in $100$ night walkers to feel watched if something does, and the valley shows $72$ in $100$ feel watched where nothing is claimed to watch. Treat these as the chance of feeling watched with and without a watcher. What is his posterior probability? Give it to two decimals.
    answer: 0.35
    tolerance: 0.005
    answerText: '0.35'
    hint: |
      Work in odds. The prior $0.30$ is odds of $3$ to $7$. The evidence multiplies the odds by how many times likelier the feeling is with a watcher than without.
    wrong:
      - { value: 0.9, feedback: "That is the chance of the feeling given a watcher. The question asks for the chance of a watcher given the feeling, which starts from the prior and moves by the ratio." }
      - { value: 0.38, feedback: "That multiplies the probability $0.30$ by $1.25$. The ratio multiplies the odds ($3/7$), not the probability." }
    explanation: |
      The ratio is $0.90/0.72=1.25$. Prior odds are $0.30/0.70=3/7$, posterior odds $(3/7)\times1.25=15/28$, and the probability is $(15/28)/(1+15/28)=15/43\approx0.35$. The feeling raised him from $0.30$ to about $0.35$. A feeling that $72\%$ of walkers get with no watcher claimed is weak evidence for one.

  - type: widget
    id: p3-widget
    widget: odds-updater
    config:
      prior: 0.3
      lr: 1.25
      priorSlider: false
      lrSlider: false
      presets:
        - { label: "Feeling: LR 1.25", lr: 1.25 }
        - { label: "A ratio of 3", lr: 3 }
        - { label: "No contrast: LR 1", lr: 1 }
    body: |
      Tomas's prior is $0.30$. The ratio is how many times likelier the evidence is if something watches than if nothing does. Press the three presets and compare the posterior with the prior. Watch what happens when the valley's rate matches Hollin's.
    review: false

  - type: mcq
    id: p3-near1
    title: "What does a ratio near 1 mean?"
    prompt: |
      The feeling gave a ratio of $1.25$, close to $1$. A reader says: "So the feeling shows there is no watcher." Another says: "So the feeling was a real glimpse of the watcher." What does a ratio near $1$ actually tell us?
    options:
      - text: 'The feeling is about as likely whether or not something watches, so it shifts the odds very little in either direction. It leaves the question to other evidence and does not show that nothing watches.'
        correct: true
      - text: 'The feeling proves nothing watches, because ordinary causes explain it.'
        feedback: |
          Explaining a feeling by ordinary causes lowers its value as evidence. It does not turn the posterior to $0$: here it moved from $0.30$ up to $0.35$, not down.
      - text: 'The feeling is strong evidence for a watcher, since a ratio above $1$ always favours the claim.'
        feedback: |
          A ratio above $1$ favours the claim, but by how much matters. At $1.25$ the odds rise by a quarter, which is a small step, and the prior still does most of the work.
    explanation: |
      A ratio of exactly $1$ leaves the posterior at the prior, and a ratio near $1$ nearly so. This is the lesson's point about debunking in numbers: the feeling is common with or without a watcher, so it carries little information, while the claim stays as open as before. Two readers with different priors both move only slightly, and keep disagreeing.

  - type: numeric
    id: p3-breakeven
    title: "When is it worth reacting to a rustle?"
    prompt: |
      A walker hears a rustle at the spring. Wrongly ignoring a real intruder (a bear, a thief) costs $C_{\text{miss}}=450$ units of harm. Reacting to a rustle that was only wind costs $C_{\text{alarm}}=3$ units of effort. How small can the chance $p$ that the rustle is a real agent be before ignoring it becomes the better policy? Give $p$ as a percentage to two decimals.
    answer: 0.66
    tolerance: 0.01
    answerText: '0.66'
    hint: |
      Compare the expected cost of ignoring ($p$ times the cost of a miss) with that of reacting ($1-p$ times the cost of an alarm) and find the $p$ where they are equal.
    wrong:
      - { value: 0.67, feedback: "That is $3/450$, which leaves out the alarm cost in the denominator. At the break-even, $p\\,C_{\\text{miss}}=(1-p)\\,C_{\\text{alarm}}$ gives $p=3/(3+450)$." }
      - { value: 99.34, feedback: "That is $1-p^*$, the share of rustles where no agent is there. The question asks for the smallest chance of an agent that is still worth reacting to." }
    explanation: |
      Ignoring costs $450p$ on average and reacting costs $3(1-p)$. They are equal when $450p=3-3p$, so $p=3/453\approx0.0066$, about $0.66\%$. Above that chance, reacting is the cheaper policy. A walker should react to rustles even when an agent is far less likely than not.

  - type: numeric
    id: p3-falsealarms
    title: "How many alarms are false?"
    prompt: |
      Suppose a real agent is behind $3\%$ of the rustles a walker hears, which is above the break-even, so the walker reacts to every rustle. Out of $1000$ rustles, how many reactions are false alarms (wind or animals)?
    answer: 970
    tolerance: 0.5
    answerText: '970'
    hint: |
      $3\%$ of $1000$ are real; the rest of the reactions are false alarms.
    wrong:
      - { value: 30, feedback: "That is the number of real agents ($3\\%$ of $1000$). The false alarms are the other rustles." }
    explanation: |
      Of $1000$ rustles, $30$ are real and $970$ are false alarms. A mind built this way, according to the line of Guthrie and Barrett, will sense watchers at the spring on most nights whether or not one is there. That is P2 in miniature: the process fires nearly the same way with or without a watcher, which is why its output carries a ratio near $1$ and why it can be a by-product of a sensible policy rather than a sign of anything.

  - type: mcq
    id: p3-layers
    title: "Which layer does each claim belong to?"
    prompt: |
      Sort three claims: (a) In Hollin, $180$ of $200$ adults raised in believing homes hold the belief against $30$ of $100$ raised elsewhere. (b) Belief in watchers arises mainly as a by-product of an agency-detection tendency, rather than as an adaptation for cooperation. (c) A Keeper really watches the spring.
    options:
      - text: '(a) established fact (as the survey''s counts); (b) live debate among scholars of the cognitive science of religion; (c) a faith or metaphysical commitment.'
        correct: true
      - text: '(a) live debate; (b) established fact; (c) live debate.'
        feedback: |
          The survey counts are a record, and (b) is contested between the camps (by-product, adaptation, both). Whether a Keeper exists is not settled by any such study.
      - text: '(a) established fact; (b) faith commitment; (c) established fact.'
        feedback: |
          (b) is an empirical hypothesis that scholars argue over, not a creed. And (c) is not a fact that a survey or an experiment can confirm.
    explanation: |
      Explaining how a belief forms is work for layers 1 and 2. Whether the belief is true is layer 3, and neither a cause nor a ratio near $1$ settles it. The method's gain is to show exactly where thoughtful people part ways: on P2 (is the process blind?), on P3 (is there other support?) and on the prior.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Problem 1, cause and reason.** A cause of a belief is not a proof it is false (the genetic fallacy). Maro's argument is P1 real cause, P2 the process would give the belief whether or not it is true, P3 no independent support, C unjustified, not false. The survey gave a ratio of $0.90/0.30=3$ for upbringing. A believer can reject P2 or P3, and support counts as independent only if it does not run through the process under attack.
      - **Problem 2, signal and cooperation.** A costly ritual sorts when it costs the committed $c_C$ and a faker $c_F$ and membership is worth $b$ with
      $$c_C<b<c_F$$
      (here $3<b<14$, ten whole values, and $b=8$ stops working if $c_F$ falls to $6$). In a public-goods game with $n=5$, $e=20$, $m=2.5$, a lone free rider ends with $60$ against $50$ if all give. Whether rituals were selected for this (Wilson's adaptation view) or belief is a by-product (Boyer and Atran) is a live debate.
      - **Problem 3, odds.** With prior $0.30$ and ratio $0.90/0.72=1.25$,
      $$\begin{aligned}\text{posterior odds}={}&1.25\times\tfrac37\\={}&\tfrac{15}{28}\end{aligned}$$
      so the probability is about $0.35$. A ratio near $1$ leaves the prior nearly where it was and does not show that nothing is there. Agency detection pays when $p>p^*=C_{\text{alarm}}/(C_{\text{alarm}}+C_{\text{miss}})=3/453\approx0.66\%$, and at $p=3\%$ it gives $970$ false alarms in $1000$.
      - **Method.** Sort each claim into established fact, live debate, or faith commitment, and say which premise, which value or which prior the parting of ways turns on.

