id: ch13-reverse
title: "The Same Argument Against Atheism"
kind: concept
own: |
  The setting: the debunking argument for a belief $B$ and a causal story $S$ of how people come to hold beliefs of that kind. P1: $S$ is the real cause of $B$. P2: $S$ would give the belief whether or not $B$ is true. P3: there is no independent support for $B$. C: the belief is unjustified (not "false"). The question here is whether the same template works against unbelief, and what follows if it does.
  - **A template, not a side.** The three premises can be applied to the belief "there is a God" and to the belief "there is no God" alike. For each belief the questions are the same: is the causal story real (P1), is the process {{ truth-blind, giving the belief whether or not it is true }} (P2), and is there support that does not run through the process (P3)?
  - **Causes of unbelief.** Researchers describe several routes to unbelief: weak mentalizing (inferring other minds), an analytic thinking style, existential security, and few credible religious displays in childhood. The evidence is a live debate: a priming experiment on analytic thinking {{ failed to replicate }}, while the correlation across studies is modest, about
  $$r \approx -0.18, \qquad r^2 \approx 3\%$$
  of the variation in belief (explained by analytic style). A cause that explains little cannot by itself show the process is truth-blind.
  - **Moral belief.** Street's dilemma applies to the belief that cruelty is wrong: either evolution's push on our moral judgments {{ is unrelated to independent moral facts }} (so a match would be luck), or it selected us to track them (which she finds scientifically implausible). The same worry hits any person who holds a moral view.
  - **Trust in reason.** Plantinga's evolutionary argument against naturalism claims that, if naturalism ($N$) and evolution ($E$) are both true, the probability that our faculties are reliable ($R$) is low or unknowable:
  $$P(R \mid N \wedge E) \text{ is low or inscrutable}$$
  It targets {{ naturalism together with evolution, not atheism as such }}, and critics such as Fitelson and Sober dispute its probabilities.
  - **Consistency.** A debunker who says every evolved process is truth-blind also undermines the debunker's own reasoning. And "both sides have causes, so neither is justified" is a fallacy: the template is applied premise by premise to each belief, and its verdict can differ.
  - **Three layers.** That beliefs and unbeliefs have causes is established; whether those causes are truth-blind, and which premises hold, is a live debate; whether God exists is a faith or metaphysical commitment.

cards:
  - type: text
    id: recall
    title: "Recall: the debunking argument"
    body: |
      Recall from the lesson Does Explaining Belief Explain It Away? A **debunking argument** tries to show that a belief $B$ is unjustified by pointing to how people come to hold it. It has three premises. **P1:** a causal story $S$ is the real cause of the belief. **P2:** $S$ would have produced the belief whether or not $B$ is true. **P3:** there is no independent support for $B$, meaning no evidence or argument that does not run through $S$. **C:** the belief is unjustified, which is weaker than "false". The test for P2 is a question: *would the process have given me this belief if it were false?* A jammed thermometer would still read 20 degrees on a freezing day, so its reading is no evidence; eyesight in daylight would not show a tree that is not there.

      Everything so far was aimed at religious belief. This lesson turns the template around.

  - type: mcq
    id: hook
    title: "Guess: does the template cut both ways?"
    prompt: |
      Guessing is the point. Researchers study why some people believe in gods, and they also study why some people do not. Suppose they find a real, natural cause for the unbelief of many people (say, how they were raised or how they tend to think). A friend says: "Now the debunking template shows that atheism is unjustified." Is that conclusion reached yet?
    options:
      - text: 'No. A cause is not yet a debunker: one has to check P2 and P3 for atheism, exactly as for belief in God.'
        correct: true
        feedback: |
          Yes. The template needs all three premises, and a cause (P1) is the cheap one. Whether the process is truth-blind, and whether independent support exists, are separate questions, for unbelief as for belief.
      - text: 'Yes. Any belief with a natural cause is unjustified.'
        feedback: |
          That would undermine every belief, including the belief that the study was done correctly. A cause alone shows nothing; the premises about truth-blindness and independent support carry the weight.
      - text: 'No, because unbelief is only the absence of belief and has no causes to study.'
        feedback: |
          People who do not believe in gods also got there by some route, and researchers study those routes. Some atheists also hold a positive claim ("no gods exist"), which is a belief like any other and can be examined the same way.
    explanation: |
      The lesson applies the three premises to unbelief, then to moral belief and to trust in reason, and asks what each side must show.

  - type: text
    id: causes
    title: "How researchers explain unbelief"
    body: |
      Psychologists have proposed several routes by which people come to disbelieve. In a 2013 review in *Trends in Cognitive Sciences*, Ara Norenzayan and Will Gervais described four, in the plain terms below. **Mindblind** unbelief: a person who is weaker at **mentalizing** (reading what others think and feel) may find gods, who are imagined as minds, less intuitive; their 2012 *PLoS ONE* paper with Trzesniewski found that traits linked to autism went with weaker belief in God, and that mentalizing mediated this. **Analytic** unbelief: a person who habitually stops to check first impressions may drop beliefs that arrived by intuition; in a 2012 paper in *Science*, Gervais and Norenzayan reported a correlation and experiments in which prompts to think analytically (such as a picture of Rodin's *The Thinker*) lowered stated belief. **Existential security** (called apatheism in their review): when life is safe and predictable, the motivation to turn to gods weakens. **Credibility**: children who rarely see adults put costly effort behind religious claims may not come to believe them, which fits the lesson Culture, Diversity and Secularisation.

      Each route is a causal story of the kind the debunking argument uses. The authors themselves noted that analytic thinking is one factor among several and that their results do not speak to whether religious beliefs are true or rational.

  - type: text
    id: caveats
    title: "A live debate, with replication problems"
    body: |
      This is research under test, and parts have not held up. A large pre-registered replication of the *Thinker* experiment (Sanchez, Sundermeier, Gray and Calin-Jageman, *PLoS ONE*, 2017; 941 analysed participants) found essentially no effect of the picture on religious belief. A later study of mentalizing (Maij and colleagues, *PLoS ONE*, 2017, over 67,000 participants in five studies) found that empathy and autism-trait scores did not predict belief in supernatural agents in the Netherlands, Switzerland or the United States, while exposure to credible religious displays did. And a survey of a representative sample of 1,417 US adults (Gervais, Najle and Caluori, *Social Psychological and Personality Science*, 2021) found that few credible cultural cues in childhood predicted atheism most strongly, with an analytic style and weak mentalizing well behind.

      The analytic link has support of a different kind: a meta-analysis of 31 studies with 15,078 participants (Pennycook, Ross, Koehler and Fugelsang, *PLoS ONE*, 2016) reported a correlation of about $r = -0.18$ between scores on a reflection test and religious belief. A correlation does not say which way the influence runs.

  - type: numeric
    id: r-squared
    title: "How much does a correlation explain?"
    prompt: |
      A meta-analysis finds a correlation of $r = -0.18$ between analytic-thinking scores and religious belief. The share of the variation in belief that a linear link with analytic thinking accounts for is $r^2$. Give that share as a percentage, to the nearest tenth.
    answer: 3.2
    tolerance: 0.05
    answerText: '3.2 %'
    wrong:
      - { value: 18, feedback: 'That reads $r$ itself as a percentage. A correlation of $0.18$ is not "18 % explained"; the explained share is the square, $0.18^2$.' }
      - { value: 0.032, feedback: 'The square is $0.0324$ as a fraction, which is $3.24\%$ as a percentage. Multiply by $100$.' }
    hint: |
      Square the correlation ($0.18 \times 0.18$), then multiply by $100$ to get a percentage.
    explanation: |
      $r^2 = 0.18^2 = 0.0324$, about $3.2\%$. A statistically solid but small share: most of why people differ in belief lies elsewhere. This matters for P2: a cause that explains little of the pattern is a weak basis for saying the whole process is blind to the truth.

  - type: mcq
    id: p1
    title: "P1 for atheism: is the story real?"
    prompt: |
      Take the debunking template against unbelief, with the story "analytic thinking style leads people to atheism". Which statement about P1 (the story is the real cause) is fair, given what the research shows?
    options:
      - text: 'P1 is a matter of evidence and is only partly supported: the link appears in several studies but is modest, one experiment did not replicate, and other factors such as credible cultural cues matter more in a representative sample.'
        correct: true
        feedback: |
          Yes. P1 is an empirical claim and gets the usual treatment: how big is the effect, does it replicate, which causes compete. The same standard applies to causal stories about belief, such as hyperactive agency detection.
      - text: 'P1 is settled: science has shown analytic thinking causes atheism.'
        feedback: |
          The evidence is mixed. The best-known experiment failed a large replication, and correlations cannot show which way the influence runs.
      - text: 'P1 cannot be tested, because beliefs are private.'
        feedback: |
          Surveys, experiments and cross-cultural comparisons test such stories every year. Their results are imperfect, but they are tests.
    explanation: |
      Layer check: that people differ in thinking style is established; that style causes unbelief is a live debate. For either side, P1 is the premise that science can speak to, and P2 and P3 are where the philosophical argument lives.

  - type: mcq
    id: p2
    title: "P2 for atheism: a reply from the other side"
    prompt: |
      A critic of atheism says: "Weak mentalizing leads some people to disbelieve. If God exists and is a mind who wants to be known, then a person with weaker mind-reading may simply be less able to detect the truth. So the process would not produce the belief equally whether or not God exists." The atheist answers: "Analytic thinking is a way of checking flawed first impressions, so it makes belief-formation more reliable." Which statement is right about both replies?
    options:
      - text: 'Both attack P2 and both assume something in dispute: the first assumes God exists, the second assumes that the intuitions being overridden are in fact misleading, which depends on whether religious belief is true.'
        correct: true
        feedback: |
          Yes. This is the same structure as Plantinga's reply in the lesson Does Explaining Belief Explain It Away?: whether a process tracks the truth depends partly on what the truth is. No side gets a neutral shortcut, and each reply is conditional ("if God exists", "if the intuition is misleading").
      - text: 'Only the first assumes something; the second is a neutral, scientific reply.'
        feedback: |
          Checking intuitions is a reasonable habit, but whether it makes belief-formation more reliable here depends on whether the intuition (for example, that the world has a purposeful source) is a false impression, which is the disputed question.
      - text: 'Neither is a reply to P2; both deny that a cause exists.'
        feedback: |
          Neither denies the causal story. Both accept that it describes how beliefs form and dispute whether the process is blind to the truth, which is P2.
    explanation: |
      The question of whether a process "tracks the truth" often cannot be settled without leaning on a view about the truth. That is why independent support (P3) carries so much of the weight in both directions.

  - type: mcq
    id: p3
    title: "P3 for atheism: independent support"
    prompt: |
      A believer argues that atheism is only a product of its causes and has no independent support. An atheist replies by pointing to the argument from the amount and kind of evil in the world, the argument from divine hiddenness, and the point that a simpler theory is better. Which premise of the debunking template is this reply attacking, and what does the believer's best answer do?
    options:
      - text: 'P3: it offers support that does not run through the belief-forming process. The believer answers by criticising those arguments, and so the debate moves to their strength.'
        correct: true
        feedback: |
          Yes. These are arguments met in the levels on the arguments about God, and each is disputed. Support is independent when its force would remain if the causal story about the person were set aside. Whether these arguments (or the believer's own, such as the cosmological or moral arguments) succeed is exactly what the sides disagree about.
      - text: 'P1: it denies that unbelief has a cause.'
        feedback: |
          The reply accepts that unbelief has causes. It disputes P3 by supplying arguments.
      - text: 'P2: it says the causal process tracks the truth.'
        feedback: |
          That would be a reply on P2. Here the atheist is not discussing the process at all but offering arguments that stand apart from it.
    explanation: |
      Both sides can take this exit: independent support, if there is any, shifts the debate from the origins of beliefs to the merits of arguments. That is the same place the lesson on debunking ended.

  - type: text
    id: moral
    title: "Moral beliefs face the same question"
    body: |
      The template also applies to moral beliefs, which many atheists and believers share. Recall from the lesson Does Explaining Belief Explain It Away? Sharon Street's 2006 article "A Darwinian Dilemma for Realist Theories of Value". A **realist** about value holds that there are moral facts that hold independently of what anyone thinks. Evolution, she says, strongly shaped what we find right and wrong (we tend to approve of caring for our children and to disapprove of betrayal). The dilemma has two horns. **First horn:** say the evolutionary pressure was unrelated to the independent moral facts, so our moral judgments match them only by luck. **Second horn:** say evolution favoured judgments that track the facts, which she argues does not fit the science.

      Street herself argues that antirealist views explain the link between evolution and our evaluations better than realism does. Others reply that a process can track a truth without being selected for that purpose, or that moral facts are of a kind (such as facts about what promotes flourishing) that evolution would plausibly track. Note what this shows about the template: it is not a weapon for one side. A person who is sure that cruelty is wrong is exposed to a version of it, whether that person is a theist or an atheist.

  - type: mcq
    id: street
    title: "Which horn is it?"
    prompt: |
      A person holds that "cruelty for its own sake is wrong" and thinks this is a moral fact independent of anyone's opinion. A critic says: "Evolution made us dislike cruelty to our group because that helped survival. It would have made us dislike it whether or not there is any independent moral fact." Which of these is the best reading of the critic's point, in the language of the debunking template?
    options:
      - text: 'P2 for the moral belief: the process would have produced the belief whether or not the independent moral fact holds. The realist must show that there is a link (a reply on P2) or independent support (a reply on P3).'
        correct: true
        feedback: |
          Yes. That is the first horn: if evolution was indifferent to the independent facts, then matching them looks like luck. The realist replies either that the process is linked to the facts after all or that the belief has support of its own, such as the reasoning in a careful ethical argument.
      - text: 'P1 for the moral belief: the critic is denying that anyone holds the belief.'
        feedback: |
          The critic grants that the belief exists and explains where it comes from. Disagreeing about the cause would be a different move.
      - text: 'A proof that cruelty is not wrong.'
        feedback: |
          Even if the debunking succeeded, it would conclude that the belief is unjustified, not that it is false. A true moral belief could still be true without a good account of how we came to know it.
    explanation: |
      The point is not to settle ethics but to see that the template is general. It also answers a common thought: "if I reject religious belief because it has a cause, I must also give up my moral convictions". Whether that follows depends on whether P2 and P3 hold there.

  - type: text
    id: reason
    title: "The debunker's own trust in reason"
    image:
      src: img/plantinga.webp
      alt: "Alvin Plantinga smiling during a lecture"
      caption: "Alvin Plantinga (born 1932), an American philosopher, argued in Warrant and Proper Function (1993) that accepting naturalism together with evolution undermines trust in our own faculties."
      credit: "Jonathunder, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:AlvinPlantinga.JPG"
      place: bottom
    body: |
      If every belief produced by an evolved process were thereby unjustified, the argument would reach the debunker's own mind, since reasoning is an evolved process too. Alvin Plantinga turned this into the **evolutionary argument against naturalism**, given in *Warrant and Proper Function* (1993) and later works. Write $N$ for naturalism (the view that there is no God or anything like God), $E$ for the view that humans evolved by natural selection, and $R$ for the claim that our cognitive faculties are reliable (most of what they deliver is true). Plantinga argues that the probability of $R$ given both $N$ and $E$ is low or cannot be assessed, because natural selection rewards behaviour that helps survival and not beliefs that are true. Anyone who accepts $N$ and $E$ would then have a reason to doubt $R$, and so to doubt $N$ and $E$ themselves.

      Critics reply in several ways. Fitelson and Sober (1998) argued that Plantinga's probability assignments are not supported, and that a theist who relies on a God who does not deceive faces the same worry about the starting point. Others hold that mental content depends on links to the world that make systematic falsehood implausible. This lesson reports the argument as one move in the debate and does not settle it.

  - type: mcq
    id: naturalism
    title: "What does the argument target?"
    prompt: |
      A reader says: "Plantinga's argument shows that atheism is self-defeating." Considering the premises as stated ($N$ is naturalism, $E$ is evolution, $R$ is reliability of our faculties), which reply is most accurate?
    options:
      - text: 'It is aimed at naturalism combined with evolution. Atheism (not believing in gods) is a smaller claim that does not by itself entail naturalism, and critics deny that the argument succeeds even against $N \wedge E$.'
        correct: true
        feedback: |
          Yes. A person could be an atheist and hold, for example, that there are non-physical things but no gods, so the argument would not apply to them as stated. And for naturalists, the argument is disputed at the step that says $P(R \mid N \wedge E)$ is low.
      - text: 'It shows only that atheists cannot trust reason, and has no use against any other view.'
        feedback: |
          It claims to apply to a specific combination of views. It does not say anything about whether reason is reliable on other combinations, and it is not a verdict on people but on a pair of claims.
      - text: 'It is a proof that God exists.'
        feedback: |
          Even if the argument worked, it would conclude that $N \wedge E$ is self-defeating, not that a God exists. Other positions remain, such as a naturalism that does not accept the low-probability premise.
    explanation: |
      Always ask what an argument targets and what it would show if it worked. A narrow argument stretched to a wide conclusion is a common slip, on both sides of this debate.

  - type: mcq
    id: overreach
    title: "Global debunking undermines itself"
    prompt: |
      A debunker argues: "Every belief-forming process shaped by evolution is blind to the truth, so all beliefs formed by such processes are unjustified, including religious belief." What is the problem?
    options:
      - text: 'It proves too much: the debunker''s own reasoning, observation and memory are evolved too, so the conclusion would apply to the debunker''s premises. A fair version has to say what is special about the targeted process.'
        correct: true
        feedback: |
          Yes. A debunking argument works by contrasting a truth-blind process (the jammed thermometer) with a reliable one (eyesight in daylight). A version that condemns every evolved process removes the contrast it needs.
      - text: 'It is perfectly sound: evolution does not care about truth.'
        feedback: |
          Evolution selects for what helps survival, but in many cases seeing accurately helps survival too. The argument needs a reason to think the particular process is blind, not a slogan about evolution.
      - text: 'It is invalid, because a conclusion about religion cannot follow from a premise about evolution.'
        feedback: |
          The issue is not the topic but the scope: the premise is so broad that it also defeats the debunker. That is a problem for the premise, not for the form of the argument.
    explanation: |
      The remedy is to argue process by process: which processes are insensitive to the truth, and why. That is the question this lesson applied to unbelief and moral belief.

  - type: order
    id: apply
    title: "Applying the template fairly"
    prompt: |
      A reader wants to apply the debunking template fairly to any belief $B$, whether it is belief in God, unbelief or a moral conviction. Put the steps in order.
    steps:
      - 'State the belief $B$ and the causal story $S$ of how people come to hold it.'
      - 'Check P1: is there good evidence that $S$ really is the cause?'
      - 'Check P2: would the process have produced the belief whether or not $B$ is true?'
      - 'Check P3: is there support for $B$ that does not run through the process?'
      - 'Conclude only that $B$ is unjustified or not, never that it is false, and repeat for the rival belief.'
    hint: |
      Go through the premises P1, P2, P3 in turn, then conclude, then run the same list on the rival belief.
    explanation: |
      The same list can be run on the rival belief. Where the verdicts differ, they differ because of the premises, not because one side has causes and the other does not.

  - type: text
    id: symmetry
    title: "What each side must show"
    body: |
      Putting the premises together gives a fair summary of the burdens.

      | Premise | A debunker of belief in God must show | A debunker of unbelief must show |
      |---|---|---|
      | P1 | the causes of religious belief are real (agency detection, culture) | the causes of unbelief are real (thinking style, security, few credible cues) |
      | P2 | those causes would give belief even if there were no God | those causes would give unbelief even if there were a God |
      | P3 | arguments for God fail | arguments against God fail |

      Two features stand out. First, P1 is largely empirical and both sides can cite studies; the studies on each side are modest and under test. Second, P2 and P3 cannot be decided by psychology alone: they depend on arguments about God that were examined in the levels on the arguments about God. So, according to the sceptic, the template is a reason for humility on each side. According to the believer, it shows that origins cannot decide the matter, so the arguments must. Both agree that the question returns to the arguments.

  - type: mcq
    id: trap-cancel
    title: "Trap: both have causes, so both are unjustified"
    prompt: |
      Someone concludes: "Belief and unbelief both have natural causes, so neither is justified; the only honest position is to say nothing." What is wrong with this inference?
    options:
      - text: 'It treats "has a cause" as if it were the debunking verdict. Whether a belief is justified depends on P2 and P3, which can come out differently for each belief (and for each person).'
        correct: true
        feedback: |
          Yes. If causes alone sufficed, all beliefs, including the belief that this reasoning is good, would fall. The honest step is to ask which premises hold, belief by belief.
      - text: 'Nothing: symmetric causes do make beliefs equally unjustified.'
        feedback: |
          Symmetry of causes does not give symmetry of support. Two beliefs can both have causes while one has strong independent support and the other does not.
      - text: 'It is correct but only for believers.'
        feedback: |
          The argument form has no side. It fails for both because it skips P2 and P3.
    explanation: |
      The symmetry shows the template is neutral, not that it cancels everything. Agnosticism may be defended on other grounds (such as balanced evidence), but not from the mere fact of causes.

  - type: mcq
    id: trap-study
    title: "Trap: the study shows believers are less rational"
    prompt: |
      A headline says: "Study finds atheists score higher on a reflection test; religious belief is a thinking error." Which response is most careful?
    options:
      - text: 'The score gap is about thinking style, not about whether the belief is true. Even if the link is real (a modest correlation), it still needs P2 and P3: whether intuitive thinking is blind to the truth on this question, and whether independent support exists.'
        correct: true
        feedback: |
          Yes. A gap in a reflection test measures a habit of thinking; moving from that to "the belief is false or irrational" skips both premises. The researchers themselves said their results do not settle whether religious beliefs are true or rational.
      - text: 'The study proves that religion is false.'
        feedback: |
          That jumps from a correlation to the falsity of the content, which is the genetic fallacy in a statistical coat.
      - text: 'The study is meaningless because thinking style does not matter.'
        feedback: |
          Thinking style plausibly matters to how beliefs form. The study is a piece of evidence for P1, not nothing, and not everything.
    explanation: |
      Reading a headline fairly means separating three claims: the data (what was measured), the interpretation (what it suggests about causes), and the conclusion about truth (which needs more).

  - type: text
    id: layers
    title: "Three layers"
    body: |
      Established fact: both belief and unbelief have causes that researchers can study (upbringing, thinking style, security, cultural cues), and a cause alone does not show a belief false or unjustified.

      Live debate: how large and robust each cause is (the analytic-thinking and mentalizing results are contested, and credible cultural cues look stronger); whether those processes are truth-blind (P2); whether Street's and Plantinga's arguments work; and whether arguments about God supply independent support (P3). Thoughtful people part ways on whether a process "tracks the truth" can be judged without assuming an answer about God.

      Faith or metaphysical commitment: whether God exists. No causal story about believers or unbelievers settles it.

  - type: text
    id: summary
    body: |
      **Next:** Anthropology of Ritual. Beyond what people believe lies what they do: the shared acts of religion. The next lesson asks what rituals do for communities, from Durkheim to Turner.
