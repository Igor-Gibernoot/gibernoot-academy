id: ch13-culture
title: "Culture, Diversity and Secularisation"
kind: concept
own: |
  The setting: religious belief and practice differ a great deal between societies and change over time, and scholars ask which causes of this variation are at work. The by-product and adaptation stories of the earlier lessons describe tools that all humans share, so by themselves they cannot say why two societies differ.
  - **Cultural transmission.** People learn what to believe from others, using biases such as copying the majority and copying prestigious models. According to Henrich (2009), learners also trust a model more when the model's actions would be costly if the stated belief were false, called a
  {{ credibility-enhancing display }}
  (a preacher who actually gives his wealth away, rather than only urging others to).
  - **Secularisation theory.** According to Weber, rationalisation produces the "disenchantment of the world" (nature explained without spirits); according to Berger's early work (1967), religious pluralism weakens the taken-for-granted status of any one faith. Berger later (1999) {{ withdrew the claim that modernity must secularise }} and spoke of a resurgent religion in much of the world, while still noting that pluralism challenges belief.
  - **Existential security.** According to Norris and Inglehart (2004), religiosity stays high where life is {{ vulnerable (poverty, illness, violence, insecurity) }} and declines where people feel safe. With $s_L$ and $s_H$ the share calling religion very important in the lowest and highest income groups, the gap is
  $$s_L - s_H$$
  and a large gap fits the theory but does not prove cause, since income also changes schooling, age and region.
  - **Religious economies.** According to Stark and Finke (2000), demand for religion is fairly constant and differences come from supply: where {{ many churches compete in a free market }} (the United States), participation is high; where one state-backed church dominates (much of Europe), it is low. Critics (Voas, Olson and Crockett 2002) answer that the measured link between pluralism and participation can come from a statistical artefact.
  - **Rise and decline.** Both happen: the share of unaffiliated adults in the United States rose from 16.1% (2007) to 22.8% (2014) and 29% (2023-24), while in Brazil the evangelical share rose from 15.4% (2000) to 22.2% (2010) as the Catholic share fell.
  - **Three layers.** That belief varies and shifts with security, institutions and learning is established; which theory explains most of it is a live debate; whether any belief is true is a faith or metaphysical commitment that no survey settles.

cards:
  - type: text
    id: recall
    title: "Recall: where we stand"
    body: |
      Recall from the lesson Religion and the Group. A **costly signal** is a display expensive enough to be hard to fake: with benefit of acceptance $b$, cost $c_C$ for the committed and $c_F$ for fakers, it sorts the two when
      $$c_C < b < c_F$$
      A **free rider** takes the benefits of cooperation without paying; in a public-goods game with $n$ players and multiplier $m$ a coin given returns only $m/n$ to the giver, so each is tempted to keep it. According to Norenzayan, belief in watchful, morally concerned **big gods** helped large groups of strangers cooperate. According to D. S. Wilson, selection acting between groups can favour traits good for the group, which gene-level critics (Williams, Dawkins) doubt. In the **by-product** view, religion is a side effect of mental tools evolved for other jobs; in the **adaptation** view, religion itself was selected for what it does.

      All of these describe features shared by every human mind. This lesson asks a different question: why do societies differ so much, and why does belief rise in some places and fall in others?

  - type: mcq
    id: hook
    title: "Guess: two neighbours, two answers"
    prompt: |
      Guessing is the point; no theory yet. Two neighbouring wealthy countries have similar schools, similar science and people with the same kinds of minds. In one, most adults say religion is very important to them; in the other, few do. Every human mind has the same built-in tendencies (seeing agents, being drawn to memorable ideas, reacting to costly signals). What does that tell you about explaining the difference?
    options:
      - text: 'The shared tendencies cannot explain a difference by themselves; something that varies between the countries must be involved.'
        correct: true
        feedback: |
          Yes. A cause that is the same in both places cannot account for a difference between them. Whatever explains it has to vary: how children learn from the adults around them, how safe life feels, how religion is organised.
      - text: 'One country must have people with different minds.'
        feedback: |
          Large differences in belief appear between groups of people whose minds, as far as anyone can measure, work in the same basic ways, and people moving between countries often change their practice. Differences in surroundings are the more natural suspect.
      - text: 'One country must have had better science, and science removes belief.'
        feedback: |
          The two countries were described as having similar science. The claim that science simply removes belief is also one of the contested theories this lesson examines, not something to assume.
    explanation: |
      The rest of the lesson is a tour of the things that do vary: what is passed on and by whom, how secure life is, and how religion is organised. Each is a real candidate, and scholars disagree about their weights.

  - type: text
    id: transmission
    title: "Beliefs are learned from others"
    image:
      src: img/henrich.webp
      alt: Photograph of Joseph Henrich speaking, a man with a beard
      caption: Joseph Henrich, an anthropologist at Harvard, studies how humans learn from one another and why culture accumulates; his 2009 paper applied the idea to costly religious displays.
      credit: "Mercatus Center, CC BY 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Joseph_Henrich_at_Mercatus_Center.jpg"
    body: |
      Most of what a person believes about gods, ghosts or the dead was not worked out alone but learned from the people around them. Researchers on **cultural transmission** ask who is copied, and why. Two biases are often described. In **conformist bias** a learner leans towards what most people in the group do or believe, a sensible shortcut when most people are partly informed. In **prestige bias**, studied by Henrich and Gil-White (2001), a learner copies those whom others freely defer to, because a person admired for skill is often a good source of skill.

      Henrich's book *The Secret of Our Success* argues that such learning, rather than individual cleverness alone, is what lets human groups accumulate knowledge. Neither bias is a settled finding in every setting, and some researchers doubt how strong they are. For religion they give a simple picture: a child who grows up among believers, and sees admired adults pray, is likely to end up praying.

  - type: mcq
    id: bias-q
    title: "Which bias?"
    prompt: |
      A girl grows up in a village where nearly everyone she knows fasts during one month each year, and she fasts too. A boy decides to learn his grandmother's remedy for fever because she is known across the valley as a healer whom people consult and honour. Which description fits the two best?
    options:
      - text: 'The girl follows what the majority does (conformist bias); the boy follows someone people freely defer to (prestige bias).'
        correct: true
        feedback: |
          Yes. The girl copies the common practice; the boy copies a respected expert, though her skill is also what makes the remedy worth copying.
      - text: 'Both follow prestige, because the girl is copying people she likes.'
        feedback: |
          The girl is not picking out admired individuals; she copies what nearly everyone does. That is the conformist pattern.
      - text: 'Both follow the majority, because the village as a whole respects the healer.'
        feedback: |
          The boy chooses a particular person because of her skill and standing, not because most people do the same. Prestige bias is learning from a chosen model.
    explanation: |
      The two biases can point the same way (a respected majority) or apart (a prestigious dissenter), which is part of why cultures can change as well as persist.

  - type: text
    id: creds
    title: "Actions that make words credible"
    body: |
      Henrich (2009) added a question: how does a learner tell whether a model really holds a belief, or merely says so to gain something? His answer, in essence: learners can trust a model more when the model acts in a way that would be **costly if the belief were false**. He called these **credibility-enhancing displays**. A preacher who urges generosity and then gives away her wealth displays credibility; a preacher who urges it while keeping a comfortable house does not. Henrich argued that such displays help beliefs spread and are one route by which costly religious practices persist.

      This builds on the costly-signal logic of the previous lesson, with a change of audience: there, a signal tells the group who is committed; here, it tells a learner how much to trust a teacher.

  - type: mcq
    id: creds-q
    title: "Which teacher is more convincing?"
    prompt: |
      Two teachers each tell a village that a certain river spirit punishes anyone who pollutes the water. Teacher A drinks and washes only upstream and spends her own savings to clean the bank. Teacher B says the same words but bathes downstream of the village's waste when no one looks. According to Henrich's idea of credibility-enhancing displays, which does a learner have more reason to believe, and why?
    options:
      - text: 'Teacher A: her costly actions would make little sense if she did not hold the belief, so the display makes her words credible.'
        correct: true
        feedback: |
          Yes. The cost she pays is what separates her from someone who only says the words.
      - text: 'Teacher B: a belief that needs no sacrifice is easier to trust.'
        feedback: |
          Easy words are what a manipulator would also offer. The point of the idea is that cost makes a display informative.
      - text: 'Neither, since the idea says only the group as a whole can be credible.'
        feedback: |
          The idea is about an individual model and a learner. Group effects enter in other parts of the cultural-evolution story, not in this step.
    explanation: |
      The same logic explains why a person who gives up something for a belief can persuade more than one who only argues for it, whether or not the belief is true. That last point matters later: persuasion by costly display says nothing about truth.

  - type: text
    id: diversity
    title: "How much religion varies"
    body: |
      Variation is large. Recall the study by Peoples, Duda and Marlowe (2016), who coded 33 hunter-gatherer societies and found active high gods (a supreme being who intervenes in human affairs) in only about 15% of them, while belief in spirits was widespread. According to Norenzayan, moralising big gods become common later, in large societies of strangers, though the historical order is disputed (the lesson Religion and the Group gave the details). Within a single faith, practice also differs between regions and periods.

      The contrast is useful for one reason: if gods who care about morals were a built-in output of the mind, we would expect them everywhere; their uneven spread suggests that culture and social setting shape which ideas flourish. That is an argument, not a proof, and the next cards look at what scholars have proposed.

  - type: mcq
    id: diversity-q
    title: "What does variation suggest?"
    prompt: |
      A cognitive account says religious ideas arise from mental tools every human shares. Which observation about religion in different societies is most awkward for the claim that those tools alone explain what people believe?
    options:
      - text: 'Societies with the same mental tools differ a great deal in whether their gods intervene in human affairs.'
        correct: true
        feedback: |
          Yes. The shared tools may explain why gods and spirits are easy to think, but a difference between societies needs something that differs between them: transmission, setting, institutions.
      - text: 'People in every society can understand stories about invisible agents.'
        feedback: |
          That is what the cognitive account predicts: the tools are shared, so such stories are widely understood. It does not make the account awkward.
      - text: 'Children in all societies show some early tendency to look for agents.'
        feedback: |
          Again this fits the account. A universal tendency is exactly its claim; the awkward fact is the variation that sits on top of it.
    explanation: |
      Cognitive tendencies set what is easy to believe; culture and conditions help decide what is actually believed and passed on. Most scholars in the field hold some blend of the two.

  - type: text
    id: secular-theory
    title: "The classical secularisation story"
    image:
      src: img/weber.webp
      alt: Black and white photograph of Max Weber in 1918
      caption: Max Weber (1864-1920), a German sociologist, described the rationalisation of modern life; his lecture on science as a vocation, given in 1917 and printed in 1919, speaks of the disenchantment of the world.
      credit: "Ernst Gottmann, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Max_Weber,_1918.jpg"
    body: |
      By the twentieth century many sociologists expected religion to fade as societies modernised. **Secularisation** is the decline of religion's social weight and of individual belief and practice. Max Weber argued that modern life is shaped by **rationalisation** (organising life by calculation, rules and expertise), and that its end point is the **disenchantment of the world**: nature is explained by laws rather than spirits, and religion loses its place as the account of how things work. Weber's own view of religion was more subtle than a prediction of its end, but the phrase became the banner of the theory.

      Peter Berger, in *The Sacred Canopy* (1967), proposed a mechanism. A shared faith is like a canopy: it feels natural while everyone around you holds it. In a modern, **pluralist** society, many faiths and non-faiths live side by side, so each looks like one option among others, and belief loses its taken-for-granted feel.

  - type: mcq
    id: secular-q
    title: "Berger's mechanism"
    prompt: |
      According to Berger's 1967 account, why would living among neighbours of many different faiths tend to weaken belief?
    options:
      - text: 'A faith that looks like one option among many loses its taken-for-granted status, so it is held with less certainty.'
        correct: true
        feedback: |
          Yes. The claim is about plausibility: what feels obvious in a uniform community feels like a choice in a mixed one.
      - text: 'Meeting other faiths proves that all of them are false.'
        feedback: |
          The mechanism is psychological and social, not a proof. Meeting other views changes how certain a person feels, not what is true.
      - text: 'Different faiths compete for believers and the winner takes all.'
        feedback: |
          That is closer to the competition idea of the religious-economies school, which predicts the opposite effect on participation. Berger's mechanism concerns plausibility.
    explanation: |
      Notice that this mechanism makes a prediction that can be tested: more pluralism, less belief. Later in the lesson a rival school predicts the reverse.

  - type: text
    id: berger-reversal
    title: "The theory's own author changes his mind"
    image:
      src: img/berger.webp
      alt: Portrait photograph of Peter L. Berger in 2010
      caption: Peter L. Berger (1929-2017), an Austrian-born American sociologist, first helped build secularisation theory and later argued that much of the world is as religious as ever.
      credit: "Felix Grünschloss / ZAK, Attribution, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Peter_Ludwig_Berger_(3x4_cropped).jpg"
    body: |
      By the late twentieth century the picture looked less simple. In 1999 Berger edited *The Desecularization of the World: Resurgent Religion and World Politics*, and he came to describe his earlier claim that modernity must secularise as a mistake. Religion was thriving in large parts of the world, including in highly modern societies. According to Berger and later commentators, what modernity reliably produces is **pluralism**, the coexistence of many views, and pluralism does not by itself decide whether people lose belief.

      So the question changes from "will religion disappear?" to "why does it decline here, persist there and grow elsewhere?" The next cards give three answers.

  - type: text
    id: security
    title: "Existential security"
    body: |
      Pippa Norris and Ronald Inglehart (1934-2021), in *Sacred and Secular* (2004, second edition 2011), proposed that religion answers a need that is strongest where life is **insecure** (poverty, illness, violence, war). According to them, people in rich, secure societies feel less need for religious reassurance, so religiosity erodes slowly across generations, while in poorer and more vulnerable societies it stays high. They drew on surveys of nearly 80 societies. The theory expects the world to split: rich societies growing more secular, poor ones staying religious and, because they have more children, making up a growing share of the world.

      The theory also explains the American puzzle (a rich country with high belief) by inequality: the United States has many people who are poorly covered against illness and job loss, so it holds a large insecure group inside a rich country.

  - type: numeric
    id: survey
    title: "Reading an invented survey"
    prompt: |
      Invented numbers for practice. In the country of Norland a survey splits adults into three income groups of equal size. The share saying religion is very important to them is 72% in the lowest third, 55% in the middle third and 38% in the highest third. What share of all Norland adults say religion is very important? Give a percentage.
    answer: 55
    tolerance: 0.5
    answerText: '55'
    wrong:
      - { value: 72, feedback: 'That is only the lowest third. The whole population includes all three groups.' }
      - { value: 34, feedback: 'That is the gap between the lowest and the highest third (72 minus 38). The question asks for the overall share.' }
    hint: 'With equal-sized groups, the overall share is the plain average of the three shares.'
    explanation: |
      With equal-sized groups each counts a third: $(72 + 55 + 38)/3 = 165/3 = 55$. The gap $s_L - s_H = 72 - 38 = 34$ percentage points is the number the existential-security theory would point to, since it says insecure groups are more religious.

  - type: mcq
    id: survey-q
    title: "What the gap does and does not show"
    prompt: |
      In an invented survey the lowest income third of a country is 34 percentage points more likely to call religion very important than the highest third. A friend says: "This proves that poverty makes people religious." Which reply is fairest?
    options:
      - text: 'It fits the security theory, but it does not prove it: income also goes with age, region, schooling and community ties, any of which could be at work.'
        correct: true
        feedback: |
          Yes. A gap between groups is a pattern to explain, and several causes could produce it. Testing the theory needs comparisons across countries and over time, which is what its authors used, not one table.
      - text: 'It shows nothing, since surveys cannot measure anything about belief.'
        feedback: |
          Self-report surveys have limits, but the pattern is a data point that any theory has to account for. Dismissing all surveys goes too far.
      - text: 'It shows that religious people choose to be poorer.'
        feedback: |
          Nothing in the table supports a direction like that, and the reverse reading is no better supported. A correlation does not give its own direction.
    explanation: |
      A security theorist reads the gap as insecurity driving religion. A critic can point to a confound (for example age, since older people are both poorer on average and more religious in many countries) or to a reversed direction. Telling these apart takes more data, not a firmer tone.

  - type: text
    id: economies
    title: "Religion as a market"
    body: |
      A rival school looks at **supply** rather than need. Rodney Stark (1934-2022) and Roger Finke, in *Acts of Faith* (2000), define a **religious economy** as all the religious activity in a society and treat the demand for religion as roughly constant. According to them, differences come from how the market is organised. Where the state backs one church and limits others, that church faces little competition and can grow lazy, and participation falls. Where many churches compete freely, each works to attract members, and participation is high. Their favourite contrast is the United States (open, competitive, high attendance) against much of Western Europe (state-backed churches, low attendance).

      Notice that this predicts the opposite of Berger's 1967 mechanism: more diversity, more participation, rather than less.

  - type: mcq
    id: economies-q
    title: "A critic's answer"
    prompt: |
      Voas, Olson and Crockett (2002, American Sociological Review) examined the claim that more religious pluralism goes with higher participation. They argued that the correlation reported in earlier studies could appear even when pluralism has no effect on participation, because of a mathematical relationship between the way the two are measured, and found no compelling evidence of an effect. What does this tell us about the supply-side theory?
    options:
      - text: 'Its main evidence is disputed on technical grounds, so the theory stays a live proposal, not a settled result.'
        correct: true
        feedback: |
          Yes. The critics did not show that supply never matters, only that the usual evidence for the pluralism link may be an artefact. Chaves and Gorski (2001) reviewed the literature and likewise found no general positive link.
      - text: 'It is refuted, because the critics showed that pluralism lowers participation.'
        feedback: |
          They did not claim a negative effect; they found no compelling evidence of any effect. That also goes against Berger's mechanism.
      - text: 'It is confirmed, because disagreement shows the theory is important.'
        feedback: |
          Importance and truth are different things. A theory that draws a serious technical objection is less certain, not confirmed.
    explanation: |
      Both schools of the earlier cards (pluralism lowers belief, competition raises participation) had weakly supported cores, which helps explain why the field moved to broader models that combine several causes.

  - type: text
    id: cases
    title: "Decline, persistence and growth"
    body: |
      Real cases mix all this. In the United States, the Pew Research Center's Religious Landscape Studies found the share of adults with no religious affiliation (the **nones**: atheists, agnostics and "nothing in particular") at 16.1% in 2007 and 22.8% in 2014. The 2023-24 study put it at 29%, and described the rise as having levelled off for now. The Christian share was 78.4% in 2007, 70.6% in 2014 and 62% in 2023-24. Pew also found that, among people who change religion, far more leave to become unaffiliated than join from the unaffiliated.

      In Brazil, census figures from the national statistics institute IBGE show the Catholic share fell from 73.6% in 2000 to 64.6% in 2010, while the evangelical (largely Pentecostal) share rose from 15.4% to 22.2%, and the no-religion share was 8% in 2010. So one country can show decline of an established church and growth of another movement at once, which no single story of steady secularisation predicts.

  - type: numeric
    id: cases-q
    title: "Reading the Brazil numbers"
    prompt: |
      In Brazil's census, the Catholic share was 73.6% in 2000 and 64.6% in 2010; the evangelical share was 15.4% in 2000 and 22.2% in 2010. By how many percentage points did the Catholic share fall between 2000 and 2010?
    answer: 9
    tolerance: 0.05
    answerText: '9.0'
    wrong:
      - { value: 6.8, feedback: 'That is the rise of the evangelical share (22.2 minus 15.4). The question asks for the Catholic fall.' }
      - { value: 12.2, feedback: 'The difference of the 2010 Catholic share and the 2000 evangelical share mixes two groups. Compare the Catholic share with itself.' }
    hint: 'Subtract the 2010 Catholic share from the 2000 Catholic share.'
    explanation: |
      $73.6 - 64.6 = 9.0$ percentage points. The evangelical share rose by $22.2 - 15.4 = 6.8$ points, so the Catholic fall is larger than the evangelical gain; the rest of the shift went to other categories, including people with no religion.

  - type: mcq
    id: readings
    title: "Three readings of one pattern"
    prompt: |
      A rich country has a long-established state church, falling attendance for decades, and rising numbers of people with no affiliation. One scholar says it is mainly existential security, a second says mainly the lack of competition among churches, a third says mainly rising pluralism weakening plausibility. Which statement is accurate?
    options:
      - text: 'Each reading can claim the pattern as support, so the data alone do not settle which is right; the readings may also all contribute.'
        correct: true
        feedback: |
          Yes. A rich, secure, uncompetitive, mixed society fits all three stories, which is why a single case cannot decide. Comparing many cases, with each factor varied alone, can.
      - text: 'Only the security reading fits, because the country is rich.'
        feedback: |
          Wealth fits security, but the state-church monopoly fits the supply reading just as well, and diversity fits the plausibility reading. Fitting one does not exclude the others.
      - text: 'None fits, because a state church cannot decline.'
        feedback: |
          State-backed churches can and do lose members; the supply-side school says that is exactly what monopoly tends to produce.
    explanation: |
      Notice also how each theory handles the United States. Security points to its inequality, supply to its free market, and Berger's early theory to its pluralism, though the last would predict lower belief. Each handles the case, with a different price.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    prompt: |
      Sort three claims. (a) The share of unaffiliated US adults rose from 16.1% in 2007 to 22.8% in 2014 in Pew's studies. (b) Rising existential security is the main cause of declining religion in rich countries. (c) A religion that persists because of its costly displays is true. Which sorting fits the three layers?
    options:
      - text: '(a) established as survey data, (b) a live debate among scholars, (c) a faith or metaphysical commitment that no survey tests (and spread by costly display tells us nothing about truth).'
        correct: true
        feedback: |
          Yes. (a) is a measured result, (b) is a contested causal theory, and (c) mixes up why a belief spreads with whether it is correct.
      - text: '(a) a live debate, (b) established, (c) a faith commitment.'
        feedback: |
          The measurements in (a) are reported data, and (b) is contested; the order of the first two is reversed.
      - text: 'All three are established facts.'
        feedback: |
          Only (a) is a measured result. (b) is a hypothesis with rivals, and (c) would need an argument about truth beyond any survey.
    explanation: |
      A believer and a non-believer can accept the same data on belief and its variation and still differ on what it means for truth. The next lesson, Does Explaining Belief Explain It Away?, takes up exactly that.

  - type: text
    id: summary
    body: |
      **Next:** Does Explaining Belief Explain It Away? If beliefs spread by learning, display, security and market structure, does that undermine them? Or does the same kind of story explain true beliefs, such as those about science? The next lesson is a guided proof about the genetic fallacy and debunking arguments.
