id: ch20-reincarnation
title: "Reincarnation Evidence and Its Critics"
kind: concept
own: |
  The setting: according to Spiritism, the doctrine of Allan Kardec (1804-1869), a spirit is reborn many times, always as a human, never moving backwards, and normally forgets its past lives. A **case of the reincarnation type** is a young child who speaks of a previous life; it is **solved** when a dead person who fits the statements, the *previous personality*, is identified. The psychiatrist Ian Stevenson (1918-2007) founded the Division of Perceptual Studies at the University of Virginia in 1967 to collect such cases. Below $R$ is the hypothesis that the child is that person reborn, $N$ the rival that normal causes (chance, contact between the families, shaping by adults) produced the case, and $E$ the evidence of the case.
  - **Bayes in odds form.** The odds after the evidence are the odds before it times the likelihood ratio LR:
    {{ $$\frac{P(R\mid E)}{P(N\mid E)}=\frac{P(E\mid R)}{P(E\mid N)}\cdot\frac{P(R)}{P(N)}$$ }}
    In a toy case with prior odds $1{:}1000$ and LR $=0.5/0.001=500$, the posterior odds are $0.5$, a probability of about 33%.
  - **Contamination shrinks the LR.** If the families met before anyone wrote down what the child said, normal causes can explain a match too: with $P(E\mid N)=0.25$ instead of $0.001$,
    $$\text{LR}=\frac{0.5}{0.25}=2.$$
    That is why the strongest cases are those {{ with written records of the child's statements made before the previous personality was identified }}: about 33 of some 2,500 cases on file by 2005. Schouten and Stevenson (1998) found about the same share of correct statements with records (76.7%) as without (78.4%).
  - **Birthmarks.** In *Reincarnation and Biology* (1997) Stevenson reported over two hundred cases in which a child's birthmark or birth defect matched a wound on the previous personality, often a fatal one; an autopsy report was found in 49 of 210 cases, so most matches rest on testimony. Critics ask by what mechanism a wound could pass to a new body, and whether matches beat chance.
  - **The standard criticisms.** Leading questions, contact between the families before the interviews, memories of informants that grow over the years, and **cultural shaping**: cases are reported mostly where rebirth is believed, and their details follow local belief (no change of sex among the Druze, 12% of cases in Sri Lanka). Many cases do not add up as independent evidence when {{ a common cause, such as a culture that expects rebirth, could produce them all }}.
  - **Where people part ways.** Defenders (Stevenson, Jim Tucker, Erlendur Haraldsson's replications) say the strongest cases resist normal explanation, while Stevenson held that the evidence suggests rebirth without compelling belief. Critics (Paul Edwards, Leonard Angel, Champe Ransom) say flawed methods and a very low prior leave normal causes far ahead. Layers: what was recorded and published is fact; how strong the cases are is debate; that a spirit returns is faith.

cards:
  - type: mcq
    id: hook
    title: "Guess: a child who remembers"
    prompt: |
      Before any theory, guess. An invented case: a three-year-old keeps saying she used to live in a village two hundred kilometres away, names a husband and a shop, and says she died in a fall. Her family follows the clues, finds a family who lost a woman of that name, and the two families agree that much of what the child said fits. Which detail would most raise the weight of this case as evidence?
    options:
      - text: "Someone outside both families wrote down the child's statements before anyone went looking for the other family."
        correct: true
        feedback: |
          Yes. A record made before the search fixes what the child actually said. Without it, what is remembered of her words can drift, honestly, toward what was later found. This lesson builds on that idea.
      - text: "The child spoke about the past life with strong emotion, often crying."
        feedback: |
          Strong emotion shows the child is sincere and involved, which matters for understanding her, but a child can feel strongly about a story she absorbed from adults. Emotion does not tell us where the information came from.
      - text: "Both families are sure the match is real."
        feedback: |
          Their certainty is honest, but two families who have met and talked can build a shared version of the story together. Agreement after contact is weaker than a record made before it.
      - text: "The child's family already believed in reincarnation."
        feedback: |
          This cuts the other way. A family that expects rebirth may read a child's chatter as memories and look for a match, which is exactly what a critic would worry about.
    explanation: |
      Both a defender of these cases and a critic can agree on this: what the child said must be fixed before it can be checked. They part ways over how many real cases meet that standard, and what follows from the ones that do.

  - type: text
    id: recall
    title: "Recall: rebirth according to Spiritism"
    body: |
      Recall from the lesson The Core Principles: according to Spiritism, the doctrine of Allan Kardec (1804-1869), each person is a **spirit** (an immortal mind) joined to a body, and the spirit lives many bodily lives, a doctrine called **reincarnation** (rebirth in a new body). In Spiritism a spirit is always reborn as a human, never goes backwards morally, and normally **forgets** its past lives, which according to the Spirits' Book protects its freedom.

      Does anything in the world look like what this predicts? Some researchers have tried to find out. Recall from the lesson Karma, Samsara, Moksha that children who speak of a past life usually begin at about age two or three and stop by six or seven. A typical **case of the reincarnation type** has this shape: a young child makes statements about a previous life; someone looks for a dead person who fits; if one is found, the case is called **solved**, and that dead person is the **previous personality**. For a Spiritist, such a case would be a rare gap in the normal forgetting. For a critic, it is a story that grew between two families.

  - type: text
    id: stevenson
    title: "Ian Stevenson and how a case is studied"
    image:
      src: img/stevenson.webp
      alt: "Black and white portrait of a young man with short dark hair, in a jacket and tie."
      caption: "Ian Stevenson in 1952, fifteen years before he founded the University of Virginia unit that still studies children who speak of past lives."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Ian_Stevenson_(Postgraduate_Medicine,_1952).jpg"
    body: |
      The best known investigator is the Canadian-born American psychiatrist **Ian Stevenson** (1918-2007). In 1967 he left the chair of psychiatry at the University of Virginia to found a research unit now called the **Division of Perceptual Studies**, with support from the inventor Chester Carlson, and directed it until 2002. His first book on the subject, *Twenty Cases Suggestive of Reincarnation* (1966, revised and enlarged 1974), already shows the method in its title: the cases *suggest*, they do not prove.

      A case was studied by interviewing the child, the parents and other witnesses, then the family of the previous personality, separately where possible; by listing each statement and checking it against what was known of the dead person; by asking whether the families could have had contact; and by looking for documents, such as death records and autopsy reports. Stevenson searched each case for normal explanations (fraud, self-deception, chance, misunderstanding) and concluded that for the strongest ones none sufficed.

  - type: mcq
    id: order
    title: "Why the order matters"
    prompt: |
      In most solved cases of the reincarnation type, the child's family found the previous personality's family themselves, and investigators arrived later and wrote down what both families remembered the child had said. Why do critics and investigators alike treat this order as a weakness?
    options:
      - text: "Once the families have met, their memories of the child's early words can be shaped, without any dishonesty, by what they learned about the dead person."
        correct: true
        feedback: |
          Yes. Memory is rebuilt each time a story is told. A statement such as "a house near water" can be remembered later as "a house by the lake", once the lake is known. Defenders agree, which is why they rank cases with early records as the best.
      - text: "Because families who find each other are always lying."
        feedback: |
          No investigator on either side claims this. The worry is honest drift of memory, which needs no lie at all; fraud is a separate and rarer charge.
      - text: "Because the investigators' late arrival makes the child forget."
        feedback: |
          The child's memories tend to fade by age six or seven anyway. The problem is not what the child forgets but what the adults come to remember the child said.
      - text: "There is no weakness: a statement is either correct or not, whenever it is written down."
        feedback: |
          Whether a statement is correct depends on its exact words, and the exact words are what get lost. A record written after the match was found can no longer tell us what was said before it.
    explanation: |
      This is the same rule as in the lesson The Mediumistic Method and Its Controls: write the prediction down before you look. Here the "prediction" is the child's statements, and the "look" is the search for the other family.

  - type: text
    id: records
    title: "Cases with records made before"
    body: |
      Investigators call the stronger kind **cases with written records made before verification**: someone wrote down the child's statements before the previous personality was identified, or before the families met. The record need not be made by a scientist; parents, journalists or local helpers sometimes made it.

      Such cases are rare. According to the Psi Encyclopedia of the Society for Psychical Research, by 2005 only 33 of the roughly 2,500 cases in the Virginia files had records of this kind.

  - type: numeric
    id: share
    title: "How rare?"
    prompt: |
      By 2005, according to the Psi Encyclopedia, 33 of the roughly 2,500 cases of the reincarnation type in the University of Virginia files had written records of the child's statements made before the previous personality was identified. What percentage of the cases is that?
    answer: 1.32
    tolerance: 0.05
    answerText: '1.32% ($33/2500$)'
    wrong:
      - { value: 13.2, feedback: "Check the decimal point: $33/2500 = 0.0132$, and $0.0132\\times100 = 1.32$ percent." }
      - { value: 0.0132, feedback: "That is the fraction. Multiply by 100 to get a percentage." }
    hint: Divide 33 by 2,500, then multiply by 100.
    explanation: |
      $33/2500 = 0.0132$, about 1.3%. A critic notes that nearly 99% of the collection rests on memories gathered after the families met. A defender answers that the question is not how many cases are strong but whether the strong ones can be explained away.

  - type: text
    id: schouten
    title: "Does memory drift explain the matches?"
    body: |
      Could the matches be built by drifting memory? That idea, that families who believe in rebirth unconsciously elaborate a child's words after they meet, is called the **socio-psychological hypothesis**. The Dutch parapsychologist **Sybo Schouten** of Utrecht University and Stevenson tested one prediction of it in 1998 (*Journal of Nervous and Mental Disease*), using cases from India and Sri Lanka.

      If drift after the meeting builds the matches, cases whose statements were recorded *after* the families met should show a higher share of correct statements than cases recorded *before*. They found about the same share: 76.7% of statements correct with early records, 78.4% without. The cases with early records also had many more statements recorded per child. The authors concluded that they found no support for the hypothesis that such circumstances inflate the apparent memories.

  - type: mcq
    id: schouten-read
    title: "Two readings of one result"
    prompt: |
      Schouten and Stevenson (1998) found that, in cases from India and Sri Lanka, about the same share of a child's statements were correct whether or not they were written down before the families met (76.7% versus 78.4%). Which conclusion does this result support, and which does it not?
    options:
      - text: "It counts against drift after the meeting as the main source of the matches, but it does not rule out other normal sources, such as information that reached the child before any record was made."
        correct: true
        feedback: |
          Yes. A defender stresses the first half: the strongest normal explanation for the matches predicted a difference and found none. A critic stresses the second half: a record fixes what the child said, not where the child heard it, and a family that talked about a local death in front of a toddler leaves no record.
      - text: "It proves reincarnation."
        feedback: |
          It tests one rival explanation. Ruling out one rival raises the odds of every remaining explanation, normal ones included; it does not single out rebirth.
      - text: "It shows the matches are all due to chance."
        feedback: |
          The study compared two kinds of cases; it did not estimate how often a child's statements would fit some dead person by chance. That needs a different calculation.
      - text: "It shows that written records make no difference, so they are not worth making."
        feedback: |
          The records are what made the comparison possible. Without them nobody could check whether drift inflates the matches; the result rests on them.
    explanation: |
      A good test removes one rival explanation at a time. Here memory drift after the meeting was the rival tested; the debate continues over leaks of information before the records and over how the cases were selected.

  - type: widget
    id: odds
    widget: odds-updater
    config:
      prior: 1.0e-3
      lr: 500
      priorMin: -9
      priorMax: 0
      lrMax: 6
      axisMin: -10
      axisMax: 4
      labels:
        prior: "Prior probability of rebirth (toy)"
        lr: "Likelihood ratio of one case"
      presets:
        - { label: "A clean case, LR 500", lr: 500 }
        - { label: "Families met first, LR 2", lr: 2 }
        - { label: "A sceptic's prior, 1e-6", prior: 1.0e-6 }
        - { label: "A believer's prior, 0.1", prior: 0.1 }
    body: |
      Recall Bayes in odds form for one case: $R$ = the child is the previous personality reborn, $N$ = normal causes produced the case, $E$ = the evidence of the case. The odds after the evidence are the odds before it times the **likelihood ratio** (LR), how much likelier the evidence is under $R$ than under $N$:

      $$\frac{P(R\mid E)}{P(N\mid E)}=\text{LR}\cdot\frac{P(R)}{P(N)}$$

      In an invented case, suppose a match this good would happen half the time if $R$ were true and once in a thousand cases under $N$ if the families never met: LR $=0.5/0.001=500$. If they met before anyone wrote anything down, normal causes explain a match far more easily. The prior is a toy number, not a measurement.

      Press "A clean case", then "Families met first", and watch the orange evidence segment shrink. Then try the sceptic's and the believer's priors: the same case moves both by the same amount on the bar, yet they end far apart.
    review: false

  - type: numeric
    id: posterior
    title: "One clean case"
    prompt: |
      An invented case of the reincarnation type, with statements recorded before the families met. Let $R$ be the hypothesis that the child is the dead person reborn and $N$ that normal causes produced the case. Suppose the evidence $E$ is 500 times likelier under $R$ than under $N$ (likelihood ratio 500), and that before the case a researcher's prior odds of $R$ against $N$ were $1{:}1000$. What is the posterior probability of $R$, in percent?
    answer: 33.333
    tolerance: 0.5
    answerText: '33% (posterior odds $0.5$, probability $0.5/1.5$)'
    wrong:
      - { value: 50, feedback: "Posterior odds of $0.5$ mean 1 to 2, not a probability of 0.5. Convert: probability $= \\text{odds}/(1+\\text{odds})$." }
      - { value: 0.05, feedback: "Odds multiply: $500\\times\\tfrac{1}{1000}$. Then convert the odds to a probability." }
    hint: Multiply the prior odds by the likelihood ratio, then turn odds $o$ into a probability $o/(1+o)$.
    explanation: |
      Posterior odds $=500\times\tfrac{1}{1000}=0.5$, that is 1 to 2, so the probability is $0.5/1.5\approx33\%$. A strong case moves a doubtful prior a long way, yet leaves it below even odds; a sceptic with prior odds of one in a million would end near one in two thousand.

  - type: numeric
    id: contaminated
    title: "When the families met first"
    prompt: |
      The same invented case, but now the two families met and talked for months before anyone wrote down the child's statements. Suppose a match this good would still happen with probability $0.5$ if the child is the dead person reborn, but now happens with probability $0.25$ under normal causes, because the adults' memories could have absorbed what they learned. What is the likelihood ratio of the case?
    answer: 2
    tolerance: 0.01
    answerText: '2 ($0.5/0.25$)'
    wrong:
      - { value: 0.5, feedback: "The likelihood ratio puts the rebirth hypothesis on top: $P(E\\mid R)/P(E\\mid N) = 0.5/0.25$." }
      - { value: 500, feedback: "That was the ratio when the families had not met and normal causes gave a match only once in a thousand times. Contact raises $P(E\\mid N)$ to $0.25$." }
      - { value: 0.125, feedback: "The likelihood ratio divides the two probabilities; it does not multiply them." }
    hint: Likelihood ratio $= P(E\mid R)/P(E\mid N)$.
    explanation: |
      $\text{LR}=0.5/0.25=2$. The case looks the same on paper, but it now favours rebirth only twice as much as normal causes: contact made the evidence cheap to explain. This is why investigators on both sides rank cases by what was recorded, and when.

  - type: text
    id: birthmarks
    title: "Birthmarks: the claim"
    body: |
      Stevenson's largest work, *Reincarnation and Biology: A Contribution to the Etiology of Birthmarks and Birth Defects* (1997, two volumes of over two thousand pages), adds a physical kind of evidence. He reported over two hundred cases in which a child who spoke of a previous life had a birthmark or a birth defect that matched a wound on the previous personality, often the fatal one. In 18 of them, he wrote, a child had two marks matching the entry and exit wounds of a gunshot. His rule for a match was that mark and wound fall within a 10 cm square when placed on an adult body.

      Why does this matter? A birthmark is on the body from birth and can be photographed; it cannot drift the way remembered words do. On the other side, Stevenson found an **autopsy report** (a doctor's written examination of the body after death) for the wound in only some cases; in the rest the wound's position rests on what witnesses remembered.

  - type: numeric
    id: autopsy
    title: "How many with a medical record?"
    prompt: |
      According to Ian Stevenson (1993), in birthmark cases of the reincarnation type he obtained an autopsy report on the previous personality's wounds in 49 of 210 cases. In what percentage of the cases did the match rest on a medical record?
    answer: 23.33
    tolerance: 0.3
    answerText: '23% ($49/210$)'
    wrong:
      - { value: 76.67, feedback: "That is the share without an autopsy report, $161/210$. The question asks for the cases with one." }
      - { value: 4.29, feedback: "Divide the cases with a record by all the cases: $49/210$, not $210/49$." }
    hint: Divide 49 by 210 and multiply by 100.
    explanation: |
      $49/210\approx0.233$, about 23%. In the other three quarters the position of the wound comes from witnesses. A defender adds that firsthand witnesses of a wound are often reliable; a critic answers that the witnesses usually spoke after they had seen the child's mark.

  - type: mcq
    id: birthmark-critics
    title: "Two objections to the birthmarks"
    prompt: |
      Two critics answer Stevenson's birthmark cases. The philosopher Paul Edwards argued that no known mechanism could carry a wound from a dead body to an unborn child. The philosopher Leonard Angel argued that some matches were found by reasoning backwards from the child's mark to the wound, and that matches were not shown to beat chance. How do the two objections differ?
    options:
      - text: "Edwards's objection lowers the prior of rebirth (it seems impossible), while Angel's lowers the likelihood ratio of the cases (the evidence is weaker than it looks)."
        correct: true
        feedback: |
          Yes. In the odds form, Edwards attacks the starting odds and Angel attacks the multiplier. A defender answers them differently: to Edwards, that a lack of known mechanism has not stopped science from accepting a fact before (the lesson The Core Principles recalls William James's idea that a brain might transmit a mind rather than make it); to Angel, by pointing to cases with autopsy reports.
      - text: "They say the same thing in different words."
        feedback: |
          One says rebirth is very unlikely before we look at any case; the other says the cases themselves were measured badly. One could accept either and reject the other.
      - text: "Angel's objection is about the prior, Edwards's about the evidence."
        feedback: |
          It is the other way round. "No possible mechanism" is a reason to doubt rebirth before any case is examined: a prior. "Matches found by reasoning backwards" is about how strong the evidence of the cases is: the likelihood ratio.
      - text: "Both prove that birthmarks are never related to wounds."
        feedback: |
          Neither claims to prove a negative. Edwards argues the idea is too improbable; Angel argues the evidence was not well measured. Both leave the question of particular cases open.
    explanation: |
      Separating "is it possible?" from "is the evidence good?" is half of every debate about odd claims. A believer and a sceptic can share the likelihood ratio and still disagree, because their priors differ.

  - type: text
    id: critics
    title: "The standard criticisms"
    body: |
      Recall from the lesson The Core Principles that the American philosopher **Paul Edwards** (1923-2004), in *Reincarnation: A Critical Examination* (1996), raised the objections from memory and from population. The same book was a sharp attack on Stevenson's cases: Edwards called them full of holes, while granting that he had a high regard for Stevenson's honesty. Other critics add four worries.

      **Leading questions.** Champe Ransom, a lawyer who was Stevenson's research assistant from 1970 to 1973, wrote a critique of *Twenty Cases*: questions that suggested the answer, investigations too short, room left for memories to grow, and contact between the families before the interviews. Stevenson replied that he had raised these pitfalls himself in the book's first chapter.

      **Cultural artefacts.** The Indian philosopher C. T. K. Chari argued that the cases are shaped by local belief and by **paramnesia** (false memory) and **cryptomnesia** (forgotten information that resurfaces as if new).

      **Motives.** The writer Ian Wilson noted that in some cases poor children recalled richer lives, and suspected a wish for a better status, while granting that coaching cannot explain many cases.

  - type: text
    id: culture
    title: "Culture in the cases"
    body: |
      Stevenson himself wrote that such cases are reported most often in countries and cultures where belief in rebirth is strong, and that we know little about how often they really occur. Their details follow local belief too. According to the Psi Encyclopedia's summary of his data, a change of sex between lives is reported in about 3% of Indian cases and 12% of Sri Lankan ones, where Hindu and Buddhist teaching allows it, and in none among the Druze of Lebanon or the Tlingit of Alaska, whose traditions do not.

      A critic reads this as the stories being made by the culture. A defender gives a second reading: belief may shape which memories adults take seriously and report, as it shapes which dreams are told, without making the memories. Stevenson also pointed to cases in families with no belief in rebirth, and he and others later published Western cases.

  - type: mcq
    id: which-answer
    multiple: true
    title: "What does an early record answer?"
    prompt: |
      An invented case: a journalist wrote down a child's statements a month before anyone found the family of the previous personality, and most statements proved correct. Which criticisms of cases of the reincarnation type does this record answer? Select all that apply.
    options:
      - text: "That adults' memories of the child's words drifted toward the facts after the families met."
        correct: true
        feedback: |
          Yes. The written words were fixed before the meeting, so later drift cannot have shaped them.
      - text: "That investigators asked leading questions after the match was found."
        correct: true
        feedback: |
          Yes, for the statements in the record: they were made before any investigator knew what to lead toward. Questions asked while making the record could still lead, so a careful reader asks how the journalist questioned the child.
      - text: "That the child heard about the dead person from someone, before any record was made."
        feedback: |
          No. A record fixes what the child said, not where the child learned it. If the death was talked about in the village, the information could have reached the child first; this is the cryptomnesia worry, and it needs a check of possible contacts.
      - text: "That rebirth is very unlikely before any case is examined."
        feedback: |
          No. That is a claim about the prior, and no single record can change anyone's prior; it can only raise the likelihood ratio of the case.
    explanation: |
      Each control removes one rival explanation, as in the lesson The Mediumistic Method and Its Controls. A record made before verification removes drift and late leading; it leaves early leaks of information and the prior untouched.

  - type: text
    id: defenders
    title: "The defenders' replies"
    image:
      src: img/tucker.webp
      alt: "Portrait photograph of a smiling man with a shaved head and glasses, in a light blue shirt and a dark dotted tie."
      caption: "Jim Tucker, the child psychiatrist who carried on Stevenson's work and directed the Virginia unit from 2014 until he retired in 2025."
      credit: "Dan Addison, University of Virginia Public Affairs/Audio Visual Dept, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Jim_Tucker_(cropped).jpg"
    body: |
      Stevenson's own position was cautious. In essence, he wrote that the evidence is not flawless and does not compel belief in reincarnation, yet that rebirth is the best, though not the only, explanation of the strongest cases.

      The American child psychiatrist **Jim B. Tucker** (born 1960) continued the Virginia work: his *Life Before Life* (2005) surveys four decades of the files, and *Return to Life* (2013) turns to American cases, families without a local tradition of rebirth.

      Stevenson also asked other researchers to check his findings on their own. In 1994 the anthropologist Antonia Mills, the Icelandic psychologist **Erlendur Haraldsson** (1931-2020) and the psychologist Jürgen Keil reported cases each had investigated independently of him, with the same general pattern. Haraldsson also compared children who spoke of past lives with matched children who did not, in Sri Lanka and among the Druze of Lebanon. The children with such memories showed more daydreaming and more signs of **dissociation** (a loosening of the usual unity of thought, memory and identity), but in his view these traits did not explain what the children said.

  - type: mcq
    id: haraldsson
    title: "Reading Haraldsson's comparison"
    prompt: |
      According to Erlendur Haraldsson's studies in Sri Lanka and Lebanon, children who speak of a previous life show more daydreaming and dissociation than matched children who do not. A critic and a defender both read this finding. Which pair of readings is fair to each?
    options:
      - text: "Critic: such children may be more prone to fantasy, so their stories may be imagined. Defender: the traits do not explain the specific correct statements, and might even follow from the memories."
        correct: true
        feedback: |
          Yes. The finding fits both, which is why it settles little alone. What would separate them is whether the correct statements are more likely than chance, given what the child could have heard.
      - text: "Critic: the finding proves fraud. Defender: the finding proves rebirth."
        feedback: |
          Neither follows. A trait such as daydreaming says nothing about deception, and a psychological difference between two groups of children says nothing about where their information came from.
      - text: "Both agree the finding is irrelevant to the cases."
        feedback: |
          It is relevant: it bears on one rival explanation, fantasy. It just does not decide between fantasy and memory by itself.
    explanation: |
      A single result often fits several hypotheses. The useful question is never "does this fit my view?" but "how much likelier is it under one view than the other?", the likelihood ratio again.

  - type: mcq
    id: trap-many
    title: "Trap: thousands of cases"
    prompt: |
      Someone argues: "There are about 2,500 cases in the Virginia files. Even if each one only doubles the odds of rebirth, $2^{2500}$ is an overwhelming number, so the evidence is overwhelming." What is the main flaw?
    options:
      - text: "Likelihood ratios multiply only for independent evidence; if one common cause, such as a culture that expects rebirth and families who look for matches, could produce all the cases, they count far less than independent cases."
        correct: true
        feedback: |
          Yes. This is the rule from the lesson The Mediumistic Method and Its Controls: mediums who share a source count as one witness. A defender agrees with the rule and answers that the strongest cases differ in place, culture and kind, so they are not all one witness; a critic answers that the shared method of collection is itself a common cause.
      - text: "$2^{2500}$ is not actually a large number."
        feedback: |
          It is enormous, about $10^{752}$. The arithmetic is fine; the flaw is in treating the cases as independent pieces of evidence.
      - text: "Nothing is wrong: more cases always means stronger evidence, multiplied."
        feedback: |
          Many copies of one rumour are not many pieces of evidence. More cases help only insofar as each one could not be explained by the same normal cause as the others.
      - text: "The cases cannot be evidence at all, since rebirth is impossible."
        feedback: |
          That assumes the answer. Cases can be evidence; the question is how strong. Saying "impossible" sets the prior to zero, which no evidence could ever move.
    explanation: |
      Counting cases is not weighing them. Both sides of the debate agree that a few clean, independent cases would matter more than thousands of contaminated ones.

  - type: mcq
    id: layers
    multiple: true
    title: "Sorting the claims"
    prompt: |
      Which of these statements are *established fact* (layer 1), true whatever one believes about rebirth? Select all that apply.
    options:
      - text: "Ian Stevenson published Twenty Cases Suggestive of Reincarnation in 1966 and Reincarnation and Biology in 1997."
        correct: true
        feedback: |
          Yes: facts about his publications.
      - text: "Only a small fraction of the cases in the Virginia files have written records made before verification."
        correct: true
        feedback: |
          Yes: a count of the files (33 of about 2,500 by 2005). What the count means for the evidence is layer 2.
      - text: "The strongest cases cannot be explained by normal causes."
        feedback: |
          That is a live debate (layer 2): Stevenson and Tucker hold it, Edwards, Angel and Ransom deny it.
      - text: "The children in solved cases are the previous personalities reborn."
        feedback: |
          That is a faith or metaphysical commitment (layer 3), shared by Spiritism and other traditions of rebirth, the very thing the evidence is about.
    explanation: |
      Layer 1: what was recorded, counted and published. Layer 2: how strong the cases are and which explanation fits them best. Layer 3: that a spirit returns in a new body.

