id: ch20-science-view
title: "Guided proof: Could Mediumship Be Tested?"
kind: guided
proof: true
own: |
  The setting: according to Spiritism, the doctrine of Allan Kardec (1804-1869), a **medium** is a person through whom spirits of the dead communicate. A toy test of one medium's claim: in each of $n = 10$ trials the medium gives a reading for an absent dead person known only by a first name, to a stand-in who knows nothing about them; the real relative then receives $k = 5$ unlabelled readings in random order (one real, four made for other people) and picks the one that fits. A **hit** is picking the real one; $X$ is the number of hits.
  - **The design argument.** P1 a proxy sitter removes cues from the sitter (cold reading); P2 a blind choice among decoys removes general statements that fit anyone; P3 random order removes guessing patterns; P4 writing $n$, $k$ and the threshold down in advance removes moving the goalposts. C: if every premise holds and no unusual source of information exists, each trial is a hit with chance $p_0 = 1/k$, independently, so $X$ follows the binomial law
    {{ $$P(X=x)=\binom{n}{x}p^{x}(1-p)^{n-x}$$ }}
    with $p = p_0 = 1/5$, where $\binom{n}{x}$ counts the ways to place $x$ hits among $n$ trials.
  - **Threshold, false positives and power.** A threshold $t$ (hits needed, fixed in advance) is passed by chance alone with the **false-positive rate** $P(X\ge t\mid p_0)$, and by a medium with the claimed hit rate $p_1 = 1/2$ with the **power** $P(X\ge t\mid p_1)$:
    $$P(X\ge5\mid p_0)\approx3.28\%$$
    $$P(X\ge5\mid p_1)\approx62.3\%$$
    Raising $t$ to 6 cuts false positives to 0.64% but also cuts power to 37.7%, so with $n = 10$ {{ a failed test is weak evidence against the claim }} (the odds move only by a factor of about 0.63).
  - **Bayes in odds form.** For the claim $H_1$ (the medium has the claimed rate) against chance $H_0$, after evidence $E$:
    {{ $$\frac{P(H_1\mid E)}{P(H_0\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_0)}\cdot\frac{P(H_1)}{P(H_0)}$$ }}
    The first factor on the right is the likelihood ratio LR. Six hits give $\text{LR}=0.205/0.0055\approx37$; with toy prior odds of $1{:}1000$ the posterior is about 3.6%.
  - **Validity is a separate check.** Even a passed test with every rival removed shows at most that {{ the medium had information no normal route explains }}, not where it came from: survival of the dead and information from the living (sometimes called super-psi) predict the same hits. Moving $t$ after seeing the data, or running many tests and reporting the best, inflates false positives (best of 5 runs at $t = 5$: about 15%).
  - **Where people part ways.** Tests built this way exist: Julie Beischel and Gary Schwartz (2007, *Explore*) and Beischel and colleagues (2015) reported positive results under multiple blinding; Ciarán O'Keeffe and Richard Wiseman (2005, *British Journal of Psychology*) found no evidence of ability. Spiritists add that, according to Kardec, spirits are free and may not come on demand; critics answer that a claim no test can touch makes no prediction. Layers: that such studies were run and what they reported is fact; how to weigh them is debate; that spirits are the source is faith.

cards:
  - type: mcq
    id: hook
    title: "Guess: what would convince you?"
    prompt: |
      Before any theory, guess. An invented medium, Ada Morrow, says that during a reading the spirits of your dead relatives tell her true things about them that she could not otherwise know. She agrees to a test. Which result, from which kind of test, would move you most?
    options:
      - text: "She does better than chance at picking out true facts for strangers she never sees, under rules written down before the test, with nobody present who knows the answers."
        correct: true
        feedback: |
          This is the shape this lesson builds, step by step. Each part of it (strangers, unseen, rules written first, nobody who knows) removes one ordinary way of getting the facts right. A defender of mediumship and a sceptic can both accept it as fair.
      - text: "She tells a grieving family many things that they say are deeply true, and they weep."
        feedback: |
          The family's experience is real and it matters to them, but it cannot tell us where the information came from. A face, a voice, a nod and general statements that fit most families can all produce the same reaction.
      - text: "She has done readings for thirty years and has thousands of satisfied clients."
        feedback: |
          Long practice shows sincerity and skill with people, but satisfied clients are not a count of hits against misses. Nobody kept score of the statements that did not fit.
      - text: "She agrees to be tested at all; a fraud would refuse."
        feedback: |
          Many sincere people, and some who are not, agree to tests. Agreeing says nothing about the result. What matters is how the test is built and what it finds.
    explanation: |
      What would refute the claim is the other half of the question: with the same rules, a score no better than chance. The lesson asks how big a score must be, how often chance alone reaches it, and what a pass would and would not show.

  - type: text
    id: recall
    title: "Recall: controls and the odds"
    body: |
      Recall from the lesson The Mediumistic Method and Its Controls: according to Kardec, a message counts only if it passes the **universal control**, the agreement of mediums who are strangers to one another. If $q$ is the chance that one medium gives the agreed answer with no real source behind it, each independent agreement multiplies the odds by $1/q$, so $n$ independent mediums give the **likelihood ratio**
      $$\text{LR}=\frac{1}{q^{n}}.$$
      Mediums who share a book or a circle count, as evidence, as one medium.

      Recall from the lesson Reincarnation Evidence and Its Critics: Bayes' rule in odds form says that the odds after evidence $E$ are the odds before it times the LR. For a hypothesis $H_1$ against a rival $H_0$:
      $$\frac{P(H_1\mid E)}{P(H_0\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_0)}\cdot\frac{P(H_1)}{P(H_0)}$$
      **Contamination** (a normal route by which the information could have arrived) raises $P(E\mid H_0)$ and shrinks the LR: in the toy case of that lesson, from $0.5/0.001 = 500$ to $0.5/0.25 = 2$. A test must keep $P(E\mid H_0)$ small and known.

  - type: text
    id: design
    title: "The test, as premises"
    body: |
      Here is a test of Ada Morrow's claim, in the style of modern laboratory studies. There are $n = 10$ trials. In each, a dead person is chosen, and Ada is told only the first name. She gives her reading by phone to a **proxy sitter**, a stand-in who knows nothing about the dead person or the family. Later the real relative (the **sitter**) receives $k = 5$ readings, typed, unlabelled and in random order: the real one and four made for other people, the **decoys**. The sitter picks the one that fits best. A **hit** is picking the real one. Before any trial, Ada and the testers write down $n$, $k$ and the number of hits $t$ that will count as a pass.

      Set out as premises:

      P1. Ada receives no cue from the sitter or anyone who knows the dead person.

      P2. The sitter chooses blind, among decoys made the same way.

      P3. The order of the readings is random.

      P4. $n$, $k$ and $t$ are fixed before the data are seen.

      C. If P1 to P4 hold and there is no unusual source of information, each trial is a hit with chance $p_0 = 1/5$, independently of the others.

  - type: mcq
    id: proxy
    title: "What does the proxy sitter remove?"
    prompt: |
      In a test of a medium, the reading is given to a proxy sitter, a stand-in who knows nothing about the dead person or the family, and the real relative is not present. Which rival explanation of a medium's success does this step remove?
    options:
      - text: "Cold reading: picking up cues from the sitter's face, voice, age and reactions, and steering the reading by them."
        correct: true
        feedback: |
          Yes. A sitter who nods, hesitates or says "yes, my father" feeds the reading without meaning to. A proxy who knows nothing has nothing to give away. Skilled cold readers can produce striking readings this way, and many mediums say they do not use it; the proxy removes the question.
      - text: "General statements that fit almost anyone, such as 'he had a difficult relationship with someone close'."
        feedback: |
          The proxy does nothing about general statements: Ada could still say things that fit most families. That rival is removed by a different step, the blind choice among decoys.
      - text: "The possibility that spirits exist."
        feedback: |
          A control removes ordinary routes to the answer, not the hypothesis being tested. If spirits were the source, a proxy sitter would not stop them.
      - text: "Fraud by the sitter, who might lie about the dead person."
        feedback: |
          The sitter is not even present at the reading. What the sitter could still do is judge with wishful eyes, which is why the sitter's choice is made blind.
    explanation: |
      Each premise of the test removes one ordinary route by which right answers could appear. P1, the proxy sitter, removes cues during the reading.

  - type: mcq
    id: decoys
    title: "Why choose among decoys?"
    prompt: |
      In a test of a medium, the real relative receives five unlabelled readings in random order (the real one and four decoys made for other dead people) and picks the one that fits best. Why not simply ask the relative to rate how well the real reading fits?
    options:
      - text: "Many statements fit nearly everyone, so a rating of one reading measures how general it is; the choice among decoys asks whether the real reading fits this person better than readings made for others."
        correct: true
        feedback: |
          Yes. "He loved the outdoors" fits a great many fathers. In a blind choice such statements help the decoys as much as the real reading, so only information specific to this dead person can lift the hit rate above one in five. The tendency to accept general statements as personal is called the **Barnum effect**.
      - text: "Because relatives always lie in their ratings."
        feedback: |
          No one need lie. A relative who knows which reading is real will, quite honestly, notice what fits and pass over what does not. The blind choice protects an honest judge from that.
      - text: "To make the test harder for the medium than it should be."
        feedback: |
          The decoys do not lower the bar for real information: a reading with true, specific facts still stands out. They only stop general statements from counting as hits.
      - text: "Because ratings cannot be turned into numbers."
        feedback: |
          Ratings can be scored, and studies do score them. The problem is not numbers but a baseline: without decoys there is nothing to compare the rating with.
    explanation: |
      P2 (blind choice among decoys) gives the test a **baseline**: the chance of a hit with no real information is known, $p_0 = 1/k$. P3 (random order) stops position from carrying a cue, and P4 (rules fixed first) is the subject of a later card.

  - type: text
    id: studies
    title: "Tests that have been run"
    image:
      src: img/wiseman.webp
      alt: "Head and shoulders of a smiling bald man with glasses and a short grey beard, in a dark T-shirt, against a black background."
      caption: "Richard Wiseman in 2014; he began his working life as a magician before studying psychology, and later co-designed a blinded test of mediums."
      credit: "Vera de Kok derivative work: Hic et nunc, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Richard_Wiseman_-_EdSciFest_2014_(cropped).JPG"
    body: |
      Such tests are not hypothetical. The psychologists **Ciarán O'Keeffe** and **Richard Wiseman** (born 1966, of the University of Hertfordshire) published a test in the *British Journal of Psychology* in 2005. Five professional mediums each gave a reading for each of five sitters, 25 readings in all, without ever meeting them, from a separate room. Each sitter then rated every statement of all 25 readings without knowing which were meant for them. According to the authors, the study found no evidence of mediumistic ability; general statements were rated highly by everyone.

      The researcher **Julie Beischel**, with a doctorate in pharmacology and toxicology from the University of Arizona, and the University of Arizona psychologist **Gary Schwartz** published a **triple-blind** test in the journal *Explore* in 2007: eight mediums read by phone knowing only a first name, an experimenter who knew nothing served as proxy sitter, and the sitters scored pairs of readings blind. They reported a positive result ($p = 0.007$). In 2015 Beischel and colleagues at the Windbridge Institute, a research centre she opened in Arizona in 2008, reported a replication with 20 mediums and 86 readings under five levels of blinding, again positive.

  - type: widget
    id: counter
    title: "How many hits is enough?"
    widget: hit-counter
    config:
      n: 10
      k: 5
      p1: 0.5
      t: 5
      locked: [n, k]
      labels:
        chance: "chance only, p0 = 1/5"
        claim: "claimed rate, p1 = 1/2"
        t: "Hits needed, t"
        p1: "Claimed hit rate, p1"
      presets:
        - { label: "t = 5", t: 5 }
        - { label: "t = 6", t: 6 }
        - { label: "t = 3", t: 3 }
    body: |
      Ada's test has $n = 10$ trials with $k = 5$ readings to choose among, so chance alone gives a hit with $p_0 = 1/5$. Ada claims she can do much better, say $p_1 = 1/2$ (half her readings picked out). The orange bars show how often each number of hits $X$ happens by chance alone; the blue bars, how often it happens if her claim is true. The purple dashed line is the threshold $t$, fixed in advance.

      Drag the threshold or press the buttons. The **false-positive rate** is the chance that luck alone passes the test; the **power** is the chance that a medium with the claimed rate passes it. Watch what happens to both as $t$ moves.
    review: false

  - type: mcq
    id: tradeoff
    title: "Strict or loose?"
    prompt: |
      In a test of a medium with $n = 10$ trials and a chance hit rate $p_0 = 1/5$, a medium who claims a hit rate $p_1 = 1/2$ passes if she scores at least $t$ hits. With $t = 5$ chance alone passes 3.28% of the time and the claimed medium 62.3%; with $t = 6$ the figures are 0.64% and 37.7%. What does raising the threshold do?
    options:
      - text: "It makes a false pass by luck much rarer, but also makes a genuine medium (if her claim is true) more likely to fail."
        correct: true
        feedback: |
          Yes. One number cannot be lowered for free: a stricter threshold protects against luck and costs power. The two sides of a debate often disagree over which error worries them more.
      - text: "It makes the test better in every way, since fewer false passes is all that matters."
        feedback: |
          A test that almost no genuine medium could pass would tell us little when she fails. With $t = 6$ a medium with the claimed rate fails more often than she passes (62.3% of the time).
      - text: "Nothing important; the threshold only changes how the result is reported."
        feedback: |
          The threshold decides which results count as a pass. Both error rates move with it, as the readouts show.
      - text: "It raises the chance of a false pass, since more hits are needed."
        feedback: |
          More hits needed means luck reaches the bar less often, not more: the orange bars at 6 hits and above add up to less than those at 5 and above.
    explanation: |
      The usual remedy for both errors at once is more trials: with larger $n$, chance and the claimed rate pile their hits in places further apart, so one threshold can keep false positives low and power high.

  - type: text
    id: binomial
    title: "Counting hits by chance"
    body: |
      Where do the orange bars come from? Under conclusion C each trial is a hit with chance $p$ (here $p_0 = 1/5$), independently. One particular pattern of $x$ hits and $n - x$ misses, say hits on the first $x$ trials, has probability $p^{x}(1-p)^{n-x}$, by multiplying independent chances. Every other pattern with $x$ hits has the same probability, and the number of such patterns is the **binomial coefficient** $\binom{n}{x}$, read "$n$ choose $x$": the number of ways to choose which $x$ of the $n$ trials are hits. For example $\binom{10}{5} = 252$. So the chance of exactly $x$ hits is the **binomial law**
      $$P(X=x)=\binom{n}{x}p^{x}(1-p)^{n-x}.$$
      The chance of passing a threshold $t$ is the **tail**, the sum of these terms for $x = t, t+1, \dots, n$, written $P(X\ge t)$.

  - type: build
    id: build-binomial
    title: "Build one bar"
    prompt: |
      In a test of a medium with $n = 10$ trials, each trial is a hit by chance with probability $p_0 = 1/5$, independently. Build the chance of exactly 5 hits by chance alone, using the binomial law (number of ways to place the hits, times the chance of one such pattern).
    prefix: 'P(X=5)='
    tiles: ['\binom{10}{5}', '(1/5)^{5}', '(4/5)^{5}', '(1/5)^{10}', '\binom{10}{1}', '(4/5)^{10}']
    answers:
      - ['\binom{10}{5}', '(1/5)^{5}', '(4/5)^{5}']
      - ['\binom{10}{5}', '(4/5)^{5}', '(1/5)^{5}']
    wrong:
      - { answer: ['(1/5)^{5}', '(4/5)^{5}'], feedback: "That is the chance of one particular pattern, such as hits on the first five trials. There are $\\binom{10}{5} = 252$ patterns with five hits, each equally likely." }
      - { answer: ['\binom{10}{5}', '(1/5)^{5}'], feedback: "The five misses matter too: each happens with chance $4/5$, so the pattern needs the factor $(4/5)^5$." }
    hint: |
      Count the patterns with five hits, then multiply the chance of five hits by the chance of five misses.
    explanation: |
      $$P(X=5)=\binom{10}{5}\Big(\frac15\Big)^{5}\Big(\frac45\Big)^{5}$$
      that is $252 \times 0.00032 \times 0.32768 \approx 0.0264$, about 2.64%.

  - type: numeric
    id: tail
    title: "The chance of a false pass"
    prompt: |
      Ada Morrow's test has $n = 10$ trials, each a hit by chance with probability $p_0 = 1/5$, and the threshold written down in advance is $t = 5$ hits. By the binomial law, the chances of exactly 5, 6, 7 and 8 or more hits by chance alone are about 2.642%, 0.551%, 0.079% and 0.008%. In percent, what is the chance that luck alone passes the test, $P(X\ge5\mid p_0)$?
    answer: 3.28
    tolerance: 0.02
    answerText: '3.28%'
    wrong:
      - { value: 2.64, feedback: "That is the chance of exactly 5 hits. Passing means 5 hits or more, so the terms for 6, 7 and 8 or more are added." }
      - { value: 96.72, feedback: "That is the chance of failing, $1 - 0.0328$. The question asks for the chance of passing by luck." }
    hint: |
      Passing means $X = 5$ or $X = 6$ or more; add the four given terms.
    explanation: |
      $$\begin{aligned}P(X\ge5\mid p_0)&\approx2.642+0.551\\&\quad+0.079+0.008\\&\approx3.28\%\end{aligned}$$
      This is about 3.28%, roughly one chance in 30. This is the test's **false-positive rate** at $t = 5$. Whether one in 30 is strict enough depends on how surprising the claim is, which is where the prior odds come in.

  - type: mcq
    id: failure
    title: "What counts against the claim?"
    prompt: |
      Ada Morrow claims a hit rate $p_1 = 1/2$. In a test of $n = 10$ trials with chance rate $p_0 = 1/5$ and threshold $t = 6$ fixed in advance, she scores 4 hits and fails. If her claim is true she would fail with probability 62.3%; by chance alone a person fails with probability 99.4%. What does this one failure show?
    options:
      - text: "Little: the likelihood ratio for her claim is about $0.623/0.994 \\approx 0.63$, so it lowers her odds only a bit. A strong case against needs more trials or many failed tests."
        correct: true
        feedback: |
          Yes. A test with low power cannot refute much, because a genuine medium would often fail it too. A fair refutation needs a test that the claimed ability would pass most of the time.
      - text: "It refutes the claim, since she did not reach the threshold."
        feedback: |
          Failing a test that a genuine medium fails 62% of the time is not a refutation. The failure is about 0.63 times as likely under her claim as under chance, a small shift.
      - text: "Nothing at all; only passes count as evidence."
        feedback: |
          A failure is evidence: it is a little more likely if she has no ability (99.4%) than if she has it (62.3%). With enough trials, failures add up to strong evidence against.
      - text: "It proves she is a fraud."
        feedback: |
          A failed test says nothing about honesty. Most people tested in such studies are sincere, and a sincere medium can fail as easily as a fraudulent one.
    explanation: |
      The same odds rule works in both directions. Before the test, the claimant and the testers should agree on a design that the claimed ability would pass with high power, so that a failure would really count against it.

  - type: mcq
    id: spirits-free
    title: "The Spiritist reply"
    prompt: |
      According to Kardec's *Mediums' Book* (1861), in its chapter on evocations, a spirit can refuse to come when called: asked whether a spirit can refuse, the spirits answer, in an English translation, "Certainly he can; where would be his free-will if he could not?" The book adds that calls made from mere curiosity weary serious spirits. A Spiritist concludes that failed laboratory tests do not count against mediumship. Which answer to this reply is the strongest?
    options:
      - text: "If spirits may or may not come, the claim predicts nothing for any single test; but then a pass also could not be credited to them. The fair version asks the medium to state in advance what she expects, and counts the misses against that."
        correct: true
        feedback: |
          This is the critic's answer at its strongest, and it respects the Spiritist premise. A claim that explains any result equally well gains nothing from a success. The Spiritist can reply that she does expect hits on average, and then a long series of tests applies.
      - text: "The reply is irrational and can be dismissed."
        feedback: |
          The reply follows from a premise of the doctrine, the freedom of spirits, and Kardec stated it long before laboratory tests. The useful question is what it implies for testing, not whether to dismiss it.
      - text: "The reply shows that mediumship is proved, since spirits could explain the failures."
        feedback: |
          Explaining away a failure is not evidence for the claim. It only stops the failure from counting against it.
      - text: "Kardec forbade all testing of mediums."
        feedback: |
          The opposite: Kardec urged controls such as comparing mediums who are strangers to one another and checking messages by reason. His caution was against frivolous calls, not against care.
    explanation: |
      Both sides can accept a long series: if spirits sometimes come, the hit rate over many trials should still beat $p_0$. Beischel's studies use mediums who were screened beforehand and agreed to the protocol, which is one way of meeting the Spiritist worry.

  - type: widget
    id: observed
    title: "Six hits: how strong?"
    widget: hit-counter
    config:
      n: 10
      k: 5
      p1: 0.5
      t: 5
      x: 6
      locked: [n, k, p1, x]
      tSlider: false
      threshold: false
      handle: false
      readout: { lr: true, t: false, fp: false, power: false }
      labels:
        chance: "chance only, p0 = 1/5"
        claim: "claimed rate, p1 = 1/2"
        x: "Observed hits, x"
        p1: "Claimed hit rate, p1"
    body: |
      Suppose Ada scores $x = 6$ hits out of 10. The triangle marks 6 on the axis. The likelihood ratio compares how probable exactly 6 hits are under her claim ($p_1 = 1/2$, blue) and under chance alone ($p_0 = 1/5$, orange): about $0.205$ against $0.0055$. Read the ratio off the readout.
    review: false

  - type: numeric
    id: posterior
    title: "From the ratio to the odds"
    prompt: |
      A medium scores 6 hits in a test of 10 trials with chance rate $p_0 = 1/5$. The chance of exactly 6 hits is about $0.205$ if her claimed rate $p_1 = 1/2$ is true and about $0.0055$ by chance alone, so the likelihood ratio is about 37. A doubtful reader starts with toy prior odds of $1{:}1000$ for the claim against chance. By Bayes' rule in odds form, what are the posterior odds for the claim (as a decimal)?
    answer: 0.0373
    tolerance: 0.002
    answerText: '$\approx 0.037$ (about 1 : 27, a probability of about 3.6%)'
    wrong:
      - { value: 37.25, feedback: "That is the likelihood ratio alone. The posterior odds are the ratio times the prior odds, $1/1000$." }
      - { value: 0.001, feedback: "That is the prior. The evidence multiplies it by the likelihood ratio, about 37." }
    hint: |
      Posterior odds = likelihood ratio × prior odds.
    explanation: |
      $$37.25\times\frac{1}{1000}\approx0.037$$
      odds of about 1 to 27, a probability of about 3.6%. For a reader with even prior odds the same result gives odds of about 37 to 1. The data are the same; the priors differ, and this is exactly where readers part ways.

  - type: mcq
    id: validity
    title: "If the test is passed"
    prompt: |
      Suppose a test of a medium had a proxy sitter, blind choice among decoys, random order and rules fixed in advance, and it was repeated by independent laboratories, always beating the threshold. Which conclusion follows from the design, and which does not?
    options:
      - text: "It would follow that the medium had information no normal route explains; it would not follow that the dead are its source, since information from living minds (sometimes called super-psi) predicts the same hits."
        correct: true
        feedback: |
          Yes. The design removes normal routes; it cannot sort the unusual ones. Beischel and Schwartz said as much of their 2007 study: the results could not separate survival of the dead from other unusual explanations.
      - text: "It would prove that spirits of the dead exist."
        feedback: |
          The test compares one rival, chance with no unusual source, against everything else. Survival is one candidate among several for "everything else".
      - text: "It would show nothing, since any result can be explained by chance."
        feedback: |
          Chance is exactly what the test measures. A result repeated by independent laboratories, each with a small false-positive rate, becomes very hard to blame on luck.
      - text: "It would show that the controls were broken."
        feedback: |
          A broken control is always worth checking for, and critics do check. But a pass is not itself proof that a control failed; that would make the claim untestable from the critic's side.
    explanation: |
      This is the validity step, kept apart from the truth of the premises. The argument is valid only for its own conclusion C: hits beyond chance, with normal routes closed. A critic attacks the premises (was any control leaky?); a Spiritist adds a further premise (the best explanation of such information is a spirit). Both moves are open, and both need arguments.

  - type: numeric
    id: best-of
    title: "Trap: report the best run"
    prompt: |
      A medium with no unusual ability takes the same test five times: each run has 10 trials, chance hit rate 1/5, and threshold 5 hits, so one run is passed by luck with probability about $0.0328$. Only the best run is reported. In percent, what is the chance that at least one of the five runs passes by luck?
    answer: 15.4
    tolerance: 0.2
    answerText: '15.4%'
    wrong:
      - { value: 16.4, feedback: "That is $5\\times3.28\\%$, which counts the runs where two passes happen twice. Use one minus the chance that all five fail." }
      - { value: 3.28, feedback: "That is the chance for one run. Five tries give luck five chances." }
    hint: |
      The chance that all five runs fail is $(1-0.0328)^5$.
    explanation: |
      $$1-(1-0.0328)^{5}\approx0.154$$
      about 15%, nearly five times the stated false-positive rate. With 20 runs it would be about 49%. That is why P4 asks that every run be registered in advance and every result reported, failures included.

  - type: mcq
    id: moving
    title: "Trap: move the threshold"
    prompt: |
      A test of a medium had 10 trials with chance hit rate 1/5 and a threshold of 5 hits written down in advance. She scores 4 hits. The testers then say that 4 hits is impressive and lower the threshold to 4. By chance alone, 4 or more hits happen about 12.1% of the time, 5 or more about 3.3%. What is wrong with this move?
    options:
      - text: "A threshold chosen after seeing the data is chosen to fit them; the real false-positive rate of 'pass at 4' is about 12%, nearly four times the 3.3% the test promised."
        correct: true
        feedback: |
          Yes. The protection of the test came from fixing $t$ first. Moving it after the result turns a failure into a pass while keeping the look of a strict test.
      - text: "Nothing, as long as they report the new threshold honestly."
        feedback: |
          Honest reporting helps a reader spot the problem, but the false-positive rate is still about 12%, and the result is a failure by the rules fixed in advance.
      - text: "The move is wrong only because 4 hits is below the chance average."
        feedback: |
          The chance average is $10 \times 1/5 = 2$ hits, so 4 is above it. The fault is choosing the threshold after the data, whatever the score.
      - text: "It is fine because a believer and a critic would both prefer a pass."
        feedback: |
          A critic would not, and a believer who wants the result to persuade others should not either: a pass after a moved threshold persuades no one who checks.
    explanation: |
      The same trap appears in other forms: choosing which measure to report after seeing several, or stopping the test when the score looks good. The cure is the same: preregistration, writing the whole plan down before the data exist.

  - type: mcq
    id: two-readings
    title: "Two readings of the record"
    prompt: |
      O'Keeffe and Wiseman (2005) tested five mediums under blind conditions and found no evidence of ability. Beischel and Schwartz (2007) and Beischel and colleagues (2015) tested mediums under multiple blinding and reported results beyond chance. Which response is fair to both sides?
    options:
      - text: "Look at differences in design (which mediums, how readings were scored, how many trials), ask for independent replication outside one laboratory, and count every study, failed ones included."
        correct: true
        feedback: |
          This is what both a defender and a critic can sign. Defenders point to the improved blinding of the later studies; critics point to small samples, scoring choices and the fact that the positive results come largely from one laboratory. Both questions are answered by more and independent tests.
      - text: "The negative study settles it, because it was run by sceptics."
        feedback: |
          Who runs a study does not settle its result. A well-designed study counts whoever runs it, and a critic's study can have flaws just as a believer's can.
      - text: "The positive studies settle it, because they used more layers of blinding."
        feedback: |
          Better blinding is a real strength, but one laboratory's positive results do not settle a claim this surprising. Independent replication is the standard both sides ask for elsewhere.
      - text: "Mixed results show that mediumship cannot be studied scientifically."
        feedback: |
          Mixed results are common in young fields. They show that the question is open and that design matters, not that it is beyond testing.
    explanation: |
      This is a live debate, not a settled fact. What is established is that such studies were run, how they were built and what they reported.

  - type: mcq
    id: layers
    title: "Three layers"
    multiple: true
    prompt: |
      Sort these claims about testing mediums. Which are **established facts**, as opposed to live debates or faith commitments? Select all that apply.
    options:
      - text: "In 2005 O'Keeffe and Wiseman published a blinded test of five mediums in the British Journal of Psychology."
        correct: true
        feedback: |
          A matter of record: the paper exists and states its design and result.
      - text: "With 10 trials and a chance hit rate of 1/5, chance alone gives 5 or more hits about 3.3% of the time."
        correct: true
        feedback: |
          A mathematical fact, which follows from the binomial law once the premises of the design hold.
      - text: "The positive results of the Windbridge studies show real anomalous information."
        feedback: |
          This is a live debate: defenders and critics disagree about the design, the scoring and the need for replication.
      - text: "When a medium succeeds, the information comes from the spirits of the dead."
        feedback: |
          This is a faith commitment (or a further metaphysical step): no test design can separate survival from other unusual sources.
    explanation: |
      Layers: the studies and the mathematics are fact; the weight of the positive results is debate; the source of any real information is faith or metaphysics.

