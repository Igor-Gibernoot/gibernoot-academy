id: ch20-comparison
title: "Spiritism, Christianity and Eastern Rebirth"
kind: concept
own: |
  The setting: *Spiritism*, the doctrine Allan Kardec (1804-1869) compiled in *The Spirits' Book* (1857, enlarged 1860), compared with Christianity (Catholic and Protestant) and with the Hindu and Buddhist teachings on rebirth. According to Spiritism a living person is
  $$\text{body}+\text{perispirit}+\text{spirit}$$
  where the *perispirit* is a semi-material envelope that stays with the spirit after death, and the spirit is an individual created by God that lives many human lives and never goes backwards. Each view below is taught according to its own texts; which one is true is where readers part ways.
  - **What Spiritism takes from Christianity.** One God, Jesus as {{ the most perfect guide and model God has offered (Spirits' Book, question 625) }}, and the moral teaching of the Gospels, read by Kardec in *The Gospel According to Spiritism* (1864) with the motto "without charity there is no salvation". It leaves aside church dogma: Kardec, in *Genesis* (1868), set aside the question of Christ's nature and treated him as a spirit of the highest order, and Spiritist writers after him do not call him God the Son and give the Trinity no place.
  - **Where it differs from Christianity.** The churches teach one earthly life and then judgment (Hebrews 9:27; Catechism of the Catholic Church 1013); Catholics add *purgatory*, a purification after death for the saved (Catechism 1030), which most Protestants reject; and the Catechism rejects conjuring up the dead (2116) and warns against Spiritism (2117). On salvation, Catholics call grace God's free and undeserved help that asks a free response (Catechism 1996, 2002), Protestants stress grace through faith "not of works" (Ephesians 2:8-9), and Kardec says virtue is {{ acquired by one's own efforts over successive lives }}, grace being the help God gives to all people of goodwill.
  - **Hindu rebirth.** In the Upanishads, *karma* ("action") shapes rebirth, the cycle later called *samsara* ("wandering"), which can pass into animal bodies, and *moksha* ("release") ends the cycle. Spiritism keeps many lives and an end of bodily rebirth but {{ rules out rebirth as an animal }} (Spirits' Book, question 612). Its end state, the *pure spirit*, no longer reincarnates yet keeps its individuality and serves God, nearer Ramanuja's reading of release (the self still itself, in eternal service of God) than Shankara's Advaita (the self known as Brahman, the ultimate reality).
  - **Buddhist rebirth.** According to the Buddhist teaching of *anatta* ("not-self"), a person is five changing groups (body, feeling, perception, volitions, consciousness) with {{ no lasting self passing from life to life }}: a new life arises from the old as one flame is lit from another, and *nirvana* ends the cycle. Spiritism instead has a lasting individual spirit that keeps its memories between lives.
  - **A table of four answers.**

    | View | Lives | Lasting self | Goal |
    |---|---|---|---|
    | Christian | one | soul | God, by grace |
    | Spiritist | many human | spirit | pure spirit |
    | Hindu | many, any species | *atman* | *moksha* |
    | Buddhist | many, any species | none | *nirvana* |
  - **Borrowing or convergence?** Kardec wrote that the idea of many lives is as old as humanity and that Pythagoras took it from India and Egypt, the new doctrine dropping the passage into animals. Historians such as Lynn Sharp (2006) place it in a French setting of romantic socialists (Pierre Leroux, Jean Reynaud, who wrote of souls progressing from world to world), mesmerists and a rationalized Christianity; a reviewer of her book adds selective Eastern borrowings. A third reading sees convergence: the same problem, unequal births under a just God, invites similar answers.
  - **Three layers.** Established: what each tradition's texts teach, and what was in print in France before 1857. Live debate: how much Kardec owed to his milieu. Faith: whether there are many lives, a lasting self, and which goal is real.

cards:
  - type: mcq
    id: hook
    title: "Guess: one family, two labels"
    multiple: true
    prompt: |
      Guessing is the point. Marta, an invented woman in São Paulo, says: "My family is Catholic and Spiritist. We go to Mass on Sunday and to the Spiritist centre on Wednesday." Some Brazilians describe themselves this way, though the census asks a single question about religion and does not record double belonging. Which of these beliefs could clash between the two labels? Select all that apply.
    options:
      - text: "How many earthly lives a person has: one, or many."
        correct: true
        feedback: |
          Yes. The Catholic Church teaches one earthly life followed by judgment; Spiritism teaches many lives in turn. This is the sharpest clash.
      - text: "Whether it is right to seek messages from the dead."
        correct: true
        feedback: |
          Yes. Contact with spirits through mediums is central to Spiritism, and the Catholic Catechism warns the faithful against it.
      - text: "Whether Jesus is God."
        correct: true
        feedback: |
          Yes. The Catholic creed calls Jesus true God and true man; Spiritist writers call him the most perfect spirit ever on earth, a model, but not God.
      - text: "Whether loving and helping one's neighbour matters."
        feedback: |
          Here both labels agree: the Gospels' command to love one's neighbour is shared, and Spiritism makes charity its centre. Much of Marta's double belonging rests on this common ground.
    explanation: |
      Three clashes and one large agreement. People like Marta often live with both labels without feeling the clash; theologians on both sides say the doctrines cannot both be right on lives, mediums and Jesus. This lesson compares Spiritism with Christianity, then with the Hindu and Buddhist teachings on rebirth.

  - type: text
    id: recall
    title: "Recall: the Spiritist core"
    body: |
      Recall from the lesson The Core Principles. **Spiritism** is the doctrine compiled by Allan Kardec (1804-1869) in *Le Livre des Esprits* ("The Spirits' Book", 1857, enlarged 1860), set out as numbered questions answered, he said, by spirits through mediums. Quotations here are from Anna Blackwell's English translation.

      According to the Spirits' Book, God is "the Supreme Intelligence — First Cause of all things" (question 1). A living person has three parts:
      $$\text{body}+\text{perispirit}+\text{spirit}$$
      The **spirit** is an individual created by God; the **perispirit** is a semi-material envelope that links it to the body and stays with it after death. The spirit lives many bodily lives, always human, and "He may remain stationary; but he never degenerates" (question 118). Charity, in the sense Jesus gave the word, is "Benevolence for every one, indulgence for the imperfections of others, forgiveness of injuries" (question 886), and Jesus is called "the most perfect type that God has offered to man as his guide and model" (question 625).

  - type: text
    id: gospel
    title: "A Gospel read for its morals"
    image:
      src: img/evangile-spiritisme-1871.webp
      alt: "Title page of L'Évangile selon le spiritisme by Allan Kardec, seventh edition, Paris, Librairie Spirite, with a motto about faith and reason under the author's name."
      caption: "The book's title page promises an explanation of the moral maxims of Christ, their agreement with Spiritism and their application to life; the motto says the only unshakeable faith is one that can look reason in the face."
      credit: "Book: Allan Kardec, scan: Fran6fran6, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Evangile_selon_le_spiritisme.jpg"
    body: |
      In 1864 Kardec published a book first titled *Imitation de l'Évangile selon le spiritisme*, renamed in a revised edition *L'Évangile selon le spiritisme* (*The Gospel According to Spiritism*). Its introduction divides the Gospels into five kinds of material: the ordinary events of Christ's life, the miracles, the prophecies, the words used to found the Church's dogmas, and the moral teachings. The first four, it says, have been argued over; the moral teaching is "the ground upon which all sects can meet" (Kimble and Reis translation), and it is "the sole object" of the book.

      So each chapter takes a saying of Jesus and reads it in a Spiritist light, with many lives and the progress of the spirit in the background. Jesus himself, in Kardec's comment on question 625, is "the type of the moral perfection to which man may attain upon this earth". In *Genesis* (1868) Kardec set aside the question of Christ's nature and treated him, for the argument, as a spirit of the highest order; Spiritist writers after him, such as José Carlos Monteiro de Moura, state that Jesus is not God, and the Trinity has no place in their reading.

  - type: mcq
    id: gospel-take
    title: "What does Spiritism take from the Gospels?"
    prompt: |
      According to Allan Kardec's *The Gospel According to Spiritism* (1864), which part of the Gospels does Spiritism take as its own, and how?
    options:
      - text: "The moral teaching of Jesus, read as the rule of life for a spirit progressing through many lives, with Jesus as its most perfect model."
        correct: true
        feedback: |
          Yes. Kardec singles out the moral teaching as the part no sect disputes, and reads it within his doctrine of many lives.
      - text: "The whole of church doctrine, including the Trinity, with reincarnation added on top."
        feedback: |
          Kardec set aside the words used to found the Church's dogmas. Spiritist writers do not hold that Jesus is God the Son, so this is not Christian doctrine plus one belief; it is a different reading of the same texts.
      - text: "The miracles, as proof that Jesus was God."
        feedback: |
          Spiritism does not use the miracles to prove Jesus's divinity. In *Genesis* (1868) Kardec argued that God does not suspend natural laws, and he read most Gospel miracles as natural events or as actions of spirits.
      - text: "Nothing: Spiritism draws only on messages from spirits, not on scripture."
        feedback: |
          Kardec wrote a whole book on the Gospels, and the Spirits' Book names Jesus as the model for humankind. Spiritists in Brazil often call their doctrine Christian.
    explanation: |
      Two readings of this choice. Spiritists say they recover the core of Christianity, the morals, freed from later dogma. Catholic and Protestant critics answer that the Gospels cannot be cut in two: the moral teaching is given by one they confess as Lord and God, and dropping that changes its meaning.

  - type: text
    id: differences
    title: "Where the churches part company"
    body: |
      Recall from the lesson The Core Principles: the Catechism of the Catholic Church (paragraph 1013) teaches one earthly life, citing Hebrews 9:27 (King James Version: "it is appointed unto men once to die, but after this the judgment"), and adds "There is no 'reincarnation' after death." The Catechism (2117) also warns the faithful against Spiritism, which it says "often implies divination or magical practices".

      There is one Catholic idea that looks like Spiritist purification. According to the Catechism (1030), "All who die in God's grace and friendship, but still imperfectly purified, are indeed assured of their eternal salvation; but after death they undergo purification". This is **purgatory**. Most Protestants, following the Reformers, reject it. And on who Jesus is, recall from the lesson Councils, Creeds and the Trinity: the Council of Chalcedon (451) called him truly God and truly man, a definition most churches accept.

  - type: mcq
    id: purgatory
    title: "Purgatory and rebirth"
    prompt: |
      A Catholic and a Spiritist both say that, after death, an imperfect person goes through a purification. According to the Catechism of the Catholic Church (1030) and to the Spirits' Book, what is the main difference between Catholic purgatory and Spiritist progress?
    options:
      - text: "Purgatory comes after one earthly life, without a new body, for those already saved; Spiritist progress goes through new bodily lives on earth or other worlds."
        correct: true
        feedback: |
          Yes. Both share the intuition that most people die unfinished. They differ on how the work is finished: once, after death, as preparation for heaven; or over many lives, as a climb up the scale of spirits.
      - text: "There is none: purgatory is the Catholic name for reincarnation."
        feedback: |
          The Catechism says plainly that there is no reincarnation after death, and purgatory involves no new birth on earth. The resemblance is in the purpose (purification), not in the means.
      - text: "Purgatory is a punishment that lasts forever, while Spiritist trials end."
        feedback: |
          In Catholic teaching purgatory ends: those in it are "assured of their eternal salvation". What lasts forever in Catholic teaching is hell, which is a different idea. Spiritism teaches that a spirit's suffering ends when it repents and amends (Spirits' Book, questions 1006 to 1009).
    explanation: |
      Seen from outside, purgatory and many lives answer the same question: how does an imperfect person become fit for God? Seen from inside, a Catholic reads purgatory as the last step of a salvation God has already given; a Spiritist reads each new life as a step the spirit takes by its own effort.

  - type: text
    id: grace
    title: "Grace or effort?"
    body: |
      This last contrast goes deep. According to the Catechism (1996), "Our justification comes from the grace of God", and grace is God's free and undeserved help; yet (2002) "God's free initiative demands man's free response". Protestants stress the first half: in Ephesians 2:8-9 (King James Version), "For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: not of works, lest any man should boast."

      Kardec answers in the introduction to *The Gospel According to Spiritism*. If virtue were a gift, he asks, why is it not given to all, and where would merit lie? "Spiritism is more explicit. It states that those who possess virtue have acquired it through their own efforts during successive existences". He keeps the word grace but changes its job: "Grace is the power that God bestows on all men and women of goodwill so that they may rid themselves of evil and practice the good."

  - type: mcq
    id: grace-readings
    title: "Two ways to read effort"
    prompt: |
      According to Allan Kardec's *The Gospel According to Spiritism*, a virtuous person owes their virtue to efforts made over many lives. Which reply would a Protestant theologian most likely give, and which counter-reply would a Spiritist give?
    options:
      - text: "Protestant: salvation by one's own efforts leaves room to boast and denies that we need God's gift (Ephesians 2:8-9). Spiritist: God's help is offered to all of goodwill, and only effort makes the progress one's own, so no one is favoured."
        correct: true
        feedback: |
          Yes. Each side protects a value: the Protestant, that everything good is a gift; the Spiritist, that God is fair to all and merit is real. Catholics stand between them, with grace first and a free response that cooperates.
      - text: "Protestant: Kardec agrees with Luther, since both speak of grace. Spiritist: so there is no disagreement."
        feedback: |
          Both use the word grace, but for Luther it is what saves; for Kardec it is help for an effort that does the climbing. A shared word can hide a real difference.
      - text: "Protestant: effort is useless, so people should not try to be good. Spiritist: then morality collapses."
        feedback: |
          No Protestant tradition teaches that. The Reformers held that good works follow from faith as fruit, not as the cause of salvation. The dispute is over what saves, not over whether to do good.
    explanation: |
      This is a dispute of layer 3, a faith commitment: what makes a person right with God. No experiment decides it; each side argues from its texts and from what it takes divine justice to require.

  - type: text
    id: hindu
    title: "Rebirth in India, rebirth in Paris"
    body: |
      Recall from the lesson Karma, Samsara, Moksha. In the Upanishads (Indian philosophical texts, the earliest dated to about 800 to 500 BCE, depending on the reference work), **karma** ("action") is the idea that actions leave results that shape what one becomes; **samsara** ("wandering") is the cycle of birth, death and rebirth; and **moksha** ("release") is liberation from it. The *Chandogya Upanishad* (5.10.7) says, in essence, that people of pleasant conduct enter a good womb, and people of foul conduct the womb of a dog, a pig or an outcaste. So in this picture rebirth can cross species.

      Kardec knew of this. Opening the chapter on many lives in the Spirits' Book, he writes that Pythagoras did not invent the transmigration of souls but "borrowed it from the philosophers of Hindoostan and of Egypt". The "capital difference", he says, is that the spirits who teach reincarnation now "reject absolutely the idea that the human soul can pass into an animal, and vice versa". Asked whether a spirit that was human can be born as an animal (question 612), the answer is "No; for such an incarnation would be a retrogradation; and a spirit never retrogrades."

  - type: text
    id: end-state
    title: "Does Spiritism have a release?"
    body: |
      One could think Spiritism keeps rebirth but drops the escape from it. The Spirits' Book says otherwise. Its highest rung, the **pure spirits** (question 113), "have passed up through every degree of the scale of progress"; "Being no longer subject to reincarnation in perishable bodies, they enter on the life of eternity in the immediate presence of God." Their bliss "is not the monotonous idleness of perpetual contemplation": they are "the messengers and ministers of God", helping lower spirits climb.

      So Spiritism has an end of bodily rebirth. What it keeps throughout is the **individual**. Recall the three Vedanta readings of *moksha*: for Shankara's Advaita, release is knowing that the self (*atman*) is Brahman, the one ultimate reality; for Ramanuja's school, the soul stays itself in eternal, blissful service of God (Vishnu); for Madhva, souls stay distinct from God and from one another and differ in their enjoyment.

  - type: mcq
    id: nearest
    title: "Which release is nearest?"
    prompt: |
      According to the Spirits' Book (question 113), a pure spirit no longer reincarnates, lives in the presence of God, keeps its individuality and works as God's messenger. Which Hindu reading of *moksha* (release from the cycle of rebirth) is nearest to this end state?
    options:
      - text: "Ramanuja's: the soul stays itself in eternal, blissful service of God, distinct from him."
        correct: true
        feedback: |
          Yes. Both keep a lasting individual distinct from God and give it an active life after the last birth. The routes differ: Ramanuja stresses devotion, Kardec moral progress by effort.
      - text: "Shankara's Advaita: release is knowing that the self is Brahman, the one reality."
        feedback: |
          In Advaita the sense of being a separate individual is finally seen through. Spiritism holds the opposite: each spirit keeps its individuality forever, even at the top of the scale.
      - text: "None: Spiritism has no end to rebirth, so there is nothing to compare."
        feedback: |
          The Spirits' Book says pure spirits are "no longer subject to reincarnation in perishable bodies". Spiritism has an end of bodily lives; it just does not call it release from a cycle of suffering.
    explanation: |
      A careful comparison keeps three features apart: whether there are many lives, whether they cross species, and what the end looks like. Spiritism agrees with the Hindu traditions on the first, rejects the second, and on the third sits close to one Hindu school and far from another.

  - type: text
    id: buddhist
    title: "Rebirth with no one reborn"
    body: |
      Recall from the lessons No Self and Dependent Origination. According to the Buddhist teaching of *anatta* ("not-self"), a person can be described as five changing groups: body, feeling, perception, volitions, and consciousness. None of them, and nothing behind them, is a lasting self. Rebirth still happens, but nothing passes over: a new life arises in dependence on the old, as one flame is lit from another, so nothing passes over from one life to the next. The older Buddhist texts list five destinations of rebirth: hells, hungry ghosts, animals, humans and gods. The goal, *nirvana*, is the end of the cycle.

      Spiritism stands at the opposite pole. According to the Spirits' Book, the soul "never loses its individuality" after death (question 150), keeps its perispirit, and as a spirit remembers what it has been (question 304). Two doctrines of rebirth, then, with opposite answers to the question "who is reborn?".

  - type: mcq
    id: same-word
    title: "Same word, same idea?"
    prompt: |
      A student writes: "Spiritism and Buddhism both teach rebirth, so they agree about what survives death; they differ only in their rituals." According to the Spirits' Book and to the Buddhist teaching of not-self (*anatta*), what is wrong with this?
    options:
      - text: "They disagree on the core: Spiritism has a lasting individual spirit that is reborn, while the Buddhist teaching denies any lasting self and speaks of a new life arising from the old like a flame lit from a flame."
        correct: true
        feedback: |
          Yes. The word rebirth hides opposite answers to "who is reborn?". They also differ on animals (Buddhist texts include animal births, Spiritism rules them out) and on the goal (end of craving in nirvana versus the pure spirit serving God).
      - text: "Nothing: both teach that the same soul passes into a new body."
        feedback: |
          That is the Spiritist view, and the Buddhist texts reject it: what is denied is precisely a soul or self that passes from body to body.
      - text: "Buddhism does not teach rebirth at all, only meditation."
        feedback: |
          Traditional Buddhism teaches rebirth across five destinations, and the twelve links of dependent origination are read across three lives in the traditional commentaries. Some modern secular Buddhists set rebirth aside, but that is a reinterpretation, not the traditional teaching.
    explanation: |
      A pattern worth keeping: before saying two traditions agree, check that a shared word (rebirth, grace, soul) names the same idea in both.

  - type: order
    id: line
    title: "From one life to no self"
    prompt: |
      Take the picture "one bodily life for one lasting individual" and count three possible departures from it: (a) more than one bodily life, (b) lives that may be non-human, (c) no lasting self at all. Order these views by how many departures each makes, from none to all three.
    steps:
      - "Catholic and Protestant teaching: one earthly life, a lasting soul, then judgment"
      - "Spiritism: many lives, always human, a lasting individual spirit"
      - "Upanishadic teaching: many lives, also as animals, a lasting self (atman)"
      - "Buddhist teaching: many lives, also as animals, and no lasting self"
    hint: "Count, for each view, how many of (a), (b), (c) it accepts: 0, 1, 2 or 3."
    explanation: |
      The churches make no departure; Spiritism makes one (many lives); the Upanishads two (many lives, across species); Buddhism all three. The line is a sorting tool, not a ranking of truth: each tradition would say its own position is the one that fits the evidence and the moral facts best. It also hides nuance, such as Advaita's claim that the individual self is finally Brahman.

  - type: text
    id: borrowing
    title: "Borrowing or convergence?"
    image:
      - src: img/leroux.webp
        alt: "Black and white studio photograph of Pierre Leroux, a heavy-set man with curly grey hair, leaning his head on his hand."
        caption: "Pierre Leroux (died 1871), philosopher and socialist, founded the *Encyclopédie nouvelle* with Jean Reynaud in the 1830s and put a form of transmigration in place of the usual future life."
        credit: "Atelier Nadar, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Portrait_of_Pierre_Leroux_by_F%C3%A9lix_Nadar.jpg"
        place: bottom
      - src: img/reynaud.webp
        alt: "Bronze portrait medallion showing Jean Reynaud in profile."
        caption: "Jean Reynaud (died 1863), on a bronze medallion of 1838 by David d'Angers; his *Terre et ciel* (1854) taught souls progressing life after life from world to world."
        credit: "Pierre-Jean David d'Angers, CC0, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Portrait_de_Jean_Reynaud_(1806-1863),_philosophe,_S360.jpg"
        place: bottom
        beside: true
    body: |
      Where did Kardec's version of rebirth come from? Three readings.

      **According to Spiritism**, from the spirits, and its age is a sign of truth. The Spirits' Book (question 222) calls the Spiritist doctrine "as old as the world", found everywhere because people keep an intuitive memory of the spirit world, and Kardec adds that the antiquity of rebirth "should therefore be considered as an argument in its favour".

      **According to historians**, largely from France itself. Lynn L. Sharp (*Secular Spirituality*, 2006) traces ideas passed on from Saint-Simonian, mesmerist and romantic socialist movements; a reviewer, David Allen Harvey, sums up Kardec's work as a synthesis of rationalized Christianity, Enlightenment philosophy and selective borrowings from Eastern religions and Western esotericism. The philosopher Pierre Leroux substituted a form of transmigration for the usual future life (according to an older reference work), and his colleague Jean Reynaud, in *Terre et ciel* (1854), taught souls passing from world to world, improving at each life. In 1863 Kardec's own journal called Reynaud a precursor of Spiritism.

      **According to a convergence reading**, similar answers arise from a similar problem: if a just God gives people unequal starts, many lives make the start fair.

  - type: mcq
    id: test-borrowing
    title: "What would favour borrowing?"
    prompt: |
      Historians suggest that Allan Kardec's doctrine of many lives (1857) drew on French writers such as Jean Reynaud, whose *Terre et ciel* (1854) taught souls progressing from world to world. Spiritists answer that the spirits revealed a truth found everywhere. Which finding would most favour the borrowing reading over independent revelation or convergence?
    options:
      - text: "Distinctive details shared with earlier French books, such as lives on other planets and a progress that never goes back, appearing in print before 1857 in Kardec's own city and circles."
        correct: true
        feedback: |
          Yes. A general idea (many lives) can arise anywhere; specific, unusual details shared with texts available to the author are the classic sign of dependence, as in the study of the Gospels' sources. A Spiritist can reply that the spirits may have prepared minds like Reynaud's in advance, which is why his journal called Reynaud a precursor.
      - text: "That belief in rebirth is found in India, Greece and among many peoples."
        feedback: |
          A wide spread fits all three readings: Spiritists see an intuitive memory, convergence theorists a common problem, and it does not point to any particular source for Kardec.
      - text: "That Kardec's mediums said the doctrine came from spirits."
        feedback: |
          That is what is in question. Mediums sharing the ideas of their time is just what the borrowing reading predicts, so the claim cannot settle the matter on its own.
    explanation: |
      The same logic as the lesson on Kardec's method: shared sources make agreement less surprising. The question of influence is layer 2, live historical debate; whether the spirits spoke is layer 3.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    multiple: true
    prompt: |
      Which of these statements are **established fact** (texts and history), as opposed to live debate or faith commitment? Select all that apply.
    options:
      - text: "The Spirits' Book rejects rebirth of a human spirit as an animal."
        correct: true
        feedback: |
          Fact: it says so in question 612 and in the chapter on many lives.
      - text: "The Catechism of the Catholic Church says there is no reincarnation after death."
        correct: true
        feedback: |
          Fact about the text (paragraph 1013). Whether it is true is a separate, faith-level question.
      - text: "Jean Reynaud's *Terre et ciel*, teaching successive lives on many worlds, was published before The Spirits' Book."
        correct: true
        feedback: |
          Fact: 1854 against 1857. How much Kardec drew on it is the debated part.
      - text: "Kardec's doctrine of rebirth was copied from Reynaud."
        feedback: |
          Live debate. Historians point to a shared milieu; that it was copied, rather than shaped or independently reached, is stronger than the evidence shown here.
      - text: "A spirit keeps its individuality through many lives."
        feedback: |
          Faith or metaphysical commitment: taught by Spiritism, denied by the Buddhist teaching of not-self, not something a document can settle.
    explanation: |
      Three layers again: what the texts say (fact), how the doctrines arose and depend on each other (debate), and which picture of the self and its future is true (faith).

  - type: text
    id: summary
    body: |
      **Next:** The Ethics of Spiritism: charity, moral progress, free will and the law of cause and effect read as an ethical system, with its strongest objections.
