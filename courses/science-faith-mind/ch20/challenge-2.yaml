id: ch20-challenge-2
title: "Level Challenge: Weighing the Doctrine (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: an illness, four traditions and a closing weighing"
    body: |
      Problem 4 uses an **invented** family, built to practise on a case you have never seen; Problem 5 and the closing weighing use real texts, real studies and the real census, each stated *according to* the source named. Nothing here asks you to decide whether Spiritism is true.

      - **Problem 4 · The ethics under strain.** One illness read three ways, the just-world objection and the reply, the steps of the penal code, and three meanings of "grace".
      - **Problem 5 · Spiritism among the traditions and in Brazil.** Four views of rebirth, the refusal of animal rebirth, where the idea came from, and two census numbers.
      - **The closing weighing** of the whole doctrine: science, philosophy or religion, what the tests found, and where people part.

      **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. Each problem ends with a fair adherent, a fair critic and a sort of its claims by layer.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      Five tools from the level, each stated so it can be used alone.

      - **Justice through rebirth.** According to Allan Kardec (1804-1869), who compiled *Spiritism* (the doctrine that spirits of the dead live many human lives and communicate through *mediums*), a person is
        $$\text{body}+\text{perispirit}+\text{spirit}$$
        (the *perispirit* is a semi-material envelope that stays with the spirit after death). Suffering with no cause in this life has a cause in an earlier one, since God is just.
      - **Trial, expiation, mission.** An *expiation* pays for a past wrong, a *trial* is a test chosen to advance, a *mission* a task taken on by an advanced spirit. According to *The Gospel According to Spiritism* (1864, chapter V, item 9), an expiation always serves as a trial, but not every trial is an expiation:
        $$\text{expiations}\subset\text{trials}$$
      - **Free will at two moments.** According to *The Spirits' Book* (question 872), the spirit chooses the kind of its trials before birth, and in life stays free to yield to or resist each temptation.
      - **Four answers on rebirth.** Christian teaching: one earthly life, a lasting soul. Spiritism: many human lives, a lasting spirit. Hindu teaching in the Upanishads: many lives in any species, a lasting self (*atman*). Buddhist teaching: many lives in any species, *anatta* ("not-self", no lasting self).
      - **The 2022 census.** According to Brazil's statistics office (IBGE), of about 176.7 million people aged 10 or more, 1.8% declared themselves Spiritists, and Umbanda and Candomblé together rose from 0.3% to 1.0%.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · One illness, three readings"
    body: |
      **Problem 4.** In an invented town, Inês and Tomás have a son, Davi, who at seven falls ill with a long kidney disease. Nothing in his short life explains it. Three neighbours speak at the clinic door.

      - **Neighbour A**, a Spiritist, says: "According to the doctrine, this has a cause before his birth. It may be an expiation, a trial he chose, or even a mission for the family."
      - **Neighbour B**, a psychologist, says: "That kind of thinking tempts people to decide that the boy, or his parents, somehow deserve it."
      - **Neighbour C**, also a Spiritist, says: "Whatever the cause, the doctrine tells us to help, not to judge."

      The task: work out what each reading claims, what it can and cannot know, and where they part.

  - type: mcq
    id: p4-which
    title: "Can anyone tell which it is?"
    prompt: |
      An invented boy, Davi, has a long illness with no cause in his short life. According to *The Gospel According to Spiritism* (chapter V, item 9), an expiation (payment for a past wrong) always serves as a trial (a test chosen to advance), but a trial is not always an expiation; an advanced spirit may also take on a mission. Can an onlooker tell which of the three Davi's illness is?
    options:
      - text: "No. The same suffering fits all three readings, so nothing visible in the illness tells an onlooker whether a past wrong lies behind it."
        correct: true
        feedback: |
          Yes. Because every expiation is also a trial, and missions look like trials from outside, the doctrine itself leaves the onlooker without a way to read the cause.
      - text: "Yes. A severe illness is an expiation, a mild one a trial."
        feedback: |
          The texts set no such scale. Chapter V, item 9 makes the three overlap; a severe trial may be freely chosen by an advanced spirit.
      - text: "Yes. Any suffering with no cause in this life is an expiation."
        feedback: |
          That turns "caused before" into "deserved", the slip the doctrine's own distinction is meant to block. A cause before birth may be a chosen trial, with no wrong behind it.
    explanation: |
      Label: what item 9 says is **fact** about the text; that Davi's illness has any cause before birth is **faith**. The doctrine's own logic forbids reading guilt off suffering.

  - type: mcq
    id: p4-lerner
    title: "The just-world objection"
    prompt: |
      Neighbour B, a psychologist, appeals to the experiment of Melvin Lerner and C. H. Simmons (1966), in which women students watched a peer apparently receive painful electric shocks; when they could not stop it and expected it to continue, they tended to devalue her. What does this finding give the critic of Spiritism's teaching on suffering?
    options:
      - text: "A result about observers: people who cannot end a suffering tend to see the sufferer as deserving it. A doctrine that says suffering has a cause in a past life may feed that tendency in practice. It says nothing about whether past lives exist."
        correct: true
        feedback: |
          Yes. The objection is about how a belief works on believers, a question of psychology, not about the truth of rebirth.
      - text: "Proof that past lives do not exist."
        feedback: |
          The experiment tested reactions to a peer's suffering. It had no bearing on rebirth, and it was not designed to.
      - text: "Proof that every Spiritist blames the sick."
        feedback: |
          The experiment found a tendency in ordinary observers, not in one group, and later studies found mixed results. Whether Spiritists blame more or less than others is an empirical question no one has settled.
    explanation: |
      Label: Lerner and Simmons's result is **fact** about observers in one experiment; whether Spiritism sharpens or softens blame in practice is **debate**.

  - type: mcq
    id: p4-reply
    title: "The reply on charity"
    prompt: |
      Neighbour C answers Neighbour B with *The Gospel According to Spiritism* (chapter V, item 27), a message signed "Bernardin" (Bordeaux, 1863): the idea that a neighbour's trials must run their course is "a great error", and when you see someone afflicted, "do not say, 'It is God's justice and it must take its course.'" How strong is this reply to the just-world objection?
    options:
      - text: "It answers the doctrine's teaching, since the texts command help and forbid judging; it does not by itself answer the psychology, since a belief can be taught one way and lived another. A critic may grant the first and still ask how believers behave."
        correct: true
        feedback: |
          Yes. The reply settles what the doctrine says, which is a fact about texts. Whether believers live up to it is a question for observation, on which neither side has decisive data.
      - text: "It refutes the objection completely, since a doctrine that forbids blame cannot lead anyone to blame."
        feedback: |
          Teachings and behaviour can differ. Many traditions forbid what some of their followers do; the gap has to be checked, not ruled out.
      - text: "It is irrelevant, since the objection is only about the texts."
        feedback: |
          The just-world objection is about how people react, so the texts matter only in part. That is exactly why the reply is strong on one front and open on the other.
    explanation: |
      Label: what item 27 says is **fact**; how the doctrine is lived is **debate**. The same Spiritist texts also say, in item 10, that "those who suffer greatly must tell themselves that they have much to expiate", which is why the critic's worry has a foothold in the texts too.

  - type: order
    id: p4-penal
    title: "The steps of the penal code"
    prompt: "According to *Heaven and Hell* (1865, part 1, chapter VII, the penal code of the future life, 33 articles), how does a spirit go from a wrong to its erasure? Put the steps in order."
    steps:
      - "The wrong leaves an imperfection, and suffering follows as its natural consequence."
      - "Repentance: the spirit recognises the wrong, the first step toward regeneration."
      - "Expiation: the spirit undergoes the suffering that pays for the wrong, in this life or a later one."
      - "Reparation: the spirit does good to undo the harm, which alone annuls the wrong."
    hint: Article 16 names three conditions after the wrong, and says repentance is first but not enough.
    explanation: |
      Article 16: "Even though repentance is the first step toward regeneration, it is not enough by itself; expiation and reparation are still required", for "otherwise, forgiveness would be an act of grace alone". In Davi's case the code tells no one which step, if any, his illness belongs to.

  - type: mcq
    id: p4-grace
    title: "Three meanings of grace"
    prompt: |
      Inês, a Catholic, and Tomás, a Lutheran, hear Neighbour A speak of "God's grace". According to the Catholic Catechism (1996, 2002), grace is God's free and undeserved help, and "God's free initiative demands man's free response". According to Martin Luther (1483-1546) and Ephesians 2:8-9, salvation is by grace through faith, "not of works". According to *The Gospel According to Spiritism* (introduction, section XVII), virtue is acquired by one's own efforts over successive lives, and grace is the power God gives to all people of goodwill. Which statement compares them fairly?
    options:
      - text: "Luther: grace is what saves, and works are its fruit. Catholic: grace comes first and asks a free response that cooperates. Kardec: grace is help offered to everyone's effort, and the climbing is done by the spirit over many lives."
        correct: true
        feedback: |
          Yes. One word, three roles: for Luther the cause of salvation, for Catholics the first move in a partnership, for Kardec a help available to all who try.
      - text: "All three mean the same thing, since all use the word grace."
        feedback: |
          A shared word can hide a real difference. Article 16 of the penal code even rejects forgiveness "of grace alone", which is close to Luther's language.
      - text: "Kardec agrees with Luther that works play no part."
        feedback: |
          The reverse: for Kardec merit is real and earned by effort, which is the point Luther denies.
    explanation: |
      Each view protects a value: the Lutheran, that every good is a gift; the Spiritist, that God is fair to all and merit is real; the Catholic, both together. Which is right is a **faith** question; what each text says is **fact**.

  - type: mcq
    id: p4-voices
    title: "A fair adherent and a fair critic"
    prompt: |
      In the invented case of Davi, a boy with a long illness, which pair states a fair Spiritist and a fair critic?
    options:
      - text: "Adherent: 'According to Spiritism, his illness has a just cause and a purpose, and it may be a chosen trial, not a debt; the doctrine forbids judging him and commands help.' Critic: 'Those are the texts, and they are generous; but any teaching that suffering has a cause in the sufferer's past can feed blame, as just-world research warns, and no one can check the past lives it appeals to.'"
        correct: true
        feedback: |
          Yes. Each grants the other's best point: the adherent the risk of misuse, by stressing the ban on judging; the critic the generosity of the texts.
      - text: "Adherent: 'His parents must have sinned.' Critic: 'All Spiritists are cruel.'"
        feedback: |
          Both are caricatures. The first contradicts chapter V, items 9 and 27; the second is a sweeping claim with no data.
      - text: "Adherent: 'The illness is certainly an expiation.' Critic: 'The illness proves there is no God.'"
        feedback: |
          Neither is fair. Spiritism says no onlooker can tell expiation from trial, and one illness does not settle the question of God; the problem of evil is argued, not shown by a single case.
    explanation: |
      Where they part: on whether a just cause behind every suffering is a comfort or a danger, and on the unprovable premise of past lives. The texts are shared.

  - type: mcq
    id: p4-layers
    title: "Sort the claims by layer"
    multiple: true
    prompt: |
      Four claims about the invented case of Davi and Spiritist ethics. Select all that are **layer 1**, established fact.
    options:
      - text: "The Gospel According to Spiritism says that an expiation always serves as a trial, but a trial is not always an expiation."
        correct: true
        feedback: |
          Yes: a fact about what the text says, checkable by reading chapter V, item 9.
      - text: "In Lerner and Simmons's 1966 experiment, observers who could not stop a peer's suffering tended to devalue her."
        correct: true
        feedback: |
          Yes: a recorded experimental result, though how far it generalises is debated.
      - text: "Spiritist teaching on suffering softens blame more than it sharpens it."
        feedback: |
          Layer 2: a claim about how a belief works in practice, open to study and not settled.
      - text: "Davi chose his illness before birth as a trial."
        feedback: |
          Layer 3: a faith claim no observation can check.
    explanation: |
      The texts and the experiment are fact; their effect in practice is debate; the cause before birth is faith.

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-setup
    title: "Problem 5 · Among the traditions, and in Brazil"
    body: |
      **Problem 5.** A visitor to Brazil asks two questions: "Is Spiritism a kind of Hinduism or Buddhism?" and "How many people follow it?"

      Take as a baseline the view **one life, one lasting individual, one human body**, and count how far each tradition departs from it. According to its own texts, Spiritism keeps the lasting individual and the human body (*The Spirits' Book*, question 612, rules out rebirth as an animal) but gives many lives. Hindu teaching in the Upanishads gives many lives, which can pass into animal bodies, with a lasting self. Buddhist teaching gives many lives in any species, with no lasting self.

      The task: rank the views, read question 612 against older rebirth teachings, ask where Kardec's idea came from, and read two census numbers.

  - type: order
    id: p5-departures
    title: "Departures from one life"
    prompt: "Against the baseline 'one life, one lasting individual, one human body', order the views from fewest departures to most."
    steps:
      - "Christian teaching: one earthly life, a lasting soul (0 departures)."
      - "Spiritism: many lives, but always human and with a lasting spirit (1 departure)."
      - "Hindu teaching in the Upanishads: many lives, in any species, with a lasting self (2 departures)."
      - "Buddhist teaching: many lives, in any species, with no lasting self (3 departures)."
    hint: Count three things for each view - one life or many, human only or any species, lasting self or none.
    explanation: |
      $0, 1, 2, 3$. On this count Spiritism sits nearer Christianity than India: it changes the number of lives, not the kind of being who lives them. The count is a teaching device, not a measure of truth or of closeness in practice.

  - type: mcq
    id: p5-q612
    title: "No rebirth as an animal"
    prompt: |
      *The Spirits' Book* (question 612) asks whether the spirit of a man could be incarnated in an animal, and answers: "No; for such an incarnation would be a retrogradation; and a spirit never retrogrades." What reason does the answer give, and what does it set Spiritism apart from?
    options:
      - text: "It appeals to the law of progress, by which a spirit may stand still but never goes backwards; it sets Spiritism apart from metempsychosis, the passing of a soul into animal bodies taught in India and attributed to Pythagoras."
        correct: true
        feedback: |
          Yes. Kardec called this the "capital difference" between his doctrine and the old metempsychosis; rebirth is kept, the fall into an animal is refused.
      - text: "It appeals to biology: animals have no brain fit for a human spirit."
        feedback: |
          The answer gives a moral reason, progress, not a biological one.
      - text: "It agrees with Buddhist teaching, which rules out animal rebirth too."
        feedback: |
          Buddhist teaching lists animals among the realms of rebirth. On this point Spiritism differs from both Hindu and Buddhist teaching.
    explanation: |
      Label: what question 612 says is **fact**; whether spirits never regress is **faith**. The answer follows from the doctrine's law of progress, not from an observation.

  - type: mcq
    id: p5-borrow
    title: "Where did the idea come from?"
    prompt: |
      Kardec wrote that the idea of many lives is as old as the world and that Pythagoras took it from the philosophers of India and Egypt. The historian Lynn Sharp (*Secular Spirituality*, 2006) places Spiritism in a French setting of romantic socialists such as Pierre Leroux and Jean Reynaud (who wrote in 1854 of souls progressing from world to world), mesmerists and a rationalised Christianity, with selective borrowings from the East. Which statement weighs these fairly?
    options:
      - text: "Kardec's claim says the idea is old; Sharp's says how it reached Paris in the 1850s, mostly through French writers. Both can be partly true, and a third reading, convergence, sees the same problem (unequal births under a just God) inviting similar answers. None of them settles whether rebirth is true."
        correct: true
        feedback: |
          Yes. An origin story explains where an idea came from; it does not show the idea true or false, in either direction.
      - text: "Sharp shows the doctrine is false, since it was borrowed."
        feedback: |
          That is the genetic fallacy: judging a claim by its origin. A borrowed idea can be true and an original one false.
      - text: "Kardec's antiquity argument shows the doctrine is true, since an old idea must be right."
        feedback: |
          Age is not evidence of truth. Many old ideas were dropped; Kardec himself rejected the old passage into animals.
    explanation: |
      Label: what was in print in France before 1857 is **fact**; how much Kardec owed it is **debate**; whether many lives are real is **faith**.

  - type: numeric
    id: p5-census-afro
    title: "Umbanda and Candomblé"
    prompt: |
      In Brazil's 2022 census about 176.7 million people aged 10 or more answered the question on religion, and 1.0% declared Umbanda or Candomblé, two Afro-Brazilian religions distinct from Kardec's Spiritism. About how many million people is that?
    answer: 1.767
    tolerance: 0.02
    answerText: '≈ 1.77 million'
    wrong:
      - { value: 17.67, feedback: 'That is 10%, not 1%. One percent of 176.7 million is 176.7 divided by 100.' }
      - { value: 3.18, feedback: 'That is the 1.8% of Spiritists. The question asks about the 1.0% who declared Umbanda or Candomblé.' }
    hint: One percent of a number is that number divided by 100.
    explanation: |
      $$0.010\times176.7\text{ M}\approx1.77\text{ M}$$
      Set beside the Spiritists, $1.8\%/1.0\% = 1.8$: about 1.8 Spiritists for each follower of Umbanda or Candomblé. The visitor who mixes the three would mix about 5 million people of three religions with different rites, gods and histories.

  - type: numeric
    id: p5-census-degree
    title: "Schooled Spiritists"
    prompt: |
      In the 2022 census, 1.8% of about 176.7 million Brazilians aged 10 or more declared themselves Spiritists, and 48% of them had a university degree, the highest share of any group. About how many million Spiritists with a degree is that?
    answer: 1.527
    tolerance: 0.03
    answerText: '≈ 1.53 million'
    wrong:
      - { value: 84.8, feedback: 'That is 48% of the whole population. The 48% applies only to the Spiritists, 1.8% of 176.7 million.' }
      - { value: 3.18, feedback: 'That is all Spiritists. Take 48% of that number.' }
    hint: First find the Spiritists, 1.8% of 176.7 million, then take 48% of that.
    explanation: |
      $$\begin{aligned}0.018\times176.7\text{ M}&\approx3.18\text{ M}\\0.48\times3.18\text{ M}&\approx1.53\text{ M}\end{aligned}$$
      A count tells who declares a faith, not whether it is true. According to scholars of Brazilian religion, a schooled urban following fits Spiritism's claim to be a modern, reasoned faith; others note that many Brazilians attend Spiritist centres while declaring another religion, which one census answer cannot show.

  - type: mcq
    id: p5-voices
    title: "A fair adherent and a fair critic"
    prompt: |
      The visitor asked whether Spiritism is a kind of Hinduism or Buddhism. Which pair states a fair Spiritist and a fair critic on Spiritism's place among the traditions?
    options:
      - text: "Adherent: 'Many lives are an intuition as old as humanity, which Spiritism purified by refusing animal rebirth and joining it to the moral teaching of Jesus.' Critic: 'According to historians such as Sharp, the doctrine took its shape from French writers of the 1850s; its kinship with India is mostly a shared word, rebirth, used for different ideas.'"
        correct: true
        feedback: |
          Yes. The adherent speaks of meaning and lineage, the critic of history and differences; each could grant that the other's facts are right.
      - text: "Adherent: 'Spiritism is Hinduism in French.' Critic: 'Spiritism has nothing in common with any tradition.'"
        feedback: |
          Both overstate. Question 612 marks a capital difference from Hindu rebirth, and many lives plus an end of rebirth are real shared features.
      - text: "Adherent: 'The census proves the doctrine true.' Critic: 'The census proves it false, since followers fell after 2010.'"
        feedback: |
          A count of followers is a fact about people, not about truth, whether it rises or falls.
    explanation: |
      Where they part: on whether shared features show one old intuition or a modern construction, and on what any count shows. The texts, the 1850s books and the census are shared.

  - type: mcq
    id: p5-layers
    title: "Sort the claims by layer"
    multiple: true
    prompt: |
      Four claims about Spiritism among the traditions and in Brazil. Select all that are **layer 1**, established fact.
    options:
      - text: "In the 2022 Brazilian census, 1.8% of people aged 10 or more declared themselves Spiritists."
        correct: true
        feedback: |
          Yes: a recorded result of the census.
      - text: "The Spirits' Book rules out the rebirth of a human spirit as an animal (question 612)."
        correct: true
        feedback: |
          Yes: a fact about the text.
      - text: "Kardec owed his idea of rebirth mainly to French writers such as Leroux and Reynaud."
        feedback: |
          Layer 2: a historian's reading (Sharp's), argued from sources and open to debate.
      - text: "A spirit never goes backwards from life to life."
        feedback: |
          Layer 3: a faith claim of the doctrine, not something any record can check.
    explanation: |
      Census and texts are fact; lines of influence are debate; the law of progress is faith.

  # ---------------- Closing weighing ----------------
  - type: text
    id: close-setup
    title: "The closing weighing of the doctrine"
    body: |
      The level followed one doctrine from Paris in 1857 to Brazil today. It makes claims of three kinds:

      - **Claims about the world**: spirits survive death and can pass information through mediums; children sometimes remember past lives.
      - **A method**: reason first, then the agreement of mediums who are strangers to one another, which Kardec called the universal control.
      - **An ethics and a hope**: many human lives, each a step of progress, with suffering as trial or expiation and charity as the way.

      The closing questions ask what Kardec called it, what the tests found, and where thoughtful people part.

  - type: mcq
    id: close-label
    title: "Science, philosophy or religion?"
    prompt: |
      In *What Is Spiritism?* (1859) Kardec wrote, in the English Kardecpedia translation, "Spiritism is simultaneously a science of observation and a philosophical doctrine." In a speech titled "Is Spiritism a Religion?" (Parisian Society of Spiritist Studies, 1 November 1868) he said: "in the philosophical sense, Spiritism is a religion", yet added that the word religion is inseparable, in general opinion, from worship, priests and ceremonies, and so Spiritism "simply says: philosophical and moral doctrine." What was Kardec's answer?
    options:
      - text: "A science of observation in its practice and a philosophy in its consequences; a religion only in the philosophical sense of a bond of fellowship and moral law, not in the common sense of worship and clergy, so it calls itself a philosophical and moral doctrine."
        correct: true
        feedback: |
          Yes. Kardec's answer depends on which sense of "religion" is meant. Brazilian Spiritism later took the religious, Christian current further, and Spiritists still disagree on the label, while the census counts it as a religion.
      - text: "A religion in every sense, with its own clergy and rites."
        feedback: |
          Kardec refused that sense of the word because Spiritism has no priestly caste, hierarchy or ceremonies.
      - text: "Only a natural science, with no moral or religious side."
        feedback: |
          He called it a science of observation and also a philosophical doctrine with moral consequences, and in 1868 a religion in the philosophical sense.
    explanation: |
      Label: what Kardec wrote is **fact**; whether his "science of observation" meets today's standards of science is **debate**. The same care applies to every label of the level: a word like "science" or "religion" needs its sense stated before it can be applied.

  - type: mcq
    id: close-tests
    title: "What the tests found"
    prompt: |
      According to their published reports, Ciarán O'Keeffe and Richard Wiseman (2005) had 5 mediums read for 5 sitters in separate rooms, with each sitter rating all 25 readings blind, and found no evidence of ability. Julie Beischel and Gary Schwartz (2007) had 8 mediums read by phone for absent sitters, with blind ratings, and reported a positive result (p = 0.007), adding that it could not separate survival from other paranormal explanations. Which statement fairly sums up the test record?
    options:
      - text: "Blinded tests have given both null and positive results; the positive ones are disputed and, even taken at face value, show information no normal route explains, not that it comes from the dead, since living-mind explanations (super-psi) fit too."
        correct: true
        feedback: |
          Yes. A clean pass would be the strongest test the doctrine could pass, and a run of clean failures the strongest it could fail; the record so far gives each side something to cite.
      - text: "The tests have proved that mediums contact the dead."
        feedback: |
          Even the authors of the positive study said their design could not tell survival from other paranormal sources.
      - text: "The tests have proved that no medium has any ability."
        feedback: |
          A null result in one small study lowers the odds of a claim; it does not prove a universal negative, and other blinded studies report positive results.
    explanation: |
      Label: the published results are **fact**; their weight, given study size, replication and possible flaws, is **debate**; that a positive result comes from spirits is **faith**.

  - type: mcq
    id: close-part
    title: "Where thoughtful people part ways"
    prompt: |
      A careful Spiritist and a careful sceptic have read the same books, the same studies and the same census. Where do they part ways, and why?
    options:
      - text: "On the **prior** (how likely surviving spirits are before any evidence), on the **independence** of witnesses (whether agreeing mediums share a source), and on **testability** (whether free spirits, not subject to our commands, owe us repeatable results). The texts, studies and counts are shared."
        correct: true
        feedback: |
          Yes. These three were the hinges of the whole level: the prior in the odds, the count of witnesses in the likelihood ratio, and what a failure can mean.
      - text: "One side has not read the evidence."
        feedback: |
          Careful readers of the same evidence reach different conclusions, because the evidence enters a judgement that also needs a prior and a standard.
      - text: "Only on the census numbers."
        feedback: |
          The census is agreed. It counts people, and neither side draws its view of the dead from it.
    explanation: |
      In odds form the parting is visible:
      $$\text{posterior odds}=\text{LR}\times\text{prior odds}$$
      Two readers can agree on a likelihood ratio and still end far apart because their prior odds differ by many powers of ten.

  - type: mcq
    id: close-layers
    title: "Sort the whole doctrine by layer"
    multiple: true
    prompt: |
      Five claims about Spiritism as a whole. Select all that are **layer 2**, scholarly consensus or live debate.
    options:
      - text: "Whether Kardec's universal control is a sound method for testing messages."
        correct: true
        feedback: |
          Yes: a question about method, argued with odds and examples, and open.
      - text: "Whether Spiritism is best called a science, a philosophy or a religion."
        correct: true
        feedback: |
          Yes: a question of definitions on which Spiritists and scholars still differ.
      - text: "The Spirits' Book was published in Paris on 18 April 1857."
        feedback: |
          Layer 1: a documented date.
      - text: "Spirits of the dead live many lives and progress toward God."
        feedback: |
          Layer 3: the doctrine's central faith commitment.
      - text: "Blinded studies of mediums have given both null and positive results."
        feedback: |
          Layer 1: a fact about the published record. How to weigh it is the debate.
    explanation: |
      Fact: texts, dates, census, published results. Debate: method, label, influence, the weight of the tests. Faith: surviving spirits, many lives, a just God behind each fate.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Part 2 used the same method on an ethics, a comparison and a whole doctrine: read the text, separate the layers, and ask what kind of evidence could bear on each claim.

      **Problem 4 (Davi's illness).** According to *The Gospel According to Spiritism* (chapter V, item 9),
      $$\text{expiations}\subset\text{trials}$$
      so no onlooker can tell a debt from a chosen trial or a mission. The just-world objection (Lerner and Simmons, 1966: observers unable to stop a suffering tend to devalue the sufferer) is about how a belief is lived; the reply of item 27 ("do not say, 'It is God's justice and it must take its course'") answers what the texts teach. The penal code of *Heaven and Hell* (1865, article 16):
      $$\text{repentance}\to\text{expiation}\to\text{reparation}$$
      Grace: for Luther, what saves; for the Catholic Catechism, a first gift that asks a free response; for Kardec, help offered to the effort of all people of goodwill.

      **Problem 5 (among the traditions).** Departures from "one life, one lasting individual, one human body": Christian 0, Spiritist 1, Hindu 2, Buddhist 3. Question 612 refuses animal rebirth because "a spirit never retrogrades". According to Sharp (2006), the doctrine took shape among French writers such as Leroux and Reynaud; origin does not settle truth. In the 2022 census, of 176.7 M Brazilians aged 10 or more,
      $$\begin{aligned}1.0\%\times176.7\text{ M}&\approx1.77\text{ M}\\48\%\times3.18\text{ M}&\approx1.53\text{ M}\end{aligned}$$
      (Umbanda or Candomblé; Spiritists with a degree).

      **The whole doctrine.** Kardec called Spiritism a science of observation and a philosophical doctrine (1859), and a religion only in the philosophical sense (1868). Blinded tests have given null and positive results, and a pass would not name its source. People part on the prior, the independence of witnesses, and whether free spirits owe us repeatable tests.

      **Next:** the Level Review replays this level's questions at spaced intervals. Then the next level, Aliens and the Cosmic Perspective, opens with the Drake Equation, a way to organise what we do not know about life elsewhere.
