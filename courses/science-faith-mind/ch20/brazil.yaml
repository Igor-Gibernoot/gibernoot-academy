id: ch20-brazil
title: "Spiritism in Brazil"
kind: concept
own: |
  The setting: *Spiritism*, the doctrine of Allan Kardec (1804-1869), holds that the spirits of the dead survive, reincarnate and can speak through *mediums* (people said to receive their messages). Born in France in 1857, it found its largest following in Brazil.
  - **Arrival and the religious turn.** French residents held the first sessions in Rio de Janeiro in the 1860s; the first lasting group was founded in Salvador in 1865; the Brazilian Spiritist Federation (FEB) in Rio on 1 January 1884. The physician Adolfo Bezerra de Menezes (1831-1900), who led the FEB in 1889 and from 1895 until his death, made the {{ religious, Christian current with free charity }} prevail over the "scientific" one, unlike in France.
  - **Chico Xavier (1910-2002).** The medium Francisco Cândido Xavier attributed more than 400 books to spirits (royalties went to Spiritist charity), among them *Nosso Lar* (1944, signed by the spirit André Luiz), and wrote letters to bereaved families. Their accuracy is debated: a 2014 case study found the details fit; sceptics point to what families may have told beforehand.
  - **Letters in court.** In Goiás in 1979 a man accused of killing his friend was acquitted after a letter attributed to the dead friend, written through Xavier, said the shot was an accident. In October 2025 the Superior Court of Justice (STJ) ruled unanimously that such letters are {{ inadmissible as evidence, because nothing in them can be checked or refuted }}.
  - **The census.** Brazilians declaring themselves Spiritists rose from 0.7% (1980) to about 2.0% (2010, 3.8 million), then fell. In 2022 the census asked everyone aged 10 or more; of about 176.7 million people,
    {{ $$1.8\%\times176.7\text{ M}\approx3.2\text{ M}$$ }}
    declared Spiritism, the most schooled group (48% with a university degree). Umbanda and Candomblé rose from 0.3% to 1.0%.
  - **Three religions, not one.** {{ Umbanda (Rio, early 20th century) and Candomblé (Bahia, 19th century) are distinct Afro-Brazilian religions }}, with orixás (deities of West African origin), drums and offerings; Kardecist Spiritism has none of these and centres on study, lectures, prayer and charity.
  - **Hospitals and medicine.** Dozens of Spiritist psychiatric hospitals arose in the twentieth century, joining conventional psychiatry with optional spiritual care; their effect is not yet measured by standard studies. Spiritist doctors formed medical associations (São Paulo 1968, national AME-Brasil 1995).
  - **Why Brazil, and where people part ways.** According to scholars, Spiritism fitted a Catholic country's habits (saints, prayer for the dead, charity) while offering an educated urban middle class a modern, "scientific" faith, and it spread through institutions, charity and famous mediums. Many adherents read it as Brazil's spiritual mission. Layers: the census and the events are fact; why it grew is debate; that the letters come from the dead is faith.

cards:
  - type: mcq
    id: hook
    title: "Guess: a French doctrine in Brazil"
    prompt: |
      Before any theory, guess. Spiritism was written down in Paris in 1857 by Allan Kardec, yet today its largest following is in Brazil, not France. Which of these do you think helped it most there?
    options:
      - text: "It fitted the habits of a Catholic country (saints, prayers for the dead, charity) and still sounded modern and scientific to educated city people."
        correct: true
        feedback: |
          That is close to what historians and sociologists of religion propose, though they give several causes, not one. The lesson builds them one at a time and returns to this question at the end.
      - text: "The Brazilian state adopted and promoted it."
        feedback: |
          The opposite: Brazil's penal code of 1890 listed the practice of Spiritism among crimes. Spiritism grew in spite of the state, not because of it.
      - text: "It spread mostly among the poor and unschooled."
        feedback: |
          The census says otherwise. In 2022 Spiritists were the most schooled religious group in Brazil: 48% of those aged 25 or more had a university degree.
      - text: "It became the religion of most Brazilians."
        feedback: |
          It never did. Spiritists have never reached even 3% in the census; their influence is larger than their numbers, which this lesson explains.
    explanation: |
      A small, educated, well-organised minority with an outsized cultural presence: that is the puzzle of Spiritism in Brazil. Several readings of it follow; none is the whole story.

  - type: text
    id: arrival
    title: "Arrival: the first groups"
    body: |
      Recall: **Spiritism** is the doctrine that Hippolyte Léon Denizard Rivail (1804-1869) compiled under the name **Allan Kardec** from messages that **mediums** (people said to receive messages from the dead) gave in the name of **spirits**, the surviving minds of the dead. *The Spirits' Book* appeared in 1857.

      It reached Brazil within a decade. In Rio de Janeiro, then the capital of the Brazilian Empire, French residents held the first sessions in the 1860s. The first lasting Spiritist group, the Family Group of Spiritism, was founded in Salvador, Bahia, in 1865 by the journalist Luís Olímpio Teles de Menezes, who also answered the archbishop of Bahia's condemnation of Spiritism in print. *The Spirits' Book* was published in Portuguese in Brazil in 1875.

      In Rio, groups multiplied and quarrelled, and on 1 January 1884 a meeting called by Augusto Elias da Silva created the **Brazilian Spiritist Federation** (*Federação Espírita Brasileira*, FEB) to unite them. The new Republic's penal code of 1890 then listed the practice of spiritism, magic and spells among crimes, and in 1891 several Spiritists were arrested in Rio.

  - type: mcq
    id: two-currents
    title: "Science or religion?"
    prompt: |
      From the late 1870s, Brazilian Spiritists split into two currents: a "scientific" one, which treated Spiritism as a philosophy and an experimental science of the spirit, and a "religious" one, which stressed its Christian side and charity. According to historians of Brazilian Spiritism, which current prevailed in Brazil from the turn of the twentieth century?
    options:
      - text: "The religious current, centred on the Gospel and free charity."
        correct: true
        feedback: |
          Yes. Sociologists such as André Ricardo de Souza note that this differs from France, where the doctrine stayed closer to a philosophy for an educated elite. The scientific side did not vanish: it lives on in Spiritist research groups and medical associations.
      - text: "The scientific current, because Kardec called Spiritism a science."
        feedback: |
          Kardec did present it as a science of observation, and the scientific current used that. But in Brazil the religious reading won, led by the physician Bezerra de Menezes, as the next card shows.
      - text: "Neither: the 1890 penal code ended the movement."
        feedback: |
          The ban hurt, but the movement survived and grew; later penal law no longer named Spiritism as a crime.
    explanation: |
      Brazilian Spiritism became, in the words of the sociologist André Ricardo de Souza, a religion of Christian devotion joined to free assistance to the poor. Whether that is a faithful development of Kardec or a drift from his "science" is itself a debate among Spiritists.

  - type: text
    id: bezerra
    title: "Bezerra de Menezes, the doctor of the poor"
    image:
      src: img/bezerra.webp
      alt: "Recoloured portrait of a balding man with a full white beard and moustache, in a dark coat and bow tie."
      caption: "Adolfo Bezerra de Menezes around 1880, physician and politician, who gave the Brazilian Spiritist Federation its religious and charitable direction."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:BezerradeMenezes2.jpg"
    body: |
      **Adolfo Bezerra de Menezes** (1831-1900) was born in Ceará, in Brazil's northeast, became a physician and sat on its city council and in the national parliament for the Liberal Party. He was known as the "doctor of the poor" for treating people who could not pay. In 1886 he declared himself a Spiritist before an audience of more than a thousand.

      He presided over the FEB in 1889 and again from 1895 until his death in 1900, and steered it toward the Gospel and toward charity: systematic study of *The Spirits' Book*, and from 1890 a free service for the needy. Sociologists credit this union of Christian devotion with free assistance for winning Spiritism social legitimacy in a Catholic country that had just made it a crime. Spiritists still call him the "Brazilian Kardec".

  - type: text
    id: chico
    title: "Chico Xavier"
    image:
      src: img/chico-xavier-bust.webp
      alt: "Bronze bust of a smiling older man in a cap and jacket, on a stone base in a garden with a pond and palm trees."
      caption: "A bust of Chico Xavier in Pedro Leopoldo, Minas Gerais, the town where he was born in 1910."
      credit: "Fran6fran6, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Statue_de_Chico_Xavier,_ville_de_Pedro_Leopoldo.jpg"
    body: |
      After Bezerra, the figure who made Spiritism popular was the medium **Francisco Cândido Xavier**, known as **Chico Xavier** (1910-2002), born in Pedro Leopoldo, Minas Gerais and died in Uberaba, in the same state. Through **psychography** (writing said to be guided by a spirit) he produced more than 400 books, which he attributed to spirits; he kept no royalties, which went to Spiritist institutions and their charity. Sales are estimated in the tens of millions.

      The best known is *Nosso Lar* ("Our Home", 1944), signed by the spirit **André Luiz**, a doctor from Rio who, after death, is guided to a spirit city where he learns about the afterlife and reincarnation. Two television interviews on the programme *Pinga Fogo* in 1971 made Xavier a national figure; in 2010, the centenary of his birth, a film of his life drew about 3.4 million viewers and a film of *Nosso Lar* more than 4 million.

      He also wrote, at public meetings, thousands of letters to bereaved families, signed in the name of a dead son or daughter and full of names and nicknames.

  - type: mcq
    id: letters
    title: "Testing a letter"
    prompt: |
      Chico Xavier wrote letters to bereaved families in the name of their dead children, with names, nicknames and details of the death. A 2014 case study (Rocha and colleagues, in the journal Explore) checked 99 items in 13 letters and rated almost all as a clear fit. What is the strongest ordinary rival a sceptic must rule out before the fit counts as evidence of a source beyond the medium?
    options:
      - text: "That the details reached the medium by normal means: families who came hoping for a letter could have spoken of the dead, in conversation or on the notes they handed in."
        correct: true
        feedback: |
          Yes. This is independence again, from the lesson The Mediumistic Method and Its Controls: a fit counts only if the medium could not have known the details. The 2014 authors rated each item for how likely Xavier was to know it by normal means and judged that unlikely; sceptics questioned how the items were chosen and rated. A blind design, with letters written before any contact with the family, would separate the two.
      - text: "That Xavier was a famous man."
        feedback: |
          Fame explains why families came to him, not how a letter could hold true details. A rival must predict the fit, not only the visit.
      - text: "That the families wanted the letters to be true."
        feedback: |
          That explains why a family would accept a letter, and might inflate how a vague item is rated. But it cannot explain a correct nickname; for that the rival needs a route by which the information reached the medium.
    explanation: |
      Both sides accept the same test: did the information have a normal route to the medium? A Spiritist reads the record as showing it did not; a sceptic reads it as never having been tested blind. Layer 1: the letters and the study exist. Layer 2: whether ordinary routes were ruled out. Layer 3: that the dead wrote them.

  - type: text
    id: court
    title: "A letter in court"
    body: |
      In 1976 in Goiânia, capital of the state of Goiás, the teenager Maurício Garcez Henriques was killed by a gunshot, and his friend José Divino Nunes was charged with killing him. A letter written through Chico Xavier in Maurício's name said the shot was an accident and asked that his friend not be blamed. The family brought it to the case; in 1979 the judge accepted it among the evidence and the defendant was acquitted. The story was reported across Brazil and abroad, and other trials later heard letters from Xavier and other mediums.

      In October 2025 the Superior Court of Justice (STJ), Brazil's highest court for non-constitutional law, ruled unanimously, in a murder case from Mato Grosso do Sul, that a psychographed letter cannot be used as evidence, even before a jury. It did not call the letter illicit; it judged it to lack rational and scientific reliability, and the reporting judge, Rogerio Schietti Cruz, said in essence that truth depends on the possibility of refutation: a letter from the dead has no source that the other side can question.

  - type: mcq
    id: court-sides
    title: "Two readings of the court"
    prompt: |
      In 1979 a court in Goiás acquitted a young man after a letter written through the medium Chico Xavier, in the name of the dead friend, said the shot was an accident. In 2025 Brazil's Superior Court of Justice ruled such letters inadmissible. Which pairing gives each side's strongest argument?
    options:
      - text: "Defender: jurors weigh all kinds of testimony by their own conscience, and the letter matched the other evidence of an accident. Critic: a letter whose author cannot be cross-examined can never be refuted, so it cannot serve as proof."
        correct: true
        feedback: |
          Yes. These are the arguments heard in Brazil: lawyers who defended admitting letters said any testimony shapes jurors and they need give no reasons; the STJ answered that proof must be open to challenge. The critic's point holds even for a believer: an honest medium's letter is still beyond cross-examination.
      - text: "Defender: Spiritism is true. Critic: Spiritism is false."
        feedback: |
          Neither court needed to settle that. The question was about evidence: what a court can test. Bringing in the truth of the doctrine skips the real disagreement.
      - text: "Defender: the medium was sincere. Critic: the medium was a fraud."
        feedback: |
          The 2025 ruling did not accuse anyone of fraud. Its point was that even a sincere letter cannot be checked by the other party, which is a different and stronger objection.
    explanation: |
      Where people part ways: whether a court may hear what one party believes and the other cannot test. The STJ ruling is fact (layer 1); whether it was right is a legal and philosophical debate (layer 2).

  - type: text
    id: census
    title: "What the census counts"
    body: |
      Brazil's national statistics office, **IBGE** (Brazilian Institute of Geography and Statistics), asks in each census "What is your religion or cult?". Only one answer is recorded, so the census counts **self-declaration**, not belief or attendance. Until 1970 Spiritists were counted together with Afro-Brazilian religions; from 1980 they have their own line.

      | Census | Declared Spiritists |
      |---|---|
      | 1980 | 0.7% |
      | 1991 | 1.1% |
      | 2000 | about 1.3 to 1.4% |
      | 2010 | about 2.0% (3.8 million) |
      | 2022 | 1.8% of people aged 10+ |

      After nearly tripling in thirty years, the share fell for the first time in 2022. (Sources give 2.0 to 2.2% for 2010, depending on whether children under 10 are counted; on the same base IBGE puts the fall at 0.3 percentage points.) The 2022 results are IBGE's preliminary sample results, released in June 2025, in which 56.7% declared themselves Catholic, 26.9% evangelical and 9.3% of no religion. Spiritists were the most schooled group: 48% of those aged 25 or more had a university degree.

  - type: numeric
    id: count
    title: "How many Spiritists?"
    prompt: |
      In Brazil's 2022 census, the religion question went to everyone aged 10 or more. IBGE reported 100.2 million Catholics, who were 56.7% of that population, and 1.8% declared themselves Spiritists. About how many million people declared themselves Spiritists? (First find the population aged 10 or more.)
    answer: 3.18
    tolerance: 0.06
    answerText: '3.2 million'
    hint: |
      The population aged 10 or more is 100.2 million divided by 0.567. Then take 1.8% of it.
    wrong:
      - { value: 1.8036, feedback: "That is 1.8% of the Catholics (100.2 million). The 1.8% is a share of the whole population aged 10 or more, which is larger: 100.2 / 0.567." }
      - { value: 3.66, feedback: "That would be 1.8% of the whole population of about 203 million. The religion question covered only those aged 10 or more, about 176.7 million." }
    explanation: |
      The population aged 10 or more is

      $$\frac{100.2\text{ M}}{0.567}\approx176.7\text{ M},$$

      so the Spiritists number about

      $$0.018\times176.7\text{ M}\approx3.2\text{ M}.$$

      That is down from about 3.8 million in 2010, roughly a sixth fewer people, even though Brazil's population grew. A small share of a large country is still more Spiritists than in any other country, which is why sociologists call Brazil the largest Spiritist country.

  - type: mcq
    id: decline
    title: "Why the fall in 2022?"
    prompt: |
      The share of Brazilians declaring themselves Spiritists fell from about 2% in 2010 to 1.8% in 2022, while Umbanda and Candomblé together rose from 0.3% to 1.0%. The sociologists André Ricardo de Souza and Bryan Pinto (2026) note that some Umbanda followers used to tell the census they were Spiritists. What does that suggest?
    options:
      - text: "Part of the Spiritist fall may be a change of label, not of belief: people who once said 'Spiritist' now name Umbanda."
        correct: true
        feedback: |
          Yes. Souza and Pinto connect the two trends and add other factors: the growth of those with no religion; the 2018 arrest and convictions for sexual crimes of the healer João de Deus, who did not call himself a Spiritist but was widely seen as one; and political statements by the medium Divaldo Franco that, they argue, put off the young. Spiritist leaders may weigh these differently; the label effect is the one the census itself cannot see.
      - text: "That Spiritist doctrine was proved false between 2010 and 2022."
        feedback: |
          A census counts what people declare, not what is true. A doctrine can lose adherents while true, or gain them while false.
      - text: "Nothing: census figures on religion are random noise."
        feedback: |
          A fall of a fifth in a sample of millions is not noise. The question is what it measures, which is why the change of label matters.
    explanation: |
      A census records one label per person. In a country where many people move between a Spiritist centre, an Umbanda session and Catholic Mass, a shift of label can look like a shift of faith.

  - type: text
    id: three
    title: "Spiritism, Umbanda, Candomblé"
    body: |
      Three Brazilian religions speak of spirits, and outsiders often merge them. Their adherents do not.

      **Candomblé** developed in the nineteenth century, mainly in Bahia, among Africans brought to Brazil as slaves and their descendants, from West and Central African traditions, above all Yoruba. It venerates the **orixás** (deities of West African origin), each person having a guardian orixá; it is initiatory, lived in houses called *terreiros* with drums, dance, offerings and possession by the orixás, and it generally avoids possession by spirits of the dead.

      **Umbanda** arose in Rio de Janeiro in the early twentieth century (its own tradition dates it to a session in Niterói in 1908). It blends Kardec's ideas with Catholicism and African and Indigenous traditions: in its sessions mediums receive spirits such as **caboclos** (Indigenous Brazilians) and **pretos velhos** ("old Black men", spirits of enslaved Africans), and it honours the orixás, often linked to Catholic saints.

      **Kardecist Spiritism** has no orixás, drums, dress, offerings or sacrifice. Its centres hold book study, lectures, prayer, *passes* (laying on of hands) and mediumistic sessions, and run charity. The census puts Umbanda and Candomblé on one line, separate from Spiritism.

  - type: mcq
    id: which-religion
    title: "Which tradition?"
    prompt: |
      A visitor in Salvador attends a ceremony in a *terreiro*: drums play, initiates in white dance, and some are possessed by the orixás, deities of West African origin; spirits of the dead are not called. A friend says: "So this is Brazilian Spiritism." What is the best correction?
    options:
      - text: "It is Candomblé, a distinct Afro-Brazilian religion; Kardecist Spiritism has no orixás or drums and centres on study, prayer, passes and mediumistic sessions with spirits of the dead."
        correct: true
        feedback: |
          Yes. Possession by the orixás and avoidance of spirits of the dead mark Candomblé. Umbanda, which also honours orixás but works with spirits of the dead such as caboclos and pretos velhos, sits between the two.
      - text: "It is Umbanda, because any Brazilian ceremony with spirits is Umbanda."
        feedback: |
          Umbanda works mainly with spirits of the dead (caboclos, pretos velhos). A ceremony of possession by the orixás in a Bahian terreiro, avoiding the dead, is Candomblé.
      - text: "The friend is right: Spiritism, Umbanda and Candomblé are three names for one religion."
        feedback: |
          Their adherents, their histories and the census all separate them. Spiritism came from French books in the 1860s; Candomblé from African traditions in the nineteenth century; Umbanda arose in the twentieth century, drawing on both.
      - text: "It is Spiritism in its 'lower' form."
        feedback: |
          The old labels "high" and "low" spiritism ranked practices with African elements below those of Kardec. Scholars such as Bettina Schmidt reject this ranking as biased; Candomblé is a religion in its own right, not a lesser Spiritism.
    explanation: |
      According to their adherents, Candomblé serves the orixás, Umbanda works with the spirits of Brazil's peoples and the orixás, and Spiritism follows Kardec's books. People do move between them: one can be Catholic, visit a Spiritist centre and attend a Candomblé ceremony on the weekend.

  - type: text
    id: hospitals
    title: "Hospitals and Spiritist doctors"
    image:
      src: img/bom-retiro.webp
      alt: "Entrance of a hospital compound with a parking gate, a yellow gatehouse with signs and a round sign reading FEP on a pole."
      caption: "The Bom Retiro Spiritist Psychiatric Hospital in Curitiba, run by the Spiritist Federation of Paraná since the 1940s, at the new site it moved to in 2012."
      credit: "DAR7, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Hospital_Esp%C3%ADrita_de_Psiquiatria_Bom_Retiro_2015_(1).JPG"
    body: |
      Charity is where Brazilian Spiritism is most visible. Centres run free clinics, schools and food distribution; in Salvador the medium Divaldo Franco (1927-2025) founded in 1952 the *Mansão do Caminho*, a complex with a school, a maternity unit and a clinic, funded partly by sales of more than two hundred books he attributed to spirits.

      Medicine is its most striking form. According to a 2012 study by the psychiatrists Giancarlo Lucchetti, Alexander Moreira-Almeida and colleagues, "dozens of Spiritist psychiatric hospitals emerged" in Brazil during the twentieth century. The six leading ones they described combine conventional psychiatric treatment with optional spiritual care: *passes* ("fluidotherapy"), lectures on spiritual and ethical themes, intercessory prayer, and **disobsession**, sessions meant to free a patient from a troubling spirit.

      Spiritist physicians also organised: the Medical-Spiritist Association of São Paulo in 1968, and the national Medical-Spiritist Association of Brazil (AME-Brasil) in 1995.

  - type: mcq
    id: hospital-evidence
    title: "What does the hospital study show?"
    prompt: |
      A 2012 study by Lucchetti, Moreira-Almeida and colleagues described six leading Brazilian Spiritist psychiatric hospitals that combine conventional psychiatric treatment with optional spiritual care (passes, prayer, disobsession). Which conclusion does such a description support?
    options:
      - text: "That these hospitals exist, how they work and how patients receive the offer; not yet how much the spiritual part helps, since standard studies of its effect are lacking."
        correct: true
        feedback: |
          Yes. The authors themselves wrote that the lack of standard protocols and scientific studies is a barrier to assessing the effect on patients. A Spiritist reads the hospitals as compassion joined to a fuller view of the person; a critic asks for a trial comparing the same care with and without the spiritual part.
      - text: "That disobsession cures mental illness."
        feedback: |
          A description of practice is not a test of effect. Patients there also get conventional treatment, so improvement alone cannot be credited to the spiritual part.
      - text: "That the hospitals replace psychiatry with prayer."
        feedback: |
          The study describes the opposite: conventional psychiatry first, with spiritual care added and optional.
    explanation: |
      Layer 1: the hospitals and their practices. Layer 2: whether the spiritual part adds anything, an open empirical question that a randomised, blinded trial could address. Layer 3: that spirits cause or relieve suffering.

  - type: text
    id: why-brazil
    title: "Why Brazil? Three readings"
    body: |
      Back to the opening question. According to the anthropologist **Bernardo Lewgoy**, Spiritism first won the urban, literate elite and Catholics who were not dogmatic. It offered a rising middle class a faith that was modern and respectable, with a claim to science, without breaking with Christianity; it built institutions, charity and a stream of books; and it mixed with popular religion. Comparing countries, he notes that in France secularism and a strong Church kept it to an elite, and that in other Catholic countries the Church kept tighter control.

      According to the sociologist **Célia da Graça Arribas**, Spiritism adapted to a Catholic country (some Brazilians call themselves *catoespíritas*, Catholic Spiritists), blended with Afro-Brazilian practice, above all Umbanda, and had leaders who made it feel Brazilian: Bezerra de Menezes, Chico Xavier, Divaldo Franco. The anthropologist David Hess (*Spirits and Scientists*, 1991) adds that its educated followers built their own medicine and research, a science of their own.

      Many adherents give a third, religious reading. A 1938 book written through Chico Xavier and attributed to the spirit of the writer Humberto de Campos is titled *Brazil, Heart of the World, Homeland of the Gospel*: according to it, Brazil has a spiritual mission to carry the Gospel, which is why the teaching took root there.

  - type: mcq
    id: readings
    title: "Sorting the readings"
    prompt: |
      Three readings of why Spiritism found its largest following in Brazil: (a) it fitted the habits of popular Catholicism while offering the urban middle class a modern faith (Bernardo Lewgoy); (b) it spread through charity, institutions and famous mediums (Célia Arribas); (c) Brazil has a spiritual mission as "homeland of the Gospel" (a 1938 book written through Chico Xavier). Which statement about them is fair?
    options:
      - text: "(a) and (b) are scholarly claims that history and comparison between countries can test; (c) is a faith claim, and it can stand alongside them, since a believer may hold that providence used such causes."
        correct: true
        feedback: |
          Yes. A sociological cause and a providential purpose answer different questions ("how?" and "why, in the end?"). A sceptic needs no mission once (a) and (b) explain the pattern; a believer replies that an explanation of how does not rule out a purpose.
      - text: "Only one of the three can be true."
        feedback: |
          (a) and (b) fit together, and the believer in (c) can accept both as the means. The readings compete only if one claims to be the whole story.
      - text: "(c) is proved by the census, since Brazil has the most Spiritists."
        feedback: |
          The census shows that Brazil has the most Spiritists, which (a) and (b) also predict. Evidence that every reading predicts cannot pick one of them.
      - text: "(a) and (b) are disproved because Spiritists are only 1.8%."
        feedback: |
          The readings explain why Brazil has more Spiritists than other countries, not why they are a majority. A small share of a large country is still the largest Spiritist community in the world.
    explanation: |
      Where people part ways: whether a full account of how a movement spread leaves anything for a mission to explain. That depends on a prior commitment about providence, not on the census.

  - type: mcq
    id: trap-small
    title: "Trap: only 1.8%"
    prompt: |
      A student argues: "In Brazil's 2022 census only 1.8% of people aged 10 or more declared themselves Spiritists, so Spiritism has little influence on Brazilian life." What is the best reply?
    options:
      - text: "The census records one self-declared label, while many Brazilians who call themselves Catholic or of no religion also attend Spiritist centres, read Chico Xavier or watch Spiritist films; influence can be much larger than declared membership."
        correct: true
        feedback: |
          Yes. Sociologists of religion stress dual belonging in Brazil, and the 2010 films of Chico Xavier's life and of *Nosso Lar* drew about 3.4 million and over 4 million viewers. A careful critic adds the other side: influence is harder to measure than membership, so claims of a hidden majority need their own evidence.
      - text: "The census is wrong: the Brazilian Spiritist Federation counts far more members."
        feedback: |
          Larger counts of "sympathisers" circulate, but they measure something different from the census and are not independent checks. The better reply explains what each number measures.
      - text: "The student is right: a 1.8% group cannot matter."
        feedback: |
          Spiritist hospitals, charity, bestsellers, films and even court cases show a presence far beyond 1.8%. Numbers of adherents and cultural weight are different quantities.
    explanation: |
      The trap is reading a count of labels as a measure of influence. The census answers "what do people call themselves?", not "who visits a centre?" or "who believes in reincarnation?".

  - type: mcq
    id: layers
    multiple: true
    title: "Sorting the claims"
    prompt: |
      Which of these statements are *established fact* (layer 1), true whatever one believes about spirits? Select all that apply.
    options:
      - text: "In 2022, 1.8% of Brazilians aged 10 or more declared themselves Spiritists to the census."
        correct: true
        feedback: |
          Yes: a census result (IBGE, preliminary sample results, 2025). What it means for belief is layer 2.
      - text: "In 2025 Brazil's Superior Court of Justice ruled psychographed letters inadmissible as evidence."
        correct: true
        feedback: |
