id: ch20-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: *Spiritism*, the doctrine Allan Kardec (1804-1869) compiled from answers he said came from spirits of the dead through *mediums* (people said to receive their messages), taught here according to his books, to the churches and traditions compared with it, and to the researchers who tested its claims. Whether spirits exist and return is left to each reader.
  - **The five works.** The Spirits' Book (1857), the Mediums' Book (1861), the Gospel According to Spiritism (1864), Heaven and Hell (1865) and the Genesis (1868). According to the Spirits' Book a living person has three parts, the *perispirit* being a semi-material envelope that stays with the spirit after death:
    $$\text{body}+\text{perispirit}+\text{spirit}$$
    Spirits are ranked in 3 orders, imperfect (classes 10 to 6), good (5 to 2) and pure (class 1):
    $$5+4+1=10$$
  - **Three names, three movements.** *Spiritualism* is the broad movement usually dated to the Fox raps of 1848 in New York State; *Spiritism* is Kardec's codified doctrine from 1857, with reincarnation at its centre; {{ Umbanda and Candomblé are distinct Afro-Brazilian religions }}, with orixás (deities of West African origin), drums and offerings, which Kardecist Spiritism does not have.
  - **Suffering and free will.** According to the Gospel According to Spiritism, an *expiation* pays for a past wrong, a *trial* is a test chosen to advance, a *mission* a task taken on by an advanced spirit, and every expiation also serves as a trial:
    {{ $$\text{expiations}\subset\text{trials}$$ }}
    According to Heaven and Hell a wrong is erased in three steps, $\text{repentance}\to\text{expiation}\to\text{reparation}$. According to the Spirits' Book (question 872) the spirit is free twice: it chooses its kind of trials before birth, and it stays free in each act during life.
  - **Witness odds.** If $n$ mediums give the same answer independently, and $q$ is the chance that one of them would give it with no real source behind it, while a real source would give it for sure, the likelihood ratio (how much likelier the agreement is with a real source than without) is
    {{ $$\text{LR}=\frac{1}{q^{\,n}}$$ }}
    As $q\to1$ (an answer anyone would give) the LR goes to 1 and agreement proves nothing; mediums who follow one shared source count as one witness, $n=1$.
  - **Bayes in odds form.** For a hypothesis $R$ (say, a child is a dead person reborn) against normal causes $N$, after evidence $E$:
    {{ $$\frac{P(R\mid E)}{P(N\mid E)}=\frac{P(E\mid R)}{P(E\mid N)}\cdot\frac{P(R)}{P(N)}$$ }}
    Toy prior odds $1{:}1000$ times LR $500$ give posterior odds $1{:}2$, a probability of about 33%.
  - **False positives.** In a blind test of $n$ trials with $k$ options each, chance alone gives a hit with $p_0=1/k$ per trial, so the hits $X$ follow the binomial law, and a threshold $t$ fixed in advance is passed by chance with the false-positive rate
    {{ $$P(X\ge t\mid p_0)$$ }}
    Moving $t$ after the data, or reporting the best of many runs, raises it.
  - **Four answers compared.** Lives, lasting self and goal: Christian one life, a soul, God by grace; Spiritist many human lives, a spirit, the pure spirit; Hindu many lives in any species, the *atman*, *moksha*; Buddhist many lives in any species, no lasting self, *nirvana*.
  - **Three layers.** Established: the books, dates, census figures and what the tests reported. Debated: how good the evidence and the method are, how much Kardec borrowed. Faith: that spirits exist, return and speak.

cards:
  - type: text
    id: welcome
    title: "Quick recall: Spiritism"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main shapes: Kardec's five works, the person and the scale of spirits, the three movements often confused, the ethics of suffering, and the three small pieces of arithmetic the level used to weigh evidence (witness odds, Bayes' rule in odds form, false positives).

      Three kinds of card: **mnemonics and distinctions**, **build and order cards**, and **numeric cards that give you data only**: you choose the method yourself. Guessing is fine: a wrong guess is shown with its reason.

      Every answer is *according to* someone: Kardec's books, a church, a tradition, a researcher. A *medium* is a person said to receive messages from the dead. Nothing here asks whether spirits exist.

  - type: order
    id: works
    title: "The five works"
    prompt: |
      According to the Spiritist movement, Allan Kardec (1804-1869) wrote five basic books. Put them in the order they appeared, earliest first.
    steps:
      - "*The Spirits' Book* (1857): the doctrine in numbered questions."
      - "*The Mediums' Book* (1861): how communication works and how it goes wrong."
      - "*The Gospel According to Spiritism* (1864): the moral teaching of the Gospels."
      - "*Heaven and Hell* (1865): the future life and its penal code."
      - "*The Genesis* (1868): creation, miracles and predictions."
    hint: 'First the doctrine, then the practice, then morals, then the afterlife, then creation and miracles.'
    explanation: |
      Mnemonic: **doctrine, practice, morals, afterlife, creation**, one book every few years from 1857 to 1868, the year before Kardec died. The monthly *Revue Spirite* ran alongside from January 1858.

  - type: build
    id: person
    title: "Three parts of a person"
    prompt: |
      According to the Spirits' Book, a living human being has three parts: the physical body, the spirit (an individual intelligent being created by God), and a semi-material envelope between them that stays with the spirit after death. Build the sum, from the outside in.
    prefix: '\text{person}='
    tiles: ['\text{body}', '+', '\text{perispirit}', '+', '\text{spirit}', '\text{soul}']
    answers:
      - ['\text{body}', '+', '\text{perispirit}', '+', '\text{spirit}']
    wrong:
      - answer: ['\text{body}', '+', '\text{soul}', '+', '\text{spirit}']
        feedback: |
          In the Spirits' Book the *soul* is not a fourth part: it is the spirit while incarnated. The middle layer has its own name, the *perispirit*.
      - answer: ['\text{body}', '+', '\text{spirit}', '+', '\text{perispirit}']
        feedback: |
          All three parts are right, but the perispirit sits between the two: it links spirit and body.
    hint: 'The middle part is an envelope wrapped around the spirit.'
    explanation: |
      Mnemonic: **flesh, wrapper, self**. At death the body is left behind and the spirit keeps its perispirit. The *soul*, in the same book, is the spirit while it is incarnated, not a fourth part.

  - type: mcq
    id: orders
    title: "The scale of spirits"
    prompt: |
      According to the Spirits' Book, spirits are ranked in 3 orders (imperfect, good, pure) and 10 classes, numbered from 10 at the bottom to 1 at the top. How are the classes shared out?
    options:
      - text: 'Imperfect spirits in classes 10 to 6, good spirits in 5 to 2, pure spirits in class 1 alone: $5+4+1=10$.'
        correct: true
      - text: 'Three or four classes in each order, with pure spirits in classes 3 to 1.'
        feedback: |
          The orders are not even. Purity is the end of the climb, so it is a single class at the top, while most of the ladder is the long road of the imperfect.
      - text: 'Imperfect spirits in class 1, pure spirits in class 10, since one climbs up the numbers.'
        feedback: |
          The numbering runs the other way: class 1 is the highest. A spirit progresses from class 10 toward class 1.
    shuffle: false
    hint: 'Many rungs for the imperfect, one for the pure.'
    explanation: |
      Mnemonic: **five, four, one**. According to the same book a spirit may stand still but never goes backwards, and is always reborn as a human, never as an animal.

  - type: mcq
    id: three-names
    title: "Three names, three movements"
    prompt: |
      Spiritism, Spiritualism, and Umbanda or Candomblé are often run together in the press. According to historians and to the members of each, which description keeps them apart?
    options:
      - text: '*Spiritualism* is the broad movement usually dated to the Fox raps of 1848 in New York State; *Spiritism* is Kardec''s codified doctrine from 1857, with reincarnation at its centre; Umbanda and Candomblé are distinct Afro-Brazilian religions, with orixás, drums and offerings.'
        correct: true
      - text: 'Spiritism is the French name of Spiritualism, and Umbanda is Spiritism as practised in Brazil.'
        feedback: |
          Both slips have the same root: shared practice (contact with the dead, mediums) taken for shared doctrine. Kardec's teaching of many lives is not part of what Spiritualism names, and Umbanda has orixás and offerings, which Kardecist centres do not.
      - text: 'Candomblé is the oldest and the other two grew out of it.'
        feedback: |
          Candomblé took shape in Bahia in the nineteenth century from West African religions; Spiritism came from France and Spiritualism from the United States. They have separate roots.
    shuffle: false
    hint: 'Ask of each: where, when, and is there reincarnation, orixás or drums?'
    explanation: |
      Mnemonic: **American raps, French books, African orixás**. In Brazil the census counts them apart: Spiritists 1.8% in 2022, Umbanda and Candomblé together 1.0%.

  - type: mcq
    id: trial
    title: "Trial, expiation, mission"
    prompt: |
      According to the Gospel According to Spiritism (1864), an *expiation* pays for a wrong done in a past life, a *trial* is a test chosen to advance, and a *mission* is a task taken on by an advanced spirit. How are expiations and trials related?
    options:
      - text: 'Every expiation also serves as a trial, but not every trial is an expiation: $\text{expiations}\subset\text{trials}$.'
        correct: true
      - text: 'They are the same thing under two names.'
        feedback: |
          Kardec keeps them apart on purpose: a trial may be chosen with no past wrong behind it. Merging them would make every suffering a sign of past guilt, which is what the doctrine warns against.
      - text: 'They exclude each other: a suffering is either an expiation or a trial, never both.'
        feedback: |
          An expiation is also a test: how the person bears it counts. So the two overlap, one inside the other.
    shuffle: false
    hint: 'One is a special case of the other.'
    explanation: |
      Mnemonic: **every debt is a test, not every test is a debt**. Since a mission can also look like suffering, an onlooker cannot tell from someone's pain which of the three it is; that is the Spiritist reply to the charge of blaming the sufferer.

  - type: mcq
    id: free-will
    title: "Free twice"
    prompt: |
      According to question 872 of the Spirits' Book, at which moments is a spirit free?
    options:
      - text: 'Twice: before birth it chooses the kind of trials it will meet, and during life it stays free to yield to or resist each temptation.'
        correct: true
      - text: 'Only before birth: once the trials are chosen, every act in life is written down in advance.'
        feedback: |
          This is the fatalist reading the book rejects. According to question 851, the only "fatality" is the physical trial chosen; moral choices stay free.
      - text: 'Only during life: the trials are imposed by God and the spirit has no say in them.'
        feedback: |
          According to the Spirits' Book the spirit usually chooses its kind of trials itself, though God may at times impose an existence; free will begins before birth.
    shuffle: false
    hint: 'One choice of the road, many choices along it.'
    explanation: |
      Mnemonic: **choose the road, then each step**. Without free will, says question 843, a person would be a machine, with neither guilt nor merit.

  - type: order
    id: erase
    title: "How a wrong is erased"
    prompt: |
      According to the "penal code of the future life" in Heaven and Hell (1865, article 16), a wrong is erased in three steps, since repentance alone would make forgiveness an act of grace only. Put the steps in order.
    steps:
      - 'Repentance: the spirit sees and regrets the wrong.'
      - 'Expiation: the spirit bears the consequences.'
      - 'Reparation: the spirit does good to undo the harm.'
    hint: 'First inside, then suffered, then done.'
    explanation: |
      Mnemonic: **regret, bear, repair**:
      $$\text{repentance}\to\text{expiation}\to\text{reparation}$$
      Compare the Catholic view, in which forgiveness is God's free gift (grace) asking a free response; here the debt is paid by the spirit's own effort.

  - type: build
    id: lr-build
    title: "Witness odds"
    prompt: |
      Each of $n$ mediums, independently, gives the same answer. A real source would give that answer for sure; without one, each medium would give it with chance $q$. Build the likelihood ratio LR: how many times likelier the agreement is with a real source than without.
    prefix: '\text{LR}='
    tiles: ['1', '/', 'q^{\,n}', 'n', 'q', '(1-q)']
    answers:
      - ['1', '/', 'q^{\,n}']
    wrong:
      - answer: ['n', '/', 'q']
        feedback: |
          This adds the witnesses' weight instead of multiplying it. Independent chances multiply: $n$ chance matches together have chance $q\cdot q\cdots q$.
      - answer: ['1', '/', 'q']
        feedback: |
          That is the weight of one medium. With $n$ independent mediums the chance of all matching by luck is $q$ to the power $n$.
    hint: 'With a real source the chance of agreement is 1; without one, multiply the separate chances.'
    explanation: |
      With a real source the agreement has probability 1; without one it has probability $q^n$, since independent chances multiply. The ratio is
      $$\text{LR}=\frac{1}{q^{\,n}}$$
      Each extra independent medium multiplies the odds by $1/q$. Mnemonic: **one over chance, to the number of witnesses**.

  - type: build
    id: bayes-build
    title: "Bayes in odds form"
    prompt: |
      For a hypothesis $R$ (a child is a dead person reborn) against its rival $N$ (normal causes), after evidence $E$, build the right side of Bayes' rule in odds form.
    prefix: '\frac{P(R\mid E)}{P(N\mid E)}='
    tiles: ['\frac{P(E\mid R)}{P(E\mid N)}', '\cdot', '\frac{P(R)}{P(N)}', '+', '\frac{P(E\mid N)}{P(E\mid R)}']
    answers:
      - ['\frac{P(E\mid R)}{P(E\mid N)}', '\cdot', '\frac{P(R)}{P(N)}']
      - ['\frac{P(R)}{P(N)}', '\cdot', '\frac{P(E\mid R)}{P(E\mid N)}']
    wrong:
      - answer: ['\frac{P(E\mid R)}{P(E\mid N)}', '+', '\frac{P(R)}{P(N)}']
        feedback: |
          The evidence rescales the prior odds; it does not add to them. With a prior of 1:1000 and a likelihood ratio of 500, adding would give 500 and make rebirth nearly certain, while multiplying gives odds of 1:2.
      - answer: ['\frac{P(E\mid N)}{P(E\mid R)}', '\cdot', '\frac{P(R)}{P(N)}']
        feedback: |
          The ratio is upside down: evidence likelier under $R$ should raise the odds of $R$, so $P(E\mid R)$ goes on top.
    hint: 'Odds after = (how much better R predicts E) times (odds before).'
    explanation: |
      $$\frac{P(R\mid E)}{P(N\mid E)}=\frac{P(E\mid R)}{P(E\mid N)}\cdot\frac{P(R)}{P(N)}$$
      Mnemonic: **posterior odds = likelihood ratio times prior odds**. The prior carries what you held before; the likelihood ratio carries only what this evidence adds.

  - type: mcq
    id: q-limit
    title: "A limit check"
    prompt: |
      Five independent mediums all give the same answer. What happens to the weight of their agreement as $q$, the chance that one medium would give that answer with no real source behind it, gets close to 1 (an answer anyone would give, such as "your grandmother loved you")?
    options:
      - text: 'The likelihood ratio goes to 1: the agreement is about as likely without a real source as with one, so it barely moves the odds.'
        correct: true
      - text: 'The likelihood ratio grows without bound, since all five agreed.'
        feedback: |
          That is the limit at the other end, $q\to0$, for a rare and specific answer. Agreement on something everyone would say is no surprise.
      - text: 'It goes to 0: the agreement now counts against a real source.'
        feedback: |
          A real source would still give the answer, so the agreement is never less likely with it than without; the ratio falls toward 1, not below it.
    shuffle: false
    hint: 'Ask how surprising agreement is when nearly everyone would say it.'
    explanation: |
      For $n$ independent mediums the likelihood ratio is $1/q^{n}$. At $q=0.99$ and $n=5$ it is about 1.05. Only specific, unlikely answers carry weight: the limit check says **a vague hit is no hit**.

  - type: mcq
    id: shared-source
    title: "Why a shared source counts once"
    prompt: |
      Five mediums of one circle give the same answer, but all have read the same popular book, which states that answer. Why does their agreement count about as one witness, not five?
    options:
      - text: 'Their answers are not independent: the book makes each of them likely to give it, so the chance of agreement without spirits is high, and the five answers carry the weight of one.'
        correct: true
      - text: 'Because only answers from distant countries count, by Kardec''s rule.'
        feedback: |
          Kardec did ask for mediums strangers to one another, in several regions, but the reason is independence, not distance. Two distant mediums who read the same book are no better.
      - text: 'It counts as five: each medium is a separate person.'
        feedback: |
          Separate people with a common cause behind their answers are not separate evidence. If the book gives each medium a 90% chance of the answer, all five agree with chance $0.9^5\approx59\%$ without any spirit.
    shuffle: false
    hint: 'Multiplying chances is only allowed for independent events.'
    explanation: |
      Mnemonic: **one cause, one witness**. The same holds for children's rebirth cases from a culture that expects rebirth: a common cause can produce them all. According to Kardec's universal control, agreement within one circle is not enough, because its mediums may share the same influence.

  - type: numeric
    id: agree-num
    title: "Four mediums agree"
    prompt: |
      Four mediums who have never met, questioned separately, each name the same one of five possible causes of a death. Without a real source, each would pick that cause with chance one in five, independently of the others; a real source would make each of them pick it for sure. How many times likelier is this agreement with a real source than without?
    answer: 625
    answerText: '625'
    wrong:
      - { value: 20, feedback: 'You multiplied 4 by 5. The chance of four independent guesses all matching is a product of four chances, not a sum of weights.' }
      - { value: 5, feedback: 'That is the weight of one medium. Each of the four, being independent, multiplies it again.' }
      - { value: 0.0016, feedback: 'That is the chance of the agreement without a real source. The question asks for the ratio of the two chances.' }
    hint: 'This is a likelihood ratio, and the four guesses are independent.'
    explanation: |
      Without a real source, the chance that all four pick that cause is $(1/5)^4=1/625=0.0016$. With a real source it is 1. The ratio is $1/0.0016=625$. Had the four sat in one circle sharing ideas, this multiplication would not be allowed.

  - type: numeric
    id: rebirth-num
    title: "A toy rebirth case"
    prompt: |
      In a toy case, a child's statements match a dead stranger. Before the case you judged rebirth ($R$) against normal causes ($N$) at odds of 1 to 1000. The statements would turn up with probability 0.5 if $R$ were true and 0.001 if $N$ were. What is the probability of $R$ after the statements? Give a percent, to one decimal place.
    answer: 33.3
    tolerance: 0.2
    answerText: '33.3'
    wrong:
      - { value: 50, feedback: 'You stopped at the posterior odds, 0.5, and read them as a probability. Odds of 1 to 2 mean one chance in three.' }
      - { value: 0.05, feedback: 'That multiplies the prior by 0.5 alone. The evidence counts through how much better $R$ predicts it than $N$, the ratio of the two probabilities.' }
      - { value: 99.8, feedback: 'That uses the evidence and forgets the prior odds of 1 to 1000.' }
    hint: 'Turn the prior into odds after the evidence, then turn odds into a probability.'
    explanation: |
      The likelihood ratio is $0.5/0.001=500$. The posterior odds are $500\times\tfrac{1}{1000}=0.5$, that is 1 to 2, so the probability is
      $$\frac{0.5}{1+0.5}\approx33.3\%$$
      If the families had met before anyone wrote the statements down, normal causes could produce the match with probability 0.25, the ratio would fall to 2, and the probability to about 0.2%.

  - type: numeric
    id: fp-num
    title: "Passing by chance"
    prompt: |
      A medium is tested in 8 blind trials. In each, a sitter picks the right reading from 4 unlabelled ones, one real and three decoys, in random order. The medium passes with 5 or more hits, a threshold written down in advance. If the medium has no special source at all, so that every pick is a pure guess, what is the chance of passing anyway? Give a percent to two decimal places.
    answer: 2.73
    tolerance: 0.03
    answerText: '2.73'
    wrong:
      - { value: 2.31, feedback: 'That is the chance of exactly 5 hits. Passing also counts 6, 7 or 8 hits.' }
      - { value: 11.38, feedback: 'That is the chance of 4 or more hits: the threshold is 5.' }
      - { value: 0.1, feedback: 'You may have taken one quarter to the fifth power, which ignores the order of hits and the misses in the other trials.' }
    hint: 'Counts of independent yes-or-no trials with the same chance follow a known family; add its terms from 5 to 8.'
    explanation: |
      Each trial is a hit with chance 1/4, independently, so the number of hits $X$ follows the binomial law with $n=8$, $p=1/4$:
      $$P(X\ge5)=\sum_{x=5}^{8}\binom{8}{x}\tfrac{1}{4^x}\left(\tfrac34\right)^{8-x}$$
      The terms are about 2.31%, 0.38%, 0.04% and 0.002%, so the false-positive rate is about 2.73%. Lowering the threshold to 4 after seeing the data would raise it to about 11.4%.

  - type: mcq
    id: table
    title: "Four answers compared"
    prompt: |
      Compare four teachings by three questions: how many lives, what lasting self passes through them, and what is the goal. According to each tradition's own texts, which row is right?
    options:
      - text: 'Spiritist: many lives, always human; a lasting individual spirit; the goal is to become a pure spirit, which no longer reincarnates.'
        correct: true
      - text: 'Buddhist: many lives; a lasting soul (*atman*) passes from life to life; the goal is *moksha*.'
        feedback: |
          That row mixes in the Hindu answer. According to the Buddhist teaching of *anatta* ("not-self") no lasting self passes on, and the goal is *nirvana*.
      - text: 'Hindu: many lives, always human; a spirit with a perispirit; the goal is the pure spirit.'
        feedback: |
          In the Upanishads rebirth can pass into animal bodies, the self is the *atman*, and the goal is *moksha* ("release"). The rule "always human" is Kardec''s (Spirits'' Book, question 612).
      - text: 'Christian: many lives with purgatory between them; a soul; the goal is God.'
        feedback: |
          Purgatory, in Catholic teaching, is a purification after death for the saved, not a series of lives. The churches teach one earthly life (Hebrews 9:27).
    shuffle: false
    hint: 'Kardec keeps many lives and a lasting self, but drops animal rebirth.'
    explanation: |
      | View | Lives | Lasting self | Goal |
      |---|---|---|---|
      | Christian | one | soul | God, by grace |
      | Spiritist | many human | spirit | pure spirit |
      | Hindu | many, any species | *atman* | *moksha* |
      | Buddhist | many, any species | none | *nirvana* |

  - type: order
    id: departures
    title: "Counting departures"
    prompt: |
      Take "one life, lived by one lasting individual, in a human body" as a starting point. Count how many of three features each view departs from: more than one life, rebirth into other species, and no lasting self. Order the four views from fewest departures to most.
    steps:
      - 'Christian (none).'
      - 'Spiritist (many lives).'
      - 'Hindu (many lives, other species).'
      - 'Buddhist (many lives, other species, no lasting self).'
    hint: 'Each step adds one departure to the one before.'
    explanation: |
      The count runs 0, 1, 2, 3. Mnemonic: **Spiritism sits one step from Christianity and one from the Hindu view**, which is why Spiritists can read it as Christian and critics as Eastern borrowing. Historians such as Lynn Sharp (2006) place it in a French setting instead.

  - type: mcq
    id: layers
    title: "Sort the claims"
    prompt: |
      Mark every claim that is a **faith commitment** (what a tradition holds), not established fact or scholarly debate.
    multiple: true
    options:
      - text: 'A spirit keeps its perispirit after death and returns in a new body.'
        correct: true
      - text: 'Some sufferings are expiations of wrongs done in past lives.'
        correct: true
      - text: 'In the 2022 Brazilian census, 1.8% of people aged 10 or more declared themselves Spiritists.'
        feedback: |
          A census figure is a record: established fact. What it shows about why Spiritism grew is debate.
      - text: 'Whether Stevenson''s rebirth cases beat normal explanations.'
        feedback: |
          That is a live debate among researchers (Stevenson and Tucker on one side, Edwards and Angel on the other), not a faith commitment.
      - text: 'The Spirits'' Book first appeared in April 1857.'
        feedback: |
          A publication date is established fact, whatever one thinks of the book.
    hint: 'Data and dates are layer 1, how to weigh them is layer 2, claims about spirits are layer 3.'
    explanation: |
      Mnemonic: **record, reading, commitment**. Passing a faith claim off as fact, or a fact off as faith, is the slip the course keeps warning about, in either direction.

  - type: text
    id: summary
    body: |
      **Next:** the content map of this level, where you rebuild, box by box, how Kardec's method, his principles, the Brazilian story, the rebirth cases, the tests of mediums, the comparison with other traditions and the ethics fit together.
