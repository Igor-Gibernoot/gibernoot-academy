id: ch20-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: Spiritism"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: Allan Kardec (1804-1869) and the birth of *Spiritism*, its principles, the method of mediums and its controls, Spiritism in Brazil, the evidence for rebirth, how a medium could be tested, the comparison with Christianity and Eastern rebirth, and the ethics of trials and charity. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone (Kardec's books, a church's catechism, a researcher, a census), and the feedback keeps the course's three layers apart: **established fact** (texts, dates, data), **scholarly debate** (say which), and **faith commitment** (what a tradition holds). A *medium* is a person said to receive messages from the dead.

  - type: mcq
    id: trap-spiritualism
    title: "Two words, one thing?"
    prompt: |
      A magazine writes: "Spiritism and Spiritualism are the same thing: the American séance movement of the Fox sisters, given a French name." According to the history of the 1850s and to Spiritists themselves, which reply is best?
    options:
      - text: "They are related and of the same age, both built on communication with the dead, but not the same. *Spiritualism* names the broad movement usually dated to the Fox raps at Hydesville in 1848; *Spiritism* is the word Kardec used from 1857 for his own codified doctrine, which Spiritists hold includes reincarnation and grew from the European table-turning of the 1850s."
        correct: true
        feedback: |
          Yes. Shared practice (mediums, séances) does not make a shared doctrine. Reincarnation, central for Kardec, is not part of what the word Spiritualism names.
      - text: "They are the same: Kardec translated the Fox sisters' teachings into French."
        feedback: |
          Kardec's questions were put to mediums in Paris after the table-turning craze reached Europe in 1852-1853, and he wrote his own books. The Fox family left no doctrine to translate.
      - text: "They have nothing in common: Spiritism is a philosophy, Spiritualism a religion."
        feedback: |
          Too strong the other way. Both hold that the dead survive and communicate through mediums, and they grew in the same decade. The difference lies in Kardec's codified teaching, not in a total split.
    explanation: |
      Layers: the dates and the books are established; how closely the two currents were linked is a matter for historians; that the dead communicate at all is a faith commitment shared by both.

  - type: mcq
    id: trap-kardec-medium
    title: "Kardec heard the spirits?"
    prompt: |
      A student says: "Kardec wrote *The Spirits' Book* (1857) by hearing the spirits himself, as a prophet hears a voice." According to the Spiritist account in the lesson Kardec and the Birth of Spiritism, what is the more accurate description?
    options:
      - text: "He worked as a compiler: he put questions to spirits through mediums, by table raps or a planchette (a small board that writes under the fingers), compared the answers across mediums and sessions, and arranged what agreed into numbered questions."
        correct: true
        feedback: |
          Yes. That is why his method can be judged by its own standard, the agreement of independent mediums, which a later lesson tests.
      - text: "Correct: the book is a single revelation Kardec received alone, so no comparison was needed."
        feedback: |
          This turns an organiser into a prophet. According to the Spiritist account, the answers came through others, and Kardec presented his role as questioning, comparing and editing.
      - text: "He invented every answer himself and never attended a séance."
        feedback: |
          This skips the documented sittings. Whether the answers came from spirits is a faith question, but that Kardec attended sessions with mediums is part of the historical account.
    explanation: |
      Layers: that Kardec questioned through mediums and edited the answers is the documented account; how much his own views shaped the result is debate; that the source was spirits is faith.

  - type: numeric
    id: trap-unanimous
    title: "Five mediums agree"
    prompt: |
      Five mediums all give answer A to a question with four possible answers. A believer says: "Five out of five agreeing is too unlikely to be chance, so the answer comes from spirits." Suppose instead all five read the same popular book, and each, following it, gives answer A with chance $0.9$, independently. In that toy model, what is the chance (in %) that all five give A? Round to the nearest whole percent.
    answer: 59
    tolerance: 1
    answerText: '59%'
    wrong:
      - value: 0.39
        feedback: |
          That is the chance that five independent guessers coincide on some answer, $4(1/4)^5 = 1/256 \approx 0.39\%$. It answers the wrong rival: here the mediums share a source.
      - value: 90
        feedback: |
          That is the chance for one medium. All five must give A, so multiply the five chances.
      - value: 4.5
        feedback: |
          That adds the five chances ($5 \times 0.9 = 4.5$, which as a probability is impossible). For "all five", multiply.
    hint: |
      For all five independent events to happen, multiply the five chances of $0.9$.
    explanation: |
      $$0.9^5 \approx 0.59$$
      Under a shared source, agreement is expected about 59% of the time, so it barely tells the shared book apart from spirits. Chance is the weakest rival, not the one to beat. That is why, according to the lesson The Mediumistic Method and Its Controls, mediums who share a source count as **one witness**, and Kardec himself (*Revue Spirite*, April 1864) asked for agreement among mediums who are strangers to one another, in several regions.

  - type: mcq
    id: trap-census
    title: "Only 1.8%"
    prompt: |
      In Brazil's 2022 census, about 1.8% of people aged 10 or more (about 3.2 million of 176.7 million) declared themselves Spiritists. A commentator concludes: "So Spiritism has little influence in Brazil." Which reply is best?
    options:
      - text: "Self-declared membership and cultural weight are different quantities. Spiritist hospitals and charities, the books attributed to Chico Xavier (more than 400), films and even court cases reach far beyond 3.2 million people, and a census records one label per person, while many Brazilians move between a Spiritist centre and Catholic Mass."
        correct: true
        feedback: |
          Yes. A small share can still shape a culture, and a single-answer question undercounts people with two belongings.
      - text: "The commentator is right: a group under 2% cannot shape a country."
        feedback: |
          This reads a membership count as a measure of influence. The evidence of hospitals, bestsellers and court rulings points the other way.
      - text: "The 1.8% is wrong: really most Brazilians are Spiritists."
        feedback: |
          Overcorrection. The census figure is established for what it measures (one declared label); the open question is influence, not whether the count is false.
    explanation: |
      Layers: the census figure is established fact; how much influence Spiritism has, and why it grew in Brazil, is scholarly debate.

  - type: mcq
    id: trap-umbanda
    title: "Any spirit session is Spiritism?"
    prompt: |
      A tourist in Salvador sees a ceremony with drums, offerings and possession by the *orixás* (deities of West African origin) and writes home: "I saw a Kardecist Spiritist session." According to their adherents and to the lesson Spiritism in Brazil, which reply is best?
    options:
      - text: "That was most likely Candomblé, an Afro-Brazilian religion of nineteenth-century Bahia. Umbanda (Rio, early twentieth century) also honours the orixás and works with spirits of the dead; Kardecist Spiritism has no orixás, drums, offerings or sacrifice, and centres on book study, lectures, prayer and charity."
        correct: true
        feedback: |
          Yes. Three distinct religions, which the census counts separately, even if some people move between them.
      - text: "It is right: Umbanda and Candomblé are Brazilian names for Kardecism."
        feedback: |
          Their histories, practices and adherents all differ. Umbanda borrows some of Kardec's ideas, but borrowing does not make two religions one.
      - text: "Any ceremony involving spirits counts as Spiritism, so the label is fine."
        feedback: |
          Then most religions would be Spiritism. According to Spiritists, the name belongs to Kardec's doctrine and its books.
    explanation: |
      Describing each tradition as its adherents do is the first step: Candomblé serves the orixás, Umbanda works with the spirits of Brazil's peoples and the orixás, Spiritism follows Kardec's books.

  - type: mcq
    id: trap-stevenson
    title: "Stevenson proved rebirth?"
    prompt: |
      A website says: "The psychiatrist Ian Stevenson (1918-2007) proved scientifically that reincarnation is real." According to Stevenson himself and to his critics, which reply is most careful?
    options:
      - text: "Stevenson collected and checked thousands of children's reports and held that the evidence suggests rebirth without compelling belief. Critics such as Paul Edwards, Leonard Angel and Champe Ransom argue that leading questions, contact between families and a very low prior leave normal causes ahead."
        correct: true
        feedback: |
          Yes. "Suggests" is Stevenson's own level of claim; proof is the website's.
      - text: "The website is right: Stevenson's cases are as firm as a law of physics."
        feedback: |
          Stevenson did not claim this, and the strength of the cases is a live debate. Even among his birthmark cases, most matches rest on testimony rather than autopsy reports.
      - text: "Stevenson was shown to be a fraud, so the cases are worthless."
        feedback: |
          No critic cited in the lesson Reincarnation Evidence and Its Critics proved fraud; they criticise method (interviews, contamination) and the prior. A weak method is a reason to discount cases, not proof that they were faked.
    explanation: |
      Layers: what Stevenson recorded and published is fact; how strong the cases are is debate; that a spirit returns in a new body is faith.

  - type: mcq
    id: trap-thousands
    title: "Thousands of cases add up?"
    prompt: |
      Some 2,500 cases of children reporting past lives were on file at the University of Virginia by 2005. A defender says: "Even if each case is weak, thousands of them must add up to strong evidence." What is the main problem with this step?
    options:
      - text: "Cases add up only if they are independent. If one common cause, such as a culture that expects rebirth and shapes how parents question a child, could produce all of them, many cases weigh little more than one. Cases cluster where rebirth is believed and their details follow local belief."
        correct: true
        feedback: |
          Yes. The same rule as for mediums: a shared source counts once. Defenders reply that the strongest cases, with written records made before the previous person was found, do not fit a simple cultural story.
      - text: "There is no problem: evidence always adds up, so 2,500 weak cases are 2,500 times as strong."
        feedback: |
          Likelihood ratios multiply only when the pieces are independent given each hypothesis. A shared cause makes them rise and fall together.
      - text: "The problem is that 2,500 is too few; with a million cases the step would work."
        feedback: |
          More cases from the same common cause do not escape it. The question is independence and quality, not the count.
    explanation: |
      The strongest cases are the few with records made before verification, about 33 of the 2,500. Weighing quality over quantity is a point both sides of the debate accept.

  - type: numeric
    id: trap-best-of-five
    title: "Report the best run"
    prompt: |
      A medium is tested in a run of 10 trials, each a blind choice among 5 readings, so by chance alone each trial is a hit with probability $1/5$, and 5 or more hits by chance alone happen with probability $3.28\%$ per run. The testers run 5 such independent runs and report only the best one, calling it a success if it reached 5 hits. By chance alone, what is the probability (in %) that at least one of the 5 runs reaches 5 hits? Round to one decimal.
    answer: 15.4
    tolerance: 0.15
    answerText: '15.4%'
    wrong:
      - value: 3.28
        feedback: |
          That is the false-positive rate of a single run. Reporting the best of five gives chance five tries.
      - value: 16.4
        feedback: |
          That adds the five rates ($5 \times 3.28\%$), which counts twice the cases where two runs both pass. Use the complement: the chance that none passes.
      - value: 0.00000378
        feedback: |
          That is the chance that all five runs pass. The report needs only one.
    hint: |
      Find the chance that none of the five runs passes, then subtract it from 1.
    explanation: |
      $$1-(1-0.0328)^5 \approx 0.154$$
      Choosing the best of many runs, without saying how many were run, multiplies the chances of a false success almost fivefold. This is why, according to the lesson Could Mediumship Be Tested?, the number of runs and trials is fixed and reported in advance, and misses are counted with hits.

  - type: numeric
    id: trap-moved-threshold
    title: "Move the bar after the data"
    prompt: |
      A medium is tested in 10 trials, each a blind choice among 5 readings (chance hit rate $1/5$), with a threshold of 5 hits written down in advance; by chance alone 5 or more hits happen with probability $3.28\%$. She scores 4 hits, and the testers then lower the threshold to 4. Using $P(X=4)=\binom{10}{4}(0.2)^4(0.8)^6 \approx 8.81\%$ for exactly 4 hits by chance, what is the chance (in %) of 4 or more hits by chance alone? Round to one decimal.
    answer: 12.1
    tolerance: 0.15
    answerText: '12.1%'
    wrong:
      - value: 8.81
        feedback: |
          That is exactly 4 hits. "Four or more" also includes 5 to 10 hits, which is the 3.28%.
      - value: 3.28
        feedback: |
          That is the false-positive rate of the threshold set in advance. After moving the bar to 4, the passing region grows.
    hint: |
      Four or more hits = exactly four, plus five or more.
    explanation: |
      $$8.81\%+3.28\%\approx12.1\%$$
      Moving the bar after seeing the data nearly quadruples the false-positive rate, and worse, the bar is chosen so that the result passes. A threshold only means something if it was written before the data came in.

  - type: mcq
    id: trap-failed-test
    title: "One failure refutes Spiritism?"
    prompt: |
      A medium who claims a hit rate of $1/2$ takes a test of 10 trials with 5 options each and a threshold of 6 hits, fixed in advance. A genuine medium with that rate would still fail it about 62% of the time. She fails. A sceptic says: "Spiritism is refuted." Which reply is best?
    options:
      - text: "Two steps are too long. The failure is weak evidence against her claim, since it is only about 0.63 times as likely under her claim as under chance; and her claim is one medium's ability, not the whole doctrine, whose teachings on God, ethics and rebirth this test does not touch."
        correct: true
        feedback: |
          Yes. A strong case against her needs more trials or many failed tests. Spiritists add that, according to Kardec, spirits are free and need not come on demand; critics answer that a claim no test can touch predicts nothing.
      - text: "The sceptic is right: any failed test shows the whole doctrine false."
        feedback: |
          A low-power test fails often even when the claim is true, and a doctrine has many claims. Both parts of the step overreach.
      - text: "The failure means nothing at all, because spirits may not come on demand."
        feedback: |
          This makes the claim untestable. The failure does lower her odds a little; the honest reply is to say how much.
    explanation: |
      $$\text{LR}=\frac{P(\text{fail}\mid\text{claim})}{P(\text{fail}\mid\text{chance})}\approx\frac{0.623}{0.994}\approx0.63$$
      Layers: the result is fact; how far it bears on survival of the dead is debate; the doctrine as a whole is a faith commitment that no single test settles either way.

  - type: mcq
    id: trap-animal
    title: "Reborn as an animal?"
    prompt: |
      A student says: "Spiritists, like Hindus, believe you may be reborn as an animal if you live badly." According to the Spirits' Book (question 612), which reply is correct?
    options:
      - text: "Kardec rejects it: incarnation as an animal 'would be a retrogradation; and a spirit never retrogrades'. According to Spiritism a spirit may stand still but always reincarnates as a human, on this earth or on other worlds."
        correct: true
        feedback: |
          Yes. Kardec himself marks this as the capital difference from the ancient transmigration of souls, which the Upanishads and Buddhist texts allow.
      - text: "The student is right: Spiritism took rebirth from India, so animal births come with it."
        feedback: |
          Kardec granted that the idea of many lives is ancient, but he dropped the passage into animals on purpose. Borrowing an idea does not mean borrowing all of it.
      - text: "Spiritism teaches that animals have no spirit of any kind."
        feedback: |
          That is a different claim, not the one in question 612. What the book rules out is a human spirit going back into an animal body.
    explanation: |
      Layers: what question 612 says is established; how much Kardec owed to Indian ideas is debated by historians; whether anyone is reborn at all is faith.

  - type: mcq
    id: trap-purgatory
    title: "Purgatory is reincarnation?"
    prompt: |
      A Catholic and a Spiritist both say that an imperfect person is purified after death. A friend concludes: "So purgatory is just the Catholic word for reincarnation." According to the Catechism of the Catholic Church (1030, 1013) and the Spirits' Book, which reply is best?
    options:
      - text: "They share a purpose, purification, but not the means. Purgatory comes after one earthly life, with no new body, for those who die in God's grace and are 'assured of their eternal salvation'; Spiritist progress goes through new bodily lives. The Catechism (1013) adds that there is no reincarnation after death."
        correct: true
        feedback: |
          Yes. Seen from outside both answer the same question (how does an imperfect person become fit for God?); seen from inside they rest on different answers about how many lives a person has.
      - text: "The friend is right: both are a passage through new lives."
        feedback: |
          Purgatory involves no new birth on earth. That is the very point the Catechism denies.
      - text: "Purgatory is eternal punishment, while Spiritist trials end."
        feedback: |
          In Catholic teaching purgatory ends; what is eternal is hell, a different idea. Spiritism rejects eternal punishment.
    explanation: |
      Most Protestants reject purgatory too, so "the Christian view" here is the Catholic one; say whose view when it matters.

  - type: mcq
    id: trap-grace
    title: "Same word, same meaning?"
    prompt: |
      A reader notices that both Martin Luther (1483-1546) and Kardec speak of *grace* and concludes they agree about salvation. According to the lesson Spiritism, Christianity and Eastern Rebirth, which reply is best?
    options:
      - text: "The word is shared, the role is not. For Luther, salvation comes by grace through faith, 'not of works' (Ephesians 2:8-9), and good works follow as the fruit of faith. For Kardec, grace is 'the power that God bestows on all men and women of goodwill', a help to an effort by which each spirit advances through successive lives."
        correct: true
        feedback: |
          Yes. A Protestant critic says salvation by effort leaves room to boast; a Spiritist replies that help offered to all of goodwill favours no one, and only effort makes progress one's own.
      - text: "They agree, since both use the word grace."
        feedback: |
          A shared word can hide a real difference: for Luther grace is what saves, for Kardec it helps an effort that does the climbing.
      - text: "Kardec denies that grace exists."
        feedback: |
          The Gospel According to Spiritism (Introduction, XVII) defines grace and keeps it. What it rejects is grace as a substitute for one's own effort.
    explanation: |
      Catholics add a third view: grace is God's free and undeserved help, and "God's free initiative demands man's free response" (Catechism 2002). Three answers, one word.

  - type: mcq
    id: trap-expiation
    title: "Every suffering is a punishment?"
    prompt: |
      A man at a Spiritist centre says of a sick neighbour: "According to Spiritism, her illness must be paying for a wrong she did in a past life." According to the Gospel According to Spiritism (chapter V, item 9), which reply fits the doctrine?
    options:
      - text: "Not necessarily. Suffering may be an *expiation* (paying for a past wrong), a *trial* (a test chosen to advance) or a *mission* (a task an advanced spirit takes on), and 'an expiation always serves as a trial, but a trial is not always an expiation'. An onlooker cannot tell which it is."
        correct: true
        feedback: |
          Yes. Expiations are a subset of trials, so "she suffers" never implies "she did wrong".
      - text: "He is right: every suffering is an expiation for a past wrong."
        feedback: |
          This drops two of the doctrine's three categories. The book allows chosen trials and missions with no past wrong behind them.
      - text: "Spiritism teaches that suffering has no cause at all."
        feedback: |
          The opposite: Kardec argues that every effect has a cause, so undeserved suffering here points to a cause before. The point is that the cause need not be a wrong.
    explanation: |
      $$\text{expiations}\subset\text{trials}$$
      Layers: what chapter V says is established; how believers apply it in practice is debated; that a just cause lies behind each fate is faith.

  - type: mcq
    id: trap-let-it-run
    title: "Respect the trial?"
    prompt: |
      A Spiritist says: "My neighbour's poverty is her chosen trial. Out of respect for God's plan I should not interfere." According to the Gospel According to Spiritism (chapter V, item 27) and the Spirits' Book (question 642), which reply fits the doctrine?
    options:
      - text: "The doctrine says the reverse: one must not say 'It is God's justice and it must take its course'; one should ease a neighbour's trial if one can, and each person answers for 'all the good which he has failed to do'."
        correct: true
        feedback: |
          Yes. Standing aside is a failure of charity, and according to question 642 omissions count against the one who omits.
      - text: "He is right: interfering would undo a trial the spirit chose."
        feedback: |
          Item 27 calls this view a great error. Helping may itself be part of both people's trials.
      - text: "He is right, but only for trials, not for expiations."
        feedback: |
          No one can tell a trial from an expiation by looking, and the duty to help applies in every case.
    explanation: |
      This is the doctrine's own reply to the charge that it breeds indifference; whether believers live up to it is a matter of practice, not of the text.

  - type: mcq
    id: trap-fatalism
    title: "A chosen life means destiny?"
    prompt: |
      Someone says: "If my spirit chose this life and its trials before birth, then everything I do in it is fixed. Spiritism is fatalism." According to the Spirits' Book (questions 851 and 872), which reply fits the doctrine?
    options:
      - text: "The spirit is free at two moments: before birth it chooses the kind of trials, and during life it stays free to yield to or resist each temptation. The only 'fatality' is the physical trial chosen; acts 'are not written down beforehand'."
        correct: true
        feedback: |
          Yes. The setting is chosen, the moral choices inside it are not fixed. "Without free-will man would be a machine" (question 843).
      - text: "He is right: once the trials are chosen, every act follows."
        feedback: |
          This is the fatalism the book rejects outright. Question 872 keeps free will in every act.
      - text: "Spiritism denies that spirits choose anything before birth."
        feedback: |
          Overcorrection. The book does say a spirit chooses the kind of trials (question 258); it denies only that this choice fixes each act.
    explanation: |
      A critic may still ask whether choosing one's sufferings before birth is a choice anyone could make meaningfully without memory of it; that is a live philosophical question, not a misreading.

  - type: mcq
    id: trap-charity
    title: "Charity for believers only?"
    prompt: |
      A student reads Kardec's motto "Without charity there is no salvation" (Gospel According to Spiritism, chapter XV) and concludes: "So only Spiritists who practise charity are saved." Which reading fits Kardec's text?
    options:
      - text: "The motto was set against 'outside the Church there is no salvation': it makes salvation depend on doing good, open to anyone of any creed. The chapter opens with the Good Samaritan, 'regarded as a heretic', placed above orthodoxy that lacks charity."
        correct: true
        feedback: |
          Yes. A Catholic theologian would add that the Church today is less exclusive than Kardec says (Catechism 847), while still holding that salvation comes through Christ.
      - text: "The student is right: the motto requires belief in Spiritism first."
        feedback: |
          This reads in a creed test the motto was written to remove. Kardec's point is that conduct, not membership, decides.
      - text: "The motto means charity is optional, a bonus on top of faith."
        feedback: |
          The reverse: for Kardec charity is the condition, and the law of charity includes all the others.
    explanation: |
      Layers: what chapter XV says is established; whether Kardec read the Catholic formula fairly is debate; what saves, if anything, is faith.

  - type: mcq
    id: trap-lerner
    title: "Psychology refutes the doctrine?"
    prompt: |
      In the experiments of Melvin Lerner and C. H. Simmons (1966), observers who could not stop a peer's apparent suffering tended to devalue her (the *belief in a just world*). A critic concludes: "So Spiritism's teaching on expiation is false." Which reply is most careful?
    options:
      - text: "The study is about observers, not about the cause of suffering. It shows that a just-world reading can feed blaming the sufferer, which gives weight to the worry about texts such as 'those who suffer greatly must tell themselves that they have much to expiate'; it cannot show whether past lives exist. Spiritists reply that no one can tell expiation from trial or mission, and that the doctrine commands help."
        correct: true
        feedback: |
          Yes. A finding about how people judge can make an ethical objection stronger, but it cannot settle a metaphysical claim either way.
      - text: "The critic is right: the experiment proved there are no past lives."
        feedback: |
          No experiment on observers tests past lives. This turns a psychological result into a metaphysical verdict.
      - text: "The study is irrelevant, since it says nothing about Spiritism."
        feedback: |
          Too quick the other way. It bears on how a doctrine of deserved suffering may work in practice, which is exactly the ethical worry.
    explanation: |
      Layers: Lerner's findings are a result about observers; whether the doctrine softens or sharpens blame in practice is debate; past lives and a just cause behind each fate are faith.

  - type: mcq
    id: trap-layers
    title: "Sort the claims"
    prompt: |
      Mark every claim that is **established fact** (texts, dates, data) rather than scholarly debate or faith.
    multiple: true
    options:
      - text: "The Spirits' Book first appeared on 18 April 1857, with 501 questions."
        correct: true
        feedback: |
          Yes: a documented publication.
      - text: "The answers in the Spirits' Book came from spirits of the dead."
        feedback: |
          Faith: what Spiritists hold, not something the documents can show.
      - text: "In 1998 Schouten and Stevenson found about the same share of correct statements in cases with records made before verification (76.7%) as without (78.4%)."
        correct: true
        feedback: |
          Yes: a published result, though what it shows about rebirth is a separate question.
      - text: "Spiritism grew in Brazil because it gave an educated middle class a modern, scientific faith."
        feedback: |
          Debate: one scholarly explanation among several for an established growth.
      - text: "Kardec owed his doctrine of many lives mainly to French romantic socialists such as Pierre Leroux and Jean Reynaud."
        feedback: |
          Debate: historians such as Lynn Sharp place him in that milieu, but how much he owed to it is contested, and a convergence reading exists.
    explanation: |
      The method of the whole level: a book is a fact, its source is a question of faith, and why it spread or what it borrowed is for historians to argue.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **The shortcuts to drop**, with the lesson where each is taken apart:

      | Trap | Lesson |
      |---|---|
      | Spiritism is Spiritualism; Kardec heard the spirits himself | Kardec and the Birth of Spiritism |
      | Spiritists believe in animal rebirth | The Core Principles; Spiritism, Christianity and Eastern Rebirth |
      | Unanimous mediums prove the source | The Mediumistic Method and Its Controls |
      | 1.8% means little influence; Umbanda is Kardecism | Spiritism in Brazil |
      | Stevenson proved rebirth; thousands of cases add up | Reincarnation Evidence and Its Critics |
      | Best of five runs, moved threshold; one failure refutes | Could Mediumship Be Tested? |
      | Purgatory is reincarnation; grace means the same | Spiritism, Christianity and Eastern Rebirth |
      | All suffering is expiation; let the trial run; chosen life is fate; charity needs a creed; Lerner refutes the doctrine | The Ethics of Spiritism |

      **The habit.** Before accepting a claim about Spiritism, ask: according to whom (Kardec's books, a church, a researcher, a census), are the pieces of evidence independent, was the test fixed in advance, and which layer is it (fact, debate or faith).

