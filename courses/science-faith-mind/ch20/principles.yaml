id: ch20-principles
title: "The Core Principles"
kind: concept
own: |
  The setting: *Spiritism*, the doctrine that Allan Kardec (1804-1869) compiled in *Le Livre des Esprits* ("The Spirits' Book", 1857, enlarged 1860) from answers he said came from spirits through mediums (people said to receive messages from the dead). Everything below is taught according to the Spirits' Book and Kardec's later works; whether it is true is where readers part ways.
  - **God.** According to the Spirits' Book, God is {{ the Supreme Intelligence, first cause of all things }}: eternal, immutable, immaterial, unique, all-powerful, sovereignly just and good. The proof offered is causal: there is no effect without a cause, the universe exists, so it has a cause. Critics of causal arguments reply that the step from "each thing has a cause" to "the whole has a cause" is the doubtful one.
  - **The spirit and its envelopes.** A *spirit* is an individual intelligent being created by God; the *soul* is an incarnated spirit. A human being has three parts:
    $$\text{body}+\text{perispirit}+\text{spirit}$$
    The {{ **perispirit** is a semi-material envelope that links spirit and body and stays with the spirit after death }}.
  - **Reincarnation and progress.** Each spirit lives many bodily lives, always as a human (never as an animal), on this earth or other worlds, and {{ may stand still but never goes backwards }}; the aim, in the Spirits' Book's words, is "expiation; improvement of progressive mankind". Spirits are ranked in 3 orders (imperfect, good, pure) and 10 classes:
    $$5+4+1=10$$
    Past lives are forgotten during a life and remembered between lives. Kardec's main argument: only many lives fit {{ the justice of God toward people born into unequal conditions }}.
  - **Moral law.** The moral law is grouped into ten laws, of which justice, love and charity is the most important; charity, in the Spirits' Book's words, is {{ "benevolence for every one, indulgence for the imperfections of others, forgiveness of injuries" }}, and Jesus is called the most perfect guide and model.
  - **Communication.** Spirits are around us and communicate in hidden ways (influence on thought) and open ways (writing, speech, physical effects), usually through mediums; anyone who feels their influence is, to some degree, a medium. Some spirits deceive and borrow famous names, so messages are judged by their content.
  - **Where people part ways.** The Catholic Church teaches one earthly life (Hebrews 9:27) and warns against consulting the dead; Kardec read John 3:3 ("born again") as rebirth in a new body, most Christian readers as a spiritual rebirth. Philosophers ask whether a self without memories of its past lives is the same person, and how a fixed set of souls fits a growing population (an objection from Tertullian, revived by Paul Edwards in 1996; reply: new spirits are always being created). Physicalists take the brain's control over the mind as evidence that the mind ends with the brain; William James (1898) answered that the brain might transmit the mind rather than produce it. Layers: what the books teach is fact; how well the arguments work is debate; that spirits exist and return is faith.

cards:
  - type: mcq
    id: hook
    title: "Guess: two children, one question"
    prompt: |
      Guessing is the point. Two children are born on the same day: one healthy, in a loving and well-off family; the other severely ill, in a home of war and hunger. Neither has done anything yet. Suppose you hold that God is perfectly just and good, and that each person has a soul. Which further idea would make the unequal start look *just* rather than arbitrary?
    options:
      - text: "Each soul has lived before, and its present starting point is linked to what it did and learned in earlier lives."
        correct: true
        feedback: |
          This is the answer the Spiritist doctrine of Allan Kardec gives, and the lesson builds it up. Many readers will find it consoling; others will find it troubling, since it seems to link suffering to past faults. Both reactions return at the end.
      - text: "The inequality does not need explaining: a just God would never allow it."
        feedback: |
          But the inequality is a fact we can see. The problem is to fit what we see with the belief in a just God, which is the problem of evil you met in the level on evil and suffering.
      - text: "Each soul is created fresh at birth, and the difference will be made up in a single afterlife."
        feedback: |
          That is a real answer, held by many Christians, Muslims and Jews: one life, then judgment and reward. It makes the start fair only in the long run. Spiritism thinks it leaves the start itself unexplained, which is why it adds earlier lives; this lesson shows how.
    explanation: |
      Every answer here is a metaphysical or faith commitment, not a finding. The lesson states Spiritism's principles as its founder stated them, and then what its critics, Christian, philosophical and scientific, reply.

  - type: text
    id: overview
    title: "Five principles in one book"
    image:
      src: img/livre-esprits-1860.webp
      alt: "Title page of Le Livre des Esprits, fourth edition, Paris, Didier, 1860, with the words Philosophie spiritualiste at the top."
      caption: "An 1860 title page promises the principles of the Spiritist doctrine on the soul's immortality, the nature of spirits and their dealings with people, the moral laws and the future life."
      credit: "Book: Allan Kardec, scan: Fran6fran6, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Le_Livre_des_Esprits_2.jpg"
    body: |
      Recall: **Spiritism** is the doctrine compiled by the French educator Hippolyte Léon Denizard Rivail (1804-1869) under the name **Allan Kardec**, mainly in *Le Livre des Esprits* ("The Spirits' Book", 1857, enlarged 1860). It is written as numbered questions and the answers Kardec said spirits gave through **mediums**, people said to receive messages from the dead.

      The book has four parts: First Causes, the Spirit World, Moral Laws, and Hopes and Consolations. This lesson groups its core into five principles and takes them one at a time: **God**, the **spirit** that survives the body, **reincarnation** (many bodily lives), **moral progress** through those lives, and **communication** between the living and the dead. Quotations below are from Anna Blackwell's English translation.

  - type: text
    id: god
    title: "God, the first cause"
    body: |
      The book opens with its shortest answer. To question 1, "What is God?", the reply is:

      > "God is the Supreme Intelligence — First Cause of all things."

      Its summary of the doctrine lists the attributes: God is "eternal, immutable, immaterial, unique, all-powerful, sovereignly just and good". The book also says (questions 10 and 11) that a human mind cannot grasp God's nature while it is still clouded by matter.

      Why believe God exists? Question 4 answers with "the axiom which you apply in all your scientific researches, There is no effect without a cause". Kardec's comment spells out the reasoning: "The universe exists, therefore it has a cause."

  - type: mcq
    id: god-argument
    title: "Which premise would a critic question?"
    prompt: |
      According to the Spirits' Book (question 4 and Kardec's comment), God's existence follows like this: P1, there is no effect without a cause; P2, the universe exists; C, so the universe has a cause, the Supreme Intelligence. Which step would a critic of this kind of causal argument most likely question?
    options:
      - text: "The move from \"each thing in the universe has a cause\" to \"the universe as a whole has a cause\", and then from \"a cause\" to \"an intelligent God\"."
        correct: true
        feedback: |
          Yes. These are the two classic gaps of cosmological arguments: the whole may not need a cause the way its parts do, and a first cause need not be a mind. Defenders reply that a universe which began needs a cause beyond it, and that the order of nature points to intelligence (the Spirits' Book adds this second point in question 9).
      - text: "P2: whether the universe exists."
        feedback: |
          Almost no one doubts P2. The debate is over what follows from it.
      - text: "Nothing: the argument is scientific, because science also uses \"no effect without a cause\"."
        feedback: |
          Science applies the causal principle to events inside the universe and tests each case. Applying it to the universe as a whole is a philosophical step, which is why this is an argument of natural theology, not a scientific result.
    explanation: |
      The Spirits' Book's proof belongs to the family of cosmological arguments you met in the level on the arguments for God. Spiritism adds little to it; what is new in the doctrine comes next, about spirits.

  - type: text
    id: spirit
    title: "Spirit, soul and perispirit"
    body: |
      According to the Spirits' Book, God created two kinds of being: material ones, forming the visible world, and immaterial ones, the **spirits**, forming the spirit world. The spirit world is called the "normal, primitive, eternal world"; the bodily world is secondary. And creation of spirits never stops: asked whether it is always going on, the answer (question 80) is that God "has never ceased to create".

      A spirit takes on a body for a while. "The soul is an incarnated spirit, whose body is only its envelope." So a living human being has three parts: the body; the soul, which is the incarnated spirit; and a link between them, the **perispirit**, which the Spirits' Book calls "a sort of semi-material envelope". At death the body is destroyed but the spirit keeps its perispirit, an ethereal body, invisible as a rule but, according to the doctrine, able to become visible in apparitions.

  - type: mcq
    id: survives
    title: "What survives death?"
    prompt: |
      According to the Spirits' Book, what remains of a human being after the body dies?
    options:
      - text: "The spirit, with its own individuality and memories, still wrapped in its perispirit, a semi-material envelope."
        correct: true
        feedback: |
          Yes. The book says the soul "preserves that individuality after its separation from the body", and the perispirit stays with it as a light body.
      - text: "The spirit, which may next animate the body of an animal."
        feedback: |
          The Spirits' Book rejects this. A spirit is always incarnated in a human body; rebirth of a person as an animal would be going backwards, which the doctrine rules out. This is a real difference from many Hindu and Buddhist views of rebirth, which do allow animal births.
      - text: "Nothing personal: the spirit dissolves back into one universal mind."
        feedback: |
          That is closer to some mystical and pantheist views. Spiritism insists on the opposite: each spirit keeps its individuality before, during and after a bodily life.
      - text: "Nothing until the end of time, when the same body is raised again."
        feedback: |
          That is the Christian, Jewish and Islamic hope of bodily resurrection. Spiritism instead teaches that the spirit lives on at once, and later takes new bodies.
    explanation: |
      Three views of survival to keep apart: Spiritism (individual spirit, many bodies), resurrection (one body, raised once), and dissolution into a whole. Physicalists, who hold that the mind is what the brain does, deny survival altogether; their view comes at the end of the lesson.

  - type: text
    id: scale
    title: "A ladder of spirits"
    body: |
      Spirits, says the Spirits' Book, are not equal "in power, in intelligence, in knowledge, or in morality". Kardec grouped them on a **spirit scale** of three orders. The third, lowest order holds **imperfect spirits**, from impure and deceitful ones to merely frivolous or noisy ones. The second holds **good spirits**, from kind ones to wise and high ones. The first holds **pure spirits**, which have reached perfection. Inside the orders he numbered **classes**, from the tenth class at the bottom to the first at the top.

      No spirit is stuck on its rung: all "are destined to attain perfection" by climbing. Asked whether spirits can degenerate (question 118), the answer is no: a spirit learns from each trial, and "He may remain stationary; but he never degenerates."

  - type: numeric
    id: classes
    title: "Counting rungs"
    prompt: |
      On Allan Kardec's spirit scale, classes are numbered from the tenth (lowest) to the first (highest). The third order, the imperfect spirits, contains the tenth class down to the sixth class, inclusive. How many classes does the third order contain?
    answer: 5
    answerText: '5'
    wrong:
      - { value: 4, feedback: "Subtracting $10-6=4$ counts the gaps between classes, not the classes. Count both ends: tenth, ninth, eighth, seventh, sixth." }
    hint: "List them: tenth, ninth, ... down to sixth."
    explanation: |
      Classes 10, 9, 8, 7, 6 make $10-6+1=5$. The second order (good spirits) holds classes 5 to 2, that is 4 classes, and the first order (pure spirits) one class, so $5+4+1=10$ in all. The book itself says the number of orders could be larger or smaller depending on the point of view; the point is the ladder and that every spirit can climb it.

  - type: text
    id: reincarnation
    title: "Many lives, one direction"
    image:
      src: img/kardec-tomb.webp
      alt: "A dolmen-shaped granite tomb with a bronze bust under its stone roof, covered with flowers, with visitors standing beside it in a tree-lined cemetery lane."
      caption: "Kardec's tomb in Père Lachaise cemetery, Paris, kept covered in flowers by visitors, bears the motto *Naître, mourir, renaître encore et progresser sans cesse, telle est la loi* (to be born, die, be reborn again and progress without end: such is the law)."
      credit: "DuiMDog, CC BY 2.5, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Grave_Allen_Kardec.JPG"
    body: |
      The climb happens through **reincarnation**: a spirit takes many bodily lives in turn. Asked its aim (question 167), the spirits answer: "Expiation; improvement of progressive mankind." Each life is a trial or a mission; between lives the spirit is in the spirit world. The number of lives varies (the faster one advances, the fewer trials one needs), and when a spirit is fully purified it needs no more bodies (questions 168 to 170). Lives take place on this earth and on other worlds; the earth, says question 172, is one of the most material and least perfect.

      Two features set this apart from older ideas of rebirth. It is **always progressive**: no going back, and no human reborn as an animal. And during a life one **forgets** the past ones: according to question 392, without that veil we would be dazzled, and "Through the forgetfulness of his past a man is more fully himself".

  - type: order
    id: cycle
    title: "Between two lives"
    prompt: |
      According to the Spirits' Book (its answer to question 393), put in order what happens to a spirit from the end of one bodily life to the next.
    steps:
      - "The body dies and the spirit returns to the spirit world"
      - "Its whole past unrolls before it, and it sees its faults and their effects"
      - "It asks for new trials suited to the faults it failed to overcome"
      - "It is born into a new body and forgets the past"
      - "It keeps only an intuition of past faults, felt as the voice of conscience"
    hint: "Memory returns between lives and is lost again at birth."
    explanation: |
      In this picture the spirit chooses its trials, with help from higher spirits; suffering in the new life is not only a penalty but a chosen school. According to the doctrine, conscience is the trace of forgotten lessons. A critic will ask how one could ever check any step of this cycle; that question belongs to the lessons on method and on reincarnation evidence.

  - type: mcq
    id: justice
    title: "Back to the two children"
    prompt: |
      Two children are born on the same day, one healthy and secure, the other ill and in want. According to Allan Kardec's comment on question 171 of the Spirits' Book, why must there be many lives?
    options:
      - text: "Because only many lives fit the justice of God toward people placed, through no choice in this life, in conditions bad for their moral progress: each gets new trials to make up what was not done."
        correct: true
        feedback: |
          Yes. The answer to question 171 names "the justice of God, and revelation" as the foundation, and adds that eternal loss for those who never had the chance to improve would be unjust. Many lives give everyone, in the end, the same chance.
      - text: "Because the evidence of remembered past lives has proved it."
        feedback: |
          Kardec's foundation here is moral and theological (God's justice), not case studies. Reported memories of past lives are a separate kind of evidence, studied by others in the next century; they have their own lesson in this level.
      - text: "Because the poor child is being punished for the sins of its parents."
        feedback: |
          The doctrine speaks of the spirit's own past, not inherited guilt. Each spirit answers for itself; its trials are linked to its own former lives.
    explanation: |
      Here the hook is resolved, according to Spiritism. The same answer draws its sharpest criticism: if a hard life is linked to past faults, does that blame the sufferer? Spiritists reply that a trial may be chosen as a mission, not a punishment, and that the doctrine's response to suffering is a duty of charity, which comes next.

  - type: text
    id: moral
    title: "The moral law and charity"
    body: |
      The third part of the Spirits' Book is about **moral laws**, which it calls divine or natural law. It groups them into ten: the laws of adoration, labour, reproduction, preservation, destruction, society, progress, equality, liberty, and of justice, love and charity. Asked about this division (question 648), the spirits call the last "the most important because the law of charity includes all the others".

      What is charity? To question 886 the answer is: "Benevolence for every one, indulgence for the imperfections of others, forgiveness of injuries." Kardec adds that it is not restricted to alms-giving. The book sums up the higher spirits' teaching in the golden rule, "Do unto others as you would that others should do unto you", and names Jesus (question 625) as "the most perfect type that God has offered to man as his guide and model". In *The Gospel According to Spiritism* (1864) a whole chapter carries the motto that became the movement's banner: **without charity there is no salvation**.

  - type: mcq
    id: charity
    title: "What counts as charity?"
    prompt: |
      A Spiritist donates money every month but treats co-workers with contempt and never forgives an old insult. According to the Spirits' Book's definition of charity (question 886), what is missing?
    options:
      - text: "Most of it: charity there means benevolence to everyone, indulgence for others' faults and forgiveness of injuries, not alms alone."
        correct: true
        feedback: |
          Right. Kardec's comment says charity "is not restricted to alms-giving, but embraces all our relations with our fellow-men". Giving money is one part.
      - text: "Nothing: charity means giving to the poor, and the monthly gift fulfils it."
        feedback: |
          That is the everyday sense of the word, and the Spirits' Book widens it on purpose. Charity as defined in question 886 is an attitude to every person, including forgiveness.
      - text: "Belief: charity only counts if one accepts the Spiritist doctrine."
        feedback: |
          The opposite. Kardec's motto "without charity there is no salvation" was meant to replace conditions of belief: in his reading anyone of any creed who practises charity is on the right road.
    explanation: |
      This is where the doctrine turns practical. In Brazil, where Spiritism grew most, it is known above all for charitable works, a theme of the lesson Spiritism in Brazil. A critic may agree with this ethics while rejecting every claim about spirits: the two can be separated.

  - type: text
    id: communication
    title: "The dead among the living"
    body: |
      The last principle is the one that started it all. According to the Spirits' Book, spirits without bodies are "everywhere, in space, and around us", and are "incessantly in relation with men". Good spirits encourage us; bad ones tempt us. Their communications are **hidden**, as influence on our thoughts that we must judge for ourselves, or **open**, by writing, speech or physical effects, "usually through the intermediary of the mediums".

      Kardec's *The Mediums' Book* (1861) adds that every person who feels the influence of spirits in any degree is, to that degree, a medium, though only some have the gift strongly. And the doctrine warns itself: lower spirits "often borrow the most venerated names" to impress their listeners. That is why the Recall from the lesson Kardec and the Birth of Spiritism matters: Kardec judged a message by its content and by agreement among independent mediums, not by its signature.

  - type: mcq
    id: signature
    title: "A message from a saint?"
    prompt: |
      At a Spiritist meeting a medium writes a message signed "Saint Augustine" that flatters the group and predicts a lottery win. According to the Spirits' Book's own guidance, how should the group treat it?
    options:
      - text: "With suspicion: lower spirits borrow famous names, and high spirits speak with dignity and aim at moral improvement, so the content, not the signature, decides."
        correct: true
        feedback: |
          Yes. The book says the communications of lower spirits flatter vanity and raise false hopes, while those of higher spirits are "free from every trace of earthly passion". A sceptic would add a simpler explanation: the medium's own mind produced it.
      - text: "As authoritative, since a famous signature guarantees a high spirit."
        feedback: |
          The doctrine explicitly denies this: names can be borrowed. A signature proves nothing either way.
      - text: "As proof that the medium is a fraud, since no real message could ever be wrong."
        feedback: |
          According to Spiritism, real spirits can be wrong or deceptive, so a bad message does not show the medium cheated. A sceptic reaches the same caution by another road: no message is taken as coming from the dead without independent checks.
    explanation: |
      Notice that the doctrine and its critics agree on the practical rule (judge content, distrust names) while disagreeing on the source. Whether the doctrine's own tests are strong enough is the subject of the next lesson.

  - type: text
    id: christian
    title: "A Christian objection"
    body: |
      Kardec read the Gospels in a Spiritist light (*The Gospel According to Spiritism*, 1864); most churches rejected the doctrine. The **Catechism of the Catholic Church** (paragraph 1013) teaches one earthly life, citing Hebrews 9:27, which the King James Version renders "it is appointed unto men once to die, but after this the judgment", and adds: "There is no 'reincarnation' after death." On contact with the dead, Deuteronomy 18:10-11 forbids a "consulter with familiar spirits" and a "necromancer" (one who questions the dead), and the Catechism (paragraph 2117) says Spiritism "often implies divination or magical practices" and warns the faithful against it.

      Kardec answered from the Gospels. In John 3:3 (King James Version) Jesus tells Nicodemus, "Except a man be born again, he cannot see the kingdom of God." In *The Gospel According to Spiritism* Kardec read the next phrase, born "of water and of the Spirit", as born again with body and soul, so as a new bodily life. Most Christian readers take it as a spiritual rebirth; the Greek word rendered "again", *anōthen*, can also mean "from above".

  - type: mcq
    id: born-again
    title: "Two readings of one verse"
    prompt: |
      In John 3:3 Jesus says that unless a person is born *anōthen* (Greek: "again" or "from above"), they cannot see the kingdom of God. What is the fair way to describe the disagreement between Allan Kardec and most Christian interpreters?
    options:
      - text: "Kardec reads it as rebirth in a new body (water = body, spirit = soul); most Christians read it as a spiritual rebirth from God, often linked to baptism. Each reading fits the words and rests on wider beliefs about the soul."
        correct: true
        feedback: |
          Yes. The verse alone does not settle it: the word is ambiguous, and each side reads it inside its own framework (many lives for Kardec, one life and judgment in Hebrews 9:27 for the churches).
      - text: "The Greek settles it for Kardec: *anōthen* can only mean a second bodily birth."
        feedback: |
          No: the word can mean "from above", and in this very chapter (John 3:31) it does. Nicodemus himself misunderstands it as a second physical birth, and Jesus's reply speaks of being born of the Spirit.
      - text: "Kardec was simply misquoting the verse."
        feedback: |
          He quoted it and argued for a reading; the dispute is over interpretation, not quotation.
    explanation: |
      A pattern of this course: the same text read in two frameworks. The detailed comparison with Christian and Eastern ideas is the lesson Spiritism, Christianity and Eastern Rebirth.

  - type: text
    id: philosophers
    title: "Two puzzles from philosophers"
    body: |
      Philosophers raise two puzzles about reincarnation itself. The first is **memory**. If I remember nothing of a past life, in what sense was it *me*? Kardec put the objection to the spirits himself (question 393): how can a man atone for faults he cannot remember? The answer: each life leaves the spirit more intelligent and better at telling good from evil; the whole past returns between lives; and remembering everything would take away our freedom. The American philosopher Paul Edwards (1923-2004), in *Reincarnation: A Critical Examination* (1996), argued roughly that the absence of genuine memories of past lives counts strongly against the doctrine, and that it needs a soul separate from the body, which he also rejected.

      The second is **population**. Already in antiquity the Christian writer Tertullian argued that rebirth needs a fixed number of souls, yet the living keep increasing; Edwards revived the argument. Defenders reply that the number need not be fixed. The Spirits' Book itself gives two such replies: new spirits are always being created (question 80), and lives are spread over many worlds (question 172).

  - type: mcq
    id: replies
    title: "Matching a reply to an objection"
    prompt: |
      A critic says: "There are about eight billion people alive today and far fewer lived in the past, so reincarnation of the same souls is impossible." Which reply could a Spiritist give using only the Spirits' Book's own teachings?
    options:
      - text: "The number of spirits is not fixed: God never ceases creating spirits, and spirits also come from and go to other worlds."
        correct: true
        feedback: |
          Yes: questions 80 and 172. The critic can reply that this makes the doctrine flexible enough to fit any population, which is itself a worry about testability; that charge is weighed in the lesson on method.
      - text: "Past lives are forgotten, so we cannot count them."
        feedback: |
          Forgetting answers the memory puzzle, not this one. The population objection is about numbers of souls, whatever anyone remembers.
      - text: "Some humans were animals in their previous life."
        feedback: |
          Some reincarnation views use that reply, but not Spiritism: the Spirits' Book rules out rebirth between animal and human bodies.
    explanation: |
      Logic of the exchange: the objection works only with the premise "the number of souls is fixed". Spiritism denies that premise. So the debate moves to whether the extra premises (continual creation, other worlds) are independently supported or added to save the theory.

  - type: text
    id: brain
    title: "The objection from the brain"
    body: |
      The deepest objection comes from neuroscience, read by **physicalists** (those who hold that the mind is what the brain does). A blow to the head, a stroke or a drug can change memory, mood and character; general anaesthesia switches experience off. If the mind depends this closely on the brain, they argue, it is most likely produced by the brain, and ends when the brain dies, leaving nothing to reincarnate.

      Defenders of survival answer with an older distinction. In his 1898 lecture *Human Immortality*, the psychologist William James argued that dependence does not settle *how* the brain works: a prism or the keys of an organ shape something they do not create. When we say thought is a function of the brain, he wrote, "we are not required to think of productive function only; we are entitled also to consider permissive or transmissive function." On that picture damage to the brain distorts the signal, as a cracked lens would, without showing that the source is gone. James claimed only that survival is not ruled out, not that it is proved.

  - type: mcq
    id: transmission
    title: "What does the brain evidence show?"
    prompt: |
      Brain damage changes personality and memory. According to William James's distinction between a brain that *produces* the mind and one that *transmits* it, what does this evidence by itself establish?
    options:
      - text: "That the mind as we observe it depends on the brain; both pictures predict that, so the evidence alone does not decide between them."
        correct: true
        feedback: |
          Yes, that was James's point. A physicalist replies that production is the simpler picture and that a transmitted mind adds an entity with no independent sign of it; a defender replies that simplicity is not proof, and points to reports (near-death experiences, mediumship) it thinks fit transmission better. Weighing those reports is for the later lessons.
      - text: "That the mind is produced by the brain, so survival is refuted."
        feedback: |
          Dependence is what both pictures predict. To refute transmission one needs evidence that one picture predicts and the other does not.
      - text: "That the mind is transmitted, so survival is proved."
        feedback: |
          James claimed much less: only that survival is compatible with the brain facts. Compatible is not shown.
    explanation: |
      A careful thinker separates "the data fit my view" from "the data favour my view over its rival". In Bayesian terms, evidence that both hypotheses predict equally well leaves their odds where they were.

  - type: mcq
    id: layers
    multiple: true
    title: "Sorting the claims"
    prompt: |
      Which of these statements are *established fact* (layer 1), true whatever one believes about spirits? Select all that apply.
    options:
      - text: "The Spirits' Book teaches that spirits reincarnate only in human bodies and never go backwards."
        correct: true
        feedback: |
          Yes: what a book teaches is a fact about the book, checkable by reading it.
      - text: "The Catechism of the Catholic Church states that there is no reincarnation after death."
        correct: true
        feedback: |
          Yes: paragraph 1013 says so. Whether the Church is right is another matter.
      - text: "Each person's present life is shaped by the faults of earlier lives."
        feedback: |
          This is a faith commitment of Spiritism (layer 3). No observation could confirm it directly, which is why the doctrine argues for it from God's justice.
      - text: "Brain damage shows that the mind ends at death."
        feedback: |
          That brain damage changes the mind is fact; that the mind therefore ends at death is the physicalist reading, a live debate (layer 2), as James's transmission reply shows.
    explanation: |
      Layer 1: what texts and institutions say, and what brain lesions do. Layer 2: how well the causal argument, the justice argument and the brain evidence work. Layer 3: that God is the first cause, that spirits exist, reincarnate and communicate. Believers and sceptics can agree on all of layer 1.

  - type: text
    id: summary
    body: |
