id: ch20-ethics
title: "The Ethics of Spiritism"
kind: concept
own: |
  The setting: *Spiritism*, the doctrine Allan Kardec (1804-1869) compiled in *The Spirits' Book* (1857, enlarged 1860; quoted in Anna Blackwell's translation), *The Gospel According to Spiritism* (1864) and *Heaven and Hell* (1865; both quoted in the Kimble translations). According to Spiritism a living person is
  $$\text{body}+\text{perispirit}+\text{spirit}$$
  where the *perispirit* is a semi-material envelope that stays with the spirit after death, and the spirit is an individual created by God that lives many human lives and never goes backwards. The ethics below is taught according to these books; whether it is true is where readers part ways.
  - **Every effect has a cause.** Kardec's argument for past lives: suffering with no cause in this life is an effect; a just God gives it a just cause; the cause comes before the effect; so {{ the cause lies in a previous existence }}. Brazilian Spiritists call the principle the *law of cause and effect*.
    $$\text{undeserved here}\Rightarrow\text{caused before}$$
  - **Trial, expiation, mission.** An *expiation* pays for a past wrong, a *trial* is a test chosen to advance, a *mission* is a task taken on by an advanced spirit. According to the Gospel According to Spiritism (chapter V, item 9), {{ an expiation always serves as a trial, but a trial is not always an expiation }}:
    $$\text{expiations}\subset\text{trials}$$
    So an onlooker cannot tell from a person's suffering which of the three it is.
  - **The penal code of the future life.** Heaven and Hell (part 1, chapter VII) states it in 33 articles: suffering is the natural consequence of imperfection, every wrong is a debt paid in this or a later life, and a wrong is erased in three steps (article 16), since repentance alone would make forgiveness "an act of grace alone":
    $$\text{repentance}\to\text{expiation}\to\text{reparation}$$
  - **Free will, not fatality.** "Without free-will man would be a machine" (question 843). According to question 872 the spirit is free twice:
    $$\text{choice of trials}+\text{choice in each act}$$
    before birth it chooses the kind of trials; in life {{ it stays free to yield to or resist each temptation }}. The only "fatality" is the physical trial chosen (question 851).
  - **Charity as the response to suffering.** "Without charity there is no salvation" (Gospel, chapter XV) was set against "outside the Church there is no salvation": salvation open to anyone of any creed who does good. A sufferer's trial is never a reason to stand aside: one must not say "It is God's justice and it must take its course" (chapter V, item 27), and each answers {{ for the good he has failed to do }} (Spirits' Book, question 642).
  - **Moral progress.** Moral progress follows intellectual progress, but not at once (question 780); its method is daily self-examination (question 919) and doing more good than one has done evil, "the best of all expiations" (question 770).
  - **The strongest objection and its reply.** Texts such as "those who suffer greatly must tell themselves that they have much to expiate" (chapter V, item 10) can feed blaming the sufferer, a tendency Melvin Lerner's experiments on the *belief in a just world* (the need to see the world as fair; from 1966) found in ordinary observers who could not stop a stranger's suffering. Spiritists reply that no one can know whether a given suffering is expiation, trial or mission, and that the doctrine commands help.
  - **Three layers.** Established: what the books say, Lerner's findings as a result about observers. Live debate: how the doctrine works in practice, whether it softens or sharpens blame. Faith: past lives, a just God behind each fate, and chosen trials.

cards:
  - type: mcq
    id: hook
    title: "Guess: help, or let it run?"
    prompt: |
      Guess first; the lesson builds the answer. Rafael, an invented volunteer at a Spiritist centre in Recife, wants to pay for physiotherapy for his neighbour Lúcia, born with a disability. A friend objects: "According to Spiritism her condition may be an expiation of a past life. If you ease it, you interfere with God's justice." According to Kardec's own books, what should Rafael do?
    options:
      - text: "Help: the books say a sufferer's trial is never a reason to stand aside, and the helper may be the very means God provides."
        correct: true
        feedback: |
          Yes. A message printed by Kardec in 1864 calls the friend's idea "a great error". The lesson shows why the doctrine says so, and why critics still worry about it.
      - text: "Stand aside: an expiation must be paid in full, so easing it only postpones it."
        feedback: |
          This is the friend's reading, and Kardec's books reject it in so many words. The tempting step is from "suffering has a cause" to "suffering should be left alone"; the doctrine accepts the first and denies the second.
      - text: "First find out whether her disability is an expiation or a chosen trial, then decide."
        feedback: |
          According to the doctrine no one on earth can find this out: a trial and an expiation look the same from outside. And the duty to help, it says, holds in either case.
      - text: "It makes no difference: helping only counts if Lúcia is a Spiritist."
        feedback: |
          Spiritist charity is owed to everyone, of any creed or none. Its motto was coined against the idea that salvation depends on belonging.
    explanation: |
      The puzzle is real. If suffering is linked to past faults, why fight it? This lesson reads Spiritism as an ethical system: cause and effect, trial and expiation, free will, charity and moral progress, then its strongest objection and the best reply.

  - type: text
    id: recall
    title: "Recall: justice and charity"
    body: |
      Recall from the lesson The Core Principles. **Spiritism** is the doctrine compiled by Allan Kardec (1804-1869) in *Le Livre des Esprits* ("The Spirits' Book", 1857, enlarged 1860), set out as numbered questions answered, he said, by spirits through mediums; quotations here are from Anna Blackwell's English translation. A living person is
      $$\text{body}+\text{perispirit}+\text{spirit}$$
      where the **perispirit** is a semi-material envelope linking the spirit to the body. The spirit lives many human lives and never goes backwards.

      Two ideas from that lesson carry this one. Kardec's comment on question 171 grounds many lives in "the justice of God": people born in conditions bad for their progress get new chances. And the moral law (question 648) has ten laws, of which justice, love and charity "includes all the others"; charity (question 886) is "Benevolence for every one, indulgence for the imperfections of others, forgiveness of injuries."

  - type: text
    id: cause
    title: "Every effect has a cause"
    body: |
      In *The Gospel According to Spiritism* (1864; quoted in the Kimble and Reis translation), chapter V, Kardec sorts afflictions into two kinds. Many have a "current" cause: "How many fail due to their own fault!" Others seem foreign to the sufferer: accidents no foresight could prevent, congenital infirmities, children who die having known only pain. For these he argues "in virtue of the axiom that every effect has a cause" (item 6). Laid out as premises:

      **P1.** These miseries are effects, so they have a cause.<br>
      **P2.** God is just, so the cause is just: one is not punished for evil one has not done.<br>
      **P3.** The cause comes before the effect, and none is found in this life.<br>
      **C.** The cause lies in a previous existence.

      Brazilian Spiritists call this the **law of cause and effect** (*lei de causa e efeito*), the theme of the medium Chico Xavier's book *Ação e Reação* ("Action and Reaction", 1957).

  - type: mcq
    id: cause-premise
    title: "Which premise would a critic reject?"
    prompt: |
      According to Kardec's argument in *The Gospel According to Spiritism* (chapter V, item 6), a child born ill must have a cause for it in a previous life, because (P1) every misery is an effect with a cause, (P2) God is just, so the cause is a deserved one, and (P3) no such cause is found in this life. Which premise does a critic most often reject, and why?
    options:
      - text: "P2: a cause need not be a fault. Genes, a virus or an accident cause illness without anyone deserving it, so 'every effect has a cause' does not give 'every suffering has a moral cause'."
        correct: true
        feedback: |
          Yes. The argument slides from cause in the physical sense to cause in the moral sense. A theist critic adds that the problem of evil has other answers (soul-making in one life, a mystery God has not explained), so P2 in this strong form is not the only option for a believer.
      - text: "P1: some events have no cause at all."
        feedback: |
          Few critics take this route for illness; medicine finds causes for most diseases. The disagreement is about what kind of cause, not about whether there is one.
      - text: "None: the argument is valid, so its conclusion is proved."
        feedback: |
          Validity means the conclusion follows if the premises are true. Whether they are true is a separate question, and P2 carries the weight.
    explanation: |
      Two readings. For a Spiritist, P2 is what God's justice means: an innocent who suffers with no compensation would make God unjust, and many lives remove the scandal. For a critic, P2 assumes that every suffering is deserved, which is the very point at issue. The argument is valid; the debate is over P2, a premise of faith.

  - type: text
    id: three-kinds
    title: "Trial, expiation, mission"
    body: |
      Kardec does not say that every suffering is a punishment. He uses three words. An **expiation** pays for a wrong of the past. A **trial** is a test the spirit takes on in order to advance. A **mission** is a task an already advanced spirit asks for. The Gospel According to Spiritism (chapter V, item 9): "One must not think, however, that every instance of suffering endured on this world is necessarily the indication of a specific wrong." And: "expiation always serves as a trial, but a trial is not always an expiation."

      Who decides? According to the Spirits' Book (question 258), before birth the spirit "chooses for himself the kind of trials which he will undergo, and it is in this freedom of choice that his free-will consists"; only when a spirit is too ignorant or obstinate to see its own good, "God does sometimes impose an existence upon a spirit" (question 262).

  - type: mcq
    id: which-kind
    title: "Reading a stranger's suffering"
    prompt: |
      According to *The Gospel According to Spiritism* (chapter V, item 9), an *expiation* pays for a past wrong, a *trial* is a test chosen to advance, and a *mission* is a task taken on by an advanced spirit; "expiation always serves as a trial, but a trial is not always an expiation." A Spiritist meets a stranger who has lost both parents in a flood. What can she conclude, by the doctrine's own rules, about this suffering?
    options:
      - text: "Nothing about which of the three it is: a trial, an expiation and a mission can look the same from outside."
        correct: true
        feedback: |
          Yes. The doctrine gives a general explanation of suffering but no test for reading a particular case. Item 9 even says that people of noble character often bear the greatest afflictions as missions.
      - text: "It is an expiation, since great suffering means a great past fault."
        feedback: |
          This is the inference item 9 forbids: not every suffering indicates a specific wrong. It is also the reading critics fear, as the objection later in this lesson shows.
      - text: "It is a mission, since good people always suffer more."
        feedback: |
          Missions exist in the doctrine, but nothing lets an onlooker pick that label either. The rule cuts both ways: no blame, and no halo, from outside.
    explanation: |
      The distinction matters ethically. If every suffering were a sign of guilt, the sufferer could be judged; if the kinds cannot be told apart, the only fitting response, Spiritists say, is help.

  - type: text
    id: penal-code
    title: "A penal code for the next life"
    image:
      src: img/ciel-enfer-1865.webp
      alt: "Title page of Le Ciel et l'Enfer ou la justice divine selon le spiritisme by Allan Kardec, Paris, 1865, with a quotation from Ezekiel 33:11 under the author's name."
      caption: "The 1865 title page quotes Ezekiel 33:11, that God does not want the death of the wicked but that he turn from his way and live, the book's case against eternal punishment."
      credit: "Fran6fran6 // Allan Kardec, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Le_Ciel_et_l%27Enfer_Kardec.jpg"
    body: |
      In *Heaven and Hell, or Divine Justice According to Spiritism* (1865; Kimble, Saiz and Reis translation), Kardec set out "The Penal Code of the Future Life" in 33 articles. There is no judge handing out sentences: "Suffering is inherent to imperfection", and each wrong "brings its own punishment in natural and inevitable consequences", as "sickness results from excess" (article 33). Every wrong "entails a debt that must be paid, if not in one existence, then in the next or other future ones", and "A debt that is paid in one existence will not have to be paid a second time" (article 9).

      How is a wrong erased? Article 16 names three conditions: repentance, expiation and reparation. The book closes the code with "To each according to his or her deeds, in heaven as well as on earth".

  - type: order
    id: erase-wrong
    title: "Erasing a wrong"
    prompt: |
      According to article 16 of the penal code of the future life in Kardec's *Heaven and Hell* (1865), a wrong is erased in three steps. Put them in order, from first to last.
    steps:
      - "Repentance: the wrongdoer sees the wrong and regrets it, which awakens hope."
      - "Expiation: the wrongdoer bears the suffering that the wrong brings as its consequence."
      - "Reparation: the wrongdoer does good to undo the harm, which alone annuls the effect."
    hint: |
      Article 16 calls one of them "the first step toward regeneration", and says another is the only one that can "annul the effect and thereby destroy the cause".
    explanation: |
      Article 16: "Even though repentance is the first step toward regeneration, it is not enough by itself; expiation and reparation are still required." Only reparation annuls the wrong; "otherwise, forgiveness would be an act of grace alone". Here the contrast with Christian grace, from the lesson Spiritism, Christianity and Eastern Rebirth, comes back: for many Christians forgiveness as a gift is the point; for Kardec a fair God lets the wrongdoer repair. The Spirits' Book (question 770) puts it in one line: "The best of all expiations is to do a greater amount of good than you have done of evil."

  - type: text
    id: free-will
    title: "Free will, not fatality"
    body: |
      A system of debts could sound like fate. The Spirits' Book insists it is not. Question 843: "Since he has freedom of thought, he has freedom of action. Without free-will man would be a machine." Question 851 allows only one kind of "fatality": the one that "results from the determination of each spirit, on incarnating himself, to undergo such and such trials", and only for physical trials; for moral trials and temptations "a spirit always preserves his freedom of choice between good and evil, and is always able to yield or to resist."

      Kardec's summary (question 872) places free will at two moments: before birth, in choosing the next existence and its kind of trials, and during life, in yielding to or resisting each temptation. "Man is not fatally led into evil; the acts he accomplishes are not written down beforehand". Without free will, he adds, there would be "neither guilt in doing wrong, nor merit in doing right".

  - type: mcq
    id: destiny
    title: "It was my destiny"
    prompt: |
      Jonas, an invented man, grew up in a violent neighbourhood and later robbed a shop. In court he says: "According to Spiritism I chose this life before I was born, so the robbery was my destiny." According to the Spirits' Book (questions 851 and 872), what does the doctrine answer?
    options:
      - text: "He may have chosen surroundings that tempt him to do wrong, but the act itself was not written beforehand: he stayed free to do it or not."
        correct: true
        feedback: |
          Yes. Question 872 says a spirit may choose "an existence in which, through the surroundings amidst which he is placed ... he will be tempted to do wrong; but he always remains free to do or not to do."
      - text: "He is right: once the trial is chosen, every act within it follows."
        feedback: |
          This is the fatalism the book rejects. The fixed part is the setting (physical trials), not the moral choices made inside it.
      - text: "He is right, and so no one should be punished for crimes."
        feedback: |
          The book draws the opposite conclusion: because free will remains, guilt and merit remain. It also gives education the duty "to combat the evil tendencies brought by the spirit into his new existence".
    explanation: |
      Two views of this answer. A Spiritist sees a balance: circumstances are real and shape temptation, yet the person stays responsible. A philosopher may ask whether a choice made before birth and then forgotten is a choice the present person made at all, the same question that the lesson The Core Principles raised about forgotten past lives.

  - type: text
    id: neighbour
    title: "Back to Rafael and Lúcia"
    body: |
      Now the opening puzzle. *The Gospel According to Spiritism* (chapter V, item 27) asks it directly: "Should we put an end to our neighbor's trials if we can, or should we, out of respect for God's designs, let them take their course?" The answer, a message signed "Bernardin, A Protector Spirit (Bordeaux, 1863)", calls the idea that trials must run their course "a great error", and asks: do you know how far a trial must go, or whether "God's providence has chosen you not as an instrument of punishment to intensify the suffering of the guilty, but as the balm of consolation"? So: "when you see one of your brothers or sisters being afflicted, do not say, 'It is God's justice and it must take its course.'"

      The Spirits' Book adds a duty to act. Question 642 asks whether it is enough not to have done evil. "No; it is necessary for each to have done good also, to the utmost limits of his ability; for each of you will have to answer, not only for all the evil he has done, but also for all the good which he has failed to do."

  - type: mcq
    id: omission
    title: "Is it enough to do no harm?"
    prompt: |
      Clara, an invented neighbour, never hurts anyone, but she walks past a fallen elderly man because "his suffering is his own business, and I did nothing to cause it." According to the Spirits' Book (question 642), how does her conduct stand?
    options:
      - text: "She falls short: each person answers also for the good they failed to do, within their power."
        correct: true
        feedback: |
          Yes. The book counts omissions. Article 6 of the penal code in Heaven and Hell says the same: the spirit suffers "not only for the evil it has done but also for the good that it has failed to do."
      - text: "She is blameless, since she caused no harm."
        feedback: |
          That is a common ethic of harm only, and many philosophers defend it for strangers. The Spirits' Book asks more: doing good "to the utmost limits of his ability".
      - text: "She is right, because his fall may be an expiation she should not disturb."
        feedback: |
          This is the friend's error from the opening puzzle, which chapter V, item 27 of the Gospel According to Spiritism rejects.
    explanation: |
      A demanding ethic. Some secular philosophers reach a similar view without spirits: Peter Singer (born 1946), in his 1972 essay "Famine, Affluence, and Morality", argued that walking past a child drowning in a shallow pond to save one's clothes is wrong, and that distance does not change the duty. Others hold that duties to help strangers are real but limited. Spiritism sides with the demanding view and gives it a motive in the spirit's own progress.

  - type: text
    id: charity-motto
    title: "Without charity there is no salvation"
    image:
      src: img/good-samaritan-watts.webp
      alt: "Painting of a man in a pale tunic holding up a wounded, half-clothed traveller on a rocky road, with a donkey at the right edge."
      caption: "In the parable of the Good Samaritan (Luke 10) the one who helps is a Samaritan, an outsider to the listeners' faith, which is why Kardec opens his chapter on charity with it."
      credit: "George Frederic Watts, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Good_Samaritan_(Watts).jpg"
    body: |
      Chapter XV of the Gospel According to Spiritism carries the motto **"Without charity there is no salvation"**. It opens with the Good Samaritan, and Kardec notes that Jesus puts the Samaritan, "regarded as a heretic, but who showed love toward his neighbor", above "orthodoxy that lacks charity". The translators point out that the motto plays on the old formula *extra ecclesiam nulla salus*, "outside the Church there is no salvation".

      Kardec draws the contrast himself (item 8): the Church formula "is based ... upon the special faith in particular dogmas; it is exclusive and absolute", while charity "is consecrated to the principle of equality before God and freedom of conscience". With it, "whatever may be the way in which they worship the Creator", people "hold out their hands to one another".

  - type: mcq
    id: motto-readings
    title: "Two readings of one motto"
    prompt: |
      According to Kardec's *The Gospel According to Spiritism* (chapter XV), "Without charity there is no salvation" replaces "outside the Church there is no salvation", which he calls exclusive. Which reply would a Catholic theologian today most likely give, according to the Catechism of the Catholic Church?
    options:
      - text: "The formula is not aimed at those who, through no fault of their own, do not know Christ or the Church and seek God sincerely: they too may be saved (Catechism 847). So the Church is less exclusive than Kardec says, though it still holds salvation comes through Christ."
        correct: true
        feedback: |
          Yes. Paragraph 846 restates the formula positively, and 847 opens salvation to the sincere who do not know the Church. The disagreement remains on what saves: Christ through the Church, or one's own charity.
      - text: "The Church agrees with Kardec that salvation depends on charity alone, apart from Christ."
        feedback: |
          The Catechism says all salvation comes from Christ through the Church (846). It values charity highly, but not as a replacement for Christ.
      - text: "The Church says that only baptized Catholics can be saved, without exception."
        feedback: |
          That strict reading is not today's Catholic teaching: paragraph 847 makes room for those who do not know the Church through no fault of their own.
    explanation: |
      The motto made Spiritism open in principle to every creed, which partly explains its reach in a Catholic country such as Brazil. Both sides now speak of salvation beyond church walls; they part ways on its source, a layer-3 question.

  - type: text
    id: progress
    title: "Moral progress, one evening at a time"
    body: |
      The goal of the whole system is progress. The Spirits' Book (question 779) says humans advance "of himself, naturally", but not all at the same rate, so "the most advanced are made to help forward the others". Moral progress follows intellectual progress, though "not always ... immediately" (question 780): intelligence lets one understand good and evil and so choose, and "the development of free-will follows the development of the intelligence and increases the responsibility". Why then are clever nations sometimes cruel? Because "Moral sense and intellect are two forces which only arrive at equilibrium in the long run."

      The method is practical. Question 919 asks how to improve oneself; the answer, signed Saint Augustine, quotes "Know thyself" and advises: "At the close of each day I examined my conscience", asking what one did against God, one's neighbour and oneself.

  - type: mcq
    id: clever-cruel
    title: "Clever but cruel?"
    prompt: |
      According to the Spirits' Book (question 780), moral progress is a consequence of intellectual progress. A reader objects: "Then a scientifically advanced society should be morally better, yet history shows advanced nations committing great crimes." What is the book's answer?
    options:
      - text: "Moral progress follows intellectual progress only in the long run; until the moral sense develops, intelligence can serve evil."
        correct: true
        feedback: |
          Yes: the two forces "only arrive at equilibrium in the long run". Knowledge enlarges the power to choose and the responsibility, not the goodness of the choice.
      - text: "Intellectual progress produces moral progress at once, so those nations were not advanced."
        feedback: |
          The book says the opposite: moral progress "does not always follow it immediately".
      - text: "Intelligence and morality are unrelated."
        feedback: |
          The book links them: intelligence is what lets one understand and choose between good and evil. The link is real but slow.
    explanation: |
      A critic can grant the observation and doubt the promise: whether humanity is morally improving over centuries is a live debate among historians and psychologists. The Spiritist claim that each spirit improves over many lives is a faith commitment that no history of nations could settle.

  - type: text
    id: steelman
    title: "The case for the system"
    body: |
      Put together, the ethics has a clear shape, and its defenders find in it four goods. **Justice**: no one is born favoured or doomed, because all start equal and each fate has a reason. **Freedom**: the spirit chooses its trials and every act, so merit and guilt are real. **Hope**: there is no eternal hell; according to Heaven and Hell, every spirit, however low, can rise. **A motive for charity**: helping others is the main road of one's own progress, owed to everyone, of any creed.

      Many Spiritists say this answers the question that troubles believers in one life: why would a good God let one child be born ill and another healthy? For them it explains suffering without making it meaningless, and turns it into work.

  - type: text
    id: objection
    title: "The strongest objection: blaming the sufferer"
    body: |
      The strongest objection is moral. Item 10 of chapter V, after the passage on trials, says: "those who suffer greatly must tell themselves that they have much to expiate". Critics worry that once suffering is linked to past faults, people may treat the sick, the poor or the disabled as getting what they earned.

      Psychology gives the worry weight. Melvin Lerner (born 1929), an American social psychologist, ran an experiment with C. H. Simmons (1966) in which women students watched a peer apparently receive painful electric shocks. When they could not stop it and expected it to go on, they tended to devalue her. Lerner's book *The Belief in a Just World: A Fundamental Delusion* (1980) argues that people need to believe the world is fair, and protect the belief by blaming victims. Later studies found the effect less consistent than the first ones.

  - type: mcq
    id: lerner-read
    title: "What does the experiment show?"
    prompt: |
      According to the experiments of Melvin Lerner and C. H. Simmons (1966), observers who could not stop a peer's apparent suffering tended to devalue her. What does this finding show about Spiritism's law of cause and effect?
    options:
      - text: "Nothing about whether it is true, but something about its risk: a doctrine that links suffering to the past can lend words to a tendency observers already have."
        correct: true
        feedback: |
          Yes. The study is about how observers react, not about past lives. It shows why the warning in chapter V, item 27 is needed, not whether the doctrine is false.
      - text: "That the law of cause and effect is false."
        feedback: |
          The subjects were not Spiritists and the study tested no claim about rebirth. A psychological bias around a belief does not settle the belief's truth; that would be the genetic fallacy.
      - text: "That Spiritists blame victims more than other people."
        feedback: |
          The study did not compare religious groups. Whether Spiritists in fact blame more, or help more, is an empirical question this result does not answer.
    explanation: |
      Two readings. A critic says the doctrine gives the just-world bias a theology, and that a sufferer told "you have much to expiate" is wounded twice. A Spiritist replies that the doctrine names the bias and forbids acting on it, and that its believers run free clinics, schools and food services, as the lesson Spiritism in Brazil described.

  - type: mcq
    id: best-reply
    title: "The best reply"
    prompt: |
      A critic says: "According to Kardec's law of cause and effect, a child born disabled is paying for a past life, so the doctrine blames the child." Which Spiritist reply, drawn from *The Gospel According to Spiritism*, answers the objection most directly?
    options:
      - text: "Not every suffering marks a wrong: it may be a chosen trial or a mission, no one can tell which (chapter V, item 9), and in every case the duty is to help, never to judge (item 27)."
        correct: true
        feedback: |
          Yes. This reply attacks the step from the doctrine to blame. A critic answers that the expiation reading remains open and is printed in the same chapter (item 10); the reply removes the right to judge, not the idea of debt.
      - text: "The child chose its life before birth, so it has no complaint."
        feedback: |
          This reply grants the objection's worst version: it puts the responsibility on the child. It also leans on a forgotten choice, which the critic will say no one can check or consent to.
      - text: "Suffering does not matter, since the spirit is immortal."
        feedback: |
          Spiritism does not teach this: suffering is real, and the doctrine's whole ethic is to relieve it. Dismissing pain would make the objection stronger, not weaker.
    explanation: |
      The exchange leaves a clear point of disagreement. Spiritists hold that a cause in the past is compatible with full compassion now, as a doctor can know a disease's cause and still treat it. Critics hold that any story of deserved suffering shifts attention from present causes (genes, poverty, injustice) that can be changed.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    multiple: true
    prompt: |
      Which of these statements are **established fact** (texts, history, published findings), as opposed to live debate or faith commitment? Select all that apply.
    options:
      - text: "The Gospel According to Spiritism says that a trial is not always an expiation."
        correct: true
        feedback: |
          Fact about the text: chapter V, item 9. Whether trials and expiations exist is the faith question.
      - text: "Kardec's Heaven and Hell (1865) sets out a penal code of the future life in 33 articles."
        correct: true
        feedback: |
          Fact: part 1, chapter VII of the book.
      - text: "In Lerner and Simmons's 1966 experiment, observers unable to stop a peer's suffering tended to devalue her."
        correct: true
        feedback: |
          Fact about a published result; how well it generalizes, given later mixed findings, is a live debate.
      - text: "In practice, Spiritism makes its followers kinder to the suffering."
        feedback: |
          Live debate: the charitable works are documented, but whether the doctrine causes more help or more blame than other beliefs has not been settled by comparative studies.
      - text: "A child born ill is working out the consequences of a previous life."
        feedback: |
          Faith commitment: it rests on past lives and on God's justice behind each fate, which no document or experiment shown here can settle.
    explanation: |
      Where thoughtful people part ways: on P2 of the cause argument (is every suffering deserved, or only caused?), on whether a forgotten pre-birth choice is a real choice, and on whether explaining suffering by the past helps or harms the sufferer in practice. The first two are questions of faith and philosophy; the last could be studied.

