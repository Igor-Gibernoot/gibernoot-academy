id: ch20-method
title: "The Mediumistic Method and Its Controls"
kind: concept
own: |
  The setting: *Spiritism*, the doctrine of Allan Kardec (1804-1869), was collected from answers that *mediums* (people said to receive messages from the dead) gave in the name of spirits. Here $n$ is a number of mediums who give the same answer, and $q$ is the chance that one medium would give that answer without any real source behind it (by guessing, say).
  - **The universal control.** According to Kardec (*Revue Spirite*, April 1864), reason comes first and filters every message, and the best guarantee of a teaching is {{ agreement among spontaneous messages received by mediums who are strangers to one another, in several regions }}. Agreement inside one circle is not enough, he warned, because its mediums may share the same influence.
  - **Kardec's own cautions.** According to the Mediums' Book (1861), the medium's own spirit is never fully passive and may bend answers toward its own ideas; spirits can borrow famous names, so a spirit is judged by its language; contradictions come from both people and spirits.
  - **Agreement counts only with independence.** If $n$ mediums are independent, each agreeing answer multiplies the odds of a real source by $1/q$, so the likelihood ratio (how much likelier the evidence is with a real source than without) is
    {{ $$\text{LR}=\frac{1}{q^{\,n}}$$ }}
    Five independent guessers with four possible answers all agree with chance $4\cdot(1/4)^5=1/256$. But if all five follow one shared source that gives answer A with chance $0.9$ each,
    $$0.9^5\approx0.59,$$
    so agreement is likely anyway: {{ mediums who share a source count as one witness }}, and chance is the weakest rival, not the one to beat.
  - **Controls from science.** Each removes one rival explanation: {{ blinding }} (the person tested or judging does not know which answer is expected: the 1784 commission on animal magnetism with Benjamin Franklin, the physicist Michael Faraday's table-turning indicator in 1853, which showed the sitters' own hands pushed the table), randomisation (chance, not the experimenter, picks the condition: Peirce and Jastrow, 1884), predictions and scoring rules written in advance (preregistration; Registered Reports, 2013), and counting misses as well as hits (Rosenthal's "file drawer problem", 1979).
  - **Where people part ways.** Spiritists reply, with Kardec, that spirits are free beings "not subject to our commands", so a failed test on demand proves little. Critics answer that astronomy and geology cannot repeat events either, yet blind and count; and that a reply which explains every failure makes the claim untestable. Layers: what Kardec wrote and what the tests found is fact; how well the universal control works as a check is debate; that the messages come from spirits is faith.

cards:
  - type: mcq
    id: hook
    title: "Guess: five mediums, one answer"
    prompt: |
      Before any theory, guess. Five mediums in five cities are asked the same question about life after death, and all five give the same unusual answer. A believer says: spirits told them. A sceptic says: coincidence. Which single piece of information would most change how much the agreement should count?
    options:
      - text: "Whether the five could have drawn on a shared source: the same books, the same circle, the same wording of the question."
        correct: true
        feedback: |
          Yes. If they shared a source, the agreement is what we would expect with or without spirits. If they truly could not have, coincidence becomes a poor explanation and the agreement starts to count. This lesson builds that idea with numbers.
      - text: "Whether the mediums are sincere people."
        feedback: |
          Sincerity matters, but sincere people who read the same book give the same answer honestly. Sincerity rules out fraud, not a shared source.
      - text: "Whether the answer is comforting."
        feedback: |
          Whether an answer comforts us says nothing about where it came from. It may explain why people accept it, which is a different question.
      - text: "Nothing more is needed: five out of five settles it."
        feedback: |
          Five out of five is striking only if the five are independent. Five copies of one newspaper also agree five out of five.
    explanation: |
      Agreement is evidence in proportion to the independence of those who agree. Both a Spiritist and a sceptic can accept this; they part ways over how independent the mediums really were.

  - type: text
    id: control
    title: "Recall: the universal control"
    body: |
      Recall: **Spiritism** is the doctrine compiled by Hippolyte Léon Denizard Rivail (1804-1869) under the name **Allan Kardec**, from answers that **mediums** (people said to receive messages from the dead) gave in the name of **spirits** (the surviving minds of the dead, according to the doctrine). How could he tell a true message from a false one?

      His answer was the **universal control of the teaching of the spirits**, set out in the *Revue Spirite* of April 1864 (quoted in the English Kardecpedia translation). "The first control is undoubtedly that of reason", to which every message is submitted. Beyond reason, "The only serious guarantee that there exist is in the agreement between spontaneous revelations made through mediums" who are "strange to one another and in several regions".

      Kardec saw the weak point himself. Agreement among several mediums of the same centre, he wrote, "is not enough because they may be suffering the same influence".

  - type: mcq
    id: same-centre
    title: "Why strangers in several regions?"
    prompt: |
      According to Allan Kardec's universal control (Revue Spirite, April 1864), agreement among the mediums of a single Spiritist centre is not enough; he wanted agreement among mediums who are strangers to one another, in several regions. Why?
    options:
      - text: "Mediums of one centre may share one influence, so their agreement could come from that shared influence rather than from many separate sources."
        correct: true
        feedback: |
          Yes. Kardec thought of the influence as a deceiving spirit at work in one circle; a sceptic thinks of shared books, shared hopes and leading questions. Either way the logic is the same: shared influence makes agreement cheap.
      - text: "Mediums in distant regions are more gifted."
        feedback: |
          Kardec claimed nothing about distance and talent. The point of distance is that it makes contact, and so a shared influence, less likely.
      - text: "Because one centre has too few mediums to agree."
        feedback: |
          A centre can have many mediums. Numbers are not the issue; independence is. Ten mediums who copy one another count less than three who cannot.
    explanation: |
      This is the same idea a court uses with witnesses kept apart, or science with independent laboratories. Kardec's criterion and the sceptic's worry start from the same principle; the debate is whether his mediums met it.

  - type: text
    id: cautions
    title: "Kardec's own cautions"
    body: |
      Kardec did not treat mediums as clear windows. His *Mediums' Book* (1861), quoted here in the English Kardecpedia translation, lists ways a message can go wrong.

      **The medium's own mind.** In the chapter on the role of the medium, the medium's spirit is "never absolutely null": it is always the intermediary, and if not in sympathy with the communicating spirit "he may alter their answers, and assimilate them to his own ideas and inclinations". In the next chapter, on the medium's moral influence, a medium's character is said to draw good or bad spirits.

      **Who is speaking?** On the identity of spirits, Kardec admits that "spirits do not bring us letters of introduction" and that some "take borrowed names". His test is content: "Spirits, like men, are judged by their language"; a spirit that signs a great name and talks trivialities is not that person.

      **Contradictions.** Messages do contradict each other, and these "proceed from two sources, men and spirits": the people involved, and spirits of uneven knowledge and goodness.

  - type: mcq
    id: signed
    title: "A famous signature"
    prompt: |
      A message received through a medium is signed with the name of a famous philosopher, but its content is shallow and full of errors. According to Allan Kardec's Mediums' Book, what should a Spiritist conclude?
    options:
      - text: "That it is very probably not that philosopher: spirits are judged by their language, and some borrow names."
        correct: true
        feedback: |
          Yes. A sceptic agrees with the test and adds a rival: a medium's own mind can produce a famous name too, and judging by content cannot separate a borrowing spirit from a borrowing medium. A Spiritist replies that the test was never meant to separate those, only to stop false authority.
      - text: "That it is the philosopher, because the signature says so."
        feedback: |
          Kardec rejected this outright: spirits bring no letters of introduction, and a name alone proves nothing.
      - text: "That mediumship as a whole is false."
        feedback: |
          Kardec expected bad messages and built his cautions around them. One bad message refutes that message, not the whole practice; a critic needs a test of the good messages too.
    explanation: |
      Kardec's tests are reason and agreement. They filter content. What they do not do, a critic notes, is separate the hypothesis "a spirit wrote this" from "the medium's own mind wrote this", since both can write well or badly.

  - type: text
    id: rivals
    title: "Chance is the weakest rival"
    body: |
      Recall the toy count from the lesson Kardec and the Birth of Spiritism: five independent mediums each pick one of 4 answers at random. The first picks anything; each of the other four matches with chance $\tfrac14$, so all five agree with probability

      $$\left(\tfrac14\right)^4=\tfrac1{256}\approx0.39\%.$$

      Agreement beats chance easily. But chance is not the only rival to spirits. Others predict agreement too: the mediums read the same books (Kardec's own books and journal were read by Spiritists in many places), the questions were worded to suggest an answer, or the person collecting the answers kept the ones that agreed and set the others aside. A good test compares spirits with the **strongest** rival, not the weakest.

  - type: numeric
    id: shared
    title: "Agreement from a shared book"
    prompt: |
      An invented case. Five mediums, who have never met, have all read one popular book that gives answer A to a question. Suppose each of them, asked the question, gives answer A with probability $0.9$, independently of the others (the book shapes each one separately). What is the probability, in percent, that all five give answer A?
    answer: 59.049
    tolerance: 0.2
    answerText: '59 ($0.9^5\approx0.59$)'
    wrong:
      - { value: 0.390625, feedback: "That is the pure-chance figure $1/256$. Here each medium follows the book with probability $0.9$, not $\\tfrac14$." }
      - { value: 90, feedback: "That is the chance for one medium. All five must give A: multiply five factors of $0.9$." }
      - { value: 45, feedback: "Probabilities of independent events multiply, they do not average: $0.9\\times0.9\\times0.9\\times0.9\\times0.9$." }
    hint: "Multiply the chance for each of the five mediums."
    explanation: |
      Each of the five gives A with probability $0.9$, so

      $$0.9^5\approx0.59=59\%.$$

      With a shared source, unanimous agreement happens more often than not, and no spirit is needed for it. Against pure chance the same agreement looked like a 1-in-256 event. The number that matters is how much likelier agreement is with spirits than with the best rival, and with a shared source that ratio is close to 1.

  - type: widget
    id: odds
    title: "Independent mediums, or one source?"
    widget: odds-updater
    config:
      witnesses: true
      prior: 1.0e-3
      n: 1
      q: 0.25
      nMax: 10
      qMin: -3
      qMax: -0.3
      axisMin: -4
      axisMax: 6
      labels:
        n: "Independent mediums, n"
        q: "Match chance, no source, q"
      presets:
        - { label: "One medium", n: 1, q: 0.25 }
        - { label: "Five independent mediums", n: 5, q: 0.25 }
        - { label: "Five who share one source", n: 1, q: 0.25 }
    body: |
      The hypothesis is that the agreed answer comes from a real source beyond the mediums (for a Spiritist, the spirits). The prior, a toy probability of $10^{-3}$ for someone doubtful, is an illustration, not a measurement. Let $q$ be the chance that one medium gives the agreed answer with no real source behind it. Each **independent** medium who agrees multiplies the odds by $1/q$; with $q=\tfrac14$ (four possible answers) that is a factor $4$. The bar shows the log of the odds: blue the prior, orange what the agreement adds, purple the result; the dashed line is even odds (50%).

      Press "Five independent mediums", then "Five who share one source": mediums who follow one shared book or circle are, as evidence, one medium. Then lower $q$ and watch how fast the odds climb.
    review: false

  - type: mcq
    id: independence
    multiple: true
    title: "What does independence require?"
    prompt: |
      Five mediums agree on an answer. For their agreement to count as five independent pieces of evidence (odds multiplied by $1/q$ five times, where $q$ is the chance one medium matches without a real source), which conditions are needed? Select all that apply.
    options:
      - text: "None of them has seen the answer in a book, a journal or another medium's message."
        correct: true
        feedback: |
          Yes. A shared text is the most common shared source.
      - text: "The question reaches each of them in a form that does not suggest the answer."
        correct: true
        feedback: |
          Yes. A leading question is a shared source hidden in the wording.
      - text: "Whoever collects the answers keeps every reply, not only the ones that agree."
        correct: true
        feedback: |
          Yes. If disagreeing replies are set aside, "five agree" may really be "five of fifty agree".
      - text: "They live in different countries."
        feedback: |
          Distance helps but does not guarantee independence: the Spirits' Book was soon read in translation far from Paris, so mediums in different countries could share it. What counts is what each medium had access to, not where they lived.
      - text: "All five are sincere."
        feedback: |
          Sincere mediums who read the same book agree sincerely. Sincerity removes fraud, not a shared source.
    explanation: |
      Independence is about information: no shared text, no suggestive wording, no selection after the fact. Kardec's "strangers to one another, in several regions" aimed at the first; the second and third need the controls that come next.

  - type: text
    id: blinding
    title: "Blinding: a commission in 1784"
    image:
      src: img/franklin-duplessis.webp
      alt: "Oil portrait of Benjamin Franklin in old age, with grey hair, in a dark coat against a plain background."
      caption: "Benjamin Franklin around 1785, painted by Joseph-Siffred Duplessis; the year before, the commission he chaired tested animal magnetism with blindfolds."
      credit: "Joseph-Siffred Duplessis, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Joseph_Siffrein_Duplessis_-_Benjamin_Franklin_-_Google_Art_Project.jpg"
    body: |
      Science met the problem of hidden influence long before Kardec. In 1784 the French king appointed a commission, chaired by the American scientist and diplomat **Benjamin Franklin** (1706-1790) and including the chemist Antoine Lavoisier (1743-1794), to test **animal magnetism**, an invisible fluid that the physician Franz Anton Mesmer (1734-1815) and his followers said they could pass into patients to heal them.

      The key move was **blinding**: the person tested does not know when the treatment is given. A blindfolded patient told she was being magnetised, when no one was magnetising her, fell into the usual crisis. In Franklin's garden at Passy, a boy who hugged trees one after another collapsed at a tree that had not been magnetised. The commission concluded that imagination, not a fluid, produced the effects.

  - type: mcq
    id: tree
    title: "What did the tree show?"
    prompt: |
      In the 1784 commission's test at Passy, a mesmerist magnetised one tree; a boy, not told which, hugged several trees and fell into a crisis at a tree that had not been magnetised. What does this result support most directly?
    options:
      - text: "The crisis followed what the boy expected, not whether the tree was magnetised."
        correct: true
        feedback: |
          Yes. Because the boy did not know which tree was treated, his expectation and the treatment were separated, and only expectation matched the crisis. A mesmerist of the time could reply that the trees nearby had picked up some fluid; the commissioners judged that the tests, taken together, left no role for the fluid.
      - text: "The boy was faking."
        feedback: |
          The test needs no fraud. Imagination can produce a real crisis in an honest person, which is exactly what the commission concluded.
      - text: "Animal magnetism works, but only on trees."
        feedback: |
          The crisis came at an untreated tree, so the result tells against the fluid, not for it.
    explanation: |
      Blinding separates two causes that usually come together: the treatment and the belief that one is treated. Layer 1: what the commission did and found. Layer 2: how far one 1784 test reaches.

  - type: text
    id: faraday
    title: "Faraday shows the hidden push"
    image:
      src: img/faraday-indicator.webp
      alt: "Engraving of four hands resting on two thin boards laid on a table, with a long upright straw and a pointer sticking out between the boards."
      caption: "Faraday's indicator: hands rest on a top board that can slide over the lower one, and a pointer swings if the hands push sideways before the table moves."
      credit: "Michael Faraday (Illustrated London News, 16 July 1853), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Faraday_apparatus_for_ideomotor_effect_on_table_turning.png"
    body: |
      Recall that in 1853 the physicist **Michael Faraday** (1791-1867) tested **table-turning**, in which sitters rest their hands on a table that then moves. His indicator, in the picture, showed whether the hands pushed the table or the table dragged the hands. It showed the hands pushed first.

      Then he added a control. In his letter to *The Times* (dated 28 June, printed 30 June 1853) he reported that "when the parties saw the index it remained very steady"; when it was hidden from them, or they looked away, it wavered, though they believed they pressed only downwards. He put the effect down to a "*quasi* involuntary muscular action". Making the hidden push visible to the sitters removed it.

  - type: text
    id: random-advance
    title: "Randomise, write it down, count the misses"
    body: |
      Three more controls answer the other rivals.

      **Randomisation**: chance, not the experimenter, picks the condition, so the experimenter's habits cannot leak into the answer. In 1884 the philosopher Charles Sanders Peirce (1839-1914) and the psychologist Joseph Jastrow (1863-1944) tested how small a change in weight a person can feel; the colour of the next card in a shuffled pack decided which change was made, and a screen hid the operator from the subject.

      **Written in advance**: the prediction and the scoring rule are fixed before the data come in, so no one can decide afterwards what counts as a hit. Today this is called *preregistration*; since 2013, journals offering *Registered Reports* (first at *Cortex*) accept a study's plan before the results exist.

      **Count the misses**: every trial is reported, not only the hits. The psychologist Robert Rosenthal (1933-2024) named the danger in 1979 the "file drawer problem": if failed studies stay in a drawer, the published ones look stronger than the evidence is.

  - type: mcq
    id: which-control
    title: "Matching a control to a worry"
    prompt: |
      A study collects messages from many mediums. A critic worries: "the organiser read all the replies and then published the twelve that agreed." Which control answers this worry most directly?
    options:
      - text: "Fix in advance which replies will be collected and how agreement will be scored, and report every reply, hits and misses."
        correct: true
        feedback: |
          Yes. Writing the rule first and counting the misses removes selection after the fact. A Spiritist can welcome this: if the agreement is real, it survives a full count.
      - text: "Blindfold the mediums."
        feedback: |
          Blinding answers a different worry, that the person tested knows the expected answer. Here the problem is the organiser's choice after the fact.
      - text: "Use more famous mediums."
        feedback: |
          Fame does not change what the organiser kept or dropped. The worry is about selection, not about who the mediums are.
    explanation: |
      Each control removes one rival: blinding removes expectation, randomisation removes the experimenter's choices, written rules remove shifting standards, counting misses removes selection.

  - type: order
    id: design
    title: "Design a fair test of agreement"
    prompt: |
      Put in order the steps of a fair test of Allan Kardec's idea that independent mediums agree on true answers.
    steps:
      - "Write down the question, the possible answers and the rule for scoring agreement, before any session."
      - "Choose mediums who have no contact with each other and no access to a published answer."
      - "Let chance pick which question each medium receives, and keep the expected answer from everyone in the room."
      - "Collect every reply, with judges who do not know which medium gave which."
      - "Compare the rate of agreement with what the strongest rival (shared culture, chance) predicts."
    hint: "Rules come first; then who takes part; then the session; then the record; the comparison comes last."
    explanation: |
      The order matters: a rule fixed after seeing the data is not a test. This is Kardec's universal control with the controls of science added, and a Spiritist and a critic can agree on it before they know the result. A later guided proof in this level designs such a test in detail.

  - type: mcq
    id: trap-unanimous
    title: "Trap: unanimous, so proven"
    prompt: |
      A speaker says: "Every medium we asked gave the same answer. The agreement was unanimous, so the answer is proven to come from the spirits." What is the main flaw?
    options:
      - text: "Unanimity shows the answer is not chance, but not that it came from spirits rather than a shared source, and \"every medium we asked\" may hide who was not asked or what was dropped."
        correct: true
        feedback: |
          Yes. Unanimous agreement fits spirits and fits a shared source; it favours spirits only to the extent the rivals are ruled out. Kardec himself said agreement inside one circle proves little.
      - text: "Mediums never agree, so the claim must be false."
        feedback: |
          Mediums can and do agree; that is a fact the speaker may have right. The question is what the agreement shows.
      - text: "Nothing: unanimous agreement is the strongest evidence there is."
        feedback: |
          Unanimity is strong only among independent sources. Five copies of one newspaper are unanimous too.
    explanation: |
      Recall the odds rule from the lesson Evidence as Updating Belief: evidence counts by how much likelier it is under one hypothesis than under its rival. With a shared source, unanimity is likely under both.

  - type: text
    id: steelman
    title: "The Spiritist reply"
    body: |
      A Spiritist has a serious answer to all this, and Kardec gave it himself. In the Mediums' Book's chapter on how to proceed, he contrasts two kinds of study. In the natural sciences "we operate on brute matter, manipulating it at will"; in Spiritism "we have to deal with intelligences who have their liberty", who show that "they are not subject to our commands". The phenomena, "being independent of our will, may fail to be manifested when they are wanted".

      On this view a laboratory test that fails says little: a spirit is a person, not a chemical, and a person may decline to perform under suspicion. The right method is patient observation over time, with reason and wide agreement as checks, which is what the universal control was. Defenders add that Kardec's demand for agreement among strangers was itself an early control, unusual among the mediums of his day.

  - type: mcq
    id: critic
    title: "A critic's answer"
    prompt: |
      Spiritists, following Allan Kardec, say spirits are free beings not subject to our commands, so phenomena may fail to appear in a controlled test. Which reply would a careful critic give?
    options:
      - text: "Many sciences study events they cannot produce on demand (astronomy, geology) and still use controls; and blinding and counting misses ask nothing extra of a spirit beyond an ordinary sitting."
        correct: true
        feedback: |
          Yes. That is the critic's strongest reply. A Spiritist can answer that suspicion itself changes the sitting; the critic's rejoinder is that if every failure can be blamed on the test, no result could ever count against the claim, the worry from the lesson Popper and the Black Swan.
      - text: "Spirits do not exist, so the reply is false."
        feedback: |
          That assumes the conclusion. The reply is a claim about method, and has to be answered on method.
      - text: "Kardec's method used no checks at all."
        feedback: |
          Unfair: Kardec used reason and agreement among strangers as checks, and warned about the medium's mind and borrowed names. The critic's point is that these checks leave rivals open, not that there were none.
    explanation: |
      Where the two part ways: whether the claim should be held to the same controls as a claim about matter, given that its subject is said to have a will. The critic says controls cost a willing spirit nothing; the Spiritist says the conditions of a test are not neutral for a person.

  - type: mcq
    id: layers
    multiple: true
    title: "Sorting the claims"
    prompt: |
      Which of these statements are *established fact* (layer 1), true whatever one believes about spirits? Select all that apply.
    options:
      - text: "Allan Kardec wrote that agreement among mediums of one centre is not enough, because they may share the same influence."
        correct: true
        feedback: |
          Yes: what Kardec wrote is a fact about his text (Revue Spirite, April 1864).
      - text: "In Faraday's 1853 test, the indicator stayed steady when the sitters could see it."
        correct: true
        feedback: |
          Yes: Faraday reported it in his letter to The Times. How far it carries to other mediumship is layer 2.
      - text: "The universal control is an adequate test of whether messages come from spirits."
        feedback: |
          That is a live debate (layer 2): Spiritists defend it as the right method for free beings, critics say it leaves shared sources open.
      - text: "The agreeing messages Kardec collected came from the spirits of the dead."
        feedback: |
          That is a faith commitment of Spiritism (layer 3), the very thing a test would try to probe.
    explanation: |
      Layer 1: what Kardec, Faraday and the 1784 commission wrote and found. Layer 2: how well agreement and the controls work as tests of mediumship. Layer 3: that spirits exist and speak through mediums.

  - type: text
    id: summary
    body: |
      **Next:** Spiritism in Brazil: how Kardec's doctrine took root in Brazil, with the medium Chico Xavier, charity work and Spiritist hospitals.
