outroTitle: Spiritism in one picture
outro: |
  The doctrine grew out of the séance craze that began with the Fox raps and the turning tables, which Faraday traced to the sitters' own hands. Kardec compiled it in five works from 1857 to 1868 and gave it a check of his own, the universal control. Its principles (a spirit with a perispirit, many human lives, never backwards) lead to an ethics of trials and expiations and invite a comparison with Christian, Hindu and Buddhist teachings. Its check, made exact as $\text{LR}=1/q^{n}$ for independent witnesses, is the tool for weighing rebirth cases and for designing fair tests of mediums, where a failed short test is weak evidence and even a pass does not name its source. In Brazil the doctrine became a religion of charity with millions of adherents. The three layers keep fact, debate and faith apart in every box.

  **Next:** the Level Review brings back the level's questions, and the Level Challenge, Weighing the Doctrine, asks you to lay out what Spiritism claims, what could test it, and what a fair critic and a fair adherent would each say.
