id: ch20-map
title: "Content Map: Spiritism"
kind: map
name: Level 20, Spiritism (Kardec's doctrine, its origins and principles, its method and how to test mediums, rebirth cases, Brazil, the comparison with Christian, Hindu and Buddhist teachings, and its ethics)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the level on Spiritism, the doctrine Allan Kardec (1804-1869) compiled from answers he said came from spirits of the dead through *mediums* (people said to receive their messages), from memory, one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (two movements merged, a number turned upside down, a failed test read as a disproof), and every wrong pick comes with a reason.

  Everything is taught according to Kardec's books, the Spiritist movement, its critics and the historians who study it; whether the spirits are real is left to each reader. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: origins
    title: Before Kardec, rapping and turning tables
    row: 1
    col: 1
    body: |
      Modern **Spiritualism**, the broad movement of séances and messages from the dead, is usually dated to the **raps heard by the Fox family at Hydesville, New York, in 1848** (one sister confessed a hoax in 1888 and retracted in 1889). **Table-turning** reached Europe in 1852-1853. The physicist **Michael Faraday** tested it in 1853 with an indicator the sitters could watch, and concluded that **their own unconscious muscle movements moved the table**. *Spiritism* is the separate name Kardec gave his own doctrine, which **includes reincarnation**.
    decoys:
      - body: |
          Modern **Spiritualism**, the broad movement of séances and messages from the dead, is usually dated to the **raps heard by the Fox family at Hydesville, New York, in 1848** (one sister confessed a hoax in 1888 and retracted in 1889). **Table-turning** reached Europe in 1852-1853. The physicist **Michael Faraday** tested it in 1853 with an indicator the sitters could watch, and concluded that **their own unconscious muscle movements moved the table**. *Spiritism* is **just the French word for the same movement**, which **took over the Fox sisters' doctrine**.
        feedback: |
          The two share mediums and séances, but not a doctrine. The Fox family left no doctrine to translate; Kardec put his own questions to Paris mediums after the European table-turning craze, and his *Spiritism* teaches reincarnation, which the word Spiritualism does not name.
      - body: |
          Modern **Spiritualism**, the broad movement of séances and messages from the dead, is usually dated to the **raps heard by the Fox family at Hydesville, New York, in 1848** (one sister confessed a hoax in 1888 and retracted in 1889). **Table-turning** reached Europe in 1852-1853. The physicist **Michael Faraday** tested it in 1853 with an indicator the sitters could watch, and concluded that **an unknown physical force, perhaps electricity, moved the table**. *Spiritism* is the separate name Kardec gave his own doctrine, which **includes reincarnation**.
        feedback: |
          Faraday ruled out electricity, magnetism and any unknown force. When the sitters could see the indicator showing their own sideways push, the table stopped turning: the force came from their hands, without their knowing it.
    explanation: |
      The setting the doctrine grew from, and the first test of it. Faraday's indicator is an early case of a control that keeps returning in the level: let the people tested see, or not see, what is expected.

  - id: kardec
    title: Spiritism (Kardec, 1857)
    row: 1
    col: 2
    body: |
      **Hippolyte Léon Denizard Rivail** (1804-1869), a Lyon-born educator who studied under Pestalozzi, published as **Allan Kardec**. According to his own account, he put questions to spirits through mediums, compared the answers and kept what agreed. His **five basic works** are *The Spirits' Book* (**1857**, 501 questions; 1019 in **1860**), *The Mediums' Book* (1861), *The Gospel According to Spiritism* (1864), *Heaven and Hell* (1865) and *The Genesis* (1868). His check, the **universal control**, puts **reason first** and trusts a teaching when **mediums who are strangers to one another, in several places, agree**.
    decoys:
      - body: |
          **Hippolyte Léon Denizard Rivail** (1804-1869), a Lyon-born educator who studied under Pestalozzi, published as **Allan Kardec**. According to his own account, **he was himself the medium and wrote down what he alone received**. His **five basic works** are *The Spirits' Book* (**1857**, 501 questions; 1019 in **1860**), *The Mediums' Book* (1861), *The Gospel According to Spiritism* (1864), *Heaven and Hell* (1865) and *The Genesis* (1868). His check, the **universal control**, puts **reason first** and trusts a teaching when **mediums who are strangers to one another, in several places, agree**.
        feedback: |
          Kardec presented himself as a compiler, not as the medium: he questioned others who served as mediums and compared their answers. That is why agreement among many mediums, not his own reception, was his guarantee.
      - body: |
          **Hippolyte Léon Denizard Rivail** (1804-1869), a Lyon-born educator who studied under Pestalozzi, published as **Allan Kardec**. According to his own account, he put questions to spirits through mediums, compared the answers and kept what agreed. His **five basic works** are *The Spirits' Book* (**1857**, 501 questions; 1019 in **1860**), *The Mediums' Book* (1861), *The Gospel According to Spiritism* (1864), *Heaven and Hell* (1865) and *The Genesis* (1868). His check, the **universal control**, trusts a teaching when **the mediums of one well-run circle agree, whatever reason says**.
        feedback: |
          Kardec warned that agreement inside one circle is not enough, since its mediums may share the same influence, and he put reason first, as a filter on every message. The control asks for strangers in several regions.
    explanation: |
      The root of the map. The works give the principles, the Brazilian story and the ethics their texts, and the universal control is the claim about evidence that the method box puts into numbers.

  - id: brazil
    title: Spiritism in Brazil
    row: 1
    col: 3
    body: |
      The doctrine found its largest following in Brazil. The **Brazilian Spiritist Federation** (FEB) was founded in Rio in **1884**; the physician **Bezerra de Menezes** made a **religious, Christian current with free charity** prevail. The medium **Chico Xavier** (1910-2002) attributed **over 400 books** to spirits, among them *Nosso Lar* (1944). In the **2022 census**, of about 176.7 million people aged 10 or more, **1.8%** declared Spiritism, about **3.2 million**. **Umbanda and Candomblé are distinct Afro-Brazilian religions**, with orixás and drums, which Kardecist Spiritism does not have.
    decoys:
      - body: |
          The doctrine found its largest following in Brazil. The **Brazilian Spiritist Federation** (FEB) was founded in Rio in **1884**; the physician **Bezerra de Menezes** made a **religious, Christian current with free charity** prevail. The medium **Chico Xavier** (1910-2002) attributed **over 400 books** to spirits, among them *Nosso Lar* (1944). In the **2022 census**, of about 176.7 million people aged 10 or more, **1.8%** declared Spiritism, about **3.2 million**. **Umbanda and Candomblé are Brazilian forms of Kardec's Spiritism**, which adds orixás and drums to his books.
        feedback: |
          Both speak with spirits, which is why the labels get merged, but they are different religions. Candomblé (Bahia, nineteenth century) and Umbanda (Rio, early twentieth) work with orixás, deities of West African origin, with drums and offerings; Kardecist centres have study, lectures, prayer and charity. The census counts them apart.
      - body: |
          The doctrine found its largest following in Brazil. The **Brazilian Spiritist Federation** (FEB) was founded in Rio in **1884**; the physician **Bezerra de Menezes** made a **religious, Christian current with free charity** prevail. The medium **Chico Xavier** (1910-2002) attributed **over 400 books** to spirits, among them *Nosso Lar* (1944). In the **2022 census**, of about 176.7 million people aged 10 or more, **18%** declared Spiritism, about **32 million**. **Umbanda and Candomblé are distinct Afro-Brazilian religions**, with orixás and drums, which Kardecist Spiritism does not have.
        feedback: |
          The share is 1.8%, not 18%: $0.018\times176.7\text{ M}\approx3.2\text{ M}$. Spiritism's cultural reach in Brazil (books, films, hospitals, many Catholics who also visit centres) is much larger than the number who name it as their religion.
    explanation: |
      Where the doctrine took root and turned religious. Its numbers are layer-1 facts; why it grew there is a live debate among scholars.

  - id: principles
    title: The principles
    row: 2
    col: 1
    body: |
      According to *The Spirits' Book*, God is **the Supreme Intelligence, first cause of all things**. A human being has three parts, $\text{body}+\text{perispirit}+\text{spirit}$; the **perispirit** is a semi-material envelope that **stays with the spirit after death**, and the *soul* is an incarnated spirit. Spirits rank in **3 orders** (imperfect, good, pure) and 10 classes, $5+4+1=10$. Each spirit lives **many lives, always human**, and **may stand still but never goes backwards**; past lives are forgotten during a life. Kardec's main argument: only many lives fit **God's justice toward unequal births**.
    decoys:
      - body: |
          According to *The Spirits' Book*, God is **the Supreme Intelligence, first cause of all things**. A human being has three parts, $\text{body}+\text{perispirit}+\text{spirit}$; the **perispirit** is a semi-material envelope that **dies with the body**, and the *soul* is an incarnated spirit. Spirits rank in **3 orders** (imperfect, good, pure) and 10 classes, $5+4+1=10$. Each spirit lives **many lives, always human**, and **may stand still but never goes backwards**; past lives are forgotten during a life. Kardec's main argument: only many lives fit **God's justice toward unequal births**.
        feedback: |
          The perispirit is the envelope the spirit keeps after death: it is what, according to Spiritism, lets a spirit be perceived and act on matter between lives. Only the body is left behind.
      - body: |
          According to *The Spirits' Book*, God is **the Supreme Intelligence, first cause of all things**. A human being has three parts, $\text{body}+\text{perispirit}+\text{spirit}$; the **perispirit** is a semi-material envelope that **stays with the spirit after death**, and the *soul* is an incarnated spirit. Spirits rank in **3 orders** (imperfect, good, pure) and 10 classes, $5+4+1=10$. Each spirit lives **many lives, sometimes as an animal**, and **may fall back after a bad life**; past lives are forgotten during a life. Kardec's main argument: only many lives fit **God's justice toward unequal births**.
        feedback: |
          That is the Hindu picture of rebirth, not Kardec's. According to The Spirits' Book a spirit is always reborn human and never goes backwards: a bad life can stall its progress, not reverse it.
    explanation: |
      What the doctrine claims. The comparison box sets these claims beside Christian, Hindu and Buddhist teachings, and the ethics box builds its account of suffering on them.

  - id: method
    title: The method in numbers, and controls
    row: 2
    col: 2
    body: |
      Let $q$ be the chance that one medium gives a given answer with no real source behind it. If $n$ mediums are **independent**, the agreement multiplies the odds of a real source by the likelihood ratio $\text{LR}=1/q^{n}$. But mediums who follow **one shared source** (a book, a teacher) agree anyway, with chance $0.9^5\approx0.59$ in the toy case, so **they count as one witness**. Controls each remove one rival: **blinding**, **randomisation**, predictions **written in advance**, and **counting the misses**.
    decoys:
      - body: |
          Let $q$ be the chance that one medium gives a given answer with no real source behind it. If $n$ mediums are **independent**, the agreement multiplies the odds of a real source by the likelihood ratio $\text{LR}=n/q$. But mediums who follow **one shared source** (a book, a teacher) agree anyway, with chance $0.9^5\approx0.59$ in the toy case, so **they count as one witness**. Controls each remove one rival: **blinding**, **randomisation**, predictions **written in advance**, and **counting the misses**.
        feedback: |
          Independent witnesses multiply, they do not add: each agreeing medium multiplies the ratio by $1/q$, so $n$ of them give $1/q^{n}$. With four mediums and $q = 1/5$ that is $625$, while $n/q$ would give only $20$.
      - body: |
          Let $q$ be the chance that one medium gives a given answer with no real source behind it. If $n$ mediums are **independent**, the agreement multiplies the odds of a real source by the likelihood ratio $\text{LR}=1/q^{n}$. Mediums who follow **one shared source** (a book, a teacher) **still count as $n$ separate witnesses, since each wrote alone**. Controls each remove one rival: **blinding**, **randomisation**, predictions **written in advance**, and **counting the misses**.
        feedback: |
          Writing alone is not independence. If all five draw on the same book, their agreement is likely ($0.9^5\approx59\%$) whether or not any spirit speaks, so it is evidence for the book, not for five sources. Kardec himself warned that one circle may share one influence.
    explanation: |
      Kardec's universal control, made exact. The rebirth cases and the tests of mediums both use the same tool, Bayes in odds form, and the same lesson: evidence counts only as much as its sources are independent.

  - id: rebirth
    title: Cases of the reincarnation type
    row: 2
    col: 3
    body: |
      The psychiatrist **Ian Stevenson** (1918-2007) collected cases of young children who speak of a previous life. With $R$ = rebirth and $N$ = normal causes, the odds after the evidence are the odds before it times $\text{LR}=P(E\mid R)/P(E\mid N)$: in a toy case, $1{:}1000$ times $500$ gives about **33%**. If the families met first, $\text{LR}=0.5/0.25=2$. So the strongest cases have **records of the child's words made before the previous person was identified** (about 33 of some 2,500). Stevenson held that the evidence **suggests rebirth, without compelling belief**.
    decoys:
      - body: |
          The psychiatrist **Ian Stevenson** (1918-2007) collected cases of young children who speak of a previous life. With $R$ = rebirth and $N$ = normal causes, the odds after the evidence are the odds before it times $\text{LR}=P(E\mid R)/P(E\mid N)$: in a toy case, $1{:}1000$ times $500$ gives about **33%**. If the families met first, $\text{LR}=0.5/0.25=2$. So the strongest cases have **records written after the families met, when the details are fullest**. Stevenson held that the evidence **suggests rebirth, without compelling belief**.
        feedback: |
          Records made afterwards can absorb what the families told each other, which is exactly what raises $P(E\mid N)$. Only words written down before anyone knew whom they would fit keep normal causes from explaining the match.
      - body: |
          The psychiatrist **Ian Stevenson** (1918-2007) collected cases of young children who speak of a previous life. With $R$ = rebirth and $N$ = normal causes, the odds after the evidence are the odds before it times $\text{LR}=P(E\mid R)/P(E\mid N)$: in a toy case, $1{:}1000$ times $500$ gives about **33%**. If the families met first, $\text{LR}=0.5/0.25=2$. So the strongest cases have **records of the child's words made before the previous person was identified** (about 33 of some 2,500). Stevenson held that the evidence **proves rebirth beyond reasonable doubt**.
        feedback: |
          Stevenson's own claim was more careful: he called the cases suggestive, and an associate said he thought them enough to make belief reasonable for some. Critics such as Paul Edwards and Champe Ransom go further the other way, holding that normal causes stay far ahead.
    explanation: |
      Bayes from the method box applied to one kind of evidence. The same worry returns as with mediums: a common cause, such as a culture that expects rebirth, can make many cases one piece of evidence.

  - id: ethics
    title: The ethics of Spiritism
    row: 3
    col: 1
    body: |
      According to Kardec, **every effect has a cause**: suffering undeserved in this life has its cause in a past one. An *expiation* pays a past wrong, a *trial* is a test chosen to advance, a *mission* a task taken on, and $\text{expiations}\subset\text{trials}$, so no onlooker can tell which a suffering is. A wrong is erased in three steps, $\text{repentance}\to\text{expiation}\to\text{reparation}$. The spirit is **free twice**: it chooses its trials before birth and **stays free in each act**. The strongest objection is **blaming the sufferer** (Lerner's just-world findings, 1966); the reply: the doctrine **commands help**.
    decoys:
      - body: |
          According to Kardec, **every effect has a cause**: suffering undeserved in this life has its cause in a past one. An *expiation* pays a past wrong, a *trial* is a test chosen to advance, a *mission* a task taken on, and $\text{trials}\subset\text{expiations}$, so **every suffering pays for a past wrong**. A wrong is erased in three steps, $\text{repentance}\to\text{expiation}\to\text{reparation}$. The spirit is **free twice**: it chooses its trials before birth and **stays free in each act**. The strongest objection is **blaming the sufferer** (Lerner's just-world findings, 1966); the reply: the doctrine **commands help**.
        feedback: |
          The inclusion runs the other way: an expiation always serves as a trial, but a trial is not always an expiation (it may be a chosen test or a mission). Reading every suffering as payment is the very slip the just-world objection warns about.
      - body: |
          According to Kardec, **every effect has a cause**: suffering undeserved in this life has its cause in a past one. An *expiation* pays a past wrong, a *trial* is a test chosen to advance, a *mission* a task taken on, and $\text{expiations}\subset\text{trials}$, so no onlooker can tell which a suffering is. A wrong is erased **by repentance alone**. The spirit is **free once**: it chooses its trials before birth, and **then each act follows from that choice**. The strongest objection is **blaming the sufferer** (Lerner's just-world findings, 1966); the reply: the doctrine **commands help**.
        feedback: |
          Heaven and Hell asks for repentance, then expiation, then reparation, since repentance alone would make forgiveness a pure act of grace. And question 872 keeps a second freedom: in life the spirit can yield to or resist each temptation; the only "fatality" is the physical trial chosen.
    explanation: |
      The principles turned into a way to live. Its weak point and its reply are both about the same thing: how an onlooker should treat someone who suffers.

  - id: comparison
    title: Beside Christian, Hindu and Buddhist teachings
    row: 3
    col: 2
    body: |
      According to *The Spirits' Book*, Jesus is **the most perfect guide and model**, and the Gospels' moral teaching is kept, but church dogma is set aside. The churches teach **one earthly life**, then judgment (Hebrews 9:27). Hindu rebirth can pass into **animal bodies**, which Spiritism **rules out**. Buddhist *anatta* ("not-self") has **no lasting self**, while Spiritism keeps a **lasting individual spirit**, and its *pure spirit* stops reincarnating yet **stays itself**. Historians such as Lynn Sharp place the doctrine in **a French milieu of the 1850s**; others see **convergence** on the same problem.
    decoys:
      - body: |
          According to *The Spirits' Book*, Jesus is **the most perfect guide and model**, and the Gospels' moral teaching is kept, but church dogma is set aside. The churches teach **one earthly life**, then judgment (Hebrews 9:27). Hindu rebirth can pass into **animal bodies**, which Spiritism **rules out**. Like Buddhist *anatta* ("not-self"), Spiritism has **no lasting self**, only a stream of lives, and its *pure spirit* **dissolves into the whole**. Historians such as Lynn Sharp place the doctrine in **a French milieu of the 1850s**; others see **convergence** on the same problem.
        feedback: |
          Both teach many lives, but the self differs. For Spiritism one individual spirit passes from life to life with its memories (forgotten during a life, recovered between lives) and keeps its individuality even as a pure spirit; *anatta* denies any lasting self at all.
      - body: |
          According to *The Spirits' Book*, Jesus is **God the Son, second person of the Trinity**, and the Gospels' moral teaching is kept **together with church dogma**. The churches teach **one earthly life**, then judgment (Hebrews 9:27). Hindu rebirth can pass into **animal bodies**, which Spiritism **rules out**. Buddhist *anatta* ("not-self") has **no lasting self**, while Spiritism keeps a **lasting individual spirit**, and its *pure spirit* stops reincarnating yet **stays itself**. Historians such as Lynn Sharp place the doctrine in **a French milieu of the 1850s**; others see **convergence** on the same problem.
        feedback: |
          Spiritism calls itself Christian in its ethics, not in its dogma. Spiritist writers treat Jesus as the highest spirit ever on earth, and the Trinity has no place in the doctrine; that is one reason the churches do not count it as Christian.
    explanation: |
      The principles placed among neighbours: one life against many, a lasting self against none, human bodies only against any species. The open question is borrowing or convergence.

  - id: testing
    title: Testing a medium
    row: 3
    col: 3
    body: |
      A fair test removes each normal route: a **proxy sitter** (no cues), a **blind choice** among decoy readings, **random order**, and $n$, $k$ and the threshold $t$ **fixed in advance**. Then by chance alone the hits $X$ follow $\text{Binomial}(n,1/k)$. With $n=10$, $k=5$, $t=5$, chance passes with **3.28%** (false positives) and a medium with hit rate $1/2$ with **62.3%** (power). So a **failed test is weak evidence against** the claim (the odds move only by a factor of about 0.39), and **best of 5 runs** inflates false positives to about 15%. A pass shows information no normal route explains, **not where it came from**.
    decoys:
      - body: |
          A fair test removes each normal route: a **proxy sitter** (no cues), a **blind choice** among decoy readings, **random order**, and $n$, $k$ and the threshold $t$ **fixed in advance**. Then by chance alone the hits $X$ follow $\text{Binomial}(n,1/k)$. With $n=10$, $k=5$, $t=5$, chance passes with **3.28%** (false positives) and a medium with hit rate $1/2$ with **62.3%** (power). So a **failed test is a strong disproof** of the claim (odds × about 0.03), and **best of 5 runs** inflates false positives to about 15%. A pass shows information no normal route explains, **not where it came from**.
        feedback: |
          A real medium with rate $1/2$ would still fail this short test with chance about 38%, so a failure moves the odds only a little. The factor 0.03 confuses the false-positive rate with the strength of a failure; a low-powered test cannot settle the question either way.
      - body: |
          A fair test removes each normal route: a **proxy sitter** (no cues), a **blind choice** among decoy readings, **random order**, and $n$, $k$ and the threshold $t$ **fixed in advance**. Then by chance alone the hits $X$ follow $\text{Binomial}(n,1/k)$. With $n=10$, $k=5$, $t=5$, chance passes with **3.28%** (false positives) and a medium with hit rate $1/2$ with **62.3%** (power). So a **failed test is weak evidence against** the claim (the odds move only by a factor of about 0.39), and **best of 5 runs** keeps false positives at 3.28%. A pass **proves that the dead survive**.
        feedback: |
          Each run is another chance for luck: the chance that at least one of 5 runs passes by chance is $1-(1-0.0328)^5\approx15\%$. And a pass removes normal routes, not rival unusual ones: information from living minds (super-psi) predicts the same hits as survival.
    explanation: |
      The method box turned into a design. The validity step stays separate: even a clean pass narrows the rivals without naming the source.

  - id: layers
    title: Three layers
    row: 4
    col: 1
    span: 3
    body: |
      Every claim of the level sits in one of three layers. **Established fact**: the dates and texts, Faraday's test, the census, what Stevenson recorded, what the tests of mediums reported, what the books teach. **Live debate**: how well the universal control works, why Spiritism grew in Brazil, how strong the rebirth cases are, how much Kardec owed to his milieu, whether the ethics softens or sharpens blame. **Faith**: that spirits of the dead speak, that a spirit returns in a new body, that a just God stands behind each fate.
    decoys:
      - body: |
          Every claim of the level sits in one of three layers. **Established fact**: the dates and texts, Faraday's test, the census, **that rebirth occurs, since Stevenson recorded hundreds of cases**, what the tests of mediums reported, what the books teach. **Live debate**: how well the universal control works, why Spiritism grew in Brazil, how much Kardec owed to his milieu, whether the ethics softens or sharpens blame. **Faith**: that spirits of the dead speak, that a just God stands behind each fate.
        feedback: |
          That the cases were recorded is fact; what they show is debate, and that a spirit returns is faith. A pile of reports is only as strong as its records and its independence, as the rebirth box showed.
      - body: |
          Every claim of the level sits in one of three layers. **Established fact**: the dates and texts, Faraday's test, the census, what Stevenson recorded, what the tests of mediums reported, what the books teach, **and that the spirits are not real, since Faraday disproved them**. **Live debate**: how well the universal control works, why Spiritism grew in Brazil, how strong the rebirth cases are, how much Kardec owed to his milieu. **Faith**: that a spirit returns in a new body, that a just God stands behind each fate.
        feedback: |
          Faraday explained one effect, turning tables, by the sitters' hands. That does not touch every claim of mediumship, still less survival after death. Passing a layer-3 denial off as layer 1 is the same slip as passing a layer-3 belief off as fact.
    explanation: |
      The course's habit applied to the whole level: say which layer a claim sits in, in either direction, and you can see where thoughtful people part ways.

