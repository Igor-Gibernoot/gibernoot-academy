id: ch20-kardec
title: "Kardec and the Birth of Spiritism"
kind: concept
own: |
  The setting: France in the 1850s, when a craze for "talking tables" met an educator named Hippolyte Léon Denizard Rivail (1804-1869), who published as Allan Kardec. Taught according to Kardec and the Spiritist movement, and according to historians; whether the spirits were really the source is left to each reader.
  - **Where it started.** Modern *Spiritualism* is usually dated to the raps heard by the Fox family at Hydesville, New York, in 1848; table-turning reached Europe in 1852-1853, and in 1853 Faraday tested it and concluded that {{ the sitters' own unconscious muscle movements moved the table }}.
  - **Who Kardec was.** A Lyon-born educator who studied at Pestalozzi's institute at Yverdon, wrote school books under his own name, and, according to his followers, began to question spirits through mediums about {{ life, the universe and the soul }}. *Allan Kardec* is the name he used for the Spiritist works.
  - **His method, as he described it.** He put questions through mediums, compared the answers across mediums and sessions, and kept what agreed. He called this check the *universal control of the teaching of the spirits*: the best guarantee is {{ agreement among spontaneous communications received by mediums who do not know one another, in different places }}; reason comes first and filters everything.
  - **What agreement can and cannot show.** If $5$ mediums each pick one of $4$ equally likely answers independently by chance, the chance that all five coincide is
    $$4\left(\tfrac14\right)^5=\tfrac1{256}\approx 0.4\%.$$
    So agreement is surprising under independent chance; but it {{ cannot separate a shared source, shared expectations or leaked information from spirits }}, which is why the later lessons ask for controls.
  - **The works.** *Le Livre des Esprits* (1857, 501 questions in the first edition, 1019 in the enlarged 1860 edition), then the *Revue Spirite* (monthly from January 1858) and the Paris society founded on 1 April 1858; the five basic books are {{ the Spirits' Book (1857), the Mediums' Book (1861), the Gospel According to Spiritism (1864), Heaven and Hell (1865) and the Genesis (1868) }}.
  - **Three layers.** Established: dates, texts, the table-turning craze, Faraday's test. Debated: how Kardec's method should be rated, and whether Spiritism is a religion, a philosophy or a science (Kardec himself spoke of science, philosophy and religious consequences). Faith: that the answers came from the spirits of the dead.

cards:
  - type: mcq
    id: hook
    title: "Guess: a doctrine from a table?"
    prompt: |
      Guessing is the point; no background is needed. Imagine Paris in the 1850s. People sit around a table, rest their hands on it, and the table taps or tilts. Taps can be counted out as letters, so the table seems to answer questions. A teacher decides to take this seriously and to build a whole body of teaching from the answers. What is the first problem he has to solve?
    options:
      - text: "How to tell which answers to trust, since different sessions might say different things."
        correct: true
        feedback: |
          Yes. Whatever one thinks of the tables, a doctrine built from answers needs some way to decide which answers count. The man we will meet, Allan Kardec, said he used one; whether it worked is the real question of this level.
      - text: "How to build a bigger table."
        feedback: |
          The size of the table is not the difficulty. The difficulty is that answers can disagree, or come from the sitters themselves.
      - text: "No problem at all: every answer given at a table can simply be written down and published."
        feedback: |
          Collecting is easy; choosing is not. Even those who believed the answers came from spirits had to ask why two answers differed.
    explanation: |
      This lesson follows Allan Kardec (Hippolyte Léon Denizard Rivail) and the Spiritist account of how his teaching was gathered, next to what historians can show. Whether the spirits were the real source is a question of faith and metaphysics that each reader weighs.

  - type: text
    id: craze
    title: "Rapping in New York, tables in Paris"
    image:
      src: img/daumier-tables.webp
      alt: "Lithograph of an actor in a helmet, a ballet dancer and two men with their hands on a small round table on a theatre stage."
      caption: "A caricature by Honoré Daumier from his series *La Fluidomanie* (1853), mocking the table-turning craze that had swept France that year."
      credit: "Honoré Daumier, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Brooklyn_Museum_-_Les_Tables_Tournantes_Moralisant_les_Coulisses_des_Th%C3%A9%C3%A2tres_-_Honor%C3%A9_Daumier.jpg"
    body: |
      *Spiritualism* is the belief that the dead survive and can communicate with the living, usually through a **medium**, a person said to receive such messages. Its modern movement is usually dated to **1848**, when the Fox family of Hydesville, New York, heard nightly raps in their house, and the young Fox sisters seemed to get answers from them by code. Public sittings followed, and the idea spread.

      In 1852 American mediums reached England, and in 1853 the fashion of **table-turning** (also "table-tipping") swept Europe: sitters rest their hands on a table, and it moves, taps or spells out replies. Satirists such as the French artist Honoré Daumier (1808-1879) mocked it at once. Scientists took it up too. The physicist Michael Faraday (1791-1867) built an indicator of cardboard and a pencil, and in a letter to *The Times* of 30 June 1853 reported that the movement came from the sitters' own involuntary, unconscious muscle action.

  - type: mcq
    id: faraday
    title: "What did Faraday's indicator show?"
    prompt: |
      In 1853 Michael Faraday put a cardboard-and-pencil indicator on a table-turning table and found that the sitters' hands pushed first and the table followed. Which conclusion does that result support most directly?
    options:
      - text: "That the table's motion, in his tests, came from the sitters' unconscious muscle action, not from electricity, magnetism or a spirit; it does not by itself address every later claim of communication."
        correct: true
        feedback: |
          Right. It explains the *movement* in those sittings. Believers replied that table-turning was only an early, crude form of contact, and that more careful mediumship, with written answers, was a different thing. Whether that reply holds is for the later lessons.
      - text: "That every report of spirit communication, anywhere and at any time, has been disproved."
        feedback: |
          One test of one phenomenon cannot do that. Faraday tested table movement; the claims of mediums covered much more.
      - text: "That the sitters were all lying."
        feedback: |
          Faraday's explanation needs no lying. Unconscious muscle action means sitters really feel the table move and honestly believe they did not push.
    explanation: |
      Layer 1: Faraday's result for table movement. Layer 2: how far it carries to other forms of mediumship. A careful reader keeps the two apart, as the Spiritists and their critics both come to do.

  - type: text
    id: rivail
    title: "An educator among the tables"
    image:
      src: img/kardec.webp
      alt: "Nineteenth-century studio photograph of Allan Kardec, a man with a high forehead and dark coat."
      caption: "Allan Kardec (1804-1869), pen name of the French educator Hippolyte Léon Denizard Rivail, who died in Paris on 31 March 1869."
      credit: "Unknown author (Gallica, Bibliothèque nationale de France), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Photo_Kardec.jpg"
    body: |
      **Hippolyte Léon Denizard Rivail** was born in Lyon, France, in 1804. According to the Psi Encyclopedia he studied from 1815 to 1822 at the institute in Yverdon, Switzerland, directed by the educator **Johann Heinrich Pestalozzi** (1746-1827), whose method stressed learning by observation and independent thought; other biographies call him a pupil and colleague of Pestalozzi. He became a teacher, translator and author of school books in Paris.

      By the mid-1850s he heard of the talking tables. Accounts of his early sittings say he was at first sceptical, and his own manuscript dates his interest to about 1855. According to the Spiritist account, he then put questions on life, the universe and the soul to spirits through mediums, using table raps or a planchette (a small board that moves under the fingers and writes). He published the result in **1857** under the name **Allan Kardec**.

  - type: mcq
    id: penname
    title: "Why Allan Kardec?"
    prompt: |
      Biographies give different accounts of where the name "Allan Kardec" came from. Some say a spirit told him it was a name he had borne in an earlier life; the Psi Encyclopedia says it derived from a name on his mother's side. What is the careful thing to say?
    options:
      - text: "The name was his pen name for the Spiritist works; where it came from is told differently by his followers and by some biographers, so the origin should be attributed, not asserted."
        correct: true
        feedback: |
          Yes. Under his own name he was known for school books; under this name he published Spiritist works. The origin of the name is a story with more than one version, so each version is given as someone's account.
      - text: "It was his birth name; Rivail was invented later."
        feedback: |
          The reverse is true: Hippolyte Léon Denizard Rivail was his name from birth, and Allan Kardec the name he used from 1857.
      - text: "Historians have settled that the name came from a séance."
        feedback: |
          Not so; the sources conflict. Some Spiritist accounts say a spirit revealed it, others (a family name) give an ordinary origin.
    explanation: |
      A small case of a habit this level will repeat: say "according to" and give the competing accounts rather than choosing one silently.

  - type: text
    id: method
    title: "The method, as Kardec described it"
    body: |
      Kardec presented his work not as a revelation received by one person but as a **collection and comparison**. According to him and his followers, the answers came from a group of spirits, among them one who called itself the "Spirit of Truth", through several mediums over the 1850s; he described himself as the organiser of the material rather than its author. His wife, Amélie Boudet, is said to have encouraged him to compile the answers.

      The first edition of *Le Livre des Esprits* ("The Spirits' Book") appeared in Paris on **18 April 1857**. It contained **501** questions and answers. The second edition of **1860** was "entirely reworked and considerably enlarged" (the wording of its title page), and the count in the editions published in his lifetime afterwards is **1019**, grouped in four books and 29 chapters.

  - type: numeric
    id: growth
    title: "How much did the book grow?"
    prompt: |
      The first edition of *Le Livre des Esprits* (1857) had 501 numbered questions, and the enlarged edition of 1860 has 1019. How many more questions does the 1860 edition have?
    answer: 518
    answerText: '518'
    hint: "Subtract the smaller count from the larger."
    explanation: |
      $1019-501=518$ more questions, so the second edition is roughly double the first ($1019/501\approx 2.03$). According to Spiritists, the extra material came from further answers Kardec received after 1857.

  - type: order
    id: chain
    title: "From table to book"
    prompt: |
      According to Kardec's own description and the Psi Encyclopedia's summary, put the stages by which the doctrine was produced in order.
    steps:
      - "Kardec writes questions on life, the universe and the soul"
      - "The questions are put to spirits through mediums, by table raps or planchette"
      - "Answers are compared across mediums and across sessions"
      - "What agrees is kept, and the answers are arranged by theme"
      - "The collection is published as Le Livre des Esprits (1857), later enlarged (1860)"
    hint: "Questions come first; the check comes before publication."
    explanation: |
      The comparison step is what Kardec relied on to show his doctrine was not one medium's opinion. The next card says what that check was meant to be.

  - type: text
    id: control
    title: "The universal control"
    body: |
      Kardec called his criterion the **universal control of the teaching of the spirits**. In essence: no single communication is a guarantee, because spirits, like people, can be mistaken or can speak from their own views. The best guarantee, he argued, is **agreement** among communications received spontaneously by many mediums who are strangers to one another and live in different places. In an April 1864 article in the *Revue Spirite* (in the English Kardecpedia translation) he wrote that "The first control is undoubtedly that of reason", to which everything from the spirits must be submitted, though reason alone is often incomplete.

      The idea is a familiar one in other fields: independent witnesses who agree are more convincing than one witness, as in a court, or independent labs in a laboratory. What makes agreement count is **independence**.

  - type: numeric
    id: chance
    title: "How surprising is agreement?"
    prompt: |
      An invented case. Five mediums, who do not know one another, are each asked the same question and each gives one of 4 possible answers. Suppose, as a pure-chance model, that each medium picks an answer at random, equally likely among the four, independently of the others. What is the probability, in percent, that all five give the same answer (whichever it is)?
    answer: 0.390625
    tolerance: 0.01
    answerText: '0.39'
    wrong:
      - { value: 0.0976562, feedback: "That is $(1/4)^5 = 1/1024$ in percent: the chance that all five pick one named answer, fixed in advance. Here any common answer counts, and there are 4 of them." }
      - { value: 25, feedback: "That is the chance that one other medium matches the first. Four more must match: $(1/4)^4$." }
    hint: "Pick any answer for the first medium. Each of the other four must match it."
    explanation: |
      The first medium picks some answer; each of the other four matches it with probability $\tfrac14$, so

      $$\left(\tfrac14\right)^4=\tfrac1{256}\approx 0.39\%.$$

      Equivalently, $4\cdot(1/4)^5$: four possible common answers, each with chance $(1/4)^5$. Agreement of five independent chance pickers is rare. The honest next question is whether the mediums were independent and the model of "pure chance" is the right rival.

  - type: mcq
    id: agreement
    title: "What does agreement show?"
    prompt: |
      Suppose five mediums, in several countries, really do give the same answer to the same question. According to a careful reader, which statement is the most accurate about what that would show?
    multiple: false
    options:
      - text: "It rules out pure chance, but the mediums might still share a source (a book, a common culture, the questioner's wording), so it is evidence only if their independence is checked."
        correct: true
        feedback: |
          Right. Agreement rules out one rival, independent random guesses. It cannot rule out rivals that also produce agreement, such as shared reading or shared expectations. Which rivals remain depends on how independent the mediums really were.
      - text: "It proves the answer came from spirits of the dead."
        feedback: |
          A spirit source is one explanation of agreement, and Kardec held it. But the same agreement fits a common human source, so a test has to separate them. A believer would ask what test could.
      - text: "It shows nothing, because agreement is always an accident."
        feedback: |
          Agreement among independent chance pickers is rare (five independent pickers among four answers coincide about 0.4% of the time). The issue is not that agreement is meaningless but that it needs independence to mean what it seems to.
    explanation: |
      This is a preview, not the whole story: a later lesson in this level takes up Kardec's criterion and compares it with the controls of science, and another designs a test of a medium's claim. For now the point is the logic: agreement counts as evidence in proportion to the independence of those who agree.

  - type: text
    id: works
    title: "From one book to a doctrine"
    body: |
      Kardec also coined the word **Spiritism** (French *spiritisme*) for his doctrine, in 1857; sources generally credit him with the coinage, though one study notes the word had appeared earlier in works on American Spiritualism. The following year he founded the monthly **Revue Spirite** (from January 1858) and, on **1 April 1858**, the Parisian Society of Spiritist Studies, which he directed until his death.

      The core of the doctrine is gathered in five books, which Spiritists call the **Spiritist Codification**: *The Spirits' Book* (1857), *The Mediums' Book* (1861), *The Gospel According to Spiritism* (1864), *Heaven and Hell* (1865) and *The Genesis According to Spiritism* (1868). Kardec died in Paris on 31 March 1869; his wife continued the organisational work.

  - type: order
    id: books
    title: "The five books in order"
    prompt: |
      Put the five basic works of Spiritism in order of first publication, earliest first.
    steps:
      - "The Spirits' Book"
      - "The Mediums' Book"
      - "The Gospel According to Spiritism"
      - "Heaven and Hell"
      - "The Genesis According to Spiritism"
    hint: "The first is the one with 501 questions in its first edition; the last came out a year before Kardec's death."
    explanation: |
      1857, 1861, 1864, 1865, 1868. The later books develop what the first one states: the Mediums' Book the practice and risks of mediumship, the Gospel the moral teaching, and the last two the fate of the soul and the nature of the world. Their contents come in the next lessons.

  - type: mcq
    id: fox-same
    title: "Spiritism and Spiritualism"
    prompt: |
      A friend says, "Spiritism is just the American spiritualism of the Fox sisters with a French name." According to the history of the 1850s, what is the best reply?
    options:
      - text: "They share the idea of communication with the dead and the same age of tables and mediums, but Kardec named his doctrine separately and, as its adherents hold, it is a codified system that includes reincarnation and a supreme God, which not every strand of Spiritualism stressed."
        correct: true
        feedback: |
          This is the careful version: related and contemporary, but distinct. In English "Spiritualism" names the broader movement; Spiritists reserve "Spiritism" for Kardec's codified doctrine.
      - text: "They are unrelated; Kardec never heard of table-turning."
        feedback: |
          Kardec began with the talking tables of the 1850s, so he did not stand apart from the craze. He took it up and organised what he took from it.
      - text: "They are identical; every spiritualist follows Kardec's books."
        feedback: |
          They are not identical. Spiritism is a codified doctrine with its own books and terms; Spiritualism is the broader movement, with many strands.
    explanation: |
      Where historians and adherents part ways: for historians the two are branches of the same mid-century movement; for Spiritists, Kardec's work is more than a branch, because it claims to be a systematic teaching verified by the universal control.

  - type: mcq
    id: fox-fraud
    title: "The Fox sisters afterward"
    prompt: |
      In 1888 Margaret Fox read a statement in New York describing how the Hydesville raps had been made, and in November 1889 she took it back. According to the Psi Encyclopedia's account, what should a careful reader conclude about Kardec's Spiritism from this episode?
    options:
      - text: "Little, directly: Kardec's work started from the 1850s European table-turning and was not based on the Fox raps. The Fox story bears on the origin of American Spiritualism, and even that is told with a confession and a retraction."
        correct: true
        feedback: |
          Right. Keep the layers separate: what was said in 1888 and 1889 is documented; what the raps were in 1848 is debated; and Kardec's doctrine rests on its own method, which has to be judged by its own standards.
      - text: "That Spiritism is shown to be a fraud."
        feedback: |
          That jumps from the Fox raps of one New York house to a French doctrine that arose in a different way. If the Fox raps were trickery, that would not by itself settle whether Kardec's sittings were.
      - text: "That Spiritism is proved genuine, since the confession was withdrawn."
        feedback: |
          A retraction shows the question stayed open; it does not show the raps were genuine, still less that Kardec's method was sound.
    explanation: |
      An argument against one person or event is an argument against that case, not automatically against the whole movement. The same rule protects believers from careless sneers and critics from careless proofs.

  - type: mcq
    id: christian
    title: "Is Spiritism a Christian denomination?"
    prompt: |
      Kardec taught that the teaching of the spirits is eminently Christian, and many Spiritists, especially in Brazil, call themselves Christians. Yet scholars do not all agree. According to this description, which statement is the fairest?
    options:
      - text: "Spiritists see the doctrine as Christian in its moral core (the teaching of Jesus), while some scholars note that it rejects doctrines such as the Trinity and the physical resurrection and call it a form of neo-Christianity or a separate movement; the label is disputed."
        correct: true
        feedback: |
          This keeps both views visible. Adherents define themselves by what they hold; scholars classify by comparison with older churches; both are doing their own job.
      - text: "It is simply a Protestant denomination founded in France."
        feedback: |
          It is not a church of the Reformation; it teaches reincarnation and, according to scholars, does not accept doctrines such as the Trinity.
      - text: "It has nothing to do with Jesus."
        feedback: |
          Jesus' teaching is central: Kardec's *Gospel According to Spiritism* (1864) is about his moral teaching, read in Spiritist terms.
    explanation: |
      A later lesson compares Spiritism with Christianity and with Eastern ideas of rebirth. Here the point is only that "Is it Christian?" has a different answer for a Spiritist, a Catholic, and a historian of religion, each asking a different question.

  - type: mcq
    id: layers
    title: "History or doctrine?"
    prompt: |
      Mark every statement below that is a claim of established history (layer 1), not a claim of faith.
    multiple: true
    options:
      - text: "*Le Livre des Esprits* was published in Paris in 1857 under the name Allan Kardec."
        correct: true
        feedback: |
          Yes, a documented publication.
      - text: "Kardec's questions were answered by the spirits of the dead."
        feedback: |
          This is the Spiritist claim itself (layer 3). Historians record that Kardec said so; they do not confirm it.
      - text: "Faraday reported in 1853 that, in his tests, table movement came from the sitters' unconscious muscle action."
        correct: true
        feedback: |
          Yes: that he reported it, and what he reported, is documented (Faraday's letter in *The Times*, 30 June 1853).
      - text: "The doctrine of the Spirits' Book is therefore guaranteed true by the agreement of mediums."
        feedback: |
          Whether the agreement actually supports the doctrine is the open question of the level (layer 2 at best).
    explanation: |
      The rule of the course: keep *that someone claims* separate from *that it is so*. Both Spiritists and sceptics can accept the first column without giving way on the second.

  - type: text
    id: reception
    title: "A bestseller, and a question"
    body: |
      According to the Psi Encyclopedia, *Le Livre des Esprits* became a bestseller, and the *Revue Spirite* and the Parisian society gave the movement a base. Spiritism then spread widely, above all in Brazil, which later lessons follow. The press mocked the talking tables (Daumier's caricature shows the mood).

      Two questions run through the rest of the level. First, what exactly does the doctrine say about God, the soul and rebirth? Second, how well does its method of collecting and checking answers stand up against the controls of science? The next lesson takes the first.

  - type: text
    id: summary
    body: |
      **Next:** The Core Principles: what the doctrine says about God, the immortal spirit, reincarnation, moral progress and communication with the dead, stated as Spiritists state them.
