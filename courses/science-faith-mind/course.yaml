# The trail. One level per theme, lessons in trail order. There is no main
# book: the level list is the course's own spine (see CLAUDE.md and REFERENCES.md).
#
# A lesson entry with `file:` is built and playable; without it, it shows as
# a planned (greyed) node. `kind` is concept | guided | traps | intuition, plus
# the end-of-level kinds: map (content-map puzzle), review (automatic, no file:
# practises only this level's questions) and challenge (weigh positions).
# Guided nodes are "Guided proof" (proof: true) or "Guided problem" (see summary).
# Exams: four, own levels, none over 6 levels. exam-partial1 after Level 7 (covers 2-7),
# exam-partial2 after Level 13 (8-13), exam-partial3 after Level 19 (14-19),
# exam-final after Level 25 (20-25).

title: "Science, Faith and Mind"

levels:

  - id: ch01
    number: 1
    title: "The Big Questions"
    blurb: "A light tour: what is real, how do we know, is there a God, what is a mind? Guess first, with no theory yet, and see how many ways there are to ask."
    lessons:
      - id: ch01-bubble
        title: "Outside Our Bubble"
        kind: concept
        file: ch01/bubble.yaml
        summary: "Most of what we believe comes from where we were born and who we met; what it takes to ask a question honestly."
      - id: ch01-lenses
        title: "Four Lenses on One Question"
        kind: concept
        file: ch01/lenses.yaml
        summary: "Why is there something rather than nothing? Seen through science, philosophy, theology and lived experience."
      - id: ch01-reasons
        title: "What Counts as a Good Reason?"
        kind: concept
        file: ch01/reasons.yaml
        summary: "Evidence, argument, testimony, experience and trust: the kinds of reasons we use and where each one can fail."
      - id: ch01-tour
        title: "A Puzzle for Every Level"
        kind: concept
        file: ch01/tour.yaml
        summary: "One guessing puzzle for each later level, and a table mapping each puzzle to the level that opens it."
      - id: ch01-traps
        title: "Traps"
        kind: traps
        file: ch01/traps.yaml
        summary: "Fast questions, each built on a common misconception."
      - id: ch01-map
        title: "Content Map"
        kind: map
        file: ch01/map.yaml
        summary: "Rebuild the level's concept map box by box among look-alike decoys."
      - { id: ch01-review, title: Level Review, kind: review }
      - id: ch01-challenge
        title: "Level Challenge: Sort the Questions (1)"
        kind: challenge
        file: ch01/challenge.yaml
        summary: "Problems 1-3: classify real questions by kind of answer, choose the lens or lenses, split a compound question. (Deep dive.)"
      - id: ch01-challenge-2
        title: "Level Challenge: Sort the Questions (2)"
        kind: challenge
        file: ch01/challenge-2.yaml
        summary: "Problems 4-5: judge reasons inside a longer debate, then take apart a final question yourself. (Deep dive.)"

  - id: ch02
    number: 2
    title: "How Science Knows"
    blurb: "Induction, falsification, paradigms and Bayesian updating: what makes a claim scientific, how evidence supports a theory, and where science stops."
    lessons:
      - id: ch02-induction
        title: "Why the Sun Will Rise Tomorrow"
        kind: concept
        file: ch02/induction.yaml
        summary: "Hume's problem of induction: no argument from past to future avoids circularity, and what we do about it."
      - id: ch02-falsification
        title: "Popper and the Black Swan"
        kind: concept
        file: ch02/falsification.yaml
        summary: "Falsifiability as a test of a theory, and why it is both powerful and incomplete."
      - id: ch02-paradigms
        title: "Kuhn: When Science Changes Its Mind"
        kind: concept
        file: ch02/paradigms.yaml
        summary: "Normal science, anomalies and revolutions; is progress cumulative or a change of worldview?"
      - id: ch02-bayes
        title: "Evidence as Updating Belief"
        kind: concept
        file: ch02/bayes.yaml
        summary: "Prior, likelihood and posterior in a toy model; how the same evidence moves different priors."
      - id: ch02-bayes-proof
        title: "Guided proof: Evidence Favours the Theory That Predicted It"
        kind: guided
        file: ch02/bayes-proof.yaml
        summary: "Guided proof: derive the likelihood-ratio law, with the old-evidence and prior-dependence objections."
      - id: ch02-underdetermination
        title: "When Data Cannot Decide"
        kind: concept
        file: ch02/underdetermination.yaml
        summary: "Duhem and Quine: many theories fit the same data; what picks one (simplicity, fertility, taste?)."
      - id: ch02-realism
        title: "Is Science Describing Reality?"
        kind: concept
        file: ch02/realism.yaml
        summary: "Realism, instrumentalism and the pessimistic induction; what a successful theory tells us."
      - id: ch02-pseudo
        title: "Science, Pseudoscience and Fringe Claims"
        kind: concept
        file: ch02/pseudo.yaml
        summary: "Astrology, homeopathy and similar cases: marks of a field that borrows science's look without its checks, and why the line is blurry."
      - id: ch02-limits
        title: "What Science Can and Cannot Say"
        kind: concept
        file: ch02/limits.yaml
        summary: "Methodological versus metaphysical naturalism, and which questions fall outside the method."
      - id: ch02-traps
        title: "Traps"
        kind: traps
        file: ch02/traps.yaml
        summary: "Fast questions, each built on a common misconception about this level."
      - id: ch02-intuition
        title: "Quick Recall"
        kind: intuition
        file: ch02/intuition.yaml
        summary: "Mnemonics, distinctions and a small worked example for the level's main ideas."
      - id: ch02-map
        title: "Content Map"
        kind: map
        file: ch02/map.yaml
        summary: "Rebuild the level's concept map box by box among look-alike decoys."
      - { id: ch02-review, title: Level Review, kind: review }
      - id: ch02-challenge
        title: "Level Challenge: Is It Science? (1)"
        kind: challenge
        file: ch02/challenge.yaml
        summary: "Problems 1-3: judge a natural-remedy claim, a theory saved by a patch, and rival curves through the same data. (Deep dive.)"
      - id: ch02-challenge-2
        title: "Level Challenge: Is It Science? (2)"
        kind: challenge
        file: ch02/challenge-2.yaml
        summary: "Problems 4-5: what the success of a theory shows about reality, and where science's limits lie. (Deep dive.)"

  - id: ch03
    number: 3
    title: "Views of Reality"
    blurb: "Materialism, idealism, dualism, panpsychism and structural realism, and what quantum mechanics does and does not force on us."
    lessons:
      - id: ch03-materialism
        file: ch03/materialism.yaml
        title: "Matter Is All There Is?"
        kind: concept
        summary: "Physicalism stated carefully, its successes, and what \"physical\" means when physics keeps changing."
      - id: ch03-idealism
        file: ch03/idealism.yaml
        title: "Mind First: Idealism"
        kind: concept
        summary: "Berkeley, Kant and modern idealisms: the best argument that matter is not fundamental."
      - id: ch03-dualism
        file: ch03/dualism.yaml
        title: "Two Kinds of Stuff: Dualism"
        kind: concept
        summary: "Descartes, the interaction problem, and what a modern dualist says in reply."
      - id: ch03-panpsychism
        file: ch03/panpsychism.yaml
        title: "Mind in Everything? Panpsychism and Neutral Monism"
        kind: concept
        summary: "Russell, Spinoza and the idea that experience is basic; its combination problem."
      - id: ch03-emergence
        file: ch03/emergence.yaml
        title: "Emergence and Reduction"
        kind: concept
        summary: "Can wholes have properties parts lack? Weak and strong emergence with a worked example."
      - id: ch03-quantum
        title: "What Quantum Mechanics Does and Does Not Say"
        kind: concept
        file: ch03/quantum.yaml
        summary: "Copenhagen, many worlds, pilot wave, QBism: what they agree on, where they differ and what the measurement problem leaves open."
      - id: ch03-bell
        title: "Guided problem: Bell's Inequality with Numbers"
        kind: guided
        file: ch03/bell.yaml
        summary: "Guided problem (one case, the singlet pair, with its own numbers): compute the CHSH bound 2 versus 2 root 2 and see what it rules out, and what it does not."
      - id: ch03-simulation
        title: "Are We in a Simulation?"
        kind: concept
        file: ch03/simulation.yaml
        summary: "The simulation argument as probability, its assumptions, and its relation to old ideas about reality."
      - id: ch03-structure
        title: "Structural Realism: What Survives Theory Change?"
        kind: concept
        file: ch03/structure.yaml
        summary: "If objects change between theories but equations survive, is structure what is real?"
      - id: ch03-traps
        title: "Traps"
        kind: traps
        file: ch03/traps.yaml
        summary: "Fast questions, each built on a common misconception about this level."
      - id: ch03-intuition
        title: "Quick Recall"
        kind: intuition
        file: ch03/intuition.yaml
        summary: "Mnemonics, distinctions and a small worked example for the level's main ideas."
      - id: ch03-map
        title: "Content Map"
        kind: map
        file: ch03/map.yaml
        summary: "Rebuild the level's concept map box by box among look-alike decoys."
      - { id: ch03-review, title: Level Review, kind: review }
      - id: ch03-challenge
        title: "Level Challenge: Which World Are We In? (1)"
        kind: challenge
        file: ch03/challenge.yaml
        summary: "Problems 1-3: test the views of reality against closure, a quantum Bell test, and simulation and structure, with numbers. (Deep dive.)"
      - id: ch03-challenge-2
        title: "Level Challenge: Which World Are We In? (2)"
        kind: challenge
        file: ch03/challenge-2.yaml
        summary: "Problems 4-5: the remaining puzzles for the views of reality, and where thoughtful people part ways. (Deep dive.)"

  - id: ch04
    number: 4
    title: "Mathematics and Why It Works"
    blurb: "Wigner's puzzle: why does mathematics describe the world so well? Platonism, formalism, Godel and the idea that reality is mathematical."
    lessons:
      - id: ch04-wigner
        title: "The Unreasonable Effectiveness"
        kind: concept
        file: ch04/wigner.yaml
        summary: "Examples where math invented for one reason predicted something new in physics; why this is strange."
      - id: ch04-platonism
        title: "Platonism, Formalism, Intuitionism"
        kind: concept
        file: ch04/platonism.yaml
        summary: "Three answers to \"what is a number?\", each with its best argument and its hardest question."
      - id: ch04-diagonal
        title: "Guided proof: Some Infinities Are Bigger"
        kind: guided
        file: ch04/diagonal.yaml
        summary: "Guided proof: Cantor's diagonal argument that the reals cannot be listed, and what that says about proof and truth."
      - id: ch04-godel
        title: "Godel and the Limits of Proof"
        kind: concept
        file: ch04/godel.yaml
        summary: "What the incompleteness theorems do say, and the many things people wrongly say they prove."
      - id: ch04-explaining
        title: "Explanations of the Effectiveness"
        kind: concept
        file: ch04/explaining.yaml
        summary: "Evolution, selection bias, structure-sharing and design: the main attempts to dissolve or explain Wigner's puzzle."
      - id: ch04-universe
        title: "Is Reality Mathematics?"
        kind: concept
        file: ch04/universe.yaml
        summary: "Pythagoras, Galileo's book of nature and Tegmark: the mathematical universe and its critics."
      - id: ch04-traps
        title: "Traps"
        kind: traps
        file: ch04/traps.yaml
        summary: "Fast questions, each built on a common misconception about this level."
      - id: ch04-intuition
        title: "Quick Recall"
        kind: intuition
        file: ch04/intuition.yaml
        summary: "Mnemonics, distinctions and a small worked example for the level's main ideas."
      - id: ch04-map
        title: "Content Map"
        kind: map
        summary: "Rebuild the level's concept map box by box among look-alike decoys."
      - { id: ch04-review, title: Level Review, kind: review }
      - id: ch04-challenge
        title: "Level Challenge: Invented or Discovered?"
        kind: challenge
        summary: "Defend and attack each philosophy of mathematics on the same examples. (Deep dive.)"

  - id: ch05
    number: 5
    title: "Origins and Fine-Tuning"
    blurb: "Did the universe begin? Why these laws and constants? Cosmology, the anthropic principle, the multiverse and the measure problem."
    lessons:
      - id: ch05-bigbang
        title: "The Universe Has a History"
        kind: concept
        summary: "Expansion, the background radiation and Lemaitre: what the evidence says about the early universe and what it does not."
      - id: ch05-beginning
        title: "Did Time Begin?"
        kind: concept
        summary: "Singularity theorems, quantum cosmology, eternal inflation and cyclic models: what \"beginning\" can mean."
      - id: ch05-something
        title: "Why Something Rather Than Nothing?"
        kind: concept
        summary: "Leibniz's question, \"nothing\" in physics versus in philosophy, and necessary versus contingent existence."
      - id: ch05-entropy
        title: "Why Was the Early Universe So Ordered?"
        kind: concept
        summary: "The arrow of time and the low-entropy start: the puzzle, with the order of magnitude of the odds."
      - id: ch05-constants
        title: "Fine-Tuning: The Numbers"
        kind: concept
        summary: "Which constants are sensitive, by how much, and which claims are well established versus disputed."
      - id: ch05-anthropic
        title: "The Anthropic Principle and Selection Effects"
        kind: concept
        summary: "Weak and strong versions; Weinberg's prediction for the cosmological constant; what a selection effect can and cannot explain."
      - id: ch05-multiverse
        title: "The Multiverse and the Measure Problem"
        kind: concept
        summary: "Inflation, the landscape, and why counting universes is harder than it sounds."
      - id: ch05-finetuning-proof
        title: "Guided proof: Bayes and Fine-Tuning"
        kind: guided
        summary: "Guided proof: the likelihood-ratio argument from fine-tuning, with the normalisation, reference-class and multiverse objections exposed."
      - id: ch05-traps
        title: "Traps"
        kind: traps
        summary: "Fast questions, each built on a common misconception about this level."
      - id: ch05-intuition
        title: "Quick Recall"
        kind: intuition
        summary: "Mnemonics, distinctions and a small worked example for the level's main ideas."
      - id: ch05-map
        title: "Content Map"
        kind: map
        summary: "Rebuild the level's concept map box by box among look-alike decoys."
      - { id: ch05-review, title: Level Review, kind: review }
      - id: ch05-challenge
        title: "Level Challenge: The Universe as Evidence"
        kind: challenge
        summary: "Weigh beginning, fine-tuning and multiverse arguments, with honest numbers and honest objections. (Deep dive.)"

  - id: ch06
    number: 6
    title: "Arguments for God"
    blurb: "The cosmological, kalam, ontological, design and moral arguments, each built with its premises exposed and tested against its best objection."
    lessons:
      - id: ch06-theism
        title: "What Is Being Argued For?"
        kind: concept
        summary: "Theism, deism, pantheism and atheism defined carefully; what the arguments aim to show and what they cannot."
      - id: ch06-cosmological
        title: "Guided proof: The Cosmological Argument"
        kind: guided
        summary: "Guided proof: from contingency and the principle of sufficient reason to a necessary being, step by step."
      - id: ch06-kalam
        title: "The Kalam Argument"
        kind: concept
        summary: "Whatever begins has a cause; the universe began; so it has a cause. The case for each premise and the physics objections."
      - id: ch06-ontological
        title: "Guided proof: The Ontological Argument"
        kind: guided
        summary: "Guided proof: Anselm, Gaunilo and the modal version; what exactly is being assumed."
      - id: ch06-design
        title: "From Paley to Darwin: The Design Argument"
        kind: concept
        summary: "The watch, Hume's reply, evolution, and the modern shift to laws and fine-tuning."
      - id: ch06-moral
        title: "The Moral Argument"
        kind: concept
        summary: "Objective moral values and God: the argument, the Euthyphro reply, and secular accounts of morality."
      - id: ch06-reason
        title: "Is Reason Itself a Clue?"
        kind: concept
        summary: "Plantinga's evolutionary argument against naturalism and the argument from reason, with replies."
      - id: ch06-traps
        title: "Traps"
        kind: traps
        summary: "Fast questions, each built on a common misconception about this level."
      - id: ch06-intuition
        title: "Quick Recall"
        kind: intuition
        summary: "Mnemonics, distinctions and a small worked example for the level's main ideas."
      - id: ch06-map
        title: "Content Map"
        kind: map
        summary: "Rebuild the level's concept map box by box among look-alike decoys."
      - { id: ch06-review, title: Level Review, kind: review }
      - id: ch06-challenge
        title: "Level Challenge: Weigh the Argument"
        kind: challenge
        summary: "Find the weakest premise in each argument and say what a defender and a critic would each do next. (Deep dive.)"

  - id: ch07
    number: 7
    title: "Arguments Against God"
    blurb: "The problem of evil, divine hiddenness, parsimony and Pascal's wager: the strongest cases against belief, and the replies of believers."
    lessons:
      - id: ch07-evil-logical
        title: "Guided proof: The Logical Problem of Evil"
        kind: guided
        summary: "Guided proof: Mackie's inconsistency, the free-will defence and what a possible-worlds argument shows."
      - id: ch07-evil-evidence
        title: "The Evidential Problem of Evil"
        kind: concept
        summary: "Rowe's fawn, natural suffering and the probability that a good God would allow it."
      - id: ch07-theodicy
        title: "Theodicies and Their Critics"
        kind: concept
        summary: "Soul-making, greater goods, skeptical theism, process views: what each tries to do and where each strains."
      - id: ch07-hiddenness
        title: "Divine Hiddenness"
        kind: concept
        summary: "Schellenberg's argument from non-resistant non-belief, and replies about freedom and relationship."
      - id: ch07-parsimony
        title: "Occam, Burden of Proof and Naturalism"
        kind: concept
        summary: "What parsimony can and cannot decide; who must argue and for what."
      - id: ch07-wager
        title: "Guided problem: Pascal's Wager"
        kind: guided
        summary: "Guided problem: expected value with infinite stakes, the many-gods objection and decision theory with numbers."
      - id: ch07-agnostic
        title: "Agnosticism and Its Varieties"
        kind: concept
        summary: "Strong, weak and practical agnosticism; when is suspending judgement the honest answer?"
      - id: ch07-traps
        title: "Traps"
        kind: traps
        summary: "Fast questions, each built on a common misconception about this level."
      - id: ch07-intuition
        title: "Quick Recall"
        kind: intuition
        summary: "Mnemonics, distinctions and a small worked example for the level's main ideas."
      - id: ch07-map
        title: "Content Map"
        kind: map
        summary: "Rebuild the level's concept map box by box among look-alike decoys."
      - { id: ch07-review, title: Level Review, kind: review }
      - id: ch07-challenge
        title: "Level Challenge: Weigh the Objection"
        kind: challenge
        summary: "Pair each objection with its best reply, and judge what each leaves standing. (Deep dive.)"

  - id: exam-partial1
    eyebrow: Partial exam
    hue: 3
    title: "Partial Exam 1: Knowing, Reality, Origins and God"
    blurb: "A timed exam on Levels 2 to 7: how science knows, views of reality, mathematics, origins, and the arguments for and against God. No feedback until you submit, then your score and a review of every answer."
    lessons:
      - id: exam-partial1
        title: "Partial Exam 1"
        kind: exam
        summary: "One hour, ten points. Original questions that combine several levels. Answers are checked only when you submit."

  - id: ch08
    number: 8
    title: "The Nature of God"
    blurb: "What do traditions mean by God? Classical theism, the Trinity and tawhid, process theology, pantheism, panentheism and Einstein's God."
    lessons:
      - id: ch08-attributes
        title: "The Omni-Attributes"
        kind: concept
        summary: "Omnipotence, omniscience, omnibenevolence: precise statements and the paradoxes they face."
      - id: ch08-time
        title: "God and Time"
        kind: concept
        summary: "Eternal outside time or everlasting within it? Foreknowledge, freedom and what physics says about time."
      - id: ch08-abrahamic
        title: "One God in Three Traditions"
        kind: concept
        summary: "Jewish, Christian and Islamic conceptions: the Shema, the Trinity and tawhid, stated fairly."
      - id: ch08-process
        title: "Process Theology and Open Theism"
        kind: concept
        summary: "A God who changes and persuades rather than commands: Whitehead, Hartshorne and open theism."
      - id: ch08-spinoza
        title: "Spinoza and Einstein: Nature as God"
        kind: concept
        summary: "Pantheism, \"Deus sive Natura\" and what Einstein meant by his God."
      - id: ch08-panentheism
        title: "Panentheism and the Ground of Being"
        kind: concept
        summary: "God in the world and beyond it: Tillich, Schleiermacher and modern physicist-theologians."
      - id: ch08-apophatic
        title: "Saying What God Is Not"
        kind: concept
        summary: "Negative theology: Maimonides, Aquinas, Eckhart and the limits of language about the infinite."
      - id: ch08-language
        title: "Guided proof: Can We Speak About God at All?"
        kind: guided
        summary: "Guided proof: from analogy to religious language, with verificationism and its fall as the foil."
      - id: ch08-traps
        title: "Traps"
        kind: traps
        summary: "Fast questions, each built on a common misconception about this level."
      - id: ch08-intuition
        title: "Quick Recall"
        kind: intuition
        summary: "Mnemonics, distinctions and a small worked example for the level's main ideas."
      - id: ch08-map
        title: "Content Map"
        kind: map
        summary: "Rebuild the level's concept map box by box among look-alike decoys."
      - { id: ch08-review, title: Level Review, kind: review }
      - id: ch08-challenge
        title: "Level Challenge: Which God Is Being Discussed?"
        kind: challenge
        summary: "Take one argument and see which concept of God it supports, and which it leaves untouched. (Deep dive.)"

  - id: ch09
    number: 9
    title: "Science and Religion"
    blurb: "Conflict, independence, dialogue, integration: four models and the historical cases (Galileo, Darwin) that test them."
    lessons:
      - id: ch09-models
        title: "Four Models: Conflict, Independence, Dialogue, Integration"
        kind: concept
        summary: "Barbour's map and Gould's NOMA, each with its best case and its weak spot."
      - id: ch09-galileo
        title: "The Galileo Affair, Carefully"
        kind: concept
        summary: "What actually happened, which myths are false, and what it shows about authority and evidence."
      - id: ch09-darwin
        title: "Darwin and the Religious Response"
        kind: concept
        summary: "Evolution, theistic evolution, creationism and intelligent design: the science and the theology of each."
      - id: ch09-miracles
        title: "Miracles and the Laws of Nature"
        kind: concept
        summary: "Hume's argument, its Bayesian reading, and what a miracle claim would have to overcome."
      - id: ch09-miracles-proof
        title: "Guided proof: Weighing a Miracle Report"
        kind: guided
        summary: "Guided proof: derive when testimony outweighs the prior improbability, with numbers."
      - id: ch09-divine-action
        title: "How Could God Act in the World?"
        kind: concept
        summary: "Quantum indeterminacy, chaos and top-down causation as proposals; what each costs."
      - id: ch09-origins-religion
        title: "Religious Scientists and Scientific Atheists"
        kind: concept
        summary: "Surveys of what scientists believe, and why the data do not settle the question."
      - id: ch09-theology-of-science
        title: "A Theology of Science"
        kind: concept
        summary: "Why modern science arose where it did, laws as divine thoughts, and secular alternatives."
      - id: ch09-traps
        title: "Traps"
        kind: traps
        summary: "Fast questions, each built on a common misconception about this level."
      - id: ch09-intuition
        title: "Quick Recall"
        kind: intuition
        summary: "Mnemonics, distinctions and a small worked example for the level's main ideas."
      - id: ch09-map
        title: "Content Map"
        kind: map
        summary: "Rebuild the level's concept map box by box among look-alike decoys."
      - { id: ch09-review, title: Level Review, kind: review }
      - id: ch09-challenge
        title: "Level Challenge: Reading the Case"
        kind: challenge
        summary: "Apply the four models to real episodes and say which fits and why. (Deep dive.)"

  - id: ch10
    number: 10
    title: "Consciousness"
    blurb: "The hard problem, the science of the brain, free will, and what religions say about the soul."
    lessons:
      - id: ch10-hard-problem
        title: "The Hard Problem"
        kind: concept
        summary: "Why explaining behaviour is not explaining experience: Nagel's bat, qualia and the explanatory gap."
      - id: ch10-zombie
        title: "Guided proof: The Zombie Argument"
        kind: guided
        summary: "Guided proof: conceivability, possibility and what follows for physicalism, with the standard replies."
      - id: ch10-neuro
        title: "What the Brain Shows"
        kind: concept
        summary: "Neural correlates, anaesthesia and brain damage: what correlation establishes and what it does not."
      - id: ch10-gwt
        title: "Global Workspace and Higher-Order Theories"
        kind: concept
        summary: "Consciousness as broadcasting or self-monitoring: the main functionalist theories."
      - id: ch10-iit
        title: "Integrated Information and Other Rivals"
        kind: concept
        summary: "IIT, predictive processing and quantum proposals: what each claims and how each could be tested."
      - id: ch10-free-will
        title: "Free Will"
        kind: concept
        summary: "Libet, determinism, compatibilism and libertarianism: a map of the debate."
      - id: ch10-self
        title: "What Is the Self?"
        kind: concept
        summary: "Personal identity, split brains and Parfit; what is left when the self is a construction?"
      - id: ch10-souls
        title: "Souls, Afterlife and Rebirth"
        kind: concept
        summary: "What traditions mean by soul, and how the near-death and brain evidence bears on each."
      - id: ch10-machines
