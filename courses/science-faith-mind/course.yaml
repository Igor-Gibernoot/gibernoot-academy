  - id: ch21
    number: 21
    title: "Aliens and the Cosmic Perspective"
    blurb: "How likely is other life, what would it mean for religion, and what do we actually know about unidentified phenomena?"
    lessons:
      - id: ch21-drake
        title: "The Drake Equation"
        kind: concept
        summary: "A way to organise ignorance: factors, plausible ranges and why the answer spans many orders of magnitude."
      - id: ch21-fermi
        title: "The Fermi Paradox"
        kind: concept
        summary: "Where is everybody? Great filters, rare Earth and zoo hypotheses."
      - id: ch21-biosignatures
        title: "The Search for Life"
        kind: concept
        summary: "Mars, Europa, exoplanet atmospheres and what a detection would need."
      - id: ch21-drake-proof
        title: "Guided problem: Estimating Civilisations with Uncertainty"
        kind: guided
        summary: "Guided problem: propagate ranges through the Drake equation and read the result as a distribution, not a number."
      - id: ch21-ufo
        title: "Unidentified Aerial Phenomena"
        kind: concept
        summary: "What reports and official studies show, what explanations exist and the standards of evidence."
      - id: ch21-theology
        title: "Aliens and Theology"
        kind: concept
        summary: "Incarnation, redemption and creation if there are other minds; views from several traditions."
      - id: ch21-copernican
        title: "The Copernican Principle and Our Place"
        kind: concept
        summary: "Mediocrity versus specialness, observation selection and the cosmic perspective."
