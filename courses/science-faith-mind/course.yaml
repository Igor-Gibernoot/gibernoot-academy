      - id: ch21-challenge
        title: "Level Challenge: Are We Alone? The Case"
        kind: challenge
        summary: "Estimate, with explicit assumptions, the odds of life and civilisations, and weigh the evidence offered. (Deep dive.)"

  - id: ch22
    number: 22
    title: "Language, Meaning and Religious Language"
    blurb: "How can words mean anything about God, the soul or the sacred? Meaning and use, verification, analogy, metaphor, myth, ritual speech, interpretation and translation, each according to its thinkers."
    lessons:
      - id: ch22-meaning
        title: "What Does It Mean to Mean?"
        kind: concept
        summary: "Reference, use and verification: Frege, Wittgenstein and the logical positivists on how sentences get meaning."
      - id: ch22-cognitive
        title: "Factual or Not? Cognitivism and Its Rivals"
        kind: concept
        summary: "Ayer, Flew, Braithwaite and Phillips: are religious statements claims about reality or something else?"
      - id: ch22-analogy
        title: "Analogy, Negation and Apophatic Speech"
        kind: concept
        summary: "Aquinas, Maimonides, Pseudo-Dionysius and Eckhart: speaking of the divine by analogy and by saying what it is not."
      - id: ch22-metaphor
        title: "Metaphor, Symbol and Model"
        kind: concept
        summary: "Ramsey, Tillich, Ricoeur and McFague: whether metaphors can be literally true, and what models do in science and theology."
      - id: ch22-myth
        title: "Myth, Story and Narrative Truth"
        kind: concept
        summary: "Eliade, Campbell, Lévi-Strauss and Bultmann: what myths are for, and whether a story can be true without being literal."
      - id: ch22-ritual
        title: "Ritual, Performative Speech and Liturgy"
        kind: concept
        summary: "Austin on doing things with words, vows and blessings, and how scholars of ritual describe sacred speech."
      - id: ch22-hermeneutics
        title: "Interpretation: Literal, Allegorical, Historical"
        kind: concept
        summary: "Philo, Origen, Midrash, tafsir, Gadamer and the hermeneutic circle: how a text is read and who decides."
      - id: ch22-translation
        title: "Translation and What Gets Lost"
        kind: concept
        summary: "Sacred languages, translation of scripture, and Sapir-Whorf: does the language we think in shape the questions we can ask?"
      - id: ch22-sentence
        title: "Guided problem: One Sentence, Four Readings"
        kind: guided
        summary: "Guided problem: take \"God is love\" and test it under four theories of meaning, listing what each makes of it and how it could be checked."
      - id: ch22-traps
        title: "Traps"
        kind: traps
        summary: "Fast questions, each built on a common misconception about this level."
      - id: ch22-intuition
        title: "Quick Recall"
        kind: intuition
        summary: "Mnemonics, distinctions and a small worked example for the level's main ideas."
      - id: ch22-map
        title: "Content Map"
        kind: map
        summary: "Rebuild the level's concept map box by box among look-alike decoys."
      - { id: ch22-review, title: Level Review, kind: review }
      - id: ch22-challenge
        title: "Level Challenge: One Sentence, Several Kinds of Meaning"
        kind: challenge
        summary: "Take one religious sentence and analyse it as a factual claim, a metaphor, a performative act and an expression, each according to a different theory of language. (Deep dive.)"

  - id: ch23
    number: 23
    title: "Faith, Reason and Knowledge"
    blurb: "Is belief without proof irrational? Evidentialism, reformed epistemology, pragmatism, doubt and how to hold convictions responsibly."
    lessons:
      - id: ch23-knowledge
        title: "What Is Knowledge?"
        kind: concept
        summary: "Justified true belief, Gettier cases and reliabilism."
      - id: ch23-evidentialism
        title: "Evidentialism: Clifford"
        kind: concept
        summary: "Is it wrong always, everywhere, to believe on insufficient evidence?"
      - id: ch23-plantinga
        title: "Reformed Epistemology"
        kind: concept
        summary: "Belief in God as properly basic; the Great Pumpkin objection and the reply."
      - id: ch23-pragmatic
        title: "Will to Believe: James and Pascal"
        kind: concept
        summary: "When must we decide before the evidence is in?"
      - id: ch23-fideism
        title: "Fideism, Leap and Doubt"
        kind: concept
        summary: "Kierkegaard, Wittgenstein and the idea that faith is not a hypothesis."
      - id: ch23-disagreement
        title: "Guided proof: Disagreement Among Equals"
        kind: guided
        summary: "Guided proof: what peer disagreement requires of you, in a simple formal model."
      - id: ch23-atheism
        title: "Atheism, Agnosticism and Nonbelief"
        kind: concept
        summary: "Kinds of nonbelief, their history and best arguments, stated as their holders state them."
      - id: ch23-pluralism
        title: "Religious Pluralism: Many Faiths, One Truth?"
        kind: concept
        summary: "Exclusivism, inclusivism and pluralism, and how each handles disagreement among traditions."
      - id: ch23-secular
        title: "Secularism, Church and State"
        kind: concept
        summary: "Separation, establishment and neutrality: how France, the United States, Turkey, India and Islamic states each answer, and the arguments of Locke, Rawls and their critics."
      - id: ch23-fundamentalism
        title: "Fundamentalism and Religious Politics"
        kind: concept
        summary: "Origins of the term, modern movements in several traditions, and scholars' accounts (Marty and Appleby, Armstrong) set against the believers' own."
      - id: ch23-humility
        title: "Intellectual Humility and Honest Doubt"
        kind: concept
        summary: "How to hold views firmly and revisably, and how to talk with those who differ."
      - id: ch23-traps
        title: "Traps"
        kind: traps
        summary: "Fast questions, each built on a common misconception about this level."
