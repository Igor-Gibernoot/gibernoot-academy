    blurb: "What makes a life meaningful, where ethics comes from, and how traditions and philosophers face death."
    lessons:
      - id: ch25-meaning
        title: "Is There Meaning?"
        kind: concept
        summary: "Objective, subjective and hybrid theories of meaning, and what each needs from the universe."
      - id: ch25-ethics
        title: "Where Does Ethics Come From?"
        kind: concept
        summary: "Divine command, natural law, consequences, virtue and evolved morality."
      - id: ch25-death
        title: "Facing Death"
        kind: concept
