      - id: ch23-challenge
        title: "Level Challenge: How Should One Believe?"
        kind: challenge
        summary: "Apply competing norms of belief to concrete cases, religious and not. (Deep dive.)"

  - id: ch24
    number: 24
    title: "Philosophies of Life"
    blurb: "Nihilism, absurdism, existentialism, essentialism, Stoicism, Epicureanism, humanism and more: how thinkers have answered what to do with a life, each by its own premises."
    lessons:
      - id: ch24-essence
        title: "Essence and Existence"
        kind: concept
        summary: "Aristotle and Aquinas on essence, Sartre on existence before essence: do humans have a given nature?"
      - id: ch24-nihilism
        title: "Nihilism and \"God Is Dead\""
        kind: concept
        summary: "Kinds of nihilism, Nietzsche's diagnosis and the replies from believers and nonbelievers."
      - id: ch24-absurd
        title: "Absurdism and Existentialism"
        kind: concept
        summary: "Camus, Sartre, Kierkegaard and Beauvoir: living without cosmic guarantees, and the theistic existentialists."
      - id: ch24-absurd-proof
        title: "Guided proof: Must We Imagine Sisyphus Happy?"
        kind: guided
        summary: "Guided proof: Camus's argument from the absurd to revolt, with the premises exposed and the objections."
      - id: ch24-stoic
        title: "Stoicism"
        kind: concept
        summary: "Epictetus, Seneca and Marcus Aurelius: the dichotomy of control, virtue and acceptance."
      - id: ch24-epicurean
        title: "Epicureanism and Hedonism"
        kind: concept
        summary: "Pleasure as the good, the argument against fearing death, and modern hedonic theories."
      - id: ch24-humanism
        title: "Humanism, Secular and Religious"
        kind: concept
        summary: "Renaissance and Enlightenment humanism, secular humanism and Christian and Islamic humanisms."
      - id: ch24-skeptic
        title: "Skepticism and the Examined Life"
        kind: concept
        summary: "Pyrrho, Socrates and the idea that suspending judgement brings peace."
      - id: ch24-pragmatism
        title: "Pragmatism and Process"
        kind: concept
        summary: "James, Dewey and the test of living consequences."
      - id: ch24-transhuman
        title: "Transhumanism: Escaping Death by Technology"
        kind: concept
        summary: "Radical life extension, uploading and the question of whether this is old religion in new form."
      - id: ch24-traps
        title: "Traps"
        kind: traps
        summary: "Fast questions, each built on a common misconception about this level."
