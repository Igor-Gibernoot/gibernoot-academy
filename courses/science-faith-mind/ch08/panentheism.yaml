id: ch08-panentheism
title: "Panentheism and the Ground of Being"
kind: concept
own: |
  The setting: write $G$ for God and $W$ for the world (the whole universe and its laws). Three families of views differ in how $G$ and $W$ are related. **Panentheism** (Greek *pan*, all; *en*, in; *theos*, God: "all-in-God-ism") is the family of views *according to* which the world is in God and God is in the world, while God is more than the world.
  - **Three relations.** Pantheism, panentheism and classical theism, in order (the symbol $\subsetneq$ reads "is inside, but is not all of"):
  $$\begin{gathered}G = W\\ W \subsetneq G\\ G \neq W\end{gathered}$$
  The middle line is panentheism:
  {{ $$W \subsetneq G$$ }}
  Panentheists keep the world's own reality ("the non-divine keeps its identity"), which pantheism does not; they deny that God is just a separate thing next to the world, which classical theism affirms.
  - **The word.** According to the Stanford Encyclopedia of Philosophy, the German philosopher **Karl Krause** (1781-1832) used the label for the first time in 1821.
  - **Schleiermacher and Tillich.** According to **Friedrich Schleiermacher** (1768-1834), the heart of religion is a {{ **feeling of absolute dependence** }}: the sense that one's whole existence is given from beyond oneself. According to **Paul Tillich** (1886-1965), God is not one more being among beings but **being-itself**, the ground of all that is:
  {{ $$\begin{gathered}\text{God} = \text{being-itself}\\ \text{not a being among beings}\end{gathered}$$ }}
  - **Two readings of "in".** A **locative** reading ("in" as a box holds things) is hard to apply to God, who is not a place; readings in terms of **dependence** (the world's being rests on God) or of **mind and body** (the world as God's "body") are the ones defenders use. Which reading you choose decides how much panentheism differs from the other two.
  - **Physicist-theologians.** **Arthur Peacocke** (d. 2006) argued that God works from inside the natural order and is also more than it; **Philip Clayton** calls God's relation to the world internal; **John Polkinghorne** (1930-2021) is cautious and speaks of panentheism mainly as a destiny at the end of time. Their question is how God acts without breaking nature's laws.
  - **Objection and reply.** Critics say panentheism is vague: a word that stretches between classical theism and pantheism and so marks no clear line. Defenders reply that the line is drawn by two claims taken together: the world depends on God and is in God, yet remains really distinct from God.
  - **Where people part ways.** On whether "in" means anything beyond "depends on" (a layer 2 debate); on whether God is changed by the world (process thinkers yes, classical theists no); on whether this is a middle path or a word that hides a choice. These mix debate (layer 2) and commitment (layer 3).
cards:
  - type: mcq
    id: hook
    title: "Guess: in the world and beyond it?"
    prompt: |
      Guess before any theory. Someone says: "God is not a thing inside the universe, like a planet. But God is not far away outside it either. The universe exists inside God, and God is also more than the universe." Which reaction seems most natural to you?
    options:
      - text: 'It is contradictory: "in" and "beyond" cannot both hold.'
        feedback: |
          A reasonable worry, and a real objection. It depends on what "in" means, which is the core of this lesson.
      - text: 'It could make sense if "in" does not mean "in a box", but something else, like "depends on" or "is part of".'
        correct: true
        feedback: |
          This is the useful guess. The view is called panentheism, and the debate is largely about which meaning of "in" is intended.
      - text: 'It is just pantheism (God is the universe) said in a more complicated way.'
        feedback: |
          A common first impression. The difference is the "more than": panentheists say the world is inside God but not all of God. The lesson tests whether that difference holds.
      - text: 'It is just classical theism with a poetic touch.'
        feedback: |
          Some critics say this. Panentheists reply that classical theism keeps God and world fully separate, while they say the world is in God. Judge it by the end.
    explanation: |
      Keep your guess. Everything is taught *according to* each thinker, with three layers labelled: (1) fact (texts, dates), (2) live scholarly debate, (3) faith or metaphysical commitment.

  - type: text
    id: recap
    title: "Recall: three ways God and the world can relate"
    body: |
      Recall, with $G$ for God and $W$ for the world (the whole universe and its laws):

      - **Spinoza** (1632-1677): **pantheism**, God is the universe, one substance seen as Nature:

      $$G = W$$

      - **Hartshorne** (1897-2000), a process thinker: a **dipolar** God, with an abstract pole that does not change and a concrete pole that takes in the world's experience; "the world is in God".
      - **Classical theism**: God is a creator distinct from the world, not the same as it:

      $$G \neq W$$

      This lesson looks at the family of views between the two: the world is inside God, but God is more than the world.

  - type: text
    id: definition
    title: "Panentheism: all in God"
    body: |
      **Panentheism** comes from three Greek words: *pan* (all), *en* (in), *theos* (God). According to the Stanford Encyclopedia of Philosophy, it considers God and the world to be inter-related, with the world being in God and God being in the world. It is set against pantheism by keeping the identity and significance of the non-divine: you, the stars and the laws of physics are not just God under another name.

      History (layer 1): the German philosopher **Karl Christian Friedrich Krause** (1781-1832) used the explicit label for apparently the first time in 1821. The view is older than the word, and thinkers have been read in this light after the fact.

      In symbols, with $G$ and $W$ as before ($\subsetneq$ reads "is inside, but is not all of"):

      $$W \subsetneq G$$

      The world is inside God, and God is not exhausted by the world. Note: this symbol is a picture of the logic, not a claim that God is a space with the world as a region. That is one of the readings of "in" we examine below.

  - type: mcq
    id: definition-q
    title: "Which relation is which?"
    prompt: |
      Let $G$ = God and $W$ = the world. According to panentheists, which of these captures their view?
    options:
      - text: '$W \subsetneq G$: the world is inside God, and God is more than the world.'
        correct: true
        feedback: |
          Yes. The "inside" is the *en*; the "more than" separates it from pantheism.
      - text: '$G = W$: God and the world are one and the same.'
        feedback: |
          That is pantheism (Spinoza's version). Panentheists reject it because it leaves nothing of God beyond the world.
      - text: '$G \neq W$, and the world is completely outside God.'
        feedback: |
          That is the classical picture of a creator and a separate creation. Panentheists hold that the world is in God, not outside.
    explanation: |
      The three formulas are a map of the debate, not a proof of any of them. Which is true is a layer 3 question; what each means is a layer 2 question.

  - type: text
    id: schleiermacher
    title: "Schleiermacher: religion begins in a feeling"
    body: |
      **Friedrich Schleiermacher** (1768-1834) was a German Protestant theologian and philosopher. In *On Religion: Speeches to Its Cultured Despisers* (1799) and in his major work of systematic theology, *The Christian Faith* (first published 1821-2, revised 1830-1), he argued that religion is not first a set of doctrines or a code of conduct but a kind of immediate self-awareness.

      In essence, according to *The Christian Faith* (section 4), the heart of piety is a **feeling of absolute dependence**: an awareness that one's whole existence, not just this or that part of it, is given and sustained from beyond oneself. "Feeling" here does not mean a passing emotion; scholars warn against reading it that way.

      Where does this touch panentheism? The Stanford Encyclopedia lists Schleiermacher among thinkers who saw the world as in some way in God, and notes that his stress on the human response to God assumes some distinction between God and humans. So he is a thinker some scholars place in the lineage, not a self-declared panentheist. Whether his God is "in" the world or above it has been argued both ways (layer 2).

  - type: mcq
    id: schleiermacher-q
    title: "A feeling of absolute dependence"
    prompt: |
      According to Schleiermacher, what is the "feeling of absolute dependence"?
    options:
      - text: 'An awareness that one''s whole existence is given and sustained from beyond oneself, which he took as the heart of religion.'
        correct: true
        feedback: |
          Yes. The word "absolute" marks that the dependence is total, unlike depending on a friend for help or on food for a day.
      - text: 'Fear of punishment by a judging God.'
        feedback: |
          Fear is a common image of religion, but Schleiermacher's point is a basic awareness of being given to oneself, not an emotion of dread.
      - text: 'A proof that God exists, drawn from the structure of the universe.'
        feedback: |
          He did not offer it as a proof. Scholars debate whether God is given in the feeling or inferred from how it is interpreted, but it starts as an experience, not an argument.
    explanation: |
      Layer 2 note: how far the feeling points to a God who is "in" the world versus above it is read differently by his interpreters.

  - type: text
    id: tillich
    title: "Tillich: God as the ground of being"
    body: |
      **Paul Tillich** (1886-1965) was a German-American Protestant theologian. In his three-volume *Systematic Theology* (1951-63) he presents God as the **ground of being** and speaks of faith as **ultimate concern** (what one is unconditionally concerned about).

      His striking claim, in essence: God is **being-itself**, not **a being**. A being is one thing among things: a tree, a person, even a supreme person. Being-itself is what makes anything be at all. So Tillich says that God does not *exist* in the way a tree does, because that would put God among the things whose existence is in question. Critics, judging by traditional theism, called this atheism; Tillich meant it as a way to take God more seriously, since an object in the world could not be the ground of the world. Other than "being-itself", he held, our statements about God are symbolic.

      Tillich rarely called himself a panentheist, the Stanford Encyclopedia notes, though he shares concepts with panentheism (God as that in which everything has its being). The label is a reading, not his own.

  - type: mcq
    id: tillich-q
    title: "\"A being\" or \"being itself\"?"
    prompt: |
      According to Tillich, why does it mislead to say God is "the highest being" among all beings?
    options:
      - text: 'Because then God would be one more item in the world, and so could not be what grounds the world as a whole.'
        correct: true
        feedback: |
          Yes. A being among beings needs a ground itself. Tillich puts God at the level of the ground, being-itself.
      - text: 'Because God is smaller than the universe and so cannot be the highest.'
        feedback: |
          Tillich's point is not about size. "Highest" still places God on the same ladder as creatures, only further up.
      - text: 'Because he thought God does not matter to human life.'
        feedback: |
          The opposite: he treated God as the object of ultimate concern, what matters unconditionally. The worry is about the category "a being", not about importance.
    explanation: |
      Notice the structure: the world is not outside the ground, since it is nothing without it. That is why Tillich's thought is read as close to panentheism, though he did not adopt the name.

  - type: text
    id: in-readings
    title: "What does \"in\" mean?"
    body: |
      The word "in" in "the world is in God" can mean very different things. The Stanford Encyclopedia lists several; here are four, each *according to* the thinkers who use it:

      - **Locative** (a box holds things): the world sits inside God as in a space. This is problematic, since God is not usually thought of as a place with a boundary.
      - **Dependence or participation**: the world's very being rests on God, so it is "in" God as a drawing is in the mind that holds it up. This is the sense closest to Tillich's ground of being.
      - **Mind and body**: the world is to God as a body is to a mind, which feels and acts through it. Some thinkers use this picture, which fits a God who feels the world.
      - **Part and whole**: the world is a part of God, not all of him. Critics ask how this differs from pantheism.

      Different readings give different consequences, as the next cards show.

  - type: mcq
    id: in-q
    title: "Which meaning of \"in\"?"
    prompt: |
      A defender says: "The universe is in God the way your thoughts are in your mind: not as a thing in a container, but as something that exists only because the mind holds it." Which reading of "in" is this?
    options:
      - text: 'Dependence or participation: the world''s being rests on God.'
        correct: true
        feedback: |
          Yes. "Exists only because the mind holds it" is dependence, not a spatial inclusion.
      - text: 'Locative: the world is a region of a divine space.'
        feedback: |
          The speaker explicitly denies the "container" picture, so it is not this one.
      - text: 'Pantheism: the world is the whole of God.'
        feedback: |
          Pantheism is a claim about identity ($G = W$), not about a way of being "in". This speaker speaks of the world as held by God, not as all there is to God.
    explanation: |
      A critic can ask: if "in" just means "depends on", is the view different from classical theism, which also says the world depends on God? We return to this objection.

  - type: text
    id: physicists
    title: "Physicist-theologians"
    body: |
      Several modern scientists who became theologians have developed panentheist ideas, partly to say how God can act in a world with laws. According to the Stanford Encyclopedia:

      - **Arthur Peacocke** (a biochemist, d. 2006) developed his panentheism from *Creation and the World of Science* (1979), and in *Theology for a Scientific Age* (1990, enlarged 1993) used "downward" causation, a whole acting on its parts. In essence: God continuously creates through the processes of the natural order, working from inside the universe while being more than it. He rejected both interventionist theism (God breaks the laws now and then) and deism (God starts the world and leaves it).
      - **Philip Clayton** (a contemporary philosopher-theologian) describes God's relation to the world as internal, uses the idea of **emergence** (new properties at higher levels that the lower level does not predict) and in *The Problem of God in Modern Thought* (2000) defends the view. He sees God's action as preparing and persuading, not forcing.
      - **John Polkinghorne** (1930-2021), a theoretical physicist who became an ordained priest, is cautious. He has a chapter titled "Panentheism" in *Faith, Science and Understanding* (2000), where he looks again at the idea in light of Clayton's defence, and he has said in an interview that panentheism is better thought of as the destiny of creation at the end of time than as its present condition. He wants to keep the difference between Creator and creation.

      These are three different positions, not one school. (Layer 2.)

  - type: mcq
    id: polk-q
    title: "Which physicist-theologian?"
    prompt: |
      Which statement is a fair *according to* about Polkinghorne's stance on panentheism?
    options:
      - text: 'He treated it with caution and spoke of it mainly as an end-of-time destiny, wanting to keep the Creator-creation distinction.'
        correct: true
        feedback: |
          Yes, in essence. He wrote a chapter on it in 2000 and has been described as holding something like an "eschatological" version.
      - text: 'He was the main founder of modern panentheism and wrote that God is simply the universe.'
        feedback: |
          Neither is right. Peacocke and Clayton are the more usual panentheist names, and "God is the universe" is pantheism, which he kept at a distance.
      - text: 'He rejected any idea of God acting in the world.'
        feedback: |
          He wrote at length about divine action and providence; his worry was how to describe it without making God either remote or merely the universe.
    explanation: |
      The point of the card is attribution: a name next to a view is a claim that can be wrong. When unsure, the safe sentence is "cautious, eschatological".

  - type: mcq
    id: affect-q
    title: "Does the world affect God?"
    prompt: |
      Take three views: classical theism ($G \neq W$, God unchanged by the world), a process thinker like Hartshorne (the world is in God and enriches God's experience), and a panentheist like Peacocke (God works from inside the natural order). Which pairing is accurate, *according to* these thinkers?
    options:
      - text: 'Classical theism says God is unchanged by the world; Hartshorne says God takes in the world''s experience; panentheism as a family leaves this open, with different thinkers answering differently.'
        correct: true
        feedback: |
          Yes. Panentheism, as a label, fixes the "in", not the answer on God's change. Some panentheists follow process thought; others keep more of the classical picture.
      - text: 'All panentheists agree that God is changed by the world, as Hartshorne holds.'
        feedback: |
          Tempting, since Hartshorne used the word. But the label covers thinkers who answer differently, so it is not part of the definition.
      - text: 'Classical theism and panentheism both deny that God and the world are related at all.'
        feedback: |
          Neither does. Classical theism says the world depends on God; panentheism says the world is in God. Both claim a relation; they differ on its kind.
    explanation: |
      Layer 2: this is why critics call the label vague, and why the same word covers quite different positions.

  - type: text
    id: three-questions
    title: "Evil, miracles and prayer under panentheism"
    body: |
      How does a God who is in the world, and works through its processes, meet three old questions? Two views for each, *according to* their defenders. The views are of particular thinkers, not of panentheism as a whole.

      **Evil.** (1) According to many panentheists, God does not cause evil but draws and persuades; Oord, for instance, holds that God's love is inherently uncontrolling. (2) Critics reply that if God can only persuade, the final victory over evil cannot be guaranteed (this is the objection made by Pak and Jensen in the Stanford Encyclopedia's survey).

      **Miracles.** (1) According to Peacocke's account, God acts continuously through the natural order, so a miracle is not a break in the laws but an unusual, meaningful turn of what the processes allow. (2) A classical theist might reply that this reduces the "special" to the ordinary and does not match what religious traditions claim about particular events. This is a debate about the tradition's own sense of the word.

      **Prayer.** The sources we checked do not give a panentheist position on prayer, so we only state the question: if God is in the world and responds to it, in what sense does prayer change anything, and is that different from a classical God who never changes? Here too, answers differ by thinker.

  - type: mcq
    id: evil-q
    title: "A reply to the power-deficit worry"
    prompt: |
      An objector says: "If God only persuades, God cannot guarantee that evil is finally overcome." Which is the best reply open to a panentheist who holds the persuasion view?
    options:
      - text: 'Say that God''s relation to the world is love, not control, and that the good of a real world with real agents is worth a risk.'
        correct: true
        feedback: |
          This is the shape of the standard reply: a world where God overrode every choice would not contain free agents, so the lack of guarantee is a cost the view accepts. Whether the price is worth it is layer 3.
      - text: 'Say that evil does not exist.'
        feedback: |
          This denies the problem instead of answering it, and few panentheists say it.
      - text: 'Say that God causes every evil as part of a plan.'
        feedback: |
          That is a different, more classical (or Spinozist) answer. Panentheists who stress persuasion explicitly reject God as the cause of evil.
    explanation: |
      A fair presentation gives both: the objection is serious, and the reply is a choice of values as much as an argument. The process lesson on persuasion and risk gave the same pattern.

  - type: text
    id: objection
    title: "Objection: just a vague word?"
    body: |
      The strongest objection to panentheism is not that it is false but that it is **unclear**. According to the Stanford Encyclopedia, a main complaint from analytic theologians is that panentheism lacks distinctiveness: it cannot be told clearly from classical theism (which also says the world depends on God) or from pantheism (which also says the world is in God). The entry says the concept may not be philosophically stable in itself.

      Some of the replies it mentions: a distinction based on **modality** (what could have been otherwise), where the question becomes whether the world could have failed to exist while God still would, with panentheists answering one way and classical theists another; or treating features of the world, such as space and time, as divine attributes. These replies are themselves contested.

      The steelman: panentheism earns its place if it asserts something others deny, for example that the world is in God in a sense stronger than "created by". The critic's steelman: the sense is either weak enough to be classical or strong enough to be pantheist.

  - type: mcq
    id: objection-q
    title: "Atheism with a nicer word?"
    prompt: |
      A critic says: "If the world is inside God, you could drop the word God and keep everything." Which reply uses what panentheists actually say?
    options:
      - text: 'The view keeps God as more than the world and the world as really distinct, so it is not identical to a view with no God.'
        correct: true
        feedback: |
          Yes. The "more than" is exactly what a no-God view lacks. Whether the claim is true is another matter, but it is not empty.
      - text: 'The critic is right, and panentheists agree that nothing separates the two.'
        feedback: |
          Panentheists do not concede this. The same objection is aimed more naturally at pantheism, which says $G = W$.
      - text: 'The critic cannot object because only believers may judge panentheism.'
        feedback: |
          This dodges the question. The course steelmans every view and also its strongest objection; objections are heard from everyone.
    explanation: |
      Compare with Spinoza's case: the charge "euphemism for atheism" was aimed at $G = W$. Panentheism answers it with the extra claim $W \subsetneq G$.

  - type: mcq
    id: map-q
    title: "Sort the speakers"
    prompt: |
      Match the speaker to the view: (i) "God is the ground of being, not a being among beings." (ii) "The world is inside God; God is also more than the world." (iii) "God is a creator distinct from the world." Which is right?
    options:
      - text: '(i) Tillich-style ground of being; (ii) panentheism; (iii) classical theism.'
        correct: true
        feedback: |
          Yes. (i) is Tillich's phrasing and can be read as close to panentheism; (ii) is its definition; (iii) is $G \neq W$.
      - text: '(i) pantheism; (ii) classical theism; (iii) panentheism.'
        feedback: |
          This swaps the labels. (iii) is the classical picture of creator and creation, and (ii) is the panentheist definition.
      - text: '(i) classical theism; (ii) pantheism; (iii) panentheism.'
        feedback: |
          (ii) keeps the "more than the world", so it is not $G = W$. And (iii) says God is distinct, which is the classical $G \neq W$.
    explanation: |
      Layer note: assigning (i) to one school is itself debated, since Tillich did not call himself a panentheist and classical theologians also speak of God as the source of being.

  - type: text
    id: part-ways
    title: "Where people part ways"
    body: |
      Thoughtful people split on at least three points, and the reason for each is different:

      - **Does "in" add anything?** Classical theists say that if "in" means "depends on", they already agree. Panentheists say "in" means more than "made by". This turns on how strong a sense of "in" is allowed (layer 2).
      - **Is God changed by the world?** Process thinkers say yes (the world enriches God); classical theists say no (change would show a lack). This turns on which divine attributes one counts as essential (layer 3).
      - **Is it a middle path or a hidden choice?** Defenders see a way to keep God near and beyond; critics see a word that avoids choosing between $G = W$ and $G \neq W$. This turns on values: how much one wants God close, and how much one wants God safe from the world's evils.

      The physicist-theologians add a fourth question: can God act in a world with laws without breaking them? That is partly a scientific question (what do the laws allow?) and partly a metaphysical one.

  - type: text
    id: summary
    body: |
      **Next:** the lesson Saying What God Is Not turns the question around. Instead of saying what God is, it asks what can be said when every positive description seems to fail: the way of negative theology.
