id: ch08-spinoza
title: "Spinoza and Einstein: Nature as God"
kind: concept
own: |
  The setting: **classical theism** says God is a creator distinct from the world. Write $G$ for God and $W$ for the world (the whole universe and its laws). Three views, each *according to* its defenders, differ in how $G$ and $W$ are related. **Pantheism** is the family of views on which God is the universe; its most famous modern version is that of **Baruch Spinoza** (1632-1677), whose *Ethics* was published in 1677.
  - **One substance.** According to Spinoza, there is exactly one **substance** (what exists in itself and is conceived through itself). It is God, with infinitely many **attributes** (ways the intellect perceives its essence; we know two: thought and extension). Everything finite is a **mode**, an affection of that substance, "in" God and not a separate thing:
  {{ $$\begin{gathered}\text{God}=\text{one substance}\\ \text{things}=\text{modes}\end{gathered}$$ }}
  - **Deus sive Natura.** The Latin phrase "God, or Nature" says that God and Nature are one thing under two names:
  {{ $$\text{God} = \text{Nature}$$ }}
  It does not say that God is a person who made Nature, or that Nature is a mere heap of things.
  - **Necessity and no purposes.** According to Spinoza, nothing in Nature is contingent and God could not have produced things in any other way or order; God acts from the necessity of its own nature, not for ends, and the mind has no uncaused free will. In symbols, with $G$ = God, $W$ = the world:
  {{ $$W\ \text{follows from}\ G\ \text{necessarily}$$ }}
  Open theism (see Process Theology and Open Theism) denies exactly this: it holds that some future choices are not yet settled.
  - **Atheist or pantheist?** Contemporaries called Spinoza an atheist (God is not a creator who loves and judges); his defenders say he took reality itself as the object of reverence. Schopenhauer wrote that pantheism is only a euphemism for atheism; the reply is that Spinoza keeps the word and the object of reverence, an infinite, necessary, self-explaining reality. Both are live descriptions of a metaphysical (layer 3) commitment.
  - **Einstein's God.** Einstein (1879-1955), asked in 1929 whether he believed in God, replied in essence that he believed in Spinoza's God, who reveals himself in the lawful harmony of the world, not a God concerned with the fate and doings of humans. In "Religion and Science" (1930) he named his attitude **cosmic religious feeling**: awe at the order of Nature, with no dogma and no God made in human image.
  - **Three views side by side.** With $G$ and $W$ as above, in order: pantheism, panentheism, classical theism:
  {{ $$\begin{gathered}G = W\\ W \subsetneq G\\ G \neq W\end{gathered}$$ }}
  where $\subsetneq$ reads "is inside, but is not all of". Classical theism adds that $G$ acts in $W$ by choice; Spinoza's $G=W$ gives no such separate act.
  - **Where people part ways.** On whether a God without will, purposes or response deserves the word "God"; on whether reverence for lawful Nature is religion or a poetic atheism; on whether necessity leaves room for morality. These mix history (layer 1), debate (layer 2) and commitment (layer 3).
cards:
  - type: mcq
    id: hook
    title: "Guess: could God just be the universe?"
    prompt: |
      Guess before any theory. Imagine someone who says: "I do not pray to a person above the stars. But the universe, with its laws, is vast, orderly and worthy of awe. That is what I mean by God." Which reaction seems most natural to you?
    options:
      - text: 'That is just atheism with a nicer word: if God is only the universe, nothing new has been said.'
        feedback: |
          This is a charge made for centuries, by Schopenhauer among others. A serious answer, and the lesson states it fairly, with the reply.
      - text: 'That is a real kind of belief: it takes the order and depth of reality as sacred.'
        feedback: |
          This is how defenders of pantheism (God is the universe) see it. Also a serious answer, with costs we will see.
      - text: 'It depends on what you want "God" to do: create, answer prayers, judge, love.'
        correct: true
        feedback: |
          This is the most useful guess. The whole debate turns on which roles the word "God" must keep; the other two answers are verdicts on that question.
      - text: 'It cannot be told apart from physics, so the question is empty.'
        feedback: |
          Tempting, but the views do differ on questions of meaning and value, as the lesson shows.
    explanation: |
      Keep your guess. Everything is taught *according to* each thinker, with three layers labelled: (1) fact (texts, dates), (2) live scholarly debate, (3) faith or metaphysical commitment.

  - type: text
    id: recap
    title: "Recall: from a changing God to no separate God"
    body: |
      Recall from Process Theology and Open Theism: **process theologians** (Whitehead, Hartshorne) and **open theists** revised classical theism, but they kept a God who is *someone*: a God who responds, persuades, takes risks, and is distinct from the world (Hartshorne's panentheism, "the world is in God", came with God being more than the world).

      This lesson goes in a different direction: not a God who changes, but a God who is **identical with Nature**. Nothing outside the world, nothing that decides or responds. Two figures stand for it: the philosopher Baruch Spinoza and the physicist Albert Einstein, who said in 1929 that he believed in "Spinoza's God".

      First a glossary: **pantheism** (Greek *pan*, all, and *theos*, God) is the family of views on which God is identical with the cosmos, or the cosmos is wholly divine.

  - type: text
    id: spinoza-life
    title: "Who was Spinoza?"
    body: |
      **Baruch (Benedictus) de Spinoza** (1632-1677) was born in Amsterdam and died in The Hague. According to the Stanford Encyclopedia of Philosophy, on 27 July 1656 the Sephardic (Spanish-Portuguese Jewish) community of Amsterdam issued against him its harshest *herem* (a ban, a formal exclusion from the community), never rescinded.

      His main work, the *Ethics*, was published after his death, in 1677, by his friends. It is written in the style of geometry: **definitions, axioms, propositions and proofs**, as if God and mind were being derived the way a triangle's angles are. Part I is "Concerning God".

      A note on layers: the dates and the ban are layer 1 (history). *Why* the community banned him is told in several ways by historians; we do not need to settle it.

  - type: text
    id: substance
    title: "One substance, many attributes, countless modes"
    body: |
      Spinoza uses three technical words, which we gloss as the Stanford Encyclopedia does:

      - **substance**: "what is in itself and is conceived through itself": something that needs nothing else to exist or to be understood;
      - **attribute**: what the intellect perceives of a substance as making up its essence;
      - **mode**: a thing that is *in* something else, an "affection" of substance. Finite things are modes of God's attributes.

      Part I defines **God** as a substance with infinitely many attributes, each expressing an eternal and infinite essence. According to Spinoza, human beings know only two attributes: **thought** and **extension** (being spread out in space). And, he argues, there can be only one substance: nothing besides God can exist or be conceived.

      So a tree, a thought, you and I are not separate things next to God. We are *modes*, ways God (the one substance) is, in the way a wave is a way the sea is.

  - type: mcq
    id: substance-q
    title: "A tree in Spinoza's world"
    prompt: |
      According to Spinoza, what is a particular tree, in relation to God?
    options:
      - text: 'A mode: a particular way the one substance (God) is, "in" God and not a separate thing.'
        correct: true
        feedback: |
          Yes. Finite things are affections of God's attributes. The wave and sea image is a helpful analogy, not Spinoza's own wording.
      - text: 'A second, smaller substance that God created and then left alone.'
        feedback: |
          That is the classical creation picture. Spinoza argues there is only one substance, so there is nothing created "outside" God.
      - text: 'A part of God in the way a brick is part of a wall, so God is the pile of all things.'
        feedback: |
          Tempting but not Spinoza's view: modes are not parts that add up to God. The one substance is infinite and indivisible in his account, and things are modes of it, not bricks.
    explanation: |
      Layer 3 note: that the universe is one substance is a metaphysical commitment, argued from definitions in the *Ethics*. Critics reject premises about substance; defenders find the argument tight. Either way, the picture is not "God made the world", but "the world is God, seen as many modes".

  - type: text
    id: deus-sive-natura
    title: "\"Deus sive Natura\""
    body: |
      The phrase most linked to Spinoza is *Deus sive Natura*: "God, or Nature". According to the Stanford Encyclopedia, it appears in the Latin *Ethics* (in the preface to Part IV). It says that "God" and "Nature" are two names for the one thing, seen with different emphasis: Nature as *creating* (the substance, its laws), or as *created* (the modes, the world of things).

      What it does **not** say:

      - not that God is a person who made Nature (Spinoza denies the personal God of the Bible, on the standard reading);
      - not that Nature is just a heap of stuff, with no depth: the "Nature" here is infinite, necessary and self-explaining;
      - not simple matter: the attributes include thought as well as extension, so on this view mind is as basic as body.

      Whether the phrase makes Spinoza a pantheist is itself debated: scholars say the label is a family resemblance, not a single doctrine (the Stanford Encyclopedia article on pantheism calls it a family of doctrines).

  - type: mcq
    id: dsn-q
    title: "What does the phrase say?"
    prompt: |
      A friend says: "*Deus sive Natura* means Spinoza believed that God created Nature and then stepped back." According to Spinoza, what is wrong with this?
    options:
      - text: 'It reads a creator outside Nature into the phrase; "God, or Nature" says they are one thing.'
        correct: true
        feedback: |
          Yes. For Spinoza there is no God standing outside Nature to create it.
      - text: 'Nothing: that is exactly what the phrase says, in Latin.'
        feedback: |
          That is a "deist" reading (a creator who steps back), not Spinoza's. The word "sive" means "or" in the sense of "that is".
      - text: 'It says Nature is a person who loves us.'
        feedback: |
          A person-like God is what Spinoza rejects: he calls purposes and personal will human projections.
    explanation: |
      Notice how much weight sits on one small word, "sive". In the three-layer language, what the phrase literally says is layer 1; whether it is pantheism, atheism or something else is layer 2.

  - type: text
    id: necessity
    title: "Necessity and no purposes"
    body: |
      Two consequences follow from this picture, according to the Stanford Encyclopedia.

      **Necessity.** Nothing in Nature is contingent (could have been otherwise); God could not have produced things in any other way or order. God acts from the necessity of its own nature, as the angles of a triangle sum to two right angles from the nature of a triangle.

      **No purposes, no free will in the mind.** God, or Nature, does not act *for ends*; talk of divine purposes is, for Spinoza, a projection of human wishes. The human mind has no uncaused, "free" will: it is determined to will by causes that are themselves determined. What he offers instead is freedom as understanding one's causes and acting from one's own nature.

      Contrast with the previous lesson: open theism holds that some future choices are not yet settled, so the future is open. Spinoza holds the opposite: everything follows necessarily.

  - type: mcq
    id: necessity-q
    title: "Open theism or Spinoza?"
    prompt: |
      Consider the statement "Some future free choices are not yet facts, so even God does not yet know them." Which view does it fit, and which view would reject it?
    options:
      - text: 'It fits open theism; Spinoza rejects it, since for him everything follows necessarily from the nature of God and nothing is "not yet settled".'
        correct: true
        feedback: |
          Yes. The two sit at opposite ends on this point, although both depart from the classical God in other ways.
      - text: 'It fits Spinoza, who says the future is open.'
        feedback: |
          Reversed. Spinoza says nothing is contingent and God could not have produced things otherwise.
      - text: 'It fits both: they both deny that God knows the future.'
        feedback: |
          They differ: open theists deny God knows the unsettled part because it is unsettled; for Spinoza nothing is unsettled.
    explanation: |
      A caution: Spinoza's necessity is a *consequence of his definition of God*, argued from premises; critics feared it made morality empty. Spinoza's defenders reply that understanding one's own nature is the only freedom worth wanting. A reader may reject the premises and keep the rest.

  - type: text
    id: atheism-charge
    title: "Pantheist or atheist?"
    body: |
      Spinoza was denounced as an atheist after his death. Some background, from the history of the *pantheism controversy*: in 1785 Friedrich Jacobi published a book on Spinoza's doctrine (written as letters to Moses Mendelssohn) saying Spinozism amounts to atheism; Goethe and Herder rejected that reading.

      **The charge** (steelmanned). A God who has no will, no purposes, no response to prayer, no love and no creative act is not what religions mean by God. Schopenhauer wrote that pantheism is only a euphemism for atheism, and Richard Dawkins called it "sexed-up atheism" (both are reported in the Stanford Encyclopedia).

      **The reply** (steelmanned). Spinoza keeps what he thinks matters: an infinite, necessary, self-explaining reality that is the object of reverence and of understanding. The defenders say it is the *crude* picture of God, a person with moods, that is an idol; the highest love of God, in the *Ethics*, is intellectual understanding of Nature. Whether "God" may name such a reality is a question about words and values, not only about facts.

  - type: mcq
    id: atheism-q
    title: "Which side does this reply belong to?"
    prompt: |
      Someone says: "Saying 'God' for the universe changes no fact about the universe; it only adds a word." Which is the best reply *from* a defender of pantheism?
    options:
      - text: 'The word carries an attitude, awe, reverence and the claim that reality is one, necessary and intelligible, which a plain "universe" does not state.'
        correct: true
        feedback: |
          Yes. This is the "it is an attitude and a metaphysics, not a new fact" reply. A critic can still ask whether the attitude needs the word.
      - text: 'The universe has a mind that answers prayers, so it differs from the physicist''s universe.'
        feedback: |
          That would be a different position (see the next lesson). Spinoza's God has no will and does not answer prayers.
      - text: 'Facts are not important, only words.'
        feedback: |
          No defender says this. The reply is that the word expresses a view about *how* reality is, and what response is fitting.
    explanation: |
      A fair summary: pantheism and atheism may agree on the physics and differ on whether the universe deserves reverence and the word "God". That is mostly layer 3.

  - type: text
    id: einstein-1929
    title: "Einstein: \"Spinoza's God\""
    body: |
      **Albert Einstein** (1879-1955) was asked by telegram in April 1929, by Rabbi Herbert S. Goldstein of New York, whether he believed in God. His reply, in English translations that vary slightly, was in essence: *he believed in Spinoza's God, who reveals himself in the lawful harmony of the world, and not in a God who concerns himself with the fate and doings of humankind.* (We paraphrase because no single wording is confirmed as the original.)

      In an essay, "Religion and Science" (*New York Times Magazine*, 9 November 1930), Einstein described three stages of religion: a religion of **fear**, a **moral** religion, and a third, the **cosmic religious feeling**, which according to him knows no dogma and no God made in the human image and is, he argued, the strongest and noblest motive for scientific research.

      A famous remark, from a letter to Max Born of 4 December 1926: Einstein wrote that quantum mechanics was impressive but did not bring him closer to the secret of "the Old One" (in one standard translation), and that he was convinced "He" does not play dice. The popular "God does not play dice" is a paraphrase. The context is physics (he doubted that nature is fundamentally random), and "the Old One" is a figure of speech for the order of nature, not a claim about a person.

  - type: mcq
    id: einstein-q
    title: "What Einstein's remark is about"
    prompt: |
      Einstein wrote in 1926 that he was convinced "He" does not play dice. Which is the best reading of the remark, in its context?
    options:
      - text: 'It expresses his doubt, in a letter to the physicist Max Born, that nature is fundamentally random, using "He" as a figure for the order of nature.'
        correct: true
        feedback: |
          Yes. It is a remark about quantum mechanics, and it fits his admiration for lawful order. It does not reveal belief in a personal God.
      - text: 'It proves Einstein believed in a personal God who rolls or refuses to roll dice.'
        feedback: |
          The words are figurative. Einstein said elsewhere that he did not believe in a God concerned with human affairs.
      - text: 'It shows quantum mechanics is false.'
        feedback: |
          Experiments since (see the Bell lesson) have tested the alternatives he favoured. The remark expresses his conviction then, not a refutation.
    explanation: |
      Layers: the letter and its date are layer 1; whether Einstein was a "pantheist", "deist" or "agnostic" is layer 2, since he used none of these labels consistently; his awe at order was his own layer-3 commitment.

  - type: mcq
    id: letter-1954
    title: "A personal God? Einstein in 1954"
    prompt: |
      In a letter of 3 January 1954 to the philosopher Eric Gutkind, Einstein wrote (in German; English translations vary) that the word "God" is for him nothing but the expression and product of human weaknesses. How does this fit with his 1929 reply that he believed in "Spinoza's God"?
    options:
      - text: 'Consistently: he rejected a personal God who answers and judges, while keeping awe at the lawful order of the world.'
        correct: true
        feedback: |
          Yes. In both texts he rejects the God of the fate and doings of mankind. The 1954 remark is about the word as used for a human-like God; the 1929 one affirms the order of nature.
      - text: 'He changed from believing in God in 1929 to atheism in 1954.'
        feedback: |
          Tempting, but his 1954 letter does not retract the 1930 essay's cosmic religious feeling. Biographers disagree on labels; the lesson does not settle it.
      - text: 'The letter shows he secretly believed in a personal God.'
        feedback: |
          It says the opposite: that the God-concept he rejects is a human projection.
    explanation: |
      A caution: the English wording of the 1954 letter varies between translations ("nothing but" vs "nothing more than", "weakness" vs "weaknesses"), so we paraphrase. What is firm is the direction: Einstein rejected a personal God and kept a sense of awe at the rational order of nature.

  - type: mcq
    id: three-views
    title: "Three views side by side"
    prompt: |
      Let $G$ be God and $W$ the world (the whole universe and its laws). View (a): $G=W$. View (b): $W$ is inside $G$, but $G$ is more than $W$. View (c): $G\neq W$, $G$ made $W$ and is distinct from it. Which pairing is right, according to the Stanford Encyclopedia's definitions?
    options:
      - text: '(a) pantheism, (b) panentheism, (c) classical theism.'
        correct: true
        feedback: |
          Yes. Pantheism: God is identical with the cosmos. Panentheism: God includes but is not exhausted by the universe. Classical theism keeps God and creation distinct, and uses creation from nothing to say so.
      - text: '(a) panentheism, (b) pantheism, (c) classical theism.'
        feedback: |
          The names are swapped: "pan-en-theism" is "all-in-God", and God exceeds the all. Pantheism says God and the all are one.
      - text: '(a) classical theism, (b) pantheism, (c) panentheism.'
        feedback: |
          Classical theism keeps God distinct from the world; it is view (c).
    explanation: |
      Hartshorne's panentheism (see Process Theology and Open Theism) and the next lesson's theme sit in the middle. Note that classical theism also says God is *present* everywhere (omnipresence), without saying God *is* the world.

  - type: mcq
    id: prayer
    title: "Prayer under pantheism: two views"
    prompt: |
      If God is the universe itself, does it make sense to ask God for something? Which statement correctly reports views from the Stanford Encyclopedia?
    options:
      - text: 'Most pantheists thought one cannot petition the universe itself; Fechner argued petition makes sense because we already exist within God.'
        correct: true
        feedback: |
          Yes: two views. On the first, prayer becomes contemplation or gratitude, not request. On the second (Gustav Fechner, a 19th-century German philosopher), speaking to the whole we are in is possible.
      - text: 'All pantheists agree prayer is pointless.'
        feedback: |
          Not so; Fechner is a counterexample, and prayer as meditation is common.
      - text: 'All pantheists hold prayer changes the weather.'
        feedback: |
          Spinoza's necessity rules out such changes; this is not pantheism's standard claim.
    explanation: |
      Whether prayer as contemplation is still prayer is a question for the traditions themselves.

  - type: mcq
    id: evil
    title: "Evil under pantheism: two replies"
    prompt: |
      If everything is God and God is good, should everything be good? Pantheists reply in different ways. Which is the reply given by Spinoza, as the Stanford Encyclopedia reports it?
    options:
      - text: 'Evil and error belong to the fragmentary view of finite beings and disappear in the complete view that God has.'
        correct: true
        feedback: |
          Yes. A second pantheist reply (not Spinoza's) says the best whole need not make every part best, since part of the cosmos's perfection may come through moral choices.
      - text: 'Evil is created by a rival god.'
        feedback: |
          That is dualism, not Spinoza.
      - text: 'God permits evil to give creatures free will.'
        feedback: |
          That is the free-will defence of classical theism; Spinoza denies uncaused free will.
    explanation: |
      Critics reply that calling suffering "a limited view" does not comfort the one who suffers. Compare the theodicies in the lessons on evil: here the problem is dissolved by changing the picture of God, not solved within it.

  - type: mcq
    id: miracles
    title: "Miracles under pantheism: two views"
    prompt: |
      A miracle, in the classical sense, is an event where God acts in a way that goes beyond the regular course of nature. On a view where God is Nature and everything follows necessarily from it, which statement is a fair report of views?
    options:
      - text: 'Spinoza defines a miracle as an event whose cause natural reason cannot explain from known workings of nature, and rejects the idea of a violation of natural law, since the laws are God''s own nature; others keep the word for striking events of the same order.'
        correct: true
        feedback: |
          Yes: in Spinoza's view nature is not interrupted from outside. (This is the reading of his Theological-Political Treatise.) The other view keeps the word for events with special meaning, without any break in the laws.
      - text: 'Miracles are common, since God can suspend the laws at will.'
        feedback: |
          That is the classical view, which needs a God distinct from the laws. For Spinoza the laws are God.
      - text: 'There are no events with meaning at all.'
        feedback: |
          Pantheists can speak of meaning (awe, understanding); the issue is whether the laws are broken.
    explanation: |
      Compare the later lesson on Hume and miracles: his argument is about evidence for a break in the laws; Spinoza's is that a break makes no sense if God is the laws.

  - type: mcq
    id: objections
    title: "Objections and replies"
    prompt: |
      Consider the objection: "If everything follows necessarily from God, nobody is responsible for anything; morality collapses." Which is the best reply *from a defender of Spinoza*?
    options:
      - text: 'Moral life does not need uncaused will: we still understand causes, correct errors and act from our own nature, and necessity does not mean we are forced from outside.'
        correct: true
        feedback: |
          Yes. This is the "compatibilist" kind of reply (freedom as acting from one's own nature). A critic can answer that this redefines responsibility.
      - text: 'Spinoza does not hold that everything follows necessarily.'
        feedback: |
          He does (Ethics I, as the Stanford Encyclopedia notes).
      - text: 'Morality is only a custom with no basis.'
        feedback: |
          Spinoza gives an account of virtue as understanding and acting from one's nature. He does not say morality has no basis.
    explanation: |
      A second objection: reverence needs an other to revere. The reply: reverence for the whole one is part of is a familiar religious attitude. Whether such reverence suffices for worship is again where people part ways.

  - type: text
    id: open
    title: "What changes, what stays open"
    body: |
      **What this lesson clarified.** Pantheism is not a single doctrine: Spinoza's is a rigorous, necessitarian version in which God is Nature, with no purposes or personal will. Einstein admired this God, according to his 1929 reply, and rejected a personal one, according to his 1930 essay and 1954 letter.

      **What stays open.**

      - Whether "God" may name an impersonal, necessary Nature, or whether the word loses its point (layer 3, with word-use arguments from layer 2).
      - Whether necessity empties morality, or whether freedom as understanding is enough.
      - Whether reverence for the whole is religion, a poetic atheism, or both. A thoughtful believer, atheist and agnostic can each find a place on this map.

      **Two different questions.** "Does the universe deserve awe?" and "Is there a God who acts and cares?" can get different answers. The next lesson looks at views in between: God in the world and beyond it.

  - type: text
    id: summary
    body: |
      **Next:** Panentheism and the Ground of Being: God in the world and beyond it, according to Tillich, Schleiermacher and modern physicist-theologians.
