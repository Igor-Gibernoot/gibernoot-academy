id: ch08-process
title: "Process Theology and Open Theism"
kind: concept
own: |
  The setting: **classical theism** is the view that God is **immutable** (cannot change), **impassible** (cannot be acted on or made to suffer) and **timeless** (outside time). Two modern families of thinkers revise it, each *according to* its own defenders: **process theology** (Alfred North Whitehead, Charles Hartshorne, John Cobb, David Ray Griffin) and **open theism** (Clark Pinnock, William Hasker, John Sanders and others).
  - **Process thought.** According to Whitehead, the basic units of reality are momentary events ("actual entities"), each with some power of self-determination. God is one such reality that is in process too. According to Hartshorne, God is **dipolar** (two-poled): the abstract pole is God's enduring character (for example, love and wisdom), the concrete pole is God's changing experience of each moment. In symbols, with $C$ = God's character and $E(t)$ = God's experience at time $t$:
  {{ $$C\ 	ext{never changes}$$ }}
  {{ $$E(t)\ 	ext{changes with the world}$$ }}
  - **Persuasion, not coercion.** According to process theists, God influences each creature by offering it possibilities (persuading), and cannot override its self-determination (coercing): {{ God acts by persuasion rather than by coercion }}. Whitehead calls God "the great companion—the fellow-sufferer who understands". Griffin names the **omnipotence fallacy**: assuming that an omnipotent being could, by itself, bring about any logically possible state of affairs, which in this view includes the free acts of others.
  - **Open theism.** According to Pinnock, Hasker and Sanders, creatures have **libertarian free will** (their choices are not fixed by prior causes), so the future is partly unsettled and God, who knows everything knowable, does not know the unsettled part in advance. Writing $F$ for a future free choice not yet made:
  {{ $$F\ 	ext{is not yet a fact}$$ }}
  so there is nothing yet for God to know.
  God therefore takes **risks** in making free creatures. Unlike process thought, open theism keeps creation *ex nihilo* (from nothing).
  - **Where the two agree and differ.** Both reject divine impassibility and a God who fixes everything; both say the future is partly open. They differ on whether God's limits are built into reality (process) or follow from God's own free choice to create free creatures (open theism, according to its defenders).
  - **Objections.** Critics charge a **power-deficit** (a God not omnipotent in the classical sense) and a departure from the inherited doctrine of providence. Replies: process thinkers say classical power is the wrong ideal and persuasion is the higher kind; open theists say God keeps full power but chose to share it.
  - **Where people part ways.** On which of God's attributes (power, knowledge, changelessness) is the one to revise; on whether the scriptural God or the philosopher's perfect being is the guide; on whether freedom needs a real openness of the future. Layer 3 (faith) commitments and layer 2 (live debate) both enter.
cards:
  - type: mcq
    id: hook
    title: "Guess: can God change?"
    prompt: |
      Guess before any theory. Imagine a God who loves the world. Which of these seems most natural to you?
    options:
      - text: 'God is perfect, so God cannot change at all: any change would be a gain or a loss.'
        feedback: |
          This is the classical position, held for centuries by many Jewish, Christian and Muslim thinkers. A serious answer, and the lesson states it fairly.
      - text: 'A God who truly loves would be affected by what happens to us: God can feel, respond and even be surprised.'
        feedback: |
          This is the instinct behind both views in this lesson. A serious answer too, with costs we will see.
      - text: 'Both are partly right: some things about God never change (character), other things do (experience).'
        correct: true
        feedback: |
          This is close to the process proposal, where one pole of God stays fixed and the other changes. It is not the only reasonable guess, but it is the most structured.
      - text: 'The question has no sense: God is not the kind of thing that can change or not.'
        feedback: |
          Some traditions say this (a later lesson on negative theology), but the process and open views take the question literally.
    explanation: |
      Keep your guess. Everything is taught *according to* each school, with three layers labelled: (1) fact (texts, dates), (2) live scholarly debate, (3) faith or metaphysical commitment.

  - type: text
    id: classical
    title: "The classical picture"
    body: |
      Many classical theists (Aquinas and others) held that God is:

      - **immutable**: God cannot change, since change means gaining or losing some perfection;
      - **impassible**: God cannot be acted on from outside, so cannot suffer in the way creatures do;
      - **timeless**: God is outside time, as the lesson God and Time described, for example in the tradition of Boethius.

      Process theology and open theism are two modern answers to the worry that this God is too static to be the loving, responsive God of the scriptures. They answer in different ways.

  - type: mcq
    id: foreknowledge-recall
    title: "Recall: the foreknowledge argument"
    prompt: |
      Recall from the lesson God and Time: **the foreknowledge argument** says that if God infallibly knew yesterday that you would do $A$ tomorrow, then you cannot do otherwise tomorrow, so the act is not free. Classical theists reply in several ways, for example that God is outside time and "knows" no "yesterday". A different reply is to deny that God knows, in advance, what free creatures will freely choose. Which view does this last reply fit?
    options:
      - text: 'Open theism: the future free choice is not yet a fact, so God does not know it in advance.'
        correct: true
        feedback: |
          Yes. This is the open theist reply, defended for example by Hasker in his book *God, Time, and Knowledge* (1989), while keeping God's knowledge of everything knowable.
      - text: 'Boethius: God sees all moments at once from outside time.'
        feedback: |
          That is a classical reply: God knows the choice, but not "in advance". The open theist reply is different, God does not know the choice before it is made.
      - text: 'Spinoza: there are no free choices.'
        feedback: |
          Denying freedom is another way out of the argument, but not the open theist one, which keeps libertarian freedom.
    explanation: |
      Notice the structure: the foreknowledge argument has a premise (God knows the future free act) that the classical theist keeps and reinterprets, and the open theist drops.

  - type: text
    id: whitehead
    title: "Whitehead: reality as process"
    body: |
      **Alfred North Whitehead** (1861-1947), a mathematician turned philosopher, set out his metaphysics in *Process and Reality* (1929). According to Whitehead, the basic units of reality are not enduring lumps of matter but momentary **events** he called **actual entities**; each takes in the past, makes a self-determined response, and then passes on to be input for later events. The world is process (becoming), not a collection of fixed things.

      Two features matter here. First, every actual entity has some power of **self-determination**, so there is freedom all the way down, not only in humans. Second, God is not an exception to the rules: according to Whitehead, God is also part of the process, not outside it. (How far Whitehead's own God is dipolar is the next card.)

  - type: mcq
    id: whitehead-q
    title: "What is basic?"
    prompt: |
      According to Whitehead in *Process and Reality*, which statement about the basic units of reality is correct?
    options:
      - text: 'They are momentary events, each with some self-determination, that become and then pass into later events.'
        correct: true
        feedback: |
          Yes. "Process" refers to this becoming.
      - text: 'They are unchanging atoms; process is just their motion.'
        feedback: |
          That is the older picture Whitehead opposed. For him, becoming is basic, not a surface feature.
      - text: 'They are ideas in God''s mind and nothing else.'
        feedback: |
          That is a form of idealism (the lesson on idealism), not Whitehead's actual entities, which are events with their own self-determination.
    explanation: |
      From this metaphysics follow the process claims about God: if every event has a little self-determination, no one, not even God, can fully determine what it will be.

  - type: text
    id: hartshorne
    title: "Hartshorne: the dipolar God"
    body: |
      **Charles Hartshorne** (1897-2000) developed and defended these ideas, notably in *The Divine Relativity* (1948). He called God **dipolar** (two-poled). According to Hartshorne, God's **abstract pole** is God's enduring character, which never changes (being loving, wise, existing); God's **concrete pole** is God's actual, changing experience, which embodies that character in successive states and grows as the world does. (Whitehead used "dipolar" differently, for the "primordial" and "consequent" natures of God.)

      Hartshorne also used the word **panentheism** (borrowed from Karl Krause, 1781-1832): the world is *in* God, but God is more than the world. A later lesson, Panentheism and the Ground of Being, takes this up.

      A short analogy: a person keeps the same character through life while experiencing new things every day.

  - type: mcq
    id: dipolar-q
    title: "Which pole changes?"
    prompt: |
      According to Hartshorne, God's abstract pole is God's enduring character and the concrete pole is God's experience of each moment. A friend objects: "Either God changes or God does not; you cannot have both." Which reply is faithful to Hartshorne's view?
    options:
      - text: 'God''s character does not change (abstract pole), but God''s experience does (concrete pole); the two claims are about different poles.'
        correct: true
        feedback: |
          Yes. The objection runs the two together. The claim is dipolar on purpose.
      - text: 'God changes completely, including character, from day to day.'
        feedback: |
          Hartshorne wanted God's character to be reliably the same; otherwise nothing guarantees God's goodness.
      - text: 'God does not change at all, and "experience" is a metaphor.'
        feedback: |
          That is the classical view. Hartshorne takes God's experience literally.
    explanation: |
      The proposal is to split what the classical view put into one word, "unchanging". Whether this split is coherent, or preserves enough of God's perfection, is part of the debate.

  - type: text
    id: persuasion
    title: "Persuasion, not coercion"
    body: |
      A central process slogan is that **God acts by persuasion rather than by coercion**. According to process theists, God offers each creature possibilities and a "lure" toward the good, and the creature decides, since every creature has some self-determination. Process thinkers often add that the slogan is easy to misread: on Griffin's reading God is not only an ideal that attracts but an actual influence on events.

      God is also affected in return. Whitehead called God "the great companion—the fellow-sufferer who understands" (*Process and Reality*, 1929). Hartshorne put the same idea as God feeling *how* we feel without feeling *as* we feel (as I may know your grief without having your grief). Whitehead also wrote that it is as true to say that God creates the World as that the World creates God.

  - type: mcq
    id: persuasion-q
    title: "Weak or just different?"
    prompt: |
      A critic says: "If God only persuades and never forces, then God is simply weak." According to process theists, which is the best reply?
    options:
      - text: 'Persuasion is a higher kind of power than force: a parent uses coercion only as a last resort, and one cannot persuade beings with no freedom at all.'
        correct: true
        feedback: |
          Yes, roughly Cobb's point that coercion is a last resort, and the point that persuasion needs free creatures to be persuaded. The reply changes what "power" should mean.
      - text: 'God is indeed weak, but a weak God is easier to love.'
        feedback: |
          Process thinkers do not say this. They claim persuasive power is real and pervasive, not a consolation prize.
      - text: 'God can coerce but never wants to.'
        feedback: |
          That is closer to the open theist or to a classical reply. Standard process thought says God cannot unilaterally override creaturely self-determination.
    explanation: |
      Notice the form of the reply: it does not deny the limit, it argues the limit is not a defect.

  - type: text
    id: cobb-griffin
    title: "Cobb, Griffin and the problem of evil"
    body: |
      **John B. Cobb Jr.** (1925-2024) and **David Ray Griffin** brought process thought to theology. Griffin's book *God, Power, and Evil: A Process Theodicy* (1976) argues for what he calls avoiding **the omnipotence fallacy**: assuming that an omnipotent being could by itself bring about any logically possible state of affairs. In the process view, creatures' self-determination is real and cannot be overridden even by God, so God cannot single-handedly stop a particular evil.

      Cobb and Griffin also wrote *Process Theology: An Introductory Exposition* (1976). On the problem of evil, the difference from the classical view is the question asked: not "why does God permit this?" but "what can a persuading God do?"

  - type: mcq
    id: evil-q
    title: "A process answer to evil"
    prompt: |
      According to Griffin's process theodicy, why is there evil in a world whose God is perfectly good?
    options:
      - text: 'God cannot unilaterally prevent it: creatures have a self-determination God cannot override, so God persuades but cannot guarantee outcomes.'
        correct: true
        feedback: |
          Yes. The limit is part of what God and creatures are, not a decision God took.
      - text: 'God could prevent every evil but allows it for a greater good.'
        feedback: |
          That is a greater-goods theodicy (an earlier lesson), common in classical theism. It keeps the classical notion of power that Griffin rejects.
      - text: 'There is no evil, only our limited view.'
        feedback: |
          That is a different position. Process thinkers treat evil as real.
    explanation: |
      Compare the question this answer leaves: if God cannot prevent horrors, in what sense is God worth worship or hope? Process thinkers answer with God's companionship and God's lure toward the good; critics find it thin.

  - type: text
    id: open
    title: "Open theism"
    body: |
      **Open theism** arose among Christian (largely evangelical) thinkers. Five authors, David Basinger, William Hasker, Clark Pinnock, Richard Rice and John Sanders, published *The Openness of God: A Biblical Challenge to the Traditional Understanding of God* (1994), and Sanders's *The God Who Risks: A Theology of Providence* (1998) argued that God takes risks in making free creatures.

      According to open theists, creatures have **libertarian free will**: their choices are not fixed in advance by prior causes. So the future is partly unsettled; Pinnock describes it as partly settled and partly unsettled, and so partly unknown even to God. God knows everything that can be known, including all possibilities, and is not surprised in any harmful way, but does not know in advance what free creatures will choose. God is also responsive: according to open theists, God really interacts, for example in answering prayer.

      Open theists keep much that process thinkers drop: God made the world from nothing (*ex nihilo*) and God can perform miracles (Hasker and Sanders both say so).

  - type: mcq
    id: open-q
    title: "Does God lose omniscience?"
    prompt: |
      A critic says: "If God does not know what free creatures will do, then God is not omniscient." Omniscience means knowing every true proposition. Which is the open theist reply?
    options:
      - text: 'A future free choice not yet made is not yet a true proposition, so there is nothing to know; God still knows everything that is knowable.'
        correct: true
        feedback: |
          Yes. This echoes the definition of omniscience from the lesson on God's attributes: knowing every $p$ that is true. The reply is that "$F$ will happen" has no truth value yet.
      - text: 'God knows it but chooses to forget.'
        feedback: |
          Open theists do not say that. God's ignorance of the unsettled is not forgetting.
      - text: 'God is not omniscient, and that is fine.'
        feedback: |
          Open theists claim a revised definition of omniscience, not the loss of it.
    explanation: |
      Layer 2 debate: whether future contingents have a truth value now is disputed in philosophy; classical theists and Molinists answer yes (or that God knows by other means), so the dispute is real.

  - type: mcq
    id: compare-q
    title: "Process or open?"
    prompt: |
      Both views reject an impassible God and say the future is partly open. Which statement correctly separates them, according to their defenders?
    options:
      - text: 'Process theists deny creation from nothing and see God''s limits as built into reality; open theists keep creation from nothing and say God chose to make free creatures.'
        correct: true
        feedback: |
          Yes. Hasker and Sanders stress that open theism is not process theism.
      - text: 'Open theists deny that God acts in the world; process theists affirm it.'
        feedback: |
          Reversed in part: open theists say God acts and can perform miracles, and God acts for process theists by persuasion.
      - text: 'They are the same view under two names.'
        feedback: |
          Open theists in particular reject this identification.
    explanation: |
      Open theism has been called a third alternative between classical and process theism. Some open theists describe God's limits as self-limitation; others say limits follow logically from creating free agents.

  - type: text
    id: three-topics
    title: "Evil, prayer and miracles: two views"
    body: |
      | Topic | Process theology | Open theism |
      |---|---|---|
      | **Evil** | God cannot single-handedly prevent it | God risks it by creating free creatures |
      | **Prayer** | God responds to creatures, so prayer is part of what God responds to | God really responds to prayer |
      | **Miracles** | Griffin argues for a naturalistic theism, without supernatural intervention | God can perform miracles (Hasker, Sanders) |

      Process thinkers differ among themselves: Rem Edwards, revising the view, says God could work an occasional miracle or two. The table gives standard positions, not a verdict.

  - type: mcq
    id: miracles-q
    title: "Why do they differ on miracles?"
    prompt: |
      Open theists hold that God can perform miracles; Griffin, a process theologian, argues for a naturalistic theism without supernatural interventions. Which premise explains the difference?
    options:
      - text: 'Open theists keep God''s power to intervene (God chose to share power); standard process thought says God cannot override creaturely self-determination.'
        correct: true
        feedback: |
          Yes. Both agree on freedom, but differ on whether God's power is limited by nature or by choice.
      - text: 'Open theists reject science, process theists accept it.'
        feedback: |
          Neither rejects science. The difference is about what God can do.
      - text: 'Process theists think miracles are impossible because the universe is eternal.'
        feedback: |
          Eternity of the universe is a separate process claim; it is not the reason. The reason is the limit on coercion.
    explanation: |
      A pattern: where the two views disagree, it usually traces to one question, whether God's power is limited by the nature of things or by God's own decision.

  - type: mcq
    id: objections
    title: "Objections and replies"
    prompt: |
      Critics raise a **power-deficit** objection: a God who cannot control events, or does not know the future, is not the all-powerful, all-knowing God of the tradition. Which reply answers it from the process side?
    options:
      - text: 'Classical omnipotence is the wrong ideal: absolute control makes God responsible for every evil, and persuasive power is what a loving God would have.'
        correct: true
        feedback: |
          Yes. Process thinkers argue that the God of classical theism is too active and too controlling.
      - text: 'God is all-powerful but chose not to use that power.'
        feedback: |
          That is closer to the open theist answer.
      - text: 'The tradition never said God is all-powerful.'
        feedback: |
          The tradition did say so. The reply revises the meaning, it does not deny the claim.
    explanation: |
      Second objection: process and open views depart from the tradition. Traditional evangelicals worry an uncertain future complicates divine providence; process thinkers call the classical "unmoved mover" formula non-biblical. Both sides appeal to scripture, so it is a dispute about interpretation, not only philosophy.

  - type: mcq
    id: premise-q
    title: "Which premise changes?"
    prompt: |
      Match the revision to the view. Classical theism says God is timeless and knows all future free acts. Open theism, on foreknowledge, rejects which claim?
    options:
      - text: 'That God knows in advance what free creatures will choose.'
        correct: true
        feedback: |
          Yes. It keeps freedom and drops advance knowledge of free acts.
      - text: 'That creatures are free.'
        feedback: |
          Freedom is what open theism keeps.
      - text: 'That God exists.'
        feedback: |
          Not at issue: both are forms of theism.
    explanation: |
      Process theology changes more: it revises God's relation to time, to creation and to power. Open theism changes mainly God's knowledge of the future and the extent of control.

  - type: mcq
    id: stays-open
    title: "What stays open"
    prompt: |
      A reader says: "I see what each view claims. I still cannot say which is right." Which is a fair assessment?
    options:
      - text: 'It is fair: the answer depends on whether one trusts classical perfect-being reasoning, the scriptural picture of a responsive God, or freedom-first metaphysics, which the lesson does not decide.'
        correct: true
        feedback: |
          Yes. Knowing the premise on which the views split is the aim.
      - text: 'It shows the reader did not learn anything.'
        feedback: |
          Knowing what each answer depends on is progress.
      - text: 'It is wrong: science settles whether God changes.'
        feedback: |
          Science does not settle this metaphysical question.
    explanation: |
      Believers, agnostics and atheists can all agree on the structure of the question while answering differently.

  - type: text
    id: summary
    body: |
      **Next:** a very different answer to what "God" means: Spinoza and Einstein, where God is Nature itself (pantheism), in the lesson Spinoza and Einstein: Nature as God.
