id: ch08-attributes
title: "The Omni-Attributes"
kind: concept
own: |
  The setting: **classical theists** (those who hold the traditional Jewish, Christian and Islamic picture of one perfect God) say God has the "omni" attributes: all-powerful, all-knowing, wholly good. Write $s$ for a *state of affairs* (a way things might be, such as "this stone exists"), $\Diamond s$ for "$s$ is possible" (true in at least one possible world), $\mathrm{Can}(g,s)$ for "God $g$ can bring about $s$", $N$ for God's nature (the properties God has essentially), and $K_S\,p$ for "the subject $S$ knows the proposition $p$".
  - **Omnipotence has several precise readings.** According to the usual reading of Descartes, God can bring about even the impossible; according to Aquinas, only what does not imply a contradiction is within the scope of omnipotence; a third reading also asks that the act fit God's nature. The possible-worlds reading of the second:
  {{ $$\forall s\,\big(\Diamond s\Rightarrow\mathrm{Can}(g,s)\big)$$ }}
  and the nature-limited reading:
  {{ $$\forall s\,\big(\Diamond(s\land N)\Rightarrow\mathrm{Can}(g,s)\big)$$ }}
  - **The stone paradox** ("can God make a stone too heavy for God to lift?") has a different answer under each reading: a contradictory task is no limit (Mavrodes), or the impossible is allowed (Frankfurt), or omnipotence is only held for a time.
  - **Omniscience** is knowing every truth. For every proposition $p$ and subject $S$:
  {{ $$\forall p\,\big(p\Rightarrow K_S\,p\big)$$ }}
  The converse, $K_S\,p\Rightarrow p$, holds for any knower and does not express completeness.
  - **Foreknowledge and freedom.** If God knew yesterday that I will do $X$ today, and God cannot be wrong, it seems I cannot do otherwise. Replies: Aquinas distinguishes necessity of the consequence from necessity of the consequent; Boethius says God knows from eternity; open theists say future free acts are not yet truths to know.
  - **Omnibenevolence and the Euthyphro question.** Is the good good because God commands it, or does God command it because it is good? The first horn risks arbitrariness, the second makes the good independent of God. The *divine nature* reply says God's character is the standard of the good, which is neither a command nor an outside law.
  - **Where people part ways.** On which reading of omnipotence is the one worth defending, on whether freedom and foreknowledge can coexist, and on whether the divine-nature reply explains the good or only relabels it.
cards:
  - type: mcq
    id: hook
    title: "Guess: the stone"
    prompt: |
      Guess before any theory. A student asks a believer: "Can God make a stone so heavy that God cannot lift it?" What is your gut feeling about the question itself?
    options:
      - text: 'It looks like a trap: whichever way it is answered, something seems to go wrong for "God can do anything".'
        correct: true
        feedback: |
          Right instinct. Either God can make it and then there is a stone God cannot lift, or God cannot make it, and so there is something God cannot do. The lesson asks what "can do anything" should mean so that the puzzle is handled, and what it costs.
      - text: 'It is a silly joke with no serious content.'
        feedback: |
          It has been taken seriously for about a thousand years, because it forces a precise definition of "all-powerful". The lesson follows that definition.
      - text: 'It is easy: God can obviously do both.'
        feedback: |
          That is one real answer (a philosopher defended it), but "both" needs an account of how a being can make and lift the same stone. Hold it as one option among several.
    explanation: |
      Keep your guess. We will see three precise ways to say "all-powerful", and the stone looks different under each.

  - type: text
    id: perfect-being
    title: "Why the attributes exist"
    body: |
      Where do "all-powerful", "all-knowing" and "wholly good" come from? According to **classical theists**, from **perfect-being thinking**: God is the greatest possible being (Anselm's phrase, as in the ontological argument), so God should have each *great-making* property to the highest degree. A being that could be more powerful, or know more, or be better, would not be the greatest.

      Three attributes follow, the "omni" ones (Latin *omnis*, "all"):

      - **Omnipotence**: all-powerful.
      - **Omniscience**: all-knowing.
      - **Omnibenevolence**: all-good (*bene*, "well", *volens*, "willing").

      This is a **faith commitment** about what God is, not a finding. The rival view (some process and other thinkers, later lessons) is that a God of persuasion, not total control, is the better God. The questions here are internal: if we say these words, what exactly do they mean, and do they fit together?

  - type: text
    id: three-readings
    title: "Three readings of omnipotence"
    body: |
      Write $s$ for a **state of affairs**, a way things might be ("a stone of 1 tonne exists"), and $\Diamond s$ for "$s$ is possible" (true in at least one possible world). Three readings of "God is all-powerful" are on the table:

      **(A) Anything at all.** God can bring about any state of affairs, even a contradictory one such as a shapeless cube. According to the usual reading of Descartes (1596-1650), in letters to Mersenne in 1630 (for instance 27 May) he held that God was free to make it not true that the radii of a circle are equal. Whether he really meant this is disputed: Jonathan Bennett reads him as only refusing to say that God *cannot*, because we do not clearly understand the claim.

      **(B) Anything logically possible.** According to Aquinas (c. 1225-1274), in the *Summa Theologiae* I, q. 25, a. 3, "whatever implies contradiction does not come within the scope of divine omnipotence", and he adds it is better to say such things *cannot be done* than that God cannot do them.

      $$\forall s\,\big(\Diamond s\Rightarrow\mathrm{Can}(g,s)\big)$$

      **(C) Anything possible and consistent with God's nature.** Write $N$ for God's nature (the properties God has essentially). Then God can do $s$ only if $s$ can be true together with $N$:

      $$\forall s\,\big(\Diamond(s\land N)\Rightarrow\mathrm{Can}(g,s)\big)$$

      Here God cannot sin or lie. Aquinas, replying to an objection in the same article, says that God "cannot sin, because of His omnipotence": being able to sin would be a defect of power, not a bonus.

  - type: mcq
    id: sort-claims
    title: "Which reading?"
    prompt: |
      Three statements about an omnipotent God. Reading (A) allows any state of affairs; (B) any logically possible one; (C) any possible one consistent with God's nature. Which statement fits reading (B) but **not** reading (C)?
    options:
      - text: 'God can make a stone that weighs a tonne and can make a world with one more planet.'
        feedback: |
          Both readings allow these: they are possible and fit any nature. Look for an act that is possible but clashes with a nature.
      - text: 'God can lie to every prophet, since lying is logically possible, even though God is essentially truthful.'
        correct: true
        feedback: |
          Yes. Lying is not a contradiction, so (B) allows it; (C) rules it out because it cannot be true together with an essentially truthful nature.
      - text: 'God can make a square circle.'
        feedback: |
          That is reading (A) only: it implies a contradiction, so (B) and (C) both exclude it.
    explanation: |
      (C) is (B) with one more filter. Whether that filter is a limit on God or part of what a perfect being is, is exactly where thinkers part ways: Aquinas says the latter.

  - type: mcq
    id: stone-b
    title: "The stone under reading (B)"
    prompt: |
      The stone argument: "Either God can make a stone God cannot lift, and then there is something God cannot do (lift it); or God cannot make it, and then there is something God cannot do (make it). Either way God is not omnipotent." According to Mavrodes (1963), who defended reading (B), how does one answer?
    options:
      - text: 'Making a stone that an omnipotent being cannot lift is a self-contradictory task, so it is not a possible state of affairs, and failing at it is no limit.'
        correct: true
        feedback: |
          Yes, in essence. If God is essentially omnipotent, "a stone God cannot lift" is a contradictory description, like a shapeless cube. Reading (B) never asked for the impossible.
      - text: 'God makes the stone and then, being all-powerful, lifts it anyway.'
        feedback: |
          That is Frankfurt's reply (1964), which belongs to reading (A): God can do both impossible tasks. It is not the answer under (B).
      - text: 'The argument is correct: reading (B) is therefore refuted.'
        feedback: |
          The argument assumes that "can do anything" includes the contradictory task. Under (B) it does not, so the dilemma never starts.
    explanation: |
      Critics, such as Savage (1967), reply that this only moves the problem, since it leaves us unable to say whether God can make stones of every weight. Defenders answer that a stone God cannot lift is not a weight at all but a contradiction. The dispute is live.

  - type: mcq
    id: stone-others
    title: "Other ways out of the stone"
    prompt: |
      Frankfurt (1964) argued, in effect: if God can do one logically impossible thing, then performing two (making the stone and lifting it) is no greater a trick. The Stanford Encyclopedia also records a third escape: an *accidentally* omnipotent being (one that happens to be omnipotent for a while but not essentially). Which statement describes it?
    options:
      - text: 'Such a being could make the stone while omnipotent and then, no longer omnipotent, be unable to lift it; both states are possible, but at different times.'
        correct: true
        feedback: |
          Yes. The stone is a possible state of affairs for an accidentally omnipotent being, at the price that God could cease to be omnipotent. Most classical theists do not accept this price: they hold God is essentially omnipotent.
      - text: 'Such a being makes a stone it can lift at the same moment it cannot.'
        feedback: |
          That is a contradiction, not a way out. The time difference is exactly what removes it.
      - text: 'Such a being cannot make any stone at all.'
        feedback: |
          Nothing in the idea limits it from making stones; the only limit lies in what it can do afterwards.
    explanation: |
      Three replies, three prices: (B) gives up nothing real but adds a definition; (A) accepts the impossible; accidental omnipotence allows God to lose power. Each is a position, not a refutation of the others.

  - type: mcq
    id: trap-square
    title: "Trap: the square circle"
    prompt: |
      A student says: "God cannot make a square circle, so God is not omnipotent. End of story." Which is the best assessment, in the terms of this lesson?
    options:
      - text: 'It assumes reading (A); under (B) and (C) a square circle is not a thing at all, so not making one is no lack of power.'
        correct: true
        feedback: |
          Right. The argument quietly defines omnipotence as reading (A) and then refutes that reading. Theists who hold (B) or (C) agree with the premise and reject the conclusion.
      - text: 'It proves that no one can hold that God is omnipotent.'
        feedback: |
          It only touches reading (A). A refutation of one reading is no refutation of the other two.
      - text: 'It is irrelevant: logic does not apply to God.'
        feedback: |
          That is a possible position (it looks like reading (A)), but it is not the answer to what the student said, and it would also make any claim about God untestable.
    explanation: |
      A common slide: "omnipotence cannot be coherently defined" from "one definition fails". The honest question is which definition the thinker actually holds.

  - type: text
    id: omniscience-def
    title: "Omniscience: knowing every truth"
    body: |
      A **proposition** is what a true or false sentence says ("Brasilia is the capital of Brazil"). Write $K_S\,p$ for "the subject $S$ knows $p$". According to the Stanford Encyclopedia (Wierenga), the standard definition is: for every proposition $p$, if $p$ is true then $S$ knows $p$.

      Philosophers raise real difficulties for it. A few examples, each a live debate:

      - **Self-locating knowledge.** Kretzmann (1966) argued that "I am hungry now" is a truth that only I can know as mine, so a God distinct from us seems to miss it.
      - **Time.** To know "it is now noon" a being must know different things at different times, which does not suit a God who never changes.
      - **The future** (the next card).

  - type: build
    id: omni-build
    title: "Build the definition"
    prompt: |
      Let $p$ range over propositions and $K_S\,p$ mean "$S$ knows $p$". Build the definition: $S$ is omniscient when, for every true $p$, $S$ knows $p$.
    prefix: ''
    tiles: ['\forall p\,(', 'p', '\Rightarrow', 'K_S\,p', ')', '\exists p\,(', '\land']
    answers:
      - ['\forall p\,(', 'p', '\Rightarrow', 'K_S\,p', ')']
    wrong:
      - answer: ['\forall p\,(', 'K_S\,p', '\Rightarrow', 'p', ')']
        feedback: |
          This says: whatever $S$ knows is true. That holds for any knower ("knowledge is factive") and says nothing about completeness. A knower of one fact satisfies it.
      - answer: ['\exists p\,(', 'p', '\land', 'K_S\,p', ')']
        feedback: |
          This only says $S$ knows at least one truth. Omniscience needs every truth.
    hint: 'All truths are known, so: for every p, truth of p leads to knowledge of p.'
    explanation: |
      The direction matters: truth implies being known. The reverse direction is the ordinary requirement that knowing needs truth.

  - type: text
    id: foreknow
    title: "Omniscience, the future and freedom"
    body: |
      Now take a truth about tomorrow: "I will pick the blue door." If God is omniscient and has always known it, is my choice free? According to Pike (1965, "Divine Omniscience and Voluntary Action"), an argument runs roughly:

      - **P1.** Yesterday God believed that I would pick blue.
      - **P2.** God cannot be wrong, so if God believed it, I will pick blue.
      - **P3.** Nothing I can do now changes what God believed yesterday (the past is fixed).
      - **C.** So I cannot do otherwise than pick blue: my choice is not free.

      Notice that the argument does not say God's knowing *causes* my choice; its force comes from the fixity of the past.

  - type: mcq
    id: pike-cause
    title: "Trap: does God's knowing cause my choice?"
    prompt: |
      A friend says: "The foreknowledge problem is silly: knowing what I'll pick does not make me pick it, just as a weather forecast does not cause the rain." Is this a good answer to the argument above?
    options:
      - text: 'No: the argument does not claim that knowing causes the act. It claims that if the past belief is fixed and cannot be wrong, then no other act is open to me.'
        correct: true
        feedback: |
          Yes. The worry is about *what remains possible given a fixed past*, not about causation. The forecast analogy misses it because forecasts can be wrong and God, by hypothesis, cannot.
      - text: 'Yes: knowledge never influences what is known, so the argument fails at once.'
        feedback: |
          True that knowing does not cause, but the argument does not need it to. See P2 and P3: it is the combination of an infallible, fixed belief with the claim that I could still do otherwise.
      - text: 'No: because God is outside time the argument has no premises.'
        feedback: |
          That is a possible reply (it is Boethius's, next card), not a reading of the argument: the argument has premises, and the reply denies P1.
    explanation: |
      Keep the structure: three premises about a past belief, infallibility and fixity. Each reply below rejects one of them.

  - type: mcq
    id: exits
    title: "Three exits"
    prompt: |
      According to the Stanford Encyclopedia, three classical replies to the foreknowledge argument are: Aquinas (Summa contra Gentiles I, 67, c. 1260), Boethius (c. 524) and the open theists (Hasker, Pinnock and others). Which pairing is right?
    options:
      - text: 'Aquinas: the argument mixes up "necessarily, if God knew, then I act" with "if God knew, then necessarily I act", so it is invalid or has a false premise. Boethius: God knows from eternity, not "yesterday". Open theists: free future acts are not yet truths for God to know.'
        correct: true
        feedback: |
          Yes. Aquinas attacks the logic (necessity of the consequence versus of the consequent), Boethius attacks P1's temporal "yesterday", the open theists trim what omniscience covers.
      - text: 'Aquinas: freedom is an illusion. Boethius: God foresees by causing. Open theists: God is not omniscient.'
        feedback: |
          None of the three says this. Open theists keep the definition of omniscience and say the future free acts are not yet truths to know (Swinburne holds a similar view).
      - text: 'All three say the argument is sound but harmless.'
        feedback: |
          They reject it, each at a different step.
    explanation: |
      How Boethius's "eternity" reply works, and what physics says about time, is the topic of the next lesson, God and Time.

  - type: mcq
    id: trap-open
    title: "Trap: open theism"
    prompt: |
      A critic says: "Open theists deny that God is omniscient." Using the definition $\forall p\,(p\Rightarrow K_S\,p)$, which answer is most accurate?
    options:
      - text: 'Open theists keep the definition; they deny that propositions about future free acts are already true, so there is nothing yet for God to know.'
        correct: true
        feedback: |
          Yes, roughly. According to them, God still knows every truth; the dispute is about which propositions are true now. Their critics reply that this is a revision of omniscience in all but name.
      - text: 'Open theists drop the idea of knowledge altogether.'
        feedback: |
          They hold that God knows everything there is to know, including all of the past and present.
      - text: 'Open theists accept the foreknowledge argument and give up human freedom.'
        feedback: |
          The opposite: they protect freedom by changing what counts as knowable.
    explanation: |
      Whether this is a defense of omniscience or a trimming of it is a verbal-looking dispute that depends on whether "the future free act is true now" is part of the definition.

  - type: text
    id: euthyphro
    title: "Omnibenevolence and the Euthyphro question"
    body: |
      "Wholly good" needs a standard of goodness. In Plato's dialogue *Euthyphro*, Socrates asks whether the pious is loved by the gods because it is pious, or is pious because the gods love it. For a single God it becomes the **Euthyphro dilemma**:

      - **Horn 1.** God commands the good because it is good. Then goodness is a standard *independent* of God, and God obeys it. Cost: God is not the source of the good.
      - **Horn 2.** The good is good because God commands it. Then it seems **arbitrary**: God could have commanded cruelty and it would have been good. Cost: "God is good" risks meaning only "God does what God does".

      This is a **live debate** about what "good" means, not a fact about the world. Both costs are real; the next card shows a third answer.

  - type: mcq
    id: euthyphro-sort
    title: "Which horn?"
    prompt: |
      Two sentences. (a) "Torturing an innocent child for fun is wrong, and that is why God forbids it." (b) "Torturing an innocent child for fun is wrong because God forbids it." Which horn does each belong to?
    options:
      - text: '(a) horn 1: God follows a standard. (b) horn 2: God''s command makes the standard.'
        correct: true
        feedback: |
          Yes. In (a) the wrongness is prior to the command; in (b) the command is prior to the wrongness.
      - text: '(a) horn 2 and (b) horn 1.'
        feedback: |
          Reversed. Ask which comes first in the sentence: the wrongness (horn 1) or the command (horn 2).
      - text: 'Both are horn 1, since the act is wrong in both.'
        feedback: |
          Both say the act is wrong, but only (a) makes the wrongness independent of the command.
    explanation: |
      The question separates two things people often run together: what God commands and why it is good.

  - type: mcq
    id: nature-reply
    title: "The divine-nature reply"
    prompt: |
      Many classical theists, in the tradition of Augustine and Aquinas, say the dilemma is false: the good is neither an outside law nor an arbitrary command but God's own **nature**. Robert Adams, in *Finite and Infinite Goods* (1999), builds a modified divine command theory on God's loving character. Which objection do critics raise against such a reply?
    options:
      - text: 'Then "God is good" seems to mean "God is like God", and one asks why God''s nature, rather than another, is the standard.'
        correct: true
        feedback: |
          Yes. The reply avoids arbitrary commands, but pushes the question back one step: is God's nature good because of a standard, or by definition? Defenders answer that the best standard just is a perfect being.
      - text: 'It makes God stronger than the good.'
        feedback: |
          It does the opposite: it places goodness in God, not above or below.
      - text: 'It requires that God never commands anything.'
        feedback: |
          Divine-nature views usually keep commands, but as expressions of a loving character.
    explanation: |
      On this reply, commands express the nature; they do not create the good. Three options, three costs: independence, arbitrariness, or a possible circle.

  - type: text
    id: table
    title: "Do the attributes fit together?"
    body: |
      Each attribute alone faces a puzzle; pairs face more. Replies below are those of the thinkers named in this lesson:

      | Puzzle | Attributes involved | Who answers how |
      |---|---|---|
      | Stone | power alone | Mavrodes: contradictory task, no limit. Frankfurt: God can do both. Accidental omnipotence: only for a time |
      | Foreknowledge | knowledge and human freedom | Aquinas: invalid step. Boethius: eternity. Open theists: trim the future |
      | Sin | power and goodness | Aquinas: not being able to sin is no defect |
      | Euthyphro | goodness and sovereignty | Divine nature (Adams and others) |
      | Evil | power and goodness | Free-will defense, theodicies (earlier lessons) |

      There is no single verdict: each reply buys coherence at a stated price, and which price is acceptable depends on what one thinks a perfect being is.

  - type: mcq
    id: sin-mcq
    title: "Can a perfect God do evil?"
    prompt: |
      Objection: "If God cannot sin, God lacks a power we have, so God is not omnipotent." Which reading of omnipotence gives the clearest reply?
    options:
      - text: 'Reading (C): God can do whatever is possible and consistent with an essentially good nature; the ability to sin would be a defect, not a power.'
        correct: true
        feedback: |
          Yes, roughly Aquinas's line: God "cannot sin, because of His omnipotence". Critics ask whether that is a limit on power renamed as perfection.
      - text: 'Reading (A): God can do anything, including sin, but chooses not to.'
        feedback: |
          Possible, but it answers a different question: the objection is about what God *cannot* do, and (A) says God can do everything, sin included. Many theists would not want it.
      - text: 'No reading helps: the objection is decisive.'
        feedback: |
          It is decisive only against a reading that counts sin as a power, which (C) denies.
    explanation: |
      Whether not being able to sin is a limit or part of perfection depends on whether power is measured by what can be done or by what a perfect being would do.

  - type: text
    id: summary
    body: |
      **Next:** If God knows everything and sits outside time, what is the shape of the future, and what does physics say about time? The next lesson, God and Time, asks whether God is eternal outside time or everlasting within it, and returns to foreknowledge and freedom.
