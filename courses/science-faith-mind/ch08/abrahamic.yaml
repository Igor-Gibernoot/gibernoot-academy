id: ch08-abrahamic
title: "One God in Three Traditions"
kind: concept
own: |
  The setting: Judaism, Christianity and Islam are called **Abrahamic** (each traces its story to Abraham) and are **monotheistic** (they teach that there is one God). Each is taught here *according to* its own adherents; the question is what "one" means in each.
  - **Jewish monotheism (the Shema).** According to the Hebrew Bible, Deuteronomy 6:4 begins *Shema Yisrael*, "Hear, O Israel", and then states, in the Jewish Publication Society translation, that the ETERNAL is our God, the ETERNAL alone. Translators differ between "one" (unity) and "alone" (exclusive worship); both readings are defended. Maimonides (d. 1204), in his legal writings, judged Islam strictly monotheist and the Trinity a form of idolatry; later Jewish authorities disagreed with parts of his judgement.
  - **The Christian Trinity.** According to the Nicene-Constantinopolitan Creed (Nicaea 325, Constantinople 381), there is one God in three **persons**, Father, Son and Holy Spirit, who share one **essence** (*homoousios*, {{ "of the same substance" }}). With $F$ = Father, $S$ = Son, $G$ = God, the puzzle is that reading "is" as identity gives
  {{ $$F=G,\quad S=G\ \Rightarrow\ F=S$$ }}
  which contradicts the claim $F\neq S$. Trinitarians reply that "is" in "the Son is God" is not bare identity (it says the Son is fully divine), or that the three persons share the one essence without being one person.
  - **Three misreadings the creed rules out.** *Modalism* (Sabellius, c. 217-220): one person playing three roles, so no real distinction. *Tritheism*: three separate gods, so no real unity. *Arianism* (Arius): the Son is a creature, so not of the same substance as the Father.
  - **Islamic tawhid.** According to the Qur'an, Surah 112 (Saheeh International translation): He is Allah, One; He neither begets nor is born; nor is there to Him any equivalent. **Tawhid** is the oneness of God; **shirk** is {{ associating anything with God }}, which Qur'an 4:48 calls unforgiven. Qur'an 4:171 warns the People of the Scripture not to say "three". Christians reply that "begotten" in the creed is not physical generation.
  - **"The same God?"** According to Miroslav Volf (*Allah: A Christian Response*, 2011), Christians and Muslims **refer to** the same God while describing God differently, so the shared reference is
  {{ $$\text{same reference}\ \not\Rightarrow\ \text{same description}$$ }}
  Critics hold that differences as deep as Trinity and Incarnation make the description so different that the object of worship differs. Layer 3 (faith) commitments decide which side is natural; the logic of reference is layer 2 (live debate).
  - **Where people part ways.** On whether "same God" asks about reference, description or worship; on whether the Trinity is coherent monotheism; and on whether the Shema's "one" can allow internal distinctions.
cards:
  - type: mcq
    id: hook
    title: "Guess: the same God?"
    prompt: |
      Guess before any theory. Jews, Christians and Muslims all say there is one God and all trace their story to Abraham. Do they worship the same God?
    options:
      - text: 'Yes: the same single God, described differently.'
        feedback: |
          A serious answer (held, for example, by Miroslav Volf, as we will see), but not the only one.
      - text: 'No: the descriptions differ so much (a Trinity, an Incarnation, a God who has no offspring) that they are different Gods.'
        feedback: |
          Also a serious answer, held by some critics. Not the only one either.
      - text: 'It depends on what "the same" means and on commitments that the texts alone do not settle; thoughtful people give different answers.'
        correct: true
        feedback: |
          This is the lesson's starting point: the question has several readings (same reference, same description, same worship), and each answer picks one.
      - text: 'The question is meaningless: nobody can check what is worshipped.'
        feedback: |
          Some hold this, but it also takes a position on what "same" means. The lesson separates the readings first.
    explanation: |
      Keep your guess. Everything below is taught *according to* each tradition, with the three layers labelled: (1) fact (texts, history), (2) live scholarly debate, (3) faith commitment.

  - type: text
    id: setting
    title: "Three traditions, one word: one"
    body: |
      Two glosses. **Monotheism** is the teaching that there is one God. **Abrahamic** names Judaism, Christianity and Islam, which each claim the prophet Abraham (Hebrew *Avraham*, Arabic *Ibrahim*) as a common forefather. Critics say the label can blur real differences, and this lesson keeps the differences visible.

      All three say "God is one". The puzzle is that "one" is understood in different ways. We take each tradition as its own adherents state it, then ask what they share and where they part ways.

  - type: text
    id: shema
    title: "The Shema (Judaism)"
    body: |
      According to the Hebrew Bible, Deuteronomy 6:4 reads (Hebrew text, Masoretic):

      $$\text{שְׁמַ֖ע יִשְׂרָאֵ֑ל יְהֹוָ֥ה אֱלֹהֵ֖ינוּ יְהֹוָ֥ה׀ אֶחָֽד}$$

      In the Jewish Publication Society translation (2023 edition): "Hear, O Israel! The ETERNAL is our God, the ETERNAL alone." (ETERNAL is the translation's rendering of God's name in the Hebrew text.) The verse is called the *Shema* ("Hear!"), from its first word.

      Many other English versions end with "the Lord is one". That difference is the next question.

  - type: mcq
    id: shema-readings
    title: "One or alone?"
    prompt: |
      The last Hebrew word of Deuteronomy 6:4 (*echad*) is rendered "one" in many translations and "alone" in the Jewish Publication Society translation. Two readings: (A) God is a unity, not made of parts; (B) Israel's God is the only one to be worshipped. Which statement is accurate?
    options:
      - text: 'Both readings are defended by readers of the verse; the translation choice reflects which emphasis the translator takes.'
        correct: true
        feedback: |
          Yes. Reading (A) stresses what God is (undivided), reading (B) stresses whom Israel is to serve (exclusive loyalty). Neither is a fringe reading.
      - text: 'Only (A) is possible, since "one" is the literal meaning.'
        feedback: |
          A modern Jewish translation chose "alone", so the verse is not read only as "one". Insisting on one sense decides the debate in advance.
      - text: 'Only (B) is possible: the verse says nothing about what God is.'
        feedback: |
          Many readers, including Maimonides, took Jewish monotheism to include God's strict indivisibility; so (A) also has a long history.
    explanation: |
      Hold both. The unity reading matters for the Trinity debate below; the exclusivity reading matters for the question of idolatry.

  - type: mcq
    id: maimonides
    title: "Maimonides on Islam and Christianity"
    prompt: |
      Maimonides (d. 1204), the great Jewish jurist and philosopher, classed Islam as strictly monotheist, and Trinitarian Christianity as a form of idolatry, in his legal writings (Christianity in the *Mishneh Torah*, Islam in his responsa). Which reasoning best fits that contrast?
    options:
      - text: 'If God is strictly indivisible, a doctrine of three persons and an incarnate God reads as dividing God or giving God a body, which he counts as idolatry; Islam keeps God undivided and bodiless.'
        correct: true
        feedback: |
          Yes. Scholars describe his grounds as God's absolute unity and incorporeality. Note it is *his* judgement, based on the unity reading of the Shema.
      - text: 'Islam is closer in history to Judaism, so he approved it, whatever it teaches.'
        feedback: |
          His reasons were theological, not about friendship or history. Scholars add that his philosophical view of Islam was in other respects harsher than his view of Christianity.
      - text: 'All later Jewish authorities agreed with him on every point.'
        feedback: |
          They did not. One later authority, Nissim, held unambiguously that Islam is not idolatry, and others disagreed with parts of Maimonides on Islam. It is a live debate in Jewish thought.
    explanation: |
      Two views are on the table: a strict unity reading that makes the Trinity a problem (Maimonides), and, as we turn to Christianity, the reply that the Trinity is a different kind of "oneness".

  - type: text
    id: trinity
    title: "The Trinity (Christianity)"
    body: |
      According to Christian creeds, there is **one God** in **three persons**: Father, Son (Jesus Christ) and Holy Spirit. A **person** here is a distinct "who", not a separate god; **essence** (or substance, or being) is what makes God God.

      The classic formula is the Greek *homoousios*, "of the same substance". Britannica describes it as the key term of the doctrine formulated at the first ecumenical council, held at **Nicaea in 325**, to affirm that the Son and the Father are of the same substance. In **381**, the council at Constantinople, called by the emperor Theodosius I, built on that creed, and the result is the Nicene (or Nicene-Constantinopolitan) Creed, the creed that gives the doctrine its classic form. The creed says of the Son: "begotten, not made", of one being with the Father (English wording varies between translations).

      Christians hold this as a **faith commitment** (layer 3). The historical facts about the councils are layer 1; how the creed should be understood is layer 2.

  - type: mcq
    id: nicene-claim
    title: "What the creed claims"
    prompt: |
      According to the Nicene Creed, the Father, Son and Holy Spirit are three persons of one God, sharing one essence. Which statement is the creed's own claim?
    options:
      - text: 'There is one God; the Father, Son and Holy Spirit are distinct persons who share that one divine essence.'
        correct: true
        feedback: |
          Yes. "One" is said of the essence, "three" of the persons.
      - text: 'There are three gods who cooperate as a team.'
        feedback: |
          That is **tritheism**, a position the creeds reject. Trinitarians claim one God, not a committee.
      - text: 'There is one person who shows himself in three roles, as Creator, Redeemer and Sustainer.'
        feedback: |
          That is **modalism**, associated with Sabellius (active c. 217-220), whose exact views are known mainly from his opponents. The creed teaches real distinction of persons.
      - text: 'The Son is the first and greatest creature, similar to the Father but made.'
        feedback: |
          That is **Arianism**, after Arius, an Alexandrian presbyter whose teaching that the Son was created prompted Nicaea. The creed's "begotten, not made" and homoousios answer it.
    explanation: |
      Orthodox Trinitarianism is defined by what it avoids: too much unity (modalism), too much plurality (tritheism), and a lower Son (Arianism).

  - type: mcq
    id: misreading-modalism
    title: "Spot the mistake"
    prompt: |
      A speaker says: "The Father, the Son and the Holy Spirit are just three names for one person, who acts first as Creator, then as Redeemer, then as Sanctifier." According to the Nicene tradition, what is wrong?
    options:
      - text: 'It denies that the three are really distinct persons (modalism): the creed treats the distinction between the persons as real.'
        correct: true
        feedback: |
          Yes. This is the modalist reading, the one that makes "three" only a matter of names or roles. Trinitarians insist the persons are distinct and share the one essence.
      - text: 'It says God is one, which is false in Christianity.'
        feedback: |
          Christianity also says God is one. The error is how the three are related, not that the speaker affirms one God.
      - text: 'It is exactly the creed, put plainly.'
        feedback: |
          The creed says the persons are distinct. One person in three roles is the position the church rejected as modalism.
    explanation: |
      Modalism protects unity and loses the three; tritheism protects the three and loses unity. The doctrine tries to keep both.

  - type: mcq
    id: tritheism-charge
    title: "Is it tritheism after all?"
    prompt: |
      Some contemporary philosophers (Richard Swinburne, for example) describe the three persons as three centres of consciousness who share one divine nature. The Stanford Encyclopedia notes that William Alston called Swinburne's view "a fairly straightforward form of tritheism". What does this show?
    options:
      - text: 'That the line between "three persons, one God" and "three gods" is itself a live debate among Christian philosophers.'
        correct: true
        feedback: |
          Yes. Defenders reply that the three share one nature and one will in a way separate gods never do. Critics reply that three centres of consciousness are three gods in all but name. That is layer 2, not settled history.
      - text: 'That the creed has been proved false.'
        feedback: |
          A charge of tritheism against one *theory* of the Trinity is not an attack on the creed itself; other theories keep closer to the unity of God.
      - text: 'That all Christians think of the persons as three separate gods.'
        feedback: |
          No: the creeds reject that. The dispute is whether one particular theory slides into it.
    explanation: |
      Where the "social" theories (three persons as three subjects in a loving community) and the "one-self" theories (God as one subject with three ways of being) part ways is itself discussed by scholars, who also warn that this simple textbook division of the Latin and Greek traditions is too neat.

  - type: mcq
    id: identity-puzzle
    title: "A logic puzzle"
    prompt: |
      Let $F$ = the Father, $S$ = the Son, $G$ = God. Suppose "is" means identity ($=$) in each of: (1) $F$ is $G$; (2) $S$ is $G$; (3) $F$ is not $S$. Which conclusion follows?
    options:
      - text: 'A contradiction: from (1) and (2), $F=G=S$, so $F=S$, against (3).'
        correct: true
        feedback: |
          Yes. Identity is transitive, so reading all three "is"s as identity cannot work.
      - text: 'Nothing: (1), (2) and (3) are consistent, since $F$, $S$ and $G$ can be different symbols for the same thing.'
        feedback: |
          (3) says $F$ and $S$ are different; (1) and (2) with identity make them the same. They cannot all hold.
      - text: 'That the Trinity is proved false.'
        feedback: |
          It shows only that the identity reading fails. Trinitarians deny that the claims are about identity (see the next card).
    explanation: |
      A critic can run this as a charge of incoherence; the question is what a defender says "is" means.

  - type: mcq
    id: identity-reply
    title: "Two replies"
    prompt: |
      Trinitarians answer the identity puzzle ($F=G$, $S=G$, so $F=S$) in different ways. Which reply does *not* just ignore the puzzle?
    options:
      - text: 'The "is" in "the Son is God" is not bare identity but says that the Son is fully divine, sharing the one essence, so the chain through identity never starts.'
        correct: true
        feedback: |
          Yes. This is one standard reply, made by several defenders: the persons share the divine essence, and "is" in these sentences does not mean "is numerically the same as". A second reply is that some things can be the same in one respect and distinct in another (relative identity), which critics find harder to accept.
      - text: 'Mathematics does not apply to God, so no puzzle arises.'
        feedback: |
          That response is available, but it gives up the claim that the doctrine can be stated consistently. Most defenders try to show consistency instead.
      - text: 'There are really three gods, so $F\neq G$.'
        feedback: |
          That is tritheism, which the creed rejects.
    explanation: |
      Whether these replies succeed is a live debate in philosophy of religion. Layer 3 commitments often decide how generous a reader is to them.

  - type: text
    id: tawhid
    title: "Tawhid (Islam)"
    body: |
      According to the Qur'an, Surah 112 (*al-Ikhlas*, four verses), in the Saheeh International translation:

      1. Say, "He is Allah, [who is] One,"
      2. "Allah, the Eternal Refuge."
      3. "He neither begets nor is born,"
      4. "Nor is there to Him any equivalent."

      **Tawhid** (Arabic) is the oneness of God. **Shirk** is "association": giving God a partner or an equal. Qur'an 4:48 says, in the same translation, "Indeed, Allah does not forgive association with Him, but He forgives what is less than that for whom He wills." In Qur'an 4:171 the People of the Scripture (Jews and Christians) are told not to say "Three", and Jesus is called a messenger of Allah.

  - type: mcq
    id: tawhid-reading
    title: "Begets and equivalents"
    prompt: |
      Surah 112 says Allah "neither begets nor is born" and has no "equivalent". A Muslim reader hears the Christian title "Son of God" and the doctrine of the Trinity. Which pair of views is a fair account?
    options:
      - text: 'According to Muslim readers, "Son" suggests God has offspring and the Trinity gives God equals, both excluded by the surah. According to Christians, "begotten" in the creed is not physical generation but eternal relation within the one God, and the Son is not a second equal god.'
        correct: true
        feedback: |
          Yes. Each side states the other's words in its own sense: the surah's denial of offspring and the creed's "begotten, not made" are about different claims, which is why some Christians think the surah is not aimed at the creed, while Muslim critics think it is, in effect.
      - text: 'Islam and Christianity agree on what "Son of God" means, and only differ on words.'
        feedback: |
          They do not agree. The difference is real; the lesson's point is where exactly it sits.
      - text: 'The surah is only about ancient Arabian pagan gods, so it has nothing to say about Christianity.'
        feedback: |
          Some commentators read it as aimed at pagans; others read it, with 4:171, as also addressed to Christian doctrine. Both readings exist.
    explanation: |
      "According to Muslim readers" and "according to Christians" give two views of the same words. Neither is a neutral judge.

  - type: mcq
    id: nostra-aetate
    title: "A Catholic statement on Muslims"
    prompt: |
      The Second Vatican Council's declaration *Nostra Aetate* (proclaimed 28 October 1965) says of Muslims: "They adore the one God, living and subsisting in Himself; merciful and all-powerful, the Creator of heaven and earth". What does this show about Christian views of the question "the same God?"
    options:
      - text: 'That an official Catholic text affirms Muslims worship the one God, one voice among Christian answers, not all of them.'
        correct: true
        feedback: |
          Yes. It is an official layer-3 statement for Catholics, and it sits beside other Christian answers, some of which are more cautious.
      - text: 'That every Christian church teaches exactly this.'
        feedback: |
          Churches differ. The declaration speaks for the Catholic Church, not for all Christians.
      - text: 'That Catholics think Islam and Christianity teach the same doctrine.'
        feedback: |
          No. The same declaration lists differences; the claim is about whom Muslims adore, not about shared doctrine.
    explanation: |
      Notice the structure: "they adore the one God" is a claim about the object of worship, not a claim that the descriptions agree.

  - type: mcq
    id: volf
    title: "Volf: reference and description"
    prompt: |
      Miroslav Volf (Yale), in *Allah: A Christian Response* (2011), argues that Christians and Muslims worship the same God. Two people describe a distant mountain differently, one as "the tallest peak" and one as "the one with the snow", yet both point at the same mountain. Which claim best matches Volf's argument?
    options:
      - text: 'Two communities can refer to the same God while their descriptions differ and are in part mistaken; the differences are real, but they do not by themselves change the object referred to.'
        correct: true
        feedback: |
          Yes. Volf separates referring to God from describing God. He also says the book is not about salvation but about how the two communities can live together.
      - text: 'Christians and Muslims believe the same things about God.'
        feedback: |
          Volf does not say that. He says they share certain beliefs (such as one creator) but differ in others, including the Trinity.
      - text: 'It does not matter what anyone believes about God, since all religions are the same.'
        feedback: |
          Volf takes the differences seriously; his claim is narrower.
    explanation: |
      Reference is not guaranteed by agreement in description. That is exactly where critics push back.

  - type: mcq
    id: critics
    title: "The strongest objection"
    prompt: |
      Some critics reply to Volf: "If one tradition says God is a Trinity and the other says God is strictly one and has no Son, these are descriptions of two different beings, not one being described badly." What is the best response available to Volf's side?
    options:
      - text: 'Reference can survive wrong descriptions: if the people point at the same God, the differing descriptions are disagreements about that God, not about different beings.'
        correct: true
        feedback: |
          Yes. The question becomes how much a description can differ before reference fails, which is the core of the debate (a layer-2 question in philosophy of language, entangled with layer-3 commitments).
      - text: 'The critics are wrong because the Trinity is true.'
        feedback: |
          That presupposes a layer-3 claim. The reply must work for someone who does not share it.
      - text: 'There is no response; Volf concedes.'
        feedback: |
          He does not. His reply is the reference-versus-description distinction.
    explanation: |
      Each side has an argument for how much description can differ before the object changes. Neither side's argument settles the matter without a theory of reference.

  - type: text
    id: common-word
    title: "A Common Word (2007)"
    body: |
      In a different register, in **October 2007** 138 Muslim scholars and clerics issued an open letter, *A Common Word Between Us and You*, inviting Christians to dialogue on shared ground: love of God and love of neighbour. A Yale Divinity School response drafted by a group of scholars headed by Volf, titled "Loving God and Neighbor Together", was later endorsed by more than 300 Christian leaders. (Some sources date the Yale response differently; the 2007 date is the better supported.)

      Shared ground does not settle whether the God is the same, but it shows that, in practice, people on both sides use the "same God" question to decide how to live together. Volf himself says that is the point of his book.

  - type: mcq
    id: layers
    title: "Which layer?"
    prompt: |
      Three statements: (a) The council held at Nicaea in 325 used the term *homoousios*. (b) Whether Christians and Muslims worship the same God depends on a theory of reference. (c) God is three persons in one essence. Which is **layer 1**, established history or text?
    options:
      - text: '(a)'
        correct: true
        feedback: |
          Yes: it is history, checkable in sources. Sources also say the term was disputed afterwards.
      - text: '(b)'
        feedback: |
          That is a layer-2 claim: a live scholarly debate about philosophy of language.
      - text: '(c)'
        feedback: |
          That is a layer-3 claim: a faith commitment of Christians. Passing it off as layer 1 (or dismissing it as false) both break the rule of the course.
    explanation: |
      The lesson never says (c) is true or false. It says what Christians hold, what the council did, and what philosophers debate.

  - type: mcq
    id: agree-disagree
    title: "What do they share? Where do they part?"
    multiple: true
    prompt: |
      Select **all** that are points where Christianity differs from both Judaism and Islam, as each tradition describes itself.
    options:
      - text: 'God as three persons in one essence.'
        correct: true
        feedback: |
          Yes: Judaism and Islam both reject it (differently: Maimonides calls it idolatry, Qur'an 4:171 warns against saying "three").
      - text: 'Jesus as God incarnate, the Son who is of the same substance as the Father.'
        correct: true
        feedback: |
          Yes: Judaism and Islam do not hold this (in Islam, Jesus is a messenger of Allah).
      - text: 'There is one God.'
        feedback: |
          All three say this, though they understand "one" differently. This is the shared claim.
      - text: 'God is the creator of heaven and earth.'
        feedback: |
          Shared by all three traditions as they describe themselves.
    explanation: |
      The pattern: agreement at the level of "one creator God", disagreement at the level of how God is internally one and how God acts in history.

  - type: mcq
    id: parting
    title: "Where the disagreement sits"
    prompt: |
      Alice says "same God" because both traditions mean the creator of the world. Bob says "different God" because the Trinity is not the God of the Shema or the Qur'an. What are they actually disagreeing about?
    options:
      - text: 'What counts for "same": Alice uses same reference (the same being is meant), Bob uses same description (the same attributes).'
        correct: true
        feedback: |
          Yes. Before arguing about the answer, check which question each is answering. A third reading asks about same worship (the same relationship, practices, obedience), which can differ again.
      - text: 'Facts that a historian could settle by consulting the texts.'
        feedback: |
          Texts show what each tradition says; they do not settle which notion of "same" is the right one.
      - text: 'Whether one of them has mocked the other.'
        feedback: |
          Neither did. They are using one word in two ways.
    explanation: |
      Much of the disagreement dissolves into a choice of what "same God" means, and the rest is a real dispute about how much description can differ.

  - type: mcq
    id: open
    title: "What stays open"
    prompt: |
      A thoughtful reader says: "I have understood each tradition in its own terms. I still do not know whether the three worship the same God." Which is a fair assessment of that position?
    options:
      - text: 'It is fair: the answer depends on a theory of reference and on faith commitments the lesson does not decide.'
        correct: true
        feedback: |
          Yes. The goal is to see what the question depends on, not to rule on it.
      - text: 'It shows the reader did not learn anything.'
        feedback: |
          Knowing what the answer depends on is progress. The course aims at the right questions.
      - text: 'It is wrong: history already settles it.'
        feedback: |
          History settles what the councils and texts said, not what "same God" must mean.
    explanation: |
      Believers of each tradition, agnostics and atheists can all agree on the structure of the question while giving different answers.

  - type: text
    id: summary
    body: |
      **Next:** Level 8 turns from three traditions' shared word "one" to a different question: whether God changes, suffers or learns, in the lesson Process Theology and Open Theism.
