id: ch08-apophatic
title: "Saying What God Is Not"
kind: concept
own: |
  The setting: write $G$ for God (as classical theists conceive God: infinite, simple, beyond the world) and $F$ for a property word such as "wise" or "good". **Negative theology** (also called **apophatic** theology, from Greek *apophasis*, denial, and the *via negativa*, "the way of denial") is the family of views *according to* which we speak best of God by saying what God is not, because human words were made for finite things. Its opposite is **affirmative** (*cataphatic*) theology, which says what God is.
  - **Dionysius: three steps.** According to **Pseudo-Dionysius** (writing c. 500), the way to speak of God goes in three steps, and even the denials fall short:
  {{ $$\begin{gathered}\text{affirm: } G \text{ is } F\\ \text{deny: } G \text{ is not } F\\ \text{go beyond both}\end{gathered}$$ }}
  God is "beyond" life and not merely lifeless, so "even the negations must be negated".
  - **Maimonides: negative attributes.** According to **Maimonides** (1138-1204), a statement about what God is really says what God is not, or describes an effect of God:
  {{ $$\text{"}G\text{ is wise"}\ \longrightarrow\ \text{"}G\text{ is not ignorant"}$$ }}
  Words like "merciful" and "angry" are **attributes of action**: they describe what God's acts look like to us, as fire melts wax and hardens clay without the fire changing.
  - **Aquinas: names by analogy.** According to **Thomas Aquinas** (c. 1225-1274), we cannot know what God is, only what God is not, yet names such as "good" and "wise" do signify God's reality, imperfectly. They are said of God and of creatures neither in the same sense (univocally) nor in unrelated senses (equivocally), but {{ **by analogy**, "according to proportion" }}, as "healthy" is said of an animal, of its medicine (cause of its health) and of its urine (sign of its health).
  - **Eckhart: God and Godhead.** According to **Meister Eckhart** (c. 1260-c. 1328), a Dominican, the God who can be named differs from the **Godhead** (*Gottheit*), the unnameable ground beyond all names. Pope John XXII's bull *In agro dominico* (27 March 1329), issued after his death, condemned 28 statements from his works as heretical or suspect.
  - **Objection and replies.** If "God is beyond all words" is itself a statement, does negative theology undo itself? And speakers use "God is good" as a true-or-false claim. Dionysius replies by denying the denials; Aquinas, by giving analogy real content.
  - **Where people part ways.** On whether a negation can carry knowledge, or only guard against idols (a layer 2 debate); on whether silence or analogy is the right end of the road; on whether the Godhead beyond God is deeper insight or a loss of content (layer 3).
cards:
  - type: mcq
    id: hook
    title: "Guess: describing by what it is not"
    prompt: |
      Guess before any theory. A friend describes a creature you have never seen, using only denials: "It is not an insect, not a bird, not a fish, not a mammal." Which reaction seems most natural?
    options:
      - text: 'I have learned something real: a long list of denials narrows down what it can be.'
        correct: true
        feedback: |
          A fair guess. Each denial removes possibilities, so a list of them can point at something. Whether this works for God, who is said to be unlike everything in the world, is the question of this lesson.
      - text: 'I have learned nothing: a description must say what a thing is.'
        feedback: |
          Tempting, and some critics of negative theology say it. But denials do carry information: "not a bird" rules out wings and feathers. The real worry is subtler, as the lesson shows.
      - text: 'I have learned only that my friend does not know what it is.'
        feedback: |
          Possible for a friend who is ignorant. The thinkers in this lesson say something different: the *subject* is beyond our ordinary categories, so even a well-informed speaker must proceed by denial.
    explanation: |
      Keep your guess. Everything is taught *according to* each thinker, with three layers labelled: (1) fact (texts, dates), (2) live scholarly debate, (3) faith or metaphysical commitment.

  - type: text
    id: why
    title: "Why would anyone speak this way?"
    body: |
      Our words were built for finite things: trees, people, shapes, feelings. Suppose God is **infinite**, not one more thing in the world but its source. Then every ordinary word seems to bring a limit with it: "wise" as people are wise, "good" as people are good.

      Some thinkers in the Jewish, Christian and Islamic traditions drew a conclusion: speak of God by **denial**. This is called **negative** or **apophatic** theology (Greek *apophasis*, denial) or the *via negativa*, Latin for "the way of denial". Its opposite is **affirmative** or **cataphatic** theology, which says what God is: "God is love".

      According to the Stanford Encyclopedia, the two are often seen as a pair, since God is both near (immanent) and beyond (transcendent). This lesson follows four thinkers who gave negation a serious role: Maimonides, Pseudo-Dionysius, Aquinas and Eckhart. Notation: let $G$ be God and $F$ a property word such as "wise"; the affirmative statement is "$G$ is $F$", the negative one "$G$ is not $F$".

  - type: text
    id: maimonides
    title: "Maimonides: the only safe attributes are denials"
    image:
      src: img/maimonides.webp
      alt: "A traditional black-and-white portrait of Maimonides, a bearded man in a turban."
      caption: "A traditional portrait of Maimonides, copied by later artists; he finished the Guide of the Perplexed in 1190."
      credit: "presumably Blasio Ugolini, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Rambam-portrait.jpg"
    body: |
      **Moses ben Maimon, Maimonides** (born in Cordoba in 1138, though some sources say 1135; died 1204) and later settled in Egypt, was a rabbi, a physician and, according to the Stanford Encyclopedia, "the greatest Jewish philosopher of the medieval period". He completed the *Guide of the Perplexed* in 1190.

      In essence, in Part I (chapters 50 to 60), Maimonides argues from God's **simplicity**: God has no parts and no multiplicity. A statement like "God is wise" seems to add a quality (wisdom) to a subject (God), which would make God composite. So, he holds, statements about what God *is* cannot be literal affirmations. They can be read as **negations**: "God is wise" removes ignorance from God, "God is powerful" removes weakness.

      According to the same encyclopedia, he says in essence that the more you can prove inapplicable to God, the better. Layer 2 note: scholars such as Stern and Kellner read how far he meant this differently, from near-skepticism to a way that "conducts the mind" to the truth.

  - type: mcq
    id: maimonides-q
    title: "What does \"God is wise\" mean?"
    prompt: |
      According to Maimonides, if "God is wise" is read as a statement about what God *is* (God's essence), which reading does he favour?
    options:
      - text: 'It denies something: God is not ignorant, not lacking in wisdom.'
        correct: true
        feedback: |
          Yes. A negation does not add a quality to God, so it does not threaten God's simplicity. (He also allows a second reading: such words describe the effects of God's acts.)
      - text: 'It says God has the same kind of wisdom as a wise person, only more of it.'
        feedback: |
          This is the reading he rejects: it treats God and a person as sharing a kind of quality, and adds parts to a simple God.
      - text: 'It is meaningless noise and should never be said.'
        feedback: |
          He does not say that. He keeps such statements, and even requires daily prayer, but reads them as negations or as descriptions of God's acts.
    explanation: |
      Notice that the negative reading is not "God is stupid". It says the statement removes a defect, and that is what the denial teaches.

  - type: text
    id: action
    title: "Attributes of action: the fire"
    body: |
      Then what of "merciful", "angry", "jealous" in scripture? According to Maimonides, these are **attributes of action**: they describe the *effects* God produces, not a feeling inside God.

      His analogy, in essence: fire melts wax, hardens clay, whitens some things and blackens others. A person who saw only the effects might think fire had opposite qualities, yet the fire acts in one way only. So an act that looks like mercy to some and like anger to others does not make God change.

      This is a second way of keeping language: say what God *does*, and deny that the doing shows what God is.

  - type: mcq
    id: action-q
    title: "Fire and anger"
    prompt: |
      According to Maimonides's analogy, fire melts wax and hardens clay. What is the analogy meant to show about statements like "God is angry"?
    options:
      - text: 'One uniform act can have different effects, so the words describe effects on us, not a changing feeling in God.'
        correct: true
        feedback: |
          Yes. "Anger" names how an act appears from our side, as "melting" and "hardening" name how fire appears from the side of wax and clay.
      - text: 'God is physically like fire.'
        feedback: |
          The analogy is about how effects relate to a cause, not about what God is made of. Maimonides denies that God has a body.
      - text: 'God has two opposite qualities, one gentle and one harsh.'
        feedback: |
          The reverse. Fire has no two qualities; it only acts, and the different results come from what it acts on.
    explanation: |
      Layer note: this is Maimonides's view; critics ask whether "effects of God" is itself a positive claim about God, a worry we return to.

  - type: text
    id: dionysius
    title: "Pseudo-Dionysius: deny, then deny the denials"
    body: |
      An unknown Christian author who wrote around the year 500 under the name **Dionysius the Areopagite** (a figure from the Acts of the Apostles) is called **Pseudo-Dionysius**. According to the Stanford Encyclopedia, his *Mystical Theology* applies negation to every divine name, starting with symbolic names ("golden", "luminous") and moving to intellectual ones ("good", "one").

      The twist: negation alone is not the end. Dionysius says God is beyond the lifeless as well as beyond the living, so "God is not living" must not be heard as "God is lifeless". In essence, even the negations must be negated. A denial can be as misleading as an affirmation if it lulls us into thinking we have grasped what is left. He prefers "over being", "over life", not "non-being", "non-life".

      Three steps follow: **affirm** (God is $F$), **deny** (God is not $F$), and go **beyond** both, towards silence and unknowing, which he describes with the image of Moses entering the darkness above Mount Sinai. Scholars disagree whether that final stage is a kind of knowing or an experience (layer 2).

  - type: order
    id: dionysius-order
    title: "The three steps"
    prompt: |
      According to Pseudo-Dionysius, put the movement of speech about God in order.
    steps:
      - 'Affirm a name of God, such as "good".'
      - 'Deny it, because God is not good as creatures are good.'
      - 'Go beyond both the affirmation and the denial, towards unknowing.'
    hint: |
      Think: name it, correct the name, then correct the correction.
    explanation: |
      Affirmation names, denial corrects the name, and the third step corrects the denial too: God is "over" the category, not simply without it.

  - type: mcq
    id: lifeless-q
    title: "Not living, but not lifeless"
    prompt: |
      Dionysius says God is beyond the lifeless as well as beyond the living. Why does he insist that "God is not living" must not be read as "God is lifeless"?
    options:
      - text: 'Because "lifeless" is itself a creaturely category (stones are lifeless), so it is as wrong for God as "living" is.'
        correct: true
        feedback: |
          Yes. Both words belong to the world of creatures, living or not. God is claimed to lie beyond that division, not on one side of it.
      - text: 'Because God is alive in exactly the way animals are alive.'
        feedback: |
          That would be a plain affirmation. Dionysius's point is that both the affirmation and its opposite fail.
      - text: 'Because negations are always false.'
        feedback: |
          He holds negations to be *more* proper than affirmations, though still not the last word.
    explanation: |
      The phrase "over life" (rather than "non-life") marks that the denial is meant to point above the pair, not to its second member.

  - type: text
    id: aquinas
    title: "Aquinas: we know only what God is not, and yet..."
    body: |
      **Thomas Aquinas** (c. 1225-1274), a Dominican friar, opens his study of God's simplicity in the *Summa Theologiae* (Part I, question 3) with a famous line, in the English Dominican translation: "Now, because we cannot know what God is, but rather what He is not, ..." So he starts by saying how God is *not*: not a body, not composed of parts.

      But Aquinas will not let all language about God be mere denial. In question 13, article 2, he considers the view that "God lives" only means that God is not like an inanimate thing, and says that this was taught by "Rabbi Moses", usually taken to be Maimonides. Aquinas rejects it for names like "good" and "wise": they signify the divine substance, he holds, though they fall short of fully representing it, because we know God through creatures, which represent God imperfectly.

      Layer 2: scholars (for instance, Stubbens in *The Thomist*, 1990) have studied several points on which Aquinas disagrees with Maimonides, and whether the gap is as wide as it sounds.

  - type: mcq
    id: aquinas-q
    title: "Names that are not mere denials"
    prompt: |
      According to Aquinas (*Summa Theologiae* I, q. 13, a. 2), what is wrong with reading "God is good" as only "God is not evil"?
    options:
      - text: 'Such names say something positive: they signify the divine reality, though imperfectly, because our knowledge of God comes through creatures that imperfectly resemble God.'
        correct: true
        feedback: |
          Yes. He holds that "good" and "wise" are really true of God, in a more excellent way than they are true of creatures.
      - text: 'Nothing is wrong with it: Aquinas agrees all names of God are denials.'
        feedback: |
          He agrees about question 3 (we first learn how God is not), but in question 13 he rejects the claim that all names are denials.
      - text: 'It is wrong because "evil" does not exist in God.'
        feedback: |
          That is a true remark but not the reason he gives. His reason is that names like "good" are held to signify the divine reality itself, not only to deny a defect.
    explanation: |
      The stone case is a classic way to feel the problem: "not evil" is true of a stone, yet we do not call a stone good in the way we call God good.

  - type: text
    id: analogy
    title: "Analogy: the word \"healthy\""
    body: |
      How can "wise" be true of Socrates and of God? Aquinas (q. 13, a. 5) says there are three options:

      - **Univocal**: exactly the same meaning in both uses. Impossible between God and creatures, he argues, because in creatures perfections are divided and multiplied, while in God they are simple and united.
      - **Equivocal**: unrelated meanings, as "bank" of a river and "bank" for money. If that were so, nothing could be known about God from creatures, and every argument from creatures to God would commit the fallacy of equivocation.
      - **Analogical**: "according to proportion", between the two. His model is the word "healthy": said of an animal (it has health), of medicine (it *causes* the animal's health) and of urine (it is a *sign* of health). The meanings are different but not unrelated: all point back to the animal's health.

      So "wise" said of God and of a person is related as the uses of "healthy" are: not the same, not unrelated.

  - type: mcq
    id: analogy-q
    title: "Which kind of word?"
    prompt: |
      Following Aquinas, "healthy" is used in "a healthy animal", "a healthy medicine" and "a healthy complexion". The word "bank" is used in "river bank" and "savings bank". How would he classify these?
    options:
      - text: '"Healthy" is analogical (the uses are related through the animal''s health); "bank" is equivocal (unrelated meanings).'
        correct: true
        feedback: |
          Yes. The test is whether one use points back to the other. "Healthy" medicine is called healthy because of the animal; the river's edge has nothing to do with the money.
      - text: 'Both are equivocal, since each word has more than one meaning.'
        feedback: |
          Having several meanings is not enough. In analogy the meanings share a reference point, which is what lets us reason from one to the other.
      - text: 'Both are univocal, since each is one word.'
        feedback: |
          Univocal means one *meaning*. A healthy animal and a healthy medicine are not healthy in the same way, so the use is not univocal.
    explanation: |
      Notice the stake: if "wise" were equivocal, arguments from the world to God would fail by equivocation; if univocal, God would be one more wise being. Analogy is the middle path.

  - type: text
    id: eckhart
    title: "Eckhart: God and the Godhead"
    body: |
      **Meister Eckhart** (c. 1260-c. 1328) was a German Dominican preacher and theologian. According to Wikipedia's summary of the scholarship, he distinguished **God** (the God who is named and addressed, in Christian terms the Trinity) from the **Godhead** (*Gottheit*), the undifferentiated ground beyond every name. He drew the idea from Pseudo-Dionysius and the philosopher John Scotus Eriugena, but developed it his own way; the Stanford Encyclopedia lists him among the thinkers shaped by Dionysius.

      Historical fact (layer 1): an inquisitorial trial was ordered at Cologne in 1326; Eckhart appealed to the Pope and went to Avignon in 1327; he died about 1328, before the verdict. On 27 March 1329 Pope John XXII issued the bull *In agro dominico*, which labelled some of his statements heretical and others suspect. The 28 articles came from commissions that reduced about 150 articles to 28.

      Layer 2: his defenders say he meant to praise God, not to deny the Trinity; his critics at the time saw the Godhead beyond God as dangerous. Commentators also ask whether a Godhead beyond every name leaves theology with any positive content.

  - type: mcq
    id: eckhart-q
    title: "God beyond God"
    prompt: |
      According to Eckhart as reported by scholars, what is the **Godhead** (*Gottheit*) in contrast with **God**?
    options:
      - text: 'The unnameable ground beyond every name and distinction; "God" is the God who can be named and addressed.'
        correct: true
        feedback: |
          Yes. The distinction pushes the Dionysian "beyond" to its limit: past the God of the names to what is behind them.
      - text: 'A second, rival deity next to God.'
        feedback: |
          Eckhart did not teach a second God; the Godhead is meant as the depth of the same divine reality, beyond what words reach.
      - text: 'The universe itself, taken as divine.'
        feedback: |
          That would be pantheism, $G = W$ in the notation of the lesson on Spinoza. Eckhart was condemned partly for being read that way by critics, but he did not call the Godhead the world.
    explanation: |
      Layer 2: how close Eckhart's Godhead is to panentheism or pantheism is argued; critics, including some of those at his trial, read him that way, and his defenders deny it.

  - type: mcq
    id: objection-q
    title: "Does negative theology undo itself?"
    prompt: |
      A critic says: "'God is beyond all words' is itself a statement made in words, so negative theology contradicts itself." Which reply fits a thinker in this lesson?
    options:
      - text: 'Dionysius: the denials are not meant as the last word; even they must be denied, and the aim is silence and unknowing, not one more claim.'
        correct: true
        feedback: |
          Yes. For Dionysius the denials are steps on an ascent, to be left behind. Marion reads this as non-objectifying praise rather than description; Derrida objects that praise still predicates something (as the Stanford Encyclopedia of Philosophy notes).
      - text: 'Aquinas: therefore God must be univocal with creatures, so that "wise" means the same thing for both.'
        feedback: |
          Aquinas rejects univocal speech. His reply is analogy: our words really say something about God, in a way proportioned to the difference.
      - text: 'Maimonides: therefore the Guide should have been left unwritten.'
        feedback: |
          Maimonides wrote a long book and insisted on daily prayer; in essence he thought negations lead the mind towards the truth.
    explanation: |
      The Stanford Encyclopedia adds a second, quieter objection: speakers use "God is good" as a true-or-false claim, in arguments and conditionals, so a purely apophatic reading is revisionary (it changes what speakers mean).

  - type: mcq
    id: sort-q
    title: "Sort the speakers"
    prompt: |
      Match each claim to its thinker. (i) "'Merciful' describes the effects of God's acts, as fire melts wax and hardens clay." (ii) "'Wise' is said of God and of people by analogy, according to proportion." (iii) "There is a Godhead beyond the God who can be named."
    options:
      - text: '(i) Maimonides; (ii) Aquinas; (iii) Eckhart.'
        correct: true
        feedback: |
          Yes. Attributes of action are Maimonides, analogy is Aquinas, God and Godhead is Eckhart.
      - text: '(i) Aquinas; (ii) Maimonides; (iii) Pseudo-Dionysius.'
        feedback: |
          The fire analogy is Maimonides's; analogy of names is Aquinas's; the God and Godhead split is Eckhart's, though he drew on Dionysius's "beyond".
      - text: '(i) Eckhart; (ii) Pseudo-Dionysius; (iii) Maimonides.'
        feedback: |
          This shuffles all three. Dionysius's contribution is the three steps (affirm, deny, go beyond), not the analogy of names.
    explanation: |
      Layer note: the four thinkers are not four schools in competition; Aquinas and Eckhart both read Dionysius, and Aquinas answers Maimonides. They differ in how much positive content a name keeps.

  - type: text
    id: part-ways
    title: "Where people part ways"
    body: |
      Thoughtful people split on at least three points, and the reason for each is different:

      - **Can a denial carry knowledge?** Defenders say yes: each denial removes something false, as in the creature that is "not a bird". Critics ask what is left to be denied, and whether a list of denials leaves any picture of God. This is a layer 2 debate about language and meaning.
      - **Silence or analogy?** Dionysius ends in unknowing, Aquinas keeps true statements by analogy. This turns on whether we trust words to reach beyond the finite, a mixture of philosophy of language (layer 2) and a view of God (layer 3).
      - **Deeper insight or lost content?** For admirers, Eckhart's Godhead is the end of idolatry, which mistakes a name for God; for critics, a God beyond all names cannot be worshipped, prayed to, or told apart from nothing. This turns on what one wants religious language to do (layer 3).

  - type: text
    id: summary
    body: |
      **Next:** the lesson Can We Speak About God at All? turns these medieval answers into a guided proof: does religious language say anything, why did verificationism claim it did not, and why did that claim fall.
