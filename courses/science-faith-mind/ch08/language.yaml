id: ch08-language
title: "Can We Speak About God at All?"
kind: guided
proof: true
own: |
  The setting: $s$ is any declarative sentence and $e$ is the sentence "God exists". Write $M(s)$ for "$s$ is factually meaningful" (it can be true or false about the world), $V(s)$ for "some possible experience could verify $s$" (confirm or refute it), and $A(s)$ for "$s$ is analytic" (true or false by the meanings of its words alone, like "all bachelors are unmarried").
  - **The verificationist argument.** According to **A. J. Ayer** (1910-1989, *Language, Truth and Logic*, 1936), who drew on the Vienna Circle, the argument has two premises and a conclusion (P1, P2, C):
  {{ $$M(s)\Rightarrow V(s)\lor A(s)$$ }}
  $$\neg V(e)\land\neg A(e)\quad\text{(P2)}$$
  $$\therefore\ \neg M(e)\quad\text{(C)}$$
  The argument is valid (if P1 and P2 are true, C follows); critics attack P1, since it also seems to condemn scientific laws that no finite set of experiences verifies.
  - **It undermines itself.** P1 asks every meaningful sentence to be verifiable or analytic, yet P1 is neither, so by its own standard
  {{ $$\neg V(\text{P1})\land\neg A(\text{P1})\ \Rightarrow\ \neg M(\text{P1})$$ }}
  Defenders may call P1 a proposal about how to use words, not a claim, but then it no longer shows that religious sentences are meaningless.
  - **Replies from within the debate.** **Karl Popper** offered falsifiability as a mark of *science*, not of meaning; **John Hick** (1922-2012) argued {{ that "God exists" would be verified, if true, by experience after death (eschatological verification) }}. **Antony Flew** (1923-2010) pressed the converse: a claim that nothing could ever count against is emptied by qualifications ("what would have to occur to constitute a disproof?"). **R. M. Hare** (1919-2002) answered that such convictions are *bliks*, basic ways of seeing the world, not assertions; **Basil Mitchell** (1917-2011) answered that the believer, like a resistance fighter trusting a stranger, lets evidence count against the claim yet keeps trust.
  - **Analogy as the answer.** According to **Thomas Aquinas** (c. 1225-1274), a word such as "good" said of God ($G$) and of a person is neither univocal (same sense) nor equivocal (unrelated senses) but analogical. One reading, analogy of proportionality, is
  {{ $$\frac{\text{goodness of } G}{\text{being of } G}\ \sim\ \frac{\text{goodness of a person}}{\text{being of a person}}$$ }}
  the other, analogy of attribution, is "healthy": said first of an animal, then of its medicine (cause of health) and its urine (sign of health).
  - **Where people part ways.** On P1 (what makes a sentence meaningful, layer 2); on whether faith is a claim that evidence can touch or a way of seeing (layers 2 and 3); on whether analogy keeps real content about God or only borrows words (layer 3).
cards:
  - type: mcq
    id: hook
    title: "Guess: does \"God is good\" say anything?"
    prompt: |
      Guess before any theory. Someone says "God is good". Which reaction seems most natural?
    options:
      - text: 'It says something about reality, like "the bridge is safe", which could be true or false.'
        correct: true
        feedback: |
          A natural guess, and the one most speakers (believers and many critics) would give. Whether it can survive scrutiny is what this lesson tests.
      - text: 'It only expresses a feeling of admiration, like "hurrah for God".'
        feedback: |
          Some philosophers say this about ethical words, and some have said it of religious words. It is a real position, but speakers usually use the sentence as a claim that can be argued for or against.
      - text: 'It says nothing at all: the words do not fit anything we could check.'
        feedback: |
          A tempting guess, and it is the position of the first argument in this lesson. We will test it step by step before deciding.
    explanation: |
      Keep your guess. Everything is taught *according to* each thinker, and each claim carries a label: (1) fact (texts, dates), (2) live scholarly debate, (3) faith or metaphysical commitment.

  - type: text
    id: recall
    title: "Recall: where the last lesson left us"
    body: |
      Recall: write $G$ for God and $F$ for a property word such as "good" or "wise". The lesson Saying What God Is Not met two answers to "how can we speak of $G$?". According to **Maimonides** (1138-1204), a statement "$G$ is $F$" really negates something:

      $$\text{"}G\text{ is wise"}\ \longrightarrow\ \text{"}G\text{ is not ignorant"}$$

      According to **Thomas Aquinas** (c. 1225-1274), "good" and "wise" are said of $G$ and of creatures neither in the same sense (*univocally*) nor in unrelated senses (*equivocally*) but **by analogy**, "according to proportion". That lesson left two worries: does a denial carry knowledge, and does analogy keep real content?

      This lesson asks the sharper question that came with twentieth-century philosophy: does a sentence like "$G$ is $F$", or even "$G$ exists", have **any** meaning that can be true or false? It is a guided proof: we build the argument that says no, test each premise, watch it fall, and return to analogy.

  - type: text
    id: criterion
    title: "The verifiability criterion: premises P1, P2, C"
    body: |
      The **Vienna Circle** was a group of philosophers and scientists who met in Vienna from the 1920s until 1936 (its nominal leader, Moritz Schlick, was murdered in 1936). According to the Stanford Encyclopedia, they used an empiricist criterion of meaning to reject metaphysics as **meaningless**, not merely false. **A. J. Ayer** (1910-1989) brought the idea to English readers in *Language, Truth and Logic* (1936). In essence, he held that a statement is factually meaningful only if it is **analytically true or false** or **empirically verifiable**.

      Two glosses. A sentence is **analytic** if its truth or falsity follows from the meanings of its words alone ("all bachelors are unmarried"). It is **empirically verifiable** if some possible experience would count for or against it.

      Notation: $s$ is any sentence, $e$ is "God exists", $M(s)$ means "$s$ is factually meaningful" (can be true or false about the world), $V(s)$ "$s$ is verifiable by experience", $A(s)$ "$s$ is analytic".

      - **P1.** $M(s)\Rightarrow V(s)\lor A(s)$: a sentence is meaningful only if verifiable or analytic.
      - **P2.** $\neg V(e)\land\neg A(e)$: "God exists" is neither.
      - **C.** $\neg M(e)$: so "God exists" is not factually meaningful.

      According to the Stanford Encyclopedia, Ayer did call religious statements "literally meaningless" in this sense; the claim is about *factual* content.

  - type: mcq
    id: classify
    title: "Sort three sentences"
    prompt: |
      Under the criterion above (meaningful only if analytic or verifiable by some possible experience), which sorting of these invented sentences is right? (a) "All bachelors are unmarried." (b) "There is a mountain on Mars taller than 8 km." (c) "Behind every event is a hidden essence that no experience could ever detect."
    options:
      - text: '(a) analytic; (b) verifiable; (c) neither, so not factually meaningful by this test.'
        correct: true
        feedback: |
          Yes. (a) is true by the meaning of "bachelor"; (b) could be checked by measurement; (c) is built so that no possible observation could count for or against it.
      - text: '(a) verifiable; (b) analytic; (c) verifiable.'
        feedback: |
          (a) is settled by word meanings, not by observation; (b) can be wrong or right only by measuring, so it is not analytic; (c) is stipulated undetectable.
      - text: 'All three are meaningful because each is a grammatical sentence.'
        feedback: |
          The criterion is about *factual* meaning, not grammar. A grammatical sentence can pass every test of grammar and still, by this standard, say nothing about the world.
    explanation: |
      Notice how P1 works as a filter. Many ordinary sentences pass; the question is whether it also filters out sentences that seem meaningful, and whether "God exists" belongs with (c).

  - type: mcq
    id: critic
    title: "Which premise would a critic reject?"
    prompt: |
      The argument is P1 ($M(s)\Rightarrow V(s)\lor A(s)$), P2 ("God exists" is neither verifiable nor analytic), so C ("God exists" is not factually meaningful). Which objection targets P2 rather than P1?
    options:
      - text: 'Experience after death could settle whether God exists, so "God exists" is verifiable after all.'
        correct: true
        feedback: |
          Yes: this keeps P1 and denies P2. It is John Hick's reply, which we meet shortly.
      - text: 'Scientific laws such as "all metals expand when heated" cannot be verified by a finite number of experiences.'
        feedback: |
          This attacks P1. If every meaningful sentence must be verifiable, a universal law that no finite list of observations confirms would be meaningless, which is absurd. According to the Stanford Encyclopedia, this problem hit early versions of the criterion.
      - text: 'P1 is itself neither verifiable nor analytic.'
        feedback: |
          This also attacks P1: by its own standard it would be meaningless. It is the next card.
    explanation: |
      A critic has three places to push: P1 (the criterion is too strict or defeats itself), P2 (God-sentences can be verified or can be analytic), or a different reading of "meaningful" (layer 2 debate about what meaning is).

  - type: mcq
    id: valid
    title: "Validity is not truth"
    prompt: |
      Suppose someone says: "The argument P1, P2, so C is valid." Which statement about what that claim means is correct?
    options:
      - text: 'If P1 and P2 are both true, C must be true; it says nothing yet about whether they are true.'
        correct: true
        feedback: |
          Yes. From P1 ($M(e)\Rightarrow V(e)\lor A(e)$) and P2 ($\neg V(e)\land\neg A(e)$), $M(e)$ would force $V(e)\lor A(e)$, contradicting P2; so $\neg M(e)$ follows.
      - text: 'Since the argument is valid, "God exists" is meaningless.'
        feedback: |
          Validity only passes truth from premises to conclusion. If P1 is false, the conclusion is not established, even though the logic is flawless.
      - text: 'The argument is invalid, because C says "meaningless" while P2 says "neither verifiable nor analytic".'
        feedback: |
          The step from the two premises to C is exactly modus tollens: from $M\Rightarrow(V\lor A)$ and $\neg(V\lor A)$ we get $\neg M$. The logic holds; the debate is about P1 and P2.
    explanation: |
      Keep two checks apart: (1) does the conclusion follow from the premises (validity), and (2) are the premises true (soundness). Here (1) holds; the whole fight is about (2).

  - type: mcq
    id: selfapply
    title: "Apply the criterion to itself"
    prompt: |
      P1 says: a sentence is factually meaningful only if verifiable by experience or analytic. Take P1 itself as a sentence. According to the Stanford Encyclopedia, what goes wrong?
    options:
      - text: 'P1 is neither verifiable by experience nor analytic, so by its own standard it is not factually meaningful.'
        correct: true
        feedback: |
          Yes. No experience could confirm "every meaningful sentence is verifiable or analytic", and it is not true by word meanings alone, at least not obviously. A criterion that fails its own test is in trouble.
      - text: 'P1 is analytic, so it is a tautology and therefore false.'
        feedback: |
          A tautology is not false; it is true by meaning. And if P1 were analytic, it would be an empty definition that proves nothing about religious sentences.
      - text: 'Nothing goes wrong: criteria are exempt from the tests they impose.'
        feedback: |
          A rule exempting itself needs a reason. The defender's best reply is that P1 is a *proposal* about how to use words; but then a believer may decline the proposal, and the argument loses its force.
    explanation: |
      Two views: the critic says self-refutation sinks verificationism; a defender says P1 is a recommended convention. According to the Stanford Encyclopedia, Ayer himself never found a workable formulation, and the Circle's later versions kept shrinking (layer 2).

  - type: text
    id: popper-hick
    title: "Two replies: Popper and Hick"
    body: |
      **Karl Popper** proposed **falsifiability** as the mark of a *scientific* theory: it must forbid some possible observation, so one clash with experience could refute it. According to the Stanford Encyclopedia, this is a test for demarcating science, not a test of meaning: Popper is not a positivist and allows that unscientific theories may be enlightening. So Popper does not hand us "God exists is meaningless", only "not science".

      **John Hick** (1922-2012) accepted Ayer's idea that a claim needs possible verification, and denied P2. In essence: a theist and a non-theist walk the same road; if it ends at a destination, the theist will find out on arrival. So the claim "God exists" can be verified, **if true**, by experience after death (eschatological verification, from Greek *eschaton*, "last things"). The Stanford Encyclopedia gives it as the reply that the verifying situation lies beyond this life.

  - type: mcq
    id: hick-q
    title: "Hick's reply and its limit"
    prompt: |
      According to critics of Hick's eschatological verification, which asymmetry limits it?
    options:
      - text: 'It can be confirmed by someone who reaches the destination, but if there is no afterlife nobody is ever in a position to find out it was false.'
        correct: true
        feedback: |
          Yes. The theist might one day have the experience that settles the matter; the sceptic never will, if the sceptic is right. This is a worry about the *symmetry* of testing, and defenders reply that confirmability in principle is all Ayer required.
      - text: 'Experience after death is impossible by definition, so the reply is self-contradictory.'
        feedback: |
          It is not contradictory: whether such experience occurs is a question of fact, not logic. The reply depends on an afterlife, which many religions affirm and many people deny.
      - text: 'Hick concedes that "God exists" is meaningless.'
        feedback: |
          The opposite: Hick accepts the test and says "God exists" passes it.
    explanation: |
      Layer note: Hick's reply works only for views that include some verifying experience beyond death; it does not touch religious views that speak of this life alone. Whether confirmable-in-principle is enough is a layer 2 debate.

  - type: text
    id: flew
    title: "Flew: death by qualification"
    body: |
      **Antony Flew** (1923-2010) turned the test around. His essay "Theology and Falsification" was first presented at an Oxford discussion in 1950 and published in 1955 in *New Essays in Philosophical Theology*. He borrowed a parable from **John Wisdom**'s paper "Gods" (1944-45), and adapted it.

      Two explorers come upon a clearing in a jungle. One says a gardener must tend it; the other doubts. They watch and test, and no gardener is ever found, yet the believer answers each test by qualifying the claim: the gardener is invisible, intangible, eternally elusive. The sceptic then asks, in Flew's words:

      > "Just how does what you call an invisible, intangible, eternally elusive gardener differ from an imaginary gardener or even from no gardener at all?"

      In essence, Flew's point is that a claim qualified every time it meets a test ends as no assertion at all.

      In essence, his closing question to believers is what would have to occur, or to have occurred, to count for them as a disproof of God's love or existence.

  - type: mcq
    id: flew-q
    title: "What does Flew claim?"
    prompt: |
      In the gardener parable, the believer answers each test by qualifying the original claim ("invisible", "intangible", "elusive"). According to Flew, what follows?
    options:
      - text: 'A claim that no possible observation could count against has lost its content: it no longer differs from "there is no gardener".'
        correct: true
        feedback: |
          Yes. A real assertion rules something out; if it rules out nothing, it asserts nothing. This is the falsification form of the empiricist challenge.
      - text: 'The gardener must exist, because absence of evidence cannot be evidence of absence.'
        feedback: |
          That is the believer's side, and Flew's challenge is aimed at it: after enough tests with no sign, the claim must say what would count against it, or give up its content.
      - text: 'Religious sentences express emotions only.'
        feedback: |
          Flew does not say this; his question is whether a statement is an assertion. Others in the discussion (Hare) say faith is not an assertion; see the next cards.
    explanation: |
      Notice the change of target. Ayer asked whether a sentence *could be confirmed*; Flew asks whether anything could *count against* it. Both press the same worry, that a claim compatible with everything says nothing.

  - type: text
    id: replies
    title: "Hare's blik and Mitchell's trust"
    body: |
      Two replies appeared in the same discussion.

      **R. M. Hare** (1919-2002), a moral philosopher, answered with his own parable: a lunatic convinced that all the dons (Oxford teachers) want to murder him. Every kindly don proves, to him, how cunning they are. Hare says this conviction is not an assertion that evidence refutes, but a **blik**, his word for a basic way of seeing the world, which colours everything and is not tested by it. In essence, Hare concedes that on Flew's ground Flew wins, but argues that religion is not on that ground: a blik is not a claim, yet it matters a great deal which blik you have.

      **Basil Mitchell** (1917-2011) disagreed with *both* Flew and Hare. His parable: in an occupied country, a member of the resistance meets a stranger who says he is the resistance leader. Later the stranger is seen helping the occupiers. The partisan keeps trust in him. Mitchell's point, in essence: the partisan does admit that the stranger's behaviour **counts against** his trust; he trusts anyway, as one trusts a friend. So faith is not empty, and not immune to evidence.

  - type: mcq
    id: replies-q
    title: "Where Hare and Mitchell part"
    prompt: |
      Flew asks believers what would count against God's existence. According to Hare and to Mitchell, which pair of answers is correct?
    options:
      - text: 'Hare: nothing counts against a blik, because it is not an assertion. Mitchell: much counts against the claim; the believer trusts anyway.'
        correct: true
        feedback: |
          Yes. Hare accepts Flew's test for assertions and denies that faith is one; Mitchell keeps faith an assertion and says it can be tested, with trust holding on through difficulties.
      - text: 'Hare: evidence is irrelevant. Mitchell: evidence is irrelevant.'
        feedback: |
          Mitchell's parable is built to deny this: the partisan feels the force of the stranger's suspicious acts.
      - text: 'Hare: religion is a scientific hypothesis. Mitchell: it is an emotion.'
        feedback: |
          Reversed and wrong: Hare thinks religion is not a testable assertion at all; Mitchell treats it as a claim held through trust.
    explanation: |
      Layer 2 debate. Critics reply to Mitchell: when does "counts against" become enough to give up the trust? And to Hare: if a blik is not an assertion, a believer seems to be asserting nothing about the world, which many believers reject.

  - type: text
    id: analogy
    title: "Back to analogy: a third way out"
    body: |
      There is a different line of reply: the criterion assumed that a word has *one* sense wherever it is used. Aquinas had asked how our words apply to God. Suppose "good" meant exactly what it means for a person: then God would be good in the human, finite way (a **univocal** use). Suppose it meant something unrelated: then "God is good" would tell us nothing (an **equivocal** use). According to Aquinas, the right use is **analogical**, with related but different senses. Two readings, both found in the Stanford Encyclopedia:

      - **Attribution.** "Healthy" is said first of an animal, and of its medicine (as cause of health) and urine (as sign of health) in a derived sense. "Good" is said first of God, as source of all goodness, and of creatures as derived.
      - **Proportionality.** Compare two ratios: the goodness of $G$ to the being of $G$ is like the goodness of a person to the being of a person. The two relations are similar even though the terms differ.

      $$\frac{\text{goodness of } G}{\text{being of } G}\ \sim\ \frac{\text{goodness of a person}}{\text{being of a person}}$$

  - type: order
    id: analogy-order
    title: "The argument from analogy"
    prompt: |
      According to Aquinas, put the argument that "$G$ is good" can be meaningful without being univocal in order.
    steps:
      - 'If "good" meant exactly what it means for a person, God would be good only in a finite, human way (univocal).'
      - 'If "good" meant something wholly unrelated, "God is good" would tell us nothing (equivocal).'
      - 'So the word must be used in related but different senses (analogy).'
      - 'Hence "God is good" can say something real about God, though imperfectly.'
    hint: |
      Reject the two extremes first, then state what remains, then the consequence for meaning.
    explanation: |
      This is a short proof by elimination. Its weak point is the next card: if the two senses differ, how do we know what the shared part is?

  - type: mcq
    id: analogy-obj
    title: "The standard objection to analogy"
    prompt: |
      A critic accepts that analogy sits between univocal and equivocal use, but says: in "goodness of $G$ is to being of $G$ as goodness of a person is to being of a person", one side is unknown to us. Which is the critic's point?
    options:
      - text: 'If we have no independent grasp of the divine side of the proportion, the analogy may fill in an unknown with borrowed words and say nothing definite.'
        correct: true
        feedback: |
          Yes. A proportion with one unknown term cannot be solved. Defenders reply that we know God's side through its effects (attribution), or that a weakened sense is still a sense.
      - text: 'Analogy is a form of equivocation, so it is the same as saying nothing.'
        feedback: |
          Aquinas distinguishes them: analogical senses are related, equivocal ones are not. The critic's worry is about how much the relation tells us, not that it is absent.
      - text: 'Analogy proves God exists.'
        feedback: |
          Analogy is a theory of how words apply, not an argument for existence; Aquinas argues for God's existence elsewhere.
    explanation: |
      So analogy answers the verificationist's worry about *sense*, but opens a worry about *content*. This is the same tension the previous lesson ended on, now with a name.

  - type: text
    id: part-ways
    title: "Where people part ways"
    body: |
      Thoughtful people split at three points, and the reason differs for each.

      - **What makes a sentence meaningful?** Ayer ties meaning to possible experience; critics say that tie condemns scientific laws and the criterion itself. This turns on a theory of meaning (layer 2).
      - **Is faith a claim or a way of seeing?** Flew and Mitchell treat it as a claim that evidence can touch; Hare treats it as a blik. This turns on what believers themselves mean, and on whether a conviction that nothing could count against can still be rational (layers 2 and 3).
      - **Does analogy keep content?** Defenders say a related sense is still a sense; critics say the divine side of the proportion stays unknown. This turns on what we think God is like, if anything (layer 3).

      Established fact: the dates, books and parables of this lesson. Live debate: whether any criterion of meaning survives, and what believers must say to Flew. Faith commitment: whether the God of the analogy exists.

  - type: text
    id: summary
    body: |
      **Next:** the quick-fire round of this level, Level 8 Traps, tests the commonest slips on God's attributes, time, pantheism, negative theology and religious language.
