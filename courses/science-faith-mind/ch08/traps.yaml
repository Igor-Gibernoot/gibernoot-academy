id: ch08-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: the nature of God"
    body: |
      Fast round. Each question hides a **tempting shortcut** about the ideas met in this level: the "omni" attributes, God and time, pantheism and panentheism, process and open theism, the Trinity and "the same God", negative theology and analogy, and the claim that religious words are meaningless. Every shortcut is a *useful idea turned too far*.

      Nothing here asks whether God exists. Answers are given *according to* someone, and where thoughtful people differ the feedback shows both sides. Notation as in the lessons: $G$ is God, $W$ the world, $F$ a property word such as "wise".

  - type: mcq
    id: omnipotence
    title: "All-powerful means anything at all?"
    prompt: |
      A student says: "If God is all-powerful, God can do anything, even make a square circle." According to Aquinas, what is wrong with this?
    options:
      - text: 'A square circle is not a hard task but no task at all: the words describe nothing that could be brought about. According to Aquinas, what implies a contradiction is outside the scope of omnipotence, so omnipotence means being able to bring about every possible state of affairs, $\forall s\,(\Diamond s\Rightarrow\mathrm{Can}(g,s))$. (A reading usually attributed to Descartes allows even the impossible.)'
        correct: true
      - text: 'Nothing: omnipotence means that no limit of any kind applies, and every reading of the word agrees.'
        feedback: |
          The readings disagree. The "anything" reading is the one usually attributed to Descartes; Aquinas and most later defenders restrict omnipotence to what is possible, and a third reading also asks that the act fit God's nature $N$.
      - text: 'God cannot do the contradictory task because God is not powerful enough.'
        feedback: |
          This treats the contradictory task as a very hard task. Aquinas says the failure is in the description, not in the power: "make a square circle" does not name something that could exist.
      - text: 'Aquinas says God can do only what God has already done.'
        feedback: |
          Nothing in the possible-worlds reading ties God to the past. It says God can bring about any state of affairs that is possible in at least one possible world.
    explanation: |
      The slogan "can do anything" hides a choice among readings. The stone paradox gets a different answer under each: a contradictory task is no limit (Mavrodes), or the impossible is allowed (Frankfurt), or omnipotence is held only for a time.

  - type: mcq
    id: euthyphro
    title: "Good because commanded, or commanded because good?"
    prompt: |
      A student answers the Euthyphro question: "God commands what is good because it is good, and that is obviously the safe answer, since it keeps God wise." What is the cost of this horn, and what does the divine-nature reply say?
    options:
      - text: 'The cost: the good is then a standard that exists independently of God, which God consults. The divine-nature reply says God''s own character is the standard of the good, so it is neither a command nor an outside law.'
        correct: true
      - text: 'The cost: God is then arbitrary. The divine-nature reply says God commands at random.'
        feedback: |
          Arbitrariness is the cost of the *other* horn (the good is good merely because commanded). The first horn risks making God answerable to an outside standard.
      - text: 'There is no cost: an independent standard of good only makes God more powerful.'
        feedback: |
          An independent standard limits what God could have made good, which some thinkers find a cost for a being said to be the source of everything.
      - text: 'The divine-nature reply picks the second horn and says commands make things good.'
        feedback: |
          It is a third option: God's nature (not a command, not an outside law) is the standard. Critics ask whether this explains the good or only relabels it.
    explanation: |
      Horn 1 (commanded because good): the good is independent of God. Horn 2 (good because commanded): the good looks arbitrary. The divine-nature reply tries to escape both, and whether it succeeds is a live debate.

  - type: mcq
    id: omniscience-converse
    title: "Knowing only truths means knowing all truths?"
    prompt: |
      For a subject $S$ and a proposition $p$, write $K_S\,p$ for "$S$ knows $p$". A student says: "$K_S\,p\Rightarrow p$ (whatever $S$ knows is true), so $S$ is omniscient." Which reply is correct?
    options:
      - text: 'That condition holds for every knower, since one cannot know something false. Omniscience is the converse direction, $\forall p\,(p\Rightarrow K_S\,p)$: every truth is known by $S$.'
        correct: true
      - text: 'Omniscience means $K_S\,p\Rightarrow p$, so the student is right.'
        feedback: |
          That implication only says knowledge is factive (true). Someone who knows a single fact satisfies it. Completeness needs the other direction.
      - text: 'Omniscience means $S$ believes everything.'
        feedback: |
          Believing everything includes false and contradictory claims. Omniscience is knowing every truth, and only truths.
      - text: 'Omniscience means $S$ knows every possible sentence, true or false.'
        feedback: |
          Knowing a sentence as false is knowing a truth (that it is false). The definition quantifies over truths $p$, not over all sentences.
    explanation: |
      Direction matters: $K_S\,p\Rightarrow p$ is true for any knower and measures nothing; $p\Rightarrow K_S\,p$ for all $p$ is the claim of completeness.

  - type: mcq
    id: foreknowledge
    title: "Knowing in advance is causing?"
    prompt: |
      Suppose God believed yesterday that you will choose tea today, and God cannot be wrong. A student says: "So God's knowing forced you to choose tea." According to those who defend compatibility (for example Aquinas), which reply is best?
    options:
      - text: 'Knowing is not causing. The argument (Pike, 1965) is about the fixed past: if the belief is already in the past and cannot be wrong, you cannot do otherwise. Aquinas distinguishes necessity of the consequence ("if God knows you will choose tea, you will") from necessity of the consequent ("you will choose tea" is itself necessary); only the first holds.'
        correct: true
      - text: 'God''s knowledge does cause the choice, and that is why God knows it.'
        feedback: |
          This is a position (God's knowledge as creative), but not the one that compatibilists need, and it makes the choice God's doing. The usual reply keeps your choice yours.
      - text: 'The argument shows God knows nothing about the future.'
        feedback: |
          That is the open theist's way out, a different reply. The argument itself only shows a tension between a fixed past and freedom to do otherwise.
      - text: 'The argument has no force: whatever is known in advance is always necessary.'
        feedback: |
          This is the very step that Aquinas rejects: "if God knows $p$ then $p$" is necessary, but that does not make $p$ itself necessary.
    explanation: |
      Three families of reply to the same argument: distinguish the two necessities (Aquinas), move God outside time (Boethius), or deny that the free future is yet a truth to know (open theists). None of them says that knowing causes.

  - type: mcq
    id: eternal
    title: "Eternal means a very long time?"
    prompt: |
      A student says: "God is eternal, so God has existed for an unimaginably long time, with no beginning." According to Boethius and Aquinas, what does "eternal" mean, and which word does the student's picture match?
    options:
      - text: 'Eternal: outside time altogether, with no "before" or "after" and the whole of life possessed "all at once". The student''s picture, inside time with no beginning and no end, is called everlasting, the view of Wolterstorff and Swinburne.'
        correct: true
      - text: 'Eternal and everlasting are two words for the same view.'
        feedback: |
          They are two different pictures. Everlasting is a very long (endless) stretch of time; eternal says God is not located in time at all.
      - text: 'Eternal means that God lives through the whole of time, one moment after another, forever.'
        feedback: |
          That is the everlasting view. Boethius and Aquinas keep "eternal" for a way of living that is not spread out in moments.
      - text: 'Eternal means that time does not exist.'
        feedback: |
          The claim is about God's relation to time, not about time itself. Time exists for creatures; God is said to be outside it.
    explanation: |
      The choice has consequences: an eternal God has no "yesterday" beliefs, so the foreknowledge premise fails as stated; an everlasting God keeps the premise alive and invites other replies.

  - type: mcq
    id: spacelike
    title: "Relativity says no events have an order?"
    prompt: |
      In units where light travels 1 unit of space per unit of time, an event $E$ lies at distance $a$ from the meeting event $O$ and at time $\tau$ on Alice's clock, with Bob moving past Alice. A student says: "Relativity of simultaneity means that observers disagree about the order of *every* pair of events." Which reply is correct?
    options:
      - text: 'Only for spacelike pairs, $|a|>|\tau|$, which no signal at light speed or slower can join. For timelike pairs, $|a|<|\tau|$, all observers agree on the order.'
        correct: true
      - text: 'The student is right: relativity abolishes all order of events.'
        feedback: |
          Causes still come before effects for everyone: if a signal at most light speed can go from one event to the other, every observer puts them in the same order.
      - text: 'Observers disagree only when the events are close together in space.'
        feedback: |
          It is the opposite: events at the same place agree. Disagreement needs a large distance compared with the time between the events, $|a|>|\tau|$.
      - text: 'Observers disagree only about the length of the interval, never about order.'
        feedback: |
          They also disagree about order for spacelike pairs, as the computation $t_B=\gamma(\tau-ua)$ shows with $E=(3,0)$ giving $-2.25$.
    explanation: |
      Relativity removes a *unique universal now*, not the order of causes and effects. What this means for God and time (eternalism, presentism, growing block) is a live debate; the physics itself is established.

  - type: numeric
    id: bob-time
    title: "Bob's clock for a distant event"
    prompt: |
      Units: light travels 1 unit of space per unit of time. Alice is at rest; Bob moves past her at speed $u=0.6$ (so $\gamma=1.25$) and they meet at the event $O$. An event $E=(a,\tau)=(5,0)$ occurs at distance $a=5$ from $O$ along Bob's direction of motion, at time $\tau=0$ on Alice's clock. A student says: "$E$ is simultaneous with $O$ for Alice, so it is simultaneous with $O$ for Bob too, $t_B=0$." Using $t_B=\gamma(\tau-u\,a)$, what is Bob's time $t_B$ for $E$?
    answer: -3.75
    tolerance: 0.01
    wrong:
      - { value: 0, feedback: "That assumes simultaneity is absolute. Here $|a|=5>|\\tau|=0$, so the pair is spacelike and Bob disagrees with Alice about the order." }
      - { value: 3.75, feedback: "Sign slip: $\\tau-ua=0-3=-3$, and times $1.25$ is negative. $E$ is in Bob's past, not his future." }
      - { value: -3, feedback: "That omits the factor $\\gamma=1.25$: $t_B=\\gamma(\\tau-ua)=1.25\\times(-3)$." }
    hint: "Compute $\\tau-u\\,a$ first, then multiply by $\\gamma$."
    explanation: |
      $u\,a=0.6\times5=3$, so $\tau-ua=-3$ and $t_B=1.25\times(-3)=-3.75$. The event Alice calls "now" is in Bob's past. Because $|a|>|\tau|$ the pair is spacelike, so this disagreement about order is allowed by physics.

  - type: mcq
    id: three-views
    title: "Pantheism, panentheism: the same thing?"
    prompt: |
      With $G$ for God and $W$ for the world, a student says: "Pantheism says $G=W$ and panentheism says the world is in God, so they are the same view." Which reply is correct?
    options:
      - text: 'Pantheism is $G=W$. Panentheism is $W\subsetneq G$: the world is inside God but God is more than the world, and the world keeps its own reality. Classical theism is $G\neq W$.'
        correct: true
      - text: 'They are the same, because both put the world in God.'
        feedback: |
          Under $G=W$ there is nothing of God beyond the world; under $W\subsetneq G$ there is. That "more than" is the whole difference.
      - text: 'Panentheism is the view that $G\neq W$ and God acts on the world from outside.'
        feedback: |
          That is classical theism. Panentheism denies that God is merely a separate thing next to the world.
      - text: 'Panentheism says $G\subsetneq W$: God is a part of the world.'
        feedback: |
          The inclusion is reversed. Panentheism puts the world inside God, not God inside the world.
    explanation: |
      Three lines to remember: $G=W$ (pantheism), $W\subsetneq G$ (panentheism), $G\neq W$ (classical theism). Critics add that "in" is vague; defenders reply that dependence plus real distinctness draws the line.

  - type: mcq
    id: deus-natura
    title: "Deus sive Natura means Nature is a person?"
    prompt: |
      A student reads Spinoza's phrase *Deus sive Natura* ("God, or Nature") as "Nature is a person who made and loves the world". What does Spinoza's phrase say, according to the usual reading?
    options:
      - text: 'That God and Nature are one thing under two names, with $\text{God}=\text{Nature}$: one infinite substance, with finite things as its modes. It does not say that God is a person who made Nature, since according to Spinoza God acts from necessity, not for ends.'
        correct: true
      - text: 'That a personal God stands outside Nature and rules it.'
        feedback: |
          That is the classical picture, $G\neq W$, which Spinoza rejects: for him things are modes of God, not creations separate from God.
      - text: 'That Nature is only a heap of things, with no unity.'
        feedback: |
          For Spinoza Nature is one substance, a single self-explaining whole, not a heap.
      - text: 'That there is no God at all, so Spinoza was a plain atheist.'
        feedback: |
          This is one contemporary charge, but his defenders say he kept the word and the object of reverence. Whether pantheism is reverence for Nature or a polite atheism is a live debate.
    explanation: |
      The same phrase draws two reactions: "atheist" (no loving creator) and "God-intoxicated" (all there is, is divine). Einstein said in essence that he believed in Spinoza's God of lawful harmony, not a God concerned with human fates.

  - type: mcq
    id: dipolar
    title: "Process God: all change, or no change?"
    prompt: |
      A student says: "In process theology God changes with the world, so God has no fixed character, and God is loving only today." According to Hartshorne, what is wrong?
    options:
      - text: 'God is dipolar. The abstract pole is God''s enduring character $C$ (for example, love and wisdom), which never changes. The concrete pole is God''s experience $E(t)$, which changes with the world.'
        correct: true
      - text: 'Nothing: for process thinkers everything about God changes, including God''s character.'
        feedback: |
          Hartshorne keeps a changeless pole: God's character stays the same while God's experience grows. That is the point of "dipolar".
      - text: 'God does not change at all, as in classical theism.'
        feedback: |
          Classical theism holds God immutable. Process thinkers revise that: the concrete pole really changes.
      - text: 'God changes only by deciding to, as open theists say.'
        feedback: |
          Open theists say that God's limits come from God's own choice. For process thinkers the changing pole is part of what God is, a feature of reality, not a choice.
    explanation: |
      Two poles, two verdicts: $C$ never changes, $E(t)$ changes with the world. God acts by persuasion, offering possibilities, not by coercion.

  - type: mcq
    id: open-future
    title: "Open theism: God does not know enough?"
    prompt: |
      Write $F$ for a future free choice not yet made. A student says: "Open theists say God is ignorant of the future, so God is less than omniscient." According to open theists, what is the reply?
    options:
      - text: 'Omniscience is knowing every truth. If $F$ is not yet a fact, there is nothing yet to know, so not knowing it is no failure of knowledge. Critics reply that this still leaves God less informed than the classical picture, and that it changes what providence means.'
        correct: true
      - text: 'God does know $F$ but chooses to forget it.'
        feedback: |
          That is not the claim. The claim is that there is, as yet, no fact about $F$ to be known.
      - text: 'God knows nothing about the future, not even laws and tendencies.'
        feedback: |
          Open theists say God knows everything knowable, including what is settled and what is possible; only the unsettled free choices lack a truth to know.
      - text: 'Open theism denies that God created the world from nothing.'
        feedback: |
          Unlike process thought, open theism keeps creation *ex nihilo* (from nothing).
    explanation: |
      Not knowing a non-fact differs from ignorance of a fact. Whether the future free act is already true is the real dispute, and where process and open thinkers also differ: limits built into reality, or limits God chose.

  - type: mcq
    id: trinity
    title: "Fix the Trinity puzzle: which slip?"
    prompt: |
      Write $F$ for the Father, $S$ for the Son and $G$ for God. From "$F=G$" and "$S=G$" a student concludes "so $F=S$, and the Trinity is a contradiction." Which reply best fits the creed?
    options:
      - text: 'Trinitarians deny that "is" in "the Son is God" is bare identity: it says the Son is fully divine, sharing the one essence. The three persons are one God without being one person, which avoids both modalism and tritheism.'
        correct: true
      - text: 'The three are really one person in three roles: this is the creed''s own answer.'
        feedback: |
          That is modalism (Sabellius, c. 217-220), which the creed rules out because it erases the real distinction.
      - text: 'There are three gods, so $F\neq S$ and no puzzle arises.'
        feedback: |
          That is tritheism, which the creed also rules out because it loses the real unity. Alston called one social version a fairly straightforward form of tritheism, but defenders of the social view deny the charge.
      - text: 'The Son is a creature, so $S\neq G$.'
        feedback: |
          That is Arianism (Arius): the Son is not of the same substance as the Father. Nicaea (325) affirmed *homoousios*, of the same substance.
    explanation: |
      Three tempting simplifications, three condemned misreadings: one person (modalism), three gods (tritheism), a lesser Son (Arianism). Whether the creed's own answer is coherent is a live debate among philosophers.

  - type: mcq
    id: same-god
    title: "Same God: one question or three?"
    prompt: |
      Christians and Muslims describe God differently. A student says: "They describe God differently, so they cannot be talking about the same God." According to Volf, what does this skip?
    options:
      - text: 'The difference between reference and description. Same reference does not imply same description: two people can refer to the same person while holding different beliefs about that person. Volf argues Christians and Muslims refer to the same God. Critics reply that when descriptions differ as deeply as the Trinity and tawhid do, the object of worship differs.'
        correct: true
      - text: 'Nothing: different descriptions always mean different objects.'
        feedback: |
          Two people can disagree about a mutual friend's character and still be talking about the same friend. Volf's case is that reference survives differing descriptions.
      - text: 'That all religions teach the same doctrine in different words.'
        feedback: |
          Volf does not say this. He says the reference is shared; the descriptions really differ, and the differences matter.
      - text: 'That worship is irrelevant to the question.'
        feedback: |
          "Same God?" can be asked about reference, about description, or about worship, and some critics answer through worship. Keeping the three questions apart is the lesson.
    explanation: |
      Three questions share one slogan: same reference? same description? same worship? A "yes" to one may go with a "no" to another, and which question is natural depends on one's faith commitments (layer 3).

  - type: mcq
    id: not-opposite
    title: "God is not wise-less, so God is foolish?"
    prompt: |
      Negative theology says "$G$ is not $F$" for some property word $F$. A student takes "God is not wise" to mean "God is foolish". According to Dionysius and Maimonides, what is wrong?
    options:
      - text: 'Denying $F$ is not asserting the opposite. For Dionysius the denial warns that human "wise" falls short of God, and one then goes beyond both affirmation and denial. For Maimonides a positive-looking "$G$ is wise" really means "$G$ is not ignorant", a denial of a lack.'
        correct: true
      - text: 'Nothing: "not wise" and "foolish" mean the same.'
        feedback: |
          "Not wise" is a denial; "foolish" is a positive opposite. A stone is not wise and is not foolish either. Negative theology uses the denial to say that the property, as we understand it, does not fit.
      - text: 'Negative theology says nothing can be said about God, so no statement is true.'
        feedback: |
          Dionysius still affirms and denies, then goes beyond. Maimonides lists statements of what God is not and attributes of action. The aim is careful speech, not silence only.
      - text: 'The denial applies to $F$ only for humans, and God is exactly wise as we are.'
        feedback: |
          That is the univocal view, which these writers reject: words made for finite things cannot be applied in the same sense to God.
    explanation: |
      A denial is not a contrary. Dionysius uses denial against idols of the mind; Maimonides turns affirmations into denials of lack ("not ignorant") or descriptions of effects, as fire melts wax and hardens clay without the fire changing.

  - type: mcq
    id: negate-negations
    title: "Beyond life means lifeless?"
    prompt: |
      According to Pseudo-Dionysius (writing c. 500), God is "beyond" life. A student reasons: "Beyond life means without life, so God is lifeless, like a stone." What does Dionysius mean by "even the negations must be negated"?
    options:
      - text: 'The three steps are affirm ("$G$ is $F$"), deny ("$G$ is not $F$"), and go beyond both. God is beyond life, not lifeless: "lifeless" is also a human category that falls short, so the denial is itself denied.'
        correct: true
      - text: 'Affirmations are true and the negations are false, so nothing is denied.'
        feedback: |
          Dionysius takes the denials seriously: they correct the affirmations. But he adds that neither pair of opposites captures God.
      - text: 'It means that God is both living and lifeless.'
        feedback: |
          Asserting both is still within the pair of opposites. "Beyond" means the pair no longer applies as we understand it.
      - text: 'It means we should stop reading and be silent.'
        feedback: |
          Silence is one reading some mystics take. But Dionysius's text keeps all three steps, and scholars disagree about whether the goal is knowing or an experience beyond knowing.
    explanation: |
      "Beyond life" is not "less than life". The step beyond says that the whole contrast (alive or lifeless) belongs to creatures. Critics ask whether such a God can be said anything; the objection is why Aquinas gives analogy real content.

  - type: mcq
    id: analogy
    title: "Analogy: same sense, or just a pun?"
    prompt: |
      "Good" is said of a person and of $G$. A student says: "Either it means the same in both cases, or the two meanings are unrelated." Which reply is Aquinas's?
    options:
      - text: 'There is a third way: analogy. The word is neither univocal (same sense) nor equivocal (unrelated senses). Like "healthy" said of an animal, of its medicine (cause of health) and of its urine (sign of health), the senses are different but related, said "according to proportion".'
        correct: true
      - text: 'It means exactly the same, since God is good in the way a good person is.'
        feedback: |
          That is the univocal view, which Aquinas rejects: God's goodness is not a human goodness made larger.
      - text: 'It is a mere pun: the same sound for unrelated meanings.'
        feedback: |
          That is the equivocal view. Then we could say nothing true about God from creatures, and Aquinas thinks names such as "good" do signify God, imperfectly.
      - text: 'It means "not bad", so analogy is just negation.'
        feedback: |
          That is closer to Maimonides. Aquinas holds that "God lives" is more than the denial "God is not lifeless": the names signify something of God's reality, imperfectly.
    explanation: |
      The standard objection: if the senses differ and we do not grasp God's side of the ratio, does analogy keep any content? Defenders answer with the proportion, goodness of $G$ to being of $G$ as goodness of a person to being of a person; critics say one side of the ratio is unknown.

  - type: mcq
    id: verification
    title: "A valid argument that religious words are meaningless?"
    prompt: |
      With $s$ a sentence and $e$ "God exists": P1 $M(s)\Rightarrow V(s)\lor A(s)$, P2 $\neg V(e)\land\neg A(e)$, so C $\neg M(e)$, where $M$ is "factually meaningful", $V$ "verifiable" and $A$ "analytic". A student says: "The argument is valid, so religious language is meaningless." Which reply is correct?
    options:
      - text: 'Valid means only that if P1 and P2 are true then C follows. P1 can be rejected, and it is a problem for P1 itself: P1 is neither verifiable nor analytic, so by its own standard $\neg M(\text{P1})$. Defenders may call P1 a proposal, but then it no longer shows religious sentences meaningless.'
        correct: true
      - text: 'Valid arguments always have true conclusions.'
        feedback: |
          Validity is about form: a valid argument with a false premise can have a false conclusion. Truth of the premises must be argued separately.
      - text: 'The argument is invalid, because C does not follow from P1 and P2.'
        feedback: |
          It does follow: if every meaningful sentence is verifiable or analytic, and $e$ is neither, then $e$ is not meaningful. The attack is on P1, not on the logic.
      - text: 'P1 is true because it is analytic.'
        feedback: |
          If P1 were analytic it would be true by the meaning of words alone. The criterion is not obviously that, and a stipulated meaning of "meaningful" would not tell us that religious sentences are meaningless in ordinary use.
    explanation: |
      Two separate checks: is it valid, and are the premises true? A second worry: P1 also seems to condemn universal scientific laws that no finite experience verifies. According to Ayer, "God exists" is neither verifiable nor analytic; many later philosophers rejected the criterion.

  - type: mcq
    id: replies
    title: "Flew, Hare, Mitchell: who says what?"
    prompt: |
      Flew asked what would count against the claim that God exists, or whether the claim dies the death of a thousand qualifications. Which pairing of the three speakers is correct?
    options:
      - text: 'Flew: a claim that nothing could count against is emptied of content. Hare: faith is a blik, a way of seeing, not an assertion that evidence tests. Mitchell: faith is an assertion, evidence counts against it, and the believer trusts anyway, like the partisan and the stranger.'
        correct: true
      - text: 'Flew defends faith, Hare attacks it, Mitchell is neutral.'
        feedback: |
          Flew pressed the challenge, Hare and Mitchell each replied to it differently. None of the three is simply "for" or "against" God.
      - text: 'Hare says faith is an assertion that evidence tests; Mitchell says it is a blik.'
        feedback: |
          The two are swapped. The blik is Hare's idea; the partisan who admits the evidence counts against the stranger, and trusts anyway, is Mitchell's.
      - text: 'All three say that evidence is irrelevant to religious claims.'
        feedback: |
          Flew says evidence is exactly what a real claim must be exposed to, and Mitchell says the partisan feels the force of the evidence.
    explanation: |
      Hare concedes Flew's test for assertions and denies that faith is one; Mitchell keeps faith an assertion and denies that it is immune. Critics ask Hare how a believer asserts anything, and Mitchell when "counts against" becomes enough to give up trust.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Eighteen traps, one pattern: each turned a *useful* idea into a shortcut.

      - **Attributes**: omnipotence is $\forall s\,(\Diamond s\Rightarrow\mathrm{Can}(g,s))$ on Aquinas's reading, not "anything"; omniscience is $\forall p\,(p\Rightarrow K_S\,p)$, not $K_S\,p\Rightarrow p$. The Euthyphro question has two costs (independent standard, arbitrary command) and a third answer, the divine nature. Knowing is not causing: the foreknowledge argument rests on the fixed past.
      - **Time**: eternal (outside time) is not everlasting (inside, endless). For $u=0.6$, $\gamma=1.25$ and $t_B=\gamma(\tau-ua)$, the event $(5,0)$ has $t_B=-3.75$; only spacelike pairs, $|a|>|\tau|$, have no agreed order.
      - **God and the world** ($G$ God, $W$ world): $G=W$ pantheism, $W\subsetneq G$ panentheism, $G\neq W$ classical theism. *Deus sive Natura* identifies God with Nature; it does not make Nature a person. Process: $C$ fixed, $E(t)$ changing. Open theism: $F$ not yet a fact, so not knowing it is not ignorance of a fact.
      - **Three traditions**: the Trinity is neither modalism, tritheism nor Arianism, and "is" is not bare identity. "Same God?" splits into reference, description and worship; same reference does not give same description.
      - **Speaking about God** ($F$ a property word): a denial is not the opposite; "beyond life" is not "lifeless". Analogy is neither univocal nor equivocal. In the verifiability argument (P1, P2, C) validity is not truth, and P1 fails its own test. Flew, Hare and Mitchell answer differently: empty claim, blik, trust that counts evidence.

