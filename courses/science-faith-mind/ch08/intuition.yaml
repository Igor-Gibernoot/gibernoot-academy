id: ch08-intuition
title: Quick Recall
kind: intuition

cards:
  - type: text
    id: welcome
    title: "Quick recall: attributes, time, pantheism, apophatic speech, meaning"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: the attributes of God (omnipotence, omniscience, the Euthyphro question), God and time, the three ways to relate God and the world, process theology, negative and analogical speech about God, and the verificationist challenge.

      Three kinds of card: **mnemonics** (the shape of a definition or argument), **build and order cards** (assemble a formula or a chain) and **checks** (does it behave sensibly?). The two numeric cards at the end give you data only: choose the right tool yourself.

      As always, answers are given *according to* a thinker or a view. Nothing here asks you to decide whether God exists.

  - type: mcq
    id: omnipotence
    title: "Omnipotence in one line"
    prompt: |
      Let $s$ range over states of affairs, $\Diamond s$ mean "$s$ is possible" and $\mathrm{Can}(g,s)$ mean "God can bring about $s$". According to the reading most defenders of omnipotence adopt (Aquinas: what implies a contradiction does not fall under God's power), which line states it?
    options:
      - text: '$\forall s\,(\Diamond s\Rightarrow \mathrm{Can}(g,s))$: God can bring about every possible state of affairs.'
        correct: true
      - text: '$\forall s\,\mathrm{Can}(g,s)$: God can bring about anything whatever.'
        feedback: |
          This is the "anything" reading. It includes impossible states such as a round square or a stone too heavy for its maker to lift, and then the paradox of the stone arises at once. Few defenders hold it (Descartes is the classic exception, read by some as saying God's power exceeds logic).
      - text: '$\forall s\,(\mathrm{Can}(g,s)\Rightarrow\Diamond s)$: whatever God can do is possible.'
        feedback: |
          The arrow is turned round. This says God's power never reaches beyond the possible, but not that it reaches *all* of the possible.
      - text: '$\exists s\,\mathrm{Can}(g,s)$: God can bring about something.'
        feedback: |
          That is true of any agent that can do anything at all. Omnipotence is about *all* the possible.
    explanation: |
      Mnemonic: **every possible state, not literally anything**. A third reading adds that the state must be compatible with God's nature $N$: $\Diamond(s\land N)$, so God cannot sin.

  - type: build
    id: omniscience-build
    title: "Omniscience"
    prompt: |
      Let $p$ be any proposition and $K_S\,p$ mean "$S$ knows that $p$". Assemble the standard definition of an omniscient being $S$: for every proposition, if it is true then $S$ knows it.
    prefix: ''
    tiles: ['\forall p', '(p', '\Rightarrow', 'K_S\,p)', '(K_S\,p', 'p)', '\exists p']
    answers:
      - ['\forall p', '(p', '\Rightarrow', 'K_S\,p)']
    wrong:
      - answer: ['\forall p', '(K_S\,p', '\Rightarrow', 'p)']
        feedback: |
          This says everything $S$ knows is true. That holds of any knower (knowledge is factive) and says nothing about knowing *everything* true.
      - answer: ['\exists p', '(p', '\Rightarrow', 'K_S\,p)']
        feedback: |
          "There is some $p$" would make $S$ merely know *something*. Omniscience needs "for all".
    hint: Truth first, then knowledge, for every proposition.
    explanation: |
      Mnemonic: **if true, then known, for all $p$**. The hard cases are about the future (foreknowledge and freedom) and about knowing from the inside what a creature feels.

  - type: mcq
    id: euthyphro
    title: "The Euthyphro question"
    prompt: |
      Is an act good because God commands it, or does God command it because it is good? Two horns follow, and a third answer. Which pairing of horn and problem is correct?
    options:
      - text: 'Good because God commands it: goodness looks arbitrary (God could have commanded cruelty). Good independently of God: there is a standard above God. Third answer: good flows from God''s own nature.'
        correct: true
      - text: 'Good because God commands it: there is a standard above God. Good independently of God: goodness looks arbitrary.'
        feedback: |
          The problems are swapped. A standard that holds *independently* of God is the one that stands above God; goodness fixed only by command is the one that looks arbitrary.
      - text: 'Both horns are harmless, so no third answer is needed.'
        feedback: |
          Each horn costs something. Command theorists feel the arbitrariness, those who accept an independent standard feel the loss of God as the source of morality. That is why a third option was proposed.
      - text: 'The third answer says goodness is whatever any majority commands.'
        feedback: |
          That is a social view of morality, not an answer to the Euthyphro question about God. The proposal is that goodness is grounded in God's unchanging nature, so God's commands are neither arbitrary nor imposed from outside.
    explanation: |
      Mnemonic: **command $\to$ arbitrary; independent $\to$ above God; nature $\to$ the third way**. Critics of the third way ask whether "God's nature is good" then repeats the question one step back.

  - type: mcq
    id: eternal-everlasting
    title: "Eternal or everlasting?"
    prompt: |
      Two ways to say God relates to time. According to Boethius, God is *eternal*; according to Wolterstorff and Swinburne, God is *everlasting*. Which pair of descriptions is correct?
    options:
      - text: 'Eternal: outside time, possessing the whole of life at once. Everlasting: inside time, with no beginning and no end.'
        correct: true
      - text: 'Eternal: inside time with no beginning or end. Everlasting: outside time, all at once.'
        feedback: |
          Swapped. The word *everlasting* already says "lasting for ever", which is a length of time; *eternal* in this sense means timeless.
      - text: 'Both mean that God lived for a very long time before creation.'
        feedback: |
          Neither view needs a long past. The eternal God has no "before" at all, and the everlasting God has a past without a first moment.
      - text: 'Eternal: God changes endlessly. Everlasting: God never acts.'
        feedback: |
          Neither word is about change versus action. An everlasting God may well act and respond in time; the question is whether God's life is spread over moments.
    explanation: |
      Mnemonic: **eternal = no time; everlasting = all time**. The timeless view helps the foreknowledge problem and strains the idea of a God who acts and responds in history; the everlasting view has the reverse profile.

  - type: mcq
    id: limit-check
    title: "Limit check: Bob at rest"
    prompt: |
      In units where light covers 1 unit of space per unit of time, Alice is at rest and Bob moves at speed $u$. For an event $E=(a,\tau)$ (distance $a$, Alice's time $\tau$), Bob's time is
      $$t_B=\gamma\,(\tau-u\,a),\qquad \gamma=\frac{1}{\sqrt{1-u^2}}.$$
      What does this reduce to when $u=0$, and why is that sensible?
    options:
      - text: '$t_B=\tau$: if Bob does not move, he agrees with Alice about when $E$ happens.'
        correct: true
      - text: '$t_B=0$: a Bob at rest has no time of his own.'
        feedback: |
          At $u=0$ we get $\gamma=1$ and $u\,a=0$, so $t_B=\tau$. Nothing makes his time vanish.
      - text: '$t_B=-a$: space replaces time.'
        feedback: |
          The term $u\,a$ is the *mixing* of space into time, and it switches off when $u=0$. Nothing of $a$ is left.
      - text: '$t_B=\gamma\,a$: only the distance matters.'
        feedback: |
          Distance enters only multiplied by the speed $u$. At $u=0$ it drops out entirely.
    explanation: |
      Limit check: **$u=0$ gives $\gamma=1$ and no mixing, so $t_B=\tau$**. For small $u$ the disagreement is small, which is why in daily life everyone agrees on "now".

  - type: mcq
    id: spacelike-test
    title: "When can observers disagree on the order?"
    prompt: |
      Take an event $E=(a,\tau)$ and the origin event $O=(0,0)$, in units where light covers 1 unit of space per unit of time. Observers move at speeds $|u|<1$. Which test says whether *every* observer puts $E$ after $O$ (or every observer before)?
    options:
      - text: 'If $|a|<|\tau|$ (timelike), all observers agree on the order; if $|a|>|\tau|$ (spacelike), some observers put $E$ before $O$ and others after.'
        correct: true
      - text: 'If $|a|>|\tau|$, all observers agree; if $|a|<|\tau|$, they can disagree.'
        feedback: |
          Reversed. When the distance exceeds what light could cover in the time between them, no signal could link the events, and speeds below 1 can flip the order. When light *could* link them, the order is fixed.
      - text: 'All observers always agree on the order of any two events.'
        feedback: |
          That is the pre-relativistic intuition of a single universal "now". For pairs too far apart for light to connect, the order depends on the observer.
      - text: 'Observers disagree for every pair of events, since each has their own clock.'
        feedback: |
          Pairs that light could connect (timelike) keep their order for all observers. Only the spacelike pairs are ambiguous.
    explanation: |
      Mnemonic: **spacelike $|a|>|\tau|$: order is observer-dependent; timelike $|a|<|\tau|$: order is absolute**. This is why a "universal present" for God's knowledge of events is hard to define.

  - type: order
    id: foreknowledge-order
    title: "The foreknowledge argument"
    prompt: |
      Put Pike's argument in order. Let $p$ be "I will mow the lawn tomorrow".
    steps:
      - 'P1. Yesterday God believed that $p$.'
      - 'P2. God cannot be wrong, so if God believed $p$, then $p$ is true.'
      - 'P3. Nothing I can do now changes what God believed yesterday: the past is fixed.'
      - 'C. So I cannot now do otherwise than $p$: I am not free to refrain.'
    hint: Start from the belief, then its infallibility, then the fixity of the past, then the conclusion.
    explanation: |
      Replies, in one line each: the **Boethian** one rejects P1 (God's knowing is not "yesterday", it is timeless); the **Ockhamist** one rejects P3 (some past facts are partly about the future); the **open theist** one rejects the idea that there is a settled future $p$ to be known (the future free choice is not yet a fact).

  - type: order
    id: verification-order
    title: "The verificationist argument"
    prompt: |
      With $e$ = "God exists", $M(s)$ = "$s$ is factually meaningful", $V(s)$ = "some possible experience could verify $s$" and $A(s)$ = "$s$ is analytic", put Ayer's argument in order.
    steps:
      - 'P1. $M(s)\Rightarrow V(s)\lor A(s)$: a sentence is meaningful only if it is verifiable or analytic.'
      - 'P2. $\neg V(e)\land\neg A(e)$: "God exists" is neither verifiable nor analytic.'
      - 'C. $\neg M(e)$: "God exists" is not factually meaningful.'
    hint: The general criterion first, then the case, then what follows.
    explanation: |
      The argument is valid, so the debate is about the premises. Critics attack P1 (it is itself neither verifiable nor analytic, and it condemns scientific laws no finite experience verifies); Hick attacks P2 (experience after death could verify); Hare and Mitchell say religious claims are not weak scientific hypotheses at all.

  - type: mcq
    id: g-and-w
    title: "God and the world"
    prompt: |
      Let $G$ be God and $W$ the world (everything in the universe). Which pairing of formula and view is correct?
    options:
      - text: '$G=W$ pantheism; $W\subsetneq G$ panentheism (the world is in God, and God is more); $G\neq W$ classical theism (God and world are distinct).'
        correct: true
      - text: '$G=W$ panentheism; $W\subsetneq G$ pantheism; $G\neq W$ classical theism.'
        feedback: |
          Swapped. If God *is* the world and nothing more, that is pantheism. "In" plus "more than" is the *pan-en-theism* ($W\subsetneq G$).
      - text: '$G=W$ classical theism; $W\subsetneq G$ pantheism; $G\neq W$ panentheism.'
        feedback: |
          Classical theism stresses the *distinction* between Creator and creation, so it takes $G\neq W$. Identifying them is the pantheist's claim.
      - text: '$G\neq W$ is atheism, so the three views are $G=W$, $W\subsetneq G$ and $W=\varnothing$.'
        feedback: |
          Classical theism also says $G\neq W$; it differs from atheism by saying $G$ exists. Both are different from the identity and containment views.
    explanation: |
      Mnemonic: **equal, inside-and-more, distinct**. Spinoza ("God or Nature") is the classic pantheist reading; panentheists (Krause's label, Peacocke, Clayton) say "in" can mean dependence, mind-body, or part-whole, and critics ask whether the position is vague.

  - type: mcq
    id: process-poles
    title: "The two poles"
    prompt: |
      According to Hartshorne's dipolar God (building on Whitehead), God has an abstract pole $C$ and a concrete pole $E(t)$. Which statement is correct?
    options:
      - text: '$C$ is God''s character, which stays the same (loving, faithful); $E(t)$ is God''s experience, which grows as the world changes.'
        correct: true
      - text: '$C$ is God''s experience, always changing; $E(t)$ is God''s character, fixed for ever.'
        feedback: |
          Swapped. The *abstract* pole is the constant side (character); the *concrete* pole, written with $t$, is what changes with time.
      - text: 'Both poles are fixed; $t$ only labels our knowledge of them.'
        feedback: |
          In process theology God really receives each new event into experience, so the concrete pole changes in itself, not just in our knowledge.
      - text: 'Both poles change, so God has no stable character.'
        feedback: |
          The point of a dipolar God is that something stays fixed (the abstract pole), so God can be reliable while still being affected by the world.
    explanation: |
      Mnemonic: **$C$ constant, $E(t)$ evolving**. Process theologians say God persuades rather than controls; open theists keep creation from nothing and say God chooses not to know the future free choices.

  - type: order
    id: dionysius-order
    title: "Three steps toward the unsayable"
    prompt: |
      According to Pseudo-Dionysius, how does speech about God proceed? Order the steps for a property word $F$ such as "wise".
    steps:
      - 'Affirm: say that God is $F$ ("God is wise"), because creatures reflect their source.'
      - 'Deny: say that God is not $F$ as we mean the word, since our word falls short.'
      - 'Go beyond: God is beyond both affirmation and denial, so silence or praise rather than description.'
    hint: Say it, take it back, then go past both.
    explanation: |
      Mnemonic: **affirm, deny, go beyond**. Maimonides takes a stricter road: only negations ("God is not ignorant") and attributes of action are safe. Critics ask whether pure negation says anything at all.

  - type: mcq
    id: aquinas-analogy
    title: "Univocal, equivocal, analogical"
    prompt: |
      Aquinas says "God is good" is neither univocal nor equivocal but *analogical*. Which description is correct, with the classic example "healthy"?
    options:
      - text: 'Univocal: the same meaning each time. Equivocal: unrelated meanings. Analogical: related meanings, as "healthy" said of an animal (which has health) and of its food (which causes it).'
        correct: true
      - text: 'Univocal: related meanings. Equivocal: the same meaning each time. Analogical: unrelated meanings.'
        feedback: |
          The names are scrambled. *Uni*-vocal means one voice (one meaning); *equi*-vocal means a word shared by unrelated meanings ("bank" of a river, "bank" for money).
      - text: 'Analogical means "metaphorical": God is only called good as a poetic image.'
        feedback: |
          Metaphor is a different category. In analogy the word applies *properly* to God, though in a way not identical to how it applies to creatures.
      - text: 'Analogical means that God is good in exactly the human sense, only more.'
        feedback: |
          That is the univocal claim in disguise. Analogy keeps a link but allows the *way* of being good to differ.
    explanation: |
      Mnemonic: **one meaning, two unrelated meanings, related meanings**. Two analogies are usually distinguished: by attribution (food is healthy by causing health) and by proportionality (as the animal's health is to its body, so God's goodness is to God).

  - type: numeric
    id: bob-apply
    title: "Bob's time for a distant event"
    prompt: |
      Use units where light covers 1 unit of space per unit of time. Alice is at rest; Bob moves at speed $u=0.6$ along the direction of space, and both set their clocks to $0$ at the event $O$ (at distance $0$). An event $E$ is at distance $a=4$ from $O$ and happens at time $\tau=1$ on Alice's clock. What time does Bob assign to $E$? (Negative means before $O$ for Bob.)
    answer: -1.75
    tolerance: 0.01
    answerText: '-1.75'
    wrong:
      - { value: 1, feedback: 'That is Alice''s time for $E$. For a faraway event, Bob''s time differs from Alice''s.' }
      - { value: -1.4, feedback: 'You combined the time and the distance correctly but left out the stretching factor $\gamma=1/\sqrt{1-u^2}=1.25$.' }
      - { value: -1.12, feedback: 'You divided by $\gamma$; the factor multiplies.' }
    hint: A boost mixes space and time. Find the stretching factor for $u=0.6$ first.
    explanation: |
      Bob's time is $\gamma(\tau-u\,a)$ with $\gamma=1.25$: $1.25\,(1-0.6\cdot4)=1.25\cdot(-1.4)=-1.75$. The term $0.6\cdot4=2.4$ is the shift caused by Bob's motion times the distance of the event. Here the event is *after* $O$ for Alice and *before* $O$ for Bob.

  - type: numeric
    id: bob-apply-2
    title: "A second pair"
    prompt: |
      Same units. Now Bob moves at $u=0.8$. The event $O$ is at distance $0$ and time $0$ for both. A second event $E$ is at distance $a=5$ and Alice's time $\tau=3$. What time does Bob assign to $E$?
    answer: -1.67
    tolerance: 0.02
    answerText: '-1.67 (that is $-5/3$)'
    wrong:
      - { value: 3, feedback: 'That is Alice''s time for $E$.' }
      - { value: -1, feedback: 'You forgot the factor $\gamma=1/\sqrt{1-0.64}=5/3$.' }
    hint: Again a boost mixes space and time; find the stretching factor for $u=0.8$ first.
    explanation: |
      $\gamma=5/3$ and $\tau-u\,a=3-4=-1$, so $t_B=\tfrac53(-1)\approx-1.67$. Alice says $E$ is after $O$ ($3>0$); Bob says it is before ($-1.67<0$).

  - type: mcq
    id: order-same
    title: "Do all observers agree?"
    prompt: |
      The pair $O=(0,0)$ and $E=(a,\tau)=(5,3)$, in units where light covers 1 unit of space per unit of time, was ordered one way by Alice and the other way by Bob at $u=0.8$. Is $E$ after $O$ for *all* observers?
    options:
      - text: 'No: $|a|=5>|\tau|=3$, so the pair is spacelike and different observers can order it differently, as Alice (at rest) and Bob ($u=0.8$) do here.'
        correct: true
      - text: 'Yes: Alice is at rest, so her order is the true one for everybody.'
        feedback: |
          No observer at rest or in motion has a privileged "true" now. The disagreement is built into the geometry for pairs like this one.
      - text: 'Yes: the order of events never depends on the observer.'
        feedback: |
          That fails for spacelike pairs: with $u=0.8$ the time $t_B=\gamma(\tau-u\,a)$ of $E=(5,3)$ is $-1.67$, negative, while Alice's is $+3$.
      - text: 'No, but only because Bob''s clock is faulty.'
        feedback: |
          Bob''s clock works perfectly. The difference comes from which events count as "at the same time" for someone in motion.
    explanation: |
      For a *timelike* pair such as $(1,3)$ ($|a|<|\tau|$) every observer agrees. The theological stake: a God whose knowledge is "of the present" must say whose present, unless God is timeless (Boethius) or knows all events at once.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Omnipotence:** with $s$ a state of affairs, $\Diamond s$ "$s$ is possible" and $\mathrm{Can}(g,s)$ "God can bring about $s$",
        $$\forall s\,(\Diamond s\Rightarrow \mathrm{Can}(g,s))$$
        (not "anything"; a third reading adds compatibility with God's nature $N$, $\Diamond(s\land N)$).
      - **Omniscience:** with $p$ a proposition and $K_S\,p$ "$S$ knows $p$",
        $$\forall p\,(p\Rightarrow K_S\,p)$$
        **Euthyphro:** good by command (arbitrary), good independently (a standard above God), or good by God's nature.
      - **God and time:** eternal (outside time, Boethius) versus everlasting (inside time without beginning or end, Wolterstorff, Swinburne). Pike's argument: P1 God believed $p$ yesterday, P2 God cannot be wrong, P3 the past is fixed, so C: I cannot do otherwise.
      - **Time and relativity:** in units where light covers 1 unit of space per unit of time, with Alice at rest and Bob at speed $u$, an event $E=(a,\tau)$ gets Bob's time
        $$t_B=\gamma\,(\tau-u\,a),\qquad \gamma=\frac{1}{\sqrt{1-u^2}}$$
        which is $\tau$ when $u=0$. If $|a|>|\tau|$ (spacelike) the order relative to the origin event depends on the observer; if $|a|<|\tau|$ (timelike) it does not.
      - **God and world:** with $G$ God and $W$ the world, $G=W$ pantheism, $W\subsetneq G$ panentheism, $G\neq W$ classical theism. Process theology: abstract pole $C$ (character, fixed) and concrete pole $E(t)$ (experience, changing).
      - **Speaking of God:** Dionysius: affirm, deny, go beyond. Maimonides: negations and attributes of action. Aquinas: analogy, between univocal and equivocal. **Verificationism** (Ayer): with $M$ meaningful, $V$ verifiable, $A$ analytic, $e$ "God exists",
        $$M(s)\Rightarrow V(s)\lor A(s)$$
        $$\neg V(e)\land\neg A(e)\ \therefore\ \neg M(e)$$
        The argument is valid; critics attack P1 (it fails its own test) and P2 (Hick's verification after death).

      People part ways on what omnipotence includes, on whether God is inside time, on whether "in" in panentheism has a precise meaning, and on whether religious language is literal, negative, analogical or non-cognitive.

      **Next:** the content map, where you rebuild this level's concept map box by box.
