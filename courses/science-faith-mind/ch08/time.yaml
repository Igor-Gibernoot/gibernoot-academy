id: ch08-time
title: "God and Time"
kind: concept
own: |
  The setting: **classical theists** (those who hold the traditional Jewish, Christian and Islamic picture of one perfect God) ask how God relates to time. For a subject $S$ and a proposition $p$, write $K_S\,p$ for "$S$ knows $p$". Omniscience, knowing every truth, is
  {{ $$\forall p\,\big(p\Rightarrow K_S\,p\big)$$ }}
  and the foreknowledge argument (Pike, 1965) says that if $p$ is a truth about my free act tomorrow and God already believed $p$ yesterday, the fixed past leaves me no other act.
  - **Two pictures of God and time.** According to Boethius (c. 480-524) and Aquinas, God is **eternal**: outside time, with no "before" or "after", living the whole of life "all at once". According to Wolterstorff and Swinburne, God is **everlasting**: inside time, with no beginning and no end. "Eternal" in the first sense does not mean "very long".
  - **What each picture does to foreknowledge.** The eternal reply says God has no "yesterday" beliefs, so the premise "God believed it yesterday" fails as stated. The everlasting picture keeps the argument alive and invites other replies, such as the open theists' claim that future free acts are not yet truths to know.
  - **Relativity of simultaneity (established physics, Einstein 1905).** Work in units where light travels 1 unit of space per unit of time. Alice is at rest; Bob moves past her at speed $u$ ($0\le u<1$) and they meet at the event $O$. Take an event $E$ at distance $a$ from $O$ along Bob's direction of motion, at time $\tau$ on Alice's clock. Bob's time for $E$ is
  {{ $$t_B=\gamma\,(\tau-u\,a),\qquad \gamma=\frac{1}{\sqrt{1-u^2}}$$ }}
  For $u=0.6$, $\gamma=1.25$, and $E=(a,\tau)=(3,0)$ gives $t_B=-2.25$: simultaneous with $O$ for Alice, in Bob's past.
  - **Who can disagree about order.** Events at the same place or joined by a signal no faster than light (**timelike**, $|a|<|\tau|$) have the same order for all observers. Events that no such signal joins are **spacelike**:
  {{ $$|a|>|\tau|$$ }}
  and observers can disagree about which came first. Physics gives no unique universal "now".
  - **Interpretations (live debate).** *Eternalism* (the block universe): past, present and future are equally real. *Presentism*: only the present exists. *Growing block*: past and present are real, the future is not yet. The Stanford Encyclopedia notes that eternalism is not a straightforward consequence of relativity, and that the argument from relativity to fatalism (Rietdijk and Putnam) is contested.
  - **The arrow of time.** The fundamental laws are, to the best of current knowledge, (nearly) the same under reversing time; the one-way direction comes from entropy growing away from a very low-entropy early universe (the Past Hypothesis).
  - **Where people part ways.** On whether a personal, acting God must be in time; on whether timeless knowing is still knowing "what time it is now"; on whether relativity favours eternalism; and on whether either physics picture tells us anything about God.
cards:
  - type: mcq
    id: hook
    title: "Guess: surprise and action"
    prompt: |
      Guess before any theory. Suppose there is a God who already knows everything that will happen tomorrow. What is your gut feeling about such a God?
    options:
      - text: 'Such a God can never be surprised, and it is hard to see what "reacting to today" would mean.'
        correct: true
        feedback: |
          A common first reaction, and the heart of one side of the debate. If tomorrow is already known, nothing can come as news. The lesson asks whether this is a cost of the idea, or whether God's relation to time is different from ours.
      - text: 'Knowing tomorrow changes nothing: such a God can still be surprised and can act today, as we do.'
        feedback: |
          Some thinkers hold a version of this (open theists change what is knowable instead), but if the whole future is already known, "surprise" needs an account. Hold it as one answer among several.
      - text: 'The question makes no sense: God does not know in the way we do.'
        feedback: |
          That is a real reply (God is "outside time"), and the lesson explains it. It still has to say what God's knowing is, and what happens to surprise and action.
    explanation: |
      Keep your guess. We will meet two pictures of God and time, and see what physics can and cannot add.

  - type: text
    id: recall
    title: "Recall: the foreknowledge argument"
    body: |
      Recall, from the lesson The Omni-Attributes: for a subject $S$ and a proposition $p$ (a statement that is true or false), $K_S\,p$ means "$S$ knows $p$". **Omniscience** is knowing every truth:

      $$\forall p\,\big(p\Rightarrow K_S\,p\big)$$

      The **foreknowledge argument** (Pike, 1965), with $p$ = "I will pick the blue door tomorrow":

      - **P1.** Yesterday God believed that $p$.
      - **P2.** God cannot be wrong, so if God believed $p$, then $p$.
      - **P3.** Nothing I can do now changes what God believed yesterday (the past is fixed).
      - **C.** So I cannot do otherwise than pick blue: my choice is not free.

      Notice the word **yesterday** in P1. It treats God's knowing as something that happened at a time. The first question of this lesson is whether it should.

  - type: text
    id: eternal-everlasting
    title: "Eternal or everlasting?"
    image:
      src: img/boethius.webp
      alt: "An illuminated initial letter from a medieval manuscript showing Boethius seated and teaching a group of students"
      caption: "Boethius (c. 480-524) wrote The Consolation of Philosophy in prison, awaiting execution; an initial in a medieval manuscript of it shows him teaching his students."
      credit: "http://special.lib.gla.ac.uk/exhibns/treasures/boethius.html, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Boethius_initial_consolation_philosophy.jpg"
    body: |
      Two words that sound alike name two different pictures of God's relation to time. According to the Stanford Encyclopedia:

      - **Eternal (timeless).** God is not located in time and God's life has no succession: no earlier and later stages.
      - **Everlasting (sempiternal).** God is in time and exists at every time: there is no time at which God does not exist.

      The classic statement of the first is by Boethius (c. 480-524), Roman philosopher and statesman, in Book V of *The Consolation of Philosophy*. His Latin definition is *aeternitas est interminabilis vitae tota simul et perfecta possessio*: in essence, eternity is the whole, perfect possession of unending life **all at once** (*tota simul*). Not "a very long time", but a life with no stretches in it.

      This is a **live debate**, and a **faith-and-metaphysics commitment** on either side: scripture, tradition and philosophy are used for both. The point to hold is that "eternal" here is not a measure of duration.

  - type: mcq
    id: sort
    title: "Which picture?"
    prompt: |
      Three statements about God and time. Eternal means outside time, with no earlier or later stages in God's life; everlasting means inside time, with no beginning or end. Which statement belongs to the **eternal** picture?
    options:
      - text: 'God has no past or future: there is no "God a year ago" different from "God now".'
        correct: true
        feedback: |
          Yes. A life with no succession has no earlier and later stages to distinguish.
      - text: 'God has existed for every moment of time, and God''s life has stages like ours, only without beginning or end.'
        feedback: |
          That is the everlasting picture: God is inside time at every moment.
      - text: 'God has existed for an enormously long time, far older than the universe.'
        feedback: |
          Old but not unending is neither picture. Both pictures hold that God has no beginning; they differ on whether God is inside time.
    explanation: |
      The two pictures are not about how long, but about whether God's life has succession.

  - type: text
    id: boethius
    title: "Boethius's reply"
    body: |
      On the eternal picture, according to the Stanford Encyclopedia, "all temporal events are before the mind of God at once": God has no past, present or future of its own and so has no beliefs "yesterday".

      An illustration, in essence from Boethius: someone on a hilltop sees at a glance everything below, say a road with travellers on it. Each traveller is walking at *their* time; the watcher sees the whole road at once. Seeing a traveller walk does not make the traveller walk. Aquinas (c. 1225-1274), who adopted the reply, used another image: the centre of a circle is present to every point of its circumference (*Summa contra Gentiles* I, 66).

      Apply it to P1. If God's knowing is not at a time, then "God believed yesterday" is false as stated, and P3 (the past is fixed) has nothing to hold on to. What remains for a critic is that God's timeless knowing is still infallible, so it still matches what I do. Whether *that* threatens freedom is part of the debate.

  - type: mcq
    id: boethius-step
    title: "Which premise?"
    prompt: |
      Pike's argument: P1 (yesterday God believed $p$), P2 (God cannot be wrong), P3 (the past is fixed). According to the Boethian reply that God is eternal, which premise is rejected and why?
    options:
      - text: 'P1: God''s knowing is not located in time, so there is no "yesterday" belief for the fixity of the past to protect.'
        correct: true
        feedback: |
          Yes. The reply does not attack infallibility or the idea that the past is fixed; it denies that God's knowledge is a past event.
      - text: 'P2: an eternal God can be wrong.'
        feedback: |
          No: the eternal God is still infallible. The reply targets the temporal "yesterday", not infallibility.
      - text: 'P3: the past is not fixed after all.'
        feedback: |
          That is a different reply (an Ockhamist one: some past facts are partly about the future). The Boethian reply accepts P3 for things that are really in the past.
    explanation: |
      Each reply to the foreknowledge argument rejects one step. Boethius's rejects the premise that God's knowing belongs to the past.

  - type: mcq
    id: objection-now
    title: "Objection: what time is it?"
    prompt: |
      Kretzmann (1966) pressed an objection in essence like this. An all-knowing being always knows what time it is now. But "what time it is now" keeps changing, so what such a being knows keeps changing. A being whose knowledge changes is not outside time. Which reply would a defender of the eternal picture give?
    options:
      - text: 'God knows, timelessly, every time and what happens at it; "always" in the objection is a temporal word that does not apply to God.'
        correct: true
        feedback: |
          Yes, in essence. Critics answer that a timeless God then misses the truth that *now* is such-and-such, a fact only a being in time can state ("now" has to be said from some moment).
      - text: 'God does not know what time it is, and omniscience does not require it.'
        feedback: |
          That denies omniscience as defined by $\forall p\,(p\Rightarrow K_S\,p)$ for tensed truths, which is the point at issue. Few defenders accept this.
      - text: 'The objection is correct, so the eternal picture is refuted.'
        feedback: |
          It is a serious objection, not a refutation: whether timeless knowing includes "now" truths is exactly what the two sides dispute.
    explanation: |
      The objection shows a price of the eternal picture: God must know all truths without the "now" a temporal being has.

  - type: mcq
    id: objection-act
    title: "Objection: acting in history"
    prompt: |
      Many believers hold that God answers prayer, speaks to prophets, and acts in history. A critic says: "A being with no earlier and later cannot do something *after* something else, so an eternal God cannot act in history." According to the Stanford Encyclopedia, which kind of reply do defenders of the eternal picture give?
    options:
      - text: 'God''s one timeless act has effects at many times, and (in a tradition going back to Aquinas) God is not changed by relating to the world; God''s own life stays without succession.'
        correct: true
        feedback: |
          Yes, in essence. The reply separates God's act, timeless, from its effects, which happen at times. Critics say a "responding" God, personal in the way scripture often portrays, seems then to be lost.
      - text: 'God acts only before time began, and never afterwards.'
        feedback: |
          That is closer to deism, not to the Boethian picture, where God is related to every time at once.
      - text: 'The claim that God acts in history is dropped by all classical theists.'
        feedback: |
          No: classical theists hold that God acts in history; the dispute is about how to understand it.
    explanation: |
      The same pattern as before: the eternal picture can answer, at a stated price (a God who does not change, remember or wait, which some find fits worship less well).

  - type: text
    id: everlasting
    title: "The everlasting alternative"
    body: |
      The other picture is held, according to the Stanford Encyclopedia, by Nicholas Wolterstorff and Richard Swinburne, among others (also J. R. Lucas). **Everlasting** thinkers argue, in essence, that a God who knows, remembers, answers and acts in a real history must be in time, and that knowing "what is happening now" is part of knowing everything. Swinburne holds that before creation God lives in a time with no measure of length, and that time gets its metric (its clock) once God creates.

      A link to **open theism**, from the lesson The Omni-Attributes: open theists reject divine timelessness along with infallible foreknowledge of free acts, and hold that God "takes risks, and can be surprised and even disappointed" (the Stanford Encyclopedia's summary). That is the other side of the hook: **a God inside time can be surprised if the future is genuinely open, and can act today in response to today**.

      Both pictures answer the hook, at different prices. Eternal: no surprise, because there is no "later" to be surprised at, and acting means timeless acting. Everlasting: a real history for God, and then foreknowledge has to be revised (open theism) or defended in another way.

  - type: mcq
    id: replies
    title: "Match the picture to the price"
    prompt: |
      Someone says: "My God knows my freely chosen act tomorrow *in advance*, and also God learns and responds as the day unfolds." Which problem does this combination face?
    options:
      - text: 'It needs God to be in time (to respond as the day unfolds) while also knowing the future in advance, which brings back the foreknowledge argument that the eternal picture avoids.'
        correct: true
        feedback: |
          Yes. Responding needs a real "later", and complete advance knowledge of free acts is what Pike's argument targets. The two options each give something up: timeless knowing (eternal), or complete foreknowledge (open theism).
      - text: 'It needs God to be outside time, which cannot allow knowing anything in advance.'
        feedback: |
          Reversed: an eternal God is not "in advance" of anything. It is the in-time half that causes the trouble.
      - text: 'It faces no problem, since both claims are about God.'
        feedback: |
          Each claim is fine alone, but together they conflict with the argument: advance knowledge of a free act and genuine response.
    explanation: |
      The hook resolved: a God who knows tomorrow can be surprised only if "knows tomorrow" is trimmed (open theism), and can act "today" only in a looser sense if God is outside time. Thoughtful people part ways on which cost is worse.

  - type: text
    id: physics
    title: "What physics can say"
    body: |
      Physics cannot decide whether God is eternal. It does, however, have things to say about *time*, and they are often used in this debate. Three layers, kept apart:

      - **Established fact.** Einstein (1905) showed that two observers in uniform relative motion disagree about which distant events are simultaneous. This is the **relativity of simultaneity**, and it follows from the constancy of the speed of light; special relativity, of which it is a part, has passed many tests (muon lifetimes, atomic clocks flown on aircraft). The entropy of a closed system does not decrease, and the fundamental laws are (nearly) the same when time is reversed.
      - **Live debate (interpretation).** What this means for the reality of past and future: *presentism*, *eternalism* (the block universe) or *growing block*. Physics does not settle it.
      - **Faith or metaphysical commitment.** Whether any of this shows anything about God.

      First, the established fact. In the picture below, **space runs across and time runs up**, in units where light covers one unit of space per unit of time. Alice (blue) is at rest. Bob (orange) moves at 0.6 of the speed of light; they meet at the event $O$ (the origin). A line of "now" joins the events a person counts as simultaneous with $O$.

  - type: widget
    id: widget-now
    title: "Two lines of now"
    widget: now-lines
    config:
      preset: moving
      E: [3, 1]
      worldlines: true
      nowLines: true
      lightCones: false
      readout: false
      verdict: false
      block: false
      slider: false
      dragE: true
    body: |
      Alice's line of "now" through $O$ is horizontal; Bob's is tilted. The dashed lines are the "now" of each at the gold event $E$. Drag $E$ around. Notice that $E$ can lie between Alice's now-line and Bob's, and that Bob's tilted line crosses Alice's horizontal one only at $O$.

  - type: numeric
    id: tb-number
    title: "Bob's time for E"
    prompt: |
      Use units where light covers 1 unit of space per unit of time. Alice is at rest and Bob moves at speed $u=0.6$ along the direction of space. An event $E$ is at distance $a=3$ from $O$ and happens at time $\tau=0$ on Alice's clock (so for Alice it is simultaneous with $O$). Bob's time for $E$ is $t_B=\gamma\,(\tau-u\,a)$ with $\gamma=1/\sqrt{1-u^2}$. What is $t_B$? (Negative means in Bob's past.)
    answer: -2.25
    tolerance: 0.01
    answerText: '-2.25'
    wrong:
      - { value: -1.8, feedback: 'You computed $\tau-ua=-1.8$ but forgot the factor $\gamma=1.25$.' }
      - { value: 0, feedback: 'That is Alice''s time for $E$, $\tau$. Bob''s differs because $E$ is far away in space: the term $u\,a$ is not zero.' }
      - { value: -1.44, feedback: 'You divided by $\gamma$ ($-1.8/1.25$); $\gamma$ multiplies.' }
    hint: 'First $\gamma=1/\sqrt{1-0.36}=1/0.8$.'
    explanation: |
      $\gamma=1/\sqrt{1-0.36}=1/0.8=1.25$ and $t_B=1.25\,(0-0.6\cdot3)=1.25\cdot(-1.8)=-2.25$. Alice says $E$ is happening now; Bob says it already happened. Neither is wrong: "now" at a distance depends on who is asking.

  - type: widget
    id: widget-cones
    title: "Who can disagree?"
    widget: now-lines
    config:
      preset: moving
      E: [3, 1]
      worldlines: true
      nowLines: true
      lightCones: true
      readout: true
      verdict: true
      block: false
      slider: true
      dragE: true
      presets: [rest, moving, { label: Fast, u: 0.9, E: [2, 1] }]
    body: |
      The shaded wedges mark the events that no signal from $O$ can reach (and that cannot send one to $O$). Drag $E$ into and out of the wedges, change Bob's speed, and read the verdict.

  - type: mcq
    id: cones-q
    title: "Order of events"
    prompt: |
      Units where light covers 1 unit of space per unit of time. An event $F$ is 1 unit of space from the event $O$ and happens 3 units of time after $O$ on Alice's clock, so a signal slower than light could go from $O$ to $F$. Can an observer moving at some speed less than light judge that $F$ happened *before* $O$?
    options:
      - text: 'No: $F$ is timelike from $O$ ($|a|=1<|\tau|=3$), so every observer puts $O$ before $F$.'
        correct: true
        feedback: |
          Yes. If a slower-than-light signal can join two events, one can cause the other, and all observers must agree on the order (otherwise an effect could precede its cause).
      - text: 'Yes: with a high enough speed any order can be made to flip.'
        feedback: |
          Only for pairs no signal can join (spacelike, $|a|>|\tau|$). Here a signal can join them, and the order stays.
      - text: 'Yes: the order is always a matter of who is watching.'
        feedback: |
          Relativity says the order of events that could be causally linked is agreed by all observers. Only spacelike pairs are frame-dependent.
    explanation: |
      Relativity of simultaneity does not make time arbitrary: it protects cause and effect and relaxes only the order of events too far apart for any signal.

  - type: widget
    id: widget-block
    title: "The block universe"
    widget: now-lines
    config:
      preset: moving
      worldlines: true
      nowLines: true
      lightCones: false
      readout: false
      verdict: false
      block: true
      slider: true
      dragE: false
    body: |
      The dots stand for every event of spacetime. In the **block universe** (also called *eternalism*) all of them are equally real, past, present and future, and a "now" line is just a way of slicing the block. Move Bob's speed and watch his now-line cut the block at a different tilt. In the **presentism** picture, by contrast, only one slice exists, and the question is: which one?

  - type: mcq
    id: block-status
    title: "Does relativity prove the block?"
    prompt: |
      An argument (associated with Rietdijk and Putnam) says: since observers in relative motion disagree about what is "now" far away, there cannot be a unique "present" that alone exists, so the future is as real as the past, and so is fixed (the block universe, and "fatalism"). How does the Stanford Encyclopedia present its status?
    options:
      - text: 'It is a contested argument: eternalism is not a straightforward consequence of relativity, and there are replies, such as accepting becoming that is tied to each worldline or each light cone.'
        correct: true
        feedback: |
          Yes. Physics provides the relativity of simultaneity (fact). Whether it forces eternalism, or whether eternalism implies fatalism, is interpretation, and thoughtful physicists and philosophers differ.
      - text: 'It is a proven theorem of relativity.'
        feedback: |
          No: the relativity of simultaneity is proven; the step to "the future is as real as the past" uses an extra premise about what exists.
      - text: 'It is refuted: relativity says nothing about time at all.'
        feedback: |
          Too strong: relativity does say there is no physically distinguished global "now". The debate is about what to infer from that.
    explanation: |
      Keep the layers apart: no preferred global present (physics), eternalism (one interpretation), fatalism (a further, contested claim).

  - type: text
    id: arrow
    title: "The arrow of time"
    body: |
      A second feature of time that physics describes: it has a **direction**. Eggs break and do not unbreak; heat flows from hot to cold. Recall, from the lesson Why Was the Early Universe So Ordered?, that the second law says the entropy of a closed system does not decrease, while the fundamental laws are (nearly) the same when time is reversed. The one-way direction therefore needs an extra assumption about the beginning, the **Past Hypothesis** (named by David Albert, 2000): the universe began in a state of very low entropy. Its status is debated; some treat it as a basic law, others look for an explanation.

      So physics supplies **a direction** of time (fact, with a debated explanation) but, as we saw, **no unique global "now"**. An everlasting thinker may cite the direction: real succession seems built into nature. A defender of the eternal picture may reply that a direction of change in the world does not show that God's own life has stages.

  - type: mcq
    id: arrow-q
    title: "What does the arrow add?"
    prompt: |
      Which statement is accurate about the arrow of time and the debate on God and time?
    options:
      - text: 'The arrow (entropy growth from a low-entropy start) describes a direction of change in the universe; it does not by itself say whether God''s life has succession.'
        correct: true
        feedback: |
          Yes. It supports the thought that nature really changes, which both sides accept; they differ on whether that makes God temporal.
      - text: 'The arrow proves that God is everlasting.'
        feedback: |
          It is a fact about physical systems. To get to God one needs an extra premise (for example, that a God who acts on a changing world must change).
      - text: 'Physics says the laws forbid any run in reverse, so the past cannot be known.'
        feedback: |
          The laws are (nearly) time-reversible; the direction comes from the low-entropy start and statistics, not from a ban. And the past is accessible by records.
    explanation: |
      The arrow is a real feature of our universe, but it is the physics of matter, not a premise about God.

  - type: mcq
    id: trap-long
    title: "Trap: eternal means very long"
    prompt: |
      A student writes: "Eternal means God has lived for an extremely long time, longer than the universe." In the terms of this lesson, which is the best assessment?
    options:
      - text: 'It confuses the two pictures: in the eternal picture God is outside time and so has no duration at all; "unending duration" is the everlasting picture.'
        correct: true
        feedback: |
          Right. Eternal (Boethius) is "all at once", not "for a long time". Everlasting is "at every time".
      - text: 'It is correct: eternal just means having no end.'
        feedback: |
          "No end" fits everlasting; Boethius's *tota simul* excludes any stretch at all.
      - text: 'It is correct for the eternal picture and wrong for the everlasting one.'
        feedback: |
          Reversed: unending duration is the everlasting picture.
    explanation: |
      The same English word "eternal" is used both ways in everyday speech; the lesson uses it in Boethius's technical sense.

  - type: mcq
    id: trap-block
    title: "Trap: block universe means fatalism"
    prompt: |
      A student writes: "In the block universe the future already exists, so the future is fixed and nothing I do matters. Relativity therefore proves fatalism." Which is the best assessment?
    options:
      - text: 'It has two weak steps: relativity does not straightforwardly give eternalism, and whether eternalism, if true, implies fatalism is itself disputed (the Stanford Encyclopedia calls the refutation of that inference controversial, not settled).'
        correct: true
        feedback: |
          Yes. Both steps are live debates. The first: relativity gives no preferred "now", but eternalism needs an extra premise about what exists. The second: whether "the future exists" means "the future is fixed" is disputed.
      - text: 'It is correct: the block universe and fatalism are the same thing.'
        feedback: |
          They are different claims. The block universe is about what exists; fatalism is about whether any act could have been otherwise.
      - text: 'It is correct for the block universe but relativity refutes it.'
        feedback: |
          Relativity does not refute it either; it leaves the question open.
    explanation: |
      Three claims to keep apart: no preferred "now" (physics), eternalism (an interpretation), fatalism (a further claim, contested).

  - type: mcq
    id: trap-god
    title: "Trap: relativity proves God is eternal"
    prompt: |
      A student writes: "Relativity shows there is no universal 'now' and the block universe is true, so God must be outside time. Physics proves the eternal picture." Which is the best assessment?
    options:
      - text: 'It stacks leaps: eternalism is an interpretation, and even then a spacetime block only suggests a God who sees it whole; it does not show that God is outside time, and the Stanford Encyclopedia argues that appeals to special relativity do not really support the eternal picture.'
        correct: true
        feedback: |
          Yes. Some eternal-picture thinkers used relativity as an analogy; the Stanford Encyclopedia's assessment is that it gives no real support. The reverse inference (relativity refutes God) fails in the same way.
      - text: 'It is correct: physics shows time is an illusion, so only an eternal God remains.'
        feedback: |
          Physics shows no such thing. Relativity changes how to describe time but does not remove it.
      - text: 'It is wrong because relativity says nothing about time.'
        feedback: |
          Relativity is a theory of space and time. The error is the inference from it to God, not the use of physics.
    explanation: |
      Physics informs the question (it limits what "now" can mean), but each picture of God and time is a metaphysical and theological commitment.

  - type: text
    id: summary
    body: |
      **Where thoughtful people part ways:** whether a personal, acting God must be inside time; whether timeless knowing is complete knowing; which interpretation of spacetime to hold; and whether physics bears on God at all.

      **Next:** The lesson One God in Three Traditions asks how Judaism, Christianity and Islam each describe the one God, in the words of the Shema, the Trinity and *tawhid*, stated fairly.
