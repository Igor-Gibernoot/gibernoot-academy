outroTitle: Level 8 in one picture
outro: |
  **Omnipotence** ($\forall s(\Diamond s\Rightarrow\mathrm{Can}(g,s))$) and **omniscience** ($\forall p(p\Rightarrow K_S\,p)$) raise the **Euthyphro** question (answered by the divine nature) and the **foreknowledge argument**, met by **Boethian**, **Ockhamist** and **open-theist** replies. The **eternal** versus **everlasting** choice and the relativity of simultaneity ($t_B=\gamma(\tau-ua)$, spacelike versus timelike) shape what "now" can mean. **Process** and **open** theism revise the classical God, the three views $G=W$, $W\subsetneq G$, $G\neq W$ relate God and world, and the **Trinity** raises "one God" and "the same God" (reference, description, worship). **Dionysius, Maimonides, Eckhart** and **Aquinas** ask how words can reach God; **Ayer's** verificationism says they cannot, and **Hick, Flew, Hare and Mitchell** reply. People part ways on which attribute to revise, on whether God is in time, and on whether religious language keeps its content.
