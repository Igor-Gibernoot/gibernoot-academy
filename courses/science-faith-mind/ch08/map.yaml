id: ch08-map
title: "Content Map: The Nature of God"
kind: map
name: Level 8, The Nature of God (omnipotence, omniscience and the Euthyphro question, God and time, foreknowledge, relativity of simultaneity, the Trinity and "the same God", process and open theism, God and the world, speaking of God, verificationism)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 8 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (an attribute read as "anything at all", eternal confused with very long, a model of God and the world with the wrong symbol, a premise of an argument swapped), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: euthyphro
    title: The Euthyphro question
    row: 1
    col: 1
    body: |
      Is the good good **because God commands it**, or does God command it **because it is good**? The first horn makes goodness **arbitrary**; the second makes it an **independent standard** above God. The **divine nature** reply: God's own character is the standard, neither a command nor an outside law.
    explanation: |
      The question about goodness, the third of the attributes, and the first place where "what God is" limits "what God can do".
    decoys:
      - body: |
          Is the good good **because God commands it**, or does God command it **because it is good**? The first horn makes goodness an **independent standard** above God; the second makes it **arbitrary**. The **divine nature** reply: God's own character is the standard.
        feedback: |
          The horns are swapped. If goodness is good because God commands it, a different command would have made cruelty good, which looks arbitrary. If God commands it because it is good, there is a standard that God follows rather than sets.
      - body: |
          Is the good good **because God commands it**, or does God command it **because it is good**? The first horn makes goodness **arbitrary**; the second makes it an **independent standard** above God. The **divine nature** reply: God **commands** whatever God likes, and that is the standard.
        feedback: |
          That is the first horn again, not a third way. The divine nature reply says goodness is anchored in what God is (a stable character), so it is not an arbitrary command and not a rule outside God.

  - id: omni
    title: Omnipotence and omniscience
    row: 1
    col: 2
    body: |
      $s$ is a state of affairs, $\Diamond s$ means "$s$ is possible", $\mathrm{Can}(g,s)$ means "God can bring about $s$". Omnipotence in the possible-worlds reading:
      $$\forall s\,\big(\Diamond s\Rightarrow\mathrm{Can}(g,s)\big)$$
      Omniscience, with $K_S\,p$ for "$S$ knows $p$":
      $$\forall p\,\big(p\Rightarrow K_S\,p\big)$$
    decoys:
      - body: |
          $s$ is a state of affairs, $\Diamond s$ means "$s$ is possible", $\mathrm{Can}(g,s)$ means "God can bring about $s$". Omnipotence in the possible-worlds reading:
          $$\forall s\,\mathrm{Can}(g,s)$$
          Omniscience, with $K_S\,p$ for "$S$ knows $p$":
          $$\forall p\,\big(p\Rightarrow K_S\,p\big)$$
        feedback: |
          Dropping $\Diamond s$ gives "God can do anything at all", including contradictions, which is the Cartesian reading. The possible-worlds reading limits the scope to what is possible, so a contradictory task (a round square) is no limit on power.
      - body: |
          $s$ is a state of affairs, $\Diamond s$ means "$s$ is possible", $\mathrm{Can}(g,s)$ means "God can bring about $s$". Omnipotence in the possible-worlds reading:
          $$\forall s\,\big(\Diamond s\Rightarrow\mathrm{Can}(g,s)\big)$$
          Omniscience, with $K_S\,p$ for "$S$ knows $p$":
          $$\forall p\,\big(K_S\,p\Rightarrow p\big)$$
        feedback: |
          That is the converse. $K_S\,p\Rightarrow p$ holds for any knower (you cannot know what is false) and does not say that $S$ knows everything. Completeness is "every truth is known".
    explanation: |
      The attributes are the starting point of the level: each is a precise claim, and each raises a problem met in the boxes below.

  - id: trinity
    title: The Trinity and "the same God"
    row: 1
    col: 3
    body: |
      With $F$ = Father, $S$ = Son, $G$ = God, reading "is" as bare identity gives $F=G$ and $S=G$, hence $F=S$, contradicting $F\neq S$. The creed (one essence, three persons) rules out **modalism** (one person, three roles), **tritheism** (three gods) and **Arianism** (the Son a creature). "The same God?" (Volf) splits into **reference**, **description** and **worship**: the same reference does not require the same description.
    decoys:
      - body: |
          With $F$ = Father, $S$ = Son, $G$ = God, reading "is" as bare identity gives $F=G$ and $S=G$, hence $F=S$, contradicting $F\neq S$. The creed rules out **modalism** (three separate gods), **tritheism** (one person, three roles) and **Arianism** (the Son a creature). "The same God?" (Volf) splits into **reference**, **description** and **worship**.
        feedback: |
          Modalism and tritheism are swapped. Modalism collapses the three into one person playing roles; tritheism splits them into three gods.
      - body: |
          With $F$ = Father, $S$ = Son, $G$ = God, reading "is" as bare identity gives $F=G$ and $S=G$, hence $F=S$, contradicting $F\neq S$. The creed rules out **modalism**, **tritheism** and **Arianism** (the Son a creature). "The same God?" (Volf) splits into **reference**, **description** and **worship**: the same reference **requires** the same description.
        feedback: |
          Volf argues the opposite: two communities can refer to the same God while describing God differently, just as two people can describe one friend very differently. Critics reply that the differences may be too deep, but that is a separate claim.
    explanation: |
      The classical attributes meet monotheism: what "one" means, and whether it picks out one object across traditions.

  - id: open
    title: Process and open theism
    row: 2
    col: 1
    body: |
      **Process** (Whitehead, Hartshorne): God is **dipolar**, with $C$ = character (never changes) and $E(t)$ = experience (changes with the world); God acts by **persuasion**, not coercion. **Open theism**: with $F$ a future free choice, $F$ is **not yet a fact**, so there is nothing yet to know. Process puts the limits in reality; open theism says God chose them.
    decoys:
      - body: |
          **Process** (Whitehead, Hartshorne): God is **dipolar**, with $C$ = character (changes with the world) and $E(t)$ = experience (never changes); God acts by **persuasion**, not coercion. **Open theism**: with $F$ a future free choice, $F$ is **not yet a fact**. Process puts the limits in reality; open theism says God chose them.
        feedback: |
          The poles are swapped. The abstract pole $C$ is the enduring character (love, wisdom) and is fixed; the concrete pole $E(t)$ is God's experience of each moment and changes.
      - body: |
          **Process** (Whitehead, Hartshorne): God is **dipolar**, with $C$ = character (never changes) and $E(t)$ = experience (changes with the world); God acts by **coercion**, not persuasion. **Open theism**: with $F$ a future free choice, $F$ is **not yet a fact**. Process puts the limits in reality; open theism says God chose them.
        feedback: |
          Process thinkers say the opposite: God offers possibilities and cannot override a creature's self-determination. Coercion is the classical picture of power that they reject.
    explanation: |
      Both revise the classical God by letting the world affect what God knows or does, and both reply to the foreknowledge puzzle by changing God or the future.

  - id: fore
    title: The foreknowledge argument
    row: 2
    col: 2
    body: |
      Pike's argument: God believed yesterday that I will do $X$ (P1); God cannot be wrong (P2); the past is fixed (P3). So I cannot do otherwise. Replies: **Boethian** (God has no "yesterday", being eternal); **Ockhamist** (the belief is partly about the future, so not a fixed past fact); **open theist** (a free future act is not yet a truth to know).
    decoys:
      - body: |
          Pike's argument: God believed yesterday that I will do $X$ (P1); God cannot be wrong (P2); the past is fixed (P3). So I cannot do otherwise. Replies: **Boethian** (the belief is partly about the future, so not a fixed past fact); **Ockhamist** (God has no "yesterday", being eternal); **open theist** (a free future act is not yet a truth to know).
        feedback: |
          The names are swapped. The Boethian reply appeals to God's eternity (no "yesterday" belief). The Ockhamist reply keeps God in time but denies that every past-tense belief is purely past.
      - body: |
          Pike's argument: God believed yesterday that I will do $X$ (P1); God can be wrong (P2); the past is fixed (P3). So I cannot do otherwise. Replies: **Boethian** (God has no "yesterday", being eternal); **Ockhamist** (the belief is partly about the future); **open theist** (a free future act is not yet a truth to know).
        feedback: |
          The argument needs God to be infallible. If God could be wrong, the belief would not fix the act. Denying P2 is a way out, but a costly one for omniscience, and not what the argument assumes.
    explanation: |
      Omniscience meets freedom. Each reply changes one premise (the past, the belief, or the future), which is where the next boxes come from.

  - id: time
    title: Eternal or everlasting
    row: 2
    col: 3
    body: |
      According to Boethius and Aquinas, God is **eternal**: outside time, with no "before" or "after", living the whole of life at once. According to Wolterstorff and Swinburne, God is **everlasting**: inside time, with no beginning and no end. "Eternal" in the first sense does not mean "very long".
    decoys:
      - body: |
          According to Boethius and Aquinas, God is **everlasting**: inside time, with no beginning and no end. According to Wolterstorff and Swinburne, God is **eternal**: outside time, with no "before" or "after", living the whole of life at once.
        feedback: |
          The thinkers are swapped. Boethius and Aquinas hold the timeless picture; Wolterstorff and Swinburne place God inside time, which suits a God who acts and responds.
      - body: |
          According to Boethius and Aquinas, God is **eternal**: outside time, living the whole of life at once. According to Wolterstorff and Swinburne, God is **everlasting**: inside time. "Eternal" in the first sense means **a very long time**, longer than the universe.
        feedback: |
          Timeless eternity is not a long duration. A very long life still has a "before" and an "after"; the Boethian picture removes them.
    explanation: |
      The attribute puzzle becomes a question about God and time, and physics then says something about what "now" can mean.

  - id: world
    title: God and the world
    row: 3
    col: 1
    body: |
      With $G$ = God and $W$ = the world, three views:
      $$\begin{gathered}G = W\\ W \subsetneq G\\ G \neq W\end{gathered}$$
      Pantheism (Spinoza's *Deus sive Natura*), panentheism (the world is in God, and God is more) and classical theism (God is distinct from the world and acts by choice). $\subsetneq$ reads "is inside, but is not all of".
    decoys:
      - body: |
          With $G$ = God and $W$ = the world, three views:
          $$\begin{gathered}G \neq W\\ W \subsetneq G\\ G = W\end{gathered}$$
          Pantheism (Spinoza's *Deus sive Natura*), panentheism (the world is in God, and God is more) and classical theism (God is distinct from the world and acts by choice).
        feedback: |
          The symbols are in reverse order against the names. Pantheism is $G=W$ (God is the universe) and classical theism is $G\neq W$; only the middle line is panentheism.
      - body: |
          With $G$ = God and $W$ = the world, three views:
          $$\begin{gathered}G = W\\ G \subsetneq W\\ G \neq W\end{gathered}$$
          Pantheism (Spinoza's *Deus sive Natura*), panentheism (God is in the world, and the world is more) and classical theism (God is distinct from the world and acts by choice).
        feedback: |
          The inclusion points the wrong way. In panentheism the world is inside God and God is more than the world, $W\subsetneq G$. If God were inside a bigger world, that would be closer to pantheism with extra stuff.
    explanation: |
      Process and open theism let God be affected by the world; this box asks how close God and the world are in the first place.

  - id: neg
    title: Negation and the unsayable
    row: 3
    col: 2
    body: |
      With $G$ = God and $F$ a property word, **Dionysius** gives three steps: affirm ($G$ is $F$), deny ($G$ is not $F$), go beyond both. **Maimonides**: "$G$ is wise" really says "$G$ is not ignorant", and "angry" is an attribute of action (fire melts wax). **Eckhart**: the God who can be named differs from the unnameable Godhead.
    decoys:
      - body: |
          With $G$ = God and $F$ a property word, **Dionysius** gives three steps: affirm, deny, and then **affirm again**. **Maimonides**: "$G$ is wise" really says "$G$ is not ignorant", and "angry" is an attribute of action (fire melts wax). **Eckhart**: the God who can be named differs from the unnameable Godhead.
        feedback: |
          The third step goes beyond both affirming and denying: even the negation falls short, because God is "beyond" life and not merely lifeless. Affirming again would end at the start.
      - body: |
          With $G$ = God and $F$ a property word, **Dionysius** gives three steps: affirm, deny, go beyond both. **Maimonides**: "$G$ is wise" is a **positive** description of what God is, and "angry" is an attribute of action. **Eckhart**: the God who can be named differs from the unnameable Godhead.
        feedback: |
          For Maimonides a positive description would compare God to creatures. "Wise" says only what God is not (not ignorant), or describes an effect of God; only "angry" and "merciful" are attributes of action.
    explanation: |
      The first box asks what God is; here the question becomes whether human words can reach God at all.

  - id: sim
    title: Relativity of simultaneity
    row: 3
    col: 3
    body: |
      Units with light speed 1; Alice at rest, Bob at speed $u$, $\gamma=1/\sqrt{1-u^2}$. An event at distance $a$ and Alice-time $\tau$ has Bob-time
      $$t_B=\gamma\,(\tau-u\,a)$$
      Timelike separation ($|a|<|\tau|$) has the same order for all observers; **spacelike** ($|a|>|\tau|$) does not.
    decoys:
      - body: |
          Units with light speed 1; Alice at rest, Bob at speed $u$, $\gamma=1/\sqrt{1-u^2}$. An event at distance $a$ and Alice-time $\tau$ has Bob-time
          $$t_B=\gamma\,(\tau+u\,a)$$
          Timelike separation ($|a|<|\tau|$) has the same order for all observers; **spacelike** ($|a|>|\tau|$) does not.
        feedback: |
          With the plus sign the check against the lesson's numbers fails: for $u=0.6$ and $E=(3,0)$ the formula must give $-2.25$ (in Bob's past), but this gives $+2.25$. Events farther along Bob's direction of motion happen earlier for him.
      - body: |
          Units with light speed 1; Alice at rest, Bob at speed $u$, $\gamma=1/\sqrt{1-u^2}$. An event at distance $a$ and Alice-time $\tau$ has Bob-time
          $$t_B=\gamma\,(\tau-u\,a)$$
          **Spacelike** separation ($|a|<|\tau|$) has the same order for all observers; timelike ($|a|>|\tau|$) does not.
        feedback: |
          The names are swapped. Timelike separation (a signal no faster than light could join the events) fixes the order for everyone; spacelike separation (no such signal) allows disagreement.
    explanation: |
      Established physics meeting the time box: there is no unique universal "now", which bears on what it could mean for God to know "now" or for the future to be real.

  - id: analogy
    title: Analogy
    row: 4
    col: 2
    body: |
      According to **Aquinas**, "good" is said of God and of creatures neither **univocally** (same sense) nor **equivocally** (unrelated senses) but **by analogy**. Attribution: "healthy" is said of an animal and, derived from it, of its medicine. Proportionality (subscript $G$ for God, $P$ for a person):
      $$\frac{\text{good}_G}{\text{being}_G}\sim\frac{\text{good}_P}{\text{being}_P}$$
    decoys:
      - body: |
          According to **Aquinas**, "good" is said of God and of creatures **univocally** (the same sense), with God having more of it. Attribution: "healthy" is said of an animal and, derived from it, of its medicine. Proportionality (subscript $G$ for God, $P$ for a person):
          $$\frac{\text{good}_G}{\text{being}_G}\sim\frac{\text{good}_P}{\text{being}_P}$$
        feedback: |
          A univocal word would put God and creatures on one scale, which Aquinas denies. Analogy keeps a relation between the senses without making them identical.
      - body: |
          According to **Aquinas**, "good" is said of God and of creatures neither **univocally** nor **equivocally** but **by analogy**. Attribution: "healthy" is said of an animal and, derived from it, of its medicine. Proportionality (subscript $G$ for God, $P$ for a person):
          $$\text{good}_G\times\text{good}_P$$
        feedback: |
          Proportionality is a similarity of ratios (goodness to being, in each case), not a product. The two ratios are alike without being equal.
    explanation: |
      The positive answer to the negative way: words keep real, if imperfect, content, which the last two boxes put under pressure.

  - id: ayer
    title: Verificationism
    row: 4
    col: 3
    body: |
      With $e$ = "God exists", $M$ = factually meaningful, $V$ = verifiable, $A$ = analytic (Ayer):
      $$M(s)\Rightarrow V(s)\lor A(s)$$
      $$\neg V(e)\land\neg A(e)\ \therefore\ \neg M(e)$$
      Valid, but P1 is itself neither verifiable nor analytic, so it undermines itself.
    decoys:
      - body: |
          With $e$ = "God exists", $M$ = factually meaningful, $V$ = verifiable, $A$ = analytic (Ayer):
          $$M(s)\Rightarrow V(s)\land A(s)$$
          $$\neg V(e)\land\neg A(e)\ \therefore\ \neg M(e)$$
          Valid, but P1 is itself neither verifiable nor analytic, so it undermines itself.
        feedback: |
          P1 says "verifiable **or** analytic". With "and", mathematics (analytic, not verifiable by experience) would be meaningless, and the argument would condemn far more than religion.
      - body: |
          With $e$ = "God exists", $M$ = factually meaningful, $V$ = verifiable, $A$ = analytic (Ayer):
          $$M(s)\Rightarrow V(s)\lor A(s)$$
          $$\neg V(e)\land\neg A(e)\ \therefore\ \neg M(e)$$
          **Invalid**, but P1 is itself analytic, so it is safe from its own test.
        feedback: |
          The argument is valid: if both premises hold, the conclusion follows. The weakness is P1, which is neither verifiable nor analytic by its own standard.
    explanation: |
      Meaning itself becomes the target: the strongest challenge to speaking of God in the level, and the one the replies answer.

  - id: replies
    title: Replies to verificationism
    row: 5
    col: 3
    body: |
      **Hick**: "God exists" would be verified, if true, by experience after death (eschatological verification). **Flew**: a claim that nothing could count against it is emptied by qualifications (the gardener). **Hare**: such convictions are **bliks**, ways of seeing, not assertions. **Mitchell**: the believer, like a resistance fighter trusting a stranger, lets evidence count against the trust.
    decoys:
      - body: |
          **Hick**: "God exists" is **not verifiable even in principle**, yet meaningful. **Flew**: a claim that nothing could count against it is emptied by qualifications (the gardener). **Hare**: such convictions are **bliks**, ways of seeing, not assertions. **Mitchell**: the believer lets evidence count against the trust.
        feedback: |
          Hick accepts verification and argues that it can be met after death. Hare is the one who denies that the convictions are assertions.
      - body: |
          **Hick**: "God exists" would be verified, if true, by experience after death. **Flew**: a claim that nothing could count against it is emptied by qualifications (the gardener). **Hare**: such convictions are **bliks**, ways of seeing, not assertions. **Mitchell**: the believer holds the trust **whatever** the evidence, so nothing counts against it.
        feedback: |
          Mitchell says the opposite: evidence does count, but the believer trusts despite it for reasons, like the resistance fighter. Flew is the one who charges that nothing is allowed to count.
    explanation: |
      Each reply keeps the sentences meaningful by changing what "verified" or "assertion" means, and Flew's challenge is what presses them.

