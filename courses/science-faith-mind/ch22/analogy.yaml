id: ch22-analogy
title: "Analogy, Negation and Apophatic Speech"
kind: concept
own: |
  The setting: $G$ (written G in the displayed lines) is God as a tradition conceives God, and $F$ is a word such as "good" or "wise" that we first learn from creatures. The question is what the sentence "$G$ is $F$" can mean. Four answers, each *according to* its thinker.
  - **The dilemma** (Aquinas, ST I, q. 13, a. 5). The word $F$ can be used in the same sense for creature and God (univocal), in unrelated senses (equivocal), or in related senses:
    {{ $$\begin{gathered}\text{univocal: same sense}\\ \text{equivocal: unrelated senses}\\ \text{analogical: related, not identical}\end{gathered}$$ }}
    Univocal makes God a bigger creature; equivocal makes the sentence say nothing we can grasp.
  - **Analogy** (Aquinas, c. 1225 to 1274). A word is said analogically when several things are named by their relation to one primary case. "Healthy" is said of an animal, of a medicine that causes its health and of urine that signals it:
    {{ $$\text{medicine}\to\text{health of the animal}\leftarrow\text{urine}$$ }}
    So "God is good" is said in a sense related to, but not the same as, "this person is good".
  - **Negation** (Maimonides, 1138 or 1135 to 1204, *Guide of the Perplexed*, 1190). Because God is simple, a positive attribute only describes God's effects or removes a defect; each proven denial brings the reader nearer, as in his ship example:
    {{ $$\text{G is } F \ \leadsto\ \text{G is not lacking } F$$ }}
  - **Beyond both** (Pseudo-Dionysius, writing c. 500). Affirm, deny, then pass beyond both, since God exceeds every name and every denial:
    {{ $$\text{G is } F \ \to\ \text{G is not } F \ \to\ \text{G is over-}F$$ }}
    Eckhart (c. 1260 to c. 1328) distinguished God from the Godhead, the nameless ground beyond even the God who can be spoken of.
  - **Three layers.** Fact: who wrote what and when. Debate: whether analogy really says something positive, whether negative theology undoes itself, and whether the last stage is knowing or experience. Commitment: whether anything is as the traditions say; each tradition answers for itself.

cards:
  - type: text
    id: hook
    title: "Is God good the way a person is good?"
    body: |
      A believer says, "God is good", and a friend answers, "Good like my neighbour, who returns lost wallets?" Sooner or later every tradition that speaks of God meets this trap. If the word means exactly what it means for people, God sounds like a very large person. If it means something else entirely, the sentence seems to say nothing.

      Before any theory, a guess: is there a way to use a word that is neither the same nor wholly different? Guessing first is the point. Each view below is told *according to* its thinker, and nothing asks you to believe or doubt any religious sentence.

  - type: mcq
    id: guess
    title: "Guess: the word 'healthy'"
    prompt: |
      We say a person is healthy, a diet is healthy and a complexion is healthy. Is "healthy" used in exactly the same sense each time, in three unrelated senses, or in some third way?
    options:
      - text: "In related senses: the person has health, the diet tends to cause it and the complexion is a sign of it."
        correct: true
        feedback: |
          Yes. The meanings differ, yet they are tied to one centre, the health of the person. This is the pattern the lesson follows through four thinkers.
      - text: "In exactly the same sense, since it is the same word."
        feedback: |
          A diet does not have health the way a body does; it is not the one that is ill or well. The word shifts while keeping a link.
      - text: "In three unrelated senses, like 'bank' of a river and of money."
        feedback: |
          With a river bank and a money bank the meanings share nothing. Here all three uses point back to the health of a body.
      - text: "The word is meaningless when applied to a diet."
        feedback: |
          Everyone understands "a healthy diet". A word can be understood across uses that are not identical.
    explanation: |
      Keep this pattern in mind. A word can carry a family of related senses, and that is the key move of the first thinker.

  - type: text
    id: recall
    title: "Recall: the trap Flew set"
    body: |
      From the lesson Factual or Not? Cognitivism and Its Rivals: Antony Flew (1923 to 2010) asked what would count against a religious sentence, and warned that qualifying it again and again can leave it asserting nothing, a death by a thousand qualifications. This lesson meets that worry from another side. If the word $F$ in "$G$ is $F$" is qualified until it means something other than what $F$ meant when we learned it, what is left of the claim? The thinkers here, all medieval, saw the problem long before Flew and gave three different kinds of answer.

  - type: text
    id: dilemma
    title: "Aquinas: three ways to use a word"
    image:
      src: img/aquinas.webp
      alt: Painted portrait of Thomas Aquinas in a black and white Dominican habit on a gold background, by Carlo Crivelli
      caption: Thomas Aquinas (1225-1274), an Italian Dominican friar and theologian, painted by Carlo Crivelli in 1476; his Summa Theologiae asks how words learned from creatures can be said of God.
      credit: "Carlo Crivelli, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Aquinas_by_Carlo_Crivelli.png"
    body: |
      **Thomas Aquinas** (c. 1225 to 1274), a Dominican friar, took up the question in his *Summa Theologiae* (written 1267 to 1273), Part I, question 13. Let $G$ be God and $F$ a word like "good". A word can be used in three ways.

      It is **univocal** if it has one and the same sense for both, like "animal" said of a horse and of a human. It is **equivocal** if the senses are unrelated, like "bank". It is **analogical** if the senses differ but are related. According to Aquinas, article 5, what is said of God and creatures is said neither in a purely univocal nor in a purely equivocal sense but analogically, "according to proportion".

      The reasons run in both directions. Univocal speech would put God and creatures on one scale, so God would be a creature with more of $F$. Purely equivocal speech would leave us unable to say anything true about God from what we know, so the believer's sentences, and Flew's, would be empty.

  - type: mcq
    id: dilemma-q
    title: "Which mistake does each use risk?"
    prompt: |
      According to Aquinas, what is the trouble with using "good" in exactly the same sense for a person and for God?
    options:
      - text: "It puts God and creatures on one scale, as if God were simply a creature with more goodness."
        correct: true
        feedback: |
          Yes. If the sense were identical, "good" would measure God and people alike, which Aquinas thought makes God too small.
      - text: "It would make the sentence meaningless."
        feedback: |
          That is the risk of the equivocal use, where the senses are unrelated and nothing carries over.
      - text: "It would make the sentence false for people."
        feedback: |
          The word keeps its ordinary sense for people; the question is what happens when we carry it to God.
      - text: "It is a matter of grammar, with no consequence for the meaning."
        feedback: |
          The choice between the three uses is exactly a choice about what the sentence says.
    explanation: |
      Univocal risks anthropomorphism, equivocal risks emptiness. Analogy is the middle path between them.

  - type: text
    id: analogy
    title: "How analogy works: the health example"
    body: |
      Aquinas gives a plain example. The word "healthy" is said of an animal, of a medicine and of urine, and not in three unrelated senses. The animal is healthy in the primary sense, because it has health. The medicine is called healthy because it causes health in the animal, and the urine because it is a sign of it. In his words, they are named by their relation, or proportion, to one thing, the health of the animal.

      Apply the pattern to "good". We first learn goodness in creatures. According to Aquinas, the word then reaches God by relation: creatures have whatever goodness they have as something caused by God. So "God is good" does not say God has what a creature has. It says in essence that what is good in creatures flows from God, who is the source of it, in a way that falls short of fully representing God.

      Notice what is claimed and what is not. Aquinas says such names do signify the divine substance, not merely God's effects, though they fall short of a full representation of it.

  - type: mcq
    id: analogy-q
    title: "Apply it to 'wise'"
    prompt: |
      Following the health pattern, which sentence best states how Aquinas could read "God is wise" analogically?
    options:
      - text: "Whatever wisdom creatures have comes from God, and wisdom is said of God in a related but higher way."
        correct: true
        feedback: |
          Yes. The creature's wisdom is where we meet the word, and its relation to God as source gives the extended sense.
      - text: "God has the same wisdom a very wise person has, only more of it."
        feedback: |
          That is the univocal reading, which Aquinas rejects because it makes God one more wise thing on a common scale.
      - text: "'Wise' is a harmless word with no connection to the way we use it of people."
        feedback: |
          That is the equivocal reading, where the senses are unrelated. Aquinas says there is a link, and that is the point of analogy.
      - text: "God is wise only because people say so."
        feedback: |
          For Aquinas the relation runs from God to creatures as cause, not from human opinion.
    explanation: |
      The structure matches "healthy". The word's primary home is in creatures for us, but according to Aquinas it is more fully true of God, as the source.

  - type: mcq
    id: analogy-obj
    title: "A critic's reply"
    prompt: |
      A critic says: "If 'good' is not used in the same sense, you have not told me what 'God is good' means, only that it is related to what I know." Which reply fits Aquinas's own position, as the Stanford Encyclopedia reports it?
    options:
      - text: "He admits we cannot know what God is but only what God is not, yet he holds analogy lets us say something positive; some scholars find the two commitments in tension."
        correct: true
        feedback: |
          Yes. Aquinas writes at the start of ST I, question 3 that we cannot know what God is, only what God is not, yet he makes positive claims about God's goodness through analogy. Whether the two fit is a live debate (layer 2).
      - text: "He denies that any word can be said of God."
        feedback: |
          He holds that some names are said of God, analogically, and signify the divine substance.
      - text: "He holds that the senses are identical."
        feedback: |
          That is the univocal position he rejects in the same article.
      - text: "He accepts that his analogy tells us nothing, and is content."
        feedback: |
          He takes it to give real, if imperfect, knowledge. The critic's worry is exactly what the debate is about.
    explanation: |
      The critic presses where analogy stops short of a full definition. Defenders reply that a partial, related sense is still a sense. The objection lives on.

  - type: text
    id: maimonides
    title: "Maimonides: draw nearer by denying"
    image:
      src: img/maimonides.webp
      alt: "A traditional black-and-white portrait of Maimonides, a bearded man in a turban."
      caption: "A traditional portrait of Maimonides, copied by later artists; he finished the Guide of the Perplexed in 1190."
      credit: "presumably Blasio Ugolini, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Rambam-portrait.jpg"
    body: |
      **Moses ben Maimon, Maimonides** (1138 or 1135 to 1204), a rabbi and physician, finished the *Guide of the Perplexed* in 1190. He takes a more severe road than analogy. According to the Stanford Encyclopedia, he holds God's essence to be unknowable, so predicates such as "God is powerful" are to be read as negations, roughly "God is not lacking in power", or as descriptions of what God does, not of what God is.

      Why? In essence, because he takes God to be perfectly simple, with no parts. A positive attribute adds a quality to a subject, which would make God composite. His example is fire: it softens wax, hardens clay and blackens sugar without being soft, hard or black. Different effects, one source, and the description of the effects does not describe the fire.

      This is the heart of "saying what God is not", which the lesson Saying What God Is Not introduced from the side of the nature of God. Here the question is about meaning: a denial has a clear sense even when we cannot grasp the thing denied.

  - type: text
    id: ship
    title: "The ship: each denial brings you closer"
    body: |
      Maimonides worries that denial looks like a way to learn nothing. His reply, in *Guide* I.60, is a ship. Imagine a person who knows only that something called a "ship" exists. Told that it is not an accident, not a mineral, not a rooted plant, not a flat object, not a sphere, and so on through a series of denials, that person comes ever nearer to the idea of a long, hollow, wooden structure made of many pieces. The first person knows only the name; the tenth is nearly there.

      The point, in the retelling of the chapter, is that each denial narrows the possibilities, so we come closer to the thing by what it is not. Maimonides adds that each denial must be established by proof, not merely said. Here is the difference from analogy: nothing positive is asserted of God; each step simply removes something. One recent scholarly paper reads this parable as a case that strains against other parts of the Guide (layer 2).

  - type: mcq
    id: ship-q
    title: "What does each denial do?"
    prompt: |
      In the ship example, a person who knows only the name "ship" is told, one by one, what a ship is not. According to Maimonides, what does each added denial do for that person?
    options:
      - text: "It rules out more possibilities, so the person's idea comes closer to the thing."
        correct: true
        feedback: |
          Yes. Each proven denial narrows what the thing could be, so a long list of correct denials can approach, though never fully reach, the positive idea.
      - text: "It gives the person a positive description to repeat."
        feedback: |
          The method adds no positive description. It works by removal, and Maimonides says positive attributes would imply plurality or deficiency.
      - text: "It shows the thing does not exist."
        feedback: |
          The person already knows the ship exists; the denials say what it is not, not whether it is.
      - text: "It shows words cannot be used at all."
        feedback: |
          The denials are in words and are meaningful. Words work well enough to remove errors.
    explanation: |
      Negation is not the absence of meaning but a different route to it. A critic might ask whether a very long list of denials ever gives more than a shadow, which is part of the live debate.

  - type: text
    id: dionysius
    title: "Pseudo-Dionysius: affirm, deny, go beyond"
    body: |
      An unknown Christian author who wrote around the year 500 under the name Dionysius the Areopagite (an Athenian convert of Paul in the Acts of the Apostles) is called **Pseudo-Dionysius**. According to the Stanford Encyclopedia, his treatise *Divine Names* examines the names of God from affirmative and negative angles, using prefixes such as "over-good" and "over-being" to show that God exceeds the meaning of any name; his short *Mystical Theology* leads into a divine darkness and silence beyond all affirmations and negations.

      The sequence, as scholars summarise it, has three steps. First **affirm**: God is $F$ (the *cataphatic* way, from a Greek word for affirmation). Then **deny**: God is not $F$ (the *apophatic* way, from a word for denial). Then go **beyond** both, because God is neither the thing we affirmed nor merely the thing we denied. "Over-good" says that God exceeds goodness, not that God is bad.

      The two ways work together. We cannot deny a name until we have affirmed it, and the denial corrects what the affirmation suggests. Whether the final step is a kind of knowing or an experience is a matter on which scholars part (layer 2).

  - type: build
    id: dionysius-build
    title: "State the three steps"
    prompt: |
      According to Pseudo-Dionysius, put the three steps of speech about God in order, with $F$ a name such as "good".
    prefix: ''
    suffix: ''
    tiles: ['\text{G is F}', '\to', '\to', '\text{G is not F}', '\text{G is over-F}']
    answers:
      - ['\text{G is F}', '\to', '\text{G is not F}', '\to', '\text{G is over-F}']
    wrong:
      - answer: ['\text{G is not F}', '\to', '\text{G is F}', '\to', '\text{G is over-F}']
        feedback: |
          The denial corrects an affirmation, so the affirmation comes first. You cannot deny a name that has not been offered.
      - answer: ['\text{G is F}', '\to', '\text{G is over-F}', '\to', '\text{G is not F}']
        feedback: |
          The movement beyond comes last. Placing it before the denial skips the step that shows the plain affirmation falls short.
    explanation: |
      Affirm, deny, then go beyond both: "over-good" instead of "good" or "not good".

  - type: text
    id: eckhart
    title: "Eckhart: God and the Godhead"
    body: |
      **Meister Eckhart** (c. 1260 to c. 1328), a Dominican who taught in Paris and Cologne, drew on this tradition. According to standard accounts, he distinguished God, the Creator of whom we speak and who is named in the Trinity, from the **Godhead** (*Gottheit*), the nameless ground beyond even that God. Britannica describes the Godhead as the origin of all things beyond God as Creator, and his stages of union ending in a breakthrough beyond God.

      Here the apophatic road goes furthest: even "God" is a name that falls short. Churches did not all welcome this. On 27 March 1329, after his death, Pope John XXII issued the bull *In agro dominico*, which condemned some of Eckhart's propositions, many taken as heretical in their obvious sense, and noted that Eckhart had professed the Catholic faith and revoked whatever might be wrongly understood. Scholars debate how to read him, as a faithful Dominican, as a mystic near pantheism, or something else (layer 2).

  - type: mcq
    id: eckhart-q
    title: "Who said what?"
    prompt: |
      Match the idea to the thinker, according to the accounts above: "Even the word 'God' names something less than the nameless ground from which God comes."
    options:
      - text: "Eckhart, with the distinction between God and the Godhead."
        correct: true
        feedback: |
          Yes. The Godhead is beyond even the God of the Trinity, which is the most radical step in the apophatic line.
      - text: "Aquinas, with the health example."
        feedback: |
          Aquinas reads names like "good" as analogical, signifying the divine substance imperfectly; he does not set a nameless Godhead beyond God.
      - text: "Maimonides, with the ship."
        feedback: |
          Maimonides uses denials to approach God, but the God-Godhead split is Eckhart's.
      - text: "Flew, with the gardener."
        feedback: |
          Flew is a modern critic asking what counts against the sentence; he does not distinguish God from a Godhead.
    explanation: |
      Four routes: analogy (Aquinas), denial (Maimonides), affirm-deny-beyond (Pseudo-Dionysius) and the nameless ground (Eckhart).

  - type: mcq
    id: objection
    title: "Does negative theology undo itself?"
    prompt: |
      A critic says: "If God is beyond all words, then 'God is beyond all words' is itself a sentence, so you have said something about God after all." Which reply is closest to a reply the tradition could give?
    options:
      - text: "Pseudo-Dionysius's reply: the statement too falls short, so even the denials are denied, and speech ends in silence rather than in a new doctrine."
        correct: true
        feedback: |
          Yes. Dionysius goes beyond affirmation and denial, so the words are treated as pointers to be set aside, not as a finished description. Whether this escapes the paradox is debated.
      - text: "Aquinas's reply: the statement is true, so no further talk is needed."
        feedback: |
          Aquinas keeps analogical speech about God going; he does not close the discussion with one sentence.
      - text: "Ayer's reply: the sentence is false."
        feedback: |
          Ayer's verdict was that such sentences are neither true nor false in the strict sense, not that this one is false.
      - text: "No reply is possible, so negative theology is shown to be wrong."
        feedback: |
          A paradox is a problem to answer, not a proof. Defenders offer replies and critics reply to those.
    explanation: |
      The paradox is old and has several answers: silence, analogy as a supplement, or treating the claim as guidance for practice instead of a doctrine.

  - type: mcq
    id: layer
    title: "Layer: fact, debate or commitment"
    prompt: |
      Which of these is a **live debate among scholars**, neither a fact of record nor a faith commitment?
    options:
      - text: "Whether Aquinas's analogy gives real positive content about God, given his saying we cannot know what God is."
        correct: true
        feedback: |
          Yes. Informed scholars divide, so it is neither a date nor an act of faith.
      - text: "Maimonides finished the Guide of the Perplexed in 1190."
        feedback: |
          A date is a matter of record, so it belongs to the layer of fact.
      - text: "God is beyond every name."
        feedback: |
          Affirming or denying this is a metaphysical or faith commitment.
      - text: "Pope John XXII issued In agro dominico on 27 March 1329."
        feedback: |
          Again a record.
    explanation: |
      Notice the pattern: the record is the thinkers and dates, the debate is whether each route says something, and the commitment is each tradition's own answer.

  - type: text
    id: summary
    body: |
      **Next:** analogy and negation try to speak of God without making God a creature. A different tool, closer to ordinary speech, is the metaphor: "God is a rock", "the Lord is my shepherd". The next lesson, Metaphor, Symbol and Model, asks whether a metaphor can be literally true and what models do in science and theology.
