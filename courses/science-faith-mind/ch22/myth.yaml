id: ch22-myth
title: "Myth, Story and Narrative Truth"
kind: concept
own: |
  The setting: a **myth** here is a traditional sacred story, such as a tale of creation or of a great flood, told in a community that treats it as important. The question is what such a story is for, and whether it can be true without being literally what happened. Four answers, each *according to* its thinker.
  - **Eliade** (Mircea Eliade, 1907 to 1986). For the people who tell it, a myth recounts a breakthrough of the **sacred** (what is set apart as holy) into the **profane** (ordinary, unmarked time and space) at the beginning of things. Telling it, and acting it out in ritual, brings the hearer back to that origin (the arrow is what myth and rite do):
    {{ $$\text{profane time}\ \to\ \text{sacred origin}$$ }}
  - **Campbell** (Joseph Campbell, 1904 to 1987, *The Hero with a Thousand Faces*, 1949). Hero stories across the world share one pattern, the **monomyth**, in three movements. Critics reply that he chose the stories that fit:
    {{ $$\text{departure}\ \to\ \text{initiation}\ \to\ \text{return}$$ }}
  - **Lévi-Strauss** (Claude Lévi-Strauss, 1908 to 2009). The meaning of a myth lies in its structure, not its plot: it is built from pairs of opposites, such as life and death or raw and cooked, and a figure that mediates between the two softens the clash:
    {{ $$\text{A versus B}\ \Rightarrow\ \text{mediator of A and B}$$ }}
  - **Bultmann** (Rudolf Bultmann, 1884 to 1976). The New Testament speaks in the picture-language of an ancient world (heaven above, hell below, spirits). Do not throw the message out and do not take it as literal description: **demythologize** it, that is, interpret what the picture says about human existence:
    {{ $$\text{myth picture}\ \to\ \text{meaning for existence}$$ }}
  - **Three layers.** Fact: who wrote what and when. Debate: whether the patterns found by Campbell and Lévi-Strauss are in the stories or in the scholar, and whether demythologizing keeps or loses the message. Commitment: whether any given story is true in the way its tradition holds; each tradition answers for itself.

cards:
  - type: text
    id: hook
    title: "A flood, told many times"
    body: |
      The Epic of Gilgamesh, a Mesopotamian poem, has a man named Utnapishtim survive a flood sent by the gods by building a vessel. The book of Genesis tells of Noah, who is saved from a flood by an ark. In Hindu tradition a fish warns a man named Manu of a coming deluge and tells him to build a boat. Three cultures, three floods, one outline.

      Many people say "that is just a myth" to mean "that is false". Before any theory, a guess. Guessing first is the point, and each view below is told *according to* its thinker; nothing asks you to believe or doubt anything religious.

  - type: mcq
    id: guess
    title: "Guess: is a myth a false story?"
    prompt: |
      Someone says the flood stories are "myths, so they say nothing worth taking seriously". What is the most natural reply, before any theory?
    options:
      - text: "A story can matter even if it is not a record of events: people keep telling it because it does some work for them, so the first question is what the work is."
        correct: true
        feedback: |
          Yes. Whether the flood happened, and what the story is doing for those who tell it, are two separate questions, and the four thinkers below mostly take up the second.
      - text: "If it is not literally true, it must be a deliberate lie."
        feedback: |
          Telling a traditional tale is not lying: the tellers and hearers usually know what kind of story it is, or hold it as true on their own terms.
      - text: "If it is a story, it must be literally true, or nobody would keep it."
        feedback: |
          Stories are kept for many reasons, including beauty, memory, instruction and belonging, so being kept does not show literal truth.
      - text: "The three tales agree, so the flood must have been worldwide."
        feedback: |
          Agreement can come from a shared source, from similar floods in river valleys, or from a shared pattern in how stories are made. Scholars debate the links between the tales, and the claim of a worldwide flood is not settled by the likeness alone.
    explanation: |
      The puzzle is already visible. A story may be false as a report and still do something. The thinkers differ on what it does.

  - type: text
    id: recall
    title: "Recall: models and metaphors"
    body: |
      From the lesson Metaphor, Symbol and Model: a sentence such as "the Lord is my shepherd" is not true read literally, yet it is understood and says something. Ramsey held that religious talk uses models fitted with qualifiers, Tillich that a symbol points beyond itself and also takes part in what it points to, Ricoeur that a metaphor is a statement whose literal clash forces a new sense, and McFague that models of God are extended metaphors, so no single one should be read as literal. This lesson asks the same question one size up: can a whole story be non-literal and still say something?

  - type: text
    id: senses
    title: "Two senses of 'myth'"
    body: |
      In everyday speech a **myth** is a false belief: "the myth that we use only ten percent of our brains". Scholars of religion use the word differently. For them a myth is a **traditional story, told in a community as important**, usually about origins, gods, heroes or the shape of the world. The scholarly word does not say whether the story is true. It names a kind of story by what it does and by how a community treats it.

      So the sentence "the flood story is a myth" can be read two ways: "it is false" (everyday) or "it is a sacred traditional story" (scholarly). Mixing the two senses makes arguments look sharper than they are. A scholar can call the resurrection narratives or the Genesis creation tale a myth in the second sense without ruling on whether anything in them happened, and a believer may reject the label because the first sense is what the word usually suggests.

  - type: mcq
    id: senses-q
    title: "Which sense?"
    prompt: |
      A historian of religion writes: "The Babylonian creation epic is a myth that was recited at a new-year festival." Which sense of "myth" is meant?
    options:
      - text: "The scholarly sense: a traditional sacred story, with no verdict on whether it is true."
        correct: true
        feedback: |
          Yes. The sentence describes what the story was and how it was used, and says nothing about whether the events occurred.
      - text: "The everyday sense: the epic is a false belief."
        feedback: |
          The historian is classifying the story by its use at a festival. A verdict of false would need separate argument.
      - text: "A third sense: the epic is a deliberate hoax."
        feedback: |
          Nothing in the sentence suggests deception.
      - text: "Neither: 'myth' only ever means something about gods being literally real."
        feedback: |
          The scholarly use does not assert or deny that the gods exist.
    explanation: |
      Watching which sense is in play removes many false disputes. The real disputes begin when we ask what myths are for.

  - type: text
    id: eliade
    title: "Eliade: the sacred breaks in"
    image:
      src: img/eliade.webp
      alt: Romanian postage stamp of 1995 showing a drawn portrait of an elderly man with large dark-rimmed glasses, labelled Mircea Eliade 1907-1986
      caption: Mircea Eliade (1907 to 1986), a Romanian-born historian of religion who taught at Chicago, as shown on a Romanian stamp of 1995.
      credit: "E.Palade, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Mircea-Eliade.jpg"
    body: |
      **Mircea Eliade** (1907 to 1986), born in Bucharest, was a historian of religion who taught at the University of Chicago. In *The Sacred and the Profane* (English 1959) and *The Myth of the Eternal Return* (French 1949, English 1954) he argued, in essence, that religious people divide experience into the **sacred**, what is set apart as holy, and the **profane**, the ordinary and unmarked. The sacred shows itself in places and times he calls *hierophanies* ("appearances of the sacred").

      A myth, according to Eliade, tells how the sacred broke into the world at the beginning, in the time of origins, *in illo tempore* ("in that time"). For the people who tell it, the story is not a report to be checked but a model: things are real in so far as they follow the pattern set then. Reciting the myth and acting it out in a rite lifts the participants out of ordinary, profane time and returns them to the sacred time of the origin. A festival does not remember the beginning, he held, it enters it again.

      Eliade describes what the story does for believers. Whether the sacred is real, and whether his single scheme fits every tradition, are separate questions (layer 2 and layer 3).

  - type: mcq
    id: eliade-q
    title: "What does the festival do?"
    prompt: |
      According to Eliade, a community recites a creation myth each new year. What is the recitation for?
    options:
      - text: "To return the community to the sacred time of the origin, so the first act is present again."
        correct: true
        feedback: |
          Yes. For Eliade the myth is a way back to the beginning, not a lesson in history.
      - text: "To teach children which events happened and when, as a chronicle does."
        feedback: |
          A chronicle records the past as past. Eliade's point is that the myth makes the origin present, so it works differently.
      - text: "To prove by argument that the gods exist."
        feedback: |
          Eliade describes a rite and a story, not a proof. The reciters take the sacred as given.
      - text: "To replace ordinary time with a calendar of dates."
        feedback: |
          Eliade says the opposite: sacred time is not the ordinary count of days.
    explanation: |
      On this view the question "did it happen?" is not the one the story answers. It answers "what does this make present, and how should we live in the light of it?"

  - type: text
    id: campbell
    title: "Campbell: one hero, many faces"
    image:
      src: img/campbell.webp
      alt: Colour photograph of a smiling older man with short combed-back hair, wearing a patterned open-collar shirt, outdoors
      caption: Joseph Campbell (1904 to 1987), an American writer and professor at Sarah Lawrence College, argued that hero stories from many cultures share one pattern.
      credit: "Joan Halifax, CC BY 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Joseph_Campbell_(cropped).png"
    body: |
      **Joseph Campbell** (1904 to 1987), an American writer, taught literature at Sarah Lawrence College from 1934 to 1972. In *The Hero with a Thousand Faces* (1949) he argued that hero stories around the world follow one outline, which he called the **monomyth**, a word linked to James Joyce's *Finnegans Wake*, a novel Campbell had studied. In essence, a hero leaves the ordinary world after a call to adventure (**departure**), crosses into an unfamiliar world of trials and helpers and wins something decisive (**initiation**), and brings it back changed (**return**). Campbell divides these three movements into many smaller stages, and not every story has all of them.

      The pattern, he held, shows something common in the human mind, and a hero's journey is also a picture of a person's own change. Critics reply that the pattern is partly made by the selection. Folklorist critics argued, in essence, that Campbell cited the stories that fit and passed over those that did not (layer 2).

  - type: mcq
    id: campbell-q
    title: "A reply to Campbell"
    prompt: |
      A critic says: "Campbell found one hero's journey in every culture because he looked only at stories that already fit it." Which test would meet this objection?
    options:
      - text: "Choose the stories before looking for the pattern, for example all hero tales in a given region, and count how many fit."
        correct: true
        feedback: |
          Yes. If the sample is picked without knowing the pattern, a high rate of fit is evidence for it. If only the matching tales are picked, the pattern is built into the sample.
      - text: "Find more stories that fit and add them to the list."
        feedback: |
          More matching cases do not answer the charge of selection. They repeat it.
      - text: "Point out that the pattern is also found in modern films."
        feedback: |
          Writers who know the pattern may follow it on purpose, so films do not test whether it was in the older stories.
      - text: "Say that a story which does not fit is not really a hero story."
        feedback: |
          That defines the objection away: if every non-matching story is excluded, nothing could count against the pattern.
    explanation: |
      The objection is about how the evidence was chosen, and the reply must be about the same. The same worry returns with Lévi-Strauss.

  - type: text
    id: levi-strauss
    title: "Lévi-Strauss: myth as structure"
    image:
      src: img/levi-strauss.webp
      alt: Colour photograph of an elderly bald man with tortoiseshell glasses, dark jacket and tie, smiling, with flags behind him
      caption: Claude Lévi-Strauss (1908 to 2009), a French anthropologist, read myths as structures of opposites rather than as stories to be judged true or false.
      credit: "UNESCO/Michel Ravassard, CC BY 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Levi-strauss_260_(cropped2).jpg"
    body: |
      **Claude Lévi-Strauss** (1908 to 2009), a Belgian-born French anthropologist, held the chair of social anthropology at the Collège de France from 1959 to 1982. His claim, in essence, is that a myth's meaning does not lie in its plot, taken one telling at a time, but in its **structure**: the way its parts are related, like the notes of a tune. In his essay "The Structural Study of Myth" he argued that a myth should be read by how its parts are related across its versions, and he applied the method to myths of the Americas in *Mythologiques*, a series that begins with *The Raw and the Cooked* (1964).

      What he found, he argued, are pairs of **opposites**, such as nature and culture, or raw and cooked, and myths that work on them. When two opposites cannot both be given up, a figure appears that stands between them and so mediates. In one reading, a scavenger such as the raven or the coyote of Native American tales, which eats dead flesh without being a hunter, stands between life and death. On this view a myth is a way of thinking through a problem that has no direct answer.

      Critics, among them the anthropologist Edmund Leach, said he leaned too much on armchair theorizing (layer 2). Leach still found the central idea clear and exciting.

  - type: mcq
    id: levi-q
    title: "What does a mediator do?"
    prompt: |
      According to Lévi-Strauss, in a myth built on the opposition of life and death, a trickster who eats the dead but is not a killer plays what role?
    options:
      - text: "A mediator: a figure with something of both sides, which eases an opposition that cannot be resolved directly."
        correct: true
        feedback: |
          Yes. Since the trickster shares something of both life and death, the myth can think about the gap between them.
      - text: "The hero of a monomyth, who departs, is initiated and returns."
        feedback: |
          That is Campbell's pattern. Lévi-Strauss reads the structure of oppositions, not the hero's path.
      - text: "A record of a real animal's habits, kept for future hunters."
        feedback: |
          Animal facts are the material, but his claim is about what the myth does with them.
      - text: "A way back to the sacred time of the origin."
        feedback: |
          That is Eliade's account of the use of myth, not the structural one.
    explanation: |
      Notice how the thinkers differ about the same stories: Eliade asks what the story makes present, Campbell what shape it has across cultures, Lévi-Strauss what opposites it works on.

  - type: text
    id: bultmann
    title: "Bultmann: demythologizing"
    body: |
      **Rudolf Bultmann** (1884 to 1976) was a German theologian, professor of New Testament at the University of Marburg. In his 1941 lecture "New Testament and Mythology" he argued, in essence, that the New Testament speaks in the picture-world of its age: a universe with heaven above, the earth in the middle and the underworld below, with spirits and miracles. People who use electric light, the radio and modern medicine, he held, cannot sincerely take that picture as a description of the world.

      His answer is neither to throw the message away nor to ask people to believe the picture, but to **demythologize**: to interpret the mythical language for what it says about human existence. Drawing on the philosopher Martin Heidegger, he read the New Testament existentially, as a proclamation (in Greek, the *kerygma*) that calls a person to a new way of living, trusting God and not one's own security. On this reading, faith rests on the proclamation, not on particular facts about the historical Jesus.

      Bultmann does not say the message is false, and he does not say the myth is mere decoration to strip off. The myth, he held, is the old way of saying something about life, and it can be said again in terms a modern person can use.

  - type: build
    id: bultmann-build
    title: "State the move"
    prompt: |
      According to Bultmann, put the order of the move in place, from the New Testament's own language to what it asks of a reader.
    prefix: ''
    suffix: ''
    tiles: ['\text{mythical picture}', '\to', '\to', '\text{existential interpretation}', '\text{call to a way of living}']
    answers:
      - ['\text{mythical picture}', '\to', '\text{existential interpretation}', '\to', '\text{call to a way of living}']
    wrong:
      - answer: ['\text{existential interpretation}', '\to', '\text{mythical picture}', '\to', '\text{call to a way of living}']
        feedback: |
          Interpretation works on something. The picture comes first and the interpretation asks what it says about existence.
      - answer: ['\text{mythical picture}', '\to', '\text{call to a way of living}', '\to', '\text{existential interpretation}']
        feedback: |
          The call is the result of the interpretation, not its starting point. The interpreter finds the call by reading the picture existentially.
    explanation: |
      Picture, interpretation, call. Demythologizing is a way of reading, not a way of deleting.

  - type: mcq
    id: bultmann-obj
    title: "Is the picture removable?"
    prompt: |
      The philosopher Karl Jaspers, in an exchange with Bultmann, objected in essence that Bultmann treated mythical thinking as obsolete and wanted to rescue religion through an existentialist reading. Which is the closest statement of that worry?
    options:
      - text: "Myth is not an obsolete layer: if the picture carries the message, stripping it away may change or lose the message."
        correct: true
        feedback: |
          Yes. The objection is that form and content may not separate cleanly, so "translating" the myth is also changing it.
      - text: "Modern people can believe a three-storied universe, so no translation is needed."
        feedback: |
          That is a different objection, about whether the picture really is unbelievable. Jaspers's worry is about whether the picture can be taken away.
      - text: "Demythologizing proves the New Testament is false."
        feedback: |
          Bultmann held the opposite, that it recovers the message, and the objection here is about whether it can do that.
      - text: "Myths have no meaning that could be translated."
        feedback: |
          Jaspers did not deny that the myths mean something. His worry is about whether the meaning can be taken out of the mythical form.
    explanation: |
      The same worry appeared in the lesson on metaphor, where a critic asked whether a metaphor can be paraphrased without loss. Ricoeur said no, and Jaspers presses it against Bultmann.

  - type: mcq
    id: whose
    title: "Whose view is this?"
    prompt: |
      "A festival does not merely remember the beginning of the world; for the participants, it enters the time of that beginning again." Which thinker held this view?
    options:
      - text: "Eliade."
        correct: true
        feedback: |
          Yes: return to the sacred time of the origin through myth and rite is Eliade's mark.
      - text: "Campbell."
        feedback: |
          Campbell's key idea is the common outline of the hero's journey, not the return to a sacred origin.
      - text: "Lévi-Strauss."
        feedback: |
          His interest is in oppositions and mediation within the story, not in the experience of sacred time.
      - text: "Bultmann."
        feedback: |
          Bultmann asks what the New Testament's language says about existence. Return to an origin is not his theme.
    explanation: |
      Each thinker gives a different answer to the question what a myth is for. Eliade says it makes the origin present.

  - type: mcq
    id: whose2
    title: "Four readings of one story"
    prompt: |
      A scholar studying the flood stories says: "Set the tales side by side and look for the pairs of opposites they work on, such as order and chaos, or the saved and the drowned, and for the figures that stand between them." Whose method is this?
    options:
      - text: "Lévi-Strauss's structural method."
        correct: true
        feedback: |
          Yes. He looks for oppositions and mediators across versions of a myth. Eliade would ask what the story makes present, Campbell what stages it shares, and Bultmann what it says about existence.
      - text: "Campbell's monomyth."
        feedback: |
          Campbell would look for departure, initiation and return in the hero's path, here Noah or Utnapishtim.
      - text: "Bultmann's demythologizing."
        feedback: |
          Bultmann asked how to interpret one tradition's scripture for modern readers, not how to compare versions for oppositions.
      - text: "Eliade's sacred time."
        feedback: |
          Eliade would ask how reciting the flood story makes the origin present to its hearers.
    explanation: |
      The same story supports four questions. The thinkers differ because they ask different things of it, and the answers are not simple rivals.

  - type: mcq
    id: objection
    title: "A true story, or only a useful one?"
    prompt: |
      A critic says: "If the point of a myth is what it does for people, then you have admitted it is not true, only useful." Which reply is closest to one that a thinker above, or a defender of theirs, could give?
    options:
      - text: "The objection assumes truth means literal report. A story can disclose something about human life, as Bultmann argues, without being a chronicle, and whether it does is a further question."
        correct: true
        feedback: |
          Yes. This separates two things: whether the events happened, and whether the story says something true about life. Critics reply that "true about life" then needs a test, and that a believer may want the events to count too (layer 2 and layer 3).
      - text: "Usefulness proves truth, since people would not keep a useless story."
        feedback: |
          Many false beliefs have been kept because they were useful, so usefulness alone does not prove truth.
      - text: "The four thinkers all agree that myths are literally true."
        feedback: |
          None of them says so. They describe what the story does, how it is built, or how to read it.
      - text: "Nothing can be said, because every story is equally good."
        feedback: |
          A defender of narrative truth must say how to tell a story that discloses something from one that merely entertains or misleads. Leaving the question open does not answer it.
    explanation: |
      Traditions differ here. Some insist that certain events happened, and stake the story on it, while others accept that the story's truth lies in what it shows. Which view is right is not a matter of record, but a matter of what one thinks truth requires.

  - type: mcq
    id: layer
    title: "Layer: fact, debate or commitment"
    prompt: |
      Which of these is a **live debate among scholars**, neither a fact of record nor a faith commitment?
    options:
      - text: "Whether the hero's journey pattern is found in the stories themselves or is produced by the scholar's choice of examples."
        correct: true
        feedback: |
          Yes. Folklorists and Campbell's admirers divide on this, so it is neither a date nor an act of faith.
      - text: "Bultmann gave his lecture on demythologizing in 1941."
        feedback: |
          A date of record, so it belongs to the layer of fact.
      - text: "The flood in Genesis really happened as the text tells it."
        feedback: |
          Whether it happened as told is, for the traditions that hold it, a matter of faith, and historians weigh it by other evidence. It is not a settled fact of record.
      - text: "Lévi-Strauss lived from 1908 to 2009."
        feedback: |
          Again a record.
    explanation: |
      The pattern repeats: the record is who wrote what and when, the debate is whether the patterns are in the stories and whether a message survives demythologizing, and the commitment is each tradition's own answer.

  - type: text
    id: summary
    body: |
      **What you now own.** A **myth**, in the scholarly sense, is a traditional sacred story, and the word alone does not say whether it is true. According to Eliade it brings believers back to the sacred time of the origin; according to Campbell, hero stories share one pattern, though critics say he picked those that fit; according to Lévi-Strauss, a myth's meaning lies in its structure of opposites and mediators; according to Bultmann, the New Testament's mythical picture should be interpreted for its meaning about existence, though Jaspers asked whether the message can be separated from the picture. What stays open: whether a story can be true without being literal, and what makes it so.

      **Next:** stories are told, and some words do things when spoken: a vow, a blessing, a naming. The next lesson, Ritual, Performative Speech and Liturgy, asks what it means to act with words.
