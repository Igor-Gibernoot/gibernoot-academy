id: ch22-sentence
title: "Guided problem: One Sentence, Four Readings"
kind: guided
cards:
  - type: text
    id: hook
    title: "Four words, one verse"
    body: |
      The First Letter of John, chapter 4, verse 8, in the King James Version, says: "He that loveth not knoweth not God; for God is love." Verse 16 repeats the three words: "God is love; and he that dwelleth in love dwelleth in God, and God in him." In the Greek, the three words are *ho theos agape estin*, and *agape* (a Greek word for love, often used for self-giving love) is the word translated "love".

      Believers say the sentence at funerals, in hymns and in arguments about how to treat people. Before any theory, a guess. Guessing first is the point, and nothing here asks you to believe or doubt anything: the task is to test one sentence under four theories of meaning from the lesson What Does It Mean to Mean?, each told *according to* its thinkers.

  - type: mcq
    id: guess
    title: "Guess: what would settle it?"
    prompt: |
      Someone says "God is love" and someone else answers "that cannot be true or false". Before choosing a side, what do the two people most likely disagree about?
    options:
      - text: "What kind of job the sentence does: stating a fact about reality, expressing an attitude, or something else."
        correct: true
        feedback: |
          Yes. Whether a sentence can be tested depends first on what it is doing. A report can be checked against the world, a promise can be kept or broken, and an exclamation does neither.
      - text: "Only whether God exists."
        feedback: |
          That matters for some readings, but a person can think the sentence is true, false or neither for reasons that have nothing to do with a proof of God. The disagreement can come earlier, at the question of what the words are doing.
      - text: "Only how to pronounce the Greek."
        feedback: |
          Pronunciation does not change what the sentence says or how it could be checked.
      - text: "Nothing: the two people must be using different dictionaries."
        feedback: |
          The words are in any dictionary. The disagreement is about the job the sentence does, which a dictionary does not settle.
    explanation: |
      Keep the guess. The four theories below each give a different answer to "what is this sentence doing?", and so a different answer to "how could it be checked?".

  - type: text
    id: method
    title: "The method: four tests, two questions each"
    body: |
      Take the sentence as it stands, "God is love", and run it through four theories of meaning. For each theory ask two things. First, what does the theory make of the sentence? Second, how could the sentence be checked, if at all?

      The four are: **Frege's sense and reference** (1892), **the picture theory** of the early Wittgenstein (1921), **the verification principle** of the Vienna Circle and A. J. Ayer (1936), and **meaning as use** of the late Wittgenstein (1953). None is declared the winner. Where a believer, a sceptic or another philosopher would push back, a rival reading is named in the feedback.

  - type: text
    id: frege
    title: "Reading one: sense and reference"
    body: |
      According to Frege, an expression has a **reference** (the thing it picks out) and a **sense** (the way it presents that thing). Apply this to the sentence. "God" is a name or description with a sense; if something answers to it, that thing is its reference. "Is love" is a **concept** in Frege's sense: something an object either falls under or does not, as "is prime" is true of some numbers and not of others.

      Then the sentence is true if the thing "God" picks out falls under the concept, and false if it does not. But what if nothing answers to "God"? Frege's own example is "Odysseus was set ashore at Ithaca while sound asleep". The sentence has a sense, a thought we can grasp, but because "Odysseus" refers to nothing, it has no truth value: neither true nor false. Applied here, the Frege reading makes "God is love" a real claim, but one whose truth value depends on whether the name picks something out. This application is ours, not Frege's.

  - type: mcq
    id: frege-q
    title: "A name with nothing behind it"
    prompt: |
      According to Frege, a sentence containing a name that refers to nothing, such as Odysseus, has a sense but no truth value. Suppose, only for the sake of the question, that nothing answers to a speaker's word "God". What would the Frege reading say of "God is love"?
    options:
      - text: "It expresses a thought we can grasp, but it is neither true nor false, because the name picks out nothing."
        correct: true
        feedback: |
          Yes. A sense without a reference gives a thought without a truth value. Note that this is a statement about the *supposition*, not a verdict that the supposition holds.
      - text: "It is meaningless, because it has no reference."
        feedback: |
          Frege separates sense from reference on purpose. The sentence about Odysseus is understood by everyone, so it has a sense even without a reference. Missing reference removes the truth value, not the meaning.
      - text: "It is false, because the name picks out nothing."
        feedback: |
          Some later philosophers do treat such sentences as false, and that is a live rival. Frege's own treatment, as the Odysseus case shows, is that there is no truth value at all.
      - text: "It is true, because love exists anyway."
        feedback: |
          The sentence says that the thing God picks out falls under the concept of love. If nothing is picked out, the fact that love exists elsewhere does not make the sentence true.
    explanation: |
      On this reading the sentence is a claim with two ways to fail: the name might refer to nothing, or the thing it refers to might not fall under the concept.

  - type: order
    id: frege-check
    title: "How the Frege reading would check it"
    prompt: |
      According to the Frege reading, put in order the steps for settling whether "God is love" is true.
    steps:
      - "Fix the sense: say how the speaker's word 'God' presents what it is meant to pick out."
      - "Ask whether anything is picked out by that sense: whether the name refers."
      - "If something is, ask whether it falls under the concept 'is love', as the speaker uses the word 'love'."
      - "Only then assign the sentence a truth value: true if it does, false if it does not."
    hint: "A truth value needs a reference first, and the concept test comes after."
    explanation: |
      The first check is the one the arguments about God in earlier levels work on. The second is a question about what the speaker means by "love" and how a being could be said to fall under it. A critic notes that the second step is hard to carry out, since "love" applied to God is the very word whose sense the lesson Analogy, Negation and Apophatic Speech showed to be disputed.

  - type: mcq
    id: is-q
    title: "Two ways to read the little word 'is'"
    prompt: |
      In "God is love", Frege's distinction between two uses of "is" gives two readings. In (a), "is" says that God falls under the concept "loving". In (b), "is" is an identity: "God" and "Love" are two expressions for one thing. Which check does each reading need?
    options:
      - text: "(a) needs a reference for 'God' and a test of whether it is loving; (b) needs both names to refer and to pick out the same thing."
        correct: true
        feedback: |
          Yes. Identity is the same logical form as "the morning star is the evening star": both sides must refer, and to one thing. Reading (b) can be informative if the two names have different senses, which is the point of Frege's Venus example. Which reading a speaker means is a question about the speaker, and the sentence's grammar does not settle it.
      - text: "Both readings need exactly the same check, since 'is' always means the same."
        feedback: |
          Frege's point is the reverse: the same word does two logical jobs, predication and identity, and the checks differ.
      - text: "(a) can be checked by a thermometer and (b) cannot."
        feedback: |
          Neither reading is a measurement of temperature. Both are about what the words pick out and what holds of it.
      - text: "(b) needs no check, because identities are true by definition."
        feedback: |
          Frege's morning-star identity is informative because it is not true by definition. It had to be discovered.
    explanation: |
      Readers of the verse differ on which reading fits. Some stress the predicate reading, God is loving. Others stress the identity reading, that love and God are one. The Frege tools show that the two cases need different checks.

  - type: text
    id: picture
    title: "Reading two: a picture of a state of affairs"
    body: |
      According to the picture theory of the *Tractatus* (1921), a sentence is meaningful as a statement of fact when it pictures a possible arrangement of things, as a map does. It is true if the arrangement holds and false if not. To check it, you compare the picture with the world.

      Apply this to the sentence. "The cat is on the mat" pictures an arrangement of a cat and a mat. What arrangement does "God is love" picture? The *Tractatus* itself says in 6.42 that propositions cannot express anything higher, and in 6.432 that "God does not reveal himself in the world" (Ogden translation). So on this theory the sentence does not picture a state of affairs in the world, and it has no truth value in the way the cat sentence does. What follows from that for the worth of such talk is something we do not settle here.

  - type: mcq
    id: picture-q
    title: "Rewrite it to make it testable"
    prompt: |
      A defender of the picture theory says "God is love" pictures no arrangement of things. A believer replies: "I can say it in testable pieces, such as 'prayers for the sick are sometimes answered', or 'people who live by it become kinder'." What is the fair assessment?
    options:
      - text: "Each piece pictures an arrangement and can be checked, but the pieces are new sentences, and many believers would say they do not capture what the original meant."
        correct: true
        feedback: |
          Yes. The rewrite buys testability at a price: the new sentences say less, or something different. Whether the loss matters is where the believer and the picture theorist part.
      - text: "The rewrite proves that the original was a factual claim after all."
        feedback: |
          It shows that some related sentences are factual. It does not show that the original is the same as their sum, and the believer may claim more than the pieces say.
      - text: "The rewrite is not allowed, because no sentence can be rewritten."
        feedback: |
          Rewriting is allowed. The question is whether the rewrite keeps what the speaker meant.
      - text: "The picture theory predicts that the pieces are false."
        feedback: |
          The theory says nothing about truth here. It only says what can be a factual picture; the pieces may or may not be true.
    explanation: |
      The picture reading checks a sentence by comparing it with the world, and the original gives it nothing to compare. A rival view, taken up in the lesson Factual or Not? Cognitivism and Its Rivals, keeps the sentence as it is and denies that all meaning is picturing.

  - type: text
    id: verification
    title: "Reading three: what experience could count for or against it"
    body: |
      According to the verification principle as Ayer presented it in 1936, a sentence that states a fact has literal meaning only if some possible experience could count for or against it. Ayer applied it to "God exists" and concluded that the sentence, and its denial, state no fact. Applying the same test to "God is love" is our extension of his argument.

      Ask what you would observe if the sentence were true, and what if it were false. A parent who says "my child loves me" expects certain things: help, warmth, no betrayal. For "God is love", the believer is asked what would count against it: a child who dies, a famine. Antony Flew's challenge in the Gardener story was that a speaker who lets every such event be explained away has left the sentence with no content. The verificationist concludes the sentence is not a factual statement in the strict sense.

  - type: mcq
    id: verification-q
    title: "What could count against it?"
    prompt: |
      A believer says "God is love". A sceptic asks what would count against it. The believer answers: "A great deal counts against it. Cruelty and suffering are real evidence against it, and I feel their weight. But I hold the trust despite that." Which reading of the sentence does this answer give, and how does the verificationist reply?
    options:
      - text: "A claim with a test: the believer grants that evidence counts. The verificationist replies that this takes the sentence out of the strict case, since something could count against it, and then asks how much it would take."
        correct: true
        feedback: |
          Yes. This is Basil Mitchell's partisan reply, told in the lesson Factual or Not? Cognitivism and Its Rivals. It keeps the sentence testable in principle, which is all the principle asks, but it leaves open how much evidence would be enough.
      - text: "A blik: the believer has said that nothing could count against it."
        feedback: |
          Hare's blik is the reply that nothing counts. This believer says the reverse: evidence does count. The two replies differ on exactly that point.
      - text: "A claim verified after death, so nothing counts now."
        feedback: |
          That is John Hick's eschatological verification. This believer speaks of evidence counting now, not of a check after death.
      - text: "Meaningless, because every sentence about God is."
        feedback: |
          The believer has given a test, so on the strict principle the sentence is within reach. Calling the whole class meaningless is the principle's blunt form, which many of its own supporters gave up.
    explanation: |
      The verification reading checks a sentence by asking what experience would count for it and against it. A believer who accepts that evidence counts is giving the sentence what the test asks for. One who says nothing could count is, on this theory, saying nothing factual.

  - type: text
    id: use
    title: "Reading four: what it does in a life"
    body: |
      According to the late Wittgenstein, for a large class of cases the meaning of a word is its use in the language, and words belong to language-games that are part of a form of life. According to D. Z. Phillips, religious talk has its own use in the life of a community, and judging it by the standards of science misses what it does.

      Apply this to the sentence. Ask where "God is love" is said and what follows. It is said over a grave, in a hymn, to a child, in reply to "why should I forgive them?". In each setting it does something: it comforts, praises, commits, gives a reason. To check this reading, you do not compare the sentence with an arrangement of things. You look at how it is used by the people who say it, and what they treat as a misuse: someone who says it and then acts with cruelty is, within the practice, using it badly.

  - type: mcq
    id: use-q
    title: "How would you check a use?"
    prompt: |
      On the use reading, how could a researcher check what "God is love" means for a community?
    options:
      - text: "By observing where and how the sentence is said, what the speakers do with it, and what they count as using it wrongly."
        correct: true
        feedback: |
          Yes. The evidence is the practice: occasions, replies, corrections. The test is closer to learning the rules of a game by watching it played than to measuring a fact.
      - text: "By running a laboratory experiment on whether God loves people."
        feedback: |
          That treats the sentence as a report to test, which is the question the use reading puts aside. It asks what the sentence does, not whether a state of the world matches it.
      - text: "By looking up whether 'love' appears in a dictionary."
        feedback: |
          A dictionary lists typical uses but does not show how a community lives with a sentence. The use reading looks at the practice itself.
      - text: "It cannot be checked at all, since use is private."
        feedback: |
          Use is public: it is what speakers do in the open. Wittgenstein argued that meaning rests on shared practice, so it can be observed.
    explanation: |
      A rival reading, told in the same lesson, says a believer who says "God is love" usually also means it as true of reality. The use reading can reply that this too is part of the use; a critic replies that then the sentence is a claim again.

  - type: mcq
    id: match
    title: "Which reading asks which question?"
    multiple: true
    prompt: |
      Four questions about "God is love". Select the two that belong to the picture theory and the verification principle.
    options:
      - text: "What arrangement of things does the sentence picture, so that we can compare it with the world?"
        correct: true
        feedback: |
          Yes, the picture theory: a map and the territory.
      - text: "What possible experience would count for it, and what against it?"
        correct: true
        feedback: |
          Yes, the verification principle: the sentence is tied to what experience could show.
      - text: "Does the name 'God' refer to anything, and does what it picks out fall under the concept 'is love'?"
        feedback: |
          This is the Frege reading: reference first, concept second.
      - text: "In what activities is the sentence said, and what counts as using it wrongly?"
        feedback: |
          This is the use reading: look at the practice.
    explanation: |
      Two of the four ask for a comparison with reality, in different ways. The Frege reading asks about reference, and the use reading asks about practice.

  - type: text
    id: table
    title: "The four readings side by side"
    body: |
      | Reading | What it makes of "God is love" | How it could be checked |
      |---|---|---|
      | Sense and reference | A claim: true or false if "God" refers | Does the name refer? Does the thing fall under "is love"? |
      | Picture | No picture of a state of affairs | Nothing to compare with the world, unless rewritten |
      | Verification | Not a strict factual statement, unless something could count against it | What experience counts for or against? |
      | Use | A move in a way of life: praise, comfort, commitment | Watch how it is said and what counts as misuse |

      The table shows a spread. Two of the four give the sentence a truth value if some conditions are met, and two read it as something other than a plain report. Which pair you favour depends on a premise, as the next cards show.

  - type: mcq
    id: rival
    title: "A believer replies to the table"
    prompt: |
      A believer looks at the table and says: "I do not say 'God is love' to praise or to comfort only. I say it because I think it is true of how things are." Which of the four readings does this go most against, and which fits it?
    options:
      - text: "It goes against the use reading, taken as the whole story, and fits the Frege reading, where the sentence is a claim that is true if its subject refers and is loving."
        correct: true
        feedback: |
          Yes. The believer keeps the claim. A use theorist can reply that the sentence does both, praising and claiming, and a critic of that reply asks whether the claim then carries the weight the tests above were built for.
      - text: "It goes against the Frege reading and fits the picture theory."
        feedback: |
          The reverse. The Frege reading keeps a truth-valued claim, and the picture theory, applied here, denies the sentence a picture to be true of.
      - text: "It fits all four equally."
        feedback: |
          The four disagree on whether the sentence is a claim. A believer who insists that it is true of how things are takes sides.
      - text: "It shows that the believer misunderstands the sentence."
        feedback: |
          None of the four theories can simply declare what the speaker means. The believer's report of intention is evidence that has to be weighed, and some readings give it more weight than others.
    explanation: |
      A believer, a sceptic and a philosopher of language can look at the same table and read it differently: for the believer it shows how a claim might be tested, for the sceptic how little can be tested, for the use theorist how much the sentence does besides claiming.

  - type: text
    id: parting
    title: "Where thoughtful people part"
    body: |
      The four readings do not disagree about the words. They disagree about a premise: **whether meaning comes from what a sentence says about the world** or **from what it does in a life**. If you hold the first, the picture theory and the verification principle ask whether the sentence says something the world could confirm, and the Frege reading asks whether it refers and applies. If you hold the second, the sentence is understood from inside the practice.

      A believer who takes the sentence as a claim about God's nature will favour the Frege reading and say the other tests are too narrow. A sceptic may agree that the sentence does something, and ask whether it also claims something. A third view reads the sentence as an expression of commitment or attitude. These disagreements are about premises and values, not about who is clever.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Sort the sentence: "Whether 'God is love' states a fact about reality depends on which theory of meaning is right, and philosophers disagree about the theories."
    options:
      - text: "A live debate: it is a plain report of how the theories divide, not a verdict on God or on love."
        correct: true
        feedback: |
          Yes. The lesson has set out what each reading says and how it could be checked. Which theory is right is a debate in philosophy of language, and whether the sentence is true is a further question for those who accept it as a claim.
      - text: "Established fact: one theory has been proved right."
        feedback: |
          Every one of the theories has defenders and objections, as the lesson What Does It Mean to Mean? showed. None is proved.
      - text: "A faith commitment: it presupposes that God exists."
        feedback: |
          It presupposes nothing about God. It says only that the question of meaning is open and depends on the theory.
      - text: "None of these, because it is only a word game."
        feedback: |
          It is a substantive claim about the state of a debate, and can be checked against the scholars each reading is attributed to.
    explanation: |
      Keep the layers apart: who argued what is fact, which theory of meaning is right is debate, and whether the sentence is true of reality is a commitment that each tradition and each person answers.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Method.** To test one sentence under four theories, ask two questions of each: what does the theory make of the sentence, and how could it be checked? Applied to "God is love" (1 John 4:8, King James Version):

      - Frege's sense and reference makes it a claim whose truth value depends on whether "God" refers and whether the referent falls under the concept "is love"; it is checked by reference first and concept second. The two uses of "is", predication and identity, need different checks.
      - The picture theory finds no arrangement of things for it to picture, so it has nothing to compare with the world, unless the sentence is rewritten as testable pieces that may say something different.
      - The verification principle asks what experience would count for and against it. A believer who says evidence counts keeps it testable, and one who says nothing could count gives it no strict factual content.
      - Meaning as use looks at where the sentence is said and what counts as misuse, and checks by observing the practice, not by comparing with an arrangement.

      **What stays open.** Which premise you hold, that meaning comes from what a sentence says about the world or from what it does in a life, decides which reading looks natural, and thoughtful people hold each.

      **Next:** a round of traps on religious language: common mistakes about literal and figurative speech, myth, ritual, interpretation and translation, each built on a misconception that tempts.
