id: ch22-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: a sentence in a religious tradition, such as "God is love", "the Lord is my rock" or "I baptize you", and the question of what kind of speech it is and how it can be understood. Each view below is told *according to* its thinker; none is declared the winner.
  - **Sense and reference** (Frege, 1892). An expression has a reference (the thing it picks out) and a sense (the way it presents it): "the morning star" and "the evening star" share one reference, Venus, but differ in sense.
    {{ $$\begin{gathered}\text{expression}\xrightarrow{\text{expresses}}\text{sense}\\ \text{sense}\xrightarrow{\text{fixes}}\text{reference}\end{gathered}$$ }}
  - **Claim or not.** Cognitivism says a religious sentence $s$ is true or false. The verification principle (Ayer, 1936) says a factual $s$ is meaningful only if some possible experience could count for or against it; objections: it is not itself verifiable, it fails for scientific laws, and weakened versions let almost anything through. Non-cognitive views (Braithwaite: intention plus stories; Phillips: a language game) deny that $s$ is a report.
  - **Speaking of God** (Aquinas; Pseudo-Dionysius). Let $G$ be God and $F$ a word such as "good". Said univocally, $F$ makes God a bigger creature; said equivocally, it says nothing; Aquinas holds it is said analogically, in related senses. Pseudo-Dionysius adds a path:
    {{ $$\text{G is } F\ \to\ \text{G is not } F\ \to\ \text{G is over-}F$$ }}
  - **Metaphor and symbol.** Ramsey: a model with a qualifier points to a disclosure. Tillich: a sign only points, a symbol also participates in what it points to. Ricoeur: a metaphor is a statement whose literal reading clashes, forcing a new sense.
    {{ $$\begin{gathered}\text{model}+\text{qualifier}\\ \leadsto\ \text{pointer to a disclosure}\end{gathered}$$ }}
  - **Myth and ritual.** A myth is a traditional sacred story. Eliade: it returns the hearer to a sacred origin. Campbell: a hero pattern of departure, initiation, return. Lévi-Strauss: opposites softened by a mediator. Bultmann: interpret the picture for human existence. Austin: a constative is true or false, a performative is happy or unhappy; it misfires when the act fails (no authority, wrong formula) and is an abuse when done insincerely.
    {{ $$\begin{gathered}\text{constative}\to\text{true or false}\\ \text{performative}\to\text{happy or unhappy}\end{gathered}$$ }}
  - **Reading and translating.** Philo and Origen read beyond the plain sense; midrash and tafsir are Jewish and Muslim traditions of explanation; Gadamer's circle says whole and parts are understood through each other, with the reader's prejudgments revised by the text. Nida separates formal equivalence (match the words) from dynamic equivalence (match the effect). Strong Sapir-Whorf says language fixes thought; the weak form says it nudges habits of thought, and the evidence supports at most the weak form.
    {{ $$\begin{gathered}\text{formal}:\ \text{match the words}\\ \text{dynamic}:\ \text{match the effect}\end{gathered}$$ }}
  - **Three layers.** Established: who wrote what, and when. Debated: which reading fits which sentence. Faith: whether the sentences describe how things are; each tradition answers for itself.

cards:
  - type: text
    id: welcome
    title: "Quick recall: language and religious language"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: **sense and reference**, **verification and the claim question**, **analogy and negation**, **metaphor, symbol and model**, **myth**, **ritual as action**, **ways of interpreting a text**, and **translation with Sapir-Whorf**.

      Three kinds of card: **mnemonics and distinctions**, **build cards** for the main schemas, and **applied cards that give you sentences only**: you choose the family yourself. Guessing is fine: a wrong guess is shown with its reason. Views are told *according to* their thinkers, none declared the winner.

  - type: mcq
    id: sense-ref
    title: "Same planet, two senses"
    prompt: |
      Gottlob Frege (1892) asked why "the morning star is the evening star" tells us something, while "the morning star is the morning star" does not, though both names pick out the planet Venus. What is his answer?
    options:
      - text: 'The two expressions have the same reference (Venus) but different senses, different ways of presenting it.'
        correct: true
      - text: 'The two expressions refer to two different planets until astronomers show otherwise.'
        feedback: |
          Both names pick out Venus all along. What astronomers discovered is that two presentations lead to one object.
      - text: 'Names have no meaning beyond the object they stand for, so the first sentence is empty too.'
        feedback: |
          That is the view Frege argued against. If meaning were only the object, both sentences would say the same trivial thing.
    shuffle: false
    hint: 'Ask what could differ between two names if the object is the same.'
    explanation: |
      Mnemonic: **sense fixes reference, many senses can share one reference**. The sense is the way the object is given to us.

  - type: mcq
    id: verification
    title: "Three objections to verification"
    prompt: |
      The verification principle (Ayer, 1936) says a sentence that states a fact has literal meaning only if some possible experience could count for or against it. Which are the three standard objections to its strict form? Select all that apply.
    multiple: true
    options:
      - text: 'The principle is not itself verifiable by experience, nor true by definition.'
        correct: true
      - text: 'Laws such as "all copper conducts electricity" cannot be conclusively verified by finitely many observations.'
        correct: true
      - text: 'Weakened versions, loose enough to save science, let almost any sentence through.'
        correct: true
      - text: 'Experience can never count for or against anything, so no sentence is meaningful.'
        feedback: |
          That is not an objection offered by its critics. They accept that experience bears on many sentences and attack the principle's strict form.
    hint: 'One is about the principle applied to itself, one about scientific laws, one about repairs.'
    explanation: |
      Mnemonic: **itself, laws, loopholes**. These objections concern the strict form; liberal versions were held by others, such as Carnap.

  - type: mcq
    id: who-is-who
    title: "Claim or not"
    prompt: |
      Take a believer's sentence "God loves us". Which pairing of view and thinker is right?
    options:
      - text: 'Face value (a true-or-false claim): cognitivism. Intention plus stories: Braithwaite. Own language game: Phillips.'
        correct: true
      - text: 'Face value: Braithwaite. Intention plus stories: cognitivism. Own language game: Ayer.'
        feedback: |
          Braithwaite (1955) is a non-cognitivist: for him the sentence declares an intention to follow a way of life. Ayer applied verification and judged "God exists" neither true nor false, which is a different view from Phillips's.
      - text: 'Flew held that the sentence is a *blik*, a basic outlook that is not an assertion.'
        feedback: |
          *Blik* is Hare's reply to Flew. Flew argued that if nothing could count against a sentence, it asserts nothing; Mitchell and Hick replied differently.
    shuffle: false
    hint: 'Cognitivism takes the sentence at face value; the others say it does another job.'
    explanation: |
      Mnemonic: **claim, policy, game**. Flew challenged the claim reading; Hare, Mitchell and Hick replied; Braithwaite and Phillips offered non-cognitive readings.

  - type: mcq
    id: three-uses
    title: "Univocal, equivocal, analogical"
    prompt: |
      In Aquinas's account, "healthy" is said of an animal, of a medicine that causes its health and of urine that signals it. Which kind of use is this, and what would the other two make of "God is good"?
    options:
      - text: 'Analogical: related senses tied to one primary case. Univocal would make God a bigger creature; equivocal would say nothing we can grasp.'
        correct: true
      - text: 'Equivocal: the three uses share only a word. "God is good" would then be true in the same way as "the animal is healthy".'
        feedback: |
          The senses are related by their link to the animal's health, so this is not mere sharing of a word. And if the senses were the same, that would be the univocal use.
      - text: 'Univocal: "healthy" means exactly the same in all three, so "God is good" says what it says of any good person.'
        feedback: |
          A medicine is not healthy in the way an animal is. The sense changes while staying related, which is what makes the use analogical.
    shuffle: false
    hint: 'Same sense, unrelated senses, or related senses.'
    explanation: |
      Mnemonic: **same, unrelated, related**. Told according to Aquinas (Summa Theologiae I, q. 13, a. 5).

  - type: build
    id: path-build
    title: "Affirm, deny, go beyond"
    prompt: |
      Let $G$ be God and $F$ a word such as "good". According to Pseudo-Dionysius, speech about God passes through three stages. Build them in order.
    prefix: ''
    tiles: ['G\text{ is }F', 'G\text{ is not }F', 'G\text{ is over-}F', '\to', '\to']
    answers:
      - ['G\text{ is }F', '\to', 'G\text{ is not }F', '\to', 'G\text{ is over-}F']
    wrong:
      - answer: ['G\text{ is not }F', '\to', 'G\text{ is }F', '\to', 'G\text{ is over-}F']
        feedback: |
          The path begins by affirming the name, then denies it because God exceeds it, and only then goes beyond both. Starting with denial skips the affirmation that gives the denial something to deny.
    hint: 'The last stage is neither plain yes nor plain no.'
    explanation: |
      Mnemonic: **yes, no, beyond**. Maimonides took a different route, using only denials, each one bringing the reader nearer.

  - type: build
    id: ramsey-build
    title: "Model plus qualifier"
    prompt: |
      According to Ian Ramsey, religious talk takes a model from ordinary life, such as "cause" or "wise", and adds a qualifier such as "infinitely". Build what the pair does, using the word "pointer" for the result.
    prefix: '\text{pointer}=\ '
    tiles: ['\text{model}', '\text{qualifier}', '+', '\times']
    answers:
      - ['\text{model}', '+', '\text{qualifier}']
      - ['\text{qualifier}', '+', '\text{model}']
    wrong:
      - answer: ['\text{model}']
        feedback: |
          A model alone would be read as ordinary description. The qualifier is what keeps it from being taken that way.
    hint: 'Both ingredients, joined by the plus sign.'
    explanation: |
      Mnemonic: **model plus qualifier points to a disclosure**, a moment when "the penny drops". The sign $\times$ is a distractor: nothing here is multiplied.

  - type: mcq
    id: sign-symbol
    title: "Sign, symbol, tension"
    prompt: |
      A national flag points to a nation and also takes part in its power: people treat harm to the flag as harm to the nation. A road sign only points to a town. Which pair of thinkers' ideas fits what the flag does and what a metaphor "God is my rock" does?
    options:
      - text: 'Tillich: the flag is a symbol, which participates in what it points to. Ricoeur: the metaphor is a statement whose literal reading clashes, forcing a new sense.'
        correct: true
      - text: 'Ricoeur: the flag is a symbol. Tillich: the metaphor is a word replaced by its literal paraphrase.'
        feedback: |
          Mixed up. Tillich wrote on sign and symbol; Ricoeur on metaphor as a statement with tension between identity and difference, which is not a disguised paraphrase.
      - text: 'Both are signs: they only point, and a symbol is the same as a sign.'
        feedback: |
          Tillich's point is that a symbol does more than point: it participates. A road sign is a sign; a flag is a symbol.
    shuffle: false
    hint: 'One names participation, the other names a clash between literal and new sense.'
    explanation: |
      Mnemonic: **symbol takes part, metaphor clashes**. McFague adds that one model taken literally hardens into an idol, so many models correct one another.

  - type: mcq
    id: myth-thinkers
    title: "What is a myth for"
    prompt: |
      Here a *myth* is a traditional sacred story, with no verdict on whether it is true. Match each thinker to the idea: Eliade, Campbell, Lévi-Strauss, Bultmann.
    options:
      - text: 'Eliade: returns the hearer to a sacred origin. Campbell: departure, initiation, return. Lévi-Strauss: opposites softened by a mediator. Bultmann: interpret the picture for human existence.'
        correct: true
      - text: 'Eliade: opposites softened by a mediator. Campbell: returns the hearer to a sacred origin. Lévi-Strauss: departure, initiation, return. Bultmann: remove the picture and keep the facts.'
        feedback: |
          Scrambled. The mediator belongs to Lévi-Strauss's structural reading, the three-step hero path to Campbell. Bultmann kept the message and interpreted the picture; he did not throw it out as false history to be deleted.
      - text: 'All four held that a myth is a false story that people should discard.'
        feedback: |
          Everyday speech uses "myth" for a false belief; these scholars use it for a traditional sacred story and ask what it does. Bultmann even says to keep the message.
    shuffle: false
    hint: 'Origin, a three-step hero path, opposites with a mediator, and a message in picture-language.'
    explanation: |
      Mnemonic: **origin, path, opposites, message**. Critics: Campbell chose stories that fit his pattern; whether Lévi-Strauss's structure is in the stories or in the scholar is debated.

  - type: mcq
    id: austin
    title: "Misfire or abuse"
    prompt: |
      In J. L. Austin's account, a performative is "happy" or "unhappy" rather than true or false. A man with no authority pronounces two people married. Separately, a couple go through a wedding they privately intend to break the next day. Which is which?
    options:
      - text: 'The first is a misfire (the act fails to come off); the second is an abuse (the act is done, but insincerely).'
        correct: true
      - text: 'The first is an abuse; the second is a misfire.'
        feedback: |
          Reversed. A speaker with no authority cannot perform the act at all, so it misfires. Insincere participants do perform it, and abuse it.
      - text: 'Both are false statements about marriage.'
        feedback: |
          They are not statements at all. Saying "I now pronounce you married" does something; it is judged happy or unhappy, not true or false.
    shuffle: false
    hint: 'Ask whether the act was done at all in each case.'
    explanation: |
      Mnemonic: **misfire = not done, abuse = done insincerely**. Whether a blessing has an effect beyond its human effects is a faith claim, not part of Austin's analysis.

  - type: mcq
    id: reading
    title: "Ways of reading a text"
    prompt: |
      Match the reader or tradition to the idea: Philo, Origen, midrash and tafsir, Gadamer.
    options:
      - text: 'Philo: allegory where the plain sense is problematic. Origen: body, soul, spirit. Midrash and tafsir: traditions of probing and explaining a sacred text. Gadamer: whole and parts, with the reader fusing horizons with the text.'
        correct: true
      - text: 'Philo: the plain sense only. Origen: author intention only. Midrash: tafsir. Gadamer: remove all prejudgments first.'
        feedback: |
          Philo kept the literal law while also reading allegorically. Gadamer argued that prejudgments cannot be removed first: they open the text and are revised by it, which is the circle.
      - text: 'All four held that a text has one meaning, the author intended one.'
        feedback: |
          Origen's three senses and midrash's openness to many readings count against that. Spinoza's historical method is the one that aims at the author's meaning.
    shuffle: false
    hint: 'One hides allegory behind a problem, one counts three senses, two are traditions, one is a circle.'
    explanation: |
      Mnemonic: **allegory, three senses, traditions, circle**. Whether the author's meaning is the only target is debated.

  - type: mcq
    id: whorf
    title: "Strong and weak"
    prompt: |
      Sapir-Whorf is a later label for the idea that the language we speak shapes how we think. Which pair describes its two forms and what the evidence supports?
    options:
      - text: 'Strong: language fixes thought. Weak: language nudges habits of attention and memory. Findings, such as the Guugu Yimithirr compass terms, support at most the weak form.'
        correct: true
      - text: 'Strong: language nudges thought. Weak: language fixes thought. The strong form is well confirmed.'
        feedback: |
          Reversed. The strong form is determinism; speakers of different languages can still understand each other and learn new terms, which is hard to square with it.
      - text: 'Whorf showed that the Hopi language has no concept of time, which settled the strong form.'
        feedback: |
          That claim was answered by Malotki in 1983, and relativists replied that Whorf meant a different conception rather than none. It did not settle the strong form.
    shuffle: false
    hint: 'Fixes versus nudges.'
    explanation: |
      Mnemonic: **fixes, nudges**. The colour-term result for Russian speakers was weaker in a 2020 re-test.

  - type: build
    id: nida-build
    title: "Two aims of translation"
    prompt: |
      Eugene Nida (1964) separated two aims in translating a sacred text. Build the line that says what each one matches.
    prefix: '\text{formal}:\ '
    suffix: ''
    tiles: ['\text{the words}', '\text{the effect}', '\text{the sound}']
    answers:
      - ['\text{the words}']
    wrong:
      - answer: ['\text{the effect}']
        feedback: |
          Matching the effect on the reader is the dynamic aim. Formal equivalence follows the source's form and content, element by element.
    hint: 'The other line would read "dynamic: match the effect".'
    explanation: |
      Mnemonic: **formal = match the words, dynamic = match the effect**. Luther's *allein* in Romans 3:28 leans dynamic.

  - type: mcq
    id: apply-act
    title: "Which sentence does something?"
    prompt: |
      Four sentences are spoken in a congregation:
      (A) "The church was built in 1830."
      (B) "I promise to care for you."
      (C) "The Lord is my rock."
      (D) "Once there was a flood that covered the whole world."
      Which one is best read as an act that is done in the saying, and so can misfire or be an abuse rather than be true or false?
    options:
      - text: '(B)'
        correct: true
      - text: '(A)'
        feedback: |
          (A) reports a date and can be checked against records, so it is true or false.
      - text: '(C)'
        feedback: |
          (C) clashes if read literally (a person is not a rock), which makes it a metaphor, a different family from an act.
      - text: '(D)'
        feedback: |
          (D) opens a traditional sacred story, so it is a myth in the scholarly sense, not an act performed by saying it.
    shuffle: false
    hint: 'Look for the sentence whose utterance is itself the deed.'
    explanation: |
      (B) is a promise: saying it is doing it. (A) is a claim, (C) a metaphor and (D) a story. Each family fails differently: a claim by being false, a metaphor by being read flatly, an act by misfiring, a story by being taken for something it does not claim to be.

  - type: mcq
    id: apply-fail
    title: "How each can go wrong"
    prompt: |
      Using the four sentences (A) "The church was built in 1830", (B) "I promise to care for you", (C) "The Lord is my rock", (D) "Once there was a flood that covered the whole world", which pairing of sentence and way to go wrong is best?
    options:
      - text: '(A) turns out false; (B) is said by someone who does not mean it; (C) is read as if the Lord were stone; (D) is taken as a news report of a single dated event.'
        correct: true
      - text: '(A) misfires for lack of authority; (B) is shown false by records.'
        feedback: |
          Reversed. A dated report is checked against records. A promise cannot be falsified by records; it can be insincere (abuse) or made without standing (misfire).
      - text: '(C) is made false by finding no rock named in the text.'
        feedback: |
          The sentence is not about a mineral, so searching for one misses it. The failure is reading it flatly, which loses the clash that forces a new sense.
      - text: '(D) can only go wrong by being true.'
        feedback: |
          A story is judged by what it does for its tellers as well as by what happened. Whether it records history is a separate question each tradition answers for itself.
    shuffle: false
    hint: 'Each sentence belongs to a family with its own typical failure.'
    explanation: |
      Four families, four failures. The classification of these sentences is ours, as an exercise; how a given tradition reads its own sentence is for that tradition to say.

  - type: numeric
    id: count-claims
    title: "How many can be true or false?"
    prompt: |
      A list has six sentences: (1) "The Qur'an was recited in Arabic." (2) "I name this ship Hope." (3) "The scroll has five books." (4) "I bless you in this name." (5) "Light is wave and particle." (6) "I promise to come on Friday." Treating each as the speaker's own sentence, how many are the kind that is judged true or false rather than happy or unhappy?
    answer: 3
    tolerance: 0.01
    answerText: '3'
    wrong:
      - { value: 6, feedback: 'That treats every sentence as a description. Naming, blessing and promising do something in the saying.' }
      - { value: 2, feedback: 'Recount: three of them describe how things are or were, and can be checked.' }
    hint: 'Sort each sentence into those that describe and those that do something by being said.'
    explanation: |
      (1), (3) and (5) describe and can be checked. (2), (4) and (6) are naming, blessing and promising, which are done in the saying and are happy or unhappy. Whether a blessing also has an effect beyond its human effects is a commitment of faith, not part of this sorting.

  - type: mcq
    id: layers
    title: "Sort the claims"
    prompt: |
      Mark every claim that is a **debate among scholars**, not an established fact and not a faith commitment.
    multiple: true
    options:
      - text: 'Whether religious sentences are best read as claims, expressions or acts.'
        correct: true
      - text: 'Whether the patterns Campbell found in hero stories lie in the stories or in his selection.'
        correct: true
      - text: 'Austin published the lectures as a book in 1962, after his death.'
        feedback: |
          A date of publication is established fact, from the record.
      - text: 'The sacred language of a tradition is the only one in which God can be addressed.'
        feedback: |
          That is a commitment of faith (or its denial), not a weighing of evidence among scholars.
    hint: 'Dates are layer 1, how to read them is layer 2, claims about God are layer 3.'
    explanation: |
      Mnemonic: **record, reading, commitment**. Passing a faith claim off as fact, or a fact off as faith, is the slip the course keeps warning about, in either direction.

  - type: text
    id: summary
    body: |
      **Next:** the content map of this level, where you rebuild, box by box, how sense and reference, verification, analogy, metaphor, myth, ritual, interpretation and translation fit together as ways of asking what religious language is for.
