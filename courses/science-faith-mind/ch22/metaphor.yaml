id: ch22-metaphor
title: "Metaphor, Symbol and Model"
kind: concept
own: |
  The setting: $G$ (written G in the displayed lines) is God as a tradition conceives God, and $S$ is an image from ordinary life, such as shepherd, rock or mother, used in a sentence "$G$ is $S$". The question is whether such a sentence can be true, and what kind of speech it is. Four answers, each *according to* its thinker.
  - **Ramsey** (Ian Ramsey, 1915 to 1972, *Religious Language*, 1957). Religious talk uses models taken from ordinary experience, each fitted with a qualifier such as "infinitely" that stops it being read as ordinary description. A model is anchored in a disclosure, a moment when "the penny drops":
    {{ $$\begin{gathered}\text{model}+\text{qualifier}\\ \leadsto\ \text{pointer to a disclosure}\end{gathered}$$ }}
  - **Tillich** (Paul Tillich, 1886 to 1965, *Dynamics of Faith*, 1957). A sign only points to something else, while a symbol points beyond itself and also participates in the power of what it points to, like a flag for a nation. Taken literally, a symbol of God becomes an idol:
    {{ $$\begin{gathered}\text{sign: points to}\\ \text{symbol: points to}\ +\ \text{participates in}\end{gathered}$$ }}
  - **Ricoeur** (Paul Ricoeur, 1913 to 2005, *The Rule of Metaphor*, 1975). A metaphor is a statement, not a single word: read literally it clashes, and the clash forces a new sense, so identity and difference are held together:
    {{ $$\begin{gathered}\text{G is } S\ \Rightarrow\ \text{literal reading clashes}\\ \Rightarrow\ \text{new sense}\end{gathered}$$ }}
  - **McFague** (Sallie McFague, 1933 to 2019, *Models of God*, 1987). A model is an extended metaphor, and no single one should be taken as literal; a literal reading hardens it into an idol, so she proposes many models, such as mother, lover and friend, which correct one another:
    {{ $$\begin{gathered}\text{one model, taken literally}\ \to\ \text{idol}\\ \text{many models}\ \to\ \text{each corrects the others}\end{gathered}$$ }}
  - **Three layers.** Fact: who wrote what and when. Debate: whether a metaphor can be literally true, whether it can be paraphrased into literal speech, and whether a model describes God or only our way of speaking of God. Commitment: whether God is as the traditions say; each tradition answers for itself.

cards:
  - type: text
    id: hook
    title: "Is the shepherd psalm literal?"
    body: |
      The opening line of Psalm 23 in the King James Version reads, "The LORD is my shepherd; I shall not want." Millions have recited it. Yet no one thinks God carries a crook and counts sheep. Is the sentence then false? Is it true in some other way? Or is it a pretty decoration over a plain claim that could be said without the shepherd?

      Before any theory, a guess. Guessing first is the point, and each view below is told *according to* its thinker; nothing asks you to believe or doubt anything religious.

  - type: mcq
    id: guess
    title: "Guess: what does the sentence do?"
    prompt: |
      A reader says, "The Lord is my shepherd" is clearly not literal. Which of these is the most natural thing for the sentence to be doing?
    options:
      - text: "Describing God by a comparison that carries some features (care, guidance, protection) and drops others (wool, a crook)."
        correct: true
        feedback: |
          Yes. This is the ordinary working of a metaphor, and every thinker below starts from it, then asks how far such speech can be true.
      - text: "Stating a literal fact about a man with sheep."
        feedback: |
          The speaker is not claiming that God keeps a flock. A literal reading fails at once, which is the clue that something else is going on.
      - text: "Saying nothing, because a false literal sentence cannot mean anything."
        feedback: |
          Readers understand the line at once. A sentence can be false when read literally and still say something.
      - text: "Giving an order to the listener."
        feedback: |
          The grammar is a plain statement, not a command.
    explanation: |
      The puzzle is already visible. The sentence is understood, yet its literal reading is wrong. What then is understood?

  - type: text
    id: recall
    title: "Recall: analogy and negation"
    body: |
      From the lesson Analogy, Negation and Apophatic Speech: Thomas Aquinas (c. 1225 to 1274) held that a word like "good" is said of God neither in the same sense as of creatures (univocally) nor in an unrelated sense (equivocally) but analogically, in related senses. Maimonides (1138 or 1135 to 1204) urged saying what God is not, and Pseudo-Dionysius (writing c. 500) affirmed, denied and then went beyond both. All of them speak of God using words learned from creatures. This lesson meets the same worry in a more everyday form: images such as shepherd, rock and king, and the models built from them.

  - type: text
    id: divide
    title: "Literal and metaphorical"
    body: |
      A sentence is **literal** if its words are taken in their ordinary, established senses: "the sheep are in the field". It is **metaphorical** if it speaks of one thing in terms of another, so that a literal reading is false or odd: "the Lord is my shepherd". One may ask whether the metaphor is merely a pleasant way of saying something that could be said literally (a *paraphrase*), or whether it says something that has no literal equivalent.

      The same divide matters outside religion. Scientists speak of the "flow" of current, the "wave" of a particle and the "selfish" gene, all words carried over from elsewhere. So the question "can a metaphor be literally true?" has two readings. If "literally true" means the words are used in their ordinary senses, then by definition a metaphor is not. If it means the sentence is a true description of how things are, a metaphor might still be true, and that is what the thinkers below dispute.

  - type: mcq
    id: divide-q
    title: "Which sentence is metaphorical?"
    prompt: |
      Which of these is a metaphorical sentence in the sense just defined?
    options:
      - text: "God is a rock."
        correct: true
        feedback: |
          Yes. Read in ordinary senses it is false (God is not a piece of stone), and it works by carrying over features such as stability and shelter.
      - text: "The Psalm was composed in Hebrew."
        feedback: |
          Every word here has its ordinary sense, so it is a literal claim about history.
      - text: "A shepherd looks after sheep."
        feedback: |
          Literal. It is about actual shepherds.
      - text: "The flock is hungry."
        feedback: |
          Literal when said of actual sheep.
    explanation: |
      The test is whether taking the words in their ordinary senses makes the sentence false or odd while the sentence is still understood.

  - type: text
    id: ramsey
    title: "Ramsey: models and qualifiers"
    body: |
      **Ian Ramsey** (1915 to 1972) was an English philosopher and theologian who taught divinity and later became Bishop of Durham. In *Religious Language* (1957) he argued, in essence, that religious talk uses **models** taken from ordinary experience, and that these models carry **qualifiers** that keep them from being read as ordinary description. In "infinitely wise" or "first cause", the qualifier (infinitely, first) is what makes the word odd on purpose.

      Why bother with the model? According to Ramsey, because the model is tied to a **disclosure**, a moment when something dawns on a person, the "penny drops". Ramsey's own example: "first cause" does not say that God is one more cause among causes. The qualifier "first" marks God as prior to all causes, not as the earliest link in a causal chain, as "proximate" or "remote" would.

  - type: text
    id: science-model
    title: "Models in science, and what they do not claim"
    body: |
      Ramsey drew his idea partly from science, where models are everywhere. A common model of a gas treats its molecules as tiny elastic balls bouncing in a box. It predicts pressure and temperature well, yet nobody holds that molecules are literally balls: they have no colour and no surface to scratch. A scientist uses the model while knowing where it stops, and replaces it when another does better.

      Ramsey's suggestion is that religious models behave in a similar way: they are used, qualified and tested against what they help us see. Whether the parallel is close is itself disputed. A critic replies that a gas model is tested by measurement, while a religious model has no such test (layer 2).

  - type: mcq
    id: ramsey-q
    title: "What does the qualifier do?"
    prompt: |
      According to Ramsey, what is the job of a qualifier such as "infinitely" in "infinitely wise"?
    options:
      - text: "It marks the word as a model that must not be read as ordinary description, so the odd phrase points beyond it."
        correct: true
        feedback: |
          Yes. The qualifier is deliberately odd, and the oddness is the signal that the phrase is not to be heard as plain description.
      - text: "It makes the sentence literally true in ordinary senses."
        feedback: |
          The qualifier is there because the ordinary sense does not fit. It does not restore it.
      - text: "It shows that the speaker is unsure."
        feedback: |
          A qualifier here is not hedging. It is part of how the model is meant to work.
      - text: "It reports a measurement."
        feedback: |
          Ramsey's qualified models are tied to disclosures, not to laboratory readings.
    explanation: |
      Model plus qualifier gives a phrase that is understood from ordinary life and yet is not ordinary description.

  - type: text
    id: tillich
    title: "Tillich: signs and symbols"
    body: |
      **Paul Tillich** (1886 to 1965), a German-American theologian, wrote in *Dynamics of Faith* (1957) that the language of faith is the language of symbols. He separates a **sign** from a **symbol**. Both point beyond themselves to something else. The difference, in his words, is decisive: signs do not participate in the reality of what they point to, while symbols do.

      A red light points to "stop" but shares nothing of the road's danger, and could be swapped for a blue one. A flag, Tillich says, participates in the power and dignity of the nation it stands for, which is why burning one carries weight. According to Tillich, whatever we say about what concerns us ultimately has symbolic meaning, and God is the fundamental symbol for it. He adds that a symbol taken literally makes faith idolatrous, since it treats God as a being acting in time and space.

      In his *Systematic Theology*, Tillich also notes a puzzle: the claim that everything said about God is symbolic is itself not a symbolic assertion. Scholars debate what follows from this (layer 2).

  - type: mcq
    id: tillich-q
    title: "Sign or symbol?"
    prompt: |
      Using Tillich's distinction, which pair is correct?
    options:
      - text: "A traffic light is a sign; a national flag is a symbol."
        correct: true
        feedback: |
          Yes. The light could be replaced by any convention, while the flag shares in what the nation means to its people.
      - text: "A traffic light is a symbol; a national flag is a sign."
        feedback: |
          Reversed. Participation is the test, and a traffic light has none.
      - text: "Both are signs, since both point to something."
        feedback: |
          Pointing is shared. What separates a symbol is that it also participates in what it points to.
      - text: "Both are symbols, since both are used by many people."
        feedback: |
          Many people using a thing does not make it participate in what it points to.
    explanation: |
      Pointing is common to both. Participation is what Tillich adds for symbols.

  - type: text
    id: ricoeur
    title: "Ricoeur: the metaphor as an event"
    image:
      src: img/ricoeur.webp
      alt: Colour portrait of an elderly Paul Ricoeur, a white-haired man with glasses in a grey jacket and tie
      caption: Paul Ricoeur (1913 to 2005), French philosopher, argued that a metaphor is a statement whose literal clash forces a new meaning into being.
      credit: "Juerg Mueller / Scanpix., CC0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Paul_Ricoeur_Balzan.png"
    body: |
      **Paul Ricoeur** (1913 to 2005), a French philosopher, set out his theory in *The Rule of Metaphor* (French original 1975). The older, dictionary view treats a metaphor as a word with a borrowed meaning, a mere ornament. According to Ricoeur, the unit is the **statement**, not the word, and the metaphorical meaning is nothing one finds in a dictionary: it is an event of meaning produced when the sentence is read.

      The mechanism is a tension. Read literally, "the Lord is my shepherd" clashes, since God is not a herdsman. The clash is not a failure but the trigger: the reader is pushed to search for a sense in which the sentence works, and a new meaning appears. The statement thereby holds identity ("is") and difference ("is not") together, a tension between identity and difference, as commentators put it. In essence, he held this is not a decoration over a literal claim; the metaphor opens a way of seeing that no literal paraphrase supplies.

  - type: mcq
    id: ricoeur-q
    title: "Why does the literal clash matter?"
    prompt: |
      According to Ricoeur, what role does the failure of the literal reading play in understanding a metaphor?
    options:
      - text: "It is the trigger: the clash pushes the reader to find a new sense in which the statement works."
        correct: true
        feedback: |
          Yes. The tension is not an error to be removed but the engine of the new meaning.
      - text: "It shows the sentence is meaningless and should be dropped."
        feedback: |
          The sentence is understood because of the clash, not in spite of it.
      - text: "It shows the metaphor is a hidden literal claim to be spelled out."
        feedback: |
          That is the paraphrase view, which Ricoeur rejects in favour of an event of meaning with no exact literal translation.
      - text: "It shows the word 'shepherd' has changed its dictionary entry."
        feedback: |
          Ricoeur says the metaphorical meaning is nothing found in a dictionary.
    explanation: |
      For Ricoeur, a living metaphor is an event in a sentence. Whether this event can be called true is the next question, and it is answered in different ways.

  - type: text
    id: mcfague
    title: "McFague: many models, none literal"
    image:
      src: img/mcfague.webp
      alt: Portrait photograph of Sallie McFague, a woman with short hair, taken in 1975
      caption: Sallie McFague (1933 to 2019), an American theologian, argued that models of God are extended metaphors, so no single one should be taken as literal.
      credit: "Vanderbilt University staff photographer, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Sallie-mcfague-1975.jpg"
    body: |
      **Sallie McFague** (1933 to 2019), an American Christian theologian who taught at Vanderbilt, wrote *Speaking in Parables* (1975), *Metaphorical Theology* (1982) and *Models of God* (1987). According to her, metaphor is a way of knowing, not just a way of communicating, and there is no way around it: we cannot get at the subject directly. A **model** is a systematic, extended and relatively permanent metaphor. "God the king" and "God the father" are models that grew from metaphors.

      Her warning is about literalism. When a model is taken as literal, it becomes an idol: one image is mistaken for God. Her proposal is a plurality of models that correct one another. In *Models of God* she develops God as mother, as lover and as friend, within the picture of the world as God's body. Her opponents ask whether such models describe God at all, or only our changing ways of speaking, and whether she gives a believer anything to pray to (layer 2).

  - type: mcq
    id: mcfague-q
    title: "Why many models?"
    prompt: |
      According to McFague, why does theology need many models of God rather than one?
    options:
      - text: "Each model is partial, so several correct one another and none hardens into a literal idol."
        correct: true
        feedback: |
          Yes. Each model shows some features and hides others, and a plurality guards against mistaking one image for God.
      - text: "Because every model is literally true and more is better."
        feedback: |
          For McFague, no model is literal. Her point is the opposite.
      - text: "Because the oldest model, the king, has been disproved."
        feedback: |
          Her claim is about the limits of any single metaphor, not about disproof of one.
      - text: "Because models are only decoration and can be dropped."
        feedback: |
          She holds that metaphor is a way of knowing, not an ornament.
    explanation: |
      A model highlights and hides. Many models together give a fuller, self-correcting picture, which is also how scientists treat rival models.

  - type: mcq
    id: whose
    title: "Whose view is this?"
    prompt: |
      "A symbol shares in the reality of what it points to; a sign does not, and a symbol taken literally turns into an idol." Which thinker held this view?
    options:
      - text: "Tillich."
        correct: true
        feedback: |
          Yes: participation is Tillich's mark of a symbol, and literalism is, for him, idolatry.
      - text: "Ramsey."
        feedback: |
          Ramsey's key terms are model, qualifier and disclosure, not participation.
      - text: "Ricoeur."
        feedback: |
          Ricoeur stresses the tension of the metaphorical statement, not a symbol's participation.
      - text: "McFague."
        feedback: |
          McFague also warns about idolatry, but the contrast of sign and symbol with participation is Tillich's, and she draws on that tradition.
    explanation: |
      Several thinkers share the worry about literalism. Each gets there by a different road: qualifiers, participation, tension, plurality of models.

  - type: build
    id: ricoeur-build
    title: "State the movement of a metaphor"
    prompt: |
      According to Ricoeur, put the movement in order, with $G$ God and $S$ an image such as shepherd.
    prefix: ''
    suffix: ''
    tiles: ['\text{G is S}', '\to', '\to', '\text{literal reading clashes}', '\text{new sense}']
    answers:
      - ['\text{G is S}', '\to', '\text{literal reading clashes}', '\to', '\text{new sense}']
    wrong:
      - answer: ['\text{G is S}', '\to', '\text{new sense}', '\to', '\text{literal reading clashes}']
        feedback: |
          The new sense comes out of the clash, so it cannot come before it. Without the tension there is nothing to push the reader to look further.
      - answer: ['\text{literal reading clashes}', '\to', '\text{G is S}', '\to', '\text{new sense}']
        feedback: |
          The statement comes first. The clash is what happens when the statement is read literally.
    explanation: |
      Statement, clash, new sense. The clash is the engine of the metaphor, not a defect to be repaired.

  - type: mcq
    id: objection
    title: "A mere figure of speech?"
    prompt: |
      A critic says: "If 'God is a shepherd' is only a metaphor, then it is not true and tells me nothing about God." Which reply is closest to one a thinker above could give?
    options:
      - text: "Ricoeur's reply: a living metaphor is a statement that creates a new meaning and has no exact literal paraphrase, so it can say something that literal speech cannot."
        correct: true
        feedback: |
          Yes. On this view the choice between literal truth and decoration is a false choice. Critics still ask what makes such a statement true or false (layer 2).
      - text: "Tillich's reply: the sentence is literally true of a heavenly shepherd."
        feedback: |
          Tillich says the opposite: taking it literally makes faith idolatrous.
      - text: "McFague's reply: the sentence is false, and so are all models."
        feedback: |
          She holds models are partial and non-literal, not false, and that metaphor is a way of knowing.
      - text: "No reply is possible, so religious language is shown to be empty."
        feedback: |
          Defenders offer replies and critics answer them. A hard question is not a proof of emptiness.
    explanation: |
      The objection assumes only literal sentences can be true. The thinkers here deny this assumption in different ways. A critic may press that without a way of testing it, "true" is too generous a word for a metaphor.

  - type: mcq
    id: layer
    title: "Layer: fact, debate or commitment"
    prompt: |
      Which of these is a **live debate among scholars**, neither a fact of record nor a faith commitment?
    options:
      - text: "Whether a metaphor can say something true that no literal sentence could say."
        correct: true
        feedback: |
          Yes. Philosophers divide on this, so it is neither a date nor an act of faith.
      - text: "Ricoeur published The Rule of Metaphor in French in 1975."
        feedback: |
          A publication date is a matter of record, so it belongs to the layer of fact.
      - text: "God is a shepherd to those who trust."
        feedback: |
          Affirming or denying this is a religious commitment.
      - text: "McFague lived from 1933 to 2019."
        feedback: |
          Again a record.
    explanation: |
      The pattern repeats: the record is who wrote what, the debate is whether metaphor, symbol or model can carry truth about God, and the commitment is each tradition's own answer.

  - type: text
    id: summary
    body: |
      **Next:** metaphors and models work by comparison. Stories go further, building whole worlds of meaning: the creation tales, the flood, the hero's journey. The next lesson, Myth, Story and Narrative Truth, asks what myths are for and whether a story can be true without being literal.
