id: ch22-ritual
title: "Ritual, Performative Speech and Liturgy"
kind: concept
own: |
  The setting: a **ritual** here is a repeated, formal pattern of acts and words, such as a wedding, a baptism or a blessing. The question is what its words do, and what scholars say rituals are for. Each view is told *according to* its thinker.
  - **Austin** (J. L. Austin, 1911 to 1960, *How to Do Things with Words*, 1962). Some sentences do not describe; saying them is doing something (naming a ship, promising, betting). A description (a **constative**) is judged true or false; such a **performative** is judged happy or unhappy (felicitous or infelicitous):
    {{ $$\text{constative}\ \to\ \text{true or false}$$ }}
    {{ $$\text{performative}\ \to\ \text{happy or unhappy}$$ }}
  - **Misfire and abuse.** A performative **misfires** when the act fails to come off (wrong formula, or the speaker lacks the authority); it is an **abuse** when the act is carried out but insincerely (a marriage entered only for convenience).
  - **Three acts in one utterance.** The **locutionary** act is saying the sentence with its sense; the **illocutionary** act is what is done in saying it (warning, promising, naming); the **perlocutionary** act is the effect produced on the hearer (frightening, persuading):
    {{ $$\text{say}\ \to\ \text{do in saying}\ \to\ \text{effect on hearer}$$ }}
  - **Scholars of ritual.** Durkheim (1858 to 1917): rites reaffirm the unity of the group. Turner (1920 to 1983): the middle, threshold phase of a rite of passage is **liminal**, and its shared equality is **communitas**. Rappaport (1926 to 1997): ritual is the performance of more or less invariant sequences of formal acts and utterances not entirely encoded by the performers. Bell: ritualization is a strategic way of acting. Staal (1930 to 2012): ritual is rule-governed activity without meaning, not a language of symbols.
  - **Three layers.** Fact: what these thinkers wrote and what the rites contain. Debate: whether ritual words are best read as acts, as symbols, or as meaningless rules. Commitment: whether a blessing or sacrament does anything beyond its human effects; each tradition answers for itself.

cards:
  - type: text
    id: hook
    title: "Words that change things"
    image:
      src: img/ship-christening.webp
      alt: Black and white photograph of a ship launching, a woman in dark clothes and uniformed officers standing at a railing beside radio microphones while a bottle breaks against the ship's bow in a burst of spray
      caption: At a launching, a sponsor breaks a bottle on the bow and the ship is named; this one is the aircraft carrier USS Shangri-La, in February 1944.
      credit: "U.S. Navy, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Christening_of_USS_Shangri-La_(CV-38)_on_24_February_1944.jpg"
    body: |
      "The sky is grey" can be checked: look up and see. Now think of "I now pronounce you married", said by an officiant at the right moment, or "I promise to be there", or "I name this ship...". Nobody checks these against the sky. Before they were said, a couple was not married and a ship had no name; after, they are.

      Before any theory, a guess. Guessing first is the point, and each view below is told *according to* its thinker; nothing asks you to believe or doubt anything religious.

  - type: mcq
    id: guess
    title: "Guess: must a sentence describe?"
    prompt: |
      A friend says: "A sentence that is not describing anything is meaningless, so 'I promise' means nothing." What is the most natural reply?
    options:
      - text: "'I promise' does not describe a promise being made, it makes one: saying it is the doing, so it can matter without being a report."
        correct: true
        feedback: |
          Yes. The friend assumes every sentence is a report. Here the saying itself is the deed, and the sentence works in a different way.
      - text: "'I promise' is secretly a description of the speaker's feelings, and it is true when the feelings are present."
        feedback: |
          This tempting reply keeps the idea that every sentence reports something. But a person can promise while feeling nothing special, and the promise still binds; and feelings alone, with no words, promise nothing.
      - text: "It means nothing, but people say it anyway out of habit."
        feedback: |
          A promise creates real expectations and obligations. Calling it meaningless leaves unexplained why breaking it is wrong.
      - text: "It is true because every promise is kept."
        feedback: |
          Promises are broken, and a broken promise was still a promise. Truth is the wrong measure here, as the next cards show.
    explanation: |
      The puzzle is already visible. Some sentences are better measured by whether they succeed as acts than by whether they are true, and ritual is full of them.

  - type: text
    id: recall
    title: "Recall: myth and rite"
    body: |
      From the lesson Myth, Story and Narrative Truth: Eliade (1907 to 1986) held that a myth tells how the **sacred** (what is set apart as holy) broke into ordinary, **profane** time at the origin, and that reciting it in a rite returns the participants to that origin, so the first act is present again. Bultmann held that a myth's picture-language should be interpreted for what it says about human existence. This lesson asks what the *words* of a rite are doing: telling, symbolising, or acting.

  - type: text
    id: austin
    title: "Austin: describing and doing"
    body: |
      J. L. Austin (1911 to 1960), an Oxford philosopher, gave the William James Lectures at Harvard in 1955. They were published after his death as *How to Do Things with Words* (1962). He began from a habit of philosophers: treating every sentence as a statement that is true or false.

      He set against it a second kind. A **constative** is an utterance that describes, and can be assessed as true or false ("the ship is large"). A **performative** is an utterance whose saying is the doing of an act: "I name this ship the *Queen Elizabeth*", "I bet you sixpence it will rain tomorrow", and the words of a marriage vow are his own examples. A performative is not true or false. It is assessed as **happy** (felicitous) or **unhappy** (infelicitous): did the act come off?

      The contrast opened a new way to ask what a sentence is for.

  - type: mcq
    id: sort
    title: "Which sentences do something?"
    prompt: |
      According to Austin, which of these sentences, said in suitable circumstances, are performatives (saying it is doing the act)? Select all that apply.
    multiple: true
    options:
      - text: "\"I bet you sixpence it will rain tomorrow.\""
        correct: true
        feedback: |
          Yes. Saying it is placing the bet; it is one of Austin's own examples.
      - text: "\"I name this ship the *Queen Elizabeth*.\""
        correct: true
        feedback: |
          Yes. Said by someone with the right role, it gives the ship its name.
      - text: "\"The ship is large.\""
        feedback: |
          This describes, so it is a constative: it is true or false depending on the ship.
      - text: "\"It rained yesterday.\""
        feedback: |
          This reports an event, so it can be true or false. Nothing is done by saying it.
    explanation: |
      A handy test of ours, not Austin's definition: could one add "hereby" ("I hereby name this ship...")? Describing sentences do not take it.

  - type: text
    id: felicity
    title: "When a performative goes wrong"
    body: |
      If a performative is not true or false, how can it fail? Austin's answer is that it fails by being *unhappy*, and he sorted the ways. A **misfire** is an attempt that does not come off: the wrong formula is used, or the speaker lacks the authority or the occasion is wrong. A passer-by who grabs a bottle and says "I name this ship..." has not named it. An **abuse** is a performance that does come off but is insincere: a marriage entered into only for convenience is still a marriage, but not an honest one.

      The conditions for success are called **felicity conditions**. In essence, they ask for an accepted procedure, the right people in the right circumstances, correct and complete execution, and the sincerity that goes with the act. Austin stressed that such acts rest on convention, a procedure that a community recognises.

  - type: mcq
    id: felicity-q
    title: "Misfire or abuse?"
    prompt: |
      Two cases. (a) A guest at a wedding, who is not the officiant, stands up and says "I pronounce you married." (b) A person says "I promise to repay you" while privately planning never to do so. According to Austin's sorting, which pairing is right?
    options:
      - text: "(a) is a misfire (the speaker lacks the authority); (b) is an abuse (the act is performed, but insincerely)."
        correct: true
        feedback: |
          Yes. In (a) no marriage is made. In (b) a promise is made and a bad one: the person is bound, and has acted in bad faith.
      - text: "(a) is an abuse; (b) is a misfire."
        feedback: |
          The labels are reversed. The guest's failure is one of procedure and authority, which is a misfire; the false promiser's failure is of sincerity, which is an abuse.
      - text: "Both are false statements."
        feedback: |
          A performative is not true or false. That is the point of the new category: (a) and (b) are unhappy, not false.
      - text: "Both are misfires, because both lead to a bad outcome."
        feedback: |
          Austin sorts by *where* it goes wrong, not by how bad the result is. (b) is a complete, successful act that is insincere.
    explanation: |
      Notice what the contrast does. One failure is that nothing happened, the other that something happened badly. Both are failures of the act, not of a description.

  - type: build
    id: build-test
    title: "Two measures"
    prompt: |
      According to Austin, a constative is assessed as true or false, and a performative as happy or unhappy. Build the line for a performative.
    prefix: '\text{performative}\ \to'
    tiles: ['\text{happy or unhappy}', '\text{true or false}', '\text{measured by size}']
    answers:
      - ['\text{happy or unhappy}']
    wrong:
      - answer: ['\text{true or false}']
        feedback: |
          That is the measure for a constative. A performative is not a report, so the question is whether the act came off.
    hint: |
      Ask what could go wrong with "I name this ship..." other than a falsehood.
    explanation: |
      The two lines are the heart of Austin's first move: a constative answers to the world, a performative is an act answering to its conditions.

  - type: text
    id: three-acts
    title: "Three acts in one utterance"
    body: |
      Austin went on to split any utterance into layers. The **locutionary act** is saying the sentence: the sounds, the grammar, the words with their sense. The **illocutionary act** is what you do *in* saying it: warning, promising, ordering, naming. The **perlocutionary act** is what you bring about *by* saying it, through its effect on the hearer's feelings, thoughts or actions: frightening, persuading, convincing.

      Take "I will be there" said to a friend. Saying it with that sense is the locutionary act; promising is the illocutionary act; reassuring the friend is the perlocutionary one. The first two are tied to convention. The third is a consequence that may or may not follow: a promise is still a promise if the friend doubts it.

  - type: mcq
    id: three-q
    title: "Which act is which?"
    prompt: |
      A lifeguard shouts "The current is dangerous!" and swimmers get out of the water. According to Austin's three acts, which pairing is right?
    options:
      - text: "Saying the words is locutionary; warning is illocutionary; making the swimmers leave the water is perlocutionary."
        correct: true
        feedback: |
          Yes. The warning is done in the shouting; the swimmers' reaction is an effect that could have failed to follow.
      - text: "Warning is locutionary; making the swimmers leave is illocutionary."
        feedback: |
          Mixed up. The locutionary act is just saying the sentence with its sense. The effect on the swimmers is perlocutionary: it is produced *by* the warning, not done *in* it.
      - text: "All three acts are the same, since they are all the lifeguard's shout."
        feedback: |
          They happen together but differ in kind: what is said, what is done in saying it, and what follows from it. The swimmers could ignore the warning, and it would still be a warning.
      - text: "The warning is perlocutionary, because it needs the swimmers to hear it."
        feedback: |
          A warning is a convention-bound act done in speaking. What the swimmers do afterwards is the perlocutionary result.
    explanation: |
      The distinction matters for ritual because the *illocutionary* act is what a vow or a blessing is, whatever the hearer feels.

  - type: text
    id: ritual-speech
    title: "Vows, blessings, naming"
    body: |
      Austin did not write a theory of religion, but his framework can be applied to ritual speech. This application is ours to test, not his claim. Take a vow, a naming at a baptism, a blessing, or the words by which a person is ordained. Each is spoken by someone in a role, at an appointed moment, using a formula that the community recognises. Those are exactly felicity conditions.

      On this reading, "I bless you" is neither true nor false. The right question is whether the blessing was happy: said by someone the tradition counts as able to bless, in the proper form and with the right intention. Adherents of a tradition would add that a happy blessing is also *effective*, that it does something beyond the human convention. Austin's categories say what the act is as speech. They do not settle the believer's further claim, and they do not refute it.

  - type: mcq
    id: ritual-q
    title: "What makes a blessing happy?"
    prompt: |
      In a tradition where only an ordained person may give a certain blessing, an unordained person recites the same words. Applying Austin's categories, what is the most careful description?
    options:
      - text: "By the tradition's own conventions the blessing misfires, because the speaker lacks the required role; whether any blessing carries a power beyond convention is a separate question of faith."
        correct: true
        feedback: |
          Yes. The felicity conditions are internal to the practice, so the verdict is relative to it, and the further metaphysical claim is left where it was.
      - text: "The blessing is false, because no one was really blessed."
        feedback: |
          A performative is not true or false. The failure is one of happiness (here, authority).
      - text: "The blessing works, since the words are the same and words are what matter."
        feedback: |
          For Austin, words alone do not make the act: the procedure and the people count too, as the passer-by naming a ship shows.
      - text: "Austin's account proves that blessings have no power."
        feedback: |
          Austin classifies the act as speech and says when it comes off. He says nothing that decides whether a blessing has effects beyond the human ones.
    explanation: |
      The same sentence, in two mouths, can be a happy act and an empty one. That is the sense in which a ritual formula is a piece of social machinery as well as a string of words.

  - type: text
    id: scholars
    title: "What scholars say rituals are"
    body: |
      Scholars of religion have offered rival accounts of ritual as a whole. Told *according to* each:

      **Émile Durkheim** (1858 to 1917), in *The Elementary Forms of the Religious Life* (1912), tied rites to **collective effervescence**, the surge of shared feeling a group has when it gathers and acts together; in his account, as one reference puts it, rituals must be repeated to reaffirm the collective unity of a society.

      **Victor Turner** (1920 to 1983), an anthropologist who worked among the Ndembu of Zambia, built on Arnold van Gennep's three-phase scheme of rites of passage (separation, margin, incorporation). He made the middle phase, the **liminal** one (from the Latin *limen*, threshold), a central idea: people are neither one status nor the other, and feel an intense equality and fellowship he called **communitas**.

      **Roy Rappaport** (1926 to 1997), in *Ritual and Religion in the Making of Humanity* (1999), defined ritual as the performance of more or less invariant sequences of formal acts and utterances not entirely encoded by the performers.

      **Catherine Bell**, in *Ritual Theory, Ritual Practice* (1992), argued that the thought-versus-action split behind many theories is a problem, and described **ritualization** as a strategic way of acting.

      **Frits Staal** (1930 to 2012), in an essay of 1979 called "The Meaninglessness of Ritual", argued from Vedic rituals that ritual is primarily activity governed by explicit rules, not a set of symbolic acts that refer to something else, and that its performers do not have symbolic meanings in mind.

  - type: mcq
    id: whose
    title: "Whose view?"
    prompt: |
      A scholar says: "Do not ask what a ritual's acts stand for. Study its rules, as one studies syntax. Its performers, on the whole, do not treat the acts as symbols of something else." Whose view is this, according to the scholars' own writings?
    options:
      - text: "Staal's: ritual is rule-governed activity without symbolic meaning."
        correct: true
        feedback: |
          Yes. He built the claim on Vedic fire rituals and what the priests said about their own practice.
      - text: "Durkheim's: ritual is a way a group reaffirms its unity."
        feedback: |
          Durkheim reads rites as meaningful for the group, in what they do for its solidarity, which is not the denial of meaning in the question.
      - text: "Turner's: ritual's middle phase is liminal and creates communitas."
        feedback: |
          Turner reads rites as rich in symbols and social meaning. The question rejects the search for meaning.
      - text: "Austin's: ritual words are performatives."
        feedback: |
          Austin's performatives do something and are not empty: saying "I name this ship..." changes the world. That is not the claim in the question.
    explanation: |
      Staal's thesis is a provocation, and it has critics who reply that absorption in a rite does not show that its participants do not find it meaningful. It also sits oddly with the performative view: if the act of vowing is a deed with a point, is it meaningless?

  - type: mcq
    id: match
    title: "Match the scholar and the idea"
    prompt: |
      Which pairing of a scholar with a main idea is correct, according to their writings?
    options:
      - text: "Turner: the liminal phase of a rite of passage and its communitas."
        correct: true
        feedback: |
          Yes. He developed the middle phase of van Gennep's scheme into a central idea.
      - text: "Rappaport: ritual words are all meaningless rules."
        feedback: |
          That is Staal's thesis. Rappaport defined ritual as a performance of more or less invariant sequences of formal acts and utterances and studied what such form accomplishes.
      - text: "Bell: ritual is the expression of collective effervescence."
        feedback: |
          That is Durkheim's idea. Bell questioned the thought-versus-action split and described ritualization as a strategy of acting.
      - text: "Durkheim: ritual is a mere repetition with no social function."
        feedback: |
          Durkheim held the opposite: that rites reaffirm the group's unity.
    explanation: |
      Notice that the accounts are not all rivals. Austin asks what the words do, Rappaport what the form is, Turner what a rite does to status and feeling, Durkheim what it does for the group, Bell how rites are a strategy of acting, and Staal whether meaning is the right question at all.

  - type: mcq
    id: objection
    title: "Does a blessing do anything?"
    prompt: |
      Objection: "Calling a blessing a performative only means it is a social convention, like a handshake. It does nothing real." Which reply is the fairest steelman of the other side, according to its defenders?
    options:
      - text: "Conventions do real things, such as binding a couple or creating a duty, and believers add that the rite also puts people in right relation to God, a claim that Austin's account neither supplies nor denies."
        correct: true
        feedback: |
          Yes. A convention's effects are real (a promise binds), and the extra claim that adherents make belongs to faith, not to speech-act theory.
      - text: "A blessing is a literal physical force, as a push is."
        feedback: |
          Hardly any tradition holds this, and it confuses the believer's claim with a physical one. Defenders usually speak of a relation, a status or a gift, not a push.
      - text: "The objection is a scientific proof that nothing happens."
        feedback: |
          The objection is an interpretation, not an experiment. It treats the act as only social, which is one reading and not a finding.
      - text: "There is nothing to say: either a blessing is a handshake or it is magic."
        feedback: |
          A false choice. A rite can be both a human convention and, in believers' eyes, more than that.
    explanation: |
      Where thoughtful people part ways is the further claim. A sceptic stops at the social facts; a believer holds that the facts are the vehicle of something more.

  - type: mcq
    id: layers
    title: "Which layer?"
    prompt: |
      Three claims. (1) Austin's 1962 book separates the happiness of a performative from the truth of a constative. (2) Whether ritual words are best read as acts or as symbols. (3) That a sacrament conveys grace. Which is the correct labelling, as fact, live debate, or commitment?
    options:
      - text: "(1) fact about what Austin argued; (2) live debate among scholars; (3) faith commitment of a tradition."
        correct: true
        feedback: |
          Yes. The first is a matter of the text, the second of rival scholarly readings, the third of belief.
      - text: "(1) debate; (2) fact; (3) debate."
        feedback: |
          What Austin argued is a matter of record. Whether ritual speech is act or symbol is exactly what scholars dispute.
      - text: "(1) fact; (2) fact; (3) fact."
        feedback: |
          Only the first is settled by the text. Scholars of ritual disagree on the second, and the third is held by adherents on faith, not shown by the study of speech.
      - text: "(1) commitment; (2) commitment; (3) commitment."
        feedback: |
          Austin's distinction is part of the record; it is not itself a matter of faith.
    explanation: |
      Keeping the layers apart is what lets a believer and a sceptic agree on (1), argue about (2), and part ways on (3) without talking past each other.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where people part ways, and why.** Austin's tools, felicity and the three acts, are neutral about whether a rite's words have effects beyond the human ones; whether they do rests on a premise about the world that belongs to faith or to its absence. Scholars differ on what the *form* of ritual is for (bond, passage, strategy, rules without meaning), and each account can be partly right. What stays open: whether a rite is best seen as speech, as symbol, or as action.

      **Next:** the lesson Interpretation: Literal, Allegorical, Historical asks how a text is read, and who decides what it means.
