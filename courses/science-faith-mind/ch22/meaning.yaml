id: ch22-meaning
title: "What Does It Mean to Mean?"
kind: concept
own: |
  The setting: a language, and a sentence $s$ such as "the cat is on the mat" or "God is love". The question is what gives $s$ a meaning. Three answers, each *according to* its thinkers, and none the last word.
  - **Sense and reference** (Gottlob Frege, 1892). An expression has a reference (the thing it picks out) and a sense (the way it presents that thing). "The morning star" and "the evening star" are two expressions with one reference, the planet Venus, and two senses, so "the morning star is the evening star" is informative:
    {{ $$\begin{gathered}\text{expression}\xrightarrow{\text{expresses}}\text{sense}\\ \text{sense}\xrightarrow{\text{fixes}}\text{reference}\end{gathered}$$ }}
  - **Pictures of facts** (early Wittgenstein, *Tractatus*, 1921). A sentence $s$ pictures a possible arrangement of things by arranging names the way the things would be arranged. According to this view:
    {{ $$\begin{aligned} s \text{ true} \iff{}& \text{pictured arrangement}\\ & \text{is the actual one}\end{aligned}$$ }}
  - **Verification** (the Vienna Circle; Ayer, 1936). Let $s$ be a sentence that states a fact (a synthetic one, not true by definition). According to the verification principle, $s$ has literal meaning only if some possible experience could count for or against it:
    {{ $$\begin{aligned} s \text{ meaningful} \iff{}& s \text{ verifiable}\\ & \text{in principle}\end{aligned}$$ }}
    The strong version, conclusive verification, is the target of three objections: the principle is not itself verifiable, laws such as "all copper conducts electricity" cannot be conclusively verified by finitely many observations, and weakened versions let almost any sentence through.
  - **Meaning as use** (late Wittgenstein, *Philosophical Investigations*, 1953). For a large class of cases:
    {{ $$\begin{aligned} \text{meaning of a word} ={}& \text{its use}\\ & \text{in the language}\end{aligned}$$ }}
    Language is a family of *language-games* (reporting, ordering, thanking, praying), each part of an activity or form of life. On this view a prayer need not be a failed report.
  - **Three layers.** Fact: who argued what, and when. Debate: whether any one theory covers all sentences, religious ones included. Commitment: whether religious speech is meant as a claim about reality, an expression, or a way of living; that is the question of the next lesson.

cards:
  - type: text
    id: hook
    title: "Two sentences that look alike"
    body: |
      Compare "the cat is on the mat" with "God is love". Both have a subject, a verb and a ring of seriousness. Both can be said sincerely. Are they the same kind of thing?

      Before any theory, a guess: what makes a string of words *mean* something at all? The cards that follow lay out three answers from the twentieth century, each told *according to* the thinkers who gave it. Guessing first is the point, and nothing here asks you to believe or doubt any religious sentence.

  - type: mcq
    id: guess
    title: "Guess: which says something?"
    prompt: |
      Three sentences: (A) "There is a cat in the next room." (B) "Colourless green ideas sleep furiously." (C) "Be kind to your neighbour." Which would most people say *states something that could be true or false*?
    options:
      - text: "Only A."
        correct: true
        feedback: |
          Yes. A says how things are, so it could be true or false. B is grammatical but has no usable content, and C is a command: it can be followed or ignored, but it is not true or false in the same way.
      - text: "A and C."
        feedback: |
          C is meaningful, but as a command. Whether commands are true or false is itself debated, and the next cards show that "meaningful" and "true or false" are not the same thing.
      - text: "A and B."
        feedback: |
          B has the shape of a statement, which is its trick: the grammar is fine, but nothing stands behind the words. Having the shape of a sentence is not enough.
      - text: "All three."
        feedback: |
          All three can be said aloud, but they do different jobs. That difference is what the theories of meaning try to explain.
    explanation: |
      Keep the guess: a statement of fact seems to be one kind of meaningful sentence, and the three theories differ on how far that kind reaches.

  - type: text
    id: frege
    title: "Frege: sense and reference"
    body: |
      The German logician Gottlob Frege (1848 to 1925) published "Über Sinn und Bedeutung" (on sense and reference) in 1892. According to his view, a name has two things attached. Its **reference** is the object it picks out. Its **sense** is the way the name presents that object, the route by which we think of it.

      His example: "the morning star" and "the evening star" both refer to the planet Venus, but they present it differently, one as the bright point seen before sunrise and the other as the one seen after sunset. If meaning were only reference, "the morning star is the evening star" would say no more than "Venus is Venus". Yet it was a discovery, not a triviality. The difference in sense explains why.

  - type: mcq
    id: frege-q
    title: "Why is it informative?"
    prompt: |
      "The morning star is the evening star" and "the morning star is the morning star" refer to the same planet on both sides. According to Frege, why does only the first teach us something?
    options:
      - text: "The two expressions refer to the same thing but present it in different ways, so learning they match is new."
        correct: true
        feedback: |
          Yes. Same reference, different sense. The second sentence repeats one way of presenting Venus and teaches nothing.
      - text: "Because the two expressions refer to different planets."
        feedback: |
          If they referred to different planets the sentence would be false. The point is that the reference is shared and the senses differ.
      - text: "Because the first sentence is false."
        feedback: |
          It is true. The puzzle is how a true identity can be informative.
      - text: "Because names have no sense, only reference."
        feedback: |
          That is the view Frege argues against: it leaves the two sentences saying the same thing, which they plainly do not.
    explanation: |
      The pair (sense, reference) is Frege's first answer to what meaning is. A rival view, shown next, looks at whole sentences and at what they depict.

  - type: text
    id: tractatus
    title: "Early Wittgenstein: sentences as pictures"
    body: |
      Ludwig Wittgenstein (1889 to 1951) gave a different answer in the *Tractatus Logico-Philosophicus* (German 1921, English 1922). According to its picture theory, a sentence represents reality the way a model or a map does: it shares a structure with what it depicts. The names in the sentence stand for objects, and the way the names are arranged says how the objects are arranged. The sentence is true if things really are that way, false if not.

      A map of a street works like this: marks stand for houses, and their layout says how the houses lie. On this view a sentence is meaningful when it pictures a possible state of affairs, whether or not it is the actual one.

  - type: order
    id: picture-order
    title: "How a picture sentence works"
    prompt: |
      According to the picture theory, put the steps that make "the cat is on the mat" true or false in order.
    steps:
      - "The names 'cat' and 'mat' stand for a particular cat and a particular mat."
      - "The sentence arranges the names so as to say the cat is on the mat."
      - "That arrangement pictures a possible arrangement of the two things."
      - "We compare the pictured arrangement with the world."
      - "The sentence is true if they match and false if they do not."
    hint: "Names first, then their arrangement, then the possible state of affairs, then the check against reality."
    explanation: |
      The sentence is a picture of a possibility, and the world decides whether the possibility is actual. This is Wittgenstein's early view in outline; he later rejected it, as a later card shows.

  - type: mcq
    id: picture-limits
    title: "What strains the picture view?"
    prompt: |
      Applied strictly, the picture view says a sentence has factual content only if it pictures some possible arrangement of things. Which sentence is hardest to fit?
    options:
      - text: "\"God is love\", if it is not meant to describe any arrangement of things we could point to."
        correct: true
        feedback: |
          Yes. There is no obvious arrangement of objects that it pictures. A defender of the picture view may conclude it has no factual content in this strict sense; a critic of the view may conclude the view is too narrow. Which reading is right is the question the lesson works toward.
      - text: "\"The cat is on the mat.\""
        feedback: |
          This is the model case: names for two things and an arrangement of them.
      - text: "\"There are three coins in the drawer.\""
        feedback: |
          This also pictures a possible arrangement of things, and it can be checked by looking.
      - text: "\"The kettle is boiling.\""
        feedback: |
          Again an arrangement of things and a state they are in, checkable at once.
    explanation: |
      The picture theory fits ordinary reports well and strains on sentences that do not seem to depict. Two replies are possible: such sentences say little, or the theory is too narrow. The next theory makes the first reply with a test.

  - type: text
    id: positivists
    title: "The verification principle"
    body: |
      In Vienna in the 1920s and 1930s a group of philosophers and scientists around Moritz Schlick (1882 to 1936) met to discuss science and logic. They became known as the Vienna Circle, and Rudolf Carnap (1891 to 1970) and Otto Neurath were among its members. According to the Stanford Encyclopedia of Philosophy, the thesis that the sense of a proposition is its method of verification came from Wittgenstein's discussions with Schlick and Friedrich Waismann around 1929 and 1930, and Schlick later called the idea an unassailable core of the movement.

      In English the idea reached a wide public through A. J. Ayer (1910 to 1989), whose *Language, Truth and Logic* appeared in 1936. According to him, a sentence that states a fact has literal meaning only if experience could in principle count for or against it. A sentence true or false by definition, such as "a triangle has three sides", is a different case: it says nothing about the world but is meaningful. This is the **verification principle**. Note that Carnap and others held more liberal versions, and not every Vienna Circle member held the crude one.

  - type: mcq
    id: apply-principle
    title: "Apply the principle"
    prompt: |
      Take the verification principle: a sentence that states a fact is meaningful only if some possible experience could count for or against it. Which of these sentences pass the test? Select all that apply.
    multiple: true
    options:
      - text: "\"There are galaxies beyond the reach of our telescopes.\""
        correct: true
        feedback: |
          It passes. We know what experience would count for it: a telescope that could see them, or a ship that could go there. Verifiable in principle does not mean verifiable today.
      - text: "\"The sample dissolves when heated to 60 degrees.\""
        correct: true
        feedback: |
          It passes at once: heat the sample and watch.
      - text: "\"God loves us.\""
        feedback: |
          According to the positivists it fails, because they see no possible experience that would count for or against it. A believer replies that the test itself is the problem, and the cards ahead say why.
      - text: "\"Ideas sleep furiously.\""
        feedback: |
          It fails: no observation would count for or against it, and the sentence is empty of content.
    explanation: |
      The first two pass because we can say what experience would count. The last two fail for the same reason. The principle does not decide whether "God loves us" is true; according to the positivists it decides whether it is a claim about the world at all.

  - type: mcq
    id: objection-self
    title: "Objection one: the test tested"
    prompt: |
      A critic applies the verification principle to itself: "A sentence that states a fact is meaningful only if verifiable in principle." Which objection does this raise?
    options:
      - text: "The principle itself is neither true by definition nor verifiable by experience, so by its own test it seems to lack meaning."
        correct: true
        feedback: |
          Yes. The Stanford account says Ayer answered by treating the principle as a definition of "meaning", which makes it true by definition but weakens its force against metaphysics: others may simply define "meaning" differently.
      - text: "The principle is false because most sentences are verifiable."
        feedback: |
          The principle is not about how many sentences pass. The objection concerns the principle's own status.
      - text: "The principle has no application to religious sentences."
        feedback: |
          It does apply to them, which is why it matters here. The objection is about its own status, not its scope.
      - text: "The principle was never defended by anyone."
        feedback: |
          Ayer and others defended versions of it; it is the crude form that was largely abandoned.
    explanation: |
      A rival view of the self-test: the principle may be a proposal about how to use the word "meaning", not a discovery. That keeps it consistent but makes it a choice to be argued for, not forced on us.

  - type: mcq
    id: objection-laws
    title: "Objection two: laws of nature"
    prompt: |
      A scientific law says "all copper conducts electricity". According to a strict verificationist, a sentence must be conclusively backed by finitely many observations. What goes wrong?
    options:
      - text: "No finite number of observed pieces of copper can conclusively establish the law for all copper, so the law would count as meaningless, which no one wants."
        correct: true
        feedback: |
          Yes. This is the standard problem: universal laws outrun any finite list of observations. The Stanford account notes that some positivists accepted a surprising consequence (Schlick treated laws as rules of inference rather than statements), and others sought more liberal formulations of the test.
      - text: "Copper does not conduct electricity."
        feedback: |
          It does. The problem is about the logic of verification, not about copper.
      - text: "Laws of nature are not about observation."
        feedback: |
          Science tests laws by observation. The trouble is that the test never ends.
      - text: "The principle forbids all scientific sentences."
        feedback: |
          It admits many, such as reports of observations. The trouble is with universal laws, which are most of science.
    explanation: |
      Weaken the test and almost anything gets through; keep it strict and science itself fails. That is why Carnap and others moved toward looser formulations that speak of confirmation by observation, and why the picture of a sharp line between meaningful and meaningless was largely given up. The question remained whether sentences about God are better understood another way.

  - type: text
    id: late
    title: "Later Wittgenstein: meaning as use"
    body: |
      In his later work, published after his death as *Philosophical Investigations* (1953), Wittgenstein turned against his early picture view. According to the Stanford account, he came to say that "the meaning of a word is its use in the language", and he added that this holds for a large class of cases, not all.

      Words, on this view, are tools, and one tool does many jobs. He called the varied activities that words belong to **language-games**, and wanted to bring out that speaking a language is part of an activity or form of life. A **form of life** is the wider set of shared practices that make a language game possible. Scholars read the idea in different ways, some more relative to a community and some less.

  - type: mcq
    id: use-q
    title: "One sentence, three games"
    prompt: |
      The words "I will be there" are said (a) as a prediction to a friend about tomorrow, (b) as a vow at a wedding, (c) as a reply to a roll call. According to meaning as use, what is the fairest description?
    options:
      - text: "The words do different jobs in the three games, and their meaning is bound up with what each use does."
        correct: true
        feedback: |
          Yes. A prediction can turn out false, a vow can be kept or broken, and an answer at roll call reports presence. One form of words, three uses.
      - text: "The words have one fixed meaning, and the differences are only tone of voice."
        feedback: |
          This is the view meaning-as-use argues against: what each use does is not just tone but a different kind of act.
      - text: "Only the prediction is meaningful."
        feedback: |
          A vow is not a failed prediction. It makes a promise, which is a different kind of job.
      - text: "Use is irrelevant to meaning."
        feedback: |
          That would be the picture view. The use view says use is where meaning shows.
    explanation: |
      The use view widens what counts as meaningful: not only reports of facts but promises, commands and thanks. A rival reading keeps that a sentence can do more than one job and still make a claim as well.

  - type: order
    id: games
    title: "Match the game"
    prompt: |
      A believer says "We thank you for this meal." In an order that moves from the narrowest to the widest reading, put these descriptions of what the sentence is doing.
    steps:
      - "It reports a fact: that a being exists who receives thanks."
      - "It performs an act: it thanks someone, as 'thank you' does at the door."
      - "It belongs to a form of life: a practice of grace before meals that gives the words their place."
    hint: "The first reads the sentence as a claim about what exists, the last as a part of a whole practice."
    explanation: |
      The three readings are exactly where the lesson ends: religious sentences as claims, as expressions or acts, and as parts of a way of life. They are not exclusive in every account, and thoughtful people disagree on which one captures what believers mean.

  - type: text
    id: parting
    title: "Where thoughtful people part"
    body: |
      The three theories do not give the same verdict on "God is love". According to the **picture view**, a sentence has factual content only if it pictures a possible arrangement; according to the **verification view**, only if experience could count for or against it; according to the **use view**, it depends on what it does in the life of those who say it.

      A believer who sees religious sentences as claims about reality says the first two tests are too narrow, since what matters is whether the claims are true. Another view reads them as expressions of an attitude or a commitment. A third reads them as the internal language of a form of life, to be understood from inside. A sceptic may agree that the sentences do something, and ask whether they also claim something. These disagreements are about premises, not about who is clever.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Sort this sentence by the three layers: "Religious sentences are best understood as parts of a form of life, not as claims about reality."
    options:
      - text: "A philosophical position that is debated, with a considerable body of scholars on each side."
        correct: true
        feedback: |
          Yes. That sentence is a live debate among philosophers of religion, and settling it depends on premises about meaning and about what believers intend.
      - text: "Established fact, because Wittgenstein said so."
        feedback: |
          That Wittgenstein wrote about language-games is fact. That religious language is therefore not about reality is a further claim, and many disagree.
      - text: "A faith commitment: only believers hold it."
        feedback: |
          Some believers hold it and some reject it; some non-believers hold it too. It is not tied to one commitment.
      - text: "None of the above, because it is meaningless."
        feedback: |
          By the verification test some would say so, but that test has its own problems, as the earlier objections showed.
    explanation: |
      Keep the layers apart. Who argued what is fact. Whether religious language is factual, expressive or practice is a live debate. Whether the claims are true is another question again.

  - type: build
    id: principle-build
    title: "State the principle"
    prompt: |
      Complete the verification principle for a sentence $s$ that states a fact.
    prefix: ''
    suffix: ''
    tiles: ['s \text{ meaningful}', '\iff', 's \text{ verifiable in principle}', 's \text{ true}', 's \text{ believed}']
    answers:
      - ['s \text{ meaningful}', '\iff', 's \text{ verifiable in principle}']
    wrong:
      - answer: ['s \text{ meaningful}', '\iff', 's \text{ true}']
        feedback: |
          The principle is about meaning, not truth. A false sentence such as "the cat is on the mat" (when it is not) still has meaning, since we know what would make it true.
      - answer: ['s \text{ meaningful}', '\iff', 's \text{ believed}']
        feedback: |
          Belief is not the test. People believe meaningless things and reject meaningful ones.
    hint: "The test asks whether some possible experience could count for or against the sentence."
    explanation: |
      The principle links meaning to verifiability, not to truth or to belief. A sentence can be false and perfectly meaningful: we know what would make it true.

  - type: mcq
    id: truth-vs-meaning
    title: "Meaningless or false?"
    prompt: |
      Ayer's test, as described in the Stanford account, applied to "there is a God" says that it is neither true nor false but lacks literal meaning. A theist and an atheist both object. Which objection fits?
    options:
      - text: "Both can object: the theist that the sentence plainly means something, the atheist that denying it is also meaningful. Calling it meaningless takes both positions away."
        correct: true
        feedback: |
          Yes. If the sentence is meaningless, so is its denial, and the atheist loses the position too. That is why the principle drew objections from both sides, apart from the objections about science.
      - text: "Only the theist can object, because the atheist wins."
        feedback: |
          The atheist's position, "there is no God", is also a claim and would go with it.
      - text: "Neither can object, since it is only a definition."
        feedback: |
          Ayer's reply to the self-test treats it as a definition, but a definition can still be rejected for being too narrow, which is what both would say.
      - text: "Both agree, since neither can verify their claim."
        feedback: |
          Both may agree that proof is hard, but they disagree that the sentence therefore has no meaning.
    explanation: |
      The principle is not neutral between belief and unbelief: it removes the question rather than answering it. Whether religious sentences are claims at all is the next lesson's subject.

  - type: text
    id: summary
    body: |
      **Next:** if "God exists" is not verifiable, is it still a claim about reality, or something else: an expression of attitude, a commitment, a form of life? The next lesson sets out Ayer's view, its critics, and the replies of Braithwaite and Phillips, each according to its thinkers.
