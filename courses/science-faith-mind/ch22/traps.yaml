id: ch22-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: language and religious language"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: what a sentence means, whether religious sentences state facts, how words can be stretched to speak of God, metaphor and myth, acts done by words, ways of reading a text, and translation. Every shortcut is a *useful idea pushed too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone, and the feedback keeps three layers apart: **established fact** (dates, texts, experiments), **scholarly debate** (say which), and **faith or metaphysical commitment**.

  - type: mcq
    id: trap-venus
    title: "Same planet, same meaning?"
    prompt: |
      A student says: "The morning star and the evening star are the same planet, Venus. So the sentences 'the morning star is the morning star' and 'the morning star is the evening star' mean the same thing." According to Frege (1892), what is wrong?
    options:
      - text: "Both phrases have the same reference (Venus) but different senses (ways of presenting it). The second sentence is informative because the senses differ, so meaning is not reference alone."
        correct: true
        feedback: |
          Yes. Frege separated the thing picked out (reference) from the way it is presented (sense). Discovering that two presentations pick out one planet was news, which a repeated phrase never is.
      - text: "The two phrases refer to different planets, which were only later found to be one."
        feedback: |
          They always referred to Venus. What people lacked was the knowledge that the two ways of picking it out met on one object.
      - text: "Nothing is wrong: meaning is just the thing a word picks out."
        feedback: |
          This is the view Frege argued against. If it held, the two sentences would say the same and the second would teach nothing, yet it was a real discovery.
      - text: "Frege held that 'Venus' has no meaning at all."
        feedback: |
          Frege gave names both a sense and, when there is such an object, a reference. He did not deny meaning to names.
    explanation: |
      Layers: Frege's distinction and the Venus example are documented; how far sense-and-reference explains all meaning is live debate. The trap is to equate what a word picks out with what it means.

  - type: mcq
    id: trap-meaningless
    title: "Meaningless is not false"
    prompt: |
      The logical positivists held that a sentence is factually meaningful only if experience could in principle confirm or refute it (the verification principle). Someone says: "So if a sentence is meaningless on that test, it must be false." What is the error?
    options:
      - text: "A false sentence has a meaning and gets it wrong. A sentence that fails the test was said to state nothing at all, so it is neither true nor false, and its denial fails the test too."
        correct: true
        feedback: |
          Yes. "There are five moons of this planet" can be false. A sentence the test calls meaningless is not a wrong claim but, on that view, no factual claim. Hence the verdict cannot favour either side.
      - text: "Meaningless sentences are true, because nobody can refute them."
        feedback: |
          Being unrefutable is exactly what the test calls empty, not true. Truth needs a claim that could be right.
      - text: "The principle only applies to sentences about God."
        feedback: |
          It was meant for any sentence that claims to state a fact, in ethics, metaphysics or science alike.
      - text: "The principle was accepted by every philosopher and is settled."
        feedback: |
          The strict form faced serious objections (it fails its own test, it seems to rule out scientific laws, and weakened versions let in too much). Carnap and others held looser versions.
    explanation: |
      Layers: the principle and its objections are documented history of philosophy; whether any version of it is defensible is live debate. Keep apart "meaningless", "false" and "unproven".

  - type: mcq
    id: trap-ayer-god
    title: "Did Ayer refute God?"
    prompt: |
      A. J. Ayer (1936) argued that "God exists" is not a factually meaningful sentence. A reader concludes: "So Ayer proved that God does not exist." According to Ayer's argument, what is the correct reading?
    options:
      - text: "His verdict is about meaning, not about God: if the sentence states no checkable fact, then its denial ('there is no God') states none either."
        correct: true
        feedback: |
          Yes. The claim concerns what the sentences do, and it strikes the atheist's sentence as much as the theist's. Whether Ayer's test is a good test is the live question.
      - text: "He proved that every religious believer is irrational."
        feedback: |
          The argument is about whether certain sentences state facts. It makes no claim about the reasoning or sincerity of believers, and later philosophers such as Braithwaite accepted part of his point and kept religious practice.
      - text: "He showed that God cannot exist because God cannot be seen."
        feedback: |
          That would be an argument from absence of evidence to absence of God. Ayer's argument removes the factual status of both statements instead.
      - text: "He agreed that 'God exists' is true but not provable."
        feedback: |
          If a sentence is not factually meaningful it is not true either. Ayer rejects the pair true-but-unprovable.
    explanation: |
      Layers: what Ayer wrote is documented; whether his criterion is right is live debate. A verdict about a sentence is not a verdict about the thing it names.

  - type: mcq
    id: trap-noncog
    title: "Non-cognitive means insincere?"
    prompt: |
      Braithwaite (1955) held that a religious sentence expresses a commitment to a way of life, supported by stories, rather than describing a fact. A reader objects: "So he thought believers were just pretending." What is the best reply?
    options:
      - text: "No. A commitment can be wholehearted. 'Non-cognitive' says only that the sentence is not mainly a true-or-false description; a vow or a promise is sincere without being a report. Critics reply that many believers do take their sentences as factual."
        correct: true
        feedback: |
          Yes. Sincerity and being a report are separate questions. The live debate is whether this view fits what believers themselves mean to say.
      - text: "Yes, since a sentence without truth value cannot be sincerely held."
        feedback: |
          People sincerely make promises and vows, which are not true or false descriptions. Sincerity concerns the speaker's commitment, not a truth value.
      - text: "No, because Braithwaite thought the stories were literally true."
        feedback: |
          He held that the stories support the intention and need not be believed as history to do so. Believing them as fact is not his point.
      - text: "Yes, because non-cognitivism denies that anyone has religious experience."
        feedback: |
          The theory is about what religious sentences do. It makes no claim about whether experiences occur.
    explanation: |
      Layers: Braithwaite's view is documented; whether it describes real religious speech is live debate; the believer's own commitment is faith. Cognitivism (face-value reading) and non-cognitivism are rival readings of the sentence, not rival accusations.

  - type: mcq
    id: trap-phillips
    title: "A language game closed to criticism?"
    prompt: |
      D. Z. Phillips (from 1965) drew on late Wittgenstein: religious talk has its own use in a community's life, and judging it by scientific standards misses what it does. A critic says: "That means religion can never be questioned." According to the lesson, what should one say?
    options:
      - text: "That is the label 'Wittgensteinian fideism' (from Kai Nielsen, 1967), which Phillips's defenders call unfair. They hold that religious language answers to its own standards of sense, not that it escapes every standard. Whether that is enough is debated."
        correct: true
        feedback: |
          Yes. 'Fideism' (resting religion on faith rather than reasons) was a critic's name for the approach, and the approach's friends reject it. A fair account gives both.
      - text: "Phillips himself called his view fideism and welcomed it."
        feedback: |
          The label came from Nielsen, as a criticism. Phillips's defenders deny that it fits.
      - text: "Phillips held that religious sentences are false but useful."
        feedback: |
          He did not call them false. His point is that their meaning lies in their place in a form of life, so the test of causal effect misses it.
      - text: "Phillips held that science and religion contradict each other."
        feedback: |
          On his view the two do different things, which is why a scientific trial of prayer misses its meaning. That is not a contradiction between them.
    explanation: |
      Layers: Phillips's book and Nielsen's label are documented; whether the view dodges all criticism is live debate; whether prayer is more than expression is a matter of commitment.

  - type: mcq
    id: trap-analogy
    title: "Same word, same sense?"
    prompt: |
      Someone says: "'God is good' and 'Maria is good' must use 'good' in the same sense, or else the first sentence tells us nothing." According to Aquinas (Summa Theologiae I q.13 a.5), which is the best reply?
    options:
      - text: "Words are used in three ways: univocally (one sense), equivocally (unrelated senses) or analogically (related senses tied to a primary case, like 'healthy' of an animal, a medicine and urine). He took talk of God to be analogical: neither the same sense nor an unrelated one."
        correct: true
        feedback: |
          Yes. If the sense were the same, God would be one more creature; if unrelated, we could say nothing. Analogy keeps a link while allowing difference. Whether the link is enough is a live objection.
      - text: "Aquinas held that all talk of God is equivocal, so it conveys nothing."
        feedback: |
          He rejected that: pure equivocation would make the words useless, and he held that names for God do signify something, though falling short.
      - text: "Aquinas held that talk of God is univocal, since God is the cause of goodness."
        feedback: |
          He argued against univocal use, because God and creatures do not share one measure. Being the cause is why the words are tied together, not why they mean the same.
      - text: "Aquinas held that nothing can be said of God."
        feedback: |
          He held that some things can be said (analogically) while also saying that we know what God is not better than what God is.
    explanation: |
      Layers: Aquinas's three-way scheme is documented; whether analogy really solves the problem is live debate; whether God is good is a faith claim. Compare the word "healthy": one primary case, others named by relation to it.

  - type: mcq
    id: trap-apophatic
    title: "Negative speech is silence?"
    prompt: |
      Maimonides (Guide of the Perplexed, 1190) argued that we describe God only by negations (God is not weak, not composite). A reader says: "If every statement is a denial, he is saying nothing about God." Maimonides replies with a ship: a person who knows only the word "ship" is told what it is not (not a mineral, not a plant, not a flat object, not a sphere) and comes nearer to what it is. What does this show?
    options:
      - text: "Each true denial narrows what the thing can be. A person told that a ship is not a mineral, not a plant, not a flat object and so on comes nearer to what it is. Negation is speech that removes wrong ideas, as the apophatic ('saying-away') tradition holds, though it is not a full description."
        correct: true
        feedback: |
          Yes. Denials carry information, the way each wrong answer removes a possibility. Dionysius went further: affirm, deny, and then say God is beyond both. Going beyond both is a way of using speech, not stopping it.
      - text: "The ship shows that God is a kind of ship."
        feedback: |
          The ship is a picture of the method: how knowing only a name can grow through correct denials.
      - text: "Negation gives complete knowledge of God, so positive speech is useless."
        feedback: |
          Maimonides does not claim complete knowledge. Denials bring one nearer, and critics ask whether a list of denials ever amounts to a positive idea.
      - text: "It shows that denying something about God is the same as affirming its opposite."
        feedback: |
          Denying 'God is weak' does not affirm any particular quality. Negation removes without adding a full description.
    explanation: |
      Layers: the text and the ship passage are documented; whether negation alone is enough is live debate; the traditions' own use of silence in prayer is practice, not a theory. Apophatic writers wrote a great deal.

  - type: mcq
    id: trap-metaphor
    title: "Metaphor means false?"
    prompt: |
      Psalm 23:1 (KJV) says "The LORD is my shepherd". A reader says: "God is not a man with sheep, so the sentence is false." According to Ian Ramsey (Religious Language, 1957) and Ricoeur, what is the better account?
    options:
      - text: "A metaphor is not meant as a literal identity. It works by tension between 'is' and 'is not'; Ramsey adds that models need qualifiers (a perfect shepherd, a caring one) so the picture discloses something. Taken as literal it is false; taken as a metaphor it may say something true that no literal sentence says as well."
        correct: true
        feedback: |
          Yes. Literal falsity of the surface is where a metaphor starts. Whether what it discloses is true, and whether it can be paraphrased in literal terms, is debated.
      - text: "Metaphors are never true and only decorate."
        feedback: |
          The scholars in this level treat metaphor as able to carry meaning that a literal paraphrase loses. Whether it is true depends on what it conveys, not on its being a metaphor.
      - text: "The sentence is literally true if one believes it."
        feedback: |
          Belief does not make a literal reading apt. The point is that the reader moves from the surface sense to a suggested sense.
      - text: "A metaphor is a sign that has no connection to what it points to."
        feedback: |
          That fits Tillich's 'sign' (a flag), not a symbol or metaphor. For Tillich a symbol takes part in what it points to.
    explanation: |
      Layers: the verse and the scholars' views are documented; whether religious metaphor can be turned into literal statements is live debate; how far God resembles a shepherd is faith. Tillich added that taking a symbol literally risks idolatry.

  - type: mcq
    id: trap-myth
    title: "Myth means untrue?"
    prompt: |
      A scholar of religion writes, "The flood narrative is a myth." A reader answers: "So you are saying it never happened." In the scholarly sense of the word, what is the reply?
    options:
      - text: "In everyday speech 'myth' means a false belief; scholars use it for a traditional sacred story told in a community as important. The word names the kind of story, and its truth or history is a separate question."
        correct: true
        feedback: |
          Yes. The same sentence can be read two ways, and mixing them makes arguments look sharper than they are. Whether the story records events is a question for history, archaeology and faith.
      - text: "Scholars use 'myth' to mean a story that is true but disguised."
        feedback: |
          Scholars use no verdict on truth. The word names a kind of story, and some scholars read myths symbolically without calling them true.
      - text: "The reader is right: 'myth' always signals that the story is invented."
        feedback: |
          That is the everyday sense. Scholars mean a sacred traditional story and take no stand on events.
      - text: "Scholars use 'myth' only for stories of other people's religions."
        feedback: |
          The category applies to any tradition, including the scholar's own; it is a label for a kind of story, not for the faith of others.
    explanation: |
      Layers: the scholarly definition is documented; what each story records is live debate or faith depending on the case. Say which sense you mean, or the sentence says two things at once.

  - type: mcq
    id: trap-bultmann
    title: "Demythologizing means deleting?"
    prompt: |
      Rudolf Bultmann (1941) proposed to "demythologize" the New Testament. A reader says: "So he wanted to throw out the miracles and everything else that sounds mythical." According to the lesson, what did he propose?
    options:
      - text: "To interpret, not delete: the picture-language of an ancient world (heaven above, hell below, spirits) is read for what it says about human existence. Critics, such as Jaspers, ask whether the picture can be separated from its meaning at all."
        correct: true
        feedback: |
          Yes. He wanted the message kept and the old picture of the world not required as a description. The dispute is whether the picture can be peeled off.
      - text: "To remove the New Testament from the study of religion."
        feedback: |
          He was a New Testament professor, and he wanted the message understood, not dropped.
      - text: "To prove that the events described did not occur."
        feedback: |
          His method is an interpretation of meaning, not a historical verdict on each event.
      - text: "To replace the stories by scientific explanations."
        feedback: |
          He interpreted them existentially, in terms of how a person lives, not as science.
    explanation: |
      Layers: his 1941 lecture is documented; whether demythologizing keeps or loses the message is live debate; what the texts' events were is history and faith. The word is a method, not a deletion.

  - type: mcq
    id: trap-performative
    title: "Is 'I do' true or false?"
    prompt: |
      At a wedding a person says "I do." A reader says: "That is true if they love their partner and false if they do not." According to J. L. Austin (How to Do Things with Words, 1962), what kind of utterance is this?
    options:
      - text: "A performative: saying it is the doing of an act (marrying), so it is not true or false but can be happy or unhappy. If the person does not mean it, that is an abuse (insincere), not a false statement."
        correct: true
        feedback: |
          Yes. A constative describes and can be true or false; a performative acts and is judged by whether the act comes off. Insincere vows make the act unhappy, not false.
      - text: "A constative, true when the person loves their partner."
        feedback: |
          A constative describes something ('the ship is large'). 'I do' describes nothing; it does something.
      - text: "Neither of any kind: it has no meaning, since it is not true or false."
        feedback: |
          Not being true or false does not mean being meaningless. The words have a clear use, as acts.
      - text: "A prediction about the future of the marriage."
        feedback: |
          The words commit the speaker. They do not forecast anything.
    explanation: |
      Layers: Austin's distinction and examples are documented; how far all speech has performative parts is live debate. The trap is to force every sentence into true or false.

  - type: mcq
    id: trap-misfire
    title: "A bottle and a bystander"
    prompt: |
      At a launch, a passer-by seizes the bottle and says "I name this ship the Queen Elizabeth." The ship stays unnamed. A reader says: "He lied, so the sentence was false." In Austin's terms, what happened?
    options:
      - text: "A misfire: the act did not come off because the speaker lacked the authority. Lies and insincerity belong to abuse, where the act is performed but not meant. No true-or-false verdict applies in either case."
        correct: true
        feedback: |
          Yes. Misfire: wrong person, wrong formula or wrong occasion. Abuse: the act happens but the speaker is insincere (a marriage only for convenience). They fail in different ways.
      - text: "An abuse: the act was performed but the speaker did not mean it."
        feedback: |
          Here the act was never performed, because the passer-by had no standing to name the ship. That is a misfire.
      - text: "A false statement, because the ship has another name."
        feedback: |
          The sentence is not a statement about the ship's name; it is an attempt to give a name.
      - text: "A perlocutionary success, because the crowd was persuaded."
        feedback: |
          The perlocutionary effect is what the words bring about in the hearers, such as persuading. The question is whether the act of naming happened, and it did not.
    explanation: |
      Layers: Austin's two kinds of failure are documented. Whether a blessing or vow does anything beyond the human act is a further claim and belongs to faith. The classification itself is ours to check, not a doctrine.

  - type: mcq
    id: trap-allegory
    title: "Allegory throws away the letter?"
    prompt: |
      Philo of Alexandria (late 1st century BCE to mid 1st century CE) read the rib of Adam as the powers of the mind. A reader says: "So allegorists think the literal sense is false and only the hidden sense counts." What does the lesson say about Philo?
    options:
      - text: "He turned to allegory especially where the plain sense seemed problematic, and still took the literal text and the law seriously. Other traditions also kept several senses together (midrash with the plain sense, Origen's body, soul and spirit)."
        correct: true
        feedback: |
          Yes. Allegory and the literal sense were not simple rivals for him. Some readers later dropped the plain sense, but that is a different position, and Spinoza's historical reading is another way again.
      - text: "He read the whole text allegorically and dropped the law."
        feedback: |
          He kept the law and criticised those who neglected it.
      - text: "He rejected allegory and read only the plain sense."
        feedback: |
          He used allegory deliberately, especially where the literal reading seemed improbable or unworthy.
      - text: "He read the text as history, the way a modern historian does."
        feedback: |
          Historical reading as a method is clearer in later authors, such as Spinoza (1632 to 1677). Philo's aim was to find what the text says about the mind and God.
    explanation: |
      Layers: what Philo and Origen did is documented; which sense is the right one is a question the traditions answer differently; midrash and tafsir show that readers have often held several senses at once.

  - type: mcq
    id: trap-circle
    title: "A circle in the argument?"
    prompt: |
      To understand a sentence you need the whole passage, and to understand the passage you need its sentences. A reader says: "That is a vicious circle, so understanding a text is impossible." According to Gadamer (Truth and Method, 1960) and the hermeneutic tradition, what is the reply?
    options:
      - text: "It is a back-and-forth, not a proof that assumes its conclusion: a first guess at the whole is corrected by the parts, and the parts are read again. Gadamer adds that a reader always brings prejudgments, which the text can confirm or revise."
        correct: true
        feedback: |
          Yes. A guess that can be corrected is not a vicious circle. The danger is a prejudgment held so firmly that the text can never correct it.
      - text: "The circle shows that all readings are equally good."
        feedback: |
          The circle describes how understanding proceeds. A reading that the parts contradict is a poor one, and Gadamer rejects pure subjectivism.
      - text: "One must remove every prejudgment before reading."
        feedback: |
          Gadamer argues that this cannot be done and that prejudgments are what let a text speak to us at all. What matters is that they are open to revision.
      - text: "The circle applies only to sacred texts."
        feedback: |
          It was described for texts in general, and the example of a sentence in a passage is ordinary.
    explanation: |
      Layers: the idea and Gadamer's use of it are documented; how much a reader's tradition should shape interpretation is live debate (Habermas criticised the view as conservative). Which reading of a sacred text is right is for each tradition.

  - type: mcq
    id: trap-whorf
    title: "Does language lock thought?"
    prompt: |
      A writer says: "The Sapir-Whorf hypothesis shows that what a language lacks its speakers cannot think." Which form is this, and what is the usual verdict?
    options:
      - text: "The strong form (linguistic determinism): language fixes thought. It is widely doubted, since speakers can learn or have explained distinctions their language lacks. Evidence supports at most the weak form (linguistic relativity): language influences habits of attention and categorising."
        correct: true
        feedback: |
          Yes. Strong: language sets a limit. Weak: language nudges. The question for research is how large and how general the weak effects are.
      - text: "The weak form, and it is well established."
        feedback: |
          The weak form says language influences habits, not that thought is impossible. The sentence in the prompt is the strong form.
      - text: "The strong form, and it is well established by Whorf's Hopi work."
        feedback: |
          Whorf's Hopi time claim was answered by Malotki in 1983 with hundreds of Hopi sentences that refer to time; relativists reply that Whorf meant a different conception. It does not establish the strong form.
      - text: "Neither: the hypothesis is only about vocabulary size."
        feedback: |
          It concerns whether and how a language's structure shapes thought, not just how many words it has.
    explanation: |
      Layers: the hypothesis and its tests are documented; the strong form is widely doubted (debate); the weak form is supported but its size is debated. The names are later labels, and Whorf stressed grammar as well as words.

  - type: mcq
    id: trap-blue
    title: "Russian blues prove it?"
    prompt: |
      A 2007 study (Winawer and colleagues) found that Russian speakers were faster to tell two blues apart when they fell on opposite sides of the *goluboy* (light blue) and *siniy* (dark blue) boundary. A 2020 re-test (Martinovic, Paramei and MacInnes) did not reproduce the boundary effect for lightness. A reader says: "This proves language determines how we see colour." What is the best response?
    options:
      - text: "The 2007 result is a speed difference of a tendency, which fits the weak form at most; it did not show Russian speakers unable to see the blues as alike, and a later re-test found it weaker. A single study, even a replicated one, does not give determinism."
        correct: true
        feedback: |
          Yes. Faster across a boundary is not unable to see the difference, and a re-test that does not reproduce an effect is part of how the debate moves. Determinism would need much more.
      - text: "The 2020 re-test proves that language never influences colour perception."
        feedback: |
          A weaker or missing effect in one test does not settle the question for all colours and tasks. Other results continue to be debated.
      - text: "The 2007 study found that English speakers cannot see blue."
        feedback: |
          Nothing of the sort: the study compared reaction times, and no group was unable to see anything.
      - text: "Colour words are irrelevant to the hypothesis."
        feedback: |
          Colour terms are among the standard tests, which is why the studies were run.
    explanation: |
      Layers: the two studies and their reported results are documented; what they mean for the hypothesis is live debate. Take one experiment as one data point, and speed differences as tendencies.

  - type: mcq
    id: trap-layers
    title: "Fact, debate or commitment?"
    prompt: |
      Sort the statements by layer. Which statement is a **faith or metaphysical commitment**, not an established fact or a live scholarly debate?
    multiple: false
    options:
      - text: "Austin published his distinction between constatives and performatives, and the ship-naming example is his."
        feedback: |
          This is a documented fact about what Austin wrote, so it is the first layer.
      - text: "Whether Ayer's verification test is a defensible criterion of meaning."
        feedback: |
          Philosophers disagree over this and over weakened versions of the test, so it is a live scholarly debate.
      - text: "The words of a blessing or a vow actually bring about a change in the world beyond the human act."
        correct: true
        feedback: |
          Yes. That a blessing or vow is an act, with conditions for coming off, is Austin's classification. That the words also work some further effect is a claim of faith, not of the analysis of speech.
      - text: "Russian speakers were somewhat faster across the blue boundary in a 2007 study, and a 2020 re-test found the effect weaker."
        feedback: |
          These are reported results of studies, so established fact. Their meaning is debated, but the reports are not a commitment.
    explanation: |
      Three layers, as always: documents, experiments and dates are fact; the status of a criterion or a reading is debate; claims about what words do beyond the human act, or about God, are commitments. This level's tools sort the sentences, not the worlds.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **The shortcuts to drop**, with the lesson where each is taken apart:

      | Trap | Lesson |
      |---|---|
      | Meaning is just what a word picks out; meaningless means false; Ayer refuted God | What Does It Mean to Mean?; Factual or Not? Cognitivism and Its Rivals |
      | Non-cognitive means insincere; a language game is immune to criticism | Factual or Not? Cognitivism and Its Rivals |
      | God-talk is the same sense as human talk, or no sense; negation is silence | Analogy, Negation and Apophatic Speech |
      | Metaphor means false | Metaphor, Symbol and Model |
      | Myth means untrue; demythologizing means deleting | Myth, Story and Narrative Truth |
      | Performatives are true or false; failures are lies | Ritual, Performative Speech and Liturgy |
      | Allegory drops the letter; the circle makes understanding impossible | Interpretation: Literal, Allegorical, Historical |
      | The strong Sapir-Whorf claim; one colour study proves it | Translation and What Gets Lost |

      **The habit.** Before judging a religious sentence, ask what kind of speech it is (claim, expression, act, story), according to whom, and which layer the claim sits in: fact, debate or commitment.

      **Next:** a quick-recall round on the level's main ideas, with mnemonics, distinctions and a small worked example.
