id: ch22-cognitive
title: "Factual or Not? Cognitivism and Its Rivals"
kind: concept
own: |
  The setting: a religious sentence $s$ such as "God loves us" or "God exists", said sincerely by a believer. The question is whether $s$ is a **claim about reality**, something that is true or false, or whether it does another job. Four answers, each *according to* its thinkers.
  - **Cognitivism** (the face-value reading). The sentence $s$ expresses a proposition, so it is true or false whether or not anyone can check it:
    {{ $$\begin{gathered}s \text{ expresses a proposition}\\ \text{that is true or false}\end{gathered}$$ }}
    Non-cognitivism is the family of views that deny this.
  - **Verification applied** (A. J. Ayer, 1936). Take the verification principle: a sentence that states a fact has literal meaning only if some possible experience could count for or against it. Ayer applied it to religion, so "God exists" is neither true nor false and neither is "God does not exist".
  - **Falsification** (Antony Flew, 1950 to 1951, with the gardener parable). If a believer lets every possible observation be explained away, then the sentence stops saying anything:
    {{ $$\begin{gathered}\text{nothing could count against } s\\ \Rightarrow\ s \text{ asserts nothing}\end{gathered}$$ }}
    Replies: R. M. Hare called such a commitment a *blik*, not an assertion; Basil Mitchell said evidence counts against a trust already given, but not decisively; John Hick said the claim can be settled after death.
  - **A policy of action** (R. B. Braithwaite, 1955). According to him, a religious sentence declares an intention, and the stories attached to it help sustain that intention:
    {{ $$\begin{aligned}\text{religious belief} ={}& \text{intention to follow}\\ & \text{a way of life}\\ & +\ \text{stories}\end{aligned}$$ }}
  - **A language game** (D. Z. Phillips, from 1965). On this view religious talk has its own use in the life of a community, and judging it by the standards of science misses what it does.
  - **Three layers.** Fact: who argued what, and when. Debate: whether religious sentences are claims at all, and whether the non-cognitive views describe what believers mean. Commitment: whether "God loves us" is meant as true of reality; each tradition answers for itself.

cards:
  - type: text
    id: hook
    title: "Is that a claim about the world?"
    body: |
      A believer says, gently and sincerely, "God loves us." A friend asks, "Is that a claim about the world, like 'there is a cat in the next room'?" The believer pauses. Yes, in some sense, but the friend's next question is harder: "What would it look like if it were false?"

      Before any theory, a guess: does a sentence have to be something we could, in principle, check against the world to count as a claim? The cards that follow lay out how philosophers answered, each told *according to* the people who gave the answer. Guessing first is the point, and nothing here asks you to believe or doubt any religious sentence.

  - type: mcq
    id: guess
    title: "Guess: a claim nothing could count against"
    prompt: |
      Someone says, "There is an invisible, silent gardener who tends this garden, and no test of any kind could ever tell his garden from one with no gardener." If no experience could ever count against a sentence, is it still a claim about the world?
    options:
      - text: "It seems to have lost its grip on the world, though whether that means it says nothing is exactly the question to examine."
        correct: true
        feedback: |
          Yes. The sentence has the shape of a claim, but if nothing could ever differ between its being true and its being false, it is hard to say what it tells us. Some philosophers conclude it says nothing; others say it does a different job.
      - text: "Yes, any grammatical sentence is a claim."
        feedback: |
          Grammar alone is not enough: "colourless green ideas sleep furiously" is grammatical, and few would call it a claim about the world.
      - text: "No, and it is therefore obviously false."
        feedback: |
          Not being checkable is not the same as being false. A sentence that is empty of content would be neither true nor false, which is a different verdict, and the next cards separate the two.
      - text: "Yes, because a claim only needs a believer to hold it."
        feedback: |
          Sincerity gives a sentence a speaker, not a content. People sincerely hold claims that turn out to be false or empty.
    explanation: |
      Keep your guess. The lesson asks whether religious sentences are claims, and the answer depends on what a claim is.

  - type: text
    id: recall
    title: "Recall: the verification principle"
    body: |
      From the lesson What Does It Mean to Mean?: let $s$ be a sentence that states a fact (a synthetic one, not true by definition). According to the verification principle, held in forms of different strength by the Vienna Circle and by A. J. Ayer in 1936, $s$ has literal meaning only if some possible experience could count for or against it:

      $$s \text{ meaningful} \iff s \text{ verifiable in principle}$$

      Sentences true by definition, such as "a triangle has three sides", are meaningful but say nothing about the world. The strict form of the principle faced three objections (it fails its own test, it excludes scientific laws, weakened versions let almost anything through), and many philosophers dropped it. Here we ask what happens when its idea is aimed at religion.

  - type: text
    id: ayer
    title: "Ayer on religious sentences"
    body: |
      A. J. Ayer (1910 to 1989) applied the principle to religion in *Language, Truth and Logic* (1936). According to standard accounts of his argument, his reasoning runs as follows: "God exists" is not true by definition, and no possible experience would count for or against it, so it does not state a fact in the strict sense. In Ayer's sense it is neither true nor false.

      Notice what this is not. It is not the claim "God does not exist", which would itself be a statement of fact. It is the claim that the sentence has no factual content at all. Ayer wrote that the notion of a person whose essential attributes are non-empirical is not an intelligible notion. He drew the consequence that atheism, the denial, shares the fate, since only a meaningful proposition can be meaningfully contradicted. He said the same of agnosticism, which treats the question as a genuine one. So he was an unusual kind of unbeliever: not one who calls "God exists" false, but one who holds that it asserts nothing.

  - type: mcq
    id: ayer-q
    title: "What follows for the atheist?"
    prompt: |
      According to Ayer's reasoning, "God exists" is not a statement of fact in the strict sense. What follows for the sentence "God does not exist"?
    options:
      - text: "By the same test it also fails to state a fact, so it is neither true nor false in his sense."
        correct: true
        feedback: |
          Yes. If no experience could count for "God exists", none could count for its denial either. The principle removes the question instead of answering it, which is why both believers and atheists objected.
      - text: "It is true, since the sentence it denies has failed the test."
        feedback: |
          Failing the test is not being false. A false sentence is a meaningful one that does not match reality; Ayer's verdict is that there is nothing to match.
      - text: "It is verified, because we have never observed God."
        feedback: |
          Not observing something would verify its absence only if we would expect to observe it. The positivist point is that no observation is relevant either way.
      - text: "It is true by definition."
        feedback: |
          A definition would make it analytic, but "God does not exist" is meant as a claim about what there is, not as a rule about words.
    explanation: |
      Ayer's view is a verdict about meaning, not a verdict about God. That is exactly why Flew, a few years later, tried to make the point in a way that did not rest on the whole verification principle.

  - type: text
    id: flew
    title: "Flew and the invisible gardener"
    body: |
      Antony Flew (1923 to 2010) put a sharper question in a paper called "Theology and Falsification", first published in the Oxford journal *University* in 1950 to 1951 and growing out of a talk at C. S. Lewis's Socratic Club. He borrowed a story from the philosopher John Wisdom (his article "Gods"). Two explorers find a clearing in the jungle with flowers and weeds. One says a gardener tends it. They watch, set up an electrified fence, patrol with bloodhounds, and see nothing. The believer adds a qualification each time: the gardener is invisible, makes no sound, leaves no scent. At last the sceptic asks how such a gardener differs from an imaginary one or from no gardener at all.

      According to Flew, a sentence that seems to assert something must rule something out. If the believer lets every observation be explained away, the sentence is eroded until nothing is left; he spoke of a hypothesis dying the death by a thousand qualifications. His challenge to believers was to say what would have to occur, or to have occurred, to count as a disproof of the love of God or of God's existence.

  - type: text
    id: replies
    title: "Three replies"
    body: |
      Flew's challenge drew replies, and the three best known went in different directions. Each is told *according to* its author.

      **R. M. Hare** agreed with much of Flew's point. According to him, a religious commitment is not an assertion that observation could refute. He called it a **blik**: a way of seeing the world that we hold whatever happens, not a claim among others. His example is a man convinced that all university dons want to murder him; nothing the friendly dons do convinces him, and Hare says our own sane view of the dons is also a blik. Which blik one has, he adds, matters greatly.

      **Basil Mitchell** replied with the story of a partisan in an occupied country who meets a stranger and is convinced he is on the side of the resistance. Later the stranger is seen helping the police, yet the partisan goes on trusting him. According to Mitchell, the partisan's trust is not empty: he admits that the stranger's behaviour counts against it, but he will not let anything count decisively against it, because he has committed himself to trusting the stranger.

      **John Hick** (1922 to 2012) answered in another way, through his story of two travellers on a road who disagree about whether it leads to a Celestial City. According to his idea of **eschatological verification** (*eschatological* means about the last things, after death), if the city exists the traveller who expected it will be proved right on arrival. So the claim can be verified in principle, though only after death.

  - type: mcq
    id: replies-q
    title: "Whose reply is this?"
    prompt: |
      Flew asks what would count against "God loves us". One reply: "My trust is real. The evidence of suffering counts against it, and I feel the weight of that, but a trust that dropped at every difficulty would not be trust at all. I hold on, though not blindly." Which thinker's reply is closest, according to the three above?
    options:
      - text: "Basil Mitchell, with the partisan who goes on trusting the stranger."
        correct: true
        feedback: |
          Yes. Mitchell holds that evidence counts but is not decisive for a trust that has been given. The cost, which a critic would press, is that it becomes hard to say how much evidence would finally be enough.
      - text: "R. M. Hare, with the blik."
        feedback: |
          Hare's reply grants that nothing counts against a blik. The speaker above says evidence does count, which is Mitchell's point, not Hare's.
      - text: "John Hick, with the Celestial City."
        feedback: |
          Hick points to a future verification after death. The speaker above speaks of a trust held now, under present evidence.
      - text: "Flew himself, since he asks what would count against it."
        feedback: |
          Flew presses the question; he is the one the replies are answering.
    explanation: |
      Three answers, three directions: Hare gives up the claim to be an assertion, Mitchell keeps it as a claim held with trust under test, and Hick keeps it as a claim to be settled later.

  - type: mcq
    id: replies-q2
    title: "Which reply keeps a claim and a test?"
    prompt: |
      Flew's challenge is that a sentence with no possible test asserts nothing. Which reply answers it by giving the sentence a test, though one that lies beyond present experience?
    options:
      - text: "Hick: if the Celestial City exists, arrival there would verify the claim."
        correct: true
        feedback: |
          Yes. Hick accepts the demand for verification and says it can be met after death. A critic replies that a test only the believer can pass, and only if he is right, is a very odd kind of test, since if the road has no end nothing is ever settled.
      - text: "Hare: the blik is tested by the evidence of daily life."
        feedback: |
          For Hare a blik is not an assertion tested by the evidence. It frames how we see the evidence.
      - text: "Mitchell: the partisan's trust is tested after death."
        feedback: |
          Mitchell's test is present: the stranger's behaviour now. The afterlife belongs to Hick's reply.
      - text: "None of them: all three give up testing."
        feedback: |
          They differ here: Mitchell and Hick both keep some form of test, and only Hare says a blik is not the kind of thing evidence refutes.
    explanation: |
      Reading the replies side by side shows the structure of the debate. The disagreement is about what kind of test, if any, a religious sentence faces.

  - type: text
    id: braithwaite
    title: "Braithwaite: a way of life with stories"
    body: |
      Richard Braithwaite (1900 to 1990), a philosopher, gave the Eddington Memorial Lecture in 1955 under the title "An Empiricist's View of the Nature of Religious Belief". He accepted the empiricist demand that meaning be tied to use in experience, and he drew a different conclusion. According to him, religious utterances do not describe facts the way scientific hypotheses do. They are primarily **commitments**: in his words, declarations of adherence to a policy of action, declarations of commitment to a way of life.

      On his account a religious belief is an intention to behave in a certain way (for a Christian, the way of love) together with stories that support the intention. The stories, such as parables and the life of Jesus, may help sustain the commitment psychologically, but he held that they do not logically justify it, and the stories need not be believed as literal history.

      This is a **non-cognitive** view: it denies that the sentences chiefly state a proposition that is true or false. A *cognitive* view, or **cognitivism**, reads religious sentences at face value, as expressing propositions that are true or false.

  - type: build
    id: braithwaite-build
    title: "State Braithwaite's account"
    prompt: |
      According to Braithwaite, what is a religious belief? Complete the line.
    prefix: ''
    suffix: ''
    tiles: ['\text{religious belief}', '=', '\text{intention to follow a way of life}', '+', '\text{stories}', '\text{proof of God}', '\text{a prediction}']
    answers:
      - ['\text{religious belief}', '=', '\text{intention to follow a way of life}', '+', '\text{stories}']
    wrong:
      - answer: ['\text{religious belief}', '=', '\text{proof of God}', '+', '\text{stories}']
        feedback: |
          Braithwaite does not start from a proof. The commitment is primary and the stories sustain it.
      - answer: ['\text{religious belief}', '=', '\text{a prediction}', '+', '\text{stories}']
        feedback: |
          A prediction would be a claim checkable by experience, which is the cognitive reading he gives up.
    hint: "Two parts: something one intends to do, and something that helps one keep to it."
    explanation: |
      The intention is the core and the stories are support. That is why this view is non-cognitive: the first part is a declaration of intent, which is not true or false in the way a prediction is.

  - type: text
    id: phillips
    title: "Phillips: a language game of its own"
    body: |
      D. Z. Phillips (1934 to 2006), a philosopher who studied at Swansea and later held a chair at Claremont, drew on the late Wittgenstein's idea of language-games. His book *The Concept of Prayer* (1965) argues, according to the publisher's summary, that to understand prayer is to understand what is meant by the reality of God. According to critics who read him closely, he treats petition less as a request for outcomes in the natural world than as telling God the strength of one's desires, so prayer is an expressive act embedded in the believer's form of life. To understand it we must attend to its use in the language game of the religious community, not apply outside standards from science.

      A critic, Kai Nielsen, gave this approach a name in 1967, **Wittgensteinian fideism** (*fideism* means resting religion on faith rather than on reasons). Critics have called the label unfair; Phillips's defenders hold that religious language is answerable to its own standards of sense, not that it escapes all standards.

  - type: mcq
    id: phillips-q
    title: "A scientist asks about prayer"
    prompt: |
      A scientist designs a trial to see whether prayer changes recovery rates and says that prayer, as a claim about the world, is therefore testable. According to Phillips, what is the likely objection?
    options:
      - text: "The trial treats prayer as a technique for producing results, which misreads what prayer is for a believer; it is not a poor version of science."
        correct: true
        feedback: |
          Yes. For Phillips the point of prayer lies in its place in a form of life, not in a causal effect. A critic replies that many believers do pray expecting things to happen, so the view may describe only some believers, and the next cards put that objection in full.
      - text: "The trial is impossible because prayer has no effects of any kind."
        feedback: |
          Phillips does not say this. His point is about what prayer means, not a claim about its effects.
      - text: "The trial proves that prayer works."
        feedback: |
          A trial cannot prove this for Phillips, whose point is that its result would not settle what prayer means.
      - text: "Scientists are not allowed to study religion."
        feedback: |
          Neither Phillips nor his critics say that. The question is about what is being studied, not who may study it.
    explanation: |
      The same practice looks different under the two readings. A cognitivist can see the trial as a fair test of a claim; Phillips sees it as a category mistake.

  - type: mcq
    id: map
    title: "What does the creed do?"
    prompt: |
      Take the creed line "I believe in God, the Father almighty". Which pairing of view and reading is right?
    options:
      - text: "Cognitivist: it asserts that there is such a being. Braithwaite: it declares a commitment to a way of life. Phillips: it has its use within the practice of worship."
        correct: true
        feedback: |
          Yes. One sentence, three readings. They agree on the words and disagree on what saying them does.
      - text: "Cognitivist: it expresses a feeling. Braithwaite: it makes a prediction. Phillips: it describes a physical thing."
        feedback: |
          These are scrambled. A cognitivist reads it as a claim; Braithwaite as a commitment; Phillips as a move in a game with its own use.
      - text: "All three read it as a prediction that experience will confirm."
        feedback: |
          Only a strict verificationist reading would, and that reading is the one the others react to.
      - text: "All three say it has no meaning."
        feedback: |
          Only Ayer's strict verification drew that conclusion. Braithwaite and Phillips both take religious sentences to be meaningful, in another way.
    explanation: |
      The question is not whether the sentence is sincere but what kind of act saying it is.

  - type: mcq
    id: objection
    title: "The believer's objection"
    prompt: |
      Many believers reply to Braithwaite and Phillips: "When I say 'God exists' I mean that it is true of reality, not only that I commit myself to a way of life." What is the strongest form of the objection?
    options:
      - text: "A commitment without belief that its object is real changes what believers think they are doing: a creed that is only a policy is no longer the creed they recite."
        correct: true
        feedback: |
          Yes. If the believer would still say "I mean it as true", then a theory that tells the believer what they must mean has missed something. A defender replies that the non-cognitive views are offered as philosophical analysis, not as a report of every believer's thoughts, and that they may describe what the language does best.
      - text: "Believers always agree with the cognitivist reading."
        feedback: |
          That is too strong. Some traditions and thinkers do read religious language non-cognitively, and views differ even within a tradition.
      - text: "Commitments cannot be sincere."
        feedback: |
          Nobody in the debate says this. The question is whether a commitment is the whole story.
      - text: "Non-cognitive views are refuted by the verification principle."
        feedback: |
          The verification principle was the target of Ayer's critics, not a refuter of Braithwaite. Braithwaite agreed that such sentences are not verifiable and gave them meaning through their use.
    explanation: |
      The objection is a steelman of the face-value view: religious language is used as if it were true or false. The reply is a steelman of the rivals: the believer's own description need not be the best philosophical analysis.

  - type: mcq
    id: layer-fact
    title: "Layer: fact, debate or commitment (1)"
    prompt: |
      Which of these belongs to the layer of **established fact** (history of who said what)?
    options:
      - text: "Flew published his gardener paper in the Oxford journal *University* in 1950 to 1951, borrowing a parable from John Wisdom's 'Gods'."
        correct: true
        feedback: |
          Yes. This is a matter of record, checkable in the publication history.
      - text: "Religious sentences are not claims about reality."
        feedback: |
          This is a live debate: cognitivists and non-cognitivists disagree, and the lesson shows each at its best.
      - text: "God loves us."
        feedback: |
          This is a faith commitment. A lesson cannot settle it either way, and it should not be passed off as fact in either direction.
      - text: "Phillips's view is the correct philosophy of religion."
        feedback: |
          Whether it is correct is a debate among philosophers, with critics such as those who coined the label *fideism*.
    explanation: |
      Keeping the three layers apart is the habit that lets a believer and a sceptic read the same lesson and each say it is fair.

  - type: mcq
    id: layer-debate
    title: "Layer: fact, debate or commitment (2)"
    prompt: |
      Which of these is a **live debate among scholars**, not a fact and not a faith commitment?
    options:
      - text: "Whether religious sentences are best read as claims that are true or false, or as commitments or uses within a form of life."
        correct: true
        feedback: |
          Yes. Informed philosophers divide on it, so it is neither a settled fact nor a personal act of faith.
      - text: "Ayer's *Language, Truth and Logic* appeared in 1936."
        feedback: |
          A date is a matter of record, so it belongs to the layer of fact.
      - text: "God exists."
        feedback: |
          This is a metaphysical or faith commitment, whether affirmed or denied.
      - text: "Braithwaite gave a lecture in 1955 on religious belief."
        feedback: |
          Again a matter of record, not of debate.
    explanation: |
      Notice that the debate also shapes the other two layers: what counts as a faith commitment depends on whether the sentence is a claim in the first place.

  - type: text
    id: summary
    body: |
      **Next:** the views here ask whether religious sentences are claims at all. A different tradition asks how a claim about God could be meant, if God is beyond everything we can describe. The next lesson, Analogy, Negation and Apophatic Speech, turns to Aquinas, Maimonides, Pseudo-Dionysius and Eckhart, who answered by speaking of the divine by analogy and by saying what it is not.
