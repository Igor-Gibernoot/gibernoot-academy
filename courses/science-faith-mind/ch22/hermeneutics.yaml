id: ch22-hermeneutics
title: "Interpretation: Literal, Allegorical, Historical"
kind: concept
own: |
  The setting: a **text** here is a sacred or authoritative writing (a Torah scroll, a gospel, the Qur'an). **Hermeneutics** is the study of how a text is understood: by what method, and who decides. Each reading is told *according to* its school; none is declared the winner.
  - **Philo** (Philo of Alexandria, late 1st century BCE to mid 1st century CE, a Jewish writer in Greek). **Allegory** reads a passage as saying something other than its surface. Philo used it above all where the plain sense seemed problematic (Adam's rib read as powers of the mind), yet he did not drop the literal sense or the literal law:
    {{ $$\text{plain sense fails}\to\text{hidden meaning}$$ }}
  - **Origen** (c. 185 to c. 253, Christian teacher). Scripture has, like a person, a body, a soul and a spirit: the plain sense, an intermediate sense, and the spiritual sense about Christ and the mysteries of faith. Some passages, he held, lack a usable plain sense:
    {{ $$\text{Scripture}\ =\ \text{body}\ +\ \text{soul}\ +\ \text{spirit}$$ }}
  - **Midrash and peshat.** In rabbinic Judaism, **derash** (from *darash*, "to seek, inquire") is reading that probes the text for more, and its results are called **midrash**; **peshat** is the plain, contextual sense. Later tradition added two more, **remez** (hint) and **sod** (secret), giving PaRDeS. Midrash treats odd wording as an opening, as when "very good" is read as including the Evil Desire.
  - **Tafsir.** **Tafsir** is explanation of the Qur'an. According to its classical method, one explains by transmitted material (*bi'l-ma'thur*) or, for some scholars, also by reasoned opinion (*bi'l-ra'y*). Qur'an 3:7 speaks of **muhkamat** (clear) and **mutashabihat** (ambiguous) verses, and commentators differ on where the sentence pauses and so on who can know the ambiguous verses' final meaning.
  - **Historical-critical reading.** Spinoza (1632 to 1677, *Theological-Political Treatise*, 1670) held, in essence, that the method of interpreting Scripture is the method of interpreting nature: take nothing from the text that its own language, authors, circumstances and history do not support. The aim is what the author meant, not whether it is true:
    {{ $$\text{meaning}=\text{author's meaning}$$ }}
  - **Gadamer** (1900 to 2002, *Truth and Method*, 1960). The **hermeneutic circle**: a text is understood by its whole and its parts, each in light of the other; Heidegger and Gadamer added that the reader always brings **prejudgments** (*Vorurteile*) that can open the text and be revised by it. Understanding is a **fusion of horizons**, the reader's and the text's:
    {{ $$\text{whole}\ \longleftrightarrow\ \text{parts}$$ }}
  - **Three layers.** Fact: what these readers argued and how each method works. Debate: whether the author's meaning is the only target, and whether a text has one meaning. Commitment: whether a text is divinely authored and so has meanings no human author intended; each tradition answers for itself.

cards:
  - type: text
    id: hook
    title: "One verse, four readers"
    body: |
      Genesis 2:21 to 22 says, in essence, that God took one of the man's ribs while he slept and made a woman from it. Four people read it. One takes it as a report of a bodily event. One thinks the picture is too strange to be meant that way and looks for what it points to. One asks what a writer in the ancient world, speaking to his first listeners, meant by telling it. One says: whoever reads it already brings a lifetime of questions to it.

      Before any theory, a guess. Guessing first is the point, and each view below is told *according to* its tradition; nothing asks you to believe or doubt anything religious.

  - type: mcq
    id: guess
    title: "Guess: does a text have one meaning?"
    prompt: |
      A friend says: "A text means what it says. Two people who disagree about a passage cannot both be right." What is the most natural reply?
    options:
      - text: "Sometimes the disagreement is about *which question* is asked: what the author meant, what the words say in their setting, what the text means for readers now. Those can have different answers."
        correct: true
        feedback: |
          Yes. Much of the lesson is about sorting out the questions that people mean by "what does it say?". Some disagreements are real, others are two readers answering different questions.
      - text: "A text has no meaning until a reader makes one up, so any reading is as good as any other."
        feedback: |
          This overshoots. Even those who stress the reader's part, as Gadamer does, hold that the text pushes back and can correct a reading.
      - text: "The friend is right: meaning is fixed by the words alone, and anyone who disagrees has misread."
        feedback: |
          Words alone leave much open: figures of speech, a language that has changed, what the speaker took for granted. Readers across the traditions agree that this has to be reasoned out.
      - text: "Only experts can say what a text means, so ordinary readers should not try."
        feedback: |
          Some traditions give a large role to trained interpreters, but none says ordinary readers have nothing to bring. The next cards show who decides in different traditions.
    explanation: |
      The puzzle is already visible: "what does it say?" hides several questions, and different traditions answer different ones.

  - type: text
    id: recall
    title: "Recall: ritual words"
    body: |
      From the lesson Ritual, Performative Speech and Liturgy: Austin (1911 to 1960) separated a **constative** (an utterance that describes, true or false) from a **performative** (saying it is doing something, happy or unhappy). A sacred text can hold both kinds of sentence, and a reader first has to decide which kind a given sentence is. This lesson asks how a reader reaches a meaning at all: by method, and by whose authority.

  - type: text
    id: philo
    title: "Philo: when the plain sense is a problem"
    image:
      src: img/philo.webp
      alt: "A black and white engraved bust portrait of a bearded man in a cap, labelled as Philo of Alexandria"
      caption: "Philo of Alexandria, as imagined in André Thévet's 1584 book of famous men; since he lived some fifteen centuries earlier, this cannot be a likeness from life."
      credit: "André Thévet, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:PhiloThevet.jpg"
    body: |
      **Philo of Alexandria** (late 1st century BCE to mid 1st century CE; the exact dates are uncertain) was a Jewish writer in Greek in Alexandria, a city of Greeks, Egyptians and Jews. According to the Stanford Encyclopedia of Philosophy, he is closely associated with **allegory**: reading a passage as saying something other than, or beyond, its surface. He drew on Greek allegorical traditions and applied the method to the Torah, the five books of Moses.

      Allegory mattered most to him where the literal reading becomes difficult. He found the story of Eve made from Adam's rib improbable if taken literally, and read the "ribs" as powers of Adam's mind. But it would be wrong to call him *only* an allegorist: he did not discard the literal sense, and he criticised interpreters who prized the symbolic meaning while neglecting the literal law. He presented himself as a pious Jew who held that the commandments should be kept as well as understood.

  - type: mcq
    id: philo-q
    title: "What did Philo do with the literal sense?"
    prompt: |
      According to scholars of Philo, which description fits his use of allegory best?
    options:
      - text: "He turned to allegory especially when the literal reading seemed improbable or unworthy, while still taking the literal text and the literal law seriously."
        correct: true
        feedback: |
          Yes. The literal sense and the allegory were not rivals for him; a hidden meaning was sought where the plain one gave trouble, and the law was still to be kept.
      - text: "He held that the literal sense is always false and only the allegory is true."
        feedback: |
          This is the tempting caricature of every allegorist. Philo criticised readers who neglected the literal law, so he did not hold the plain sense worthless.
      - text: "He rejected allegory and read the Torah only as history."
        feedback: |
          He is the best-known early Jewish allegorist. The point is that he combined it with literal observance.
      - text: "He used allegory only to make the Torah agree with Greek philosophy, never for any other reason."
        feedback: |
          Scholars do stress his use of Greek philosophy, and his Platonism is debated. But the problem of an improbable plain sense, such as the rib, is one reason he gives; the whole is not reducible to a single motive.
    explanation: |
      Two views on the same method: one sees allegory as a way to save the text when the plain sense fails, another as a way to join Torah and Greek philosophy. Scholars weigh the two motives differently.

  - type: text
    id: origen
    title: "Origen: a body, a soul and a spirit"
    image:
      src: img/origen.webp
      alt: "A 1700 engraving of Origen teaching a group of students"
      caption: "Origen (c. 185 to c. 253), in an imagined teaching scene engraved by Jan Luyken in 1700; he taught in Alexandria and later in Caesarea."
      credit: "Luyken, Jan (1649-1712), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:OrigenStudentsLuyken.jpg"
    body: |
      **Origen** (c. 185 to c. 253), a Christian teacher from Alexandria, followed Philo as a reader. In his work *On First Principles* he compares Scripture to a human being, who is said to have body, soul and spirit, and says Scripture has the same three. The **body** is the plain, historical sense. The **spirit** concerns the work of Christ and the mysteries of faith. The **soul** is an intermediate sense, as when Paul reads the law against muzzling an ox that treads grain as being about ministers.

      According to Origen, some passages have no usable plain sense at all, and then the reader must look to the deeper layers. Others, such as Epiphanius, criticised him: Origen read God's sewing of coats of skin (Genesis 3:21) as a metaphor, and his critics held that this denied the plain event.

      Two views, then, within Christianity: a reader who finds deeper layers behind the surface, and a reader who fears that deeper layers can dissolve what the text plainly says.

  - type: text
    id: midrash
    title: "Midrash: reading the gaps"
    body: |
      In rabbinic Judaism, the plain, contextual sense is called **peshat**. Next to it stands **derash**, from the verb *darash*, "to seek, to inquire". Readings of this second kind, and the collections that hold them, are called **midrash**. Two main types are *midrash halakha*, which draws out law from the text, and *aggadic* midrash, which explains the non-legal parts (stories, ethics, parables) with much greater freedom.

      Midrash treats puzzles in the text as openings: an extra word, a strange order of events, a repeated story. Take Genesis 1:31, where God sees all that was made and it is "very good". According to a midrash in *Genesis Rabbah* (9:7), the "very" points to two desires in human beings, the Good Desire and the Evil Desire: without the second, no one would build a house, marry or raise children. A single word becomes a reflection on human nature.

      Later tradition added two more levels, **remez** (hint) and **sod** (secret, mystical), and the four are known by their first letters as PaRDeS, "orchard".

  - type: mcq
    id: midrash-q
    title: "Is this plain sense?"
    prompt: |
      According to the midrash on "very good" (Genesis 1:31), why can the reading not simply be called the plain sense, and what does it do instead?
    options:
      - text: "It is a derash reading: it takes a word as a clue and draws a reflection from it (the Evil Desire also drives building and family life), while the plain sense says only that creation was good."
        correct: true
        feedback: |
          Yes. The midrash does not claim that the author of Genesis meant this; it reads the text as speaking to a further question.
      - text: "It is a mistake, because midrash is forbidden to Jews."
        feedback: |
          Midrash is a central part of rabbinic literature, and generations of rabbis wrote and studied it.
      - text: "It is a historical report that the Evil Desire was created on the sixth day."
        feedback: |
          It is a homiletical reading, a lesson drawn from a word. It does not present itself as a dated report.
      - text: "It shows that the text of Genesis was changed by later rabbis."
        feedback: |
          Midrash leaves the wording as it is and works with it; the word "very" is in the text.
    explanation: |
      Notice the difference from allegory. Allegory looks beneath the surface; midrash stays on the words and asks what they invite. Some traditions hold, and some scholars debate, how these relate to the plain sense.

  - type: text
    id: tafsir
    title: "Tafsir: clear verses and ambiguous ones"
    body: |
      In Islam, **tafsir** is commentary that explains the Qur'an; its author is a *mufassir*. According to the classical Sunni method, the strongest tafsir is *bi'l-ma'thur*, "by what is transmitted": it explains a verse by other verses, by reports from the Prophet Muhammad and by the reports of his companions and their successors. Some scholars also allow tafsir *bi'l-ra'y*, "by opinion", reasoned judgment, as long as it rests on the main sources; others reject it. A towering example is **al-Tabari** (839 to 923; some sources give 838 for his birth), whose commentary *Jami' al-bayan* sets out the transmitted reports verse by verse and gives his own judgement among them.

      The Qur'an itself speaks of two kinds of verse in Sura 3 (*Al 'Imran*), verse 7: **muhkamat**, verses of clear, established meaning, and **mutashabihat**, verses that are ambiguous or whose meaning is not plain. Commentators say the ambiguous verses are to be read in light of the clear ones.

      The verse also raises a question of grammar. If the sentence pauses after "except God", then only God knows the final meaning (*ta'wil*) of the ambiguous verses. If it does not, then those firmly grounded in knowledge know it as well. Commentators report both readings.

  - type: mcq
    id: tafsir-q
    title: "Where does the pause matter?"
    prompt: |
      According to the commentators on Qur'an 3:7, why does it matter where the verse pauses?
    options:
      - text: "It decides whether *ta'wil*, the final meaning of the ambiguous verses, is known only to God or also to those firmly grounded in knowledge, so it decides how much room human interpreters have."
        correct: true
        feedback: |
          Yes. Both readings are reported, and the choice fixes what interpreters may claim to know.
      - text: "It decides whether the Qur'an contains ambiguous verses at all."
        feedback: |
          The verse itself says there are clear and ambiguous verses; the debate is about who can know the latter's final meaning.
      - text: "It shows that scholars reject tafsir altogether."
        feedback: |
          The debate happens inside tafsir. Commentators such as al-Tabari discussed it while explaining the verse.
      - text: "It is a pure matter of printing, with no effect on meaning."
        feedback: |
          Though the pause is a matter of reading the sentence, it changes the claim about who can know. That is why commentators weighed it.
    explanation: |
      The same structure as before: a text with a clear part and a hard part, and a tradition that asks who is entitled to say what the hard part means. Notice that the Qur'an itself supplies the categories.

  - type: text
    id: historical
    title: "Historical-critical reading: what the author meant"
    body: |
      A fourth family reads a sacred text as one reads any ancient book. **Baruch Spinoza** (1632 to 1677), in his *Theological-Political Treatise* (published anonymously in 1670), argued, in essence, that the method of interpreting Scripture does not differ from the method of interpreting nature. In both, one starts from what the thing itself shows: nothing is to be attributed to Scripture that cannot be established from its own history. That means learning the original languages (Hebrew and Greek), gathering each book's main statements and noting its obscurities, and studying who the authors were, in what circumstances they wrote, and how the books were handed down.

      The target is **what the author meant**, which Spinoza kept apart from whether it is true. If the text calls God "jealous" and nothing in it signals a figure of speech, then, he said, one must take the meaning at face value even if one thinks God is not literally jealous. Reading for the author's meaning does not settle what readers should believe.

      This is the family usually called **historical-critical**. Traditions respond in different ways: some adopt its tools while holding that Scripture also has meanings beyond what a human author intended, others hold that its results undermine faith, and others hold that they leave faith where it was.

  - type: mcq
    id: whose-method
    title: "Whose method?"
    prompt: |
      A reader says: "I will first learn the original language, ask who wrote this passage, when, and for whom, and take its meaning to be what that author meant in that setting." Which family of reading is this?
    options:
      - text: "Historical-critical reading, as in Spinoza's method."
        correct: true
        feedback: |
          Yes. Language, authors, circumstances and transmission are the tools, and the author's meaning is the target.
      - text: "Philo's allegory, which looks beneath the surface for a hidden meaning."
        feedback: |
          Allegory goes beyond what a first audience would have taken the words to say. The reader here stays with the author's own setting.
      - text: "Midrash, which draws out further meanings from odd wording."
        feedback: |
          Midrash is interested in what the words invite, and does not claim to recover the author's own intention. This reader does claim it.
      - text: "Tafsir *bi'l-ma'thur*, which relies first on transmitted reports."
        feedback: |
          Transmitted reports are the starting point there, rather than the author's circumstances reconstructed by the reader.
    explanation: |
      Each family answers "what does it say?" differently: beneath the surface, in the gaps, by transmission, or by the author's setting. None needs to be wrong in every use; they ask different questions of the same words.

  - type: text
    id: gadamer
    title: "Gadamer and the hermeneutic circle"
    image:
      src: img/gadamer.webp
      alt: "A portrait photograph of Hans-Georg Gadamer, an elderly man with white hair"
      caption: "Hans-Georg Gadamer (1900 to 2002), a German philosopher whose book Truth and Method (1960) made interpretation a central question of philosophy."
      credit: "Leena Ruuskanen, CC BY 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Hans-Georg_Gadamer_(cropped).jpg"
    body: |
      All these readers meet an old puzzle. To understand a sentence you need the whole passage; to understand the passage you need its sentences. This is the **hermeneutic circle**: a text is understood through its whole and its parts, each in light of the other. It is not a vicious circle but a back-and-forth in which a first guess at the whole is corrected by the parts, and the parts are then read again.

      **Hans-Georg Gadamer** (1900 to 2002) took the circle further in *Truth and Method* (German 1960), building on Heidegger (*Being and Time*, 1927). According to him, a reader never comes empty-handed: we bring **prejudgments** (*Vorurteile*), meanings and expectations that come with our language and tradition. He rehabilitated the word: prejudgments are not simply biases to be removed; they are what lets a text speak to us at all, and they stay open to revision when the text resists them.

      Understanding, on this view, is a **fusion of horizons**: the reader's horizon (what can be seen from where I stand) meets the text's, and a wider shared one results, which is never final. Gadamer rejected subjectivism, the idea that meaning is whatever the reader feels. Understanding is guided by the matter the text is about.

  - type: order
    id: circle-order
    title: "One turn of the circle"
    prompt: |
      According to the hermeneutic circle, put in order one turn of a careful reading of a difficult passage.
    steps:
      - "Form a first guess about what the whole passage is about, from the prejudgments you bring."
      - "Read each sentence in light of that guess."
      - "Notice a sentence that does not fit the guess."
      - "Revise the guess about the whole to account for that sentence."
      - "Read the sentences again in light of the revised whole, and repeat."
    hint: "A guess about the whole comes first, then the parts test it, then the guess is changed, and the parts are read again."
    explanation: |
      The circle runs between whole and parts. What keeps it from being a trap is that the parts can correct the whole: a text that resists the first guess is what forces a better one.

  - type: mcq
    id: objection
    title: "Then anything goes?"
    prompt: |
      Objection: "If every reader brings prejudgments, and understanding is a fusion of horizons, then any reading is as good as any other." Which reply is the fairest, according to Gadamer's defenders?
    options:
      - text: "Prejudgments are the starting point, and they are open to revision: a reading that ignores the words, the context or objections can be shown to fail, so some readings are better than others."
        correct: true
        feedback: |
          Yes. Gadamer rejected subjectivism: understanding is guided by the matter at issue, and a good reader lets the text correct the first guess.
      - text: "Yes: understanding is subjective, and that is Gadamer's point."
        feedback: |
          Gadamer denied this. On his account, understanding is not reaching an inner subjective meaning but being guided by what the text is about.
      - text: "Only the author's original intention counts, so the reader's horizon should be removed entirely."
        feedback: |
          That is the historical-critical ideal, and its defenders have good reasons for it. Gadamer's reply is that no reader can drop the horizon they stand in, and that the question the text raises for us is also part of understanding.
      - text: "Truth is decided by the largest community of readers."
        feedback: |
          Gadamer gave tradition real weight, but not a vote. Critics such as Habermas worried that his emphasis on tradition was too conservative; the point still is that a text can correct readers.
    explanation: |
      Two views remain. A historical-critical reader hears Gadamer as giving up the author's meaning too quickly; a Gadamerian hears the historical-critical reader as hiding the horizon they read from. Thoughtful readers weigh the two.

  - type: mcq
    id: layers
    title: "Which layer?"
    prompt: |
      Three claims. (1) Spinoza's 1670 Treatise proposed reading Scripture from its own history and language. (2) Whether a text's meaning is only what its author meant. (3) That a sacred text is divinely authored and so has meanings no human author intended. Which labelling is correct, as fact, live debate, or commitment?
    options:
      - text: "(1) fact about what Spinoza argued; (2) live debate among interpreters; (3) faith commitment of a tradition."
        correct: true
        feedback: |
          Yes. The first is a matter of the text, the second of rival theories of interpretation, the third of belief.
      - text: "(1) debate; (2) fact; (3) debate."
        feedback: |
          What Spinoza proposed is a matter of record. Whether meaning is only authorial is what interpreters dispute.
      - text: "(1) commitment; (2) fact; (3) fact."
        feedback: |
          Only the first is settled by the record of what Spinoza wrote. The second is disputed, and the third is held on faith (or rejected for other reasons), not shown by the method of reading.
      - text: "(1) fact; (2) fact; (3) fact."
        feedback: |
          Only (1) is settled. Interpreters disagree about (2), and (3) rests on a belief about the origin of the text.
    explanation: |
      Keeping the layers apart lets a believer and a sceptic agree on (1), argue about (2), and part ways on (3) without talking past each other.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where people part ways, and why.** The readers here differ first in the question they ask: what the plain words say, what lies beneath them (Philo, Origen), what the words invite (midrash), what has been handed down about them (tafsir), what the author meant (historical-critical), or how reader and text meet (Gadamer). They differ next on whether a sacred text has meanings no human author intended, a premise of faith or its absence, not a result of method. What stays open: whether a text can have more than one right reading, and who has the standing to decide.

      **Next:** the lesson Translation and What Gets Lost asks what happens to a text's meaning when it moves between languages, and whether the language we think in shapes the questions we can ask.
