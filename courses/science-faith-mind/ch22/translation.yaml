id: ch22-translation
title: "Translation and What Gets Lost"
kind: concept
own: |
  The setting: a **source text** (the original wording of a scripture) is carried into a **target language** by a translator, who must choose among senses, forms and readers. Each view below is told *according to* its holders; none is declared the winner.
  - **A word is a bundle of senses.** The Hebrew *ruach* ranges over wind, breath and spirit, and no single English word covers all three. A translator of Genesis 1:2 must pick, so every rendering gains one sense and loses others:
    {{ $$\text{translation}=\text{a choice among senses}$$ }}
  - **Sacred languages.** According to the common Muslim teaching, the Qur'an is the Arabic wording itself, so an English version is a translation of its *meanings* and recitation in prayer stays in Arabic. In the Vedic tradition, chant methods guard every syllable because, in the tradition's view, a mantra acts through how it sounds. Jerome's Latin Vulgate (c. 382 to 405) became the Latin Church's standard text; Trent (1546) called it "authentic" for public use.
  - **Translation as interpretation.** The Septuagint (Greek, Alexandria, from the 3rd century BCE) rendered Hebrew *almah* in Isaiah 7:14 as Greek *parthenos*. Whether this was a slip, a reading, or a faithful choice is debated; the choice shaped later readers.
  - **Two aims.** Eugene Nida (*Toward a Science of Translating*, 1964) separated **formal equivalence** (match the source's form and content, element by element) from **dynamic equivalence** (aim at the same response in the reader):
    {{ $$\begin{gathered}\text{formal}:\ \text{match the words}\\ \text{dynamic}:\ \text{match the effect}\end{gathered}$$ }}
    Luther's *allein* ("only") in Romans 3:28 is a famous dynamic-leaning choice, defended in 1530 on grounds of German idiom and of Paul's sense.
  - **Linguistic relativity.** Edward Sapir (1884 to 1939) and Benjamin Lee Whorf (1897 to 1941) are linked to the idea that the language we speak shapes how we think; the "Sapir-Whorf hypothesis" is a later label. The **strong** form (linguistic determinism) says language fixes thought; the **weak** form says it influences habits of attention and memory:
    {{ $$\begin{gathered}\text{strong: language fixes thought}\\ \text{weak: language nudges thought}\end{gathered}$$ }}
  - **Evidence.** Colour terms (Russian speakers were faster across the light-blue and dark-blue boundary in one study; a 2020 re-test found it weaker), spatial reference (Guugu Yimithirr speakers use compass directions where English speakers say left and right) and Whorf's Hopi time claim (answered by Malotki in 1983, with relativists replying that Whorf meant a different conception, not no concept). Findings support at most the weak form.
  - **Three layers.** Fact: what these translations and studies say. Debate: how large and how general the effects of language on thought are. Commitment: whether scripture's authority sits in its original words or in its message, which decides how much loss in translation matters.

cards:
  - type: text
    id: hook
    title: "Wind, breath or spirit?"
    body: |
      Genesis 1:2 describes the earth before creation. Three well-known English Bibles end the verse differently. The King James Version says "the Spirit of God moved upon the face of the waters". The New International Version says "the Spirit of God was hovering over the waters". The New Revised Standard Version Updated Edition says "a wind from God swept over the face of the waters".

      Same Hebrew, three English sentences. Before any theory, a guess. Guessing first is the point, and each view below is told *according to* its tradition; nothing asks you to believe or doubt anything religious.

  - type: mcq
    id: guess
    title: "Guess: why do the translations differ?"
    prompt: |
      The three English versions of Genesis 1:2 disagree on one word, translated "Spirit" or "wind". What is the most likely cause?
    options:
      - text: "The Hebrew word (*ruach*) has several senses, and English has no single word that carries all of them, so each translator picks."
        correct: true
        feedback: |
          Yes. This is the ordinary situation in translation: one word in the source, a choice in the target.
      - text: "Some translators are careless and the others are right."
        feedback: |
          Careless errors exist, but here the three versions come from careful committees. The difference is a real choice, and the NRSV even prints the other reading in a footnote.
      - text: "The Hebrew text itself differs between the three Bibles."
        feedback: |
          The three versions translate the same Hebrew verse. The difference is in the English, not in the source.
      - text: "English has more words for spirit than Hebrew, so a translator can always find an exact match."
        feedback: |
          This is the reverse of the problem. The trouble is that the target language often lacks a word with the same range.
    explanation: |
      The lexicon of Brown, Driver and Briggs lists *ruach* as wind, breath, mind and spirit. A translator of the verse must choose one English word, or add a footnote.

  - type: text
    id: senses
    title: "A word is a bundle of senses"
    body: |
      A Hebrew word is not a label for one thing. *Ruach* names moving air, so it can be a wind, a breath, and by extension the life-force that animates a living being, or the "spirit" of a person or of God. The Brown-Driver-Briggs lexicon records these ranges, and its examples include "breath of life" in Genesis 6:17.

      A translator therefore faces three questions at once. Which sense does the sentence need? Which target word comes closest? And how much of the original's range is lost, or added, by that word? In Genesis 1:2, "Spirit" suggests a person-like presence and "wind" a force of nature; each reading also sounds different next to the word "God" in the same phrase.

      Notice that this is not a defect of any one language. It is what a word does: the senses of a word in one language rarely line up with the senses of any word in another.

  - type: mcq
    id: senses-q
    title: "What does the translator lose?"
    prompt: |
      A translator renders *ruach* in Genesis 1:2 as "wind". According to those who prefer "Spirit", what is lost, and what do those who prefer "wind" reply?
    options:
      - text: "The suggestion of a divine presence acting on the waters is lost; the reply is that the Hebrew phrase may describe a powerful natural wind, and that 'Spirit' can import later theology into an early verse."
        correct: true
        feedback: |
          Yes. Both sides read the same word; each worries about a different loss. One fears losing the presence of God, the other fears adding ideas that came later.
      - text: "Nothing is lost, because a good translation is always the same as the original."
        feedback: |
          Translators of every school say otherwise: some loss or addition is unavoidable, and debate is about which is the lesser.
      - text: "The whole verse becomes meaningless."
        feedback: |
          Both readings give a clear sentence. The disagreement is over which shade of meaning the original more likely carried.
      - text: "Nothing, because 'wind' and 'spirit' are two spellings of the same English word."
        feedback: |
          They are different words with different associations; that is the point of the puzzle.
    explanation: |
      Neither choice is free. The footnote of the NRSV, which prints "spirit of God" as the alternative, is the translator admitting the choice.

  - type: text
    id: qur-an
    title: "Sacred languages: the Qur'an in Arabic"
    body: |
      Some traditions treat the original language as part of the sacred thing. According to the Qur'an itself, God sent it down "as an Arabic Quran so that you may understand" (12:2, in Mustafa Khattab's translation *The Clear Quran*). According to the common Muslim teaching, the Qur'an is therefore the Arabic wording, and a rendering into another language is not the Qur'an but an attempt to convey its meaning.

      That is why English editions often say so on the cover. Marmaduke Pickthall's 1930 version is called *The Meaning of the Glorious Koran*, and the Saheeh International edition is titled a translation of the meaning of the Qur'an. According to the majority of Muslim jurists, the recitation in the ritual prayer (*salah*) must be in Arabic, because a translation is an explanation of the meaning and not the Qur'an itself; the Hanafi school records a minority view that allows another language for those who cannot learn Arabic. Outside prayer, reading a translation of the meaning is encouraged.

      Notice what is claimed. It is not that translation is useless, but that the translation is a different kind of object: a commentary on the meaning in another tongue, never the Qur'an itself.

  - type: mcq
    id: qur-an-q
    title: "What does 'meaning' in the title say?"
    prompt: |
      Pickthall called his 1930 English version *The Meaning of the Glorious Koran*, not "The Glorious Koran". According to the common Muslim teaching, why?
    options:
      - text: "Because the Qur'an is the Arabic wording itself, a version in another language can only convey what it means."
        correct: true
        feedback: |
          Yes. The title keeps the line between the Qur'an (the Arabic) and a translation (an aid to its meaning).
      - text: "Because the translator thought the Qur'an has no meaning that can be put into words."
        feedback: |
          The opposite: the translator offers the meaning, while saying that the wording cannot be carried over.
      - text: "Because English cannot express any idea found in the Qur'an."
        feedback: |
          Translators and readers use English for the Qur'an's ideas all the time. The claim concerns the wording as the sacred form, not whether ideas can be conveyed.
      - text: "Because Pickthall wanted to hide that it was a translation."
        feedback: |
          The title does the reverse: it signals that this is a translation, and an imperfect substitute for the Arabic.
    explanation: |
      One view: the sacred thing is the Arabic text, so translation is always second. A rival view, held by translators and some teachers, stresses that readers who cannot read Arabic still need the meaning; that is why such translations exist and are widely used.

  - type: text
    id: sanskrit
    title: "Sacred sound: Sanskrit and the mantra"
    body: |
      In the Vedic tradition of India, the sacred hymns were passed on by mouth for a very long time, and chant traditions are often counted among the oldest unbroken oral traditions. According to descriptions of the tradition, special methods of recitation were designed so that not even a syllable is altered: each text is recited in several ways that check one another. Pronunciation, pitch accent and vowel length are taught as a field of study.

      Behind this lies a view, held by the tradition, that a **mantra** (a sacred formula) acts through how it sounds when spoken, not only through what it says. If so, translating a mantra changes the very thing that matters: the sound.

      Recall from the lesson Ritual, Performative Speech and Liturgy that one scholar, Frits Staal, argued ritual rules can be meaningless in the usual sense. Here is a different, tradition-internal reason: the sound is the point, so a word-for-word meaning is not what the user of the mantra is after.

  - type: text
    id: vulgate
    title: "Jerome and the Latin Bible"
    image:
      src: img/jerome.webp
      alt: "A painting of an elderly man at a desk writing, with a skull and books on the table"
      caption: "Jerome at work, painted by Caravaggio around 1605 to 1606, long after Jerome's time (he died in 419 or 420), so the scene is imagined."
      credit: "Caravaggio, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Saint_Jerome_Writing-Caravaggio_(1605-6).jpg"
    body: |
      **Jerome** (died 419 or 420) was a scholar who lived for many years in Bethlehem. Pope Damasus I commissioned him in 382 to revise the existing Latin Gospels. His Latin Bible, later called the **Vulgate** ("common" version), took shape from 382 to about 405 (Britannica gives about 405 for finishing the Old Testament from the Hebrew, and in another passage a span from 391 to 406). For much of the Old Testament he worked from the Hebrew, which he called the *Hebraica veritas* ("Hebrew truth"), not from the Greek Septuagint, a choice that some of his contemporaries disliked.

      The Council of Trent (fourth session, 8 April 1546) declared the old Latin edition in use (the Vulgate) "authentic" for public lectures, disputations, sermons and expositions, and said it had been approved by the long usage of the Church. The wording is about which Latin text to use in public. Scholars have asked whether it meant more than a juridical status, that is, whether it also claimed the Latin was faithful in every detail; the decree's own wording points to the first reading.

  - type: mcq
    id: vulgate-q
    title: "What did 'authentic' mean?"
    prompt: |
      According to the decree's wording and to scholars who discuss it, what did Trent most plausibly mean in 1546 by calling the Vulgate "authentic"?
    options:
      - text: "That it was the authoritative Latin text for public use in the Church, mainly a juridical judgment, not a claim that every detail of the Latin is accurate."
        correct: true
        feedback: |
          Yes. This is the reading the decree's wording supports (the text to use in public lectures, sermons and debates), though scholars have debated it and some readers took the word to mean that the Latin was accurate in every detail.
      - text: "That the Vulgate was dictated by God in Latin."
        feedback: |
          The decree says nothing of the kind. Jerome is remembered as a translator who worked from Hebrew and Greek.
      - text: "That the Hebrew and Greek texts were abolished."
        feedback: |
          The decree is about which Latin edition to use in public teaching. It does not declare the Hebrew and Greek texts void.
      - text: "That every Latin Bible printed after 1546 was identical."
        feedback: |
          Not so. The decree asked that the Vulgate be printed as correctly as possible, and later official editions followed (1590 and 1592), because printed copies differed.
    explanation: |
      Two readings of "authentic" have been argued: a legal one (this text is the one to use) and an accuracy one (this text is faithful). The decree's wording points to the first. Which reading one holds affects how seriously one takes errors found in the Latin.

  - type: text
    id: septuagint
    title: "The Septuagint: Hebrew into Greek"
    body: |
      The earliest surviving Greek version of the Hebrew Bible is the **Septuagint** ("seventy"). It was made for Greek-speaking Jews in Egypt, and scholars date it to the 3rd century BCE, in or near Alexandria. According to Britannica, analysis of the language shows that the Torah (the five books of Moses) was translated first, near the middle of the 3rd century BCE, and the rest in the 2nd century BCE. The story below concerns only the Torah.

      An old story, in the *Letter of Aristeas*, tells it differently: the king of Egypt asked for a copy of the Jewish law for his library, and 72 translators came from Jerusalem and finished in 72 days. No one knows who wrote the letter, and historians date it well after the translation itself, so the story is a legend about the translation, not a record of it. Britannica notes that the legend names the Egyptian king Ptolemy II Philadelphus (who reigned 285 to 246 BCE) and that its source, the *Letter of Aristeas*, is unreliable.

      Many early Christians used the Greek version. Augustine, for one, held that its translators were inspired, which is why Jerome's turn to the Hebrew met resistance.

  - type: text
    id: isaiah
    title: "A word that changed readers: Isaiah 7:14"
    body: |
      Isaiah 7:14 contains the Hebrew word *almah*. Scholars generally read it as a marriageable young woman. The Septuagint renders it with the Greek *parthenos*, which usually means "virgin", and the Gospel of Matthew later quotes the Greek wording. English Bibles differ: the NRSVUE and the NET print "young woman", while the KJV, NIV and ESV print "virgin" (the NIV footnote adds "or young woman").

      Two views on the Greek choice. According to one, *parthenos* was an interpretive choice that carried more than the Hebrew said. According to another, young women were expected to be virgins until marriage, so the Greek reflects how readers already understood the word. Whether the Greek translator meant more than "young woman" cannot be settled for certain.

  - type: mcq
    id: isaiah-q
    title: "Translation or interpretation?"
    prompt: |
      A Hebrew word *almah* ("young woman") is rendered in Greek as *parthenos* ("virgin", usually). What does this example show about translation?
    options:
      - text: "A translation choice can also be an interpretation, and later readers may build on the translator's reading; whether the choice was a slip or a reading is itself debated."
        correct: true
        feedback: |
          Yes. The Greek wording is what Matthew's readers had. The case shows how a translation can carry a reading forward, and why scholars argue about what the translator meant.
      - text: "Translation is always a mechanical swap of words, so this must have been a copying error."
        feedback: |
          Translation is not mechanical; each word needs a choice. Nothing in the sources shows a copying error here.
      - text: "It proves that the Hebrew text of Isaiah was changed."
        feedback: |
          The Hebrew is not claimed to be changed. The difference arises in the Greek rendering.
      - text: "It proves that the Gospel of Matthew is unreliable."
        feedback: |
          This card makes no such claim. The point concerns what a translation choice does; how to read Matthew is a separate matter on which traditions and scholars differ.
    explanation: |
      Two views are on the table, and the lesson takes neither as final: the Greek as a reading that went beyond the Hebrew, or as a natural rendering for its time.

  - type: text
    id: luther
    title: "Luther: German as the common people speak it"
    image:
      src: img/luther-bible-1534.webp
      alt: "A woodcut title page of a large German Bible with a decorative border and German text"
      caption: "The title page of the first complete Luther Bible, printed by Hans Lufft in Wittenberg in 1534; the New Testament had appeared alone in September 1522."
      credit: "Johann Michael Reu, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Title_page_of_Luther%27s_first_edition_of_the_entire_Bible_Wittenberg,_1534.png"
    body: |
      Martin Luther (1483 to 1546) published his German New Testament in September 1522 and the complete Bible in 1534, and he kept revising it. In Romans 3:28 he wrote that a person is justified by faith *allein*, "alone". The word "alone" is not in the Greek or the Latin, and Luther said so. In his 1530 *Sendbrief vom Dolmetschen* ("Open Letter on Translating") he defended it on two grounds: German idiom, which calls for such a word when one thing is affirmed and another denied, and Paul's sense, which he held it expressed.

      His opponents objected to the addition, since the word also served Luther's own doctrine. Luther's reply is a case in point for this lesson: a translator who must make a sentence sound natural in the target language also decides what the sentence means.

  - type: text
    id: nida
    title: "Two aims: match the words or match the effect"
    body: |
      In *Toward a Science of Translating* (Brill, 1964), Eugene Nida, a translator of Bibles and a linguist, drew a line between two orientations. In his words, **formal equivalence** "focuses attention on the message itself, in both form and content". A **dynamic equivalence** translation directs attention "toward the receptor response" and aims at "the closest natural equivalent" of the source message.

      A formal translation of an idiom keeps the idiom's words and may sound strange; a dynamic one swaps in an idiom the new reader would use for the same effect. Nida treated them as the two ends of a scale with grades between, and he allowed that formal equivalence suits some audiences.

  - type: mcq
    id: nida-q
    title: "Which aim?"
    prompt: |
      A translator renders a Hebrew phrase word for word, keeping its unusual order and image even though the English sounds odd. A second translator replaces the image with a phrase an English reader would use for the same point. According to Nida's terms, which is which, and what does each risk?
    options:
      - text: "The first is formal (risk: the reader may misread or stumble); the second is dynamic (risk: the translator's reading of the point replaces the text's own wording)."
        correct: true
        feedback: |
          Yes. Each approach pays for what it gains. Formal translation keeps the text's own shape and leaves the reader more work; dynamic translation helps the reader but needs more interpretation by the translator.
      - text: "The first is dynamic and the second is formal."
        feedback: |
          Reversed. Dynamic equivalence aims at the reader's response, which is what the second translator did.
      - text: "Both are formal, because every translation is formal."
        feedback: |
          Nida's point is that translators pick different aims; he described a scale between the two ends.
      - text: "Only the second is a translation; the first is a transliteration."
        feedback: |
          Word-for-word rendering into the target language is still translation. Transliteration copies the sounds or letters of the source.
    explanation: |
      Luther's *allein* leans dynamic. The Qur'an translators' "meaning" titles express a caution about the limits of any such choice. Which aim is right depends on what the text is for and who reads it, and that is a value question as much as a technical one.

  - type: text
    id: sapir-whorf
    title: "Does the language we speak shape how we think?"
    image:
      src: img/sapir.webp
      alt: "An old black and white portrait photograph of a man in a suit, Edward Sapir"
      caption: "Edward Sapir (1884 to 1939), an American linguist, around 1910; his student Benjamin Lee Whorf (1897 to 1941) developed the idea at the center of this card."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Edward_Sapir.jpg"
    body: |
      So far the loss was in a particular word. A bigger question: could the language we think in limit the questions we can ask at all? The **Sapir-Whorf hypothesis** is credited to the American linguists Edward Sapir and his student Benjamin Lee Whorf, who studied Native American languages. The Stanford Encyclopedia of Philosophy adds that the label came later (from Harry Hoijer, in the 1950s), that Whorf himself presented a "principle of linguistic relativity" as a finding and not as a hypothesis, and that he stressed **grammar**, the habits a language forces on its speakers, more than vocabulary.

      Two forms are separated. The **strong** form, **linguistic determinism**, says language fixes thought: what a language lacks its speakers cannot think. The **weak** form, **linguistic relativity**, says language influences habits of attention, memory and categorising, without making thoughts impossible.

  - type: mcq
    id: sw-q
    title: "Strong or weak?"
    prompt: |
      Which claim is the strong form of the Sapir-Whorf idea (linguistic determinism)?
    options:
      - text: "A speaker whose language has no word for a distinction cannot think that distinction at all."
        correct: true
        feedback: |
          Yes. It says language sets the limit of thought. If true, translation across such gaps would be impossible, which is one reason the strong form is widely doubted.
      - text: "A speaker whose language marks a distinction obligatorily may notice it a little faster."
        feedback: |
          This is the weak form: a tendency of attention or speed, not a limit.
      - text: "Languages differ in their vocabularies."
        feedback: |
          This is uncontroversial. The hypothesis begins with a second claim, that the difference shapes thought.
      - text: "Speakers of different languages all think in exactly the same way."
        feedback: |
          This is the opposite pole, universalism in its extreme form. Few researchers hold it either.
    explanation: |
      Both poles are extreme. Most of the debate concerns how big and how general the weak effects are.

  - type: text
    id: evidence
    title: "What the studies found"
    body: |
      **Colour.** Russian has two basic words for blue, *goluboy* (light) and *siniy* (dark). In a 2007 study (Winawer and colleagues, in the *Proceedings of the National Academy of Sciences*), Russian speakers were faster to tell two blues apart when they fell on opposite sides of that boundary, and an interfering verbal task removed the advantage while a spatial task did not. A 2020 re-test (Martinovic, Paramei and MacInnes, in *Cognition*) did not reproduce the boundary effect for lightness and found that a sharper category boundary was also shaped by how often and in what order shades were shown. The universal side: Berlin and Kay (*Basic Color Terms*, 1969) found that languages name similar focal colours, with a rough common order in which terms are added, which they took as evidence against extreme relativism; later critics loosened that order.

      **Space.** According to Levinson's 1997 study, speakers of Guugu Yimithirr, an Australian language, describe positions by compass directions where English uses left and right, and they remember scenes in those terms more than Dutch speakers do.

      **Time.** Whorf claimed that Hopi has no words, forms or expressions that refer directly to time. Ekkehart Malotki's 1983 book *Hopi Time* gave hundreds of Hopi sentences that refer to time. Relativists reply that Whorf meant that Hopi grammar yields a different conception, not none, and some also criticised Malotki's methods.

  - type: mcq
    id: evidence-q
    title: "What would count against the strong form?"
    prompt: |
      Which observation counts most directly against the strong form (language fixes thought)?
    options:
      - text: "Speakers can learn another language's distinction, or have it explained in their own, and then use it; the Hopi sentences and the Russian speeds show tendencies, not impossibilities."
        correct: true
        feedback: |
          Yes. If a thought were unthinkable without the word, an explanation could not succeed. Translation itself, a paragraph explaining *ruach*, is a small case of this.
      - text: "Languages have different numbers of words."
        feedback: |
          This is a fact about languages, not about thought, so it cannot count against the claim that language fixes thought.
      - text: "Russian speakers were somewhat faster across the blue boundary."
        feedback: |
          If anything, this supports a weak effect. It is a difference in speed, not in whether the distinction can be made.
      - text: "Guugu Yimithirr speakers use compass directions."
        feedback: |
          This is a fact about their language, and the remembering study suggests habit; it does not show that speakers of other languages cannot learn or use compass directions.
    explanation: |
      The studies mostly show tendencies in attention or speed, the weak form. The SEP concludes that global determinism is implausible while localized effects of obligatory distinctions remain a research question.

  - type: text
    id: steelman
    title: "Each view at its best"
    body: |
      **For taking the loss seriously.** A translation is always also an interpretation; reading scripture in the original keeps the reader close to what is not carried over, which is why Muslim teaching keeps recitation in Arabic, why the Vedic tradition guards every syllable, and why scholars of any faith go back to Hebrew, Greek and Arabic. In the language question, a weak Whorfian adds that a language's habits of attention may favour some questions and so make others harder to raise.

      **For taking translation as a success.** A text meant for everyone should be heard by everyone. Luther wrote in the German people spoke, Nida wanted readers to respond as the first readers did, and the Septuagint itself shows a scripture living in a new language. On language and thought, a universalist notes that speakers explain one language in another all the time, which would be impossible if language set hard limits.

      Each side can accept part of the other: those who prize the original also publish translations, and those who prize translation also add footnotes.

  - type: mcq
    id: part-q
    title: "Where thoughtful people part"
    prompt: |
      Two readers study the same translation debate. One says "a translation that sounds natural is better"; the other says "a translation that keeps the original's form is better". According to this lesson, what is the most likely root of the disagreement?
    options:
      - text: "A different view of what the text is for: whether its authority sits in the original wording and form, or in the message it carries to a new reader."
        correct: true
        feedback: |
          Yes. That is a premise about the text (layer three), and no linguistic finding settles it. The facts (how words differ, what readers understand) bear on the question, but the weighing is a commitment.
      - text: "One of them does not know any Hebrew or Greek."
        feedback: |
          Scholars who know the originals well take both sides.
      - text: "They disagree on the facts of how languages work."
        feedback: |
          They may, but the disagreement persists even when the facts about the words are agreed.
      - text: "One of them has misread the Sapir-Whorf hypothesis."
        feedback: |
          The translation debate does not depend on the Sapir-Whorf question: even if language does not shape thought, the choice between form and effect remains.
    explanation: |
      Fact: translations differ and each choice gains and loses. Debate: how much language shapes thought. Commitment: what a sacred text is, so how much its wording matters. Each tradition answers the last for itself.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** a guided problem takes one sentence and reads it four ways, to put these tools (meaning, analogy, metaphor, myth, ritual, interpretation, translation) to work on a single case.
