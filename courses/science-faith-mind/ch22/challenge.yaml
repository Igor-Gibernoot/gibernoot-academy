id: ch22-challenge
title: "Level Challenge: One Sentence, Several Kinds of Meaning"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge: one river, five questions"
    body: |
      Every problem here uses an **invented** community, the Ferrymen of Orel, with an invented river, festival and stories, built so you can practise on cases you have never met. Nothing in them is a claim about a real tradition. Where a real thinker appears, the view is taught as "according to ...".

      - **Problem 1 · Four sentences, four jobs.** What each sentence is doing, and what could test it.
      - **Problem 2 · The silent spirit.** Falsification, the reply that a belief is a way of seeing, and one small number.
      - **Problem 3 · Speaking of the spirit.** One word, said of a river and of a spirit: same sense, different sense, or related?
      - **Problem 4 · A story and its readers.** Two ways to read a myth, and how a reading improves.
      - **Problem 5 · Carried across.** Translating a line, and what a language can and cannot do to thought.

      **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. The problems ask what a sentence does and how it could be checked, never whether the Ferrymen are right.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      Seven tools from the level, each stated so it can be used alone.

      - **Verification and falsification.** According to A. J. Ayer, in *Language, Truth and Logic* (1936), a sentence about the world is factually meaningful only if some possible observation could count for or against it, so sentences about God, he held, are not factual claims. According to Antony Flew, who adapted a parable of John Wisdom's for a philosophical symposium dated 1950-51, a claim that is qualified until nothing could count against it dies the death of a thousand qualifications (in essence). According to R. M. Hare, such a view can still be a **blik**, a way of seeing that is not a claim to be tested.
      - **Doing things with words.** According to J. L. Austin (*How to Do Things with Words*, published 1962 after his death), a **performative** such as "I name this ship the *Queen Elizabeth*" does something instead of reporting something. It is judged happy or unhappy, not true or false. A **misfire** is a failed procedure (no authority, wrong formula); an **abuse** is a correct procedure said insincerely.
      - **Analogy.** According to Thomas Aquinas, a word said of God and of creatures is neither **univocal** (the same sense) nor purely **equivocal** (unrelated senses) but **analogical**, "according to proportion". His model is "healthy", said of an animal, of a medicine (its cause) and of urine (its sign).
      - **Myth, two readings.** According to Claude Lévi-Strauss, a myth is built from pairs of opposites, and a figure that sits between them, such as a trickster, which stands halfway between two opposed terms, **mediates** the pair. According to Rudolf Bultmann (1941, *New Testament and Mythology*), a myth's picture of the world should be replaced by an **existential** reading, one that asks what it says about human life ("demythologizing").
      - **The hermeneutic circle.** According to Hans-Georg Gadamer (*Truth and Method*, German 1960), we read with **prejudgments** (opinions held in advance) that the text can correct, and understanding is a **fusion of horizons**, never finished.
      - **Translation.** According to Eugene Nida (1964), **formal equivalence** keeps the source's form and wording; **dynamic equivalence** aims for a response in the new reader like that of the first.
      - **Language and thought.** Linguistic relativity is the idea, linked to Benjamin Lee Whorf, that a language shapes thought. The **strong** version says it determines thought and is largely rejected today; the **weak** version says it influences thought, with effects that studies find in some domains, such as colour terms, and not in others.

  # ---------------- Problem 1 ----------------
  - type: text
    id: p1-setup
    title: "Problem 1 · Four sentences, four jobs"
    body: |
      **Problem 1.** At the river festival of the Ferrymen of Orel (an invented community), four sentences are spoken.

      - **A.** "The founder crossed the river on the night of the great flood."
      - **B.** "The river is our mother."
      - **C.** "I bless this boat and name her *Dawn*."
      - **D.** "Glory to the river!"

      The next three cards ask what each one does and how it could be checked.

  - type: mcq
    id: p1-perf
    title: "Which one does something?"
    prompt: |
      Four invented festival sentences: A "The founder crossed the river on the night of the great flood." B "The river is our mother." C "I bless this boat and name her *Dawn*." D "Glory to the river!" According to Austin, which one is a performative, a sentence that does something by being said, instead of reporting something?
    options:
      - text: "C: said by the right person, it makes the boat blessed and named."
        correct: true
        feedback: |
          Yes. Like "I name this ship the *Queen Elizabeth*", it is not a report: saying it, in the right setting, is the act. It is judged happy or unhappy, not true or false.
      - text: "A: telling a story is an act, so it is a performative."
        feedback: |
          Telling is an act, but the sentence itself reports a past event and can be true or false. Austin's performatives are the ones whose saying *is* the deed, such as naming, promising or marrying.
      - text: "B: it changes how the speaker sees the river."
        feedback: |
          Changing a hearer's view is an effect Austin calls perlocutionary, and a report can have it too. The test is whether saying the words in the right setting performs the act.
      - text: "D: a shout is a deed, so it is a performative."
        feedback: |
          D expresses an attitude, which is a different job. It is not true or false, but nothing is accomplished by the words the way a naming is accomplished.
    explanation: |
      Only C matches Austin's model case. A is a report, B is a figure of speech, and D voices a feeling. Whether a thinker counts D as a lesser kind of meaning is a separate quarrel, taken up in the next card.

  - type: mcq
    id: p1-verif
    title: "What could count against it?"
    prompt: |
      Four invented festival sentences: A "The founder crossed the river on the night of the great flood." B "The river is our mother." C "I bless this boat and name her *Dawn*." D "Glory to the river!" Under Ayer's verification principle (1936), which one makes a claim about the world that some possible observation could count for or against, as the speaker means it?
    options:
      - text: "Only A: records, tree rings or flood marks could in principle count for or against it."
        correct: true
        feedback: |
          Yes. A names an event with a date and a place, so evidence can bear on it. According to Ayer, B and D express feeling and C is an act.
      - text: "A and C: a blessing can be checked by whether the boat is safer afterwards."
        feedback: |
          Whether a blessing is *felt* to help is a separate matter. The sentence C does not predict safety. It is an act, judged happy or unhappy by who says it and how.
      - text: "B: it is false, since a river has no children."
        feedback: |
          Read as a literal claim about biology, B is testable and false. But the speakers do not mean it so; a metaphor is not tested by its literal reading. Ayer would say it expresses feeling.
      - text: "All four: every sentence in English has some observable use."
        feedback: |
          The principle asks for observations that bear on the *truth* of the claim, not on whether people use the sentence. Under that reading, praise and blessing give nothing to test.
    explanation: |
      A is the only report. Notice what the principle does and does not decide: it sorts the four sentences by whether evidence could bear on them, and it does not say that B, C and D are worthless.

  - type: mcq
    id: p1-abuse
    title: "Misfire or abuse?"
    prompt: |
      In the invented Orel custom, only the harbour-master may bless a boat. A visitor with no office says "I bless this boat and name her *Dawn*" and the crowd shrugs. Later the harbour-master says the same words while privately mocking the whole rite. According to Austin, what are the two cases?
    options:
      - text: "The visitor's words are a misfire (no authority); the harbour-master's are an abuse (right procedure, insincere)."
        correct: true
        feedback: |
          Yes. The visitor breaks the procedure, so the act does not come off. The harbour-master completes it, so the boat is blessed in the procedure's terms, but the speaker lacks the required feeling.
      - text: "Both are abuses: both speakers are insincere."
        feedback: |
          The visitor's problem is not insincerity but lack of standing. When the procedure is not met, the act fails: a misfire.
      - text: "Both are misfires: a mocking speaker cancels the blessing."
        feedback: |
          Austin separates the two on purpose. A correct procedure with the right person is carried out; what is wrong afterwards is the speaker's sincerity, an abuse. Whether the community would accept the blessing is a question for the community's own rules.
      - text: "Neither: performatives are only true or false."
        feedback: |
          That is what Austin denies. Performatives are happy or unhappy, and these are two ways of being unhappy.
    explanation: |
      Misfire: a failed procedure. Abuse: the procedure done, the sincerity missing. A single sentence therefore goes through at least three tests, whether it is a report (true or false), a performative (happy or unhappy), or an expression, and which test applies depends on what the sentence is doing.

  # ---------------- Problem 2 ----------------
  - type: text
    id: p2-setup
    title: "Problem 2 · The silent spirit"
    body: |
      **Problem 2.** Some Ferrymen say: "A spirit guards the ford. It cannot be seen, heard or felt, it leaves no mark on the water, and the ford behaves just as it would without it." A newcomer asks what the sentence says that "there is no spirit" does not.

  - type: mcq
    id: p2-flew
    title: "The thousand qualifications"
    prompt: |
      An invented claim: "A spirit guards the ford. It cannot be seen, heard or felt, it leaves no mark, and the ford behaves just as it would without it." According to Flew, adapting a parable of John Wisdom's (symposium dated 1950-51), what is the worry about such a claim?
    options:
      - text: "If every qualification removes a possible test, nothing is left that could count against it, and it risks asserting nothing."
        correct: true
        feedback: |
          Yes. In essence, Flew asks what would have to happen for the believer to say "the guard is not here". If nothing could, the claim's content has been qualified away.
      - text: "It is false, because spirits do not exist."
        feedback: |
          Flew's point is about meaning, not about falsehood. A false claim has content that could in principle be refuted; the worry is that this one may have lost its content.
      - text: "It is a metaphor, and metaphors cannot be literally true."
        feedback: |
          That is a different line of thought, from the lesson on metaphor. Flew's challenge applies to a claim presented as a real assertion about what is there.
      - text: "It cannot be said in any human language."
        feedback: |
          The sentence is plain and easy to grasp. The question is whether anything could count against it.
    explanation: |
      Flew's challenge is a demand for a possible test. Whether it is a fair demand for religious language is exactly what is disputed, as the next card shows.

  - type: mcq
    id: p2-hare
    title: "A reply: a way of seeing"
    prompt: |
      A Ferryman answers Flew: "I do not hold the guard as a theory about the ford. It is how I look at the whole river, and it changes how I act." According to Hare, what name does this kind of conviction get, and what does it concede?
    options:
      - text: "A blik: a way of seeing that is not an assertion to be tested, which concedes that it is not a claim like a report."
        correct: true
        feedback: |
          Yes. Hare's concession is that a blik is not an assertion, and his point is that bliks still matter: they shape how everything else is seen and done.
      - text: "A theory: it predicts the ford will stay calm, which can be tested."
        feedback: |
          The Ferryman says the opposite: the guard is not offered as a prediction. A view that does make predictions is the one tested in the next card.
      - text: "A performative: saying it makes the guard exist."
        feedback: |
          Austin's performatives do things in a procedure, like naming. Hare's blik is a different idea: a standing way of seeing.
      - text: "A univocal term: it has exactly the sense it has for rivers."
        feedback: |
          Univocal is a term from the discussion of analogy. It concerns whether a word keeps its sense across subjects, not whether a view is testable.
    explanation: |
      Two replies to Flew now sit side by side. One says the claim must be given a test or admitted to be weak. The other says it was never a claim of that kind. A thoughtful critic can answer the second by asking whether a blik that no evidence could ever shake is still something one can call true.

  - type: numeric
    id: p2-lr
    title: "If it does make a prediction"
    prompt: |
      A different group of Ferrymen holds a testable version: "The spirit calms the ford on festival day." Over the last ten festivals the ford was calm on 9 of them. In the same season, on ten ordinary days, the ford is calm on about 3 of them. How many times more likely is "calm on the day" if the claim is true than if the ford behaves as on ordinary days? Use calm in 9 of 10 against calm in 3 of 10 as the two probabilities. Give a whole number.
    answer: 3
    tolerance: 0.05
    answerText: '3'
    wrong:
      - { value: 0.33, feedback: 'That is the ratio turned upside down. The likelihood ratio puts the probability under the claim on top: $0.9/0.3$.' }
      - { value: 6, feedback: 'That is the difference in calm days, $9-3$. A likelihood ratio divides the two probabilities.' }
    hint: Divide $P(\text{calm}\mid\text{claim})=0.9$ by $P(\text{calm}\mid\text{ordinary})=0.3$.
    explanation: |
      $$\text{LR}=\frac{0.9}{0.3}=3.$$
      A testable claim pays a price and earns a benefit: it can lose, and when it wins it gains support, here a factor of 3 on the odds. The silent spirit of the first card pays nothing and earns nothing. This is the practical content of Flew's demand. The numbers are invented for the exercise.

  # ---------------- Problem 3 ----------------
  - type: mcq
    id: p3-healthy
    title: "Healthy diet, healthy dog"
    prompt: |
      According to Aquinas, "healthy" said of a dog, and "healthy" said of a diet that keeps the dog well, is used in what way?
    options:
      - text: "Analogically: the senses differ but are related, since the diet is called healthy as a cause of the dog's health."
        correct: true
        feedback: |
          Yes. This is his own pattern: "healthy" of an animal, of a medicine (a cause of health) and of urine (a sign of it). One term, several senses, tied together by one thing, health.
      - text: "Univocally: it must mean the same thing for the dog and the diet, or the sentence is a pun."
        feedback: |
          If the senses were the same, a diet would have to be alive and well as a dog is. Aquinas says the senses differ yet stay related.
      - text: "Equivocally: the two uses share only a sound, like 'bank' of a river and 'bank' for money."
        feedback: |
          The two uses are connected through health, which is why the pun fails. Purely equivocal words have no such link.
      - text: "Metaphorically: the diet is only said to be healthy by a figure of speech."
        feedback: |
          A diet really does cause health. Aquinas's analogy is about literal but related senses, which a metaphor does not claim.
    explanation: |
      Related senses are the mark of analogy. Aquinas applies the same pattern to "good" or "wise" said of God and of creatures, according to proportion.

  - type: mcq
    id: p3-good
    title: "Good, said of a spirit"
    prompt: |
      A Ferryman says: "The spirit is good, in the way a good captain is good." A critic answers: "Then you use 'good' in the captain's sense, and a spirit has no crew." According to Aquinas, what is the best reply, and what rival worry remains?
    options:
      - text: "Analogy: the word applies to the spirit in a related, not identical, sense; the rival worry is that without a stated sense the word may be left with no content."
        correct: true
        feedback: |
          Yes. The first part is Aquinas's route between univocal and equivocal. The worry is the one a critic presses: if the related sense is never spelled out, "good" may mean nothing definite. Defenders of analogy answer by naming the proportion, as "good" for the captain is skill and care for the crew.
      - text: "Univocity: 'good' must mean exactly what it means for the captain, and the critic is wrong."
        feedback: |
          That keeps the critic's own assumption. The Ferryman's point was that the sense is carried over, not copied.
      - text: "Equivocation: 'good' is only a name, and the critic should drop the question."
        feedback: |
          That gives the critic the win: if the word had no link to the captain's goodness, the sentence would tell us nothing.
      - text: "Silence: say nothing, because the spirit is beyond all words."
        feedback: |
          Some thinkers take this route (the negative way), but it is a different answer from analogy. It is the one that leaves only what the spirit is not.
    explanation: |
      Analogy is a middle path with a cost: the sense must be spelled out well enough to be more than a word. Negation, saying what the spirit is not, is the rival route, and the two can be used together.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · A story and its readers"
    body: |
      **Problem 4.** The Ferrymen tell an invented story. A ferryman carries a newborn to the far bank in the morning and an old woman's body to the near bank at night, and he is never seen to leave the boat. Some Ferrymen read the story as a picture of the river's real spirits. Others take it to be about how humans live between birth and death.

  - type: mcq
    id: p4-ls
    title: "The figure in the middle"
    prompt: |
      An invented story: a ferryman carries a newborn to the far bank in the morning and a dead woman to the near bank at night, and never leaves the boat. According to Lévi-Strauss, what would a structuralist say the ferryman does in the story?
    options:
      - text: "He mediates a pair of opposites, life and death, by standing between the banks."
        correct: true
        feedback: |
          Yes. In essence, Lévi-Strauss reads myths as sets of oppositions with figures that mediate them, as a trickster does between two opposed terms. The ferryman does it with a boat in place of a body.
      - text: "He proves that real ferrymen once carried the dead."
        feedback: |
          That is a historical question. A structuralist reads the story's pattern, not its facts, so the story could work this way whether or not ferrymen existed.
      - text: "He is a hero who leaves home, is tested and returns."
        feedback: |
          That is a different scheme, a hero's journey in stages. The ferryman never leaves the boat, and the question here is about opposites, not stages.
      - text: "He shows that the story must be read as a literal report."
        feedback: |
          Structural reading sets the literal question aside; it asks which oppositions the story arranges and how it resolves them.
    explanation: |
      A structuralist asks what pair of opposites the story arranges. Other readers ask a different question, and the next card gives one of them.

  - type: mcq
    id: p4-bult
    title: "A different question"
    prompt: |
      A Ferryman says: "The river spirits lifting the boat are a picture of the world that nobody holds today. But the story still tells me something about how to live between birth and death." Which approach does his remark most resemble, according to the thinker who gave it its name?
    options:
      - text: "Bultmann's demythologizing (1941): replace the mythical picture of the world by an existential reading of what the story says about human life."
        correct: true
        feedback: |
          Yes. In essence, Bultmann argued that a modern person cannot hold the New Testament's mythical world picture, and asked for an existential interpretation that discloses the message (the kerygma).
      - text: "Ayer's verification principle (1936): the story is meaningless since the spirits cannot be observed."
        feedback: |
          The Ferryman does not discard the story. He keeps its meaning for life, which is the opposite of the verdict he would get from a strict verificationist.
      - text: "Austin's misfire: the story is a procedure that failed."
        feedback: |
          Austin's terms apply to speech acts like blessings, not to the reading of a whole story.
      - text: "Strong linguistic relativity: the story's language fixes what the Ferrymen can think."
        feedback: |
          Nothing in the remark is about the language limiting thought. It is about separating a picture of the world from a message about life.
    explanation: |
      Two readings now sit side by side: the structuralist asks what oppositions the story arranges; the existentialist asks what it says to a living person. A believer may add a third: that the spirits are real. A critic of Bultmann may reply that the story loses force if its picture of the world is dropped. These are live disagreements, not settled ones.

  - type: order
    id: p4-circle
    title: "How a reading improves"
    prompt: |
      Put in order how, according to Gadamer, a reader's understanding of the ferryman story can improve.
    steps:
      - "Begin with a prejudgment about the whole story: it is about life and death."
      - "Read a detail that does not fit, such as the ferryman never leaving the boat."
      - "Revise the prejudgment in the light of the detail, perhaps to a story about being between."
      - "Return to the whole with the revised view, and meet new details, with no final end."
    hint: A prejudgment is held first, tested by a part, revised, and then brought back to the whole.
    explanation: |
      This is the hermeneutic circle: the whole guides the reading of the parts and the parts correct the view of the whole. For Gadamer, prejudgments are not a defect to remove but the way in, and the fusion of horizons between the reader and the text is never finished.

  # ---------------- Problem 5 ----------------
  - type: numeric
    id: p5-count
    title: "How many ways to render a line?"
    prompt: |
      An invented line in the Orel liturgy has three key words. The first has 2 live senses, the second has 3, and the third has 2. A translator who chooses one sense for each word, independently, has how many different word-by-word readings to choose from?
    answer: 12
    tolerance: 0.05
    answerText: '12'
    wrong:
      - { value: 7, feedback: 'That adds the senses, $2+3+2$. Each choice for one word can go with any choice for the others, so the counts multiply.' }
      - { value: 3, feedback: 'That counts the words. The question is about the number of combinations of senses.' }
    hint: Each choice for the first word pairs with every choice for the second, and so on.
    explanation: |
      $$2\times3\times2=12.$$
      Twelve possible readings come from three ambiguous words, before grammar or tone. This is one reason scholars of translation say that every rendering already contains an interpretation. The numbers are invented.

  - type: mcq
    id: p5-nida
    title: "Which translator?"
    prompt: |
      A translator renders an invented Orel line word for word and keeps its strange image of "the river that drinks the sky", although it reads oddly. Another rewrites it as "the river holds the sky" so a new reader responds as the first hearers did. According to Nida (1964), which is which?
    options:
      - text: "The first is formal equivalence; the second is dynamic equivalence."
        correct: true
        feedback: |
          Yes. Formal equivalence keeps the source's wording and form; dynamic equivalence aims for a similar response in the new reader. Nida treats them as two ends of a scale, and each loses something the other keeps.
      - text: "The first is dynamic equivalence; the second is formal equivalence."
        feedback: |
          This swaps them. Keeping the original's wording and image is the formal choice; rewording for a similar response is the dynamic one.
      - text: "Both are dynamic, since any translation changes the words."
        feedback: |
          Every translation changes words, but the two differ in what they try to keep. One keeps the form; the other aims at the effect.
      - text: "Both are formal, since both start from the same line."
        feedback: |
          Starting from the same line is common to all translation. The distinction is about what the translator keeps and what is given up.
    explanation: |
      The first keeps the image and risks puzzling the reader; the second keeps the response and risks losing the image. Neither is declared the winner: a community that prizes the original sound, as some traditions do, will choose differently from one that prizes understanding.

  - type: mcq
    id: p5-whorf
    title: "How far does language reach?"
    prompt: |
      An invented study finds that Orel speakers, whose language has two words for kinds of river water, sort water samples slightly faster across that boundary than speakers of a language with one word. Which conclusion does the result best support?
    options:
      - text: "A weak, limited influence of language on a task, not that language fixes what speakers can think."
        correct: true
        feedback: |
          Yes. A task-specific difference matches the weak version of linguistic relativity, the kind studies tend to find. It does not show that the speakers of the other language cannot tell the waters apart.
      - text: "The strong version: Orel speakers cannot think about river water except through their two words."
        feedback: |
          The strong version says language determines thought. A small speed difference is far from that, and speakers of the other language can plainly tell the samples apart, just more slowly.
      - text: "That Whorf's hypothesis is refuted for every domain of thought."
        feedback: |
          One result neither refutes nor confirms the whole idea. According to reviews, effects are found in some domains and not others, which is a mixed verdict, not a refutation.
      - text: "That translation between Orel and other languages is impossible."
        feedback: |
          A small speed difference says nothing about whether the content can be carried across. The weak reading leaves translation difficult but possible.
    explanation: |
      Between "no effect" and "language decides" lies the range of findings. This sits in the context of the course's earlier point: the translation of a sacred line is hard because words carry associations, not because the thought is sealed in one language.

  # ---------------- Closing weighing ----------------
  - type: mcq
    id: close-weigh
    title: "Where the believer and the sceptic part"
    prompt: |
      A believer says "The river is our mother" and a sceptic replies "A river cannot be a mother." Using what the problems showed, what is the most useful thing to find out first before judging who is right?
    options:
      - text: "What job the sentence is doing: a literal claim, a metaphor, an act of devotion or something else."
        correct: true
        feedback: |
          Yes. The sceptic answers a literal claim; the believer may be speaking a metaphor or an expression. Each job has its own test, and a disagreement can end, or become real, once the job is agreed.
      - text: "Whether the river exists."
        feedback: |
          Both agree that it does. The disagreement is not about the river.
      - text: "How many people say the sentence."
        feedback: |
          How many speak a sentence says nothing about the job it does or how it could be checked.
      - text: "Which of them speaks the older language."
        feedback: |
          Age of language does not settle what a sentence is doing.
    explanation: |
      That is the discipline the level teaches: ask what the sentence is doing, then ask how it could be checked, and name which view of language you are using. Some disagreements dissolve at the first question, and some do not, because the parties differ on whether a religious sentence ought to be a testable claim at all.

  - type: text
    id: close
    title: "What you now own"
    body: |
      This challenge used one invented community to test the toolkit of the level. The method, in prose: first ask what a sentence is doing, as a report, a figure, an act or an expression. Then ask how it could be checked, which depends on the job. Then name the theory you are using, with its thinker, and ask what the rival theory would say.

      Tools used: Ayer's verification principle and Flew's falsification challenge with Hare's blik as reply; Austin's performatives, misfires and abuses; Aquinas's analogy against univocal and equivocal use; Lévi-Strauss's mediation and Bultmann's existential reading; Gadamer's circle; Nida's formal and dynamic equivalence; the weak and strong forms of linguistic relativity. One formula appeared, the likelihood ratio
      $$\text{LR}=\frac{P(E\mid\text{claim})}{P(E\mid\text{no claim})}.$$

      What stays open: whether a religious sentence ought to be tested like a report at all, and whether a good reading is one that keeps the original's picture or one that survives without it.

      **Next:** the level on faith, reason and knowledge asks whether believing without proof can be responsible.
