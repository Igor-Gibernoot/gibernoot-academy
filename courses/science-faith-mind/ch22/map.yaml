id: ch22-map
title: "Content Map: Language and Religious Language"
kind: map
name: Level 22, Language and Religious Language (what a sentence means, whether religious sentences make claims, analogy and negation, metaphor and symbol, myth, ritual and performatives, interpretation, translation)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the level on how religious sentences work, from memory, one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a sense swapped with a reference, a thinker given the rival's view, a misfire read as an abuse), and every wrong pick comes with a reason.

  Everything is taught according to the thinkers and traditions named in each box; which religious sentences, if any, are true is left open. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: meaning
    title: What a sentence means
    row: 1
    col: 2
    body: |
      According to **Frege (1892)**, a name has a **sense** (how the object is presented) and a **reference** (the object itself): "the morning star" and "the evening star" share a reference but differ in sense, which is why the identity is informative. The **early Wittgenstein** (*Tractatus*, 1921) held a **picture theory**: a sentence pictures a possible state of affairs. The **verification principle** (Vienna Circle; **Ayer, 1936**) says the sense of a sentence is the way it could be checked by experience. The **late Wittgenstein** (*Investigations*, 1953) says that for a large class of cases the meaning of a word is its **use** in a language game.
    decoys:
      - body: |
          According to **Frege (1892)**, a name has a **reference** (how the object is presented) and a **sense** (the object itself): "the morning star" and "the evening star" share a sense but differ in reference, which is why the identity is informative. The **early Wittgenstein** (*Tractatus*, 1921) held a **picture theory**: a sentence pictures a possible state of affairs. The **verification principle** (Vienna Circle; **Ayer, 1936**) says the sense of a sentence is the way it could be checked by experience. The **late Wittgenstein** (*Investigations*, 1953) says that for a large class of cases the meaning of a word is its **use** in a language game.
        feedback: |
          Frege's terms are the other way round. The reference is the object a name picks out, and the sense is the way the object is given. The morning and the evening star are one object (same reference) given in two ways (two senses), and that gap is what makes "they are the same" news.
      - body: |
          According to **Frege (1892)**, a name has a **sense** (how the object is presented) and a **reference** (the object itself): "the morning star" and "the evening star" share a reference but differ in sense, which is why the identity is informative. The **early Wittgenstein** (*Investigations*, 1953) held a **picture theory**: a sentence pictures a possible state of affairs. The **verification principle** (Vienna Circle; **Ayer, 1936**) says the sense of a sentence is the way it could be checked by experience. The **late Wittgenstein** (*Tractatus*, 1921) says that for a large class of cases the meaning of a word is its **use** in a language game.
        feedback: |
          The two Wittgensteins are swapped. The picture theory belongs to the *Tractatus* (1921), the early work. Meaning as use, with language games, is the late work, published after his death as the *Investigations* (1953), and it partly rejects the picture view.
    explanation: |
      The root of the map. Each later box applies one of these four ideas of meaning, or answers a problem they leave open, to religious language.

  - id: claim
    title: Is a religious sentence a claim?
    row: 2
    col: 1
    body: |
      **Cognitivism** takes religious sentences at face value, as true or false. **Ayer (1936)** argued that "God exists" is not factually meaningful, so its denial is empty too: a verdict on meaning, not on God. **Flew (1950 to 1951)**, with Wisdom's gardener, said such claims die the death by a thousand qualifications; **Hare** replied with the **blik** (not an assertion), **Mitchell** with **trust that is tested yet kept**, **Hick** with **eschatological verification**. **Braithwaite (1955)** read religious sentences as **intentions plus stories**, and **Phillips (1965)** as a **language game** with its own standards.
    decoys:
      - body: |
          **Cognitivism** takes religious sentences at face value, as true or false. **Ayer (1936)** argued that "God exists" is not factually meaningful, so **only its denial is meaningful**: a verdict on meaning, not on God. **Flew (1950 to 1951)**, with Wisdom's gardener, said such claims die the death by a thousand qualifications; **Hare** replied with the **blik** (not an assertion), **Mitchell** with **trust that is tested yet kept**, **Hick** with **eschatological verification**. **Braithwaite (1955)** read religious sentences as **intentions plus stories**, and **Phillips (1965)** as a **language game** with its own standards.
        feedback: |
          Ayer's test applies in both directions. If "God exists" cannot be checked by any experience, neither can "God does not exist", so on his view atheism is as empty as theism. This is why the verdict concerns meaning, not whether God exists.
      - body: |
          **Cognitivism** takes religious sentences at face value, as true or false. **Ayer (1936)** argued that "God exists" is not factually meaningful, so its denial is empty too: a verdict on meaning, not on God. **Flew (1950 to 1951)**, with Wisdom's gardener, said such claims die the death by a thousand qualifications; **Hare** replied that the **blik is a testable hypothesis**, **Mitchell** with **trust that is tested yet kept**, **Hick** with **eschatological verification**. **Braithwaite (1955)** read religious sentences as **intentions plus stories**, and **Phillips (1965)** as a **language game** with its own standards.
        feedback: |
          Hare's reply concedes the point: a blik is not an assertion and no experience refutes it, yet it matters a great deal which blik one has. The testable replies are Mitchell's (trust under ambiguous evidence) and Hick's (verification after death).
    explanation: |
      The first answer to the root: Ayer and Flew press the verification and falsification tests on religious sentences, and the replies either defend a claim or give up the claim reading.

  - id: god
    title: Speaking of God
    row: 2
    col: 2
    body: |
      **Aquinas** (*Summa* I q.13 a.5) said words for God are **neither univocal nor equivocal but analogical**: "healthy" said of an animal, of a medicine and of urine keeps one thread of meaning by proportion. **Maimonides** (*Guide*, 1190) held that we can say only what God is **not**, a **negative** way. **Pseudo-Dionysius** (c. 500) joined three moves: **affirm, deny, go beyond** both. **Eckhart** (c. 1260 to c. 1328) distinguished **God from the Godhead**, and the bull *In agro dominico* (1329) judged some of his propositions after his death.
    decoys:
      - body: |
          **Aquinas** (*Summa* I q.13 a.5) said words for God are **univocal, with exactly the same meaning as for creatures**: "healthy" said of an animal, of a medicine and of urine keeps one thread of meaning by proportion. **Maimonides** (*Guide*, 1190) held that we can say only what God is **not**, a **negative** way. **Pseudo-Dionysius** (c. 500) joined three moves: **affirm, deny, go beyond** both. **Eckhart** (c. 1260 to c. 1328) distinguished **God from the Godhead**, and the bull *In agro dominico* (1329) judged some of his propositions after his death.
        feedback: |
          Aquinas rejected the univocal view, because God's perfection is not that of creatures, and also the equivocal view, which would leave the words empty. His middle path is analogy: related meanings, tied by proportion, as the "healthy" example shows.
      - body: |
          **Aquinas** (*Summa* I q.13 a.5) said words for God are **neither univocal nor equivocal but analogical**: "healthy" said of an animal, of a medicine and of urine keeps one thread of meaning by proportion. **Maimonides** (*Guide*, 1190) held that we can say only what God is **not**, a **negative** way. **Pseudo-Dionysius**, the **convert of Paul in Acts (c. 50)**, joined three moves: **affirm, deny, go beyond** both. **Eckhart** (c. 1260 to c. 1328) distinguished **God from the Godhead**, and the bull *In agro dominico* (1329) judged some of his propositions after his death.
        feedback: |
          The writings go under the name of Dionysius, the Athenian convert of Acts 17:34, but they were composed around 500, which is why the author is called Pseudo-Dionysius.
    explanation: |
      The second answer: if the words are claims, how can finite words describe God? The replies keep a claim reading but limit it, through analogy, negation or silence.

  - id: metaphor
    title: Metaphor, symbol and model
    row: 2
    col: 3
    body: |
      **Ramsey** (*Religious Language*, 1957) used **models plus qualifiers**: "God is a shepherd" gets "infinitely" or "perfectly" to point past the picture and **disclose** something. **Tillich** (*Dynamics of Faith*, 1957) separated a **sign** (arbitrary, like a flag) from a **symbol**, which **participates** in what it points to, and called literalism idolatrous. **Ricoeur** (*Rule of Metaphor*, 1975) placed metaphor at the level of the **whole statement**, a tension of identity and difference. **McFague** (*Models of God*, 1987) called a model an **extended metaphor** and asked for **many models**.
    decoys:
      - body: |
          **Ramsey** (*Religious Language*, 1957) used **models plus qualifiers**: "God is a shepherd" gets "infinitely" or "perfectly" to point past the picture and **disclose** something. **Tillich** (*Dynamics of Faith*, 1957) separated a **symbol** (arbitrary, like a flag) from a **sign**, which **participates** in what it points to, and called literalism idolatrous. **Ricoeur** (*Rule of Metaphor*, 1975) placed metaphor at the level of the **whole statement**, a tension of identity and difference. **McFague** (*Models of God*, 1987) called a model an **extended metaphor** and asked for **many models**.
        feedback: |
          Tillich's terms run the other way. A sign, like a flag or a traffic light, is conventional and can be replaced; a symbol takes part in the power of what it stands for. That is why he said that taking a symbol literally turns it into an idol.
      - body: |
          **Ramsey** (*Religious Language*, 1957) used **models plus qualifiers**: "God is a shepherd" gets "infinitely" or "perfectly" to point past the picture and **disclose** something. **Tillich** (*Dynamics of Faith*, 1957) separated a **sign** (arbitrary, like a flag) from a **symbol**, which **participates** in what it points to, and called literalism idolatrous. **Ricoeur** (*Rule of Metaphor*, 1975) placed metaphor at the level of the **single word**, a name borrowed in place of another. **McFague** (*Models of God*, 1987) called a model an **extended metaphor** and asked for **many models**.
        feedback: |
          Ricoeur moved the study of metaphor from the word to the statement. A metaphor is a whole statement with a tension between identity and difference, and its new meaning is not found in a dictionary entry for any one word.
    explanation: |
      The third answer: religious language may work as picture and disclosure, not as description. This is the bridge to stories, where the picture is extended into a whole narrative.

  - id: myth
    title: Myth
    row: 3
    col: 1
    body: |
      In the scholarly sense a **myth** is a **traditional sacred story**, with **no verdict on whether it is true**. **Eliade** read myths as returning to the **sacred time** (*in illo tempore*) of origins, which the rite re-enters. **Campbell** (1949) described a **monomyth** of departure, initiation and return, which **Toelken and Dundes** criticised for selection. **Lévi-Strauss** looked for **structure**: opposites mediated, as by a **trickster**. **Bultmann (1941)** proposed **demythologizing**, an **existential interpretation** of the New Testament's mythical frame.
    decoys:
      - body: |
          In the everyday sense a **myth** is a **false belief**, and scholars use the word to **mean the same, a story known to be untrue**. **Eliade** read myths as returning to the **sacred time** (*in illo tempore*) of origins, which the rite re-enters. **Campbell** (1949) described a **monomyth** of departure, initiation and return, which **Toelken and Dundes** criticised for selection. **Lévi-Strauss** looked for **structure**: opposites mediated, as by a **trickster**. **Bultmann (1941)** proposed **demythologizing**, an **existential interpretation** of the New Testament's mythical frame.
        feedback: |
          Scholars use the word without a verdict. "Myth" names a kind of story (traditional, sacred, about origins or powers), and whether it is true is a separate question. Mixing the everyday and the scholarly senses is the usual source of quarrels.
      - body: |
          In the scholarly sense a **myth** is a **traditional sacred story**, with **no verdict on whether it is true**. **Eliade** read myths as returning to the **sacred time** (*in illo tempore*) of origins, which the rite re-enters. **Campbell** (1949) described a **monomyth** of departure, initiation and return, which **Toelken and Dundes** criticised for selection. **Lévi-Strauss** looked for **structure**: opposites mediated, as by a **trickster**. **Bultmann (1941)** proposed **demythologizing**, which **deletes the mythical parts and keeps only the historical facts about Jesus**.
        feedback: |
          Bultmann did not delete. He read the mythical frame (heaven above, hell below, miracles) for what it says about human existence, and the proclamation (kerygma) matters more to him than the historical facts. Jaspers objected that the picture may not be separable from the message.
    explanation: |
      The fourth answer: stories, not statements, carry much of religion. Myth links back to metaphor (an extended picture) and forward to ritual (the story acted out).

  - id: ritual
    title: Ritual and performative speech
    row: 3
    col: 2
    body: |
      **Austin** (lectures 1955, book 1962) separated **constatives**, which are true or false, from **performatives**, which are **happy or unhappy**: "I name this ship..." does something. An act **misfires** if the formula or the authority is wrong, and is an **abuse** if the speaker is **insincere**. A sentence also has a **locutionary, illocutionary and perlocutionary** side. **Durkheim** saw rites **renewing the bond**, **Turner** the **liminal** phase and **communitas**, **Rappaport** **invariant formal sequences**, **Staal (1979)** rules **without meaning**.
    decoys:
      - body: |
          **Austin** (lectures 1955, book 1962) separated **constatives**, which are true or false, from **performatives**, which are **happy or unhappy**: "I name this ship..." does something. An act **misfires** if the speaker is **insincere**, and is an **abuse** if the formula or the authority is wrong. A sentence also has a **locutionary, illocutionary and perlocutionary** side. **Durkheim** saw rites **renewing the bond**, **Turner** the **liminal** phase and **communitas**, **Rappaport** **invariant formal sequences**, **Staal (1979)** rules **without meaning**.
        feedback: |
          The two failures are swapped. A misfire is a failure of procedure: the act does not come off. An abuse is a failure of sincerity: the act is performed but the speaker does not mean it, as in a marriage of convenience.
      - body: |
          **Austin** (lectures 1955, book 1962) separated **constatives**, which are true or false, from **performatives**, which are **happy or unhappy**: "I name this ship..." does something. An act **misfires** if the formula or the authority is wrong, and is an **abuse** if the speaker is **insincere**. A sentence also has a **locutionary, illocutionary and perlocutionary** side. **Durkheim** saw rites **renewing the bond**, **Turner** the **liminal** phase and **communitas**, **Rappaport** **invariant formal sequences**, **Staal (1979)** rites **rich in doctrine that each act encodes**.
        feedback: |
          Staal argued the opposite. In "The Meaninglessness of Ritual" (1979), studying the Vedic Agnicayana, he held that ritual is a system of rules that does not refer to anything; meanings are attached afterwards by those who take part.
    explanation: |
      The fifth answer, and the first one that gives up the claim reading: a ritual sentence is an act. It builds on meaning as use and joins myth, since a rite is often a story performed.

  - id: hermeneutics
    title: Interpretation
    row: 3
    col: 3
    body: |
      **Philo** (c. 20 BCE to c. 50 CE) turned to **allegory where the plain sense is problematic**, while **keeping the literal law**. **Origen** (c. 185 to c. 253) read **body, soul and spirit**. Jewish study separates **peshat** (plain) from **derash** (midrash), with the four layers of **PaRDeS**; Muslim **tafsir** is **bi'l-ma'thur** (by transmission) or **bi'l-ra'y** (by judgement), and Q 3:7 has **muhkamat and mutashabihat** verses. **Spinoza** (1670) said to interpret Scripture as one interprets **nature**. **Gadamer** (1960): understanding starts from **prejudgments** inside a **circle**, ending in a **fusion of horizons**.
    decoys:
      - body: |
          **Philo** (c. 20 BCE to c. 50 CE) turned to **allegory where the plain sense is problematic**, and **dropped the literal law as outdated**. **Origen** (c. 185 to c. 253) read **body, soul and spirit**. Jewish study separates **peshat** (plain) from **derash** (midrash), with the four layers of **PaRDeS**; Muslim **tafsir** is **bi'l-ma'thur** (by transmission) or **bi'l-ra'y** (by judgement), and Q 3:7 has **muhkamat and mutashabihat** verses. **Spinoza** (1670) said to interpret Scripture as one interprets **nature**. **Gadamer** (1960): understanding starts from **prejudgments** inside a **circle**, ending in a **fusion of horizons**.
        feedback: |
          Philo kept the literal law: he took allegory to add a deeper layer where the plain sense is improbable, not to cancel the commandments.
      - body: |
          **Philo** (c. 20 BCE to c. 50 CE) turned to **allegory where the plain sense is problematic**, while **keeping the literal law**. **Origen** (c. 185 to c. 253) read **body, soul and spirit**. Jewish study separates **peshat** (plain) from **derash** (midrash), with the four layers of **PaRDeS**; Muslim **tafsir** is **bi'l-ma'thur** (by transmission) or **bi'l-ra'y** (by judgement), and Q 3:7 has **muhkamat and mutashabihat** verses. **Spinoza** (1670) said to interpret Scripture as one interprets **nature**. **Gadamer** (1960): understanding needs **no prejudgments**, which must be **removed** before the **fusion of horizons**.
        feedback: |
          For Gadamer prejudgments cannot be removed: we always read from somewhere, and they are the starting point of understanding. The task is to test them against the text, in a circle between the parts and the whole.
    explanation: |
      The sixth answer asks how to read the texts in which religious language is kept. Different traditions give different rules, and Gadamer asks what any reading assumes.

  - id: translation
    title: Translation
    row: 4
    col: 1
    body: |
      Hebrew ***ruach*** means wind, breath or spirit, so a translator of Genesis 1:2 **chooses among senses**. **Nida (1964)** separated **formal equivalence** (match the words) from **dynamic equivalence** (match the effect on the reader). The **Septuagint** (Greek, 3rd century BCE) rendered *almah* in Isaiah 7:14 as ***parthenos***, a choice that shaped later readings. **Sapir and Whorf**: the **strong** form says language **fixes** thought, the **weak** form says it **nudges** habits of attention; the evidence on colour, space and time supports **at most the weak form**.
    decoys:
      - body: |
          Hebrew ***ruach*** means wind, breath or spirit, so a translator of Genesis 1:2 **chooses among senses**. **Nida (1964)** separated **formal equivalence** (match the effect on the reader) from **dynamic equivalence** (match the words). The **Septuagint** (Greek, 3rd century BCE) rendered *almah* in Isaiah 7:14 as ***parthenos***, a choice that shaped later readings. **Sapir and Whorf**: the **strong** form says language **fixes** thought, the **weak** form says it **nudges** habits of attention; the evidence on colour, space and time supports **at most the weak form**.
        feedback: |
          Nida's labels are swapped. Formal equivalence stays close to the source's words and form; dynamic equivalence aims at the same response in the reader, even at the cost of the words. Luther's *allein* in Romans 3:28 is a well-known dynamic-leaning choice.
      - body: |
          Hebrew ***ruach*** means wind, breath or spirit, so a translator of Genesis 1:2 **chooses among senses**. **Nida (1964)** separated **formal equivalence** (match the words) from **dynamic equivalence** (match the effect on the reader). The **Septuagint** (Greek, 3rd century BCE) rendered *almah* in Isaiah 7:14 as ***parthenos***, a choice that shaped later readings. **Sapir and Whorf**: the **strong** form says language **fixes** thought, the **weak** form says it **nudges** habits of attention; the evidence on colour, space and time **establishes the strong form**.
        feedback: |
          The findings are modest. Colour studies show small effects (and a 2020 re-test found them weaker), the Guugu Yimithirr compass directions show a habit, and Whorf's Hopi time claim was answered by Malotki in 1983. They support at most the weak form, and determinism is not shown.
    explanation: |
      The seventh answer is a limit rather than a theory: a sacred text lives in more than one language, and the choices of translators and the habits of speakers shape what readers take it to say.

  - id: layers
    title: Three layers
    row: 4
    col: 2
    span: 2
    body: |
      **Fact** (texts, dates, studies): what Frege, Austin and Nida wrote, how the Septuagint rendered Isaiah 7:14, what the colour and compass studies found. **Debate** (live scholarly disagreement): whether religious sentences are claims, how far meaning is use, how large the effects of language on thought are. **Commitment** (faith or metaphysics): whether religious language describes how things are, and whether scripture's authority sits in its **original words** or in its **message**, which decides how much loss in translation matters.
    decoys:
      - body: |
          **Fact** (texts, dates, studies): what Frege, Austin and Nida wrote, **that religious sentences are meaningless claims**, what the colour and compass studies found. **Debate** (live scholarly disagreement): whether religious sentences are claims, how far meaning is use, how large the effects of language on thought are. **Commitment** (faith or metaphysics): whether religious language describes how things are, and whether scripture's authority sits in its **original words** or in its **message**, which decides how much loss in translation matters.
        feedback: |
          That religious sentences are meaningless is Ayer's thesis, and it is contested by the replies of Hare, Mitchell, Hick and others. It belongs in the debate layer; that Ayer argued it in 1936 is the fact.
      - body: |
          **Fact** (texts, dates, studies): what Frege, Austin and Nida wrote, how the Septuagint rendered Isaiah 7:14, what the colour and compass studies found. **Debate** (live scholarly disagreement): whether religious sentences are claims, how far meaning is use, how large the effects of language on thought are. **Commitment** (faith or metaphysics): whether scripture's authority sits in its **original words** or in its **message**, which the **studies of language and thought decide**.
        feedback: |
          Studies of language and thought say nothing about where scripture's authority lies. That is a commitment of a tradition, and the studies only show how much translation changes, which a believer weighs by that commitment.
    explanation: |
      The thread through the whole map. Every box mixes a fact (who said it, when), a debate (how far it works) and a commitment (what a believer or doubter then makes of it), and the level's aim is to keep them apart.

