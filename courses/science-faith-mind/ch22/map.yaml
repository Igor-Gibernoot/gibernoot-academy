outroTitle: Level 22 in one picture
outro: |
  Frege, the early Wittgenstein, the verifiers and the late Wittgenstein give four ideas of what a sentence means. The verification tests (Ayer, Flew) challenge religious sentences, and the replies either defend a claim or read the sentences as expressions or acts. Analogy, negation and silence limit what can be said of God, metaphor and model show a way of speaking by picture, myth carries a story, ritual does things with words, interpretation asks how to read the texts, and translation shows how much a text changes in another language. Where people part ways is at whether a religious sentence is a claim, at which reading of a text is right, and at how much language shapes thought. Fact, debate and commitment stay separate.
