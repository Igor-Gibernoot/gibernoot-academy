id: ch17-gita
title: "Guided proof: The Gita on Action Without Attachment"
kind: guided
proof: true
own: |
  The setting: the *Bhagavad Gita* ("Song of the Lord"), a poem of 18 chapters and about 700 verses inside the epic *Mahabharata*. On the field of Kurukshetra, just before a war between two branches of one family, the warrior Arjuna refuses to fight his kin and the god Krishna, his charioteer, answers him. Verse numbers below are chapter.verse. Teaching is described *according to the Gita and its readers*.
  - **The argument in five steps.** According to Krishna: grief over death is misplaced because the self is not slain with the body (2.19-20); a warrior's own duty (*svadharma*) is righteous battle (2.31) and one's own duty, even done imperfectly, is better than another's done well (3.35); no one can stay without action even for a moment (3.5), so the question is how to act, not whether; the rule for acting is
    $$\textit{karmany evadhikaras te}$$
    in essence {{ "your right is to the action alone, never to its fruits" }}; and one acts with equanimity in gain and loss, victory and defeat (2.38).
  - **Equanimity is the method.** The Gita defines yoga here as
    {{ $$\textit{samatvam yoga ucyate}$$ }}
    (2.48, "evenness of mind is called yoga"), and adds that yoga is *skill in action* (*yogah karmasu kaushalam*, 2.50). This is not indifference to results: it is care for the action without clinging (*sanga*) to the outcome, as a lotus leaf is not wetted by water (5.10).
  - **Acting is not the problem; attachment is.** Since {{ nobody can remain without action even for a moment (3.5), the question is how to act, not whether }}, the Gita rejects both attachment to fruits and attachment to inaction (2.47).
  - **Three paths.** The Gita teaches {{ karma yoga (action), jnana yoga (knowledge of the self) and bhakti yoga (devotion to God) }}. In 5.2 Krishna says that {{ renunciation of action and the yoga of action both lead to liberation, and the yoga of action is better than renunciation of action alone }}. Readers differ on the order: Shankara holds that action done without desire purifies the mind while knowledge liberates; Ramanuja holds that devotion is the direct means and action and knowledge its aids; Tilak holds that action is the central teaching.
  - **Three layers.** That the Gita says these things, and who read it how, is history; that a calm, non-clinging way of acting works better is a claim psychology can test; that the self outlasts the body and that Krishna's authority settles the war is a metaphysical commitment, and the very point at which critics part ways.

cards:
  - type: mcq
    id: hook
    title: "Guess: what makes this hard?"
    prompt: |
      Guessing is the point; no background is needed. You are a warrior about to lead your side into a battle that your community judges to be just. Standing in the opposing lines you see your cousins and the teacher who trained you. You feel that your role says "fight", and you feel that harming these people is terrible. What makes this a real dilemma and not just fear?
    options:
      - text: "Two things you accept as binding pull in opposite directions: the duty that comes with your role, and the wrong of harming people you love."
        correct: true
        feedback: |
          Right. A dilemma is a clash between two claims you cannot simply drop. If one were false or trivial, there would be nothing to resolve. This is the situation of the lesson's hero, and the question is whether any argument can reconcile the two claims or must choose between them.
      - text: "You do not know who will win the battle."
        feedback: |
          Uncertainty about the outcome is a separate difficulty. Even if you knew the result, the clash between role and love would remain. Keep it in mind, though: the argument you are about to meet has a good deal to say about outcomes.
      - text: "You are simply afraid for your own life."
        feedback: |
          Fear of death can accompany a dilemma but it is not what makes it one. A brave person with no fear at all would still face the clash of the two claims.
    explanation: |
      A moral dilemma needs two claims that each bind. The rest of the lesson reads one famous answer to such a dilemma, and asks at each step what it assumes.

  - type: text
    id: setting
    title: "The field of Kurukshetra"
    image:
      src: img/kurukshetra-angkor.webp
      alt: "Stone relief at Angkor Wat showing a crowded battle scene with a chariot"
      caption: "A stone relief at Angkor Wat in Cambodia shows the battle of Kurukshetra, with Krishna driving Arjuna's chariot: the story was carried far beyond India."
      credit: "Michael Gunther, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Kurukshetra_Angkor_Wat_0859.jpg"
    body: |
      The ***Bhagavad Gita*** ("Song of the Lord") is a poem of 18 chapters and about 700 verses placed inside the *Mahabharata*, in its book called *Bhishma Parva*. It is *smriti* (remembered text), as the lesson What Is Hinduism? explained. Historians date it very roughly between 200 BCE and 200 CE, with proposals on both sides of that range, and debate whether it was part of the early epic or added later.

      The story is a family war. Two branches of one clan, the Pandavas and the Kauravas, are about to fight at ***Kurukshetra***, the "field of the Kurus". Arjuna, a Pandava and a famed archer, has chosen the god **Krishna** as his charioteer, not as a fighter. Facing a war against his own kin, in the first chapter (1.47) he casts away his bow and sinks down on the chariot seat. In 2.9 he tells Krishna he will not fight, and falls silent. The rest of the poem is Krishna's reply.

      The Gita is read by believers as the teaching of God himself, and by historians as a philosophical poem of its time; this lesson reads it as an *argument*, according to its own words and to the people who have read it.

  - type: mcq
    id: arjuna-q
    title: "What is Arjuna's state?"
    prompt: |
      At the opening of the Gita (1.47 and 2.9), Arjuna lets fall his bow and says he will not fight. Which description best fits the way the poem presents him?
    options:
      - text: "Overcome by grief and moral horror at killing his own kin, so that he cannot see how to act."
        correct: true
        feedback: |
          Right. The poem presents a skilled warrior who is not afraid of the enemy but is stopped by what winning would cost: the death of teachers and family. That is why Krishna's reply is an argument about duty and grief, not a pep talk about courage.
      - text: "Afraid for his own life and looking for an excuse to leave."
        feedback: |
          This is the cheap reading,. But Arjuna's own words speak of the wrong of killing relatives. Taking his dilemma seriously is what makes the answer worth studying.
      - text: "Convinced that the war cannot be won and that surrender is wiser."
        feedback: |
          Arjuna does not argue from strategy. His objection is moral and emotional: the price of victory.
    explanation: |
      Krishna must therefore answer two things at once: the grief (what does death really mean?) and the duty (what is Arjuna to do?). His answer has several steps. We will name them as premises, as in the other guided proofs of the course.

  - type: text
    id: plan
    title: "Krishna's reply in outline"
    body: |
      According to the Gita, Krishna's reply can be set out as five claims. We take them one at a time, asking of each what it assumes and who would reject it.

      **P1.** The wise do not grieve for the living or the dead: the self is not slain when the body is slain (2.19-20).

      **P2.** A warrior's own duty, his *svadharma*, is righteous battle, and one's own duty is better kept than another's (2.31, 3.35).

      **P3.** No one can remain without action even for a moment (3.5).

      **P4.** The right is to the action alone and never to its fruits (2.47).

      **P5.** So act with evenness of mind in gain and loss, victory and defeat (2.38), and the action does not bind.

      Between P1 and P5 there is also a question of validity: even if every premise is true, does the conclusion follow? Keep that apart from the truth of each premise.

  - type: mcq
    id: self-q
    title: "P1: what does it do, and what does it not?"
    prompt: |
      According to the Gita (2.19-20), the self is never born and never dies, and is not slain when the body is slain. A critic grants this for the sake of argument and says: "That removes grief at death. Does it also make it right to kill?" Which reading of the critic's point is correct?
    options:
      - text: "P1 answers the grief, because death is not the end of the self, but it does not by itself show that killing is permitted; that needs another premise such as P2."
        correct: true
        feedback: |
          Right. The first premise addresses the claim "killing destroys the person". It does not say what one *ought* to do. Defenders reply that this is exactly why the argument continues with duty, and some commentators add that in 2.19 the self is neither slayer nor slain, so the one who acts is the ego and the body. The critic still asks why that should excuse the acts.
      - text: "P1 settles the whole dilemma: if no one really dies, nothing wrong is done."
        feedback: |
          If this were enough, the poem could stop at the second chapter. Krishna goes on for sixteen more because the question of right action is not answered by the fact that the self survives. A harm can be wrong even if its victim survives in some sense.
      - text: "P1 is irrelevant, since grief has no role in ethics."
        feedback: |
          Arjuna's grief is what stops him, so it matters to the poem. An argument that ignored it would leave him stuck.
    explanation: |
      Layer check: that the Gita says the self is not slain is history of the text. That the self really survives is a metaphysical commitment (compare the lesson on Karma, Samsara and Moksha). Whoever rejects it loses P1 but, as we will see, not the rest.

  - type: text
    id: duty
    title: "P2: one's own duty"
    body: |
      In 2.31 Krishna tells Arjuna to look to his *svadharma*, his own duty, and not to waver: for a *kshatriya* (a member of the warrior class, in the traditional fourfold division of society) there is nothing better than a *righteous* battle. In 3.35 he adds the general rule that it is better to do one's own *dharma* even imperfectly than another's well. Commentators read *svadharma* in two ways. For many traditional readers it is the duty of one's class and stage of life. For some modern readers it is the duty that fits one's nature and place, not a fixed list.

      Notice two limits. The war is called *righteous*, so the verse does not say that any order must be obeyed; and the word *svadharma* ties the argument to roles that a reader may or may not accept.

  - type: mcq
    id: duty-q
    title: "Which is better, in 3.35?"
    prompt: |
      According to Gita 3.35 (in essence), which is better?
    options:
      - text: "To do one's own duty even if it is done imperfectly, rather than another's duty done well."
        correct: true
        feedback: |
          Right. The verse values fit between the person and the duty over polish. A well-done task that is not yours is not what the verse recommends.
      - text: "To do another's duty well, since results matter most."
        feedback: |
          This reverses the verse. And note that results are exactly what the Gita is about to demote (P4).
      - text: "To do whatever is easiest, since all duties are equal."
        feedback: |
          The verse ranks duties by whose they are. It does not say they are equal, and it does not recommend ease.
    explanation: |
      Critics of P2 ask who decides what one's own duty is, and whether duty by birth or role can be too easy a shield. Defenders answer that the premise is about the weight of a role one has really taken up, and note again the qualifier "righteous". The Gita itself, as read by Gandhi, is less about a literal war than about the inner struggle; this reading comes later in the lesson.

  - type: mcq
    id: act-q
    title: "P3: can Arjuna simply do nothing?"
    prompt: |
      According to Gita 3.5 (in essence), no one can remain without action even for a single moment, because everything alive is driven to act by the three *gunas* (the strands of nature in the lesson on Samkhya). Arjuna plans to do nothing: to put down his bow and sit. What follows for his plan?
    options:
      - text: "Putting down the bow is itself an act with consequences, so the real question is not whether to act but how."
        correct: true
        feedback: |
          Right. The third premise changes the shape of the dilemma: it was "fight or not act", and it becomes "which action, done in what spirit". Even a modern reader who rejects the *gunas* can accept the point that refusing is a choice with effects.
      - text: "It is permitted, because the gunas will act in his place."
        feedback: |
          The verse does not excuse him. It says action cannot be avoided, which is a reason to choose carefully, not to let go.
      - text: "It is the best path, because inaction avoids all harm."
        feedback: |
          This is the view the Gita argues against. Walking away from a duty also has harms, for those who depended on the person, and the Gita says explicitly that one should not be attached to inaction (2.47).
    explanation: |
      Layer check: that the Gita says this is textual history; that "refusal is also a choice" is a point ethicists of many schools accept, whether or not they accept the *gunas*.

  - type: text
    id: fruits
    title: "P4: the right is to the action alone"
    body: |
      The centre of the argument is verse 2.47. In essence it says four things: you have a right to action alone; never to its fruits (*phala*); do not let the fruit be your motive; and do not be attached to inaction. In Sanskrit it begins *karmany evadhikaras te*, "your right is to action alone".

      The point is about what is within your control. The action is yours; the result depends on many things that are not. A person who fixes on the fruit puts the centre of their effort outside their control. The next verses add the method: act while giving up *sanga* (clinging, attachment), and treat success and failure alike. Verse 2.48 defines yoga in this sense as *samatvam yoga ucyate*, "evenness of mind is called yoga". Verse 2.50 adds that yoga is *skill in action*.

      The idea is often called *nishkama karma*, "action without desire for results", though commentators dispute whether it means no desire at all or no clinging.

  - type: mcq
    id: fruits-q
    title: "Does 2.47 mean not caring?"
    prompt: |
      A reader says: "Verse 2.47 tells me not to care how my work turns out, so I may do it carelessly." According to the verses just read (2.47, 2.48, 2.50), what is the best reply?
    options:
      - text: "No: yoga is defined as skill in action and evenness of mind; the verse removes clinging to the result, not care for the work."
        correct: true
        feedback: |
          Right. The Gita asks for the full effort of a skilled actor together with a calm mind about the outcome. Carelessness would break 2.50, where skill in action is the very definition of the method. Some commentators say the skill *is* the non-attachment; either way, it is not indifference.
      - text: "Yes: if results do not matter, quality does not matter either."
        feedback: |
          This slides from "do not cling to the result" to "do not care about the work". The first is about the actor's state of mind; the second would contradict the verse on skill.
      - text: "No: the verse really means one should work only for the results."
        feedback: |
          That is the opposite of 2.47, which says the fruit is not to be the motive.
    explanation: |
      A second misreading is the one the verse itself names: "do not be attached to inaction". Detachment from fruits is not an excuse to do nothing. The reading as *care for the action, calm about the outcome* is the one the course will test in the next cards.

  - type: numeric
    id: archer
    title: "A toy: why calm may help the action"
    prompt: |
      This is our own toy, not a claim of the Gita. An archer takes 20 shots. When she attends only to the shot, she hits the target with probability $0.6$ each time. When she is thinking about the final score and worrying, her attention splits and the probability drops to $0.3$. Counting expected hits, how many more hits do we expect over the 20 shots when she attends only to the shot?
    answer: 6
    wrong:
      - value: 12
        feedback: |
          12 is the expected number of hits for the calm archer ($20\times0.6$). The question asks for the difference between the two archers.
      - value: 18
        feedback: |
          Check the second archer: she still hits some of the time, with probability $0.3$, so she is not at zero.
    hint: "Expected hits are the number of shots times the probability of a hit, for each archer."
    explanation: |
      The calm archer expects $20\times0.6=12$ hits and the worried archer $20\times0.3=6$. The difference is $12-6=6$. The toy shows one way to read 2.50: letting go of the result may improve the action. It is a psychology claim (people under evaluation pressure often do worse at skilled tasks) and not what proves the Gita right; the Gita's own reasons are about freedom from binding action and about duty.

  - type: mcq
    id: four-q
    title: "Who is acting without attachment?"
    prompt: |
      Four students prepare for the same hard exam, each working hard. **A** wants a high mark but, if the result is poor, accepts it calmly and studies on. **B** works hard, then is crushed for weeks by a poor result. **C** avoids studying so as never to fail. **D** studies only while a prize is promised and stops when it is withdrawn. Which student best matches the Gita's description (2.47, 2.48) of acting?
    options:
      - text: "A: full effort, and the same evenness of mind in success or failure."
        correct: true
        feedback: |
          Right. A wants the mark, so this is not the absence of desire; the difference is that the result does not own A. This is the reading of non-attachment as evenness of mind, and also of the skilled action in 2.50.
      - text: "B: the effort is what matters, and distress shows how much B cares."
        feedback: |
          B's effort fits, but the crushed state is exactly the clinging the verse names: the mind's peace depends on the outcome.
      - text: "C: avoiding failure by avoiding action."
        feedback: |
          This is "attachment to inaction", which 2.47 names and rejects.
      - text: "D: acting only while the fruit is guaranteed."
        feedback: |
          Here the fruit is the motive, which the verse forbids. When the fruit goes, so does the action.
    explanation: |
      The four students map onto the verse: A has both effort and evenness; B has effort without evenness; C has the attachment to inaction; D has the fruit as motive. Real people often move between these.

  - type: order
    id: chain
    title: "The argument in order"
    prompt: |
      Put Krishna's reply to Arjuna in the order in which, according to the outline of this lesson, the argument builds.
    steps:
      - "Grief at death is misplaced: according to the Gita, the self is not slain when the body is slain (2.19-20)."
      - "A warrior's own duty is righteous battle, and one's own duty is better kept than another's (2.31, 3.35)."
      - "Refusing is not a way out, because no one can remain without action even for a moment (3.5)."
      - "So the real question is how to act: the right is to the action, not to its fruits (2.47)."
      - "Act with evenness of mind in gain and loss, victory and defeat, and the action does not bind (2.38, 5.10)."
    hint: |
      First dissolve the grief, then say what the duty is, then show that doing nothing is also a choice, and only then state the rule for how to act.
    explanation: |
      Each step prepares the next. The grief is cleared away so that the duty can be heard; the duty is stated; the escape of inaction is closed; and the final rule says in what spirit the action should be done. The conclusion P5 is the answer to the question P3 opened.

  - type: text
    id: paths
    title: "Three paths, not one"
    body: |
      The Gita does not speak in one voice about the route to liberation. It presents three *yogas*, "disciplines" or "paths": ***karma yoga***, the path of action done without clinging; ***jnana yoga***, the path of knowledge of the self; and ***bhakti yoga***, the path of devotion to God. Chapter 3 begins with the first, chapter 12 asks which kind of yogi is best, and in 12.2 Krishna names those who fix their minds on him with steady faith.

      The poem does not say plainly how they relate. Chapter 5 begins with Arjuna asking which is better, renunciation of action or the yoga of action. In 5.2 Krishna says both lead to the highest good, and that the yoga of action is better than renunciation of action. Commentators stress that the comparison is with renunciation *alone*, without knowledge of the self.

  - type: mcq
    id: paths-q
    title: "What does 5.2 say?"
    prompt: |
      Arjuna asks Krishna whether renouncing action or practising the yoga of action is better (5.1). Which statement best matches Krishna's answer in 5.2?
    options:
      - text: "Both lead to liberation, and the yoga of action is the better of the two (compared with renunciation of action alone)."
        correct: true
        feedback: |
          Right. The answer is double: both paths reach the goal, and the yoga of action excels. This is why people who say that "the Gita rejects renunciation" or "the Gita tells us to retreat from the world" both oversimplify.
      - text: "Only renunciation leads to liberation; action binds."
        feedback: |
          This is a position some traditions hold, and the Gita seems to be answering it. It says action done without clinging does not bind (5.10).
      - text: "Neither leads to liberation; only devotion does."
        feedback: |
          Devotion is praised in chapter 12 but in 5.2 the two named paths are said to lead to the goal. Some readers (Ramanuja among them) place devotion higher; that is a reading and not what 5.2 itself says.
    explanation: |
      Because the text gives all three paths and does not rank them in a single sentence, later readers disagree about which is the centre. That is the subject of the next cards.

  - type: text
    id: readers
    title: "Readers who part ways"
    body: |
      Four well-known readers pick different centres.

      **Shankara** (the Vedanta teacher of the lesson on Advaita, Vishishtadvaita and Dvaita, c. 700-750 CE) wrote a commentary on the Gita. According to the scholars who study it, he holds that action done without desire for fruits and offered to God purifies the mind, but that only knowledge of the self liberates; in his view action and knowledge do not combine into one means.

      **Ramanuja** (c. 1077-1157 CE) also wrote a commentary, the *Gita Bhashya*. In his reading, devotion is the direct means to the Supreme, and action and knowledge are aids that lead toward it.

      **Bal Gangadhar Tilak** wrote the *Gita Rahasya* in Marathi, drafted while imprisoned in Mandalay (1908 to 1914) and published in 1915. He argued that the Gita's central message is selfless action, *karma yoga*, and not renunciation.

      **Mohandas Gandhi** made *anasakti*, non-attachment, the heart of the Gita in his Gujarati commentary *Anasaktiyoga*, and read the war as a picture of the inner struggle rather than as a history.

  - type: mcq
    id: readers-q
    title: "Who says what?"
    prompt: |
      Three readers of the Gita rank its paths differently: Shankara (the Vedanta teacher, c. 700-750 CE), Ramanuja (c. 1077-1157 CE) and Bal Gangadhar Tilak (author of the *Gita Rahasya*). Which pairing of reader and reading is correct?
    options:
      - text: "Tilak: selfless action is the central teaching. Ramanuja: devotion is the direct means. Shankara: action purifies, but knowledge liberates."
        correct: true
        feedback: |
          Right. Each reader finds the centre of the same poem in a different place. This is not a sign that one of them cannot read: the text supports all three paths, and each reader has a reason for ranking them.
      - text: "Tilak: only knowledge liberates. Ramanuja: only action matters. Shankara: devotion is the direct means."
        feedback: |
          This scrambles the three. Tilak is the reader who put action first; Shankara is the one who puts knowledge as the liberating means; Ramanuja puts devotion.
      - text: "All three: the Gita rejects action in favour of retreat."
        feedback: |
          Shankara is the nearest to this, and even he gives action a role in purifying the mind. Tilak argues the opposite, and Ramanuja treats action as an aid.
    explanation: |
      Layer check: who wrote what and when is history; which of them is right about the Gita's own intention is live debate among scholars and believers; whether the Gita is the word of God is faith. The course reports all three layers and chooses none.

  - type: mcq
    id: objection-q
    title: "An objection to P2 and P5"
    prompt: |
      A critic says: "'Do your duty and do not cling to the results' could justify anything a society demands of someone in a role, since it tells the actor not to look at the consequences." Which reply to this critic uses a point from the lesson?
    options:
      - text: "The premise speaks of a *righteous* battle (2.31) and of skilled action with evenness of mind, so it is not a licence to ignore whether the act is right; and a reader like Gandhi takes the war as an allegory of an inner struggle, so that the rule governs how to meet that struggle."
        correct: true
        feedback: |
          Right. This reply points to the qualifier in the text and gives an interpretation under which the objection weakens. The critic's strongest remaining point is that the text itself gives no test of when a war is righteous, and that Krishna's authority carries a great deal of the weight; defenders and critics still disagree.
      - text: "The Gita never mentions consequences, so the objection cannot apply."
        feedback: |
          It does mention them: 2.47 is about fruits, and the discussion of attachment depends on the consequences being real. What the verse removes is the *clinging*.
      - text: "The objection is correct and the Gita has no reply."
        feedback: |
          Defenders do have replies (as in the right option), though whether they succeed is exactly what thoughtful readers disagree on. Saying that there is no reply gives up too early.
    explanation: |
      Both the objection and the replies are live positions. The lesson does not choose: it shows where the weight of the argument lies, in the premises about role and about the authority of the speaker.

  - type: text
    id: resolve
    title: "Back to the dilemma"
    body: |
      We began with a clash between the duty of a role and the wrong of harming those we love. The Gita's resolution does not choose one claim and delete the other. It changes the question. First it says that doing nothing is also an action (P3), so the choice is not "act or stay clean". Then it says that what binds a person is not the action but the clinging to its results (P4), so a person can act fully and yet keep evenness of mind. In 18.73, the last chapter's reply, Arjuna says his delusion is gone, that he stands firm and free of doubt, and that he will act on Krishna's word (*karishye vacanam tava*).

      Whether the resolution succeeds is what separates the readers. For those who accept the self's survival and Krishna's authority, it succeeds. For others the part about acting without clinging stands on its own, as a way of keeping one's balance whatever one is asked to do.

  - type: mcq
    id: critic-q
    title: "What survives without belief?"
    prompt: |
      Suppose a reader does not believe in rebirth or in a self that outlasts the body, and does not take Krishna as God. Which of the premises P1 to P5 does this reader lose, and which can still be kept as ethical reasoning?
    options:
      - text: "P1 loses its support; P3 (refusing is also a choice) and the reading of P4-P5 as care for the action with calm about the outcome can still be kept."
        correct: true
        feedback: |
          Right. P1 depends on a metaphysical claim about the self. P3 can be kept in the form "refusing is a choice with effects", and P4-P5 as a practical stance. P2 survives only for those who accept the idea of duty by role, which many do and many do not.
      - text: "All five fall together, since the argument is only one chain."
        feedback: |
          The chain is not so fragile. Each step is distinct, and some of them stand on ordinary experience. Showing which depend on which is the purpose of listing premises.
      - text: "None is lost, since the Gita does not depend on belief."
        feedback: |
          P1 leans directly on a claim about the self that not everyone shares, and the weight of P2 and the choice of war rests on Krishna's authority for the believer. Pretending otherwise misses where readers truly part ways.
    explanation: |
      Layer check: P3 and the stance of P4-P5 are within reach of anyone (layer 2, partly testable: the archer toy is a small example); P1 and the authority of Krishna are layer 3, a commitment of faith or metaphysics.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the lesson Hindu Thought and Modern Science takes this tradition's ideas about the self, consciousness and the cosmos and puts them next to what physics and neuroscience say today. Ask of each comparison what is a real parallel and what only sounds alike.
