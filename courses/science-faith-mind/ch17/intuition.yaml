id: ch17-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: the traditions of South Asia grouped under the word "Hinduism": their oldest texts, the Vedas, the philosophical schools that read them, and a conversation with physics. Every answer below is *according to* some text, school or scholar.
  - **Vedas and layers.** The four Vedas are Rig (hymns), Sama (songs), Yajur (ritual formulas) and Atharva (hymns, spells, healing). In the usual idealized pattern each has layers, from earlier to later: {{ Samhita, Brahmana, Aranyaka, Upanishad }}. *Brahman* is the ultimate reality of the Upanishads, *Brahma* a creator god, *brahmin* a member of the priestly class.
  - **Sheaths and schools.** The *Taittiriya Upanishad* lists five sheaths of the person, outer to inner: food, breath, mind, understanding, bliss, with the Self within them. The three Vedanta schools: Advaita (Shankara) holds that only Brahman is real and the self is Brahman; Vishishtadvaita (Ramanuja) that souls and world are real and are {{ the body of Brahman, identified with Vishnu }}; Dvaita (Madhva) that difference is real and permanent in five ways, and he reads *tat tvam asi* as {{ *atat tvam asi*, "you are not that" }}.
  - **Karma, samsara, moksha.** Karma is action that leaves results; samsara is the cycle of rebirth; moksha is release. Karma is not fate, because present choices start new results.
  - **Six schools.** The astika (Veda-accepting) schools come in conventional pairs: Nyaya with Vaisheshika, Samkhya with Yoga, Mimamsa with Vedanta. Samkhya counts purusha, unmanifest prakriti and 23 products, so
    $$1+1+23={{ 25 }}$$
    principles. Nyaya states an inference in five members: thesis, reason, example, application, conclusion.
  - **The Gita.** The *Bhagavad Gita* (18 chapters, about 700 verses) names three paths: {{ karma yoga (action), jnana yoga (knowledge), bhakti yoga (devotion) }}. Its rule is to care for the action without clinging to its fruits; equanimity (*samatvam*) is called yoga.
  - **Dialogue with physics.** One *kalpa* ("day of Brahma") is 1000 mahayugas of 4,320,000 years:
    $$1000\times4{,}320{,}000=4.32\times10^{9}\ \text{years}.$$
    The universe is about $13.787\times10^9$ years old (Planck 2018), so a kalpa is {{ about 31% of the age of the universe }} and close to the age of the Earth. A resemblance of words (Capra, Zukav) shows nothing; an "observer" in quantum mechanics is any measuring interaction, not a conscious mind, while *purusha* in Samkhya is a passive witness.

cards:
  - type: text
    id: welcome
    title: "Quick recall: the Hindu traditions"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main distinctions: the layers of the Vedas, three look-alike words, the sheaths of the person, the three Vedanta schools, the pairs of classical schools, the five members of an inference, the paths of the Gita and a few numbers.

      Three kinds of card: **mnemonics**, **build and order cards**, and **numeric cards that give you data only**: you choose the method yourself.

      As always, every answer is *according to* some text, school or scholar. Nothing here asks which view is true.

  - type: order
    id: layers
    title: "Layers of a Veda"
    prompt: |
      In the usual idealized pattern, each of the Vedas has four layers of text. Put them in order, earliest first.
    steps:
      - 'Samhita: the hymns and formulas.'
      - 'Brahmana: prose on the ritual.'
      - 'Aranyaka: the "forest" texts.'
      - 'Upanishad: inquiry into the self and reality.'
    hint: 'The texts move from what is chanted, to how the ritual is done, to what it means.'
    explanation: |
      Mnemonic: **hymn, handbook, forest, inquiry**. The pattern is idealized: the layers overlap and differ from Veda to Veda. The Upanishads are also called *Vedanta*, "the end (or the goal) of the Veda".

  - type: mcq
    id: four-vedas
    title: "Which Veda is which"
    prompt: |
      Which pairing of a Veda with its main content is right?
    options:
      - text: 'Rigveda: hymns. Samaveda: songs. Yajurveda: ritual formulas. Atharvaveda: hymns, spells and healing.'
        correct: true
      - text: 'Rigveda: ritual formulas. Samaveda: hymns. Yajurveda: songs. Atharvaveda: philosophy of the self.'
        feedback: |
          The names carry the content: *rig* is a verse, *saman* a melody, *yajus* a sacrificial formula. Philosophy of the self belongs to the Upanishads, a later layer.
      - text: 'Rigveda: philosophy of the self. Samaveda: hymns. Yajurveda: spells. Atharvaveda: songs.'
        feedback: |
          Inquiry into the self is the Upanishad layer, not a whole Veda. Spells and healing are the mark of the Atharvaveda.
    shuffle: false
    explanation: |
      Mnemonic: **Rig recites, Sama sings, Yajur performs, Atharva heals**.

  - type: mcq
    id: three-words
    title: "Brahman, Brahma, brahmin"
    prompt: |
      Three similar words turn up in English: *Brahman*, *Brahma* and *brahmin*. Which matching is correct?
    options:
      - text: 'Brahman: the ultimate reality of the Upanishads. Brahma: a creator god of later texts. Brahmin: a member of the priestly class.'
        correct: true
      - text: 'Brahman: the priestly class. Brahma: the ultimate reality. Brahmin: a creator god.'
        feedback: |
          This is the same three words in the wrong places. The ultimate reality is Brahman; priests are brahmins; the creator god is Brahma.
      - text: 'Brahman: a creator god. Brahma: a member of the priestly class. Brahmin: the ultimate reality.'
        feedback: |
          Again shuffled. The Upanishads describe the ultimate, Brahman, by negations or as being and consciousness, not as a god with a body.
    shuffle: false
    explanation: |
      Mnemonic: **Brahman is the Ultimate, Brahma is the Maker, a brahmin is a priest**. Only Brahma, the god, has the "day" counted in the cosmic cycles later in this round.

  - type: order
    id: sheaths
    title: "Peeling the sheaths"
    prompt: |
      According to the *Taittiriya Upanishad*, the person is made of five sheaths with the Self within them. Put the sheaths in order from the outermost to the innermost.
    steps:
      - 'Food (*annamaya*)'
      - 'Breath (*pranamaya*)'
      - 'Mind (*manomaya*)'
      - 'Understanding (*vijnanamaya*)'
      - 'Bliss (*anandamaya*)'
    hint: 'Start with the body and move toward what is least like a body.'
    explanation: |
      Mnemonic: **food, breath, mind, understanding, bliss**, then the Self. The Self is not a sixth sheath but what is within all of them, which is why it is better translated "Self" than "soul".

  - type: text
    id: three-schools
    title: "Three Vedanta schools in one table"
    body: |
      All three read the Upanishads, the *Brahma Sutras* and the *Bhagavad Gita*; they differ on how the self relates to Brahman and the world.

      | School | Brahman and the self | *tat tvam asi* |
      |---|---|---|
      | Advaita (Shankara) | Only Brahman is real; the self is Brahman | "you are that" |
      | Vishishtadvaita (Ramanuja) | One Brahman (Vishnu); souls and world are his real body | you are his body |
      | Dvaita (Madhva) | Brahman (Vishnu) alone independent; difference is real | *atat tvam asi* |

      Mnemonic: **one, one with parts, two**.

  - type: mcq
    id: which-school
    title: "Which school says this?"
    prompt: |
      A teacher holds the following. Individual souls and the material world are real. They depend on one Brahman, identified with Vishnu, as a body depends on the one who indwells it, so souls are distinct from him yet inseparable. Which Vedanta school is this?
    options:
      - text: 'Vishishtadvaita (Ramanuja)'
        correct: true
      - text: 'Advaita (Shankara)'
        feedback: |
          Advaita says that only Brahman is ultimately real and that the many things of the world are *maya*. A teacher who gives the souls and the world a real, dependent existence is not describing that.
      - text: 'Dvaita (Madhva)'
        feedback: |
          Dvaita also keeps souls and world real, but its mark is five permanent differences, so a soul is never "the body" of God. The word "inseparable" points to Ramanuja.
    explanation: |
      Real souls and world, but one Brahman with parts: the body-and-indweller picture is Ramanuja's. The three readings are three metaphysical commitments, and no text or experiment settles which harmonizes the Upanishads best.

  - type: mcq
    id: moksha
    title: "Moksha in three schools"
    prompt: |
      According to each school, what is moksha (release from the cycle of rebirth)?
    options:
      - text: "Advaita: knowing that the self is Brahman, even in this life. Vishishtadvaita: the soul's eternal nearness to Vishnu, still itself. Dvaita: nearness to God in graded bliss, souls differing in capacity."
        correct: true
      - text: "Advaita: the soul's eternal nearness to Vishnu. Vishishtadvaita: graded bliss. Dvaita: knowing that the self is Brahman."
        feedback: |
          The three answers are shifted. Advaita, the school of identity, is the one where release is knowledge of identity.
      - text: 'Advaita: heaven as a reward for good karma. Vishishtadvaita: heaven for the priests. Dvaita: rebirth as a better being.'
        feedback: |
          Heaven and a better rebirth are results of karma inside samsara. Moksha is release from the cycle, not a better place in it.
    shuffle: false
    explanation: |
      Mnemonic: **know, near, graded**. The goal follows the metaphysics: if the self is Brahman, release is knowledge; if it is a distinct dependent soul, release is nearness.

  - type: mcq
    id: karma-limit
    title: "A limit check on karma"
    prompt: |
      Someone says: "According to karma, my past actions are already ripening, so nothing I choose now matters." Imagine the extreme where all of one's karma were already ripening and nothing new could start. What would the tradition's claim that actions "leave results that shape what the person becomes" then say about present choices?
    options:
      - text: 'That they would have no results at all, which is the opposite of the claim. So the tradition cannot mean this: the part already ripening shapes this life, but present choices start new results.'
        correct: true
      - text: 'That present choices would matter even more, because the old karma doubles them.'
        feedback: |
          Nothing in the idea doubles anything. In the extreme case, new choices would leave no results, so the claim about results would be empty.
      - text: 'That karma and fate are the same thing.'
        feedback: |
          Fate would leave no room for new results. Karma is the claim that actions leave results, which includes the present ones.
    explanation: |
      Limit checks test a claim by pushing it to an extreme. Here the extreme (all fixed) contradicts the principle (action leaves results), so karma is not fate. Whether karma and rebirth are true is a faith or metaphysical commitment; that the texts teach them is history.

  - type: mcq
    id: pairs
    title: "The six schools in pairs"
    prompt: |
      The six classical schools that accept the authority of the Veda (the *astika* schools) are conventionally arranged in three pairs that share a base. Which arrangement is the conventional one?
    options:
      - text: 'Nyaya with Vaisheshika, Samkhya with Yoga, Mimamsa with Vedanta.'
        correct: true
      - text: 'Nyaya with Samkhya, Yoga with Mimamsa, Vaisheshika with Vedanta.'
        feedback: |
          Each school here is placed with a different partner. The pairs follow shared foundations: logic and nature, dualist metaphysics and practice, ritual and the Upanishads.
      - text: 'Samkhya with Vedanta, Nyaya with Mimamsa, Yoga with Vaisheshika.'
        feedback: |
          Samkhya and Vedanta differ the most: Samkhya has many witnesses and one nature, Advaita one Brahman. The pair for Samkhya is Yoga.
    shuffle: false
    explanation: |
      Mnemonic: **logic pair, nature-and-practice pair, ritual-and-Upanishad pair**. The list is a later, conventional grouping of schools that were rivals. "Orthodox" here means accepting the Veda's authority, not believing in a creator: Samkhya and Mimamsa are astika without one.

  - type: numeric
    id: samkhya-count
    title: "Counting Samkhya's principles"
    prompt: |
      Samkhya, as its classical text sets it out, lists these principles: one *purusha* (the conscious witness); one unmanifest *prakriti* (nature); and its manifest products, namely the intellect (1), the ego (1), the mind and senses (11), the subtle elements (5) and the gross elements (5). How many principles in all?
    answer: 25
    tolerance: 0.1
    answerText: '25'
    wrong:
      - { value: 24, feedback: 'This leaves out the purusha: prakriti and its products give 24, and the witness is one more.' }
      - { value: 23, feedback: 'That is the number of manifest products alone (1+1+11+5+5). The unmanifest prakriti and the purusha are also principles.' }
    hint: 'Add everything in the list, one by one, and check that each group is counted once.'
    explanation: |
      Products: $1+1+11+5+5=23$. Add the unmanifest prakriti: $24$. Add purusha: $25$. Mnemonic: **25 = purusha + prakriti + 23**.

  - type: order
    id: nyaya-five
    title: "The five members of an inference"
    prompt: |
      Nyaya states an inference in five members. For the standard example, put them in order.
    steps:
      - 'There is fire on the hill. (thesis)'
      - 'Because there is smoke on it. (reason)'
      - 'Wherever there is smoke there is fire, as in a hearth. (example)'
      - 'This hill is smoky. (application)'
      - 'Therefore there is fire on the hill. (conclusion)'
    hint: 'Claim first, support in the middle, the same claim returns at the end.'
    explanation: |
      Mnemonic: **thesis, reason, example, application, conclusion**. The claim appears twice, first proposed and then established. A bad reason is a *hetvabhasa*: taking mist for smoke makes the reason unestablished.

  - type: mcq
    id: gita-rule
    title: "Acting without clinging"
    prompt: |
      A teacher tells a student: "Do the work with full care, accept gain and loss with evenness of mind, and do not cling to the outcome." Which reading of the *Bhagavad Gita* does this match?
    options:
      - text: 'The Gita (2.47-2.50): care for the action and equanimity (*samatvam*), without clinging to its fruits. This is skill in action, not indifference to the results.'
        correct: true
      - text: 'The Gita says one should refuse to act, since all action binds.'
        feedback: |
          The Gita says that nobody can stay without action even for a moment (3.5), so the question is how to act, not whether.
      - text: 'The Gita says to act only for the fruits, since fruits are the reason for action.'
        feedback: |
          The rule is "your right is to the action alone, never to its fruits": attachment to the fruits is the problem named.
    explanation: |
      Mnemonic: **act, don't cling**. The three paths are action (*karma yoga*), knowledge (*jnana yoga*) and devotion (*bhakti yoga*); Shankara, Ramanuja and Tilak order them differently.

  - type: numeric
    id: kalpa-share
    title: "A kalpa against the universe"
    prompt: |
      A *kalpa* ("day of Brahma") is 1000 mahayugas, and each mahayuga lasts 4,320,000 years. The universe is about $13.787\times10^{9}$ years old (Planck 2018). What percentage of the universe's age is one kalpa? Give one decimal.
    answer: 31.3
    tolerance: 0.2
    answerText: '31.3'
    wrong:
      - { value: 4.32, feedback: 'That is the length of the kalpa in billions of years. The question asks for it as a share of the age of the universe.' }
      - { value: 95.2, feedback: 'That compares the kalpa with the age of the Earth (about 4.54 billion years). Here the comparison is with the universe.' }
    hint: 'First put the kalpa in years, then compare it with the age of the universe: a share is part over whole. A kalpa is the day only, not day and night.'
    explanation: |
      The kalpa is $1000\times4{,}320{,}000=4.32\times10^{9}$ years. Then $4.32/13.787\approx0.313$, about $31.3\%$. So a kalpa is about a third of the universe's age and close to the age of the Earth, but the numbers are not tied to anything measured in cosmology.

  - type: numeric
    id: brahma-life
    title: "Brahma's life against the universe"
    prompt: |
      A day of Brahma is $4.32\times10^{9}$ years and his night is equally long. His year has 360 days and nights, and his life lasts 100 years. How many times the age of the universe ($13.787\times10^{9}$ years) is his life? Round to the nearest hundred.
    answer: 22600
    tolerance: 100
    answerText: '22600'
    wrong:
      - { value: 11300, feedback: 'This counts only the days. Each day is followed by a night of the same length.' }
      - { value: 226, feedback: 'Check the number of years in a life: it is 100 years of 360 days and nights, not 1 year.' }
    hint: 'Find how long one day plus one night lasts, then the number of them in a life, then divide by the age of the universe.'
    explanation: |
      One day and night is $8.64\times10^{9}$ years. For a life: $8.64\times10^{9}\times360\times100=3.1104\times10^{14}$ years. Dividing by $13.787\times10^{9}$ gives about $22{,}560$, so about $22{,}600$ times the age of the universe.

  - type: mcq
    id: witness-observer
    title: "Witness and observer"
    prompt: |
      Samkhya calls the self (*purusha*) a passive witness of nature. Standard quantum mechanics speaks of an "observer". Which statement is right?
    options:
      - text: 'In standard quantum mechanics an observer is any measuring interaction, not a conscious mind. The idea that consciousness causes collapse was proposed by Wigner, who later abandoned it. The word is shared; the claims are not.'
        correct: true
      - text: 'The two are the same idea, so quantum mechanics confirms Samkhya.'
        feedback: |
          A shared word does not make a shared claim. Purusha is a metaphysical witness of nature; the physicist's observer is an apparatus or an interaction that can be built and tested.
      - text: 'Quantum mechanics requires a conscious observer, as Wigner showed.'
        feedback: |
          Wigner proposed it and later gave it up after decoherence was understood. Standard accounts do not need a mind.
    explanation: |
      Mnemonic: **same word, different claim**. The same goes for *Brahman* and an electron's field, and for *maya*, which means the world of plurality as neither wholly real nor wholly unreal, not "matter does not exist".

  - type: mcq
    id: resonance
    title: "Fair resonance or overreach"
    prompt: |
      Which of these is a fair statement, and not an overreach, about Hindu thought and physics?
    options:
      - text: 'Both ask about the unity behind appearances, but they use different methods and make different kinds of claims; a resemblance in language shows nothing by itself.'
        correct: true
      - text: 'Capra and Zukav showed that physics has proved the Upanishads right.'
        feedback: |
          They drew parallels; physicists such as Gell-Mann answered that matching words is not matching claims. Nothing was proved.
      - text: 'Meditation research has confirmed that the self is Brahman.'
        feedback: |
          Studies find moderate evidence of small benefits for anxiety, depression and pain. They say nothing on the deep metaphysical claims.
    explanation: |
      Mnemonic: **compare questions, not words**. That the texts say these things is history; whether a parallel illuminates or is accidental is live debate; whether consciousness is the ground of reality is a metaphysical commitment on which thoughtful people part.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Vedas.** Four Vedas: Rig (hymns), Sama (songs), Yajur (ritual formulas), Atharva (hymns, spells, healing). Layers: Samhita, Brahmana, Aranyaka, Upanishad. Brahman is the Ultimate, Brahma the Maker, a brahmin a priest.

      **Self and schools.** Five sheaths, outer to inner: food, breath, mind, understanding, bliss. Advaita: one; Vishishtadvaita: one with parts (the world as Brahman's body); Dvaita: two, with five differences, and *atat tvam asi*. Moksha: know, near, graded.

      **Six schools.** Nyaya with Vaisheshika, Samkhya with Yoga, Mimamsa with Vedanta. Samkhya's count
      $$1+1+23=25.$$
      Nyaya's five members: thesis, reason, example, application, conclusion.

      **Gita and physics.** Act, don't cling; three paths of action, knowledge, devotion. A kalpa is
      $$1000\times4{,}320{,}000=4.32\times10^{9}\ \text{years},$$
      about 31% of the age of the universe. Same word, different claim: compare questions, not words.

      **Next:** the content map of this level: rebuild its concept map box by box among look-alike decoys.
