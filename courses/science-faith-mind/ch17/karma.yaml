id: ch17-karma
title: "Karma, Samsara, Moksha"
kind: concept
own: |
  The setting: the Indian traditions that grew out of the Upanishads (philosophical texts from India, composed from roughly 700 BCE) share a framework of three ideas. Each is described here as its followers hold it, with the objections and the replies kept visible.
  - **Karma** ("action"). In the Upanishads, according to the sage Yajnavalkya, a person becomes good by good action and bad by bad action; {{ actions, especially those done from desire, leave lasting results that shape what the person becomes }}. It is not fate: the share of karma already ripening shapes this life, but present choices start new results.
  - **Samsara** ("wandering"). {{ The cycle of birth, death and rebirth }}, taught in the Upanishads through the two paths after death (Chandogya Upanishad 5.10) and the image of a caterpillar moving to a new blade of grass (Brihadaranyaka Upanishad 4.4). The Gita (2.22) compares it to a person changing worn clothes for new ones.
  - **Moksha** ("release"). Liberation from the cycle. For Advaita (Shankara), it is knowing that the self is Brahman, possible even in this life. For Vishishtadvaita (Ramanuja), it is the soul's eternal nearness to Vishnu, still itself. For Dvaita (Madhva), it is nearness to God in {{ graded bliss, souls differing in their capacity }}.
  - **Objections and replies.** No memory carries over (reply: the result, not the memory, carries over). A first birth would have no cause (reply of Shankara: {{ samsara is beginningless, like seed and sprout }}). Karma explains inequality but can excuse indifference to the suffering of others (reply: it is a claim about one's own actions, not a license to blame victims). What carries over if there is no persistent self (reply of Hindu schools: the self persists; the Buddhist school disagrees, as a later lesson shows).
  - **Three layers.** That actions have moral results and rebirth occurs is a {{ faith or metaphysical commitment }}; the texts and their dates are history; the studies of children who report past lives are live debate, with critics pointing to leading questions and earlier contact between families.

cards:
  - type: mcq
    id: hook
    title: "Guess: a child born blind"
    prompt: |
      Guessing is the point; no background is needed. A child is born blind, and nobody is to blame for it. Three people try to say why the outcome could be fair. The first says it is chance, so fairness does not apply. The second says it is the will of a God whose reasons we cannot see. The third says it follows from a cause that came before this life. Which of the three answers needs the idea of a life *before* this one?
    options:
      - text: "The third: a cause from before this life, which would make the outcome earned by earlier actions."
        correct: true
        feedback: |
          Right. This is the shape of the Indian idea of karma. It tries to make the world morally fair by pushing the cause back before birth, and it needs the idea of a life before this one to do it.
      - text: "The first: if it is chance, something must have chosen the chance in an earlier life."
        feedback: |
          Chance, as its defenders mean it, has no earlier life behind it: it is exactly the claim that no one earns or deserves the outcome. It is a real answer, but it needs no past.
      - text: "The second: a God whose will we cannot see must have judged the child in an earlier life."
        feedback: |
          Many believers hold the divine-will answer without any earlier life. In some Hindu schools the two are combined, as we will see, but the second answer does not require it.
    explanation: |
      The three answers are three real positions. The lesson studies the third in the Indian traditions: what it says, where it comes from, how it can be understood in the schools of the last lesson, and what its critics reply.

  - type: text
    id: origin
    title: "Karma: action and what it does"
    image:
      src: img/brihadaranyaka-manuscript.webp
      alt: "A page of an old Sanskrit manuscript of the Brihadaranyaka Upanishad, written in lines of Devanagari script."
      caption: "A manuscript copy of the Brihadaranyaka Upanishad kept at the University of Pennsylvania library (Schoenberg Collection); the surviving copies are far younger than the text, which scholars date to roughly 700 BCE, give or take a century or two."
      credit: "Ms Sarah Welch, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Brihadaranyaka_upanishad_adhyaya_1_folio_3b,_pages_1r_1v_2r_2v,_Schoenberg_Center_manuscript,_Penn_Library.jpg"
    body: |
      The Sanskrit word ***karma*** means "action" or "deed". In the oldest Vedic texts it mostly meant the ritual act, the sacrifice done in the right way. The Upanishads, the early philosophical texts we met in the lesson Vedas and Upanishads, widened it to every intentional act, and attached a moral result to it: what you do shapes what you become.

      Scholars often point to a dialogue in the *Brihadaranyaka Upanishad* (3.2.13) as the earliest clear statement. A man named Artabhaga asks the sage Yajnavalkya what becomes of a person when he dies. Yajnavalkya takes him aside and they speak in private. According to the text, what they said and praised was karma, that a person becomes good by good action and bad by bad action. We keep to the wording "in essence", since translations differ.

  - type: mcq
    id: karma-q
    title: "What decides what a person becomes?"
    prompt: |
      According to Yajnavalkya in the *Brihadaranyaka Upanishad* (3.2.13), as scholars paraphrase it, what shapes what a person becomes after death?
    options:
      - text: "The person's own actions: good action makes the person good, bad action makes the person bad."
        correct: true
        feedback: |
          Right. The new point is that the cause is the person's own conduct, and that conduct has a moral result. The ritual remains important in the text, but it is no longer the only kind of action that counts.
      - text: "The family into which the person was born, regardless of conduct."
        feedback: |
          Birth is a result in this picture, not the cause. Later texts do link birth to earlier conduct, as we will see in the Chandogya.
      - text: "The correct performance of a sacrifice, whatever the intention."
        feedback: |
          Ritual action matters in the older Vedic view, but the Upanishadic point is wider: intentional action of every kind, and its moral quality, shape the person.
    explanation: |
      Layer check: that the text says this is a fact of history. That actions really have such results is a metaphysical commitment, which the objections below test.

  - type: text
    id: fires
    title: "Rebirth and two paths: the Chandogya"
    body: |
      The *Chandogya Upanishad* (5.3 to 5.10) tells of a king, Pravahana Jaivali, who asks the young Shvetaketu five questions about what happens after death. Shvetaketu cannot answer any of them, and his father, Uddalaka Aruni, goes to the king to learn. The text has the king say this teaching had never before been held by a brahmin.

      The teaching is called the *five fires*: it pictures existence as a cycle in which the person passes through five stages, from the other world down through rain, food and the parents to a new birth, each pictured as an offering into a fire. After death there are two paths. According to the text, those who know this teaching and those who meditate with faith in the forest go the *path of the gods* and do not return. Those who live by ritual and charity go the *path of the fathers*, enjoy a period in the world of the moon in proportion to their merit, and come back. Verse 5.10.7 then links the new birth to conduct in the earlier life: good conduct leads to a good birth, bad conduct to a lower one. A third route for tiny creatures is named at the end (5.10.8).

      Where did these ideas come from? Scholars disagree. The Indologist Johannes Bronkhorst (*Greater Magadha*, 2007) argued that karma and rebirth came from the culture of eastern India, the home of the Buddhists, Jains and Ajivikas, and entered the Vedic texts later, "dressed" in Vedic terms. Others, such as Herman Tull and Yuvraj Krishan, argued that they grew inside Vedic ritual thinking, from the early idea of "redeath", dying again in the next world. The question is open.

  - type: mcq
    id: fires-q
    title: "Reading the two paths"
    prompt: |
      In the *Chandogya* (5.10), a person who lived by ritual and charity goes the path of the fathers. What happens to such a person, according to the text?
    options:
      - text: "A time of enjoyment in proportion to the merit gained, then a return to a new birth shaped by conduct."
        correct: true
        feedback: |
          Right. Merit is like a stored sum that runs out. This is a clear early picture of how a good life can still end in return, so that liberation needs something other than good deeds.
      - text: "Permanent release, because ritual and charity are the highest action."
        feedback: |
          The text says the opposite: this path ends in return. Release belongs to the other path, that of knowledge, which is why the Upanishads value knowing the self so highly.
      - text: "Immediate return to the same family with no enjoyment in between."
        feedback: |
          The text describes a period of enjoyment first, and a new birth that depends on conduct, not a copy of the old family.
    explanation: |
      Notice the question this raises, which later schools tried to answer: if good deeds only lead to return, what can end the cycle? The next two cards give the words for the cycle and for its end.

  - type: text
    id: samsara
    title: "Samsara: the wandering"
    body: |
      ***Samsara*** means "wandering" or "passing through", the cycle of birth, death and rebirth. In the *Brihadaranyaka* (4.4) the move from one body to the next is compared to a caterpillar that reaches the tip of a blade of grass and draws itself onto a new one. The *Bhagavad Gita* (2.22), a later text in which the god Krishna teaches the warrior Arjuna, uses another image. In essence, it says that as a person puts aside worn-out clothes and takes new ones, the embodied self puts aside worn-out bodies and takes new ones.

      Both images say that something continues while the body changes. A comparison is not an argument, so it is worth asking what it assumes.

  - type: mcq
    id: samsara-q
    title: "What does the clothes image assume?"
    prompt: |
      The Gita (2.22) compares rebirth to a person changing worn clothes for new ones. Which statement names what the comparison *assumes*, so that a critic can examine it?
    options:
      - text: "That there is a someone distinct from the body, who stays the same while bodies change."
        correct: true
        feedback: |
          Right. Clothes can be changed because the wearer stays. If there is no such wearer, the image fails, which is exactly the point at which the Buddhist tradition, in its own level, parts company.
      - text: "That the new body must be identical to the old one."
        feedback: |
          New clothes may be quite different from old ones, and the new body too. The image assumes a continuing wearer, not a copy.
      - text: "That rebirth has been observed in the laboratory."
        feedback: |
          The image is an analogy used in a text; it makes no experimental claim. Whether any evidence exists is the subject of a card below.
    explanation: |
      The image makes the doctrine easy to grasp, but a picture of a wearer and clothes already contains a claim about the self. We return to this under the objections.

  - type: text
    id: moksha
    title: "Moksha: the way out"
    body: |
      ***Moksha*** means "release". Here the Upanishads connect karma to desire. In the *Brihadaranyaka* (4.4), a person is said to be shaped by desire and by action; one who desires is reborn where the mind clings, while one who is free of desire is not reborn, but in the words of one translation, "being Brahman goes to Brahman". Action done out of desire keeps the cycle going; knowledge of the self, according to the Upanishads, ends it. The verse numbers and wording differ slightly between editions, so we keep to the sense.

      The schools of the last lesson describe the release differently. For **Advaita** (Shankara), moksha is knowing that the self is Brahman, and it can happen in this life, called *jivanmukti*, "liberation while living". For **Vishishtadvaita** (Ramanuja), the soul stays itself, and moksha is eternal life with Vishnu in his heaven, Vaikuntha, in knowledge, bliss and loving service. For **Dvaita** (Madhva), souls stay distinct from God, and in the liberated state they enjoy God's nearness in graded bliss, according to their own capacity. Each school describes the end in the form its own metaphysics allows.

  - type: mcq
    id: moksha-q
    title: "Three ends, three schools"
    prompt: |
      Which pairing of school and view of moksha is correct?
    options:
      - text: "Advaita: knowing that the self is Brahman, even while living. Vishishtadvaita: the soul stays itself, in eternal nearness to Vishnu. Dvaita: nearness to God in graded bliss, souls still distinct."
        correct: true
        feedback: |
          Right. Identity, communion with distinction kept, and graded nearness. They follow from what each school says the self is.
      - text: "All three: the soul dissolves into Brahman like a drop in the sea."
        feedback: |
          Only Advaita speaks of identity, and even there the words "dissolve" and "drop" mislead, since the claim is that the self always was Brahman. The other two schools keep the soul distinct.
      - text: "Advaita: eternal service in Vaikuntha. Vishishtadvaita: knowing that the self is Brahman. Dvaita: dissolving into Brahman."
        feedback: |
          These are swapped. Service in Vaikuntha belongs to Ramanuja, identity to Shankara, and Madhva keeps God and soul permanently distinct.
    explanation: |
      Sources also call Advaita release "while living" and the other schools' release a state after death. Followers of each school would say this is a consequence of their view, not a separate rule.

  - type: order
    id: chain-order
    title: "The chain of karma"
    prompt: |
      Put the links of the chain in the order the doctrine gives them.
    steps:
      - "A person acts with intention and often with desire."
      - "The action leaves a lasting result, a kind of fruit that waits to ripen."
      - "At death, the results that remain shape the next body and its circumstances."
      - "The new life brings joys and sorrows that fit those results, and new actions begin the chain again."
    hint: "Start with the act and end where the chain starts over."
    explanation: |
      Notice that the chain has no judge in the description: the results ripen in the order the doctrine says. Whether a divine judge is needed is a question for the schools, taken up in the next cards.

  - type: mcq
    id: fate-q
    title: "Trap: is karma fate?"
    prompt: |
      Later Hindu thinkers speak of three kinds of karma. The **stored** karma is the whole store of unripe results. The **ripening** karma is the portion now bearing fruit in this life. The **new** karma is what is made by present choices. A student says: "If karma is real, then everything that happens to me is fixed in advance, so my choices do not matter." What is a fair reply, in the terms of the doctrine?
    options:
      - text: "Only the ripening portion shapes the circumstances of this life. Present choices add new karma, which shapes what comes next and how one meets what comes, so choice still matters."
        correct: true
        feedback: |
          Right. The doctrine, as thinkers of the schools set it out, separates what is fixed (the ripening portion) from what is open (new action). Ramanuja, for instance, kept moral responsibility with the individual soul.
      - text: "Karma is fate, and that is exactly why the schools tell people not to act."
        feedback: |
          If everything were fixed, the teaching of right action would be pointless. The Upanishads and the Gita urge right action precisely because it counts.
      - text: "Karma applies to gods but not to humans, so human choices are free."
        feedback: |
          The doctrine is about the actions of beings who act, humans included. It does not exempt people.
    explanation: |
      The split between what is given and what is chosen is common to many ideas of responsibility: a person is not accountable for the circumstances of birth, only for what is done with them. Here the doctrine adds that the circumstances themselves were once made by action.

  - type: mcq
    id: judge-q
    title: "Does karma need a judge?"
    prompt: |
      Does the doctrine of karma need a God who hands out rewards and punishments? Thinkers of the Vedanta schools gave different answers. Which description of the debate is accurate?
    options:
      - text: "Shankara argued that karma, being insentient, cannot deliver its results on its own, so a conscious Lord must dispense them according to the deeds; others, such as the modern teacher Sivananda, compared karma to seeds that grow by their own nature, with God partial to no one."
        correct: true
        feedback: |
          Right. Both agree the results follow the deeds. They differ on whether something conscious is needed to deliver them, which separates the "law-like" from the "judge" reading.
      - text: "All Vedanta thinkers hold that karma works like a court, with a divine judge who punishes and rewards by decree."
        feedback: |
          Some do give a role to God in dispensing results, but the texts also stress that God takes the deeds into account and is not partial. And others treat karma as a natural law-like process.
      - text: "All Hindu thinkers hold that karma is a blind natural law and God has no role."
        feedback: |
          The Vedanta schools of this level give God a role in delivering results, so this fits only some readings.
    explanation: |
      Two readings, then: karma as a moral law that works by itself, and karma delivered by a Lord who keeps it fair. The difference matters for the problem of evil, as the card on injustice shows.

  - type: mcq
    id: reason-q
    title: "Trap: 'everything happens for a reason'"
    prompt: |
      Someone hears about a stranger's illness and says: "It is karma. They must have done something to deserve it." Which is the fairer account of the doctrine?
    options:
      - text: "The doctrine is a thesis that actions have results. It does not follow that any one misfortune is the sufferer's guilt, and critics warn that using it to blame victims is a moral risk."
        correct: true
        feedback: |
          Right. This is a case where a doctrine can be fair in itself and unfair in use. We separate what the teaching claims from how people may turn it against those who suffer.
      - text: "The doctrine says every event is a punishment or reward, so the remark is correct."
        feedback: |
          A claim that all misfortune is deserved is a stronger claim than that actions have results. It also invites the objection that follows.
      - text: "The doctrine says nothing about suffering, so the remark is meaningless."
        feedback: |
          The doctrine is about suffering and fairness. Its defenders use it to explain inequality. The caution is about how it is applied to others.
    explanation: |
      To avoid blaming the victim, many teachers stress that karma is a claim about one's own deeds, and about the duty to help those who suffer. Whether the doctrine can be made safe in this way is itself a point on which thoughtful people differ.

  - type: text
    id: objections
    title: "Two objections about the past"
    body: |
      The doctrine has met objections from the start. The first is **memory**. If I lived before, why do I recall nothing, and how can a result be a fair consequence when I cannot know what it is for? The usual reply is that the result, not the memory, carries over: the self, with the traces of its action, passes on. A critic answers that a punishment one cannot connect to a deed does not teach anything.

      The second is the **first birth**. If every state comes from earlier action, what was the first action, and what caused the first life? The reply of Shankara (in his commentary on the *Brahma Sutras* 2.1.35 and 2.1.36) is that samsara has no beginning: karma and birth are like seed and sprout, each coming from the other, so there is no first one. A critic replies that an endless chain explains each link but not the chain itself.

  - type: mcq
    id: regress-q
    title: "A reply to the first-birth objection"
    prompt: |
      A critic says: "If every life is caused by the karma of an earlier life, the first life must have had no cause, so the doctrine is incomplete." Which describes the reply of Shankara and the critic's answer to it?
    options:
      - text: "Shankara: samsara is beginningless, like seed and sprout, each from the other, so no first life is needed. The critic: an endless chain explains each link but not why there is a chain."
        correct: true
        feedback: |
          Right. This is also the structure of a debate in the philosophy of the cosmos about whether an endless past needs an explanation as a whole, which the lesson on the cosmological argument discussed.
      - text: "Shankara: the first life came from a single great sin of the first human. The critic: Adam is a myth."
        feedback: |
          That is a different tradition's story. The Vedanta reply is not a first sin but the denial of a first point.
      - text: "Shankara: the first life was caused by chance, so karma begins later. The critic: chance has no place here."
        feedback: |
          This would give up the central claim that conduct explains birth, so it is not the reply given.
    explanation: |
      The structure of the reply and of the criticism is old: both sides ask whether "no beginning" counts as an explanation. That is a layer-3 disagreement about what an explanation must do.

  - type: text
    id: injustice
    title: "Injustice and the problem of evil"
    body: |
      The *Brahma Sutras* (2.1.34) face a worry that sounds very modern. If a God made this unequal world, with some born in comfort and others in pain, is God partial or cruel? Shankara's reply, in his commentary, is that God is not, because God takes the earlier deeds of each being into account. Without them the inequality would be unjustified; with them, each gets what fits. Ramanuja gave a similar answer in his own way.

      In the lessons The Evidential Problem of Evil and Theodicies and Their Critics, we met the Western version of the worry. One family of replies, the "free will defence" and "soul-making" views, explains suffering by what it allows or builds. The karma reply is different in shape: it explains the *unequal distribution* of suffering by earlier actions, and so needs no divine plan for the child's blindness in particular.

  - type: mcq
    id: evil-q
    title: "Karma and the problem of evil"
    prompt: |
      Compare the karma reply with the Western replies to the problem of evil. Which comparison is fair?
    options:
      - text: "Both try to connect suffering to a moral order, but karma explains each person's suffering by their own earlier actions, which commits it to rebirth, a beginningless chain and a self that persists, none of which the Western replies need."
        correct: true
        feedback: |
          Right. Each answer pays a price: the Western replies may need a good reason known only to God, karma needs a past life. A critic of either asks whether the price is acceptable.
      - text: "The karma reply removes the problem completely, since no one suffers without earning it."
        feedback: |
          A critic points out that the sufferer cannot remember the cause, that the chain has no beginning, and that sympathy for the sufferer may weaken. So the problem is moved, not removed.
      - text: "The karma reply is the same as the free will defence."
        feedback: |
          The free will defence appeals to the good of free choices made by others in this world; karma appeals to one's own earlier deeds. They share only the aim of connecting suffering to responsibility.
    explanation: |
      For a believer in karma, the move is a strength: it takes responsibility seriously. For a critic, it is a weakness: the explanation cannot be checked. Neither side can settle it by logic alone.

  - type: mcq
    id: self-q
    title: "What carries over?"
    prompt: |
      Suppose a critic says: "If the next person has none of my memories and a different body, why call that person *me*? What carries over?" Which answer fits the Hindu schools of this level?
    options:
      - text: "The self (*atman* or the individual soul) persists across bodies and carries the traces of past action; memory and body are not what makes it the same."
        correct: true
        feedback: |
          Right. In Advaita, the self itself is not the doer, so the traces are attached to the individual being as it appears in ignorance, carried by a subtle level of the person, according to later Advaita writers; the other schools keep an individual soul. Either way there is a something that continues.
      - text: "Nothing persists at all; only a series of events with no owner."
        feedback: |
          That is the Buddhist view, which rejects a persistent self. The Hindu schools of this level hold the opposite, and the later lesson on Buddhism explains how that school answers the same question.
      - text: "The same body, which is reborn."
        feedback: |
          The doctrine says that the body is left behind, like worn clothes.
    explanation: |
      Whether a continuing self exists is the real dividing line. The Hindu schools say yes, the Buddhist school says no and still keeps a form of karma and rebirth. We come back to this when Buddhism is studied.

  - type: text
    id: evidence
    title: "Is there evidence?"
    body: |
      Faith is one layer. Some researchers have tried to test rebirth with data. The best known is the psychiatrist **Ian Stevenson** (1918 to 2007) of the University of Virginia, who from 1961 collected reports of young children who said they remembered a previous life. The children usually begin speaking of it at about age two or three and stop by six or seven, and the median gap between the previous person's death and the child's birth is reported to be about 15 months. The Virginia database, continued by the psychiatrist Jim Tucker after 2002, holds more than 2,500 cases, and Stevenson reported birthmarks that he compared with the injuries of the previous person.

      Critics replied with several points. The questions put to the children may have led them. In many cases the two families had met before the interviews. Believing families may shape what a child says, and cases that did not fit may have been left out. Some critics point to cryptomnesia, an unconscious memory of something heard earlier. Stevenson himself wrote that the evidence is not flawless and does not compel belief. No verdict is offered here: the lesson Reincarnation Evidence and Its Critics, later in the course, returns to the cases.

  - type: mcq
    id: layers-q
    title: "Sorting the claims by layer"
    prompt: |
      Select **all** the statements that are correctly sorted by layer.
    multiple: true
    options:
      - text: "'The Brihadaranyaka Upanishad (3.2.13) states that a person becomes good by good action' is a claim about the content of a text, a matter of history."
        correct: true
        feedback: |
          Right, it can be checked by reading the text and comparing translations.
      - text: "'Every unequal birth is explained by deeds in an earlier life' is a faith or metaphysical commitment."
        correct: true
        feedback: |
          Right. It is argued in the schools, but not settled by a text or an experiment.
      - text: "'Studies of children who report past lives are accepted as proof of rebirth by scientists' is established fact."
        feedback: |
          That is not established. The studies exist, and some researchers defend them, but critics have raised serious objections and no general acceptance exists.
      - text: "'Where the doctrine came from is settled' is a scholarly consensus."
        feedback: |
          The origin of karma and rebirth is open: Bronkhorst and Tull, for instance, disagree.
    explanation: |
      The same doctrine has a historical layer (what the texts say), a layer of live scholarly debate (where it came from, what the child studies show), and a layer of commitment (whether it is true).

  - type: mcq
    id: parting-q
    title: "Where thoughtful people part ways"
    prompt: |
      A believer in karma, a naturalist and an agnostic each read the same objections. Which statement says where they would honestly part ways?
    options:
      - text: "On whether a persistent self carries moral results across lives: the believer says yes, the naturalist finds no evidence for it, and the agnostic holds that the question is open."
        correct: true
        feedback: |
          Right. All can agree on what the texts say and on what the objections are. They differ on a premise: whether anything survives death and carries results, and what counts as evidence for it.
      - text: "On what the Sanskrit words mean, since only the believer can read them."
        feedback: |
          Scholars of every conviction read the texts. The disagreement is about reality, not about language.
      - text: "On whether suffering exists."
        feedback: |
          All agree that it does. They differ on what explains its distribution.
    explanation: |
      The disagreement is at the premise: does anything continue across death, and can a moral order work through it? It is the old question of whether a mind or self can outlast the body, now put in the Indian setting.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the six classical schools, the *darshanas*, give the Indian tradition its systematic thinking: the dualist cosmology of Samkhya, yoga as a method for ending the cycle, and the logic of Nyaya. They ask how one knows, and how the mind can be trained to be free.
