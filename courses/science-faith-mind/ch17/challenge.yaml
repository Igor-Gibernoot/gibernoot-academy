id: ch17-challenge
title: "Level Challenge: Many Paths, One Question (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: a dialogue, a life and a list"
    body: |
      Problems 1 to 3 use **invented** teachers, students, villages and numbers, built to practise on cases you have never seen; nothing in them is a claim about a real text or a real person. Where a real school, text or thinker appears, it is named as "according to".

      - **Problem 1 · A teaching dialogue read three ways.** Advaita, Vishishtadvaita and Dvaita on one invented saying, and why a text cannot settle the dispute.
      - **Problem 2 · A sage and the three objections to karma and rebirth.** Replies, a toy count, and the layers.
      - **Problem 3 · Samkhya and Nyaya.** A count of principles, a five-member inference, and two bad reasons.

      **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. A claim never moves up a layer by being repeated. Problems 4 and 5 (the Gita argument from a modern dilemma, a "quantum Vedanta" claim, and the closing weighing) come in part 2.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      Six tools from the level, each stated so it can be used alone.

      - **Three readings of one saying.** *Tat tvam asi*, "that you are", is a refrain of a teaching in the Chandogya Upanishad. According to **Advaita** (Shankara, c. 700-750 CE) the self (*atman*) and Brahman, the ultimate reality, are one, and difference is appearance. According to **Vishishtadvaita** (Ramanuja, c. 1077-1157) individual souls and the world are real and are the body of Brahman, who is their inner controller. According to **Dvaita** (Madhva, 1238-1317) Brahman, identified with Vishnu, is the one independent reality and souls and matter are real and dependent; Madhva reads the saying as *atat tvam asi*, "you are not that".
      - **Five differences** (Dvaita): God and soul, God and matter, soul and matter, one soul and another, one material thing and another, all real and permanent.
      - **Karma and rebirth.** Actions have results, and the self with the traces of its actions passes from body to body (*samsara*). Three standard objections: no memory carries over; a first birth would have no cause; it may excuse blaming victims.
      - **Samkhya.** Two realities: *purusha*, the witness, and *prakriti*, nature, whose 23 manifest products are counted with purusha and unmanifest prakriti as 25 principles.
      - **Nyaya.** An inference in five members: thesis, reason, example, application, conclusion. Five kinds of bad reason (*hetvabhasa*): deviation, contradiction, unestablished, counterbalanced, rebutted.
      - **Layers.** Fact, debate, commitment.

  # ---------------- Problem 1 ----------------
  - type: text
    id: p1-setup
    title: "Problem 1 · The saffron dialogue"
    body: |
      **Problem 1.** An invented passage in the style of the Upanishads. The teacher Arani speaks to his daughter's son Kavi, who has just come home after many years of study and is proud of it.

      > "Kavi, put this strand of saffron into the pot of milk and bring the milk to me tomorrow." The next day: "Bring me the strand." Kavi searched and could not find it. "Taste the milk from the top." "Sweet, grandfather." "From the middle." "Sweet." "From the bottom." "Sweet." "The saffron is here, though you cannot find it. In the same way that fine thing is in all of this, and you are that."

      The task: read the last sentence as Advaita, as Vishishtadvaita and as Dvaita would, then ask what a text alone can settle.

  - type: mcq
    id: p1-advaita
    title: "The Advaita reading"
    prompt: |
      In the dialogue the saffron cannot be found as a separate thing, yet it is everywhere in the milk, and the teacher says "you are that". According to Advaita (Shankara), what does the saying teach?
    options:
      - text: "The self, rightly known, is the one reality behind all things; the apparent separation between Kavi and that reality is a result of ignorance, not a real difference."
        correct: true
        feedback: |
          Yes. For Shankara the saying states an identity between the self and the ultimate. The image shows something that cannot be picked out and yet is the whole taste, as Brahman is not an object among objects.
      - text: "Kavi is a small part of a larger being, as a drop is part of a pot."
        feedback: |
          A part-and-whole picture belongs to Ramanuja's school, where souls are real parts or modes of a Brahman who has them as a body. For Advaita Brahman has no parts, and the self is not a piece of it but is it.
      - text: "Kavi is made by the saffron-like being, and always remains different from it."
        feedback: |
          That is the Dvaita direction: permanent difference. Advaita reads the saying as an identity statement, not a statement about dependence.
    explanation: |
      Label: **debate** (what the saying means; many modern translators prefer "that is how you are", a weaker reading) and **commitment** (that the identity is true). The reading follows the lesson on Brahman and Atman.

  - type: mcq
    id: p1-vishishta
    title: "The Vishishtadvaita reading"
    prompt: |
      According to Ramanuja, the word "you" in "that you are" points beyond the boy. Which reading of the same dialogue fits his school?
    options:
      - text: "The word for 'you' reaches, through the boy, to Brahman who dwells in him as his inner controller; the saffron in the milk shows a presence that pervades yet the boy remains a real soul, the body of that indweller."
        correct: true
        feedback: |
          Yes. Souls are real and distinct, yet inseparable from Brahman, as a body is from the one who dwells in it. The sentence is true because Brahman is in Kavi and Kavi belongs to Brahman.
      - text: "Kavi has no real existence, as the milk has no real difference from the saffron's taste."
        feedback: |
          That denies the reality of the soul, which Ramanuja rejects. For him the soul is real, and so is the world.
      - text: "The saying should be read 'you are not that', since the strand can still be told apart from the milk."
        feedback: |
          That is Madhva's reading, not Ramanuja's. Ramanuja keeps the saying as it stands and reads it with a qualification.
    explanation: |
      Label: **debate**. Ramanuja and Shankara read the same words and agree that Brahman is one; they differ on whether the self is Brahman itself or Brahman's real, dependent body.

  - type: mcq
    id: p1-dvaita
    title: "The Dvaita reading"
    prompt: |
      According to Madhva, who reads the saying as *atat tvam asi* ("you are not that"), how is the teaching of the dialogue to be understood?
    options:
      - text: "Brahman, identified with Vishnu, is present in everything and sustains it, but the soul is permanently different from Him and wholly dependent on Him; the image teaches presence and dependence, not sameness."
        correct: true
        feedback: |
          Yes. Madhva splits the phrase differently in the Sanskrit, taking the letter *a* from the word before it, and reads the unity sayings in the light of the texts that speak of a Lord and of permanent difference.
      - text: "The self is the same as God, but the world of matter is different."
        feedback: |
          Madhva holds all five differences are real, including the difference between God and every soul. No soul is God.
      - text: "The dialogue is false, since no Upanishad could say 'you are that'."
        feedback: |
          Madhva keeps the verse and argues about how to read it. A school that accepts the authority of the Veda reads a saying differently; it does not throw it out.
    explanation: |
      Label: **debate** and **commitment**. The disagreement is partly grammatical (where the phrase is split), partly about which passages are taken as the main teaching and which are read in a secondary way.

  - type: numeric
    id: p1-kinds
    title: "How many kinds of difference?"
    prompt: |
      Dvaita recognises three kinds of being: God, souls and matter. It holds that the following are all real and permanent: God from a soul, God from matter, a soul from matter, one soul from another, and one material thing from another. How many kinds of difference is that?
    answer: 5
    wrong:
      - { value: 3, feedback: "3 is the number of kinds of being (God, souls, matter), not the number of kinds of difference. Differences between two kinds are three, and there are also two inside a kind (soul from soul, thing from thing)." }
      - { value: 6, feedback: "6 would be all ordered pairs among three kinds of being, counting each difference twice or adding God from God, which is not a difference at all." }
    hint: Count the listed differences, one per item.
    explanation: |
      Three pairs of different kinds (God and soul, God and matter, soul and matter) and two inside a kind (soul and soul, matter and matter) make $3+2=5$. God is one, so there is no difference of God from God.

  - type: numeric
    id: p1-pairs
    title: "Pairs of things in one toy world"
    prompt: |
      A toy world has $1$ God, $3$ souls and $2$ material things. Dvaita says any two of these are really different. How many different pairs of two distinct beings are there?
    answer: 15
    wrong:
      - { value: 5, feedback: "5 counts the kinds of difference, not the pairs of actual beings. With 3 souls there are already 3 pairs of souls, and with 6 beings there are many more pairs than kinds." }
      - { value: 30, feedback: "30 counts each pair twice, once as 'A from B' and once as 'B from A'. A pair is the same pair in either order." }
    hint: Count each pair once. You can count by kinds (God-soul, God-thing, soul-thing, soul-soul, thing-thing) and add them.
    explanation: |
      God and soul: $1\times3=3$. God and thing: $1\times2=2$. Soul and thing: $3\times2=6$. Soul and soul: $\binom{3}{2}=3$. Thing and thing: $\binom{2}{2}=1$. Total $3+2+6+3+1=15$, which equals $\binom{6}{2}=15$ for six beings. The five kinds of difference organise these fifteen real differences.

  - type: order
    id: p1-rank
    title: "How much plurality is real?"
    prompt: |
      Put the three readings in order, from the one that says the fewest things are ultimately real to the one that says the most are real and different.
    steps:
      - "Advaita: only Brahman is ultimately real; separate selves and a world of many things are appearance."
      - "Vishishtadvaita: one Brahman, with real souls and a real world as its body, distinct and inseparable."
      - "Dvaita: God, souls and matter are all real, permanently different, with souls and matter dependent on God."
    hint: Ask in each school what is real besides Brahman, and whether it is the same as Brahman.
    explanation: |
      The ordering is by how much real plurality each school accepts. The middle school keeps both unity (one Brahman who has everything as a body) and plurality (real souls). It is not a halfway compromise in method: Ramanuja argues from the texts, as the others do.

  - type: mcq
    id: p1-settle
    title: "Can the text settle it?"
    prompt: |
      Three readers argue over the dialogue. A says, "The text itself shows Advaita is right, since it says 'you are that'." B says, "The text itself shows Dvaita is right, since it says 'atat tvam asi'." What is the fairest summary?
    options:
      - text: "The wording is shared and the dispute is about how to split the words, which passages are the main teaching, and how to read the rest in their light. A text does not say how it is to be read, so each school brings its own principle of reading; the decision rests on those principles, and ultimately on commitments about reality."
        correct: true
        feedback: |
          Yes. A historian can say what the words are and what a translator might choose; she cannot show that one reading of the Veda is the true one, since that depends on premises each school defends.
      - text: "The oldest manuscript decides which school is right."
        feedback: |
          A manuscript shows what the words were, not how to read them. All three schools read the same words.
      - text: "One of the three readers is simply ignorant of Sanskrit, and the dispute ends once that is shown."
        feedback: |
          All three schools had masters of the language. The dispute survives knowing the language, since Sanskrit allows more than one reading of the phrase.
    explanation: |
      Layers: the words are **established**; the best translation and the history of the schools are **debate**; whether the self is Brahman is **commitment**. This is why the course reports where the readers part and why, rather than naming a winner.

  # ---------------- Problem 2 ----------------
  - type: text
    id: p2-setup
    title: "Problem 2 · The sage and the three objections"
    body: |
      **Problem 2.** An invented village. A sage named Vasudatta teaches that a child born with no sight, to parents who were kind to all, is the result of actions done in an earlier life: karma and rebirth. Three villagers object in turn. Meera: "I remember nothing of any earlier life." Dev: "Then what was the very first action, before any life?" Sunita: "Then you may as well tell the blind child's mother that it was her fault."

      The task: match each objection with the standard reply, test a toy count, and sort what belongs to which layer.

  - type: mcq
    id: p2-memory
    title: "Meera: no memory"
    prompt: |
      Meera says she remembers nothing of an earlier life, so a result in this life cannot be a fair consequence of it. Which is the usual reply and the usual critic's answer?
    options:
      - text: "Reply: the result, not the memory, carries over; the self passes on with the traces of its action. Critic: a consequence one cannot link to a deed does not teach anything, so the fairness is hard to see."
        correct: true
        feedback: |
          Yes. The reply separates what carries over (the traces, and for the schools the self) from what does not (memory). The critic's answer keeps the force of Meera's point: a lesson needs a recognisable cause.
      - text: "Reply: everyone does remember earlier lives but chooses not to speak. Critic: none."
        feedback: |
          No school makes this claim, and the doctrine has critics from the start. Memory claims (such as the children's cases studied by Stevenson, 1918-2007) are rare and debated, not universal.
      - text: "Reply: the objection proves rebirth false, so the doctrine fails."
        feedback: |
          The objection is a difficulty that the doctrine answers, with replies that a critic may find weak. It does not show the doctrine false; it shows where its defender has work to do.
    explanation: |
      Label: **debate** (whether the reply works) and **commitment** (that something persists across bodies). The objection is about fairness and teaching, not about whether the doctrine is internally consistent.

  - type: mcq
    id: p2-first
    title: "Dev: the first action"
    prompt: |
      Dev asks what the first action was, and what caused the first life. According to Shankara (on the *Brahma Sutras* 2.1.35-36), what is the reply, and what does a critic say?
    options:
      - text: "Samsara has no beginning: karma and birth are like seed and sprout, each from the other, so there is no first one. A critic: an endless chain explains each link but not why there is a chain at all."
        correct: true
        feedback: |
          Yes. A chain that never began needs no first cause inside it, but the critic asks about the whole chain, a question the reply does not answer.
      - text: "The first action was done by God as an experiment, and all later karma follows from it."
        feedback: |
          Shankara's reply is that the chain is beginningless, not that a first act was done by God. In his commentary he also argues that God is not partial.
      - text: "There was a first life, since every chain must start; the doctrine says so."
        feedback: |
          The doctrine in this reply is exactly the denial of a first birth. A chain with no start can still be questioned, but it does not have a first link.
    explanation: |
      Label: **debate**. The reply uses a seed-and-sprout analogy: each is the cause of the next and each has a cause before it. Whether an endless regress is an answer or a refusal of the question is itself a point on which philosophers differ.

  - type: mcq
    id: p2-blame
    title: "Sunita: blaming the victim"
    prompt: |
      Sunita says the doctrine tells the blind child's mother that the suffering is her fault. Which reply is fair to the tradition, and which risk is fair to the critic?
    options:
      - text: "Reply: karma is a claim about one's own actions, with a duty to help those who suffer; it does not follow that any misfortune is the sufferer's guilt. Risk: people can still use the doctrine to excuse indifference to the suffering of others."
        correct: true
        feedback: |
          Yes. The reply limits what the doctrine says; the risk is about what some people do with it. A fair summary keeps both.
      - text: "Reply: the doctrine says the mother must have been wicked in an earlier life, and that is the end of the matter."
        feedback: |
          Teachers of the schools do not draw this conclusion about a particular person. They stress that the doctrine is about one's own deeds and one's own duty.
      - text: "Reply: there is no such risk, since no one in history has ever misused the doctrine."
        feedback: |
          This denies the evidence. Critics inside and outside the tradition have pointed to such uses, and a fair account says so.
    explanation: |
      Label: **debate**. Whether the doctrine can be made safe in this way is a point on which thoughtful people differ, and is tied to the problem of evil studied earlier in the course.

  - type: numeric
    id: p2-ledger
    title: "A toy tally"
    prompt: |
      A **toy** model, not a doctrine: score each good action $+1$ and each bad action $-1$, and let the net score pass from one life to the next. A being acts across three lives: in the first, 5 good and 2 bad; in the second, 1 good and 4 bad; in the third, 6 good and 1 bad. What net score does it carry into a fourth life?
    answer: 5
    wrong:
      - { value: 12, feedback: "12 counts only the good actions (5+1+6). The toy lets bad actions subtract, so they must be counted too." }
      - { value: 7, feedback: "7 counts the bad actions (2+4+1), not the net score. The net is the good total minus the bad total." }
    hint: Add the good actions of all three lives, add the bad ones, and compare.
    explanation: |
      Life one gives $5-2=3$, life two gives $1-4=-3$, life three gives $6-1=5$. The running total is $3$, then $0$, then $5$. The toy shows how a bad second life can be erased by actions in the third. It also shows what real traditions would resist: a single number. The schools speak of kinds of result, of intention, and of the one who acts, and the toy cannot state any of that.

  - type: mcq
    id: p2-layers
    title: "Which layer is each claim in?"
    prompt: |
      Sage Vasudatta makes four claims. Select every one that sits in **layer one or two** (fact or scholarly debate), as opposed to layer three (commitment).
    multiple: true
    options:
      - text: "The earliest Upanishadic texts that speak of the results of action and of rebirth were composed in the first millennium BCE, in a range of about a century or two either way."
        correct: true
        feedback: |
          Yes. A dating of texts is a claim about history, stated as a range.
      - text: "Scholars disagree about where the idea of rebirth came from, some pointing to non-Vedic or eastern traditions and others to developments within the Vedic world."
        correct: true
        feedback: |
          Yes. A statement about where scholars disagree is itself a claim of layer two.
      - text: "The blind child's condition was caused by the child's own action in a previous life."
        feedback: |
          This is a layer-three claim: it asserts a hidden cause that no manuscript or measurement of the child can reach.
      - text: "Rebirth is proved, because Stevenson's cases have no explanation in terms of ordinary memory."
        feedback: |
          Stevenson reported many cases and offered no verdict, and critics gave ordinary explanations (leading questions, earlier contact between families, unconscious memory). A claim of proof moves a debated claim up a layer.
    explanation: |
      The first two are **fact** and **debate**; the last two are **commitment**, one of them dressed as fact. The method is to ask, of each sentence, what evidence would count for or against it.

  # ---------------- Problem 3 ----------------
  - type: text
    id: p3-setup
    title: "Problem 3 · A list and a lake"
    body: |
      **Problem 3.** Two invented scenes. In the first, a student, Ila, writes out the Samkhya principles from memory as a table with these groups: the witness (*purusha*) and unmanifest nature (*prakriti*); then the intellect (*buddhi*), the sense of "I" (*ahamkara*) and the mind (*manas*); then five powers of knowing (the senses), five powers of acting, five subtle elements and five gross elements.

      In the second, a traveller on a dry plain says to his companion: "There is a pond behind the grove, because frogs are croaking there. Wherever frogs croak in great numbers there is water, as in the rice field in our village. The grove is full of croaking frogs. So there is a pond behind the grove."

  - type: numeric
    id: p3-count
    title: "Ila's count"
    prompt: |
      Ila's table has these entries: 1 witness, 1 unmanifest nature, 1 intellect, 1 sense of "I", 1 mind, 5 knowing powers, 5 acting powers, 5 subtle elements and 5 gross elements. Counting every entry once, how many principles are listed?
    answer: 25
    wrong:
      - { value: 23, feedback: "23 is the number of manifest products of nature. Ila's table also has the witness and unmanifest nature, so they must be counted." }
      - { value: 24, feedback: "24 leaves one entry out. Add the singles (1+1+1+1+1 = 5) to the four groups of five (4 x 5 = 20) together." }
    hint: Add the single entries to the four groups of five.
    explanation: |
      Five single entries, plus $4\times5=20$ in the groups of five, gives $5+20=25$. Her table matches the standard count: purusha, unmanifest prakriti and $23$ manifest principles ($1+1+1+5+5+5+5$).

  - type: numeric
    id: p3-nature
    title: "How many belong to nature's evolution?"
    prompt: |
      Samkhya holds that *prakriti* is the source and the witness is not a product or a source of anything. From Ila's 25, how many principles are **evolutes of nature**, that is, come from unmanifest prakriti by evolution, leaving out both the witness and unmanifest prakriti itself?
    answer: 23
    wrong:
      - { value: 24, feedback: "24 counts the unmanifest nature as well. It is the source, not one of its own evolutes. (The 24 'products of nature' in some counts include that source; here it is excluded.)" }
      - { value: 20, feedback: "20 is the four groups of five only. The intellect, the sense of 'I' and the mind are evolutes too." }
    hint: Take away the witness and the unmanifest source from 25.
    explanation: |
      $25-1-1=23$: three inner instruments (intellect, "I", mind), five knowing powers, five acting powers, five subtle elements and five gross elements. This is what the school sets against the witness: everything in the 23 acts, changes and is seen, while the witness only sees.

  - type: order
    id: p3-five
    title: "The traveller's five members"
    prompt: |
      Nyaya states an inference for someone else in five members. Put the traveller's argument into the standard order.
    steps:
      - "There is a pond behind the grove. (thesis)"
      - "Because frogs are croaking there. (reason)"
      - "Wherever frogs croak in great numbers there is water, as in the rice field in our village. (example)"
      - "The grove is full of croaking frogs. (application)"
      - "Therefore there is a pond behind the grove. (conclusion)"
    hint: Claim first, then the reason, then the general link with an example, then apply it to this case, then conclude.
    explanation: |
      The thesis names what is claimed, the reason the mark, the example a known case where mark and conclusion go together, the application says the mark is present here, and the conclusion states the thesis again as established. Writing the example is what makes the general link something a critic can test.

  - type: mcq
    id: p3-unestab
    title: "Mist for smoke, again"
    prompt: |
      A third traveller says: "There is a camp behind the ridge, because smoke rises from it. Wherever smoke rises there is a fire, as in a kitchen. This ridge has smoke. So there is a camp." The next morning it turns out that the pale column over the ridge was mist off a stream, not smoke. Which fault in the Nyaya list is this?
    options:
      - text: "Unestablished: the reason (smoke) is not really present in the case, since what was seen was mist."
        correct: true
        feedback: |
          Yes. The general link may be sound (smoke goes with fire), but the application fails, because the mark the argument relies on is not there.
      - text: "Deviation: the reason is present also where the conclusion is false."
        feedback: |
          Deviation would mean smoke is found where there is no fire, which would break the general link. Here the link is not at fault: the problem is that no smoke was present.
      - text: "Contradiction: the reason proves the opposite of the thesis."
        feedback: |
          Mist does not prove that there is no camp. It is simply not the mark the argument says it is.
      - text: "No fault: any reason that gives the right answer counts as good."
        feedback: |
          A reason must be present in the case, and a lucky conclusion does not repair a missing mark. If the camp does exist, the argument reached the right conclusion for the wrong reason.
    explanation: |
      The invented ridge restates the pattern in the Nyaya list as a sorting exercise: first check the general link, then check whether the mark is present in this case.

  - type: mcq
    id: p3-deviation
    title: "Birds in the grove"
    prompt: |
      Another says: "There is a pond behind the grove, because birds are singing there. Wherever birds sing there is water." The grove has birds, but also many dry groves have singing birds. Which fault in the Nyaya list is this?
    options:
      - text: "Deviation: the reason (birds singing) is also found where the conclusion (a pond) is absent, so it does not establish the conclusion."
        correct: true
        feedback: |
          Yes. A reason that appears with and without the conclusion fails as a mark. The frog argument is stronger because frogs in great numbers are rarely found far from water.
      - text: "Unestablished: there are no birds in the grove."
        feedback: |
          The birds are there. The fault lies in the general link ("wherever birds sing there is water"), which fails in dry groves.
      - text: "Rebutted: the conclusion is contradicted by another source of knowledge, perception."
        feedback: |
          Nothing has been seen that shows there is no pond. The argument is weak because its mark is too common, not because the conclusion has been refuted.
    explanation: |
      Layers: what Nyaya counts as a good reason is a **debate** inside Indian logic; that the first traveller's argument is stronger is a judgement about the strength of a link, tested by looking for cases where the mark and the conclusion come apart.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      The setting: three invented cases (a dialogue, a village and a list), worked with the tools of the level. Every claim is made *according to* someone, and sits in one of three layers.

      - **One saying, three metaphysics.** According to Advaita the self and Brahman are one; according to Vishishtadvaita souls and the world are the real body of Brahman; according to Madhva, who reads *atat tvam asi*, souls and matter are real, permanently different and dependent on God. A text cannot say how it is to be read, so the choice rests on a principle of reading and on commitment.
      - **Five differences.** Dvaita counts $3+2=5$ kinds of difference (God and soul, God and matter, soul and matter, one soul and another, one thing and another). In a toy world with $1$ God, $3$ souls and $2$ things there are
      $$3+2+6+3+1=15=\binom{6}{2}$$
      pairs of different beings.
      - **Three objections to karma and rebirth.** No memory (the result, not the memory, carries over); a first birth (Shankara: samsara is beginningless, like seed and sprout); blaming victims (a claim about one's own deeds and duty, with a real risk of misuse). A toy tally that scores good and bad actions and carries the sum is a model, not a doctrine.
      - **Samkhya.** Two realities, the witness and nature, with
      $$25=1+1+23$$
      principles: purusha, unmanifest prakriti and $23$ manifest evolutes ($1+1+1+5+5+5+5$).
      - **Nyaya.** An inference has five members (thesis, reason, example, application, conclusion). A reason fails if its mark is not present (unestablished) or is found where the conclusion is absent (deviation).
      - **Layers.** Dating texts is fact or debate, a doctrine about hidden causes is commitment, and a claim of proof does not move a debated claim up a layer.

      **Next:** part 2 takes a modern dilemma to Krishna's argument in the Gita, with the three ways (action, knowledge, devotion) ranked by Shankara, Ramanuja and Tilak; weighs a "quantum Vedanta" claim using the kalpa count of $1000\times4.32\times10^6$ years, the role of the observer, and meditation evidence; and closes with a weighing of the three layers across Hindu thought.
