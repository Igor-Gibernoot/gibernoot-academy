id: ch17-overview
title: "What Is Hinduism?"
kind: concept
own: |
  The setting: the traditions of South Asia that are today grouped under the word "Hinduism", about 1.2 billion people in 2020 (14.9% of the world, about 95% of them in India, according to Pew). Everything is taught according to someone: the texts and the practitioners (what the traditions say of themselves), historians and scholars of religion (who weigh the name and the history), and each person's own commitment.
  - **The name is borrowed.** *Hindu* comes from the Sanskrit *Sindhu*, the Indus river; Old Persian turned it into *Hidush* (a province in Darius I's inscriptions), and Greek into *Indos*. It was first a place name, not a religion. The word *Hinduism* came into English only in the early {{ nineteenth century }}.
  - **No single founder, creed or authority.** According to historians and to adherents alike, there is {{ no one founder, no one creed and no central authority }} for all of it; many local teachers and lineages (*sampradaya*) exist, none founding the whole. Adherents often call it *sanatana dharma*, "the eternal order".
  - **Two kinds of text.** *Shruti* ("what is heard") is the revealed core: the Vedas and the Upanishads. *Smriti* ("what is remembered") is the rest: the epics *Mahabharata* (about 100,000 verses in its longest form, with the Bhagavad Gita inside it) and *Ramayana* (about 24,000), and the Puranas. No text plays the role of one Bible.
  - **Four main streams.** Devotion centred on Vishnu (Vaishnavism), on Shiva (Shaivism), on the Goddess (Shaktism), and the Smarta tradition, which worships several deities together; one person may honour more than one, so they are {{ overlapping streams, not rival churches }}.
  - **Practice before creed.** According to many scholars, and to many Hindus themselves, belonging runs more through shared practice (*puja* worship, *darshan* "seeing" the deity, festivals, family duties) than through agreed doctrine.
  - **Orthodox does not mean theist.** In Indian philosophy *astika* ("orthodox") schools are those that accept the Veda's authority; {{ Samkhya and Mimamsa are astika although they give no role to a creator God }}.
  - **Is it one religion?** Three readings: a single religion with many forms; a family of religions under one label (Heinrich von Stietencron's view); a nineteenth-century construct (Wilfred Cantwell Smith, 1962). Which fits depends on what one demands of "one religion", and the question stays open.

cards:
  - type: mcq
    id: hook
    title: "Guess: who counts?"
    prompt: |
      Guessing is the point; no background is needed. In one Indian city, five neighbours all say "I am Hindu". The first prays daily at a temple of Shiva. The second keeps a household shrine of Krishna and fasts on his festival days. The third honours the Goddess above all. The fourth studies ancient texts and says that ultimate reality has no form and no name. The fifth mostly follows family customs and festivals and rarely thinks about doctrine. What is the most reasonable first guess about the label they share?
    options:
      - text: "It is not tied to one belief about God; it covers many ways of worship, texts and customs that grew together over a long time."
        correct: true
        feedback: |
          A good first guess. This lesson tests it: is there any single belief, founder or book that all five share? We will find that the label works differently from "Christian" or "Muslim".
      - text: "All five must secretly hold one creed, and the differences are only in style."
        feedback: |
          They give different answers to who is worshipped and in what form, and no shared creed is recited by all. Hiding a creed behind real differences would be a claim needing evidence.
      - text: "At most one of them can be a real Hindu, and the rest have mixed it with something else."
        feedback: |
          Each is recognised as Hindu by wide communities. Choosing one as the "real" form is what a church with a central authority might do; here no body speaks for all.
    explanation: |
      The puzzle of the lesson: a name used by over a billion people, with no single founder, creed or authority behind it. We follow where the name came from, which texts and practices stand behind it, and why scholars disagree on whether it names one religion. Keep the three layers apart: what texts and records establish, what scholars debate, and what each person or tradition holds by faith.

  - type: text
    id: sindhu
    title: "A river becomes a name"
    image:
      src: img/dna-darius.webp
      alt: "Cuneiform inscription carved on the rock face of the tomb of Darius I at Naqsh-e Rustam, in neat horizontal lines."
      caption: "Part of the inscription (called DNa) on the tomb of the Persian king Darius I, who ruled about 522 to 486 BCE (some sources give 521); among the lands it lists as his is Hindush, the Indus country."
      credit: "Ziegler175, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:DNa_inscription_of_Darius_I_at_Naqsh_I_Rustam.jpg"
    body: |
      Where does the word come from? **Sindhu** is the Sanskrit name of the river we call the Indus. Persian speakers changed the initial *s* to *h*, and the Old Persian inscriptions of the king **Darius I** (who ruled about 522 to 486 BCE) call a province in the Indus country *Hidush* or *Hindush*. The Greeks heard the same name without the *h*, as *Indos*, and from it come "India" and "Indian" in English.

      So *Hindu* began as a name for a **place and its people**, given from outside, not as the name of a religion. According to this standard account, the sense of "follower of the local religions" grew later, as outsiders used the word for the people of the land. That is the first surprise: the main word we use was not chosen by the traditions themselves.

  - type: mcq
    id: name-origin
    title: "What did the word first name?"
    prompt: |
      The Old Persian inscriptions of Darius I (about 522 to 486 BCE) mention *Hidush*, a name derived from the Sanskrit *Sindhu*, the Indus river. According to the standard account, what did the name first refer to?
    options:
      - text: "A province and its people on the Indus, named from outside; nothing in it describes a religion."
        correct: true
        feedback: |
          Right. The inscription lists provinces of an empire. The religious sense of the word came much later.
      - text: "A creed that Darius's officials required of the people of the Indus."
        feedback: |
          The inscription lists lands under Darius's rule; it does not prescribe a belief for them. Reading a political list as a religious statement is the slip.
      - text: "A temple tradition that gave its name to the river."
        feedback: |
          The direction runs the other way: the river's name (*Sindhu*) gave the later word. Naming a religion after a river is what happened, not the reverse.
    explanation: |
      Compare the usual pattern: "Christian" comes from Christ, "Buddhist" from the Buddha, "Muslim" from the believer's submission. "Hindu" comes from a river, so it names a geography first. This fact alone does not decide anything about what the traditions are; it only shows the word is borrowed.

  - type: text
    id: ism
    title: "Hinduism: an '-ism' from outside"
    image:
      src: img/rammohan-roy.webp
      alt: "Oil half-portrait of Ram Mohan Roy, a man in a white turban and dark coat, painted in 1833."
      caption: "Ram Mohan Roy (1772-1833), a Bengali reformer, painted by Rembrandt Peale in 1833; he is often credited with an early English use of the word Hinduism, around 1816."
      credit: "Rembrandt Peale, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Portrait_of_Raja_Ram_Mohun_Roy,_1833.jpg"
    body: |
      The abstract noun **Hinduism**, as the name of one religion, is much younger than the word *Hindu*. It came into English in the early nineteenth century, when British writers in India began to sort the peoples of the land into religions on the model of Christianity. Ram Mohan Roy (1772 to 1833), a Bengali reformer who founded the Brahmo Samaj in 1828, is often credited with an early use of the English word, around 1816. Sources differ on who was first, so read the date as approximate.

      Adherents often use another name: ***sanatana dharma***, "the eternal order" or "eternal path". *Dharma* is a rich Sanskrit word: it covers duty, right conduct, and the order that holds the world together. Using this term, adherents hold that the teachings are not the creation of a founder, but a truth that has always been available.

  - type: mcq
    id: ism-q
    title: "Who coined which name?"
    prompt: |
      According to this lesson's account, which statement about the names is most accurate?
    options:
      - text: "*Hindu* was first a Persian-and-Greek-era place name for the Indus country; *Hinduism* as the name of a religion came into English only in the early nineteenth century; adherents often use *sanatana dharma* for themselves."
        correct: true
        feedback: |
          Yes: three names, three origins. Notice that all three claims are about words, not yet about what the traditions teach.
      - text: "*Hinduism* is the oldest name, found in the Vedas, and *Hindu* is a modern shortening."
        feedback: |
          Reversed. Neither word appears in the Vedas as a religion's name; the noun *Hinduism* is the youngest of the three.
      - text: "All three names were chosen together by a council of priests."
        feedback: |
          There was no such council, and by design: no central authority exists to hold one. Two of the names came from outside and one from within.
    explanation: |
      A name's age says nothing against the traditions themselves, which are far older than the word. It tells us only that the idea of "one religion with a name" was shaped partly by outsiders. This will matter in the last cards.

  - type: text
    id: tests
    title: "Four tests of 'a religion' that fail"
    body: |
      Faced with a new religion, we usually look for a **founder**, a **creed** (a short statement of belief), a **scripture** and a **central authority** (a church or council). Judaism has Moses and the Torah, Christianity has Jesus, the Gospels and the creeds, Islam has Muhammad and the Qur'an.

      Hinduism does not fit the pattern. According to scholars and adherents, there is no single founder and no date of origin. No one creed is recited by all. No one book is "the Hindu Bible" (the Vedas are very old and revered, but not the word of a single revealer for all traditions). And no body speaks for all: there are many teachers, lineages (*sampradaya*, a line of teaching passed from teacher to student) and temples, each with its own authority.

  - type: mcq
    id: tests-q
    title: "Which test would work?"
    multiple: true
    prompt: |
      A census-taker wants a single test that picks out exactly the Hindu traditions. According to this lesson, which of the following tests would NOT work as a single test?
    options:
      - text: "Belief in one creator God, since many Hindu traditions centre on a different deity, on a Goddess, or on a formless ultimate reality."
        correct: true
        feedback: |
          Right: the five neighbours disagree about it already.
      - text: "Following one founder, since no single founder stands behind all the traditions."
        correct: true
        feedback: |
          Right: lineages have founders and teachers, but none founded the whole.
      - text: "Reciting a creed, since no one creed is shared by all."
        correct: true
        feedback: |
          Right: practice and texts bind more than a recited statement.
      - text: "Every one of these tests works equally well for Hinduism as for Islam."
        feedback: |
          They work well for religions with a founder, a creed and a central authority. That is exactly what is missing here, and why the census-taker has to ask "do you call yourself Hindu?" rather than apply a test.
    explanation: |
      This is why censuses in India ask for self-description: the 2011 census counted 966.3 million Hindus, 79.8% of India's population. A person is counted because they say so, not because they pass a doctrinal examination.

  - type: numeric
    id: abroad
    title: "Where do Hindus live?"
    prompt: |
      Pew Research Center (2025) estimated about 1.2 billion Hindus in the world in 2020, with about 95% of them in India. Roughly how many millions of Hindus lived outside India?
    answer: 60
    tolerance: 6
    wrong:
      - value: 1140
        feedback: |
          That is the number inside India (95% of 1,200 million is about 1,140 million). The question asks for those outside.
      - value: 600
        feedback: |
          A slip of a power of ten: 5% of 1,200 million is 60 million, not 600 million.
    hint: "Outside India is 100% minus 95%, so 5% of 1,200 million."
    explanation: |
      5% of 1,200 million is 60 million, a rough figure since the inputs are rounded. This is the number of the label's users outside the Indian subcontinent; the tradition travelled with migration over centuries.

  - type: text
    id: texts
    title: "Two kinds of text: heard and remembered"
    body: |
      Indian tradition sorts its texts into two classes. **Shruti** ("what is heard") is the revealed core: the **Vedas**, and the sections attached to them, among them the **Upanishads** (philosophical dialogues). **Smriti** ("what is remembered") is everything composed by human memory and tradition: the two great epics, the **Mahabharata** and the **Ramayana**, the **Puranas** (long collections of myth, genealogy and teaching), and the Yoga Sutras. The **Bhagavad Gita**, a dialogue between Krishna and the warrior Arjuna, sits inside the Mahabharata and so counts as smriti.

      The Mahabharata is the longest epic poem known: in its longest version it has over 100,000 *shlokas* (verse couplets), far more than the Ramayana, which has some 24,000. Counts vary by version, so the figures are rough. Later lessons take the Vedas and the Upanishads, then the Gita.

  - type: mcq
    id: sort-texts
    title: "Heard or remembered?"
    multiple: true
    prompt: |
      In the Indian classification of texts, which of these count as *shruti* ("what is heard", the revealed core)? Select all that apply.
    options:
      - text: "The Vedas"
        correct: true
        feedback: |
          Yes, the Vedas are the heart of shruti.
      - text: "The Upanishads"
        correct: true
        feedback: |
          Yes: they are attached to the Vedas and count as shruti, which is why Vedanta schools appeal to them.
      - text: "The Mahabharata"
        feedback: |
          It is smriti ("remembered"): a great epic composed by tradition, though venerated.
      - text: "The Bhagavad Gita"
        feedback: |
          It sits inside the Mahabharata, so by the usual classification it is smriti. Its enormous prestige does not change its class, and some traditions treat it with near-shruti respect.
    explanation: |
      Heard and remembered is a ranking of authority, not of popularity. Many Hindus know the epics and the Gita far better than the Vedas.

  - type: numeric
    id: epics
    title: "How long are the epics?"
    prompt: |
      Take the Mahabharata in its longest version as 100,000 shlokas and the Ramayana as 24,000. How many times longer is the Mahabharata? Give the ratio to one decimal place.
    answer: 4.2
    tolerance: 0.1
    wrong:
      - value: 0.24
        feedback: |
          That is the Ramayana divided by the Mahabharata (24,000 / 100,000), the ratio the wrong way round.
      - value: 76000
        feedback: |
          That subtracts the lengths; the question asks how many times longer, which needs a division.
    hint: "Divide the longer by the shorter."
    explanation: |
      100,000 / 24,000 is about 4.17, so roughly four times as long, as is often said. Counts differ between manuscript versions, which is why both numbers are rough.

  - type: text
    id: streams
    title: "Four main streams"
    body: |
      Scholars usually group living practice into four main streams, which differ in the deity at the centre of worship.

      - **Vaishnavism**: devotion to **Vishnu** and his forms, including Krishna.
      - **Shaivism**: devotion to **Shiva**.
      - **Shaktism**: devotion to the **Goddess** (*Devi*, *Shakti*, "power").
      - **Smarta tradition**: worship of several deities together, often five (Ganesha, Vishnu, Shiva, the Goddess and Surya, the sun), the worshipper choosing one as a personal "chosen deity". Smarta teaching is also tied to the philosopher Adi Shankara, whom we meet in Level 17's later lessons.

      The streams are not churches. Shares are contested (one 2010 estimate gives about two thirds of Hindus as Vaishnava, about a quarter Shaiva and a few percent Shakta, while other scholars rank Shaivism first), and many people honour deities of more than one stream.

  - type: mcq
    id: streams-q
    title: "Rival camps?"
    prompt: |
      A family keeps a shrine of Vishnu at home, visits a temple of Shiva at a festival, and prays to the Goddess in a time of trouble. According to scholars of the four streams, which description is most fair?
    options:
      - text: "Common and unremarkable. The streams centre devotion on one deity, but they are overlapping traditions, not exclusive memberships, and the Smarta tradition even worships several together."
        correct: true
        feedback: |
          Yes. Some lineages do insist on one deity above all, but a household moving between shrines is ordinary.
      - text: "Impossible, since a Vaishnava must reject Shiva and the Goddess."
        feedback: |
          Some sectarian lineages stress exclusive devotion, and historically there were sharp rivalries. But as a rule about all Hindus it is false: it treats the streams like separate churches.
      - text: "Proof that the family is not really Hindu, since a real religion needs one God."
        feedback: |
          This assumes the Christian or Islamic pattern as the test. It begs the question of what counts as a religion, which is the question of the lesson.
    explanation: |
      Whether this plurality is "polytheism" or "one reality seen through many forms" is itself a debate that adherents answer in different ways, as the next cards show.

  - type: text
    id: practice
    title: "Doing before believing"
    body: |
      If belief cannot hold the label together, what does? According to many scholars, and to many Hindus themselves, it is mostly **practice**. Hinduism is often described as *orthopraxy* ("right practice") rather than *orthodoxy* ("right belief"): belonging runs through family rites, festivals, duties of one's stage of life and community, more than through agreeing to a doctrine. Scholars qualify this: the Upanishads, for example, lean more toward doctrine, and the balance varies.

      Two everyday practices are worth naming. **Puja** is worship: offerings of flowers, light, food and prayer to an image or symbol of a deity, at home or in a temple. **Darshan** ("seeing") is the act of seeing a deity's image and being seen by it; for many devotees the encounter is a form of blessing, not a mere look.

  - type: mcq
    id: practice-q
    title: "A visitor's question"
    prompt: |
      A visitor asks a temple priest, "What do you have to believe to be a Hindu?" According to the view that Hinduism is largely orthopraxy, which answer fits best?
    options:
      - text: "There is no required statement of belief for everyone; what binds people is shared practice, family and community customs, texts and teachers, and each tradition adds its own teachings."
        correct: true
        feedback: |
          This is the orthopraxy view in a sentence. Note it does not say belief is unimportant: the traditions have rich philosophies, which later lessons study.
      - text: "You must accept the Bhagavad Gita as the word of God."
        feedback: |
          Many Hindus honour the Gita deeply, but it is not a required test for all, and as smriti it is not even the top class of texts.
      - text: "Belief and doctrine play no role anywhere in Hinduism."
        feedback: |
          Too strong. Specific schools argue sharply about doctrine (we meet some soon). The claim is only that no single doctrine defines the whole.
    explanation: |
      Orthopraxy is a tendency scholars note, and some qualify it. It is a good first hypothesis: ask what people do together before asking what they all believe.

  - type: text
    id: one-many
    title: "One and many in the oldest text"
    body: |
      Plurality in worship goes with an old question about how the many deities relate to one reality. A line of the Rigveda, the oldest of the Vedas, is often quoted (Rigveda 1.164.46): *ekam sad viprā bahudhā vadanti*. A literal rendering is "the learned speak of what exists, which is one, in many ways". The verse names Indra, Mitra, Varuna and Agni, and in the translation of H. H. Wilson the priests "call one by many names".

      Two readings are on offer. Many popular readers take it as "one God, many names": the many gods are names for one divine reality. A second reading, argued by some Hindu commentators, stresses *speaking in many ways* (*bahudha*): the One is described in many ways, which is a claim about language rather than a claim that every god is the same. Scholars note that the short slogan "truth is one, paths are many" drops the context of the verse.

  - type: mcq
    id: one-many-q
    title: "What does the verse support?"
    prompt: |
      The Rigveda line *ekam sad viprā bahudhā vadanti* says, in essence, that the learned speak of what exists, which is one, in many ways. Which claim can a careful reader draw from the line alone?
    options:
      - text: "That the text itself already contains the idea of one underlying reality described in many ways; whether this means all gods are one, or only that one is described variously, is a matter of interpretation."
        correct: true
        feedback: |
          Yes. The line is evidence of the question, not a settled answer to it. Later schools will give different answers.
      - text: "That every Hindu holds that all religions are the same path."
        feedback: |
          The verse is about the speech of the learned about what exists, in a Vedic context. Turning it into a statement about all religions is a modern reading, one among several.
      - text: "That the Vedas teach polytheism and nothing else."
        feedback: |
          The line itself speaks of the One, so a plain "nothing else" does not fit. Scholars use words such as henotheism (honouring one deity at a time as supreme) or monism for other passages; labels differ.
    explanation: |
      Here is a first look at the problem of the whole level: how the one and the many are related. Advaita, Vishishtadvaita and Dvaita, in later lessons, give three precise answers.

  - type: text
    id: astika
    title: "Orthodox without a God"
    body: |
      Indian philosophy has its own sorting. A school is **astika** ("orthodox") if it accepts the authority of the Veda, and **nastika** ("heterodox") if it rejects it; Buddhism, Jainism and the materialist Charvaka are usually named nastika. The usual list of six astika schools is Nyaya, Vaisheshika, Samkhya, Yoga, Purva Mimamsa and Vedanta.

      Notice what the word does not mean. Astika and nastika are not "believer" and "atheist": they are about Vedic authority, not about God. Samkhya and early Mimamsa accept the Veda yet give no role to a creator God, so they count as orthodox. Some texts define the terms differently, and the list of nastika schools varies by author.

  - type: mcq
    id: astika-q
    title: "Does orthodox mean theist?"
    prompt: |
      In Indian philosophy, a school is called *astika* if it accepts the authority of the Veda. The Samkhya school accepts that authority and gives no role to a creator God. Which conclusion follows?
    options:
      - text: "A school can be orthodox in the Indian sense without believing in a creator God; the test is Vedic authority."
        correct: true
        feedback: |
          Yes. The Indian sorting cuts across the theist/atheist line familiar from this course.
      - text: "Samkhya must be nastika, since it has no creator God."
        feedback: |
          That uses "nastika" as "atheist", a Western gloss. By the usual definition it is the rejection of the Veda that makes a school nastika.
      - text: "Samkhya is secretly theistic, since astika means a believer."
        feedback: |
          That fits the word to the wrong meaning. Samkhya is classed as non-theistic in the usual accounts, and astika does not require a God.
    explanation: |
      This matters for the lessons ahead: the six schools disagree about God, matter, mind and liberation, yet share a respect for the Veda. Samkhya, Yoga and Nyaya come in a later lesson.

  - type: text
    id: name-problem
    title: "The problem of the name"
    body: |
      Now put the pieces together. The name is from outside and young. There is no founder, creed or central authority. Texts differ by class and tradition, and the streams overlap. Is "Hinduism" then one religion? Scholars and adherents give three kinds of answer.

      **One religion with many forms.** Many adherents and scholars hold that a shared set of texts, practices, concepts (*dharma*, *karma*, *moksha*) and a long common history justify one name, as a family shares a likeness without a single trait in all members.

      **A family of religions.** The German scholar Heinrich von Stietencron argued that if Judaism, Christianity and Islam are called religions, then the same standard would make "Hinduism" a number of different religions side by side.

      **A construct of the nineteenth century.** The scholar of religion Wilfred Cantwell Smith argued in *The Meaning and End of Religion* (1962) that "Hinduism", like "Buddhism", was a European idea of the nineteenth century, and that "religion" as a bounded system is itself a modern Western concept.

      A reply to the last two: even if the noun is recent, the traditions it names are not, and the word has since been adopted by adherents themselves.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Match each claim to its layer. Which is a **live scholarly debate**, not an established fact and not a matter of faith?
    options:
      - text: "Whether Hinduism is best called one religion, a family of religions, or a modern construct."
        correct: true
        feedback: |
          Yes. It depends on what one asks of "a religion", and scholars with the same facts disagree.
      - text: "That the word Hindu derives from the Sanskrit name of the Indus, *Sindhu*, by way of Old Persian."
        feedback: |
          This is the standard account of the word's history, treated as established, though some modern writers dispute details such as the exact route. It is not mainly a debate.
      - text: "That the Vedas are eternal knowledge not authored by any human."
        feedback: |
          That is a commitment held by many adherents (a statement of faith within the tradition), which historians as historians neither affirm nor deny.
    explanation: |
      The three layers of the course in one lesson: the word's history is documented, the correct description of the whole is debated, and the eternity of the Veda is a faith commitment. Naming the layer is what keeps the conversation fair to Hindus, to historians and to outsiders.

  - type: text
    id: summary
    body: |
      **Next:** the Vedas and Upanishads, the oldest layer of the texts: how a religion of sacrifice and hymns turned toward the inquiry into the self.
