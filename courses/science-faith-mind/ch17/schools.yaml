id: ch17-schools
title: "Advaita, Vishishtadvaita, Dvaita"
kind: concept
own: |
  The setting: **Vedanta**, the family of Indian schools that read the Upanishads, the *Brahma Sutras* (a very short text of aphorisms attributed to Badarayana) and the *Bhagavad Gita* together. The question is how the self (*atman*, the inner Self) relates to *Brahman* (the ultimate reality) and to the world. Each school is described as its own followers hold it, with historians' dates marked as approximate.
  - **Advaita ("not two"), Shankara (c. 700-750 CE, by the usual scholarly dating).** Only Brahman, pure consciousness without qualities, is ultimately real; the self is that Brahman, and the world seen as many things is *maya*, a superimposition that is neither simply real nor simply nothing. Two levels of truth: the everyday level (*vyavaharika*) and the ultimate level (*paramarthika*). In the rope-and-snake example, the snake seen in dim light disappears when the rope is seen. Its reading of the saying *tat tvam asi*: {{ you are that, the self is Brahman }}.
  - **Vishishtadvaita ("non-dual with qualification"), Ramanuja (c. 1077-1157, tradition 1017-1137).** There is one Brahman, understood as Vishnu with infinite good qualities; {{ individual souls and the material world are real and are the body of Brahman, which is their inner controller }}. Souls depend on God as a body depends on the one who indwells it, so they are distinct from him yet inseparable. The one reality has real parts.
  - **Dvaita ("dual"), Madhva (1238-1317 by the usual dating).** Brahman, identified with Vishnu, is the one independent reality, and everything else depends on him. Difference is real and permanent in {{ five ways: God and soul, God and matter, soul and matter, one soul and another, one material thing and another }}. Madhva reads the saying as *atat tvam asi*, "you are not that".
  - **One text, three metaphysics.** The Upanishads speak at times of unity and at times of a Lord and a distinction, and the *Brahma Sutras* are too terse to settle it alone, so each school reads the whole through a commentary. {{ The dispute is about how to harmonize the texts and what reality is, a metaphysical commitment and not a fact that a text or experiment settles }}.

cards:
  - type: mcq
    id: hook
    title: "Guess: one sentence, three meanings"
    prompt: |
      Guessing is the point; no background is needed. A teacher in the Upanishads (philosophical texts from India, c. 700 BCE) tells a student: "That you are." Imagine three students who understand it differently. Which is the most natural first guess for what "that" and "you" could be?
    options:
      - text: "You and the ultimate reality could be one and the same; or you could be a part of it; or you could be a quite separate being that depends on it. All three are possible readings."
        correct: true
        feedback: |
          Right, and these three readings are exactly the three schools of this lesson. Nothing in the sentence alone forces one of them, which is why commentators wrote for centuries.
      - text: "Only one reading is possible; the other two would be mistakes of grammar."
        feedback: |
          The grammar leaves room, as the lesson on Brahman and Atman showed. The disagreement runs deeper than grammar: it is about what a self is and what the ultimate is.
      - text: "The sentence means nothing until one has done the rituals."
        feedback: |
          Some traditions do tie knowledge to practice, but the question we ask is what the words can mean, and several meanings make sense.
    explanation: |
      Identity, part and whole, and dependence between two beings are the three live options. We meet the thinkers who defended each of them.

  - type: text
    id: texts
    title: "Three starting texts"
    body: |
      In the lesson Vedas and Upanishads we met *Vedanta*, "the end of the Veda". As a school of thought it starts from three texts, which later tradition calls the *prasthanatrayi*, the "three starting points". The first is the **Upanishads**, the revealed teaching (*shruti*). The second is the **Bhagavad Gita**, a remembered text (*smriti*) in which the god Krishna teaches the warrior Arjuna. The third is the ***Brahma Sutras***, attributed to a sage named Badarayana, which aims to put the teaching of the Upanishads in order and answer rival schools.

      The *Brahma Sutras* have about 555 aphorisms in four chapters (sources differ on the count; Ramanuja counted 544), and scholars date their surviving form to about 400 to 450 CE, with earlier layers. Each aphorism is only a few words long.

  - type: mcq
    id: texts-q
    title: "Why commentaries became philosophy"
    prompt: |
      The *Brahma Sutras* are so short that a line is often only a phrase, made as a memory aid for students who already had a teacher. What follows from that for the history of Vedanta?
    options:
      - text: "A reader needs a commentary to make them intelligible, so each commentator's philosophy shapes what the text 'says'."
        correct: true
        feedback: |
          Right. The same aphorism can be filled in with different arguments, which is why great thinkers wrote commentaries as the way to state their own system.
      - text: "All commentaries must agree, since the sutras leave no room."
        feedback: |
          The opposite happened. The sutras are so compressed that, in one scholar's description, the same sutra is often read in opposite ways.
      - text: "The sutras are clear, and commentaries only add ornament."
        feedback: |
          A sutra without explanation is almost unreadable, so the commentary supplies the argument itself.
    explanation: |
      This is a feature of the field: to do philosophy in Vedanta is to write a commentary. The three schools below are, above all, three commentaries on the same three texts.

  - type: text
    id: shankara
    title: "Shankara: only Brahman is ultimately real"
    image:
      src: img/shankara.webp
      alt: "Nineteenth-century painting of Shankara with a group of disciples."
      caption: "A portrait of Shankara by the painter Raja Ravi Varma (1848-1906); it is an imagined likeness made long after his life, since no portrait from his time exists."
      credit: "Raja Ravi Varma, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Raja_Ravi_Varma_-_Sankaracharya.jpg"
    body: |
      **Shankara** (*Adi Shankara*) is the best known Vedanta thinker. The most common scholarly dating is about 700 to 750 CE; older proposals were 788 to 820 CE, and monastic traditions give far earlier dates. His main works are the commentary on the *Brahma Sutras* and commentaries on the Gita and several Upanishads (scholars differ on which of the Upanishad commentaries are really his). He cites **Gaudapada** (6th to 7th century CE, author of a verse commentary on the *Mandukya Upanishad*) with great respect, calling him his "highest teacher" (*paramaguru*), a teacher of his own teacher according to the tradition.

      His school is **Advaita**, "not two". It holds that only Brahman, pure consciousness without qualities (*nirguna*, "without attributes"), is ultimately real, and that the self is that Brahman. This is the traditional reading of *tat tvam asi*: you are that. But we do not meet Brahman as one; we meet a world of many things, and Shankara must say what that world is.

  - type: text
    id: maya
    title: "Maya and two levels of truth"
    body: |
      Advaita answers with *maya* (often translated "illusion", though the word is closer to "appearance made by ignorance"). The world of many things is a **superimposition** (*adhyasa*) on Brahman, as one thing's features are laid over another. It is not nothing, because we do deal with it; it is not ultimately real either, because knowledge of Brahman removes it. Advaita says it is neither simply real nor simply unreal.

      To hold both claims at once the school uses **two levels of truth**: the everyday level (*vyavaharika*), where there are people, tables and rituals, and the ultimate level (*paramarthika*), where only Brahman is. The standard illustration is a rope seen in dim light and mistaken for a snake.

  - type: mcq
    id: rope
    title: "Rope and snake"
    prompt: |
      At dusk you see a snake on the path and jump back. A lamp is brought and you see only a coiled rope. In the Advaita illustration, the snake stands for the world of many things and the rope for Brahman. Which statement fits the illustration?
    options:
      - text: "The snake was seen only because of the rope; once the rope is seen as it is, the snake is gone, though the fear and the jump were real at the time."
        correct: true
        feedback: |
          Right. The error needs a real ground (the rope), has real effects at its own level, and ends with correct knowledge. Advaita says the world relates to Brahman in this way.
      - text: "The snake and the rope are two real things, and the rope is hidden by the snake."
        feedback: |
          If the snake were a second real thing there would be two realities, which is the view Advaita denies. The point of the example is that the snake adds nothing real to the rope.
      - text: "Nothing was seen at all, so the fear was pure invention with no cause."
        feedback: |
          Advaita does not say that. The rope was there and was seen in a wrong way, so the experience had a ground; the world is not a mere nothing.
    explanation: |
      Notice the cost of the picture: it explains why one reality can look like many, but critics ask whose mistake it is (we return to this). Remember the layer too: this is a metaphysical position, argued from the texts and from experience, not a result of observation.

  - type: mcq
    id: twolevel
    title: "A fair summary of 'the world is maya'"
    prompt: |
      A student says: "In Advaita, the world is maya, so Advaitins think that nothing here matters and that the table in front of them does not exist." What is a fairer account?
    options:
      - text: "At the everyday level the table is treated as real and one acts as usual; at the ultimate level only Brahman is held to be real, and the many things are not independent of it."
        correct: true
        feedback: |
          Right. Two levels of truth let the school keep ordinary life, ethics and ritual and still claim that the many is not ultimate.
      - text: "Advaitins think all things are hallucinations, like a dream without any cause."
        feedback: |
          Dream-like language does appear in the tradition, but the school's own claim is that the world rests on Brahman and is neither simply real nor simply nothing.
      - text: "Advaitins think the world is as real as Brahman, only less important."
        feedback: |
          That would be two equal realities, which is exactly what the name Advaita rules out.
    explanation: |
      Critics reply that two levels are a device that hides the problem; defenders that every theory with appearances needs one. We state those objections shortly.

  - type: text
    id: ramanuja
    title: "Ramanuja: Brahman with qualities, world as body"
    image:
      src: img/ramanuja.webp
      alt: "Sculpture of Ramanuja standing, with hands joined."
      caption: "A Vijayanagar-period (about 14th to 16th century) sculpture of Ramanuja in a museum; like all such images it is a devotional likeness made long after his life."
      credit: "Wuselig, CC0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:ACM-Ramanuja-03724.jpg"
    body: |
      **Ramanuja** (c. 1077 to 1157 CE by the dating most scholars use; the tradition says 1017 to 1137) was born near present-day Chennai in South India and became a leading figure of the Sri Vaishnava community, devoted to the god Vishnu. His main work is the *Sri Bhashya*, a commentary on the *Brahma Sutras*; he also wrote on the Gita.

      His school is **Vishishtadvaita**, "non-dual with qualification" (*vishishta* means "qualified"). He agrees with Shankara that Brahman is one, but holds that Brahman is not a bare, qualityless consciousness. Brahman is Vishnu, also called Narayana, a person with infinite good qualities. When texts call Brahman "without attributes", Ramanuja reads them as denying only bad or limiting qualities. And the world and the souls are neither a mistake nor a second god: they are real, and they are the **body** of Brahman, while Brahman is the inner controller, the one who indwells that body (the *sharira-shariri* relation, "body and embodied").

  - type: mcq
    id: body
    title: "Body and indweller"
    prompt: |
      In Ramanuja's picture, your body depends on you for its life and movement, though it is not you. Souls and the world stand to Brahman in a similar way. What does this analogy give Ramanuja that Shankara's rope does not?
    options:
      - text: "A way to say that souls and the world are real, distinct from God and inseparable from him, so that there is one reality with real parts."
        correct: true
        feedback: |
          Right. The analogy keeps the "one" of the name (the body is not a second being beside you) and the "qualified" (the body has its own real character), without calling the world a mistake.
      - text: "A proof that souls are identical to God."
        feedback: |
          The analogy says the opposite: a body is not identical to the one who indwells it. Souls share God's dependence-relation but are not God.
      - text: "A way to deny that the world is real."
        feedback: |
          Ramanuja holds that the world is real, as real as the body of a person is real. His objection to Shankara is partly that calling it unreal misreads the texts.
    explanation: |
      Ramanuja's reading of *tat tvam asi*, as the lesson on Brahman noted: the word *tvam*, "you", ultimately points to Brahman as the one who dwells in you, since every individual is the body of that indweller.

  - type: text
    id: madhva
    title: "Madhva: difference is real and permanent"
    image:
      src: img/madhva.webp
      alt: "Statue of Madhva in a temple, standing with one hand raised."
      caption: "An image of Madhva at Pajaka, near Udupi, where he is said to have been born; it was installed centuries after his death, as the Madhva tradition tells."
      credit: "AR767, CC0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Shri_Madhvacharya_Vigraha,_Pajaka,_Udupi.jpg"
    body: |
      **Madhva** (1238 to 1317 CE by the dating given in the Internet Encyclopedia of Philosophy; some sources give 1199 to 1278) was born near Udupi on the coast of Karnataka and set up the Krishna temple there, still a centre of his tradition. He wrote a commentary on the *Brahma Sutras* and many other works, and he called his teaching *Tattvavada*, "the doctrine of reality". It is known as **Dvaita**, "dual".

      For Madhva, Vishnu is the one independent reality, and souls and matter are real and dependent on him. Difference is not an appearance: it is built into reality in **five ways** (*pancha-bheda*): between God and a soul, between God and matter, between a soul and matter, between one soul and another, and between one material thing and another. These differences are permanent. Madhva also reads the saying differently: taking the letter *a* from the word before it, he reads *atat tvam asi*, "you are not that".

  - type: mcq
    id: five
    title: "Which differences count?"
    prompt: |
      Madhva lists five kinds of real difference. Select all that appear in his list.
    multiple: true
    options:
      - text: "Between God and an individual soul."
        correct: true
        feedback: |
          Yes, the central one: the soul is never identical to God.
      - text: "Between one soul and another soul."
        correct: true
        feedback: |
          Yes. Souls are not one self divided; each is distinct for ever.
      - text: "Between one material thing and another."
        correct: true
        feedback: |
          Yes. Even material things are really distinct, not a single stuff with passing names.
      - text: "Between Vishnu and Brahman, as two different gods."
        feedback: |
          For Madhva, Vishnu is Brahman. The five differences are between God, souls and matter, and within souls and within matter.
      - text: "Between waking and dreaming."
        feedback: |
          The four states are a topic of the Mandukya Upanishad, not of the five differences, which are between kinds of being.
    explanation: |
      The five come from taking the three kinds of being (God, souls, matter) and all the ways to pair them: God and soul, God and matter, soul and matter, soul and soul, matter and matter. The count is 5, since the three pairs of different kinds plus the two pairs inside a kind give five.

  - type: mcq
    id: who
    title: "Who would say this?"
    prompt: |
      A student says: "A soul is a real being, not God and not an illusion, yet it is not separate from God either, in the way that my hand is not separate from me but is not me." Which school's view is this closest to?
    options:
      - text: "Vishishtadvaita (Ramanuja): the soul is real, distinct and inseparable, as a body is from its indweller."
        correct: true
        feedback: |
          Right. The hand-and-me picture is the same as the body-and-indweller picture.
      - text: "Advaita (Shankara): the soul is Brahman and the many souls are an appearance."
        feedback: |
          Advaita would deny that the soul is a separate real being at the ultimate level; it identifies the self with Brahman.
      - text: "Dvaita (Madhva): God and the soul are permanently and fully different, with no inseparability."
        feedback: |
          Dvaita does hold that souls depend on God, but it stresses a permanent difference and does not describe the soul as a part or mode of God.
    explanation: |
      The three answers differ on one dial: how much of the soul's being is its own, from none (Advaita) through shared (Vishishtadvaita) to its own and dependent (Dvaita).

  - type: text
    id: table
    title: "The three at a glance"
    body: |
      Each school, in its own terms and as its followers hold it:

      | School | Self and Brahman | World |
      |---|---|---|
      | Advaita | identical | appearance (*maya*) |
      | Vishishtadvaita | distinct, inseparable | real, God's body |
      | Dvaita | permanently different | real, dependent |

      On God: Advaita holds Brahman without qualities as ultimate, with a God of qualities at the everyday level; Vishishtadvaita and Dvaita hold Vishnu, a person with good qualities, as ultimate.

      Observe that all three accept the Upanishads, the Gita and the *Brahma Sutras*, and all three speak of liberation from rebirth. The next lesson takes up that part.

  - type: mcq
    id: apply
    title: "Applying the table"
    prompt: |
      Take the sentence: "God is a person who loves, listens and rules, with infinite good qualities." Which schools would accept it as a description of the ultimate reality?
    options:
      - text: "Ramanuja and Madhva accept it of Vishnu as the highest reality; Shankara accepts it only at the everyday level, where God has qualities, and holds that the ultimate is without qualities."
        correct: true
        feedback: |
          Right. Both devotional schools read Brahman as a person, while Advaita distinguishes the God with qualities (*saguna*) from Brahman without them (*nirguna*) and gives the second the last word.
      - text: "Only Madhva accepts it."
        feedback: |
          Ramanuja is just as clear that Brahman is a person with good qualities, and his objection to Shankara includes this point.
      - text: "None of them, since Hindu thought has no personal God."
        feedback: |
          Hindu traditions include strongly personal views of God, and two of the three schools here are of that kind. The idea that Hindu thought is impersonal comes from one school.
    explanation: |
      This is a place where the disagreement is visible in practice: a devotee who prays to a loving Vishnu has a different metaphysics from one who seeks the knowledge of the self as Brahman, even when both quote the same Upanishad.

  - type: text
    id: obj-advaita
    title: "An objection to Advaita"
    body: |
      Ramanuja and later critics press a question: **whose ignorance is it?** If maya or ignorance (*avidya*) is what makes the one Brahman look like many, ignorance must belong to someone. It cannot be Brahman's, since Brahman is knowledge itself. And it cannot be an individual's, since individuals are what ignorance produces; to say the individual is ignorant before ignorance exists seems circular. A second objection: if only Brahman is real, the teaching, the student and the scripture are themselves part of the appearance, so how can they lead out of it?

      Advaitins answer in various ways, and they differ among themselves. One reply is that the question belongs to the everyday level, where individuals exist, and asks for a cause of ignorance as if it were an ordinary thing; ignorance is "indescribable" (*anirvacaniya*), neither real nor unreal, and has no beginning that can be dated. As for the second objection, the rope-and-snake example is meant to show that a message can come from within an error and still correct it: the word "rope" spoken at dusk removes the snake.

  - type: mcq
    id: obj-q
    title: "Reading the objection"
    prompt: |
      Which question best states the objection that Ramanuja presses against the Advaita account of maya?
    options:
      - text: "Where does ignorance sit: not in Brahman, which is knowledge, and not in a self that ignorance itself produces?"
        correct: true
        feedback: |
          Right. It is a question about the location of ignorance, and the circle it points to.
      - text: "Why do Advaitins refuse to read the Upanishads?"
        feedback: |
          They read them closely, and the sayings are central to their view. The objection is about logic, not neglect.
      - text: "How can a world that is real be the body of God?"
        feedback: |
          That is a question asked of Ramanuja's own view, not an objection he presses against Advaita.
    explanation: |
      A reminder of steelmanning: Advaitins do not accept the question as stated, and they have long replies. The dispute shows what each side regards as an acceptable explanation.

  - type: text
    id: obj-dvaita
    title: "Objections to the other two"
    body: |
      Dvaita has its own pressure points. If the soul is permanently different from God, what do the many Upanishad passages that speak of unity mean, and what is **liberation**? Madhva's replies are that the unity texts are read as showing dependence or likeness and not identity (and he rereads *tat tvam asi* as *atat tvam asi*), while liberation is not becoming God but reaching him, with a closeness to him in which the soul stays distinct. Critics note that this rereading strains the sentence, and defenders that the Sanskrit allows it.

      Vishishtadvaita faces a different question: if the world and souls are God's body, are God's qualities affected by the suffering of souls? Ramanuja and his followers reply that God is the inner controller and stays good, but critics ask whether a God whose body suffers can be untouched. Both sides press the question.

  - type: mcq
    id: reply
    title: "Which reply answers which?"
    prompt: |
      An Advaita critic says to a Dvaita follower: "If you and God are permanently different, then the texts that say 'that you are' make no sense." Which reply is in the spirit of Madhva?
    options:
      - text: "Those texts are read in another way, for instance as pointing to dependence or likeness, and the sentence itself can be read as 'you are not that'."
        correct: true
        feedback: |
          Right. Madhva uses this strategy: read the unity sayings in the light of the texts that stress a Lord and a difference.
      - text: "You are right, and the soul and God are really identical."
        feedback: |
          That is the Advaita view. Madhva holds difference to be permanent.
      - text: "The texts are mistakes added later and can be ignored."
        feedback: |
          All three schools treat the texts as authoritative revelation; none dismisses a text as an error. That shared respect is part of why the dispute is about reading, not about whether to read.
    explanation: |
      Every school must explain the passages that seem to favour its rivals. This is what the three commentaries on the same text consist of.

  - type: text
    id: why
    title: "Why one text allows three readings"
    body: |
      The Upanishads are not one author's treatise. They are many teachings gathered over centuries (see the lesson Vedas and Upanishads), and some speak of unity (*tat tvam asi*), others of a Lord who rules inside the world, others of difference between the knower and the known. A commentator who believes the whole is true and consistent must decide which passages are the main teaching and which are to be read in a secondary way. Advaita puts the unity sayings first. The two devotional schools put the passages about a Lord first and read the others in their light.

      So the disagreement is not about whether the texts matter. It is about **how to harmonize them** and about **what reality is**: whether the many are ultimate, dependent or derived. Historians can describe each school and its arguments and its history. Which one is true is a question of metaphysics, and also of what one takes experience and revelation to show.

  - type: mcq
    id: layers
    title: "What kind of disagreement?"
    prompt: |
      Three readers of the same Upanishad passage disagree about whether the self is Brahman. Which description is the most accurate?
    options:
      - text: "They share the text, disagree about how its parts fit together, and are led by different metaphysical commitments; no text or lab result alone decides between them."
        correct: true
        feedback: |
          Right. It is a layer-3 disagreement (metaphysical commitment) interwoven with layer-2 debates about the text, and the schools themselves know that.
      - text: "One of them has misread the Sanskrit, and a better dictionary would end the dispute."
        feedback: |
          Philologists contribute (as with *tat tvam asi*), but the schools differ on more than word meanings; the Sanskrit permits several readings.
      - text: "They disagree because only one of them has had a religious experience."
        feedback: |
          Each school's followers appeal to experience, and each interprets it within its system. That is part of why experience alone does not decide.
    explanation: |
      A useful skill is to ask of any disagreement: is it about a fact, about a reading, or about a commitment? Here it is mostly the last two.

  - type: mcq
    id: trap
    title: "Is the middle school a compromise?"
    prompt: |
      Someone says: "Vishishtadvaita is just halfway between Advaita and Dvaita, so it is a compromise that splits the difference." What is a fair reply?
    options:
      - text: "It has its own claim: Brahman is a person with real qualities, and souls and world are the real body of Brahman. Historically it arose from a devotional tradition and read the texts its own way, so it is not merely an average."
        correct: true
        feedback: |
          Right. Its name suggests a middle place, but its arguments (for instance on the qualities of Brahman and the body relation) are its own.
      - text: "It is a compromise, and so it is false."
        feedback: |
          Being in the middle does not make a view false or true. The question is whether its arguments work.
      - text: "It is identical to Advaita with a new name."
        feedback: |
          Ramanuja explicitly criticises Shankara on the qualities of Brahman and on the reality of the world, so they differ on central points.
    explanation: |
      The same warning holds for dials in general: the middle position on a line is a position with its own reasons, not a vague average.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the schools disagree about what the self is, but they share a framework: actions have results, lives repeat, and there is a way out. The next lesson takes up *karma*, *samsara* and *moksha*, and the philosophical objections to them.
