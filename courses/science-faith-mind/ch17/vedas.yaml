id: ch17-vedas
title: "Vedas and Upanishads"
kind: concept
own: |
  The setting: the oldest texts of the Hindu traditions, called the Vedas, composed in Sanskrit and handed down by memory, and the later texts that grew out of them. Everything is taught according to someone: the traditions (what the texts and their keepers say of themselves), historians (who date and compare texts) and each person's own commitment.
  - **Four Vedas, four layers.** The Vedas are the *Rigveda* (hymns), *Samaveda* (songs), *Yajurveda* (ritual formulas) and *Atharvaveda* (hymns, spells and healing). Each has, in the usual idealized pattern, layers: {{ Samhita (hymns and formulas), Brahmana (prose on the ritual), Aranyaka ("forest" texts), Upanishad (inquiry into the self and reality) }}. The Rigveda has 1,028 hymns in ten books and about 10,600 verses, composed according to most scholars roughly between 1500 and 1000 BCE.
  - **Ritual logic.** In the Brahmanas the *yajna* (sacrifice) is a precise act whose power depends on exact words and actions, and it is tied to a cosmic order called *rta*. According to the Brahmana texts, {{ a verbal mistake could make a mantra powerless }}.
  - **The turn inward.** Early Upanishads (the oldest, the *Brihadaranyaka* and *Chandogya*, c. 700 BCE give or take a century, according to Patrick Olivelle) reread the ritual as a picture of the cosmos and the self. In the Brihadaranyaka, Yajnavalkya answers King Janaka that the Self is the light of a person, and tells his wife Maitreyi that wealth cannot give immortality. In the Chandogya, Shvetaketu returns after twelve years of Vedic study proud and learned, and his father Uddalaka asks about knowledge that his learning has not touched.
  - **Not a clean break.** Some Upanishad passages sharply criticize sacrifice (the *Mundaka* calls sacrifices frail boats), while others treat it as a symbol; the Upanishads do not simply abolish ritual, and Hindu practice continues both.
  - **Shruti and Vedanta.** The Vedas and Upanishads are *shruti*, "what is heard". The Upanishads are called {{ *Vedanta* }}, read as "the end of the Veda" (the last layer in time) or "the goal of the Veda".
  - **Two views of the Veda.** According to the Mimamsa school and many Hindus, the Veda is *apaurusheya*, {{ not of human authorship and eternal }}, and the sages are seers who heard it. According to historians, it was composed by poet-priests over centuries, and written down long after composition (the oldest surviving Rigveda manuscripts are from about 1040 CE).

cards:
  - type: mcq
    id: hook
    title: "Guess: from fire to the self"
    prompt: |
      Guessing is the point; no background is needed. A people keeps a sacred fire and offers it milk, grain and a plant drink while priests chant verses, all to keep the world in good order. Some centuries later, texts from the same families have teachers saying that the real question is "what is the self?". What is the most reasonable first guess about how this happens?
    options:
      - text: "The ritual itself invites the question: asking what the offering is really for and who is really offering leads inward."
        correct: true
        feedback: |
          A good first guess, and a view held by many scholars. We test it: does the later text drop the ritual, or reread it? Keep in mind that adherents may add that the Veda is a single revelation, not a development.
      - text: "A foreign people arrived and replaced the old religion completely."
        feedback: |
          The Upanishads are in the same Sanskrit tradition and keep the old vocabulary and names, so they read as a development. How much outside influence existed is debated, but "complete replacement" is not what the texts show.
      - text: "Nothing changed; the later texts only repeat the hymns."
        feedback: |
          The later texts ask new questions in a new form (dialogues, riddles, arguments), so there is a real shift in what is asked.
    explanation: |
      That is the lesson: from verses to the sacrifice, from the sacrifice to a reading of it, and from that reading to the self. We keep three layers apart: what the texts and manuscripts show, what scholars debate (dates, influences), and what adherents hold by faith about the origin of the Veda.

  - type: text
    id: four-vedas
    title: "Four Vedas"
    image:
      src: img/rigveda-manuscript.webp
      alt: "A page of a paper manuscript of the Rigveda in Devanagari script, ten lines of text with marks above and below the letters."
      caption: "A Rigveda manuscript on paper from India, early 19th century; the small marks (accents) show how the verses are to be chanted, since the Veda lived first as sound."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Rigveda_MS2097.jpg"
    body: |
      The word *Veda* comes from the Sanskrit root *vid*, "to know", so it means knowledge. There are four Vedas. The **Rigveda** is a collection of hymns to the gods. The **Samaveda** is made of stanzas, mostly taken from the Rigveda, arranged as songs to be chanted. The **Yajurveda** holds prose formulas that a priest says while someone performs the actions of the ritual. The **Atharvaveda** has hymns for healing, spells and magico-religious rites, and also some philosophical speculation.

      The Rigveda is the oldest. It has **1,028 hymns** (*sukta*) in **ten books** (*mandala*), with about 10,600 verses; the 1877 edition of Aufrecht counts 10,552. Scholars date its composition to roughly **1500 to 1000 BCE** (some give a narrower 1500 to 1200); these are ranges, not dates. Its hymns were composed, according to historians, by poets from priestly families in the north-west of the subcontinent, and were learned and recited by heart for centuries.

  - type: mcq
    id: four-q
    title: "Which Veda does what?"
    prompt: |
      A student says: "The Samaveda is a fourth set of new hymns, unrelated to the Rigveda." According to the standard description, what is the best correction?
    options:
      - text: "Most of its stanzas come from the Rigveda; what is new is the arrangement as melodies for chanting."
        correct: true
        feedback: |
          Right. The Veda is a collection of sound as much as of words: the same verse can be recited, or sung to a tune.
      - text: "It is the Rigveda's commentary, written in prose."
        feedback: |
          Prose commentary on ritual belongs to a later layer, the Brahmanas. The Samaveda is verses set to songs.
      - text: "It is the oldest Veda, from which the Rigveda was taken."
        feedback: |
          The direction is the reverse: the Rigveda is the oldest, and the Samaveda draws on it.
    explanation: |
      So the four Vedas are not four separate religions but four collections for the parts of one ritual: hymns, songs, formulas, and the fourth with healing and spells. 

  - type: text
    id: layers
    title: "Four layers in each Veda"
    body: |
      Each Veda comes in layers, from the oldest to the youngest. In the usual (idealized) pattern:

      | Layer | What it is |
      |---|---|
      | **Samhita** | the "collection": hymns and sacred formulas |
      | **Brahmana** | prose that explains the ritual and how to do it |
      | **Aranyaka** | "forest" texts: symbolic readings of the ritual, for those studying away from the village |
      | **Upanishad** | inquiry into the self and ultimate reality |

      Rough dates, all with a margin: the Rigveda Samhita c. 1500 to 1000 BCE; the other three Samhitas c. 1200 to 900 BCE; the Brahmanas c. 900 to 700 BCE; the oldest Upanishads, the *Brihadaranyaka* and *Chandogya*, c. 700 BCE give or take a century, according to the scholar Patrick Olivelle, who warns that any date closer than a few centuries is unreliable. Another scholar, Johannes Bronkhorst, argues for later dates. The layers overlap in time, and not every Veda has all four.

  - type: order
    id: layers-order
    title: "Layers in the usual order"
    prompt: |
      Put the four layers of a Veda in the usual order of composition, oldest first: Samhita (hymns and formulas), Brahmana (prose on the ritual), Aranyaka (forest texts), Upanishad (inquiry into the self).
    steps:
      - "Samhita: the hymns and formulas"
      - "Brahmana: prose explaining the ritual"
      - "Aranyaka: forest texts reading the ritual symbolically"
      - "Upanishad: inquiry into the self and reality"
    hint: "First the verses, then the instructions for using them, then the symbolic reading, then the open questions."
    explanation: |
      The order follows a movement of attention: the words, then the act, then what the act means, then what is behind the meaning. Historians add that the later layers overlap in time, so this is a pattern rather than a strict timeline.

  - type: text
    id: hymns
    title: "Hymns to fire and storm"
    body: |
      What do the first hymns look like? The Rigveda opens with hymn 1.1, addressed to **Agni**, the god who is the sacrificial fire. In essence it praises him as the chosen priest, a god, and the minister of the sacrifice. **Indra**, the next god in the arrangement, is a heroic god who in the myth slays the serpent Vritra. The ninth book, 114 hymns, is entirely about **Soma**, a sacred potion that is cleansed in the ritual (the *Soma Pavamana* hymns).

      Behind the hymns stands an idea of order, ***rta***: the cosmic order or "active realization of truth" that keeps day following night and the seasons turning. According to many scholars, *rta* is the ancestor of the later idea of ***dharma***, the Sanskrit word for duty, right conduct and the order that holds the world together; so the ritual can be seen as a duty to that order.

  - type: mcq
    id: agni-q
    title: "A fire that is also a priest"
    prompt: |
      In essence, the opening hymn of the Rigveda praises Agni, the sacrificial fire, as the chosen priest, a god, and the minister of the sacrifice. What does this tell us about how the early ritual saw the fire?
    options:
      - text: "As more than a flame: a god who is also the priest of the sacrifice, a partner in the rite."
        correct: true
        feedback: |
          Right. The fire is a god and a priest. The ritual is a relationship, not only a technique.
      - text: "As a mere source of heat for cooking, with the hymn only decorating it."
        feedback: |
          The hymn addresses the fire as a god with a role. To treat it as decoration reads our modern habit into the text.
      - text: "As a rival of the gods that the priests tried to put out."
        feedback: |
          The opposite: Agni is a god praised at the start of the collection.
    explanation: |
      A hymn to fire opens the collection because the fire is the centre of the ritual. This is the world the Brahmanas will systematize, and the world that the Upanishads will reread.

  - type: text
    id: nasadiya
    title: "A hymn that ends with a question"
    body: |
      Not all the hymns praise gods. Hymn **10.129**, the *Nasadiya Sukta* (from its first words, "there was not non-being"), has seven verses and is about the beginning. In paraphrase: at first there was neither being nor non-being, no air and no sky; there was no death and no immortality, and no mark of day or night. That One breathed without wind, by its own nature. Darkness was hidden in darkness, and it came to be through the power of heat. Desire arose as the first seed, and sages, searching in their hearts, found the link between what is and what is not. Then the hymn turns: who really knows, and who can say where it came from, since the gods came after? The last verse says that the one who oversees it from the highest heaven knows, "or perhaps he does not."

      It sits in the tenth book, which scholars count among the latest, and some see in it thought that looks forward to the Upanishads.

  - type: mcq
    id: nasadiya-q
    title: "Two ways to read it"
    multiple: true
    prompt: |
      The hymn ends by asking who really knows how the world began, and by saying that even the highest overseer may or may not know. Which of these are fair readings of what the hymn does? Select all that apply.
    options:
      - text: "A skeptical reading: an early record of honest doubt about the origin of the world (a reading the astronomer Carl Sagan cited as part of India's tradition of questioning)."
        correct: true
        feedback: |
          Fair. The hymn leaves the question open, and many readers, including some atheist and agnostic ones, see an early form of inquiry.
      - text: "A mystical reading: the verses come from a visionary experience, or re-enact the coming-to-be of the world in the listener (as scholars such as Karel Werner and Joel Brereton suggest)."
        correct: true
        feedback: |
          Fair. On this reading the open ending is not doubt but the edge of what words can say.
      - text: "A creation story naming a creator who certainly knows how it was done."
        feedback: |
          Not what the text says: the final verse says the overseer may not know. The hymn does not tell a story with a sure answer.
    explanation: |
      Two readings of the same seven verses, and neither is forced by the text. This is a recurring feature of the Vedic texts: a few words, many layers. The traditions read it as part of a revelation; historians read it as a late composition of a questioning poet.

  - type: text
    id: ritual
    title: "The logic of sacrifice"
    body: |
      Now the ritual itself. The Sanskrit word for sacrifice is ***yajna***: an offering made into the fire, with chanted verses, by trained priests. The **Brahmanas**, prose texts attached to each Samhita, explain how to do it and why. Scholars divide them into *vidhi* (commands for performing a rite) and *arthavada* (explanations and praise of why it works).

      The core idea, according to the Brahmanas, is that the sacrifice is exact and effective. Pronunciation, accent, pitch and the movements of the hands all have to be right: in the best-known one, the *Shatapatha Brahmana*, a verbal slip makes a mantra powerless, and perfect speech makes it work. The sacrifice is also tied to the cosmos: its parts correspond to parts of the world, and the texts link it to the wider cosmic order (*rta*). This is the world in which the question of the self will be asked: a world where precision and meaning are everything.

  - type: mcq
    id: ritual-q
    title: "Why so exact?"
    prompt: |
      According to the Brahmana texts, why did priests train for years to pronounce the verses with exact sounds, accents and rhythm?
    options:
      - text: "Because, on their view, a wrongly spoken mantra loses its power, while a perfect one works."
        correct: true
        feedback: |
          Right. The exactness is part of the doctrine that the ritual acts only if done correctly.
      - text: "Because no one in that time understood what the words meant, so the sound had to be copied."
        feedback: |
          The tradition did care about meaning (the Brahmanas explain it), and the exactness is argued from the ritual's power. Oral memory also demanded precision, but that is a different point from why the ritual needed it.
      - text: "Because the verses were being prepared for writing in a book."
        feedback: |
          Writing came much later according to historians; the exactness belongs to the oral ritual.
    explanation: |
      Here lies the root of the later chant-preserving tradition, but also the seed of a question: if the sacrifice is a precise machine for keeping the world in order, what exactly is it a picture of?

  - type: text
    id: turn
    title: "Reading the ritual as the world"
    body: |
      The **Aranyakas** and early **Upanishads** start by staying inside the ritual but changing what it means. The *Brihadaranyaka Upanishad* opens with the horse sacrifice, the *ashvamedha*, a great royal rite. It does not describe the rite; it says that the dawn is the head of the sacrificial horse, the sun its eye, the wind its breath. The sacrifice has become a picture of the universe, to be contemplated.

      Other early Upanishads go further, according to scholars who survey them: the *Kaushitaki* calls for an inner *agnihotra* (the fire offering) in place of the outer one; the *Chandogya* likens a procession of chanting priests to a procession of dogs; the *Mundaka* calls sacrifices frail boats that cannot carry anyone across. Yet scholars note that the opposition is not explicit in the oldest texts, and sources differ on how sharply the *Mundaka* verse rejects ritual.

  - type: mcq
    id: turn-q
    title: "What did the horse become?"
    prompt: |
      The Brihadaranyaka Upanishad begins by saying that the dawn is the head of the sacrificial horse, the sun its eye and the wind its breath. What is it doing with the ritual?
    options:
      - text: "Reading the ritual as a symbol of the whole cosmos, to be contemplated as well as performed."
        correct: true
        feedback: |
          Right. The act stays, but its meaning moves from a procedure to a picture of the universe and then to a question about the one who contemplates.
      - text: "Giving the priests exact instructions for training the horse."
        feedback: |
          The text does not instruct a rite here; it compares the parts of the horse to parts of the cosmos.
      - text: "Declaring that the horse sacrifice must never be performed again."
        feedback: |
          Nothing in the opening forbids the rite; it reinterprets it. This is the misconception that the Upanishads simply reject ritual, which the traps below test.
    explanation: |
      This is the hinge of the lesson: from "do the ritual exactly" to "understand what the ritual stands for". That step is what leads to asking about the person who does the acts.

  - type: text
    id: yajnavalkya
    title: "Yajnavalkya"
    image:
      src: img/yajnavalkya-janaka.webp
      alt: "A painted relief of two seated bearded men with children and a cow around them; the one on the left, labelled Yajnavalkya, gestures while the one on the right, labelled Janaka, listens with folded hands."
      caption: "A modern painted relief of the sage Yajnavalkya (left) with King Janaka (right); no portrait from their time exists, so it shows how later artists picture the scene."
      credit: "எஸ். பி. கிருஷ்ணமூர்த்தி, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Yajnavalkya_and_Janaka.jpg"
    body: |
      The Brihadaranyaka's central figure is the sage **Yajnavalkya**, dated by some to the eighth or seventh century BCE (legend more than record; some scholars suspect more than one sage by that name). The tradition credits him with receiving the White Yajurveda, so he stands in the ritual tradition too.

      In the text he wins a debating contest at the court of King **Janaka**, and in a dialogue answers him that after he moves from the sun to the moon, fire and sound, the **Self** is the light a person lives by. In another dialogue, his wife **Maitreyi** asks whether the wealth of the whole earth could make her immortal. He says no, and she answers that she wants nothing that does not lead to immortality; he then teaches that the Self is the thing to be seen, heard, understood and meditated on. He describes the Self by negation, "not this, not this" (*neti neti*), since it cannot be grasped as an object.

  - type: text
    id: uddalaka
    title: "Uddalaka and Shvetaketu"
    body: |
      A second early Upanishad, the *Chandogya*, tells a story in its sixth part. A young man, **Shvetaketu**, goes at twelve to study the Vedas and comes home at twenty-four, in the words of one translation conceited and stern, sure that he is well read. His father, the sage **Uddalaka Aruni**, asks whether he asked his teachers for the instruction by which what is not heard becomes heard. Shvetaketu has not, and does not know what it is. His father then teaches him.

      So the Upanishad stages the turn from the ritual and the texts to something else: twelve years of mastering the Veda had given Shvetaketu learning, but not what his father calls knowledge of Being. What that knowledge is, and the famous saying it ends in, is the subject of the next lesson.

  - type: mcq
    id: uddalaka-q
    title: "What is the story's point?"
    prompt: |
      Shvetaketu comes home at twenty-four after twelve years of Vedic study, proud and well read, and his father asks about the instruction by which what is not heard becomes heard. He cannot answer. What does the story suggest?
    options:
      - text: "That mastering the texts is not the same as the knowledge the Upanishad cares about; the learned young man still lacks it."
        correct: true
        feedback: |
          Right. The Upanishad is not mocking learning, since the father still teaches from within the tradition; it separates learning the Veda from knowing what it is about.
      - text: "That Shvetaketu was a poor student who wasted twelve years."
        feedback: |
          He mastered the Vedas (that is the point of the twelve years). The contrast works only because he was good at it.
      - text: "That the Vedas are false and should be abandoned."
        feedback: |
          The story is told inside the Veda and by a sage who taught it. It ranks kinds of knowing, it does not discard the texts.
    explanation: |
      Two views will come up later. One: knowledge of the Self is the real purpose of the Veda. Another, from the ritual school (Mimamsa): the Veda's core is the ritual command. Both read the same shruti.

  - type: mcq
    id: trap-ritual
    title: "Trap: do the Upanishads reject ritual?"
    prompt: |
      A classmate says: "The Upanishads reject sacrifice and priests altogether, and Hindus stopped doing rituals after them." Which reply is most accurate?
    options:
      - text: "Some passages criticize sacrifice sharply (the Mundaka's frail boats) and others reread it as a symbol (the horse in the Brihadaranyaka), but the oldest texts do not say it must stop, and worship and ritual (*puja*) continue in Hindu practice."
        correct: true
        feedback: |
          Right. Scholars differ on how sharp the opposition is; some read the Mundaka verse as a sharp reversal, others as a criticism of ritual without virtue.
      - text: "They only repeat the Brahmanas, with no change at all."
        feedback: |
          They add a new question and new methods, reading the ritual symbolically and asking about the Self.
      - text: "They were written by non-Vedic teachers outside the tradition."
        feedback: |
          The Upanishads belong to the Vedic tradition itself (they are the last layer of each Veda), so the criticism comes from within.
    explanation: |
      A better word than "reject" is "reinterpret, relativize and sometimes criticize". A sentence like "ritual alone does not carry you across" is different from "do not do ritual".

  - type: mcq
    id: trap-dating
    title: "Trap: the date of the Rigveda"
    prompt: |
      A quiz says: "The Rigveda was composed in 1500 BCE." What is the best correction, based on what historians say?
    options:
      - text: "1500 BCE is the start of a commonly cited range (roughly 1500 to 1000 BCE, some say 1500 to 1200); the hymns were composed over a period, and the collection was assembled later."
        correct: true
        feedback: |
          Right. The estimates come from language, internal evidence and comparison with other texts, not from a dated manuscript, so every source gives a range.
      - text: "It is dated exactly by a colophon in the oldest manuscript."
        feedback: |
          The oldest surviving manuscripts are far younger (about 1040 CE, found in Nepal), so they cannot date the composition.
      - text: "Historians have no idea and every date is as good as any."
        feedback: |
          They have good grounds for a range (the language, the places and technologies named, the order of the layers). It is a range, not a guess.
    explanation: |
      A date given as a range keeps the fact (about the texts and their layers) apart from the debate (the exact window). Tradition itself does not date the Veda by such a method, since it holds the Veda to be eternal, which is the faith layer.

  - type: numeric
    id: counts
    title: "Verses per hymn"
    prompt: |
      The Rigveda has 1,028 hymns and, in the 1877 Aufrecht edition, 10,552 verses. On average, about how many verses is a hymn? Round to one decimal place.
    answer: 10.3
    tolerance: 0.06
    answerText: '10.3'
    hint: "Divide the number of verses by the number of hymns."
    explanation: |
      $10{,}552 / 1{,}028 \approx 10.26$, so a hymn is about ten verses on average. This is a figure about the shape of the collection (many short hymns), not a claim about any hymn in particular: the Nasadiya has seven verses, while some are much longer.

  - type: mcq
    id: trap-oral
    title: "Trap: oral or written?"
    prompt: |
      Which statement about how the Vedas were kept is the best supported?
    options:
      - text: "They were passed on by memory from teacher to student for centuries, using recitation methods designed to preserve every sound; the oldest surviving manuscripts of the Rigveda are from about 1040 CE."
        correct: true
        feedback: |
          Right. Memory was the medium, and in 2003 UNESCO recognised the Vedic chant as a masterpiece of oral and intangible heritage.
      - text: "They were written on clay tablets at the time they were composed."
        feedback: |
          No such tablets exist. Writing came, according to historians, centuries after composition, and the long oral stage is the usual account.
      - text: "Oral transmission means they were changed freely in every generation."
        feedback: |
          The reverse: the methods were built to prevent change, and scholars who study the chanting find it remarkably faithful (one scholarly description speaks of exceptional fidelity over more than a thousand years).
    explanation: |
      An oral text can be very stable, and a written text can be altered. The age of a manuscript tells us about copying, not about composition: the manuscripts are about 2,500 years younger than the hymns, if the 1500 BCE end of the range holds.

  - type: text
    id: vedanta
    title: "Shruti and Vedanta"
    body: |
      The Vedas and Upanishads together are called ***shruti***, "what is heard": the tradition holds that the sages heard the Veda rather than invented it, as the lesson What Is Hinduism? noted. The word ***Upanishad*** is explained as "sitting near", that is, near a teacher, and also as "hidden connections" (Olivelle's rendering). More than 200 are known; the Muktika list counts 108, and the first thirteen of those are called the principal ones, among them the Brihadaranyaka, Chandogya, Isha, Kena, Katha, Mundaka and Mandukya.

      Because they are the last layer, the Upanishads are called ***Vedanta***, usually read as "the end of the Veda": the last chapters in time, or its goal and highest purpose. Later schools of Hindu thought called Vedanta build on them, along with the Gita and the *Brahma Sutras*, and will be the subject of the lessons ahead.

  - type: mcq
    id: faith-q
    title: "Where do the views part?"
    multiple: true
    prompt: |
      One position says the Veda is *apaurusheya* ("not of human authorship") and eternal, heard by sages. Another says it was composed by poet-priests over centuries and written down long after. Which statements are accurate? Select all that apply.
    options:
      - text: "The first is a faith commitment of the Mimamsa school and many Hindus; it cannot be tested by dating manuscripts."
        correct: true
        feedback: |
          Fair. It is a claim about the origin of the Veda that goes beyond what dates can say, and the tradition argues for it (in Mimamsa by the eternity of language and sound, in Kumarila's line that having no author protects the text from objection).
      - text: "The second is a historical reading: it uses language, internal evidence and the layers of the texts, and it says nothing about whether the content is true."
        correct: true
        feedback: |
          Fair. A date for the hymns is not a verdict on the wisdom in them, which leaves the question of truth open.
      - text: "The two cannot both be held: any believer must reject the historians' dates."
        feedback: |
          Many Hindus accept the historians' dates for the human voices in the texts while holding that the sages heard what is deeper than authorship. How far to combine them is a live debate, within the traditions as well.
    explanation: |
      Three layers again: texts and manuscripts (fact); dates and compositions (scholarly debate); eternal and unauthored (faith). A fair reader keeps them apart.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the Upanishads say that the Self is not the body or the learned mind, and several of them say it is the same as the ultimate reality, called *Brahman*. In the lesson Brahman and Atman we read the sayings that express this and ask what it could mean.
