id: ch17-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: Hindu Thought"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: the name *Hindu*, the Vedas, atman and Brahman, maya, karma and moksha, the three Vedanta readings of one saying, the Gita, the six schools, and the meeting with physics. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone, and the feedback keeps the course's three layers apart: **established fact** (texts, dates, numbers), **scholarly debate** (say which), and **faith commitment** (what a tradition holds). *Veda* is the oldest body of Hindu sacred texts; *Vedanta* is the line of thought built on the Upanishads, the last layer of the Vedas; $c.$ means about; years are CE unless marked BCE.

  - type: mcq
    id: trap-creed
    title: "One creed, one founder?"
    prompt: |
      A student says: "Hinduism is a single religion with a founder, a creed everyone signs and one central book, like the others." Which reply fits best?
    options:
      - text: "According to scholars, it is better called a family of traditions: no single founder, no central authority and no required creed. The word *Hindu* began as a place name for the Indus country, *Hinduism* entered English in the early nineteenth century, and adherents often say *sanatana dharma* ('eternal order') of their own way."
        correct: true
        feedback: |
          Yes. What holds the family together is mostly shared texts, practice (puja, festivals, family rites) and a shared set of questions, not one confession. Many Hindus accept the single name; the point is that it does not mean one creed.
      - text: "It has a founder, Shankara, and a creed set out in the Gita."
        feedback: |
          Shankara (c. 700 to 750) is a great teacher of one school, Advaita, not a founder of all. The Gita is one authoritative text for many, and the schools read it differently.
      - text: "Since there is no creed, there is nothing to study: the word names only a culture, with no ideas."
        feedback: |
          The traditions have a large body of texts and arguments, as the other lessons of this level show. Having no single creed is a different thing from having no ideas.
    explanation: |
      Layers: the history of the names and the absence of a central authority are established; whether "Hinduism" is one religion or several is argued among scholars and among Hindus; what the traditions teach is a commitment of each. Replacing the family with one creed is the first shortcut.

  - type: mcq
    id: trap-veda-book
    title: "The Veda is one book?"
    prompt: |
      A quiz says: "The Veda is the Hindu Bible, one book written by one author at one time." Which reply is best?
    options:
      - text: "*Veda* (from *vid*, 'to know') names a body of texts: four collections (Rigveda, Samaveda, Yajurveda, Atharvaveda), each with layers (hymns, ritual manuals called Brahmanas, and the Upanishads). Historians date the Rigveda hymns to a range of roughly 1500 to 1000 BCE, composed over time and kept by memory. Many traditions hold the Veda to be *shruti* ('what is heard'), without a human author."
        correct: true
        feedback: |
          Yes. The first part is history; the last sentence is what the tradition itself says (layer 3), which the historian's range does not settle either way.
      - text: "The Veda is the Rigveda alone; the other three are later commentaries."
        feedback: |
          The four are counted as Vedas. The Samaveda is largely made of stanzas that also appear in the Rigveda, set for singing, and the Yajurveda and Atharvaveda have their own contents. They are not commentaries.
      - text: "The Veda includes the Gita, since the Gita is the most famous sacred text."
        feedback: |
          Most traditions place the Gita in *smriti* ('what is remembered'), as part of the Mahabharata epic, not in *shruti*. The Gita is highly authoritative for many, but it is not one of the Vedas.
    explanation: |
      Established: four Vedas with layers, a long oral stage, the oldest surviving Rigveda manuscripts only from about 1040. Debated: the dating windows. Commitment: that the Veda has no human author. A word for a library is not a word for one book.

  - type: numeric
    id: trap-hymns
    title: "Verses per hymn"
    prompt: |
      The Rigveda has 1,028 hymns. Aufrecht's 1877 edition counts 10,552 verses. On average, how many verses does a hymn have? Round to one decimal place.
    answer: 10.3
    tolerance: 0.06
    answerText: '10.3'
    wrong:
      - { value: 0.097, feedback: 'That is hymns divided by verses, the inverse of what is asked. The average is verses per hymn, so verses go on top.' }
      - { value: 9524, feedback: 'That is $10{,}552 - 1{,}028$. Subtracting the counts does not give a rate; divide.' }
    hint: |
      Divide the number of verses by the number of hymns.
    explanation: |
      $10{,}552 / 1{,}028 \approx 10.3$. The hymns vary a lot in length (the average hides short and long ones), and counts differ a little between editions, so "about 10" is the honest summary. The point of the trap: even the size of the Rigveda is a collection of over a thousand pieces, not a single text written in one sitting.

  - type: mcq
    id: trap-atman-soul
    title: "Atman is the Christian soul?"
    prompt: |
      A student writes: "Atman just means soul, the same personal thing that Christians say goes to heaven or hell." Which reply is best?
    options:
      - text: "Translators often use 'soul', but 'Self' is the more careful word. According to the Upanishads, the atman is not the personality: memory, character and feeling belong to the embodied person. Advaita says the atman is Brahman; Vishishtadvaita and Dvaita keep the soul distinct from God. The two ideas share the thought that a person is more than the body, and differ on most of the rest."
        correct: true
        feedback: |
          Yes. A translation is a bridge, not an identity. Ask what a word carries along from its first culture.
      - text: "Atman is the same as the Christian soul in every respect, including judgment by a creator after death."
        feedback: |
          The Upanishadic teaching is about knowledge and liberation, not a verdict by a creator. Christian ideas of the soul have their own history, and a few points of overlap do not make them one idea.
      - text: "Atman means the body, and the Upanishads deny any inner self."
        feedback: |
          The reverse: the Upanishads argue that the body, breath, mind and ego are what the Self is first mistaken for. The denial of a self belongs to a different school, Buddhism, the topic of a later level.
    explanation: |
      Layer check: what the texts say is history; how atman relates to Brahman is exactly where the three Vedanta schools differ; whether any self exists is a metaphysical commitment. Using one English word for two traditions hides all three questions.

  - type: mcq
    id: trap-three-words
    title: "Brahman, Brahma, brahmin"
    prompt: |
      Three similar words turn up in English: *Brahman*, *Brahma* and *brahmin*. Which matching is correct?
    options:
      - text: "Brahman: the ultimate reality of the Upanishads (neuter, usually described by negations or as being and consciousness). Brahma: a creator god of later texts. Brahmin: a member of the priestly class."
        correct: true
        feedback: |
          Yes. Related in the history of the language, different in meaning. Which of them is a god with a form depends on the word, and on the school.
      - text: "Brahman: the priestly class. Brahma: the ultimate reality. Brahmin: a creator god."
        feedback: |
          This is the same three words in the wrong places. The ultimate reality is Brahman; the priests are brahmins; the creator god is Brahma.
      - text: "All three are spellings of one word, the name of God."
        feedback: |
          They are three words with three roles. Treating them as one makes it impossible to read a sentence such as 'Brahman is not Brahma'.
    explanation: |
      A mix-up of these three words is the quickest way to misread the Upanishads: the philosophical claim is about Brahman, not about a priest class or a single god.

  - type: mcq
    id: trap-maya
    title: "Maya means the world does not exist?"
    prompt: |
      A student says: "Advaita teaches that *maya* makes the world an illusion, so for Advaita the world simply does not exist, like a dream with nothing in it." Which reply is closest to what later Advaita says?
    options:
      - text: "According to later Advaita, the world of many things is neither wholly real nor wholly unreal (*anirvacaniya*, 'not definable'). The usual picture is a rope taken for a snake in dim light: the snake is not there, the fear is real, and the rope remains when the light comes. The world is misread, not nothing. Scholars debate how far this formula goes back to Shankara himself."
        correct: true
        feedback: |
          Yes. The claim is about the ultimate status of plurality, not that the table is absent. Critics, such as the Dvaita school, hold that the world is fully real.
      - text: "Maya means the world is made of physical matter that is mostly empty space, so physics confirms it."
        feedback: |
          Physics says a table has structure (atoms, forces) that explains its solidity. It keeps the table. Advaita's claim is metaphysical and no experiment is set up to test it, so the physics fact does not confirm it.
      - text: "Maya is a mistaken ancient theory of colour vision and has nothing to do with philosophy."
        feedback: |
          Advaita is an argument about the ultimate status of the world and the self, not a theory of vision. Reading it as bad psychology misses what both its defenders and its critics are discussing.
    explanation: |
      Layer check: that Advaita texts speak of maya this way is history; whether plurality is ultimately illusory is a metaphysical commitment that Vishishtadvaita and Dvaita reject. The trap is the jump from 'not ultimately real' to 'does not exist'.

  - type: mcq
    id: trap-karma-fate
    title: "Karma is fate, or a judge's verdict?"
    prompt: |
      A student says: "If karma is real, everything that happens to me is fixed in advance, so my choices do not matter. And someone must be sitting as a judge to hand out the rewards." Which reply is fair, in the terms of the doctrine?
    options:
      - text: "Later thinkers split karma into the stored store, the ripening portion shaping this life, and the new karma made by present choices, so choice still counts. As for a judge, the Vedanta thinkers disagree: Shankara argued that karma, being without awareness, needs a conscious Lord to deliver its results according to the deeds, while others compare karma to seeds that grow by their own nature, with God partial to no one."
        correct: true
        feedback: |
          Yes. Two separate questions are mixed in the student's sentence: how much is fixed, and whether something must deliver the results. The doctrine answers the first with a split and the schools answer the second in two ways.
      - text: "Karma is fate, which is why the schools tell people not to act."
        feedback: |
          If all were fixed, the teaching of right action would be pointless. The Upanishads and the Gita urge right action because it counts.
      - text: "All Hindu thinkers hold that karma is a blind natural law and God has no role in it."
        feedback: |
          The Vedanta schools of this level give God a role in delivering the results, so this describes only one reading.
    explanation: |
      The split between what is given and what is chosen is common to many ideas of responsibility. Whether karma is law-like or delivered by a Lord matters for the problem of evil, and thoughtful people differ on it.

  - type: mcq
    id: trap-moksha-heaven
    title: "Moksha is going to heaven?"
    prompt: |
      A student says: "Moksha is the Hindu word for heaven, a reward place you go to after death." Which reply is best?
    options:
      - text: "*Moksha* means 'release', from the cycle of rebirth (*samsara*). Each school describes the end in the form its metaphysics allows: for Advaita it is knowing that the Self is Brahman, possible even in this life (*jivanmukti*, 'liberation while living'); for Vishishtadvaita it is eternal life with Vishnu in Vaikuntha, in knowledge, bliss and loving service; for Dvaita souls stay distinct from God and enjoy his nearness in graded bliss."
        correct: true
        feedback: |
          Yes. Only some descriptions resemble a place of reward, and none of them is a prize for being good in the way the word 'heaven' suggests. The older texts link release to the end of desire and the knowledge of the Self.
      - text: "Moksha is a long period of bliss followed by a new birth, like a holiday between lives."
        feedback: |
          That is closer to what some texts say of heavenly worlds reached by good deeds, which in the older picture still belong to the cycle. Release means leaving the cycle, not resting in it.
      - text: "Moksha is a state that all Hindu schools agree is annihilation, with no one left to enjoy anything."
        feedback: |
          The schools do not agree on this. Vishishtadvaita and Dvaita keep the soul in bliss; Advaita says the Self was never lost, which is not the same as saying nobody remains.
    explanation: |
      Layers: what each school says is history of ideas; whether rebirth and release are real is a metaphysical and faith commitment. The trap is a word that translates to a different religion's idea.

  - type: mcq
    id: trap-tat
    title: "One saying, one meaning?"
    prompt: |
      The Chandogya Upanishad (6.8 to 6.16) repeats the saying *tat tvam asi*, 'that you are', to a student named Shvetaketu. A student says: "All three Vedanta schools read it the same way, as 'you are God'." Which reply is best?
    options:
      - text: "They differ, and the differences are the schools. Advaita reads identity: the Self is Brahman. Vishishtadvaita reads *tvam* ('you') as naming Brahman as the one who dwells within the self, so the self is Brahman's body or mode, not a separate thing. Dvaita splits the sentence differently, as *a-tat tvam asi*, 'you are not that'."
        correct: true
        feedback: |
          Yes. Same words, three readings. Neither the grammar nor the text alone ends the dispute, which is why the later schools wrote full commentaries.
      - text: "Only Advaita accepts the Upanishads; the other two reject this saying."
        feedback: |
          All three accept the Upanishads, the Gita and the Brahma Sutras as authority. They differ on how to read them.
      - text: "All three read it as a metaphor with no claim about reality."
        feedback: |
          None of them takes it as mere metaphor. Each reads it as a serious statement, and they disagree about what it states.
    explanation: |
      Layers: the text of the saying is established; which reading is correct is a live argument that each school settles by its own principles; whether any of them describes reality is a metaphysical commitment. One text can carry three metaphysics.

  - type: mcq
    id: trap-gita
    title: "The Gita: a call to war, or to doing nothing?"
    prompt: |
      Arjuna, a warrior, drops his bow before a battle (2.9: he says he will not fight). A student says: "So the Gita is either a call to war or, in the end, a call to give up action and retreat." Which reply fits the text and its readers best?
    options:
      - text: "According to the text, Krishna says no one can stay without action even for a moment (3.5), so refusing is itself a choice, and urges acting from duty without clinging to the fruits (2.47). Readers rank the paths differently: Shankara says action purifies the mind but only knowledge liberates; Ramanuja puts devotion as the direct means; Tilak makes selfless action central; Gandhi reads the war as a picture of an inner struggle."
        correct: true
        feedback: |
          Yes. The poem supports several centres, and the readers explain why they pick one. 'War or retreat' leaves out the third thing the text itself argues for: how to act.
      - text: "Krishna orders Arjuna to fight whatever his doubts, so the Gita simply approves war."
        feedback: |
          The war is called righteous in the setting of Arjuna's own duty (2.31), and the argument is about the spirit of acting. Whether that supports war in general is exactly what the readers argue about; Gandhi read it the opposite way.
      - text: "Every reader agrees the Gita teaches retreat from the world."
        feedback: |
          Tilak argued against exactly that, and even Shankara gives action a role in purifying the mind.
    explanation: |
      Layers: what the verses say is history; which reading is best is debated among scholars and believers; whether the Gita is divine speech is faith. The trap is a false choice between two pictures that the text itself corrects.

  - type: mcq
    id: trap-astika
    title: "Astika means theist?"
    prompt: |
      Indian philosophy sorts schools as *astika* ('orthodox') or *nastika* ('heterodox'). A student says: "So astika schools believe in God and nastika schools are atheist." Which reply is best?
    options:
      - text: "The sorting is about the authority of the Veda, not about God. Samkhya and early Mimamsa accept the Veda yet give no role to a creator, so they count as astika. Buddhism, Jainism and the materialist Charvaka are usually named nastika. Some texts define the terms differently, and lists vary by author."
        correct: true
        feedback: |
          Yes. 'Believer' and 'atheist' are Western labels laid over a Sanskrit division that asks a different question.
      - text: "Astika means 'has a founder' and nastika means 'has none'."
        feedback: |
          Neither word is about founders. Hinduism has no single founder and is not called nastika for it.
      - text: "Astika schools believe in rebirth and nastika schools reject it."
        feedback: |
          Buddhism and Jainism, usually named nastika, both teach rebirth. The line is drawn at the Veda's authority.
    explanation: |
      Samkhya and early Mimamsa, both astika, show how little the sorting has to do with God. A classification borrowed from one culture changes meaning in another.

  - type: mcq
    id: trap-purusha
    title: "Does the purusha act on nature?"
    prompt: |
      In Samkhya there are two kinds of things: *prakriti* (nature, including the intellect and mind) and *purusha* (the self, many of them). A student says: "The purusha is the doer: it pushes nature and makes things happen, like Descartes's mind steering the body." Which reply is best?
    options:
      - text: "In the classical text, the Samkhya Karika, the purusha is witness, solitary, neutral and not an agent. All change and action belong to prakriti, and the intellect itself is a product of prakriti. The two seem to cooperate because the purusha is mistakenly taken for the doer, and liberation is the discrimination of the two."
        correct: true
        feedback: |
          Yes. This is why Samkhya's dualism differs from Descartes's: his mind thinks and wills, while the purusha only witnesses.
      - text: "The purusha creates nature out of nothing and then rules it, so it is a God."
        feedback: |
          Samkhya is non-theistic: it gives no role to a creator. The purusha does not make nature, and nature develops by its own stages.
      - text: "There is only one purusha, which is Brahman, as in Advaita."
        feedback: |
          Samkhya holds a plurality of purushas, and Advaita's single Self is a different view. Comparing them is useful, but they are different schools.
    explanation: |
      Layers: what the Karika says is history; whether a witness-self that does nothing is coherent is a philosophical objection that critics press; whether it exists is a metaphysical commitment. The trap is reading a familiar dualism into an unfamiliar one.

  - type: mcq
    id: trap-gods
    title: "Many gods means many religions, or many Hindus have no unity?"
    prompt: |
      A student says: "Hindus worship thousands of gods, so Hinduism is just polytheism, with nothing in common between a Vishnu devotee and a Shiva devotee." Which reply fits best?
    options:
      - text: "Scholars group living practice into four main streams (Vaishnavism, Shaivism, Shaktism and the Smarta tradition), each with its own deity at the centre, and many people honour deities of several streams, often choosing one as a personal 'chosen deity'. Many traditions also speak of one ultimate reality behind the forms. The label 'polytheism' alone hides the Rigveda's saying that the one is called by many names, which is read in more than one way."
        correct: true
        feedback: |
          Yes. The streams share texts (the Vedas, the Gita), practices (puja, darshan) and questions, and the many-and-one is a debate inside the traditions, not a gap in them. Shares of the streams are contested.
      - text: "All Hindus worship the same one god under the same name."
        feedback: |
          Practice varies widely: Vishnu, Shiva, the Goddess and others stand at the centre in different homes. 'One god' is one reading of the situation, not a description of everyone's practice.
      - text: "The streams are rival churches that excommunicate each other."
        feedback: |
          They are not churches, and there is no central authority to excommunicate anyone. Many people honour deities of more than one stream.
    explanation: |
      Layers: the existence and size of the streams is documented with contested shares; whether the many deities are many gods or forms of one is a theological commitment that traditions answer differently. 'Polytheism' and 'monotheism' are Western boxes that fit this family badly.

  - type: numeric
    id: trap-kalpa
    title: "A kalpa against the universe"
    prompt: |
      One kalpa (a 'day of Brahma' in the cycles of time of later Hindu texts) lasts $4.32\times10^9$ years. Planck 2018 gives the age of the universe as $13.787\times10^9$ years. What fraction of the universe's age is one kalpa? Round to two decimal places.
    answer: 0.31
    tolerance: 0.006
    answerText: '0.31'
    wrong:
      - { value: 3.19, feedback: 'That is the universe divided by the kalpa, the inverse. The question asks for the kalpa as a fraction of the universe, so the kalpa goes on top.' }
      - { value: 0.95, feedback: 'That is the kalpa divided by the age of the Earth ($4.54\times10^9$ years). The question is about the age of the universe.' }
    hint: |
      Divide $4.32$ by $13.787$ (both in billions of years).
    explanation: |
      $4.32/13.787 \approx 0.313$, about a third. A kalpa is close to the age of the Earth ($4.32$ against $4.54$ billion years) but nowhere near the age of the universe, so a claim that it 'matches' depends entirely on which of the two ages one compares with.

  - type: mcq
    id: trap-foreknowledge
    title: "Does the kalpa prove foreknowledge?"
    prompt: |
      A kalpa is $4.32\times10^9$ years and the Earth is about $4.54\times10^9$ years old. A student says: "Such a close match shows the ancient authors somehow knew the age of the Earth." Which reply is best?
    options:
      - text: "A match is only evidence if it was fixed in advance and would have failed otherwise. The same texts give other numbers that match nothing: a day and night of Brahma is $8.64\times10^9$ years, and Brahma's life is $311.04\times10^{12}$ years, about 22,600 times the age of the universe. Picking the one number that fits, from a family of big numbers, is how coincidences are made. The text's own purpose for its numbers is a different, historical question."
        correct: true
        feedback: |
          Yes. A real test would say beforehand which number is the Earth's age and then check it. Here the check is made after, with the age of the Earth (4.54 billion years from radiometric dating) as one target among several that the numbers might hit. Defenders may find the resemblance interesting; a resemblance is not proof.
      - text: "The match is exact, so it cannot be a coincidence."
        feedback: |
          $4.32$ against $4.54$ is a difference of about 5%, and the age of the Earth is itself a measured value that changes with better data. 'Close' is not 'exact', and even an exact match could be chance among many numbers.
      - text: "Any match between an old text and science is always chance, so it is never worth discussing."
        feedback: |
          Overreach in the other direction. Resemblances can be interesting and worth asking about, and the fair move is to ask what would count as a test, as in the answer above.
    explanation: |
      Layers: the numbers in the texts and in cosmology are established; what the texts' authors meant by them is a historical question; that the numbers are foreknowledge is a faith or speculative commitment. The shape 'cycles of enormous length' is shared with some cosmologies, but the numbers do not carry over.

  - type: mcq
    id: trap-observer
    title: "An observer is a conscious mind?"
    prompt: |
      A student says: "Quantum physics says a result depends on being observed, so it needs a conscious mind, just like the Samkhya witness-self that sees all." Which reply is best?
    options:
      - text: "In standard quantum mechanics an observer is any physical interaction that records a result: a detector, a screen or a stray molecule. No mind is needed, and the usual physical account is decoherence. Eugene Wigner (1902 to 1995) proposed in 1961 that a conscious mind might collapse the wave, then later gave the idea up; a few physicists revive forms of it, but it is a minority view. The Samkhya purusha is a passive witness that never acts, so it would not collapse anything either."
        correct: true
        feedback: |
          Yes. The shared word 'observer' hides two different ideas, a recording interaction in physics and a witnessing self in philosophy.
      - text: "Physicists all agree that consciousness collapses the wave, and Hindu thought was the first to say so."
        feedback: |
          Most physicists do not hold this, and the texts do not state it in this form. The word 'all' is the overreach.
      - text: "Observers play no role in quantum mechanics."
        feedback: |
          They do play a role: a measurement is an interaction that records a result. The trap is the jump from 'measurement' to 'mind'.
    explanation: |
      Layers: how measurement is described in the standard theory is established; whether consciousness has a special role is an interpretation, debated; the philosophy of a witness-self is a metaphysical view. A shared word can hide a difference of kind.

  - type: mcq
    id: trap-capra
    title: "Do the parallels prove anything?"
    prompt: |
      Fritjof Capra (b. 1939) published *The Tao of Physics* in 1975, with the subtitle *An Exploration of the Parallels Between Modern Physics and Eastern Mysticism*. A student says: "Such parallels prove that the mystics knew modern physics, or that physics proves the mystics right." Which reply is best?
    options:
      - text: "A parallel is a resemblance, and resemblances are cheap: many different pictures can be described in words that sound alike. Critics such as the physicist Jeremy Bernstein called the similarities accidental similarities of language. A fair use names a shared question (what is the self? what is real?), states each answer in its own terms, and says what stays open. Niels Bohr's yin-yang coat of arms of 1947 shows a physicist borrowing a symbol for his idea of complementarity, which is history, not proof."
        correct: true
        feedback: |
          Yes. The overreach is the step from 'sounds alike' to 'proves'. Physics describes measured regularities; the traditions make claims about self and reality that no experiment of physics tests.
      - text: "The parallels prove physics is wrong, because ancient texts cannot agree with it."
        feedback: |
          A resemblance in wording proves nothing in either direction. Physics stands or falls on measurement.
      - text: "The parallels are a deliberate hoax, with no real physics in the books."
        feedback: |
          Capra is a trained particle physicist and the books explain real physics. The criticism is of the inference from resemblance to proof, not of his honesty.
    explanation: |
      Layers: the books, their dates and the resemblances in wording are established; whether the resemblances run deeper than language is debated, with most physicists sceptical; that physics supports a spiritual view is a commitment, and it goes beyond what physics can measure.

  - type: mcq
    id: trap-meditation
    title: "A meditation trial tests the self?"
    prompt: |
      A randomised trial finds that an eight-week mindfulness course lowers anxiety scores compared with a waiting list. A student says: "So science has now tested the Advaita claim that the Self is Brahman." Which reply is best?
    options:
      - text: "The trial measures anxiety. A review by Goyal and colleagues (JAMA Internal Medicine, 2014) of 47 randomised trials found moderate evidence of small to moderate improvement in anxiety, depression and pain, and a later paper by Van Dam and colleagues, 'Mind the Hype' (2018), warned that 'meditation' covers very different practices and that claims run ahead of the evidence. Neither study makes a prediction that the Advaita claim about the Self would pass or fail, and a person of any view, or none, could show the same result."
        correct: true
        feedback: |
          Yes. A testable claim about what a practice does to anxiety is different from a metaphysical claim about the self. The trial can show the first and is silent about the second.
      - text: "The trial shows meditation does nothing, so the traditions that teach it are wrong."
        feedback: |
          The reviews found moderate evidence of modest benefits for some outcomes. A modest effect on anxiety does not bear on the traditions' claims about the self either way.
      - text: "The trial confirms that the Self is Brahman, because meditators report a sense of unity."
        feedback: |
          A report of an experience is data about experience, and the same experience is given different explanations by different traditions. The trial measured anxiety, not the metaphysics.
    explanation: |
      Layers: that a study found an effect on anxiety is established if it replicates; the size and cause (practice or expectation) are live research; that the Self is Brahman is a metaphysical commitment that no such trial reaches.

  - type: text
    id: summary
    title: "What this round tested"
    body: |
      Each trap was a shortcut one step too far, and each is corrected in one line.

      **Hindu**: a family of traditions, not one creed, with no founder; the name began as a place name and *Hinduism* entered English in the early nineteenth century. **Veda**: a body of texts, four collections with layers, not one book, and the Rigveda has about $10{,}552/1{,}028 \approx 10.3$ verses per hymn. **Atman**: better translated 'Self' than 'soul'. **Brahman, Brahma, brahmin**: the ultimate reality, a creator god, a priest. **Maya**: for later Advaita the world is neither wholly real nor wholly unreal, misread like a rope for a snake, not nothing. **Karma**: results of action, split into stored, ripening and new, with schools disagreeing on whether a Lord must deliver the results. **Moksha**: release from rebirth, described differently by each school, not simply heaven. **Tat tvam asi**: three readings (identity, indwelling, *a-tat*). **The Gita**: neither a plain call to war nor to retreat; Shankara, Ramanuja, Tilak and Gandhi rank its paths differently. **Astika**: accepts the Veda's authority, not belief in God. **Purusha**: a passive witness, not a doer. **Streams**: four, with contested shares, not churches. **Kalpa**: $4.32/13.787 \approx 0.31$ of the universe's age, and a match picked from many numbers is not foreknowledge. **Observer**: any recording interaction in physics, not a mind. **Parallels**: resemblance in wording is not proof. **Meditation trials**: test anxiety, not the self.

      Where thoughtful people part ways: in whether the many forms are many or one, in which reading of a shared text is best, and in whether a metaphysical claim can be tested at all.

      **Next:** a quick recall of the level's main distinctions (the lesson Quick Recall), then its content map, the level review and the level challenge.
