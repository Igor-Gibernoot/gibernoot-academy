id: ch17-brahman
title: "Brahman and Atman"
kind: concept
own: |
  The setting: the early Upanishads, philosophical texts of the Hindu traditions in Sanskrit (c. 700 BCE give or take a century, according to Patrick Olivelle), which ask what the self is and what is ultimately real. Two Sanskrit words carry the question. *Atman* is the self, the inner "I" (the word is linked to *breath*). *Brahman* began, according to scholars, as the power of sacred speech in the Vedic ritual, and in the Upanishads it names the ultimate reality behind the world. Everything below is taught according to the texts and their readers, not as a verdict.
  - **The saying.** In the *Chandogya Upanishad*, chapter 6, Uddalaka teaches his son Shvetaketu with salt dissolved in water and the unseen essence in a banyan seed, and ends nine sections with {{ *tat tvam asi*, traditionally "that you are" }}. The traditional (Advaita) reading takes it as an identity between the self and the one reality; Brereton, Olivelle and Doniger prefer "that's how you are", meaning you too are made of the same existence that underlies the world.
  - **The knower is not an object.** In the *Brihadaranyaka Upanishad*, Yajnavalkya teaches that the Self cannot be seen as one more thing seen: {{ you cannot see the seer of seeing }}. He describes it by negation, *neti neti*, "not this, not this", which Shankara reads as denying every attribute of the Self; the same text also contains *aham brahmasmi*, "I am Brahman" (1.4.10).
  - **Four states.** The *Mandukya Upanishad* (twelve verses) lists waking, dream, deep sleep and a fourth, {{ *turiya*, described by negations as the non-dual background of the other three }}.
  - **Five sheaths.** The *Taittiriya Upanishad* (chapter 2) describes the person as five *kosha*, "sheaths", from outer to inner: {{ food (*annamaya*), breath (*pranamaya*), mind (*manomaya*), understanding (*vijnanamaya*), bliss (*anandamaya*) }}, with the Self within them all.
  - **Not "soul", not "God with a form".** *Atman* is better translated "Self" than "soul": memory, character and feeling belong to the embodied person, not to *atman*. *Brahman* in these texts is an impersonal ultimate, not a being with a body; later traditions also worship forms of the divine, and which reading is right is a live debate.

cards:
  - type: mcq
    id: hook
    title: "Guess: who is tired?"
    prompt: |
      Guessing is the point; no background is needed. You think "I am tired". Notice that something in you also watches that thought, as if from behind it. Teachers of the Upanishads (philosophical texts written in India from about 700 BCE) ask: are the tired "I" and the watching "I" one thing? What is the most reasonable first guess?
    options:
      - text: "They are probably different: the tiredness, thoughts and moods come and go, while the watcher is what they all appear to."
        correct: true
        feedback: |
          A good first guess, and close to where the Upanishads start. We test it in this lesson with their own images. Whether the watcher is a separate thing or just another thought is exactly what readers dispute.
      - text: "They are the same: there is only the body and its tiredness."
        feedback: |
          This is a real position, held by materialists (Level 3). But the Upanishadic teachers start from the observation that I can notice my tiredness, which suggests a standpoint that is not the tiredness itself.
      - text: "The question has no content: a watcher is just a word."
        feedback: |
          Some philosophers say so. Notice, though, that the question is about what the word picks out: a thing, a process or nothing. The texts try to answer it.
    explanation: |
      The question is old and still alive: what is the subject that has experiences? We now see how the Upanishads answer, and the several ways readers understand the answer.

  - type: text
    id: words
    title: "Two words: Atman and Brahman"
    body: |
      ***Atman*** (*ātman*) is the Sanskrit word for the self. It is linked to a root meaning *breath*, and the earliest use of the word is in the Rigveda (10.97.11), where it can mean something like the life-breath or the core of a being. In the Upanishads it comes to mean the inner Self, the subject behind experience. It is usually written "Self" with a capital in translations of these texts.

      ***Brahman*** (*brahman*) meant first, according to most scholars, the power of the sacred word: the hymn or formula that, spoken rightly in the ritual, has force (scholars differ on the root meaning: Gonda reads "power", Thieme "formulation"). The priest who knew these words was called a *brahmin*, a related word. In the Upanishads *brahman* grows into the name for the ultimate reality that supports the whole world, according to Gavin Flood's account of this development.

      The question that makes the lesson: the first words are about the person's inside (*atman*) and the world's ground (*brahman*). Are they two things, or one?

  - type: mcq
    id: words-q
    title: "From formula to ground"
    prompt: |
      According to most scholars, how did the word *brahman* change between the Vedic hymns and the Upanishads?
    options:
      - text: "From the power of the sacred word spoken in the ritual to the name of the reality that underlies everything."
        correct: true
        feedback: |
          Right. Scholars see a widening: the force in the ritual word becomes the force or ground of the world. The path from one to the other is part of the move from sacrifice to inquiry.
      - text: "From the name of a personal god with a body to the name of an abstract principle."
        feedback: |
          The early sense was not a god with a body but sacred speech and its power, so this changes the story. Later traditions did add personal forms of the divine; we return to that.
      - text: "It did not change: it always meant the ultimate reality."
        feedback: |
          Scholars trace an earlier ritual meaning, so most do not hold that. Some Hindu thinkers read the Veda as a unity from the start; that is a faith position about the text, not the dating of word use.
    explanation: |
      Keep the two layers apart: the history of the word (scholarship) and the claim that the ultimate reality is such-and-such (a metaphysical position the texts argue for).

  - type: text
    id: salt
    title: "Salt in water"
    body: |
      In the *Chandogya Upanishad*, chapter 6, a father, **Uddalaka**, teaches his son **Shvetaketu**. In the lesson Vedas and Upanishads we met the proud young man back from twelve years of study. Now his father asks him a question his learning has not reached: what is the one thing that, once known, makes everything known?

      The answers come as little experiments. In essence, Uddalaka tells his son to put a lump of salt in water and come back in the morning. The salt cannot be found; it has dissolved. He tells him to sip from the top, the middle and the bottom of the bowl, and each time the water is salty. The salt is in every part, though no eye sees it. Uddalaka says that, in the same way, the subtle essence of what is (*sat*, "being") is in this body although you do not see it. (Section 6.13.)

  - type: mcq
    id: salt-q
    title: "What the salt shows"
    prompt: |
      In the salt-and-water teaching, Shvetaketu cannot see the salt, yet tastes it everywhere in the water. What exactly does this image say, according to the passage?
    options:
      - text: "Something can be present throughout a whole and still not be seen as a separate object; you know it another way (by taste, not sight)."
        correct: true
        feedback: |
          Right. The image is about presence without visibility: the subtle essence pervades the body and the world, though you cannot point to it as you point to a stone.
      - text: "The salt is gone, so the essence is nothing."
        feedback: |
          The test is precisely that the salt is not gone: the taste shows it. The image answers the thought "if I cannot see it, it is not there".
      - text: "The salt is a small part of the water, like a seed in a field."
        feedback: |
          The salt is in every part, not in one place. That is why the image is used for something that is everywhere and not one item among others.
    explanation: |
      The example is a first answer to our hook: the inner essence is not something you find by looking for another object. It is real, like the salt, but known differently.

  - type: text
    id: banyan
    title: "A seed with a tree inside"
    image:
      src: img/banyan-figs.webp
      alt: "Small round banyan figs on a branch among green leaves, beside a river bank."
      caption: "The fruits of the banyan (*Ficus benghalensis*), a tree that grows into a vast spreading canopy from tiny seeds inside figs such as these."
      credit: "Hasnat Abdullah, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Banyan_figs_beside_the_Bangladesh_bank.jpg"
    body: |
      Another lesson in the same chapter (section 6.12): Uddalaka asks his son to bring a fruit of the banyan tree, to break it, and then to break one of its tiny seeds. Shvetaketu finds nothing inside the seed. His father says that the great tree stands there because of a subtle essence that he cannot see, and that this same subtle thing is the Self of all that is. Then comes the sentence that made the chapter famous.

  - type: text
    id: tat
    title: "Tat tvam asi"
    body: |
      At the end of each of these sections (6.8 to 6.16, nine in all), Uddalaka says to his son the three Sanskrit words ***tat tvam asi***. *Tat* means "that" (or "it", or "thus"), *tvam* means "you" and *asi* means "are". Traditionally it is translated "that you are", and it is counted among the *mahavakyas*, the "great sayings" of the Upanishads.

      Two details matter. First, the Chandogya chapter itself does not say the word *Brahman*; it says *sat*, "what is" or "being". The Vedanta tradition, according to its own commentators, reads *sat* as Brahman. Second, the Sanskrit is more open than the usual English. *Tat* is neuter and *tvam* is masculine, so some scholars read the sentence not as "you are that" but as "that's how you are" or "thus are you": you, too, are made of the same existence that grows the tree and dissolves in the water.

  - type: mcq
    id: tat-q
    title: "Two readings"
    prompt: |
      The sentence *tat tvam asi* is read in two main ways. (1) The traditional Advaita reading: "that [the one reality] you are", an identity between you (the Self) and the ultimate reality. (2) The reading of Brereton, Olivelle and Doniger: "that's how you are", meaning that you share the nature of the existence that underlies the world. What do the two readings share?
    options:
      - text: "Both say the same underlying being that supports the world is present in the person."
        correct: true
        feedback: |
          Right. They differ in how far the "are" goes: strict identity of Self and Brahman for the first, sharing the same nature for the second. Which is right is a question about both Sanskrit grammar and philosophy.
      - text: "Both say that the individual body is the ultimate reality."
        feedback: |
          Neither does. On both readings, the body is not what the sentence is about; the Self or the existence in the body is.
      - text: "Both say the sentence is untranslatable and so means nothing."
        feedback: |
          The sentence is hard, but all sides take it to mean something definite. The debate is about what, and that is why it lasted for centuries.
    explanation: |
      This is our first example of one text with several readings. There are further ones (Vishishtadvaita reads *tvam* as the indwelling Brahman of the person; Dvaita reads *a-tat tvam asi*, "you are not that"), and they come in the next lesson.

  - type: text
    id: brihad
    title: "Not this, not this"
    body: |
      The *Brihadaranyaka Upanishad* ("great forest Upanishad") gives a second approach. Its teacher **Yajnavalkya** (met in the lesson Vedas and Upanishads) is asked to show Brahman directly. In essence he answers that you cannot see the seer of seeing, nor hear the hearer of hearing (3.4.2). The Self is the subject of every act of knowing, so it cannot be one more thing known.

      When he tries to say what the Self is, he uses negation: *neti neti*, "not this, not this" (the phrase appears in 3.9.26 and 4.2.4, 4.4.22 and 4.5.15). The Self is not any item you can list. In 4.4.22 it is called the great unborn Self, made of knowledge. And in a creation passage (1.4.10) the text has the sentence *aham brahmasmi*, "I am Brahman": the self, looking back, knows itself as the whole. Advaita treats it as a central saying about the oneness of the Self and Brahman.

  - type: mcq
    id: seer-q
    title: "The seer of seeing"
    prompt: |
      Why does Yajnavalkya say that you cannot see the seer of seeing?
    options:
      - text: "Because whatever you see is an object, and the one who is seeing is the subject: it is not among the objects, it is where they appear."
        correct: true
        feedback: |
          Right. This is Shankara's reading in essence: the Self pervades the act of seeing, so it cannot be shown as you show a cow or a horse.
      - text: "Because the Self does not exist."
        feedback: |
          He says the opposite: the Self is what everything is known by. It is hidden from being an object, not absent.
      - text: "Because the Self is too small to see."
        feedback: |
          Size is not the point. A microscope would not help, since the difficulty is that a seer is not a thing in the field of sight.
    explanation: |
      Compare your eye: it sees everything in the room except itself. This is a structural point about subjects and objects, and philosophers of mind (Level 10) discuss a version of it today. Whether the "seer" is a separate entity or a pattern of the processes of the brain is exactly what the Upanishads and their critics (Buddhists, Level 18) dispute.

  - type: mcq
    id: neti-q
    title: "What does neti neti do?"
    prompt: |
      A student says: "Neti neti, 'not this, not this', shows the Upanishads teach that nothing is real." What is the best reply?
    options:
      - text: "The negation clears away what the Self is not (body, thoughts, any object) in order to point to what is left; Shankara reads it as denying every attribute of the Self, not its existence."
        correct: true
        feedback: |
          Right. It is a method of pointing: remove every description that fits an object, and what remains is the one to whom they appear.
      - text: "The student is right: the phrase is a denial of all reality."
        feedback: |
          The same texts say the Self is the highest reality, so negation of descriptions cannot mean negation of the thing.
      - text: "The phrase is a polite way to end a discussion."
        feedback: |
          It is a teaching device inside an argument, used several times to describe the Self.
    explanation: |
      The traditions that came later disagree on how far negation goes: Shankara reads it as removing all attributes, while Ramanuja (next lesson) reads it as acknowledging the limits of language about Brahman rather than denying its qualities.

  - type: text
    id: mandukya
    title: "Four states"
    body: |
      The *Mandukya Upanishad* has only twelve short verses. It looks at three states we all know and adds a fourth. According to the text (verses 3 to 7):

      | State | Described as |
      |---|---|
      | Waking | knowing outward, the gross world shared by all |
      | Dream | knowing inward, a world made by the mind |
      | Deep sleep | no desire, no dream; consciousness as a single mass |
      | **Turiya** ("the fourth") | not any of these |

      The fourth, *turiya*, is described by negation (verse 7): not inward-knowing, not outward-knowing, not both, unseen, beyond speech, peaceful, non-dual (*advaita*). The idea is that the Self is the background present in all three states and not defined by any. The text links the states to the sounds A, U, M of the syllable *Aum* and the silence after it. The upanishad is preserved with a commentary in verse, the *Karika*, traditionally attributed to Gaudapada (6th century CE), the earliest systematic Advaita work.

  - type: order
    id: states-order
    title: "The four states"
    prompt: |
      Put the four states of the Mandukya Upanishad in the order the text takes them.
    steps:
      - "Waking: knowing the outward, shared world"
      - "Dream: knowing inward, a world made by the mind"
      - "Deep sleep: no desire and no dream"
      - "Turiya: the fourth, described by negations"
    hint: "Start from the most ordinary state and go toward the least describable."
    explanation: |
      The movement is from the most outward to the most inward and then to what is neither. In each of the first three some things are known in a different way; the fourth is introduced as what is present through all, so it is not a fourth item next to them in the way the others are.

  - type: mcq
    id: turiya-q
    title: "Is turiya a fourth state like the others?"
    prompt: |
      A reader says: "Turiya is just a fourth state you enter, like falling asleep." How do the Advaita readers answer?
    options:
      - text: "They say it is not another state alongside the others but the awareness in which all three appear; it is called 'fourth' only to point at it."
        correct: true
        feedback: |
          Right, according to Advaita readers. A rival reading takes turiya as a particular meditative experience; which is correct depends on the school.
      - text: "They say it is the same as deep sleep."
        feedback: |
          The text separates them: deep sleep is a state of unified, undifferentiated cognition, while turiya is described as beyond all three.
      - text: "They say it is an hallucination."
        feedback: |
          No Upanishadic reading says that; it is described as the real nature of the Self.
    explanation: |
      Whether such a "background awareness" exists, or is a way of speaking about the features of experience, is for philosophers of mind to argue (Levels 10 and 11).

  - type: text
    id: kosha
    title: "Five sheaths"
    body: |
      The *Taittiriya Upanishad* (chapter 2) describes the person as five *kosha*, "sheaths", like layers of a cover nested one inside another, from outer to inner:

      | Sheath | Meaning |
      |---|---|
      | *Annamaya* | made of food: the physical body |
      | *Pranamaya* | made of breath: the life-force |
      | *Manomaya* | made of mind: thought, will, desire |
      | *Vijnanamaya* | made of understanding: knowledge, discernment |
      | *Anandamaya* | made of bliss: the innermost |

      Each is said to be the self of the one outside it, and the text invites the learner to go inward step by step. Traditional commentators add that the Self is within all five and none of them. The picture is a ladder for the inquiry that started with the hook: when you say "I am tired", which of these do you mean?

  - type: order
    id: kosha-order
    title: "From outer to inner"
    prompt: |
      Put the five sheaths in order from the outermost to the innermost: breath (*pranamaya*), food (*annamaya*), bliss (*anandamaya*), mind (*manomaya*), understanding (*vijnanamaya*).
    steps:
      - "Food: the body"
      - "Breath: the life-force"
      - "Mind: thought and will"
      - "Understanding: discernment"
      - "Bliss: the innermost"
    hint: "The body is most outward; bliss is last."
    explanation: |
      The order moves from what anyone can touch to what only inquiry reveals. The Self is not a sixth sheath: it is what the five are sheaths of.

  - type: mcq
    id: kosha-q
    title: "'I am tired': which sheath?"
    prompt: |
      Using the five sheaths, which sheath does the sentence "I am tired and cannot think" mostly speak of?
    options:
      - text: "The body and breath (food and life-force sheaths) and the mind sheath: the three outer ones."
        correct: true
        feedback: |
          Right: tiredness belongs to body and breath, and not being able to think to mind. In this picture, the one who notices all this is not one of them.
      - text: "The bliss sheath only."
        feedback: |
          Tiredness is not bliss; the bliss sheath is the innermost and is said to be reached last.
      - text: "None: the sheaths are only about death."
        feedback: |
          The sheaths describe the living person, a ladder of layers. They are not about death.
    explanation: |
      That is the point of the model: we usually say "I" for a sheath. The texts invite us to notice that "I" can be pushed inward. Whether there is something at the end or only more layers is the question of the schools.

  - type: mcq
    id: trap-soul
    title: "Trap: atman = soul?"
    multiple: true
    prompt: |
      A student writes: "Atman is the soul, as in Christianity: a personal thing that goes to heaven or hell." Which corrections are accurate? Select all that apply.
    options:
      - text: "Translators often use 'soul', but 'Self' is better: memory, character, feeling and perception belong, in this picture, to the embodied person, not to the atman."
        correct: true
        feedback: |
          Right. That is the usual scholarly caution about the translation.
      - text: "The teachings about atman do not describe a judgment by a creator after death."
        correct: true
        feedback: |
          Right: the Upanishadic teaching is about knowledge and liberation (moksha), which the lesson on karma takes up. Christian ideas of soul have their own history (Level 15).
      - text: "Atman is the same as the Christian soul in every respect."
        feedback: |
          The two share the thought that there is more to a person than the body, and differ on most details: what the soul has (memory?), its relation to God, its fate. Calling them the same erases both.
    explanation: |
      A translation is a bridge, not an identity. When a word crosses languages, ask what it carries along from the first culture.

  - type: mcq
    id: trap-god
    title: "Trap: Brahman = God with a form?"
    prompt: |
      A student writes: "Brahman is the Hindu name of God, a being with arms and a crown." What is the best correction?
    options:
      - text: "In the Upanishads Brahman is the ultimate reality, usually spoken of by negations or as 'being, consciousness'; later Hindu worship addresses gods and goddesses with forms, which many traditions treat as ways to approach the ultimate."
        correct: true
        feedback: |
          Fair to both. How a personal God relates to Brahman is a central dispute among the schools of the next lesson.
      - text: "Brahman is the god Brahma, the creator."
        feedback: |
          Brahma is a different word: a creator god of later texts. Brahman is neuter and impersonal; the similar spelling misleads.
      - text: "Brahman is just a word for the priestly caste."
        feedback: |
          The priestly caste is called *brahmin*, related to the old ritual sense of the word. It is not the philosophical Brahman.
    explanation: |
      Three similar words, three different things: Brahman (ultimate), Brahma (a god) and brahmin (a priest). The mix-up is common in English.

  - type: mcq
    id: trap-body
    title: "Trap: 'I am Brahman' means 'I am the body'?"
    prompt: |
      Someone reads *aham brahmasmi*, "I am Brahman", and concludes: "so this person is claiming to be God, as the body and ego!" What do Advaita readers say?
    options:
      - text: "The 'I' is not the body or the ego: the five sheaths and the ego are what the 'I' is first mistaken for. The saying is about the Self behind them, so it is not a boast."
        correct: true
        feedback: |
          Right, according to Advaita. The sentence only works after the sheaths have been seen as not-self, and so it ends pride rather than creating it.
      - text: "The saying means each person's personality is the ruler of the world."
        feedback: |
          No school reads it so. Personality, ego and the sheaths are exactly what is set aside.
      - text: "The saying is a magic formula to get power."
        feedback: |
          It is a statement of knowledge, not a spell. The older ritual sense of *brahman* (power of the word) is not the use here.
    explanation: |
      Critics reply that "I am Brahman" still sounds like a claim of divinity, or that non-duality loses the difference between the finite self and the infinite. The next lesson shows how Dvaita presses this.

  - type: text
    id: readings
    title: "Same texts, more than one reading"
    body: |
      We read four sets of passages: Chandogya 6 (salt, banyan, *tat tvam asi*), Brihadaranyaka (seer of seeing, *neti neti*, *aham brahmasmi*), Mandukya (four states) and Taittiriya (five sheaths). Many Hindus, and many scholars, read them as saying that the self and the ultimate reality are one. That is the Advaita (non-dual) reading, associated with Shankara.

      But the texts are open enough that others have read them differently: Ramanuja reads Brahman as the inner self of each person and of the world, so that the sayings speak of a relation, not a strict identity; Madhva reads them as stressing a real difference between the self and God. This is only a preview: the next lesson, on Advaita, Vishishtadvaita and Dvaita, takes them one at a time.

  - type: mcq
    id: layers-q
    title: "Sorting the claims"
    prompt: |
      Take three claims: (a) "The Chandogya has Uddalaka say *tat tvam asi* at the end of nine sections." (b) "Brereton, Olivelle and Doniger read it as 'that's how you are'." (c) "The Self really is identical with the ultimate reality." Which sorting into layers is best?
    options:
      - text: "(a) is about the text, (b) is a scholarly reading under debate, and (c) is a metaphysical position that readers accept or reject."
        correct: true
        feedback: |
          Right: text, interpretation, commitment. The third needs arguments of philosophy, and the first two cannot decide it.
      - text: "All three are facts about the text."
        feedback: |
          Only (a) is. (b) is an interpretation, and (c) is a claim about reality, not about what the text says.
      - text: "All three are matters of faith."
        feedback: |
          (a) can be checked in the Sanskrit and (b) is a scholarly proposal about grammar and context, so faith is not the right category for them.
    explanation: |
      The same habit applies to every tradition in the course: keep what the texts say, what scholars debate and what a person may believe in separate columns.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** Advaita, Vishishtadvaita and Dvaita. If the sayings are open to several readings, how did the great Hindu thinkers read them, and what picture of self, world and God does each give?
