id: ch17-challenge-2
title: "Level Challenge: Many Paths, One Question (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: a clinic, a pamphlet and a closing weighing"
    body: |
      Problems 4 and 5 use **invented** people, books and numbers, built to practise on cases you have never seen. Where a real text, school or thinker appears, it is named as "according to".

      - **Problem 4 · The Gita argument from a modern dilemma.** Krishna's steps carried to a clinic, what does not carry over, and the three ways ranked by three readers.
      - **Problem 5 · A "quantum Vedanta" pamphlet.** Same words, the observer, the count of years, meditation, and then a closing weighing of the whole level in three layers.

      **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. A claim never moves up a layer by being repeated.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      Tools from the level, each stated so it can be used alone.

      - **The Gita** (*Bhagavad Gita*, "Song of the Lord") is a poem of 18 chapters inside the epic *Mahabharata*. Before a war between two branches of one family, the warrior Arjuna refuses to fight his kin and Krishna, his charioteer, answers. Verses are cited chapter.verse. According to Krishna: the self is not slain with the body (2.19-20); a warrior's own duty is righteous battle (2.31); equanimity in gain and loss (2.38); *karmany evadhikaras te*, in essence "your right is to the action alone, never to its fruits" (2.47); yoga is evenness of mind (*samatvam yoga ucyate*, 2.48) and skill in action (2.50); no one can stay without action (3.5).
      - **Three paths:** action (*karma yoga*), knowledge (*jnana yoga*), devotion (*bhakti yoga*). According to Shankara, action purifies the mind and knowledge liberates. According to Ramanuja, devotion is the direct means, action and knowledge its aids. According to Tilak, action is the central teaching.
      - **Cosmic cycles.** A *mahayuga* is $4{,}320{,}000$ years, a *kalpa* ("day of Brahma") is $1000$ mahayugas, and Brahma's night is as long as his day. The universe is about $13.787\times10^9$ years old (Planck 2018) and Earth about $4.54\times10^9$.
      - **Samkhya.** The self, *purusha*, is a witness: solitary, neutral and not an agent. According to Advaita, Brahman is the one reality.
      - **Observer.** In standard quantum mechanics an observer is any measuring interaction. Wigner proposed that consciousness causes collapse and later abandoned the idea.
      - **Meditation research.** A review of 47 trials (Goyal 2014) found moderate evidence of small benefits for anxiety, depression and pain, and no superiority over active treatments; a later paper (Van Dam 2018) warned about hype.
      - **Layers.** Fact, debate, commitment.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · The clinic"
    body: |
      **Problem 4.** Inês runs a small clinic. A funding cut forces her to close one department, and the only way to balance the books is to dismiss the staff of the laboratory, among them her cousin Tadeu, who trained her. The clinic's board has made the decision binding and she is the one who must carry it out. She feels that her role says "do it", and that harming Tadeu is wrong.

      The task: carry Krishna's argument in the Gita over to Inês where it fits, mark where it does not, and see how three readers would rank the paths.

  - type: mcq
    id: p4-map
    title: "Which step speaks to her?"
    prompt: |
      Inês decides to carry out the dismissals as fairly and carefully as she can: a proper notice period, help with references, an honest conversation with Tadeu. She does not let her wish for the board's praise or her fear of the staff's anger decide how she acts. According to the Gita, which verse is closest to this stance?
    options:
      - text: "2.47: the right is to the action alone, never to its fruits; so she gives full care to the action and does not cling to the reaction it will bring."
        correct: true
        feedback: |
          Yes. In essence the verse separates the doing, which is hers, from the results, which depend on many things she does not control. It does not tell her to stop caring about Tadeu, a point the next questions test.
      - text: "2.19-20: the self is neither the killer nor the killed, so nothing she does to Tadeu matters."
        feedback: |
          That verse is about death and the self, a metaphysical claim. Losing a job is not death, and in any case Inês's stance here is about how she acts, not about what a person is.
      - text: "3.35: it is better to do one's own duty badly than another's duty well, so she should leave the whole matter to the board."
        feedback: |
          3.35 speaks of one's own duty (*svadharma*), and here the duty of carrying out the decision is hers by role. It does not say to leave the matter to others, and it does not describe how to act while doing it.
    explanation: |
      Layers: that the Gita says this is **fact** about the text; applying it to a clinic is an **interpretation** by this lesson, and whoever reads the verse differently (some readers take it as a rule for action, others as a call to renounce the fruits altogether) is a live **debate**.

  - type: order
    id: p4-order
    title: "Krishna's steps by verse number"
    prompt: "Put Krishna's steps in the order in which the verses appear in the Gita, first to last."
    steps:
      - "2.19-20: the self is not slain when the body is slain"
      - "2.31: for a warrior, righteous battle is his own duty"
      - "2.38: act with equanimity in gain and loss, victory and defeat"
      - "2.47: your right is to the action alone, never to its fruits"
      - "2.50: yoga is skill in action"
    hint: All five are in chapter 2. Compare the verse numbers.
    explanation: |
      The order of the verses, $2.19 < 2.31 < 2.38 < 2.47 < 2.50$, also follows the order of the argument: first the self (why grief is misplaced), then duty, then how to act (calmly, without clinging), then the claim that this is a skill.

  - type: mcq
    id: p4-limit
    title: "What does not carry over?"
    prompt: |
      Inês tries to use all of Krishna's argument. Which step is **not** available to her unless she already accepts a metaphysical view (a view about what a person is that daily experience and tests cannot settle)?
    options:
      - text: "The claim that the self is not slain with the body (2.19-20), used to say that Tadeu is not really harmed."
        correct: true
        feedback: |
          Yes. The claim is about the self outlasting the body, a **commitment** (layer three). And even a believer should see that it does not answer her question: Tadeu will lose his livelihood, which is a harm whatever the self does after death.
      - text: "That a calm, even-minded way of acting may help her decide better than a panicked one."
        feedback: |
          This is a claim about psychology, and it can be tested (does a calm decision-maker do better?). It needs no metaphysics, so it is available to anyone.
      - text: "That no one can stay without acting, so declining to decide is itself a choice (3.5)."
        feedback: |
          If she does nothing the dismissals will still be carried out, by someone else, or the clinic will fail. This is a plain fact about her situation, and it needs no metaphysics.
    explanation: |
      The Gita's argument mixes steps of different layers. A modern reader can keep the steps that are about acting well and ask separately whether to accept the one about the self, and critics part ways exactly there.

  - type: mcq
    id: p4-clinging
    title: "Does non-attachment mean not caring?"
    prompt: |
      After the dismissals Inês says: "The Gita says the fruits are not my concern, so I do not need to know whether Tadeu finds work." According to the Gita, is she reading it correctly?
    options:
      - text: "No. The Gita calls yoga skill in action (2.50) and evenness of mind (2.48). It asks her not to cling to the outcome, not to stop caring about people; care for the action includes taking responsibility for how it was done."
        correct: true
        feedback: |
          Yes. The image of the lotus leaf not wetted by water (5.10) is of a person who acts without being soaked by the result, not of a person who is cold. A reader may also point out that the Gita's Krishna still tells Arjuna to act for the good of the world.
      - text: "Yes. The verse says the fruits are not hers, so no result is her business."
        feedback: |
          This reads "not to its fruits" as "no concern for results". The verse is about the **right** to the fruits and about clinging; the same chapter calls yoga skill in action, and skill is measured by how the action is done.
      - text: "Yes, because the Gita says that all actions are the same to the self, who is a mere witness."
        feedback: |
          Witness language belongs to Samkhya, where the self does not act at all. The Gita's teaching of action without attachment is aimed at someone who acts and has to act well.
    explanation: |
      A common misreading is that the Gita recommends detachment as indifference. Even readers who stress renunciation read the verse as an instruction on how to act, not an excuse to stop caring.

  - type: mcq
    id: p4-rank
    title: "Three readers, three rankings"
    prompt: |
      Three readers comment on Inês's calm and careful way of working. According to which pairing of reader and comment?
    options:
      - text: "Shankara: her calm action prepares and purifies the mind, but knowledge of the self is what liberates. Ramanuja: acting as an offering to God in devotion is what leads to God, with action and knowledge as aids. Tilak: acting well in the world is itself the main teaching of the Gita."
        correct: true
        feedback: |
          Yes: Shankara puts knowledge on top (action purifies), Ramanuja devotion, and Tilak action. Gita 5.2, which says both renunciation and the yoga of action lead to liberation and the yoga of action is better than renunciation alone, is what Tilak and others lean on.
      - text: "Shankara: acting well in the world is itself the main teaching. Ramanuja: knowledge of the self is the only liberating path. Tilak: devotion is the direct means."
        feedback: |
          The three are scrambled: this gives Tilak's view to Shankara, Shankara's to Ramanuja and Ramanuja's to Tilak.
      - text: "All three agree that action, knowledge and devotion are exactly equal, so nothing needs ranking."
        feedback: |
          The Gita names three paths, but its readers disagree on which is primary and what the others do. That disagreement is the live scholarly and religious debate.
    explanation: |
      Layers: that the Gita names three paths and that these three readers wrote commentaries are **facts**; how to weigh the paths is a **commitment** that each tradition holds on its own principle of reading. Tilak read the Gita as a call to action in the world.

  - type: mcq
    id: p4-layers
    title: "Which of these is layer three?"
    multiple: true
    prompt: |
      Select **all** the claims that rest on a faith or metaphysical commitment (layer three), not on fact or testable debate.
    options:
      - text: "The self outlasts the body, so grief over death is misplaced."
        correct: true
        feedback: |
          Yes, a metaphysical claim that no test settles.
      - text: "Krishna's words settle the question of whether the war is right."
        correct: true
        feedback: |
          Yes. It treats Krishna's authority as final, and a critic who does not accept that authority can ask whether the argument stands on its own premises.
      - text: "Verse 2.47 appears in the second chapter of the Gita."
        feedback: |
          This is a plain fact about the text, layer one.
      - text: "Acting with equanimity can improve a person's decisions under pressure."
        feedback: |
          This is a claim about human behaviour that psychology can test, so it is a live scientific question (layer two), not a commitment.
    explanation: |
      The same chapter moves from plain facts (what the verse says) to testable advice (act calmly) to commitments (the self outlasts the body, Krishna's authority). Sorting the layers shows which parts a reader can keep without accepting the rest.

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-setup
    title: "Problem 5 · The pamphlet"
    body: |
      **Problem 5.** A pamphlet, *The Quantum Self* by an invented author, Dr. Salim Arora, claims the following.

      > (a) Quantum entanglement shows that all things are one, so physics has proved Advaita. (b) The observer is needed to collapse the wavefunction, which proves, as in Samkhya, that a conscious witness is the ground of reality. (c) A kalpa lasts $4.32\times10^9$ years, which "matches" the age of the universe, so the ancient sages knew cosmology. (d) Meditation research proves the self is Brahman.

      The task: weigh each claim, then weigh the whole level.

  - type: mcq
    id: p5-one
    title: "Entanglement and oneness"
    prompt: |
      Claim (a): entanglement means that measurement results on two systems can be correlated in a way no local hidden variables can reproduce, a result confirmed in Bell-type experiments. Advaita says that the self and Brahman, the one ultimate reality, are one and that difference is appearance. Does the first support the second?
    options:
      - text: "No, not by itself. Entanglement is a statement about correlations between measured properties, tested by experiment; Advaita's oneness is a claim about what the self and the ultimate are. The shared word \"one\" hides different claims."
        correct: true
        feedback: |
          Yes. Physicists use the word for correlations that can be computed; Advaita uses it for identity of the self and Brahman. A comparison can ask what each says, but a likeness of words proves nothing.
      - text: "Yes, since both say that things which look separate are not really separate."
        feedback: |
          Entangled particles are still two systems with their own properties and positions; what is not separable is the description of their joint results. Advaita's claim concerns the self and Brahman, not particles, and it was argued from texts and reasoning long before quantum theory.
      - text: "No, because Indian philosophy is not about reality and so cannot be compared with physics."
        feedback: |
          Hindu philosophy does argue about what there is, and some questions (the self, the observer) overlap with questions in physics and philosophy of mind. The fault is in the quick match, not in comparing.
    explanation: |
      Layers: that entanglement is real and tested is **fact**; that it bears on Advaita is at most a **debate** about analogy; that Advaita is true is a **commitment**.

  - type: mcq
    id: p5-observer
    title: "The observer and the witness"
    prompt: |
      Claim (b). In standard quantum mechanics an "observer" is any measuring interaction, not necessarily a conscious mind; Wigner proposed that consciousness causes collapse and later abandoned the idea. In Samkhya the self, *purusha*, is a witness that is solitary, neutral and not an agent. Does Samkhya support the claim that a conscious observer causes collapse?
    options:
      - text: "No. Even in its own terms the Samkhya witness does not act on nature: it is neutral and not an agent, so it cannot cause anything. And the standard view of the observer does not require a mind at all."
        correct: true
        feedback: |
          Yes, a two-sided reply. The word "witness" resembles "observer", but the Samkhya witness is passive by definition, so using it to cause a physical event would contradict the school it is named for.
      - text: "Yes. A witness is the same thing as an observer, and both are conscious."
        feedback: |
          Sharing a word is not sharing a role. In the quantum case the observer is a physical interaction that records a result; in Samkhya the witness only sees, and does nothing.
      - text: "Yes, since Wigner proved that the mind causes collapse."
        feedback: |
          Wigner proposed it, in 1961, but he did not prove it, and later he gave it up after the study of decoherence showed that ordinary interaction with surroundings gives the appearance of collapse.
    explanation: |
      The better question for a careful comparison is what role each side gives to the self, and what would count as evidence. That keeps the layers apart: the physics of measurement is established, the interpretation is debated, and the nature of the self is a commitment.

  - type: numeric
    id: p5-kalpa
    title: "A kalpa against the universe"
    prompt: |
      Claim (c). One kalpa is $4.32\times10^9$ years and the universe is about $13.787\times10^9$ years old (Planck 2018). What fraction of the universe's age is one kalpa? Give the ratio as a decimal.
    answer: 0.313
    tolerance: 0.005
    answerText: '0.313'
    wrong:
      - { value: 3.19, feedback: "That is the universe's age divided by the kalpa. The question asks the kalpa as a fraction of the age, so put the kalpa on top." }
    hint: Divide $4.32$ by $13.787$.
    explanation: |
      $4.32/13.787 = 0.313$: one kalpa is about a third of the universe's age, not equal to it.

  - type: numeric
    id: p5-brahma
    title: "How many universe-ages in a life of Brahma?"
    prompt: |
      A day and a night of Brahma together last $8.64\times10^9$ years. His year has 360 days and nights, and his life is 100 years, which is $3.1104\times10^{14}$ years. How many times the age of the universe ($13.787\times10^9$ years) is this? Give the answer to the nearest hundred.
    answer: 22560
    tolerance: 100
    answerText: '22,560'
    wrong:
      - { value: 0.313, feedback: "That compares one kalpa, not the whole life. The question asks how many universe-ages fit in a life of Brahma." }
    hint: Divide $3.1104\times10^{14}$ by $13.787\times10^9$.
    explanation: |
      $3.1104\times10^{14}/1.3787\times10^{10}\approx 22{,}560$. So the tradition's numbers range over $10^6$ to $10^{14}$ years, many orders of magnitude, and the age of the universe falls inside that wide range without singling out any one of them.

  - type: mcq
    id: p5-match
    title: "Is the match meaningful?"
    prompt: |
      The pamphlet says one kalpa "matches" the age of the universe. Given the two numbers just computed, and that Earth's age is about $4.54\times10^9$ years (so $4.32/4.54\approx0.95$), what is the most careful reply?
    options:
      - text: "The kalpa is a third of the universe's age, not equal to it. It is closer to Earth's age (within about 5 percent), but picking the matching number after seeing the data is not a prediction, and the tradition offers many numbers (a mahayuga, a day, a night, a life) of which some will land near some quantity."
        correct: true
        feedback: |
          Yes. A real test would fix the number and the target beforehand, and would say why the number should be the age of the Earth, or of the universe, and not any other quantity. Ancient numerals in the cycle of ages arise from a system of counting, so a likeness to a modern value is not evidence of knowledge of it.
      - text: "The kalpa is almost equal to the universe's age, so the sages must have known cosmology."
        feedback: |
          The computed ratio is $0.31$, not $1$. And even a close match would be one number picked among several, which proves nothing about the sages' knowledge.
      - text: "Cyclic ages cannot be compared with physics at all, because physics never considers cycles."
        feedback: |
          Cyclic universes have been studied as speculative cosmologies (Tolman discussed them, noting an entropy problem for each cycle). The standard model has one history with accelerating expansion; the comparison fails on numbers and method, not because cycles are forbidden.
    explanation: |
      The tradition's cycle is a symbolic scheme of very long times, and the right comparison is of method: what would count as evidence for a cyclic cosmology, and what does measurement say. The match is a **debate** at best, and the claim that the sages knew the age of the universe is not supported.

  - type: mcq
    id: p5-meditation
    title: "What does the meditation research say?"
    prompt: |
      Claim (d). What does the research on meditation, according to the review of 47 trials (Goyal 2014) and the later paper on hype (Van Dam 2018), actually support?
    options:
      - text: "Moderate evidence of small benefits for anxiety, depression and pain, with no superiority over other active treatments; the later paper warns that results are often overstated. Nothing in it tests whether the self is Brahman."
        correct: true
        feedback: |
          Yes. A trial measures symptoms and mood, not metaphysics. Whether the self is Brahman cannot be read off a questionnaire.
      - text: "Large, proven benefits in every condition, which confirms the philosophy behind the practice."
        feedback: |
          The reviews found modest results and warned about hype. Even large benefits would show that a practice helps, not that its philosophy is true: a practice can work and its explanation be wrong.
      - text: "Nothing at all: meditation has never been studied."
        feedback: |
          It has been studied in many trials. The result is modest and uneven, which is itself the honest finding.
    explanation: |
      The pamphlet moves from a testable claim (about symptoms) to a metaphysical one (the self is Brahman) as if the first proved the second. Evidence for a practice is layer two; the identity of the self and Brahman is layer three.

  - type: mcq
    id: p5-modest
    title: "A claim the pamphlet could keep"
    prompt: |
      Which rewrite of the pamphlet's thesis would a physicist, a scholar of Indian philosophy and a Hindu practitioner each be able to call fair?
    options:
      - text: "Both traditions ask what an observer or witness is, and a careful comparison of Samkhya's witness with the observer in measurement can clarify what each says and where they differ; it does not show that either confirms the other."
        correct: true
        feedback: |
          Yes. It names the shared question, keeps each side in its own terms and does not claim a proof. A physicist can accept the account of measurement, a scholar the account of Samkhya, and a practitioner can still hold the metaphysics on faith.
      - text: "Physics has shown that Advaita is true."
        feedback: |
          No physical experiment tests Advaita's claim, and a physicist would reject the sentence as overreach.
      - text: "Indian philosophy was just primitive science, and physics has replaced it."
        feedback: |
          This is unfair to the other side: much of Indian philosophy is about the self, knowledge and liberation, questions that physics does not answer.
    explanation: |
      A fair comparison says what is similar, what is different and what remains a matter of commitment. That is the method of the whole level.

  # ---------------- Closing weighing ----------------
  - type: mcq
    id: c-layers
    title: "Which layer is each claim in?"
    prompt: |
      The *Brihadaranyaka Upanishad* is dated to about the 7th to 6th century BCE by one scholar, Patrick Olivelle, with a caution that such dates are uncertain. Karma and rebirth say that the self with the traces of its actions passes from body to body. Advaita says that the self and Brahman are one. Which assignment of layers is right?
    options:
      - text: "The date is fact or scholarly debate (a range, with caution); the view that karma and rebirth operate is a metaphysical commitment, though the logic of its objections and replies can be studied; Advaita's identity of self and Brahman is a metaphysical commitment."
        correct: true
        feedback: |
          Yes. A date range is argued from manuscripts and language, with real disagreement; the two doctrines are about hidden causes and the nature of the self, which no experiment decides.
      - text: "All three are established facts, since every Hindu school teaches them."
        feedback: |
          A claim does not become fact by being widely held. Many schools reject Advaita: Ramanuja and Madhva read the same texts differently.
      - text: "All three are debates that new data will settle in time."
        feedback: |
          Dating is a debate that evidence can narrow. The two doctrines are about what exists beyond the reach of tests, and what would count as evidence is itself the disagreement.
    explanation: |
      Sorting by layer tells the reader what kind of answer each question can have: a date can be refined, a doctrine can be examined for coherence, and a metaphysical identity can be held or not held on a principle of reading and on commitment.

  - type: order
    id: c-order
    title: "Order the Level 17 voices"
    prompt: "Put these in order of date, earliest first (usual datings, where scholars give ranges)."
    steps:
      - "The Rigveda, composed c. 1500-1000 BCE"
      - "The Brihadaranyaka Upanishad, c. 7th-6th century BCE (Olivelle)"
      - "Shankara, c. 700-750 CE"
      - "Ramanuja, c. 1077-1157"
      - "Madhva, 1238-1317"
      - "Tilak's Gita Rahasya, published 1915"
    hint: From the oldest hymns to a modern commentary.
    explanation: |
      From Madhva to Tilak is about $1915-1238=677$ years of commentary on the same Gita, and from the Rigveda to Madhva is over two and a half thousand years. The level covers a very long, continuing conversation, not a single period.

  - type: mcq
    id: c-parting
    title: "Where do thoughtful people part ways?"
    prompt: |
      A Hindu practitioner, a scholar of religion and a physicist read the level together and disagree about the one question: whether the self is Brahman. What is the most accurate statement of where they part?
    options:
      - text: "They part over premises and values, not over dates: whether the Upanishads' testimony is a trustworthy guide, whether consciousness is basic or arises from matter, and what counts as evidence for what cannot be measured."
        correct: true
        feedback: |
          Yes. The dates and texts can be shared; the part where they split is a metaphysical commitment and the kind of evidence each is willing to accept.
      - text: "They part because one of them has not read the texts carefully."
        feedback: |
          Careful readers of the same texts reach different conclusions, as Shankara, Ramanuja and Madhva did with the same passages.
      - text: "They part only on the dates of the texts."
        feedback: |
          Dates are open to evidence and are mostly debated within ranges. The disagreement the level is about is not a matter of dates.
    explanation: |
      The level never decides whether the self is Brahman. It gives the questions: what does the text say, according to whom, in which layer, and what would count as evidence.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      The setting: two invented cases (a clinic and a pamphlet), worked with the tools of the level. Every claim is made *according to* someone and sits in one of three layers.

      - **The Gita applied.** Krishna's argument has steps of different layers. Equanimity and skill in action (2.48, 2.50) can be kept as a way of acting well without clinging; the claim that the self outlasts the body (2.19-20) is a metaphysical commitment. Non-attachment is not indifference. Three readers rank the paths differently: Shankara, knowledge liberates and action purifies; Ramanuja, devotion is the direct means; Tilak, action is the central teaching.
      - **Same word, different claim.** Entanglement is a tested statement about correlations; Advaita's oneness is a claim about the self and Brahman. The Samkhya witness is passive, so it cannot cause collapse; in standard quantum mechanics the observer is a measuring interaction.
      - **Numbers checked.** One kalpa is $4.32\times10^9$ years and the universe is $13.787\times10^9$ years old:
      $$\frac{4.32}{13.787}\approx 0.313$$
      and Brahma's life of $3.1104\times10^{14}$ years is about $22{,}560$ universe-ages. A match picked after the fact among many numbers is not a prediction.
      - **Meditation research.** Moderate evidence of small benefits for anxiety, depression and pain; nothing on whether the self is Brahman.
      - **Layers.** Fact (what the text says), debate (how to read it, dates, parallels), commitment (the self, Brahman, Krishna's authority). A claim never moves up by being repeated.

      Level 17 gave no verdict on whether Hindu thought is true. It gave the questions: what does this text say, who says so, which layer, and what would count as evidence.

      **Next:** the Level Review replays this level's questions at spaced intervals. Then the next level, Buddhist Thought, begins with the Buddha's diagnosis of suffering and the Four Truths.
