id: ch17-darshanas
title: "Samkhya, Yoga, Nyaya"
kind: concept
own: |
  The setting: the six classical schools of Indian philosophy (*darshanas*, "viewpoints") that accept the authority of the Veda. Three of them are described here as their followers hold them, with the objections kept visible.
  - **Samkhya** (traditionally founded by the sage Kapila; classical text the *Samkhya Karika*, about 72 verses, c. 350 CE). Reality has two kinds of thing: {{ *purusha*, many conscious witnesses, and *prakriti*, one unconscious nature made of the three *gunas* (sattva, rajas, tamas), which includes mind and ego }}. Counting purusha, unmanifest prakriti and its 23 manifest products gives 25 principles:
    $$1+1+1+11+5+5=24$$
    (unmanifest prakriti, intellect, ego, 11 powers of mind and senses, 5 subtle elements, 5 gross elements), plus purusha. Liberation (*kaivalya*) comes from {{ discriminating purusha from prakriti }}. The objection: how can two unlike things interact? The reply is the lame man (sees) carried by the blind man (walks), which critics such as Shankara find insufficient.
  - **Yoga** (the *Yoga Sutras*, attributed to Patanjali; most scholars place the text c. 1st to 2nd century CE, some earlier). Yoga is defined in sutra 1.2 as
    $$\text{yoga} = \textit{citta-vritti-nirodha}$$
    that is, {{ the stilling of the movements (*vrittis*) of the mind (*citta*) }}. It has eight limbs in this order: {{ yama, niyama, asana, pranayama, pratyahara, dharana, dhyana, samadhi }}. Posture is one limb of eight, not the whole.
  - **Nyaya** (the *Nyaya Sutras*, ascribed to Gautama or Akshapada, dated variously from the 2nd century BCE to about 200 CE). It accepts four sources of knowledge (*pramanas*): {{ perception, inference, analogy and testimony }}. An inference (*anumana*) is stated in five members: thesis, reason, example, application, conclusion. For the hill: there is fire on the hill; because there is smoke on it; wherever there is smoke there is fire, as in a hearth; this hill is smoky; therefore there is fire on the hill.
  - **Fallacies** (*hetvabhasa*, "apparent reasons"). Nyaya lists five kinds of bad reason: deviation, contradiction, unestablished, counterbalanced and rebutted. Example: taking mist for smoke makes the reason unestablished.
  - **Three layers.** The texts, schools and their scholarly dates are history; the effects of meditation programs on stress are studied, with moderate evidence for anxiety, depression and pain and no verdict on the deeper claims; that purusha exists or that liberation is possible is a {{ metaphysical commitment }}.

cards:
  - type: mcq
    id: hook
    title: "Guess: how do you know there is fire?"
    prompt: |
      Guessing is the point; no background is needed. You see a column of smoke rising from behind a hill. You cannot see the fire, yet you are sure there is one. Someone asks: "What gives you the right to be sure?" Which answer is the most careful account of what you are relying on?
    options:
      - text: "A remembered pattern: wherever I have seen smoke I have found fire, as in a kitchen hearth, and so I infer fire here."
        correct: true
        feedback: |
          Right. You use something seen (smoke) and a general link remembered from other cases (smoke goes with fire) to reach something not seen. This is the idea of inference, and the school you will meet last in this lesson built a whole logic on it.
      - text: "Nothing at all: I am only guessing, and any claim about the unseen is equally good."
        feedback: |
          If that were so, a fire alarm would be no better than silence. Most thinkers, in India and elsewhere, hold that some routes to the unseen are much better than others, and ask what makes them so.
      - text: "I must go and see the fire myself; anything else is not knowledge."
        feedback: |
          That is a strict view (only direct observation counts), and some thinkers did hold something like it. But it would make most of what you know, from history to the inside of the Earth, unknowable. Another route is needed, and the question is which.
    explanation: |
      Every school in this lesson starts from the same question: what are the sources of knowledge, and what is there to know? The Sanskrit word for a source of knowledge is *pramana*. Here the answer for fire is inference; the Nyaya school, at the end of the lesson, names four.

  - type: text
    id: darshana
    title: "Six viewpoints"
    body: |
      The Sanskrit word ***darshana*** means "viewing" or "viewpoint": a way of seeing the world and a system for arguing about it. In the lesson What Is Hinduism? we met the *astika* ("orthodox") schools, those that accept the authority of the Veda. The usual list of six is Nyaya, Vaisheshika, Samkhya, Yoga, Purva Mimamsa and Vedanta. The last, Vedanta, was the subject of the previous two lessons.

      The list is a later, conventional grouping. The schools were rivals who argued for centuries, and they are often arranged in pairs because they share a base: Nyaya with Vaisheshika, Samkhya with Yoga, Mimamsa with Vedanta. This lesson takes three: Samkhya, Yoga and Nyaya. Notice that being orthodox does not require believing in a creator God, as the first of them shows.

  - type: text
    id: samkhya
    title: "Samkhya: two kinds of thing"
    body: |
      ***Samkhya*** ("enumeration", from its habit of counting the principles of reality) is among the oldest of the schools. Tradition names the sage Kapila, and his pupil Asuri, as its first teachers, but they are known mostly through legend. Its classical text is the *Samkhya Karika* of Ishvarakrishna, 72 verses, usually dated to about 350 CE.

      According to Samkhya, reality has exactly two kinds of thing, both eternal and neither made by the other. **Purusha** ("person") is a conscious witness: it sees, but does not act or change. There are many purushas, one for each individual, since births, experiences and histories differ and experience is private. **Prakriti** ("nature") is one and unconscious. It is made of three strands, the **gunas**: *sattva* (lightness, clarity), *rajas* (energy, change) and *tamas* (heaviness, inertness). When they are in balance, nothing shows; when the balance is upset, the world unfolds.

      The surprise is where Samkhya draws the line. Everything that thinks, wills or feels as part of mental life, the intellect, the sense of "I", the thinking faculty, belongs to prakriti. Only the bare witnessing is purusha.

  - type: mcq
    id: samkhya-q
    title: "Why is nature not conscious?"
    prompt: |
      According to Samkhya, prakriti (nature) is unconscious, even though it includes the intellect and the sense of "I". One of the arguments its defenders give for a separate conscious purusha is that complex structures, such as a living body, seem to serve a purpose beyond themselves. Which statement best expresses that argument?
    options:
      - text: "A complex structure made of unconscious strands works for something other than itself, as a bed is arranged for a sleeper; that something must be a conscious witness."
        correct: true
        feedback: |
          Right. The argument is that a structure arranged to be used needs a user, and the user cannot be one more part of the same unconscious structure. Critics ask why a complex structure must be *for* anyone (a snowflake is intricate and for no one), which is the weak point of this argument.
      - text: "Prakriti is made of three gunas, so it must be conscious in three ways."
        feedback: |
          The gunas are strands of matter and mind-stuff (clarity, energy, inertness), not three kinds of awareness. In Samkhya even the clearest, sattva, is unconscious.
      - text: "There is one purusha only, because consciousness is one."
        feedback: |
          Samkhya says the reverse: purushas are many, since individuals have different births, histories and private experiences. A single universal consciousness is the view of Advaita Vedanta, in the earlier lessons.
    explanation: |
      Layer check: the claim that Samkhya argues this way is textual history. That structures need a conscious witness is a metaphysical commitment, and the snowflake reply is the standard critic's answer.

  - type: order
    id: evolution
    title: "How the world unfolds"
    prompt: |
      According to the classical Samkhya account (as set out in the *Samkhya Karika*), the world evolves from prakriti in stages. Put the stages in the order in which each arises from the one before.
    steps:
      - "Unmanifest prakriti, the three gunas in balance"
      - "Intellect (*buddhi*, also called *mahat*)"
      - "The sense of \"I\" (*ahamkara*)"
      - "The thinking faculty, five senses, five action powers, and the five subtle elements"
      - "The five gross elements (earth, water, fire, air, space)"
    hint: |
      Go from the most inward to the most outward: first the clearest, mind-like stuff, last the coarse matter we touch.
    explanation: |
      The order runs from subtle to gross: first the gunas out of balance give intellect, which gives the sense of "I", which gives the faculties of mind and senses together with the subtle elements, and from the subtle elements come the gross elements of the material world. Sources differ on small details of the middle stages, but the direction, from mind-like to matter-like, is the same in all of them.

  - type: numeric
    id: tattva-count
    title: "Counting the principles"
    prompt: |
      Samkhya counts the manifest products of prakriti as follows: intellect (1), the sense of "I" (1), the thinking faculty with five senses and five action powers (11 powers in all), the five subtle elements (5) and the five gross elements (5). How many manifest products is that?
    answer: 23
    wrong:
      - value: 25
        feedback: |
          25 is the full count of Samkhya principles, but it includes purusha and unmanifest prakriti. The question asks only for the manifest products.
      - value: 24
        feedback: |
          24 counts unmanifest prakriti together with its manifest products. The manifest ones alone are one fewer.
    hint: "Add 1 + 1 + 11 + 5 + 5."
    explanation: |
      $1 + 1 + 11 + 5 + 5 = 23$: intellect, the sense of "I", the eleven powers, the five subtle and the five gross elements. Add unmanifest prakriti and you get 24 principles of nature; add purusha and you get the school's 25.

  - type: text
    id: descartes
    title: "Dualism, but not Descartes's"
    body: |
      In the lesson Two Kinds of Stuff: Dualism, René Descartes (1596-1650) divided the world into extended matter and thinking mind. Samkhya is also a dualism, and it is tempting to treat the two as the same view in different clothes. They are not.

      For Descartes, the mind is the thing that thinks, doubts and wills, and it is on one side; matter is on the other. For Samkhya, thinking, doubting, memory and the sense of "I" are all processes of prakriti, material in the wide sense that includes mind-stuff. What is on the other side is only a pure witness that does nothing at all. So Samkhya shares with materialists the view that mental life is part of nature, and shares with dualists the view that something else, awareness itself, is not.

  - type: mcq
    id: descartes-q
    title: "Where does the thinking sit?"
    prompt: |
      Descartes puts thinking, doubting and willing in the mind, which is a separate substance from matter. Where does the Samkhya school put the intellect and the sense of "I"?
    options:
      - text: "In prakriti (nature): they are subtle products of an unconscious nature; only the witnessing purusha is conscious."
        correct: true
        feedback: |
          Right. This is what makes Samkhya's dualism different: the boundary runs between *witness* and *everything witnessed*, including mental events, and not between mind and body.
      - text: "In purusha, as in Descartes: the thinker is the conscious self."
        feedback: |
          That reads Samkhya as Descartes. For Samkhya, purusha does not think, plan or remember; it only witnesses. Those are done by the intellect, which belongs to prakriti.
      - text: "In neither: Samkhya holds that thinking is an illusion."
        feedback: |
          Samkhya does not say thinking is an illusion. It says thinking is real but belongs to nature, and is wrongly taken to be the self.
    explanation: |
      A fair comparison: both views are dualist, but they cut at different places. Descartes cuts mind from body; Samkhya cuts witness from all content, mental and bodily.

  - type: text
    id: liberation
    title: "Liberation, and an objection"
    body: |
      Why bother with all this counting? Because Samkhya is a path to freedom. According to the school, suffering arises because purusha mistakes itself for the body, the mind or the "I", which are all prakriti. Liberation, ***kaivalya*** ("isolation"), comes from seeing the difference: "this is not me, this is not mine, I am not this." When that discrimination is complete, nature, having shown the world to the witness, stops acting for it.

      An old objection asks how the two can meet at all. If purusha is conscious but does nothing, and prakriti acts but is unconscious, how can one affect the other? The *Karika* (verse 21) answers with a picture: a lame man who can see but not walk is carried by a blind man who can walk but not see, and together they get somewhere. Critics, among them Shankara, replied that a blind man is a conscious agent and a lump of unconscious matter is not, so the picture does not show how unconscious nature can act for a purpose without some guide.

  - type: mcq
    id: liberation-q
    title: "Does the picture solve it?"
    prompt: |
      Samkhya says purusha (sees, does not act) and prakriti (acts, does not see) cooperate, as a lame man rides a blind man. Which reading of this picture is the fairest?
    options:
      - text: "It shows that a joint outcome can come from two partners with complementary gaps, but a critic can ask who arranged the partnership, because the blind man is conscious and prakriti is not."
        correct: true
        feedback: |
          Right. Samkhya defenders say mere nearness is enough to set nature moving, as a magnet moves iron. Critics reply that this leaves the purposeful order unexplained; Shankara's objection was that an unconscious nature needs a conscious guide, which Samkhya denies and Yoga (below) allows in a special form.
      - text: "It proves that conscious and unconscious things can interact, so the objection is settled."
        feedback: |
          A picture is an analogy, not a proof. It shows what Samkhya has in mind, but it contains a difference (the blind man is conscious) that the critic uses.
      - text: "It shows that Samkhya admits a creator God who carries the world."
        feedback: |
          The usual accounts present classical Samkhya as non-theistic. The two partners in the picture are purusha and prakriti, not a God and a world.
    explanation: |
      This card is about how to read an analogy: say what it explains, then ask which of its parts does not carry over. Two live responses exist: accept the mystery as a basic fact (Samkhya's defenders), or add a guide (the Yoga school's special purusha, Ishvara, and the theists in Vedanta).

  - type: text
    id: yoga
    image:
      src: img/yogasutras-manuscript.webp
      alt: "A page of an old Sanskrit manuscript of the Yoga Sutras, written in lines of script."
      caption: "A manuscript copy of the Yoga Sutras, kept in a national collection in India; the surviving copies are far younger than the text, whose date scholars place between the 1st and 5th centuries CE or earlier."
      credit: "Patanjali (original author), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Patanjali_Yoga_Sutras_manuscript.jpg"
    title: "Yoga: a method"
    body: |
      ***Yoga*** means "yoking" or "discipline". Many kinds of yoga practice exist in India; the philosophical school of Yoga is based on the *Yoga Sutras*, traditionally attributed to a sage called Patanjali. The attribution is first documented in a much later commentary, and the text itself is hard to date: most scholars say around the 1st to 2nd century CE, and none later than the 5th, though some place it earlier. Treat the name as the tradition's name for the author.

      Yoga shares Samkhya's picture of purusha and prakriti and the three gunas, and adds a method. Sutra 1.2 defines the aim: *yogas citta-vritti-nirodhah*, in essence "yoga is the stilling of the movements (*vrittis*) of the mind (*citta*)". If suffering comes from mistaking the movements of the mind for the self, calm the movements until the witness stands alone. The Yoga school also allows a special purusha, ***Ishvara***, untouched by karma, and devotion to it is one of the practices and one route to the goal.

  - type: order
    id: limbs
    title: "Eight limbs"
    prompt: |
      The Yoga Sutras set out a path of eight limbs (*ashtanga*, "eight-limbed"). Put the limbs in their classical order.
    steps:
      - "Yama: restraints in how one acts toward others (such as non-harming and truthfulness)"
      - "Niyama: observances for oneself (such as cleanliness, contentment, study, devotion)"
      - "Asana: steady posture for sitting"
      - "Pranayama: regulation of the breath"
      - "Pratyahara: withdrawing the senses from their objects"
      - "Dharana: holding attention on one point"
      - "Dhyana: unbroken meditation"
      - "Samadhi: absorption"
    hint: |
      The path goes from outer conduct, to the body, to the senses, to the mind.
    explanation: |
      The order moves inward: how to live with others, how to live with oneself, the body, the breath, the senses, then attention itself, and at the end absorption. Whether each limb is a prior stage or a part practised together is a question the commentators discuss.

  - type: mcq
    id: limbs-q
    title: "Is yoga a posture?"
    prompt: |
      A gym advertises "yoga classes", where students hold and change body postures. Compared with the eight-limbed path of the Yoga Sutras, which statement is most accurate?
    options:
      - text: "Postures are one limb (asana) of eight; the Sutras give it little space and treat it as preparation for sitting still, among conduct, breath, attention and meditation."
        correct: true
        feedback: |
          Right. In the Sutras posture is a steady, comfortable seat for meditation. The one sutra on posture (2.46) asks, in essence, for a seat both steady and comfortable. According to the historian Mark Singleton (*Yoga Body*, 2010), popular postural yoga took shape largely in the early 20th century, though others, such as James Mallinson, find medieval roots for many postures; either way "yoga = exercise" describes one modern form, not the school.
      - text: "Yoga is just exercise, and the Sutras are about fitness."
        feedback: |
          The Sutras barely discuss exercise. Their subject is the mind and the end of suffering, and even physical practice there serves that aim.
      - text: "Posture is the first limb and the most important."
        feedback: |
          Posture is the third limb, after conduct (yama) and observances (niyama). Whether any single limb is the most important is up to the commentators, but the text puts conduct first.
    explanation: |
      Yoga also is not Hindu only. Practices of meditation and mental discipline appear in Hindu, Buddhist and Jain traditions, and scholars dispute which borrowed from which. The word *dhyana* ("meditation") is shared across all three, with somewhat different meanings.

  - type: mcq
    id: layers
    title: "Claim, study or commitment?"
    prompt: |
      Three statements about yoga and meditation are listed below. Label each with its layer. A: "The Yoga Sutras define yoga as the stilling of the movements of the mind." B: "A large review of randomized trials of meditation programs found moderate evidence of small improvements in anxiety, depression and pain." C: "When the mind is fully still, purusha stands alone and the self is liberated." Which assignment is right?
    options:
      - text: "A is a fact about a text; B is a scientific finding with limits; C is a metaphysical or religious commitment."
        correct: true
        feedback: |
          Right. A can be checked by reading the Sutras. B is an empirical result (Goyal and colleagues, *JAMA Internal Medicine*, 2014, 47 trials): the same review found no sign that meditation beat other active treatments such as exercise or drugs, and low evidence on attention, mood and sleep. C rests on a view of the self that no trial can test.
      - text: "All three are established science, since yoga is popular."
        feedback: |
          Popularity is not evidence. Only B is a scientific result, and even it reports small to moderate effects.
      - text: "All three are only opinions, since nothing about yoga can be tested."
        feedback: |
          A claim about what a text says can be checked, and the effects of a program on stress can be tested by trials. What cannot be tested is the claim about liberation.
    explanation: |
      Keep the three layers apart. The studies show that some meditation programs help with some symptoms. They do not say whether purusha exists, and the tradition's claims about liberation do not depend on them.

  - type: text
    id: nyaya
    title: "Nyaya: the logic of knowing"
    body: |
      ***Nyaya*** ("reasoning", also "rule") is the school of argument and knowledge. Its basic text is the *Nyaya Sutras*, ascribed to a sage called Gautama (also known as Akshapada). Dates are uncertain: Britannica gives about the 2nd century BCE, the Internet Encyclopedia of Philosophy about 200 CE, and some scholars place the earliest layer earlier; the text was probably expanded over time.

      Nyaya asks what the sources of knowledge (*pramanas*) are, and gives four: **perception** (seeing, hearing, touching), **inference** (reaching the unseen from a sign), **analogy** (learning what a word means by being shown a likeness: "a wild ox is like a cow") and **testimony** (the word of a reliable speaker). A knowledge claim, says Nyaya, is something one can examine by these. The school is also realist: it holds that the world is real and can truly be known, and some of its later thinkers gave arguments for the existence of a God as maker of the world.

  - type: order
    id: syllogism
    title: "The five members of an inference"
    prompt: |
      Nyaya states an inference for someone else in five members. Put these in the standard order for the hill, smoke and fire.
    steps:
      - "There is fire on the hill. (thesis)"
      - "Because there is smoke on it. (reason)"
      - "Wherever there is smoke there is fire, as in a kitchen hearth, and unlike a lake. (example)"
      - "This hill is smoky in that way. (application)"
      - "Therefore there is fire on the hill. (conclusion)"
    hint: |
      First say what you want to show, then why, then the general rule with a case you can check, then apply it, then conclude.
    explanation: |
      The thesis is the claim; the reason names the sign (smoke); the example gives the general rule *with a concrete case* (the hearth, and a negative case, the lake); the application says this hill matches; the conclusion restates the claim as proved. The traditional names are *pratijna*, *hetu*, *udaharana*, *upanaya*, *nigamana*.

  - type: mcq
    id: aristotle
    title: "Is it Aristotle's syllogism?"
    prompt: |
      Aristotle's syllogism has a major premise, a minor premise and a conclusion: "All men are mortal; Socrates is a man; so Socrates is mortal." Compared with it, what is fair to say of the Nyaya five-member inference?
    options:
      - text: "It uses the same three terms (hill, smoke, fire) but has five statements, and its third member insists on a concrete example, so the general rule is tied to observed cases."
        correct: true
        feedback: |
          Right. Britannica notes that the characteristic feature of the Nyaya form is its insistence on the example, which suggests the logicians wanted both formal validity and material truth. Scholars have also debated whether two of the five statements are redundant, and whether one tradition influenced the other; the question is open.
      - text: "It is Aristotle's syllogism translated into Sanskrit."
        feedback: |
          The two share a three-term structure, but the Nyaya form has five members, includes an example with a negative case, and belongs to a theory of knowledge. Whether there was any influence is a debate among historians.
      - text: "It is not logic at all, only a way of persuading an audience."
        feedback: |
          The five-member form is meant for stating an inference to others, but it comes with a careful analysis of what makes a reason good. That analysis is logic, as the next card shows.
    explanation: |
      Calling Nyaya "India's Aristotle" or "not really logic" both lose something. A better comparison keeps both: a shared three-term skeleton, and a different emphasis on examples and observed links between sign and signified.

  - type: text
    id: hetvabhasa
    title: "When a reason fails"
    body: |
      Nyaya also asks what can go wrong. A **hetvabhasa** ("apparent reason") is a reason that looks like a good sign but is not. The Nyaya tradition lists five kinds: *deviation* (the reason goes with the target sometimes, and also with its absence), *contradiction* (the reason actually supports the opposite), *unestablished* (the reason is not really true of the subject), *counterbalanced* (an equally strong reason points the other way) and *rebutted* (a stronger source of knowledge, such as direct perception, shows the conclusion false).

      This turns the study of argument into a checklist for examining your own reasons, not only other people's.

  - type: mcq
    id: hetvabhasa-q
    title: "Which fault?"
    prompt: |
      A traveller sees a pale column on a hill and argues: "The hill has fire, because there is smoke on it." A local replies: "That is mist rising from the valley; it is not smoke." Which of the five Nyaya faults has the local pointed to?
    options:
      - text: "Unestablished: the reason (smoke) is not actually present on the hill."
        correct: true
        feedback: |
          Right. If the column is mist, the premise "there is smoke on this hill" is false. The rule "smoke goes with fire" is fine; the problem is that the sign was never there.
      - text: "Contradiction: smoke proves the opposite of fire."
        feedback: |
          A contradictory reason supports the opposite conclusion. Mist, if anything, would suggest no fire, but the local's point is that the sign was misread, not that smoke refutes fire.
      - text: "Rebutted: a stronger source shows that the hill has no fire."
        feedback: |
          Rebuttal needs a stronger source of knowledge about the conclusion itself, such as a person who has just walked the hill and seen no fire. The local only says the reason is misdescribed.
    explanation: |
      Trap: do not confuse a false premise about the case (unestablished) with a false general rule (deviation). Here the general rule stands and the particular fact fails.

  - type: mcq
    id: traps
    title: "Three tempting slips"
    multiple: true
    prompt: |
      Select every statement that is a mistake.
    options:
      - text: "Samkhya is an atheistic school, so it cannot count as orthodox."
        correct: true
        feedback: |
          A mistake. Orthodox (*astika*) means accepting the authority of the Veda, not believing in a God. Samkhya counts as orthodox and gives no role to a creator.
      - text: "Yoga is Hindu only, since the word comes from Sanskrit."
        correct: true
        feedback: |
          A mistake. The school of Yoga is one of the six Hindu darshanas, but meditation and disciplines of the mind appear in Buddhism and Jainism too, and which borrowed from which is disputed among scholars. The word is shared; so are many of the practices.
      - text: "The Nyaya five-member inference is the same as Aristotle's syllogism."
        correct: true
        feedback: |
          A mistake. The two share a three-term skeleton, but Nyaya has five members, requires a concrete example and sits inside a theory of knowledge.
      - text: "In Samkhya, the intellect belongs to prakriti, not to purusha."
        feedback: |
          This statement is accurate, so it is not a mistake. It is the feature that separates Samkhya's dualism from Descartes's.
    explanation: |
      Three of these four mistakes come from fitting an Indian view to a Western template: orthodox as believing, yoga as exercise or one religion, syllogism as Aristotle.

  - type: mcq
    id: part-ways
    title: "Where thoughtful people part"
    prompt: |
      Three people discuss Samkhya's claim that consciousness is a separate, non-material witness, unlike the intellect and emotions. A physicalist says it is mistaken; a dualist says it is half right; a Vedanta follower says it is incomplete because the witness is one. What is the key difference in what they assume?
    options:
      - text: "Whether consciousness can be explained as part of nature (physicalist), is a separate witness (dualist and Samkhya) or is the one Self underlying everything (Advaita)."
        correct: true
        feedback: |
          Right. These are three starting premises about what consciousness is and how many there are. Which one is more plausible depends on what one takes to count as evidence, a matter on which the three do not simply differ by facts.
      - text: "Only the facts: new experiments will soon show which person is right."
        feedback: |
          Some questions here are empirical (what meditation does to stress), but the central one (is awareness a separate kind of thing?) is about interpretation. Evidence matters, though it does not decide by itself.
      - text: "Whether the speaker is religious or not."
        feedback: |
          The three positions cut across belief: Samkhya is non-theistic; there are religious and non-religious physicalists, dualists and monists.
    explanation: |
      The course does not choose among these. Each is a coherent answer to a hard question, each has a standard objection, and the lesson Two Kinds of Stuff: Dualism and the levels on mind return to them.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the Bhagavad Gita, a short poem inside the great epic, takes the question these schools leave open: if liberation is the goal and action binds, what should a person do when duty calls? It is the argument of Krishna to the warrior Arjuna, and we read it as ethical reasoning.
