outroTitle: Hindu Thought in one picture
outro: |
  The name Hindu is borrowed, and the traditions it covers share practice and texts more than a creed. The Vedas move from ritual to the Upanishads, which turn inward to the knower, to sayings such as *tat tvam asi*, and to the self within its sheaths. Three Vedanta schools read the same texts as non-dual, qualified non-dual and dual, and share the frame of karma, samsara and moksha, while Samkhya, Yoga and Nyaya offer other ways to ask what the self is and how to know. The Gita turns the question into action without clinging, along three paths. Physics and these traditions ask different questions, so a fair comparison needs the same claim and not the same word. What stays open is the third layer: what the texts say is history, how to weigh parallels and meditation is debated, and what is ultimately real is a commitment.
