id: ch17-map
title: "Content Map: Hindu Thought"
kind: map
name: Level 17, Hindu Thought (the name and the streams, the Vedas and their layers, the saying tat tvam asi, the sheaths of the self, the three Vedanta schools, karma samsara and moksha, Samkhya and Yoga, Nyaya, the Gita, the dialogue with physics, the three layers)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Hindu Thought one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (two terms swapped, a school or a scholar mixed up, a number moved, a layer mislabelled), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: overview
    title: The name and the streams
    row: 1
    col: 1
    body: |
      *Hindu* comes from the Sanskrit *Sindhu*, the **Indus river**, through Old Persian and Greek: it was first a place name. The word *Hinduism* entered English in the early **nineteenth century**. According to historians and adherents alike there is **no one founder, creed or central authority**. The four main streams are Vaishnavism (Vishnu), Shaivism (Shiva), Shaktism (the Goddess) and the Smarta tradition, and they are **overlapping streams, not rival churches**.
    decoys:
      - body: |
          *Hindu* comes from the Sanskrit *Sindhu*, the **Indus river**, through Old Persian and Greek: it was first a place name. The word *Hinduism* entered English in the early **nineteenth century**. According to historians and adherents alike there is **one founder, one creed and a central authority**. The four main streams are Vaishnavism (Vishnu), Shaivism (Shiva), Shaktism (the Goddess) and the Smarta tradition, and they are **overlapping streams, not rival churches**.
        feedback: |
          There is no single founder, creed or authority for all of it; many teachers and lineages (sampradaya) exist and none founded the whole.
      - body: |
          *Hindu* comes from the Sanskrit *Sindhu*, the **Indus river**, through Old Persian and Greek: it was first a place name. The word *Hinduism* entered English in the early **nineteenth century**. According to historians and adherents alike there is **no one founder, creed or central authority**. The four main streams are Vaishnavism (Vishnu), Shaivism (Shiva), Shaktism (the Goddess) and the Smarta tradition, and they are **four separate churches, so one person belongs to only one**.
        feedback: |
          The streams overlap: one person may honour Vishnu and Shiva, and the Smarta tradition worships several deities together.
    explanation: |
      The ground floor: a borrowed name for a family of traditions held together by shared practice and texts more than by one creed.

  - id: vedas
    title: The Vedas and their layers
    row: 1
    col: 2
    body: |
      The four Vedas are the *Rigveda*, *Samaveda*, *Yajurveda* and *Atharvaveda*. Each has layers, in the usual pattern: **Samhita, Brahmana, Aranyaka, Upanishad**. The Rigveda has **1,028 hymns** in ten books, composed according to most scholars about 1500 to 1000 BCE. *Shruti* ("what is heard") is the Vedas and Upanishads; *smriti* ("what is remembered") includes the epics and the Puranas. For Mimamsa the Veda is **not of human authorship**; historians say poet-priests composed it over centuries.
    decoys:
      - body: |
          The four Vedas are the *Rigveda*, *Samaveda*, *Yajurveda* and *Atharvaveda*. Each has layers, in the usual pattern: **Upanishad, Aranyaka, Brahmana, Samhita**. The Rigveda has **1,028 hymns** in ten books, composed according to most scholars about 1500 to 1000 BCE. *Shruti* ("what is heard") is the Vedas and Upanishads; *smriti* ("what is remembered") includes the epics and the Puranas. For Mimamsa the Veda is **not of human authorship**; historians say poet-priests composed it over centuries.
        feedback: |
          The order is reversed. The usual pattern runs from the hymns and formulas (Samhita), through the ritual prose (Brahmana) and the forest texts (Aranyaka), to the Upanishads, the last layer.
      - body: |
          The four Vedas are the *Rigveda*, *Samaveda*, *Yajurveda* and *Atharvaveda*. Each has layers, in the usual pattern: **Samhita, Brahmana, Aranyaka, Upanishad**. The Rigveda has **1,028 hymns** in ten books, composed according to most scholars about 1500 to 1000 BCE. *Smriti* ("what is heard") is the Vedas and Upanishads; *shruti* ("what is remembered") includes the epics and the Puranas. For Mimamsa the Veda is **composed by poet-priests**; historians say it is **eternal**.
        feedback: |
          Two slips. Shruti is "what is heard" (the Vedas and Upanishads) and smriti "what is remembered" (epics, Puranas). And the views are swapped: Mimamsa holds the Veda apaurusheya, not of human authorship; historians date its composition by poets.
    explanation: |
      The texts the other boxes read: ritual first, with the inquiry into the self as the last layer of the same Veda.

  - id: brahman
    title: Tat tvam asi and the knower
    row: 1
    col: 3
    body: |
      In the *Chandogya Upanishad* Uddalaka teaches his son **Shvetaketu** with salt in water and a banyan seed, ending with *tat tvam asi*, traditionally "that you are". Brereton, Olivelle and Doniger prefer **"that's how you are"**. In the *Brihadaranyaka* Yajnavalkya says **you cannot see the seer of seeing** and describes the Self by *neti neti*, "not this, not this". The *Mandukya* lists waking, dream, deep sleep and a fourth state, ***turiya***, the non-dual background of the other three.
    decoys:
      - body: |
          In the *Chandogya Upanishad* Yajnavalkya teaches his wife **Maitreyi** with salt in water and a banyan seed, ending with *tat tvam asi*, traditionally "that you are". Brereton, Olivelle and Doniger prefer **"that's how you are"**. In the *Brihadaranyaka* Yajnavalkya says **you cannot see the seer of seeing** and describes the Self by *neti neti*, "not this, not this". The *Mandukya* lists waking, dream, deep sleep and a fourth state, ***turiya***, the non-dual background of the other three.
        feedback: |
          The teacher of the salt and the banyan seed is Uddalaka, and the student is his son Shvetaketu. Yajnavalkya and Maitreyi appear in the Brihadaranyaka.
      - body: |
          In the *Chandogya Upanishad* Uddalaka teaches his son **Shvetaketu** with salt in water and a banyan seed, ending with *tat tvam asi*, traditionally "that you are". Brereton, Olivelle and Doniger prefer **"that's how you are"**. In the *Brihadaranyaka* Yajnavalkya says **the seer can be seen like any object** and describes the Self by *neti neti*, "not this, not this". The *Mandukya* lists waking, dream, deep sleep and a fourth state, ***turiya***, **one more state alongside the other three**.
        feedback: |
          Two slips. The knower is not one more thing seen: you cannot see the seer of seeing. And turiya is described by negations as the non-dual background of the other three states, not as a fourth item beside them.
    explanation: |
      The turn inward: the self is not an object among objects, and the saying about it can be read as identity or as shared nature.

  - id: self
    title: Atman, Brahman and the sheaths
    row: 2
    col: 3
    body: |
      *Atman* is the Self, the inner "I"; it is better translated **"Self" than "soul"**, because memory, character and feeling belong to the embodied person. *Brahman* began as the power of sacred speech in the ritual and in the Upanishads names the **impersonal ultimate**. The *Taittiriya Upanishad* lists five sheaths from outer to inner: **food, breath, mind, understanding, bliss**, with the Self within them all.
    decoys:
      - body: |
          *Atman* is the Self, the inner "I"; it is better translated **"soul" than "Self"**, because memory, character and feeling belong to *atman*. *Brahman* began as the power of sacred speech in the ritual and in the Upanishads names the **impersonal ultimate**. The *Taittiriya Upanishad* lists five sheaths from outer to inner: **food, breath, mind, understanding, bliss**, with the Self within them all.
        feedback: |
          Memory, character and feeling belong to the embodied person, not to atman, which is why "Self" is the better translation than "soul".
      - body: |
          *Atman* is the Self, the inner "I"; it is better translated **"Self" than "soul"**, because memory, character and feeling belong to the embodied person. *Brahman* began as the power of sacred speech in the ritual and in the Upanishads names a **god with a body**. The *Taittiriya Upanishad* lists five sheaths from outer to inner: **bliss, understanding, mind, breath, food**, with the Self within them all.
        feedback: |
          Two slips. In these texts Brahman is an impersonal ultimate, not a being with a body. And the sheaths run from outer to inner: food, breath, mind, understanding, bliss.
    explanation: |
      Who the "I" is: the layers of a person from the body inward, and the Self within, which the next box reads in three different ways.

  - id: schools
    title: Three Vedanta schools
    row: 2
    col: 2
    body: |
      **Advaita** (Shankara, c. 700-750 CE): only Brahman is ultimately real and the self is Brahman; the world of many things is *maya*. **Vishishtadvaita** (Ramanuja): one Brahman as Vishnu, with souls and matter **real, as his body**. **Dvaita** (Madhva): difference is real and permanent in **five ways**, and he reads the saying as *atat tvam asi*, "you are **not** that". The dispute is about how to harmonize the texts, a **metaphysical commitment**, not a fact an experiment settles.
    decoys:
      - body: |
          **Advaita** (Ramanuja): only Brahman is ultimately real and the self is Brahman; the world of many things is *maya*. **Vishishtadvaita** (Shankara, c. 700-750 CE): one Brahman as Vishnu, with souls and matter **real, as his body**. **Dvaita** (Madhva): difference is real and permanent in **five ways**, and he reads the saying as *atat tvam asi*, "you are **not** that". The dispute is about how to harmonize the texts, a **metaphysical commitment**, not a fact an experiment settles.
        feedback: |
          The founders are swapped. Shankara is the Advaita teacher (c. 700-750 CE) and Ramanuja (c. 1077-1157) the Vishishtadvaita one.
      - body: |
          **Advaita** (Shankara, c. 700-750 CE): only Brahman is ultimately real and the self is Brahman; the world of many things is *maya*. **Vishishtadvaita** (Ramanuja): one Brahman as Vishnu, with souls and matter **unreal, a mere appearance**. **Dvaita** (Madhva): difference is real and permanent in **three ways**, and he reads the saying as *tat tvam asi*, "you are **that**". The dispute is about how to harmonize the texts, **a fact a careful experiment can settle**.
        feedback: |
          Three slips. For Ramanuja souls and matter are real, as the body of Brahman. Madhva counts five kinds of difference and reads atat tvam asi, "you are not that". And the dispute is metaphysical, not experimental.
    explanation: |
      One text, three metaphysics: the schools differ on what is real and on how the Upanishads fit together.

  - id: karma
    title: Karma, samsara, moksha
    row: 3
    col: 2
    body: |
      *Karma* ("action"): in the Upanishads one becomes good by good action; actions leave lasting results, but it is **not fate**, since present choices start new results. *Samsara* ("wandering") is the **cycle of birth, death and rebirth**; the Gita compares it to changing worn clothes. *Moksha* ("release") is, for Advaita, **knowing the self is Brahman**; for Ramanuja, eternal nearness to Vishnu, still itself. To "no memory carries over", the reply is that the **result, not the memory**, carries over. Shankara answers the first-birth objection: samsara is **beginningless**.
    decoys:
      - body: |
          *Karma* ("action"): in the Upanishads one becomes good by good action; actions leave lasting results, and it is **fate**, since present choices cannot change what comes. *Samsara* ("wandering") is the **cycle of birth, death and rebirth**; the Gita compares it to changing worn clothes. *Moksha* ("release") is, for Advaita, **knowing the self is Brahman**; for Ramanuja, eternal nearness to Vishnu, still itself. To "no memory carries over", the reply is that the **result, not the memory**, carries over. Shankara answers the first-birth objection: samsara is **beginningless**.
        feedback: |
          Karma is not fate. The share already ripening shapes this life, but present choices start new results.
      - body: |
          *Karma* ("action"): in the Upanishads one becomes good by good action; actions leave lasting results, but it is **not fate**, since present choices start new results. *Samsara* ("wandering") is the **cycle of birth, death and rebirth**; the Gita compares it to changing worn clothes. *Moksha* ("release") is, for Advaita, **eternal nearness to Vishnu**; for Ramanuja, **knowing the self is Brahman**. To "no memory carries over", the reply is that the **memory** carries over. Shankara answers the first-birth objection: samsara has a **first birth caused by a god**.
        feedback: |
          The schools are swapped: Advaita's moksha is knowing the self is Brahman, Ramanuja's the soul's eternal nearness to Vishnu. The reply on memory is that the result, not the memory, carries over, and Shankara called samsara beginningless, like seed and sprout.
    explanation: |
      The logic of action and rebirth, with the objections and replies kept visible, and a goal (moksha) that each school defines differently.

  - id: samkhya
    title: Samkhya and Yoga
    row: 2
    col: 1
    body: |
      **Samkhya** holds two kinds of thing: *purusha*, **many conscious witnesses**, and *prakriti*, **one unconscious nature** made of three *gunas* (sattva, rajas, tamas), giving **25 principles** in all. Liberation (*kaivalya*) comes from **discriminating purusha from prakriti**. **Yoga** (the *Yoga Sutras*, Patanjali) defines yoga as *citta-vritti-nirodha*, the **stilling of the movements of the mind**, in **eight limbs**, of which posture (*asana*) is the third.
    decoys:
      - body: |
          **Samkhya** holds two kinds of thing: *purusha*, **one unconscious nature**, and *prakriti*, **many conscious witnesses** made of three *gunas* (sattva, rajas, tamas), giving **25 principles** in all. Liberation (*kaivalya*) comes from **discriminating purusha from prakriti**. **Yoga** (the *Yoga Sutras*, Patanjali) defines yoga as *citta-vritti-nirodha*, the **stilling of the movements of the mind**, in **eight limbs**, of which posture (*asana*) is the third.
        feedback: |
          The two are swapped. Purusha is the conscious witness (many of them) and prakriti the one unconscious nature, which includes mind and ego.
      - body: |
          **Samkhya** holds two kinds of thing: *purusha*, **many conscious witnesses**, and *prakriti*, **one unconscious nature** made of three *gunas* (sattva, rajas, tamas), giving **25 principles** in all. Liberation (*kaivalya*) comes from **doing the right ritual**. **Yoga** (the *Yoga Sutras*, Patanjali) defines yoga as *citta-vritti-nirodha*, the **stilling of the movements of the mind**, in **one limb: posture**.
        feedback: |
          Two slips. Kaivalya comes from discriminating purusha from prakriti. And yoga has eight limbs (yama, niyama, asana, pranayama, pratyahara, dharana, dhyana, samadhi); posture is one of them, not the whole.
    explanation: |
      A dualist cosmology with a method attached: knowing the difference between witness and nature, and training the mind toward it.

  - id: nyaya
    title: Nyaya and its inference
    row: 3
    col: 1
    body: |
      *Nyaya* (the *Nyaya Sutras*, ascribed to Gautama or Akshapada) accepts **four** sources of knowledge, the *pramanas*: **perception, inference, analogy and testimony**. An inference has **five members**: thesis, reason, example, application, conclusion. For the hill: "there is fire on the hill; because there is smoke on it; wherever there is smoke there is fire, as in a hearth; this hill is smoky; therefore there is fire on the hill." Taking **mist for smoke** makes the reason *unestablished*, one of five *hetvabhasa* (apparent reasons).
    decoys:
      - body: |
          *Nyaya* (the *Nyaya Sutras*, ascribed to Gautama or Akshapada) accepts **two** sources of knowledge, the *pramanas*: **perception and inference**. An inference has **five members**: thesis, reason, example, application, conclusion. For the hill: "there is fire on the hill; because there is smoke on it; wherever there is smoke there is fire, as in a hearth; this hill is smoky; therefore there is fire on the hill." Taking **mist for smoke** makes the reason *unestablished*, one of five *hetvabhasa* (apparent reasons).
        feedback: |
          Nyaya accepts four pramanas, adding analogy and testimony to perception and inference.
      - body: |
          *Nyaya* (the *Nyaya Sutras*, ascribed to Gautama or Akshapada) accepts **four** sources of knowledge, the *pramanas*: **perception, inference, analogy and testimony**. An inference has **five members**: **conclusion, example, thesis, application, reason**. For the hill: "there is fire on the hill; because there is smoke on it; wherever there is smoke there is fire, as in a hearth; this hill is smoky; therefore there is fire on the hill." Taking **mist for smoke** makes the reason *contradictory*, one of **three** *hetvabhasa*.
        feedback: |
          Two slips. The members run thesis, reason, example, application, conclusion. And mist taken for smoke makes the reason unestablished, one of five kinds of apparent reason.
    explanation: |
      Indian logic: a public, five-step way to state an inference so that a bad reason can be named and rejected.

  - id: gita
    title: The Gita's three paths
    row: 3
    col: 3
    body: |
      The *Bhagavad Gita* has **18 chapters** and about 700 verses, inside the *Mahabharata*. Krishna tells Arjuna *karmany evadhikaras te*, in essence "your right is to the action alone, never to its fruits", and defines yoga as ***samatvam***, evenness of mind (2.48). Nobody can stay without action even for a moment (3.5), so the question is **how to act, not whether**. It teaches **karma, jnana and bhakti yoga**; in 5.2 the yoga of action is **better than renunciation of action alone**.
    decoys:
      - body: |
          The *Bhagavad Gita* has **18 chapters** and about 700 verses, inside the *Mahabharata*. Krishna tells Arjuna *karmany evadhikaras te*, in essence "your right is to the **fruits alone, never to the action**", and defines yoga as ***samatvam***, evenness of mind (2.48). Nobody can stay without action even for a moment (3.5), so the question is **how to act, not whether**. It teaches **karma, jnana and bhakti yoga**; in 5.2 the yoga of action is **better than renunciation of action alone**.
        feedback: |
          The line is reversed: the right is to the action, never to its fruits. The Gita does not ask for indifference to results but for acting without clinging to them.
      - body: |
          The *Bhagavad Gita* has **18 chapters** and about 700 verses, inside the *Mahabharata*. Krishna tells Arjuna *karmany evadhikaras te*, in essence "your right is to the action alone, never to its fruits", and defines yoga as ***samatvam***, evenness of mind (2.48). Nobody can stay without action even for a moment (3.5), so the question is **whether to act at all**. It teaches **karma, jnana and bhakti yoga**; in 5.2 **renunciation of action is better than the yoga of action**.
        feedback: |
          Two slips. Since nobody can stop acting, the question is how to act. And in 5.2 Krishna says both lead to liberation, but the yoga of action is better than renunciation of action alone.
    explanation: |
      An ethical argument on a battlefield: act, care for the action, release the grip on the result, along three paths that readers rank differently.

  - id: dialogue
    title: Dialogue with physics
    row: 4
    col: 2
    body: |
      Comparing needs the **same claim, not the same word**: *Brahman* is the one reality described as consciousness, while an electron is a quantum of the electron field. In quantum mechanics an "observer" is **any measuring interaction**, not a conscious mind. One *kalpa* is $1000\times4{,}320{,}000=4.32\times10^{9}$ years, close to **Earth's age**, not the universe's (about $13.8\times10^9$ years). *Maya* is **neither wholly real nor wholly unreal**, not "matter does not exist". Capra and Zukav drew parallels; Gell-Mann answered that matching words is not matching claims.
    decoys:
      - body: |
          Comparing needs the **same word, not the same claim**: *Brahman* is the one reality described as consciousness, while an electron is a quantum of the electron field. In quantum mechanics an "observer" is **a conscious mind**. One *kalpa* is $1000\times4{,}320{,}000=4.32\times10^{9}$ years, close to **Earth's age**, not the universe's (about $13.8\times10^9$ years). *Maya* is **neither wholly real nor wholly unreal**, not "matter does not exist". Capra and Zukav drew parallels; Gell-Mann answered that matching words is not matching claims.
        feedback: |
          A fair comparison needs the same claim, not a shared word. And in standard quantum mechanics an observer is any measuring interaction; the consciousness-causes-collapse view was proposed by Wigner, who later abandoned it.
      - body: |
          Comparing needs the **same claim, not the same word**: *Brahman* is the one reality described as consciousness, while an electron is a quantum of the electron field. In quantum mechanics an "observer" is **any measuring interaction**, not a conscious mind. One *kalpa* is $1000\times4{,}320{,}000=4.32\times10^{9}$ years, close to **the universe's age** (about $13.8\times10^9$ years). *Maya* means **matter does not exist**. Capra and Zukav drew parallels; Gell-Mann answered that matching words is not matching claims.
        feedback: |
          Two slips. A kalpa is about $4.32\times10^9$ years, close to Earth's age (about $4.54\times10^9$), not the universe's. And maya is not the claim that matter does not exist; it names a plural world said to be neither wholly real nor wholly unreal.
    explanation: |
      Two ways of thinking that ask different questions: resemblance of language proves nothing, and meditation research is a separate, testable matter.

  - id: layers
    title: The three layers
    row: 4
    col: 3
    body: |
      Taught according to someone, every claim of the level sits in one layer. **Established fact**: what the texts say, who read them how, and how they are dated. **Live debate**: how far parallels with physics illuminate, and what meditation does (**moderate evidence of small benefits** for anxiety, depression and pain). **Commitment**: whether rebirth occurs, whether *purusha* exists, whether **consciousness is the ground of reality**, and whether Krishna's authority settles the war.
    decoys:
      - body: |
          Taught according to someone, every claim of the level sits in one layer. **Established fact**: what the texts say, who read them how, and **whether rebirth occurs**. **Live debate**: how far parallels with physics illuminate, and what meditation does (**moderate evidence of small benefits** for anxiety, depression and pain). **Commitment**: whether *purusha* exists, whether **consciousness is the ground of reality**, and whether Krishna's authority settles the war.
        feedback: |
          Whether rebirth occurs is a faith or metaphysical commitment. The texts and their dates are history; the child-memory studies are live debate.
      - body: |
          Taught according to someone, every claim of the level sits in one layer. **Established fact**: what the texts say, who read them how, and how they are dated. **Live debate**: how far parallels with physics illuminate, and what meditation does (**proven cure for deep metaphysical claims**). **Commitment**: whether rebirth occurs, whether *purusha* exists, and whether **consciousness is the ground of reality**.
        feedback: |
          Meditation research shows moderate evidence of small benefits for anxiety, depression and pain, and says nothing on the deep metaphysical claims.
    explanation: |
      What stays open: the evidence is argued, and whether the self is Brahman or consciousness the ground of reality is a commitment.

