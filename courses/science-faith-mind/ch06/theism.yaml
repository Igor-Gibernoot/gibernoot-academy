id: ch06-theism
title: "What Is Being Argued For?"
kind: concept
own: |
  The setting: an *argument for God* is a list of statements (premises) offered to support one more statement (the conclusion) that some God-claim is true. Before judging such an argument one must say which God-claim is the conclusion.
  - **Theism, deism, pantheism, panentheism.** *Theism* holds that there is a God who is a person (an agent who knows and chooses), creator and sustainer of the universe, and who acts in it. According to Richard Swinburne (born 1934), in essence, God is a person without a body. *Deism* holds that God created the universe but does not act in it afterwards. *Pantheism* holds that {{ God is identical with the cosmos (Spinoza: "God or Nature") }}; *panentheism* holds that the cosmos is a part of God, and God is more than the cosmos.
  - **The great-making attributes.** Many theists hold that God is unsurpassable in power, knowledge and goodness. For knowledge, with $p$ any proposition and $S$ a being, *omniscience* is standardly defined by
  {{ $$\text{for every } p:\ \text{if } p \text{ is true, then } S \text{ knows } p$$ }}
  and *omnipotence* means maximal power (it is usually understood as power over what is possible, not over contradictions). *Omnibenevolence* means perfect goodness. Whether these fit together (the stone paradox, foreknowledge and free will) is a separate debate.
  - **Classical theism and theistic personalism.** According to the Stanford Encyclopedia, classical theists keep the "Greek perfections" (simplicity, immutability, impassibility) even at the cost of weakening God's personhood; theistic personalists weaken those perfections to keep God a real person.
  - **Atheism and agnosticism.** In the broad sense, atheism is {{ lacking the belief that God exists }}; in the narrow sense that philosophers usually use, it is {{ the proposition that God does not exist }}. Agnosticism (a word coined by T. H. Huxley) says that neither theism nor atheism is known. Who has the *burden of proof* is itself disputed (Flew 1972 defended a presumption of atheism).
  - **What an argument can reach.** A "ladder" of conclusions runs from "something is a cause or ground of the universe", through "it is necessary, powerful, a mind", to "it is a loving person" and finally to the God of one religion. Each rung needs its own support; reaching a low rung does not give the higher ones.
  - **Validity and soundness.** An argument is *valid* when its form makes it impossible for the premises to be true and the conclusion false; it is *sound* when it is valid and all its premises are true:
  {{ $$\text{sound} = \text{valid} + \text{all premises true}$$ }}
  A critic can reject a premise or the validity, and an unsound argument does not show its conclusion false. With premises $P_1,P_2,P_3$ each true with probability $0.9$, independent, the chance that all three hold is $0.9^3 \approx 0.73$.
  - **Three layers.** *Established fact*: what the sciences measure. *Live debate*: whether a premise is true, which attributes follow. *Faith or metaphysical commitment*: the final belief. People part ways on which premise to accept, not on the logic.
cards:
  - type: mcq
    id: hook
    title: "Guess: what would a flawless argument give you?"
    prompt: |
      Guess before any theory. Suppose a flawless argument proved, beyond doubt, that **the universe has a cause that lies outside it and does not itself need a cause**. Which further conclusion would then follow **from that proof alone**?
    options:
      - text: 'None of the further ones listed: it would not by itself show that the cause is one being, a person, loving, or the God of any particular religion.'
        correct: true
        feedback: |
          Right. A proof reaches exactly as far as its conclusion. "There is an uncaused cause" says nothing yet about whether it thinks, cares, or has spoken to anyone. The lesson names the gaps one by one.
      - text: 'The cause is a loving, all-knowing person who answers prayers.'
        feedback: |
          Tempting, because that is how many believers describe the cause. But "loving", "all-knowing" and "answers prayers" are new claims. Each would need its own premises; the proof of a cause says nothing about them.
      - text: 'The cause is the God of the religion the reader grew up in.'
        feedback: |
          A proof of a cause fits equally with many descriptions of that cause, religious and not. Which religion (if any) describes it is not decided by the proof.
      - text: 'The cause must be the universe itself, so atheism follows.'
        feedback: |
          Neither direction follows. The proof says the cause is outside the universe; it does not say whether that cause is a mind or a mindless ground. Some philosophers would call a mindless ground "God", others would not.
    explanation: |
      Guessing is the point of the opening card. The lesson makes one thing precise: **what exactly is the conclusion of an argument for God?** The next lessons weigh the arguments themselves; this one fixes what they are arguments *for*.

  - type: text
    id: aim
    title: "Why fix the target first"
    body: |
      An **argument** is a list of statements, the **premises**, offered to support one more statement, the **conclusion**. To judge an argument for God we must first know the conclusion. The word "God" is used for very different things, and an argument may support one of them and miss the others.

      This lesson is even-handed on purpose. It does not argue for or against God. It asks four questions in order: *what do the main positions say*, *which attributes do they give God*, *how far can an argument reach*, and *what makes an argument good or bad*.

      Throughout, every view is stated "according to" those who hold it, and we label each claim as **established fact**, **live debate** or **faith or metaphysical commitment**.

  - type: text
    id: theism
    title: "Theism"
    body: |
      **Theism** is the view that there is a God who is a **person** (an agent who knows, wills and acts), who is the **creator** of the universe and its **sustainer** (keeps it in existence), and who acts in it. According to the philosopher of religion Richard Swinburne (born 1934), in essence, God is a person without a body, that is, a spirit; he adds that this being is eternal, free, powerful, knowing and perfectly good, creator and sustainer of the universe, and worthy of worship.

      Theism, in different forms, is held by many believers. This lesson is about the *concept*; the traditions come in later levels.

  - type: text
    id: attributes
    title: "The great-making attributes"
    body: |
      Many theists hold that God is **unsurpassable** in three ways, according to the Stanford Encyclopedia's account of perfect being theology (power, knowledge, goodness):

      - **Omnipotence** ("all power"): maximal power.
      - **Omniscience** ("all knowledge"): for any proposition $p$ and a being $S$,

      $$\text{for every } p:\ \text{if } p \text{ is true, then } S \text{ knows } p$$

      - **Omnibenevolence** ("all goodness"): perfect goodness.

      These words are **claims about what God is like**. An argument that reaches a first cause has not yet said any of them.

  - type: mcq
    id: omnipotence
    title: "What does 'all-powerful' mean?"
    prompt: |
      A student asks: "If God is omnipotent, can God make a square circle, or make a stone so heavy that God cannot lift it?" According to Aquinas (c. 1225-1274) and Maimonides, as the Stanford Encyclopedia reports, what is the traditional reply to the square-circle part?
    options:
      - text: 'A square circle is not a task at all: it names an impossible state of affairs, and power is about what can be brought about, so failing at it does not limit God.'
        correct: true
        feedback: |
          Yes. Aquinas and Maimonides (the Stanford Encyclopedia cites Summa Theologiae Ia, 25, 3 and the Guide for the Perplexed, Part I, ch. 15) reject the notion of power over impossible states of affairs as incoherent. Descartes, by contrast, seems to have held such a notion, so this is a live disagreement.
      - text: 'Yes, God can, because omnipotence means being able to do literally anything, contradictions included.'
        feedback: |
          That is the "absolute" reading, which the Stanford Encyclopedia associates with Descartes. Aquinas and Maimonides held it to be incoherent. Both readings exist, so this answer is a real position, but it is not the traditional reply asked about.
      - text: 'No, and this shows that no being can be omnipotent, so theism is refuted.'
        feedback: |
          This jumps too far. The "no" only shows what the words must be taken to mean. Philosophers have defined omnipotence so that it survives (the standard modern definition: no possible being has more power).
    explanation: |
      The point is not to settle the puzzle but to see that **each attribute is a technical notion with its own debates**. The stone paradox asks whether an omnipotent being can make a stone it cannot move: either answer seems to limit its power. The comparative definition (its overall power could not possibly be exceeded) is one way out. An argument for God that reaches "omnipotent" needs a premise about which notion is meant.

  - type: mcq
    id: omniscience
    title: "Knowing everything, including tomorrow"
    prompt: |
      Omniscience is standardly defined: for every proposition $p$, if $p$ is true then the being knows $p$. Take $p$ = "Maria will choose tea tomorrow", and suppose $p$ is true. What tension do philosophers see, and what is one reply?
    options:
      - text: 'If God already knows $p$, Maria''s choice seems fixed in advance, so she seems not free. Open theists reply that God does not know future free choices, to keep the future open.'
        correct: true
        feedback: |
          Yes. This is the problem of divine foreknowledge and free will, and open theism is one reply (it changes the notion of omniscience); others keep omniscience and argue that foreknowledge does not remove freedom.
      - text: 'There is no tension: if $p$ is true, then $p$ is false.'
        feedback: |
          That confuses the statement with its opposite. The tension is about whether *knowing in advance* leaves room for a free choice.
      - text: 'It shows that God must be wrong sometimes, since people change their minds.'
        feedback: |
          Knowledge is of what is true, so "Maria will choose tea" is only known if she does choose tea. The puzzle concerns freedom, not error.
    explanation: |
      Again the lesson's point: "omniscient" is not one simple word. Different theists give it different shapes, and an argument that reaches a "knowing" first cause must say which shape it reaches.

  - type: text
    id: relation
    title: "God and the world: transcendent, immanent, creator, sustainer"
    body: |
      Besides attributes, positions differ on **how God relates to the world**.

      - **Transcendent**: God goes beyond the world and is not just a part of it (in Britannica's sense, transcendence is surpassing a boundary).
      - **Immanent**: God is present within the world (remaining within a limit). Many theists say God is **both**: the Britannica account adds that the two are not mutually exclusive.
      - **Creator**: brings the universe into being, perhaps from nothing (*ex nihilo*, Latin for "out of nothing").
      - **Sustainer**: keeps the universe in existence at every moment, not only at a start.

      A **deist** has a creator without a sustainer who acts afterwards, as the next card says. A **pantheist** denies that God goes beyond the world at all.

  - type: text
    id: deism
    title: "Deism"
    body: |
      **Deism** is the view that God created the universe but does not act in it afterwards: no miracles, no answering of prayers, no revelation. A common image is a watchmaker who builds a clock and lets it run (an image only, not a quotation).

      Many textbooks use "deism" for belief in a first cause that made the world but gives no providential oversight (a point made, for example, by Graham Oppy). Deism flourished in the 17th and 18th centuries, a period of new science, when the world looked like a mechanism.

      Notice that a **first-cause argument supports deism exactly as well as theism**. It cannot choose between them. Choosing needs further evidence, such as an alleged revelation or miracle, which is the work of later levels.

  - type: mcq
    id: sort-deism
    title: "Sort the claim"
    prompt: |
      Anna says: "A creator made the universe and fixed its laws. Prayers and miracles do not happen, because the creator never acts in the world afterwards." Which position does her view describe best?
    options:
      - text: 'Deism'
        correct: true
      - text: 'Classical theism'
        feedback: |
          Classical theism has the creator also sustain the world and act in it. Anna denies any later action, so her view is thinner than theism.
      - text: 'Pantheism'
        feedback: |
          Pantheism says God is the cosmos itself. Anna's creator is distinct from the universe, so it is not pantheism.
      - text: 'Atheism'
        feedback: |
          Anna affirms a creator. In either sense of atheism (lacking belief, or denying God) she is not an atheist.
    explanation: |
      Deism is the position where a creator exists but is silent afterwards. It shows why "does God exist?" is not one question: Anna says yes to a creator and no to a God who acts.

  - type: text
    id: pantheism
    title: "Pantheism and panentheism"
    body: |
      **Pantheism** is, in the Stanford Encyclopedia's words, the view that God is identical with the cosmos; negatively, it rejects any view that treats God as distinct from the universe. The term is possibly first found in the Irish freethinker John Toland (1705). The best-known pantheist is the Dutch philosopher Baruch Spinoza (1632-1677), whose *Ethics* (1677) identifies God with the one substance, often summarised by the Latin phrase *Deus sive Natura*, "God or Nature". Commentators dispute whether to call his view pantheism; some prefer other labels, and one scholar argues that "atheist" fits better.

      **Panentheism** (from Greek: "all in God") holds that the world is a *proper part* of God: God includes the universe but is not exhausted by it. The German philosopher Karl Christian Friedrich Krause (1781-1832) called his own system panentheism, an attempt to reconcile pantheism and theism.

      $$\begin{gathered}\text{pantheism: God} = \text{cosmos}\\ \text{panentheism: cosmos} \subsetneq \text{God}\end{gathered}$$

      Here $\subsetneq$ reads "is a proper part of": inside, but not everything.

  - type: mcq
    id: sort-pan
    title: "Pantheism or panentheism?"
    prompt: |
      Two people speak. Ben: "God is everything there is; the universe is God, and there is nothing else." Carla: "The universe lies inside God, but God is more than the universe." Which labels fit, in the order Ben, Carla?
    options:
      - text: 'Ben is a pantheist; Carla is a panentheist.'
        correct: true
      - text: 'Ben is a panentheist; Carla is a pantheist.'
        feedback: |
          Reversed. Panentheism has God *larger* than the cosmos, which is Carla; pantheism has them identical, which is Ben.
      - text: 'Both are pantheists, because both put God in the universe.'
        feedback: |
          Carla says the opposite: the universe is in God and God exceeds it. That "more than" is exactly what pantheism lacks.
      - text: 'Both are theists, because both use the word "God".'
        feedback: |
          Using the word is not enough. Theism, as defined above, needs a God who is a person, a creator, distinct from the world and acting in it. Ben's view lacks the distinction; Carla's keeps God "more than" the world, and whether it is a person depends on the version.
    explanation: |
      Two small words, "identical" and "proper part", separate the views. The same care will matter later: whether an argument supports pantheism, panentheism or theism depends on exactly what its conclusion says about the relation between God and the world.

  - type: text
    id: classical
    title: "Classical theism and theistic personalism"
    body: |
      Even among theists there is a deep split about how God is a person. According to the Stanford Encyclopedia:

      - **Classical theists** keep the "Greek perfections" such as *impassibility* (God is not affected by outside things), *immutability* (God does not change) and *simplicity* (God has no parts), and, to protect them, they deny or weaken the idea that God is a person like us.
      - **Theistic personalists** (a kind of "neoclassical" theist) reverse the trade: they weaken those perfections to keep God a real person who can respond to creatures. Open theists are an example.

      Neither is "the" theist view. Both are theisms. An argument for God that reaches "a necessary, simple, unchanging ground" supports the classical picture more directly than the personal one, and a critic can fairly say it has not yet reached a person.

  - type: mcq
    id: classical-q
    title: "Which feature separates them?"
    prompt: |
      Dana says: "The God of my tradition responds to prayer, so God must be able to be affected by what creatures do." Erik says: "God cannot change or be affected by anything, because that would make God depend on creatures." On the classification above, which pairing is correct?
    options:
      - text: 'Dana leans theistic personalist; Erik leans classical theist (impassibility and immutability).'
        correct: true
      - text: 'Dana leans classical theist; Erik leans theistic personalist.'
        feedback: |
          Reversed. Keeping God unaffected and unchanging is the classical perfections; letting God respond is the personalist trade.
      - text: 'Dana is a deist; Erik is a pantheist.'
        feedback: |
          Dana's God answers prayers, which a deist denies, and Erik's God is not identified with the cosmos. Both speak of a God distinct from the world, so both are theists.
      - text: 'Dana and Erik cannot both be theists, since they disagree.'
        feedback: |
          They disagree about God's nature, not about whether God exists as a creator. Disagreement inside a position is normal: it is why "theism" is not a single doctrine.
    explanation: |
      Each side has a reason: Dana protects God's personal relation with creatures, Erik protects God's independence and perfection. The disagreement is itself part of why an argument must say *which* God its conclusion describes.

  - type: text
    id: atheism
    title: "Atheism, agnosticism and the burden of proof"
    body: |
      Now the other side. The Stanford Encyclopedia notes two senses of **atheism**:

      - the **broad** (psychological) sense: *lacking the belief that God exists*;
      - the **narrow** sense, standard in philosophy: *the proposition that God does not exist*.

      The broad sense is consistent with **agnosticism**, which the same entry defines as the position that neither theism nor atheism is known. The word "agnostic" is credited to the biologist T. H. Huxley in the late nineteenth century.

      Who has the **burden of proof** (the duty to give reasons first) is itself debated. Antony Flew defended a "presumption of atheism" in a 1972 article. Theists reply that belief in God can be reasonable without proof, or that the question is not symmetrical. The Stanford Encyclopedia warns that such discussions are often sidetracked by bad analogies, and argues that atheism is the correct default only if theism has a sufficiently low initial probability.

  - type: mcq
    id: atheism-q
    title: "Lack of belief or denial?"
    prompt: |
      Fiona has never been convinced by any argument for God, but she also says: "I do not claim to know that God does not exist." Using the two senses of atheism above, which description is correct?
    options:
      - text: 'She is an atheist in the broad sense (she lacks the belief) and an agnostic; she is not an atheist in the narrow sense (she does not assert that God does not exist).'
        correct: true
      - text: 'She cannot be both: the two words exclude each other.'
        feedback: |
          They exclude each other only if "atheist" is taken in the narrow sense. In the broad sense, lacking belief is consistent with agnosticism.
      - text: 'She is a theist, because she has not denied God.'
        feedback: |
          Not denying is not believing. A theist believes there is a God, and Fiona does not.
      - text: 'She is an atheist in the narrow sense, because she is unconvinced.'
        feedback: |
          Being unconvinced is lacking belief, the broad sense. The narrow sense asserts that God does not exist, which she explicitly does not claim.
    explanation: |
      The two senses are a common source of talking past each other. Always ask: "do you mean *I lack the belief* or *I hold that God does not exist*?" The second needs its own reasons, just as theism does.

  - type: text
    id: god-philosophers
    title: "The God of the philosophers, and of a religion"
    image:
      src: img/pascal.webp
      alt: "Painted portrait of Blaise Pascal in a dark robe and white collar"
      caption: "Blaise Pascal (1623-1662), mathematician and writer, whose note of 23 November 1654 contrasts the God of Abraham, Isaac and Jacob with the God of the philosophers and scholars."
      credit: "unknown; copy of a painting by François II Quesnel, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Blaise_Pascal_Versailles.JPG"
    body: |
      The arguments in this level aim at what is often called "the God of the philosophers": a first cause, a necessary being, a designer, a source of moral order, described by reason alone. The phrase is associated with Blaise Pascal (1623-1662), whose *Memorial*, a note recording a religious experience on the night of 23 November 1654, was found sewn into his coat after his death. In essence, it speaks of the God of Abraham, Isaac and Jacob, and not of the philosophers and the learned (English renderings of the French vary).

      Two readings of the contrast are possible. One: the God met in religious life is more than a conclusion of reasoning. Another: a being supported only by abstract arguments is a long way from any actual religion. Both agree on the gap. **An argument for the God of the philosophers is not, by itself, an argument for Judaism, Christianity, Islam or any other religion.**

  - type: order
    id: ladder
    title: "A ladder of conclusions"
    prompt: |
      Put these conclusions in order, from the **weakest** (the easiest for an argument to reach) to the **strongest** (the one needing the most extra support).
    steps:
      - 'There is some cause or ground for the existence of the universe.'
      - 'That ground is necessary: it could not have failed to exist.'
      - 'It is a mind: it knows and chooses.'
      - 'It is perfectly good and loves its creatures.'
      - 'It has spoken to humans through the sacred book of one particular religion.'
    hint: 'Each rung adds a new claim to the one before it. The last one adds history and a text.'
    explanation: |
      Each rung needs its own premises. Reaching rung 1 does not give rung 2; reaching rung 3 does not give rung 4 (the problem of evil, treated later in the course, presses exactly there); reaching rung 4 does not give rung 5. This is why the course treats each classical argument as a *step on a ladder*, not as proof of a whole religion.

  - type: mcq
    id: ladder-q
    title: "How far does it reach?"
    prompt: |
      A debater says: "The argument from design (that the order of the universe points to a designer), if it works, shows that the universe was arranged by a designer. So it proves the God of Christianity." Which reply is fair?
    options:
      - text: 'Even granting the argument, the conclusion is a designer; it does not give the designer''s goodness, uniqueness (one designer or many?), or any religion''s specific teachings.'
        correct: true
      - text: 'The argument fails, because no designer could exist.'
        feedback: |
          That is a different claim and an overreach in the other direction. The reply to the debater should address the gap between the conclusion and the claim.
      - text: 'The debater is right: a designer of the universe just is the God of Christianity.'
        feedback: |
          Many people, including many theists, reject this identification. Christianity says much more than "there is a designer" (Trinity, incarnation, specific revelations), and none of it follows from design alone.
      - text: 'Arguments cannot say anything about God at all.'
        feedback: |
          That is a separate philosophical thesis (some hold something like it), not a reply to this debater. The fair reply uses the argument's own conclusion as the measure.
    explanation: |
      Two errors are symmetrical. The believer who says "this argument proves my religion" over-reaches; the critic who says "this argument fails, so no God" also over-reaches (see below). Each argument is judged against **its own conclusion**.

  - type: text
    id: toolkit
    title: "The toolkit: validity and soundness"
    body: |
      The next lessons treat each classical argument as a list of premises P1, P2, ... and a conclusion C. Two checks are kept separate.

      - An argument is **valid** if it "takes a form that makes it impossible for the premises to be true and the conclusion nevertheless to be false" (Internet Encyclopedia of Philosophy). Validity is about **form**, not about whether the premises are true.
      - An argument is **sound** if it is valid **and** all its premises are actually true.

      $$\text{sound} = \text{valid} + \text{all premises true}$$

      Example of valid but unsound: "All toasters are made of gold. All things made of gold are time-travel devices. So all toasters are time-travel devices." The form is valid; the premises are false.

      So a critic has two options: show the form is invalid, or reject a premise. Most debates about God are about the second: **which premise do you reject, and why?**

  - type: mcq
    id: valid-q
    title: "Valid or sound?"
    prompt: |
      An argument is valid, and its conclusion is false. What must follow?
    options:
      - text: 'At least one premise is false (so the argument is unsound).'
        correct: true
      - text: 'The argument is invalid.'
        feedback: |
          By definition a valid argument cannot have all-true premises and a false conclusion. Here the conclusion is false and the argument is valid, so the form is fine; the fault must lie in a premise.
      - text: 'All the premises are true but the logic is flawed.'
        feedback: |
          If the form is valid and all premises were true, the conclusion would be true. It is false, so not all premises are true.
      - text: 'Nothing can be said about the premises.'
        feedback: |
          Something can: validity rules out "all premises true and conclusion false", so at least one premise is false.
    explanation: |
      This is the logic behind every "which premise would a critic reject?" question in the level. If you think the conclusion false and the argument valid, you must reject a premise, and the work is to say which.

  - type: numeric
    id: premise-product
    title: "Three doubtful premises"
    prompt: |
      A valid argument has three independent premises P1, P2, P3. A reader finds each premise true with probability $0.9$. What is the probability that **all three** are true, that is, that the argument is sound? Give the result to two decimals.
    answer: 0.73
    tolerance: 0.005
    answerText: '0.73'
    wrong:
      - { value: 0.9, feedback: 'That is the probability of a single premise. All three must hold together, and each extra premise can only lower the total.' }
      - { value: 2.7, feedback: 'Probabilities cannot exceed 1. For independent events, multiply the probabilities instead of adding them.' }
    hint: 'For independent premises, multiply their probabilities.'
    explanation: |
      $0.9 \times 0.9 \times 0.9 = 0.729 \approx 0.73$. A valid argument with premises each "very likely" can still be only about 73% likely to be sound. (This treats the premises as independent, which is a simplification; related premises change the number.) This is why the course asks how confident one is in each premise, not only whether the logic is valid.

  - type: mcq
    id: fail-q
    title: "If an argument fails, is the conclusion false?"
    prompt: |
      A reader finds that a classical argument for God has a false premise. Which conclusion is justified?
    options:
      - text: 'That this argument does not establish its conclusion. The conclusion might still be true, supported by other arguments or by none.'
        correct: true
      - text: 'That God does not exist.'
        feedback: |
          A flawed argument for a claim does not show the claim false: a true conclusion can be supported by a bad argument. Concluding "so it is false" from "this proof fails" is the mirror of concluding "so it is true" from "no one has disproved it".
      - text: 'That God exists, because the reader has now thought carefully about the question.'
        feedback: |
          Thinking carefully does not by itself favour a conclusion. The reader has only learned that this argument does not settle the matter.
      - text: 'That every argument for God fails for the same reason.'
        feedback: |
          Different arguments have different premises. A flaw in one does not carry over, unless the same premise appears in both.
    explanation: |
      Each side should say the same about the other's arguments: rejecting a premise is not proving the opposite. Whether the *cumulative* weight of many arguments favours a God-claim is a further question, which this level returns to at its end.

  - type: text
    id: layers
    title: "Where thoughtful people part ways"
    body: |
      The course keeps three layers separate in every claim:

      - **Established fact**: what is measured or documented (for example, the universe is expanding; the quantum vacuum has measurable effects).
      - **Live debate**: whether a premise is true (does everything contingent need an explanation? did the universe begin?), and which attributes follow.
      - **Faith or metaphysical commitment**: the final belief about God, held for reasons that may include, but are not limited to, arguments.

      Believers, atheists and agnostics can agree on the facts and on the logic and still part ways at the second layer, on a *premise*, or at the third, on commitments that no premise settles. The next lessons make the premises visible, so that disagreement can be about the right thing.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the **cosmological argument**. It starts from the plainest fact (something exists) and asks what must lie behind it: why is there something at all, and can a chain of causes ever explain itself? You will build it step by step from its premises, using the idea of a contingent thing met earlier, and then ask which premise a critic would reject.
