id: ch06-design
title: "From Paley to Darwin: The Design Argument"
kind: concept
own: |
  The setting: the **design argument** infers a designing mind from the *appearance* of things fitted to a purpose. Write $F$ for "an object's parts are fitted together to serve a purpose" (a watch keeping time, an eye seeing), $D$ for "it had a designer", and $S$ for "it arose by natural selection".
  - **Paley's analogy (Natural Theology, 1802).** According to William Paley (1743-1805), a watch found on a heath shows by its fitted parts that it had a maker, and organs such as the eye show the same sort of fit. It is an *analogical* argument: like effects have like causes, so the conclusion is probable, not certain.
  {{ $$F\ \Rightarrow\ D\ \ (\text{probably})$$ }}
  - **Hume's replies (Dialogues, 1779).** In the dialogue, Philo (generally taken to speak for David Hume) argues that the support for $D$ falls as the world's resemblance to a human artefact falls; that we have experience of only one universe and no experience of worlds being made; that the evidence could point to several designers or an imperfect one; and that a designer would itself need explaining. With $s$ the degree of resemblance between the world and an artefact:
  $$\text{support for } D\ \uparrow\ \text{as}\ s\ \uparrow$$
  - **Darwin's alternative (On the Origin of Species, 1859).** Fit can arise with no foresight from three ingredients, repeated over many generations: random variation among offspring, inheritance of traits, and some variants leaving more offspring than others. The filtering is not chance; only the variation is.
  {{ $$\begin{gathered}\text{heritable variation}\\ +\ \text{differential reproduction}\\ \Rightarrow\ \text{adaptation}\end{gathered}$$ }}
  - **What it changes.** Selection explains the *appearance* of design in living things without a mind, so it removes Paley's inference from biology; it does not show that there is no designer. Some replies say the laws and conditions that let selection work are themselves what needs explaining, which leads to fine-tuning.
  - **Comparing explanations.** For evidence $E$, design $D$ against selection $S$ is weighed by the odds form of Bayes' rule: the likelihood ratio times the prior odds.
  {{ $$\begin{aligned}\frac{P(D\mid E)}{P(S\mid E)} &= \frac{P(E\mid D)}{P(E\mid S)}\\ &\quad\times\frac{P(D)}{P(S)}\end{aligned}$$ }}
  - **How far it reaches.** At most: a mind or minds of great skill who shaped matter. Not one designer, not all-powerful, not wholly good, not the God of one religion; each rung of the ladder needs its own premises. People part ways on how strong the analogy is, on whether selection leaves anything to explain, and on the prior for $D$.
cards:
  - type: mcq
    id: hook
    title: "Guess: stone versus watch"
    prompt: |
      Guess before any theory. You are walking across a heath (open, empty moorland) and kick a stone. A few steps on you find a pocket watch lying in the grass. Both are objects you did not expect to meet. What is the most important *difference* between them for the question "how did it get here?"
    options:
      - text: 'The watch has many parts fitted together so that, jointly, they do a job (show the time); the stone shows no such fit of parts to a purpose.'
        correct: true
        feedback: |
          Yes, this is exactly the difference the design argument is built on. Notice that the point is *fit to a purpose*, not mere size or number of parts.
      - text: 'The watch is more complicated, meaning it has more atoms or more pieces.'
        feedback: |
          A stone has far more atoms than a watch. What matters is not how many pieces there are but whether they are arranged so that together they achieve something.
      - text: 'The watch is made of metal, and stones are never made by anyone.'
        feedback: |
          Material is not the point (a watch could be made of plastic or wood). The question is what its *arrangement* suggests.
    explanation: |
      The **design argument** (also called the *teleological argument*, from the Greek *telos*, "end" or "purpose") starts here: some things look as if their parts were arranged *in order to* do something. The lesson follows how this one idea was stated, attacked, and challenged by a rival explanation.

  - type: text
    id: paley
    title: "Paley and the watch"
    image:
      src: img/paley.webp
      alt: "Oil portrait of William Paley, a clergyman in dark clothes and a white wig"
      caption: "William Paley (1743-1805), an English clergyman and philosopher, published Natural Theology in 1802."
      credit: "George Romney, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:William_Paley_by_George_Romney.jpg"
    body: |
      **William Paley** (1743-1805) opened his book *Natural Theology* (1802) with the scene you just guessed about. He imagines crossing a heath, and being asked how a stone came to be there; he might answer that, for all he knew, it had lain there for ever. But a watch is different. Its wheels, spring and hands are framed and put together *for a purpose*, and the conclusion he draws is, in his words, "the inference, we think, is inevitable, that the watch must have had a maker".

      Then he turns to nature. According to Paley, living things are full of parts that are fitted to a function, so they call for the same inference.

  - type: mcq
    id: kind-q
    title: "What kind of argument is this?"
    prompt: |
      Paley reasons: *objects whose parts are fitted to a purpose (watches) are known to come from designers; organisms also have parts fitted to a purpose; so organisms probably came from a designer too.* What type of argument is this?
    options:
      - text: 'An argument from **analogy**: two things resemble each other in one respect, so they probably resemble each other in another (their cause). Its conclusion is probable, not certain.'
        correct: true
        feedback: |
          Yes. The strength of an analogy depends on how close the resemblance is, and that is exactly where critics will push.
      - text: 'A deductive proof: if the premises are true, the conclusion is certain.'
        feedback: |
          An analogy can be strong or weak but never gives certainty: the two cases might differ in some way that matters. Paley himself presents it as an inference, and philosophers treat it as an inductive (probability-raising) argument.
      - text: 'A definition of what "design" means.'
        feedback: |
          Paley does not define a word; he infers a cause (a designer) from an observed effect (fitted parts).
    explanation: |
      The schema, in the usual reading, is: *like effects have like causes*; watch and organism are like effects (parts fitted to a purpose); the watch has a designer; so the organism probably has one. Being **inductive**, the conclusion can be made more or less probable, but not forced.

  - type: mcq
    id: eye-q
    title: "The eye and the telescope"
    prompt: |
      Paley writes that "there is precisely the same proof that the eye was made for vision as there is that the telescope was made for assisting it". What is he claiming about the eye?
    options:
      - text: 'The eye shows the same *kind* of evidence of design as the telescope does: parts adapted to a function (a lens that focuses light onto a sensitive surface, so as to see).'
        correct: true
        feedback: |
          Right. He compares the *evidence* each gives, not the two objects: both are arrangements of parts that serve a purpose.
      - text: 'The eye is a kind of telescope that someone built and placed in the head.'
        feedback: |
          He compares the evidence, not the objects. He argues that the eye bears the marks of contrivance, as the telescope does.
      - text: 'Seeing proves that God exists, because a blind world would be impossible.'
        feedback: |
          Paley points to the *adaptation of parts to the function*, not to the existence of vision itself.
    explanation: |
      The eye is Paley's showpiece because its parts (transparent lens, adjustable opening, light-sensitive layer) work together and none of them would help alone. Whether such fit must come from a mind is the question the rest of the lesson tests.

  - type: mcq
    id: reproducing-q
    title: "A watch that makes watches"
    prompt: |
      Paley imagines a further twist: the finder of the watch then discovers that it has "the unexpected property of producing, in the course of its movement, another watch like itself". According to Paley, what follows about the watch's origin?
    options:
      - text: 'It adds to the case for design: such a self-copying mechanism shows even more skill, so its construction should still be referred to a designer.'
        correct: true
        feedback: |
          This is Paley's reply: a watch that makes watches does not make the question go away, it makes the contrivance more remarkable. Keep this in mind: it is a point where a later rival explanation (Darwin's) will disagree.
      - text: 'It removes the need for a maker, since the watch now produces itself.'
        feedback: |
          This is what a critic might say, but not what Paley says. He holds that the first mechanism that can copy itself still needs an explanation.
      - text: 'It shows the watch is not a watch but a living animal.'
        feedback: |
          Paley says no such thing; his point concerns where a self-copying watch would come from.
    explanation: |
      Paley treats *reproduction* as one more sign of design. The next sections ask whether reproduction plus variation can itself build fitted parts without a designer.

  - type: order
    id: analogy-order
    title: "Put Paley's analogy in order"
    prompt: |
      Put the steps of Paley's argument from analogy in order.
    steps:
      - 'A watch has parts fitted together to serve a purpose (telling the time).'
      - 'Everything we know of that has such fitted parts (watches, telescopes) was made by a designer.'
      - 'Organisms and their organs, such as the eye, also have parts fitted together to serve a purpose.'
      - 'Like effects have like causes, so organisms probably have a designer too.'
    hint: 'First the example, then what we know about its cause, then the new case, then the conclusion.'
    explanation: |
      The weak points are the second and fourth steps: is it true that fit to a purpose *only* comes from design, and are an eye and a watch alike *enough* to carry the conclusion over? Hume attacked the second kind of doubt directly.

  - type: text
    id: hume
    title: "Hume's Dialogues"
    body: |
      **David Hume** (1711-1776) wrote the *Dialogues Concerning Natural Religion*, published in 1779, three years after his death. It is a conversation between three speakers: Cleanthes defends the design argument, Demea is a mystic, and **Philo**, the sceptic, is generally taken to voice Hume's own views. It predates Paley's book, yet Philo's objections are aimed straight at it. According to Philo:

      - **The analogy is weak.** The support for a conclusion from an analogy shrinks as the resemblance shrinks; the world resembles a human machine only distantly, and arguably resembles a living organism more.
      - **One universe.** We know houses are built because we have seen many houses built. We have experience of only one world, and none of worlds being made.
      - **Maybe several designers, or a poor one.** Houses are often built by many hands, and the world's flaws would fit an immature, careless or committee-made job better than a perfect one.
      - **A regress.** A designing mind would itself have an order that demands explanation.

  - type: mcq
    id: one-world-q
    title: "Why does one universe matter?"
    prompt: |
      Philo says we have experience of only one universe. Why is that a problem for an argument of the form "this is like a human product, so it had a maker like humans"?
    options:
      - text: 'To trust an inference from effect to cause we normally rely on having seen *many* cases of such effects and their causes; for universes we have seen exactly one, and never its making, so there is no track record to appeal to.'
        correct: true
        feedback: |
          Yes. We trust "houses have builders" because of countless observed houses. The inference to a world-maker lacks that comparison class. Defenders reply that we can still ask which explanation is best, which is where the lesson goes next.
      - text: 'Only universes that have been observed by more than one person can have a designer.'
        feedback: |
          Number of observers is irrelevant. The point concerns the number of *cases of the effect with a known cause*.
      - text: 'One universe means it must be eternal, so it cannot have been designed.'
        feedback: |
          That is a separate claim. Philo's point is about the limits of our experience, not about the universe being eternal.
    explanation: |
      Hume's worry is about *evidence*, not about whether design is possible. With one example and no experience of its production, the analogy with human artefacts has little to stand on, and Philo adds that even a successful analogy would only suggest a limited mind.

  - type: mcq
    id: hume-multi
    title: "Which objections did Philo raise?"
    prompt: |
      According to the character Philo in Hume's Dialogues, which of the following are objections to the design argument? Select all that apply.
    multiple: true
    options:
      - text: 'The world resembles a human artefact only partly, so the analogy gives only weak support.'
        correct: true
        feedback: |
          Yes: support falls as resemblance falls.
      - text: 'The world''s imperfections would fit several designers, or a bungling one, as well as a single perfect one.'
        correct: true
        feedback: |
          Yes: the inference reaches only as far as the evidence does.
      - text: 'A designing mind would itself call for an explanation.'
        correct: true
        feedback: |
          Yes, the regress objection: it is raised by Philo as a challenge, and defenders reply that every explanation has to stop somewhere.
      - text: 'There is no order at all in nature, so there is nothing for the argument to explain.'
        feedback: |
          Philo does not deny order; in the dialogue he even grants that nature bears a great analogy to human art. His objections concern what the order *shows*.
      - text: 'Only humans can create anything, so the designer must be human.'
        feedback: |
          This is not an objection of Philo's; if anything, his point is that the evidence could not tell us what sort of mind it was.
    explanation: |
      Philo accepts that there is order. What he disputes is how much the order supports an inference to a single, perfect designer. By the end of the Dialogues he allows only that the cause of order may bear a remote analogy to human intelligence.

  - type: text
    id: darwin
    title: "Darwin's alternative"
    image:
      src: img/darwin.webp
      alt: "Black and white photograph of Charles Darwin as an older man with a long beard"
      caption: "Charles Darwin (1809-1882) published On the Origin of Species by Means of Natural Selection on 24 November 1859."
      credit: "Julia Margaret Cameron, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Charles_Darwin_01.jpg"
    body: |
      **Charles Darwin** (1809-1882), as a student at Cambridge, read Paley, and in his *Autobiography* he recalled being delighted by the logic of Paley's books. His own book, *On the Origin of Species by Means of Natural Selection* (1859), kept Paley's data (living things really are fitted to their ways of life) but proposed a different cause.

      The idea, in three steps. Offspring **vary**. Some of the variation is **inherited**. And some variants leave more offspring than others in their environment, because their traits suit it better (this is **natural selection**). Repeat for many generations and traits that help survival and reproduction accumulate, so that fit appears with no one planning it.

  - type: order
    id: selection-order
    title: "Selection, step by step"
    prompt: |
      Put one round of Darwin's natural selection in order.
    steps:
      - 'Offspring in a population differ from one another in some trait (for example, how sharp their vision is).'
      - 'Some variants cope better with their surroundings and so leave more offspring.'
      - 'The helpful trait is inherited by those offspring.'
      - 'In the next generation the helpful trait is more common, and the cycle repeats.'
    hint: 'Variation first, then who leaves more offspring, then inheritance, then the new generation.'
    explanation: |
      Three ingredients (variation, inheritance, differential reproduction) repeated over many generations. No step needs foresight: nothing aims at an eye. Each round only keeps what works a little better than the alternatives.

  - type: mcq
    id: chance-trap
    title: "Is selection just luck?"
    prompt: |
      A critic says: "Darwin's theory claims an eye arose by pure chance, and chance cannot build something so intricate." Which reply correctly describes natural selection?
    options:
      - text: 'Only the *variation* is random. Selection is not chance: it systematically keeps variants that do better and discards the rest, and the gains accumulate over generations.'
        correct: true
        feedback: |
          Yes. Think of a combination lock that locks in each correct digit as soon as you hit it: it is opened in a few dozen tries, not by one lucky try among thousands. Selection is the part that keeps what works.
      - text: 'Yes, everything in evolution is pure chance, and the odds are simply favourable.'
        feedback: |
          If every feature had to appear by a single lucky jump, the odds would indeed be hopeless. Selection avoids that by keeping partial successes.
      - text: 'Selection is a purposeful force that steers organisms toward an eye.'
        feedback: |
          The theory has no foresight: it keeps whatever happens to work better *now*, with no target.
    explanation: |
      The critic runs two things together: random variation (chance) and selective retention (not chance). The combination explains how complex fit can build up step by step. Whether it explains *all* of it is a question for biology, not for this lesson.

  - type: mcq
    id: darwin-target
    title: "What does Darwin challenge?"
    prompt: |
      Take Paley's argument: *fitted parts are known to come from designers; organisms have fitted parts; so organisms probably have a designer.* Which step does Darwin's alternative most directly attack?
    options:
      - text: 'The claim that fitted parts can come *only* from a designer: selection is a second known way to produce fit, so the inference to a designer is no longer the only explanation.'
        correct: true
        feedback: |
          Yes. Paley's analogy needed a gap in our understanding of how fit can arise without a mind. Darwin fills it with a process we can observe and model.
      - text: 'The claim that organisms have fitted parts: Darwin denies living things are well adapted.'
        feedback: |
          Darwin accepts the adaptation; it is what he sets out to explain.
      - text: 'The claim that a watch had a maker: Darwin thinks watches arise by selection.'
        feedback: |
          Watches are made by people; Darwin's point concerns living things.
    explanation: |
      Darwin does not say the eye is not well adapted; he says that adaptation can have another cause. According to many philosophers, this *undercuts* Paley's inference without refuting every form of the design idea, which is the next point.

  - type: text
    id: dawkins
    title: "The blind watchmaker"
    body: |
      **Richard Dawkins** gave his 1986 book the title *The Blind Watchmaker*, a reply to Paley: if natural selection plays the watchmaker's role in nature, it is a blind one, working without foresight or purpose. In the book's subtitle he states his conclusion: "Why the evidence of evolution reveals a universe without design". In essence, he says biology is the study of complicated things that give the appearance of having been designed for a purpose.

      That is the strong reading. A more modest reading says only that Paley's *argument* fails: selection explains the fit, so the appearance of design no longer supports a designer.

  - type: mcq
    id: undercut-q
    title: "Undercutting or explaining away?"
    prompt: |
      Suppose natural selection fully explains the eye's adaptation. Which conclusion does that, by itself, support?
    options:
      - text: 'That Paley''s inference from the eye to a designer loses its force. It does not by itself show that there is no designer anywhere, since God might, for example, work through natural processes.'
        correct: true
        feedback: |
          Yes. Removing one argument for a claim is not an argument against the claim. Philosophers describe this as the difference between *undercutting* an argument and *explaining away* its conclusion. Some believers hold that God works through evolution; a believer's view and Dawkins's differ on whether anything stands behind the process.
      - text: 'That there is no God.'
        feedback: |
          This would need further premises. A successful rival explanation of one piece of evidence removes that evidence as support for design; it does not refute design.
      - text: 'That Paley was right after all, since evolution is also a kind of design.'
        feedback: |
          Selection is defined as a process without foresight. Whether there is design *behind* the process is a separate question (next card).
    explanation: |
      Two readings of the same result: on the strong one (Dawkins's subtitle) the evidence of evolution makes a designer unnecessary; on the modest one it only removes the biological argument, leaving open whether the laws or the world itself show design.

  - type: mcq
    id: level-shift
    title: "Which reply moves design to the laws?"
    prompt: |
      A defender of design replies to Darwin: "Selection needs chemistry that allows self-copying molecules, laws that stay the same, and an environment that supports life. Why is a universe with such laws there?" What kind of move is this?
    options:
      - text: 'It shifts the question from the organisms to the laws and conditions that make evolution possible: design, if any, would lie in those.'
        correct: true
        feedback: |
          Yes: this "level shift" accepts evolution and relocates the design argument to the laws of nature and the physical constants, where selection itself cannot reach.
      - text: 'It denies that natural selection occurs.'
        feedback: |
          The reply accepts selection and asks what stands behind it.
      - text: 'It repeats Paley''s eye argument in more detail.'
        feedback: |
          The eye is no longer the example; the new target is the framework within which eyes can evolve.
    explanation: |
      Selection explains how fitted organisms arise *given* a world with certain laws; it is silent on why those laws hold. A critic may reply that "why these laws?" might have no answer, or that other kinds of universe exist, which is exactly the debate of the fine-tuning lesson.

  - type: text
    id: laws
    title: "From organisms to laws"
    body: |
      Today's design arguments mostly look away from eyes and toward **the laws and constants of physics**: that they permit stars, chemistry and life at all. Writing $E$ for "the laws and constants permit life", the question becomes whether $E$ is better explained by design or by something else. The full probability argument, including the "inverse gambler" objection and the multiverse reply, is the lesson *Guided Proof: Bayes and Fine-Tuning*.

      Here we ask a more basic question: when we meet order, what kinds of explanation are even available?

  - type: mcq
    id: three-causes
    title: "Chance, necessity or design?"
    prompt: |
      Three kinds of explanation can be offered for a pattern: **chance** (it happened by luck), **necessity** (laws or the nature of things force it), **design** (a mind chose it). Ice crystals have six-fold symmetry because of how water molecules bond. Which kind of explanation is that?
    options:
      - text: 'Necessity: the laws governing the molecules force the pattern, so no luck or planning is needed.'
        correct: true
        feedback: |
          Yes. Many patterns that look designed (crystals, planetary orbits) are explained by laws. This is why a design argument must show that law-like explanations are not enough.
      - text: 'Design: the symmetry is too regular to be an accident.'
        feedback: |
          Regularity is not evidence of a mind: laws produce regular patterns without one. This is the very slip that makes order a weak clue by itself.
      - text: 'Chance: each crystal happens to have six sides by luck.'
        feedback: |
          Chance would give irregular shapes. Regularity points to law rather than luck.
    explanation: |
      A design argument has to show that the pattern is not explained by chance or necessity. In biology Paley thought the answer was clear; Darwin replied with a mechanism built from chance (variation) and necessity (the laws of heredity and survival). At the level of the laws themselves, a defender of design asks why the laws are as they are; a critic says laws may be a brute fact or one of many.

  - type: numeric
    id: bayes-num
    title: "Weighing the two explanations"
    prompt: |
      A toy comparison (the numbers are invented to show the method, not estimates). A reader gives design $D$ prior probability $0.25$ and natural selection $S$ prior probability $0.75$, and treats them as the only two options. The evidence $E$ is "a certain eye-like organ exists". Suppose $P(E\mid D) = 0.5$ and $P(E\mid S) = 0.25$. What is the posterior probability $P(D\mid E)$?
    answer: 0.4
    tolerance: 0.001
    answerText: '0.4'
    wrong:
      - { value: 0.5, feedback: 'That is $P(E\mid D)$, a likelihood, not the posterior. A likelihood tells how expected $E$ is if $D$ is true; it must be combined with the prior.' }
      - { value: 0.25, feedback: 'That is the prior $P(D)$. The evidence changes it: here $E$ is twice as expected under $D$ as under $S$.' }
      - { value: 0.667, feedback: 'That is the posterior odds read as a probability (2:3 is a probability of 2/5, not 2/3). Divide by the sum of the two parts.' }
    hint: 'Posterior odds are likelihood ratio times prior odds; then turn odds back into a probability.'
    explanation: |
      Prior odds $D:S = 0.25:0.75 = 1:3$. Likelihood ratio $0.5/0.25 = 2$. Posterior odds $= 2\times\tfrac13 = 2:3$, so $P(D\mid E) = \tfrac{2}{2+3} = 0.4$. Check with the direct form: $0.5\times0.25 = 0.125$ and $0.25\times0.75 = 0.1875$, so $\tfrac{0.125}{0.125+0.1875} = 0.4$. The evidence favours $D$ (ratio 2) yet the prior keeps $S$ ahead. People disagree on the priors, which is why the debate does not end on the likelihoods.

  - type: build
    id: odds-build
    title: "Build the odds form"
    prompt: |
      Write the odds form of Bayes' rule comparing design $D$ and selection $S$ given evidence $E$: posterior odds equal the likelihood ratio times the prior odds.
    prefix: 'O_{\text{post}} ='
    suffix: ''
    tiles: ['\dfrac{P(E\mid D)}{P(E\mid S)}', '\dfrac{P(D)}{P(S)}', '\dfrac{P(E\mid S)}{P(E\mid D)}', '\dfrac{P(S)}{P(D)}']
    answers:
      - ['\dfrac{P(E\mid D)}{P(E\mid S)}', '\dfrac{P(D)}{P(S)}']
      - ['\dfrac{P(D)}{P(S)}', '\dfrac{P(E\mid D)}{P(E\mid S)}']
    wrong:
      - answer: ['\dfrac{P(E\mid S)}{P(E\mid D)}', '\dfrac{P(D)}{P(S)}']
        feedback: 'The likelihood ratio is upside down: the hypothesis in the numerator of the posterior odds ($D$) must also be in the numerator of the ratio.'
      - answer: ['\dfrac{P(E\mid D)}{P(E\mid S)}', '\dfrac{P(S)}{P(D)}']
        feedback: 'The prior odds are upside down: they must have $D$ on top to match the posterior odds $P(D\mid E)/P(S\mid E)$.'
    hint: 'Same hypothesis on top in every factor.'
    explanation: |
      $O_{\text{post}} = \frac{P(D\mid E)}{P(S\mid E)} = \frac{P(E\mid D)}{P(E\mid S)}\cdot\frac{P(D)}{P(S)}$. The first factor measures what the evidence says; the second is what you thought before. Fine-tuning arguments dispute both factors.

  - type: mcq
    id: ladder-q
    title: "How far does the inference reach?"
    prompt: |
      Grant, for the sake of argument, that the fitted parts of living things (or the laws of physics) are best explained by a designing mind. According to Hume's Philo, which conclusion would that evidence support?
    options:
      - text: 'A mind or minds with great, but possibly finite, power and skill, who shaped what exists.'
        correct: true
        feedback: |
          Yes, this is as far as the evidence goes in Philo's view: a cause with a remote analogy to human intelligence, not a proof of an infinite being.
      - text: 'A single, all-powerful, all-knowing and perfectly good creator of everything.'
        feedback: |
          Philo's point is that imperfections and the limits of the analogy leave this open: the same evidence fits several, or a flawed, designer. Reaching the traditional God needs further premises (for example from the cosmological or ontological argument).
      - text: 'The God of one particular religion, such as the God of the Bible.'
        feedback: |
          Nothing in fitted parts points to a particular tradition. That is the top rung of the ladder and needs its own evidence.
      - text: 'Nothing at all: if it were designed we would not find any flaws.'
        feedback: |
          This is too strong. The existence of flaws limits what can be concluded about the designer, but it does not remove the inference to a mind altogether.
    explanation: |
      The ladder of conclusions again: some mind, powerful, one, good, then the God of one religion. The design argument, even if it works, reaches only the lowest rungs; the problem of evil and other arguments press on the higher ones.

  - type: text
    id: summary
    body: |
      **Next:** the **moral argument**. Instead of looking at the world's order, it asks about its *values*: if some things are objectively right or wrong, does that point to God, and what do secular accounts of morality reply?
