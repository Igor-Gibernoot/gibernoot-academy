id: ch06-intuition
title: Quick Recall
kind: intuition

cards:
  - type: text
    id: welcome
    title: "Quick recall: arguments for God"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: what an argument for God can reach, the arguments from contingency, from a beginning, from the concept of God, from design, from morality and from reason, and how to weigh them.

      Three kinds of card: **mnemonics** (the shape of an argument), **build cards** (assemble a formula or a chain) and **checks** (does it behave sensibly?). Small numeric cases give you data only: choose the right tool yourself.

      As always, answers are given *according to* a thinker or a view. Nothing here asks you to decide whether any of these arguments succeeds.

  - type: order
    id: ladder
    title: "The ladder of conclusions"
    prompt: |
      An argument for God may reach only some rungs of a ladder. Order the conclusions from the lowest rung (the easiest to reach) to the highest (the hardest).
    steps:
      - 'Something is a cause or ground of the universe.'
      - 'That ground is necessary, powerful and a mind.'
      - 'That mind is a loving person who cares about us.'
      - 'That person is the God of one particular religion.'
    hint: Each rung adds content that needs its own support.
    explanation: |
      Mnemonic: **cause, necessary, mind, person, loving, one religion**. Reaching a low rung does not give the higher ones: a necessary ground is not yet a person, and a person is not yet loving.

  - type: mcq
    id: sound-def
    title: "Sound or not?"
    prompt: |
      An argument has a valid form, but one of its premises is false. Which statement is correct?
    options:
      - text: It is valid but not sound, and its conclusion may still be true.
        correct: true
      - text: It is not valid, because a false premise breaks the form.
        feedback: |
          Validity is only about form: if the premises were all true, the conclusion would have to be. A false premise does not touch the form.
      - text: It is sound, because validity is what matters.
        feedback: |
          Soundness needs validity *and* all premises true.
      - text: Its conclusion must be false.
        feedback: |
          An unsound argument gives no support, but the conclusion may be true for other reasons.
    explanation: |
      Mnemonic: **valid is form, sound is form plus truth**. A critic can attack a premise or the validity.

  - type: build
    id: sound-build
    title: "Soundness in one line"
    prompt: |
      Assemble the definition of a sound argument.
    prefix: '\text{sound} ='
    tiles: ['\text{valid}', '+', '\text{all premises true}', '\text{or}', '\text{some premise plausible}']
    answers:
      - ['\text{valid}', '+', '\text{all premises true}']
      - ['\text{all premises true}', '+', '\text{valid}']
    wrong:
      - answer: ['\text{valid}', '\text{or}', '\text{all premises true}']
        feedback: |
          "Or" would let a true-premise argument with a bad form, or a valid one with false premises, count as sound. Both are needed.
    hint: Two requirements, both needed.
    explanation: |
      Sound means valid **and** all premises true.

  - type: numeric
    id: premise-chain
    title: "Three premises in a row"
    prompt: |
      An argument is valid and has three premises. A reader's credences that they are true are $0.8$, $0.9$ and $0.5$, and the three are independent. What is the reader's credence that all three are true?
    answer: 0.36
    tolerance: 0.005
    answerText: '0.36'
    wrong:
      - { value: 0.5, feedback: "That is the weakest premise alone. All three must hold together, so the chance is lower than any single one." }
      - { value: 0.733, feedback: "That is the average of the three. Independent premises that must all hold multiply; they do not average." }
    hint: The conclusion of a valid argument is secure only if every premise holds.
    explanation: |
      $0.8 \times 0.9 \times 0.5 = 0.36$. More premises, or one weak premise, lower the chance that the whole argument is sound, even when each step looks plausible.

  - type: order
    id: contingency-order
    title: "The argument from contingency"
    prompt: |
      Put the steps of the Leibnizian argument from contingency in order.
    steps:
      - 'Principle of sufficient reason: every contingent thing has an explanation.'
      - 'The totality of contingent things is itself contingent.'
      - 'No member of the totality can explain the totality, since it would be part of what it explains.'
      - 'So the totality is explained by something outside it, which is not contingent: a necessary being.'
    hint: First the principle, then apply it to the whole, then see what cannot be the explainer.
    explanation: |
      Mnemonic: **PSR, totality, outside, necessary**. The form is valid. Critics deny the first step (the totality may be a brute fact) or charge a fallacy of composition: what holds of each part need not hold of the whole.

  - type: mcq
    id: contingency-critic
    title: "Where critics push"
    prompt: |
      Bertrand Russell, in his 1948 radio debate, answered the argument from contingency in essence by saying the universe is "just there". Which premise does this reply reject?
    options:
      - text: The principle of sufficient reason applied to the whole, since the totality may have no explanation (a brute fact).
        correct: true
      - text: The claim that the argument is valid.
        feedback: |
          The reply grants the form. It denies that the totality needs an explanation, which is a premise.
      - text: The claim that contingent things exist at all.
        feedback: |
          Nobody in the debate denies that things exist that could have failed to exist; the question is whether the whole needs a reason.
      - text: The definition of a necessary being.
        feedback: |
          The definition is not what the reply attacks; it attacks the demand for an explanation in the first place.
    explanation: |
      Mnemonic: **brute fact against PSR**. Rowe's reply: explaining every member does not explain why there are any members at all.

  - type: mcq
    id: kalam-shape
    title: "The kalam in three lines"
    prompt: |
      William Lane Craig's kalam argument has two premises and a conclusion. Which list states them correctly?
    options:
      - text: 'P1: whatever begins to exist has a cause. P2: the universe began to exist. C: the universe has a cause.'
        correct: true
      - text: 'P1: whatever exists has a cause. P2: the universe exists. C: the universe has a cause.'
        feedback: |
          If everything has a cause, God would too; and the argument would not need a *beginning*. The kalam restricts P1 to things that begin to exist.
      - text: 'P1: the universe is contingent. P2: contingent things have necessary explanations. C: a necessary being exists.'
        feedback: |
          That is the argument from contingency, a different argument that needs no beginning.
      - text: 'P1: the universe had a cause. P2: a cause is personal. C: God exists.'
        feedback: |
          The kalam's conclusion is only that the universe has a cause. A personal cause is a further step that Craig adds, and critics dispute.
    explanation: |
      Mnemonic: **begins, therefore caused**. The step from P1 and P2 to C is valid; the dispute is over whether each premise is true.

  - type: mcq
    id: bgv-limit
    title: "A limit check on the physical branch"
    prompt: |
      The Borde-Guth-Vilenkin theorem says: if the expansion rate $H$, averaged along a path into the past, is positive ($H_{\text{av}}>0$), the path cannot be extended back forever. A model has a bounce: the universe contracts and then expands, so that $H_{\text{av}}$ along some past paths is zero or negative. What does the theorem say about those paths?
    options:
      - text: 'Nothing: its condition fails, so it does not apply, and such a model escapes it.'
        correct: true
      - text: That they must also have a first moment.
        feedback: |
          The theorem is "if $H_{\text{av}}>0$ then past-incomplete". When the condition fails, nothing follows either way.
      - text: That the bounce is impossible.
        feedback: |
          The theorem forbids nothing outside its condition.
      - text: That the universe did not begin to exist.
        feedback: |
          Silence is not the opposite conclusion: the theorem neither shows a beginning nor rules one out for such models.
    explanation: |
      Mnemonic: **read the "if"**. The result is classical, and whether it marks a first moment or only the edge of our description is disputed.

  - type: numeric
    id: hilbert-hotel
    title: "A full hotel of infinitely many rooms"
    prompt: |
      A hotel has rooms $1, 2, 3, \dots$ with no last room, all occupied. To make space for a new guest, every guest moves: the guest in room $3$ goes to room $6$, the guest in room $10$ goes to room $20$, and so on by the same pattern. To which room does the guest from room $37$ go?
    answer: 74
    tolerance: 0.1
    answerText: '74'
    wrong:
      - { value: 38, feedback: "That shifts by one room, which also frees room 1, but it is not the pattern given (3 goes to 6, 10 to 20)." }
    hint: Compare each old room number with its new one.
    explanation: |
      The pattern doubles the number: $37 \to 74$. Every new room is even, so all the odd rooms are free. Defenders of the kalam say this absurdity shows an actual infinite cannot exist; the Cantorian reply is that such behaviour is just what infinite sets do.

  - type: order
    id: modal-order
    title: "The modal ontological argument"
    prompt: |
      Let $E$ be "a maximally great being exists", $\Diamond$ "possibly" and $\Box$ "necessarily". In the logic S5, possibly necessary implies necessary. Put Plantinga's argument in order.
    steps:
      - 'Premise: $\Diamond E$ (it is possible that a maximally great being exists).'
      - 'From the definition: $\Box(E \Rightarrow \Box E)$ (such a being exists necessarily or not at all).'
      - 'Together these give $\Diamond\Box E$ (possibly, it exists necessarily).'
      - 'By S5, $\Diamond\Box E$ gives $\Box E$.'
      - 'And what is necessary is actual: $E$.'
    hint: Possibility goes in first; S5 turns "possibly necessary" into "necessary".
    explanation: |
      Mnemonic: **possibly E, E is necessary-or-nothing, S5, so E**. The logic is valid; the dispute is whether the first premise ($\Diamond E$) is granted.

  - type: mcq
    id: parity
    title: "The mirror"
    prompt: |
      The same definition gives $\Diamond\lnot E \Rightarrow \lnot E$: if a maximally great being could fail to exist, it does not exist. In S5, what does this show about the premise $\Diamond E$?
    options:
      - text: $\Diamond E$ and $E$ stand or fall together, so granting the possibility premise is as hard as granting the conclusion.
        correct: true
      - text: $\Diamond E$ is false.
        feedback: |
          The parity point does not refute the premise; it shows that the premise is no easier to accept than the conclusion.
      - text: $E$ is false.
        feedback: |
          A mirror argument ($\Diamond\lnot E$, so $\lnot E$) has exactly the same form. It is an equal-standing argument, not a refutation.
      - text: The two arguments cancel out, so $E$ is probably true.
        feedback: |
          They do not average. Each is as good as its first premise; deciding between $\Diamond E$ and $\Diamond\lnot E$ needs something else.
    explanation: |
      Mnemonic: **possibility is the whole game**. In S5, $\Diamond E \Longleftrightarrow E$. Plantinga himself says such arguments cannot perhaps be said to prove their conclusion, but make it rational for someone who finds the premise rational.

  - type: mcq
    id: design-hume
    title: "Hume's replies to the design argument"
    prompt: |
      In the Dialogues (1779), Philo raises replies to the design argument. Select **all** that are among them.
    multiple: true
    options:
      - text: 'The analogy is weak: the world resembles a human artefact only so far.'
        correct: true
      - text: We have experience of only one universe, and none of worlds being made.
        correct: true
      - text: The evidence could point to several designers, or an imperfect one.
        correct: true
      - text: A designer would itself need explaining.
        correct: true
      - text: Natural selection explains adaptations without a designer.
        feedback: |
          That is Darwin's alternative of 1859, long after Hume died (1776). Hume's replies are about the analogy, not about a rival mechanism.
      - text: Nature shows no order at all.
        feedback: |
          Hume does not deny order; he questions what it supports.
    explanation: |
      Mnemonic: **weak analogy, one universe, many or flawed designers, regress**. Support for design falls as the resemblance to an artefact falls.

  - type: mcq
    id: darwin-three
    title: "What selection needs"
    prompt: |
      Darwin's account of fit (adaptation) with no foresight uses three ingredients, repeated over many generations. Which one is **not** among them?
    options:
      - text: A goal in view that guides which variations appear.
        correct: true
      - text: Random variation among offspring.
        feedback: |
          This is one of the three: variation is the raw material, and it is not guided.
      - text: Inheritance of traits.
        feedback: |
          This is one of the three: without inheritance, a favourable trait would not pass on.
      - text: Some variants leaving more offspring than others.
        feedback: |
          This is one of the three: the filtering that makes the process non-random.
    explanation: |
      Mnemonic: **vary, inherit, differ in offspring**. Only the variation is chance; the filtering is not. Selection removes Paley's inference from biology, but it does not show that there is no designer.

  - type: build
    id: odds-build
    title: "Comparing design and selection"
    prompt: |
      For evidence $E$, design $D$ and selection $S$, the odds of $D$ against $S$ after seeing $E$ are the *likelihood ratio* times the *prior odds*. Assemble the right side.
    prefix: '\dfrac{P(D\mid E)}{P(S\mid E)} ='
    tiles: ['\dfrac{P(E\mid D)}{P(E\mid S)}', '\times', '\dfrac{P(D)}{P(S)}', '\dfrac{P(D)}{P(E)}']
    answers:
      - ['\dfrac{P(E\mid D)}{P(E\mid S)}', '\times', '\dfrac{P(D)}{P(S)}']
      - ['\dfrac{P(D)}{P(S)}', '\times', '\dfrac{P(E\mid D)}{P(E\mid S)}']
    wrong:
      - answer: ['\dfrac{P(E\mid D)}{P(E\mid S)}']
        feedback: |
          That is the likelihood ratio alone. It ignores how plausible each view was before the evidence.
    hint: What the evidence says, times what you thought before.
    explanation: |
      Posterior odds equal likelihood ratio times prior odds. People part ways on the likelihoods and on the priors.

  - type: numeric
    id: odds-update
    title: "A small update"
    prompt: |
      Before seeing a piece of evidence $E$, a reader gives design $D$ probability $0.2$ and selection $S$ probability $0.8$ (nothing else is considered). The probability of seeing $E$ is $0.9$ if $D$ is true and $0.3$ if $S$ is true. After seeing $E$, what are the odds of $D$ against $S$?
    answer: 0.75
    tolerance: 0.01
    answerText: '0.75 (3 to 4)'
    wrong:
      - { value: 3, feedback: "That is only how much more likely $E$ is under $D$ ($0.9/0.3$). The starting odds were not $1$ to $1$." }
      - { value: 0.25, feedback: "That is the starting odds, $0.2/0.8$. The evidence has not been used." }
    hint: The evidence favours one side by a factor; the starting odds favour the other.
    explanation: |
      The evidence favours $D$ by a factor $0.9/0.3 = 3$. The starting odds were $0.2/0.8 = 0.25$. The new odds are $3 \times 0.25 = 0.75$, about a $43\%$ chance for $D$: a strong piece of evidence can leave a doubtful view still behind.

  - type: mcq
    id: moral-form
    title: "The moral argument"
    prompt: |
      Craig's form: P1, if God does not exist then objective moral values and duties do not exist. P2, objective moral values and duties do exist. C, God exists. What is its logical form, and what must a critic do?
    options:
      - text: 'Valid (modus tollens: from "if not G then not M" and M, infer G); the critic must reject a premise.'
        correct: true
      - text: Invalid, because it moves from morality to God.
        feedback: |
          The form is fine: if both premises are true, the conclusion follows. Moving between subject matters does not make a form invalid.
      - text: Valid, and so the conclusion is established.
        feedback: |
          Valid is not sound. Secular views reject P1 (moral realism without God) or P2 (error theory).
      - text: A fallacy of affirming the consequent.
        feedback: |
          Affirming the consequent would be "if G then M, M, so G". The premise is the contrapositive-type "if not G then not M", whose denial of the consequent does give G.
    explanation: |
      Mnemonic: **no God, no objective morals; objective morals; so God**. People part ways on P1 (can morality be objective without God?) and P2 (is there objective morality?).

  - type: mcq
    id: euthyphro
    title: "The Euthyphro question"
    prompt: |
      Plato's Euthyphro asks whether the pious is loved by the gods because it is pious, or pious because it is loved by the gods. Applied to God and goodness: if God loves the good *because it is good*, what follows?
    options:
      - text: Goodness is independent of God; God's command is not what makes it good.
        correct: true
      - text: Goodness is arbitrary, since God could have loved anything.
        feedback: |
          That is the other horn: if the good is good *because* God loves it. The first horn makes goodness independent of God.
      - text: God does not exist.
        feedback: |
          Neither horn is a refutation of God. It is a dilemma about the relation between God and goodness.
      - text: Both horns are avoided automatically.
        feedback: |
          Some theists reply that God's own unchanging good nature is the standard, but this is a third option that needs argument, not an automatic escape.
    explanation: |
      Mnemonic: **independent or arbitrary**. The divine nature reply: the good is neither independent of God nor arbitrary, because God's good character is the standard.

  - type: mcq
    id: eaan
    title: "The evolutionary argument against naturalism"
    prompt: |
      Let $N$ be naturalism, $E$ evolutionary theory and $R$ "our faculties are reliable". According to Alvin Plantinga, what is the key claim?
    options:
      - text: $P(R\mid N\&E)$ is low or inscrutable, so whoever accepts $N\&E$ gets a defeater for $R$, which undercuts even their belief in $N\&E$.
        correct: true
      - text: Evolutionary theory is false.
        feedback: |
          The argument targets the *combination* of naturalism and evolution, not evolution alone.
      - text: $P(N\&E\mid R)$ is zero.
        feedback: |
          The claim is about the probability of reliable faculties given $N\&E$, and that it is low or cannot be assessed, not that anything has probability zero.
      - text: Reliable faculties prove that God exists.
        feedback: |
          Even if the argument works, it casts doubt on $N\&E$; it does not by itself prove God.
    explanation: |
      Mnemonic: **P of R given N and E is low, defeater, self-defeat**. Replies: selection plausibly rewards true beliefs; the probability may not be low; the defeater step is contested.

  - type: mcq
    id: cause-reason
    title: "Cause or reason?"
    prompt: |
      C. S. Lewis argued that if every belief is fully explained by non-rational causes, nothing is believed *because of a reason*. Elizabeth Anscombe's 1948 reply said his wording was loose. Which distinction is at the centre of this exchange?
    options:
      - text: A cause is what makes a belief occur; a reason is what supports the belief as true.
        correct: true
      - text: A cause is a physical thing; a reason is a person.
        feedback: |
          Both are explanations of a belief; the difference is in what they do. A cause produces the belief, a reason supports its truth.
      - text: A cause is strong; a reason is weak.
        feedback: |
          The distinction is not about strength.
      - text: 'There is no difference: every belief is both.'
        feedback: |
          If cause and reason were the same, Lewis would have no worry. The distinction is the whole issue: can a belief with a full causal story still be held for good reasons?
    explanation: |
      Mnemonic: **cause makes it happen, reason makes it true-seeming**. Lewis revised the argument in 1960. Anscombe's reply: wishful thinking is a non-rational cause of belief, but a reasoned belief can also have a causal story.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **The ladder:** cause or ground, necessary, mind, person, loving, one religion. An argument reaches some rungs, not all. An argument is *sound* when
        $$\text{sound} = \text{valid} + \text{all premises true}$$
        and independent premises with credences $p_1, p_2, p_3$ give a joint credence $p_1 p_2 p_3$ (for example $0.8 \times 0.9 \times 0.5 = 0.36$).
      - **Contingency:** with $\mathrm{Cont}$ = contingent and $\mathrm{Expl}(y,x)$ = "$y$ explains $x$", the principle of sufficient reason (PSR) says
        $$\forall x\,\big(\mathrm{Cont}(x)\Rightarrow\exists y\ \mathrm{Expl}(y,x)\big)$$
        applied to the totality of contingent things, giving a necessary being outside it. Critics: the totality may be a brute fact.
      - **Kalam:** $\mathrm{Beg}(x)$ = "$x$ begins to exist", $u$ = the universe. P1: whatever begins to exist has a cause; P2: $\mathrm{Beg}(u)$; C: the universe has a cause. The Borde-Guth-Vilenkin theorem needs the averaged expansion rate
        $$H_{\text{av}}>0$$
        and then the past is incomplete. Hilbert's Hotel: guests move from room $n$ to room $2n$, freeing all odd rooms.
      - **Ontological (modal):** $E$ = "a maximally great being exists", $\Diamond$ = possibly, $\Box$ = necessarily. Premises
        $$\Diamond E \qquad\text{and}\qquad \Box(E\Rightarrow\Box E)$$
        and S5 give $E$. The mirror argument gives, in S5,
        $$\Diamond E \Longleftrightarrow E$$
        so everything rests on the possibility premise.
      - **Design:** Paley's analogy (fit implies a maker, probably), Hume's four replies (weak analogy, one universe, several or flawed designers, regress), Darwin's three ingredients (variation, inheritance, differential reproduction). Design $D$ against selection $S$ on evidence $E$:
        $$\frac{P(D\mid E)}{P(S\mid E)} = \frac{P(E\mid D)}{P(E\mid S)}\times\frac{P(D)}{P(S)}$$
      - **Moral:** with $M$ = objective moral values exist and $G$ = God exists, Craig's argument is valid (modus tollens):
        $$\lnot G\Rightarrow\lnot M,\quad M\ \therefore\ G$$
        The Euthyphro question: independent of God, or arbitrary? Reply: God's good nature is the standard.
      - **Reason:** with $N$ = naturalism, $E$ = evolutionary theory, $R$ = reliable faculties, Plantinga says
        $$P(R\mid N\&E)\ \text{is low or inscrutable}$$
        giving a defeater for $R$. A cause makes a belief occur; a reason supports it as true.

      People part ways on which premise to accept, on whether a possibility premise is as hard as its conclusion, and on the priors.

      **Next:** the content map, where you rebuild this level's concept map box by box.
