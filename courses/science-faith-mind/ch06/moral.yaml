id: ch06-moral
title: "The Moral Argument"
kind: concept
own: |
  The setting: the **moral argument** moves from morality to God. Write $M$ for "objective moral values and duties exist" (some things are right or wrong whatever anyone thinks) and $G$ for "God exists".
  - **Objective versus subjective.** A moral claim is *objective* if it is true or false independently of what any person, culture or group believes or feels; it is *subjective* if its truth depends on those attitudes. Everything in the argument turns on whether $M$ is true.
  - **Craig's form.** According to William Lane Craig, the argument has two premises and a conclusion. It is *valid* (modus tollens: from "if not $G$ then not $M$" and $M$, infer $G$), so a critic must reject a premise.
  {{ $$\lnot G\ \Rightarrow\ \lnot M$$ }}
  {{ $$M\ \ \therefore\ \ G$$ }}
  - **Kant's form.** According to Immanuel Kant (Critique of Practical Reason, 1788), God is a *postulate of practical reason*: the highest good is virtue together with the happiness it deserves, and a moral agent who pursues it must presuppose that God exists. It starts from the highest good, not from objective values, and claims a rational presupposition, not a proof.
  - **The Euthyphro question.** From Plato's *Euthyphro*: is the good good because God loves it, or does God love it because it is good? If the second, goodness is independent of God; if the first, it risks being arbitrary.
  {{ **Divine nature reply:** the good is neither independent of God nor arbitrary, because God's own unchanging good character is the standard. }}
  - **Secular accounts** deny that $M$ needs $G$: moral realism without God (Wielenberg), error theory (Mackie, denying $M$), and evolutionary debunking (Street), which questions whether realist moral beliefs track truth. Showing where a belief came from does not by itself show it false (the *genetic fallacy*); it must also show that the origin is unconnected to truth.
  - **Credence and reach.** If $P_1$ is the credence that $M$ is true and $P_2$ the credence that God is its best explanation given $M$, the conclusion's credence is their product.
  {{ $$P(C)\ \approx\ P_1\times P_2$$ }}
  At most the argument reaches a source of moral value; the step to one God, to a given religion, needs more premises.
cards:
  - type: mcq
    id: hook
    title: "Guess: wrong whatever anyone thinks?"
    prompt: |
      Guess before any theory. Imagine someone tortures a child purely for fun. Almost everyone says this is wrong. Which description best fits what people usually *mean* by saying it is wrong?
    options:
      - text: 'It is wrong whatever anyone thinks: even if a whole society approved of it, it would still be wrong.'
        correct: true
        feedback: |
          This is the "objective" reading, the one the moral argument needs. Whether it is true is exactly what the lesson examines.
      - text: 'It is wrong only because most people dislike it, and if most people changed their minds it would stop being wrong.'
        feedback: |
          This is a subjective reading. Some philosophers defend it, but it is not how most people understand their own claim: many say the approving society would be *mistaken*, not right.
      - text: 'It is wrong only if a law forbids it.'
        feedback: |
          A law is a rule that people make. People often say a law can itself be wrong (an unjust law), so being wrong is not the same as being illegal.
    explanation: |
      The **moral argument** for God starts from this feeling: that some things are wrong in a way that does not depend on opinion. It then asks what could be the *basis* of such a wrong. The lesson separates the feeling, the argument built on it, and the replies.

  - type: text
    id: objective
    title: "Objective and subjective claims"
    body: |
      A moral claim is **objective** if it is true or false independently of what any person, culture or group believes or feels about it. It is **subjective** if its truth depends on those attitudes. Compare: "the Earth orbits the Sun" is true whatever people believe; "pineapple on pizza is delicious" depends on the taster.

      *Moral values* are about what is good or bad (kindness is good), and *moral duties* are about what we ought or ought not to do (we ought not to torture). The argument claims that **objective** values and duties exist, and asks whether that fact points to God. Keep two questions apart: **do** objective moral facts exist, and **what would explain** them if they do?

  - type: mcq
    id: classify
    title: "Which claim is objective?"
    multiple: true
    prompt: |
      Which of these claims, as stated, makes a moral judgment that is objective in the sense above (true or false whatever people believe)?
    options:
      - text: '"Gratuitous cruelty is wrong, and would be wrong even if everyone approved of it."'
        correct: true
        feedback: |
          Yes: it says explicitly that the verdict does not depend on approval.
      - text: '"In my culture we find slavery abhorrent."'
        feedback: |
          This reports an attitude of a group. It may be true, but it is a fact about what people feel, not a moral verdict that holds whatever they feel.
      - text: '"I personally dislike lying."'
        feedback: |
          This is about the speaker's own feelings. It is true if the speaker really dislikes lying and says nothing about whether lying is wrong.
      - text: '"Human beings have a duty not to enslave others, whatever their law or custom says."'
        correct: true
        feedback: |
          Yes: it is a claim about a duty that is said to hold even against custom and law.
    explanation: |
      The test is whether the claim keeps its truth when attitudes change. Reports of feelings or customs (second and third) can be true without any objective morality existing; the first and fourth assert something stronger.

  - type: text
    id: argument
    title: "The argument, step by step"
    body: |
      Write $M$ for "objective moral values and duties exist" and $G$ for "God exists". According to **William Lane Craig**, a defender of the argument, it runs:

      > **P1.** "If God does not exist then objective moral values and duties do not exist."
      > **P2.** Objective moral values and duties do exist.
      > **C.** Therefore, God exists.

      (P1 is quoted from Craig's own presentation of the argument; P2 and C paraphrase him.) In symbols:

      $$\lnot G\ \Rightarrow\ \lnot M$$

      $$M\ \ \therefore\ \ G$$

      A looser template is common in the literature (for example, in the Stanford Encyclopedia of Philosophy): objective moral facts exist, and God provides the best *explanation* of them; so, probably, God exists. This version is an *inference to the best explanation*, so its conclusion is probable, not certain.

      Craig also stresses that the argument is **not** claiming that one must believe in God to be moral: it is about whether objective values can exist without God as their foundation.

  - type: mcq
    id: validity
    title: "Is the form valid?"
    prompt: |
      Taking the premises as given, which statement about Craig's argument is correct?

      $$\lnot G\ \Rightarrow\ \lnot M,\qquad M\ \ \therefore\ \ G$$
    options:
      - text: 'It is valid: if both premises are true, $G$ must be true (this form is called modus tollens). Doubts must therefore be about the premises.'
        correct: true
        feedback: |
          Right. If "no God" really led to "no objective morality" and objective morality exists, then "no God" is ruled out. Validity says nothing yet about whether the premises are true.
      - text: 'It is invalid: it commits the fallacy of denying the antecedent.'
        feedback: |
          Denying the antecedent would be "if $\lnot G$ then $\lnot M$, and $G$, so $M$", which is invalid. Here we instead *deny the consequent* ($M$ says $\lnot M$ is false) and conclude that the antecedent is false, which is the valid form.
      - text: 'It is valid only if God is defined as good.'
        feedback: |
          Validity depends only on the shape of the argument. God's being good matters for whether P1 is *true* (what grounds morality), not for validity.
    explanation: |
      Always check two things separately: **validity** (the conclusion follows) and **soundness** (valid and all premises true). The moral argument is valid; every dispute is about P1 or P2.

  - type: mcq
    id: critic
    title: "Which premise would a critic reject?"
    prompt: |
      A philosopher says: "I accept that without God there would be no objective morality, but I think morality is only a human invention, so there is none." Which premise of Craig's argument does this philosopher reject, and what is the position called?
    options:
      - text: 'P2: objective moral values and duties do exist. Views of this kind (moral anti-realism, for example J. L. Mackie''s error theory) deny that objective moral facts exist.'
        correct: true
        feedback: |
          Yes. This critic grants the conditional and denies $M$; by the same logic the conclusion $G$ then fails to follow. (Note the irony: it is the *same* conditional the defender uses.)
      - text: 'P1: if God does not exist, objective morality does not exist.'
        feedback: |
          The philosopher actually *accepts* this conditional. Someone who rejects P1 would say objective morality could exist even without God.
      - text: 'Neither premise; this critic accepts the argument.'
        feedback: |
          The critic ends with no objective morality (so P2 is false) and therefore does not accept the conclusion.
    explanation: |
      There are two ways out for a critic: deny P2 (no objective morality: *anti-realism*) or deny P1 (objective morality without God: *secular moral realism*). The rest of the lesson looks at both, plus the question of what a defender of P1 must say about the *basis* of goodness.

  - type: text
    id: kant
    title: "A different argument: Kant"
    body: |
      **Immanuel Kant** (1724-1804) is often cited as the ancestor of moral arguments, but his is a different argument from Craig's. In the *Critique of Practical Reason* (1788), Kant held that theoretical arguments for God fail, and that God is instead a **postulate of practical reason**.

      According to Kant, the **highest good** is a world in which people are both morally good (virtuous) and happy, with happiness in proportion to virtue. A moral agent who is committed to pursuing that good must, he argued, presuppose that God exists, since nothing in nature guarantees that virtue and happiness will match. The conclusion is about what a rational moral agent *ought to believe*, not a proof offered to a neutral observer.

  - type: mcq
    id: kant-q
    title: "Kant versus Craig"
    prompt: |
      What is the main difference between Kant's moral argument and Craig's?
    options:
      - text: 'Kant starts from the pursuit of the highest good (virtue and deserved happiness) and concludes that a moral agent must presuppose God; Craig starts from the existence of objective moral values and duties and argues that God is their necessary foundation.'
        correct: true
        feedback: |
          Yes: different starting points and different kinds of conclusion (a practical presupposition versus a claim about what grounds objective morality).
      - text: 'They are the same argument, stated in different words.'
        feedback: |
          The starting points differ: Kant does not begin from "objective values exist and need a foundation" but from what pursuing the highest good requires.
      - text: 'Kant argues that people cannot be moral without believing in God; Craig argues the opposite.'
        feedback: |
          Craig explicitly says the argument does not claim that belief in God is needed to be moral. The disagreement with Kant is about the starting point and the kind of conclusion, not this.
    explanation: |
      Moral arguments are a *family*. Craig's grounds-of-objective-values form is the one most discussed today; others (Kant's highest good, Swinburne's argument from moral knowledge, an argument from human dignity) start elsewhere. Check which one is on the table before judging.

  - type: text
    id: euthyphro
    title: "Plato's question"
    image:
      src: img/plato.webp
      alt: "Marble head of Plato, a bearded man with a high forehead, a Roman copy of a Greek portrait"
      caption: "Plato (about 429-347 BCE), in a Roman marble copy of a Greek portrait; the Euthyphro is usually counted among his early dialogues."
      credit: "Silanion, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Head_Platon_Glyptothek_Munich_548.jpg"
    body: |
      Suppose P1 is right and God is the foundation of morality. What does "foundation" mean? **Plato** (about 429-347 BCE) posed the question in his dialogue *Euthyphro*. Socrates meets Euthyphro, who is prosecuting his own father, and asks what holiness is. In Benjamin Jowett's English translation the key question reads: "whether the pious or holy is beloved by the gods because it is holy, or holy because it is beloved of the gods."

      Translated to one God and goodness, the **Euthyphro question** asks: is something good *because* God loves (or commands) it, or does God love (or command) it *because* it is good? Each answer is a "horn" with a cost. The next two questions take one horn each.

  - type: mcq
    id: horn1
    title: "Horn one: God loves it because it is good"
    prompt: |
      Suppose God commands kindness *because* kindness is good, so goodness is there before and independently of God's command. What does this answer cost a defender of the moral argument?
    options:
      - text: 'It seems that goodness does not depend on God, so it is no longer clear that God is needed to explain objective morality (P1 weakens).'
        correct: true
        feedback: |
          Yes. If God only recognises and approves a goodness that already stands there, the standard is not made by God, and a critic can say the moral facts could exist without God.
      - text: 'It shows that God is not good.'
        feedback: |
          Not at all; on this horn God can be perfectly good, loving what is good. The cost is about the *source* of the standard, not God's character.
      - text: 'It makes morality subjective.'
        feedback: |
          This horn actually makes goodness independent of anyone's attitude, including God's, so it is as objective as can be. The problem is for the explanatory role claimed for God.
    explanation: |
      On horn one, goodness is a standard independent of God. A theist who accepts it may still say God is the perfect knower and lover of the good, but then the argument can no longer claim that objective morality *needs* God as its foundation.

  - type: mcq
    id: horn2
    title: "Horn two: it is good because God commands it"
    prompt: |
      Suppose the opposite: something is good *only because* God commands it. A critic asks: "Could God have commanded cruelty, and would cruelty then have been good?" Why is this a problem for this answer?
    options:
      - text: 'If goodness is just whatever God commands, then no reasons stand behind the commands, so morality looks arbitrary; and saying "God is good" would only mean "God does what God commands".'
        correct: true
        feedback: |
          Yes. This is the **arbitrariness** objection, together with its companion: if goodness is defined by God's will, calling God good adds little.
      - text: 'It makes goodness depend on opinion, so it is subjective.'
        feedback: |
          God's commands are not human opinions. On this view the commands fix an objective standard for us. The trouble is whether the standard rests on reasons or on mere will.
      - text: 'It proves that God does not exist.'
        feedback: |
          The objection targets a theory about *what grounds morality*, not God's existence.
    explanation: |
      Horn two is the **divine command theory**. Its critics say it leaves goodness without reasons (arbitrary), and its defenders must say why God would not command cruelty. Both horns therefore need a reply, and the next card shows the best-known one.

  - type: text
    id: replies
    title: "Replies to the dilemma"
    body: |
      Many defenders do not accept either horn as stated. The best-known reply, discussed by philosophers such as **Robert Adams** (in *Finite and Infinite Goods*, 1999) and others, uses **God's nature**:

      - God is *essentially* good: it is God's own unchanging character (loving, just, benevolent) that is the standard of goodness. So goodness is not *independent* of God (horn one is avoided), and it is not *arbitrary* (horn two is avoided), because God's commands flow from that character rather than from whim.
      - Adams restricts the command theory to *obligations*: what we are required to do is what a loving God commands, while some goodness is understood as likeness to God.

      Objections remain, according to critics: if God's goodness is just "meeting God's own standard", then "God is good" says little; and one can ask what makes that particular nature good. Defenders reply that God's character (justice, benevolence) is what the word "good" is anchored to, so the question has no further answer. Whether this ends the regress or only names it is a place where thoughtful people part ways.

  - type: mcq
    id: replies-q
    title: "Which horn does the reply escape?"
    prompt: |
      A defender says: "Goodness is neither independent of God nor a matter of God's whim: it is God's own unchanging good nature, and God's commands express that nature." What is this reply trying to do?
    options:
      - text: 'Avoid both horns of the Euthyphro question by locating the standard of goodness in God''s character.'
        correct: true
        feedback: |
          Yes: not independent (so P1 survives), and not arbitrary (the commands come from a good character).
      - text: 'Accept horn one: goodness exists independently of God.'
        feedback: |
          The reply denies that goodness is independent of God; it puts the standard in God's nature.
      - text: 'Accept horn two without any further claim: goodness is whatever God happens to command.'
        feedback: |
          That is the plain divine command theory. The reply adds that God's commands are not random: they express a good nature.
    explanation: |
      A critic can still ask what makes God's nature good, or whether the reply only relabels the standard. A defender answers that "good" is simply the name of that character. The disagreement is about whether a standard can stop there.

  - type: text
    id: secular
    title: "Secular accounts of morality"
    body: |
      Those who reject P1 offer several accounts of objective morality (or of our moral beliefs) with no God:

      - **Moral realism without God.** The philosopher **Erik Wielenberg** (*Robust Ethics*, 2014) defends objective moral facts that exist necessarily, like mathematical truths, and need no divine ground. A worry from **J. L. Mackie** (*Ethics: Inventing Right and Wrong*, 1977) is that such facts are metaphysically "queer".
      - **Error theory.** Mackie himself concluded that moral claims aim to describe objective facts but all fail: nothing is ever objectively wrong. This denies P2.
      - **Evolutionary and social accounts.** Our moral feelings may have arisen because cooperation helped our ancestors survive, and rules of fairness may be agreements that serve everyone. Such accounts explain why we feel as we do. Whether they also show that the feelings are *false* or *unreliable* is the next question.

  - type: mcq
    id: genetic
    title: "Origin and truth"
    prompt: |
      An argument: "Our sense that cruelty is wrong evolved because it helped our ancestors cooperate. Therefore the sense is mistaken." The **genetic fallacy** is judging a claim by where it came from rather than by its merits. Which comment on this argument is best?
    options:
      - text: 'As stated it commits the genetic fallacy: how a belief arose does not by itself decide whether it is true. To work, it needs the extra claim that the origin is unconnected to the truth.'
        correct: true
        feedback: |
          Right. A belief can have a causal history that is entirely unrelated to the truth (a lucky guess), or one that tracks it (our eyes evolved and mostly see correctly). The debunker must say which holds here.
      - text: 'It is a sound proof that moral beliefs are false, since beliefs with evolutionary causes are always false.'
        feedback: |
          Many beliefs with evolutionary causes are true (that there are objects around us, say). Origin alone does not decide.
      - text: 'It is irrelevant: where a belief comes from can never matter to whether it is justified.'
        feedback: |
          Overstated. If you learn that a thermometer was built to read "20 degrees" whatever the temperature, you lose your reason to trust it. The origin matters when it shows the process did not track the truth.
    explanation: |
      The careful form is an **evolutionary debunking argument**, as in Sharon Street's 2006 "A Darwinian Dilemma for Realist Theories of Value": it targets the *reliability* of realist moral judgments, since selection would favour whichever beliefs help survival whether or not they are true. Realists reply in several ways; for example, Wielenberg appeals to necessary natural laws linking natural facts to moral ones. According to the Stanford Encyclopedia's discussion, the force of the argument comes from evolution *together with* the metaphysical naturalist picture, not from evolution alone.

  - type: mcq
    id: both-ways
    title: "A double-edged point"
    prompt: |
      A defender of the moral argument says: "Evolution explains our moral feelings, but not the objective moral facts they are supposed to detect." Which statement is the fairest comment?
    options:
      - text: 'The defender has a point: explaining why we *feel* something does not show whether there is a fact there. But the same point applies to the theist: a theist must also say why God''s creating moral faculties gives us reliable access to moral truth.'
        correct: true
        feedback: |
          Yes. Each side has to connect the story of how we got our moral beliefs to the claim that they are true.
      - text: 'The defender is plainly wrong: evolution explains everything about morality.'
        feedback: |
          Evolution may explain the feelings; whether it also explains (or explains away) the facts is exactly what is disputed.
      - text: 'The defender wins: since evolution cannot explain facts, God must be the explanation.'
        feedback: |
          Even if evolution cannot explain objective moral facts, that does not show God does; secular realists offer other grounds (necessary moral truths).
    explanation: |
      Both pictures owe an account of how moral beliefs can be reliable. That is why a debunking argument is not a refutation of P2 by itself, and why the theist's "best explanation" claim needs support, not just the failure of one rival.

  - type: numeric
    id: credence
    title: "How strong is the case?"
    prompt: |
      Use the looser, explanatory form. Let $P_1 = 0.8$ be your credence that objective moral values and duties exist, and let $P_2 = 0.4$ be your credence that, *given* they exist, God is their best explanation (so God exists). Taking the conclusion to hold exactly when both hold, what is the credence in the conclusion, $P(C) = P_1 \times P_2$?
    answer: 0.32
    tolerance: 0.001
    wrong:
      - { value: 1.2, feedback: 'You added the credences. A credence cannot exceed 1: the conclusion needs both steps, so you multiply (a conjunction is at most as likely as either part).' }
      - { value: 0.4, feedback: 'That ignores the first step. The conclusion also needs the moral facts to exist, so multiply by $P_1 = 0.8$.' }
    hint: 'Both steps must hold: multiply.'
    explanation: |
      $P(C)=0.8\times 0.4=0.32$. A chain of premises can only be as strong as its product, so modest doubts at two steps add up. Someone with $P_1=0.95$ and $P_2=0.7$ gets $0.665$, while someone with $P_2=0.1$ gets $0.095$. The numbers are *yours* to supply: the argument tells you where to put them.

  - type: mcq
    id: ladder
    title: "How far does it reach?"
    prompt: |
      Suppose someone is fully persuaded by the moral argument. What does it show, at most, without extra premises?
    options:
      - text: 'A source or ground of objective moral value, which a theist can identify with a perfectly good God; the step to one God and to any particular religion needs more premises.'
        correct: true
        feedback: |
          Yes. Like the other arguments in this chapter, each rung of the ladder (some ground, necessary, a mind, perfectly good, one religion) needs its own premises.
      - text: 'That one particular religion''s moral code is correct.'
        feedback: |
          Even a successful argument speaks of a foundation for morality in general; it does not say which tradition's code is right.
      - text: 'That atheists cannot behave morally.'
        feedback: |
          Defenders such as Craig explicitly deny that the argument says this: it concerns the foundation of morality, not people's ability to be good.
    explanation: |
      Keep three layers apart: the *fact* that people have moral convictions; the *debate* over whether they are objective and what would ground them; and the *commitment* about God, which the argument supports only to the degree its premises are credible.

  - type: mcq
    id: parting
    title: "Where people part ways"
    multiple: true
    prompt: |
      Select **all** points where a thoughtful atheist and a thoughtful theist may part ways over the moral argument.
    options:
      - text: 'Whether objective moral facts exist at all (P2).'
        correct: true
        feedback: |
          Yes: anti-realists deny it; many atheists and theists accept it.
      - text: 'Whether such facts could exist without God as their ground (P1).'
        correct: true
        feedback: |
          Yes: this is the main dispute between godless realists and defenders of the argument.
      - text: 'Whether an origin story (evolution) shows our moral beliefs to be unreliable.'
        correct: true
        feedback: |
          Yes: the debunking dispute.
      - text: 'Whether the argument is valid in form.'
        feedback: |
          The form (modus tollens) is not in dispute; the dispute is over the premises.
    explanation: |
      The pattern is the same as with every argument in this chapter: valid form, contested premises. Naming exactly which premise you doubt, and why, is the real result.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** If the moral argument asks whether our *values* point beyond nature, another argument asks whether our *reasoning* does. If our minds are products of evolution aimed at survival, can we trust them to find truth? The next lesson, **Is Reason Itself a Clue?**, studies Alvin Plantinga's evolutionary argument against naturalism and the argument from reason, with replies.
