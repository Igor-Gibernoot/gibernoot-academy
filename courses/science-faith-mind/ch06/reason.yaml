id: ch06-reason
title: "Is Reason Itself a Clue?"
kind: concept
own: |
  The setting: this lesson asks whether our own power to reason is evidence about what the world is like. Write $N$ for *naturalism* (only the natural world exists: no God, no soul, no supernatural), $E$ for *evolutionary theory* (our minds are products of unguided natural selection) and $R$ for "our belief-forming faculties are **reliable**" (they mostly produce true beliefs in the areas we care about).
  - **Selection acts on behaviour.** Natural selection favours behaviour that helps survival and reproduction. A false belief can produce the same useful behaviour as a true one, so survival value alone does not obviously guarantee true beliefs.
  - **Plantinga's evolutionary argument against naturalism (EAAN).** According to Alvin Plantinga (*Warrant and Proper Function*, 1993), the probability of reliable faculties, given naturalism and evolution together, is low or cannot be assessed.
  {{ $$P(R\mid N\&E)\ \text{ is low or inscrutable}$$ }}
  Whoever accepts $N\&E$ and sees this gains a **defeater** for $R$: a reason to stop trusting their faculties. That reason spreads to every belief those faculties produced, including $N\&E$ itself, so, according to Plantinga, {{ the conjunction $N\&E$ is *self-defeating* }}.
  - **The argument from reason.** According to C. S. Lewis (*Miracles*, 1947), if every belief were fully explained by non-rational causes, no belief would be reached *because of* a reason, and naturalism would undercut itself. According to Elizabeth Anscombe's 1948 reply, Lewis's wording was loose ("irrational", "valid", "because" shift meaning), and he revised the argument in 1960. The key distinction is between a **cause** (what makes a belief occur) and {{ a **reason** (what supports the belief as true) }}.
  - **Replies.** Selection plausibly rewards reliable cognition because true maps and predictions help survival; a theist faces a parallel worry about the origin of faculties; the probability $P(R\mid N\&E)$ may not be low; and the defeater step is contested.
  - **Credence form.** For a rival view $T$ and the evidence $R$, the odds update by the likelihood ratio. The ratio is only as good as the invented or contested probabilities fed into it.
  {{ $$\begin{aligned}\frac{P(N\&E\mid R)}{P(T\mid R)} =\ &\frac{P(R\mid N\&E)}{P(R\mid T)}\\ &\cdot\frac{P(N\&E)}{P(T)}\end{aligned}$$ }}
  At most the argument casts doubt on the *combination* of naturalism and evolution; it does not prove God, and it does not select any one religion.
cards:
  - type: mcq
    id: hook
    title: "Guess: does survival need truth?"
    prompt: |
      Guess before any theory. Suppose your ancestors' brains were shaped by a process that rewards **staying alive and having children**, and nothing else. Which statement fits best?
    options:
      - text: 'Such a process would probably reward *some* true beliefs, such as where food and danger are, but it is not obvious it rewards true beliefs about everything, like distant galaxies or philosophy.'
        correct: true
        feedback: |
          This is the cautious middle position, and it is where the real debate starts: how far does "useful for survival" reach into "true"?
      - text: 'It would guarantee that every belief we hold is true, since false beliefs get animals killed.'
        feedback: |
          Too strong. A mistaken belief only kills you if it leads to bad behaviour. Many false beliefs (about stars, or about why the rain comes) cause no harm to survival at all.
      - text: 'It would make almost all our beliefs false, since truth never helps survival.'
        feedback: |
          Too strong in the other direction. Knowing where the predator is clearly helps survival, so at least some truth-tracking is rewarded.
    explanation: |
      The question of how far evolution trusts our minds is old. In an 1881 letter to William Graham, Charles Darwin (1809-1882) voiced a "horrid doubt" about whether the convictions of a mind developed from lower animals can be trusted. This lesson examines two arguments that press that doubt hard, and the replies.

  - type: text
    id: terms
    title: "Three letters to keep"
    body: |
      Three claims are in play.

      - $N$ = **naturalism**: only the natural world exists (no God, no soul, no supernatural realm).
      - $E$ = **evolutionary theory**: our minds are products of unguided natural selection acting on heritable variation.
      - $R$ = **reliability**: our belief-forming faculties (perception, memory, reasoning) mostly produce true beliefs in the areas we care about.

      Label the layers: that evolution happened is **established science**; that $N$ is true is a **metaphysical commitment** many scientists hold and many do not; whether $R$ follows from $N$ and $E$ is the **live debate** of this lesson.

      The question is not "are we reliable?" (almost everyone says yes) but: **how likely is $R$ if $N$ and $E$ are both true?** Write that probability as $P(R\mid N\&E)$, read "the probability of $R$ given $N$ and $E$".

  - type: mcq
    id: terms-check
    title: "Who holds what?"
    prompt: |
      A theist who accepts evolution says: "God guided the process, and our minds are reliable." In terms of $N$, $E$ and $R$, which description is correct?
    options:
      - text: 'She accepts $E$ and $R$ but rejects $N$ (she holds that something beyond nature exists).'
        correct: true
        feedback: |
          Yes. The argument targets the *conjunction* $N\&E$, not evolution alone. Many theists accept $E$.
      - text: 'She rejects $E$, since evolution contradicts theism.'
        feedback: |
          Many theists accept evolution; the argument studied here does not need anyone to reject it. It questions only the combination with $N$.
      - text: 'She rejects $R$, since faith replaces reason.'
        feedback: |
          Nothing in her statement doubts reason; she says our minds are reliable.
    explanation: |
      Keep the target clear: the argument is **not** against evolution. It is about whether $N$ and $E$ *together* leave our trust in reason standing.

  - type: text
    id: behaviour
    title: "Selection sees behaviour, not beliefs"
    body: |
      Natural selection filters creatures by what they **do**: do they eat, flee, mate, raise young. It has no direct access to what is *in their heads*. So the key question is whether the **content** of a belief (what it says about the world) makes a difference to behaviour.

      An invented example in the spirit of Plantinga's fleeing hominid: Mia wants to avoid being eaten. Suppose she sees a tiger and believes "that is a harmless kitten, and the safest thing to do with kittens is to run away fast." Her belief is false, but her behaviour (running) is exactly what a true belief ("that is a dangerous tiger, run") would produce.

      The point is not that evolution produces absurd beliefs, but that **many different belief-and-desire combinations can give the same successful behaviour**, so selection alone does not obviously pick out the true ones.

  - type: mcq
    id: behaviour-check
    title: "Same behaviour, different belief"
    prompt: |
      Mia sees a tiger, runs away, and survives. Which conclusion follows from this alone?
    options:
      - text: 'That she ran tells us her behaviour was adaptive; it does not by itself tell us that her belief about the tiger was true.'
        correct: true
        feedback: |
          Right. Selection can only "see" the running, and more than one belief could have caused it.
      - text: 'That she believed the tiger was dangerous, since she survived.'
        feedback: |
          Survival does not fix the belief. A false belief ("it is a kitten I should flee") would have given the same result.
      - text: 'That her faculties are unreliable.'
        feedback: |
          One case proves nothing about reliability in general. The argument concerns the *probability* of reliability over many beliefs and many kinds of situation.
    explanation: |
      This is the first step: behaviour-based selection leaves some room between "useful" and "true". Whether that room is large or small is exactly what the replies dispute.

  - type: text
    id: eaan
    title: "Plantinga's argument, in outline"
    body: |
      According to **Alvin Plantinga** (born 1932, American philosopher), who put the argument forward in *Warrant and Proper Function* (1993) and repeated it in *Where the Conflict Really Lies* (2011), the **evolutionary argument against naturalism** runs roughly:

      > **P1.** $P(R\mid N\&E)$ is low or inscrutable (cannot be reasonably estimated).
      > **P2.** Anyone who accepts $N\&E$ and sees P1 thereby has a **defeater** for $R$: a reason to doubt or withhold belief in the reliability of their faculties.
      > **P3.** A defeater for $R$ is a defeater for every belief those faculties produce, including belief in $N\&E$ itself.
      > **C.** So $N\&E$ is self-defeating: it cannot rationally be accepted.

      The idea that naturalism undermines its own justification is older: Arthur Balfour put it forward, and C. S. Lewis popularised it in *Miracles* (1947). Plantinga gave it a probabilistic form.

      Note what the conclusion is: not that evolution is false, nor that God exists, but that the *combination* of naturalism and evolution is hard to hold rationally.

  - type: mcq
    id: critic
    title: "Which premise would a critic reject?"
    prompt: |
      A philosopher replies: "Natural selection favours organisms that track their environment accurately, so reliable faculties are quite probable given naturalism and evolution." Which premise of Plantinga's argument does this reply reject?
    options:
      - text: 'P1: it says $P(R\mid N\&E)$ is not low, because truth-tracking is itself adaptive.'
        correct: true
        feedback: |
          Yes. This is the most common reply (versions are due to Fales, Robbins and Fodor, among others). If P1 fails, the chain to the defeater never starts.
      - text: 'P3: it denies that a defeater for $R$ spreads to other beliefs.'
        feedback: |
          The reply does not concern the spreading of doubt; it denies that there is cause for doubt in the first place.
      - text: 'The conclusion only: it accepts all the premises but disputes the logic.'
        feedback: |
          The reply attacks a premise (P1), not the logic.
    explanation: |
      Another critic could accept P1 but reject P2 or P3, arguing for example that one may keep trusting faculties after a doubt, using independent checks such as science's own success. Always ask: *which premise?*

  - type: order
    id: defeater-order
    title: "The defeater step in order"
    prompt: Put the steps of the defeater reasoning in order.
    steps:
      - 'Suppose you accept both $N$ and $E$ and you also see that $P(R\mid N\&E)$ is low or inscrutable.'
      - 'You then have a reason to doubt that your faculties are reliable.'
      - 'But every belief you hold, including your belief in $N\&E$ and in your estimate of $P(R\mid N\&E)$, came from those faculties.'
      - 'So you have a reason to doubt $N\&E$ itself: accepting it removes your ground for accepting it.'
    hint: Start from what you accept, then what that gives you a reason to doubt, then what depends on it.
    explanation: |
      The structure is like learning that your only thermometer is probably broken: you cannot use that same thermometer to show that it is fine. Critics ask whether the first step really gives a reason for *global* doubt, or only doubt where selection pressure is weak.

  - type: mcq
    id: defeater-analogy
    title: "A thermometer analogy"
    prompt: |
      You are told, by a reliable source, that a given thermometer was assembled from random parts and its readings are as likely to be wrong as right. Which is the closest analogy to Plantinga's defeater step?
    options:
      - text: 'You can no longer trust any reading from it, including a reading that "confirms" it works.'
        correct: true
        feedback: |
          Yes: the defeater reaches the very readings that would be used to rebut it.
      - text: 'You lose trust in that thermometer only for temperatures above 30 degrees.'
        feedback: |
          Nothing in the story limits the doubt to part of the range. The analogy is about a doubt that covers the whole instrument.
      - text: 'You can still trust it, since random parts sometimes give right answers.'
        feedback: |
          Sometimes-right is not the same as trustworthy. If readings are as likely wrong as right, a particular reading gives you no ground.
    explanation: |
      Critics reply that the analogy needs the premise P1 first (that the "thermometer" really is likely random), and that is the contested step. Fitelson and Sober also note that theists face the same global skepticism.

  - type: text
    id: lewis
    title: "Lewis and the argument from reason"
    image:
      src: img/anscombe.webp
      alt: "Digital drawing of the philosopher G. E. M. Anscombe"
      caption: "G. E. M. (Elizabeth) Anscombe (1919-2001), Oxford and later Cambridge philosopher, read to the Oxford Socratic Club in 1948 a reply to Lewis's argument."
      credit: "Albarluque, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Elisabeth_Anscombe.jpg"
    body: |
      A neighbouring argument is older and simpler. **C. S. Lewis** (1898-1963) presented, in chapter 3 of *Miracles* (1947), what is now called the **argument from reason**. In essence: if every belief were fully explained by non-rational causes (brain chemistry, say), then no belief would ever be held *because it follows from good reasons*. That would include the belief in naturalism, so naturalism would undercut itself.

      In 1948 **Elizabeth Anscombe** (1919-2001) read a reply to the Oxford Socratic Club. According to summaries of her reply, she argued that "irrational" was the wrong word (wishful thinking differs from the merely non-rational firing of neurons), that "valid" was unclear, and that words like "because" and "explanation" shift meaning with the context. Lewis revised the chapter substantially for the 1960 edition. Accounts differ on how the 1948 meeting itself went and on how far he changed his view: that part of the story is **disputed**.

      The key idea is a distinction between a **cause** (what makes a belief occur) and a **reason** (what supports it as true).

  - type: mcq
    id: reasons-causes
    title: "Reason or cause?"
    multiple: true
    prompt: |
      Anna believes it will rain. Which statements give a **reason** (evidence supporting the belief), as opposed to only a **cause** of its occurring?
    options:
      - text: '"The barometer is falling and dark clouds are approaching from the west."'
        correct: true
        feedback: |
          Yes: these are facts that make rain likely, and she can cite them to support the belief.
      - text: '"A certain pattern of neurons fired in her cortex."'
        feedback: |
          This describes what happens in the brain. It may be a cause of the belief, but it says nothing about why rain is likely. (It could be a cause of a good or a bad belief alike.)
      - text: '"She badly wants the picnic cancelled, so she hopes for rain."'
        feedback: |
          Wishful thinking can cause a belief, but it does not support it. This is Anscombe's own kind of example of a non-supporting cause.
      - text: '"Rain follows falling pressure in nearly every case she has seen."'
        correct: true
        feedback: |
          Yes: past regularity is a reason (inductive evidence) for the prediction.
    explanation: |
      Lewis claims that a naturalist cannot make room for reasons on top of causes. The naturalist replies that a mind is a physical system whose causal processes can *be* the processing of reasons, as a calculator's circuits do arithmetic. That reply and the answer to it are the live debate.

  - type: text
    id: replies
    title: "Replies in four families"
    body: |
      Four replies deserve a fair hearing. Each answers a different step.

      1. **Truth-tracking is adaptive** (aimed at P1). A creature that mapped its world correctly outcompeted one that did not. Defenders of this reply argue that, for beliefs about the middle-sized world, a mind that is wrong often would be eliminated.
      2. **The parallel worry** (the "proves too much" reply). Fitelson and Sober (1998) note that theists face the same global skepticism: if the argument's doubt were sound, it would reach them too. Separately, Ramsey argues that our faculties are in fact slightly unreliable in places, which naturalism explains better than theism does.
      3. **Priors and estimates** (aimed at P1 and the "inscrutable" claim). Fitelson and Sober argue that the probabilities Plantinga uses are arbitrary and his standard of reliability too strict.
      4. **The defeater step** (aimed at P2 and P3). It is contested whether a possibility of unreliability, with no actual sign of it, really defeats ordinary beliefs.

      The debate is **ongoing**: eleven critical essays, with Plantinga's replies, were collected in a 2011 volume.

  - type: mcq
    id: replies-match
    title: "Match the reply"
    prompt: |
      An objector says: "Even if I granted that $P(R\mid N\&E)$ is low, a theist who believes God designed her faculties still needs a reason to trust them, so the argument would make *her* beliefs doubtful too." Which reply family is this?
    options:
      - text: 'The parallel worry: the argument proves too much, since the same doubt arises for the theist.'
        correct: true
        feedback: |
          Yes. It does not deny P1; it denies that P1 would favour any one side.
      - text: 'Truth-tracking is adaptive.'
        feedback: |
          That reply denies P1 by appeal to selection. This objector grants P1 for the sake of argument.
      - text: 'The probabilities are arbitrary.'
        feedback: |
          That is the third family; this objector does not complain about numbers but about a doubt that would reach both sides.
    explanation: |
      A defender of the argument would answer that the theist at least has an account on which faculties aimed at truth are expected, so the two cases are not symmetrical; a critic replies that this only moves the question. Which of them is right is **disputed**.

  - type: text
    id: odds
    title: "A way to weigh it: odds and likelihood"
    body: |
      Bayesian reasoning (the lesson on Bayes' rule) offers a way to weigh the argument. Let $T$ be a rival view on which reliable faculties are expected (for example, a view on which minds are designed to know), and let the evidence be $R$ itself, the fact that our faculties seem reliable. Then

      $$\frac{P(N\&E\mid R)}{P(T\mid R)}\ =\ \frac{P(R\mid N\&E)}{P(R\mid T)}\cdot\frac{P(N\&E)}{P(T)}$$

      The first factor on the right is the **likelihood ratio**, the second the **prior odds**. A low $P(R\mid N\&E)$ pushes the odds down; a high prior for $N\&E$ pushes them back up.

      Toy numbers, **invented** to show the mechanics (not claimed to be right, and the whole dispute is about what these should be): $P(R\mid N\&E)=0.2$, $P(R\mid T)=0.9$, prior odds $P(N\&E):P(T)=2:1$.

  - type: numeric
    id: odds-calc
    title: "Compute the posterior odds"
    prompt: |
      Using the invented numbers $P(R\mid N\&E)=0.2$, $P(R\mid T)=0.9$ and prior odds $P(N\&E):P(T)=2$ (that is, 2 to 1), find the posterior odds $\dfrac{P(N\&E\mid R)}{P(T\mid R)}$. Give a decimal.
    answer: 0.4444
    tolerance: 0.005
    answerText: '4/9 ≈ 0.444'
    wrong:
      - { value: 0.2222, feedback: 'That is the likelihood ratio $0.2/0.9$ alone. You still have to multiply by the prior odds, $2$.' }
      - { value: 4.5, feedback: 'The likelihood ratio is inverted. The numerator is $P(R\mid N\&E)=0.2$ and the denominator $P(R\mid T)=0.9$.' }
      - { value: 2, feedback: 'That is the prior odds, unchanged. The evidence $R$ should multiply them by the likelihood ratio.' }
    hint: 'Posterior odds = likelihood ratio times prior odds.'
    explanation: |
      $$\frac{0.2}{0.9}\times 2 = \frac{4}{9} \approx 0.444$$
      So $N\&E$ falls from 2 to 1 in favour to about 0.44 to 1 (about 31% against $T$ alone). The point is the structure: the argument is an inference about the likelihood of $R$, and its force depends entirely on the two probabilities, which critics (Fitelson and Sober) call unjustified.

  - type: build
    id: odds-build
    title: "Build the odds update"
    prompt: 'Assemble the right-hand side of the odds update for the evidence $R$, using $T$ as the rival view.'
    prefix: '\text{odds} ='
    tiles: ['\dfrac{P(R\mid N\&E)}{P(R\mid T)}', '\dfrac{P(R\mid T)}{P(R\mid N\&E)}', '\dfrac{P(N\&E)}{P(T)}', '\dfrac{P(T)}{P(N\&E)}']
    answers:
      - ['\dfrac{P(R\mid N\&E)}{P(R\mid T)}', '\dfrac{P(N\&E)}{P(T)}']
      - ['\dfrac{P(N\&E)}{P(T)}', '\dfrac{P(R\mid N\&E)}{P(R\mid T)}']
    wrong:
      - { answer: ['\dfrac{P(R\mid T)}{P(R\mid N\&E)}', '\dfrac{P(N\&E)}{P(T)}'], feedback: 'The likelihood ratio is upside down: the view on top of the left side must be on top on the right.' }
    hint: 'Likelihood ratio times prior odds, both with $N\&E$ on top.'
    explanation: |
      The odds of $N\&E$ against $T$ after seeing $R$ equal the likelihood ratio times the prior odds, with the same view on top in each factor.

  - type: mcq
    id: ladder
    title: "How far does the argument reach?"
    prompt: |
      Suppose Plantinga's argument fully succeeded. Which is the strongest conclusion it would support by itself?
    options:
      - text: 'That the combination of naturalism and evolution cannot be rationally accepted; it would not by itself show that God exists or which religion is true.'
        correct: true
        feedback: |
          Right. The argument is a doubt about $N\&E$. Moving from "not $N$" to "God" needs more premises, since non-naturalist views include many that are not theistic.
      - text: 'That God exists.'
        feedback: |
          That is a further step. Rejecting naturalism leaves open many alternatives (dualism, idealism, polytheism, and others), and the argument does not choose among them.
      - text: 'That evolution is false.'
        feedback: |
          The argument is compatible with evolution being true. It targets only its conjunction with naturalism, and many theists accept evolution.
    explanation: |
      Place it on the ladder from earlier arguments in this level: each rung (a ground of things, necessary being, mind, perfectly good, one religion) needs its own support. This argument, at its best, is a reason to doubt one rival, naturalism.

  - type: mcq
    id: views
    title: "Two readings of the same fact"
    prompt: |
      Humans have produced reliable science (it predicts eclipses and builds working bridges). How might a defender of the argument and a critic each describe this fact?
    options:
      - text: 'The defender: it is hard to expect from unguided selection alone, so it is some evidence for a different background. The critic: it is what we would expect from selection, since predicting the world helps survival.'
        correct: true
        feedback: |
          Yes. One fact, two likelihoods: it is the same data, with a different judgement of $P(R\mid N\&E)$.
      - text: 'The defender and the critic dispute the fact itself: one says science works, the other says it does not.'
        feedback: |
          Both accept that science works; the dispute is about what best explains it.
      - text: 'Both agree it proves naturalism false.'
        feedback: |
          Only some defenders say that, and a critic does not.
    explanation: |
      This is how the debate often goes. Neither side denies the data. They differ on one probability, and on whether that probability can be known at all.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** a short round of **Traps** on the arguments for and against God in this level: each fast question is built on a common mistake, such as confusing validity with truth, an argument for a first cause with one for a particular God, or an argument for one conclusion with one for another.
