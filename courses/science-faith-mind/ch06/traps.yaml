id: ch06-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: the arguments for God"
    body: |
      Fast round. Each question hides a **tempting shortcut** about the classical arguments met in this level: what theism means, validity and soundness, the cosmological and kalam arguments, the ontological argument, the design argument, the moral argument and the argument from reason. Every shortcut is a *useful idea turned too far*.

      Nothing here asks whether God exists. Answers are given *according to* someone, and where thoughtful people differ the feedback shows both sides.

  - type: mcq
    id: valid-true
    title: "Valid, so true?"
    prompt: |
      A student says: "The argument is valid, so its conclusion is true." Which reply is correct?
    options:
      - text: 'Validity only says that the form makes it impossible for the premises to be true and the conclusion false. The conclusion is guaranteed true only if the argument is also sound, that is, valid and all its premises are true.'
        correct: true
      - text: 'Validity does guarantee the conclusion, so critics must attack the logic.'
        feedback: |
          A valid argument can have a false premise: "All birds are toasters; a robin is a bird; so a robin is a toaster" is valid and false. In every argument in this level, critics attack a premise, and the step from premises to conclusion is the least disputed part.
      - text: 'A valid argument is one whose premises we all accept.'
        feedback: |
          That confuses validity with persuasiveness. Validity is about the form alone, whether or not anyone accepts the premises.
      - text: 'A valid argument with a false conclusion is impossible.'
        feedback: |
          It is possible when a premise is false. What is impossible is true premises with a false conclusion.
    explanation: |
      Every question of the form "is the argument good?" splits in two: is it valid, and are the premises true? The first is a matter of logic and is usually agreed; the second is where thoughtful people part ways.

  - type: mcq
    id: unsound-false
    title: "If the argument fails, is God out?"
    prompt: |
      A critic shows that a premise of the cosmological argument is doubtful. A friend concludes: "So God does not exist." What does the critic's result actually show?
    options:
      - text: 'That this argument does not establish its conclusion by this route. A conclusion can be true even when one argument for it fails, just as a bad proof of a true theorem leaves the theorem standing.'
        correct: true
      - text: 'That the conclusion is false, because an unsound argument has a false conclusion.'
        feedback: |
          An unsound argument may have a true conclusion. Unsoundness means the argument fails to show it, not that it is false.
      - text: 'That every argument for God fails, since they all depend on one another.'
        feedback: |
          Different arguments use different premises (contingency, a beginning, order, morality). Some depend on others (Kant held that the cosmological one hides the ontological), but not all do.
      - text: 'Nothing, because a doubtful premise is the same as a true one.'
        feedback: |
          A doubtful premise weakens the argument. The point is only that weakness is not the same as the opposite claim being proved.
    explanation: |
      The same holds in reverse: an argument that survives some objections does not prove its conclusion either. This is also why atheists and theists can agree on the logic of an argument and part ways on its premises.

  - type: mcq
    id: deism-theism
    title: "A creator, so a theist?"
    prompt: |
      A student reads that the universe may have a creator and says: "So the argument shows theism." Which position does a first-cause conclusion fit equally well?
    options:
      - text: 'Deism: according to deists, God created the universe but does not act in it afterwards. A bare first cause does not say whether the cause knows, chooses, or acts in the world, which theism claims.'
        correct: true
      - text: 'Pantheism, because the cause is the same as the universe.'
        feedback: |
          Pantheism holds that God is identical with the cosmos (Spinoza: "God or Nature"). A cause that precedes or grounds the universe is a different claim, though pantheists have their own readings.
      - text: 'Atheism, because a cause is not a person.'
        feedback: |
          Atheism in the narrow sense is the claim that God does not exist. A first cause with no further attributes is not that; it also falls short of a person, which is the point of the ladder of conclusions.
      - text: 'Only theism, because "creator" already means a loving person.'
        feedback: |
          "Creator" names a role. Whether the creator is loving, personal or still active are further rungs, each needing its own premises.
    explanation: |
      Climb the ladder one rung at a time: something is a cause or ground; it is necessary, powerful, perhaps a mind; it is a person; it is loving; it is the God of one religion. Reaching a lower rung does not give the higher ones.

  - type: mcq
    id: atheism-denial
    title: "Atheism means denial?"
    prompt: |
      A student says: "An atheist is someone who claims to know there is no God." According to philosophers who write on the topic, what is the more careful picture?
    options:
      - text: 'The word has two senses: broad atheism is lacking the belief that God exists; narrow atheism, the sense philosophers usually use, is holding that God does not exist. Agnosticism says that neither theism nor atheism is known, and who carries the burden of proof is itself disputed.'
        correct: true
      - text: 'Atheism and agnosticism mean the same thing.'
        feedback: |
          Agnosticism concerns what is known; atheism in the narrow sense concerns what is true. Someone can lack belief (broad atheism) and also say they do not know.
      - text: 'Atheism always claims certainty, which is why it needs more proof than theism.'
        feedback: |
          Atheism need not claim certainty, and the burden-of-proof question is open: Flew (1972) argued for a presumption of atheism, and others reject that.
      - text: 'An atheist is anyone who has never heard of God.'
        feedback: |
          That describes someone unaware of the question; the broad sense speaks of lacking belief, whatever the reason.
    explanation: |
      A fair debate starts by naming which sense is used. Much apparent disagreement dissolves when "denies" and "lacks belief" are separated.

  - type: mcq
    id: kalam-cosmological
    title: "One cosmological argument?"
    prompt: |
      Suppose physicists found that the universe had no first moment (an endless past). A student says: "That refutes every cosmological argument." Which reply is correct?
    options:
      - text: 'It would remove the second premise of the kalam argument, which needs a beginning. The argument from contingency does not need a beginning: it asks why there are contingent things at all, even in an endless past.'
        correct: true
      - text: 'Both arguments need a beginning, so both would fail.'
        feedback: |
          Only the kalam argument does. The Leibnizian argument asks about explanation, not about a first moment, and it was formulated for universes with no beginning too.
      - text: 'Neither argument is affected, because physics is irrelevant to them.'
        feedback: |
          The kalam argument's second premise has a physical branch, so physics bears on it directly (though the premise also has a philosophical branch about actual infinites).
      - text: 'It would refute the kalam argument and prove the contingency argument.'
        feedback: |
          Removing a premise of one does not make the other sound; the contingency argument still depends on its own premises, which critics (brute fact, composition) dispute.
    explanation: |
      Keep the two apart: the kalam argument asks "did the universe begin?", the argument from contingency asks "why is there something that could have failed to be?". An answer to one is not an answer to the other.

  - type: mcq
    id: composition
    title: "Every part has an explanation, so does the whole?"
    prompt: |
      Every human being has a mother. A defender of the contingency argument says that likewise the totality of contingent things needs an explanation. Which statement about the comparison is fair?
    options:
      - text: 'According to Russell (1948), the move from each member to the whole is a fallacy of composition (what holds of each part need not hold of the whole). According to Rowe (1975), explaining every member still leaves open why there are any members at all, so the question about the whole is not settled either way.'
        correct: true
      - text: 'The inference from each part to the whole is always valid, so the totality needs an explanation.'
        feedback: |
          It is not always valid: every part of a mosaic may be square while the picture is not. Whether it holds here is exactly the point in dispute.
      - text: 'Russell proved that the totality has no explanation.'
        feedback: |
          Russell said, in essence, that the totality may simply be there as a brute fact. He did not prove it, and Rowe's reply shows the question is not closed.
      - text: 'The comparison is irrelevant, since the argument is about causes, not explanations.'
        feedback: |
          The contingency argument is stated in terms of explanation (sufficient reason), not only causes in time.
    explanation: |
      Both sides have a real point: some properties do carry from parts to whole and some do not. The argument can be rescued by defending its principle for the whole directly (the principle of sufficient reason), at the price of a premise that critics will not grant for free.

  - type: mcq
    id: who-made-god
    title: "Who caused God?"
    prompt: |
      A student objects to the kalam argument: "If everything has a cause, God needs a cause too." Which is the best reply from the defender, and what is its price?
    options:
      - text: 'The first premise says that whatever *begins to exist* has a cause, not that everything has a cause. A being that never began to exist is not covered by it. The price: the argument is now silent on why the universe is covered and the cause is not, which critics press.'
        correct: true
      - text: 'The first premise says that everything has a cause, with no exceptions, but God is outside logic.'
        feedback: |
          That is not the premise, and putting God outside logic would undercut any argument for God. The premise is restricted to things that begin to exist.
      - text: 'The objection is correct and the kalam argument is refuted.'
        feedback: |
          The objection misreads the premise. A fair criticism targets whether the restricted premise applies to the universe, not a premise nobody states.
      - text: 'Causes are not needed, because the universe came from nothing.'
        feedback: |
          That contradicts the first premise. The defender holds that something cannot come from nothing; some critics deny that intuition reaches the universe, but then the argument loses its first premise.
    explanation: |
      This trap is a misquotation of the premise. The real debate is whether the intuition behind "whatever begins to exist has a cause" extends to the universe as a whole, and whether the physical and philosophical routes to a beginning succeed.

  - type: numeric
    id: hotel
    title: "Where does the guest from room 7 go?"
    prompt: |
      In Hilbert's Hotel every room $1, 2, 3, \dots$ is occupied. A new guest arrives. The manager asks the guest in room $n$ to move to room $2n$, which frees all the odd rooms. To which room does the guest currently in room $7$ move?
    answer: 14
    tolerance: 0
    wrong:
      - { value: 8, feedback: "That would move each guest one room up (room $n+1$), which also frees room $1$ but is a different scheme. The scheme here sends room $n$ to room $2n$." }
      - { value: 7, feedback: "Room $7$ is odd; the guest must move so that odd rooms are freed. Under $n \\to 2n$, the room $7$ guest leaves." }
    hint: "Double the room number."
    explanation: |
      Room $7$ goes to room $2\times 7 = 14$. Every guest still has a room (an even one), and all odd rooms are now free, so more guests fit. Defenders of the kalam argument say this shows an actual infinite is absurd; according to critics, it shows that infinite sets behave differently from finite ones (Cantor) and that past events do not coexist like rooms.

  - type: mcq
    id: thalers
    title: "Does existence add something?"
    prompt: |
      According to Kant, existence is not a real predicate. Which example did he use, and what does it show?
    options:
      - text: 'A hundred real thalers contain no more than a hundred possible ones: saying a thing exists does not add a further property to its concept. So the claim that real existence makes something "greater" (Anselm''s third premise) compares nothing that existence could add.'
        correct: true
      - text: 'He argued that a hundred real thalers are worth more than a hundred imagined ones, so existence adds value.'
        feedback: |
          That is the opposite of his point. The real coins affect my finances, but their concept contains no more than the possible ones; existence is about whether the concept has an instance.
      - text: 'He showed that God cannot exist because no concept implies existence.'
        feedback: |
          Kant's point concerns what the argument can do: derive existence from a concept. It is not a proof that God does not exist.
      - text: 'He accepted the ontological argument but rejected the cosmological one.'
        feedback: |
          He argued that the cosmological argument secretly depends on the ontological one, and he rejected both.
    explanation: |
      Compare: the concept "a cat" and the claim "there is a cat in this room" differ in what they say, not in a property listed in the concept. Defenders reply that for a maximally great being, necessary existence is a different kind of property; the dispute turns on that.

  - type: mcq
    id: parity
    title: "Possible, so actual?"
    prompt: |
      In the modal ontological argument, with $E$ = "a maximally great being exists", the premise is "possibly $E$" ($\Diamond E$) and the logic S5 gives the conclusion $E$. A defender says: "The logic is valid, so the argument proves God." What is the fair summary?
    options:
      - text: 'The logic is valid; the question is the premise. In S5, $\Diamond E$ and $E$ stand or fall together, since the same definition gives $\Diamond\lnot E \Rightarrow \lnot E$. So the mere-possibility premise is exactly as hard to grant as the conclusion.'
        correct: true
      - text: 'The logic is invalid, because "possibly" cannot lead to "actually".'
        feedback: |
          In S5, together with the definition of maximal greatness, it does. Modal logic is a legitimate tool; the question is whether the premise is acceptable.
      - text: 'The premise "possibly $E$" is obviously true, since we can imagine God.'
        feedback: |
          Being able to imagine or describe something is not the same as it being possible in the sense of the argument; the coherence of a maximally great being is the very point in dispute.
      - text: 'Plantinga says the argument proves God to every rational person.'
        feedback: |
          Plantinga himself says such arguments cannot perhaps be said to prove their conclusion, but show it rational to accept for someone who finds the premise rational.
    explanation: |
      The same machinery gives a mirror argument: if it is possible that no maximally great being exists, none does. A critic who finds that premise as plausible as the defender finds the original has a stalemate, which is why the argument is usually read as a test of one's view of the possibility premise.

  - type: build
    id: modus-tollens
    title: "From values to God: which form?"
    prompt: |
      In Craig's moral argument, $M$ = "objective moral values and duties exist" and $G$ = "God exists". The premises are $\lnot G \Rightarrow \lnot M$ and $M$. A student writes "so $\lnot G$, since the first premise starts with $\lnot G$". Build the correct conclusion.
    prefix: '\lnot G \Rightarrow \lnot M,\ \ M\ \ \therefore'
    tiles: ['G', '\lnot G', '\lnot M', 'M']
    answers:
      - ['G']
    wrong:
      - answer: ['\lnot G']
        feedback: |
          This affirms the starting point of the first premise but nothing in the premises supports it. The premise says that without God there would be no objective values; since there are such values, the supposition $\lnot G$ is what gets rejected.
      - answer: ['\lnot M']
        feedback: |
          That contradicts the second premise ($M$).
      - answer: ['M']
        feedback: |
          $M$ is a premise, not a new conclusion; the question is what follows from the two premises.
    hint: 'If "no God" leads to "no values", and there are values, then "no God" is ruled out.'
    explanation: |
      This is modus tollens: from $A \Rightarrow B$ and $\lnot B$ infer $\lnot A$ (here $A = \lnot G$, $B = \lnot M$, and $M$ means $B$ fails). The form is valid, so a critic must reject a premise: either $M$ (as in Mackie's error theory) or the first premise (as in godless moral realism, Wielenberg).

  - type: mcq
    id: genetic
    title: "Evolved, so false?"
    prompt: |
      A debunker says: "Our moral beliefs were shaped by evolution, so they are not objectively true." A defender of the moral argument says: "And our belief in logic was shaped by evolution too." Which statement is fair?
    options:
      - text: 'Showing where a belief came from does not by itself show it false (the genetic fallacy). The debunker must also show that the origin is unconnected to truth, and the defender faces a parallel question about the origin of our reasoning, as in the argument from reason.'
        correct: true
      - text: 'Origin never matters: a belief with an unreliable origin is still reliable.'
        feedback: |
          Origin can matter as evidence about reliability. Evolutionary debunking arguments (Street) are serious because they ask whether the origin tracks truth.
      - text: 'Evolution shows that morality is subjective, so the moral argument ends.'
        feedback: |
          Evolutionary accounts explain why we have moral beliefs, which is compatible with objectivity (a godless realist can say we evolved to detect real moral facts). Whether they undercut objectivity is the debate.
      - text: 'Only the defender is in trouble from the origin question.'
        feedback: |
          The question applies in both directions, which is why this trap is double-edged: a theist must also say why our faculties, however originated, can be trusted.
    explanation: |
      The origin of a belief is evidence about its reliability only when it tells us something about the link between the process and the truth. That link is what both sides then argue about.

  - type: mcq
    id: chance
    title: "Selection is just luck?"
    prompt: |
      A critic of Darwin says: "Evolution claims that the eye came about by chance, and chance cannot produce such order." What is wrong with the objection?
    options:
      - text: 'Natural selection is not pure chance. Variation among offspring is random, but which variants leave more offspring is not: heritable variation plus differential reproduction, repeated over many generations, accumulates small advantages. The filtering is not chance.'
        correct: true
      - text: 'Nothing is wrong: the theory does say that all of it is chance.'
        feedback: |
          Only the variation is treated as random; the sorting by reproductive success is systematic. That is why the Blind Watchmaker is "blind" (no foresight) without being a gambler.
      - text: 'Darwin proved that there is no designer.'
        feedback: |
          Selection explains the appearance of design in living things without a mind. It does not show that there is no designer behind the laws and conditions that make selection possible, which is the level-shifting reply.
      - text: 'The objection is right, but chance is more likely than design.'
        feedback: |
          The objection misdescribes the theory. Weighing explanations needs prior odds as well as likelihoods, as the odds form of Bayes' rule shows.
    explanation: |
      The same word, "chance", hides two things: no purpose, and no pattern. Selection has no purpose but a clear pattern (what helps reproduction spreads). Whether the laws and conditions behind it need explaining is a separate question.

  - type: mcq
    id: eaan-evolution
    title: "Does Plantinga attack evolution?"
    prompt: |
      Alvin Plantinga's evolutionary argument against naturalism is sometimes summarised as "Plantinga says evolution is false." Which statement is correct, according to Plantinga?
    options:
      - text: 'He argues against the *combination* of naturalism and evolution ($N\&E$): the probability of reliable faculties given $N\&E$ is low or inscrutable, which gives a defeater for trusting those faculties, including belief in $N\&E$ itself.'
        correct: true
      - text: 'He argues that evolution cannot happen.'
        feedback: |
          That is not the argument. The target is the conjunction of naturalism with evolution, not the biological theory taken alone.
      - text: 'He argues that human beliefs are always false.'
        feedback: |
          The argument is about whether we can trust our faculties given $N\&E$; it does not claim that every belief is false.
      - text: 'He proves that God exists.'
        feedback: |
          At most it casts doubt on $N\&E$. Critics reply that it gives no proof of God and that the defeater step and the probability claim are both contested.
    explanation: |
      Critics reply, for instance, that selection plausibly rewards reliable cognition (true maps and predictions help survival), that the probability is not low, or that a theist faces a parallel worry. The argument is aimed at a combination of views, not at one scientific theory.

  - type: mcq
    id: cause-reason
    title: "If a cause made you believe it, is it false?"
    prompt: |
      A reader of C. S. Lewis says: "If every belief has a physical cause, then none can be true, since a cause is not a reason." What is the distinction that the reply to this needs?
    options:
      - text: 'A cause is what makes a belief occur; a reason is what supports it as true. A belief can have both: the physical causes of a person reasoning well and the reasons for the conclusion are not rivals. Elizabeth Anscombe (1948) pressed that Lewis''s wording ran such meanings together, and he revised the argument in 1960.'
        correct: true
      - text: 'Beliefs have causes, never reasons.'
        feedback: |
          People do have reasons for beliefs (evidence, proofs). The question is whether a purely natural story can include them.
      - text: 'If a belief has a cause it is automatically true.'
        feedback: |
          A cause of a belief does not guarantee that it is true. Wishful thinking has causes too, and is a poor guide to truth.
      - text: 'Causes and reasons are the same thing.'
        feedback: |
          Collapsing them is the very mistake. A cause explains why you believe; a reason shows why you are right to.
    explanation: |
      The argument from reason survives, in its better versions, as the question whether non-rational causes can fully explain reasoning that is responsive to reasons. Naturalists reply that they can, and the debate continues.

  - type: mcq
    id: ladder
    title: "How far does the conclusion go?"
    prompt: |
      A defender of the argument from contingency says: "So the argument shows that the God of Christianity exists." Which reply is fair?
    options:
      - text: 'At most it reaches a necessary ground of contingent things. It does not by itself give a person, goodness, one God, or a particular religion; each of those is a further rung needing further premises (and this holds for the other arguments in the level too).'
        correct: true
      - text: 'It reaches exactly the God of Christianity, because the argument was invented by Christians.'
        feedback: |
          Where an argument came from does not decide what it shows. The argument appears in Muslim philosophy (Ibn Sina) and in Leibniz and Aquinas; what it reaches depends on its premises.
      - text: 'It reaches nothing, since an argument for a necessary being is meaningless.'
        feedback: |
          If the premises hold, it reaches a necessary being. Whether the premises hold is the debate.
      - text: 'It reaches God as defined by theism, but only for Christians.'
        feedback: |
          A sound argument would not depend on religion; the point is that the conclusion is a thin one (a necessary ground) that other religions and philosophers may also accept.
    explanation: |
      The ladder is the same for the kalam argument (a cause of the universe's beginning), the design argument (a mind or minds), the moral argument (a source of moral value) and the ontological argument (a maximally great being). A religion adds its own claims on top.

  - type: numeric
    id: product
    title: "Premises are not added"
    prompt: |
      A reader's credences for a valid two-premise argument are $P(\text{P1}) = 0.9$ and $P(\text{P2}) = 0.6$, independent. A student says: "The argument is about as likely as its weaker premise, so $0.6$," or "$0.9 + 0.6 = 1.5$". What probability do both premises hold together?
    answer: 0.54
    tolerance: 0.005
    wrong:
      - { value: 0.6, feedback: "That ignores the chance that P1 fails when P2 holds. For independent premises, both must hold, so the chances multiply." }
      - { value: 1.5, feedback: "A probability cannot exceed $1$. Credences do not add; for independent premises they multiply." }
    hint: "For independent events, $P(A \\text{ and } B) = P(A) \\times P(B)$."
    explanation: |
      $0.9 \times 0.6 = 0.54$. Because the argument is valid, this number is a lower bound on the probability of the conclusion: the conclusion could still be true if a premise fails, for another reason. The lesson for every argument in the level is that a chain of fairly plausible premises can be weak as a whole.

  - type: numeric
    id: odds
    title: "Likelihood ratio times prior odds"
    prompt: |
      Compare two explanations $D$ and $S$ of some evidence $E$. Before $E$, a reader's odds are $P(D):P(S) = 1:4$ (that is, $P(D)/P(S) = 0.25$). The evidence is $6$ times as likely under $D$ as under $S$. A student says "so $D$ is now $6$ times as likely". What are the posterior odds $P(D\mid E)/P(S\mid E)$?
    answer: 1.5
    tolerance: 0.01
    wrong:
      - { value: 6, feedback: "That is the likelihood ratio alone. It drops the prior odds, so it is only right when the prior odds are $1:1$." }
      - { value: 24, feedback: "The prior odds are $1:4$, so $P(D)/P(S) = 1/4$, not $4$. Multiplying by $4$ turns the prior upside down." }
    hint: "Posterior odds = prior odds $\\times$ likelihood ratio, with prior odds $0.25$."
    explanation: |
      $0.25 \times 6 = 1.5$, i.e. $3:2$ in favour of $D$, or $60\%$ for $D$ if only these two are considered. The prior odds come from everything else a reader thinks, and they are exactly where thoughtful people differ; the likelihood ratio only says how much the evidence shifts them.

  - type: mcq
    id: layers
    title: "Three layers for the level"
    multiple: true
    prompt: |
      Select every statement that is placed in the **right layer** (established fact, scholarly debate, or faith/metaphysical commitment).
    options:
      - text: 'Established (logic): a valid argument cannot have true premises and a false conclusion, and the arguments in this level are generally agreed to be valid in form.'
        correct: true
      - text: 'Live debate: whether the principle of sufficient reason holds for the totality of contingent things, and whether the concept of a maximally great being is coherent.'
        correct: true
      - text: 'Commitment: that the best explanation of the world is God, or that it is a brute fact with none.'
        correct: true
      - text: 'Established: that one of the classical arguments for God is sound.'
        feedback: |
          Soundness is exactly what is disputed; no argument has won agreement among philosophers. Defenders and critics both say so of the premises.
      - text: 'Established: that Darwin''s theory shows there is no designer.'
        feedback: |
          Selection explains adaptation without a mind. Whether a designer lies behind the laws is a layer-3 commitment (or a live debate), not an established result.
    explanation: |
      Keep the layers apart in both directions: do not call a commitment a result, whether for or against, and do not treat valid logic as if it were as disputed as the premises.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Eighteen traps, one pattern: each turned a *useful* idea into a shortcut.

      - **Validity and soundness**: valid means the form forbids true premises with a false conclusion; sound means valid with all premises true. An unsound argument fails to *show* its conclusion; it does not make it false. Premises multiply: $0.9 \times 0.6 = 0.54$, never $0.6$ or $1.5$.
      - **Reach**: theism needs a person who knows, chooses and acts; deism, a creator who does not act, fits a bare first cause equally well. Atheism has a broad sense (lacking belief) and a narrow one (denying God); agnosticism says neither is known.
      - **Cosmological and kalam**: the kalam argument needs a *beginning*; the argument from contingency does not. Kalam's first premise says that whatever *begins to exist* has a cause, not that everything does. Russell's fallacy of composition and Rowe's reply leave the whole open. Hilbert's Hotel moves room $n$ to $2n$ (room $7$ to room $14$).
      - **Ontological**: Kant's hundred thalers say existence adds nothing to a concept. In the modal version, $\Diamond E \Leftrightarrow E$ in S5, so the possibility premise is as hard as the conclusion.
      - **Moral**: $\lnot G \Rightarrow \lnot M$ and $M$ give $G$ by modus tollens; critics reject a premise. Origin is not falsity (the genetic fallacy), and the question cuts both ways.
      - **Design and reason**: selection is blind but not random (variation is random, sorting is not). Plantinga targets $N\&E$, not evolution alone; a cause is not a reason.
      - **Weighing**: posterior odds $=$ prior odds $\times$ likelihood ratio ($0.25 \times 6 = 1.5$), never the ratio alone. Every argument here reaches a low rung of the ladder at most.

      **Next:** *Quick Recall*, the main formulas and distinctions of this level at a glance.
