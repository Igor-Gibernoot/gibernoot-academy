id: ch06-cosmological
title: "Guided proof: The Cosmological Argument"
kind: guided
proof: true
own: |
  The setting: the *argument from contingency* (the Leibnizian cosmological argument) tries to go from the existence of **contingent** things (things that exist but could have failed to exist) to a **necessary** being (one that exists and could not have failed to exist) that explains them. Write $\mathrm{Cont}(x)$ for "$x$ is contingent" and $\mathrm{Expl}(y,x)$ for "$y$ explains $x$". Let $T$ be the *totality*: all contingent things taken together (or, in the fact version, the conjunction of all contingent truths).
  - **P1, the principle of sufficient reason (PSR) for contingent things.** According to Leibniz (1646-1716), nothing is real or true without a reason why it is so and not otherwise; in the form used here:
  {{ $$\forall x\,\big(\mathrm{Cont}(x)\Rightarrow\exists y\ \mathrm{Expl}(y,x)\big)$$ }}
  - **P2 and P3.** P2: $T$ is itself contingent, because had any one member not existed the totality would have been different. P3: no member of $T$ can explain $T$ (it would be part of what it explains). From P1 and P2, $T$ has an explanation; with P3 the argument is *valid*. Its conclusion, with $n$ a being outside $T$, is
  {{ $$\exists n\,\big(\neg\,\mathrm{Cont}(n)\wedge \mathrm{Expl}(n,T)\big)$$ }}
  that is, a necessary being explains the totality of contingent things.
  - **Where critics push.** *Against P1:* Russell (1948) and Hume's Cleanthes (1779) say the totality may be a *brute fact*, with no explanation, and that explaining each member already explains the whole (the *fallacy of composition* charge: what holds of each part need not hold of the whole). Rowe (1975) replies that explaining every member does not explain why there are any members at all. Aquinas's Third Way (Summa Theologiae I, q. 2, a. 3) runs without the PSR but needs a step from "each thing might not exist" to "at some time nothing existed", which readers dispute.
  - **The collapse worry (van Inwagen, 1983).** Let $E$ be the explanation of $T$. If $E$ is contingent it is a member of $T$ (against P3); if $E$ is necessary and guarantees $T$, then, writing $\Box$ for "it is necessary that",
  {{ $$\Box E\ \wedge\ \Box(E\Rightarrow T)\ \Rightarrow\ \Box T$$ }}
  so $T$ would be necessary and every truth necessary, which contradicts the starting point. Pruss replies that "sufficient" need not mean "logically guaranteeing", for example when a free choice explains without entailing. Kant argued that the argument secretly depends on the ontological argument.
  - **What it reaches.** At most a necessary ground of contingent things. It does not by itself give a person, goodness, one God, or a religion, and it survives an universe with no beginning, which is why the kalam argument (the case that the universe began to exist) is a different argument. People part ways on whether {{ the totality needs an explanation at all }}.
cards:
  - type: mcq
    id: hook
    title: "Guess: an endless chain"
    prompt: |
      Guess before any theory. Picture a chain of causes running back forever: this event was caused by an earlier one, that by an earlier one, with no first event. Someone says: "Every single event in the chain has a cause, so nothing in the chain is unexplained." Which statement is **true whichever side you take**?
    options:
      - text: 'Showing that every member of the chain has a cause does not, by itself, settle whether the chain as a whole needs a further reason. That is exactly the point in dispute.'
        correct: true
        feedback: |
          Right. Some philosophers (Hume's character Cleanthes, Russell) say that once every member is explained, the whole is explained. Others (Leibniz, Rowe) say a reason is still owed for why the chain exists at all. The lesson builds the second view as an argument and then tests it.
      - text: 'A chain with no first member is impossible, so there must be a first cause.'
        feedback: |
          Many thinkers do argue this, but others hold that an endless chain is perfectly possible (some physicists consider models with no beginning). The lesson will show that the best-known version of the argument does *not* need a first member.
      - text: 'If every member has a cause, the whole chain must obviously have a cause outside itself.'
        feedback: |
          This is the conclusion the argument wants, not something obvious. The inference from "each part" to "the whole" is exactly what critics question, as we will see.
    explanation: |
      The cosmological argument is about **explanation**, not only about time. Whether "each part is explained" gives "the whole is explained" is the fork where people part ways.

  - type: text
    id: family
    title: "A family of arguments"
    image:
      src: img/aquinas.webp
      alt: Painted portrait of Thomas Aquinas in a black and white Dominican habit on a gold background, by Carlo Crivelli
      caption: Thomas Aquinas (1225-1274), an Italian Dominican friar and theologian, in a panel Carlo Crivelli painted in 1476 (National Gallery, London); his Third Way is a classic argument from contingency.
      credit: "Carlo Crivelli, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Aquinas_by_Carlo_Crivelli.png"
      place: bottom
    body: |
      A **cosmological argument** starts from a very general fact about the world (that things exist, move, or depend on others) and argues to a first or ultimate cause or ground. It is a family, not one argument.

      - Arabic philosophers such as Ibn Sina (c. 980-1037) developed the **argument from contingency**, according to the Stanford Encyclopedia of Philosophy.
      - Thomas Aquinas (1225-1274) gave a version in his *Summa Theologiae* (Part I, question 2, article 3), the "Third Way".
      - Gottfried Leibniz (1646-1716) gave the modern form built on the **principle of sufficient reason**.
      - Al-Ghazali (1058-1111) argued that whatever begins to exist needs a cause of its beginning. That is a different branch, the *kalam* argument, met in the next lesson.

      This lesson builds the **contingency** form, step by step, and then tests each step. A "guided proof" means: numbered premises, a separate check that the logic is valid, and then the question for each premise: *which critic rejects it, and why?*

  - type: text
    id: series
    title: "Two kinds of chain"
    body: |
      A chain of causes can be of two very different kinds.

      - **A chain in time** (the Latin phrase is *per accidens*, "by accident"): your grandfather fathered your father, who fathered you. Each member needs the previous one only to *get started*; your father could go on existing after your grandfather's death. According to the Stanford Encyclopedia, defenders of the argument allow such a chain to be endless without trouble.
      - **A chain of present dependence** (*per se*, "by itself"): a stone is held up by a stick, the stick by a hand, the hand by an arm. At *this very moment* each member holds only because the one before it is doing its job. If no member of the chain has the power to hold the stone on its own, an endless chain gives no power at all. Defenders say such a chain cannot be endless.

      Critics ask whether real physical or metaphysical dependence is ever of the second kind. Keep the distinction in mind: Leibniz's argument does not depend on it.

  - type: mcq
    id: series-q
    title: "Which chain is a chain of present dependence?"
    prompt: |
      Which of these is a chain of **present dependence** (each member relies, right now, on the next one), rather than a chain in time?
    options:
      - text: 'A book rests on a shelf, the shelf on a bracket, the bracket on a wall: at this moment each is held up by the next.'
        correct: true
        feedback: |
          Yes. Remove the support at any point and everything above it falls now. That is dependence at the present moment.
      - text: 'Each person''s parents, and their parents, and so on back through the generations.'
        feedback: |
          This is a chain in time. A person does not need their parents to exist at this moment; the parents were needed to produce them.
      - text: 'A row of dominoes toppled one after another.'
        feedback: |
          Each domino falls because the earlier one fell, but once it is falling it no longer needs the earlier one. That is a chain in time.
    explanation: |
      The difference: in a chain in time the earlier members can disappear and the later ones carry on; in a chain of present dependence the later members vanish the moment the support is withdrawn.

  - type: text
    id: terms
    title: "Contingent, necessary, and the PSR"
    image:
      src: img/leibniz.webp
      alt: "Oil portrait of Gottfried Wilhelm Leibniz in a long curled wig"
      caption: "Gottfried Wilhelm Leibniz (1646–1716) in an oil portrait by Christoph Bernhard Francke, painted around 1695 and held by the Herzog Anton Ulrich Museum in Braunschweig."
      credit: "Christoph Bernhard Francke, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Christoph_Bernhard_Francke_-_Bildnis_des_Philosophen_Leibniz_(ca._1695)_(cropped).jpg"
      place: bottom
    body: |
      Recall three terms.

      - A being (or fact) is **contingent** if, although it exists (or is true), it could have failed to exist (or been false). A **necessary** being exists and could not have failed to exist.
      - To **explain** something is to give the reason why it exists or is so. We write $\mathrm{Expl}(y,x)$ for "$y$ explains $x$".
      - According to Leibniz (*Monadology*, 1714), the **principle of sufficient reason** (PSR): no fact can be real or existing, and no statement true, without a sufficient reason for its being so and not otherwise.

      Write $\mathrm{Cont}(x)$ for "$x$ is contingent". Leibniz's argument needs the PSR only for contingent things. Let the **totality** $T$ be *all contingent things taken together*.

  - type: build
    id: p1-build
    title: "Build the first premise"
    prompt: |
      Write P1 as a formula, using $\mathrm{Cont}(x)$ = "$x$ is contingent" and $\mathrm{Expl}(y,x)$ = "$y$ explains $x$". P1 says: for every $x$, if $x$ is contingent, then some $y$ explains it.
    prefix: ''
    tiles: ['\forall x', '\mathrm{Cont}(x)', '\Rightarrow', '\exists y', '\mathrm{Expl}(y,x)', '\exists x', '\forall y']
    answers:
      - ['\forall x', '\mathrm{Cont}(x)', '\Rightarrow', '\exists y', '\mathrm{Expl}(y,x)']
    wrong:
      - answer: ['\forall x', '\mathrm{Cont}(x)', '\Rightarrow', '\forall y', '\mathrm{Expl}(y,x)']
        feedback: |
          "$\forall y$" says that *everything* explains $x$. P1 only asks that *some* explainer exists: $\exists y$.
      - answer: ['\exists x', '\mathrm{Cont}(x)', '\Rightarrow', '\exists y', '\mathrm{Expl}(y,x)']
        feedback: |
          "$\exists x$" would say only that *some* contingent thing has an explanation. The PSR is a claim about *every* contingent thing: $\forall x$.
    hint: 'Every contingent $x$ has at least one explainer: one universal quantifier, then one existential.'
    explanation: |
      $$\forall x\,\big(\mathrm{Cont}(x)\Rightarrow\exists y\ \mathrm{Expl}(y,x)\big)$$
      Read it aloud: "for every $x$, if $x$ is contingent then there exists a $y$ that explains $x$".

  - type: text
    id: argument
    title: "The argument in five steps"
    body: |
      Here is the argument in a standard modern form, following Leibniz (the stages of §§32-38 of the *Monadology*, according to the Stanford Encyclopedia). Let $T$ be the totality of contingent things.

      - **P1.** Every contingent thing has an explanation.
      - **P2.** $T$ is itself contingent. (If any one member had not existed, the totality would have been different.)
      - **P3.** No member of $T$ can explain $T$. (A member would be part of what it explains.)
      - **Step.** From P1 and P2: $T$ has an explanation.
      - **C.** That explanation is not in $T$, so it is not contingent: **a necessary being explains the totality of contingent things.**

      Two checks are separate. **Validity**: if the premises were true, would the conclusion follow? **Soundness**: are the premises true? We test validity first, and then ask of each premise which critic rejects it.

  - type: order
    id: argument-order
    title: "Put the argument in order"
    prompt: Put the steps of the contingency argument in order.
    steps:
      - 'P1: Every contingent thing has an explanation.'
      - 'P2: The totality $T$ of contingent things is itself contingent.'
      - 'So, from P1 and P2, $T$ has an explanation.'
      - 'P3: No member of $T$ can explain $T$, since it would be part of what it explains.'
      - 'C: The explanation lies outside $T$, so it is not contingent: a necessary being.'
    hint: 'The explanation of $T$ is first shown to exist, then shown to lie outside $T$.'
    explanation: |
      The explanation must *exist* (P1 applied to $T$ through P2) before we can ask *where* it lies (P3 and then C). Each step uses only what comes before it.

  - type: mcq
    id: validity
    title: "Valid, not yet sound"
    prompt: |
      Suppose P1, P2 and P3 were all true. What follows about the conclusion C, and what does that tell us about the argument's strength?
    options:
      - text: 'C would have to be true, since the argument is valid. The whole debate is therefore about whether the premises are true.'
        correct: true
        feedback: |
          Right. Validity means the form guarantees the conclusion given the premises. Philosophers who reject the argument therefore reject a premise (or argue the form hides an extra assumption); they do not dispute the step itself.
      - text: 'C could still be false, because proofs about existence can never be valid.'
        feedback: |
          Nothing special about "existence" breaks validity here. The step is ordinary logic: something exists that explains $T$, and it cannot be a member of $T$. The weakness, if any, is in the premises.
      - text: 'C would be true, which proves that God exists.'
        feedback: |
          Validity gives C only if the premises are true, and C says only "a necessary being explains $T$". It does not say that being is a person, good, or the God of any religion.
    explanation: |
      Keep "valid" and "sound" apart. A valid argument with a doubtful premise is not a proof; and an unsound argument does not show its conclusion false.

  - type: mcq
    id: p1-q
    title: "Which premise would a critic reject first?"
    prompt: |
      Russell, in a BBC radio debate with Frederick Copleston (28 January 1948), held in essence that the universe "is just there": its existence needs no explanation. Which premise of the argument does this reject?
    options:
      - text: 'P1 (the PSR): it says every contingent thing has an explanation, and the critic holds that the totality is a brute fact, a fact with no explanation.'
        correct: true
        feedback: |
          Yes. A *brute fact* is one that simply is, with no explanation. If the totality (or the universe) is brute, then P1 fails for $T$. The defender replies that this makes the world's existence a mystery with no reason at all, which the PSR forbids.
      - text: 'P3: it says no member can explain $T$, and the critic holds that some member can.'
        feedback: |
          That is a different reply (a member of $T$ explaining $T$ would be explaining itself in part). Russell's point was about whether any explanation is needed, not about who gives it.
      - text: 'The validity step: Russell held that the form of the argument was invalid.'
        feedback: |
          Russell did not attack the logical form. He doubted that the premises hold for the universe as a whole.
    explanation: |
      Two readings, both serious: Leibniz's side says a reason is owed for why there is a universe at all; Russell's side says explanations stop somewhere and nothing shows the stopping point must lie outside the universe.

  - type: text
    id: composition
    title: "Parts and whole: Hume, Russell, Rowe"
    body: |
      In Hume's *Dialogues Concerning Natural Religion* (1779, Part IX), the character Cleanthes replies to the argument roughly as follows: if you have found the cause of each of twenty particles, it is unreasonable to ask for the cause of the whole twenty; the whole is explained once the parts are. Russell made a related charge in 1948, using the example that every human being has a mother, but it does not follow that the human race as a whole has a mother. This is the charge of the **fallacy of composition**: inferring that something true of each part is true of the whole.

      A reply in modern form (William Rowe, 1975): explaining each member of the collection still leaves unexplained **why there are any members at all**. Telling the cause of each particle does not say why those twenty particles exist rather than none.

  - type: mcq
    id: composition-q
    title: "Parts and whole"
    prompt: |
      Which pair shows that an inference from "every part has the property" to "the whole has the property" is sometimes valid and sometimes not?
    options:
      - text: 'Valid: every brick in a wall is red, so the wall is red. Invalid: every person has a mother, so the human race as a whole has a mother.'
        correct: true
        feedback: |
          Yes. Whether the property passes from parts to whole depends on the property. "Red" is shared by the whole; "having a mother (who is not a member of the collection)" does not obviously pass up. So the critic must argue about *explanation* in particular, and so must the defender.
      - text: 'Valid: every person has a mother, so the human race has a mother. Invalid: every brick is red, so the wall is red.'
        feedback: |
          This reverses the pattern. Bricks all red gives a red wall. The human-race inference is the doubtful one.
      - text: 'Both are always invalid, since a whole is never like its parts.'
        feedback: |
          Too strong. Sometimes the whole does share a property of its parts (colour), sometimes not (mass: each brick weighs under a kilogram, the wall does not). The inference must be checked property by property.
    explanation: |
      So "fallacy of composition" is a *warning*, not a refutation. The defender's claim is that *needing an explanation* behaves like "weighs a lot", not like "is red": for contingent things the need spreads to the totality, because the totality is itself contingent (P2). Whether that is right is the heart of the debate.

  - type: mcq
    id: p2-q
    title: "Why is the totality contingent?"
    prompt: |
      P2 says the totality $T$ of contingent things is itself contingent. According to the argument, what is the reason?
    options:
      - text: 'Had any one member of $T$ failed to exist (and each could have), the totality would have been a different totality; so $T$ could have been otherwise.'
        correct: true
        feedback: |
          Yes. Each member could have failed to exist, so the collection could have lacked it. A collection that could have been different is not necessary.
      - text: 'Because $T$ is made of many things, and many things are always contingent.'
        feedback: |
          Having many parts does not by itself make something contingent. The argument needs that the parts *could have been absent*, not that they are many.
      - text: 'Because $T$ has a beginning in time.'
        feedback: |
          Contingency is not about beginning. A universe without a beginning could still be contingent (it could have not existed, or been otherwise). That is why this argument is different from the kalam argument.
    explanation: |
      A critic can reply that although every member could have been absent, the whole might still exist necessarily (some views of the universe or its laws, for instance Spinoza's, make it necessary). That rejects P2.

  - type: mcq
    id: third-way
    title: "Aquinas's Third Way: the step in question"
    prompt: |
      The Third Way (Summa Theologiae I, q. 2, a. 3) argues, in essence, that things we see come and go, so each could fail to exist; if everything could fail to exist, then at some time nothing existed; and then nothing would exist now, which is false; so something exists necessarily. Which step do many readers dispute?
    options:
      - text: 'From "each thing could fail to exist at some time" to "there was a time when *all* things failed to exist together".'
        correct: true
        feedback: |
          Yes. This step is often called a quantifier shift: from "for every thing there is a time when it does not exist" to "there is a time when for every thing it does not exist". Compare: every person has a mother, but there is no one mother of everyone. Some defenders argue that Aquinas does not need this step on a charitable reading.
      - text: 'From "something exists now" to "the argument is about now".'
        feedback: |
          That is harmless. The existence of the present world is the data the argument starts from.
      - text: 'From "a necessary being exists" to "it is conceivable".'
        feedback: |
          That is not a step of the Third Way. (A relation of the cosmological argument to conceivability is Kant's worry, met below.)
    explanation: |
      Leibniz's form, which we have built, avoids this step: it needs no moment when nothing existed. It uses the PSR instead. So the two forms have different weak points: the Third Way's is the time-step; Leibniz's is the PSR.

  - type: text
    id: collapse
    title: "The collapse worry"
    body: |
      Peter van Inwagen (1983) pressed a deeper objection to the PSR itself, according to the Stanford Encyclopedia. Let $T$ be the conjunction of all contingent truths, and let $E$ be whatever explains $T$.

      - If $E$ is **contingent**, it is one of the truths in $T$, so it would explain itself in part; that is excluded by P3.
      - If $E$ is **necessary**, a necessary fact explaining $T$ seems to guarantee it: if $E$ is necessary and necessarily brings $T$ about, then, writing $\Box$ for "it is necessary that",

      $$\Box E\ \wedge\ \Box(E\Rightarrow T)\ \Rightarrow\ \Box T$$

      so $T$ would be necessary after all, and so would all truths: *everything would be necessary*. That contradicts our starting point that some things are contingent. So, he concluded, the PSR is false.

  - type: mcq
    id: collapse-q
    title: "What would the necessary explainer force?"
    prompt: |
      Take van Inwagen's step: $E$ is necessary, and necessarily, if $E$ holds then $T$ holds. Why would that make the totality $T$ necessary?
    options:
      - text: 'Because whatever is guaranteed by something that could not have been otherwise could not have been otherwise either: $T$ could not have been false.'
        correct: true
        feedback: |
          Yes. If $E$ cannot fail, and $E$ forces $T$, then $T$ cannot fail. That is the collapse into necessity: contingent truths would turn out to be necessary.
      - text: 'Because $E$ is contingent, so $T$ is too.'
        feedback: |
          The case assumed $E$ is necessary. The contingent case is the other branch (excluded by P3).
      - text: 'Because $T$ is made of necessary parts.'
        feedback: |
          The parts of $T$ were contingent by definition. The worry is about what a necessary explainer does to $T$ as a whole.
    explanation: |
      This worry targets P1 (the PSR) for contingent things: if the PSR forced a necessary explainer to guarantee $T$, nothing would be contingent.

  - type: mcq
    id: pruss
    title: "A reply: what 'sufficient' can mean"
    prompt: |
      Alexander Pruss (*The Principle of Sufficient Reason: A Reassessment*, 2006) replies, in essence, that the word "sufficient" can be read in two ways. Which reading blocks the collapse?
    options:
      - text: 'An explanation need not logically guarantee what it explains: for example a free choice can explain an outcome without entailing it. So $E$ may be necessary and still not force $T$.'
        correct: true
        feedback: |
          Yes. Pruss, according to the Stanford Encyclopedia, holds that free actions explain without entailing the contingent states they bring about. Critics reply that this relies on a being with free will, which the argument is supposed to reach, not assume.
      - text: 'A reason is sufficient only if it is contingent.'
        feedback: |
          That would reintroduce the first branch (a contingent explainer inside $T$), which P3 excludes.
      - text: '"Sufficient" means "sufficient for us to understand".'
        feedback: |
          The principle is about what makes the fact so, not about what human beings can follow. Some defenders accept that we may never know the reason.
    explanation: |
      A fair summary: the collapse worry is a live debate. If an explanation must entail, the PSR looks too strong; if it need not, the defender needs an account of non-entailing explanation, which its critics doubt.

  - type: text
    id: kant
    title: "Kant: does it hide the ontological argument?"
    image:
      src: img/kant.webp
      alt: "Painted portrait of Immanuel Kant, around 1790"
      caption: "Immanuel Kant (1724-1804) spent his life in Königsberg and published the Critique of Pure Reason in 1781."
      credit: "Unknown, possibly Elisabeth von Stägemann (Anton Graff school), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Immanuel_Kant_portrait_c1790.jpg"
      place: bottom
    body: |
      Immanuel Kant (1724-1804), in the *Critique of Pure Reason* (first edition 1781, second 1787), contended that the cosmological argument depends on, or presupposes, the **ontological argument** (the argument, studied in a later lesson, that God's existence follows from the very idea of a perfect being), according to the Stanford Encyclopedia.

      In simple terms: the cosmological argument reaches "a necessary being exists". To say what *kind* of thing is necessary, the defender seems to need that some concept applies to a being whose nature includes existing. Kant's charge is that this step is the ontological argument in disguise, and if that argument fails, so does this one. A defender can reply that the conclusion needs only *that* a necessary explanation exists, not a proof from a concept.

  - type: mcq
    id: kant-q
    title: "What does Kant's charge say?"
    prompt: |
      Which statement best captures Kant's charge against the cosmological argument?
    options:
      - text: 'Its final step, a being whose existence is necessary, rests on the same reasoning as the ontological argument, so it stands or falls with it.'
        correct: true
        feedback: |
          Yes. In essence, Kant held that the cosmological argument does not escape the ontological one. Whether he is right is contested.
      - text: 'Cause and effect only apply to things we experience, so no argument can reach beyond the world; that is the whole of his objection.'
        feedback: |
          Kant did argue that the category of cause applies only within experience, but that is a different objection. The specific charge asked about is the dependence on the ontological argument.
      - text: 'The argument is invalid because it moves from a chain to a first cause.'
        feedback: |
          That is not Kant''s point, and the contingency form has no first-member step. His complaint is about the concept of a necessary being.
    explanation: |
      Notice how the objections fit the argument: Russell and Hume hit P1 (and the part-whole step), Spinoza-like views hit P2, van Inwagen hits the PSR in P1, Kant hits the meaning of the conclusion.

  - type: mcq
    id: necessary-universe
    title: "A rival way out"
    prompt: |
      A thinker holds that the universe (or its basic laws) exists **necessarily**, so it needs no outside explainer; this is close to the view of Spinoza (1632-1677), for whom God is identical with Nature. Which premise of the argument does this reply reject?
    options:
      - text: 'P2: the totality of contingent things is not contingent, because the universe is necessary and so is not "a totality of contingent things" at all.'
        correct: true
        feedback: |
          Yes. If the whole is necessary, no outside explainer is needed, and the argument stops. The defender replies that each part of a necessary whole looks contingent (it could have been absent), so the whole cannot be necessary.
      - text: 'P3: a member of $T$ can explain $T$.'
        feedback: |
          The reply does not claim that a member explains the whole; it denies that the whole needs explaining by anything outside.
      - text: 'The validity of the step from P1 and P2.'
        feedback: |
          The step is valid. The reply changes what P2 says about the world.
    explanation: |
      So the argument can be resisted at three places (P1, P2, P3), plus the validity check and the meaning of the conclusion. Each has defenders and critics. Note also that Spinoza's view agrees with the conclusion's *form* (there is something necessary) while rejecting the *theistic* reading.

  - type: mcq
    id: reach
    title: "How far does the conclusion go?"
    prompt: |
      Suppose the contingency argument is sound. What does it establish?
    options:
      - text: 'That there is a necessary being that explains the totality of contingent things. Further questions (is it one, a person, good, the God of a religion?) need further arguments.'
        correct: true
        feedback: |
          Yes. This is the ladder of conclusions from the theism lesson: some ground, necessary, mind, perfectly good, one religion. The contingency argument reaches the low rungs at most.
      - text: 'That a loving God created the universe and answers prayers.'
        feedback: |
          Those are separate claims. The argument gives an explainer; it says nothing yet about love or prayer.
      - text: 'That the universe had a beginning in time.'
        feedback: |
          No. The argument works as well for a universe with no beginning. That is a different argument (kalam), met next.
    explanation: |
      A critic who accepts the argument could still say the necessary being is mindless: for instance the laws or the universe itself, if one accepted that it is not a member of $T$. Theists reply with further arguments (design, mind, morality) that are the topic of later lessons.

  - type: numeric
    id: soundness
    title: "How strong is a chain of premises?"
    prompt: |
      A reader gives P1 probability $0.6$, P2 probability $0.8$ and P3 probability $0.9$, treating them as independent. The argument is valid. What is the probability that all three premises are true, so that the argument is sound?
    answer: 0.432
    tolerance: 0.001
    answerText: '0.432'
    wrong:
      - value: 0.9
        feedback: |
          That is just the strongest premise. All three must hold together, so multiply the three probabilities.
      - value: 0.767
        feedback: |
          That is the average, $(0.6+0.8+0.9)/3$. Independent premises must all be true, so the probabilities multiply.
    hint: 'All three must hold; for independent events multiply.'
    explanation: |
      $$0.6\times 0.8\times 0.9 = 0.432$$
      Even if each premise is more likely than not, the chance that all hold can be under one half. The result depends on the numbers the reader gives and on independence (the premises are not really independent: a reader's view of P1 shapes their view of P2). The point is not a verdict but that a valid argument is as strong as its weakest, combined premises.

  - type: mcq
    id: kalam
    title: "Why the next argument is different"
    prompt: |
      Suppose the universe had no beginning: an endless series of past events. Which argument is still available, and which fails at once?
    options:
      - text: 'The contingency argument still asks why the whole series exists at all; the kalam argument ("whatever begins to exist has a cause; the universe began to exist") fails at its second premise.'
        correct: true
        feedback: |
          Yes. Leibniz's own version handles a series with no first member: the reason must be found outside the whole series. The kalam argument needs a beginning.
      - text: 'Both fail, because an endless series cannot exist.'
        feedback: |
          Whether an endless series is possible is itself debated, and the contingency argument does not assume it is impossible.
      - text: 'Both still work equally well.'
        feedback: |
          The kalam argument depends on the universe having begun. Without a beginning, its second premise is false.
    explanation: |
      This is why the lessons separate the arguments: the contingency argument asks about **dependence**, the kalam argument about **beginning**.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the kalam argument. Its second premise, that the universe began to exist, is a question for physics (the Big Bang and models without a beginning) as well as for philosophy, and its first premise, that whatever begins to exist has a cause, has its own defenders and critics.
