id: ch06-kalam
title: "The Kalam Argument"
kind: concept
own: |
  The setting: the *kalam* argument tries to show that the universe has a cause because it **began to exist**. Write $u$ for the universe (all of space, time and matter), $\mathrm{Beg}(x)$ for "$x$ begins to exist" and $\mathrm{Cause}(y,x)$ for "$y$ is a cause of $x$'s existence". It is a *different* argument from the one from contingency: it needs a beginning.
  - **The argument (according to William Lane Craig, who defends it).** P1: whatever begins to exist has a cause. P2: the universe began to exist. C: the universe has a cause.
  {{ $$\forall x\,\big(\mathrm{Beg}(x)\Rightarrow\exists y\ \mathrm{Cause}(y,x)\big)$$ }}
  $$\mathrm{Beg}(u)\quad\text{so}\quad\exists y\ \mathrm{Cause}(y,u)$$
  The step from P1 and P2 to C is valid; the debate is whether P1 and P2 are true.
  - **P1.** Its support is the intuition that something cannot come from nothing. Critics (Oppy, Morriston) doubt the intuition reaches the universe as a whole; the quantum objection says some events have no cause, and Craig replies that being unpredictable is not the same as being uncaused, and that a quantum vacuum is not nothing.
  - **P2, philosophical branch** (from John Philoponus, c. 490-c. 570, taken up by the *mutakallimun* and defended by Craig): an actual infinite cannot exist, so an infinite past of events cannot exist. Hilbert's Hotel: with every room occupied, guests can still be added, since the guest in room $n$ moves to
  {{ $$\text{room } 2n,\ \text{freeing all odd rooms}$$ }}
  Replies: such results are the defining features of infinite sets (Cantor), and past events do not coexist like rooms.
  - **P2, physical branch.** Let $a(t)$ be the scale factor (the cosmic size at time $t$, $a=1$ today) and $H=\dot a/a$ the expansion rate. The Borde-Guth-Vilenkin theorem says that if the expansion rate averaged along a past path is positive,
  {{ $$H_{\text{av}}>0$$ }}
  then that path cannot be extended back forever (the spacetime is past-incomplete). It is a classical result; whether it means a *first moment* or only the edge of our description is disputed, and some models (bounce, emergent) escape its premise.
  - **What C reaches.** At most a cause of the universe's beginning. Craig adds a further step, that the cause is personal, which is beyond the argument (Morriston objects). A past with no beginning would leave the contingency argument standing but make P2 false. If a critic's credences are $P(\text{P1})=0.95$ and $P(\text{P2})=0.7$ and the two are independent, then, since the argument is valid, $P(C)\ge$
  {{ $$0.95\times 0.7=0.665$$ }}
  People part ways on whether P1 reaches the universe and on whether physics shows a first moment.
cards:
  - type: mcq
    id: hook
    title: "Guess: must something start?"
    prompt: |
      Guess before any theory. Suppose the past had **no first moment**: for every day there was an earlier day, without end. Someone says: "Then nothing ever *started*, so the question 'what caused the start?' never comes up." Another says: "A past with no first moment is impossible, so the universe must have started." Which statement is **true whichever side you take**?
    options:
      - text: 'Whether a past with no first moment is possible is itself disputed: philosophers argue about infinite collections, and physicists about which models of the early universe are right.'
        correct: true
        feedback: |
          Right. This lesson builds the case that the universe *did* begin, and then tests it from both philosophy and physics.
      - text: 'Mathematics has proved that an endless past is impossible.'
        feedback: |
          Mathematics has no such proof. Set theory happily handles infinite collections; the question is whether *real* things can form one, and that is argued, not proved.
      - text: 'Physics has shown for certain that the universe had a first moment.'
        feedback: |
          Physics has strong evidence for an early hot, dense state, but whether there was a first moment, or a state our equations cannot describe, is open. We will see exactly what the theorems say.
    explanation: |
      The question "must something start?" has a philosophical half (can the past be infinite?) and a physical half (what do cosmological models say?). The kalam argument uses both.

  - type: text
    id: history
    title: "A very old argument"
    image:
      src: img/ghazali.webp
      alt: Pen and ink sketch of a bearded man in a large turban
      caption: A modern sketch of al-Ghazali (1058-1111), the scholar who argued that whatever begins to exist needs a cause of its beginning; no likeness from his lifetime is used here.
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Al-Ghaz%C4%81l%C4%AB,_Sayr_mulhimah_min_al-Sharq_wa-al-Gharb.png"
      place: bottom
    body: |
      *Kalam* is Arabic for "speech" or "discourse"; the *mutakallimun* were theologians who used reason and argument to support their revealed Islamic beliefs, according to the Stanford Encyclopedia of Philosophy. The **kalam cosmological argument** is their argument that the universe has a cause because it began.

      - John Philoponus (c. 490-c. 570), a Christian philosopher from Alexandria, argued against the eternity of the world, and Stanford's entry says he influenced the *mutakallimun*. His main point: an actual infinite cannot exist, and an infinite past would be one.
      - Al-Ghazali (1058-1111) argued that everything that begins to exist requires a cause of its beginning. In his *Incoherence of the Philosophers* he argued against the philosophers' view that the world is eternal.
      - William Lane Craig (born 1949), an American philosopher and Christian apologist, revived it in his book *The Kalam Cosmological Argument* (Macmillan, 1979).

      Same name, different argument from the last lesson: the argument from contingency does not care whether the universe began. The kalam argument cares about nothing else.

  - type: text
    id: argument
    title: "The argument, as Craig states it"
    image:
      src: img/craig.webp
      alt: Head and shoulders photograph of William Lane Craig, an older man with grey hair
      caption: William Lane Craig, the philosopher who gave the kalam argument its modern form; his formulation has two premises and a conclusion, each of which critics test separately.
      credit: "ReasonableFaith.org, CC BY 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:William_Lane_Craig_(3x4_cropped).jpg"
      place: bottom
    body: |
      According to Craig, the argument is:

      - **P1.** Everything that begins to exist has a cause of its existence.
      - **P2.** The universe began to exist.
      - **C.** The universe has a cause of its existence.

      Write $\mathrm{Beg}(x)$ for "$x$ begins to exist", $\mathrm{Cause}(y,x)$ for "$y$ is a cause of $x$'s existence" and $u$ for the universe. Then P1 is
      $$\forall x\,\big(\mathrm{Beg}(x)\Rightarrow\exists y\ \mathrm{Cause}(y,x)\big)$$
      and P2 is $\mathrm{Beg}(u)$. Plugging $x=u$ into P1 gives C. So the logic is simple and **valid**: if both premises are true, C is true. All the work is in the premises.

  - type: mcq
    id: validity
    title: "Valid is not the same as sound"
    prompt: |
      A critic of the kalam argument says: "Your two premises are both false, so the conclusion is false." A defender says: "The argument is valid, so you must accept the conclusion." Which statement is correct?
    options:
      - text: 'Valid means the conclusion follows if the premises are true; the conclusion could still be true even with a bad argument, and an argument is only *sound* (and compelling) when it is valid **and** its premises are true.'
        correct: true
        feedback: |
          Yes. Validity is about the link between premises and conclusion. The defender must still defend P1 and P2, and the critic's claim that C is false would need its own reason.
      - text: 'A valid argument forces everyone to accept its conclusion.'
        feedback: |
          Only someone who accepts the premises is forced. A person who rejects a premise can reject the conclusion without any logical slip.
      - text: 'If a premise is false, the conclusion must be false.'
        feedback: |
          A conclusion can be true even when an argument for it fails. "The universe has a cause" could be true for other reasons even if P2 turned out false.
    explanation: |
      Separate the *form* (valid here) from the *truth of the premises* (the whole debate).

  - type: text
    id: p1
    title: "P1: from nothing, nothing?"
    body: |
      Why believe P1? According to Craig, it rests on the metaphysical intuition that something cannot come out of nothing. Think of a horse appearing in an empty room with no cause: we do not take it as possible, we look for the cause.

      Critics (the Stanford Encyclopedia lists Oppy and Morriston) say two things:

      - Our intuition comes from things *inside* the universe, where a cause is always some earlier state of affairs. It is a further step to say the universe *as a whole* needs a cause (this is the same "extrapolate from the parts" worry as with the contingency argument).
      - Morriston doubts that the principle is obvious enough to be known without evidence.

      Notice what the premise says: it is about things that **begin to exist**. It does not say "everything has a cause", which would make God (according to those who believe in God) need a cause too. This restriction is what lets the argument avoid the reply "then what caused God?" at the first step: a God who never began is not covered by P1.

  - type: mcq
    id: p1-q
    title: "Which things does P1 cover?"
    prompt: |
      According to Craig's version, P1 says "whatever **begins to exist** has a cause". A student objects: "By your own premise, if everything has a cause, then whatever caused the universe also has a cause, and so on." Which reply fits the premise as stated?
    options:
      - text: 'P1 does not say that everything has a cause, only that whatever *begins to exist* does; a cause that never began is not covered by it. (Whether such a cause exists is a further question.)'
        correct: true
        feedback: |
          Yes. The restriction to things that begin is what blocks this particular objection. A critic can still ask whether the restriction is arbitrary, or whether the cause could be something other than a God.
      - text: 'P1 says everything has a cause, so the objection is right and the argument fails.'
        feedback: |
          This misreads the premise. If P1 said "everything", the objection would work, and that is why the premise is worded with "begins to exist".
      - text: 'P1 is only about physical objects, so the universe is not covered.'
        feedback: |
          P1 is meant to apply to the universe through P2 ("the universe began to exist"). If it covered only objects inside the universe, the argument would not reach C.
    explanation: |
      The wording of P1 matters: it names things that *begin*, not everything. Critics then press on whether that restriction is principled, but it is not the blunder the student described.

  - type: mcq
    id: quantum
    title: "Which reply answers which objection?"
    prompt: |
      One objection to P1 (the Stanford Encyclopedia mentions it in connection with Smith): quantum mechanics shows that some events, such as the moment a particular radioactive atom decays, are not fixed by anything earlier, so "everything that begins has a cause" is limited at best. According to Craig's replies, which is **one** of them?
    options:
      - text: 'Being unpredictable is not the same as being uncaused; and a quantum vacuum is far from nothing, since it is a physical state with its own laws.'
        correct: true
        feedback: |
          Yes. In some interpretations (such as Bohm's) the outcomes are fixed by hidden variables, so the events are caused but not predictable by us; in others the outcomes are chancy, but even then a decay happens *within* an existing system, which is not the universe coming from nothing.
      - text: 'Quantum mechanics has been proved wrong about decay times, so the objection fails.'
        feedback: |
          No. The statistical predictions of quantum mechanics are extremely well tested. The disagreement is about what they mean (chance or hidden causes), not about their correctness.
      - text: 'Physical laws never apply to events at the smallest scales.'
        feedback: |
          Quantum laws govern exactly those scales. The reply has to grant that and argue about what "uncaused" means.
    explanation: |
      Layers: the data on decay are established fact; whether individual outcomes are uncaused depends on the interpretation of quantum mechanics (live debate; Bohm's version is deterministic, Born held no hidden parameters could be added); P1 itself is a metaphysical commitment. A critic can reply that vacuum fluctuations, if truly uncaused, are a counterexample, while Craig replies that they are not examples of something from nothing.

  - type: text
    id: p2
    title: "P2 has two roads"
    body: |
      Why believe that the universe began to exist? Defenders use two independent lines.

      1. **Philosophical:** an infinite past of events is impossible, because a real (actual) infinite cannot exist, or because it cannot be built by adding one step at a time.
      2. **Physical:** modern cosmology points to a beginning (the Big Bang and theorems about expanding spacetimes).

      A critic can reject either without touching the other, and the defender needs only one to survive. We take them in turn, starting with the old one.

  - type: text
    id: hotel
    title: "Hilbert's Hotel"
    image:
      src: img/hilbert.webp
      alt: Photograph of the mathematician David Hilbert as a middle-aged man, around 1900
      caption: The German mathematician David Hilbert (1862-1943); according to the sources, the hotel story goes back to a lecture on infinity he gave in 1924 without publishing it, and George Gamow's 1947 popular book made it famous.
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:David_Hilbert,_c._1900.png"
      place: bottom
    body: |
      Craig uses the story of **Hilbert's Hotel**: a hotel with infinitely many rooms, numbered $1,2,3,\dots$, every room occupied. A new guest arrives. The manager asks each guest to move from room $n$ to room $n+1$. Room 1 is free, and nobody is out on the street.

      Stranger still: infinitely many new guests arrive in a bus. Ask the guest in room $n$ to move to room $2n$; every odd room becomes empty, and there are infinitely many odd rooms.

      Craig argues (the Stanford Encyclopedia's summary) that such absurdities show an **actual infinite** cannot exist in the real world. An actual infinite is a completed collection with infinitely many members, as opposed to a **potential infinite**, a collection that grows without ever reaching infinity. If an actual infinite cannot exist, a past with infinitely many events (all of them real) cannot exist either.

  - type: numeric
    id: hotel-q
    title: "Move the guests"
    prompt: |
      Every room of an infinite hotel (rooms $1,2,3,\dots$) is occupied. A bus with infinitely many new guests, numbered $1,2,3,\dots$, arrives. The manager asks the guest in room $n$ to move to room $2n$, then gives new guest number $k$ the empty room $2k-1$. Which room does the **old guest from room 7** go to? (This is the first step; the odd rooms are then free.)
    answer: 14
    hint: 'Room $n$ goes to room $2n$.'
    wrong:
      - { value: 8, feedback: 'That is the rule for one new guest ($n \to n+1$). The bus needs infinitely many free rooms at once, so the rule doubles.' }
      - { value: 13, feedback: '$2k-1$ is the room for *new* guest number $k$, not for an old guest.' }
    explanation: |
      The old guest in room $7$ moves to room $2\times 7=14$. Each old guest ends in an even room, each new guest $k$ in odd room $2k-1$, so everyone fits. The hotel was "full" and yet took infinitely many more guests. Craig calls this absurd; the next card asks how critics reply.

  - type: mcq
    id: hotel-replies
    title: "Is the hotel absurd, or just strange?"
    prompt: |
      Which is a standard reply to the use of Hilbert's Hotel to rule out an infinite past?
    options:
      - text: 'Cantorian mathematicians say these results are defining features of infinite sets (a part can match the whole one to one); strange is not the same as contradictory. Also, rooms coexist while past events do not, so the hotel does not show a past cannot be infinite.'
        correct: true
        feedback: |
          Yes. The Stanford Encyclopedia reports this reply, and a reply that the hotel shows only that infinitely many things cannot exist *at the same time*. Craig answers that the results are meant to show real infinities cannot exist at all.
      - text: 'The hotel is a logical contradiction, so mathematicians have abandoned infinite sets.'
        feedback: |
          Mathematicians did not abandon them: infinite sets are used everywhere in mathematics. The defender's point is about *real* collections, not about set theory being inconsistent.
      - text: 'Hilbert proved that the hotel cannot exist, so no infinite set exists in mathematics.'
        feedback: |
          Nothing of the kind was proved. The hotel is a way of displaying how infinite sets behave, and mathematicians use infinite sets everywhere.
    explanation: |
      Two replies to keep: (1) strange but consistent, as set theory shows; (2) past events are not all present together like rooms. And a defender's reply: the hotel is about real collections, not abstract sets.

  - type: mcq
    id: succession
    title: "Counting to infinity"
    prompt: |
      A second philosophical argument (according to the Stanford Encyclopedia, Craig's): a series built by successive addition, one step after another, is never an actual infinite, since it is finite at every stage. So if the past is a series of events added one after another up to today, it cannot be infinite. A critic replies: "A past with no beginning was never counted up from a starting point." Which statement describes the dispute?
    options:
      - text: 'The defender treats the past as built up by adding events one after another; the critic says a beginningless series is not built up from anywhere, so "at every stage finite" does not apply.'
        correct: true
        feedback: |
          Yes. The two disagree on whether the past is a series *formed* by succession from a start (then finite) or a series that is simply there, extending backward without end.
      - text: 'The dispute is whether one can count to infinity in a finite time, which everyone agrees is possible.'
        feedback: |
          Nobody says that. The question is whether a series with no first member has to have been "traversed" from a start.
      - text: 'Both agree the past is finite and only quarrel about the future.'
        feedback: |
          Craig treats the future as at most a potential infinite and the past as finite; the critic does not accept the finite past. The quarrel is about the past.
    explanation: |
      This is the part of the argument that most depends on how time is understood (a series formed by adding events, or an extended whole). Layer: live philosophical debate.

  - type: text
    id: physics
    title: "P2, the physical road"
    body: |
      Recall: the Big Bang model says the universe has expanded from a hot, dense state. Run the expansion backward and the **scale factor** $a(t)$ (the cosmic size at time $t$, with $a=1$ today) shrinks toward zero, and the temperature $T=T_0/a$ rises. In the classical equations the shrinking reaches $a=0$ in a finite past time, where the equations stop giving answers (a **singularity**). Defenders read this as the beginning of the universe; critics note it may only be the edge of what the theory describes. According to the Stanford Encyclopedia, this makes P2 at best *probably* true, depending on which theories of the early universe are right.

      Then there is a theorem. **Borde, Guth and Vilenkin** (2003) proved that if the expansion rate $H=\dot a/a$, **averaged along a past path**, is positive ($H_{\text{av}}>0$), then that path cannot be extended backward forever: the spacetime is *past-incomplete*. It needs no energy condition, but it is a classical result.

      In the next card, compare four schematic pasts. They are **illustrative shapes, not solutions of Einstein's equations**.

  - type: widget
    id: pasts
    widget: scale-factor
    title: "Does the past have a first moment?"
    config:
      models: [bang, bounce, eternal, emergent]
      model: bang
      cursor: -1.0
      density: radiation
      readouts: [a, model]
      show: { ghosts: true, endMarks: true, guides: true }
      labels: { t: "time (schematic)", a: "scale factor a", selector: "Past" }
    body: |
      Switch between the four pasts and drag the cursor back as far as it will go. For each, ask: is there a time before which nothing happened, or does the curve go on?

  - type: mcq
    id: pasts-q
    title: "Which pasts leave P2 standing?"
    review: false
    prompt: |
      In the schematic, a Big Bang past reaches $a=0$ at a finite time; a bounce past turns around at a smallest size $a_{\min}>0$ and continues; an eternal past has $a\to0$ only as $t\to-\infty$; an emergent past tends to a fixed size as $t\to-\infty$. For which of these does the curve have **no** first moment, so that P2 ("the universe began to exist") is in doubt?
    options:
      - text: 'Bounce, eternal and emergent: in each, for any time there is an earlier time.'
        correct: true
        feedback: |
          Yes. Only the Big Bang curve stops at a finite time. In the real debate, whether the actual universe is like one of these is exactly what the theorem and the models argue about; the next card says what the theorem does claim.
      - text: 'Only the Big Bang curve, since it is the only one with a singularity.'
        feedback: |
          The Big Bang curve is the one with a *first moment* in the schematic; it is the one where P2 is easiest to defend, not the one where it is in doubt.
      - text: 'None of them: any curve with a beginning or not has a cause.'
        feedback: |
          That mixes the question (is there a beginning?) with P1 (does a beginning need a cause?). The widget only addresses the first.
    explanation: |
      This is exactly the point where physics matters for P2. Models with no first moment leave P2 doubtful; what the real theorems and observations allow is the next question.

  - type: mcq
    id: bgv-q
    title: "What does the BGV theorem say?"
    prompt: |
      Which statement about the Borde-Guth-Vilenkin theorem (2003) is accurate?
    options:
      - text: 'If the Hubble rate averaged along a past path is positive, that path is past-incomplete; it is a classical result and does not by itself decide whether quantum gravity or a different model removes the edge.'
        correct: true
        feedback: |
          Yes. It applies to a large class of inflating models, but its premise ($H_{\text{av}}>0$ along the past) can fail in models such as an emergent universe, and it is classical.
      - text: 'It proves that the universe had a first moment 13.8 billion years ago, so P2 is established.'
        feedback: |
          The theorem is about spacetimes that expand on average; it says nothing about a first moment at a given date, and it is not a proof about the real universe unless its premise holds there.
      - text: 'It shows that the universe was caused to exist.'
        feedback: |
          The theorem is about geometry (past-incomplete paths). Whether a beginning needs a cause is P1, a different premise.
    explanation: |
      Layers: the theorem is mathematical fact; its application to our universe is live debate (Vilenkin and Guth have reportedly disagreed on how strong it is, and Carroll has stressed the quantum caveat); P1 is metaphysics.

  - type: mcq
    id: begin-meaning
    title: "What does 'begins to exist' mean?"
    prompt: |
      The Stanford Encyclopedia notes an objection: in general relativity the Big Bang is not an *event* in spacetime, since there is no earlier time in which it occurs, so it makes no sense to ask what caused it. According to its summary of Craig's reply, what does "beginning to exist" require?
    options:
      - text: 'That the thing''s existence over time is finite in the past, with no time immediately before some moment at which it exists, even if there is no first instant.'
        correct: true
        feedback: |
          In essence, yes. Craig says a beginning does not need a first instant; it needs only that the past of the thing's existence is finite. Critics reply that, without an earlier time, a *cause* in the ordinary sense has nowhere to act.
      - text: 'That there was an earlier moment when the thing did not exist.'
        feedback: |
          That is the ordinary case, but it would make a beginning of time itself impossible; the objection is aimed at this reading.
      - text: 'That the thing was produced by an earlier thing of the same kind.'
        feedback: |
          That describes a chain in time, not a beginning. A first member of such a chain would have nothing earlier of its kind.
    explanation: |
      How to read "begins" matters for both premises: a boundary of time is not the same as an event in time, and the defender and the critic part ways here.

  - type: mcq
    id: contingency
    title: "Which argument survives an endless past?"
    prompt: |
      Suppose cosmologists someday show that the past has **no beginning**. Which statement is correct?
    options:
      - text: 'P2 of the kalam argument would be false, so that argument fails; the argument from contingency does not need a beginning, so it is not affected by this.'
        correct: true
        feedback: |
          Yes. The contingency argument asks why there is a universe (or any contingent thing) at all, at every moment; even an endless chain, as a whole, is said to need an explanation. Critics reply to *that* argument separately (brute fact, composition).
      - text: 'Both arguments would fail, since they both need a first cause.'
        feedback: |
          The contingency argument does not need a first cause in time. The lesson The Cosmological Argument built a version that allows an endless past.
      - text: 'Neither would be affected, because a cause can exist without a beginning.'
        feedback: |
          P2 is the premise "the universe began to exist". If it is false, the kalam argument has a false premise. A cause without a beginning is a different matter.
    explanation: |
      The two arguments make different bets. Kalam bets on a beginning; the argument from contingency bets that explanation is needed even without one.

  - type: mcq
    id: reach
    title: "What does C reach?"
    prompt: |
      Suppose a reader accepts the kalam argument completely, so the universe has a cause. According to the argument's logic alone, what has been shown?
    options:
      - text: 'That the universe has a cause of its existence. Further properties of the cause need further arguments.'
        correct: true
        feedback: |
          Yes. According to the Stanford Encyclopedia, Craig adds that no scientific explanation can give a causal account of the origin of the universe (since such explanations are part of it) and argues the cause must be *personal*. That is a second argument, not part of C, and critics such as Morriston dispute it.
      - text: 'That the cause is a person who loves humanity.'
        feedback: |
          Two steps too far. Even a personal cause need not be good or care about us; the ladder of conclusions has many rungs between "a cause" and a religion.
      - text: 'That the cause is the God of one specific religion.'
        feedback: |
          No argument of this type picks a religion. It leaves open, for example, an impersonal cause, a mind, a physical cause outside our spacetime.
    explanation: |
      Ladder of conclusions: a cause; a cause outside space and time (as used by defenders); personal (Craig's further argument, disputed); perfectly good; one religion. The kalam argument gives, at most, the first rung.

  - type: mcq
    id: personal
    title: "Why would the cause be personal?"
    prompt: |
      According to the Stanford Encyclopedia, Craig argues that an eternal, impersonal cause would produce an eternal universe, so the cause must be a personal agent who freely chooses to create in time. What is the objection it reports, from Morriston?
    options:
      - text: 'If an eternal personal cause''s intention alone is enough, the universe would be eternal too; and if the agent must also exercise its power, that is an act in time, hard to fit with a timeless cause.'
        correct: true
        feedback: |
          Yes. Craig replies that the agent must also exercise its causal power; Morriston presses that exercising it is a temporal act. This is a live debate.
      - text: 'A person cannot cause anything, so the argument fails.'
        feedback: |
          The objection is not that persons cannot cause. It is about a *timeless* personal cause and a universe that begins.
      - text: 'The objection is that the universe is infinitely old.'
        feedback: |
          That is a rejection of P2, not an objection to the personal-cause step, which assumes P2 is true.
    explanation: |
      The step to a *personal* cause is a separate argument from the kalam argument proper, and is where many critics and some defenders part ways.

  - type: numeric
    id: product
    title: "Putting numbers on doubt"
    prompt: |
      A reader's credence in P1 is $0.95$ and in P2 is $0.7$ (treat them as independent). Because the argument is valid, the probability of C is **at least** the probability that both premises are true. What is that lower bound?
    answer: 0.665
    tolerance: 0.001
    hint: 'Both must be true: multiply the two probabilities.'
    wrong:
      - { value: 0.7, feedback: 'That is the weaker premise alone. Both must hold, so the chance is lower than either.' }
      - { value: 1.65, feedback: 'Probabilities of both holding are multiplied, not added; a probability cannot exceed 1.' }
    explanation: |
      $0.95\times0.7=0.665$. This is only a lower bound for C: C could be true for other reasons even if a premise fails. The numbers are invented; the point is that a chain of fairly confident premises can leave the conclusion well below certainty.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the **ontological argument** tries to show that God exists from the very *concept* of God, with no help from the universe or its beginning: Anselm, the monk Gaunilo's reply, and the modern modal version.
