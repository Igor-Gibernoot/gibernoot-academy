id: ch06-ontological
title: "Guided proof: The Ontological Argument"
kind: guided
proof: true
own: |
  The setting: the **ontological argument** tries to show that God exists from the *concept* of God alone, with no help from the world. Write $G$ for the being "than which nothing greater can be conceived" (Anselm's definition), "$G$ exists in the understanding" for "someone can grasp what the phrase describes", and "$G$ exists in reality" for "something actually answers to it".
  - **Anselm's reductio (Proslogion, c. 1077-78).** P1: $G$ is defined as that than which nothing greater can be conceived. P2: $G$ exists in the understanding (even the "fool" who denies God grasps the phrase). P3: whatever exists in reality is greater than the same thing existing only in the understanding. If $G$ existed only in the understanding, one could conceive something greater (the same plus real existence), contradicting P1; so $G$ exists in reality. The logic is valid; the dispute is over P2 (is the concept coherent?) and P3 (is existence a way of being greater?).
  - **Objections to the form.** Gaunilo, a monk of Marmoutier, ran the same steps on "the island than which no greater island can be conceived" to reach an absurd conclusion; replies say an island has no intrinsic maximum (palm trees can always be added) while knowledge, power and goodness do, and critics answer that the reply must show the concept of a maximum is coherent. Kant argued that existence is not a real predicate: a hundred real thalers contain no more than a hundred possible ones, so P3 compares nothing that real existence could add to.
  - **The modal version (Plantinga, 1974).** Let $E$ = "a maximally great being exists", where *maximally great* means having maximal excellence (omniscient, omnipotent, morally perfect) in every possible world, and $\Diamond$ = "possibly", $\Box$ = "necessarily". The premises are
  {{ $$\Diamond E$$ }}
  and, from the definition, a maximally great being cannot exist merely contingently:
  {{ $$\Box\,(E\Rightarrow\Box E)$$ }}
  In the modal logic S5 (where $\Diamond\Box p\Rightarrow\Box p$) these give $\Diamond\Box E$, hence $\Box E$, hence
  {{ $$E$$ }}
  - **The parity problem.** The same definition gives $\Diamond\lnot E\Rightarrow\lnot E$ (if a maximally great being could fail to exist it does not exist). So in S5, $\Diamond E$ and $E$ stand or fall together:
  {{ $$\Diamond E\ \Longleftrightarrow\ E$$ }}
  The "mere possibility" premise is exactly as hard to grant as the conclusion. Plantinga himself says such arguments cannot perhaps be said to *prove* their conclusion, but show that it is rational to accept it for someone who finds the premise rational.
  - **What it would reach.** If sound: a necessarily existing, maximally excellent being. Not by itself a creator of this universe, a being who acts or speaks, or any religion. People part ways on whether the concept of a maximally great being is coherent, which is the possibility premise.
cards:
  - type: mcq
    id: hook
    title: "Guess: can a definition create a thing?"
    prompt: |
      Guess before any theory. Someone defines a *unicorn* as "a horse with one horn, **and** it really exists". Does writing that definition show that unicorns exist?
    options:
      - text: 'No. A definition fixes what we *mean* by a word; whether anything in the world fits the description is a separate question.'
        correct: true
        feedback: |
          Right, and this is the common-sense verdict. The ontological argument is interesting because it claims that **one special concept** is an exception: that the very idea of God cannot be thought without God existing. The lesson tests that claim.
      - text: 'Yes. If we agree on the definition, then by that definition unicorns exist.'
        feedback: |
          This confuses *what the word means* with *what is the case*. I can define "a perfectly honest politician who never lies and who is in my kitchen now"; the definition does not put anyone in my kitchen.
      - text: 'It depends on how many people accept the definition.'
        feedback: |
          Agreement among speakers settles how the word is used, not whether the world contains such a thing.
    explanation: |
      Ordinary definitions cannot make things exist. The **ontological argument** (the word *ontological* comes from the Greek for "being") tries to show that the concept of God is the one case where reasoning from the concept alone reaches existence.

  - type: text
    id: anselm
    title: "Anselm and the formula"
    image:
      src: img/anselm.webp
      alt: "Colourised portrait of Anselm of Canterbury as an older man in bishop's robes"
      caption: "Anselm of Canterbury (1033-1109), a monk who became Archbishop of Canterbury, wrote the Proslogion around 1077-78."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Anselm_of_Canterbury.jpg"
      place: bottom
    body: |
      According to the Stanford Encyclopedia of Philosophy, **Anselm of Canterbury** (1033-1109) wrote the *Proslogion* around 1077-78, and it contains the first and best-known ontological argument.

      He starts from a definition. In one standard English translation the key sentence reads "something than which nothing greater can be conceived is in the understanding". Write $G$ for this being: **the being than which nothing greater can be conceived**. "Greater" is left open here; it means something like "better to be, more excellent".

      The argument is aimed at "the fool", the figure of Psalm 14:1 and 53:1 who says "There is no God". Anselm's claim is that even the fool has two things to admit, and that together they trap him.

  - type: mcq
    id: understanding-q
    title: "In the understanding"
    prompt: |
      The argument says that $G$ "exists in the understanding" even for someone who denies that $G$ exists. What does that mean?
    options:
      - text: 'The person grasps what the description says, the way an engineer grasps a bridge design before any bridge is built; it says nothing about whether anything matches it.'
        correct: true
        feedback: |
          Yes. "Exists in the understanding" is only a way of saying that the description is understood. A design in an engineer's head is in the understanding but not (yet) in reality.
      - text: 'The person secretly believes in God.'
        feedback: |
          No: the fool is by hypothesis someone who denies God. The claim is only that the fool understands the *words*.
      - text: 'God is a mental event that occurs inside the person.'
        feedback: |
          That would be a (different) claim that God is only a thought. The argument is trying to show the opposite, so it uses "in the understanding" in the weaker sense.
    explanation: |
      Two ways of existing are being contrasted: **in the understanding** (the description is grasped) and **in reality** (something actually matches it). The argument will try to show that $G$ cannot stay in the first without being in the second.

  - type: text
    id: argument
    title: "The argument as a proof by contradiction"
    body: |
      Here is the argument in the form of a *reductio ad absurdum* (assume the opposite and reach a contradiction). We follow the Stanford Encyclopedia's reading of the *Proslogion*.

      - **P1 (definition).** $G$ is that than which nothing greater can be conceived.
      - **P2.** $G$ exists in the understanding (the fool grasps the phrase).
      - **P3.** Whatever exists in reality is greater than the same thing existing only in the understanding.
      - **Suppose** $G$ exists *only* in the understanding. Then, by P3, one could conceive something greater: the same being that also exists in reality. That contradicts P1, since nothing greater than $G$ can be conceived.
      - **C.** So $G$ exists in reality.

  - type: order
    id: argument-order
    title: "Put the proof in order"
    prompt: |
      Put Anselm's reductio into its logical order.
    steps:
      - 'Define $G$ as that than which nothing greater can be conceived, and note that even the fool understands the phrase (so $G$ is in the understanding).'
      - 'Suppose, for contradiction, that $G$ exists only in the understanding.'
      - 'Since real existence makes a thing greater, the same being existing in reality is conceivable and greater than $G$.'
      - 'That contradicts the definition: nothing greater than $G$ can be conceived.'
      - 'So the supposition is false, and $G$ exists in reality.'
    hint: 'Define, suppose the opposite, compare, contradict, conclude.'
    explanation: |
      Every reductio has this shape: a definition, a supposition to be refuted, a consequence, a contradiction, and the conclusion. The logic is valid: if P1 to P3 are true, C follows. Whether the argument is **sound** depends on whether the premises are true, which is where critics push.

  - type: mcq
    id: critic-q
    title: "Which premise would a critic reject?"
    prompt: |
      A critic accepts that the reductio is valid and accepts that the fool understands the phrase in P2. She still says the argument fails. Which premise is she most naturally rejecting?
    options:
      - text: 'P3: that existing in reality is a way of being *greater*, so that a non-existent being could always be improved by adding existence.'
        correct: true
        feedback: |
          Yes, this is the premise most discussions single out (Kant's objection below is a form of it). Another natural target is whether the description in P1 is coherent at all, which the modal version will bring back.
      - text: 'The step from the contradiction to the conclusion C.'
        feedback: |
          That step is valid logic: if the supposition leads to a contradiction, it is false. A critic cannot fault it without rejecting reductio arguments in general.
      - text: 'The claim that a definition is a sentence of English.'
        feedback: |
          This is not a premise of the argument. The argument's weight rests on what the definition is said to imply.
    explanation: |
      Separate **validity** (does the conclusion follow from the premises?) from **truth of the premises**. The ontological argument is usually granted to be valid; the live questions are about P3 and about whether the concept in P1 can be coherent.

  - type: text
    id: gaunilo
    title: "Gaunilo's island"
    body: |
      Within Anselm's lifetime a monk of Marmoutier named **Gaunilo** wrote a "Reply on Behalf of the Fool", according to the Stanford Encyclopedia. His best-known objection copies the form of the argument:

      - Take "that island than which no greater island can be conceived". We understand the phrase, so this island exists in the understanding.
      - If it existed only in the understanding, a real island would be greater, so a greater island could be conceived: a contradiction.
      - So the perfect island exists in reality.

      Gaunilo took this conclusion to be absurd and concluded that Anselm's reasoning must be faulty. This is a **parody argument**: same steps, different subject, a conclusion nobody accepts.

  - type: mcq
    id: gaunilo-q
    title: "What a parody shows"
    prompt: |
      Gaunilo runs Anselm's steps on a perfect island and gets "so the perfect island exists". What is he trying to show?
    options:
      - text: 'That the *form* of the argument proves too much: if it were valid reasoning it would also prove things we know are not proved this way, so something in the form must be wrong.'
        correct: true
        feedback: |
          Yes. A parody does not say which step fails; it says the pattern cannot be trusted, because the same pattern yields a conclusion we reject.
      - text: 'That a perfect island really exists somewhere.'
        feedback: |
          No; Gaunilo regards that conclusion as absurd. He uses it as a reductio of the pattern.
      - text: 'That Anselm''s premise P2 is false because nobody can understand the word "island".'
        feedback: |
          Gaunilo grants that the phrase is understood. His complaint is about what follows from that.
    explanation: |
      An argument form that can prove a perfect island also threatens to prove perfect anything. Defenders must therefore find a **relevant difference** between God and the island, or show the parody fails.

  - type: text
    id: reply
    title: "Replies to the island"
    body: |
      Anselm's own reply, as the Stanford Encyclopedia reads it, does not answer the island directly. It says that his argument never relied on the *general* principle that existing in reality always makes a thing greater, the principle Gaunilo's parody uses. It defends instead that a being which could fail to exist would not be the greatest conceivable.

      Later defenders offered a second reply, often put like this: an island is something that can always be improved (add more palm trees), so "the island than which none greater can be conceived" describes **no coherent thing**. Knowledge, power and moral goodness are different, because each plausibly has an **intrinsic maximum**: you cannot know more than everything. The Internet Encyclopedia of Philosophy reports that Anselm's argument is claimed to work only for concepts built from properties with an intrinsic maximum.

      Critics reply to this second line: the Stanford Encyclopedia says it seems false that adding palm trees is guaranteed to add to an island's greatness. And they ask the defender to show that the concept of a being with *all* the great-making properties at their maxima is coherent.

  - type: mcq
    id: reply-q
    title: "Which concept has a maximum?"
    prompt: |
      A defender says the island parody fails because "greatest island" has no intrinsic maximum, while some perfections do. Which property is the best example of one with an intrinsic maximum?
    options:
      - text: 'Knowing: you cannot know more than every truth.'
        correct: true
        feedback: |
          Yes. There is a ceiling: knowing every truth. That is why theists describe God's knowledge as complete, not "very large".
      - text: 'The number of palm trees on an island.'
        feedback: |
          This can always be increased by one more, so no number is the greatest. That is the defender's example of a quantity with *no* maximum.
      - text: 'The number of stars a being has counted.'
        feedback: |
          Counts can also always be increased by one more, so there is no greatest count.
    explanation: |
      The defender's point is a **relevant difference**: the argument only applies to a concept with a ceiling. The critic's counter is that even a ceiling needs a proof that all the ceilings can be reached together in one being.

  - type: text
    id: kant
    title: "Kant: existence is not a predicate"
    body: |
      Immanuel Kant, in the *Critique of Pure Reason* (1781, second edition 1787), attacked ontological arguments at the root. According to the Stanford Encyclopedia, he held that they rely on the hidden assumption that "existence" is a **real predicate**, a property that can be part of a concept. In essence his example is that a hundred real thalers (coins) contain no more than a hundred possible thalers: the same hundred coins are described either way; real existence only says that there is a thing that matches the concept.

      If that is right, P3 fails. "The being with all of its properties" and "the same being that also exists" are not two different concepts, one richer than the other. So there is no richer concept to be "greater".

      Defenders reply that *necessary* existence, existing in a way that could not fail, might differ from ordinary existence, and that this is the version the modal argument below tries to use.

  - type: mcq
    id: kant-q
    title: "Applying Kant"
    prompt: |
      Which statement best captures Kant's objection to P3 ("existing in reality is greater than existing only in the understanding")?
    options:
      - text: 'Adding "and it exists" does not enrich a concept: the concept of a hundred real coins and of a hundred possible coins has exactly the same content, so real existence cannot make the concept *greater*.'
        correct: true
        feedback: |
          Yes. For Kant, existence says that something falls under a concept; it does not add a feature to the concept itself.
      - text: 'Nothing can exist, so P3 is false.'
        feedback: |
          Kant does not deny that things exist (the thalers in a pocket exist). He denies that existence is a property that enlarges a concept.
      - text: 'God is too great for us to define, so P1 fails.'
        feedback: |
          This is closer to Aquinas, who held (according to the Wikipedia article on the argument) that we cannot know God's nature well enough to define Him this way. Kant's objection is about existence, not about our knowledge of God.
    explanation: |
      Kant's objection: P3 treats existence as a great-making property. **Two readings** remain open: critics take Kant to have refuted the original argument; defenders say it misses arguments that use *necessary* existence.

  - type: text
    id: modal
    title: "The modal version"
    image:
      src: img/plantinga.webp
      alt: "Alvin Plantinga smiling during a lecture"
      caption: "Alvin Plantinga (born 1932), an American philosopher, set out the best-known modern modal version in The Nature of Necessity (1974)."
      credit: "Jonathunder, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:AlvinPlantinga.JPG"
      place: bottom
    body: |
      The Stanford Encyclopedia says modal versions were defended by Charles Hartshorne (1941, and *Anselm's Discovery*, 1965) and Norman Malcolm (*Philosophical Review*, 1960), who held that the main proof is in chapter 3 of the *Proslogion*. **Alvin Plantinga** gave the best-known modern form in *The Nature of Necessity* (1974).

      The word *modal* refers to **modes** of truth: possible, necessary. We need two symbols.

      - $\Diamond p$ reads "possibly $p$": $p$ is true in at least one *possible world* (a complete way things could have been).
      - $\Box p$ reads "necessarily $p$": $p$ is true in *every* possible world.

      Plantinga defines **maximal greatness**: a being is maximally great if it has maximal excellence in every possible world, where maximal excellence is being omniscient, omnipotent and morally perfect. So a maximally great being would exist in every possible world, that is, necessarily. Write $E$ for "a maximally great being exists".

  - type: mcq
    id: modal-q
    title: "Reading the symbols"
    prompt: |
      With $E$ = "a maximally great being exists", what does $\Diamond E$ say?
    options:
      - text: 'There is at least one way the world could have been in which a maximally great being exists.'
        correct: true
        feedback: |
          Yes. $\Diamond E$ is a claim of *mere possibility*: it says only that there is no impossibility in the idea, not that such a being actually exists.
      - text: 'A maximally great being exists in the actual world.'
        feedback: |
          That is $E$ itself, the conclusion. $\Diamond E$ only says $E$ holds in some possible world, possibly not ours.
      - text: 'A maximally great being exists in every possible world.'
        feedback: |
          That is $\Box E$. "Possibly" asks for one world, "necessarily" for all.
    explanation: |
      $\Diamond E$ is much weaker than $E$ at first sight, and that is why the argument seems to get something for nothing. The next card shows the hidden strength.

  - type: text
    id: modal-steps
    title: "The modal argument"
    body: |
      The argument has two premises and one logical tool.

      - **M1 (possibility).** $\Diamond E$: possibly, a maximally great being exists.
      - **M2 (from the definition).** $\Box(E\Rightarrow\Box E)$: necessarily, if a maximally great being exists, it exists necessarily. This holds by definition, since such a being has its excellence in every world.
      - **Tool: S5.** The standard system of modal logic called **S5** says that whatever is possibly necessary is necessary: $\Diamond\Box p\Rightarrow\Box p$. (Its characteristic axiom is $\Diamond p\Rightarrow\Box\Diamond p$, which gives this.)

      From M1 and M2, the possible world where the being exists is a world where it exists necessarily, so $\Diamond\Box E$. Then S5 gives $\Box E$, and what is true in every world is true in ours:

      $$E$$

  - type: order
    id: modal-order
    title: "Derive the conclusion"
    prompt: |
      Put the derivation of the modal argument in order.
    steps:
      - '$\Diamond E$: possibly a maximally great being exists (premise M1).'
      - 'In such a world the being exists in every world, so $\Diamond\Box E$ (from M1 and M2).'
      - 'S5: whatever is possibly necessary is necessary, so $\Box E$.'
      - 'What is necessary is actual (true in every world, including ours): $E$.'
    hint: 'Possibly exists, then possibly necessarily exists, then necessarily exists, then actually exists.'
    explanation: |
      The argument is **valid**: if M1, M2 and S5 are true, $E$ follows. The step that looks too good to be true is the move from "possibly" to "actually", which is licensed by the definition (M2) and by S5. Critics ask whether M1 is true and whether S5 is right for this kind of possibility.

  - type: text
    id: parity
    title: "The mirror argument"
    body: |
      Run the same definition in the other direction. Since a maximally great being exists in every world or in none, $E\Rightarrow\Box E$, and therefore (taking the opposite)

      $$\Diamond\lnot E\ \Rightarrow\ \lnot E$$

      In words: if a maximally great being could fail to exist, it does not exist. So the **reverse argument** starts from "$\Diamond\lnot E$: possibly, there is no maximally great being" and concludes $\lnot E$. The Stanford Encyclopedia notes that this reverse argument is also valid in S5, and that the two possibility premises seem "epistemically on par", so something is needed to break the symmetry.

      Notice what this means: $\Diamond E$ and $E$ stand or fall together, and so do $\Diamond\lnot E$ and $\lnot E$. Exactly one of $\Diamond E$ and $\Diamond\lnot E$ is true.

  - type: numeric
    id: parity-q
    title: "Credence in the mirror"
    prompt: |
      Given the definition of maximal greatness and S5, exactly one of "$\Diamond E$" (possibly there is a maximally great being) and "$\Diamond\lnot E$" (possibly there is none) is true. A reader has credence $0.3$ that $\Diamond E$ is true. What credence should she give to $\Diamond\lnot E$?
    answer: 0.7
    tolerance: 0.001
    wrong:
      - { value: 0.3, feedback: 'That is her credence in $\Diamond E$. If exactly one of the two is true, the other must get the rest of the probability.' }
      - { value: 0.09, feedback: 'Multiplying (0.3 times 0.3) would be for two independent claims both being true. Here exactly one of the two is true.' }
    hint: 'The two claims are exhaustive and cannot both be true, so their probabilities add to 1.'
    explanation: |
      $1-0.3=0.7$. So "it is merely possible" is not a cheap, modest premise: accepting $\Diamond E$ at credence $p$ means accepting the conclusion $E$ at credence $p$. A reader who finds the premise plausible only because it sounds modest is being misled by the word "possibly".

  - type: mcq
    id: possibility-q
    title: "The coherence question"
    prompt: |
      According to the Stanford Encyclopedia, Leibniz (1646-1716) argued that Descartes' version of the ontological argument fails unless one first shows that the idea of a supremely perfect being is coherent. How does this connect to the modal argument?
    options:
      - text: 'M1 ($\Diamond E$) is exactly the claim that the idea of a maximally great being is coherent, and the whole argument rests on it.'
        correct: true
        feedback: |
          Yes. If the combination of all the great-making properties at their maxima were impossible, $\Diamond E$ would be false. Defenders try to show coherence; critics say that showing it is as hard as the conclusion itself (the parity result).
      - text: 'Leibniz showed that M2 is false.'
        feedback: |
          Leibniz's point concerns the *possibility* of the concept, which is M1's role, not M2.
      - text: 'It shows that S5 is invalid.'
        feedback: |
          S5 is a separate question. Leibniz is not discussing modal logic here, only whether the idea contains a hidden contradiction.
    explanation: |
      Leibniz's demand for a coherence proof reappears as the possibility premise. The parity result explains why it is the real battleground.

  - type: mcq
    id: plantinga-q
    title: "What does Plantinga claim?"
    prompt: |
      Plantinga writes of his reformulated arguments: "They cannot, perhaps, be said to *prove* or *establish* their conclusion." He adds that, since it is rational to accept their central premise, they do show that it is rational to accept the conclusion. Which description is accurate?
    options:
      - text: 'He claims a more modest result than a proof: if it is rational to accept the possibility premise, then it is rational to accept that a maximally great being exists.'
        correct: true
        feedback: |
          Yes. Defenders and critics both stress this. The argument transfers rationality from the premise to the conclusion; it does not force someone who rejects the premise.
      - text: 'He claims the argument proves God exists to anyone who understands it.'
        feedback: |
          His own statement is more cautious: it "cannot, perhaps" be said to prove its conclusion.
      - text: 'He concedes the argument is invalid.'
        feedback: |
          No. The argument is valid in S5; the modesty concerns whether a rational person must accept the premise.
    explanation: |
      Three layers, as always: (1) *established*: the argument is valid; (2) *live debate*: whether $\Diamond E$ is true or at least rational to accept; (3) *metaphysical commitment*: a theist and an atheist can both treat $\Diamond E$ as a reason for their position (see the parity card).

  - type: mcq
    id: ladder
    title: "What would it reach?"
    prompt: |
      Suppose the modal argument were sound. Which of these would it establish? Select all that apply.
    multiple: true
    options:
      - text: 'A necessarily existing being with maximal excellence (omniscient, omnipotent, morally perfect).'
        correct: true
        feedback: |
          Yes, this is the conclusion $E$ with the definition of maximal greatness built in.
      - text: 'That this being created our universe.'
        feedback: |
          Nothing in the definition says the being did anything. A cosmological or design argument would be needed to link it to our universe.
      - text: 'That this being answers prayer or revealed a particular scripture.'
        feedback: |
          Acting or speaking is not part of "maximal greatness". That would need a further argument or revelation.
      - text: 'That one particular religion is true.'
        feedback: |
          The argument is neutral between traditions: a Jew, a Christian, a Muslim or a philosopher without a religion might all use it.
    explanation: |
      On the ladder of conclusions from the theism lesson: it would reach the top of the "necessary, perfect" rungs at best. Whether the rest follows is a separate matter. People part ways on whether the premise $\Diamond E$ is true: on **which premise a critic rejects**, the modal argument has just one real target, M1.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the **design argument** asks a different question: what do the order and apparent purpose in living things and in the laws of nature show? From the watch of William Paley to Hume's reply and Darwin's theory of evolution.
