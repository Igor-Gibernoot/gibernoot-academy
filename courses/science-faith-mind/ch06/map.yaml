id: ch06-map
title: "Content Map: Arguments for God"
kind: map
name: Level 6, Arguments for God (judging an argument, the ladder of conclusions, validity and soundness, the argument from contingency, the kalam argument, the modal ontological argument, the design argument, the moral argument, the argument from reason, what each reaches, where people part ways)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 6 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (two arguments mixed up, a reply given to the wrong critic, validity confused with truth, a conclusion stretched a rung too far), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: goal
    title: Judging an argument
    row: 1
    col: 1
    body: |
      Name the **conclusion** first (which God-claim?). Then ask three things of the argument: are the **premises** true, is the **step** valid, and how far does the conclusion **reach**? A critic rejects a premise or the validity; the course asks "which premise?", not "is God real?".
    decoys:
      - body: |
          Name the **conclusion** first (which God-claim?). Then ask three things of the argument: is the **conclusion** one you like, is the **step** valid, and how far does it **reach**? A critic who rejects the conclusion has refuted the argument.
        feedback: |
          Disliking a conclusion is not a refutation. A valid argument can only be resisted by rejecting a premise, and the useful question is which premise and why.
      - body: |
          Name the **conclusion** first (which God-claim?). Then ask three things of the argument: are the **premises** popular, is the **step** valid, and how far does the conclusion **reach**? A critic rejects a premise or the validity.
        feedback: |
          Popularity is not truth. What matters is whether each premise is true (or well supported), not how many people accept it.
    explanation: |
      The method for the whole level. Every argument below is run through these three questions.

  - id: ladder
    title: Ladder of conclusions
    row: 1
    col: 2
    body: |
      From low to high: **a cause or ground of the universe**, then **necessary, powerful, a mind**, then **a loving person**, then **the God of one religion**. Each rung needs **its own premises**: reaching a low rung does not give the next one.
    decoys:
      - body: |
          From low to high: **a cause or ground of the universe**, then **necessary, powerful, a mind**, then **a loving person**, then **the God of one religion**. Once the first rung is reached, **the higher rungs follow** by the same argument.
        feedback: |
          They do not. A cause of the universe need not be a person, loving, or the God of a particular religion; each step adds a claim that needs its own support.
      - body: |
          From low to high: **the God of one religion**, then **a loving person**, then **necessary, powerful, a mind**, then **a cause or ground of the universe**. Each rung needs **its own premises**.
        feedback: |
          The order is upside down. The weakest claim, a cause or ground, sits at the bottom; the rich claim, the God of one religion, needs the most extra support and sits at the top.
    explanation: |
      Sets the ceiling for every argument that follows: the last box asks which rung each one reaches.

  - id: sound
    title: Validity and soundness
    row: 1
    col: 3
    body: |
      **Valid**: the form makes it impossible for the premises to be true and the conclusion false. **Sound**: valid **and** all premises true. With three independent premises each true with probability $0.9$, all hold with probability $0.9^3\approx0.73$.
    decoys:
      - body: |
          **Valid**: the premises and the conclusion are all true. **Sound**: valid and **all premises true**. With three independent premises each true with probability $0.9$, all hold with probability $0.9^3\approx0.73$.
        feedback: |
          Validity is about form, not truth: a valid argument can have false premises. Truth of the premises is what soundness adds.
      - body: |
          **Valid**: the form makes it impossible for the premises to be true and the conclusion false. **Sound**: valid and **all premises true**. With three independent premises each true with probability $0.9$, all hold with probability $0.9\times3=2.7$.
        feedback: |
          Independent probabilities multiply, they do not add, and a probability cannot exceed 1. The chance is $0.9^3\approx0.73$: more premises make the conjunction weaker.
    explanation: |
      Separates the logic (valid) from the world (true premises). It is the check used on every argument.

  - id: contingency
    title: Argument from contingency
    row: 2
    col: 1
    body: |
      **P1 (PSR):** every contingent thing has an explanation. **P2:** the totality $T$ of contingent things is itself contingent. **P3:** no member of $T$ explains $T$. **C:** a **necessary being** outside $T$ explains $T$. Critics: $T$ may be a **brute fact**; **composition** (parts vs whole); van Inwagen's **collapse**. It needs **no beginning**.
    decoys:
      - body: |
          **P1 (PSR):** everything that **begins to exist** has a cause. **P2:** the totality $T$ of contingent things began to exist. **P3:** no member of $T$ explains $T$. **C:** a necessary being outside $T$ explains $T$. Critics: brute fact; composition; collapse.
        feedback: |
          This is the kalam argument mixed in. The contingency argument rests on the principle of sufficient reason and works even if the past has no first moment; the beginning belongs to the kalam argument.
      - body: |
          **P1 (PSR):** every contingent thing has an explanation. **P2:** the totality $T$ of contingent things is itself contingent. **P3:** every member of $T$ can explain $T$. **C:** a necessary being outside $T$ explains $T$. Critics: brute fact; composition; collapse.
        feedback: |
          P3 is reversed. A member cannot explain the whole it belongs to (it would be part of what it explains), and that is why the explanation must lie outside $T$.
    explanation: |
      The "why is there anything contingent at all?" argument. Its weak points are the PSR and the step from parts to whole.

  - id: kalam
    title: Kalam argument
    row: 2
    col: 2
    body: |
      **P1:** whatever **begins to exist** has a cause. **P2:** the universe began to exist. **C:** it has a cause. Support for P2: **Hilbert's Hotel** (an actual infinite cannot exist; reply: Cantor, and past events do not coexist) and **BGV** (if $H_{\text{av}}>0$ the path is past-incomplete; classical, with bounce and emergent escapes).
    decoys:
      - body: |
          **P1:** whatever **exists** has a cause. **P2:** the universe exists. **C:** it has a cause. Support for P2: Hilbert's Hotel (an actual infinite cannot exist) and BGV (if $H_{\text{av}}>0$ the path is past-incomplete; classical, with bounce and emergent escapes).
        feedback: |
          P1 would then make God need a cause too, and it drops the beginning. The kalam premise is about things that begin to exist, which is why P2 must show the universe began.
      - body: |
          **P1:** whatever **begins to exist** has a cause. **P2:** the universe began to exist. **C:** it has a cause. Support for P2: Hilbert's Hotel (an actual infinite cannot exist) and BGV (if $H_{\text{av}}<0$ the path is past-incomplete; it **proves a first moment**).
        feedback: |
          Two slips. BGV needs $H_{\text{av}}>0$ (expansion on average), and it is a classical result: whether it means a first moment or only the edge of our description is disputed.
    explanation: |
      Unlike the contingency argument, it stands or falls with a beginning. Its link to physics is BGV; its link to philosophy is the infinite.

  - id: onto
    title: Modal ontological argument
    row: 2
    col: 3
    body: |
      $E$ = "a maximally great being exists". Premises: $\Diamond E$ (possibly) and $\Box(E\Rightarrow\Box E)$. In **S5** they give $E$. But the same definition gives $\Diamond\lnot E\Rightarrow\lnot E$, so **parity**: $\Diamond E\Leftrightarrow E$, and the possibility premise is as hard to grant as the conclusion.
    decoys:
      - body: |
          $E$ = "a maximally great being exists". Premises: $\Diamond E$ (possibly) and $\Box(E\Rightarrow\Box E)$. In **S5** they give $E$. The same definition gives $\Diamond\lnot E\Rightarrow\lnot E$, so **parity**: $\Diamond E$ is **easier to grant** than $E$, because "possibly" is a weak claim.
        feedback: |
          That is the point the parity problem denies. Given the definition, "possibly exists" and "exists" stand or fall together, so granting the possibility premise already grants the conclusion.
      - body: |
          $E$ = "a maximally great being exists". Premises: $\Diamond E$ (possibly) and $\Box(E\Rightarrow\Box E)$. In **S5** they give $E$, and the argument is **a posteriori**, starting from the **existence of the world**. Parity: $\Diamond E\Leftrightarrow E$.
        feedback: |
          The ontological argument starts from the concept alone, with no premise about the world. Starting from the world's existence is the cosmological family.
    explanation: |
      The valid-but-contested case: the logic is accepted, the whole fight is over whether the concept is coherent.

  - id: design
    title: Design argument
    row: 3
    col: 1
    body: |
      **Paley (1802):** a watch implies a maker, so fitted organs imply a designer (analogy, probable not certain). **Hume (1779):** weak analogy, one universe, several or imperfect designers, regress. **Darwin (1859):** variation + inheritance + differential reproduction explain the **appearance** of design. Compare by odds: likelihood ratio $\times$ prior odds.
    decoys:
      - body: |
          **Paley (1802):** a watch implies a maker, so fitted organs imply a designer. **Darwin (1859):** weak analogy, one universe, several or imperfect designers, regress. **Hume (1779):** variation + inheritance + differential reproduction explain the appearance of design. Compare by odds.
        feedback: |
          Hume and Darwin are swapped. Hume (before selection was known) attacked the analogy itself; Darwin supplied a rival mechanism. They are two different kinds of reply.
      - body: |
          **Paley (1802):** a watch implies a maker, so fitted organs imply a designer. **Hume (1779):** weak analogy, one universe, several or imperfect designers, regress. **Darwin (1859):** selection shows there is **no designer**. Compare by odds.
        feedback: |
          Selection explains the appearance of design in living things; it does not show that nothing was designed. Some replies move the question to the laws and conditions that let selection work.
    explanation: |
      Shows two different ways to meet an argument: attack its analogy (Hume), or offer a rival explanation (Darwin).

  - id: moral
    title: Moral argument
    row: 3
    col: 2
    body: |
      **Craig:** if God does not exist, objective moral values and duties do not exist; they exist; so God exists (**modus tollens**). **Euthyphro:** good because God loves it, or loved because good? **Reply:** God's good nature is the standard. **Secular:** Wielenberg, Mackie, **debunking** (genetic fallacy unless origin is cut off from truth).
    decoys:
      - body: |
          **Kant:** if God does not exist, objective moral values and duties do not exist; they exist; so God exists (modus tollens). **Euthyphro:** good because God loves it, or loved because good? **Reply:** God's good nature is the standard. **Secular:** Wielenberg, Mackie, debunking.
        feedback: |
          The form is Craig's. Kant started from the highest good (virtue with deserved happiness) and treated God as a postulate of practical reason, a rational presupposition rather than a proof.
      - body: |
          **Craig:** if God does not exist, objective moral values and duties do not exist; they exist; so God exists (modus tollens). **Euthyphro:** good because God loves it, or loved because good? **Reply:** an evolved origin of moral beliefs **shows they are false**. **Secular:** Wielenberg, Mackie, debunking.
        feedback: |
          That is the genetic fallacy. Where a belief came from does not by itself show it false; a debunker must also show the origin is unconnected to truth. The Euthyphro reply is the divine-nature one.
    explanation: |
      The logic is valid (modus tollens); the whole debate is over the first premise and over what grounds objective morality.

  - id: reason
    title: Argument from reason
    row: 3
    col: 3
    body: |
      **EAAN (Plantinga, 1993):** $P(R\mid N\&E)$ is low or inscrutable, so believing $N\&E$ gives a **defeater** for $R$, hence for $N\&E$ itself (**self-defeat**). **Lewis / Anscombe:** a **cause** of a belief is not a **reason** for it. Reply: selection plausibly rewards reliable faculties.
    decoys:
      - body: |
          **EAAN (Plantinga, 1993):** $P(R\mid N\&E)$ is low or inscrutable, so believing $N\&E$ gives a **defeater** for $R$, hence for $N\&E$ itself. **Lewis / Anscombe:** a **cause** and a **reason** are the same thing. Reply: selection plausibly rewards reliable faculties.
        feedback: |
          The cause/reason distinction is the heart of it: a cause makes a belief occur, a reason supports it as true. Treating them as the same erases the argument's own question.
      - body: |
          **EAAN (Plantinga, 1993):** $P(R\mid N\&E)$ is low or inscrutable, so believing $N\&E$ **proves God exists**. **Lewis / Anscombe:** a cause of a belief is not a reason for it. Reply: selection plausibly rewards reliable faculties.
        feedback: |
          The EAAN targets the combination of naturalism and evolution; at most it casts doubt on that pair. It does not prove God and does not pick out one religion.
    explanation: |
      The one argument aimed at a rival view, not at a feature of the world; hence its conclusion is a doubt, not a being.

  - id: reach
    title: What each argument reaches
    row: 4
    col: 1
    body: |
      Contingency: a **necessary ground**. Kalam: a **cause of the beginning** (a personal one is an extra step). Modal ontological: a necessary, **maximally excellent** being. Design: a **mind or minds** of skill. Moral: a **source of value**. Reason: **doubt about naturalism plus evolution**. None reaches **one religion**.
    decoys:
      - body: |
          Contingency: a **personal creator**. Kalam: a **cause of the beginning**. Modal ontological: a necessary, maximally excellent being. Design: **one all-powerful designer**. Moral: a source of value. Reason: doubt about naturalism plus evolution. None reaches one religion.
        feedback: |
          Contingency gives at most a necessary ground, not a person, and design gives at most a mind or minds of skill, not one all-powerful designer; each rung needs its own premises.
      - body: |
          Contingency: a **necessary ground**. Kalam: a **cause of the beginning**. Modal ontological: a necessary, maximally excellent being. Design: a mind or minds of skill. Moral: a source of value. Reason: doubt about naturalism plus evolution. **Together they reach the God of Christianity.**
        feedback: |
          Even all together, these arguments say nothing about a given scripture, history or tradition. That step needs historical premises, which come later in the course.
    explanation: |
      Applies the ladder: each argument stops at some rung, and none climbs to the top.

  - id: parting
    title: Where people part ways
    row: 4
    col: 2
    span: 2
    body: |
      On **which premise**, not on the logic: whether the totality **needs an explanation** (contingency), whether P1 reaches the universe and physics shows a **first moment** (kalam), whether a maximally great being is **possible** (ontological), how strong the **analogy** is and the **prior** (design), whether morality is **objective** (moral), whether **reliability** is likely (reason). Each also differs on the three layers: fact, live debate, commitment.
    decoys:
      - body: |
          On **the logic**, not on the premises: the arguments are mostly **invalid**, so people disagree about the rules of inference. Contingency: the PSR; kalam: a first moment; ontological: possibility; design: the prior; moral: objectivity; reason: reliability.
        feedback: |
          Most of these arguments are valid; the fights are over premises. Validity is the part people usually agree on, and soundness is where they part.
      - body: |
          On **which premise**, not on the logic, and a clear winner emerges: the premises that critics reject are **all false** and the premises that defenders hold are **all true**. Each also differs on the three layers: fact, live debate, commitment.
        feedback: |
          The course declares no winner. People weigh the same premises differently because they differ on evidence, on values and on starting commitments, and good thinkers sit on both sides.
    explanation: |
      The closing question of every lesson in the level. Naming the premise and the reason is the skill, not choosing a side.

edges:
  - [goal, ladder]
  - [goal, sound]
  - [goal, contingency]
  - [ladder, kalam]
  - [sound, onto]
  - { from: contingency, to: kalam, dashed: true }
  - [contingency, design]
  - [kalam, moral]
  - [onto, reason]
  - [design, reach]
  - [moral, parting]
  - [reason, parting]
  - [reach, parting]

outroTitle: Level 6 in one picture
outro: |
  To **judge an argument** for God, name the conclusion, check the **premises** (soundness is valid plus true premises), the **step** and the **reach** on the **ladder of conclusions**. The **argument from contingency** (PSR, totality, necessary being) needs no beginning; the **kalam argument** needs one (Hilbert's Hotel, BGV with $H_{\text{av}}>0$). The **modal ontological argument** is valid in S5 but meets the parity problem. The **design argument** (Paley) meets Hume's replies and Darwin's rival mechanism. The **moral argument** (Craig's modus tollens, not Kant's postulate) meets Euthyphro and debunking. The **argument from reason** (EAAN, cause versus reason) aims at naturalism plus evolution. Each reaches a **different rung**, none reaches one religion, and people part ways on **which premise** to accept, not on the logic.
