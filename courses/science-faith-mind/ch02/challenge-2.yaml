id: ch02-challenge-2
title: "Level Challenge: Is It Science? (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: how real, and where it stops"
    body: |
      Two problems, independent of part 1. The toolkit from Level 2, restated:

      - **Scientific realism** (according to its defenders): the successful theories of mature science are approximately true, including what they say about things we cannot see. **Instrumentalism** (according to its defenders): a theory is a tool for predicting observations, and its worth is its success, not a claim about hidden reality.
      - **No-miracles argument** (Putnam, 1975): a theory that predicts precisely and often would be a miracle if it were not approximately true.
      - **Pessimistic meta-induction** (Laudan, 1981): many past successful theories (caloric, phlogiston, the ether) were later dropped as false, so today's successful theories may be dropped too.
      - **Three kinds of question**: empirical (settled by observation), normative (what we ought to do or value), metaphysical (what reality is like beyond what observation can settle).
      - **NOMA** (Gould, 1997): science and religion are "non-overlapping magisteria", each with its own domain of authority. **Is-ought gap** (Hume): facts alone never entail an "ought". **Scientism**: the view that science is the only source of real knowledge.
      - **Layers**: (1) established fact, (2) scholarly consensus or live debate, (3) faith or metaphysical commitment.

  - type: mcq
    id: p4-nma
    title: "Problem 4 · Light and the ether"
    prompt: |
      **Problem 4.** Augustin Fresnel (1788-1827) treated light as a wave in an elastic medium, the **ether**, and derived equations for how much light a surface reflects. They matched careful measurements. At normal incidence, from air into a material of refractive index $n$, they give the reflected fraction

      $$R=\left(\frac{n-1}{n+1}\right)^2$$

      According to a defender of the no-miracles argument, what does this success suggest?
    options:
      - text: Such precise predictions would be a miracle if the theory were not approximately true, so Fresnel's picture, ether included, is probably close to how light really is.
        correct: true
      - text: Nothing about reality, because a theory can only ever be a tool for predicting.
        feedback: |
          That is the instrumentalist's reading, not the realist's. The no-miracles argument claims the opposite: that precise success is best explained by approximate truth.
      - text: That the theory is exactly true, so it can never be replaced.
        feedback: |
          Realists claim *approximate* truth, not exact truth, and they allow later theories to improve on earlier ones. "Exactly true and final" is not what the argument says.
      - text: That the ether must be visible with a good enough microscope.
        feedback: |
          The argument is an inference to the best explanation of success, not a prediction about microscopes. The ether was posited precisely because it could not be seen directly.
    explanation: |
      The no-miracles argument is an **inference to the best explanation**: of all the ways to explain a theory's precise success, approximate truth seems the least strange. Its best objection comes next.

  - type: mcq
    id: p4-pmi
    title: "The meta-induction replies"
    prompt: |
      Maxwell's theory (1860s to 1870s) later explained light as a wave in the electromagnetic field, with no elastic ether, and the ether was dropped. According to the pessimistic meta-induction, what follows?
    options:
      - text: Fresnel's theory was very successful yet its central entity does not exist, so success has not reliably signalled truth in the past, and the same may hold for our best theories today.
        correct: true
      - text: Fresnel's measurements were wrong, since the ether does not exist.
        feedback: |
          The reflection measurements stand; Maxwell's theory reproduces them. The objection is that success and a wrong picture of reality occurred together, not that the data failed.
      - text: Every old theory should be discarded and all new theories trusted.
        feedback: |
          The argument cuts the other way: if old successful theories were later dropped, new ones may be as well. It is a reason for caution about every theory.
      - text: Science cannot make predictions at all.
        feedback: |
          The argument accepts the predictions. It questions what they show about unobservable entities and about truth.
    explanation: |
      Laudan lists several cases (caloric, phlogiston, the ether) where success and a later rejection coexisted. The argument is an induction over the history of science: a pessimistic one, aimed at the realist's premise that success indicates approximate truth.

  - type: numeric
    id: p4-water
    title: "The number that survived"
    prompt: |
      Fresnel's reflection formula gives, for light going from air into a material of index $n$ at normal incidence, the reflected fraction $R=\big(\tfrac{n-1}{n+1}\big)^2$. For water, $n=1.33$. What percentage of the light does it reflect? (Answer in percent, one decimal.)
    answer: 2.0
    tolerance: 0.05
    answerText: '2.0'
    wrong:
      - { value: 33, feedback: 'That is $n-1$ as a percent. The formula divides by $n+1$ and then squares.' }
      - { value: 14.2, feedback: 'You forgot to square the ratio $(0.33/2.33)=0.142$. Squaring gives $0.020$.' }
    hint: 'Compute $(1.33-1)/(1.33+1)$ first, then square it.'
    explanation: |
      $(0.33/2.33)^2 \approx 0.0201$, so water reflects about 2.0% at normal incidence. Maxwell's field theory, with no elastic ether, gives **exactly the same formula** from its own boundary conditions. The number survived the change of picture, which is the observation the next card builds on.

  - type: mcq
    id: p4-keep
    title: "What a structural realist keeps"
    prompt: |
      John Worrall (1989) proposed **structural realism**. Using Fresnel and Maxwell, which statement best captures his position, according to its defenders?
    options:
      - text: What carries over from the old theory to the new is the mathematical structure (the equations relating quantities). Success shows that structure is approximately true, while claims about what the entities are, such as an elastic ether, may be dropped.
        correct: true
      - text: Everything in the old theory was true, including the ether, and Maxwell only added to it.
        feedback: |
          Maxwell's theory has no elastic ether. A realist about *everything* in the old theory is exactly the position the history refutes.
      - text: The old theory was entirely false and its success was luck.
        feedback: |
          Then the identical formula in both theories would be an unexplained coincidence. The structural realist uses the survival of the equations as evidence that something real was captured.
      - text: Only observable things are real, so there is nothing to keep.
        feedback: |
          That is closer to constructive empiricism (van Fraassen, b. 1941). The structural realist does believe in unobservable structure; the disagreement is only about what in the theory is believed.
    explanation: |
      Worrall's proposal is a compromise: it keeps the realist's reply to the no-miracles puzzle (the formula is not luck) while answering the pessimistic meta-induction (the ether went, the equations stayed). Its critics ask whether "structure" can be separated from what it is the structure *of*, and whether every theory change really keeps the equations.

  - type: mcq
    id: p4-fair
    title: "Both views, fairly stated"
    prompt: |
      A student writes a summary of the realism debate over Fresnel and Maxwell. Which sentence is fair to both sides?
    options:
      - text: Realists say the precise success of the theory and the survival of its equations are best explained by approximate truth, at least of the structure; instrumentalists reply that success is explained by the theory predicting well, that the history of dropped entities warns against believing in what we cannot observe, and that no further claim is needed.
        correct: true
      - text: Realists are naive about history, and instrumentalists are the only careful thinkers.
        feedback: |
          Realists such as Worrall engage the history directly, and they have a worked-out reply to it. A fair summary does not call either side naive.
      - text: Instrumentalists deny that science works.
        feedback: |
          They accept that science works. They deny that this success obliges us to believe in unobservable entities.
      - text: Realism is established fact, since the equations give correct predictions.
        feedback: |
          Everyone agrees the predictions are correct. Whether that supports *truth about the unobservable* is the live debate.
    explanation: |
      A steelman accepts the other side's evidence and states the disagreement exactly: both agree on the data and the history, and part ways on what success shows about the unobservable.

  - type: mcq
    id: p4-layers
    title: "Layers"
    prompt: |
      Select the claims that are a **live debate** (layer 2) rather than established fact (layer 1).
    multiple: true
    options:
      - text: 'The success of mature theories is good evidence that they are approximately true.'
        correct: true
      - text: 'Fresnel''s formula gives the reflected fraction $R=\big(\tfrac{n-1}{n+1}\big)^2$ at normal incidence, and Maxwell''s theory gives the same formula.'
        feedback: |
          Both statements are checkable by derivation and by measurement: established fact.
      - text: 'A structural realist is right to believe in the structure of a theory and not in its entities.'
        correct: true
      - text: 'Maxwell''s theory has no elastic ether in it.'
        feedback: |
          That is a plain fact about the content of the theory, not a debate.
    explanation: |
      The history and the mathematics are layer 1. Whether success shows truth, and whether structure is the right thing to believe in, are debated among philosophers of science; where one lands also depends on one's wider metaphysical commitments (layer 3).

  - type: mcq
    id: p5-parts
    title: "Problem 5 · A compound claim"
    prompt: |
      **Problem 5.** A speaker says: "Science shows that prayer is pointless, so we should stop funding hospital chaplains." Which split into parts is the most accurate?
    options:
      - text: 'Empirical: whether prayer changes medical outcomes. Metaphysical: whether prayer is "pointless" in a wider sense (whether there is anyone to hear it, what it means to the person). Normative: whether chaplains should be funded.'
        correct: true
      - text: 'All three parts are empirical, since chaplains can be counted and prayer can be studied.'
        feedback: |
          Counting chaplains is empirical, but "should we fund them" asks what we ought to do and which values count (comfort, dignity, cost). Counting cannot settle an "ought".
      - text: 'The whole claim is metaphysical, because it mentions prayer.'
        feedback: |
          Part of it is empirical: a trial can test whether prayer by strangers changes recovery. Only part of what "pointless" means goes beyond observation.
      - text: 'The whole claim is normative, because it ends in "we should".'
        feedback: |
          Only the last clause is normative. The rest makes factual and wider claims that need separate attention.
    explanation: |
      Splitting is the first move in judging a compound claim. The word "pointless" hides two jobs: a narrow factual claim (no medical effect) and a wide one (no value or meaning), and the policy needs a value premise besides.

  - type: mcq
    id: p5-gap
    title: "From fact to policy"
    prompt: |
      Suppose a large, well-run trial finds no medical effect of intercessory prayer (prayer by others for a patient). According to Hume's is-ought gap, what does this result alone allow?
    options:
      - text: It supports a factual conclusion about medical outcomes. A policy conclusion about funding chaplains also needs a value premise, such as "chaplaincy should be funded only if it improves medical outcomes".
        correct: true
      - text: It settles that chaplains should lose their funding.
        feedback: |
          That jumps from "is" to "ought". Chaplains are often funded for comfort, dignity or support for families, not as a medical treatment, and the trial did not measure those.
      - text: It settles that chaplains should keep their funding.
        feedback: |
          The same gap works in both directions: the trial does not entail a policy either way.
      - text: Nothing, because trials say nothing about prayer.
        feedback: |
          A trial can say something definite about a narrow question (medical outcomes). The gap is about what follows, not about whether the trial means anything.
    explanation: |
      Hume (*Treatise*, 1739) observed that writers slide from "is" statements to "ought" statements without saying what extra premise carries them. Making the value premise explicit lets people who agree on the facts disagree openly about the value.

  - type: mcq
    id: p5-step
    title: "A narrow test"
    prompt: |
      The STEP trial (Benson and colleagues, 2006) followed 1,802 heart-surgery patients and found no benefit from being prayed for by distant groups. Which conclusion does it support?
    options:
      - text: In that setting, being the subject of distant intercessory prayer did not improve recovery. It does not test whether prayer has other meanings for the person who prays, nor whether anyone hears it.
        correct: true
      - text: Prayer is shown to be meaningless.
        feedback: |
          The trial measured one outcome of one kind of prayer. Meaning for the person who prays, or the existence of anyone who hears, was not within its reach.
      - text: God does not exist.
        feedback: |
          No trial of this kind could settle that. Some believers also object that God cannot be put to a test, so a null result there is no refutation for them; skeptics reply that then the claim of a medical effect would not be testable either. The two readings agree on what the trial measured.
      - text: The trial proves prayer helps the people who pray in other circumstances.
        feedback: |
          Nothing in a null result supports a benefit elsewhere either.
    explanation: |
      A well-designed test earns its narrow conclusion and no more. Keeping the scope of a result small is part of judging a sweeping claim.

  - type: mcq
    id: p5-noma
    title: "Gould's proposal and its critics"
    prompt: |
      Stephen Jay Gould (1941-2002) proposed NOMA in 1997: science covers the empirical realm, religion covers questions of meaning and value, and neither can overrule the other. Which is the strongest *objection*, according to critics, stated fairly?
    options:
      - text: Many religions make factual claims (about origins, healings, miracles), which fall inside the realm of evidence, so the domains overlap. A defender of NOMA replies that such claims are better read as expressions of meaning, though many believers would reject that reading.
        correct: true
      - text: NOMA is false because religion has no questions of value.
        feedback: |
          Critics do not say that. The objection is about factual claims within religions, not about whether religion deals with value.
      - text: NOMA is false because science answers value questions too.
        feedback: |
          Even many scientists accept the is-ought gap, so this is not the usual objection. The usual one is that religions also assert facts.
      - text: NOMA is false because Gould was not religious.
        feedback: |
          Who proposes an argument does not decide whether it works. The question is whether the domains really do not overlap.
    explanation: |
      NOMA is a proposal for peace, and it is attractive to people on both sides. It works best for questions of meaning and value and worst where a tradition asserts that a particular event happened. Whether that is an argument against NOMA or against reading the claim literally is part of the debate.

  - type: mcq
    id: p5-scientism
    title: "How far can science go?"
    prompt: |
      Strong scientism says: "Only claims that science can test are meaningful or known." Modest scientism says: "For questions about the natural world, science is our most reliable method." Which comment is fair?
    options:
      - text: 'Modest scientism is widely shared, including by many believers. Strong scientism faces a self-reference problem: the claim "only testable claims are known" is not itself testable by an experiment.'
        correct: true
      - text: Both versions have the same strength, since both praise science.
        feedback: |
          The strong version rules out ethics, mathematics and philosophy as sources of knowledge. The modest version claims only that science is best for one domain.
      - text: Strong scientism is the only honest position for a scientist.
        feedback: |
          Many scientists reject it, and some hold the modest version while accepting that ethics and mathematics need other methods.
      - text: Modest scientism proves there is no God.
        feedback: |
          It says nothing about God. Whether there is a being beyond nature is a metaphysical question that this claim leaves open.
    explanation: |
      The self-reference objection does not make the strong view false, only unsupported by its own standard. Its defenders can reply that the claim is a philosophical thesis supported by the success of science.

  - type: mcq
    id: p5-layers
    title: "Layers"
    prompt: |
      Classify: "There is nothing beyond nature, so questions about what lies beyond it have no answer." Which layer is it?
    options:
      - text: 'A metaphysical commitment (layer 3), held on philosophical grounds. A theist holds the opposite commitment, and neither is established by an experiment.'
        correct: true
      - text: 'Established fact (layer 1), because science has found nothing beyond nature.'
        feedback: |
          "Has found nothing" is a fact about what methods of nature can detect. "There is nothing" is a further claim that the methods themselves cannot decide.
      - text: 'Settled consensus (layer 2), since most scientists agree.'
        feedback: |
          Many scientists adopt methodological naturalism (work as if only natural causes operate), which is a working rule. Metaphysical naturalism is a stronger thesis, and scientists differ on it.
    explanation: |
      Keeping methodological naturalism (a rule of method) apart from metaphysical naturalism (a thesis about reality) lets believers and non-believers do the same science.

  - type: order
    id: method
    title: "A method for any claim"
    prompt: |
      Put in order a method for judging any sweeping claim, using the tools of the level.
    steps:
      - 'State the claim and ask what possible result would count against it (is it testable?).'
      - 'List the auxiliary assumptions bundled with it, since a failed prediction refutes the bundle.'
      - 'Weigh how much the evidence supports it, by how much it moves belief from the starting point (the likelihood ratio).'
      - 'Check it on held-out or risky tests, not only on the data it was built to fit.'
      - 'Label each part as fact, live debate or commitment, and say which kind of question it is.'
    hint: 'Start with whether the claim can fail, and end with labelling what you found.'
    explanation: |
      Testability comes first, because a claim that cannot fail cannot be supported. The bundle comes next, so a failure is not blamed on the wrong part. Then the amount of support, then a check against held-out data, then labelling the layers so the conclusion is stated with its limits.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **How real is the success?** According to the no-miracles argument (Putnam), precise success is best explained by approximate truth. According to the pessimistic meta-induction (Laudan), many successful theories were dropped, so success may not signal truth. According to structural realism (Worrall, 1989), what survives a change of theory is the structure: Fresnel's $R=\big(\tfrac{n-1}{n+1}\big)^2$ (2.0% for water, $n=1.33$) remained in Maxwell's theory while the ether went.
      - **Where science stops**: split a compound claim into empirical, normative and metaphysical parts. A fact never entails an "ought" without a value premise (Hume). A narrow test, such as the STEP trial (1,802 patients), supports a narrow conclusion. NOMA (Gould) and its critique, and strong versus modest scientism, are live debates.
      - **A method**: testable, bundle, how much support, held-out, layers.

      What stays open: whether success shows truth about the unobservable, whether structure can be separated from what it is the structure of, whether the domains of science and religion overlap, and whether strong scientism can support itself.

      **Next:** Level 3, *Views of Reality*: materialism, idealism, dualism, panpsychism and what quantum mechanics does and does not force on us.
