id: ch02-induction
title: Why the Sun Will Rise Tomorrow
kind: concept
own: |
  - **Two kinds of argument.** A **deductive** argument is one where, if the premises are true, the conclusion cannot be false (all metals expand; iron is a metal; so iron expands). An **inductive** argument carries us from cases we have seen to cases we have not: "the Sun has risen every day so far, so it will rise tomorrow". Induction is how science, and daily life, reaches beyond the evidence in hand.
  - **Hume's problem.** According to **Hume** (1711-1776), the step from past to future needs a bridge premise, the uniformity principle:
  $$\text{the future will resemble the past}$$
  It is not a truth of logic (denying it is not a contradiction), and the only evidence for it is that it worked before, which is {{ circular: it uses induction to justify induction }}. So, Hume argues, {{ no argument from past to future avoids circularity }}. Hume's own answer: we expect the future by **custom or habit**, not by reason.
  - **Russell's chicken.** The chicken, fed every morning, grows more sure each day that it will be fed, up to the day the farmer wrings its neck. According to **Russell** (1872-1970), a long unbroken record raises confidence but {{ does not show that the pattern cannot change }}.
  - **Replies, none a knock-out.** (1) **Popper** (1902-1994): science does not use induction, it {{ proposes bold conjectures and tries to refute them }}. (2) **Reichenbach** (1891-1953), a vindication: we cannot prove induction works, but {{ if any method can find regularities, induction will; so we lose nothing by using it }}. (3) **Bayesian**: start with prior probabilities and update them with Bayes' rule. Laplace's rule says that after $n$ successes in $n$ trials, with no failures,
  $$P(\text{success next}) = \frac{n+1}{n+2}$$
  but this rests on a prior that already assumes the world is regular, so the assumption moved rather than vanished. (4) **Inference to the best explanation**: the best account of the record is a stable law, but "best" is judged using the very regularity in question.
  - **Goodman's new riddle** (1955). Fix a time $t$. An object is **grue** if it is *green when first examined before $t$, and blue when examined later*. Every emerald seen so far is green and also grue, so the evidence {{ fits both "all emeralds are green" and "all emeralds are grue" equally }}, yet they predict different colours after $t$. Induction needs a way to say which patterns may be projected, and the data alone cannot say.
  - **Where thoughtful people part ways.** Whether the problem is a real hole in science (the sceptical reading), a demand for certainty that nothing could meet (the practical reading), or settled by accepting a basic trust in nature's order as a **faith-like commitment** that science itself rests on (layer 3, not layer 1).
cards:
  - type: mcq
    id: hook
    title: "Will the Sun rise tomorrow?"
    prompt: |
      Every day of your life, and of every person you know, the Sun has risen. Before any theory, **guess**: what is the best reason we have for expecting it to rise tomorrow?
    options:
      - text: 'It has always risen before, so we expect the pattern to continue.'
        correct: true
      - text: 'Astronomy proves it with certainty, so there is no reason to doubt.'
        feedback: |
          Astronomy gives very good reasons, but look at what they use: laws such as gravity that were tested in the past. Whether they keep holding tomorrow is the very question. So "proves with certainty" claims more than the record can give.
      - text: 'There is no reason; it is only a guess.'
        feedback: |
          It is not a blind guess: we have an enormous record. The puzzle is how a record of the past can *justify* a claim about the future, and that is harder than it looks.
    explanation: |
      Most people answer with the record. The question of this lesson is whether the record can really carry us to tomorrow. This old puzzle has a name: the **problem of induction**.

  - type: widget
    id: sampler-sun
    widget: sequence-sampler
    config:
      rule: change
      changeAt: 37
      seed: 1
      symbols: ["☀", "🌑"]
      claim: "The Sun rises every day."
      max: 80
      labels:
        next: "Next day"
        ten: "Ten days"
        reset: "Start over"
        empty: "No day observed yet."
      presets:
        - { label: "Another hidden rule", rule: change, changeAt: 14, seed: 2 }
    body: |
      A toy world has a hidden rule for its Sun. Press **Next day** or **Ten days** and watch the claim "The Sun rises every day". Stop whenever you feel sure the Sun will rise on the **next** day, and note how many days you had seen. Then keep going.

  - type: mcq
    id: sampler-q
    prompt: |
      In a toy world the Sun rose on each of the first 30 days. A hidden rule might break the pattern on some later day, say day 37. Looking only at those 30 days, which statement is correct?
    options:
      - text: 'The 30 days fit both "the pattern holds forever" and "the pattern changes on day 37", so the record alone cannot tell them apart.'
        correct: true
      - text: 'The record shows the pattern holds forever, since all 30 days agree.'
        feedback: |
          Thirty out of thirty is a lot, but a rule that breaks on day 37 gives exactly the same first 30 days. The record is silent about which rule is behind it.
      - text: 'The record shows the pattern will break soon, because long streaks never last.'
        feedback: |
          Nothing in 30 sunrises says that either. Long streaks sometimes end and sometimes do not; the record does not announce which.
    explanation: |
      Every unbroken record is consistent with a rule that continues and with rules that change later. The record cannot choose between them without help from something else. Finding that "something else" is the problem.

  - type: text
    id: kinds
    title: "Two kinds of argument"
    body: |
      A **deductive** argument is one where, if the premises are true, the conclusion *cannot* be false:

      > All metals expand when heated. Iron is a metal. So iron expands when heated.

      An **inductive** argument goes from cases we have seen to cases we have not:

      > Every sunrise so far was followed by another. So tomorrow's sunrise will happen.

      Induction can make a conclusion likely but never *guaranteed* in the way deduction does. Yet science (every law is tested on a few cases and applied to all) and daily life (bread nourished you yesterday) lean on it constantly.

  - type: mcq
    id: kinds-q
    title: "Deduction or induction?"
    prompt: |
      Which of these is **inductive**?
    options:
      - text: 'Every swan I have seen is white, so the next swan I see will be white.'
        correct: true
      - text: 'All birds have feathers; a swan is a bird; so a swan has feathers.'
        feedback: |
          If both premises are true, the conclusion cannot be false. That is deduction.
      - text: 'Either the shop is open or it is closed; it is not open; so it is closed.'
        feedback: |
          Again the conclusion follows with certainty from the premises: deduction.
    explanation: |
      The mark of induction: the conclusion says **more** than the premises. "The next swan" is a case the premises never mention. That extra reach is what makes induction useful, and what makes it risky.

  - type: text
    id: hume
    title: "Hume's question"
    body: |
      **David Hume** (1711-1776), a Scottish philosopher, raised the question in his *Treatise of Human Nature* (1739) and more briefly in his *Enquiry concerning Human Understanding* (1748). In a paraphrase of his argument:

      - **P1.** To go from "the Sun has risen every day so far" to "it will rise tomorrow", we need a bridge premise: **the future will resemble the past** (the *uniformity principle*).
      - **P2.** This is not a truth of logic: "the future will not resemble the past" is *not* a contradiction, since we can imagine it.
      - **P3.** So we need **evidence** for it. The only evidence is that the future has resembled the past *so far*.
      - **P4.** But using that evidence to conclude it will keep doing so is itself an inductive step.
      - **C.** So every attempt to justify induction *assumes* induction. No argument from past to future avoids circularity.

      Hume did not say we should stop expecting sunrises. He said that **reason** cannot be what justifies the expectation.

  - type: mcq
    id: circular-q
    title: "Spot the circle"
    prompt: |
      Someone replies to Hume: "Induction has worked splendidly in the past: it predicted eclipses, bridges that stand, medicines that work. So induction will keep working." What is Hume's objection?
    options:
      - text: 'This is itself an inductive argument (it worked before, so it will work again), so it assumes the thing it was meant to justify.'
        correct: true
      - text: 'The examples are false: induction never predicted eclipses.'
        feedback: |
          The examples are true, and Hume would grant them. His point is about the *shape* of the reply, not its facts.
      - text: 'Hume has no objection; a long list of successes is exactly what justification means.'
        feedback: |
          A long list of successes is what raises the expectation, but to turn it into a justification *for the future* the reply uses "past success predicts future success", which is the principle in question.
    explanation: |
      A **circular** argument has its conclusion already inside a premise. Here the premise "past success predicts future success" is induction, and the conclusion "induction will keep working" is about induction.

  - type: order
    id: hume-order
    prompt: |
      Put the steps of Hume's argument in order: why no argument from the past to the future avoids circularity.
    steps:
      - 'To move from "the Sun always rose" to "it will rise tomorrow", we need a bridge: the future will resemble the past.'
      - 'The bridge is not a truth of logic: denying it is not a contradiction.'
      - 'So any support for it must come from experience: it has held so far.'
      - 'Concluding from "it held so far" that "it will hold tomorrow" is itself an inductive step.'
      - 'So the justification assumes what it was meant to justify: it is circular.'
    hint: Start with the gap, then ask what could fill it.
    explanation: |
      The argument first names the missing bridge, then checks the two possible sources of support: logic (not available) and experience (circular).

  - type: mcq
    id: critic
    title: "Which premise would a critic reject?"
    prompt: |
      A critic wants to resist Hume's conclusion by saying: "A self-supporting argument, such as *induction has worked, so induction is reliable*, is not vicious just because it is circular in this way." Which step of Hume's argument does this critic press on?
    options:
      - text: 'P4: using past success to support the principle is said to be a legitimate step after all.'
        correct: true
      - text: 'P2: they claim the principle is a truth of logic.'
        feedback: |
          That would be a different reply (and a hard one: it is easy to imagine the principle failing without contradiction). This critic accepts that the principle is not logical and pushes on how it is supported.
      - text: 'The conclusion C: they claim we should stop expecting sunrises.'
        feedback: |
          Nobody, Hume included, says that. The dispute is about *what justifies* the expectation, not about whether to hold it.
    explanation: |
      Replies to Hume differ in which step they press: denying P2 (the principle is a logical or built-in truth), denying that P4 is vicious (self-supporting arguments), or accepting the conclusion and asking what to do about it. The next cards meet the main ones.

  - type: mcq
    id: chicken
    title: "Russell's chicken"
    prompt: |
      **Bertrand Russell** (1872-1970) told of a chicken fed by the farmer every morning. Each day it grows more sure it will be fed again, until the day the farmer wrings its neck. What does the story illustrate about induction?
    options:
      - text: 'A long unbroken record raises confidence, but cannot show that the pattern cannot change; the record itself does not reveal a coming break.'
        correct: true
      - text: 'Induction is always wrong.'
        feedback: |
          The chicken was right every day but the last. Induction usually works; the story shows its logical limit, not that it usually fails.
      - text: 'A clever chicken would have seen the break coming from the feeding record alone.'
        feedback: |
          From the feeding record alone, no pattern says "tomorrow is different". A cleverer chicken would need extra knowledge (about farms), and that is knowledge from outside the record.
    explanation: |
      The chicken's best evidence is a long, perfect record. Its confidence was reasonable, and it was wrong. Whether we are, with the Sun, in the chicken's position depends on knowledge beyond the record, which is exactly what Hume asks us to justify.

  - type: text
    id: replies
    title: "What do we do about it?"
    body: |
      Philosophers have given several kinds of reply. None has made the problem disappear, and thoughtful people disagree about which comes closest. Here are four, each in the form its defenders would accept.

      1. **Bypass it** (Popper): science does not need induction.
      2. **Vindicate it** (Reichenbach): we cannot show it works, but we can show that using it is the best bet.
      3. **Reshape it** (Bayesian reasoning): treat belief as probability and update with evidence.
      4. **Explain it away** (inference to the best explanation): a stable law explains the record better than any rival.

      The next cards take them in turn, with the best objection to each.

  - type: mcq
    id: popper
    title: "Popper's bypass"
    prompt: |
      **Karl Popper** (1902-1994) said: scientists do not verify theories by induction; they propose bold conjectures and try hard to refute them. A theory that survives is *corroborated* (it has passed tests), never proved. According to Popper, how is Hume's problem avoided?
    options:
      - text: 'Science never needed an inductive step from "seen so far" to "true always"; refutation (a deductive step from one counter-case) does the real work.'
        correct: true
      - text: 'By proving that the future must resemble the past.'
        feedback: |
          Popper accepts Hume's conclusion that this cannot be proved. His move is to say science does not rest on it.
      - text: 'By showing that a theory is true once it passes a hundred tests.'
        feedback: |
          Popper insists that passing tests never makes a theory true; it only fails to refute it so far.
    explanation: |
      One black swan refutes "all swans are white" with certainty; no number of white swans proves it. Popper builds science on that asymmetry. The next lesson, on Popper and the black swan, tests this idea.

  - type: mcq
    id: popper-obj
    title: "The strongest objection to the bypass"
    prompt: |
      A theory has survived every test so far. We build a bridge on it, trusting it to hold tomorrow. A critic says Popper's bypass still leaves something over. What?
    options:
      - text: 'Relying on a corroborated theory for tomorrow already treats its past survival as a guide to the future, which looks like induction again.'
        correct: true
      - text: 'Refutation is not logically valid.'
        feedback: |
          Refutation is valid: if a theory implies a result and the result fails, the theory fails (assuming the test was set up as described). The trouble lies in the use of surviving theories, not in refuting ones.
      - text: 'Scientists do not try to refute their theories.'
        feedback: |
          Many do, and Popper's point is as much about what they should do as what they do. The objection here is about what the surviving theory licenses.
    explanation: |
      Popper's reply: we do not *believe* the theory; we choose it as the best-tested one. His critics find that "best-tested, therefore best to rely on" reintroduces the step he wanted to avoid. Whether that is damaging or merely practical is a live debate.

  - type: mcq
    id: reichenbach
    title: "Reichenbach's vindication"
    prompt: |
      **Hans Reichenbach** (1891-1953) argued: suppose nature has *some* regularity that a method could find. Then induction (extend the pattern seen so far) will eventually home in on it. If nature has none, no method can predict anything. According to Reichenbach, what does this give us?
    options:
      - text: 'Not a proof that induction works, but a practical argument: if any method can succeed, induction will, so using it costs nothing compared with the alternatives.'
        correct: true
      - text: 'A proof that nature is regular.'
        feedback: |
          The argument is conditional: *if* there is a regularity. It does not say there is one.
      - text: 'A proof that induction is circular and should be dropped.'
        feedback: |
          The vindication accepts Hume's point that induction cannot be justified by reason, and asks a different question: is there a better bet? It argues there is not.
    explanation: |
      The best objection: "will eventually home in" is cold comfort, since many rival methods (such as "extend the pattern until day 37, then switch") do equally well in the long run. The argument does not tell us what to expect on any particular day.

  - type: numeric
    id: laplace
    title: "A Bayesian answer"
    prompt: |
      **Pierre-Simon Laplace** (1749-1827) gave a rule for the Bayesian approach: start with no preference about how likely a sunrise is (a flat prior), and after $n$ sunrises with no failures, the probability that the next one happens is
      $$\frac{n+1}{n+2}$$
      A newcomer has seen $n=10$ sunrises and no failures. By Laplace's rule, what is the probability of an 11th sunrise, as a decimal between 0 and 1?
    answer: 0.9167
    tolerance: 0.001
    answerText: '11/12 ≈ 0.917'
    wrong:
      - { value: 1, feedback: "A finite record never gives certainty under this rule; the formula always leaves a gap of $1/(n+2)$." }
      - { value: 0.9091, feedback: "That is $10/11$, which is $n/(n+1)$. Laplace's rule adds 1 to the numerator and 2 to the denominator." }
    hint: Put $n=10$ into the formula.
    explanation: |
      $\dfrac{10+1}{10+2}=\dfrac{11}{12}\approx0.917$. For Laplace's own illustration (about 5000 years of recorded history, roughly 1,826,213 days), the same rule gives odds of about 1,826,214 to 1 in favour of tomorrow's sunrise.

  - type: mcq
    id: laplace-obj
    title: "What did the Bayesian assume?"
    prompt: |
      Laplace's rule gives a clear number after any record. According to critics, why does it not dissolve Hume's problem?
    options:
      - text: 'The flat prior treats every day as alike, with one fixed unknown chance of success; that already assumes the world is regular.'
        correct: true
      - text: 'Probability cannot be used on events like sunrises.'
        feedback: |
          It can be used; the dispute is about the starting assumptions, not about whether the mathematics applies.
      - text: 'Bayes'' rule is not valid.'
        feedback: |
          Bayes' rule is a theorem and is fine. What the critics question is the *prior* that goes into it, not the rule.
    explanation: |
      Bayes' rule tells us how to update. It does not tell us where the starting probabilities come from. Starting from a prior that expects regularity, evidence confirms regularity; starting from one that expects change on any day, no record would ever raise the odds for tomorrow. So the assumption moved into the prior instead of disappearing. Defenders answer that priors are open to revision by evidence, and that nobody starts from nothing.

  - type: mcq
    id: ibe
    title: "The best explanation"
    prompt: |
      A fourth reply: the best explanation of a long run of sunrises is a stable law (the Earth turns steadily), so we may infer it will keep turning. What is the standard objection?
    options:
      - text: 'To judge a stable law "better" than "it works until day 37", we already rely on simple, regular accounts being more likely, which is what induction assumes.'
        correct: true
      - text: 'No explanation of sunrises exists.'
        feedback: |
          Astronomy offers a detailed one. The objection is about how we rank explanations.
      - text: 'Explanations are never useful in science.'
        feedback: |
          They are central to science. The worry is about what makes one "best" and whether that assumes regularity.
    explanation: |
      Defenders reply that simplicity and fit with the rest of what we know are real marks of a good explanation, not mere habit. Critics answer that why those marks point to truth is the same puzzle again.

  - type: text
    id: grue
    title: "A newer riddle: grue"
    body: |
      **Nelson Goodman** (1906-1998) added a twist in 1955 (*Fact, Fiction, and Forecast*). Pick a fixed time $t$, say the year 3000. Call an object **grue** if it is *green when first examined before $t$, and blue when examined later*.

      Every emerald ever examined is green. It is therefore also grue, because every one was examined before $t$.

      So the same evidence supports two generalisations: "all emeralds are green" and "all emeralds are grue". After $t$ they disagree: the first says an emerald examined later is green, the second says it is blue.

  - type: mcq
    id: grue-q
    title: "Which one does the evidence favour?"
    prompt: |
      All emeralds examined so far (before the time $t$) were green. Both "all emeralds are green" and "all emeralds are grue" (green if examined before $t$, blue after) fit every one of them. What follows?
    options:
      - text: 'The evidence alone cannot choose between them; something more than the data must say why "green" is the pattern to extend.'
        correct: true
      - text: 'The evidence favours "green", because green emeralds are more numerous.'
        feedback: |
          Every green emerald examined is also grue, so the counts are identical. The evidence treats both equally.
      - text: 'Neither generalisation can be tested.'
        feedback: |
          Both can be tested, but only after the time $t$. Until then the data cannot separate them.
    explanation: |
      We feel "green" is the natural choice because "grue" mentions a time. Goodman's point: that feeling is exactly what needs explaining. A rule for induction ("extend the pattern") must say *which* patterns may be projected, and the data do not tell us.

  - type: mcq
    id: grue-reply
    title: "Is grue just a bad word?"
    prompt: |
      Some reply that "grue" is a bad predicate because its meaning depends on a time. Define **bleen** as *blue when examined before $t$, green after*. Why is the reply not decisive?
    options:
      - text: 'Someone who speaks "grue" and "bleen" can define "green" as "grue before $t$, bleen after": which words look time-dependent depends on the vocabulary chosen.'
        correct: true
      - text: 'There is no such thing as time.'
        feedback: |
          Nothing in the puzzle denies time. The trick is only about how we choose words.
      - text: 'Colours are not real, so the puzzle has no point.'
        feedback: |
          Colour stands for any measured property here; the same puzzle works for mass, charge or any other quantity.
    explanation: |
      Goodman's own answer: the predicates we can project are those with a track record of being projected ("entrenchment"). Others say natural kinds or simpler laws decide. These are live proposals, not settled answers.

  - type: mcq
    id: hume-own
    title: "What did Hume himself conclude?"
    prompt: |
      Hume did not say that we should stop expecting sunrises. According to Hume, what is the source of our expectation?
    options:
      - text: 'Custom or habit: after many repetitions the mind expects the next one, and that is a fact about human nature, not a result of reason.'
        correct: true
      - text: 'A proof from astronomy.'
        feedback: |
          Astronomy rests on induction too, so it cannot be the independent ground.
      - text: 'A divine promise that the world is orderly.'
        feedback: |
          Some thinkers take that route (the order of nature as a gift of a creator), but it was not Hume's. For Hume it is an observation about how the mind works.
    explanation: |
      Hume's verdict is two-sided: induction cannot be justified by reason, and we cannot help using it. Some read this as scepticism; others, as a reminder that reasoning starts from trust we do not choose.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      The lesson separates three layers: established fact, live debate, and faith or metaphysical commitment. Which of these claims is **established fact** rather than debate or commitment?
    options:
      - text: 'Hume argued, in 1739 and 1748, that past experience cannot justify the uniformity principle without circularity.'
        correct: true
      - text: 'Induction is therefore irrational.'
        feedback: |
          This is a live debate. Hume himself did not say so, and many hold that "justified" can mean something other than "proved by deduction".
      - text: 'The world is ordered, so induction is justified.'
        feedback: |
          This is a faith or metaphysical commitment: it asserts an order that reaches tomorrow and takes it to justify induction, but the record cannot show it.
    explanation: |
      What Hume argued is a historical fact. Whether his argument succeeds is debated. Whether nature is orderly in a way that reaches tomorrow is, for many, a commitment on which science rests rather than a result science proves.

  - type: mcq
    id: resolve
    title: "Back to the Sun"
    prompt: |
      Return to the hook: what is the best reason to expect the Sun tomorrow, now that we have met Hume?
    options:
      - text: 'A very large record plus well-tested laws make it extremely probable. Whether that *justifies* the expectation, or only describes our habit, is the open question, and depends on which reply one finds convincing.'
        correct: true
      - text: 'It is certain, because the argument against induction is clearly broken.'
        feedback: |
          Nobody has shown it broken beyond dispute. Several replies are respectable; none is accepted by everyone.
      - text: 'It is a coin toss, because Hume proved we know nothing about the future.'
        feedback: |
          Hume proved no such thing. He argued that reason cannot justify the step; he never suggested the odds are even.
    explanation: |
      Notice the two layers. The practical expectation is extremely strong, and everyone acts on it. The philosophical question of what grounds it remains open: sceptics, Popperians, vindicators, Bayesians and those who rest it on trust in nature's order give different answers, each at some cost.

  - type: text
    id: summary
    body: |
      **Next:** Popper's idea of refutation, the black swan, and where falsifiability is powerful but incomplete.
