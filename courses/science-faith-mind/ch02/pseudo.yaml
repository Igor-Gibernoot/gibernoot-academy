id: ch02-pseudo
title: "Science, Pseudoscience and Fringe Claims"
kind: concept
own: |
  - **The demarcation problem** is the question of what, if anything, separates science from pseudoscience (a field that borrows the look of science without its checks). According to Karl Popper (1902-1994) the line is {{ falsifiability: a claim must forbid some possible observation }}. According to Thomas Kuhn (1922-1996) a mature science is organised around puzzle-solving inside a shared paradigm. According to Imre Lakatos (1922-1974) the unit to judge is a *research programme*, which is *progressive* when it predicts new facts and *degenerating* when it only patches itself after failures.
  - **Marks of pseudoscience** (a cluster, not a checklist), according to Popper and Lakatos: claims that {{ no possible observation could refute }}; *ad hoc* rescues, meaning patches that only save the claim and predict nothing new; no progress over long periods; and no independent checking (blinding, replication, open criticism).
  - **Fair tests of odd claims.** Astrology is testable and was tested: in a double-blind matching test published in 1985 (Shawn Carlson, *Nature*), 28 astrologers matched birth charts to personality profiles about as well as chance (roughly one in three right) though they had expected far better. Homeopathy's "30C" dilution means 30 steps of 1 part in 100, so the factor is
  $$100^{30} = 10^{60}$$
  and with about $6\times10^{23}$ molecules in a mole, {{ the expected number of original molecules left is about $6\times10^{-37}$, essentially none }}. Homeopaths answer with a "memory of water" idea, which is a claim chemistry has no mechanism for; trials are the fair judge.
  - **Weak evidence barely moves a low prior.** In odds form, with prior probability $P(H)=1\%$ and likelihood ratio $\mathrm{LR}=P(E\mid H)/P(E\mid \neg H)$:
  $$\text{posterior odds} = \mathrm{LR}\times\text{prior odds}$$
  {{ with an LR of $1.1$ the posterior is about $1.1\%$ }}, and with an LR of $3$ about $2.9\%$. Hence the value of strong, blinded tests that give a large LR.
  - **The line is blurry.** Two views: a sharp criterion (Popper) versus a *family-resemblance cluster* of marks (Larry Laudan, 1983, argued that no single criterion works). Hard cases: early continental drift (Alfred Wegener, 1912; rejected, then accepted in the 1960s with plate tectonics), string theory (debated: mathematically rich, few testable predictions so far, according to critics), psychoanalysis. {{ A rejected or unproven idea is not automatically pseudoscience }}; what matters is how the field responds to tests and failure.
  - **Layers.** That astrology's matching test gave chance results and that 30C leaves no molecules are established facts; how to draw the science line and how to classify string theory are live debates; whether a worldview deserves respect beyond its testable claims is a commitment.
cards:
  - type: mcq
    id: hook
    title: "Three claims, one label?"
    prompt: |
      Three claims:

      **A.** Your birth date and the planets' positions at that moment shape your personality and life (astrology).

      **B.** A remedy diluted until almost no active substance remains cures illness, and the more diluted the stronger (homeopathy).

      **C.** There exists a particle too heavy to be made in any machine we can build, and it explains dark matter (a speculative physics idea).

      Before any theory: guess. What is the best first step to decide which deserve to be called science?
    options:
      - text: 'Pick by subject: physics claims are science, the others are not.'
        feedback: |
          Tempting, but a physics idea can be untestable and an "alternative" claim can be tested. Claim C may be hard to test; claims A and B were tested, and failed. Subject does not decide.
      - text: 'Pick by how crazy the claim sounds.'
        feedback: |
          Strange claims have been right (continental drift sounded absurd in 1912). Strangeness is a poor guide; checks are a better one.
      - text: 'Ask what each claim forbids, how it was tested, and what its followers do when a test fails.'
        correct: true
    explanation: |
      Whether a field is scientific is judged by its **habits of checking**, not by its topic or by how strange it sounds. This lesson gives the best tools for doing this fairly, including to claims many of us find odd. Pseudoscience here means a field that borrows the look of science (jargon, charts, lab coats) without its checks.

  - type: text
    id: demarcation
    title: "The demarcation problem"
    body: |
      **Demarcation** means drawing a boundary: what separates science from non-science and from pseudoscience? Three answers, recalled:

      - **Falsifiability** (Karl Popper, 1902-1994): a claim is scientific if it *forbids* some possible observation, so a result could refute it. "It will rain or not rain tomorrow" forbids nothing.
      - **Puzzle-solving** (Thomas Kuhn, 1922-1996): a mature science works inside a shared *paradigm* (a model of what problems and answers look like) and solves puzzles; astrology, he said, had no puzzle-solving tradition, since its failures were blamed on the astrologer.
      - **Research programmes** (Imre Lakatos, 1922-1974): judge a whole programme over time. It is **progressive** if it predicts new facts that are later confirmed, **degenerating** if it only adds patches after each failure.

      Notice that the three overlap but are not the same test. We will use them as a toolbox.

  - type: text
    id: marks
    title: "Four marks, according to Popper and Lakatos"
    body: |
      Putting their ideas together gives four **marks** often found in pseudoscience. They are signs, not a checklist: a real science can show one briefly, and the marks matter as a *cluster* that persists.

      1. **Unfalsifiable**: no possible observation would count against the claim.
      2. ***Ad hoc* rescue** (Latin: "for this purpose"): after a failure, a patch is added that saves the claim but predicts nothing new.
      3. **No progress**: the same claims for decades or centuries, with no new, tested predictions.
      4. **No independent checking**: no blinding, no replication by sceptics, criticism kept out.

      Four short cases follow, one per mark.

  - type: mcq
    id: mark-unfalsifiable
    title: "Mark 1"
    prompt: |
      A horoscope reads: "You will meet a challenge today, and how you respond will reveal your character." Whatever happens that day, a reader can say it fits. Which mark of pseudoscience is this, according to Popper?
    options:
      - text: 'Unfalsifiable: it forbids nothing, so no day could refute it.'
        correct: true
      - text: 'No progress: it has not changed for a century.'
        feedback: |
          That is a different mark (it may also be true of horoscopes), but this card's problem is that no outcome is excluded, not that it is old.
      - text: 'Ad hoc rescue: it was patched after a failure.'
        feedback: |
          There was no failure to patch: the statement is built so that no failure is possible. Ad hoc rescue needs a claim that first said something definite.
    explanation: |
      Popper's point is that a claim that fits every outcome says nothing about the world. Fair note: astrologers also make *specific* claims (for instance, that a chart matches a personality), and those can be tested, as the next cards show. The vague horoscope is the unfalsifiable face of the practice, the matching claim is its testable face.

  - type: mcq
    id: mark-adhoc
    title: "Mark 2"
    prompt: |
      Two rescues of a theory after a failed prediction. (i) Astronomers saw Uranus move off its predicted path in the 1840s and proposed an unseen planet; it predicted where to look, and Neptune was found in 1846. (ii) A healer's treatment fails in a trial and is said to need "the right energy, which cannot be measured". Which describes the *ad hoc* rescue?
    options:
      - text: 'Only (i): it added an unseen planet to save the theory.'
        feedback: |
          Adding an unseen thing is not the problem. Rescue (i) produced a new, risky prediction (look *there*) and was confirmed. That is a progressive patch.
      - text: 'Only (ii): the patch saves the claim and predicts nothing that could be checked.'
        correct: true
      - text: 'Both: any rescue after a failure is ad hoc.'
        feedback: |
          If so, almost every real theory would be pseudoscientific, since all science patches its theories. The test is whether the patch makes a *new, testable prediction*.
    explanation: |
      Lakatos's distinction: a rescue is acceptable when it brings **excess empirical content** (it says something new that could fail). Fair note: Le Verrier tried the same move for Mercury (an unseen planet "Vulcan") and it failed; the move was legitimate, only the world disagreed.

  - type: mcq
    id: mark-progress
    title: "Mark 3"
    prompt: |
      Compare two fields over the last two centuries. Field X has the same core claims, and has added no new predictions that were confirmed. Field Y began with a few claims and, step by step, predicted new facts (new particles, new rock layers, new drug effects) that were later found. According to Lakatos, which is *degenerating*?
    options:
      - text: 'Field Y: it keeps changing its claims.'
        feedback: |
          Changing is not degeneration. Y changes by *predicting new facts that were confirmed*, which is the mark of a progressive programme.
      - text: 'Field X: no new confirmed predictions in a long time, only defence of the old claims.'
        correct: true
      - text: 'Neither: only a single failed test can tell progress from decay.'
        feedback: |
          Lakatos insisted that single tests rarely decide; the history of a programme does. That is also why judging takes time.
    explanation: |
      A caution: "no progress" must be judged over a long stretch and with the field's own funding and tools in mind. A young or small field may be slow without being pseudoscientific.

  - type: mcq
    id: mark-peers
    title: "Mark 4"
    prompt: |
      A group tests its remedy with patients who know what they receive, no control group, and publishes only in its own journal, which accepts no sceptical reviewers. A sceptic asks to repeat the test blind and is refused. Which mark is the clearest?
    options:
      - text: 'No independent checking: the checks that could expose error are avoided.'
        correct: true
      - text: 'Unfalsifiable: it is impossible to test remedies.'
        feedback: |
          Remedies can be tested very well (that is what clinical trials are). The problem is that these people avoid the test, not that testing is impossible.
      - text: 'It is a minority view, and that alone makes it pseudoscience.'
        feedback: |
          Being a minority is not a mark. Many correct ideas started as minority views. The mark is *avoiding* checks, such as blinding and replication.
    explanation: |
      Science is a social process: errors are found because others try to break your result. A field that arranges not to be broken loses what makes its results trustworthy, even if its members are sincere.

  - type: text
    id: astrology
    title: "Astrology: testable, and tested"
    body: |
      A fair treatment begins with what astrologers claim: that a person's birth chart (positions of Sun, Moon and planets at birth) correlates with their character and life. This is a **testable claim**, so astrology is not unfalsifiable *in principle*.

      One well-known test: Shawn Carlson, in *Nature* in 1985, designed a **double-blind matching test** (neither the participants nor the experimenters who handle the data know which is which). It was designed together with astrologers nominated by the National Council for Geocosmic Research, who agreed beforehand that the test was fair. In the main test, 28 astrologers were each given a chart and had to choose the matching personality profile (from a standard questionnaire) among three; they had said they expected to be right at least half the time. They were right about **one in three**, which is chance. Carlson concluded that the result clearly refutes the astrological hypothesis as tested.

      According to astrologers who disagree, the test did not capture how astrology is really used (with the client present, in reading the whole chart). A sceptic replies that this is a new claim which should itself be tested, and that the astrologers had approved the design.

  - type: mcq
    id: astrology-q
    title: "What does this test show?"
    prompt: |
      In a fair, double-blind test, astrologers matched birth charts to personality profiles at the rate expected by chance (about one in three). Which conclusion is best supported?
    options:
      - text: 'Astrology was shown to be false, forever, in every form.'
        feedback: |
          Too strong: one test checks one form of the claim. Defenders can propose other forms, which should then be tested; that is how a claim stays fair game.
      - text: 'Astrology is unfalsifiable, so no test could show anything.'
        feedback: |
          The opposite: this claim was tested, and the result could have favoured it. That the test could fail is what makes it a test.
      - text: 'The tested claim (that these chart-to-personality matches can be done above chance) failed; to keep astrology, its defenders must say what else it predicts and accept a test of that.'
        correct: true
    explanation: |
      Notice the structure: testable claim, fair test, failure. What turns a failed claim into pseudoscience is the *response*: if the field re-defines the claim each time (ad hoc rescue) and avoids new tests, the marks accumulate. The same test is fair to a believer: it was agreed beforehand.

  - type: text
    id: homeopathy
    title: "Homeopathy: the dilution arithmetic"
    body: |
      Samuel Hahnemann (1755-1843) founded homeopathy on "like cures like" and on dilution: a substance is diluted and shaken (*succussed*) in steps, believed to *strengthen* the remedy. On the **C scale** each step is **1 part in 100**: a "30C" remedy has been diluted 30 times, each time by a factor of 100.

      In symbols, 30C is a dilution factor of $100^{30}$. And **Avogadro's number**, about $6\times10^{23}$, is the number of molecules in one *mole* (a fixed, large amount of a substance, for example 18 grams of water).

  - type: numeric
    id: homeopathy-n
    title: "Dilution factor"
    prompt: |
      A homeopathic remedy "30C" is made by diluting 30 times, each step 1 part in 100. The total dilution factor is $100^{30} = 10^{n}$. What is $n$?
    answer: 60
    hint: |
      $100 = 10^2$, so $100^{30} = (10^2)^{30}$.
    explanation: |
      $100^{30} = (10^{2})^{30} = 10^{60}$. Start with a full mole of the active substance, $6\times10^{23}$ molecules. After dilution, the expected number of original molecules is
      $$6\times10^{23}\times10^{-60} \approx 6\times10^{-37}$$
      which is far less than one. (Already at 12C, a factor $10^{24}$, a mole's molecules are used up.)

  - type: mcq
    id: homeopathy-q
    title: "What do the numbers imply?"
    prompt: |
      Starting with one mole of the active substance (about $6\times10^{23}$ molecules), a 30C remedy has an expected $6\times10^{-37}$ original molecules in the whole preparation. Homeopaths reply that the remedy works through a "memory" of the water. Which response is fair to both sides?
    options:
      - text: 'The numbers prove homeopaths are lying.'
        feedback: |
          Sincere practitioners may believe in the memory idea; the arithmetic shows only that no *chemical* dose is left. Accusing of lying is both unfair and beside the point.
      - text: 'The arithmetic is established; "water memory" is a different claim with no known mechanism in chemistry, and the fair judge of whether the remedies work is a blinded trial (reviews of trials, such as one by Australia''s NHMRC in 2015, found no reliable benefit beyond placebo).'
        correct: true
      - text: 'Dilution cannot matter, because many medicines are effective in tiny doses.'
        feedback: |
          Some are potent at tiny doses, but a dose of *zero molecules* is a different case: potency per molecule cannot make up for no molecules at all.
    explanation: |
      Layer 1 (fact): the dilution arithmetic. Layer 2 (the scientific literature is settled on no effect beyond placebo, though the public debate continues): whether any effect exists. The "memory" idea is a separate, testable claim, so it too can be tested. Fairness means treating it as a real hypothesis with a real test, and accepting the test result.

  - type: order
    id: fair-test
    title: "Steps of a fair test"
    prompt: |
      Put the steps of a fair test of a remedy in a sensible order.
    steps:
      - 'State in advance what result would count as success, and how it will be measured (pre-registration).'
      - 'Split participants randomly into a treated group and a control group.'
      - 'Blind them: neither participants nor those judging outcomes know who got what.'
      - 'Collect outcomes, then compare the groups with the pre-stated measure.'
      - 'Publish the result either way, so others can repeat it.'
    hint: |
      Decide the rule before seeing data; then allocate, then hide, then measure, then share.
    explanation: |
      Each step blocks a known error: choosing the success criterion after seeing data (finding patterns by chance), unequal groups, expectations colouring results (blinding), and hiding negative outcomes. These are exactly the "independent checking" mark in reverse.

  - type: numeric
    id: bayes-prior
    title: "Weak evidence, low prior"
    prompt: |
      A claim $H$ starts with prior probability $1\%$. A piece of supporting evidence is only 3 times more likely if $H$ is true than if it is false (likelihood ratio 3). What is the posterior probability of $H$, in percent? (Use odds: posterior odds = LR times prior odds.)
    answer: 2.9
    tolerance: 0.1
    answerText: '2.9'
    hint: |
      Prior odds $1:99$, times 3 gives $3:99$; then probability $=3/(3+99)$.
    explanation: |
      Prior odds are $1/99$. Times 3 gives $3/99$, so the probability is $3/102 \approx 2.9\%$. With a likelihood ratio of only $1.1$ (a weak anecdote), it would be about $1.1\%$; with $10$, about $9.2\%$. **Moral**: for a claim that conflicts with much well-tested knowledge, a low prior is reasonable, and weak evidence (a testimonial, a single case) barely changes it; strong, blinded tests, which have a large likelihood ratio, are what move it.

  - type: mcq
    id: two-views
    title: "Sharp line or family resemblance?"
    prompt: |
      One view: there is a sharp criterion (falsifiability) that cleanly separates science from pseudoscience. Another: there is no single criterion, only a *cluster* of marks, like the features that make games alike (a "family resemblance"). Which reasoning supports the second view?
    options:
      - text: 'Physics and sociology are the same kind of science.'
        feedback: |
          Neither view claims that. The cluster view is about the *boundary* with pseudoscience, not about equating sciences.
      - text: 'Every proposed single criterion fails on a clear case: falsifiability seems to exclude some good science (theories need auxiliary assumptions, so no single result refutes them) and to admit some bad claims (a flatly testable false claim).'
        correct: true
      - text: 'Scientists cannot agree on anything, so there are no marks.'
        feedback: |
          Scientists agree on a great deal. The cluster view says marks exist and are useful, only that none is necessary and sufficient alone.
    explanation: |
      According to Larry Laudan (1983), the demarcation problem should be dropped: separate good from bad *claims* by their evidence rather than sorting labels. According to defenders of Popper, a refined criterion can still serve. The practical outcome is shared: judge by the cluster of marks and the evidence.

  - type: mcq
    id: blurry
    title: "Blurry cases"
    prompt: |
      In 1912 Alfred Wegener proposed that continents move (continental drift). It was widely rejected for decades, as no mechanism was known, and was accepted in the 1960s with plate tectonics. What does this teach about rejection and pseudoscience?
    options:
      - text: 'A rejected idea is pseudoscience, and Wegener was wrong in 1912 to propose it.'
        feedback: |
          Wegener's idea was testable (matching rocks and fossils across oceans) and predicted things; it was rejected for lack of a mechanism, not because it avoided tests.
      - text: 'A rejected idea is not automatically pseudoscience: it may be testable and fair, and be accepted when evidence and a mechanism arrive.'
        correct: true
      - text: 'Rejected ideas are usually later accepted, so we should accept all of them.'
        feedback: |
          Almost all rejected ideas stay rejected. Wegener is a memorable exception, not the rule.
    explanation: |
      Two more hard cases, each with two views. **String theory**: critics say it has made no confirmed prediction in decades (a possible degenerating programme); defenders say it is mathematically fruitful and that testing may take longer. **Psychoanalysis**: Popper held that its explanations fit any behaviour; others argue it makes testable claims, some of which failed. How to classify them is a live debate, not a settled fact.

  - type: mcq
    id: traps
    title: "Three mistakes"
    prompt: |
      Select every statement that is a **mistake**.
    multiple: true
    options:
      - text: '"Unproven means pseudoscience."'
        correct: true
        feedback: |
          Frontier science is unproven by definition. The difference is whether the claim can be tested and how the field reacts.
      - text: '"If the mainstream holds it, it is true."'
        correct: true
        feedback: |
          Mainstream views are the best-tested we have, and have also been wrong (caloric, ether). Consensus is strong evidence, not a proof.
      - text: '"People who believe in fringe claims are foolish."'
        correct: true
        feedback: |
          Many are intelligent and sincere, often drawn by real experiences or distrust of institutions. Criticise claims, not people.
      - text: '"A claim can fail a fair test without its holders being pseudoscientists."'
        feedback: |
          This is correct, not a mistake: individual failed claims are normal in science. The marks concern how a field responds over time.
    explanation: |
      Each trap confuses a *property of a claim or a person* with the *habits of a field*. Good judgement looks at evidence and at how checks are met, and stays respectful.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Which statement is a layer 2 claim (scholarly consensus or live debate), rather than established fact or a faith or metaphysical commitment?
    options:
      - text: 'A 30C dilution has a factor of $10^{60}$.'
        feedback: |
          That is arithmetic: layer 1, established fact.
      - text: 'String theory is (or is not) a degenerating research programme.'
        correct: true
      - text: 'Anything that cannot be measured does not exist.'
        feedback: |
          This is a philosophical stance (positivist in flavour), not a result of data: layer 3, a commitment. Popper himself rejected it, as he separated science from meaning.
    explanation: |
      Keeping layers apart is the habit the lesson trains: the arithmetic and the astrologers' test are layer 1; whether string theory is progressing is layer 2; what to make of experiences science cannot test is layer 3.

  - type: text
    id: summary
    body: |
      **Back to the hook.** Astrology and homeopathy make testable claims that were tested and failed; the speculative particle is unproven and may or may not be testable. None is judged by its topic or oddness but by what it forbids, how it was tested and how its field responds.

      **Next:** the lesson *What Science Can and Cannot Say* asks which questions science can answer at all, and what lies beyond its reach.
