id: ch02-bayes-proof
title: "Guided proof: Evidence Favours the Theory That Predicted It"
kind: guided
proof: true
own: |
  - **Setting.** Two rival theories $H_1$ and $H_2$ and a piece of evidence $E$ (an observed result). $P(H)$ is the prior, $P(E\mid H)$ the likelihood (how probable $E$ is if $H$ is true) and $P(H\mid E)$ the posterior; $P(E)$ is the overall probability of the evidence. Bayes' rule says
  $$P(H\mid E)=\frac{P(E\mid H)\,P(H)}{P(E)}$$
  - **The law (likelihood-ratio form).** Dividing Bayes' rule for $H_1$ by Bayes' rule for $H_2$ cancels $P(E)$:
  {{ $$\frac{P(H_1\mid E)}{P(H_2\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_2)}\cdot\frac{P(H_1)}{P(H_2)}$$ }}
  In words: posterior odds equal the {{ likelihood ratio times the prior odds }}. Evidence favours $H_1$ over $H_2$ exactly when the likelihood ratio is above $1$, that is, when $H_1$ made $E$ more probable than $H_2$ did.
  - **Prediction counts by how much it risked.** If $H$ predicts $E$ ($P(E\mid H)=0.9$) but rivals would rarely produce it ($P(E\mid\neg H)=0.02$, where $\neg H$ means "$H$ is false"), the likelihood ratio is
  $$\frac{P(E\mid H)}{P(E\mid \neg H)}=\frac{0.9}{0.02}=45$$
  and a prior of $10\%$ rises to $83\%$. If $E$ was just as probable whether or not $H$ is true, the ratio is {{ $1$ and the evidence changes nothing }}. Bayesians read Popper's "bold conjectures" this way; Popper himself did not give theories probabilities.
  - **Objection 1: old evidence.** If $E$ is already known, $P(E)=1$ and the rule gives
  $$P(H\mid E)=\frac{P(E\mid H)\,P(H)}{1}=P(H)$$
  (as $P(E\mid H)=1$ too): no support, though Einstein's 1915 theory seemingly gained from the long-known Mercury anomaly. Two replies: ask what the prior {{ would have been had $E$ been left out of what we know (the counterfactual prior) }}; or say that what is learned is not $E$ but that $H$ entails $E$ (the explanatory-fit view).
  - **Objection 2: priors.** The law gives posterior odds only if a prior is supplied, and priors differ. Replies: the likelihood ratio measures the force of the evidence apart from the prior; and shared evidence swamps moderate priors (seven independent results, each with ratio $3$, take $1\%$ to about $96\%$), though a prior of exactly $0$ never moves.
  - **Layers.** The odds identity is {{ a theorem of probability (established) }}; whether a scientist's confidence should obey it is a live debate (layer 2); the prior given to a grand claim, such as a whole worldview, is where thoughtful people most part ways (layers 2 and 3).
cards:
  - type: mcq
    id: hook
    title: "Two results, one theory"
    prompt: |
      Theory A and its rivals are tested by two experiments. Result X is something Theory A predicted, but the rivals gave it only a 5% chance. Result Y is something Theory A predicted and every rival also gave a 95% chance. Both results come out as predicted. Before any formula, **guess**: which result gives Theory A the bigger boost over its rivals?
    options:
      - text: 'Result X: the rivals did not expect it.'
        correct: true
      - text: 'Result Y: a 95% prediction is more reliable than a 5% one.'
        feedback: |
          The 95% is a fair reason to trust the prediction, but Y was expected by *every* theory, so it cannot tell A from its rivals. What matters is the *difference* between what A and its rivals expected.
      - text: 'Both the same: each simply agrees with Theory A.'
        feedback: |
          Agreeing with A is not enough, since Y also agrees with the rivals. Evidence helps a theory against rivals only to the extent that the rivals did *not* expect it.
    explanation: |
      Result X is the stronger one: a result that rivals found unlikely and Theory A found likely separates them. This lesson turns that guess into a short argument, tests each premise, and then faces two famous objections.

  - type: text
    id: recall
    title: "Recall: Bayes' rule and odds"
    body: |
      **Recall.** $H$ is a hypothesis (a theory) and $E$ the evidence (an observed result). $P(H)$ is the **prior**: how probable $H$ is before the evidence. $P(E\mid H)$ is the **likelihood**: how probable $E$ is if $H$ is true. $P(H\mid E)$ is the **posterior**: how probable $H$ is after $E$. Bayes' rule (Thomas Bayes, 1701-1761, published 1763) is
      $$P(H\mid E)=\frac{P(E\mid H)\,P(H)}{P(E)}$$
      where $P(E)$ is the overall probability of the evidence. The **odds** of $H_1$ against $H_2$ are $P(H_1):P(H_2)$, for example $1:3$ for probabilities $25\%$ and $75\%$.

  - type: order
    id: derive
    title: "P1: from Bayes' rule to the odds form"
    prompt: |
      Two rival hypotheses $H_1$ and $H_2$ and one piece of evidence $E$. Put in order the steps that turn Bayes' rule into a statement about the posterior *odds* of $H_1$ against $H_2$.
    steps:
      - 'Write Bayes'' rule for $H_1$: $P(H_1\mid E)=P(E\mid H_1)\,P(H_1)/P(E)$.'
      - 'Write Bayes'' rule for $H_2$ in the same way, with the same $P(E)$ on the bottom.'
      - 'Divide the first equation by the second, to get the ratio of posteriors.'
      - 'Cancel $P(E)$, which appears above and below and is the same for both hypotheses.'
      - 'Group what is left: the ratio of likelihoods times the ratio of priors.'
    hint: |
      The overall $P(E)$ is hard to know. The trick is a step that removes it.
    explanation: |
      After dividing and cancelling:
      $$\frac{P(H_1\mid E)}{P(H_2\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_2)}\cdot\frac{P(H_1)}{P(H_2)}$$
      Read it as: **posterior odds = likelihood ratio × prior odds**. The middle factor is the **likelihood ratio**: how many times more probable $E$ is under $H_1$ than under $H_2$. This is premise P1 below, and it is a theorem, not an opinion.

  - type: text
    id: argument
    title: "The argument"
    body: |
      Here is the claim, as an argument with numbered premises. According to **Bayesians** (those who treat degrees of belief as probabilities), this is why a result that a theory predicted and rivals did not expect counts for the theory.

      - **P1.** For rival hypotheses $H_1$, $H_2$ and evidence $E$: posterior odds = likelihood ratio × prior odds (the identity just derived).
      - **P2.** A rational person's degrees of belief obey the rules of probability, so learning $E$ moves belief from the prior to the posterior by Bayes' rule.
      - **P3.** The theories fix the likelihoods: $P(E\mid H_1)>P(E\mid H_2)$.
      - **C.** Learning $E$ raises the odds of $H_1$ against $H_2$, by exactly the factor $P(E\mid H_1)/P(E\mid H_2)$.

  - type: mcq
    id: critic
    title: "Which premise would a critic reject?"
    prompt: |
      In the argument above, P1 is the odds identity, P2 says rational beliefs obey the rules of probability and update by Bayes' rule, and P3 says the theories give $E$ a higher likelihood under $H_1$ than under $H_2$. Which premise is a philosopher of science most likely to reject *as a matter of principle* (for every case, not just this one)?
    options:
      - text: 'P2: for example because real scientists do not hold sharp numerical probabilities for theories, or do not change their minds by this rule.'
        correct: true
      - text: 'P1: the identity is false for some theories.'
        feedback: |
          P1 follows from the definition of conditional probability by the algebra we just did. Nobody disputes it, as long as the probabilities are defined.
      - text: 'P3: a theory can never give a likelihood to a result.'
        feedback: |
          Sometimes it does fail in a particular case (a vague theory gives no clear likelihood, or rivals dispute what it predicts). But that is a case-by-case dispute, not a principle against the whole argument; where a theory predicts a number, P3 can be checked.
    explanation: |
      The mathematics (P1) is secure; the philosophy is in P2. **According to Bayesians**, degrees of belief should obey probability, since otherwise a bookie could make you lose whatever happens (the "Dutch book" argument). **According to critics** (Popper, many frequentists, and followers of Kuhn), theories are not the sort of thing that has a probability, or real science weighs values and frameworks, not numbers. Keep P2 in mind: the validity of the argument will not settle it.

  - type: widget
    id: mixer
    widget: belief-mixer
    config:
      causes:
        - { name: "Theory 1", prior: 0.5, evidence: 0.9 }
        - { name: "Theory 2", prior: 0.5, evidence: 0.9 }
      sharp: true
      toggle: false
      labels:
        prior: "Prior: how probable each theory seemed beforehand"
        evidence: "Likelihood: how probable the result is if that theory is true"
        belief: "Belief after seeing the result"
        reset: "Reset"
      presets:
        - { label: "Both expected it", prior: [0.5, 0.5], evidence: [0.9, 0.9] }
        - { label: "Only Theory 1 predicted it", prior: [0.5, 0.5], evidence: [0.9, 0.1] }
        - { label: "Theory 1 a little better", prior: [0.5, 0.5], evidence: [0.9, 0.6] }
        - { label: "Theory 2 predicted it better", prior: [0.5, 0.5], evidence: [0.3, 0.7] }
        - { label: "Unequal priors", prior: [0.3, 0.7], evidence: [0.8, 0.2] }
    body: |
      Two rival theories. Top sliders: how probable each seemed beforehand (**prior**). Middle sliders: how probable the observed result is if that theory is true (**likelihood**). The bars show each theory's share of belief after the result: prior times likelihood, rescaled to add up to $100\%$, which is the odds law in disguise.

      Try it: (1) press the presets in turn; (2) with equal priors, make the two likelihoods equal and see what the bars do; (3) drag one likelihood up and down.

  - type: numeric
    id: mixer-number
    title: "Apply the law to the toy"
    prompt: |
      Two theories, $H_1$ and $H_2$, are the only candidates. Beforehand $P(H_1)=0.3$ and $P(H_2)=0.7$. A result $E$ has likelihood $P(E\mid H_1)=0.8$ and $P(E\mid H_2)=0.2$. After seeing $E$, what is $P(H_1\mid E)$ as a **percentage**? (Give a number such as 12.5.)
    answer: 63.16
    tolerance: 0.2
    answerText: '12/19, about 63.2%'
    wrong:
      - { value: 80, feedback: 'That is the likelihood $P(E\mid H_1)$, not the posterior. The prior $0.3$ against $0.7$ must be brought in.' }
      - { value: 30, feedback: 'That is the prior: it ignores the evidence. The ratio $0.8:0.2=4:1$ must multiply the prior odds.' }
    hint: |
      Prior odds are $0.3:0.7=3:7$. Multiply by the likelihood ratio, then turn odds into a probability.
    explanation: |
      Prior odds $3:7$; likelihood ratio $0.8/0.2=4$; posterior odds $12:7$. Probability:
      $$P(H_1\mid E)=\frac{12}{12+7}=\frac{12}{19}\approx 63.2\%$$
      The evidence favoured $H_1$ four-fold, but its low prior kept it from reaching $80\%$.

  - type: widget
    id: grid
    widget: frequency-grid
    config:
      N: 1000
      prior: 0.3
      sens: 0.6
      fpr: 0.6
      sliders:
        sens: { fixed: true }
        fpr: { fixed: true }
      show: { posterior: true }
      reset: false
      labels:
        prior: "Theory is true"
        sens: "Result occurs if the theory is true"
        fpr: "Result occurs if the theory is false"
        tp: "True and result"
        fn: "True, no result"
        fp: "False and result"
        tn: "False, no result"
        posterior: "True, given the result"
    body: |
      Each dot is one imaginary world. The result occurs in $60\%$ of worlds where the theory is true and also in $60\%$ of worlds where it is false (those two sliders are locked). Drag the first slider (the share of worlds where the theory is true). Look at the worlds where the result occurs (green and red) and compare the share that are green with the share you started with.
    review: false

  - type: mcq
    id: grid-lesson
    title: "A result everyone expected"
    prompt: |
      A result $E$ has the same probability whether a theory $H$ is true or false: $P(E\mid H)=P(E\mid\neg H)$ (here $\neg H$ means "$H$ is false"). Prior $P(H)=30\%$. What is $P(H\mid E)$?
    options:
      - text: '$30\%$: the likelihood ratio is $1$, so the odds do not change.'
        correct: true
      - text: 'More than $30\%$: the result is compatible with $H$, so it must help $H$ a little.'
        feedback: |
          Compatible is not the same as supportive. Because the result was equally likely if $H$ is false, seeing it cannot tell the two cases apart.
      - text: 'Less than $30\%$: $E$ is not specific to $H$, so it counts against it.'
        feedback: |
          A result that is no more probable under the rival does not tell *against* $H$ either. Only a likelihood ratio below $1$ would.
    explanation: |
      Likelihood ratio $=1$ gives posterior odds equal to the prior odds. In the grid, the green share of the results stayed equal to the share of true worlds. This is the key to the lesson: **evidence counts by how much it separates the theory from its rivals**, not by how well it fits the theory alone.

  - type: numeric
    id: surprising
    title: "A risky prediction"
    prompt: |
      A theory $H$ has prior $P(H)=10\%$. It predicts a result $E$: $P(E\mid H)=0.9$. If $H$ is false, such a result would be rare: $P(E\mid\neg H)=0.02$ (here $\neg H$ means "$H$ is false"). The result is observed. What is $P(H\mid E)$ as a **percentage**?
    answer: 83.33
    tolerance: 0.2
    answerText: '5/6, about 83.3%'
    wrong:
      - { value: 90, feedback: 'That is the likelihood $P(E\mid H)$. It ignores the prior of $10\%$ and the chance the rivals produce $E$ anyway.' }
      - { value: 45, feedback: '$45$ is the likelihood ratio $0.9/0.02$, which multiplies the *odds*, not the probability.' }
    hint: |
      Likelihood ratio of $H$ against "not $H$": $0.9/0.02$. Prior odds: $10:90$. Multiply, then convert.
    explanation: |
      Prior odds $1:9$; likelihood ratio $0.9/0.02=45$; posterior odds $45:9=5:1$. So
      $$P(H\mid E)=\frac{5}{5+1}=\frac{5}{6}\approx 83.3\%$$
      A prediction that rivals would rarely produce lifts a modest prior a long way.

  - type: mcq
    id: risky-safe
    title: "Bold against safe"
    prompt: |
      The same theory $H$ (prior $10\%$, $P(E'\mid H)=0.9$) is now tested by a result $E'$ that would have been just as probable if $H$ were false: $P(E'\mid\neg H)=0.9$. The result is observed as predicted. What happens to belief in $H$, and what does this say about "bold" predictions?
    options:
      - text: 'It stays at $10\%$: a safe prediction, expected anyway, costs the theory nothing and earns it nothing. Only risky predictions can confirm.'
        correct: true
      - text: 'It rises to $90\%$: the theory predicted the result correctly.'
        feedback: |
          Correct prediction alone does not do it. The result was equally expected if $H$ is false, so the likelihood ratio is $0.9/0.9=1$.
      - text: 'It falls, because the result is not specific to $H$.'
        feedback: |
          It does not fall: the ratio is $1$, so nothing changes. A fall needs a ratio below $1$.
    explanation: |
      Karl Popper (1902-1994) urged scientists to make **bold conjectures**: claims that forbid much and could easily fail. Bayesians read his point through the likelihood ratio: a bold prediction has a small $P(E\mid\neg H)$, so success gives a large ratio. **Two views:** Bayesians count this as confirmation raising probability; Popper himself rejected probabilities for theories and spoke only of *corroboration* (a theory surviving severe tests). They agree on the practical advice, and differ on what the survival means.

  - type: text
    id: old-evidence
    title: "Objection 1: old evidence"
    body: |
      A famous objection (the **problem of old evidence**, raised in this form by the philosopher Clark Glymour, in 1980). Astronomers knew from Le Verrier's work (1859) that Mercury's orbit turns more than Newtonian calculation allows; the excess was later refined to about $43$ arcseconds per century. In 1915 Einstein's general relativity (a theory of gravity) was found to give exactly that figure. Many scientists felt this was strong support.

      But take Bayes' rule literally. The result $E$ was already known, so $P(E)=1$, and since $E$ is certain, $P(E\mid H)=1$ too. Then
      $$P(H\mid E)=\frac{1\cdot P(H)}{1}=P(H)$$
      The old evidence gives no update at all. **The law seems to deny that old evidence supports a theory**, against what scientists say.

  - type: mcq
    id: old-replies
    title: "Two replies"
    prompt: |
      Bayesians answer the old-evidence objection in two main ways. Which pair describes them correctly?
    options:
      - text: '(a) **Counterfactual prior:** ask how probable $E$ would have been, and what the prior would have been, had we *not* yet known $E$. (b) **Explanatory fit:** what is learned in 1915 is not $E$ but that the theory *entails* $E$, a new logical fact.'
        correct: true
      - text: '(a) Deny that $P(E)=1$ for any real evidence. (b) Say old evidence should simply be ignored by scientists.'
        feedback: |
          Neither is the standard reply. Known evidence can really have probability $1$ for a person, and ignoring it would reject the scientists' judgment instead of explaining it.
      - text: '(a) Replace Bayes'' rule by the rule that a theory is confirmed whenever it fits the data. (b) Use frequencies, not probabilities.'
        feedback: |
          Dropping the rule would abandon the framework rather than defend it. And "fits the data" is exactly what the likelihood ratio sharpens: fitting evidence that all rivals also fit gives no support.
    explanation: |
      **(a)** removes $E$ from background knowledge and asks how well $H$ would have predicted it: Mercury's $43$ arcseconds were unexplained by the rivals, so the likelihood ratio is large. A critic replies that the "counterfactual" is vague: we cannot truly say what we would have believed. **(b)** shifts the update to the discovery that $H\Rightarrow E$. A critic replies that standard probability assumes we already know all logical consequences, so this needs an extended Bayesianism. Both replies are live proposals (layer 2); neither is universally accepted.

  - type: mcq
    id: priors-objection
    title: "Objection 2: whose prior?"
    multiple: true
    prompt: |
      A critic says: "The law gives *posterior* odds only if you supply prior odds, and priors are personal. So the conclusion depends on an arbitrary starting point." Which of the following are replies a Bayesian can offer? (Select all that apply.)
    options:
      - text: 'The likelihood ratio measures the force of the evidence separately from the prior, so people with different priors can still agree on how strongly $E$ favours $H_1$.'
        correct: true
      - text: 'With enough shared evidence, moderate priors are swamped: the posteriors of people who start apart come close together.'
        correct: true
      - text: 'Priors can be chosen after the data so that the preferred theory ends up probable.'
        feedback: |
          That would defeat the purpose. A prior fixed *after* seeing the answer is just the answer restated; Bayesians require the prior to be set before the evidence (or by the counterfactual reasoning of the previous objection).
    explanation: |
      The first reply makes the law a measure of evidential force; the second says disagreement fades with data. Critics respond that people may *disagree about the likelihoods too* (what the theory predicts), and that a prior of exactly $0$ or $1$ never moves. **According to subjective Bayesians**, any coherent prior is allowed; **according to objective Bayesians**, rules such as indifference restrict it. That is a live debate.

  - type: numeric
    id: swamping
    title: "How much evidence is enough?"
    prompt: |
      A theory starts at $P(H)=1\%$. Each independent result has likelihood ratio $3$ in its favour (three times as probable if $H$ is true as if false). After how many such results does $P(H\mid\text{all})$ first exceed $90\%$? (Give a whole number.)
    answer: 7
    tolerance: 0.01
    wrong:
      - { value: 6, feedback: 'After six results the odds are $729:99\approx 7.4$, a probability of about $88\%$, just below $90\%$.' }
      - { value: 3, feedback: 'Three results multiply the odds by $27$, from $1:99$ to $27:99$, only about $21\%$. Each result multiplies the *odds* by $3$, not the probability.' }
    hint: |
      Prior odds $1:99$. A probability above $90\%$ means odds above $9:1$. Each result multiplies the odds by $3$.
    explanation: |
      After $n$ results the odds are $3^n/99$. Need $3^n/99>9$, so $3^n>891$:
      $$3^6=729<891<2187=3^7$$
      After 7 results: odds $2187/99\approx22.1$, a probability of about $95.7\%$. A skeptic starting at $1\%$ ends up convinced if the results keep coming and are independent. Caveats: a prior of exactly $0$ would never rise (any product with $0$ is $0$), and results are rarely fully independent.

  - type: mcq
    id: validity
    title: "Valid is not true"
    prompt: |
      Suppose the argument (P1, P2, P3, so C) is **valid**: if all premises are true, C must be true. A critic believes P2 is false. What follows?
    options:
      - text: 'Nothing about C follows from validity alone: C is guaranteed only if every premise is true, and C might still be true for other reasons.'
        correct: true
      - text: 'C is false, because a premise is false.'
        feedback: |
          A false premise does not make the conclusion false: from a false premise a valid argument leaves C undecided, and C may be true for other reasons.
      - text: 'The argument was not valid after all.'
        feedback: |
          Validity concerns the *form*: whether the conclusion follows if the premises hold. It is separate from whether the premises are true. Critics of P2 accept validity and dispute truth.
    explanation: |
      The course keeps these apart. The argument is valid; P1 is a theorem; P3 is checked case by case. The dispute is over P2. A critic of P2 can still accept the weaker practical point that a result expected by rivals does not support a theory over them.

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Which assignment of layers to claims is right?
    options:
      - text: 'The odds identity: established (a theorem). Whether the confidence of real scientists follows it: live debate. The prior for a whole worldview: live debate and commitment.'
        correct: true
      - text: 'The odds identity: live debate. Whether real scientists follow it: established. The prior for a worldview: established.'
        feedback: |
          Reversed. The identity is proved by algebra; how people actually reason, and how to set priors on grand claims, are exactly what thoughtful people dispute.
      - text: 'All three are established: probability is mathematics.'
        feedback: |
          The mathematics is established only for the identity. That minds or science *should* follow it (P2), and what number to give a worldview, are philosophical, not mathematical, claims.
    explanation: |
      Keeping layers apart is the habit of the course: the mathematics is secure, its use as a model of science and belief is debated, and the prior on a grand claim leans on commitments that the evidence alone cannot supply.

  - type: text
    id: summary
    body: |
      **Next:** "When Data Cannot Decide". If the same evidence fits many theories equally well (all the likelihoods are the same), the law cannot separate them. Duhem and Quine ask what else, such as simplicity or fertility, can then pick a theory.
