id: ch02-map
title: "Content Map: How Science Knows"
kind: map
name: Level 2, How Science Knows (induction, falsification, paradigms, Bayes, underdetermination, realism, pseudoscience, limits)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it, and a label on the arrow says how.

  You will rebuild the map of Level 2 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the traps (a valid argument swapped for an invalid one, two probabilities confused, a view given to the wrong thinker), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: induction
    title: Hume's problem
    row: 1
    col: 1
    span: 3
    body: |
      According to **Hume**, reasoning from past to future needs the premise "the future will resemble the past", and the only evidence for it is that it worked before, which is **circular**. Four replies, none a knock-out: **Popper** (science does not use induction), **Reichenbach** (a vindication: nothing is lost by using it), **Bayesian** priors, and **inference to the best explanation**.
    decoys:
      - body: |
          According to **Hume**, reasoning from past to future needs the premise "the future will resemble the past", and this premise is a **truth of logic**, since denying it is a contradiction. The problem is that we have too few observations. Four replies: **Popper**, **Reichenbach**, **Bayesian** priors, and **inference to the best explanation**.
        feedback: |
          Denying the uniformity of nature is not a contradiction; that is exactly why it needs support. And the problem does not vanish with more observations: Russell's chicken had thousands.
      - body: |
          According to **Hume**, reasoning from past to future needs the premise "the future will resemble the past", and the only evidence for it is that it worked before, which is **circular**. Each of the four replies (**Popper**, **Reichenbach**, **Bayesian** priors, **best explanation**) **solves** it completely, so the problem is closed.
        feedback: |
          None is a knock-out. Popper's reply still needs trust in tested theories, the Bayesian prior already assumes a regular world, and "best explanation" is judged using the regularity in question.
    explanation: |
      This is the root of the level: every later idea is a way to live with, or around, the gap between the cases seen and the cases unseen.

  - id: falsification
    title: Falsification
    row: 2
    col: 1
    body: |
      According to **Popper**, a claim is scientific when some possible observation would contradict it. The valid step is **modus tollens**: if $T$ predicts $O$ and $O$ fails, then $T$ is false. One black swan refutes "all swans are white"; a thousand white swans do not prove it.
    decoys:
      - body: |
          According to **Popper**, a claim is scientific when it has been confirmed many times. The valid step is **affirming the consequent**: if $T$ predicts $O$ and $O$ happens, then $T$ is true. A thousand white swans prove "all swans are white".
        feedback: |
          Affirming the consequent is invalid: other theories could predict $O$ too. And confirmations never prove a universal claim; that asymmetry is Popper's whole point.
      - body: |
          According to **Popper**, a claim is scientific when it cannot be contradicted by any observation, which makes it safe. The valid step is **modus tollens**: if $T$ predicts $O$ and $O$ fails, then $T$ is false.
        feedback: |
          Reversed. A claim that forbids nothing ("it will rain or it will not") is the unscientific one. Safety from refutation is a weakness, not a strength.
    explanation: |
      Falsification answers Hume by dropping the hope of proving theories true. It also hands us a test for pseudoscience.

  - id: paradigms
    title: Kuhn's paradigms
    row: 2
    col: 2
    body: |
      According to **Kuhn**, scientists mostly do **normal science**, puzzle-solving inside a shared **paradigm**. Anomalies pile up into a **crisis**, a **revolution** replaces the paradigm, and rival paradigms can be **incommensurable**. Shared **values** (accuracy, scope, simplicity) still guide the choice.
    decoys:
      - body: |
          According to **Popper**, scientists mostly do **normal science**, puzzle-solving inside a shared **paradigm**. Anomalies pile up into a **crisis**, a **revolution** replaces the paradigm, and rival paradigms can be **incommensurable**. Shared **values** (accuracy, scope, simplicity) still guide the choice.
        feedback: |
          Wrong thinker. Paradigms, normal science and revolutions are Kuhn's. Popper wanted scientists to attack their theories at once, which is the contrast Kuhn pointed to.
      - body: |
          According to **Kuhn**, scientists mostly do **normal science**, puzzle-solving inside a shared **paradigm**. Anomalies pile up into a **crisis**, a **revolution** replaces the paradigm, and since paradigms are **incommensurable** the choice between them is **mere taste**, with no shared values.
        feedback: |
          Kuhn explicitly rejected this reading. Scientists share values that guide choice, though they may weigh them differently; incommensurable does not mean arbitrary.
    explanation: |
      Kuhn describes how science behaves; Popper says how it should. Comparing the two is one of the level's live debates.

  - id: bayes
    title: Bayes' rule and odds
    row: 2
    col: 3
    body: |
      Evidence $E$ updates a hypothesis $H$ by Bayes' rule. In **odds form**:
      $$\text{posterior odds} = \text{LR}\times\text{prior odds}$$
      where the **likelihood ratio** $\text{LR}=P(E\mid H_1)/P(E\mid H_2)$ says how much more expected $E$ is under $H_1$. At $\text{LR}=1$ the evidence changes nothing.
    decoys:
      - body: |
          Evidence $E$ updates a hypothesis $H$ by Bayes' rule. In **odds form**:
          $$\text{posterior odds} = \text{LR}\times\text{prior odds}$$
          where $\text{LR}=P(H_1\mid E)/P(H_2\mid E)$ says how probable $H_1$ is once $E$ is known. At $\text{LR}=1$ the evidence changes nothing.
        feedback: |
          That ratio is the posterior odds itself. The likelihood ratio compares how probable the *evidence* is under each hypothesis, not how probable the hypotheses are.
      - body: |
          Evidence $E$ updates a hypothesis $H$ by Bayes' rule. In **odds form**:
          $$\text{posterior odds} = \text{LR}\times\text{prior odds}$$
          where $\text{LR}=P(E\mid H_1)/P(E\mid H_2)$. A test with a high $P(E\mid H)$ therefore makes $P(H\mid E)$ high, whatever the prior.
        feedback: |
          This is the prosecutor's fallacy. $P(E\mid H)$ and $P(H\mid E)$ differ, and a low prior can keep the posterior low even when the test is accurate.
    explanation: |
      Bayes is the reply to Hume that works with degrees of belief, and it says how bold predictions earn support: a large LR.

  - id: pseudo
    title: Marks of pseudoscience
    row: 3
    col: 1
    body: |
      Pseudoscience is a **cluster of marks**, not one test: claims no observation could refute, ***ad hoc*** rescues that predict nothing new, no progress, no independent checking. A rejected idea (early continental drift) is not automatically pseudoscience; what matters is how it answers tests.
    decoys:
      - body: |
          Pseudoscience is a **single test**: any claim that is not yet accepted by the community. Early continental drift, rejected at first, was therefore pseudoscience until plate tectonics arrived in the 1960s.
        feedback: |
          Being rejected or unproven is not the mark. Wegener's idea was testable and later confirmed. What matters is how a field responds to tests and failure.
      - body: |
          Pseudoscience is a **cluster of marks**: claims no observation could refute, ***ad hoc*** rescues, no progress, no independent checking. Any claim that has been **tested and failed** (astrology in the 1985 matching test) therefore counts as untestable.
        feedback: |
          Astrology made testable claims and failed the test; that is science working. It becomes pseudoscience when its defenders rescue it with ad hoc patches or refuse the test.
    explanation: |
      This applies falsification and Kuhn's puzzle-solving to real cases, with Lakatos's progressive versus degenerating programmes as the sharpest tool.

  - id: duhem
    title: Duhem's auxiliary assumptions
    row: 3
    col: 2
    body: |
      A theory meets observation only with **auxiliary assumptions** $A$ (about instruments, data, other bodies). A failed prediction refutes only the bundle:
      $$\begin{gathered}(T\wedge A)\Rightarrow O,\ \text{not } O\\ \therefore\ \text{not}(T\wedge A)\end{gathered}$$
      so at least one of $T$ or $A$ is false, not which one.
    decoys:
      - body: |
          A theory meets observation only with **auxiliary assumptions** $A$ (about instruments, data, other bodies). A failed prediction refutes the theory itself:
          $$\begin{gathered}(T\wedge A)\Rightarrow O,\ \text{not } O\\ \therefore\ \text{not } T\end{gathered}$$
          so $A$ is cleared and the blame falls on $T$.
        feedback: |
          The valid conclusion is only $\text{not}(T\wedge A)$. Uranus's misbehaviour blamed an unseen planet (an auxiliary assumption), and Neptune was found in 1846.
      - body: |
          A theory meets observation only with **auxiliary assumptions** $A$ (about instruments, data, other bodies), so a failed prediction shows nothing at all, and a scientist may keep $T$ whatever happens.
        feedback: |
          Too strong. The failure does show that $T$ or $A$ is false, and the blame can be tested (look for the planet). Keeping $T$ whatever happens is the ad hoc move.
    explanation: |
      Duhem limits Popper: refutation is never as clean as modus tollens on a single theory.

  - id: underdet
    title: Rival fits
    row: 3
    col: 3
    body: |
      Several theories can fit the same data. When they predict the data equally well the **likelihood ratio is 1**, so the odds stay at their priors and the tie must be broken by something else (simplicity, scope, further data). *Weak*: more data may separate them. *Strong*: no possible data ever does.
    decoys:
      - body: |
          Several theories can fit the same data. A curve with **zero error** on the data used to build it is therefore the best predictor, since its typical error (RMS) on new points must also be zero.
        feedback: |
          Overfitting. A wiggly curve can match old points exactly and miss held-out points badly; a simpler curve often predicts new points better.
      - body: |
          Several theories can fit the same data. When they predict the data equally well the **likelihood ratio is 1**, so the odds stay at their priors, and *strong* underdetermination just means that **we have not collected enough data yet**.
        feedback: |
          That describes the weak kind. Strong underdetermination is the claim that even all possible observations would not separate the theories.
    explanation: |
      Duhem's point (any failure can be blamed on an auxiliary) and the Bayes link (a ratio of 1 changes nothing) both lead here.

  - id: limits
    title: Limits of science
    row: 4
    col: 1
    body: |
      Questions are *empirical*, *normative* or *metaphysical*. **Methodological naturalism** (a rule of method: explain with natural causes) is not **metaphysical naturalism** (nature is all there is). Hume's gap: $\text{facts only}\not\Rightarrow\text{an ought}$.
    decoys:
      - body: |
          Questions are *empirical*, *normative* or *metaphysical*. **Methodological naturalism** (a rule of method) **proves** **metaphysical naturalism** (nature is all there is), since science finds only natural causes. Hume's gap: $\text{facts only}\not\Rightarrow\text{an ought}$.
        feedback: |
          A method that looks only for natural causes cannot find supernatural ones, so its results do not show there are none. The second is a worldview, not a finding.
      - body: |
          Questions are *empirical*, *normative* or *metaphysical*. **Methodological naturalism** (a rule of method) is not **metaphysical naturalism**. Hume's gap: $\text{facts only}\Rightarrow\text{an ought}$, so science alone can settle ethics.
        feedback: |
          Hume's point is the opposite: a value premise is needed. Scientific facts inform ethics but cannot by themselves supply what we ought to do.
    explanation: |
      The pseudoscience box says what science is; this one says what it cannot settle: meaning, values and the deepest nature of existence.

  - id: realism
    title: Realism and its rivals
    row: 4
    col: 3
    body: |
      **Realists** hold that successful theories are approximately true and their unobservables exist (Putnam's no-miracles argument). **Instrumentalists** treat theories as tools for prediction. **Van Fraassen's constructive empiricism**: accept a theory by believing only that it is empirically adequate.
    decoys:
      - body: |
          **Realists** hold that successful theories are approximately true (Putnam's no-miracles argument). **Instrumentalists** hold that science is useless. **Van Fraassen's constructive empiricism**: believe only that a theory is empirically adequate.
        feedback: |
          Instrumentalists do not call science useless; they prize its predictive success and doubt that its unobservables must be real.
      - body: |
          **Realists** rest on Laudan's *pessimistic meta-induction* (past successful theories were later dropped, so ours are probably true). **Instrumentalists** treat theories as tools. **Van Fraassen**: believe only empirical adequacy.
        feedback: |
          Laudan's argument is the realist's problem, not support: past successful theories were dropped, so ours are probably false too. Putnam's no-miracles argument supports realism.
    explanation: |
      Whether simplicity signals truth (realist) or only usefulness (pragmatic) is exactly what underdetermination leaves open.

  - id: layers
    title: Three layers
    row: 4
    col: 2
    body: |
      Every claim sits in a layer: **established fact** (the odds identity, the astrology test), **live debate** (the weight of simplicity, where to draw the science line), or **commitment** (realism, whether nature is all there is). Never pass one layer off as another.
    decoys:
      - body: |
          Every claim sits in a layer: **established fact**, **live debate**, or **commitment**. A claim in a lower layer is *less true*, so commitments can be ignored when we reason.
        feedback: |
          The layers say what kind of support a claim has, not how true it is. Commitments are held for reasons, and everyone has some; the honest move is to label them.
      - body: |
          Every claim sits in a layer: **established fact**, **live debate**, or **commitment**. Any claim that science has **tested** becomes a fact, and a claim science cannot test is therefore false.
        feedback: |
          Not testable does not mean false. Some questions (meaning, values, why there is something) lie outside the method, which is silent on them, not against.
    explanation: |
      The closing habit of the whole course: say which layer a claim is in, and where thoughtful people part ways.

