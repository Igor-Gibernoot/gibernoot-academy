outroTitle: Level 2 in one picture
outro: |
  **Hume's problem** (no proof from past to future) gets four replies. **Popper** offers falsification, which tests claims and marks pseudoscience but is limited by **Duhem's auxiliaries**; **Kuhn** describes how science really moves; **Bayes** weighs evidence by the likelihood ratio, and a ratio of 1 leaves **underdetermination**. What breaks ties divides **realists**, **instrumentalists** and **constructive empiricists**. Science has **limits**, and the **three layers** keep fact, debate and commitment apart. Next: the Level Review, then the Level Challenge.
