id: ch02-paradigms
title: "Kuhn: When Science Changes Its Mind"
kind: concept
own: |
  - **The puzzle.** According to Popper (1902-1994), one failed prediction should sink a theory. Yet scientists often keep a theory after a failed prediction: for Uranus's orbit (1840s) they blamed an unseen planet, and Newtonian gravity was kept. The historian **Thomas Kuhn** (1922-1996), in *The Structure of Scientific Revolutions* (1962), asked how science is actually practised.
  - **Paradigm and normal science.** According to Kuhn, a **paradigm** is {{ the shared package of examples, theories, methods and standards that a scientific community works within }}. Most of the time scientists do **normal science**: {{ puzzle-solving inside the paradigm, which is not itself on trial }}. A puzzle that fails is usually blamed on the scientist or the instrument, not on the paradigm.
  - **The cycle.** Anomalies (results the paradigm cannot explain) pile up; most are shelved. Some become a **crisis**; a **revolution** then replaces the paradigm by a rival, and a new normal science begins:
  {{ $$\begin{gathered}\text{normal science} \to \text{anomalies} \to \text{crisis} \\ \to \text{revolution} \to \text{new normal science}\end{gathered}$$ }}
  Examples: Ptolemy's Earth-centred astronomy to Copernicus (*De revolutionibus*, 1543); Newton (*Principia*, 1687) to Einstein (general relativity, 1915).
  - **Incommensurability: two views.** According to Kuhn, rival paradigms can be **incommensurable**: they differ in {{ the problems they count as important, the standards of a good answer, and even the meaning of key terms }}, so there is no neutral ruler for a point-by-point comparison (compare the **gestalt switch**, as with the duck-rabbit drawing: the same lines, seen as a different thing). According to critics (Popper, Lakatos among them), this is overdone: rival theories still make predictions that can be compared.
  - **Not mere relativism.** According to Kuhn's reply, scientists share **values** that guide choice between paradigms: {{ accuracy, scope, simplicity, consistency and fruitfulness }}. Different scientists weigh them differently, so choice is not mechanical, yet it is not arbitrary.
  - **Where thoughtful people part ways.** Whether science is **cumulative** (each theory improves on the last, the common view) or moves by **revolutions** (Kuhn); whether theory change gets us nearer the truth or only to a better tool (realists vs instrumentalists, a live debate, layer 2); and whether choosing by shared values counts as rational (Kuhn: yes; some critics: not enough).
cards:
  - type: mcq
    id: hook
    title: "A prediction fails"
    prompt: |
      Newton's theory of gravity predicts the orbit of Mercury. For decades in the 1800s the measured orbit differed from the prediction by a small amount, and astronomers still used Newton's theory for everything else. Before any theory of science, **guess**: why did they not simply drop it?
    options:
      - text: 'Because the theory had worked superbly elsewhere, and a mismatch in one case could come from something else (an unseen planet, bad data) or a gap still to be understood.'
        correct: true
      - text: 'Because scientists are stubborn and ignore evidence they dislike.'
        feedback: |
          Sometimes true of individuals, but here the astronomers took the mismatch seriously and worked on it for decades. They judged that one anomaly did not outweigh a huge record of success. That is a judgement, not mere stubbornness.
      - text: 'Because the mismatch was not really a failed prediction, only a rounding error.'
        feedback: |
          The difference was real and measured (about 43 arcseconds per century, a tiny angle but well above the errors). It was a genuine anomaly.
    explanation: |
      Dropping a theory the moment one prediction fails is not how scientists behave, and not only out of stubbornness. Duhem's point, from the lesson Popper and the Black Swan, explains part of this: a prediction rests on the theory plus auxiliary assumptions. The historian **Thomas Kuhn** went further and asked what a scientific community is doing when it keeps a theory through anomalies, and when, rarely, it throws the theory out.

  - type: text
    id: kuhn
    title: "Thomas Kuhn"
    image:
      src: img/kuhn.webp
      alt: Photograph of Thomas Kuhn drawing on a blackboard, 1977
      caption: Thomas Kuhn (1922-1996) at a blackboard in 1977, fifteen years after *The Structure of Scientific Revolutions* (1962).
      credit: Bob Bielk, Public domain (US), via Wikimedia Commons
      link: https://commons.wikimedia.org/wiki/File:Thomas_Kuhn_(1977).jpg
    body: |
      **Thomas Kuhn** (1922-1996) trained as a physicist and became a historian and philosopher of science. In ***The Structure of Scientific Revolutions*** (1962) he argued, in a paraphrase, that the textbook picture of science as a steady pile of facts is wrong; the history shows long calm periods broken by sudden upheavals.

      His key word is **paradigm** (from Greek *paradeigma*, "pattern, example"). In plain words, a paradigm is the whole package a scientific community shares: its landmark examples of solved problems, its main theories, its methods and instruments, and its sense of what a good answer looks like. Newtonian mechanics was one; so was the Earth-centred astronomy of Ptolemy.

      Remember the three layers. That scientists work inside shared frameworks is **history** (layer 1). Whether this means science is not simply cumulative is **a live debate** (layer 2), and this lesson gives both sides.

  - type: mcq
    id: normal
    title: "What most scientists do"
    prompt: |
      According to Kuhn, **normal science** is most of what scientists do. A chemist, working inside the accepted theory of atoms, spends years measuring how a new compound reacts and tries to make the numbers fit the theory. Which description fits Kuhn's "normal science"?
    options:
      - text: 'Puzzle-solving: working out details of problems that the paradigm says have an answer, with the paradigm itself taken for granted.'
        correct: true
      - text: 'Constant testing of the basic theory, hoping to refute it as soon as possible.'
        feedback: |
          That describes Popper's ideal. According to Kuhn, a working community does not spend its days trying to overthrow its own framework; if it did, it would make little headway on the details.
      - text: 'Guessing wildly, with no shared assumptions.'
        feedback: |
          The opposite. Normal science is disciplined by shared assumptions about what counts as a problem, a method and a solution.
    explanation: |
      Kuhn compared it to solving a crossword or a jigsaw: you assume the puzzle has a solution and that the rules are fixed. When a puzzle fails, the blame goes to the solver or the instrument, not to the rules. Two views: Kuhn says this is why science is productive; Popper's followers answer that science should be more self-critical than this. Kuhn's reply is that without the shared framework, there would be no precise puzzle to fail at all.

  - type: mcq
    id: anomaly
    title: "Anomalies get shelved"
    prompt: |
      In the 1840s the orbit of Uranus did not match Newtonian predictions. Astronomers (Le Verrier in France, Adams in England) guessed an unseen planet and calculated where it should be; Neptune was found there in 1846. According to Kuhn, why is it normal for most **anomalies** (results the paradigm cannot explain) to be shelved or explained away at first?
    options:
      - text: 'Because the paradigm has a large record of success, so a puzzle failing is usually put down to something fixable, as with Uranus; most anomalies are in fact resolved inside the paradigm.'
        correct: true
      - text: 'Because anomalies are never real evidence.'
        feedback: |
          Anomalies are real. The point is that the community does not treat any single one as decisive. Neptune was found *because* astronomers took the Uranus anomaly seriously.
      - text: 'Because scientists have not noticed them.'
        feedback: |
          They usually have. Kuhn's history shows anomalies were often known for a long time (Mercury's orbit for decades) before they mattered.
    explanation: |
      Kuhn adds a twist to Duhem: an anomaly is a puzzle until it is seen as a crisis. For Mercury, the same strategy (an unseen planet, called Vulcan) was tried and failed, and the anomaly stayed. This is exactly the difference between a puzzle that gets solved inside the paradigm and one that starts to erode it.

  - type: order
    id: cycle
    prompt: |
      According to Kuhn, science moves in a cycle. Put its stages in order.
    steps:
      - 'Normal science: puzzle-solving inside an accepted paradigm.'
      - 'Anomalies pile up: results the paradigm cannot explain, which resist the usual fixes.'
      - 'Crisis: the community loses confidence, and a rival paradigm appears.'
      - 'Revolution: the community changes allegiance to the rival paradigm.'
      - 'New normal science: puzzle-solving inside the new paradigm.'
    hint: 'Calm first, then trouble, then upheaval, then calm again.'
    explanation: |
      Examples Kuhn studied: the Earth-centred astronomy of Ptolemy, crowded with extra circles to match observations, gave way to the Sun-centred system of Copernicus (*De revolutionibus*, 1543); Newton's mechanics (*Principia*, 1687) ruled for over two centuries until relativity and quantum theory (Einstein's general relativity, 1915, explained Mercury's orbit). Historians still debate how neatly each case fits the cycle.

  - type: mcq
    id: gestalt
    title: "Same lines, new picture"
    image:
      src: img/duckrabbit.webp
      alt: Old line drawing that can be read as a duck facing left or a rabbit facing right
      caption: The drawing appeared in the German humour magazine *Fliegende Blätter* on 23 October 1892, under the question which two animals resemble each other most.
      credit: Unknown artist, Public domain, via Wikimedia Commons
      link: https://commons.wikimedia.org/wiki/File:Kaninchen_und_Ente.png
    prompt: |
      Imagine the well-known drawing in which the same lines can be seen either as a duck facing left or as a rabbit facing right. You see only the duck; then someone points out the rabbit and, suddenly, you cannot help seeing it too. Kuhn used this **gestalt switch** (German *Gestalt*, "form, whole shape") as an analogy for a revolution. What is the analogy?
    options:
      - text: 'The data (the lines) stay the same, but scientists come to see them as a different pattern, and it is not a step-by-step argument that makes the switch.'
        correct: true
      - text: 'New data replace the old data, so the picture changes.'
        feedback: |
          In the drawing, the lines do not change at all. Kuhn's point is that the same observations can be organised in two ways, and the change is in the organising.
      - text: 'Scientists simply pick the picture they like better.'
        feedback: |
          The analogy is about how the switch *feels* (sudden, whole-picture). It does not say the choice is a whim: the next cards ask what does guide the choice.
    explanation: |
      Kuhn's examples: before and after Copernicus, astronomers looked at the same sky; a swinging weight was a constrained falling body for Aristotelians and a pendulum for Galileo. A critic's reply: an analogy is not an argument, and scientists do give reasons for switching, which the later cards turn to.

  - type: mcq
    id: incommensurable
    title: "No neutral ruler?"
    prompt: |
      According to Kuhn, rival paradigms can be **incommensurable** (Latin-Greek, "without a common measure"). For example, "mass" means one thing in Newton (a fixed quantity) and another in Einstein (it is tied up with energy). What is Kuhn's claim, and what do critics reply?
    options:
      - text: 'Kuhn: the rival paradigms differ in problems, standards and even meanings, so no neutral point-by-point comparison exists. Critics: this is exaggerated, since rival theories still make predictions about observations that can be compared.'
        correct: true
      - text: 'Kuhn: any two theories are equally good. Critics: they are not.'
        feedback: |
          Kuhn explicitly denied this. Incommensurability is a claim about the difficulty of comparison, not that every theory is as good as every other. The next card gives his reply to the charge of relativism.
      - text: 'Kuhn: one paradigm can be derived from the other. Critics: it cannot.'
        feedback: |
          That is nearly the reverse. Defenders of continuity (as in many textbooks) say Newton's theory is a limiting case of Einstein's; Kuhn replies that even then the *meanings* of its terms change.
    explanation: |
      Two views, both live. Kuhn: translating between paradigms is never perfect, and the arguments tend to talk past each other. His critics (Popper, Lakatos, many later philosophers): when both theories predict the same measurable thing, the evidence can still decide, so comparison is possible. Kuhn himself later softened the claim to a local one, limited to certain key terms.

  - type: mcq
    id: relativism
    title: "Is it just relativism?"
    prompt: |
      Objection: if paradigms cannot be compared neutrally, then choosing between them is a matter of fashion or power, and science is no more rational than any other belief system. How did Kuhn reply?
    options:
      - text: 'Scientists share values (accuracy, scope, simplicity, consistency, fruitfulness) that guide the choice; they weigh them differently, so there is no mechanical rule, but the choice is not arbitrary.'
        correct: true
      - text: 'He agreed: there is no rational basis for the choice.'
        feedback: |
          Kuhn explicitly rejected this reading of his book. He called science a paradigm of rationality and said shared values do the work an algorithm cannot.
      - text: 'He said the older theory always loses by definition.'
        feedback: |
          Not so. The shared values can favour either side; Kuhn's point is that communities decide by weighing them, and the weights can differ.
    explanation: |
      Seen by Kuhn's defenders, this is the best steelman: reasons exist, though they are not a formula. Seen by some critics, "weigh the values as you see fit" leaves too much room for personal or social influence. Which view is right is a live debate (layer 2), and it matters for later levels: it shapes how one asks whether a theory of mind, or of the origins of the universe, is better than another.

  - type: mcq
    id: popper-vs-kuhn
    title: "Popper and Kuhn side by side"
    prompt: |
      Which pairing correctly contrasts Popper and Kuhn, according to their own writings?
    options:
      - text: 'Popper: science advances by bold conjecture and attempted refutation, and one clear refutation counts against a theory. Kuhn: most science is puzzle-solving inside a paradigm, and a paradigm is dropped only in a crisis, for a rival.'
        correct: true
      - text: 'Popper: scientists hold on to theories whatever the evidence. Kuhn: scientists drop theories at the first anomaly.'
        feedback: |
          Reversed. Popper urged dropping a refuted theory; Kuhn described a community holding on through anomalies.
      - text: 'Popper: science is relative to culture. Kuhn: science is a purely logical enterprise.'
        feedback: |
          Neither fits: Popper emphasised logic and testing; Kuhn emphasised history and community, but not relativism.
    explanation: |
      Popper's account says how science *should* be done (a norm), and Kuhn's says how it *is* done (history), though Kuhn thought his description also had normative force. They can be partly reconciled: a paradigm holds until a rival promises more, and a refutation matters most when a rival is ready. Whether to see them as rivals or as complementary is, again, a live question.

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Which of these is a **live debate** (layer 2), rather than established fact (layer 1) or a commitment (layer 3)?
    options:
      - text: 'Whether the history of science is better described as a steady accumulation or as a series of revolutions.'
        correct: true
      - text: 'That Copernicus published *De revolutionibus* in 1543.'
        feedback: |
          A plain fact of history. Layer 1.
      - text: 'That the Newtonian prediction for Mercury differed slightly from the measured orbit, and general relativity (1915) accounted for it.'
        feedback: |
          Observation and calculation, widely established. Layer 1. (What this shows about *progress* is where the debate begins.)
    explanation: |
      The dates and the Mercury result are not disputed. The debate is about the pattern: do theories add up (each includes the last as a special case, as Newton in Einstein for low speeds), or does something more like a change of worldview occur? And a deeper layer: whether such change brings us closer to truth (realists say yes) or only to better instruments (instrumentalists), which is often a layer-3 commitment about what theories are for.

  - type: mcq
    id: return
    title: "Back to Mercury"
    prompt: |
      Newtonian gravity kept being used while Mercury's orbit was an anomaly, and was only displaced when general relativity offered a rival that explained Mercury (and made new predictions, such as the bending of starlight confirmed in 1919). Which reading fits Kuhn's picture?
    options:
      - text: 'Mercury was a puzzle at first and became part of a crisis only when a rival paradigm explained it and did more; the community changed allegiance then, not at the first failure.'
        correct: true
      - text: 'Astronomers should have dropped Newton in the 1850s, as soon as the mismatch appeared.'
        feedback: |
          Popper's norm, read strictly, might say so; but with no rival ready, dropping the theory would have left nothing to calculate with. Kuhn: a paradigm is rejected only when another takes its place.
      - text: 'Einstein proved Newton was never true in any sense.'
        feedback: |
          Newton's laws remain excellent approximations at everyday speeds and are used daily; only the claim that they were the final truth went. How best to describe that is part of the debate on cumulative progress.
    explanation: |
      This returns to the opening puzzle: a theory is kept through an anomaly because it is working, and abandoned when a better rival appears. Popper focused on the logic of one test; Kuhn on the community deciding among whole frameworks. Both capture something real.

  - type: text
    id: summary
    body: |
      **Next:** Kuhn shows that scientists weigh evidence for a whole framework, not for one claim at a time, and Bayes' rule is a precise way to describe exactly that weighing. How should a degree of belief change when evidence arrives? That is the lesson **Evidence as Updating Belief**.
