id: ch02-realism
title: "Is Science Describing Reality?"
kind: concept
own: |
  - **Two views of what theories are.** Let $T$ be a successful scientific theory (one whose predictions have been confirmed again and again). According to **scientific realism**, {{ a successful theory is approximately true, and its unobservable things (electrons, fields, genes) really exist }}. According to **instrumentalism**, a theory is a tool for predicting and organising observations, and asking whether its unobservables are "real" is not required (or not answerable). Instrumentalists do not call science useless: they say its value is its predictive success.
  - **The no-miracles argument** (Hilary Putnam, 1975). Let $S$ be "the theory is empirically successful" and $R$ "the theory is approximately true". The argument reads:
  $$\begin{aligned}\text{P1: }&R \text{ would explain } S\\ \text{P2: }&\text{no rival explains } S \text{ as well}\\ \text{C: }&\text{so, probably, } R\end{aligned}$$
  It is an inference to the best explanation. A critic may reject P2 (false theories can be successful, see below) or doubt that the argument is not circular, since it uses an explanatory inference to defend explanatory inference.
  - **The pessimistic meta-induction** (Larry Laudan, 1981). Many past theories were successful and are now judged false (caloric, phlogiston, the luminous ether). So, by induction on the history of science,
  {{ our current successful theories are probably false too }}
  and success is not a reliable sign of truth. This is an inductive argument about theories, so Hume's problem of induction applies to it as well.
  - **Replies by realists.** *Selective realism*: only the parts of a theory that did the work in its successes deserve belief. *Structural realism* (John Worrall, 1989): what survives theory change is {{ the mathematical structure, the equations, not the nature of the underlying things }}. Example: Fresnel's equations for the reflection of light were kept in Maxwell's theory, though the elastic ether they were first built on was dropped.
  - **Constructive empiricism** (Bas van Fraassen, b.1941): science aims at theories that are **empirically adequate** (right about what is observable) and to accept a theory is to believe only that, not that its unobservables exist. A realist replies that the line between observable and unobservable is vague (telescope, microscope), so belief should not stop at an arbitrary place.
  - **Where thoughtful people part ways.** Whether success is better explained by truth or by selection (theories that failed were discarded, so we only see the survivors), and whether the history of science teaches caution or continuity. Layers: the history of dropped theories is established; whether realism or instrumentalism is better is a live debate, resting on a metaphysical commitment about what explanation shows.
cards:
  - type: mcq
    id: hook
    title: "A theory that worked, then was dropped"
    prompt: |
      Around 1800, the **caloric theory** said heat is a weightless fluid, called caloric, that flows from hot bodies to cold ones. It predicted correctly, for decades, how much heat is released in many processes (for example the speed of sound in air, after Laplace's correction). By the mid-1800s heat was understood as the motion of atoms, and caloric was dropped. Before any theory: guess. Was the caloric theory *true* while it was successful?
    options:
      - text: 'Yes, completely true: it predicted correctly, so its picture of a heat fluid was right.'
        feedback: |
          A strong realist would not say this. If predictive success proved the picture, the picture could not later be dropped; but heat is not a fluid. Success and picture came apart.
      - text: 'No, and it was never useful: a false theory cannot predict anything.'
        feedback: |
          False theories can predict well within a range: Newton's gravity is not the final word (general relativity replaced it) and still guides spacecraft. Prediction needs only some match with the world, not total truth.
      - text: 'Partly: it got something right (many heat results) while its picture of a fluid was wrong; how to describe that is the question.'
        correct: true
    explanation: |
      The caloric theory was a good tool for many heat problems and it was wrong about what heat is. **Is a successful theory telling us what the world is like, or only how to predict it?** Philosophers of science call the first answer *realism* and the second *instrumentalism*. This lesson gives each its best case.

  - type: text
    id: define
    title: "Two views, defined"
    body: |
      **Scientific realism** (according to its defenders): our best theories are *approximately true* descriptions of the world, including the parts we cannot observe directly, such as electrons or fields. A theory is **approximately true** when its claims are close to how things are, even if some details are wrong.

      **Instrumentalism** (according to its defenders): a theory is a *tool*, an instrument, for predicting and organising what we can observe. Asking whether electrons "really exist" is either unanswerable or beside the point.

      Two notes. An instrumentalist does not call science useless; they say its value *is* its predictive power. And a realist does not claim that every current theory is exactly true; the claim is "approximately true, and improving".

      These are a *metaphysical commitment* (layer 3 in this course): the facts of the history of science are agreed; how to read them is debated.

  - type: text
    id: nma
    title: "The no-miracles argument"
    body: |
      According to Hilary Putnam (1926-2016), in 1975, the best reason for realism is that it makes the success of science no miracle. Set out as a guided proof:

      - **P1.** Our best theories are empirically successful: they predict new, surprising results.
      - **P2.** The best explanation of this success is that the theories are approximately true.
      - **C.** So, probably, the theories are approximately true.

      The step from P1 and P2 to C is **inference to the best explanation**: choose the explanation that accounts for the facts better than its rivals. The step is valid *if* it is a good rule; whether it is, is exactly what critics question.

  - type: mcq
    id: nma-q
    title: "Which premise would a critic reject?"
    prompt: |
      Putnam's argument has P1 (best theories are successful) and P2 (the best explanation of that success is approximate truth). Which premise would an instrumentalist reject, and why?
    options:
      - text: 'P1: no theory is ever really successful.'
        feedback: |
          Instrumentalists accept the success, it is their whole case for the theory's value. P1 is the shared starting point of both sides.
      - text: 'P2: success can be explained without truth (for example, we keep only the theories that worked, or the theory is adequate for observations), so truth is not the *only* good explanation.'
        correct: true
      - text: 'The conclusion C only, while accepting P1 and P2 and the inference.'
        feedback: |
          If P1, P2 and the inference rule are all accepted, C follows (probably). A critic must reject a premise or the rule; accepting all three and denying C is inconsistent.
    explanation: |
      The instrumentalist grants P1 and attacks P2 (or the rule of inference to the best explanation). A realist replies that the alternatives explain less. Notice that the two sides **agree on the facts** and differ on what counts as the best explanation.

  - type: mcq
    id: nma-circ
    title: "Is the argument circular?"
    prompt: |
      A critic says: "To defend realism you use inference to the best explanation. But whether that kind of inference leads to truth is exactly what the realist and the instrumentalist dispute." What is the critic's complaint?
    options:
      - text: 'The argument is circular: it uses, as a rule, what it is meant to show is reliable.'
        correct: true
      - text: 'The argument is invalid, since C does not follow from P1 and P2 under any rule.'
        feedback: |
          The complaint is not about the shape of the proof but about whether its main rule can be trusted without already assuming realism. (Hume's problem for induction has the same flavour: justifying a rule by using it.)
      - text: 'The argument is true by definition, so it needs no premises.'
        feedback: |
          Neither side thinks that. The argument has empirical premises (P1) and one disputed one (P2).
    explanation: |
      A realist replies that every basic rule of reasoning faces the same worry, so some circularity is unavoidable and harmless; the critic answers that this makes the argument unable to persuade someone who doubts the rule. Both replies are serious.

  - type: text
    id: pmi
    title: "The pessimistic meta-induction"
    body: |
      Larry Laudan (1941-2022), in 1981, answered Putnam with a list of theories that were successful in their day and are now regarded as false: the **caloric** theory of heat, **phlogiston** (a substance said to be released in burning, replaced by Lavoisier's oxygen account in the 1770s and 1780s) and the **luminous ether** (a medium said to carry light waves, dropped after Michelson and Morley's null result in 1887 and Einstein's relativity in 1905).

      The argument is an induction **about theories** (a "meta-induction"):

      - **P1.** Many past theories were empirically successful and are now judged false.
      - **P2.** Our current theories are not obviously different in kind from those.
      - **C.** So, probably, many of our current successful theories are false too, and success is a poor sign of truth.

  - type: order
    id: pmi-order
    title: "The ether story in order"
    prompt: |
      Put these episodes in the order they happened.
    steps:
      - 'Fresnel builds a successful wave theory of light, which treats light as waves in an ether (1810s-1820s).'
      - 'Maxwell shows that light is an electromagnetic wave (1860s).'
      - 'Michelson and Morley fail to detect motion through the ether (1887).'
      - 'Einstein''s special relativity makes the ether unnecessary (1905).'
    hint: |
      Wave theory of light first, then the electromagnetic theory, then the failed experiment, then relativity.
    explanation: |
      The ether was useful for roughly a century. That is the pessimist's point: a long record of success did not save the central entity. Look also at what the story contains: Fresnel's equations for the *amount* of light reflected survived into Maxwell's theory unchanged. That detail drives the realists' best reply.

  - type: mcq
    id: pmi-q
    title: "How strong is the pessimistic argument?"
    prompt: |
      A realist objects: "Laudan's list is a few famous cases; there are thousands of theories we would never think of dropping (the Earth goes around the Sun, DNA carries heredity)." Which is the fair summary of this exchange?
    options:
      - text: 'Pessimists win: any dropped theory refutes realism for good.'
        feedback: |
          Realism claims *approximate* truth of *mature* theories, not that every theory ever proposed is true. A few failures do not refute it, they only make it less safe.
      - text: 'Realists win: examples are only anecdotes, so the pessimistic argument has no force.'
        feedback: |
          An induction over theories is exactly a claim about the track record. If the track record contains many cases of success followed by rejection, the worry stands until someone explains why current theories differ (the next cards).
      - text: 'It depends on how the cases are counted and which theories count as mature and successful; the realist must show that current theories differ in kind.'
        correct: true
    explanation: |
      This is a live debate. Realists argue that the right comparison is with *mature* theories that made novel, surprising predictions, and that these rarely vanish entirely. Pessimists answer that caloric and the ether also had novel predictions. Counting cases is a task for historians, not a proof either way.

  - type: mcq
    id: selective
    title: "A realist reply: selective realism"
    prompt: |
      A selective realist says: "We should believe not the whole of a successful theory, but only the parts that did the work in its predictions." Applied to the caloric and ether stories, what would they say?
    options:
      - text: 'The heat-flow equations (the parts used to predict) deserve some belief; the picture of an invisible heat fluid does not.'
        correct: true
      - text: 'Nothing in any theory deserves belief, so only observations remain.'
        feedback: |
          That is the instrumentalist position, not the selective realist's: the selective realist keeps belief in the working parts.
      - text: 'The whole theory deserves belief; the dropped part was never really part of it.'
        feedback: |
          That would be a historical rewrite: the caloric theory *was* a fluid theory. Selective realists have to split the theory *before* the revolution, not after, or the position cannot be tested.
    explanation: |
      The difficulty for selective realism is to say, *in advance*, which parts do the work. Critics say that the working parts are identified only afterwards, with hindsight. Defenders say that careful study of the derivations can show it.

  - type: mcq
    id: structural
    title: "A realist reply: structural realism"
    prompt: |
      Worrall (1989) points out: the equations by which Fresnel computed how much light is reflected and refracted at a surface survive unchanged in Maxwell's theory, though the elastic ether they were first derived for was dropped. What does the **structural realist** conclude?
    options:
      - text: 'What we should believe in is the mathematical structure (relations between quantities), which survives theory change, not the nature of the underlying things.'
        correct: true
      - text: 'The ether still exists, in disguise, so nothing was dropped.'
        feedback: |
          Structural realists accept that the ether was dropped; that is the point. They keep the structure and let go of the claims about what the things are like.
      - text: 'Equations are true only because they are simple, so Occam''s razor proves realism.'
        feedback: |
          Worrall's claim concerns continuity of structure across theories, not simplicity. (Simplicity as a sign of truth is the disputed topic of the lesson When Data Cannot Decide.)
    explanation: |
      Structural realism is a middle road: realism about **structure**, scepticism about **nature**. A rival worry (sometimes put by philosophers such as Psillos) is that the distinction is hard to draw, since structure is always the structure *of* something. The position returns in the level on mathematics and reality.

  - type: text
    id: instr
    title: "The instrumentalist steelman"
    body: |
      According to Bas van Fraassen (b.1941), whose view is called **constructive empiricism**, science aims at theories that are **empirically adequate**: true about what is observable. To *accept* a theory is to believe that much, and to use its picture of unobservable things, without believing that picture. This differs from older instrumentalism, which said that talk of unobservables is not meant to be true or false; van Fraassen takes it literally, and withholds belief.

      His case: the evidence we have fits the observable part of many possible theories (underdetermination, see the lesson When Data Cannot Decide), so belief beyond the observable goes beyond the evidence. We lose nothing in practice: the theory is just as usable.

      The best realist reply: the line between observable and unobservable is not sharp, and belief about the unobservable is what makes theories *explain* rather than only summarise.

  - type: mcq
    id: observable
    title: "Where is the line?"
    prompt: |
      Van Fraassen counts as **observable** what can be seen with the unaided senses (possibly from a closer position). A realist asks about intermediate cases: the moons of Jupiter seen through a telescope, bacteria through a microscope, tracks in a particle detector. What is the realist's point?
    options:
      - text: 'These cases form a gradual sequence from naked-eye to instrument-aided seeing, so a sharp cut at "unaided" looks arbitrary.'
        correct: true
      - text: 'Anything seen with an instrument is certain, so every theory is confirmed.'
        feedback: |
          Instruments can mislead (lens artefacts, detector noise). The realist argues that the *line* is arbitrary, not that instruments are infallible.
      - text: 'Nothing is observable, even with the naked eye, so van Fraassen has no case.'
        feedback: |
          Van Fraassen's reply to the gradual-sequence argument is that vague borders do not abolish the difference between clear cases, as with "bald". The disagreement is serious on both sides.
    explanation: |
      Van Fraassen answers that a vague line is still a line: the moons of Jupiter could in principle be seen from a spacecraft by eye, whereas an electron could not. The philosopher Ian Hacking (1936-2023) gave a different realist argument: when physicists use electrons to *do* things (to spray them onto a target and change its charge), the electrons are as real as anything we manipulate. Two further views, no consensus.

  - type: mcq
    id: virtues
    title: "Link to underdetermination"
    prompt: |
      Two theories fit all the data equally well, but one is simpler and explains more. According to a realist, what do these extra virtues indicate? According to an instrumentalist?
    options:
      - text: 'Realist: they are signs of truth. Instrumentalist: they are reasons to prefer the theory for use and beauty, not signs of truth.'
        correct: true
      - text: 'Realist: they are only matters of taste. Instrumentalist: they are signs of truth.'
        feedback: |
          Reversed. The realist uses virtues like simplicity and explanatory power as evidence about the world; the instrumentalist treats them as practical or aesthetic.
      - text: 'Both agree that the virtues are signs of truth, so the theories are not equivalent.'
        feedback: |
          Both agree the theories are not *equivalent in use*; they disagree on whether the virtues point to truth, which is the whole dispute.
    explanation: |
      The realism debate and the underdetermination debate are one question seen twice. If virtues track truth, the data plus virtues can single out a theory and belief in the unobservable is justified. If not, the data leave the choice open and belief should stop at what is observed.

  - type: mcq
    id: traps
    title: "Two misreadings"
    multiple: true
    prompt: |
      Select every statement that **misdescribes** a position in this lesson.
    options:
      - text: 'Scientific realists say every current theory is exactly true.'
        correct: true
        feedback: |
          Misdescription: realists say *approximately* true, and mostly for mature, well-tested theories, with revision expected.
      - text: 'Instrumentalists think science is useless or its results are false.'
        correct: true
        feedback: |
          Misdescription: instrumentalists value science for its predictions and technology; they only decline to believe in the unobservable parts.
      - text: 'A structural realist holds that the mathematical structure of a theory is what survives theory change.'
        feedback: |
          This is a correct description.
      - text: 'The pessimistic meta-induction argues that success is not a reliable sign of truth, using the history of dropped theories.'
        feedback: |
          This is a correct description.
    explanation: |
      Both misreadings make the opponent a strawman. A fair debate begins with the best version of each side, and the best versions share a great deal: both accept the success of science, both use its results, and both revise their theories in the light of evidence.

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Classify the claim "Caloric was a successful theory that was later replaced" and the claim "Successful theories describe unobservable reality approximately truly".
    options:
      - text: 'First: established fact (history). Second: a metaphysical commitment, debated.'
        correct: true
      - text: 'Both are established facts, since science supports them.'
        feedback: |
          The history is fact; the second claim is about what success *means*, and science alone does not settle it: realists and instrumentalists accept the same experiments.
      - text: 'First: a faith commitment. Second: established fact.'
        feedback: |
          Reversed. The first is documented history; the second is the contested interpretation.
    explanation: |
      Realism is a layer-3 commitment about explanation. It can be supported by arguments (no miracles) and attacked by others (pessimistic induction); it cannot be read off one experiment. Notice that the later levels use the same move for other big questions.

  - type: mcq
    id: return
    title: "Back to caloric"
    prompt: |
      Return to the caloric theory: successful for decades, then dropped. How would a selective or structural realist, and an instrumentalist, each read this case?
    options:
      - text: 'Realist: the part that did the work (the quantitative heat relations) survived in thermodynamics, only the fluid picture went. Instrumentalist: it was a good tool until a better tool arrived; no belief in a fluid was ever required.'
        correct: true
      - text: 'Realist: caloric was true all along. Instrumentalist: it was always false.'
        feedback: |
          Neither fits: the realist grants the fluid picture was wrong, and the instrumentalist does not call a good tool false.
      - text: 'Realist and instrumentalist agree on every question about it, so the debate is empty.'
        feedback: |
          They agree about the history and the predictions, and differ on what belief the success warranted. That is a real difference, which shows in how each would treat today''s theories.
    explanation: |
      Two readings of one history. The realist emphasises what survived; the instrumentalist emphasises what was never needed. The reader's task is to know what each premise would have to be for their own view to follow.

  - type: text
    id: summary
    body: |
      **Next:** Which fields really are science, and which only borrow its look? The next lesson takes astrology, homeopathy and other fringe claims: what marks a field that lacks science's checks, and why the line is blurry.
