id: ch02-falsification
title: Popper and the Black Swan
kind: concept
own: |
  - **The asymmetry.** Take the universal claim "all swans are white". No number of white swans **proves** it (the next swan may differ), but one black swan **refutes** it. Counting confirming cases never settles a universal claim; one clear counter-case does. The black swans were met by Europeans in Australia in the 1690s.
  - **Popper's proposal.** According to **Popper** (1902-1994), in *Logik der Forschung* (1934), science advances by **conjectures and refutations**: it proposes bold theories and tries hard to refute them. The refutation step is the valid argument (*modus tollens*), where $T$ is a theory and $O$ an observable prediction:
  {{ $$\begin{gathered}T \Rightarrow O \\ \text{not } O \\ \therefore\ \text{not } T\end{gathered}$$ }}
  - **Demarcation.** A claim is **falsifiable** when {{ some possible observation would contradict it }}. According to Popper this, not "has been confirmed", is what marks a claim as scientific. "It will rain or it will not" forbids nothing, so it is not falsifiable; "all swans are white" is. A **bold** prediction risks a lot (Einstein's 1919 light-bending), a safe one risks nothing. Passing a severe test makes a theory **corroborated**, not proved.
  - **Duhem's reply.** A theory never meets observation alone: a prediction needs the theory $T$ plus **auxiliary assumptions** $A$ (about the instruments, the data, other bodies). So the real argument is
  {{ $$\begin{gathered}(T \wedge A) \Rightarrow O \\ \text{not } O \\ \therefore\ \text{not } (T \wedge A)\end{gathered}$$ }}
  and a failed prediction shows that {{ at least one of T or A is false, not which one }}. Uranus's orbit broke Newtonian predictions in the 1840s; the blame fell on an unseen planet (Neptune, found in 1846), not on Newton. For Mercury's orbit the same move (a planet "Vulcan") failed; general relativity (1915) explained it.
  - **Powerful but incomplete.** Falsification is a clean test for universal claims, yet: probabilistic claims forbid no single outcome; "there exists" claims (a black swan exists) can be confirmed but not refuted by a finite search; and a claim that is not falsifiable may still be meaningful, as many hold of ethics or metaphysics.
  - **Where thoughtful people part ways.** Whether falsifiability is the **criterion** of science (Popper), only one useful **test** among several (many philosophers of science), and whether unfalsifiable claims are meaningless or just a different kind of claim (layer 2, a live debate, not layer 1).
cards:
  - type: mcq
    id: hook
    title: "A thousand white swans"
    prompt: |
      For centuries, every swan anyone in Europe had ever seen was white. Suppose you have personally seen 1,000 white swans and no other colour. Before any theory, **guess**: how much does that prove the claim "all swans are white"?
    options:
      - text: 'It makes the claim likely, but it does not prove it: the next swan could still be different.'
        correct: true
      - text: 'It proves the claim: 1,000 out of 1,000 is as good as certain.'
        feedback: |
          A thousand is a lot, but the claim is about *all* swans, including ones nowhere near you. A record of 1,000 matches is consistent with a world where swan number 1,001 is black.
      - text: 'It proves nothing and does not even make the claim more likely.'
        feedback: |
          That goes too far. Each white swan is at least some support, as in everyday life. The real question is whether support can ever add up to proof.
    explanation: |
      Most people feel the pull both ways: strong support, no proof. The question of this lesson is what to *do* about that gap. The philosopher **Karl Popper** gave a surprising answer: stop trying to prove, and try to **refute**.

  - type: widget
    id: sampler-swans
    widget: sequence-sampler
    config:
      rule: rate
      p: 0.03
      seed: 4
      symbols: ["⚪", "⚫"]
      claim: "All swans are white."
      max: 200
      show: { streak: false }
      labels:
        next: "Next swan"
        ten: "Ten swans"
        reset: "Start over"
        empty: "No swan observed yet."
      presets:
        - { label: "Another hidden stream", rule: rate, p: 0.03, seed: 9 }
    body: |
      In this toy world, each new swan is black with a small hidden probability. Press **Next swan** or **Ten swans** and watch the claim "All swans are white." Notice how it stands for as long as the record is all white, and what happens at the first black swan.

  - type: mcq
    id: asymmetry
    title: "One against a thousand"
    prompt: |
      A toy world has one claim: "all swans are white". You have seen 1,000 white swans and then one black swan. Which statement is correct?
    options:
      - text: 'The black swan refutes the claim for good, however many white swans were seen; the 1,000 white swans never proved it.'
        correct: true
      - text: 'The claim is still very likely true: 1,000 white swans outweigh one black swan.'
        feedback: |
          Weighing works for a *tendency* ("most swans are white"). But the claim says **all**, and one clear black swan is a case where it is false. Outweighing does not apply to a claim with no exceptions.
      - text: 'The claim is now half refuted and half confirmed, so we can say nothing.'
        feedback: |
          The black swan does not leave the claim half true. "All swans are white" is a claim without exceptions, and an exception ends it. (A weaker claim, "most swans are white", survives.)
    explanation: |
      This is the **asymmetry** between confirming and refuting a universal claim. No finite pile of white swans proves "all swans are white", but one black swan refutes it. The refutation is a logical step; the confirmation never is.

  - type: text
    id: popper
    title: "Popper's proposal"
    image:
      src: img/blackswan.webp
      alt: Black swan with red bill swimming on water
      caption: The black swan (*Cygnus atratus*) is native to Australia; Dutch sailors under Willem de Vlamingh reported them on the Swan River in January 1697, long after Europe had settled on "all swans are white".
      credit: Charles J. Sharp, CC BY-SA 4.0, via Wikimedia Commons
      link: https://commons.wikimedia.org/wiki/File:Black_swan_(Cygnus_atratus)_Scottsdale.jpg
    body: |
      Black swans were found by Europeans in Australia: the Dutch expedition of **Willem de Vlamingh** sailed up what he named the Swan River in January 1697 and saw them (they were not the first Europeans to see black swans, but this voyage is the famous one). "All swans are white" had stood on an unbroken record, and fell at once.

      **Karl Popper** (1902-1994), an Austrian-British philosopher, turned this asymmetry into a view of science. In *Logik der Forschung* (written 1934, imprint 1935; later *The Logic of Scientific Discovery*) and *Conjectures and Refutations* (1963) he argued, in a paraphrase:

      - We do not get theories by induction; we **guess** them: **conjectures**.
      - We then test them by trying to **refute** them with observations.
      - A theory that survives severe tests is not proved, only **corroborated** ("so far unbeaten").

      The logic of a refutation has a Latin name, ***modus tollens*** ("the way that denies"): if a theory $T$ implies an observable result $O$, and $O$ is not observed, then $T$ is false.

  - type: order
    id: tollens-order
    prompt: |
      Put the refutation of "all swans are white" in order, as a valid argument (a theory $T$ and a prediction $O$).
    steps:
      - 'If "all swans are white" is true, then every swan found in Australia will be white.'
      - 'A swan found on the Swan River is black.'
      - 'So not every swan found in Australia is white.'
      - 'So "all swans are white" is false.'
    hint: 'Start from the theory and its prediction, then the observation, then the conclusion.'
    explanation: |
      Prediction first ($T$ implies $O$), then the observation (not $O$), then the conclusion (not $T$). This form is valid: if the premises are true, the conclusion cannot be false. Compare the "confirming" form, "if $T$ then $O$; $O$; so $T$", which is **not** valid (many theories can predict the same $O$).

  - type: mcq
    id: falsifiable
    title: "Could it be caught out?"
    prompt: |
      A claim is **falsifiable** if some possible observation would contradict it. Which of these is **not** falsifiable?
    options:
      - text: 'Tomorrow it will either rain in São Paulo or it will not rain.'
        correct: true
      - text: 'Tomorrow it will rain in São Paulo.'
        feedback: |
          A dry day would contradict it. It may well be false, and that is exactly what makes it falsifiable.
      - text: 'Every metal expands when heated.'
        feedback: |
          One metal that shrinks on heating would contradict it. A universal law is the model case of a falsifiable claim.
      - text: 'Every planet orbits the Sun in an ellipse.'
        feedback: |
          A planet with a clearly different orbit would contradict it. It is a bold universal claim, hence falsifiable.
    explanation: |
      "Rain or no rain" is true in every possible weather, so no observation could contradict it: it says nothing about the world. According to Popper that is the problem with claims that fit everything. **Demarcation** is the old problem of drawing a line between science and non-science, and Popper's line is falsifiability. The vaguer a claim's wording, the fewer observations it forbids.

  - type: mcq
    id: bold
    title: "Bold or safe?"
    prompt: |
      Two forecasters. Anna says "tomorrow the temperature will be between 5 and 40 degrees Celsius in São Paulo". Bruno says "tomorrow the maximum will be between 27 and 28 degrees". According to Popper, which forecast is more scientific, and why?
    options:
      - text: 'Bruno: it forbids far more outcomes, so it risks refutation; surviving it would tell us much more.'
        correct: true
      - text: 'Anna: she is almost certainly right, and being right is the aim.'
        feedback: |
          Being right is the aim, but a claim that is almost sure to be right because it forbids almost nothing teaches us almost nothing. According to Popper a good theory is **bold**: it sticks its neck out.
      - text: 'Neither, because no forecast about the future can be tested.'
        feedback: |
          Forecasts are tested by waiting. Tomorrow's maximum will be 27.5 or it will not, and the forecast is judged then.
    explanation: |
      Content and risk go together: the more a claim forbids, the more it says and the easier it is to refute. A theory that passes a *severe* test (one it would probably have failed if false) is **corroborated**. Corroboration is a report of past performance, not a proof for the future, which is how Popper answers Hume (see the lesson on induction).

  - type: text
    id: examples
    title: "Popper's own examples"
    image:
      src: img/eclipse1919.webp
      alt: Negative photograph of the sky during the 1919 total solar eclipse, with stars marked
      caption: A negative from the 4-inch lens used at Sobral, Brazil, during the eclipse of 29 May 1919, published in the 1920 report by Dyson, Eddington and Davidson; the small shifts of the star positions were compared with the prediction.
      credit: F. W. Dyson, A. S. Eddington, and C. Davidson, Public domain, via Wikimedia Commons
      link: https://commons.wikimedia.org/wiki/File:1919_eclipse_negative.jpg
    body: |
      Popper said he was struck by the contrast between two kinds of theory.

      - **Einstein's general relativity.** It predicted that starlight passing near the Sun is bent by a definite amount. In **1919**, during the solar eclipse of 29 May, expeditions led by **Arthur Eddington** (1882-1944) and others photographed stars near the Sun. Had the stars stayed where Newtonian ideas put them, Einstein's theory would have been refuted. It risked a lot, and survived.
      - **Marxist history and Freudian psychoanalysis** (Popper's targets). He admired their ambition, but he argued that their defenders could read *any* event as confirmation: a patient who behaves one way, or the opposite way, both "fit" the theory. A theory that can explain every outcome forbids none, and so, according to Popper, is not tested by outcomes.

      Defenders replied that Popper judged the theories by their loosest popular versions. Marxists and psychoanalysts of a more careful kind did make risky claims (some of which turned out false), and psychoanalytic theory, they hold, is a form of understanding meaning that cannot be reduced to prediction. Both of these are live disputes; what is clear is Popper's *test*: ask "what would count against it?".

  - type: mcq
    id: examples-q
    title: "What counts against it?"
    prompt: |
      A friend says: "My theory explains everything. If you succeed, it is because the theory is right; if you fail, that is just what the theory says happens when people are stubborn." According to Popper, what is wrong with this?
    options:
      - text: 'Since it fits every outcome, no outcome could ever count against it, so it has not been tested.'
        correct: true
      - text: 'It is wrong because it is a theory about people and not about physics.'
        feedback: |
          Popper's test is about the logical form of a claim (what it forbids), not its subject. A theory about people could be bold if it named outcomes it forbids.
      - text: 'It is wrong because it has not been proved yet.'
        feedback: |
          According to Popper nothing is ever proved. The problem is the opposite: it can never be caught out.
    explanation: |
      Every "yes" and every "no" fits, so the friend's theory is safe from refutation. For Popper that safety is a weakness, not a strength.

  - type: text
    id: duhem
    title: "A catch: it is never one claim"
    image:
      src: img/duhem.webp
      alt: Portrait photograph of Pierre Duhem, a man with a beard, around 1900
      caption: Pierre Duhem (1861-1916), who argued in *La théorie physique* (1906) that a physical hypothesis is never tested in isolation.
      credit: Unknown author, Public domain, via Wikimedia Commons
      link: https://commons.wikimedia.org/wiki/File:Pierre_Duhem_1900_(cropped).jpg
    body: |
      The French physicist and philosopher **Pierre Duhem** (1861-1916) pointed out a catch that Popper later had to face. A theory almost never predicts anything **alone**. To predict what a telescope shows, you also assume how the telescope works, what the air does to light, how the data are read, and which other bodies exist. These are **auxiliary assumptions**, $A$.

      So the real argument is: if ($T$ and $A$) then $O$; not $O$; so **not** ($T$ and $A$). Something is false, but the argument does not say which part.

      **A famous case.** By the 1840s the orbit of Uranus did not match Newtonian predictions. **Urbain Le Verrier** (1811-1877) assumed Newton was right and an unseen planet was pulling on Uranus; he computed where it should be, and in **1846** astronomers at Berlin found Neptune within about a degree of his position. Le Verrier then tried the same move for Mercury, whose orbit also did not fit: he proposed an unseen inner planet, "Vulcan". It was never found. The Mercury anomaly was explained in **1915** by Einstein's new theory, not by a new planet.

  - type: mcq
    id: duhem-q
    title: "Which premise fails?"
    prompt: |
      Newtonian gravity ($T$) plus "the known planets are all there is" ($A$) predicted a wrong orbit for Uranus. Which conclusion does the failed prediction logically force?
    options:
      - text: 'At least one of $T$ and $A$ is false; the prediction alone does not say which.'
        correct: true
      - text: 'Newtonian gravity ($T$) is false.'
        feedback: |
          That is one possibility, and Mercury shows it can be the right one. But for Uranus the culprit turned out to be $A$: there was another planet. The logic only says that the *pair* fails.
      - text: 'The known planets are not all there is ($A$ is false).'
        feedback: |
          True for Uranus (Neptune exists), but not forced by logic. For Mercury the blame fell on $T$ instead. The argument does not choose.
    explanation: |
      Refutation is a valid step only for the whole bundle. Which member to give up is a further judgement, resting on how well each has done elsewhere. That is why two scientists can see the same failed prediction and blame different parts.

  - type: mcq
    id: duhem-q2
    title: "Dodging refutation"
    prompt: |
      Someone shows that, whenever a prediction fails, one can always blame an auxiliary assumption and keep the theory. Which conclusion is **best supported**?
    options:
      - text: 'Refutation is never fully conclusive, so what matters is whether the rescue is independently testable (Neptune was; "Vulcan" was not).'
        correct: true
      - text: 'Falsification is useless, because any theory can be kept forever.'
        feedback: |
          A theory *can* be kept by blaming something else, but the rescue costs: it must be tested in its own right. Neptune was predicted a place to look and was found; the Vulcan rescue was tried and failed. Popper called rescues with no independent test "ad hoc" and disliked them.
      - text: 'Scientists should abandon a theory at the first failed prediction.'
        feedback: |
          That would have thrown out Newton's theory over Uranus, and Neptune would never have been found. The first failure calls for investigation, not automatic surrender.
    explanation: |
      The two views here are both defensible. Strict falsificationists say a rescue must raise the theory's testability, or it is ad hoc. Followers of Duhem (and later Quine) stress that testing is of a whole network of beliefs, so no single refutation is ever as clean as the swan case.

  - type: text
    id: objection
    title: "Powerful, but is it complete?"
    body: |
      Popper's test is clear and has been influential among scientists. Three pressure points are often raised:

      - **Probabilistic claims.** "This coin lands heads half the time" forbids no single sequence of tosses. Even 100 heads in a row is possible, only extremely unlikely. So refutation needs a rule for "unlikely enough", which statistics provides but strict logic does not.
      - **"There exists" claims.** "There is a black swan somewhere" is confirmed by finding one, but a finite search that finds none does not refute it. The logic is the mirror image of "all swans are white".
      - **Meaningful but not falsifiable?** Popper himself said unfalsifiable claims (metaphysics, ethics, many religious ideas) are not necessarily meaningless; they are just not part of empirical science. Others, such as the logical positivists before him, held unverifiable claims to be meaningless. Still others say that some metaphysical ideas (for instance, atomism) were useful long before they could be tested.

  - type: mcq
    id: objection-q
    title: "Which gap is which?"
    prompt: |
      "There exists a planet beyond Neptune whose orbit takes more than 10,000 years" cannot be refuted by looking at the sky for a decade and finding nothing. What is the gap?
    options:
      - text: 'It is an "exists" claim: a failed finite search does not refute it, though a find would confirm it.'
        correct: true
      - text: 'It is a probabilistic claim, so no outcome contradicts it.'
        feedback: |
          The claim is not about chances. A single clear find would settle it; it is a plain existence claim.
      - text: 'It is meaningless because it cannot be refuted.'
        feedback: |
          Not meaningless: it is clear what finding it would look like. It is only that a negative search can never close the case. Popper's test gives a verdict on universal claims; this one has the mirror logic.
    explanation: |
      Universal claims ("all") can be refuted but never confirmed by a finite record; existence claims ("some") can be confirmed but never refuted by one. Science uses both kinds, so a single test cannot do all the work.

  - type: mcq
    id: meaningful
    title: "Two views of the unfalsifiable"
    prompt: |
      "Cruelty is wrong" is not falsifiable by any observation. Which of the following is a reading Popper's own view allows?
    options:
      - text: 'It is not a claim of empirical science, but that does not make it meaningless or unimportant.'
        correct: true
      - text: 'It is false, because nothing can confirm it.'
        feedback: |
          Not being falsifiable does not make a claim false. It only places it outside what experiments can decide. Calling it false would need an argument of its own.
      - text: 'It is meaningless nonsense, because only testable claims have meaning.'
        feedback: |
          That is the stricter view of the logical positivists, which Popper rejected. He used falsifiability to mark off *science*, not to rule on what is meaningful.
    explanation: |
      Popper separated two questions: what counts as empirical **science** (his criterion), and what counts as **meaningful** (he did not equate the two). Others do equate them, and the disagreement is a live one. This matters for later levels, where claims about God, mind and ethics must be judged by criteria of their own.

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Which of these statements about Popper is a **live debate** (layer 2) rather than established fact (layer 1) or a commitment (layer 3)?
    options:
      - text: 'Whether falsifiability is the right criterion for telling science from non-science.'
        correct: true
      - text: 'That a single clear black swan makes "all swans are white" false.'
        feedback: |
          This is logic plus an observation: if the swan is truly black and truly a swan, the claim is false. Layer 1.
      - text: 'That Popper published *Logik der Forschung* in 1934.'
        feedback: |
          A plain fact of history. Layer 1.
    explanation: |
      The logic of refutation is not in dispute. What is disputed is how far it goes: whether it demarcates science, how to handle auxiliary assumptions, and what to say about claims that cannot be tested. Those are layer 2.

  - type: mcq
    id: return
    title: "Back to the swans"
    prompt: |
      A black swan is found. Which response best matches Popper's picture of science?
    options:
      - text: 'Give up "all swans are white" and propose a bolder replacement, for instance "swan colour depends on region", which can itself be tested.'
        correct: true
      - text: 'Keep "all swans are white" and declare black swans not real swans.'
        feedback: |
          Redefining "swan" to exclude the counter-case rescues the claim by emptying it: it now forbids nothing. This is the ad hoc move Popper warned against.
      - text: 'Give up on swans: no claim about nature can be known.'
        feedback: |
          Popper's view is the opposite: we learn by finding mistakes. A refutation is progress, since it tells us what is false.
    explanation: |
      For Popper, an error found is knowledge gained. We never reach certainty, but we can get closer to the truth by weeding out falsehoods. Whether that is enough of an answer to Hume's problem is, as the induction lesson said, still debated.

  - type: text
    id: summary
    body: |
      **Next:** Popper pictures science as a steady sequence of bold guesses and refutations. The historian **Thomas Kuhn** (1922-1996) looked at how science was actually done and saw something different: long calm periods and sudden changes of whole worldview. What happens to refutation when a community's shared assumptions are themselves the thing in question?
