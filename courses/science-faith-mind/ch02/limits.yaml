id: ch02-limits
title: "What Science Can and Cannot Say"
kind: concept
own: |
  - **Three kinds of question.** *Empirical* questions ask what is the case and can be checked by observation ("what is the electron's charge?"); *normative* questions ask what ought to be ("is lying wrong?"); *metaphysical* questions ask about the deepest nature of what exists ("why is there something rather than nothing?"). According to most philosophers, science is the best tool for the first kind and at most an input to the others.
  - **Two naturalisms.** *Methodological naturalism* is a rule of the method: {{ science explains with natural causes and tests, and sets aside appeals to supernatural ones, without claiming there are none }}. *Metaphysical (philosophical) naturalism* is a claim about reality: {{ nature is all there is }}. Many believers accept the first and reject the second; the second is a worldview, not a result of the method.
  - **Hume's gap.** According to David Hume (1711-1776, *Treatise* 3.1.1), moral conclusions seem to be added to a list of facts without justification. The pattern is
  $$\text{facts only} \not\Rightarrow \text{an ought}$$
  so {{ facts alone do not entail values: a value premise is needed }}. Replies: some philosophers accept the gap, others build ethics from facts about wellbeing (with a value hidden in "wellbeing").
  - **Science and religion.** Stephen Jay Gould (1941-2002) proposed *NOMA*, {{ non-overlapping magisteria: science covers the empirical, religion covers meaning and values }} (1997). Critics reply that many religions make factual claims (about history, the age of the Earth, healing), and these can be examined. So science can speak to *testable* religious claims (for example, the 2006 STEP trial found no benefit from intercessory prayer on heart-surgery recovery), not to whether God exists or what gives life meaning.
  - **Scientism** is the view that {{ only science gives knowledge }}. Its best objection: that claim is itself not a result of any experiment, so by its own standard it is not knowledge (self-reference). A modest version (science is our most reliable method for empirical questions) avoids the problem.
  - **Layers.** That science answers empirical questions by testing and that Hume pointed out the is-ought gap are established; how far science reaches into ethics, meaning and religion is a live debate; whether nature is all there is, is a commitment.
cards:
  - type: mcq
    id: hook
    title: "Three questions, one lab?"
    prompt: |
      Three questions:

      **A.** What is the electric charge of the electron?

      **B.** Is it wrong to lie to a friend to spare their feelings?

      **C.** Why is there something rather than nothing?

      Before any theory: guess. If we gave science unlimited funding and time, for which of these would experiments give the answer?
    options:
      - text: 'All three: given enough time, science answers everything.'
        feedback: |
          This is the confident view called *scientism* (glossed below), and it is held by some thoughtful people. But look at B: even if we measured every effect of lying on every friend, we would still have to decide which effects matter and how much. The lesson examines whether that decision is itself a measurement.
      - text: 'Only A: measurement settles it; B and C need other tools.'
        correct: true
      - text: 'None: science only describes, it never settles anything.'
        feedback: |
          Too pessimistic. The electron's charge is known to extreme precision; an experiment settled it. Science does settle empirical questions.
    explanation: |
      Question A is **empirical**: observation can decide it. B asks what we *ought* to do, and C asks about the deepest nature of reality. Whether science has anything to say about B and C is exactly what thoughtful people debate. This lesson draws the map, without saying who is right.

  - type: text
    id: kinds
    title: "Three kinds of question"
    body: |
      A useful first sort, used by many philosophers:

      - **Empirical** questions ask *what is the case* and can in principle be checked by observation or experiment (the electron's charge, the age of the universe, whether a drug works).
      - **Normative** questions ask *what ought to be* (is lying wrong? what is a just law?). *Normative* just means "about norms, values, oughts".
      - **Metaphysical** questions ask about the deepest nature of what exists (why is there something rather than nothing? is there a mind apart from the brain?). *Metaphysics* means the study of what reality is like at the most general level.

      According to most philosophers, science is excellent at the first kind. Whether it can answer the other two, or only feed them, is the topic of this lesson. The kinds also blur: "when did the universe begin?" is empirical, "why is there a universe?" is metaphysical.

  - type: mcq
    id: kinds-check
    title: "Which kind?"
    prompt: |
      Take the question "Is it morally acceptable to eat animals?" Which kind of question is its **core**, and what can science contribute?
    options:
      - text: 'Normative at its core; science contributes facts (animal pain, health, environment) that bear on it.'
        correct: true
      - text: 'Empirical: a big enough study of animals would settle it.'
        feedback: |
          A study can tell us what animals feel, and that is empirical and relevant. But "so how much should their pain count against our taste?" asks what *ought* to weigh, which a measurement does not provide.
      - text: 'Metaphysical: it depends on what reality is ultimately like.'
        feedback: |
          Some views connect ethics to metaphysics (for example, a religion where souls move between bodies). But the question as asked is about values, so it is normative at its core.
    explanation: |
      The usual picture: science supplies **inputs** (facts) to a normative question, not the verdict. Whether it could supply the verdict is the is-ought debate a few cards below.

  - type: text
    id: naturalism
    title: "Two naturalisms"
    body: |
      *Naturalism* is the stance that nature is the arena of explanation. It comes in two very different strengths, and confusing them causes many arguments.

      **Methodological naturalism** (a rule of the method): in doing science, explain using natural causes, laws and tests, and do not put "a supernatural agent did it" into an explanation. A defender, such as many scientists who are believers, says: "This is a rule of the game because a supernatural appeal cannot be tested or predict anything. It says nothing on whether God exists."

      **Metaphysical** (or *philosophical*) **naturalism** (a claim about reality): nature, the physical world and its laws, is all there is. A defender says: "Everything we have ever found has a natural explanation, so I conclude nothing else exists."

      The believer's best objection to the second: this is a worldview, not an experimental result, because the method cannot find what it was told not to look for. The naturalist's best reply: the track record of natural explanations is itself the evidence. Both views are taken seriously in the scholarly literature.

  - type: mcq
    id: naturalism-check
    title: "Which naturalism?"
    prompt: |
      A cancer researcher explains a tumour only by cells, genes and chemistry in her lab, and on Sundays she prays in her church. A colleague says: "Her work is science, but she is inconsistent." Which reply is fair?
    options:
      - text: 'She is consistent: her lab practice follows methodological naturalism, which makes no claim about what exists outside the method.'
        correct: true
      - text: 'He is right: using natural explanations commits you to metaphysical naturalism.'
        feedback: |
          That is the slide from method to worldview. A rule of method ("explain naturally, test") does not by itself say that nothing else exists, just as a detective who works only from physical clues has not declared that there are no motives.
      - text: 'She is inconsistent only if she prays for the tumour patients.'
        feedback: |
          Praying for patients is a separate matter; it is a religious act, and the lesson will look at what science can say about the *claim* that prayer cures. It does not by itself clash with using natural methods in the lab.
    explanation: |
      Mixing the two is a common slip, in both directions: some atheists claim science proves metaphysical naturalism, and some believers claim methodological naturalism is atheism in disguise. Each overreads the method.

  - type: text
    id: noma
    title: "Gould's NOMA, and a critique"
    body: |
      Stephen Jay Gould (1941-2002), a palaeontologist, argued in 1997 (and in the book *Rocks of Ages*, 1999) that science and religion each have a *magisterium*, a domain of teaching authority, and that the two **do not overlap**: this is **NOMA**, "non-overlapping magisteria".

      - **Science**: the empirical realm, what the universe is made of and how it works.
      - **Religion**: questions of ultimate meaning and moral value.

      The appeal: peace between two powerful fields. The standard critique (made by both believers and non-believers): *religions often make factual claims*, such as an event in history, the age of the Earth, a healing, a life after death. If those claims are part of religion, the magisteria overlap, and science and history can say something about them. Defenders reply that these claims are in the "meaning" part of religion in many traditions, often read symbolically.

  - type: mcq
    id: noma-check
    title: "Does NOMA hold?"
    prompt: |
      A tradition teaches that the Earth is 6,000 years old, as a literal fact. According to critics of NOMA, what follows?
    options:
      - text: 'The claim is about the physical world, so it falls in the empirical domain, and geology can test it. NOMA fails for such claims.'
        correct: true
      - text: 'Science must stay silent, because religion has authority over its own teachings.'
        feedback: |
          That is a stronger NOMA than Gould's. His magisteria are *non-overlapping* because they ask different questions; once a religion asserts a physical fact, it has entered the empirical domain.
      - text: 'The claim is meaningless, since all religious claims are meaningless.'
        feedback: |
          Not so: a literal age of the Earth is a perfectly clear, testable claim (and tests say it is about 4.5 billion years). Many religious people, in this and other traditions, read the same texts as not meant to teach geology; that is the NOMA-friendly reading.
    explanation: |
      Two views side by side: **(1)** the NOMA reading, in which the text teaches meaning and not geology; **(2)** the literal reading, which makes a testable claim and then loses to the evidence. Which reading is right for a given text is a question for that tradition's own scholars, not for this lesson.

  - type: text
    id: hume
    title: "Hume's is-ought gap"
    body: |
      Can facts alone ever give a value? David Hume (1711-1776) noticed, in his *Treatise of Human Nature* (1739, Book 3, Part 1, Section 1), that writers on morals often begin with statements of what *is* (God exists, people do this) and then, without warning, switch to what *ought* to be. He asked for an explanation of how the new "ought" follows from the old "is".

      The pattern, in plain logic:

      - P1. Lying causes people distress. (*fact*)
      - P2. Lying is common in business. (*fact*)
      - C. Therefore we ought not to lie. (*value*)

      The conclusion adds something new, a value, that is not in the premises. Add the premise "We ought not to cause people distress" and the argument becomes valid, but that premise is itself an "ought". The gap: **facts alone do not entail values**. A value premise is needed. Some philosophers accept the gap; others try to close it with facts about wellbeing, though a critic replies that "wellbeing matters" is again a value.

  - type: mcq
    id: hume-check
    title: "Spot the hidden premise"
    prompt: |
      An argument: "Studies show that regular exercise extends lifespan. Therefore people ought to exercise." According to Hume's gap, what is missing for the argument to be valid?
    options:
      - text: 'A value premise, such as "people ought to do what extends their lifespan".'
        correct: true
      - text: 'Another study showing the same effect, to make the facts certain.'
        feedback: |
          More facts, however certain, are still facts: facts alone do not entail an ought. The gap is about kind, not about how many facts we have.
      - text: 'Nothing: the conclusion is a fact about health, not a value.'
        feedback: |
          "People ought to exercise" is an ought-statement. Even "exercise is good for you" hides the value that lifespan or health is what matters (someone may rank enjoyment of a short life higher).
    explanation: |
      This does not make ethics arbitrary. It says that the *value premise* must be argued for in its own right. Where thoughtful people part ways: whether that premise is a fact about human nature, a shared decision, a divine command, or something else. Different views, same gap.

  - type: mcq
    id: religious-claims
    title: "What can science say about religious claims?"
    prompt: |
      Which of these claims **can** be examined by empirical methods? Select all that apply.
    multiple: true
    options:
      - text: 'Praying for strangers in hospital speeds their recovery from heart surgery (tested in the 2006 STEP trial of 1,802 patients, which found no benefit).'
        correct: true
      - text: 'The universe is about 13.8 billion years old (13.787 +/- 0.020 billion years from the Planck satellite, in the standard cosmological model).'
        correct: true
      - text: 'A specific historical event, such as the existence of a certain city, happened (archaeology and texts can bear on it).'
        correct: true
      - text: 'Life has a purpose given by God.'
        feedback: |
          According to believers this is true, according to non-believers false, and no experiment is known that would distinguish them. It is a meaning-and-metaphysics claim, outside the empirical method.
      - text: 'It is a moral duty to help the poor.'
        feedback: |
          Normative: facts about poverty bear on how to help, but the "duty" is a value premise (Hume's gap).
    explanation: |
      Science speaks to **testable** religious claims (healing, ages, history), and the results can surprise either side. It does not by itself settle ultimate purpose or moral duty. Note the STEP trial tested one narrow claim (intercessory prayer, by strangers, in a hospital setting); many believers say prayer was never meant to work as a treatment, a second view of what prayer is for.

  - type: mcq
    id: method-limits
    title: "Limits of the method itself"
    prompt: |
      Why can no experiment, even in principle, settle every question about the very first moment of the universe? Select all that apply.
    multiple: true
    options:
      - text: 'We cannot repeat the event or vary its conditions, so we infer from present evidence.'
        correct: true
      - text: 'Some conditions may lie beyond what any instrument can observe, so models of them stay unconfirmed.'
        correct: true
      - text: 'It would be unethical to run the experiment.'
        feedback: |
          Ethics limits many experiments on people (we cannot assign people to smoke for decades), but it is not why we cannot test the beginning of the universe. Keep the two kinds of limit separate: practical or ethical, versus in principle.
      - text: 'Because the beginning is a supernatural event, science forbids studying it.'
        feedback: |
          Science does not forbid studying it; cosmologists model the early universe actively. The method's limit is evidence, not a ban.
    explanation: |
      Three kinds of limit are worth separating: **evidence** (unrepeatable or unobservable things are inferred, not tested directly), **ethics** (we do not run some experiments on people), and **scope** (empirical methods do not settle values or ultimate meaning). The first two can sometimes be softened by better instruments and designs; the third is what the debate about scientism is about.

  - type: text
    id: scientism
    title: "Scientism, and its self-referential objection"
    body: |
      **Scientism** is the view that science is the *only* source of real knowledge. Its best defenders say: "Science has the best track record of any method for finding out how the world works; claims that avoid its tests usually turn out to be wishful or untestable. I will believe only what can be tested."

      The best objection is **self-referential** (the claim applies to itself): the sentence "only what science can test is knowledge" is not a scientific result, and no experiment could test it. By its own standard it would not be knowledge.

      Possible replies: a **modest** form ("science is our most reliable method for *empirical* questions, and we should be cautious about claims that cannot be tested") avoids the problem, and does not say other fields give no knowledge. Many scholars separate this modest view (widely accepted) from the strong one (widely debated).

  - type: mcq
    id: scientism-check
    title: "Is it self-defeating?"
    prompt: |
      Strong scientism says: "Only claims confirmed by scientific methods count as knowledge." According to the self-reference objection, which is the problem?
    options:
      - text: 'The statement is not itself confirmed by scientific methods, so by its own rule it is not knowledge.'
        correct: true
      - text: 'Science has made mistakes in the past, so we cannot trust it.'
        feedback: |
          That is a different objection (fallibility), and it applies to every method. The self-reference objection is about whether the thesis meets its own standard.
      - text: 'Scientists are often religious, so scientism is false.'
        feedback: |
          How many scientists hold a religious view says nothing about whether the thesis is consistent with itself. It is a fact about people, not an argument against the thesis.
    explanation: |
      A fair reading: this objection refutes the *strong* thesis, not the claim that science is a reliable method. A defender may reply that the thesis is a *proposal* adopted because it works, and a critic that adopting it needs reasons beyond "it works" for the empirical questions it was built on.

  - type: mcq
    id: lenses
    title: "Which lens leads?"
    prompt: |
      Match each question to the lens that leads on it (science, philosophy, theology), allowing that the others can contribute. Select the statements that are **fair**.
    multiple: true
    options:
      - text: 'How old is the Earth? Science leads (radiometric dating, geology).'
        correct: true
      - text: 'Is lying ever justified? Philosophy leads (ethical theories, arguments), with science supplying facts about effects.'
        correct: true
      - text: 'What does a particular tradition teach about the afterlife? Theology leads (the tradition''s texts and its interpreters).'
        correct: true
      - text: 'Why is there something rather than nothing? Science leads, since cosmology studies the beginning.'
        feedback: |
          Cosmology studies how the universe evolved from its early state; "why is there anything at all" asks why the laws and matter exist in the first place. Many philosophers call it metaphysics. Some physicists argue physics can say more, and others deny that; it is a live debate, not a lab result.
      - text: 'Which religion is true? Science leads, by counting miracles.'
        feedback: |
          Science can test specific testable claims (a healing, an age), but "which religion is true" bundles history, philosophy and faith commitments; no single measurement decides it.
    explanation: |
      The lenses are tools, not rivals: each is best at some questions. Disagreements between people usually trace to a **premise**, a **value** or a **kind of evidence** they accept. Naming which one is often the most useful step.

  - type: mcq
    id: traps
    title: "Which statements are mistaken?"
    prompt: |
      Select the statements that **mix up** what the method can do. (Several may apply.)
    multiple: true
    options:
      - text: '"Science has shown that nothing supernatural exists."'
        correct: true
        feedback: |
          Methodological naturalism leaves supernatural claims aside; it cannot, from its own rules, conclude they are false. Specific supernatural *claims* with testable effects can be tested.
      - text: '"Religion says nothing true about the physical world, by definition."'
        correct: true
        feedback: |
          Many traditions make factual claims (about history, healing, the world's origin). Whether any are true is another matter, but they cannot be excluded by definition (the critique of NOMA).
      - text: '"The lab found the cause of the pain, so we know what we ought to do about it."'
        correct: true
        feedback: |
          Facts about causes do not give the ought; a value premise (relieve pain? at what cost?) is needed.
      - text: '"Science cannot test whether prayer has measurable effects on recovery."'
        feedback: |
          It can: that is what trials such as STEP did. They tested a narrow, measurable claim.
    explanation: |
      Three slips in one card: reading the method as a worldview, defining religion into silence, and sliding from is to ought. The fourth statement is the opposite slip, thinking science cannot test anything religious. Both directions occur in practice.

  - type: mcq
    id: layers
    title: "Layers"
    prompt: |
      Classify: "Science, by its own methods, will eventually explain everything, including values and meaning." Which layer is this?
    options:
      - text: 'A faith or metaphysical commitment (layer 3): the track record is evidence, but the claim reaches beyond it.'
        correct: true
      - text: 'Established fact (layer 1): science has already explained most things.'
        feedback: |
          "Has explained a great deal of the empirical world" is established; "will explain everything, including values" is a prediction about questions whose type is exactly what is in dispute.
      - text: 'Settled scholarly consensus (layer 2): philosophers agree on it.'
        feedback: |
          Philosophers do not agree on it: the is-ought gap, the self-reference objection and NOMA are live debates.
    explanation: |
      The same sentence can be held with reasons (the success of science) and still be a commitment. Calling it that is not an insult; it just keeps the layers apart. A believer who says "God exists" is, equally, stating a commitment, supported by whatever reasons they find compelling.

  - type: text
    id: summary
    body: |
      **Next:** the traps round and quick recall for this level, then the content map. After that the course asks what reality is made of (matter, mind, or both), carrying one tool from here: ask what kind of question, and what kind of evidence, each claim needs.
