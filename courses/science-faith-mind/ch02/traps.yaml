id: ch02-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: how science, evidence and method go wrong"
    body: |
      Fast round. Each question hides a **tempting shortcut** about how science works: how it learns from experience, how it tests, how it weighs evidence, what it can and cannot settle. Every shortcut is a *useful idea turned too far*, and each can catch a scientist, a believer and a skeptic alike.

      Nothing here asks whether any religion is true. As always, answers are given *according to* someone (Hume, Popper, Kuhn, Bayes' rule, a realist, an instrumentalist...), and where thoughtful people differ the feedback shows both views.

  - type: mcq
    id: sun-certain
    title: "Five thousand sunrises"
    prompt: |
      Someone argues: "The Sun has risen every day for about 5000 years of recorded history, so it is *certain* to rise tomorrow." According to Hume (1711-1776), what is wrong with the word "certain"?
    options:
      - text: The past record makes tomorrow's sunrise very probable, but the step from "so far" to "always" is not deductively guaranteed; assuming nature stays uniform is itself something the past record cannot prove without going in a circle.
        correct: true
      - text: Nothing is wrong; 5000 years of evidence is enough for certainty.
        feedback: |
          Any finite record is compatible with a change tomorrow (a chicken fed every day for a year learns the farmer's pattern, until the day it is not fed). Many sunrises make the next one very probable; they do not logically entail it.
      - text: The record tells us nothing at all about tomorrow, so we should not expect the Sun to rise.
        feedback: |
          Hume's point is about *justification*, not about what to expect. Even Hume said we cannot help expecting regularity. The slip is jumping from "not certain" to "no reason", when high probability is exactly what such a record is good for (Laplace's rule gives odds of about 1.8 million to 1).
      - text: The problem is only that earlier people measured badly.
        feedback: |
          Measurement quality is not the issue. Even perfect records of the past leave the "will the future resemble the past?" question open.
    explanation: |
      The trap is mixing up **certainty** with **high probability**. Induction (reasoning from observed cases to unobserved ones) can make a conclusion very likely; it cannot make it logically certain. Replies to Hume (Popper's bypass, Reichenbach's vindication, probabilistic reshaping, naturalised explanation) each accept this and answer differently.

  - type: mcq
    id: failed-prediction
    title: "The prediction failed"
    prompt: |
      A theory $T$ together with some background assumptions $A$ (instruments work, nothing else interferes) predicts a result $O$. The experiment shows not-$O$. A student concludes: "So $T$ is refuted." What is the gap, according to Duhem (1861-1916)?
    options:
      - text: The logic only shows that the *conjunction* of $T$ and $A$ fails. Either $T$ or some auxiliary assumption in $A$ could be the culprit, so more work is needed to say which.
        correct: true
      - text: There is no gap; a failed prediction always refutes the theory alone.
        feedback: |
          Modus tollens applies to "$(T \wedge A) \Rightarrow O$", so it refutes the *pair*. Uranus's orbit failed Newtonian predictions in the 1840s, and the culprit was an unseen planet (Neptune, 1846), not Newton. Mercury's orbit also failed them, and there the culprit proved to be the theory.
      - text: A failed prediction can never count against a theory.
        feedback: |
          Too far. A failure is real evidence against the conjunction and often against $T$ itself; the lesson is that it does not point *automatically* at $T$. Scientists weigh how well the auxiliaries are independently supported.
      - text: Predictions only matter if they succeed.
        feedback: |
          Failures are informative, which is why Popper stressed risky predictions. The care needed is in *assigning* the blame, not in ignoring the failure.
    explanation: |
      Falsification is logically valid (if $T \Rightarrow O$ and not-$O$, then not-$T$), but real tests have **auxiliary assumptions**, so the valid inference lands on a bundle. Rescuing a theory by changing the auxiliaries is sometimes good science (Neptune) and sometimes ad hoc (see the pseudoscience trap below).

  - type: mcq
    id: many-confirmations
    title: "It keeps working"
    prompt: |
      A theory $T$ predicts $O$, and $O$ is observed again and again. A student reasons: "$T \Rightarrow O$, and $O$ is true, so $T$ is proved." What is this pattern called, and why does it fail?
    options:
      - text: Affirming the consequent. Other theories could predict the same $O$, so observing $O$ does not rule them out; confirmations raise the probability of $T$ without proving it.
        correct: true
      - text: Modus tollens, and it is valid, so $T$ is proved.
        feedback: |
          Modus tollens runs from not-$O$ to not-$T$. Here the reasoning runs from $O$ to $T$, the wrong direction.
      - text: It fails because repeated observations never count as evidence.
        feedback: |
          They do count: if $T$ makes $O$ more likely than its rivals do, each success raises the probability of $T$ (Bayes' rule). They just cannot take it to certainty.
      - text: It does not fail; science works by proving theories.
        feedback: |
          Popper and Bayesians agree here: theories are never proved by data, only corroborated (they survive tests) or made more probable. Newtonian mechanics was confirmed for 200 years and still turned out to be an approximation.
    explanation: |
      "$T \Rightarrow O$; $O$; so $T$" is the fallacy of **affirming the consequent**. Strong confirmation, especially of *surprising* predictions, can still make a theory highly credible; the trap is calling it proof.

  - type: mcq
    id: kuhn-irrational
    title: "Revolutions"
    prompt: |
      A reader of Kuhn (1922-1996) says: "Kuhn showed that scientists switch paradigms like fashions, so science is just opinion and one view is as good as another." Which reply is fairest to Kuhn?
    options:
      - text: Kuhn described changes of paradigm as involving more than logic alone, but he also named shared values (accuracy, scope, simplicity, consistency, fruitfulness) that guide choice; he denied that science is arbitrary. Critics such as Popper and Lakatos still argued he made rational progress too hard to defend.
        correct: true
      - text: Kuhn did say science is irrational and arbitrary.
        feedback: |
          Kuhn explicitly rejected that reading in later work. He argued that scientists choose using values that are good reasons, even though the values can pull in different directions and do not fix a single answer by rule.
      - text: Kuhn said science is perfectly rational, with a mechanical rule that always picks the winner.
        feedback: |
          Also not Kuhn. He held that no neutral algorithm settles paradigm choice, which is exactly why critics worried about relativism.
      - text: Kuhn said paradigms only change when old scientists die, with no role for evidence.
        feedback: |
          Evidence matters: anomalies (results the paradigm cannot absorb, like Mercury's orbit, about 43 arcseconds per century off the Newtonian value) build up and create a crisis. The generational remark is a sociological comment, not his whole account.
    explanation: |
      Two views of the same history: (1) Kuhn's: rational choice is guided by values but not fixed by rules; (2) the critics': this leaves too little to explain progress. Neither says "opinion". Steelman both before taking a side.

  - type: numeric
    id: bayes-base-rate
    title: "A 90% accurate test"
    prompt: |
      A condition affects 1 person in 100. A test detects it in 90% of people who have it, and wrongly flags 9% of people who do not. Imagine 1000 people: 10 have the condition and 9 of them test positive, while about 89 of the 990 healthy people also test positive. A student says, "The test is 90% accurate, so a positive result means a 90% chance of having it." Out of all who test positive, what **percentage** really have the condition? (Give one decimal.)
    answer: 9.2
    tolerance: 0.3
    answerText: '9.2 (that is 9 out of 98)'
    wrong:
      - { value: 90, feedback: "This confuses P(positive | sick) = 90% with P(sick | positive). The second depends on how common the condition is (the prior), not only on the test's hit rate." }
      - { value: 50, feedback: "Splitting 50-50 ignores the counts. Among the 98 positives, 89 are healthy people and only 9 are sick." }
    hint: "Count the positives: true positives plus false positives. Then take the fraction that are sick."
    explanation: |
      Positives: $9 + 89 = 98$, of which 9 are sick, so the chance is $9/98 \approx 9.2\%$. In Bayes' rule terms: prior odds $1:99$ times likelihood ratio $0.9/0.09 = 10$ gives odds $10:99$. The trap is the **base-rate fallacy**: forgetting the prior. A rare condition with a good test still yields mostly false alarms.

  - type: mcq
    id: lr-one
    title: "It was predicted"
    prompt: |
      A hypothesis $H$ has prior probability 10%. It predicted a result $E$, and $E$ happens. But the rival hypothesis $\neg H$ (not-$H$) predicted $E$ just as strongly, so $P(E\mid H)/P(E\mid \neg H) = 1$. A student says: "$H$ predicted it and it came true, so $H$ must now be more likely." What does Bayes' rule say?
    options:
      - text: The probability of $H$ stays at 10%. Evidence supports $H$ only when it is *more expected* under $H$ than under its rivals (likelihood ratio above 1).
        correct: true
      - text: The probability of $H$ rises, because a correct prediction always helps.
        feedback: |
          Odds after = likelihood ratio times odds before. With ratio 1 the odds do not move. A "safe" prediction that every rival also makes tests nothing.
      - text: The probability of $H$ drops, since a ratio of 1 means the evidence is neutral against it.
        feedback: |
          Neutral evidence leaves things where they were; it does not reduce them. A drop would need a ratio below 1.
      - text: The probability becomes 100%, because the prediction was right.
        feedback: |
          Even a strong ratio never gives certainty from a prior strictly between 0 and 1.
    explanation: |
      Bayes' rule in odds form: posterior odds = likelihood ratio $\times$ prior odds. What helps is **discrimination**, a result the hypothesis expected and the rivals did not. A bold, risky prediction (Eddington's 1919 eclipse) has a large ratio; a safe one has ratio near 1.

  - type: mcq
    id: old-evidence
    title: "We knew it already"
    prompt: |
      Mercury's orbit (an extra advance, later refined to about 43 arcseconds per century) was known from 1859. General relativity (1915) explained it. A critic says: "Old evidence cannot confirm anything, because its probability was already 1 before the theory." According to defenders of Bayesian confirmation, what is the best reply?
    options:
      - text: Ask what we would have believed *without* the theory, or how well the theory explains the fact. Mercury's anomaly was unexplained before 1915 and the theory delivered it with no adjustable knob, which is why scientists counted it as strong support.
        correct: true
      - text: The critic is right, so Mercury gave general relativity no support.
        feedback: |
          The physics community counted it as real support. The critic points to a genuine puzzle for simple Bayesianism (Glymour 1980), not a proof that old evidence is worthless.
      - text: Old evidence is stronger than new evidence, always.
        feedback: |
          Neither is automatically stronger. What matters is how much the theory's likelihood for the evidence exceeds its rivals', plus whether the fit was forced or fitted afterwards.
      - text: Dates never matter in science.
        feedback: |
          Timing can matter in a different way: a fit built *after* seeing the data (tuning knobs to match) is weaker than a prediction that came out of the theory unforced.
    explanation: |
      The **problem of old evidence** is real, and there are two common replies: the counterfactual-prior reply (remove the evidence from our background and ask what we would then think) and the explanatory-fit reply (the theory *unified* a known fact). Both are live; neither makes old evidence useless.

  - type: mcq
    id: equally-true
    title: "Two theories, one dataset"
    prompt: |
      Two different theories fit all the data collected so far equally well. A student concludes: "Then they are equally true, and choosing between them is pure taste." What is the more careful position?
    options:
      - text: Fitting the same data so far does not make theories equally *supported*. They may differ on new data, in simplicity, in fit with other well-supported theories, or in how much they explain. Whether those features track truth (realist) or are only convenient (instrumentalist, or van Fraassen) is a live debate.
        correct: true
      - text: Equal fit means equal truth, always, so the student is right.
        feedback: |
          Underdetermination (Duhem, Quine) says data may not *force* a single theory. It does not say all fitting theories are equally good: a complicated curve through five points can fit them perfectly and fail on the next point (overfitting).
      - text: One of the two must be false and the other true, which the data already reveal.
        feedback: |
          The data so far do not reveal it. Both may be false, or both approximately true. That is why further tests and extra criteria matter.
      - text: Only the simpler theory can ever be true.
        feedback: |
          Simplicity is a useful guide, but whether nature itself is simple is a further assumption. Realists often treat simplicity as a sign of truth; others treat it as a convenience.
    explanation: |
      Same data, different support: keep apart (1) fit to data in hand, (2) prediction of new data, (3) extra virtues such as simplicity and unification. Underdetermination is a reason for humility, not for "anything goes".

  - type: mcq
    id: success-true
    title: "It works, so it is true"
    prompt: |
      A realist (such as Putnam, 1975) argues: "Science's success would be a miracle if theories were not approximately true." Laudan (1981) replies with the pessimistic meta-induction. What is the best statement of the dispute?
    options:
      - text: The realist reads success as best explained by truth. Laudan lists once-successful theories now rejected (caloric, phlogiston, the ether) and asks why today's should be different. Structural realists answer that the *structure* (such as Fresnel's equations) survived; anti-realists say the record still counsels caution.
        correct: true
      - text: Success proves a theory is exactly true, and Laudan's list is irrelevant.
        feedback: |
          Success is evidence, not proof, and the list matters: the caloric theory predicted real heat phenomena and is now rejected as a description of what heat is.
      - text: Laudan showed that successful theories are never true.
        feedback: |
          Laudan only argued that success has not reliably tracked truth in the past, so inferring truth from success is shaky. He did not claim success is evidence of falsity.
      - text: Realism and instrumentalism disagree about whether the experiments work.
        feedback: |
          Both agree the experiments work. They disagree about what that *means*: that the theory describes unobservable reality, or only that it predicts observables well.
    explanation: |
      Two views: (1) the no-miracles argument: truth explains success; (2) the pessimistic induction: past successes were later rejected. Replies in between: structural realism (keep the structure), and Hacking's entity realism (if you can use electrons to do things, they are real).

  - type: mcq
    id: instrumentalist-denies
    title: "Is it all in the mind?"
    prompt: |
      A student says: "An instrumentalist thinks the world does not really exist; theories are just stories." Is that fair to instrumentalists and to constructive empiricists such as van Fraassen (b. 1941)?
    options:
      - text: No. They accept that an observable world exists. They differ about *unobservable* claims, where for instrumentalists, theories are tools for predicting, and for van Fraassen, the aim is to be empirically adequate (right about observables) while staying agnostic about the unobservable.
        correct: true
      - text: Yes; instrumentalists hold that nothing exists outside our minds.
        feedback: |
          That describes idealism, a different position. Instrumentalism is about the *status of theories*, not about whether tables, planets or people exist.
      - text: Yes; they deny that theories can predict anything.
        feedback: |
          They emphasise prediction: it is what they say theories are for.
      - text: No; they believe every unobservable claim is true.
        feedback: |
          That would be a strong realism. They hold back belief about unobservables.
    explanation: |
      Steelmanning: the anti-realist's caution applies to electrons and quarks, not to chairs. A realist replies that the line between "observable" and "unobservable" is not sharp (microscopes, telescopes). That is the debate.

  - type: mcq
    id: unproven-pseudo
    title: "Rejected, so pseudoscience?"
    prompt: |
      In 1912 Wegener proposed that continents drift. Many geologists rejected it for decades, and later it was confirmed (plate tectonics). A student says: "If most experts reject an idea, it is pseudoscience." What does the Wegener case show?
    options:
      - text: Being unproven or unpopular is not the mark of pseudoscience. Marks proposed by Popper and Lakatos concern behaviour, namely whether claims are testable, whether failures are met by honest revision or by ad hoc rescue, whether the programme makes progress, and whether it accepts independent checking. Wegener's idea could be tested and was.
        correct: true
      - text: It shows experts are always wrong when they reject an idea.
        feedback: |
          No. Most rejected ideas stay rejected. The case shows only that rejection does not by itself classify an idea.
      - text: It shows continental drift was pseudoscience until it was confirmed.
        feedback: |
          The idea was testable all along. What it lacked at first was a convincing mechanism and data, which is ordinary scientific incompleteness.
      - text: It shows there is no difference between science and pseudoscience.
        feedback: |
          Laudan (1983) argued the label is hard to define sharply, but most philosophers keep a cluster of marks and use it as a matter of degree.
    explanation: |
      The marks (unfalsifiable, ad hoc rescue, no progress, no independent checking) work as a **cluster**, not a vote. Even Laudan's proposal to drop the word is a view about whether *one* sharp criterion exists.

  - type: mcq
    id: homeopathy-untestable
    title: "Untestable?"
    prompt: |
      Homeopathy (founded by Hahnemann, 1755-1843) holds that extreme dilutions of a substance can treat illness; at "30C" a pill is diluted $100^{30} = 10^{60}$ times, so typically not one molecule of the original substance remains. A student says: "Homeopathy is pseudoscience because it is untestable." What is the more accurate statement?
    options:
      - text: Its claims were testable and were tested (for example with double-blind trials), and reviews found no effect beyond placebo. The criticism is that the mechanism clashes with well-supported chemistry and that supporters often rescued it ad hoc after failed tests, not that it cannot be tested.
        correct: true
      - text: It is untestable, so nothing can be said about it.
        feedback: |
          The claim "this pill treats this illness better than a placebo" is exactly the kind of claim a double-blind trial can test, and many have.
      - text: Trials proved that homeopathy cannot ever work.
        feedback: |
          Trials show no detectable effect beyond placebo; "cannot ever work" goes beyond that. The case against it also rests on the very low prior from chemistry (no molecules left), which a Bayesian combines with the trial results.
      - text: Tests do not matter because patients report feeling better.
        feedback: |
          Feeling better is real, but it also happens with a placebo and with natural recovery, so the trial compares against both.
    explanation: |
      A claim can be falsifiable and still wrong. The label "untestable" would let homeopathy off too lightly: it made testable claims and **failed** them. The sharper charge is the ad hoc rescue after failure.

  - type: mcq
    id: naturalism-atheism
    title: "Method or worldview?"
    prompt: |
      A student says: "Scientists only look for natural causes in their work, so every scientist is committed to atheism." Which distinction answers this?
    options:
      - text: Methodological naturalism (science looks only for natural explanations as a working rule) is different from metaphysical naturalism (nothing exists except nature). Many scientists who are theists accept the first without the second; the second is a worldview that science alone does not establish.
        correct: true
      - text: There is no difference; the two are the same thing.
        feedback: |
          A rule about how to investigate is not a claim about everything that exists. A chess player who only considers legal moves is not claiming that only chess exists.
      - text: Scientists deny that any supernatural being could exist.
        feedback: |
          Some do; many do not. The method does not decide the matter, which is why believing scientists exist across history.
      - text: Methodological naturalism proves that nature is all there is.
        feedback: |
          A method cannot prove its own scope. Critics also ask whether it assumes what it is meant to show; defenders say it is simply the rule that has delivered testable results.
    explanation: |
      Two views on the method itself: (1) it is a pragmatic rule; (2) it is evidence-driven because supernatural explanations have no agreed way of being tested. Whether this closes the door on God is a **metaphysical** question outside the method.

  - type: mcq
    id: is-ought
    title: "Facts to duties"
    prompt: |
      A health agency reports: "Smoking shortens life by about a decade on average." A speaker concludes: "So everyone ought to stop smoking, and science has proved it." According to Hume's is-ought point (*Treatise*, 1739), what is missing?
    options:
      - text: A value premise, such as "we ought to value long life (or health) highly". The facts support the conclusion only together with that value, which science did not measure.
        correct: true
      - text: Nothing is missing; facts alone entail duties.
        feedback: |
          Hume argued that no list of "is" statements entails an "ought" without some "ought" premise. Many people share the value here, which hides the gap.
      - text: The facts are false, so the argument fails.
        feedback: |
          The fact is well established. The gap is in the step to a duty, not in the data.
      - text: Science says nothing about health decisions.
        feedback: |
          Science says a lot: it supplies the facts and the likely effects of each option. It just does not choose which outcomes to prefer. Some philosophers argue the gap can be bridged (naturalistic ethics); that is a live debate.
    explanation: |
      Facts are essential to good choices, and values are essential to making them. A person who values a short, intense life can accept the same fact and choose differently.

  - type: mcq
    id: scientism-proven
    title: "Science says only science is true"
    prompt: |
      A speaker claims: "Only claims that science can verify are true. Science itself has shown this." What is the self-reference problem for strong scientism?
    options:
      - text: The claim "only scientifically verifiable claims are true" is not itself a scientific result, so by its own standard it would be untrue; it is a philosophical thesis. A modest scientism (science is our *best* guide to facts about the world) avoids this problem.
        correct: true
      - text: There is no problem; science has experimentally proved that only science gives truth.
        feedback: |
          No experiment tests that sentence. It is a philosophical position about knowledge, and defending it uses argument, not lab results.
      - text: The problem is that science has been wrong in the past.
        feedback: |
          That is the pessimistic induction, a different (and fair) challenge. The self-reference problem is about the thesis failing its own test.
      - text: Strong scientism is only a problem for believers.
        feedback: |
          It is a logical problem for anyone who holds it, whatever their religion.
    explanation: |
      Scientism comes in strengths: **strong** (only science yields knowledge) faces self-reference; **modest** (science is the most reliable source of factual knowledge) is a defensible bet that still leaves ethics, logic and meaning to other methods.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Three layers of claim: established fact, live scholarly debate, faith or metaphysical commitment. Select **all** statements below that are *live scholarly debate* (neither settled fact nor simply a faith commitment).
    multiple: true
    options:
      - text: Whether successful theories are approximately true (scientific realism).
        correct: true
      - text: Whether the Sun rose on each of the past few days.
        feedback: |
          This is an observed fact, the first layer.
      - text: Whether induction can be justified without circularity.
        correct: true
      - text: Whether a divine reality lies beyond what science can test.
        feedback: |
          This is a metaphysical or faith commitment (the third layer); thoughtful people on both sides hold it as a commitment rather than as the result of an experiment.
      - text: Whether paradigm change is fully rule-governed.
        correct: true
    explanation: |
      **Established fact** (observation, data, history); **scholarly debate** (realism, induction's justification, Kuhn's rationality, the status of simplicity); **faith or metaphysical commitment** (whether nature is all there is). Do not pass one layer off as another, in either direction.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Fourteen traps, one pattern: each turned a *useful* idea into a shortcut.

      - **Many confirmations raise probability, not to certainty**; Hume's gap stays.
      - **A failed prediction hits a bundle** (theory plus auxiliaries); and success does not prove a theory (affirming the consequent).
      - **Kuhn is not "opinion"**: shared values guide choice, though not by rule.
      - **Bayes**: remember the base rate ($9/98 \approx 9.2\%$, not 90%); a prediction every rival makes (ratio 1) changes nothing; old evidence can still count.
      - **Equal fit is not equal support**; success suggests, but does not prove, truth; anti-realists doubt unobservables, not tables.
      - **Pseudoscience is a cluster of behaviours**, not "unpopular" or "unproven"; homeopathy was tested and failed.
      - **Method is not worldview**; **facts need a value premise** for duties; **strong scientism refutes itself**.

      **Next:** *Quick Recall*, the main formulas and distinctions of Level 2 at a glance.
