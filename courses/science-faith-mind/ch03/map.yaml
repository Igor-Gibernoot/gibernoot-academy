outroTitle: Level 3 in one picture
outro: |
  The **question** (which is fundamental, mind or matter?) has four answers: **physicalism** (supervenience, closure, Hempel's dilemma), **idealism** (Berkeley, Kant, Hegel, Kastrup), **dualism** (Descartes, Elisabeth, replies that each drop a premise of Kim's argument) and **panpsychism** (structure versus intrinsic nature, the combination problem). **Emergence** asks whether wholes exceed their parts; **quantum mechanics** and **Bell's theorem** test what any view must give up; the **simulation argument** and **structural realism** ask what is real and what survives theory change. All of it sits in the **three layers** of fact, debate and commitment. Next: the Level Review, then the Level Challenge.
