id: ch03-map
title: "Content Map: Views of Reality"
kind: map
name: Level 3, Views of Reality (physicalism, idealism, dualism, panpsychism, emergence, quantum mechanics, Bell, simulation, structural realism)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 3 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the traps (two premises swapped, a reply given to the wrong view, a probability confused with an amplitude, a theorem stretched too far), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 4
nodes:
  - id: question
    title: The question
    row: 1
    col: 1
    span: 4
    body: |
      Which is **fundamental**, mind or matter, or neither? This is a question about *what exists* (**metaphysics**), not a result of one experiment. Each view below is a way to answer it, and we test them on the same puzzles: how mind depends on brain, what quantum mechanics forces, and what a simulation or a theory change would show.
    decoys:
      - body: |
          Which is **fundamental**, mind or matter, or neither? Science has already **settled** it: brain-mind dependence is established, so physicalism is the experimental result and the other views are refuted. We then test the views on the same puzzles.
        feedback: |
          Dependence of experience on the brain is common ground. Whether it means identity, correlation or something else is the live debate, and "matter is fundamental" is a metaphysical commitment, not a measurement.
      - body: |
          Which is **fundamental**, mind or matter, or neither? Because it is metaphysics, **no argument** can bear on it: every view is equally good, and the puzzles below cannot favour any of them.
        feedback: |
          Metaphysical does not mean arbitrary. Arguments have premises that a critic can reject, and each view pays a visible price on the puzzles (closure, combination, measurement, Newman). That is how views are compared.
    explanation: |
      The root of the level. Each lesson steelmans one answer and names the premise or price where thoughtful people part ways.

  - id: physicalism
    title: Physicalism
    row: 2
    col: 1
    body: |
      According to its defenders, everything is physical or depends on the physical: **supervenience** says worlds alike physically are alike mentally. Support: **causal closure** leaves no work for a separate mind. **Hempel's dilemma**: "physical" means current physics (probably false) or ideal physics (nearly empty).
    decoys:
      - body: |
          According to its defenders, everything is physical or depends on the physical: **supervenience** says worlds alike mentally are alike physically. Support: **causal closure** leaves no work for a separate mind. **Hempel's dilemma**: "physical" means current physics (probably false) or ideal physics (nearly empty).
        feedback: |
          The direction is reversed. Physicalist supervenience is "no mental difference without a physical difference", so the physical fixes the mental. The reversed form is the idealist's.
      - body: |
          According to its defenders, everything is physical or depends on the physical: **supervenience** says worlds alike physically are alike mentally. Support: **causal closure** leaves no work for a separate mind. **Hempel's dilemma** shows "physical" has a clear meaning, so physicalism is **proved**.
        feedback: |
          Hempel's dilemma is a challenge, not a proof: defining "physical" by current physics makes the thesis probably false, and by ideal physics makes it nearly empty. Replies exist, each with a cost.
    explanation: |
      Physicalism is the default against which the other views are measured. Its closure premise is the one dualists and emergentists must answer.

  - id: idealism
    title: Idealism
    row: 2
    col: 2
    body: |
      **Idealism**: mind is fundamental, and matter is made of mind or exists only as it appears to minds. **Berkeley**: *esse est percipi*. **Kant** keeps a world of things in themselves we cannot know. **Hegel**: reality is one rational spirit. **Kastrup**: one universal mind. The unthought tree: God (Berkeley) or would-be experiences (phenomenalism).
    decoys:
      - body: |
          **Idealism**: mind is fundamental, and matter is made of mind or exists only as it appears to minds. **Berkeley**: *esse est percipi*. **Kant** agrees with Berkeley that **no outer world exists**, only ideas in minds. **Hegel**: reality is one rational spirit. **Kastrup**: one universal mind.
        feedback: |
          Kant is not Berkeley. He keeps a world apart from our minds (the thing in itself) and says we know only appearances, shaped by space, time and categories such as cause.
      - body: |
          **Idealism**: mind is fundamental, and matter is made of mind or exists only as it appears to minds. **Berkeley**: *esse est percipi*, so a tree falling with nobody near **makes no difference** and needs no answer. **Kant** keeps things in themselves. **Hegel**: one rational spirit.
        feedback: |
          Berkeley did answer: on the traditional reading God perceives it; the phenomenalist says the tree is the pattern of experiences that would occur if a mind were present. The question is the best test of the view.
    explanation: |
      Idealism is the mirror image of physicalism: the same question, the opposite direction of dependence.

  - id: dualism
    title: Dualism
    row: 2
    col: 3
    body: |
      **Dualism**: mind and matter are two kinds, neither reducible. **Descartes**' doubt proof: P1 I can doubt my body, P2 I cannot doubt that I think, P3 (Leibniz's law) differing things are distinct. **Elisabeth**: how does the unextended move the extended? Each reply drops one of Kim's premises (closure, mental causation, no overdetermination).
    decoys:
      - body: |
          **Dualism**: mind and matter are two kinds, neither reducible. **Descartes**' doubt proof: P1 I can doubt my body, P2 I cannot doubt that I think, P3 (Leibniz's law) differing things are distinct. **Elisabeth**: how does the unextended move the extended? **Epiphenomenalism** drops closure: the mind steers matter through quantum events.
        feedback: |
          Swapped. Interactionism is the reply that rejects closure. Epiphenomenalism rejects mental causation: experience is real but causes nothing.
      - body: |
          **Dualism**: mind and matter are two kinds, neither reducible. **Descartes**' doubt proof: P1 I can doubt my body, P2 I cannot doubt that I think, P3 (Leibniz's law) differing things are distinct. **Elisabeth**: how does the unextended move the extended? Every reply **accepts all** of Kim's premises and shows the conflict is only apparent.
        feedback: |
          The replies work by giving a premise up: interactionism drops closure, epiphenomenalism drops mental causation, parallelism and occasionalism deny direct mind-body causation. That is their price.
    explanation: |
      The interaction problem is the same as the closure argument of physicalism, read from the other side: it asks the dualist which premise to give up.

  - id: panpsychism
    title: Panpsychism
    row: 2
    col: 4
    body: |
      Physics describes **structure and dynamics**; the **intrinsic nature** of matter is left open, and experience may fill it. **Panpsychism**: the simplest things have simple experience. **Neutral monism** (Spinoza, Russell): one stuff, neither mental nor physical. Price: the **combination problem**, how micro-experiences make one unified mind.
    decoys:
      - body: |
          Physics describes **structure and dynamics**; the **intrinsic nature** of matter is left open, and experience may fill it. **Panpsychism**: electrons have **thoughts and feelings** like ours. **Neutral monism** (Spinoza, Russell): one stuff, neither mental nor physical. Price: the **combination problem**.
        feedback: |
          Panpsychists claim only some very simple form of experience in the basic constituents, not thought. Rocks and electrons do not think on this view.
      - body: |
          Physics describes **structure and dynamics**; the **intrinsic nature** of matter is left open, and experience may fill it. **Panpsychism**: the simplest things have simple experience. **Neutral monism** (Spinoza, Russell): the one stuff is **purely mental**. Price: the **combination problem**.
        feedback: |
          That is idealism. In neutral monism the stuff is neither mental nor physical in itself; mind and matter are two aspects or ways of organising it.
    explanation: |
      Panpsychism accepts the hard problem and answers it by changing what matter is, so its cost moves from "how does experience arise?" to "how does it combine?".

  - id: emergence
    title: Emergence
    row: 3
    col: 2
    body: |
      A whole can have what no part has. **Reduction**: the higher-level fact is deducible from the parts, as temperature is average kinetic energy, $\tfrac12 m\langle v^2\rangle=\tfrac32 kT$. **Weak** emergence (Game of Life glider): deducible in principle, found by running. **Strong**: not deducible, with downward causation, so it rejects closure.
    decoys:
      - body: |
          A whole can have what no part has. **Reduction**: the higher-level fact is deducible from the parts, as temperature is average kinetic energy, $\tfrac12 m\langle v^2\rangle=\tfrac32 kT$. **Weak** emergence (Game of Life glider): not deducible even in principle. **Strong**: deducible, but only by running the process.
        feedback: |
          Swapped. Weak emergence follows from the lower-level laws in principle; strong emergence is the one that is not deducible and needs new fundamental laws.
      - body: |
          A whole can have what no part has. **Reduction**: since no single atom has a temperature, temperature is **not reducible** to the motion of atoms. **Weak** emergence (glider): deducible in principle. **Strong**: not deducible, with downward causation.
        feedback: |
          Temperature is the textbook reduction: a property of the ensemble, fully deduced from the parts via $\tfrac12 m\langle v^2\rangle=\tfrac32 kT$. Belonging to the whole is not the same as failing to reduce.
    explanation: |
      Emergence sits between physicalism, which wants reduction or weak emergence, and dualism, which needs more. The strong version rejects closure, and the panpsychist replies that nothing needs to emerge.

  - id: quantum
    title: Quantum mechanics
    row: 3
    col: 4
    body: |
      State $a|{\uparrow}\rangle+b|{\downarrow}\rangle$; **Born rule**: $P(\uparrow)=|a|^2$ (amplitudes $0.6, 0.8$ give $0.36, 0.64$). The **measurement problem**: smooth evolution versus one outcome. Four views, same predictions: **Copenhagen** (a tool, device/system line), **many worlds** (probability), **pilot wave** (nonlocality), **QBism** (state = beliefs).
    decoys:
      - body: |
          State $a|{\uparrow}\rangle+b|{\downarrow}\rangle$; **Born rule**: $P(\uparrow)=a$ (amplitudes $0.6, 0.8$ give $0.6, 0.8$). The **measurement problem**: smooth evolution versus one outcome. Four views, same predictions: **Copenhagen**, **many worlds**, **pilot wave**, **QBism**.
        feedback: |
          The probability is the squared size of the amplitude. Amplitudes 0.6 and 0.8 give $0.36$ and $0.64$, which add to 1; the amplitudes themselves do not.
      - body: |
          State $a|{\uparrow}\rangle+b|{\downarrow}\rangle$; **Born rule**: $P(\uparrow)=|a|^2$ (amplitudes $0.6, 0.8$ give $0.36, 0.64$). The **measurement problem** is that the predictions **fail**. Four views, each with **different predictions**: Copenhagen, many worlds, pilot wave, QBism.
        feedback: |
          The predictions are excellent, and the standard views agree on them. The problem is what the state is and what happens at a measurement, so the views are separated by price, not by data.
    explanation: |
      Quantum mechanics is where the views of reality meet an experiment. It does not by itself prove free will, a soul, or that consciousness creates reality.

  - id: bell
    title: Bell's theorem
    row: 4
    col: 3
    body: |
      With settings $a,a'$ and $b,b'$, $S=E(a,b)-E(a,b')+E(a',b)+E(a',b')$. Any **local** sheet of hidden values $\pm1$ obeys $|S|\le 2$; the singlet gives $|S|=2\sqrt2\approx2.83$, and experiments confirm it. At least one assumption goes: **locality**, hidden values, **free choice**, one outcome.
    decoys:
      - body: |
          With settings $a,a'$ and $b,b'$, $S=E(a,b)-E(a,b')+E(a',b)+E(a',b')$. Any **local** sheet of hidden values $\pm1$ obeys $|S|\le 2$; the singlet gives $|S|=2\sqrt2\approx2.83$. This proves that **signals travel faster than light**, so relativity fails.
        feedback: |
          Entanglement cannot be used to send a message: each side's results look random alone. Bell rules out a family of local explanations; it does not show signalling.
      - body: |
          With settings $a,a'$ and $b,b'$, $S=E(a,b)-E(a,b')+E(a',b)+E(a',b')$. Any **local** sheet of hidden values $\pm1$ obeys $|S|\le 2\sqrt2$; the singlet gives $|S|=2$, and experiments confirm it. At least one assumption goes.
        feedback: |
          Swapped. $2$ is the bound for local hidden values, and $2\sqrt2$ is the quantum maximum. Experiments exceeded 2, which is what makes the result matter.
    explanation: |
      Bell turns the quantum question into a test: any view must drop locality, hidden values, free choice or unique outcomes. Pilot wave drops locality, many worlds the single outcome.

  - id: simulation
    title: The simulation argument
    row: 5
    col: 3
    body: |
      According to **Bostrom** (2003), one of three holds: (1) almost no civilizations reach the posthuman stage, (2) almost none of those are interested in simulating, (3) we are almost certainly simulated. With $X=f_Pf_IN_I$, $f_{\text{sim}}=X/(X+1)$, so $X=10^4$ gives $0.9999$. It rests on substrate independence, computing power and bland indifference.
    decoys:
      - body: |
          According to **Bostrom** (2003), we are **almost certainly** simulated. With $X=f_Pf_IN_I$, $f_{\text{sim}}=X/(X+1)$, so $X=10^4$ gives $0.9999$. It rests on substrate independence, computing power and bland indifference.
        feedback: |
          Bostrom's conclusion is the disjunction: (1), (2) or (3). He suggests spreading credence roughly evenly over them, so (3) alone is not his claim.
      - body: |
          According to **Bostrom** (2003), one of three holds: (1) almost no civilizations reach the posthuman stage, (2) almost none are interested, (3) we are almost certainly simulated. With $X=f_Pf_IN_I$, $f_{\text{sim}}=X/(X+1)$. Since it is a logical result, **no premise** can be rejected.
        feedback: |
          The trilemma follows only given the premises. Rejecting any one (substrate independence, enough computing power, bland indifference) blocks the conclusion.
    explanation: |
      The simulation argument is the same question as Descartes' demon, asked as a probability. If we are simulated, Chalmers argues, the objects around us are still real.

  - id: structure
    title: Structural realism
    row: 6
    col: 3
    body: |
      Past theories fail (**pessimistic meta-induction**), yet **Worrall** notes that Fresnel's equations survived into Maxwell's, e.g. $R=\big(\tfrac{n-1}{n+1}\big)^2$. **Epistemic**: we know only structure. **Ontic**: structure is all there is. **Newman**: $2^{n^2}$ relations on $n$ points make bare structure nearly empty.
    decoys:
      - body: |
          Past theories fail (**pessimistic meta-induction**), yet **Worrall** notes that Fresnel's equations survived into Maxwell's, e.g. $R=\big(\tfrac{n-1}{n+1}\big)^2$. **Epistemic**: structure is all there is. **Ontic**: we know only structure. **Newman**: $2^{n^2}$ relations on $n$ points.
        feedback: |
          Swapped. Epistemic structural realism is about knowledge (the natures exist but we cannot know them); ontic is about what exists (structure is all, relations prior to objects).
      - body: |
          Past theories fail (**pessimistic meta-induction**), yet **Worrall** notes that the **pictures** of Fresnel's theory survived into Maxwell's, not the equations. **Epistemic**: we know only structure. **Ontic**: structure is all there is. **Newman**: $2^{n^2}$ relations on $n$ points.
        feedback: |
          Reversed. The ether picture was dropped; the equations (the structure) were kept. That continuity of form, not of content, is Worrall's case.
    explanation: |
      Structural realism links the level to the realism debate of the lesson Is Science Describing Reality? and echoes the panpsychist's structure versus intrinsic nature.

  - id: layers
    title: Three layers
    row: 7
    col: 1
    span: 4
    body: |
      Every claim sits in one layer: **fact** (brain dependence, Born-rule predictions, violated Bell inequality), **live debate** (what the state is, whether closure is a finding, whether consciousness emerges), **commitment** (which of mind or matter is fundamental). The aim is the right questions: where people part ways, and which premise or price decides it.
    decoys:
      - body: |
          Every claim sits in one layer: **fact** (brain dependence, Born-rule predictions, violated Bell inequality), **live debate** (what the state is, whether closure is a finding), **commitment** (which of mind or matter is fundamental). The aim is to find the **winning view** and then drop the rest.
        feedback: |
          The course does not declare a winner. It shows each view in its best form and where thoughtful people part ways, so that you can ask the right questions.
      - body: |
          Every claim sits in one layer: **fact** (which of mind or matter is fundamental), **live debate** (Born-rule predictions, violated Bell inequality), **commitment** (what the state is, whether closure is a finding). The aim is the right questions.
        feedback: |
          The layers are mixed up. Predictions and violated inequalities are facts; which of mind or matter is fundamental is a commitment; interpretation questions are live debates.
    explanation: |
      Every box above ends in this layering: facts are shared, debates are open, commitments are chosen.

