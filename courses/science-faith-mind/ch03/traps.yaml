id: ch03-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: which world are we in?"
    body: |
      Fast round. Each question hides a **tempting shortcut** about the big pictures of reality: matter, mind, quantum theory, Bell's result, simulation and structure. Every shortcut is a *useful idea turned too far*, and each can catch a physicalist, an idealist, a believer and a skeptic alike.

      Nothing here asks which picture is true. As always, answers are given *according to* someone (Berkeley, Descartes, Bostrom, Worrall, a many-worlds or pilot-wave defender...), and where thoughtful people differ the feedback shows both views.

  - type: mcq
    id: physicalism-denies-mind
    title: "Does physicalism deny the mind?"
    prompt: |
      A student says: "Physicalism claims that everything is physical, so it says minds, pains and thoughts do not exist." According to most physicalists, what is wrong with this?
    options:
      - text: Most physicalists say minds and pains exist; their thesis is that mental facts depend entirely on physical facts (for example, two possible worlds exactly alike physically are alike mentally). Only the eliminativist, a minority, denies that some everyday mental categories exist.
        correct: true
      - text: Nothing is wrong; physicalism is the claim that consciousness is an illusion.
        feedback: |
          That is the position of some physicalists (illusionists, eliminativists), not of the thesis itself. The thesis is about *dependence*: whether pain is identical to a brain state, realised by one, or absent altogether is argued inside physicalism.
      - text: Physicalism is a prediction of experiments, so it cannot deny anything.
        feedback: |
          Physicalism is a claim about *what exists* (metaphysics), not the result of any one experiment. Its supporting evidence is indirect: the success of physical explanation and the dependence of experience on the brain.
      - text: Physicalists say the mind exists but is a separate non-physical substance.
        feedback: |
          That is substance dualism, the rival of physicalism.
    explanation: |
      The trap is hearing "everything is physical" as "mind is nothing". Defenders hold that the mind is real and physical (or fixed by the physical). Whether that is true is a live debate, and it is a metaphysical commitment, not a lab result.

  - type: mcq
    id: brain-dependence-refutes
    title: "The injured brain"
    prompt: |
      Injury, drugs and anaesthesia change experience in systematic ways. A student concludes: "So dualism is refuted; the mind obviously depends on the brain." What is the gap, according to a dualist who replies?
    options:
      - text: Dependence is common ground. An interactionist or property dualist accepts that the brain affects experience; the dispute is whether dependence means identity (or "nothing over and above") or only a lawful link between two kinds of thing.
        correct: true
      - text: Dualists deny that brain damage ever changes experience.
        feedback: |
          Almost no dualist says that. Even Descartes held that body and mind act on each other; the question is what kind of link that is.
      - text: Brain damage shows nothing, because experience happens in the soul only.
        feedback: |
          Dualists who hold this are rare, and they still owe an account of why the damage changes experience so reliably. The usual reply is a lawful link, not irrelevance.
      - text: The evidence is in fact evidence for dualism.
        feedback: |
          Too far. The dependence is welcome to physicalists as support; the point is that it does not *by itself* choose between identity and a lawful link between two kinds.
    explanation: |
      The dependence of experience on the brain is established (layer 1). Whether it means "mind is brain" or "mind is lawfully tied to brain" is a live debate (layer 2); each answer carries a metaphysical commitment (layer 3).

  - type: mcq
    id: energy-refutes-dualism
    title: "Dualism and the conservation laws"
    prompt: |
      A student says: "Physics has conserved quantities such as energy, so a non-physical mind pushing on matter is impossible. That alone refutes dualism." Which reply is fair to both sides?
    options:
      - text: The argument needs the premise that every physical effect has a sufficient physical cause (causal closure). Physicalists take that as well supported; interactionists reject it or say a mind could act where the physics is open. Whether closure is a finding or a presupposition of method is a live debate, and a dualist can also drop the mind's causing (epiphenomenalism) or deny direct causation (parallelism).
        correct: true
      - text: The student is right; no dualist has any reply.
        feedback: |
          The lesson on dualism lists replies: interactionism rejects closure, epiphenomenalism says the mind causes nothing, and parallelism and occasionalism deny direct mind-body causation. Each has a price; none is simply ruled out by a conservation law alone.
      - text: Conservation laws are irrelevant to the question.
        feedback: |
          They are relevant: they are part of the case for physical closure, the physicalist's strongest premise. The trap is in the word "alone", since the step from "physics is closed" to "so no mind acts" needs the premise stated and defended.
      - text: Only substance dualism has this problem; property dualism does not.
        feedback: |
          Property dualists face a version too (if experience is not physical, does it cause anything?), and many accept epiphenomenalism or reject closure. The shape of the problem is similar.
    explanation: |
      The argument is: P1 closure, P2 mental events cause physical events, P3 no systematic overdetermination, so the mental must be physical. A dualist rejects one premise. Whether to accept closure as a result of physics or as a working assumption is a debate.

  - type: mcq
    id: idealism-illusion
    title: "Is the table an illusion?"
    prompt: |
      A student says: "Berkeley (1685-1753) claimed the table you see is not real; it is only a dream, so it vanishes when nobody looks." According to Berkeley, what is the better reading?
    options:
      - text: The table is real, but what it *is* is a collection of ideas (sensations) in minds. Berkeley's slogan "to be is to be perceived" says sensible things exist only in minds, and for the unperceived table the traditional reading brings in God perceiving it; later phenomenalists say it is the pattern of experiences that *would* occur.
        correct: true
      - text: The table is an illusion, and nothing exists but the person looking.
        feedback: |
          Berkeley argued the opposite: that we should trust ordinary experience and deny only a hidden *matter* behind it. His world was full of minds and divine ideas, not a solitary viewer.
      - text: The table is made of atoms outside any mind, and Berkeley agreed.
        feedback: |
          That is the position he opposed: the idea of matter existing apart from any perception.
      - text: 'Berkeley''s view is the same as Kant''s (1724-1804): appearances and things in themselves.'
        feedback: |
          Kant kept an outer world of things in themselves we cannot know, and called his view *transcendental* idealism. Berkeley's is subjective idealism; the two are different.
    explanation: |
      Idealism is not "the world is a dream". It is the thesis that mind is fundamental, and what we call matter is made of mind or exists only as it appears to minds. A critic can reject Berkeley's step from "cannot be *conceived* unperceived" to "cannot *exist* unperceived".

  - type: mcq
    id: panpsychism-rocks
    title: "Do electrons think?"
    prompt: |
      A student objects to panpsychism: "It says rocks have thoughts and electrons feel emotions. That is absurd." According to defenders, what does panpsychism actually claim?
    options:
      - text: That experience is a basic, widespread feature of the world, present in the simplest constituents in a very simple form (not thought, not emotion). Larger things such as rocks need not be conscious as wholes, since how micro-experiences combine is exactly the combination problem.
        correct: true
      - text: That every object, including a rock or a chair, has a rich mental life like ours.
        feedback: |
          Not what defenders say. The thesis concerns the simplest constituents and a very simple kind of experience; whether a rock as a whole experiences anything depends on combination, and most defenders deny it.
      - text: That only brains are conscious, and electrons are not.
        feedback: |
          That is the common view the panpsychist rejects (experience appears only in complex systems), held by physicalists and some dualists.
      - text: That consciousness is an illusion produced by atoms.
        feedback: |
          That is illusionism. Panpsychists take experience as real and basic.
    explanation: |
      The best case for panpsychism is that physics describes structure and dynamics, leaving the intrinsic nature of matter open, and experience could fill that gap. The price is the combination problem: many tiny experiences do not obviously make one unified point of view.

  - type: mcq
    id: emergence-magic
    title: "Emergence is not magic"
    prompt: |
      A student says: "Emergence just means a miracle happens when parts get complicated; the glider in Conway's Game of Life must be a new force beyond the rules." What is the better account?
    options:
      - text: In weak emergence, which the glider shows, the pattern follows from the rules in principle but is found in practice by running the process; nothing new is added. Strong emergence, a separate and contested claim, says the higher level is not deducible and has new causal powers.
        correct: true
      - text: The glider is strongly emergent, since no rule mentions it.
        feedback: |
          Not mentioned is not the same as not deducible. Every glider step follows from the rules; strong emergence would need a fact that does *not* follow even in principle.
      - text: Emergence is only a word for our ignorance, never a real feature of the world.
        feedback: |
          Many hold this, but it is a position, not a definition. Weak emergence is about patterns that are real and useful at a higher level; the dispute over whether anything is *strongly* emergent (consciousness, for instance) is live.
      - text: Emergence means the whole has a property that no part has, so it must break the laws of physics.
        feedback: |
          A crowd can be noisy though no person is the noise, and no laws are broken. A property of a whole that no part has can be fully deduced from the parts.
    explanation: |
      Three meanings need separating: a whole-level property (a crowd's noise, a gas's temperature), weak emergence (deducible in principle, visible only by running), and strong emergence (not deducible, with downward causation, which clashes with causal closure). Only the first two are uncontroversial science.

  - type: mcq
    id: copenhagen-doctrine
    title: "The Copenhagen interpretation"
    prompt: |
      A textbook says: "The Copenhagen interpretation holds that the wave function collapses when a conscious observer looks." A historian of physics objects. What is the best objection?
    options:
      - text: '"Copenhagen" was not one doctrine. Bohr and Heisenberg differed, the name was popularised later, and Bohr''s own emphasis was on describing results in classical terms, not on a collapse caused by minds.'
        correct: true
      - text: Copenhagen really is one precise doctrine with a collapse rule agreed by all its founders.
        feedback: |
          Historians stress the opposite: the label covers views that differ in important respects, which is why people who say "Copenhagen" often mean different things.
      - text: Copenhagen says nothing about measurement at all.
        feedback: |
          Too far. Measurement and the line between the device and the system are central to its picture. It just offers no further picture of the unobserved.
      - text: The collapse rule is a prediction already refuted by experiment.
        feedback: |
          No experiment has refuted the standard recipe. All four main interpretations agree on predictions; the dispute is about what the state is.
    explanation: |
      The pattern is the trap of treating a family of views as one doctrine. Whether any form of Copenhagen is clear enough to count as an answer to the measurement problem is itself a live debate.

  - type: numeric
    id: born-not-amplitude
    title: "Amplitude is not probability"
    prompt: |
      An electron spin is in the state $a\,|{\uparrow}\rangle + b\,|{\downarrow}\rangle$ with amplitudes $a = 0.6$ and $b = 0.8$. A student says: "The probability of measuring up is just $a$, so 60%." According to the Born rule, what is the probability of measuring up, as a **percentage**?
    answer: 36
    tolerance: 0.5
    answerText: '36 (that is $0.6^2$)'
    wrong:
      - { value: 60, feedback: "This takes the amplitude itself as the probability. The Born rule uses its squared size, $|a|^2$." }
      - { value: 80, feedback: "This is the amplitude $b$ of the *other* outcome, and still not squared. Squaring gives 64% for down." }
    hint: "The probability of an outcome is the squared size of its amplitude."
    explanation: |
      $P(\uparrow) = |a|^2 = 0.6^2 = 0.36$, so 36%, and $P(\downarrow) = 0.8^2 = 0.64$. The two add to $1$, as probabilities must; the amplitudes $0.6 + 0.8 = 1.4$ do not, which shows the amplitude cannot be the probability.

  - type: mcq
    id: observer-consciousness
    title: "Does quantum theory need a mind?"
    prompt: |
      A popular claim: "Quantum mechanics proves that consciousness creates reality: nothing is definite until a mind looks." Which statement separates the established part from the interpretation?
    options:
      - text: 'The established part is the recipe (state, smooth evolution, Born rule) and its precise predictions. Whether a mind plays any special role is not fixed by the recipe: many worlds has no collapse at all, the pilot wave has particles with actual positions, and QBism treats the state as an agent''s beliefs. Most working physicists use "measurement" without saying a mind is needed.'
        correct: true
      - text: Quantum mechanics has been experimentally shown to need a conscious observer.
        feedback: |
          No experiment has shown this. Experiments verify the predictions, which all main interpretations share; they do not choose whether a mind matters.
      - text: Quantum mechanics shows that the world is the same whether or not it is measured, so observation is irrelevant.
        feedback: |
          The measurement problem is real: smooth evolution and one definite outcome seem to clash, and what happens at a measurement is exactly what the interpretations disagree about. The trap here swings to the opposite shortcut.
      - text: The claim is false because quantum mechanics predicts nothing about measurement.
        feedback: |
          It predicts probabilities of outcomes extremely well (the Born rule). What it leaves open is the story of what happens, not the numbers.
    explanation: |
      Layer 1: the predictions. Layer 2: which interpretation is right, a live debate. Layer 3: any claim about consciousness, free will or a soul built on top. The step from the recipe to "consciousness creates reality" goes beyond the established part.

  - type: mcq
    id: interpretations-testable
    title: "Can an experiment pick the interpretation?"
    prompt: |
      A student says: "Many worlds, the pilot wave, Copenhagen and QBism are four different theories, so one decisive experiment will soon show which is right." What is the situation?
    options:
      - text: The four main interpretations agree on the predictions of the quantum recipe, so a standard experiment cannot separate them. They differ in what they say the state is and what they pay (Copenhagen's device/system line, many worlds' probability puzzle, the pilot wave's nonlocality, QBism's subjectivity); choice is by clarity and cost.
        correct: true
      - text: They give different probabilities, and the experiments have already refuted all but one.
        feedback: |
          They agree on the probabilities (the Born rule, and the singlet statistics). Variants that change the equations are different theories, and those can be tested; the four main interpretations are not.
      - text: Experiments can never say anything about quantum foundations.
        feedback: |
          Too strong. Bell-type experiments, for example, rule out a whole class of theories. They do not decide among the four main interpretations.
      - text: Only the many-worlds view is testable, by looking for other worlds.
        feedback: |
          Many worlds predicts the same outcomes in standard experiments, and it says other branches cannot be reached. A testable alternative would modify the equations.
    explanation: |
      Because the four agree on predictions, the debate is partly philosophical: which picture is clearest, which cost is acceptable. That is a layer-2 debate with layer-3 commitments, not a gap waiting for one experiment.

  - type: mcq
    id: bell-signalling
    title: "Faster than light?"
    prompt: |
      Experiments find that distant entangled pairs violate Bell's inequality: the result $|S|$ exceeds $2$. A news headline says "Bell proved that messages can travel faster than light." According to the physics, what is wrong with the headline?
    options:
      - text: The violation shows a correlation no local, pre-set-values model can produce; but each experimenter on their own sees random outcomes, and the correlation appears only when the two lists are compared by an ordinary signal. So the result does not let anyone send a message faster than light.
        correct: true
      - text: Nothing is wrong; each outcome instantly tells the other lab what to do.
        feedback: |
          Outcomes are random on each side; a lab cannot choose its outcome, only its setting, and the other lab sees nothing different by itself. Only the comparison of both lists reveals the pattern.
      - text: Bell's result is not real; the experiments were refuted by loopholes.
        feedback: |
          The 2015 loophole-closing experiments (Hensen, Giustina, Shalm) closed the main ones at once; the violation stands. The debate is over what to give up, not over whether the violation exists.
      - text: Quantum mechanics predicts that the correlation is weaker than 2, so no violation is possible.
        feedback: |
          Quantum mechanics predicts $|S| = 2\sqrt2 \approx 2.83$ at the best angles, which is what the experiments confirm.
    explanation: |
      Bell's theorem shows that the quantum correlations cannot all be reproduced if there are local pre-set values, free choice and one outcome. Not even a nonlocal theory such as the pilot wave allows signalling. Layer 1: the violation. Layer 2: which assumption to drop. Layer 3: the picture of the world that results.

  - type: mcq
    id: bell-no-hidden
    title: "No hidden variables?"
    prompt: |
      A student says: "Bell proved that no hidden-variable theory can exist; quantum randomness is fundamental." According to the Bell lesson and the pilot-wave defenders, what is the problem?
    options:
      - text: Bell excluded hidden values only together with locality, free choice and a single outcome. The pilot wave (de Broglie 1927, Bohm 1952) has actual particle positions as hidden variables and reproduces the quantum predictions, at the price of nonlocality. Many worlds drops the single-outcome assumption and superdeterminism drops free choice.
        correct: true
      - text: Bell proved that every hidden-variable theory is false.
        feedback: |
          Too strong. The result excludes theories obeying *all* the assumptions at once; the pilot wave is a hidden-variable theory that survives by being nonlocal.
      - text: Bell proved that hidden variables must be local.
        feedback: |
          The opposite: with locality they are excluded. A hidden-variable theory that agrees with the predictions must be nonlocal (or drop another assumption).
      - text: The theorem says nothing about hidden variables.
        feedback: |
          The theorem is exactly about what pre-set values could do. It tells you which combination of assumptions fails, not that one particular assumption is the culprit.
    explanation: |
      What the violation says: at least one of locality, hidden values fixed in advance, free choice and one outcome fails. Physics alone does not say which; four views give four answers. That is a live debate, not a theorem.

  - type: numeric
    id: chsh-sheet
    title: "A local sheet"
    prompt: |
      In the local-model argument, each run has pre-set values $A, A', B, B' \in \{+1, -1\}$, and
      $$s = A\,(B - B') + A'\,(B + B').$$
      A student sets all four to $+1$ ("perfect agreement everywhere") and says $s$ should be the sum of four correlations of $1$, so $s = 4$. What is $s$?
    answer: 2
    answerText: '2'
    wrong:
      - { value: 4, feedback: "The correlations enter with signs: the four-term combination is $E(a,b) - E(a,b') + E(a',b) + E(a',b')$, and one term is subtracted. With all four values equal, $s = 1 - 1 + 1 + 1$ per run." }
      - { value: 0, feedback: "The first bracket $B - B'$ is $0$, but the second, $B + B'$, is $2$, and it is multiplied by $A' = 1$." }
    hint: "Compute $B - B'$ and $B + B'$ separately."
    explanation: |
      $B - B' = 0$ and $B + B' = 2$, so $s = 1\cdot 0 + 1\cdot 2 = 2$. Whatever the values, one bracket is $0$ and the other $\pm 2$, so $s = \pm 2$ and the average of $s$ over runs can never exceed $2$. That is why a local model cannot reach $2\sqrt2 \approx 2.83$; the trap is thinking four perfect correlations could give $4$.

  - type: mcq
    id: simulation-we-are
    title: "The simulation argument"
    prompt: |
      A student says: "Bostrom's simulation argument (2003) proves that we are almost certainly living in a simulation." According to Bostrom, what does the argument actually conclude?
    options:
      - text: 'Only that at least one of three things holds: (1) almost no civilizations reach a posthuman stage, (2) almost none of those are interested in running ancestor-simulations, or (3) we are almost certainly simulated. He suggests spreading credence roughly evenly over the three, not accepting (3).'
        correct: true
      - text: That (3) is true, because the number of simulations would be huge.
        feedback: |
          The huge number makes the fraction of simulated observers near 1 *if* there are such simulations. The trilemma says that either there are not (options 1 and 2) or we are probably in one (option 3).
      - text: That we are certainly not simulated, since a simulation could not hold conscious beings.
        feedback: |
          That denies a premise: substrate independence (a suitable computation produces experience whatever it runs on). Bostrom assumes it; a critic may reject it, which blocks the argument.
      - text: That the argument has no premises and is therefore a theorem of mathematics.
        feedback: |
          It has premises: substrate independence, enough computing power and a bland indifference principle. Rejecting any one blocks the conclusion.
    explanation: |
      The conclusion is a disjunction. The step from "the trilemma holds" to "so (3)" would need reasons to doubt (1) and (2), and those reasons are exactly what is disputed. Layer 2: the premises; layer 3: the picture of reality.

  - type: numeric
    id: simulation-even-credence
    title: "Even credence"
    prompt: |
      Suppose you spread your credence evenly over the three options of Bostrom's trilemma: (1) almost no civilizations reach the posthuman stage, (2) almost none of those are interested in running simulations, (3) we are almost certainly simulated. A student says "I give 90% to being simulated, since the argument leans that way". If instead you give each option exactly the same credence, what is the credence in (3), as a **percentage** (one decimal)?
    answer: 33.3
    tolerance: 0.1
    answerText: '33.3 (one third)'
    wrong:
      - { value: 90, feedback: "That would give option (3) most of the credence, which is the opposite of even. The three options must add to 100%." }
      - { value: 50, feedback: "50% is the split between two options (simulated or not). There are three options, so each gets a third." }
    hint: "Three options, equal shares, total 100%."
    explanation: |
      $100\% / 3 \approx 33.3\%$. Bostrom suggested roughly even credence over the three; he did not claim to prove (3). Note that (1) and (2) together get about two thirds, and a person who thinks (1) or (2) is more likely will give (3) less.

  - type: mcq
    id: simulation-null-test
    title: "A negative test"
    prompt: |
      A proposed test looks for the signature of a cubic space-time lattice in the highest-energy cosmic rays (Beane, Davoudi and Savage, 2012). It finds nothing. A headline says "Experiment shows we are not in a simulation." What is the better conclusion?
    options:
      - text: The null result excludes one kind of simulation (one with that lattice at that scale) and barely lowers the odds of simulation in general, since a simulation need not use such a lattice. A positive result would have been far more striking.
        correct: true
      - text: The null result proves that we are in a simulation, since the simulators hide it.
        feedback: |
          An unfalsifiable move: if every result is explained by the hypothesis, the hypothesis explains nothing. Evidence needs a result that is more expected under one hypothesis than under the other.
      - text: The test is meaningless, since no simulation could ever be tested.
        feedback: |
          The test is a real proposal: a simulation with a certain lattice would leave a signature. Its limit is that it tests only that kind of simulation.
      - text: A null result of a lattice test settles the simulation question either way.
        feedback: |
          Only if every simulation had the lattice. The likelihood of the null under "simulated, other kind" is nearly the same as under "real", so the odds barely move.
    explanation: |
      In odds form, posterior odds equal the likelihood ratio times prior odds. If the null is nearly as likely in both cases, the ratio is near 1 and the odds hardly change. The same reasoning applies to the "prediction every rival makes" trap.

  - type: mcq
    id: structure-theory-change
    title: "What survives theory change?"
    prompt: |
      A student says: "Worrall (1989) showed that when Maxwell replaced Fresnel's ether theory, the whole of Fresnel's theory survived, so scientific realism is safe." According to Worrall, what survived?
    options:
      - text: Not the whole theory. The picture of the nature of light (an elastic ether) was dropped, but the equations (such as the reflection formula $R = \big(\tfrac{n-1}{n+1}\big)^2$) survived. Worrall's suggestion is that the continuity is of form or structure, not of content, so we should believe the structure.
        correct: true
      - text: Everything survived, ether included.
        feedback: |
          The ether picture did not survive Maxwell's field theory; that is the example the pessimistic meta-induction uses.
      - text: Nothing survived; all the equations were replaced.
        feedback: |
          The reflection formula is common to both theories (water, $n = 1.33$, gives about $2.0\%$ either way). The continuity of equations is the evidence Worrall points to.
      - text: What survived was the experimental data only, so structural realism is just empiricism.
        feedback: |
          Structural realists say that the *equations* (relations between things) are what we can take to be approximately true, including about unobservable things; that goes beyond the data.
    explanation: |
      Structural realism is a reply to Laudan's pessimistic meta-induction (many successful theories were later rejected). Whether the Fresnel-Maxwell case generalizes is a live debate.

  - type: numeric
    id: newman-count
    title: "Relations on three points"
    prompt: |
      Newman's objection (1928) says that "the world has structure $S$" says little, because any set of $n$ objects has many binary relations (each a set of ordered pairs). A student counts only the $3\times 3 = 9$ ordered pairs and says "there are 9 relations on 3 points". How many binary relations are there on 3 objects?
    answer: 512
    answerText: '512 (that is $2^9$)'
    wrong:
      - { value: 9, feedback: "9 is the number of ordered pairs. A relation is any *subset* of those pairs, so you choose, for each pair, whether it is in or out." }
      - { value: 18, feedback: "Doubling 9 treats the choice as counting twice. A relation chooses in/out independently for each of 9 pairs: $2\\times2\\times\\cdots\\times2$ nine times." }
    hint: "For each of the 9 ordered pairs, it is either in the relation or not."
    explanation: |
      Each of the 9 pairs is in or out, so there are $2^9 = 512$ relations. In general $2^{n^2}$: so for almost any pattern, some relation on the set has it, and a bare "has structure $S$" says little beyond the number of things. Defenders reply that real structure is more than a bare pattern: it is causal and law-governed.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Three layers of claim: established fact, live scholarly debate, faith or metaphysical commitment. Select **all** statements below that are *live scholarly debate* (neither settled fact nor simply a commitment).
    multiple: true
    options:
      - text: Which assumption to give up after the Bell violation (locality, hidden values, free choice, one outcome).
        correct: true
      - text: Whether the Bell inequality is violated in loophole-free experiments.
        feedback: |
          This is established experimental fact, the first layer.
      - text: Whether weak emergence applies to consciousness.
        correct: true
      - text: Whether mind or matter is fundamental.
        feedback: |
          This is a metaphysical commitment (the third layer): thoughtful people on every side hold it as a commitment rather than as the result of an experiment.
      - text: Whether the premises of the simulation argument (substrate independence, bland indifference) are true.
        correct: true
    explanation: |
      **Established fact**: the Bell violation, the predictions of the quantum recipe, the dependence of experience on the brain. **Live debate**: which assumption fails, whether consciousness is weakly or strongly emergent, whether the simulation premises hold. **Commitment**: what is fundamental, mind or matter. Do not pass one layer off as another.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Nineteen traps, one pattern: each turned a *useful* idea into a shortcut.

      - **Physicalism** is a thesis of dependence, not a denial of mind; brain dependence is common ground, and the **conservation argument** against dualism needs causal closure as a premise.
      - **Idealism** is not "the table is a dream"; Berkeley is not Kant. **Panpsychism** is about the simplest things, a simple experience, not thoughts in rocks.
      - **Emergence** is not magic: weak emergence is deducible in principle; strong is the contested one.
      - **Quantum theory**: Copenhagen is not one doctrine, probability is the squared amplitude ($0.6 \to 36\%$), the recipe does not say a mind is needed, and the four interpretations agree on predictions.
      - **Bell**: no faster-than-light messages, and no proof that hidden variables cannot exist, only that not all four assumptions can hold ($|S|\le 2$ locally, $2\sqrt2$ quantum).
      - **Simulation**: a trilemma, not a proof of (3); a null lattice test barely moves the odds.
      - **Structure**: the equations survive, the pictures do not; and Newman's count ($2^9 = 512$) warns that "structure" needs more than a pattern.

      **Next:** *Quick Recall*, the main formulas and distinctions of Level 3 at a glance.
