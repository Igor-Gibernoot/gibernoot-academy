id: ch03-structure
title: "Structural Realism: What Survives Theory Change?"
kind: concept
own: |
  - **The problem.** According to Larry Laudan (1981), many past theories were successful and are now rejected (caloric, phlogiston, the luminous ether), so by induction our best theories may be rejected too: the {{ pessimistic meta-induction }}. A **scientific realist** holds that successful theories are approximately true even about unobservable things.
  - **The proposal.** According to John Worrall (1989, *Dialectica*), when Maxwell's field theory replaced Fresnel's elastic-ether theory of light, the *picture* changed but the *equations* survived. For light going from air into a material of refractive index $n$, at normal incidence, both theories give the reflected fraction
  $$R = {{ \left(\frac{n-1}{n+1}\right)^2 }}$$
  so water ($n=1.33$) reflects about $2.0\%$. Structural realism: believe what the theory says about **structure** (the relations the equations express), be cautious about the **nature** of the things related.
  - **Two versions.** **Epistemic** structural realism (Worrall; Russell's 1927 view is a precursor): the world has objects with natures, but {{ we can know only the structure, not the natures }}. **Ontic** structural realism (Ladyman 1998; Ladyman and Ross 2007): {{ structure is all there is, and relations are prior to the objects they relate }}.
  - **Newman's objection** (1928, aimed at Russell's structural view). Take any set $A$ of $n$ objects. The number of binary relations on it (sets of ordered pairs) is
  $$2^{n^2},$$
  so for any pattern of size $n$ some relation on $A$ has it. Hence "the world has structure $S$" says {{ almost nothing beyond how many things there are }}, unless the structure is more than a bare pattern. Defenders reply that real structure is physical (causal, law-governed) and, for the ontic version, not a set of ordered pairs at all.
  - **Layers and open questions.** Established fact: the reflection formula appears in both theories. Live debate: whether this case generalizes, what counts as structure, whether Newman's problem is answered. Commitment: that only structure is knowable (epistemic) or real (ontic). Open: whether the history of science supports either, and what the "relata" are.
cards:
  - type: mcq
    id: hook
    title: "Same formula, different world"
    prompt: |
      Guess before any theory. In the 1820s Augustin Fresnel (1788-1827) pictured light as a wave in an invisible elastic jelly filling space, the **ether**, and derived a formula for how much light a glass or water surface reflects. In the 1860s James Clerk Maxwell (1831-1879) explained light as a wave of electric and magnetic **fields**, with no jelly at all. Suppose you now ask what became of Fresnel's reflection formula. What would you bet?
    options:
      - text: 'It was thrown away with the ether and had to be recomputed from scratch.'
        feedback: |
          This is the natural guess if a theory stands or falls as a whole. But the formula was a good fit to measurements, and a new theory that gave different numbers would have been refuted by the same measurements. Look at the next cards for what happened.
      - text: 'The formula survived: Maxwell''s theory gives the same result, even though the picture of what is waving changed completely.'
        correct: true
      - text: 'It survived only for water and was replaced for other materials.'
        feedback: |
          Nothing in the history singles out water. The formula contains the refractive index $n$ as a free number, so it covers any material.
    explanation: |
      This is the puzzle of the lesson: if the equation survived while the thing it was built for disappeared, what exactly did the old theory get right?

  - type: text
    id: recall
    title: "Recall: the problem structural realism answers"
    body: |
      Recall from the lesson *Is Science Describing Reality?*. A **scientific realist** says that successful scientific theories are approximately true, even about things we cannot observe directly (electrons, fields). The realist's best argument is that such success would otherwise be a miracle.

      According to Larry Laudan (1941-2022), in 1981, history gives a reply, the **pessimistic meta-induction**: many theories that were very successful in their day are now regarded as false, including the **caloric** theory of heat, **phlogiston** (a substance said to be released in burning) and the luminous **ether**. By induction over the history of science, our current best theories will probably be dropped too, so their success is not a reliable sign of truth.

  - type: mcq
    id: target
    title: "What the pessimist attacks"
    prompt: |
      A realist argues: "Premise: a theory that makes many precise, successful predictions is approximately true, even about unobservable things. Our best theories make such predictions. So they are approximately true." According to Laudan's pessimistic meta-induction, which part of this is in trouble?
    options:
      - text: 'The premise that success signals approximate truth: the history of science contains successful theories whose central entities (caloric, the ether) were later rejected.'
        correct: true
      - text: 'The claim that the predictions were made at all.'
        feedback: |
          The pessimist accepts the predictions and their success. The question is what success shows about the unobservable things the theory talks about.
      - text: 'The logic: the conclusion does not follow from the premise.'
        feedback: |
          If the premise were true, the conclusion would follow. The pessimist challenges the premise itself, using past cases as counterexamples.
    explanation: |
      A realist who wants to keep the argument must either deny that the past cases were really successful in the relevant sense, or find something that was kept across the change. The second route leads to structural realism.

  - type: text
    id: worrall
    title: "Worrall's proposal"
    body: |
      According to John Worrall, in "Structural Realism: The Best of Both Worlds?" (*Dialectica* 43, 1989), the nineteenth-century shift from Fresnel's elastic-ether theory to Maxwell's electromagnetic theory is the model case. In his words, there was "continuity or accumulation in the shift, but the continuity is one of form or structure, not of content."

      Here **content** means what the theory says light *is made of* or *waves in*: an elastic solid in one theory, an electromagnetic field in the other. **Structure** means the mathematical relations among measurable quantities, the equations. Worrall says he found this kind of view in Henri Poincaré. His claim: the equations Fresnel derived for the reflection and refraction of light were kept by Maxwell, while the ether was dropped.

      The reflection formula in the simplest case, light going from air straight into a material of refractive index $n$ (which measures how much the material slows light), gives the fraction of light reflected:
      $$R=\left(\frac{n-1}{n+1}\right)^2$$

  - type: numeric
    id: water
    title: "The number that survived"
    prompt: |
      Light goes from air straight into water, refractive index $n=1.33$. The reflected fraction at normal incidence is $R=\big(\tfrac{n-1}{n+1}\big)^2$. What percentage of the light is reflected? (Percent, one decimal.)
    answer: 2.0
    tolerance: 0.05
    answerText: '2.0'
    wrong:
      - { value: 14.2, feedback: 'You have $(0.33/2.33)=0.142$ but did not square it. Squaring gives $0.0201$.' }
      - { value: 33, feedback: 'That is $n-1$ as a percent. The formula divides by $n+1$ and squares the ratio.' }
    hint: 'Compute $(1.33-1)/(1.33+1)$ first, then square it.'
    explanation: |
      $(0.33/2.33)^2\approx0.0201$, so about $2.0\%$. Fresnel's ether theory and Maxwell's field theory both give this number. Measuring it cannot tell the two pictures apart, which is exactly why the formula could survive the change.

  - type: mcq
    id: stayed
    title: "What changed, what stayed"
    prompt: |
      Fresnel's theory of 1820s light (a wave in an elastic ether) was replaced by Maxwell's (a wave of electromagnetic fields). According to Worrall, which pair correctly says what changed and what was kept for the reflection of light?
    options:
      - text: 'Changed: what is said to be waving (elastic ether to field). Kept: the equations relating reflected and refracted light to the angle and the refractive index.'
        correct: true
      - text: 'Changed: the equations. Kept: the picture of an elastic ether.'
        feedback: |
          This is reversed. The ether was dropped, and the equations carried over.
      - text: 'Changed: nothing, since Maxwell only added new facts to Fresnel.'
        feedback: |
          Maxwell's theory has no elastic ether, so the ontology (the list of what exists) did change. The claim is that the *equations* accumulated, not the picture.
    explanation: |
      This is what Worrall calls the best of both worlds: take the pessimist seriously about the **nature** of unobservable things (the ether went), and the realist seriously about the **structure** (the equations stayed).

  - type: text
    id: versions
    title: "Two versions of the view"
    body: |
      Worrall's view is **epistemic structural realism** (epistemic: about what we can *know*). It holds that we can believe what our best theories say about the relations among unobservable things while suspending judgment about the things' natures. The world may contain objects with natures, but science reaches only the structure. According to Bertrand Russell (1872-1970), in *The Analysis of Matter* (1927), science tells us only structural features of the world, a view that the lesson *Mind in Everything? Panpsychism and Neutral Monism* met.

      In 1998 James Ladyman, in "What is Structural Realism?" (*Studies in History and Philosophy of Science* 29), distinguished this from **ontic structural realism** (ontic: about what *exists*), and argued for the ontic form. In *Every Thing Must Go* (Oxford University Press, 2007), James Ladyman and Don Ross develop it. According to this view, structure and relations are prior to the individual objects, and current physics does not fit the picture of self-standing individuals with intrinsic properties. The slogan: there are no "things" with relations between them, only structure.

  - type: mcq
    id: which
    title: "Epistemic or ontic?"
    prompt: |
      Two physicists discuss electrons. A says: "There may be something an electron is in itself, but our theories only ever tell us how electrons relate to fields and to each other, so that is all we can know." B says: "There is no extra fact about what an electron is in itself; the relations are all there is." Which classification fits, according to the lesson?
    options:
      - text: 'A is an epistemic structural realist (a limit on what we can know) and B is an ontic structural realist (a claim about what exists).'
        correct: true
      - text: 'A is ontic and B is epistemic.'
        feedback: |
          Reversed. A leaves open that electrons have natures we cannot reach (a claim about knowledge); B denies there are such natures (a claim about being).
      - text: 'Both are ontic, since both talk about electrons.'
        feedback: |
          The difference is whether the structural claim is about **knowledge** (A) or about **what there is** (B).
    explanation: |
      A claim about the limits of knowledge can be held by someone who believes in hidden natures. The ontic claim is stronger and more metaphysical.

  - type: text
    id: newman
    title: "Objection 1: Newman's problem"
    body: |
      The mathematician M. H. A. Newman (1928, *Mind* 37) objected to Russell's structural view. Suppose all we know of some objects is the *structure* they form, that is, only that they stand in some relation with a certain pattern. Newman used a set-theoretic fact: for any set $A$ and any pattern of the same size, some relation among the members of $A$ has that pattern. So the claim "the world has structure $S$" is nearly empty: it is true of almost any collection with the right number of members. According to Newman's argument, the only thing left open to discovery is *how many* things there are.

      Count the relations to see why. A relation on $A$ is just a set of ordered pairs of members of $A$ (a pair $(a,b)$ means "$a$ is related to $b$"). A set with $n$ members has $n^2$ ordered pairs, and a relation chooses any subset of them.

  - type: numeric
    id: count
    title: "How many relations?"
    prompt: |
      A set $A$ has $n=3$ members. A relation on $A$ is any chosen set of ordered pairs $(a,b)$ with $a,b\in A$, including the empty relation and the relation containing all pairs. How many different relations exist on $A$?
    answer: 512
    answerText: '512'
    wrong:
      - { value: 9, feedback: '9 is the number of ordered pairs. A relation picks any subset of them, and each pair is either in or out.' }
      - { value: 18, feedback: 'That is $2\times9$. Each of the 9 pairs is independently in or out, which multiplies: $2\times2\times\dots$ nine times.' }
    hint: 'There are $3^2=9$ ordered pairs, each either in the relation or not.'
    explanation: |
      Nine pairs, two choices each: $2^9=512$. In general $2^{n^2}$. With so many relations available, any pattern of the right size turns up among them, which is the heart of Newman's point.

  - type: mcq
    id: newman-q
    title: "What Newman shows"
    prompt: |
      According to Newman's objection, if all we know about the world is that its objects form a structure (a relation with some pattern), what follows?
    options:
      - text: 'That claim is true of almost any collection with the right number of members, so it says little unless the structure is something more than a bare pattern.'
        correct: true
      - text: 'The world has no structure at all.'
        feedback: |
          Newman does not deny structure. He argues that a bare pattern is too cheap to be informative about the world.
      - text: 'Mathematics cannot be applied to physics.'
        feedback: |
          The objection is narrower: it targets the idea that structure alone, without further content, is what science tells us.
    explanation: |
      Replies: the structure physics gives is not an arbitrary set of ordered pairs but one tied to causes, laws and measurements. Ladyman and Ross hold that the ontic version avoids the problem because it does not understand relations as sets of ordered pairs of pre-existing objects.

  - type: text
    id: what-structure
    title: "Objection 2: what counts as structure?"
    body: |
      A second worry is about the line itself. Structure, a critic may say, is always the structure *of* something. If an equation is about fields, then "the equation survived" also means "the field survived", and the supposed gap between structure and nature is blurred. What exactly does a structural realist keep, and what is let go? A weak answer ("whatever survives") would make the view true by definition and unfalsifiable.

      Defenders reply that a precise line can be drawn in particular cases, and that the historical record, with the Fresnel-Maxwell case as an example, is evidence for it. Critics reply that one case does not show that the same split holds throughout the history of science. Notice that both sides use the same historical facts and differ on what they show.

  - type: text
    id: compare
    title: "Neighbouring ideas in the course"
    body: |
      **Physicalism and Russell.** In the lessons *Matter Is All There Is?* and *Mind in Everything? Panpsychism and Neutral Monism*, physics described matter by **structure and dynamics** (what things do and how they relate), leaving open their **intrinsic nature**. Epistemic structural realism uses the same split to *stay silent* about natures. The Russellian panpsychist uses it to *speculate*: the intrinsic nature that physics leaves open might be experiential. Same premise, different step.

      **Bayes.** In the lesson *Evidence as Updating Belief*, success raises the probability of a hypothesis. A structural realist may say that success should raise the probability only of the part of the theory that does the work in the predictions, the structure.

      **Quantum mechanics.** The lesson *What Quantum Mechanics Does and Does Not Say* showed four interpretations that disagree about what exists but agree on every prediction. One could read this as support for the structural idea (what they share is the structure), or as showing that structure leaves the question of what exists wide open. Which reading to prefer is part of the debate.

  - type: mcq
    id: compare-q
    title: "Same premise, different step"
    prompt: |
      Both an epistemic structural realist and a Russellian panpsychist start from "physics tells us only the structure (relations and dynamics) of matter." What is the difference in what they conclude about the natures that structure leaves open?
    options:
      - text: 'The structural realist suspends judgment about the natures; the Russellian panpsychist proposes that they are experiential (or protophenomenal).'
        correct: true
      - text: 'The structural realist says natures are physical; the panpsychist says they do not exist.'
        feedback: |
          Neither says this. The structural realist (epistemic) leaves natures unspecified, and the panpsychist proposes that they are experiential.
      - text: 'They disagree on whether physics describes structure at all.'
        feedback: |
          They agree on that premise. The disagreement comes in the next step.
    explanation: |
      A shared premise supports different conclusions depending on extra commitments. Here the panpsychist adds the hard problem; the structural realist adds the lesson of theory change.

  - type: mcq
    id: critic
    title: "What a critic rejects"
    prompt: |
      A critic of structural realism says: "From one nineteenth-century case you jump to 'only structure is real'." Which statement is the critic actually rejecting (rather than the plain history)?
    options:
      - text: 'The inference from a single historical case, in which the equation was kept, to the general conclusion that structure alone is real or knowable.'
        correct: true
      - text: 'That the same reflection formula appears in both Fresnel''s and Maxwell''s theories.'
        feedback: |
          The critic can accept that history. The equation does appear in both. What is disputed is what the fact shows.
      - text: 'That the ether was dropped.'
        feedback: |
          That is the common ground of the whole debate, and the pessimistic meta-induction depends on it.
    explanation: |
      Keep the layers apart. That the formula survived is fact. That this generalizes is debated. That only structure is real or knowable is a commitment.

  - type: mcq
    id: layers
    title: "Which layer?"
    prompt: |
      Which of these statements is **established fact** (rather than a live debate or a metaphysical commitment)?
    options:
      - text: 'The reflection formula $R=\big(\tfrac{n-1}{n+1}\big)^2$ for light at normal incidence appears in Fresnel''s ether theory and in Maxwell''s field theory.'
        correct: true
      - text: 'All that science can ever tell us about the world is structure.'
        feedback: |
          This is the epistemic structural realist's thesis: a debated position.
      - text: 'Relations are prior to objects, and there are no individual things with intrinsic natures.'
        feedback: |
          This is the ontic structural realist's metaphysical commitment, which its defenders argue from physics and its critics reject.
    explanation: |
      The same pattern appeared in earlier lessons: separate what is documented, what scholars dispute, and what one commits to.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** a round of Traps on this level, with fast questions on the common misconceptions about realism, mind, quantum mechanics, simulation and structure.
