id: ch03-challenge
title: "Level Challenge: Which World Are We In? (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: the same puzzles for every view"
    body: |
      Each problem puts the views of reality from this level (physicalism, dualism, idealism, panpsychism, emergence, and the views of quantum mechanics) in front of the same puzzle, with numbers. The problems are independent, so here is the toolkit, restated.

      - **Kim's three premises** (Jaegwon Kim, 1934-2019). P1 *closure*: every physical event that has a cause has a sufficient physical cause. P2: mental events cause physical events (a decision raises an arm). P3: no systematic *overdetermination* (an event is not caused twice over by two independent sufficient causes). Accepting all three is hard to combine with a mind that is more than physical.
      - **Temperature as an average.** For $N$ atoms of mass $m$ and speeds $v_i$ at temperature $T$ (kelvin), with $k = 1.38\times10^{-23}$ J/K, the average kinetic energy of an atom is tied to $T$. A gas has a temperature; a single atom does not.
      - **Quantum recipe.** A spin state $a|{\uparrow}\rangle + b|{\downarrow}\rangle$ has $|a|^2+|b|^2=1$; the probability of an outcome is the squared size of its amplitude (the Born rule).
      - **Bell's test.** Alice measures along $a$ or $a'$, Bob along $b$ or $b'$. For two particles in the *singlet* state the correlation of directions $x$ and $y$ is $E(x,y)=-\cos(x-y)$, and
      $$\begin{aligned}S ={}& E(a,b) - E(a,b')\\ &+ E(a',b) + E(a',b').\end{aligned}$$
      Four assumptions (locality, hidden values, free choice, one outcome per run) give $|S|\le 2$.
      - **Simulation.** $f_{\text{sim}} = \dfrac{X}{X+1}$ with $X = f_P\,f_I\,N_I$ (Bostrom, 2003); evidence updates odds by the likelihood ratio.
      - **Structure.** Fresnel's light theory and Maxwell's share their equations, and any set of $n$ objects supports many relations (Newman, 1928).
      - **Layers**: label each claim as (1) established fact, (2) live debate, or (3) metaphysical commitment.

      Three problems here. Problems 4 and 5 come in part 2.

  # ---------------- Problem 1 ----------------
  - type: mcq
    id: p1-drop
    title: "Problem 1 · Closure and the views"
    prompt: |
      **Problem 1.** Mara decides to raise her arm, and it rises. Neurons fire along the way, and each neural event has a complete physical cause. Take Kim's three premises: P1 (physical closure), P2 (her mental decision causes the movement), P3 (no systematic overdetermination). Two dualist positions are compared: **interactionism** (mind and body are different kinds and they act on each other) and **epiphenomenalism** (the mind is a by-product of the brain and causes nothing). Which pairing is right?
    options:
      - text: 'Interactionism drops P1 (the mind steers events that physics alone leaves open). Epiphenomenalism drops P2 (the decision causes nothing; it only accompanies the neural cause).'
        correct: true
      - text: 'Interactionism drops P3 (decisions and neurons both cause the arm). Epiphenomenalism drops P1.'
        feedback: |
          The pairing is scrambled. Epiphenomenalism *keeps* closure: it accepts that physics is complete and concludes that the mind is a by-product. Interactionism needs the physical story to have gaps for the mind to fill, not a systematic double cause.
      - text: 'Both drop P3, since both say mind and brain act together.'
        feedback: |
          Epiphenomenalism says the mind does not act at all. Neither position rests on accepting a systematic double cause; that is what P3 rules out.
    explanation: |
      Each position is located by the premise it gives up. Interactionism gives up closure and pays by saying where physics is incomplete (some defenders point to quantum events). Epiphenomenalism gives up P2 and pays with the odd claim that your decision never causes your action. That a closure-respecting physics is a well-supported working assumption is a finding; that it is exceptionless is a metaphysical commitment (a live debate).

  - type: mcq
    id: p1-three
    title: "Three more positions"
    prompt: |
      Three further views meet the same case. **Strong emergence**: the brain's complex organization gives rise to experience under a new law, and the experience has causal powers of its own. **Panpsychism**: the basic physical things have a simple experiential inner nature, and physics describes only their structure and behaviour. **Idealism**: what exists is mind, and physical things are what minds perceive or are constituted by. Which statement is right?
    options:
      - text: 'Strong emergence drops P1 (it adds causes of its own to physical events). Panpsychism and idealism, as usually read, add no second cause: the mental is the inner nature of what physics describes, or the physical is built from the mental, so the clash with closure does not arise in the same form.'
        correct: true
      - text: 'All three drop P1, because any non-physicalist view must make the physical world incomplete.'
        feedback: |
          Strong emergence does; the other two need not. A panpsychist can accept that physics is complete as a description of behaviour and say that experience is what that behaviour is the behaviour *of*. An idealist reads the physical as a feature of mind and has no rival physical cause to compete with.
      - text: 'All three drop P2, since none of them lets experience cause anything.'
        feedback: |
          Strong emergence says the opposite: the emergent property has new causal powers (downward causation). Panpsychists usually say experience does the causing, as the nature of the physical thing.
    explanation: |
      This is our reading of how the views fit the argument (defenders word it differently). The map: strong emergence rejects closure for higher-level causes; panpsychism and idealism change what "physical" and "mental" are, so they avoid the three-way choice rather than picking a premise. Each pays elsewhere: the combination problem for panpsychism, the unthought tree for idealism, brute laws for emergence.

  - type: numeric
    id: p1-temp
    title: "A temperature from the parts"
    prompt: |
      Four helium atoms (mass $m = 6.646\times10^{-27}$ kg each) in a box move at speeds $900$, $1100$, $1300$ and $1500$ m/s. Take $k = 1.38\times10^{-23}$ J/K. What temperature does the group of four have, in kelvin?
    answer: 239
    tolerance: 2
    answerText: '$\langle v^2\rangle = 1.49\times10^6$ m$^2$/s$^2$, $T \approx 239$ K'
    wrong:
      - { value: 231, feedback: 'That squares the average speed ($1200^2 = 1.44\times10^6$) instead of averaging the squares. The average of $v^2$ is larger than the square of the average.' }
      - { value: 359, feedback: 'That drops the factor from the three directions of motion: the average kinetic energy is tied to $\tfrac32 kT$, not to $kT$.' }
    hint: Average the *squares* of the speeds first, then use "average kinetic energy of an atom equals three halves of $kT$".
    explanation: |
      $$\langle v^2\rangle=\frac{900^2+1100^2}{4}+\frac{1300^2+1500^2}{4}$$
      $$\langle v^2\rangle=1.49\times10^{6}\ \text{m}^2/\text{s}^2$$
      $$T=\frac{m\langle v^2\rangle}{3k}\approx 239\text{ K}$$
      The temperature is deduced from the parts' facts, with no new law. That is why temperature is a **reduction** and not an example of strong emergence.

  - type: mcq
    id: p1-test
    title: "What would strong emergence need?"
    prompt: |
      A thermometer in the box reads $239$ K, matching the calculation from the four atoms. A student says: "Temperature belongs to the whole gas and to none of the atoms, so it is strongly emergent." What is the best reply?
    options:
      - text: 'Belonging to the whole is not enough. Strong emergence claims the whole-level fact is *not deducible even in principle* from the parts and their laws, and has new causal powers. Here the parts give the temperature exactly.'
        correct: true
      - text: 'It is strongly emergent, but only for small samples of atoms.'
        feedback: |
          The deduction works for any number of atoms; size is not the issue. The question is whether the higher-level fact follows from the lower-level ones, and here it does.
      - text: 'Strong emergence is refuted by this example, so no property can be strongly emergent.'
        feedback: |
          One reduction proves nothing about every property. The live debate is about consciousness, where defenders say the deduction fails (the hard problem), and a critic says it only looks like it fails.
    explanation: |
      The test for a strong-emergence claim is a failed deduction plus new causal powers. Weak emergence (patterns found by running the rules, like the glider in the Game of Life) is established science; strong emergence for consciousness is a live debate and a commitment.

  - type: mcq
    id: p1-layers
    title: "Layers"
    prompt: |
      Classify: "Every physical effect has a sufficient physical cause, so a non-physical mind can cause nothing." Which layer is this?
    options:
      - text: 'A mixture. The brain-correlation findings are established (layer 1); closure is a well-supported working assumption but a live debate as an exceptionless law (layer 2); the step to "so mind causes nothing" depends on keeping P1 and P3 and is a commitment (layer 3).'
        correct: true
      - text: 'Established fact (layer 1): physics has proved closure.'
        feedback: |
          Physics works well without non-physical causes, but nobody has shown that none exist. Closure is a working assumption with a good track record.
      - text: 'A pure commitment (layer 3) with nothing behind it.'
        feedback: |
          That is unfair to the claim. A great deal of evidence ties experience to brain states, and closure has a strong record of success.
    explanation: |
      Separating the layers is the method: shared data (the brain and experience go together), a disagreement located in a premise (closure, or P2), and a commitment (what exists). Someone who drops P1 or P2 is not ignoring data; they weigh the same data differently.

  # ---------------- Problem 2 ----------------
  - type: numeric
    id: p2-born
    title: "Problem 2 · Quantum and Bell"
    prompt: |
      **Problem 2.** An electron's spin has the state with amplitudes $0.8$ for "up" and $0.6$ for "down". What is the probability, in percent, of measuring "down"?
    answer: 36
    tolerance: 0.5
    wrong:
      - { value: 60, feedback: '$0.6$ is the amplitude, not the probability. The probability is the squared size of the amplitude.' }
      - { value: 64, feedback: 'That is the probability of \"up\" ($0.8^2$). The question asks about \"down\".' }
    hint: Amplitudes are not probabilities.
    explanation: |
      $$P(\downarrow)=0.6^2=0.36=36\%$$
      The two probabilities, $64\%$ and $36\%$, add to $100\%$ as they must.

  - type: numeric
    id: p2-born2
    prompt: |
      A second spin has amplitudes $\tfrac{5}{13}$ for "up" and $\tfrac{12}{13}$ for "down". What is the probability of measuring "up", in percent?
    answer: 14.8
    tolerance: 0.2
    answerText: '$25/169 \approx 14.8\%$'
    wrong:
      - { value: 38.5, feedback: '$5/13 \approx 38.5\%$ is the amplitude as a percentage; the probability is the squared size.' }
      - { value: 85.2, feedback: 'That is the probability of \"down\" ($144/169$). The question asks about \"up\".' }
    hint: Check first that the two squares add to $1$.
    explanation: |
      $$\Big(\frac{5}{13}\Big)^2+\Big(\frac{12}{13}\Big)^2=\frac{25+144}{169}=1$$
      so the state is valid, and $P(\uparrow)=25/169\approx14.8\%$. Every view of the measurement problem agrees on these numbers; they disagree about what happens in the measurement.

  - type: numeric
    id: p2-sheet
    title: "A local instruction sheet"
    prompt: |
      A local hidden-value model gives each particle pair a sheet of pre-set outcomes, each $+1$ or $-1$: Alice's $A$ for direction $a$ and $A'$ for $a'$, Bob's $B$ for $b$ and $B'$ for $b'$. One pair has the sheet $A=+1,\ A'=-1,\ B=+1,\ B'=+1$. Compute the sheet's value
      $$s = A(B-B') + A'(B+B').$$
    answer: -2
    answerText: '$-2$'
    wrong:
      - { value: 0, feedback: 'The first term $A(B-B'')$ is $0$, but the second, $A''(B+B'')=(-1)(2)$, is not.' }
      - { value: 2, feedback: 'The size is right but the sign is not. Here $A''=-1$ and $B+B''=2$, so the term is $-2$.' }
    hint: Do the bracket first. One of the two brackets is $0$.
    explanation: |
      $$s = (+1)(1-1) + (-1)(1+1) = 0 - 2 = -2$$
      Every sheet gives exactly $+2$ or $-2$ (one bracket is $0$ and the other $\pm2$), so the average of $s$ over any mixture of sheets can never leave the interval from $-2$ to $2$. That is the local bound $|S|\le2$.

  - type: widget
    id: p2-lab
    title: "Measure the correlations"
    widget: chsh-lab
    review: false
    config:
      preset: free
      angles: { a: 0, aP: 90, b: 30, bP: 120 }
      draggable: false
      sliders: false
      show: { curve: false, gauge: false }
      readouts: [ab, abP, aPb, aPbP]
    body: |
      Alice measures along $a=0^\circ$ and $a'=90^\circ$, Bob along $b=30^\circ$ and $b'=120^\circ$, on singlet pairs. The readout gives the four correlations that quantum mechanics predicts for these directions. Combine them into $S = E(a,b) - E(a,b') + E(a',b) + E(a',b')$.

  - type: numeric
    id: p2-S
    prompt: |
      At the directions $a=0^\circ$, $a'=90^\circ$, $b=30^\circ$, $b'=120^\circ$, the singlet correlations are $E(a,b)=-0.866$, $E(a,b')=+0.5$, $E(a',b)=-0.5$ and $E(a',b')=-0.866$. Compute $S = E(a,b) - E(a,b') + E(a',b) + E(a',b')$.
    answer: -2.732
    tolerance: 0.01
    answerText: '$-2.73$'
    wrong:
      - { value: -1.732, feedback: 'That adds all four with a plus sign. The second term enters with a minus: $-E(a,b'')=-0.5$.' }
      - { value: -2.828, feedback: '$-2\sqrt2$ is the best possible value, reached at $a=0^\circ$, $a''=90^\circ$, $b=45^\circ$, $b''=135^\circ$. These directions are close but not the best.' }
    hint: Mind the minus sign in front of $E(a,b')$.
    explanation: |
      $$S=-0.866-0.5-0.5-0.866=-2.732$$
      So $|S|\approx2.73$, above the local bound $2$ and below the quantum maximum $2\sqrt2\approx2.83$ (at $b=45^\circ$, $b'=135^\circ$ it is $-2.83$).

  - type: mcq
    id: p2-meaning
    title: "What does $|S|>2$ show?"
    prompt: |
      Experiments (Aspect 1982, and the loophole-closing tests of 2015) find $|S|$ above $2$, as quantum mechanics predicts. Which conclusion follows from the number alone?
    options:
      - text: 'No theory satisfying all four assumptions (locality, hidden values, free choice, one outcome per run) can reproduce it. At least one assumption fails; the number does not say which.'
        correct: true
      - text: 'Locality fails: something travels faster than light between Alice and Bob.'
        feedback: |
          Locality is one of four assumptions. Giving up hidden values, free choice or the one-outcome rule also escapes the bound, so the number alone does not choose locality.
      - text: 'Quantum mechanics is refuted, because it breaks a bound that every sensible theory obeys.'
        feedback: |
          The bound holds only for theories with all four assumptions. Quantum mechanics predicts the violation and the experiments agree with it.
    explanation: |
      The result is established (layer 1). Which assumption to give up is a live debate (layer 2) and a metaphysical choice (layer 3).

  - type: mcq
    id: p2-match
    title: "Which assumption does each view drop?"
    prompt: |
      Match the view to the assumption it gives up to escape the bound $|S|\le2$.
    options:
      - text: 'Pilot wave (de Broglie, Bohm): locality, since a particle''s motion depends on distant settings. Many worlds (Everett): a single outcome per run, since all outcomes occur in branches. Superdeterminism: free choice, since the settings are correlated with the hidden values.'
        correct: true
      - text: 'Pilot wave: free choice. Many worlds: locality. Superdeterminism: hidden values.'
        feedback: |
          The pilot wave is a hidden-variable theory with a direct influence between the sides, so it keeps hidden values and gives up locality. Many worlds has no distant influence at all. Superdeterminism keeps locality and hidden values and denies that the settings are independent of them.
      - text: 'Pilot wave: one outcome. Many worlds: hidden values. Superdeterminism: locality.'
        feedback: |
          Each is moved to the wrong place. The pilot wave gives every run one outcome and has hidden positions; Many worlds has no hidden outcomes beyond the branches; superdeterminism keeps locality.
    explanation: |
      Each view pays a different price, so Bell's result separates them by what they give up, not by their predictions (all agree). Whether any of these costs is acceptable is a live debate. Superdeterminism is a minority route.

  - type: mcq
    id: p2-trap
    title: "Trap: does it allow signalling?"
    prompt: |
      Alice's outcomes alone look random (half up, half down) whatever Bob does. A student says: "Since Bell's result rules out local explanations, Bob can send Alice a message instantly by choosing his direction." Which reply is right?
    options:
      - text: 'No. Alice''s results on their own are the same whatever Bob chooses; the correlation shows up only when the two lists are compared, and that comparison travels at ordinary speed. Even the pilot wave, with its direct influence, allows no signalling.'
        correct: true
      - text: 'Yes, but only if Bob chooses his direction before Alice measures.'
        feedback: |
          The order does not matter. Alice sees the same random-looking statistics either way, so there is nothing for Bob to encode.
      - text: 'Yes; this is why relativity and quantum mechanics clash.'
        feedback: |
          The tension is real but subtler: relativity forbids signals faster than light, and quantum mechanics does not provide one. Whether a non-signalling influence is compatible in spirit with relativity is a live debate.
    explanation: |
      Bell nonlocality and faster-than-light signalling are different things. What is excluded is a local explanation with all four assumptions, not the consistency with relativity's ban on signals.

  # ---------------- Problem 3 ----------------
  - type: numeric
    id: p3-fsim
    title: "Problem 3 · Simulation and structure"
    prompt: |
      **Problem 3.** In Bostrom's argument, suppose $f_P = 0.2$ of civilizations reach the posthuman stage and $f_I = 0.005$ of those are interested in running ancestor-simulations. How many simulations $N_I$ must each interested civilization run, on average, for $f_{\text{sim}}$ to reach $90\%$?
    answer: 9000
    tolerance: 20
    wrong:
      - { value: 9, feedback: '$9$ is the value of $X = f_Pf_IN_I$ needed for $90\%$, not of $N_I$. Divide by $f_Pf_I = 0.001$.' }
      - { value: 900, feedback: 'Check the product $f_Pf_I$: $0.2\times0.005 = 0.001$, so $N_I = X/0.001$.' }
    hint: First find the value of $X$ that gives $90\%$ (that is, $X/(X+1)=0.9$), then divide by $f_Pf_I$.
    explanation: |
      $$\frac{X}{X+1}=0.9 \;\Rightarrow\; X=9$$
      $$N_I=\frac{9}{0.2\times0.005}=9000$$
      The number is modest next to what a posthuman civilization is imagined to afford, which is why the argument bites if (1) and (2) are false.

  - type: numeric
    id: p3-null
    prompt: |
      You hold equal credence (50%) that you are simulated or in base reality. A search finds no sign of a lattice. You think a null result has probability $0.9$ if you are simulated (a simulation need not use a lattice) and probability $1$ if you are not. What is your credence in "simulated" afterwards, in percent?
    answer: 47.4
    tolerance: 0.2
    answerText: '$0.9/1.9 \approx 47.4\%$'
    wrong:
      - { value: 90, feedback: '$0.9$ is the likelihood of the null result if simulated, not the posterior. Multiply the prior odds by the likelihood ratio, then turn odds into a probability.' }
      - { value: 50, feedback: 'The result is not exactly neutral: it is slightly more likely if you are not simulated, so credence moves a little.' }
    hint: Prior odds $1:1$; likelihood ratio is $0.9/1$.
    explanation: |
      $$\frac{P(\text{sim}\mid E)}{P(\text{real}\mid E)}=\frac{0.9}{1}\cdot\frac{1}{1}=0.9$$
      $$P(\text{sim}\mid E)=\frac{0.9}{1.9}\approx47.4\%$$
      A null result barely moves the odds, because a simulation need not leave that signature.

  - type: numeric
    id: p3-fresnel
    prompt: |
      Light at normal incidence goes from air into glass of refractive index $n=1.5$. Fresnel's elastic-ether theory and Maxwell's field theory, which pictures light very differently, give the same prediction for the fraction of light reflected. What is it, in percent?
    answer: 4
    tolerance: 0.1
    answerText: '$4.0\%$'
    wrong:
      - { value: 20, feedback: '$0.5/2.5 = 0.2$ is the ratio before squaring. The reflected fraction of the *intensity* is the square of it.' }
      - { value: 33.3, feedback: '$0.5/1.5$ uses the wrong sum: it is the difference $n-1$ over the sum $n+1 = 2.5$, then squared.' }
    hint: The result depends on the contrast between the two materials, $n-1$ against $n+1$, and the answer is a square.
    explanation: |
      $$R=\Big(\frac{n-1}{n+1}\Big)^2=\Big(\frac{0.5}{2.5}\Big)^2=0.04=4.0\%$$
      The same equation survives the change of picture (elastic ether to field). That continuity of structure is what structural realism builds on; whether it generalizes is a live debate.

  - type: numeric
    id: p3-newman
    prompt: |
      A structuralist says "the world has a certain structure". Newman's objection counts the possible binary relations (sets of ordered pairs) on a set of $n$ objects. For a set of $n=4$ objects, how many binary relations are there?
    answer: 65536
    answerText: '$2^{16}=65{,}536$'
    wrong:
      - { value: 16, feedback: '$16$ is the number of ordered pairs ($4\times4$). A relation is any *subset* of the ordered pairs, and each pair is in or out.' }
    hint: 'Count the ordered pairs first. For each pair, ask whether it is in the relation or not.'
    explanation: |
      With $16$ ordered pairs and two choices each, $2^{16}=65{,}536$ relations. Almost any pattern of size $4$ is realized by some relation, so "has structure $S$" says little beyond "has four objects", unless real structure is more than a bare pattern (causal, law-governed). Defenders reply along those lines.

  - type: text
    id: p3-table
    title: "Which view survives which puzzle?"
    body: |
      Putting the three problems side by side (a summary of the reading used in this level, not a verdict):

      | Puzzle | Pays or keeps | Where people part |
      |---|---|---|
      | Closure | Interactionism drops P1, epiphenomenalism P2; emergence adds laws | Is closure a finding or an assumption? |
      | Bell | Pilot wave drops locality, many worlds one outcome | Which price is acceptable? |
      | Simulation, structure | Any premise can be rejected; structure survives theory change in the Fresnel case | Does the pattern generalize? |

  - type: mcq
    id: p3-parts
    title: "Where thoughtful people part ways"
    prompt: |
      Two people accept every number in these three problems: $239$ K, $-2.73$, $9000$ simulations, $4\%$. One favors the pilot wave and interactionism, the other many worlds and physicalism. What kind of disagreement is it?
    options:
      - text: 'A disagreement about which premise to give up and what exists (layers 2 and 3). The data are shared; the weighing of costs and the metaphysical commitments differ.'
        correct: true
      - text: 'A disagreement of fact (layer 1): one of them has miscalculated.'
        feedback: |
          They agree on all the calculations. What differs is which price to pay for the same data.
      - text: 'There is no real disagreement: the views make different predictions and experiments will decide.'
        feedback: |
          On the Bell test and the Born rule all the standard views give the same predictions. Experiments have not decided between them.
    explanation: |
      That is the method of the course: find the premise or value where views part, name the layer, and see the cost of each choice.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Closure, located**: given Kim's three premises (P1 closure, P2 mental causes, P3 no overdetermination), interactionism drops P1, epiphenomenalism drops P2, strong emergence adds causes of its own; panpsychism and idealism change what "physical" and "mental" mean. A temperature of $239$ K from four atoms is a reduction, not strong emergence.
      - **Quantum and Bell**: probability is the squared amplitude (for $\tfrac{5}{13},\tfrac{12}{13}$: $14.8\%$ and $85.2\%$). Every local sheet gives $s=\pm2$, so $|S|\le2$; the singlet at $0^\circ,90^\circ,30^\circ,120^\circ$ gives $S\approx-2.73$ and at the best angles $-2\sqrt2$. Dropping locality (pilot wave), one outcome (many worlds) or free choice (superdeterminism) escapes; there is no signalling.
      - **Simulation and structure**: $f_{\text{sim}}=X/(X+1)$ needs $N_I=9000$ for $90\%$ in the case above; a null result barely moves the odds ($47.4\%$ from $50\%$). Fresnel's reflection $R=(\frac{n-1}{n+1})^2=4\%$ for glass survives theory change; Newman counts $2^{16}=65{,}536$ relations on four objects.
      - **Layers**: numbers are fact; which premise to drop is a live debate; what exists is a commitment.

      **Next:** part 2 has problems 4 and 5, then the level audit.
