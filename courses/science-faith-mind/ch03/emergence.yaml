id: ch03-emergence
title: "Emergence and Reduction"
kind: concept
own: |
  - **Whole and part.** A property of a whole is **emergent** when the whole has it but no single part does, as a crowd can be noisy though no person is the noise. The question is then how the whole-level fact stands to the part-level facts. **Reduction** means {{ the higher-level fact is nothing over and above the lower-level facts: it can be explained or deduced from them }}. Emergence is the claim that this fails in some sense.
  - **Reduction by identification: temperature.** For a gas of $N$ atoms, each of mass $m$ with speed $v_i$, at absolute temperature $T$ (in kelvin), and with $k$ the Boltzmann constant ($k = 1.38\times10^{-23}$ J/K),
  $$\tfrac12\, m\,\langle v^2\rangle = \tfrac32\, k\,T$$
  where $\langle v^2\rangle$ is the average of $v_i^2$ over the atoms. {{ Temperature is (proportional to) the average kinetic energy of the atoms }}. A single atom has no temperature; the property belongs to the ensemble, yet it is fully deduced from the parts. Five helium atoms ($m = 6.646\times10^{-27}$ kg) with speeds 1000, 1200, 1300, 1400, 1600 m/s give $\langle v^2\rangle = 1.73\times10^{6}$ m$^2$/s$^2$ and $T \approx 278$ K.
  - **Weak emergence.** A higher-level pattern is **weakly emergent** when {{ it follows from the lower-level laws in principle, but can be found in practice only by running the whole process }}, and is not visible in the rules. Example: Conway's Game of Life, on a grid of cells each live or dead, where a dead cell with exactly 3 live neighbours (of 8) is born and a live cell with 2 or 3 live neighbours survives (otherwise it dies or stays dead). The **glider**, a five-cell shape that repeats every 4 generations one cell down and right, is mentioned by no rule.
  - **Strong emergence.** A property is **strongly emergent** when, according to its defenders, {{ it is not deducible even in principle from the complete lower-level facts and laws, and it has new causal powers of its own (downward causation) }}. Strong emergence needs new fundamental laws linking the levels, and it conflicts with **causal closure** (every physical effect has a sufficient physical cause), the premise of the closure argument met in the lessons Matter Is All There Is? and Two Kinds of Stuff: Dualism. A strong emergentist rejects closure for higher-level causes.
  - **Emergence versus panpsychism, and where people part ways.** The hard-problem worry is that physical facts do not entail what experience is like. Strong emergentists answer: experience {{ appears at a level of complexity under a new brute law }}. Panpsychists answer that it is there from the start, so nothing needs to emerge. Layers: weak emergence is established science; whether consciousness is weakly or strongly emergent, or neither, is a live debate; each answer carries a metaphysical commitment.
cards:
  - type: mcq
    id: hook
    title: "Is wetness in the molecule?"
    prompt: |
      Guess before any theory. A glass of water is wet. A single water molecule ($\text{H}_2\text{O}$: one oxygen atom and two hydrogen atoms) is not: you cannot wet your finger with one molecule. Where does the wetness come from?
    options:
      - text: 'From the molecules and how they interact in large numbers; nothing else is needed, though no single molecule has it.'
        correct: true
      - text: 'It is in every molecule, a tiny bit of wetness each, and the glass just adds them up.'
        feedback: |
          Wetness does not add like mass does. A single molecule has no wetness at all, not a small amount. It is a property of how many molecules cling, flow and slide past each other.
      - text: 'It is a new ingredient that appears when enough molecules gather, beyond what the molecules do.'
        feedback: |
          This is the strong reading of emergence, defended for some properties, not for wetness: for water, scientists can explain wetness from molecular forces. The lesson separates the two readings.
    explanation: |
      There is no single right answer to guess here: the three options are the three views of the lesson. Wetness is a standard case where physics supplies the explanation (the first view). The interesting question is whether *every* higher-level property is like wetness.

  - type: text
    id: define
    title: "Wholes, parts and reduction"
    body: |
      A **whole** is a system made of **parts** (a glass of water and its molecules, a brain and its neurons). A property is **emergent**, in the loose sense, when the whole has it but no single part does.

      The philosophical question is how the whole-level fact stands to the part-level facts. **Reduction** is the view that the higher-level fact is *nothing over and above* the lower-level ones: it can be explained, or even deduced, from the parts, their properties and the laws that govern them. Emergence is the claim that reduction fails in some way, and there are two sharply different ways:

      - **Weak emergence**: the whole-level pattern *does* follow from the lower-level laws in principle, but is surprising or hard to predict; nothing new is added to the world.
      - **Strong emergence**: the whole-level property does *not* follow, even in principle, from the complete lower-level facts and laws; something new, with its own causal powers, appears.

      Almost everyone accepts the first. Almost the whole debate about mind is over the second.

  - type: mcq
    id: additive
    title: "Merely adding up"
    prompt: |
      A table is made of $10^{26}$ atoms. Its total mass is the sum of the masses of its atoms (up to tiny binding-energy corrections). Is the table's mass an *emergent* property in the interesting sense, a whole-level property that the parts lack?
    options:
      - text: 'No: it is a plain sum of the parts'' masses, so the parts have it too, in small pieces.'
        correct: true
      - text: 'Yes: no single atom has the mass of a table.'
        feedback: |
          That is true but not the point. A single atom has *some* mass, and the total is built by adding those masses. Having a larger amount of the same quantity is not a new kind of property.
      - text: 'Yes: mass is only defined for whole objects, not for atoms.'
        feedback: |
          Atoms have mass too, measured with great precision. The claim that mass belongs only to wholes is a misconception.
    explanation: |
      The interesting cases are properties like temperature and wetness that parts *lack altogether*, not ones they have in small amounts. Next: a case small enough to compute.

  - type: text
    id: gas
    title: "A worked example: temperature"
    body: |
      A single atom of a gas flies at some speed; it has a kinetic energy ($\tfrac12 m v^2$ for mass $m$ and speed $v$) but no **temperature**: you cannot say that one atom is hot. Yet a gas has one. The standard result of kinetic theory (established science) is

      $$\tfrac12\, m\,\langle v^2\rangle = \tfrac32\, k\,T$$

      where $\langle v^2\rangle$ is the average of the squared speeds over all atoms, $T$ is the temperature in kelvin, and $k = 1.38\times10^{-23}$ J/K is the Boltzmann constant. Temperature *is*, up to constants, the average kinetic energy of the atoms.

      Take five helium atoms of mass $m = 6.646\times10^{-27}$ kg with speeds $1000, 1200, 1300, 1400, 1600$ m/s (a toy sample; real gases have about $10^{23}$).

  - type: numeric
    id: avg-v2
    title: "The average of the squares"
    prompt: |
      Five helium atoms move at 1000, 1200, 1300, 1400 and 1600 m/s. What is $\langle v^2\rangle$, the average of the five squared speeds, in units of $10^{6}$ m$^2$/s$^2$?
    answer: 1.73
    tolerance: 0.005
    wrong:
      - { value: 1.3, feedback: 'That is about the average speed squared on its own ($1300^2 = 1.69$) or close to it. The average of the squares is larger than the square of the average: fast atoms count more.' }
    hint: 'Square each speed in units of 1000 m/s: 1, 1.44, 1.69, 1.96, 2.56. Then average the five numbers.'
    explanation: |
      $1 + 1.44 + 1.69 + 1.96 + 2.56 = 8.65$, and $8.65/5 = 1.73$ in units of $10^6$ m$^2$/s$^2$. The average of the squares (1.73) beats the square of the average speed ($1300^2 \to 1.69$) because of the spread.

  - type: numeric
    id: temp
    title: "Reading off the temperature"
    prompt: |
      Five helium atoms (mass $m = 6.646\times10^{-27}$ kg) have $\langle v^2\rangle = 1.73\times10^{6}$ m$^2$/s$^2$. Using $\tfrac12 m\langle v^2\rangle = \tfrac32 kT$ with $k = 1.38\times10^{-23}$ J/K, what is the temperature $T$ in kelvin?
    answer: 278
    tolerance: 1
    hint: 'Solve for $T$: multiply both sides by $2/(3k)$, so $T = m\langle v^2\rangle/(3k)$. The top is about $1.15\times10^{-20}$ J.'
    explanation: |
      $$\begin{aligned} T &= \frac{m\langle v^2\rangle}{3k} \\ &\approx \frac{1.15\times10^{-20}}{4.14\times10^{-23}} \\ &\approx 278\ \text{K} \end{aligned}$$

      about 5 degrees Celsius. The mean kinetic energy per atom is $\tfrac12 m\langle v^2\rangle \approx 5.7\times10^{-21}$ J.

  - type: mcq
    id: one-atom
    title: "Temperature of one atom?"
    prompt: |
      Take just the fastest atom in the sample (1600 m/s) and apply the same formula to it alone, treating $\langle v^2\rangle$ as its own $v^2$. You get about 460 K, while the five atoms together give 278 K. What does this show about temperature?
    options:
      - text: 'Temperature is a property of the ensemble: it is defined from the spread of speeds over many atoms, and a single atom''s number is meaningless as a temperature.'
        correct: true
      - text: 'The formula is wrong, because two samples of the same gas should always give the same temperature.'
        feedback: |
          The formula is fine. Different samples with different speed spreads have different temperatures, and one atom is not a sample of a gas at all. The formula applies to the average over many atoms.
      - text: 'The fastest atom is hotter than the others, and the gas temperature is its average.'
        feedback: |
          Atoms do not carry individual temperatures. Individual speeds change at every collision; the temperature is a stable property of the whole group.
    explanation: |
      This is **reduction by identification**: temperature is deduced from, and identified with, a property of the parts (their mean kinetic energy), yet it exists only for the group. The whole-level property is real, useful and fully explained by the parts. Nothing new needs adding.

  - type: text
    id: weak
    title: "Weak emergence: predictable, but not visible"
    body: |
      Temperature is easy to deduce. Some higher-level patterns are not: they follow from the rules *in principle*, yet nothing in the rules hints at them, and the only known way to find out what happens is to run the process. Philosophers call this **weak emergence** (a term used in this sense by Mark Bedau, b. 1952, among others).

      The classic toy is **Conway's Game of Life** (John Conway, 1937-2020, 1970). A grid of square cells, each live or dead. In each step every cell counts its live neighbours among its 8 surrounding cells:

      - A dead cell with exactly 3 live neighbours becomes live.
      - A live cell with 2 or 3 live neighbours stays live; with fewer or more it dies.

      That is the whole law. Run the grid on the next card.

  - type: widget
    id: glider
    widget: cellular-automaton
    config: { width: 10, height: 10, preset: glider, buttons: [step, reset], count: false }
    review: false
    body: |
      Five live cells form a small shape. Press **Step** repeatedly and watch the shape for eight steps. Press **Reset** to start again. Watch what happens to the shape, not to any one cell.

  - type: mcq
    id: glider-q
    title: "A thing that moves"
    review: false
    prompt: |
      In the grid just run, the five-cell shape changes form on each step, yet after 4 steps it has the same shape again, shifted. Which statement is correct?
    options:
      - text: 'The shape is the same after 4 steps but one cell further down and to the right; so it keeps drifting in that direction, though no rule says anything about moving.'
        correct: true
      - text: 'The shape stays where it is and only changes its form, because cells in the rules never move.'
        feedback: |
          Individual cells never move, that part is right: they are born and die in place. But the shape, the pattern, does move diagonally. That is the point of the example.
      - text: 'The shape moves because some rule says "move down and right".'
        feedback: |
          Look at the rules on the previous card: they say only when a single cell is born, lives or dies. Nothing mentions shapes or motion. The motion is a consequence, not an instruction.
    explanation: |
      The rules talk only about cells and neighbour counts. The shape that travels, the **glider**, is a pattern one level above them, with a behaviour (a diagonal speed of one cell per four steps) that appears nowhere in the law.

  - type: mcq
    id: shortcut
    title: "Predictable, but how?"
    prompt: |
      In the Game of Life the rules are completely known and fully deterministic: the state at step $n+1$ follows exactly from the state at step $n$. According to the weak-emergence view, what is the status of a glider's behaviour on a very large, complicated starting grid?
    options:
      - text: 'It follows from the rules in principle, but in general the only way to find out what a complicated grid does is to run it; no known shortcut is guaranteed.'
        correct: true
      - text: 'It is unpredictable in principle: the rules leave the outcome open, so something beyond the rules is needed.'
        feedback: |
          The rules leave nothing open: the same start always gives the same result. Hard to predict does not mean the rules fail to determine it. That slip is the difference between weak and strong emergence.
      - text: 'It is easy to predict at a glance, because the rules are so simple.'
        feedback: |
          Simple rules can give very complicated behaviour. It has been shown that Life can run any computation, and so asking what a general large grid will eventually do is as hard as general computing questions.
    explanation: |
      Weak emergence: **deducible in principle, not in practice by a shortcut**. Nothing is added to the world beyond the rules. In Life it is even true that the higher-level objects (gliders, and machines made of them) have a real, repeatable, describable life of their own, and a good description at that level is useful. Whether that makes them "real" is a question for philosophers; whether they follow from the rules is not.

  - type: text
    id: strong
    title: "Strong emergence and downward causation"
    body: |
      **Strong emergence** is a bolder claim. According to its defenders (the British emergentists such as C. D. Broad, 1887-1971, in *The Mind and Its Place in Nature*, 1925, and some contemporary philosophers), some higher-level properties:

      - are **not deducible**, even in principle, from the complete lower-level facts and laws: a new law is needed to say when they appear; and
      - have **new causal powers**: they make a difference to what the parts do. This is called **downward causation**, the whole pushing back on its parts.

      Compare it with the closure argument met in the lessons *Matter Is All There Is?* and *Two Kinds of Stuff: Dualism*: P1 every physical effect has a sufficient physical cause (closure); P2 mental events cause physical events; P3 these are not two separate full causes of the same effect (no overdetermination). If the mental is something over and above the physical, the three seem to clash.

      The strong emergentist and the dualist both deny the *reduction*, but a strong emergentist keeps one world and one kind of stuff, with a new level of law.

  - type: mcq
    id: kim
    title: "Which premise does the strong emergentist reject?"
    prompt: |
      Take the closure argument: P1 every physical effect has a sufficient physical cause; P2 mental events cause physical events; P3 a physical effect is not caused twice over by two separate sufficient causes. A strong emergentist holds that a mental property is a genuinely new causal power of the whole brain. Which premise does this view most naturally reject?
    options:
      - text: 'P1, in its strong form: if the whole has new causal powers, the lower-level physical causes alone are not always sufficient.'
        correct: true
      - text: 'P2: mental events never cause anything.'
        feedback: |
          That is the epiphenomenalist's move. The strong emergentist wants the new level to be *causally real*, which is the whole point of calling it strong.
      - text: 'P3: every effect has exactly two sufficient causes, a physical one and a mental one.'
        feedback: |
          Accepting overdetermination is a real option (some philosophers do), but it is not what strong emergence says. Downward causation is a claim that the higher level changes what the lower level does, not that there is a second, redundant cause.
    explanation: |
      The price: physics, in its current form, would be incomplete, since the behaviour of the particles in a brain would depend on a whole-level law. Critics say there is no evidence for this in neuroscience so far; defenders say we have not looked at the right level. **Layer:** a live debate, resting on a metaphysical commitment.

  - type: text
    id: argument
    title: "Emergence and the hard problem"
    body: |
      Why does strong emergence matter for the mind? One reconstruction (inspired by David Chalmers, b. 1966):

      - **P1.** Knowing every physical fact about a brain would not, by deduction alone, tell us what it is like to have its experiences (the *hard problem of consciousness*, studied in a later lesson).
      - **P2.** If experience were weakly emergent, it would follow from those physical facts in principle, as temperature follows from molecular speeds.
      - **C.** So experience, if it is emergent at all, is strongly emergent.

      Weak emergence explains many high-level facts: wetness, temperature, gliders, perhaps even much of what brains do (memory, speech). The question is whether *experience itself* is of this kind.

  - type: mcq
    id: critic
    title: "Which premise would a critic reject, and why?"
    prompt: |
      A physicalist critic of the argument above accepts that the argument is valid. Which premise would they reject, and what would they say?
    options:
      - text: 'P1: once we understand the brain well enough, the feeling that experience does not follow will fade, as the same feeling about "life" faded after biochemistry explained it.'
        correct: true
      - text: 'P2: if experience were weakly emergent it would not follow from the physical facts, even in principle.'
        feedback: |
          This reverses the definition. Weak emergence means the higher-level fact *does* follow in principle. Rejecting P2 in this form would just change the meaning of the word.
      - text: 'The conclusion: strong emergence is impossible because the universe contains only one level.'
        feedback: |
          That is an objection to the conclusion, not to a premise. It needs an argument against strong emergence that does not simply assume the answer. The usual such argument is the causal closure argument (every physical effect has a sufficient physical cause).
    explanation: |
      The critic's analogy: vitalists once said no physical description could explain life, and biochemistry showed otherwise. The defender replies that life was defined by behaviour (growing, reproducing), which physics could explain, while experience is exactly the inner aspect behaviour leaves out. Both replies are live; which one looks right depends on whether one thinks a gap is a fact about the world or a limit of present understanding.

  - type: mcq
    id: panpsychism
    title: "Emergence or panpsychism?"
    prompt: |
      Both the strong emergentist and the panpsychist hold that experience does not follow from the structure and dynamics of matter alone. How does their answer to *where experience comes from* differ?
    options:
      - text: 'The strong emergentist says experience appears at some level of complexity, by a new brute law; the panpsychist says it was there in the simplest things all along, so nothing has to emerge.'
        correct: true
      - text: 'The strong emergentist says experience is an illusion; the panpsychist says it is real.'
        feedback: |
          Both treat experience as real. Saying it is an illusion is the eliminativist's position, which neither holds.
      - text: 'They agree that experience is there at every level; they disagree only about its name.'
        feedback: |
          They disagree on exactly this: the emergentist denies that the simplest things have any experience.
    explanation: |
      Each pays a price. The emergentist must accept a sudden appearance with no explanation (a "brute" law). The panpsychist must accept that simple things have some experience, and then explain how many tiny experiences make one (the combination problem, met in the lesson *Mind in Everything? Panpsychism and Neutral Monism*).

  - type: mcq
    id: return
    title: "Back to the glass of water"
    prompt: |
      Back to the hook: one water molecule is not wet; a glass of water is. According to the three readings (reduction, weak emergence, strong emergence), how do physicists treat wetness?
    options:
      - text: 'As explained by the molecules and their forces (molecules cling to each other and to surfaces and flow past each other): at most weak emergence, with nothing new added.'
        correct: true
      - text: 'As strongly emergent: no description of molecules could ever explain it.'
        feedback: |
          Wetness and surface tension are explained from molecular forces, and calculated in the lab. The strong claim is not made for them.
      - text: 'As a property of each molecule, because the whole is just the parts added.'
        feedback: |
          One molecule is not wet. The property belongs to how many molecules interact, not to a single one. Adding does not explain it; the interactions do.
    explanation: |
      Wetness sits with temperature on the reduction side. The deep debate is whether consciousness sits with them (explainable from the parts), with the glider (derivable, but surprising), or in a class of its own (strong emergence, or a basic feature of the world as panpsychism says).

  - type: text
    id: summary
    body: |
      **Next:** what quantum mechanics does and does not say. The word "quantum" is often invoked in this very debate, to rescue free will, consciousness or the soul. The lesson separates what the theory predicts, what its competing interpretations add, and what the measurement problem leaves open.
