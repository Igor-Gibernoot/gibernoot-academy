id: ch03-intuition
title: Quick Recall
kind: intuition

cards:
  - type: text
    id: welcome
    title: "Quick recall: which world are we in?"
    body: |
      This round **derives nothing**. It is for fast recall of the main ideas of the level: what physicalism, dualism, idealism and panpsychism claim, how emergence is meant, the four readings of quantum theory, Bell's test, the simulation argument and structural realism.

      Four kinds of card: **mnemonics** (the shape of an idea), **build cards** (assemble a formula), **checks** (does it behave sensibly at the extremes?) and **distinctions** (who says what). Then small applied cases give you data only: choose the right tool yourself.

      As always, answers are given *according to* a thinker or a view. Nothing here asks which picture of reality is true.

  - type: mcq
    id: supervenience
    title: "The supervenience slogan"
    prompt: |
      According to physicalists, the mental **supervenes** on the physical. Which slogan states this correctly?
    options:
      - text: No difference in the mental without a difference in the physical; two possible worlds exactly alike physically are alike mentally.
        correct: true
      - text: Whatever is mental is the same thing as some physical event, one to one.
        feedback: |
          That is the stronger claim of identity. Supervenience is weaker: it says only that the mental cannot differ unless the physical differs, and leaves open whether the two are identical.
      - text: No difference in the physical without a difference in the mental.
        feedback: |
          The direction is reversed. Two different brain states may feel the same; supervenience only forbids the mental from changing while the physical stays fixed.
      - text: The mental is caused by the physical, and the physical is never affected by the mental.
        feedback: |
          That describes epiphenomenalism, a claim about causation. Supervenience is a claim about what can vary together, with no direction of cause.
    explanation: |
      Mnemonic: **no mental difference without a physical one**. Most dualists deny it: a world physically identical to ours might lack experience. Idealists turn it round: the physical supervenes on the mental.

  - type: order
    id: kim-closure
    title: "The closure argument"
    prompt: |
      According to Jaegwon Kim (1934-2019), a non-physical mind has no causal work left. Put his argument in order.
    steps:
      - "P1, causal closure: every physical event that has a cause has a sufficient physical cause."
      - "P2, mental causation: mental events (a decision) cause physical events (the arm rises)."
      - "P3, no systematic overdetermination: a physical effect is not regularly caused twice over, once by a physical cause and once by a separate mental one."
      - "C: the mental cause must itself be physical, or it does no work."
    hint: Two premises about causes, one that forbids a double cause, then the conclusion.
    explanation: |
      A critic can reject any premise. That is the whole point of the next card: each dualist reply drops one.

  - type: mcq
    id: dualist-replies
    title: "Which premise does each reply drop?"
    prompt: |
      Kim's three premises are P1 (causal closure), P2 (mental events cause physical events) and P3 (no systematic overdetermination). Which pairing of a dualist reply with the premise it gives up is right?
    options:
      - text: Interactionism drops P1 (a mind steers matter, for instance through quantum events); epiphenomenalism drops P2 (the mind causes nothing).
        correct: true
      - text: Interactionism drops P2; epiphenomenalism drops P1.
        feedback: |
          Swapped. Interactionists keep mental causation and give up closure; epiphenomenalists keep closure and give up mental causation.
      - text: Epiphenomenalism drops P3, because the mind is a second cause of every action.
        feedback: |
          Epiphenomenalism says the mind is *not* a cause at all. Accepting two causes for the same effect would be denying P3, a different move.
      - text: Parallelism (Leibniz) keeps all three premises and says the mind pushes the body harder.
        feedback: |
          Parallelism (and occasionalism, Malebranche) deny that mind and body act on each other directly: they agree because it was arranged in advance, or because God arranges it at each moment.
    explanation: |
      Mnemonic: **interaction drops closure, epiphenomenalism drops mental cause**. Each reply has a price: the first conflicts with physics as usually practised, the second makes experience idle.

  - type: build
    id: esse
    title: "Berkeley's slogan"
    prompt: |
      According to George Berkeley (1685-1753), for a sensible thing (a table, a colour) to be is to be perceived. Complete the Latin slogan: *esse est ...*
    prefix: '\text{esse est }'
    tiles: ['\text{percipi}', '\text{cogitare}', '\text{creari}', '\text{percipere}']
    answers:
      - ['\text{percipi}']
    wrong:
      - answer: ['\text{percipere}']
        feedback: |
          *Percipere* is the active "to perceive", which would describe the mind that perceives. The slogan is about the thing: its being is *to be perceived* (*percipi*, passive).
      - answer: ['\text{cogitare}']
        feedback: |
          *Cogito* ("I think") is Descartes, whose point is that the thinker exists. Berkeley's claim is about what it takes for a *sensible thing* to exist.
    hint: Passive form of the verb "perceive".
    explanation: |
      The slogan is *esse est percipi*. His argument: P1 we perceive only ideas, P2 an idea exists only in a mind, P3 sensible things are what we perceive, so they exist only in minds. Critics reject P1 or the step from "cannot be conceived unperceived" to "cannot exist unperceived".

  - type: mcq
    id: idealisms
    title: "Four idealisms"
    prompt: |
      Idealism says mind (experience) is fundamental. Which list matches each thinker to the right kind?
    options:
      - text: Berkeley, subjective (things are ideas in minds); Kant, transcendental (we know appearances, not things in themselves); Hegel, absolute (reality is one rational spirit); Kastrup, analytic (one universal mind with dissociated parts).
        correct: true
      - text: Berkeley, transcendental; Kant, subjective; Hegel, analytic; Kastrup, absolute.
        feedback: |
          Scrambled. Kant's word *transcendental* means about the conditions of our knowing; he keeps an outer world, so he is not Berkeley.
      - text: All four hold that nothing exists apart from what a human perceives, and differ only in vocabulary.
        feedback: |
          Kant keeps things in themselves (unknowable); Hegel and Kastrup put the mind behind everything, not in each human head. The kinds differ in substance.
      - text: Kant holds that matter is real and mind is a by-product, which is why his view is called idealism.
        feedback: |
          Kant's idealism is about knowledge: space, time and causation are the mind's contribution to appearances. He does not say matter produces mind.
    explanation: |
      Mnemonic: **subjective, transcendental, absolute, analytic**, in the order Berkeley, Kant, Hegel, Kastrup. The unthought tree: Berkeley (traditionally) says God perceives it; phenomenalists say it is the experiences that *would* occur.

  - type: mcq
    id: pan-family
    title: "Panpsychism and its relatives"
    prompt: |
      Physics describes matter by structure and dynamics (what it does and relates to). Which statement about the panpsychist family is right?
    options:
      - text: Panpsychism gives the basic things a simple form of experience; panprotopsychism gives them precursor properties that are not experiences but combine into experience; neutral monism makes one neutral stuff the root of both mind and matter.
        correct: true
      - text: Panpsychism says electrons think; panprotopsychism says only brains are conscious.
        feedback: |
          Panpsychists claim only a very simple form of experience, not thought. Panprotopsychism does not restrict consciousness to brains; it says the basic properties are precursors of experience.
      - text: The combination problem asks how a brain moves the body.
        feedback: |
          That is the interaction problem of dualism. The combination problem asks how many micro-experiences make one unified experience (a hundred people each feeling something is not one person feeling a hundred things).
      - text: Neutral monism is a version of dualism because it speaks of two aspects.
        feedback: |
          Monism means one kind of stuff. The two aspects (mental and physical) are two ways the single neutral stuff appears or is organised.
    explanation: |
      Mnemonic: **experience itself / precursor of experience / neutral root**. The price of all three is the combination problem, answered by constitutive views, integrated information (Tononi) or cosmopsychism.

  - type: build
    id: temperature
    title: "Build the temperature rule"
    prompt: |
      For a gas of atoms each of mass $m$, with average squared speed $\langle v^2\rangle$, at absolute temperature $T$ (kelvin) and Boltzmann constant $k$, the average kinetic energy per atom equals a multiple of $kT$. Assemble the right side.
    prefix: '\tfrac12\,m\langle v^2\rangle='
    tiles: ['\tfrac32\,kT', '\tfrac32\,k/T', '3kT', '\tfrac12\,kT']
    answers:
      - ['\tfrac32\,kT']
    wrong:
      - answer: ['\tfrac12\,kT']
        feedback: |
          That counts one direction of motion only. An atom moves in three directions, each worth $\tfrac12 kT$ on average, so the total is $\tfrac32 kT$.
      - answer: ['\tfrac32\,k/T']
        feedback: |
          Hotter gas has faster atoms, so energy must grow with $T$, not shrink.
    hint: Three directions of motion, half a $kT$ each.
    explanation: |
      Temperature is (proportional to) the average kinetic energy of the atoms: a property of the crowd that is fully deduced from the parts. This is the model case of **reduction**.

  - type: numeric
    id: temp-numeric
    title: "Five helium atoms"
    prompt: |
      Five helium atoms (mass $6.646\times10^{-27}$ kg each) have speeds $1000$, $1200$, $1300$, $1400$ and $1600$ m/s. The Boltzmann constant is $1.38\times10^{-23}$ J/K. What temperature, in kelvin, does this little gas have? Give the nearest whole number.
    answer: 278
    tolerance: 0.01
    answerText: '278'
    wrong:
      - { value: 8.3, feedback: "That is about the root-mean-square speed in units of 100 m/s, not a temperature. Link the average kinetic energy to $kT$ with the right numerical factor." }
    hint: Average the squares of the speeds first, then connect average kinetic energy to temperature (the three directions of motion matter).
    explanation: |
      The average of the squares is $(1.00+1.44+1.69+1.96+2.56)\times10^6/5=1.73\times10^6$ m$^2$/s$^2$. Then $T=m\langle v^2\rangle/(3k)\approx 278$ K. A single atom has no temperature; the property belongs to the ensemble yet follows from the parts.

  - type: mcq
    id: temp-scaling
    title: "Scaling check"
    prompt: |
      Every atom in a gas speeds up to twice its speed. By what factor does the absolute temperature change?
    options:
      - text: It multiplies by 4.
        correct: true
      - text: It doubles.
        feedback: |
          Temperature tracks the *kinetic energy*, which goes as speed squared. Doubling the speeds quadruples the energy.
      - text: It does not change, because the number of atoms is the same.
        feedback: |
          The number of atoms is not what temperature measures; the average energy per atom is, and it changed.
      - text: It multiplies by $\sqrt2$.
        feedback: |
          That is the inverse relation: speeds go as $\sqrt T$, so doubling the speed needs four times $T$, not $\sqrt2$.
    explanation: |
      Speeds go as $\sqrt T$, so $T\propto v^2$. Scaling checks like this catch a misremembered power at once.

  - type: mcq
    id: emergence-kinds
    title: "Weak and strong emergence"
    prompt: |
      A pattern appears at the level of the whole (a glider in Conway's Game of Life; perhaps consciousness). Which pairing is right?
    options:
      - text: 'Weak emergence (Bedau): deducible from the lower-level laws in principle but found in practice only by running the process. Strong emergence (Broad): not deducible even in principle, and with its own downward causation.'
        correct: true
      - text: 'Weak emergence: not deducible in principle. Strong emergence: deducible but very complicated.'
        feedback: |
          Reversed. "Weak" here means compatible with the lower-level laws determining everything; "strong" needs new fundamental laws.
      - text: Both mean that the whole is a mysterious extra substance.
        feedback: |
          Weak emergence is established science and involves no extra substance. Even strong emergence is a claim about new laws and powers, not necessarily a substance.
      - text: Strong emergence is compatible with causal closure; weak emergence is not.
        feedback: |
          Again reversed. Downward causation from a new level conflicts with closure (every physical effect has a sufficient physical cause); weak emergence does not.
    explanation: |
      Mnemonic: **weak = surprising but derivable; strong = not derivable, new law, rejects closure**. Panpsychists add a third answer: experience is there from the start, so nothing needs to emerge.

  - type: build
    id: born
    title: "Build the Born rule"
    prompt: |
      A spin is in the state $a|{\uparrow}\rangle+b|{\downarrow}\rangle$, where $a$ and $b$ are its amplitudes. Assemble the probability of measuring "up".
    prefix: 'P(\uparrow)='
    tiles: ['|a|^2', '|a|', 'a+b', '|b|^2']
    answers:
      - ['|a|^2']
    wrong:
      - answer: ['|a|']
        feedback: |
          Amplitude is not probability. The sizes of the amplitudes themselves would not add up to 1 in general, but their squares do: $|a|^2+|b|^2=1$.
      - answer: ['|b|^2']
        feedback: |
          That is the probability of "down", the other outcome.
    hint: Square the size of the amplitude of that outcome.
    explanation: |
      The probability of an outcome is the squared size of its amplitude. All four interpretations agree on this prediction.

  - type: numeric
    id: born-numeric
    title: "Amplitudes 0.6 and 0.8"
    prompt: |
      An electron's spin state has amplitude $0.6$ for "up" and $0.8$ for "down" (the two amplitudes are real numbers). You measure it. What is the probability, as a decimal, of finding "down"?
    answer: 0.64
    tolerance: 0.001
    answerText: '0.64'
    wrong:
      - { value: 0.8, feedback: "Amplitude is not probability. Probabilities add up to 1, and $0.6+0.8=1.4$ does not." }
      - { value: 0.36, feedback: "That is the probability of the other outcome, 'up'." }
    hint: The two probabilities must add up to 1; amplitudes themselves do not.
    explanation: |
      $0.8^2=0.64$ for down and $0.6^2=0.36$ for up, and $0.36+0.64=1$. A check that the state is properly normalised.

  - type: mcq
    id: interpretations
    title: "Four answers and their prices"
    prompt: |
      The measurement problem: smooth evolution of the state seems to clash with one definite outcome at a measurement. Which pairing of view and price is right?
    options:
      - text: 'Copenhagen: no picture of the unobserved, only predictions in classical terms. Many worlds (Everett): every outcome happens, and the price is explaining probabilities. Pilot wave (de Broglie, Bohm): hidden positions, and the price is nonlocality. QBism: the state is personal belief, and the price is a more subjective physics.'
        correct: true
      - text: 'Many worlds: the state collapses at conscious observation. Pilot wave: there are no definite positions. Copenhagen: all outcomes happen.'
        feedback: |
          Each is attached to the wrong view. Many worlds has *no* collapse; the pilot wave has definite positions; Copenhagen declines a picture of the unobserved.
      - text: The four views give different predictions, which is how experiments rank them.
        feedback: |
          They agree on every prediction we can test. They are ranked by clarity, cost and fit with other commitments, not yet by experiment.
      - text: Only Copenhagen avoids a philosophical price.
        feedback: |
          Each view buys its answer with something: a vague line (Copenhagen's device and system), a multiplying universe, nonlocality, or subjective states.
    explanation: |
      Mnemonic: **picture / branches / positions / beliefs**. Which one is right is a live debate (layer 2); each carries a metaphysical commitment (layer 3).

  - type: build
    id: chsh
    title: "Build the CHSH combination"
    prompt: |
      Alice measures along $a$ or $a'$, Bob along $b$ or $b'$, and $E(x,y)$ is the correlation of their results. The combination $S$ has three plus signs and one minus, the minus on the pair $(a,b')$. Assemble it, starting from the first term.
    prefix: 'S=E(a,b)'
    tiles: ["-E(a,b')", "+E(a',b)", "+E(a',b')", "+E(a,b')", "-E(a',b')"]
    answers:
      - ["-E(a,b')", "+E(a',b)", "+E(a',b')"]
      - ["-E(a,b')", "+E(a',b')", "+E(a',b)"]
      - ["+E(a',b)", "-E(a,b')", "+E(a',b')"]
      - ["+E(a',b)", "+E(a',b')", "-E(a,b')"]
      - ["+E(a',b')", "-E(a,b')", "+E(a',b)"]
      - ["+E(a',b')", "+E(a',b)", "-E(a,b')"]
    wrong:
      - answer: ["+E(a,b')", "+E(a',b)", "+E(a',b')"]
        feedback: |
          With all four signs plus, a local sheet of $\pm1$ values could reach $4$. The single minus is what caps every local model at $2$.
    hint: One minus, on the pair that shares Alice's setting $a$ with Bob's $b'$.
    explanation: |
      $S=E(a,b)-E(a,b')+E(a',b)+E(a',b')$. Any local hidden-value model gives $|S|\le2$; quantum theory for the singlet reaches $2\sqrt2\approx2.83$ (the Tsirelson bound).

  - type: numeric
    id: chsh-numeric
    title: "Best angles for the singlet"
    prompt: |
      For a pair of spins in the singlet state, quantum theory gives the correlation $E(x,y)=-\cos(x-y)$ for detector angles $x,y$. Alice uses $a=0^\circ$ and $a'=90^\circ$; Bob uses $b=45^\circ$ and $b'=135^\circ$. Compute the CHSH combination $S$ for these four settings, to two decimals.
    answer: -2.83
    tolerance: 0.005
    answerText: '-2.83'
    wrong:
      - { value: 2.83, feedback: "The size is right but the sign is not: with this convention the singlet correlations give $E(a,b)=-0.71$ and three more terms, and the total is negative." }
      - { value: -2, feedback: "That is the largest size a local sheet of hidden values can reach. The quantum value is larger." }
    hint: 'Compute the four correlations first (each is $\pm0.71$), then combine them with the CHSH sign pattern: one minus on the pair $(a,b'')$.'
    explanation: |
      $E(a,b)=-0.71$, $E(a,b')=+0.71$, $E(a',b)=-0.71$, $E(a',b')=-0.71$. So $S=-0.71-0.71-0.71-0.71=-2\sqrt2\approx-2.83$, and $|S|>2$: no local sheet of predetermined values can produce this.

  - type: mcq
    id: bell-assumptions
    title: "What does a violation give up?"
    prompt: |
      Experiments (Aspect 1982; the loophole-free tests of 2015) find $|S|>2$. Which statement is right?
    options:
      - text: 'Some assumption behind the bound fails: locality, definite hidden values, free choice of settings, or one outcome per measurement. Which one to drop is a live debate.'
        correct: true
      - text: Signals travel faster than light, which is now an experimental fact.
        feedback: |
          The correlations cannot be used to send a message (no-signalling holds). Nonlocality in Bohm's theory is of a subtler kind than signalling.
      - text: Quantum mechanics has been shown wrong.
        feedback: |
          Quantum theory predicted the violation. What failed is the family of local hidden-value models the bound was derived for.
      - text: Bell's theorem proves that hidden variables are impossible.
        feedback: |
          Only *local* hidden variables of the kind assumed are excluded. Bohm's pilot wave has hidden positions and is nonlocal.
    explanation: |
      Pilot wave drops locality; many worlds drops one outcome; superdeterminism drops free choice; Copenhagen-style views drop hidden values. Each is a price, as in the four readings of quantum theory.

  - type: build
    id: bostrom
    title: "Build the simulated fraction"
    prompt: |
      Let $f_P$ be the fraction of human-level civilizations that reach the posthuman stage, $f_I$ the fraction of those interested in running ancestor-simulations, and $N_I$ the average number each runs. With $X=f_Pf_IN_I$, the fraction of observers like us who are simulated is $f_{\text{sim}}$ (one real history plus $X$ simulated ones). Assemble it.
    prefix: 'f_{\text{sim}}='
    tiles: ['\dfrac{X}{X+1}', '\dfrac{X+1}{X}', '\dfrac{1}{X+1}', 'X']
    answers:
      - ['\dfrac{X}{X+1}']
    wrong:
      - answer: ['\dfrac{1}{X+1}']
        feedback: |
          That is the fraction who are *not* simulated: one real history out of $X+1$ in all.
      - answer: ['X']
        feedback: |
          A fraction cannot exceed 1, but $X$ can be a million.
    hint: Simulated histories over all histories, real and simulated.
    explanation: |
      There are $X$ simulated histories per real one, so the fraction simulated is $X/(X+1)$. The size of each history cancels, which is why the formula needs no population figure.

  - type: numeric
    id: bostrom-numeric
    title: "Small fractions, huge numbers"
    prompt: |
      Suppose $1\%$ of civilizations reach the posthuman stage, $1\%$ of those are interested in running ancestor-simulations, and each interested one runs $10^6$ of them. What fraction of observers like us is simulated? Give a decimal to three places.
    answer: 0.990
    tolerance: 0.0005
    answerText: '0.990'
    wrong:
      - { value: 0.01, feedback: "That is only a single factor of $1\\%$. The huge number of simulations per interested civilization dominates." }
      - { value: 100, feedback: "That is the number of simulated histories per real one, not a fraction. A fraction must be below 1." }
    hint: First find how many simulated histories there are per real one, then turn that into a fraction of all histories.
    explanation: |
      $0.01\times0.01\times10^6=100$ simulated histories per real one, so the fraction is $100/101\approx0.990$. A very large multiplier beats two small fractions.

  - type: mcq
    id: bostrom-limits
    title: "Limit checks"
    prompt: |
      For the fraction $f_{\text{sim}}=X/(X+1)$ with $X=f_Pf_IN_I$, which statement about the limits is correct?
    options:
      - text: As $X\to0$ the fraction goes to 0 (almost nobody is simulated); as $X\to\infty$ it goes to 1. So (3) "we are almost certainly simulated" follows unless $f_P$ or $f_I$ is near 0.
        correct: true
      - text: As $X\to0$ the fraction goes to 1, since a single real history is always outnumbered.
        feedback: |
          With $X\to0$ there are almost no simulated histories, so the one real history dominates and the fraction goes to 0.
      - text: The fraction can exceed 1 when $N_I$ is very large.
        feedback: |
          It cannot: $X/(X+1)<1$ for all $X$. It only approaches 1.
      - text: The fraction does not depend on $f_P$ and $f_I$, only on $N_I$.
        feedback: |
          All three enter as a product in $X$. If $f_P$ or $f_I$ is near 0, $X$ can be small even when $N_I$ is large, which is why (1) and (2) of the trilemma are live options.
    explanation: |
      The trilemma: (1) almost no civilizations reach posthumanity, (2) almost none of them are interested, or (3) we are almost certainly simulated. Bostrom does not say (3) is true; he suggests spreading credence roughly evenly. The result also needs substrate independence and bland indifference, and critics reject one of them.

  - type: build
    id: fresnel
    title: "Build the reflection fraction"
    prompt: |
      Light at normal incidence goes from air into a material of refractive index $n$. Both Fresnel's elastic-ether theory and Maxwell's field theory give the same reflected fraction $R$. Assemble it. Check: for $n=1$ (no change of medium) nothing should reflect.
    prefix: 'R='
    tiles: ['\left(\dfrac{n-1}{n+1}\right)^2', '\left(\dfrac{n+1}{n-1}\right)^2', '\dfrac{(n-1)^2}{n+1}', '\dfrac{n-1}{n+1}']
    answers:
      - ['\left(\dfrac{n-1}{n+1}\right)^2']
    wrong:
      - answer: ['\left(\dfrac{n+1}{n-1}\right)^2']
        feedback: |
          Upside down: at $n=1$ it divides by zero instead of giving no reflection.
      - answer: ['\dfrac{n-1}{n+1}']
        feedback: |
          This is the amplitude ratio; the reflected *fraction of the light* is its square, and the square also makes the result the same for $n$ and $1/n$.
    hint: The numerator must vanish at $n=1$, and the fraction of energy is a square.
    explanation: |
      Structural realism's example: the picture of what light is changed (ether to field) but the equation survived. This formula is the "structure".

  - type: numeric
    id: fresnel-numeric
    title: "Water"
    prompt: |
      Light in air meets still water, with refractive index $n=1.33$, at normal incidence. What percentage of the light is reflected? Give one decimal.
    answer: 2.0
    tolerance: 0.05
    answerText: '2.0'
    wrong:
      - { value: 14.2, feedback: "That is the amplitude ratio in percent, not the fraction of the light. Energy goes as the square." }
    hint: The numerator vanishes when nothing changes; the energy fraction is a square.
    explanation: |
      $\big(0.33/2.33\big)^2\approx0.0201$, about $2.0\%$. Check: at $n=1$ it gives 0, and glass ($n\approx1.5$) gives about $4\%$.

  - type: numeric
    id: newman
    title: "Relations on three points"
    prompt: |
      According to Newman (1928), a bare pattern of relations is cheap. Count the binary relations on a set of $3$ objects, where a relation is any choice of ordered pairs from the set (including pairs of an object with itself, and including none or all).
    answer: 512
    tolerance: 0.5
    answerText: '512'
    wrong:
      - { value: 9, feedback: "9 is the number of possible ordered pairs. A relation is any *subset* of those pairs, and each pair is independently in or out." }
      - { value: 81, feedback: "That is $9^2$. Each of the 9 pairs is in or out, which gives a product of nine factors of 2." }
    hint: There are $3\times3$ ordered pairs, and each is independently in or out.
    explanation: |
      Nine ordered pairs, each in or out: $2^9=512$. In general $2^{n^2}$ for $n$ objects, so "the world has structure $S$" says almost nothing beyond how many things there are, unless the structure is more than a bare pattern (causal, law-governed). That is Newman's objection to Russell's structural view.

  - type: mcq
    id: layers
    title: "Which layer?"
    multiple: true
    prompt: |
      This level separates three layers of any claim: established fact, scholarly debate, and faith or metaphysical commitment. Select **all** the claims below that belong to the third layer.
    options:
      - text: Mind is fundamental, and what we call matter exists only as it appears to minds (idealism).
        correct: true
      - text: Everything that exists is physical, or depends entirely on the physical (physicalism).
        correct: true
      - text: Aspect (1982) and the 2015 tests find correlations violating the CHSH bound $2$.
        feedback: |
          Documented experimental results: established fact.
      - text: Whether the quantum state is a real wave, a set of branches or a degree of belief.
        feedback: |
          Live scholarly debate: all views agree on the predictions and differ on interpretation, so each is argued on clarity and cost.
    explanation: |
      The first two go beyond what any experiment can show: commitments. Mixing the layers in either direction is the common slip, and no one's picture here is dismissed.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Physicalism and dualism:** the mental supervenes on the physical (no mental difference without a physical one). Kim's closure argument: P1 physical causal closure, P2 mental causes, P3 no overdetermination; interactionism drops P1, epiphenomenalism drops P2.
      - **Idealism and panpsychism:** Berkeley, *esse est percipi*; the four kinds subjective, transcendental, absolute, analytic. Panpsychism (simple experience in the basic things), panprotopsychism (precursors), neutral monism (one neutral stuff); their shared price is the combination problem.
      - **Emergence:** temperature as reduction, for a gas of atoms of mass $m$ at absolute temperature $T$ with Boltzmann constant $k$:
        $$\tfrac12\,m\langle v^2\rangle=\tfrac32\,kT$$
        Weak emergence is derivable in principle, strong is not and has downward causation.
      - **Quantum:** for the spin state $a|{\uparrow}\rangle+b|{\downarrow}\rangle$ the probabilities are
        $$P(\uparrow)=|a|^2,\qquad P(\downarrow)=|b|^2$$
        Four views (Copenhagen, many worlds, pilot wave, QBism), four prices, the same predictions.
      - **Bell:** with settings $a,a'$ for Alice and $b,b'$ for Bob and correlation $E$,
        $$\begin{aligned}S&=E(a,b)-E(a,b')\\&\quad+E(a',b)+E(a',b')\end{aligned}$$
        Local hidden-value models give $|S|\le2$; the singlet at best angles gives $|S|=2\sqrt2\approx2.83$, observed.
      - **Simulation:** with $X=f_Pf_IN_I$ (fractions $f_P$ reaching posthumanity and $f_I$ interested, $N_I$ simulations each),
        $$f_{\text{sim}}=\frac{X}{X+1}$$
        Bostrom's trilemma: (1) extinction first, (2) no interest, or (3) probably simulated.
      - **Structural realism:** for light entering a material of index $n$ at normal incidence,
        $$R=\left(\frac{n-1}{n+1}\right)^2$$
        survived the change from Fresnel's ether to Maxwell's field (water: $2.0\%$). Newman: $n$ objects carry $2^{n^2}$ relations ($n=3$: 512), so a bare pattern says little.
      - **Layers:** results (fact), interpretations and which assumption to drop (debate), what ultimately exists (commitment).

