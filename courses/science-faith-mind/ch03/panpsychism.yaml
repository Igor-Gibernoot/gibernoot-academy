id: ch03-panpsychism
title: "Mind in Everything? Panpsychism and Neutral Monism"
kind: concept
own: |
  - **Panpsychism, defined.** According to its defenders, **panpsychism** is the thesis that {{ experience (consciousness) is a basic and widespread feature of the physical world, present in the simplest things }}, not something that appears only in brains. It does not say that rocks think or that electrons have thoughts, only that the basic constituents of matter have some very simple form of experience.
  - **Structure versus intrinsic nature.** Physics describes matter by **structure and dynamics**: what a thing does and how it relates to other things (mass is how it resists a push, charge is how it responds to a field). The **intrinsic nature** of a thing is what it is in itself, apart from those relations. The central argument of panpsychists, as premises: P1 physics tells us only about {{ structure and dynamics }}, P2 structure and dynamics alone do not account for why there is experience (the hard problem), P3 the intrinsic nature of matter is left open, and the simplest way to put experience in the world is to make it that intrinsic nature. C: experience is basic. A critic may reject P3: the intrinsic nature could be neither experiential nor known, or experience could arise only in complex systems.
  - **Neutral monism** (Baruch Spinoza, 1632-1677; Bertrand Russell, 1872-1970, *The Analysis of Matter*, 1927). **Monism** means one kind of stuff; the stuff is "neutral" because it is neither mental nor physical in itself, and {{ mind and matter are two aspects (or two ways of organising) of that one neutral stuff }}. Russell's version: physics tells us the structure of the world, and what has that structure is the intrinsic nature we know directly only in our own experience.
  - **Panpsychism versus panprotopsychism.** Panpsychism: the basic things have {{ experience itself, in a simple form }}. **Panprotopsychism** (the "proto" means "before" or "precursor"): the basic things have **protophenomenal** properties, which are not experiences but which, suitably combined, give rise to experience. Both are forms of Russellian monism.
  - **The combination problem.** If an electron has a tiny experience, how do very many such micro-experiences make one **unified** macro-experience, the single point of view you have now? A hundred people each feeling something do not add up to one person feeling a hundred things. Replies, each a price and not a refutation: {{ constitutive views (the combining is not a causal process but a deeper kind of being-made-of), integrated-information views (experience arises where a system is highly integrated), and cosmopsychism (start from one cosmic mind and divide it) }}.
  - **Where thoughtful people part ways.** Whether physics really leaves intrinsic natures open (P3); whether simplicity should be traded for a surprising claim about electrons; whether the combination problem is worse than the explanatory gap it was meant to close. Layers: that physics describes structure and dynamics is established; whether that leaves a gap for experience is a live debate; panpsychism itself is a metaphysical commitment, with no experiment that tests it today.
cards:
  - type: mcq
    id: hook
    title: "Could an electron feel anything?"
    prompt: |
      Guess before any theory. An electron is one of the simplest things we know: a point-like particle with a mass, an electric charge and nothing else we can see. Could there be *anything it is like* to be an electron, even the faintest glimmer of experience?
    options:
      - text: 'No: experience needs a brain, or at least a complicated system. A single particle has no inside.'
        feedback: |
          This is the common first answer, and a serious one (called emergentism, taken up in the next lesson): experience appears only when matter is arranged in a complicated way. The lesson asks what the argument for it is, and what its rival says.
      - text: 'Perhaps yes, in some extremely simple form, and what we call a mind is made of many such simple things.'
        correct: true
      - text: 'The question has no meaning, because "experience" is only a word for certain brain behaviour.'
        feedback: |
          Physicalists and some eliminativists say something like this (see the lesson Matter Is All There Is?). It is a third answer, with its own cost.
    explanation: |
      The marked answer is the one this lesson studies, not a verdict: there is no wrong guess here, only three starting points. It sounds strange, which is a reason to ask what pushes careful philosophers toward it. The first says "no", the second "yes, in a simple form", the third "the question is confused". This lesson follows the second, **panpsychism**, and a close relative, **neutral monism**.

  - type: text
    id: define
    title: "Panpsychism, defined"
    body: |
      **Panpsychism** (from the Greek *pan*, all, and *psyche*, mind or soul) is the thesis that, according to its defenders, *experience is a basic and widespread feature of the world*: the simplest physical things have some very simple form of it.

      Three clarifications, which defenders insist on:

      - It does **not** say that rocks, tables or electrons *think*, plan or have a point of view like ours. The claim is about the faintest, simplest kind of experience.
      - It does **not** say the universe as a whole is a person (that is a different view, met below).
      - It is a claim about **what exists** (metaphysics). Unlike dualism, it says there is only one kind of stuff, the physical world, but that this stuff has an experiential side from the start.

      Compare the three views already studied: *physicalism* puts mind inside the physical; *idealism* puts matter inside mind; *dualism* keeps both separate. Panpsychism keeps one world and says its basic constituents are not purely "mindless".

  - type: text
    id: structure
    title: "Structure versus intrinsic nature"
    body: |
      The main argument for panpsychism rests on a distinction that needs two plain glosses.

      - **Structure and dynamics.** What a thing *does* and how it *relates* to other things. In physics, mass is how a thing resists being pushed, charge is how it responds to an electric field, and a particle's position is given relative to other things. Every quantity in physics is defined this way.
      - **Intrinsic nature.** What a thing *is in itself*, apart from all those relations. Compare a chess game: the rules say only how each piece moves and relates to others (structure), and the same game can be played with wood, plastic or people. What the pieces are *made of* is not fixed by the rules.

      Physics, say these philosophers, is like the rules of the game: it tells us what matter does, and is silent on what, if anything, matter is in itself.

  - type: mcq
    id: structure-q
    title: "Rules or pieces?"
    prompt: |
      A physicist defines an electron's charge as "the property that makes it accelerate in an electric field by an amount proportional to the field". According to the distinction above, is this a statement of structure and dynamics or of intrinsic nature?
    options:
      - text: 'Structure and dynamics: it says what the charge does and how it relates to a field, not what it is in itself.'
        correct: true
      - text: 'Intrinsic nature: it tells us exactly what an electron is.'
        feedback: |
          The definition mentions only effects: how the electron responds to something else. It would fit any property that produced the same response, whatever it is in itself.
      - text: 'Neither: it is a measurement, not a definition.'
        feedback: |
          Measuring charge uses exactly this response, and so the definition is a statement of what charge *does*. The distinction is not about measuring versus defining.
    explanation: |
      Every physical property is introduced this way: by a role in the equations. This is what makes the next step possible. If physics gives only the roles, the question "what plays the roles?" is open.

  - type: text
    id: argument
    title: "The argument, as a guided proof"
    body: |
      A common reconstruction of the argument that leads many philosophers to panpsychism (Philip Goff, b. 1981, and Galen Strawson, b. 1952, among contemporary defenders; the argument itself builds on Russell):

      - **P1.** Physics tells us only about the structure and dynamics of matter, never its intrinsic nature.
      - **P2.** Structure and dynamics alone do not account for why there is experience (this is the **hard problem of consciousness**, taken up in a later lesson: knowing every physical role would not by itself tell us why anything feels like something).
      - **P3.** So the intrinsic nature of matter is an open question, and the simplest way to fit experience into the world is to say that the intrinsic nature of matter is itself experiential.
      - **C.** Experience is a basic feature of the world: panpsychism.

      Whether the steps are valid and the premises true is exactly what the next questions ask. Note that P3 contains a step from "possible" to "best explanation".

  - type: mcq
    id: critic
    title: "Which premise would a critic reject, and why?"
    prompt: |
      A critic accepts P1 and P2 but rejects P3. Which is the strongest form of the critic's objection?
    options:
      - text: 'That the intrinsic nature is open does not make it experiential: it could be something neither mental nor known to us, or experience could be a real feature that arises only in complex systems; calling it basic is a leap.'
        correct: true
      - text: 'Physics has shown the intrinsic nature of matter and it is not experiential.'
        feedback: |
          P1 says exactly the reverse: physics has *not* shown it. A critic who denied P1 would argue instead that "physical" already includes whatever matter is in itself.
      - text: 'Experience does not exist, so no explanation is needed.'
        feedback: |
          This rejects P2's starting point and is held only by a few (the eliminativists). The critic here accepts P2 and attacks P3.
    explanation: |
      The defender replies that a world in which experience pops in at some point of complexity is a world with a brute, unexplained extra, and that the simplicity of "it was there all along" is the better bet. The critic answers that simplicity here is bought at the price of a very strange claim about electrons. **Layer:** the argument is valid only if P3 is read as "the best explanation"; P3 is where thoughtful people part ways.

  - type: text
    id: neutral
    title: "Neutral monism: Spinoza and Russell"
    body: |
      A **monism** is a view that there is only one kind of stuff (the Greek *monos* means one). Dualism says two; physicalism says one (physical); idealism says one (mental). **Neutral monism** says one stuff that is *neither* mental *nor* physical in itself: mind and matter are two aspects of it, or two ways it is described.

      - **Baruch Spinoza** (1632-1677), in the *Ethics* (published after his death, 1677), held that there is one substance, which he called "God or Nature", and that thought and extension (the mental and the physical) are two **attributes** of it, two ways one thing is expressed. A thought and the bodily event matching it are not two things, but one thing seen under two descriptions.
      - **Bertrand Russell** (1872-1970), in *The Analysis of Matter* (1927), argued that physics tells us only the *structure* of the world, and that the one thing we know from the inside is our own experience. So, he suggested, the intrinsic nature of at least some physical events *is* the stuff of experience, and the rest of the world has a nature we can only describe structurally. Later philosophers call this approach **Russellian monism**.

      The same neutral stuff, then, is seen from the outside as matter and from the inside as mind.

  - type: mcq
    id: neutral-q
    title: "Which view is this?"
    prompt: |
      A philosopher says: "There is one underlying reality. Described from the outside, by the sciences, it is what we call physical. Known from the inside, in our own case, it is what we call mental. Neither description is more basic." Which view is this, according to the definitions above?
    options:
      - text: 'Neutral monism (in Spinoza''s two-attributes form).'
        correct: true
      - text: 'Substance dualism.'
        feedback: |
          Substance dualism says there are two kinds of thing. The speaker says there is one underlying reality, described in two ways.
      - text: 'Physicalism.'
        feedback: |
          Physicalism makes the physical description the fundamental one and the mental one derivative. The speaker explicitly denies that either description is more basic.
    explanation: |
      Notice how neutral monism sits between the earlier views: like dualism it takes mind and matter to be genuinely different *aspects*; like physicalism and idealism it keeps one underlying thing. Its price is the word "neutral": what is this stuff, if it is neither?

  - type: text
    id: proto
    title: "Panpsychism or panprotopsychism?"
    body: |
      Russell's idea comes in two main forms among contemporary philosophers (David Chalmers, b. 1966, set out the contrast in a paper on panpsychism and panprotopsychism, 2013):

      - **Panpsychism.** The basic things (electrons, quarks, or a field) have **experience itself**, in a very simple form. Defenders include Galen Strawson and Philip Goff.
      - **Panprotopsychism.** The basic things have **protophenomenal** properties (*proto* = before, *phenomenal* = to do with experience): properties that are *not* experiences, but that, combined in the right way, make experience. Chalmers has explored this version, and treats the choice between the two forms as open.

      Both say that the physical world's intrinsic nature is what makes experience possible; they differ on whether experience is already there in the parts.

  - type: mcq
    id: proto-q
    title: "A tiny experience, or a precursor?"
    prompt: |
      According to the contrast above, which statement describes panprotopsychism rather than panpsychism?
    options:
      - text: 'Electrons have no experience, but they have non-experiential properties that, in the right arrangement, constitute experience.'
        correct: true
      - text: 'Electrons have a very faint experience, and brains have a rich one built from many of them.'
        feedback: |
          This is panpsychism: the parts already have experience, in a simple form.
      - text: 'Electrons have no properties at all that relate to experience, and experience is a new, brute addition in brains.'
        feedback: |
          This is emergentism (next lesson), not panprotopsychism: the protopsychist says the parts already have a relevant property, only not experience itself.
    explanation: |
      Each form avoids a cost and meets another. Protopsychism sounds less strange about electrons, but it must explain how a non-experiential property can make an experience, which is close to the original puzzle. Panpsychism avoids that, and meets the problem of the next card.

  - type: text
    id: combination
    title: "The combination problem"
    body: |
      Suppose every electron and quark has a tiny experience. Your brain has some $10^{26}$ atoms (a rough figure). Yet you have *one* experience at a time, one point of view, not a crowd of $10^{26}$ tiny ones.

      This is the **combination problem**: *how do many micro-experiences combine into one macro-experience?* William James (1842-1910) saw it in 1890: if you put together feelings, each in its own mind, you do not get a feeling of the whole; a group of people, each knowing one word of a sentence, does not add up to anyone who knows the sentence. Philosophers today (Chalmers among them) distinguish several versions, such as: how do the *subjects* combine (many little subjects, one big subject), and how do the *qualities* combine (the small experiences of red and of round, one of red-and-round).

      For critics, this is the central objection. For defenders, it is the new form of the old problem that the view was meant to solve, but perhaps easier.

  - type: mcq
    id: combination-q
    title: "Why a problem, not a pun?"
    prompt: |
      A critic says: "Ten people each feel a small pain. Nobody feels a pain ten times as large. So adding experiences does not give a bigger experience." What is the critic's point, according to the combination problem?
    options:
      - text: 'Experiences belong to a subject. Putting subjects side by side does not make a new subject, so the panpsychist must explain what is special about a brain (or a particle) that does.'
        correct: true
      - text: 'Pain is not an experience.'
        feedback: |
          Pain is a standard example of an experience. The point is not what kind of experience, but how experiences join.
      - text: 'Panpsychism is refuted, since experiences cannot be added at all.'
        feedback: |
          The critic raises a problem that needs an answer, not a refutation: defenders reply that the *combining relation* is not mere addition, and the next card gives some replies.
    explanation: |
      Compare the physical case: ten bricks make a wall without any mystery, because the wall is just bricks arranged. The combination problem asks whether subjects of experience behave like bricks, or not. The difficulty is not about strength, but about **unity**: one point of view from many.

  - type: mcq
    id: replies
    title: "Three replies"
    prompt: |
      Match the reply to what it says. Which pairing is correct?
    options:
      - text: 'Constitutive views: the small subjects and the big subject are not separate causes and effects; the big one is made of the small ones in a deeper way (Goff calls one version phenomenal bonding). Integrated-information views: experience arises where a system is highly integrated (Giulio Tononi, b. 1960). Cosmopsychism: start from one cosmic subject and treat small subjects as its parts.'
        correct: true
      - text: 'Constitutive views: the big subject is a causal effect of the small ones. Integrated-information views: experience arises in any large number of parts. Cosmopsychism: each electron is its own universe.'
        feedback: |
          The pairing is scrambled. In constitutive views the relation is *not* causal; integrated information concerns how tightly a system is unified, not how big it is; and cosmopsychism starts from the whole.
      - text: 'All three say that no combination is needed.'
        feedback: |
          They each say how the combination might happen (or reverse it, in cosmopsychism: from one to many, which raises a "decombination" problem). None says no explanation is needed.
    explanation: |
      Each reply is a price: constitutive views need a relation nobody can yet describe; integrated information has odd consequences (simple but tightly connected systems come out conscious) and is debated as science; cosmopsychism must explain how one mind becomes many. A fair reader sees open problems, not refutations.

  - type: mcq
    id: compare
    title: "Next to the other views"
    prompt: |
      Which comparison with the other views is accurate?
    options:
      - text: 'Unlike dualism, panpsychism has one kind of stuff and no interaction problem; unlike idealism, it keeps matter real; unlike emergentism, experience is there from the start and is not new when the system is complex.'
        correct: true
      - text: 'Panpsychism is a form of dualism, since it speaks of both mind and matter.'
        feedback: |
          It speaks of both, but as aspects of one world. Dualism says they are distinct kinds neither of which fixes the other.
      - text: 'Panpsychism is a form of physicalism, since it keeps everything physical.'
        feedback: |
          The panpsychist agrees everything is physical in the sense of being part of the physical world, but denies that physics as now given exhausts its nature. Some call the view "physicalism with the intrinsic nature filled in"; others say it is not physicalism at all. That label is itself disputed.
    explanation: |
      Its selling point is the absence of an interaction problem: if experience is an intrinsic aspect of the very things physics describes, nothing needs to bridge a gap. Its price is the combination problem. The next lesson takes the opposite choice, in which experience appears only at higher levels of organisation.

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Classify the claim "The basic constituents of matter have a simple form of experience."
    options:
      - text: 'A metaphysical commitment (layer 3), supported by an argument (structure versus intrinsic nature) whose premises are a live debate (layer 2); that physics defines properties by their roles is layer 1.'
        correct: true
      - text: 'An established fact, since physics cannot detect experience in electrons and so cannot rule it out.'
        feedback: |
          That something cannot be ruled out is not evidence that it is true. Physics gives no test for or against the claim; this is why it counts as a commitment, held for reasons of fit and simplicity.
      - text: 'A scientific claim refuted by the fact that electrons have no brain.'
        feedback: |
          The claim is not that electrons have brains or think. Brain-dependence of *our* experience is established; whether simpler experiences exist without brains is the question, and no experiment settles it.
    explanation: |
      Notice the difference from earlier lessons: panpsychism does not conflict with any observation, and no observation supports it over its rivals. Its case is the argument from structure to intrinsic nature, and what it avoids in the other views.

  - type: mcq
    id: back
    title: "Back to the electron"
    prompt: |
      Return to the opening question. Which statement is a *fair* summary of where thoughtful people part ways?
    options:
      - text: 'They agree on all that physics measures; they differ on whether physics leaves the nature of matter open (P3), and on which is worse: experience appearing from nothing in complex systems, or the combination problem for simple ones.'
        correct: true
      - text: 'Panpsychists believe electrons think; critics believe they do not.'
        feedback: |
          Panpsychists make a much weaker claim (the faintest experience, no thought), and the critic's disagreement is about an argument, not only about electrons.
      - text: 'The disagreement is about the evidence from particle physics.'
        feedback: |
          Both sides accept the same physics. The disagreement is about what the physics leaves out and how the gap should be filled.
    explanation: |
      Once more the method of the course appears: shared data, a disagreement located in a premise, and a metaphysical commitment. Whether electrons feel anything is not something any experiment today can tell.

  - type: text
    id: summary
    body: |
      **Next:** emergence and reduction. Panpsychism says experience is present all the way down. The opposite family says it appears at some level of complexity, and so asks a general question: when can a whole have properties its parts lack, and when is a higher-level fact "nothing over and above" the lower-level ones? The lesson Emergence and Reduction asks this with a worked example.
