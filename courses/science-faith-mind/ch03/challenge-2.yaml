id: ch03-challenge-2
title: "Level Challenge: Which World Are We In? (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: pressure on panpsychism and idealism, then the weighing"
    body: |
      Two more problems, independent of part 1. The toolkit, restated.

      - **Panpsychism**: according to its defenders, experience is a basic feature of matter, present in its simplest constituents. Its worry is the **combination problem** (William James, 1890): how do many tiny experiences make one unified experience? Replies: *constitutive* (the big subject is made of the small ones, not caused by them), *integrated information* (Giulio Tononi: experience arises where a system is highly integrated), *cosmopsychism* (start from one cosmic subject and divide it).
      - **Idealism**: according to its defenders, mind is fundamental. George Berkeley (1710): *esse est percipi*, to be is to be perceived. His premises: P1 we immediately perceive only ideas; P2 an idea exists only in a mind; P3 sensible things are what we perceive; C sensible things exist only in minds. The unperceived tree: God perceives it (Berkeley, traditional reading), or it is the pattern of experiences that *would* occur if a mind were present (phenomenalists).
      - **Supervenience.** "$A$ supervenes on $B$" means two possible worlds alike in $B$ are alike in $A$. Physicalism: the mental supervenes on the physical. Most dualists deny it.
      - **Kim's closure argument**: P1 every physical event that has a cause has a sufficient physical cause; P2 mental events cause physical events; P3 no systematic overdetermination (no event is caused twice over by two independent sufficient causes).
      - **Falsifiability** (Karl Popper; the lesson Popper and the Black Swan): a claim is testable when some possible observation would count against it.
      - **Bayes**: posterior odds = prior odds $\times$ likelihood ratio, where the likelihood ratio is $P(E\mid H_1)/P(E\mid H_2)$.
      - **Layers**: label each claim as (1) established fact, (2) live debate, or (3) metaphysical commitment.

  # ---------------- Problem 4 ----------------
  - type: numeric
    id: p4-links
    title: "Problem 4 · The combination problem, with numbers"
    prompt: |
      **Problem 4.** A student holds that experience is basic. She pictures six micro-subjects (tiny experiencers) that are to form one unified subject. For them to be unified, she says, every two of the six must be directly connected by one link, and each pair needs its own link. How many links are there?
    answer: 15
    wrong:
      - { value: 6, feedback: 'That counts the subjects, not the links. Each subject is joined to five others, and a link is shared by two subjects.' }
      - { value: 30, feedback: 'That counts each link twice: subject 1 to subject 2 and subject 2 to subject 1 are the same link.' }
      - { value: 36, feedback: 'That pairs each subject with all six, itself included, and counts both directions. A link joins two different subjects, and the order does not matter.' }
    hint: Each of the six subjects has a link to each of the other five; then ask how many times each link got counted.
    explanation: |
      Each subject has $5$ partners, which gives $6\times5=30$ ends of links, and every link has two ends, so there are $30/2=15$ links. Counting what is *tied together*, and not only what is *there*, is why the combination problem is hard: the parts are few, the relations needed to make one subject are many.

  - type: numeric
    id: p4-grow
    title: "Doubling the parts"
    prompt: |
      Her reasoning with every pair linked once gave $15$ links for $6$ micro-subjects. Using the same counting, how many links join $12$ micro-subjects, twice as many?
    answer: 66
    wrong:
      - { value: 30, feedback: 'That doubles the number of links. But each new subject must be linked to all the old ones too, so the number of links grows faster than the number of subjects.' }
      - { value: 132, feedback: 'That counts every link twice (once from each end). Divide by two.' }
    hint: Each of the 12 has 11 partners; every link has two ends.
    explanation: |
      $12\times11/2=66$ links, more than four times $15$. A brain has on the order of billions of neurons, each made of vast numbers of particles. If unity needed a direct link between every pair of micro-subjects, the count would explode. This is a reason the replies do not try to add links one by one: they change what "combining" means. The count is only an illustration of the worry, not a claim that any panpsychist holds the every-pair picture.

  - type: mcq
    id: p4-replies
    title: "Which reply answers which worry?"
    prompt: |
      Three worries about combining many small experiences into one subject, each answered by a different reply. Which pairing of worry and reply is right?

      - **Worry A.** Cause and effect between micro-subjects links many things, but a chain of causes never turns many subjects into one.
      - **Worry B.** Some heaps of micro-subjects (a pile of sand) look like many subjects, others (a brain) like one. What decides which?
      - **Worry C.** Building one subject out of many parts seems hopeless in the first place.
    options:
      - text: 'A: constitutive views (the big subject is made of the small ones, not caused by them). B: integrated-information views (experience arises where a system is highly integrated). C: cosmopsychism (start from one cosmic subject and divide it).'
        correct: true
      - text: 'A: integrated information. B: cosmopsychism. C: constitutive views.'
        feedback: |
          Scrambled. Worry A is about the *kind of relation* (causal or not), which is the constitutive reply; integrated information is about *which systems* are unified, which is worry B.
      - text: 'A: cosmopsychism. B: constitutive views. C: integrated information.'
        feedback: |
          Cosmopsychism answers C by reversing the direction, from one to many. Constitutive views say how the big is made of the small; they do not give a test for which systems count.
      - text: 'None of the replies answers any worry; they restate the problem.'
        feedback: |
          Each reply is a price, not a refutation, but each has a definite target. Constitutive views change the relation, integrated information proposes a criterion, cosmopsychism changes the starting point.
    explanation: |
      Each reply pays elsewhere: constitutive views need a relation nobody can yet describe; integrated information has odd consequences (simple but tightly connected systems come out conscious) and is debated as science; cosmopsychism must explain how one mind becomes many (the "decombination" problem). A critic can say the combination problem is worse than the explanatory gap it was meant to close; a defender can say it is no worse than the gap that every other view faces. **Layer:** a live debate.

  - type: mcq
    id: p4-conceive
    title: "Conceiving the unperceived tree"
    prompt: |
      A student reasons in the style of Berkeley: "I try to picture a tree that nobody perceives. But I am picturing it, so it is in my mind. So I can never conceive an unperceived tree. So an unperceived tree is impossible." Which step would a critic of idealism attack most directly?
    options:
      - text: 'The last step, from "I cannot conceive it unperceived" to "it cannot exist unperceived": what I can imagine tells me about my imagining, not necessarily about what exists.'
        correct: true
      - text: 'The first step: nobody can picture a tree.'
        feedback: |
          Picturing a tree is not the problem. The point is what the picturing shows, not whether it can be done.
      - text: 'There is no weak step: if the first two steps are true, the conclusion follows.'
        feedback: |
          The step from conceivability to existence is the weak one. The structure parallels Descartes'' doubt argument: what I can or cannot doubt or conceive describes my state of mind, and it is a further claim that it describes the thing.
    explanation: |
      Berkeley takes the "no one can conceive an unperceived tree" point as strong evidence; critics reply that it moves from a fact about the mind to a fact about the world. A defender answers that, for sensible things, there is no further fact beyond what could be perceived. Where people part ways: whether "unperceived existence" is even coherent.

  - type: mcq
    id: p4-tree
    title: "God or a pattern of possible experiences"
    prompt: |
      A cave has been sealed for ten years. A stalactite in it grows $1$ mm in that time and nobody sees it. According to the traditional Berkeleian reading and according to the phenomenalist reading of idealism, what makes the sentence "the stalactite grew $1$ mm" true? Which pairing is right?
    options:
      - text: 'Berkeley: God perceives the stalactite throughout. Phenomenalist: the stalactite is the pattern of experiences that *would* occur if a mind were in the cave, and an explorer would have found it longer.'
        correct: true
      - text: 'Berkeley: the stalactite stops existing and starts again when someone opens the cave. Phenomenalist: it is a lump of matter that exists with no mind.'
        feedback: |
          Berkeley wanted to avoid a flickering world (so he used a constant perceiver), and phenomenalists do not restore matter that exists independently of minds.
      - text: 'Both: the sentence is meaningless, since nobody observed the growth.'
        feedback: |
          Neither says that. Berkeley has a perceiver (God); the phenomenalist reads the sentence as a claim about what would be experienced. The sentence is true or false for both.
    explanation: |
      Notice the cost each reading pays. God as perceiver imports a theological premise into the account of a stalactite. The phenomenalist account leans on a "would" (a counterfactual): what *would* be experienced, and a critic asks what in the world makes such a statement true when no mind is there. (Mill's phrase for matter, "permanent possibility of sensation", is one version.) **Layer:** both readings are metaphysical commitments.

  - type: mcq
    id: p4-super
    title: "Idealist supervenience"
    prompt: |
      Physicalism says two possible worlds that are alike in every physical respect are alike in every mental respect. An idealist turns this around: the physical supervenes on the mental. Which of these two worlds, if the idealist is right, cannot both exist?
    options:
      - text: 'Two worlds with exactly the same experiences everywhere (the same minds and what they undergo) that differ in the physical, for instance one with a table in the corner and one without.'
        correct: true
      - text: 'Two worlds with exactly the same physical facts but different experiences.'
        feedback: |
          That is what physicalism rules out. The idealist''s supervenience goes the other way, so this pair is not excluded by it (the idealist may not need to accept it either, but that is a further matter).
      - text: 'Any two worlds with different minds.'
        feedback: |
          Supervenience says nothing about worlds that differ in the mental. It only forbids a difference in the physical *without* a difference in the mental.
    explanation: |
      In the formula of supervenience, "$A$ supervenes on $B$" forbids a difference in $A$ without a difference in $B$. For idealism, $A$ is the physical and $B$ the mental. A weakness: the idealist must say what "mental" covers (a version of Hempel's dilemma). Layer: a metaphysical commitment, with no experimental test.

  - type: mcq
    id: p4-duplicate
    title: "A physically identical world: three answers"
    prompt: |
      Imagine a world exactly alike ours in every physical respect, down to the last particle. **Does it contain experience?** According to a physicalist, a dualist and a panpsychist, which pairing is right?
    options:
      - text: 'Physicalist: yes, necessarily, since the mental supervenes on the physical. Dualist (most): not necessarily, since experience is not fixed by the physical facts, so such a world could lack it. Panpsychist: yes, since experience is the intrinsic nature of the physical things being copied.'
        correct: true
      - text: 'Physicalist: not necessarily. Dualist: yes. Panpsychist: no.'
        feedback: |
          Reversed. Supervenience is exactly the physicalist''s claim that a physical duplicate is a mental duplicate, and the dualist is the one who denies it.
      - text: 'All three say it must contain experience, since otherwise the worlds would not be identical.'
        feedback: |
          "Physically identical" is the only identity stipulated. Whether that fixes experience is what the three views argue about. The dualist says it does not; that is the point of the zombie-world thought experiment.
      - text: 'All three say it cannot contain experience, since only our world has a consciousness.'
        feedback: |
          Nothing special about our world is assumed; the question is about duplicates.
    explanation: |
      The same question sorts the views: supervenience (physicalism), its denial (dualism), and experience as the intrinsic nature of what is copied (panpsychism). A subtlety: if "physically identical" means only the structure and behaviour physics describes, panpsychists can differ among themselves about whether the inner natures are also copied. Layer: all three answers are metaphysical commitments, and the fact that the question is not settled by experiment is why people part ways here.

  # ---------------- Problem 5 ----------------
  - type: mcq
    id: p5-against
    title: "Problem 5 · What would count against a view?"
    prompt: |
      **Problem 5.** A thought experiment about falsifiability. Suppose careful, repeated experiments found that people report vivid, verifiable experience while every instrument shows no brain activity at all. Which views, as stated in this level, would that observation count against? (Select all that apply.)
    multiple: true
    options:
      - text: 'Physicalism (the mental depends on the physical, here on a working brain).'
        correct: true
      - text: 'Emergence (experience arises from complex physical organization).'
        correct: true
      - text: 'Substance dualism (mind and body are distinct substances).'
        feedback: |
          A substance dualist expects that mind and brain can come apart, so this result would sit comfortably with the view (it would instead count against the claim that the mind always needs a working brain).
      - text: 'Idealism (mind is fundamental).'
        feedback: |
          If mind is fundamental, experience without a brain is not a surprise. The brain is, for an idealist, something that appears to minds.
    explanation: |
      Physicalism and emergence tie experience to physical activity, so an experience with none would be evidence against them. In practice a defender could reply that the instruments missed the activity, which is the move from the lesson When Data Cannot Decide: a single result can always be absorbed by changing an auxiliary assumption, and what matters is the cost. That the observation *would count against* the view is what makes it testable in Popper's sense. **Layer:** here the observation is hypothetical; in fact brain damage, drugs and anaesthesia change experience in systematic ways (layer 1), which every view in this level accepts.

  - type: mcq
    id: p5-closure
    title: "A test that dualism survives"
    prompt: |
      Suppose a long program of measurements shows that every brain event has a sufficient physical cause, with no gaps (closure confirmed everywhere we look). Which statement is right about the dualist family?
    options:
      - text: 'It counts against interactionism, which needs gaps for the mind to fill. It does not count against epiphenomenalism, parallelism or property dualism, which accept closure; each pays its own price.'
        correct: true
      - text: 'It refutes dualism in every form.'
        feedback: |
          Dualism is a family. Epiphenomenalism and parallelism accept closure by design, and property dualists can keep it too.
      - text: 'It counts against no form of dualism, because dualism is not testable.'
        feedback: |
          Interactionism does make a claim that closure would count against: that physics alone leaves events open to a mind''s influence. The versions that give up nothing testable are the ones that accept closure.
    explanation: |
      The question "what would count against it?" must be asked of a *version* of a view. Interactionism is exposed to the closure test; epiphenomenalism is not, but pays by saying the mind causes nothing (it gives up P2). This is how a broad position survives while a variant takes the loss, which is the shape of the Lakatos-style picture of a research programme. **Layer:** confirming closure everywhere would still not prove it exceptionless, so it would stay a well-supported working assumption.

  - type: mcq
    id: p5-nothing
    title: "No test yet, and what that means"
    prompt: |
      For panpsychism (experience is the intrinsic nature of basic matter) and for idealism (mind is fundamental), is there a laboratory result known today that would count against them?
    options:
      - text: 'No. Physics describes structure and behaviour, which these views accept; they differ about what lies behind it. They are metaphysical commitments, judged by their costs (the combination problem, the unthought tree), not by a decisive experiment.'
        correct: true
      - text: 'Yes: any brain-damage result counts against them, since it shows that the mind depends on matter.'
        feedback: |
          Dependence of experience on the brain is common ground. A panpsychist says the brain organizes experience; an idealist says the brain is how a mind appears to other minds.
      - text: 'No, which shows these views are worthless or meaningless.'
        feedback: |
          That overreaches. Failing a test for being decided by experiment is not a verdict of falsehood: Popper''s criterion marks what experiments can decide, not what is worth thinking about. The views can still be argued on coherence, simplicity and fit with what we know.
    explanation: |
      The same holds for physicalism and dualism as claims about what exists (rather than about a specific mechanism): they are metaphysical commitments, with evidence fitting them all. Asking "what would count against it?" is useful even then: it separates the part of a view that experiments can touch (a variant, such as interactionism) from the part they cannot.

  - type: numeric
    id: p5-bayes
    title: "One Bayes update"
    prompt: |
      Take two hypotheses about the mind: $H_1$, "experience depends on the working brain" and $H_2$, "experience does not depend on the brain". Suppose you start with $30\%$ for $H_1$ and $70\%$ for $H_2$. The observation $E$ is "brain damage changes experience in systematic ways". Assume (invented numbers, for the exercise) that $E$ is nine times as likely under $H_1$ as under $H_2$. What is your probability for $H_1$ after seeing $E$, in percent?
    answer: 79.4
    tolerance: 0.3
    wrong:
      - { value: 90, feedback: 'That drops the prior. A likelihood ratio of $9$ multiplies the *odds*, and the starting odds were $3:7$, not $1:1$.' }
      - { value: 270, feedback: 'That multiplies the probability $30\%$ by $9$. The factor applies to the odds, and a probability can never exceed $100\%$.' }
    hint: Prior odds are 3 to 7. Multiply the odds by the ratio, then turn odds back into a probability.
    explanation: |
      $$\text{odds}=\frac{3}{7}\times9=\frac{27}{7}$$
      $$P(H_1\mid E)=\frac{27}{27+7}=\frac{27}{34}\approx0.794$$
      The evidence moved a $30\%$ prior to about $79\%$. The likelihood ratio is the data, and the prior is the weighing before it.

  - type: mcq
    id: p5-bayes2
    title: "What the update does not settle"
    prompt: |
      After the update above, a student says: "So physicalism is now $79\%$ likely, and dualism and idealism are in trouble." What is the best reply?
    options:
      - text: 'The update separates "depends on the brain" from "independent of the brain". Physicalism, interactionist dualism, panpsychism and most idealisms all predict dependence, so the likelihood ratio between them is about $1$ and their odds do not move. Dependence is common ground; what differs is its reading.'
        correct: true
      - text: 'The update is wrong, since evidence cannot change a probability that depends on a prior.'
        feedback: |
          Priors are exactly what evidence updates. The step was valid; the issue is what hypotheses were compared.
      - text: 'It is right: if the brain affects experience, only physicalism can be true.'
        feedback: |
          That treats dependence as identity. A dualist says the brain is a necessary channel for experience, a panpsychist that it organizes it, an idealist that it is how mind appears. The data fit them all.
    explanation: |
      This is the lesson of the whole level in one line: find a hypothesis pair on which the evidence actually *differs* before updating, and notice when all your views predict the same thing. Whether dependence means identity or only correlation is a live debate (layer 2).

  - type: mcq
    id: p5-layers
    title: "Three layers, five claims"
    prompt: |
      Classify each claim as (1) established fact, (2) live debate, or (3) metaphysical commitment.

      - **(i)** Injury, drugs and anaesthesia change experience in systematic ways.
      - **(ii)** Every physical effect has a sufficient physical cause, without exception.
      - **(iii)** Everything that exists is physical.
      - **(iv)** Experience is a basic feature of the simplest things.
      - **(v)** In Conway''s Game of Life, a glider is found by running the rules and is mentioned by none.
    options:
      - text: '(i) 1, (ii) 2, (iii) 3, (iv) 3, (v) 1.'
        correct: true
      - text: '(i) 1, (ii) 1, (iii) 3, (iv) 3, (v) 2.'
        feedback: |
          Closure is a successful working assumption, but whether it holds without exception is debated. And the glider is not debated: it is a plain result of the rules (weak emergence).
      - text: '(i) 2, (ii) 3, (iii) 1, (iv) 2, (v) 1.'
        feedback: |
          Physicalism is not an established result: it is a claim about everything, and no experiment settles it. That is the mistake of passing a layer-3 claim off as layer 1.
      - text: '(i) 1, (ii) 2, (iii) 2, (iv) 2, (v) 3.'
        feedback: |
          Claims of the form "everything is ..." or "the basic things are ..." are commitments about what exists, not debates over data. And (v) is a checkable fact.
    explanation: |
      The layers do not rank claims by worth. Layer 3 claims can be argued well or badly. The error is mislabelling: calling physicalism a result of science, or calling panpsychism a result of introspection, in either direction.

  - type: order
    id: p5-order
    title: "Rebuild the closure argument"
    prompt: |
      Put Kim's closure argument in order, from a decision to the conclusion about a separate non-physical mind.
    steps:
      - 'Mara decides to raise her arm, and her arm rises (P2: her mental decision causes the physical movement).'
      - 'The movement has a sufficient physical cause in her neurons and muscles (P1: physical closure).'
      - 'So the movement seems to have two sufficient causes, her decision and the neural cause.'
      - 'P3 says this double causation is not systematic: the movement is not caused twice over by independent sufficient causes.'
      - 'So the mental cause is not a separate cause. Either the decision is the physical cause (physicalism), or one of P1 to P3 must go.'
    hint: Facts first (the decision, the neural cause), then the clash, then the rule, then the way out.
    explanation: |
      The conclusion is a choice, not a single result: physicalism keeps all three; interactionism drops P1; epiphenomenalism drops P2; accepting overdetermination drops P3. The validity of the steps is separate from the truth of P1 to P3.

  - type: mcq
    id: p5-parting
    title: "Where thoughtful people part ways"
    prompt: |
      Everyone in this problem accepts the same data about brains and experience. Which pairing of a disagreement with its source (a premise, a value, or a kind of evidence) is right?
    options:
      - text: 'Physicalist and interactionist: they differ on a premise (whether closure holds without exception). Panpsychist and emergentist: they differ in what they value in an explanation (accepting an odd claim about electrons, or a brute law at a level of complexity). The idealist and the physicalist: they differ in what counts as evidence at all (experience as what we know first, or the public success of physical explanation).'
        correct: true
      - text: 'All of them differ over a fact that one of them has simply failed to look up.'
        feedback: |
          The data are shared. A look-up would not settle a premise, a weighing of costs, or the choice of what counts as basic.
      - text: 'All of them differ only in words: the views say the same thing.'
        feedback: |
          They give different answers to concrete questions, such as whether a physical duplicate has experience. The differences are real, though they are not differences in the measured data.
    explanation: |
      This is the method of the course: find where views part (a premise, a value, a kind of evidence), name its layer, and see the cost of each choice. This pairing is one fair reading; defenders would word it differently, and the same pair can differ on more than one source at once.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **The combination problem has teeth.** Linking every pair of $n$ micro-subjects takes $n(n-1)/2$ links: $15$ for $6$, $66$ for $12$. The replies are constitutive (the big is made of the small, not caused by it), integrated information (experience arises where a system is highly integrated) and cosmopsychism (start from one subject and divide it); each is a price, not a refutation.
      - **Idealism under pressure.** From "I cannot conceive an unperceived tree" to "it cannot exist" is a step from the mind to the world. The unperceived stalactite is kept in being by God (Berkeley, traditionally read) or by the pattern of experiences that *would* occur (phenomenalists). Idealist supervenience: no physical difference without a mental one.
      - **One question, three answers.** Does a physically identical world have experience? Physicalist: yes, necessarily (supervenience). Dualist: not necessarily. Panpsychist: yes, since experience is the intrinsic nature of what is copied.
      - **What would count against a view.** Experience with no brain activity would count against physicalism and emergence; confirmed closure would count against interactionism but not against epiphenomenalism or parallelism; panpsychism and idealism have no decisive test known, so they are weighed by costs. One Bayes update ($30\%$ prior, likelihood ratio $9$, posterior $\tfrac{27}{34}\approx79\%$) separates dependence from independence, and leaves the views that share dependence where they were.
      - **Layers and where people part.** Data are layer 1; closure as exceptionless and consciousness as strongly emergent are layer 2; what exists is layer 3. Thoughtful people part over a premise, a value, or what counts as evidence, not over the measurements.

      **Next:** Level 4, **Mathematics and Why It Works**, starts with the lesson The Unreasonable Effectiveness: why does mathematics invented for one purpose keep predicting new facts about the world?
