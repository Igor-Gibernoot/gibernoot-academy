id: ch03-quantum
title: "What Quantum Mechanics Does and Does Not Say"
kind: concept
own: |
  - **The recipe and what is settled.** A quantum system (say an electron's spin, which can be measured as "up" or "down") is described by a **state** $|\psi\rangle$ (a list of numbers called **amplitudes**, one per possible outcome). Between measurements the state changes smoothly and deterministically (the Schrödinger equation). For a measurement, the **Born rule** says: for the state $|\psi\rangle = a\,|{\uparrow}\rangle + b\,|{\downarrow}\rangle$ with $|a|^2+|b|^2=1$,
  $$P(\uparrow) = |a|^2,\qquad P(\downarrow)=|b|^2$$
  {{ The probability of an outcome is the squared size of its amplitude }}. This recipe predicts experiments to great precision (established fact), and the standard interpretations all agree on those predictions.
  - **The measurement problem.** Two rules seem to clash: smooth evolution of the state (which, applied to a measuring device, gives a device in a superposition of "reads up" and "reads down") and the measurement rule (which gives {{ one definite outcome, with Born-rule probabilities }}). Schrödinger's cat (1935) dramatises it. The problem is about what the state is and what happens at a measurement; it is not a failure of the predictions.
  - **Four answers, and what each pays.** According to **Copenhagen** (Bohr, Heisenberg; not one doctrine), the state is a tool for predicting what is observed in classical terms, with no further picture of the unobserved. According to **many worlds** (Everett 1957), {{ the state never collapses: every outcome happens, in branches of one universal state }}, and the price is explaining why probabilities mean anything. According to the **pilot wave** (de Broglie 1927, Bohm 1952), {{ the particles have actual positions, guided by the wave, so outcomes are determined by hidden initial positions }}, and the price is nonlocality. According to **QBism**, {{ the state is an agent's personal degrees of belief about their future experiences }}, and the price is a more subjective view of what physics describes.
  - **Where people part ways.** Which view is right is a live debate (layer 2), decided so far by criteria such as clarity and cost, not by experiment; each carries a metaphysical commitment (layer 3). Claims that quantum mechanics itself proves free will, a soul, or that consciousness creates reality go beyond the established part.
cards:
  - type: mcq
    id: hook
    title: "One electron, two doors"
    prompt: |
      Guess before any theory. An electron has a property called **spin**, which, when measured along the vertical direction, always gives one of exactly two results: "up" or "down". Suppose the electron is prepared in a state that physicists call "spin pointing right", which makes the two vertical results equally likely. You prepare it identically and measure it 1000 times. What do you see?
    options:
      - text: 'Each single measurement gives either up or down (never something in between); over the 1000 runs, about half are up and half are down, and nothing in the preparation tells you which one comes next.'
        correct: true
      - text: 'Every measurement gives up, because the preparation was identical each time.'
        feedback: |
          This is what the classical intuition expects: same cause, same effect. Identical preparations of this kind do give different results, which is the first strange fact of quantum mechanics: the theory predicts frequencies, not each single outcome.
      - text: 'Each measurement gives a blurred, half-way reading between up and down.'
        feedback: |
          Measuring devices show one of the two results each time, never a half-way one. What is half-and-half is the frequency over many runs.
    explanation: |
      The statistics are the established part. What is not settled is the next question: why that outcome on that run, and what the electron was "like" before. The competing interpretations are answers to that question.

  - type: text
    id: recipe
    title: "The recipe"
    body: |
      Quantum mechanics, as physicists use it, is a recipe with two parts.

      1. **The state.** A system has a **state** $|\psi\rangle$: a list of numbers called **amplitudes**, one per possible outcome. For a spin measured up or down,
      $$|\psi\rangle = a\,|{\uparrow}\rangle + b\,|{\downarrow}\rangle$$
      where $a$ and $b$ are the amplitudes (here real numbers; in general they may be complex). Between measurements the state evolves **smoothly and deterministically**, following the Schrödinger equation.
      2. **The Born rule.** When you measure, you get one result, and the probability of each is the squared size of its amplitude (the rule is due to Max Born, 1926):
      $$P(\uparrow)=|a|^2,\qquad P(\downarrow)=|b|^2$$
      Probabilities must add to 1, so $|a|^2+|b|^2=1$ (the state is **normalised**).

      The state with $a = b = 1/\sqrt2$ is the "spin pointing right" of the hook. A state with both amplitudes non-zero is called a **superposition**.

  - type: numeric
    id: born
    title: "Using the rule"
    prompt: |
      An electron has the state $|\psi\rangle = 0.6\,|{\uparrow}\rangle + 0.8\,|{\downarrow}\rangle$. Using the Born rule $P=|\text{amplitude}|^2$, what is the probability of measuring "down"?
    answer: 0.64
    tolerance: 0.005
    wrong:
      - { value: 0.8, feedback: 'That is the amplitude itself, not its square. Probabilities are the squares of the amplitudes.' }
      - { value: 0.36, feedback: 'That is the probability of "up" ($0.6^2$). The question asks for "down", whose amplitude is $0.8$.' }
    hint: 'Square the amplitude that goes with "down".'
    explanation: |
      $P(\downarrow)=0.8^2=0.64$ and $P(\uparrow)=0.6^2=0.36$; they add to $1$, as they must.

  - type: numeric
    id: normal
    title: "Normalising"
    prompt: |
      A state is $|\psi\rangle = a\,|{\uparrow}\rangle + 0.5\,|{\downarrow}\rangle$ with $a>0$. For the probabilities to add to 1, what must $a$ be? (Give the number to three decimals.)
    answer: 0.866
    tolerance: 0.002
    wrong:
      - { value: 0.5, feedback: 'With $a = 0.5$ the probabilities would be $0.25+0.25 = 0.5$, not $1$.' }
    hint: 'You need $a^2 + 0.5^2 = 1$.'
    explanation: |
      $a^2 = 1 - 0.25 = 0.75$, so $a=\sqrt{0.75}\approx 0.866$. Then $P(\uparrow)=0.75$ and $P(\downarrow)=0.25$.

  - type: mcq
    id: established
    title: "What is settled"
    prompt: |
      According to physicists across all schools, which statement about the recipe is **established fact** (layer 1) rather than interpretation?
    options:
      - text: 'The recipe (state, smooth evolution, Born rule) predicts the statistics of measurement results, and the predictions have been confirmed in experiments to very high precision.'
        correct: true
      - text: 'Before a measurement, the electron has no definite properties at all.'
        feedback: |
          This is an interpretation. Pilot-wave theory says the electron always has a definite position; Copenhagen declines to say; many worlds says every outcome is realised. The recipe alone does not decide it.
      - text: 'A measurement changes the state because the observer looks at the system.'
        feedback: |
          Whether the state "changes" physically, and what role an observer plays, is exactly what the interpretations dispute. The word "observer" in physics usually means any measuring device, not a person.
    explanation: |
      The line between layers matters for the rest of the lesson: the recipe and its numerical success are layer 1; what the recipe *means* is layer 2 (a live debate among physicists and philosophers) and layer 3 (it carries metaphysical commitments).

  - type: text
    id: problem
    title: "The measurement problem"
    body: |
      Now apply the recipe to the measuring device itself, which is also made of atoms and so should follow the same smooth evolution. Suppose the electron is in the superposition $a|{\uparrow}\rangle + b|{\downarrow}\rangle$ and meets a device with a pointer. The smooth evolution gives the state

      $$a\,|{\uparrow}\rangle|\text{reads up}\rangle + b\,|{\downarrow}\rangle|\text{reads down}\rangle$$

      a superposition of two pointer positions. But the Born rule says we get *one* result. In 1935 Erwin Schrödinger (1887-1961) dramatised this by putting a cat in the device's place (a sealed box in which a radioactive decay would trigger poison): the smooth rule seems to leave the cat in a superposition of alive and dead. He did not propose it as a real experiment.

      This is the **measurement problem**: two rules in the recipe, smooth evolution and "one result with Born probabilities", seem to conflict, and the theory does not say clearly when or why we pass from the first to the second.

  - type: order
    id: problem-steps
    title: "Rebuilding the problem"
    prompt: Put the steps of the measurement problem in order.
    steps:
      - 'The electron is in a superposition of up and down.'
      - 'The smooth evolution, applied to electron plus device, gives a superposition of "reads up" and "reads down".'
      - 'Yet every actual measurement shows one definite pointer reading.'
      - 'So the recipe needs an account of how the single outcome arises, and the interpretations offer different ones.'
    hint: 'First the state, then what the smooth rule does, then what we see, then what is left to explain.'
    explanation: |
      The problem is not that the predictions fail (they work); it is that the recipe's two rules do not fit together into one clear story about what is physically happening.

  - type: mcq
    id: problem-misread
    title: "What the problem is not"
    prompt: |
      Which is the correct statement about the measurement problem?
    options:
      - text: 'It is a problem about what the state is and what happens at a measurement; the predictions of the recipe are not in doubt.'
        correct: true
      - text: 'It shows that quantum mechanics gives wrong predictions for large objects like cats.'
        feedback: |
          Nobody has seen a cat in a superposition, but the problem is not that the predictions fail. It is that the theory does not say clearly why the superposition is not seen.
      - text: 'It was solved once physicists realised that an observer with a conscious mind must be present.'
        feedback: |
          Some proposals link measurement to consciousness, but they are a minority position and are themselves disputed; most physicists take "observer" to mean any device that records. It is not a settled solution.
    explanation: |
      The rest of the lesson meets the four best-known answers. Keep in mind the layers: all four reproduce the recipe's predictions; they differ in what they say the world is like.

  - type: text
    id: copenhagen
    title: "Answer 1: Copenhagen"
    body: |
      The label **Copenhagen interpretation** goes with Niels Bohr (1885-1962) and Werner Heisenberg (1901-1976), who worked in Copenhagen in the 1920s. According to the Stanford Encyclopedia of Philosophy it is **not one doctrine**: Bohr and Heisenberg never fully agreed, neither used the label for their joint view, and it apparently occurs first in Heisenberg's writing of 1955.

      The core ideas, according to the usual accounts:

      - Results of experiments must be described in everyday (classical) terms, because that is how they are communicated. Bohr held that the account of all evidence must be expressed in classical terms.
      - The wave function is a tool for predicting results, not a picture of what the system is like between measurements.
      - The Born rule is taken as basic; asking what happens "underneath" is, for Bohr, not a question the theory is meant to answer.

      Textbooks often add a **collapse**: at a measurement the state jumps to the state of the result found. According to the same encyclopedia, collapse as a physical process is associated with Heisenberg and others, and Bohr himself did not discuss it.

  - type: mcq
    id: copenhagen-q
    title: "Copenhagen, fairly put"
    prompt: |
      A defender of the Copenhagen outlook is asked: "Where was the electron before the measurement, and why did it give *up* this time?" What reply is in the spirit of that view?
    options:
      - text: 'The theory gives the probabilities of what will be observed; asking for a further picture of the unobserved electron or a cause of this single result goes beyond what the theory says.'
        correct: true
      - text: 'The electron was secretly up all along, and we simply did not know.'
        feedback: |
          This is a hidden-variable answer. A version of it exists (the pilot wave, met below), but it is not the Copenhagen reply, which declines to add such a fact.
      - text: 'Every outcome happened, and we only see one branch.'
        feedback: |
          That is the many-worlds reply, not Copenhagen's.
    explanation: |
      The best objection: if the theory is about everything, why are measuring devices exempt from it? The Copenhagen reply is that devices are used in classical terms to communicate results; critics say this leaves the line between "device" and "system" unexplained. Both are live.

  - type: text
    id: everett
    title: "Answer 2: many worlds"
    body: |
      Hugh Everett III (1930-1982) asked: what if the smooth rule is all there is? In his 1957 paper, "'Relative State' Formulation of Quantum Mechanics" (*Reviews of Modern Physics*), he dropped the collapse and treated observers as physical systems inside the theory. The state of everything, the **universal wave function**, evolves smoothly and never collapses.

      Then the state with the device in two pointer positions is simply *what is the case*: both results occur, in different **branches**, and the observer too ends up in two versions, each seeing one result. Bryce DeWitt's 1970 popular account presented this as worlds splitting, hence the name **many worlds**. Later defenders (David Wallace among them) use a process called **decoherence** (superpositions becoming practically unable to interfere) to say which branches count as separate worlds.

      The price, according to critics: if every outcome happens, what does "70% likely" mean? The Stanford Encyclopedia notes Everett did not derive the probabilities directly but used a typicality measure (the squared amplitude), and that justifying probabilities in this view requires extra assumptions, such as decision-theoretic or self-locating-uncertainty arguments. Defenders think these arguments work; critics do not. That is live.

  - type: mcq
    id: everett-q
    title: "Does the second version of me see up?"
    prompt: |
      According to the many-worlds view, an electron in the state $0.6|{\uparrow}\rangle+0.8|{\downarrow}\rangle$ is measured. What happens to the "up" outcome, which has Born probability $0.36$?
    options:
      - text: 'It happens in one branch of the universal state, with a version of the observer who sees up, and the other branch (down) happens as well.'
        correct: true
      - text: 'It happens with probability $0.36$, and in the other $64\%$ of cases it does not happen anywhere.'
        feedback: |
          That is the collapse picture: one outcome is realised, the other disappears. Many worlds rejects collapse; both outcomes are realised.
      - text: 'It happens in $36\%$ of the branches, because there are $100$ equally weighted branches.'
        feedback: |
          Counting branches does not give the Born weights: here there are just two branches, with weights $0.36$ and $0.64$. Why those weights should mean probability is exactly what is disputed.
    explanation: |
      Two branches with unequal weights is the heart of the probability puzzle: if all outcomes happen, why is down "more likely" than up?

  - type: text
    id: bohm
    title: "Answer 3: the pilot wave"
    body: |
      Louis de Broglie (1892-1987) presented at the Solvay conference of 1927 an equation in which a wave guides a particle; the idea was abandoned, and David Bohm (1917-1992) rediscovered it in 1952. In this **pilot-wave** (de Broglie-Bohm) theory:

      - A system has the wave function, evolving by the Schrödinger equation, **plus** actual particles with definite positions.
      - The wave function sets the particles' velocities through a **guiding equation**, so the dynamics are deterministic.
      - The "randomness" is ignorance of the initial positions: if they are spread according to $|\psi|^2$, the theory gives the same predictions as the recipe.

      The result "up" or "down" is determined by where the particle actually was. The price, according to the Stanford Encyclopedia: for entangled particles (the topic of the next lesson), a particle's motion depends instantly on the positions of distant ones, so the theory is **nonlocal**; it cannot be used to send signals, and it is not simply compatible with relativity. Defenders add that its clarity makes it a genuine alternative; critics (Leggett among them) call it more a reformulation than a new theory.

  - type: mcq
    id: bohm-q
    title: "Hidden, but not magic"
    prompt: |
      According to the pilot-wave theory, why can't we predict a single spin result with certainty, even though the theory is deterministic?
    options:
      - text: 'We cannot know the exact initial positions of the particles; given them, the result would be fixed, and over many runs the positions follow $|\psi|^2$, which reproduces the Born statistics.'
        correct: true
      - text: 'Because the particles move at random, with no law.'
        feedback: |
          The motion follows a definite law (the guiding equation). The apparent randomness comes from not knowing the starting positions, as in a coin toss.
      - text: 'Because the theory predicts different statistics from the recipe, and experiments have not yet been precise enough to see it.'
        feedback: |
          Under the equilibrium assumption the pilot-wave theory gives the same statistics as the recipe, so experiments cannot separate them this way.
    explanation: |
      This is why the choice among interpretations is not settled by experiment: where they reproduce the recipe's predictions, they cannot be told apart by results.

  - type: text
    id: qbism
    title: "Answer 4: QBism"
    body: |
      **QBism** (from "quantum Bayesianism") grew from work of Carlton Caves, Christopher Fuchs and Rüdiger Schack from about 2002; N. David Mermin became a prominent proponent. Its central claim, according to the Stanford Encyclopedia: a quantum state does **not** describe a physical system. It is an **agent's own degrees of belief** about their possible future experiences after actions they might take (the Bayesian idea of probability as belief, met in the lesson Evidence as Updating Belief).

      - A **measurement** is an agent's action on the world that produces a personal experience.
      - There is **no physical collapse**: the state "jumps" when the agent updates beliefs on new experience, as your probability for rain jumps when you see clouds.
      - The Born rule is not a law of nature but a **normative** requirement of rational belief, added to ordinary probability coherence.
      - Correlations between distant experiments need no nonlocal influence, since they are patterns among each agent's own experiences.

      The price, according to critics: physics becomes a tool for agents rather than a description of how the world is, and it is unclear what the world contributes beyond our experiences. QBists reply that the world exists and constrains experience, but quantum theory does not describe it directly.

  - type: mcq
    id: qbism-q
    title: "Why does the state jump?"
    prompt: |
      A spin is measured and gives "down". According to QBism, why does the agent's state change from $0.6|{\uparrow}\rangle+0.8|{\downarrow}\rangle$ to $|{\downarrow}\rangle$?
    options:
      - text: 'Because the agent learned the result and updates their beliefs; no physical jump in the electron is needed.'
        correct: true
      - text: 'Because the electron physically collapsed when the agent looked at it.'
        feedback: |
          Physical collapse is what QBism denies. It treats the jump as a change in knowledge, like crossing out the losing horse after a race.
      - text: 'Because the state describes the electron, and the electron was in the down state the whole time.'
        feedback: |
          Two slips: QBism says the state does not describe the electron, and the "down all along" picture is a hidden-variable view (the pilot wave).
    explanation: |
      The same question has now four answers: nothing deeper to say (Copenhagen), all outcomes happen (many worlds), the position was fixed (pilot wave), my beliefs updated (QBism).

  - type: text
    id: table
    title: "Side by side"
    body: |
      | View | Other outcome | Price |
      |---|---|---|
      | Copenhagen | not asked about | device/system line |
      | Many worlds | another branch | meaning of probability |
      | Pilot wave | never happened | nonlocality |
      | QBism | not a physical question | what the world is |

      All four reproduce the recipe's predictions. In the schools' own terms, each is a way of declining a different one of the recipe's loose ends: that the state describes the world, that it never collapses, that there are no extra variables, or that the process does not depend on the agent.

  - type: mcq
    id: agree
    title: "What they agree on"
    prompt: |
      A student claims: "Since there are four rival interpretations, quantum mechanics is uncertain about whether its predictions are right." What is the best reply?
    options:
      - text: 'The interpretations agree on the predictions for experiments done so far; they disagree on what the theory says about the world behind them.'
        correct: true
      - text: 'The predictions differ, and each experiment so far has been unable to choose a winner.'
        feedback: |
          If predictions differed, experiments could choose. These four are built to give the same statistics, which is why they are called interpretations rather than rival theories.
      - text: 'Only one interpretation is actually used by working physicists, so the others can be ignored.'
        feedback: |
          Working physicists mostly use the recipe and leave the interpretation open. Which view is best is argued in physics and in philosophy of science and has not been settled.
    explanation: |
      This is the situation of the lesson When Data Cannot Decide: the same evidence, several stories. Some proposals change the equations (they are theories that would predict small differences); they are tested by experiment, unlike the four above.

  - type: mcq
    id: overreach
    title: "Quantum words in big claims"
    prompt: |
      A speaker says: "Quantum mechanics proves that consciousness creates reality, so free will and the soul are scientifically established." According to what this lesson separated, what is the fair assessment?
    options:
      - text: 'It passes off an interpretation-dependent, metaphysical claim (layer 3) as an established result (layer 1): the recipe says nothing of the sort, and most interpretations assign no special role to minds.'
        correct: true
      - text: 'It is simply false: quantum mechanics rules out any role for consciousness.'
        feedback: |
          The error runs both ways. The theory does not rule out the claim either; a minority of proposals give observers a role. The point is that the established recipe neither proves nor refutes it.
      - text: 'It is correct, because the word "observer" in physics means a conscious person.'
        feedback: |
          In physics "observer" or "measurement" usually means any interaction that records a result, such as a detector. Reading it as a conscious person is a common source of this confusion.
    explanation: |
      A respectful version: someone may hold a view about mind and nature that fits one interpretation; that is a metaphysical commitment to be argued for, not a result of the recipe.

  - type: mcq
    id: open
    title: "What stays open"
    prompt: |
      Which is a question that the measurement problem leaves **open** after all four views?
    options:
      - text: 'What the quantum state is (a description of the world, or of our knowledge), and why we see one outcome, or whether the question is well posed.'
        correct: true
      - text: 'Whether the Born rule gives correct statistics in the laboratory.'
        feedback: |
          That is settled by experiment: the rule works. The open part is what it means.
      - text: 'Whether the Schrödinger equation has been replaced by a better equation in all textbooks.'
        feedback: |
          The equation is still standard. Proposals that modify it exist but are not part of the textbook recipe.
    explanation: |
      Those who weigh the options differently do so on different grounds: some value the least extra structure (many worlds), some the clear picture of a world with definite things (pilot wave), some a minimal claim about what physics is for (Copenhagen, QBism).

  - type: mcq
    id: return
    title: "Back to the thousand electrons"
    prompt: |
      Back to the hook: identical preparations give up about half the time and down the other half. A pilot-wave theorist, a many-worlds theorist and a QBist are asked why. Which pairing of view and reply is correct?
    options:
      - text: 'Pilot wave: the initial positions differed unseen. Many worlds: both results happened, in different branches. QBism: the state is my belief, and the result is a new experience that updates it.'
        correct: true
      - text: 'Pilot wave: the preparation did not actually repeat. Many worlds: one result is real and the rest are fictions. QBism: the electron is conscious.'
        feedback: |
          Each clause misstates a view. Under pilot wave the preparations are equal in the wave and differ in the positions; in many worlds all results are real; QBism says nothing of electron consciousness.
      - text: 'All three agree that a hidden cause picks each result.'
        feedback: |
          Only the pilot wave adds such a cause. Many worlds says no choice is made; QBism says the state is not a description of the electron at all.
    explanation: |
      Same experiment, same numbers, four stories. The next lesson meets the result that limits which stories can be told, Bell's theorem.

  - type: text
    id: summary
    body: |
      **Next:** John Bell showed in 1964 that any theory in which results are fixed by local hidden variables disagrees with quantum predictions. The guided problem Bell's Inequality with Numbers computes the bound, so we can see which stories survive and what a test would look like.
