id: ch03-dualism
title: "Two Kinds of Stuff: Dualism"
kind: concept
own: |
  - **Dualism, defined.** According to its defenders, **dualism** is the thesis that {{ mind and matter are two different kinds (of substance or of property), neither reducible to the other }}. A **substance** is a thing that can exist in its own right; a **property** is a feature a thing has (being red, hurting).
  - **Substance dualism** (René Descartes, 1596-1650, *Meditations*, 1641). Body is a substance whose essence is to be **extended** (to occupy space); mind is a substance whose essence is {{ to think, and it is not extended }}. His doubt argument, as premises: P1 I can doubt that my body exists, P2 I cannot doubt that I think, P3 (Leibniz's law) things that differ in a property are not identical, C: my mind is not my body. A critic rejects P3 as applied here: that I can doubt something describes *my state of knowledge*, not what the thing *is*.
  - **Property dualism** (David Chalmers, b. 1966). There is one kind of substance, the physical world, but {{ some of its properties (conscious experience) are not physical properties and are not fixed by the physical ones }}. It is weaker than substance dualism: no separate soul.
  - **The interaction problem** (Princess Elisabeth of Bohemia, 1643, to Descartes). If mind is not extended and matter is, how does a mind move a body? Combined with Kim's three premises (P1 physical causal closure, P2 mental events cause physical events, P3 no systematic overdetermination), a dualist must reject one: **interactionism** rejects {{ closure (a mind steers matter, for instance through quantum events) }}, **epiphenomenalism** rejects P2 (the mind causes nothing), **parallelism** and **occasionalism** deny direct mind-body causation (their agreement is arranged in advance, or by God at each moment).
  - **Supervenience.** Physicalism: two possible worlds alike physically are alike mentally. Most dualists {{ deny this: a world physically identical to ours could lack experience (or have different experience) }}.
  - **Where thoughtful people part ways.** Whether "I can doubt it" shows a real difference; whether causation needs shared extension; whether closure is a finding of physics or an assumption. Layers: brain-experience correlation is established; closure is a well-supported working assumption but a live debate as a metaphysical law; dualism and physicalism are metaphysical commitments.
cards:
  - type: mcq
    id: hook
    title: "You decide to raise your arm"
    prompt: |
      You decide to raise your arm, and it rises. Before any theory: guess. What is the decision itself, the experience of "I will raise it"?
    options:
      - text: 'It is a different kind of thing from the arm and the muscles, yet it makes them move.'
        correct: true
      - text: 'It is a state of the brain, the same thing seen from inside.'
        feedback: |
          This is the physicalist answer (see the lesson Matter Is All There Is?), and a fair one. It is not the answer many people give *first*, and it is not the one this lesson studies.
      - text: 'It is an illusion: the arm rises for physical reasons and the decision only feels like the cause.'
        feedback: |
          Some philosophers hold this (it is called epiphenomenalism, met later in this lesson). It is a third answer and needs its own argument.
    explanation: |
      The first answer is **dualism**: mind and matter are different kinds of thing, and yet they seem to act on each other. That "yet" is the whole difficulty, and it is what this lesson follows.

  - type: text
    id: define
    title: "Dualism, defined"
    body: |
      **Dualism** (from the Latin *duo*, two) is the thesis that, according to its defenders, *mind and matter are two different kinds, neither reducible to the other.* It is a claim about **what exists** (metaphysics), a rival to physicalism and to idealism, which each pick one side.

      Two words need a plain gloss:

      - A **substance** is a thing that can exist in its own right (a stone, a soul, if there is one).
      - A **property** is a feature a thing has (being heavy, being red, feeling pain).

      Dualism comes in two main forms, depending on *what* is doubled: **substances** (two kinds of thing) or **properties** (two kinds of feature of one world). We take the classic form first.

  - type: text
    id: descartes
    title: "Descartes: substance dualism"
    body: |
      René Descartes (1596-1650), in the *Meditations on First Philosophy* (1641), held that there are two substances:

      - **Body** (matter): its essence is to be **extended**, meaning to take up space (it has length, shape, position, and can be divided into parts). It does not think.
      - **Mind** (soul, the thinking thing): its essence is **thinking** (doubting, willing, feeling, understanding). According to Descartes it is *not* extended: it has no size and no position.

      This is **substance dualism** (also called Cartesian dualism, after his Latinised name, Cartesius). Note that it is a claim about what a mind *is*, not only about what it does: a mind could, in principle, exist without a body, which is why the view fits beliefs in an afterlife (a layer-3 link, not a proof).

  - type: mcq
    id: sort
    title: "Which side of the line?"
    prompt: |
      According to Descartes, which of these belongs on the *mind* side (not extended, thinking) rather than the body side (extended, not thinking)?
    options:
      - text: 'Your pain, as felt, and the act of wondering whether the sky is blue.'
        correct: true
      - text: 'The brain that you use when you wonder.'
        feedback: |
          The brain is a lump of matter: it takes up space and can be cut into parts. For Descartes it is on the body side, even though it is involved when you think.
      - text: 'Your hand, because it feels pain.'
        feedback: |
          The hand is extended matter. According to Descartes the *feeling* is in the mind; the hand is the body part where the mind experiences it.
    explanation: |
      Notice the line is drawn by **extension**: anything with a position and a size goes with matter. That choice is what makes the next problem sharp.

  - type: text
    id: doubt
    title: "Descartes' reason one: the doubt argument, as a guided proof"
    body: |
      Descartes began by doubting everything that could be doubted. One common reconstruction of his argument for why mind and body are distinct:

      - **P1.** I can doubt that my body exists (I might be dreaming, or deceived by a powerful trickster).
      - **P2.** I cannot doubt that I am thinking (even doubting is thinking).
      - **P3.** If two things differ in some property, they are not identical (this is **Leibniz's law**, after Gottfried Leibniz, 1646-1716: identical things share all their properties).
      - **C.** So my mind is not identical to my body.

      The step from P1-P3 to C is valid. The question is whether the premises are all true.

  - type: mcq
    id: doubt-q
    title: "Which premise would a critic reject, and why?"
    prompt: |
      A critic accepts P1 and P2 but rejects P3 *as applied here*. The critic's example: Lois Lane can doubt that Superman is in the room while being sure that Clark Kent is, and yet Superman and Clark Kent are one person. What is the critic's point?
    options:
      - text: 'Being doubted by someone is not a property of the thing itself but of how that person thinks about it; so it cannot be used in Leibniz''s law to separate two things.'
        correct: true
      - text: 'Superman and Clark Kent are two different people, so Leibniz''s law is false.'
        feedback: |
          They are one person under two names, which is the point of the example. Leibniz's law is not rejected; the critic says "can be doubted by me" is not the kind of feature it covers.
      - text: 'Lois Lane cannot doubt anything.'
        feedback: |
          The example needs her to doubt one description and not the other. Her doubt is real; what it shows is about her knowledge, not about the man.
    explanation: |
      Descartes' defenders reply that his case is different: the issue is not two names, but whether *what I am* could lack a body, which is a claim about essence. Critics answer that "I can imagine or doubt X without Y" shows only a gap in what I know. **Layer:** the argument is valid; its P3 step is a live debate in philosophy of mind.

  - type: mcq
    id: divide
    title: "Reason two: divisibility"
    prompt: |
      Descartes also argued that bodies can always be divided into parts, but the mind, which wills, doubts and understands, seems one and indivisible; so mind is not a body. Which reply do critics give?
    options:
      - text: 'A unity of experience can be the product of a complicated divisible system, as a team has one aim although it has many members; the argument assumes the mind is not such a system.'
        correct: true
      - text: 'Bodies cannot really be divided.'
        feedback: |
          Physics shows they can be, at least down to atoms and below. The reply targets the claim about the mind, not about matter.
      - text: 'The mind is divided, because brains can be cut.'
        feedback: |
          This is stronger than it looks (some patients with a cut connection between brain halves behave in split ways), but the physicalist is making a point about the *explanation* of unity, not simply asserting that the mind has pieces.
    explanation: |
      Both arguments reach the same final step: "the mind has a feature the body lacks". Physicalists accept the features (unity, being private) and deny that they require a second substance.

  - type: text
    id: property
    title: "Property dualism: one world, two kinds of feature"
    body: |
      Most modern dualists do not believe in a separate soul. **Property dualism**, defended for example by David Chalmers (b. 1966), says:

      - there is **one** kind of substance, the physical world (brains, atoms, fields);
      - but some of its properties, **conscious experience** (what it is like to see red, to feel pain), are *not physical properties* and are not fixed by the physical ones.

      Chalmers argues for this from the "hard problem" of why physical processes are accompanied by experience at all (a later lesson takes that argument up in detail). Here only the **shape** of the view matters.

  - type: mcq
    id: compare
    title: "Substance or property?"
    prompt: |
      A philosopher says: "There is only the physical universe, but the experience of red, which brains have, is a real feature of it that no physical description includes." Which view is this, according to the definitions above?
    options:
      - text: 'Property dualism: one world, with a non-physical kind of property.'
        correct: true
      - text: 'Substance dualism: there are two kinds of thing.'
        feedback: |
          The speaker keeps a single world (the physical universe). Substance dualism needs a second thing, a mind that exists in its own right.
      - text: 'Physicalism: everything is physical.'
        feedback: |
          Physicalism would deny that the feature of red experience is outside every physical description. The speaker says it is a real feature that none contains.
    explanation: |
      The distinction matters for the objections. A property dualist needs no immaterial soul, so some of the puzzles about *where* a soul would be disappear; but the question "does the extra property make a causal difference?" remains, as the next cards show.

  - type: text
    id: elisabeth
    title: "Princess Elisabeth's question"
    body: |
      In 1643, Princess Elisabeth of Bohemia (1618-1680) wrote to Descartes, in a letter exchange now famous. In paraphrase, she asked: *how can the human soul, which is only a thinking thing and not extended, determine the movements of the body in voluntary action?* Pushing, she observed, seems to require contact and a surface; a thing with no extension has neither.

      Descartes replied that the union of mind and body is a primitive notion we know by living it, not by reasoning, (Years later, in *The Passions of the Soul*, 1649, written out of their exchange, he named the pineal gland in the brain as the place where the soul is most directly attached to the body.) Elisabeth was not satisfied, and most later readers have not been either: this is the **interaction problem**.

  - type: mcq
    id: interaction
    title: "What exactly is the problem?"
    prompt: |
      According to Elisabeth's objection, what is hard for the substance dualist to explain?
    options:
      - text: 'How two things of completely different kinds (one extended, one not) can cause changes in each other, when ordinary causes act through contact or forces in space.'
        correct: true
      - text: 'Why the brain is needed for thinking.'
        feedback: |
          That is easy for the dualist: the brain may be where the mind interacts with the body. The difficulty is the *mechanism* of the interaction.
      - text: 'Why people disagree about whether souls exist.'
        feedback: |
          That is a sociological fact. The objection is a conceptual one about the possibility of causal contact.
    explanation: |
      Dualists have replies: the idea that causation requires contact is itself a philosophical assumption (gravity acts across empty space, and we still say the Sun causes the Earth's orbit), and we have no accepted theory of what causation *is*. A critic answers that in every other case we can say what is exchanged (a force, energy, momentum), and for mind and body nobody can.

  - type: mcq
    id: kim
    title: "The modern form: causal closure"
    prompt: |
      Recall Kim's argument from the lesson Matter Is All There Is?: P1 every physical event that has a cause has a sufficient physical cause (**physical causal closure**); P2 mental events cause physical events (the decision raises the arm); P3 a bodily event is not caused twice over by two independent sufficient causes (no systematic **overdetermination**). Taken with a separate non-physical mind, these three cannot all hold. Why is this the dualist's main problem?
    options:
      - text: 'If a physical cause already suffices for the arm to rise, a non-physical mind has no work left to do; so the dualist must give up one premise, each at a price.'
        correct: true
      - text: 'It shows that the mind does not exist.'
        feedback: |
          It shows no such thing: it shows that a separate mind cannot be both causally effective and causally unnecessary. The dualist chooses what to drop.
      - text: 'It proves the arm rises without any cause.'
        feedback: |
          The physical cause is there, in the brain and muscles. The question is whether anything further is needed.
    explanation: |
      The old puzzle (how can the unextended push?) becomes sharper in the language of physics: the laws appear to cover every physical event without a gap. Whether they really do is the question of the next card.

  - type: mcq
    id: replies
    title: "Four replies, one premise each"
    prompt: |
      Match the dualist reply to the premise it drops or the claim it denies. Which pairing is correct?
    options:
      - text: 'Interactionism: closure fails (the mind steers events physics leaves open, e.g. quantum events). Epiphenomenalism: P2 fails (mental events cause nothing, they only accompany). Parallelism and occasionalism: no direct mind-body causation (their agreement is pre-arranged, or arranged by God at each moment).'
        correct: true
      - text: 'Interactionism: P3 fails (there is overdetermination). Epiphenomenalism: closure fails. Parallelism: the mind is physical.'
        feedback: |
          The pairing is scrambled. Epiphenomenalism *keeps* closure, in fact: it accepts that physics is complete and concludes that mind is a by-product. And parallelism is a form of dualism, not a physicalist view.
      - text: 'All four deny that mind and matter are different kinds.'
        feedback: |
          They are all dualist replies. They differ in the premise they drop, not in the dualism.
    explanation: |
      Examples and costs. *Interactionism with quantum gaps* (John Eccles, 1903-1997, and others): critics note that quantum randomness is not steering, and that warm brains seem to wash out quantum effects; defenders reply that a gap in the physics is all the view needs. *Epiphenomenalism* (T. H. Huxley, 1825-1895, as a steam whistle on a locomotive that does not drive it): the cost is that our talk about experience would not be *caused* by it. *Parallelism* (Leibniz) and *occasionalism* (Nicolas Malebranche, 1638-1715): the cost is a coordinating arrangement that seems unexplained. A fair reader sees that each is a price, not a refutation.

  - type: mcq
    id: super
    title: "Compare with physicalism: supervenience"
    prompt: |
      Physicalism says two possible worlds alike in all physical respects are alike in all mental respects (the mental supervenes on the physical). What do most dualists say about this?
    options:
      - text: 'It fails: there could be a world physically just like ours but with no experience (or different experience).'
        correct: true
      - text: 'It holds, but only because God keeps mind and body in step.'
        feedback: |
          Some dualists (occasionalists) accept a lawful match, but through God's constant action. The more typical claim is that the match is a contingent law of nature, and that without it the physical facts would not settle the mental ones.
      - text: 'It holds in the other direction: all physical facts are fixed by the mental ones.'
        feedback: |
          That is idealism's version (see the lesson Mind First: Idealism). A dualist says neither side fixes the other.
    explanation: |
      Compare the three views on one line: physicalism, the mental depends on the physical; idealism, the physical depends on the mental; dualism, neither depends on the other (except by law or by God). The "zombie world" (a physical duplicate with no experience) is the thought experiment used to press this; its force is itself a debate.

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Classify the claim "A conscious mind is a non-physical thing, distinct from the brain that goes with it."
    options:
      - text: 'A metaphysical commitment (layer 3), supported by arguments (the doubt argument, the hard problem) whose premises are a live debate; the data it must fit (brain damage alters the mind) are layer 1.'
        correct: true
      - text: 'An established fact, because we experience that our minds are different from our bodies.'
        feedback: |
          We do experience pain, thought and so on, and everyone agrees on that. That the experiencer is a separate *thing* is a further claim that physicalists read differently.
      - text: 'A scientific claim refuted by brain research.'
        feedback: |
          Brain research shows that experience depends on the brain (anaesthesia, injury). Dualists agree with this too. It restricts how dualism can be stated, but does not refute it.
    explanation: |
      Notice that dualists have more to explain than physicalists in one place (how the two interact) and less in another (why there is experience at all). Each view has the cost it prefers to pay.

  - type: mcq
    id: back
    title: "Back to the raised arm"
    prompt: |
      Return to the decision and the rising arm. Which statement is a *fair* summary of where thoughtful people part ways?
    options:
      - text: 'They agree on the facts (decisions go with brain activity, and the arm rises); they differ on whether the decision is a further non-physical item, and, if so, on which premise of the causal argument to give up.'
        correct: true
      - text: 'Physicalists deny there are decisions.'
        feedback: |
          Almost none do. Physicalists say the decision is a brain process (or realized by one), not that it does not occur. Only some eliminativists deny ordinary talk of decisions.
      - text: 'Dualists believe the arm rises without any physical cause.'
        feedback: |
          Interactionists say the mind adds to the physical story, but most dualists today accept a full physical correlate. The question is what the extra item does.
    explanation: |
      The method of the course appears again: shared data, a disagreement located in a premise (closure, the doubt argument's P3) and a commitment (what exists). The next lesson looks at a view that tries to dissolve the two-kinds problem by putting experience into the physical world's basic nature: **panpsychism**.

  - type: text
    id: summary
    body: |
      **Next:** panpsychism. If mind and matter are hard to connect when they are different kinds, one option is to say that experience is already a basic feature of matter. The lesson Mind in Everything? Panpsychism and Neutral Monism takes this up, and the "combination problem" it faces.
