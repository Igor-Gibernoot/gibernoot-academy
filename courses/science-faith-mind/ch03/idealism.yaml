id: ch03-idealism
title: "Mind First: Idealism"
kind: concept
own: |
  - **Idealism, defined.** According to its defenders, **idealism** is the thesis that {{ mind (experience) is fundamental, and what we call matter is either made of mind or exists only as it appears to minds }}. It is a claim about *what exists* (metaphysics), the mirror image of physicalism. Kinds: **subjective** (Berkeley: things are ideas in minds), **transcendental** (Kant: we know only appearances, shaped by our minds), **absolute** (Hegel and successors: reality is one rational mind or spirit), **analytic** (Kastrup: one universal mind, individual minds are its dissociated parts).
  - **Berkeley's slogan** (George Berkeley, 1685-1753, *Principles*, 1710). For a sensible thing (a table, a colour),
    $$\text{to be is to be perceived}$$
    in Latin {{ *esse est percipi* }}. His argument, stated as premises: P1 we perceive only ideas (sensations); P2 an idea can exist only in a mind; P3 sensible things are what we perceive; C: sensible things exist only in minds. A critic can reject P1 (we perceive things *through* ideas), or the step from "cannot be *conceived* unperceived" to "cannot *exist* unperceived".
  - **The unthought tree.** If a tree falls with no human near, Berkeley's reply (according to the traditional reading) is that {{ God perceives it }}; the phenomenalist reading (later idealists) is that the tree *is* the pattern of experiences that *would* occur if a mind were present.
  - **Kant** (Immanuel Kant, 1724-1804, *Critique of Pure Reason*, 1781/1787) is *not* Berkeley. For Kant there are **appearances** (what we experience, shaped by space, time and categories like cause) and the **thing in itself** (how things are apart from our way of knowing them), and {{ we can know appearances but not things in themselves }}. He keeps an outer world, and called his view *transcendental* idealism.
  - **Where thoughtful people part ways.** Whether "unperceived existence" is even coherent; whether many minds need one shared mind or God to explain a common world; whether brains are images in a mind or the producers of minds. Layers: the dependence of experience on the brain is established; "mind is fundamental" and "matter is fundamental" are both metaphysical commitments, not experimental results.
cards:
  - type: mcq
    id: hook
    title: "A tree and a table"
    prompt: |
      Nobody is in the forest. A tree falls, and no one sees, hears or touches it. Before any theory: guess. Which answer would most people give first about that tree while nobody perceives it?
    options:
      - text: 'It exists as before; perceiving it changes nothing about it.'
        correct: true
      - text: 'It exists only while someone perceives it.'
        feedback: |
          Few people start here, yet it was defended by serious philosophers. Their reasons are the content of this lesson.
      - text: 'The question has no sense, because nobody could ever check.'
        feedback: |
          Some philosophers hold this (a claim that nothing could ever test is meaningless). But notice that it is a *third* answer, and it too needs an argument.
    explanation: |
      The first is the common-sense answer, and a physicalist's; hold on to it and ask what it takes for granted. It is called **realism** about the external world; the second is a form of **idealism**. We will see what argument leads from the second to a worked-out view, and why equally careful people part ways.

  - type: text
    id: define
    title: "Idealism, defined, and its four families"
    body: |
      **Idealism** (here the word has nothing to do with high ideals) is the thesis that, according to its defenders, *mind (experience) is fundamental, and matter is either made of mind or exists only as it appears to minds*. It is a claim about **what exists**, the mirror image of physicalism, and not a result of any experiment.

      Four families, each glossed:

      - **Subjective idealism** (George Berkeley, 1685-1753): ordinary things are collections of **ideas** (sensations such as colour, sound, hardness) that exist in minds.
      - **Transcendental idealism** (Immanuel Kant, 1724-1804): we know the world only as it *appears* to us, shaped by our minds' own forms. ("Transcendental" here means: about the conditions that make experience possible.)
      - **Absolute idealism** (Georg Hegel, 1770-1831, and successors): reality as a whole is one rational mind or spirit, unfolding in history.
      - **Analytic idealism** (Bernardo Kastrup, a modern view): there is one universal mind; what we call individual minds are dissociated parts of it, and matter is how that mind appears from outside.

      We take the first two in detail and the last in the objections.

  - type: text
    id: locke
    title: "Berkeley's starting point: Locke's two kinds of quality"
    image:
      src: img/locke.webp
      alt: "Painted portrait of John Locke in plain dark clothing, by Godfrey Kneller, 1697"
      caption: "John Locke (1632-1704), painted by Godfrey Kneller in 1697, is the philosopher whose primary/secondary quality distinction Berkeley attacked."
      credit: "Godfrey Kneller, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:%27John_Locke%27_by_Godfrey_Kneller,_1697,_Hermitage.JPG"
    body: |
      John Locke (1632-1704), the philosopher Berkeley argued against, said the properties of a thing come in two kinds:

      - **Primary qualities**: shape, size, motion, number. According to Locke they belong to the object itself and resemble our ideas of them.
      - **Secondary qualities**: colour, taste, sound, warmth. According to Locke they are *powers* in the object to produce those sensations in us; the redness is not "in" the object as it is in the experience.

      So for Locke, the world really contains extended, moving **matter**, and the mind receives ideas of it. Berkeley accepted the first half of Locke's reasoning (colour depends on the perceiver) and pushed it further.

  - type: mcq
    id: locke-q
    title: "Pushing the argument one step"
    prompt: |
      Locke says colour is not in the object because the same object looks different to different observers and in different light. Berkeley asks: does the *size* of a thing not also look different (a mite sees a hand as huge) and the *shape* depend on the viewpoint? What does Berkeley conclude, according to his argument?
    options:
      - text: 'The primary qualities depend on the perceiver just as much, so the line between the two kinds is not principled.'
        correct: true
      - text: 'Colour is in the object after all, since size is.'
        feedback: |
          Reversed. Berkeley takes Locke's own reason for treating colour as perceiver-dependent and applies it to size and shape too, not the other way round.
      - text: 'Nothing is perceived at all.'
        feedback: |
          He never says that. He says what we perceive are *ideas*. The question is whether the matter behind them is needed.
    explanation: |
      If both kinds depend on the perceiver, Locke's "matter with only primary qualities" is a thing with no features we can even conceive without a perceiver. Berkeley takes the next step, which is **the master argument** below. Physicalists and realists reply that perspective-dependence of *appearance* does not show the *object* is perspective-dependent (a coin looks elliptical from the side, and is round).

  - type: text
    id: master
    title: "Berkeley's argument, as a guided proof"
    body: |
      According to Berkeley (*Principles of Human Knowledge*, 1710, section 3), the "sensible things" of everyday life have *esse est percipi*: their being is to be perceived. A common reconstruction:

      - **P1.** What we immediately perceive are only our own ideas (sensations).
      - **P2.** An idea can exist only in a mind that has it.
      - **P3.** Sensible things (the table, the tree) are just the things we immediately perceive.
      - **C.** So sensible things exist only in minds.

      Berkeley adds what he called an argument no reader can resist: try to **conceive** of a tree that exists with nobody perceiving it. Then you are conceiving it, so it is in your mind; you have not conceived an unperceived tree, only a tree that you perceive in thought (section 23, in my paraphrase).

      The validity of P1-P3 to C is not in doubt. Whether each premise is *true* is the whole question.

  - type: mcq
    id: master-q
    title: "Which premise would a critic reject, and why?"
    prompt: |
      Berkeley's premises: P1 (we immediately perceive only our own ideas), P2 (an idea exists only in a mind), P3 (sensible things are just what we immediately perceive). A realist (someone who thinks the table exists independently of being perceived) who accepts that perception involves sensations could most directly reject which premise?
    options:
      - text: 'P3: we perceive the table *by means of* sensations, as we see a landscape through a window; the table is not identical to the sensations.'
        correct: true
      - text: 'P2: ideas can float free of any mind.'
        feedback: |
          Hardly any realist says this; sensations are usually taken to be had by someone. The more usual target is P1 or P3.
      - text: 'The validity: the conclusion does not follow from the premises.'
        feedback: |
          It follows. If P1-P3 were true, the conclusion would be forced. The rejection has to be of a premise (or of the step from "I cannot conceive it unperceived" to "it cannot exist unperceived").
    explanation: |
      Critics also attack the "conceiving" step: that I cannot picture an unperceived tree without picturing myself picturing it shows a limit of *imagination*, not of *existence* (an eye cannot see itself; that does not make eyes non-existent). Idealists reply that to say what an unperceived thing is, you must use some content, and all content is mental. P3 and this step are where the debate really lives. **Layer:** the structure is logic; the truth of P3 is a live debate.

  - type: mcq
    id: unthought
    title: "The unthought tree"
    prompt: |
      If sensible things exist only in minds, what happens to the tree that falls in the empty forest? Berkeley's traditional reply is different from that of the later "phenomenalist" idealists. Which pairing is right?
    options:
      - text: 'Berkeley: God always perceives it. Phenomenalists: the tree *is* the pattern of experiences anyone would have if present.'
        correct: true
      - text: 'Berkeley: it ceases to exist. Phenomenalists: it exists as matter.'
        feedback: |
          Berkeley explicitly avoided this "flickering" world. He thought the constant perceiver was needed to keep things in being. Phenomenalists do not bring back material substance either.
      - text: 'Berkeley: it exists as matter, but we cannot know. Phenomenalists: it does not exist.'
        feedback: |
          Berkeley denied matter as an unperceived substance. The two replies are two ways of keeping a tree *without* material substance.
    explanation: |
      On the God reading, the world is stable because it is continuously perceived by an infinite mind. The phenomenalist reading (a position developed after Berkeley, for instance by John Stuart Mill: the table is a "permanent possibility of sensation") needs no God but pays with "would" statements about experiences nobody has. **Believer or not, notice** that the first reply depends on a theological premise (layer 3), the second on the coherence of unrealised possibilities (a live debate).

  - type: text
    id: kant
    title: "Kant: appearances and the thing in itself"
    image:
      src: img/kant.webp
      alt: "Painted portrait of Immanuel Kant, around 1790"
      caption: "Immanuel Kant (1724-1804) spent his life in Königsberg and published the Critique of Pure Reason in 1781."
      credit: "Unknown, possibly Elisabeth von Stägemann (Anton Graff school), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Immanuel_Kant_portrait_c1790.jpg"
    body: |
      Kant (1724-1804), in the *Critique of Pure Reason* (first edition 1781, second 1787), distinguished:

      - **Appearances** (*phenomena*): the world as we experience it, structured by the mind's own contributions: space and time as forms of our intuition, and **categories** (concepts like cause and substance) that organise experience.
      - **The thing in itself** (*Ding an sich*): how things are apart from our way of knowing, if there is any such thing.

      According to Kant we can know appearances, with certainty about their general structure (for him, geometry and causality hold of appearances), but we **cannot know the thing in itself**. Space and time, he argues, belong to the way a mind receives the world and not to the thing in itself.

      This is called **transcendental idealism**: what we can know depends on the knower's structure. Kant himself also called it *empirical realism*, because within experience, tables and trees are real.

  - type: mcq
    id: kant-q
    title: "Kant is not Berkeley"
    prompt: |
      A student says: "Kant is just Berkeley again: both say the world is in the mind." Which reply is fairest to Kant?
    options:
      - text: 'Kant keeps something outside the mind (the thing in itself) that gives experience its raw material, though it is unknowable; Berkeley has no mind-independent matter at all.'
        correct: true
      - text: 'Kant holds that nothing exists outside minds, and Berkeley holds that matter exists.'
        feedback: |
          This swaps them. Berkeley denies material substance; Kant keeps a mind-independent source, but denies we can know it.
      - text: 'Kant holds that space and time are things in themselves, and Berkeley does not.'
        feedback: |
          Kant says the opposite: space and time belong to appearances and to the mind's form of receiving them.
    explanation: |
      Two further notes. Many readers find Kant's thing in itself unstable: if it is unknowable, how can we say it causes our experience (cause being one of our categories)? That is a standard objection. And Kant's followers (Fichte, Schelling, Hegel) dropped the thing in itself and moved to absolute idealism. So "idealism" names a family, not one thesis.

  - type: mcq
    id: shared
    title: "Objection: why do we all see the same table?"
    prompt: |
      If the table is an idea in my mind, then it should differ from the table in yours, and the two should disagree as dreams do. We in fact find that our reports agree and match. Which reply do idealists give?
    options:
      - text: 'The ideas are not private inventions: they are caused by one source (for Berkeley, God; for analytic idealists, a universal mind of which we are parts), so the agreement is explained.'
        correct: true
      - text: 'It is a coincidence, as expected in a world of minds.'
        feedback: |
          No idealist accepts coincidence; that would be an objection to the view, not a reply. Explaining shared order is exactly what the shared mind or God is for.
      - text: 'Our minds are physically linked, so our brains copy each other.'
        feedback: |
          That brings back a physical world as the base. An idealist needs the explanation to be mental, not physical.
    explanation: |
      A critic's rejoinder: a God or "mind at large" to explain order is itself an extra posit, and we may ask whether it is simpler than matter. The idealist's counter: matter is also a posit that nobody has experienced apart from its appearance (the Berkeleian point). Both sides use simplicity; they count different things as simple.

  - type: mcq
    id: brain
    title: "Objection: what about physics and the brain?"
    prompt: |
      Physics describes atoms and fields, and neuroscience shows that changing the brain changes experience. How does an analytic idealist (such as Kastrup) accommodate this, according to his view?
    options:
      - text: 'The brain and the atoms are *images in a mind*: how mental activity looks when seen from outside. Brain changes track experience because they are the outside view of it.'
        correct: true
      - text: 'Neuroscience is false, since mind cannot depend on anything.'
        feedback: |
          No idealist denies the data. The question is how to interpret them. The data (brain activity goes with experience) are common ground with physicalism.
      - text: 'The brain produces the mind, but the mind then creates the rest of the world.'
        feedback: |
          If the brain produced the mind, matter would be basic, which is the opposite of idealism. The idealist says the brain is *how a mind appears*, not what produces it.
    explanation: |
      Compare the physicalist's reading of the same data. Both accept: brain state and experience go together. The physicalist says the mental depends on (or is) the physical; the idealist says the physical is how the mental appears. A critic of idealism asks what explains the *lawful structure* of the physical (why does it follow the laws of physics so exactly?). The idealist replies that the laws describe regularities in the mind-at-large's own appearance.

  - type: mcq
    id: vs-phys
    title: "Compare with physicalism: supervenience"
    prompt: |
      Physicalism (see the lesson Matter Is All There Is?) says: two possible worlds alike in all physical respects are alike in all respects (the mental **supervenes** on the physical). What is the closest idealist counterpart of this thesis?
    options:
      - text: 'Two possible worlds alike in all mental respects are alike in all respects: the physical supervenes on the mental.'
        correct: true
      - text: 'Two possible worlds alike in all physical respects can differ in all mental respects.'
        feedback: |
          That is closer to dualism, where the mind is a further thing not fixed by the physics.
      - text: 'There is no supervenience in idealism, since the physical does not exist.'
        feedback: |
          Most idealists do not say the physical does not exist, they say it is *mind-dependent* (or the appearance of mind). Supervenience is just the precise form of "depends on".
    explanation: |
      Notice the symmetry: each view says *everything depends on one side*, and each faces a version of Hempel's dilemma. The physicalist must say what "physical" means when physics keeps changing; the idealist must say what "mental" means if it includes a universal mind unlike any human mind. If "mental" is stretched until it covers anything, the thesis risks becoming empty. If it means human-like experience, the thesis seems implausible for the early universe. These are costs each side tries to answer.

  - type: mcq
    id: data
    title: "What the evidence does and does not decide"
    prompt: |
      A physicist says: "The Big Bang happened 13.8 billion years ago, long before any brain." Does that refute idealism?
    options:
      - text: 'Not by itself: the idealist can say the early universe is part of the appearance of a mind at large (or a description of what any observer would have found); whether that reading is acceptable is the debate.'
        correct: true
      - text: 'Yes, because minds came later than matter.'
        feedback: |
          This assumes minds are brains and appear late. An idealist denies that: mind (broadly) is fundamental and brains are late *images*. The objection has force only if one already accepts that minds are only brains.
      - text: 'No, because the Big Bang is not a physical event.'
        feedback: |
          The idealist does not deny the cosmological data; they reinterpret what the data are about.
    explanation: |
      This is a typical *same data, different reading* case (as with realism and anti-realism in the lesson on scientific realism). The physicalist finds the idealist reading strained; the idealist finds the "matter before mind" picture to presuppose what is in question. **Neither is a result of an experiment.**

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Classify the claim: "Mind is fundamental, and matter is how a universal mind appears."
    options:
      - text: 'A metaphysical commitment (layer 3), argued for by philosophers; the data it must fit (brain-experience dependence, the physics) are layer 1.'
        correct: true
      - text: 'An established fact, since every observation is an experience.'
        feedback: |
          That every observation is an experience is true and uncontroversial. That reality *is* mental is a further step, which the physicalist reads differently.
      - text: 'A scientific hypothesis already refuted by neuroscience.'
        feedback: |
          Neuroscience shows dependence of experience on the brain. Both idealism and physicalism accept it. It is not a refutation.
    explanation: |
      The same classification applies to physicalism ("matter is fundamental"): a metaphysical commitment that the data fit, and neither refutes the other. Layer 2 is the live debate on how strongly the arguments (Berkeley's P3, the brain-as-image reading, the shared-world replies) succeed.

  - type: mcq
    id: back
    title: "Back to the tree"
    prompt: |
      Return to the tree that falls with nobody near. Which statement is a *fair* summary of where thoughtful people part ways?
    options:
      - text: 'They agree on all the observations; they differ on what "the tree exists unperceived" means or how it is grounded (matter, God, a mind at large, possible experiences).'
        correct: true
      - text: 'Realists have evidence the tree exists unperceived, and idealists have none.'
        feedback: |
          All evidence is evidence from experience, so any "evidence for the unperceived" is also evidence for the idealist's reading of it. The disagreement is about the best interpretation.
      - text: 'Idealists think the tree does not fall.'
        feedback: |
          Idealists agree there is a falling-tree event in the world of experience. The question is its ultimate nature.
    explanation: |
      Notice the course's method: the data and the logic are common ground, and what separates the views is a premise (P3, the meaning of "unperceived"), a value (simplicity: matter or mind as the single base) and a commitment (what is fundamental). The next lesson looks at a view that refuses to choose a single base: **dualism**, the view that mind and matter are two kinds of thing.

  - type: text
    id: summary
    body: |
      **Next:** dualism. If mind and matter are two different kinds of thing, as Descartes held, how can they act on each other? That is the interaction problem, and the lesson Two Kinds of Stuff: Dualism takes it up with the best modern replies.
