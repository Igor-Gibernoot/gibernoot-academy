id: ch03-materialism
title: "Matter Is All There Is?"
kind: concept
own: |
  - **Physicalism (materialism), stated carefully.** According to its defenders, everything that exists is physical, or depends entirely on the physical. A precise form is **supervenience**: {{ any two possible worlds that are exactly alike in all physical respects are alike in all respects, mental ones included }}. Here "supervene" means "cannot differ without a difference below". It is a thesis about *what exists* (metaphysics), not a result of any experiment.
  - **Why people hold it.** (1) Physics and chemistry have explained more and more, and **vitalism** (the idea that living things contain a special non-physical life force) was dropped. (2) Minds depend on brains: injury, drugs and anaesthesia change experience in systematic ways. (3) **Causal closure**: if every physical event that has a cause has a sufficient *physical* cause, then {{ a separate non-physical mind would have no causal work left to do }}. Dependence is common ground; whether it means identity or only correlation is a live debate.
  - **What counts as "physical"? Hempel's dilemma** (Carl Hempel, 1905-1997). Define "physical" as "what current physics says exists": then {{ physicalism is probably false, since current physics will be revised }}. Define it as "what a completed, ideal physics says exists": then {{ the thesis is nearly empty, because we do not know what that physics contains, and it might include mind-like items }}. Replies: "physical" means the kind of thing physics describes (structure, quantities, change in time), or "physical" means "not fundamentally mental"; each has its own cost.
  - **Where thoughtful people part ways.** Whether dependence of mind on brain proves identity or only correlation; whether causal closure is a finding or a presupposition of method; whether "physical" has a fixed meaning. Layers: the success of physical explanation and the brain-mind dependence are established; supervenience as the right reading is a live debate; physicalism as a claim about everything is a metaphysical commitment.
cards:
  - type: mcq
    id: hook
    title: "A puzzle about the word"
    prompt: |
      Around 1800 many chemists said living things need a special **vital force**, a non-material ingredient, that no laboratory could supply. In 1828 Friedrich Wöhler made urea, a compound found in urine, from the plain mineral substance ammonium cyanate. Before any theory: guess. What did this show?
    options:
      - text: 'That life was explained: nothing non-physical is left in any living thing.'
        feedback: |
          Far too strong. One compound made in a flask does not explain a cell, let alone an organism. It removed one reason to think life needed a special substance.
      - text: 'Nothing at all: urea is a waste product and not alive.'
        feedback: |
          True that urea is not alive, which is why a single case did not settle things. But the case mattered because the vital force had been *said* to be needed for such products.
      - text: 'One piece of evidence that a claimed need for a special life ingredient was mistaken, which began a pattern.'
        correct: true
    explanation: |
      Historians note that the story is often exaggerated: vitalism did not die in 1828. It faded over the following decades as chemistry and biology explained one process after another with ordinary physics and chemistry. **Might the same happen with the mind?** That hope is **physicalism**, and this lesson states it carefully, gives its best reasons, and then asks what the word "physical" can mean.

  - type: text
    id: define
    title: "Physicalism, defined"
    body: |
      **Physicalism** (also called **materialism**; the first name is now preferred because physics speaks of fields and energy, not only "matter") is the thesis that, according to its defenders, *everything that exists is physical, or depends entirely on the physical*. Early forms: the atomists Democritus (c. 460-370 BCE) and Epicurus (341-270 BCE) held that only atoms and void exist.

      Two things to keep straight:

      - It is a claim about **what exists** (metaphysics), not a result of any experiment.
      - It does *not* say that minds do not exist. A physicalist can say that pains, beliefs and thoughts are real, but are physical processes, or are fully fixed by physical processes.

      The rivals, met in the next lessons, are **idealism** (mind is fundamental), **dualism** (mind and matter are two kinds of thing) and **panpsychism** (experience is part of the basic stuff).

  - type: mcq
    id: not-denial
    title: "What physicalism does not say"
    prompt: |
      A physicalist says: "Pain is a brain process." Which description of this claim is fair?
    options:
      - text: 'A denial that pain exists: nobody really feels anything.'
        feedback: |
          Some philosophers (called eliminativists) say that about certain mental words, but the usual physicalist keeps pain and says what it is. "Water is H2O" does not deny water.
      - text: 'A claim about what pain is: real, and nothing over and above a physical process.'
        correct: true
      - text: 'A proven finding of neuroscience, like the speed of nerve signals.'
        feedback: |
          Neuroscience finds which brain activity goes with pain. Whether that activity *is* the pain, or only goes with it, is the philosophical question. Both sides accept the correlation.
    explanation: |
      The comparison "water is H2O" is the standard model: an identity discovered by science that reveals what a familiar thing is. Whether pain and consciousness work like water is exactly what the critics doubt (a later level, on consciousness).

  - type: text
    id: supervenience
    title: "Stating it precisely: supervenience"
    body: |
      "Depends entirely on the physical" is vague. The standard precise form uses **supervenience** (to *supervene* is to "come on top of"): the mental supervenes on the physical when there can be no difference in the mental without a difference in the physical.

      In terms of possible worlds: **any two possible worlds exactly alike in all physical respects are alike in all respects.** Picture a creator (a thought experiment, for believer and non-believer alike) who has fixed every physical fact and has nothing more to decide: if physicalism is true, the rest follows.

      Notice what this form allows. It does not say *how* the mental depends on the physical (identity? causation? something else?), only that there is no free-floating difference. Dualists who think mind is a separate thing usually deny it.

  - type: mcq
    id: super-q
    title: "A test of the definition"
    prompt: |
      Two possible worlds are identical in every physical fact: every particle, field and their motion. In one, a person is in pain at some moment. In the other, that person feels nothing. Which view says this is impossible, and which allows it?
    options:
      - text: 'Physicalism forbids it; a view with a separate mind-stuff (dualism) allows it.'
        correct: true
      - text: 'Physicalism allows it; dualism forbids it.'
        feedback: |
          Reversed. If everything depends on the physical, fixing all the physics fixes the pain. If the mind is a further kind of thing, nothing in the physics guarantees which mental facts go with it.
      - text: 'Both forbid it, since pain without a physical cause cannot occur.'
        feedback: |
          The question is not about causes but about what is *fixed* by the physics. A dualist can say the mind goes along with the body by law, yet insist it could in principle have been otherwise.
    explanation: |
      This is the **zombie-style** test: the claim that such a pair of worlds is *conceivable* is used by critics of physicalism (a later level), and physicalists reply that conceivable is not the same as possible. For now, note that supervenience turns a vague slogan into something that can be argued about.

  - type: text
    id: successes
    title: "Why physicalism is attractive"
    body: |
      According to physicalists, three kinds of evidence favour it:

      1. **Explanatory success.** The domain explained by physics and chemistry kept growing: heat (atoms in motion), light, chemistry, heredity (DNA), digestion. Vitalism was dropped. The pattern is an *induction*, as in the lesson on Hume's problem: so far "special extra ingredient" explanations have lost.
      2. **Mind depends on brain.** Anaesthesia (public demonstration of ether, Boston 1846) switches off experience and brings it back. The railway worker Phineas Gage, in 1848, had an iron rod pass through his frontal lobes and survived, and his doctor John Harlow reported changes in his behaviour. Drugs change mood and perception in dose-dependent ways. Different brain areas are linked to different abilities.
      3. **Causal closure.** Physics finds no gaps: every physical event we trace has physical causes. This is the *philosophical* centre of the case (see below).

      These are **layer 1** (established facts) in their data, but the step "so the mind is physical" is a **layer 2/3** step.

  - type: mcq
    id: dependence
    title: "Dependence is not yet identity"
    prompt: |
      A critic of physicalism says: "Brain damage changes the mind; that proves only that the brain is *necessary* for the mind, as a radio is necessary for the broadcast to be heard. It does not prove the mind is the brain." What does this objection show?
    options:
      - text: 'The data do not decide between "the mind is produced by or identical to the brain" and "the brain is a receiver or channel for a mind"; extra reasons are needed.'
        correct: true
      - text: 'The data support the radio view more than the physicalist view.'
        feedback: |
          The data are compatible with both. Physicalists add that the radio view adds an unobserved entity and has to explain why damage changes the *content* of thought, not merely the quality of the signal. That is an argument about simplicity, not a refutation.
      - text: 'The data are irrelevant to the question of whether the mind is physical.'
        feedback: |
          They are relevant: they show close dependence, which fits physicalism and is something the rival views must also accommodate.
    explanation: |
      The dependence data are common ground; the argument is over their best explanation (as in the no-miracles argument: same facts, different explanation). Physicalists point to simplicity and to success, the critic to what a brain-based account seems unable to explain (a later level).

  - type: text
    id: closure
    title: "Causal closure, as a guided proof"
    body: |
      Jaegwon Kim (1934-2019) gave the argument its sharpest form. According to Kim, if the mind is something more than the physical, it is in trouble. The proof:

      - **P1.** Every physical event that has a cause has a sufficient *physical* cause (causal closure of the physical).
      - **P2.** A mental event (a decision) causes physical events (the arm moves).
      - **P3.** Those physical events are not caused twice over by two separate sufficient causes (no systematic overdetermination).
      - **C.** So the mental cause must *be* the physical cause (or nothing more than it); a separate non-physical mind does no extra causal work.

  - type: mcq
    id: closure-q
    title: "Which premise would a critic reject, and why?"
    prompt: |
      Kim's argument has P1 (physical causal closure), P2 (mental events cause physical ones) and P3 (no systematic overdetermination: a bodily movement is not caused twice over). A dualist who wants a separate mind to matter causally could reject which premise?
    options:
      - text: 'P1: closure is a presupposition of physical method, not a discovery; some physical events might have non-physical causes.'
        correct: true
      - text: 'The conclusion C only, while keeping all three premises and the validity of the step.'
        feedback: |
          If the premises hold and the step is valid, C follows. A critic must reject a premise or the step, not the conclusion alone.
      - text: 'P2: a dualist cannot say that the mind causes anything.'
        feedback: |
          Interactionist dualists insist on P2. Rejecting P2 leads to epiphenomenalism (mind as a by-product that causes nothing), a different and uncomfortable view. P1 or P3 are the usual targets.
    explanation: |
      Replies: reject P1 (closure may fail where quantum events are not fully determined, though many physicists note that this gives chance, not a place for a mind); accept overdetermination (mind and brain as two real causes, like two soldiers who both fire at once, which looks odd); or accept the result and become a physicalist, or an epiphenomenalist. Validity of the step is separate from the truth of P1 to P3.

  - type: text
    id: hempel
    title: "But what is 'physical'?"
    body: |
      The physicalist says "everything is physical". A natural question: **physical according to what?** Carl Hempel (1905-1997) asked it as a dilemma:

      - **Horn 1.** "Physical" means what *current* physics says exists (today: quantum fields, spacetime, and so on). Then physicalism is probably **false**, because current physics is incomplete and past physics (Newton's absolute space, caloric, the ether) was revised.
      - **Horn 2.** "Physical" means what a *completed, ideal* physics will say exists. Then physicalism is nearly **empty**, because we do not know what that physics contains. It could include something mind-like, and the thesis would still be true.

      A thesis that is false or empty is not a good thesis. This is not an objection to physics, only to defining a *metaphysical* thesis by reference to it.

  - type: mcq
    id: hempel-q
    title: "Pick the horn"
    prompt: |
      Suppose a future physics lists "consciousness" as a basic ingredient of the universe, like charge. Using Hempel's dilemma, what happens to the statement "everything is physical"?
    options:
      - text: 'It is true under the second reading (ideal physics) but then says little: it was compatible with mind being basic.'
        correct: true
      - text: 'It is false under every reading, because physics can never contain consciousness.'
        feedback: |
          Nothing in the definition rules this out. The point of the second horn is that the label "physical" would stretch to include it, so the thesis would be safe, and uninformative.
      - text: 'It is a proof that physicalism was correct all along.'
        feedback: |
          Only in a sense nobody intended: the word has been stretched to follow the facts. Many physicalists would say that is a *change* of view, not a vindication.
    explanation: |
      Critics (panpsychists, in a later lesson) use exactly this: if basic experience were found in physics, "physicalism" and "panpsychism" would blur. Defenders answer that the thesis still has content, as the next card shows.

  - type: mcq
    id: replies
    title: "Two replies to the dilemma"
    prompt: |
      Defenders respond in two ways. (a) *Structure and dynamics:* "physical" means the kind of thing physics describes, namely quantities, structure and how they change in time. (b) *Via negativa:* "physical" means not fundamentally mental. Which statement matches?
    options:
      - text: '(a) gives a positive but vague kind; (b) is clear but only says what physical is not, so fundamental mind is excluded by definition.'
        correct: true
      - text: '(a) and (b) are the same reply in different words.'
        feedback: |
          (a) says what physical stuff is like; (b) only says what it is not. They differ in what they rule out: (b) rules out fundamental mind, (a) rules out anything beyond structure and dynamics, which is arguably more.
      - text: 'Both replies prove that physicalism is true.'
        feedback: |
          They only give the thesis content. Whether the content is *true* is the question of the whole level.
    explanation: |
      Cost of (a): critics ask whether structure and dynamics can contain experience (they say no; the hard problem, a later level). Cost of (b): it makes the thesis depend on how "fundamentally mental" is understood. Both replies are live.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Label each statement as established fact, live debate, or metaphysical commitment: (1) Anaesthesia switches off experience reversibly. (2) The mental supervenes on the physical. (3) Everything that exists is physical.
    options:
      - text: '(1) fact; (2) live debate; (3) metaphysical commitment.'
        correct: true
      - text: '(1) fact; (2) fact; (3) live debate.'
        feedback: |
          Supervenience is a philosophical thesis about possible worlds that no experiment tests, and (3) goes beyond what any evidence reaches.
      - text: '(1) live debate; (2) commitment; (3) fact.'
        feedback: |
          Reversed. Anaesthesia is clinical, and nobody doubts it. The claim about everything is the one that no evidence could confirm.
    explanation: |
      A believer in God, an atheist and an agnostic can all accept (1). Whether (2) or (3) is acceptable depends on further premises, and the next lessons set out the rivals.

  - type: mcq
    id: return
    title: "Back to the vital force"
    prompt: |
      Return to vitalism. A physicalist reads its fall as a pattern and expects the mind to follow. A critic says the analogy is weak. Which is the critic's best point?
    options:
      - text: 'Life was defined by observable functions (growth, reproduction) that physics could explain; consciousness is defined by what it is *like* to feel, which seems not to be a function at all.'
        correct: true
      - text: 'Vitalism was never really abandoned, so the analogy is false.'
        feedback: |
          Historians agree that the vital force was dropped as a scientific explanation. The critic does not need to deny this.
      - text: 'Physical explanations cannot succeed for anything living.'
        feedback: |
          Contradicted by biology. The critic grants the success for life and denies that it carries over to experience.
    explanation: |
      The physicalist replies that vitalists also said that life seemed too special for physics, and that the feeling of mystery may fade as neuroscience advances. The disagreement is over whether experience is like life (a set of functions) or unlike it. That is the content of the later level on consciousness.

  - type: text
    id: summary
    body: |
      **Next:** Physicalism says matter comes first. Idealism says the reverse: that what exists is mind, or depends on mind. The next lesson gives Berkeley's best argument and its modern descendants, and asks what an idealist can say about the table.
