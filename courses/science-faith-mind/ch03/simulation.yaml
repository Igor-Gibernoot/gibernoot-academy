id: ch03-simulation
title: "Are We in a Simulation?"
kind: concept
own: |
  - **The argument.** According to Nick Bostrom (2003), a **posthuman** civilization is one that has gained most of the technology consistent with physical law; an **ancestor-simulation** is a simulation of its forebears' mental history, detailed enough that the simulated people are conscious. Let $f_P$ be the fraction of human-level civilizations that reach the posthuman stage, $f_I$ the fraction of those that are interested in running such simulations, and $N_I$ the average number each interested one runs. Counting minds (each simulation holding about as many people as the original history), the fraction of all observers with human-type experiences who are simulated is
  $$f_{\text{sim}} = {{ \frac{f_P\,f_I\,N_I}{f_P\,f_I\,N_I + 1} }}$$
  - **The trilemma.** Because $N_I$ would be enormous, $f_{\text{sim}}$ is near 1 unless $f_P$ or $f_I$ is near 0, so at least one holds: {{ (1) almost no civilizations reach the posthuman stage, (2) almost none of those are interested in running such simulations, or (3) we are almost certainly living in a simulation }}. Bostrom does not claim (3) is true; he suggests spreading credence roughly evenly over the three.
  - **The premises.** The argument assumes **substrate independence** (a suitable computation produces experience whatever it runs on), **enough computing power** (a posthuman civilization could run huge numbers of such simulations with a tiny part of its resources), and a **bland indifference principle**: if a fraction $x$ of observers like me are simulated and I have no information telling me which I am, then
  $$\text{Cr}(\text{simulated}\mid f_{\text{sim}} = x) = {{ x }}$$
  Critics reject one of these; {{ rejecting any one blocks the conclusion }} (a debate in layer 2, with the commitments in layer 3).
  - **Evidence.** If $E$ is a test result, the odds form of Bayes' rule applies:
  $$\frac{P(\text{sim}\mid E)}{P(\text{real}\mid E)}=\frac{P(E\mid\text{sim})}{P(E\mid\text{real})}\cdot\frac{P(\text{sim})}{P(\text{real})}$$
  A proposed test (Beane, Davoudi and Savage 2012) looks for the signature of a cubic space-time lattice in the highest-energy cosmic rays; a null result {{ only excludes that kind of simulation, so it barely lowers the odds }}, since a simulation need not use such a lattice.
  - **Old ideas.** The demon of Descartes (1641) and the vat ask whether we *could* be deceived; Bostrom asks how *likely* it is. According to Chalmers (2022), if we are simulated the objects around us are still real, so the hypothesis is {{ metaphysical rather than skeptical }}.
cards:
  - type: mcq
    id: hook
    title: "You wake up"
    prompt: |
      Guess before any theory. You wake up one morning and everything feels completely ordinary. You are told only this: "Somewhere, some civilization may run computer simulations of conscious people." Which of the following is the best answer to "Am I probably in a simulation?"
    options:
      - text: 'It depends on how many simulated people exist compared with non-simulated ones. If simulated people vastly outnumber the others, then a person like me is probably simulated; if no such simulations exist, I am not.'
        correct: true
      - text: 'I can look around carefully and decide: if the world feels solid and consistent, then I am not simulated.'
        feedback: |
          A good enough simulation would feel solid and consistent to the people inside it, by definition. Feeling ordinary is what both possibilities predict, so it cannot tell them apart.
      - text: 'It is always 50-50, because there are only two possibilities: simulated or not.'
        feedback: |
          Two possibilities do not make them equally likely. If there were one real world and a million simulated ones with similar people, a person picked at random would not be at 50%. The count of each kind of observer is what matters.
    explanation: |
      This is the seed of the whole lesson: the question turns into counting. The rest is about whether anyone can count, and which assumptions the count needs.

  - type: text
    id: old
    title: "An old question in new clothes"
    body: |
      The worry that the world might not be what it seems is old. According to Descartes (1596-1650), in the *Meditations* (1641) it is possible that an all-powerful "evil demon" deceives him about everything he senses. A modern cousin is the "brain in a vat" (a brain kept alive and fed false sensations by a computer), which Hilary Putnam (1926-2016) discussed in *Reason, Truth and History* (1981), and the film *The Matrix* (1999) made it popular. The idea also touches the lessons *Mind First: Idealism* and *Two Kinds of Stuff: Dualism*: all of them ask what stands behind our experience.

      Those old versions only claim that deception is **possible**, and a possibility alone gives no reason to think it is **likely**. In 2003 the philosopher Nick Bostrom published an argument that tries to say something about likelihood, by counting.

  - type: mcq
    id: new
    title: "What is new?"
    prompt: |
      According to the account above, what does Bostrom's argument add to Descartes's evil demon?
    options:
      - text: 'It tries to say how probable the scenario is, by counting how many minds like ours would be simulated if simulations were common, instead of only noting that deception is possible.'
        correct: true
      - text: 'It proves that the evil demon exists, using modern computers.'
        feedback: |
          Bostrom proves nothing of the kind. His conclusion is a disjunction (one of three statements holds), and only one of the three says we are simulated.
      - text: 'It shows that the physical world is an illusion, so the idealists were right.'
        feedback: |
          Even if we were simulated, the simulating computer would be a physical thing in Bostrom's picture; the lesson returns to how this differs from idealism.
    explanation: |
      The old thought experiments are about what we could know. Bostrom's is about what we should believe given some facts about the future of technology.

  - type: text
    id: trilemma
    title: "The trilemma"
    body: |
      First, two terms. A **posthuman** civilization is one that has gained most of the technological capabilities consistent with physical law (so, enormous computing power). An **ancestor-simulation** is a simulation of the mental history of a civilization's forebears, detailed enough that the simulated people are conscious.

      According to Bostrom (*Philosophical Quarterly* 53(211), 2003), at least one of these three statements is true:

      1. the human species is very likely to go extinct before reaching a posthuman stage;
      2. any posthuman civilization is extremely unlikely to run a significant number of ancestor-simulations (his phrase: simulations of their evolutionary history, or variations of it);
      3. we are almost certainly living in a computer simulation.

      Notice the shape: it is a three-way "or". The argument does not say which one holds.

  - type: mcq
    id: not-claim
    title: "What does he conclude?"
    prompt: |
      A friend says: "Bostrom has proved that we live in a simulation." Based on the trilemma, what is the best reply?
    options:
      - text: 'He argues only that at least one of three statements is true. Statement 3 (we are simulated) is one of them; if you think statements 1 and 2 are false, then you should accept 3. He himself suggests spreading credence roughly evenly over the three.'
        correct: true
      - text: 'He argues that statement 1 is true: we will go extinct.'
        feedback: |
          Statement 1 is one of the three options. If humanity survives and keeps its interest, 1 and 2 fail, but this is exactly the case in which 3 follows.
      - text: 'Nothing follows, because the argument is circular.'
        feedback: |
          The argument is valid: it is arithmetic about fractions of observers, as the next cards show. Whether its premises are true is a separate question, taken up later in this lesson.
    explanation: |
      Keep the two questions apart throughout: is the **reasoning valid** (if the premises hold, the conclusion follows) and are the **premises true**?

  - type: text
    id: counting
    title: "Counting minds"
    body: |
      Here is the counting. Let $f_P$ be the fraction of human-level civilizations that reach the posthuman stage, $f_I$ the fraction of those that are interested in running ancestor-simulations, and $N_I$ the average number of ancestor-simulations run by one interested civilization.

      Suppose each civilization has about $H$ individuals in its history, and each ancestor-simulation holds about as many. Then per original civilization, the simulated people number $f_P f_I N_I H$, against the $H$ real ones. The fraction of all such observers who are simulated is
      $$f_{\text{sim}}=\frac{f_P f_I N_I H}{f_P f_I N_I H + H}=\frac{f_P f_I N_I}{f_P f_I N_I + 1}$$
      since $H$ cancels. Write $X=f_P f_I N_I$ for the top. Then $f_{\text{sim}}=\dfrac{X}{X+1}$, always between 0 and 1.

  - type: build
    id: build-fsim
    title: "Build the fraction"
    prompt: |
      Let $X = f_P f_I N_I$ be the number of simulated minds per real one. Out of all minds (simulated plus real), choose the fraction that are simulated.
    prefix: 'f_{\text{sim}} ='
    tiles: ['\dfrac{X}{X+1}', '\dfrac{X}{X-1}', '\dfrac{1}{X+1}', '\dfrac{X+1}{X}']
    answers:
      - ['\dfrac{X}{X+1}']
    wrong:
      - answer: ['\dfrac{1}{X+1}']
        feedback: |
          This is the fraction of minds that are **real**: one real mind per $X$ simulated ones gives $1/(X+1)$. The question asks for the simulated share.
      - answer: ['\dfrac{X+1}{X}']
        feedback: |
          This is bigger than 1, so it cannot be a fraction of the minds. The total (the denominator) must be larger than the part (the numerator).
    hint: 'Per real mind there are $X$ simulated ones, so the total is $X + 1$.'
    explanation: |
      Simulated minds $X$ out of a total $X+1$ (the $X$ simulated plus one real). If $X$ is large, this is close to 1; if $X$ is tiny, it is close to $0$.

  - type: numeric
    id: num-high
    title: "Small numbers, big effect"
    prompt: |
      Suppose 1 civilization in 100 reaches the posthuman stage ($f_P=0.01$), 1 in 100 of those is interested ($f_I=0.01$), and each interested one runs a million ancestor-simulations ($N_I=10^6$). What is $f_{\text{sim}}$, the fraction of minds that are simulated? (Three decimals.)
    answer: 0.990
    tolerance: 0.002
    wrong:
      - { value: 100, feedback: 'That is $X = f_P f_I N_I$, the number of simulated minds per real one. The fraction is $X/(X+1)$.' }
      - { value: 0.0001, feedback: 'That is $f_P f_I$, the share of civilizations that both arrive and are interested. It ignores the million simulations each one runs.' }
    hint: 'Compute $X=0.01\times0.01\times10^6$, then $X/(X+1)$.'
    explanation: |
      $X = 0.01\cdot0.01\cdot10^6=100$, so $f_{\text{sim}}=100/101\approx0.990$. Even though only one civilization in $10^4$ is both able and interested, the huge number of simulations each runs makes almost every mind simulated. These numbers are illustrative, not estimates.

  - type: numeric
    id: num-even
    title: "The break-even point"
    prompt: |
      With $f_P=0.1$ and $f_I=0.001$, how many ancestor-simulations $N_I$ must each interested civilization run so that exactly half of all minds are simulated ($f_{\text{sim}}=0.5$)?
    answer: 10000
    tolerance: 1
    wrong:
      - { value: 1, feedback: 'That is the value of $X$ for $f_{\text{sim}}=0.5$, not of $N_I$. Here $X = f_P f_I N_I = 10^{-4}N_I$.' }
    hint: 'Half simulated means $X = 1$ (as many simulated as real). Then solve $10^{-4}N_I = 1$.'
    explanation: |
      $f_{\text{sim}}=X/(X+1)=\tfrac12$ gives $X=1$. With $f_Pf_I=10^{-4}$ this needs $N_I=10^4$. Beyond that, more simulations push $f_{\text{sim}}$ towards 1 quickly. This is why the whole argument hinges on how large $N_I$ could be.

  - type: text
    id: premises
    title: "The premises"
    body: |
      The counting is valid arithmetic. What it needs from the world are three **premises**, all contested.

      - **Substrate independence.** Mental states can arise on many kinds of physical basis, not only carbon-based brains: provided a system carries out the right computations, it can have conscious experience. Bostrom takes this as a given, in a weak form: it suffices that a computer replicates the computations of a human brain in fine detail (his example: at the level of synapses).
      - **Enough computing power.** A posthuman civilization could run huge numbers of ancestor-simulations. Bostrom's rough estimate: a planetary-mass computer could perform about $10^{42}$ operations per second, while simulating the entire mental history of humankind would take about $10^{33}$ to $10^{36}$ operations, so one such computer would need less than a millionth of its power for one second.
      - **A bland indifference principle.** If a fraction $x$ of all observers with human-type experiences are simulated, and you have no information telling you which you are, your credence of being simulated should equal $x$.

      Notice how each has a rival view.

  - type: mcq
    id: crit-substrate
    title: "Which premise?"
    prompt: |
      According to some philosophers of mind, consciousness depends on the specific biology of living brains (not just on what is computed), so that a computer running a perfect copy of the brain's computations would feel nothing. Which premise of the simulation argument do they reject?
    options:
      - text: 'Substrate independence: for them, the right computation on the wrong basis does not produce experience, so simulated people would not be conscious and would not count as observers like us.'
        correct: true
      - text: 'Enough computing power: they deny that a computer could be fast enough.'
        feedback: |
          Their objection would stand even with unlimited speed. It is about what the computation is **made of**, not about how fast it runs.
      - text: 'The indifference principle: they deny that credence should follow the fraction of observers.'
        feedback: |
          That is a different kind of objection. The biology view attacks the premise that the simulated minds are conscious at all.
    explanation: |
      The materialism and panpsychism lessons showed how divided views on mind are. This premise inherits that division: those who take consciousness to be tied to a physical kind of matter, or who hold that experience cannot be computed, reject it, while those who hold that it is the pattern of computation that matters accept it.

  - type: mcq
    id: crit-compute
    title: "Which premise? (second critic)"
    prompt: |
      Another critic says: "A realistic simulation of a whole universe, down to the quantum level, would need more resources than any civilization could ever gather, so almost no civilization could run many ancestor-simulations." Which premise is this attacking, and what is a reply?
    options:
      - text: 'Enough computing power. A reply (Bostrom): the simulation need not be done to the finest level everywhere, only detailed enough for the simulated minds (e.g. at the level of synapses), with the surroundings filled in where observers look; and even if his estimates are off by several orders of magnitude the conclusion survives.'
        correct: true
      - text: 'Substrate independence. A reply: neurons are not computers.'
        feedback: |
          The critic accepts that simulated minds would be conscious; the objection is about whether the **resources** exist to run them.
      - text: 'The indifference principle. A reply: all observers are equally likely.'
        feedback: |
          The objection concerns resources, not the way credence is spread over observers.
    explanation: |
      A rival reply is that the objection may be right: Bostrom himself notes that if the cost of simulating even one posthuman civilization is very high, our simulation might be terminated when we are about to become posthuman. A real disagreement remains about how costly detailed simulation is.

  - type: text
    id: indifference
    title: "Credence from a count"
    body: |
      The third premise turns a **count** into a **probability**. According to Bostrom, if a fraction $x$ of observers with human-type experiences are simulated, and nothing in your experiences distinguishes the simulated from the real, your credence $\text{Cr}$ (degree of belief, in the sense of the lesson *Evidence as Updating Belief*) should be
      $$\text{Cr}(\text{simulated}\mid f_{\text{sim}}=x)=x$$
      Bostrom's analogy is a stretch of "junk" DNA: if $x\%$ of people carry a certain sequence there that has no visible effect, then, unless you have had your DNA sequenced, you should give $x\%$ to carrying it.

      Rival view: you are not a random draw from all minds. A critic can say you also hold evidence (your world obeys simple laws, you have a particular history) and that a bare count ignores it, or that the principle is a **commitment** about how to reason, not something the data can settle. Bostrom restricts it to cases where you have no distinguishing information.

  - type: numeric
    id: even-credence
    title: "Spreading credence"
    prompt: |
      Bostrom suggests that, given our ignorance, it seems sensible to spread credence roughly evenly over the three statements: 1/3 each for (1) almost no civilization reaches the posthuman stage, (2) almost none that does is interested, (3) we are almost certainly simulated. If (1) or (2) is true then $f_{\text{sim}}\approx0$, and if (3) is true then $f_{\text{sim}}\approx1$. Using the indifference principle $\text{Cr}=f_{\text{sim}}$ in each case, what is your overall credence of being simulated? (Three decimals.)
    answer: 0.333
    tolerance: 0.002
    wrong:
      - { value: 0.5, feedback: 'That would treat "simulated or not" as the two options. There are three statements, and only one of them (3) has you simulated.' }
      - { value: 0.667, feedback: 'That is the credence for statements 1 and 2 together, where you are **not** simulated.' }
    hint: 'Add each case weighted by its credence: $\tfrac13\cdot0+\tfrac13\cdot0+\tfrac13\cdot1$.'
    explanation: |
      $\tfrac13\cdot 0+\tfrac13\cdot 0+\tfrac13\cdot 1=\tfrac13\approx0.333$. This is a consequence of one particular, debatable choice of prior over the three statements, not a measurement.

  - type: numeric
    id: update
    title: "A test that finds nothing"
    prompt: |
      Start from the credence of 1/3 of being simulated (prior odds $\frac{1/3}{2/3}=\frac12$). Invent a test: a simulation of a certain type would show a tell-tale signature with probability 0.2, and a real world never would. The test finds **no signature**. So $P(\text{no signature}\mid\text{simulated})=0.8$ and $P(\text{no signature}\mid\text{real})=1$. What is your updated credence of being simulated, using the odds form of Bayes' rule? (Three decimals.)
    answer: 0.286
    tolerance: 0.002
    wrong:
      - { value: 0, feedback: 'The test could only see the signature if the simulation had that type, so seeing nothing does not rule simulations out. The likelihood under "simulated" is 0.8, not 0.' }
      - { value: 0.333, feedback: 'That is the prior. A null result does shift the odds slightly, because it is a bit more likely if the world is real.' }
    hint: 'Posterior odds = likelihood ratio $0.8/1$ times prior odds $\tfrac12$; then probability = odds/(1+odds).'
    explanation: |
      Posterior odds $=0.8\times\tfrac12=0.4$, so the probability is $0.4/1.4\approx0.286$. The numbers are invented to show the mechanism: a test that a simulation could easily pass leaves the credence almost where it was.

  - type: text
    id: old-new
    title: "Old ideas, same or different?"
    body: |
      Compare with the views of the earlier lessons.

      - **Idealism** (Berkeley, 1685-1753): according to him, physical things are ideas in minds, and what stands behind them is a mind, God. In Bostrom's picture, by contrast, the simulators and their computer are ordinary physical things; he adds only that the physics there "may or may not resemble" ours. He also notes a loose analogy: the posthumans running our simulation are like gods in relation to the people inside it, though all naturalistic.
      - **Dualism** (Descartes): according to him, mind is a separate substance. The simulation argument needs the opposite: mind as something a computer could carry.
      - **Quantum interpretations**: those lessons asked what the state is; the simulation question asks what the world is made of. The quantum interpretations all agree on the experimental predictions, as does any simulation that reproduces the physics, so neither question is settled by the outcome of the usual experiments alone.

      A philosopher who has taken the question seriously is David Chalmers (born 1966). In *Reality+* (2022) he argues that virtual realities are genuine realities, so that "we are in a simulation" is a metaphysical claim about what our world is made of rather than a skeptical claim that nothing is real.

  - type: mcq
    id: chalmers
    title: "Is the table real?"
    prompt: |
      According to Chalmers, if we are living in a simulation, what follows about the objects around us (the table, the stars)?
    options:
      - text: 'They are real: they are digital objects, built from the simulation''s processes, and they behave as they always did; what changes is our view of what they are ultimately made of.'
        correct: true
      - text: 'They do not exist, since everything is an illusion produced by the machine.'
        feedback: |
          This is the skeptical reading, which Chalmers rejects. On his view the simulated table can be kicked, and it falls when dropped; it is real, but of a different underlying kind than we assumed.
      - text: 'Nothing follows, because we could never be in a simulation.'
        feedback: |
          Chalmers takes the possibility seriously (he thinks we cannot know that we are not in a simulation), so the question is how to interpret the case where we are.
    explanation: |
      A rival view: some thinkers take being deceived to be a real loss even when the simulation is perfect, since the world we live in is then not the one we believed. That disagreement is about the meaning of "real", and it follows the same lines as the realism debate in the lesson *Is Science Describing Reality?*.

  - type: text
    id: evidence
    title: "Could we test it?"
    body: |
      What would count as evidence? Two suggestions.

      - **Lattice signatures.** In 2012 the physicists Silas Beane, Zohreh Davoudi and Martin Savage (arXiv 1210.1847; published in the *European Physical Journal A* 50, 148, 2014) considered a universe that is a numerical simulation on a cubic grid of space and time, like the lattice simulations physicists run for the strong force. They argued that such a grid could leave a trace in the highest-energy cosmic rays: a breaking of rotational symmetry, so that directions along the grid would differ from diagonal ones. From the cut-off in the cosmic-ray energy spectrum they derived that the inverse of the grid spacing must exceed about $10^{11}$ GeV.
      - **Doing it ourselves.** Bostrom notes that if we go on to create our own ancestor-simulations, this would be strong evidence against statements 1 and 2.

      Notice the limit of the first test: it assumes a particular kind of simulation (a simple cubic grid). Absence of the signature rules out that kind, not simulation in general.

  - type: mcq
    id: null-result
    title: "A null result"
    prompt: |
      Suppose experiments measure the directions of the highest-energy cosmic rays and find no sign of a grid. According to the reasoning above, what follows?
    options:
      - text: 'Only simulations built on that kind of simple cubic grid, with a spacing coarse enough to show up, are disfavoured; simulations using other methods are untouched, so the probability of "simulated" barely moves.'
        correct: true
      - text: 'We are not in a simulation, because any simulation must leave a grid.'
        feedback: |
          This assumes every simulation must use a cubic lattice. Nothing in the argument says so, and a finer grid, a different structure or a simulation that adjusts itself to what observers measure could all escape.
      - text: 'The simulation argument is refuted, because a test gave a negative result.'
        feedback: |
          The argument is a statement about fractions of observers and about three alternatives. A failed test of one specific signature does not change those fractions, though it can shift the probabilities slightly.
    explanation: |
      This is the same logic as the update card: a test that the hypothesis can easily pass moves the credence little. A positive result (a grid signature) would be strong evidence for that hypothesis; a null result is weak evidence against.

  - type: mcq
    id: layers
    title: "Which layer?"
    prompt: |
      Which of the following is a **layer 3** claim (faith or metaphysical commitment), as opposed to established fact or live scholarly debate?
    options:
      - text: 'That we should treat ourselves as a random draw from all minds like ours, with credence equal to the simulated fraction (the indifference principle).'
        correct: true
      - text: 'That $f_{\text{sim}}=X/(X+1)$ follows from counting simulated and real minds when each simulation holds about as many people as the original.'
        feedback: |
          This is arithmetic, established given its definitions (layer 1).
      - text: 'That the cosmic-ray cut-off implies a bound on a cubic grid spacing if the universe were such a simulation.'
        feedback: |
          This is a physics calculation under an explicit assumption; it is a result within a model (layers 1 and 2), not a commitment.
    explanation: |
      The count is fact, whether future civilizations can run such simulations and whether they would be conscious is a live debate (layer 2), and how to turn a count into belief is a commitment about reasoning (layer 3). Where thoughtful people part ways: on substrate independence (what consciousness needs), on how much computation is feasible or desired, and on whether the bland indifference principle is the right way to reason.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the lesson *Structural Realism: What Survives Theory Change?* asks a related question from physics itself: if the objects of our theories keep changing while the equations survive, is it the structure that is real?
