id: ch05-anthropic
title: "The Anthropic Principle and Selection Effects"
kind: concept
own: |
  - **Setting.** A *selection effect* is a bias in what we see that comes from how the sample was collected, not from how the world is. An *observer* here is any being able to measure the universe. The *dials* are the physical constants of the previous lesson, for example the vacuum (dark-energy) energy density $\rho_\Lambda$ and the Planck energy density $\rho_P$, whose ratio is about $10^{-123}$.
  - **Weak anthropic principle (Carter, 1974).** Our position and epoch are not typical of all possible ones: they are restricted to those compatible with the existence of observers. It is a statement about sampling, and a fact of logic. With a prior probability $P(x)$ for a dial value $x$ and an observer weight $F(x)$ (for the vacuum energy, the fraction of matter that ends up in galaxies), the values an observer finds follow
  {{ $$P_{\text{obs}}(x) \propto P(x)\,F(x)$$ }}
  - **Strong anthropic principle (Carter, 1974).** The universe, and so its fundamental parameters, *must* be such as to admit observers at some stage. It adds a "must" that is a philosophical commitment: it can be read as a requirement, as a purpose, or as a law, and none of these readings follows from the weak principle.
  - **Weinberg (1987).** For a positive vacuum energy density $\rho_\Lambda$, galaxies can form only if $\rho_\Lambda$ is not much larger than the matter density $\rho_m$ at the time they form. Matter density grows with redshift $z$ as
  {{ $$\rho_m(z) = (1+z)^3\,\rho_{m,0}$$ }}
  where $\rho_{m,0}$ is the matter density today. A galaxy seen at $z=4$ formed at $125\,\rho_{m,0}$. The observed value, $\rho_\Lambda/\rho_{m,0} = \Omega_\Lambda/\Omega_m \approx 0.685/0.315 \approx 2.2$ (flat universe, Planck 2018), is far below that bound but only a few powers of ten from it, not $120$ powers of ten.
  - **What a selection effect explains and what it does not.** It can explain why we observe a life-permitting value, *given* that other values occur somewhere. It cannot, alone, explain {{ why other values exist at all, or what mechanism or probability rule produces them }}. Whether the argument is a good explanation or only a restatement is a live debate; whether there is a purpose behind it is a faith or metaphysical commitment.

cards:
  - type: mcq
    id: hook
    title: "Guess: the fisherman's net"
    prompt: |
      Before any theory, guess. A fisherman explores the sea with a net whose holes are two inches wide, so every fish he lands is at least two inches long. After thousands of catches he announces: "There are no sea creatures shorter than two inches." What is the best reply?
    options:
      - text: 'His net could not have caught shorter ones even if they existed, so his catch says nothing about whether they exist.'
        correct: true
        feedback: |
          Right. What he sees is the product of two things: what is in the sea and what his net can catch.
      - text: 'He is probably right: thousands of catches without a small fish is strong evidence.'
        feedback: |
          Tempting, because many catches feel like strong evidence. But small fish slip through the holes every time, so a million catches would look the same whether they exist or not. More data of the same kind cannot help.
      - text: 'He is wrong: the sea certainly contains small fish.'
        feedback: |
          They may well exist, but that is not what the catch shows. The error is in his reasoning, not necessarily in his conclusion: the evidence cannot decide the matter either way.
    explanation: |
      This is the parable of the ichthyologist (a fish scientist) from Arthur Eddington's *The Philosophy of Physical Science* (Tarner Lectures given 1938, published 1939). In his telling a critic objects that there are sea creatures under two inches long, and the ichthyologist answers that anything his net cannot catch is, by definition, not a fish. Eddington used it to say that our instruments filter what we can know. The lesson uses it for a sharper point: **a filter can leave a pattern in the data that says nothing about the world**.

  - type: text
    id: net
    title: "Selection effects"
    body: |
      A **selection effect** is a pattern in what we observe that comes from *how the sample was gathered*, not from how the world is. The net filters fish; a telescope filters faint galaxies; a survey filters people who answer the phone.

      One way to see it: what we observe is

      $$\text{what is out there} \;\times\; \text{what can reach us}.$$

      To learn about the first factor from the second we must know the filter. The question of this lesson is a strange one: **is the fact that we exist a filter on what we can observe about the universe?**

  - type: text
    id: recall
    title: "Recall: the dials"
    body: |
      Recall from the lesson *Fine-Tuning: The Numbers* that physics has constants it takes as inputs and does not compute, and that changing some of them a little would, according to calculations by physicists such as Barnes, remove stars, carbon or chemistry. Three examples:

      $$\frac{\rho_\Lambda}{\rho_P}\approx 10^{-123}$$

      Here $\rho_\Lambda$ is the observed vacuum (dark-energy) energy density and $\rho_P$ the Planck energy density, the natural unit built from $\hbar$, $c$ and $G$.

      $$\frac{F_{\text{elec}}}{F_{\text{grav}}}=\frac{e^2}{4\pi\varepsilon_0\,G\,m_p^2}\approx 1.2\times10^{36}$$

      This is the electric over gravitational force between two protons. And the Higgs value satisfies $v/m_{\text{Pl}}\approx 2\times10^{-17}$ in units of the Planck mass.

      That lesson kept apart *how sensitive* each dial is (live debate, with a measure problem) from *what the sensitivity means*. This lesson takes up one answer to the second question: a selection effect.

  - type: text
    id: wap
    title: "The weak anthropic principle"
    body: |
      The physicist Brandon Carter gave a talk at a symposium of the International Astronomical Union in Cracow in September 1973 (published 1974), in honour of Copernicus's 500th birthday. Copernicus taught that our place in the universe is not special. Carter's reply was that in one respect it must be special:

      > "our location in the universe is necessarily privileged to the extent of being compatible with our existence as observers."

      This is the **weak anthropic principle** (WAP). Its content is modest: observers can only find themselves where and when observers can exist. It does not say the universe is *for* observers, nor that the dials were set for us. It is a **fact of logic about sampling**, the same kind of statement as "the fisherman only sees fish that his net can catch" (layer 1: it is true by definition, once "observer" is defined).

  - type: mcq
    id: wap-content
    title: "What does the weak principle assert?"
    prompt: |
      Carter's weak anthropic principle says our location and epoch are compatible with the existence of observers. Which is the best statement of what this adds to our knowledge?
    options:
      - text: 'It tells us how to read observations: any value we measure is conditioned on observers existing there, so a life-permitting value is not by itself evidence that it was aimed at.'
        correct: true
      - text: 'It shows the universe was designed so that observers could appear.'
        feedback: |
          That is a *purpose* claim (a faith or metaphysical commitment, layer 3). The weak principle is only about which places and times we can observe; it is silent on why they exist.
      - text: 'It shows the dials of physics are fixed by the requirement that observers exist.'
        feedback: |
          That has a causal "must" in it, closer to the strong principle. The weak principle only says that among the dial settings that occur, we find ourselves in one that permits observers.
    explanation: |
      The weak principle changes what counts as surprising. Finding that we live where life is possible is not a surprise on its own. Whether the *existence* of such places needs explaining is a further question, which the rest of the lesson separates out.

  - type: text
    id: sap
    title: "The strong anthropic principle (a different kind of claim)"
    body: |
      Carter also stated a stronger version:

      > "The universe (and hence the fundamental parameters on which it depends) must be such as to admit the creation of observers within it at some stage."

      This is the **strong anthropic principle** (SAP). The word *must* does a lot of work, and it can be read at least three ways:

      - as a **requirement we observe** (any universe we see has these properties): this collapses into the weak principle;
      - as a **law or necessity** (physics is such that observers have to arise): a substantive, unproven physical or philosophical claim;
      - as a **purpose** (the universe exists in order to produce minds): a faith or metaphysical commitment, which different traditions accept or reject.

      Barrow and Tipler, in *The Anthropic Cosmological Principle* (1986), restate the weak principle as a selection effect on all cosmological observations and the strong one in essentially Carter's form. We label the strong principle as the **philosophical layer**: no experiment is known that tests it by itself.

  - type: mcq
    id: classify
    title: "Which layer?"
    prompt: |
      Three statements. (1) "We live on Earth and not on Venus partly because Venus could not host observers like us." (2) "The laws of physics are such that observers are bound to appear." (3) "The universe exists in order that minds may know it." Which assignment is the most defensible?
    options:
      - text: '(1) is a selection effect (weak principle, a fact); (2) is a strong-principle claim needing separate argument; (3) is a faith or metaphysical commitment.'
        correct: true
      - text: 'All three are the weak principle in different words.'
        feedback: |
          Only (1) is. (2) says observers *have to* arise and (3) says why the universe exists: neither follows from the fact that we can only observe observer-friendly places.
      - text: '(1) and (2) are facts; only (3) is a commitment.'
        feedback: |
          (2) is not an established fact: nobody has shown the laws force observers to arise. At most it is a hypothesis in physics or philosophy, which would need its own evidence.
    explanation: |
      Keeping the labels straight is the main skill of this lesson. The same word, "anthropic", covers a logical truism, a hypothesis, and a belief about purpose.

  - type: text
    id: bombers
    title: "A selection effect with numbers"
    body: |
      A well-known case of survivorship bias is told about the statistician Abraham Wald, who worked for the Statistical Research Group at Columbia University during the Second World War. Many details of the popular retelling are embellished; the logic below is the part that is solid.

      Suppose 200 bombers each take exactly one hit, 100 in the engine and 100 in the fuselage. A hit in the engine downs the plane with probability $0.8$; a hit in the fuselage downs it with probability $0.1$. Inspectors then count holes on the planes that **returned**.

  - type: numeric
    id: bombers-count
    title: "How many returning planes have an engine hole?"
    prompt: |
      200 bombers each take exactly one hit: 100 in the engine and 100 in the fuselage. An engine hit downs the plane with probability $0.8$, a fuselage hit with probability $0.1$. On average, how many of the planes that return have an engine hole?
    answer: 20
    tolerance: 0.5
    answerText: '20'
    wrong:
      - { value: 100, feedback: 'That is how many planes took an engine hit, not how many *returned* with one. Four in five of those never came back, so they cannot be inspected.' }
      - { value: 80, feedback: 'That is the number of engine-hit planes that were *lost*. The ones that returned are the other $20\%$.' }
    hint: 'Of the 100 engine-hit planes, the fraction that survive is $1-0.8$.'
    explanation: |
      $100\times(1-0.8)=20$ engine-hit planes return, against $100\times(1-0.1)=90$ fuselage-hit planes. The returning planes show $90$ fuselage holes for every $20$ engine holes, although the hits were equally split. Only $20/110\approx18\%$ of returning planes show the engine as the damaged spot, while the truth is $50\%$.

  - type: mcq
    id: bombers-armor
    title: "Where does the armour go?"
    prompt: |
      Among the returning bombers of the previous situation, fuselages show 90 holes and engines only 20, although hits were equally split between the two. Where does the survivorship argument say extra armour is most useful?
    options:
      - text: 'The engines: the shortage of engine holes on returners is a sign that engine hits are the ones that bring planes down.'
        correct: true
      - text: 'The fuselage: that is where the holes are.'
        feedback: |
          Tempting, because it takes the visible data at face value. But a fuselage hit is survivable ($90\%$ of such planes return), so those holes tell us where planes can be hit *and still come home*.
      - text: 'Neither: with this many returning planes the sample is representative.'
        feedback: |
          The size of the sample does not fix a filter. The planes that were lost are missing from it altogether, and they are exactly the ones that matter.
    explanation: |
      The returning sample is conditioned on survival. The same structure holds for observers: the universes or places we can observe are conditioned on our survival there.

  - type: mcq
    id: habitable
    title: "Why do we live on a planet?"
    prompt: |
      Most of the volume of the universe is almost empty space where no observer could live. A student says: "It is astonishing that we find ourselves on a small, warm, wet planet rather than in the vast empty parts." Using the weak anthropic principle, what is the best reply?
    options:
      - text: 'Observers can exist only in such places, so finding ourselves there is not surprising; what may still need explaining is why such places exist at all.'
        correct: true
      - text: 'It is a coincidence that needs a special cause for us.'
        feedback: |
          The sampling argument removes the need for a special cause *of our being found here*: wherever observers occur, they find themselves in observer-friendly places. A cause for the places existing is a separate question.
      - text: 'It is not surprising and nothing remains to be explained.'
        feedback: |
          Too quick. The selection effect explains why *we* are found on a planet. It does not explain why planets exist, why the laws allow chemistry, or how the sample of possible places came about.
    explanation: |
      The same two-part answer returns for the dials of physics: selection explains why we find a life-permitting value, once the other values are on the table.

  - type: text
    id: weinberg
    title: "Weinberg's prediction (1987)"
    image:
      src: img/weinberg.webp
      alt: "Photograph of Steven Weinberg at the 2010 Texas Book Festival"
      caption: "Steven Weinberg (1933–2021), who shared the 1979 Nobel Prize in Physics with Sheldon Glashow and Abdus Salam for the unified theory of the weak and electromagnetic forces, photographed in 2010."
      credit: "Larry D. Moore, CC BY 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Steven_Weinberg_2010.jpg"
    body: |
      Steven Weinberg used selection reasoning to make a prediction about the vacuum energy density $\rho_\Lambda$ (also called the cosmological constant) before it was measured.

      His argument, in his paper "Anthropic bound on the cosmological constant" (*Physical Review Letters* 59, 2607, 1987):

      1. Suppose, as in some theories, the vacuum energy density can take different values in different regions or universes, with no strong reason favouring a tiny value.
      2. A large positive $\rho_\Lambda$ pushes matter apart and stops clumps from collapsing. If $\rho_\Lambda$ were much larger than the matter density at the time galaxies form, no galaxies would form and there would be no observers.
      3. So the values observers find are not above roughly that matter density, and there was no reason for them to be much below it either.

      Matter dilutes as space expands, so its density at redshift $z$ is

      $$\rho_m(z)=(1+z)^3\,\rho_{m,0}$$

      where $\rho_{m,0}$ is its value today. Galaxies were being found at higher and higher redshifts, with $z\approx4$ already seen by 1997, which pushes the bound up and makes it a weaker constraint; Martel, Shapiro and Weinberg (1997) then refined the argument to ask what value a *typical* observer would find, finding that values up to about three times the present matter density are reasonably likely for an observer to see.

  - type: order
    id: weinberg-order
    title: "Put Weinberg's argument in order"
    prompt: Put the steps of the selection argument for the vacuum energy density in order.
    steps:
      - 'Assume the vacuum energy density takes different values in different regions or universes, with no strong preference for a tiny value.'
      - 'A large positive vacuum energy prevents matter from clumping into galaxies.'
      - 'Without galaxies there would be no observers to measure the value.'
      - 'So the value an observer finds is not far above the matter density at galaxy formation, and nothing pushes it much lower.'
    hint: 'First the assumption, then the physics, then what it does to observers, then the conclusion.'
    explanation: |
      Step 1 is an assumption (not a result): if the vacuum energy were the same in every universe, no selection would be needed and the argument would not apply. Steps 2 and 3 are physics about galaxy formation. Step 4 is the selection effect.

  - type: widget
    id: weinberg-ruler
    title: "Guess: where does the observed value sit?"
    widget: log-ruler
    config:
      min: -1
      max: 3
      unit: ''
      tickLabels: true
      readout: true
      items:
        - { label: "Matter density today (= 1)", value: 1.0, fixed: true }
        - { label: "Matter density when galaxies at z = 4 formed (bound)", value: 125, fixed: true }
        - { label: "Observed dark-energy density", value: 2.17, fixed: false }
    body: |
      A logarithmic ruler in units of today's matter density (each tick is a factor of ten). The matter density at which galaxies at redshift $z=4$ formed is marked at $125$. Select the chip for the observed dark-energy density, place it where you guess it sits, then press **Check**.

  - type: numeric
    id: weinberg-ratio
    title: "Bound against observation"
    prompt: |
      In a flat universe the dark-energy fraction is $\Omega_\Lambda=0.685$ and the matter fraction $\Omega_m=0.315$ (Planck 2018). So $\rho_\Lambda/\rho_{m,0}=\Omega_\Lambda/\Omega_m$. The matter density when galaxies at redshift $z=4$ formed was $(1+z)^3\rho_{m,0}$. By what factor is this larger than the observed $\rho_\Lambda$? Round to the nearest whole number.
    answer: 57
    tolerance: 2
    answerText: '57 (about 57.5)'
    wrong:
      - { value: 125, feedback: 'That is the matter density at $z=4$ in units of $\rho_{m,0}$. The question compares it with $\rho_\Lambda$, which is $2.17\,\rho_{m,0}$, so divide by $2.17$.' }
      - { value: 2.17, feedback: 'That is $\rho_\Lambda/\rho_{m,0}$ itself. The question asks for the bound divided by the observed value.' }
    hint: 'First $(1+4)^3$, then divide by $0.685/0.315$.'
    explanation: |
      $(1+4)^3=125$ and $0.685/0.315\approx2.17$, so the ratio is $125/2.17\approx57.5$. The observed value is below the bound but not astronomically: it is within two powers of ten of it, whereas the quantum-field estimate of the previous lesson is $10^{120}$ times above it. A selection effect that cuts the gap from $10^{120}$ to $\sim10^{2}$ is what made Weinberg's argument striking.

  - type: mcq
    id: weinberg-1998
    title: "What did the 1998 measurement show?"
    prompt: |
      In 1998 two teams of astronomers (those of Riess and Schmidt, and of Perlmutter) found from distant supernovae that the expansion of the universe is accelerating, which requires a positive vacuum energy density of about $0.7$ of the critical density (the value that makes space flat). Weinberg had argued in 1987 that, if anthropic selection explains the small value, it should not be far below the matter density at galaxy formation. What is the most defensible description?
    options:
      - text: 'The measured value is far below the quantum-field estimate yet within the range the argument allowed, so this counts as a successful prediction of the selection argument; whether it supports a multiverse is a separate question.'
        correct: true
      - text: 'It proved that a multiverse exists, because Weinberg predicted the value.'
        feedback: |
          The argument assumed that different values occur somewhere. A value in the predicted range is what we would see if that assumption holds, but also under other explanations (for example, an unknown symmetry or mechanism that sets $\rho_\Lambda$ near the matter density). It does not by itself establish the assumption.
      - text: 'It refuted the argument, because the measured value is not exactly the bound.'
        feedback: |
          The argument predicted a range, not a point: values from the order of the matter density today up to the bound. The measured value is inside the range and a typical-observer analysis gave about this size.
    explanation: |
      The papers: Riess et al., *Astronomical Journal* 116 (1998); Perlmutter et al., *Astrophysical Journal* 517, 565 (1999); Riess, Schmidt and Perlmutter shared the 2011 Nobel Prize in Physics. The status is *live debate* (layer 2): many physicists count the prediction as a real success, others say a single number matched at the level of an order of magnitude is weak evidence, and that other explanations remain open.

  - type: text
    id: explains
    title: "What a selection effect can and cannot explain"
    body: |
      **It can explain:** why we observe a dial value that permits observers, *if* different values occur somewhere and observers arise only where the value is suitable. In probability terms, if $P(x)$ is the prior probability of a dial value $x$ and $F(x)$ the weight of observers it allows (for the vacuum energy, the fraction of matter that ends up in galaxies, as in Martel, Shapiro and Weinberg), then the value an observer finds follows

      $$P_{\text{obs}}(x)\;\propto\;P(x)\,F(x).$$

      **It cannot, alone, explain:**

      - *why other values exist at all* (what produces the range of $x$);
      - *what fixes $P(x)$*, the prior (a probability rule for universes is a hard problem, taken up in the next lesson);
      - *why the laws permit complex chemistry for any value of $x$*;
      - *whether there is a purpose* behind the arrangement.

      A selection effect is an *explanatory filter*, not a source. It tells us which of the available worlds we can see; it does not say where the worlds come from.

  - type: mcq
    id: explains-multi
    title: "What does the argument need?"
    prompt: |
      Select every item that an anthropic explanation of the small vacuum energy density needs in addition to the fact that observers exist.
    multiple: true
    options:
      - text: 'A range of vacuum energy values that actually occur, in different regions or universes.'
        correct: true
      - text: 'A probability rule saying how likely each value is, before selection.'
        correct: true
      - text: 'A designer who chose the value.'
        feedback: |
          That would be a different explanation, not a requirement of the selection argument. The two can be combined by someone who believes both, but the selection argument itself does not use a designer.
      - text: 'Proof that every value is equally likely.'
        feedback: |
          Not needed and not claimed. It needs *some* prior; Weinberg assumed nothing strongly favours a tiny value near zero, which is weaker than equal likelihood for all values.
    explanation: |
      Two ingredients carry the weight: a spread of values that exist, and a rule for how likely each is. Observers then act as a filter on that spread.

  - type: mcq
    id: trap-purpose
    title: "Trap: anthropic means humans are the purpose"
    prompt: |
      A magazine writes: "The anthropic principle says the universe was made for humans." How should a careful reader respond?
    options:
      - text: 'The weak principle says nothing about purpose; "anthropic" there means "conditioned on observers". The strong principle can be read as a purpose claim, but only as an extra philosophical commitment.'
        correct: true
      - text: 'It is correct: that is what Carter meant.'
        feedback: |
          Carter''s weak principle (1974) is about observational selection. His strong principle says the universe must admit observers, which a few later authors read as purpose, but that reading is added.
      - text: 'It is false: the principle is only about humans and proves nothing about the universe.'
        feedback: |
          Overcorrecting. "Anthropic" is a historic misnomer: the principle concerns any observer, not just humans, and it does have content, as the selection reasoning on the vacuum energy density shows.
    explanation: |
      The word comes from the Greek *anthropos* ("human"), but the selection logic applies to any observer, not only humans.

  - type: mcq
    id: trap-circular
    title: "Trap: selection effects are circular"
    prompt: |
      A critic says: "'We see a life-permitting value because we exist' explains nothing, because it just repeats that we exist." What is the fairest reply?
    options:
      - text: 'It is empty if only one value exists. It is informative once other values are on the table, because it predicts which values we would find, and that prediction can fail, as Weinberg''s could have.'
        correct: true
      - text: 'It is circular, but circular arguments are fine in physics.'
        feedback: |
          Circularity is a real fault when the conclusion is assumed. Here it is not: the argument assumes a spread of values and derives which ones observers see. That is a prediction, not a restatement.
      - text: 'It is never circular, since it is a theorem.'
        feedback: |
          The weak principle is a truism, but the *use* of it needs assumptions (that other values occur, and a prior), and those assumptions are the debatable part.
    explanation: |
      The charge fails if the argument yields a testable prediction; it succeeds if the argument is used only to say "it is what it is". The honest summary: selection effects are real, and their power depends on the assumptions added.

  - type: mcq
    id: trap-proof
    title: "Trap: Weinberg proved a multiverse"
    prompt: |
      "Weinberg predicted the dark-energy value, so the multiverse is proven." What is the best assessment?
    options:
      - text: 'The prediction followed from the assumption that the vacuum energy takes many values, with a selection effect; a matching value supports that package modestly but does not prove the multiverse, since other mechanisms could produce the same value.'
        correct: true
      - text: 'It is correct: only a multiverse can produce a prediction like that.'
        feedback: |
          Other explanations could also give a value near the matter density: a symmetry, a dynamical mechanism, or a different reason we have not found.
      - text: 'It is irrelevant: a successful prediction never supports its assumptions.'
        feedback: |
          Too strong. A prediction that could have failed and did not does raise the support for the assumptions behind it, but by an amount that depends on how likely the other explanations made the same outcome.
    explanation: |
      This is Bayesian reasoning: a match raises the probability of the package only by the ratio of how well each rival predicted it. The next lessons return to the multiverse itself.

  - type: mcq
    id: split
    title: "Where thoughtful people part ways"
    prompt: |
      Two physicists agree on the Weinberg calculation and on the measured value. One counts it as good evidence for an ensemble of universes; the other says it is a coincidence in an unfinished theory. Which kind of disagreement is it?
    options:
      - text: 'A disagreement about the prior plausibility of an ensemble and of other mechanisms (a layer 2 question about how to weigh the evidence), not about the data.'
        correct: true
      - text: 'A disagreement about established facts, so one of them must be wrong about the data.'
        feedback: |
          They agree on the data. What differs is how likely each thinks the rival explanations were beforehand, which can differ reasonably.
      - text: 'A faith disagreement only: science cannot weigh in.'
        feedback: |
          Part of the question is open to evidence (future theory may fix $\rho_\Lambda$ by a mechanism, or fail to), so it is not purely faith. Whether there is a purpose behind the arrangement is the faith layer.
    explanation: |
      Layer 1 (agreed): the value, the galaxy-formation bound, the logic of selection. Layer 2 (live): how much weight the match deserves, whether anthropic reasoning counts as science, whether a mechanism will replace it. Layer 3 (commitment): whether the arrangement has a purpose, and whether the strong principle in any reading is true. A believer, an atheist and an agnostic can all accept the weak principle and part ways only on the later layers.

  - type: text
    id: summary
    body: |
      **Next:** *The Multiverse and the Measure Problem*. The selection argument needs a spread of universes and a probability rule for them. Where might they come from (inflation, the string landscape), and why is counting universes harder than it sounds?
