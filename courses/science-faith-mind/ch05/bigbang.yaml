id: ch05-bigbang
title: "The Universe Has a History"
kind: concept
own: |
  - **Expansion is measured.** Light from distant galaxies is *redshifted* (its wavelengths are stretched), and the farther the galaxy, the larger the stretch. For small shifts this means the **Hubble-Lemaitre law**, with $v$ the recession speed of a galaxy (km/s), $d$ its distance (Mpc, megaparsecs; $1\ \text{Mpc} \approx 3.09\times10^{19}$ km) and $H_0$ the present expansion rate:
  {{ $$v = H_0\, d$$ }}
  The value is $H_0 \approx 70$ km/s/Mpc (Planck satellite, early universe: about $67.4$; local distance ladder: about $73$; the gap is the live "Hubble tension"). If the rate had always been the same, the age would be the Hubble time $1/H_0 \approx 14$ billion years, close to the measured $13.8$. Every observer sees the same law, so there is **no centre**: it is the space between galaxies that stretches, not an explosion into empty space.
  - **A hot past is a prediction, and it was confirmed.** Light stretched by a factor $1+z$ ($z$ = the redshift) keeps a thermal spectrum with temperature scaled down by the same factor, so a radiation bath that is $T_0 = 2.725$ K today was hotter in the past:
  {{ $$T = T_0\,(1+z)$$ }}
  At $z \approx 1100$ this gives $T \approx 3000$ K, when atoms formed and the universe became transparent, about $380{,}000$ years after the start. That light is the **cosmic microwave background (CMB)**: predicted by Alpher and Herman in 1948 (about 5 K), found by Penzias and Wilson in 1964-65, and measured to be a near-perfect thermal spectrum, almost the same in every direction (differences of about one part in $25{,}000$).
  - **Nuclear fusion in the first minutes.** When neutrons and protons were about $x = n/p \approx 1/7$, nearly every neutron ended in helium-4 (2 protons, 2 neutrons), so the helium mass fraction is
  {{ $$Y = \frac{2x}{1+x} \approx 0.25$$ }}
  which matches what telescopes see in the oldest gas. (The lithium-7 amount is a known mismatch.)
  - **Three layers.** *Established fact*: the universe expanded from a hot, dense state, well tested back to the first minutes (expansion, CMB, light elements). *Live debate*: what happened before and at the very start, and why the expansion rate is measured two ways with two answers. *Faith or metaphysics*: whether this is a *creation*. Georges Lemaitre (1894-1966), priest and physicist, proposed a "primeval atom" in 1931 and insisted that the physics neither proves nor disproves creation, and persuaded Pope Pius XII (reportedly) to stop drawing that conclusion in public. Where people part ways: {{ whether a hot, dense early state calls for a cause beyond physics }}.
cards:
  - type: mcq
    id: hook
    title: "Guess: how do galaxies move?"
    prompt: |
      Guess before any theory. A **galaxy** is a vast island of billions of stars; the Milky Way, our own, is one. Astronomers can tell whether a faraway galaxy moves toward us or away from us. Looking in every direction, what pattern would you expect?
    options:
      - text: 'Roughly half toward us and half away, in random directions, like drifting boats.'
        feedback: |
          A natural first guess: gravity pulls things together and stirs them in all directions, and this is what the nearest galaxies do. But the faraway ones show something else, as the next cards explain.
      - text: 'Almost all moving away, and the farther the galaxy, the faster it moves away.'
        correct: true
        feedback: |
          This is what was found in the 1920s. The rest of the lesson asks what it means and what it does not.
      - text: 'All circling around us, at the same speed.'
        feedback: |
          Nothing like that is seen, and it would make our place in the sky special, which is exactly what the observations will not need.
    explanation: |
      Guessing is the point of the opening card: nothing here needs prior knowledge. The measured pattern is that distant galaxies recede, faster the farther they are.

  - type: text
    id: redshift
    title: "Galaxies run away: the evidence"
    body: |
      How can we know how a galaxy moves? From its light. A source moving away makes its light **redshifted**: every wavelength is stretched, so a spectral line (a sharp colour that an element emits) lands at a longer wavelength than in the lab. The redshift $z$ is the fractional stretch, and for small values the recession speed is $v \approx c\,z$, where $c \approx 3.0\times10^5$ km/s is the speed of light.

      The history, as the sources give it: Vesto Slipher measured the first such shift of a spiral nebula in 1912. Alexander Friedmann showed in 1922 that Einstein's equations allow an expanding universe. Georges Lemaitre derived in 1927 that distance and recession speed should be proportional, and compared it with the data then available. Edwin Hubble published in 1929 ("A Relation between Distance and Radial Velocity among Extra-Galactic Nebulae", *Proceedings of the National Academy of Sciences* 15, 168-173) distances and velocities for 24 nebulae with individual distance estimates, and found the same proportionality. In 2018 the International Astronomical Union recommended, by a vote of its members, calling it the **Hubble-Lemaitre law**:
      $$v = H_0\, d$$
      Here $v$ is the recession speed, $d$ the distance, and $H_0$ the **Hubble constant**, the present expansion rate. Distances are in **megaparsecs** (Mpc), $1\ \text{Mpc} \approx 3.09\times10^{19}$ km, and today $H_0 \approx 70$ km/s per Mpc.

      **Established fact:** the redshift-distance relation. Hubble's own first value (about 500 km/s/Mpc) was far too high, because of errors in his distance scale, not in the idea.

  - type: numeric
    id: distance
    title: "From a redshift to a distance"
    prompt: |
      A galaxy's spectral lines are redshifted by $z = 0.02$. Take $c = 3.0\times10^{5}$ km/s and $H_0 = 70$ km/s/Mpc. Using $v = c\,z$ and $v = H_0\,d$, how far away is it, in Mpc?
    answer: 85.7
    tolerance: 0.5
    answerText: '85.7'
    wrong:
      - { value: 6000, feedback: 'That is the speed $v = cz = 6000$ km/s, not the distance. Divide by $H_0$ to turn a speed into a distance.' }
      - { value: 0.0117, feedback: 'You divided $H_0$ by $v$. The law is $v = H_0 d$, so $d = v/H_0$.' }
    hint: 'First the speed, $v = cz$; then $d = v/H_0$.'
    explanation: |
      $$v = cz = 3.0\times10^{5}\times0.02 = 6000\ \text{km/s}$$
      $$d = \frac{v}{H_0} = \frac{6000}{70} \approx 85.7\ \text{Mpc}$$
      The same relation, run in reverse, is how astronomers estimate distances to galaxies too far for any other ruler.

  - type: numeric
    id: nocentre
    title: "Who sees the centre?"
    prompt: |
      Along one line of sight, we see galaxy B at $100$ Mpc and galaxy C twice as far, at $200$ Mpc (both farther than anything near us). With $H_0 = 70$ km/s/Mpc, B recedes from us at $7000$ km/s and C at $14{,}000$ km/s. An astronomer living in B applies the same law to C, which is $100$ Mpc from B. At what speed (km/s) does she see C receding from her?
    answer: 7000
    tolerance: 1
    answerText: '7000'
    wrong:
      - { value: 14000, feedback: 'That is C''s speed relative to us. Relative to B the speed is the difference, $14{,}000 - 7000$, and it also equals $H_0 \times 100$ Mpc.' }
      - { value: 0, feedback: 'C and B are not at rest relative to each other: they are $100$ Mpc apart, so the law gives them a speed.' }
    hint: 'Two ways must agree: subtract the speeds, or apply $v = H_0 d$ with $d = 100$ Mpc.'
    explanation: |
      $$14{,}000 - 7000 = 7000\ \text{km/s} = 70 \times 100\ \text{km/s}$$
      The law looks the same from B as from us. Proportionality of speed to distance is the **only** pattern that lets every observer see the same law, so it does not single out our position.

  - type: mcq
    id: centre
    title: "Is Earth the centre?"
    prompt: |
      Everyone sees all other galaxies recede, faster the farther. Which conclusion do the numbers just computed support?
    options:
      - text: 'No galaxy is special: an observer anywhere sees the same pattern, as with dots on an inflating balloon or raisins in rising dough.'
        correct: true
      - text: 'We sit at the centre of the universe, since everything moves away from us.'
        feedback: |
          Everything moves away from every observer, as the previous calculation showed. A centre would show different patterns from different places.
      - text: 'The galaxies are flying outward through space from one point where an explosion happened.'
        feedback: |
          That is the popular picture, and it needs a special centre. The pattern seen has none; the better picture is that the space between galaxies grows.
    explanation: |
      On a balloon, dots all move apart from each other as it inflates, and no dot is the middle. The analogy has a limit: the balloon's surface sits in a three-dimensional room, while the real universe needs no such outside, as far as the equations go.

  - type: text
    id: space
    title: "Space itself stretches"
    body: |
      The standard picture in cosmology (the **Big Bang model**) is that the *space between* galaxies grows, carrying them apart, while galaxies themselves, held together by gravity, do not swell. The name "Big Bang" was used on BBC radio on 28 March 1949 by the astronomer Fred Hoyle (1915-2001), a defender of the rival **steady-state** theory (Bondi, Gold and Hoyle, 1948), in which the universe never changes on average and new matter appears continuously. According to the historian Helge Kragh, the name was probably not meant as mockery, though sources differ.

      Two consequences of the picture. First, there is no point in space where "it all happened": the early universe was dense *everywhere*, and everywhere is still where it happened. Second, the expansion has a rate, and a rate has a timescale. This is why a running-backwards film of the universe leads to a hot, dense state.

  - type: mcq
    id: trap-explosion
    title: "Where was the Big Bang?"
    prompt: |
      A friend says: "Point to where the Big Bang happened; it must be somewhere out there in the sky." What is the best reply, according to the Big Bang model?
    options:
      - text: 'It happened everywhere: every place was part of the dense early state, and space has been growing at all places since.'
        correct: true
      - text: 'It happened at the centre of the Milky Way, where the oldest stars are.'
        feedback: |
          The oldest stars say nothing about a centre; the expansion pattern is the same from any galaxy.
      - text: 'It happened at a point far away, and the galaxies we see are the debris flying toward us.'
        feedback: |
          Galaxies recede from us, not toward us, and the model has no outside point to fly from.
    explanation: |
      The Big Bang is not an explosion in space but a statement about space: the distances between typical places were smaller, and the matter and radiation denser and hotter, at earlier times.

  - type: numeric
    id: hubble-time
    title: "A first age estimate"
    prompt: |
      Run the film backwards at the *present* rate: if galaxies had always receded at their present speeds, the time since they were together is $d/v = 1/H_0$. Take $H_0 = 70$ km/s/Mpc, $1\ \text{Mpc} = 3.09\times10^{19}$ km and $1\ \text{Gyr} = 3.156\times10^{16}$ s (one billion years). Find $1/H_0$ in Gyr.
    answer: 14.0
    tolerance: 0.3
    answerText: '14.0'
    wrong:
      - { value: 70, feedback: 'That is $H_0$ itself. Invert it and convert units: km cancel, leaving seconds.' }
    hint: 'First $1/H_0 = (3.09\times10^{19}\ \text{km})/(70\ \text{km/s})$ in seconds, then divide by $3.156\times10^{16}$ s per Gyr.'
    explanation: |
      $$\begin{aligned}\frac{1}{H_0} &= \frac{3.09\times10^{19}}{70}\ \text{s}\\ &\approx 4.41\times10^{17}\ \text{s}\\ &\approx 14.0\ \text{Gyr}\end{aligned}$$
      The measured age from the full model is $13.787 \pm 0.020$ Gyr (Planck 2018 analysis). The two are close but not equal, because the expansion rate has changed over time (slowed by gravity at first, then sped up).

  - type: mcq
    id: tension
    title: "Which parts are settled?"
    prompt: |
      Today two methods measure $H_0$: from the CMB with the standard model (Planck satellite: about $67.4$ km/s/Mpc) and from a ladder of nearby distances (about $73$ km/s/Mpc). The gap is more than five standard errors. What is the fair statement?
    options:
      - text: 'That the universe expands is established; the current rate being measured two ways with different values is a live debate (an unknown error, or new physics).'
        correct: true
      - text: 'The disagreement shows the universe is not expanding.'
        feedback: |
          Both methods agree that it expands. They disagree by about 8% on the present rate.
      - text: 'The disagreement is a proof of new physics.'
        feedback: |
          It might be, but a systematic error in one chain of measurements is also a live explanation. Calling it proof would pass a layer-two debate off as a layer-one fact.
    explanation: |
      Separating the **fact** (expansion) from the **number** (its rate) is what keeps the whole picture from collapsing when one detail is in tension.

  - type: text
    id: lemaitre
    title: "Lemaitre: the priest who proposed it"
    body: |
      Georges Lemaitre (1894-1966) was a Belgian Catholic priest (ordained 1923) and a physicist. In 1927, in French, in the *Annales de la Societe Scientifique de Bruxelles*, he derived an expanding universe that accounts for the receding nebulae. In 1931, in *Nature*, in a note titled "The Beginning of the World from the Point of View of Quantum Theory", he suggested that the universe began from a single quantum, the **primeval atom**, which divided into the matter we see.

      How did he relate this to his faith? According to the standard biographical accounts, he held that religion and science are two separate paths to truth and opposed mixing them in a scientific argument. In 1951 Pope Pius XII told the Pontifical Academy of Sciences that Big Bang cosmology fitted the doctrine of creation out of nothing (in essence, he saw in it a primordial "let there be light"). Lemaitre was reportedly dismayed, and persuaded the Pope to stop drawing that conclusion in public.

      **Layers:** that the universe expands and had a hot, dense past is established fact. That this amounts to *creation* is a faith or metaphysical claim, and Lemaitre himself declined to make it from the physics.

  - type: mcq
    id: lemaitre-q
    title: "What did Lemaitre actually do?"
    prompt: |
      Which statement is best supported about Georges Lemaitre?
    options:
      - text: 'He proposed a beginning from a "primeval atom" as physics, and according to the standard accounts opposed using it as a scientific proof of creation.'
        correct: true
      - text: 'He was a physicist who rejected the expansion because it conflicted with his priesthood.'
        feedback: |
          The reverse: he derived the expansion himself in 1927, before Hubble's data paper.
      - text: 'He argued that his theory proved the existence of God and urged the Pope to say so.'
        feedback: |
          Reportedly he did the opposite in 1951, persuading the Pope to stop drawing that conclusion in public.
    explanation: |
      A scientist who is also a believer can keep two questions apart: "what does the evidence say?" and "what does it mean for the ultimate nature of things?". A skeptic can respect that separation too. The question of what it *means* is where the layers change.

  - type: text
    id: cooling
    title: "A hot past: a prediction"
    body: |
      If the space between galaxies stretches, so does light travelling through it. Light travelling from a time when the universe was smaller by a factor $1+z$ arrives with every wavelength stretched by that factor; here $z$ is the redshift. For radiation in thermal equilibrium (the glow of anything hot, a **blackbody**), temperature goes with the inverse of the typical wavelength, so a blackbody glow stays a blackbody glow, with its temperature divided by $1+z$. Run backwards, the radiation was hotter:
      $$T = T_0\,(1+z)$$
      with $T_0$ the temperature today and $T$ the temperature at redshift $z$.

      At high enough temperature, atoms cannot hold together: electrons and protons are free, and free electrons scatter light, so the cosmic gas is opaque, like the inside of a star. Once it cools below a few thousand degrees atoms form and light travels freely. The prediction: a leftover glow should still fill the sky today, from the moment the universe turned transparent.

  - type: numeric
    id: cmb-temp
    title: "How hot was it then?"
    prompt: |
      The leftover glow today has temperature $T_0 = 2.725$ K. The universe turned transparent at redshift $z \approx 1100$. Using $T = T_0(1+z)$, what was the temperature of the glow then, in kelvin?
    answer: 3000
    tolerance: 20
    answerText: '3000'
    wrong:
      - { value: 2997.5, feedback: 'Close: with $z = 1100$ exactly the factor is $1 + z = 1101$, not $1100$.' }
      - { value: 3.3, feedback: 'You divided. The glow was hotter in the past, so multiply by $1+z$.' }
    hint: 'The factor is $1+z$, not $z$.'
    explanation: |
      $$T = 2.725 \times 1101 \approx 3000\ \text{K}$$
      About the temperature at which hydrogen atoms form. The established time from other sources is about $380{,}000$ years after the start.

  - type: text
    id: cmb
    title: "The glow is found"
    body: |
      In 1948 Ralph Alpher and Robert Herman, extending a paper of George Gamow's, estimated that a relic glow of about $5$ K should exist. It was not looked for. In 1964, Arno Penzias and Robert Wilson at the Bell Telephone Laboratories at Holmdel, New Jersey, found an unexplained noise in a radio antenna, equal from all directions and over the seasons, about $3.5$ K at a wavelength of 7.35 cm (4080 megacycles per second). They did not know what it was. A group at Princeton led by Robert Dicke (Peebles, Roll, Wilkinson) was preparing to look for exactly that glow and explained it; their note appeared in the same issue of the *Astrophysical Journal* in 1965. Penzias and Wilson shared the 1978 Nobel Prize in Physics.

      Later satellites measured it: the spectrum, from the COBE satellite's instrument, is indistinguishable from a blackbody of $T_0 = 2.725$ K, the most perfect thermal spectrum ever measured in nature, in one standard description. It is nearly the same in all directions, with differences of about one part in $25{,}000$; those tiny ripples later became galaxies.

      **Established fact:** the CMB exists and has this spectrum. **Live debate** in its day: the steady-state theory tried to explain it as scattered starlight from ancient stars, but the evenness and near-perfect thermal shape made that hard; the theory is now rejected by most cosmologists.

  - type: mcq
    id: cmb-q
    title: "Why does a thermal spectrum matter?"
    prompt: |
      Steady-state defenders could say: "the microwave glow is just starlight from old stars, absorbed and re-emitted by dust." Which feature of the CMB is the hardest for that explanation, and why?
    options:
      - text: 'Its near-perfect thermal spectrum and evenness in all directions: scattered starlight would reflect the patchy distribution of stars and dust, not a single clean temperature.'
        correct: true
      - text: 'Its being radio waves rather than visible light, since stars never emit radio waves.'
        feedback: |
          Stars do emit some radio waves, and dust can reprocess light into longer wavelengths. The difficulty is the shape and evenness of the spectrum, not its band.
      - text: 'Its very low temperature, since old stars could not be as cold as $2.7$ K.'
        feedback: |
          Starlight absorbed by cold dust can be re-emitted at low temperature. The difficulty is getting a perfect single-temperature spectrum from a mix of many sources.
    explanation: |
      The best defenders of a rival theory deserve this fair test: a rival must explain the same data, and here the fit with a relic of a once-hot, uniform state was natural, while the starlight story needed special tuning.

  - type: text
    id: bbn
    title: "Cooking the first elements"
    body: |
      Earlier still, in the first minutes, the whole universe was hotter than the centre of the Sun and could fuse nuclei. This is **Big Bang nucleosynthesis** ("making nuclei"). Neutrons are slightly heavier than protons and decay when free, so by the time fusion began, there was about one neutron for every seven protons: $x = n/p \approx 1/7$. Almost all the neutrons ended up locked in **helium-4** (a nucleus with 2 protons and 2 neutrons); what remained was hydrogen. The mass of helium is then about $2x/(1+x)$ of all the nucleons, a number fixed by the neutron-to-proton ratio alone.

      The prediction, about 25% helium by mass, matches the oldest, least-processed gas that telescopes can see. (The amount of lithium-7 predicted is two to four times larger than measured, the "lithium problem", which is open and does not touch the helium result.)

  - type: numeric
    id: helium
    title: "Why one quarter?"
    prompt: |
      Take $x = n/p = 1/7$: in a sample of $8$ nucleons, $1$ is a neutron and $7$ are protons. Assume all neutrons end up in helium-4 (2 neutrons and 2 protons per nucleus) and all other protons stay hydrogen. What fraction of the **mass** is helium-4? (Treat every nucleon as the same mass.)
    answer: 0.25
    tolerance: 0.005
    answerText: '0.25'
    wrong:
      - { value: 0.125, feedback: 'That is the neutron fraction, $1/8$. Each helium nucleus also carries 2 protons, so the helium mass is twice the neutron mass.' }
    hint: 'Scale to $16$ nucleons: $2$ neutrons and $14$ protons. One helium nucleus uses all $2$ neutrons.'
    explanation: |
      With $16$ nucleons: $2$ neutrons and $14$ protons make one helium-4 (4 nucleons). The fraction is
      $$Y = \frac{4}{16} = \frac{2x}{1+x} = \frac{2/7}{8/7} = 0.25$$
      The reasoning matters more than the number: one ratio, set by weak-force physics, fixes the answer, and the sky agrees.

  - type: order
    id: order-history
    title: "Put the history in order"
    prompt: |
      Order these stages of the universe's history, from the earliest to the latest, according to the standard model.
    steps:
      - 'Light elements form: hydrogen and helium (nucleosynthesis), within the first minutes to about twenty minutes'
      - 'The universe turns transparent and the CMB is released, about 380,000 years'
      - 'The first stars form, probably within a few hundred million years'
      - 'Today, about 13.8 billion years'
    hint: 'Roughly: minutes, hundreds of thousands of years, hundreds of millions of years, billions of years.'
    explanation: |
      Each stage leaves a trace we can measure: helium abundance, the CMB, early galaxies seen by telescopes, and today's sky. Notice how many independent kinds of evidence meet in one history. That is why the hot Big Bang model is so well established.

  - type: mcq
    id: layers
    title: "Fact, debate, or faith?"
    multiple: true
    prompt: |
      Select **all** the claims that belong to *established fact* (as opposed to live debate or faith).
    options:
      - text: 'The distances between galaxies have been growing, as shown by the redshift-distance relation.'
        correct: true
      - text: 'The universe was once hot and dense enough to make light elements, and the predicted helium fraction (about 25% by mass) matches observation.'
        correct: true
      - text: 'There was a first moment of time, with nothing before it.'
        feedback: |
          Not established. The model, run backwards, stops being reliable long before any "first moment" (the next lesson, Did Time Begin?, examines what "beginning" can mean). This is live debate.
      - text: 'The Big Bang shows that the universe was created by God.'
        feedback: |
          A faith or metaphysical claim. The physics describes how the universe developed, and Lemaitre himself declined to draw this conclusion from it.
      - text: 'The Big Bang shows that the universe needed no cause.'
        feedback: |
          Also a metaphysical claim, from the other side. Neither direction follows from the redshift, the CMB or the helium.
    explanation: |
      Notice the symmetry in the last two options: "the Big Bang proves a Creator" and "the Big Bang proves no Creator is needed" both go beyond the evidence. What the evidence shows is a hot, dense, expanding past; what it means is argued with other premises.

  - type: mcq
    id: views
    title: "Two readings, fairly stated"
    prompt: |
      Which pair describes two serious readings of the Big Bang model without caricature?
    options:
      - text: 'A theist reads an early hot, dense state as consistent with a created universe (as Pius XII did in 1951); a skeptic replies that physics describes a development, and that a first cause is a further assumption the data do not require.'
        correct: true
      - text: 'A theist claims the Big Bang is Genesis in scientific language, and a skeptic claims it is a lie invented by priests.'
        feedback: |
          Both are caricatures. The model was proposed by physicists, one of them a priest who opposed the identification, and tested by observations anyone can check.
      - text: 'A theist rejects the evidence, and a skeptic accepts it, so only the skeptic is scientific.'
        feedback: |
          Many believers accept the Big Bang model (Lemaitre did), and the question is not whether to accept the evidence but what follows from it.
    explanation: |
      Each side can accept every number in this lesson and part ways on what a beginning, if any, would imply. The next lessons ask what "beginning" can mean in physics, and what the philosophical question "why anything at all?" adds.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the model, run backwards, becomes unreliable at the very start. Does that mean time had a first moment, or only that our description stops there? That is the lesson *Did Time Begin?*: singularity theorems, quantum cosmology, eternal inflation and cyclic models.
