id: ch05-constants
title: "Fine-Tuning: The Numbers"
kind: concept
own: |
  - **Setting.** A *physical constant* here is a number that the laws of physics take as an input and that current theory does not compute: a coupling strength, a particle mass, the energy density of empty space. *Fine-tuning* is the claim, made by physicists such as Barnes and Rees, that if one of these numbers were changed a little, the universe would not form atoms, stars or chemistry. How big "a little" is differs from constant to constant, and several of the claims are disputed.
  - **Cosmological constant.** Let $\rho_\Lambda$ be the vacuum (dark-energy) energy density we observe and $\rho_P$ the Planck energy density, the natural unit built from $\hbar$, $c$ and $G$. Adding up the vacuum contributions of quantum field theory with a Planck-scale cutoff gives an estimate about $10^{120}$ to $10^{123}$ times too large (the exponent depends on the cutoff and the units):
  {{ $$\frac{\rho_\Lambda}{\rho_P} \approx 10^{-123}$$ }}
  A separate fact is the *life-permitting window*: according to Barnes, a vacuum energy more negative than about $-10^{-121}$ in Planck units makes the universe re-collapse before life can form.
  - **Gravity against electromagnetism.** For two protons of charge $e$ and mass $m_p$ at any distance, the ratio of electric to gravitational force ($G$ = Newton's constant, $\varepsilon_0$ = vacuum permittivity) is
  {{ $$\frac{F_{\text{elec}}}{F_{\text{grav}}} = \frac{e^2}{4\pi\varepsilon_0\,G\,m_p^2} \approx 1.2\times10^{36}$$ }}
  Rees calls a number of this size one of the "six numbers". Stars exist over a wide range of the gravitational and electromagnetic strengths, but how much of the range is "wide" depends on the measure (below).
  - **Carbon and the Hoyle state.** Stars make carbon-12 from three helium-4 nuclei ($\alpha$ particles) through an excited state of carbon-12 at about $7.65\ \text{MeV}$, predicted by Hoyle (1953-54):
  {{ $$3\,{}^{4}\text{He} \to {}^{12}\text{C}^{*} \to {}^{12}\text{C}$$ }}
  According to Oberhummer, Csótó and Schlattl (2000), changing the strong force by more than about $0.5\%$ or the electromagnetic force by more than about $4\%$ cuts stellar carbon or oxygen production by factors of $30$ to $1000$. Later work on late stellar stages suggests the sensitivity is real but the exact limits are uncertain.
  - **Weak scale (Higgs).** The Higgs field value is $v \approx 246\ \text{GeV}$, which is
  $$\frac{v}{m_{\text{Pl}}} \approx 2\times10^{-17}$$
  of the Planck mass $m_{\text{Pl}}$. Estimates of the life-permitting window run from about a factor $0.4$ to $1.65$ of the observed value (Damour and Donoghue) down to a $1\%$ change (Jeltema and Sher), depending on the criterion used.
  - **What is established and what is disputed.** *Established*: the values above and that some changes would alter nuclear and stellar physics. *Live debate*: how large the life-permitting region is, because (1) changing {{ one constant at a time versus all together }} gives different regions, and (2) the fraction of "possible values" that works depends on the {{ measure (a range of values weighted evenly in the number or in its power of ten) }}. *Faith or metaphysical commitment*: what the apparent tuning means, a designer, a multiverse, or nothing needing explanation.
cards:
  - type: mcq
    id: hook
    title: "Guess: nudge the dials"
    prompt: |
      Guess before any theory. The laws of physics contain a number of constants (how strong gravity is, how heavy the electron is, how much energy empty space holds) that nobody can derive from deeper principles. Imagine each number is a dial, and you nudge one by a few percent. What is your best first guess?
    options:
      - text: 'It depends on the dial: a few would wreck atoms or stars with a small nudge, while many would barely matter.'
        correct: true
        feedback: |
          A good guess and the shape of the answer: the sensitivity is very uneven, and the lesson sorts the dials.
      - text: 'Nothing would change much: nature is robust to small changes in any dial.'
        feedback: |
          Tempting, but at least some of the numbers are known to matter a lot (the lesson shows which). Robustness cannot be assumed for all of them.
      - text: 'Every dial is equally delicate: any nudge destroys atoms and stars.'
        feedback: |
          Also tempting, and often how the idea is retold. The calculations show very different sensitivities, from a fraction of a percent to many orders of magnitude of room.
    explanation: |
      Guessing is the point of the opening card. This lesson sorts the constants by how sensitive the universe is to each, and keeps apart what physicists agree on from what they dispute. It does not yet ask what the sensitivity *means*; that comes in the lessons after this one.

  - type: text
    id: setup
    title: "What counts as a constant, and what 'fine-tuning' claims"
    body: |
      A **physical constant** is a number the laws take as an input: for example the strength of gravity, the mass of the electron, or the energy density of empty space (the *vacuum energy*). Present-day physics measures them but does not derive them. **Fine-tuning** is the claim that if some of these numbers were changed a little, the universe would not form atoms, stars, carbon or complex chemistry.

      Recall from the lesson *Why Was the Early Universe So Ordered?* that the starting state of the universe also looked special. Here the question is about the **dials of the laws**, not the starting state.

      Following the course's rule, every claim below is given **according to** someone, and labeled as *established fact*, *live debate*, or *faith or metaphysical commitment*. Two main sources of the numbers: Luke Barnes's review in *Publications of the Astronomical Society of Australia* (2012) and Fred Adams's review in *Physics Reports* (2019).

  - type: widget
    id: lambda-ruler
    title: "Guess: how small is empty space's energy?"
    widget: log-ruler
    config:
      min: -130
      max: 5
      unit: ''
      tickLabels: true
      readout: true
      items:
        - { label: "Planck-scale estimate of vacuum energy density (= 1 in Planck units)", value: 1.0, fixed: true }
        - { label: "Observed dark-energy density", value: 1.1e-123, fixed: false }
    body: |
      A logarithmic ruler: each tick is a factor of ten. The Planck energy density, the natural unit built from $\hbar$, $c$ and $G$, sits at $1$. Quantum field theory with a cutoff at the Planck scale suggests that empty space should hold about that much energy. Select the chip for the observed dark-energy density, place it where you guess it sits, then press **Check**.

  - type: numeric
    id: lambda-gap
    title: "How big is the mismatch?"
    prompt: |
      The observed dark-energy density is about $1.1\times10^{-123}$ in Planck units, while the naive quantum-field estimate with a Planck cutoff is about $1$. Write the estimate as $10^{x}$ times the observed value. What is $x$, to the nearest ten?
    answer: 120
    tolerance: 5
    answerText: '120 (more exactly 123)'
    wrong:
      - { value: 12, feedback: 'That would be a mismatch of a trillion. The observed value is $10^{-123}$, a decimal point followed by 122 zeros, so the gap is about 120 powers of ten.' }
      - { value: -120, feedback: 'The sign flips because the question asks how many times the *estimate is larger* than the observation, which is a positive power of ten.' }
    hint: 'Divide: $1/(1.1\times10^{-123}) \approx 0.9\times10^{123}$.'
    explanation: |
      The ratio is about $10^{123}$; quoted as "$10^{120}$" in most reviews because the exponent depends on the cutoff and on the units. Barnes's review gives $10^{120}$. A mismatch of this size is the **cosmological constant problem**. It is a mismatch between a *calculation* and an *observation*; whether it also signals fine-tuning for life is the next card.

  - type: mcq
    id: lambda-two
    title: "Two different statements about the cosmological constant"
    prompt: |
      According to Barnes, two statements are often run together. (A) The quantum-field estimate of the vacuum energy is about $10^{120}$ times the observed value. (B) A vacuum energy more negative than about $-10^{-121}$ in Planck units would make the universe re-collapse before life can form. Which description is correct?
    options:
      - text: '(A) is a mismatch between a calculation and the data and could be a flaw in the calculation; (B) is a statement about the range of values that would allow life. They support the fine-tuning claim only when combined.'
        correct: true
      - text: '(A) and (B) are the same claim in different words.'
        feedback: |
          They are different. (A) compares theory with the measured value. (B) compares the measured value with the range that would permit life, without any reference to the quantum-field estimate.
      - text: '(A) shows the observed value is the only one that allows life.'
        feedback: |
          (A) says nothing about life. Only (B)-type reasoning, about what universes can form structure, bears on that, and it gives a window, not a single allowed value.
    explanation: |
      Careful readers keep the two apart: the first may be solved by better theory (some physicists think the quantum-field estimate is simply wrong, or that a symmetry sets the value), the second is a calculation about structure formation. The next lesson meets Weinberg's use of the second.

  - type: text
    id: gravity-intro
    title: "Gravity is very weak"
    body: |
      Take two protons, charge $e$ and mass $m_p$, at any distance $r$. Both the electric repulsion and the gravitational attraction fall as $1/r^2$, so their ratio does not depend on $r$:

      $$\frac{F_{\text{elec}}}{F_{\text{grav}}} = \frac{e^2/(4\pi\varepsilon_0)}{G\,m_p^2}$$

      Here $\varepsilon_0$ is the vacuum permittivity and $G$ Newton's constant. Martin Rees (*Just Six Numbers*, 1999) lists a number of this size, about $10^{36}$, among six numbers that shape the universe.

  - type: numeric
    id: gravity-ratio
    title: "Electric over gravitational force"
    prompt: |
      For two protons, $e^2/(4\pi\varepsilon_0) = 2.307\times10^{-28}\ \text{J\,m}$ and $G\,m_p^2 = 1.867\times10^{-64}\ \text{J\,m}$. The ratio of the electric to the gravitational force is $10^{x}$. What is $x$, to the nearest whole number?
    answer: 36
    tolerance: 0.5
    answerText: '36'
    wrong:
      - { value: 92, feedback: 'You multiplied the powers (or added them with the wrong sign). Dividing $10^{-28}$ by $10^{-64}$ gives $10^{-28-(-64)} = 10^{36}$.' }
      - { value: -36, feedback: 'That is the inverse ratio (gravity over electricity, about $8\times10^{-37}$). The question asks for electric over gravitational.' }
    hint: 'Divide the numbers, and subtract the exponents: $2.307/1.867 \approx 1.24$.'
    explanation: |
      $\dfrac{2.307\times10^{-28}}{1.867\times10^{-64}} = 1.24\times10^{36}$, so $x = 36$. Gravity between two protons is a trillion trillion trillion times weaker than their electric force. Gravity only wins in large bodies because charges cancel while masses add.

  - type: mcq
    id: gravity-disputed
    title: "How much of the range of gravity works?"
    prompt: |
      Fred Adams (2008) mapped which values of the gravitational constant, the fine-structure constant and a nuclear-reaction parameter allow stars to sustain fusion. He found that roughly a quarter of the region he explored (spanning many powers of ten) supports stars. Barnes replied that this fraction is nearly meaningless as a measure of tuning. What is the most reasonable reading?
    options:
      - text: 'Adams shows stars are possible over a wide range in the sense of powers of ten; Barnes notes that on a linear scale the allowed region may be a tiny fraction, so "how much" depends on the measure chosen.'
        correct: true
      - text: 'Adams proves the universe is not fine-tuned and Barnes admits it.'
        feedback: |
          Neither claim is made. Adams shows stars are not rare in his map; Barnes does not accept that the fraction measures tuning. Adams's later 2019 review reaches the same cautious point: viable universes exist over a range, not a proof either way.
      - text: 'Both authors agree gravity is fine-tuned to one part in $10^{36}$.'
        feedback: |
          The number $10^{36}$ is the *ratio of the two forces*, not a tolerance. Why the ratio is so large is a separate question from how far it could shift before stars fail.
    explanation: |
      This is the **measure problem**, in miniature. The same allowed region can be called "a quarter of the space" (if you weigh each power of ten equally) or "a tiny sliver" (if you weigh the numbers evenly on a linear scale). Neither is obviously right. The lesson comes back to this.

  - type: mcq
    id: trap-ratio
    title: "Trap: the big number is the tuning"
    prompt: |
      A student reads that gravity is $10^{36}$ times weaker than electromagnetism and concludes: "so if gravity were changed by one part in $10^{36}$, stars would fail". What is wrong?
    options:
      - text: 'The number $10^{36}$ is how large the ratio is, not how far it can move. How far it can move before stars fail is a separate calculation, and it is much more generous than one part in $10^{36}$.'
        correct: true
      - text: 'Nothing is wrong: a ratio of $10^{36}$ means a tolerance of $10^{-36}$.'
        feedback: |
          A ratio and a tolerance are different things. The tolerance is the fractional change allowed before the physics breaks, and in the work cited above it spans many powers of ten for this constant.
      - text: 'Gravity cannot be compared with electromagnetism at all.'
        feedback: |
          It can: for two protons the comparison is a clean, distance-independent number. The mistake is in what the number is taken to mean.
    explanation: |
      Keep two questions apart: *why is a constant so small or so large* (a puzzle about size) and *how much room is there around it* (a sensitivity, about allowed change). Fine-tuning claims are about the second.

  - type: text
    id: carbon-intro
    title: "Carbon needs a coincidence"
    body: |
      Helium burns into carbon in stars through the **triple-alpha process**, where an $\alpha$ particle is a helium-4 nucleus. Two $\alpha$ particles first make beryllium-8, which has a half-life of only about $8\times10^{-17}\ \text{s}$ and usually falls apart again. A third $\alpha$ must hit it in that instant. The fusion is fast enough only because carbon-12 has an **excited state** (a higher energy level of the nucleus) at about $7.65\ \text{MeV}$ that matches the energy available. Fred Hoyle predicted such a level in 1953-54 from the observed amount of carbon, and Fowler's laboratory found it a few months later. It is called the **Hoyle state**.

  - type: order
    id: triple-alpha
    title: "Order the steps"
    prompt: Put the steps of carbon production in stars in order.
    steps:
      - 'Hydrogen burning leaves a helium core, which heats until helium-4 nuclei collide.'
      - 'Two helium-4 nuclei fuse into beryllium-8, which usually falls apart again almost at once.'
      - 'Before it does, a third helium-4 nucleus hits it and forms carbon-12 in its excited Hoyle state.'
      - 'The excited carbon-12 nearly always splits back into three helium nuclei; about once in 2400 times it drops to the stable ground state, making carbon.'
    hint: 'Build the nucleus one helium at a time, then ask which step is the rare one.'
    explanation: |
      The chain depends on a near-match between two energies: the energy of beryllium-8 plus a helium nucleus, and the energy of the Hoyle state. A small shift of either could close the door.

  - type: mcq
    id: carbon-numbers
    title: "How sensitive is carbon?"
    prompt: |
      According to Oberhummer, Csótó and Schlattl (*Science*, 2000), in their stellar models the production of carbon or oxygen drops by factors between 30 and 1000 outside a narrow window of the strong nuclear force. If the strong force were changed by $2\%$, would their model predict the same carbon and oxygen as today?
    options:
      - text: 'No: the window for the strong force is only about $0.5\%$, so a $2\%$ change falls outside it and carbon or oxygen production is cut sharply in their model.'
        correct: true
      - text: 'Yes: a $2\%$ change is too small to matter for nuclei.'
        feedback: |
          For this particular reaction, nuclear energy levels are sensitive to the strong force and a change of a fraction of a percent is already outside the window in their model.
      - text: 'It depends only on the electromagnetic force, window about $4\%$.'
        feedback: |
          The paper gives a separate window of about $4\%$ for the electromagnetic (Coulomb) force. Each force has its own window; a $2\%$ strong-force change is outside the strong-force one.
    explanation: |
      Treat this as **established with caveats**: the reaction depends on a finely placed energy level, and the sensitivity to the strong force is a fraction of a percent in this model. Barnes notes it is difficult to predict exactly when a major change becomes life-prohibiting, and that later stellar stages (Schlattl et al. on helium-shell flashes) seem to lessen the tuning.

  - type: mcq
    id: trap-carbon
    title: "Trap: the Hoyle state proves a designer"
    prompt: |
      Hoyle predicted the carbon energy level before it was measured. A reader says: "so physics itself shows the universe was designed." Which reply separates the layers best?
    options:
      - text: 'The prediction and the sensitivity are physics (established, with modeling caveats). Whether they point to a designer, to selection among many universes, or to nothing in need of explanation is a further question that physics alone does not settle.'
        correct: true
      - text: 'The Hoyle state is a myth and was never measured.'
        feedback: |
          It was measured, in Fowler's laboratory a few months after the prediction. The disagreement is about interpretation, not about the energy level.
      - text: 'Any prediction that works is, by definition, evidence of design.'
        feedback: |
          Successful predictions are normal in science and have many explanations. Whether this one favors a designer is a probability question the course takes up later.
    explanation: |
      Layer 1 (established): the energy level exists and a shift would reduce carbon in stellar models. Layer 2 (debate): how large the window really is. Layer 3 (metaphysical): what it means. Notice that the teaching rule is not to pick a side, but to place each statement in its layer.

  - type: text
    id: np-intro
    title: "Neutron and proton: a small difference with large effects"
    body: |
      A neutron is heavier than a proton by about $1.29\ \text{MeV}$ (the 2022 CODATA value is $1.29333\ \text{MeV}$). This is why a free neutron can decay into a proton, an electron and an antineutrino, and why that decay would not happen if the neutron were lighter. Craig Hogan (2000) argued that three parameters of the Standard Model, which look independent in grand unified theories, have values in a narrow window that allows stable nucleons and nuclei and abundant carbon.

      A popular simplification says the mass difference comes only from the difference between the down-quark and up-quark masses. Barnes replies that this is false, because electromagnetism also contributes, so the result is not just two measured masses compared with each other.

  - type: mcq
    id: np-criticism
    title: "Criticism and reply"
    prompt: |
      Stenger (*The Fallacy of Fine-Tuning*, 2011) argued that the neutron-proton mass difference simply follows from the difference between the down and up quark masses, so no separate tuning is involved. What is Barnes's reply, in essence?
    options:
      - text: 'The mass difference also has an electromagnetic contribution, so the quark-mass difference alone does not fix it; comparing two measured quark masses is not an analysis of how much room there is.'
        correct: true
      - text: 'The quark masses are not measured at all.'
        feedback: |
          They are estimated from experiments. The reply is about what the argument shows, not about whether the masses exist.
      - text: 'Barnes agrees with Stenger and drops the point.'
        feedback: |
          Barnes disputes the argument. The disagreement is a standing one in the literature, which is why this claim belongs to the live-debate layer.
    explanation: |
      Both critics and defenders appear in the technical literature. A fair summary: the neutron-proton difference matters for nuclei and for hydrogen, but how finely it is tuned depends on several linked parameters, not on one.

  - type: text
    id: higgs-intro
    title: "The Higgs scale and the hierarchy"
    body: |
      The Higgs field has a measured value $v \approx 246\ \text{GeV}$ (it sets the masses of the quarks, electrons and the weak-force particles). Compared with the Planck mass $m_{\text{Pl}}$, the mass scale where quantum gravity should matter,

      $$\frac{v}{m_{\text{Pl}}} \approx 2\times10^{-17}$$

      The **hierarchy problem** asks why this ratio is so small. That is a puzzle about *theory*, like the cosmological constant gap. A separate question is how large a change of $v$ would stop atoms and nuclei from working. Agrawal, Barr, Donoghue and Seckel (1998) argued that only a narrow window of $v$ allows complex atoms. Damour and Donoghue narrowed it to $0.78\times10^{-17} < v/m_{\text{Pl}} < 3.3\times10^{-17}$, according to Barnes's review. Jeltema and Sher found that a $1\%$ change in $v$ would significantly affect the synthesis of oxygen and carbon.

  - type: numeric
    id: higgs-window
    title: "How far can v move?"
    prompt: |
      Take the observed value $v/m_{\text{Pl}} = 2.0\times10^{-17}$ and the window $0.78\times10^{-17} < v/m_{\text{Pl}} < 3.3\times10^{-17}$ (Damour and Donoghue). By what factor could $v/m_{\text{Pl}}$ be *multiplied* upward before leaving the window?
    answer: 1.65
    tolerance: 0.03
    answerText: '1.65'
    wrong:
      - { value: 0.65, feedback: 'That is the *fractional increase* ($65\%$), not the factor. The question asks for the multiplying factor, $3.3/2.0$.' }
      - { value: 3.3, feedback: 'That is the upper edge in units of $10^{-17}$, not a factor relative to the observed value.' }
    hint: 'Divide the upper edge by the observed value.'
    explanation: |
      $3.3/2.0 = 1.65$. Downward the factor is $0.78/2.0 = 0.39$. So in this estimate the window is "within a factor of a few" of the observed value. Jeltema and Sher's $1\%$ is far tighter: different criteria for "life-permitting" give different sensitivities, which is why sensitivity is quoted with its criterion, never alone.

  - type: mcq
    id: sensitivity-sort
    title: "Which claims are well established?"
    multiple: true
    prompt: |
      According to the reviews cited in this lesson, which of these statements are on solid ground (established, though some with modeling caveats)? Select all that apply.
    options:
      - text: 'Gravity between two protons is about $10^{36}$ times weaker than their electric force.'
        correct: true
      - text: 'The quantum-field estimate of the vacuum energy is vastly larger than the observed dark-energy density (the exact power depends on the cutoff).'
        correct: true
      - text: 'In stellar models, carbon or oxygen production drops sharply for changes of the strong force of more than about a half percent.'
        correct: true
      - text: 'The fraction of all possible universes that allow life is known to be about $10^{-120}$.'
        feedback: |
          That number is the gap between a calculation and a measurement, not a probability of life, and no accepted measure over "all possible universes" exists.
      - text: 'The existence of tuning proves a designer.'
        feedback: |
          This is a layer-3 claim. The numbers can be accepted by a theist, an atheist or an agnostic; what they mean is argued, not measured.
    explanation: |
      The first three are numbers or model results that physicists on all sides cite. The last two are the typical slips: turning a ratio into a probability, and moving from a number to a metaphysical conclusion without saying so.

  - type: mcq
    id: one-at-a-time
    title: "One constant at a time"
    prompt: |
      A common objection (made by Stenger and others) says that fine-tuning claims change one constant while holding the others fixed, so they miss universes where several change together and compensate. What did Barnes reply?
    options:
      - text: 'Varying one parameter at a time actually tends to overestimate the allowed fraction of the full multi-parameter region, and multi-parameter studies (Barr and Khan 2007; Tegmark and colleagues 2006) exist; but he does not claim every combination was explored.'
        correct: true
      - text: 'Multi-parameter changes are impossible to compute, so the objection is empty.'
        feedback: |
          They have been computed in some cases (for example, Tegmark and colleagues varied seven parameters against eight constraints). The reply is more specific than "impossible".
      - text: 'The objection is correct and no tuning remains.'
        feedback: |
          Adams's 2019 review does conclude that viable universes exist over a range of parameters, but that is a finding for some constants and criteria, not a withdrawal of every sensitivity quoted above.
    explanation: |
      This is a **live debate**: both sides cite calculations. Adams (2019) finds viable universes over wide ranges for several cases and notes that very different universes could use new energy sources; Barnes insists that the natural measure over parameters is unsettled. The honest summary is that the answer depends on which constants, which criterion for "life", and which measure.

  - type: numeric
    id: measure
    title: "The same window, two measures"
    prompt: |
      A constant could in principle take any value from $10^{-10}$ to $1$ (ten powers of ten). Suppose it allows life only between $10^{-5}$ and $10^{-4}$. What percentage of the ten powers of ten does the allowed window occupy, if every power of ten counts equally?
    answer: 10
    tolerance: 0.5
    answerText: '10'
    wrong:
      - { value: 0.009, feedback: 'That is the share on a *linear* scale: the window is $9\times10^{-5}$ wide out of a range of about $1$, i.e. about $0.009\%$. The question asks for the share when each power of ten counts equally.' }
      - { value: 90, feedback: 'The window spans one decade out of ten, not nine out of ten. A power of ten from $10^{-5}$ to $10^{-4}$ is one decade.' }
    hint: 'Count decades: from $10^{-5}$ to $10^{-4}$ is one decade, out of ten.'
    explanation: |
      On the log scale the window is $1/10 = 10\%$ of the range; on a linear scale it is about $0.009\%$. The same physics, two verdicts. Which scale is the "right" one is exactly what the measure problem asks, and it has no agreed answer. The later lesson on the probability reasoning shows why the choice matters for the fine-tuning argument.

  - type: mcq
    id: trap-all
    title: "Trap: all constants are equally tuned"
    prompt: |
      A pamphlet says "every constant of nature is tuned to one part in $10^{100}$". How should a careful reader respond?
    options:
      - text: 'Ask which constant, by what criterion, and over which range: sensitivities in the reviews run from about a percent (carbon, strong force; Higgs, in one estimate) to many powers of ten, and some are disputed.'
        correct: true
      - text: 'Accept it: the reviews agree on one part in $10^{100}$ for all constants.'
        feedback: |
          No review says this. The numbers vary by constant and by method, and the authors themselves (Barnes, Adams) stress this.
      - text: 'Reject it: since one claim fails, all fine-tuning is false.'
        feedback: |
          Overcorrecting makes the opposite error. A sweeping claim can be wrong while particular sensitivities (the carbon window, for instance) remain standing in the literature.
    explanation: |
      The remedy for both exaggeration and dismissal is the same: ask for the constant, the criterion, the range, and the measure.

  - type: text
    id: summary
    body: |
      **Next:** *The Anthropic Principle and Selection Effects*. If the dials are sensitive, one reply is that we could only ever observe a universe whose dials allow observers. What can such a selection effect explain, and what can it not? We meet Weinberg's prediction for the cosmological constant there, and the probability reasoning behind the whole argument in the guided proof after it.
