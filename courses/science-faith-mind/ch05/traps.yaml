id: ch05-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: beginnings, nothing and fine-tuning"
    body: |
      Fast round. Each question hides a **tempting shortcut** about the big questions of origins: the Big Bang model, singularities and the singularity theorems, the physicists' and the philosophers' "nothing", contingency, the low entropy of the early universe, fine-tuning, the anthropic principle, the multiverse and the Bayesian form of the fine-tuning argument. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to decide whether the universe was designed, is one of many, or simply is. As always, answers are given *according to* someone, and where thoughtful people differ the feedback shows both sides.

  - type: mcq
    id: bang-explosion
    title: "Where did it go off?"
    prompt: |
      A student pictures the Big Bang as a bomb: "a lump of matter sat in empty space, blew up, and the galaxies are the fragments flying outward." According to the Big Bang model, what is wrong with this picture?
    options:
      - text: 'It puts the event at one place inside a pre-existing space. In the model, space itself was dense and hot at every place, and the distances between typical places have been growing since; there is no centre and no outside.'
        correct: true
      - text: 'Nothing is wrong; the galaxies really are fragments of a single blast, and we sit near its centre.'
        feedback: |
          The pattern of recession (speed proportional to distance) looks the same from every galaxy, so no galaxy, ours included, is a centre. A blast would also need empty space around it, which the model does not have.
      - text: 'The model says the universe began as a lump the size of a grapefruit.'
        feedback: |
          No size for the whole universe follows. The model says typical distances were smaller and the density higher; the universe may well be unbounded at all times.
      - text: 'The picture is fine, but the blast was much slower than a bomb.'
        feedback: |
          Speed is not the issue. The issue is the setting: an explosion happens at a place within space, while the Big Bang is a statement about how space (the distances between places) changes with time.
    explanation: |
      Early dense states are everywhere, not at one point. The film run backwards gives a state in which every place was crowded together, which is why there is nowhere in the sky to point at. The bomb picture is the most common error about the model.

  - type: mcq
    id: redshift-motion
    title: "Is a redshift a speed through space?"
    prompt: |
      A distant galaxy has redshift $z = 0.02$, so (for small $z$) $v \approx cz = 0.02 \times 3.0\times10^{5}\ \text{km/s} = 6000\ \text{km/s}$. A student says: "So that galaxy is rushing through space at 6000 km/s, like a car on a road." What is the fair correction?
    options:
      - text: 'The redshift is mostly due to the stretching of space itself, which lengthens the light waves on their way to us; the galaxy is carried along by the expansion and its own motion through space can be small. "v" is a convenient name for the recession rate $H_0 d$ in the model.'
        correct: true
      - text: 'The galaxy is at rest and the redshift is just dust reddening its light.'
        feedback: |
          Dust makes light look redder by absorbing blue light, but it does not shift sharp spectral lines to longer wavelengths. The shift of lines, together with the distance relation, is the evidence for expansion.
      - text: 'The correction is that $v = cz$ is exact for all redshifts.'
        feedback: |
          It is only an approximation for small $z$; for large redshifts the relation between $z$ and the stretch of space has to be done with the scale factor, and recession speeds can even exceed $c$ without breaking any rule about motion through space.
      - text: 'Light cannot be redshifted by anything; the redshift must be a measurement error.'
        feedback: |
          Redshifts are among the most precisely measured quantities in astronomy: spectral lines of known elements land at longer wavelengths than in the lab.
    explanation: |
      Two different things go by the word "speed": motion through space (a car) and growth of the distance between places (the expansion). A cosmological redshift mostly records the second. This is why the notion of a galaxy racing away from a centre misleads.

  - type: mcq
    id: singularity-object
    title: "Is a singularity a thing?"
    prompt: |
      A model of the early universe gives a density that grows without limit as the scale factor $a \to 0$. A student concludes: "So at the start there was a real object of infinite density." What is the most careful reading?
    options:
      - text: 'A singularity is a place where the equations give an infinite value or stop giving any answer. It marks the failure of the description there, probably where new physics (quantum gravity) is needed, not a measured object.'
        correct: true
      - text: 'It is a physical object that has been observed by telescopes at the edge of the universe.'
        feedback: |
          Nothing of the kind has been observed. The earliest light we see comes from about 380,000 years after the start of the hot, dense state, and the model is extrapolated from there.
      - text: 'It proves that the laws of physics were broken at the start.'
        feedback: |
          Too fast. It shows that our equations cannot be trusted there, which is different from nature breaking its laws. Whether there is a deeper law that still holds is open.
      - text: 'An infinite density is harmless, because every physical quantity can be infinite.'
        feedback: |
          Physicists treat an infinite value in a theory as a warning that the theory is being pushed beyond its range, in the way a formula with $1/0$ signals a broken assumption.
    explanation: |
      Compare: a model of a water drop that gives infinite pressure when the drop radius goes to zero does not mean there is an infinitely pressed drop; it means the model has left its range (molecules are not in it). The word "singularity" names the edge of a description.

  - type: mcq
    id: theorems-nothing
    title: "Do the theorems prove a beginning?"
    prompt: |
      A writer says: "The Penrose-Hawking singularity theorems and the Borde-Guth-Vilenkin theorem prove that the universe came into being from nothing." Select the reply that points at what the theorems actually say.
    options:
      - text: 'They have the form "if these assumptions hold, then some paths cannot be extended": a conclusion about geodesic incompleteness in classical general relativity (the Borde-Guth-Vilenkin one requires the expansion rate to be positive on average). They do not include quantum gravity, and they say nothing about "nothing".'
        correct: true
      - text: 'They prove nothing at all, since any theorem about the universe is only a guess.'
        feedback: |
          They are genuine theorems: if the assumptions hold, the conclusion follows. The question is whether the assumptions hold for the real universe, and that is the live debate.
      - text: 'They prove the opposite: that the universe is infinitely old.'
        feedback: |
          They claim neither. A theorem that some paths are incomplete under certain conditions does not show a first moment or an eternal past.
      - text: 'They prove a beginning, but only for the Milky Way.'
        feedback: |
          The theorems are about spacetime in general models, not about the history of one galaxy.
    explanation: |
      Always ask for the premises. Penrose-Hawking needs energy conditions and classical gravity; Borde-Guth-Vilenkin needs an expansion that is positive on average, so it does not cover a past that was not expanding on average. Whether a beginning follows depends on whether these premises hold, and a full quantum theory might escape them.

  - type: mcq
    id: nothing-vacuum
    title: "Is the vacuum nothing?"
    prompt: |
      A physicist says: "A universe can arise from a quantum vacuum, so physics explains why there is something rather than nothing." A philosopher replies: "A vacuum with fields and laws is already something." Which statement about the disagreement is fair?
    options:
      - text: 'The quantum vacuum has fields, laws and a lowest (zero-point) energy with measurable effects (the Casimir force between plates), so it is not the absence of everything. Whether the physicist has answered the question depends on whether the question asks where a universe comes from or why there are fields and laws at all.'
        correct: true
      - text: 'There is no disagreement; the physicist and the philosopher mean the same by "nothing".'
        feedback: |
          They do not: the physicist means a state with no particles but with fields and laws, the philosopher means no fields, no laws, no space.
      - text: 'The vacuum is empty because it has no particles, so the physicist is right and the philosopher is just confused.'
        feedback: |
          "No particles" is not "no energy": the vacuum has measurable zero-point effects. The philosopher is making a precise point about what the explanation presupposes.
      - text: 'The Casimir force shows that the universe can create itself from nothing.'
        feedback: |
          The Casimir force is a measured attraction between plates in a vacuum that already has fields and laws. It shows that the vacuum is physical; it says nothing about a universe appearing from absolute nothing.
    explanation: |
      Neither reading is a result of an experiment. Krauss reads the question as one that physics can answer; Albert replies that the answer takes the laws and fields for granted. The trap is to treat two meanings of "nothing" as one.

  - type: mcq
    id: contingent-unlikely
    title: "Contingent does not mean improbable"
    prompt: |
      In the argument from contingency, a fact is **contingent** if it could have failed to be the case. A student says: "So a contingent fact is one that is unlikely." Which reply is correct?
    options:
      - text: 'Contingency is about possibility, not probability. That the Sun rises tomorrow is as good as certain and yet contingent (it could have failed); a necessary truth (every prime above 2 is odd) cannot fail, whatever any probability says.'
        correct: true
      - text: 'Yes, contingent facts are exactly the improbable ones, and necessary facts are the probable ones.'
        feedback: |
          Probability and modality are different scales. Near-certain contingent facts and, in principle, wildly improbable ones both exist; necessity means "cannot fail", not "very probable".
      - text: 'A contingent fact is one we cannot know.'
        feedback: |
          That is about knowledge. A fact can be contingent and perfectly well known (you are reading this).
      - text: 'A contingent fact is one that has no cause.'
        feedback: |
          Most contingent facts have causes; the argument from contingency asks whether the whole collection of them needs an explanation.
    explanation: |
      The argument asks for an explanation of contingent facts because they could have failed, not because they are rare. Where critics push back (a brute fact, a necessary being, an endless regress) is a separate question; keep "could have failed" apart from "unlikely".

  - type: numeric
    id: entropy-coins
    title: "Ordered is not impossible"
    prompt: |
      A student reads "the early universe had very low entropy" and says: "So disorder was impossible then." Take a toy case: $20$ fair coins are tossed. The ordered macrostate "all heads" is **one** of the $2^{20}$ equally likely sequences. It is rare, not forbidden. Its chance is "1 in" how many?
    answer: 1048576
    tolerance: 1
    answerText: '1048576 ($2^{20}$)'
    wrong:
      - { value: 20, feedback: "That is the number of coins. Each coin doubles the number of sequences, so the count is a power of two, $2^{20}$." }
      - { value: 40, feedback: "That adds $2$ per coin. Each coin multiplies the number of sequences by $2$; it does not add $2$." }
    hint: "Each of the $20$ coins has $2$ outcomes; multiply."
    explanation: |
      Low entropy means few microstates fit the description, not that the state is impossible: here $1$ out of $1\,048\,576$. Penrose's famous "$1$ part in $10^{10^{123}}$" is the same kind of count applied to the early universe, but it is an *order-of-magnitude estimate from a debated measure over phase space*, not a measured probability: it equals about $3.3\times10^{123}$ coin tosses' worth of "all heads". Whether the number needs explaining (the Past Hypothesis, a new law, a multiverse, or nothing) is debated.

  - type: mcq
    id: ratio-tolerance
    title: "A big ratio is not a narrow tolerance"
    prompt: |
      The Sun's mass is about $10^{57}$ times the mass of a proton. A student says: "So the Sun's mass must be right to one part in $10^{57}$, or it would not shine." What is wrong?
    options:
      - text: 'The number $10^{57}$ is a ratio (how large one quantity is compared with another). A tolerance is how far a quantity can change before the physics breaks, and it has to be computed separately; stars of very different masses shine.'
        correct: true
      - text: 'Nothing: a ratio of $10^{57}$ means a tolerance of $10^{-57}$.'
        feedback: |
          A ratio and a tolerance are different quantities. Stars with masses from about one-tenth to over a hundred times the Sun's burn happily, so the tolerance is very generous compared with $10^{-57}$.
      - text: 'The Sun cannot be compared with a proton.'
        feedback: |
          It can: both have masses. The mistake is what the ratio is taken to mean, not the comparison.
      - text: 'The Sun shines because of its large mass alone.'
        feedback: |
          Shining depends on the core temperature and nuclear reaction rates, which involve the constants of the nuclear forces, not only on the total mass.
    explanation: |
      The same slip appears with fundamental constants: gravity between two protons is about $10^{36}$ times weaker than their electric force, but that number is a size, not a measure of how far gravity could change before stars failed. Tolerances come from models of stars and nuclei.

  - type: mcq
    id: tuning-which
    title: "Fine-tuning for whom, over what?"
    multiple: true
    prompt: |
      A pamphlet says "the constants of nature are finely tuned". A careful reader asks for the claim to be made precise. Select every item such a claim must specify before its narrowness means anything.
    options:
      - text: 'Which constant (or which combination) is meant.'
        correct: true
      - text: 'The criterion: tuned for what (stars, carbon, chemistry, observers)?'
        correct: true
      - text: 'The range over which the constant is allowed to vary, and how that range is weighed (the measure).'
        correct: true
      - text: 'Whether the author believes in a designer.'
        feedback: |
          The numbers can be accepted by a theist, an atheist or an agnostic. What the author believes is not part of the physical claim.
      - text: 'Nothing: "finely tuned" is a precise term on its own.'
        feedback: |
          Sensitivities in the reviews run from about a percent (the carbon window for the strong force) to many powers of ten, and some are disputed. A claim without constant, criterion and range is not yet a claim.
    explanation: |
      Neither "all constants are tuned to one part in $10^{100}$" nor "fine-tuning is a myth" survives this checklist. Some sensitivities are on solid ground; their narrowness as a *probability* depends on the range and the measure.

  - type: mcq
    id: anthropic-why-others
    title: "Does the anthropic principle say why other values exist?"
    prompt: |
      A student says: "The anthropic principle explains why there are many different universes with different constants." What does the selection argument actually need and give?
    options:
      - text: 'It explains why we *observe* values that allow observers, assuming values do vary. The spread of values has to come from somewhere else (a mechanism such as a landscape of vacua with eternal inflation, if true), together with a rule for how likely each is.'
        correct: true
      - text: 'It is a mechanism that produces new universes.'
        feedback: |
          The principle is a statement about what observers can find, not a process that makes anything. Without a spread of values, selection has nothing to select among.
      - text: 'It shows that values are the same everywhere.'
        feedback: |
          It says nothing like that. If there were only one value, the principle would add no explanation beyond "it is what it is".
      - text: 'It proves that the universe was made for observers.'
        feedback: |
          That reading is the strong or purposive version, which is a layer-3 commitment. Carter-style selection only says observers find conditions that allow observers.
    explanation: |
      The explanation has two parts: a spread of values (a theory) and a selection effect (a logical fact). The second is not enough without the first, which is why the anthropic principle is not an independent explanation of fine-tuning.

  - type: numeric
    id: survivors
    title: "What the survivors show"
    prompt: |
      A repair crew studies planes that returned from missions. In a test, $300$ planes were hit once in the engine and $300$ planes once in the fuselage (equal numbers of hits). Of the engine hits, $10\%$ returned; of the fuselage hits, $80\%$ returned. Among all the **returned** planes, what percentage show an engine hit?
    answer: 11.1
    tolerance: 0.3
    answerText: '11.1 (30 of 270)'
    wrong:
      - { value: 50, feedback: "That is the share among *all* hits. The question asks only about the planes that returned, and engine hits rarely come back." }
      - { value: 10, feedback: "That is the fraction of engine-hit planes that return, not the share of engine hits among all returners. The share needs $30$ divided by the total returners." }
    hint: "Returners: engine $0.10 \\times 300$, fuselage $0.80 \\times 300$. Divide the engine count by the total."
    explanation: |
      $30$ engine and $240$ fuselage planes return, so engine hits make up $30/270 \approx 11.1\%$ of the returners although they were $50\%$ of the hits. The sample you can see is filtered by survival. Selection effects change what is observed; they do not by themselves show *why* the world is as it is, so they prove neither design nor a multiverse: such a conclusion needs a premise about the underlying spread and its probabilities.

  - type: mcq
    id: inflation-proves
    title: "Does inflation prove a multiverse?"
    prompt: |
      A headline says: "Inflation theory proves there are many universes." What is the fair statement of the position?
    options:
      - text: 'Inflation (a proposed very fast stretching of space in the early universe) is supported by observations of the early universe; the version called eternal inflation, in which inflation ends in some places and goes on in others, is a theoretical consequence of certain models. No other region has been observed, and the rule for how likely each region is remains an open problem.'
        correct: true
      - text: 'It has been confirmed: telescopes have photographed other bubble universes.'
        feedback: |
          No other bubble has been observed. Eternal inflation is a prediction of certain models, not a measurement.
      - text: 'Inflation contradicts every multiverse idea.'
        feedback: |
          Not so: in some models inflation never ends everywhere, which is the root of the multiverse proposal.
      - text: 'Inflation is only a story with no evidence behind it.'
        feedback: |
          Too fast. The simple inflationary picture was designed to solve the horizon and flatness problems and has been confronted with measurements of the early universe; the contested part is the extension to eternal inflation and to other regions.
    explanation: |
      Separate three claims: that inflation happened (supported but still discussed), that in some models it is eternal (a consequence of those models), and that other regions exist with different constants (not observed, and tied to further assumptions such as a landscape). Each step adds assumptions.

  - type: mcq
    id: multiverse-measure
    title: "Many universes, but how many of which kind?"
    prompt: |
      A toy multiverse has bubbles of types A and B in the count $3 : 1$ (three A for each B). Each A bubble has volume $1$ and each B bubble volume $5$. A student says: "A is $75\%$ of the bubbles, so a random observer is in an A bubble with probability $75\%$; no more rules needed." What is wrong?
    options:
      - text: 'It depends on what is counted. Counting bubbles gives $3/4 = 75\%$ for A, but counting volume gives $3\cdot1/(3\cdot1+1\cdot5) = 3/8 = 37.5\%$. An endless real ensemble needs a rule (a measure) for what is counted; different reasonable rules give different answers.'
        correct: true
      - text: 'Nothing: counting bubbles is the only natural rule.'
        feedback: |
          Counting volumes, or observers, or proper time is equally natural, and the answers differ ($75\%$ against $37.5\%$ here).
      - text: 'The answer is $50\%$ because there are two types.'
        feedback: |
          That treats the two types as equally likely, which is itself a rule (and ignores the $3:1$ count).
      - text: 'The multiverse has no types, so the question is empty.'
        feedback: |
          In the toy, the types are given; the point of the toy is that the answer depends on the counting rule.
    explanation: |
      This is the **measure problem** of eternal inflation: when a universe-generating process never stops, the number of regions of each kind is infinite and cut-offs and weights must be chosen. The measure plays the role of the prior $P(x)$ in the selection formula $P_{\text{obs}}(x) \propto P(x)F(x)$.

  - type: build
    id: odds-form
    title: "Likelihood ratio is not the answer"
    prompt: |
      Let $E$ be the evidence, $H_1$ chance and $H_2$ design. A student says: "$E$ is $3$ times as likely under design as under chance, so design is $3$ times as likely." Build the correct rule for the **posterior odds** of $H_2$ against $H_1$.
    prefix: '\frac{P(H_2\mid E)}{P(H_1\mid E)} ='
    tiles: ['\frac{P(H_2)}{P(H_1)}', '\times', '\frac{P(E\mid H_2)}{P(E\mid H_1)}', '+', '\frac{P(E\mid H_1)}{P(E\mid H_2)}']
    answers:
      - ['\frac{P(H_2)}{P(H_1)}', '\times', '\frac{P(E\mid H_2)}{P(E\mid H_1)}']
      - ['\frac{P(E\mid H_2)}{P(E\mid H_1)}', '\times', '\frac{P(H_2)}{P(H_1)}']
    wrong:
      - answer: ['\frac{P(E\mid H_2)}{P(E\mid H_1)}']
        feedback: |
          This drops the prior odds. The likelihood ratio says how much the evidence shifts the odds, not where they end. A shift by a factor of $3$ from prior odds of $1:100$ still leaves design far behind.
      - answer: ['\frac{P(H_2)}{P(H_1)}', '+', '\frac{P(E\mid H_2)}{P(E\mid H_1)}']
        feedback: |
          Odds combine by multiplication, not addition: each independent factor scales the odds.
      - answer: ['\frac{P(H_2)}{P(H_1)}', '\times', '\frac{P(E\mid H_1)}{P(E\mid H_2)}']
        feedback: |
          The ratio is upside down: evidence that is more likely under $H_2$ should push the odds toward $H_2$, so $P(E\mid H_2)$ goes on top.
    hint: 'Posterior odds = prior odds, scaled by how much better $H_2$ predicts $E$.'
    explanation: |
      This is Bayes' rule in odds form. The likelihood ratio is only one factor; the other is the prior odds, which come from what else we think and are exactly where thoughtful people differ. The next card puts numbers on it.

  - type: numeric
    id: odds-number
    title: "Putting numbers in"
    prompt: |
      Take $P(E\mid H_1) = 0.02$ (chance), $P(E\mid H_2) = 0.06$ (design) and prior odds of $H_2$ against $H_1$ of $1:9$. Only these two hypotheses are considered. What is the posterior **probability** of $H_2$, in percent?
    answer: 25
    tolerance: 0.5
    answerText: '25'
    wrong:
      - { value: 75, feedback: "That is the posterior probability of $H_1$ (odds $3:1$ would give $75\\%$ for the one that is *favoured*, but here the ratio $3$ multiplies the prior $1:9$, giving $3:9$). Check which side is $H_2$." }
      - { value: 300, feedback: "That is the likelihood ratio as a percentage. The ratio multiplies the prior odds, and the result must still be turned into a probability." }
    hint: "Posterior odds $= \\tfrac19 \\times \\tfrac{0.06}{0.02}$; then probability $=$ odds/(1 + odds)."
    explanation: |
      Posterior odds $= \tfrac19 \times 3 = \tfrac13$, that is $1:3$, so $P(H_2\mid E) = 1/(1+3) = 25\%$. Design became $3$ times as likely as before relative to chance, yet still less likely than chance. A likelihood ratio can favour a hypothesis without making it more probable than its rival.

  - type: mcq
    id: inverse-gambler
    title: "Seeing it works, so there are many?"
    prompt: |
      Our universe permits life. A student argues: "A life-permitting window is narrow, so the dial must have been tried many times: there are many universes." Which statement fairly reports the debate (Hacking, White, Leslie)?
    options:
      - text: 'It depends on what the evidence is taken to be. If it is "*this* universe is life-permitting", it gives no support to a multiverse (the inverse gambler''s fallacy: the chance that the roll you see is a double six does not depend on how many rolls came before). If it is "*some* life-permitting universe exists", many universes do make that more likely (Leslie''s reply). The choice is debated.'
        correct: true
      - text: 'A narrow window always supports many universes, so there is no debate.'
        feedback: |
          That is Leslie''s side stated as if settled. White and Hacking show a reading under which the evidence is only about the one universe we see, and then it does not favour many.
      - text: 'A narrow window always refutes many universes.'
        feedback: |
          Neither side claims this. At most the fallacy shows that one argument fails, not that many universes are excluded.
      - text: 'The argument is about dice only and has nothing to do with cosmology.'
        feedback: |
          The dice are Hacking''s analogy for exactly this inference about universes.
    explanation: |
      The issue is the *exact* evidence. A lone observer who sees one roll learns nothing about earlier rolls, but a person who learns only that a double six occurred somewhere in a long run does learn something about the length of the run. Which of the two descriptions matches our situation is a philosophical choice.

  - type: numeric
    id: flat-prior
    title: "Flat over an unbounded range"
    prompt: |
      A dial may take any value, and a student says: "Take every value as equally likely: a flat prior is harmless." Over the range from $0$ to $L$, a flat prior gives a window of width $3$ the probability $3/L$. For $L = 3\times10^{6}$, what is that probability, in **percent**?
    answer: 0.0001
    tolerance: 0.00002
    answerText: '0.0001 (that is $10^{-4}\%$)'
    wrong:
      - { value: 1, feedback: "That would be $L = 300$. With $L = 3\\times10^6$ the chance is $10^{-6}$ as a fraction, which is $10^{-4}$ percent." }
      - { value: 0.000001, feedback: "That is the probability as a fraction ($10^{-6}$). The question asks for percent: multiply by $100$." }
    hint: "$3/(3\\times10^6) = 10^{-6}$; times $100$ for percent."
    explanation: |
      The answer shrinks in proportion to $L$: any window becomes as improbable as you like by enlarging the range, and on an unbounded range a flat prior cannot even be normalised (equal weights over infinitely many values cannot sum to $1$). So the "tiny chance" produced this way is a product of the range chosen, not a discovery. Measure choices (flat in the value or flat in its logarithm, for example) change the answer by orders of magnitude; this is the normalisation problem for the fine-tuning argument.

  - type: mcq
    id: only-two
    title: "Chance or design: the only options?"
    multiple: true
    prompt: |
      A debater says: "Either the life-permitting values are a lucky accident, or they were chosen: there is no third option." Select every position below that is **neither** plain chance **nor** design.
    options:
      - text: 'Many regions with different values plus a selection effect (observers can only be where the values allow them).'
        correct: true
      - text: 'A deeper law or necessity that fixes the values, so that the window is not a coincidence at all.'
        correct: true
      - text: 'The question presupposes a probability over "all possible values" that has no agreed measure, so the narrowness may not call for any explanation.'
        correct: true
      - text: 'Pure luck: one dial value, no deeper reason.'
        feedback: |
          This is the chance option itself.
      - text: 'A designer chose the values.'
        feedback: |
          This is the design option itself.
    explanation: |
      The three correct answers are the multiverse-with-selection reply, the new-law reply and the deflationary reply (brute fact, or a question without a well-defined probability). Each has its own cost: a mechanism and a measure, a law that is itself unexplained, and the loss of a natural question. A fair verdict on any of them has to say which premise is carrying the weight.

  - type: mcq
    id: layers
    title: "Three layers for the level"
    multiple: true
    prompt: |
      Select every statement that is placed in the **right layer** (established fact, scholarly debate, or faith/metaphysical commitment).
    options:
      - text: 'Established: galaxies recede with speed proportional to distance, and the early universe was hot and dense (the cosmic microwave background and light elements support this).'
        correct: true
      - text: 'Live debate: whether the singularity theorems describe a real beginning, and how wide the fine-tuning windows are under which measure.'
        correct: true
      - text: 'Commitment: that the universe exists because of a designer, or that it just is a brute fact.'
        correct: true
      - text: 'Established: that the universe came from absolute nothing.'
        feedback: |
          Nothing in the data shows this; even the model that extrapolates back stops at a point where physics is unknown.
      - text: 'Established: that fine-tuning proves design.'
        feedback: |
          Physics establishes the dependence on constants, not the meaning of the narrowness. The step to design is a commitment (and the step to "no explanation needed" is one too).
    explanation: |
      Keep the layers apart in both directions: do not call a commitment a result (for a designer or against), and do not treat well-measured facts as if they were speculation.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Nineteen traps, one pattern: each turned a *useful* idea into a shortcut.

      - **The Big Bang** is not an explosion at a point in space: the early state was dense everywhere; a redshift records mostly the stretching of space, not a speed through it ($z = 0.02 \Rightarrow v \approx cz = 6000$ km/s as a recession rate).
      - **A singularity** is a place where the equations break, not an observed object; the **singularity theorems** say "if these assumptions hold, some paths are incomplete" (classical; Borde-Guth-Vilenkin needs a positive average expansion rate), not "a beginning from nothing".
      - **"Nothing"**: the quantum vacuum has fields, laws and measurable energy (the Casimir force), unlike the philosophers' nothing. **Contingent** means "could have failed", not "unlikely".
      - **Low entropy** means few microstates, not impossibility ($1$ in $2^{20}$ for twenty heads); Penrose's $1$ in $10^{10^{123}}$ is an estimate from a debated measure.
      - **Fine-tuning**: a ratio ($10^{57}$, $10^{36}$) is not a tolerance; a claim needs the constant, the criterion, the range and the measure. A flat prior over $L$ gives $3/L$, which shrinks as the range grows.
      - **Selection** explains what we *observe* given a spread of values, not why the spread exists; survivors ($30$ of $270$) show filtering, not design or a multiverse. **Eternal inflation** is a model consequence, unobserved; counting bubbles ($75\%$) and volume ($37.5\%$) differ, hence the measure problem.
      - **Bayes**: posterior odds $=$ prior odds $\times$ likelihood ratio, never the ratio alone ($\tfrac19 \times 3 = \tfrac13$, i.e. $25\%$). Seeing *this* universe works does not prove many (inverse gambler), and chance versus design are not the only options.

      **Next:** *Quick Recall*, the main formulas and distinctions of Level 5 at a glance.
