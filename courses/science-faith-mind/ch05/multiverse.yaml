id: ch05-multiverse
title: "The Multiverse and the Measure Problem"
kind: concept
own: |
  - **Setting.** A *multiverse* is a hypothetical collection of regions or universes with possibly different values of the dials of physics (constants such as the vacuum energy density $\rho_\Lambda$). The selection argument for these dials says that, with $P(x)$ the prior probability of a dial value $x$ and $F(x)$ the weight of observers it allows, what observers find follows
  {{ $$P_{\text{obs}}(x) \propto P(x)\,F(x)$$ }}
  It needs a spread of values that really occur and a rule that fixes $P(x)$. Two proposed sources of the spread are *eternal inflation* (inflation ends in some places and goes on elsewhere, leaving bubble universes) and the *string landscape* (a very large number of possible vacua, stable low-energy states of the theory, estimates as large as $10^{500}$ being rough and contested). Both are layer 2 hypotheses: no other bubble has been observed.
  - **Counting is not defined by itself.** Take bubbles of type A and type B with $n_A$ and $n_B$ counted so far, and volumes $v_A$ and $v_B$. The fraction of type A depends on the rule:
  {{ $$f_A^{\text{count}}=\frac{n_A}{n_A+n_B}$$ }}
  and, weighting each bubble by its volume,
  {{ $$f_A^{\text{volume}}=\frac{n_A v_A}{n_A v_A+n_B v_B}$$ }}
  With $4$ A for each B and volumes $v_A=1$, $v_B=8$, the first gives $80\%$ and the second $\tfrac{4}{4+8}=\tfrac13$. With infinitely many bubbles, even the order of counting matters: listing the same endless A's and B's as AAB AAB ... gives $\tfrac23$ for A, as ABB ABB ... gives $\tfrac13$.
  - **The measure problem.** A *measure* is a rule that cuts off the infinite ensemble and weights what is inside. Examples: a *proper-time cut-off* (compare regions up to the same elapsed time), a *scale-factor cut-off* (compare up to the same amount of expansion), a *causal patch* (count only what one observer could ever see, Bousso 2006). They give different probabilities, and the choice of $P(x)$ in the formula above rests on {{ one of these choices of measure }}.
  - **Boltzmann brains.** In a universe that lasts forever, rare thermal fluctuations can make a lone observer with false memories. If a measure says such observers {{ outnumber ordinary ones }}, then that measure predicts we are probably a fluctuation, which we reject; so the Boltzmann-brain test is a way to check a measure.
  - **Status.** The existence of other universes is layer 2 (live debate, untested). Critics (Ellis and Silk; Smolin) ask whether a theory that cannot be tested from inside can be science; defenders (Carroll) answer that it is judged like any theory, by what it explains and predicts, even indirectly. Whether a multiverse is the right explanation of the dials is a question on which thoughtful people part ways.

cards:
  - type: mcq
    id: hook
    title: "Guess: a fraction of an endless crowd"
    prompt: |
      Before any theory, guess. Suppose bubble universes keep being born forever, never stopping. Some are of type A and some of type B. A cosmologist asks: "What fraction of all universes are of type A?" Which is the best first reaction?
    options:
      - text: 'The question needs an extra rule. With endlessly many of each, the answer depends on how the crowd is cut off and counted.'
        correct: true
        feedback: |
          Right. The rest of the lesson shows how the same endless crowd gives different fractions under different counting rules.
      - text: 'It has an obvious answer: the long-run ratio of births, for example 80% type A.'
        feedback: |
          That is one rule: "count each universe once, in order of birth". It is natural, but it is a choice, and the next cards show a different natural choice giving a different answer.
      - text: 'It has no answer because infinite collections have no fractions at all.'
        feedback: |
          Too strong. A fraction can be perfectly well defined once a rule says how to count (the first million, everything up to a given time, and so on). The trouble is that different reasonable rules disagree.
    explanation: |
      This is the **measure problem** of the multiverse in miniature. The previous lesson ended with a need for "a probability rule for universes"; this lesson asks where universes might come from and why such a rule is hard to write down.

  - type: text
    id: recall
    title: "Recall: what the selection argument needs"
    body: |
      Recall from the lesson *The Anthropic Principle and Selection Effects*: for a dial of physics with value $x$, let $P(x)$ be the prior probability of the value $x$ (how likely it is before we take into account that observers exist), and $F(x)$ the weight of observers that value allows (for the vacuum energy density, the fraction of matter that ends up in galaxies). The values an observer finds then follow

      $$P_{\text{obs}}(x)\;\propto\;P(x)\,F(x).$$

      The argument needs two things: **a spread of values that really occur somewhere**, and **a rule that fixes $P(x)$**. Physics must supply both. This lesson looks at the two leading proposals for the spread, and then at why the second item, the rule, is a deep problem.

  - type: text
    id: inflation
    title: "Source 1: eternal inflation"
    body: |
      **Inflation** is the proposal that the very early universe went through a short stage of extremely fast expansion. Alan Guth proposed it in 1981 to explain why the universe is so smooth on large scales (distant regions look alike though they could never have exchanged signals) and so close to spatially flat (layer 2: inflation is widely used and supported by observations of the cosmic microwave background, though its details and alternatives remain debated).

      In many inflationary models the expansion does not stop everywhere at once. It ends in some places, where the energy of the inflating field turns into ordinary matter and radiation, and it **goes on in the rest**. Each place where it ends is a **bubble universe** (also called a pocket universe), and since inflation continues elsewhere, new bubbles keep forming. This is called **eternal inflation** (Andrei Linde's 1986 paper is a standard reference). If the model also lets different bubbles end with different values of the dials, we get exactly the spread the selection argument needs.

      Labels: that inflation happened is layer 2 (strongly supported, still debated in detail). That inflation is eternal is a prediction of *some* models, not an observation. That bubbles with other dial values exist is a consequence of *further* assumptions. No bubble outside ours has been observed, and from inside one, the others are not observable.

  - type: mcq
    id: inflation-q
    title: "What would eternal inflation give the argument?"
    prompt: |
      Select every statement that is a fair reading of what eternal inflation, if true, would contribute to the anthropic explanation of the vacuum energy.
    multiple: true
    options:
      - text: 'A mechanism that could produce many separate regions, which may differ in their dial values: the "spread" the argument needs.'
        correct: true
      - text: 'No rule yet for how likely each region is: the probability rule is a separate problem.'
        correct: true
      - text: 'Direct observation of other bubbles, which settles that the multiverse exists.'
        feedback: |
          No other bubble has been observed. Eternal inflation is a theoretical consequence of certain models, not a measurement.
      - text: 'A proof that our dial values were aimed at observers.'
        feedback: |
          Nothing of the kind. A spread of values plus selection would explain our value without aiming; whether there is a purpose is a different, faith-layer question.
    explanation: |
      Eternal inflation supplies a possible *source* of the spread. It does not supply the probability of each value, and it does not make the other bubbles observable. Both gaps matter in what follows.

  - type: widget
    id: count-predict
    title: "Guess first: who wins, by number or by size?"
    widget: multiverse-counter
    config:
      seed: 2
      cut: 0.6
      rules: [count, volume]
      labels:
        A: "type A (small, many)"
        B: "type B (large, few)"
      show:
        fraction: false
    body: |
      A toy model of bubbles born one after another, early on the left, late on the right. Type A bubbles are small and common, type B bubbles are large and rare. The slider chooses how much of the sequence is counted (the rest is faint). Under **by count** every counted bubble is a dot of equal size; under **by volume** each bubble is drawn with an area proportional to its volume. Switch between the two and move the slider. There is no number shown: judge by eye.

  - type: mcq
    id: count-predict-q
    title: "By eye: what do the two rules say?"
    prompt: |
      In a toy sequence of bubbles, type A bubbles are small and four times as common as type B. Each type B bubble has eight times the volume of a type A bubble. Counting the first part of the sequence, which statement should you expect?
    options:
      - text: 'Counting each bubble once, type A is the large majority; counting by volume, type B holds the larger share, although there are far fewer of them.'
        correct: true
        feedback: |
          Yes. Four A's have volume $4\times1=4$, and the one B has volume $8$. So B holds about two thirds of the volume while A makes up about four fifths of the bubbles.
      - text: 'Type A is the large majority under both rules, since it is more common.'
        feedback: |
          Being more common wins the count, but the volume rule weights each bubble by its size. A single large bubble can outweigh several small ones.
      - text: 'The two rules must agree, since they look at the same bubbles.'
        feedback: |
          They look at the same bubbles but weigh them differently. Agreement would need every bubble to have the same volume.
    explanation: |
      With $4$ A for each B and volumes $1$ and $8$: by count, A is $\tfrac{4}{5}=80\%$; by volume, A is $\tfrac{4\times1}{4\times1+1\times8}=\tfrac13$. In the sample on the screen the exact percentages differ a little because the bubbles were drawn at random, but the pattern is the same.

  - type: widget
    id: count-compare
    title: "Three rules, one sequence"
    widget: multiverse-counter
    config:
      seed: 2
      cut: 0.6
      labels:
        A: "type A (small, many)"
        B: "type B (large, few)"
        fraction: "fraction of type A"
        note:
          count: "Each bubble counts once."
          volume: "Each bubble counts by its volume."
          time: "Each bubble born before time $T$ counts by the volume it has reached at $T$ (young bubbles are still growing)."
      show:
        compare: true
        trace: true
        ruleNote: true
        counts: true
        cut: true
        axis: true
        grow: true
    body: |
      The same sequence, now with a third rule, **by time**: count every bubble born before a chosen time $T$, each by the volume it has reached by then. A readout shows the fraction of type A under all three rules at once, and a plot shows how each fraction moves as the cut-off slides. Move the slider, switch rules, press **Grow** to watch the sequence lengthen. At the starting cut-off the fractions are about $75\%$, $27\%$ and $43\%$.

  - type: mcq
    id: count-compare-q
    title: "Which rule is correct?"
    prompt: |
      In a toy sequence the fraction of type A comes out about 75% by count, 27% by volume and 43% by time, all for the same bubbles and the same cut-off. A student says: "So one of them is the true fraction and the others are mistakes." What is the best reply?
    options:
      - text: 'None is a mistake as arithmetic. Each answers a different question, and which question matters for us has to be argued from physics, for example from how observers are spread over the bubbles.'
        correct: true
        feedback: |
          Right. "Fraction of bubbles", "fraction of volume" and "fraction of volume at a given time" are three different quantities. Choosing among them is the measure problem.
      - text: 'The count rule is the true one, because a bubble is one universe whatever its size.'
        feedback: |
          Tempting, since "how many universes" sounds like counting. But if observers live in the volume, a count that gives a tiny bubble the same weight as a huge one may not track what we want to predict. Either choice is a further assumption.
      - text: 'The average of the three is the true one.'
        feedback: |
          Averaging has no justification here: the three answers are not noisy measurements of one number, they answer different questions.
    explanation: |
      In a real, endless multiverse the three rules need not even settle down to a limit as the cut-off grows, which is worse than disagreeing. The plot in the widget hints at it: the fractions move with the cut-off.

  - type: text
    id: landscape
    title: "Source 2: the string landscape"
    body: |
      **String theory** is a proposed theory of fundamental physics in which particles are tiny vibrating strings and space has extra dimensions rolled up too small to see (layer 2 for its consistency as mathematics; **not** experimentally confirmed, which the next cards come back to). The shape and contents of the rolled-up dimensions fix the low-energy physics we would see: the particles, the constants, and the vacuum energy.

      A **vacuum** here means a stable (or long-lived) low-energy state of the theory, and each one corresponds to a different set of dial values. Work by Raphael Bousso and Joseph Polchinski (2000) showed how many quantised fluxes (field "charges") through the extra dimensions could give a huge number of possible values of the vacuum energy, some small enough to match ours. Leonard Susskind (2003) named the resulting set of possibilities the **string landscape**. Estimates of the number of vacua of 10^500 are often quoted; a later review stresses that such counts are rough and that current estimates span an enormous range, so no one knows the number.

      Together with eternal inflation: inflation could populate many bubbles, and each bubble could land in a different vacuum of the landscape. That combination is the "multiverse" of many popular accounts. It stacks two layer 2 hypotheses on a theory not yet tested; defenders call it a natural consequence, critics call it a speculative chain.

  - type: mcq
    id: landscape-q
    title: "Which layer?"
    prompt: |
      Three statements. (1) "Inflation took place in the early universe." (2) "The string landscape contains a huge number of vacua with different dial values." (3) "Our universe is one bubble among others that really exist." Which assignment of layers is most defensible?
    options:
      - text: '(1) is a well-supported but still debated-in-detail layer 2 claim; (2) is a layer 2 theoretical claim about a theory not yet tested; (3) is, today, an untested consequence of those hypotheses, so also layer 2 at best, with no direct observation behind it.'
        correct: true
      - text: 'All three are established facts, since they come from physics.'
        feedback: |
          Physics origin does not make a claim established. (2) concerns a theory not yet confirmed, and (3) depends on assumptions on top of it.
      - text: 'All three are faith commitments, since none can be seen directly.'
        feedback: |
          Overcorrecting. Inflation is tested indirectly by observations such as the cosmic microwave background. Not being directly seen is not the same as being a faith claim: the difference is whether evidence bears on it.
    explanation: |
      The label can change along a chain of reasoning. A claim built on two untested links is weaker than each link alone; it is not therefore false.

  - type: text
    id: toy
    title: "Why counting an endless crowd is slippery"
    body: |
      Back to the hook with exact numbers. Imagine the universes of the multiverse as an endless list, with infinitely many of type A and infinitely many of type B, and that we order the list in some way and take the first $N$ entries.

      If the list reads **A A B A A B A A B ...** (two A for each B), then among any first $N$ entries, with $N$ a multiple of $3$, the fraction of A is $\tfrac23$.

      Now take the same universes and list them as **A B B A B B A B B ...** The fraction of A among the first $N$ is $\tfrac13$.

      Both lists contain exactly the same universes, infinitely many of each type. Nothing about the universes changed; only the order in which we read them did.

  - type: numeric
    id: toy-count
    title: "Count in the first 300"
    prompt: |
      An endless list of universes repeats the pattern A A B, A A B, A A B, and so on. Among the first 300 entries, how many are of type A?
    answer: 200
    hint: |
      Each block "A A B" has 3 entries and 2 of type A. How many blocks are in 300 entries?
    explanation: |
      $300/3=100$ blocks, each with 2 A, so $200$ of type A, a fraction $\tfrac{200}{300}=\tfrac23$. For the pattern A B B the same count gives $100$ A, a fraction $\tfrac13$.

  - type: mcq
    id: toy-order
    title: "Which ordering is right?"
    prompt: |
      The list A A B A A B ... and the list A B B A B B ... contain the same universes, yet give $\tfrac23$ and $\tfrac13$ for type A. What does this show about "the fraction of universes of type A in an endless multiverse"?
    options:
      - text: 'It is not a property of the collection alone. It also depends on the rule for ordering or cutting off, so a physical reason for the rule is needed.'
        correct: true
        feedback: |
          Right. The problem disappears for finite collections, where every ordering gives the same fraction; it appears only when both types are endless.
      - text: 'It shows that one of the two lists must be a mistake.'
        feedback: |
          Neither is wrong. Both are legitimate readings of an endless collection; they only disagree about which "first $N$" we take.
      - text: 'It shows that the multiverse cannot exist.'
        feedback: |
          It shows nothing about existence. It shows that a probability statement about the multiverse needs an extra ingredient, which is a different complaint.
    explanation: |
      For a finite set of $n_A$ and $n_B$ universes, the fraction $\tfrac{n_A}{n_A+n_B}$ does not depend on order. For endless sets it does, which is why physicists look for a *measure* with a physical justification.

  - type: text
    id: measures
    title: "Proposed measures"
    body: |
      A **measure** is a rule that cuts off the endless ensemble in a definite way and weights what lies inside, so that probabilities of dial values become definite. There are several, and they are not equivalent. Three examples, in the spirit of the widget:

      - **Proper-time cut-off.** Compare regions up to the same elapsed time along a family of observers. In an eternally inflating space almost all the volume is created at the latest moment, so this rule is dominated by young regions. The rule then predicts that we should find ourselves in a universe much younger than ours looks: this is the **youngness** (or "coolness") **paradox**, discussed by Max Tegmark among others (2005).
      - **Scale-factor cut-off.** Compare regions up to the same amount of expansion (the same value of the scale factor, as in the lesson on the beginning). It avoids the youngness paradox and has been studied in detail, for example by Alexander Vilenkin, Alan Guth, Andrei Linde and collaborators (2010).
      - **Causal patch.** Count only what a single observer could ever see, one region bounded by a horizon. Raphael Bousso proposed it in 2006, motivated by holography (the idea that the information in a region is encoded on its boundary).

      Each cut-off gives a different probability for the same dial value. So the "$P(x)$" in $P_{\text{obs}}\propto P\,F$ is only as good as the measure behind it. A prediction like Weinberg's then depends on that choice (layer 2: the measure problem is open).

  - type: mcq
    id: measures-q
    title: "What is a measure for?"
    prompt: |
      In the formula $P_{\text{obs}}(x)\propto P(x)\,F(x)$ for the values observers find, what role does a measure play?
    options:
      - text: 'It fixes the prior $P(x)$: how to weigh the different regions or universes so that probabilities of dial values are definite despite the endless ensemble.'
        correct: true
      - text: 'It fixes $F(x)$: how many observers each dial value allows.'
        feedback: |
          $F(x)$ is a matter of astrophysics (for example galaxy formation) given the value $x$. The measure is about how to count the regions that have each value in the first place.
      - text: 'It removes the need for any prior at all.'
        feedback: |
          Some proposals, such as the causal patch, aim to reduce what has to be assumed, but any definite probability still depends on the choice of rule, which plays the role of the prior.
    explanation: |
      Observers appear in $F(x)$, the weighing of regions in $P(x)$. The first is hard physics; the second is the open conceptual problem.

  - type: text
    id: bb
    title: "A test for measures: Boltzmann brains"
    body: |
      In a universe that expands forever with a small positive vacuum energy, empty space still has a tiny temperature and, given unimaginable time, thermal fluctuations will occasionally assemble anything allowed by physics, including a single brain with false memories of a universe. Such an object is called a **Boltzmann brain**, after the physicist whose work on entropy and fluctuations was met in the lesson on entropy. The name is credited to Andreas Albrecht and Lorenzo Sorbo (2004). Lisa Dyson, Matthew Kleban and Leonard Susskind had already raised the underlying worry in 2002.

      Why does it matter for the multiverse? In an endless ensemble, ordinary observers like us who evolved in a young hot universe are produced a finite number of times per bubble, while fluctuation observers could be produced without limit. A measure that counts the infinite late-time part heavily may say that **fluctuation observers vastly outnumber ordinary ones**. A theory with such a measure would predict that we are most probably a lone brain, and that the ordered universe we seem to see (and our memories of it) are an illusion. This contradicts what we see: the ordered world we observe is far from what a random fluctuation would produce.

      The Boltzmann-brain problem is therefore used as a **test of a measure**: a measure that makes brains dominate is regarded as failed. The scale-factor cut-off has been studied for this (the 2010 paper by Vilenkin and collaborators finds a finite ratio of brains to ordinary observers, which is acceptable if certain rates are small enough). Layer 2: how to respond is a matter of live debate.

  - type: mcq
    id: bb-q
    title: "What does the Boltzmann-brain argument say?"
    prompt: |
      A physicist argues: "If a measure predicts that Boltzmann brains vastly outnumber ordinary observers, the measure is wrong." What is the reasoning?
    options:
      - text: 'If the measure were right, we should expect to be a typical observer, hence a brain; but our evidence (an orderly, observed universe with a consistent past) fits an ordinary observer far better. So the measure conflicts with data.'
        correct: true
      - text: 'Boltzmann brains have been observed, so we know they exist.'
        feedback: |
          No one has observed any. The argument is about what a measure would predict, not about a discovery.
      - text: 'Brains cannot arise from fluctuations, because fluctuations are forbidden by physics.'
        feedback: |
          Fluctuations are allowed; the probability is tiny but over unlimited time it adds up. The argument starts from that.
    explanation: |
      The reasoning is a reductio: assume the measure, derive a prediction (we are brains) that our evidence contradicts, and reject the measure. It uses the assumption that we should reason as typical members of the reference class of observers, which some philosophers question (the reference-class problem returns in the next lesson).

  - type: text
    id: critics
    title: "Is it science? The critics and the replies"
    body: |
      **Criticism, steelmanned.** George Ellis and Joseph Silk (Nature, 2014) worry that when a theory cannot be tested, or only through a long chain of untested assumptions, defenders may be tempted to relax what counts as evidence, and this threatens the credibility of physics. They single out string theory and the multiverse and call for philosophers of science to help. Their point is about *standards of evidence*, not about whether the multiverse is false.

      **A second line.** Lee Smolin (2004) argued that the anthropic principle by itself cannot yield falsifiable predictions, while granting that some multiverse theories can, if the ensemble they predict has particular properties. His own example is *cosmological natural selection*, which says that black holes give birth to new universes with slightly changed constants, so that universes making many black holes are more common. He holds that this makes definite predictions that could fail.

      **The reply, steelmanned.** Sean Carroll (2018) argues that falsifiability was never how scientific theories were judged: theories are compared by what they explain, how simple they are and how well they fit what we know, including through indirect evidence. On his view multiverse theories are evaluated like any other, even if doing so is hard in practice. Ellis and Silk's side would reply that indirect evidence has limits when the chain of assumptions grows long, and that this is the reason for caution.

      Layer 2 for the scientific dispute; the question *what counts as science* is partly philosophical.

  - type: mcq
    id: critics-q
    title: "Which reply answers which worry?"
    prompt: |
      A critic says: "A multiverse that can never be observed from inside is not science." Which response best represents Carroll's side, and which is a fair counter from the critics' side?
    options:
      - text: 'Carroll: a theory is judged by overall explanatory success, not by whether each part can be seen directly. Critic: when a long chain of untested assumptions is needed, indirect support is weak and standards of evidence are at risk.'
        correct: true
      - text: 'Carroll: unobservable things are never part of science. Critic: they always are.'
        feedback: |
          Reversed and too crude. Carroll''s point is that science regularly depends on things not directly observed; the critics'' point is about how long and untested the chain is.
      - text: 'Carroll: the multiverse has been observed in the microwave background. Critic: it has not.'
        feedback: |
          Neither claim is made by Carroll: no other universe has been observed, and he agrees on that. The disagreement is about how to evaluate a theory when such observation is not available.
    explanation: |
      Both sides agree on the observations. They disagree about what to do when a theory's most striking prediction cannot be checked directly. That is a disagreement about method (layer 2, with a philosophical core).

  - type: mcq
    id: trap-proof
    title: "Trap: inflation proves the multiverse"
    prompt: |
      A headline says: "Inflation is confirmed by the microwave background, so the multiverse is confirmed." What is the weakness?
    options:
      - text: 'Observations support inflation as a stage of the early universe; the multiverse needs further steps (inflation being eternal, bubbles with different dial values) that those observations do not test.'
        correct: true
      - text: 'There is no weakness: if inflation happened, other universes must exist.'
        feedback: |
          Inflation could have happened once and stopped everywhere. Eternity is a feature of some models, and different dial values in different bubbles needs more assumptions on top.
      - text: 'Inflation has been refuted, so the headline is false.'
        feedback: |
          Inflation is widely supported by observations, though debated in detail. The error in the headline is the extra step, not the first one.
    explanation: |
      A chain is only as strong as its weakest link. Support for the first link gives no support to links not tested by the same evidence.

  - type: mcq
    id: trap-measure
    title: "Trap: no measure means no multiverse"
    prompt: |
      Someone argues: "Physicists cannot agree on a measure, so the multiverse is refuted." What is the best reply?
    options:
      - text: 'The measure problem blocks probabilistic predictions from a multiverse; it does not show that other universes do not exist. It limits what the hypothesis can explain, not whether it is true.'
        correct: true
      - text: 'It is right: a theory without a probability rule is false.'
        feedback: |
          A theory can be true and yet unable to give probabilities for some questions. The weakness is explanatory power, not truth.
      - text: 'It is wrong: the measure problem has been solved.'
        feedback: |
          There are several competing proposals and no consensus; the problem is open.
    explanation: |
      Two different claims are separated: whether other universes exist (undecided by the evidence so far), and whether the hypothesis yields predictions (blocked until a measure is justified).

  - type: mcq
    id: split
    title: "Where thoughtful people part ways"
    prompt: |
      Two physicists agree on the calculations, including the Weinberg bound and the different counting rules. One thinks the multiverse is the likely explanation of the dials; the other thinks the measure problem and the lack of tests mean it explains nothing yet. Which kind of disagreement is it?
    options:
      - text: 'A disagreement in layer 2 about how to weigh an untested hypothesis, and in part about what counts as good evidence; not a disagreement about the calculations.'
        correct: true
      - text: 'A disagreement about established facts, so one of them has miscalculated.'
        feedback: |
          They agree on the calculations. They differ on how much weight an untested chain of hypotheses deserves, and on standards of evidence.
      - text: 'A faith disagreement only: physics cannot say anything.'
        feedback: |
          Part of it is open to future evidence (a justified measure, a tested string theory, a signature of other bubbles). Whether the arrangement has a purpose is the faith layer.
    explanation: |
      Layer 1 (agreed): selection logic, the toy arithmetic that counting rules disagree, the observational support for inflation. Layer 2 (live): whether eternal inflation and the landscape are realised, which measure is right, whether the Boltzmann-brain test settles it, what counts as science. Layer 3: whether the arrangement of the dials has a purpose, which neither the multiverse nor its absence proves. A believer, an atheist and an agnostic can all hold either view of the physics for different reasons.

  - type: text
    id: summary
    body: |
      **Next:** the guided proof *Bayes and Fine-Tuning*. It sets up the likelihood-ratio argument from fine-tuning to a designer or to a multiverse, and checks each premise: the normalisation of the probabilities, the choice of reference class, and the multiverse objection met in this lesson.
