id: ch05-something
title: "Why Something Rather Than Nothing?"
kind: concept
own: |
  - **The question and its principle.** According to Leibniz (1646-1716), the *principle of sufficient reason* says that nothing is real or true without a reason why it is so and not otherwise. Applied to everything at once it gives his question, "Why is there something rather than nothing?": a reason is asked for the existence of the whole world, laws and causes included, and a cause *inside* the world cannot supply it.
  - **Two senses of "nothing".** In physics, "nothing" usually means no particles, or even no space, but still a theory with laws and fields (as in the quantum vacuum or Vilenkin's tunnelling proposal). In philosophy, "nothing" means no things, no space, no fields and no laws. According to David Albert's 2012 review of Krauss's *A Universe from Nothing*, a quantum vacuum is a particular arrangement of physical stuff, so "where do the fields and laws come from?" stays open. Krauss's side replies that critics keep moving the meaning of "nothing" further out. The quantum vacuum is measurable: for two ideal, neutral, perfectly conducting parallel plates a distance $d$ apart, the vacuum pushes them together with pressure
  {{ $$\frac{F}{A} = \frac{\pi^2\hbar c}{240\,d^4}$$ }}
  where $\hbar$ is the reduced Planck constant and $c$ the speed of light. At $d = 1\ \mu\text{m}$ this is about $1.3\ \text{mPa}$ (Casimir 1948, measured by Lamoreaux 1997 to about 5%).
  - **Necessary and contingent.** A being is {{ **contingent** if, when it exists, it could have failed to exist; **necessary** if, when it exists, it cannot fail to exist }}. The number $2$ (on many views) is necessary; this chair is contingent. Whether the laws of physics, or the universe as a whole, is either is exactly what is disputed.
  - **The argument from contingency, as guided proof.** P1: every contingent thing has an explanation. P2: the totality of contingent things is itself contingent and its explanation cannot be one of its own members. C: the totality has an explanation in something outside it that is not itself contingent. The step from P1 and P2 to C is {{ valid }}; critics attack the premises. Hume's character Cleanthes (1779) and Russell (1948) deny that the whole needs more than its parts; Rowe (1975) replies that explaining each member does not explain why there are any members.
  - **Three exits, fairly stated.** The totality is a *brute fact* (it just is, with no explanation), or it rests on a *necessary being* (whatever that is), or the series of explanations *never ends* (an infinite regress). Each has defenders and a standard objection.
  - **Three layers.** *Established fact*: the universe exists, and the quantum vacuum has measurable effects. *Live debate*: what "nothing" means, whether the whole needs an explanation, whether the principle of sufficient reason is true. *Faith or metaphysics*: whether the answer is God, a necessary universe, or no answer. People part ways on {{ whether the whole needs an explanation at all }}.
cards:
  - type: mcq
    id: hook
    title: "Guess: what would count as an answer?"
    prompt: |
      Guess before any theory. Someone asks: "Why is there something rather than nothing?" They mean: why is there a universe, with laws and things in it, at all. Which kind of reply would **fully** answer *that* question?
    options:
      - text: 'A reason that covers the whole of what exists, including any earlier cause, the laws and any quantum fields, so that nothing is left over to ask about.'
        correct: true
        feedback: |
          This is the demanding reading, and the lesson shows why it is hard. It is one reading, not the only one: some thinkers hold that the question is not answerable, or not meaningful (the lesson meets them).
      - text: 'An earlier event that produced the universe, such as a Big Bang.'
        feedback: |
          Tempting, but an earlier event is itself something. The question then returns one step back: why was there that event, and the laws it obeyed, rather than nothing?
      - text: 'A scientific law, because laws explain why things happen.'
        feedback: |
          A law explains why things happen *given* that there are things and a law. The question is about why there is anything for laws to govern, and why there are those laws.
    explanation: |
      Guessing is the point of the opening card. The three replies are three different readings of "answer", and the lesson sorts them. Notice that the question is not "what happened first?" (the previous lesson, on whether time began) but "why is there anything at all?".

  - type: text
    id: recall
    title: "Recall: a past edge is not 'nothing'"
    body: |
      Recall from the lesson *Did Time Begin?*: the hot, dense, expanding past is established, but the equations break down when pushed to extreme densities. A singularity is the place where a theory stops giving answers, not a place in space and not "nothing". Models such as quantum tunnelling (Vilenkin) speak of the universe arising "from nothing", and there "nothing" meant **no space and no matter, but a theory with laws that still describes the step**.

      Even if time had a first moment, or had none, a deeper question would remain. It is the oldest question of metaphysics (the study of what exists and why), and it is the subject of this lesson.

  - type: text
    id: leibniz
    title: "Leibniz and the principle of sufficient reason"
    image:
      src: img/leibniz.webp
      alt: "Oil portrait of Gottfried Wilhelm Leibniz in a long curled wig"
      caption: "Gottfried Wilhelm Leibniz (1646–1716) in an oil portrait by Christoph Bernhard Francke, painted around 1695 and held by the Herzog Anton Ulrich Museum in Braunschweig."
      credit: "Christoph Bernhard Francke, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Christoph_Bernhard_Francke_-_Bildnis_des_Philosophen_Leibniz_(ca._1695)_(cropped).jpg"
    body: |
      Gottfried Wilhelm Leibniz (1646-1716), a German philosopher and mathematician, asks in his *Principles of Nature and Grace* (1714): "Why is there something rather than nothing?" He adds, in essence, that nothing would be simpler and easier than something, so the existence of anything calls for a reason.

      His tool is the **principle of sufficient reason** (PSR). In his *Monadology* he states it, in essence, as: no fact can be real or existing, and no statement true, without a sufficient reason for its being so and not otherwise.

      $$\text{PSR: every fact has a sufficient reason.}$$

      Two warnings. First, the PSR is a **metaphysical principle**, not a result of experiment: it can be accepted or doubted. Second, Leibniz did not treat the question as a joke; he used it to argue that the reason for the series of contingent things lies outside the series, in a necessary being, which he identified with God. That conclusion comes at the end of an argument (below), not in the question.

  - type: mcq
    id: psr-q
    title: "What does the PSR demand?"
    prompt: |
      According to Leibniz, the principle of sufficient reason says every fact has a sufficient reason. A chain of causes is traced back: this event because of the one before, that one because of the one before it. Why, on Leibniz's view, would the chain alone not satisfy the principle?
    options:
      - text: 'Each step is explained by the previous one, but the chain as a whole (and the laws it follows) still has no reason for being this way and not another, or for existing at all.'
        correct: true
      - text: 'Because a chain of causes must have a first member, and no first member can exist.'
        feedback: |
          Leibniz's point does not need a first member. He argues even for a chain with no first member: the reason for the *whole series* must be found outside it.
      - text: 'Because causes are not real, only reasons are.'
        feedback: |
          No claim of this kind is made. The point is that explaining each member by another leaves a question about the whole.
    explanation: |
      This is the pattern the lesson follows: ask for a reason of the *whole*, not only of each part. Whether that request is legitimate is exactly what Hume and Russell dispute later in the lesson.

  - type: text
    id: nothings
    title: "Two senses of 'nothing'"
    body: |
      The word "nothing" hides a trap, because it has several meanings:

      - **In physics**, "nothing" often means *no particles*, an *empty vacuum*, or in quantum cosmology *no space and no matter*. In all these a theory is still there: fields, laws, the rules of quantum mechanics.
      - **In philosophy**, "nothing" means *absolutely nothing*: no things, no space, no fields, no laws, not even a rule that says what could happen.

      This is the heart of a public disagreement of 2012. The physicist Lawrence Krauss published *A Universe from Nothing: Why There Is Something Rather than Nothing* (Free Press, 2012), arguing that quantum mechanics and relativity let a universe appear from "nothing" in the physicist's sense, and that this answers, or removes, the question. The philosopher of science David Albert reviewed it in *The New York Times* (25 March 2012). In essence, he replied that a quantum vacuum, with its fields, is a particular arrangement of physical stuff, no less than a refrigerator or a solar system. Asking where the fields and laws came from, he wrote, "Where, for starters, are the laws of quantum mechanics themselves supposed to have come from?"

      Krauss's defenders answer that critics keep moving the meaning of "nothing" outward whenever physics reaches it. Both points are fair: they disagree about **which "nothing" the question is about**.

  - type: order
    id: ladder
    title: "A ladder of 'nothings'"
    prompt: |
      Put these five meanings of "nothing" in order, from the **least** empty to the **emptiest**.
    steps:
      - 'A sealed room of air: no furniture, but full of molecules.'
      - 'A pumped-out vacuum chamber: no molecules left, but still light, fields and a temperature.'
      - 'The quantum vacuum, the lowest-energy state of a quantum field: no particles, but fields and laws.'
      - 'No space and no matter, but a theory with laws that still describes a universe appearing (the physicist''s "nothing" in quantum cosmology).'
      - 'Absolutely nothing: no things, no space, no fields, no laws.'
    hint: 'Each step removes something the step before still had: molecules, then light and temperature, then particles, then space, then even the laws.'
    explanation: |
      The ladder shows why the public argument was slippery. Krauss works on the middle rungs, where physics can calculate. The philosophers' question lives on the top rung, where there is no theory left to calculate with. A fair reader asks of any claim: "which rung is meant?"

  - type: text
    id: vacuum
    title: "The quantum vacuum is not 'nothing'"
    body: |
      In quantum field theory (the rules that combine quantum mechanics with fields such as the electromagnetic field), even the state with no particles has a lowest, **zero-point**, energy, and it has effects that can be measured. The best-known example is the **Casimir effect**, predicted by the physicist Hendrik Casimir in 1948: two neutral, perfectly conducting parallel plates in a vacuum, a distance $d$ apart, attract each other. For ideal plates the attractive force per unit area (a pressure) is

      $$\frac{F}{A} = \frac{\pi^2\hbar c}{240\,d^4}$$

      Here $\hbar \approx 1.0546\times10^{-34}\ \text{J s}$ is the reduced Planck constant (the size of quantum effects) and $c \approx 2.998\times10^{8}\ \text{m/s}$ the speed of light. Notice the $d^{-4}$: halving the gap makes the pressure $2^4 = 16$ times larger. Steven Lamoreaux measured the force in 1997 for gaps from 0.6 to 6 micrometres, agreeing with theory to about 5%.

  - type: numeric
    id: casimir-num
    title: "How big is the push of 'nothing'?"
    prompt: |
      Two ideal, neutral, perfectly conducting parallel plates are $d = 1\ \mu\text{m} = 10^{-6}\ \text{m}$ apart in vacuum. The vacuum pushes them together with the pressure $F/A = \pi^2\hbar c/(240\,d^4)$, with $\hbar = 1.0546\times10^{-34}\ \text{J s}$ and $c = 2.998\times10^{8}\ \text{m/s}$. Give the pressure in millipascals (mPa; $1\ \text{Pa} = 1000\ \text{mPa}$).
    answer: 1.30
    tolerance: 0.03
    answerText: '1.30'
    wrong:
      - { value: 1300, feedback: 'That is the value with the unit slip: $1.3\times10^{-3}$ Pa is $1.3$ mPa, not $1300$ mPa. Multiply pascals by $1000$ to get millipascals.' }
      - { value: 0.0013, feedback: 'That is the value in pascals ($1.3\times10^{-3}$ Pa). The question asks for millipascals, so multiply by $1000$.' }
    hint: 'Compute $\hbar c = 3.16\times10^{-26}\ \text{J m}$, multiply by $\pi^2$, divide by $240$, then divide by $d^4 = 10^{-24}\ \text{m}^4$.'
    explanation: |
      $$\frac{F}{A} = \frac{\pi^2\,\hbar c}{240\,d^4} = \frac{9.87\times 3.162\times10^{-26}}{240\times10^{-24}}\ \text{Pa}$$
      $$\approx 1.30\times10^{-3}\ \text{Pa} = 1.30\ \text{mPa}$$
      That is about $1.3\times10^{-8}$ of atmospheric pressure: tiny, but measurable, and it grows as $d^{-4}$ (at $d = 100$ nm it is about $13$ Pa). So the empty vacuum has properties and does something. This is why most physicists would not call it "nothing" in the philosopher's sense.

  - type: mcq
    id: krauss-albert
    title: "Krauss and Albert: who has a point?"
    prompt: |
      A physicist says: "The universe can arise from a quantum vacuum, so physics explains why there is something rather than nothing." A philosopher replies: "A vacuum with fields and laws is already something." Which statement describes the disagreement fairly?
    options:
      - text: 'They agree on the physics of the vacuum; they disagree on which meaning of "nothing" the old question uses, and on whether the laws and fields count as part of what must be explained.'
        correct: true
      - text: 'The physicist is right because physics is the only way to know what exists.'
        feedback: |
          This is a philosophical commitment (that only physics answers such questions), not a result of physics, and it is exactly the kind of claim the philosopher questions.
      - text: 'The philosopher is right because physics cannot say anything about the origin of the universe.'
        feedback: |
          Physics says a lot about the early universe and about quantum cosmology models. The point is narrower: whatever such models start from (fields, laws) is itself something to be explained, if one demands a total explanation.
    explanation: |
      Two readings. Krauss: if physics can show how a universe arises from the vacuum-like states it studies, the question has been answered in the way science answers questions. Albert: that answers a different question, because it takes the fields and laws for granted. Neither reading is a result of experiment.

  - type: text
    id: modal
    title: "Necessary and contingent"
    body: |
      To put the old question precisely, philosophers use two words. A thing is **contingent** if, when it exists, it *could have failed to exist*. A thing is **necessary** if, when it exists, it *cannot fail to exist*.

      - *This chair* is contingent: it could have never been built.
      - *The number $2$* is, on many views, necessary: no possible world lacks it. (Nominalists, who deny that numbers are things at all, disagree.)

      Notice that "necessary" here is about **whether it could have been otherwise**, not about whether it is needed by us. Leibniz's question can then be put sharply: *is the whole universe (or its fundamental laws) contingent or necessary?* If contingent, it seems to call for a reason beyond itself. If necessary, it might need none. But whether the universe, matter-energy or the laws is necessary is exactly what is disputed.

  - type: mcq
    id: modal-q
    title: "Contingent or necessary?"
    prompt: |
      Which item is the clearest example of a **contingent** thing, in the sense above?
    options:
      - text: 'The planet Mars: it exists, but a world without it is easily imagined (and a different history would have produced no such planet).'
        correct: true
      - text: 'The statement "$2 + 2 = 4$": on most views it holds in every possible world.'
        feedback: |
          On most views this is a necessary truth. (A few philosophers deny it; the point is that it is the standard example of necessity, not of contingency.)
      - text: 'The laws of physics: they are known to be necessary because we have never seen them fail.'
        feedback: |
          Never seeing a law fail shows that it holds *here and now*, not that it could not have been different. Whether the laws are necessary is a live debate, so they are not the clearest example of either.
    explanation: |
      "Could have been otherwise" is the test. Planets, chairs and people pass it. Mathematical truths on most views fail it. The laws of physics and the universe as a whole are the contested cases, and the question turns on them.

  - type: mcq
    id: traps
    title: "Three tempting shortcuts"
    multiple: true
    prompt: |
      Which of these statements are **misconceptions** about the question "why is there something rather than nothing?" Select all that apply.
    options:
      - text: '"Science has already explained why there is something, so the question is closed."'
        correct: true
        feedback: |
          Physics describes how universes with the vacuum, fields and laws evolve. Whether it explains why those exist is the very point under dispute (Krauss and Albert above). It is not settled either way.
      - text: '"The question is meaningless, so no one should ask it."'
        correct: true
        feedback: |
          Some philosophers do hold that the question is ill-formed or has no answer, and this is a serious position. But "it is meaningless" needs an argument (what rule does it break?), not a wave of the hand; many other philosophers and scientists find it clear and deep.
      - text: '"God is the answer by definition, so there is nothing to discuss."'
        correct: true
        feedback: |
          Believers and non-believers both can see this as an argument to be checked, not a definition. Even if a necessary being is needed, one still has to argue it is God, and that the premises are true. A definition cannot settle the question for or against.
      - text: '"One can ask what an answer would have to look like, even if the question is hard or has no answer."'
        feedback: |
          This is a fair statement, not a misconception: it is what the lesson is doing.
    explanation: |
      Each trap ends the conversation early: one by declaring victory for science, one by banning the question, one by declaring victory for a conclusion. A fair reading keeps the question open as a question.

  - type: text
    id: argument
    title: "The argument from contingency, step by step"
    body: |
      Leibniz's reasoning, in a standard modern form, is a **guided proof**. Let "the totality" mean *all contingent things taken together*.

      - **P1.** Every contingent thing has an explanation (the principle of sufficient reason, for contingent things).
      - **P2.** The totality of contingent things is itself contingent, and its explanation cannot be one of its own members (a member cannot explain the whole of which it is only a part).
      - **C.** So the totality has an explanation outside it, in something that is not contingent, a necessary being.

      Two checks, kept separate. First, **validity**: if P1 and P2 were true, would C follow? Second, **truth**: are P1 and P2 true? A critic may accept the first check and reject a premise.

  - type: mcq
    id: validity
    title: "If the premises are true, what follows?"
    prompt: |
      Take P1 (every contingent thing has an explanation) and P2 (the totality of contingent things is contingent and has no explanation among its own members) as granted. What follows, and what does *not* follow?
    options:
      - text: 'The totality has an explanation outside the contingent things, in something not itself contingent. Nothing yet says that this is God, a person, or a mind: that needs further argument.'
        correct: true
      - text: 'God exists, since only God can be necessary.'
        feedback: |
          "Only God can be necessary" is a further premise, not part of P1 and P2. Others have held that a necessary thing is some abstract fact, or the laws, or matter-energy. The argument needs extra steps to reach the God of any tradition.
      - text: 'Nothing follows, because the premises talk about things and the conclusion about a "being".'
        feedback: |
          The step is valid in logic: if everything contingent needs an explanation, and the whole cannot be explained by a part, the explanation lies outside the contingent. The weakness is in the premises, not the logic.
    explanation: |
      Validity is the easy part. This is why careful critics rarely say "the argument is invalid" and say instead "premise P2 is false" or "premise P1 is not established".

  - type: mcq
    id: critic
    title: "Which premise would a critic reject?"
    prompt: |
      In Hume's *Dialogues Concerning Natural Religion* (1779, Part IX), the character Cleanthes objects to the argument. In essence: if you have shown the cause of each of twenty particles, it is unreasonable to then ask for the cause of the whole twenty; joining the parts into a whole is "an arbitrary act of the mind". In 1948 Bertrand Russell took a similar line, holding that the universe is "just there, and that's all". Which premise does this objection attack?
    options:
      - text: 'P2: the totality is a further thing with its own explanation; the critic says explaining the parts explains the whole, or that the whole needs no explanation.'
        correct: true
      - text: 'The validity of the step from P1 and P2 to C.'
        feedback: |
          The objection grants the logic. It denies that the totality needs a separate explanation, which is a premise.
      - text: 'The idea that contingent things exist at all.'
        feedback: |
          No one in the debate denies that chairs and planets exist. The dispute is about the whole, not the parts.
    explanation: |
      The principle is now called the Hume-Edwards principle: if every member of a collection is explained, the collection is explained. Whether it is correct is the central fork of the argument.

  - type: mcq
    id: rowe
    title: "A reply: Rowe's point"
    prompt: |
      William Rowe (1975) replied to this objection. In essence: it is one thing for each dependent being to have an explanation, and quite another to explain why there are any dependent beings at all. Which situation best shows why he thinks the twenty-particles case does not settle the question?
    options:
      - text: 'Explaining each member by another member (this one from that one) never explains why there is a collection of dependent things rather than none; the parts explained one by one still leave that fact open.'
        correct: true
      - text: 'In a collection of twenty particles it is impossible to find causes of the individual particles.'
        feedback: |
          Rowe grants that each member may be explained. His point is that this does not yet explain why the collection exists at all.
      - text: 'The whole is always bigger than the sum of its parts, so it needs its own cause.'
        feedback: |
          This is a different (and doubtful) claim about wholes. Rowe's reply does not need "more than the sum": it needs that the *existence of any dependent beings at all* is a fact that explanations by other dependent beings do not address.
    explanation: |
      A critic can answer that this requires the PSR to apply to the existence of the whole, which is what the critic doubts (P1 for the totality). Two readings, both serious: Hume and Russell, "the parts are enough, or the question stops"; Rowe, "that leaves a fact unexplained". The disagreement is about whether that fact needs explaining.

  - type: text
    id: exits
    title: "Three exits, fairly stated"
    body: |
      Suppose someone presses the question about the totality. Roughly three answers are on the table, each with defenders and a standard objection.

      1. **Brute fact.** The universe (or its laws) simply is, with no explanation. *Defenders* (Russell, in essence): explanations must stop somewhere, and nothing says the stopping point is not the universe itself. *Standard objection*: it gives up the PSR just where it is hardest, and it treats a contingent fact as if it needed no reason.
      2. **A necessary being.** There is something that exists necessarily and explains the rest. *Defenders* (Leibniz, and many theists): the explanation has to end in something that could not have failed to exist. *Standard objection*: it is unclear what makes anything exist necessarily, and why the necessary thing could not be the universe itself, or its matter-energy, or its laws, rather than a God.
      3. **Infinite regress.** Each thing is explained by an earlier one, forever, with no end. *Defenders*: nothing forbids it, and every step has its explanation. *Standard objection*: the series as a whole is still not explained, as in Rowe's point above.

      Notice that *which exit is best* depends on which premise one accepts, not on the physics alone.

  - type: mcq
    id: exits-q
    title: "Match the objection"
    prompt: |
      A physicist-philosopher says: "The necessary thing could just be the laws of physics, or matter-energy itself. Why add a further being?" Which exit does this move favour, and what does it still have to answer?
    options:
      - text: 'A necessary being that is the universe itself (or its laws): it avoids the extra being, but it must say why these laws, rather than others, are necessary, since other laws are easily imagined.'
        correct: true
      - text: 'The infinite regress: the laws are explained by earlier laws forever.'
        feedback: |
          This is a different exit. Here the stopping point is the laws themselves, not a never-ending series.
      - text: 'The brute fact: it says the universe needs no explanation, so it never faces the question of necessity.'
        feedback: |
          The brute-fact view claims that the universe exists with no reason. The move in the prompt claims there *is* a reason, namely that the universe could not have failed to exist. That makes it a necessary-being view, with the universe as the necessary thing.
    explanation: |
      Two serious readings of the same facts: a theist can say the laws are contingent (they could have been otherwise) and so point beyond themselves; a naturalist can say the laws or the universe is the stopping point. The disagreement is again about what could be necessary, not about observation.

  - type: mcq
    id: layers
    title: "Fact, debate, or faith?"
    prompt: |
      Sort the statement "The quantum vacuum has measurable effects (the Casimir force)", "Whether the whole of reality needs an explanation is disputed among philosophers", and "The ultimate explanation, if there is one, is God" into the three layers, in that order.
    options:
      - text: 'Established fact; live debate; faith or metaphysical commitment.'
        correct: true
      - text: 'Live debate; established fact; faith or metaphysical commitment.'
        feedback: |
          The Casimir force has been measured to about 5% (1997) and better since, so it is established. That the whole's need for explanation is disputed is itself an accurate description of the debate.
      - text: 'Established fact; faith or metaphysical commitment; live debate.'
        feedback: |
          Swapped. "Whether the whole needs an explanation" is argued with reasons by philosophers on every side, which makes it a live debate. "The ultimate explanation is God" adds a commitment that no premise above establishes.
    explanation: |
      The point is not to rank the layers but to see which one a claim belongs to. A fair reader can accept the first, argue about the second, and part ways on the third. Here the parting premise is whether the whole needs an explanation at all.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the universe we live in began in a state of astonishingly low disorder, and that is a second "why" of its own. The lesson *Why Was the Early Universe So Ordered?* takes up the arrow of time, entropy, and the order of magnitude of the odds.
