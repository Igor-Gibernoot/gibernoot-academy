id: ch05-map
title: "Content Map: Origins and Fine-Tuning"
kind: map
name: Level 5, Origins and Fine-Tuning (Big Bang evidence, singularity theorems and Borde-Guth-Vilenkin, models of the start, two senses of nothing, contingency, entropy and the Past Hypothesis, fine-tuning numbers, anthropic principles, multiverse and measure, Bayes argument, three layers)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 5 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a theorem stretched to prove too much, two senses of "nothing" mixed up, a measure treated as a fact, a premise attacked at the wrong place), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: bigbang
    title: Big Bang evidence
    row: 1
    col: 1
    body: |
      Three lines: **expansion** ($v = H_0\,d$, $H_0\approx 70$ km/s/Mpc, no centre: space between galaxies stretches), the **CMB** (thermal light, $T = T_0(1+z)$, about $3000$ K at $z\approx1100$; predicted by Alpher and Herman 1948, found by Penzias and Wilson 1964-65) and **light elements** ($Y = 2x/(1+x)\approx0.25$ for $x = n/p\approx1/7$; lithium-7 does not fit). Fact back to the first minutes; "creation" is a separate question.
    decoys:
      - body: |
          Three lines: **expansion** ($v = H_0\,d$, $H_0\approx 70$ km/s/Mpc), read as an **explosion from a central point** into empty space, the **CMB** (thermal light, $T = T_0(1+z)$, about $3000$ K at $z\approx1100$) and **light elements** ($Y\approx0.25$; lithium-7 does not fit). Fact back to the first minutes; "creation" is a separate question.
        feedback: |
          Every observer sees the same law, so there is no centre and no empty space to explode into: it is the space between galaxies that stretches.
      - body: |
          Three lines: **expansion** ($v = H_0\,d$, $H_0\approx 70$ km/s/Mpc, no centre), the **CMB** (thermal light, $T = T_0(1+z)$, about $3000$ K at $z\approx1100$) and **light elements** ($Y\approx0.25$; lithium-7 fits too). Together they **prove creation** out of nothing.
        feedback: |
          Lithium-7 is a known mismatch. And the three lines establish a hot, dense, expanding past; whether that is a creation is metaphysics. Lemaitre himself said the physics neither proves nor disproves it.
    explanation: |
      The established base of the level (layer 1). Every other box asks what lies at the edge of this picture or what it means.

  - id: edge
    title: Singularity theorems and BGV
    row: 1
    col: 2
    body: |
      Penrose (1965) and Hawking-Penrose (1970): if Einstein's equations hold, matter obeys an energy condition, there are no closed timelike loops and the geometry is generic, some free paths **cannot be extended** past a finite length. Borde-Guth-Vilenkin (2003): with no matter model, if the average expansion rate $H_{\text{av}}>0$ along a past path, that path has **finite past length**. Both are **classical**: an edge of the theory.
    decoys:
      - body: |
          Penrose (1965) and Hawking-Penrose (1970): if Einstein's equations hold, matter obeys an energy condition, there are no closed timelike loops and the geometry is generic, some free paths cannot be extended past a finite length. Borde-Guth-Vilenkin (2003): if the average expansion rate $H_{\text{av}}>0$, that path has finite past length. Together they **prove that time began**.
        feedback: |
          They show incompleteness inside classical theory, not what happens at or before the edge. Whether the edge of the equations is the edge of time is exactly what is open.
      - body: |
          Penrose (1965) and Hawking-Penrose (1970): if Einstein's equations hold, matter obeys an energy condition, there are no closed timelike loops and the geometry is generic, some free paths cannot be extended past a finite length. Borde-Guth-Vilenkin (2003): if the average expansion rate $H_{\text{av}}<0$ along a past path, that path has finite past length, **assuming the same energy condition**.
        feedback: |
          Borde-Guth-Vilenkin needs $H_{\text{av}}>0$ (expansion on average) and assumes no energy condition and no matter model. That is what makes it apply to inflating spacetimes.
    explanation: |
      Marks where the evidence ends. It leads to the models that try to say what is beyond the edge.

  - id: models
    title: Models of the start
    row: 1
    col: 3
    body: |
      Each gives "beginning" another meaning. **No-boundary** (Hartle-Hawking): a smooth, rounded-off start with no sharp edge. **Tunnelling** (Vilenkin): from "nothing" in the physicist's sense. **Bounce** (loop quantum cosmology) and **cyclic** (Steinhardt-Turok): no first moment. **Eternal inflation**: an edge only for one inflating region. **None is tested**.
    decoys:
      - body: |
          Each gives "beginning" another meaning. **No-boundary** (Hartle-Hawking): a **sharp first instant**, the singularity itself. **Tunnelling** (Vilenkin): from "nothing" in the physicist's sense. **Bounce** and **cyclic**: no first moment. **Eternal inflation**: an edge only for one inflating region. **None is tested**.
        feedback: |
          The no-boundary proposal rounds the start off smoothly, like the South Pole of a globe where "south of here" has no meaning; it has no sharp first instant.
      - body: |
          Each gives "beginning" another meaning. **No-boundary** (Hartle-Hawking): a smooth, rounded-off start. **Tunnelling** (Vilenkin): from "nothing" in the physicist's sense. **Bounce** and **cyclic**: no first moment. **Eternal inflation**: an edge only for one inflating region. **Cosmic-microwave-background data have confirmed one**.
        feedback: |
          None of them is tested. They are quantum-gravity-level proposals, and the data (expansion, CMB, elements) do not reach the start.
    explanation: |
      Layer 2: live debate. Several of these use the physicist's "nothing", which the next box separates from the philosopher's.

  - id: nothing
    title: Two senses of "nothing"
    row: 2
    col: 1
    body: |
      **Physics**: no particles, even no space, but still **laws and fields** (quantum vacuum, Vilenkin). **Philosophy**: no things, no fields, **no laws**. Albert (2012): the vacuum is an arrangement of physical stuff, so "where do the laws come from?" stays open; Krauss's side: the goalposts keep moving. The vacuum is real: **Casimir** pressure $F/A = \pi^2\hbar c/(240\,d^4)$, about $1.3$ mPa at $d=1\ \mu\text{m}$ (Lamoreaux 1997, within about 5%).
    decoys:
      - body: |
          **Physics**: no particles, even no space, but still laws and fields (quantum vacuum, Vilenkin). **Philosophy**: no things, no fields, no laws. Albert (2012): the vacuum is an arrangement of physical stuff. The vacuum is real: **Casimir** pressure $F/A = \pi^2\hbar c/(240\,d^2)$, about $1.3$ mPa at $d=1\ \mu\text{m}$ (Lamoreaux 1997, within about 5%).
        feedback: |
          The Casimir pressure falls as $1/d^4$, not $1/d^2$. Check by units and by number: with $d^4$ the value at $1\ \mu\text{m}$ is $1.3$ mPa; with $d^2$ it would be vastly larger.
      - body: |
          **Physics**: no things, no fields, no laws. **Philosophy**: no particles, even no space, but still laws and fields (quantum vacuum, Vilenkin). Albert (2012): the vacuum is an arrangement of physical stuff. The vacuum is real: **Casimir** pressure $F/A = \pi^2\hbar c/(240\,d^4)$, about $1.3$ mPa at $d=1\ \mu\text{m}$.
        feedback: |
          Swapped. The physicist's "nothing" keeps the laws and fields; the philosopher's removes them too. Mixing them is what makes "a universe from nothing" sound stronger than it is.
    explanation: |
      Layer 2: what "nothing" means is the live debate; the Casimir effect (layer 1) shows the physicist's nothing is not empty of effects.

  - id: contingency
    title: The contingency argument
    row: 2
    col: 2
    body: |
      **Contingent**: could have failed to exist; **necessary**: cannot. P1: every contingent thing has an explanation. P2: the totality is contingent and its explanation is not one of its members. C: the totality has an explanation outside it. The step is **valid**; critics attack the premises (Hume's Cleanthes, Russell: the whole needs no more than its parts; Rowe: explaining each member does not explain why there are any). **Exits**: **brute fact**, **necessary being**, or **endless regress**.
    decoys:
      - body: |
          **Contingent**: could have failed to exist; **necessary**: cannot. P1: every contingent thing has an explanation. P2: the totality is contingent and its explanation is not one of its members. C: the totality has an explanation outside it. The step is **invalid**: critics attack the logic, not the premises. **Exits**: brute fact, necessary being, or endless regress.
        feedback: |
          The step from P1 and P2 to C is valid. The disagreement is whether the premises are true, especially whether the whole needs an explanation beyond its parts.
      - body: |
          **Contingent**: could have failed to exist; **necessary**: cannot. P1: every contingent thing has an explanation. P2: the totality is contingent and its explanation is not one of its members. C: the totality has an explanation outside it. **Exits**: a **brute fact** (the series of explanations never ends), a **necessary being** (the totality just is, with no explanation), or an **endless regress** (it rests on something that cannot fail to exist).
        feedback: |
          The labels are shuffled. A brute fact has no explanation; a necessary being is what cannot fail to exist and so needs none outside itself; a regress is the series that never ends.
    explanation: |
      Layer 3 enters here: which exit to accept is a metaphysical commitment. It turns on the same question as the "nothing" box: does the whole need an explanation at all?

  - id: entropy
    title: Entropy and the Past Hypothesis
    row: 2
    col: 3
    body: |
      $S = k_B\ln W$, with $W$ the microstates of a macrostate: the second law is **statistics**. The laws are time-symmetric, so the arrow needs the **Past Hypothesis** (Albert, 2000): a very low-entropy start. Gravity makes a smooth early universe *low* in entropy; Penrose's odds are about $1$ in $10^{10^{123}}$ in a debated measure. **Four replies**: the measure problem, multiverse or anthropic, new laws or a bounce, brute fact.
    decoys:
      - body: |
          $S = k_B\ln W$, with $W$ the microstates of a macrostate: the second law is statistics. The laws are time-symmetric, so the arrow needs the **Past Hypothesis**: a very low-entropy start. Gravity makes a smooth early universe **high** in entropy, so there is no puzzle. **Four replies**: the measure problem, multiverse or anthropic, new laws or a bounce, brute fact.
        feedback: |
          With gravity, clumping raises entropy; a smooth, hot cloud is the low-entropy state. That is why the smooth early universe is the puzzle.
      - body: |
          $S = k_B\ln W$, with $W$ the microstates of a macrostate: the second law is statistics. The arrow of time **comes from the weak force**, which breaks time symmetry, so no special start is needed. Penrose's odds are about $1$ in $10^{10^{123}}$ in a debated measure. **Four replies**: the measure problem, multiverse or anthropic, new laws or a bounce, brute fact.
        feedback: |
          The tiny time-asymmetry of the weak force does not explain the arrow. The statistics point to higher entropy in the past as well, so a low-entropy start is still needed.
    explanation: |
      The multiverse reply connects it to the anthropic and multiverse boxes; the bounce reply connects it to the models of the start.

  - id: constants
    title: Fine-tuning and its disputes
    row: 3
    col: 1
    body: |
      Constants are inputs the theory does not compute: $\rho_\Lambda/\rho_P\approx10^{-123}$, $F_{\text{elec}}/F_{\text{grav}}\approx1.2\times10^{36}$ for two protons, the carbon-making Hoyle state at $7.65$ MeV, the weak scale $v/m_{\text{Pl}}\approx2\times10^{-17}$. Disputed: how big the life-permitting window is, because changing **one constant at a time** can overstate the tuning (the region in several together may be larger) and the fraction depends on the **measure** (even in the value, or in its power of ten).
    decoys:
      - body: |
          Constants are inputs the theory does not compute: $\rho_\Lambda/\rho_P\approx10^{-123}$, $F_{\text{elec}}/F_{\text{grav}}\approx1.2\times10^{36}$ for two protons, the Hoyle state at $7.65$ MeV, $v/m_{\text{Pl}}\approx2\times10^{-17}$. Disputed: how big the window is, because changing **all constants together** gives the same region as one at a time, and only the **measure** is in question.
        feedback: |
          Varying several constants at once can enlarge the life-permitting region (Barr-Khan, Tegmark), so one-at-a-time claims can overstate the tuning. Both the number of dials varied and the measure are disputed.
      - body: |
          Constants are inputs the theory does not compute: $\rho_\Lambda/\rho_P\approx10^{-123}$, which is the **probability that the universe permits life**; $F_{\text{elec}}/F_{\text{grav}}\approx1.2\times10^{36}$, the Hoyle state at $7.65$ MeV. Disputed: how big the window is, because of one-at-a-time changes and the measure.
        feedback: |
          $10^{-123}$ is the ratio of the observed vacuum energy density to the Planck density, not a probability of life. The life-permitting window is a separate fact (Barnes: about $-10^{-121}$ in Planck units on the negative side).
    explanation: |
      Layer 1 gives the values; layer 2 the size of the window. Both feed the anthropic and Bayes boxes.

  - id: anthropic
    title: Anthropic principles and Weinberg
    row: 3
    col: 2
    body: |
      **Weak** (Carter, 1974): what we observe is restricted to values compatible with observers, a **selection effect**, $P_{\text{obs}}(x)\propto P(x)F(x)$. **Strong**: the universe *must* admit observers, a philosophical "must". **Weinberg (1987)**: galaxies form only if $\rho_\Lambda$ is not much above $\rho_m(z)=(1+z)^3\rho_{m,0}$ (about $125\,\rho_{m,0}$ at $z=4$); observed ratio about $2.2$, a few powers of ten from the bound, not $120$. It cannot explain **why other values exist**.
    decoys:
      - body: |
          **Weak** (Carter, 1974): the universe *must* admit observers, a statement of purpose. **Strong**: what we observe is restricted to values compatible with observers, $P_{\text{obs}}(x)\propto P(x)F(x)$. **Weinberg (1987)**: galaxies form only if $\rho_\Lambda$ is not much above $(1+z)^3\rho_{m,0}$; observed ratio about $2.2$. It cannot explain why other values exist.
        feedback: |
          Swapped. The weak principle is the selection effect, a fact of sampling. The strong one adds the "must", which is a commitment and does not follow from the weak one.
      - body: |
          **Weak** (Carter, 1974): what we observe is restricted to values compatible with observers, $P_{\text{obs}}(x)\propto P(x)F(x)$. **Strong**: the universe must admit observers. **Weinberg (1987)**: galaxies form only if $\rho_\Lambda$ is not much above $(1+z)^3\rho_{m,0}$; observed ratio about $2.2$, **about $120$ powers of ten from the bound**. It **explains why other values exist**.
        feedback: |
          Weinberg's bound is only a few powers of ten from the observed value, which is the point of his argument. And a selection effect explains what we see given that other values occur; why they occur needs a mechanism, such as a multiverse.
    explanation: |
      A statement about sampling, not a cause. It needs a spread of values that really occur, which leads to the multiverse.

  - id: multiverse
    title: Multiverse, measure and Boltzmann brains
    row: 3
    col: 3
    body: |
      Spread of values from **eternal inflation** or the **string landscape** ($10^{500}$ vacua, a rough, contested figure); no other bubble observed. Counting needs a rule: with $4$ A per B and volumes $1$ and $8$, counting gives $80\%$ A, volume weighting $\tfrac13$; AAB AAB ... gives $\tfrac23$, ABB ABB ... gives $\tfrac13$. **Measures**: proper-time, scale-factor, causal patch. **Boltzmann brains**: a measure that makes lone fluctuations outnumber ordinary observers fails.
    decoys:
      - body: |
          Spread of values from **eternal inflation** or the **string landscape** ($10^{500}$ vacua, a rough, contested figure); no other bubble observed. Counting needs a rule: with $4$ A per B and volumes $1$ and $8$, counting gives $80\%$ A, volume weighting also $80\%$; AAB AAB ... gives $\tfrac23$, ABB ABB ... gives $\tfrac13$. **Measures**: proper-time, scale-factor, causal patch.
        feedback: |
          Weighting by volume gives $4/(4+8)=\tfrac13$. The fraction depends on the counting rule, which is the measure problem in miniature.
      - body: |
          Spread of values from **eternal inflation** or the **string landscape** ($10^{500}$ vacua, a rough, contested figure); no other bubble observed. **Measures**: proper-time, scale-factor, causal patch. **Boltzmann brains**: a measure that makes lone fluctuations outnumber ordinary observers is **favoured**, because it predicts we are probably a fluctuation.
        feedback: |
          We reject that prediction, so such a measure fails the test. The Boltzmann-brain test is a way to check a measure, not to confirm one.
    explanation: |
      Layer 2, untested. It is the main reply to the entropy and fine-tuning puzzles, and it brings in its own problem (the measure).

  - id: bayes
    title: The Bayes argument and three objections
    row: 4
    col: 1
    body: |
      Posterior odds = likelihood ratio $\times$ prior odds. P1 to P4: the window is narrow, so $P(E\mid H_1)=w/L$ is small under chance; design does not make $E$ unlikely; the prior of design is not tiny; so the odds favour design. The form is **valid**. Objections: **normalisation** (no uniform prior on $0$ to $\infty$), **measure** ($1\%$ against $10\%$ for the same window), **multiverse** ($1-(1-p)^N$ for "some", yet $p$ for *this* one; Hacking, White).
    decoys:
      - body: |
          Posterior odds = likelihood ratio $\times$ prior odds. P1 to P4: the window is narrow, so $P(E\mid H_1)=w/L$ is small under chance; design does not make $E$ unlikely; the prior of design is not tiny; so the odds favour design. The form is **invalid**. Objections: normalisation, measure, multiverse.
        feedback: |
          The form is valid: if the premises held, the conclusion would follow. All three objections target premises (the likelihood under chance, its measure, and what to condition on).
      - body: |
          Posterior odds = likelihood ratio $\times$ prior odds. P1 to P4: the window is narrow, so $P(E\mid H_1)=w/L$ is small under chance; design does not make $E$ unlikely; the prior of design is not tiny; so the odds favour design. Objections: **normalisation** (the window is too wide), **measure** ($1\%$ against $10\%$ for the same window), **multiverse** ($1-(1-p)^N$ is the chance *this* universe works).
        feedback: |
          Two slips. Normalisation says a uniform prior on an unbounded range gives every window probability $0$. And $1-(1-p)^N$ is the chance that *some* universe works; this one still works with probability $p$.
    explanation: |
      The proof of the level: it uses the fine-tuning numbers, the measure problem and the multiverse, and shows exactly which premise each critic rejects.

  - id: layers
    title: Three layers and where people part ways
    row: 4
    col: 2
    span: 2
    body: |
      **Fact** (layer 1): the hot, expanding past, the vacuum's effects, entropy rising today, the values of the constants. **Live debate** (layer 2): the start (models, measure, the size of the window, whether a multiverse exists). **Faith or metaphysics** (layer 3): creation, a necessary being, design, or no answer. People part ways on whether the edge of the equations is the edge of time, whether the whole or the start needs an explanation, and which measure and premises to trust.
    decoys:
      - body: |
          **Fact** (layer 1): the hot, expanding past, the vacuum's effects, entropy rising today, the values of the constants, **and the multiverse**. **Live debate** (layer 2): the start, the measure. **Faith or metaphysics** (layer 3): creation, a necessary being, design, or no answer. People part ways on whether the edge of the equations is the edge of time and which premises to trust.
        feedback: |
          No other universe has been observed; the multiverse is layer 2, a hypothesis under debate. Putting it in layer 1 passes a speculation off as established fact.
      - body: |
          **Fact** (layer 1): the hot, expanding past, the vacuum's effects, entropy rising today, the values of the constants. **Live debate** (layer 2): the start, the measure. **Faith or metaphysics** (layer 3): creation, a necessary being, design, or no answer. The singularity theorems and fine-tuning numbers **settle the question** between these views, so people part ways only through lack of information.
        feedback: |
          Each argument has a premise that thoughtful people reject (the energy condition and the classical limit, the measure, whether the whole needs an explanation). The disagreement is about those, not about missing data.
    explanation: |
      The level's lesson: the universe is evidence, but what it is evidence for depends on premises and values that no measurement settles.

