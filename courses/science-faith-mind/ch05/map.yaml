outroTitle: Level 5 in one picture
outro: |
  The **Big Bang evidence** (expansion, CMB, light elements) is established back to the first minutes. The **singularity theorems** and **Borde-Guth-Vilenkin** mark an edge of classical theory, and the **models of the start** (no-boundary, bounce, cyclic, eternal inflation) say what might lie beyond it, untested. **Two senses of "nothing"** and the **contingency argument** (with its exits: brute fact, necessary being, regress) ask why there is anything. **Entropy and the Past Hypothesis** and **fine-tuning** ask why the start and the constants are as they are, and the **anthropic principles** and the **multiverse** (with its measure problem and Boltzmann brains) are replies. The **Bayes argument** weighs them with three objections. All of it sits in the **three layers** of fact, debate and commitment. Next: the Level Review, then the Level Challenge.
