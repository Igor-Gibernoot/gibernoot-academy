id: ch05-beginning
title: "Did Time Begin?"
kind: concept
own: |
  - **Scale factor.** Let $a(t)$ be the factor by which typical distances between far-apart galaxies have grown, with $a = 1$ today. Light from the epoch $a$ is stretched by $1+z = 1/a$, so the radiation bath of today's temperature $T_0 = 2.725$ K was hotter then, and its energy density (radiation, per volume) was larger:
  {{ $$T = \frac{T_0}{a}$$ }}
  $$\rho_{\text{rad}} \propto a^{-4}$$
  Run backwards, $a \to 0$ makes both grow without limit. A **singularity** is where such a quantity diverges and the equations stop giving answers.
  - **Singularity theorems (classical general relativity).** Penrose (1965) and Hawking and Penrose (1970) proved: *if* Einstein's equations hold, *if* matter obeys an energy condition (gravity always focuses), *if* there are no closed timelike loops and the geometry is generic, *then* some paths of freely falling observers or light cannot be extended past a finite length. They show **incompleteness inside classical theory**, not what happens at or before that edge.
  - **Borde-Guth-Vilenkin (2003).** Let $H = \dot a/a$ be the expansion rate and $H_{\text{av}}$ its average along a past-directed free path. Without assuming a matter model, the theorem says that if the average expansion rate is {{ $H_{\text{av}} > 0$ }}, that path has finite length into the past: the expanding region has a past boundary. It is a classical result, so it says nothing about what quantum gravity does at that boundary.
  - **Models, not facts.** Quantum cosmology (the Hartle-Hawking no-boundary proposal; Vilenkin's tunnelling from "nothing"), eternal inflation, bounces (loop quantum cosmology) and cyclic models (Steinhardt-Turok) each give "beginning" a different meaning: a boundary of time, a smooth rounded-off start, an edge only for one inflating region, or no first moment. None is tested.
  - **Three layers.** *Established fact*: the hot, dense, expanding past (the previous lesson). *Live debate*: whether the past is finite, and whether the answer depends on physics we lack. *Faith or metaphysics*: what a first moment, or its absence, would say about God. Where people part ways: {{ whether the equations' edge is the edge of time, or only the edge of our theory }}.
cards:
  - type: mcq
    id: hook
    title: "Guess: where does the film stop?"
    prompt: |
      Guess before any theory. Take a film of the expanding universe and run it **backwards**: galaxies come closer, the sky gets hotter and denser. Where do you expect the film to end?
    options:
      - text: 'At a stage so hot and dense that the physics we know may no longer apply, so the film stops being reliable there.'
        correct: true
        feedback: |
          This is the cautious guess, and the lesson will sharpen it: "the film stops being reliable" and "time stops" are two different claims.
      - text: 'It never ends: the same kind of universe continues backwards, forever, just denser.'
        feedback: |
          Plausible, but "just denser, forever" would need our equations to keep working at any density, and nobody has tested them anywhere near that extreme.
      - text: 'At today, since the past cannot be filmed.'
        feedback: |
          The past can be reconstructed from evidence (the cosmic microwave background and the helium abundance reach back to the first minutes), so the film can be run a long way back.
    explanation: |
      Guessing is the point of the opening card. The answer to "did time begin?" turns out to hang on which of these three guesses a theory supports, and on what we mean by "begin".

  - type: text
    id: recall
    title: "Recall: the scale factor"
    body: |
      Recall from the lesson on the Big Bang: distant galaxies recede, the space between them stretches, and a radiation bath cools as it stretches. To follow the film backwards in one number, define the **scale factor** $a(t)$ ("how big are typical distances, compared with today"). So $a = 1$ today and $a = \tfrac12$ when distances were half as large. The light's stretch factor is $1+z = 1/a$, so the temperature rule $T = T_0(1+z)$ reads
      $$T = \frac{T_0}{a}, \qquad T_0 = 2.725\ \text{K}$$
      The density of radiation (energy per volume) also falls because the volume grows, and each photon loses energy by the stretch:
      $$\rho_{\text{rad}} \propto a^{-4}$$
      In the next card you can drag a cursor along a **schematic** curve $a(t)$. The shape is illustrative, not a solution of Einstein's equations; only the readouts' rules above are real.

  - type: widget
    id: film-back
    widget: scale-factor
    title: "Run the film backwards"
    config:
      models: [bang]
      model: bang
      cursor: 0
      density: radiation
      breakdown: { a: 0.1 }
      readouts: [a, T, rho]
      show: { breakdown: true, endMarks: true, selector: false, guides: true }
      labels: { t: "time (schematic)", a: "scale factor a", breakdown: "equations break down" }
    body: |
      Drag the cursor (or use the slider or arrow keys) back in time. Watch the scale factor $a$ shrink and the temperature $T$ and the radiation density rise. The shaded band is where, in this schematic, the equations stop being trustworthy.

  - type: numeric
    id: density-power
    title: "How dense, how hot?"
    review: false
    prompt: |
      Use the rules just recalled, $T = T_0/a$ with $T_0 = 2.725$ K and $\rho_{\text{rad}} \propto a^{-4}$. When distances were $1000$ times smaller than today ($a = 1/1000$), the radiation density was larger than today's by a factor $10^{n}$. What is $n$?
    answer: 12
    tolerance: 0.01
    answerText: '12'
    wrong:
      - { value: 3, feedback: 'That is the power for a *length* ($a^{-1}$) or, with $3$, for a matter-like volume factor. Radiation also loses energy per photon, so it adds one more power.' }
      - { value: 9, feedback: 'That is $a^{-3}$, the dilution of a count of particles by volume alone. For light each photon also loses energy as it is stretched, giving a fourth power.' }
    hint: '$a^{-4}$ with $a = 10^{-3}$.'
    explanation: |
      $$\rho_{\text{rad}} \propto a^{-4} = (10^{-3})^{-4} = 10^{12}$$
      The same step gives $T = 2.725/10^{-3} = 2725$ K. Each time $a$ is cut by a factor of $10$, the temperature rises tenfold and the radiation density ten-thousand-fold. As $a \to 0$ both grow without limit.

  - type: text
    id: singularity
    title: "What 'singularity' means"
    body: |
      If $a \to 0$ really happened, $T$ and $\rho$ would grow without limit. A **singularity** is the word for such a place: *where the equations give an infinite value, or stop giving any answer*. The word names a failure of the description, not a thing in the world. Two warnings:

      - It is **not a point in space** where the universe sat. In the model the early universe was dense *everywhere*.
      - It is **not shown to be real** by the equations producing it. When a theory returns infinity, the usual reading in physics is that the theory has been pushed past its range, as with any formula used far outside the conditions where it was tested.

  - type: mcq
    id: singularity-q
    title: "What does the infinity tell us?"
    prompt: |
      A model gives an infinite density when $a \to 0$. Which is the most careful reading, according to how physicists usually treat infinities in a theory?
    options:
      - text: 'The model has been pushed beyond where it can be trusted; the real early universe may have been extremely dense without being infinite, or may have had a different structure.'
        correct: true
      - text: 'The universe really contained an infinitely dense point, and time started there.'
        feedback: |
          This treats the equations as the world. It is one possible reading, but nothing in the evidence forces it: the evidence we have stops long before such densities.
      - text: 'The infinity proves the model is wrong, so the Big Bang never happened.'
        feedback: |
          The hot, dense, expanding past is supported by independent evidence (expansion, background radiation, helium). What breaks down is the extrapolation to the extreme, not the history we can test.
    explanation: |
      Two layers again. *Established*: the model works back to the first minutes. *Open*: what the model does if pushed further. A theory failing is a statement about the theory, not yet about time.

  - type: text
    id: theorems
    title: "The singularity theorems: Penrose and Hawking"
    image:
      src: img/penrose.webp
      alt: "Photograph of Roger Penrose at Berkeley in 1978"
      caption: "Roger Penrose, photographed at Berkeley in 1978; he received half of the 2020 Nobel Prize in Physics for showing that black hole formation is a robust prediction of general relativity."
      credit: "George Bergman, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Roger_Penrose,_1978_Sept_(portion_B).jpg"
    body: |
      In 1965 Roger Penrose (born 1931) showed, in a paper called "Gravitational collapse and space-time singularities" (*Physical Review Letters* 14, 57-59), that in general relativity a collapsing star that forms a *trapped surface* (a closed surface from which even outward light rays are bent back inward) must lead to a singularity, without assuming perfect symmetry. For this work he shared the 2020 Nobel Prize in Physics (the citation: that black hole formation is a robust prediction of general relativity). Stephen Hawking (1942-2018) used related ideas for the expanding universe run backwards, and in 1970 Hawking and Penrose published a more general theorem ("The singularities of gravitational collapse and cosmology", *Proceedings of the Royal Society A* 314, 529).

      The theorems read **"if these assumptions hold, then some paths cannot be extended"**. The assumptions, in the 1970 version:
      1. Einstein's equations of general relativity hold (a **classical** theory: no quantum effects).
      2. An **energy condition**: matter and energy always make gravity pull, never push (roughly).
      3. There are **no closed timelike curves** (no loops that bring an observer back to their own past).
      4. A **generic condition**: the geometry is not specially aligned along every path (it has some curvature along them).

      The conclusion is **geodesic incompleteness**: some path of a freely falling observer or of a light ray cannot be continued beyond a finite length (a finite proper time for the observer). The theorems use this as a stand-in for infinite curvature.

  - type: mcq
    id: theorems-q
    title: "What does the theorem say?"
    prompt: |
      According to the Hawking-Penrose singularity theorems, which statement is correct?
    options:
      - text: 'If classical general relativity and the listed assumptions (such as an energy condition) hold, then some free paths cannot be extended into the past. If an assumption fails, or the theory is modified at extreme densities, the theorem says nothing.'
        correct: true
      - text: 'The theorems prove, with no assumptions about matter or about quantum effects, that time had a first moment.'
        feedback: |
          The conclusion is incompleteness of some paths, and it needs the assumptions: classical gravity, an energy condition, and the rest. It does not say what happens at the edge, nor that nothing is beyond it.
      - text: 'The theorems show that the density really is infinite at a point in space.'
        feedback: |
          Incompleteness is used as a stand-in for a diverging curvature, but the theorems do not locate a "point in space" and do not show that the real world follows the classical equations that far.
    explanation: |
      A theorem is only as strong as its hypotheses. Here a key one is that gravity is classical. Near the extreme densities in question many physicists expect quantum effects to matter, which is exactly why the singularity theorems are read as "classical general relativity breaks down" and not as "time begins".

  - type: text
    id: bgv
    title: "Borde, Guth and Vilenkin (2003)"
    body: |
      A different theorem aims at inflation, a proposed very fast stretching of space in the early universe. In 2003 Arvind Borde, Alan Guth and Alexander Vilenkin published "Inflationary spacetimes are not past-complete" (*Physical Review Letters* 90, 151301; arXiv gr-qc/0110012). With $H = \dot a/a$ the expansion rate, they consider a free path (geodesic) followed into the past and its **average** expansion rate $H_{\text{av}}$. Their result needs no particular matter content or energy condition. They assume that
      $$H_{\text{av}} > 0$$
      along the path, meaning the region has been expanding on average, and they conclude that such a path **cannot be extended indefinitely into the past**: it has finite length. The authors read this as "inflation needs something else for the past boundary of the expanding region".

      The hypotheses matter. The theorem is **classical** (quantum gravity is not included), and its premise is about an *average*, so it does not apply to a past in which the universe was not expanding on average. Sean Carroll, among others, notes that a full quantum theory might escape it; according to Vilenkin, models designed to avoid it still keep a boundary. Alan Guth is reported as thinking the universe may have had no beginning.

  - type: mcq
    id: bgv-q
    title: "Which premise would a critic reject?"
    prompt: |
      A writer argues: "Borde, Guth and Vilenkin proved that the universe had a beginning." A critic replies. Which reply points at the premise that carries the weight?
    options:
      - text: 'The theorem is classical and assumes the average expansion rate $H_{\text{av}}$ is positive along the path. A universe that was not expanding on average in the past, or whose quantum-gravity physics replaces the classical picture at the edge, is outside its scope. Also, "a path of finite length" is not by itself "no time before".'
        correct: true
      - text: 'It is wrong because inflation has been disproved.'
        feedback: |
          Inflation has strong observational support as an account of the early universe's smoothness, though its details are debated. The point here is not that the theorem is false but what its hypotheses and conclusion actually are.
      - text: 'It is irrelevant, because mathematics cannot tell us about the real world.'
        feedback: |
          A theorem applies to any world that satisfies its hypotheses. The disagreement is whether ours does, which is a question about physics, not about maths in general.
    explanation: |
      The writer slides from "some paths have finite length" to "time began". Two steps are hidden: (1) the hypotheses (classical, positive average expansion) must hold for our past, and (2) a boundary of the *classical description* must be read as a boundary of *time*. The first is physics; the second is interpretation.

  - type: text
    id: quantum
    title: "Quantum cosmology: proposals, not results"
    body: |
      If the classical description fails at the edge, the next step is a quantum description of the whole universe, called **quantum cosmology**. We do not have a confirmed theory of quantum gravity, so what exists are **proposals** for the state of the universe.

      - **Hartle-Hawking no-boundary proposal** (James Hartle and Stephen Hawking, "Wave function of the Universe", *Physical Review D* 28, 2960, 1983). In a mathematical device in which time is rotated into a fourth space-like direction ("imaginary time"), the early universe is like a rounded surface, a sphere, smooth with **no sharp edge**. On this reading, going back, time does not hit a first instant; it becomes space-like, like the South Pole is not an edge of the Earth's surface (an analogy often used, not a literal claim).
      - **Vilenkin's tunnelling proposal** (Alexander Vilenkin, "Creation of universes from nothing", *Physics Letters B* 117, 25-28, 1982). The universe appears by quantum tunnelling from "nothing" (here: no space and no matter, a state described by the theory), into a small inflating universe. In physics "nothing" means this, not necessarily the philosopher's absolute nothing, a difference taken up in the next lesson.

      Both are **proposals**: different choices of a starting condition for the same equation, with different predictions that have not been decisively tested.

  - type: mcq
    id: quantum-q
    title: "Beginning, or smooth rounding?"
    prompt: |
      According to the Hartle-Hawking no-boundary proposal (and not the tunnelling proposal), which description of the early universe is correct?
    options:
      - text: 'There is no first instant with a sharp edge: going back, time smoothly turns into a space-like direction, like a rounded surface, and the universe is finite in the past but has no boundary.'
        correct: true
      - text: 'The universe tunnels into existence from a state with no space and no matter.'
        feedback: |
          That is Vilenkin's tunnelling proposal. The two are often compared, because both avoid an initial singularity but start from different boundary conditions.
      - text: 'The universe has existed forever with a constant size.'
        feedback: |
          That is a different kind of model (an "emergent" universe). The no-boundary proposal keeps a finite past without an edge.
    explanation: |
      Notice that even a "finite past without an edge" can be read two ways. A theist can say a finite past fits a created universe; a skeptic can say that with no edge nothing needs to start it. The physics does not choose between those readings.

  - type: text
    id: eternal
    title: "Eternal inflation"
    body: |
      Alan Guth (1981, "Inflationary universe: a possible solution to the horizon and flatness problems", *Physical Review D* 23, 347-356) proposed inflation: a brief era of very fast stretching that explains why the universe looks smooth. In some versions inflation, once started, **never stops everywhere**: quantum jitter keeps some regions inflating while others stop and become universes like ours. This is **eternal inflation**, developed in the 1980s by Paul Steinhardt, Alexander Vilenkin and Andrei Linde (chaotic eternal inflation, 1986).

      Eternal inflation is eternal **toward the future**. Whether it is eternal toward the past is the question the Borde-Guth-Vilenkin theorem addresses: according to Mithani and Vilenkin (2012, "Did the universe have a beginning?", arXiv 1204.4658), eternal inflation and cyclic models are not past-complete, so cannot describe a universe without a beginning, while an "emergent" universe can collapse quantum mechanically. Other physicists disagree, and the question stays open.

  - type: text
    id: bounce
    title: "Bounces and cycles"
    body: |
      A **bounce** model replaces the Big Bang by a minimum size: the universe contracted, reached a smallest scale factor $a_{\min} > 0$, then expanded. A **cyclic** model repeats this.

      - **Loop quantum cosmology** (Ashtekar, Pawlowski and Singh, "Quantum nature of the big bang", *Physical Review Letters* 96, 141301, 2006): in this quantum model of space, the big bang is replaced by a bounce, and the evolution can be followed across it. It is a simplified model (a truncation of loop quantum gravity), not a confirmed result.
      - **Steinhardt-Turok cyclic model** (2001; "A Cyclic Model of the Universe", *Science* 296, 1436-1439, 2002): two parallel membranes in a higher-dimensional space collide again and again, each collision playing the role of a big bang. Open problems remain, and Tolman showed in 1934 that older oscillating models gain entropy each cycle, which is a standing objection to endless cycles.

      In these models the past can continue beyond the bounce, so the film does not end where our equations fail.

  - type: widget
    id: compare-pasts
    widget: scale-factor
    title: "Four ways the past can look"
    config:
      models: [bang, bounce, eternal, emergent]
      model: bang
      cursor: -1.0
      density: radiation
      readouts: [a, model]
      show: { ghosts: true, endMarks: true, guides: true }
      labels: { t: "time (schematic)", a: "scale factor a", selector: "Past" }
    body: |
      Switch between the four pasts (the others stay faint and dashed) and drag the cursor back as far as it will go. Watch the scale factor $a$ and where, if anywhere, the curve stops. These are **schematic shapes**, not solutions of Einstein's equations.

  - type: mcq
    id: compare-q
    title: "Which pasts have a first moment?"
    review: false
    prompt: |
      In the schematic, a Big Bang past shrinks to $a = 0$ at a finite time, a bounce past turns around at a smallest size $a_{\min} > 0$, an eternal-past curve gets to $a = 0$ only as $t \to -\infty$, and an emergent past approaches a fixed size as $t \to -\infty$. Which statement is correct for these **curves**?
    options:
      - text: 'Only the Big Bang curve has a first moment in the schematic: at the other three there is a time earlier than any chosen time.'
        correct: true
      - text: 'All four curves have a first moment, since each starts at some time.'
        feedback: |
          Only the Big Bang curve starts at a finite time. The bounce continues to earlier times through its minimum; the eternal and emergent curves continue forever.
      - text: 'The eternal curve must have a first moment, because $a \to 0$ is a Big Bang.'
        feedback: |
          Here $a$ reaches $0$ only in the limit $t \to -\infty$, so for each finite time there is an earlier one on the curve.
    explanation: |
      But a curve is not the whole story. The Borde-Guth-Vilenkin theorem concerns the length of free paths, not only the shape of $a(t)$: according to Mithani and Vilenkin, an eternal-past curve of this kind can still have free paths of finite length into the past. So "the curve goes back forever" and "the past is complete" are two separate claims.

  - type: mcq
    id: traps
    title: "Three tempting slips"
    multiple: true
    prompt: |
      Select **all** the statements that contain a mistake.
    options:
      - text: '"The Big Bang happened at $t = 0$, an event in spacetime, a point we could visit."'
        correct: true
        feedback: |
          In the classical model $t = 0$ is where the description fails: it is not an event in the spacetime, but a boundary of the model. And the early universe was dense everywhere, not at one place.
      - text: '"The Big Bang is the beginning of the universe."'
        correct: true
        feedback: |
          The Big Bang model describes a hot, dense, expanding past. Whether it is also a first moment, an edge of our theory, or a transition from an earlier phase (a bounce, say) is the open question.
      - text: '"A theorem proves that time began."'
        correct: true
        feedback: |
          The theorems prove geodesic incompleteness *given* their hypotheses (classical gravity and the rest). Going from incompleteness to "time began" is an interpretation.
      - text: '"The singularity theorems assume classical general relativity, so they cannot say what happens in a full quantum theory."'
        feedback: |
          This is a fair statement, not a mistake. It is the standard caveat.
    explanation: |
      Each slip skips a layer: a model boundary read as an event, a model read as the whole truth, and a theorem read without its premises. A good habit: ask of any claim "according to which assumptions?".

  - type: mcq
    id: meanings
    title: "What does 'beginning' mean?"
    prompt: |
      A scientist says: "The universe has a past boundary, but nothing follows about time before it." A listener replies: "So you say something came from nothing." Which question should they settle first?
    options:
      - text: 'Which meaning of "beginning" is in use: a first moment of time, a boundary of the classical description, a smooth rounding-off, an edge only for one inflating region, or no first moment at all.'
        correct: true
      - text: 'Whether the Big Bang happened at all.'
        feedback: |
          The hot, dense, expanding past is established. The dispute is about the meaning and the physics beyond it.
      - text: 'Whether God exists, since that decides what the physics says.'
        feedback: |
          That reverses the order. The physics can be stated on its own terms; what it means for God is a further question with its own premises, and the lesson names that step without taking it.
    explanation: |
      Several different claims hide behind "time began": (1) a first moment, with nothing earlier; (2) a past edge of one description, with something earlier possible; (3) no edge, but a finite past (rounded off); (4) an edge only for our inflating region, inside something larger; (5) no first moment (eternal or cyclic). "Something from nothing" fits only some readings of (1), and only if "nothing" means more than "no earlier time in this description".

  - type: mcq
    id: layers
    title: "Fact, debate, or faith?"
    multiple: true
    prompt: |
      Select **all** the statements that are *live scientific debate* (not settled fact and not faith).
    options:
      - text: 'Whether the Hartle-Hawking or the tunnelling proposal (or neither) describes the start of the universe.'
        correct: true
      - text: 'Whether eternal inflation and cyclic models can describe a universe with no past boundary.'
        correct: true
      - text: 'The universe expanded from a hot, dense state, which is tested back to the first minutes.'
        feedback: |
          That is established fact, not live debate (see the lesson on the Big Bang).
      - text: 'A first moment of time shows that God created the universe, or its absence shows He did not.'
        feedback: |
          That is a faith or metaphysical claim: it adds premises about what a creator would need, which the physics does not supply, in either direction.
    explanation: |
      Three layers: established (the hot expanding past), debate (what the equations' edge means, which model, if any, is right), and faith or metaphysics (what any of it says about a creator). A fair reader of either side can accept the first, argue about the second, and part ways on the third.

  - type: mcq
    id: views
    title: "Two readings, fairly stated"
    prompt: |
      Which pair states two serious readings of the question "did time begin?" without caricature?
    options:
      - text: 'A theist may say a finite past, or a past boundary, fits the idea of a created universe, while noting that the physics does not say so; a skeptic may reply that a boundary of a theory is not a boundary of time and that a model with no edge needs no starter.'
        correct: true
      - text: 'A theist says the theorems prove God, and a skeptic says the theorems are fake.'
        feedback: |
          Both caricature. The theorems are real results with stated hypotheses, and none contains a premise about God.
      - text: 'A scientist must accept a beginning, and a religious person must reject all of the models.'
        feedback: |
          No such rule exists. Believers and non-believers are found on every side of the models, and physicists differ among themselves about the answer.
    explanation: |
      The lesson does not say which reading is right. It marks where they split: on whether a past boundary of a theory is a boundary of time, on whether quantum gravity changes the picture, and on whether a first moment, if there were one, would call for a cause. The next lesson takes up that last step as a question of philosophy.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** suppose time did begin, or did not. Either way a deeper question remains: why is there a universe, or any laws, at all? That is the lesson *Why Something Rather Than Nothing?*: Leibniz's question, what physics means by "nothing" versus what philosophy means, and necessary versus contingent existence.
