id: ch15-creeds
title: "Councils, Creeds and the Trinity"
kind: concept
own: |
  The setting: Christians of the fourth and fifth centuries (years are CE) who prayed to Jesus and also held that God is one, and the councils (assemblies of bishops) that tried to say in words how those two things fit. A *creed* is a short statement of belief recited by a church. Everything is taught according to someone.
  - **The question was how Christ relates to God.** According to Arius (a presbyter, a church elder, in Alexandria, about 250 or 256 to 336), the Son is the first and greatest creature, made by the Father, so that "there was a time when he was not". According to his bishop Alexander and later Athanasius (about 296 to 373), the Son is fully God, or else he could not save. Each side feared losing something: Arius feared {{ losing the one and only God }}; Athanasius feared {{ losing a Saviour who is truly God }}.
  - **Nicaea (325) and the word *homoousios*.** The emperor Constantine called the bishops to Nicaea (now İznik, Turkey); traditionally 318 came, historians count 250 to 300 or fewer, nearly all from the East. The creed says the Son is begotten, not made, and *homoousios* with the Father, Greek for {{ of the same substance }} (ousia means being or substance). According to Eusebius of Caesarea, Constantine proposed the word; the council condemned Arius and exiled him. The council did not fix the {{ canon of scripture }}, and the creed said almost nothing of the Holy Spirit.
  - **Constantinople (381) and the Trinity.** The Cappadocians (Basil of Caesarea, Gregory of Nazianzus, Gregory of Nyssa) separated two Greek words: *ousia*, the shared being, and *hypostasis*, an individual who has it. Their formula: {{ one ousia in three hypostases }}, Father, Son and Holy Spirit. The council of 381 (about 150 bishops, all Eastern) expanded the creed to say that the Spirit proceeds from the Father and is worshipped and glorified with the Father and the Son.
  - **Ephesus (431) and Chalcedon (451).** Once the Son is God, how is he also a human being? Nestorius, bishop of Constantinople, objected to calling Mary *Theotokos* (God-bearer) and was deposed at Ephesus; Cyril of Alexandria led the other side. At Chalcedon about 520 bishops defined one person in {{ two natures }}, divine and human, "without confusion, without change, without division, without separation". The Oriental Orthodox churches (miaphysite: one united nature) rejected it; the Church of the East had already rejected Ephesus. Modern scholars say "Nestorian" often misdescribes what Nestorius and that church taught.
  - **Three layers.** Established: the councils, years and texts above, and that bishops, emperors and factions were all involved. Debate: how far politics shaped the outcome, whether "Arian" is a fair label for all opponents of Nicaea, what Nestorius meant. Commitment: whether the councils stated truly who Christ is, or added to the message of the earliest Christians.

cards:
  - type: mcq
    id: hook
    title: "Guess: one and also two?"
    prompt: |
      Guessing is the point; no background is needed. Early Christians, who were Jews or came to worship the God of the Jews, said: there is only one God. They also prayed to Jesus, whom they called Lord, and they remembered him as a man who ate, grew tired and died. Suppose you must say in one sentence how Jesus relates to God. Which kind of answer seems most natural to you at first?
    options:
      - text: "He is a creature, the highest one, who stands between God and us."
        feedback: |
          This is close to what Arius taught in the fourth century. It keeps one God and a human-like Son. The lesson asks what it costs.
      - text: "He is fully God, who truly became a human being."
        correct: true
        feedback: |
          This is what the councils finally affirmed. It keeps both claims, and it raises two hard questions: how can the one God include a Son, and how can one person be divine and human?
      - text: "He is only a man, a very good one, whom God chose."
        feedback: |
          Some early Christians held views like this, and many people do today. The councils of this lesson were mostly about two other options, so the picture here is of a debate inside the churches.
    explanation: |
      There is no single right guess here: all three were held by someone. The lesson follows how the churches went from an open question to precise formulas, according to the churches themselves and according to historians, and keeps apart what is history from what is a matter of faith.

  - type: text
    id: before
    title: "Before the councils"
    body: |
      The earliest writings already speak of Jesus in language that later needed sorting out. In his letter to the Philippians Paul writes, in the NRSV translation, that Christ Jesus, "though he was in the form of God, did not regard equality with God as something to be exploited, but emptied himself, taking the form of a slave, being born in human likeness". Many scholars hold that the passage, Philippians 2:6 to 11, is an older hymn Paul quotes; others, such as Gordon Fee, read it as Paul's own exalted prose. Either way it is early.

      The Gospel of John (about 90 to 100) opens by calling Jesus the *Logos*, the Word, who was with God and was God, and who "became flesh". The same Gospel has Thomas answering the risen Jesus: "My Lord and my God".

      Yet the same Christians read the Jewish scriptures, which say God is one. So the question was not invented by emperors or philosophers; it came from the earliest Christian language. What came later was the demand for precision, once the question was put sharply.

  - type: text
    id: arius
    title: "Arius and Alexander"
    body: |
      About 318 to 320, in Alexandria in Egypt, a presbyter named **Arius** (about 250 or 256 to 336) clashed with his bishop **Alexander**. According to Arius, as his opponents report him, the Son was created by the Father before the world, was the greatest of creatures, and so "there was a time when he was not". He wanted to protect the idea that only the Father has no origin.

      According to Alexander, and later to Athanasius, that made the Son a creature, and a creature cannot save: if the Son is not truly God, then in worshipping him one worships something made, and in being saved by him one is saved by less than God. Alexander held that the Son is eternally born of the Father.

      A synod in Alexandria condemned Arius at about 320 to 321 (sources differ on the year). Arius found support among Eastern bishops, among them Eusebius of Nicomedia and Eusebius of Caesarea, and the quarrel spread across the Greek-speaking East. We know Arius's words mostly through his enemies, since most of his writing was destroyed; that is a limit on what historians can say about him.

  - type: mcq
    id: feared
    title: "What did each side fear?"
    prompt: |
      According to the accounts above, what is the best summary of what Arius and Alexander each feared?
    options:
      - text: "Arius feared that calling the Son fully God would give Christians two Gods; Alexander feared that a Son who is a creature could not save."
        correct: true
        feedback: |
          Yes. Each side saw itself as protecting something it held essential: one God for Arius, a Saviour who is truly God for Alexander. Neither side would have called its aim a mere preference.
      - text: "Arius feared the Roman emperor; Alexander feared that the Jews would object."
        feedback: |
          The sources describe a debate about God and salvation inside the church. Politics did enter later, as the next cards show, but it was not the starting point.
      - text: "Both feared only that the other would take their church's money or power."
        feedback: |
          Historians do see rivalry between bishops and cities, but the surviving arguments are about God and salvation, and a fair account takes them as such.
    explanation: |
      Notice a pattern this lesson will meet again: each side fears losing something real, either the oneness of God or the full divinity of the saviour, and later each side also fears losing the full humanity of Christ.

  - type: text
    id: nicaea
    title: "Nicaea, 325"
    image:
      - src: img/nicaea-icon.webp
        alt: "An icon with gold background: a crowned emperor with a cross in the middle, bishops with haloes around him, and in front of them a scroll with lines of Greek text."
        caption: "An Orthodox icon of the council of Nicaea: the emperor and bishops hold a scroll with the opening of the creed in Greek. Icons like this are later devotional art, not a record of who stood where."
        credit: "Unknown author, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Nicaea_icon.jpg"
    body: |
      The emperor **Constantine** called the bishops to Nicaea (now İznik in Turkey) and the council met from May to the summer of 325. The traditional number of bishops is 318; contemporary reports say 250 to 300, nearly all from the East, and only a few from the West.

      Constantine paid the costs and spoke at the council, but he did not vote, since he was not a bishop; Hosius of Corduba most likely presided. According to Eusebius of Caesarea, Constantine himself suggested the key Greek word of the creed.

      All but two bishops signed the creed. Arius and two supporters refused and were exiled and excommunicated, and his writings were ordered burned. The council also settled how to date Easter. The two views of the event match the two sides: according to the church tradition, the Spirit guided the bishops to the truth about Christ; according to many historians, the emperor's wish for unity set the frame, and the bishops argued inside it.

  - type: mcq
    id: homoousios
    title: "What does *homoousios* say?"
    prompt: |
      The Nicene Creed says the Son is "begotten, not made" and *homoousios* with the Father. *Ousia* is the Greek word for being or substance, and *homo-* means same. Which statement fits what the word was chosen to say?
    options:
      - text: "The Son has the same being as the Father (he is not a creature made from nothing), while remaining someone other than the Father."
        correct: true
        feedback: |
          Yes. "Of one substance with the Father" excludes the Arian claim that the Son is a made being of a lower kind. What the word does not do is say, by itself, that Son and Father are one and the same individual.
      - text: "The Son is only similar to the Father, as a copy is similar to a model."
        feedback: |
          That is nearly the opposite. A century later some bishops preferred to say "like" the Father; Nicaea chose a word meaning "same being" because "like" left room for a Son of a different kind.
      - text: "The Father and the Son are the same person under two names."
        feedback: |
          That view (called modalism, from "mode") was also rejected. The creed says the Son is "begotten" by the Father, so the two are not the same individual.
    explanation: |
      The word is not in the New Testament, which is why some bishops hesitated: they felt it went beyond scripture, and others replied that only a new word could exclude the new Arian answer. That argument, whether doctrine may use words that scripture does not, is itself a point on which Christians still differ.

  - type: text
    id: athanasius
    title: "Athanasius and a long aftermath"
    image:
      - src: img/athanasius.webp
        alt: "An icon of a bearded saint in bishop's robes, with a halo, holding a book."
        caption: "Athanasius of Alexandria, in an icon: a deacon at Nicaea, later bishop of Alexandria (from 328), the best-known defender of the Nicene creed. The portrait is devotional, not a likeness."
        credit: "Unknown author, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Ikone_Athanasius_von_Alexandria.jpg"
    body: |
      Nicaea did not end the quarrel. **Athanasius** (about 296 to 298 to 373) had been Alexander's deacon and assistant at the council, and he became bishop of Alexandria in 328. In the next decades the emperors who followed Constantine often favoured other formulas, and Athanasius was exiled five times, some 17 years in all.

      In 360 the emperor Constantius II had a council adopt the *Homoian* formula, which says the Son is "like" the Father according to the scriptures and avoids speaking of substance. Germanic peoples who later took over the West, among them the Goths, held mostly to this view. Some modern historians, among them Rowan Williams and Lewis Ayres, argue that "Arian" is a misleading name for all who opposed Nicaea, since many did not follow Arius himself and objected to the word *homoousios* for other reasons.

      So between 325 and 381 there was no settled consensus. Nicene belief became the norm slowly, helped by theological work in the East and then by the power of an emperor.

  - type: text
    id: cappadocians
    title: "One ousia, three hypostases"
    body: |
      A problem remained: if the Son is of one being with the Father, and the Spirit is divine too, how do these not become one individual, or three Gods? The answer of the Cappadocians, **Basil of Caesarea** (330 to 379), **Gregory of Nazianzus** (329 to 390) and Basil's younger brother **Gregory of Nyssa** (about 335 to about 395), was to give two Greek words two jobs.

      **Ousia** is what is shared: the general nature, as humanity is shared by all humans. **Hypostasis** (plural *hypostases*) is the particular individual who has it, with its own mark: fatherhood, sonship, and what Basil called sanctifying power. Basil compared this to human beings, each a particular person who shares one humanity.

      The formula is **one ousia in three hypostases**. In Latin, Christians of the West said *one substance in three persons* and the doctrine of the **Trinity** (from Latin for "three-ness") says: there is one God, and the Father, the Son and the Holy Spirit are each God, and they are not one another. The comparison with humans is a help and also a warning, since three humans are three beings and Christian theologians insist that the three here are one God. How far an analogy can go is a standing problem for the doctrine.

  - type: mcq
    id: trinity-misread
    title: "Which sentence states the doctrine?"
    prompt: |
      According to the Cappadocians' formula, which sentence states what the Trinity doctrine claims?
    options:
      - text: "There is one God; the Father, the Son and the Holy Spirit are each fully God and are distinct from one another."
        correct: true
        feedback: |
          Yes. The claim is built from three parts: one God, each of the three is God, and the three are distinct. Dropping any one of them gives an error the churches named.
      - text: "There are three Gods who work together as a team."
        feedback: |
          This is called tritheism and the churches rejected it. They said the three share one being and one divine life, unlike three humans.
      - text: "There is one God who appears at different times as Father, then as Son, then as Spirit."
        feedback: |
          This is modalism. In the Gospels the Son prays to the Father, so the churches said the three are distinct at once, not different roles of one individual.
    explanation: |
      A critic can reply that the three parts together look contradictory (one and three); the churches reply that the word "one" and the word "three" apply to different things, the one ousia and the three hypostases. Whether that reply works is part of an old philosophical debate, taken up in the next lesson's thinkers.

  - type: text
    id: constantinople
    title: "Constantinople, 381"
    body: |
      By 380 the emperor Theodosius I issued the edict of Thessalonica (27 February 380), which made Nicene Christianity the religion of the Roman Empire and called its rivals heretical. In 381 he called about 150 bishops, all from the East, to Constantinople.

      The creed of Nicaea had said only "and in the Holy Spirit". Some Christians, called Macedonians or Pneumatomachians ("fighters against the Spirit"), denied the Spirit is God; thirty-six of them came and were refused entry because they would not accept the Nicene creed. The council's creed says the Spirit is the Lord and giver of life, who proceeds from the Father, and who with the Father and the Son is worshipped and glorified.

      The creed Christians recite today as the "Nicene Creed" is this version, called the Nicene-Constantinopolitan Creed. Scholars disagree on whether the council expanded the Nicene text or adopted a similar older creed. A phrase added in the Latin West centuries later (the *Filioque*, "and the Son", about the Spirit's procession) became a cause of the split between Eastern and Western churches in 1054.

  - type: numeric
    id: gap
    title: "How long from Nicaea to the Trinity?"
    prompt: |
      Take the council years from the text: Nicaea in 325 and Constantinople in 381, the council that completed the creed's statement about the Holy Spirit. How many years separate them?
    answer: 56
    wrong:
      - { value: 706, feedback: "That adds the two years (325 + 381). A gap is a difference." }
      - { value: 126, feedback: "That is 451 - 325, the gap to Chalcedon, not to Constantinople." }
    explanation: |
      Fifty-six years, about two generations. That is why some historians say the doctrine of the Trinity was worked out in the fourth century, not given whole at the start, while believers hold that the councils made explicit what the New Testament already implied. Both can agree on the dates.

  - type: text
    id: ephesus
    title: "Ephesus and Chalcedon: the human side"
    body: |
      Now a second question: if the Son is God, how is Christ also a man? Two bishops answered differently.

      **Nestorius**, bishop of Constantinople, objected to calling Mary *Theotokos* (Greek, "God-bearer", usually "Mother of God"), and preferred *Christotokos* ("Christ-bearer"), fearing that it blurred the humanity of Christ. **Cyril of Alexandria** replied that the child Mary bore was the Son of God himself, one person, so *Theotokos* is the right word. At **Ephesus in 431**, called by the emperor Theodosius II, the party of Cyril presided, declared Mary *Theotokos* and deposed Nestorius.

      After a further council in 449 that Pope Leo called a "robber council", the emperor Marcian called about 520 bishops to **Chalcedon** in 451. Their definition says that Christ is perfect in Godhead and perfect in manhood, one person and one subsistence in two natures, "without confusion, without change, without division, without separation". It accepted the *Tome* (a letter) of Pope Leo I and called Mary the Mother of God.

  - type: mcq
    id: dissent
    title: "Who did not accept it, and why?"
    prompt: |
      After Chalcedon, two groups stood outside. The churches now called Oriental Orthodox (Coptic, Armenian, Syriac Orthodox and others) rejected the definition; the Church of the East had earlier not accepted Ephesus. According to their own accounts, which statement fits the Oriental Orthodox objection?
    options:
      - text: "They held that after the union Christ has one united nature, God made flesh, and heard in 'two natures' a division of Christ in two (the position called miaphysite)."
        correct: true
        feedback: |
          Yes. The two sides share much, and the dispute is partly over how the word "nature" is used.
      - text: "They denied that Christ was ever divine."
        feedback: |
          They affirmed his full divinity; the quarrel was about how his divine and human sides are united.
      - text: "They objected only that the council was held too far from Rome."
        feedback: |
          Pope Leo's own wish was for a council in Italy, but the Oriental Orthodox objection was about the meaning of "nature" and of "union".
    explanation: |
      Today most of these churches say that the difference with the churches that accept Chalcedon is largely one of language, and joint declarations have been signed: in 1994 the Catholic Church and the Assyrian Church of the East signed a common statement of Christian faith that affirms the Chalcedonian wording and the title *Theotokos* as legitimate. Whether the old split was about words or about substance is itself debated.

  - type: mcq
    id: nestorian
    title: "Was Nestorius a 'Nestorian'?"
    prompt: |
      The traditional charge is that Nestorius taught two persons in Christ, one divine and one human. According to modern scholars such as Sebastian Brock, what is a fair statement?
    options:
      - text: "In his later book, written in exile, Nestorius says he affirmed two natures in one person, and the charge may rest in part on a difference in how Greek and Syriac theologians used words like *hypostasis*."
        correct: true
        feedback: |
          Yes. Scholars note that his critics read *hypostasis* as "person", where he meant a concrete reality of a nature, and many say that "Nestorian" is a misnomer. Others hold that his language still risked dividing Christ, which is what Cyril feared. The question stays open.
      - text: "Nestorius agreed entirely with Cyril, so the council of 431 was a misunderstanding."
        feedback: |
          Too strong. They disagreed about which words kept the unity of Christ, and scholars say Nestorius was no less firm than Cyril. The dispute was real even if some of it was about vocabulary.
      - text: "Nestorius later became a follower of Arius."
        feedback: |
          No. Arius's question was about the Son's relation to the Father; Nestorius, like Cyril, accepted Nicaea and argued about how Christ is both divine and human.
    explanation: |
      Today the Assyrian Church of the East, which descends from the churches that supported Nestorius, honours him as a saint but does not simply call itself Nestorian, and it said it was labelled so because it refused to condemn him. This is an example of why historians prefer to read each side in its own terms.

  - type: mcq
    id: myth-constantine
    title: "Myth: Constantine invented Christ's divinity"
    prompt: |
      A popular claim says that the emperor Constantine, at Nicaea in 325, imposed the belief that Jesus is God, perhaps by a narrow vote, to unite the empire. According to historians, which reply is fair?
    options:
      - text: "Christians were already worshipping Jesus and calling him God long before 325; what Nicaea decided was a particular answer to Arius's question, and Constantine did not vote or impose the wording on the council, though his support mattered."
        correct: true
        feedback: |
          Yes. Philippians and John, written centuries earlier, already use divine language. Constantine's role was real, as convener and as the one who enforced the result by exile, but the claim that he created the belief fails.
      - text: "The claim is entirely true: before Constantine nobody held that Jesus is divine."
        feedback: |
          The earliest letters of Paul and the Gospel of John already do, though scholars debate how fully; nobody has to wait for Nicaea to find the idea.
      - text: "The claim is false because Constantine took no part in the council."
        feedback: |
          Too strong. He convened it, paid its costs, spoke at it, and exiled those who refused the creed. What he did not do was vote or invent the belief.
    explanation: |
      Two points on the question of politics. The debate at Nicaea was about whether Christ is a creature or of the same being as the Father, a narrower question than whether he is divine at all. And all but two bishops signed, which is not a narrow vote, though some historians note that signing was made easier by the emperor's presence.

  - type: mcq
    id: myth-canon
    title: "Myth: Nicaea chose the Bible"
    prompt: |
      Another popular claim says the council of Nicaea decided which books are in the New Testament. According to historians of the canon, what is a fair reply?
    options:
      - text: "There is no record that the council discussed the canon; the lists came from individual writers and later synods, such as Athanasius in 367 and Hippo in 393."
        correct: true
        feedback: |
          Yes. The Nicaea records speak of the creed, the dating of Easter and church order. The story that books were put on an altar to see which stayed there is a late tale, found in a ninth-century text, and historians treat it as fiction.
      - text: "The council voted on the books after the creed, and the books that lost were burned."
        feedback: |
          Only Arius's writings were ordered burned. No source says the council voted on books.
      - text: "The council fixed the canon, but a later emperor changed it."
        feedback: |
          No source says either. The lists changed slowly, as the lesson on the canon and manuscripts describes.
    explanation: |
      This is a point where the layers help: that Nicaea did not discuss the canon is established; how early the canon was effectively fixed is debated; whether the list is inspired is a commitment.

  - type: text
    id: politics
    title: "How much did politics shape the creeds?"
    body: |
      Historians differ on how to weigh the forces behind the councils, and a fair account sets the views side by side.

      **Some stress power.** Emperors called every council, paid for them and enforced the outcomes; Theodosius's edict made one party's view the law, and bishops on the losing side were exiled. Rivalries between sees (Alexandria, Antioch, Constantinople, Rome) ran through every dispute, and councils included bitter and sometimes violent conduct. On this view, the outcome might have gone differently had a different emperor reigned, as in the decades when Constantine's successors favoured other formulas.

      **Others stress argument.** The bishops quote scripture, appeal to worship and baptism, and argue about what each formula allows or forbids. Years of Athanasius's and the Cappadocians' writing preceded the final texts, and the doctrine changed in detail as objections were met. On this view, power decided when the debate ended, but did not supply its content.

      **Believers add** a claim that history cannot test: that the Spirit guided the churches into the truth about Christ. Others hold that the creeds added Greek philosophy to the message of the earliest Christians. These are commitments about what the councils were doing, and neither follows from the dates.

  - type: mcq
    id: politics-q
    title: "Which evidence bears on which claim?"
    prompt: |
      Which of these is a claim about the councils that historians can examine by evidence, and not only by faith commitments?
    options:
      - text: "That Theodosius's edict of 380 made Nicene Christianity the state religion and that dissenting bishops were deposed or exiled."
        correct: true
        feedback: |
          Yes. It rests on the edict's text and on records of depositions and exiles; it can be checked, and both believers and sceptics accept it.
      - text: "That the Holy Spirit guided the bishops to the true doctrine of God."
        feedback: |
          A faith claim: it depends on a belief about the Spirit, which history cannot test, and it can be held or denied without disagreeing about a single date.
      - text: "That the creeds distorted the simple teaching of Jesus."
        feedback: |
          A judgment that depends on what one takes the simple teaching to have been, and on whether doctrine develops by distortion or by clarification. Historians can compare texts, but the verdict is not settled by the evidence alone.
    explanation: |
      Notice how the sorting works: facts about edicts and exiles are layer one; how decisive politics was is layer two; whether the creeds are true is layer three.

  - type: order
    id: order-councils
    title: "Put the councils in order"
    prompt: "Order these from the earliest to the latest."
    steps:
      - "Nicaea: the Son is of one being with the Father (325)"
      - "Constantinople: the Spirit is worshipped with Father and Son (381)"
      - "Ephesus: Mary is Theotokos, Nestorius deposed (431)"
      - "Chalcedon: one person in two natures (451)"
    explanation: |
      The order follows the questions: first Christ and God, then the Spirit, then how Christ is divine and human. Each answer produced a new question, and each council left some Christians outside.

  - type: text
    id: table
    title: "The three layers for this topic"
    body: |
      | Layer | Examples |
      |---|---|
      | Established | The councils and their years (325, 381, 431, 451); the text of the creeds; that Constantine convened Nicaea and Theodosius convened Constantinople; that Arius was exiled; that all but two bishops signed at Nicaea; that Nicaea did not discuss the canon; the formula one *ousia*, three *hypostases*; the groups that did not accept Chalcedon. |
      | Scholarly debate | How much politics shaped the outcomes; whether "Arian" and "Nestorian" are fair labels; what Nestorius taught; how far the earliest Christians already held what the creeds say; whether the Oriental Orthodox dispute is about words or about substance. |
      | Commitment | That the councils stated truly who Christ is and what God is; or that they added foreign philosophy to the first message; or that the one God is not three in any sense. |

  - type: text
    id: summary
    body: |
      **What you now own.** You can say what question the councils faced, how each answered it, and what each side feared. According to Arius, the Son is the first creature; according to Alexander and Athanasius, he is fully God. Nicaea in 325 said *homoousios*, of one being with the Father; the Cappadocians gave the formula one *ousia* in three *hypostases*; Constantinople in 381 added the Spirit; Chalcedon in 451 said one person in two natures, and some churches stayed outside. You can answer two popular myths: Constantine did not invent the belief, and Nicaea did not choose the Bible. And you can keep three layers apart: the history is established, the weight of politics is debated, and whether the creeds are true is a matter of faith.

      **Next:** Augustine, Aquinas and the Reformers. After the creeds, Christians went on arguing about faith and reason, about grace and works, and about who has the authority to say what the faith is. The next lesson follows these questions through the thinkers who shaped the split into Catholic, Orthodox and Protestant churches.
