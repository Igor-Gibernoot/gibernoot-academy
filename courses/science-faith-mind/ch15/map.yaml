outroTitle: Level 15 in one picture
outro: |
  The Gospels were written in a Jewish land under Roman rule, and critical scholars compare them to see which used which. Historians weigh outside sources and criteria to portray Jesus, Paul is the earliest voice, and the canon and the manuscripts show how the books were gathered and copied. The resurrection claim turns on a prior that comes from a worldview; the councils, the thinkers and the readers of the Bible show how Christians argued about who Christ is, how grace and reason fit, and which authority decides; and Christianity today has its centre in the Global South. What stays open is the third layer: what the evidence shows is argued, and whether Jesus is risen and divine is a commitment.
