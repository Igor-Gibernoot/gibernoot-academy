id: ch15-map
title: "Content Map: Christianity"
kind: map
name: Level 15, Christianity and the Gospels (the world of Jesus, the Gospels and the Synoptic problem, the historical Jesus, Paul, the canon and manuscripts, the resurrection, the councils and creeds, the thinkers, how the Bible is read, Christianity today, the three layers)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 15 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a date moved, two terms swapped, a scholar's view reversed, a layer mislabelled), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: world
    title: The world of Jesus
    row: 1
    col: 1
    body: |
      The Temple was rebuilt after the exile (dedicated about 516 BCE). Antiochus IV banned Jewish practice in 167 BCE, and the Maccabees' revolt led to the rededication in December 164 BCE. Pompey took Jerusalem in **63 BCE**; Judea became a Roman province in **6 CE**, and Pilate was prefect from **26 to 36 CE**. According to Josephus, the Pharisees kept an oral tradition and the Sadducees only the written Torah. *Messiah* means "anointed one", and according to VanderKam most Second Temple texts do not mention a messianic leader.
    decoys:
      - body: |
          The Temple was rebuilt after the exile (dedicated about 516 BCE). Antiochus IV banned Jewish practice in 167 BCE, and the Maccabees' revolt led to the rededication in December 164 BCE. Pompey took Jerusalem in **63 BCE**; Judea became a Roman province in **6 CE**, and Pilate was prefect from **26 to 36 CE**. According to Josephus, the Sadducees kept an oral tradition and the Pharisees only the written Torah. *Messiah* means "anointed one", and according to VanderKam most Second Temple texts do not mention a messianic leader.
        feedback: |
          The groups are swapped. According to Josephus the Pharisees held an oral tradition besides the written Torah; the Sadducees, a priestly aristocracy, accepted only the written Torah.
      - body: |
          The Temple was rebuilt after the exile (dedicated about 516 BCE). Antiochus IV banned Jewish practice in 167 BCE, and the Maccabees' revolt led to the rededication in December 164 BCE. Pompey took Jerusalem in **63 BCE**; Judea became a Roman province in **6 CE**, and Pilate was prefect from **26 to 36 CE**. According to Josephus, the Pharisees kept an oral tradition and the Sadducees only the written Torah. *Messiah* means "anointed one", and according to VanderKam nearly every Second Temple text expects a messianic leader.
        feedback: |
          VanderKam's point is the reverse: messianic hopes were varied (Davidic king, priestly figures, a prophet like Moses), but most texts mention no messianic leader at all.
    explanation: |
      The ground floor of the level: a Jewish land under Roman rule, with several groups and several hopes, in which every later question about Jesus has to be asked.

  - id: gospels
    title: The Gospels and the Synoptic problem
    row: 1
    col: 2
    body: |
      The four Gospels are anonymous in their text; the names are tradition. Critical scholars date Mark about **65 to 75 CE**, Matthew and Luke about 80 to 90, John about 90 to 100. Matthew, Mark and Luke overlap heavily: the **triple tradition** is in all three, the **double tradition** (about 200 verses) in Matthew and Luke only. Most hold **Markan priority**. The two-source view explains the double tradition by a lost source **Q**; the **Farrer hypothesis** says Luke used Matthew, so Q is not needed.
    decoys:
      - body: |
          The four Gospels are anonymous in their text; the names are tradition. Critical scholars date Mark about **65 to 75 CE**, Matthew and Luke about 80 to 90, John about 90 to 100. Matthew, Mark and Luke overlap heavily: the **triple tradition** is in all three, the **double tradition** (about 200 verses) in Matthew and Luke only. Most hold **Markan priority**. The two-source view explains the double tradition by a lost source **Q**; the **Griesbach hypothesis** says Luke used Matthew, so Q is not needed.
        feedback: |
          Griesbach is a different proposal: Matthew first, Luke used Matthew, and Mark combined and shortened both, so it rejects Markan priority. Keeping Markan priority while dropping Q is Farrer's (1955).
      - body: |
          The four Gospels are anonymous in their text; the names are tradition. Critical scholars date Mark about **80 to 90 CE**, Matthew and Luke about 65 to 75, John about 90 to 100. Matthew, Mark and Luke overlap heavily: the **double tradition** is in all three, the **triple tradition** (about 200 verses) in Matthew and Luke only. Most hold **Markan priority**. The two-source view explains it by a lost source **Q**.
        feedback: |
          Two slips. Mark is the earliest (about 65 to 75), and the names of the traditions are swapped: material in all three is the triple tradition, material in Matthew and Luke only is the double.
    explanation: |
      The Gospels are read together and compared: the overlap is established, the order of use is a live debate, and Q against Farrer is still open.

  - id: historical
    title: The historical Jesus
    row: 1
    col: 3
    body: |
      Outside sources: Josephus (*Antiquities*, about 93 to 94) and Tacitus (*Annals*, about 115, Pilate under Tiberius). Paul's 1 Thessalonians (about 50) is some **20 years** after Jesus's death (about 30 or 33). Historians use criteria: **multiple attestation**, **embarrassment**, **dissimilarity**, **coherence**; they raise or lower probability and do not prove. Most hold that Jesus was baptized by John and crucified under Pilate. Portraits differ: **apocalyptic prophet** (Schweitzer, Sanders, Ehrman), **sage** (Crossan, Borg), **social reformer** (Horsley).
    decoys:
      - body: |
          Outside sources: Josephus (*Antiquities*, about 93 to 94) and Tacitus (*Annals*, about 115, Pilate under Tiberius). Paul's 1 Thessalonians (about 50) is some **20 years** after Jesus's death (about 30 or 33). Historians use criteria: **multiple attestation**, **embarrassment**, **dissimilarity**, **coherence**; they prove what they test. Most hold that Jesus was baptized by John and crucified under Pilate. Portraits differ: **apocalyptic prophet** (Crossan, Borg), **sage** (Schweitzer, Sanders, Ehrman), **social reformer** (Horsley).
        feedback: |
          Two slips. The criteria only raise or lower probability, each with a limit. And the portraits are given to the wrong scholars: Schweitzer, Sanders and Ehrman see an apocalyptic prophet; Crossan and Borg see a sage.
      - body: |
          Outside sources: Josephus (*Antiquities*, about 115) and Tacitus (*Annals*, about 93 to 94, Pilate under Tiberius). Paul's 1 Thessalonians (about 50) is some **20 years** after Jesus's death (about 30 or 33). Historians use criteria: **multiple attestation**, **embarrassment**, **dissimilarity**, **coherence**; they raise or lower probability and do not prove. Most hold that Jesus was baptized by John and crucified under Pilate.
        feedback: |
          The dates of the two historians are swapped: Josephus wrote about 93 to 94, Tacitus about 115.
    explanation: |
      How history approaches a person with few sources: dated witnesses, criteria with limits, and several portraits from the same evidence.

  - id: paul
    title: Paul and the first churches
    row: 2
    col: 1
    body: |
      Scholars accept **seven** letters as Paul's own (Romans, 1 and 2 Corinthians, Galatians, Philippians, 1 Thessalonians, Philemon). Where **Acts** (about 80 to 90) differs from them, historians usually give priority to the letters. According to Galatians 2:16, a person is made right with God through faith in Christ and not through works of the law. Sanders (1977) argued first-century Judaism was not a religion of earning merit; Dunn (1982) read "works of the law" mainly as the **boundary markers**, such as circumcision and food laws.
    decoys:
      - body: |
          Scholars accept **thirteen** letters as Paul's own. Where **Acts** (about 80 to 90) differs from them, historians usually give priority to the letters. According to Galatians 2:16, a person is made right with God through faith in Christ and not through works of the law. Sanders (1977) argued first-century Judaism was not a religion of earning merit; Dunn (1982) read "works of the law" mainly as the **boundary markers**, such as circumcision and food laws.
        feedback: |
          Thirteen is the number of letters that carry Paul's name. Scholars accept seven; Ephesians and the letters to Timothy and Titus are widely held to be later, and Colossians and 2 Thessalonians are debated.
      - body: |
          Scholars accept **seven** letters as Paul's own. Where **Acts** (about 80 to 90) differs from them, historians usually give priority to Acts. According to Galatians 2:16, a person is made right with God through faith in Christ and not through works of the law. Sanders (1977) argued first-century Judaism was a religion of earning merit; Dunn (1982) read "works of the law" mainly as the **boundary markers**, such as circumcision and food laws.
        feedback: |
          Two slips. Acts is the later source with its own aims, so Paul's own letters take priority; and Sanders argued the opposite, that Judaism was not a religion of earning merit.
    explanation: |
      Paul is the earliest witness we have, and the question he answers (do gentiles need the law?) is read in three ways: Luther's, the New Perspective's, and Paul within Judaism.

  - id: canon
    title: The canon and the manuscripts
    row: 2
    col: 2
    body: |
      Marcion (about 140) proposed the first closed list; Irenaeus (about 180) defended **four** Gospels; Athanasius's Easter letter of **367** is the earliest surviving list of exactly **27** books; the synods of Hippo (393) and Carthage (397) approved it. More than **5,000** Greek manuscripts survive, with estimated 200,000 to 400,000 variants; internal evidence often prefers the **harder** and **shorter** reading. Mark 16:9 to 20 and John 7:53 to 8:11 are absent from the two oldest great codices.
    decoys:
      - body: |
          Marcion (about 140) proposed the first closed list; Irenaeus (about 180) defended **four** Gospels; the council of **Nicaea in 325** fixed the list of **27** books; the synods of Hippo (393) and Carthage (397) approved it. More than **5,000** Greek manuscripts survive, with estimated 200,000 to 400,000 variants; internal evidence often prefers the **harder** and **shorter** reading. Mark 16:9 to 20 and John 7:53 to 8:11 are absent from the two oldest great codices.
        feedback: |
          Nicaea did not discuss the canon. The list grew over centuries; its first surviving form with exactly 27 books is Athanasius's letter of 367.
      - body: |
          Marcion (about 140) proposed the first closed list; Irenaeus (about 180) defended **four** Gospels; Athanasius's Easter letter of **367** is the earliest surviving list of exactly **27** books; the synods of Hippo (393) and Carthage (397) approved it. More than **5,000** Greek manuscripts survive, with estimated 200,000 to 400,000 variants; internal evidence often prefers the **easier** and **longer** reading. Mark 16:9 to 20 and John 7:53 to 8:11 are found in the two oldest great codices.
        feedback: |
          Scribes tended to smooth and to add, so the harder and shorter reading is preferred. And the two oldest great codices, Sinaiticus and Vaticanus, lack both passages.
    explanation: |
      How the list and the text came down to us: a canon that grew, and a very well attested text with many small variants.

  - id: resurrection
    title: The resurrection claim
    row: 2
    col: 3
    body: |
      With $R$ = "Jesus was raised" and $E$ = the evidence, the weighing is Bayes in odds form:
      $$\text{posterior odds}=\text{LR}\times\text{prior odds}$$
      With a likelihood ratio $\text{LR}=10^{4}$, a prior of $10^{-3}$ gives about **91%**, a prior of $10^{-9}$ about **0.001%**. The same evidence gives opposite verdicts because the **prior** comes from a worldview. Hume (1711 to 1776) held that testimony establishes a miracle only if its falsehood would be more miraculous than the event.
    decoys:
      - body: |
          With $R$ = "Jesus was raised" and $E$ = the evidence, the weighing is Bayes in odds form:
          $$\text{posterior odds}=\text{LR}+\text{prior odds}$$
          With a likelihood ratio $\text{LR}=10^{4}$, a prior of $10^{-3}$ gives about **91%**, a prior of $10^{-9}$ about **0.001%**. The same evidence gives opposite verdicts because the **prior** comes from a worldview. Hume (1711 to 1776) held that testimony establishes a miracle only if its falsehood would be more miraculous than the event.
        feedback: |
          The likelihood ratio multiplies the prior odds; it does not add to them. That is why a tiny prior can cancel strong evidence.
      - body: |
          With $R$ = "Jesus was raised" and $E$ = the evidence, the weighing is Bayes in odds form:
          $$\text{posterior odds}=\text{LR}\times\text{prior odds}$$
          With a likelihood ratio $\text{LR}=10^{4}$, a prior of $10^{-3}$ gives about **0.001%**, a prior of $10^{-9}$ about **91%**. The same evidence gives opposite verdicts because the **prior** comes from a worldview. Hume (1711 to 1776) held that testimony never counts for anything.
        feedback: |
          The two outcomes are reversed: the larger prior gives the larger posterior. And Hume's maxim is a condition: testimony suffices only if its falsehood would be more miraculous than the event.
    explanation: |
      The one place in the level where a number carries the argument: history weighs the sources, the worldview supplies the prior, and the same evidence can point both ways.

  - id: creeds
    title: The councils and the creeds
    row: 3
    col: 1
    body: |
      At **Nicaea (325)** the Son was declared *homoousios*, "of the same substance" as the Father, against Arius. The Cappadocians separated **ousia** (the shared being) from **hypostasis** (an individual who has it): one ousia in three hypostases, at Constantinople (381). At Chalcedon (451) about 520 bishops defined **one person in two natures**, divine and human. The emperor Constantine convened Nicaea but did not vote, and the council did not fix the canon.
    decoys:
      - body: |
          At **Nicaea (325)** the Son was declared *homoousios*, "of the same substance" as the Father, against Arius. The Cappadocians separated **hypostasis** (the shared being) from **ousia** (an individual who has it): one hypostasis in three ousiai, at Constantinople (381). At Chalcedon (451) about 520 bishops defined **one person in two natures**, divine and human. The emperor Constantine convened Nicaea but did not vote, and the council did not fix the canon.
        feedback: |
          The two Greek words are swapped. Ousia is the shared being; hypostasis is the individual who has it. The formula is one ousia in three hypostases.
      - body: |
          At **Nicaea (325)** the Son was declared *homoousios*, "of the same substance" as the Father, against Arius. The Cappadocians separated **ousia** (the shared being) from **hypostasis** (an individual who has it): one ousia in three hypostases, at Constantinople (381). At Chalcedon (451) about 520 bishops defined **two persons in one nature**, divine and human. The emperor Constantine convened Nicaea and voted, and the council fixed the canon.
        feedback: |
          Three slips. Chalcedon defined one person in two natures; Constantine convened Nicaea but did not vote; and the council said nothing about the canon.
    explanation: |
      The long argument over how to say that Christ is both divine and human while God is one, in the words of the councils.

  - id: thinkers
    title: Faith, grace and authority
    row: 3
    col: 2
    body: |
      According to Augustine (354 to 430), understanding follows belief; the motto "faith seeking understanding" is **Anselm's** (1033 to 1109). Aquinas (about 1225 to 1274) held that reason can show that God exists but the Trinity is known **only by revelation**. Pelagius held that people can keep the commandments; Augustine, that the will needs **grace**. The East and West split over the **Filioque** and papal authority (1054, lifted 1965). Luther (1483 to 1546) posted his **Ninety-Five Theses in 1517** and held to *sola scriptura*; Trent (1545 to 1563) replied with Scripture and Tradition.
    decoys:
      - body: |
          According to Augustine (354 to 430), understanding follows belief; the motto "faith seeking understanding" is **Anselm's** (1033 to 1109). Aquinas (about 1225 to 1274) held that reason can show that **the Trinity** is true but God's existence is known **only by revelation**. Pelagius held that people can keep the commandments; Augustine, that the will needs **grace**. The East and West split over the **Filioque** and papal authority (1054, lifted 1965). Luther (1483 to 1546) posted his **Ninety-Five Theses in 1517** and held to *sola scriptura*; Trent (1545 to 1563) replied with Scripture and Tradition.
        feedback: |
          Reversed. For Aquinas reason can show that God exists (the Five Ways), while truths such as the Trinity and the Incarnation are known only by revelation.
      - body: |
          According to Augustine (354 to 430), understanding follows belief; the motto "faith seeking understanding" is **Anselm's** (1033 to 1109). Aquinas (about 1225 to 1274) held that reason can show that God exists but the Trinity is known **only by revelation**. Pelagius held that people can keep the commandments; Augustine, that the will needs **grace**. The East and West split over the **Filioque** and papal authority (1054, lifted 1965). Luther (1483 to 1546) posted his **Ninety-Five Theses in 1417** and held to *sola scriptura*; Trent (1545 to 1563) replied with Scripture alone.
        feedback: |
          Two slips. Luther's Theses are from 1517, a century after the date shown. And Trent replied that the gospel is contained in written books and in unwritten traditions, not Scripture alone.
    explanation: |
      Three questions that outlived the councils: faith and reason, grace and effort, and who has the authority to say what the faith is.

  - id: reading
    title: How the Bible is read
    row: 3
    col: 3
    body: |
      Medieval readers settled on **four senses**: literal, allegorical, moral and anagogical. According to Origen (about 185 to about 253), Scripture has body, soul and spirit. Luther and Calvin held that the **literal** (plain) sense counts. **Historical criticism** asks who wrote a text, when, for whom and from what sources (Spinoza 1670, Astruc 1753, Wellhausen 1878). A reading must also ask the **genre**: *Dei Verbum* (1965) says truth is set forth differently in historical, prophetic and poetic texts; the Chicago Statement (1978) affirms inerrancy.
    decoys:
      - body: |
          Medieval readers settled on **four senses**: literal, allegorical, moral and anagogical. According to Origen (about 185 to about 253), Scripture has body, soul and spirit. Luther and Calvin held that the **allegorical** sense counts. **Historical criticism** asks who wrote a text, when, for whom and from what sources (Spinoza 1670, Astruc 1753, Wellhausen 1878). A reading must also ask the **genre**: *Dei Verbum* (1965) says truth is set forth differently in historical, prophetic and poetic texts; the Chicago Statement (1978) affirms inerrancy.
        feedback: |
          Luther and Calvin pressed the literal, plain sense; Calvin even said Origen tortured Scripture away from its true sense.
      - body: |
          Medieval readers settled on **three senses**: literal, allegorical and moral. According to Origen (about 185 to about 253), Scripture has body, soul and spirit. Luther and Calvin held that the **literal** (plain) sense counts. **Historical criticism** asks who wrote a text, when, for whom and from what sources (Spinoza 1670, Astruc 1753, Wellhausen 1878). A reading must also ask the **genre**: *Dei Verbum* (1978) affirms inerrancy; the Chicago Statement (1965) says truth is set forth differently in historical, prophetic and poetic texts.
        feedback: |
          Two slips. There are four senses (the anagogical looks to where one is heading), and the documents are swapped: Dei Verbum is Catholic, 1965; the Chicago Statement is evangelical, 1978.
    explanation: |
      The same book read in different ways, from Origen's layers to the critic's questions: which method one trusts depends on which authority one accepts.

  - id: today
    title: Christianity today
    row: 4
    col: 3
    body: |
      According to Pew (2011), there were about **2.18 billion** Christians in 2010. Europe held about two-thirds of them in 1910 and about **26%** in 2010; sub-Saharan Africa rose from under 9 million to over 516 million; about **61%** now live in the Global South. Pentecostals (279 million) and charismatics (305 million) make about 584 million. Gutiérrez (*A Theology of Liberation*, 1971) called for a preferential option for the poor; Bonhoeffer (1944) asked what Christianity means for a world come of age.
    decoys:
      - body: |
          According to Pew (2011), there were about **2.18 billion** Christians in 2010. Europe held about 26% of them in 1910 and about **two-thirds** in 2010; sub-Saharan Africa rose from under 9 million to over 516 million; about **61%** now live in the Global South. Pentecostals (279 million) and charismatics (305 million) make about 584 million. Gutiérrez (*A Theology of Liberation*, 1971) called for a preferential option for the poor; Bonhoeffer (1944) asked what Christianity means for a world come of age.
        feedback: |
          The direction is reversed: Europe fell from about two-thirds of the world's Christians in 1910 to about 26% in 2010, as the centre moved south.
      - body: |
          According to Pew (2011), there were about **2.18 billion** Christians in 2010. Europe held about two-thirds of them in 1910 and about **26%** in 2010; sub-Saharan Africa rose from under 9 million to over 516 million; about **61%** now live in the Global North. Pentecostals (279 million) and charismatics (305 million) make about 584 million. Bonhoeffer (*A Theology of Liberation*, 1971) called for a preferential option for the poor; Gutiérrez (1944) asked what Christianity means for a world come of age.
        feedback: |
          Two slips. The 61% live in the Global South (the North holds 39%); and the books are swapped: Gutiérrez wrote the 1971 theology of liberation, Bonhoeffer wrote from prison in 1944.
    explanation: |
      The level ends in the present: the faith's centre of gravity has moved, and old questions come back in new forms.

  - id: layers
    title: The three layers
    row: 4
    col: 2
    body: |
      On a claim about Jesus or the Gospels, the **sources, dates and contents** are established fact; which Synoptic solution or portrait fits best is a **live debate**; whether Jesus was raised, is divine, or the books are inspired is a **faith commitment**. History can weigh the evidence and cannot, by itself, settle a commitment; counting believers does not settle it either.
    decoys:
      - body: |
          On a claim about Jesus or the Gospels, the **sources, dates and contents** are a faith commitment; which Synoptic solution or portrait fits best is a **live debate**; whether Jesus was raised, is divine, or the books are inspired is **established fact**. History can weigh the evidence and cannot, by itself, settle a commitment; counting believers does not settle it either.
        feedback: |
          The layers are mixed up. The sources and their dates are established; the resurrection, divinity and inspiration are commitments, which neither a historian's result nor a head count can prove or refute.
      - body: |
          On a claim about Jesus or the Gospels, the **sources, dates and contents** are established fact; which Synoptic solution or portrait fits best is a **faith commitment**; whether Jesus was raised, is divine, or the books are inspired is a **live debate** among historians. History can weigh the evidence and cannot, by itself, settle a commitment; counting believers does not settle it either.
        feedback: |
          The middle and last layers are swapped. Which solution fits best is argued on evidence, so it is a debate; whether Jesus was raised or is divine goes beyond what history can decide, so it is a commitment.
    explanation: |
      The habit the whole level teaches: before arguing a claim, say which layer it belongs to.

