id: ch15-challenge-2
title: "Level Challenge: Reading the Gospels Fairly (2)"
kind: challenge

cards:
  - type: text
    id: recall
    title: "Challenge, part 2: the toolkit again"
    body: |
      Part 2 stands alone. It uses two real episodes and one closing weighing, each claim labelled **[H]** (the historian's tools) or **[B]** (the believer's reading). The toolkit, restated:

      - **Dates ladder** (all approximate): death of Jesus about 30; the letter 1 Thessalonians about 50; Mark about 65 to 75; Matthew and Luke about 80 to 90; Josephus's *Antiquities* about 93 to 94; Tacitus about 115. A gap is a later date minus an earlier one.
      - **Four criteria of authenticity**: attestation (several independent sources), embarrassment (a detail that hurt the early church), dissimilarity (unlike both Judaism and the later church), coherence (fits what is already secure). They give *more or less probable*, never *proved*.
      - **Bayes in odds form**, for a hypothesis $H$ and evidence $E$:

      $$\text{posterior odds}=\text{LR}\times\text{prior odds}$$

      where LR is the likelihood ratio, how much likelier the evidence is if $H$ is true than if it is false. The LR is argued from the evidence; the prior comes from the worldview each reader brings.
      - **Canon criteria**: churches asked of a book whether it had apostolic origin, wide use, and agreement with the faith already held. The lists record reception, not verification.
      - **Three layers**: (1) established fact, (2) scholarly consensus or live debate, (3) faith or metaphysical commitment. A claim never moves up a layer by being repeated.
      - **Reading the creeds**: *ousia* is what is shared (a general nature), *hypostasis* is the particular individual who has it. Christians say *one ousia in three hypostases*.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · Nicaea, Arius and Athanasius"
    body: |
      **Problem 4.** A real debate of the level. In Alexandria in Egypt, about 318 to 320, the presbyter **Arius** (about 250 or 256 to 336) clashed with his bishop **Alexander**. According to Arius, as his opponents report him, the Son was created by the Father before the world, so "there was a time when he was not". According to Alexander, and later to **Athanasius** (about 296 to 373, who was a deacon at the time), the Son is eternally born of the Father and truly God.

      In 325 the emperor **Constantine** called the bishops to **Nicaea** (in what is now Turkey). Most signed a creed saying the Son is *homoousios* with the Father (Greek, "of one being"). Arius and two others refused and were exiled. Later councils returned to the question: Constantinople in 381, Ephesus in 431, Chalcedon in 451.

      The task: say what each side feared, separate the two Greek words that finally made the doctrine speakable, put the councils in order with the gaps in years, and sort what history can show from what only faith can say.

  - type: mcq
    id: p4-fears
    title: "What did each side fear?"
    prompt: |
      According to the accounts of Arius and of Athanasius, which pairing states what each side was trying to protect?
    options:
      - text: "Arius wanted to protect the oneness of God, and feared that calling the Son fully God made two Gods. Athanasius wanted to protect salvation, and held that a Son who was a creature could not save, since one would then be saved by something less than God."
        correct: true
        feedback: |
          Yes. Each side saw itself as guarding something essential, and a fair account takes the arguments as the people gave them.
      - text: "Arius wanted to please the emperor, and Athanasius wanted the Bible to be shorter."
        feedback: |
          Politics entered later, and Constantine's role is real, but the surviving arguments are about God and salvation. The canon was not on the agenda at Nicaea.
      - text: "Arius denied that Jesus existed, and Athanasius insisted he did."
        feedback: |
          Neither doubted that Jesus lived. The question was how he relates to God, whom both called one.
    explanation: |
      Both sides shared the same scriptures and the same worry about worshipping something that is not God. They differed over which danger was greater: two Gods, or a saviour who is less than God.

  - type: mcq
    id: p4-terms
    title: "Two words for one problem"
    prompt: |
      The creed of 325 says the Son is *homoousios* (of one *ousia*) with the Father. Later, Basil of Caesarea (330 to 379) and the two Gregorys gave *ousia* and *hypostasis* separate jobs. Which statement matches their formula?
    options:
      - text: "Ousia is what is shared, like humanity shared by all humans; hypostasis is the particular individual who has it. God is one ousia in three hypostases: Father, Son and Spirit."
        correct: true
        feedback: |
          Yes. Basil compared the relation to the general and the particular. The comparison with humans helps and also warns, because three humans are three beings, and the doctrine says the three are one God.
      - text: "Ousia is the individual and hypostasis is the shared nature, so God is three ousiai in one hypostasis."
        feedback: |
          The two roles are swapped. Mnemonic: ousia is the what, hypostasis is the who.
      - text: "Both words mean exactly the same, so the formula says only that God is one."
        feedback: |
          If they meant the same, "one ousia in three hypostases" would be a plain contradiction. The point of the formula is that the two words answer two questions.
    explanation: |
      A critic can still say "one and three" sounds contradictory; the churches reply that "one" and "three" apply to different things. Whether that reply works is a [H]-and-[B] mixture: the history of the words is a fact, whether the formula describes God is a commitment.

  - type: order
    id: p4-order
    title: "Put the councils in order"
    prompt: "Put these four councils in order, earliest first."
    steps:
      - "Nicaea (325): the Son is of one being with the Father; Arius exiled"
      - "Constantinople (381): the creed's statement about the Holy Spirit is completed"
      - "Ephesus (431): Mary is called Theotokos, God-bearer; Nestorius deposed"
      - "Chalcedon (451): Christ is one person in two natures, without confusion, change, division or separation"
    hint: Between the first and the last there are about four generations.
    explanation: |
      The first two councils are about who God is; the last two are about how Christ is both God and human.

  - type: numeric
    id: p4-gap1
    title: "From Nicaea to Constantinople"
    prompt: |
      Nicaea met in 325 and Constantinople in 381. How many years separate them?
    answer: 56
    wrong:
      - { value: 706, feedback: "That adds the two years. A gap is a later date minus an earlier one." }
      - { value: 126, feedback: "That is 451 minus 325, the gap to Chalcedon. Here the later council is Constantinople, 381." }
    explanation: |
      $381-325=56$ years, about two generations. Some historians stress that the doctrine of the Trinity was worked out in the fourth century; believers hold that the councils made explicit what the New Testament already implied. Both can agree on the dates, which is a layer-one fact.

  - type: numeric
    id: p4-gap2
    title: "From Constantinople to Chalcedon"
    prompt: |
      Constantinople met in 381 and Chalcedon in 451. How many years separate them?
    answer: 70
    wrong:
      - { value: 126, feedback: "126 is the whole span from 325 to 451. The question asks only for 381 to 451." }
      - { value: 56, feedback: "56 is the gap from Nicaea to Constantinople. Subtract 381 from 451." }
    explanation: |
      $451-381=70$, and $56+70=126=451-325$. Chalcedon came four and a half generations after Nicaea; "the Church always said exactly this" and "the doctrine was invented late" both skip this slow, argued process.

  - type: text
    id: p4-phil
    title: "One fragment, two readings"
    body: |
      Both camps cite early texts. Philippians, a letter of Paul from the 50s, says in the NRSV translation that Christ Jesus "though he was in the form of God, did not regard equality with God as something to be exploited, but emptied himself, taking the form of a slave, being born in human likeness" (2:6-7). Many scholars think Paul is quoting an older hymn.

      **[B] A believer's reading.** According to Christians who read it as the councils did, the phrases say that the Son, who was in the divine form, humbled himself by becoming human. The fragment shows that the belief that Christ is God was there from the first generation, and the councils later put it in precise words.

      **[H] A critical reading.** According to many historians, the first question is what the author and first readers meant: Paul uses the passage to urge humility in a young church at Philippi, and "form of God" is not yet the vocabulary of *ousia* and *hypostasis*, which belong to later Greek debate. The text is early evidence of high language about Jesus, not a statement of the formula of 325 or 451.

  - type: mcq
    id: p4-phil-q
    title: "What does each reading ask?"
    prompt: |
      Both readings take the Philippians fragment seriously. What separates them?
    options:
      - text: "The believer's reading asks what the text says about who Christ is, in the light of the church's later teaching. The critical reading asks first what the author meant for his first readers. A person may do both, and the question of whether the later teaching is true is a commitment neither reading can settle from the fragment."
        correct: true
        feedback: |
          Yes. The two start from different questions, and many Christians work with both. Early evidence for exalted language is a [H] matter; that the language was true of God is a [B] commitment.
      - text: "The critical reading is hostile to Christianity and the believer's reading is blind to history."
        feedback: |
          Critical reading is a method, practised by believers and non-believers. And believers who read in the light of the creeds can also know the history well.
      - text: "The believer's reading takes the passage literally and the critical one does not, because only believers think the words mean something."
        feedback: |
          Both look for meaning. "Literal" has two uses: word for word, and the sense the author intended. The critical reading aims precisely at the author's intended sense.
    explanation: |
      The same eleven words can serve as evidence for a date of belief (early), as a text about humility, and as a later creed's root. These are three questions, not three conflicting facts.

  - type: text
    id: p4-clause
    title: "A creed clause, read twice"
    body: |
      The creed of 325 says in essence that the Son is begotten, not made, and of one being with the Father. Two readers, each stated as its defenders would accept it.

      **[B]** According to many Christians, this clause names the truth about Christ that the New Testament already pointed to, and the councils were guided by the Spirit to put it in the Greek words that excluded Arius's view.

      **[H]** According to many historians, the clause answered a controversy of the fourth century, in the vocabulary of Greek philosophy (*ousia* and *hypostasis* are philosophical terms). Some scholars add that the councils gave a particular answer where the first writings allowed several, and that the vote, the exile of Arius and the weight of the emperor all helped the answer prevail.

  - type: mcq
    id: p4-sort
    title: "Which layer?"
    prompt: |
      Select every statement that belongs to the third layer (faith or metaphysical commitment), as opposed to established fact or live debate.
    multiple: true
    options:
      - text: "The councils stated truly who Christ is."
        correct: true
        feedback: |
          Correct: whether the creeds are true is a commitment. History can describe what the councils decided and why, not whether the decision was right.
      - text: "The creeds brought foreign Greek philosophy into the first message, so they distort it."
        correct: true
        feedback: |
          Correct: this is also a commitment, in the other direction. It takes a view of what the first message was and of what counts as distortion.
      - text: "Constantine called the council and did not vote; Arius and two others were exiled after it."
        feedback: |
          This is a layer-one statement about what happened, supported by several ancient sources.
      - text: "How decisive the emperor's influence was in shaping the outcome."
        feedback: |
          This is layer two: historians weigh the evidence and differ over how much politics shaped the result.
    explanation: |
      The pattern of the whole level shows again: dates and decisions are shared, the weight of politics is argued, and what the councils meant for the truth about God is where readers part.

  - type: mcq
    id: p4-constantine
    title: "Which claim is fair?"
    prompt: |
      A friend says: "Constantine invented the divinity of Christ at Nicaea in 325." Which reply is fair and accurate?
    options:
      - text: "Constantine convened the council and used his authority to enforce the outcome, but he did not vote, and writings from before 325 already speak of Jesus in divine language. What the council did was answer a dispute about how to put that belief precisely."
        correct: true
        feedback: |
          Yes. His role as convener and enforcer is real; the claim that he created the belief is not supported, since the debate with Arius was already running and the divine language is older.
      - text: "Constantine had nothing to do with the council, which was entirely a church matter."
        feedback: |
          He summoned the bishops and exiled Arius after the vote. Politics mattered, as a fair account says.
      - text: "The council voted on which books belong in the Bible, so Constantine chose the Bible."
        feedback: |
          Nicaea did not discuss the canon. The lists of books formed later and more slowly, as the lesson on the canon shows.
    explanation: |
      Two popular claims, both false in their strong form, each contain a half-truth: the emperor mattered, and the belief was shaped by debate. A fair reader keeps both halves and rejects the strong form.

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-setup
    title: "Problem 5 · A closing weighing"
    body: |
      **Problem 5.** The whole level in one problem. Christianity began as a small movement of Jews in the Roman provinces and is now the largest religion on earth by number of adherents. The task: read the numbers of its growth, compare what the three large families of Christians say about authority, and weigh one claim with its best defender and its best critic.

      The numbers come from the Pew Research Center's 2011 report on global Christianity, built from censuses and surveys for the year 2010, with the caution that definitions of who counts differ and estimates were later revised.

  - type: numeric
    id: p5-growth
    title: "How much did Christianity grow in sub-Saharan Africa?"
    prompt: |
      Pew reports fewer than 9 million Christians in sub-Saharan Africa in 1910 and more than 516 million in 2010. Using 9 and 516 (millions), by what factor did the number of Christians multiply? Give one decimal.
    answer: 57.3
    tolerance: 0.1
    wrong:
      - { value: 507, feedback: "507 is the difference, 516 minus 9, in millions. The question asks how many times larger, which is a ratio." }
      - { value: 0.0174, feedback: "That is 9 divided by 516, the ratio the wrong way round." }
    hint: A factor of growth is the later number divided by the earlier one.
    explanation: |
      $516/9\approx 57.3$, about 57-fold with these rounded figures (Pew's report says roughly 60-fold, since 9 million was an upper bound). The numbers are estimates, so "about sixty times" is the honest way to say it. This is a layer-one matter: it says nothing yet about whether the faith is true.

  - type: numeric
    id: p5-south
    title: "How many Christians in the Global South?"
    prompt: |
      Pew finds that about 2.18 billion people were Christians in 2010 and that 61% of them lived in the Global South. How many billions is that? Give two decimals.
    answer: 1.33
    tolerance: 0.01
    wrong:
      - { value: 0.85, feedback: "0.85 is 39% of 2.18, the Global North. The South is the 61%." }
      - { value: 133, feedback: "Convert the percentage to a fraction first: 61% is 0.61, not 61." }
    explanation: |
      $0.61\times 2.18\approx 1.33$ billion, matching Pew's "more than 1.3 billion". The sign of the shift: Europe held about two-thirds of the world's Christians in 1910 and 26% in 2010, so Christianity today is mostly a faith of Africa, Asia and Latin America.

  - type: mcq
    id: p5-demography
    title: "What do the numbers show?"
    prompt: |
      Someone argues from the Pew numbers: "Over 2 billion Christians, mostly in the Global South, so Christianity must be true." Another replies: "These numbers show Christianity is fading." Which assessment is fair?
    options:
      - text: "Both skip a step. The counts are layer-one facts about how many people identify as Christian, and they show a shift of the centre of gravity to the South, not a decline of the world total. They say nothing about whether any Christian belief is true, because many people can believe a thing for many reasons."
        correct: true
        feedback: |
          Yes. A number of adherents is a fact about people, not evidence of the claims by itself. And Europe's fall is a regional trend, not the world total.
      - text: "The first argument is sound, because the largest religion must be the true one."
        feedback: |
          Size does not measure truth. By that rule the answer would have changed with the century. The same reasoning would also be used by each large tradition.
      - text: "The second is sound, because Europe's share fell from two-thirds to 26%."
        feedback: |
          The share of Europe fell, but the world total and the Southern numbers rose. A trend in one region is not a trend of the whole.
    explanation: |
      This is the discipline the level teaches: a statistic can be solid and still be used for a claim it does not support.

  - type: mcq
    id: p5-authority
    title: "Who has the last word?"
    prompt: |
      Three large families of Christians answer the question of authority differently. Which pairing is fair to each, as its members would state it?
    options:
      - text: "Catholic: Scripture and Tradition form one deposit, and its authentic interpretation belongs to the church's teaching office (the pope and the bishops). Orthodox: Scripture lives within Holy Tradition, as expressed above all in the seven councils. Protestant: Scripture is the final authority and tradition is subordinate to it."
        correct: true
        feedback: |
          Yes. These are summaries, and members of each family speak in more varied ways, but they are the usual centres of the three views.
      - text: "Catholic: the Bible alone. Orthodox: the pope alone. Protestant: the councils alone."
        feedback: |
          Each is attached to the wrong family. "Bible alone" (sola scriptura) is the Protestant principle; the Catholic view includes the pope and bishops; the Orthodox point to the councils.
      - text: "All three say that the individual reader decides what the Bible means, with no role for the church."
        feedback: |
          None of the three says this. Protestants hold Scripture as final but still read it in churches and with creeds; the other two give the church a central role.
    explanation: |
      The three agree on much, including the creeds of Nicaea and Constantinople, and differ on who decides when readers disagree. That is a question of authority, a commitment that no manuscript settles.

  - type: mcq
    id: p5-weigh
    title: "Best defender, best critic"
    prompt: |
      Take one claim: "The creeds of the fourth and fifth centuries state faithfully what the New Testament teaches about Jesus." Which pair gives the strongest form of each side?
    options:
      - text: "Defender: the New Testament already uses divine language of Jesus (as in Philippians), the councils met an actual challenge, and only precise words could exclude a reading its first writers would also have rejected. Critic: the New Testament's language is varied, the creeds use Greek categories the first writers did not, and imperial power helped decide the outcome."
        correct: true
        feedback: |
          Yes. Each is stated as its best advocates would, and each rests on a premise the other rejects: whether later precision is development or change.
      - text: "Defender: the claim is true because the councils were large. Critic: the claim is false because Constantine was emperor."
        feedback: |
          Both are weak forms. Size of a council does not establish truth, and an emperor's presence does not by itself refute a doctrine (that would be the genetic fallacy).
      - text: "Defender: the claim is a mathematical theorem. Critic: the claim is a meaningless noise."
        feedback: |
          The claim is not a theorem, and it is not meaningless: it can be examined with evidence about the texts and the debates, though its final step needs a commitment.
    explanation: |
      A fair reader can accept that the New Testament has high language about Jesus (layer one), that historians differ on how far the creeds develop or alter it (layer two), and that whether the development is true is a commitment (layer three).

  - type: mcq
    id: p5-parting
    title: "Where do thoughtful readers part ways?"
    prompt: |
      A committed Christian, a committed sceptic and an agnostic read the same evidence for the claim "Jesus was raised from the dead", with the same toy likelihood ratio of $10^{4}$ but priors of $10^{-3}$, $10^{-9}$ and $10^{-6}$ for the three of them. Using $\text{posterior odds}=\text{LR}\times\text{prior odds}$ (and treating the prior as the odds that this happens at all), which statement describes the result?
    options:
      - text: "The posterior odds are 10, $10^{-5}$ and $10^{-2}$, about 91%, 0.001% and 1%. They agree on the evidence and the arithmetic and differ in the prior, which comes from what each holds about whether God acts. A fair discussion names the prior openly."
        correct: true
        feedback: |
          Yes: $10^4\times10^{-3}=10$, $10^4\times10^{-9}=10^{-5}$, $10^4\times10^{-6}=10^{-2}$. The spread sits in layer three.
      - text: "The three must end at the same number, since they use the same likelihood ratio."
        feedback: |
          The ratio is shared but the prior is not, and the prior multiplies it. A shared method does not give a shared verdict.
      - text: "The arithmetic shows which prior is right."
        feedback: |
          The arithmetic takes the prior as input; it cannot choose it. That is why the dispute shifts to the prior.
    explanation: |
      This is a toy: real arguments do not have one clean number. The point is the structure of the disagreement. Established: the sources and the dates. Debate: how strongly the evidence points. Commitment: the prior.

  - type: mcq
    id: p5-layers
    title: "Sort the closing claims"
    prompt: |
      Match each claim to a layer. Select the pair in which the label is correct.
    options:
      - text: "'More than 2 billion people identify as Christian' is layer one. 'The Gospels used earlier sources' is layer two. 'The church was guided by the Spirit in the creeds' is layer three."
        correct: true
        feedback: |
          Yes. A count is a fact; the use of earlier sources is a consensus with live disputes about which; guidance by the Spirit is a commitment.
      - text: "'More than 2 billion people identify as Christian' is layer three, because religion is always a faith matter."
        feedback: |
          A count of self-identified adherents is a fact about people. The layers classify claims, not topics.
      - text: "'The church was guided by the Spirit in the creeds' is layer one, because the councils really happened."
        feedback: |
          That the councils happened is layer one; that they were guided by the Spirit is a commitment, and merging them moves a layer-three claim up.
    explanation: |
      The same topic holds claims from all three layers. The skill is to sort claim by claim.

  - type: text
    id: closing
    title: "What these two problems used"
    body: |
      Problem 4 put Arius against Athanasius: each feared losing something real (one God, a Saviour who is truly God), and the Cappadocian formula gave two words two jobs, *ousia* as what is shared and *hypostasis* as who has it. The councils came at gaps of

      $$\begin{gathered}381-325=56\\451-381=70\\451-325=126\end{gathered}$$

      years. The Philippians fragment was read in a believer's way and in a critical way, and the creed clause was sorted: dates and decisions are layer one, the weight of politics is layer two, whether the creeds are true is layer three. Constantine convened and enforced, but he neither voted nor invented the belief.

      Problem 5 read the numbers (about $516/9\approx 57$ times more Christians in sub-Saharan Africa from 1910 to 2010; $0.61\times 2.18\approx 1.33$ billion in the Global South), the three families of authority, and the structure of disagreement,

      $$\text{posterior odds}=\text{LR}\times\text{prior odds},$$

      where the evidence is shared and the prior comes from a worldview. A fair reader of any belief can accept the first layer, argue the second, and say openly where the third begins.

      **Next:** the Level Review replays this level's questions at spaced intervals. Then the next lesson begins Islam and the Qur'an, with Arabia before Islam.
