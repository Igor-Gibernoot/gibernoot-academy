id: ch15-today
title: "Christianity Today"
kind: concept
own: |
  The setting: Christianity in the twentieth and twenty-first centuries, with about 2.18 billion people counted as Christians in 2010 (Pew Research Center's 2011 estimate; self-identified, all branches together). Everything is taught according to someone, and the numbers are estimates.
  - **The shift south.** According to Pew's 2011 report, Europe held about two-thirds of the world's Christians in 1910 and about {{ 26% }} in 2010, while sub-Saharan Africa went from fewer than 9 million Christians to more than 516 million (a rise of roughly 60 times). In 2010 about 61% of Christians lived in the Global South (roughly Africa, Latin America and most of Asia) and 39% in the Global North. According to Philip Jenkins (*The Next Christendom*, 2002), the centre of Christianity is moving to Africa, Asia and Latin America.
  - **Pentecostalism.** It teaches that believers should seek a second experience after conversion, the {{ baptism of the Holy Spirit }}, with gifts such as speaking in tongues, healing and prophecy. Historians treat the Azusa Street revival in Los Angeles (1906, led by William J. Seymour, about 1870 to 1922) as the main catalyst for its spread. Pew counted about 279 million Pentecostals and 305 million charismatics (the same practices inside Catholic, Orthodox and other older churches), about 584 million together, roughly a quarter of all Christians.
  - **Liberation theology.** According to Gustavo Gutiérrez (1928 to 2024), whose *A Theology of Liberation* appeared in 1971, theology is {{ critical reflection on Christian practice in the light of the Word }}, and the church should take a preferential option for the poor. It grew from the Latin American bishops' conference at Medellín (1968). The Vatican's 1984 instruction criticised strands that adopt Marxist analysis as the base of theology; defenders reply that social analysis is not the same as Marxist ideology.
  - **Secular Christianity.** According to Dietrich Bonhoeffer (1906 to 1945), writing from prison in 1944, the question is what Christianity means for a world that has {{ come of age and no longer needs religion }} as before, which he called "religionless Christianity" (scholars debate what he meant). John A. T. Robinson's *Honest to God* (1963) and Harvey Cox's *The Secular City* (1965) carried such questions to a wide public.
  - **Disagreement.** Established: the census-style numbers (as estimates), the dates and the documents. Debated: how far the Global South is more conservative than the North, and how to read Bonhoeffer. Commitment: whether counting believers says anything about whether the faith is true (it does not settle it either way).

cards:
  - type: mcq
    id: hook
    title: "Where do Christians live?"
    prompt: |
      Guess before any theory. In 1910, about two-thirds of the world's Christians lived in Europe. According to Pew Research Center's 2011 estimate, what share of the world's Christians lived in Europe in 2010?
    options:
      - text: "About a quarter (26%)."
        correct: true
        feedback: |
          Yes. Europe went from about two-thirds to about a quarter in a century, even though many Europeans are still Christian.
      - text: "Still about two-thirds, since Christianity began as a European religion."
        feedback: |
          Christianity began in the Roman East (Judea, Syria, Asia Minor, Egypt) and only later became centred on Europe. By 2010 the centre had moved again.
      - text: "About one half."
        feedback: |
          A natural middle guess, but the drop was larger than that.
      - text: "Under 5%."
        feedback: |
          Too far the other way: about 26% is still about 560 million people in Europe.
    explanation: |
      The lesson follows what happened: where Christianity grew, and three movements that shaped it in the last century, Pentecostalism, liberation theology and a secular reading of the faith.

  - type: text
    id: shift
    title: "A century that moved the centre"
    body: |
      According to Pew's 2011 report *Global Christianity*, which used historical estimates of the Center for the Study of Global Christianity, about **2.18 billion** people counted as Christians in 2010, nearly a third of the world's population. Counting is by self-description: a person who says "I am a Christian" is counted, whatever they believe or practise.

      | Place | 1910 | 2010 |
      |---|---|---|
      | Europe, share of all Christians | about two-thirds | 26% |
      | Sub-Saharan Africa, Christians | fewer than 9 million (9% of its people) | more than 516 million (63% of its people) |
      | Global South, share of all Christians | | 61% (over 1.3 billion) |
      | Global North, share of all Christians | | 39% (about 860 million) |

      "Global South" and "Global North" are Pew's regional groupings: roughly Africa, Latin America and most of Asia against Europe and North America. The words are mostly about place, and the exact list of countries is a convention.

  - type: numeric
    id: growth
    title: "How fast did Africa grow?"
    prompt: |
      Sub-Saharan Africa had about 9 million Christians in 1910 and about 516 million in 2010 (Pew's estimate). By what factor did the number multiply? Give the ratio, to the nearest whole number.
    answer: 57
    tolerance: 1
    wrong:
      - { value: 507, feedback: "That is the difference in millions (516 - 9), not the factor. A factor is a ratio: divide the later number by the earlier." }
    hint: "Divide 516 by 9."
    explanation: |
      $516/9 \approx 57$, which Pew's report calls roughly sixty-fold. The population of sub-Saharan Africa also grew a lot, so the share of Christians in it (9% to 63%) is the fairer measure of conversion and growth together.

  - type: numeric
    id: south-share
    title: "A share from two counts"
    prompt: |
      In 2010 about 1.3 billion Christians lived in the Global South and about 0.86 billion in the Global North. What percentage of all Christians lived in the Global South? Round to the nearest whole number.
    answer: 60
    tolerance: 1.5
    wrong:
      - { value: 40, feedback: "That is close to the Northern share (0.86 out of 2.16). Make sure the South is the numerator." }
      - { value: 151, feedback: "That is the ratio South to North (1.3/0.86). A percentage of all Christians divides by the total of both groups." }
    hint: "The total is the sum of the two groups."
    explanation: |
      $1.3/(1.3+0.86) \approx 0.60$. Pew's rounder figures give 61%. The exact value shifts with rounding; the message is that about three in five Christians lived in the Global South.

  - type: mcq
    id: jenkins
    title: "What Jenkins argued"
    prompt: |
      Philip Jenkins's *The Next Christendom: The Coming of Global Christianity* (2002) is a widely cited study of this shift. According to Jenkins, which description fits his main claim?
    options:
      - text: "Christianity's centre of gravity is moving to Africa, Asia and Latin America, and a new Christendom is forming there."
        correct: true
        feedback: |
          Yes. Jenkins argued that Christians in the Global South already outnumbered those in Europe, North America, Russia and Japan, and that their churches would shape the faith's future.
      - text: "Christianity is dying out everywhere as science advances."
        feedback: |
          This is the "secularization" story, true of parts of Europe but not a description of the world total, as the numbers above show.
      - text: "Christianity remains a mainly European and American faith."
        feedback: |
          That was true of 1910, which is why the change is news to many Western readers.
    explanation: |
      Notice the logic of the claim: it is about demography, a layer-1 matter that can be checked. It says nothing yet about whether the faith is true, a point the lesson returns to at the end.

  - type: text
    id: counting
    title: "A word on the counting"
    body: |
      Pew's figures are estimates from censuses, surveys and the Center's own records. Definitions differ (who counts as a Christian: baptised, self-identified, or regular attender?), and Pew itself revised its 2010 estimates in a June 2025 report. So read each number as "about", and read a trend as stronger evidence than any single figure. The direction found by every study here is the same: Europe's share falls and the Global South's rises.

  - type: text
    id: azusa
    title: "Pentecostalism: Azusa Street, 1906"
    body: |
      **Pentecostalism** takes its name from Pentecost, the day described in the Acts of the Apostles when the followers of Jesus receive the Holy Spirit. Pentecostal churches teach that believers should seek a further experience after conversion, called the **baptism of the Holy Spirit**, which may bring gifts such as prophecy, healing and **speaking in tongues** (*glossolalia*, speech in a language the speaker has not learned, or in sounds taken to be a prayer language).

      Historians usually start the movement's global spread at Los Angeles in 1906. **William J. Seymour** (born about 1870, died 1922), a Black preacher and the son of formerly enslaved parents, led meetings that began at a house on Bonnie Brae Street on 9 April 1906 and moved to a former church building at 312 Azusa Street, where the first meeting was held on 14 April. People of different races and classes worshipped together, in the era of Jim Crow segregation, and women took leadership roles. The *Los Angeles Times* of that year ran a mocking story titled "Weird Babel of Tongues". Missionaries who passed through Azusa Street helped carry the message abroad within a few years.

  - type: mcq
    id: azusa-q
    title: "What does the Azusa Street story show?"
    prompt: |
      According to historians of the Azusa Street revival (Los Angeles, 1906), which description is best supported?
    options:
      - text: "A new movement led by a Black preacher, with worshippers of many races, that historians treat as the main catalyst for 20th-century Pentecostalism, and that outsiders mocked."
        correct: true
        feedback: |
          Yes. All of these points appear in the historical accounts, including the newspaper's hostile coverage.
      - text: "A movement created by a Vatican council to renew the Catholic Church."
        feedback: |
          Catholic charismatic renewal came later and inside an older church. Pentecostalism began in small Protestant and Holiness circles.
      - text: "A local event with no later influence, remembered only by Los Angeles historians."
        feedback: |
          The opposite is the standard view: the meetings sent missionaries to many countries within a few years.
    explanation: |
      Origins matter for the debates ahead. Some accounts stress that Seymour had studied under the preacher Charles Parham in Texas, so the movement's roots are traced in more than one place. Historians agree, though, that Azusa Street became its best-known centre.

  - type: mcq
    id: pentecostal-charismatic
    title: "Pentecostal or charismatic?"
    prompt: |
      Pew's 2011 report counted about 279 million Pentecostals and 305 million charismatics, about 584 million in all. What is the difference between the two groups, according to the report?
    options:
      - text: "Pentecostals belong to distinct Pentecostal denominations or independent churches; charismatics practise similar gifts (healing, prophecy, tongues) inside non-Pentecostal churches, such as Catholic or Orthodox ones."
        correct: true
        feedback: |
          Yes. Together they are roughly a quarter of all Christians, and the two groups overlap in practice if not in membership.
      - text: "Pentecostals are Protestant and charismatics are Catholic only."
        feedback: |
          Charismatics are found in Catholic, Orthodox and many Protestant churches, anywhere outside the Pentecostal denominations.
      - text: "Pentecostals reject speaking in tongues and charismatics practise it."
        feedback: |
          Both groups practise the gifts; what separates them is the kind of church they belong to.
    explanation: |
      About 44% of the world's Pentecostals lived in sub-Saharan Africa and 37% in the Americas, according to the same report. So Pentecostalism is a main reason why the Global South figures grew.

  - type: text
    id: liberation
    title: "Liberation theology: the poor at the centre"
    image:
      - src: img/gutierrez.webp
        alt: "Portrait photograph of the Peruvian theologian Gustavo Gutiérrez"
        caption: "Gustavo Gutiérrez (1928 to 2024), the Peruvian priest whose 1971 book gave liberation theology its name."
        credit: "Mohan, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Gustavo_gutierrez_(Peruvian_theologian).jpg"
    body: |
      **Liberation theology** began in Latin America in the late 1960s, where many Catholics lived in deep poverty under unequal and sometimes violent regimes. Its background is the 1968 conference of Latin American Catholic bishops at Medellín, Colombia; the Medellín documents are not themselves a work of liberation theology, but they laid the ground for it.

      Its best-known author is the Peruvian priest **Gustavo Gutiérrez** (1928 to 2024), whose book *A Theology of Liberation* appeared in Spanish in 1971 (in English in 1973). He described theology as **critical reflection on Christian practice in the light of the Word**: faith first shows itself in action with the poor, and theology is the second step, reflecting on that action in the light of Scripture. Gutiérrez also made the phrase **preferential option for the poor** famous. He stressed that "preferential" does not mean the poor alone are loved; it means they come first in the church's attention.

  - type: mcq
    id: praxis
    title: "Theology as a second step"
    prompt: |
      According to Gutiérrez, theology is "critical reflection on Christian practice in the light of the Word". Which statement best captures what he meant?
    options:
      - text: "Christian life, especially action alongside the poor, comes first; theology then reflects critically on that practice in the light of Scripture."
        correct: true
        feedback: |
          Yes. He called theology the "second act": it does not replace practice, it examines it.
      - text: "Theology should begin from abstract principles and later be applied to society."
        feedback: |
          This is the order that liberation theologians criticised. For them, practice and theory inform each other from the start.
      - text: "Only politics matters, and Scripture is no longer needed."
        feedback: |
          The definition says "in the light of the Word": Scripture is still the standard, read from the standpoint of the poor.
    explanation: |
      Supporters say this method takes the Bible's concern for the poor seriously. Critics asked whether starting from a social situation might let the situation set the questions. The next card gives the official reply.

  - type: text
    id: vatican
    title: "Two replies: the Vatican and the defenders"
    body: |
      In 1984, the Vatican's Congregation for the Doctrine of the Faith, led by Cardinal Joseph Ratzinger, issued the instruction *Libertatis nuntius* ("On Certain Aspects of the Theology of Liberation", dated 6 August 1984). It warned that uncritical borrowings from Marxist analysis could bend the Christian message, and that strands taking Marxist principles as the foundation of theology were incompatible with the faith. A second instruction on Christian freedom and liberation followed on 22 March 1986, in a more positive tone.

      Defenders answered that a theologian may use social science, including some tools from Marx, to describe poverty, without adopting an atheist philosophy of history. They pointed to the cost paid by church workers: Archbishop Óscar Romero of San Salvador was shot dead while saying Mass on 24 March 1980, the day after appealing to soldiers not to kill civilians (he was later canonised).

  - type: mcq
    id: vatican-q
    title: "Reading the dispute fairly"
    prompt: |
      A debate: critic says "liberation theology is Marxism in a cassock"; defender says "liberation theology is just Christian charity". According to the sources in this lesson, what is the fairest summary?
    options:
      - text: "The 1984 instruction objected to adopting Marxist analysis as the base of theology, while defenders held that social analysis is not an ideology and that the option for the poor is rooted in Scripture."
        correct: true
        feedback: |
          Yes. Each side is saying something a fair reader can state in its own terms, and the 1986 instruction was more positive.
      - text: "The Vatican condemned every form of care for the poor."
        feedback: |
          The instruction named a risk in certain strands, and a second, more positive text followed in 1986.
      - text: "All liberation theologians were Marxists."
        feedback: |
          The instruction itself distinguished kinds of liberation theology. Gutiérrez and others said they used analysis, not Marxist philosophy.
    explanation: |
      The dispute turns on a premise: whether a method can be separated from the philosophy it came from. That is a debated matter, not a settled fact.

  - type: text
    id: secular
    title: "Secular Christianity: faith without \"religion\"?"
    image:
      - src: img/bonhoeffer.webp
        alt: "Black and white portrait photograph of Dietrich Bonhoeffer"
        caption: "Dietrich Bonhoeffer (1906 to 1945), the German pastor whose prison letters asked what Christianity means for a world without religion."
        credit: "Unknown author, CC BY-SA 3.0 de, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Bundesarchiv_Bild_146-1987-074-16,_Dietrich_Bonhoeffer.jpg"
    body: |
      A third movement went the other way from tongues and healing. In Europe and North America, many believers asked how to speak of Christ to people who no longer used religious language or felt the need for it.

      **Dietrich Bonhoeffer** (1906 to 1945), a German Lutheran pastor and theologian, was executed at Flossenbürg on 9 April 1945 for his part in the resistance to Hitler. In a letter of 30 April 1944 from prison to his friend Eberhard Bethge, he asked what Christianity really is for us today, and whether religion is only a garment of Christianity, and so what a "religionless Christianity" would look like. He held, in essence, that faith belongs in the secular life and in sharing the sufferings of God in the world, not only in "religious" acts. Scholars still debate what exactly he meant.

      The idea reached a wide public in the 1960s. John A. T. Robinson, the Anglican Bishop of Woolwich, published *Honest to God* (1963), which took up the problem Bonhoeffer raised about how to speak of faith to the modern world. The American theologian Harvey Cox published *The Secular City* in 1965, arguing that the modern city and secularization should be understood in a theological perspective.

  - type: mcq
    id: bonhoeffer-q
    title: "What \"religionless\" does not mean"
    prompt: |
      Bonhoeffer wrote from prison in 1944 about a "religionless Christianity". Which reading is the most careful?
    options:
      - text: "He asked what the faith means in a world that no longer relies on religion, and kept Christ at the centre; what he meant exactly is debated by scholars."
        correct: true
        feedback: |
          Yes. The letter is a question, written in fragments, and he did not leave a finished programme.
      - text: "He gave up Christianity before he died."
        feedback: |
          He died as a pastor in the resistance, and the questions in the letters are about how to speak of Christ, not whether to.
      - text: "He called for abolishing churches and worship."
        feedback: |
          The letters do not say this. Scholars read "religionless" as a criticism of a particular kind of piety, and they disagree on how far it reaches.
    explanation: |
      A good rule when a short prison letter is cited as a doctrine: ask what is a question and what is a conclusion. Secular theology after Bonhoeffer went in several directions, some close to his faith and some far from it.

  - type: mcq
    id: match
    title: "Which movement answers which question?"
    prompt: |
      Three movements shaped Christianity in the last century. Which pairing of movement and main concern is correct?
    options:
      - text: "Pentecostalism: the believer's direct experience of the Spirit. Liberation theology: justice for the poor. Secular Christianity: how to speak of the faith in a world without much religion."
        correct: true
        feedback: |
          Yes. Each is a different answer to a different question, which is why they can coexist, and why they sometimes disagree.
      - text: "Pentecostalism: justice for the poor. Liberation theology: how to speak of the faith in a secular world. Secular Christianity: direct experience of the Spirit."
        feedback: |
          Each concern is real, but this pairing swaps them. Check each movement's founders: Seymour (experience), Gutiérrez (the poor), Bonhoeffer, Robinson and Cox (a secular world).
      - text: "All three are the same movement under different names."
        feedback: |
          They arose in different places and times, with different aims, and often criticise each other.
    explanation: |
      Thoughtful people disagree about which concern comes first, and why: some hold that experience is basic, some that justice is, some that intelligibility is.

  - type: text
    id: twist
    title: "Two Christianities at once?"
    body: |
      A puzzle appears when the movements and the numbers meet. According to Jenkins, the churches growing fastest in the Global South tend to be more traditional and morally conservative in their teaching than many in the North, and many are Pentecostal or charismatic. Meanwhile, the secular Christianity of the 1960s found its main readers in the North, where church attendance in many places declined.

      So a bishop in Lagos and a theologian in Boston may share a creed but disagree about miracles, authority and the Bible's place in public life. This is a generalisation, with many exceptions: liberation theology grew in the South, and there are conservative churches in the North. The honest summary is that "Christianity" today names a family, not one voice.

  - type: mcq
    id: truth
    title: "Does counting settle anything?"
    prompt: |
      Someone argues: "Christianity is growing fast in Africa and Latin America, so it must be true." Another argues: "Christianity is shrinking in Europe, so it must be false." According to the reasoning of this course, what is wrong with both?
    options:
      - text: "Both move from a census fact (layer 1) to a claim about truth (layer 3); numbers of believers show what people hold, not whether the belief is correct."
        correct: true
        feedback: |
          Yes. Numbers can be good evidence for sociology, history and what people find meaningful. Whether a doctrine is true is decided by arguments and evidence of another kind.
      - text: "The numbers are always unreliable, so nothing can be concluded."
        feedback: |
          The estimates have limits, but the direction of the trend is well supported. The problem is the step to truth, not the counting.
      - text: "Growth proves truth but decline proves nothing."
        feedback: |
          That is a double standard: the same inference would then make every fast-growing movement true.
    explanation: |
      Notice that the inference fails in both directions with equal force. A believer, an atheist and a sociologist can all accept the numbers and still part ways about what they mean.

  - type: text
    id: summary
    body: |
      **Where thoughtful people part ways.** On the facts, there is wide agreement: the shift south is large and well attested, even if exact numbers are estimates. Disagreement begins when asking what the shift means. Some Christians see it as the Spirit at work, some as the fruit of mission and migration, some as an inevitable demographic outcome. Others see secularization in the North as the real sign of the future. These are different premises about what counts as evidence, and the lesson leaves them open.

      **Next:** fast questions on the common slips of this level (Traps), then a quick recall, the content map and the level challenge on reading the Gospels fairly.
