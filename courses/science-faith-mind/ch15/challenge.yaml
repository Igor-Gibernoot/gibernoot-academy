id: ch15-challenge
title: "Level Challenge: Reading the Gospels Fairly (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: invented passages, two kinds of tool"
    body: |
      The three problems below use invented texts and invented numbers, built to practise on passages you have never seen. Nothing in them is a claim about a real manuscript. In each problem the same passage is handled twice and the card says which is which.

      - **[H] The historian's tools.** Compare wording and order, ask which texts depend on which, date the sources, apply the criteria of authenticity (attestation, embarrassment, dissimilarity, coherence), and weigh a report with Bayes' rule in odds form. These tools yield *more or less probable*, never *proved*.
      - **[B] The believer's reading.** According to Christians, the Gospels are inspired witnesses, the canon was recognised under the Spirit's guidance, and the resurrection of Jesus is an act of God. These are held on grounds beyond what the manuscripts show, and a believer may also use [H] tools fully, as many do.
      - **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. A claim never moves up a layer by being repeated.

      Problems 4 and 5 (a Christian debate worked through, then a closing weighing across the level) come in part 2.

  # ---------------- Problem 1 ----------------
  - type: text
    id: p1-setup
    title: "Problem 1 · Three texts and one village"
    body: |
      **Problem 1.** Three invented texts about a teacher, called **A**, **B** and **C**, are read side by side. This is the [H] side of the problem: who used whom?

      Facts about the texts: A has 80 verses. B has 100 verses and shares 72 of A's verses, in nearly the same Greek words and the same order. C has 110 verses and shares 64 of A's verses, also in nearly the same words and order. B and C share a further 30 verses that A does not have, mostly sayings, and each of B and C also has verses found nowhere else.

      Here is the one passage that all three tell, the teacher in his home village:

      | Text | Home village |
      |---|---|
      | A | He could do no healing there, except to touch a few sick people. |
      | B | He did not do much healing there, because of their doubt. |
      | C | He healed few there, because of their doubt. |

      The task: work out the overlap, say what each rival solution to the synoptic problem predicts, and decide where [H] ends and [B] begins.

  - type: numeric
    id: p1-share
    title: "How much of A is inside B?"
    prompt: |
      Text A has 80 verses and text B shares 72 of them. What percentage of A's verses appear in B?
    answer: 90
    tolerance: 0.5
    wrong:
      - { value: 72, feedback: "72 is the number of shared verses, not the share. A share compares the shared verses with the size of A." }
      - { value: 80, feedback: "80 is the size of A. The share compares the shared verses with that size and is expressed in percent." }
    hint: Compare the shared verses with all the verses of A.
    explanation: |
      72 out of 80 is 90%. Most of A sits inside B, and a similar share inside C ($64/80=80\%$). This is the shape the real Synoptic Gospels show: the shortest text lies almost entirely inside the other two.

  - type: numeric
    id: p1-special
    title: "How many verses are C's own?"
    prompt: |
      Text C has 110 verses. Of these, 64 are shared with A, and 30 more are shared with B but are not in A. Every other verse of C is found only in C. How many verses are only in C?
    answer: 16
    wrong:
      - { value: 46, feedback: "46 is 110 minus 64: it still includes the 30 verses that C shares with B. Those are not only in C." }
      - { value: 14, feedback: "Check the subtraction: 110 minus 64 minus 30." }
    hint: Take away from C's total every verse that has a parallel elsewhere.
    explanation: |
      $110-64-30=16$. Scholars call the 30 verses shared by two texts and absent from the third the **double tradition**, and the verses found in one text only **special material**. Both groups need an explanation.

  - type: mcq
    id: p1-predict
    title: "What does each solution say?"
    prompt: |
      Three solutions to the overlap are on the table. Which pairing of solution and claim is accurate (each stated as its defenders would)?
    options:
      - text: 'Markan priority with a lost sayings source (Q): A came first; B and C each used A and a second, lost source for the 30 shared sayings. The Farrer view: A first, then B using A, then C using both A and B, so no lost source. The Griesbach view: B first, then C using B, then A last, combining and shortening both.'
        correct: true
        feedback: |
          Yes. All three explain the same data. They differ in the direction of copying and in whether a source nobody possesses is allowed.
      - text: 'Markan priority: A is the shortest, so A copied from B and C and shortened them. The Farrer view needs a lost source. The Griesbach view says A came first.'
        feedback: |
          The three are scrambled. Markan priority says the shortest text came first and the others used it; the Farrer view is the one that needs no lost source; the Griesbach view is the one that puts A last.
      - text: 'All three solutions predict that B and C are independent of each other, since each tells its own story.'
        feedback: |
          The Farrer and Griesbach views both have one of B and C using the other. Only the lost-source view keeps B and C independent of each other.
    explanation: |
      A solution is judged by what it asks us to believe: a lost source (the Q view), an odd Luke-like rearrangement (the Farrer view), or an author who drops a great deal (the Griesbach view). Each cost is a judgment about how ancient authors worked, which is why the debate has lasted.

  - type: order
    id: p1-order
    title: "Argue the direction at the home village"
    prompt: "A scholar argues from the home-village passage that A's wording came first. Put the argument in order."
    steps:
      - "The three texts tell the same scene but differ in one phrase: A says he could do no healing there, B and C say he did little."
      - "Ask which change had a motive: softening a hard phrase has one, hardening a gentle phrase has none."
      - "Therefore it is likelier that B and C softened A than that A sharpened B."
      - "Conclusion: at this place A's wording is probably the earliest, as a rule of thumb that rivals may turn around."
    hint: First state the data, then ask about motive, then the direction, then the strength of the conclusion.
    explanation: |
      This is the "harder reading" argument. It is [H]: it gives a probability, and it depends on a judgment about what a copyist would find awkward. A defender of the Griesbach view can reply that A may have sharpened B for effect.

  - type: mcq
    id: p1-q-farrer
    title: "Both B and C say 'because of their doubt'"
    prompt: |
      B and C agree with each other against A in one phrase, "because of their doubt", which A lacks. A Q defender and a Farrer defender both read this as a clue. Which pairing is fair?
    options:
      - text: 'The Farrer defender says it is easy: C read B and kept the phrase. The Q defender replies that B and C may have shared a second source that also told this scene, or that each softened A the same way.'
        correct: true
        feedback: |
          Yes. A small agreement against A is natural if C knew B, and needs an extra explanation if B and C are independent. The Q defender has such explanations, at a cost.
      - text: 'The Farrer defender says the phrase proves a lost source, and the Q defender says it proves C copied B.'
        feedback: |
          The sides are reversed. The Farrer defender reads the agreement as evidence that C knew B, and the Q defender is the one who must explain it another way.
      - text: 'Both agree it proves A is the last text, since agreements usually mean the shorter text came later.'
        feedback: |
          Neither side argues this. Both keep A first; they differ over whether B and C are independent.
    explanation: |
      This kind of clue is why the dispute between Q and Farrer stays open: the same agreement is straightforward on one view and awkward on the other, and the cost on the second is a judgment, not a contradiction.

  - type: mcq
    id: p1-layers
    title: "[H] or [B]?"
    prompt: |
      Select every statement that belongs to the historian's tools [H] (layers one and two), as opposed to a believer's reading [B] (layer three).
    multiple: true
    options:
      - text: "B and C share 72 and 64 verses of A in nearly the same words and order, so some of the three used another."
        correct: true
        feedback: |
          Correct: this is the overlap itself, an established observation.
      - text: "A's wording at the home village is probably earlier, because softening is likelier than hardening."
        correct: true
        feedback: |
          Correct: an argument from motive, a rule of thumb that gives a probability.
      - text: "Whatever the order in which they were written, these texts are inspired witnesses to the teacher."
        feedback: |
          This is a [B] statement, a faith commitment. The solution to the synoptic problem neither proves it nor refutes it.
      - text: "Q probably existed, because no solution is allowed to leave a source out."
        feedback: |
          No such rule exists, and Q is a live debate, not a fact: the Farrer view does without it.
    explanation: |
      The mark of a layer-three claim is that no manuscript could confirm or refute it. The mark of a layer-two claim is that evidence bears on it but leaves reasonable disagreement. The two Gospel solutions are of the second kind.

  - type: mcq
    id: p1-parting
    title: "Where do thoughtful readers part ways?"
    prompt: |
      One reader holds that A is first and that B and C each used it. Another holds that B is first and A last. Both are Christians who read the texts as inspired. A third is not a Christian and prefers the first view. What does the disagreement between the first two turn on?
    options:
      - text: "A judgment of plausibility (how ancient authors copied, softened and shortened), argued with the same texts. It is layer two, and it is separate from their shared layer-three commitment."
        correct: true
        feedback: |
          Yes. Two believers can disagree about order, and a believer and a non-believer can agree about it. Inspiration does not decide the order of writing, and the order does not decide inspiration.
      - text: "Whether the texts are inspired, since a believer must hold the church's traditional order."
        feedback: |
          Many Christian scholars hold Markan priority and many hold Matthean priority. Each church has its habits, but the order is argued from the texts.
      - text: "A fact in the manuscripts that settles it, which one of them is ignoring."
        feedback: |
          If the manuscripts settled it the debate would be over. The data fit several solutions, and the weighing of costs is a judgment.
    explanation: |
      Problem 1 is [H] throughout; the [B] reading enters only at the question of what the texts are, and it leaves the order of composition open. Label: **live debate** (Q or Farrer; Griesbach a minority view), sitting on **established fact** (the overlap), beside a separate **commitment** (inspiration).

  # ---------------- Problem 2 ----------------
  - type: text
    id: p2-setup
    title: "Problem 2 · A saying and a scene"
    body: |
      **Problem 2.** Use the dates ladder from the level: the teacher's death about 30; the earliest letter (1 Thessalonians) about 50; Mark 65 to 75; Matthew and Luke 80 to 90; Josephus about 93 to 94; Tacitus about 115.

      An invented **saying S** of the teacher reads: "Whoever lights a lamp must bless the dark." Facts about S:

      - It is in texts B and C but not in A (it is in the 30 shared verses of Problem 1), and these two were written about 80 to 90.
      - An invented letter **L**, written about 50 by a man who never met the teacher, says: "bless the dark, as the teacher taught."
      - A text **G**, written about 150, quotes S from B or C and adds a moral.
      - A rabbi named Ilan (invented), a contemporary of the teacher, is reported to have said: "Light a lamp for the dark."
      - Later churches, about 150, use S often in their teaching.

      A separate invented **scene E**: in text A the teacher asks a woman a question, she corrects him, and he thanks her.

      The task: apply the four criteria of authenticity to S and E, say what each can and cannot show, and separate what the [H] tools say from what a [B] reader holds.

  - type: numeric
    id: p2-lines
    title: "How many independent lines for S?"
    prompt: |
      Saying S appears in letter L (about 50), in B and in C (both 80 to 90), and in G (about 150, quoting B or C). Whichever way B and C are related (a shared lost source, or C copying B), they count together, and G only repeats them. Letter L does not depend on any of them. How many independent lines of evidence for S are there?
    answer: 2
    wrong:
      - { value: 4, feedback: "That counts every page where S appears. Copies of one source are one witness, and G quotes B or C." }
      - { value: 3, feedback: "That counts B and C separately. On every solution of Problem 1 that keeps them from being independent witnesses to S, they are one line, and G adds nothing." }
    hint: Count sources that do not depend on one another, not pages.
    explanation: |
      Two lines: letter L, and the line behind B and C (one source or one copy of the other). This carries a result of Problem 1 into Problem 2: the answer to "who used whom" decides how many witnesses there are. A critic of Q would reach the same count by another route.

  - type: numeric
    id: p2-gap
    title: "How long after the death?"
    prompt: |
      The teacher died about 30. Texts B and C, which contain S, were written between 80 and 90. At most how many years after the death was the later of them written?
    answer: 60
    wrong:
      - { value: 50, feedback: "50 is the gap to the earliest date (80). The question asks for the latest, 90." }
      - { value: 20, feedback: "20 is the gap to letter L (about 50), which is the earlier witness, not B and C." }
    hint: Use the later end of the range, then subtract the date of the death.
    explanation: |
      $90-30=60$ years for B and C, against only $50-30=20$ for letter L. A short gap means a short chain of memory for L. It does not make S true, but a saying already circulating twenty years after the death has had less time to grow. This is the [H] use of the dates ladder; what the speaker truly said is not read off the gap.

  - type: mcq
    id: p2-embarrassment
    title: "Scene E and embarrassment"
    prompt: |
      In scene E the teacher is corrected by a woman and thanks her. A scholar argues from the criterion of embarrassment that E is likely to go back to the teacher. What is the best statement of the argument and of its limit?
    options:
      - text: 'The argument: a church that wished to honour the teacher would not invent a scene where he is corrected, so E probably came from earlier memory. The limit: what embarrasses depends on the audience and the time, and a writer can invent an awkward scene to teach humility.'
        correct: true
        feedback: |
          Yes. The criterion gives a lean toward authenticity, not a proof. It also needs a claim about what the early church found awkward, which is itself argued.
      - text: 'The argument: every scene where the teacher looks weak is true, because nobody invents a weak hero. The limit: none.'
        feedback: |
          The argument is a probability, not a certainty, and the limit is real: authors write stories of reversal on purpose (a humble teacher), so a scene can be both awkward and invented.
      - text: 'The argument: E is in text A, which is the shortest text, so E is authentic.'
        feedback: |
          Being in the shortest text says nothing about whether the scene is authentic. The criterion of embarrassment looks at whether the church would have chosen to tell it.
    explanation: |
      Real historians use the same logic for the baptism of Jesus by John and for the cry from the cross, and debate the same limit: embarrassment to whom? A scene that troubled one community can be a lesson for another.

  - type: mcq
    id: p2-dissimilarity
    title: "Dissimilarity and saying S"
    prompt: |
      Saying S is close to Ilan's saying (a Jewish contemporary) and was used often by churches about 150. What does the criterion of dissimilarity, in its strong form, say about S, and what is its limit?
    options:
      - text: 'S passes neither test, since it is like the teacher''s Jewish world and like the later church. The strong form therefore cannot count it. The limit: the criterion removes whatever the teacher shared with his contemporaries or his followers, so it can only give a thin, distinctive remainder.'
        correct: true
        feedback: |
          Yes. A person who shares nothing with his world and leaves no mark on his followers is not a plausible historical figure. That is why most scholars now relax the strong form and use the other criteria with it.
      - text: 'S passes the criterion, since the church used it a lot.'
        feedback: |
          Reversed. Use by the later church is exactly what the strong form treats as a reason to suspect the church made the saying.
      - text: 'S proves the teacher copied Ilan.'
        feedback: |
          A similarity can mean copying either way, a shared tradition, or a common idiom. The criterion does not decide among them.
    explanation: |
      Dissimilarity is most useful as a one-way test: what passes is likely authentic; what fails is simply undecided. Treated as a two-way test it would erase everything the teacher had in common with his world.

  - type: numeric
    id: p2-combine
    title: "Three criteria, one toy update"
    prompt: |
      Before using any criterion, a historian puts the chance that S goes back to the teacher at odds of 1 to 9 for it. Suppose, as a toy number, that each of three criteria, taken as independent of the others, makes authenticity 3 times as likely as before. What is the posterior probability of authenticity, in percent?
    answer: 75
    tolerance: 0.5
    wrong:
      - { value: 90, feedback: "That adds the three factors to the odds, instead of multiplying them. Also check the conversion from odds to a probability." }
      - { value: 25, feedback: "That is the odds ratio 1 to 3 read backwards. Compute the new odds, then convert odds to a probability." }
    hint: Work with odds rather than probabilities, then convert back. The weight of each criterion multiplies the odds.
    explanation: |
      Prior odds $1/9$, times $3\times3\times3=27$, give odds $3$ to $1$ for, which is a probability of $3/4=75\%$. The exercise also shows the weakness: the criteria are not independent (S is in B and C by the same line, and the letter may use the church's habits), so three criteria do not give a factor of $27$. The toy shows how evidence adds up, not what the real factor is.

  - type: mcq
    id: p2-believer
    title: "Did he say it? Is it binding?"
    prompt: |
      A [H] scholar concludes that S is probably authentic (a lean, not a proof). A [B] reader says: "S is the teacher's word and I am bound by it, whatever the criteria say." Which statement describes the relation between them fairly?
    options:
      - text: 'They answer different questions. The [H] question is whether the saying goes back to the teacher, answered by probability. The [B] reading takes the saying as authoritative as a witness inside the canon, a commitment that the criteria neither need nor can supply. A believer may accept the [H] result, and a non-believer the same result, without adopting the commitment.'
        correct: true
        feedback: |
          Yes. A positive [H] result is welcome to the believer but is not what the believer's reading rests on, and a negative one does not bind the believer, who holds the text for other reasons.
      - text: 'The [B] reader contradicts the [H] scholar, because a believer must claim the saying is certainly authentic.'
        feedback: |
          Believers differ. Many Christians accept that some sayings were shaped by the tradition and still treat the text as authoritative. The contrast is of kind, not of verdict.
      - text: 'The [H] result makes the [B] commitment unnecessary, because a probable saying is a binding one.'
        feedback: |
          Probability of authenticity does not give authority. Whether the saying binds anyone is a question of what one holds about the teacher, which no criterion of authenticity answers.
    explanation: |
      The same saying, handled twice: [H] asks about origin; [B] asks about authority. Neither can stand in for the other.

  - type: mcq
    id: p2-parting
    title: "Where do thoughtful readers part ways?"
    prompt: |
      After the four criteria, two scholars still differ on S: one puts it at 75% authentic, another at 30%. What explains the gap?
    options:
      - text: 'They weigh the criteria differently and start from different priors about how much the early churches reshaped sayings. It is layer-two disagreement on a base of shared facts (dates, lines, similarities), and the criteria alone cannot close it.'
        correct: true
        feedback: |
          Yes. No criterion is a number-producing machine. How to weigh them, and how creative one thinks the early communities were, are judgments. Label: **live debate**, resting on **established** dates and parallels.
      - text: 'One of them miscounted the independent lines.'
        feedback: |
          Possible, but then the dispute would be about the facts and could be settled by recounting. The scholars can agree on two lines and still differ.
      - text: 'One of them is a believer and the other is not.'
        feedback: |
          Believers and non-believers are found on both sides of questions of authenticity. The gap comes from the weighting of the criteria, not from the commitments.
    explanation: |
      The criteria raise or lower a probability. They do not close the case, and they should be reported with their limits: attestation needs independence, embarrassment depends on audience, dissimilarity erases the shared world, and coherence is circular if the base was chosen to fit.

  # ---------------- Problem 3 ----------------
  - type: text
    id: p3-setup
    title: "Problem 3 · The report from Sel"
    body: |
      **Problem 3.** An invented report. In the village of Sel, year 0, a girl named Mira is said to have died, and two days later to have risen. The evidence for it:

      - A letter **K** by a villager, written in year 20, says "Mira lives, as we saw".
      - A church text **D**, written in year 60, tells the story with many details; it was read in the churches of two towns, and left out of the list of a third because its author was unknown.
      - An outside historian, writing in year 85, says only that "the villagers of Sel claim that a girl rose".

      Let $R$ be "Mira rose" and $E$ the evidence above. The same evidence is handled twice: as a historian weighs a report ([H]), and as a believer reads it ([B]). The odds form of Bayes' rule is:

      $$\frac{P(R\mid E)}{P(\neg R\mid E)}=\frac{P(E\mid R)}{P(E\mid\neg R)}\cdot\frac{P(R)}{P(\neg R)}$$

      Posterior odds equal the likelihood ratio times the prior odds. The numbers below are toys, chosen for the exercise.

  - type: order
    id: p3-dates
    title: "The real dates ladder"
    prompt: "Put these real sources about Jesus in order of date, earliest first."
    steps:
      - "Jesus's death, about 30"
      - "Paul's 1 Thessalonians, about 50"
      - "Mark, 65 to 75"
      - "Matthew and Luke, 80 to 90"
      - "Josephus, Antiquities, about 93 to 94"
      - "Tacitus, Annals, about 115"
    hint: Eyewitness-era first, then the Gospels, then the Roman and Jewish historians.
    explanation: |
      The earliest surviving Christian text (about 20 years after the death) is a letter, the Gospels follow in the next decades, and the two outside historians who mention Jesus come later still. The invented Sel timeline (letter in year 20, text in year 60, outside historian in year 85) copies this shape.

  - type: widget
    id: p3-widget
    title: "Move the prior"
    widget: odds-updater
    config:
      prior: 1.0e-6
      lr: 10000
      presets:
        - { label: "Prior 1e-3", prior: 1.0e-3 }
        - { label: "Prior 1e-6", prior: 1.0e-6 }
        - { label: "Prior 1e-9", prior: 1.0e-9 }
    body: |
      The likelihood ratio is set to $10^{4}$ (the evidence is ten thousand times more likely if Mira rose than if not), a toy number and not an estimate. Move the prior with the slider or the buttons and read the posterior. Then raise the likelihood ratio until the prior $10^{-6}$ reaches even odds.
    review: false

  - type: numeric
    id: p3-posterior
    title: "A new prior"
    prompt: |
      Take a prior probability of $10^{-6}$ that Mira rose (a toy number) and a likelihood ratio of $10^{4}$ for the evidence $E$. What is the posterior probability, in percent, to two decimals?
    answer: 0.99
    tolerance: 0.01
    wrong:
      - { value: 91, feedback: "91% is the result for a prior of $10^{-3}$. Here the prior is a thousand times smaller." }
      - { value: 1.0e-6, feedback: "That is the prior, not the posterior. The evidence has raised it by a large factor, though not enough." }
    hint: Work with odds, then convert odds back to a probability. A very small prior makes odds and probability almost equal.
    explanation: |
      Prior odds are about $10^{-6}$, so posterior odds are about $10^{-6}\times10^{4}=10^{-2}$, a probability of $0.01/1.01\approx0.0099$, that is $0.99\%$. The evidence is strong and the verdict is still against, because the prior is small. For comparison, the toy prior $10^{-3}$ gave about 91% and the prior $10^{-9}$ gave about 0.001% in the lesson on the resurrection.

  - type: numeric
    id: p3-needed
    title: "How strong would the evidence have to be?"
    prompt: |
      With the same prior of $10^{-6}$, what likelihood ratio would bring the odds that Mira rose to even (50%)?
    answer: 1000000
    tolerance: 1
    wrong:
      - { value: 10000, feedback: "$10^{4}$ is the value used in the earlier card, which gave about 1%, not 50%." }
      - { value: 1.0e-6, feedback: "The likelihood ratio has to cancel a small prior, so it must be large, not small." }
    hint: Even odds mean 1 to 1. What factor undoes a prior odds of one in a million?
    explanation: |
      The factor must undo the prior, so $\text{LR}=10^{6}$, one hundred times the toy value. This is the heart of the dispute: a sceptic holds that no early report reaches a factor like that against a very small prior, and a defender holds that the prior is not that small to begin with. The sources fix the likelihood ratio at most loosely; the prior comes from a worldview.

  - type: mcq
    id: p3-hume
    title: "Hume and the believer's reply"
    prompt: |
      David Hume (1711-1776) argued in Section X of his Enquiry (1748) that a report of a miracle should be accepted only if its falsehood would be more miraculous than the event. A believer replies to the use made of this argument. Which pairing of objection and answer is fair?
    options:
      - text: 'Believer: counting all uniform experience against the miracle already assumes that no miracle has happened, and the prior of a divine act depends on whether God exists and acts, which history does not settle. Hume''s defender: laws of nature are what uniform experience has established, and a believer who raises the prior by a belief in God has built the conclusion into the premise.'
        correct: true
        feedback: |
          Yes. Each side finds the other circular, and the argument is valid on both sides. They disagree on where the prior comes from.
      - text: 'Believer: Hume proves miracles are impossible. Hume''s defender: miracles are certainly real.'
        feedback: |
          Both sides are swapped. Hume did not claim to prove impossibility, and his defenders do not say miracles are certain.
      - text: 'Believer: the report must be true since it is in a canonical text. Hume''s defender: canonical texts are not evidence.'
        feedback: |
          The first is a [B] statement; the defender of Hume would agree it carries weight for a believer but would not call it a historical argument. Neither is the live exchange about the prior.
    explanation: |
      Notice that [H] tools alone cannot settle between the two replies, because they differ about the prior, and the prior is not a result of any manuscript.

  - type: mcq
    id: p3-canon
    title: "Text D and the canon"
    prompt: |
      Text D (the Sel story, year 60) was read in two towns and left out of a third town's list because its author was unknown. Churches asked three questions of a book (apostolic origin, wide use, agreement with the faith already held). What does this tell the historian, and what does the believer add?
    options:
      - text: 'The historian: the lists show what churches did, with criteria applied loosely, so D''s status is a fact about reception and says nothing yet about whether Mira rose. The believer adds that the church recognised books carrying the Spirit''s authority, a commitment that the lists neither prove nor refute.'
        correct: true
        feedback: |
          Yes. A text can be accepted for good reasons and still report something doubtful to a historian, and a text can be rejected for reasons unrelated to its truth. The lists show reception, not verification.
      - text: 'The historian: being in the list shows the story is true. The believer: being left out shows it is false.'
        feedback: |
          Neither follows. Reception is not verification, in either direction. A book may be left out for its unknown author, not for the content of its stories.
      - text: 'The historian: the criteria were never used. The believer: the criteria were always sound.'
        feedback: |
          The criteria were used, loosely, and sometimes in conflict (Hebrews was kept for its standing despite an unnamed author). Believers also differ among churches about the closing of the canon.
    explanation: |
      Two tasks that are easy to confuse: describing how a list formed (a historical question), and saying whether the list is the right one (a question of faith).

  - type: mcq
    id: p3-sort
    title: "Which layer?"
    prompt: |
      Select the statements that belong to layer three (faith or metaphysical commitment), as opposed to established fact or live debate.
    multiple: true
    options:
      - text: "God raised Mira, and the church was right to read D as scripture."
        correct: true
        feedback: |
          Correct: this is a commitment. No document and no calculation can settle whether God acts.
      - text: "The prior probability of a rising is so small that no early report outweighs it."
        correct: true
        feedback: |
          Correct: the size of the prior depends on a worldview (whether natural causes are all there is), so this belongs with the third layer, even when it is put as a number.
      - text: "K was written about 20 years after year 0 and D about 60 years after."
        feedback: |
          This is a dating statement, an established fact in the invented case, and the same kind of statement as the dates ladder.
      - text: "The outside historian reports only that the villagers claim the girl rose."
        feedback: |
          This is a plain description of what the source says, an established fact. What follows from it is argued.
    explanation: |
      A number does not turn a commitment into a fact. The priors in the odds are where the layers meet: the likelihood ratio is argued on the evidence, the prior comes from the worldview each person brings.

  - type: mcq
    id: p3-parting
    title: "Where do thoughtful readers part ways?"
    prompt: |
      A believer, a sceptic and an agnostic read the Sel evidence with the same toy likelihood ratio, $10^{4}$. Their priors are $10^{-3}$, $10^{-9}$ and $10^{-6}$. What decides their verdicts, and what can they still agree on?
    options:
      - text: 'The prior, which is set by what each holds about whether God exists and acts, decides the verdict: about 91%, about 0.001% and about 1% from the same evidence. They can agree on the dates, the sources and the arithmetic, and they should agree that the dispute is about the prior and how strongly the evidence points.'
        correct: true
        feedback: |
          Yes. Layer one and two are shared; the spread of verdicts sits in layer three. A fair discussion names the prior openly instead of treating it as a result.
      - text: 'The likelihood ratio, because the sceptic and the believer must read the sources differently.'
        feedback: |
          Here the ratio was held fixed on purpose. In real debates it also differs, but the lesson of the exercise is that the prior alone is enough to separate them.
      - text: 'Nothing, because the arithmetic gives the same answer for everyone.'
        feedback: |
          The arithmetic is shared, but the input differs, and so does the output. A shared method does not guarantee a shared verdict.
    explanation: |
      This is the pattern of the whole level: the historian's tools give a lean on the facts; the believer's reading and the sceptic's both rest on commitments those tools do not supply. Label: **established** (the sources and dates), **debate** (the likelihood ratio), **commitment** (the prior).

  - type: text
    id: closing
    title: "What these three problems used"
    body: |
      Problem 1 counted overlap (90% of A inside B; 16 verses only in C), compared the Markan-priority, Farrer and Griesbach solutions, and showed how a small agreement ("because of their doubt") can look natural on one view and awkward on another. It also showed that the order of writing and the inspiration of the texts are separate questions.

      Problem 2 counted independent lines (letter L and the line behind B and C make two), set the gap in years against the dates ladder (20 against 60), and applied embarrassment and dissimilarity with their limits. A toy update (odds 1 to 9 times $3^3$) gave 75%, with the warning that real criteria are not independent. It split the question of origin from the question of authority.

      Problem 3 used Bayes' rule in odds form,

      $$\text{posterior odds}=\text{LR}\times\text{prior odds},$$

      with a prior of $10^{-6}$ and a likelihood ratio of $10^{4}$ giving about 1%, and showed that for even odds the ratio would have to be $10^{6}$. It set Hume's maxim against the believer's reply, and showed that the canon lists record reception, not verification.

      In each problem the readers agreed on the first layer, argued the second with evidence, and parted at the third. **Next:** part 2 takes a real debate of the level and a closing weighing across Christianity and the Gospels, and asks what a fair reader of any belief can accept.
