id: ch15-historical
title: "The Historical Jesus"
kind: concept
own: |
  The setting: Jesus of Nazareth, a Jewish teacher of first-century Galilee, studied as a historical figure by scholars who use the methods applied to any ancient person. Years are CE. Everything is taught according to someone.
  - **Outside and earliest sources.** According to the historian Josephus (*Antiquities*, written about 93 to 94), Jesus had a brother James; his longer passage on Jesus (the *Testimonium Flavianum*) is {{ probably a genuine core with later Christian additions, in the view of most scholars }}. According to the Roman historian Tacitus (*Annals*, about 115), Christus was {{ executed under Tiberius by Pontius Pilate }}. The earliest surviving Christian writings are Paul's letters, 1 Thessalonians about 50, that is some twenty years after Jesus's death (about 30 to 33).
  - **Three quests.** Reimarus (1694 to 1768, published 1774 to 1778 by Lessing) read the Gospels as a cover for a failed political aim; Schweitzer (*The Quest of the Historical Jesus*, 1906) showed that earlier portraits {{ mirrored their authors' own values }} and placed Jesus in Jewish apocalyptic expectation; the third quest (from the 1980s) works from the Jewish context of the time.
  - **Criteria of authenticity.** *Multiple attestation* (several independent sources), *embarrassment* (a detail that cost the early church something), *dissimilarity* (unlike both Judaism and the later church) and *coherence* (fits what is already established). Each has a limit: independent means {{ not copied from one another }}, embarrassment depends on the audience, dissimilarity {{ erases what Jesus shared with his Jewish world }}, and coherence is circular if the base is chosen to fit. The criteria raise or lower probability; they do not prove.
  - **Near-certain.** Most historians, believers and non-believers alike (for example Dunn, Sanders, Crossan, Ehrman), hold that Jesus {{ was baptized by John and crucified under Pilate }}.
  - **Portraits.** *Apocalyptic prophet* (Schweitzer, Sanders, Ehrman): Jesus announced the near arrival of God's kingdom. *Sage* (Crossan, Borg): a teacher of wisdom, with little or no expectation of the end. *Social reformer* (Horsley): a leader of village renewal against exploitation. All three use the same sources and reach different results.
  - **Three layers.** Established: the sources and their dates. Debate: which portrait fits best, and how much of the Gospels is reliable. Commitment: whether Jesus is, as Christians hold, one person with a divine and a human nature (Chalcedon, 451); history can neither prove nor refute this.

cards:
  - type: mcq
    id: hook
    title: "Guess: how do you show a man lived?"
    prompt: |
      Guessing is the point; no background is needed. A friend says: "I doubt a teacher called Marcus lived in a certain town 2,000 years ago." You want to show he did, using only what survives. Which kind of evidence would you hope for first?
    options:
      - text: "Writings about him by people who lived close to his time, ideally by several people who did not copy each other, including some who did not admire him."
        correct: true
        feedback: |
          Yes. Closeness in time, independence between sources, and sources with no reason to flatter him are exactly what historians look for in every ancient case. This lesson asks how far the evidence on Jesus meets that test.
      - text: "A photograph or a self-portrait."
        feedback: |
          Neither exists for anyone of that age. Ancient history works from texts, coins, inscriptions and ruins, so the question is how good the texts are.
      - text: "One long, detailed biography, since details prove it."
        feedback: |
          Detail can come from imagination or from later devotion. One text, however rich, is one witness; several independent ones weigh more.
    explanation: |
      Keep these three tests in mind: how early, how independent, how neutral. They return as the "criteria" below.

  - type: text
    id: outside
    title: "Two writers outside the movement"
    body: |
      Two ancient historians who were not followers of Jesus mention him.

      **Josephus** (about 37 to about 100), a Jewish historian who wrote for a Roman audience, finished his *Antiquities of the Jews* about 93 to 94. In book 20 he tells how the high priest Ananus had a man named James stoned, and calls him "the brother of Jesus, who was called Christ". Almost all scholars accept this sentence as his. In book 18 comes a longer paragraph on Jesus, the *Testimonium Flavianum* ("testimony of Flavius", Josephus's Roman name).

      **Tacitus** (a Roman senator and historian) wrote his *Annals* about 115 to 116. In book 15, he says the founder of the name, Christus, had been put to death under the emperor Tiberius by the governor Pontius Pilate. Most scholars accept the passage as his.

  - type: mcq
    id: testimonium
    title: "Why the long paragraph worries scholars"
    prompt: |
      The Testimonium Flavianum, as it stands in the manuscripts, says Jesus was a wise man who did wonderful deeds, and that he was the Messiah (in the wording of the manuscripts). Josephus was a Jew who, by all other evidence, never became a follower of Jesus. Why do many scholars suspect the paragraph was touched up?
    options:
      - text: "A writer who did not follow Jesus would hardly have stated, in his own voice, that Jesus was the Messiah, so Christian copyists, who preserved Josephus, probably added or reworded phrases."
        correct: true
        feedback: |
          Yes. It is a question of fit: the voice does not match the author. Most scholars since the late twentieth century hold a middle position: a genuine core about Jesus, with Christian additions (Meier's reconstruction is a well-known example). A minority hold the whole paragraph is a later insertion, and a few defend it as essentially authentic.
      - text: "Because no manuscript of Josephus survives at all."
        feedback: |
          Many manuscripts survive. The worry is not absence but wording that sounds more Christian than Josephus.
      - text: "Because Josephus never mentions anyone from Galilee."
        feedback: |
          He wrote at length about Galilee (he was a commander there in 66 CE). The doubt is about the wording of this paragraph, not the region.
    explanation: |
      Layer check: that the Testimonium exists in the manuscripts is established; that it has a genuine core is the majority view among scholars; that some words were added is widely accepted but debated in detail. Notice the James sentence is the sturdier witness.

  - type: mcq
    id: tacitus
    title: "What Tacitus can and cannot show"
    prompt: |
      Tacitus wrote about 115, some eighty years after the death of Jesus, and does not say where he got the information. According to scholars who weigh this, what is the fair use of the passage?
    options:
      - text: "It shows that by about 115 an educated Roman could state that Christus was executed under Pilate; whether Tacitus drew on an official record or on what Christians themselves said is debated."
        correct: true
        feedback: |
          Yes. Some scholars think a senator could consult Roman records; others think he repeated what Christians were saying. Either way, it confirms the outline from a writer with no reason to flatter the movement, but it is not an eyewitness.
      - text: "It proves the Gospels are accurate in every detail."
        feedback: |
          It mentions only a name, an execution, a ruler and a governor. It says nothing about miracles, teaching or the Gospels' details.
      - text: "It is worthless, because it comes long after the events."
        feedback: |
          Late and sourceless limits its weight, but a hostile or neutral Roman writer who confirms the outline still counts as one more voice.
    explanation: |
      A source can be useful for one narrow claim and silent on the rest. Keep each source to its claim.

  - type: numeric
    id: gaps
    title: "How far from the events?"
    prompt: |
      Suppose Jesus was executed in the year 30 (some scholars prefer 33). Tacitus wrote his *Annals* about the year 115. How many years later is that, if the death was in 30?
    answer: 85
    wrong:
      - { value: 82, feedback: "That is the gap if the death was in 33, which is the other date scholars use. The question says 30." }
    hint: "Subtract the year of the death from the year of writing."
    explanation: |
      115 minus 30 is 85 years (82 if 33). The earliest Christian letter, 1 Thessalonians, was written about 50, that is about 20 years after 30. The next card shows why that matters.

  - type: text
    id: paul
    title: "The earliest writer: Paul"
    body: |
      The earliest surviving Christian writings are the letters of **Paul**, a Jewish follower of Jesus who never met him before his death. Most scholars date 1 Thessalonians to about 49 to 51, and accept seven letters as Paul's own, written over roughly a decade from the late 40s. They are letters to communities, not biographies, so they say little about Jesus's life. But they do carry a few facts and traditions.

      Paul writes of visiting Jerusalem and meeting Peter and "James the Lord's brother" (Galatians 1:18 to 19, NRSVUE). He says he handed on a tradition about the night Jesus was betrayed, when Jesus "took a loaf of bread" and spoke of "the new covenant in my blood" (1 Corinthians 11:23 to 25). And he writes of "Christ crucified, a stumbling block to Jews and foolishness to gentiles" (1 Corinthians 1:23).

  - type: mcq
    id: paul-use
    title: "What Paul's letters give a historian"
    prompt: |
      Paul wrote about 20 years after the death of Jesus, knew people who had known Jesus personally, and rarely tells a story from Jesus's life. According to historians, what do the letters mainly add?
    options:
      - text: "Very early, independent evidence that Jesus was a Jew with a brother James and a following around Peter, was crucified, and was remembered in a shared meal tradition; but few of his deeds and sayings."
        correct: true
        feedback: |
          Yes. The value is the date and the contact with people who knew Jesus. The limit is the silence about most of his ministry.
      - text: "A full biography, which the Gospels merely copy."
        feedback: |
          The letters contain no full biography, and the Gospels do not copy them. They are separate kinds of writing for separate purposes.
      - text: "Nothing, because Paul never met Jesus."
        feedback: |
          Paul was not a witness of the ministry, but he reports what he learned from those who were, within about two decades. Early second-hand evidence is still evidence.
    explanation: |
      Paul gives the earliest anchor; the Gospels (written about 65 to 100) give the stories; Josephus and Tacitus give a look from outside.

  - type: text
    id: quests
    title: "Three quests for the man behind the texts"
    image:
      - src: img/reimarus.webp
        alt: "Portrait of Hermann Samuel Reimarus."
        caption: "Hermann Samuel Reimarus (1694 to 1768), whose private manuscript on Jesus was published after his death."
        credit: "Unknown artist, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:PPN66395293X_Hermann_Samuel_Reimarus.jpg"
      - src: img/schweitzer.webp
        beside: true
        alt: "Oil portrait of Albert Schweitzer by Emile Schneider."
        caption: "Albert Schweitzer (1875 to 1965), theologian and physician, who argued that earlier portraits of Jesus mirrored their authors."
        credit: "Émile Schneider, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:%C3%89mile_Schneider,_Portrait_d%27Albert_Schweitzer.jpg"
    body: |
      Scholars speak of three "quests", phases of looking for the historical person with the tools of ordinary historical study.

      The first begins with **Hermann Samuel Reimarus** (1694 to 1768). His private treatise, published in pieces after his death by Gotthold Lessing in 1774 to 1778 as the "Wolfenbüttel Fragments", rejected miracles and portrayed Jesus as a failed political leader whose followers then reshaped the story.

      **Albert Schweitzer** (1875 to 1965) ended the first quest with *The Quest of the Historical Jesus* (German 1906, English 1910). He argued that the nineteenth-century lives of Jesus had each found a Jesus close to the author's own values, and that the real figure belonged to Jewish expectations of a coming end of the age.

      A second quest is dated from a 1953 lecture of Ernst Käsemann; some scholars dispute that the years in between were empty of research. The **third quest**, a name given by N. T. Wright in the 1980s, works above all from the Jewish world of the time, helped by the work of E. P. Sanders and by archaeology.

  - type: mcq
    id: schweitzer-point
    title: "Why portraits mirror their authors"
    prompt: |
      According to Schweitzer, the nineteenth-century biographies of Jesus each found a figure resembling the author's own ideals. Which lesson should a reader of any portrait of Jesus (or of any ancient person) take from this?
    options:
      - text: "Ask which evidence and which method led to the portrait, and whether the author's own values could have steered the choices."
        correct: true
        feedback: |
          Yes. It is a warning about method, not a judgment on any single scholar. A good portrait states its criteria so others can check them, which is why the next cards examine the criteria.
      - text: "No portrait can be better than another, since all are biased."
        feedback: |
          Bias in some cases does not mean all portraits are equal. Some fit the sources and the Jewish context better than others, and that can be argued.
      - text: "Only portraits written by believers are trustworthy."
        feedback: |
          Believers and non-believers have both mirrored their values and both have produced careful work. Method is the test, not the author's creed.
    explanation: |
      The same warning applies in every direction: to critics who find only what they doubt, and to defenders who find only what they hope.

  - type: text
    id: criteria
    title: "Four criteria of authenticity"
    body: |
      Because the Gospels are faith-shaped accounts written decades later, historians ask of each saying or deed: is it likely to go back to Jesus? They use rules of thumb, the **criteria of authenticity**.

      **Multiple attestation.** A report found in several independent sources (say Mark, the lost sayings source Q, John and Paul) is likelier than one found in a single source.

      **Embarrassment.** A detail that the early church would have preferred to omit is unlikely to have been invented by it.

      **Dissimilarity.** (In Käsemann's strong form.) A saying that fits neither the Judaism of the time nor the later church is unlikely to come from either of them.

      **Coherence.** A report that fits the picture built from the material already accepted gains weight.

      None is a proof. Each raises or lowers a probability, and each has a known weakness, which the next four cards test.

  - type: mcq
    id: trap-attestation
    title: "Trap: counting copies"
    prompt: |
      A historian says: "This story about Jesus is in Matthew, Mark and Luke, so it is attested three times." According to the Synoptic solution most scholars accept (Mark used by Matthew and Luke), what is wrong with the count?
    options:
      - text: "If Matthew and Luke copied Mark, the three are one witness, not three; independence is what counts."
        correct: true
        feedback: |
          Yes. A rumor repeated by three people who all heard it from the same person is one rumor. Multiple attestation needs independent lines (for instance Mark, Q, John, Paul), and even then it shows an early tradition, not that the event happened.
      - text: "Nothing: more copies always mean more evidence."
        feedback: |
          Copies of one source add no new information. Compare three students who copied one essay.
      - text: "Three Gospels are too few; at least ten are needed."
        feedback: |
          The number is not the issue; the independence of the lines is.
    explanation: |
      Limit of the criterion: early and independent is still not true. A legend can be old, and two sources can share a common origin earlier still.

  - type: mcq
    id: trap-embarrassment
    title: "Trap: what counts as embarrassing?"
    prompt: |
      Mark 1:4 says John proclaimed "a baptism of repentance for the forgiveness of sins", and Mark 1:9 says Jesus "was baptized by John in the Jordan". Matthew 3:14 adds that John "would have prevented him, saying, 'I need to be baptized by you, and do you come to me?'" A scholar uses the criterion of embarrassment. Which is the best statement of the argument, with its limit?
    options:
      - text: "Early Christians who held Jesus to be without sin would have found his baptism by John awkward, and Matthew's added protest shows the discomfort, so they probably did not invent it; but what is embarrassing depends on the audience, and a story can be told on purpose."
        correct: true
        feedback: |
          Yes. The argument is a probability argument with a stated limit: "embarrassing" is judged by us, and the first Christians may have felt differently or shaped the story to teach something.
      - text: "Baptism was a rare rite, so nobody could have invented it."
        feedback: |
          Baptism was not the point. The argument is about the awkward meaning (repentance and forgiveness for the one later held sinless).
      - text: "Anything in the Gospels is embarrassing to somebody, so everything is authentic."
        feedback: |
          If everything counted, the criterion would test nothing. It applies only where we can argue that the early church had a reason to avoid the detail.
    explanation: |
      Another famous case is the crucifixion itself: Paul calls Christ crucified "a stumbling block to Jews", a message hard to sell, which is why few think it was invented.

  - type: mcq
    id: trap-dissimilarity
    title: "Trap: unique is not typical"
    prompt: |
      A scholar accepts as authentic only the sayings of Jesus that match neither the Judaism of his time nor the later church. Jesus was himself a Jew and the founder of a movement. What is the main danger of this rule?
    options:
      - text: "It strips away everything Jesus shared with his Jewish world and everything his followers rightly kept from him, leaving a distorted, artificially unique figure."
        correct: true
        feedback: |
          Yes. A real teacher shares much with his time and leaves much to his followers. Critics (Morna Hooker's 1972 article is a well-known example) argued that the criteria were misused; Meier and others softened Käsemann's strong form. The rule also needs complete knowledge of Judaism and early Christianity, which no one has.
      - text: "It admits too many sayings, including late inventions."
        feedback: |
          The opposite: it admits too few. Its danger is a minimal, unrepresentative Jesus.
      - text: "It cannot be applied to sayings at all."
        feedback: |
          It can be applied; the issue is what it leaves out. Even a defender would use it as one criterion among others, never alone.
    explanation: |
      A fair use: what passes this test is a good candidate for distinctive; it does not tell what was typical.

  - type: mcq
    id: trap-coherence
    title: "Trap: the circle"
    prompt: |
      A scholar first selects the sayings that suit the portrait "Jesus was a wisdom teacher", then declares authentic every other saying that "coheres" with that portrait. What is the weakness?
    options:
      - text: "Coherence is only as good as the base: if the base was chosen to fit the portrait, the argument assumes what it should show."
        correct: true
        feedback: |
          Yes. Coherence is useful only with a base fixed independently, for example by multiple attestation or embarrassment, and open to the rival portraits too.
      - text: "Coherence is always invalid as a test."
        feedback: |
          Coherence is a fair secondary check on a base that was fixed on other grounds. The slip is the circle, not the test.
      - text: "A portrait never needs a base."
        feedback: |
          Every portrait is built from some material taken as given. The question is how that material was chosen.
    explanation: |
      This is the reason the Schweitzer warning matters. Rival portraits also each claim coherence with their own base.

  - type: text
    id: certain
    title: "What most historians accept"
    body: |
      Two events are accepted by most historians who work on the period, believers and non-believers alike: that Jesus was **baptized by John the Baptist**, and that he was **crucified under Pontius Pilate**. Scholars as different as James Dunn, E. P. Sanders, John Dominic Crossan and Bart Ehrman (who describes himself as agnostic) agree on this. Crossan, in a line often quoted, said that his crucifixion is as sure as anything in history can be.

      The reasons are the criteria at work. For the baptism: it is embarrassing (as in the last cards), and Josephus independently writes of John the Baptist, a good man who urged people to baptism, in book 18 of the *Antiquities*. For the crucifixion: Paul, all four Gospels, Josephus and Tacitus agree on it, the sources are independent in part, and a crucified messiah was hard to proclaim.

      Beyond these two the picture is more open. Even the date is debated: the death is placed in about the year 30 or 33, and Pilate governed from 26 to 36.

  - type: mcq
    id: why-certain
    title: "Why these two?"
    prompt: |
      Take the claim "Jesus was crucified under Pilate" and the claim "Jesus walked on water". According to the criteria, why do historians treat the first as near-certain and the second as outside what history can settle?
    options:
      - text: "The first is attested by independent early and outside sources and was awkward for the movement; the second rests on the Gospels alone, and the historian's method cannot decide whether a miracle happened, only what the sources say."
        correct: true
        feedback: |
          Yes. The first passes several criteria. The second is a question about the supernatural, where the method is silent or divided, and where whatever a person says depends partly on their prior view of what is possible (compare the earlier lesson on miracles).
      - text: "Historians have proved that miracles never happen."
        feedback: |
          Historical method does not prove that. Many historians simply say that deciding it lies beyond what the method can do, and some people reach a different view for philosophical or religious reasons.
      - text: "Historians believe the first because the church teaches it."
        feedback: |
          Non-Christian historians accept it as well, on the evidence above. Church teaching is not their ground.
    explanation: |
      A claim being outside the method is not the same as being false. It is a fact about what a given kind of inquiry can reach.

  - type: text
    id: portraits
    title: "Three portraits from the same evidence"
    body: |
      Beyond the two firm points, scholars give different portraits. These are three well-known ones.

      | Portrait | Associated with | Core idea |
      |---|---|---|
      | Apocalyptic prophet | Schweitzer; E. P. Sanders; Bart Ehrman | Jesus announced that God's rule was about to arrive and the age was about to change. |
      | Sage (wisdom teacher) | John Dominic Crossan; Marcus Borg | Jesus taught a way of life in short sayings and parables, with little or no expectation of an imminent end. |
      | Social reformer | Richard Horsley | Jesus led a movement of village renewal against exploitation under Rome and the Temple elite. |

      Sanders, in *Jesus and Judaism* (1985), saw Jesus as a prophet expecting the restoration of Israel; Ehrman wrote *Jesus: Apocalyptic Prophet of the New Millennium* (1999). Crossan has called Jesus a Jewish peasant with a cynic-like style of teaching; Borg described a "spirit person" and a sage who was not apocalyptic. Horsley, in *Jesus and the Spiral of Violence* (1987), set Jesus among popular resistance movements in Roman Palestine, without armed revolt.

  - type: mcq
    id: evidence-fit
    title: "Same text, different readings"
    prompt: |
      Mark 1:15 has Jesus say: "The time is fulfilled, and the kingdom of God has come near; repent, and believe in the good news." Which reading of this verse fits the apocalyptic-prophet portrait, and how might a defender of the sage portrait answer?
    options:
      - text: "Apocalyptic: the kingdom is about to arrive, so repent now. Sage: the kingdom may describe a present way of living under God's rule, taught in parables, not a coming end of the age."
        correct: true
        feedback: |
          Yes. Both start from the same words and both ask what "the kingdom of God" meant to a Jew of the time. This is the very question where the third quest looks to Jewish writings of the period.
      - text: "Both portraits deny that Jesus ever spoke of the kingdom of God."
        feedback: |
          All three portraits take the kingdom of God as central; they differ on what it meant.
      - text: "Only one of them is allowed to use Mark."
        feedback: |
          Every portrait uses the same Gospels; the disagreement is about how to read them.
    explanation: |
      Disagreement here comes from interpretation of a shared text, not from some scholars having secret sources.

  - type: mcq
    id: objections
    title: "Each portrait faces an objection"
    prompt: |
      Match the best objection a critic would raise against the portrait named. Which pairing is correct?
    options:
      - text: "Against the apocalyptic prophet: the end did not come within a generation, so why would the movement keep a teacher who was wrong? (Reply: movements often adapt, and the delay was reinterpreted.)"
        correct: true
        feedback: |
          Yes. Defenders reply that early Christians did adapt; critics say a nonapocalyptic Jesus explains the continuity better.
      - text: "Against the sage: the Gospels contain no sayings at all, so a sage is impossible."
        feedback: |
          The Gospels contain many sayings and parables. The objection to the sage portrait is that it must explain away the Gospels' kingdom and judgment language and the sudden spread of an apocalyptic movement after his death.
      - text: "Against the social reformer: the Gospels never mention Rome, so no reform could be meant."
        feedback: |
          The Gospels do mention Roman rule (taxes, soldiers, Pilate). The objection is that they say little about politics directly, and that Jesus is not clearly a leader of a social movement in Horsley's sense.
    explanation: |
      Steelman each portrait and its best objection; then ask which premise you would reject. A reader may find none decisive.

  - type: text
    id: faith
    title: "How Christians hold the Gospel account"
    body: |
      For most Christians the Gospels are not just sources for a historian but scripture: testimony to the person they worship. What they do with the historian's portraits varies.

      Christians hold, in the creeds, that Jesus is one person who is both fully divine and fully human; the Council of Chalcedon in 451 stated this as one person in two natures, divine and human, neither mixed together nor split apart. Some Christians read the Gospels as accurate reports in every detail, and for them the historical method is welcome where it agrees and limited where it does not. Others accept the critical study of the texts, find in it a reason to read the Gospels as faithful interpretation of the life of Jesus, and hold their faith on other grounds, such as the experience of the church. Still others find historical study of little weight for faith. Non-Christians read the same texts as historical sources about a Jewish teacher, and some as moral literature.

      Notice that none of these positions claims that history alone shows what the creeds say. They differ on how history and faith are to be related.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      According to the three layers (established, scholarly debate, faith commitment), how is the sentence "Jesus rose from the dead" best labelled in a history course?
    options:
      - text: "A faith commitment held by Christians on the testimony of the Gospels and the church; historians can describe what the sources say and what early followers believed, but the method does not settle whether it happened."
        correct: true
        feedback: |
          Yes. This lesson takes no side: it says what kind of claim it is. The earliest followers' belief is a historical datum; the event is a matter on which people differ by prior view.
      - text: "Established fact, because the Gospels say so."
        feedback: |
          That the Gospels say so is established; that it happened is a different claim and depends on what one thinks possible.
      - text: "Disproved, because miracles are impossible."
        feedback: |
          Whether miracles are possible is a philosophical question, treated in the earlier lesson on miracles, not a result of historical research.
    explanation: |
      The same labelling discipline applies to the claim that it did not happen and was invented: that is also not an established fact of the historian's method.

  - type: text
    id: table
    title: "The three layers for this topic"
    body: |
      | Layer | Examples |
      |---|---|
      | Established | Josephus and Tacitus mention Jesus; Paul wrote about 50; the Gospels date from about 65 to 100; Pilate governed 26 to 36. |
      | Scholarly debate | How much of the Testimonium is Josephus's; which criteria are reliable; which portrait fits best; the date (30 or 33) and the reasons for the crucifixion. |
      | Commitment | That Jesus is divine and human (Chalcedon); that the Gospels are inspired; that he rose from the dead; or the denial of these. |

  - type: mcq
    id: sort-claims
    title: "Sort a claim"
    prompt: |
      Which of these is a claim of the middle layer, scholarly debate, according to the table?
    options:
      - text: "Jesus expected the end of the age within his hearers' lifetime."
        correct: true
        feedback: |
          Yes. Respected scholars hold it (Schweitzer, Sanders, Ehrman) and others deny it (Crossan, Borg). It is a question of how to read sources, not a datum.
      - text: "Tacitus wrote about the Christians in his Annals."
        feedback: |
          That is established: the text survives and is generally accepted as his.
      - text: "Jesus is the Son of God."
        feedback: |
          That is a faith commitment (for those who hold it) or a claim denied on other grounds; it is not a result of historical debate.
    explanation: |
      Sorting claims by layer is the skill. The dispute about the apocalyptic portrait is real and open, and thoughtful people differ about it because they weigh the sayings and the Jewish background differently.

  - type: text
    id: summary
    body: |
      **Next:** Paul and the First Churches. Paul is the earliest writer we have, and his letters show how the first communities of Jesus's followers formed, argued and organised themselves within a few decades of his death.
