id: ch15-resurrection
title: "Guided proof: What Can History Say About a Miracle Claim?"
kind: guided
proof: true
own: |
  The setting: the claim of the first Christians that Jesus of Nazareth, crucified in Jerusalem under Pontius Pilate (about 30 or 33 CE), was raised from the dead. Let $R$ be "Jesus was raised" and $\neg R$ "he was not". Let $E$ be the evidence historians have: the early reports of his burial and of his followers' experiences, and the later empty-tomb stories. Everything is taught according to someone, and the claim is weighed the way a historian weighs any ancient report.
  - **The argument in five premises.** According to its defenders (for instance N. T. Wright, Richard Swinburne), P1: some sources are early enough to be close to the events; P2: the core facts are {{ agreed by most historians: the crucifixion, a burial, and the disciples' belief that they had seen him alive }}; P3: {{ no natural explanation (vision, legend, theft) fits these facts as well as the resurrection }}; P4: the prior probability of $R$ is {{ not so small that this evidence cannot outweigh it }}; P5: a believer answers Hume by holding that the prior depends on whether God exists and acts. The conclusion C is that $R$ is more probable than not.
  - **The weighing is Bayes in odds form.** Posterior odds equal the likelihood ratio (how much more likely $E$ is if $R$ than if $\neg R$) times the prior odds:
  {{ $$\frac{P(R\mid E)}{P(\neg R\mid E)}=\frac{P(E\mid R)}{P(E\mid\neg R)}\cdot\frac{P(R)}{P(\neg R)}$$ }}
  With likelihood ratio $10^{4}$, a prior of $10^{-3}$ gives about $91\%$ and a prior of $10^{-9}$ gives about $0.001\%$: the same evidence, opposite verdicts.
  - **Where the weight sits.** History can weigh sources, date them and test rival explanations. The prior comes from a worldview (does God act?), not from the sources, so the argument is {{ valid, but its soundness turns on the prior (P4, P5), on how P1 and P2 are weighed, and on what counts as an explanation }}.
  - **Hume's maxim.** David Hume (1711-1776) held that testimony establishes a miracle only if its falsehood would be {{ more miraculous than the event it reports }}. Critics reply that this assumes the answer by counting all past experience against the miracle; defenders of Hume reply that a law of nature is what uniform experience has established.
  - **Three layers.** Established: the sources and their approximate dates, and that the disciples said they had seen him. Debate: the burial, the empty tomb, and which natural explanations work. Commitment: whether God raised Jesus, or whether such an event can occur.

cards:
  - type: mcq
    id: hook
    title: "Guess: two neighbours, two stories"
    prompt: |
      Guessing is the point. Two neighbours each tell you something they say they saw yesterday. One says it rained in the afternoon. The other says a man walked across the lake without sinking. Both are honest people you have known for years. Which of these best describes how a careful person should treat the two reports?
    options:
      - text: "Both are accepted on the same grounds, since both neighbours are equally honest."
        feedback: |
          Honesty is one input. Even honest people misperceive, misremember and repeat what they heard. A surprising report needs more support than an ordinary one, because a mistake is less surprising than the event.
      - text: "The second needs much more support than the first, because the more surprising a claim is, the more it takes to outweigh the chance of a mistake."
        correct: true
        feedback: |
          Yes. Rain in the afternoon is common, so a small chance of error does not matter. A man on the lake is so rare that even a small chance of error looms large beside it. The lesson turns this thought into numbers.
      - text: "The second must be rejected, since it cannot happen."
        feedback: |
          That assumes the answer. Whether such a thing can happen is the question, and refusing the report beforehand means no evidence could ever count. Careful people ask for more support, not for a closed door.
    explanation: |
      Keep the idea: how much evidence a claim needs depends on how surprising it is. That is what this lesson examines for one of the most discussed claims in history.

  - type: text
    id: scope
    title: "What history can and cannot do"
    body: |
      According to the first Christians, Jesus of Nazareth, executed in Jerusalem, was raised from the dead. Christians hold this as the centre of their faith; the lesson does not ask whether to believe it. It asks a narrower question: **what can the tools of history say about it?**

      Historians can find and date sources, ask who wrote them and why, check which reports are independent of each other, and compare rival explanations of the same data. They cannot run an experiment, and there is a limit that scholars themselves state in two ways. Some (such as Bart Ehrman, in his blog and debates) say that history deals with what most probably happened, and a miracle is by definition the least probable explanation, so history cannot establish one. Others (such as N. T. Wright, 2003, in *The Resurrection of the Son of God*) reply that history can still judge which explanation best fits the evidence, and the answer then depends on what else one holds true about the world.

      So the lesson keeps three layers apart: what is established (the texts and their dates), what is debated among scholars, and what rests on a worldview. It follows the argument as its defenders state it, and asks at each premise what a critic would say.

  - type: text
    id: sources
    title: "The sources, layer by layer"
    image:
      - src: img/rolling-stone.webp
        alt: "Photograph of a rock-cut tomb entrance in Jerusalem with a large round stone, like a millstone, standing in a groove beside the doorway."
        caption: "A rolling-stone tomb in Jerusalem, known as Herod's Family Tomb (the name is disputed): such round stones were rare and belonged to wealthy tombs, so the picture shows the kind of tomb the Gospels describe, not Jesus's own."
        credit: "Willem van de Poll, CC0, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Schijfvormige_steen_bij_het_familiegraf_van_Herodus,_Bestanddeelnr_255-2387.jpg"
        place: bottom
    body: |
      The reports about the resurrection come in layers, and they differ in age and kind.

      **Paul's letter.** In 1 Corinthians, written from Ephesus in about 53 to 57, Paul reminds the church of what he passed on: "first of all that which I also received" (World English Bible). He says that Christ died for our sins and was buried, was raised on the third day, and was seen by Cephas (Peter), then the Twelve, then more than five hundred at once (most still alive when he wrote), then James, then all the apostles, and last by Paul himself. Most scholars think the passage repeats a tradition older than the letter, formed in the first years after the death, though they differ on how early.

      **The empty tomb.** Mark, written about 65 to 75, tells that women went to the tomb and found it open and a young man in white told them Jesus was risen. In Mark's original ending, which stops at 16:8, the women flee afraid and say nothing. Matthew and Luke (about 80 to 90) and John (about 90 to 100) add that the tomb was empty and tell of appearances. Matthew alone adds guards and a story, still told "to this day" in his time, that the disciples stole the body.

      **The appearance stories.** The Gospel accounts of the risen Jesus meeting his followers differ in place, persons and details (Galilee in Matthew and Mark's promise, Jerusalem in Luke), and Paul's list names people the Gospels do not.

  - type: order
    id: order-dates
    title: "Order the sources by age"
    prompt: |
      Put the reports in order from the earliest composition to the latest, using the usual scholarly dates.
    steps:
      - "Paul's first letter to the Corinthians (about 53 to 57), which passes on a tradition he had received."
      - "The Gospel of Mark (about 65 to 75), with the women at the empty tomb."
      - "The Gospels of Matthew and Luke (about 80 to 90), with appearances in Galilee or Jerusalem and, in Matthew, the guards."
      - "The Gospel of John (about 90 to 100)."
    hint: 'Letters from the 50s come before the Gospels; Mark is the earliest Gospel.'
    explanation: |
      Paul is the earliest writer, even though the Gospels come first in the printed Bible. Note that the empty tomb appears in Paul's list only by implication ("was buried, was raised"); the stories of it come later. That ordering matters for the first premise.

  - type: text
    id: argument
    title: "The argument, in five premises"
    body: |
      Here is the historical argument as its defenders (for instance Wright, and the philosopher Richard Swinburne in *The Resurrection of God Incarnate*, 2003) put it. Let $R$ be "Jesus was raised from the dead" and $E$ the evidence.

      **P1.** Some of the sources are early enough to be close to the events.

      **P2.** The core facts are accepted by most historians: Jesus was crucified, he was buried, and his followers came to believe and say that they had seen him alive. (Many defenders add that the tomb was found empty.)

      **P3.** No natural explanation accounts for these facts as well as $R$ does.

      **P4.** The prior probability of $R$ is not so small that this evidence cannot outweigh it.

      **P5.** (The believer's reply to Hume.) Whether the prior is tiny depends on whether God exists and acts, and that is not settled by the history.

      **C.** So it is more probable than not that $R$.

      The next cards go through them and ask what a critic would reject.

  - type: mcq
    id: p1
    title: "P1: are the sources early enough?"
    prompt: |
      P1 says that some sources are early enough to be close to the events. Taking the usual dates (death about 30 or 33; 1 Corinthians about 53 to 57; Mark about 65 to 75), which reply from a critic is fair?
    options:
      - text: "The Gospel accounts are written decades later, and the letter's list of appearances gives no details; the earlier the tradition, the shorter it is, and legends can grow in a generation."
        correct: true
        feedback: |
          Yes. This is the usual critical point: the fullest stories are the latest, and the earliest report is a brief list. Defenders reply that the list is a formula taken over within a few years, that Paul had met Peter and James, and that he says most of the five hundred were still alive to be asked.
      - text: "Documents from after the 30s cannot be used as history at all."
        feedback: |
          Historians use sources written decades after events all the time. The question is what a given source supports, not whether to use it.
      - text: "Paul is not a witness, so his letters are worthless."
        feedback: |
          Paul is a first-hand witness to his own experience and a near-contemporary reporter of what he heard from others. He does not claim to have seen the tomb. His letter is evidence for what believers said, which is exactly what P1 needs.
    explanation: |
      Layer check: that the letter exists and when it was written is established; how close its tradition is to the events is a scholarly judgement; that what it reports happened is a commitment on either side.

  - type: mcq
    id: p2
    title: "P2: which 'facts' are really agreed?"
    prompt: |
      P2 lists core facts said to be accepted by most historians. Gary Habermas's "minimal facts" approach starts from the facts he says nearly all critical scholars grant. Which fact below is the best candidate for broad agreement, and which is disputed?
    options:
      - text: "Agreed: Jesus was crucified under Pilate, and his followers sincerely came to believe they had seen him alive. Disputed: the burial and the empty tomb."
        correct: true
        feedback: |
          Yes. The crucifixion is attested by Tacitus and Josephus as well as the Christian sources. That the disciples believed they had seen him is widely granted, even by those who explain it as visions (Lüdemann). The burial is argued both ways: James Dunn calls it a firm tradition, while Ehrman doubts an honourable burial; the empty tomb is defended by Wright and doubted by Ehrman, while Dale Allison finds the evidence equivocal.
      - text: "Agreed: the tomb was empty and the body was gone. Disputed: the crucifixion."
        feedback: |
          Reversed. The crucifixion is among the best-attested events of the period, and the empty tomb is the more contested.
      - text: "Nothing at all is agreed, since all the sources are Christian."
        feedback: |
          The crucifixion is also reported by the non-Christian writers Tacitus (Annals, about 115) and Josephus (Antiquities, about 93 to 94). And "all Christian" does not mean "all equally late or dependent."
    explanation: |
      A critic of P2 can say that a "fact" list is partly a choice: a short list of what almost everyone grants may leave out what is disputed but important. A defender can say that starting from the shared minimum makes the argument fair to a sceptic.

  - type: text
    id: alternatives
    title: "Alternative explanations, each according to someone"
    body: |
      P3 says nothing natural fits the facts as well. Here are the main natural explanations, with who holds them and the best objection to each.

      **Visions (hallucination).** Gerd Lüdemann (1946-2021), in *The Resurrection of Jesus: History, Experience, Theology* (1994), held that Peter and then Paul had visionary experiences, driven by grief and guilt, and that the others followed. *Objection:* group experiences of the same figure are unusual, and visions would not explain an empty tomb (if there was one) or why the early belief was in a bodily rising and not only a spirit. *Reply:* grief experiences of the dead are well documented, belief in bodily rising may have developed, and the empty tomb may be legend.

      **Legend.** The stories grew by retelling, as legends do, and the empty tomb was added later (Ehrman and others hold that the details are not early). *Objection:* Paul's list is too early for much growth. *Reply:* the list is bare; the vivid stories are late.

      **Theft or a wrong tomb.** Matthew already reports the claim that the disciples stole the body. *Objection:* the disciples then were deceivers, yet they suffered for their message, and a stolen body does not explain their experiences. *Reply:* Matthew's guard story is itself called apologetic, written to answer the charge, and the theft claim may be only a rumour.

      Defenders of the resurrection argue (Wright, 2003) that only a bodily rising explains both the tomb and the appearances together. Each side says the other is overstating how well its own account fits.

  - type: mcq
    id: p3
    title: "P3: what does 'best explanation' ask?"
    prompt: |
      A critic of P3 says: "I grant the early belief and even the empty tomb. A natural cause I cannot name is more likely than a resurrection." A defender replies: "That is not an explanation but a promise of one." What is the real disagreement?
    options:
      - text: "Whether an unspecified natural cause counts as a rival explanation, or an explanation must be spelled out and judged for how well it fits."
        correct: true
        feedback: |
          Yes. One side says a rival need not be named because the unknown is more common than the miraculous (this depends on the prior). The other says that "something natural happened" explains nothing until a specific account is tested. Both are reasoning about the standard for a good explanation.
      - text: "Whether the disciples were honest, which both sides deny."
        feedback: |
          Most scholars on both sides take the disciples to have sincerely believed what they said. The disagreement is about what produced the belief.
      - text: "Whether history can discuss the topic at all; the two agree that it cannot."
        feedback: |
          They do not agree. Both are doing history in the sense of weighing sources and explanations. The dispute about the limits of history is a separate one (card 2).
    explanation: |
      Note that P3 and P4 are not independent: how good the rival must be depends on how unlikely the resurrection is thought to be before the evidence. That is why the next card turns to the prior.

  - type: text
    id: prior
    title: "Hume and the prior"
    body: |
      Recall: David Hume (1711-1776), in his *An Enquiry concerning Human Understanding* (first published 1748 as *Philosophical Essays*), Section X "Of Miracles", defined a miracle as "a violation of the laws of nature" and wrote that "no testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish". In words: a report of a miracle should be believed only if a false report would be even more surprising than the miracle.

      Bayes' rule in odds form states the same weighing as numbers. Let $P(R)$ be the prior probability of $R$ (before looking at the evidence $E$). Posterior odds equal the likelihood ratio, how much more likely the evidence is if $R$ is true than if not, times the prior odds:

      $$\frac{P(R\mid E)}{P(\neg R\mid E)}=\frac{P(E\mid R)}{P(E\mid\neg R)}\cdot\frac{P(R)}{P(\neg R)}$$

      This shows that the evidence and the prior play different roles, and that a verdict needs both. History speaks mainly to the likelihood ratio; the prior comes from what one thinks of the world. Hume's critics (such as John Earman, 2000) say he assumed a tiny prior without arguing for it, and his defenders say that a prior built on uniform experience is exactly what the maxim asks for.

  - type: widget
    id: widget-odds
    title: "Same evidence, different priors"
    widget: odds-updater
    config:
      prior: 1.0e-3
      lr: 10000
      presets:
        - { label: "Open prior, 1e-3", prior: 1.0e-3 }
        - { label: "Tiny prior, 1e-9", prior: 1.0e-9 }
        - { label: "Prior 1e-6", prior: 1.0e-6 }
    body: |
      The likelihood ratio is set to $10^{4}$ (the evidence is ten thousand times more likely if $R$ than if not), as a toy number and not an estimate. Move the prior with the slider or the buttons and watch the posterior. Then move the likelihood ratio too: how large must it be for the tiny prior to reach even odds?
    review: false

  - type: numeric
    id: odds-number
    title: "A toy calculation"
    prompt: |
      Take a prior probability $P(R)=10^{-3}$ and a likelihood ratio $P(E\mid R)/P(E\mid\neg R)=10^{4}$. These are toy numbers, chosen for the exercise. What is the posterior probability $P(R\mid E)$, as a percentage to the nearest whole number?
    answer: 91
    tolerance: 1
    answerText: '91 (odds about 10.01)'
    wrong:
      - value: 10
        feedback: |
          That multiplies the probability $10^{-3}$ by $10^{4}$ and gets $10$, which is not a probability. The rule multiplies the odds, not the probability. Convert the prior to odds first ($\approx 10^{-3}$), multiply, then convert back with $p=\text{odds}/(1+\text{odds})$.
      - value: 99
        feedback: |
          That is the answer for a prior of $10^{-2}$ (odds about $101$). Here the prior odds are $10^{-3}/(1-10^{-3})\approx 0.001$, so the posterior odds are about $10$ and the probability is $10/11$.
    hint: 'Prior odds about $10^{-3}$; multiply by $10^{4}$; then probability $=\text{odds}/(1+\text{odds})$.'
    explanation: |
      Prior odds $0.001001$, times $10^{4}$, give posterior odds $10.01$, and $10.01/11.01\approx 0.909$, so about $91\%$. With a prior of $10^{-9}$ and the same evidence the posterior odds are about $10^{-5}$, so about $0.001\%$. The two results differ by five orders of magnitude, and the history is the same in both. The numbers show how the prior can carry the verdict, not what the right numbers are.

  - type: mcq
    id: p4
    title: "P4: what would a critic reject?"
    prompt: |
      P4 says the prior is not so small that the evidence cannot outweigh it. According to Hume's defenders, which is the strongest reason to reject P4?
    options:
      - text: "A resurrection is a violation of a law of nature, which uniform experience has confirmed in every case we know, so its prior is extremely small."
        correct: true
        feedback: |
          Yes, that is the maxim. Every human we know of who died stayed dead, so the evidence from experience against a rising is overwhelming. The defender's reply is that this experience is about natural causes, and whether anything else acts is the very question.
      - text: "No amount of evidence could change a prior, so P4 is false."
        feedback: |
          Bayes' rule says the opposite: any prior above zero can be raised by enough evidence. Hume himself allowed that testimony could in principle establish a miracle if it were strong enough. The disagreement is how small the prior is, not whether evidence can move it.
      - text: "The prior is zero, because miracles are impossible."
        feedback: |
          A prior of exactly zero would make the evidence irrelevant. That is a metaphysical commitment (naturalism held as certain), not a conclusion of history, and Hume's maxim does not require it.
    explanation: |
      The defender's best reply to Hume's use of "uniform experience" is the circularity charge: if you count every past case as against the miracle, you assumed that no miracle happened. Hume's defenders (Fogelin, 2003) reply that this misreads the maxim.

  - type: mcq
    id: p5
    title: "P5: the believer's reply"
    prompt: |
      P5 says that whether the prior is tiny depends on whether God exists and acts. Swinburne argues that if God exists there are reasons for God to become incarnate and to show it, so the prior is not tiny. What is the sceptic's best reply?
    options:
      - text: "Then the conclusion rests on the prior that God exists and would act this way, so the history cannot settle the question without a prior on the very thing in dispute."
        correct: true
        feedback: |
          Yes. If the prior is raised by a belief in God, a person without that belief starts lower and may end lower. The defender can answer that the evidence also bears on whether God acted, and the sceptic that this is the same circle seen from the other side.
      - text: "God cannot raise anyone from the dead."
        feedback: |
          That is a metaphysical claim. The sceptic's reply does not need it; it needs only that the prior on God acting this way is a matter of worldview.
      - text: "Priors should always be set equal to 50 per cent, so P5 is irrelevant."
        feedback: |
          A flat prior for every claim would make a lottery win as likely as a loss. Priors reflect background knowledge. The dispute is which background knowledge applies.
    explanation: |
      Both sides agree on the form of the argument. They disagree on whether to put the prior in as an input from natural theology or from the history of experience. This is where the argument meets earlier lessons of the course, on the arguments for God and on miracles.

  - type: mcq
    id: validity
    title: "Valid, or sound?"
    prompt: |
      A student writes: "The argument is invalid, because P4 is false." Using the course's distinction, what is wrong with that sentence?
    options:
      - text: "Validity asks whether the conclusion follows if the premises are true. A false premise makes the argument unsound, not invalid."
        correct: true
        feedback: |
          Yes. Validity and truth of premises are separate checks. In a probabilistic form, as here, the conclusion follows from the likelihood ratio and the prior by arithmetic. To reject the conclusion one must reject a premise (or show that the form is missing something), which is why the cards ask which premise.
      - text: "An argument with false premises is automatically valid."
        feedback: |
          An argument can be valid with false premises, but nothing about the falsity makes it valid. The two checks are independent.
      - text: "Historical arguments can never be valid or invalid."
        feedback: |
          They can be put in a valid form; the probabilistic form above follows by Bayes' rule. Whether the premises are true is the part history and worldview must settle.
    explanation: |
      One more point: P3 ("best explanation") is not a deduction but an inference to the best explanation. In the odds form it becomes a claim about the likelihood ratio, which is what turns the argument into arithmetic.

  - type: build
    id: build-odds
    title: "Build the odds form"
    prompt: |
      Build Bayes' rule in odds form for $R$ and the evidence $E$: posterior odds on the left, and on the right the likelihood ratio times the prior odds.
    prefix: '\dfrac{P(R\mid E)}{P(\neg R\mid E)}='
    tiles: ['\dfrac{P(E\mid R)}{P(E\mid\neg R)}', '\cdot', '\dfrac{P(R)}{P(\neg R)}', '\dfrac{P(E\mid\neg R)}{P(E\mid R)}', '+']
    answers:
      - ['\dfrac{P(E\mid R)}{P(E\mid\neg R)}', '\cdot', '\dfrac{P(R)}{P(\neg R)}']
    wrong:
      - answer: ['\dfrac{P(E\mid\neg R)}{P(E\mid R)}', '\cdot', '\dfrac{P(R)}{P(\neg R)}']
        feedback: |
          The likelihood ratio is inverted. Evidence that is more likely under $R$ should raise the odds on $R$, so $P(E\mid R)$ goes on top.
      - answer: ['\dfrac{P(E\mid R)}{P(E\mid\neg R)}', '+', '\dfrac{P(R)}{P(\neg R)}']
        feedback: |
          Odds multiply: the evidence scales the prior odds by a factor. Adding would mean even a tiny prior could not be rescaled by strong evidence.
    explanation: |
      Dividing Bayes' rule for $R$ by Bayes' rule for $\neg R$ cancels the overall probability of the evidence, which is hard to know. What remains is the ratio of likelihoods times the ratio of priors.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      The argument has three places where careful readers diverge, and each has respected people on both sides.

      | Where they differ | One view | Another view |
      |---|---|---|
      | The prior | Wright and Swinburne: given belief in a God who acts, a resurrection is not extremely improbable | Hume and his defenders: uniform experience makes the prior extremely small |
      | The weight of the sources | The early tradition and the sheer number of reported witnesses give a large likelihood ratio | The earliest report is a short list, the vivid stories are late, and the Gospels may reflect legend and apologetics |
      | What counts as an explanation | A specific rival must be shown to fit the data as well | An unknown natural cause is a legitimate rival, since the unknown is far more common than a miracle |

      Lüdemann explains the appearances as visions and rejects a bodily rising. Ehrman holds that historians, working with the probabilities of history, cannot establish a miracle. Allison finds the evidence equivocal and open to more than one reading. Wright and Swinburne argue that the evidence, with theism, favours the resurrection. None of these positions is a failure of reasoning; they differ in the premises they start from and in how they weigh the sources.

  - type: mcq
    id: sort-claims
    title: "Sort the claim"
    prompt: |
      According to the three-layer scheme (established, scholarly debate, commitment), which of these is a claim of the middle layer, scholarly debate?
    options:
      - text: "The tomb in which Jesus was laid was found empty."
        correct: true
        feedback: |
          Yes. Scholars divide on it: Wright defends it, Ehrman and others doubt it, Allison finds the evidence equivocal. It is a question about what the sources support, not a datum or a worldview claim.
      - text: "Paul wrote a letter to Corinth in the 50s in which he lists appearances of Christ."
        feedback: |
          That is established: the letter survives, and its authorship by Paul and its approximate date are not disputed.
      - text: "God raised Jesus from the dead."
        feedback: |
          That is a commitment. Christians hold it and others deny it; history can record that it was claimed and weigh evidence for explanations, but it cannot by itself decide what God does.
    explanation: |
      The first claim is the one on which respected scholars truly differ; the second is a datum and the third rests on a view of what is possible.

  - type: text
    id: table
    title: "The three layers for this topic"
    body: |
      | Layer | Examples |
      |---|---|
      | Established | The texts and their approximate dates (1 Corinthians about 53 to 57; Mark about 65 to 75); Jesus was crucified under Pilate; the first believers said they had seen him alive. |
      | Scholarly debate | The burial and the empty tomb; how early the tradition in 1 Corinthians is; whether visions, legend or theft explain the data; what the Gospel stories add. |
      | Commitment | That God raised Jesus; or that no miracle can occur and any such report must have a natural cause; and the size of the prior that each implies. |

  - type: text
    id: summary
    body: |
      **Next:** Councils, Creeds and the Trinity. With the question of what happened set aside as history can weigh it, the next lesson follows how the first centuries of believers argued about who Christ was, at Nicaea and Chalcedon, according to each side.
