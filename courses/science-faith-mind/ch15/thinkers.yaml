id: ch15-thinkers
title: "Augustine, Aquinas and the Reformers"
kind: concept
own: |
  The setting: Christians from the fifth to the sixteenth century (years are CE) who kept asking three questions after the creeds: how faith and reason relate, how God's grace and human effort relate in salvation, and who has the authority to say what the faith is. Everything is taught according to someone.
  - **Faith and reason.** According to Augustine of Hippo (354 to 430), understanding follows and serves belief ("faith seeks, understanding finds", *De Trinitate* 15.2); the phrase "faith seeking understanding" is the motto of Anselm of Canterbury (1033 to 1109). According to Thomas Aquinas (about 1225 to 1274), reason can show that God exists and some of what God is (his Five Ways, *Summa Theologiae* I, question 2, article 3), while truths such as the Trinity and the Incarnation are known only by revelation. Aquinas called apparent clashes between philosophy and faith an abuse of philosophy.
  - **Grace and free will.** Pelagius (about 355 to about 420) held that God would not command the impossible, so people can keep the commandments, and that Adam's sin was a bad example and brought mortality, not inherited guilt. According to Augustine, Adam's sin left the will unable to choose the good without {{ grace }}; grace heals the will without forcing it. Africa's bishops had Pelagianism condemned in 418; Ephesus did so again in 431. Many Orthodox writers reject inherited guilt while accepting inherited death.
  - **East and West.** The Greek East and the Latin West differed on papal authority (universal jurisdiction in the West; shared authority among equal bishops in the East) and on the *Filioque*, "and the Son", added to the creed's line on the Holy Spirit at Toledo in 589 and sung in Rome from 1014. In 1054 Cardinal Humbert and Patriarch Michael Cerularius excommunicated each other; the break deepened after the sack of Constantinople in 1204. In 1965 Pope Paul VI and Patriarch Athenagoras I lifted the 1054 excommunications; full communion has not been restored.
  - **Reformation.** According to Martin Luther (1483 to 1546), who sent his Ninety-Five Theses against indulgence sales to Archbishop Albert of Brandenburg on 31 October 1517, a person is made right with God by faith alone, apart from works; and Scripture, not pope or council alone, is the final authority (*sola scriptura*). John Calvin (1509 to 1564) set out Reformed teaching in the *Institutes* (1536, in Geneva from 1541). The Council of Trent (1545 to 1563) replied that the gospel is contained in written books and in {{ unwritten traditions }}, and in 1547 taught that faith is the root of justification but works done in grace are meritorious. Lutheran and Catholic churches in 1999 signed a Joint Declaration of common understanding on justification.
  - **Three views of authority.** Catholic: Scripture and Tradition form one deposit that the {{ magisterium }} (the teaching office of pope and bishops) interprets. Orthodox: Scripture lives inside Holy Tradition, whose centre is the seven ecumenical councils. Protestant: Scripture alone is the infallible norm, with tradition subordinate. Established: the dates and texts above. Debated: how far each side's teaching was misdescribed by the other. Commitment: which authority is the right one.

cards:
  - type: mcq
    id: hook
    title: "Guess: can faith and reason disagree?"
    prompt: |
      Guessing is the point; no background is needed. Suppose a careful reader finds that something her church teaches seems to clash with what her reason concludes. Which response seems most natural to you at first?
    options:
      - text: "Faith and reason come from the same source, so the clash must come from a mistake in one of them, and she should look for it."
        correct: true
        feedback: |
          This is close to the line of Augustine and Aquinas, as the lesson will show. It keeps both, and it raises a question: which one gives way when the mistake cannot be found?
      - text: "Faith should win, because reason is limited and can be wrong."
        feedback: |
          Some thinkers have said roughly this, and they are part of the story. The lesson asks what is lost if reason is told to stay silent.
      - text: "Reason should win, because faith is belief without evidence."
        feedback: |
          Many people today think so. The thinkers of this lesson mostly did not describe faith as belief without evidence, and the lesson shows what they meant by it.
    explanation: |
      None of these is the one right guess; each was held by someone. The lesson follows how Christian thinkers, from the fifth century to the sixteenth, answered this question and two more that came with it: how God's grace and human effort fit together, and who decides what the faith is. It names where thoughtful people part ways.

  - type: text
    id: augustine
    title: "Augustine: believe, then understand"
    image:
      - src: img/augustine.webp
        alt: "A 6th-century fresco portrait of Augustine of Hippo"
        caption: "Augustine of Hippo (354-430), in the earliest known portrait, a 6th-century fresco in the Lateran in Rome; he wrote the Confessions and the City of God and shaped Western views of grace."
        credit: "Unknown author, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Augustine_Lateran.jpg"
    body: |
      **Augustine** was born in 354 in Thagaste, in Roman North Africa (today Souk Ahras, Algeria), and died in 430. He wrote his *Confessions* about 396 to 400, after becoming a priest in Hippo in 391 and bishop there about five years later. He began the *City of God* in 412, two years after Rome was sacked, and finished it in 426.

      For Augustine, faith and understanding work together. In his *De Trinitate* (15.2) he wrote, in essence, that faith seeks and understanding finds: believing opens the way to a deeper grasp, and reason then works to see more of what is believed. The well-known phrase "faith seeking understanding" is a motto of **Anselm** of Canterbury (1033 to 1109), who made the idea famous in the Latin West about seven centuries later.

      A limit worth knowing: Augustine's Greek was modest, and he read the Greek-speaking Fathers mostly in Latin translation. Scholars debate how modest, but the point is that the Latin West and the Greek East were already starting to read different books.

  - type: mcq
    id: motto
    title: "Whose motto is it?"
    prompt: |
      A friend says: "Augustine said it best: faith seeking understanding." According to the card above, what is the best correction or refinement?
    options:
      - text: "The idea is Augustine's, but the phrase \"faith seeking understanding\" is Anselm's motto, centuries later."
        correct: true
        feedback: |
          Yes. Augustine wrote that faith seeks and understanding finds, so the idea is his; the Latin motto *fides quaerens intellectum* belongs to Anselm.
      - text: "Augustine thought faith should be abandoned once one understands."
        feedback: |
          Nothing like that. For Augustine, belief remains the starting point and the frame; understanding deepens it and does not replace it.
      - text: "Neither of them cared about reason; both said faith alone matters."
        feedback: |
          Both used philosophy heavily. Anselm even tried to argue for God's existence from the concept of God alone, an argument met in the course on arguments about God.
    explanation: |
      When a quotation circulates, ask who wrote it and when. Being exact about attributions is part of reading these thinkers fairly: popular summaries often compress several centuries into one name.

  - type: text
    id: pelagius
    title: "Grace and free will: Pelagius against Augustine"
    body: |
      Around 400, a lay ascetic named **Pelagius** (about 355 to about 420), probably from the British Isles and living in Rome from the early 380s, urged all Christians, not only monks, to live holy lives. His reasoning, as scholars report it: God would not command what people cannot do, so people must be able to keep the commandments. Adam's sin, he held, set a bad example and brought mortality, but did not corrupt human nature, and infants are born blameless. The ability to act rightly is God's gift; further growth depends on the person's choice.

      **Augustine** became aware of this teaching about 412 and answered that after Adam's sin the will cannot choose the good without grace. Early in his life he had defended free will; by about 400 he thought original sin had badly damaged it. In his view grace does not force the will but heals it, so that it freely wants what is good, and the beginning of the good in us is already God's gift.

      Pope Innocent I condemned Pelagius in 417, and the African bishops had Pelagianism condemned in 418. The Council of Ephesus (431) condemned it again. Later, some in Gaul held a middle view, that the human will begins the turn to God; the Second Council of Orange (529) said even the beginning of faith comes from grace.

  - type: mcq
    id: grace-views
    title: "Who said what about grace?"
    prompt: |
      Which pair of claims matches Pelagius and Augustine, according to the card above?
    options:
      - text: "Pelagius: people can keep God's commands, since God would not command the impossible. Augustine: after Adam, the will needs grace even to begin choosing the good."
        correct: true
        feedback: |
          Yes. Both agree that God is good and that moral life matters. They disagree on what the fall did to human nature, and so on how much of the first step is God's.
      - text: "Pelagius: grace is unimportant and God does not help. Augustine: people have no free will whatever."
        feedback: |
          Both are caricatures. Pelagius counted the ability to act rightly as a gift of God, and Augustine said grace restores the will's freedom and does not remove it.
      - text: "Pelagius: people are saved by works alone. Augustine: people are saved by faith alone."
        feedback: |
          This mixes the later Reformation debate into the fifth century. The Pelagian question was whether human nature can do good on its own strength, not the contrast between faith and works that Luther would raise.
    explanation: |
      Augustine's view shaped Western Christianity: Catholic and many Protestant churches draw on it. Many Orthodox writers use other language. They speak of ancestral sin and say that Adam's descendants inherit death and a weakened nature but not Adam's guilt. Sources of the Orthodox tradition themselves differ on how far this departs from Augustine, so the contrast should not be drawn too sharply.

  - type: text
    id: east-west
    title: "Greek East, Latin West"
    body: |
      By the early Middle Ages the two halves of Christendom spoke different languages, lived under different rulers, and had grown different habits. The Greek East kept the patriarchates of Constantinople, Alexandria, Antioch and Jerusalem, and thought of authority as shared among bishops of equal standing. The Latin West gave the bishop of Rome universal jurisdiction. The Orthodox speak of a primacy of honour; Catholics see it as tied to real authority.

      A second difference was a single word. The creed of 381 says, in Greek, that the Holy Spirit proceeds from the Father. The Third Council of Toledo (589) used a Latin version with **Filioque**, "and the Son": the Spirit proceeds from the Father and the Son. The phrase spread through Spain and the Frankish lands, and Rome itself began to sing it at Mass in 1014, under Pope Benedict VIII.

      The East objected twice. Photius and later Orthodox writers called the doctrine an error. They also said the creed of a general council should not be changed by one region alone. Western defenders replied that the addition only spelled out what Fathers such as Augustine had said. Some scholars add that Greek and Latin used different verbs for "proceeds", so each side may have heard the other wrongly.

  - type: mcq
    id: filioque
    title: "What was the Filioque dispute about?"
    prompt: |
      The *Filioque* ("and the Son") is a Latin addition to the creed's line that the Holy Spirit proceeds from the Father; the East objected to it. According to scholars, which two things were at stake?
    options:
      - text: "A doctrinal question (does the Spirit proceed from the Father alone or from the Father and the Son?) and a question of authority (may one region change the creed of a general council?)."
        correct: true
        feedback: |
          Yes. Scholars stress that the dispute mixed the two, which is why it was hard to settle by talking only about words or only about power.
      - text: "Only the question whether Jesus was fully human."
        feedback: |
          That was the Chalcedon question, met in the lesson Councils, Creeds and the Trinity. The Filioque concerns the Holy Spirit and who changes the creed.
      - text: "Only the question which language the liturgy should use."
        feedback: |
          Language mattered, since Greek and Latin words for proceeding did not line up, but the dispute was not about the liturgical language itself.
    explanation: |
      Notice the pattern of the whole lesson: each dispute has a part that is doctrine and a part that is about authority, about who gets to say. This is why the third question of the lesson, who decides, keeps returning.

  - type: text
    id: schism
    title: "1054 and after"
    body: |
      In 1053 and 1054, Patriarch **Michael Cerularius** of Constantinople closed the Latin churches in his city. The papal legate, Cardinal **Humbert**, answered by excommunicating him, and Cerularius excommunicated the legates in return. Historians note that the legates' act is of doubtful validity, since Pope Leo IX had died before it.

      1054 is the conventional date of the East-West Schism, but scholars who count the break as a long process have proposed other dates, among them 1009, 1204, 1277 and 1484. The sack of Constantinople by the Fourth Crusade in 1204 left bitter memories on the Orthodox side, and efforts at reunion, at Lyon in 1274 and Ferrara-Florence in 1439, did not last.

      On 7 December 1965, Pope Paul VI and Patriarch Athenagoras I held simultaneous ceremonies in Rome and Istanbul and lifted the 1054 excommunications, declaring their intent to commit them to oblivion. This was a gesture of goodwill and not a reunion: the two churches are still not in full communion. Some historians add that the 1054 act was not the beginning of a clean split so much as a failed quarrel.

  - type: mcq
    id: schism-myth
    title: "A split on one day?"
    prompt: |
      A popular story says: "In 1054 the Church split in two on a single day." According to the card above, which reply is fairest?
    options:
      - text: "1054 is the conventional date, but historians describe a long process in which several events mattered, and the 1054 excommunications were lifted in 1965."
        correct: true
        feedback: |
          Yes. The date is useful as a label, and the story of one day hides the centuries of drift, the language gap, the Filioque, and the memory of 1204.
      - text: "No split ever happened; the churches have always been in full communion."
        feedback: |
          They are not in full communion today, and the Orthodox and Catholic churches still differ on papal authority and on the Filioque, among other points.
      - text: "The split was caused only by the quarrel between two men, Humbert and Cerularius."
        feedback: |
          The two men were prominent, but historians point to longer causes: authority, doctrine, language, politics and practice.
    explanation: |
      Historians' dating is layer one (events), its weight is layer two (debated), and which church is right about papal authority is layer three (commitment).

  - type: text
    id: aquinas
    title: "Aquinas: reason and revelation"
    image:
      - src: img/aquinas.webp
        alt: Painted portrait of Thomas Aquinas in a black and white Dominican habit on a gold background, by Carlo Crivelli
        caption: Thomas Aquinas (1225-1274), an Italian Dominican friar and theologian, in a panel Carlo Crivelli painted in 1476 (National Gallery, London); his Summa Theologiae is among the most influential medieval works on faith and reason.
        credit: "Carlo Crivelli, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Thomas_Aquinas_by_Carlo_Crivelli.png"
    body: |
      **Thomas Aquinas** was born about 1225 near Aquino in Italy and died on 7 March 1274 at the abbey of Fossanova, a Dominican friar. His *Summa Theologiae* was written from the later 1260s to 1273 and left unfinished; he was declared a saint by Pope John XXII on 18 July 1323.

      Aquinas divides what we can know about God into two kinds. **Natural theology** is what reason can reach from the world without a sacred text, and **revealed theology** is what depends on revelation, God's self-disclosure in Scripture and church teaching. According to him, reason can show that God exists and something of God's attributes (his *Five Ways* in *Summa Theologiae* I, question 2, article 3, argue from motion, causes, contingency, degrees of goodness and the order of nature). Reason cannot reach truths like the Trinity or the Incarnation, which are known by revelation.

      Why does he think they do not clash? Because truth has one source. He called a supposed clash between philosophy and faith an abuse of philosophy, a mistake in reasoning. A few questions, such as whether the world had a beginning in time, he thought reason cannot settle and faith must supply. Aquinas also said God's existence is self-evident in itself but not to us, which is why one argues from effects in the world.

  - type: mcq
    id: nat-rev
    title: "Natural or revealed?"
    prompt: |
      According to Aquinas, which of these can be reached by reason alone, from the world, and which only by revelation?
    options:
      - text: "That God exists: reason. That God is three persons: revelation."
        correct: true
        feedback: |
          Yes. The Five Ways aim at the first. The Trinity, he held, we could not know unless God told us.
      - text: "That God exists: revelation only. That God is three persons: reason."
        feedback: |
          Reversed. Aquinas argued that God's existence can be shown from the world, and he held that the Trinity cannot.
      - text: "Both: reason can reach everything the church teaches."
        feedback: |
          Not Aquinas. He held that reason reaches a part, and that the rest depends on revelation, which reason can then examine but not produce.
    explanation: |
      Critics of Aquinas ask whether the Five Ways really prove what he says they do; defenders reply that they show a chain of explanation cannot go on without end. The cosmological arguments of the course on arguments about God take that debate up.

  - type: text
    id: indulgences
    title: "Indulgences and Luther"
    image:
      - src: img/luther.webp
        alt: "Painted portrait of Martin Luther in dark clothes and a hat, by Lucas Cranach the Elder, 1528."
        caption: "Martin Luther (1483-1546), painted by Lucas Cranach the Elder in 1528; the German monk and professor whose objections to indulgences began the Reformation."
        credit: "Hajotthu at de.wikipedia, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Cranach_d.%C3%84._Martin_Luther_1528.jpg"
    body: |
      By the late Middle Ages the Western church taught that when sins are forgiven a debt of "temporal punishment" can remain. The Catechism defines an **indulgence** as a remission before God of the temporal punishment due to sins whose guilt has already been forgiven. In Catholic teaching it does not forgive the sin itself. The practice came with abuses: in 1515 Pope Leo X granted an indulgence to help fund the building of St Peter's Basilica in Rome, and preachers such as **Johann Tetzel** sold it near Wittenberg.

      **Martin Luther** (1483 to 1546), a monk and professor in Wittenberg, wrote his *Ninety-Five Theses* against such sales and sent them on 31 October 1517 in a letter to Archbishop Albert of Brandenburg, who oversaw the sales. He wrote out of loyalty, assuming Albert did not know what was preached. The old story that he nailed them to the church door is told by his colleague Melanchthon and doubted by historians, since Luther's own accounts conflict with it. Luther said later that at the time he still considered himself a "papist".

      The matter escalated. At the Diet of Worms in April 1521 Luther refused to take back his writings unless shown wrong by Scripture or by reason; he was declared a heretic and outlaw, and he was excommunicated in 1521. His prince, Frederick the Wise, sheltered him at the Wartburg castle.

  - type: mcq
    id: justification
    title: "How is a person made right with God?"
    prompt: |
      **Justification** is the act by which, in Christian teaching, a person is made right with God. According to Luther and according to the Council of Trent (1547), which pair of statements is fair to each side?
    options:
      - text: "Luther: justification comes by faith alone, apart from works (\"passive\" righteousness received, not earned). Trent: faith is the root of justification, and works done in grace are meritorious."
        correct: true
        feedback: |
          Yes. Trent also called faith the starting point and foundation, so the disagreement was about whether works contribute to justification, not about whether faith matters. For Luther, works follow as fruit and do not add to what is received.
      - text: "Luther: works matter and faith does not. Trent: faith matters and works do not."
        feedback: |
          Reversed. Luther is the one who stressed faith alone, and Trent defended a role for works done in grace.
      - text: "Both: only works matter, faith is private."
        feedback: |
          Neither. Both held that faith in Christ is central and that salvation depends on God's grace.
    explanation: |
      Notice the word "alone": Luther defended adding it to his German translation of Romans 3:28 against critics. The phrase is the sharp point of the debate. In 1999 the Lutheran World Federation and the Catholic Church signed a Joint Declaration on the Doctrine of Justification, which states a common understanding that justification is by God's grace through faith in Christ, and that good works are a response to grace and not its cause. It also said the old mutual condemnations do not apply to the teaching presented in it. Not every Lutheran agreed: 35 of the 124 Lutheran World Federation churches voted against it.

  - type: text
    id: authority
    title: "Who has the last word?"
    body: |
      Luther's second claim was about authority. **Sola scriptura**, Latin for "Scripture alone", is the principle that the Bible is the only infallible authority for Christian faith. Luther and **Calvin** did not reject tradition entirely: they treated it as a servant that is open to correction by Scripture. Some modern Protestants go further and reject all tradition, which is sometimes called *nuda scriptura*, "bare Scripture".

      Luther's *To the Christian Nobility* (1520) added a related idea, the **priesthood of all believers**: all baptized Christians are priests, on his reading of the phrase "royal priesthood" in 1 Peter 2:9, so no separate spiritual class has special access to God.

      **John Calvin** (1509 to 1564) was born in Noyon, France. He published the first Latin edition of the *Institutes of the Christian Religion* in March 1536 in Basel, revised it over his life, and led the church in Geneva from 1541 until his death. Calvin described Scripture as self-authenticating, and Reformed teaching, which includes predestination (God's sovereignty in salvation), takes its name from him.

      The **Council of Trent** (1545 to 1563) was the Catholic reply. In April 1546 it taught that the truths of the gospel are contained in written books and in unwritten traditions, and it accepted the canon of Scripture as read in the church and in the old Latin Vulgate. In 1547 it taught on justification. Catholic teaching today, in Vatican II's *Dei Verbum*, says that Scripture and Tradition together form one deposit of God's word, which the teaching office of pope and bishops, the **magisterium**, interprets.

  - type: mcq
    id: sola
    title: "What does sola scriptura mean?"
    prompt: |
      According to the card above, which statement about Luther and Calvin on *sola scriptura* is accurate?
    options:
      - text: "They held that only Scripture is infallible, and treated tradition as subordinate and open to correction by Scripture, not as worthless."
        correct: true
        feedback: |
          Yes. That is the sense most defenders give to the phrase; it differs from *nuda scriptura*, which excludes all other sources.
      - text: "They held that every believer's private reading is infallible, so the church has no role at all."
        feedback: |
          Not what the Reformers said: they kept preaching, creeds and church order. Defenders distinguish Scripture's authority from any single reader's reading.
      - text: "They rejected the creeds of Nicaea and Chalcedon because those are not in the Bible."
        feedback: |
          Luther and Calvin accepted those creeds as faithful summaries of Scripture. This is one reason their critics said the principle was less simple than its slogan.
    explanation: |
      The Catholic reply to the principle: if Scripture is the only authority, who decides which books belong to it, and which reading is right? Protestants answer that the Spirit guides the church's reading and Scripture is clear enough on essentials. Each side poses a question the other has to meet, and neither is a silly question.

  - type: mcq
    id: bible-myth
    title: "Did Luther invent the Bible in German?"
    prompt: |
      A popular claim: "Before Luther, there was no Bible in German; he invented it." According to the dates, which reply is most accurate?
    options:
      - text: "Printed German Bibles existed before him, from 1466 in Strasbourg and in at least eighteen complete editions; Luther's New Testament of 1522, translated from Erasmus's Greek text and not only from the Latin, and his full Bible of 1534 were new and very widely read."
        correct: true
        feedback: |
          Yes. Luther's achievement was a new translation from the original languages, in lively German, but he did not provide the first German Bible.
      - text: "True: no German Bible existed before 1522."
        feedback: |
          The Mentelin Bible was printed in Strasbourg in 1466 and reprinted many times by 1518, before Luther's New Testament.
      - text: "False: Luther made no translation at all; he used only older printed Bibles."
        feedback: |
          Luther did translate: he began at the Wartburg, and his New Testament appeared in September 1522, based on the Greek text of Erasmus.
    explanation: |
      Myths like this are tempting because Luther's version became so famous. Checking a date, here 1466, repairs the story without lowering Luther's real contribution, or making the earlier Catholic German Bibles disappear.

  - type: mcq
    id: mary-myth
    title: "Do Catholics worship Mary?"
    prompt: |
      A popular claim: "Catholics worship Mary." According to Catholic teaching as described in the lesson, which reply is most accurate?
    options:
      - text: "Catholics distinguish *latria*, adoration owed to God alone, from *hyperdulia*, the special veneration given to Mary, and *dulia*, the veneration given to saints."
        correct: true
        feedback: |
          Yes. The Council of Ephesus (431) called Mary *Theotokos*, God-bearer, which Catholics and Orthodox take as a statement about Christ. Many Protestants still hold that such veneration distracts from the worship of God and say so; that disagreement is real, though it is not the same as a charge that Catholics see Mary as God.
      - text: "Yes: Catholics hold that Mary is a goddess equal to God."
        feedback: |
          Catholic teaching rejects this. Mary is a creature honoured above all saints, not equal to God.
      - text: "No: Catholics give no special honour to Mary at all."
        feedback: |
          They give her special honour, which is the point of the distinction. Orthodox Christians also honour her, with different terms for honour and for worship.
    explanation: |
      The Reformation produced a wave of opposition to Marian veneration in the sixteenth century, and the distinction between veneration and worship is a place where honest dialogue can start. Whether the veneration is wise or helpful is for believers to decide; the claim that the church teaches the worship of Mary is a misdescription.

  - type: order
    id: order-events
    title: "Put the events in order"
    prompt: "Order these from the earliest to the latest."
    steps:
      - "African bishops condemn Pelagianism (418)"
      - "Mutual excommunications of Humbert and Cerularius (1054)"
      - "Aquinas dies at Fossanova (1274)"
      - "Luther sends the Ninety-Five Theses (1517)"
      - "Council of Trent's decree on justification (1547)"
      - "Lutheran-Catholic Joint Declaration (1999)"
    explanation: |
      The order shows that the three questions kept coming back over fifteen centuries: grace (418, 1547, 1999), authority (1054, 1517), and faith and reason (Aquinas). Notice also how the 1999 declaration answers a dispute whose sharpest form dates from 1517 and 1547.

  - type: text
    id: table
    title: "Three views of authority"
    body: |
      Here is a side-by-side picture of how the three families answer the question "who has the last word?", each described as its members would accept.

      | Family | Bible and Tradition | Who interprets |
      |---|---|---|
      | **Catholic** | One deposit, together | Pope and bishops |
      | **Orthodox** | Bible within Tradition (seven councils) | The church in council |
      | **Protestant** | Bible alone infallible, Tradition subordinate | Churches, under the Bible |

      These are summaries, not rules for every church or person: many Orthodox, Catholic and Protestant thinkers speak in more varied ways, and there are many Protestant churches with different church orders.

  - type: mcq
    id: table-check
    title: "Which family is it?"
    prompt: |
      "Scripture lives inside the life of the church and is read together with the councils; it is not a book standing outside that life." Which family of Christians would most naturally say this?
    options:
      - text: "Orthodox"
        correct: true
        feedback: |
          Yes. An Orthodox statement says that the Bible forms a part of Holy Tradition, but does not lie outside of it.
      - text: "Protestants who hold sola scriptura"
        feedback: |
          They place Scripture above tradition as the final norm, not inside it, though they also value the church's reading.
      - text: "Nobody: all three say exactly the same."
        feedback: |
          The three families overlap a great deal in creeds and in the importance of the Bible, but they differ on where the last word rests.
    explanation: |
      Because each family thinks it follows the apostles, the debate is partly about which description of the earliest church is right, a question for historians, and partly about how the Spirit guides the church, which is a question of faith.

  - type: text
    id: table-layers
    title: "The three layers for this topic"
    body: |
      | Layer | Examples |
      |---|---|
      | Established | The dates and texts (Augustine 354 to 430, the 418 condemnation of Pelagianism, the Filioque at Toledo in 589, the 1054 excommunications lifted in 1965, Aquinas 1274, Luther's Theses in 1517, Trent 1545 to 1563, the 1999 Joint Declaration); that German Bibles were printed before Luther; that Catholic teaching distinguishes veneration from worship. |
      | Scholarly debate | How decisive 1054 was in the long split; how far Orthodox and Augustinian views of original sin really differ; whether Luther and Trent differed in substance on justification or mostly in emphasis and wording; whether Luther nailed the Theses to the door; what Pelagius himself taught. |
      | Commitment | Which authority is final (Scripture, Scripture with Tradition, or the councils); whether the pope has universal jurisdiction; whether faith alone or faith with works justifies; whether reason can reach God. |

  - type: text
    id: summary
    body: |
      **Next:** Reading Scripture, literal to critical. Once these churches disagreed about who has the last word on the Bible, Christians also disagreed about how to read it. The next lesson follows the ways of reading, from literal and allegorical to historical-critical, and what each asks of a reader.
