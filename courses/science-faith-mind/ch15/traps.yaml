id: ch15-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: Christianity and the Gospels"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: the Jewish world of Jesus, the Synoptic Gospels, the historical Jesus, Paul, the canon and the manuscripts, the resurrection argument, the creeds, the later thinkers, the ways of reading Scripture, and Christianity today. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone, and the feedback keeps the course's three layers apart: **established fact** (texts, finds, dates), **scholarly debate** (say which), and **faith commitment** (what a tradition holds). Years are BCE or CE; $c.$ means about; a *Gospel* is a narrative of the life of Jesus of Nazareth; the *Synoptic* Gospels are Matthew, Mark and Luke; a *creed* is a short statement of belief recited by a church.

  - type: mcq
    id: trap-messiah
    title: "A messiah was a divine king?"
    prompt: |
      A student says: "In Jesus's time every Jew expected the Messiah, a divine warrior king who would drive out Rome." The Hebrew word *mashiach* means "anointed one". Which reply is closest to what the surviving sources show?
    options:
      - text: "The word first meant a person set apart by anointing, such as a king or a priest. Second Temple texts show several hopes (a royal one in the line of David, priestly figures in the Dead Sea Scrolls, a prophet like Moses), and according to James VanderKam most of those texts do not mention a messianic leader at all."
        correct: true
        feedback: |
          Yes. Hope for a coming figure was one strand among many, and it took different shapes. "Messiah" did not automatically mean a divine being.
      - text: "The sources show no hope for any future figure before Jesus, so the idea began with Christians."
        feedback: |
          This overcorrects. Texts such as the Psalms of Solomon (17), from the first century BCE, pray for a Davidic king, and the Scrolls use royal and priestly titles. The hope existed; it was just not universal or uniform.
      - text: "All sources agree on one figure, a warrior king, and the other pictures are later inventions."
        feedback: |
          The sources, not later writers, give the royal, priestly and prophetic pictures. A single warrior messiah is a later simplification.
    explanation: |
      Keeping the word's first meaning (an anointed person) apart from what later Christians meant by "Christ" avoids reading the whole story into the first century. Whether Jesus fulfilled any of these hopes is a faith commitment, which Christians affirm and others do not.

  - type: numeric
    id: trap-temple-years
    title: "From Herod's Temple to Pilate"
    prompt: |
      Herod the Great began rebuilding the Jerusalem Temple about 19 BCE, and Pontius Pilate became prefect of Judea in 26 CE. A student says: "Add the two numbers, $19 + 26$." How many years lie between 19 BCE and 26 CE? There is no year 0: the year after 1 BCE is 1 CE.
    answer: 44
    tolerance: 0.5
    answerText: '44'
    wrong:
      - { value: 45, feedback: 'That adds $19 + 26$, which counts a year 0 that never existed. From 19 BCE to 1 CE is 19 years, but the year 1 CE itself begins the CE count, so one year is double counted.' }
      - { value: 7, feedback: 'That subtracts $26 - 19$ as if both dates were CE. A BCE year counts backwards from year 1.' }
    hint: |
      From 19 BCE to 1 BCE is 18 years; then one more step reaches 1 CE; then 25 more reach 26 CE.
    explanation: |
      $19 + 26 - 1 = 44$ years. The Temple works were still going, and the same Roman world was in place when Jesus was a young man. With no year 0, a span that crosses the BCE to CE border is the sum of the two numbers minus one.

  - type: mcq
    id: trap-john
    title: "John is a fourth synoptic Gospel?"
    prompt: |
      Matthew, Mark and Luke can be printed in parallel columns and are called the Synoptic Gospels ("seeing together" in Greek). A student says: "John is just a fourth synoptic, so the Synoptic problem asks which of four Gospels copied which." Which reply is best?
    options:
      - text: "John has a different structure and mostly its own material (no parables, three Passovers, the Temple scene near the start of the ministry), so it is not part of the Synoptic problem, which concerns the overlap of Matthew, Mark and Luke."
        correct: true
        feedback: |
          Yes. The problem is created by long stretches of near-identical wording in the first three. John does not overlap with them in that way, so it needs its own questions.
      - text: "John is the earliest Gospel, so the other three copied it."
        feedback: |
          Critical scholars usually date John last, about 90 to 100 CE, and the other three do not copy it. Where it differs from them, the differences are about structure and material, not copying.
      - text: "John is not a Gospel, since it is not among the Synoptics."
        feedback: |
          John is one of the four canonical Gospels. The word *synoptic* names a pattern of overlap, not a ranking of which books count.
    explanation: |
      The Synoptic problem is a question about a particular pattern: which of Matthew, Mark and Luke used which, or what shared source. Good questions start from the pattern in the texts, not from the number of books.

  - type: mcq
    id: trap-mark-direction
    title: "Overlap shows which Gospel copied which?"
    prompt: |
      Mark has 661 verses and Matthew shares about 600 of them, which is about 91%. A student says: "That much overlap shows Mark copied Matthew's shortened version, or else Matthew copied Mark, and you can tell which just from the numbers." Which reply is best?
    options:
      - text: "The numbers show dependence, not direction. Most critical scholars hold that Mark came first, because Matthew and Luke tend to smooth Mark's wording (for example Mark's \"could do no deed of power\" in his home town, which Matthew softens) and rarely agree with each other against Mark's order. A minority, the two-gospel view, holds that Matthew came first and Mark shortened it. Direction needs arguments of this kind."
        correct: true
        feedback: |
          Yes. The overlap says the texts are related. Which way the borrowing ran is argued from the details of wording, order and style, and a minority still argues the other way.
      - text: "The numbers prove the Gospels were written by eyewitnesses who saw the same events, so no copying is needed."
        feedback: |
          Eyewitnesses to one event agree on content, but identical sentences over long passages are not what independent memory produces. The overlap needs an explanation in terms of literary relation.
      - text: "Scholars all agree on one solution, so the question is closed."
        feedback: |
          Markan priority is the majority view, but the two-gospel view survives, and among those who accept Mark first, the lost source Q and the Farrer hypothesis (Luke used Matthew) are still debated.
    explanation: |
      Overlap is established fact; the best solution is a live debate; whether the Gospels are inspired is a commitment that the solution neither proves nor refutes.

  - type: mcq
    id: trap-josephus-tacitus
    title: "Josephus and Tacitus prove the resurrection?"
    prompt: |
      The Roman historian Tacitus (*Annals*, c. 115) says that Christus was executed under the emperor Tiberius by the procurator Pontius Pilate. The Jewish historian Josephus (*Antiquities*, c. 93 to 94) mentions Jesus twice, once as the brother of James. A student says: "Two non-Christian historians mention Jesus, so history proves the resurrection." Which reply is best?
    options:
      - text: "They support that Jesus existed and was executed under Pilate, which most historians accept. They wrote some 60 to 85 years after the death, and Tacitus may be relaying what Christians said. Neither passage, as most scholars read it, is an independent witness to a resurrection, so this evidence does not reach that claim."
        correct: true
        feedback: |
          Yes. Outside mentions show how early the story was known beyond Christian circles. They are good evidence for a crucifixion and weak or silent on the resurrection, which is weighed on other grounds and on the prior.
      - text: "They prove nothing, since both were biased against Christians."
        feedback: |
          This is too strong. Tacitus is hostile in tone and Josephus is not a follower of Jesus, which makes their agreement on the execution and on James useful. A source's attitude affects how to read it; it does not cancel it.
      - text: "Outside historians are not needed, since the Gospels already prove everything."
        feedback: |
          The Gospels are the main source, but they are written by believers, so an outside mention adds a different kind of evidence. Neither type alone settles the resurrection.
    explanation: |
      Tacitus is about 85 years after a death in 30 (or 82 years after 33), and Josephus about 63 to 64. The Testimonium Flavianum is probably a genuine core with later Christian additions in the view of most scholars. Whether Jesus rose is weighed in the lesson on the resurrection, and its prior depends on a worldview.

  - type: mcq
    id: trap-myth-binary
    title: "Either the Gospels are reliable or Jesus was invented?"
    prompt: |
      A student says: "There are only two options. Either the Gospels are accurate in every detail, or Jesus never existed and the whole story was invented." How do most historians, believers and non-believers alike, answer this?
    options:
      - text: "They reject the binary. They treat the Gospels as sources to be weighed with criteria such as multiple attestation and embarrassment, and hold that Jesus was baptized by John and crucified under Pilate as near-certain, while debating how much else is reliable and which portrait fits (apocalyptic prophet, sage, social reformer)."
        correct: true
        feedback: |
          Yes. The question is not all or nothing. Historians work out a probability for each saying or event, and the same sources give different portraits to different scholars.
      - text: "They hold that the Gospels are fully reliable on everything, since the criteria prove each detail."
        feedback: |
          The criteria raise or lower the probability of a detail, but they prove nothing. Each has limits, such as dissimilarity erasing what Jesus shared with his Jewish world.
      - text: "They hold that nothing in the Gospels can be trusted, so very little can be said about Jesus."
        feedback: |
          Historians such as Dunn, Sanders, Crossan and Ehrman agree on a core: the baptism by John and the crucifixion under Pilate. Doubt about details is not doubt about everything.
    explanation: |
      Established: the sources and their dates. Debated: which portrait fits best and how much of the Gospels is reliable. Whether Jesus was, as Christians hold, one person with a divine and a human nature is a commitment that history can neither prove nor refute.

  - type: mcq
    id: trap-paul-alone
    title: "Paul invented Christianity alone?"
    prompt: |
      Paul's seven undisputed letters are the earliest surviving Christian writings (1 Thessalonians about 50 CE). A student says: "Paul wrote first and everything else follows from him, so Christianity is his invention." Which reply is closest to the lesson on Paul?
    options:
      - text: "Some scholars, following William Wrede (1904), call Paul a 'second founder'. Others, such as Dunn and Wright, stress continuity with Jesus and the first apostles. Paul himself says he passed on what he had received (that Christ died for our sins in accordance with the scriptures) and writes of the message that, whether it was he or they, so they proclaim. Which view is better depends on how one weighs Jesus's sayings, Paul's silence about them and the Jewish background."
        correct: true
        feedback: |
          Yes. That the letters are the earliest texts is a fact; that they show Paul inventing the faith is one reading. Beliefs older than his letters appear inside them.
      - text: "Paul had no influence on the first churches, which were already unified before he wrote."
        feedback: |
          The letters show quarrels, for example over whether non-Jewish believers had to take on the Jewish law, and Paul was a major voice in them. The churches were not yet unified.
      - text: "Paul was the author of the Gospel of Luke and the book of Acts, so he shaped them all."
        feedback: |
          The tradition ties Luke and Acts to a companion of Paul, but Acts is dated c. 80 to 90 and where it differs from the letters, historians usually give priority to the letters. Paul wrote no Gospel.
    explanation: |
      The earliest text is not the first belief. Paul passes on traditions he received, so some beliefs are older than his letters. Established: the letters and their dates. Debated: how much he changed the message. Committed: whether his experience was a real revelation of the risen Christ.

  - type: mcq
    id: trap-nicaea-canon
    title: "The Council of Nicaea chose the New Testament?"
    prompt: |
      A popular story says that at Nicaea in 325 the bishops voted on which books would be in the Bible. Which reply fits the evidence in the lesson on the canon and on the creeds?
    options:
      - text: "The canon grew over centuries. Marcion proposed a closed list c. 140, Irenaeus argued for four Gospels c. 180, the earliest surviving list of exactly the 27 books is Athanasius's Easter letter of 367, and synods at Hippo (393) and Carthage (397) approved the list. Nicaea dealt with how the Son relates to the Father and did not discuss the canon."
        correct: true
        feedback: |
          Yes. There was no single meeting. Churches were already using most of these books long before the later lists, and some (Hebrews, Revelation) were disputed longest.
      - text: "Nicaea decided the list, and anyone who disagreed was exiled."
        feedback: |
          The only exiles at Nicaea were Arius and the two bishops who refused to sign, over the creed's wording about the Son. The canon was not on the agenda.
      - text: "The canon was fixed the day the last book was written, with no later lists needed."
        feedback: |
          Early lists differ (Marcion's, the Muratorian fragment, Athanasius's) and some books were disputed, so the lists show a process. No book announces itself as part of a canon.
    explanation: |
      Established: the dates and contents of the lists. Debated: how early the canon was effectively fixed. Committed: whether the canon is inspired and closed, which is a belief about God's role and not about meeting minutes.

  - type: mcq
    id: trap-autographs
    title: "The oldest manuscripts are the originals?"
    prompt: |
      The Greek New Testament survives in more than 5,000 handwritten copies, the oldest being a small papyrus scrap of John (called $\mathfrak{P}^{52}$, about 125 CE). Scholars count roughly 200,000 to 400,000 differences between copies. A student says: "The oldest copies are the authors' own, and 400,000 differences means we cannot know what the text said." Which reply is best?
    options:
      - text: "No autograph (author's own copy) survives; the oldest copies are earlier copies of copies. Differences are counted across all copies, so more copies means a larger count; most are spelling and word order, and a small share changes the sense. Scholars weigh readings by external evidence (older, more widespread witnesses) and internal evidence (the shorter or harder reading is often preferred)."
        correct: true
        feedback: |
          Yes. A big count reflects a big number of witnesses, which also gives scholars more material to reconstruct the text. A few places remain open, for example the longer ending of Mark (16:9 to 20) and the passage on the woman caught in adultery, which most scholars hold were added later.
      - text: "The number of copies makes the text certain in every verse, since a majority of copies always preserves the original reading."
        feedback: |
          Copies are weighed, not counted: many late copies can descend from one source, and a late copy can preserve an early reading. Certainty about every verse is not claimed.
      - text: "Nothing can be known about the original, because every copy is corrupt."
        feedback: |
          This treats a few unsettled places as if they were everywhere. Most differences do not change the meaning, and the great fourth-century Bibles agree with each other in most places.
    explanation: |
      The wrong shortcut is either 'older means original' or 'more differences means no knowledge'. A scholar asks for each variant which reading best explains the others.

  - type: numeric
    id: trap-prior-odds
    title: "A tiny prior is not a verdict"
    prompt: |
      In the lesson on the resurrection, let $R$ be "Jesus was raised" and $E$ the evidence. Posterior odds equal the likelihood ratio (how much more likely $E$ is if $R$ than if not $R$) times the prior odds. Take a toy likelihood ratio of $10^{4}$ and prior odds of $10^{-3}$. What are the posterior odds?
    answer: 10
    tolerance: 0.05
    answerText: '10'
    wrong:
      - { value: 0.0000001, feedback: 'That divides, $10^{-3}/10^{4}$. The likelihood ratio multiplies the prior odds; evidence that favours $R$ should raise the odds, not lower them.' }
      - { value: 10000.001, feedback: 'That adds $10^{4} + 10^{-3}$. Bayes in odds form multiplies the two factors.' }
    hint: |
      Multiply $10^{4}$ by $10^{-3}$. The exponents add.
    explanation: |
      $10^{4} \times 10^{-3} = 10$, odds of 10 to 1, about 91% (since $10/11 \approx 0.909$). With a prior of $10^{-9}$ the same evidence gives posterior odds of $10^{-5}$, about 0.001%. So a small prior does not decide the matter by itself and a large likelihood ratio does not either: the numbers depend on a worldview about whether God acts, and that is why the argument is valid but its soundness turns on the prior. The numbers here are toy values, not a measurement.

  - type: mcq
    id: trap-nicaea-invented
    title: "Nicaea invented Jesus's divinity?"
    prompt: |
      At the Council of Nicaea (325) the bishops said that the Son is *homoousios* (of the same substance) with the Father. A student says: "Before Nicaea nobody thought Jesus was God, and Constantine imposed it." Which reply fits the lesson on the creeds?
    options:
      - text: "The dispute that led to Nicaea was between Arius, for whom the Son was the first and greatest creature, and Alexander and later Athanasius, for whom the Son is fully God. Both sides already prayed to Christ; the question was how he relates to the one God. Constantine called the council and, according to Eusebius, proposed the word, but historians also point to the bishops' own debates. Whether the councils stated truly who Christ is, or added to the message of the earliest Christians, is a commitment."
        correct: true
        feedback: |
          Yes. The facts (dates, texts, the emperor's role) are established, and how far politics shaped the outcome is debated. That the council 'invented' the belief is one reading on one side of a debate that is also a faith question.
      - text: "Nicaea made no decision, since the bishops failed to agree on anything."
        feedback: |
          The council issued a creed, condemned Arius and, according to the lesson, almost all bishops signed. Disputes continued afterwards, but the council did decide.
      - text: "Constantine alone wrote the creed and the bishops had no say."
        feedback: |
          Constantine called the council and did not vote; the bishops debated and signed. Eusebius credits him with proposing the key word, but the text was approved by the bishops.
    explanation: |
      Different readers treat the creed as development, clarification or addition. Each reading is held with different premises about what the earliest Christians meant, and history alone does not choose.

  - type: mcq
    id: trap-trinity
    title: "The Trinity means three gods?"
    prompt: |
      A student says: "Christians say Father, Son and Holy Spirit are each God, so they worship three gods." Which reply best states the formula developed by the Cappadocians and affirmed at Constantinople (381)?
    options:
      - text: "One *ousia* (shared being) in three *hypostases* (individuals who have it): Father, Son and Holy Spirit. The formula was devised to say that God is one, with three who share that one being. Critics ask whether this stays coherent, and defenders reply with distinctions; whether it is true is a commitment."
        correct: true
        feedback: |
          Yes. The creed is not a claim of three gods. It is an attempt to hold the one-God claim and worship of Father, Son and Spirit together, and the debate about whether it succeeds is carried on inside and outside the churches.
      - text: "Three ousiai, one hypostasis."
        feedback: |
          That reverses the terms. The Cappadocian formula is one ousia and three hypostases.
      - text: "The Son and the Spirit are created beings made by the Father."
        feedback: |
          That is the view of Arius about the Son, which Nicaea condemned. The 381 creed adds that the Spirit is worshipped and glorified with the Father and the Son.
    explanation: |
      Reading 'God' as a single kind of being or as a single individual changes what the formula means. The lesson separates what the councils wrote (established) from whether their wording succeeds (debated) and from whether it is true (commitment).

  - type: mcq
    id: trap-faith-reason
    title: "Augustine and Aquinas put faith against reason?"
    prompt: |
      A student says: "Christian thinkers always held that faith and reason are enemies." According to the lesson on the later thinkers, which pair of statements best corrects this?
    options:
      - text: "According to Augustine, understanding follows and serves belief ('faith seeks, understanding finds'), and 'faith seeking understanding' became the motto of Anselm. According to Aquinas, reason can show that God exists and some of what God is, while truths such as the Trinity and the Incarnation are known only by revelation, and apparent clashes with philosophy are an abuse of philosophy."
        correct: true
        feedback: |
          Yes. Neither treats faith and reason as opposed. They differ on how far reason goes on its own, and that difference is a live question among Christians.
      - text: "Augustine held that faith must be blind, and Aquinas that reason alone suffices for everything."
        feedback: |
          Augustine tied faith to understanding, and Aquinas held that some truths are known only by revelation, so he did not hold that reason suffices for everything.
      - text: "Both held that reason has nothing to say about God."
        feedback: |
          Aquinas's Five Ways are an argument from reason to God's existence, and Anselm's motto asks for understanding.
    explanation: |
      Other Christians have indeed placed faith and reason further apart, so the claim is not impossible for some thinkers. The trap is the word 'always'. The relation is debated, and where one stands is a mix of arguments and commitments.

  - type: mcq
    id: trap-literal-allegory
    title: "Literal against allegorical?"
    prompt: |
      A student says: "Readers of the Bible are either literalists, who read everything as plain history, or allegorists, who read everything as symbol." Which reply best matches the lesson on reading Scripture?
    options:
      - text: "Medieval readers worked with four senses (literal, allegorical, moral, anagogical) in which, according to a couplet attributed to Augustine of Dacia, the letter teaches what happened. Origen held that some passages have no bodily sense, and Luther and Calvin stressed the plain sense. Today readers also ask about genre (history, parable, poem, apocalyptic vision). Most readers combine several kinds of reading."
        correct: true
        feedback: |
          Yes. The choice is rarely between two options. Even those who prize allegory generally began with the letter, and those who prize the plain sense recognise parables and poems.
      - text: "All Christians before the Reformation read only allegorically, and the Reformers invented the plain sense."
        feedback: |
          The four senses begin with the literal, and Luther and Calvin did stress the literal sense, but they did not invent it. Alexandria and Antioch also differed less sharply than the old picture says.
      - text: "Since the Council of Trent, Catholics may read any way they like."
        feedback: |
          Trent (session 4, 1546) forbade interpreting Scripture in matters of faith and morals against the sense the Church has held, or against the unanimous teaching of the Fathers.
    explanation: |
      The old binary hides both the range inside traditions and the shared question 'what kind of writing is this?'. Which authority decides between readings is a commitment, and it differs between Catholics, Orthodox and Protestants.

  - type: mcq
    id: trap-inerrancy
    title: "Inerrancy means reading every verse literally?"
    prompt: |
      The Chicago Statement on Biblical Inerrancy (1978, an evangelical statement) says that Scripture is without error or fault in all its teaching. A student says: "So inerrantists must read every verse as literal history." Which reply is best?
    options:
      - text: "The same statement also asks for interpretation that takes account of literary forms, so inerrancy is a claim about what the text teaches, read for its genre. The Catholic constitution *Dei Verbum* (1965) states that truth is set forth differently in historical, prophetic, poetic and other texts. Where these statements part is partly in how they limit what counts as error, a debate among believers."
        correct: true
        feedback: |
          Yes. Both documents tie truth to genre. Whether inerrancy covers history and science, or is limited to what concerns salvation, is argued within and between traditions.
      - text: "The statement says nothing about interpretation, only that the Bible is true."
        feedback: |
          The statement has articles that call for attention to the Bible's literary forms, so interpretation is part of it.
      - text: "Inerrancy is a conclusion of historical criticism."
        feedback: |
          Inerrancy is a commitment about Scripture held by believers. Historical criticism asks who wrote a text, when and from what sources, and does not itself reach a verdict of that kind.
    explanation: |
      'Inerrant' and 'literal' are different ideas, since a parable can be taught without error. How the claims relate is debated, and they are layer-3 commitments in the labels of this course.

  - type: mcq
    id: trap-dying
    title: "Christianity is dying worldwide?"
    prompt: |
      Pew Research Center's 2011 report counted about 2.18 billion Christians in 2010. In 1910 Europe held about two-thirds of the world's Christians and in 2010 about 26%, while sub-Saharan Africa went from fewer than 9 million Christians to more than 516 million. A student says: "Europe's share fell, so Christianity is dying globally." Which reply is best?
    options:
      - text: "A falling share in one region is not a global decline. The same report shows the centre shifting south: about 61% of Christians lived in the Global South in 2010. According to Philip Jenkins, the centre of Christianity is moving to Africa, Asia and Latin America. These are estimates, and later revisions exist."
        correct: true
        feedback: |
          Yes. A region's share and the world total can move in different ways. Looking only at Europe misses most of the Christians in the world.
      - text: "The figures are made up, since religion cannot be counted."
        feedback: |
          Counts of self-identified believers are estimates, based on censuses and surveys, with definitions that matter. They are useful with their limits, not meaningless.
      - text: "Christianity is growing everywhere, and no region is shrinking."
        feedback: |
          Europe's share fell sharply from two-thirds to 26%. The picture is a shift, with growth in some regions and declines in the share of others.
    explanation: |
      Always ask which quantity is meant: a share or a count, one region or the world. Established: the estimates, as estimates. Debated: how far the South is more conservative than the North.

  - type: mcq
    id: trap-pentecostal
    title: "Pentecostals are Catholics?"
    prompt: |
      Pentecostalism teaches that believers should seek a second experience after conversion, the baptism of the Holy Spirit, with gifts such as speaking in tongues, healing and prophecy. Pew counted about 279 million Pentecostals and 305 million charismatics. A student says: "Pentecostals and charismatics are the same group, and they are basically Catholics." Which reply is best?
    options:
      - text: "Pew counts Pentecostals as members of Pentecostal churches, and charismatics as people in older churches (Catholic, Orthodox and others) who share similar practices. Together about 584 million, roughly a quarter of all Christians. Historians treat the Azusa Street revival in Los Angeles in 1906, led by William J. Seymour, as the main catalyst for the spread of Pentecostalism."
        correct: true
        feedback: |
          Yes. The practices overlap and the churches do not. The Catholic charismatics are a movement inside the Catholic Church; Pentecostal churches are their own denominations.
      - text: "Pentecostalism began in the sixteenth century as a Catholic order."
        feedback: |
          The lesson dates its spread to Azusa Street in 1906, and Pentecostal churches are outside the older church families.
      - text: "Pentecostals reject the Bible and rely only on visions."
        feedback: |
          Pentecostals hold Scripture central. What sets them apart is the emphasis on a further experience of the Spirit and its gifts.
    explanation: |
      A practice can cross church lines. Telling a movement apart from a denomination is part of reading any count of Christians.

  - type: mcq
    id: trap-liberation
    title: "Liberation theology is Marxism?"
    prompt: |
      According to Gustavo Gutiérrez, whose *A Theology of Liberation* appeared in 1971, theology is critical reflection on Christian practice in the light of the Word, with a preferential option for the poor. The Vatican's 1984 instruction criticised strands that adopt Marxist analysis as the base of theology. A student says: "So liberation theology simply is Marxism in a cassock." Which reply is best?
    options:
      - text: "The 1984 instruction criticised particular strands that take Marxist analysis as the base; defenders reply that social analysis is not the same as Marxist ideology. The movement grew out of the Latin American bishops' conference at Medellín in 1968 and a concern for the poor. Archbishop Oscar Romero, shot at Mass on 24 March 1980, was canonised in 2018. How far the borrowing went is debated."
        correct: true
        feedback: |
          Yes. The question is how far a tool of analysis shapes the theology. Critics and defenders both accept that some writers used social-scientific tools; they disagree on whether this changes the message.
      - text: "The Vatican has never said anything about liberation theology."
        feedback: |
          The Congregation for the Doctrine of the Faith issued instructions in 1984 and 1986, so the Vatican did comment, with both criticism and appreciation of concern for the poor.
      - text: "Gutiérrez rejected the Bible and based his theology on economics."
        feedback: |
          His definition places the Word at the centre of reflection. That economics is one of the tools used is a different claim.
    explanation: |
      A label can hide a gradation. Established: the documents and dates. Debated: how much Marxist analysis entered the theology of each author. Committed: whether the poor's liberation is part of the Gospel's message.

  - type: mcq
    id: trap-count-truth
    title: "Counting believers settles whether it is true?"
    prompt: |
      One student says: "Over two billion Christians, so it must be true." Another says: "The Gospels were copied, edited and argued over for centuries, so it must be false." Which reply to both is best?
    options:
      - text: "Neither inference follows. The number of believers is a fact about people, and the history of copying and councils is a fact about texts. Both are established or debated at layers 1 and 2. Whether the central claims are true (that Jesus was raised, or is one person with two natures) is a layer-3 commitment, and the course's task is to see which premise each person holds."
        correct: true
        feedback: |
          Yes. Facts about who believes or how the texts were handed down change how one weighs sources, but they do not decide the faith claim in either direction.
      - text: "The first inference is sound and the second is not, because truth follows the majority."
        feedback: |
          Majorities have been wrong about many things in the history of science and of religion. Popularity is a social fact, not a proof.
      - text: "The second inference is sound and the first is not, because anything edited over time is false."
        feedback: |
          A text can be copied and argued over and still say something true. Transmission history bears on what the text originally said, not on whether it is right.
    explanation: |
      Keeping the three layers apart is the habit that this level trains. A find, a date or a count (layers 1 and 2) can be fully granted by believers and sceptics alike while they still part on layer 3.

  - type: text
    id: summary
    title: "What this round tested"
    body: |
      Each trap was a shortcut one step too far. **The world of Jesus**: *messiah* first meant an anointed person, hopes took several shapes, and 19 BCE to 26 CE is $19 + 26 - 1 = 44$ years. **The Synoptic Gospels**: John is not part of the Synoptic problem, and overlap (about 600 of Mark's 661 verses) shows dependence, not direction, though most scholars hold that Mark came first. **The historical Jesus**: Tacitus and Josephus support an execution under Pilate, not a resurrection, and the choice is not between a perfect record and an invented figure. **Paul**: he is the earliest writer, not the sole founder, and he passes on what he received. **The canon and manuscripts**: the list grew from Marcion to Athanasius (367) and Carthage (397), Nicaea did not choose it, no autograph survives, and a large count of variants reflects a large number of copies. **The resurrection**: with likelihood ratio $10^{4}$ a prior of $10^{-3}$ gives odds of $10^{4} \times 10^{-3} = 10$, about 91%, while $10^{-9}$ gives about 0.001%, so the verdict depends on the prior. **The creeds**: Nicaea settled how the Son relates to the Father, and the Trinity is one *ousia* in three *hypostases*, not three gods. **The thinkers and the readers**: Augustine, Anselm and Aquinas tie faith to understanding, readers use several senses, and inerrancy is about what the text teaches, read for its genre. **Today**: Europe's share fell while Christianity moved south, Pentecostals and Catholic charismatics share practices but not churches, and liberation theology is debated, not simply Marxism. Under all of them, the three layers: a count, a date or a reading (layers 1 and 2) does not settle what a tradition holds (layer 3), in either direction.

      Where thoughtful people part ways is in how much the early sources can bear, in which authority decides between readings, and in the prior one brings to the resurrection claim.

      **Next:** a quick recall of the level's main distinctions (the lesson Quick Recall), and then its content map.
