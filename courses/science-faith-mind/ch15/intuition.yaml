id: ch15-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: Christianity studied as history, text and thought, from the world of Jesus (years are CE) to today. Every answer below is *according to* some scholar, text or church.
  - **Three layers.** On a claim about Jesus or the Gospels, the sources, their dates and their contents are established fact; which solution or portrait fits best is a live debate; whether Jesus was raised, or is divine, or the books are inspired, is a faith commitment.
  - **Dates.** Jesus died about 30 (or 33); 1 Thessalonians was written about 50; Mark about 65 to 75; Matthew and Luke about 80 to 90; Josephus's *Antiquities* about {{ 93 to 94 }}; Tacitus's *Annals* about 115.
  - **Synoptic problem.** Material in Matthew, Mark and Luke is the triple tradition; material in Matthew and Luke only (about 200 verses) is the double tradition. Most scholars hold {{ Markan priority }}. The two-source view explains the double tradition by a lost sayings source Q; the Farrer hypothesis says Luke used Matthew, so Q is not needed.
  - **Criteria of authenticity.** Multiple attestation (limit: the sources must be independent), embarrassment (depends on the audience), dissimilarity (erases what Jesus shared with Judaism) and coherence (circular if the base is chosen to fit). They raise or lower probability and do not prove.
  - **Canon and manuscripts.** Marcion (about 140), Irenaeus (about 180, four Gospels), Athanasius (367, the 27 books), the synods of Hippo (393) and Carthage (397). More than 5,000 Greek manuscripts; external evidence weighs age and spread; internal evidence prefers the {{ harder and shorter }} reading.
  - **Bayes in odds form.** For a claim $R$ and evidence $E$:
  $$\frac{P(R\mid E)}{P(\neg R\mid E)}=\frac{P(E\mid R)}{P(E\mid\neg R)}\cdot\frac{P(R)}{P(\neg R)}$$
  Posterior odds equal likelihood ratio times prior odds. When the prior is tiny, the odds are about the likelihood ratio times the prior, so the same evidence can give opposite verdicts.
  - **Councils.** Nicaea 325: the Son is {{ homoousios }} with the Father. Constantinople 381: one ousia in three hypostases. Ephesus 431: Mary as Theotokos, Nestorius deposed. Chalcedon 451: one person in two natures.
  - **Thinkers and readers.** Augustine: faith seeks, understanding finds; Anselm: faith seeking understanding; Aquinas: reason shows that God exists, revelation gives the Trinity. Four senses: literal, allegorical, moral, anagogical. Catholic: Scripture and Tradition with a magisterium; Protestant: *sola scriptura*.
  - **Today.** According to Pew (2011), about 2.18 billion Christians in 2010; Europe fell from two-thirds of them in 1910 to {{ 26% }}; about 61% now live in the Global South. A share is a fraction of the total, and a count is a number of people.

cards:
  - type: text
    id: welcome
    title: "Quick recall: Christianity and the Gospels"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main distinctions: the three layers of a claim, the dates of the sources, the Synoptic problem, the criteria of authenticity, the canon and the manuscripts, a Bayesian update, the councils, the thinkers and the readers, and the numbers of Christianity today.

      Three kinds of card: **mnemonics**, **build and order cards**, and **numeric cards that give you data only**: you choose the method yourself.

      As always, every answer is *according to* someone or some view. Nothing here asks which faith is true.

  - type: mcq
    id: layers
    title: "Three layers on a claim about Jesus"
    prompt: |
      Every claim sits in one of three layers: **established fact**, **live scholarly debate**, or **faith commitment**. Which assignment is right? (a) Mark and Matthew overlap in wording in many episodes. (b) Mark was the first Gospel and Matthew and Luke both used it. (c) Jesus rose from the dead.
    options:
      - text: '(a) established, (b) live debate (a majority view), (c) faith commitment.'
        correct: true
      - text: '(a) live debate, (b) established, (c) faith commitment.'
        feedback: |
          Swapped. Anyone can set the texts side by side and see the overlap. Which Gospel used which is a model that most scholars favour but a minority rejects.
      - text: '(a) established, (b) established, (c) live debate.'
        feedback: |
          Markan priority has rivals (the Griesbach view), so (b) is not settled. And (c) is held by faith by Christians and denied on other grounds elsewhere; the historian can weigh the sources but not decide that God acted.
      - text: 'All three are established, since all three come from the same texts.'
        feedback: |
          A claim can be argued from a text and still be open. The overlap is the fact, the order of writing is debated, and a resurrection is a commitment.
    explanation: |
      Mnemonic: **fact, debate, commitment**: what the texts say, how they came to be, what they mean for faith. Never pass a commitment off as a fact, in either direction.

  - type: order
    id: dates
    title: "Order the sources by date"
    prompt: |
      Put these events and writings in order of their usual dates, earliest first.
    steps:
      - 'The death of Jesus under Pontius Pilate (about 30 or 33).'
      - 'Paul writes 1 Thessalonians, the earliest surviving Christian text (about 50).'
      - 'The Gospel of Mark is written (about 65 to 75).'
      - 'The Gospels of Matthew and Luke are written (about 80 to 90).'
      - 'Josephus finishes his *Antiquities*, with a passage on Jesus and one on his brother James (about 93 to 94).'
      - 'Tacitus writes in his *Annals* that Christus was executed under Tiberius and Pilate (about 115).'
    hint: |
      Start with the event, then Paul's letter, then the Gospels in the order Mark, then the other two, then the two Roman-era historians.
    explanation: |
      About 30, 50, 65 to 75, 80 to 90, 93 to 94, 115. Mnemonic: **death, Paul, Mark, the other two, Josephus, Tacitus**. Paul's letter is some twenty years after the death, and Tacitus some eighty-five years after it. Dates for the Gospels are scholarly estimates, and some scholars put Matthew earlier.

  - type: mcq
    id: triple-double
    title: "Triple and double tradition"
    prompt: |
      Material found in Matthew, Mark and Luke is called the **triple tradition**. Material found in Matthew and Luke but not in Mark, about two hundred verses, is the **double tradition**. According to most critical scholars (Markan priority), which description is right?
    options:
      - text: 'Mark was written first; Matthew and Luke each used Mark for the triple tradition, and the double tradition needs a further explanation.'
        correct: true
      - text: 'Matthew was written first; Luke used Matthew; Mark combined and shortened both.'
        feedback: |
          That is the Griesbach (two-gospel) hypothesis, a minority view. Its critics ask why Mark would drop the Sermon on the Mount and the birth stories.
      - text: 'The double tradition is the only part that was copied; the triple tradition arose by chance.'
        feedback: |
          Word-for-word agreement over whole episodes is not chance. Both traditions need an explanation, and the models differ in how they give it.
      - text: 'The three Gospels were written together by one committee.'
        feedback: |
          No ancient or modern scholar holds this. The differences in order, wording and content point to separate authors who share material.
    explanation: |
      Mnemonic: **triple = all three; double = Matthew and Luke only**. Arguments for Markan priority: Mark is shortest, Matthew and Luke tend to smooth Mark's wording (Mark says Jesus "could do no deed of power" in his home town, Matthew softens it), and Matthew and Luke rarely agree against Mark's order.

  - type: mcq
    id: q-farrer
    title: "Q or Farrer"
    prompt: |
      Two models keep Markan priority and explain the double tradition. Which pairing is right?
    options:
      - text: 'Two-source: Matthew and Luke each used Mark and a lost sayings source Q, independently. Farrer: Luke used Matthew as well as Mark, so Q is not needed.'
        correct: true
      - text: 'Two-source: Luke used Matthew. Farrer: Matthew and Luke each used Q.'
        feedback: |
          Reversed. It is the Farrer hypothesis (Austin Farrer, 1955) that has Luke use Matthew and so removes Q.
      - text: 'Two-source: Q is a manuscript found at Nag Hammadi. Farrer: Q is the Gospel of Thomas.'
        feedback: |
          No manuscript of Q survives; Q (German *Quelle*, "source") is reconstructed from the overlap. Thomas was found at Nag Hammadi but is a separate text, mostly dated to the second century.
      - text: 'Both models say that Mark used Matthew and Luke.'
        feedback: |
          That is the Griesbach view again. Both Q and Farrer assume that Mark came first.
    explanation: |
      Mnemonic: **Q = a lost source both used; Farrer = Luke used Matthew**. Which is better is an open debate. Streeter (1924) added M and L for the material found only in Matthew or only in Luke.

  - type: mcq
    id: criteria
    title: "Criteria of authenticity and their limits"
    prompt: |
      Historians of Jesus use four criteria. Which pairing of criterion and limit is right?
    options:
      - text: 'Multiple attestation: sources must be independent, not copied from each other. Embarrassment: depends on who the audience was. Dissimilarity: erases what Jesus shared with Judaism. Coherence: circular if the base is chosen to fit.'
        correct: true
      - text: 'Multiple attestation: a detail in three Gospels counts three times, even if they copy each other. Dissimilarity: proves what Jesus said.'
        feedback: |
          Matthew and Luke copy Mark in many places, so three Gospels may be one source. And dissimilarity only picks out what is unlike its context, which would leave out much that Jesus must have shared with his world.
      - text: 'Embarrassment: any strange detail is authentic. Coherence: proves a saying is genuine if it sounds right.'
        feedback: |
          A strange detail may embarrass one audience and not another, and coherence only fits a saying to what is already accepted. The criteria raise or lower probability; none proves.
      - text: 'The criteria were invented to prove the resurrection.'
        feedback: |
          They were developed to separate sayings and deeds across the tradition, and are used by believers and non-believers alike. They say nothing about whether Jesus was raised.
    explanation: |
      Mnemonic: **independent, audience, Jewish world, circle**: one limit for each name. They raise or lower probability; they never prove.

  - type: order
    id: canon-order
    title: "Order the stages of the canon"
    prompt: |
      Put these stages in the order they happened, earliest first.
    steps:
      - 'Marcion proposes a closed list: a shortened Luke and ten letters of Paul (about 140).'
      - 'Irenaeus argues that the church has exactly four Gospels (about 180).'
      - 'Athanasius lists exactly the 27 books in his Easter letter (367).'
      - 'The synod of Hippo approves a list (393).'
      - 'The synod of Carthage approves a list matching the Catholic canon (397).'
    hint: |
      A second-century proposal comes first, then a bishop's letter in the fourth century, then two African synods a generation later.
    explanation: |
      About 140, 180, 367, 393, 397. Mnemonic: **Marcion, Irenaeus, Athanasius, Hippo, Carthage**. The canon grew over centuries; it was not decided at one meeting. Records of Hippo are largely lost, and the 393 date rests mostly on the later Carthage acts.

  - type: mcq
    id: manuscripts
    title: "Reading the manuscripts"
    prompt: |
      The Greek New Testament survives in more than 5,000 copies, and scholars count 200,000 to 400,000 differences among them. A reader says: "That is 400,000 errors, so we cannot know what the authors wrote." Which reply is right?
    options:
      - text: 'The count adds up every difference between copies, so more copies give a bigger count; most are spelling and word order, and a small share changes the sense. Scholars weigh witnesses by age and quality, and prefer the harder and shorter reading.'
        correct: true
      - text: 'The count is wrong; the copies agree in every word.'
        feedback: |
          The copies do differ. Two of the best known cases, the ending of Mark (16:9 to 20) and the passage on the woman caught in adultery (John 7:53 to 8:11), are missing from the two oldest great codices.
      - text: 'The most numerous reading is always the original, because copies were made carefully.'
        feedback: |
          Counting copies counts how popular a family was, not how old it is. A single early witness can outweigh many late ones.
      - text: 'Only the oldest copy matters, whatever it says.'
        feedback: |
          Age is one piece of external evidence; the old copy may still contain a slip. Internal evidence (a scribe tends to add and to smooth) is weighed with it.
    explanation: |
      Mnemonic: **witnesses are weighed, not counted**. External evidence: age and spread. Internal evidence: the harder and shorter reading, the one that explains how the others arose.

  - type: numeric
    id: odds-data
    title: "An update with new numbers"
    prompt: |
      A historian gives a claim a prior probability of $0.05$. A piece of evidence turns out to be $20$ times as likely if the claim is true as if it is false. What is the probability of the claim after this evidence? Give a decimal.
    answer: 0.513
    tolerance: 0.005
    answerText: '0.513'
    wrong:
      - { value: 1.0, feedback: 'That multiplies the prior probability by 20. The multiplication works on odds, not on probabilities, and a probability cannot exceed 1.' }
      - { value: 1.053, feedback: 'That is the posterior odds. The question asks for a probability: convert the odds back.' }
    hint: 'Work in odds for the update, then convert back to a probability.'
    explanation: |
      Prior odds are $0.05/0.95\approx0.0526$. Times the likelihood ratio $20$ gives posterior odds $\approx1.053$, so the probability is $1.053/2.053\approx0.513$. The evidence moved the claim from a long shot to about even.

  - type: numeric
    id: tiny-prior
    title: "Same evidence, a tiny prior"
    prompt: |
      Now take evidence that is $10^{4}$ times as likely if a claim is true as if it is false, and a prior probability of $10^{-8}$. What is the posterior probability, as a percentage? Give a decimal.
    answer: 0.01
    tolerance: 0.0005
    answerText: '0.01'
    wrong:
      - { value: 99, feedback: 'That would follow if strong evidence always won. A likelihood ratio of $10^{4}$ cannot make up for a prior of $10^{-8}$.' }
      - { value: 0.0001, feedback: 'That is the probability as a fraction, not a percentage.' }
    hint: 'Limit check: when a prior is very small, odds and probability are almost the same number. Then multiply by the likelihood ratio and express the result as a percentage.'
    explanation: |
      Prior odds are about $10^{-8}$; times $10^{4}$ gives odds of about $10^{-4}$, a probability of about $0.0001$, that is $0.01\%$. With the prior $10^{-3}$ the same evidence gives about $91\%$. The evidence is the same; the verdict depends on the prior, which comes from a worldview and not from the sources.

  - type: order
    id: councils-order
    title: "Order the four councils"
    prompt: |
      Put these decisions in the order of their councils, earliest first.
    steps:
      - 'Nicaea: the Son is *homoousios*, of the same substance as the Father; Arius is condemned.'
      - 'Constantinople: one *ousia* in three *hypostases*; the creed adds clauses on the Holy Spirit.'
      - 'Ephesus: Mary is called *Theotokos*, God-bearer; Nestorius is deposed.'
      - 'Chalcedon: one person in two natures, "without confusion, without change, without division, without separation".'
    hint: 'First the question of whether the Son is God, then the Spirit, then how Christ is also human.'
    explanation: |
      325, 381, 431, 451. Mnemonic: **Son, Spirit, Mother, natures**. Each council answered a question the previous one left open. The Oriental Orthodox churches rejected Chalcedon, and the Church of the East had already rejected Ephesus.

  - type: mcq
    id: words
    title: "Ousia, hypostasis, nature"
    prompt: |
      According to the Cappadocians (Basil, Gregory of Nazianzus, Gregory of Nyssa), which pairing of Greek word and meaning is right?
    options:
      - text: '*Ousia* is the shared being, and *hypostasis* is an individual who has it: one ousia in three hypostases.'
        correct: true
      - text: '*Ousia* is an individual, and *hypostasis* is the shared being: three ousiai in one hypostasis.'
        feedback: |
          Reversed. The Cappadocians separated the two words so that "three" counts the individuals (hypostases) and "one" counts the shared being (ousia).
      - text: 'Both words mean the same thing, so the formula says nothing.'
        feedback: |
          Before the Cappadocians the words were often used as synonyms, which caused confusion. Separating them is what made the formula work.
      - text: '*Ousia* means the emperor and *hypostasis* means the council.'
        feedback: |
          Neither is a political word. Both are philosophical terms, *ousia* for being or substance and *hypostasis* for an individual who has it.
    explanation: |
      Mnemonic: **ousia = what, hypostasis = who**. Chalcedon later used the same pattern for Christ: two natures in one person.

  - type: mcq
    id: thinkers
    title: "Augustine, Anselm, Aquinas"
    prompt: |
      Which pairing of thinker and view on faith and reason is right?
    options:
      - text: 'Augustine: understanding follows belief ("faith seeks, understanding finds"). Anselm: faith seeking understanding is the motto. Aquinas: reason can show that God exists (the Five Ways), while the Trinity is known only by revelation.'
        correct: true
      - text: 'Augustine: reason alone proves the Trinity. Aquinas: reason shows nothing about God.'
        feedback: |
          Reversed in Aquinas's case: he held that reason can show that God exists and something of what God is. The Trinity and the Incarnation, for him, are known by revelation.
      - text: 'Anselm: faith is opposed to understanding. Augustine: seek understanding only after losing faith.'
        feedback: |
          Neither held this. For both, faith is the starting point and understanding is the aim.
      - text: 'All three held that faith and reason can never meet.'
        feedback: |
          All three held that they meet, in different ways; they differed on how far reason can go without revelation.
    explanation: |
      Mnemonic: **Augustine: believe to understand; Anselm: the motto; Aquinas: two roads, reason and revelation**. The phrase "faith seeking understanding" is Anselm's motto and not Augustine's.

  - type: build
    id: senses
    title: "The four senses of Scripture"
    prompt: |
      Medieval readers named four senses of a passage. Build them in the order of the couplet: what happened, what to believe, what to do, where one is heading.
    tiles: ['\text{literal}', '\text{allegorical}', '\text{moral}', '\text{anagogical}', '\text{historical-critical}', '\text{inerrant}']
    answers:
      - ['\text{literal}', '\text{allegorical}', '\text{moral}', '\text{anagogical}']
    wrong:
      - answer: ['\text{historical-critical}', '\text{inerrant}', '\text{moral}', '\text{literal}']
        feedback: |
          Historical criticism is a modern method (from Spinoza and Astruc on) and inerrancy is a claim about Scripture's truth. Neither is one of the four senses.
    hint: 'The letter teaches what happened; allegory what to believe; the moral sense what to do.'
    explanation: |
      Mnemonic: **happened, believe, do, heading**. Origen's earlier picture was a body, a soul and a spirit. Luther and Calvin put the plain (literal) sense first.

  - type: mcq
    id: authority
    title: "Who decides: Trent and sola scriptura"
    prompt: |
      Which pairing of church family and view of authority is right?
    options:
      - text: 'Catholic: Scripture and Tradition form one deposit, interpreted by the magisterium. Protestant: Scripture alone is the final norm (*sola scriptura*). Orthodox: Scripture lives inside Holy Tradition, centred on the councils.'
        correct: true
      - text: 'Catholic: Scripture alone. Protestant: the magisterium decides.'
        feedback: |
          Reversed. The Council of Trent (1545 to 1563) answered Luther by affirming written books and unwritten traditions; *sola scriptura* is the Protestant principle.
      - text: 'All three say the pope alone decides what the Bible means.'
        feedback: |
          Only the Catholic view gives the magisterium (pope and bishops) the office of interpreting, and not the pope alone. Orthodox churches stress councils, and Protestants the text itself.
      - text: 'All three accept the same authority and differ only on which books count.'
        feedback: |
          They differ on authority itself, which is the question the Reformation raised.
    explanation: |
      Mnemonic: **Scripture plus Tradition plus magisterium; Scripture alone; Scripture within Tradition**. Which authority is right is a faith commitment; the dates and texts are established.

  - type: numeric
    id: pew-growth
    title: "A shift south, by scaling"
    prompt: |
      According to Pew's 2011 report, sub-Saharan Africa had fewer than 9 million Christians in 1910 and more than 516 million in 2010. By about what factor, at least, did the number grow? Give a decimal.
    answer: 57.3
    tolerance: 0.5
    answerText: '57.3'
    wrong:
      - { value: 507, feedback: 'That is the difference in millions, not the factor by which the number grew.' }
      - { value: 0.017, feedback: 'That divides the old number by the new one. The question asks how many times larger the new one is.' }
    hint: 'Scaling check: growth by a factor means a ratio of the later number to the earlier. Since 9 million is an upper bound for 1910, the result is a lower bound.'
    explanation: |
      $516/9\approx57.3$, so the number grew by a factor of at least about 57, which the report rounds to roughly 60. A share and a count are different things: the factor describes people, not a fraction of the world.

  - type: numeric
    id: pew-share
    title: "A share against a count"
    prompt: |
      According to Pew, about 2.18 billion people were counted as Christians in 2010, and about 61% of them lived in the Global South. How many Christians is that, in billions? Give a decimal.
    answer: 1.33
    tolerance: 0.02
    answerText: '1.33'
    wrong:
      - { value: 0.61, feedback: 'That uses the share as if it were a number of people. A share multiplies the total.' }
      - { value: 0.85, feedback: 'That is about the Global North (39% of the total), the other part.' }
    hint: 'Share-versus-count check: a share is a fraction of the total, so the count is smaller than the total and proportional to the share.'
    explanation: |
      $0.61\times2.18\approx1.33$ billion, which matches Pew's "more than 1.3 billion". The other $39\%$ is about $0.85$ billion, near the report's 860 million. Whether counting believers says anything about whether a faith is true is a different question; it does not settle it either way.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **The setting:** Christianity studied as history, text and thought; every answer is *according to* someone.

      **Three layers.** Sources and dates are established; the Synoptic solution and the portrait of Jesus are debated; resurrection, divinity and inspiration are commitments. **Dates.** About 30 death, 50 First Thessalonians, 65 to 75 Mark, 80 to 90 Matthew and Luke, 93 to 94 Josephus, 115 Tacitus. **Synoptic.** Triple tradition (all three), double tradition (Matthew and Luke only); Markan priority; Q versus Farrer. **Criteria.** Independence, audience, the Jewish world, circularity. **Canon.** Marcion about 140, Irenaeus about 180, Athanasius 367, Hippo 393, Carthage 397; witnesses are weighed, not counted. **Councils.** 325, 381, 431, 451; ousia and hypostasis; one person, two natures. **Readers.** Four senses; Scripture and Tradition versus *sola scriptura*.

      $$\frac{P(R\mid E)}{P(\neg R\mid E)}=\frac{P(E\mid R)}{P(E\mid\neg R)}\cdot\frac{P(R)}{P(\neg R)}$$

      The numbers you computed: prior $0.05$ with a likelihood ratio of $20$ gives about $0.513$; $10^{4}$ with a prior of $10^{-8}$ gives about $0.01\%$; Africa grew at least about $57$ times; $61\%$ of $2.18$ billion is about $1.33$ billion.

      **Next:** the content map of this level: rebuild its concept map box by box among look-alike decoys.
