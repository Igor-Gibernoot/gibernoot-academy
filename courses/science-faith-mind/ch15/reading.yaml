id: ch15-reading
title: "Reading Scripture: Literal to Critical"
kind: concept
own: |
  The setting: Christian readers of the Bible, from the third century CE to today, who agree that the text matters and differ on how to read it. Everything is taught according to someone.
  - **Layers of meaning.** According to Origen (about 185 to about 253), Scripture is like a person, with a body (the plain sense), a soul and a spirit (deeper senses); some passages, he held, have no bodily sense at all. Medieval readers settled on four senses: literal, allegorical, moral and anagogical. The couplet that sums them up, attributed to Augustine of Dacia, says the letter teaches {{ what happened }}, allegory what to believe, the moral sense what to do, and the anagogical sense where one is heading.
  - **Two schools.** According to many historians, Alexandria (Origen) leaned on allegory and Antioch (Diodore of Tarsus, died 390, and Theodore of Mopsuestia) on the historical sense plus *theoria*, a looking through the event to a further meaning; scholars today stress that the contrast was less sharp than the old picture.
  - **Reformation and Rome.** According to Luther and Calvin, the literal (plain) sense is the one that counts; Calvin said Origen tortured Scripture away from its true sense. The Council of Trent (fourth session, 8 April 1546) forbade interpreting Scripture in matters of faith and morals against the sense {{ the Church has held and holds }}, or against the unanimous teaching of the Fathers.
  - **Historical criticism.** Reading the Bible as a historical document began to be pressed from Spinoza (1670), who denied that Moses wrote all the Torah; Astruc (1753) sorted Genesis by the divine names; Wellhausen (1878, revised 1883) set out the four-source theory. Its core question is {{ who wrote this, when, for whom and from what sources }}.
  - **Genre.** Whatever the method, a reading must ask what kind of writing it is (history, parable, poem, apocalyptic vision). The Catholic constitution *Dei Verbum* (1965) says truth is set forth differently in texts that are historical, prophetic, poetic and others; the Chicago Statement (1978, evangelical) says Scripture is "without error or fault in all its teaching" and also asks for interpretation that takes account of literary forms.
  - **Disagreement.** Established: the texts, dates and documents above. Debated: how sharp the Alexandria-Antioch split was; whether *Dei Verbum*'s "for the sake of salvation" limits inerrancy. Commitment: which authority decides between readings, and whether a critical result can ever override a tradition.

cards:
  - type: mcq
    id: hook
    title: "One saying, three readings"
    prompt: |
      Guessing is the point; no background is needed. In one saying, Jesus tells his hearers that if an eye causes them to sin, they should tear it out. Three readers take it differently. Reader A: do it, literally. Reader B: it is a vivid exaggeration, meaning "take sin so seriously that you cut off whatever leads to it". Reader C: it is a picture of the soul, where the "eye" stands for a desire. Which reading seems most natural to you at first?
    options:
      - text: "Reader B: a vivid exaggeration with a serious point."
        correct: true
        feedback: |
          This is how most Christian traditions have taken the saying, and it is a good first guess. The lesson shows that B is already a decision about the kind of language being used, not only about the words.
      - text: "Reader A: take the words as they stand."
        feedback: |
          It sounds like the most faithful reading, and the lesson asks what "as they stand" means for a sentence that is clearly vivid speech. Very few readers across the centuries have actually followed it.
      - text: "Reader C: the words are a picture of something inward."
        feedback: |
          Some ancient readers loved readings of this kind. The lesson follows how they justified them and who objected.
    explanation: |
      None of the three guesses is silly; each is a method with a history. The lesson follows how Christians have read their scriptures, from the layered readings of the early centuries to the historical and critical readings of the last four, and what each asks of the reader.

  - type: text
    id: origen
    title: "Origen: Scripture has a body, a soul and a spirit"
    image:
      - src: img/origen.webp
        alt: "A 1700 engraving of Origen teaching a group of students"
        caption: "Origen (about 185 to about 253), in an imagined teaching scene engraved by Jan Luyken in 1700; he taught in Alexandria and later in Caesarea."
        credit: "Luyken, Jan (1649-1712), Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:OrigenStudentsLuyken.jpg"
    body: |
      **Origen** was born in Alexandria in Egypt about 185 and died about 253, probably in Tyre. In Book 4 of his *On First Principles* he compares Scripture to a human being: as a person has a body, a soul and a spirit, so does Scripture, which God arranged for the salvation of human beings.

      The "body" is the plain, historical sense, which he says is open to all and helps the simple believer. The "soul" and the "spirit" are deeper senses, found beneath the surface of the text. Origen added a bold claim: some passages, he thought, have no bodily sense at all (or one that cannot be true as it stands), and then the reader must look for the soul or spirit of the passage.

      Allegory, from a Greek word meaning "saying one thing and meaning another", reads a text as pointing to a different subject than its surface. His reason, in essence, was that God's wisdom is deeper than any one story.

  - type: mcq
    id: origen-q
    title: "What did Origen claim?"
    prompt: |
      According to Origen's *On First Principles*, which statement matches his view of the layers of Scripture?
    options:
      - text: "Scripture, like a person, has a body (plain sense) and deeper levels (soul and spirit); in some passages the plain sense is missing and only the deeper levels remain."
        correct: true
        feedback: |
          Yes. He did not throw away the plain sense in general; he called it useful and open to all believers. His striking claim is the passage where it fails.
      - text: "Only the plain sense matters and anything deeper is invention."
        feedback: |
          This is closer to the later Reformers and to the Antiochene teachers, not to Origen.
      - text: "Scripture has exactly one sense, the one its human author meant."
        feedback: |
          Many modern readers hold this, but it is not Origen's. For him God's meaning could go beyond what the human author could have had in view.
    explanation: |
      A layered reading is not necessarily a careless one. Origen was a careful textual scholar too: he compiled the Hexapla, a six-column edition of the Hebrew Bible, in Caesarea. His allegory belongs to the same mind that checked wording closely.

  - type: text
    id: schools
    title: "Alexandria and Antioch"
    body: |
      A familiar story sets two schools against each other. **Alexandria**, following Origen, loved allegory. **Antioch**, in Syria, answered with an emphasis on the historical sense. Its founder is usually said to be Diodore of Tarsus (died 390); his student Theodore of Mopsuestia pressed it further. For Antiochene teachers the text's *theoria*, a Greek word for "contemplation" or "insight", was a way of looking through a real event (a king's reign, an exile) to a further meaning, such as Christ, without turning the event into a mere symbol.

      Scholars now qualify this picture. Patristic specialists report that *theoria* itself blended literal reading, a modified allegory and typology (a pattern in which an earlier person or event prefigures a later one), and some argue that the two schools differed less than the old story claims. Who counts as Antiochene is also disputed. The history had a sharp edge: in 553 the Council of Constantinople condemned Theodore's views, which shows that limiting the Old Testament's reach to its own time was itself judged risky by some.

  - type: mcq
    id: schools-q
    title: "What does the old story get wrong?"
    prompt: |
      An older textbook says: "Alexandria used allegory and ignored history; Antioch used history and rejected every deeper meaning." According to recent scholarship on Antiochene *theoria*, what is the best correction?
    options:
      - text: "Antioch's *theoria* looked through a real event to a further meaning, and the two schools overlapped more than the contrast suggests."
        correct: true
        feedback: |
          Yes. The sharp contrast is a teaching simplification; the sources show shared methods and real, but smaller, differences.
      - text: "There was no difference at all between Origen and Diodore."
        feedback: |
          Too far the other way. They did differ on how far the text may be read past its history, and Diodore founded a school to challenge Origen's method.
      - text: "Alexandria rejected the plain sense completely."
        feedback: |
          Origen called the plain sense useful and open to all; he held that a few passages lack it.
    explanation: |
      A good rule when reading about history of interpretation: when one side is described as "only" literal and the other "only" allegorical, look for a more careful account.

  - type: text
    id: augustine
    title: "Augustine on the literal meaning, and on foolish claims"
    body: |
      **Augustine of Hippo** (354 to 430) wrote his *Literal Meaning of Genesis* (*De Genesi ad litteram*) over roughly 401 to 415. By "literal" he meant careful attention to what the text says and how it relates to the world, not a flat reading. In it he made a remark that later readers, including Galileo in 1615, would quote: even non-Christians know a good deal about the earth, the sky and the stars, and a Christian who speaks foolishly about them as if Scripture said so brings the faith into disrepute. He also advised caution when a passage allows several readings, so as not to present one reading as beyond question.

      So Augustine put forward two guard rails: use what is known of nature when deciding what a text can mean, and hold a reading humbly where the words permit more than one. This is the early root of a question the lesson returns to: how far may knowledge from outside the text change how one reads it?

  - type: mcq
    id: augustine-q
    title: "Augustine's warning"
    prompt: |
      According to Augustine's *Literal Meaning of Genesis*, why should a Christian be careful about claims on the earth, the sky and the stars?
    options:
      - text: "Because non-believers often know these things with good reason, and a Christian's foolish claims, presented as Scripture's teaching, harm the faith."
        correct: true
        feedback: |
          Yes. His worry was about both honesty and witness: wrong claims about nature, said in Scripture's name, push others away.
      - text: "Because Scripture never says anything about nature."
        feedback: |
          Augustine did not say that. He commented in detail on creation; his point concerned how to hold readings, not whether the text speaks of the world.
      - text: "Because only the church hierarchy may discuss nature."
        feedback: |
          Nothing like this appears in the remark; it addresses any Christian who speaks of nature.
    explanation: |
      Notice that Augustine's advice cuts both ways. It does not say that science settles what Genesis means, and it does not say that Genesis settles science; it asks for modesty about how a reading was reached.

  - type: text
    id: quadriga
    title: "The four senses of the Middle Ages"
    body: |
      By the early Middle Ages many teachers used four senses. John Cassian (about 360 to 435) gave the classic example in his *Conferences* (14): the one word **Jerusalem** can be taken historically as the city of the Jews, allegorically as the Church of Christ, anagogically as the heavenly city of God, and in the moral (tropological) sense as the human soul.

      A Latin couplet, attributed to the Dominican Augustine of Dacia in the 13th century (his *Rotulus pugillaris*), sums up the scheme. In English: the letter teaches what happened; allegory, what to believe; the moral sense, what to do; the anagogical sense, where you are heading. The Catechism of the Catholic Church (1992), quoting the couplet, adds a rule: the literal sense comes first and all the others rest on it.

      | Sense | Question it answers | Jerusalem |
      |---|---|---|
      | Literal | What happened? | The city of the Jews |
      | Allegorical | What should I believe? | The Church of Christ |
      | Moral | What should I do? | The human soul |
      | Anagogical | Where am I heading? | The heavenly city of God |

  - type: mcq
    id: quadriga-q
    title: "Which sense is it?"
    prompt: |
      A medieval preacher reads the crossing of the Red Sea in Exodus and says: "Each of us must leave behind some slavery of habit." Which of the four senses (literal, allegorical, moral, anagogical) is he using?
    options:
      - text: "The moral sense: it answers 'what should I do?'"
        correct: true
        feedback: |
          Yes. He draws an instruction for life from the story. (The Catechism's own example for the allegorical sense is the Red Sea read as a sign of Christ's victory and of Christian baptism.)
      - text: "The literal sense: it tells what happened."
        feedback: |
          The literal sense concerns the event, an escape from Egypt. The preacher speaks of the hearers' own habits, which is a different layer.
      - text: "The anagogical sense: it points to the end of time."
        feedback: |
          That sense looks ahead to the eternal destination, such as a heavenly Jerusalem. This preacher is speaking of present conduct.
    explanation: |
      One text can sustain several senses at once, and a medieval teacher did not think they excluded each other. The test question for each is the one in the couplet: what happened, what to believe, what to do, where am I heading.

  - type: text
    id: reformers
    title: "The Reformers and Trent: whose sense counts?"
    body: |
      **Martin Luther** (1483 to 1546) and **John Calvin** (1509 to 1564) both pressed the literal sense against the stacking of allegories. Luther's motto is usually given as the literal sense of Scripture alone. Calvin's commentary on Galatians 4:22 blames Origen and others for tearing Scripture away from its true sense; yet Calvin granted that a text can carry a figure, and Luther read Christ as the heart of the literal sense. Scholars debate how complete the break with the medieval fourfold scheme really was.

      The **Council of Trent**, in its fourth session on 8 April 1546, replied to a danger it saw: in matters of faith and morals, no one should rely on his own judgement to interpret Scripture against the sense that holy mother Church has held and holds, or against the unanimous teaching of the Fathers. The Catholic view is that the Spirit guides the Church's reading. The Protestant view is that Scripture interprets itself, with the Church's reading open to correction by the text.

  - type: mcq
    id: reformers-q
    title: "What are they disagreeing about?"
    prompt: |
      Luther and Calvin urged the literal sense; Trent forbade readings contrary to the sense the Church holds. Which description of the disagreement is fair to both sides?
    options:
      - text: "Both honour Scripture's plain sense; they differ on who decides between readings: the Church's teaching office with the Fathers, or Scripture itself read in the churches."
        correct: true
        feedback: |
          Yes. It is a question about authority, which the lesson Augustine, Aquinas and the Reformers already met. Neither side claimed to be inventing readings freely.
      - text: "Luther and Calvin wanted every believer to invent a private meaning; Trent wanted none."
        feedback: |
          The Reformers tied reading to the text's plain sense and to Scripture as a whole, not to private fancy. Trent's concern was the risk of private distortion, but the sides described themselves differently.
      - text: "Catholics read only allegorically, Protestants only literally."
        feedback: |
          The Catechism itself says the literal sense is the foundation of all the senses, and Calvin allowed figures in the text. Both sides used both.
    explanation: |
      Each side thinks its rule protects the text: Rome fears a free-for-all, the Reformers fear a tradition that can silence the text. Which fear is more serious is a question of commitment, not of history.

  - type: text
    id: criticism
    title: "The historical-critical turn"
    body: |
      From the 17th century a new question took root: treat the Bible like any other ancient collection and ask who wrote each part, when, and from what sources. This is the **historical-critical method**. Four stations:

      **Baruch Spinoza** (1632 to 1677) published his *Theological-Political Treatise* anonymously in 1670. He argued that Scripture should be interpreted from the Bible itself and the history of its writing, as one studies nature, and denied that Moses wrote all, or most, of the Torah: the text speaks of Moses in the third person and records his death.

      **Jean Astruc** (1684 to 1766), a French physician, published his *Conjectures* anonymously in 1753. He sorted Genesis by the name used for God (Elohim or YHWH) and by doublets, second tellings of one incident, and found several source documents. His aim was to defend Mosaic authorship: he thought Moses had joined older memoirs.

      **Julius Wellhausen** (1844 to 1918) set out the four-source theory (J, E, D, P) in the book first published in 1878 and retitled *Prolegomena* in 1883.

      **Albert Schweitzer** (1875 to 1965) in *The Quest of the Historical Jesus* (1906, English 1910) argued that the many lives of Jesus written by scholars said as much about their authors as about him.

  - type: order
    id: order-events
    title: "Put the stations in order"
    prompt: "Order these from the earliest to the latest."
    steps:
      - "Augustine's Literal Meaning of Genesis (written about 401 to 415)"
      - "The Council of Trent's fourth session on interpreting Scripture (1546)"
      - "Spinoza's Theological-Political Treatise (1670)"
      - "Astruc's Conjectures on Genesis (1753)"
      - "Wellhausen's History of Israel, later the Prolegomena (1878)"
      - "Schweitzer's Quest of the Historical Jesus (1906)"
    explanation: |
      The critical method did not appear suddenly in the 19th century: it grew over about two and a half centuries, from Spinoza's doubts about Moses to Schweitzer's doubts about the historians' own portraits of Jesus.

  - type: mcq
    id: astruc-q
    title: "A surprise about the method's roots"
    prompt: |
      Jean Astruc's 1753 *Conjectures* sorted the stories of Genesis into source documents by the divine name used and by doublets. What was his stated aim, according to historians?
    options:
      - text: "To defend the traditional view that Moses wrote Genesis, by showing Moses used earlier documents."
        correct: true
        feedback: |
          Yes. He was answering critics such as Spinoza. His method (sorting by divine names and doublets) outlived his conclusion and became a basis of later source criticism.
      - text: "To prove that Genesis was a fabrication."
        feedback: |
          This is the reverse. He was a believer who wanted to meet critics on their own ground.
      - text: "To argue that Genesis was written in the 19th century."
        feedback: |
          Nothing like that: he lived in the 18th century and thought the material very old.
    explanation: |
      Criticism and faith are not natural enemies in this story: one root of the critical method is a defence of tradition. Whether the method, once started, can be controlled by its first purpose is part of the debate.

  - type: text
    id: genre
    title: "Genre: what kind of writing is it?"
    body: |
      Whatever method a reader uses, one question comes first: what kind of writing is this? A **parable** is a story told to make a point, such as the Good Samaritan; reading it as a news report misses the point. An **apocalyptic** text, such as Daniel or Revelation, uses symbolic visions to speak about the end of an age. A **hymn** or poem, such as many psalms, speaks in images and feeling. **History** or biography, such as the preface of Luke's Gospel (1:1-4), says it collects reports from those who were there.

      The Catholic constitution *Dei Verbum* (1965), section 12, says truth is set forth and expressed differently in texts which are variously historical, prophetic, poetic and in other kinds of speech, so the interpreter must attend to the literary forms of the writer's time and culture. The evangelical Chicago Statement (1978), Article 18, also asks for interpretation that takes account of the text's literary forms and devices. Here two communities that disagree on much share a method.

  - type: mcq
    id: genre-q
    title: "Matching genre to reading"
    prompt: |
      A reader says of a parable of Jesus: "If I read it as history I get the wrong lesson, so first I ask what kind of story it is." Which view does this reader share with the Catholic *Dei Verbum* and the evangelical Chicago Statement?
    options:
      - text: "Interpretation should take account of literary forms and devices, because the same words mean different things in a parable, a poem and a chronicle."
        correct: true
        feedback: |
          Yes. Both texts say so in their own words, though they go on to differ on other matters.
      - text: "Every sentence is to be read as strict history."
        feedback: |
          Neither text says this. The Chicago Statement says explicitly that history is to be treated as history and poetry as poetry.
      - text: "Genre does not matter once one believes the text is inspired."
        feedback: |
          Both statements deny this: believing a text is inspired does not tell which kind of statement it makes.
    explanation: |
      A literal reading is not the same as a reading of every sentence as history. "Literal" in the older sense (as the Catechism uses it) means the sense the human author meant, and an author who tells a parable intended a parable.

  - type: text
    id: inerrancy
    title: "Inerrancy and infallibility"
    body: |
      In ordinary use, **inerrant** means "without error" and **infallible** means "unable to lead astray". Christians use both words, and the communities differ.

      **Evangelical (Chicago Statement, 1978).** More than 200 evangelical leaders met in October 1978 under the International Council on Biblical Inerrancy and signed a statement saying that Scripture, being wholly and verbally God-given, is "without error or fault in all its teaching". It denies that inerrancy is limited to spiritual or redemptive themes, excluding history and science. It also lists what does not count as error, such as the use of hyperbole and round numbers, and applies inerrancy to the original manuscripts.

      **Catholic (*Dei Verbum*, 1965).** The constitution teaches that the books of Scripture teach "that truth which God wanted put into sacred writings" "for the sake of salvation". Catholic scholars disagree on whether the last phrase limits inerrancy to matters of salvation or only names its purpose. The Pontifical Biblical Commission's 1993 document calls the historical-critical method indispensable for the scientific study of ancient texts, while saying it has no monopoly and must recognise its limits.

      **Orthodox.** Orthodox writers such as Kallistos Ware describe Scripture as part of Holy Tradition and normative when read as the seven ecumenical councils and the Fathers have understood it; the debate is posed less in terms of a doctrine of inerrancy than in terms of Scripture's place in the church's life.

  - type: mcq
    id: inerrancy-q
    title: "Same word, different claims"
    prompt: |
      According to the Chicago Statement (1978) and *Dei Verbum* (1965), which contrast is accurate?
    options:
      - text: "Chicago denies that inerrancy is limited to spiritual themes; *Dei Verbum* says Scripture teaches truth \"for the sake of salvation\", and Catholics debate whether that phrase limits inerrancy."
        correct: true
        feedback: |
          Yes. The difference is real but easy to exaggerate: both ground the claim in the text's divine origin and both ask for attention to literary forms.
      - text: "Chicago requires every sentence to be read literally; *Dei Verbum* allows any sentence to be false."
        feedback: |
          Neither claim is right. Chicago allows hyperbole and round numbers; *Dei Verbum* says the Scriptures teach without error.
      - text: "Both documents say the Bible is only a human book with moral advice."
        feedback: |
          Both say the opposite: they speak of God as author through human writers, and they differ on what follows from this.
    explanation: |
      The three communities are not lined up on one scale from "strict" to "loose". They locate authority differently: in the text as written (Chicago), in the text as read within the Church's teaching (Catholic), in the text within the life of the church (Orthodox). A critic of any of them would ask a different question.

  - type: mcq
    id: methods
    title: "Which questions are critical?"
    prompt: |
      A reader meets a passage in Genesis. Which of these questions belong to the historical-critical method (as Spinoza, Astruc and Wellhausen asked them)? Select all that apply.
    multiple: true
    options:
      - text: "Which divine name does the passage use, and does a second telling of the same event appear nearby?"
        correct: true
        feedback: |
          Yes. Astruc's own clues were the divine name and doublets.
      - text: "Who may have written it, when, and from what earlier material?"
        correct: true
        feedback: |
          Yes. This is the core question of authorship, date and sources.
      - text: "What does the passage tell me to do in my life today?"
        feedback: |
          This is the moral sense of the older reading. A historical critic can ask it as a person, but it is not the method's question.
      - text: "Which heavenly reality does it point to at the end of time?"
        feedback: |
          This is the anagogical sense of the medieval scheme, not a critical question.
    explanation: |
      The old senses ask what the text means for the reader (belief, conduct, destiny); the critical method asks how the text came to be. Many readers hold both, one question at a time.

  - type: mcq
    id: trap-literal
    title: "Trap: literal means serious"
    prompt: |
      A friend says: "Reading the Bible literally just means taking it seriously; anyone who reads parables or poems as non-literal does not take it seriously." Which answer is best?
    options:
      - text: "Not so: in the Catechism the 'literal' sense is the sense the words convey as the human author meant them, which in a parable is the point of the story; taking a text seriously means asking what kind of text it is."
        correct: true
        feedback: |
          Yes. Even Chicago's statement says history is to be treated as history and poetry as poetry, while still affirming that it is without error.
      - text: "Right: any reading that is not word-for-word is a denial of the text's authority."
        feedback: |
          No major tradition in this lesson holds that. Even those who insist on inerrancy accept hyperbole and figures.
      - text: "Wrong: nobody should take any text literally."
        feedback: |
          Too sweeping. A historical report, for instance, makes literal claims; the question is which passages are which.
    explanation: |
      "Literal" has two meanings in this field: the author's intended sense, and a strict word-for-word reading. Many arguments confuse them. Always ask which one is meant.

  - type: mcq
    id: trap-critical
    title: "Trap: critical means anti-faith"
    prompt: |
      Someone says: "The historical-critical method is a way of attacking the Bible, so a believer should never use it." Which fact in this lesson most directly counts against that claim?
    options:
      - text: "Astruc began source criticism to defend Mosaic authorship, and the Pontifical Biblical Commission (1993) calls the method indispensable for the study of ancient texts."
        correct: true
        feedback: |
          Yes. Neither fact shows the method is always safe, but together they show it was not born as an attack nor rejected by every believer. The Chicago Statement does reject some uses of it, those that relativise or discount what the text teaches, so the real debate is about use and limits.
      - text: "All who use the method end up believing the Bible entirely."
        feedback: |
          No. Scholars of every conviction use it and reach different conclusions about authorship, dates and history.
      - text: "The method has never produced a result that a tradition disputes."
        feedback: |
          It has, constantly (the authorship of the Torah, the sources of the Gospels). The point is that dispute does not make it anti-faith.
    explanation: |
      Method and conclusion should be kept apart. Whether a given critical result is correct is a question for evidence; whether it can override a tradition's reading is a question of commitment.

  - type: text
    id: table-layers
    title: "The three layers for this topic"
    body: |
      | Layer | Examples |
      |---|---|
      | Established | The texts and dates: Origen (about 185 to about 253), Augustine's *Literal Meaning of Genesis* (about 401 to 415), Trent's decree of 8 April 1546, Spinoza's treatise (1670), Astruc's *Conjectures* (1753), Wellhausen (1878, 1883), *Dei Verbum* (18 November 1965), the Chicago Statement (October 1978), the 1993 Pontifical Biblical Commission document. |
      | Scholarly debate | How sharp the Alexandria-Antioch contrast was; how far Luther and Calvin broke with the fourfold scheme; whether *Dei Verbum*'s "for the sake of salvation" limits inerrancy; which source theory of the Torah is right. |
      | Commitment | Whether Scripture's authority needs inerrancy; who decides between readings (a church, Scripture, a scholar's evidence); whether a critical result may overturn a traditional reading. |

  - type: text
    id: summary
    body: |
      **Next:** Christianity today. This lesson followed how Christians read the page; the next follows what Christians do with it now: Pentecostalism, liberation theology, secular Christianity and the global shift of the faith to the South.
