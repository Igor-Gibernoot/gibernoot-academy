id: ch15-canon
title: "The Canon and Its Manuscripts"
kind: concept
own: |
  The setting: the twenty-seven books of the Christian New Testament (the Gospels, Acts, letters and Revelation), written in Greek in the first and early second centuries CE, and the three questions of how they were gathered into a fixed list (the canon), how well their wording was handed down (the manuscripts), and what the writings left out were (the apocryphal gospels). Years are CE. Everything is taught according to someone.
  - **The canon grew; it was not decided at one meeting.** *Canon* comes from a Greek word for a rule or measuring stick, and here means the list of books a church accepts as scripture. Marcion (in Rome, about 140) is the first known to propose a closed list: a shortened Gospel of Luke and ten letters of Paul. Irenaeus (about 180) argued that the church has {{ exactly four Gospels }}. The Muratorian fragment (a Latin list, usually dated to the late second century, with some scholars arguing for the fourth) and Athanasius's Easter letter of 367 (the earliest surviving list of exactly the {{ 27 }} books) mark later stages, and synods at Hippo (393) and Carthage (397) approved a list matching today's Catholic canon. Hebrews and Revelation were among the books longest disputed.
  - **The usual criteria.** According to historians of the canon, churches asked of a writing whether it came from {{ an apostle or a close associate }}, whether it was widely used in the churches and whether it agreed with the faith the churches already held (orthodoxy). Believers add that the church recognised books that already carried the Spirit's authority (a commitment); historians describe what churches did and said.
  - **Manuscripts and variants.** We have no autographs (the authors' own copies). The Greek New Testament survives in more than 5,000 handwritten copies, from a papyrus scrap of John ($\mathfrak{P}^{52}$, about 125) and a codex of Paul's letters ($\mathfrak{P}^{46}$, about 200) to the great fourth-century Bibles Codex Sinaiticus and Codex Vaticanus. The copies differ in estimated {{ 200,000 to 400,000 }} places, for scholars count differences between copies, and the more copies there are, the more differences are counted. Most are spelling and word order; a small share changes the sense.
  - **Textual criticism.** Scholars choose between readings by external evidence (older, more widespread witnesses) and internal evidence (the shorter and the harder reading are often preferred, since scribes tended to add and to smooth). By these rules most scholars hold that Mark 16:9 to 20 and the passage on the woman caught in adultery (John 7:53 to 8:11) were {{ added later }}; the two oldest great codices lack both. Many translations print them in brackets or with a note.
  - **Apocryphal gospels.** The Gospel of Thomas (114 sayings, found in Coptic at Nag Hammadi in 1945; most scholars date it to the second century, some propose a core earlier), the Gospel of Peter (a passion story, Akhmim fragment found in 1886) and the Gospel of Judas (Codex Tchacos, copy radiocarbon-dated 220 to 340, composed in the second century) are mostly {{ later than the four Gospels }}. Why a book was left out is argued: believers stress that the churches judged these books to teach what they did not hold; many historians add that they are late and from small circles.
  - **Three layers.** Established: the dates of the lists and the manuscripts, what the codices contain and omit. Debate: how early the canon was effectively fixed, the date of the Muratorian fragment and of Thomas, how much textual variants matter. Commitment: whether the canon is inspired and closed, or one list among many.

cards:
  - type: mcq
    id: hook
    title: "Guess: who decides what counts?"
    prompt: |
      Guessing is the point; no background is needed. A scattered network of small churches has many writings: letters from teachers, stories about Jesus, sermons, visions. Nobody rules over all of them. Some day they must say which writings they will read aloud as scripture. How would you expect the list to take shape?
    options:
      - text: "Slowly, church by church, by what was already being read and trusted, with arguments and some books staying in doubt for generations."
        correct: true
        feedback: |
          Yes, and this is the picture historians of the New Testament canon draw. Habits of reading came first; lists came later, and edges stayed blurry for a long time.
      - text: "At one meeting where the leaders voted the list at once."
        feedback: |
          It is a popular picture, but no single meeting did it. The lists you will meet came from individual writers and from regional synods, centuries apart in some cases.
      - text: "By a ruler's order, since only an emperor could enforce a single list."
        feedback: |
          Rulers did sometimes shape church life, but the surviving lists come from church writers and synods, not from an imperial command to fix the books.
    explanation: |
      Keep the question: on what grounds, and when, did a list become closed? It splits into a part about history (who said what, when) and a part about commitment (whether the list is God-given), and the lesson keeps them apart.

  - type: text
    id: circulation
    title: "First, the books travelled separately"
    body: |
      Paul's letters were written in the 50s to particular churches. They were kept, copied and passed on, and before long believers had collections of them. Each Gospel began in some region and travelled. For a long time a church might read one Gospel, or a harmony that wove several together, or other writings now outside the New Testament.

      A **canon** (from a Greek word for a rule or measuring stick) is a closed list of books a community accepts as its scripture. The first Christians already had scripture: the Jewish scriptures, in Greek. The new question was which Christian writings belonged beside them.

  - type: text
    id: lists
    title: "Five stages, with dates"
    body: |
      The historian follows lists and the people who made them.

      **Marcion** (born in Sinope, on the Black Sea; in Rome about 140) taught that the God of the Jewish scriptures was not the Father of Jesus. He proposed a list of his own: a shortened Gospel of Luke and ten letters of Paul. Scholars call it the first known closed list. Some, following Adolf von Harnack, think the church's own concern for a list grew partly in reply; others doubt that Marcion was first or decisive.

      **Irenaeus**, bishop of Lyon, wrote *Against Heresies* about 180. He holds that the church has four Gospels and no more, and argues, in the manner of his time, that the world has four zones and four winds, so the church should have four pillars. Tatian's *Diatessaron*, a single story woven from the four Gospels (about 160 to 175), shows that not everyone then took four separate Gospels as the rule.

      **The Muratorian fragment** is part of a Latin list of 85 lines, published by Muratori in 1740 from a manuscript in Milan. It names the Gospels of Luke and John (the opening lines are lost), Acts, thirteen letters of Paul, and some others. Most scholars date the original to the late second century. Albert Sundberg (1973) argued for the fourth, and Clare Rothschild later argued for a late date too; the second-century view still holds as the majority view.

      **Athanasius**, bishop of Alexandria, wrote an Easter letter for 367 (his 39th) listing exactly the 27 books of today's New Testament, the earliest surviving list of exactly that set.

      **Hippo and Carthage.** A synod at Hippo (in North Africa) in 393 listed and approved a canon matching the modern Catholic one, and a synod at Carthage in 397 approved the list again.

  - type: order
    id: order-lists
    title: "Put the lists in order"
    prompt: "Order these from the earliest to the latest."
    steps:
      - "Marcion's list in Rome (about 140)"
      - "Irenaeus argues for four Gospels (about 180)"
      - "Athanasius's Easter letter lists 27 books (367)"
      - "The synod of Hippo approves a canon (393)"
    explanation: |
      The order shows a process spread over about two and a half centuries. The Muratorian fragment, if second century, falls between the first two; if fourth century, it falls near the third. That uncertainty is itself a point of debate.

  - type: mcq
    id: no-council
    title: "What did the 367 letter do?"
    prompt: |
      According to historians, what is a fair description of Athanasius's Easter letter of 367?
    options:
      - text: "A bishop's letter giving his list of 27 books; it is the earliest surviving list of exactly the New Testament as we have it, but it was one bishop's list, not a decision of the whole church."
        correct: true
        feedback: |
          Yes. Other lists of the period differed, and some regions kept doubts about Hebrews or Revelation for a long time after. The letter is an important sign of where opinion was heading.
      - text: "A decree of a worldwide council that fixed the canon for all Christians."
        feedback: |
          The letter is a bishop's own Easter letter. The synods of 393 and 397 were regional ones, and the churches of the East and West did not all share one list for long afterwards.
      - text: "A list of the books the church had been reading for the first time."
        feedback: |
          Most of these books had been read for generations. Athanasius gave a closed list of what was already widely read, which was new in being exact.
    explanation: |
      Layer check: the existence and date of the lists is established; how far and how soon they bound the whole church is debated.

  - type: text
    id: criteria
    title: "On what grounds?"
    body: |
      When churches argued over a book they usually asked three things.

      **Apostolic origin:** was it written by an apostle (one sent by Jesus) or by a close associate? This is why Gospels were tied to names such as Matthew and John, and why churches doubted books whose authorship they could not trace.

      **Wide use:** was it read in many churches and for a long time? A book used only in one small circle weighed less.

      **Orthodoxy:** did it agree with the faith the churches already held about Jesus and God? A book that taught otherwise was set aside.

      Historians point out that the criteria were applied loosely and sometimes in conflict: Hebrews, which does not name its author, was kept because of its use and standing, and Revelation was doubted in the East for a long time. Believers add a further claim, that the Spirit led the church to recognise books that already carried God's authority. That is a commitment; historians record what churches did and said.

  - type: mcq
    id: criteria-apply
    title: "Which criterion is doing the work?"
    prompt: |
      A book is read in only a single small community, but its teaching is thought sound and it carries an apostle's name. Another book is read in every church in a region for over a century, but its author is unknown. According to the three criteria above, which statement is fair?
    options:
      - text: "The criteria can pull apart: the first book is strong on origin but weak on use, the second the reverse, so the churches had to weigh them, and that weighing is where the disputes arose."
        correct: true
        feedback: |
          Yes. The disputed books in the early centuries were disputed exactly because they scored differently on different criteria.
      - text: "Apostolic origin alone decided every case."
        feedback: |
          If it had, Hebrews (anonymous) would not have been kept. Origin mattered a great deal, but not alone.
      - text: "Wide use alone decided every case."
        feedback: |
          Some widely read writings, such as the Shepherd of Hermas, were not kept in the final list, so use alone did not decide either.
    explanation: |
      The three criteria give a framework, not a formula. This is why scholars speak of a process and why lists differed for a long time.

  - type: text
    id: manuscripts
    title: "What do we actually have?"
    image:
      - src: img/p46-bifolio.webp
        alt: "A sheet of old papyrus, folded in the middle, covered with neat lines of Greek capital letters."
        caption: "A bifolio (a folded sheet) of Papyrus 46, a papyrus book of Paul's letters from about 200, kept in the Chester Beatty Library in Dublin; each side of the fold held one page."
        credit: "Chester Beatty Library, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Bifolio_from_Paul%27s_Letter_to_the_Romans,_the_end_of_Paul%27s_Letter_to_the_Philippians_and_the_beginning_of_Paul%27s_Letter_to_the_Colossians.jpg"
    body: |
      We have none of the **autographs**, the author's own copies. What survives are copies of copies, written by hand. For the Greek New Testament there are more than 5,000 of them (the exact total depends on how one counts), in parts and wholes, papyrus and parchment.

      The earliest is a small scrap of papyrus with a few verses of John, called $\mathfrak{P}^{52}$ (the symbol means "papyrus 52" in the list of papyri), usually dated to about 125, with some scholars allowing the first half of the second century. The papyrus $\mathfrak{P}^{46}$ is an early book (a codex, pages sewn together) of most of Paul's letters, dated by handwriting to about 200, with a range from 175 to the early third century. The great parchment Bibles Codex Sinaiticus and Codex Vaticanus are from the fourth century; Sinaiticus has a complete New Testament and is dated to about 325 to 360.

      Dates for manuscripts come from the handwriting, which is a judgment of experts, so a range is more honest than a single year.

  - type: numeric
    id: gap
    title: "The gap in years"
    prompt: |
      Take the exercise values: Paul wrote Romans in about 56 (most scholars place it in the mid-50s) and the codex $\mathfrak{P}^{46}$ is dated to about 200. How many years separate the letter from the earliest manuscript that contains it?
    answer: 144
    wrong:
      - { value: 256, feedback: "That adds the two years (56 + 200). A gap is a difference of two dates." }
      - { value: 150, feedback: "That rounds the gap off. The exercise asks for the subtraction of the two given years: 200 - 56." }
    explanation: |
      About 144 years, in round numbers a century and a half. For comparison, scholars of many ancient authors work with gaps of several centuries or a thousand years. Both sides use this fact: some say the New Testament is unusually well attested, others stress that a gap of any size leaves room for change, and the next cards ask how much.

  - type: mcq
    id: variants
    title: "Four hundred thousand differences?"
    prompt: |
      Scholars estimate that the Greek manuscripts differ at some 200,000 to 400,000 places (Ehrman, 2005, gives this range; some counts are higher). A friend says: "So the text is a mess, with hundreds of thousands of changes to the story." What is the best reply?
    options:
      - text: "The count adds up differences in every copy, so more copies mean a larger number; most differences are spelling or word order (Wallace puts spelling at over 75 per cent), and the rest are mostly small, but a few change the sense and these are what textual critics work on."
        correct: true
        feedback: |
          Yes. The big number counts every place where any two copies differ, repeated across thousands of manuscripts. The figure says that the copying was done by hand and that there are many copies, not how much meaning is in doubt.
      - text: "The number is false, because no two copies differ."
        feedback: |
          Handcopied books always differ somewhat. Scholars of every view agree there are very many differences.
      - text: "The number shows that nobody can know what the original said."
        feedback: |
          The large number is mostly small variations, and the existence of many copies is what lets critics compare and reason back toward earlier readings. Some passages stay uncertain, which the next cards show.
    explanation: |
      The two usual positions: Wallace stresses that few variants matter and none touches an essential teaching. Ehrman, in *Misquoting Jesus*, stresses that some changes were deliberate and shifted the sense of a passage. Both agree on the facts about the copies; they differ on how much the small remainder weighs.

  - type: text
    id: criticism
    title: "How critics choose between readings"
    body: |
      **Textual criticism** is the craft of working out, from copies that differ, the most likely earlier wording. Critics weigh two kinds of evidence.

      **External evidence** looks at the witnesses: readings supported by older manuscripts, by manuscripts from different regions, and by early translations or quotations are preferred, because errors tend to pile up over time.

      **Internal evidence** looks at the reading itself. Scribes tended to add and to smooth, so the **shorter** reading is often preferred, and the **harder** reading (the one a scribe would be tempted to fix) is often preferred. Neither is a law: a scribe's eye can also skip a line and drop words by accident. The best reading is the one that best explains how the others arose.

      These rules go back to the eighteenth century (Bengel stated the rule of the harder reading in 1734, Griesbach fifteen rules in 1796).

  - type: text
    id: mark
    title: "Where does Mark end?"
    image:
      - src: img/sinaiticus.webp
        alt: "A page of an old parchment Bible written in Greek capital letters in columns."
        caption: "Codex Sinaiticus, the fourth-century Greek Bible, opens the New Testament with Matthew; its text of Mark stops at 16:8."
        credit: "Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Codex_Sinaiticus_Matthew_1,1-2,5.JPG"
    body: |
      Most English Bibles give Mark twelve verses after the empty tomb (16:9 to 20) in which the risen Jesus appears and sends out his followers. But the two great fourth-century codices, Sinaiticus and Vaticanus, end Mark at 16:8, with the women afraid and silent. Other witnesses add the longer ending, and some add a short one. Eusebius (fourth century) says the accurate copies end with the fear of the women, while Irenaeus quotes the longer ending (Mark 16:19) about 184, so it is older than the earliest manuscript with it.

      Scholars almost universally reject 16:9 to 20 as part of the original Mark, and many date it to the early second century. They still debate whether Mark meant to end at verse 8 or the real ending was lost. Translations usually print the longer ending with a note or in brackets.

  - type: mcq
    id: mark-apply
    title: "Applying the rules to Mark"
    prompt: |
      Which pieces of evidence together best support the view that Mark 16:9 to 20 was not in Mark's original text?
    options:
      - text: "The oldest great codices end at 16:8, copies with the added verses differ among themselves in how they end, and the longer ending's style and vocabulary differ from the rest of Mark."
        correct: true
        feedback: |
          Yes. Older witnesses, several competing endings (a sign that scribes were trying to fix an abrupt stop), and internal differences all point the same way. This is the usual argument.
      - text: "The longer ending is the longest text, and longer texts are always preferred."
        feedback: |
          The rule runs the other way: the shorter reading is often preferred, since scribes tended to add. And no rule is automatic.
      - text: "Most manuscripts have the verses, so they must be original."
        feedback: |
          Most later Byzantine copies do have them, but number is not the test. Critics weigh age, spread and how the readings arose, and the added verses appear only in later copies.
    explanation: |
      This case is a good model. Nobody here is asked to choose a belief; the question is which wording is earlier, a matter of evidence. What the passage means, and whether the verses may still be read as scripture, is where believers and historians then part.

  - type: text
    id: john
    title: "The woman caught in adultery"
    body: |
      The story of a woman brought to Jesus for adultery, in which Jesus declines to condemn her (John 7:53 to 8:11), shows a similar pattern. It is missing from the earliest manuscripts: the papyri $\mathfrak{P}^{66}$ and $\mathfrak{P}^{75}$ and the codices Sinaiticus and Vaticanus lack it. Its oldest Greek manuscript is the fifth-century Codex Bezae, and some copies place it elsewhere. There is a broad scholarly consensus that it was added to John after the earliest manuscripts. Many of those scholars also think it records a real story that circulated by word of mouth before a scribe added it.

      The NRSV and many other translations bracket it or add a note; a few older translations print it with no mark.

  - type: mcq
    id: john-apply
    title: "Added later: so what?"
    prompt: |
      Suppose a scholar says: "This story was added to John by a scribe." Which conclusion does that statement, on its own, support?
    options:
      - text: "That the story was not part of John's text as first written; whether the story itself goes back to Jesus is a separate question that needs other evidence."
        correct: true
        feedback: |
          Yes. A story can be old and still be a later insertion into a particular book. Textual criticism tells where a passage belongs; the question of whether it is historical is the job of the historian's criteria, as in the lesson on the historical Jesus.
      - text: "That the story is a forgery with no basis in the life of Jesus."
        feedback: |
          Not at all. Many scholars who agree the story was added think it preserves an old tradition. Late insertion does not mean fabrication.
      - text: "That the whole Gospel of John is unreliable."
        feedback: |
          A late insertion in one passage says nothing about the rest. Critics reach this verdict by passage, and John's other text is not in this doubt.
    explanation: |
      Two questions stay apart: what did the book say in its earliest form (textual criticism), and what happened in the past (history). Believers add a third, whether the passage is scripture, which is a commitment.

  - type: text
    id: apocrypha
    title: "The gospels that did not enter"
    body: |
      Other writings called gospels circulated in the early centuries. They are called **apocryphal** ("hidden", a name for books outside the canon). Three are best known.

      The **Gospel of Thomas** is a list of 114 sayings of Jesus, with no story of his life. It was found in a Coptic copy at Nag Hammadi in Egypt in 1945, and three older Greek fragments from Oxyrhynchus (late second or early third century) match parts of it. Most scholars date its composition to the second century; some argue that an early core, even before the end of the first century, rests on sayings independent of the Gospels, and others that it draws on them. Many of its sayings have parallels in the canonical Gospels.

      The **Gospel of Peter** is known mainly from a fragment found at Akhmim in Egypt, published in 1892 (the copy is from the eighth or ninth century). It is a passion story with a talking cross. Serapion, bishop of Antioch about 200, at first allowed a church to read it and then judged that it hid a heresy. Most scholars place the original after the four Gospels, in the second century.

      The **Gospel of Judas** survives in a Coptic copy in the Codex Tchacos, whose papyrus and leather were radiocarbon-dated to 220 to 340. It shows Judas as the disciple who receives secret teaching, and its Greek source was probably composed before about 180, since Irenaeus mentions a Gospel of Judas about then. Scholars disagree about whether his target is the same book and about how the text treats Judas. It was published in English in 2006.

  - type: mcq
    id: apocrypha-date
    title: "Early, late or both?"
    prompt: |
      Which statement about the dates of these gospels is fair, according to most historians?
    options:
      - text: "The Gospel of Thomas is the one with a live debate about an early core; Peter and Judas are generally placed in the second century, later than the four Gospels."
        correct: true
        feedback: |
          Yes. Thomas is the case where serious scholars split between a first-century core and a second-century work, and the other two are broadly agreed to be later.
      - text: "All three are from the first century and as old as Mark."
        feedback: |
          No historian of note puts Peter or Judas that early. Even for Thomas, an early date is the minority view.
      - text: "All three were written in the fourth century, when the canon was closed."
        feedback: |
          The manuscripts we have of Thomas and Judas are from the fourth century, but copies are not compositions. Fragments and mentions show that the works existed long before.
    explanation: |
      A manuscript date and a composition date are two different things. This distinction runs through the whole lesson.

  - type: mcq
    id: why-left-out
    title: "Why were they left out?"
    prompt: |
      Two accounts of why these gospels are outside the New Testament are offered. Which pairing states them fairly?
    options:
      - text: "Many historians stress that the books are late and come from small circles with little claim to an apostle's name; many believers add that the churches judged them to teach what the church did not hold (orthodoxy)."
        correct: true
        feedback: |
          Yes. The two accounts use different criteria from the same list. A critic of the church's choice (for example, scholars who stress the variety of early Christianity) would add that the criterion of orthodoxy is itself set by the group that won.
      - text: "They were hunted down and burned in the second century, so we know nothing of them."
        feedback: |
          Some were lost, but we have Thomas, Peter and Judas in copies, and ancient writers describe them. That is how we know them.
      - text: "They were left out because they contradicted the Jewish scriptures."
        feedback: |
          That was a charge against Marcion. For these books the reasons given were date, authorship and teaching about Jesus and the world.
    explanation: |
      This is a question on which thoughtful people part ways, and the reason is which criterion they weigh most: date, authorship, use or doctrine.

  - type: mcq
    id: sort-claims
    title: "Sort the claim"
    prompt: |
      According to the three-layer scheme, which of these is a claim of the middle layer, scholarly debate?
    options:
      - text: "The Gospel of Thomas contains an early core independent of the four Gospels."
        correct: true
        feedback: |
          Yes. Serious scholars hold it and serious scholars reject it, and the evidence is the sayings themselves.
      - text: "The Codex Sinaiticus ends Mark at 16:8."
        feedback: |
          That is established: the manuscript can be read by anyone.
      - text: "The church recognised the books that already carried God's authority."
        feedback: |
          That is a commitment: it rests on a belief about God's guidance that history cannot test. History can describe what churches did and said.
    explanation: |
      Notice that the first claim is about a text's date and independence, which evidence can bear on, while the third is about authority, which depends on a faith position.

  - type: text
    id: table
    title: "The three layers for this topic"
    body: |
      | Layer | Examples |
      |---|---|
      | Established | Marcion's list about 140, Irenaeus's four Gospels about 180, Athanasius's list of 27 in 367, synods at Hippo (393) and Carthage (397); over 5,000 Greek manuscripts, with $\mathfrak{P}^{52}$ about 125, $\mathfrak{P}^{46}$ about 200, and Sinaiticus and Vaticanus in the fourth century; the oldest great codices lack Mark 16:9 to 20 and John 7:53 to 8:11. |
      | Scholarly debate | Date of the Muratorian fragment; how early and how firmly the core was fixed; how much Marcion shaped the church's list; whether Mark ended at 16:8 by design; whether Thomas has an early core; how much weight the small share of meaningful variants carries. |
      | Commitment | That the canon is inspired and closed, that the church recognised and did not create it, or the denial of these; whether the left-out gospels should be read as scripture. |

  - type: text
    id: summary
    body: |
      **Next:** a guided proof, What Can History Say About a Miracle Claim? Having seen how the texts were gathered and how well we can read them, the next lesson takes the central claim of these books, the resurrection, and asks what a historian's method can and cannot say, with the premises of Hume and of the believer set out side by side.
