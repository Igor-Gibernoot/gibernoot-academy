id: ch15-paul
title: "Paul and the First Churches"
kind: concept
own: |
  The setting: Paul of Tarsus, a Jewish follower of Jesus who wrote letters to small communities of believers across the eastern Mediterranean in the 50s CE, and the question of what those letters show about the first churches. Years are CE. Everything is taught according to someone.
  - **The sources.** Scholars accept seven letters as Paul's own: {{ Romans, 1 and 2 Corinthians, Galatians, Philippians, 1 Thessalonians and Philemon }}. Ephesians and the letters to Timothy and Titus are widely held to be by later writers, and Colossians and 2 Thessalonians are debated. The letters are occasional (written for a situation, so we hear one side of a conversation). The book of Acts, written about 80 to 90 by the author of the Gospel of Luke, is a later source with its own aims, and where it differs from Paul's own letters, historians usually give {{ priority to Paul's letters }}.
  - **The great question.** According to Galatians, the first churches argued over whether non-Jewish believers (gentiles) had to take on the Jewish law, circumcision first. Paul answered that a person is {{ made right with God through faith in Christ and not through works of the law }} (Galatians 2:16).
  - **Three readings of that answer.** The traditional Protestant reading (shaped by Luther) takes Paul to reject a religion of earning merit. E. P. Sanders (1977) argued that first-century Judaism was not like that, and James Dunn (1982) took "works of the law" to mean mainly {{ the markers that set Jews apart, such as circumcision and food laws }}. The "Paul within Judaism" scholars (Nanos, Fredriksen, Gager) hold that Paul remained a Jew and addressed gentiles as gentiles.
  - **The first churches.** Small groups meeting in homes in cities such as Corinth, Philippi and Rome, with women leaders (Phoebe, Prisca), shared meals, baptism and quarrels. Paul passes on traditions he says he {{ received }} from earlier believers, for example that Christ died for our sins in accordance with the scriptures (1 Corinthians 15:3), so some beliefs are older than his letters.
  - **Who shaped Christianity?** William Wrede (*Paulus*, 1904) called Paul the "second founder"; others (Dunn, Wright) stress {{ continuity with Jesus and the first apostles }}. Paul himself says of the message "whether then it was I or they, so we proclaim". Which view is better depends on how one weighs the sayings of Jesus, Paul's silence about them, and the Jewish background.
  - **Three layers.** Established: the letters, their rough dates, the dispute over gentiles. Debate: Paul's relation to the law, how much he changed the message. Commitment: whether Paul's experience was a genuine revelation of the risen Christ, as he and Christians hold, or something else.

cards:
  - type: mcq
    id: hook
    title: "Guess: a quarrel between friends"
    prompt: |
      Guessing is the point; no background is needed. A Jewish teacher is executed, and his friends keep a small movement going inside Judaism. A few years later, a man who never met the teacher starts bringing in people who are not Jewish. Old and new members ask: "Must these newcomers become Jewish too?" What would you expect to be the hardest point?
    options:
      - text: "Which Jewish customs, such as circumcision and food rules, the newcomers must take on, because those customs mark who belongs."
        correct: true
        feedback: |
          Yes. Customs that mark a community's boundary are where such quarrels turn sharp. This is the argument the lesson follows in Paul's own letters.
      - text: "Whether the newcomers may speak Greek."
        feedback: |
          Greek was the common language of the eastern Mediterranean and many Jews already used it. Language was not the sticking point.
      - text: "Whether the teacher had lived at all."
        feedback: |
          Early followers who knew his friends did not doubt that. The fight was over the terms of joining, not over his existence.
    explanation: |
      Keep the question: on what terms may someone join? Almost everything in Paul's letters connects to it.

  - type: text
    id: who
    title: "Who was Paul?"
    image:
      - src: img/rembrandt-paul.webp
        alt: "Oil painting of an elderly bearded man at a desk, his head resting in one hand."
        caption: "No portrait of Paul from his lifetime survives; this seventeenth-century painting (attributed to Rembrandt and workshop) shows how later artists imagined him."
        credit: "Rembrandt van Rijn (and Workshop?), CC0, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Rembrandt_van_Rijn_(and_Workshop%3F),_The_Apostle_Paul,_c._1657,_NGA_1198.jpg"
    body: |
      **Paul** (also called Saul in Acts) came from Tarsus, a city in Cilicia in what is now southern Turkey, and was probably born between 5 BCE and 5 CE; the exact year is unknown. According to his own letter to the Philippians, he was a Pharisee who had been zealous in persecuting the church. He says in Galatians that God revealed Christ to him, and he went to Arabia and Damascus. Scholars date this experience somewhere between 31 and 36.

      From then on he travelled as a missionary, above all to non-Jews (gentiles: everyone who is not Jewish), founding small groups of believers in cities. A tradition, which the sources do not document in detail, holds that he was executed in Rome about 64 or 65.

      His self-description is evidence of his own view; what actually happened on the road to Damascus is something historians cannot reach, and this lesson will not try.

  - type: text
    id: letters
    title: "Seven letters, and hearing one side"
    body: |
      Thirteen letters in the New Testament carry Paul's name. Most scholars accept **seven** as certainly his: Romans, 1 and 2 Corinthians, Galatians, Philippians, 1 Thessalonians and Philemon. Ephesians and the "pastoral" letters (1 and 2 Timothy, Titus) are widely thought to be written later in his name, which was a known practice, called *pseudepigraphy* ("false writing", though not always meant to deceive). Colossians and 2 Thessalonians are debated. The reasons are style and vocabulary, theology, and the church situation described.

      Paul's letters are *occasional*: each answers a problem in one community. Reading them is like hearing one side of a phone call. We learn what Paul says to the Corinthians about a quarrel, but must infer what the Corinthians did or wrote.

  - type: mcq
    id: letters-use
    title: "Using a letter as evidence"
    prompt: |
      In 1 Corinthians, Paul scolds the church at Corinth for a particular practice at its shared meals. According to historians who read occasional letters, what is the fair inference?
    options:
      - text: "At least some people at Corinth were doing something Paul disapproved of; how widespread it was, and how fairly Paul describes it, cannot be told from his side alone."
        correct: true
        feedback: |
          Yes. A rebuke shows that a practice existed (or that Paul had heard of one) and shows his judgment of it. The other side of the conversation is missing, so the size of the problem and the motives of those involved stay uncertain.
      - text: "The whole church was doing it, since Paul writes to everyone."
        feedback: |
          A letter addressed to a whole community may be aimed at a few members. The address does not measure how many did what.
      - text: "Nothing can be learned, since the letter is only Paul's opinion."
        feedback: |
          An opinion is still evidence: of what was going on, of what Paul valued, and of what the community was like. The skill is to say what it supports and what it does not.
    explanation: |
      Layer check: that the letter exists and was written to Corinth in the 50s is established; what lay behind each rebuke is inference.

  - type: mcq
    id: authorship
    title: "Which letters are certainly Paul's?"
    prompt: |
      According to most critical scholars, which set contains only letters accepted as written by Paul himself?
    options:
      - text: "Romans, Galatians, 1 Thessalonians and Philemon."
        correct: true
        feedback: |
          Yes. All four are in the undisputed seven (with 1 and 2 Corinthians and Philippians).
      - text: "Romans, Ephesians, 1 Timothy and Titus."
        feedback: |
          Ephesians and the pastoral letters (1 Timothy, 2 Timothy, Titus) are widely thought to be written later by followers using his name. They differ in style and in church organisation from the seven.
      - text: "Galatians, Colossians, 2 Thessalonians and Hebrews."
        feedback: |
          Colossians and 2 Thessalonians are debated, and Hebrews does not name its author and is almost universally held not to be Paul's.
    explanation: |
      A common mistake is to treat every letter that carries his name as equal evidence for his own views. Historians build on the seven and treat the others as witnesses to later Pauline churches.

  - type: text
    id: acts
    title: "The second source: Acts"
    body: |
      The book of **Acts** tells of the early church, with Paul as its central figure from the middle on. Most scholars date it to about 80 to 90, and hold that it shares an author with the Gospel of Luke. Parts of Acts are told in "we" (the narrator seems to join Paul's journeys); some scholars take these as an eyewitness's notes, others as a literary device, and the question is debated.

      Acts agrees with the letters on the broad outline: Paul's conversion, mission and the churches he founded. It differs in details and emphasis, for instance in how it plays down Paul's quarrels with other believers. Acts tells that Paul went to the Jerusalem leaders on a mission to settle the gentile question (Acts 15); Paul's letter to the Galatians (2:1 to 10) describes a meeting that many scholars identify with it, while others identify it with a different visit.

  - type: mcq
    id: acts-vs-letters
    title: "When Acts and Paul differ"
    prompt: |
      In some details Acts and Paul's own letters do not agree. Which principle do most historians follow, and why?
    options:
      - text: "Prefer Paul's own letters where they speak to the point, since they are earlier and first-hand, while remembering that Paul argues his own case."
        correct: true
        feedback: |
          Yes. Paul writes within a few years of the events and about himself. His account is not neutral, but a later writer working some thirty years on, with his own purposes, is generally given less weight where the two clash.
      - text: "Prefer Acts, since it tells the whole story and the letters only parts."
        feedback: |
          Completeness is not reliability. Acts is later, and its author shaped the story to show the church's unity.
      - text: "Throw out both whenever they disagree."
        feedback: |
          Disagreement in detail is common between sources of any ancient event. Historians weigh them; they do not discard both.
    explanation: |
      A fair reading also keeps the rival view in sight: some scholars trust Acts more than most do, and note that Paul also had reasons to stress his independence from Jerusalem.

  - type: numeric
    id: gal-years
    title: "A chronology from Paul's own words"
    prompt: |
      In Galatians Paul says he went up to Jerusalem three years after his call, and then "fourteen years later" went up again (Galatians 1:18 and 2:1). Suppose, for the exercise, his call was in the year 33, and count the fourteen years from his first Jerusalem visit. In what year was the second visit?
    answer: 50
    wrong:
      - { value: 47, feedback: "That counts the fourteen years from the call (33 + 14). Scholars do debate which starting point Paul means; the exercise fixes the first visit as the start, as asked." }
      - { value: 36, feedback: "That is the year of the first visit (33 + 3). The second visit is fourteen years after it." }
    hint: "First find the year of the first visit, then add fourteen."
    explanation: |
      The first visit falls in 33 + 3 = 36, the second in 36 + 14 = 50. If the fourteen years run from the call instead, it is 47. Scholars who date the Jerusalem meeting give years from about 47 to 51 (49 is the majority date), so a chronology built from Paul's own words and the rival one from Acts lead to a similar answer, with a few years of uncertainty.

  - type: text
    id: question
    title: "The great dispute"
    body: |
      Paul's letter to the Galatians (written between the late 40s and the 50s, the date is debated) answers a crisis. Teachers had told his gentile converts in Galatia that to belong to God's people they must be circumcised and keep the Jewish law.

      Paul reports a meeting in Jerusalem where the leaders, James, Cephas (Peter) and John, agreed that he should go to the gentiles. Later, in Antioch, he says he opposed Cephas to his face, because Cephas had withdrawn from eating with gentile believers when people from James came (Galatians 2:11 to 14). For Paul the matter was whether a shared table was possible.

      His position, in one sentence: a person is made right with God through faith in Christ and not through works of the law (Galatians 2:16). In plain words, belonging does not depend on taking on the markers of Jewish life.

  - type: mcq
    id: dispute
    title: "What was the dispute about?"
    prompt: |
      According to Paul's letter to the Galatians, what was the argument with Peter and the Jerusalem group mainly about?
    options:
      - text: "On what terms gentile believers belonged to the movement, and whether Jews and gentiles could eat together without the gentiles taking on the Jewish law."
        correct: true
        feedback: |
          Yes. It is a dispute about membership and the shared table. Notice that it takes place among Jewish followers of Jesus; no one in the story says Jesus was not the Messiah.
      - text: "Whether Jesus had really been crucified."
        feedback: |
          Paul and his opponents agree on this. In 1 Corinthians he calls it his basic message ("Christ crucified").
      - text: "Whether to leave Judaism and found a new religion."
        feedback: |
          No one in Paul's letters talks of leaving Judaism. That is a later description; the rivals in the argument are different groups of believers in a Jewish movement.
    explanation: |
      The wording "a new religion" is the historian's later label. For the people in the letters, the argument was inside a Jewish messianic movement about how to include non-Jews.

  - type: text
    id: readings
    title: "Three readings of Paul's answer"
    body: |
      What does "justified by faith, not by works of the law" mean? Three schools of reading, each with serious scholars.

      **The traditional Protestant reading** (shaped by Martin Luther's reading of Galatians): Paul rejects a religion in which people try to earn God's favour by keeping rules, and offers instead trust in what Christ did.

      **The "new perspective"** begins with E. P. Sanders, *Paul and Palestinian Judaism* (1977). Sanders argued that Judaism of the time was not a religion of earning merit: God's covenant came first, and keeping the law was the way of staying in it, a pattern he named *covenantal nomism* (*nomos* is Greek for law). James Dunn gave the lecture "The New Perspective on Paul" in 1982 (N. T. Wright had used the phrase in 1978). Dunn argued that "works of the law" meant mainly the practices that marked Jews off from gentiles, circumcision and food laws, so the dispute was about who could belong. Critics reply that Romans speaks of wages and reward, which fits poorly with "boundary markers" alone.

      **"Paul within Judaism"** (Mark Nanos, Paula Fredriksen, John Gager and others): Paul stayed a practising Jew and addressed gentiles as gentiles, who should not convert to Judaism but join in worship of the God of Israel. Critics, for example Terence Donaldson, say this overstates the continuity and gives too little weight to places where Paul sets the law aside.

  - type: mcq
    id: sanders-point
    title: "What the new perspective changed"
    prompt: |
      Sanders argued that the Judaism of Paul's time was a religion in which God's covenant came first and the law was the way to stay within it. Which consequence for reading Paul follows?
    options:
      - text: "Paul cannot simply be arguing against Jews who tried to earn God's favour by their good deeds, since that was not how Judaism of the time understood itself; his target must be read differently."
        correct: true
        feedback: |
          Yes. If the picture of Judaism changes, so must the picture of what Paul rejected. This is why Dunn, Wright and others reread "works of the law" in terms of belonging, while others (and some Lutheran scholars) keep a version of the older reading.
      - text: "Paul agreed with every Jewish practice of his time."
        feedback: |
          Not even the Within Judaism scholars say this. Paul rejected the requirement of circumcision for gentile believers; the debate is how far his criticism went.
      - text: "Paul wrote nothing about the law."
        feedback: |
          The law is one of his main topics in Galatians and Romans.
    explanation: |
      The same sources lead to three readings because each one starts from a different picture of first-century Judaism and a different weight on single passages. A student can hold the question open without picking a winner.

  - type: text
    id: churches
    title: "Inside the first churches"
    image:
      - src: img/philippi.webp
        alt: "Ruins of a Roman forum and columns at Philippi in northern Greece, with a hill behind."
        caption: "The ruins of Philippi in Macedonia, where Acts 16 places the founding of a church that later received Paul's letter to the Philippians."
        credit: "Ian W. Scott, CC BY-SA 3.0, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Philippi_AgoraAndAcropolis.JPG"
    body: |
      What were the churches like? The Greek word is *ekklesia*, "assembly". They were small groups, probably of a few dozen at most, meeting in homes in cities of the Roman world, such as Corinth, Thessalonica, Philippi and Rome. Members included Jews and gentiles of different social levels.

      The letters name leaders. At the end of Romans, Paul commends **Phoebe**, a deacon of the church at Cenchreae, and greets **Prisca** and **Aquila**, "the church that meets in their house" (Romans 16:1 to 5). Women appear as teachers, patrons and co-workers; scholars disagree on how far their authority reached.

      Practices include baptism and a shared meal, which Paul calls the Lord's supper (1 Corinthians 11:23 to 25). And there are arguments: about meat that had been offered to idols, about order in worship, about money, about who is "of Paul" or "of Apollos".

  - type: mcq
    id: churches-use
    title: "What the quarrels show"
    prompt: |
      Paul's letters to Corinth treat disputes over leaders, shared meals and worship. What do historians draw from this about the first churches?
    options:
      - text: "They were not uniform: each community had its own mix of members and habits, and the movement had to work out common practice through argument."
        correct: true
        feedback: |
          Yes. The letters are a record of a movement being organised as it went. A later picture of a unified church is easier to hold from far away than from inside Corinth.
      - text: "They were already a single organisation with fixed offices and rules."
        feedback: |
          The letters mention helpers, teachers, deacons and patrons, but no fixed structure over all the churches. Offices developed more clearly later.
      - text: "They were all led by Paul."
        feedback: |
          Paul founded some, but he writes to Rome, which he had not founded, and he speaks of other missionaries (Apollos, Cephas) with followers of their own.
    explanation: |
      Disagreement is evidence of life as well as of conflict. The Christians who preserved these letters saw them as worth keeping, which also tells us something about the later church.

  - type: text
    id: received
    title: "Before Paul: traditions he received"
    body: |
      Paul sometimes says he is passing on something he *received*. In 1 Corinthians 15:3 he writes that he handed on what he had received: that Christ died for our sins in accordance with the scriptures, was buried, and was raised on the third day. He then lists those who saw the risen Christ. Elsewhere he quotes sayings of Jesus (1 Corinthians 7:10 to 11, on divorce, as a command "from the Lord") and what looks like a hymn (Philippians 2:6 to 11).

      Scholars often treat such passages as formulas that existed before the letters, so they reach back toward the years after the crucifixion. When and where he received them (for instance during his visit to Jerusalem three years after his call) is discussed. What the passages show is that some beliefs, including the claim that Jesus was raised, are older than Paul's letters.

  - type: mcq
    id: received-use
    title: "Why quoted traditions matter"
    prompt: |
      Paul wrote 1 Corinthians in the 50s but says that in it he passes on what he had himself received. Why does a historian value such a passage?
    options:
      - text: "It points to a formula older than the letter, so it gives evidence of what believers said within a few years of the crucifixion, though not who first formed it or how it was understood."
        correct: true
        feedback: |
          Yes. It pushes the date of the belief earlier than the letter. The limits are real: a formula tells what was said, not what happened, and the chain of transmission is inferred.
      - text: "It proves that what the formula says actually happened."
        feedback: |
          Dating a claim early makes it a stronger piece of evidence of what early believers held. Whether the event occurred is a further question, taken up later in the lesson on the resurrection.
      - text: "It shows that Paul invented the formula himself."
        feedback: |
          He says the opposite: he received it. A historian can doubt a claim, but must still read what the text says.
    explanation: |
      Notice the difference between three things: the belief is early (strongly supported); the event it reports (not decided by dating alone); and the claim of divine action (a commitment, not a historian's result).

  - type: text
    id: founder
    title: "Who shaped Christianity?"
    body: |
      Was Paul the real founder of Christianity? Two serious positions.

      **Paul as the second founder.** William Wrede, in *Paulus* (1904), called Paul the second founder of Christianity: the first Christian theologian, who by his theology transformed a small Jewish movement into something that could spread among gentiles. Evidence for this view: Paul's letters are the earliest Christian writings and set the terms of later debate, and Paul himself speaks of Jesus's sayings only rarely.

      **Paul as one voice among many.** Others, such as James Dunn and N. T. Wright, stress continuity: Paul says he received core beliefs, he consulted Cephas and James, and he describes the message as shared. In 1 Corinthians 15:11 he writes of himself and the other apostles "whether then it was I or they, so we proclaim and so you believed" (NRSVUE). Evidence for this view: the traditions Paul received, and the fact that the gentile mission was agreed, even if with tension, in Jerusalem.

  - type: mcq
    id: founder-test
    title: "What evidence bears on the question?"
    prompt: |
      Wrede's critics and followers disagree on whether Paul shaped Christianity or carried on what came before. Which finding would most directly count in favour of continuity?
    options:
      - text: "Passages where Paul says he received his key message from earlier believers, and independent sources showing the same beliefs in groups Paul had no hand in."
        correct: true
        feedback: |
          Yes. Evidence of the same beliefs outside Paul's circle weighs against the idea that he invented them. A claim of reception, standing alone, is Paul's own testimony, so it is stronger together with independent sources.
      - text: "The fact that Paul's letters were widely read."
        feedback: |
          Being widely read shows influence, which is what Wrede's side claims. It does not show that the ideas began elsewhere.
      - text: "The fact that Paul wrote more than anyone else."
        feedback: |
          Volume of writing tells what survives, and may exaggerate his role. Continuity needs evidence from outside his letters.
    explanation: |
      Both sides can point to real evidence. The disagreement is partly about what counts as "Christianity" (a teaching, a movement, a set of institutions) and partly about how to weigh Paul's silence about Jesus's life against his claims of continuity.

  - type: mcq
    id: sort-claims
    title: "Sort the claim"
    prompt: |
      According to the three-layer scheme (established, scholarly debate, commitment), which of these is a claim of the middle layer, scholarly debate?
    options:
      - text: "In Galatians, \"works of the law\" refers mainly to practices such as circumcision and food laws that mark Jews off from gentiles."
        correct: true
        feedback: |
          Yes. Dunn defends it, and others contest it (for example by pointing to Romans). It concerns how to read a text, not a datum.
      - text: "Paul wrote a letter to the Galatians in the first century."
        feedback: |
          That is established: the letter survives, and its authorship by Paul is not disputed.
      - text: "Paul's experience on the way to Damascus was a genuine revelation of the risen Christ."
        feedback: |
          That is a commitment: Paul and Christians hold it, and others explain the experience in other ways. History can record that he said it, not decide it.
    explanation: |
      The first claim is the one on which respected scholars truly differ; the second is a datum and the third rests on a view of what is possible.

  - type: text
    id: table
    title: "The three layers for this topic"
    body: |
      | Layer | Examples |
      |---|---|
      | Established | Seven letters of Paul survive, written in roughly the 50s; they show a dispute over gentiles and the law, and small churches in several cities with leaders including women; Paul quotes traditions he received. |
      | Scholarly debate | Which other letters are Paul's; how far Acts can be trusted; what "works of the law" means; whether Paul left, reformed or stayed within Judaism; how much he changed the message. |
      | Commitment | That Paul's call was a revelation of the risen Christ; that his letters are scripture; or the denial of these. |

  - type: text
    id: summary
    body: |
      **Next:** The Canon and Its Manuscripts. Paul's letters and the Gospels circulated separately at first. The next lesson follows how the New Testament was collected, what the manuscripts show about the texts, and what the apocryphal gospels were.
