id: ch15-world
title: "The World of Jesus"
kind: concept
own: |
  The setting: the land of Judea and Galilee, from the Persian period to about 36 CE, the world in which Jesus of Nazareth lived. Everything is taught according to someone (Josephus, the Dead Sea Scrolls, modern historians), and every year is BCE or CE.
  - **Second Temple Judaism.** The Temple in Jerusalem was rebuilt after the exile (dedicated about 516 BCE). Antiochus IV banned Jewish practice in 167 BCE; the Maccabees' revolt led to the rededication in December 164 BCE and to the Hasmonean dynasty. The Roman general Pompey took Jerusalem in {{ 63 BCE }}; Herod the Great ruled as a Roman client king from 37 to 4 BCE and began rebuilding the Temple about 19 BCE.
  - **Roman rule.** After Herod's death his kingdom was divided; in 6 CE Augustus removed his son Archelaus and Judea became a province governed by Roman prefects, with a census for taxes under Quirinius. Pontius Pilate was prefect from {{ 26 to 36 CE }}; the Pilate stone (found in 1961 at Caesarea) names him.
  - **The groups, according to Josephus.** Josephus (about 37 to 100 CE) names three schools plus a "fourth philosophy". The Pharisees held an oral tradition besides the written Torah, had popular influence and held that souls survive. The Sadducees were a priestly aristocracy who accepted only the written Torah and, per Josephus, held that souls die with the bodies. The Essenes lived communally (about 4,000 per Josephus and Philo). The fourth philosophy, from Judas the Galilean in 6 CE, agreed with the Pharisees but accepted no human master. Whether Zealots were an organised party before 66 CE is debated.
  - **Messianic hopes were varied.** *Messiah* is Hebrew for "anointed one". The sources show a royal Davidic hope (Psalms of Solomon 17, first century BCE), priestly figures in the Dead Sea Scrolls, and a prophet like Moses (Deuteronomy 18, used in the Scrolls). According to the scholar James VanderKam, {{ most Second Temple texts do not mention a messianic leader at all }}.
  - **Apocalyptic hope.** The book of Daniel, dated by most critical scholars to about {{ 167 to 163 BCE }}, is an apocalypse (a book of visions revealed through angels) written in the crisis of Antiochus IV, and holds the first clear statement of resurrection.
  - **Three layers.** Established: the dates, the Roman rule, the inscriptions. Live debate: the revolt as civil war or national liberation, the Zealots, how the Scrolls connect to the Essenes. Commitment: whether any hope was fulfilled, which Christians affirm and others do not.

cards:
  - type: mcq
    id: hook
    title: "Guess: whom would you ask?"
    prompt: |
      Guessing is the point; no background is needed. It is about 30 CE. A farmer in Galilee, in the north of the land, hears four groups each claim to speak for God. One runs the Temple in Jerusalem. One is a popular movement of teachers. One lives apart in a community. One says that paying taxes to a foreign ruler is a betrayal. Which first guess is most reasonable?
    options:
      - text: "They probably disagree about real questions: which laws bind, what happens after death, whether to obey the foreign ruler. So the farmer would hear different answers from each."
        correct: true
        feedback: |
          A good first guess, and the shape of this lesson. We will meet these groups, the power that ruled them, and the hopes they shared or did not share.
      - text: "They surely agree, since all of them read the same Scriptures."
        feedback: |
          Reading the same Scriptures did not give the same answers. Groups of one tradition often differ on which texts count and how to read them. We will see exactly where they differed.
      - text: "Only the group in Jerusalem mattered, because the Temple settled every question."
        feedback: |
          The Temple was central, but the sources show other groups with real following, and the Temple itself had critics. The picture is crowded, not single.
    explanation: |
      Keep three layers apart as we go: what the sources and inscriptions establish (fact), what historians debate, and what each person holds as faith. The lesson stays on the first two.

  - type: text
    id: persia
    title: "A people back home, a temple rebuilt"
    body: |
      The Babylonians destroyed the first Temple in Jerusalem in 587 or 586 BCE and took part of the people into exile (Cyrus conquered Babylon in 539 BCE). According to the biblical books of Ezra and Nehemiah and to most historians, the Persian king **Cyrus** allowed exiles to return and rebuild the Temple, an edict usually dated to **538 BCE**. The rebuilt Temple was dedicated about **516 BCE** (Ezra dates it to the sixth year of King Darius, which scholars convert to 516 or 515 BCE).

      From that building until the Romans destroyed it in 70 CE, historians speak of the **Second Temple period**. In those centuries the land passed under one ruler after another, and the question "who may speak for God?" was asked again and again.

  - type: text
    id: maccabees
    title: "Antiochus, the Maccabees and Rome"
    body: |
      After Alexander the Great, Greek-speaking kings ruled the land and Greek culture, called *Hellenization*, spread. According to the sources, one of these kings, **Antiochus IV**, banned Jewish practices such as sacrifice, the sabbath and circumcision in **167 BCE**. A priest, **Mattathias**, refused, and his son **Judas Maccabee** led a revolt. In December **164 BCE** Judas took the Temple and purified it, which Jews still remember at Hanukkah.

      The family, called the **Hasmoneans**, became high priests and later kings. Sources differ on the exact start of the dynasty (164 or 165 BCE; Jonathan was recognised as high priest and ruler in 140 BCE). In **63 BCE** a Roman general, **Pompey**, took Jerusalem during a civil war between two Hasmonean brothers, Hyrcanus II and Aristobulus II, and the Hasmonean kingdom ended.

  - type: mcq
    id: revolt-layers
    title: "Fact and debate in the revolt"
    prompt: |
      Sources agree that Antiochus IV banned Jewish practices in 167 BCE and that Judas Maccabee rededicated the Temple in 164 BCE. Some modern scholars add that the revolt was less a simple uprising against a foreign oppressor than a civil war between traditionalist and reformist Jews. Which layer is that last claim?
    options:
      - text: "A live debate among historians: the same events are described, but scholars differ on how to read the motives and the sides."
        correct: true
        feedback: |
          Yes. The dates are established. Whether the main conflict was Jews against a king or Jews against Jews is a matter of interpretation of the same evidence.
      - text: "Established fact, because it appears in a book."
        feedback: |
          Appearing in a book does not make it established. Here historians themselves disagree, so it is a debate.
      - text: "A faith commitment about God's will."
        feedback: |
          Neither side of this debate depends on a belief about God. Both use the same texts and ask a historical question about who fought whom.
    explanation: |
      This is the pattern for the whole level: the date is fact, the reading of the motive is debate, and what the event means for faith is a separate layer.

  - type: order
    id: timeline
    title: "Put six events in order"
    prompt: "Put these events of the Second Temple world in the order they happened."
    steps:
      - "Cyrus's edict allows exiles to return (538 BCE)"
      - "The rebuilt Temple is dedicated (about 516 BCE)"
      - "Antiochus IV bans Jewish practices (167 BCE)"
      - "Judas Maccabee rededicates the Temple (164 BCE)"
      - "Pompey takes Jerusalem (63 BCE)"
      - "Herod begins rebuilding the Temple (about 19 BCE)"
    hint: "Years BCE count down towards the year 1 CE."
    explanation: |
      BCE years run backwards: 538 is earlier than 516, which is earlier than 167, then 164, 63 and 19. Persia first, then the Greek-speaking kings and the Maccabees, then Rome.

  - type: text
    id: herod
    title: "Herod the Great and his Temple"
    image:
      src: img/holyland-model.webp
      alt: "A scale model of ancient Jerusalem with the large rebuilt Temple and its courts."
      caption: "A model of Herod's Temple in the 1:50 scale model of late Second Temple Jerusalem, designed by Michael Avi-Yonah from Josephus and other sources, so it shows one scholarly reconstruction, not a photograph of the past."
      credit: "Berthold Werner, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Jerusalem_Modell_BW_2.JPG"
    body: |
      After Pompey, Rome ruled through local kings. The Roman Senate appointed **Herod the Great** "King of the Jews" in 37 BCE, and he ruled as a Roman client (a king who rules by Rome's permission) until his death in **4 BCE**. According to Josephus, in about **19 BCE**, the 18th year of his reign, he began to rebuild the Temple on a much larger scale, and the work on courts and walls continued for decades.

      After Herod's death the Romans split his kingdom among three sons. Archelaus received Judea, Herod Antipas received Galilee (the home region of Jesus), and Philip received lands to the north-east. Historians read the building as an effort to win the people's favour, and judge his rule in different ways, some calling it tyrannical.

  - type: text
    id: rome
    title: "Rome takes direct control"
    image:
      src: img/pilate-stone.webp
      alt: "A limestone block with a Latin inscription, in a museum display."
      caption: "The Pilate stone, found in 1961 at Caesarea Maritima, reused in a staircase; its dedication names Pontius Pilate as prefect of Judea and is the earliest contemporary record of him."
      credit: "Carole Raddato from Frankfurt, Germany, CC BY-SA 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Dedicatory_inscription_found_reused_in_the_staircase_of_the_theatre_of_Caesarea,_the_first_and_only_mention_of_Pontius_Pilates%27_name_ever_unearthed,_26-36_AD,_Israel_Museum,_Jerusalem_(15655925251).jpg"
    body: |
      In **6 CE** the emperor Augustus removed Archelaus after complaints from his subjects, and Judea became a Roman **province**, run by a *prefect* (an equestrian officer of Rome, not a senator), from the coastal city of Caesarea. The legate (governor) of Syria, **Quirinius**, carried out a census for taxes. The list of prefects includes Valerius Gratus (15 to 26 CE) and **Pontius Pilate (26 to 36 CE)**.

      Pilate is known from several sources. The inscription shown here was found in 1961, and calls him prefect of Judea. The Roman writer Tacitus calls him procurator, a title some scholars think reflects later usage. About 36 CE he violently suppressed a Samaritan gathering, the Samaritans complained to the legate of Syria, and he was sent to Rome. Taxes, a foreign garrison and a foreign official at the centre of a holy land: this is the tension the groups on the next cards react to.

  - type: numeric
    id: gap
    title: "How long from Herod's building to Pilate?"
    prompt: |
      Herod began rebuilding the Temple about 19 BCE. Pontius Pilate became prefect of Judea in 26 CE. Counting in whole years, with no year 0 (1 BCE is followed directly by 1 CE), how many years from the first date to the second?
    answer: 44
    wrong:
      - value: 45
        feedback: |
          Adding 19 and 26 treats the calendar as if there were a year 0. From 19 BCE to 1 BCE is 18 years, then one year to reach 1 CE, then 25 more to reach 26 CE: 18 + 1 + 25 = 44.
      - value: 7
        feedback: |
          Subtracting 19 from 26 treats both dates as CE. A BCE date lies before the year 1 CE, so the two spans must be added.
    hint: "Count 19 BCE to 1 BCE, then 1 BCE to 1 CE, then 1 CE to 26 CE."
    explanation: |
      From 19 BCE to 1 BCE is 18 years, from 1 BCE to 1 CE is 1 year, and from 1 CE to 26 CE is 25 years, so 18 + 1 + 25 = 44. The Temple under construction was a familiar landmark for a whole lifetime before Pilate arrived.

  - type: text
    id: groups
    title: "Four groups, according to Josephus"
    body: |
      **Flavius Josephus** (about 37 to about 100 CE), a Jewish priest and historian from Jerusalem, wrote in Greek for a Roman audience. According to him, there were three schools of thought (he used the Greek word *philosophy*) among the Jews, plus a fourth.

      | Group | According to Josephus and others |
      |---|---|
      | Pharisees | Kept an oral tradition beside the written Torah; popular with the people; souls have an immortal vigour; fate and human choice both play a part |
      | Sadducees | Priestly and wealthy; accepted only the written Torah; souls die with the bodies; fate plays no part |
      | Essenes | Lived communally in many towns; about 4,000 (Josephus and Philo); souls are immortal; fate governs all |

      The Pharisees and Sadducees are named together in the New Testament too, where Acts 23:8 says the Sadducees reject resurrection. Remember the frame: this is how Josephus and outsiders described them. We do not have their own books, except possibly for the Essenes, as the later cards show.

  - type: mcq
    id: fate
    title: "Sort the three by fate"
    prompt: |
      According to Josephus, on whether fate (the idea that events are fixed beforehand) governs human affairs, the three schools lie on a spectrum. Which ordering is his, from the strongest role of fate to none?
    options:
      - text: "Essenes (fate governs all), Pharisees (fate has a part, choice too), Sadducees (no fate)."
        correct: true
        feedback: |
          Yes. This is a spectrum from full determination, through a mixture, to full human control. Translations vary in wording, so scholars read this as the shape of the contrast rather than a precise doctrine.
      - text: "Sadducees (fate governs all), Pharisees, Essenes (no fate)."
        feedback: |
          Reversed. The Sadducees, in Josephus, were the ones who removed fate and put human actions under human control.
      - text: "All three said that fate governs everything."
        feedback: |
          Josephus presents exactly a contrast here. Only the Essenes held the strongest view of fate.
    explanation: |
      The point is not to memorise a table but to see why the groups could part ways on practical matters: the more fixed the future, the less point in changing it by force or by choice.

  - type: mcq
    id: sadducee-sources
    title: "How do we know the Sadducees?"
    prompt: |
      No writings of the Sadducees survive. What we know of them comes from Josephus (who was close to the Pharisees), from Christian texts and from rabbinic literature, which was hostile to them. What follows for a careful historian?
    options:
      - text: "Treat claims about their beliefs as reports by outsiders, and look for any outside check (an inscription, a Scroll, an archaeological find) before relying on a detail."
        correct: true
        feedback: |
          This is the method. Their view may have been fairer than their rivals made it sound, or exactly as reported; we cannot tell from hostile reports alone.
      - text: "Take the reports as accurate, since three different kinds of source agree."
        feedback: |
          They agree on a few points, but each of the three had a reason to contrast the Sadducees with its own group, so the agreement is thinner than it looks.
      - text: "Conclude that the Sadducees did not exist."
        feedback: |
          The sources, from several sides, treat them as real and prominent, and the Temple priesthood is well attested. Missing writings are not missing people.
    explanation: |
      A group that cannot speak for itself is described by its rivals. The same caution applies, in lesser degree, to all the groups of this period.

  - type: text
    id: fourth
    title: "The fourth philosophy"
    body: |
      When the census of Quirinius came in 6 CE, according to Josephus a man called **Judas the Galilean** urged resistance. Josephus says his "fourth philosophy" agreed with the Pharisees in everything else, but held an unyielding attachment to liberty and accepted no human master, only God.

      Later writers often link this movement to the **Zealots** and to the **Sicarii** ("dagger men"). Historians disagree. Some argue that the sources do not clearly connect the fourth philosophy to the Zealots, and that the Zealots were not a clearly defined party before the revolt against Rome began in 66 CE. Josephus himself shows contempt for these groups, which is another reason to be careful.

  - type: mcq
    id: judas
    title: "What set the fourth philosophy apart?"
    prompt: |
      According to Josephus, the "fourth philosophy" of Judas the Galilean agreed with the Pharisees in all other things. What was its distinctive claim?
    options:
      - text: "God alone is ruler, so paying the Roman census tax and accepting a human master is wrong."
        correct: true
        feedback: |
          Yes. The disagreement was less about doctrine than about politics: how to live under Rome. A group close to the Pharisees in belief could still part ways with them on what to do.
      - text: "The dead do not rise."
        feedback: |
          That is Josephus's description of the Sadducees, not of the fourth philosophy, which he says matched the Pharisees on such matters.
      - text: "Only the written Torah counts."
        feedback: |
          That is again the Sadducean position. The fourth philosophy was closer to the Pharisees.
    explanation: |
      Beliefs about the afterlife and about politics can vary independently. Do not assume a group is "extreme" in everything because it is extreme in one thing.

  - type: text
    id: messiah
    title: "Messiah: one word, many hopes"
    body: |
      The Hebrew *mashiach* means "anointed one". In the Hebrew Bible kings and priests, and sometimes prophets, were anointed with oil, so "messiah" first meant a person set apart for an office. The Greek word *Christos* (Christ) translates it.

      In the Second Temple period, hopes for a coming figure took several forms, according to the texts. There was a **royal** hope in the line of David, as in the Psalms of Solomon, a Jewish poem collection from the first century BCE, whose 17th psalm prays for a Davidic king to purge Jerusalem and rule righteously. There was a **priestly** hope: the Dead Sea Scrolls use titles such as Branch of David and Prince of the Congregation (royal) and Priest. And there was a hope for a **prophet like Moses**, taken from Deuteronomy 18, which one Scroll, the Testimonia (4Q175), quotes. The Community Rule (1QS 9:11) names a prophet and "messiahs of Aaron and Israel", but whether that means two figures or one is debated, and the phrase is missing from an older copy of the text (4QSe), which some scholars take to show it was added later.

  - type: mcq
    id: messiah-q
    title: "What do the sources support?"
    prompt: |
      Select all that the surviving sources support about messianic hopes in the Second Temple period.
    multiple: true
    options:
      - text: "A prayer for a Davidic king appears in the Psalms of Solomon 17, dated to about the first century BCE."
        correct: true
        feedback: |
          Yes, this is a clear royal hope in a Jewish text.
      - text: "The Dead Sea Scrolls include priestly titles among their messianic language."
        correct: true
        feedback: |
          Yes. The Scrolls were not about the king alone.
      - text: "According to James VanderKam, the vast majority of Second Temple texts do not mention a messianic leader of the end time."
        correct: true
        feedback: |
          Yes. Messianic hope was one strand among many, not the default of every text.
      - text: "All Jews of the period expected one military king who would defeat Rome."
        feedback: |
          The sources show several types of figure and many texts with none. A single warrior messiah is a later simplification.
      - text: "The word 'messiah' always meant a divine being."
        feedback: |
          Its first meaning was an anointed person: a king or a priest. Later texts, such as the Similitudes of Enoch, picture a heavenly figure, but not all do.
    explanation: |
      The safest sentence is: there were several hopes, with different figures, and many texts had none. Whether any of them was fulfilled is a question of faith, not of the sources.

  - type: text
    id: apocalyptic
    title: "Hopes of the end: the apocalypses"
    body: |
      Recall: the Dead Sea Scrolls are hundreds of manuscripts found in caves near Qumran, including sectarian texts such as the Community Rule. Scholars link them in different ways: many to the Essenes (the view of de Vaux), others to a library from Jerusalem (Golb) or to Sadducean roots (Schiffman). This lesson uses them as a witness to the variety of Jewish hopes, whoever wrote them.

      An **apocalypse** (Greek for "uncovering") is a book that claims to reveal heavenly secrets through visions, angels and symbols. The book of **Daniel** is one. Its setting is the Babylonian period, but most critical scholars date its final form to about **167 to 163 BCE**, the crisis of Antiochus IV, and read its visions as a promise that God would deliver Israel from oppression. It also contains what is usually called the first clear statement of resurrection in the Hebrew Bible. Traditional readers date it earlier, to the sixth century BCE, the time of its setting.

  - type: mcq
    id: daniel-layers
    title: "Which layer is the date of Daniel?"
    prompt: |
      Most critical scholars date the final form of Daniel to about 167 to 163 BCE. Traditional readers hold that it was written in the sixth century BCE by Daniel himself. How should a careful student classify this?
    options:
      - text: "A scholarly dispute with a commitment behind it: the late date follows from reading the visions as describing events up to Antiochus IV; the early date follows from taking the predictions as real foretelling."
        correct: true
        feedback: |
          Yes. Both sides read the same text. They differ on whether detailed predictions can be real foretelling, which is a premise about what the author could know, not a datum in the manuscript.
      - text: "Established fact: the manuscripts give the year."
        feedback: |
          The manuscripts give no year of composition. The date is an inference.
      - text: "Irrelevant: the date does not affect what the book means."
        feedback: |
          It affects a lot. A book of 167 BCE answers one crisis; a book of the sixth century BCE would be a prediction of it.
    explanation: |
      The question "when was it written?" is historical. The question "can a text foretell the future?" belongs to a different layer, where the earlier arguments about miracles apply.

  - type: text
    id: sources
    title: "What we know it from, and its limits"
    body: |
      **Josephus** wrote *The Jewish War* (about 75 CE) and *Antiquities of the Jews* (about 93 to 94 CE). He was a general in Galilee at the start of the revolt in 66 CE, surrendered to Vespasian, and lived in Rome under the patronage of the emperors' family. Historians use him heavily but with caution, since his patronage and self-defence may have shaped his account.

      **Philo of Alexandria** (about 20 BCE to about 50 CE) was a Jewish philosopher who led a delegation of Alexandrian Jews to the emperor Caligula; he lived outside Judea. The **Dead Sea Scrolls** are first-hand Jewish texts, but their authors are debated. **Archaeology** gives objects: the Pilate stone, the Temple Mount walls. Each source is partial, and none is a neutral camera. Good history asks which source says what, for whom, and how it could be checked.

  - type: mcq
    id: josephus-q
    title: "Reading Josephus"
    prompt: |
      Josephus describes the Pharisees as popular and influential, and many historians think he may have been a Pharisee himself. How should this affect our use of him?
    options:
      - text: "Use his account of the Pharisees as evidence, but check it against other sources, since his view may have favoured them."
        correct: true
        feedback: |
          Yes. A source close to its subject can know it well and can also flatter it. The remedy is a second witness, not rejection.
      - text: "Reject everything he says about the Pharisees."
        feedback: |
          That is too strong. A source with a lean is still evidence, and we have few others.
      - text: "Accept it fully, because he was an eyewitness."
        feedback: |
          He wrote decades after many events and for Roman readers, and his own career gave him reasons for emphasis. Eyewitness status does not remove bias.
    explanation: |
      The same method as with the Sadducees from the other side: every source is shaped by who wrote it, and a claim is stronger when independent sources support it.

  - type: mcq
    id: pharisee-trap
    title: "Trap: 'the Pharisees were hypocrites'"
    prompt: |
      A popular image says the Pharisees were hypocrites. A historian looks at the sources: Josephus calls them popular; rabbinic Judaism later drew on a Pharisaic tradition; Christian texts record sharp disputes with them over how to read the Torah. What is the careful statement?
    options:
      - text: "'Hypocrite' is a verdict from the polemic of one side in a dispute. Historically, they were a leading, popular group who held that the oral tradition and strict observance of purity applied to everyone."
        correct: true
        feedback: |
          Yes. Both sides of a dispute use strong words about the other. The historian separates what the Pharisees taught and did from how rivals judged it.
      - text: "They were exactly as the harshest passages describe, because the Gospels are the only detailed source."
        feedback: |
          Josephus and the later rabbinic texts also speak about them and give a different, more positive picture of their standing among the people.
      - text: "They never disagreed with anyone, so the claim is false."
        feedback: |
          They did disagree, openly, with the Sadducees and with others. The question is whether a rival's label is the best description.
    explanation: |
      Whether a teaching was sincere or hollow is a moral judgment. The sources let us state what each group held and how others reacted, not read the hearts of its members.

  - type: mcq
    id: back-to-hook
    title: "Back to the farmer"
    prompt: |
      The farmer from Galilee asks four groups two questions: "Will the dead rise?" and "May I pay the Roman census tax?" According to Josephus, which pairing of answers is right?
    options:
      - text: "On the first, the Pharisees (souls survive) and the Sadducees (souls die with the bodies) part ways. On the second, the fourth philosophy answers no, while the Pharisees need not follow it."
        correct: true
        feedback: |
          Yes. The groups cut across each other: Pharisees and the fourth philosophy shared beliefs but not tactics, and Sadducees differed from both on the afterlife.
      - text: "All four groups answer the same on both questions."
        feedback: |
          Josephus presents exactly the opposite: a map of differences on both.
      - text: "The Essenes answer both questions by leading the revolt."
        feedback: |
          Josephus describes the Essenes as a communal group living apart, not as leaders of the census resistance.
    explanation: |
      The hook is answered: the farmer would hear different answers, and the sources let us say who held which, each according to Josephus and a few others.

  - type: text
    id: summary
    body: |
      **Next:** four narratives, Mark, Matthew, Luke and John, each tell the story of Jesus in its own way, and the first three overlap so closely and differ so precisely that scholars ask how they are related. That is the Synoptic problem, the subject of the lesson The Synoptic Problem and the Gospels.
