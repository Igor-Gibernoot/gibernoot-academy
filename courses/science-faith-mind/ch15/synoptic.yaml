id: ch15-synoptic
title: "The Synoptic Problem and the Gospels"
kind: concept
own: |
  The setting: the four canonical Gospels (narratives of the life of Jesus of Nazareth) named Matthew, Mark, Luke and John. Everything is taught according to someone (ancient writers, critical scholars, Christian tradition), with years in CE.
  - **Names and dates.** The four texts do not name their authors in the text; the names Matthew, Mark, Luke and John are {{ tradition }} (recorded from the second century on). Critical scholars date them roughly Mark about 65 to 75 CE, Matthew and Luke about 80 to 90 CE, John about 90 to 100 CE; some scholars date Matthew much earlier.
  - **The Synoptic problem.** *Synoptic* comes from Greek words for "seeing together". Matthew, Mark and Luke can be printed in parallel columns and they overlap heavily, often word for word. The problem is {{ which Gospel used which, or which shared source, to explain the overlap }}. Material in all three is the **triple tradition**; material in Matthew and Luke but not Mark (about two hundred verses) is the **double tradition**.
  - **Markan priority.** Most critical scholars hold that Mark was written first and that Matthew and Luke each used it. Arguments: Mark is the shortest; where parallel, Matthew and Luke tend to smooth Mark's wording (for example the verse where Mark says Jesus "could do no deed of power" in his home town, which Matthew softens to "did not do many"); and Matthew and Luke rarely agree with each other against Mark's order of episodes (Lachmann, 1835).
  - **The Griesbach (two-gospel) hypothesis.** Matthew was first, Luke used Matthew, and {{ Mark combined and shortened Matthew and Luke }}. It follows early church tradition (Matthean priority) and needs no lost source; critics ask why Mark would drop the Sermon on the Mount and the birth stories. Revived by William Farmer in 1964; a small minority view.
  - **Q and the Farrer hypothesis.** The two-source hypothesis explains the double tradition by a lost sayings source, **Q** (German *Quelle*, "source"), used by Matthew and Luke independently; no manuscript of Q survives, and it is reconstructed from the overlap. The {{ Farrer hypothesis }} (Austin Farrer, 1955) keeps Markan priority but says Luke used Matthew, so Q is not needed. Streeter (1924) added M and L for the material found only in Matthew or only in Luke.
  - **John.** John has a different structure and mostly its own material (no parables; three Passovers; the Temple scene near the start of the ministry, not the end), so it is not part of the synoptic problem.
  - **Three layers.** Established: the overlap itself, the manuscripts, the anonymity of the texts. Live debate: which solution is best (most critical scholars favour Markan priority; Q versus Farrer is open). Commitment: whether the Gospels are inspired, which Christians affirm in various ways and which the solution to the problem neither proves nor refutes.

cards:
  - type: mcq
    id: hook
    title: "Guess: copying, a shared source, or chance?"
    prompt: |
      Guessing is the point; no background is needed. Two students hand in essays about the same museum visit. Over three long paragraphs the sentences are identical, word for word, but each essay also has parts the other lacks. What is the most reasonable first guess?
    options:
      - text: "One copied from the other, or both copied from a common handout, perhaps adding or changing a little each."
        correct: true
        feedback: |
          Yes. Long stretches of identical wording are far too unlikely by chance, so the interesting question is which kind of copying happened: one from the other, or both from a third text. That is the shape of the Synoptic problem.
      - text: "Chance: two people describing the same visit would pick the same words."
        feedback: |
          Two honest descriptions of one event agree on content, but identical sentences for whole paragraphs are not what chance produces. Wording varies a lot between people.
      - text: "Nothing can be said without asking the students."
        feedback: |
          Asking would help, but the texts themselves already carry evidence. When no one can be asked (the case with ancient authors), historians reason from the texts alone.
    explanation: |
      Three Gospels overlap in this way. This lesson asks how scholars reason about it, which answers they give, and what each answer does and does not settle.

  - type: text
    id: four
    title: "Four Gospels, four traditional names"
    image:
      src: img/sinaiticus.webp
      alt: "A page of a Greek manuscript in large capital letters, the opening of the Gospel of Matthew."
      caption: "The opening of Matthew in Codex Sinaiticus, a Greek Bible copied in the fourth century (about 325 to 360 CE), with the Gospels under their traditional titles."
      credit: "Codex Sinaiticus (British Library), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Codex_Sinaiticus_Matthew_1,1-2,5.JPG"
    body: |
      The New Testament opens with four narratives of the life, teaching, death and (according to Christians) resurrection of Jesus. They are called *Gospels*. Their traditional titles are *According to Matthew*, *According to Mark*, *According to Luke* and *According to John*.

      Here is the first thing to separate. The texts themselves are **anonymous**: the narrator does not say "I, Mark". The names come from **tradition**. According to Eusebius (a church historian of the fourth century), the bishop Papias of Hierapolis (about 60 to 130 CE) said that Mark, having become Peter's interpreter, wrote down accurately, though not in order, what Peter taught, and that Matthew wrote the oracles in the Hebrew language. Christian tradition from the second century onward names the four authors, and many believers hold the traditional names. Most critical scholars (those who study the texts by the methods used on any ancient writing) treat the authors as unknown.

      Dates are likewise disputed. Critical scholars usually date Mark to about 65 to 75 CE (read from its talk of the Temple's fall, which happened in 70 CE), Matthew and Luke to about 80 to 90 CE, and John to about 90 to 100 CE. A few scholars, such as N. T. Wright, argue for a much earlier Matthew.

  - type: mcq
    id: anonymity
    title: "Which layer is the author's name?"
    prompt: |
      A reader says: "The Gospel of Mark was written by Mark, a companion of Peter." According to the course's three layers (established fact, scholarly debate, faith or tradition), how should this be labelled?
    options:
      - text: "A claim of tradition that goes back to Papias, accepted by many believers and some scholars and doubted by others; the text itself does not name its author."
        correct: true
        feedback: |
          Yes. What is established is that the text is anonymous and that the attribution is old. Whether the tradition is right is debated by scholars, some of whom accept that a man named Mark wrote it.
      - text: "Established fact, because the title says so."
        feedback: |
          The title is an added label on copies of the text, not part of the narrative. A label is evidence of what early readers believed, not proof of who wrote it.
      - text: "Proven false, because the text is anonymous."
        feedback: |
          Anonymity does not show the tradition wrong. Many ancient biographies were unsigned, and a named author may still have written it. It only removes direct proof.
    explanation: |
      The same care applies below to dates and sources: say what the text shows, what the best explanation is, and what remains open.

  - type: text
    id: synopsis
    title: "Synoptic: seen together"
    body: |
      Matthew, Mark and Luke are called the **Synoptic Gospels**. *Synoptic* comes from Greek words meaning "seeing all together": the three can be printed in parallel columns, a *synopsis* (the German scholar Johann Jakob Griesbach published a famous one in 1776), and read line by line. Doing so shows that they tell much of the same story in much the same order, and in many places in nearly the same Greek words.

      Luke himself says (Luke 1:1 to 4, NRSV) that "many have undertaken to compile a narrative about the events", and that he, too, decided "to write a well-ordered account". So the author knew of earlier accounts. The question is which texts the three authors used.

      To see what a synopsis shows, here are three **invented** accounts of one small event (not from any Gospel):

      | Account | Text |
      |---|---|
      | X | A traveler stopped at a well, asked for water, and the woman gave him a jar. |
      | Y | A traveler stopped at a well, asked for water, and the woman gave him a jar. He thanked her and walked on. |
      | Z | A traveler stopped at a well and asked a woman for water, and she gave him her jar. |

  - type: mcq
    id: table-read
    title: "Reading the invented table"
    prompt: |
      Account X says: "A traveler stopped at a well, asked for water, and the woman gave him a jar." Account Y begins with the same sentence word for word and adds "He thanked her and walked on." Account Z says: "A traveler stopped at a well and asked a woman for water, and she gave him her jar." Which is the most natural reading of these three?
    options:
      - text: "X and Y are very close in wording, so one probably used the other (Y adds a line); Z tells the same event in different words, which fits a less direct link."
        correct: true
        feedback: |
          Yes. Verbal agreement over a whole sentence is the sign of copying; agreement in content only is weaker evidence. Synoptic scholars use exactly this contrast, measured on the Greek text.
      - text: "All three are independent, since they all describe a traveler and a well."
        feedback: |
          Shared content alone fits independent witnesses to one event. The identical sentence in X and Y is what independent witnesses would not produce.
      - text: "Z is the original, because it is the longest."
        feedback: |
          Z is not longest (Y is), and length alone proves nothing about which came first. Direction of copying needs further arguments, as the next cards show.
    explanation: |
      Two questions are mixed here: how related are the texts (copying or not), and in which direction. Wording answers the first; direction needs more.

  - type: text
    id: triple
    title: "Triple tradition, double tradition"
    body: |
      Scholars give names to the overlaps. Material found in **Matthew, Mark and Luke** is the **triple tradition**: nearly all the stories of Mark are here. Material found in **Matthew and Luke but not in Mark** is the **double tradition**, about two hundred verses, mostly sayings of Jesus. Material found in **only one** Gospel is *special material*. John, as we shall see, is mostly its own.

      Mark has 661 verses (by the count scholars commonly use), and Matthew shares about 600 of them. Luke follows Mark closely too. So the overlap is not a few shared phrases, but most of one Gospel inside two others.

  - type: mcq
    id: sort
    title: "Name the tradition"
    prompt: |
      Suppose a story (a healing, say) is found in Matthew, Mark and Luke, and a saying about prayer is found in Matthew and Luke but not in Mark. What are the two groups called?
    options:
      - text: "The story is triple tradition; the saying is double tradition."
        correct: true
        feedback: |
          Yes. Count the Gospels that contain it: three, so triple; two without Mark, so double.
      - text: "Both are triple tradition, since all three Gospels talk about prayer and healing."
        feedback: |
          The names count the Gospels that contain the same passage, not the topics. A saying in only two Gospels is not in the triple tradition.
      - text: "The story is double tradition, since Mark is the odd one out."
        feedback: |
          Reversed. The double tradition is exactly what Mark lacks.
    explanation: |
      The double tradition is what forces scholars to propose either a lost source (Q) or direct use of Matthew by Luke, later in the lesson.

  - type: numeric
    id: share
    title: "How much of Mark is in Matthew?"
    prompt: |
      Mark has 661 verses and Matthew shares about 600 of them. To the nearest whole percent, what share of Mark's verses appears in Matthew?
    answer: 91
    tolerance: 1
    hint: "Divide 600 by 661 and multiply by 100."
    explanation: |
      $600/661 \approx 0.908$, about 91 percent. Counts differ a little between scholars, depending on how a shared verse is defined, so treat it as "about nine tenths". Whatever the cause, Matthew contains nearly all of Mark.

  - type: text
    id: lachmann
    title: "Markan priority: the case for Mark first"
    body: |
      Most critical scholars hold **Markan priority**: Mark was written first, and Matthew and Luke each used it. Three arguments are usually given.

      First, **length**. Mark is the shortest, and Matthew and Luke contain nearly all of it; it seems easier to explain an author adding to a short book than cutting a long one, though a summary does exist in ancient writing. Second, **wording and tone**: where the three tell the same story, Matthew and Luke tend to smooth Mark's wording, and sometimes avoid a hard saying. Third, **order**. In 1835 the German philologist Karl Lachmann noticed that Matthew and Luke often follow Mark's order of episodes, and rarely do they agree with each other against Mark. If both used Mark, this is what we expect: each keeps Mark's order, and when one moves a passage the other does not move it to the same place.

      Critics reply that the order data can fit other solutions too (the next card shows how), so the argument is weaker than it looks.

  - type: mcq
    id: harder
    title: "Which wording is easier to explain?"
    prompt: |
      In the NRSV, Mark 6:5 says of Jesus in his home town: "And he could do no deed of power there, except that he laid his hands on a few sick people and cured them." Matthew 13:58 has: "And he did not do many deeds of power there, because of their unbelief." A scholar argues that Mark's form came first. What is the reasoning?
    options:
      - text: "A later author is more likely to soften a sentence that seems to limit Jesus' power than to harden a gentler one, so the sharper wording is probably the earlier."
        correct: true
        feedback: |
          Yes, that is the usual argument (a rule of thumb, not a proof): the harder reading tends to be older, as in the lesson on how manuscripts change. Rivals reply that Mark could have sharpened Matthew, and that motives are hard to read.
      - text: "The shorter sentence is always the older."
        feedback: |
          Length is not a rule here: Matthew's sentence is shorter in places and longer in others. The argument rests on which change has a motive, not on counting words.
      - text: "Matthew copied Luke, since both say it."
        feedback: |
          Luke does not have this passage in this form at all. The point is the direction between Mark and Matthew, and the argument is about motive, not about Luke.
    explanation: |
      Notice the structure: a claim about direction (Mark first), a reason (softening is likelier than hardening), and a limit (a rule of thumb that rivals can turn around).

  - type: text
    id: griesbach
    title: "The rival: Matthew first (the Griesbach hypothesis)"
    body: |
      Before Markan priority, the usual church tradition put Matthew first. In the 1780s Griesbach proposed the **Griesbach hypothesis** (today also the **two-gospel hypothesis**): Matthew was written first, Luke used Matthew, and **Mark** was written last, **combining** and shortening Matthew and Luke. William Farmer revived it in 1964 in *The Synoptic Problem*.

      Its best defenders offer three arguments. It follows the early church's tradition of Matthean priority and of Mark as Peter's interpreter. It needs **no lost source**, only the three Gospels we have. And it reads Mark's order, which alternates between Matthew's and Luke's, as the mark of an author joining two texts. Most scholars find the objections stronger: why would Mark leave out the Sermon on the Mount and the birth stories, and how could Luke's large departures from Matthew (for example the genealogy and the birth stories) be revisions of it?

      Both sides use the same texts. They differ in which direction of change seems more plausible, which is a judgment about how ancient authors worked.

  - type: mcq
    id: griesbach-test
    title: "Fair to a Griesbach defender?"
    prompt: |
      A defender of the Griesbach hypothesis (Matthew first) is asked: "Why would Mark omit the Sermon on the Mount?" Which is the strongest reply in the form the view's defenders would accept?
    options:
      - text: "Mark wanted a short, action-centred account and chose to leave out long discourses, as ancient abbreviators did; the view does not say Mark copied everything."
        correct: true
        feedback: |
          Yes, a fair statement of the reply: omission of material is a choice an editor can make, so the objection is a question of plausibility, not a contradiction. Opponents answer that Mark keeps so little of the teaching that the choice looks odd.
      - text: "Mark did not know the Sermon on the Mount existed."
        feedback: |
          That is the Markan-priority account (Mark never had it). On Griesbach's view Mark has Matthew and Luke before him, so the reply must be about omission.
      - text: "The Sermon is a later addition to Matthew."
        feedback: |
          That changes the hypothesis: Matthew would then not be complete before Mark. A defender wants Matthew as we have it to come first.
    explanation: |
      A steelman states the view as its defenders would, then the objection, then the best reply. Even the most doubted view has a coherent reply to each objection; the debate is about which cost is smaller.

  - type: text
    id: double
    title: "The double tradition: Q or Farrer?"
    body: |
      If Mark was first, how do we explain the **double tradition**, the roughly two hundred verses shared by Matthew and Luke and not found in Mark? There are two main answers.

      **The two-source hypothesis** (from Christian Hermann Weisse, 1838): Matthew and Luke each used Mark and also a second, lost source of sayings, called **Q**. The letter comes from German *Quelle*, "source". Q is not a book we possess: it is a reconstruction from the overlap, and no copy or ancient mention of it survives.

      **The Farrer hypothesis** (Austin Farrer, 1955, "On Dispensing with Q"; later defended by Michael Goulder and Mark Goodacre, who published *The Case Against Q* in 2002): keep Markan priority, but say that **Luke used Matthew** as well as Mark. Then the double tradition is simply Luke borrowing from Matthew, and no lost source is needed.

      Each side states a cost. Q defenders say it is odd that Luke would rearrange Matthew so much, taking sayings from Matthew's long speeches and scattering them. Farrer defenders say a source nobody mentions and that no one saw is an extra assumption. Both views accept Markan priority; they differ over one step.

  - type: order
    id: farrer-order
    title: "Order the steps of the Farrer hypothesis"
    prompt: "According to the Farrer hypothesis, in what order were things written?"
    steps:
      - "Mark is written first"
      - "Matthew is written, using Mark"
      - "Luke is written, using both Mark and Matthew"
    hint: "Think of Luke as the last to write, with two earlier texts to hand."
    explanation: |
      Farrer's order is Mark, Matthew, Luke, with no Q. The Griesbach order is Matthew, Luke, Mark; the two-source order has Mark and Q first, then Matthew and Luke independently, each using both. The order of the three Gospels differs in each; their number of sources differs too.

  - type: text
    id: ml
    title: "Special material: M and L"
    body: |
      Matthew and Luke each contain stories found nowhere else. Matthew has, for example, the visit of the Magi and the parable of the sheep and the goats (Matthew 25); Luke has, for example, the parable of the Good Samaritan and the story of the Prodigal Son (Luke 10 and 15). In 1924 the English scholar B. H. Streeter, in *The Four Gospels*, called the material found only in Matthew **M** and only in Luke **L**, and suggested each might come from a separate source. With Mark and Q this gave his **four-document hypothesis**.

      Scholars still debate whether M and L were written documents, oral tradition, or simply a convenient name for what each author added or wrote himself. The labels describe the data (material found in only one Gospel); the explanation is the open part.

  - type: text
    id: john
    title: "John: a different pattern"
    image:
      src: img/p52.webp
      alt: "A small, torn scrap of papyrus with a few lines of Greek handwriting."
      caption: "Rylands Library Papyrus P52, a scrap with a few lines of John 18 on each side, is the oldest known fragment of any New Testament text; by handwriting it is dated roughly 125 to 175 CE, so it shows John was in circulation by the second century."
      credit: "John Rylands Library, Manchester, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:P52_recto.jpg"
    body: |
      The fourth Gospel is not "synoptic": it has a different structure and different material. According to scholars, most of its content is found nowhere in the other three; most scholars see **no parables** in it, but long discourses and "signs" (miracles that carry a meaning), and sayings such as "I am the good shepherd". It dates, most critical scholars say, to about 90 to 100 CE. The text is anonymous too; tradition names John the apostle, while many scholars favour other authors.

      Its outline differs. John mentions **three Passover festivals**, so a ministry of about three years, while the Synoptics mention one Passover, the last. And the scene where Jesus drives merchants from the Temple stands at the **beginning** of his ministry in John (chapter 2) and near the **end** in Matthew, Mark and Luke. Some interpreters hold there were two such events; most scholars hold there was one, and that the authors placed it for their own purposes.

  - type: mcq
    id: john-test
    title: "John and the Synoptics"
    prompt: |
      A student writes: "John is just another Synoptic Gospel, so its differences must be copying mistakes." According to the lesson, which correction is best?
    options:
      - text: "John has its own structure and material (a longer ministry, no parables, the Temple scene placed early), so it is studied as a separate problem, not as part of the three-way overlap."
        correct: true
        feedback: |
          Yes. The word synoptic names the three Gospels that can be read side by side. How John relates to them (independent, or knowing them) is a separate debate.
      - text: "John copied Mark word for word, so it is the same as the Synoptics."
        feedback: |
          Opposite of the observation: John shares little wording with them. Some scholars think John knew Mark, but that is a debated claim about influence, not a word-for-word overlap.
      - text: "John is the oldest of the four, so the others copied it."
        feedback: |
          Most critical scholars date John last (about 90 to 100 CE). Tradition and some believers also place it last, though they give it an apostle as author.
    explanation: |
      Whether the differences between John and the Synoptics reflect different aims, different sources or different memory is another open question; for the course, notice that it is a distinct problem.

  - type: mcq
    id: traps
    title: "Spot the misconceptions"
    prompt: |
      Select all the statements that are mistaken.
    multiple: true
    options:
      - text: "Markan priority says Mark was a summary of Matthew."
        correct: true
        feedback: |
          This reverses the claim. Markan priority says Mark came first. (Augustine, in the early fifth century, presented Mark as following Matthew, and later thought Mark used both Matthew and Luke; so an abbreviator view is an older tradition, not a mistake of logic.)
      - text: "Q is a manuscript that survives in a library, and scholars read it."
        correct: true
        feedback: |
          No copy of Q survives and no ancient writer clearly mentions it; it is a reconstruction from the overlap of Matthew and Luke. That is why defenders and critics of Q argue over it.
      - text: "The Farrer hypothesis keeps Markan priority and says Luke used Matthew."
        feedback: |
          This statement is correct, so it is not a mistake.
      - text: "The Synoptic problem asks how Matthew, Mark and Luke are related; it is a question about literary dependence, not about whether Jesus existed."
        feedback: |
          This statement is also correct, so it is not a mistake. The solution says which text used which; it does not by itself decide any historical or religious question.
    explanation: |
      Two misconceptions: confusing the direction of Markan priority, and treating a hypothetical source as an object we can read.

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Sort this claim: "Most critical scholars hold that Mark was written first and used by Matthew and Luke, but whether Q existed is disputed." Which layer is it?
    options:
      - text: "Layer 2: scholarly consensus on one point (Markan priority) and live debate on another (Q); it is not a matter of faith."
        correct: true
        feedback: |
          Yes. The claim reports the state of a scholarly field, with the degree of agreement in each part. The facts under it (the overlap of the texts) are layer 1.
      - text: "Layer 1: established fact, since most scholars agree."
        feedback: |
          Agreement among scholars is strong evidence of a good argument, but it is not the same as data. The data are the texts; the solution is an inference.
      - text: "Layer 3: a faith commitment about the Gospels."
        feedback: |
          Nothing here says what the Gospels mean or whether they are inspired. The claim is only about literary dependence.
    explanation: |
      The overlap of the texts is fact; the solution is scholarly inference; what the texts are for a believer is a separate commitment.

  - type: mcq
    id: inspiration
    title: "Does the solution decide inspiration?"
    prompt: |
      According to Christians who hold the Gospels inspired, and according to scholars who do not, what does Markan priority show about inspiration?
    options:
      - text: "By itself, nothing: a Christian can hold the Gospels inspired whether Matthew or Mark came first, and a sceptic can reject inspiration under either order. The source question is about how the texts were written, not about whether they are divinely inspired."
        correct: true
        feedback: |
          Yes. Many Christian scholars accept Markan priority and also hold inspiration, reading the use of sources as one of the human ways the texts were composed. Others, who prefer an earlier or apostolic Matthew, will favour a different order; neither is shown wrong by the other's faith.
      - text: "It disproves inspiration, since inspired authors would not need to copy from others."
        feedback: |
          That assumes a view of inspiration (dictation) that many Christians do not hold. Luke himself says he used earlier accounts. Whether the use of sources is compatible with inspiration depends on what a believer means by the word, which is layer 3.
      - text: "It proves inspiration, since the shared wording shows a hidden plan."
        feedback: |
          Shared wording is explained by copying or common sources, as the invented table showed. A hidden plan is a layer-3 claim that the data do not require or exclude.
    explanation: |
      The solution to the Synoptic problem answers a question of literary history. What the Gospels are for a reader is separate, and each reader may hold it either way.

  - type: text
    id: summary
    body: |
      **Next:** with the texts' relations in view, the lesson The Historical Jesus asks what the Gospels and other ancient sources let historians say about the man behind them, which criteria they use, and where they part ways.
