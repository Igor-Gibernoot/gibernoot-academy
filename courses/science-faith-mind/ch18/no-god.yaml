id: ch18-no-god
title: "Is Buddhism a Religion Without God?"
kind: concept
own: |
  The setting: the question whether Buddhism is "a religion without God", asked of the Buddhist traditions met in this level (Theravada, Mahayana and Vajrayana, with Zen as one school). Everything is taught according to the Pali texts, according to Buddhists of different traditions and according to scholars; which view is right is left to each reader.
  - **The silence.** In the Pali discourse called the *Culamalunkya Sutta* (MN 63), the monk Malunkyaputta demands answers to questions such as whether the cosmos is eternal, whether the soul and the body are the same, and whether a Tathagata (a buddha) exists after death. According to the text, the Buddha leaves these *undeclared* because they are {{ not connected with the goal of the path }}. The parable of the arrow gives the pattern:
    $$\begin{gathered}\text{poisoned arrow: remove it first} \\ \text{questions about the archer: later}\end{gathered}$$
    The silence is a priority about what the path needs. It is neither a confession of ignorance nor atheism.
  - **Gods inside the cosmos.** According to Buddhist cosmology, the *devas* ("gods", heavenly beings) are real but {{ long-lived, not immortal, and still subject to rebirth }}; heaven is a way station, not the goal. The king of one heaven is Sakka, and the Buddha's traditional epithet "teacher of gods and humans" shows him above them as a teacher.
  - **The creator claim.** According to the *Brahmajala Sutta* (DN 1), the being called Brahma, who appeared first in a new world, mistakenly {{ believed he had created the beings who appeared after him }}. Scholars such as Analayo read this as an account of how the belief in a creator arose, not as a bare denial.
  - **Two slogans, both wrong.** "Buddhists worship gods" and "Buddhism is atheism" are each too simple: gods exist in the cosmology, but according to the texts none is {{ a creator or the source of salvation }}. Devotion exists too: Pure Land schools recite the name of the buddha Amitabha, and Tibetan deity yoga visualizes a deity; adherents describe both as paths to awakening, not as worship of a creator.
  - **Rebirth.** According to the tradition, there is rebirth without a soul, since no-self means {{ a stream of conditions continues, not a self that moves }}, and karma (intentional action) shapes it. Modern Buddhists divide: a *literal* reading (Alan Wallace, a Tibetan-trained scholar, defends a continuity of consciousness) and a *naturalist* or *secular* reading (Stephen Batchelor, who in 1997 proposed an agnostic stance and later called himself a Buddhist atheist).
  - **Definitions.** Whether Buddhism is "a religion without God" depends on the definition. By the definition
    $$\text{religion} = \text{belief in a god or gods}$$
    the answer is {{ not simply yes or no }}, since gods are accepted but not as creators. By the definition "a system of practices, texts and community about the ultimate goal of life" it is a religion.
  - **Three layers.** Established: the texts, the cosmology, the schools and what adherents say. Debated: whether the Buddha was agnostic or silent for practical reasons, and what the early rebirth teaching meant. Faith: that rebirth occurs and that awakening is possible.

cards:
  - type: mcq
    id: hook
    title: "Guess: what makes a religion a religion?"
    prompt: |
      Guessing is the point; no background is needed. Suppose someone says: "A religion is by definition belief in a creator God." Which comment seems closest to the truth?
    options:
      - text: "Many scholars find that definition too narrow, since some traditions have rituals, texts and a path of life without a creator at the centre."
        correct: true
        feedback: |
          This is the intuition behind the lesson. Definitions of "religion" are contested, and a definition built around one family of religions (belief in a creator) may leave others out. Buddhism is the classic test case.
      - text: "It is correct, because without a creator there is nothing to believe in."
        feedback: |
          That treats one possible answer as the only one. People can build a life around practices, a teaching and a community while holding no creator belief, and the lesson asks whether Buddhism is such a case.
      - text: "It is wrong, because every religion has exactly one god."
        feedback: |
          Many religions have several gods and some have none at the centre. The claim that every religion has one god is a different mistake from the one in the definition.
    explanation: |
      The lesson does not decide whether Buddhism "counts". It asks what Buddhists and the texts actually say about God, gods and rebirth, and then how the answer changes with the definition.

  - type: text
    id: silence
    title: "The Buddha's silence"
    body: |
      A famous Pali discourse, the *Culamalunkya Sutta* (Majjhima Nikaya 63, or MN 63), tells of a monk named Malunkyaputta. He is annoyed that the Buddha has never answered a list of big questions: is the cosmos eternal or not, finite or infinite, are the soul and the body the same or different, and after death does a Tathagata (a buddha, "one who has thus gone") exist, not exist, both or neither. He tells the Buddha that if there is no answer he will give up the training and return to lay life.

      According to the text, the Buddha replies with a parable, told here in essence. A man is struck by a poisoned arrow, and his friends fetch a surgeon. The man says he will not let the arrow be taken out until he knows who shot it, what the bow was made of and what kind of arrow it was. He would die before learning any of it. In the same way, the Buddha says, he has left these questions *undeclared* because they are, in Thanissaro Bhikkhu's translation, "not connected with the goal, are not fundamental to the holy life". What he did declare, he says, is suffering, its origin, its cessation and the path to that cessation, the four noble truths of the lesson on the Buddha.

  - type: order
    id: arrow-order
    title: "The parable in order"
    prompt: |
      Put the parable of the poisoned arrow, as retold in essence, in order.
    steps:
      - "A man is struck by a poisoned arrow and his friends bring a surgeon."
      - "He refuses treatment until he learns who shot him, with what bow and what arrow."
      - "He dies before the answers could be found."
      - "The Buddha concludes that he left such questions undeclared because they do not serve the goal of the path."
    hint: "The structure is: the wound, the refusal, the cost, the moral."
    explanation: |
      The moral is a claim about priorities. The poison is suffering, the surgeon is the path, and speculation about the archer is the delay.

  - type: mcq
    id: silence-q
    title: "Why does he stay silent?"
    prompt: |
      A student says: "The Buddha was silent on whether the cosmos is eternal, so he must have been an atheist who knew there was nothing out there." According to the discourse, what is the best reply?
    options:
      - text: "The text gives a practical reason: these questions do not lead to the end of suffering, so answering them would not help the path."
        correct: true
        feedback: |
          Yes. The stated reason is relevance to the goal. A scholar may still ask what the silence implies, but the text itself does not say "there is nothing out there".
      - text: "He did not know the answers, so he stayed silent out of ignorance."
        feedback: |
          The text does not say he lacked answers. It says the answers would not help, which is a different claim. Some modern readers think he was agnostic, but the sutta itself gives a reason of priority.
      - text: "He was an atheist who denied every god and every after-life."
        feedback: |
          Silence is not denial. The same texts speak of devas and of rebirth, as the next cards show, so reading the silence as atheism misreads both.
    explanation: |
      Declining to answer is a third option, between yes and no. The text's own reason is the goal of the path; whether the Buddha also held private views is a question the texts leave open.

  - type: text
    id: devas
    title: "Gods inside the cosmos"
    body: |
      Yet the Pali texts and the traditions that follow them are full of gods. The word is *deva* (Sanskrit and Pali), "heavenly being". According to Buddhist cosmology, the devas live in several heavens above the human world. They are long-lived, with lives far longer than ours, and powerful. They are not immortal: like all beings still in *samsara*, the cycle of rebirth, they die and are reborn somewhere else.

      One heaven, called Tavatimsa, is ruled by the deva Sakka (Sanskrit Sakra). According to the tradition, rebirth in a heaven is pleasant but is, at best, a way station, not the goal, since awakening is what ends the cycle. Two traditional facts show where the gods stand: one of the Buddha's nine traditional epithets, in Pali *sattha devamanussanam*, is "teacher of gods and humans", so the gods are among his students; and sources describing the tradition stress that none of the gods is an object of veneration like a creator.

  - type: mcq
    id: devas-q
    title: "Where do the devas stand?"
    prompt: |
      According to Buddhist cosmology, which statement best describes a deva?
    options:
      - text: "A long-lived, powerful being who is still in samsara and will eventually die and be reborn."
        correct: true
        feedback: |
          Yes. They are neither mortals like us nor eternal beings. Their long life is the point: a very long life can still end.
      - text: "An eternal being who made the world and guides it."
        feedback: |
          That describes a creator in the monotheistic sense. In the Buddhist texts the devas do not create the world and are not eternal.
      - text: "A symbol for human feelings, with no claim to exist."
        feedback: |
          Some modern Buddhists read the gods this way, but in the traditional cosmology the devas are beings who exist and are reborn, so this is a modern reading, not the tradition's account.
    explanation: |
      The devas answer a different question from the one the monotheist asks. They are inhabitants of the cosmos, not its source.

  - type: text
    id: brahma
    title: "Brahma and the creator claim"
    body: |
      The *Brahmajala Sutta* (Digha Nikaya 1, DN 1), a discourse that classifies views the Buddha considered mistaken, tells how the belief in a creator arose. According to the text, at the start of a new world-cycle a being appears alone in a heavenly palace, the one called Brahma. Lonely, he wishes for company, and other beings, passing from a higher realm, appear after him. Brahma then believes that he made them, and they believe he made them, because he was there first and they came later.

      The story shows a Buddhist critique that is more precise than a denial. The creator belief, according to the text, comes from a mistake in perspective: a being who was first in a world, with a very long life, concludes that he made everything. The scholar Analayo argues that early Buddhism does not flatly deny a creator god but explains how the notion arose, as the belief of a deluded Brahma. Other writers and Buddhists read the story simply as a rejection of the creator idea. The text itself offers the explanation, not the denial.

  - type: mcq
    id: brahma-q
    title: "What does the story of Brahma say?"
    prompt: |
      A reader summarizes the Brahmajala Sutta's story of Brahma as "the Buddha proves there is no God." According to the lesson, what is the most careful correction?
    options:
      - text: "In the story, Brahma is a being in the cosmos who mistakenly believes he is the creator; it explains the origin of the belief, and scholars debate how far it is a denial."
        correct: true
        feedback: |
          Yes. The text gives a narrative explanation of how a belief arose. Whether this amounts to a refutation or only a re-description is a question of interpretation.
      - text: "The story says Brahma is the true creator and the Buddha worships him."
        feedback: |
          The story says the opposite: Brahma is mistaken about his own role, and the Buddha is called teacher of gods, not their worshipper.
      - text: "The story proves nothing, since it is only a myth with no meaning."
        feedback: |
          A story can carry an argument. Here it offers a diagnosis of why a being might believe in his own creative power, so dismissing it as meaningless skips the point.
    explanation: |
      Note the layers: the text and its story are established; whether it is a denial or an explanation is debated; whether a creator exists is a metaphysical commitment on which the course takes no side.

  - type: mcq
    id: trap
    title: "Two slogans"
    prompt: |
      Two summaries circulate: (A) "Buddhists worship gods" and (B) "Buddhism is simply atheism". According to the lesson, how do they compare?
    options:
      - text: "Both are too simple: gods exist in the cosmology but none is a creator or the source of salvation, so neither slogan fits."
        correct: true
        feedback: |
          Yes. Buddhism accepts many gods without making them central or creators, which is why scholars speak of it as "non-theistic" more often than "atheist", though some prefer "atheist" for the creator question.
      - text: "(A) is correct because the texts are full of gods."
        feedback: |
          Gods appear, but the Buddha is their teacher and none is a creator. Presence in the cosmology is not the same as being the object of the path.
      - text: "(B) is correct because the Buddha was silent about God."
        feedback: |
          Silence on some questions is not the same as denial. The texts also contain gods, and the silence has the practical reason seen earlier.
    explanation: |
      Labels like "atheist", "non-theistic" and "agnostic" all carry assumptions about what God means. The careful answer says what the texts say and leaves the label to the definition.

  - type: text
    id: devotion
    title: "Devotion in practice"
    image:
      src: img/daibutsu.webp
      alt: "The bronze statue of the seated Amida Buddha at Kotoku-in, Kamakura, Japan, seen from the front in a temple garden"
      caption: "The Great Buddha of Kamakura, a seated bronze Amida (Amitabha) at the Jodo-sect temple Kotoku-in, about 11 metres tall without its base."
      credit: "Dandy1022, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:The_Great_Buddha_of_K%C5%8Dtoku-in_(Kamakura_Daibutsu).jpg"
    body: |
      Some Buddhist practice looks very devotional. In **Pure Land** schools, widespread in East Asia, followers recite the name of the buddha *Amitabha* (Japanese *Amida*), in Japanese the *nembutsu*, in the hope of rebirth in his Pure Land, *Sukhavati*, a realm where awakening is easier. In the Japanese school Jodo Shinshu, adherents describe the recitation as an expression of gratitude for a rebirth already assured, not as a way of earning it.

      In **Tibetan deity yoga**, a Vajrayana practice, the meditator visualizes a chosen deity (a *yidam*) and a whole world around it, and in the practice identifies with the deity. Practitioners and scholars describe this not as worship of an outside power but as a way of working on one's own mind, by loosening the habit of seeing self and world as solid.

      The question for the definition is whether this counts as belief in God. Adherents themselves say a buddha is an awakened human being or a manifestation of awakening, not a creator.

  - type: mcq
    id: devotion-q
    title: "Does reciting Amitabha's name show a creator belief?"
    prompt: |
      A visitor sees a Pure Land follower reciting the name of Amitabha and concludes: "So Buddhists do believe in a creator God." According to adherents as described in the lesson, what is the best reply?
    options:
      - text: "Amitabha is a buddha, an awakened being, not a creator; the recitation is a path to rebirth in a land where awakening is easier."
        correct: true
        feedback: |
          Yes. Devotion and creator belief are different things. A devotional practice can be addressed to an awakened being who did not create the world.
      - text: "The visitor is right, because prayer always implies a creator."
        feedback: |
          Prayer and devotion are found in many traditions and do not always imply a creator. Pure Land followers describe the object of devotion as a buddha.
      - text: "The recitation is only a meaningless habit with no belief behind it."
        feedback: |
          Adherents describe it as a serious path with texts and vows behind it. Calling it meaningless is a judgement the lesson does not make.
    explanation: |
      Here the distinction between a creator and an awakened being does the work. Devotion shows that Buddhism has religious practice beyond meditation, which matters for the definition card later.

  - type: text
    id: rebirth
    title: "Rebirth: the other doctrine that puzzles outsiders"
    body: |
      The second doctrine that surprises many outsiders is rebirth. According to the tradition, beings are reborn again and again in samsara, shaped by *karma*, intentional action: skilful actions lead to happy outcomes and unskilful ones to suffering. Rebirth is part of why the path matters: it is a way out of an otherwise unending cycle.

      But the Buddhist doctrine of no-self (*anatta*, the lesson on the self) says there is no soul, no permanent core that could move from one body to the next. So who is reborn? According to Buddhist traditions, the answer is that nothing passes over as a self; what continues is a stream of conditions, so that later events depend on earlier ones without any single thing carried across. A classical image, from the *Milindapanha* and told here in essence, is a flame passing from one lamp to another: the second flame is neither the same as the first nor wholly different from it.

  - type: mcq
    id: rebirth-q
    title: "Who is reborn?"
    prompt: |
      A student asks: "If Buddhism denies a soul, how can anyone be reborn?" According to the Buddhist traditions described, what is the best reply?
    options:
      - text: "No soul moves; a continuing stream of conditions, shaped by karma, links one life to the next, as one flame lights another."
        correct: true
        feedback: |
          Yes. The question has a hidden assumption: that rebirth needs a thing that moves. The tradition denies the assumption.
      - text: "A small permanent self leaves the body and enters a new one."
        feedback: |
          That is the soul picture of other traditions. Buddhist teaching rejects it; this is the very point where no-self differs from a soul doctrine.
      - text: "Nobody can be reborn, so the doctrine of rebirth is dropped by all Buddhists."
        feedback: |
          Many Buddhists hold rebirth firmly, and the next card shows how modern Buddhists differ. The no-self doctrine reshapes the claim; it does not remove it.
    explanation: |
      Whether this account is coherent is itself debated, which the guided proof on no-self later in this level returns to. What matters here is what the tradition says.

  - type: text
    id: modern
    title: "Modern Buddhists on rebirth"
    body: |
      Today, Buddhists disagree about rebirth, and the disagreement is a good example of the layers of this course.

      The **literal** reading holds that rebirth is real and central. According to reviewers of his work, the American scholar and former Tibetan monk **B. Alan Wallace** (author of *Mind in the Balance*, 2009) upholds the classical Tibetan teachings and argues that the mind does not arise from the brain alone but from a continuum of consciousness. His critics, such as the neurologist Steven Novella, reply that such a continuum goes beyond present evidence.

      The **naturalist** or **secular** reading holds that Buddhism can be practised without rebirth. **Stephen Batchelor** (born 1953, a former monk) argued in *Buddhism Without Beliefs* (1997) for an agnostic stance, neither affirming nor denying rebirth and karma, and in *Confession of a Buddhist Atheist* (2010) he told how his doubts about rebirth led him to a secular Buddhism. He treats the doctrine as a historical development common in the Buddha's India, and keeps what he thinks distinct in the Buddha's teaching, such as conditioned arising, mindful awareness and the four truths.

      Both sides appeal to the tradition. The first says rebirth is part of the teaching; the second says the core is what helps with suffering and rebirth is an added belief.

  - type: mcq
    id: modern-q
    title: "Two readings of rebirth"
    prompt: |
      A secular Buddhist and a Tibetan-trained Buddhist argue about rebirth. According to the lesson, what is the real disagreement?
    options:
      - text: "Whether rebirth is an essential part of the teaching (literal reading) or a historical addition that the practice can do without (secular reading)."
        correct: true
        feedback: |
          Yes. The two share much practice; they differ on what belongs to the core. The question is partly about the texts and partly about evidence, so it combines several layers.
      - text: "Whether the Buddha existed."
        feedback: |
          Both accept that a teacher lived. The disagreement is about doctrine, not about whether he existed.
      - text: "Whether meditation can reduce stress."
        feedback: |
          That is a separate empirical question, and both sides can accept it either way. The quarrel is about rebirth and what counts as the heart of Buddhism.
    explanation: |
      Layers: that these two readings exist is a fact; which one best fits the early texts is debated by scholars; whether rebirth happens is a commitment (or at most a hypothesis) that the course does not decide.

  - type: text
    id: definition
    title: "So is it a religion without God?"
    body: |
      The answer now depends on the definition. There is no single agreed definition of religion; scholars disagree. Two common choices give different results.

      Under a **god-centred definition**, a religion is belief in a god or gods. Buddhism is then a borderline case: it accepts gods but not as creators or saviours, so the answer is "partly yes, partly no", and some scholars call it non-theistic.

      Under a **practice-and-community definition**, a religion is a system of texts, practices, rituals and community about the ultimate aims of life. Buddhism, with its monasteries, ethics, devotion, rites and doctrine of liberation, fits well. Many Buddhists also say "religion" is the wrong word for their path, or that their path is a way of life, and others are happy with it.

      The lesson's method is to separate the layers. The facts about gods and texts are established; whether the word "religion" fits is a matter of definition; and whether awakening or rebirth is real is faith or metaphysics.

  - type: mcq
    id: definition-q
    title: "Does the definition decide?"
    prompt: |
      Someone argues: "Buddhism has no creator, so by definition it is not a religion." According to the lesson, which reply is fairest?
    options:
      - text: "That depends on the definition chosen; under a god-centred definition the result is borderline, under a practice-and-community definition it counts, and the facts about the texts stay the same."
        correct: true
        feedback: |
          Yes. A verbal dispute about the word hides what both sides can agree on: what the texts and traditions say.
      - text: "The claim is true, because religion is defined only by belief in a creator."
        feedback: |
          That assumes the god-centred definition as the only one, which many scholars reject because it leaves out traditions the argument has to count.
      - text: "The claim is false, because all Buddhists believe in a creator."
        feedback: |
          The texts reject a creator god and the Brahma story explains the belief as a mistake. Buddhists vary, but this is not the common view.
    explanation: |
      Moving from "does it count?" to "what does it say?" removes much of the heat. The facts do not change when the label does.

  - type: mcq
    id: layers
    title: "Which layer?"
    prompt: |
      Match each claim to the layer that best fits it. Which pairing is right?
    options:
      - text: "The Culamalunkya Sutta records the Buddha's silence (established); whether the Buddha was agnostic or only practical is debated; that rebirth actually occurs is a commitment of faith."
        correct: true
        feedback: |
          Yes. The text's content is established fact, the reading of the silence is a live scholarly debate and the truth of rebirth is a metaphysical commitment.
      - text: "That rebirth occurs is established, and the Buddha's silence is a matter of faith."
        feedback: |
          The layers are swapped. Rebirth is not established in a way that all would accept, and that the sutta records the silence is a textual fact.
      - text: "All three claims are established fact, since the texts state them."
        feedback: |
          That the texts say something is a fact; that what they say is true is another matter. Keeping them apart is the discipline of the course.
    explanation: |
      A thoughtful Buddhist, a secular Buddhist, a theist and an atheist can all accept the first layer and then part ways at the second and third, for reasons of evidence, interpretation and values.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the next lesson, *Buddhism, Meditation and the Science of Mind*, takes up a different meeting point of Buddhism and modern thought: dialogues between Buddhist teachers and scientists, research on meditation, and what such a comparison can and cannot show.
