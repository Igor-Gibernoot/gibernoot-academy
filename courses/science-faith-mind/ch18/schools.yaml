id: ch18-schools
title: "Theravada, Mahayana, Vajrayana"
kind: concept
own: |
  The setting: Buddhism after the Buddha (traditionally dated to about the fifth century BCE), which over the centuries grew into three broad branches, each shaped by its own texts and practices. Everything is taught according to each branch and to historians of Buddhism; which branch is right is left to each reader.
  - **What all three share.** The three marks (impermanence, dukkha or unsatisfactoriness, no-self), the four truths (dukkha, its origin in craving, its cessation, the path) and the {{ eightfold path }} (wisdom, ethical conduct, meditation), with the goal of nirvana, the end of craving and suffering. They differ in what they add and in how they picture the person who walks the path.
  - **Theravada** ("doctrine of the elders" in Pali). According to it, the earliest reliable record of the Buddha's teaching is the {{ Pali Canon (*Tipitaka*, "three baskets") }}: Vinaya (monastic rules), Sutta (discourses), Abhidhamma (systematic doctrine). Its central ideal is the *arhat* (Pali *arahant*, "one who deserves", often rendered "worthy one"): a person who has {{ ended craving and will not be reborn }}. It predominates in Sri Lanka, Myanmar, Thailand, Cambodia and Laos.
  - **Mahayana** ("great vehicle" in Sanskrit). Appearing in India around the first century BCE to first century CE, it accepts many further *sutras* (discourses), such as the Prajnaparamita ("perfection of wisdom") texts, and holds up the *bodhisattva* as the ideal: someone who, out of compassion, vows to {{ reach buddhahood so as to free all beings }}. As a schema, for the goal of the path:
    $$\begin{gathered}\text{arhat: own liberation} \\ \text{bodhisattva: buddhahood for all beings}\end{gathered}$$
    It predominates in East Asia (China, Korea, Japan, Vietnam); Nagarjuna's emptiness is one of its philosophical pillars.
  - **Vajrayana** ("diamond vehicle"). A *tantric* branch inside Mahayana, with texts called *tantras* and practices such as *mantras* (sacred sounds), *mandalas* (symbolic diagrams), visualising oneself as an enlightened being, and initiation by a teacher (*guru*). According to it, these methods are a {{ faster route to buddhahood }}. It took root in Tibet and spread to Mongolia and Bhutan.
  - **Are the Mahayana sutras the Buddha's word?** According to Mahayana, yes, in a sense its defenders explain in several ways. According to Theravada, no. Historians generally conclude that these sutras began to appear between the first century BCE and the first century CE, so they are not the literal words of the historical Buddha, while not denying their religious authority for those who follow them.
  - **Three layers.** Established: the texts, regions and approximate dates above. Debated: how the schools relate, and which texts go back to the Buddha. Faith: that the bodhisattva path, or the tantric methods, truly lead to awakening.

cards:
  - type: mcq
    id: hook
    title: "Guess: why does one teacher have many branches?"
    prompt: |
      Guessing is the point; no background is needed. Buddhism began with one teacher, the Buddha, in northern India. Today there are very different Buddhist traditions: monks with shaved heads and a daily alms round in Sri Lanka, great Chinese and Japanese temples, and Tibetan lamas who use ritual diagrams. Which cause do you think counts most for a teaching splitting into branches like this?
    options:
      - text: "Time and distance: the teaching travelled over many centuries and many cultures, and each place kept some texts, added others and stressed different questions."
        correct: true
        feedback: |
          This is the main reason historians give, and the lesson follows it. Historians add that some splits also came from disputes over monastic rules and over which texts to trust.
      - text: "A single dishonest person invented new versions to gain power."
        feedback: |
          Such stories exist in many religions, but historians of Buddhism describe a slow process with many communities and many authors, not one inventor. A good answer should explain the variety of branches across a whole continent and a thousand years.
      - text: "The teaching was so unclear that every reader had to invent a new one."
        feedback: |
          The shared core is quite stable: all branches keep the four truths and the eightfold path. The branches differ mostly in what they add and which ideal they stress, as the next cards show.
    explanation: |
      The lesson asks three questions about each branch: which texts does it trust, what is the ideal person, and what is the goal? It teaches each branch according to its own followers and then according to historians, and keeps the two visible.

  - type: text
    id: shared
    title: "What all branches share"
    body: |
      Before the differences, the common ground, recalled from earlier lessons. The **three marks** say that everything conditioned is impermanent, that clinging to it brings *dukkha* (unsatisfactoriness, suffering) and that nothing in experience is a permanent self (*anatta*). The **four truths** say that there is dukkha, that it arises from craving, that it can end, and that there is a path to its end. The **eightfold path** groups the path into wisdom, ethical conduct and meditation. Its goal is **nirvana** (Pali *nibbana*): the end of craving, and with it of the cycle of rebirth.

      The three branches this lesson meets all accept these, so it is a mistake to think of them as three religions with nothing in common. Where they differ is in the texts they trust, in the ideal they hold up, and in the methods they add.

  - type: mcq
    id: shared-q
    title: "A teaching held by every branch"
    prompt: |
      Which of these would a Theravada, a Mahayana and a Vajrayana follower all accept as a basic teaching?
    options:
      - text: "Craving gives rise to dukkha, and the eightfold path leads to its end."
        correct: true
        feedback: |
          Yes. This is the second and fourth truth, held by all the branches.
      - text: "Only the Pali Canon is the Buddha's word."
        feedback: |
          Only the Theravada tradition holds this. Mahayana and Vajrayana accept further texts as authoritative.
      - text: "Initiation by a teacher is required to practise."
        feedback: |
          This belongs to Vajrayana practice. Theravada and most Mahayana practice do not require tantric initiation.
    explanation: |
      The shared core is the starting point. The rest of the lesson asks what each branch builds on it.

  - type: text
    id: theravada
    title: "Theravada: the doctrine of the elders"
    image:
      src: img/shwedagon.webp
      alt: "The golden stupa of the Shwedagon Pagoda in Yangon, Myanmar, rising among smaller shrines under a blue sky"
      caption: "The Shwedagon Pagoda in Yangon, Myanmar, a major Buddhist shrine in a country where Theravada is the leading tradition."
      credit: "kallerna, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Shwedagon_Zedi_Daw_Yangon_4.jpg"
    body: |
      *Theravada* is Pali for "doctrine of the elders" (*thera* means elder). Followers trace their line to early Buddhist communities, and hold that the Buddha's teaching is best preserved in the **Pali Canon**, the *Tipitaka* ("three baskets"): the *Vinaya* (rules for monks and nuns), the *Suttas* (discourses, such as the ones on the four truths and on no-self met in earlier lessons) and the *Abhidhamma* (systematic analysis of experience).

      According to the Sri Lankan chronicles, the monk Mahinda, a son of the emperor Ashoka, brought Buddhism to the island in the third century BCE. The Pali texts were passed on by recitation and, according to the chronicles, written down in Sri Lanka in the first century BCE (sources differ on the exact year, and on the place). Today Theravada predominates in Sri Lanka, Myanmar, Cambodia, Thailand and Laos. Its central ideal is the **arhat** (Pali *arahant*, "one who deserves", often rendered "worthy one"): a person who has ended craving and will not be reborn. The Buddha, according to Theravada, was the first of the arahants and declared himself one.

      Other Buddhists have sometimes called this tradition *Hinayana*, "inferior vehicle". That label is a pejorative, and Theravada followers do not use it.

  - type: mcq
    id: theravada-q
    title: "Which basket?"
    prompt: |
      In the Pali Canon, the *Tipitaka* or "three baskets", a collection of the Buddha's discourses, such as the talk on the four truths, belongs to which basket?
    options:
      - text: "The *Sutta Pitaka*, the basket of discourses."
        correct: true
        feedback: |
          Yes. *Sutta* is the Pali form of the Sanskrit *sutra*, a discourse.
      - text: "The *Vinaya Pitaka*, the basket of rules."
        feedback: |
          The Vinaya holds the rules of monastic life. It also has stories of how each rule arose, but the discourses on doctrine are in the Suttas.
      - text: "The *Abhidhamma Pitaka*, the basket of systematic doctrine."
        feedback: |
          The Abhidhamma analyses experience in a systematic, list-like way. The Buddha's own talks, as the tradition records them, are in the Suttas.
    explanation: |
      Three baskets: rules (Vinaya), discourses (Sutta), analysis (Abhidhamma). The Pali Canon is the text collection that Theravada treats as authoritative.

  - type: text
    id: mahayana
    title: "Mahayana: the great vehicle"
    body: |
      *Mahayana* is Sanskrit for "great vehicle". Historians place its rise in India from about the first century BCE to the first century CE; it stayed a small movement for centuries and grew strongly from about the fifth century. It spread north and east to China, Korea, Japan and Vietnam, and it is the largest branch today.

      Mahayana followers accept the early discourses and add many more *sutras*, such as the Prajnaparamita ("perfection of wisdom") texts, the Lotus Sutra and others, which Theravada does not accept as the Buddha's word. Its central ideal is the **bodhisattva** (Sanskrit, "awakening being"): someone who generates *bodhicitta*, the compassionate wish to reach full buddhahood for the sake of all beings, takes vows, and practises the six perfections (generosity, ethics, patience, energy, meditation and wisdom), with wisdom as the guide. The Prajnaparamita sutras teach emptiness, which the previous lesson met through Nagarjuna.

      Some Mahayana texts rank the arhat's liberation below buddhahood and present the arhat's path as aimed at one's own freedom. Theravada followers reply that the arahant has fully ended craving and suffering, and that the Buddha taught this path with compassion.

  - type: mcq
    id: trap-replaced
    title: "Trap: Mahayana replaced Buddhism"
    prompt: |
      A student says: "Mahayana is a different religion that replaced the Buddha's original Buddhism." What is the best reply?
    options:
      - text: "Mahayana accepts the early teachings (the marks, the four truths, the eightfold path) and adds sutras and an ideal, and Theravada continues alongside it, so the picture is of branches, not of a replacement."
        correct: true
        feedback: |
          Yes. This also fits how historians describe it: Mahayana was small for centuries, and different schools lived side by side in the same monasteries in India.
      - text: "That is right, because Mahayana is the only branch that still exists."
        feedback: |
          Theravada is alive and predominates in Sri Lanka and much of Southeast Asia, so the premise fails.
      - text: "That is right, because Mahayana followers reject all the early discourses."
        feedback: |
          Mahayana followers accept the early discourses and add more. What they dispute is whether the arhat's goal is the highest one.
    explanation: |
      "Replacement" pictures a single line and a break. The record shows a tree: shared roots, several branches, and long periods when they coexisted.

  - type: text
    id: vajrayana
    title: "Vajrayana: the diamond vehicle"
    image:
      src: img/sand-mandala.webp
      alt: "Tibetan Buddhist monks bent over a flat sand mandala, a circular pattern of coloured sand with many small details"
      caption: "Monks building a sand mandala, a symbolic diagram made of coloured sand that, in the Tibetan tradition, is traditionally destroyed once it is finished."
      credit: "Karan, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Buddhist_Monks_performing_traditional_Sand_mandala_made_from_coloured_sand.jpg"
    body: |
      *Vajrayana* is Sanskrit for "diamond (or thunderbolt) vehicle": the *vajra* stands for something indestructible. It is a **tantric** branch inside Mahayana: it keeps the bodhisattva path and adds *tantras*, texts of esoteric practice (taught within a lineage, not to everyone). Its methods include *mantras* (sacred sounds), *mandalas* (symbolic diagrams, like the one in the picture), visualising oneself as an enlightened being, and initiation by a teacher (*guru* in Sanskrit, *lama* in Tibetan).

      According to Vajrayana tradition, the Buddha taught the tantras to chosen disciples, and they passed down in unbroken lineages; the tantric methods are said to be a faster route to buddhahood. Historians date the rise of Buddhist tantra to India roughly between the fifth and seventh centuries CE, and say that the dating of individual tantras is hard. Buddhism reached Tibet from the seventh century, and under king Trisong Detsen (reigned from 755 until 797 or a few years later, sources differ) it was firmly established, with teachers from India such as Padmasambhava and Shantarakshita. Vajrayana also took root in Mongolia and Bhutan.

  - type: mcq
    id: vajra-q
    title: "A tantric practice, or not?"
    prompt: |
      Which of these is described, according to Vajrayana tradition, as a tantric method?
    options:
      - text: "Repeating a *mantra* while visualising oneself as an enlightened being."
        correct: true
        feedback: |
          Yes. Mantra and visualisation are typical tantric practices, usually learned from a teacher after initiation.
      - text: "Reciting the discourses of the Pali Canon in the original language."
        feedback: |
          Chanting suttas is a common practice in Theravada countries. It is not what the word tantric names.
      - text: "Studying only the Vinaya rules, without any other practice."
        feedback: |
          The Vinaya is monastic discipline, held in all three branches, including in Tibet. It is not tantra.
    explanation: |
      Tantra adds methods (mantra, mandala, visualisation, initiation). According to its followers, it adds no new goal: it is a faster way to the bodhisattva goal.

  - type: mcq
    id: ideals
    title: "Person and goal"
    prompt: |
      According to Mahayana teaching, what most clearly separates a bodhisattva from an arhat?
    options:
      - text: "The bodhisattva aims at full buddhahood, for the sake of all beings, rather than only one's own liberation."
        correct: true
        feedback: |
          Yes. This is how Mahayana sources describe the difference. Theravada replies that the arahant's liberation is complete and that the path is itself taught with compassion.
      - text: "The bodhisattva rejects the four truths."
        feedback: |
          Every branch accepts the four truths. The difference lies in the goal and in the ideal person.
      - text: "The bodhisattva has no self, while the arhat has one."
        feedback: |
          Both teach no-self, from the three marks on. Mahayana adds a stress on the emptiness of everything, but arhats are not said to have a permanent self.
    explanation: |
      Think of it as two pictures of the ideal person: the one who has become free, and the one who has vowed to bring everyone to freedom. Each branch has its reasons for its picture.

  - type: order
    id: bodhisattva-path
    title: "The bodhisattva path, in order"
    prompt: |
      According to Mahayana, put these stages of the bodhisattva path in the order a person goes through them.
    steps:
      - "Generate bodhicitta, the wish to reach buddhahood for the sake of all beings"
      - "Take bodhisattva vows to carry that wish out"
      - "Practise the six perfections, guided by wisdom"
      - "Reach full buddhahood"
    hint: "A wish comes before a vow, and a vow before the practice."
    explanation: |
      The path starts with the wish (*bodhicitta*), which Mahayana calls the first step, then the vow, then the training in the six perfections, and ends in buddhahood. Vajrayana keeps this path and adds tantric methods to it.

  - type: text
    id: debate
    title: "Are the Mahayana sutras the Buddha's word?"
    body: |
      This is the sharpest dispute between the branches. The Pali Canon is old, and Mahayana sutras such as the Prajnaparamita and Lotus texts seem to appear centuries after the Buddha's death. So who spoke them?

      **According to Mahayana followers**, they are *buddhavacana*, "the word of the Buddha", in a sense that its defenders explain in several ways: some say the Buddha taught them to advanced disciples or kept them hidden until people were ready; others say the test is whether a teaching agrees with the truth and leads to awakening, and not who spoke it. **According to Theravada**, they are not the Buddha's word; commentaries from the Mahavihara monastery in Sri Lanka treated some such texts as counterfeit. **According to historians**, the sutras began to appear from about the first century BCE to first century CE and many were composed or revised over the following centuries, so they are not the literal words of the historical Buddha. Historians add that this does not settle their worth for those who follow them.

  - type: mcq
    id: debate-q
    title: "Which layer is each claim?"
    prompt: |
      Three claims: (A) "Mahayana sutras began to appear in India between the first century BCE and the first century CE." (B) "The Buddha himself spoke the Mahayana sutras." (C) "Historians generally do not take the Mahayana sutras to be the literal words of the historical Buddha." Which labelling is right?
    options:
      - text: "A is established history from texts and dating; B is a faith claim of Mahayana tradition; C is scholarly consensus."
        correct: true
        feedback: |
          Yes. Keeping the layers apart lets you ask what each claim rests on: manuscripts and translations for A, tradition for B, a balance of evidence for C.
      - text: "A, B and C are all established facts."
        feedback: |
          B cannot be checked by history: it is a claim about what the Buddha said, and historians do not accept it as literally so. It is a faith claim.
      - text: "A is a faith claim, B is established fact, C is a faith claim."
        feedback: |
          This reverses the layers. The date range in A comes from texts and early Chinese translations; B is held by Mahayana followers by tradition.
    explanation: |
      A fair presentation gives the claim, its source and its layer: Mahayana says B, historians say C, and both can describe A in the same way.

  - type: mcq
    id: defender
    title: "A Mahayana reply"
    prompt: |
      A critic says: "These sutras were written centuries after the Buddha, so they cannot be his teaching." According to the Mahayana defenders described above, which of these is a reply they give?
    options:
      - text: "What makes a teaching the Buddha's word is that it agrees with the truth and leads to awakening, not that a historian can date its first speaker."
        correct: true
        feedback: |
          Yes. This is one of the replies defenders give, and it shifts the test from history to what the teaching does. A critic may answer that this makes the test unfalsifiable by history, which is the next point of debate.
      - text: "The sutras were certainly written in the Buddha's lifetime, as any historian will confirm."
        feedback: |
          Historians do not confirm this. The reply defenders actually give is not to deny the late dates but to argue about what makes a teaching authoritative.
      - text: "Nothing a person says after their death can be a teaching."
        feedback: |
          This is not a reply anyone in the debate gives. The question is whether the teaching is the Buddha's own, in a spoken or in a deeper sense.
    explanation: |
      Notice the structure: the critic asks a historical question, the defender gives a religious test. Both are coherent; they are not the same question.

  - type: numeric
    id: dates
    title: "How long after the Buddha?"
    prompt: |
      Take the Buddha as living around 450 BCE (the date is debated, but this is a round figure in the fifth century BCE). The earliest firmly dated Mahayana sutra translations were made into Chinese by the monk Lokaksema before 186 CE; take 170 CE. About how many years separate the two, counting from 450 BCE to 170 CE?
    answer: 620
    tolerance: 0.02
    hint: "Add the years before the year 1 to the years after it."
    wrong:
      - { value: 280, feedback: "This subtracts instead of adding. A date in BCE counts backwards from year 1, so the gap is the sum of 450 and 170." }
    explanation: |
      $450 + 170 = 620$ years (ignoring the missing year zero), roughly six centuries. This is the gap historians point to: the earliest *dated* Mahayana texts are about six centuries after the Buddha, which is why the question of their authorship arises.

  - type: text
    id: compare
    title: "The three branches side by side"
    body: |
      A summary of what each branch holds, according to its own followers.

      | Branch | Texts it trusts | Ideal and goal |
      |---|---|---|
      | Theravada | Pali Canon | The arhat: own liberation |
      | Mahayana | Early discourses plus further sutras | The bodhisattva: buddhahood for all |
      | Vajrayana | Mahayana texts plus tantras | The bodhisattva, by tantric methods |

  - type: mcq
    id: match
    title: "Match the branch"
    prompt: |
      A teacher says: "I trust the Pali Canon as the Buddha's word, and my aim is to become an arahant." Which branch does this describe, according to the table?
    options:
      - text: "Theravada."
        correct: true
        feedback: |
          Yes: Pali Canon and the arahant ideal are the Theravada pair.
      - text: "Mahayana."
        feedback: |
          Mahayana adds further sutras and holds the bodhisattva as the ideal.
      - text: "Vajrayana."
        feedback: |
          Vajrayana follows the bodhisattva path with tantric methods and adds the tantras to the texts.
    explanation: |
      Texts and ideal tell the branches apart, while the four truths and eightfold path are shared.

  - type: mcq
    id: layers
    title: "Where thoughtful people part ways"
    prompt: |
      Two scholars agree on every date in this lesson. One is a Theravada monk, the other a Mahayana teacher, and they still disagree on whether the Mahayana sutras are the Buddha's word. What explains it best?
    options:
      - text: "They differ on a premise that dates cannot settle: what makes a teaching authoritative, the person who first spoke it, or whether it leads to awakening."
        correct: true
        feedback: |
          Yes. They share the facts and disagree on a criterion of authority, a matter of value and faith, not data.
      - text: "One of them has misread the manuscripts."
        feedback: |
          They are not disagreeing about readings. The same manuscripts and dates are before both of them.
      - text: "They disagree on the date of the Buddha."
        feedback: |
          They could, but the question says they agree on every date. What remains is a different criterion of authority.
    explanation: |
      This is the pattern of the whole course: same evidence, different premises about what counts. A fair reader can see why each is moved.

  - type: text
    id: summary
    body: |
      **Next:** Zen, a Mahayana school from East Asia that questions what words and concepts can do, and what a person can know through direct experience.
