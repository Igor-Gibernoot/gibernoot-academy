id: ch18-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: Buddhism, Mind and Self"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: the four truths, *dukkha* and nirvana, no-self, rebirth, dependent origination, emptiness, the three great schools, Zen, the place of gods, and the meeting with the science of mind. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone, and the feedback keeps the course's three layers apart: **established fact** (texts, dates, numbers), **scholarly debate** (say which), and **faith commitment** (what a tradition holds). *Pali* is the old Indian language of the earliest complete Buddhist collection; $c.$ means about; years are CE unless marked BCE.

  - type: mcq
    id: trap-pessimism
    title: "Life is suffering?"
    prompt: |
      A student says: "The Buddha's first truth is that life is suffering, so Buddhism is a gloomy, pessimistic religion." Which reply is best?
    options:
      - text: "The Pali word *dukkha* is wider than pain. According to scholars it covers three kinds: pain itself, the unsatisfactoriness of change (pleasure ends), and the unsatisfactoriness of conditioned things that cannot be held fixed. The teaching is also set out like a physician's reasoning: illness, cause, cure, treatment. The cure is the point."
        correct: true
        feedback: |
          Yes. 'Suffering' is a one-word translation that loses the range of the term, and the other three truths speak of an end to it.
      - text: "Dukkha means only physical pain, so the first truth is a small remark about illness."
        feedback: |
          Pain is one of the three kinds, but the term also names the unsatisfactoriness of pleasant things that end and of everything that depends on conditions.
      - text: "The first truth is false because many moments of life are pleasant."
        feedback: |
          The teaching does not deny pleasant moments; it says they are changing and cannot be held, which is the second kind of dukkha.
    explanation: |
      Layers: the text of the first sermon and the three kinds are established; how well 'suffering' translates dukkha is a matter of scholars' preference; that the diagnosis is correct is a commitment.

  - type: mcq
    id: trap-nirvana
    title: "Nirvana is heaven or annihilation?"
    prompt: |
      A student asks: "Is nirvana a heavenly place where the good are rewarded, or is it simply the death of the self into nothing?" Which reply is best?
    options:
      - text: "According to the texts, *nirvana* (Pali *nibbana*) literally means 'blowing out', as of a flame, and names the ending of craving (and with it of the cycle of rebirth). It is neither a reward-place nor, in the tradition's own words, a nothing: schools and scholars differ on whether it is only the extinguishing of craving or also a state beyond the conditioned world."
        correct: true
        feedback: |
          Yes. Both shortcuts take a picture (a place, or a void) for the thing. What the sources agree on is the end of craving and of the suffering that goes with it.
      - text: "Nirvana is the highest of the heavens, where the Buddha rules the gods."
        feedback: |
          In Buddhist cosmology the heavens are homes of long-lived gods who are themselves still in the cycle of rebirth, and the Buddha is called their teacher, not their ruler. Nirvana lies outside that cycle.
      - text: "Nirvana is the soul's reunion with a creator."
        feedback: |
          That is the shape of some other traditions' hopes. The Buddhist teaching has no creator to unite with and no soul that unites.
    explanation: |
      Layers: the word's literal meaning and the texts' wording are established; the nature of nirvana is argued between schools; that it can be reached is a commitment.

  - type: numeric
    id: trap-dates
    title: "When did the Buddha die?"
    prompt: |
      A quiz asks for 'the Buddha's death date'. The older chronology put his death at about 483 BCE, while the Stanford Encyclopedia of Philosophy notes that many scholars now hold that he died around 405 BCE. By how many years do these two dates differ?
    answer: 78
    tolerance: 0.5
    answerText: '78'
    wrong:
      - { value: 888, feedback: 'That adds the two dates. Both are years counted back from the same point, so you subtract to find the gap.' }
    hint: |
      Both dates are BCE: subtract the smaller from the larger.
    explanation: |
      $483 - 405 = 78$ years. The gap is large enough that the same sermon could have been preached in different centuries by different chronologies, so 'the' date is a trap: the honest statement is 'about the fifth century BCE, with the exact years debated'.

  - type: mcq
    id: trap-silence
    title: "Silence means no?"
    prompt: |
      In one Pali discourse, a monk named Malunkyaputta demands answers to questions such as whether the cosmos is eternal and whether the Tathagata (the Buddha) exists after death, and threatens to leave if none comes. The Buddha declines and says such questions are not connected with the goal. A student concludes: "So the Buddha denied that any of it is true." Which reply is best?
    options:
      - text: "Declining to answer is not denying. According to the discourse, the Buddha's reason is practical: what he declares is the four truths, because they bear on ending dukkha. Scholars read the silence differently (a refusal of badly framed questions, or a priority of practice over speculation), but all agree that the text does not say 'no'."
        correct: true
        feedback: |
          Yes. The comparison in the text is of a man shot with an arrow who will not let it be removed until he learns who shot it.
      - text: "The Buddha was ignorant of the answers and hid it."
        feedback: |
          The text gives a reason about relevance, not about ignorance. Reading hidden ignorance into it is adding a motive the discourse does not state.
      - text: "The Buddha answered yes to every one of them in private."
        feedback: |
          Nothing in the discourse says so. A silence read as a yes is as unsupported as a silence read as a no.
    explanation: |
      Layers: the discourse and the list of undeclared questions are established; the interpretation of the silence is debated; and which questions matter most is a value choice.

  - type: mcq
    id: trap-noself
    title: "No self means you do not exist?"
    prompt: |
      A student reads that Buddhism teaches *anatta*, 'not-self', and concludes: "So according to Buddhism, you do not exist." Which reply is best?
    options:
      - text: "The texts speak of persons all the time. What the teaching denies is a lasting owner or self behind the five aggregates (body, feeling, perception, volitions, consciousness), each of which changes. Calling someone 'you' is a useful way of naming a changing set of parts in relation, as 'chariot' names pole, axle and wheels assembled. That is a conventional truth, not a falsehood."
        correct: true
        feedback: |
          Yes. 'No self' is not 'no person'. The claim removed is a permanent, unchanging core, not the person who walks and talks.
      - text: "It says you are an illusion, so nothing is happening at all."
        feedback: |
          Aggregates are described as real, changing processes, and suffering is taken to be real. The point concerns what they add up to, not whether anything occurs.
      - text: "It says you are your body, and nothing else."
        feedback: |
          The body (form) is only one of the five aggregates, and the texts argue that it too is not fit to be called 'my self'.
    explanation: |
      Layers: that the texts list five aggregates and argue no one of them is the self is established; whether early Buddhism denies any self at all or only that the aggregates are the self is debated; that seeing this frees one from dukkha is a commitment.

  - type: mcq
    id: trap-argument
    title: "A step that does not follow"
    prompt: |
      The discourse on not-self goes through each aggregate in turn and finds it impermanent and unsatisfactory, hence not fit to be called 'my self'. A critic says: "Even if none of the five is the self, the self could still be the whole bundle, or something else." What is the best account of this reply?
    options:
      - text: "It is a fair objection to the final step, not to the premises: it asks for a further premise ruling out the whole and the extra thing. The chariot argument supplies one by checking each possibility (a part, all the parts, something apart) and saying that none is found, which is where debate about whether the options are exhaustive begins."
        correct: true
        feedback: |
          Yes. Separating validity (does C follow?) from truth of premises (are they right?) is the habit this course keeps.
      - text: "It refutes the discourse completely, so nothing in it can be kept."
        feedback: |
          The objection shows a gap that needs filling; it does not show the premises false. Defenders have tried to fill it.
      - text: "It is not an objection at all, since the discourse never mentions the whole."
        feedback: |
          The objection is exactly about what the five-by-five argument leaves unsaid, which is why the later chariot argument was built.
    explanation: |
      Layers: the structure of the argument is established; whether the gap is closed is debated (a reductionist reading says the whole is only a name; an emergentist reading says it is a real pattern); which reading is better is a philosophical commitment.

  - type: mcq
    id: trap-parfit
    title: "Parfit proved the Buddha right?"
    prompt: |
      Derek Parfit (1942-2017), in *Reasons and Persons* (1984), argued for reductionism about persons: a person's existence consists in a body, a brain and a series of connected mental events, and what matters is connectedness and continuity, not strict identity. A student says: "So Western philosophy has proved the Buddha right." Which reply is best?
    options:
      - text: "The two views resemble each other, and scholars do compare them, but a resemblance is not a proof. Parfit gave arguments from thought experiments about duplication and gradual change, and others dispute how far his claim that the Buddha would have agreed is fair: the texts come with a path of practice and with rebirth, which Parfit's argument does not contain."
        correct: true
        feedback: |
          Yes. Shared conclusions about the self are noteworthy; the Buddhist teaching also includes claims (rebirth, release) that Parfit's book does not argue for.
      - text: "Parfit was a Buddhist monk who took his views from the discourses."
        feedback: |
          Parfit was a British philosopher at Oxford. Any link to Buddhism was a later comparison, discussed by scholars, not his source.
      - text: "Parfit's view is the opposite: he says the self is a permanent soul."
        feedback: |
          He argues the reverse: that there is no further fact beyond body, brain and events.
    explanation: |
      Layers: what each says is established; how close they are is debated; which of them is right about the self is a philosophical commitment.

  - type: mcq
    id: trap-rebirth
    title: "The same soul moves on?"
    prompt: |
      A student says: "Buddhists believe that when you die, your soul moves into a new body. But Buddhism denies a soul, so it contradicts itself." Which reply is best?
    options:
      - text: "According to the Buddhist reply, nothing passes from life to life: later events depend causally on earlier ones, as one flame lit from another is neither the same flame nor wholly different from it. Whether this stream of conditions is a coherent account of rebirth is debated, and that rebirth occurs at all is a faith commitment (a sceptic will say it is untested)."
        correct: true
        feedback: |
          Yes. The reply can be criticised, but the contradiction charge depends on a soul-carrying picture that the tradition does not hold.
      - text: "The soul is destroyed at death, so there is no rebirth in Buddhism."
        feedback: |
          Most Buddhist traditions teach rebirth, but of a stream of conditions, not a soul. The picture 'soul dies' also assumes a soul to die.
      - text: "Rebirth is established by the texts' dates, so it is a historical fact."
        feedback: |
          That the texts teach rebirth is established; that it happens is a commitment, and no date can show it.
    explanation: |
      Layers: the teaching and the flame image are established (the Milindapanha dialogue gives the image; the wording is paraphrased); the coherence is debated; that rebirth is real is a commitment.

  - type: mcq
    id: trap-first-cause
    title: "Ignorance as the first cause?"
    prompt: |
      The best-known list of dependent origination has twelve links, beginning with ignorance and ending with ageing and death. A student says: "So ignorance is the first cause of everything, like a creator." Which reply is best?
    options:
      - text: "Ignorance is the first *link* of that list, and in the discourse it means not knowing the four truths. According to scholars, it is the most necessary condition of that list, not a first cause of the universe. Some early discourses give shorter lists without it, and the discourse formula is 'when this is, that is', a statement of dependence, not of a creation."
        correct: true
        feedback: |
          Yes. Dependent origination is meant to explain how suffering keeps going, and the cycle is described as having no discoverable beginning.
      - text: "Ignorance is the only cause of anything, and every other link is an illusion."
        feedback: |
          The links are real conditions on each other: craving depends on feeling and leads to clinging. None is called an illusion.
      - text: "Ignorance was created by the Buddha's enemy Mara."
        feedback: |
          Mara is a tempter figure in the stories, not the source of ignorance in the chain.
    explanation: |
      Layers: the twelve-link list and the shorter lists exist in the texts; how to read the first link is debated; that ending ignorance ends dukkha is a commitment.

  - type: numeric
    id: trap-cut
    title: "Cut a link"
    prompt: |
      The twelve links in order are: ignorance, formations, consciousness, name-and-form, six sense bases, contact, feeling, craving, clinging, becoming, birth, ageing-and-death. According to the teaching, removing one link stops every link after it. If craving (the eighth link) is removed, how many links after it stop?
    answer: 4
    tolerance: 0.01
    answerText: '4'
    wrong:
      - { value: 7, feedback: 'That counts the links before craving (seven). Removing a link stops those that depend on it, which come after.' }
      - { value: 5, feedback: 'That counts craving itself. The question asks only for the links after it.' }
    hint: |
      List the links after the eighth: clinging, becoming, birth, and so on.
    explanation: |
      Clinging, becoming, birth and ageing-and-death are four: $12 - 8 = 4$. Removing craving does not undo feeling, contact or the earlier links; it stops what depends on craving. This is why the teaching treats craving as the place to cut.

  - type: mcq
    id: trap-linear
    title: "A straight line of causes?"
    prompt: |
      A student says: "Dependent origination is just a chain of simple cause-and-effect in three lives: past, present, future." Which reply is best?
    options:
      - text: "That is one traditional reading (Buddhaghosa, fifth century CE, spread the twelve over three lives), but a modern scholar such as Dhivan Thomas Jones argues it is a later development and the list can be read as a process in the mind in one moment. The wheel of life paints the links as a circle, since the end of one round feeds the next. The texts' own formula speaks of conditions, not a single sequence of causes."
        correct: true
        feedback: |
          Yes. The three-lives reading is real and old; it is one reading, not the only one.
      - text: "The three-lives reading is modern and was invented by Western scholars."
        feedback: |
          It goes back to Buddhaghosa in the fifth century CE. What modern scholars add is the argument that it is later than the early discourses.
      - text: "Every Buddhist school today reads the chain as moment by moment."
        feedback: |
          The three-lives reading remains the traditional one in many places. The point is that readings differ.
    explanation: |
      Layers: both readings exist and the wording of the list is established; which is more faithful to the earliest teaching is debated; that the chain describes reality is a commitment.

  - type: mcq
    id: trap-emptiness
    title: "Emptiness is nothingness?"
    prompt: |
      Nagarjuna (c. 150 to 250 CE) taught that all things are *empty* (*sunyata*). A student says: "So he claimed that nothing exists." Which reply is best?
    options:
      - text: "According to Nagarjuna, things are empty *of svabhava*, an independent own-nature, not empty of existence. Because they depend on causes, parts and conditions, they can change and cause one another; with svabhava, he argues, nothing could. The nihilism charge was made by his critics, and he answered that his middle way rejects both 'it exists by its own nature' and 'nothing exists'."
        correct: true
        feedback: |
          Yes. 'Empty' here is a claim about how things exist (dependently), not that nothing exists.
      - text: "He meant that the world is an illusion made by the mind alone."
        feedback: |
          That is closer to another school's thesis. Nagarjuna's argument concerns dependence and own-nature, and scholars do not read him as simply an idealist.
      - text: "He meant that only the self is real and all else is empty."
        feedback: |
          That reverses the teaching: he denies own-nature to everything, including a self.
    explanation: |
      Layers: his dates (c. 150 to 250 CE, probably southern India) and his text (the *Mulamadhyamakakarika*, 450 verses in 27 chapters) are established; how to read emptiness (nihilist, anti-realist, no thesis, paradox) is debated; that seeing emptiness frees one is a commitment.

  - type: mcq
    id: trap-selfrefute
    title: "Emptiness refutes itself?"
    prompt: |
      A critic says: "If everything is empty of own-nature, then the claim 'everything is empty' is itself empty, so it says nothing." Which reply fits what Nagarjuna's defenders say?
    options:
      - text: "They accept the first part and deny the conclusion. The claim is itself dependent (on words, a speaker, a context), so it is empty, and that is no problem, since being empty does not mean being useless or false. Nagarjuna also says emptiness must not be held as a view to cling to, and scholars read his saying that he asserts no thesis in several ways."
        correct: true
        feedback: |
          Yes. Whether the reply works is argued among scholars; it is not a mere dodge, and it is not a refutation of the objection.
      - text: "They say the claim is the one exception, an own-nature that is not empty."
        feedback: |
          That would break the doctrine. Emptiness is itself called empty (the emptiness of emptiness).
      - text: "They say the critic is right and Madhyamaka is therefore false."
        feedback: |
          Defenders do not concede. Critics may still be right; the point is what the defenders actually reply.
    explanation: |
      Layers: the objection and the replies are in the texts (the *Vigrahavyavartani*); whether they succeed is debated; which reading is best is a philosophical choice.

  - type: mcq
    id: trap-truths
    title: "Conventional truth is falsehood?"
    prompt: |
      In Nagarjuna's account there are two truths: a conventional truth and an ultimate truth. A student says: "So the conventional truth is the lie we tell ordinary people." Which reply is best?
    options:
      - text: "According to Nagarjuna, the conventional truth is the level at which tables, persons and the Buddha's teachings exist and can be talked about, and the ultimate truth is that they lack own-nature. The ultimate is taught *through* the conventional, and he says understanding it is needed for nirvana. Critics from other schools charged that this makes everything conventional, hence nothing real, and Madhyamaka replied that this misreads emptiness."
        correct: true
        feedback: |
          Yes. Conventional here is a level of description, not a falsehood.
      - text: "Conventional truth is true and ultimate truth is false."
        feedback: |
          Nagarjuna keeps the ultimate as the deeper account; he does not call it false.
      - text: "There is no difference between the two truths: they are two words for the same statement."
        feedback: |
          They differ in what they describe (things as spoken of, and things as dependent); Nagarjuna also warns against treating the ultimate as a separate realm.
    explanation: |
      Layers: the doctrine of two truths is in the text; how the two relate is debated; that the ultimate is liberating is a commitment.

  - type: mcq
    id: trap-hinayana
    title: "Mahayana replaced Theravada?"
    prompt: |
      A student says: "Theravada is the old, lesser Buddhism, 'Hinayana', and Mahayana came later and replaced it." Which reply is best?
    options:
      - text: "*Hinayana* ('lesser vehicle') is a term used in Mahayana texts and is considered derogatory, so Theravada ('doctrine of the elders') followers use their own name. Both schools exist today: Theravada in Sri Lanka, Myanmar and Southeast Asia; Mahayana in East Asia; Vajrayana, a tantric branch of Mahayana, in Tibet and Mongolia. Mahayana arose around the first century BCE to first century CE as a new emphasis (the bodhisattva ideal), and historians do not treat any of them as a replacement of another."
        correct: true
        feedback: |
          Yes. Whether Mahayana sutras are the word of the Buddha is disputed: Mahayana says yes, Theravada says no, and historians say they were composed later, which is a statement about origin, not worth.
      - text: "Mahayana was founded by the Buddha at his first sermon, and Theravada left it later."
        feedback: |
          Mahayana's own tradition holds its sutras to be the Buddha's word, but historians date them later than the first sermon, and the Pali canon is the collection Theravada keeps.
      - text: "Theravada and Mahayana teach unrelated religions with no shared teachings."
        feedback: |
          They share the four truths, no-self and dependent origination, and differ in emphasis and in extra texts.
    explanation: |
      Layers: the names, the regions and the rough dates are established; how to count the Mahayana sutras (the Buddha's word or later) is a live dispute between traditions and historians; and which path is highest is a commitment.

  - type: mcq
    id: trap-zen
    title: "Zen rejects all reason?"
    prompt: |
      A student says: "Zen burns the scriptures and says reason is useless: a koan is an unsolvable riddle designed to break your mind." Which reply is best?
    options:
      - text: "According to scholars, Chan (Zen in Japanese) did not reject scriptures; the famous slogan about a special transmission outside the teachings is first attributed to Bodhidharma in a 1108 collection, and Zen monks studied texts. A koan (Chinese *gong'an*, 'public case') is meant as a way to see directly, with a teacher expecting an appropriate response, not a meaningless riddle. A koan such as *Mu* (Joshu's answer 'no' about a dog's buddha-nature) tests an over-reliance on yes-or-no thinking. Whether Zen opposes reason or only its limits is read both ways."
        correct: true
        feedback: |
          Yes. Rinzai uses koans, and Soto stresses 'just sitting'; both are emphases within one tradition.
      - text: "Zen is the same as Pure Land Buddhism."
        feedback: |
          They differ: Pure Land stresses devotion to Amitabha (Amida), while Zen stresses seated meditation and teacher-student encounters.
      - text: "Koans are ordinary logic puzzles with a hidden numerical answer."
        feedback: |
          Koans are not solved like puzzles; the aim is seeing one's own buddha-nature (*kensho*), not a calculation.
    explanation: |
      Layers: dates and texts (Mumonkan, 1228) are established; whether Zen is anti-intellectual or a critique of concepts is debated; the value of the practice is a commitment.

  - type: mcq
    id: trap-gods
    title: "Buddhism is atheism?"
    prompt: |
      A student says: "Buddhism has no creator god, so it is simply atheism with meditation added." Which reply is best?
    options:
      - text: "According to the texts, Buddhism has no creator god, but it does speak of many *devas*, long-lived beings in the heavens who are mortal and still in the cycle of rebirth; the Buddha is called teacher of gods and humans. Pure Land schools centre on devotion to Amitabha (Amida) and Tibetan deity yoga identifies with a deity. Whether 'religion' needs a god is also debated, and a few modern writers such as Stephen Batchelor (b. 1953) give a secular reading."
        correct: true
        feedback: |
          Yes. 'No creator, no ultimate saviour in most readings' is a smaller claim than 'atheism', and the practice in many schools is devotional.
      - text: "Buddhism worships the Buddha as the creator of the universe."
        feedback: |
          Buddhists honour the Buddha as a teacher, not as the creator. The Brahma story in a Pali discourse even explains why a god might come to believe he created the world.
      - text: "All Buddhists today are atheists by their own description."
        feedback: |
          Many describe themselves otherwise; the question depends on which tradition and what is meant by god.
    explanation: |
      Layers: the texts on devas and the existence of devotional schools are established; whether Buddhism is 'a religion without God' depends on a definition (debated); that the heavens exist is a commitment.

  - type: mcq
    id: trap-notfound
    title: "Not found means refuted?"
    prompt: |
      The Dalai Lama has said, in essence (*The Universe in a Single Atom*, 2005), that if science showed a Buddhist claim to be false, the claim should be given up. A scan study finds no sign of a particular claim. A student says: "So that claim is refuted, and Buddhism has lost." Which reply is best?
    options:
      - text: "'Not found' is different from 'shown false'. A claim is refuted when well-designed tests that could have found it come out against it. Many Buddhist claims (rebirth, karma) are not of a kind a scan can test, and others (that a practice changes attention) are testable, with mixed and modest results so far."
        correct: true
        feedback: |
          Yes. The principle as paraphrased is about claims that science can in fact test; it does not say that every claim must pass a lab.
      - text: "Science can never test any Buddhist claim."
        feedback: |
          Claims about what a practice does to attention or stress are testable, and have been tested.
      - text: "Any claim that cannot be tested is thereby false."
        feedback: |
          Untestable is not false; it means science neither supports nor refutes it.
    explanation: |
      Layers: the dialogues and the studies are established; where the line between testable and untestable falls is debated; that rebirth and karma are true is a commitment.

  - type: numeric
    id: trap-gamma
    title: "Two groups, one gap"
    prompt: |
      In a 2004 study (Lutz and colleagues, *PNAS*), eight long-term Buddhist practitioners, mean age 49, were compared with ten student volunteers, mean age 21, and the practitioners showed stronger gamma-band brain activity during compassion meditation. By how many years did the group means for age differ?
    answer: 28
    tolerance: 0.5
    answerText: '28'
    wrong:
      - { value: 70, feedback: 'That adds the ages. A difference between two means is found by subtraction.' }
    hint: |
      Subtract the student mean from the practitioner mean.
    explanation: |
      $49 - 21 = 28$ years. The authors themselves say the study cannot show that the pattern is caused by training rather than by differences that were there before, and list age and culture among other differences. With only eight practitioners and a short instruction for the students, 'meditation changes the brain' is a plausible hypothesis the study supports only weakly.

  - type: mcq
    id: trap-mbsr
    title: "Mindfulness courses are Buddhism?"
    prompt: |
      A student says: "Mindfulness-based stress reduction proves Buddhism works, because mindfulness is Buddhist." Which reply is best?
    options:
      - text: "MBSR, begun by Jon Kabat-Zinn at the University of Massachusetts in 1979, is an eight-week secular program with Buddhist roots, designed for patients. A reviewer, Van Dam and colleagues (2018), warned in 'Mind the Hype' that studies are often small with weak controls. Even good results on stress and attention bear on the practice, not on Buddhist claims about rebirth or nirvana."
        correct: true
        feedback: |
          Yes. A tested effect of a practice is one thing; the metaphysics of the tradition that first taught it is another.
      - text: "MBSR is a Buddhist ordination course run by monks."
        feedback: |
          It is a secular clinical program taught to patients, not a monastic training.
      - text: "MBSR was shown in 1979 to cure disease."
        feedback: |
          1979 is the year the clinic began, not a result; benefits are modest and still being studied.
    explanation: |
      Layers: the origin, structure and critiques are established; the size of the benefit is live research; and the link to Buddhist doctrine is a commitment.

  - type: text
    id: summary
    title: "What this round tested"
    body: |
      Each trap was a shortcut one step too far, and each is corrected in one line.

      **Dukkha**: three kinds, not only 'suffering', and a teaching with a cure. **Nirvana**: 'blowing out' of craving, neither a heaven nor a void. **Dates**: about the fifth century BCE, with $483 - 405 = 78$ years between two chronologies. **Silence**: declining to answer is not denying. **Anatta**: no lasting self behind the five aggregates, not no person. **The argument**: the step from 'no aggregate is the self' needs a premise about the whole. **Parfit**: resemblance to the Buddha is not proof. **Rebirth**: a stream of conditions like a flame, not a soul, and a commitment. **Ignorance**: the first link, not a creator. **Cutting craving**: stops $12 - 8 = 4$ links. **Readings**: three lives or moment by moment. **Emptiness**: empty of own-nature, not nothing. **Self-refutation**: the claim is empty too, and defenders accept it. **Two truths**: levels, not lies. **Schools**: not replacements. **Zen**: not anti-text, koans not riddles. **Gods**: devas, devotion, a secular reading. **Not found**: not refuted. **Gamma**: an age gap of $49 - 21 = 28$ years and a design that cannot show cause. **MBSR**: secular, modest evidence.

      Where thoughtful people part ways: in whether 'no self' is a discovery or a definition, whether emptiness avoids nihilism, and whether science can reach a tradition's central claims.

      **Next:** a quick recall of the level's main distinctions (the lesson Quick Recall), then its content map, the level review and the level challenge.
