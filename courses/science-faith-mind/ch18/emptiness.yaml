id: ch18-emptiness
title: "Emptiness: Nagarjuna"
kind: concept
own: |
  The setting: the Indian Buddhist philosopher Nagarjuna (traditionally dated c. 150 to 250 CE) and his *Mulamadhyamakakarika*, a poem of about 450 verses in 27 chapters, read with the teaching of dependent origination from the Pali discourses. Everything is taught according to Nagarjuna, his commentators and modern scholars; whether he is right is left to each reader.
  - **Svabhava.** The key term is *svabhava* ("own-being", intrinsic nature): a nature a thing would have {{ on its own, independently of causes, parts and conditions }}. Some Abhidharma schools (early systematic Buddhist philosophy) held that the basic building blocks of experience have it; Nagarjuna denies that anything does.
  - **Dependence implies emptiness.** According to Nagarjuna, whatever arises from conditions lacks svabhava, because a nature that depended on conditions would not be its own. Schematically, for anything $x$:
    $$\begin{gathered} x \text{ depends on conditions} \\ \Downarrow \\ x \text{ is empty of svabhava} \end{gathered}$$
    Dependent origination and {{ emptiness (*sunyata*) }} are therefore two names for one fact. A critic can reject the first claim: an Abhidharma philosopher says some basic items do not depend on others.
  - **Emptiness is not nothingness.** To be empty is to be empty *of svabhava*, not to be non-existent:
    $$\begin{gathered}\text{empty of svabhava} \\ \neq \\ \text{non-existent}\end{gathered}$$
    Because things have no fixed nature, they can change and cause one another; Nagarjuna argues that with svabhava, {{ nothing could change, arise or be reached }}. The middle way runs between saying "it exists by its own nature" (eternalism) and "nothing exists" (nihilism).
  - **Two truths.** According to Nagarjuna, the Buddha's teaching rests on a {{ conventional truth }} (things such as tables and persons exist and can be talked about) and an ultimate truth (they are empty of svabhava). The ultimate is taught through the conventional, and understanding it is needed for nirvana.
  - **Does emptiness refute itself?** The objection: if everything is empty, the claim "everything is empty" is empty too. Replies in the *Vigrahavyavartani*: the claim is itself dependent, so empty, and that is no problem; emptiness must not be held as a {{ view to be clung to }} (the emptiness of emptiness); and Nagarjuna says he asserts no thesis, which scholars read in several ways.
  - **Three layers.** Established: the verses and the arguments as written. Debated: how to read them (nihilist, anti-realist, a middle path with no ultimate ground, even a defender of contradictions), and which tradition's reading is faithful. Faith: that seeing emptiness frees one from suffering.

cards:
  - type: mcq
    id: hook
    title: "Guess: what is a table, apart from everything it needs?"
    prompt: |
      Guessing is the point; no background is needed. A wooden table needs wood, a tree that grew, a carpenter, tools, and a person who calls this shape a "table". Take all of these away one by one. After removing every condition the table depends on, what do you most naturally expect is left of "the table itself"?
    options:
      - text: "Nothing is left: the table is just these conditions, arranged in a certain way for a certain use."
        correct: true
        feedback: |
          This is the thought the lesson follows. The Buddhist philosopher Nagarjuna built a whole philosophy on it: if a thing is nothing over and above its conditions, it has no nature of its own.
      - text: "A pure essence, tablehood, that was there under the wood and shape all along."
        feedback: |
          This is a natural first guess and an old one in philosophy. Notice what it claims: a core that stays when every condition is removed. Try to say what this core is made of, or how it differs from a core of chairhood, and the idea gets slippery.
      - text: "The question has no sense, so no answer is possible."
        feedback: |
          It has sense: we can ask what would be left, and the answer "nothing" or "an essence" are both coherent. The lesson looks at the first and asks whether it means that tables do not exist.
    explanation: |
      Two worries follow. If everything depends on conditions, does anything have a nature of its own? And if nothing does, does anything exist at all? The Indian Buddhist tradition answers the first with *emptiness* and the second with "yes, in a certain way". This lesson builds both answers and the objections to them.

  - type: text
    id: svabhava
    title: "Svabhava: a nature of one's own"
    body: |
      The Sanskrit word is *svabhava*: *sva* is "own" and *bhava* is "being", so "own-being". Translators also write "intrinsic nature", "inherent existence" or "essence". The Stanford Encyclopedia of Philosophy notes that the word covers several ideas: an *essence* (a property a thing cannot lose without ceasing to be that thing, as heat is said to be the essence of fire), a *substance* (a primary existent that ends a chain of dependence), and, more broadly, a nature a thing has independently, on its own.

      This is the thing the philosopher you are about to meet argues against. It was also something his opponents believed in. Some Abhidharma schools (the systematic Buddhist philosophy of the first centuries, such as the Sarvastivada) held that persons and tables are only conventional wholes, but that the smallest items they are built from, the *dharmas*, are ultimately real and exist independently in virtue of their own intrinsic nature. So the debate was inside Buddhism: how far does "no self" go? Does it stop at the building blocks, or does it apply to them too?

  - type: mcq
    id: svabhava-q
    title: "What would own-being be?"
    prompt: |
      In this debate, *svabhava* is a nature a thing has "on its own". Which of the following would count as something having svabhava?
    options:
      - text: "A basic item that is what it is whatever causes, parts or observers there are, and that does not depend on anything."
        correct: true
        feedback: |
          Yes. Independence from conditions is the core of the idea: own-being that needs no one else's help.
      - text: "Any ordinary object that lasts a long time, such as a mountain."
        feedback: |
          Lasting long is not independence. A mountain depends on rock, forces and time, and it wears away. It is a good example of something that has no own-being.
      - text: "Any word we use for a thing."
        feedback: |
          Words are conventions that depend on speakers and context. Nagarjuna will say the same of the things the words name.
    explanation: |
      Keep this test in mind: a nature of its own is a nature that needs no conditions. Everything that follows is an argument about whether anything passes it.

  - type: text
    id: nagarjuna
    title: "Nagarjuna and the Middle Way verses"
    image:
      src: img/nagarjuna-toji.webp
      alt: "A Japanese hanging-scroll portrait of an Indian monk seated in robes, in the style of the Shingon patriarch portraits"
      caption: "A Japanese portrait of Nagarjuna from the Seven Shingon Patriarchs set at Toji, Kyoto, made many centuries after his life: no likeness of him from his own time is known, so it shows how a later tradition imagined him."
      credit: "Kūkai, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:N%C4%81g%C4%81rjuna_-_Toji.jpg"
    body: |
      Nagarjuna is dated by the Stanford Encyclopedia of Philosophy to about 150 to 250 CE, probably mainly in southern India. Very little is certain about his life, and later traditions told many legends. He is credited with the *Mulamadhyamakakarika* ("Fundamental Verses on the Middle Way"), a text of about 450 verses (*karikas*) in 27 chapters, and with the *Vigrahavyavartani* ("Dispeller of Disputes"), in which he answers objections.

      The school that grew from his work is called *Madhyamaka*, the "middle way" school. Historians know the text well and its reading is disputed. When this lesson says "according to Nagarjuna", it means "according to the verses, as translators and scholars read them". It names the readers where they differ.

  - type: widget
    id: chain-widget
    title: "Remove a condition"
    widget: condition-chain
    config:
      layout: row
      links: [Seed, Tree, Plank, Table, Dinner]
      show: {list: true, reset: true}
      labels: {counter: "still arising", stopped: "stopped", reset: "Restore all"}
    body: |
      A toy chain in which each link depends on the one before it: a seed grows a tree, a plank is cut from the tree, a table is made from the plank, and dinner is eaten at the table. Click a link to remove it, and click again to restore it. Which links keep arising whatever you remove?

  - type: numeric
    id: widget-n
    title: "What did you see?"
    review: false
    prompt: |
      In the toy chain Seed, Tree, Plank, Table, Dinner, where each link depends on the one before it, you remove Plank. How many of the five links still arise?
    answer: 2
    wrong:
      - { value: 1, feedback: "Seed and Tree come before Plank, so they are untouched. Count them both." }
      - { value: 4, feedback: "Only Plank is removed, but Table depends on Plank and Dinner on Table, so they stop as well." }
    hint: "Count the links before the removed one."
    explanation: |
      Seed and Tree still arise; Plank is removed; Table and Dinner stop because each depends on the one before. Removing a condition removes what depends on it.

  - type: mcq
    id: chain-first
    title: "A link with no condition?"
    prompt: |
      In the toy chain the first link, Seed, arises whatever else you remove, because nothing in the toy comes before it. A student says: "So Seed has its own nature, independent of conditions." What is the best reply?
    options:
      - text: "The toy simply stops drawing the chain there; a real seed depends on a parent tree, soil, rain and sun, and those on more conditions, so Seed is no independent item."
        correct: true
        feedback: |
          Yes. Seeming to stand alone is an effect of where the picture ends. This is the Madhyamaka point: every item we look at has conditions if we look further.
      - text: "Seed has no conditions because it is the first thing in the chain."
        feedback: |
          Being first in a drawing is not being unconditioned. The seed grew on a plant, which came from an earlier seed.
      - text: "Seed depends on the Dinner, since the chain is a loop."
        feedback: |
          The toy has no loop, and a seed does not depend on a later dinner. The correct reply keeps the dependence real and finds it earlier.
    explanation: |
      A Madhyamaka critic of an unconditioned building block says the same: whatever you point to as "the base" has its own conditions, and is not the end of the dependence.

  - type: text
    id: argument
    title: "Dependence implies emptiness"
    body: |
      The central argument is simple, and its premises are worth stating one by one. Call it the argument from dependence.

      **P1.** Whatever has *svabhava* does not depend on causes or conditions, since a nature of its own would be there whatever else was.

      **P2.** Whatever arises dependently on causes and conditions is made by them. By P1, what is made by conditions cannot have own-being; Nagarjuna says, roughly, that an own-nature arising from causes and conditions would be an artefact (*Mulamadhyamakakarika* chapter 15, which is the chapter on *svabhava*, in essence).

      **P3.** Everything we meet arises dependently. The lesson Dependent Origination gave the Buddhist grounds for this, and the table in the hook is a small example.

      **C.** So nothing we meet has svabhava. This lack is called *emptiness* (*sunyata*): things are *empty of svabhava*.

      The argument is valid: if P1 to P3 hold, C follows. Whether it is sound depends on the premises.

  - type: mcq
    id: premise
    title: "Which premise would a critic reject?"
    prompt: |
      According to the argument from dependence (P1: what has svabhava depends on nothing; P2: what arises from conditions cannot have svabhava; P3: everything we meet arises from conditions), which premise would an Abhidharma philosopher, who holds that the smallest building blocks of experience have own-being, most naturally reject?
    options:
      - text: "P3, at least for the basic building blocks: they are the ultimate items that do not arise from anything further."
        correct: true
        feedback: |
          Yes. Granting P1 and P2, the Abhidharma view escapes by holding that the basic items are not dependent in the sense P3 needs. Nagarjuna's reply is that these items have causes and parts of their own, as the toy chain showed.
      - text: "P1, because the Abhidharma holds that nothing in the world has any nature."
        feedback: |
          This is the reverse of the Abhidharma view. They hold that the basic items do have a nature of their own, which is what P1 describes.
      - text: "The conclusion, but not the premises."
        feedback: |
          If the argument is valid and the premises are accepted, the conclusion must be accepted. A critic of a valid argument has to find a premise.
    explanation: |
      A second type of critic accepts the premises and denies that "empty of svabhava" is a problem: the rest of the lesson looks at the worry that emptiness destroys everything.

  - type: mcq
    id: empty-of
    title: "Empty of what?"
    prompt: |
      According to Nagarjuna, a table is "empty". Which reading of that word does he intend?
    options:
      - text: "Empty of svabhava: it has no nature of its own, independent of conditions. It is still a table that can be used."
        correct: true
        feedback: |
          Yes. A cup is empty of water without ceasing to be a cup; the table is empty of own-being without ceasing to be a table. The word names a lack of a specific thing.
      - text: "Empty of existence: it is an illusion and nothing is there."
        feedback: |
          This is the nihilist reading, and the tradition's own commentators reject it for Nagarjuna. The next cards look at why it tempts and why it fails.
      - text: "Empty of matter: it is an idea in the mind."
        feedback: |
          This is a different position, mind-only idealism, which later Buddhist thinkers developed. Emptiness for Nagarjuna is a claim about svabhava, not about matter or mind.
    explanation: |
      The most common error about this word is to hear "empty" as "does not exist". The Stanford Encyclopedia of Philosophy notes that a charge of nihilism, that Madhyamaka holds that nothing exists, is sometimes made, and argues against it.

  - type: text
    id: middle
    title: "Dependent, empty, and the middle way"
    body: |
      In chapter 24 of the *Mulamadhyamakakarika*, verse 18, Nagarjuna ties three ideas together. In essence, the verse says: whatever is dependently arisen is called emptiness; that emptiness is itself a dependent designation (a way of speaking that depends on the things it describes and on language); and this is the middle way. The next lines say that something not dependently arisen would not exist, so nothing is non-empty.

      So "dependently arisen", "empty" and "middle way" name one thing seen from three sides. It is the middle way between two extremes that Buddhist texts reject. One extreme is **eternalism**: things exist by their own nature and last. The other is **nihilism** (or annihilationism): things do not exist at all. In chapter 15 Nagarjuna says in essence that to say "it is" grasps at permanence and to say "it is not" adopts the nihilist view, so the wise say neither.

  - type: order
    id: argument-order
    title: "Build the argument"
    prompt: |
      Put the argument from dependence in a sensible order, from the idea of own-being to the conclusion.
    steps:
      - "Own-being would be a nature a thing has on its own, independent of conditions."
      - "Whatever depends on causes and conditions is made by them, so cannot have such a nature."
      - "Everything we meet arises dependently, as the table and the toy chain show."
      - "So nothing we meet has own-being: everything is empty of it."
    hint: "Define the term, state what follows from dependence, apply it to the world, then conclude."
    explanation: |
      The first step defines the target, the second links dependence to the lack of own-being, the third gives the factual premise, and only then does the conclusion follow.

  - type: mcq
    id: nihilism
    title: "Does emptiness destroy everything?"
    prompt: |
      An opponent says: "If everything is empty of own-being, then nothing arises, nothing ceases, there is no suffering to cure and no path to follow. Madhyamaka is nihilism." In essence, how does Nagarjuna reply, according to the verses of chapters 15 and 24?
    options:
      - text: "It is the reverse: if things had own-being, they could not change or be caused, so only emptiness allows change, causes and a path."
        correct: true
        feedback: |
          Yes. A nature that exists on its own would stay as it is, and so nothing could arise or alter. In chapter 15 he asks, in essence, what could change if things had an unchanging nature. In chapter 24 he says, in essence, that for whom emptiness is possible, everything is possible, and where it is not, nothing is.
      - text: "He agrees that nothing exists, and the path is a useful fiction."
        feedback: |
          This is the nihilist reading, which the tradition and the Stanford Encyclopedia of Philosophy entry reject. The reply says emptiness makes things possible, not impossible.
      - text: "He avoids the question by refusing to say anything."
        feedback: |
          He does answer, and with an argument. A different claim, that he asserts no thesis, concerns the next objection and is read in several ways.
    explanation: |
      The reply turns the charge round: it is the believer in own-being who cannot explain change. Whether the reply works is a debate, but it is the reply the verses give.

  - type: text
    id: truths
    title: "Two truths"
    body: |
      If things are empty and yet tables can be used, in what sense do they exist? Nagarjuna answers with the doctrine of *two truths*. In chapter 24, verse 8, the Stanford Encyclopedia of Philosophy cites him as saying that the Dharma taught by the buddhas rests on "a truth of mundane conventions and a truth of the ultimate". Verse 10 says, in essence, that without understanding the ultimate, nirvana is not reached. The ultimate is taught through the conventional: we have to use ordinary words about tables and persons to point at their emptiness.

      A way to hold the two together: at the **conventional** level, tables and persons exist, are named and can be used, and a wrong claim about them (a table with no legs holds a book) can be corrected. At the **ultimate** level, none of these has svabhava. The truths do not describe two worlds; they are two levels at which one world can be described. The Abhidharma schools had two truths too, but for them the ultimate level was the set of irreducible building blocks, and wholes and continua were only conventional. Nagarjuna's ultimate truth is the emptiness of those blocks too.

  - type: mcq
    id: truths-q
    title: "Is the table real?"
    prompt: |
      A student asks a Madhyamaka philosopher, "Is the table real?" Using the two truths in Nagarjuna's sense, which answer is faithful?
    options:
      - text: "Conventionally yes: it exists and can be used. Ultimately it is empty of svabhava, so it is not a thing with a nature of its own."
        correct: true
        feedback: |
          Yes. Both parts are said together, and neither cancels the other: the table is a dependent thing, real as such, and not independent.
      - text: "Ultimately it is real, and only conventionally is it empty."
        feedback: |
          This reverses the roles. For Nagarjuna the ultimate truth is precisely the lack of svabhava.
      - text: "Neither: the table is an illusion at both levels."
        feedback: |
          This drifts to nihilism. At the conventional level tables function and can be known; calling them illusions at that level denies something the tradition affirms.
    explanation: |
      A scholarly debate asks how the two truths relate. Candrakirti (early seventh century CE) describes conventional truth as a screen that hides the ultimate; Bhaviveka (sixth century) argues that accepting conventional reality needs a kind of intrinsic reality to avoid nihilism; Candrakirti rejects that. The Stanford Encyclopedia of Philosophy reports both.

  - type: text
    id: objection
    title: "Does emptiness refute itself?"
    body: |
      A famous objection comes from an opponent in the *Vigrahavyavartani*. If everything is empty, then the statement "everything is empty" is empty too, so it has no nature of its own. A statement with no nature of its own, says the opponent, cannot do anything: it cannot discard anyone's svabhava. So either the claim is false or it is powerless.

      Nagarjuna replies in several ways. According to the summaries of the text, he says that emptiness just is dependent origination, so the statement is itself dependent, and being dependent is what his claim says things are; it is not something that has to have svabhava in order to work. He compares it to a magical figure that denies another magical figure. And he adds a second line: he says he holds no thesis (verse 29), so the objection does not apply.

      Later commentators take the point further under the title *the emptiness of emptiness*: emptiness is itself dependent and empty, so it is no ultimate object to cling to. In chapter 13 he says, in essence, that the victorious ones called emptiness the abandoning of views, and that those for whom emptiness is itself a view are incurable. Jay Garfield's 1994 article "Dependent Arising and the Emptiness of Emptiness" is the standard modern discussion.

  - type: mcq
    id: objection-q
    title: "Which reply meets the objection?"
    prompt: |
      Objection: "If 'everything is empty of svabhava' is itself empty of svabhava, the statement cannot remove svabhava from anything." Which reply is in the spirit of Nagarjuna's answer?
    options:
      - text: "The statement is dependent too, and that is just what it says of everything. It does not need a nature of its own in order to work, any more than a dependent table needs one to hold a book."
        correct: true
        feedback: |
          Yes. The objection assumes that only something with own-being can do work, which is the very premise Madhyamaka denies. Emptiness is a way things are connected, not a thing standing apart.
      - text: "The statement is the one exception: it alone has svabhava, because it is true."
        feedback: |
          This would give the claim a reality of its own and so refute it, since it would be a counterexample to its own content. Nagarjuna says emptiness is not such an item.
      - text: "The statement is meaningless, so the objection is meaningless too."
        feedback: |
          Nagarjuna takes the objection seriously and answers it. Being empty is not being meaningless.
    explanation: |
      Whether the reply succeeds is debated. Critics say it moves the problem, and defenders say it shows how emptiness differs from a thesis about a hidden nature.

  - type: text
    id: readings
    title: "Four ways to read him"
    body: |
      Scholars disagree about what Nagarjuna was doing, and the debate is live. According to the Stanford Encyclopedia of Philosophy entry and the papers it cites, these are some of the main readings.

      **Nihilist.** Some scholars have argued for a form of nihilism, that nothing really exists. The Stanford entry itself rejects this, and the commentators of the tradition do too.

      **Anti-realist.** Mark Siderits and others read Madhyamaka as an anti-realism: there is no mind-independent ultimate nature of things, and truth is more like warranted assertion than correspondence to a self-standing world.

      **Positionless or no-thesis.** Jay Garfield and others read the "no thesis" verse as saying that emptiness is not a doctrine to be held. Jan Westerhoff has argued that the paradox is resolved by a semantic distinction between assertions made with and without ontological import (a claim about what ultimately exists). Stanislaw Kania argues instead that verse 29 should not be taken as Nagarjuna's own standpoint at all, but as an absurd consequence inside a debate.

      **Paradox-accepting.** Garfield and Graham Priest, in *Nagarjuna and the Limits of Thought* (2003), read him as accepting that reality has a contradictory character at its limit.

      Inside the tradition the readings differ too: Bhaviveka held that the Madhyamika advances a thesis, that all phenomena are empty, while Candrakirti held that the Madhyamika advances no position of his own and only draws out the consequences of the opponent's.

  - type: mcq
    id: readings-q
    title: "Match the claim to the reading"
    prompt: |
      A scholar writes: "Nagarjuna denies that things have any nature independent of our ways of describing them, but he does not deny that tables are useful or that truth is something we can assess." Which reading is this closest to?
    options:
      - text: "Anti-realist: no mind-independent ultimate nature, with truth assessed inside our practices."
        correct: true
        feedback: |
          Yes. This is the shape of Siderits's reading as the Stanford entry describes it: truth as warranted assertability, and no self-standing nature behind it.
      - text: "Nihilist: nothing exists."
        feedback: |
          The scholar says tables are useful and truth is assessable, so this is not nihilism.
      - text: "Eternalist: things exist by their own nature."
        feedback: |
          The scholar denies independent natures, which is the opposite of eternalism.
    explanation: |
      Matching a sentence to a reading does not say which reading is right. It lets you see what each would have to defend: the anti-realist, that the ultimate truth is not a hidden reality; the nihilist, that useful tables are not at all; the paradox-accepter, that contradictions can be true.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Which claim is a **commitment of faith** and neither the record of a text nor a live scholarly debate?
    options:
      - text: "That seeing the emptiness of all things frees a person from suffering."
        correct: true
        feedback: |
          Yes. This is the tradition's claim about the practical result of insight; practitioners hold it and test it in practice, but a historian or philosopher cannot settle it by argument alone.
      - text: "That the *Mulamadhyamakakarika* argues that dependent origination and emptiness are the same."
        feedback: |
          This is established by the text: verse 24.18 says so, in these terms, in the translations.
      - text: "Whether Nagarjuna is best read as an anti-realist, a no-thesis philosopher or a defender of contradiction."
        feedback: |
          This is a live scholarly debate about how to read the verses; the text alone does not settle it.
    explanation: |
      Keeping the layers apart lets a Madhyamika, an Abhidharma philosopher, a scholar and a sceptic each say "that is fair": the text is a record, its reading is a debate, and whether emptiness is true or liberating is for each reader to weigh.

  - type: text
    id: summary
    body: |
      **Next:** Nagarjuna's emptiness became one of the main philosophical tools of the Mahayana ("great vehicle") branch of Buddhism, but not of all branches. The next lesson, *Theravada, Mahayana, Vajrayana*, maps the main branches, what they share, and where they differ on the person, the goal and how to reach it.
