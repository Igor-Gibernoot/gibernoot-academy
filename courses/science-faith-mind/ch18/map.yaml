outroTitle: Buddhism in one picture
outro: |
  The four truths give the diagnosis: dukkha, its origin in craving, its cessation and the path. The five aggregates and the chariot argument say what a person is made of, a changing set of processes with no self apart from them, and dependent origination says how those processes keep going and how the chain can be cut. Emptiness carries that logic to everything, and the two truths keep ordinary talk of persons and chariots. Rebirth without a soul asks who continues, and the answer, a stream of conditions, is where traditions and modern readers part. Theravada, Mahayana and Vajrayana, and Zen within the Mahayana, share the frame and differ in ideal and method. Gods exist inside the cosmology but none is a creator, and the questions the Buddha left undeclared were set aside because they do not serve the goal. The dialogue with the science of mind tests the empirical claims and leaves open what the mind finally is. Throughout, the texts and history are established, the readings are debated, and rebirth and awakening are matters of faith.
