id: ch18-map
title: "Content Map: Buddhism"
kind: map
name: Level 18, Buddhism (the four truths, the five aggregates and not-self, the chariot argument, dependent origination, emptiness, rebirth without a soul, the three branches, Zen, gods and the undeclared questions, the dialogue with the science of mind)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Buddhism one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (two terms swapped, a branch or a person mixed up, a claim stretched too far), and every wrong pick comes with a reason.

  Everything is taught according to the Buddhist texts, the traditions and the scholars who study them; which view is right is left to each reader. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: truths
    title: The four truths
    row: 1
    col: 1
    body: |
      The first sermon (to five monks at the Deer Park near Varanasi) sets out four truths in the order of a physician: the illness, its cause, the possibility of health, the treatment. ***Dukkha*** is the **unsatisfactoriness** of life, of three kinds: pain, change, and the unsatisfactoriness of conditioned things. Its origin is ***tanha***, craving, **for sense pleasure, for existence and for non-existence**. Its cessation is ***nirvana***, "blowing out" like a flame. The path is the **Eightfold Path**, in three groups: **wisdom, ethical conduct, meditation**, a middle way between indulgence and self-mortification.
    decoys:
      - body: |
          The first sermon (to five monks at the Deer Park near Varanasi) sets out four truths in the order of a physician: the illness, its cause, the possibility of health, the treatment. ***Dukkha*** means that **life is only suffering**, with nothing else in it, of three kinds: pain, change, and the unsatisfactoriness of conditioned things. Its origin is ***tanha***, craving, **for sense pleasure, for existence and for non-existence**. Its cessation is ***nirvana***, "blowing out" like a flame. The path is the **Eightfold Path**, in three groups: **wisdom, ethical conduct, meditation**, a middle way between indulgence and self-mortification.
        feedback: |
          Dukkha is unsatisfactoriness, not "life is only suffering": the text grants pleasure and says it does not last, which is the second kind, change. The pessimistic reading is the tempting simplification.
      - body: |
          The first sermon (to five monks at the Deer Park near Varanasi) sets out four truths in the order of a physician: the illness, its cause, the possibility of health, the treatment. ***Dukkha*** is the **unsatisfactoriness** of life, of three kinds: pain, change, and the unsatisfactoriness of conditioned things. Its origin is ***tanha***, craving, **for sense pleasure, for gods and for rebirth**. Its cessation is ***nirvana***, **a heaven reached after death**. The path is the **Eightfold Path**, in three groups: **wisdom, devotion, sacrifice**, a middle way between indulgence and self-mortification.
        feedback: |
          Three slips. The three cravings are for sense pleasure, for existence and for non-existence. Nirvana is the "blowing out" of craving, not a heaven. And the three path groups are wisdom, ethical conduct and meditation.
    explanation: |
      The root of the map: a diagnosis and a treatment. Every other box explains what the "illness" is made of or how the treatment works.

  - id: aggregates
    title: Five aggregates and not-self
    row: 1
    col: 2
    body: |
      A person can be described as five groups (*khandha*): **form, feeling, perception, volitions, consciousness**. The discourse on not-self argues for each one in turn. P1: it is **impermanent**. P2: what is impermanent is **unsatisfactory**. P3: what is impermanent and unsatisfactory is not fit to be regarded as "this is my self". C: none of the five is the self. This is **not "no person"**: ordinary talk of "you" is conventionally true, and what is denied is a lasting owner behind the aggregates.
    decoys:
      - body: |
          A person can be described as five groups (*khandha*): **form, feeling, perception, volitions, consciousness**. The discourse on not-self argues for each one in turn. P1: it is **permanent**. P2: what is impermanent is **unsatisfactory**. P3: what is impermanent and unsatisfactory is not fit to be regarded as "this is my self". C: none of the five is the self. This is **not "no person"**: ordinary talk of "you" is conventionally true, and what is denied is a lasting owner behind the aggregates.
        feedback: |
          P1 says the opposite: each aggregate is impermanent. The argument runs from change, to unsatisfactoriness, to "not fit to be called my self".
      - body: |
          A person can be described as five groups (*khandha*): **form, feeling, perception, volitions, consciousness**. The discourse on not-self argues for each one in turn. P1: it is **impermanent**. P2: what is impermanent is **unsatisfactory**. P3: what is impermanent and unsatisfactory is not fit to be regarded as "this is my self". C: none of the five is the self, so **no person exists at all** and talk of "you" is simply false.
        feedback: |
          The same texts speak freely of persons. What is denied is a lasting self behind the five, not the conventional person.
    explanation: |
      What "no self" means: a person is a changing set of processes, and the argument can be attacked at P1, P2 or the step to C.

  - id: chariot
    title: The chariot argument
    row: 1
    col: 3
    body: |
      In the *Milindapanha* (dated about 100 BCE to 200 CE) the monk **Nagasena** asks the Indo-Greek king **Milinda** (Menander I) whether his chariot is a part, the parts together, or something else. P1: not any one part. P2: not all the parts as a mere collection. P3: not something **apart from** the parts. C: "chariot" is **a designation in common use** for parts in an arrangement; the same shape is applied to the person and the five aggregates. The step is valid only if the three options are **exhaustive**. The reductionist reply: the whole is a convenient name. The emergence reply: the arranged whole has **powers the parts alone lack**.
    decoys:
      - body: |
          In the *Milindapanha* (dated about 100 BCE to 200 CE) the monk **Milinda** asks the Indo-Greek king **Nagasena** (Menander I) whether his chariot is a part, the parts together, or something else. P1: not any one part. P2: not all the parts as a mere collection. P3: not something **apart from** the parts. C: "chariot" is **a designation in common use** for parts in an arrangement; the same shape is applied to the person and the five aggregates. The step is valid only if the three options are **exhaustive**. The reductionist reply: the whole is a convenient name. The emergence reply: the arranged whole has **powers the parts alone lack**.
        feedback: |
          The roles are swapped. Nagasena is the monk who asks, and Milinda (usually identified with Menander I) is the king who rode in the chariot.
      - body: |
          In the *Milindapanha* (dated about 100 BCE to 200 CE) the monk **Nagasena** asks the Indo-Greek king **Milinda** (Menander I) whether his chariot is a part, the parts together, or something else. P1: not any one part. P2: not all the parts as a mere collection. P3: not something **apart from** the parts. C: the chariot **does not exist**, and so neither does the person. The step is valid whatever options are listed. The reductionist reply: the arranged whole has **powers the parts alone lack**. The emergence reply: the whole is a convenient name.
        feedback: |
          Three slips. The conclusion is that "chariot" is a conventional designation, not that nothing exists. The step is valid only if the options are exhaustive. And the two replies are swapped: reduction says the whole is a name, emergence says it has new powers.
    explanation: |
      The same logic as not-self, in a picture a king could follow. It also shows what a critic can reject: the hidden premise that the three options exhaust the cases.

  - id: origination
    title: Dependent origination
    row: 2
    col: 1
    body: |
      The formula: **"When this is, that is; when this isn't, that isn't."** A condition is something the later item depends on, not always its only cause. The best-known list has **twelve links**, from **ignorance** through formations, consciousness, name-and-form, the six sense bases, contact, feeling, craving and clinging, to becoming, birth and **ageing-and-death**. **Removing a link stops every link after it**, which is why it is a practical argument. Buddhaghosa spread the twelve over **three lives**; modern scholars such as Dhivan Thomas Jones read them as a process in **one moment**. It runs between eternalism and annihilationism.
    decoys:
      - body: |
          The formula: **"Everything has a first cause, and that cause is ignorance."** A condition is something the later item depends on, not always its only cause. The best-known list has **twelve links**, from **ignorance** through formations, consciousness, name-and-form, the six sense bases, contact, feeling, craving and clinging, to becoming, birth and **ageing-and-death**. **Removing a link stops every link after it**, which is why it is a practical argument. Buddhaghosa spread the twelve over **three lives**; modern scholars such as Dhivan Thomas Jones read them as a process in **one moment**. It runs between eternalism and annihilationism.
        feedback: |
          The formula is about conditions: when this is, that is. It does not name a first cause, and a condition is not always the only cause.
      - body: |
          The formula: **"When this is, that is; when this isn't, that isn't."** A condition is something the later item depends on, not always its only cause. The best-known list has **twelve links**, from **ageing-and-death** through birth, becoming, clinging and craving to feeling, contact, the six sense bases, name-and-form, consciousness, formations and **ignorance**. **Removing a link stops every link before it**, which is why it is a practical argument. Jones argues that the **three-life reading is the original one**. It runs between eternalism and annihilationism.
        feedback: |
          Three slips. The list runs from ignorance to ageing-and-death. Removing a link stops what depends on it, the links after it. And the three-life reading is Buddhaghosa's later development, according to Jones, who reads the list moment by moment.
    explanation: |
      How a person made of changing processes keeps going and keeps suffering: the "illness" of the first truth explained as a chain of conditions that can be cut.

  - id: emptiness
    title: Emptiness
    row: 2
    col: 2
    body: |
      **Nagarjuna** (traditionally c. 150 to 250 CE) wrote the *Mulamadhyamakakarika*, about 450 verses in 27 chapters. ***Svabhava*** is "own-being", a nature a thing would have **independently of causes, parts and conditions**. Whatever arises from conditions lacks it, so dependent origination and ***sunyata*** (emptiness) name one fact. Empty means **empty of svabhava, not non-existent**; with svabhava nothing could change. The **two truths**: conventional (tables and persons can be talked about) and ultimate (they are empty), and emptiness is **not a view to cling to**.
    decoys:
      - body: |
          **Nagarjuna** (traditionally c. 150 to 250 CE) wrote the *Mulamadhyamakakarika*, about 450 verses in 27 chapters. ***Svabhava*** is "own-being", a nature a thing would have **independently of causes, parts and conditions**. Whatever arises from conditions lacks it, so dependent origination and ***sunyata*** (emptiness) name one fact. Empty means **non-existent, so nothing exists**; with svabhava nothing could change. The **two truths**: conventional (tables and persons can be talked about) and ultimate (they are empty), and emptiness is **not a view to cling to**.
        feedback: |
          That is the nihilist reading Nagarjuna rejects. Empty of svabhava is not nothing: because things have no fixed nature, they can change and cause one another.
      - body: |
          **Nagarjuna** (traditionally c. 150 to 250 CE) wrote the *Mulamadhyamakakarika*, about 450 verses in 27 chapters. ***Svabhava*** is "own-being", a nature a thing would have **independently of causes, parts and conditions**. Whatever arises from conditions has it **in full**, so dependent origination and ***sunyata*** (emptiness) name **two different facts**. Empty means **empty of svabhava, not non-existent**; with svabhava nothing could change. The **two truths**: **a true world and a false one**, and emptiness is the **final view to hold firmly**.
        feedback: |
          Three slips. Dependence implies the lack of svabhava, so dependent origination and emptiness name one fact. The two truths are conventional and ultimate, not true and false worlds. And emptiness must not be clung to as a view.
    explanation: |
      Dependent origination pushed to its limit: if everything depends on conditions, nothing has a nature of its own, and yet things work. The two truths keep both sides.

  - id: rebirth
    title: Rebirth without a soul
    row: 2
    col: 3
    body: |
      According to the tradition there is **rebirth without a soul**: no-self means **a stream of conditions continues, not a self that moves**, like a flame lit from another flame, so the later being is **neither the same as nor wholly different from** the earlier. **Karma** is intentional action, and it shapes the stream. Modern Buddhists divide: **Alan Wallace** defends a literal continuity of consciousness, and **Stephen Batchelor** (*Buddhism Without Beliefs*, 1997) proposes an agnostic, secular reading. That rebirth occurs is a matter of **faith**, not an established fact.
    decoys:
      - body: |
          According to the tradition there is **rebirth of a soul**: no-self means **a self moves from life to life**, like a passenger changing cars, so the later being is **the same as** the earlier. **Karma** is intentional action, and it shapes the stream. Modern Buddhists divide: **Alan Wallace** defends a literal continuity of consciousness, and **Stephen Batchelor** (*Buddhism Without Beliefs*, 1997) proposes an agnostic, secular reading. That rebirth occurs is a matter of **faith**, not an established fact.
        feedback: |
          A self that moves is exactly what the not-self teaching denies. What continues is a stream of conditions, like a flame passed from one lamp to another.
      - body: |
          According to the tradition there is **rebirth without a soul**: no-self means **a stream of conditions continues, not a self that moves**, like a flame lit from another flame, so the later being is **neither the same as nor wholly different from** the earlier. **Karma** is intentional action, and it shapes the stream. Modern Buddhists divide: **Stephen Batchelor** defends a literal continuity of consciousness, and **Alan Wallace** (*Buddhism Without Beliefs*, 1997) proposes an agnostic, secular reading. That rebirth occurs is **established by the texts**, so no faith is needed.
        feedback: |
          The two are swapped: Wallace is the Tibetan-trained scholar who defends a literal continuity, Batchelor wrote *Buddhism Without Beliefs*. And that the texts teach rebirth is established, but that it occurs is a matter of faith.
    explanation: |
      The question that not-self and dependent origination raise at once: who is reborn? The answer is a stream, and modern readers split on whether to keep it.

  - id: schools
    title: Theravada, Mahayana, Vajrayana
    row: 3
    col: 1
    body: |
      All three share the three marks, the four truths and the eightfold path. **Theravada** ("doctrine of the elders") holds that the earliest record is the **Pali Canon** (*Tipitaka*, "three baskets"), and its ideal is the **arhat**, who has ended craving and will not be reborn. **Mahayana** ("great vehicle", from about the first century BCE) accepts further *sutras* and its ideal is the **bodhisattva**, who vows to reach buddhahood **so as to free all beings**. **Vajrayana** ("diamond vehicle") is a **tantric branch** with mantras, mandalas, deity visualisation and a guru, taken as a faster route; it took root in Tibet.
    decoys:
      - body: |
          All three share the three marks, the four truths and the eightfold path. **Theravada** ("doctrine of the elders") holds that the earliest record is the **Pali Canon** (*Tipitaka*, "three baskets"), and its ideal is the **bodhisattva**, who vows to reach buddhahood **so as to free all beings**. **Mahayana** ("great vehicle", from about the first century BCE) accepts further *sutras* and its ideal is the **arhat**, who has ended craving and will not be reborn. **Vajrayana** ("diamond vehicle") is a **tantric branch** with mantras, mandalas, deity visualisation and a guru, taken as a faster route; it took root in Tibet.
        feedback: |
          The ideals are swapped. The arhat is the Theravada ideal; the bodhisattva, who vows to free all beings, is the Mahayana one.
      - body: |
          All three share the three marks, the four truths and the eightfold path. **Theravada** ("doctrine of the elders") holds that the earliest record is the **Pali Canon** (*Tipitaka*, "three baskets"), and its ideal is the **arhat**, who has ended craving and will not be reborn. **Mahayana** ("great vehicle", from about the **fifth century BCE**) accepts further *sutras*, **which historians take to be the Buddha's own words**, and its ideal is the **bodhisattva**. **Vajrayana** ("diamond vehicle") is a **rival religion** that rejects the eightfold path, taken as a faster route; it took root in Tibet.
        feedback: |
          Three slips. The Mahayana sutras began to appear from about the first century BCE, so historians do not take them as the literal words of the historical Buddha (while not denying their religious authority). And Vajrayana is a tantric branch inside Mahayana, not a rival that drops the path.
    explanation: |
      What stays the same and what each branch adds: a different reading of the goal (own liberation or all beings) and different methods.

  - id: zen
    title: Zen
    row: 3
    col: 2
    body: |
      **Zen** is the Japanese reading of **Chan**, both from Sanskrit *dhyana* (meditation). Tradition says **Bodhidharma** brought it to China around 520 CE; historians treat him as obscure and the slogan "a special transmission outside the scriptures" as a **later, Song-era attribution**. *Zazen* is seated meditation, aiming at ***kensho***, seeing buddha-nature directly. A ***koan*** (*gong'an*, "public case") is a **tool for a change of seeing, not a riddle with a hidden verbal answer**. **Rinzai** stresses koans, **Soto** (Dogen, 1200 to 1253) stresses **just sitting** (*shikantaza*).
    decoys:
      - body: |
          **Zen** is the Japanese reading of **Chan**, both from Sanskrit *dhyana* (meditation). Tradition says **Bodhidharma** brought it to China around 520 CE; historians treat him as obscure and the slogan "a special transmission outside the scriptures" as a **later, Song-era attribution**. *Zazen* is seated meditation, aiming at ***kensho***, seeing buddha-nature directly. A ***koan*** (*gong'an*, "public case") is **a riddle with a hidden verbal answer that the master checks**. **Soto** stresses koans, **Rinzai** (Dogen, 1200 to 1253) stresses **just sitting** (*shikantaza*).
        feedback: |
          Two slips. A koan is a tool for a change of seeing, not a riddle with a correct sentence. And the schools are swapped: Rinzai stresses koans, Soto (Dogen) stresses just sitting.
      - body: |
          **Zen** is the Japanese reading of **Chan**, both from Sanskrit *dhyana* (meditation). Tradition says **Bodhidharma** brought it to China around 520 CE; historians treat him as **a well documented figure** and the slogan "a special transmission outside the scriptures" as **his own early teaching, so Zen rejects all texts and thought**. *Zazen* is seated meditation, aiming at ***kensho***, seeing buddha-nature directly. A ***koan*** (*gong'an*, "public case") is a **tool for a change of seeing, not a riddle with a hidden verbal answer**. **Rinzai** stresses koans, **Soto** (Dogen, 1200 to 1253) stresses **just sitting** (*shikantaza*).
        feedback: |
          Bodhidharma is an obscure figure and the slogan is a later attribution. Zen did not reject the texts; it warned against relying on them for insight, and it produced a very large literature.
    explanation: |
      The two truths put into practice: words and concepts are useful conventional tools that can become a barrier when mistaken for the experience.

  - id: gods
    title: Gods and the undeclared questions
    row: 3
    col: 3
    body: |
      In the *Culamalunkya Sutta* (MN 63) the monk Malunkyaputta demands answers on whether the cosmos is eternal, whether soul and body are the same, and whether a Tathagata exists after death. The Buddha leaves them **undeclared** because they are **not connected with the goal**: the poisoned arrow is removed first. The **devas** are real but **long-lived, not immortal, and still subject to rebirth**. In the *Brahmajala Sutta* (DN 1) Brahma **mistakenly believes he created** the beings who came after him. So Buddhism is neither simple worship of gods nor simple atheism; **Pure Land** schools recite the name of the buddha Amitabha.
    decoys:
      - body: |
          In the *Culamalunkya Sutta* (MN 63) the monk Malunkyaputta demands answers on whether the cosmos is eternal, whether soul and body are the same, and whether a Tathagata exists after death. The Buddha leaves them **undeclared** because they are **not connected with the goal**: the poisoned arrow is removed first. The **devas** are real and **immortal, outside rebirth**. In the *Brahmajala Sutta* (DN 1) Brahma **truly created** the beings who came after him, as **the eternal creator** the Buddha teaches. So Buddhism is neither simple worship of gods nor simple atheism; **Pure Land** schools recite the name of the buddha Amitabha.
        feedback: |
          According to the texts the devas are long-lived but mortal and still in samsara, and the claim of creation is Brahma's mistake. No god is a creator or the source of salvation.
      - body: |
          In the *Culamalunkya Sutta* (MN 63) the monk Malunkyaputta demands answers on whether the cosmos is eternal, whether soul and body are the same, and whether a Tathagata exists after death. The Buddha leaves them **undeclared** because **he does not know the answers**: the poisoned arrow is removed first. The **devas** are real but **long-lived, not immortal, and still subject to rebirth**. In the *Brahmajala Sutta* (DN 1) Brahma **mistakenly believes he created** the beings who came after him. So Buddhism is **simply atheism**; **Pure Land** schools recite the name of the buddha Amitabha **as worship of a creator**.
        feedback: |
          The silence is a priority about what the path needs, not a confession of ignorance, and "simply atheism" is too quick, since gods exist in the cosmology. Pure Land devotion is described by adherents as a path to awakening, not as worship of a creator.
    explanation: |
      Where the "God question" of the other levels meets Buddhism: gods inside the cosmos, none a creator, and a silence that is a practical choice. Whether this is "a religion without God" depends on the definition of religion.

  - id: science
    title: The dialogue with the science of mind
    row: 4
    col: 2
    body: |
      The **Mind and Life** meetings began in a week in **October 1987 at Dharamsala**, with the 14th Dalai Lama, arranged by R. Adam Engle and Francisco Varela. They are **conversations, not experiments**. The Dalai Lama's principle, in essence, is that a Buddhist claim shown false by science should be given up, and it covers **empirical claims**: **not yet found is not shown false**. Lutz and colleagues (2004) compared eight long-term practitioners and ten students; the gap is **training plus pre-existing difference**, and only **random assignment with an active control** can split them. Kabat-Zinn's **secular mindfulness** course (1979) borrows the practice, not the path.
    decoys:
      - body: |
          The **Mind and Life** meetings began in a week in **October 1987 at Dharamsala**, with the 14th Dalai Lama, arranged by R. Adam Engle and Francisco Varela. They are **experiments that settled the claims**. The Dalai Lama's principle, in essence, is that a Buddhist claim shown false by science should be given up, and it covers **any claim, since not yet found means shown false**. Lutz and colleagues (2004) compared eight long-term practitioners and ten students; the gap is **entirely the effect of training**. Kabat-Zinn's **secular mindfulness** course (1979) borrows the practice, not the path.
        feedback: |
          The meetings are conversations and settled nothing by themselves. Not yet found is not shown false. And a comparison of existing groups cannot separate the effect of training from pre-existing differences.
      - body: |
          The **Mind and Life** meetings began in a week in **October 1987 at Dharamsala**, with the 14th Dalai Lama, arranged by R. Adam Engle and Francisco Varela. They are **conversations, not experiments**. The Dalai Lama's principle, in essence, is that a Buddhist claim shown false by science should be given up, and it covers **empirical claims**: **not yet found is not shown false**. Lutz and colleagues (2004) compared eight long-term practitioners and ten students; the gap is **training plus pre-existing difference**, and only **a larger sample of the same two groups** can split them. Kabat-Zinn's **secular mindfulness** course (1979) **teaches the full Buddhist path**.
        feedback: |
          More people from the same two groups do not remove the confound; random assignment with an active control does. And secular mindfulness borrows a practice but not the Buddhist path of wisdom, ethical conduct and meditation.
    explanation: |
      The traditions meet the empirical study of mind: what a trained report shows, what a brain study can and cannot separate, and why "not yet found" is not "shown false".

