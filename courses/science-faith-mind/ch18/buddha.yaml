id: ch18-buddha
title: "The Buddha and the Four Truths"
kind: concept
own: |
  The setting: the teaching attributed to the Buddha (Siddhartha Gautama of the Shakya clan, who lived in north-east India, in the fifth century BCE according to most current scholars, with the exact dates debated). It is taught according to the Pali text of his first sermon (*Dhammacakkappavattana Sutta*) and to the scholars who study it; whether the teaching is true is left to each reader.
  - **The method is a diagnosis.** The sermon sets out four "truths" (*ariya-sacca*, "noble truths") in the order of a physician's reasoning: the illness, its cause, the possibility of health, the treatment. Several scholars say the pattern follows the medical way of speaking of the time; one leading scholar notes that no early text says so.
  - **First truth, *dukkha*.** *Dukkha* is the unsatisfactoriness of life, not "life is suffering" in a gloomy sense. It has three kinds: {{ pain (*dukkha-dukkha*), change (*viparinama-dukkha*), and the unsatisfactoriness of conditioned things (*sankhara-dukkha*) }}.
  - **Second truth, the origin.** The cause is *tanha*, "thirst" or craving, of three kinds: {{ for sense pleasure, for existence, and for non-existence }}.
  - **Third truth, cessation.** The ending of that craving is *nirvana* (Pali *nibbana*), literally "blowing out" like a flame. Scholars and schools part ways on whether it is mainly {{ the extinguishing of craving, or also a transcendent state }}.
  - **Fourth truth, the path.** The Eightfold Path (right view, intention, speech, action, livelihood, effort, mindfulness, concentration) falls in three groups: {{ wisdom, ethical conduct, and meditation (concentration) }}. The sermon calls it the middle way between sensual indulgence and self-mortification.
  - **Three layers.** Established: the text of the sermon and its place in the Pali collection. Debated: the Buddha's dates, how much of the early teaching can be recovered, and whether the medical pattern is borrowed. Faith: that the teaching describes how things are.

cards:
  - type: mcq
    id: hook
    title: "Guess: what does a religion share with a clinic?"
    prompt: |
      Guessing is the point; no background is needed. A doctor works in four steps: she names the illness (the symptom), finds its cause, says whether the patient can recover (the prognosis), and prescribes a treatment. Suppose a teacher in ancient India built his whole teaching on that same four-step shape, speaking of suffering instead of a disease. What is the most reasonable first guess about what such a teaching treats as its main job?
    options:
      - text: "To diagnose a human problem, trace its cause, show it can end, and give a practical method; belief in a creed comes second."
        correct: true
        feedback: |
          A good first guess. This lesson tests it against the first sermon attributed to the Buddha, which is built exactly this way. Keep one caution: that the shape is medical is a pattern scholars observe, and what each step says is for the lesson to show.
      - text: "To describe the gods and their rules, with the human problem as a side note."
        feedback: |
          A four-step method starts from the problem, not from a theory of gods. We will see that the sermon says very little about gods and a great deal about what to do.
      - text: "To prove that nothing can be known, since a doctor can never be sure."
        feedback: |
          A doctor who gave up on knowing could not prescribe. The method assumes the problem can be understood and treated.
    explanation: |
      The lesson follows this shape: the setting in which the Buddha taught, the four truths in order (suffering, its origin, its ending, the path), and then the places where readers part ways. Everything is taught according to the Pali text of the sermon and to the scholars who study it; whether it is true is for you to weigh.

  - type: text
    id: shramana
    title: "A land of wandering seekers"
    body: |
      Where did such a teaching come from? In north-east India, in the region of the river Ganges around today's Bihar, many people in the middle of the first millennium BCE left home to wander as **renunciants**: people who give up family and property to search for a way out of the cycle of birth and death (rebirth is the belief that a being is born again and again, and was widely shared in that setting). They are called ***shramanas*** ("strivers"). Some practised severe fasting, some meditated, some argued about the self, fate and karma (the idea that actions shape what happens to us later).

      According to the Sanskrit scholar Johannes Bronkhorst, this region, which he calls **Greater Magadha**, had its own culture, different from the priestly religion of the Vedas that we met in the lessons on Hinduism. Not all scholars accept his picture of a single culture. What is widely agreed is that the Buddha, according to the Stanford Encyclopedia of Philosophy, can himself be classed as one of the *shramanas*, and that Jainism, which we meet later, grew in the same soil.

  - type: mcq
    id: shramana-q
    title: "Why so many seekers?"
    prompt: |
      According to scholars, the existence of many wandering renunciants (*shramanas*) in the Buddha's time shows something about the society. What is the most reasonable reading?
    options:
      - text: "Some people were dissatisfied with the customary religion of Vedic ritual and sacrifice, and looked for another way to deal with suffering and death."
        correct: true
        feedback: |
          Yes. The Stanford Encyclopedia reads their existence as a sign of some dissatisfaction with customary practice, and many shramanas rejected the authority of the Vedas.
      - text: "All of them were followers of the Buddha, who had already founded a church."
        feedback: |
          The shramanas were there before him, and he was one of them. Jain and other teachers were their contemporaries. The idea of one church comes later.
      - text: "They were people forced out of society as punishment."
        feedback: |
          Renunciation was a choice, and often a respected one. The tradition tells us they were wandering teachers who gathered pupils.
    explanation: |
      This is the background for the problem the Buddha addresses: how to deal with suffering and rebirth, not how to win a place in the priestly order. The setting matters because the four truths answer a question already in the air.

  - type: text
    id: life
    title: "The life, according to tradition"
    image:
      src: img/buddha-sarnath.webp
      alt: "Seated stone Buddha with hands in the teaching gesture, carved in sandstone, in a museum."
      caption: "A sandstone Buddha in the teaching gesture (*dharmachakra mudra*), found at Sarnath and shown in its museum; it dates from the Gupta period, many centuries after his life, so it shows how later devotees pictured him, not his likeness."
      credit: "พระมหาเทวประภาส วชิรญาณเมธี, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Buddha_in_Sarnath_Museum_(Dhammajak_Mutra).jpg"
    body: |
      Buddhist tradition tells the story as follows. **Siddhartha Gautama**, born into the **Shakya** clan, was born at **Lumbini** (today in Nepal). After years of wandering, severe asceticism and meditation he became "awakened" (*buddha* means "awakened one") at **Bodh Gaya**, in today's Bihar. He then taught for decades, and died at **Kushinagar** at about the age of eighty.

      His first sermon was given in the Deer Park at Sarnath, near the city of Varanasi, to five ascetics who had been his companions. It is preserved in a Pali text (Pali is the old Indian language in which one major collection of Buddhist texts is written) called the ***Dhammacakkappavattana Sutta***, "Setting in Motion the Wheel of the Dhamma" (*dhamma* means teaching or truth), numbered SN 56.11. The same sermon appears with variants in other early collections, and scholars note that the early records of it are not identical.

  - type: mcq
    id: dates
    title: "When did he live?"
    prompt: |
      Biographers once gave the Buddha's life as about 563 to 483 BCE. Many scholars today place his death about a century later than that traditional "long chronology". According to the Stanford Encyclopedia of Philosophy and the Internet Encyclopedia of Philosophy, which statement is fair?
    options:
      - text: "His dates are debated: most current scholars place his life around the fifth century BCE, with the death as late as about 405 BCE, and no exact date is certain."
        correct: true
        feedback: |
          Right. A 1988 symposium organised by the scholar Heinz Bechert concluded that evidence points to a death later than about 480 BCE, but offered no exact date. So treat "c. fifth century BCE" as the safe statement.
      - text: "His dates are known to the year, because the sermon is dated."
        feedback: |
          The texts carry no calendar dates in our sense, and they were written down centuries later. Dates are reconstructed from chronologies of kings and traditions that disagree.
      - text: "The tradition places him in 623 to 543 BCE, so that is settled history."
        feedback: |
          Some Theravada Buddhists do use dates like 623 to 543 BCE, as a tradition. Historians do not treat them as settled, which is why we keep tradition and history visible side by side.
    explanation: |
      A first lesson in the course's three layers. Layer 1 (documents): the sermon exists in early texts. Layer 2 (scholars): the dating is a live debate, and how much of the early teaching can be recovered is also debated (the texts were written down long after, in other languages than he spoke, and the versions differ). Layer 3 (faith): that he awakened to how things are.

  - type: text
    id: middle
    title: "Two extremes and a middle way"
    body: |
      In the sermon, the Buddha begins by naming two extremes to avoid: "addiction to indulgence of sense-pleasures" and "addiction to self-mortification" (in Piyadassi Thera's translation of the Pali; translations vary). He had tried the second, and the sermon calls both unprofitable. Between them lies a **middle way**, which "gives vision, gives knowledge, and leads to calm, to insight, to enlightenment and to *nibbana*". It is then spelled out as the four truths.

      The first is *dukkha*, usually translated "suffering". Notice the doctor's habit already: before any treatment, a careful description of what is wrong.

  - type: mcq
    id: dukkha-mistranslation
    title: "'Life is suffering'?"
    prompt: |
      A popular summary says: "The Buddha taught that life is suffering." The Buddhist scholar Walpola Rahula, in *What the Buddha Taught* (1959), objects that this translation of *dukkha* is misleading. Which is the best account of his objection?
    options:
      - text: "*Dukkha* covers more than pain: it includes the unsatisfactoriness of impermanent things, so the slogan makes the teaching sound gloomier than the text, which Rahula calls neither pessimistic nor optimistic but realistic."
        correct: true
        feedback: |
          Yes. Rahula's point is that one English word cannot carry a Pali word that includes pain, impermanence and a deeper imperfection. He compares a doctor who frightens a patient with one who denies any illness; the Buddha, he says, describes the illness realistically and offers a cure.
      - text: "*Dukkha* actually means joy, and the translation reversed it."
        feedback: |
          No: *dukkha* is the opposite of *sukha* (ease, happiness). Nobody argues it means joy; the objection concerns how wide its meaning is.
      - text: "The Buddha never spoke about suffering, which was added by later monks."
        feedback: |
          Suffering is central in the sermon itself. Whether every detail of the sermon is early is debated, but not this theme.
    explanation: |
      Some philosophers, such as David Cooper, answer Rahula that the teaching can fairly be called pessimistic, since it says the unawakened life is unsatisfactory; they say Rahula defines pessimism so that the label cannot apply. That disagreement is about the word "pessimism", not about what the text says. We return to this in the traps.

  - type: text
    id: three-kinds
    title: "Three kinds of dukkha"
    body: |
      Later Buddhist writers sort *dukkha* into three kinds, and the scheme is common to several schools.

      - **Pain** (*dukkha-dukkha*): the plain hurt of body and mind: illness, injury, grief.
      - **Change** (*viparinama-dukkha*): even pleasant things end, so happiness that depends on them is fragile; the pain here comes from losing what we held.
      - **Conditioned existence** (*sankhara-dukkha*): the subtlest kind. Everything we experience depends on conditions that keep shifting, so no experience gives lasting satisfaction, even a neutral moment with nothing wrong.

      Only the third needs a new idea, and later lessons build it: dependent origination and no-self.

  - type: mcq
    id: three-kinds-q
    title: "Which kind is it?"
    prompt: |
      Mara is delighted by a holiday on a quiet island. In week two she suddenly feels sad, because she knows it will end on Friday and the joy depends on being there. In the scheme of three kinds of *dukkha* (pain, change, conditioned existence), which kind describes the sadness about the ending?
    options:
      - text: "Change (*viparinama-dukkha*): a pleasant thing carries unease because it does not last."
        correct: true
        feedback: |
          Yes. The experience itself is pleasant; the unease comes from its being impermanent.
      - text: "Pain (*dukkha-dukkha*): the sadness is a plain hurt, like a toothache."
        feedback: |
          Sadness is a mental pain, so this is tempting. But the scheme uses "pain" for the direct hurt of an unpleasant experience, and here the source of the unease is a pleasant thing's ending.
      - text: "None: a holiday is happiness, and happiness is not *dukkha*."
        feedback: |
          The teaching does not deny the happiness. It says happiness that depends on changing things cannot be fully secure, which is why a pleasant experience can still fall under *dukkha* in this scheme.
    explanation: |
      The slip to avoid is "the Buddha says all pleasure is a lie". The text says the opposite: pleasure is real but unreliable, so it cannot be where lasting satisfaction is found.

  - type: text
    id: origin
    title: "The second truth: thirst"
    body: |
      The doctor's second step is the cause. The sermon names it ***tanha***, literally "thirst", usually translated **craving**. It is the pull to have, to be, to be rid of. The Internet Encyclopedia of Philosophy distinguishes it from wanting in general; the sermon lists three forms, in the same translation: "craving for sense pleasure, craving for existence and craving for non-existence (self-annihilation)".

      Why would craving cause *dukkha*? According to the tradition, because we grasp at what changes (the second kind), and push away what hurts (the first). The cause is a habit of the mind, not an outside power, so the problem is in principle in our own hands.

  - type: mcq
    id: craving-q
    title: "What is craving, and what is it not?"
    prompt: |
      A student reads: "According to the second truth, all desire must be uprooted, so a Buddhist must never want anything, not even to help others." What is the best reply, according to the scholars who distinguish *tanha* from wanting in general?
    options:
      - text: "*Tanha* is a specific thirst, for pleasure, for existence, for non-existence; the texts also praise wholesome intentions such as wishing others well, so the claim over-extends the term."
        correct: true
        feedback: |
          Yes. Many teachers distinguish craving from a wholesome wish or intention (right intention is a part of the path itself). How sharply to draw the line is debated, but the claim as stated is too broad.
      - text: "Craving is only about food and drink, so the sermon is about diet."
        feedback: |
          Craving here covers sense pleasures, but also wanting to continue to exist and wanting to disappear. It is far wider than appetite.
      - text: "The sermon blames society and the gods for the suffering, not the mind."
        feedback: |
          The sermon locates the cause in craving, which belongs to the mind. Social and divine causes are not what it names.
    explanation: |
      Notice the third craving, for non-existence: wanting to be annihilated is also a thirst. This is why the teaching does not recommend despair as the way out. Despair is a form of the same craving.

  - type: text
    id: cessation
    title: "The third truth: the ending"
    body: |
      The doctor's third step is the prognosis: can the patient recover? The sermon answers yes. The third truth is that suffering ends with the "complete cessation" of that very craving, giving it up and being freed from it. The state of that ending is called ***nirvana*** (Pali ***nibbana***), literally "blowing out" or "extinguishing", as when a flame goes out because its fuel is gone.

      Within the tradition one distinguishes nirvana "with remainder", attained during life while the body remains, and nirvana "without remainder", at death. Here the readers already part ways about what exactly is being described.

  - type: mcq
    id: nirvana-q
    title: "Two readings of nirvana"
    prompt: |
      Buddhist philosophers have long discussed what nirvana is. One reading says it is mainly the extinguishing of craving, aversion and delusion (a change in the mind). Another says it is also a transcendent reality, a state that exists beyond the conditioned world. Which statement is accurate about this disagreement?
    options:
      - text: "Both readings have defenders among Buddhist schools; for example, the Sautrantika school is reported to treat nirvana as a name for the total cessation of suffering and rebirth, while the Vaibhashika school treated it as a really existing reality."
        correct: true
        feedback: |
          Right, as reported in reference works. The disagreement is old and inside Buddhism, not only a modern outsider's puzzle, and it shows that "extinguishing" does not settle the question by itself.
      - text: "All Buddhists agree that nirvana is a place, like a heaven, where one goes after death."
        feedback: |
          The texts describe it as the ending of craving, not as a place. Describing it as heaven is the slip the traps return to.
      - text: "Nobody ever discussed the question, since the Buddha defined nirvana exactly in the sermon."
        feedback: |
          The sermon names the ending but does not give a theory of what it is. Later schools filled the gap in different ways.
    explanation: |
      A useful reading for the course: even a word that looks like pure negation ("blowing out") raises the question of what is left. Followers of the Buddha, according to the tradition, say the question is best answered by the practice that leads there.

  - type: text
    id: path
    title: "The fourth truth: the path"
    body: |
      The doctor's last step is the treatment. The fourth truth is the **Eightfold Path**: *right view, right intention, right speech, right action, right livelihood, right effort, right mindfulness and right concentration*. ("Right" translates a Pali word meaning something like fitting or complete.) Teachers group the eight into three trainings.

      - **Wisdom** (*panna*): right view and right intention.
      - **Ethical conduct** (*sila*): right speech, right action, right livelihood.
      - **Meditation** (*samadhi*, concentration): right effort, right mindfulness, right concentration.

      The eight are not strictly steps one after the other, but parts to develop together, with each supporting the others.

  - type: mcq
    id: path-q
    title: "Which belong to wisdom?"
    multiple: true
    prompt: |
      In the usual grouping of the Eightfold Path into three trainings (wisdom, ethical conduct, meditation), which of these belong to the **wisdom** group? Select all that apply.
    options:
      - text: "Right view"
        correct: true
        feedback: |
          Yes: seeing things as they are, which includes understanding the four truths.
      - text: "Right intention"
        correct: true
        feedback: |
          Yes: the aims one acts from, such as renunciation of craving, goodwill and harmlessness.
      - text: "Right speech"
        feedback: |
          It belongs to ethical conduct (*sila*), along with right action and right livelihood.
      - text: "Right mindfulness"
        feedback: |
          It belongs to meditation (*samadhi*), with right effort and right concentration.
    explanation: |
      The grouping is a teaching device, and sources word the factors slightly differently (right intention is also translated "thought" or "resolve"). The point to keep: the cure involves understanding, conduct and mental training together.

  - type: order
    id: doctor-order
    title: "The doctor's order"
    prompt: |
      Put the four truths in the order the sermon gives them, each described by the doctor's step it matches.
    steps:
      - "Name the illness: suffering (*dukkha*) is described honestly."
      - "Find the cause: craving (*tanha*) is the origin of that suffering."
      - "Give the prognosis: the suffering can end, with the ending of craving (*nirvana*)."
      - "Prescribe the treatment: the Eightfold Path of wisdom, conduct and meditation."
    hint: "A doctor does not prescribe before diagnosing, and does not promise a cure before knowing the cause."
    explanation: |
      Scholars including the Buddhist studies author Anālayo describe the four truths as following a medical way of analysing a disease; Richard Gombrich notes that there is no early text that says the sermon was modelled on medicine, though the idiom of the time makes it plausible. One may read the pattern as a borrowed schema or as a natural order for any problem-solving; either way, the practical shape is the same.

  - type: mcq
    id: traps-pessimism
    title: "Is Buddhism pessimistic?"
    prompt: |
      A friend says: "Buddhism is pessimistic, because it begins by saying that everything is suffering." Which reply best respects both the text and the opposing view?
    options:
      - text: "The first truth is only the diagnosis; the next three give a cause, a possible ending and a method, so the whole is meant as hopeful. Critics such as David Cooper argue that the diagnosis alone can still fairly be called pessimistic, and that Rahula's 'realistic' sidesteps that."
        correct: true
        feedback: |
          Yes: it keeps the structure of the sermon and the live disagreement on the word.
      - text: "Buddhism is simply optimistic and denies that suffering is real."
        feedback: |
          The sermon begins by naming birth, ageing, sickness and death as suffering. The doctor who denies the illness is exactly the 'optimist' Rahula contrasts with the Buddha.
      - text: "Nobody has ever called Buddhism pessimistic; it is a Western slander."
        feedback: |
          Some philosophers, including David Cooper, have defended the label. The question is open as a question about the word.
    explanation: |
      The label turns on what "pessimism" means. If it means "the unawakened life is unsatisfactory", the text agrees. If it means "nothing can be done", the text denies it. Naming this prevents both easy answers.

  - type: mcq
    id: traps-heaven
    title: "Is nirvana heaven?"
    prompt: |
      A reader says: "Nirvana is the Buddhist word for heaven, the reward for good people after death." What is the best correction, according to how the texts and reference works describe it?
    options:
      - text: "In the texts nirvana is the ending of craving, aversion and delusion, reached in this life by the awakened, with a final stage at death; it is not described as a place of reward for the good."
        correct: true
        feedback: |
          Yes. Buddhist cosmology does contain heavens, but they are part of the cycle of rebirth, not its ending; nirvana is spoken of as the end of that cycle.
      - text: "It is a heaven, but only one ruled by the Buddha."
        feedback: |
          The texts do not present the Buddha as a ruler of a heaven. Heavens in Buddhist cosmology are temporary places inside the cycle of rebirth.
      - text: "It is pure nothing, so nirvana means that the person is destroyed."
        feedback: |
          That is the opposite slip. The tradition says the person who attains it is freed from craving, not that a self is destroyed, and the texts decline to say simply 'annihilated'. How to describe what remains is exactly the open question of the two readings.
    explanation: |
      Two easy images, "heaven" and "nothingness", are both wrong in the same way: each turns nirvana into a place or a thing. The text describes an ending of a process.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Match the claim to its layer. Which one is a **live scholarly debate**, neither established record nor a matter of faith?
    options:
      - text: "Whether the Buddha's first sermon, as we have it, preserves what he said, or is a later arrangement of the teaching."
        correct: true
        feedback: |
          Yes. The sermon survives in several early collections with differences, and scholars disagree on how far one can reconstruct the original.
      - text: "That the sermon is preserved in the Pali collection as SN 56.11, with the four truths in this order."
        feedback: |
          This is a documented fact about the text, not a debate. What is debated is how early it is.
      - text: "That awakening shows the true nature of reality."
        feedback: |
          This is a commitment held by Buddhists on the basis of their tradition; historians do not decide it, and neither does a lesson.
    explanation: |
      Keeping the three layers apart helps a Buddhist, an agnostic and a sceptic all say "that is fair". The text is a record; its reliability is a scholarly question; its truth is each person's to weigh.

  - type: text
    id: summary
    body: |
      **Next:** the four truths describe suffering and its cause as craving, but craving seems to need someone who craves. What is that someone? The next lesson, *No Self*, takes up the Buddha's surprising answer, the five aggregates, and compares it with Hume and Parfit.
