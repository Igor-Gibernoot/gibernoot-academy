id: ch18-anatta
title: "No Self"
kind: concept
own: |
  The setting: the teaching of *anatta* ("not-self") in the Pali discourses attributed to the Buddha (fifth century BCE, dates debated), as read by scholars, and two modern Western views often compared with it, those of David Hume (1739) and Derek Parfit (1984). Everything is taught according to these sources; whether any of it is true is left to each reader.
  - **The five aggregates.** According to the Pali texts, a person can be described as five groups (*khandha*, Sanskrit *skandha*, "heaps"): {{ form (*rupa*, the body), feeling (*vedana*), perception (*sanna*), volitions or formations (*sankhara*), and consciousness (*vinnana*) }}. Each is a changing process, and together they are what craving clings to.
  - **The argument of the discourse on not-self.** Taken one aggregate at a time, the discourse says: P1, it is {{ impermanent }}; P2, what is impermanent is {{ unsatisfactory (*dukkha*) }}; P3, what is impermanent and unsatisfactory is not fit to be regarded as "this is mine, this is my self, this is what I am". The conclusion C is that none of the five is the self. A critic can reject P1 (some part lasts), P2 (change need not hurt) or the step to C (a self could be the whole, or something the five do not exhaust).
  - **No self is not no person.** The same texts speak freely of persons, and the chariot comparison says a person is a name for parts in relation, just as "chariot" names its parts assembled. Ordinary talk of "you" is {{ conventionally true }}, and what is denied is a lasting owner behind the aggregates.
  - **Hume and Parfit.** According to Hume, looking inward finds only particular perceptions, so a person is a bundle of perceptions. According to Parfit, a person's existence consists in a body, a brain and a series of connected mental events, a view called **reductionism**, and he says that what matters is connectedness and continuity of these, not {{ strict identity }}. Siderits argues that Buddhist reductionism can answer objections to Parfit's.
  - **Where they part.** The Buddhist texts aim at ending craving and *dukkha*, and they come with a path of practice; Hume and Parfit offer arguments, not a path. Scholars dispute how far Parfit's remark that the Buddha would have agreed with him is fair.
  - **Who is reborn?** According to the Buddhist reply, nothing passes from life to life: later events depend causally on earlier ones, like a flame lit from another flame, so the later being is {{ neither the same as nor wholly different from }} the earlier. A sceptic can reply that the objection is moot because rebirth itself is a matter of faith, not of evidence.
  - **Three layers.** Established: the texts list five aggregates and give the argument. Debated: whether early Buddhism denies any self at all or only that the aggregates are the self, and how close Parfit is. Faith: rebirth, and that seeing no-self frees one from *dukkha*.

cards:
  - type: mcq
    id: hook
    title: "Guess: is there one you underneath?"
    prompt: |
      Guessing is the point; no background is needed. Think of yourself at five years old and today. Your body has replaced nearly all its material, your memories have changed, and your tastes and character are not the same. Yet you say "that was me". What is the most natural first guess about what makes it you?
    options:
      - text: "There must be something that stays the same under all the changes, a core self that owns the body, memories and character."
        correct: true
        feedback: |
          This is the common first guess, and many traditions give it a name (soul, *atman*, the ego). The Buddha's teaching on *anatta*, the topic of this lesson, is an argument that this guess fails, so the first guess is a good place to start from.
      - text: "Nothing needs to stay the same; the word 'me' simply names whatever happens to be here now."
        feedback: |
          This is closer to where the lesson ends up, but as a first guess it is too quick: it has to explain why the story feels like one story. We will see the Buddhist argument for something like it, and what it keeps.
      - text: "Only the body matters; memories and character change too much to count."
        feedback: |
          The body changes too, as cells are replaced, so it is no steadier than the rest. Philosophers who tie identity to the body or brain give reasons, which the lesson What Is the Self? laid out.
    explanation: |
      The question is old: what, if anything, is the one thing that persists through all this change? The lesson follows how the Buddhist texts answer it, compares the answer with two Western thinkers, and asks what each answer would mean for how we live.

  - type: mcq
    id: craver
    title: "Craving needs a craver?"
    prompt: |
      Recall: according to the first sermon attributed to the Buddha, the cause of *dukkha* (the unsatisfactoriness of life) is *tanha*, "thirst" or craving, and its ending is *nirvana* ("blowing out"). A sharp reader objects: "craving is something someone does. Surely craving needs a craver, a self who wants and is released." What does this objection show about what the teaching must say next?
    options:
      - text: "It must say what the craver is, since if the craver were a lasting self, ending craving would seem to be about that self."
        correct: true
        feedback: |
          Yes. The four truths speak of suffering and its cause, and a natural reading puts a self underneath. The teaching on not-self is the Buddha's answer to what, if anything, is there.
      - text: "It shows the four truths are contradictory and can be dropped."
        feedback: |
          The objection asks for further explanation, not a contradiction. The texts do give one, which is the subject of this lesson.
      - text: "It shows that only a god could be the craver."
        feedback: |
          The texts do not appeal to a god here. They examine the person directly.
    explanation: |
      The next step is to look carefully at what a person is made of, and ask of each part whether it could be the craver, the owner of experience.

  - type: text
    id: aggregates
    title: "A person as five heaps"
    body: |
      According to the Pali discourses, a person can be described as five groups, called ***khandhas*** in Pali (*skandhas* in Sanskrit, "heaps" or "aggregates"). The Buddha is reported to say that these five are what craving clings to. Here they are, one at a time, with a plain gloss.

      **Form** (*rupa*): the body and matter, the solid and the sensible. **Feeling** (*vedana*): the pleasant, unpleasant or neutral tone that comes when something is sensed. **Perception** (*sanna*): recognising, picking out and labelling, as in "that is a face, that is my friend". **Volitions** or **formations** (*sankhara*): intentions, habits and dispositions that shape what we do, shaped in turn by past actions. **Consciousness** (*vinnana*): awareness of what arises through the five senses and the mind.

      The glosses follow the Internet Encyclopedia of Philosophy's article on the Buddha, and scholars such as Rupert Gethin describe the five as aspects of an individual's experience of the world. Notice what the list does not contain: no seventh item called "the owner".

  - type: mcq
    id: sort-perception
    title: "Which heap?"
    prompt: |
      You walk into a kitchen and smell something, and at once think "that is my grandmother's bread". Which aggregate does the **recognising and labelling** ("that is bread, that is hers") belong to?
    options:
      - text: "Perception (*sanna*)."
        correct: true
        feedback: |
          Yes. *Sanna* is the picking out and naming of what is sensed.
      - text: "Feeling (*vedana*)."
        feedback: |
          The pleasant tone of the smell is feeling, but the recognising is a separate step: you can feel pleasure and not know what it is.
      - text: "Form (*rupa*)."
        feedback: |
          The nose and the airborne molecules are form. Recognising is something the mind does with what form delivers.
    explanation: |
      One everyday moment already involves several aggregates: the smell reaching the body (form), the pleasant tone (feeling), the recognition (perception), the wish to go and eat (volition), and the awareness of it all (consciousness).

  - type: mcq
    id: sort-volition
    title: "Which are volitions?"
    prompt: |
      Select every item that the Pali texts would place under **volitions or formations** (*sankhara*): intentions, habits and dispositions that shape action.
    multiple: true
    options:
      - text: "A decision to speak kindly."
        correct: true
        feedback: |
          Yes, a decision is an intention.
      - text: "A long habit of getting angry when interrupted."
        correct: true
        feedback: |
          Yes, a habit is a disposition built from past actions.
      - text: "The warmth you feel on your skin in the sun."
        feedback: |
          This is feeling, the pleasant tone of a sensation.
      - text: "The colour red, as seen."
        feedback: |
          Seeing red involves form (the eye and light) and consciousness (the awareness of it); the recognition "that is red" is perception.
    explanation: |
      Volitions are the aggregate closest to what we call will and character, which is why the idea that no aggregate is the self reaches character as well, not only the body.

  - type: text
    id: argument
    title: "The argument"
    body: |
      How does the Buddha get from the list to "no self"? According to the discourse on the characteristic of not-self (SN 22.59 in the Pali collection), he speaks to the five monks he had taught in his first sermon, and goes through the five aggregates one by one with questions. Is form constant or inconstant? Inconstant. Is what is inconstant easeful or stressful? Stressful. Is it fit to regard what is inconstant, stressful and subject to change as "this is mine, this is my self, this is what I am"? It is not. The same goes for feeling, perception, volitions and consciousness.

      The discourse adds a second line: if form were the self, it would not lend itself to affliction, and one could command it to be this way or that. Since it does lend itself to affliction and cannot be commanded at will, it is not the self. This is the **control** argument, read by the Internet Encyclopedia of Philosophy as part of the same reasoning.

      Set out as premises, for each aggregate $X$ (form, feeling, perception, volitions or consciousness):

      P1. $X$ is impermanent.

      P2. What is impermanent is unsatisfactory (*dukkha*).

      P3. What is impermanent and unsatisfactory is not fit to be regarded as "mine", "my self".

      C. So $X$ is not my self.

  - type: order
    id: argument-order
    title: "Put the argument in order"
    prompt: |
      Put the steps of the argument from the discourse on not-self in order, for one aggregate, say feeling.
    steps:
      - "Feeling is impermanent: pleasant feelings fade and unpleasant ones come."
      - "What is impermanent does not give lasting satisfaction, so it is *dukkha*."
      - "What is impermanent and unsatisfactory is not fit to be regarded as 'this is my self'."
      - "So feeling is not my self; the same is then said of the other four aggregates."
    hint: |
      A chain: a fact about the part, a link to *dukkha*, a verdict on whether it can be the self, then the conclusion.
    explanation: |
      The conclusion is drawn aggregate by aggregate, so the argument never needs the hidden owner to be seen. It only asks whether each candidate can play the part of a lasting owner.

  - type: mcq
    id: critic
    title: "Which premise would a critic reject?"
    prompt: |
      The argument has P1 (each aggregate is impermanent), P2 (what is impermanent is unsatisfactory) and P3 (what is impermanent and unsatisfactory is not fit to be the self). A critic from the school of Vedanta that we met in the lesson on Brahman holds that a real self exists and is changeless, and says the argument fails. Which reply is the most natural one for that critic?
    options:
      - text: "The argument shows that the *aggregates* are not the self, but the self is the changeless witness behind them, which the list of changing items never touches."
        correct: true
        feedback: |
          Yes. This accepts P1 to P3 for the five aggregates and denies that they exhaust what there is. The Buddhist reply is that such a witness is never found in experience, which is why the texts treat the "self" as an unneeded extra. Whether the texts deny any self whatever or only that the aggregates are the self is a scholarly debate (the Internet Encyclopedia of Philosophy notes a minority holding the second).
      - text: "P1 is false: the body does not change at all."
        feedback: |
          The body visibly changes, as does everything the list includes. Few critics would take this route.
      - text: "The argument is invalid because it mentions five heaps instead of one."
        feedback: |
          The argument is valid for each aggregate in turn. The count is irrelevant; what matters is whether the list is complete.
    explanation: |
      Notice the structure: the argument is valid, and its premises can be accepted for the five aggregates. The dispute is about whether the list of five is complete, and whether "fit to be regarded as self" has been settled by the test of change and control. Different readers part ways on exactly those points.

  - type: mcq
    id: control
    title: "A test of control"
    prompt: |
      The control version of the argument says: if something were my self, I should be able to command it to be as I wish, and it would not cause affliction. Which everyday fact would a defender of the argument point to as support?
    options:
      - text: "We cannot simply decide not to feel pain, to stop ageing, or to recognise nothing, though we would often choose to."
        correct: true
        feedback: |
          Yes. These are cases where aggregates do not obey a command, which the argument treats as a mark that they are not the owner of experience.
      - text: "We can raise an arm whenever we like, so the body is fully ours to command."
        feedback: |
          This is the objection a critic would make, and it is a real one: some control exists. The argument's reply is that the control is partial and conditional, and that we cannot command the body not to age or not to fall ill.
      - text: "A self cannot be known by anyone, so it cannot exist."
        feedback: |
          This is a different argument. The control argument is about what we can command, not about knowability.
    explanation: |
      The control premise is the easiest place for a critic to push back, since some control plainly exists. The argument's answer is that the point is a limit on the control, not its absence. Whether that answer succeeds is exactly the kind of question the lesson leaves open.

  - type: mcq
    id: person
    title: "No self, or no person?"
    prompt: |
      According to scholars of the Pali texts, the Buddha denies that the five aggregates are a lasting self. Which is the most accurate statement of what follows for everyday talk about persons?
    options:
      - text: "Ordinary talk of persons, names and responsibility stays in use, as a convenient way of speaking about the aggregates in relation; what is denied is a lasting owner behind them."
        correct: true
        feedback: |
          Yes. The Internet Encyclopedia of Philosophy says the doctrine does not deny all talk of self but excludes a permanent, independent self. Later Buddhist philosophers call everyday talk conventionally true.
      - text: "Persons do not exist at all, so it is a mistake to say 'Igor' or to hold anyone responsible."
        feedback: |
          Buddhist texts speak of persons, teachers, students and the results of actions all the time. The claim is that the person is not a separate, lasting thing.
      - text: "The self exists, but is made of exactly five parts which never change."
        feedback: |
          The five aggregates are themselves changing processes. Nothing in the list is permanent.
    explanation: |
      This is the difference between "there is no self" read as "nobody is here" and read as "what is here is a process, not a lasting owner". The second reading is the one the texts support, and it is why the teaching still leaves room for ethics and for treating people as people.

  - type: mcq
    id: chariot
    title: "The chariot"
    prompt: |
      In the *Milindapanha*, a Pali text of dialogues between the monk Nagasena and the Indo-Greek king Milinda (a work scholars date to between about 100 BCE and 200 CE), Nagasena asks the king whether the chariot he came in is the pole, the axle, the wheels, the frame, or any of the other parts. The king says no to each, and then no to "something apart from the parts". Nagasena then says that "chariot" is just a name for the parts when assembled in a certain way, and that "Nagasena" is likewise a name for the aggregates in relation. What is the point of the comparison?
    options:
      - text: "A whole can be a useful name for parts in relation without being an extra thing over and above them; a person is like that."
        correct: true
        feedback: |
          Yes. The comparison is used to show that "person" is a convenient label for the aggregates in relation, so denying a separate self does not mean denying that anyone is here. Scholars such as Siderits read this as a kind of reductionism about wholes, though some dispute that it is as strong as saying only the parts are real.
      - text: "A chariot does not exist, and neither do we."
        feedback: |
          The king uses the chariot to get around; the point is that the word is a label, not that the vehicle is an illusion.
      - text: "Each part of the chariot is itself a small chariot."
        feedback: |
          No part is a chariot; that is the king's answer each time he is asked.
    explanation: |
      The text leaves open exactly how strong the reduction is: that wholes are nothing but conventions, or that wholes are real in a weaker sense. This is a live debate among scholars of Buddhist philosophy.

  - type: text
    id: hume
    title: "Hume's bundle"
    image:
      src: img/hume.webp
      alt: "Painted portrait of David Hume in a brown coat and red cap, by Allan Ramsay"
      caption: "David Hume (1711-1776), here in Allan Ramsay's portrait, looked inward for a self and wrote that he found only particular perceptions."
      credit: "Allan Ramsay, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Allan_Ramsay_-_David_Hume,_1711_-_1776._Historian_and_philosopher_-_PG_3521_-_National_Galleries_of_Scotland.jpg"
    body: |
      Two thousand years later and a continent away, the Scottish philosopher David Hume (1711-1776) reached a similar-sounding result by a different route. In his *Treatise of Human Nature* (1739), he wrote that when he looked inward at what he called himself, he always stumbled on some particular perception or other, a heat or cold, a light or shade, love or hatred, pain or pleasure, and never caught himself without a perception. He concluded that other people, too, are nothing but a bundle or collection of different perceptions. In an appendix to the work he came back to the problem and said he found his own account unsatisfying on how the perceptions are bound together.

      Hume's argument is empirical: if there were a self, it should show up in experience, and it does not. The Buddhist argument adds to this the point about change and control. Both leave a series of events, and both ask where the unity comes from.

  - type: mcq
    id: hume-q
    title: "Hume and the Buddhist argument"
    prompt: |
      According to scholars who compare them, Hume's bundle theory and the Buddhist teaching on the five aggregates are similar. Which is a real **difference** in how the two arrive at "no lasting self"?
    options:
      - text: "Hume appeals to what introspection finds (no self among the perceptions); the Buddhist discourse argues from change and from lack of control, and is part of a practice aimed at ending *dukkha*."
        correct: true
        feedback: |
          Yes. Hume's point is that a self is not found in experience; the texts also give an argument from impermanence and control, and they place the result inside a path of training.
      - text: "Hume denies that perceptions exist, while the Buddhist texts accept them."
        feedback: |
          Both accept that perceptions or aggregates occur. Both deny a lasting owner behind them.
      - text: "Hume was writing about the soul after death, and the Buddhist texts were not."
        feedback: |
          Hume's discussion in the Treatise is about the self in this life. The Buddhist texts do discuss rebirth, and we come to it below.
    explanation: |
      The similarity is real, and Hume himself, in his appendix, doubted his own account. The difference is the aim: Hume offers a philosophical analysis, while the Buddhist texts offer a diagnosis with a cure.

  - type: text
    id: parfit
    title: "Parfit and reductionism"
    image:
      src: img/parfit.webp
      alt: "Photograph of Derek Parfit speaking at a lecture"
      caption: "Derek Parfit (1942-2017), an Oxford philosopher whose book Reasons and Persons (1984) argued that what matters in survival is not strict identity."
      credit: "Anna Riedl, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Derek_Parfit_at_Harvard-April_21,_2015-Effective_Altruism_(cropped).jpg"
    body: |
      Derek Parfit (1942-2017) gave the view its best-known modern form in *Reasons and Persons* (1984). Recall the teletransporter puzzle from the lesson on the self: a machine copies you atom by atom and rebuilds you elsewhere. Parfit argued for **reductionism** about persons: a person's existence consists in a body, a brain and a series of connected mental events, and can be described without saying that the person is a further, separately existing thing. On his view, what matters in survival is **connectedness** (links such as memory and intention) and **continuity** (overlapping chains of them), not strict identity.

      Parfit himself said that the Buddha would have agreed with this view. The remark is in *Reasons and Persons*, and he is reported to have learned of the Buddhist parallel from the Indian philosopher Bimal Krishna Matilal. Scholars have debated how fair it is.

      The philosopher Mark Siderits, in *Personal Identity and Buddhist Philosophy: Empty Persons* (2003), argues that Buddhist reductionism, worked out by later Indian Buddhist philosophers, is meant to be reductionist without being eliminativist (it does not say persons are illusions) and can answer objections made to Parfit's view.

  - type: mcq
    id: reduction-q
    title: "What does reductionism say?"
    prompt: |
      A student writes: "Parfit and the Buddha both say persons are an illusion, so nobody is ever really here." Which correction is most accurate?
    options:
      - text: "Reductionism says persons exist but are nothing over and above bodies, brains and connected mental events; it does not say nobody is here."
        correct: true
        feedback: |
          Yes. A reductionist can still say persons exist, as a table exists though it is made of wood. The claim is that the person is not an extra, separately existing thing.
      - text: "Both hold that persons exist as lasting souls, but are hard to see."
        feedback: |
          The opposite: both reject a lasting soul-like self.
      - text: "Parfit says persons are an illusion; the Buddha says they are real."
        feedback: |
          Neither is put this way. Both accept ordinary persons; they deny a further, lasting owner.
    explanation: |
      The word "illusion" invites the mistake. A table is not an illusion because it is made of parts, and a person need not be either. The dispute is about what the person consists in.

  - type: mcq
    id: ethics
    title: "Where they part: ethics"
    prompt: |
      Parfit drew a moral from his view: if what matters is connectedness and continuity, and these come in degrees, then the gap between my life and other people's lives is less deep than we usually take it to be. He reported that this changed how he felt about others. Buddhist traditions also draw ethical conclusions from no-self, and scholars compare the two. Which is a reported difference?
    options:
      - text: "In the Buddhist texts the teaching on no-self is part of a path of practice that aims at ending craving and *dukkha*; Parfit's aim is to settle what we have reason to care about, and critics say he takes the Buddhist view out of its context."
        correct: true
        feedback: |
          Yes. The critic Aruni Samarasinghe argues roughly this, that Parfit takes the view out of its context, and that the difference lies in what each does with it once reached. Others, such as Javier Hidalgo, argue the Buddhist view can justify key features of Parfit's.
      - text: "Parfit says his view has no ethical consequences, while the Buddhist texts say it has many."
        feedback: |
          Parfit draws several moral conclusions, including the one in the prompt.
      - text: "Only Buddhists have ever argued that no-self supports compassion."
        feedback: |
          Parfit argued for something similar. Scholars such as Siderits, Pettit and Goodman have argued that no-self supports a consequentialist or altruist reading of Buddhist ethics, and others, such as Paul Williams, have objected.
    explanation: |
      Even among scholars it is debated whether no-self really entails compassion: the step from "the self is not a lasting thing" to "I should care for others" needs a further premise, and different thinkers supply different ones.

  - type: mcq
    id: reborn
    title: "Who is reborn?"
    prompt: |
      An objection that Buddhists have faced since ancient times: "if there is no lasting self, and rebirth is part of the teaching, then nothing passes from one life to the next, so who is reborn and who reaps the results of actions?" According to the *Milindapanha*, Nagasena answers in essence with the image of one flame lit from another. What does the image say?
    options:
      - text: "The new flame depends on the old one without being the same flame: the later being is neither the same as nor wholly different from the earlier, linked by cause and effect."
        correct: true
        feedback: |
          Yes. In essence, this is the reply attributed to Nagasena (I give it as reported in the text, not as a quotation). It also fits the aggregates as processes: no thing travels, but a causal chain continues, which the next lesson on dependent origination spells out.
      - text: "A tiny soul jumps from the old body to the new one, like a spark."
        feedback: |
          A soul that travels is exactly what the teaching denies. The flame image is chosen because nothing needs to be transferred.
      - text: "Nobody is reborn and nothing continues, so the objection simply fails."
        feedback: |
          The texts do claim continuity of a kind (a causal chain), so they do not say nothing continues. They deny a lasting self, not continuity.
    explanation: |
      That is the Buddhist reply. A sceptic has another: the objection assumes rebirth, and rebirth is a matter of faith, not of evidence. Parfit's connectedness view is a secular cousin of the Buddhist reply, since it also says the chain of links is what matters, but it does not need rebirth.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Which claim is a **live scholarly debate**, neither established record nor a matter of faith?
    options:
      - text: "Whether the early texts deny any self whatsoever, or only deny that the five aggregates are the self."
        correct: true
        feedback: |
          Yes. The Internet Encyclopedia of Philosophy says most scholars take the first view and a minority the second.
      - text: "That the Pali discourses list the five aggregates and give the argument from change and control."
        feedback: |
          This is a documented fact about the texts, not a debate.
      - text: "That seeing there is no lasting self frees a person from *dukkha*."
        feedback: |
          This is a commitment of the tradition, tested by practice for those who follow it; historians cannot settle it, and neither can this lesson.
    explanation: |
      Keeping three layers apart lets a Buddhist, a Humean, a reductionist and a sceptic all say "that is fair": the texts are a record, their meaning is a scholarly question, and their truth is for each reader to weigh.

  - type: text
    id: summary
    body: |
      **Next:** if a person is a changing process, what makes one moment depend on the previous one? The Buddha's answer, *dependent origination*, is a claim that everything arises from conditions, and the twelve links read as a causal argument. That is the next lesson, *Dependent Origination*.
