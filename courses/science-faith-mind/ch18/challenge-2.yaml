id: ch18-challenge-2
title: "Level Challenge: Suffering, Self and Emptiness (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: a village harvest and a closing weighing"
    body: |
      Problems 4 and 5 use an **invented** village and invented numbers, built to practise on a case you have never seen. Where a real thinker or text appears, it is named as "according to".

      - **Problem 4 · Emptiness and dependent origination against Western causation.** A village harvest counted three ways: all the conditions it depends on, constant conjunction, and "what if it had not been?". Then a critic's reply and a Madhyamaka answer.
      - **Problem 5 · The closing weighing of the whole level.** Self, mind and God, Buddhist and Western views, sorted by layer and weighed by what would count as evidence.

      **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. A claim never moves up a layer by being repeated.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      Tools from the level, each stated so it can be used alone.

      - **Emptiness.** According to Nagarjuna (traditionally c. 150 to 250 CE), whatever arises from conditions lacks *svabhava* ("own-being", a nature of its own, independent of causes, parts and conditions). To be empty is to be empty *of svabhava*, not to be non-existent. Schematically: $x$ depends on conditions, therefore $x$ is empty of svabhava.
      - **Two truths.** Conventional truth: tables, persons and harvests exist and can be talked about. Ultimate truth: they are empty of svabhava.
      - **Dependent origination.** According to the discourses, "When this is, that is; when this isn't, that isn't." A condition is something the later item depends on; it is not always the only cause. Cutting a link stops the links that depend on it.
      - **Hume on causation.** David Hume (1711-1776), in *A Treatise of Human Nature* (1739-40) and *An Enquiry concerning Human Understanding* (1748), argues that we never observe a necessary connection between a cause and its effect, only that objects of one kind are regularly followed by objects of another: **constant conjunction**. In the *Enquiry* he also gives a second definition, a **counterfactual** one: "if the first object had not been, the second never had existed". Scholars debate how the two fit and whether Hume thought causation is nothing more.
      - **The self.** According to Hume, a bundle of perceptions; according to Parfit, what matters is connectedness and continuity; according to the Pali texts and the chariot test, no self apart from the five aggregates, yet persons are conventionally real.
      - **Layers.** Fact, debate, commitment.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · The harvest of Orun"
    body: |
      **Problem 4.** In the invented village of Orun a field gives a harvest only under certain conditions. Three things can vary each season: whether **rain** falls, whether the **canal gate** is opened (the canal is a second source of water), and whether **seed** was sown. A harvest comes when seed was sown and water arrives by rain or by canal (or both). Over eight seasons, every combination happened exactly once:

      | Season | Rain | Gate open | Seed | Harvest |
      |---|---|---|---|---|
      | 1 | no | no | no | no |
      | 2 | no | no | yes | no |
      | 3 | no | yes | no | no |
      | 4 | no | yes | yes | yes |
      | 5 | yes | no | no | no |
      | 6 | yes | no | yes | yes |
      | 7 | yes | yes | no | no |
      | 8 | yes | yes | yes | yes |

      The task: say what the Buddhist teaching of dependent origination and emptiness claims about this harvest, set it beside two Western ways of analysing causation, and decide where the two traditions agree and where thoughtful people part ways.

  - type: mcq
    id: p4-empty
    title: "What 'empty' claims about the harvest"
    prompt: |
      A villager says: "Nagarjuna would say the Orun harvest is empty, so there is no harvest." According to Nagarjuna, what does calling the harvest *empty* actually claim?
    options:
      - text: "The harvest has no svabhava, no nature of its own independent of rain, canal, seed, labour and the people who call it a harvest; it is a real, conventionally existing harvest, and it depends on those conditions."
        correct: true
        feedback: |
          Yes. Emptiness is emptiness *of svabhava*. The harvest feeds the village; what it lacks is an independent essence. This is why dependent origination and emptiness are two names for one fact.
      - text: "The harvest does not exist, because nothing exists."
        feedback: |
          This is the nihilist reading, which Nagarjuna's defenders reject: they say his middle way runs between "it exists by its own nature" and "nothing exists". Some critics still argue that his arguments lead there, which is a live debate, but it is not what the claim says.
      - text: "The harvest has a hidden essence, 'harvest-ness', that the seasons only reveal."
        feedback: |
          That is the view of svabhava, the very thing Nagarjuna denies. A nature that the conditions merely revealed would be independent of them.
    explanation: |
      Layers: that Nagarjuna's verses say this is **fact** about the text; how to read them (nihilist, anti-realist, a middle path) is a **debate**; that seeing emptiness frees one from suffering is a **faith** commitment.

  - type: mcq
    id: p4-formula
    title: "'When this is, that is' against constant conjunction"
    prompt: |
      Two sentences about Orun. The Pali formula: "When this is, that is; when this isn't, that isn't." Hume's first definition, in essence: a cause is an object followed by another, where all objects similar to the first are followed by objects similar to the second. Read the table. Which statement is true?
    options:
      - text: "Both sentences speak of regular dependence, but the formula puts the weight on the conditions that make the later thing possible, while Hume's definition puts it on what is observed to follow what; neither by itself says which conditions the harvest needs."
        correct: true
        feedback: |
          Yes. The formula is about conditioning, and Hume's definition is about regular succession, which is what an observer can record. The table is needed to say what depends on what.
      - text: "They say the same thing in different words, and Hume was drawing on Buddhist texts."
        feedback: |
          Hume's account grew out of his own argument about the origin of our idea of necessity, a debate in Europe. The similarity of the two sentences is real, but no one has shown that Hume knew these texts, and the overlap does not make them identical.
      - text: "Hume denies that anything depends on anything, and the formula affirms it."
        feedback: |
          Hume does not deny that effects follow causes. In essence he denies that we observe a necessary connection beyond the regular succession, a claim that is itself debated among scholars.
    explanation: |
      Label: **debate** on how close the two ideas really are. A fair comparison names the shared point (causes are patterns of dependence) and the difference (Hume asks what we can observe; the Buddhist teaching asks what conditions ending suffering).

  - type: numeric
    id: p4-count
    title: "How many harvests?"
    prompt: |
      In the Orun table of eight seasons (each combination of rain, canal gate and seed exactly once; a harvest comes when seed was sown and water arrives by rain or by canal or both), how many seasons gave a harvest?
    answer: 3
    wrong:
      - { value: 4, feedback: "4 is the number of seasons in which seed was sown. Seed is needed but not enough: in season 2 seed was sown and there was no water, so no harvest." }
    hint: Look at the seasons with seed and then at which of those have water.
    explanation: |
      Four seasons have seed (2, 4, 6, 8). Of these, season 2 has neither rain nor canal water, so three seasons (4, 6, 8) gave a harvest.

  - type: numeric
    id: p4-conj
    title: "Is rain constantly conjoined with harvest?"
    prompt: |
      In the Orun table, rain fell in 4 of the 8 seasons (5, 6, 7, 8). In what fraction of the seasons with rain did a harvest follow? Give a number between 0 and 1.
    answer: 0.5
    tolerance: 0.001
    wrong:
      - { value: 1, feedback: "A fraction of 1 would mean rain was always followed by harvest, which is what constant conjunction needs. Seasons 5 and 7 had rain but no seed, and no harvest." }
    hint: Count the rain seasons that also had seed.
    explanation: |
      Of the rain seasons, 6 and 8 had seed and gave a harvest; 5 and 7 had no seed and gave none. That is $2/4 = 0.5$. So rain alone is not constantly conjoined with harvest. Hume's definition needs "all objects similar to the first" to be followed, so the regularity must be stated with the whole set of conditions: seed and water by rain or canal.

  - type: numeric
    id: p4-counterfactual
    title: "The counterfactual count"
    prompt: |
      Take season 8, where rain fell, the gate was open and seed was sown, and a harvest came. Remove **one** of the three things at a time, leaving the other two as they were: first the rain, then the gate, then the seed. For how many of these three removals would the harvest not have come?
    answer: 1
    wrong:
      - { value: 3, feedback: "3 would mean each of the three is individually necessary. Without rain the canal still waters the field (season 4), and without the canal the rain does (season 6)." }
      - { value: 0, feedback: "Removing the seed leaves nothing to grow (season 7), so the harvest would not have come." }
    hint: Check seasons 4, 6 and 7 of the table against season 8.
    explanation: |
      Without rain: season 4, harvest. Without the gate: season 6, harvest. Without seed: season 7, no harvest. So only 1 of the 3 removals stops the harvest. On Hume's second definition ("if the first object had not been, the second never had existed") only the seed counts as a cause, though all three are conditions the harvest depends on.

  - type: mcq
    id: p4-compare
    title: "What the two counts show"
    prompt: |
      The counterfactual count singles out the seed, while all three (rain, canal, seed) are conditions in the Buddhist sense. What does this difference show?
    options:
      - text: "The counterfactual test picks out what the effect cannot do without, in the case as it was; dependent origination lists everything the effect depends on, including backups that were not needed this time."
        correct: true
        feedback: |
          Yes. The test is silent about rain and canal because each is replaceable by the other. That does not show they are not conditions: remove both and there is no harvest.
      - text: "The counterfactual test is wrong, since all three conditions are equally necessary."
        feedback: |
          They are not equally necessary: with the canal, rain is not needed, and the table shows that. The difference is in what each method is asked to answer.
      - text: "Dependent origination is wrong, since only the seed is a real cause."
        feedback: |
          Two conditions can be real and substitute for each other. Removing both gives no harvest (season 2), so each matters when the other is missing.
    explanation: |
      Label: **debate**. A Western causal theorist can say that a good account of causation must handle such backups; a Buddhist reader can say that the teaching was never meant as a test to pick out one cause, but as a map of dependence for the practical aim of ending suffering.

  - type: order
    id: p4-order
    title: "From dependence to emptiness"
    prompt: "Put Nagarjuna's argument from dependence to emptiness, applied to the Orun harvest, in order."
    steps:
      - "The harvest depends on rain or canal water, seed and labour, and on a word and a use that call it a harvest."
      - "Whatever depends on conditions would not be its own: a nature fixed in itself would not need them."
      - "So the harvest has no svabhava; it is empty of svabhava."
      - "Emptiness is not non-existence: because it has no fixed nature, the harvest can come, fail and be gathered."
    hint: Dependence first, then why dependence excludes an own-nature, then the conclusion, then the guard against nihilism.
    explanation: |
      The argument turns on the premise that dependence and own-being exclude each other. An Abhidharma philosopher rejects it by saying some basic items do not depend on others, which is where the reply to Nagarjuna starts.

  - type: mcq
    id: p4-critic
    title: "A critic: conditions are not causes"
    prompt: |
      A critic of the Buddhist view says: "Calling every condition a cause is a mistake. Oxygen in the air is a condition of the village's fire, but the spark caused it. Ordinary causal talk, and good science, pick out the difference-making cause from the standing background." Which reply, in the spirit of the dependent-origination teaching, is fair?
    options:
      - text: "The teaching does not deny that we pick out a spark in practice; it says that what the spark does depends on the whole set of conditions, and that nothing in the set has a nature of its own. The choice of 'the cause' reflects our interests, not a division in the world."
        correct: true
        feedback: |
          Yes. Some Western philosophers say something close: according to the *Stanford Encyclopedia of Philosophy*, David Lewis in 1973 called the distinction between causes and background conditions "invidious discrimination", in essence a choice with no deep ground. Others, such as defenders of difference-making, reject that and keep the distinction.
      - text: "The critic is right, so the teaching is refuted."
        feedback: |
          The critic's point is a real objection to a loose use of 'cause'. It does not refute the claim that effects depend on many conditions, which most causal theorists accept.
      - text: "The critic is wrong, because the spark is only a condition like oxygen, and so we should never speak of causes."
        feedback: |
          The teaching does not forbid ordinary talk; the two-truths frame says conventional language is fine. What it adds is the claim about the ultimate status of such talk.
    explanation: |
      Layers: that the two sides say this is **fact**; whether a deep line exists between cause and condition is a live **debate** within Western philosophy too.

  - type: mcq
    id: p4-parting
    title: "Where do thoughtful people part?"
    prompt: |
      A Madhyamaka scholar, a Humean and a physicist read the Orun table together. They agree about every number. Where do they most likely part ways?
    options:
      - text: "On what the dependence is: the Madhyamaka scholar says dependence means no thing has its own nature; the Humean says we can only record regular succession; the physicist may say laws and interventions fix which conditions matter. They part on premises about what a cause is and what counts as evidence for it."
        correct: true
        feedback: |
          Yes. The data are shared; the disagreement is about the further claim, whether there is something more than the pattern, and whether 'no own-nature' follows.
      - text: "On the table's numbers, since each reads the table differently."
        feedback: |
          The numbers are fixed by the setup and checked by counting. They are not where the views part.
      - text: "They do not part: all three hold the same theory of causation."
        feedback: |
          They share the observation that conditions combine, not a theory. Hume's regularity, the counterfactual reading and emptiness are different claims.
    explanation: |
      The level does not decide among them. It gives the questions: what does each view count as a cause, what would it count as evidence, and which layer is the claim in.

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-setup
    title: "Problem 5 · The closing weighing"
    body: |
      **Problem 5.** Three questions run through Level 18: **what a self is** (Buddhist no-self, Hume's bundle, Parfit, the view of a persisting soul), **what a mind is and how to study it** (contemplative training and the science of mind), and **whether a creator God matters** (the Buddhist teaching that a god is not the foundation of the path, against theism). The task is to sort claims by layer, say what each view would count as evidence, and weigh without declaring a winner.

  - type: mcq
    id: p5-layers
    title: "Which layer is each claim in?"
    prompt: |
      Four claims. (1) The *Milindapanha* is usually dated between about 100 BCE and 200 CE. (2) According to the Pali texts, none of the five aggregates is a self. (3) Meditation training changes some measured brain activity (as one small study of long-term practitioners reported, with limits on what it shows). (4) There is no self apart from the aggregates. Which assignment of layers is best?
    options:
      - text: "(1) established as a range, with debate; (2) established as a statement of what the texts say; (3) established as a finding with stated limits, debate over what it shows; (4) metaphysical commitment or live philosophical debate."
        correct: true
        feedback: |
          Yes. What a text says is a fact about the text; whether the claim is true is a different question. The study reports an effect that has to be read with its limits, and the metaphysical claim is argued, not measured.
      - text: "All four are established facts, since Buddhists teach them."
        feedback: |
          A claim does not become fact by being taught. Its date, its wording and its truth are three different questions.
      - text: "All four are faith, because Buddhism is a religion."
        feedback: |
          Dates and a measurement are checked by evidence, whatever tradition the text belongs to.
    explanation: |
      The method of the course: put each claim in its layer, and never let it move up by repetition.

  - type: mcq
    id: p5-evidence
    title: "What would count as evidence?"
    prompt: |
      Three people consider the claim "a person is a stream of conditions with no self apart from it". A Buddhist practitioner, a Humean and a defender of a soul each say what would count against it. Which pairing is most faithful to each view?
    options:
      - text: "Practitioner: a direct and stable awareness of a self apart from experience, found by careful attention; Humean: any impression of a self apart from the perceptions; soul defender: an argument that unity of consciousness cannot be had by a bundle."
        correct: true
        feedback: |
          Yes. Each names a kind of evidence it would accept, inward observation in the first two and an argument in the third. Whether such evidence has been found is where they part.
      - text: "All three say nothing could count against the claim."
        feedback: |
          Each view allows some result against it; the question is which. A view that rules out all counter-evidence makes itself unfalsifiable, which a fair statement should not assume.
      - text: "Only brain scans could count, for all three."
        feedback: |
          Brain data are relevant to some questions, but the soul defender and the Buddhist practitioner would deny that a scan alone settles what a self is.
    explanation: |
      Labels: that each view says this is **fact** about the positions; which kind of evidence is decisive is a live **debate**.

  - type: mcq
    id: p5-self
    title: "Weighing: the self"
    prompt: |
      Weigh the self. Buddhist no-self (persons conventionally real, no self apart from the aggregates), Hume's bundle and Parfit's connectedness-and-continuity agree on one point and differ on another. Which statement is right?
    options:
      - text: "They agree that a person is not an unchanging substance apart from changing processes; they differ on what to say next: no-self adds an aim (releasing clinging), Hume stops at the bundle, and Parfit says what matters in survival is a relation, not identity."
        correct: true
        feedback: |
          Yes. The common core is a reductionist picture of a person; each tradition adds a different question and a different use for it.
      - text: "They agree that persons do not exist."
        feedback: |
          None says this. The Buddhist texts call persons conventionally real, and Parfit's view is reductionist, not eliminativist.
      - text: "They disagree about whether anything changes."
        feedback: |
          All three accept change; the dispute is about whether something persists through it.
    explanation: |
      Where thoughtful people part: whether a bundle can account for the unity of experience (a defender of a soul says no), and whether the conclusion should change how one lives.

  - type: mcq
    id: p5-mind
    title: "Weighing: mind and science"
    prompt: |
      Weigh mind and science. According to the Dalai Lama (2005, in essence), a claim in Buddhism that science conclusively showed false would have to be given up, while "not yet found" is not "shown false". A critic replies that contemplative training reports are first-person and hard to check. What is the fairest summary?
    options:
      - text: "A partnership is possible where claims can be tested (effects of training, measured with controls); the first-person reports can be studied but not taken as proof of metaphysical claims such as rebirth, and whether the two kinds of knowing fit together is debated."
        correct: true
        feedback: |
          Yes. It keeps the testable part testable and the metaphysical part in its own layer, without scorn for either side.
      - text: "Science has shown that meditation reveals the nature of mind."
        feedback: |
          Studies show effects of training with limits; they do not show what mind fundamentally is.
      - text: "Science and Buddhism cannot be compared at all."
        feedback: |
          They can be compared on the testable questions, and many researchers and practitioners have worked together on them. What remains open is how far.
    explanation: |
      The partnership reading and the category-mistake reading (science and Buddhism answer different questions) are both live.

  - type: mcq
    id: p5-god
    title: "Weighing: God"
    prompt: |
      Weigh God. According to the discourse to Malunkyaputta the Buddha left some questions undeclared because they are "not connected with the goal", and in the Pali texts gods (*devas*) are mortal beings in samsara, not creators. A theist, a secular Buddhist and a devotee of Pure Land each respond. Which is the best summary of where they part?
    options:
      - text: "They part on whether the path needs a being beyond the world: the theist says yes, the secular Buddhist says no and keeps the practice, the Pure Land devotee relies on the vow of the Buddha Amitabha. The question is premises and commitments, not texts."
        correct: true
        feedback: |
          Yes. Each reads the same tradition's themes differently, and their disagreement lies in what is taken as basic.
      - text: "They part only on whether the *Brahmajala* story is in the texts."
        feedback: |
          The story is in the texts; that is a point of fact all can check. The disagreement is about what follows.
      - text: "They do not part: Buddhism is just theism with other names."
        feedback: |
          The Pali texts do not make a creator the ground of the path. Whether that makes Buddhism atheist, non-theist or something else is a debate about the definition of religion.
    explanation: |
      The level never decides whether God exists. It shows where the Buddhist teaching places the weight: on suffering and its conditions.

  - type: numeric
    id: p5-years
    title: "A long conversation"
    prompt: |
      Hume gave his first account of the self as a bundle in the *Treatise* (1739), and Parfit gave his account of persons and what matters in survival in *Reasons and Persons* (1984). How many years separate the two books?
    answer: 245
    wrong:
      - { value: 1984, feedback: "1984 is the year of the later book, not the gap. Subtract the earlier year." }
    hint: Subtract the year of the earlier book from the later one.
    explanation: |
      $1984 - 1739 = 245$ years. The Pali discourse on not-self is about 2,400 years before Parfit if the Buddha lived in the fifth century BCE, so the question of what a person is has a very long history.

  - type: order
    id: p5-order
    title: "Order the Level 18 voices"
    prompt: "Put these in order of date, earliest first (usual datings, where scholars give ranges)."
    steps:
      - "The Buddha, traditionally the fifth century BCE (dates debated)"
      - "The *Milindapanha*, c. 100 BCE to 200 CE"
      - "Nagarjuna, traditionally c. 150 to 250 CE"
      - "Dogen, 1200-1253"
      - "Hume, 1711-1776"
      - "Mind and Life dialogues, first held in 1987"
    hint: From the Pali teacher to the modern dialogues.
    explanation: |
      Nagarjuna lived about eight centuries before Dogen and about fifteen centuries before Hume. The level covers a very long conversation, and the ideas of Hume and Parfit are modern ones set beside it, not its sources.

  - type: mcq
    id: p5-parting
    title: "Where do thoughtful people part ways?"
    prompt: |
      A Buddhist practitioner, a physicalist philosopher and a Christian read Level 18 together. All three agree on what the texts say. What is the most accurate account of where they part?
    options:
      - text: "They part on premises and values: whether liberation from suffering by seeing no-self is real, whether consciousness is basic or arises from matter, and what counts as evidence for what lies beyond measurement."
        correct: true
        feedback: |
          Yes. The texts and dates can be shared; the split is a metaphysical commitment and a view of evidence.
      - text: "They part because one of them has misread the texts."
        feedback: |
          Careful readers of the same texts reach different conclusions, inside and outside the tradition.
      - text: "They part only about dates."
        feedback: |
          Dates are open to evidence and are mostly debated within ranges. The deep disagreement is not about dates.
    explanation: |
      Level 18 gives the questions: what does this text say, who says so, which layer, and what would count as evidence. The answers stay open.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      The setting: an invented village (Orun) and a closing weighing of three themes, worked with the tools of the level. Every claim is made *according to* someone and sits in one of three layers.

      - **Emptiness and dependence.** According to Nagarjuna, whatever depends on conditions lacks svabhava, so it is empty of svabhava, not non-existent:
      $$\begin{gathered} x \text{ depends on conditions} \\ \Downarrow \\ x \text{ is empty of svabhava} \end{gathered}$$
      The harvest is conventionally real and depends on its conditions.
      - **Three ways to count.** Dependent origination lists all the conditions, "when this is, that is". Hume's first definition looks for regular succession (rain was followed by harvest in $2/4 = 0.5$ of the Orun seasons, so rain alone is not constantly conjoined with harvest). His second, counterfactual definition asks "if the first object had not been, the second never had existed": in season 8 only 1 of the 3 removals (the seed) stops the harvest. With backups the tests differ from the list of conditions.
      - **A fair reply to the critic.** Whether there is a deep line between cause and background condition is debated in Western philosophy too; the Buddhist teaching is a practical map of dependence, not a test that picks out one cause.
      - **The closing weighing.** Self: Buddhist no-self, Hume's bundle and Parfit agree that a person is no unchanging substance and differ on what follows. Mind: testable claims about training can be tested, metaphysical claims stay in their layer. God: the Pali texts make gods mortal beings, not creators, and the path does not rest on one; theists and secular or devotional Buddhists part on premises.
      - **Layers.** Fact (what the texts say, dates as ranges), debate (how to read them, how causation works, what studies show), commitment (no-self as metaphysics, rebirth, liberation). A claim never moves up by being repeated.

      Level 18 gave no verdict on whether Buddhist thought is true. It gave the questions.

      **Next:** the Level Review replays this level's questions at spaced intervals. Then the next level, Level 19, turns to Chinese and East Asian thought (Confucius, Daoism and more). The partial exam on Levels 14 to 19 comes after Level 19.
