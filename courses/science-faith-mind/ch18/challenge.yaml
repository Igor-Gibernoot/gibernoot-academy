id: ch18-challenge
title: "Level Challenge: Suffering, Self and Emptiness (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: a ship, a patient and a brain study"
    body: |
      Problems 1 to 3 use **invented** ships, patients, laboratories and numbers, built to practise on cases you have never seen; nothing in them is a claim about a real person or a real study. Where a real thinker or text appears, it is named as "according to ...".

      - **Problem 1 · A ship and its crew.** Parts replaced one by one: the chariot argument, the reply from mereology (the study of parts and wholes) and the reply from emergence.
      - **Problem 2 · A patient who loses her memories, and a division.** Parfit's connectedness and continuity set against "no self apart from the five aggregates".
      - **Problem 3 · A brain study of meditators.** Dependent origination, "not found" against "shown false", confounds and a number.

      **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. Each problem ends by asking where thoughtful people part ways and why. Problems 4 and 5 (emptiness against causation, and the weighing of the whole level) come in part 2.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      Five tools from the level, each stated so it can be used alone.

      - **Five aggregates.** According to the Pali texts, a person can be described as form (the body), feeling, perception, volitions (*sankhara*) and consciousness, each a changing process. The discourse on not-self argues for each one: P1, it is impermanent; P2, what is impermanent is unsatisfactory (*dukkha*); P3, what is impermanent and unsatisfactory is not fit to be regarded as "this is my self". So none of the five is a self. "No self" is not "no person": ordinary talk of persons is conventionally true.
      - **The chariot test.** In the *Milindapanha* (c. 100 BCE to 200 CE) the monk Nagasena asks king Milinda whether his chariot is any single part (no, P1), all the parts as a mere collection (no, P2) or something apart from the parts (no, P3). So "chariot" is a designation in common use for parts arranged a certain way. The step is valid only if these three options are exhaustive.
      - **Hume's bundle.** David Hume (1711-1776) reports that looking inward he finds only particular perceptions, never a self, so a person is a bundle or collection of perceptions.
      - **Parfit's view.** Derek Parfit (1942-2017) holds that what matters in survival is *Relation R*: psychological **connectedness** (direct links such as memories and character traits) and **continuity** (overlapping chains of strong connectedness), not strict identity.
      - **Layers.** Fact, debate, commitment.

  # ---------------- Problem 1 ----------------
  - type: text
    id: p1-setup
    title: "Problem 1 · The ship Calla and her crew"
    body: |
      **Problem 1.** An invented harbour tale. The ship *Calla* has 240 planks, and the harbour keeps her sailing by replacing 8 planks every month with new ones, oldest first. Her crew is 12 sailors, each of whom serves exactly 36 months and is replaced by a newcomer; the leavers are spread evenly, so one sailor leaves every 3 months, the longest-serving first. At month 0 every plank and every sailor is original.

      A harbour keeper says: "Ask me at month 36 whether this is the same ship and the same crew. I say yes to both, though not one plank or sailor is left from month 0." A visiting trader says: "Then neither word names anything real beyond the pieces."

      The task: use the chariot argument, and the two replies a critic can make, to decide what the keeper and the trader are each right about. A thought from the philosophical tradition frames it: Plutarch reports that the Athenians kept Theseus's ship for generations, replacing its decayed timbers with sound ones, so that philosophers argued over whether it was still the same ship.

  - type: numeric
    id: p1-crew
    title: "Who is left?"
    prompt: |
      In the harbour tale, the *Calla* has a crew of 12 sailors. One sailor leaves every 3 months, the longest-serving first, and each leaver is replaced at once by a newcomer. How many of the 12 original sailors are still aboard at month 30?
    answer: 2
    wrong:
      - { value: 10, feedback: "10 is the number who have left by month 30 (30 divided by 3). The question asks how many of the original 12 remain: 12 minus 10." }
      - { value: 0, feedback: "All twelve are gone only at month 36, since the twelfth leaver goes then. At month 30 two are still aboard." }
    hint: Count the departures by month 30, then subtract from 12.
    explanation: |
      One sailor leaves every 3 months, so by month 30 there have been $30/3 = 10$ departures, and $12 - 10 = 2$ original sailors remain. At month 36 the last two leave, and the crew has no original member, as the keeper says.

  - type: mcq
    id: p1-reject
    title: "Which premise does the keeper reject?"
    prompt: |
      Apply the chariot argument to the *Calla*: P1, the ship is not any one plank; P2, it is not all 240 planks taken together as a mere collection; P3, it is not something further, apart from the planks. Conclusion: "ship" is only a designation for planks arranged in a way. The harbour keeper says the *Calla* is more than a pile of her planks, because a pile of the same planks could not sail. Which premise does the keeper, in effect, reject?
    options:
      - text: "P2: the ship is not just the planks as a mere collection, since their arrangement matters."
        correct: true
        feedback: |
          Yes. The keeper does not say there is a further thing (that would be rejecting P3). The keeper says that planks as a heap are one thing and planks fitted into a hull are another, so "the ship" is not the same as "these planks, collected".
      - text: "P1: the ship is identical to one plank, say the keel."
        feedback: |
          Nobody in the story says that. Replacing the keel would then end the ship, which even the keeper denies.
      - text: "P3: there is a hidden extra thing, the soul of the ship, apart from the planks."
        feedback: |
          Rejecting P3 would mean a further thing over and above the planks. The keeper only says that arrangement matters; that is a claim about how the planks are, not about a further object.
    explanation: |
      Label: **debate**. A defender of the chariot argument can reply that "arranged planks" is exactly what the conclusion says the word names, so the keeper may agree with the conclusion while thinking he disagrees. Whether the disagreement is real is what the next cards ask.

  - type: order
    id: p1-order
    title: "The argument, in order"
    prompt: "Put the chariot argument, applied to the *Calla*, in a valid order."
    steps:
      - "P1: the *Calla* is not any single plank, since removing any one plank leaves her the same ship."
      - "P2: she is not all her planks taken as a mere collection, since a pile of the same planks is not a ship."
      - "P3: she is not something further, apart from the planks, since no part of her can be found that is not a plank, a rope or a sail."
      - "Hidden premise: one part, all the parts as a collection, or something apart are the only options."
      - "Conclusion: 'the Calla' is a designation in common use for planks and sails arranged as a ship."
    hint: Three premises first, then the premise that makes the step valid, then the conclusion.
    explanation: |
      The order shows that the three premises do not by themselves give the conclusion: it needs the fourth, hidden step that the options are exhaustive. That is where the critics push in the next two cards.

  - type: mcq
    id: p1-exhaust
    title: "Are the options exhaustive?"
    multiple: true
    prompt: |
      The chariot argument needs three options to be all there are for the relation between a whole and its parts: the whole is one part, or all the parts together, or something apart. Which of the following are real challenges to that hidden premise? Select all that apply.
    options:
      - text: "A whole may be **constituted by** its parts without being identical to them: a statue is made of clay and yet has features the clay, as a lump, lacks."
        correct: true
        feedback: |
          Yes. Constitution is a fourth option: the whole is not a further object, but "is made of" is not "is identical to".
      - text: "A whole may have **powers its parts, taken separately or as a heap, do not have**, so it is not merely a name for them."
        correct: true
        feedback: |
          Yes. This is the emergence option: a hull floats, while a heap of planks does not.
      - text: "The planks are painted brown, so the argument fails."
        feedback: |
          Colour is irrelevant to the three options. The argument would run the same for white planks.
      - text: "Ships are older than chariots, so the argument cannot be moved from one case to the other."
        feedback: |
          Age plays no role. A fair worry is whether the argument transfers from a made object to a conscious person, which is what Problem 2 tests.
    explanation: |
      Label: **debate**. Defenders of the argument reply that constitution and emergence still leave the whole depending wholly on the parts and their arrangement, which is what the conclusion claims.

  - type: mcq
    id: p1-mereo
    title: "The mereology reply"
    prompt: |
      In mereology (the study of parts and wholes) a critic says: "The *Calla* at month 36 is made of different planks than at month 0, and yet she is one ship, because what makes her the same ship is the continuous history of her hull, not her matter." According to this reply, what has the harbour keeper correctly seen, and what has the trader missed?
    options:
      - text: "A whole can persist through a change of parts when the right kind of continuity holds, so the ship's sameness is real even though no plank is the same."
        correct: true
        feedback: |
          Yes. This is the core of the constitution reply: sameness over time need not be sameness of every part. The trader slides from "no original part remains" to "nothing real remains".
      - text: "The ship is a ghostly object that moves from plank to plank."
        feedback: |
          That reads the reply as the thing the chariot argument denies (P3). The reply is that no ghost is needed: continuity of arrangement and history does the work.
      - text: "The ship is the same only if every plank is the same, so the keeper is wrong."
        feedback: |
          That is the trader's strict view in a different form, and it would make every living body, which replaces its cells, a new body every few years.
    explanation: |
      Label: **debate**. The Buddhist side can accept most of this: the *Milindapanha* says the word "chariot" is used rightly in daily life. What it denies is a further thing over and above parts and their relations.

  - type: mcq
    id: p1-emerge
    title: "The emergence reply"
    prompt: |
      An emergence reply says the *Calla* floats and sails, while a heap of her 240 planks does neither, so the whole has powers the parts alone lack. A Buddhist reductionist (as Siderits reads the tradition) answers that the power to float comes from the planks, their shape and their fit. Which statement separates **weak** from **strong** emergence here?
    options:
      - text: "Weak: floating follows from the planks and how they are arranged. Strong: the arrangement would add a fundamentally new power that nothing about the parts and their arrangement explains."
        correct: true
        feedback: |
          Yes. The reductionist accepts weak emergence, since it leaves the whole fully explained by the parts. Strong emergence would be a further claim, for which a hull gives no evidence.
      - text: "Weak: the ship has no powers at all. Strong: it has some."
        feedback: |
          Both kinds grant the whole its powers; they differ on whether those powers are explained by the parts and their arrangement.
      - text: "Weak: a wooden ship. Strong: an iron ship."
        feedback: |
          The distinction is about explanation, not material.
    explanation: |
      Label: **debate**. A mind is a harder case than a hull: whether consciousness is weakly or strongly emergent is the question of the lesson on Emergence and, in this level, of whether the chariot argument carries over to a person.

  - type: mcq
    id: p1-hobbes
    title: "Hobbes's second ship"
    prompt: |
      Thomas Hobbes (1588-1679) added a twist to the Theseus story: suppose a custodian saves every old plank as it is removed, and at the end builds a second ship from them. Now there are two ships: the one sailing the sea, continuous in history, and the one rebuilt from the original planks. On the chariot argument, how should one answer "which of the two is really the *Calla*"?
    options:
      - text: "'The Calla' is a designation in common use, so the answer depends on which rule of use we adopt (continuous history, or original matter), and no further fact settles it."
        correct: true
        feedback: |
          Yes, in the spirit of the argument. If the name is a designation for parts arranged, then the question "which one is the real one" has no answer beyond our conventions; both claims are partly right in a way.
      - text: "The sailing ship, because it has a soul."
        feedback: |
          That brings back a further thing (denied by P3). The reductionist uses no such extra.
      - text: "Neither exists, since the Calla was never real."
        feedback: |
          This is the nihilist reading the *Milindapanha* is usually not taken to endorse. The text says the word is rightly used; it denies a hidden essence.
    explanation: |
      Label: **debate**. A rival says the case shows that some rule must be chosen and that one rule is more natural (continuity of function and history for ships; maybe continuity of memory for persons). That is exactly Parfit's move in Problem 2.

  - type: mcq
    id: p1-weigh
    title: "Weighing Problem 1"
    prompt: |
      A reductionist, a constitution theorist and an emergentist look at the *Calla*. Where, in the end, do thoughtful people part ways, and why?
    options:
      - text: "On what a whole is: **a name for parts in arrangement**, **a real object constituted by them**, or **a thing with new powers**. This is a disagreement about premises (the hidden one) and about what counts as 'real', not about any plank or any measurement."
        correct: true
        feedback: |
          Yes. All three agree on the facts of the story (what was replaced, when, how the ship behaves). They differ on which premise of the argument to reject and on what the word "real" is allowed to cover.
      - text: "On the number of planks replaced per month."
        feedback: |
          That is arithmetic, and it is agreed.
      - text: "On whether ships float."
        feedback: |
          Everyone grants that; the dispute is what the floating whole is.
    explanation: |
      Label: layer 2 (debate) for the metaphysics of parts and wholes; layer 3 enters only if one insists the answer carries over to persons without argument.

  # ---------------- Problem 2 ----------------
  - type: text
    id: p2-setup
    title: "Problem 2 · Mara, her memories and a division"
    body: |
      **Problem 2.** An invented patient, Mara, a ceramicist of 40. Over six years her memories fade in steps because of an illness. Parfit's way of counting is used as a toy: according to Parfit, a person at one time and a person at a later time are **strongly connected** when the number of direct links between them (a memory of an experience, an intention and the later action, a trait expressed again) over one day is at least half the number that holds over a day in the lives of nearly every actual person. In this toy, **nearly every actual person has 40 direct links per day** (an invented figure, not from Parfit), so the threshold is half of that. Mara's years are stages 0 to 6, and the number of direct links per day between neighbouring stages is

      | Stages | Links per day |
      |---|---|
      | 0 and 1 | 36 |
      | 1 and 2 | 30 |
      | 2 and 3 | 24 |
      | 3 and 4 | 22 |
      | 4 and 5 | 17 |
      | 5 and 6 | 26 |

      Between stage 0 and stage 6 directly, there are 3 links per day.

  - type: numeric
    id: p2-threshold
    title: "The threshold"
    prompt: |
      In the toy, nearly every actual person has 40 direct psychological links per day to their own self of a day earlier, and two stages are strongly connected when they share at least half that number. What is the smallest number of links per day that makes two stages strongly connected?
    answer: 20
    wrong:
      - { value: 40, feedback: "40 would be every link that ordinary people have. Parfit's condition is at least half of the ordinary number, so as to allow weaker but still strong connectedness." }
      - { value: 80, feedback: "That doubles instead of halving." }
    hint: "'At least half' of 40."
    explanation: |
      Half of 40 is 20. Parfit says the figure is a stipulation, and critics ask why exactly half; the toy only needs some threshold to count with.

  - type: numeric
    id: p2-chain
    title: "How many neighbouring links are strong?"
    prompt: |
      Using the threshold of 20 links per day, Mara's neighbouring stages share 36, 30, 24, 22, 17 and 26 direct links per day. For how many of the six neighbouring pairs of stages are the two strongly connected?
    answer: 5
    wrong:
      - { value: 6, feedback: "The pair of stages 4 and 5 shares only 17 links per day, below 20, so it is not strongly connected." }
      - { value: 1, feedback: "The one that fails is stages 4 and 5 (17). The other five meet the threshold." }
    hint: Compare each number with 20.
    explanation: |
      36, 30, 24, 22 and 26 are at least 20, while 17 is not. Five of six pairs are strongly connected.

  - type: mcq
    id: p2-cont
    title: "Continuity or not?"
    prompt: |
      In the toy, Mara's stage 0 and stage 6 share 3 links per day, and one neighbouring pair (stages 4 and 5) shares 17 per day, below the threshold of 20. According to Parfit's definitions (connectedness: direct links; continuity: overlapping chains of strong connectedness), which description is right?
    options:
      - text: "Stage 0 and stage 6 are only weakly connected, and the chain of strong connectedness is broken between stages 4 and 5, so in this toy continuity from stage 0 to stage 6 fails."
        correct: true
        feedback: |
          Yes. A chain needs every link to be strong, and one link is 17, below 20. If the pair of stages 4 and 5 had shared 20 or more, continuity would hold even though stages 0 and 6 share only 3 links.
      - text: "Continuity holds because stage 0 and stage 6 are both Mara."
        feedback: |
          That assumes the identity the toy tests. Parfit's definitions are stated in terms of links and chains, not of the person staying the same.
      - text: "Continuity holds because five of six pairs are strongly connected."
        feedback: |
          A chain is only as strong as every link; five of six leaves one gap.
    explanation: |
      The toy shows why Parfit uses chains: a long life is almost never strongly connected end to end, since a child and an old person share few direct links, yet continuity can run through it. Here one weak link would break the chain.

  - type: mcq
    id: p2-buddhist
    title: "What the aggregates view says about Mara"
    prompt: |
      A Buddhist reading, according to the discourse on not-self and the chariot comparison, treats Mara as five changing aggregates (form, feeling, perception, volitions, consciousness) in dependence on one another, with no self apart from them. Which statement fits that view best?
    options:
      - text: "'Mara' is a conventional name for a stream of aggregates linked by causal dependence; as the links of memory weaken, the stream is less tightly bound, but there was never a self that persisted or was lost."
        correct: true
        feedback: |
          Yes. The view and Parfit's agree in treating the person as a set of connected processes; the Buddhist texts add that what is lost in memory loss was never a self to begin with.
      - text: "Mara has no existence, since only the aggregates exist."
        feedback: |
          This is the nihilist reading. The texts speak freely of persons; what they deny is a lasting owner behind the aggregates.
      - text: "Mara keeps a permanent self through the illness, and only her memories change."
        feedback: |
          This is the claim of a self apart from the five (the rejected P6-type option). The aggregates view says no such self is needed.
    explanation: |
      Label: **debate** on how close Parfit and the Buddhist texts are (Parfit said the Buddha would have agreed; scholars dispute how far). The difference in setting remains: Parfit offers an argument, the texts offer a path to end *dukkha*.

  - type: text
    id: p2-branch
    title: "A division"
    body: |
      Now a thought experiment, in the style of one Parfit discusses (he imagines a brain divided and each half placed in a different body). Suppose, purely as a hypothesis, that a clinic could copy Mara's present memories and traits into two new bodies, A and B, at the same moment, and then close down her old body. Both A and B wake up with Mara's memories, intentions and character, and both are strongly connected to Mara in the toy's sense, with 38 direct links per day each.

  - type: mcq
    id: p2-identity
    title: "Why strict identity fails"
    prompt: |
      In the division case, A and B each have 38 direct links per day to Mara, above the threshold. Suppose strict identity is what matters in survival: "Mara is A" and "Mara is B" both true. Why does Parfit say this cannot be what matters?
    options:
      - text: "Identity is one-to-one and transitive: if Mara is A and Mara is B, then A is B. But A and B are two people who will live different lives, so Mara cannot be identical to both."
        correct: true
        feedback: |
          Yes. Relation R can hold between Mara and each of A and B, since connectedness and continuity can be one-to-many, but identity cannot. Parfit concludes that identity cannot be what matters, since in the division each product has everything that matters.
      - text: "Because A and B are too weakly connected to Mara."
        feedback: |
          In the case they are strongly connected (38 links per day), above the threshold. The problem is not too few links but that one person cannot be identical to two.
      - text: "Because copies are never possible."
        feedback: |
          The case is a hypothesis about what would follow if it were possible. Parfit's argument is conditional: if it happened, identity would not be what matters.
    explanation: |
      Label: **debate**. Critics reply in several ways: some hold that in a division the original ceases to exist (a view in which fission is death), others that A and B were two persons sharing a stage before the split. Parfit answers that on either view each product holds what matters.

  - type: mcq
    id: p2-matters
    title: "What matters, for Parfit and for the Buddhist texts"
    prompt: |
      Parfit says that what matters is Relation R (connectedness and continuity), not strict identity, and that this can be a relief. A Buddhist reader says the texts aim at ending craving, including the craving that "I" should continue. Which comparison is fairest?
    options:
      - text: "Both loosen the grip of the thought that a deeper fact about the self settles what matters; Parfit's reasons are an argument about cases like division, the Buddhist texts' reasons are tied to a path of practice that is also meant to end *dukkha*."
        correct: true
        feedback: |
          Yes. They overlap in rejecting a self apart from the aggregates, and differ in method and aim. Scholars dispute how far the overlap goes.
      - text: "They are the same view in different words, so nothing remains to dispute."
        feedback: |
          Too quick. Parfit did not ground his view in rebirth, release or a path, and the texts do not argue from division cases.
      - text: "They are opposed: Parfit says the self is real, the Buddhist texts say it is not."
        feedback: |
          Parfit is a reductionist about persons (they consist in connected events) and says what matters is R, so he also denies a deeper further fact. The two are closer than this, though not identical.
    explanation: |
      Label: layer 2 for how close they are; layer 3 for the claim that seeing this frees one from *dukkha* (Buddhist) or reduces the fear of death (Parfit's own remark).

  - type: mcq
    id: p2-weigh
    title: "Weighing Problem 2"
    prompt: |
      About Mara and the division, where do thoughtful people part ways, and why?
    options:
      - text: "On **premises and values**: whether psychological links are all that matter (a premise about persons), whether a person is exhausted by the aggregates (the metaphysical commitment), and how much to care about 'my' continuing (a value). The numbers of the toy are agreed."
        correct: true
        feedback: |
          Yes. Non-reductionists hold there is a further fact (a soul or a simple self), and deny the premise. Reductionists, Buddhist and Western, accept it and differ on what follows for care and conduct.
      - text: "On whether 17 is below 20."
        feedback: |
          That is arithmetic, and agreed.
      - text: "On evidence: a scan could decide it."
        feedback: |
          No scan settles which facts about a division count as survival; it can show the connections, not which of them matter.
    explanation: |
      Label: layer 3 for the further-fact question and for what matters; layer 1 only for the facts of the toy.

  # ---------------- Problem 3 ----------------
  - type: text
    id: p3-setup
    title: "Problem 3 · The Kestrel Lab study"
    body: |
      **Problem 3.** An invented study. The Kestrel Lab compares 9 retreat-trained meditators (mean age 46, at least three years of daily practice) with 11 novices (mean age 23) on a made-up "attention synchrony index" from a brain recording. The meditators score a mean of 4.8, the novices 2.1. Both groups vary with a standard deviation of 2.0.

      A commentator says: "According to the Buddhist teaching of dependent origination, what we call a self-feeling arises from conditions (craving, clinging). Training should therefore change the measurable signs of that feeling. Here it does: the meditators score higher. The teaching is confirmed." Another says: "The lab found no difference on a questionnaire about the sense of self, so the teaching is shown false."

      The task: separate what the study can and cannot show, and say what a better design would be. This echoes the real comparison of long-term meditators and students by Lutz and colleagues (2004), whose authors listed the same limits (training versus prior differences, age, culture).

  - type: numeric
    id: p3-gap
    title: "What the gap hides"
    prompt: |
      The observed gap between meditators and novices is 4.8 minus 2.1. A separate randomized trial gives novices three years of daily practice, the same dose as the meditators, and finds that the trained group scores 0.9 higher than an untrained control group. Treating the randomized figure as the effect of training, how much of the gap is left that training does not explain (age, selection, culture, other differences)?
    answer: 1.8
    tolerance: 0.001
    wrong:
      - { value: 2.7, feedback: "2.7 is the whole observed gap. The question asks for what remains after the training effect is taken out." }
      - { value: 0.9, feedback: "0.9 is the training effect itself, not the remainder." }
    hint: The gap is made of two parts; one is the randomized effect.
    explanation: |
      The gap is $4.8 - 2.1 = 2.7$. Removing the training effect of $0.9$ leaves $2.7 - 0.9 = 1.8$. This is the part that the cross-sectional design cannot tell apart: pre-existing differences, age, culture, or a longer dose than the trial gave.

  - type: mcq
    id: p3-confound
    title: "The strongest confound"
    prompt: |
      The meditators are older (46 against 23) and chose a retreat life. Which is the best reason the commentator's "the teaching is confirmed" is premature?
    options:
      - text: "A group difference that is found in people who chose, and were selected for, years of practice could come from who they already were (age, temperament, culture) as well as from training, and the design cannot split the two."
        correct: true
        feedback: |
          Yes. The cross-sectional design compares different people, and the people differ in several ways at once. A randomized design, or following the same people before and after, can separate training from selection.
      - text: "Twenty people are too few for any study to ever show anything."
        feedback: |
          Small samples limit precision, but a small sample does not forbid every conclusion. The sharper problem is the confound, which more people of the same kind would not remove.
      - text: "Brain recordings cannot measure attention."
        feedback: |
          That is a different challenge (what the index measures). Even with a perfect measure, the comparison between self-selected groups would still mix causes.
    explanation: |
      Label: layer 1 for the design (a standard point of method) and layer 2 for how much the confound matters in the real field. Lutz and colleagues named training against prior individual differences as a limit of their own comparison.

  - type: numeric
    id: p3-bayes
    title: "How much should the study move you?"
    prompt: |
      Before the study, you give 50% to the claim H that years of practice change this index. The study's result, a clear gap, would turn up with probability 0.9 if H is true, and with probability 0.4 if H is false (because people who choose retreat life may differ anyway). After seeing the gap, what is your probability for H? Give a decimal.
    answer: 0.692
    tolerance: 0.005
    wrong:
      - { value: 0.9, feedback: "0.9 is how likely the gap would be if H were true. It is not the probability that H is true given the gap." }
      - { value: 0.5, feedback: "The gap is more likely under H than without it, so the probability should rise above the prior 0.5." }
    hint: Update with the likelihood of the gap under each case, as in the Bayes lessons.
    explanation: |
      With prior odds 1 and likelihood ratio $0.9/0.4 = 2.25$, the posterior odds are $2.25$ and the probability is $2.25/3.25 \approx 0.692$. A randomized design would make a spurious gap rarer, say 0.05 instead of 0.4, so the same result would give $0.9/0.05 = 18$ and a probability of about $0.947$. The study moves you, but modestly, and a better design moves you far more.

  - type: mcq
    id: p3-orig
    title: "What does dependent origination predict?"
    prompt: |
      According to the Pali formula, "When this is, that is; when this isn't, that isn't", and in the twelve links craving (*tanha*) leads to clinging and so on. A defender says the teaching predicts that removing a condition removes what depends on it. Which observation in a study would count, for an empirical reading, **against** the teaching?
    options:
      - text: "A randomized training that clearly reduces craving-related measures, with the measures of self-clinging staying unchanged, in a well-powered study with a validated measure."
        correct: true
        feedback: |
          Yes. If the teaching says clinging depends on craving, a clean intervention that lowers craving but leaves clinging untouched is what the formula would lead one to rule out. It is a testable form, though the defender may reply that the measure did not capture the Buddhist term.
      - text: "A study of 11 novices finding no change after one week."
        feedback: |
          A tiny, short study that finds nothing is weak evidence either way, since a real effect could be too small to see in 11 people in a week.
      - text: "The fact that the commentator is not a Buddhist."
        feedback: |
          A commentator's identity is not an observation about the claim.
    explanation: |
      Label: layer 2 for how far the teaching is empirical at all. Many traditional readers hold that the teaching is verified by practice, not by measures; the Dalai Lama principle (in essence) limits itself to empirical claims.

  - type: mcq
    id: p3-notfound
    title: "Not found, or shown false?"
    prompt: |
      The Kestrel Lab found no difference on its self-sense questionnaire, and the second commentator says the teaching is therefore shown false. According to the principle that refuted empirical claims should be given up, what is the fair reading?
    options:
      - text: "It is 'not found' in this study, not 'shown false': the questionnaire may not measure what the teaching means, 20 people give low power, and the same study has the same selection problem."
        correct: true
        feedback: |
          Yes. A null result from a small, confounded study with an unvalidated measure shows that this study found nothing, not that the claim was refuted.
      - text: "It is shown false, since a measurement was made and found nothing."
        feedback: |
          Absence of a finding is evidence of absence only when the study had a fair chance to find the effect, which this design did not.
      - text: "Nothing can ever count against the teaching."
        feedback: |
          That would make it untestable. The principle supposes that some empirical claims can be refuted, with a better design; this study is not that design.
    explanation: |
      Label: **debate** on which Buddhist claims count as empirical. Rebirth and the end of *dukkha* by realization are often treated as faith claims, outside the principle.

  - type: mcq
    id: p3-weigh
    title: "Weighing Problem 3"
    prompt: |
      A practitioner, a neuroscientist and a sceptic read the Kestrel results. Where do thoughtful people part ways, and why?
    options:
      - text: "On **evidence and meaning**: what counts as a measure of a Buddhist term (a premise about translation), how strong a design must be before a claim is given up (a standard of evidence), and whether practice-based knowledge is evidence at all (a value about methods)."
        correct: true
        feedback: |
          Yes. All three can agree on the numbers (a gap of 2.7, a training effect of 0.9, a posterior near 0.69) and still part ways on these three points.
      - text: "On the arithmetic of the gap."
        feedback: |
          The arithmetic is agreed.
      - text: "On whether meditators exist."
        feedback: |
          Everyone grants that. The dispute is what a comparison of them shows.
    explanation: |
      Label: layers 1 and 2 for the study; layer 3 enters when a reader holds that the practice's findings need no outside test, or that no inner method can count as evidence.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Part 1 used one method three ways: write the argument as numbered premises, check the hidden premise, then ask which premise, value or kind of evidence a critic changes.

      **Problem 1 (ship and crew).** The chariot argument gives
      $$\text{ship} \neq \text{one plank},\quad \text{ship} \neq \text{planks as a heap}$$
      and, if the options are exhaustive, "ship" names parts in arrangement. Critics reject the hidden premise by constitution (made of, not identical to) or by weak emergence (a hull floats, a heap does not). At month 30 of the tale, $12 - 30/3 = 2$ original sailors remain.

      **Problem 2 (Mara).** According to Parfit, what matters is Relation R: connectedness (direct links) and continuity (overlapping chains of strong connectedness, here at least $20$ links a day of $40$), not strict identity. In a division, identity fails because it is one-to-one, while R can hold to both products.

      **Problem 3 (Kestrel Lab).** An observed gap is the effect of training plus pre-existing differences: $2.7 = 0.9 + 1.8$. Updating on a result uses likelihoods under both cases:
      $$P(H\mid E) = \frac{0.5 \times 0.9}{0.5 \times 0.9 + 0.5 \times 0.4} \approx 0.692$$
      "Not yet found" is not "shown false".

      **Where people part ways:** on a hidden premise about wholes, on what matters about a person, and on how strong a design must be. **Next:** problems 4 and 5, emptiness against causation, and the weighing of the whole level.
