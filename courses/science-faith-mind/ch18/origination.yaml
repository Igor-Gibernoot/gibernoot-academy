id: ch18-origination
title: "Dependent Origination"
kind: concept
own: |
  The setting: the teaching of *paticca-samuppada* ("dependent origination" or "dependent arising") in the Pali discourses attributed to the Buddha (fifth century BCE, dates debated), and how later Buddhist writers and modern scholars read it. Everything is taught according to these sources; whether any of it is true is left to each reader.
  - **The principle.** According to the discourses, the Buddha put the whole idea in one formula: {{ "When this is, that is; when this isn't, that isn't" }}, and likewise for arising and ceasing. A condition is something the later item depends on; it is not always its only cause.
  - **The twelve links.** The best-known list, in one discourse, runs: {{ ignorance, formations, consciousness, name-and-form, the six sense bases, contact, feeling, craving, clinging, becoming, birth, ageing-and-death }}. Ignorance there means not knowing the four truths; formations (*sankhara*), consciousness (*vinnana*), feeling (*vedana*) and craving (*tanha*) are the same words met in the five aggregates and the second truth, so the chain says how a person made of changing processes keeps going and keeps suffering (*dukkha*).
  - **A chain you can cut.** If each link depends on the one before, then removing a link stops {{ every link after it }}. This is why the teaching is a practical argument: its premises are that dukkha arises from conditions, that those conditions run back to ignorance and forward through craving and clinging, and that removing a condition removes what depends on it. A critic can reject {{ the claim that the twelve are a single true chain }} (modern scholars note that the list looks like a later compilation of shorter lists) or the claim that removing one link must stop the rest.
  - **Two readings of the same list.** The commentator Buddhaghosa (fifth century CE) spread the twelve over {{ three lives }} (past, present and future); modern scholars such as Dhivan Thomas Jones argue that this is a later development and that the list can be read as a process in the mind in one moment. The wheel of life (*bhavacakra*) paints the links as a circle because the end of one round feeds the next.
  - **No craver needed.** The answer to "craving needs a craver" is that craving is itself a link: it depends on feeling and leads to clinging, and nothing in the chain is an owner standing behind it. Dependent origination also makes up the middle way between {{ eternalism and annihilationism }}.
  - **Three layers.** Established: the discourses give the formula and the twelve links, in these words. Debated: whether the twelve are one original chain, and whether the right reading is across three lives or moment by moment; how far the chain resembles modern causal explanation. Faith: rebirth, and that ending ignorance ends dukkha.

cards:
  - type: mcq
    id: hook
    title: "Guess: why does a flame keep going?"
    prompt: |
      Guessing is the point; no background is needed. A candle flame, a river and a traffic jam all last for hours. Yet no part of any of them stays: the flame is made of fresh gas and burning soot every instant, the river of new water, the jam of new cars (the jam can even drift backwards while every car moves forwards). What is the most natural first guess about why each one keeps going?
    options:
      - text: "Each moment is produced by the moment before it, so the pattern continues although nothing in it stays."
        correct: true
        feedback: |
          Yes. Heat vaporises wax, the vapour burns and makes more heat; a braking car makes the next one brake. This idea, that continuing is a chain of conditions and not a lasting thing, is what this lesson follows in the Buddhist teaching.
      - text: "There is a hidden core in each, a flame-thing, a river-thing, a jam-thing, that stays and carries the rest."
        feedback: |
          This is a natural first guess, and it is the picture the lesson No Self questioned for persons. Look for the core in a flame: the gas, the soot and the heat all change, and no part is the flame.
      - text: "It is mere chance that each one keeps going; nothing makes the next moment depend on the last."
        feedback: |
          If it were chance, flames would flicker out as often as not, and jams would form at random. The pattern lasts because each moment really does depend on the one before.
    explanation: |
      The tradition's name for this dependence is *dependent origination*. It is offered as an answer to a question we left open: if a person is a changing process with no owner behind it, what links one moment to the next?

  - type: mcq
    id: recall
    title: "What links the moments?"
    prompt: |
      Recall: according to the Pali discourses, a person can be described by five changing groups (*khandhas*): form (*rupa*), feeling (*vedana*), perception (*sanna*), volitions or formations (*sankhara*) and consciousness (*vinnana*), and no one of them is a lasting self. The first sermon says the cause of *dukkha* (the unsatisfactoriness of life) is *tanha* (craving). A reader asks: "if there is no lasting owner, what explains why craving, and so *dukkha*, keeps recurring from moment to moment?" Which kind of answer does the teaching need?
    options:
      - text: "A description of how each moment depends on earlier ones, a causal pattern, not a hidden owner."
        correct: true
        feedback: |
          Yes. If there is no owner, the continuity must be explained by dependence among the changing parts.
      - text: "A lasting soul that carries craving from moment to moment."
        feedback: |
          This is exactly what the argument for *anatta* (not-self) denies, so it cannot be the teaching's answer.
      - text: "None: if there is no self, nothing needs explaining."
        feedback: |
          The texts take the recurrence of *dukkha* as the problem to be solved; denying an owner makes the explanation more necessary, not less.
    explanation: |
      The Buddhist answer is a pattern of conditions. It is the subject of the rest of the lesson.

  - type: text
    id: formula
    title: "When this is, that is"
    body: |
      According to the discourses, the Buddha reached this teaching on the night of his awakening. In the Udana (a short early collection), he sits under the Bodhi tree by the Nerañjarā River, comes out of seven days of absorption, and in the third watch of the night contemplates dependent co-arising in forward and reverse order. In Thanissaro Bhikkhu's translation the formula reads **"When this is, that is"** and, in reverse, **"When this isn't, that isn't."** The same formula goes on to speak of the arising and the ceasing of this and of that.

      The Pali name is *paticca-samuppada*: *paticca*, "dependent on" or "because of", and *samuppada*, "arising together". Notice what the formula does and does not say. It does not say *that* has one cause, or that *this* forces *that* in every case. It says *that* depends on *this*, so if *this* is absent, *that* is absent. The Internet Encyclopedia of Philosophy adds that the link is an ontological relationship between things that arise, and not a logical link between two ideas.

  - type: mcq
    id: formula-q
    title: "What does 'that depends on this' allow?"
    prompt: |
      A match flame depends on heat. On the formula "when this is, that is; when this isn't, that isn't", which conclusion follows?
    options:
      - text: "With no heat there is no flame; but heat alone is not enough, since fuel and air are conditions too."
        correct: true
        feedback: |
          Yes. A condition is something the later item depends on, and there may be several. The formula only claims the dependence: no condition, no result.
      - text: "Heat is the one and only cause of the flame."
        feedback: |
          The formula does not say "only". The Internet Encyclopedia of Philosophy notes that in the twelve links each link is the most necessary condition for the next, not its sole cause.
      - text: "Heat always produces a flame, whatever else is present."
        feedback: |
          Heat on bare stone makes no flame. The formula says what depends on what; it does not say any condition suffices alone.
    explanation: |
      Keep this reading in mind: "condition" means something the next item needs, so removing it removes the result.

  - type: widget
    id: chain-widget
    title: "Remove a link"
    widget: condition-chain
    config:
      layout: row
      links: [Spark, Dry grass, Heat, Flames, Smoke]
      show: {list: true, reset: true}
      labels: {counter: "still arising", stopped: "stopped", reset: "Restore all"}
    body: |
      A toy chain in which each link depends on the one before it. Click a link to remove it, and click again to restore it. Watch what happens to the links after the one you removed, then to the links before it.

  - type: mcq
    id: widget-q
    title: "What did you see?"
    review: false
    prompt: |
      In a toy chain Spark, Dry grass, Heat, Flames, Smoke, where each link depends on the one before it, you remove Heat. Which links still arise?
    options:
      - text: "Spark and Dry grass: the links before the removed one are untouched, and Flames and Smoke stop."
        correct: true
        feedback: |
          Yes. Removing a link stops everything downstream of it. This is the cutting logic the twelve links use: end a condition and what depends on it ends.
      - text: "All five: the chain is only a description."
        feedback: |
          In the chain as defined, each link needs the one before. If Heat is missing, nothing can arise that depends on it.
      - text: "Only Smoke stops: the others can do without Heat."
        feedback: |
          Flames depend on Heat here, so they stop at once, and Smoke depends on Flames.
    explanation: |
      The hook's puzzle resolves in this shape: a flame keeps going because each moment's heat, fuel and vapour are conditions for the next, not because a flame-thing persists. Cut one condition and the pattern stops.

  - type: text
    id: twelve
    title: "The twelve links"
    image:
      src: img/bhavachakra.webp
      alt: "A wall mural of the Buddhist wheel of life, held by a fanged figure, with a Buddha figure beside it pointing the way out"
      caption: "In murals of the wheel of life (*bhavacakra*), the twelve links are painted as small scenes on the rim, held by a figure that stands for impermanence, often named Yama, while a Buddha points to the way out."
      credit: "Wonderlane from Seattle, USA, CC BY 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Traditional_bhavachakra_wall_mural_of_Yama_holding_the_wheel_of_life,_Buddha_pointing_the_way_out.jpg"
      place: bottom
    body: |
      The best-known application of the formula is a list of twelve links, called in one discourse (SN 12.2, "Analysis of Dependent Co-arising", Thanissaro's translation) a list the Buddha says he will describe and analyse for the monks at Savatthi. Each link, with the gloss given there, is a condition for the next.

      1. **Ignorance** (*avijja*): not knowing *dukkha*, its origin, its ending and the path.
      2. **Formations** (*sankhara*): bodily, verbal and mental intentional shaping.
      3. **Consciousness** (*vinnana*): awareness through the eye, ear, nose, tongue, body or mind.
      4. **Name-and-form** (*namarupa*): "name" is feeling, perception, intention, contact and attention; "form" is the body and the elements it is made of.
      5. **The six sense bases** (*salayatana*): the five senses and the mind as the sixth.
      6. **Contact** (*phassa*): a sense meeting its object, with its consciousness.
      7. **Feeling** (*vedana*): pleasant, unpleasant or neutral tone, born of contact.
      8. **Craving** (*tanha*): thirst for sights, sounds, smells, tastes, touches and thoughts.
      9. **Clinging** (*upadana*): holding on, of four kinds, among them clinging to views and clinging to a doctrine of self.
      10. **Becoming** (*bhava*): the process of coming to be, of three kinds: sensual, form and formless.
      11. **Birth** (*jati*): the appearance of aggregates and sense bases.
      12. **Ageing-and-death** (*jaramarana*): decay and the breakup of the aggregates.

      Each is said to arise with the previous one as its condition, and to cease when that one ceases.

  - type: order
    id: twelve-order
    title: "Put the links in order"
    prompt: |
      According to the best-known list of dependent origination, each of these links is a condition for the next. Put them in the order of the chain, from first to last.
    steps:
      - "Ignorance"
      - "Formations"
      - "Consciousness"
      - "Name-and-form"
      - "The six sense bases"
      - "Contact"
      - "Feeling"
      - "Craving"
      - "Clinging"
      - "Becoming"
      - "Birth"
      - "Ageing-and-death"
    hint: |
      The beginning is the cause of the diagnosis (not knowing the four truths), the middle is a sense meeting an object and what follows from it (feeling, then craving), and the end is what every birth leads to.
    explanation: |
      Notice the shape: ignorance and formations first, then the machinery of experience (consciousness, name-and-form, senses, contact), then the pivot of feeling, craving and clinging, and last the appearance and ending of a life.

  - type: text
    id: middle
    title: "The middle links and the four truths"
    body: |
      Three links sit at the centre of the chain, and you have met them already. **Feeling** (*vedana*) is the tone of an experience; **craving** (*tanha*) is the thirst that follows when the tone is pleasant (to have more) or unpleasant (to be rid of it); **clinging** (*upadana*) is the holding on that follows craving. Craving is exactly what the second truth names as the origin of *dukkha*.

      Take an everyday case: a cold drink on a hot afternoon. The contact is the cold on the tongue, the feeling is pleasant, the craving is "more, now", and the clinging is the plan, the grip, the annoyance when the glass is empty. The chain does not say pleasant feeling must produce craving; it says that where craving arises it depends on feeling, and where it does not arise there is nothing for clinging to rest on.

  - type: mcq
    id: middle-q
    title: "Which link is the second truth?"
    prompt: |
      Recall the four truths: *dukkha*, its origin, its ending (*nirvana*) and the path. In the twelve links, which one is named by the second truth as the origin of *dukkha*, and which statement about it fits the teaching?
    options:
      - text: "Craving (*tanha*), which depends on feeling and is a condition for clinging."
        correct: true
        feedback: |
          Yes. The second truth says the origin is craving, and the chain places craving between feeling and clinging.
      - text: "Ageing-and-death, because it is the last link and so the result of everything."
        feedback: |
          Ageing-and-death is a kind of *dukkha*, the thing to be understood, not its origin. The origin is a condition earlier in the chain.
      - text: "Feeling, because pleasant feeling is what we want."
        feedback: |
          Feeling is the condition for craving, not the craving. A feeling is felt; wanting more of it is a further step. The teaching is not against pleasant feeling.
    explanation: |
      So the four truths and the twelve links describe one thing twice: the truths as a diagnosis, the links as the machinery behind the diagnosis.

  - type: widget
    id: cycle-widget
    title: "A line or a circle?"
    widget: condition-chain
    config:
      cyclic: true
      toggle: true
      show: {reset: true, list: true}
      links: [Ignorance, Formations, Consciousness, Name-and-form, Six senses, Contact, Feeling, Craving, Clinging, Becoming, Birth, Ageing-death]
      labels: {counter: "still arising", stopped: "stopped", reset: "Restore all", cyclic: "Cyclic", linear: "Linear"}
    body: |
      The twelve links as a ring. In Cyclic mode the last link (Ageing-death) feeds back into the first (Ignorance), as in the wheel of life; in Linear mode the list simply ends. Click a link to remove it in each mode and watch how many keep arising. Then restore all and try a link near the start and one near the end.

  - type: mcq
    id: cycle-q
    title: "What does the circle add?"
    prompt: |
      A chain of twelve links, each depending on the one before. In a **linear** version, removing link 8 (craving) stops links 9 to 12. In a **cyclic** version, where link 12 also conditions link 1, removing link 8 stops all twelve. What does the cyclic picture say about the process?
    options:
      - text: "That the process feeds itself: the end of one round is a condition for the next, so a single cut anywhere stops the whole round."
        correct: true
        feedback: |
          Yes. That is the meaning of the wheel: the process keeps itself going unless a link is removed. The tradition reads the cut at craving or at ignorance as the way out.
      - text: "That the twelve links happen all at once, with no order."
        feedback: |
          The order stays: each link depends on the previous one. What changes is that the last one also depends on the first, closing the loop.
      - text: "That ageing-and-death is the cause of ignorance in every case."
        feedback: |
          The cyclic picture says it is one condition that keeps the process going, not that it is the only cause. In the list, ignorance is itself conditioned: the Internet Encyclopedia of Philosophy calls it the most necessary condition, not the only one.
    explanation: |
      The linear list (as in the discourse) says what depends on what; the wheel adds that the whole continues. According to the Internet Encyclopedia of Philosophy the chain does not imply a linear understanding of causality; one early discourse (the *Mahanidana*) even has consciousness and name-and-form condition each other, a small loop inside the list.

  - type: text
    id: readings
    title: "Three lives, or one moment?"
    body: |
      How are twelve links spread over time? **Reading one**, the **three-lives reading**, was set out by the commentator Buddhaghosa (fifth century CE) in the *Visuddhimagga*, and Vasubandhu used a similar scheme: ignorance and formations belong to the past life, consciousness through becoming to the present, and birth and ageing-and-death to the future. On this reading the chain describes how a being passes from one life to the next.

      **Reading two** is the moment-by-moment reading: the same links describe how, in one stretch of experience, ignorance shapes a reaction, feeling leads to craving, craving to clinging, and the cycle repeats within a single day. Modern scholars such as Dhivan Thomas Jones (2009) argue that the three-lives reading is a later development by commentators and that the discourses do not state it; the present-moment reading has Theravada supporters, though other Theravada writers dispute that it is the Buddha's original meaning. The Stanford Encyclopedia of Philosophy adds that modern scholarship regards the twelve-link list as a later compilation, and that the early texts also give shorter versions.

      The two readings are compatible if one wants both: a moment-by-moment loop repeated across lives.

  - type: mcq
    id: readings-q
    title: "Which reading is which?"
    prompt: |
      A teacher says: "Craving for the drink and clinging to it are the links; the whole chain can be watched running in one afternoon." Another says: "Ignorance and formations are in the previous life, birth and death in the next." Which statement is accurate?
    options:
      - text: "The first is the moment-by-moment reading, the second the three-lives reading; scholars dispute which is original."
        correct: true
        feedback: |
          Yes. The three-lives reading is Buddhaghosa's classic scheme; the other has modern defenders. Neither can be settled by the texts alone, which is why this is a live debate and not a fact.
      - text: "Both are the same reading, because a life is only a long moment."
        feedback: |
          They share the same links but apply them over different spans, a day or three lives. A reader who takes rebirth on faith may hold both; the readings are still different.
      - text: "Only the second is Buddhist; the first is a Hindu import."
        feedback: |
          The three-lives reading is Buddhaghosa's, a Buddhist commentator's, and Vasubandhu used a similar scheme. It is a commentarial reading, which is why scholars debate its age.
    explanation: |
      Each reading has Buddhist defenders, and the choice depends on how much weight one gives to the early discourses alone and how much to the commentators and to rebirth.

  - type: text
    id: argument
    title: "The argument"
    body: |
      Read as an argument, dependent origination says something like the following.

      P1. *Dukkha* arises only when certain conditions are present (the formula).

      P2. Those conditions form a chain that runs back to ignorance and forward through craving and clinging.

      P3. Removing a condition removes what depends on it.

      C. So *dukkha* can be ended by removing a condition in the chain, in particular by ending ignorance or craving.

      This is the structure of the second and third truths, now written as a chain of conditions. The conclusion follows if the premises are true; whether they are is the question.

  - type: mcq
    id: critic
    title: "Which premise would a critic reject?"
    prompt: |
      A sceptic replies: "Scholars say the twelve-link list is a later compilation of shorter lists, and that one of the links might not be a condition of the next. So the chain you describe may not be the true one." Which premise is the sceptic challenging, and what is the best reply?
    options:
      - text: "P2, that the conditions form this chain. A reply: the argument needs the dependence, not the particular twelve; early discourses give shorter chains with the same logic."
        correct: true
        feedback: |
          Yes. The critic targets the chain's exact content, and the Stanford Encyclopedia of Philosophy notes that the early texts give shorter versions. A defender replies that P1 and P3 survive with a shorter chain; the critic replies that a different chain needs a new case that it ends *dukkha*.
      - text: "P3, that removing a condition removes what depends on it. A reply: this is just logic."
        feedback: |
          P3 is a point of logic once the dependence is granted. The sceptic's doubt is about whether the dependence holds, which is P1 and P2.
      - text: "C, the conclusion, which does not follow from the premises."
        feedback: |
          The step from the premises to C is valid. The challenge is to the premises. Keeping validity and truth apart is the first job in evaluating any argument.
    explanation: |
      Another critic can reject P3: if there are other conditions that could keep *dukkha* going once craving is cut, the argument needs more. Another may accept the logic and reject rebirth. These are different disagreements, and each names a different premise.

  - type: mcq
    id: craver
    title: "Who is the craver?"
    prompt: |
      Recall the objection from the lesson No Self: "craving needs a craver, a self who wants". Using the twelve links, which reply does dependent origination give?
    options:
      - text: "Craving is a link in the chain: it depends on feeling and conditions clinging. No owner is added behind it; one link depends on another."
        correct: true
        feedback: |
          Yes. The chain describes the process without naming an owner. The list even includes clinging to a doctrine of self as one of the four kinds of clinging, so a belief in a lasting self is itself a link to be understood.
      - text: "The craver is consciousness, which stays the same from link to link."
        feedback: |
          Consciousness is the third link, and it too depends on a condition (formations). The discourses say consciousness is dependently arisen and not a lasting thing.
      - text: "The chain explains craving but leaves open who craves; the question is not asked."
        feedback: |
          The tradition does ask. Its reply is that "who" is answered by the chain: a person is the stream of conditions, as with the chariot in the lesson No Self.
    explanation: |
      A critic can reply that this reply restates the question: a chain of conditions with no owner may still need an explanation of why experience feels owned. That question stays open in the dialogue with Western philosophers of mind.

  - type: mcq
    id: first-cause
    title: "Is ignorance a first cause?"
    prompt: |
      The list begins with ignorance. A reader says: "So ignorance is the first cause of everything, like the first domino." According to the Internet Encyclopedia of Philosophy, what is wrong with that?
    options:
      - text: "Ignorance is the most necessary condition for the process to continue, not the only cause, and it is not an uncaused starting point."
        correct: true
        feedback: |
          Yes. The Internet Encyclopedia of Philosophy says ignorance is not the only cause of suffering but the one most necessary for the process to continue. The wheel makes the same point by drawing a circle with no start.
      - text: "Ignorance is not a link at all."
        feedback: |
          It is the first link of the list. The gloss given there is not knowing the four truths.
      - text: "The first link is craving, since craving is the second truth."
        feedback: |
          Craving is the eighth link in the list. The second truth names it as the origin of *dukkha* in the diagnosis, not as the first term of the list.
    explanation: |
      This is one reason the chain is not an argument for a beginning of the world. It is a diagnosis of how *dukkha* keeps going. The Buddhist tradition describes the process as having no knowable first point.

  - type: mcq
    id: modern
    title: "A causal explanation?"
    prompt: |
      A student says: "Dependent origination is just a causal diagram, like the ones used in science, with variables and arrows." Which reply is the fairest?
    options:
      - text: "There is a family resemblance: conditions chained so that intervening on one changes what follows. But the teaching is a diagnosis of suffering and includes rebirth and ethics, so the comparison is partial."
        correct: true
        feedback: |
          Yes. The resemblance is structural (a chain you can cut). The teaching's aim and some of its content (rebirth, a path of practice) have no counterpart in a causal diagram.
      - text: "It is exactly the same as a causal diagram, so science confirms it."
        feedback: |
          Resemblance of shape is not confirmation. The links include rebirth and ignorance of the four truths, which a causal diagram of the brain does not test.
      - text: "It has nothing in common with causal explanation, since it is religion."
        feedback: |
          The formula does assert dependence of one thing on another, and a chain you can cut. That is a causal idea, even if the purpose is different.
    explanation: |
      Scholars and Buddhist modernists disagree on how close the match is, and this is a live debate. The lesson Buddhism, Meditation and the Science of Mind returns to what science can and cannot say about these claims.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Which claim is a **live scholarly debate**, neither established record nor a matter of faith?
    options:
      - text: "Whether the twelve links are one original chain, and whether they are best read across three lives or moment by moment."
        correct: true
        feedback: |
          Yes. Modern scholars argue about the history of the list and about its reading; the texts alone do not settle either.
      - text: "That one discourse gives the twelve links, in these words, and the formula 'when this is, that is'."
        feedback: |
          This is established by the texts: the words are in the discourses, in translation as given.
      - text: "That ending ignorance would end *dukkha* and stop rebirth."
        feedback: |
          This is a commitment of the tradition, tested by practice for those who follow it; neither historians nor this lesson can settle it.
    explanation: |
      Keeping the layers apart lets a Buddhist, a scholar and a sceptic each say "that is fair": the text is a record, its reading is a scholarly question, and its truth is for each reader to weigh.

  - type: text
    id: summary
    body: |
      **Next:** if everything depends on conditions, does anything have a nature of its own? The Indian thinker Nagarjuna (traditionally placed in the second century CE) identifies dependent origination with *emptiness* (*sunyata*), and the next lesson, *Emptiness: Nagarjuna*, asks what emptiness means, and why it is not nihilism.
