id: ch18-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: Buddhist teaching and philosophy as met in this level: the first sermon attributed to the Buddha (Pali texts, fifth century BCE, dates debated), the later schools, and a conversation with the sciences of mind. Every answer is *according to* some text, school or scholar; whether any of it is true is left to each reader.
  - **Four truths, in a physician's order.** Illness (*dukkha*), cause (craving, *tanha*), cure possible (cessation, nirvana), treatment (the path). *Dukkha* has three kinds: {{ pain, change, and the unsatisfactoriness of conditioned things }}.
  - **No-self argument.** A person is described by five aggregates (form, feeling, perception, volitions, consciousness). For each one: P1 it is impermanent, P2 what is impermanent is unsatisfactory (*dukkha*), P3 what is impermanent and unsatisfactory is not fit to be regarded as "this is my self". The same shape in the chariot test:
    $$\begin{gathered}\text{chariot} \ne \text{one part} \\ \text{chariot} \ne \text{all parts as a heap} \\ \text{chariot} \ne \text{something apart}\end{gathered}$$
    The step to the conclusion "chariot is a designation for the parts in arrangement" needs {{ the three options to be exhaustive }}.
  - **Dependent origination.** The formula is {{ "When this is, that is; when this isn't, that isn't" }}. The twelve links run from ignorance to ageing-and-death, and removing a link stops {{ every link after it }}.
  - **Emptiness.** According to Nagarjuna, to be empty is to be empty *of svabhava* (own-being, a nature independent of causes and conditions), not to be non-existent:
    $$\text{empty of svabhava} \ne \text{non-existent}$$
    Two truths: {{ conventional (tables and persons can be spoken of) and ultimate (all are empty of svabhava) }}.
  - **Schools.** Theravada: the Pali Canon, the *arhat* who ends craving. Mahayana: further sutras, the *bodhisattva* who vows buddhahood for all beings. Vajrayana: tantric methods, Tibet. Zen (Japanese; *Chan* in China) is a Mahayana school: Rinzai stresses koans, Soto stresses just sitting (*shikantaza*).
  - **Gods and science.** The *devas* are real but mortal and still in samsara; none is a creator or the source of salvation. A claim not yet found false is not shown false, and a brain study comparing groups cannot split the effect of training from {{ a pre-existing difference }}.
  - **Three layers.** Established: texts, dates, designs of studies. Debated: how to read them. Faith: rebirth, and that the path frees one from *dukkha*.

cards:
  - type: text
    id: welcome
    title: "Quick recall: Buddhism, mind and self"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main shapes: the four truths, the kinds of *dukkha*, the five aggregates, the argument for no-self and the chariot test, dependent origination, emptiness, the three great schools, Zen, the gods and the meeting with the science of mind.

      Three kinds of card: **mnemonics**, **build, order and match cards**, and **numeric cards that give you data only**: you choose the method yourself.

      Every answer is *according to* some text, school or scholar. Nothing here asks which view is true. *Pali* is the old Indian language of the earliest complete Buddhist collection; *dukkha* is a word for the unsatisfactoriness of life, often translated "suffering".

  - type: order
    id: four-truths
    title: "The physician's order"
    prompt: |
      According to the Pali first sermon, the four "noble truths" follow a pattern like a physician's reasoning. Put them in order.
    steps:
      - 'Illness: the truth of *dukkha*.'
      - 'Cause: the truth of its origin, craving (*tanha*).'
      - 'Cure possible: the truth of its cessation, nirvana.'
      - 'Treatment: the truth of the path, the Eightfold Path.'
    hint: 'A doctor names the illness, finds the cause, says whether a cure exists, then prescribes.'
    explanation: |
      Mnemonic: **illness, cause, cure, course of treatment**. Scholars say the pattern fits the medical way of speaking of the time; one leading scholar notes that no early text says the Buddha borrowed it.

  - type: mcq
    id: three-dukkha
    title: "Three kinds of dukkha"
    prompt: |
      According to scholars of the Pali texts, *dukkha* has three kinds: pain, change, and conditioned things. Which matching with an example is right?
    options:
      - text: 'A toothache is dukkha as pain. A holiday that ends is dukkha as change. Everything that depends on conditions and cannot be held fixed, even when it feels fine, is dukkha as conditioned things.'
        correct: true
      - text: 'A toothache is dukkha as change. A holiday that ends is dukkha as conditioned things. Everything that depends on conditions is dukkha as pain.'
        feedback: |
          Shuffled. Pain is the ordinary kind: bodily or mental hurt. A pleasant thing that ends belongs to the kind called change.
      - text: 'A toothache is dukkha as conditioned things. A holiday that ends is not dukkha, because it was pleasant. Change is dukkha only when it hurts.'
        feedback: |
          The texts say that even pleasant things carry dukkha because they end. That is the point of the second kind.
    shuffle: false
    explanation: |
      Mnemonic: **hurts, ends, cannot be held**. Pali names: *dukkha-dukkha*, *viparinama-dukkha*, *sankhara-dukkha*.

  - type: order
    id: aggregates
    title: "The five aggregates"
    prompt: |
      According to the Pali texts, a person can be described as five changing groups (*khandha*, Sanskrit *skandha*, "heaps"). Put them in the usual order.
    steps:
      - 'Form (*rupa*): the body.'
      - 'Feeling (*vedana*): pleasant, unpleasant, neutral.'
      - 'Perception (*sanna*): recognizing and labelling.'
      - 'Volitions or formations (*sankhara*): intentions and habits.'
      - 'Consciousness (*vinnana*): awareness of an object.'
    hint: 'Body first, then what is felt, what is recognized, what is willed, and awareness last.'
    explanation: |
      Mnemonic: **body, feel, label, will, aware**. The same words *sankhara*, *vedana* and *vinnana* come back in the twelve links later in this round.

  - type: order
    id: no-self-argument
    title: "The argument for not-self"
    prompt: |
      The discourse on not-self (SN 22.59) takes each aggregate in turn. Put its argument in order.
    steps:
      - 'P1: this aggregate is impermanent.'
      - 'P2: what is impermanent is unsatisfactory (*dukkha*).'
      - 'P3: what is impermanent and unsatisfactory is not fit to be regarded as "this is mine, this is my self".'
      - 'C: so none of the five aggregates is the self.'
    hint: 'First the fact about change, then what it implies, then the verdict about "my self".'
    explanation: |
      Mnemonic: **changes, so hurts, so not mine, so not me**. A critic can reject P1 (some part lasts), P2 (change need not hurt) or the step to C (a self could be the whole, or something the five do not exhaust).

  - type: mcq
    id: chariot-test
    title: "The chariot test"
    prompt: |
      In the *Milindapanha*, the monk Nagasena asks King Milinda whether his chariot is its pole, its axle, its wheels, its frame, and so on. The king says no to each. Which list gives the whole of Nagasena's three-way test?
    options:
      - text: 'Is the chariot (1) any one part, (2) all the parts taken together as a heap, (3) something apart from the parts?'
        correct: true
      - text: 'Is the chariot (1) any one part, (2) the driver, (3) the horses?'
        feedback: |
          Driver and horses are not parts of the chariot. The test is about the relation between a whole and its own parts.
      - text: 'Is the chariot (1) real, (2) unreal, (3) both?'
        feedback: |
          That is a different pattern, closer to Nagarjuna's later arguments. The chariot test asks what the name picks out: a part, the parts together, or something further.
    shuffle: false
    explanation: |
      Mnemonic: **part, all parts, apart**. The conclusion, "chariot is a designation in common use for the parts in their arrangement", is valid only if these three options are exhaustive. A critic says a whole can be made of its parts without being identical to them.

  - type: build
    id: formula
    title: "The formula"
    prompt: |
      According to the Pali discourses, the Buddha put dependent origination in one formula. Build it from the tiles, in order.
    prefix: ''
    suffix: ''
    tiles: ['\text{When this is,}', '\text{that is;}', '\text{when this isn''t,}', '\text{that isn''t.}', '\text{that was;}', '\text{this is not,}']
    answers:
      - ['\text{When this is,}', '\text{that is;}', '\text{when this isn''t,}', '\text{that isn''t.}']
    wrong:
      - answer: ['\text{When this is,}', '\text{that is;}', '\text{this is not,}', '\text{that was;}']
        feedback: |
          If the second half repeated the first it would say nothing new. The formula is symmetric: the presence of one gives the other, and its absence removes it.
    hint: 'Presence goes with presence, absence with absence.'
    explanation: |
      Mnemonic: **this is, that is; this not, that not**. A condition is something the later item depends on; it is not always its only cause.

  - type: order
    id: twelve-links
    title: "The twelve links"
    prompt: |
      The best-known list of dependent origination (SN 12.2) has twelve links. Put them in order, starting from ignorance.
    steps:
      - 'Ignorance'
      - 'Formations (fabrications)'
      - 'Consciousness'
      - 'Name-and-form'
      - 'The six sense bases'
      - 'Contact'
      - 'Feeling'
      - 'Craving'
      - 'Clinging'
      - 'Becoming'
      - 'Birth'
      - 'Ageing-and-death'
    hint: 'Contact and feeling come after the senses; craving comes right after feeling, and ends in ageing-and-death.'
    explanation: |
      Mnemonic: **I F C N S C F C C B B A**, or in words: ignorance, formations, consciousness, name-and-form, senses, contact, feeling, craving, clinging, becoming, birth, ageing. Feeling and craving sit in the middle: the chain passes through the same words as the aggregates and the second truth.

  - type: numeric
    id: cut-link
    title: "Cutting the chain"
    prompt: |
      In the list of twelve links, ignorance is first and ageing-and-death is last. Craving is the eighth link. Suppose craving is absent in some person's life. Counting from ignorance, how many of the twelve links would still arise?
    answer: 7
    answerText: '7'
    wrong:
      - { value: 11, feedback: 'That removes only craving itself. Think about what the links after craving depend on.' }
      - { value: 4, feedback: 'You counted the links that come after craving. The question asks for those that still arise.' }
      - { value: 8, feedback: 'Craving itself is the eighth; it is the link that is absent, so it is not counted.' }
    hint: 'Which links come before craving and do not depend on it?'
    explanation: |
      Links 1 to 7 (ignorance through feeling) come before craving and do not depend on it. Craving and the four after it (clinging, becoming, birth, ageing-and-death) depend on it, so five of the twelve stop and seven remain. This is why the teaching is practical: a condition removed takes what depends on it away.

  - type: mcq
    id: emptiness
    title: "Empty, not nothing"
    prompt: |
      According to Nagarjuna, "everything is empty (*sunyata*)". Which reading is right?
    options:
      - text: 'Things are empty of *svabhava*, an own-being independent of causes, parts and conditions. They still exist, conventionally, and can change and cause one another.'
        correct: true
      - text: 'Nothing exists; the world is an illusion with no objects at all.'
        feedback: |
          This is the nihilist reading, which Nagarjuna rejects as one extreme of the middle way. Some scholars debate how far his texts avoid it, but he does not say that tables and persons are non-existent in the conventional sense.
      - text: 'Things have a hidden essence that makes them what they are, and emptiness names it.'
        feedback: |
          That is the opposite: the claim that things have an essence (svabhava) is what Nagarjuna denies.
    shuffle: false
    explanation: |
      Limit check: suppose something had svabhava, a nature fixed on its own, independent of everything else. According to Nagarjuna, nothing could then change, arise or be reached, since change means depending on conditions. The fact that things do change is his argument that they lack svabhava. Mnemonic: **empty of own-being, not empty of being**.

  - type: mcq
    id: two-truths
    title: "Two truths"
    prompt: |
      According to Nagarjuna, the Buddha's teaching rests on two truths. Which matching is right?
    options:
      - text: 'Conventional truth: tables, persons and causes exist and can be talked about. Ultimate truth: all of them are empty of svabhava.'
        correct: true
      - text: 'Conventional truth: everything is empty. Ultimate truth: tables and persons exist by their own nature.'
        feedback: |
          Reversed. Ordinary things, spoken of in ordinary words, are the conventional level; emptiness is what the ultimate analysis finds.
      - text: 'Conventional truth is false and ultimate truth is true, so persons do not exist at all.'
        feedback: |
          Nagarjuna says the ultimate is taught through the conventional and needs it. "Conventional" is not the same as "false". Some modern readers even question whether the ultimate is a separate description.
    shuffle: false
    explanation: |
      Mnemonic: **table talk, then table emptiness**. This is the same background the chariot used: "chariot" is a conventional name that is useful, and its parts in arrangement are what the name stands for.

  - type: mcq
    id: schools
    title: "Three schools"
    prompt: |
      Which matching of a Buddhist branch with its region and ideal is right?
    options:
      - text: 'Theravada: Sri Lanka and South-East Asia, the *arhat* who ends craving. Mahayana: East Asia, the *bodhisattva* who vows buddhahood for all. Vajrayana: Tibet and the Himalayas, tantric methods taken as a faster route.'
        correct: true
      - text: 'Theravada: Tibet, the bodhisattva. Mahayana: Sri Lanka, the arhat. Vajrayana: East Asia, just sitting.'
        feedback: |
          The regions and ideals are swapped. Theravada is the branch of Sri Lanka, Myanmar and Thailand, and its ideal is the arhat.
      - text: 'Theravada: East Asia, tantric methods. Mahayana: Sri Lanka, the Pali Canon only. Vajrayana: South-East Asia, the arhat.'
        feedback: |
          Mixed. The Pali Canon is the Theravada record. Mahayana accepts many further sutras, and Vajrayana is a tantric branch inside Mahayana.
    shuffle: false
    explanation: |
      Mnemonic: **elders and arhat, great vehicle and bodhisattva, diamond vehicle and mantra**. As a schema: arhat, own liberation; bodhisattva, buddhahood for all beings.

  - type: mcq
    id: zen
    title: "Koan and sitting"
    prompt: |
      Which statement about Zen is right, according to Zen teachers and historians?
    options:
      - text: 'A koan (Chinese *gong''an*, "public case") is a tool for a change of seeing, not a riddle with a hidden verbal answer. In Japan the Rinzai school stresses koans and the Soto school stresses just sitting (*shikantaza*), a difference of emphasis.'
        correct: true
      - text: 'A koan is a puzzle with a clever verbal answer, and Soto and Rinzai are the same school with different names.'
        feedback: |
          Teachers say no verbal answer meets the case, and the two schools differ in emphasis, though both sit and both know koans.
      - text: 'Zen rejects all scriptures and thought, and its tradition is as old as the Buddha.'
        feedback: |
          Historians conclude that the slogan about a special transmission outside the scriptures is a later attribution, and Zen has a large literature.
    shuffle: false
    explanation: |
      Mnemonic: **Rinzai: koan; Soto: sit**. Eisai (1141-1215) brought Rinzai to Japan and Dogen (1200-1253) Soto.

  - type: mcq
    id: gods
    title: "Gods in the cosmos"
    prompt: |
      A friend says: "Buddhism has gods, so it must teach an eternal creator." According to the Pali texts and Buddhist cosmology, which reply is right?
    options:
      - text: 'The devas are real, but they are mortal: long-lived, not immortal, and still in samsara, the cycle of rebirth. None is a creator or the source of salvation.'
        correct: true
      - text: 'Buddhists deny that any gods exist at all.'
        feedback: |
          The cosmology has devas, such as Sakka, king of one heaven. What it denies is that any of them is a creator or a saviour.
      - text: 'The god Brahma is the creator of the world, and the Buddha worshipped him.'
        feedback: |
          In the Brahmajala Sutta, Brahma mistakenly believes he created the beings who appeared after him. The Buddha is called "teacher of gods and humans", above the gods as a teacher.
    shuffle: false
    explanation: |
      Mnemonic: **gods yes, creator no, immortal no**. Whether Buddhism is "a religion without God" depends on how religion is defined.

  - type: mcq
    id: not-found
    title: "Not found or shown false?"
    prompt: |
      The Dalai Lama writes, in essence, that if science shows a Buddhist claim to be false, the claim should be given up. A scientist reports that no study has found any trace of a rebirth mechanism. Which reply is best?
    options:
      - text: 'Not yet found is not shown false. The principle covers claims an observation could refute; a claim that no observation could test is not settled either way.'
        correct: true
      - text: 'No evidence has been found, so by the Dalai Lama''s principle the claim is shown false and must be given up.'
        feedback: |
          The principle speaks of claims shown false. Failing to find something that no study could find is a different thing.
      - text: 'Science and Buddhism study different things, so neither can ever say anything about the other.'
        feedback: |
          That is one reading (a category mistake), but the Dalai Lama's principle accepts that science can sometimes refute an empirical claim.
    shuffle: false
    explanation: |
      Mnemonic: **absent from the search is not absent from the world**. Two readings remain: a partnership of two methods, or a category mistake.

  - type: mcq
    id: confounds
    title: "What a group gap can mean"
    prompt: |
      A study (Lutz and colleagues, 2004) compared eight long-term Buddhist practitioners (mean age 49) with ten student volunteers (mean age 21) taught meditation just before. The practitioners showed stronger gamma-band brain rhythms during meditation. Which of these are reasons the gap cannot show that training caused it? Select all that apply.
    multiple: true
    options:
      - text: 'The groups differ in age.'
        correct: true
      - text: 'People who choose to become long-term practitioners may differ from students before training.'
        correct: true
      - text: 'Only eight people were in one group, so chance could matter.'
        correct: true
      - text: 'Gamma rhythms are measured in hertz, so the data cannot be compared.'
        feedback: |
          Hertz is a unit of frequency and is fine for comparing groups. This is not a confound.
    explanation: |
      The observed gap is the effect of training plus any pre-existing difference, and one comparison of two groups cannot split the two. Randomizing people to training with an active control can. Checklist: **age, self-selection, small groups**.

  - type: numeric
    id: dates
    title: "A small age"
    prompt: |
      According to most sources, the Japanese monk Eisai (who brought the Rinzai school to Japan) died in 1215, and Dogen (who founded Soto) was born in 1200. How old was Dogen, in years, when Eisai died?
    answer: 15
    answerText: '15'
    wrong:
      - { value: 14, feedback: 'Subtract the years directly; an off-by-one comes from counting from the wrong end.' }
      - { value: 53, feedback: 'That is Dogen''s age at his own death (1200 to 1253), not at Eisai''s death.' }
    hint: 'Take the difference between the two years.'
    explanation: |
      Dogen was born in 1200, so by 1215 he was about 15. Eisai's own birth year is given as 1141 by most sources and 1142 by one, so the sources differ slightly on how old Eisai was.

  - type: text
    id: summary
    body: |
      **Next:** the content map of the level: you rebuild, box by box, how the four truths, no-self, dependent origination, emptiness, the three schools, Zen, the gods and the science of mind fit together.
