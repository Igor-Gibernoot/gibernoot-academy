id: ch18-sciencemind
title: "Buddhism, Meditation and the Science of Mind"
kind: concept
own: |
  The setting: a conversation between Buddhist traditions and the sciences of mind, met in this level and in the lesson What Meditation Does. Everything is taught according to the people named; which reading is right is left to each reader.
  - **The dialogues.** According to the usual account, the Mind and Life Institute grew out of meetings between scientists and the 14th Dalai Lama, the first a week in {{ October 1987 at Dharamsala }}, arranged by R. Adam Engle and Francisco Varela. They are {{ conversations, not experiments }}: neither side's claims are settled by a meeting.
  - **The principle.** The Dalai Lama writes, in essence, that if science shows a Buddhist claim to be false, the claim should be given up. The principle covers {{ empirical claims }}, those an observation could refute; "not yet found" is not "shown false":
    $$\text{not yet found} \ne \text{shown false}$$
  - **What brain studies show.** A group difference between long-term meditators and novices has two parts:
    $$\begin{aligned}\text{observed gap} ={}& \text{effect of training} \\ &+ \text{pre-existing difference}\end{aligned}$$
    A comparison of eight long-term practitioners and ten students (Lutz and colleagues, 2004) cannot split the two; {{ randomizing people to training and using an active control }} can.
  - **Secular mindfulness.** Jon Kabat-Zinn founded a stress reduction clinic at the University of Massachusetts in 1979, which became an eight-week course framed in science rather than religion. It borrows a practice but not the Buddhist path of wisdom, ethical conduct and meditation.
  - **Two critics of the story.** Donald Lopez (2008) writes the history of the claim that Buddhism and science agree, and asks which Buddhism and which science are meant. Alan Wallace (2000) argues that science has treated {{ first-person (introspective) study of the mind as taboo }}, and proposes training contemplatives to take part in it.
  - **Limits.** A trained report tells how experience appears to the practitioner; it does not by itself settle which physical process underlies it (the problem of the lessons The Hard Problem and Integrated Information and Other Rivals), and training may shape what is reported. Two readings remain: {{ a partnership of two methods, or a category mistake }} that mixes questions of different kinds.
  - **Three layers.** Established: the history of the dialogues, the published studies and their designs. Debated: how far first-person reports are evidence, and whether the two fields answer the same question. Faith or commitment: that the path ends suffering, and what the mind finally is.

cards:
  - type: mcq
    id: hook
    title: "Guess: who knows a mind better?"
    prompt: |
      Guess before any theory. A person has practised attention training for twenty years. A neuroscientist has scanned thousands of brains. Which statement seems closest to the truth?
    options:
      - text: "It depends on the question: how an experience feels from inside, or what physical process goes with it."
        correct: true
        feedback: |
          This is the intuition behind the lesson. The trained person has a long familiarity with how experience appears; the scientist has measurements of the brain. They answer different questions, and the debate is about whether and how they can be combined.
      - text: "The meditator, always, because only she has access to her own mind."
        feedback: |
          Access is not the same as accuracy. People can be wrong about their own minds, and training can change how one describes experience as well as how one sees it.
      - text: "The neuroscientist, always, because only measurements count as knowledge."
        feedback: |
          This treats one method as the only one. A scientist still needs people's reports to know what a scan is a scan of, so the question of how good those reports are does not go away.
    explanation: |
      The lesson follows what happened when Buddhist traditions and the sciences of mind met, and asks what each side can and cannot show the other.

  - type: text
    id: dialogues
    title: "The Mind and Life dialogues"
    image:
      src: img/dalai-lama.webp
      alt: "Portrait photograph of the 14th Dalai Lama, an elderly man in maroon robes, taken in 2012"
      caption: "The 14th Dalai Lama, Tenzin Gyatso, photographed in 2012; he took part in the Mind and Life dialogues from the first meeting in 1987."
      credit: "Christopher Michel, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:The_Dalai_Lama_in_2012.jpg"
    body: |
      According to the Institute's usual history, a man named R. Adam Engle proposed to the Dalai Lama (the 14th, Tenzin Gyatso, the Tibetan Buddhist leader) a dialogue with Western scientists. Francisco Varela (1946-2001), a Chilean biologist and neuroscientist, joined him. The first Mind and Life dialogue was a week in October 1987 at the Dalai Lama's residence in Dharamsala, India: six scientists, interpreters and the Dalai Lama, who is reported to have spent about five hours a day in discussion. At the end he agreed to do it again, and the series began.

      The founding date depends on what is counted. Sources date the *dialogues* to 1987, while the Institute was incorporated in the United States in 1991. Its stated aim is to bring science and contemplative wisdom together to understand the mind. Later the dialogues led to laboratory research, which the next cards come to.

  - type: mcq
    id: dialogues-q
    title: "What is a dialogue?"
    prompt: |
      A newspaper headline says: "Dalai Lama and scientists agree: meditation is proven." Given what the Mind and Life dialogues are, which reading is the most careful?
    options:
      - text: "They are structured conversations; what they establish depends on the evidence discussed, not on the fact that the meeting took place."
        correct: true
        feedback: |
          Yes. A meeting can raise questions, suggest experiments and build trust. A claim is settled, if it is, by the data presented, which can be checked separately.
      - text: "They are experiments: the Dalai Lama's agreement counts as a test result."
        feedback: |
          Agreement of respected people is not an observation. Nobody doubts the goodwill, but a conversation does not test a hypothesis; a study does.
      - text: "They are worthless, since religion and science cannot talk to each other."
        feedback: |
          That is a different overclaim. Conversations can be fruitful, as the later studies show, even if they prove nothing by themselves. Whether the two can be fully joined is the open question of the lesson.
    explanation: |
      Keep the layers apart: the dialogues are history (established); what they teach about the mind is argued case by case.

  - type: text
    id: principle
    title: "If science refutes a Buddhist claim"
    body: |
      In the Prologue of his book *The Universe in a Single Atom* (2005), the Dalai Lama states, in essence, that if scientific analysis were conclusively to show a claim in Buddhism to be false, Buddhists should accept the finding and give the claim up. He roots this in a method: understanding reality, in science as in Buddhism, goes by critical investigation. Commentators point to a traditional example, the old cosmology with its great world-mountain: one reviewer reports that the Dalai Lama thinks literal readings of it must be abandoned.

      The principle has a scope. It applies to what an observation could settle. Commentators add a distinction the logic itself requires: a claim that science has *not found* is not a claim that science has *shown false*. The first leaves the question open; only the second would trigger the principle.

  - type: mcq
    id: principle-q
    title: "Which claim does the principle reach?"
    prompt: |
      By the principle (give up a claim that science conclusively shows false), which Buddhist-tradition claim is the clearest case of one that an observation could refute?
    options:
      - text: "A claim that a world-mountain of a given height stands at the centre of our Earth's geography."
        correct: true
        feedback: |
          Yes. Measurements of the Earth could settle it, so this is a plain empirical claim. It is the kind of claim the principle was written for.
      - text: "A claim that suffering can end by a path of ethical conduct, meditation and wisdom."
        feedback: |
          This is a claim about a way of life and its result. Studies can test parts of it, such as stress or attention, but the whole claim also depends on what counts as the end of suffering, so it does not fall cleanly under "an observation refutes it".
      - text: "A claim that meditation is valuable because it is part of the path."
        feedback: |
          This is a claim about value and purpose inside a tradition. A measurement of anxiety cannot decide whether something is part of the right path to awakening.
    explanation: |
      The principle sorts claims: those an observation could refute, those it can only partly test, and those that are commitments about value. A fair discussion says which kind each claim is.

  - type: text
    id: lab
    title: "From conversation to the laboratory"
    body: |
      Some dialogue partners became researchers. Richard Davidson (born 1951), a professor of psychology and psychiatry at the University of Wisconsin-Madison and a longtime friend of the Dalai Lama, studies the brain in relation to meditation. Recall from the lesson What Meditation Does: in 2004 Lutz, Greischar, Rawlings, Ricard and Davidson compared eight long-term Buddhist practitioners with ten students, and found stronger gamma-band (fast, 25 to 70 cycles per second) brain activity in the practitioners during a compassion practice.

      The authors themselves state limits: the groups differed in age and culture, and it is for later studies to show whether the pattern comes from training or from differences that were there before. The collaboration was not free of friction either. In 2005, when Davidson invited the Dalai Lama to speak at a Society for Neuroscience meeting, more than 500 researchers signed a petition against it; according to the account of Davidson's career, the controversy faded as most scientists who attended found the talk appropriate. Whether religion and laboratory science may share a stage is itself debated.

  - type: mcq
    id: trap-brain
    title: "'Science proves meditation changes the brain'"
    prompt: |
      A headline reads: "Science proves meditation changes the brain." The study behind it compared eight long-term practitioners (mean age 49) with ten students (mean age 21) and found different brain activity. Which reply is the most accurate? Recall that a group gap has two parts: $\text{observed gap} = \text{effect of training} + \text{pre-existing difference}$.
    options:
      - text: "The gap may be partly training and partly differences that were there before; only assigning people at random to training or not could separate the two."
        correct: true
        feedback: |
          Yes. People who spend decades in practice may differ to begin with, and they also differ in age and culture. Assigning people by chance makes the groups alike at the start, so a later gap is more plausibly due to the training.
      - text: "The study shows nothing, since a sample of eight cannot show anything."
        feedback: |
          Small samples limit what one can conclude, but they do not make a finding meaningless. The authors tested a specific claim and reported a large, measurable difference; the issue is its cause, not its existence.
      - text: "The study proves it: the gap equals the effect of training."
        feedback: |
          That sets the pre-existing difference to zero without evidence. It is the exact inference the study design cannot support.
    explanation: |
      Randomized trials of meditation programs exist and give small to moderate benefits for anxiety, depression and pain (as in What Meditation Does). Reviews such as Van Dam and colleagues (2018, *Mind the Hype*) argue that much of the field still has small samples, weak control groups and overclaiming in the media. The honest summary: promising, partly established, often oversold.

  - type: text
    id: mbsr
    title: "Secular mindfulness"
    body: |
      The most widespread result of the meeting of Buddhist practice and science is outside the monastery. In 1979 Jon Kabat-Zinn founded the Stress Reduction Clinic at the University of Massachusetts Medical School. The program became a standard eight-week course called mindfulness-based stress reduction (MBSR), with weekly group sessions, a day of practice and daily home exercises, combining mindfulness meditation, body awareness and yoga. According to descriptions of the program, it draws on Buddhist practice but is itself secular: it presents mindfulness in the language of health and psychology, not of religion.

      Two views appear. Supporters say this is skilful: the benefit can reach people who would never join a religion, and the practice is judged by outcomes. Critics, some of them Buddhist, say that something is lost. According to the Buddhist texts, the path combines wisdom, ethical conduct and meditation, and a stress-relief course keeps only part of it. A third view says that the two are different things with a shared ancestor, which is fine so long as nobody claims that one is the other.

  - type: mcq
    id: mbsr-q
    title: "Same practice, same aim?"
    prompt: |
      A friend says: "MBSR is just Buddhism without the religion, so if MBSR lowers stress, that shows the Buddhist path works." What is the best reply?
    options:
      - text: "MBSR tests one borrowed practice against stress; the Buddhist path aims at ending suffering through wisdom, conduct and meditation together, which the study does not test."
        correct: true
        feedback: |
          Yes. A lower stress score is evidence about the course, not about the whole tradition or its goal. The two share a practice but differ in what they are for.
      - text: "MBSR cannot work, because it is cut off from its religious meaning."
        feedback: |
          The trials, not the origin, decide whether it works, and reviews report moderate evidence for effects on anxiety, depression and pain. A practice may help whatever its framing.
      - text: "If it lowers stress, the Buddhist worldview, including rebirth, is confirmed."
        feedback: |
          This moves from a small outcome to a large metaphysical claim. Nothing in a stress trial bears on rebirth, so the evidence does not reach so far.
    explanation: |
      A result is evidence only for the claim the study tests. Here that is a stress-reduction course, not the Buddhist path as a whole.

  - type: text
    id: lopez
    title: "Lopez: a history of the claim"
    body: |
      The historian Donald S. Lopez Jr. wrote *Buddhism and Science: A Guide for the Perplexed* (University of Chicago Press, 2008). According to reviews, he does not mainly ask whether Buddhism and science agree. He asks how and why people have said, from the nineteenth century to today, that they do, and what that story does for Buddhism in the modern world. Reviews tie its start to the aftermath of the 1893 World's Fair in Chicago, and note that Lopez treats the Dalai Lama's openness to science as part of that story.

      Reviewers differ on his conclusions. One reads him as sceptical that the two can be brought together; another sees a historian who asks "which science, which Buddhism?". So the claim "Buddhism is scientific" is itself a historical object: it was made by particular people at particular times, partly to make Buddhism acceptable in a modern world.

  - type: text
    id: wallace
    title: "Wallace: the taboo of subjectivity"
    body: |
      B. Alan Wallace, a scholar and teacher trained in Tibetan Buddhism, wrote *The Taboo of Subjectivity: Toward a New Science of Consciousness* (Oxford University Press, 2000). According to summaries, he separates four things: science, scientific realism, scientific materialism (the view that only matter is real) and scientism (the faith that science alone gives knowledge). He argues that the materialist doctrine, not science, has made first-person study of consciousness a taboo.

      His proposal is a science that combines the usual outside methods with disciplined *introspection*, that is, careful looking at one's own mind, drawing on the Western philosopher William James and on Buddhist contemplative works. In his view, long training can make the introspection more reliable, as long practice does for any skill.

  - type: mcq
    id: lopez-wallace
    title: "Lopez or Wallace?"
    prompt: |
      Two people discuss first-person meditative reports as scientific evidence. One says: "Trained introspection is a legitimate research method, long ignored." The other says: "Before judging any such claim, ask who has said that Buddhism and science agree, and why." According to this lesson, which pairing is correct?
    options:
      - text: "The first echoes Wallace, who argues for introspective methods; the second echoes Lopez, who studies the history of the compatibility claim."
        correct: true
        feedback: |
          Yes. Wallace makes a proposal about method; Lopez gives a historical and critical account of the discourse. The two answers do not exclude each other: one can take introspection seriously and still ask who is telling which story.
      - text: "The first echoes Lopez and the second Wallace."
        feedback: |
          It is the other way round. Wallace argues for first-person methods; Lopez is the historian who asks how the compatibility claim arose.
      - text: "Both are Wallace, since both defend Buddhism against science."
        feedback: |
          Lopez is not mainly a defender: reviews describe him as a historian, and some read him as sceptical of the compatibility story.
    explanation: |
      One author proposes a method (Wallace); the other gives a critical history (Lopez). A careful reader uses both.

  - type: text
    id: limits
    title: "What first-person training can and cannot show"
    body: |
      A trained report can tell us how experience appears: how attention wanders, how a feeling rises and fades, what a long practice is like from inside. These are data about the person's experience. Three limits keep appearing in the discussion.

      First, *which process underlies the report*. A report says nothing by itself about the brain, and the problem raised in the lessons The Hard Problem and Integrated Information and Other Rivals, why any physical process is accompanied by experience, stays open however well one describes the experience.

      Second, *what the training does to the report*. A tradition teaches its practitioners a vocabulary and an expectation. A practitioner trained to look for "no self" may find just that, and a reader who knows the claim in advance might find it too. This is not a reason to dismiss reports: all observation depends on trained observers. It is a reason to ask for cross-checks, such as reports from several traditions or links to measurable behaviour.

      Third, *what the reports can settle in metaphysics*. A clear experience of "no fixed self" may fit the Buddhist view, but a naturalist can also read it as a feature of how the brain builds the sense of self. Both readings accept the report.

  - type: mcq
    id: limits-q
    title: "A report of no self"
    prompt: |
      A practitioner says that after years of training she cannot find a fixed self, only changing experiences. According to the limits above, what does this report show, and what does it not?
    options:
      - text: "It shows how her experience appears to her; it does not alone show whether the brain makes a sense of self or whether the Buddhist doctrine is true."
        correct: true
        feedback: |
          Yes. The report is evidence about appearance. What lies behind the appearance is a further question that physicalists, Buddhists and others answer differently.
      - text: "It shows nothing, because first-person reports are never evidence."
        feedback: |
          That is too strong. Reports are the only way to know what an experience is like, and science relies on them whenever it asks a participant. The issue is how far they reach, not whether they count.
      - text: "It proves that the self does not exist, since she has looked carefully."
        feedback: |
          Looking carefully gives a report, and the step from the report to "the self does not exist" needs an argument. The next lesson takes up that kind of argument from the Buddhist side.
    explanation: |
      A report supports a claim about how experience appears. Moving to a claim about what exists needs further premises, which is why the kind of argument matters.

  - type: order
    id: design-order
    title: "A design that separates the two"
    prompt: |
      Put the steps of a study in order that tries to separate the effect of meditation training from differences that were there before.
    steps:
      - "Recruit a group of novices who are all willing to take part."
      - "Assign each person by chance to a meditation course or to an active comparison course."
      - "Measure brain activity and a questionnaire before the courses begin."
      - "Run both courses for the same time with the same attention from the teachers."
      - "Measure again and compare the change in the two groups."
    hint: "Think: who is in the study, how they are divided, what is measured first, what they do, what is measured last."
    explanation: |
      Assigning by chance spreads pre-existing differences across both groups, the active comparison keeps teacher attention and expectation alike, and comparing the *change* removes each person's starting point. Even then, such a study shows an effect of a course, not what long, lifelong practice does.

  - type: text
    id: readings
    title: "Two readings of the whole project"
    body: |
      Where do thoughtful people part ways on the project of joining Buddhism and the science of mind? The reason lies in what the two are taken to be.

      **A partnership.** According to supporters such as Davidson, the Dalai Lama and Wallace, the two bring different tools to one subject, the mind: contemplatives have a trained, long-practised study of experience; sciences have controlled measurement. Each may correct the other, as the Dalai Lama's principle says, and the later studies show what a joint project can do.

      **A category mistake.** A category mistake treats a claim of one kind as if it were of another. According to critics, such as readers of Lopez, the Buddhist path aims at liberation and is judged by a way of life, while science describes what happens, whatever one hopes for. On this reading, using scans to confirm the path, or the path to correct the lab, mixes aims and risks flattering both sides.

  - type: mcq
    id: readings-q
    title: "What would move each reading?"
    prompt: |
      Suppose a well-designed randomized trial (assigned by chance, active control) showed that an eight-week mindfulness course reduces anxiety moderately. Which statement about the two readings is the most careful?
    options:
      - text: "It supports the partnership reading for that practice and that effect, and it leaves the category-mistake reading untouched about the Buddhist path as a whole."
        correct: true
        feedback: |
          Yes. A result about a course and an outcome supports joint work on that practice. The critic can still say that the claim about liberation, or about what a person is, is not the kind of thing the trial tests.
      - text: "It refutes the category-mistake reading, since science has now confirmed a Buddhist practice."
        feedback: |
          It confirms a practice's effect on anxiety, not the path's aim. The critic's claim concerns the difference of kind, and one result of one kind does not touch it.
      - text: "It refutes the partnership reading, since a stress course is not Buddhism."
        feedback: |
          The partnership reading never said the course is Buddhism. It says the two can inform each other, and a trial of a borrowed practice is an example of that.
    explanation: |
      Each reading answers a different question: can the two inform each other (a partnership), and are they claims of the same kind (a category mistake). A result can support one and be neutral on the other.

  - type: text
    id: summary
    body: |
      **Next:** the lessons so far gave the Buddhist claim that there is no self. The guided proof *The Chariot and the Self* takes the ancient argument of Nagasena's chariot, lays it out as numbered premises, asks which premise a critic would reject, and checks whether the argument is valid separately from whether it is true.
