id: ch14-writing
title: "How the Hebrew Bible Was Made"
kind: concept
own: |
  The setting: the **Hebrew Bible** is the collection of texts that Jews call the Tanakh and Christians call (in their own order and count) the Old Testament. Everything below is taught according to someone: a tradition, a manuscript, an ancient writer or a school of scholars. A **manuscript** is a text copied by hand, a **scribe** is the trained person who copies it, and **textual criticism** is the scholarly study of the differences between copies in order to judge which wording came first.
  - **Voice before page.** According to Parry and Lord, who recorded Balkan singers, an oral poet often *recomposes* a song at each performance, keeping the story and its building blocks, not the exact words. According to Niditch, ancient Israel lived in a world where {{ speech and writing existed side by side }} for a long time. Whether a given biblical text rests on stable memory or on shifting retelling is debated.
  - **Early writing.** The Hebrew script is a local form of the Phoenician alphabet (consonant letters only). The Gezer calendar, a small limestone tablet (c. 10th century BCE, dating uncertain) listing farm tasks by season, shows that such writing existed; it does not show that {{ books existed }}, and scholars even disagree whether its language is Phoenician or Hebrew.
  - **Copying.** A scribe copying by eye can drop text (*haplography*: the eye jumps between two similar passages) or repeat it (*dittography*). Textual critics compare witnesses: the **Masoretic Text** (medieval Hebrew manuscripts such as the Aleppo Codex, c. 920-930 CE, and the Leningrad Codex, 1008 CE), the **Samaritan Pentateuch**, the **Septuagint** (Greek translation) and the **Dead Sea Scrolls** (found from 1947; the Great Isaiah Scroll is c. 125 BCE, about {{ 1000 years }} older than the Aleppo Codex).
  - **The name and the shelf.** The three parts give the acronym
  $$\text{Tanakh} = \text{T} + \text{N} + \text{K}$$
  with {{ T = Torah (5 books), N = Nevi'im (Prophets), K = Ketuvim (Writings) }}, 24 books in the Jewish count. A **canon** is the list of books a community treats as authoritative.
  - **Closing the canon.** According to the Talmud (Bava Batra) and Josephus, the sacred books were a fixed number long before the Middle Ages (24 in the Talmud, 22 in Josephus). According to Graetz (1871), a council at Jamnia closed the canon c. 90 CE; according to Lewis and Leiman, {{ no such council closed it }}, and the question of when it closed is still debated.
  - **Translations.** The **Septuagint** is the Greek translation begun in Alexandria in the 3rd century BCE (the Torah first). According to the Letter of Aristeas, 72 elders made it; most scholars call that account legend. Its Jeremiah is about one-eighth shorter than the Masoretic Jeremiah, and Qumran fragments suggest that {{ a shorter Hebrew edition existed }} (the other view: the translator abbreviated).
  - **Three layers.** Established: the manuscripts and inscriptions exist and differ. Live debate: how oral and written transmission mixed, and when the canon closed. Commitment: whether the text is divine revelation.

cards:
  - type: mcq
    id: hook
    title: "Guess: from voice to book"
    prompt: |
      Guessing is the point; no background is needed. A long story is told aloud by a community for many generations, then one day written on a scroll, and that scroll is copied by hand again and again for centuries. A historian compares a late copy with the story as first told. What is the most reasonable guess about the result?
    options:
      - text: "Some features are very stable (the plot, the key phrases people repeat), and some details shift with each retelling and each copy, so we need to study where each kind of change can happen."
        correct: true
        feedback: |
          Yes. Memory, voice and hand-copying each keep some things and lose others. This lesson goes through them in turn.
      - text: "Nothing can change, because a community that treasures a story would never let a word slip."
        feedback: |
          Care helps a great deal, but even careful hands slip, and storytellers often feel free to retell. The scrolls we have show differences between careful copies.
      - text: "Everything changes, so a late copy tells us nothing about the earlier story."
        feedback: |
          Too pessimistic. Copies of the same book can be compared, and the comparison often shows what changed and what did not.
    explanation: |
      The middle answer is the working hypothesis of this lesson: transmission is neither perfect nor hopeless. Which parts are stable, and how we can tell, are the questions.

  - type: text
    id: oral
    title: "Stories carried by voice"
    body: |
      An **oral tradition** is a body of stories, songs or laws handed on by speaking, not by writing. In the 1930s the scholar Milman Parry and Albert Lord recorded singers of heroic songs in the Balkans, who accompanied themselves on a one-stringed instrument. According to Lord's account, a singer did not memorize a fixed text. He *composed while performing*, using ready-made phrases (formulas) and standard scenes such as a feast or a council, so the same song could come out in different wording each time.

      This is a model, not a proof about Israel. The scholar Susan Niditch (*Oral World and Written Word*, 1996) used it to ask how the Hebrew Bible's repetition and stock phrases might reflect a world where speech and writing lived side by side. Rival views exist. Some scholars hold that memory in ancient communities was far more exact than the Balkan singers suggest, and others hold that the texts were shaped by scribes in writing from the start. Neither side has settled it.

  - type: mcq
    id: oral-q
    title: "One song, two performances"
    prompt: |
      According to Lord, a Balkan singer performs "the same song" twice, a year apart, with many different words. What does this suggest about what the singer and his audience counted as "the same"?
    options:
      - text: "The same story, with the same main scenes, even though the wording was recomposed each time."
        correct: true
        feedback: |
          Yes. For the singer, sameness was in the story and its building blocks, not in a word-for-word text. A reader used to printed books may wrongly expect the second kind of sameness.
      - text: "The singer was careless or dishonest, since a true song never changes."
        feedback: |
          Within the tradition the singer was doing his job well. The idea that a true song is fixed word for word comes from written culture.
      - text: "The singer was reading from a hidden written copy and sometimes misreading it."
        feedback: |
          Many of these singers could not read. The point of the study was that they composed from memory and skill while singing.
    explanation: |
      The rival view for the Bible says that ancient memory could be much more exact, for sacred texts especially. Whether any biblical text passed through a stage like Lord's singers is debated; the model shows only that exact wording is not the only way to keep a story.

  - type: text
    id: alphabet
    title: "The first Hebrew writing"
    image:
      src: img/gezer-calendar.webp
      alt: "A small limestone tablet with a few lines of faint letters carved in a very early alphabet, displayed in a museum case above its information label"
      caption: "The Gezer calendar (c. 10th century BCE, in the Istanbul Archaeology Museums) lists farm tasks by season; its date is uncertain because the dig did not record the layers."
      credit: "oncenawhile, CC0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Gezer_calendar_in_Istanbul.jpg"
    body: |
      The Hebrew script belongs to the family of the **Phoenician alphabet**, a set of about two dozen signs for consonants only, which developed in Canaan and on its coast in the second millennium BCE. The alphabet was far easier to learn than the hundreds of signs of Egyptian hieroglyphs or Mesopotamian cuneiform, so in principle many more people could learn to read. According to the usual convention, the Phoenician script is dated from about 1050 BCE; scholars call the local Hebrew form Paleo-Hebrew ("old Hebrew"), since later Jews adopted a different square script.

      One of the oldest examples is the **Gezer calendar**, a limestone tablet about 11 by 7 centimetres, found in 1908 by R. A. S. Macalister at Gezer, a Canaanite city about 20 miles west of Jerusalem. It names eight stretches of the farming year with their tasks, from gathering and sowing to hay making, barley harvest, vine pruning and summer fruit. It is usually dated to the 10th century BCE, but the dig was not stratified, so the date rests on the style of the letters. Scholars disagree about its language (Phoenician, or a northern Hebrew dialect) and its purpose: a schoolboy's exercise, a folk song, or a tool for tax collectors have all been suggested.

  - type: mcq
    id: alphabet-q
    title: "What can an inscription show?"
    prompt: |
      The Gezer calendar is a small tablet with a list of farm tasks, dated by its letter shapes to about the 10th century BCE. Which conclusion is on firmest ground?
    options:
      - text: "Someone in the region could write a short text in an early alphabetic script around that time; the tablet alone does not show that books, or the biblical texts, already existed."
        correct: true
        feedback: |
          Yes. A short list shows the skill of writing and a use for it. Whether long literary works were written then needs other evidence, and that is exactly what scholars argue about.
      - text: "The Torah was already written in full by then, since writing existed."
        feedback: |
          Having an alphabet is necessary for a book but does not show that any book was written. People who hold that the Torah is very ancient need further evidence of other kinds; the tablet cannot supply it.
      - text: "Writing was unknown in Israel before the tablet, so the Bible cannot be older."
        feedback: |
          Absence of earlier finds is weak evidence, since stone survives and papyrus or hide mostly rots. A new find can always push the date back.
    explanation: |
      Layers: that the tablet exists and carries early letters is established; its date, language and purpose are debated; nothing in it bears on whether any text is revealed. A short inscription is a small window.

  - type: text
    id: scribes
    title: "Scribes, scrolls and the materials of a book"
    body: |
      A **scribe** is a person trained to write and copy texts. An ancient book was usually a **scroll**: sheets joined side by side and rolled up. The sheets were **papyrus** (strips of the stem of a river plant, pressed crosswise) or **parchment** (animal skin, scraped and prepared). Papyrus was cheap but crumbled and survives mainly in dry places; parchment was costlier and lasted longer. Most of the Dead Sea Scrolls are on parchment, with a few on papyrus. A later form, the **codex**, is a stack of pages bound at one edge like a modern book.

      A hand-copied text is only as exact as its copyists. Textual critics name the usual accidents, and two are worth knowing by name. In **haplography** (from Greek words for "single writing") the eye jumps from one passage to a similar one later on, and the text between is dropped. In **dittography** ("double writing") the eye returns to a line and copies a bit twice.

  - type: mcq
    id: slip-q
    title: "Find the slip"
    prompt: |
      An invented example. A scribe copies the line "He sent the letter to the priest of the north, and the priest of the north read it aloud." His copy reads "He sent the letter to the priest of the north read it aloud." Which slip is it, and what would a textual critic do about it?
    options:
      - text: "Haplography: the eye jumped from the first 'the priest of the north' to the second and dropped the words in between; compare other copies, and the missing words probably appear in one of them."
        correct: true
        feedback: |
          Yes. The repeated phrase is the trap that makes the eye jump. The critic does not guess: she looks at other independent copies and at ancient translations to see whether the longer text appears there.
      - text: "Dittography: the scribe repeated a phrase that appeared once in the original."
        feedback: |
          Dittography adds a repeat. Here text is missing, not added, so the slip is the other kind.
      - text: "No slip: shorter wording is always the original, since scribes only add."
        feedback: |
          Scribes add as well as drop (glosses, explanations, repeats), and critics weigh each case. In this line the copy is also hard to read, which marks it as damaged.
    explanation: |
      A real critic works the same way on real verses: find the repeated or similar words, check other witnesses, and ask which reading explains how the other arose. A slip in one copy is detectable only because other copies exist.

  - type: text
    id: witnesses
    title: "The witnesses we can compare"
    image:
      src: img/isaiah-scroll.webp
      alt: "A photograph of a long parchment scroll with columns of Hebrew text, a cracked leather-brown surface and some gaps at the edges"
      caption: "A column of the Great Isaiah Scroll from Qumran (c. 125 BCE, now in Jerusalem), the oldest known complete copy of Isaiah."
      credit: "Ardon Bar Hama, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Great_Isaiah_Scroll_Ch53.jpg"
    body: |
      Until 1947 the oldest Hebrew manuscripts of most of the Bible were medieval. Then Bedouin found the first scrolls in a cave near Qumran on the north-west shore of the Dead Sea. Between 1947 and 1956 eleven caves gave about 980 manuscripts, many in fragments, mostly on parchment. Among them is the Great Isaiah Scroll, dated to about 125 BCE by letter shapes (radiocarbon gave a wider range, about 356 to 103 BCE), roughly a thousand years older than the previous oldest Hebrew manuscripts of Isaiah.

      According to Emanuel Tov, whose handbook on the textual criticism of the Hebrew Bible is the standard reference, there are four main kinds of witness: the Masoretic Text, the Samaritan Pentateuch (the Torah as kept by the Samaritan community), the ancient translations such as the Septuagint, and the Dead Sea Scrolls. The scrolls showed a lasting surprise: before the Common Era, copies of the same book circulated in more than one form.

  - type: numeric
    id: years-gap
    title: "How much older?"
    prompt: |
      The Great Isaiah Scroll is dated to about 125 BCE. The Aleppo Codex, once the oldest nearly complete Hebrew Bible, was made about 930 CE (some sources say 920). About how many years separate them? (There is no year 0: count from 125 BCE to 1 CE as 124 years, then 929 more.)
    answer: 1054
    tolerance: 60
    answerText: 'about 1050'
    wrong:
      - { value: 805, feedback: "That subtracts 125 from 930, which is right only when both dates are CE. A BCE date counts backward from year 1, so the two spans must be added." }
    hint: "A date BCE and a date CE lie on opposite sides of year 1, so add the two distances."
    explanation: |
      $125 + 930 = 1055$, or 1054 by the exact count with no year 0. Either way it is about a thousand years, which is why the scrolls changed the field: they let scholars test the medieval text against one from before the Common Era, and the match was close for many books.

  - type: text
    id: masoretes
    title: "The Masoretes and the codices"
    image:
      src: img/aleppo-codex.webp
      alt: "A page of a medieval Hebrew manuscript with three columns of text surrounded by small notes in the margins"
      caption: "A page of the Aleppo Codex photographed in 1887: the large text is the Bible, the tiny marginal notes are the Masoretes' count and check of the text."
      credit: "Solomon ben Buya'a and Aaron ben Moses ben Asher, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Aleppo_Codex_Genesis.jpg"
    body: |
      Hebrew was written with consonants only, so a reader had to know how to say the words. Between roughly the 7th and 10th centuries CE, scholars called the **Masoretes** (from a Hebrew word for "tradition") added signs for vowels and chanting and wrote notes in the margins, such as word counts, to protect the text from slips. The resulting text is the **Masoretic Text** (MT), the base of most Jewish and many modern Bibles.

      Two famous codices carry it. According to the usual account, the Aleppo Codex was written in Tiberias in the 10th century (about 920 to 930 CE) by the scribe Shlomo ben Buya'a, and the vowel signs and notes follow the tradition of Aaron ben Asher (some recent work asks how directly he was involved). The Leningrad Codex is dated 1008 CE and is the oldest surviving complete Hebrew Bible; many modern scholarly editions print its text.

  - type: text
    id: tanakh
    title: "The name and the shelf"
    body: |
      Jews call the collection the **Tanakh**, a word made of the first letters of its three parts. The **Torah** ("teaching" or "law") is the five books from Genesis to Deuteronomy. The **Nevi'im** ("Prophets") has eight books: the Former Prophets (Joshua, Judges, Samuel, Kings) and the Latter Prophets (Isaiah, Jeremiah, Ezekiel, and the Twelve counted as one book). The **Ketuvim** ("Writings") holds the rest, such as Psalms, Job, Proverbs and Chronicles. In the usual Jewish count the total is 24 books.

      Christians who use the same texts arrange them differently and count 39 in the Protestant Old Testament, because they count Samuel, Kings, Chronicles and Ezra-Nehemiah as two books each and the Twelve as twelve, and they place the prophets last. Catholic and Orthodox Bibles add further books. So "the Bible" is not one list: each community has its own shelf.

  - type: mcq
    id: canon-q
    title: "What does canon mean?"
    prompt: |
      A **canon** is the list of books a community treats as authoritative for its faith and life. A historian says: "This book was written in the 5th century BCE, but it was accepted into the canon much later." Which sentence best describes what she means?
    options:
      - text: "Writing a book and a community accepting it as sacred scripture are two different events, and they can be separated by centuries."
        correct: true
        feedback: |
          Yes. A canon is the result of a community's decisions. A book can be old and still be debated, and a late book can be accepted quickly.
      - text: "A book becomes true at the moment it enters the canon."
        feedback: |
          Entering the canon is a decision about authority. Whether a text is true, or inspired, is a separate question that different communities answer in their own way.
      - text: "The canon is the same list for every community that reads the Bible."
        feedback: |
          Jewish, Protestant, Catholic and Orthodox communities have different lists, as the outline of the Tanakh and the Protestant Old Testament showed.
    explanation: |
      Layers: which books each community accepts is a fact; how and when the lists were fixed is a debated historical question; whether the books are divinely authoritative is a commitment.

  - type: text
    id: closing
    title: "How the list was closed"
    body: |
      **According to the tradition's own sources.** The Talmud (the great collection of rabbinic teaching), in the passage called Bava Batra 14b-15a, lists the books of the prophets and the writings, 24 in all, and credits Moses with writing the Torah. The first-century Jewish writer Josephus (in *Against Apion*) says that his people have only 22 books that are rightly trusted, and he assigns the first five to Moses and thirteen to the prophets who followed him; his count merges some books that the Talmud counts apart. For believers, these are the books that were handed down as sacred.

      **According to modern scholars.** In 1871 the historian Heinrich Graetz proposed that a council of teachers at Jamnia (Yavne), a town where rabbis gathered after the Temple's fall in 70 CE, closed the canon about 90 CE. His main evidence was a passage of the Mishnah (Yadayim 3:5) recording a dispute over whether Ecclesiastes and the Song of Songs count as sacred books. That theory was popular for much of the 20th century, but Jack Lewis (1964) and Sid Leiman (1976) argued that the sources show a discussion by teachers, not a council that fixed a list. Many scholars now see a gradual process, with some holding that the list was largely fixed earlier, in the Hasmonean period (2nd to 1st century BCE). The date remains debated.

  - type: mcq
    id: jamnia-q
    title: "A council at Jamnia?"
    prompt: |
      A friend says: "The Jewish canon was closed by a council at Jamnia around 90 CE; that's established history." According to the scholars discussed here, which reply is fairest?
    options:
      - text: "It was a widely held theory proposed by Graetz in 1871; critics such as Lewis and Leiman argued the sources show only rabbinic discussion, and the date and manner of closing are still debated."
        correct: true
        feedback: |
          Yes. The theory was influential, and the evidence (a dispute about two books) is real, but it does not show a council with authority to close a list.
      - text: "Nothing happened at Jamnia, and the canon was never discussed by anyone."
        feedback: |
          Rabbis did meet at Yavne after 70 CE and discussed whether some books were sacred. The critics deny a council that closed the list, not the discussion.
      - text: "A council is the only way a canon can be closed, so Jewish scripture must be open and unfinished."
        feedback: |
          Communities can fix a list by long custom as well as by a vote. The Jewish list was in practice fixed, whichever way that happened.
    explanation: |
      Fact: the Mishnah passage exists. Debate: what it shows and when the list closed. Commitment: the tradition's conviction that the books are holy does not depend on the date.

  - type: text
    id: lxx
    title: "The Bible in Greek"
    body: |
      After Alexander's conquests, many Jews lived in Greek-speaking cities, above all Alexandria in Egypt, and needed the scriptures in Greek. The result is the **Septuagint** (Latin for "seventy"), abbreviated LXX. According to scholars, the Torah was translated in the mid or late 3rd century BCE and the other books during the 2nd. According to the Letter of Aristeas, a text of the 3rd or early 2nd century BCE, King Ptolemy asked the high priest in Jerusalem for translators, and 72 elders, six from each tribe, produced it in 72 days; most scholars treat this account as legend, though the translation itself is real.

      The early Church used the Septuagint, and it remains the Old Testament of the Orthodox churches. Most Jews drifted from it in the following centuries and preferred other Greek versions or the Hebrew. It matters to textual critics because it was made from a Hebrew text older than any medieval codex. Its order differs too: four sections (law, history, poetry, prophets), not three.

  - type: mcq
    id: lxx-q
    title: "Why do two editions differ?"
    prompt: |
      The Book of Jeremiah in the Septuagint is shorter than in the Masoretic Text, by about one-eighth, and arranged in a different order. According to textual critics, which explanations are live? Select all that apply.
    multiple: true
    options:
      - text: "The Greek translator worked from a Hebrew text that was already shorter than the one the Masoretes later copied."
        correct: true
        feedback: |
          Yes. This is the view many critics favour, because Hebrew fragments from Qumran (4QJer-b, according to several scholars) match the shorter Greek form.
      - text: "The Masoretic Hebrew text grew by additions in its own line of copying, so both editions once circulated in Hebrew."
        correct: true
        feedback: |
          Yes. It is the other side of the same view: two editions of one book existed, and the longer one was kept in the line that led to the Masoretes.
      - text: "The translator may have abbreviated or rearranged as he translated."
        correct: true
        feedback: |
          Yes, this was the older explanation and it cannot be ruled out for every verse. The Qumran evidence has made many scholars give it less weight for Jeremiah as a whole.
      - text: "One of the two versions is a deliberate forgery made to attack the other."
        feedback: |
          No source supports it. Differences like these have ordinary causes (copying, editing, translating), and scholars consider them one at a time.
    explanation: |
      Evidence decides here: a Hebrew manuscript older than both the translation and the medieval codices turned up and matched the shorter form. That does not show which form is more original or more sacred; communities take different positions on that. The point for textual criticism is that "the" text of Jeremiah existed in two editions.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Three statements about the Hebrew Bible. Which one is a faith commitment, not a fact or a scholarly debate?
    options:
      - text: "That the Torah was given by God to Moses at Sinai and is sacred."
        correct: true
        feedback: |
          Yes. According to Jewish tradition it is so, and for believers it is the basis of everything. History can study how the text was copied but can neither confirm nor refute a divine act.
      - text: "That the Great Isaiah Scroll from Qumran is about a thousand years older than the Aleppo Codex."
        feedback: |
          That is an established fact about manuscripts, dated by letter shapes and radiocarbon, with only the exact years open.
      - text: "That the Jewish canon was closed at one council at Jamnia."
        feedback: |
          That is a historians' theory, now widely challenged. It is a live debate, not a commitment.
    explanation: |
      Three layers again: established (the scroll, the codex, their dates), live debate (Jamnia, oral or written origins, which Jeremiah is older), commitment (the Torah is divine revelation, or is not).

  - type: mcq
    id: trap-variants
    title: "Trap: differences mean nothing is reliable"
    prompt: |
      A friend says: "The manuscripts differ in places, so we cannot know what the Bible originally said about anything." According to textual critics such as Tov, what is the best reply?
    options:
      - text: "Most differences are small (spelling, a dropped word, a repeated phrase) and can be sorted by comparing copies; a few are large, such as the two editions of Jeremiah, and those are studied case by case."
        correct: true
        feedback: |
          Yes. Differences are the raw material of the method, because only a text with several witnesses can be checked against itself. The opposite claim, that nothing differs, is equally false.
      - text: "There are no real differences; all copies are word-for-word identical."
        feedback: |
          They are not, as the Dead Sea Scrolls, the Septuagint and the codices show. Some traditions hold that the text was perfectly guarded; the manuscripts show a more varied picture, and that is a matter of evidence.
      - text: "Since copies differ, whichever one your community uses must be wrong."
        feedback: |
          A difference between witnesses does not make one of them false. Which text is authoritative is for each community to decide, and textual critics only say which readings seem older.
    explanation: |
      Two errors to avoid: "perfect copying" and "total uncertainty". Both are claims that go beyond what the manuscripts show.

  - type: mcq
    id: trap-old
    title: "Trap: oldest means original"
    prompt: |
      The Leningrad Codex (1008 CE) is the oldest surviving complete Hebrew Bible, yet the Great Isaiah Scroll (c. 125 BCE) is much older. A student says: "The older manuscript always has the original wording." According to textual critics, what is wrong with that?
    options:
      - text: "A late manuscript can copy a very early text, and an early one can contain its own slips, so each reading is judged on its merits, not by the age of the page."
        correct: true
        feedback: |
          Yes. Age of the page and age of the wording are different things. The Isaiah scroll matches the medieval text closely in many places and differs in others, and critics weigh each case.
      - text: "The oldest manuscript is always the least reliable because it is the most damaged."
        feedback: |
          Damage limits what can be read, but it does not make the surviving words unreliable.
      - text: "Age never matters in textual criticism."
        feedback: |
          Age matters, since an early witness is closer in time and may be free of later changes. It is evidence, not a verdict.
    explanation: |
      The method asks which reading best explains the others. Age of the physical copy is one clue among several.

  - type: text
    id: summary
    body: |
      **Next:** The Torah, the first part of the shelf, is where the sharpest debate about authorship begins. According to Jewish tradition Moses received it from God; according to many scholars it was assembled from several sources. The next lesson, "The Torah and the Documentary Hypothesis", sets out both and asks what evidence each uses.
