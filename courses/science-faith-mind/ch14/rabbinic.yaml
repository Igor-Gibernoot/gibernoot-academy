id: ch14-rabbinic
title: "Talmud, Midrash and Rabbinic Judaism"
kind: concept
own: |
  The setting: **rabbinic Judaism** is the form of Judaism built by teachers called rabbis after the Second Temple in Jerusalem was destroyed in 70 CE. Its main works are the **Mishnah** (a short collection of rulings), the **Gemara** (discussion of the Mishnah) and together they make the **Talmud**. Everything below is taught according to someone. Dates are counted in $\text{yr}$.
  - **Oral Torah.** According to rabbinic tradition, God gave Moses at Sinai a written Torah and an oral one, handed down in a chain (Pirkei Avot 1:1: Moses to Joshua, to the elders, to the prophets, to the Men of the Great Assembly). According to Josephus, the Pharisees kept observances from their fathers that the Sadducees refused because they were not written. According to the Karaites (from Anan ben David, 8th century), only Scripture binds.
  - **The corpus.** The Mishnah was edited by Judah ha-Nasi c. 200 CE, about
  {{ $$200-70=130\ \text{yr}$$ }}
  after the Temple fell. The Yerushalmi (late 4th to mid 5th century) and the Bavli (c. 500 to 600 CE) are two Gemaras on it. From the Mishnah to the Bavli is about $500-200=300\ \text{yr}$ to $600-200=400\ \text{yr}$.
  - **A Talmud page.** The old text stands in the centre; Rashi (1040 to 1105) is printed in the inner column and the Tosafot (12th to 13th century, "additions") in the outer. Minority views are kept.
  - **Who decides.** In the Oven of Akhnai (Bava Metzia 59b) Rabbi Eliezer's miracles and a heavenly voice fail; Rabbi Joshua answers with Deuteronomy 30:12, {{ "It is not in heaven" }}. According to Rabbi Yirmeya, the Torah already says to follow the majority (Exodus 23:2). Karaites read the story as rabbinic pride; Rubenstein reads it as majority rule that must stay fair.
  - **Living disagreement.** In Eruvin 13b a heavenly voice settled the dispute of Beit Shammai and Beit Hillel: {{ Both these and those are the words of the living God }}, yet the ruling follows Beit Hillel, who were agreeable and taught both views.
  - **Midrash.** Midrash reads verses closely. *Halakha* means law, *aggadah* means story and teaching. In Genesis Rabbah 1:1 Rabbi Hoshaya reads *amon* in Proverbs 8:30 five ways, among them "artisan": the Torah was the tool of craft of God. The four levels of PaRDeS are {{ peshat, remez, derash, sod }} (plain, hinted, comparative, secret).
  - **Three layers.** Established: the texts, their editors' dates, the page layout. Live debate: how old the oral traditions are and what the Pharisees held. Commitment: whether the oral Torah comes from Sinai, and who may interpret it.

cards:
  - type: mcq
    id: hook
    title: "Guess: a fixed text, a never-ending argument"
    prompt: |
      Guessing is the point; no background is needed. A community holds that its founding text is complete and cannot change. Yet for centuries its teachers argue, in writing, about what the text means, and they even record the opinions that lost. Which first guess is the most reasonable?
    options:
      - text: "Perhaps the argument is part of how the community keeps the text alive: a fixed text still needs interpreters, and keeping losing opinions may be a choice, not an accident."
        correct: true
        feedback: |
          Yes, as a first guess to test. This lesson follows one real case, rabbinic Judaism, and asks two questions: who decides, and does the argument weaken or strengthen the text?
      - text: "The arguing proves the text is unclear, so the community should have dropped it."
        feedback: |
          That assumes a text is useful only if it is unambiguous. Many founding texts (laws, constitutions, poems) stay central because later readers keep applying them to new cases.
      - text: "Teachers who argue are not really loyal; a loyal community would simply obey its leader."
        feedback: |
          Possible in some communities, but here the recorded arguments are themselves treated as study and as loyalty. We will see how.
    explanation: |
      Keep three things apart as we go: what the texts show (fact), what historians infer about how they grew (debate), and what a community holds about their authority (faith).

  - type: text
    id: yavneh
    title: "After the Temple: 70 CE"
    body: |
      In 70 CE Roman armies destroyed the Second Temple in Jerusalem, the centre of Jewish worship, where priests offered sacrifices. According to later rabbinic tradition, a teacher called Rabban Johanan ben Zakkai left the besieged city hidden in a coffin and met the Roman commander Vespasian. There he asked, "Give me Yavne and its sages" (as told by My Jewish Learning), and Vespasian agreed. Yavne (also spelled Yavneh; older scholarship calls it Jamnia) was a small coastal town; the tradition says he reconstituted the Sanhedrin, the court of sages, there and kept up the study of Torah.

      Historians note that the details come from stories told long after, so the coffin scene may be legend. Most agree on the larger picture: after 70 CE, leadership passed from the priests and the Temple to teachers and their schools, and practice shifted from Temple rites toward study and law. Whether Yavne held an official council that fixed the list of sacred books is a different, contested question, discussed in the lesson on the writing of the Hebrew Bible.

  - type: mcq
    id: shift-q
    title: "What had to change?"
    prompt: |
      Imagine a religion whose central ritual is sacrifice in one building, and the building is destroyed. According to historians of rabbinic Judaism, which development is the best summary of what followed?
    options:
      - text: "Teachers (rabbis) and their schools became the centre; study of the Torah and its application to daily life took the place the Temple had held."
        correct: true
        feedback: |
          Yes. This is the scholarly consensus in outline. How fast it happened, and how much authority the rabbis really had in the first centuries, are debated.
      - text: "The religion ended, and Jewish life was rebuilt from nothing a thousand years later."
        feedback: |
          Jewish communities continued, and the rabbinic works we study below were written within two to five centuries.
      - text: "Priests kept offering sacrifices in the old way in a new Temple built at Yavne."
        feedback: |
          No Temple was rebuilt at Yavne. The tradition about Yavne is about a school and a court, not sacrifice.
    explanation: |
      Layer 1 (fact): the Temple fell in 70 CE. Layer 2 (debate): the speed and extent of the rabbis' rise. Layer 3 (faith): rabbinic tradition sees Yavne as the point where the chain of teaching was saved.

  - type: text
    id: oral
    title: "The Oral Torah: three views"
    body: |
      According to rabbinic tradition, God gave Moses at Sinai the written Torah and also an oral explanation, passed down by word of mouth. The Mishnah opens the tractate Pirkei Avot ("Chapters of the Fathers") with the chain. In the translation of Joshua Kulp: "Moses received the Torah at Sinai and transmitted it to Joshua, Joshua to the elders, and the elders to the prophets, and the prophets to the Men of the Great Assembly." The passage adds the advice to "make a fence round the Torah".

      The Sadducees and the Pharisees, two movements before 70 CE, are the historical background. According to the historian Josephus (Antiquities 13.297), the Pharisees had handed on many observances from their fathers that are not written in the laws of Moses, and the Sadducees rejected them, saying only the written ones bind. Historians generally see the Pharisees as the movement from which rabbinic Judaism grew, though how exactly is debated.

      A third view comes later. Anan ben David, in eighth-century Baghdad, is linked to the origins of the Karaites, who hold that the rabbinic oral law is not divinely inspired and look to Scripture itself. Historians add that Karaism as a movement seems to have taken shape only in the ninth century and that its link to the Sadducees is debated.

  - type: mcq
    id: oral-q
    title: "Three views of one claim"
    prompt: |
      A friend says: "The oral Torah is a late invention, made up after the Temple fell." Which reply is fairest to the evidence and to the traditions?
    options:
      - text: "Josephus shows that Pharisees already kept inherited observances before 70 CE, so something like it is older than the rabbis; whether it goes back to Sinai is a matter of faith, and what its content was is debated."
        correct: true
        feedback: |
          Yes. The three layers separate cleanly: Josephus's report (fact), what the inherited traditions contained and how they grew (debate), Sinai (commitment).
      - text: "It is proved to go back to Sinai, because the Mishnah says so."
        feedback: |
          The Mishnah states the chain, but a text that claims its own origin is a claim to be weighed, not independent proof. Believers hold it by faith in the tradition.
      - text: "Karaites and rabbis agree that the oral law has the same authority."
        feedback: |
          They disagree on exactly this point. Karaites hold that Scripture binds and the rabbinic oral law is human.
    explanation: |
      According to rabbinic tradition, the oral Torah is as old as the written. According to historians, inherited practices existed before 70 CE and the rabbis later gathered and systematised them. According to Karaites, only the written Torah binds. Each is taught here as that group would put it.

  - type: order
    id: timeline-order
    title: "The corpus in time"
    prompt: |
      Put these events in order, earliest first.
    steps:
      - "The Second Temple is destroyed (70 CE)"
      - "The Mishnah is edited by Judah ha-Nasi (c. 200 CE)"
      - "The Yerushalmi (Jerusalem Talmud) is completed (late 4th to mid 5th century)"
      - "The Bavli (Babylonian Talmud) is completed (c. 500 to 600 CE)"
      - "Rashi writes his commentary (he lived 1040 to 1105)"
      - "The Shulchan Aruch is printed in Venice (1565)"
    hint: "The Mishnah comes first, then two Gemaras on it, then the medieval commentators and codes."
    explanation: |
      The Mishnah is the base. A Gemara ("completion", discussion of the Mishnah) was written in the land of Israel (the Yerushalmi) and, a little later, in Babylonia (the Bavli). Scholars give ranges for the end dates, because editing continued. Together a Mishnah and its Gemara make a Talmud; the Bavli is the one studied most.

  - type: text
    id: page
    title: "A page of the Talmud"
    image:
      src: img/talmud-page.webp
      alt: "A printed page of the Babylonian Talmud, tractate Berakhot 2a, with a block of text in the centre and columns of commentary around it"
      caption: "Berakhot 2a in the Vilna layout, the standard page: the Talmud text sits in the centre, with Rashi in the inner column beside the binding and the Tosafot in the outer column."
      credit: "Widow and Brothers Romm, Vilna, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Berakhot2a.jpg"
    body: |
      In the centre of a printed page stands the Mishnah followed by the Gemara's discussion. Around it are later commentaries. On the inner margin, near the binding, is Rashi (Rabbi Shlomo Yitzchaki, 1040 to 1105, of Troyes in France), whose commentary explains the text word by word. On the outer margin are the Tosafot ("additions"), by scholars of France and Germany in the 12th and 13th centuries, many of them his family; they often question Rashi or offer other explanations. Daniel Bomberg's Venice edition, around 1523, was the first complete edition to print the Talmud with Rashi and Tosafot, and later editions, among them the Vilna edition of the Romm press, kept the layout.

      The page itself teaches a method. It does not hide that people disagreed: it prints the argument, the minority views and the later replies side by side.

  - type: mcq
    id: page-q
    title: "Reading the layout"
    prompt: |
      On a standard printed page of the Babylonian Talmud, which description is correct?
    options:
      - text: "Talmud text in the centre; Rashi's explanation on the inner column; the Tosafot, which often question or extend Rashi, on the outer column."
        correct: true
        feedback: |
          Yes. The layout lets a student see the text, a first explanation, and the next generation's objections at once.
      - text: "Only the Tosafot are printed, because they replaced Rashi."
        feedback: |
          They did not replace him. Both stand on the page; the Tosafot often discuss his explanations.
      - text: "The page prints one agreed ruling and leaves out opinions that were rejected."
        feedback: |
          The opposite. Preserving rejected and minority opinions is a mark of the Talmud. Codes (below) are the works that give just the ruling.
    explanation: |
      Layer 1 (fact): how the page is arranged. The meaning of the preserved disagreement is the next question.

  - type: text
    id: oven
    title: "The Oven of Akhnai"
    body: |
      In the Babylonian Talmud (Bava Metzia 59b), Rabbi Eliezer ben Hyrcanus and the other sages disagree on a point of purity law about a clay oven that had been cut into rings and rebuilt with sand between them. Eliezer holds it pure, the others impure. The quotations are from the William Davidson Edition on Sefaria.

      Eliezer says: "If the halakha is in accordance with my opinion, this carob tree will prove it." The carob tree is uprooted and moves a hundred cubits. The sages reply that no proof is drawn from a carob tree. Then a stream flows backward, and the walls of the study hall begin to fall; Rabbi Joshua scolds the walls and they stop falling. Finally Eliezer says Heaven will prove it, and a Divine Voice declares that the halakha follows Eliezer in every place where he speaks.

      Rabbi Joshua stands up and says, quoting Deuteronomy 30:12: "It is not in heaven". Rabbi Yirmeya explains that the Torah was already given at Sinai, so a Divine Voice is not considered; the Torah itself says to incline "After a majority" (Exodus 23:2). Years later Rabbi Natan meets the prophet Elijah and asks what God did then. Elijah answers that God smiled and said, "My children have triumphed over Me; My children have triumphed over Me."

      The story ends sadly: the sages ostracised Eliezer, and Rabbi Akiva told him gently. *Halakha* here means the legal ruling.

  - type: mcq
    id: oven-q
    title: "Who decides?"
    prompt: |
      In the Oven of Akhnai, Rabbi Joshua answers a heavenly voice with the verse "It is not in heaven." Which statement correctly gives two readings of the story that thoughtful people have held?
    options:
      - text: "According to Rabbi Yirmeya's explanation (and the many who follow it), the Torah at Sinai has given the rules of interpretation, including following the majority, so human argument decides law; according to Karaites, the story shows rabbinic pride, because human votes override God."
        correct: true
        feedback: |
          Yes. Others add a third reading: Jeffrey Rubenstein sees a story about how a majority must lead while staying fair to the minority, and the sad end (the ostracism of Eliezer) as a warning. Karaites add that God's smile is an invention to make human decrees sound divine.
      - text: "The story shows that miracles prove who is right in law."
        feedback: |
          The sages reject exactly this: a tree or a stream proves nothing about the law.
      - text: "The story is a historical report that every rabbi accepted the ruling happily."
        feedback: |
          The story itself ends with Eliezer ostracised and the world suffering. It is a teaching story in a book of law, and readers differ on how literally to take it.
    explanation: |
      Notice what the two readings share: both start from the same text and ask who holds interpretive authority once the Torah is given. They differ on whether the answer is a legitimate gift of God or a human claim. That is a question of faith (layer 3). That the story is in the Talmud and what it says is layer 1.

  - type: text
    id: elu
    title: "Hillel and Shammai: both are the words of the living God"
    body: |
      Before 70 CE two schools of sages, the House of Hillel (Beit Hillel) and the House of Shammai (Beit Shammai), named after teachers of the late first century BCE and early first century CE, disagreed on many points of law. Beit Shammai is generally remembered as the stricter. The Talmud (Eruvin 13b) says that for three years each school claimed the ruling followed its opinion, until a Divine Voice proclaimed: "Both these and those are the words of the living God." But the halakha, the voice added, follows Beit Hillel.

      The Gemara then asks the obvious question: if both are the words of the living God, why did Beit Hillel get the ruling? Its answer: they were "agreeable and forbearing, showing restraint when affronted," they taught both their own opinions and those of Beit Shammai, and when they cited a dispute they named Beit Shammai's view first.

  - type: mcq
    id: elu-q
    title: "Why did Beit Hillel get the ruling?"
    prompt: |
      According to the Talmud (Eruvin 13b), a Divine Voice said that both the Hillelite and the Shammaite opinions are "the words of the living God", but the ruling follows Beit Hillel. What reason does the Gemara give, and what is one way to read the phrase?
    options:
      - text: "Their character and method: they were agreeable, taught both views and cited Beit Shammai first. One reading takes the phrase to mean a real plurality of meanings in the Torah; another takes it to say that sincere reasoning in good faith is holy even when only one view can guide practice."
        correct: true
        feedback: |
          Yes. The commentators differ on the phrase, and that disagreement is itself in the tradition: the Yam Shel Shlomo, for example, treats a sage's sound logic as holy as explicit divine words. The text states only that the ruling and the holiness of both views go together.
      - text: "Beit Shammai were proved wrong by a calculation, so only Hillel's view was ever divine."
        feedback: |
          The voice says both are the words of the living God. Nothing says Shammai was refuted.
      - text: "Beit Hillel were simply more numerous, so the voice followed the majority."
        feedback: |
          The Gemara gives their manner and teaching method as the reason, not their number.
    explanation: |
      This is the Talmud's habit in one sentence: keep the minority view in the record, choose a view for practice, and give a reason for the choice that is about how the teachers argued, not only what they concluded. Whether this means that truth is plural is a philosophical question the sources leave open.

  - type: text
    id: midrash
    title: "Midrash: reading a verse closely"
    body: |
      *Midrash* is the rabbinic way of reading the Bible by attending to its words. Collections are sorted by what they do. In *midrash halakha*, as in the Mekhilta on Exodus and the Sifra on Leviticus, verses are read to find law (*halakha*). In *midrash aggadah*, as in Genesis Rabbah, verses are read to tell stories, parables and lessons (*aggadah*). Genesis Rabbah is dated by scholars to the early 5th century (Strack and Stemberger: between 400 and 450).

      Here is a short example, from Genesis Rabbah 1:1 in the Sefaria Midrash Rabbah translation. Rabbi Hoshaya the Great begins from Proverbs 8:30, where Wisdom (the Torah, personified) says she was with God as an *amon*. The word is rare, so he gives several meanings: a child's caretaker, "covered", "hidden", "great", and finally "artisan". On that last reading the Torah says: "I was the tool of craft of the Holy One blessed be He." A king who builds a palace uses an architect's plans, he says, so too "the Holy One blessed be He looked in the Torah and created the world". Then he links this to the opening word of Genesis, *Bereshit*, read as "by means of the Torah".

  - type: mcq
    id: midrash-q
    title: "What is the midrash doing?"
    prompt: |
      In Genesis Rabbah 1:1, Rabbi Hoshaya reads the rare word *amon* (Proverbs 8:30) as "artisan" and concludes that God looked in the Torah to create the world. According to scholars who study midrash, which description is fair?
    options:
      - text: "He is reading a verse from another book to explain the first verse of Genesis, offering one reading among several for a rare word; it is aggadah (teaching), not a legal ruling, and it shows how the Torah can be treated as prior to creation."
        correct: true
        feedback: |
          Yes. A midrash does not usually claim to be the plain sense of the verse; it is a linked, creative reading, and the list of five meanings of the word shows the habit of keeping several.
      - text: "He is proving by translation that the Hebrew word can only mean 'artisan'."
        feedback: |
          He gives other meanings in the same passage. He does not claim the others are wrong.
      - text: "He is a historian reporting how the world was physically built."
        feedback: |
          The passage is a teaching about the Torah's place in creation, set as a parable of a king and his architect. It is not a physical account.
    explanation: |
      Compare the lesson Genesis, the Flood and Cosmology, where the same chapter was read as a poem, a theology, or a timetable. Midrash adds a different tool: tie a verse to others by a shared word, and let the surprise teach.

  - type: text
    id: pardes
    title: "Four levels: PaRDeS"
    body: |
      Later tradition summarised ways of reading in the acronym PaRDeS ("orchard"), from four words: *peshat* (the plain, direct meaning), *remez* (the hinted or allegorical meaning), *derash* (the comparative or homiletic meaning, as in midrash) and *sod* (the secret, mystical meaning). According to several scholars the full scheme as a theory comes late: it is credited to Moses de León in thirteenth-century Spain, and some think it adapted the fourfold method of medieval Christian readers. So PaRDeS does not describe how the early rabbis of the Mishnah and Gemara thought about their own method. The Talmud itself has a famous story of four sages who "entered the orchard", which is a different matter.

      Some authors define the four slightly differently (for example with *din*, law, in place of *derash*). Treat PaRDeS as a useful map, not as a single official rule.

  - type: mcq
    id: pardes-q
    title: "Which level?"
    prompt: |
      A reader says: "The first word of Genesis, *Bereshit*, can be read as 'by means of the Torah', so the Torah was God's plan for creation." On the four-level scheme PaRDeS, which level is closest to this kind of reading?
    options:
      - text: "Derash, the comparative or homiletic reading that connects one verse to others and draws a teaching."
        correct: true
        feedback: |
          Yes. It links Genesis 1:1 to Proverbs 8 and draws a lesson. Definitions of the levels vary slightly between authors.
      - text: "Peshat, because it is just the direct reading of the words."
        feedback: |
          Peshat means the plain, direct meaning of the words in context. This reading goes beyond it by linking verses.
      - text: "Sod, because any reading about creation must be secret."
        feedback: |
          Sod is the mystical or secret level, tied later to Kabbalah (the topic of the next lesson). This reading uses a comparison of verses and is not secret.
    explanation: |
      The scheme is later than the midrash it classifies, so using it is a way to organise, not a claim about what the rabbi thought he was doing.

  - type: text
    id: decides
    title: "From the Sanhedrin to the codes"
    body: |
      In the tradition, authority to interpret passed from the court of sages at Yavne (the Sanhedrin) to the rabbis of the Mishnah and Talmud, and on to later scholars. A code reduces the argument to a ruling. Maimonides (born 1138, some sources say 1135, died 1204) wrote the *Mishneh Torah* in Egypt between about 1170 and 1180: fourteen books of law in clear Hebrew that leave out the sources and the talmudic debate. Joseph Karo published the *Shulchan Aruch* ("Set Table") in Venice in 1565, taking as standards the rulings of Alfasi (the Rif), Maimonides and Asher ben Jehiel (the Rosh), following two of the three. He had earlier written the *Kesef Mishneh* (printed 1574 to 1575) to give the source of each law in the Mishneh Torah.

      Today communities answer the question of who decides in different ways, and each group is varied inside. In broad terms, Orthodox Jews hold that both the written and the oral Torah were revealed to Moses at Sinai and that halakha, applied by qualified authorities, binds. Conservative Judaism holds that the Torah and the oral law come from divine revelation but passed through human interpretation, and treats halakha as binding but open to reinterpretation. Reform Judaism holds that Scripture and oral law are divinely inspired but humanly constructed, treating halakha as guidance to adapt according to contemporary moral ideals. Karaites hold that Scripture alone binds. Descriptions of the Conservative position in particular vary by source.

  - type: mcq
    id: decides-q
    title: "The trade-off of a code"
    prompt: |
      The Talmud preserves arguments and minority opinions. Maimonides's *Mishneh Torah* gives rulings and leaves out the sources and the debate. According to the logic of each kind of work, which statement is fair?
    options:
      - text: "A code makes it easy to know what to do today, but a reader loses the reasons and the rejected views that the Talmud keeps; Karo's later commentary on the code, the Kesef Mishneh, added the sources back."
        correct: true
        feedback: |
          Yes. Neither work is the whole of the tradition: the Talmud trains the judgment and the code gives the answer. The tradition kept both.
      - text: "A code makes the Talmud unnecessary, and no one studies the Talmud after Maimonides."
        feedback: |
          Talmud study continued, and the printed Talmud with Rashi and Tosafot (above) is a late product of the same continuing study.
      - text: "A code adds new laws that the Talmud never contained."
        feedback: |
          A code claims to summarise and decide among what the Talmud already has. Whether it ever goes further is a matter for historians of each case.
    explanation: |
      Layer 1: what the works contain. Layer 2: how much a code simplifies or reshapes. Layer 3: which authority a believer accepts when two codes or communities disagree.

  - type: mcq
    id: movements-q
    title: "Who may interpret?"
    prompt: |
      Match the broad answers. Which statement describes the movements fairly (each is simplified, and each has varied voices inside it)?
    options:
      - text: "Orthodox: both Torahs revealed at Sinai and halakha binds; Conservative: revelation mediated by human interpretation, halakha binding but open to reinterpretation; Reform: inspired but humanly made, halakha as guidance; Karaite: Scripture alone binds."
        correct: true
        feedback: |
          Yes. The differences come from two premises: how much of the oral law is divine, and who may reinterpret it. Each movement would put its own position in its own words.
      - text: "Reform and Karaite Jews both accept the oral Torah as binding, and only Orthodox Jews study the Talmud."
        feedback: |
          Karaites reject the rabbinic oral law as binding.
      - text: "All four hold the Talmud was dictated word for word to Moses."
        feedback: |
          Conservative and Reform Judaism, as described above, do not hold that the Torah was dictated word for word, and Karaites reject the oral law.
    explanation: |
      Notice that the argument is not about whether to read the text but about who has authority to say what it means and how far the answer may change. That is the same question the Oven of Akhnai asks.

  - type: mcq
    id: traps
    title: "Traps: spot the mistakes"
    multiple: true
    prompt: |
      Select every statement that is a mistake.
    options:
      - text: "The Talmud replaced the Hebrew Bible; Jews who follow the Talmud no longer read the Bible."
        correct: true
        feedback: |
          Mistake. The Talmud quotes and discusses Bible verses throughout (the Oven story itself rests on Deuteronomy 30:12 and Exodus 23:2). It is a second body of study alongside the Bible, not a replacement, in the rabbinic view.
      - text: "Because the Talmud records both Hillel's and Shammai's views, rabbinic law has no way to reach a decision."
        correct: true
        feedback: |
          Mistake. The same passage says the ruling follows Beit Hillel and gives reasons. The tradition keeps the minority view for study and chooses one for practice.
      - text: "Historians agree that the whole oral Torah was invented after 70 CE."
        correct: true
        feedback: |
          Mistake. Josephus reports Pharisaic inherited observances before 70 CE. Historians debate the content and growth, not the existence of such traditions.
      - text: "According to Josephus, the Pharisees kept observances from their fathers that are not written in the laws of Moses."
        feedback: |
          This is accurate (Antiquities 13.297, in the standard translations), so it is not a mistake.
      - text: "The Mishnah and the two Gemaras are separate layers: the Mishnah is earlier, and each Talmud is a Gemara on it."
        feedback: |
          This is accurate, so it is not a mistake.
    explanation: |
      Each error flattens a layer: a historical edit becomes a replacement, a method becomes a failure, a debate becomes a fact.

  - type: mcq
    id: layers-q
    title: "Fact, debate or faith?"
    prompt: |
      Which assignment of layers to these three claims is correct? (1) The Mishnah was edited by Judah ha-Nasi around 200 CE. (2) The Pharisees' inherited observances were already a full oral law at the time of Josephus. (3) The oral Torah was given to Moses at Sinai.
    options:
      - text: "(1) established dating with some scholarly range, (2) live scholarly debate, (3) faith commitment"
        correct: true
        feedback: |
          Yes. The date c. 200 CE is the widely cited figure, the content of earlier traditions is debated, and Sinai is a commitment a historian cannot test.
      - text: "(1) faith, (2) established fact, (3) live debate"
        feedback: |
          Reversed: dating a text is evidence-based, and a claim about Sinai is not something a historian can confirm or refute.
      - text: "All three are established fact because they are in the texts."
        feedback: |
          That a text says something is fact; that what it says is true is another layer.
    explanation: |
      Neither believers nor historians are asked to give up their layer; they are asked to say which one they are speaking in.

