id: ch14-modern
title: "After Auschwitz: Covenant, Evil and Modern Judaism"
kind: concept
own: |
  The setting: the Jewish people in the modern age, from the European Enlightenment (18th century) to the state of Israel (1948). Everything is taught according to someone, and years are counted in $\text{yr}$ CE.
  - **Facing the Holocaust** (Nazi Germany and its allies murdered about six million Jews between 1933 and 1945). Richard Rubenstein (1924 to 2021, *After Auschwitz*, 1966) held that a covenant with a God who acts in history could no longer be affirmed. Hans Jonas (1903 to 1993) kept God's goodness and intelligibility and gave up {{ omnipotence }}, in a self-made myth where God gave all power to the world. Eliezer Berkovits (1908 to 1992, *Faith after the Holocaust*, 1973) explained God's absence as {{ *hester panim*, the hiding of the face, which protects human freedom }}. Emil Fackenheim (1967) added, in essence, a duty: {{ Jews must not give Hitler a posthumous victory }}.
  - **Modernity.** The Haskalah (Jewish Enlightenment, from the 1770s) and civil emancipation (France, 1791) asked how Jews could be citizens and Jews at once. Moses Mendelssohn (1729 to 1786) argued in *Jerusalem* (1783) that neither state nor religion may coerce conscience. The movements answered differently about Torah and *halakha* (Jewish law): Orthodox hold the law binding and divinely given; Conservative hold it binding and {{ interpreted collectively by a rabbinical body }}; Reform claim the right of interpretation without the authority of legal tradition; Reconstructionists (Mordecai Kaplan, 1934) see Judaism as an evolving religious civilization.
  - **Zionism and the state.** Theodor Herzl (1860 to 1904) published *Der Judenstaat* in 1896. The First Zionist Congress met at Basel in 1897, the Balfour Declaration followed in 1917, the UN partition vote in 1947 and the proclamation of Israel in 1948. In order: {{ 1896, 1897, 1917, 1947, 1948 }}. Jews disagree about it: religious Zionists (Rav Kook) see a stage of redemption, Haredi anti-Zionists (Satmar) see a forbidden forcing of the Messiah, secular Jews see a national home.
  - **Three layers.** Established: dates, works, numbers. Live debate: the exact count of victims, how each movement should be defined. Commitment: whether God hid, limited himself or was never the God of history, and what the state of Israel means.

cards:
  - type: mcq
    id: hook
    title: "Guess: a promise and a catastrophe"
    prompt: |
      Guessing is the point; no background is needed. Imagine a people whose scripture says that God made a promise (a *covenant*, a binding agreement) with them and with their descendants. In one generation millions of that people are murdered because of who they are. Which first guess about what this could mean for the promise seems most reasonable?
    options:
      - text: "Different thinkers will probably answer differently: some will say the promise is broken, some that God is limited, some that God hid for a reason, some that the survivors must keep going without an explanation."
        correct: true
        feedback: |
          A good first guess, and the shape of this lesson. We will follow four real answers and one objection to each.
      - text: "Everyone in the community will surely give the same answer, because the event is so clear."
        feedback: |
          The opposite happened. A tragedy that large raised more questions than one answer could close, and thoughtful believers part ways on it to this day.
      - text: "The question cannot be asked, since the promise has nothing to do with history."
        feedback: |
          In the Hebrew Bible the covenant is exactly about history (land, exile, return), so the question is natural. Some thinkers do reply that history is the wrong place to look, and we will meet that view too.
    explanation: |
      Keep three layers apart: what happened (fact), what scholars debate (for example how to define the movements), and what each person holds about God and the covenant (faith).

  - type: text
    id: facts
    title: "What happened"
    body: |
      According to the United States Holocaust Memorial Museum, the Nazi German regime and its allies and collaborators murdered about **six million** Jewish men, women and children between 1933 and 1945. Its estimate by method: about 2.7 million at killing centres, about 2 million in mass shootings, between 800,000 and 1,000,000 in ghettos and camps, and at least 250,000 in other acts of violence.

      According to Yad Vashem, the memorial in Jerusalem, there is no precise figure: serious research puts the total between five and six million, and the name of each victim is still being recovered. So the layers are: the event and its scale are established fact; the exact number is a range; the question of what it means for God is faith, and that is what the rest of the lesson explores. *Auschwitz*, a camp in occupied Poland, became a name for the whole event.

  - type: text
    id: rubenstein
    title: "Rubenstein: the end of the God of history"
    body: |
      **Richard L. Rubenstein** (1924 to 2021), an American rabbi and professor, published *After Auschwitz* in 1966. According to him, the traditional belief is that the God of the covenant chose Israel and acts decisively in history, rewarding and punishing. If that God exists, he concluded, then that God bears ultimate responsibility for Auschwitz, and he could no longer affirm it. He also rejected any reply that made the Nazis unwitting tools of the Lord of history.

      He did not conclude that the sacred is empty. According to the encyclopaedia summaries, he kept a sense of the divine as the ground of existence, emphasised community and ritual over doctrine, and suggested that paganism might be a way forward. The book was widely seen as the start of the modern debate on the Holocaust in Jewish and Christian theology. Rubenstein later wrote that it made him almost unemployable within the Jewish community; many Jews strongly rejected his conclusion.

  - type: mcq
    id: rubenstein-q
    title: "Which premise carries the argument?"
    prompt: |
      Rubenstein reasons roughly: (P1) the God of the covenant acts in history; (P2) the Holocaust happened in history, and such a God could have stopped it; (C) so that God cannot be affirmed. Which reply targets a premise rather than the conclusion?
    options:
      - text: "Deny P1: perhaps God does not act by controlling events, so the covenant is not about stopping history's horrors."
        correct: true
        feedback: |
          Yes. Replies of this type, which keep God and change what God does, are the ones in the next cards. They show where thoughtful people part ways: on the premise about divine action.
      - text: "Say the argument is invalid because six million is a small number."
        feedback: |
          This is not a reply to the premises; it is a moral failing and a historical error. The scale is established fact.
      - text: "Say that Rubenstein was not a rabbi, so his conclusion does not count."
        feedback: |
          He was a rabbi, and in any case the person speaking does not decide whether an argument is sound. Test the premises.
    explanation: |
      The same method as the arguments about evil in the lessons on God: separate validity (does the conclusion follow?) from soundness (are the premises true?), then ask which premise each reply rejects.

  - type: text
    id: jonas
    title: "Jonas: a God who gave away power"
    image:
      src: img/jonas.webp
      alt: "A photograph of Hans Jonas, an older man with white hair, during a guest lecture."
      caption: "Hans Jonas (1903 to 1993), who fled Germany in 1933, photographed in 1983, one year before he gave the lecture on God after Auschwitz."
      credit: "unknown, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Hans_Jonas_an_der_Universit%C3%A4t_St._Gallen_(1983)_HSGH_022-001945_(cropped).jpg"
    body: |
      **Hans Jonas** (1903 to 1993) was a German-born philosopher who left Germany in 1933, fought in the British Army in the Second World War and later taught in New York. His lecture *The Concept of God after Auschwitz: A Jewish Voice* was given in 1984, and the essay appeared in the *Journal of Religion* in 1987.

      According to Henrix's study of the essay, Jonas offers a self-made myth: in creating the world God gave himself wholly into it and kept no power to steer events. Jonas draws on the Kabbalistic idea of the withdrawal of God (*tzimtzum*, from the lesson Jewish Thought: Maimonides, Kabbalah, Spinoza) but goes further than the Kabbalists, who held that God withdrew only in part. Jonas argues that three things cannot all hold together: God's goodness, God's omnipotence (unlimited power), and the intelligibility of God (that God can be understood). Any two exclude the third. He keeps goodness and intelligibility and gives up omnipotence. On this view God did not stop Auschwitz because God was not able to, and the responsibility for the world falls on humans.

  - type: mcq
    id: jonas-q
    title: "What did Jonas give up, and what is the cost?"
    prompt: |
      According to Jonas, God's goodness, God's omnipotence and the intelligibility of God cannot all be kept. Which statement fits his reply and its best objection?
    options:
      - text: "He gives up omnipotence and keeps goodness and intelligibility. An objection: a God with no power may leave the victims without any promise that justice will come."
        correct: true
        feedback: |
          Yes. Henrix presses just this: a powerless God may not leave room for a relationship, or for hope that the victims will be answered. Jonas's defenders reply that a God who is not all-powerful but suffers with the world is closer to what the tradition's prophets describe than a distant ruler.
      - text: "He gives up goodness: a God who allows such events is not good."
        feedback: |
          That is closer to the view that God did nothing and so is not good; Jonas rejects it. For him goodness is the one thing that must remain.
      - text: "He gives up intelligibility and says God can never be spoken about."
        feedback: |
          Jonas keeps intelligibility and calls it a guiding principle; a God we could not understand would also be a God whose goodness we could not claim.
    explanation: |
      This is the logical problem of evil in a Jewish voice: drop one of three claims. Other options: drop goodness (some skeptics), or drop the premise that God acts in history (Rubenstein), or find a reason for God's silence (Berkovits, next).

  - type: text
    id: berkovits
    title: "Berkovits: the hiding of the face"
    image:
      src: img/berkovits.webp
      alt: "A black and white photograph of Eliezer Berkovits, a man in a dark suit and glasses."
      caption: "Eliezer Berkovits (1908 to 1992), a rabbi and philosopher, in a photograph from 1950."
      credit: "Brum Berkovits, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:EliezerBerkovits1950Sidney.jpg"
    body: |
      **Eliezer Berkovits** (1908 to 1992), a rabbi and philosopher, published *Faith after the Holocaust* in 1973. He used an old biblical idea, *hester panim*, "the hiding of the face". In Deuteronomy 31:17-18, in the JPS translation, God says, about a future time of disaster, "I will abandon them and hide My countenance from them", and again "I will keep My countenance hidden on that day".

      In Deuteronomy the hiding follows the people's turning to other gods. According to Berkovits, the Holocaust cannot be explained that way, since the innocent cried out. He distinguishes a hiding that answers sin from one that is a mystery. He argues that God allows human freedom to be real, which means God must also allow people to do evil, and so God sometimes stays silent. In his view, this is not abandonment; it is the price of a world in which people are responsible agents. Believers can hold both that God is present and that God is hidden.

  - type: mcq
    id: berkovits-q
    title: "Objection and reply"
    prompt: |
      According to Berkovits, God's silence in the Holocaust is the cost of leaving human freedom real. A critic objects: "A parent who watched a child being murdered, able to stop it, would not be excused by respect for the murderer's freedom." Which is the best reply, and what stays open?
    options:
      - text: "Berkovits's defenders reply that a world with no real freedom could not have real responsibility or love, and that a hidden God is not an absent one; critics answer that this still leaves the scale of suffering unexplained."
        correct: true
        feedback: |
          Yes. This is the free-will defence from the lessons on evil, applied to the Holocaust. It does not claim to explain every case; it argues that freedom has a cost. The remaining gap is a premise (that freedom needs this much latitude), not a fact.
      - text: "Berkovits replies that the victims must have sinned, which is why God hid."
        feedback: |
          He says the opposite: the hiding of the second kind is not a judgement because of sin, and the innocent cried out. Teaching the first kind as the answer would be an offence to the victims, and he rejects it.
      - text: "Berkovits replies that the Holocaust did not happen in history."
        feedback: |
          He accepts the history fully. The question for him is how to hold faith after it.
    explanation: |
      Note the difference: Rubenstein rejects P1 and the covenant, Jonas limits God's power, Berkovits keeps power and uses freedom. Each has a price.

  - type: text
    id: fackenheim
    title: "Commanded survival, protest and a voluntary covenant"
    body: |
      Some responses do not try to explain God's silence. **Emil Fackenheim** proposed in 1967 what he called a 614th commandment (the tradition counts 613 in the Torah). According to My Jewish Learning's summary, it says that Jews are forbidden to hand Hitler posthumous victories, which he drew into a duty to survive as Jews, to remember the martyrs and not to despair of God. His own later writings treated it with less claim to be a revelation, and Orthodox critics found it bold.

      **Elie Wiesel** (1928 to 2016), a survivor and Nobel Peace Prize winner (1986), wrote *Night* (English, 1960) and a 1979 play, *The Trial of God*, in which three Jews in a camp put God on trial. This is often called *protest theology*: the believer stays in the argument and accuses God. **Irving Greenberg** proposed, in essays of the early 1980s, that the covenant became voluntary: Jews, free to leave after what happened, choose to continue.

      None of these says the question is solved. Fackenheim asks what to do, Wiesel asks how to keep arguing, Greenberg asks what binds a people after the catastrophe.

  - type: mcq
    id: replies-q
    title: "Match reply, price and rival"
    prompt: |
      Four replies to the Holocaust: (a) the covenant with a God of history cannot be affirmed (Rubenstein); (b) God has no power to intervene (Jonas); (c) God hides to leave freedom real (Berkovits); (d) survival and memory are a duty even if no explanation is found (Fackenheim). Which statement is accurate?
    options:
      - text: "(c) keeps God omnipotent and good at the price of an unexplained scale of suffering, while (b) limits God's power at the price of a promise for the victims."
        correct: true
        feedback: |
          Yes. Each answer saves one thing and pays for it with another, which is why they remain rivals.
      - text: "(a) and (c) both hold that God acts in history as the tradition taught, and differ only on whether to mourn."
        feedback: |
          (a) says that God cannot be affirmed as the traditional covenantal God; (c) keeps the traditional God. They are opposed.
      - text: "(d) explains why God allowed the Holocaust."
        feedback: |
          (d) deliberately does not explain; it names a task for the living.
    explanation: |
      To judge such answers, ask which premise each rejects (God acts, God has all power, God is good, God can be understood) and what each retains.

  - type: text
    id: haskalah
    title: "Modernity: how to be a citizen and a Jew"
    image:
      src: img/mendelssohn.webp
      alt: "A portrait of Moses Mendelssohn, a man in an 18th-century coat, after a painting by Anton Graff."
      caption: "Moses Mendelssohn (1729 to 1786), the best-known figure of the Jewish Enlightenment, in a portrait after Anton Graff."
      credit: "After Anton Graff, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Moses_Mendelson_P7160073.JPG"
    body: |
      Before the Holocaust came another change. The **Haskalah** ("Enlightenment" in Hebrew) was a movement among European Jews, defined from the 1770s, of people (*maskilim*) who wanted Jewish life to meet the ideas of the wider Enlightenment: reason, secular learning, the language of the country. **Emancipation** means the gaining of equal citizenship: revolutionary France emancipated its Jews in September 1791 (sources give the 27th or the 28th), and Germany did it state by state, ending in 1871.

      **Moses Mendelssohn** (1729 to 1786), a philosopher, was the movement's best-known example. His *Jerusalem* (1783) argued, according to the Stanford Encyclopedia, that neither state nor religion may coerce the individual conscience, and that Judaism, as he read it, is compatible with this because revelation is legislation, not a source of new truths. He also translated the Torah into German, which helped young Jews to learn the language.

      The question for the next two centuries was, in the words of historians, whether emancipation led to assimilation or to a Jewish nation. The article on the Haskalah notes both movements followed.

  - type: mcq
    id: mendelssohn-q
    title: "What did Mendelssohn argue?"
    prompt: |
      According to the Stanford Encyclopedia, which statement is closest to Mendelssohn's view in *Jerusalem* (1783)?
    options:
      - text: "The state may use force, but religion rests only on persuasion, so neither may coerce conscience; Judaism, he argued, fits this because its revelation is law, not a list of doctrines to be believed on pain of punishment."
        correct: true
        feedback: |
          Yes. This lets a Jew be a loyal citizen without giving up the law, which is why later thinkers on every side read him.
      - text: "Judaism should give up the commandments in order to become part of the nation."
        feedback: |
          That is the view of some later reformers, but not Mendelssohn's. He kept observance.
      - text: "The state should enforce religious belief so that society is stable."
        feedback: |
          He argued the opposite: religious power rests on persuasion, not force.
    explanation: |
      Layer 1: dates and the work. Layer 2: how far he agreed with later movements (they all claim him). Layer 3: whether law and reason fit together.

  - type: text
    id: movements
    title: "Four answers to modernity (broad terms)"
    body: |
      The movements below differ chiefly on one question: **is the *halakha*, the body of Jewish law, binding, and who decides what it means?** These descriptions are broad: each movement has internal variety, and the movements disagree about each other.

      | Movement | View of Torah and law, in broad terms |
      |---|---|
      | Orthodox | The Written and Oral Torah are of divine origin; *halakha* is binding. |
      | Conservative | *Halakha* is binding but developing; a rabbinical body interprets it collectively. |
      | Reform | Claims the right to interpret without accepting the authority of legal tradition; keeps ethics. |
      | Reconstructionist | Judaism as an evolving religious civilization (Mordecai Kaplan, 1881 to 1983, *Judaism as a Civilization*, 1934). |

      Reform arose in connection with the Haskalah. Orthodox responses included *Torah im Derech Eretz* in Germany, a way of joining Torah with secular learning, and others that held to separation. Each calls its own way the faithful one, and the others disagree. The scholar describes; the believer chooses.

  - type: mcq
    id: movements-q
    title: "Who would say this?"
    prompt: |
      A Jew says: "The law is binding, but each generation's rabbis, deciding together, must interpret how it applies today." In broad terms, which movement does this fit best?
    options:
      - text: "Conservative Judaism."
        correct: true
        feedback: |
          Yes: binding law, collective rabbinical interpretation.
      - text: "Reform Judaism."
        feedback: |
          Reform claims the right to interpret but, in broad terms, does not accept the authority of legal tradition as binding.
      - text: "Orthodox Judaism."
        feedback: |
          Orthodoxy also holds the law binding but, in broad terms, does not hold that a rabbinical body may revise it; the speaker's emphasis on collective reinterpretation points elsewhere. Orthodox thought has internal variety, though.
      - text: "Reconstructionist Judaism, because it denies all law."
        feedback: |
          Reconstructionism sees law and customs as part of an evolving civilization, not as something denied; the claim "denies all law" is a caricature.
    explanation: |
      Broad terms are a map, not a verdict. A scholar of religion describes how each movement defines itself; which is right is a commitment, not a historical result.

  - type: text
    id: zionism
    title: "Herzl and the road to a state"
    image:
      src: img/herzl.webp
      alt: "A sepia photograph of Theodor Herzl, a bearded man in a dark coat, leaning on a balcony rail above a river."
      caption: "Theodor Herzl (1860 to 1904), photographed on a balcony in Basel; he is the founder of political Zionism."
      credit: "Ephraim Moses Lilien, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Herzl_on_a_balcony_full.jpg"
    body: |
      **Zionism** is the movement for a Jewish national home. **Theodor Herzl** (1860 to 1904) published *Der Judenstaat* ("The Jewish State") on 14 February 1896. The **First Zionist Congress** met at Basel from 29 to 31 August 1897 and adopted the Basel Program, which aimed at a home in Palestine for the Jewish people secured by public law.

      On 2 November 1917 the British foreign secretary, Arthur Balfour, wrote that his government viewed with favour "a national home for the Jewish people" in Palestine, provided nothing prejudiced the civil and religious rights of the existing non-Jewish communities. On 29 November 1947 the UN General Assembly voted 33 to 13, with 10 abstentions, for Resolution 181, a plan to partition Palestine into an Arab and a Jewish state with an international zone for Jerusalem. The Jewish Agency accepted it with misgivings; Arab leaders rejected it, and war followed. On 14 May 1948 David Ben-Gurion read the declaration of the State of Israel in Tel Aviv.

      This is the history; its *meaning* is contested, as the next card shows.

  - type: text
    id: zionism-views
    title: "Jews on the state: three views"
    body: |
      Jews have disagreed about Zionism since the start. These are three of the views, in the terms of their own holders.

      **Religious Zionism.** According to Rabbi Abraham Isaac Kook (1865 to 1935), the resettlement of the land is a stage in a divine plan of redemption, and even secular Zionists, he held, carry a divine spark without knowing it.

      **Haredi anti-Zionism.** According to Rabbi Joel Teitelbaum (1887 to 1979, founder of the Satmar dynasty), establishing a state before the Messiah comes is a forbidden act of impatience, based on the Talmud's "Three Oaths", and he told followers not to take part in the state's politics. Other Haredi leaders objected for another reason: they feared that nationalism would replace religion as the basis of Jewish identity.

      **Secular and national views.** Many Jews see the state as a national home, a refuge and a political fact, with no messianic meaning, and some Jewish thinkers, such as Kaplan, see Judaism itself as a civilization more than a creed.

      A note on fairness: the 1947 plan and the war that followed also shaped the lives of Palestinians; this lesson only covers how Jews saw it. The Israeli Declaration of 1948 itself promised equality of social and political rights to all inhabitants, and how that was met is argued by historians.

  - type: mcq
    id: zionism-q
    title: "Same event, different readings"
    prompt: |
      According to Rabbi Kook and according to Rabbi Teitelbaum, the founding of the State of Israel in 1948 means very different things. Which statement is accurate?
    options:
      - text: "Kook read the return as a stage of redemption; Teitelbaum read the founding of a state before the Messiah as a forbidden forcing of the end. Both argued from Jewish sources."
        correct: true
        feedback: |
          Yes. The disagreement is not about the facts of 1948 but about what the Jewish tradition says about redemption and human action.
      - text: "All religious Jews accepted the state's founding as a miracle."
        feedback: |
          Some did (religious Zionists), but Haredi anti-Zionists did not, and the range between them is large.
      - text: "Only secular Jews were Zionists."
        feedback: |
          Kook, a rabbi, is the best-known religious Zionist thinker. Zionism has religious, secular and mixed forms.
    explanation: |
      Same date, two readings, each backed by texts. Neither is read as a fact of history; each is a commitment about redemption.

  - type: order
    id: dates-order
    title: "Order the road"
    prompt: Put these events in the order they happened, earliest first.
    steps:
      - "Mendelssohn publishes Jerusalem (1783)"
      - "Herzl publishes Der Judenstaat (1896)"
      - "The Balfour Declaration (1917)"
      - "The UN General Assembly votes for partition (1947)"
      - "Israel is proclaimed (1948)"
    hint: The Enlightenment comes first, the pamphlet that founds political Zionism comes before the British letter, and the UN vote came six months before the proclamation.
    explanation: |
      Mendelssohn's book belongs to the Enlightenment, Herzl's pamphlet to the 1890s, the Balfour letter to the First World War, and the UN vote and the proclamation are six months apart in 1947 and 1948.

  - type: numeric
    id: years-numeric
    title: "From the Temple to the state"
    prompt: |
      According to the history of the Rabbinic period, the Second Temple in Jerusalem was destroyed in 70 CE, and the State of Israel was proclaimed in 1948 CE. How many years lie between the two events?
    answer: 1878
    tolerance: 0
    answerText: '1878'
    wrong:
      - { value: 2018, feedback: "That adds the two years instead of subtracting. Both are CE, so subtract the earlier from the later." }
      - { value: 1877, feedback: "Both dates are CE, so there is no year zero to adjust for; the difference is simply 1948 minus 70." }
    hint: Both dates are CE, so subtract.
    explanation: |
      $1948 - 70 = 1878$ years. For many Jews, this long gap between the Temple and a Jewish state is part of why the founding of Israel means so much, to those who see it as redemption and to those who think it came too early.

  - type: mcq
    id: traps
    title: "Which claims are mistaken?"
    prompt: |
      Select every claim that is a mistake.
    multiple: true
    options:
      - text: "All Jews hold the same view of what the Holocaust means for God."
        correct: true
        feedback: |
          Mistaken. Rubenstein, Jonas, Berkovits, Fackenheim and Wiesel disagree, and many others hold other views or none.
      - text: "Judaism is only a religion, so Jewish identity is only a matter of belief."
        correct: true
        feedback: |
          Mistaken, or at least contested. Many Jews, including secular ones, see Judaism also as a people, a culture or a civilization (Kaplan's word). Others insist on religion. The disagreement is real.
      - text: "All Orthodox Jews support the State of Israel."
        correct: true
        feedback: |
          Mistaken. Religious Zionists do, but many Haredi groups, such as Satmar, oppose a state before the Messiah.
      - text: "Jewish thinkers have given more than one answer to the problem of evil after the Holocaust."
        feedback: |
          This is correct, which is why it is not selected.
    explanation: |
      Traditions are not blocs. Describe a tradition as its different adherents do, and avoid one-view statements.

  - type: mcq
    id: layers
    title: "Which layer?"
    prompt: |
      Which of these statements is a faith commitment (layer 3) rather than a fact (layer 1) or a scholarly estimate (layer 2)?
    options:
      - text: "God hid his face so that human freedom could be real (Berkovits)."
        correct: true
        feedback: |
          Yes. It is a claim about God's reasons, which no archive can settle; it is held, argued, or rejected.
      - text: "The UN General Assembly adopted Resolution 181 on 29 November 1947, by 33 votes to 13."
        feedback: |
          This is a documented fact (layer 1).
      - text: "Serious research puts the number of Jewish victims between five and six million."
        feedback: |
          This is a scholarly estimate from historical evidence (layer 2): a range, not a belief.
    explanation: |
      The same skill used in every lesson: label each claim fact, debate or commitment, and never present a commitment as a fact in either direction.

  - type: text
    id: summary
    body: |
      **Next:** the level's traps (fast questions on common misconceptions), then the content map and the level challenge, and after Level 14 the course turns to Christianity and the Gospels.
