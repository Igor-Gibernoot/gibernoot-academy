id: ch14-scrolls
title: "The Dead Sea Scrolls and the Text"
kind: concept
own: |
  The setting: the **Dead Sea Scrolls** are about 981 manuscripts, mostly in Hebrew, found 1946-56 in eleven caves near Qumran, on the north-west shore of the Dead Sea; they date from the 3rd century BCE to the 1st century CE. About 40% copy books of the Hebrew Bible, about 30% are other Jewish writings and about 30% are works of a sect. Everything below is taught according to someone.
  - **How old.** The Great Isaiah Scroll (c. 125 BCE) is older than the Leningrad Codex (1008 CE). Counting 124 years from 125 BCE to 1 CE (there is no year 0):
  {{ $$124 + 1008 = 1132 \text{ years}$$ }}
  Its text is generally close to the medieval Masoretic Text (the traditional Hebrew text), with more than 2,600 small variants, mostly spelling and single words. According to many scholars the scrolls show a text that was **stable in the main and varied in detail**.
  - **Variety.** Before the Common Era copies of one book circulated in more than one form: some like the Masoretic Text, some like the Hebrew behind the Greek Septuagint, some like the Samaritan Pentateuch, some like none. The Septuagint's Jeremiah is shorter than the Masoretic Jeremiah by about
  {{ $\tfrac18$ }}
  and a Qumran fragment (4QJer-b) matches the short form: either the Greek translator cut, or a shorter Hebrew edition existed, and the scrolls favour the second.
  - **Who wrote them.** According to de Vaux, the Essenes at Qumran (the majority view). According to Golb, a library from Jerusalem hidden before the Roman siege. According to Schiffman, a sect whose roots lie in Zadokite (Sadducean-type) priests who left Jerusalem after the Hasmonean takeover of the high priesthood. The scrolls do not name their owners.
  - **The calendar.** Several scrolls count a year of 364 days, which is whole weeks, so each festival falls on the same weekday every year:
  {{ $$364 = 52 \times 7$$ }}
  A true solar year is about 365.24 days, so the gap grows by
  {{ $$365.24 - 364 \approx 1.24 \text{ days per year}$$ }}
  and after 30 years the calendar is about 37 days off, unless it was corrected or was an ideal never put to the test.
  - **Three layers.** Established: the manuscripts, their dates, the variants. Live debate: who owned them, how to group the text-types, whether the short Jeremiah is older. Commitment: whether Scripture's wording was preserved by divine care, and what the variety implies for that.

cards:
  - type: mcq
    id: hook
    title: "Guess: a copy 1,000 years older"
    prompt: |
      Guessing is the point; no background is needed. For centuries the oldest known copy of a long book is dated to the year 1008. One day a copy of the same book is dug up, written about 1,100 years earlier. A cautious historian compares the two. What is the most reasonable guess about what she finds?
    options:
      - text: "Mostly the same story, with many small differences of spelling and wording, and perhaps a few bigger ones: the two copies come from a long chain of hand copying, and each link could add slips."
        correct: true
        feedback: |
          Yes. Hand copying over a thousand years makes tiny changes likely, and careful copying makes large changes less likely. The finding is a mixture, which is what the lesson will meet.
      - text: "Word-for-word identical, because people treat holy books with great care."
        feedback: |
          Care matters, but identical copies after 1,100 years of hand copying would be remarkable. We will see how close the real copies are and where they differ.
      - text: "Completely different, because stories change a lot when retold."
        feedback: |
          Retelling aloud changes stories, but a written text copied by trained scribes is held more firmly. A complete rewrite would be a surprising result for a copied scroll.
    explanation: |
      In 1947 this situation became real for the Hebrew Bible. This lesson looks at what the scrolls are, who may have written them, what they show about the text, and what they show about the Judaism of their time, keeping apart fact, scholarly debate and faith.

  - type: text
    id: discovery
    title: "A shepherd, a cave and a dealer"
    image:
      src: img/qumran-cave.webp
      alt: "A photograph of a cave opening cut into a pale rocky cliff above the Dead Sea desert near Qumran"
      caption: "One of the caves near Qumran where scrolls were found; the dry desert air kept parchment and papyrus for about two thousand years."
      credit: "Peter van der Sluijs, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Cave_in_Qumran_historical_place_bible_scrolls.jpg"
    body: |
      According to the usual account, in late 1946 or early 1947 a young Bedouin shepherd of the Ta'amireh tribe, Muhammad edh-Dhib, was looking for a lost animal near the north-west shore of the Dead Sea. He threw a stone into a cave opening and heard pottery break. Inside stood jars with leather-wrapped scrolls. The Bedouin sold them in Bethlehem and the news reached scholars; it was announced to the world in April 1948. Different tellings of the story vary on who entered the cave and exactly when, so the tale is better treated as a good story with a core, not as a record.

      Searches of the area between 1947 and 1956, by Bedouin and by archaeologists, found eleven caves with manuscripts. Cave 4 alone gave about 90% of the material, some 15,000 fragments from about 500 texts. The count of separate manuscripts is 981. The text is mostly Hebrew, with some Aramaic and a few Greek texts; most is on parchment, some on papyrus, and one scroll is on copper. The dry desert climate kept them. The Dead Sea Scrolls date from the 3rd century BCE to the 1st century CE.

  - type: text
    id: contents
    title: "What is in the caves"
    body: |
      Roughly three kinds of text were found, in about these shares.

      | Kind | Share | Examples |
      |---|---|---|
      | Copies of books of the Hebrew Bible | about 40% | Isaiah, Psalms, Genesis |
      | Other Jewish writings, not in the Hebrew Bible | about 30% | Jubilees, Sirach |
      | Works of a sect, with its rules and commentaries | about 30% | Community Rule, War Scroll |

      Most of the scrolls are fragments, and only a few are nearly complete.

      "Canonical" means a book accepted into the Bible; this is a later decision, and the scrolls show a time before it was fixed in every community. A sectarian work is one written by and for a particular group.

  - type: mcq
    id: contents-q
    title: "Which kind of text?"
    prompt: |
      A fragment found in a Qumran cave is a commentary (a *pesher*) on the prophet Habakkuk that applies his words to the history of a particular group and its enemies. Which statement is fair?
    options:
      - text: "It is a sectarian work: it reads a prophet in the light of one group's own story, so it tells us about that group, not only about Habakkuk."
        correct: true
        feedback: |
          Yes. A pesher ("interpretation") quotes a verse and then says what it means for the group's own time. It is evidence for how that group read Scripture.
      - text: "It is a copy of a book of the Hebrew Bible, because it quotes Habakkuk."
        feedback: |
          A copy of Habakkuk would give the prophet's words only. This text adds an interpretation that belongs to the commentator's group, and so counts as a separate work.
      - text: "It shows that Habakkuk was written by the group."
        feedback: |
          The commentary treats Habakkuk as an older prophet whose words are being explained. It does not claim to have written them.
    explanation: |
      The mixture matters: biblical copies tell us about the text; sectarian works tell us about a community's beliefs; and the other writings show a library wider than the Bible.

  - type: text
    id: who
    title: "Who wrote and kept them?"
    body: |
      Near the caves lie the ruins of Qumran, a settlement of the Second Temple period (the time when the Jerusalem Temple stood, rebuilt after the exile and destroyed by Rome in 70 CE). Three main views.

      **The Essene hypothesis.** Roland de Vaux dug Qumran in the 1950s and read it as the home of a community of Essenes, a strict Jewish movement described by the historian Josephus and by the Roman writer Pliny the Elder, who places the Essenes just west of the Dead Sea, north of Ein Gedi. De Vaux saw a fire layer from the Roman war, rooms he took for a scriptorium (a writing room), and held that the community hid its scrolls in the caves as the Romans came, about 68 CE. This is the majority view.

      **A Jerusalem library.** Norman Golb argued that a small sectarian settlement could not have owned so large and varied a library. In his view the scrolls were the libraries of Jerusalem, carried out to the desert and hidden before the Roman siege.

      **A Zadokite-Sadducean root.** Lawrence Schiffman holds that the sect grew out of priests of the Zadokite line (the old high-priestly family) who left after the Hasmoneans took the high priesthood, around 152 BCE, and whose rulings in the scroll *4QMMT* match positions that later rabbinic sources call Sadducean. He does not say the sect was "the Sadducees". Critics reply that this does not explain the group's more radical traits.

  - type: mcq
    id: who-q
    title: "What would each view need?"
    prompt: |
      Suppose a critic points out that the scrolls include copies of many books, some in several copies, along with writings of quite different outlook. Which view does this evidence trouble most, and how might its defenders reply?
    options:
      - text: "It troubles the claim that one small, strict community alone owned and wrote everything; defenders can reply that the community collected a wide library and copied books from outside, while keeping its own works for its own use."
        correct: true
        feedback: |
          Yes. Variety in the library is a point for Golb's argument, and the Essene view answers that a group can collect more than it writes. Neither side can settle it from the library alone; the ruins and the sectarian texts carry the rest of the case.
      - text: "It proves the scrolls came from Jerusalem."
        feedback: |
          It makes a Jerusalem origin more plausible for part of the library, but a collecting community can also explain it. "Proves" goes beyond the evidence.
      - text: "It shows the Essenes never existed."
        feedback: |
          Josephus and Pliny describe the Essenes independently of the scrolls. The question is whether the scrolls were theirs, not whether they lived.
    explanation: |
      Notice the structure: shared facts (the caves, the ruins, the library), different inferences. The scrolls themselves do not give their owners' name, so the answer rests on how the evidence is weighed.

  - type: text
    id: isaiah
    title: "The Great Isaiah Scroll against the medieval text"
    body: |
      One cave gave a complete scroll of the Book of Isaiah, the Great Isaiah Scroll (a name used for 1QIsaa): 17 sheets of parchment stitched together, about 7.3 metres long, with 54 columns, all 66 chapters in the same order as in later Bibles. It is dated to about 125 BCE by the shape of its letters (a radiocarbon range gives about 356 to 103 BCE). It is now in the Shrine of the Book in Jerusalem.

      The traditional Hebrew text is the **Masoretic Text**, kept by the Masoretes (Jewish scholars of the Middle Ages who fixed and vocalized it). Its oldest nearly complete witnesses are the Aleppo Codex (c. 920-930 CE) and the Leningrad Codex (1008 CE).

      Compared with the Masoretic text, the scroll has more than 2,600 variants. Most are small: a spelling (the scroll often uses longer spellings with extra letters for vowels, typical of its period), a single word, singular for plural, a changed word order. Some are larger.

  - type: numeric
    id: gap-q
    title: "How many years apart?"
    prompt: |
      The Great Isaiah Scroll is dated to 125 BCE and the Leningrad Codex to 1008 CE. There is no year 0 in this calendar: the year after 1 BCE is 1 CE. How many years separate the two dates?
    answer: 1132
    tolerance: 2
    answerText: '1132'
    wrong:
      - { value: 883, feedback: "That subtracts 125 from 1008, as if both dates were on the same side of the year 1. A date in BCE is counted backwards, so the two numbers add." }
    hint: "From 125 BCE to 1 CE is 124 years (there is no year 0); then add the 1008 years."
    explanation: |
      $124 + 1008 = 1132$ years (1133 if one counts as though there were a year 0). The point is the size: about eleven centuries of hand copying, and the two texts still agree in the main. Compared with the Aleppo Codex, the gap is about 1,050 years.

  - type: mcq
    id: variants-q
    title: "What do these variants show?"
    multiple: true
    prompt: |
      In Isaiah 16:8-9 the scroll lacks a stretch of text found in the Masoretic Text. In Isaiah 53:11 the scroll and the Septuagint agree on a clear reading where the Masoretic wording is hard to understand. In Isaiah 40:7 the scroll first had a shorter text, and a later hand added the longer one that matches the Masoretic. According to textual critics, which readings are fair? Select all that apply.
    options:
      - text: "The 16:8-9 gap may be a scribe's eye skipping between similar words, so it need not reflect a different edition of Isaiah."
        correct: true
        feedback: |
          Yes. This is the haplography slip from earlier in the course: the eye jumps and a stretch drops out. Other copies can reveal it.
      - text: "The 53:11 agreement suggests the Masoretic wording may have been altered or damaged in its path, since an older witness supports the Greek; modern translations have taken the scroll's reading."
        correct: true
        feedback: |
          Yes. An older text sometimes preserves the better reading. This is why textual critics value the scrolls, without assuming the older text is always right.
      - text: "The 40:7 change shows that a later reader compared the scroll with a copy near the Masoretic form and corrected it toward that form."
        correct: true
        feedback: |
          Yes. The scroll itself carries signs of correction in the direction of the text that later became standard, so the process of settling the text can be seen in a single manuscript.
      - text: "Any difference between the scroll and the medieval text means the medieval text is wrong."
        feedback: |
          Older does not mean right. Elsewhere the Masoretic reading is the original one and the scroll shows a slip. Each variant is judged on its own.
    explanation: |
      Three lessons from three verses: some differences are accidents, some favour the older text, and some show scribes making the text agree with another form. This is how the field works, and it is the subject of the next lesson.

  - type: text
    id: types
    title: "Text-types: the text in several forms"
    body: |
      Scholars sort the biblical scrolls by which later witness each most resembles. According to Emanuel Tov, whose handbook is the standard reference, the groups are:

      - **Masoretic-like** (close to the later traditional text);
      - **Septuagint-like** (close to the Hebrew that the Greek translators seem to have had in front of them);
      - **Samaritan-like** (close to the Torah of the Samaritan community, with its own additions in places);
      - **non-aligned** (resembling none of these);
      - and a group with a particular spelling and scribal habit that Tov ties to Qumran.

      The shares depend on the edition. In Tov's first edition (1992) the Masoretic-like texts were counted at about 60%; in his second (2001) at about 35%, with non-aligned texts rising. Other scholars question the categories themselves, since the labels are a modern grid on a mixed reality.

      The clearest example is the Book of Jeremiah. The Septuagint's Jeremiah is about one-eighth shorter than the Masoretic Jeremiah and arranged in a different order. Qumran has fragments of both forms, and at least one (4QJer-b) matches the short form.

  - type: mcq
    id: jeremiah-q
    title: "Two editions of Jeremiah"
    prompt: |
      A Hebrew fragment from Qumran, written before the Common Era, matches the short Greek form of Jeremiah. According to textual critics, what does it add to the old debate (did the Greek translator shorten the book, or did a shorter Hebrew edition exist)?
    options:
      - text: "It shows that a shorter Hebrew form existed, which weakens the idea that the Greek translator simply cut the text, though it does not show which form is older or more authoritative."
        correct: true
        feedback: |
          Yes. Existence is shown; priority is not. Some scholars hold that the short form is the earlier edition, others that the long form is, with the short one an abridgement in Hebrew.
      - text: "It proves the long Masoretic Jeremiah is a later forgery."
        feedback: |
          "Forgery" is the wrong frame. The long form may be a later expansion of an earlier text by editors, which was common in the period, and communities that kept it saw it as Scripture.
      - text: "It proves the Greek translators had no Hebrew text to use."
        feedback: |
          The opposite: the fragment shows they likely had a Hebrew form that matched their Greek.
    explanation: |
      The scrolls changed the question from "how did the Greek differ?" to "which Hebrew editions existed and which is earlier?", and the answer is still debated.

  - type: order
    id: method
    title: "Testing a medieval text with a scroll"
    prompt: "Put these steps of the comparison in a sensible order."
    steps:
      - "Line up a passage of the old scroll with the same passage of the medieval text."
      - "List every difference: spelling, words, order, omissions."
      - "Sort them: a likely slip, a likely edit, a difference of spelling habit."
      - "Check other witnesses, such as the Greek, to see which side they support."
      - "State what the pattern shows about the text, with the doubts left open."
    hint: "First compare, then sort, then bring in others, then conclude."
    explanation: |
      The method is simple, and its value is in the order: collect before judging, and bring in a third witness before deciding which side a variant favours. The next lesson, a guided problem on comparing manuscripts, runs this method on a toy set of variants.

  - type: mcq
    id: trap-changed
    title: "Trap: 'The scrolls changed the Bible'"
    prompt: |
      A friend says: "The Dead Sea Scrolls showed that the Bible was rewritten; our Bibles are different from the real ones." Which reply is most accurate?
    options:
      - text: "For most books the scrolls agree with the later text in the main, with small differences; they changed how scholars think of the history of the text (it existed in several forms), and in a few verses translations adopted a scroll reading."
        correct: true
        feedback: |
          Yes. The scrolls were a surprise about variety, not a discovery that a different Bible lay hidden underneath.
      - text: "They showed the Bible is exactly as it always was, with no differences."
        feedback: |
          The Great Isaiah Scroll alone has over 2,600 variants. Most are small, but "no differences" is false.
      - text: "They showed that every book exists in a long and a short form."
        feedback: |
          Only some books show clear parallel editions, Jeremiah being the best known. Many books show the same text with minor variation.
    explanation: |
      Both exaggerations are tempting: "everything changed" and "nothing changed". The data support a middle claim.

  - type: mcq
    id: trap-unchanged
    title: "Trap: 'They prove it is unchanged'"
    prompt: |
      Another friend says: "The Isaiah scroll matches our text, so the Bible has been preserved perfectly for 2,000 years." What is the fair assessment?
    options:
      - text: "The match in the main is a real, strong result for stability, but it shows only that this text was copied closely; it does not show that no changes occurred before 125 BCE, and a divine-preservation claim is a faith commitment that the manuscripts neither prove nor refute."
        correct: true
        feedback: |
          Yes. Evidence of careful copying across about 1,100 years is first-layer; "perfect" and "divinely guarded" belong to the third.
      - text: "It proves the text is perfect, since no variants were found."
        feedback: |
          Variants were found (over 2,600 in one scroll). A believer may hold that none of them touches the message, but that is a claim of faith about meaning, not a count of manuscript differences.
      - text: "It proves nothing at all about stability."
        feedback: |
          It shows something real: a copy from 125 BCE is close to one from 1008 CE for a long book. A fair reading respects this, while limiting it to what it covers.
    explanation: |
      A believer can accept the stability result as a sign of care; a sceptic can accept it as a sign of a conservative copying culture. Neither needs to deny the other's evidence.

  - type: text
    id: judaism
    title: "A window on Second Temple Judaism"
    body: |
      Besides the text, the scrolls show a Judaism not yet unified. According to Josephus there were in his time three schools of thought among the Jews: the Pharisees, the Sadducees and the Essenes. The scrolls add voices.

      **The Community Rule** (1QS) sets out how a group lives: entry by examination, shared property, a strict order of rank, a yearly review. **The Damascus Document** and the **Pesher Habakkuk** speak of a Teacher of Righteousness who is said to have received from God the meaning of the prophets, and of a Wicked Priest who opposed him. The identity of both is debated: proposals for the Wicked Priest include the Hasmonean high priests Jonathan and Simon, or Alexander Jannaeus, and some read the title as "illegitimate priest".

      On the future, the Community Rule (column 9) speaks of "the Messiahs of Aaron and Israel", usually read as two figures: a priestly one and a royal or political one. The word "messiah" meant "anointed", a person chosen for a role, such as a priest or a king, before it became a name for one end-time figure.

  - type: mcq
    id: messiah-q
    title: "What does 'two messiahs' show?"
    prompt: |
      A Qumran text expects "the Messiahs of Aaron and Israel", a priestly and a royal anointed one. According to scholars of the period, what does this show about Jewish expectations at the time?
    options:
      - text: "Expectations were varied: not every group looked for one king alone, and some expected leaders of a priesthood and of the nation side by side."
        correct: true
        feedback: |
          Yes. It is evidence for a range of ideas about the end-time, which later movements, Jewish and Christian, drew on in different ways.
      - text: "All Jews of the time expected two messiahs."
        feedback: |
          The scroll shows what one group (or its texts) expected. Other writings expect one royal figure, and many Jews expected none.
      - text: "It proves that the idea of a messiah was invented by the Qumran group."
        feedback: |
          The idea of an anointed king or priest is much older, in the Hebrew Bible itself. Qumran is one voice in a long conversation.
    explanation: |
      The scrolls do not decide what any faith should teach about a messiah. They show the diversity out of which later traditions arose, which historians use as background, and communities read through their own convictions.

  - type: text
    id: calendar
    title: "A calendar of 364 days"
    body: |
      Several texts, among them a section of 4QMMT, set out a year of 364 days. Since $364 = 52 \times 7$, it holds exactly 52 weeks, so a festival such as the Day of Atonement falls on the same weekday every year. According to many scholars it differs from the moon-based calendar of the Temple at the time, whose months follow the moon (twelve months of about 29.5 days make about 354 days, so extra days or months must be added).

      A true solar year (earth around the sun) is about 365.24 days. A year of 364 days therefore runs short, by

      $$365.24 - 364 = 1.24 \text{ days per year.}$$

  - type: numeric
    id: drift-q
    title: "How far off after a generation?"
    prompt: |
      A calendar of exactly 364 days is used with no corrections, while the true solar year is 365.24 days. After 30 years, by how many days has the calendar fallen behind the seasons? Give the number to one decimal.
    answer: 37.2
    tolerance: 0.3
    answerText: '37.2'
    wrong:
      - { value: 1.24, feedback: "That is the shortfall of one year. It adds up each year, so multiply by the number of years." }
    hint: "Multiply the yearly shortfall, 365.24 - 364, by 30."
    explanation: |
      $(365.24 - 364) \times 30 = 1.24 \times 30 = 37.2$ days, more than a month. A festival meant for spring would slide toward winter in a few generations, which shows either that the sect added extra days to keep in step, or that the 364-day scheme was a theological ideal and not always the working calendar.

  - type: mcq
    id: calendar-q
    title: "Ideal or practice?"
    prompt: |
      According to scholars such as Callaway and Glessmer, "solar calendar" is not quite the right name for the 364-day scheme, and Schiffman has argued it was perhaps never really tested. Which reading fits both remarks?
    options:
      - text: "The scheme was a neat pattern of weeks (a schematic ideal), and its authors may have used it as a statement of how time ought to be ordered rather than as a measuring tool."
        correct: true
        feedback: |
          Yes. The weekday pattern is its main feature, and a scheme can have a religious meaning without matching the sky.
      - text: "The scheme was an exact copy of the Temple's calendar."
        feedback: |
          The Temple followed a different, moon-based calendar. The disagreement is one of the reasons the sect separated from it, according to those who hold that view.
      - text: "The scheme proves the authors knew nothing of astronomy."
        feedback: |
          People in antiquity knew the year is longer than 364 days. A scheme can be chosen for its pattern while its users know it needs adjustment.
    explanation: |
      The calendar is a good example of a first-layer fact (the texts say 364) with a second-layer question (how was it used?) and a third-layer meaning (what time was thought to be for).

  - type: text
    id: faith
    title: "Faith, scholarship and the scrolls"
    body: |
      How do different readers use this evidence? **Many Jewish and Christian believers** welcome the scrolls as confirmation of careful copying: a book of Isaiah two thousand years old is close to the one they read. Many add that variation in detail does not touch what they hold to be the message, and that a tradition which kept the Scriptures through such variety was guided in its care.

      **Many scholars** stress what the scrolls show about process: several forms of a book, scribes correcting a text, a canon (the list of accepted books) not yet fixed everywhere. They do not therefore deny a faith reading; they say that "the original wording" is a harder idea than it first seems, because for some books there was more than one edition.

      **Some sceptics** conclude that the text was fluid and so human; **some traditionalists** reply that a human process can still be a vehicle of revelation. Each can accept the same manuscripts. What they differ on is a premise not found in any manuscript: whether, and how, God stands behind the text.

  - type: mcq
    id: layers-q
    title: "Sort the claim"
    prompt: |
      Which statement is a second-layer claim (scholarly consensus or live debate), not an established fact and not a commitment of faith?
    options:
      - text: "The people who left the scrolls in the caves were Essenes living at Qumran."
        correct: true
        feedback: |
          Yes. It is the majority view, but it is contested (Golb, Schiffman), so it is debate, not a settled fact.
      - text: "The Great Isaiah Scroll has more than 2,600 variants from the Masoretic Text."
        feedback: |
          This is a count of differences that anyone can check against the manuscripts, so it is first-layer.
      - text: "God guarded the wording of Scripture through every copy."
        feedback: |
          This is a faith commitment: no manuscript can confirm or refute a claim about God's action.
    explanation: |
      The same sort works for most claims about the scrolls: counts and dates are fact, ownership and grouping are debate, and what the text means for belief is commitment.

  - type: text
    id: summary
    body: |
      **Next:** The scrolls show a text that is stable in the main and varied in detail. The next lesson, "Guided problem: Comparing Manuscripts", turns that into a method: with a toy set of variant readings from several copies, you will work out how textual critics decide what a lost original most likely said, and what they cannot decide.
