id: ch14-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: Judaism and the Torah"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: ancient Israel and its neighbours, how the Hebrew Bible was copied and compared, the Torah's sources, what archaeology can and cannot show, Genesis and its readers, the rabbis, Jewish thought, and the Jewish answers to the Holocaust and to modernity. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone, and the feedback keeps the course's three layers apart: **established fact** (texts, finds, dates), **scholarly debate** (say which), and **faith commitment** (what a tradition holds). Notation as in the lessons: BCE and CE count years before and after year 1; $c.$ means about; the Masoretic Text is the medieval Hebrew text of the Bible, and the Septuagint is its ancient Greek translation.

  - type: mcq
    id: merneptah
    title: "A stone that names Israel proves the whole story?"
    prompt: |
      The Merneptah Stele, an Egyptian victory monument from about 1209 BCE (year 5 of the pharaoh Merneptah), lists defeated peoples and places in Canaan, including the word *Israel*. Its hieroglyphs mark Israel as a people, not a city. A student says: "So this stone proves the Exodus and shows Israel already worshipped one God." Which reply is best?
    options:
      - text: "The stone shows that Egyptian scribes knew a group called Israel in Canaan by about 1209 BCE, the earliest mention outside the Bible. It says nothing about an Exodus, about where the group came from, or about its worship."
        correct: true
        feedback: |
          Yes. A name on a stone is one fact, and a story needs more. Whether the group was worshipping one God, or many with one favoured, is argued from other texts, not from this stele.
      - text: "The stone proves nothing, since Egyptian kings often exaggerated, so Israel did not exist before the Bible says so."
        feedback: |
          This overcorrects. Propaganda can inflate victories, but the stele still shows that a people called Israel was a known name to Egyptian scribes, and that is a fact even if the victory was exaggerated.
      - text: "The stone proves the Exodus, since a people leaving Egypt would have been listed as defeated."
        feedback: |
          The stele places Israel in Canaan, and a victory over it says nothing about a departure from Egypt. Reading an Exodus into it adds a premise the stone does not state.
    explanation: |
      A single attestation fixes a date by which a name existed. It does not carry the origin story, the religion or the later history. Keeping 'attested' apart from 'explained' is the first discipline of the level.

  - type: mcq
    id: parallel-direction
    title: "A parallel means the Bible copied?"
    prompt: |
      The Egyptian Instruction of Amenemope (written c. 1300 to 1075 BCE) has sayings close to Proverbs 22:17 to 23:11. The Mesopotamian Atrahasis epic (oldest copy 1646 to 1626 BCE) tells a flood story with points close to Genesis. A student says: "Whenever the Bible resembles an older text, the Bible copied it." Which reply is best?
    options:
      - text: "Resemblance shows that writers shared a world of stories and sayings. Whether one text borrowed from another, in which direction, or whether both drew on older material is a separate question that needs dates and details; for Amenemope the direction is debated, and for the flood the differences, such as the reasons for the flood and the ending, matter as much as the likenesses."
        correct: true
        feedback: |
          Yes. A parallel is evidence of contact in a shared setting. Direction of borrowing and what the author did with the material need their own arguments, which scholars give differently.
      - text: "Resemblance proves nothing, because two cultures could never come to similar stories on their own."
        feedback: |
          Too strong in the other direction. Neighbouring peoples did exchange texts and sayings, and the close wording in some passages is real evidence of contact. The point is that contact does not fix direction.
      - text: "Resemblance proves that both texts came from the same divine source."
        feedback: |
          This is a faith reading (layer 3), not something a comparison of texts can show. A believer may hold it; a comparison of dates and wording cannot establish it.
    explanation: |
      Parallels show shared material. Who borrowed from whom, and what each author did with it, is argued case by case, and whether a text is inspired is a different kind of claim.

  - type: numeric
    id: oldest-original
    title: "The oldest copy must be the original?"
    prompt: |
      The Great Isaiah Scroll from Qumran dates to about 125 BCE, and the Leningrad Codex (the oldest complete manuscript of the Hebrew Bible, in the Masoretic tradition) dates to 1008 CE. A student says: "Older manuscript, so closer to the original, so always right." First, how many years separate the two? Count from 125 BCE to 1008 CE; there is no year 0. Give the answer in years.
    answer: 1132
    tolerance: 0.5
    answerText: '1132'
    wrong:
      - { value: 883, feedback: 'That subtracts $1008 - 125$, which treats both dates as CE. A BCE year counts backwards from year 1.' }
      - { value: 1133, feedback: 'That adds $125 + 1008$ and so counts the missing year 0. From 125 BCE to year 1 CE is 125 years, and then 1007 more years reach 1008 CE.' }
    hint: |
      From 125 BCE to the year 1 CE is 125 years; then add the years from 1 CE to 1008 CE.
    explanation: |
      $125 + 1007 = 1132$ years. The scroll is over a thousand years older, yet it agrees with the medieval text in the great majority of cases, with more than 2,600 differences that are mostly minor spelling. In a few places it differs in meaning: Isaiah 53:11 in the scroll reads with the Septuagint, and many modern translations adopted that reading. So an older witness is not automatically the original: an old copy can contain a slip, and a late copy can preserve an earlier reading. Each place is weighed on its own.

  - type: mcq
    id: weigh-not-count
    title: "The majority of copies wins?"
    prompt: |
      Suppose a verse has one reading in 40 later manuscripts and another in 4 earlier ones. A student says: "Forty copies against four: the majority reading must be the original." In textual criticism, the study of how to reconstruct a text from its copies, which reply is best?
    options:
      - text: "Copies are weighed, not counted. If the forty descend from one earlier copy, they are one witness repeated, so the number tells little. What matters is how independent the lines of copying are, how early, and which reading best explains the others. Some critics defend giving weight to the majority, but the case has to be argued, not assumed."
        correct: true
        feedback: |
          Yes. The old saying 'witnesses are weighed, not counted' (attributed to the nineteenth-century critics Westcott and Hort) points to independence. A defender of the Majority Text answers that the largest stream of copies carries a faithful tradition; that is an argument about the lines of descent, not about the count.
      - text: "The minority always wins, because the earlier copies are always right."
        feedback: |
          This swaps one shortcut for another. Early copies are valuable, but an early copy can carry an error. Date counts as one clue, not a verdict.
      - text: "Neither can be chosen, so the verse should be left out."
        feedback: |
          Critics usually choose a reading with reasons, and mark the uncertainty in notes. When the evidence is balanced, the honest answer is an open tie, not deleting the verse.
    explanation: |
      Forty copies made from one parent are as good as one. The questions are how independent the lines of descent are, how early they reach, and which reading explains how the others arose.

  - type: mcq
    id: harder-reading
    title: "The harder reading always wins?"
    prompt: |
      A common rule of thumb is *lectio difficilior potior*, 'the harder reading is stronger', because a copyist is more likely to smooth a difficulty than to create one. A student says: "So when two readings differ, always choose the harder one." Which reply is best?
    options:
      - text: "A hard reading must still make a possible sense. A garbled or meaningless form is hard because someone slipped, not because it is original. The rule is a rule of thumb, applied together with the date of the witnesses, how the other readings could have arisen, and the author's habits."
        correct: true
        feedback: |
          Yes. If the harder reading is simply nonsense, a slip explains it better than an original author. The rule favours a reading that is difficult but meaningful and from which the easier ones could have grown.
      - text: "The harder reading is chosen only when the copyists were careless."
        feedback: |
          The rule is about what a copyist tends to do, not about how careless one was. Copyists who were careful still tended to smooth a puzzling word for the reader.
      - text: "The easier reading always wins, since a clear text is the sign of a good author."
        feedback: |
          A clear text is a mark of a good copy, but copyists were more likely to make a difficult word easy than the reverse. That is why the harder reading often counts for more.
    explanation: |
      The rule is a guide to choosing between readings, not an automatic winner. When it clashes with other rules, such as 'prefer the shorter reading', the critic weighs them, and sometimes the answer stays a tie.

  - type: mcq
    id: documentary-settled
    title: "Wellhausen's four sources are the settled view?"
    prompt: |
      Julius Wellhausen (1844 to 1918) set out the classical documentary hypothesis in 1878 and 1883: the first five books combine four sources, J, E, D and P, written centuries after Moses, with P latest. A student says: "So scholars today all accept his four sources and his order." Which statement is closest to the lesson?
    options:
      - text: "Not so. Scholars now hold several models: the supplementary model (a core text expanded over time), the fragmentary model (many short pieces), and a neo-documentary model. Most still keep Deuteronomy (D) and the priestly material (P) as distinct, but they disagree about J and E, about dates, and about whether P came before or after the exile; Yehezkel Kaufmann placed P before the exile."
        correct: true
        feedback: |
          Yes. Wellhausen's idea of an order of development stayed influential, while the details were revised. Defenders of Mosaic authorship, such as Cassuto, reject the whole approach on literary grounds, and adherents hold the tradition on faith.
      - text: "Yes, the four-source theory is established fact, so the Torah has no Mosaic material."
        feedback: |
          Even critical scholars do not say this. The sources are inferred from clues in the text, which makes them a live debate (layer 2), and whether anything goes back to Moses is a further question that the clues cannot decide.
      - text: "No scholar now accepts any division of the sources, and every one returned to Mosaic authorship."
        feedback: |
          This overcorrects. Most critical scholars still read the first five books as composite, with D and P as the firmest layers. Defenders of unity are a minority position among them.
    explanation: |
      The hypothesis was a way to explain repeated stories, changes of divine name and differences of style. How many hands and how they combined stays under debate, and 'composite' does not settle what believers hold the Torah to be.

  - type: mcq
    id: silence-exodus
    title: "No Egyptian record, so no Exodus?"
    prompt: |
      The Torah counts 603,550 men (Numbers 1:46), which would suggest a people of two to two and a half million (Donald Redford's estimate). No Egyptian record mentions such a departure. A student says: "No record, so the Exodus is proven false." Which reply is best?
    options:
      - text: "Silence has to be weighed. The size in the text is a problem for many historians, and some, such as William Dever, call the search for the Exodus fruitless; others, such as Kenneth Kitchen, place the story's settings in the Egyptian Delta but grant that no outside record proves it, and Finkelstein and Silberman suggest a memory of earlier events. A believer holds the story on the strength of the tradition. 'Not attested' is a fact, 'false' is a verdict that needs more."
        correct: true
        feedback: |
          Yes. A missing record fits several readings: it did not happen, it happened on a small scale, it was never recorded, or it left no trace we can find. Each is argued, and the faith commitment is a separate layer.
      - text: "Silence proves the story, since the Egyptians would not record a defeat."
        feedback: |
          This is the mirror shortcut. A reason why records might be missing does not show that a thing happened; it only shows that silence is weak evidence in either direction.
      - text: "The numbers settle it, because 600,000 men is impossible in the desert."
        feedback: |
          The number is a serious objection to a literal reading, especially in the Sinai, but historians differ on how to read the counts (some take them as symbolic or inflated). The numbers raise the question, and the question stays open.
    explanation: |
      Absence of evidence is evidence only when the thing would probably have left a trace. Here historians disagree about how likely a trace is, which is why the debate remains.

  - type: mcq
    id: jericho-dig
    title: "A dig at Jericho settles the walls?"
    prompt: |
      At Jericho, John Garstang (excavating 1930 to 1936) dated a burnt destruction layer to about 1400 BCE and linked it to the story of the walls falling. Kathleen Kenyon (1952 to 1958) dated the layer to about 1550 BCE, and radiocarbon dates favour the 16th century; Bryant Wood has defended Garstang's date since 1990. A student says: "A dig can tell us whether the Bible's story of Jericho happened." Which reply is best?
    options:
      - text: "A dig can date a layer and show what happened to it. It cannot, by itself, show that a layer is the one the text describes. Here the dispute is about the date of the destruction (about 1400 or about 1550 BCE) and about what the layer shows. Whether the text records memory, later telling or something else is a further question."
        correct: true
        feedback: |
          Yes. Archaeology gives physical facts and dates; linking a layer to a story is an interpretation (layer 2). Conservative and critical scholars alike have to make that link with arguments.
      - text: "Kenyon proved that the story never happened."
        feedback: |
          Kenyon's dating, if right, puts the burnt city about a century and a half before the usual date for the conquest. That removes the match with the old date, but it does not determine what the text preserves.
      - text: "Garstang proved that the story happened exactly as told."
        feedback: |
          His date for the layer was later challenged by Kenyon and by radiocarbon, so a match to the text was disputed. Even a firm match to a layer would not show every detail of the story.
    explanation: |
      A dig yields layers, dates and objects. The step from a layer to a particular story adds an interpretation, and that step is where scholars part.

  - type: mcq
    id: tel-dan
    title: "'House of David' on a stone means a great empire?"
    prompt: |
      The Tel Dan Stele, found in 1993 and 1994 (the Biran team), is in Old Aramaic, from the 9th century BCE, and is thought to record victories of Hazael, king of Aram. Its letters *bytdwd* are read by most as 'House of David', although other readings were proposed. A student says: "So an enemy's stone proves David ruled a great empire." Which reply is best?
    options:
      - text: "The stone, if read as most do, shows that about a century or so after the time of David a neighbouring king spoke of a dynasty called the house of David. It does not give the size of David's realm: the 'low chronology' (Finkelstein) pictures a small chiefdom, others (the Mazars) a larger state, and Dever calls it an early, small state."
        correct: true
        feedback: |
          Yes. A name on a stone is a fact and the reading is largely accepted; the size of the kingdom is a separate question decided by other finds and by how they are dated.
      - text: "The stone proves nothing about David, because it can be read in many ways."
        feedback: |
          Most scholars read *bytdwd* as 'House of David', and few doubt that a dynasty with that name was known to the stone's author. Alternative readings exist, but they are a minority.
      - text: "The stone proves that the Bible's description of David is accurate in every detail."
        feedback: |
          It confirms one name, not the account. A neighbour's inscription says nothing on most of the Bible's story, and its size, wealth and wars stay under debate.
    explanation: |
      A name and a size are different things. Attestation of a dynasty is firm, and how large its realm was depends on dating the finds, which is the live debate.

  - type: mcq
    id: sennacherib-701
    title: "Two accounts of 701 BCE: one must be false?"
    prompt: |
      In 701 BCE the Assyrian king Sennacherib attacked Judah. His prism says, in essence, that he took 46 walled cities and shut Hezekiah up in Jerusalem like a caged bird. The Bible (2 Kings 18 and 19) tells of Hezekiah's trust in God and of an angel striking the Assyrian camp. A student says: "The two accounts contradict, so one is a lie." Which reply is best?
    options:
      - text: "Both can be true as far as they go: each is written by a side with its own aim. The prism boasts of cities taken and of Jerusalem besieged, and does not claim to have captured it; 2 Kings tells of the city surviving. Historians read the accounts together and differ on how to link the angel to a plague or a retreat; believers read the angel as the Bible does."
        correct: true
        feedback: |
          Yes. Two sources from two sides each leave something out. A historian asks what each would have wanted to say, and what each avoids saying.
      - text: "The prism is neutral, so it is correct and the Bible is wrong."
        feedback: |
          A king's prism is not neutral. It is a royal inscription made to praise him, and it is as selective as any other source.
      - text: "The Bible is God's word, so the prism must be forged."
        feedback: |
          The prism is a physical object, widely studied and well dated. A believer need not call it forged to hold that the Bible is inspired; the two kinds of claim are different layers.
    explanation: |
      Sources from rival sides are the best case for comparing, since each shows what the other leaves out. The overlap (Hezekiah in Jerusalem, a campaign, Jerusalem not taken) is the firm part, and the cause of the retreat is the open part.

  - type: mcq
    id: days-literal
    title: "A faithful reader must read six 24-hour days?"
    prompt: |
      James Ussher (1581 to 1656), archbishop and scholar, worked out from the biblical genealogies that creation began in 4004 BCE. Long before him Augustine (354 to 430) wrote that the days of Genesis 1 were not days like ours. A student says: "A faithful believer has to read Genesis 1 as six ordinary 24-hour days." Which reply is best?
    options:
      - text: "Believers have held several readings: ordinary days (Ussher's approach, taken up by young-earth creationists), long ages (the day-age view, e.g. Hugh Ross), a literary framework (the days as a pattern), and a functional reading in which the text is about giving the cosmos its roles in a temple (John Walton). Rabbi Abraham Isaac Kook saw evolution and Genesis as not in conflict. Which reading is right is a question of interpretation (layer 2) held with a commitment (layer 3)."
        correct: true
        feedback: |
          Yes. The reading chosen depends on what the text is taken to be, history, poetry or something else, and each reading claims to be faithful to it.
      - text: "Only a literal reading is faithful, and all other readings are attempts to evade the text."
        feedback: |
          Some believers hold exactly this, but it is one reading among faithful ones. Augustine, centuries before geology, read the days as not ordinary.
      - text: "All faithful readers now accept that Genesis 1 contradicts science."
        feedback: |
          No such consensus exists. Many believers read it as being on another topic from science, and others read it as a challenge to science; science itself gives the figures (13.787 billion years for the universe, Planck 2018) without ruling on faith.
    explanation: |
      'Faithful' covers a range of readings, each of which takes Genesis 1 to be a different kind of text. The science gives dates, and the choice of reading is a matter of interpretation and commitment.

  - type: mcq
    id: black-sea-flood
    title: "The Black Sea flood proves Noah's flood?"
    prompt: |
      In 1997 William Ryan and Walter Pitman proposed that about 5600 BCE (later revised to about 6800 BCE) the Mediterranean broke into the Black Sea basin and flooded its shores, which might have left a memory behind older flood stories. A student says: "So geology has proved that Noah's flood happened." Which reply is best?
    options:
      - text: "That is a hypothesis about a regional event, and it is disputed: critics, for example Aksu and colleagues, argue the rise was gradual or smaller. Even if it happened, linking it to the flood stories of Mesopotamia and Genesis is a further guess. Woolley's silt layer at Ur, once taken as the flood, was a river flood."
        correct: true
        feedback: |
          Yes. A flood hypothesis can explain how a memory might arise. Showing that this was the source, and that the Bible records it, would need more than dating a basin.
      - text: "It proves the Bible is wrong, since it was only a local flood."
        feedback: |
          The hypothesis does not prove a local flood either; it is disputed. And a believer may hold that the text speaks of a larger event, or of a theological message, without any reference to the geology.
      - text: "It proves that the Bible and Mesopotamia describe the same flood, because the dates match."
        feedback: |
          The dates do not match: the Mesopotamian tablets are written down in the second and first millennium BCE, thousands of years after the proposed event, and a match of this kind would have to be argued.
    explanation: |
      A proposed event is a hypothesis; a link to a story is another hypothesis; and a theological reading of the flood is a third kind of claim. Stacking the three as if they were one is the trap.

  - type: mcq
    id: oven-akhnai
    title: "The rabbis overruled God out of pride?"
    prompt: |
      In the Talmud story of the Oven of Akhnai (Bava Metzia 59b), Rabbi Eliezer calls on a carob tree, a stream and the walls of the study house to prove his ruling, and finally on a heavenly voice. Rabbi Joshua answers with Deuteronomy 30:12, 'It is not in heaven', and the majority rules against Eliezer. Later the prophet Elijah reports that God laughed and said, 'My children have triumphed over Me.' A student says: "So the rabbis overruled God, out of pride." Which reply is best?
    options:
      - text: "The story can be read in several ways. In the rabbinic reading, God gave the Torah to be interpreted by human reasoning and majority, so the voice from heaven does not decide it, and God's laughter shows approval. Richard Rubenstein reads it as a fair-minded rule of majority; critics such as the Karaites (who reject the Oral Torah) see human hubris. The story also shows a cost: Eliezer is ostracised."
        correct: true
        feedback: |
          Yes. The story is told by the rabbis themselves, so it is their own account of their authority. Whether that authority is legitimate is exactly what Karaites and Rabbinic Jews dispute.
      - text: "The story shows that Jews hold that God's voice has no value."
        feedback: |
          The tradition holds the opposite: God's Torah is the authority, and the story is about who interprets it. Eliezer's miracles are not denied; they are not accepted as proof of the law.
      - text: "The story proves that the Talmud rejects miracles."
        feedback: |
          The story itself includes miracles that happen. The question is whether a miracle decides a legal ruling, and the answer given is that it does not.
    explanation: |
      The scene asks who has the authority to decide what the Torah means. The rabbis answer that it is the community of sages by majority, and their rivals disagree. The story is evidence for the rabbis' self-understanding, not an outside verdict.

  - type: mcq
    id: negative-theology
    title: "Maimonides says the Bible's God is a lie?"
    prompt: |
      Maimonides (1138 to 1204) wrote in his Guide for the Perplexed that God has no body, so verses speaking of God's hand or anger must be read figuratively. He also held that we can say what God is not more safely than what God is. He quotes the rabbinic principle that the Torah speaks according to the language of man. A student says: "So Maimonides held the Bible deceives us, and that God is nothing." Which reply is best?
    options:
      - text: "He held that the Bible speaks in human terms so that people can grasp it; the bodily language is a way of teaching, not a deception. In his view the attributes we give God describe God's actions (mercy and anger are effects, not feelings), and negative statements guard against making God too much like us. Critics in his own time thought this went too far, and the Guide was banned in some places."
        correct: true
        feedback: |
          Yes. Maimonides defended a God far above human terms, which is the opposite of saying God is nothing. Whether his reading is the right one is a dispute in Jewish thought, and the opposition to the Guide was strong.
      - text: "He held that every verse about God's body is literally true."
        feedback: |
          He argued the opposite and made God's incorporeality one of his thirteen principles. Some Jews of his time held more literal views, which is part of why the Guide caused conflict.
      - text: "He held that God cannot be spoken about at all, so prayer has no meaning."
        feedback: |
          He kept prayer and law. Negative theology limits what we claim to know of God's nature; it does not remove worship or the commandments.
    explanation: |
      Negative theology is a discipline of speech about God, not a denial of God. The rabbinic phrase, 'the Torah speaks according to the language of man', is the key that lets Maimonides read bodily language as teaching for human minds.

  - type: mcq
    id: zohar-date
    title: "Dating the Zohar decides if Kabbalah is true?"
    prompt: |
      The Zohar, the central book of Kabbalah, is traditionally attributed to the rabbi Simeon bar Yochai. Gershom Scholem concluded, by 1938, that it was written by Moses de Leon (about 1240 to 1305) in Spain, about 1280 to 1286, partly because its Aramaic is artificial. A student says: "So the Zohar is a late book, and therefore Kabbalah is false." Which reply is best?
    options:
      - text: "Authorship and date are matters of scholarly debate (layer 2), and most historians follow Scholem on de Leon. Whether the teachings are true is a faith or philosophical question (layer 3) that a date cannot decide, since a late book can preserve older ideas and an old book can be wrong. Traditional Kabbalists hold the book is much older, and critics reply that this is a claim of faith."
        correct: true
        feedback: |
          Yes. The date tells us when and where the book was written; it does not say whether it describes something real. Both sides of the dispute need a further argument for the step to truth or to falsity.
      - text: "The Zohar is certainly by Simeon bar Yochai, since the tradition says so."
        feedback: |
          The tradition does say so, and believers hold it. As a historical claim it is not accepted by most scholars, who date the book with reasons, such as the Aramaic and Spanish phrasing.
      - text: "Scholem proved Kabbalah was invented in 1280."
        feedback: |
          He dated the Zohar, not every idea in Kabbalah. Earlier Kabbalistic texts and ideas existed, and Isaac Luria (1534 to 1572) developed it further in Safed.
    explanation: |
      Dating a text is historical work. Whether the ideas inside it are wise or true needs a different kind of argument. A late origin lowers one traditional claim (an ancient author) and leaves the other question open.

  - type: numeric
    id: spinoza-herem
    title: "Excommunicated for his book?"
    prompt: |
      Baruch Spinoza was put under the *herem* (a formal ban by the Amsterdam Jewish community) on 27 July 1656, and the ban was never lifted. His *Theological-Political Treatise*, which argued that Scripture should be read like nature and that Moses did not write the Torah as it stands, was published anonymously in 1670. A student says: "He was excommunicated for writing the Treatise." How many years separate the ban from the Treatise?
    answer: 14
    tolerance: 0.5
    answerText: '14'
    wrong:
      - { value: 38, feedback: 'That is $1670 - 1632$, the years from his birth to the Treatise. The question asks for the gap from the ban in 1656.' }
      - { value: 24, feedback: 'That is $1656 - 1632$, his age at the ban, not the gap between the ban and the book.' }
    hint: |
      Subtract the year of the ban from the year of the Treatise.
    explanation: |
      $1670 - 1656 = 14$ years. The ban came first, so it cannot have been a response to the Treatise. The community's reasons are given in terms of his views and conduct as reported at the time, and the Treatise itself was later banned (by the States of Holland in 1674). Reading Spinoza by the date of each event keeps cause and effect straight. Whether his thought is atheism (as van Velthuysen charged) or a form of pantheism (God as Nature) is debated.

  - type: mcq
    id: jonas-reply
    title: "Jonas concluded God does not exist?"
    prompt: |
      Hans Jonas (1903 to 1993), in his 1984 lecture on God after Auschwitz, argued that three things cannot all hold together: God's goodness, God's omnipotence (unlimited power) and God's intelligibility (that God can be understood). A student says: "So Jonas concluded that God does not exist, or that God is cruel." Which reply is best?
    options:
      - text: "According to Jonas, any two of the three exclude the third, and he keeps goodness and intelligibility while giving up omnipotence. In his self-made myth, God gave all power to the world and cannot intervene, so the responsibility falls on humans. The best objection (Henrix) is that a God without power may leave no room for a relationship or for hope that victims will be answered."
        correct: true
        feedback: |
          Yes. Jonas's reply is a form of the logical problem of evil in a Jewish voice. Rubenstein drops God's action in history, Berkovits keeps God's power and explains the silence by human freedom, and Jonas gives up omnipotence.
      - text: "Jonas kept omnipotence and gave up God's goodness."
        feedback: |
          He did the reverse. Goodness is the one claim he thought had to remain.
      - text: "Jonas held that Auschwitz did not happen in history, so no answer is needed."
        feedback: |
          He took the event as real and as the reason for the lecture. The question for him was what it implies about God's power.
    explanation: |
      Each Jewish reply to the Holocaust gives up or reinterprets a different premise. Which premise to give up is a faith commitment (layer 3); the logic of how the three claims conflict is open to all to examine.

  - type: mcq
    id: state-views
    title: "Jews all agree about the state of Israel?"
    prompt: |
      The state of Israel was proclaimed on 14 May 1948. A student says: "Since it is the Jewish state, religious Jews all see it the same way." Which statement is closest to the lesson?
    options:
      - text: "Jews hold different views. Religious Zionists, following Rabbi Abraham Isaac Kook (1865 to 1935), see the state as a stage of redemption. Haredi anti-Zionists, such as Joel Teitelbaum (1887 to 1979), the Satmar rebbe, held that forcing the end of exile by human action is forbidden, and he forbade voting in it. Many secular Jews see it as a national home. Each view is a reading of the same history through different commitments."
        correct: true
        feedback: |
          Yes. The facts (dates, votes, declarations) are shared; what the state means in the story of the Jewish people is where the groups part.
      - text: "All Orthodox Jews are religious Zionists."
        feedback: |
          Orthodoxy is not one position on this. Some Orthodox groups, including the Satmar, are opposed to the state on religious grounds.
      - text: "Only secular Jews have views on the state, and religious Jews ignore it."
        feedback: |
          Religious thought about the state is extensive and divided, from Kook's religious Zionism to Satmar's opposition.
    explanation: |
      The proclamation of 1948, the partition vote of 1947 and the earlier dates are established fact. What the state means is a matter of commitment, which is why even people in the same movement can part ways.

  - type: text
    id: summary
    title: "What this round tested"
    body: |
      Each trap was a shortcut one step too far. **Israel and its neighbours**: the Merneptah Stele (c. 1209 BCE) shows a people called Israel in Canaan, not an Exodus or a creed; a parallel with Amenemope or Atrahasis shows a shared world, and direction needs its own argument. **The text**: an older manuscript is not automatically the original (125 BCE to 1008 CE is $125 + 1007 = 1132$ years, and the scroll is still not always right), copies are weighed and not counted, and the harder reading must make sense. **The Torah's sources**: Wellhausen's order has been revised into supplementary, fragmentary and neo-documentary models, with D and P the firmest layers, and Mosaic authorship is held on faith. **Archaeology**: silence about the Exodus is weak evidence either way, a dig at Jericho dates a layer and cannot link it to a story, the Tel Dan stele names a dynasty and not an empire, and the Assyrian prism and 2 Kings are two sides of 701 BCE. **Genesis**: faithful readers have read the days as ordinary days, long ages, a framework or a functional text (Augustine, Ussher, Ross, Walton, Kook), and a Black Sea flood hypothesis is a disputed regional event, not a proof of Noah's flood. **The rabbis and Jewish thought**: the Oven of Akhnai is the rabbis' own account of who interprets the Torah, Maimonides reads the Torah as speaking 'according to the language of man' and so is not calling the Bible a lie, the date of the Zohar (c. 1280 to 1286) does not decide whether Kabbalah is true, and Spinoza's ban (1656) came $1670 - 1656 = 14$ years before the Treatise. **Modern Judaism**: Jonas gave up omnipotence, not goodness, and Jews are divided about the state of Israel. Under all of them, the three layers: a find, a date or a reading (layers 1 and 2) is not a verdict on what a tradition holds (layer 3), in either direction.

      Where thoughtful people part ways is in how much a missing record or a late date should weigh, in how far a text may be read figuratively, and in which premise about God to keep after the Holocaust.

