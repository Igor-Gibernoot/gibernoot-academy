id: ch14-genesis
title: "Genesis, the Flood and Cosmology"
kind: concept
own: |
  The setting: **Genesis** is the first book of the Torah. Its first chapters tell of creation and a flood. Everything below is taught according to someone. A **literal** reading takes the text as a report of events in the order told; a **concordist** reading matches it to the sequence found by science; a **non-literal** reading takes it as another kind of writing (a poem, a theology, a temple liturgy). *Years* below are counted in $\text{yr}$.
  - **Two accounts.** Genesis 1:1 to 2:3 gives six days of creation and a seventh of rest. Genesis 2:4 onward starts again with a garden and a man formed first. According to source critics, the first is the Priestly source and the second the Yahwist; according to Cassuto and Tigay, one author arranged both on purpose.
  - **Mesopotamian neighbours.** In the Babylonian *Enuma Elish*, Marduk kills the sea goddess Tiamat and builds the world from her body, and people are made to serve the gods. In *Atrahasis* the gods send a flood because human noise keeps Enlil awake. In Gilgamesh, tablet XI, the survivor Utnapishtim sends out a dove, a swallow and a raven. In Genesis the flood answers {{ violence and wickedness }} and one God acts alone. According to Holtz, most scholars see a Mesopotamian root, nearer to Atrahasis than to Gilgamesh.
  - **The flood.** Three readings are held: a memory of a real local flood (the Black Sea hypothesis is contested), a story reshaped from Mesopotamia, or a global event (Whitcomb and Morris, 1961). These are different layers: the texts are fact, their history is debated, their meaning is faith.
  - **Three readings of Genesis 1.** Literal (young earth): Ussher (1650) counted the genealogies and dated creation to 4004 BCE. Concordist (day-age, Hugh Ross): the days are long ages. Non-literal: the framework view (three days of forming, three of filling) or Walton's view that Genesis 1 describes {{ function, the setting up of a cosmic temple, not material origins }}.
  - **The numbers.** According to Planck (2018) the universe is $13.787\times10^{9}\,\text{yr}$ old; according to meteorite lead dating (Patterson, 1956) the Earth is {{ $4.54\times10^{9}\,\text{yr}$ }} old. With Ussher's span of about $6\,029\,\text{yr}$ to 2026, the ratio is
  {{ $$\frac{4.54\times10^{9}}{6\,029}\approx 7.5\times10^{5}$$ }}
  - **Evolution and Genesis.** According to Pius XII (1950) the origin of the human body may be studied, while souls are created by God. According to John Paul II (1996) evolution is more than a hypothesis. According to Rav Kook, evolution fits a Judaism that sees creation as a gradual unfolding; other Jewish writers reject it. None of these is a verdict of science; each states what a tradition protects.
  - **Three layers.** Established: the texts, the tablets, the measured ages. Live debate: sources, borrowing, how to read the days. Commitment: whether Genesis is revealed, and what it was written to teach.

cards:
  - type: mcq
    id: hook
    title: "Guess: two creations in one book"
    prompt: |
      Guessing is the point; no background is needed. An old book opens with a creation story: seven days, with people made last. A page later it tells another creation story: a garden, with a man made first and animals after him. An editor placed them side by side with no comment. Which first guess is the most reasonable?
    options:
      - text: "Maybe the two came from different traditions and were kept together, or maybe the author meant them to be read together; both ideas need testing."
        correct: true
        feedback: |
          Yes. The pair could mark two sources, or one design with two viewpoints. This lesson follows how scholars and believers weigh those and then widens to ancient neighbours and to modern science.
      - text: "One of the two must be a mistake and should simply be ignored."
        feedback: |
          That throws away evidence. Whoever joined them kept both, so the question is why, not which to delete.
      - text: "The order tells the real sequence: first the days, then the garden is a later event."
        feedback: |
          Possible for a reader who wants one chain of events, but the garden story begins before any plant has grown, so it does not simply follow the seventh day. The clash is a clue that needs more thought.
    explanation: |
      Keep three things apart: what the text shows (two tellings), what scholars infer (sources, or design), and what a community holds about the text (revealed, inspired, or human literature).

  - type: text
    id: gen1
    title: "Genesis 1:1 to 2:3: six days and a rest"
    body: |
      According to the Jewish Publication Society translation of 1917, the book opens: "In the beginning God created the heaven and the earth." Then comes a refrain. "And God said: 'Let there be light.' And there was light." Each day closes with evening and morning. On the seventh day God "rested", and the day is "blessed" and "hallowed" (Genesis 2:2-3).

      The days run like this. Day 1: light, separated from darkness. Day 2: a dome (the "firmament") dividing waters above from waters below. Day 3: dry land, then plants. Day 4: sun, moon and stars. Day 5: sea creatures and birds. Day 6: land animals, then humans, "male and female" (Genesis 1:27). Day 7: rest.

  - type: order
    id: days-order
    title: "Put the days in the text's order"
    prompt: |
      According to Genesis 1, put these acts in the order the text gives them.
    steps:
      - "Light is separated from darkness"
      - "A dome divides the waters above from the waters below"
      - "Dry land appears and plants grow"
      - "Sun, moon and stars are set in the sky"
      - "Sea creatures and birds fill water and air"
      - "Land animals, then humans, are made"
    hint: "The sun comes after the plants in this text."
    explanation: |
      Notice that plants (day 3) come before the sun (day 4) in the text. A literal reader takes that as written, with light already existing on day 1. A concordist has to say how plants could precede the sun, and a non-literal reader asks what the order is arranged to say.

  - type: mcq
    id: framework-q
    title: "A pattern in the days"
    prompt: |
      Some scholars (the "framework" view, held for example by Meredith Kline in 1958) point out that days 1 to 3 prepare settings (light and dark, sky and sea, land) and days 4 to 6 fill them with rulers or inhabitants. According to that view, which pairing fits?
    options:
      - text: "Day 4 (sun, moon, stars) fills the setting made on day 1 (light and dark); day 5 (sea creatures and birds) fills day 2 (waters and sky); day 6 (land animals and humans) fills day 3 (land)."
        correct: true
        feedback: |
          Yes. The days are arranged in two matching triples. Critics reply that day 3 also contains a filling (plants) and that the matching is looser than in Hebrew poetry; a defender answers that the point is the design, not exact symmetry.
      - text: "Days 1 to 3 describe the past and days 4 to 6 describe the future."
        feedback: |
          The framework view is about arrangement within one account, not about time. Both triples are narrated as past acts.
      - text: "Each day repeats the same act under a new name."
        feedback: |
          The days differ in what they make. The view sees one pattern across them, not one act repeated.
    explanation: |
      Layers: the text and its order are established; whether the pattern is deliberate is a live debate among conservative and critical scholars alike. If it is deliberate, it suggests the order teaches by design and need not be a timetable. A literal reader replies that the same text also says "evening and morning, the first day".

  - type: text
    id: gen2
    title: "Genesis 2:4 onward: the garden"
    body: |
      The second account begins "These are the generations of the heaven and of the earth when they were created" (JPS 1917, Genesis 2:4). Now it is the LORD God who "formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul" (2:7). No shrub had yet grown, there was no rain and no one to till the ground (2:5). Animals come after the man (2:19), and the woman last (2:22).

      Compare the order: in Genesis 1 plants come on day 3, animals on days 5 and 6, and humans, male and female together, at the end. In Genesis 2 the man comes first, then a garden with plants, then animals, then the woman. The divine name also changes from God (Elohim) to the LORD God (YHWH Elohim).

  - type: mcq
    id: both-q
    title: "Why keep both?"
    prompt: |
      Two readings explain why Genesis keeps both accounts. Which pair is stated correctly?
    options:
      - text: "According to source critics, Genesis 1:1-2:4a is the Priestly source and 2:4b onward the Yahwist, joined by an editor; according to Cassuto and Tigay, one author planned both, a wide view of the cosmos and then a close view of the human setting."
        correct: true
        feedback: |
          Yes. The source-critical reading rests on style, divine names and order differences. The one-author reading takes the same differences as complementary views. Both start from the same text. Which fits better is debated; the faith question (revealed or not) is separate from both.
      - text: "According to source critics, both come from Moses's own diary; according to Cassuto, they are two forgeries."
        feedback: |
          Neither claim is made. Source critics see older documents behind the text, and Cassuto defended unity.
      - text: "According to source critics, the clash proves Genesis has no teaching; according to Cassuto, it proves the days were thousands of years long."
        feedback: |
          The disagreement is about who composed the text and why, not about whether it teaches or about how long the days were.
    explanation: |
      This repeats a pattern from the lesson on the Torah and the documentary hypothesis: the same seams are read as two sources or as one design. Neither reading says what Genesis is for; the next sections ask that of the neighbours' texts.

  - type: text
    id: enuma
    title: "The neighbours: Enuma Elish"
    body: |
      In 1876 George Smith published *The Chaldean Account of Genesis*, noting that Babylonian clay tablets told of creation and a flood. The creation poem is *Enuma Elish* ("when on high", its first words), on seven tablets in Akkadian.

      According to the story, the young god Marduk is chosen champion by the other gods, kills the sea goddess Tiamat in battle, and forms the world from her body. Later the god Kingu, Tiamat's ally, is killed and people are made from his blood to serve the gods so they may rest. Scholars think the poem was recited at the Babylonian New Year festival (Akitu). Its date is debated: older views place it in the time of Hammurabi (18th century BCE), and most scholars now accept about 1100 BCE, with the earliest surviving copy from Assur in the 9th century BCE.

      Genesis 1 shares a sequence of dividing waters and a rest at the end, and its word *tehom* ("the deep", Genesis 1:2) sounds like Tiamat. Hermann Gunkel (*Schöpfung und Chaos*, 1895) proposed a direct link. David Tsumura (2005) argues against a borrowing from Tiamat and against a battle with chaos in Genesis 1.

  - type: mcq
    id: enuma-q
    title: "Same sea, different creation"
    prompt: |
      Compare Genesis 1 with *Enuma Elish* as scholars describe them. Which contrast is stated correctly?
    options:
      - text: "In Enuma Elish the world comes out of a battle and people are made to serve the gods; in Genesis 1 God creates by speaking, without a rival, and humans are made 'in His own image' (Genesis 1:27)."
        correct: true
        feedback: |
          Yes. Scholars note that creation by the word replaces creation out of conflict. Whether Genesis 1 is a quiet reply to Babylonian ideas, or an independent text sharing West Semitic images, is debated.
      - text: "Genesis 1 and Enuma Elish have the same plot, with God killing Tiamat on day 2."
        feedback: |
          Tiamat does not appear by name in Genesis, and Genesis 1 has no battle. The word tehom is the contested link.
      - text: "Enuma Elish teaches one God, and Genesis 1 teaches many gods."
        feedback: |
          Reversed. Enuma Elish has many gods in conflict; Genesis 1 has one God acting alone.
    explanation: |
      The parallels (waters, divisions, a rest, a closing temple or sanctuary theme) are established as texts. Whether Genesis borrowed from them, answers them or shares a common background is a scholarly debate. What Genesis teaches is another layer, held by faith or not.

  - type: text
    id: flood-texts
    title: "Two older floods"
    body: |
      In *Atrahasis* (Old Babylonian, copies from about the 17th century BCE) the gods made people to do the gods' labour. The people multiplied, and their noise kept the chief god Enlil from sleeping. He sent plague, famine and drought, and at last a flood. The god Enki warned the hero Atrahasis, who built a boat and survived. According to the summaries, the poem ends with the gods agreeing to keep people, with limits.

      The *Epic of Gilgamesh*, tablet XI, tells the story again in the first person. Utnapishtim, the survivor, relates to Gilgamesh how he built a ship, rode out the flood, and sent out a dove, then a swallow, then a raven; the raven did not come back. George Smith found tablet XI (British Museum K.3375, from the library of the Assyrian king Ashurbanipal at Nineveh) in 1872 and read his translation on 3 December 1872. Scholars think the standard version's flood episode was drawn from Atrahasis.
    image:
      src: img/flood-tablet.webp
      alt: "A clay tablet covered in cuneiform wedge writing, in a museum case."
      caption: "Tablet XI of the Epic of Gilgamesh (Neo-Assyrian, British Museum), the Flood Tablet whose story of a boat and a dove startled Victorian readers when George Smith translated it in 1872."
      credit: "BabelStone (Own work), CC0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:British_Museum_Flood_Tablet.jpg"

  - type: mcq
    id: flood-q
    title: "Compare the three floods"
    prompt: |
      In Genesis, a flood follows when "the earth was filled with violence" (JPS 1917, Genesis 6:11), then Noah sends out a raven and a dove (Genesis 8). In Atrahasis and in Gilgamesh XI there is also a flood. Which comparison is stated correctly?
    options:
      - text: "In Atrahasis the stated cause is human noise disturbing Enlil, in Genesis it is violence and wickedness; Gilgamesh XI is told in the first person by the survivor, and its survivor sends out a dove, a swallow and a raven."
        correct: true
        feedback: |
          Yes. The shared outline (warning, boat, birds, offering) is striking, and the differences in cause and in the number of gods are just as real. Scholars read these differences as the point of the Genesis version: a moral cause and one God.
      - text: "All three stories give exactly the same reason for the flood, and only the names change."
        feedback: |
          The reasons differ. In the Mesopotamian poems the gods are annoyed or in conflict; in Genesis the cause is moral.
      - text: "Gilgamesh XI is older than Atrahasis and is the source of it."
        feedback: |
          Atrahasis is older (Old Babylonian). Scholars hold that Gilgamesh XI draws on it, not the other way round.
    explanation: |
      According to Shalom Holtz, most scholars see Genesis as ultimately dependent on a Mesopotamian flood story, closer to Atrahasis (third person, set shortly after creation) than to Gilgamesh. Others stress that Genesis has one God and a moral reason, and read that as a theological reply, not a copy.

  - type: text
    id: flood-views
    title: "What was the flood?"
    body: |
      Three kinds of answer are given, and each comes with an objection.

      Local memory. According to William Ryan and Walter Pitman (1997), the Mediterranean broke into the freshwater Black Sea around 5600 BCE (revised to about 6800 BCE in 2003), and the shock could have fed flood legends. Critics, such as Aksu and colleagues, find evidence of a steady outflow instead of a flood. Leonard Woolley found a silt layer at Ur in the 1920s and linked it to the flood; he described it as river silt, a local event.

      Borrowed and retold. According to Holtz and many scholars, Israelite writers took an older Mesopotamian flood story and recast it: one God, a moral cause, a covenant. The objection is that a shared background does not show how or when the story came to Israel.

      Global event. According to John Whitcomb and Henry Morris (*The Genesis Flood*, 1961), Genesis describes a worldwide flood that shaped the rocks. Critics, including the National Center for Science Education, say the book misuses scientific sources. The book revived young-earth creationism in the modern era.

  - type: mcq
    id: flood-views-q
    title: "Fact, debate or faith?"
    prompt: |
      Place each statement in its layer. "The Black Sea flood of about 5600 BCE inspired the story of Noah." Which description is accurate?
    options:
      - text: "It is a hypothesis in live debate: some scientists argue a sudden flood, others a gradual outflow, and the link to Noah is a further inference."
        correct: true
        feedback: |
          Yes. Two uncertain steps are stacked: whether the Black Sea filled suddenly, and whether memory of it reached Genesis. Neither is established.
      - text: "It is an established fact, because the Black Sea did rise."
        feedback: |
          The sea level did change after the ice age; whether the rise was sudden, and whether a story came of it, is exactly what is disputed.
      - text: "It is a faith claim that no evidence can touch."
        feedback: |
          It is an empirical hypothesis: sediment cores and sea-level data can support or weaken it. The faith question, whether Genesis is revealed, is separate.
    explanation: |
      This is the course's three-layer habit: the tablets and the texts are established; the origin of the flood story is debated; whether Genesis is revealed is faith.

  - type: text
    id: readings
    title: "Three ways to read Genesis 1"
    body: |
      **Literal (young earth).** According to Archbishop James Ussher (1581-1656), who published the Latin *Annales* in 1650, adding up the genealogies of the Hebrew Bible gives creation in 4004 BCE (he placed it at nightfall before 23 October). Young-earth creationists today, such as Whitcomb and Morris, hold that the six days are ordinary days and the flood global; they hold that the plain sense of the text is the true sense.

      **Concordist (day-age, progressive).** According to Hugh Ross (founder of Reasons to Believe, 1986), the Hebrew *yom* ("day") can mean a long period, so the days match ages of cosmic history. He rejects evolution. A concordist reads Genesis and science as two true accounts that should agree.

      **Non-literal.** Augustine (354-430) already held that the days of Genesis are not like ordinary days. Others read the text as a framework, as a liturgy, or, with John Walton (*The Lost World of Genesis One*, 2009), as an account of *function*: Genesis 1 describes the setting up of the cosmos as a temple for God, ending in rest, rather than the origin of matter.
    image:
      src: img/ussher.webp
      alt: "Portrait painting of James Ussher in clerical dress."
      caption: "James Ussher (1581-1656), Archbishop of Armagh, whose 1650 chronology dated creation to 4004 BCE by adding up biblical genealogies."
      credit: "Attributed to Cornelis Janssens van Ceulen, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:James_Ussher_portrait.jpg"

  - type: mcq
    id: readings-q
    title: "Match the reading"
    prompt: |
      Someone says: "The Hebrew word for day can mean an age, so Genesis 1 and cosmology can both be true." Which reading is this, and what is its main objection?
    options:
      - text: "Concordist (day-age); a critic replies that the text's order (plants before the sun) does not match the order science finds."
        correct: true
        feedback: |
          Yes. The reading keeps the text as a report and lets the days be long. The objection from the order of events is the main one; a reply is that the days may be topical, not sequential, which moves toward the framework view.
      - text: "Literal (young earth); a critic replies that the days are too long."
        feedback: |
          A literal reading takes the days as ordinary days, so it makes them short, not long.
      - text: "Non-literal (Walton); a critic replies that Genesis never mentions a day."
        feedback: |
          Walton's reading does not rest on the word for day meaning an age. It rests on what the verb for 'create' concerns, and the objection is about whether ancient readers had that view of creation.
    explanation: |
      Each reading protects a different thing: the plain sense of the words (literal), the harmony of truth (concordist), or the text's own purpose (non-literal). The next section tests the claims against numbers.

  - type: mcq
    id: walton-q
    title: "What does Walton claim?"
    prompt: |
      According to John Walton in *The Lost World of Genesis One* (2009), what is the purpose of Genesis 1?
    options:
      - text: "To describe how the cosmos got its functions and was inaugurated as God's temple, ending in rest, rather than the material origin of the world."
        correct: true
        feedback: |
          Yes. For Walton the Hebrew verb for 'create' concerns giving roles, and the seven days are an inauguration. Reviewers are divided: some find the functional argument valuable, others are unconvinced by the temple reading.
      - text: "To give a timetable of the first week of the universe, which science must confirm."
        feedback: |
          That is the literal or concordist aim. Walton argues the text is not about the time over which matter came to exist.
      - text: "To show that Genesis copied the Enuma Elish word for word."
        feedback: |
          Walton reads Genesis against its ancient context but does not claim a word-for-word copy.
    explanation: |
      A non-literal reading is not necessarily a denial of faith. Walton is an evangelical Old Testament scholar who holds that the text is authoritative; his claim is about what it says, not whether it is true.

  - type: text
    id: cosmos
    title: "The numbers science gives"
    body: |
      According to the Planck satellite's 2018 results, the universe is $13.787\pm0.020$ billion years old. According to Clair Patterson (1956), who dated meteorite lead from the Canyon Diablo meteorite, the Earth is about 4.55 billion years old (the figure now quoted is $4.54\pm0.05$ billion). Against these stands Ussher's date: creation in 4004 BCE, which is about $4004 + 2026 - 1 = 6029$ years before 2026 CE (there is no year zero).

      A scale helps. Let $T = 13.787\times10^{9}$ years be the age of the universe and $t = 6029$ years Ussher's span.

  - type: numeric
    id: ratio
    title: "How much older?"
    prompt: |
      The Earth is $4.54\times10^{9}$ years old, according to meteorite dating. Ussher's span for all of creation is $6\,029$ years. How many times longer is the Earth's age than Ussher's span? Give the ratio to the nearest thousand.
    answer: 753000
    tolerance: 3000
    answerText: '753,000'
    wrong:
      - { value: 753, feedback: "That is the ratio in thousands. Dividing 4.54 billion by 6 thousand gives hundreds of thousands." }
      - { value: 7530000, feedback: "One order of magnitude too large. Check the powers of ten: 4.54 billion over about 6 thousand." }
    hint: "Divide 4.54 billion by about six thousand."
    explanation: |
      $4.54\times10^{9}/6029\approx 7.5\times10^{5}$, about 753,000. The gap is not a small adjustment. A literal reader answers that God could have made a world with apparent age or that dating methods fail; a concordist or a non-literal reader accepts the dates and reads the text differently. Those replies are faith or method claims, not part of the measurement.

  - type: numeric
    id: calendar
    title: "Ussher on the cosmic year"
    prompt: |
      Squeeze the universe's whole age, $13.787\times10^{9}$ years, into one year of $365.25$ days. How many seconds on that calendar does Ussher's span of $6\,029$ years take? Round to the nearest second.
    answer: 14
    tolerance: 0.6
    answerText: '14'
    hint: "Seconds in a year: 365.25 times 86400, about 31.56 million. Take the fraction 6029 over 13.787 billion of that."
    explanation: |
      The fraction is $6029/(13.787\times10^{9})\approx 4.4\times10^{-7}$, and times $3.156\times10^{7}$ seconds gives about 13.8, or 14 seconds. On this calendar the Earth forms in early September, and everything since Ussher's creation is a blink before midnight on 31 December.

  - type: text
    id: evolution
    title: "Evolution and the reading of Genesis"
    body: |
      Christian and Jewish scholars give several replies.

      According to Pope Pius XII in *Humani Generis* (1950), Catholics may study whether the human body comes from pre-existing living matter, while faith holds that souls are immediately created by God. According to Pope John Paul II (message to the Pontifical Academy of Sciences, 1996), new findings make evolution more than a hypothesis, with the note that there are several theories of evolution and that philosophies differ. According to Francis Collins (BioLogos, founded 2007), Christians can hold *evolutionary creation*: God creates through the evolutionary process.

      On the Jewish side, Rav Abraham Isaac Kook (1865-1935) saw no basic conflict between evolution and Judaism and held that the Genesis narrative has a deeper meaning than its surface. Other Jewish writers reject evolutionary theories and insist each part of creation was brought into being finished. According to Rabbi Jonathan Sacks (*The Great Partnership*, 2011), science takes things apart to see how they work, and religion puts things together to see what they mean.

  - type: mcq
    id: evolution-q
    title: "What does each hold open?"
    prompt: |
      According to Pius XII (1950), what may Catholic scholars investigate, and what does faith fix?
    options:
      - text: "They may investigate the origin of the human body from pre-existing living matter; faith holds that souls are immediately created by God."
        correct: true
        feedback: |
          Yes. The letter separates what inquiry may study (the body) from what faith holds (the soul). It also warns against treating the evolutionary origin of the body as already proven, and John Paul II later said findings now made evolution more than a hypothesis.
      - text: "They must reject evolution in every form, body and soul."
        feedback: |
          Humani Generis allowed investigation of the body's origin. The rejection is of the claim that souls come from matter.
      - text: "They may decide that nothing in Genesis has any meaning."
        feedback: |
          Neither letter says so; the documents are about what faith holds fixed.
    explanation: |
      These Christian and Jewish voices show that the dispute over evolution is not simply faith against science. It is a debate among believers about what a text is for. Rival replies exist inside each tradition.

  - type: mcq
    id: trap-textbook
    title: "Trap: Genesis as a science textbook"
    prompt: |
      A reader says: "If Genesis 1 is not a science textbook, then it teaches nothing about the world." What is wrong?
    options:
      - text: "It confuses a text with no scientific aim with a text with no teaching. A non-literal reader holds that Genesis 1 teaches that the world is ordered and good (Sacks) or that the cosmos is God's temple (Walton) without being a timetable."
        correct: true
        feedback: |
          Right. A different kind of teaching is still teaching. Literal readers disagree that the text is not about events, but even they do not say it is a textbook of physics.
      - text: "Nothing is wrong; if it is not science it is only decoration."
        feedback: |
          Poems, laws and liturgies teach without being science. The claim assumes only measurement counts.
      - text: "The text is a science textbook only for Jews and not for Christians."
        feedback: |
          No tradition describes it that way. Traditions differ on how literally to take it.
    explanation: |
      Layers: what Genesis 1 says is textual fact; whether it aims at history, theology or both is debated; whether it is revealed is faith.

  - type: mcq
    id: trap-babylon
    title: "Trap: all myths copy Babylon"
    prompt: |
      A reader says: "Genesis shares a flood, waters and a rest with Babylonian texts, so everything in Genesis is borrowed." What is the best reply?
    options:
      - text: "Shared outlines do not show that everything was borrowed: Genesis differs in its single God and its moral cause for the flood, scholars debate how texts travelled, and the borrowing of tehom from Tiamat is itself disputed (Gunkel against Tsumura)."
        correct: true
        feedback: |
          Yes. Dependence is strongest for the flood (Holtz), weaker elsewhere. Even where it is accepted, a retelling can say something new, and that is the faith question some believers and critics answer differently.
      - text: "The parallels are invented by modern scholars; the tablets say nothing like Genesis."
        feedback: |
          The tablets are real and widely published; the parallels are on the clay. The debate is about meaning and influence.
      - text: "If Genesis borrowed anything it cannot be inspired."
        feedback: |
          That is a faith position, not a result of the evidence. Many believers hold that God spoke through the cultural forms of the time; others deny any borrowing.
    explanation: |
      The tablets are established; the direction and manner of influence is debated; inspiration is faith.

  - type: mcq
    id: protects-q
    title: "What does each reading protect?"
    prompt: |
      Pick the pairing of a reading with what its defenders say it protects.
    options:
      - text: "Literal: the plain sense of the words and their authority; concordist: that truth is one and science and scripture agree; non-literal: the text's own purpose and its freedom from a clash with science."
        correct: true
        feedback: |
          Yes. A good test of fairness is that each defender would accept the description. Each also pays a cost: the literal reading must answer the measured ages, the concordist the order of events, the non-literal the charge that it moves away from the plain sense.
      - text: "Literal: that science is false; concordist: that scripture is false; non-literal: that both are false."
        feedback: |
          None of these readings claims that. Each aims to keep what it holds most valuable.
      - text: "All three protect exactly the same thing and differ only in vocabulary."
        feedback: |
          They differ in what they weigh most (authority of the words, unity of truth, the text's purpose) and so in what they give up.
    explanation: |
      Where thoughtful people part ways: which premise about the text (report, harmony or purpose), which value (plain sense, unity, purpose), and which evidence (the text, the tablets, the measured ages) counts most.

  - type: text
    id: summary
    body: |
      **Next:** Genesis is read in many ways because readers ask different questions of it. After the Torah comes the way a living community decides what a text means: the Talmud, Midrash and rabbinic Judaism, where argument is the method and the question is who decides.
