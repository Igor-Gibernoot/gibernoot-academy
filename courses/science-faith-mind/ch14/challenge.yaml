id: ch14-challenge
title: "Level Challenge: Reading the Torah Fairly (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: three invented texts, one toolkit"
    body: |
      The three problems below use invented texts and invented numbers, built to practise the method on a text you have never seen. Nothing in them is a claim about a real manuscript. The toolkit from the level is restated here, and every tool is taught according to the scholars who use it.

      - **Doublets and names.** A *doublet* is a story told twice in one text, with differences. According to the documentary hypothesis (Wellhausen, 1878 and 1883), doublets, changing divine names and changing style mark originally separate sources, joined later by an editor. According to the supplementary hypothesis (dominant by the early 1860s; Van Seters later), one core text was enlarged by later additions. According to traditional readers such as Umberto Cassuto (1883-1951), one planned work uses repetition and the divine names on purpose.
      - **Three kinds of evidence about a claim in a story.** *Attested*: a source outside the story names it. *Debated*: there is a find, but experts read it differently. *Silent*: nothing found. Silence counts for more when the story would have left a large trace, and for little when it would have left almost none.
      - **Weighing manuscripts.** A *witness* is any source that keeps a reading (a manuscript, a translation, a quotation). Witnesses are weighed, not counted: copies made from one parent are one voice. *Haplography* is an accidental skip between two similar phrases; *dittography* is an accidental repeat. The old canons are the *harder reading* (the one a copyist would be less likely to write), the *shorter reading*, and the *reading that best explains the others*. They are rules of thumb, not laws.
      - **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment.

      Problems 4 and 5 (the history of a real debate, then a closing weighing across the level) come in part 2.

  # ---------------- Problem 1 ----------------
  - type: text
    id: p1-setup
    title: "Problem 1 · The tale of Dara and the well"
    body: |
      **Problem 1.** A people keeps an old scroll, the Scroll of Aven (invented). Its twelve verses on the hero Dara read, in summary:

      > **1** Ael said to Dara: "Leave your father's tents and go to the hills." **2** Dara took three servants and went. **3** At a well in the hills he swore an oath with the king of the plain, and he named the well Karn, "the oath". **4** Ael blessed him there. **5** Ael promised the hills to his children. **6** Ael led him home in peace.
      >
      > **7** Yor said to Dara: "Leave your father's tents and go to the hills." **8** Dara took seven servants and went. **9** At a well in the hills the herders of the plain quarrelled with him over the water, and he named the well Karn, "the quarrel". **10** Yor made the herders yield, remembering the oath sworn at this well. **11** Yor blessed him there. **12** Yor promised the hills to his children.

      A last verse **13** says: "Dara died in the hills, and no one knows his grave to this day. Since then no prophet like Dara has risen." The scroll's own heading says it was written by Dara.

      Ael and Yor are two invented names for God. Count them: Ael occurs four times, all in verses 1 to 6; Yor occurs five times, all in verses 7 to 12.

      Your task: say what each of three readings (documentary, supplementary, traditional) predicts about this text, which clue discriminates, and where thoughtful readers part ways.

  - type: numeric
    id: p1-chance
    title: "Could the split of names be chance?"
    prompt: |
      In the invented scroll the divine name occurs nine times (Ael four times in verses 1 to 6, Yor five times in verses 7 to 12), and the two names never mix inside a block. Suppose a writer picked each of the nine names by a fair coin, independently, with no plan. The chance of exactly this clean pattern (first four Ael, last five Yor) is $1$ in how many?
    answer: 512
    tolerance: 0.5
    wrong:
      - { value: 9, feedback: "9 is the number of mentions, not the number of equally likely patterns. Each mention has two choices, so the patterns multiply: $2\\times2\\times\\cdots$ nine times." }
      - { value: 18, feedback: "That adds the two choices nine times. Independent choices multiply, they do not add." }
    hint: Each of the nine mentions is one of two names. How many different sequences of nine names are there, and how many of them are the pattern in question?
    explanation: |
      There are $2^9 = 512$ equally likely sequences and exactly one is the clean split, so the chance is $1$ in $512$, about $0.2\%$. A coin-flipping writer would almost never produce this. But no one proposes a coin. Every reading in the next cards says the split is planned or inherited. What the number shows is only that the pattern needs an explanation. It does not say which one.

  - type: mcq
    id: p1-predict
    title: "What does each reading predict?"
    prompt: |
      Two parallel stories (verses 1 to 6 and 7 to 12) each carry one name of God. Which pairing of reading and prediction is accurate?
    options:
      - text: 'Documentary: two once-separate tellings, each with its own name, joined by an editor. Supplementary: a core telling (verses 1 to 6) enlarged by a later retelling. Traditional (Cassuto-style): one author, who tells the story twice on purpose and picks each name for its meaning.'
        correct: true
        feedback: |
          Yes. All three agree that the pattern is not chance. They differ on who made it and when: two writers joined, one core plus additions, or one writer by design.
      - text: 'Documentary: one author who chose the names for meaning. Supplementary: two separate tellings joined by an editor. Traditional: a later retelling added to a core.'
        feedback: |
          The three readings are shuffled here. The documentary reading is the one with separate sources joined by an editor, and the traditional reading is the one with a single planned work.
      - text: 'All three readings predict the same thing, so the text cannot discriminate between them.'
        feedback: |
          They agree on the pattern but not on its cause, and they predict different things about other clues, for example whether one telling depends on the other. The next card uses such a clue.
    explanation: |
      A reading earns its keep by what it forbids or makes surprising. The three readings explain the split of names equally well, so the split alone cannot decide among them. We look for a clue they treat differently.

  - type: mcq
    id: p1-oath
    title: "Verse 10 and the oath"
    prompt: |
      Verse 10 says the herders yielded "remembering the oath sworn at this well", but the second telling never mentions an oath (it has a quarrel). The oath appears only in verse 3. Which reading does this clue favour most naturally, and what is the best reply from a rival?
    options:
      - text: 'It favours the supplementary reading: the second telling seems to know the first, as a later addition would. A documentary reader can reply that the editor who joined the two sources may have added the phrase to smooth the join.'
        correct: true
        feedback: |
          Yes. Two sources that began as separate tellings should not need each other. A text that leans on an earlier one fits better with an addition. But editors do smooth joins, so the clue pushes without deciding.
      - text: 'It favours the documentary reading most strongly, because separate sources always refer to each other.'
        feedback: |
          The opposite is the natural expectation. Independent sources would tell their own version without needing the other. The documentary reader can still explain the phrase as an editor's touch, but "always refer" is wrong.
      - text: 'It proves the traditional reading, because one author remembers what he wrote.'
        feedback: |
          A single author could do it, and the traditional reader will say so, but the clue fits an added retelling at least as well. A clue that all three can absorb proves none of them.
    explanation: |
      Here a clue is weighed by what it makes natural. Dependence of the second telling on the first is easy on the supplementary reading, possible on the other two. In the real debates, the same kind of argument runs on much larger texts, and it ends in a balance of plausibility, not a proof.

  - type: mcq
    id: p1-notice
    title: "Who wrote verse 13?"
    prompt: |
      Verse 13 reports Dara's death, says no one knows his grave "to this day", and says that "since then" no prophet like him has risen, yet the scroll's heading says Dara wrote it. According to readers of the real Torah's last chapter (Deuteronomy 34), three answers are given for a notice like this. Which answer pairs a reading with the claim it accepts?
    options:
      - text: 'A tradition-minded reader may hold that a later hand, a disciple or successor, added the verse (or that Dara wrote it as prophecy); a critical reader may hold that it shows the whole scroll was edited long after Dara. The same words serve all three.'
        correct: true
        feedback: |
          Yes. The phrases "to this day" and "since then" look back from a later time. What a reader makes of them depends on what the reader already holds about Dara and about the scroll.
      - text: 'The verse proves the scroll was written by Dara, because no one else would know his grave was lost.'
        feedback: |
          Knowing the grave is lost needs a time after the burial, and "since then no prophet like Dara" needs a long time after. Both look back from a later position than Dara's lifetime.
      - text: 'The verse proves the scroll was written long after Dara, because a dead man cannot write.'
        feedback: |
          A reader who holds that Dara wrote the scroll as prophecy rejects this, and a reader who holds that one last verse was added to an earlier scroll also rejects it. The verse is evidence for a late hand in the last verses, and the further step to the whole scroll is an extra premise.
    explanation: |
      Separate the fact (the verse looks back from a later time) from the inferences (a successor added it, or Dara foresaw it, or the whole scroll is late). The first is plain text; the others differ in the premises they bring. This matches how the real Torah's last verses have been read: one Talmudic opinion has Joshua writing them, another has Moses writing them in tears or as prophecy, and many modern scholars see a later hand.

  - type: mcq
    id: p1-test
    title: "What would count as evidence?"
    prompt: |
      A student says: "Nobody can ever test whether a text grew like this." A historian replies with the method of Jeffrey Tigay (born 1941), who in 1985 edited a volume that compared ancient works known in several versions. What is the method, and what does it offer?
    options:
      - text: 'Look at real ancient texts that survive in more than one version and see how they grew (by joining sources, by additions, by revision); then ask whether the proposed growth of the text in question looks like what those real cases show.'
        correct: true
        feedback: |
          Yes. The test is by analogy. It does not prove that the text grew in a given way, but it tells us whether such growth is something ancient scribes are known to have done, and it can show which of the models has real precedent.
      - text: 'Count how many words the text has, and see whether the number fits a single author.'
        feedback: |
          A word count does not decide how a text grew. Many one-author and many multi-author works have the same length. The method compares growth patterns in texts we can see in several versions.
      - text: 'Ask the faithful community whether the text feels like one voice.'
        feedback: |
          How a text feels to its community may matter for faith, but it is not a test of how the text grew. The method looks at documented cases of growth.
    explanation: |
      Tigay's volume framed the question as one that can be informed by evidence: take the ancient works that survive in several versions (the Gilgamesh epic, Qumran texts, the Samaritan Pentateuch) and see which growth patterns they show. The result is a plausibility weighting, not a proof, and critics and supporters of the documentary hypothesis read the same cases differently.

  - type: mcq
    id: p1-parting
    title: "Where do thoughtful readers part ways?"
    prompt: |
      Two careful readers study the Scroll of Aven. One says "two sources joined, and the scroll is the work of generations". The other says "one inspired author wrote it all, and verse 13 is a later note". Sort what separates them. Which analysis is fair?
    options:
      - text: 'They agree on the facts (two tellings, two names, an oath referred to once, a notice looking back from later). They differ in the debate layer (how to weigh the oath clue and the analogies) and, above all, in the third layer: what they hold about the scroll''s origin and authority.'
        correct: true
        feedback: |
          Yes. The first layer is shared. The second layer (plausibility of growth models) can be argued with evidence. The third layer (whether the scroll is inspired, and what that implies for its authorship) is held on grounds other than the manuscript.
      - text: 'One of them is ignoring the facts.'
        feedback: |
          Both can state every fact in the first layer. The disagreement is in how to weigh evidence and in what each already holds.
      - text: 'The disagreement is entirely about the facts, and one more discovery would settle it.'
        feedback: |
          A new find could shift the second layer. It could not settle the third, because a believer in inspiration and a critical historian can both accept the same find.
    explanation: |
      The fair summary: the text itself (layer one) is shared; the best model of its growth (layer two) is weighed by plausibility and analogy; whether it is divinely given (layer three) is a commitment that evidence about authorship can inform but not decide.

  # ---------------- Problem 2 ----------------
  - type: text
    id: p2-setup
    title: "Problem 2 · The march of the Tarn"
    body: |
      **Problem 2.** The Book of Tarn (invented) tells how the Tarn people crossed the Dry Plain on a long march. It gives a census of the men of fighting age, clan by clan, with the total:

      | Clan | Men counted |
      |---|---|
      | Brin | 7,400 |
      | Corr | 5,600 |
      | Dael | 6,900 |
      | Esk | 4,200 |
      | Falk | 8,100 |
      | Gorn | 5,300 |
      | Hale | 6,000 |
      | Irn | 4,500 |

      The book states the total as 48,000 men. Take each man to stand for a household of four people (himself, a wife and two children).

      The book also says that on the Plain the people drank from three named wells, which in this toy together give at most 120,000 litres of water a day, and that a person needs about 4 litres a day. Elsewhere, archaeologists report: (a) a stele of a neighbouring empire names King Habbar of the plain, who appears in the book; (b) the fort of Orn, which the book says the Tarn burned, is dated by two excavation teams to centuries apart; (c) a survey of the three wells found hearths for about three hundred people, and nothing larger.

      Your task: test the number, sort the claims, and say where thoughtful readers part ways.

  - type: numeric
    id: p2-sum
    title: "Does the list add up?"
    prompt: |
      Add the eight clan counts in the table (7,400; 5,600; 6,900; 4,200; 8,100; 5,300; 6,000; 4,500). What is the total of men?
    answer: 48000
    wrong:
      - { value: 47000, feedback: "Recheck the sum; one clan was dropped or miscounted." }
    hint: Add them in pairs, for example 7,400 + 4,500 and 5,600 + 6,000.
    explanation: |
      The sum is $48{,}000$, equal to the stated total. The list is internally consistent. Notice what this does not show: a list can add up perfectly and still be a number that never was. Internal consistency is a test of the writer's care, not of the world.

  - type: numeric
    id: p2-water
    title: "How many times too much water?"
    prompt: |
      The book's people number $48{,}000$ men, so $4\times48{,}000$ people. Each needs about 4 litres of water a day, and the three wells together give at most 120,000 litres a day. The daily need is how many times the daily supply?
    answer: 6.4
    tolerance: 0.05
    wrong:
      - { value: 0.16, feedback: "That is supply divided by need upside down. You want need divided by supply." }
      - { value: 1.6, feedback: "That counts 48,000 people. The census counts men, and each man stands for four people." }
    hint: People = 4 x 48,000. Need per day = people x 4 litres. Then divide by 120,000.
    explanation: |
      People: $4\times48{,}000=192{,}000$. Need per day: $192{,}000\times4=768{,}000$ litres. Ratio to the supply:
      $$\frac{768{,}000}{120{,}000}=6.4.$$
      So the wells cover about one part in six of the need, before counting animals. According to critics of the literal reading, this is a reason to look for another reading of the number. Note the layers: the arithmetic is fact given the toy's figures; what follows from it is not yet fixed.

  - type: mcq
    id: p2-sort
    title: "Attested, debated or silent?"
    prompt: |
      Sort the three archaeological reports. (a) A neighbouring empire's stele names King Habbar of the plain. (b) Two teams date the burning of the fort of Orn to centuries apart. (c) A survey of the three wells finds hearths for about three hundred people and nothing larger. Which sorting is right?
    options:
      - text: '(a) attested (an outside source names him); (b) debated (there is a find but the experts read it differently); (c) silent about the 192,000 (no trace of a camp that size) though not silent about a small group.'
        correct: true
        feedback: |
          Yes. Note that (a) attests a king, not the march; being attested for one detail does not carry over to the others.
      - text: '(a) silent, (b) attested, (c) debated.'
        feedback: |
          Check each against its definition: attested means an outside source names it, debated means a find read two ways, silent means nothing found.
      - text: '(a), (b) and (c) are all attested, since each has a find of some kind.'
        feedback: |
          A find is not the same as attestation of the claim. A burned fort of uncertain date does not attest the burning by the Tarn, and hearths for three hundred do not attest a camp of nearly two hundred thousand.
    explanation: |
      The same framework from the level is used here. The sorting is claim by claim: the king is attested, the fort is debated, and the large camp is silent. This is the pattern for real stories as well: a mix of the three, never one verdict for the whole.

  - type: mcq
    id: p2-silence
    title: "How loud is the silence?"
    prompt: |
      A defender says: "A people on the move leaves nothing, so the silence at the wells tells us nothing." A critic says: "The silence is a real problem." Using the question "how much trace should the story have left?", which comment is fair?
    options:
      - text: 'The defender is right about a small band, which leaves almost nothing. But a camp of about 192,000 people at the same wells for months would leave a great deal (rubbish, hearths, bones), so the silence counts for more as the number grows.'
        correct: true
        feedback: |
          Yes. The weight of silence depends on the size of the expected trace. For three hundred people it is light; for nearly two hundred thousand it is heavy.
      - text: 'The silence never counts, because the absence of evidence is never the evidence of absence.'
        feedback: |
          That slogan fails when the trace should have been large. If a thing, were it there, would almost surely have left a mark, the missing mark is evidence against it.
      - text: 'The silence always settles the matter against the story.'
        feedback: |
          It settles nothing alone. It depends on how much trace the story should have left, and a defender can still reply that the story's number is wrong while a smaller core is right.
    explanation: |
      Silence is evidence in proportion to how loud the story would have been. This is the same logic as in Bayes' rule: how likely is the missing trace if the story is true, compared with if it is false? For a large camp that likelihood is low, so the silence matters.

  - type: numeric
    id: p2-rival
    title: "Reading the number another way"
    prompt: |
      Suppose the book's word *ulf*, which the main reading takes as "a thousand", means instead a clan unit of about 12 men. The census lists 45 *ulf* in all, plus 3,000 further men. On this reading, how many men are there?
    answer: 3540
    wrong:
      - { value: 48000, feedback: "That is the main reading, where each ulf is a thousand. Here an ulf is a unit of about 12 men." }
      - { value: 540, feedback: "You dropped the 3,000 further men. Add them to 45 x 12." }
    hint: 45 units of 12 men, then add the 3,000.
    explanation: |
      $45\times12=540$, and $540+3{,}000=3{,}540$ men. With four people per man, that is $14{,}160$ people, who need $56{,}640$ litres a day, about $0.47$ of the supply. The three wells would manage. This mirrors a real debate: some scholars have proposed that the Hebrew *eleph* in the census of Numbers can mean a clan or a military unit, not only "thousand", which would shrink the numbers a great deal. The standard objection is that *eleph* sits beside hundreds in the same lists and so seems to mean "thousand". Here the same objection is stated in the toy: the "further 3,000" is written in hundreds beside the *ulf*, so the counts read as thousands. The reading removes the water problem and meets a language problem.

  - type: mcq
    id: p2-parting
    title: "Where do thoughtful readers part ways?"
    prompt: |
      Three readers face the Book of Tarn. A says the numbers are exact and God supplied the water. B says the numbers are a literary exaggeration around a smaller group. C says *ulf* means a unit and the real count was a few thousand. Which analysis is fair?
    options:
      - text: 'They share the first layer (the sum, the 6.4 shortfall, the silence at the wells). They differ in the second (is the number literary, a mistranslation, or an exact report?) and in the third: A holds that God provides what natural supply cannot, which no survey of wells can test.'
        correct: true
        feedback: |
          Yes. A's claim is a commitment, not an archaeological claim. It is not refuted by the shortfall and not supported by it either; it sits outside what the wells can show. B and C make claims about the text that evidence can weigh.
      - text: 'A is refuted by the water arithmetic.'
        feedback: |
          The arithmetic shows the natural supply is short by a factor of 6.4. A already agrees, and says the supply was not natural. Whether that happened is the third layer.
      - text: 'B and C must be right because the number is impossible.'
        feedback: |
          The number is impossible without help, but that leaves A's claim of help and the choice between B and C open. And B and C face their own problems (the language, the other parts of the story).
    explanation: |
      The shortfall is fact given the toy figures. Whether the number is literary or mistranslated is a live debate in the real case. Whether supply was miraculous is a commitment. The skill is to name which layer each reader's sentence is in.

  # ---------------- Problem 3 ----------------
  - type: text
    id: p3-setup
    title: "Problem 3 · The song of the ferryman"
    body: |
      **Problem 3.** A song about a ferryman survives in three witnesses (invented). S is a scroll, the oldest. K is a medieval codex. T is a translation made from a Hebrew copy that came from the same lost parent as K, so K and T are one line of descent; S is a second, independent line. At three places they differ:

      | Place | S | K | T |
      |---|---|---|---|
      | A | "...grain to the miller of the gate **and the salt to the smith of the gate**" | "...grain to the miller of the gate" | "...grain to the miller of the gate and the salt to the smith of the gate" |
      | B | "he crossed the water" | "he crossed the water" | "he crossed the the water" |
      | C | "the ferryman, a stranger" | "the ferryman, a holy man" | "the ferryman, a holy man" |

      Your task: explain each variant by the slips and the canons, then say what the rules can and cannot decide.

  - type: mcq
    id: p3-hap
    title: "Place A: shorter or longer?"
    prompt: |
      At place A, K lacks the words "and the salt to the smith of the gate", which S and T have. The canon of the shorter reading says: prefer the shorter reading. What should a critic conclude at this place?
    options:
      - text: 'Prefer the longer reading. K''s omission is explained by haplography (the eye jumped from the first "of the gate" to the second), and two witnesses agree on the longer text. This is the standard exception to the shorter-reading canon.'
        correct: true
        feedback: |
          Yes. The canon assumes copyists add more than they drop. Here the two phrases end the same way, so an accidental skip is a known cause. The shorter reading, in this case, is the product of a slip.
      - text: 'Prefer the shorter reading, K, because the canon says so.'
        feedback: |
          A canon is a rule of thumb. When an accidental skip explains the short form, the rule does not apply. Applying it blindly would prefer the damaged text.
      - text: 'Count the witnesses: S, T and K make three, so nothing can be decided.'
        feedback: |
          Three witnesses are two lines, and only K is short. The disagreement is explained by a known slip, so the longer reading is better supported.
    explanation: |
      The omitted phrase is "and the salt to the smith of the gate", nine words. The two phrases that end "of the gate" are the places the eye could jump between. This is the exception to the shorter canon that critics such as Metzger note, and it shows why the rules are rules of thumb: they depend on what usually happens.

  - type: mcq
    id: p3-dit
    title: "Place B: the doubled word"
    prompt: |
      At place B, T reads "he crossed the the water", with the article repeated. S and K read "he crossed the water". What is the best explanation, and what is the caveat?
    options:
      - text: 'Dittography, an accidental repeat in T''s line; the single "the" is original. The caveat is that a repeat is sometimes deliberate (for emphasis or by a later addition), so each case needs a check; a repeated article makes no sense, which points to an accident.'
        correct: true
        feedback: |
          Yes. A repeated "the" gives no sense, so deliberate emphasis is unlikely. The two other witnesses agree on the single word.
      - text: 'Haplography in S and K, which dropped a second "the".'
        feedback: |
          Haplography drops text between similar phrases. Two independent lines both dropping the same word by accident is unlikely; one line adding a repeat is the simpler story.
      - text: 'The doubled word is the harder reading, so T is original.'
        feedback: |
          The harder-reading canon asks for a reading that makes sense but is hard, one a scribe would be tempted to smooth. A repeated article makes no sense at all, and the canon does not apply to nonsense.
    explanation: |
      Dittography is the mirror of haplography. The decision here is easy because the repeat is meaningless. If the repeated phrase had made sense, a critic would ask whether the repeat was a slip or a choice, and the case would be harder.

  - type: numeric
    id: p3-lines
    title: "Place C: how many independent voices?"
    prompt: |
      At place C, S reads "a stranger", and K and T read "a holy man". K and T come from the same lost parent; S is independent of it. Counting each independent line of descent once, how many independent lines support "a holy man"?
    answer: 1
    wrong:
      - { value: 2, feedback: "That counts witnesses, K and T. They share a parent, so the parent's reading is echoed twice, not two separate voices." }
    hint: Two copies of one parent are one voice.
    explanation: |
      K and T descend from one lost parent, so their agreement shows only what the parent said: one line. S is the second line and reads "a stranger". So it is one line against one, and the old rule "weigh, do not count" has removed the apparent two-to-one.

  - type: mcq
    id: p3-conflict
    title: "Place C: the rules disagree"
    prompt: |
      Place C: S "the ferryman, a stranger" against K and T "the ferryman, a holy man". The song honours the ferryman. Apply the canons. Which conclusion is fair?
    options:
      - text: 'The harder reading is "a stranger" (a copyist who honours the ferryman is more likely to change "stranger" to "holy man" than the reverse), and it is the older witness''s reading. But with one independent line on each side, a critic can reasonably mark the choice as uncertain and print the other reading in the notes.'
        correct: true
        feedback: |
          Yes. The harder-reading canon and the oldest witness both point to S. The count of lines is one against one. The honest report is a leaning with a note, not a certainty.
      - text: '"A holy man" wins, because two witnesses beat one.'
        feedback: |
          K and T are one line, so there is no two-to-one. And "holy man" is the likelier smoothing for a song that honours the ferryman.
      - text: 'Nothing can be said, because the witnesses disagree.'
        feedback: |
          Something can be said: one reading is harder, one witness is older, and one explains the other better. The decision is a leaning, not a blank.
    explanation: |
      "Best explains the others" gives the same direction: it is easy to see why "stranger" would be smoothed into "holy man" and hard to see the reverse. Still, a canon of this kind is a probability judgement: critics who put more weight on a witness's habits of copying may prefer the other reading. This is where real critics part ways on real verses.

  - type: order
    id: p3-method
    title: "Order the method"
    prompt: Put the steps a critic follows at one variant in order.
    steps:
      - 'Collect the witnesses and group them by line of descent.'
      - 'Ask whether an accidental slip (a skip or a repeat) explains the difference.'
      - 'Ask which reading a copyist would be more likely to change into the other (harder, shorter).'
      - 'Weigh the independent lines, not the number of copies.'
      - 'Report the choice with its confidence, and note the other reading if it stays open.'
    hint: Start with the data and end with the honest report.
    explanation: |
      The order matters: group the witnesses first, so you do not count echoes; test for accidents before motives, since accidents leave a clear signature; weigh the canons; then state the result with its uncertainty.

  - type: mcq
    id: p3-caveat
    title: "How strong are the rules?"
    prompt: |
      A student concludes: "The rules gave a definite answer at every place, so the original song is recovered." Which reply is fair?
    options:
      - text: 'The rules are rules of thumb. At A and B they gave a firm result; at C they gave only a leaning. And even the best reconstruction reaches the text the witnesses descend from, which may not be the first text. Scholars distinguish several senses of "original text".'
        correct: true
        feedback: |
          Yes. The method recovers an earlier stage of the text, with different confidence at each place. Whether that stage is the author's own words is a further question.
      - text: 'The student is right: with three witnesses a critic can always recover the first text.'
        feedback: |
          Recovering the shared ancestor of the witnesses is the most that comparison can do. It cannot see behind the earliest surviving line.
      - text: 'The rules are useless, because they sometimes disagree.'
        feedback: |
          A tool that is sometimes inconclusive can still be very useful. At A and B the rules gave good answers, and at C they told the critic where the doubt lies.
    explanation: |
      Two limits to keep: the canons are fallible, and the target is an earlier stage, not automatically the first. Real cases like Isaiah 53:11 (scroll and Septuagint against the later Masoretic text) and Jeremiah (the shorter Greek form, supported by a Qumran fragment) show the same mix of firm results and open questions.

  - type: mcq
    id: p3-parting
    title: "Where do thoughtful readers part ways?"
    prompt: |
      After the exercise, two readers speak. One says: "Place C proves the song was changed to flatter the ferryman, so the tradition cannot be trusted." The other says: "Place C proves the text was preserved perfectly, since we can see exactly what changed." Which assessment is fair?
    options:
      - text: 'Both overreach. The facts are the three readings and the likely direction of change at C (layer one and two). That a copyist smoothed one word does not decide how reliable the whole tradition is, and seeing a variant does not show perfect preservation; the further claim about inspiration or authority is a commitment (layer three).'
        correct: true
        feedback: |
          Yes. One variant, honestly analysed, shows both that the text was copied by humans and that the changes can often be traced. What follows for a community's trust in its text depends on commitments the manuscripts do not decide.
      - text: 'The first reader is right, since any change destroys trust.'
        feedback: |
          Trust in a text does not require that no copy ever changed. It depends on how much changed, how well it can be detected, and what one believes about the text.
      - text: 'The second reader is right, since variants prove nothing was lost.'
        feedback: |
          Variants show that some things changed. Where all witnesses share a change, comparison cannot see it, so it cannot prove nothing was lost.
    explanation: |
      The method makes the history of a text visible, and that is a gain for every reader. Whether a given tradition should treat its text as authoritative is a question for the third layer.

  - type: text
    id: closing
    title: "What these three problems used"
    body: |
      Problem 1 asked for the prediction of three readings and a clue that discriminates (the oath), and showed that a shared pattern (the names) can fit all of them. Problem 2 tested a number against what a desert can supply ($4\times48{,}000\times4/120{,}000=6.4$), sorted claims as attested, debated or silent, and showed that silence weighs more as the expected trace grows. Problem 3 applied haplography, dittography and the canons to three witnesses, counted independent lines ($K$ and $T$ are one), and showed that the rules are rules of thumb that sometimes only lean.

      In each, the readers agreed on the first layer, argued over the second with evidence, and parted at the third. **Next:** part 2 takes a real debate from the level, a closing weighing across Judaism and the Torah, and asks you to say what a fair reader of any belief can accept.
