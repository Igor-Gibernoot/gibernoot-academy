id: ch14-challenge-2
title: "Level Challenge: Reading the Torah Fairly (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: a real debate, then a closing weighing"
    body: |
      Part 1 used invented texts. These two problems use real material from the level, so every claim is taught according to someone. The toolkit is restated so this part stands alone.

      - **Three readings of how the Torah came to be.** According to the documentary hypothesis (Julius Wellhausen, 1878 and 1883), separate sources (called J, E, D and P) were joined by an editor. According to the supplementary hypothesis, one core text was enlarged by later additions. According to traditional readers, such as Umberto Cassuto (1883-1951), one planned work, in the Orthodox tradition given through Moses.
      - **Three kinds of evidence about a claim in a story.** *Attested*: a source outside the story names it. *Debated*: there is a find, but experts read it differently. *Silent*: nothing found. Silence counts for more when the story would have left a large trace.
      - **Weigh witnesses, do not count them.** Copies made from one parent are one voice. The old canons (the harder reading, the shorter reading, the reading that best explains the others) are rules of thumb.
      - **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. A claim is never passed off as belonging to a lower layer than it does.

      Problem 4 is a real debate (how many people left Egypt, and what a desert and an archive can say). Problem 5 weighs the whole level and asks for a summary that a believer, a historian and an atheist could each accept.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · How many left Egypt?"
    body: |
      **Problem 4.** According to Exodus 12:37, the Israelites set out with "about six hundred thousand men on foot, besides women and children", and according to Numbers 1:46 the census of men over twenty came to 603,550. These are the figures in most English translations.

      Three readers meet this number.

      - A **literal-historical believer** takes the figure as given and holds that God provided for the people in the desert.
      - A **believer who reads the number differently** notes that the Hebrew word *eleph*, usually "thousand", may in some places mean a clan or a military unit (an idea of the archaeologist Flinders Petrie in 1923, and of George Mendenhall), so that the count would be of much smaller size. Others reply that this reading has its own problems, for example where *eleph* appears alongside hundreds.
      - A **critical historian** (for example Redford, Dever or Finkelstein) holds that nothing in Egyptian records or in Sinai matches a mass departure of millions, and that the story preserves the memory of a much smaller group, or of other events.

      Your task: say how big the number is, what it would imply, which premise separates the readers, and what evidence would move each.

  - type: numeric
    id: p4-total
    title: "What total does the census imply?"
    prompt: |
      The census counts $603{,}550$ men over twenty. A historian who wants the whole people assumes each man stands for about $4$ people (himself, a wife, and two children or dependants). In millions of people, what total does this give? (Redford's own estimate of the Exodus population is $2$ to $2.5$ million.)
    answer: 2.414
    tolerance: 0.005
    answerText: '2.414'
    wrong:
      - { value: 0.6, feedback: "That is the number of men only. The question asks for the whole people, which includes women and children." }
      - { value: 3.0, feedback: "That would be five per man, $5\\times603{,}550\\approx3.0$ million. The question gives four." }
    hint: Multiply the number of men by the number of people each man stands for, then express the result in millions.
    explanation: |
      $603{,}550\times4=2{,}414{,}200$, about $2.4$ million, inside Redford's range of $2$ to $2.5$ million. That is a layer-one fact about the arithmetic. Whether four people per man is a good assumption is a modelling choice, and whether the number itself is historical is the debate.

  - type: numeric
    id: p4-column
    title: "How long would the column be?"
    prompt: |
      Suppose the whole people of $2{,}414{,}200$ marched in a single column, ten abreast, with $1$ metre between one row and the next. How long is the column, in kilometres? (A toy estimate; real columns bunch and spread.)
    answer: 241
    tolerance: 1
    answerText: '241'
    wrong:
      - { value: 2414, feedback: "That would be a column one person wide ($2{,}414{,}200$ metres). Ten abreast divides the length by ten." }
      - { value: 24, feedback: "That would be a hundred abreast. The prompt says ten." }
    hint: Number of rows = number of people divided by ten. Each row takes one metre.
    explanation: |
      Rows: $2{,}414{,}200/10=241{,}420$. At $1$ m each, the column is $241{,}420$ m, about $241$ km. Cline gets about $240$ km by the same kind of toy calculation. The number does not show the story false: it shows that the literal reading needs miracles or very unusual logistics, and a reader who accepts those has made a layer-three choice.

  - type: mcq
    id: p4-premise
    title: "Which premise separates the readers?"
    prompt: |
      A literal believer, a clan-reading believer and a critical historian all accept that $603{,}550\times4=2{,}414{,}200$ people. What most sharply separates them?
    options:
      - text: 'Different premises about the text and about what a mass departure must have left: whether *eleph* means "thousand", whether the narrative describes ordinary history or divinely supported events, and how much trace a large group would leave in Egypt and Sinai.'
        correct: true
        feedback: |
          Yes. The arithmetic is shared. The readers differ on the translation (layer two), on whether the story needs a miracle to work (layer three), and on how much silence the archive and the desert can bear (layer two).
      - text: 'Only one of them knows the text; the others have not read the census.'
        feedback: |
          All three have read the same verses. The disagreement is about what to conclude from them, which is why it survives full information.
      - text: 'The arithmetic: the historian believes $603{,}550\times4$ is not $2.4$ million.'
        feedback: |
          Nobody disputes the product. They differ on whether it describes a real event.
    explanation: |
      A debate that survives shared facts is usually a debate about premises. Naming them is the first step to arguing fairly.

  - type: mcq
    id: p4-sort
    title: "Attested, debated or silent?"
    prompt: |
      Sort the claim correctly. According to the evidence discussed by historians of Exodus, a large Israelite population in Sinai in the 13th century BCE, as the story describes, is
    options:
      - text: 'Silent so far: surveys of Sinai and Kadesh-barnea (according to Finkelstein, Kadesh-barnea was uninhabited before the early 12th century BCE) have found no such camps, though desert nomads leave little. Some defenders say this fits small groups or miraculous provision, which is a commitment.'
        correct: true
        feedback: |
          Yes. "Silent" is the honest label. How loud the silence is depends on the expected trace, and that depends on the size of the group, which is the point in dispute.
      - text: 'Attested, because Egyptian papyri record the departure of Israelites.'
        feedback: |
          No Egyptian record of such a departure is known. Egyptian texts mention fugitive slaves and Semitic herders at the frontier (the papyrus Anastasi V reports two escaped slaves), but they name no Israelites.
      - text: 'Debated in the sense that experts read a find differently: the find is the Dead Sea Scrolls.'
        feedback: |
          The scrolls are real finds about later texts, not about Sinai in the 13th century BCE. For Sinai, the dispute is about what silence means, not about a find.
    explanation: |
      Two other items are worth keeping apart. The Merneptah Stele (c.1208 BCE) names Israel in Canaan and is attested. Egyptian places in Exodus such as Pi-Ramesses are real and debated in their identification. These support a setting, not the mass exodus.

  - type: mcq
    id: p4-move
    title: "What evidence would move each reader?"
    prompt: |
      A good reader says in advance what would change their mind. Which pairing of reader and evidence is fair?
    options:
      - text: 'Critical historian: an Egyptian record of a mass departure, or large Late Bronze Age camps in Sinai, would move them toward a larger event. Clan-reading believer: evidence that *eleph* in the census lists regularly means "unit", with totals that add up, would strengthen the reading; its failure to add up would count against it. Literal believer: this reader treats the number as a matter of faith in divine provision, so archaeology alone is less likely to move them, and they should say so.'
        correct: true
        feedback: |
          Yes. Each states a test that could in principle go against them, except where the belief is explicitly a layer-three commitment, which a fair reader names as such rather than pretending to evidence.
      - text: 'All three would be moved by exactly the same discovery, so the debate is only about which find comes first.'
        feedback: |
          They hold different premises, so the same find counts differently for each. A find of Sinai camps would move the historian, but could be read by the clan-reading believer as a small camp.
      - text: 'None of them can be moved, since the question concerns the past.'
        feedback: |
          Past questions can have future evidence: new excavations, new inscriptions, new readings of old ones. What differs is the weight each reader gives it.
    explanation: |
      Naming what would move you is a mark of a fair reader. It turns "I believe" or "I doubt" into a position with a stated risk, apart from the cases that are honestly faith commitments.

  - type: mcq
    id: p4-parting
    title: "Where do thoughtful readers part ways?"
    prompt: |
      After the exercise, a skeptic says: "The lack of finds proves the Exodus never happened." A believer says: "The lack of finds proves nothing, so the story is confirmed." Which assessment is fair?
    options:
      - text: 'Both overreach. Silence in Sinai is a fact (layer one) and counts for something, because a very large group would leave traces; but it cannot show that nothing happened, since a small group or an unremembered route leaves little. And lack of disproof does not confirm a story. Whether a God acted in the event is a commitment (layer three).'
        correct: true
        feedback: |
          Yes. Silence is weighed by the trace expected. A fair summary keeps the finding (no matching record), the live debate (small event, other events, or an unrecorded one), and the commitment (divine action) in separate boxes.
      - text: 'The skeptic is right, since an absence of evidence is always evidence of absence.'
        feedback: |
          It is evidence of absence only when a trace was expected. For a small group in a desert, little was expected.
      - text: 'The believer is right, since an absence of evidence is never evidence.'
        feedback: |
          For a claim that should leave a large trace, silence is some evidence against, as in the toy census of part 1 where the water could not have supported the figure.
    explanation: |
      The skill is weighing: how much trace, how big the claim, which layer. Both speakers state their conclusion as if it were in the first layer.

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-setup
    title: "Problem 5 · A closing weighing"
    body: |
      **Problem 5.** Over this level you met claims of very different kinds: about a stele, a codex, an oven, a treatise, a camp. The task is to sort and weigh a few and then write one summary that three different readers could each accept: a **Jewish believer** (here an Orthodox one, to whom the Torah is from God through Moses, in the tradition of Maimonides's eighth principle), a **critical historian** (who asks what evidence supports each claim), and an **atheist** (who holds that there is no God, and reads the Torah as a human work).

      The goal is not agreement about God. It is a description in which each of them says "that is fair to what I hold, and to what the others hold".

  - type: mcq
    id: p5-merneptah
    title: "Claim 1 · Israel in Canaan, c.1208 BCE"
    prompt: |
      The Merneptah Stele, an Egyptian victory inscription found by Flinders Petrie in 1896 and dated to about 1208 BCE, says in its last lines that "Israel" is laid waste. Which layer is the statement "an Egyptian king's stele of about 1208 BCE names a people Israel in Canaan"?
    options:
      - text: 'Layer one: an established fact about a text, the earliest known mention of Israel outside the Bible. What Israel was, and where its people lived, is layer two (debated).'
        correct: true
        feedback: |
          Yes. Even here the layers separate: a majority of scholars read the signs as "Israel", and the date is given as about 1208 BCE (reigns are placed at 1213-1203 BCE by some, 1212-1202 by others).
      - text: 'Layer three, since only a believer can accept a reference to Israel.'
        feedback: |
          Atheists, believers and historians all accept the inscription; it is a plain fact about an Egyptian text.
      - text: 'Layer two, since all dates before 1000 BCE are only debated.'
        feedback: |
          Dates carry uncertainty, but the existence of the stele and its content are not in doubt. The uncertainty is a margin of years, not a dispute.
    explanation: |
      Keeping a fact at its own layer protects it against two mistakes: demoting it because the surrounding story is contested, and promoting a debated reading to fact because the stele is solid.

  - type: mcq
    id: p5-torah
    title: "Claim 2 · How the Torah came to be"
    prompt: |
      Three statements: (a) "The Torah as we have it contains doublets and changes of divine name." (b) "The Torah was joined from separate sources J, E, D and P." (c) "God gave the whole Torah to Moses." Which assignment of layers is right?
    options:
      - text: '(a) layer one, a feature of the text anyone can read; (b) layer two, the documentary hypothesis, with rivals in the supplementary hypothesis and traditional unity readings; (c) layer three, a faith commitment, held in the tradition of Maimonides as a principle of faith.'
        correct: true
        feedback: |
          Yes. A critical historian can accept (a) and weigh (b); the Orthodox believer accepts (a) as a feature and (c) as faith; an atheist can accept (a) and weigh (b) but sets (c) aside. Even among scholars, (b) comes in several forms (Wellhausen's late dating of P, Kaufmann's earlier dating).
      - text: '(a) layer three, (b) layer one, (c) layer two.'
        feedback: |
          This reverses the order. The feature of the text is the most secure; the source theory is a scholarly model; the divine origin is a commitment.
      - text: 'All three are layer one, since each is about the Torah.'
        feedback: |
          Being about the same book does not make claims equally secure. (c) cannot be settled by any manuscript.
    explanation: |
      The same text supports three levels of claim. A fair account says which is which and does not make the second the enemy of the third: some traditional readers accept that the text shows layers of growth and keep the belief that it is from God.

  - type: mcq
    id: p5-akhnai
    title: "Claim 3 · The oven that was not in heaven"
    prompt: |
      In the story of the Oven of Akhnai (Talmud, Bava Metzia 59b), Rabbi Eliezer calls on miracles and a heavenly voice to settle a law, and Rabbi Yehoshua answers with a verse that the Torah "is not in heaven"; the majority prevails. Three readings: R. Yirmeya, quoted in the story, says the Torah was already given at Sinai and we follow the majority; Karaite critics treat the story as hubris, rabbis supplanting divine authority; Jeffrey Rubenstein reads the majority as fair, with limits on how it may treat the minority. What is the best statement of what these readings share and where they part?
    options:
      - text: 'All three agree on the text of the story (layer one). They part on what it means for authority: whether the interpreting community may decide against a divine voice (rabbinic majority, Rubenstein, with limits), or has overreached (Karaite). That is a dispute about layer three, with the historical question (how and when the story was shaped) in layer two.'
        correct: true
        feedback: |
          Yes. A believer in rabbinic tradition reads the story as a model of authority given to the sages; a Karaite believer reads it as the sages claiming too much; a historian asks how the story was edited; an atheist can read it as a human argument about who decides. Same words, four ways to use them.
      - text: 'The three readings disagree about what the text says.'
        feedback: |
          They do not; the text is stable. They disagree about what it shows and about who has authority.
      - text: 'The story shows that miracles never happen, which all three accept.'
        feedback: |
          The story does not say that. In it, a carob tree moves and walls lean. The argument is about whether such signs decide a legal question.
    explanation: |
      Notice that the story itself builds a debate about layer three into the text: who decides when God and the sages seem to differ.

  - type: mcq
    id: p5-thinkers
    title: "Claim 4 · Maimonides, Spinoza, Auschwitz"
    prompt: |
      Match the claim to its holder and layer. (a) Maimonides (1138-1204): the Torah in our hands is the Torah given to Moses, and all of it is from God. (b) Spinoza (1632-1677; excommunicated 1656; *Theological-Political Treatise*, 1670): the books of the Torah were written by someone living many generations after Moses. (c) Rubenstein (1924-2021), *After Auschwitz* (1966): after Auschwitz the belief in a God who directs history and chose Israel can no longer be held. Which description is fair?
    options:
      - text: '(a) and (c) are layer-three commitments from within Judaism, in opposite directions, and answered in turn by Berkovits (hiding of God), Jonas (a God who gives up omnipotence) and others. (b) is a historical claim (layer two) that later scholarship took up and refined, and it cost its author his place in the community in 1656.'
        correct: true
        feedback: |
          Yes. The fact underneath (c) is the Holocaust, about six million Jewish victims, 1933-1945 (layer one). What it implies about God is a question on which Jewish thinkers disagree.
      - text: 'All three are layer one, since each thinker is a documented person.'
        feedback: |
          That the thinker existed is layer one; the claim they make is another matter.
      - text: '(b) is layer three, since it concerns the Bible; (a) and (c) are layer one.'
        feedback: |
          (a) and (c) are commitments about God. (b) is about authorship, which historians argue with evidence.
    explanation: |
      A fair summary keeps these apart. Maimonides's principle is a commitment, Spinoza's is a historical argument with a theological edge, and Rubenstein's is a response to a fact, not itself a fact.

  - type: order
    id: p5-order
    title: "How to weigh a claim"
    prompt: Put the steps of weighing a claim fairly in order.
    steps:
      - Say whose claim it is, and state it in their terms ("according to Maimonides ...").
      - Separate the part that is a fact about a text or find from the part that interprets it.
      - Ask which layer each part belongs to and what evidence, if any, bears on it.
      - Weigh the evidence by the trace expected, not by counting copies or voices.
      - Say what would move each side, and what each side must still hold as a commitment.
    hint: The order moves from who says it to what could change minds.
    explanation: |
      Attribution first, so the limit of the claim is visible; then splitting fact from reading; then layers and evidence; then weighing; then the test of what would move each side. The same method worked on the scroll of Aven, the toy census, the Chronicle of Harrow, and the real Exodus debate.

  - type: mcq
    id: p5-summary
    title: "A summary all three could accept"
    prompt: |
      Which summary of the level could the Orthodox believer, the critical historian and the atheist each accept as fair?
    options:
      - text: 'The Hebrew Bible reached us through ancient writing, copying and editing; scholars debate how the Torah grew and how much of its history matches outside evidence, while the tradition holds that it is from God through Moses. The first claim is evidence, the second is debate, and the third is faith. Rabbinic Judaism kept the text alive through interpretation, and Jewish thinkers from Maimonides to Rubenstein answered the same questions differently.'
        correct: true
        feedback: |
          This keeps the three layers apart and names the sources and the disagreement without taking a side on God. Each reader can say: my position is here, correctly described, and so are the others.
      - text: 'The Torah was written by Moses, as archaeology and manuscripts show.'
        feedback: |
          Claims layer-three authority as if it were established by layer-one evidence; the historian and the atheist would reject it, and so would many scholars.
      - text: 'The Torah is a human invention, as the documentary hypothesis proves.'
        feedback: |
          Claims a metaphysical conclusion from a historical model; the believer would reject it, and so would historians who treat the model as debated and silent on divine action.
    explanation: |
      The two wrong summaries each smuggle a conclusion across a layer. The fair one lets the evidence speak where it can and labels the rest.

  - type: mcq
    id: p5-parting
    title: "What remains open"
    prompt: |
      Which pair of questions is left open by the level even after the fairest weighing?
    options:
      - text: 'Whether the Torah has a divine origin or authority (a commitment evidence cannot settle), and, among historians, how the Torah grew and which events behind the Exodus and the conquest were real (debated, because the evidence is partial).'
        correct: true
        feedback: |
          Yes. One open question is faith; the other is research. Mixing them is the usual error.
      - text: 'Whether the Dead Sea Scrolls exist, and when Maimonides was born.'
        feedback: |
          Both are settled facts (the scrolls were found in caves from 1946-47, and Maimonides was born in 1138, though some sources say 1135).
      - text: 'Nothing: the level has resolved every question.'
        feedback: |
          The level taught how to weigh, not a final verdict; the course aims at the right questions.
    explanation: |
      That is the point of the level: to leave a reader who can say what is known, what is argued, and what is believed, and why thoughtful people differ.

  - type: text
    id: closing
    title: "What these two problems used"
    body: |
      Problem 4 took a real debate: $603{,}550\times4=2{,}414{,}200$ people, a column of about $241$ km ten abreast, three readers who share the arithmetic but not the premises, a silence in Sinai that counts for more as the expected trace grows, and a test for each reader of what would move them. Problem 5 sorted claims about a stele, the Torah, an oven, and three thinkers into the three layers, ordered the steps of weighing a claim, and wrote a summary that a believer, a historian and an atheist could each accept.

      The method for every contested claim: say whose claim it is; split fact from interpretation; ask the layer; weigh evidence by the trace expected; name what would move each side.

      **Next:** the level on Christianity and the Gospels applies the same toolkit to a new set of texts: the Jewish world of Jesus, the four Gospels and how they were written, the historical Jesus as scholars debate him, Paul, and the councils that shaped the church.
