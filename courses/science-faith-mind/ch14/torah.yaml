id: ch14-torah
title: "The Torah and the Documentary Hypothesis"
kind: concept
own: |
  The setting: the **Torah** (also called the Pentateuch, "five scrolls") is the first five books of the Hebrew Bible: Genesis, Exodus, Leviticus, Numbers and Deuteronomy. Everything below is taught according to someone. A **doublet** is a story told twice inside one text; a **source** is an older text that scholars think lies behind the Torah; a **redactor** is an editor who joins older texts into one.
  - **The tradition.** According to rabbinic tradition and Maimonides, the Torah was given by God through Moses, who wrote it down. Yet the Talmud (Bava Batra 14b) records one opinion that {{ Joshua wrote the last eight verses }}, the account of Moses's death.
  - **Early doubts.** According to Ibn Ezra (c. 1089-1164), some verses read as if written from a later place and time, and he only hinted at it. According to Spinoza (1670), those hints show that Moses did not write the whole Torah. According to Astruc (1753), who meant to defend Moses, Genesis was made by combining older documents, told apart by their use of the divine names Elohim and YHWH.
  - **The classical hypothesis.** According to Wellhausen (1878, 1883), four once-separate sources were joined by editors: the Yahwist J, the Elohist E, the Deuteronomist D and the Priestly source P. His order of writing, oldest first, is
  {{ $$J \to E \to D \to P$$ }}
  - **Josiah's scroll.** According to 2 Kings 22, in the 18th year of King Josiah of Judah (reigned c. 640-609 BCE) the high priest Hilkiah found a scroll of the law in the Temple. According to de Wette (1805), that scroll was {{ Deuteronomy, or an early form of it }}. The tradition holds instead that it was a lost Mosaic scroll, and recent scholars treat the story as largely legendary.
  - **Rival models.** The *supplementary* model: one core text enlarged by additions. The *fragmentary* model: many short pieces gathered late. Kaufmann dated P before the exile, Friedman in the reign of Hezekiah, Wellhausen after the exile. Cassuto argued for {{ one planned work, with the divine names chosen on purpose }}. Today scholars still disagree: most keep a distinct Deuteronomy and a Priestly layer, and many place the final Torah in the Persian period (539-333 BCE).
  - **Three layers.** Established: the texts, their doublets and name patterns. Live debate: how many sources, their order and dates. Commitment: whether the Torah is revealed, which no method of dating decides.

cards:
  - type: mcq
    id: hook
    title: "Guess: two versions of one story"
    prompt: |
      Guessing is the point; no background is needed. You read an old book and find the same event told twice, one after the other. In one telling the event takes a day and a certain animal is mentioned in pairs; in the other it takes weeks and the animal comes in sevens. What is the most reasonable first guess?
    options:
      - text: "Maybe two older accounts were joined into one book, or maybe one author told it twice on purpose; the clash is a clue that needs both ideas tested."
        correct: true
        feedback: |
          Yes. A seam can mean two sources, and it can mean a writer's design. This lesson is about how scholars and believers weigh those two readings.
      - text: "The author must have been forgetful, and nothing more can be said."
        feedback: |
          Possible, but it stops thinking too soon. Ancient editors often kept two versions side by side, and a deliberate repeat is also possible, so there is more to test.
      - text: "One of the two versions is a forgery by a later hand, and the other is genuine."
        feedback: |
          That jumps to a verdict. Both tellings may be equally old, and the book may have meant to keep them together.
    explanation: |
      The Torah has several such pairs. Three things must stay apart: what the text shows (a repeat), what scholars infer (sources, an editor, or design), and what a community holds about the text's origin.

  - type: text
    id: tradition
    title: "The tradition: Moses and Sinai"
    body: |
      The **Torah** (Hebrew for "teaching") is the first five books of the Hebrew Bible: Genesis, Exodus, Leviticus, Numbers and Deuteronomy. According to rabbinic tradition, all the teachings of the Torah were given by God through Moses, some at Mount Sinai and some at the Tabernacle (the portable shrine of the desert years), and Moses wrote them down.

      The Talmud, the great collection of rabbinic discussion, already asks who wrote what. According to a teaching in tractate Bava Batra (14b), Moses wrote his own book, and Joshua wrote the book that bears his name and the last eight verses of the Torah, which describe Moses's death. The Talmud treats this as one opinion. According to Maimonides (1138-1204; some sources give 1135 for his birth), the great medieval Jewish thinker, in the thirteen principles of faith he drew up, the Torah in our hands is the Torah handed down through Moses; he held that nothing may be added to it or removed. Scholars debate exactly how Maimonides meant his eighth principle, but its plain sense for adherents is a Torah that comes from God through Moses.

  - type: mcq
    id: tradition-q
    title: "Even the tradition noticed"
    prompt: |
      According to the Talmud passage in Bava Batra 14b, who wrote the last eight verses of the Torah, the ones that tell of Moses's death, and why would the tradition say so?
    options:
      - text: "One opinion says Joshua wrote them, since Moses could hardly have narrated his own death; the tradition itself saw that those verses need an explanation."
        correct: true
        feedback: |
          Yes. Another opinion in the same discussion holds that Moses wrote them too, in tears, as God dictated them (sources differ on which rabbi held which view). Either way, adherents faced the question long before modern criticism.
      - text: "Nobody; the Talmud says the verses were added by an unknown late editor."
        feedback: |
          The Talmud passage names Joshua for the last eight verses, in one opinion. The idea of an unknown late editor is a modern scholarly proposal, discussed later in this lesson.
      - text: "The Talmud says Moses wrote everything, and no one in the tradition ever asked the question."
        feedback: |
          The question was asked in the Talmud itself. Many adherents still hold that Moses wrote the whole text, but the discussion shows the matter was not simple.
    explanation: |
      Describing a tradition as its adherents do includes this: the belief in Mosaic origin has always lived with discussion about details.

  - type: text
    id: doubts
    title: "Early doubts, and an attempt to defend Moses"
    body: |
      Abraham ibn Ezra (c. 1089-1164), a Spanish Jewish commentator, noticed odd phrases. Deuteronomy 1:1 places Moses's words beyond the Jordan, a phrase that sounds as if the writer lived on the other side of the river, in the land the people had not yet entered. Genesis 12:6 says the Canaanites were then in the land, which sounds as if they no longer were. Ibn Ezra also listed the last twelve verses of Deuteronomy. He wrote that there is a mystery here and that whoever understands it should keep silent. He did not say outright that Moses did not write them; many adherents read his comments as fitting a Torah given to Moses, and the stronger reading came later.

      Baruch Spinoza (1632-1677), in his *Theological-Political Treatise* (1670, published anonymously), quoted Ibn Ezra and read his hints as a clear sign that Moses did not write the Torah. He argued that the books were probably put into their final form long after Moses, perhaps by Ezra the scribe.

      Jean Astruc (1753), a French physician, meant the opposite. In *Conjectures* (published anonymously) he argued that Moses wrote Genesis by combining older documents. He told them apart by how they name God, Elohim in some verses and YHWH in others, and by repeated stories, and he set them in parallel columns. A later hand, he thought, had merged the columns and so produced the repeats that critics like Spinoza complained of.

  - type: mcq
    id: doubts-q
    title: "Same clue, different aim"
    prompt: |
      Astruc and Spinoza both studied the Torah's seams (repeats, divine names, odd phrases). According to each of them, what did the seams show?
    options:
      - text: "According to Astruc, Moses used older documents and a later hand merged them; according to Spinoza, Moses did not write the Torah as a whole."
        correct: true
        feedback: |
          Yes. The same kind of clue was read to defend Mosaic authorship (Astruc) and to deny it (Spinoza). The clue does not settle the verdict by itself; the starting aim shapes the reading.
      - text: "Both concluded that the Torah was a late forgery."
        feedback: |
          Astruc wrote to defend Moses, and Spinoza argued for a long, composite history, which is different from a forgery.
      - text: "According to Astruc, God's name proves a single author; according to Spinoza, the names are meaningless."
        feedback: |
          Astruc used the changing names to tell documents apart, not to prove one author. Spinoza's argument ran through odd phrases and the history of the books.
    explanation: |
      Two views from one set of clues: a Moses who compiled sources, and a Torah assembled long after Moses.

  - type: text
    id: doublets
    title: "The clues: stories told twice"
    body: |
      A **doublet** is a story or law that appears twice in a text, with differences. Scholars of the school we are about to meet point to two famous ones.

      Creation. In Genesis 1 God (Elohim) makes plants on the third day, animals on the fifth and sixth, and then man and woman together (Genesis 1:27). In Genesis 2:4 onward the Lord God (YHWH Elohim) forms the man from dust before any plant has grown (2:5-7), then the animals (2:19), and the woman last (2:21-22).

      The flood. In Genesis 6:19-20 Noah is to bring two of every kind of living creature into the ark. In Genesis 7:2 he is to take seven pairs of every clean animal and one pair of every unclean one. Genesis 7:4 gives forty days of rain, while Genesis 7:24 says the waters prevailed for 150 days.

  - type: numeric
    id: flood-q
    title: "Count the animals"
    prompt: |
      According to the Hebrew text of Genesis 7:2, Noah is told to take seven pairs of each kind of clean animal (a pair is one male and one female). How many animals of one clean kind is that? (Compare Genesis 6:19-20, which speaks of two of every kind.)
    answer: 14
    wrong:
      - { value: 7, feedback: "Seven is the number of pairs. Each pair has two animals, so count the animals." }
      - { value: 2, feedback: "Two is the number in Genesis 6:19-20, the first telling. The second telling, in 7:2, gives more for the clean animals." }
    hint: "Seven pairs, two animals in each pair."
    explanation: |
      Seven pairs make 14 clean animals of that kind, against two in the other telling. Source critics read the two numbers as coming from two accounts. A defender of one author can reply that the two verses are parts of one plan, a general rule and then a fuller instruction. Both replies take the text seriously.

  - type: text
    id: names
    title: "The clues: names of God, style, contradictions"
    body: |
      **Divine names.** Genesis 1 uses only Elohim (God). Genesis 2:4-22 uses YHWH Elohim (the Lord God). Inside the flood story the name changes too: YHWH in Genesis 6:5-8 and Elohim in 6:9-22. Exodus 6:3 says God appeared to the patriarchs as El Shaddai and that the name YHWH was not made known to them in that way, while YHWH already appears throughout Genesis. According to source critics, the name pattern marks different authors.

      **A rival reading of the names.** According to Umberto Cassuto (1883-1951), an Italian-born Jewish scholar, the names are chosen on purpose: Elohim speaks of God as the creator of all nations, YHWH of Israel's covenant God, and YHWH Elohim in Genesis 2 joins the two. He held that the Torah is one planned work.

  - type: mcq
    id: names-q
    title: "One switch, two readings"
    prompt: |
      In the flood story the divine name changes from YHWH (Genesis 6:5-8) to Elohim (6:9-22). Which pair of readings is stated correctly?
    options:
      - text: "Source critics: the switch marks a change from one older source to another. Cassuto: the author chose each name to fit its meaning in context, so no second author is needed."
        correct: true
        feedback: |
          Yes. Both readings accept the same facts. They differ on what produced the pattern: separate hands, or one writer with a reason for each name.
      - text: "Source critics: the switch is a copying error. Cassuto: the switch is proof that Moses wrote the flood story."
        feedback: |
          Source critics do not call it a copying error; they read it as a trace of different sources. Cassuto argued the names were deliberate, but a deliberate choice does not by itself prove who the author was.
      - text: "Both agree that the names carry no meaning at all."
        feedback: |
          They disagree on exactly that point. For Cassuto the names carry meaning, and for source critics the names help sort sources.
    explanation: |
      A fact (the name pattern) can be explained by more than one hypothesis. Which one is better depends on how well each handles all the clues together, not on one clue.

  - type: text
    id: moses-death
    title: "The clue that every side must face"
    body: |
      Deuteronomy 34 ends the Torah. In paraphrase: Moses, the servant of the Lord, dies in the land of Moab; God buries him in a valley, and no one knows the place of the grave to this day. The mourning lasts thirty days. The chapter closes by saying that no prophet has arisen in Israel since like Moses, whom the Lord knew face to face.

      Words like to this day and since look back from a later time. According to the Talmud (one opinion), Joshua wrote these verses; according to another reading, Moses wrote them as a prophecy of his own death; according to many modern scholars, they come from a later hand and show the Torah was edited after Moses. The same verses are evidence for all three readings, and the choice among them depends on what each reader already holds about Moses and about the text.

  - type: text
    id: classical
    title: "The classical hypothesis: J, E, D, P"
    image:
      src: img/wellhausen.webp
      alt: "Studio photograph of an older man with a white beard and glasses, in a dark coat"
      caption: "Julius Wellhausen (1844-1918), whose Prolegomena of 1883 gave the four-source theory its classic form."
      credit: "Peter Matzen, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:1900_circa_Peter_Matzen_Kabinettfotografie_Brustbild_Julius_Wellhausen,_Bildseite.jpg"
    body: |
      In the 19th century scholars built these clues into a theory, the **documentary hypothesis**. Johann Eichhorn (1780) proposed two sources in Genesis. Hermann Hupfeld (1853) argued for four. Wilhelm de Wette (1805) tied Deuteronomy to the reign of King Josiah, and Karl Heinrich Graf (1866) argued that the priestly laws in Exodus, Leviticus and Numbers came later than Deuteronomy. Julius Wellhausen gave the theory its classic form in a work first published in 1878 and expanded in 1883, arguing that the Torah combined four originally independent texts written several centuries after Moses.

      The four sources, with Wellhausen's dating:

      | Source | Name from | Wellhausen's date |
      |---|---|---|
      | J | Yahwist (the name YHWH) | 10th century BCE |
      | E | Elohist (the name Elohim), northern Israel | 9th century BCE |
      | D | Deuteronomist, mostly the book of Deuteronomy | 7th century BCE, under Josiah |
      | P | Priestly, law and ritual | after the exile, 6th-5th century BCE |

      The Babylonian exile (6th century BCE) was the removal of Judah's leaders to Babylon. According to Graf and Wellhausen, the order also reflects a view of history: the priestly laws came later than Deuteronomy.

  - type: order
    id: order-q
    title: "Wellhausen's order"
    prompt: "According to Wellhausen, put the four sources in the order they were written, oldest first."
    steps:
      - "J (Yahwist): 10th century BCE, Judah"
      - "E (Elohist): 9th century BCE, northern Israel"
      - "D (Deuteronomist): 7th century BCE, Josiah's time"
      - "P (Priestly): after the exile"
    hint: "Think of the order of kings and the exile; the priestly source is the youngest in his scheme."
    explanation: |
      J, E, D, P. Note that the order of the sources does not match the order of the books: Deuteronomy, the fifth book, holds D, while P is spread through Genesis, Exodus, Leviticus and Numbers. This is the point of the theory: the books are woven from texts of different ages.

  - type: text
    id: josiah
    title: "A scroll in the Temple"
    body: |
      According to 2 Kings 22, in the 18th year of King Josiah of Judah (who reigned about 640-609 BCE) the Temple was being repaired. The high priest Hilkiah found a scroll of the law and gave it to the secretary Shaphan, who read it to the king. Josiah was alarmed, consulted the prophetess Huldah, and then carried out a reform of worship.

      In his doctoral dissertation of 1805 Wilhelm de Wette (1780-1849) proposed that this scroll was the book of Deuteronomy, or an early form of it. He saw in it the book behind Josiah's reform. Wellhausen later called de Wette the one who opened the historical criticism of the Torah. The scholarly consensus has long been that the scroll was a copy of Deuteronomy or part of it, though recent scholars treat the story as largely legendary. The tradition holds a different view: that the scroll was an old Mosaic book that had been lost.

  - type: mcq
    id: josiah-q
    title: "What would a critic reject?"
    prompt: |
      According to de Wette, the scroll found in Josiah's day was Deuteronomy, or an early form of it, which means Deuteronomy would be about as old as the 7th century BCE. Which reply comes from the tradition's side?
    options:
      - text: "The scroll could have been a genuinely old book from Moses's time that had been lost in the long neglect of the Temple; finding it late does not show it was written late."
        correct: true
        feedback: |
          Yes. The evidence (a scroll turns up in Josiah's day) fits both stories, a recent writing and a rediscovery.
      - text: "The story in 2 Kings 22 cannot be read at all, since the scroll is never described."
        feedback: |
          The text does describe the finding. The scroll is not named, but the story can be read, and that is how de Wette used it.
      - text: "The scroll had to be a forgery by Hilkiah, since priests profit from new laws."
        feedback: |
          That is a charge no one in this debate can prove, and de Wette did not argue that. A scholarly reading separates the question of date from questions of motive.
    explanation: |
      The same fact, a scroll appears in Josiah's Jerusalem, is read by de Wette as the moment Deuteronomy appeared, and by the tradition as the moment an ancient book returned. Further evidence, such as the content of the laws, has to decide between them.

  - type: text
    id: challenges
    title: "Rivals and revisions"
    body: |
      The classical hypothesis has never been the only view, and it has been revised since. Three model types are worth telling apart.

      The **supplementary hypothesis** (dominant by the early 1860s) said that one core text was enlarged over time by additions. The **fragmentary hypothesis** said that the Torah grew from many short pieces, not long documents. Van Seters (1970s) argued for a supplementary picture and dated J late, in the Babylonian captivity at the earliest; Rendtorff and his followers argued for a fragmentary picture, with short narratives gathered in Deuteronomistic and Priestly editing.

      On dates, Yehezkel Kaufmann (1889-1963), an Israeli Bible scholar, accepted separate sources but argued that P is much older than Wellhausen allowed, before the exile and before Deuteronomy, since P does not know that worship must be centralized. Richard Elliott Friedman (*Who Wrote the Bible?*, 1987) dated P to the reign of Hezekiah of Judah, and held that J and E were joined soon after 722 BCE, when the northern kingdom fell, and P about three hundred years later.

  - type: mcq
    id: dating-q
    title: "Three dates for P"
    prompt: |
      Wellhausen put the Priestly source after the exile, Kaufmann before the exile and before Deuteronomy, and Friedman in the reign of Hezekiah. What does this disagreement show?
    options:
      - text: "Scholars who accept a separate Priestly source can still disagree by centuries about its date, so dating the sources is a live debate, not a settled fact."
        correct: true
        feedback: |
          Yes. All three agree that P is a separate layer. They differ on the evidence for its age: its relation to centralized worship, its language, and its link to the Temple priesthood.
      - text: "Since the dates differ, there is no Priestly source at all."
        feedback: |
          Disagreement about a date does not remove the thing dated. Most scholars still agree that some Priestly layer exists, although its extent is uncertain.
      - text: "The latest date must be right, because later scholars know more."
        feedback: |
          Later does not mean better supported. Wellhausen's date, Kaufmann's date and Friedman's each rest on arguments that scholars still weigh.
    explanation: |
      Today most scholars keep a distinct Deuteronomy and some Priestly layer, but not the full classical scheme. A revised neo-documentary view still has adherents, especially in North America and Israel, while many Europeans prefer other models.

  - type: text
    id: unity
    title: "Defenders of unity, and a test with real examples"
    body: |
      Umberto Cassuto's *The Documentary Hypothesis and the Composition of the Pentateuch* (Hebrew 1941, English 1961) grew out of eight lectures. He went through the pillars of the hypothesis in turn: the divine names, language and style, contradictions. He argued, according to summaries of the work, that the names are chosen for meaning, that style differences follow subject matter, and that the supposed contradictions can be read as one writer's plan. Cassuto's target was the classical form of the hypothesis; critics reply that the hypothesis had already moved on.

      A different kind of reply came from Jeffrey Tigay (born 1941), a scholar of the Bible and the ancient Near East. Instead of asking whether the idea sounds plausible, he asked whether real ancient texts grew this way. In *Empirical Models for Biblical Criticism* (1985), which he edited, he and other scholars studied ancient works that survive in several versions, among them the Gilgamesh epic, Qumran texts and the Samaritan Pentateuch. The publisher's summary says these comparisons show that the sort of development nineteenth-century critics inferred from the Torah alone is characteristic of many ancient Near Eastern texts. Not every scholar finds the comparisons close enough, and the debate about how much they prove continues.

  - type: mcq
    id: empirical-q
    title: "What counts as evidence?"
    prompt: |
      A critic of the documentary hypothesis says: "No other ancient work was ever put together from sources like that." What kind of evidence does Tigay's volume offer in reply?
    options:
      - text: "Ancient texts that survive in several versions, such as the Gilgamesh epic, show that a work could grow by revision and combination over time; this is an analogy, and its strength is argued over."
        correct: true
        feedback: |
          Yes. Analogies from real ancient cases can raise or lower the plausibility of a model. They do not prove how the Torah was made, and scholars disagree on how close the cases are.
      - text: "A signed manuscript in which a named editor says he combined four sources."
        feedback: |
          No such manuscript exists for the Torah. The volume works with other texts that survive in more than one version, which is why it is an argument by analogy.
      - text: "A computer count of divine names that proves the four sources exist."
        feedback: |
          Counts of names are part of the old debate, and Cassuto read them differently. The volume is about how ancient works grew, not about a count.
    explanation: |
      The question moves from "does it sound odd?" to "did anything like it happen?". The answer helps the hypothesis without settling it.

  - type: text
    id: believers
    title: "How adherents hold the Torah and the scholarship"
    body: |
      Adherents answer in different ways, and the answers are commitments, not discoveries of the method. Some hold that Moses wrote the entire Torah, with the last verses written as God dictated them, in tears according to one Talmudic opinion. Others, following the Talmud's opinion, hold that Joshua added the last eight verses, and treat Ibn Ezra's hints as pointing to small later additions, while the Torah remains Moses's and God's. Maimonides's eighth principle, in the plain sense of adherents, is that the Torah we have comes from God through Moses. Cassuto, as a scholar and a Jew, argued for one plan in the whole text.

      Other readers, Jewish and Christian, accept a scholarly picture of sources and editing and hold that God's revelation is carried in the finished book, or in the long process of its making. Still others see no divine element at all. The method of dating sources can say how and when texts were put together; whether the Torah is revelation is a question of faith, which dating cannot answer in either direction.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Match the statement to its layer. "God gave the Torah to Moses at Sinai."
    options:
      - text: "A faith commitment: it is held within a tradition and is not decided by evidence about sources or dates."
        correct: true
        feedback: |
          Yes. A community may hold it with full confidence, and a scholar who disagrees is not refuting it with dating. Equally, scholarship does not prove it.
      - text: "An established fact, supported by the manuscripts."
        feedback: |
          The manuscripts show texts and their differences. They do not show who authored them or whether they were revealed.
      - text: "A live scholarly debate about the J and E sources."
        feedback: |
          The debate about J and E concerns composition and dating. The claim about Sinai is a different kind of claim, about revelation.
    explanation: |
      Established: the text has doublets and a pattern of divine names. Debate: how many sources, which dates, what produced the seams. Commitment: whether the Torah is revealed.

  - type: mcq
    id: trap-fake
    title: "Trap: the hypothesis says the Torah is fake"
    prompt: |
      A reader says: "If the documentary hypothesis is right, the Torah is a fake and its religion is false." According to the scholars and adherents described in this lesson, what is wrong with this step?
    options:
      - text: "The hypothesis, even if right, is about how and when texts were composed; whether a text carries revelation is a separate question, and adherents have answered it in different ways."
        correct: true
        feedback: |
          Yes. Source criticism is a historical method about authorship and editing. Some people take it to weaken belief in divine origin, and others hold the two together. That is a commitment-layer choice.
      - text: "The hypothesis is certainly wrong, since all scholars rejected it long ago."
        feedback: |
          Neither is true. Many scholars use revised forms, many reject the classical form, and the question is still debated.
      - text: "A text made from several sources cannot be a forgery or a fake by definition, so the worry is empty."
        feedback: |
          The point is narrower: a multi-source origin tells nothing by itself about truth or revelation. Such texts can be honest, sacred or not, depending on other questions.
    explanation: |
      The inference from "composite" to "fake" adds a premise that the method does not provide.

  - type: mcq
    id: trap-settled
    title: "Trap: Wellhausen settled it"
    prompt: |
      A student says: "Wellhausen proved in 1883 that J, E, D and P wrote the Torah, in that order, and scholars have agreed ever since." Which correction is the most accurate?
    options:
      - text: "His 1883 work was a classic formulation, but since then scholars have proposed supplementary, fragmentary and revised models and moved the dates; most keep Deuteronomy and a Priestly layer, but the full scheme is debated."
        correct: true
        feedback: |
          Yes. A theory can be influential for a century and still be revised. Some scholars, such as Friedman, defend a developed form; others, such as Van Seters, rebuilt the picture.
      - text: "Nothing to correct; the field has been unanimous since 1883."
        feedback: |
          The field has not been unanimous. Cassuto and Kaufmann objected early, and in the 1970s Van Seters, Rendtorff and Schmid challenged the framework.
      - text: "Wellhausen's theory has been fully replaced by a single new theory that everyone accepts."
        feedback: |
          The critics of the 1970s did not agree on one replacement, and some scholars combine ideas from several models.
    explanation: |
      Consensus is a matter of degree and changes over time. The honest picture today is a set of agreed points (Deuteronomy as a distinct layer, some Priestly layer, a long process of editing) and many open questions.

  - type: text
    id: summary
    body: |
      **Next:** The sources are one kind of evidence about ancient Israel. The next lesson, "What Archaeology Says", asks what the ground itself shows about the Exodus, the conquest, David and the exile: what is attested, what is debated, and what is silent.
