id: ch14-thought
title: "Jewish Thought: Maimonides, Kabbalah, Spinoza"
kind: concept
own: |
  The setting: three ways Jewish thinkers faced one problem, how a text that speaks of a God with hands and anger can describe a God beyond all description. Everything is taught according to someone. Years are counted in $\text{yr}$.
  - **Maimonides** (Moses ben Maimon, 1138 or 1135 to 1204) finished the *Guide of the Perplexed* in 1190. According to him the Torah speaks in the language of human beings, so verses about God's hand or anger are read as figures; statements about God's nature are read as {{ negations: what God is not }}, and anger names an effect of God's action, not a feeling. His Thirteen Principles (in his commentary on the Mishnah, 1168) opened a lasting debate about creeds; the Guide itself was banned by some and burned in Montpellier in the 1230s.
  - **Kabbalah** (*sod*, the "secret" level of PaRDeS). The *Zohar* was traditionally credited to Simeon bar Yochai (2nd century); most scholars, following Scholem, credit Moses de León (c. 1240 to 1305), who circulated it between about 1280 and 1286. It speaks of **Ein Sof**, "without end", the unreachable God, who becomes knowable through ten **Sefirot**, in order
  {{ $$\begin{aligned}&\text{Keter, Chokhmah, Binah,}\\&\text{Chesed, Gevurah, Tiferet,}\\&\text{Netzach, Hod, Yesod, Malkhut}\end{aligned}$$ }}
  - **Lurianic Kabbalah.** According to Isaac Luria (1534 to 1572, Safed; taught by his disciple Hayim Vital), God first withdrew to make room for the world (**tzimtzum**), the vessels meant to hold the divine light shattered (**shevirat ha-kelim**), and human practice repairs the world, {{ **tikkun** }}.
  - **Spinoza** (1632 to 1677). The Portuguese-Jewish community of Amsterdam put him under a *herem* (ban) on 27 July 1656, never lifted. In the *Theological-Political Treatise* (1670, anonymous) he holds that Scripture is to be read like nature, from its own text and history, rejects Maimonides's rule that Scripture must be read to agree with reason, and doubts that Moses wrote the whole Torah. In the *Ethics* (1677, after his death) he holds that God is {{ Nature itself: *Deus sive Natura* }}, so miracles as breaks in nature's order are impossible.
  - **Three layers.** Established: dates, works, the ban. Live debate: who wrote the Zohar's parts, how Maimonides's negative theology should be read, whether Spinoza was an atheist or a pantheist. Commitment: whether revelation, the Sefirot or God as Nature describe reality.

cards:
  - type: mcq
    id: hook
    title: "Guess: God's hands and God's anger"
    prompt: |
      Guessing is the point; no background is needed. Imagine a community that holds God to be beyond all description, not a body, not in space. Yet its own scripture says "Your right hand, O Eternal One, shatters the foe!" (Exodus 15:6, JPS 2023) and speaks of a fire flaring in God's wrath (Deuteronomy 32:22). Which first guess about reading such verses seems most reasonable?
    options:
      - text: "Maybe the verses are a human way of speaking about something that cannot be described, and a reader must decide which words are figures and which are meant plainly."
        correct: true
        feedback: |
          A good first guess to test. This lesson follows three real answers: Maimonides reads them as figures, the Kabbalists read them as symbols of a hidden structure in God, and Spinoza asks who gave anyone the right to decide.
      - text: "Maybe the verses show the community really thought God has a body, and nothing more needs to be said."
        feedback: |
          Some ancient readers may have, and some ancient sources are debated. But the question here is how later readers faced the tension, and many answered otherwise.
      - text: "Maybe the verses should simply be deleted, since they contradict the idea of God."
        feedback: |
          Almost no one in the tradition proposed that. The usual move was to keep the text and ask how to read it.
    explanation: |
      Keep three layers apart: what the texts and dates show (fact), what scholars debate (for example who wrote what), and what each reader holds about revelation and God (faith).

  - type: text
    id: maimonides
    title: "Maimonides and the Guide"
    image:
      src: img/maimonides.webp
      alt: "A traditional black-and-white portrait of Maimonides, a bearded man in a turban."
      caption: "A traditional portrait of Maimonides, copied by later artists; he finished the Guide of the Perplexed in 1190."
      credit: "presumably Blasio Ugolini, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Rambam-portrait.jpg"
    body: |
      **Moses ben Maimon, Maimonides**, was born in Cordoba and died in Fustat in Egypt in 1204. Most reference works give his birth as 1138; the traditional date is 1135, so some sources give either. He was a rabbi, a legal scholar and a physician. According to the Stanford Encyclopedia, his *Guide of the Perplexed* (finished in 1190) is ostensibly a letter to an advanced student torn between philosophy and his religion. It is also a commentary on biblical terms that seem to give God a body, and a defence of negative theology.

      The key rule is in Guide I.26. In the Friedlander translation (1903) Maimonides writes: "The Torah speaks according to the language of man". He means that the text uses everyday words, many bodily, because most people cannot picture something that is not a body.

  - type: text
    id: negative
    title: "Negative theology: what God is not"
    body: |
      According to Maimonides, the Torah's bodily words are figures, and even the abstract words we use of God must be handled with care. When we say "God is powerful", he reads it as a negation: God is not lacking in power, and God does not have power in the way creatures do. Positive descriptions risk making God one more thing in the world, with parts and qualities.

      What about mercy and anger? He reads them as *attributes of action*: they name the effects that come from God's activity, as a person might call a fire "angry" when it burns, not a mood inside God. So Exodus 15:6 on God's right hand is read as a figure for God's power acting in history.

      Scholars discuss how far this goes. Some read Maimonides as meaning that nothing positive can be known of God's essence; others hold that the Guide's way of speaking is meant to lead the mind to the truth by steps. Both readings agree that the surface of the text is not the last word.

  - type: mcq
    id: reading-q
    title: "Two readings of one verse"
    prompt: |
      Consider the verse "Your right hand, O Eternal One, shatters the foe!" (Exodus 15:6). According to Maimonides, which reading is closest to his view?
    options:
      - text: "The 'right hand' is a figure of speech: it points to God's power at work in events, and the verse uses bodily words because ordinary language has no other."
        correct: true
        feedback: |
          Yes. This is his rule that the Torah speaks in the language of human beings, together with his account of divine action.
      - text: "God literally has a right hand, which is why the verse says it."
        feedback: |
          This is the literal-anthropomorphic reading. Maimonides rejects it as incompatible with God having no body, though some other medieval authors were less sure and the Guide itself was controversial for that reason.
      - text: "The verse says nothing about God and describes only the writer's feelings."
        feedback: |
          Maimonides does not empty the verse. It still says something true: God acts powerfully, but it does not say God has limbs.
    explanation: |
      Both readings take the text seriously. They differ on a premise: whether what the words say of God must be read as a body (literal) or as a figure for something not bodily (Maimonidean). Which premise is right is a question of philosophy and faith, not of Hebrew grammar.

  - type: mcq
    id: controversy-q
    title: "Why the Guide was fought over"
    prompt: |
      In the 1230s some rabbis in southern France opposed the Guide. According to the sources, a scholar of Montpellier, Solomon ben Abraham, judged Maimonides's effort to reconcile Judaism with Greek philosophy to be heretical and imposed a ban, and the book was later burned (sources give 1232, 1233 or 1234). Which statement is the fairest summary?
    options:
      - text: "The worry was that reading Scripture through philosophy might empty its commandments and miracles; the defenders replied that Maimonides had made the commandments more meaningful. The sources agree on the Montpellier ban and burning but disagree on the year and on who invited the Christian authorities."
        correct: true
        feedback: |
          Yes. Layer 1: the ban and the burning happened. Layer 2: the date and who is to blame are debated. Layer 3: whether philosophy can safely guide interpretation is a commitment on which Jews still differ.
      - text: "All Jewish authorities rejected the Guide at once, and it was forgotten."
        feedback: |
          False: it was translated into Hebrew and became one of the most studied works. Some communities, however, banned it, and bans lasted in places into the 19th century.
      - text: "The Guide was never criticised; everyone agreed with Maimonides."
        feedback: |
          Opposite of the evidence. He was both a revered legal authority and the centre of a long controversy.
    explanation: |
      Great figures are often both honoured and contested. Teaching Maimonides fairly means showing both.

  - type: mcq
    id: principles-q
    title: "The Thirteen Principles"
    prompt: |
      Maimonides also listed thirteen principles of faith in his commentary on the Mishnah (finished in 1168). According to the Stanford Encyclopedia, how is this listing described?
    options:
      - text: "As the first attempt to make articles of faith binding in Judaism, which sparked a controversy that continues today."
        correct: true
        feedback: |
          Yes. The first principle is belief in the existence of a Creator on whom everything depends. Many Jews accept the list, while others hold that Judaism is defined by practice and law more than by a creed.
      - text: "As a list nobody discussed, since Judaism has always had creeds like the Christian ones."
        feedback: |
          The point is the opposite: before this attempt Judaism had no accepted creed, and the question whether it needs one is still debated.
      - text: "As a replacement for the commandments."
        feedback: |
          It did not replace them. Maimonides also wrote the Mishneh Torah, a code of law, so law stayed central for him.
    explanation: |
      The principles show the same man who reads God's hand as a figure also holds firmly that God exists and is the cause of all things. Negative theology limits what we say of God's nature; it does not deny that God exists.

  - type: text
    id: kabbalah
    title: "Kabbalah: the hidden structure of God"
    body: |
      *Kabbalah* ("receiving") is the name for Jewish mystical tradition. Its central book is the **Zohar**, a commentary on the Torah mostly in an artificial Aramaic, which appeared in Spain in the late 13th century. According to tradition it records teachings of Simeon bar Yochai (Shimon bar Yochai), a rabbi of the 2nd century, who is said to have hidden in a cave from the Romans. According to most modern scholars, following Gershom Scholem, it was mostly written by Moses de León (c. 1240 to 1305), who circulated it between about 1280 and 1286. Scholem began by planning to refute that critical view and concluded by 1938 that de León was the likeliest author. Some traditional scholars hold that the Zohar still rests on older material.

      The Zohar speaks of **Ein Sof**, "without end": God as unlimited, beyond all description, in line with Maimonides's concern. But it adds a way of speaking about how the endless God is revealed in the world: through ten **Sefirot** (singular *sefirah*), often translated as "emanations" or "spheres". The earliest source, the *Sefer Yetzirah*, counts ten but does not name them; the names used below come from later Kabbalah and the Zohar.

  - type: mcq
    id: zohar-q
    title: "Who wrote the Zohar?"
    prompt: |
      A student says: "The Zohar's origin is settled: scholars have proved it was a forgery." Which reply is fairest?
    options:
      - text: "Most scholars attribute it mainly to Moses de León on the evidence of its language and its lack of knowledge of the Land of Israel; the traditional view credits Simeon bar Yochai, and some hold it reuses older material. The account that his widow admitted the authorship is a report of Isaac of Acre and is treated with caution."
        correct: true
        feedback: |
          Yes. 'Forgery' is a moral word for something that, in a culture where books were attributed to ancient masters, may not have felt like deception to its author; and a tradition that values the Zohar's content need not stand or fall with its date.
      - text: "It is certain that Simeon bar Yochai wrote it in the second century."
        feedback: |
          Almost no critical scholar holds this; the Aramaic and the references point to medieval Spain. It is the traditional view, held on faith in the chain of transmission.
      - text: "Nothing at all is known; every date is equally likely."
        feedback: |
          Too sceptical. The linguistic and historical evidence, including Scholem's work, narrows it to late 13th-century Spain.
    explanation: |
      Layer 1: the Zohar appeared in Spain in the late 13th century. Layer 2: de León wrote most or all of it. Layer 3: whether its teachings are an ancient revelation.

  - type: text
    id: sod
    title: "Sod: the fourth level"
    body: |
      Recall the four levels of reading, PaRDeS: *peshat* (plain), *remez* (hinted), *derash* (comparative) and *sod* (secret). Kabbalah claims the last: *sod*, the hidden meaning behind the text. In this reading, the Torah's bodily words about God, hand, face, anger, are symbols of the Sefirot and of a drama inside the divine life. So Maimonides and the Kabbalists start from the same worry and part ways: for Maimonides the figure points away from a body toward God's power and knowledge; for the Kabbalists it points to a structure in God that those who receive the tradition may contemplate.

      Gershom Scholem's *Major Trends in Jewish Mysticism* (1941) treated Kabbalah as a serious historical tradition with its own development, with chapters on the Zohar and on Isaac Luria. Scholars debate how far Kabbalah drew on older Gnostic or Platonist ideas; Kabbalists themselves do not accept that it is borrowed. Kabbalists themselves hold that it is an authentic inner side of Torah.

  - type: order
    id: sefirot-order
    title: "The Sefirot, from the top"
    prompt: |
      One common listing of the ten Sefirot goes from the highest (nearest Ein Sof) to the lowest. Put them in order, highest first. (The translations are those commonly given.)
    steps:
      - "Keter (crown)"
      - "Chokhmah (wisdom)"
      - "Binah (understanding)"
      - "Chesed (kindness)"
      - "Gevurah (discipline, strength)"
      - "Tiferet (glory, beauty)"
      - "Netzach (victory)"
      - "Hod (splendour)"
      - "Yesod (foundation)"
      - "Malkhut (kingdom)"
    hint: "The first three are the mind-like ones, then the moral ones (kindness, discipline, glory), then four that lead down to the last, which is often called the kingdom or presence in the world."
    explanation: |
      This is the commonly given order. Spellings and some translations differ (Gevurah is also called Din, judgement; Chesed is also Gedulah), and some schemes add Da'at, "knowledge", as an eleventh name or in place of Keter, while keeping the count at ten. The list is a map used in teaching, taught here according to Kabbalah.

  - type: text
    id: luria
    title: "Isaac Luria: breaking and repairing"
    body: |
      **Isaac Luria** (1534 to 1572), known as the Ari, was born in Jerusalem and lived his last years in Safed, in the Galilee, a centre of Kabbalah in the 16th century. Britannica says he reached Safed around 1570 (sources give 1569 or 1570) and studied with Moses Cordovero; he died in an epidemic in 1572. He wrote almost nothing himself; the main record of his teaching is by his disciple Hayim Vital.

      His teaching rests on three ideas. **Tzimtzum** ("contraction"): to leave a space for a world, the endless God withdrew. **Shevirat ha-kelim** ("breaking of the vessels"): the light of God, entering that space, was too strong for the vessels meant to contain it, so they shattered and scattered sparks through creation. **Tikkun** ("repair"): human actions, prayer and the commandments, gather the sparks and restore the order. On this view the world is not simply flawed or fallen: it is unfinished, and humans are partners in the repair.

  - type: mcq
    id: luria-q
    title: "A reply to the problem of evil?"
    prompt: |
      Lurianic Kabbalah answers the question why a world needing repair exists. A philosopher says: "This does not solve the problem of evil; it moves it inside God." Which reply do Lurianic readers have, according to those who defend the doctrine?
    options:
      - text: "The doctrine is not a proof but a story in which human acts matter, because repair is a task shared with God. Critics reply that it still leaves open why the vessels broke at all."
        correct: true
        feedback: |
          Yes. A defender takes the story as a way of giving meaning to suffering and effort; a critic asks for an explanation of why the breaking happened. The two disagree on what an answer to evil is for: an explanation or a way to live.
      - text: "The doctrine proves that evil does not exist."
        feedback: |
          Luria's picture takes brokenness as real. It does not deny it.
      - text: "The doctrine says humans are the cause of the whole breaking."
        feedback: |
          In the story the breaking comes before human action; human action is on the side of repair.
    explanation: |
      Compare the guided proof on the logical problem of evil: there the aim is an argument that survives objections; here the aim is a vision to live in. Both are fair uses of the word 'answer', and this lesson does not decide between them.

  - type: text
    id: spinoza
    title: "Spinoza: the break with the community"
    image:
      src: img/spinoza.webp
      alt: "Seventeenth-century painted portrait of Baruch Spinoza"
      caption: "Baruch Spinoza (1632-1677), in an anonymous 17th-century portrait, lived in the Dutch Republic, where he wrote the Ethics, published after his death."
      credit: "anonymous, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Anonymous_-_Portret_van_Baruch_de_Spinoza_-_MB01920_-_Jewish_Museum.jpg"
    body: |
      **Baruch Spinoza** (1632 to 1677) was born in Amsterdam into the Portuguese-Jewish community and died in The Hague. On 27 July 1656 the community's leaders issued a *herem* (ban, a form of excommunication) against him. It was never rescinded. The text is not a reasoned verdict that we can reconstruct here; what is established is the date and the ban.

      In 1670 he published, anonymously, the *Theological-Political Treatise*. According to Spinoza, Scripture must be studied as one studies nature: from its own text and its historical setting, with its meaning drawn from Scripture itself. He denied that Moses wrote the whole Torah and argued, following medieval remarks of Ibn Ezra, that it was compiled many generations later, likely by Ezra the Scribe. His main work, the *Ethics*, was published after his death (1677). There he identifies God with Nature (*Deus sive Natura*, "God or Nature"): God is not a creator outside the world, everything follows from God's nature by necessity, and a miracle understood as a break in nature's order is impossible; what looks like one reflects ignorance of causes.

  - type: mcq
    id: method-q
    title: "Maimonides, Spinoza and the rule of reading"
    prompt: |
      Maimonides holds that when reason has demonstrated something about God, Scripture must be read in a way that agrees with it (hence figures for God's hand). In the Treatise, Spinoza argues against this rule. According to Spinoza, what is wrong with it?
    options:
      - text: "It makes the meaning of Scripture depend on philosophy: we must first know what reason shows, and only then can we read the text. For Spinoza our knowledge of Scripture should be sought in Scripture only, in its language and history, and the truths of reason and the claims of Scripture should be kept apart."
        correct: true
        feedback: |
          Yes, in essence. Spinoza and Maimonides share the aim of a correct method; they differ on what the method may assume. The defender of Maimonides replies that any reader brings some account of what is possible to the text, and it is better to bring it openly.
      - text: "It is wrong because Maimonides did not know Hebrew."
        feedback: |
          Spinoza does not argue that. His objection is about method, not about linguistic skill.
      - text: "It is wrong because reason should never be used to interpret Scripture."
        feedback: |
          Spinoza uses reason heavily; he argues that it must not be used to decide in advance what the text may mean.
    explanation: |
      Three views of the same text: the rabbinic readers (the text is read inside a tradition of commentary), Maimonides (reason guides how the text is read), and Spinoza (the text is read as a historical document on its own terms). Each can be defended by its own best supporters.

  - type: numeric
    id: gap-q
    title: "480 years between two books"
    prompt: |
      Maimonides finished the *Guide of the Perplexed* in 1190. Spinoza published the *Theological-Political Treatise* in 1670. How many years separate them?
    answer: 480
    hint: "Subtract the earlier year from the later."
    explanation: |
      $$1670-1190=480\ \text{yr}$$
      Spinoza argued against Maimonides by name in the Treatise; the Stanford Encyclopedia and other scholars treat him as one of the medieval authors with the greatest influence on the Treatise, together with Ibn Ezra.

  - type: mcq
    id: traps-q
    title: "Three common slips"
    prompt: |
      Which of these three statements is fair to its subject?
    options:
      - text: "Maimonides's negative theology limits what we can say of God's nature, but he lists as a first principle that God exists and is the cause of all things."
        correct: true
        feedback: |
          Yes. 'Not lacking in power' is a negation, not a denial of God.
      - text: "Kabbalah is only magic and has nothing to do with the Torah."
        feedback: |
          The Zohar is built as a commentary on the Torah, and Scholem's work treats Kabbalah as a serious tradition of thought. Some later folk practices are in the popular sense magical, but that is not the core of the Zohar or Luria.
      - text: "Spinoza was proved to be an atheist; no one defended him as religious."
        feedback: |
          'According to' matters here. Critics in his own time (such as van Velthuysen) saw atheism; others have called his view pantheism, because he writes of God as Nature; Goethe and Herder rejected the atheism reading; and the Treatise was banned in Holland in 1674. The label depends on what one means by 'God'.
    explanation: |
      Each trap takes one sentence and stretches it into a verdict. The cure is the course's habit: ask who says it, and in which sense of the word.

  - type: mcq
    id: layers-q
    title: "Fact, debate or faith?"
    prompt: |
      Which assignment is correct? (1) Spinoza's community issued a herem against him on 27 July 1656. (2) Moses de León wrote most of the Zohar. (3) The Torah's hidden level (*sod*) shows the true structure of God.
    options:
      - text: "(1) established fact, (2) scholarly consensus with dissenters, (3) faith commitment"
        correct: true
        feedback: |
          Yes. The ban is documented; the authorship has a strong majority view but traditional dissent; the claim about God's structure is a commitment a historian cannot test.
      - text: "(1) faith, (2) established fact, (3) live debate"
        feedback: |
          Reversed. A dated ban is not a matter of faith, and the Zohar's authorship is not simply 'fact', since some hold it preserves older material.
      - text: "All three are established fact."
        feedback: |
          A document's existence is fact; whether its teaching is true is another layer.
    explanation: |
      Notice that the same thinker can work in several layers: Spinoza's dates are fact, his reading of the Bible is argued scholarship, and his God is a metaphysical commitment.

  - type: text
    id: summary
    body: |
      **Where thoughtful people part ways.** On the text: read it as a tradition does, as Maimonides does through reason, as the Kabbalists do through a hidden level, or as Spinoza does as a human, historical document. The premises that differ are what revelation is, how much reason may shape interpretation, and whether the text hides a deeper structure. The lesson does not decide between them.

      **Next:** modern Judaism. The Holocaust, the rise of Zionism and the state of Israel, and the movements (Orthodox, Conservative, Reform and secular) that answered modernity in different ways.
