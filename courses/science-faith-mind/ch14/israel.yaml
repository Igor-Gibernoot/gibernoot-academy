id: ch14-israel
title: "Ancient Israel and Its Neighbours"
kind: concept
own: |
  The setting: **Canaan** is the land between Egypt (to the south-west) and Mesopotamia (to the east) where the Hebrew texts arose, and everything below is taught according to someone: a scribe, an excavator, a tradition or a school of historians. Evidence is a written or material trace (a tablet, a stone, a jar); a claim is **attested** when such a trace for it survives, and "not attested" is not "did not exist".
  - **The wider world.** According to Assyriologists, Mesopotamia left flood stories (the Atrahasis epic, then the flood tablet of the Gilgamesh epic) and law collections (the stele of Hammurabi), and Egypt left wisdom writing (the Instruction of Amenemope). Parallels with the Hebrew texts show a shared {{ cultural world }}; what they imply about borrowing and direction is debated.
  - **Ugarit.** According to the tablets of Ugarit, a Canaanite city on the Syrian coast (texts mostly c. 1350-1185 BCE), the gods include El, head of the pantheon, his consort Athirat (Hebrew Asherah), and the storm god Baal, who contends with Yam (Sea) and Mot (Death). The language is Northwest Semitic, close to {{ Hebrew }}.
  - **The Merneptah Stele.** According to this Egyptian victory stone (c. 1208 BCE, from the reign of Merneptah, 1213-1203 BCE), a group called Israel, marked as a people and not as a city, was in Canaan. It is the earliest mention of Israel outside the Bible; it says nothing of Israel's religion, king or origin.
  - **Three stances on gods.** Each answers what is claimed about other gods:
  $$\begin{gathered}\text{henotheism: many gods, all worshipped}\\ \text{monolatry: many gods, one worshipped}\\ \text{monotheism: only one God exists}\end{gathered}$$
  - **Two scholarly readings.** According to Kaufmann, monotheism began with {{ Moses }} as a new beginning with no pagan roots; according to Mark S. Smith, Yahweh began among other gods, in a setting shared with Canaanite religion, and monolatry came before monotheism. Inscriptions such as those of Kuntillet Ajrud (c. 800 BCE; Yahweh with "his Asherah", goddess or cult symbol) are read both ways.
  - **Tradition and history.** According to Jewish tradition, God gave the Torah to Moses at Sinai and Israel entered a covenant (a binding agreement) to serve God alone, and the Shema (Deuteronomy 6:4) says {{ the LORD is one }}. Historians study when the texts were written and how the belief grew; that Sinai was a divine act is a faith commitment that history neither confirms nor refutes.
  - **Three layers.** Established: the tablets, the stele and the inscriptions exist and say what they say. Live debate: when Israelite monotheism arose. Commitment: that the Torah is divine revelation.

cards:
  - type: mcq
    id: hook
    title: "Guess: a clay tablet, a stone and a scroll"
    prompt: |
      Guessing is the point; no background is needed. A museum case from one region holds three objects: a clay tablet, a letter from a local king to a pharaoh; a carved stone slab (a stela) put up by a pharaoh to boast of a victory; and a scroll of religious stories copied by scribes long after the events it tells. A historian wants to know what the ordinary people of that region believed. Which question should she ask of each object before using it?
    options:
      - text: "Who made it, when, for whom, and what did the maker want to achieve?"
        correct: true
        feedback: |
          Yes. A letter asks for help, a victory stone boasts, a scroll preserves what a community wanted to hand on. Each is evidence, but of different things, and none is a neutral photograph of what everyone believed.
      - text: "Is it old? The oldest object is always the most truthful."
        feedback: |
          Age helps with dating, but an old text can still boast or flatter. A victory stone is early evidence of what a pharaoh wished to say, not proof of everything it claims.
      - text: "Is it religious? Only religious texts say what people believed."
        feedback: |
          Letters and royal stones also reveal beliefs, such as which gods are invoked and who is thought to be at war with whom. Non-religious documents are often the best check on religious ones.
    explanation: |
      This lesson meets all three kinds of object: clay tablets from Canaanite kings and from a lost city on the Syrian coast, an Egyptian stela that names Israel, and, later in the level, scrolls. The habit of asking who made it and why is the first tool.

  - type: text
    id: map
    title: "Canaan, between two great powers"
    body: |
      Picture the Near East in the late second millennium BCE (roughly 1500 to 1000 BCE). Egypt lies to the south-west along the Nile. Mesopotamia, the land between the Tigris and Euphrates rivers, lies to the east. Between them, along the eastern shore of the Mediterranean, lies **Canaan**, a land of small city-states with their own kings. Trade routes and armies crossed it in both directions.

      The best picture of this world comes from the **Amarna letters**, about 380 clay tablets found from 1887 at Tell el-Amarna in Egypt, the site of the pharaoh Akhenaten's capital. Most are diplomatic letters of the mid-14th century BCE, written in cuneiform (wedge-shaped signs pressed into clay) in Akkadian, the shared diplomatic language of the time. Among them are letters from city rulers in Canaan to the pharaoh, such as Abdi-Heba of Jerusalem and Rib-Hadda of Byblos, who ask for troops and protest at neighbours. These Canaanite rulers wrote in a form of Akkadian that follows Canaanite grammar.

      Notice what is not here: these letters never mention Israel. They show a Canaan of rival city kings under Egyptian influence, some two centuries before the first appearance of Israel in the evidence below.

  - type: mcq
    id: amarna-q
    title: "Why would a Canaanite king write in Akkadian?"
    prompt: |
      A king of a Canaanite city in the 14th century BCE, whose own people speak a Canaanite language, writes to the pharaoh of Egypt on a clay tablet in Akkadian. What does this most plausibly show, according to historians of the Amarna letters?
    options:
      - text: "That Akkadian was the shared diplomatic and scribal language of the Late Bronze Age, so rulers of different lands could write to one another through trained scribes."
        correct: true
        feedback: |
          Yes. Akkadian played the role that a common language plays between governments today. Egypt itself kept scribes who could read it, and Canaanite scribes bent its grammar towards their own speech.
      - text: "That Canaanites had no writing of their own and spoke Akkadian at home."
        feedback: |
          The letters show a mixed scribal form shaped by Canaanite speech, so the writers' native language was something else. The tablets also show how far the choice of writing system and the choice of home language can differ.
      - text: "That Egypt had conquered Mesopotamia and imposed Akkadian on its subjects."
        feedback: |
          Egypt did not rule Mesopotamia. Great kings of Babylonia, Assyria, Mitanni and Hatti also wrote to Egypt in Akkadian as equals, which is why it is called a shared, not an imposed, language.
    explanation: |
      A tablet is evidence about the writer's world as well as its message. Here the medium (clay, wedges, Akkadian) shows a Canaan woven into an international network, the setting in which every later Hebrew text has to be placed.

  - type: text
    id: parallels
    title: "Same world, different story"
    body: |
      Beyond Canaan, Mesopotamia and Egypt left writings that scholars set beside the Hebrew texts. Three examples, each taught according to the historians who study it.

      **A flood.** The Atrahasis epic, known from clay tablets of the 17th century BCE, tells how the gods, disturbed by human noise, send a flood, and how the god Enki warns the hero Atrahasis, who survives in a boat. A later version of the same story, with the hero renamed Utnapishtim, forms Tablet XI of the Gilgamesh epic. Most scholars hold that the Gilgamesh account reworked an older one. Genesis tells of a flood and a man warned to build a boat; many scholars see a shared tradition, and note that Genesis has one God acting alone, where the Mesopotamian gods quarrel and fear.

      **A law code.** A basalt stele of Hammurabi, king of Babylon (reigned 1792 to 1750 BCE according to the Louvre), carries about 280 laws in Akkadian under a relief of the king before the sun god Shamash. It was found at Susa in 1901-1902. Collections of law in the Torah share some case-law forms with such codes, and differ in setting: in the Torah the law is presented as given by God to a people.

      **A wisdom book.** The Egyptian Instruction of Amenemope, a book of advice in thirty chapters, was probably written in the Ramesside period (about 1300 to 1075 BCE). In 1924 the scholar Adolf Erman noted that passages of the Book of Proverbs (mostly 22:17 to 23:11) correspond to it. Most scholars have held that Proverbs borrowed from Egypt, but some doubt the link is proved.

  - type: mcq
    id: parallels-q
    title: "What can a parallel show?"
    prompt: |
      According to historians, the Gilgamesh flood tablet reworks the older Atrahasis epic, and Genesis tells of a flood that shares features with both. Which conclusion is best supported by the existence of such a parallel alone?
    options:
      - text: "The Hebrew writers lived in a world where flood stories were already told; how far one text copied another, and in which direction, needs further arguments."
        correct: true
        feedback: |
          Yes. A parallel shows a shared setting. Direction and dependence come from dates, wording and detail, which is why the Amenemope case is still debated after a century.
      - text: "Genesis is therefore a copy of the Mesopotamian story and has nothing of its own to say."
        feedback: |
          Similar plots do not make identical meanings. Scholars who stress dependence still note that Genesis tells it with one God and a different moral setting. Copying also could not decide whether a text is true or sacred: that is a question of a different kind.
      - text: "The parallels prove that no flood story is related to any event, because stories always invent their floods."
        feedback: |
          Whether a real flood stands behind these stories is a separate question, argued with geology and archaeology, not settled by comparing texts. The parallel by itself is silent on it.
      - text: "The parallels show that the Hebrew writers never knew any other tradition."
        feedback: |
          The reverse: the parallel is evidence that they knew some. Believers can hold that the Torah is revealed and still accept that its human setting was this shared world, while others read the parallels as showing purely human origins. The parallels themselves do not decide between those readings.
    explanation: |
      The layers separate here: that the parallel texts exist is established; how Genesis relates to them is a live debate; whether the Torah is also revelation is a commitment that the comparison neither supports nor removes.

  - type: text
    id: ugarit
    title: "Ugarit: the gods of a Canaanite city"
    image:
      src: img/ugarit-tablet.webp
      alt: "A clay tablet with small wedge-shaped signs, held in the Louvre, from the lower town of Ugarit"
      caption: "A 13th-century BCE administrative tablet in Ugaritic from a house in Ugarit, now in the Louvre; it is an everyday record, about people from Cyprus who came to collect food."
      credit: "Zunkir, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Tablette_administrative_Ugarit_AO19967.jpg"
    body: |
      In 1928 a farmer ploughing a field on the Syrian coast broke open an old tomb, and French excavations under Claude Schaeffer began there in 1929. They uncovered **Ugarit**, a Canaanite coastal city that was destroyed around 1190 BCE, probably during the wider collapse of the Late Bronze Age. Its libraries held clay tablets in a language nobody had read before, now called Ugaritic: a Northwest Semitic language, a relative of Hebrew, written in an alphabet of 30 cuneiform signs. Most of the texts date to about 1350 to 1185 BCE.

      Among them are myths. According to these texts, **El** is the head of the pantheon (the group of gods); **Athirat**, a goddess whose name matches the Hebrew *Asherah*, is his consort; and **Baal**, also called Hadad, a storm god, wins kingship by struggles against Yam (Sea) and Mot (Death) under El's rule. In the Hebrew texts El is also a word for God and Baal is the name of a rival god, so scholars ask how these Canaanite figures and the God of Israel relate.

  - type: mcq
    id: ugarit-q
    title: "What does Ugarit show about Israel's neighbours?"
    prompt: |
      Ugaritic tablets from c. 1350 to 1185 BCE describe a pantheon headed by El, with his consort Athirat and the storm god Baal. A historian says: "This shows the religious world that surrounded early Israel." Which part of her claim is on firmest ground?
    options:
      - text: "That the Canaanite culture of the region had a pantheon with El, Athirat and Baal, since the tablets themselves say so."
        correct: true
        feedback: |
          Yes. This is what the tablets attest, about one city in one period. Whether Israelites worshipped the same gods, borrowed their names or rejected them is a further question needing Israelite evidence.
      - text: "That the Israelites worshipped El, Athirat and Baal exactly as Ugarit did."
        feedback: |
          Ugarit is a Canaanite city on the Syrian coast, and its tablets say nothing directly about Israelites. Showing that a language and a pantheon existed nearby is not showing that a neighbouring people shared them.
      - text: "That the Hebrew Bible must have been copied from the Ugaritic myths."
        feedback: |
          Similarity of words and themes can show a shared poetic and religious background without any copying, and showing direct dependence would need arguments about dates and wording.
    explanation: |
      Ugarit is a window into the Canaanite world, not into Israel. Its value is that it lets historians read Hebrew words, such as El and Asherah, against an independent background.

  - type: mcq
    id: attested-q
    title: "What does 'attested' mean?"
    prompt: |
      Historians say a god, a text or a people is **attested** when evidence for it survives (a tablet, an inscription, a manuscript, a building). Which statement uses the word correctly and draws only what the evidence allows?
    options:
      - text: "Baal is attested at Ugarit in the 13th century BCE. That does not tell us whether another people, such as Israel, honoured him at that time."
        correct: true
        feedback: |
          Yes. Attestation is tied to a place, a time and a kind of source. A god attested in one city is not thereby attested elsewhere.
      - text: "A god not attested in any surviving text never existed in anyone's worship."
        feedback: |
          Absence of surviving evidence is a limit of the evidence: most writing was lost, much was never written, and the digs cover a small part of the ground. Silence can support a doubt, but it does not prove a negative. This is also true of events and people.
      - text: "A text is attested when a later believer quotes it, even if no copy from its own time has been found."
        feedback: |
          A later quotation attests that the text existed by then, not at its supposed origin. That distinction matters for the Hebrew Bible, whose oldest surviving copies are far later than the events they describe.
    explanation: |
      The word keeps three questions apart: whether something existed, whether we have a trace of it, and where and when the trace comes from. Later lessons use it for the exodus, for David and for the texts themselves.

  - type: text
    id: merneptah
    title: "The earliest Israel in the evidence"
    image:
      src: img/merneptah-stele.webp
      alt: "Black granite stele of Merneptah, covered in rows of hieroglyphs, in the Egyptian Museum in Cairo"
      caption: "The Merneptah Stele, in black granite, was set up in Thebes in the fifth year of the pharaoh Merneptah (c. 1208 BCE); the name Israel occurs in its boast of conquests in Canaan."
      credit: "Unknown, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Overwinningsstela_van_Merneptah,_GDE001373.jpg"
    body: |
      In 1896 the archaeologist Flinders Petrie found at Thebes a black granite stele of the pharaoh **Merneptah** (reigned 1213 to 1203 BCE). It now stands in the Egyptian Museum in Cairo. Most of it celebrates a victory over invaders from Libya, and it also boasts of conquests in Canaan. Among the defeated they list Ashkelon, Gezer, Yanoam and **Israel**, and say, in essence, that Israel is laid waste and its grain is no more. Petrie and his colleague Wilhelm Spiegelberg were the first to read the name.

      Two details matter. The signs that follow the other names mark them as cities, while the sign after Israel marks a **people**. And the stele is dated to about 1208 BCE. According to most historians this is the earliest mention of Israel in any surviving text, and it is Egyptian, not Israelite.

  - type: mcq
    id: merneptah-q
    title: "What does the stele show, and what not?"
    prompt: |
      A stele of the pharaoh Merneptah, c. 1208 BCE, names Israel among peoples and cities he claims to have defeated in Canaan, and marks Israel as a people, not a city. Which conclusion goes no further than this evidence?
    options:
      - text: "By about 1208 BCE Egyptian scribes knew a group called Israel living in Canaan; nothing in the stele states its size, its government or its religion."
        correct: true
        feedback: |
          Yes. A bounded claim: a name, a place, a rough date, and the Egyptian point of view. Some scholars add that Israel was already a notable group; others stress that one line cannot say how organised it was.
      - text: "The stele proves the exodus from Egypt happened as the Torah tells it."
        feedback: |
          The stele does not mention Moses, slavery, Egypt as a place of escape or any departure. It shows people called Israel in Canaan; how they got there, by exodus, by gradual settlement or in some other way, is argued from other evidence (a later lesson).
      - text: "The stele shows that Israel already worshipped one God, Yahweh, alone."
        feedback: |
          The stele names no god of Israel. The name Israel itself ends in El, the name or title of a god known at Ugarit, but historians read that as a clue, not a proof of what the group worshipped.
      - text: "Since the pharaoh boasts, the entire line is invented and Israel did not exist."
        feedback: |
          Boasting is a reason to doubt the claim of victory, not the existence of the named people. A boast names real opponents to impress its audience, so the name is at least evidence that Egyptians knew of such a group.
    explanation: |
      One short line gives a name, a place and a date, and nothing about belief. Everything the lesson now says about Israel's religion has to come from other evidence.

  - type: text
    id: kuntillet
    title: "Inscriptions from the desert"
    body: |
      Beyond tablets and stelae, small written traces come from Israelite and Judahite sites themselves. At **Kuntillet Ajrud**, a desert site in the northeastern Sinai occupied in the early eighth century BCE (around 801 to 770 BCE, according to the excavators), inscriptions on large storage jars invoke blessings in the name of Yahweh together with a word read as *his Asherah*. One jar also carries a drawing of two figures, and the inscriptions may be unrelated to the drawing.

      Scholars read the words in two ways. According to some, *Asherah* here means a goddess, Yahweh's consort, as Athirat was El's at Ugarit. According to others, it names a cult object, a sacred pole or tree that stood for the goddess and had been absorbed into Yahweh's worship; they point out that the word carries *his*, which would be odd for a personal name. The Hebrew Bible itself condemns asherah poles, and inscriptions at Khirbet el-Qom are read in a similar way. The two readings work with the same evidence, and the choice rests on how one reads one Hebrew word.

  - type: mcq
    id: kuntillet-q
    title: "Two readings of one word"
    prompt: |
      Jar inscriptions from c. 800 BCE at Kuntillet Ajrud bless people by Yahweh and by *his Asherah*. One scholar reads Asherah as a goddess who is Yahweh's consort; another reads it as a cult symbol linked to Yahweh's worship. What does it say about the evidence that both readings are held?
    options:
      - text: "A short text with an ambiguous word can fit more than one story, so it should be held as probable or doubtful, not as proof, until further evidence narrows it."
        correct: true
        feedback: |
          Yes. Good history says what the inscription says (it names Yahweh and a word read as his Asherah), then marks the interpretation as a debate. Popular headlines claiming proof that God had a wife go beyond the evidence, just as a flat denial would go beyond it in the other direction.
      - text: "Neither reading can be right, since the Hebrew Bible condemns asherah poles."
        feedback: |
          The Bible's condemnation is itself evidence that asherah poles existed and were used, and a later text's opinion does not decide what an eighth-century inscription meant. Both readings stay open.
      - text: "The scholars who disagree must lack training, because a real expert would know the answer."
        feedback: |
          Experts disagree here because the evidence is thin, not because anyone lacks skill. Disagreement among well-trained people is how a real open question looks from outside.
    explanation: |
      The same inscription supports a gradual-development story, in which Yahweh once stood beside other deities, and is also read by others as a cult symbol, which fits a different story. The next cards turn to the larger debate that this evidence feeds.

  - type: text
    id: terms
    title: "One God, or one God to worship?"
    body: |
      Three words, as historians of religion use them, mark different claims about other gods:

      - **Henotheism**: many gods exist, and the worship of each people's god is valid.
      - **Monolatry**: many gods exist, but a people should worship only one of them.
      - **Monotheism**: only one God exists; other gods are not gods at all.

      How and when ancient Israel moved between them is argued by scholars. **Yehezkel Kaufmann** (author of *The Religion of Israel*, whose English abridgement appeared in 1960) held that Israelite monotheism began with Moses as a new beginning, with no roots in pagan religion and no slow evolution from it. **Mark S. Smith** (*The Early History of God*, first published in 1990 and revised in 2002) argues the other way: according to him, Yahweh first appeared among other gods, Israelite religion grew partly out of Canaanite religion (El, Asherah and Baal traits merging into Yahweh), and monolatry came before true monotheism. His critics, such as Richard Hess, doubt that the evidence supports a development from many gods to one.

      Both agree that some texts speak with full monotheism. Many scholars date the part of Isaiah in chapters 40 to 55 to the exile in Babylon (sixth century BCE), where God declares, in the JPS 1917 translation, "I am the LORD, and there is none else" (Isaiah 45:5). The debate is about how early the idea arose.

  - type: order
    id: terms-order
    title: "Order the stances by how much they deny"
    prompt: |
      Order three stances about gods from the one that denies the least about other gods to the one that denies the most: monolatry (many gods exist, but only one is to be worshipped), henotheism (many gods exist, and each people's god may be worshipped), monotheism (only one God exists).
    steps:
      - "Henotheism: other gods exist and worshipping them is valid."
      - "Monolatry: other gods exist, but worshipping them is forbidden."
      - "Monotheism: other gods do not exist."
    hint: "Ask first whether other gods may be worshipped, then whether they exist at all."
    explanation: |
      Henotheism denies nothing about other gods; monolatry denies the right to worship them; monotheism denies that they exist. A people can be monolatrous for centuries before anyone writes that the other gods are nothing, which is why the words are kept apart.

  - type: mcq
    id: texts-q
    title: "How do the texts speak of other gods?"
    prompt: |
      The Ten Commandments, in the JPS 1917 translation, say "Thou shalt have no other gods before Me" (Exodus 20:3). Isaiah 45:5 says "there is none else". The Shema says "the LORD our God, the LORD is one" (Deuteronomy 6:4). Which statement is most careful about what each wording shows by itself?
    options:
      - text: "The commandment forbids worshipping other gods and some scholars read it as taking their existence for granted (monolatry), the Isaiah verse denies that any other God exists (monotheism), and the Shema is read by medieval Jewish commentators such as Rashi as a statement of monotheism."
        correct: true
        feedback: |
          Yes. Each wording is open to more than one reading, and the readers differ in their premises: a tradition that takes the Torah as one revealed whole reads the earlier texts in the light of the later ones, while a historian reads each text in its own period.
      - text: "All three verses say exactly the same thing, so any difference between them is only a matter of translation."
        feedback: |
          The Hebrew wordings differ, and so do the periods they come from, according to historians. That is why the question of development arises at all.
      - text: "Only the Isaiah verse is about gods; the commandment and the Shema are about law and are not relevant."
        feedback: |
          The commandment is directly about which gods may be worshipped, and the Shema is about the oneness of Israel's God. All three bear on the question, in different ways.
    explanation: |
      A single verse rarely settles the question: the same words support a monolatry reading and a monotheism reading depending on what a reader assumes, which is why the scholarly debate continues.

  - type: text
    id: tradition
    title: "The tradition's own account"
    body: |
      Jewish tradition tells the story differently, and it is described here as its adherents hold it. According to the Torah, God brought Israel out of Egypt under Moses, spoke to them at Mount Sinai and gave them the Torah, and Israel entered a **covenant** (a binding agreement between God and a people) to serve God alone (Exodus 19 to 24). On this account the oneness of God is the founding fact of Israel's religion from Sinai, and later lapses into worshipping other gods, which the prophets condemn, are departures from a standard already given. Kaufmann was himself a secular scholar and argued from the texts, but some religious readers found his picture congenial because it fits this outline.

      Historians study the same texts differently: when were they written, by whom, and from what earlier material? Those questions, and the archaeology of the exodus, each have a later lesson. For now, note three things that this lesson keeps apart. That the tablets, the stele and the inscriptions exist and say what they say is **established**. When Israel's monotheism arose is a **live scholarly debate**. That the Torah was given by God at Sinai is a **commitment of faith**, which history cannot confirm and cannot refute.

  - type: mcq
    id: rival-q
    title: "The same evidence, two readings"
    prompt: |
      A historian points to the Kuntillet Ajrud inscriptions and to the prophets' attacks on rival cults as evidence that many Israelites worshipped other gods or gods beside Yahweh, and so that monotheism grew slowly. Which reply could someone who holds an early-monotheism view give, without denying that the inscriptions exist?
    options:
      - text: "That such practices were departures from a commitment already in place, which is why prophets attacked them, and that the inscriptions are ambiguous about what they mean."
        correct: true
        feedback: |
          Yes. The reply accepts the evidence and reads it inside a different story, one in which the prophets are correcting a lapse. The gradual-development reader answers that the prophets' complaints are also what one would expect if the commitment was still being formed. Both stories fit the same facts, which is why further tests (dating of texts, other inscriptions) matter.
      - text: "That inscriptions found in the desert have no connection with Israel."
        feedback: |
          They are written in Hebrew and name Yahweh, so a link to Israel and Judah is widely accepted. Denying the link would need an argument, not a wave of the hand.
      - text: "That evidence about what people did cannot say anything about what a religion taught."
        feedback: |
          If that were so, no history of religion would be possible. Practice and teaching can differ, and scholars compare them, but each is evidence about the religion.
    explanation: |
      A good rival-view card is one in which both sides keep the evidence and differ over what it means. Here the disagreement is about whether a practice shows what the religion was or what it was struggling against.

  - type: mcq
    id: layers
    title: "Sort the claims into layers"
    prompt: |
      Which pair correctly labels one claim as a live scholarly debate and one as a faith commitment?
    options:
      - text: "Debate: whether monotheism in Israel began with Moses or developed over centuries. Commitment: that God gave the Torah to Moses at Sinai."
        correct: true
        feedback: |
          Yes. Historians argue the first with texts and inscriptions, and could in principle change their minds. The second is held within the tradition as revelation, and no inscription can settle it either way.
      - text: "Debate: that a stele names Israel. Commitment: that tablets were found at Ugarit."
        feedback: |
          Both are matters of evidence that anyone can inspect, and both are established. The stele reads as it reads and the tablets exist; the debate begins when one asks what they mean for Israel's religion.
      - text: "Debate: that God gave the Torah at Sinai. Commitment: that Merneptah reigned from 1213 to 1203 BCE."
        feedback: |
          The assignments are swapped: the reign dates are historical estimates, with a small margin among sources, and the Sinai claim is a commitment that belongs to faith.
    explanation: |
      The lesson's whole method is the sorting of layers: what survives, what is argued about, and what is held by faith.

  - type: mcq
    id: trap-always
    title: "Trap: 'Israel was always monotheist'"
    prompt: |
      A classmate says: "Ancient Israel was monotheist from the start, so inscriptions that name other gods or a goddess beside Yahweh cannot be Israelite." What is wrong with her argument?
    options:
      - text: "It assumes the answer to the debated question, and rules out evidence because of it, instead of testing the claim against the evidence."
        correct: true
        feedback: |
          Yes. A defender of early monotheism can read the inscriptions in another way, but cannot declare in advance that no evidence could count against the view. A claim that survives only by excluding evidence is held as a commitment, not argued as history.
      - text: "It is wrong because every historian agrees that Israel was polytheist until the exile."
        feedback: |
          No such agreement exists. Kaufmann argued for early monotheism, and scholars such as Smith for a gradual development; the second view is common in the field, but it is one side of a continuing debate, and its own critics exist.
      - text: "It is wrong because monotheism cannot be defined."
        feedback: |
          It can: only one God exists. The three terms of the lesson are clear enough to make the debate precise, which is why the debate is a real one and not a quarrel over words.
    explanation: |
      The mistake mirrors its opposite, 'Israel was always polytheist', which also settles by assumption what the evidence is meant to test. Either side is entitled to its view and owes an account of the evidence.

  - type: mcq
    id: trap-silence
    title: "Trap: what do silence and similarity prove?"
    prompt: |
      Which of these inferences are mistakes? Select all that apply.
    multiple: true
    options:
      - text: "The Amarna letters never mention Israel, so there was no such people anywhere in the region."
        correct: true
        feedback: |
          Silence in one archive of the 14th century BCE says little: the letters come from city kings writing to Egypt, and the Merneptah Stele, about a century and a half later, does name Israel. Absence of evidence is a limit, not a proof.
      - text: "A flood story from Mesopotamia resembles Genesis, so Genesis must be a plain copy with no message of its own."
        correct: true
        feedback: |
          Shared plot shows a shared world; what a text does with the plot is a separate matter, and Genesis has one God acting alone where the Mesopotamian gods quarrel.
      - text: "El is a god at Ugarit and El is a Hebrew word for God, so the Israelites simply took over Canaanite religion unchanged."
        correct: true
        feedback: |
          Shared words and figures suggest a shared background, which Smith develops; they do not show that nothing changed. Even he thinks Israelite religion transformed its inheritance.
      - text: "The Merneptah Stele names Israel in Canaan, so by about 1208 BCE a group with that name was known to the Egyptians."
        feedback: |
          This is the careful reading of the stele, a bounded claim from a source with a point of view.
    explanation: |
      Three mistakes in this card are the main traps of the lesson: silence read as proof of absence, resemblance read as simple copying, and a shared word read as identity. The fourth statement is the cautious use of evidence.

