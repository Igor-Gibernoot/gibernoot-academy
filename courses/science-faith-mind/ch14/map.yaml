outroTitle: Level 14 in one picture
outro: |
  Outside evidence places Israel among its neighbours, and the Hebrew Bible is a collection of 24 books copied for centuries. The Documentary Hypothesis reads the Torah as woven from sources, archaeology sorts its stories into attested, debated and silent, the Dead Sea Scrolls and textual criticism show how the text itself moved, and Genesis stands beside Mesopotamian neighbours. The rabbis made the text a living argument, Maimonides, the Kabbalists and Spinoza read it as figure, code and human book, and the Holocaust forced new answers about God and the covenant. What stays open is the third layer: whether the Torah is revealed, and what the covenant means.
