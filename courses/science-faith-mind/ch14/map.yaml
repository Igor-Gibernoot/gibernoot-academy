id: ch14-map
title: "Content Map: Judaism and the Torah"
kind: map
name: Level 14, Judaism and the Torah (Israel among its neighbours, how the Hebrew Bible was made, the Documentary Hypothesis, archaeology of the stories, the Dead Sea Scrolls, textual criticism, Genesis and Mesopotamia, rabbinic Judaism, Jewish thought, Judaism after the Holocaust, the three layers)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 14 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a date moved, a school given the wrong claim, a scholar's position reversed, a layer mislabelled), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: israel
    title: Israel among its neighbours
    row: 1
    col: 1
    body: |
      The Merneptah Stele (reign of Merneptah 1213 to 1203 BCE, stele about 1208 BCE) is the earliest known mention of Israel, written with the sign for a **people** and not the sign for a city. Ugarit's texts (about 1350 to 1185 BCE) show Canaanite gods such as El and Baal. **Monolatry** means worshipping one god while granting that others exist; **monotheism** denies that others exist. According to Kaufmann, Moses began something new; according to Mark S. Smith, Israel's monotheism emerged gradually.
    decoys:
      - body: |
          The Merneptah Stele (reign of Merneptah 1213 to 1203 BCE, stele about 1208 BCE) is the earliest known mention of Israel, written with the sign for a **city** and not the sign for a people. Ugarit's texts (about 1350 to 1185 BCE) show Canaanite gods such as El and Baal. **Monolatry** means worshipping one god while granting that others exist; **monotheism** denies that others exist. According to Kaufmann, Moses began something new; according to Mark S. Smith, Israel's monotheism emerged gradually.
        feedback: |
          On the stele, Ashkelon, Gezer and Yanoam carry the sign for a city, while Israel carries the sign for a people. That is why it is read as a group, not a town.
      - body: |
          The Merneptah Stele (reign of Merneptah 1213 to 1203 BCE, stele about 1208 BCE) is the earliest known mention of Israel, written with the sign for a **people** and not the sign for a city. Ugarit's texts (about 1350 to 1185 BCE) show Canaanite gods such as El and Baal. **Monolatry** means denying that other gods exist; **monotheism** means worshipping one god while granting that others exist. According to Kaufmann, Moses began something new; according to Mark S. Smith, Israel's monotheism emerged gradually.
        feedback: |
          The two terms are swapped. Monolatry is exclusive worship of one god without denying the others; monotheism is the claim that there is only one god.
    explanation: |
      The root of the level: before reading the Torah, ask where Israel appears in the evidence outside the Bible and how its worship of one god is best described.

  - id: writing
    title: How the Hebrew Bible was made
    row: 1
    col: 2
    body: |
      The **Tanakh** (Torah, Nevi'im, Ketuvim) counts **24 books**; Josephus counted 22. Writing began on small objects such as the Gezer calendar (about the 10th century BCE), and oral tradition may have fed written texts. The Great Isaiah Scroll (about 125 BCE) and the Leningrad Codex (1008 CE) are about
      $$125+1008-1=1132\ \text{years apart}$$
      with no year 0 between 1 BCE and 1 CE.
    decoys:
      - body: |
          The **Tanakh** (Torah, Nevi'im, Ketuvim) counts **39 books**; Josephus counted 22. Writing began on small objects such as the Gezer calendar (about the 10th century BCE), and oral tradition may have fed written texts. The Great Isaiah Scroll (about 125 BCE) and the Leningrad Codex (1008 CE) are about
          $$125+1008-1=1132\ \text{years apart}$$
          with no year 0 between 1 BCE and 1 CE.
        feedback: |
          The number 39 belongs to the Christian Old Testament, which splits several books the Tanakh counts as one (such as the Twelve Prophets). The Tanakh counts 24.
      - body: |
          The **Tanakh** (Torah, Nevi'im, Ketuvim) counts **24 books**; Josephus counted 22. Writing began on small objects such as the Gezer calendar (about the 10th century BCE), and oral tradition may have fed written texts. The Great Isaiah Scroll (about 125 BCE) and the Leningrad Codex (1008 CE) are about
          $$1008-125=883\ \text{years apart}$$
          as if both dates were on the same side of the year 1.
        feedback: |
          A BCE date counts backwards from year 1, so the two spans add: 125 years before and 1008 years after, minus the missing year 0, gives 1132.
    explanation: |
      The base of the text: a collection of 24 books, copied for centuries, and the oldest complete Hebrew copies are far later than the scroll that reaches back before the common era.

  - id: torah
    title: The Documentary Hypothesis
    row: 1
    col: 3
    body: |
      Wellhausen (1878, 1883) arranged four sources in the order **J, E, D, P**: J about the 10th century BCE, E the 9th, D the 7th (linked to Josiah, c.640 to 609 BCE, and de Wette's 1805 argument), P exilic or later. Evidence includes doublets such as the two flood counts (14 clean animals in Gen 7:2, two in Gen 6:19-20). Kaufmann dates P before the exile; later scholars question the model itself.
    decoys:
      - body: |
          Wellhausen (1878, 1883) arranged four sources in the order **D, J, E, P**: D about the 10th century BCE, J the 9th, E the 7th (linked to Josiah, c.640 to 609 BCE, and de Wette's 1805 argument), P exilic or later. Evidence includes doublets such as the two flood counts (14 clean animals in Gen 7:2, two in Gen 6:19-20). Kaufmann dates P before the exile; later scholars question the model itself.
        feedback: |
          The letters are scrambled. Deuteronomy (D) is tied to Josiah's reform, the 7th century; J and E are the earlier sources.
      - body: |
          Wellhausen (1878, 1883) arranged four sources in the order **J, E, D, P**: J about the 10th century BCE, E the 9th, D the 7th (linked to Josiah, c.640 to 609 BCE, and de Wette's 1805 argument), P exilic or later. Evidence includes doublets such as the two flood counts (14 clean animals in Gen 7:2, two in Gen 6:19-20). Kaufmann dates P after the exile, and the model is now accepted by all scholars.
        feedback: |
          Kaufmann argued the opposite, that P is older, before the exile. And the model is not accepted by all: supplementary and fragmentary models compete with it, and many still keep D and P.
    explanation: |
      A hypothesis about how the Torah was composed, built from textual clues, with dates that are debated and rivals that remain.

  - id: archaeology
    title: What archaeology says
    row: 2
    col: 1
    body: |
      Sort claims as **attested** (outside evidence, such as the Tel Dan stele, 9th century BCE), **debated** (such as Jericho: Garstang dated its fall to about 1400 BCE, Kenyon to about 1550 BCE) or **silent** (no trace found). The 603,550 men of Numbers 1:46 with families imply about
      $$603{,}550\times4\approx2.41\ \text{million people}$$
      a figure close to the 2 to 2.5 million that the Egyptologist Redford estimated, and Dever argues the Sinai could not have fed so many.
    decoys:
      - body: |
          Sort claims as **attested** (outside evidence, such as the Tel Dan stele, 9th century BCE), **debated** (such as Jericho: Garstang dated its fall to about 1550 BCE, Kenyon to about 1400 BCE) or **silent** (no trace found). The 603,550 men of Numbers 1:46 with families imply about
          $$603{,}550\times4\approx2.41\ \text{million people}$$
          a figure close to the 2 to 2.5 million that the Egyptologist Redford estimated, and Dever argues the Sinai could not have fed so many.
        feedback: |
          The dates are swapped. Garstang (1930 to 1936) argued for about 1400 BCE; Kenyon (1950s) found the town far older, about 1550 BCE, and her work is the basis of the later view.
      - body: |
          Sort claims as **attested** (outside evidence, such as the Tel Dan stele, 9th century BCE), **debated** (such as Jericho: Garstang dated its fall to about 1400 BCE, Kenyon to about 1550 BCE) or **silent** (no trace found). The 603,550 men of Numbers 1:46 with families imply about
          $$603{,}550\times4\approx241\ \text{thousand people}$$
          a figure close to the 2 to 2.5 million that the Egyptologist Redford estimated, and Dever argues the Sinai could not have fed so many.
        feedback: |
          The product is 2,414,200, about 2.41 million, not 241 thousand (the decimal point slipped). The very large size of the figure is the point of the objection.
    explanation: |
      The same method of sorting claims applies to every story: what outside evidence confirms, what is argued over, and what leaves no trace.

  - id: scrolls
    title: The Dead Sea Scrolls
    row: 2
    col: 2
    body: |
      Found from 1946 or 1947 near Qumran, about **981 manuscripts** from **11 caves**, Cave 4 holding about 90%. Roughly 40% are biblical, 30% other, 30% sectarian. Who wrote them is debated: the **Essene** view (de Vaux), a **Jerusalem library** view (Golb), and **Zadokite or Sadducean roots** (Schiffman). Tov grouped the biblical texts by relation to the Masoretic text, and the share close to it fell from 60% (1992) to about 35% (2001).
    decoys:
      - body: |
          Found from 1946 or 1947 near Qumran, about **981 manuscripts** from **11 caves**, Cave 4 holding about 90%. Roughly 40% are biblical, 30% other, 30% sectarian. Who wrote them is debated: the **Essene** view (Golb), a **Jerusalem library** view (de Vaux), and **Zadokite or Sadducean roots** (Schiffman). Tov grouped the biblical texts by relation to the Masoretic text, and the share close to it fell from 60% (1992) to about 35% (2001).
        feedback: |
          The names are swapped. De Vaux proposed the Essene settlement; Golb argued the scrolls came from libraries in Jerusalem.
      - body: |
          Found from 1946 or 1947 near Qumran, about **981 manuscripts** from **11 caves**, Cave 4 holding about 90%. Roughly 40% are biblical, 30% other, 30% sectarian. Who wrote them is debated: the **Essene** view (de Vaux), a **Jerusalem library** view (Golb), and **Zadokite or Sadducean roots** (Schiffman). Tov grouped the biblical texts by relation to the Masoretic text, and the share close to it rose from 35% (1992) to about 60% (2001).
        feedback: |
          The trend is reversed. The share assigned to the Masoretic group fell (60% to about 35%) as the groups were redefined, and the category of non-aligned texts grew.
    explanation: |
      The scrolls give the text a picture a thousand years older than the medieval codices, and a debate about who held it.

  - id: genesis
    title: Genesis, the Flood and cosmology
    row: 2
    col: 3
    body: |
      Genesis 1 is usually assigned to P and Genesis 2:4 onwards to J. Close parallels exist in Mesopotamia: Atrahasis (a flood sent because humans make **noise**) and Enuma Elish (Marduk and Tiamat). Genesis gives **violence** as the flood's cause (Gen 6:11). Readers differ: **literal** (Ussher, 4004 BCE), **concordist** (Hugh Ross, days as ages), **non-literal** (framework view, Kline; Walton on function).
    decoys:
      - body: |
          Genesis 1 is usually assigned to J and Genesis 2:4 onwards to P. Close parallels exist in Mesopotamia: Atrahasis (a flood sent because humans make **noise**) and Enuma Elish (Marduk and Tiamat). Genesis gives **violence** as the flood's cause (Gen 6:11). Readers differ: **literal** (Ussher, 4004 BCE), **concordist** (Hugh Ross, days as ages), **non-literal** (framework view, Kline; Walton on function).
        feedback: |
          The sources are swapped. Genesis 1 is the priestly account (P); the garden story from 2:4 onwards is J.
      - body: |
          Genesis 1 is usually assigned to P and Genesis 2:4 onwards to J. Close parallels exist in Mesopotamia: Atrahasis (a flood sent because humans make **noise**) and Enuma Elish (Marduk and Tiamat). Genesis gives **violence** as the flood's cause (Gen 6:11). Readers differ: **literal** (framework view, Kline), **concordist** (Hugh Ross, days as ages), **non-literal** (Ussher, 4004 BCE; Walton on function).
        feedback: |
          Ussher computed 4004 BCE by adding up the ages in the text, a literal reading. The framework view treats the days as a literary structure, a non-literal reading.
    explanation: |
      The same text read three ways, set beside its neighbours: the lesson is how a parallel is weighed, not that it settles the question.

  - id: textual
    title: Comparing manuscripts
    row: 3
    col: 2
    body: |
      Scribes err in predictable ways: **haplography** skips text between two similar words, **dittography** repeats text by accident. Critics use rules of thumb: the **harder** reading and the **shorter** reading are preferred, because scribes tend to smooth and to add. They are not laws (a skip makes a text shorter), and a reading is weighed by its witnesses, not counted. "Original text" has several senses (Epp, 1999).
    decoys:
      - body: |
          Scribes err in predictable ways: **haplography** repeats text by accident, **dittography** skips text between two similar words. Critics use rules of thumb: the **harder** reading and the **shorter** reading are preferred, because scribes tend to smooth and to add. They are not laws (a skip makes a text shorter), and a reading is weighed by its witnesses, not counted. "Original text" has several senses (Epp, 1999).
        feedback: |
          The terms are swapped. Haplography ("single writing") loses a repeated stretch; dittography ("double writing") duplicates one.
      - body: |
          Scribes err in predictable ways: **haplography** skips text between two similar words, **dittography** repeats text by accident. Critics use laws: the **easier** reading and the **longer** reading win, because scribes tend to remove difficulties. They are rules without exception, and the reading with the most manuscripts wins. "Original text" has one sense (Epp, 1999).
        feedback: |
          Three slips. Scribes tend to smooth, so the harder reading is preferred; they tend to add, so the shorter one is preferred; and these are rules of thumb, weighed by the quality of witnesses and not by their number.
    explanation: |
      The method behind reading the scrolls against the later codices: every choice between readings is an argument, not a vote.

  - id: rabbinic
    title: Talmud, Midrash and rabbinic Judaism
    row: 3
    col: 1
    body: |
      After the Temple fell in 70 CE, the rabbis built a Judaism of study. The **Mishnah** (about 200 CE) was followed by two Talmuds: the **Yerushalmi** (late 4th to mid 5th century) and the **Bavli** (about 500 to 600). Rashi (1040 to 1105) wrote the classic commentary. In the Oven of Akhnai, a heavenly voice sides with Rabbi Eliezer, yet the sages answer that the Torah "is not in heaven" and follow the majority.
    decoys:
      - body: |
          After the Temple fell in 70 CE, the rabbis built a Judaism of study. The **Mishnah** (about 200 CE) was followed by two Talmuds: the **Bavli** (late 4th to mid 5th century) and the **Yerushalmi** (about 500 to 600). Rashi (1040 to 1105) wrote the classic commentary. In the Oven of Akhnai, a heavenly voice sides with Rabbi Eliezer, yet the sages answer that the Torah "is not in heaven" and follow the majority.
        feedback: |
          The dates are swapped. The Jerusalem Talmud (Yerushalmi) is the earlier, completed in the 4th or 5th century; the Babylonian (Bavli) came later and became the standard.
      - body: |
          After the Temple fell in 70 CE, the rabbis built a Judaism of study. The **Mishnah** (about 200 CE) was followed by two Talmuds: the **Yerushalmi** (late 4th to mid 5th century) and the **Bavli** (about 500 to 600). Rashi (1040 to 1105) wrote the classic commentary. In the Oven of Akhnai, a heavenly voice sides with Rabbi Eliezer, and the sages bow to the voice and follow Eliezer.
        feedback: |
          In the story the sages refuse the voice: the Torah "is not in heaven", so interpretation belongs to the majority of living scholars. Whether that is a fair rule or an arrogant one is read differently (Rubenstein, Karaites).
    explanation: |
      After the text was fixed, Judaism became the living interpretation of it, and the Talmud keeps the minority opinion beside the majority.

  - id: thought
    title: Maimonides, Kabbalah, Spinoza
    row: 3
    col: 3
    body: |
      Maimonides (1138 to 1204) finished the *Guide of the Perplexed* in 1190; he reads bodily words about God as figures ("the Torah speaks according to the language of man") and teaches that we say what God is **not**. The **Zohar** was published by Moses de Leon (c.1240 to 1305), who wrote it c.1280 to 1286; Luria (1534 to 1572) added *tzimtzum*. Spinoza was banned in 1656, published the *Theological-Political Treatise* in 1670, and denied that Moses wrote the Torah.
    decoys:
      - body: |
          Maimonides (1138 to 1204) finished the *Guide of the Perplexed* in 1190; he reads bodily words about God literally ("the Torah speaks according to the language of man") and teaches that we say what God **is**. The **Zohar** was published by Moses de Leon (c.1240 to 1305), who wrote it c.1280 to 1286; Luria (1534 to 1572) added *tzimtzum*. Spinoza was banned in 1656, published the *Theological-Political Treatise* in 1670, and denied that Moses wrote the Torah.
        feedback: |
          Maimonides argues the reverse: the phrase means the Torah borrows human speech, so bodily terms are figures, and the safest talk of God says what he is not.
      - body: |
          Maimonides (1138 to 1204) finished the *Guide of the Perplexed* in 1190; he reads bodily words about God as figures ("the Torah speaks according to the language of man") and teaches that we say what God is **not**. The **Zohar** was written by Simeon bar Yochai in the 2nd century, as scholars agree; Luria (1534 to 1572) added *tzimtzum*. Spinoza was banned in 1656, published the *Theological-Political Treatise* in 1670, and denied that Moses wrote the Torah.
        feedback: |
          Tradition credits Simeon bar Yochai, but scholars (Scholem) conclude that Moses de Leon wrote the Zohar in the late 13th century. Tradition and scholarship should be named separately.
    explanation: |
      Three Jewish answers to how a book can speak of God: reading it as figure, as hidden code, and as a human text read like nature.

  - id: modern
    title: Judaism after Auschwitz
    row: 4
    col: 1
    body: |
      About six million Jews were killed in 1933 to 1945. Rubenstein (*After Auschwitz*, 1966) rejected a God of history who elects Israel; Jonas (1984 lecture) held that God gave himself to becoming and **gave up omnipotence**; Berkovits (1973) spoke of God's hidden face (*hester panim*) that leaves room for human freedom; Fackenheim (1967) named a "614th commandment" to survive as Jews. Herzl's Zionism (1897) led to the state of Israel on 14 May 1948.
    decoys:
      - body: |
          About six million Jews were killed in 1933 to 1945. Rubenstein (*After Auschwitz*, 1966) kept a God of history who elects Israel; Jonas (1984 lecture) held that God gave himself to becoming and **gave up goodness**; Berkovits (1973) spoke of God's hidden face (*hester panim*) that leaves room for human freedom; Fackenheim (1967) named a "614th commandment" to survive as Jews. Herzl's Zionism (1897) led to the state of Israel on 14 May 1948.
        feedback: |
          Two slips. Rubenstein rejected the God of history. And Jonas kept God's goodness (and intelligibility) and gave up omnipotence, since any two of the three attributes exclude the third.
      - body: |
          About six million Jews were killed in 1933 to 1945. Rubenstein (*After Auschwitz*, 1966) rejected a God of history who elects Israel; Jonas (1984 lecture) held that God gave himself to becoming and **gave up omnipotence**; Berkovits (1973) spoke of God's hidden face (*hester panim*) that removes human freedom; Fackenheim (1967) named a "614th commandment" to give up the covenant. Herzl's Zionism (1897) led to the state of Israel on 14 May 1948.
        feedback: |
          Berkovits ties the hidden face to free will: God withdraws so that humans can act, for good or ill. Fackenheim's commandment is the opposite of giving up: Jews must survive as Jews and not hand Hitler a posthumous victory.
    explanation: |
      The question the earlier lessons raised in the abstract (how can the God of the covenant allow evil) is answered here in four different ways.

  - id: layers
    title: Reading fairly
    row: 4
    col: 2
    body: |
      Every claim in the level sits in one of three layers. **Established**: inscriptions, manuscripts and dates (Merneptah, the scrolls, the codices). **Live debate**: who wrote the Torah and when, what the archaeology means, the origin of the Flood story, who wrote the scrolls. **Commitment**: whether the Torah is revealed, and how a covenant God relates to history. A tradition and scholarship may answer differently, and each is stated *according to* its own source.
    decoys:
      - body: |
          Every claim in the level sits in one of three layers. **Established**: the Documentary Hypothesis, the Exodus numbers and the date of Moses. **Live debate**: inscriptions, manuscripts and dates. **Commitment**: whether the Torah is revealed, and how a covenant God relates to history. A tradition and scholarship may answer differently, and each is stated *according to* its own source.
        feedback: |
          The first two layers are swapped. Inscriptions and manuscripts are the established evidence; the hypothesis, the numbers and the date of Moses are the contested readings built on it.
      - body: |
          Every claim in the level sits in one of three layers. **Established**: inscriptions, manuscripts and dates (Merneptah, the scrolls, the codices). **Live debate**: who wrote the Torah and when, what the archaeology means, the origin of the Flood story, who wrote the scrolls. **Commitment**: the dates of the sources, which scholarship has settled. A tradition and scholarship must give one answer.
        feedback: |
          Commitment is the layer of faith and metaphysics (is the Torah revealed?), which no manuscript decides. The dates of the sources are debated, not settled, and a tradition and scholarship often answer differently, which is fine if each is labelled.
    explanation: |
      The close of the level: each reading is fair only when its layer is named.

