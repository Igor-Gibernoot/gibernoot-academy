id: ch14-textual
title: "Guided Problem: Comparing Manuscripts"
kind: guided

cards:
  - type: mcq
    id: hook
    title: "Guess: four copies against one"
    prompt: |
      Guessing is the point; no background is needed. Here is a made-up case. A town chronicle (the Chronicle of Harrow) was copied by hand for centuries and the original is lost. Five copies survive, and they agree on a sentence except for one word:

      "The founder of Harrow, beaten at the ford, ___ in the night."

      Four copies read "withdrew". One copy reads "fled". A friend says: "Four against one, so 'withdrew' is surely the original." What is the most reasonable reply for now?
    options:
      - text: "We cannot say yet. We need to know how the copies are related, and which of the two words could explain the other word appearing."
        correct: true
        feedback: |
          Yes. The number of copies is only the first fact. If all four came from one parent copy, they count as one voice, and a word can change in a copyist's hands for reasons we can name. The lesson builds that method.
      - text: "The majority wins; four copies cannot all be wrong."
        feedback: |
          They can all be wrong together if they descend from one copy that made the change, because a later copy repeats its parent's slips. We will count lines of descent, not copies.
      - text: "The odd one out wins, because it differs from the rest."
        feedback: |
          Being different is not evidence of being original. A single copy can also be a single slip. The method asks why the difference exists.
    explanation: |
      This is what textual critics (scholars who compare copies to work back toward an earlier text) do. This lesson gives you the rules they use on a toy text, and then says what the rules can and cannot reach. Everything below is taught according to textual critics such as Bengel, Griesbach and Metzger, with the debates about the rules marked.

  - type: text
    id: causes
    title: "Why copies differ"
    body: |
      Before the printing press every copy was made by hand, so every copy is a small experiment in human error and human choice. According to textual critics, changes fall into two families.

      **Accidental changes.** The eye jumps from one phrase to a similar phrase further on and the words between drop out; this is called **haplography** (the name means "single writing": something written once that should be written twice). The opposite slip, writing a stretch twice, is **dittography** ("double writing"). Letters that look alike get confused. A scribe who writes from dictation hears one word for another.

      **Deliberate changes.** A scribe may **harmonize** (make a passage agree with a parallel passage), **correct** something that looks like a mistake, **smooth** a hard or embarrassing wording, or add a short **gloss** (a note explaining a word) that later slips into the text.

      None of this says that scribes were careless. It says that a long chain of copies leaves a trail, and a trained reader can follow it.

  - type: mcq
    id: slip
    title: "Which slip?"
    prompt: |
      A toy text reads "He planted vines to the east of the river and olives to the west of the river." A later copy reads "He planted vines to the east of the river." The eye of the copyist seems to have landed on the first "of the river" and carried on from the second. What is this slip called, and what kind of change is it?
    options:
      - text: "Haplography, an accidental change: a stretch between two similar phrases was skipped."
        correct: true
        feedback: |
          Yes. The two phrases ending in "of the river" gave the eye a place to jump, and the words in between disappeared without anyone choosing it.
      - text: "Dittography, an accidental change: a phrase was written twice."
        feedback: |
          Dittography adds a repeat. Here text is missing, so the slip is the opposite kind.
      - text: "Harmonizing, a deliberate change: the scribe made the sentence agree with another passage."
        feedback: |
          Harmonizing is a choice to make two passages match. Nothing here suggests a parallel passage, and the missing words sit exactly between two similar endings, which points to the eye, not the intention.
    explanation: |
      Keep this case in mind: a shorter reading can be the product of a slip. It matters for a rule we meet soon.

  - type: text
    id: case1
    title: "Case 1: fled or withdrew"
    body: |
      Back to Harrow. The five copies of the chronicle, and what each reads at the one place where they differ:

      | Copy | Where and when | Reading |
      |---|---|---|
      | A | roll, oldest | fled |
      | B | codex, later | withdrew |
      | C | codex, later | withdrew |
      | D | codex, later | withdrew |
      | E | translation | withdrew |

      Suppose Harrow's citizens revered their founder. Ask what a scribe in such a town would do to the word "fled", and what the same scribe would do to the word "withdrew".

  - type: mcq
    id: harder
    title: "The harder reading"
    prompt: |
      In the Chronicle of Harrow, the town reveres its founder. One copy says he "fled" in the night, and four say he "withdrew". Textual critics have an old canon: the **harder reading** (the one a copyist would be less likely to write) is often the original. Why does that canon favour "fled" here?
    options:
      - text: "A loyal scribe has a motive to soften 'fled' into 'withdrew', but little motive to harden 'withdrew' into 'fled'. So 'fled' is the reading that is hard to explain as a later change."
        correct: true
        feedback: |
          Yes. This is the reasoning behind the canon *lectio difficilior potior* ("the harder reading is the stronger"), which according to the usual accounts Bengel (1687-1752) made prominent in his 1734 edition of the Greek New Testament. The canon is about the direction in which scribes tend to change a text.
      - text: "Because the copy that says 'fled' is the oldest, and the oldest always wins."
        feedback: |
          Age helps, but an old copy can still carry a slip, and a young copy can carry old readings. The canon of the harder reading works even if the copy's age is unknown.
      - text: "Because a rare word is always more likely to be original than a common word."
        feedback: |
          Rarity alone proves nothing: scribes also miswrite words into rare ones. What matters is whether a motive for the change exists in one direction and not the other.
    explanation: |
      The hard word is a clue because it is awkward for the copyists' side. A scribe who changes a text usually makes it smoother, safer or clearer, so a reading that goes against that trend has probably not been made by a scribe. The rival view in the next card is a warning that this is a rule of thumb.

  - type: mcq
    id: harder-limit
    title: "When harder is not better"
    prompt: |
      Suppose a sixth copy of the Chronicle of Harrow reads "The founder, beaten at the ford, *wheat* in the night." This is certainly the harder reading, since it makes no sense. According to textual critics, what should we do with the canon of the harder reading here?
    options:
      - text: "Not apply it. A reading counts as 'harder' only if it still makes sense; a meaningless reading is most likely a slip, which the next cases explain."
        correct: true
        feedback: |
          Yes. Critics state the canon with a limit: the reading must be difficult but possible. A reading no author could have written is better explained as an accident, such as a hearing or sight error.
      - text: "Choose 'wheat', since it is the hardest of all the readings."
        feedback: |
          The canon does not say 'the harder the better'. It looks for the reading that an author could have written and a scribe would have been tempted to change.
      - text: "Choose it only if it appears in the oldest copy."
        feedback: |
          Even in the oldest copy, nonsense is still nonsense; age does not turn a slip into an author's choice.
    explanation: |
      Scholars today treat this canon as a heuristic, not a law. A reading is not good because it is hard, but because the hardness is best explained by an author who wrote it and scribes who disliked it.

  - type: text
    id: case2
    title: "Case 2: the shorter reading"
    body: |
      A second canon says the **shorter reading** is often original, *lectio brevior potior*. The usual reasoning is that scribes were more inclined to add (a gloss, a clarifying phrase, a harmonizing detail) than to cut. Bengel is credited with an early form and Griesbach (1745-1812) with the form that became standard.

      A toy case in the Chronicle: copy A says "the gate of bronze" and copies B and E say "the gate of bronze, which faces the ford". The extra clause reads like a note that explains where the gate stood.

  - type: mcq
    id: shorter
    title: "Shorter or longer?"
    prompt: |
      In a toy chronicle, copy A reads "the gate of bronze" and two later copies read "the gate of bronze, which faces the ford". Nothing in the text suggests the clause was dropped by accident. According to the canon of the shorter reading, which is probably original, and why?
    options:
      - text: "The shorter, 'the gate of bronze': a clarifying clause is easy to add as a gloss, and there is no obvious reason for a scribe to remove it."
        correct: true
        feedback: |
          Yes. A note that started in the margin ("which faces the ford") can slip into the text, and copyists rarely cut such useful information without a reason.
      - text: "The longer, because it has more information."
        feedback: |
          Information is exactly what a glossing scribe adds, so the extra information is the suspicious part, not the safe one.
      - text: "Neither: the length of a reading never matters."
        feedback: |
          It can matter. Length is a clue about the direction of change, though only one clue, and the next card shows when it points the wrong way.
    explanation: |
      Notice the form of the argument. We do not say "short is better"; we say "adding is a common scribal act here, so the short form explains the long form better than the other way round".

  - type: mcq
    id: shorter-limit
    title: "When shorter loses"
    prompt: |
      A longer toy sentence reads "...vines to the east of the river and olives to the west of the river." Two later copies lack the words "and olives to the west of the river". According to critics such as Metzger, the canon of the shorter reading has a standard exception. Which fits this case?
    options:
      - text: "The missing words begin and end with the same phrase as the words before them ('of the river'), so the eye could easily have jumped: the shorter reading may be haplography, and the longer reading is the better guess."
        correct: true
        feedback: |
          Yes. The canon is usually stated with this exception: where a stretch could have dropped out by an eye-skip (called homoeoteleuton, "same ending"), the shorter reading loses its advantage. A caveat from the debate: some critics (Wilson) say such exceptions cover so many short readings that they swallow the rule.
      - text: "The shorter reading always wins, because the canon has no exceptions."
        feedback: |
          Critics who defend the canon, such as Metzger, state it with this exception, and critics who attack it (such as Royse, Robinson) say scribes often shortened texts too. Nobody in the debate treats it as exceptionless.
      - text: "The longer reading always wins when two copies are shorter, because two copies cannot make the same slip."
        feedback: |
          Two copies can share a slip if both descend from the same parent copy; and two copies can also drop the same words independently when the eye-jump is easy. Count lines of descent, not copies.
    explanation: |
      Scholars disagree about how much weight the canon deserves. Defenders keep it as a rule of thumb with exceptions; critics say that in some manuscript traditions longer readings turn out to be earlier more often than expected. The balanced position: it is a clue about scribal habit, tested case by case.

  - type: text
    id: case3
    title: "Case 3: three readings at once"
    body: |
      A third canon says: prefer the reading that **best explains the others**. Toy case at another place in the Chronicle, where the copies give three readings of the name of a gate:

      | Copy | Reading |
      |---|---|
      | A | the north gate |
      | B | the old gate |
      | C | the old north gate |
      | D | the north gate |
      | E | the old gate |

      Think about each reading as a possible parent of the others. Could a scribe who met two readings in two older copies have joined them? Could two scribes, each starting from "the old north gate", have cut it down in two different ways?

  - type: mcq
    id: explains
    title: "Which reading explains the others?"
    prompt: |
      Three readings of a gate's name in a toy chronicle: X "the north gate", Y "the old gate", Z "the old north gate". Which story is the best explanation?
    options:
      - text: "Z is a combination of X and Y, made by a scribe who had both readings in front of him (called a *conflation*). So Z is the latest, and the original is X or Y."
        correct: true
        feedback: |
          Yes. A scribe who sees two readings can join them to be safe, and that is a common scribal act. For Z to be the original, two different scribes would each have to drop a different word at random, a less likely story. The canon does not say which of X and Y is original.
      - text: "Z is the original, because it is the longest and so contains all the information."
        feedback: |
          Length is not originality. The question is which direction of change is the more natural, and joining two readings is more natural than cutting one in two different ways.
      - text: "X is the original because it appears twice (copies A and D) and Y also twice, so they tie and Z wins."
        feedback: |
          Counting copies does not answer the question, and Z is not a tie-breaker. The argument is about which story of change is most plausible.
    explanation: |
      The canon is really the master rule: the others (harder, shorter) are special cases of the question "which reading would have produced the rest by a known scribal act?". The reading that best answers it is the best candidate for the earlier text.

  - type: text
    id: independence
    title: "Case 4: counting witnesses"
    body: |
      Now suppose the copies of a different toy text fall into a family tree, a **stemma**. A **witness** is any source that preserves a reading: a manuscript, a translation, a quotation.

      Of eleven witnesses, nine are copies made from a single medieval codex K, which reads "lamb". Two others have no common parent with K: a scroll S, which reads "ram", and a Greek translation T made from a Hebrew copy unrelated to K, which also reads "ram".

      A copy made from K repeats K's reading, and shares its slips; nine copies of K are nine echoes of one voice. According to textual critics (Westcott and Hort, Metzger), witnesses are to be **weighed, not counted**: what counts is how many independent lines of descent support a reading.

  - type: numeric
    id: count
    title: "Independent lines"
    prompt: |
      In a toy text, nine medieval copies all descend from one codex K, which reads "lamb". A scroll S and a Greek translation T, each independent of K and of one another, read "ram". Counting each independent line of descent once, how many independent lines support "ram"?
    answer: 2
    tolerance: 0.001
    answerText: '2'
    wrong:
      - value: 11
        feedback: |
          Eleven is the total number of witnesses. "Ram" is read by two of them, and the nine others all go back to one source.
      - value: 9
        feedback: |
          Nine is the number of copies of K, and they read "lamb". The question asks about "ram".
    hint: Copies of the same parent are one line. Ask for each witness whether it descends from K.
    explanation: |
      "Lamb" has one independent line (K, with its nine copies), and "ram" has two (S and T). By raw count the vote is 9 to 2; by independent lines it is 1 to 2. That does not prove "ram" is original: K might preserve an older reading and the others share a coincidence. It changes what the evidence says.

  - type: mcq
    id: traps
    title: "Two tempting rules"
    prompt: |
      A reader proposes two shortcuts for choosing among variants. Which statements are mistakes? Select all that apply.
    multiple: true
    options:
      - text: "'The reading in the most copies is the original.'"
        correct: true
        feedback: |
          Many copies can descend from one source. Critics disagree on how much numbers matter (defenders of a majority text hold that numbers count for more), but nobody can ignore descent.
      - text: "'The reading in the oldest copy is the original.'"
        correct: true
        feedback: |
          An old copy may be a careless copy of a good ancestor, while a younger copy may descend from a better one. Age is evidence for the earliest date a reading existed, not for who copied better.
      - text: "'A reading supported by independent witnesses in different places is more likely to have deep roots.'"
        feedback: |
          This is sound. Independent witnesses are unlikely to share the same slip by chance, so agreement among them is a strong clue. It is also not a proof.
    explanation: |
      Two tempting rules fail for the same reason: they replace explanation by a number. Both age and count are useful as clues once we know the family tree.

  - type: text
    id: conflict
    title: "Case 5: when the rules disagree"
    body: |
      In real manuscripts the canons often pull in different directions. Toy case: at another place, copy A has a long, awkward clause: "the king, who had no sons, gave the town to his sister". Copies B, C and D read: "the king gave the town to his sister". The long reading is the harder one (it raises a question, why mention sons?) but it is also the longer one.

      The canon of the harder reading favours A; the canon of the shorter reading favours B, C and D. This is the normal state of a real argument.

  - type: mcq
    id: conflict-q
    title: "What do you do?"
    prompt: |
      Two canons disagree: the longer reading is also the harder, and the shorter is smoother. According to critics who describe the method as a weighing of probabilities, what should the critic do next?
    options:
      - text: "Ask which scribal act is more believable at this exact place (adding a clause to explain the sister's inheritance, or cutting an awkward clause), and which witnesses are independent, then give the conclusion with its degree of confidence."
        correct: true
        feedback: |
          Yes. The canons are rules of thumb, and where they clash the critic returns to the evidence: what was likely to happen, in this text, to this scribe. Some critics call the result a reasoned judgement, others point out that the same evidence can be used by different critics in opposite ways.
      - text: "Follow the canon that comes first in the usual list, since the list is a ranking."
        feedback: |
          There is no ranking that works for every case. The canons are not laws but summaries of tendencies.
      - text: "Choose by a vote among the copies."
        feedback: |
          A vote counts copies, and copies are not independent. We already saw why this does not settle things.
    explanation: |
      This is why textual criticism is called an art as well as a craft: a judgement made with reasons, which others can inspect and dispute.

  - type: order
    id: order
    title: "The method in order"
    prompt: |
      Put the steps of a textual critic's argument in order.
    steps:
      - "List every reading in every witness at the place where they differ."
      - "Group the witnesses by shared descent, so that copies of one parent count as one line."
      - "For each reading, ask what scribal act (slip, gloss, smoothing, harmonizing) would produce the others."
      - "Weigh the canons (harder, shorter, best explains the others) as rules of thumb at this place."
      - "State the preferred reading, say how sure you are, and record the rivals in a note."
    hint: Collect before you judge, and judge before you announce.
    explanation: |
      The first step is not a judgement at all. The last step is the one often forgotten: a critical edition records the rival readings in notes so that readers can disagree with the editor.

  - type: mcq
    id: undecided
    title: "A tie that stays a tie"
    prompt: |
      At one place in a toy text two readings, "tent" and "hut", are each supported by one independent line. Neither can be explained as a slip of the other, neither is harder or shorter, and the author's style allows both. What is the honest conclusion?
    options:
      - text: "The evidence does not decide. The edition prints one (with a reason such as 'the copy is oldest') and records the other, and a careful reader says the choice is open."
        correct: true
        feedback: |
          Yes. A method that can say "we cannot tell" is more trustworthy than one that always gives an answer.
      - text: "Choose the one in the codex, since a codex is a book and a book is better."
        feedback: |
          Format says nothing about the reading. This would be a rule invented to avoid the tie.
      - text: "The text is corrupt and unusable."
        feedback: |
          A tie at one word does not damage the whole text. Most places in most texts are not ties, and many differences make no difference to the sense.
    explanation: |
      In the real cases, the number of places that are truly open and also matter for meaning is small compared to the places where copies differ in spelling or word order.

  - type: text
    id: real
    title: "The method at work"
    body: |
      Two real cases from earlier lessons show what the method does. Everything here is taught according to the scholars named.

      **Isaiah 53:11.** The Masoretic Text (the traditional medieval Hebrew text) is somewhat obscure at this verse. The Great Isaiah Scroll (c. 125 BCE) and the Greek Septuagint agree on a reading that clarifies it: "he will see light". Two independent witnesses, one Hebrew and one translated from a Hebrew copy, agree against the later codex. Some English editions print "he will see light" and footnote that the scrolls and the Septuagint read so while the Masoretic Text does not. The canons pull both ways: the scroll's reading is supported by two independent lines, but the Masoretic wording is the harder one, so a critic could suspect the clearer reading of being a smoothing. Which weighs more is argued, not settled.

      **Jeremiah.** The Septuagint's Jeremiah is about one eighth shorter than the Masoretic one, and a Qumran fragment (4QJer-b) agrees with the short form. The shorter-reading canon would favour the short form, and an alternative story is that the Greek translator cut. The fragment supports the first story: a short Hebrew edition existed. Then the question "which reading is original?" has an odd answer: perhaps both are, of two editions.

  - type: mcq
    id: reach
    title: "What the method cannot reach"
    prompt: |
      The Great Isaiah Scroll (c. 125 BCE) is the oldest surviving copy of Isaiah. A critic compares it with later copies and reconstructs the best text they allow. According to critics such as Epp, which statement about the result is fair?
    options:
      - text: "It reaches back to the text that the surviving copies descend from, at best. What stood before the oldest copies, or whether 'original' means the first draft, the author's last form or a later edition, is debated and may stay out of reach."
        correct: true
        feedback: |
          Yes. Eldon Epp (1999) argued that "original text" has several senses (a predecessor form, the author's own manuscript, the canonical form, an interpreted form), and that a critic should say which one the work aims at. For texts such as Jeremiah, which survive in two editions, the question is sharper.
      - text: "It recovers the author's own manuscript word for word."
        feedback: |
          The method works on surviving copies. It cannot compare what no copy preserves, and for most ancient books we do not know how many stages the text passed through before our oldest copy.
      - text: "It shows that the text has no origin, because every copy is a copy."
        feedback: |
          The method reaches a stage and says nothing about whether earlier stages are lost. A limit on what can be recovered is not a proof that nothing was there.
    explanation: |
      Two separate questions are easy to mix: "what did the earliest copies we can reach say?" (the critic's question) and "what did the author write?" (which also needs history and, for some texts, doubts about a single author). Textual criticism answers the first well and the second only partly.

  - type: mcq
    id: layers
    title: "Fact, debate, faith"
    prompt: |
      After a lesson on variant readings, two readers speak. One says: "This proves the sacred text was corrupted beyond use." The other says: "This proves the sacred text was preserved perfectly." Which assessment is fair?
    options:
      - text: "Neither follows from the method alone. The established fact is that copies differ and that most differences are small; the debate is how to rank the readings; whether wording needs to be preserved exactly, and what that would say about the text's source, is a commitment about what scripture is and how it works."
        correct: true
        feedback: |
          Yes. Communities use the same results in different ways. Many believers treat the received text of their tradition as authoritative in worship and use the critical work as a scholarly tool; some find in the care of transmission a sign of trust; others find in the variety a reason to read the text as a human and historical document; some think the variety is a challenge to claims about exact preservation. These are positions about what is at stake, not facts of the method.
      - text: "The first reader is right, because any difference between copies means the text is corrupt."
        feedback: |
          Difference is not corruption. Most differences are spelling or word order, and the method exists to handle the rest. Calling it corruption already assumes there is a single fixed wording that scripture must have, which is a commitment, not a finding.
      - text: "The second reader is right, because the method recovers the original exactly."
        feedback: |
          The method recovers the best-supported reading, and the limits (ties, two editions, nothing before the oldest copy) are part of its own account. 'Exactly' goes beyond it.
    explanation: |
      The three layers again: copies differ (fact), how to rank them is argued (scholarly debate), and what the differences mean for the standing of a text is for the community and the individual (faith). The method sits in the first two.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      You solved a toy problem the way textual critics solve real ones. The Chronicle of Harrow was invented; the method is the real one, taught according to Bengel (1687-1752), Griesbach (1745-1812), Metzger and their critics.

      **The method, as rules of thumb.**

      - First list every reading, then group the witnesses by shared descent: copies of one parent are one voice, so witnesses are weighed, not counted.
      - Ask which scribal act (haplography, dittography, harmonizing, smoothing, a gloss) would turn one reading into the others, and prefer the reading that best explains the rest.
      - The harder reading is often original, if it is still possible sense and a scribe would have been tempted to soften it. The shorter reading is often original, unless an eye-skip could have dropped the words.
      - Neither the oldest copy nor the largest number decides alone.
      - Where the canons clash or the evidence is balanced, give the reasoned judgement and record the rivals; sometimes the honest result is a tie.

      **What stays open.** How much weight each canon deserves (defenders and critics differ), what "original" means for texts with two editions, and what any of this implies for how a community should hold its scripture. The method answers the first two in part and the third not at all.

      **Next:** Genesis, the Flood and cosmology. Now that you know how a text reaches us, the next lesson reads the creation stories themselves, beside Mesopotamian parallels and beside what science says, and sets the literal, concordist and non-literal readings side by side.
