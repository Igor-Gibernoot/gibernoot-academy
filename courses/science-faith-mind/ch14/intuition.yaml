id: ch14-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: the Hebrew Bible and the Jewish tradition studied as history, text and thought. Every answer below is *according to* some scholar, text or community.
  - **Three layers.** On a claim about the Torah, what the text says and what the artifacts show is established fact; who wrote it and when is a live scholarly debate; whether it comes from God is a faith commitment.
  - **Ladder of belief.** Henotheism: one god is mine, others exist for others. Monolatry: {{ only one god is worshipped, though others exist }}. Monotheism: only one god exists.
  - **Textual criticism.** When copies of a text differ, the rules of thumb prefer the reading that is harder, shorter, and the one that best explains how the others arose. Witnesses are weighed, not counted. Haplography is {{ an accidental skip }}; dittography is an accidental repeat.
  - **Sources and texts.** According to Wellhausen the Torah combines four sources in the order {{ J, E, D, P }} (Yahwist, Elohist, Deuteronomist, Priestly). Revised models treat them as fragments or supplements. The Masoretic Text is the medieval Hebrew text; the Septuagint is the ancient Greek translation; the Scrolls give Hebrew copies a thousand years older.
  - **Rabbinic literature.** In order: Mishnah (c. 200), Yerushalmi, Bavli, Rashi (1040-1105), Mishneh Torah (c. 1170-1180), Shulchan Aruch (1565). PaRDeS names four levels of reading: {{ peshat, remez, derash, sod }}.
  - **Responses to the Holocaust.** According to Rubenstein the God of history and election is given up; Jonas gives up {{ omnipotence }}; Berkovits keeps power and cites hester panim and human freedom; Fackenheim adds a 614th commandment.

cards:
  - type: text
    id: welcome
    title: "Quick recall: Judaism and the Torah"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main distinctions: the three layers of a claim, the ladder from henotheism to monotheism, how scholars compare manuscripts, the documentary hypothesis and its rivals, the Genesis readings, the rabbinic library, the responses to the Holocaust, and the movements of modern Judaism.

      Three kinds of card: **mnemonics**, **build and order cards**, and **numeric cards that give you data only**: you choose the method yourself.

      As always, every answer is *according to* someone or some view. Nothing here asks which tradition is true.

  - type: mcq
    id: layers
    title: "Three layers on a Torah claim"
    prompt: |
      Every claim about the Torah sits in one of three layers: **established fact**, **live scholarly debate**, or **faith commitment**. Which assignment is right? (a) The Torah text contains two accounts of the flood that differ in details, such as how many animals of each kind enter the ark. (b) The differences show that the Torah was assembled from several earlier documents. (c) The Torah was given to Moses at Sinai.
    options:
      - text: '(a) established, (b) live debate, (c) faith commitment.'
        correct: true
      - text: '(a) live debate, (b) established, (c) faith commitment.'
        feedback: |
          Swapped. Anyone can read the two flood accounts and see the differences. Whether they come from separate documents, a skilled single author or another process is what scholars dispute.
      - text: '(a) established, (b) established, (c) live debate.'
        feedback: |
          The documentary model has rivals (fragmentary, supplementary, and traditional views), so (b) is not settled. And (c) is held by faith in traditional Judaism and denied on other grounds elsewhere; historians cannot test it.
      - text: 'All three are established, since all three can be argued from the text.'
        feedback: |
          A claim can be argued from a text and still be open. The text is the fact; the theory of its making is debated; its divine origin is a commitment.
    explanation: |
      Mnemonic: **fact, debate, commitment**: what the text says, how it came to be, what it means for faith. Never pass a commitment off as a fact, in either direction.

  - type: mcq
    id: ladder
    title: "Henotheism, monolatry, monotheism"
    prompt: |
      Three statements about gods. (X) Only one god exists. (Y) Many gods exist, but only one is to be worshipped by this people. (Z) Many gods exist, and each people has its own, which it worships. Which pairing of names is right?
    options:
      - text: 'X is monotheism, Y is monolatry, Z is henotheism.'
        correct: true
      - text: 'X is monolatry, Y is monotheism, Z is henotheism.'
        feedback: |
          Mono-theism means one god, as a claim about what exists. Mono-latry means one worship (latria = service), a claim about what is owed, which allows other gods to exist.
      - text: 'X is henotheism, Y is monotheism, Z is monolatry.'
        feedback: |
          Henotheism is the devotion of a people to its own god while granting others exist for others (Z). It does not say others may not be worshipped by their peoples, nor that only one exists.
      - text: 'All three are the same view in different words.'
        feedback: |
          They differ on two questions: how many gods exist, and who may worship which. Scholars disagree about which rung ancient Israel stood on at which date, so the difference matters.
    explanation: |
      Mnemonic: **ladder of claims**. Henotheism: mine, others for others. Monolatry: only one is to be worshipped. Monotheism: only one exists. According to Kaufmann the last rung came with Moses as a new beginning; according to Mark Smith it grew gradually.

  - type: order
    id: israel-order
    title: "Order the evidence for Israel"
    prompt: |
      Put these pieces of evidence about Israel and its people in order of date, earliest first.
    steps:
      - 'The Amarna letters: clay tablets from Canaanite rulers writing to the Egyptian king (mid-14th century BCE).'
      - 'The Merneptah Stele: an Egyptian victory hymn naming a people "Israel" (about 1208 BCE).'
      - 'The Tel Dan stele: an Aramaic inscription of a king of Aram, mentioning a "house of David" on one reading (9th century BCE).'
      - 'The Sennacherib prism: an Assyrian account of the siege of Jerusalem in 701 BCE.'
      - 'The Cyrus Cylinder: a Persian proclamation of 539-538 BCE, after Babylon fell.'
    hint: |
      Think of Egypt in the Bronze Age first, then Aram and Assyria in the Iron Age, then Persia after the Babylonian exile.
    explanation: |
      Amarna letters (about 1350), Merneptah (about 1208), Tel Dan (9th century), Sennacherib (701), Cyrus (539). Mnemonic: **Egypt, Egypt, Aram, Assyria, Persia**. The Amarna letters do not name Israel; they show Canaan before it. Cyrus's cylinder does not mention the Jews, though it fits the return that Ezra and Isaiah describe.

  - type: build
    id: textual-build
    title: "Rules of thumb for comparing copies"
    prompt: |
      Two copies of an ancient text differ. Build the three tie-breaking rules of thumb in order: prefer the reading that is first harder, then shorter, then the one that best explains how the other readings arose.
    tiles: ['\text{harder}', '\text{shorter}', '\text{best explains the others}', '\text{smoother}', '\text{longer}', '\text{most copies}']
    answers:
      - ['\text{harder}', '\text{shorter}', '\text{best explains the others}']
    wrong:
      - answer: ['\text{smoother}', '\text{longer}', '\text{most copies}']
        feedback: |
          These are the temptations. A scribe tends to smooth a difficult line and to add explanation, so the smoother and longer reading is often the later one. And counting copies counts how popular a family was, not how old; a single early witness can outweigh many late copies.
    hint: 'Ask what a tired scribe tends to do to a puzzling line.'
    explanation: |
      Mnemonic: **harder, shorter, explains the rest**. These are rules of thumb, not laws: a harder reading can also be a plain mistake, and a scribe's skip makes a text shorter. In the end witnesses are **weighed, not counted**.

  - type: mcq
    id: hapl
    title: "Haplography or dittography"
    prompt: |
      Copy A of an old chronicle reads "the king fled to the north gate of the city". Copy B reads "the king fled to the north gate of the north gate of the city". A scholar says B probably arose from A by a copyist's slip. Which name fits?
    options:
      - text: 'Dittography: the eye or ear repeated a phrase.'
        correct: true
      - text: 'Haplography: the eye skipped from one phrase to a similar one.'
        feedback: |
          Haplography is the opposite slip, a skip that loses text when two similar words or phrases stand near each other. Here text was added, not lost.
      - text: 'Neither: only a deliberate editor can lengthen a text.'
        feedback: |
          A deliberate addition is one possibility, and a careful critic keeps it in mind. But a copied phrase repeated word for word looks like an accident.
    explanation: |
      Mnemonic: **haplography loses, dittography doubles**. If B were the original and A the copy, the slip would be a haplography. Which direction is right is exactly what the rules of thumb try to decide.

  - type: mcq
    id: jedp
    title: "J, E, D, P and the rivals"
    prompt: |
      According to Julius Wellhausen (1878, 1883), the Torah combines four sources. Which list gives them in his order of composition, earliest first, and names a family of models that replaced the simple version?
    options:
      - text: 'J (Yahwist), E (Elohist), D (Deuteronomist), P (Priestly); later models include fragmentary and supplementary views.'
        correct: true
      - text: 'P, D, E, J; and no one has proposed a rival.'
        feedback: |
          The order is reversed for Wellhausen, who put the Priestly source last (exilic or later) and the older narrative sources first. And rivals exist: fragmentary and supplementary models, and Kaufmann, who dated P earlier.
      - text: 'J, E, P, D; the law code came before the Deuteronomic scroll.'
        feedback: |
          Wellhausen put Deuteronomy (D, tied to the scroll found under King Josiah, c. 640-609 BCE) before P. That order is exactly what Kaufmann disputed, placing P before D.
      - text: 'Moses, Joshua, Ezra, Nehemiah; the sources are the four authors.'
        feedback: |
          Those are people from the story. The sources are documents recognised by vocabulary, theme and style, and not tied to a named author.
    explanation: |
      Mnemonic: **J E D P, old narratives to late priests**. Revised models: fragmentary (many small pieces), supplementary (a core expanded over time), and neo-documentary. Traditional readers answer differently: according to rabbinic tradition, Moses wrote the Torah; that is a commitment, not a finding of the method.

  - type: mcq
    id: canon-texts
    title: "Canon, Masoretic Text, Septuagint, Scrolls"
    prompt: |
      Which pairing is right?
    options:
      - text: 'The Masoretic Text is the medieval Hebrew text with vowel marks; the Septuagint is the ancient Greek translation; the Dead Sea Scrolls are Hebrew and Aramaic copies from about a thousand years before the oldest complete Hebrew codices.'
        correct: true
      - text: 'The Septuagint is the Hebrew original; the Masoretic Text is a later Greek translation; the Scrolls are medieval copies.'
        feedback: |
          Reversed. The Septuagint is Greek (a Torah translation from the 3rd century BCE, the rest later) and the Masoretic codices, such as Aleppo and Leningrad, are medieval; the Scrolls are about 2,000 years old.
      - text: 'The canon is the list of books in the Septuagint; the Scrolls are a copy of the Masoretic Text.'
        feedback: |
          The canon is a community's list of authoritative books; different communities fix it differently. And the Scrolls differ from the Masoretic Text in places, sometimes agreeing with the Septuagint.
      - text: 'All four are the same text, as proved by the Great Isaiah Scroll.'
        feedback: |
          The Great Isaiah Scroll (about 125 BCE) agrees with the later text in most places but has thousands of small variants; for Jeremiah the Greek is about an eighth shorter.
    explanation: |
      Mnemonic: **canon is a list; Masoretic is medieval Hebrew; Septuagint is Greek; Scrolls are the oldest Hebrew witnesses**. The Great Isaiah Scroll (about 125 BCE) is about 1,100 years older than the Leningrad Codex (1008 CE).

  - type: mcq
    id: genesis-readings
    title: "Four readings of Genesis 1"
    prompt: |
      Match each reading with what it mainly protects. Literal (Ussher: creation in 4004 BCE), day-age (Hugh Ross: the days are long ages), framework (Meredith Kline: the six days are a literary frame) and functional (John Walton: Genesis 1 describes the cosmos assigned its roles as a temple). Which pairing is right?
    options:
      - text: 'Literal protects the plain historical sense; day-age protects agreement with the sequence of cosmology; framework protects the theological message in a literary form; functional protects the ancient setting of the text.'
        correct: true
      - text: 'Literal protects agreement with cosmology; day-age protects the plain sense; framework and functional both claim the text is false.'
        feedback: |
          Swapped, and unfair. The framework and functional readers hold that the text is true and inspired; they say it makes its claim in another form (a literary frame, a statement of function) and so does not conflict with a 13.8 billion year universe.
      - text: 'All four agree on the age of the universe and differ only in vocabulary.'
        feedback: |
          Ussher gives about 6,000 years, the day-age reading accepts billions of years, and the framework and functional readings treat the number of years as not the text's point.
      - text: 'Only the literal reading takes Genesis seriously; the others are scientific reinterpretations.'
        feedback: |
          Each defender says that the reading is the one the text itself calls for. A steelman of the non-literal readers is that ancient genre and context decide what the text claims.
    explanation: |
      Mnemonic: **plain, concord, frame, function**. A reading is not the same as a conclusion about God: all four are held by people who affirm creation. What the text claims is a question of interpretation, and that is where they part.

  - type: order
    id: library-order
    title: "Order the rabbinic library"
    prompt: |
      Put these works in order of composition or completion, earliest first.
    steps:
      - 'The Mishnah, edited around 200 CE.'
      - 'The Jerusalem Talmud (Yerushalmi), from the late 4th to the mid 5th century.'
      - 'The Babylonian Talmud (Bavli), completed about 500 to 600.'
      - 'Rashi''s commentary on the Bible and the Talmud (Rashi lived 1040-1105).'
      - 'Maimonides'' Mishneh Torah, a code of law (about 1170-1180).'
      - 'Karo''s Shulchan Aruch, a code printed in 1565.'
    hint: |
      The Talmuds comment on the Mishnah; Rashi comments on the Talmud; the codes then distil the law.
    explanation: |
      Mnemonic: **text, two Talmuds, commentary, two codes**. Mishnah (c. 200), Yerushalmi, Bavli, Rashi (11th century), Mishneh Torah (12th), Shulchan Aruch (16th). Each layer answers the one before; none replaces it.

  - type: mcq
    id: pardes
    title: "PaRDeS: which level?"
    prompt: |
      In the four-level scheme PaRDeS, which name belongs to a reading that connects one verse with others and draws a teaching, as midrash does?
    options:
      - text: 'Derash.'
        correct: true
      - text: 'Peshat.'
        feedback: |
          Peshat is the plain, direct meaning of the words in context.
      - text: 'Remez.'
        feedback: |
          Remez is the hinted or allegorical meaning, a symbol that points beyond the words.
      - text: 'Sod.'
        feedback: |
          Sod is the secret, mystical meaning, later tied to Kabbalah.
    explanation: |
      Mnemonic: **plain, hint, compare, secret** (P, R, D, S). According to several scholars the full scheme is late (13th century), so it organises the rabbis' methods and does not describe how the early rabbis saw themselves.

  - type: mcq
    id: holocaust-responses
    title: "Who gives up what"
    prompt: |
      Four Jewish thinkers responded to the Holocaust. Which pairing is right?
    options:
      - text: 'Rubenstein gives up the God of history and election; Jonas gives up omnipotence; Berkovits keeps power and appeals to hidden face (hester panim) and human freedom; Fackenheim adds a 614th commandment (survive as Jews, remember, do not despair of God).'
        correct: true
      - text: 'Rubenstein keeps the God of history; Jonas keeps omnipotence; Berkovits denies God; Fackenheim denies any duty.'
        feedback: |
          Each is the reverse of what the thinker argued. Rubenstein (After Auschwitz, 1966) rejected the God of history, and Berkovits and Fackenheim, though differing, kept a place for God and for obligation.
      - text: 'Jonas keeps omnipotence and gives up goodness; Berkovits gives up freedom; Rubenstein adds a duty.'
        feedback: |
          Jonas keeps goodness and intelligibility and gives up power. Berkovits defends human freedom as the reason God lets evil happen. And the added duty is Fackenheim's.
      - text: 'All four say the Holocaust has a hidden purpose that makes it good.'
        feedback: |
          None of these four says that. Rubenstein and Jonas refuse the idea of purpose; Berkovits speaks of a hidden face, not a justification; Fackenheim says no explanation should be given.
    explanation: |
      Mnemonic: **Rubenstein drops the premise of history, Jonas drops power, Berkovits keeps power and stresses freedom, Fackenheim adds a duty.** Each response has a price, and the next step in the argument is to ask what it costs.

  - type: mcq
    id: oral-torah
    title: "Three views of the Oral Torah"
    prompt: |
      Which pairing of view and claim is right about the Oral Torah?
    options:
      - text: 'According to rabbinic tradition, it was given to Moses at Sinai along with the written Torah; according to historians, inherited practices existed before 70 CE and the rabbis later gathered and systematised them; according to the Karaites, only Scripture binds.'
        correct: true
      - text: 'According to historians, it was invented from nothing after 70 CE; according to Karaites, it is as old as the written Torah.'
        feedback: |
          Historians do not generally say it was invented from nothing: sources such as Josephus speak of Pharisees keeping inherited observances. And the Karaites reject the Oral Torah as binding.
      - text: 'According to rabbinic tradition, it is a later human addition; according to Karaites, it binds all Jews.'
        feedback: |
          Reversed. Rabbinic tradition holds it divine in origin; Karaites hold that only Scripture binds.
      - text: 'All three views agree on its age and differ only on its authority.'
        feedback: |
          They differ on both. The age is a matter of historical debate; the authority is a commitment.
    explanation: |
      Mnemonic: **Sinai, systematised, Scripture alone**. Historians' view concerns the age of the practices and can be debated with evidence; tradition and Karaites disagree on authority, a faith matter.

  - type: mcq
    id: movements
    title: "The movements in broad terms"
    prompt: |
      In broad terms, which pairing of movement and view of the Torah is right? (Each movement is varied inside.)
    options:
      - text: 'Orthodox: written and oral Torah from Sinai, halakha binding; Conservative: divine origin passed through human interpretation, halakha binding but open to reinterpretation; Reform: inspired but humanly constructed, halakha as guidance; Reconstructionist (Kaplan): Judaism as an evolving civilization.'
        correct: true
      - text: 'Orthodox: halakha is guidance; Reform: halakha is binding on every point; Conservative: only Scripture binds.'
        feedback: |
          Scrambled. "Only Scripture binds" is the Karaite view, and Reform treats halakha as guidance to adapt, not as binding on every point.
      - text: 'Reconstructionist: the Torah was dictated to Moses at Sinai; Orthodox: Judaism is an evolving civilization.'
        feedback: |
          Reversed. Mordecai Kaplan (Judaism as a Civilization, 1934) described Judaism as an evolving civilization; Orthodoxy holds the Sinai revelation.
      - text: 'All four movements agree on revelation and differ only on dress.'
        feedback: |
          They differ on revelation, on how binding halakha is, and on how tradition should change, not only on practice.
    explanation: |
      Mnemonic: **Sinai binds, interpretation binds, guidance, civilization** for Orthodox, Conservative, Reform, Reconstructionist. Each group is varied inside, and descriptions of the Conservative position in particular vary by source.

  - type: numeric
    id: exodus-numbers
    title: "How big a crowd?"
    prompt: |
      A census in Numbers 1:46 totals 603,550 men of fighting age. Suppose each of them stands for a household of 4 people in all, himself included. About how many people does this give, in millions? Give a decimal.
    answer: 2.414
    tolerance: 0.01
    answerText: '2.41'
    wrong:
      - { value: 0.6, feedback: 'That counts only the men. The question asks for the whole households, himself included.' }
      - { value: 1.81, feedback: 'That counts three people per household (the man plus two others?). Four in all means every household has four, himself among them.' }
    hint: 'Scaling check: four times a number near 0.6 million is near 2.4 million.'
    explanation: |
      $603{,}550\times4=2{,}414{,}200$, about $2.41$ million. Historians such as Redford give estimates of 2 to 2.5 million for this reading, and ask whether the Sinai and Egyptian evidence could fit it. Scholars part on what the number means, since some read it as an exact census and others as a literary or symbolic number.

  - type: numeric
    id: calendar-drift
    title: "A calendar that does not follow the sun"
    prompt: |
      A community uses a calendar of exactly 364 days (52 weeks), with no extra days added. The solar year is about 365.24 days. How many days will the calendar have fallen behind the seasons after 30 years? Give a decimal.
    answer: 37.2
    tolerance: 0.2
    answerText: '37.2'
    wrong:
      - { value: 1.24, feedback: 'That is the drift in one year. The question asks for 30 years.' }
      - { value: 30, feedback: 'One day a year would give 30, but the year differs by more than one day.' }
    hint: 'Scaling check: the drift grows in proportion to the years, a bit over a day each year.'
    explanation: |
      The gap is $365.24-364=1.24$ days a year, so after 30 years it is $30\times1.24=37.2$ days, more than a month. Texts from the Dead Sea Scrolls favour a 364-day year; whether and how its users corrected the drift is a matter of scholarly debate.

  - type: numeric
    id: guide-spinoza
    title: "Reading across the centuries"
    prompt: |
      Maimonides finished his Guide of the Perplexed in 1190. Spinoza's Theological-Political Treatise appeared, anonymously, in 1670. How many years separate the two works?
    answer: 480
    tolerance: 0.001
    answerText: '480'
    wrong:
      - { value: 1860, feedback: 'That adds the years. The question asks for the gap between them.' }
      - { value: 470, feedback: 'Check the subtraction: 1670 minus 1190.' }
    hint: 'Subtract the earlier year from the later one.'
    explanation: |
      $1670-1190=480$ years. Both thinkers read Scripture critically, one to show that its bodily language is a manner of speaking, the other to argue that its text has a human history; the two lines of reading run from medieval reason to early-modern criticism.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **The setting:** the Hebrew Bible and the Jewish tradition studied as history, text and thought; every answer is *according to* someone.

      **Three layers.** What the text says is established; who wrote it is a live debate; whether it comes from God is a commitment. **Ladder.** Henotheism (mine), monolatry (only one worshipped), monotheism (only one exists). **Manuscripts.** Prefer the harder, shorter reading that best explains the others; weigh witnesses, do not count them; haplography loses, dittography doubles. **Sources.** J, E, D, P for Wellhausen, with fragmentary, supplementary and traditional rivals. **Library.** Mishnah, Yerushalmi, Bavli, Rashi, Mishneh Torah, Shulchan Aruch; PaRDeS: peshat, remez, derash, sod. **Holocaust.** Rubenstein drops history's God, Jonas drops power, Berkovits points to the hidden face and freedom, Fackenheim adds a duty.

      The numbers you computed: 603,550 men and a household of 4 give about 2.41 million; a 364-day calendar falls 1.24 days a year behind the sun, 37.2 days in 30 years; the Guide (1190) and the Treatise (1670) are 480 years apart.

      **Next:** the content map of this level: rebuild its concept map box by box among look-alike decoys.
