id: ch14-archaeology
title: "What Archaeology Says"
kind: concept
own: |
  The setting: **archaeology** studies the ground (ruins, pottery, inscriptions, bones); it tests the stories of the Hebrew Bible about Egypt, Canaan, Israel and Judah. Each find is **attested** (a source outside the Bible names it), **debated** (experts disagree on what it shows) or **silent** (nothing found). Silence means different things for a big city and for a small group on the move. Everything below is taught according to someone.
  - **The Exodus.** According to Exodus 12:37 and Numbers 1:46, about 600,000 men (603,550 counted) left Egypt. If each man stands for a household of four, the whole people was about
  {{ $$603{,}550 \times 4 \approx 2.4 \text{ million}$$ }}
  No Egyptian text names the event. According to Kitchen, the Ramesside Delta setting fits the story; according to Finkelstein and Dever, the story as told is not historical, though it may keep a memory (for instance of the Hyksos). Faith holds that it happened as told; no dig can decide that.
  - **The conquest.** According to Joshua 6 and 8, Jericho and Ai fell to Joshua. According to Kenyon (1950s), Jericho's great destruction came {{ around 1550 BCE, long before the Israelites }}; Ai was a ruin in Joshua's time. At Hazor, Ben-Tor reads a 13th-century BCE fire as the Israelites' work, and Zuckerman as the city's own factional violence.
  - **Where Israel came from.** According to Dever, the conquest model is abandoned by professional archaeology. According to Finkelstein, the Iron I hill villages (c. 1200-1000 BCE), founded on empty ground, show Israel {{ emerging inside Canaan }}.
  - **David.** The Tel Dan stele (9th century BCE, found 1993-94) is the oldest known text with the phrase read as {{ "House of David" (*bytdwd*) }}. According to Garfinkel, Khirbet Qeiyafa (c. 1000 BCE) is a fortress of David's time; according to Finkelstein's low chronology, such finds are a century later, so David ruled a small highland chiefdom.
  - **The later kings and the exile.** Assyrian and Babylonian texts name Ahab (853 BCE), Jehu (841), Hezekiah (701) and the capture of Jerusalem on 2 Adar, 597 BCE. In order:
  {{ $$853 \to 841 \to 701 \to 597 \to 539$$ }}
  (Qarqar, Jehu's tribute, Sennacherib, Jerusalem, Cyrus's conquest of Babylon). The farther back, the less outside evidence there is.
  - **Three layers.** Established: inscriptions, destruction layers, pottery. Live debate: the date of the Exodus setting, who burned Hazor, how large David's realm was. Commitment: whether the narratives are history, theology, or both, which no excavation settles.

cards:
  - type: mcq
    id: hook
    title: "Guess: the missing burn layer"
    prompt: |
      Guessing is the point; no background is needed. A town's legend says a huge army burned the town to the ground long ago. Diggers cut through the ground under the town and find no burned layer from that period. What is the most reasonable first guess?
    options:
      - text: "Several readings stay open: the legend may be exaggerated, may refer to another event or place, or the evidence may have been washed away. The dig is a clue, not yet a verdict."
        correct: true
        feedback: |
          Yes. A missing layer can mean the story is false, and it can mean the story is about something else, or that time erased the traces. Archaeologists weigh these readings with dates and cross-checks.
      - text: "The legend is certainly false, because the ground never lies."
        feedback: |
          The ground does not lie, but it can be misread, and it can be incomplete. Erosion, rebuilding and wrong dating all happen.
      - text: "The legend is certainly true, and the diggers dug in the wrong place."
        feedback: |
          That protects the legend from any test. A fair reading allows the diggers to be right and the legend to be a changed memory.
    explanation: |
      This lesson meets exactly this situation with the Exodus, the conquest of Canaan, King David and the exile. Three things stay apart: what the ground and the inscriptions show, what scholars infer from it, and what a community holds about its scripture.

  - type: text
    id: kinds
    title: "Attested, debated, silent"
    body: |
      Archaeology (from the Greek for the study of ancient things) digs up ruins, pottery, tools, bones and inscriptions, and dates them by their layer, their style and by radiocarbon (the decay of carbon-14 in burned seeds or wood). This lesson sorts each biblical story into three boxes.

      **Attested:** a source outside the Bible, such as an Assyrian king's stone record, names it. **Debated:** there is a find, but experts read it differently. **Silent:** nothing has been found.

      Silence needs care. A large walled city leaves ruins that last for thousands of years, so a missing city is a real problem for a story. A small group of herders on the move leaves almost nothing, so a missing camp tells little. The question for each story is how much trace it should have left.

  - type: mcq
    id: silence-q
    title: "Which silence says more?"
    prompt: |
      Archaeologists find no trace of a camp of a few hundred herders who crossed a desert 3,000 years ago, and no trace of a walled city of thousands that a text says stood at a certain hill in the same period. Which statement is the fairest?
    options:
      - text: "The missing city is more troubling for the text, since walled cities leave lasting ruins; the missing camp tells little, since small mobile groups leave few traces."
        correct: true
        feedback: |
          Yes. Absence of evidence counts more where evidence should be abundant. For a huge group the argument shifts again: a very large crowd should leave more than a few hundred herders.
      - text: "Both silences prove the texts are false."
        feedback: |
          A silence proves nothing when the group would have left no mark anyway. Even a missing city may mean the site was misidentified or the ruins were later erased.
      - text: "Both silences are meaningless, because the ground never shows everything."
        feedback: |
          That ignores how much a city should leave. Some silences are meaningful; others are not. The skill is telling them apart.
    explanation: |
      "No evidence" is a spectrum. The rest of the lesson asks, for each story, what it should have left and what was actually found.

  - type: text
    id: exodus
    title: "The Exodus: the text and Egypt"
    body: |
      According to Exodus 1:11 the Israelites built the store cities Pithom and Ra'amses for Pharaoh. According to Exodus 12:37 they left Egypt as about 600,000 men on foot, besides women and children, and Numbers 1:46 totals the men counted at 603,550.

      No Egyptian text mentions the event. A few documents are cited as parallels: a papyrus (Anastasi V, from the reign of Seti II) reports two runaway slaves passing the frontier posts of Succoth and Migdol, and a papyrus from Ramesside times (Leiden 348) orders grain for 'Apiru men, a word for foreign labourers, hauling stone at Pi-Ramesses. Scholars differ on whether these have any link to the Israelites. Pithom, Ra'amses and Succoth are reasonably well identified with sites in the eastern Nile Delta.

  - type: numeric
    id: count-q
    title: "How big was the people?"
    prompt: |
      According to Numbers 1:46, 603,550 men over twenty were counted. Suppose each man stands for a household of four people (himself, a wife and two children). About how many people is that, in millions? Give the number to two decimals.
    answer: 2.41
    tolerance: 0.02
    answerText: '2.41'
    wrong:
      - { value: 0.6, feedback: "That counts only the men. The text adds women and children, so multiply by the household size." }
    hint: "603,550 times 4, then divide by one million."
    explanation: |
      $603{,}550 \times 4 = 2{,}414{,}200$, about 2.4 million people. The Egyptologist Donald Redford estimated 2 to 2.5 million. Critics such as Dever argue the Sinai could not have fed so many. A rival reading says the Hebrew word translated "thousand" (*eleph*) can also mean a clan or military unit, which would shrink the numbers a great deal; that reading has its own difficulties, since the verses still add up to a total.

  - type: text
    id: exodus-views
    title: "The Exodus: three views"
    body: |
      **Kenneth Kitchen**, an Egyptologist, argued that the world of the story fits the Ramesside Delta: Ramesses II's capital Pi-Ramesses stood near the old city of Avaris, which matches the store city Ra'amses. He granted that the events cannot be proven from outside the Bible.

      **Israel Finkelstein** found almost no occupation of the Sinai in the second millennium BCE, and Kadesh-barnea, a stop in the wilderness story, was uninhabited before the early 12th century BCE. With Neil Silberman he suggested that the story may have grown out of memories of the expulsion of the Hyksos, Asian rulers of Egypt, and been shaped later. **William Dever** called the search for the Exodus a "fruitless pursuit".

      **Faith.** Jews and Christians who hold the Exodus as told hold it as a revelation of God's action in history, a claim of the third layer. A more cautious believer may hold that the story keeps a real core (a smaller group escaping Egypt) and that its numbers and detail carry a message.

  - type: mcq
    id: exodus-q
    title: "What can the dig decide?"
    prompt: |
      According to Finkelstein, no trace of the Exodus as told has been found in Egypt or the Sinai. Which statement separates the three layers correctly?
    options:
      - text: "Established: no Egyptian text names the event and the Sinai shows little second-millennium occupation. Debate: whether a smaller group or a Hyksos memory lies behind it. Commitment: whether God acted in it as the text says."
        correct: true
        feedback: |
          Yes. A missing trace is a fact of the first layer; what it implies is the second; whether God acted is not a question a dig can answer in either direction.
      - text: "Established: the Exodus did not happen. Debate: when it was written. Commitment: nothing remains to decide."
        feedback: |
          "Did not happen" goes beyond the finds: the silence leaves room for a small event a dig would not detect. Believers' claims about God are also left open by any dig.
      - text: "Established: the Exodus happened as told. Debate: only its date. Commitment: whether to believe it."
        feedback: |
          No outside source confirms the event as told, so it cannot be called established; Kitchen himself granted this. The dig cannot reach it either way.
    explanation: |
      Archaeology can fail to find a trace, and can show that a big march is hard to fit with the finds. It cannot show that a religious claim is true or false.

  - type: text
    id: conquest
    title: "The conquest: Jericho, Ai and Hazor"
    body: |
      According to the book of Joshua, the Israelites took Canaan by war: Jericho's walls fell (Joshua 6), Ai was burned (Joshua 8) and Hazor was burned (Joshua 11). Diggers have tested these three sites.

      **Jericho.** John Garstang (digging 1930-36) linked a destroyed city to Joshua and dated it to about 1400 BCE. Kathleen Kenyon (digging 1952-58) redated that destruction to the end of the Middle Bronze Age, about 1550 BCE (radiocarbon later gave a 16th-century range) and found little sign of a city around 1400. Bryant Wood (1990) argued for Garstang's date again from a new study of the pottery, and mainstream archaeologists generally keep Kenyon's.

      **Ai.** Judith Marquet-Krause (1930s) found that the site usually identified with Ai, et-Tell, was destroyed in the 22nd century BCE, long before any Israelites. Other sites have been proposed as the real Ai, but are not widely accepted.

      **Hazor.** A city of the 13th century BCE was burned. Amnon Ben-Tor reads the fire as the conquest; Sharon Zuckerman reads it as violence between factions in the city; Finkelstein adds the wider collapse of the Late Bronze Age.

  - type: mcq
    id: jericho-q
    title: "What the Jericho dispute turns on"
    prompt: |
      Garstang and Kenyon both dug at Jericho and found a city destroyed by fire. Why did they reach different pictures of the conquest?
    options:
      - text: "They dated the destroyed city differently: about 1400 BCE for Garstang, about 1550 BCE for Kenyon. A conquest by Israelites around 1400 or later fits Garstang's date, not Kenyon's."
        correct: true
        feedback: |
          Yes. The disagreement is about dating by pottery and stratigraphy (the order of layers), not about whether there was a fire. Radiocarbon dates later supported a date near Kenyon's.
      - text: "Garstang found a burned city and Kenyon found none at all."
        feedback: |
          Both found a destroyed city. The question is when, and Kenyon dated it earlier.
      - text: "Kenyon used a literal reading of Joshua; Garstang did not."
        feedback: |
          It is the other way: Garstang linked his finds to Joshua. Kenyon's pottery and layer analysis did not support that link.
    explanation: |
      A fire, a wall and a date are three separate finds. The conquest story needs all three to match. Wood and his critics still argue over the date, a debate in the second layer; a believer may also hold that Joshua's account is a theological report, not a record of excavated events.

  - type: text
    id: origins
    title: "Then where did Israel come from?"
    body: |
      Four models, in the order they appeared. **Conquest** (the book of Joshua; William Albright defended a form of it): Israelites came from outside and took the land by war. **Peaceful infiltration** (Albrecht Alt, Martin Noth): herding groups moved into the thinly settled hills over time. **Peasant revolt** (George Mendenhall, Norman Gottwald): oppressed Canaanites rose against their city kings and became Israel. **Indigenous emergence** (Finkelstein, de Miroschedji): Israel grew out of Canaanite society itself.

      The key find is a wave of new small villages in the central hill country in the Iron I period (about 1200-1000 BCE). Finkelstein's surveys showed that they were founded on empty ground, not on ruins of destroyed Canaanite cities, without palaces or public stores, with pottery that continues the Canaanite style. William Dever writes that the conquest model is no longer held by any reputable professional archaeologist and that the three-model scheme is obsolete. Not everyone shares the confidence: some scholars doubt that these villagers can be called Israelites at all, and a text from about 1208 BCE (the Merneptah stele) already names "Israel" as a people in Canaan.

  - type: mcq
    id: origins-q
    title: "Which model fits the hill villages?"
    prompt: |
      Surveys find hundreds of small villages in the hills of Canaan around 1200-1000 BCE, founded on empty ground (not on destroyed Canaanite cities), with Canaanite-style pottery and no palaces. Which model do these facts fit best, according to Finkelstein?
    options:
      - text: "Indigenous emergence: the villagers grew out of Canaanite society (perhaps herders settling down), without a war of conquest."
        correct: true
        feedback: |
          Yes. No destruction of cities and Canaanite pottery point to people already in the land. Critics reply that pottery does not show identity, and that the settlers might have included newcomers.
      - text: "Conquest: the Israelites burned the cities and then built new villages."
        feedback: |
          The villages stand on empty ground, not on ruins. Conquest predicts burned cities followed by new foreign pottery, which the surveys do not show.
      - text: "None: the villages are older than the Late Bronze cities."
        feedback: |
          The villages are later (Iron I). They start around 1200 BCE, as the Late Bronze cities decline.
    explanation: |
      The finds narrow the choice but do not settle who the villagers believed they were. A tradition may remember the origin differently from an excavation, a point where the second and third layers meet.

  - type: text
    id: dan
    title: "David: a name on a stone"
    image:
      src: img/tel-dan-stele.webp
      alt: "A dark basalt fragment with lines of ancient Aramaic letters on a museum stand"
      caption: "The Tel Dan stele, an Aramaic victory inscription of the 9th century BCE found at Tel Dan in 1993-94 (Israel Museum, Jerusalem)."
      credit: "Oren Rozen, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:JRSLM_300116_Tel_Dan_Stele_02.jpg"
    body: |
      According to the books of Samuel and Kings, David became king of Israel and Judah, and his son Solomon built the Temple, in the 10th century BCE. What do we have outside the Bible?

      The best known find is the **Tel Dan stele**. A first piece was found in 1993 by a member of Avraham Biran's team, and two more pieces in 1994, in northern Israel, built into a later wall. It is in Old Aramaic and is dated by most scholars to the 9th century BCE. Most read it as set up by Hazael of Aram-Damascus, though his name does not survive. In its lines the standard reading finds a king of Israel and a king of the "House of David" (*bytdwd*). Because the script has no word divider, others have proposed different readings of the letters *dwd*, such as a place name.

  - type: mcq
    id: dan-q
    title: "What does the stele show?"
    prompt: |
      Most scholars read the Tel Dan stele (9th century BCE, Aramaic) as naming a "House of David". According to Aren Maeir, what does it show and not show about King David?
    options:
      - text: "It shows that a 9th-century Judean kingdom connected its dynasty to a David; it does not prove how large David's kingdom was in the 10th century."
        correct: true
        feedback: |
          Yes. A dynasty named for David is attested about a century after the date given to his reign. Whether he ruled a large kingdom or a small chiefdom remains debated.
      - text: "It proves that David ruled a large united kingdom from Egypt to the Euphrates."
        feedback: |
          Nothing on the stele describes David's own reign or its size, and the stone comes from an enemy of Israel and Judah.
      - text: "It shows that David never existed."
        feedback: |
          The reverse: if the reading is right, a dynasty claimed descent from a David. Whether that figure was a great king is the question the stele does not answer.
    explanation: |
      A name on a stone is attested; the size of the realm is debated. Readers who prefer other readings of the letters (a place name) leave the point open again.

  - type: text
    id: david-debate
    title: "David's realm: big or small?"
    body: |
      Three finds feed the debate. At **Khirbet Qeiyafa**, a fortified town in the hills overlooking the Valley of Elah, Yosef Garfinkel's team (digging from 2007) dated the site by pottery and burned olive pits to about 1050-970 BCE (later narrowed to about 1000-975) and read it as a fortress of David's time. Finkelstein and Fantalkin link it to an early northern entity, and Nadav Na'aman sees a Canaanite or Philistine place. In **Jerusalem**, Eilat Mazar announced in 2005 a large public building she dated to the 10th century BCE and linked to David's palace; other scholars are sceptical.

      The third is a matter of dating. Finkelstein's **low chronology** (1995-96) moves much of the monumental building once dated to the 10th century into the 9th, so David and Solomon would have ruled a small highland chiefdom. Amihai Mazar's **modified chronology** keeps those buildings in the 10th century. William Dever calls Saul, David and Solomon "reasonably well attested" and, at the same time, describes 10th-century Judah as an early, unfinished state. At the other end, Philip Davies (1992) denied the United Monarchy altogether.

  - type: mcq
    id: chron-q
    title: "Same finds, different dates"
    prompt: |
      Finkelstein and Amihai Mazar study the same 10th-century-style pottery and buildings. Finkelstein dates them to the 9th century BCE; Mazar keeps them in the 10th. What follows for King David if Finkelstein is right?
    options:
      - text: "The big buildings come after David's lifetime, so they cannot show a large kingdom under him; David himself could still have existed as a local ruler."
        correct: true
        feedback: |
          Yes. A later date separates the buildings from David, but it does not remove him. It leaves a smaller picture: a hill chief with a dynasty that later generations remembered with more splendour.
      - text: "The buildings are then proven to be forgeries."
        feedback: |
          A date shift does not make anything a forgery. The same buildings are simply assigned to a later king.
      - text: "David is then proven not to have existed."
        feedback: |
          That does not follow. The Tel Dan stele still points to a dynasty tracing itself to a David. Absence of grand buildings fits a small chiefdom as well as no one.
    explanation: |
      Dating by pottery style and radiocarbon is the hinge of the debate. A century of difference changes the picture from a regional kingdom to a village-level chiefdom, and each side has arguments for its dates.

  - type: text
    id: kings
    title: "Later kings: named by their enemies"
    image:
      src: img/lachish-relief.webp
      alt: "A carved stone panel from an Assyrian palace showing soldiers and a fortified city under attack"
      caption: "Part of the Lachish reliefs from Sennacherib's palace at Nineveh (British Museum), showing the Assyrian siege of the Judean city Lachish in 701 BCE."
      credit: "Photograph by Mike Peel ( www.mikepeel.net )., CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Lachish_Relief,_British_Museum_3.jpg"
    body: |
      With the 9th century, outside records appear, written mostly by the Assyrian empire.

      The **Kurkh Monolith** (found in 1861, British Museum) records that Shalmaneser III fought a coalition of kings at Qarqar in Syria in about 853 BCE, and lists "Ahab the Israelite" with 2,000 chariots and 10,000 foot soldiers. The Bible does not mention this battle. Some scholars doubt the numbers (Na'aman proposed 200 chariots) and a few question the reading "Israelite".

      The **Black Obelisk** (found by Layard at Nimrud in 1846, British Museum) shows an Israelite delegation bowing to Shalmaneser, and names the tribute-bringer as "Jehu, son of Omri", about 841 BCE. Most read this as King Jehu of Israel; the label "son of Omri" is debated, since the Bible describes Jehu as overthrowing Omri's house.

      In 701 BCE Sennacherib invaded Judah. His prism says he shut up King Hezekiah in Jerusalem "like a bird in a cage" after taking 46 cities. The Lachish reliefs show the siege of one of them.

  - type: order
    id: order-q
    title: "Put the outside records in order"
    prompt: Put these records in order of the date of the event, earliest first.
    steps:
      - "The Merneptah stele names a people Israel in Canaan (about 1208 BCE)"
      - "Shalmaneser III fights Ahab the Israelite at Qarqar (about 853 BCE)"
      - "Jehu pays tribute to Shalmaneser III (about 841 BCE)"
      - "Sennacherib shuts Hezekiah up in Jerusalem (701 BCE)"
      - "Nebuchadnezzar II takes Jerusalem and its king (597 BCE)"
      - "Cyrus conquers Babylon (539 BCE)"
    hint: "Think of the earliest Israel in any text, then the Assyrian kings, then Babylon, then Persia."
    explanation: |
      Outside texts start with a bare name (Merneptah), then name kings, and finally narrate events in detail. The farther back a story lies, the less outside evidence there is.

  - type: mcq
    id: sennacherib-q
    title: "Two accounts of 701 BCE"
    prompt: |
      Sennacherib's prism says Hezekiah was shut up in Jerusalem "like a bird in a cage" and that Judah later sent tribute. The Bible (2 Kings 18-19) says Jerusalem was spared after an angel struck the Assyrian camp. What do the two accounts show together?
    options:
      - text: "Both agree that Sennacherib invaded Judah and did not take Jerusalem; each tells it in its own favour, and historians treat the outcome as inconclusive."
        correct: true
        feedback: |
          Yes. An outside source and the Bible agree on the frame (an invasion, Hezekiah, Jerusalem not taken) and differ on cause and result. Historians suggest other causes of the withdrawal, such as disease or events at home, and these are debated.
      - text: "They contradict each other entirely, so neither can be used."
        feedback: |
          They agree on key facts. Two sources with opposite aims that still agree on the frame make that frame solid.
      - text: "The prism proves the angel story."
        feedback: |
          The prism does not mention a miracle or Assyrian losses. The miracle is a claim of faith the prism neither supports nor refutes.
    explanation: |
      This is the pattern for the later monarchy: the outline is attested by independent records, and the interpretation of causes belongs to the second and third layers.

  - type: text
    id: exile
    title: "The exile and the return"
    body: |
      The Babylonian Chronicle records that Nebuchadnezzar II took Jerusalem on the second day of Adar on 16 March 597 BCE, captured its king and installed a king of his own choice. The king was Jehoiachin (called Jeconiah in some texts). Clay tablets found at Babylon list oil rations for "Ya'ukin, king of the land of Yahudu" and his five sons, about 592 BCE, which fits the picture of a deposed king kept alive in exile. A second siege ended with the destruction of the city and the Temple in 587 or 586 BCE (sources differ).

      The Cyrus Cylinder (about 539-538 BCE, British Museum) says Cyrus returned the images of gods to their sanctuaries and sent displaced people home. It names Babylonian places and does not mention Jews or Jerusalem. Some scholars read it as the setting of the edict in Ezra 1; others, such as Bob Becking, say it has nothing to do with Judeans. The authenticity of the biblical edicts is itself unsettled.

  - type: mcq
    id: exile-q
    title: "Attested, debated, silent"
    prompt: |
      Which pairing of claim and layer is correct for the exile and return?
    options:
      - text: "Attested by a Babylonian source: Jerusalem fell in 597 BCE and its king was taken. Debated: whether the Cyrus Cylinder is the background of the edict in Ezra 1."
        correct: true
        feedback: |
          Yes. The first has an independent record, the Babylonian Chronicle. The second is a reading of a text that does not name Jews.
      - text: "Attested: the Cyrus Cylinder shows Cyrus freed the Jews. Debated: the fall of Jerusalem in 597 BCE."
        feedback: |
          Reversed: the Cylinder does not name Jews, and the 597 capture is recorded by the Babylonians.
      - text: "Silent: the capture of Jerusalem, since no source outside the Bible mentions it."
        feedback: |
          The Babylonian Chronicle records it. Silence concerns details (numbers deported, the effect on the land) that no outside record settles.
    explanation: |
      From the 8th century on, outside texts support the main outline of the Bible's history. The silence returns for inner questions: how many were deported, how empty the land became, and who returned.

  - type: mcq
    id: layers-q
    title: "Which sentence is a commitment?"
    prompt: |
      Which of these sentences belongs to the third layer, a faith or metaphysical commitment, and cannot be decided by archaeology alone?
    options:
      - text: "God brought Israel out of Egypt and gave the land, as the Bible says."
        correct: true
        feedback: |
          Yes. A claim about God's action in history may be held by faith or doubted, but no excavation can test it.
      - text: "No Egyptian text mentions the Exodus."
        feedback: |
          This is a first-layer fact about what has been found.
      - text: "Most archaeologists do not accept the conquest model."
        feedback: |
          This is a second-layer statement about what experts hold, which can change with new finds.
    explanation: |
      A believer and a sceptic may agree on every find and still part ways on this sentence, because they differ on a premise about God and history, not on a pot or a wall.

  - type: mcq
    id: parting-q
    title: "Why thoughtful people part"
    prompt: |
      Two scholars agree that Hazor's palace burned in the 13th century BCE and that Israel appears in Canaan around 1208 BCE. One of them reads the fire as Joshua's conquest and the other as an internal revolt. Which difference between them explains this?
    options:
      - text: "They give different weight to the biblical text as a guide to what happened (Ben-Tor reads the fire as the conquest, Zuckerman as the work of city factions), since the burn layer alone does not name the burners."
        correct: true
        feedback: |
          Yes. The ground shows a fire, not who lit it. The reading depends on how much the text counts as evidence of the event.
      - text: "One of them rejects archaeology."
        feedback: |
          Both use the same finds. They differ in the inference from the fire.
      - text: "One of them has found a hidden inscription naming the burners."
        feedback: |
          No inscription names the burners; that is why the disagreement continues.
    explanation: |
      This is the general lesson of the unit: a find rarely carries its own meaning. Where thoughtful people part is the premise they bring, such as trust in the text, a preferred dating, or a view of what a story is for.

  - type: text
    id: summary
    body: |
      **Next:** Archaeology digs the world around the text. The next lesson, "The Dead Sea Scrolls and the Text", asks what the oldest manuscripts show about the age and the variety of the biblical text itself, and about the Judaism of the time of the Second Temple.
