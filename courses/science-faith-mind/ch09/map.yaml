id: ch09-map
title: "Content Map: Science and Religion"
kind: map
name: Level 9, Science and Religion (Barbour's four models and Gould's NOMA, the Galileo affair, Darwin and the three layers, Hume on miracles and the odds form, divine action, surveys of scientists, the theology of science and laws of nature)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 9 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (non-overlap mixed up with exhaustion, a likelihood ratio with $q$ in place of $q^n$, epistemic mixed up with ontological, a survey number given to the wrong group), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: models
    title: Four models and NOMA
    row: 1
    col: 2
    body: |
      With $D_S$ the questions science treats as its own and $D_R$ those of a religion, **Conflict** (Barbour) assumes a shared ground with rival answers, $D_S\cap D_R\neq\varnothing$. **Independence** (Gould's NOMA) says
      $$\begin{gathered}D_S\cap D_R=\varnothing\\ D_S\cup D_R\neq\text{all inquiry}\end{gathered}$$
      so the magisteria do not overlap, and they do not exhaust inquiry (art is a further domain). **Dialogue** and **Integration** let the two meet at an edge or join in one picture.
    decoys:
      - body: |
          With $D_S$ the questions science treats as its own and $D_R$ those of a religion, **Conflict** (Barbour) assumes a shared ground with rival answers, $D_S\cap D_R\neq\varnothing$. **Independence** (Gould's NOMA) says
          $$\begin{gathered}D_S\cap D_R=\varnothing\\ D_S\cup D_R=\text{all inquiry}\end{gathered}$$
          so the magisteria do not overlap, and together they exhaust inquiry. **Dialogue** and **Integration** let the two meet at an edge or join in one picture.
        feedback: |
          Non-overlap is not exhaustion. Gould said the two magisteria do not overlap but do not cover everything: art and beauty are a further domain.
      - body: |
          With $D_S$ the questions science treats as its own and $D_R$ those of a religion, **Conflict** (Barbour) assumes the domains are separate, $D_S\cap D_R=\varnothing$. **Independence** (Gould's NOMA) says
          $$\begin{gathered}D_S\cap D_R\neq\varnothing\\ D_S\cup D_R\neq\text{all inquiry}\end{gathered}$$
          so the magisteria overlap and do not exhaust inquiry. **Dialogue** and **Integration** let the two meet at an edge or join in one picture.
        feedback: |
          The two are swapped. Conflict needs a shared ground (an overlap with incompatible answers); independence is the claim that no overlap exists, so no clash can arise.
    explanation: |
      The root of the level: the typology sorts positions, and every later box is a case or a tool for testing one of the four.

  - id: bellarmine
    title: Bellarmine's condition
    row: 2
    col: 1
    body: |
      According to his letter of 12 April 1615, Cardinal Bellarmine (1542-1621) allowed Copernicanism as a **mathematical hypothesis** that saves the appearances, but asked for a real **demonstration** before reading it as physical truth; then Scripture would have to be reinterpreted:
      $$\begin{gathered}\text{demonstration of motion}\\ \Rightarrow\\ \text{reread Scripture}\end{gathered}$$
    decoys:
      - body: |
          According to his letter of 12 April 1615, Cardinal Bellarmine (1542-1621) allowed Copernicanism as a **mathematical hypothesis** that saves the appearances, but asked that Scripture be reread first, and only then a **demonstration** would be sought:
          $$\begin{gathered}\text{reread Scripture}\\ \Rightarrow\\ \text{demonstration of motion}\end{gathered}$$
        feedback: |
          The order is reversed. The condition is that a demonstration of the Earth's motion would justify rereading Scripture; rereading first would let the reading decide the physics.
      - body: |
          According to his letter of 12 April 1615, Cardinal Bellarmine (1542-1621) **forbade** Copernicanism even as a **mathematical hypothesis**, and held that no demonstration could ever change how Scripture is read:
          $$\begin{gathered}\text{demonstration of motion}\\ \not\Rightarrow\\ \text{reread Scripture}\end{gathered}$$
        feedback: |
          He allowed the hypothesis and said a real demonstration would require rereading Scripture. His point was that, in his view, none had been shown (and the parallax objection was a reasonable one until Bessel, 1838).
    explanation: |
      The Galileo case begins with a question about evidence: when does a useful calculation become a claim about the world?

  - id: christina
    title: Galileo's placement
    row: 3
    col: 1
    body: |
      According to the *Letter to the Grand Duchess Christina* (1615), Scripture teaches how to go to heaven, not how the heavens go. On the Earth's motion Galileo was an **Independence** thinker, the 1616 consultors a **Conflict** thinker:
      $$\begin{gathered}\text{Earth's motion}\in D_S,\ \notin D_R\\  D_S\cap D_R\neq\varnothing\end{gathered}$$
    decoys:
      - body: |
          According to the *Letter to the Grand Duchess Christina* (1615), Scripture teaches how to go to heaven, not how the heavens go. On the Earth's motion Galileo was an **Independence** thinker, the 1616 consultors a **Conflict** thinker:
          $$\begin{gathered}\text{Earth's motion}\in D_R,\ \notin D_S\\  D_S\cap D_R\neq\varnothing\end{gathered}$$
        feedback: |
          The domains are swapped. Galileo put the heavens' motion in the evidence of nature, so in $D_S$ and outside $D_R$.
      - body: |
          According to the *Letter to the Grand Duchess Christina* (1615), Scripture teaches how to go to heaven, not how the heavens go. On the Earth's motion Galileo was a **Conflict** thinker, the 1616 consultors an **Independence** thinker:
          $$\begin{gathered}D_S\cap D_R\neq\varnothing\\ \text{Earth's motion}\in D_S,\ \notin D_R\end{gathered}$$
        feedback: |
          The models are swapped. Galileo kept Scripture and astronomy apart; the consultors read Joshua's standing sun as a clash on shared ground.
    explanation: |
      The same episode read with the typology: it shows two models applied to one question, not a simple fight of science against religion.

  - id: selection
    title: Selection and the odds rule
    row: 2
    col: 2
    body: |
      A fraction $p$ of a population carries variant A, which leaves $w>1$ offspring for each one of B. After one generation
      $$p'=\frac{w\,p}{w\,p+(1-p)}$$
      so each generation multiplies the **odds** by $w$:
      $$\frac{p_n}{1-p_n}=w^{\,n}\,\frac{p_0}{1-p_0}$$
    decoys:
      - body: |
          A fraction $p$ of a population carries variant A, which leaves $w>1$ offspring for each one of B. After one generation
          $$p'=w\,p$$
          so each generation multiplies the **fraction** by $w$:
          $$p_n=w^{\,n}\,p_0$$
        feedback: |
          A fraction cannot pass 1. The offspring of A are counted against the offspring of B, so the denominator $w\,p+(1-p)$ appears, and what multiplies cleanly by $w$ is the odds.
      - body: |
          A fraction $p$ of a population carries variant A, which leaves $w>1$ offspring for each one of B. After one generation
          $$p'=\frac{w\,p}{w\,p+(1-p)}$$
          so each generation **adds** $w$ to the odds:
          $$\frac{p_n}{1-p_n}=n\,w\,\frac{p_0}{1-p_0}$$
        feedback: |
          The advantage compounds. Each generation starts from the new fraction, so the odds are multiplied by $w$ every time, giving $w^{\,n}$ and not $n\,w$.
    explanation: |
      The science side of the Darwin case: what the theory says is a rule you can compute with, and mutation supplies variants while selection filters them.

  - id: layers
    title: The three layers
    row: 3
    col: 2
    body: |
      That life evolved is **established science**; whether evolution is purposed or purposeless is **metaphysics**; how to read Genesis is **theology**. In *Kitzmiller v. Dover* (2005) a US court ruled that intelligent design could not be taught as science in a public school, a legal ruling that **takes no position** on whether a designer exists.
    decoys:
      - body: |
          That life evolved is **metaphysics**; whether evolution is purposed or purposeless is **established science**; how to read Genesis is **theology**. In *Kitzmiller v. Dover* (2005) a US court ruled that intelligent design could not be taught as science in a public school, a legal ruling that **takes no position** on whether a designer exists.
        feedback: |
          The first two layers are swapped. Common descent and selection are tested by evidence; purpose is not a measurable output of the theory, so it is a metaphysical question.
      - body: |
          That life evolved is **established science**; whether evolution is purposed or purposeless is **metaphysics**; how to read Genesis is **theology**. In *Kitzmiller v. Dover* (2005) a US court ruled that **no designer exists**, which settled the question for believers and unbelievers alike.
        feedback: |
          A court ruled on what may be taught as science in a public school. It did not and could not decide whether a designer exists.
    explanation: |
      Sorting a claim into its layer is what keeps Darwin's case from becoming "science against religion", as the retelling of the Oxford debate often suggests.

  - id: hume
    title: Hume's weighing
    row: 4
    col: 1
    body: |
      According to Hume (1711-1776, *Enquiry* X, 1748) a miracle is "a violation of the laws of nature", and testimony establishes one only if its falsehood would be **more miraculous** than the event. In odds form, with $E$ the witness's report of $M$:
      $$\begin{gathered}\frac{P(M\mid E)}{P(\neg M\mid E)}=\\ \frac{P(E\mid M)}{P(E\mid \neg M)}\cdot\frac{P(M)}{P(\neg M)}\end{gathered}$$
      A low prior is not zero, so he did not prove miracles impossible.
    decoys:
      - body: |
          According to Hume (1711-1776, *Enquiry* X, 1748) a miracle is "a violation of the laws of nature", and testimony establishes one only if its falsehood would be **more miraculous** than the event. In odds form, with $E$ the witness's report of $M$:
          $$\begin{gathered}\frac{P(M\mid E)}{P(\neg M\mid E)}=\\ \frac{P(E\mid \neg M)}{P(E\mid M)}\cdot\frac{P(M)}{P(\neg M)}\end{gathered}$$
          A low prior is not zero, so he did not prove miracles impossible.
        feedback: |
          The likelihood ratio is inverted. A report that is likely when $M$ happened and unlikely otherwise should raise the odds of $M$, so the ratio is $P(E\mid M)/P(E\mid\neg M)$.
      - body: |
          According to Hume (1711-1776, *Enquiry* X, 1748) a miracle is "a violation of the laws of nature", and testimony establishes one only if its falsehood would be **more miraculous** than the event. In odds form, with $E$ the witness's report of $M$:
          $$\begin{gathered}\frac{P(M\mid E)}{P(\neg M\mid E)}=\\ \frac{P(E\mid M)}{P(E\mid \neg M)}\cdot\frac{P(M)}{P(\neg M)}\end{gathered}$$
          A low prior makes the event **impossible**, so Hume proved that no testimony can ever suffice.
        feedback: |
          The argument is about when testimony is enough. A tiny prior is not zero, and enough independent, reliable witnesses could in principle outweigh it.
    explanation: |
      The link from the Galileo question (what counts as demonstration?) to a question about evidence for events that break a law.

  - id: witnesses
    title: Witnesses and independence
    row: 5
    col: 1
    body: |
      With $q=P(E_i\mid\neg M)$ the chance a witness reports $M$ when it did not happen, $n$ independent truthful witnesses give a likelihood ratio $1/q^{\,n}$. The report wins at even odds or better when $q^{\,n}\le P(M)$, that is
      $$n\ \ge\ \frac{\ln\,(1/P(M))}{\ln\,(1/q)}$$
      For $P(M)=10^{-9}$ and $q=10^{-3}$ this is $n=3$. Witnesses who copy one source count as one.
    decoys:
      - body: |
          With $q=P(E_i\mid\neg M)$ the chance a witness reports $M$ when it did not happen, $n$ independent truthful witnesses give a likelihood ratio $1/(n\,q)$. The report wins at even odds or better when $n\,q\le P(M)$, that is
          $$n\ \le\ \frac{P(M)}{q}$$
          For $P(M)=10^{-9}$ and $q=10^{-3}$ this is $n=10^{-6}$. Witnesses who copy one source count as one.
        feedback: |
          Independent false reports multiply their chances: $q\cdot q\cdots q=q^{\,n}$. With $q=10^{-3}$, two witnesses give a ratio of $10^6$, not $500$, and more witnesses help, not hurt.
      - body: |
          With $q=P(E_i\mid\neg M)$ the chance a witness reports $M$ when it did not happen, $n$ independent truthful witnesses give a likelihood ratio $1/q^{\,n}$. The report wins at even odds or better when $q^{\,n}\le P(M)$, that is
          $$n\ \ge\ \frac{\ln\,(1/P(M))}{\ln\,(1/q)}$$
          For $P(M)=10^{-9}$ and $q=10^{-3}$ this is $n=3$. Witnesses who copy one source count as **each one of them**.
        feedback: |
          Copying breaks the independence the formula needs. Ten people repeating one story are one source, so the effective $n$ is the number of independent groups.
    explanation: |
      The weighing made quantitative. Its two weak points are independence (the witnesses) and the prior $P(M)$ (the worldview).

  - id: divine
    title: Proposals for divine action
    row: 4
    col: 2
    body: |
      A **non-interventionist** God acts within what the laws leave open. **Quantum** (Russell): God acts in the choice among outcomes the laws leave open, the statistics unchanged. **Chaos** (Polkinghorne): chaotic systems are sensitive to tiny differences, and God acts by **active information**, information and not energy. **Whole-part** (Peacocke, Ellis): the state of the whole constrains the parts, which Tracy says can be redescribed bottom-up.
    decoys:
      - body: |
          A **non-interventionist** God acts within what the laws leave open. **Chaos** (Russell): God acts in the choice among outcomes the laws leave open, the statistics unchanged. **Quantum** (Polkinghorne): chaotic systems are sensitive to tiny differences, and God acts by **active information**, information and not energy. **Whole-part** (Peacocke, Ellis): the state of the whole constrains the parts, which Tracy says can be redescribed bottom-up.
        feedback: |
          The names are swapped. Russell's proposal uses quantum indeterminacy; Polkinghorne's uses chaos and active information.
      - body: |
          A **non-interventionist** God acts within what the laws leave open. **Quantum** (Russell): God acts in the choice among outcomes the laws leave open, the statistics unchanged. **Chaos** (Polkinghorne): chaotic systems are sensitive to tiny differences, and God acts by adding **energy** at the right moment. **Whole-part** (Peacocke, Ellis): the state of the whole constrains the parts, which Tracy says can be redescribed bottom-up.
        feedback: |
          Adding energy would break the conservation laws, which is the interventionist route these proposals avoid. Active information is meant to steer without pushing.
    explanation: |
      Miracles asked what testimony can show; this box asks how God's action could be possible at all without overriding the laws.

  - id: openness
    title: Epistemic or ontological
    row: 5
    col: 2
    body: |
      For the logistic map $x_{n+1}=r\,x_n(1-x_n)$ with $r=3.9$, two starts a gap $\delta_0$ apart drift as $\delta_n\approx\delta_0\,e^{\lambda n}$, so the steps to a visible difference grow like $\ln(1/\delta_0)$ (22 steps for $10^{-6}$, 44 for $10^{-12}$). The equations are deterministic, so the unpredictability is **epistemic** (a limit of knowledge) unless one adds that the laws themselves are open, which is **ontological**. Polkinghorne reads it ontologically.
    decoys:
      - body: |
          For the logistic map $x_{n+1}=r\,x_n(1-x_n)$ with $r=3.9$, two starts a gap $\delta_0$ apart drift as $\delta_n\approx\delta_0\,e^{\lambda n}$, so the steps to a visible difference grow like $\ln(1/\delta_0)$ (22 steps for $10^{-6}$, 44 for $10^{-12}$). The equations are deterministic, so the unpredictability is **ontological** (the laws are open) unless one adds that it is only a limit of knowledge, which is **epistemic**. Polkinghorne reads it ontologically.
        feedback: |
          The labels are swapped. Unpredictability from deterministic equations is, by itself, a limit of our knowledge (epistemic); openness in the laws is the further, metaphysical step.
      - body: |
          For the logistic map $x_{n+1}=r\,x_n(1-x_n)$ with $r=3.9$, two starts a gap $\delta_0$ apart drift as $\delta_n\approx\delta_0\,e^{\lambda n}$, so the steps to a visible difference grow like $1/\delta_0$ (22 steps for $10^{-6}$, so about $2\times10^{7}$ for $10^{-12}$). The equations are deterministic, so the unpredictability is **epistemic** unless one adds that the laws are open, which is **ontological**.
        feedback: |
          Exponential drift means the steps grow like $\ln(1/\delta_0)$: a million-fold smaller gap costs only about 22 more steps, giving 44, not millions.
    explanation: |
      The lesson of the divine-action proposals in one distinction: chaos alone shows a limit of prediction, and the extra premise about open laws is a commitment, not a result of physics.

  - id: survey
    title: Surveys of scientists
    row: 2
    col: 3
    body: |
      In 2009 Pew found AAAS members **33%** believing in God, 18% in a higher power and 41% in neither (US public 2006: 83%, 12%, 4%); Larson and Witham found **39.3%** of 1000 random US scientists in 1996 and **7.0%** of National Academy members in 1998 believing in a personal God. The 95% margin covers sampling only:
      $$1.96\sqrt{\frac{p(1-p)}{n}}\approx3\ \text{points}$$
      (for $p=0.393$, $n=1000$)
      Bias in who is sampled, who answers and how the question is worded is not in it.
    decoys:
      - body: |
          In 2009 Pew found AAAS members **7%** believing in God, 18% in a higher power and 41% in neither (US public 2006: 83%, 12%, 4%); Larson and Witham found **39.3%** of National Academy members in 1996 and **33%** of 1000 random US scientists in 1998 believing in a personal God. The 95% margin covers sampling only:
          $$1.96\sqrt{\frac{p(1-p)}{n}}\approx3\ \text{points}$$
          (for $p=0.393$, $n=1000$)
          Bias in who is sampled, who answers and how the question is worded is not in it.
        feedback: |
          The numbers are given to the wrong groups. 33% is the AAAS sample (Pew 2009), 39.3% the random list of 1000 (1996), and 7.0% the elite National Academy sample (1998). Different samples, so the numbers do not contradict each other.
      - body: |
          In 2009 Pew found AAAS members **33%** believing in God, 18% in a higher power and 41% in neither (US public 2006: 83%, 12%, 4%); Larson and Witham found **39.3%** of 1000 random US scientists in 1996 and **7.0%** of National Academy members in 1998 believing in a personal God. The 95% margin covers **every kind of error**:
          $$1.96\sqrt{\frac{p(1-p)}{n}}\approx3\ \text{points}$$
          (for $p=0.393$, $n=1000$)
          so a small margin shows the sample was fair.
        feedback: |
          The margin shrinks with $n$ but says nothing about bias: who was sampled, who answered, how the question was worded, what "God" meant to the respondent.
    explanation: |
      A new kind of evidence enters: facts about what people believe. The box keeps the figures tied to their groups and years, and separates sampling error from bias.

  - id: needham
    title: Needham and the theological thesis
    row: 3
    col: 3
    body: |
      According to Joseph Needham (1900-1995), China was long ahead of Europe in **technology** yet did not produce mathematical physics of the Galileo-Newton kind: the **Needham question**. According to Sivin it is a counterfactual about one history, so it may have no clean answer. According to Whitehead (1861-1947), the confidence that nature is orderly was in essence an unconscious inheritance from **medieval theology**; critics note that other cultures sought order too.
    decoys:
      - body: |
          According to Joseph Needham (1900-1995), China was long **behind** Europe in technology and so could not produce mathematical physics of the Galileo-Newton kind: the **Needham question**. According to Sivin it is a counterfactual about one history, so it may have no clean answer. According to Whitehead (1861-1947), the confidence that nature is orderly was in essence an unconscious inheritance from **medieval theology**.
        feedback: |
          The puzzle is that China was ahead in technology for centuries; had it been behind, there would be nothing to explain.
      - body: |
          According to Joseph Needham (1900-1995), China was long ahead of Europe in **technology** yet did not produce mathematical physics of the Galileo-Newton kind: the **Needham question**. According to Sivin it is a counterfactual about one history, so it may have no clean answer. According to Whitehead (1861-1947), the confidence that nature is orderly came from the **Puritan values** of 17th-century England.
        feedback: |
          Puritan values are Merton's thesis (1938), and he called them one important element. Whitehead pointed to the medieval theological belief in one rational creator.
    explanation: |
      The same question as the whole level seen from the other side: not science against religion, but how religious ideas may have shaped science.

  - id: laws
    title: Laws of nature
    row: 4
    col: 3
    body: |
      According to Descartes (1630), in essence, God laid down the laws as a king does in a kingdom; according to Needham, the Western idea grew from a **celestial lawgiver**. Kepler's third law (1619), with $T$ the period in years and $a$ the semi-major axis in astronomical units, is
      $$T^2=k\,a^3,\quad k=1$$
      so Jupiter at $a=5.2$ has $T\approx11.86$ years. According to the Humean best system (Lewis) a law is the regularity in the **simplest and strongest summary** of the facts, with no ruler behind it; according to Armstrong a law **governs**.
    decoys:
      - body: |
          According to Descartes (1630), in essence, God laid down the laws as a king does in a kingdom; according to Needham, the Western idea grew from a **celestial lawgiver**. Kepler's third law (1619), with $T$ the period in years and $a$ the semi-major axis in astronomical units, is
          $$T^2=k\,a^2,\quad k=1$$
          so Jupiter at $a=5.2$ has $T\approx5.2$ years. According to the Humean best system (Lewis) a law is the regularity in the **simplest and strongest summary** of the facts, with no ruler behind it; according to Armstrong a law **governs**.
        feedback: |
          The exponent is 3, not 2. Jupiter takes about 11.86 years ($5.2^{3/2}$), far more than 5.2.
      - body: |
          According to Descartes (1630), in essence, God laid down the laws as a king does in a kingdom; according to Needham, the Western idea grew from a **celestial lawgiver**. Kepler's third law (1619), with $T$ the period in years and $a$ the semi-major axis in astronomical units, is
          $$T^2=k\,a^3,\quad k=1$$
          so Jupiter at $a=5.2$ has $T\approx11.86$ years. According to the Humean best system (Lewis) a law **governs** events from behind the facts; according to Armstrong a law is the regularity in the **simplest and strongest summary** of the facts.
        feedback: |
          The views are swapped. The Humean best system has no ruler behind the facts, a law being the best summary; Armstrong's view is the governing one.
    explanation: |
      Whether laws are decrees, summaries or governors is where the origin of science, the miracle question (a violation of what?) and divine action all meet.

