outroTitle: Level 9 in one picture
outro: |
  **Barbour's** four models (Conflict, Independence, Dialogue, Integration) and **Gould's NOMA** ($D_S\cap D_R=\varnothing$, yet $D_S\cup D_R\neq$ all inquiry) are tested on cases. **Galileo**: Bellarmine asked for a demonstration, Galileo's *Letter to Christina* put the Earth's motion in $D_S$, the consultors saw a Conflict. **Darwin**: selection multiplies the odds by $w$ each generation, and the three layers (science, metaphysics, theology) keep the debate straight. **Hume's** weighing in odds form gives a likelihood ratio $1/q^{\,n}$ for $n$ independent witnesses, with the prior from the worldview. **Divine action** proposals (quantum, chaos, whole-part) turn on epistemic versus ontological openness. **Surveys** report a share for a group in a year, and the margin $1.96\sqrt{p(1-p)/n}$ does not cover bias. The **Needham question** and the views of laws (decree, best system, governing) ask why science arose and what a law is. People part ways on whether religion makes claims about the world, on the prior for a miracle, on whether the laws are open, and on whether the origin of science settles anything.
