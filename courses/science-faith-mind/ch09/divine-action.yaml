id: ch09-divine-action
title: "How Could God Act in the World?"
kind: concept
own: |
  The setting: a world governed by laws, and a God who, according to theists, acts in it. The **problem of divine action** is how God could act in particular events without breaking or ignoring the laws. An **interventionist** proposal says God sometimes overrides the laws; a **non-interventionist** proposal says God acts within what the laws leave open. Three non-interventionist proposals were developed in the Vatican Observatory and CTNS research programme (a series of five volumes, 1993 to 2001).
  - **Quantum indeterminacy** (according to Robert John Russell): if nature is really indeterministic at the quantum level, the laws give only probabilities for outcomes, and God could act in the choice among them while the statistics stay as the theory says. Cost: whether quantum events are really indeterministic depends on the interpretation (collapse theories say yes; Bohmian mechanics and many-worlds have deterministic fundamental laws), and God's action leaves no detectable signature. This is a {{ **gap in the laws** }}, which is not evidence that a gap is filled.
  - **Chaos** (according to John Polkinghorne, 1930-2021, who linked it to "active information"): for a map such as the logistic map with $r=3.9$ on numbers $x$ between 0 and 1,
  {{ $$x_{n+1}=r\,x_n(1-x_n)$$ }}
  two starts that differ by a tiny gap $\delta_0$ drift apart roughly as
  {{ $$\delta_n \approx \delta_0\,e^{\lambda n}\quad(\lambda>0)$$ }}
  so the number of steps before they differ visibly grows only like $\ln(1/\delta_0)$ (about 4 extra steps per factor of ten in the starting gap, in the example run). Cost: the equations are deterministic, so the unpredictability is called {{ **epistemic** }} (a limit of our knowledge) unless one adds that the laws are open; Polkinghorne makes that further, metaphysical step.
  - **Top-down (whole-part) causation** (according to Arthur Peacocke, 1924-2006, and George Ellis, born 1939): the state of a whole system can constrain the behaviour of its parts, as the program running on a computer shapes which transistors switch; God could act on the world-as-a-whole in the same way. Cost: critics such as Thomas Tracy argue that each known example can be redescribed bottom-up, so it is unclear that it adds causation beyond the laws.
  - **Where people part ways.** Which cost is acceptable depends on a metaphysical premise (are the laws open, or complete?) and on a value (must God's action be detectable, or is hidden action enough?). These are layer-3 commitments, not results of physics.
cards:
  - type: mcq
    id: hook
    title: "Guess: acting without breaking the laws"
    prompt: |
      Many believers hold that God acts in particular events, answering a prayer or healing someone, yet the physical world seems to run by laws. Before any theory, guess: could God act in a law-governed world **without breaking any law**?
    options:
      - text: 'Several scholars say yes, by proposing places where the laws leave room; others reply that each proposal has a price. How big the price is depends on what one assumes about the laws.'
        correct: true
        feedback: |
          Yes, and that is the shape of the lesson: three proposals, each with a cost, and no agreed winner. Some thinkers also accept that God sometimes overrides the laws, and that is a different view.
      - text: 'No, a law that can be bypassed or filled in is no law, so the question has no serious answer.'
        feedback: |
          This is one position (some philosophers hold it), but it assumes laws are exceptionless and complete. Whether they are is exactly what the proposals dispute.
      - text: 'Yes, trivially, because physics says nothing about God, so there is nothing to reconcile.'
        feedback: |
          Tempting, and some theologians take this line. But a claim that God acts *in an event* is a claim about what causes that event, and then the laws that describe the event are in play.
    explanation: |
      We will tell the proposals apart by a simple question each time: where exactly do the laws leave room, and what does using that room cost?

  - type: text
    id: recall
    title: "Recall: what a miracle needs"
    body: |
      Recall: according to David Hume (1711-1776), a miracle is a violation of a law of nature, and a wise person weighs the improbability of a violation against the chance that a witness is wrong or lying. In the lesson on weighing a miracle report, we saw that this weighing can be done with numbers: a tiny prior chance of the event can be outweighed by enough independent witnesses.

      Another view says that a law describes what happens when nothing interferes with the system. On this reading, if God acts, the law is not broken; its condition "nothing interferes" simply was not met. Then a miracle need not be a violation. This is a conceptual point (layer 2: live debate), and it raises the question of this lesson: if God acts, **how**?

  - type: mcq
    id: interventionist
    title: "Two kinds of proposal"
    prompt: |
      Philosophers of science and theologians sort proposals for divine action into two groups. An **interventionist** proposal says that God sometimes overrides or suspends the usual course of nature. A **non-interventionist** proposal says that God acts within what the laws leave open, so that no law is overridden. Which statement fits a non-interventionist proposal?
    options:
      - text: 'God acts at a point where the laws, as physics states them, do not fix the outcome, so every law still holds.'
        correct: true
        feedback: |
          Yes. The proposal needs some such point: a place where the laws allow more than one outcome, or where a system depends so delicately on tiny inputs that a small input changes the result, or where a whole constrains its parts without any law being overridden.
      - text: 'God makes an event happen that the laws say is impossible.'
        feedback: |
          That is the interventionist (miracle as violation) picture: the law says the event cannot happen, and it happens anyway.
      - text: 'God acts only through human beings, so physics never comes into it.'
        feedback: |
          Some theologians hold that God acts through human agents. But this is a different question: it does not say how God acts in events where humans are not involved, such as mutations or a storm.
    explanation: |
      Non-interventionist proposals are attractive to people who respect the completeness of physics and still want divine action in the world. Their question is always the same: where is the room?

  - type: text
    id: quantum
    title: "Proposal 1: quantum indeterminacy"
    body: |
      The first proposal looks for room in the laws of quantum theory. In the standard textbook account, quantum theory gives only the **probabilities** of the outcomes of a measurement, not which outcome occurs (for example, which of two detectors clicks). If that is a feature of the world itself and not just of our ignorance, then the laws leave room: several outcomes are allowed, and each has a probability.

      The theologian and physicist Robert John Russell, who founded the Center for Theology and the Natural Sciences (CTNS) at Berkeley, argued that this makes room for what he calls non-interventionist objective divine action: God acts in and through the quantum events, choosing among the allowed outcomes, so no law is broken. Russell, Nancey Murphy and others took part in a research programme run jointly by the Vatican Observatory and CTNS; it produced five volumes of essays, 1993 to 2001, each on one area of science and divine action, from quantum cosmology to neuroscience.

      Russell is explicit that this is one proposal and that he does not exclude other levels of divine action.

  - type: mcq
    id: quantum-cost
    title: "The first cost"
    prompt: |
      A critic of the quantum proposal says: "The proposal needs quantum events to be truly indeterministic. But physicists do not agree on that." Which statement is accurate?
    options:
      - text: 'It depends on the interpretation of quantum theory: in collapse theories outcomes are genuinely chancy; in Bohmian mechanics and the many-worlds view the fundamental laws are deterministic, so they leave no such room.'
        correct: true
        feedback: |
          Yes. The equations and their predictions are the same across these views; what differs is whether the laws are indeterministic at bottom. That is a layer-2 question (live debate), and the quantum proposal stands or falls with one answer.
      - text: 'Quantum theory has been proved deterministic, so the proposal fails.'
        feedback: |
          Not proved. Bell-type experiments rule out some local deterministic explanations, not every deterministic interpretation; Bohmian mechanics is deterministic but non-local.
      - text: 'Quantum theory has been proved indeterministic, so the proposal is secure.'
        feedback: |
          Also not proved. The standard formalism is probabilistic, but whether that probability is fundamental is exactly what the interpretations disagree about.
    explanation: |
      The proposal is also modest in what it claims: it says the laws allow room (if one interpretation is right), not that any outcome is God's doing.

  - type: mcq
    id: quantum-signature
    title: "No signature"
    prompt: |
      Suppose God acts by selecting outcomes among those the quantum laws allow, and the statistics of outcomes stay exactly what quantum theory predicts. A detector records a long list of clicks. What could a scientist read from the list about God's action?
    options:
      - text: 'Nothing: a list produced by chance and a list produced by divine choice with the same statistics look the same, so the action leaves no detectable mark.'
        correct: true
        feedback: |
          Yes. That is why the proposal does not conflict with experiment, and also why it cannot be tested by experiment. Defenders accept this as the price of non-intervention; critics say a form of action that leaves no trace seems a God-of-the-gaps with no gap to point to.
      - text: 'That the list contains too many 1s, because a God would favour some outcomes.'
        feedback: |
          If God changed the statistics, the laws would be violated, and the proposal would turn into an interventionist one. The non-interventionist version keeps the statistics fixed.
      - text: 'That every click was chosen by God, since chance cannot produce a list.'
        feedback: |
          Chance does produce such lists; that is what the standard theory says. A detector record is equally consistent with no divine choice at all.
    explanation: |
      Two readings of this fact. A believer may say the hiddenness is expected (a God who respects the laws will not leave a mark). A sceptic may say a hypothesis that can never be tested adds nothing. Both agree on the logical point.

  - type: text
    id: chaos-intro
    title: "Proposal 2: chaos"
    body: |
      The second proposal starts from classical physics, where quantum effects are tiny. A **chaotic** system is a deterministic one in which a very small difference in the starting state grows quickly (roughly exponentially) until the two histories look unrelated. Weather is the usual example. The textbook case is the **logistic map**: from a number $x$ between 0 and 1, the next number is

      {{ $$x_{n+1}=r\,x_n(1-x_n)$$ }}

      where $r$ is a fixed number between 0 and 4 and $n$ counts the steps. Before looking, guess: take $r=3.9$ and two starting values that differ by only one part in a million. After how many steps would you expect them to differ by a tenth, 5, 20 or 200?

  - type: widget
    id: widget-chaos
    title: "Two almost identical starts"
    widget: chaos-sensitivity
    config:
      r: 3.9
      gap: 1.0e-6
      x0: 0.2
      steps: 60
      threshold: 0.1
      presets:
        - { label: "Regular r = 2.8", r: 2.8 }
        - { label: "Gap 1e-12", gap: 1.0e-12 }
    body: |
      State **a** (blue) and state **b** (orange) start with a difference called the start gap. Watch the gap plot on a log scale and the readout of the first step where the gap exceeds a tenth. Try the start gap slider, then the preset "Regular r = 2.8", then back. The numbers are computed in ordinary double precision (about 16 digits).

  - type: mcq
    id: widget-read
    title: "What the widget showed"
    review: false
    prompt: |
      With $r=3.9$ and a start gap of one in a million, the two states differ visibly after about 20 steps, and with $r=2.8$ they never separate. What does the second fact show?
    options:
      - text: 'Sensitivity is a property of the map and its parameter: for $r=2.8$ the two histories converge, so small differences do not grow.'
        correct: true
        feedback: |
          Yes. Chaos is not a feature of every system, only of some. For $r=2.8$ the map settles to a steady value and tiny differences die out; for $r=3.9$ they are amplified.
      - text: 'The two states at $r=2.8$ are exactly equal from the start.'
        feedback: |
          They start a little apart. The gap shrinks to the size of the rounding error, so they become the same number to the precision of the computer.
      - text: 'Randomness is switched on for $r=3.9$ and off for $r=2.8$.'
        feedback: |
          Nothing random is used in either run. The same fixed rule produces both pictures, which is the heart of the lesson: determinism does not mean predictability.
    explanation: |
      Keep this last point: the rule is fixed and has no chance in it, yet a tiny difference in the start gives a large difference later.

  - type: numeric
    id: steps-estimate
    title: "How far back can a tiny input matter?"
    prompt: |
      In the logistic map with $r=3.9$ and the start $x_0=0.2$, two states that start one in a million apart ($10^{-6}$) differ by more than 0.1 after 22 steps. Each factor of 1000 in the start gap costs about 11 more steps. After how many steps do two states that start only $10^{-12}$ apart first differ by more than 0.1?
    answer: 44
    tolerance: 2
    answerText: '44'
    wrong:
      - value: 22
        feedback: |
          A smaller start gap does not stop the growth, it only delays it. Going from $10^{-6}$ to $10^{-12}$ is a factor of $10^6$.
      - value: 220
        feedback: |
          The delay is added step by step, not multiplied. Growth by a fixed factor each step means the number of steps grows like the logarithm of the gap.
    hint: 'From $10^{-6}$ to $10^{-12}$ is two factors of 1000, each costing about 11 steps.'
    explanation: |
      Two factors of 1000 add about $2\times 11 = 22$ steps, so about $22 + 22 = 44$ (the computed value is exactly 44). Growth by a fixed factor each step means steps grow like the logarithm of $1/\text{gap}$. A gap of $10^{-12}$ is already beyond any measurement, yet it matters after 44 steps.

  - type: text
    id: polkinghorne
    title: "Chaos and divine action"
    image:
      src: img/polkinghorne.webp
      alt: "Portrait of John Polkinghorne in 2007"
      caption: "John Polkinghorne (1930-2021) left a chair of mathematical physics at Cambridge to become an Anglican priest, and argued that physics leaves room for divine action."
      credit: "Jack1956, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:John_Polkinghorne_2007_(3x4_cropped).jpg"
    body: |
      John Polkinghorne (1930-2021), a theoretical physicist at Cambridge before he became an Anglican priest, proposed (for example in his book *Science and Providence*, 1989, and in his essay "The Metaphysics of Divine Action" in the 1995 volume *Chaos and Complexity* of the Vatican Observatory and CTNS series) that the unpredictability of chaotic systems may mark real openness in nature. On his view, God could act by supplying what he called **active information**: a pattern or guidance, not a push of energy, that selects among the futures a chaotic system could take. The idea is to act without adding any force and without breaking any law.

      Notice the logic. A tiny input has a large effect, as the widget showed. If the world is full of systems like this, then a tiny divine nudge could change the large-scale course of events, and the nudge would be too small to detect.

  - type: mcq
    id: chaos-cost
    title: "The second cost"
    prompt: |
      Classical chaos is described by deterministic equations such as the logistic map: the start fixes every later state. A critic, such as the philosopher Thomas Tracy, replies to the chaos proposal that chaos theory, by itself, does not give the needed openness. Which sentence states the objection?
    options:
      - text: 'Chaotic unpredictability is a limit on what we can know about the start, and a deterministic law leaves no room for any divine input unless the laws themselves are open.'
        correct: true
        feedback: |
          Yes. The word is **epistemic**: unpredictability for us. Polkinghorne replies that the unpredictability points to something real in nature (an ontological openness), but then he is adding a metaphysical premise that chaos theory alone does not supply.
      - text: 'Chaotic systems have no mathematical description, so physics cannot say anything about them.'
        feedback: |
          They have an exact description: the logistic map above is a complete rule. What is hard is long-range prediction, not description.
      - text: 'Chaos only occurs in computers, never in nature.'
        feedback: |
          Weather and many other natural systems are modelled as chaotic. The objection is not that chaos is absent from nature, but about what it implies for the laws.
    explanation: |
      The two views side by side. Tracy: chaos presupposes unbroken determinism, so a nudge would be a break in the laws. Polkinghorne: the limits of prediction point to a real feature of the world, so the laws as we state them are not the whole story. Which is right is not settled by mathematics, but by a decision about the status of the laws (layer 3).

  - type: text
    id: topdown
    title: "Proposal 3: top-down causation"
    body: |
      The third proposal looks for room not in the smallest parts but in the whole. In **top-down** (or **whole-part**) causation, the state of a whole system constrains what its parts do. Think of a program running on a computer: the program, a high-level pattern, determines which transistors switch, yet each transistor still obeys physics.

      The biochemist and Anglican priest Arthur Peacocke (1924-2006), in books such as *Theology for a Scientific Age* (1990), proposed that God acts on the world-as-a-whole, and the effect reaches individual events in the way a whole shapes its parts. He later preferred the term "whole-part influence" to avoid suggesting that something pushes from above. The cosmologist George F. R. Ellis (born 1939) argued that top-down causation is common in physics and biology, and that the way a computer's software shapes its hardware is a clear case. Ellis also wrote on divine action in the 1995 volume *Chaos and Complexity*, in a chapter on ordinary and extraordinary divine action.

      The model Peacocke called the best analogy is the way a person's mind and intentions act on the body.

  - type: mcq
    id: topdown-example
    title: "Spot the whole-part case"
    prompt: |
      Which example matches the idea of whole-part constraint described above, where the state of a whole system shapes how its parts behave?
    options:
      - text: 'A computer program: the high-level program, which is a pattern, decides which transistors switch, though each transistor obeys ordinary physics.'
        correct: true
        feedback: |
          Yes. The pattern at the level of the whole acts as a constraint on the parts, and no physical law is broken at the level of the parts.
      - text: 'A single particle struck by another particle.'
        feedback: |
          That is ordinary bottom-up causation between two parts. There is no whole involved.
      - text: 'A billiard ball that stops because a person catches it.'
        feedback: |
          This is one object acting on another, a push between parts of the same kind. A whole constraining its parts would be something like the form of a running program or the arrangement of a living cell.
    explanation: |
      Notice what is claimed: the whole is not an extra force; it fixes the setting in which the parts move. Whether that is genuinely a new kind of cause is the next question.

  - type: mcq
    id: topdown-cost
    title: "The third cost"
    prompt: |
      Thomas Tracy and others raise an objection to using whole-part causation for divine action: every known example, such as the running program, can be redescribed as the parts obeying their own laws, with the pattern merely describing how the parts happen to be arranged. What does this objection claim?
    options:
      - text: 'It is unclear that whole-part causation adds any causation beyond the laws of the parts, so it may not leave room for God to act in a way that makes a difference.'
        correct: true
        feedback: |
          Yes. If a bottom-up account is complete, the whole contributes only a description. Defenders (Ellis among them) reply that the pattern is a genuine cause because the same parts would do something else under another pattern.
      - text: 'Whole-part causation violates the laws of physics.'
        feedback: |
          The proposal is meant not to violate any law, and critics do not claim it does. Their worry is whether it explains anything beyond the laws.
      - text: 'Whole-part causation has been shown to be impossible.'
        feedback: |
          No one has shown that. The dispute is about whether the redescription is complete or leaves something out.
    explanation: |
      The pattern of dispute repeats: the proposal works if one accepts one premise about what counts as a cause, and fails if one accepts the opposite.

  - type: mcq
    id: trap-chaos
    title: "Trap: chaos means chance"
    prompt: |
      A student says: "Chaotic systems are random, so nothing in them is determined, and God can act in the randomness." Which reply is best?
    options:
      - text: 'Classical chaos is deterministic: the start fixes everything. The unpredictability comes from tiny differences growing, which no one can measure. Any real openness needs a further premise.'
        correct: true
        feedback: |
          Yes. The widget used a fixed rule with no chance and still gave different outcomes for nearly equal starts.
      - text: 'Chaotic systems are random, but only when the starts are measured badly.'
        feedback: |
          A perfect measurement (if one existed) would make the system fully predictable under the classical rule. Randomness is not what appears; sensitivity is.
      - text: 'Chaos and quantum indeterminacy are the same thing.'
        feedback: |
          They are different: chaos is sensitivity inside a deterministic rule, while quantum indeterminacy (in some interpretations) is chance in the rule itself.
    explanation: |
      Chaos does not give randomness for free. Some thinkers combine it with quantum effects (a quantum difference in the start grows to a large one); that mixed case inherits the interpretation question of Proposal 1.

  - type: mcq
    id: trap-gap
    title: "Trap: a gap is God"
    prompt: |
      A reader concludes: "Quantum theory has gaps, so God acts in the gaps." Which statement identifies the error?
    options:
      - text: 'A gap shows only that the laws permit more than one outcome. Whether anything, divine or not, chooses among them is a separate claim that the physics neither supports nor refutes.'
        correct: true
        feedback: |
          Yes. The proposal is a possibility result (layer 3 to fill the room, layer 2 whether there is room). Defenders say exactly this: they offer a way action could be consistent with the laws, not proof that it happens.
      - text: 'Quantum theory has no gaps, so there is nothing to discuss.'
        feedback: |
          The standard formalism gives probabilities, not single outcomes. That is room, if the probability is fundamental. The error is the next step, from room to God.
      - text: 'God cannot act in any physical event.'
        feedback: |
          This is a separate claim, held by some philosophers and by some theologians, but it is not the point of this trap.
    explanation: |
      The logic is: room, then a claim that the room is used. Observation can in principle test the first step (does the law leave room?), while the second is a matter of faith or metaphysics.

  - type: mcq
    id: common-feature
    title: "What the proposals share"
    prompt: |
      Which statements are true of **all three** proposals (quantum, chaos, whole-part)? Select all that apply.
    multiple: true
    options:
      - text: 'Each tries to place divine action where the laws as physics states them are not broken.'
        correct: true
        feedback: |
          Yes, they are non-interventionist by design.
      - text: 'Each depends on a further premise that physics alone does not settle (the interpretation of quantum theory, the openness of the laws, or what counts as a cause).'
        correct: true
        feedback: |
          Yes. That is why a scientist and a theologian can both read the same physics and judge the proposals differently.
      - text: 'Each yields a detectable signature that experiments could use to show God acts.'
        feedback: |
          The opposite: each is built so that the action does not change what the laws predict, so detection is not expected.
      - text: 'Each has been confirmed by experiment.'
        feedback: |
          They are philosophical and theological proposals about what the physics allows. None has been confirmed as an account of what actually happens.
    explanation: |
      Compare: a proposal with a detectable signature would be testable but would conflict with the laws, and so be interventionist.

  - type: text
    id: costs
    title: "What each costs"
    body: |
      Putting the three side by side, with the proposer to credit and the main objection:

      | Proposal | Where the room is | Main cost |
      |---|---|---|
      | Quantum indeterminacy (Russell) | Outcomes the laws leave open | Depends on the interpretation; no signature |
      | Chaos (Polkinghorne) | Tiny inputs with large effects | Deterministic, so epistemic unless the laws are open |
      | Whole-part (Peacocke, Ellis) | A whole constrains its parts | May add no causation beyond the laws |

      A reader can see how the costs differ in kind: the first is about physics (which interpretation), the second about the status of the laws, the third about what a cause is.

  - type: mcq
    id: part-ways
    title: "Where thoughtful people part ways"
    prompt: |
      A physicist who thinks the laws are complete and deterministic, and a theologian who thinks the laws describe only part of reality, read the same three proposals. Which pair of statements gives the real source of their disagreement?
    options:
      - text: 'They disagree about a premise (whether the laws are the whole causal story) and about a value (whether divine action that no experiment could detect is acceptable). Neither is a result of physics.'
        correct: true
        feedback: |
          Yes. The physics is the same for both. One weighs the cost "no detection, no extra cause" as a defect; the other as the expected form of a God who respects nature.
      - text: 'One of them has misread the equations.'
        feedback: |
          They can agree on every equation and prediction. The disagreement is about what the equations leave out, not what they say.
      - text: 'Only one of them has studied physics, so only one can judge.'
        feedback: |
          Both Polkinghorne and Ellis are physicists, and critics such as Tracy are philosophers; the camps do not follow training.
    explanation: |
      A believer may find the proposals show that divine action is not excluded by science; a sceptic may find them to show that it can only be added by assumption; a third reader may take divine action as unneeded or find the question ill-formed. The lesson shows where the premises sit, and leaves the choice open.

  - type: text
    id: summary
    body: |
      **Next:** Level 9 continues with the surveys behind the "science against religion" story: what scientists actually believe, why some are religious and others atheists, and why the data do not settle the question. In the lesson Religious Scientists and Scientific Atheists, we ask what a poll can and cannot show.
