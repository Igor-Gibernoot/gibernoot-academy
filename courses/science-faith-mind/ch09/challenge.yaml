id: ch09-challenge
title: "Level Challenge: Reading the Case (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: three cases, one toolkit"
    body: |
      Each problem takes an invented case in the style of the level and asks you to read it with the level's tools. The problems are independent, so the toolkit is restated here. Every number is made up to practise the method.

      - **Domains.** Let $D_S$ be the set of questions science treats as its own and $D_R$ the set a religion treats as its own. According to Barbour, the four models are *Conflict* (the domains share ground and give incompatible answers), *Independence* (Gould's NOMA, no overlap), *Dialogue* (separate, but meeting at boundary questions) and *Integration* (one joined picture):
      $$D_S\cap D_R\neq\varnothing\ \text{(conflict)}$$
      $$D_S\cap D_R=\varnothing\ \text{(independence)}$$
      - **Hypothesis versus demonstration.** According to Cardinal Bellarmine's letter of 1615, a model that only saves the appearances (fits the observations) is a hypothesis; to read it as physical truth he asked for a real demonstration.
      - **Odds form.** Let $M$ be an event that breaks a law of nature, $E$ "a witness reports $M$", $P(M)$ the prior and $q=P(E\mid\neg M)$ the chance of a false report. Then
      $$\frac{P(M\mid E)}{P(\neg M\mid E)}=\frac{P(E\mid M)}{P(E\mid\neg M)}\cdot\frac{P(M)}{P(\neg M)}$$
      For $n$ independent witnesses with $P(E\mid M)=1$ the likelihood ratio is $1/q^{\,n}$, and the least $n$ with posterior odds of at least 1 (for small $P(M)$) satisfies
      $$n\ \ge\ \frac{\ln(1/P(M))}{\ln(1/q)}$$
      - **Survey margin.** For a random sample of size $n$ with share $p$, the 95% sampling margin is about $1.96\sqrt{p(1-p)/n}$. It does not cover who was sampled, who answered, or how the question was worded.
      - **Divine action and laws.** A gap in our *knowledge* of a system (chaos: tiny differences grow, so prediction fails) is **epistemic**; a gap in the *laws themselves* is **ontological**. Laws may be read as decrees of a lawgiver (Descartes, Needham) or, with the Humean best-system view, as the simplest and strongest summary of the facts.
      - **Three layers:** established fact, live debate, faith or metaphysical commitment.

      Three problems here. Problems 4 and 5 come in part 2.

  # ---------------- Problem 1 ----------------
  - type: text
    id: p1-setup
    title: "Problem 1 · A model of a comet"
    body: |
      **Problem 1.** An astronomer, Dr. Reyes, fits a model of a newly found comet and shows that it reproduces every position recorded over two years. A reviewer replies: "Your model saves the appearances, but you have not shown the comet moves that way. A rival model, with a different path, fits the same positions equally well." Dr. Reyes answers that the fit is good, so the path is simply true.

      Separately, a local preacher says the comet is a sign of a coming disaster, and a physicist in the audience says it is a ball of ice and dust on an orbit and means nothing at all.

      Her task: read the scientific dispute with Bellarmine's condition, then place the preacher and the physicist in the four models.

  - type: mcq
    id: p1-status
    title: "What is the status of the model?"
    prompt: |
      Two models fit all the recorded positions equally well. According to Bellarmine's condition, what is the right status for Dr. Reyes's model today?
    options:
      - text: 'A hypothesis that saves the appearances: it is a useful calculation, and nothing in the fit alone chooses it over the rival.'
        correct: true
      - text: 'A demonstrated physical truth, because it matches every measurement.'
        feedback: |
          This is the slip the reviewer names. A fit shows the model is *consistent* with the data, not that it is the only model that is. When two rivals fit equally, the fit cannot choose between them.
      - text: 'False, because a model that merely fits is worthless.'
        feedback: |
          Bellarmine did not call such a model worthless: he allowed it as a way to calculate and predict. What he refused was the step from "it fits" to "it is the physical truth".
    explanation: |
      Equal fit between rivals is the standard case of underdetermination. The model can be used, and it can be true, but it has not yet been shown to be true. A **demonstration** is something that separates the rivals.

  - type: order
    id: p1-order
    title: "Order the steps of the condition"
    prompt: |
      Put the steps in the order the condition asks for them, from the first fit to a conclusion Bellarmine would have accepted.
    steps:
      - 'The model reproduces every recorded position of the comet.'
      - 'A rival model with a different path reproduces them equally well, so the fit alone does not choose.'
      - 'The model is treated as a hypothesis that saves the appearances, not as established fact.'
      - 'A new observation, which the two models predict differently, agrees with one of them.'
      - 'Only now is the model read as physical truth, and any reading of a text that clashed with it is reconsidered.'
    hint: 'The condition has a gate: no demonstration, no step to physical truth.'
    explanation: |
      The order matters: a demonstration has to come **before** the claim of truth, and the demonstration is a test the rivals do not both pass. Bellarmine's last clause is the part often forgotten: once a real demonstration exists, the text is to be reread, not the demonstration dropped.

  - type: mcq
    id: p1-domains
    title: "Preacher and physicist in the four models"
    prompt: |
      Take the question "What path does the comet follow?" and the question "What does the comet's appearance mean for human life?" Which description is accurate?
    options:
      - text: 'The path belongs to $D_S$. The meaning question is, for the preacher, a $D_R$ question. If the preacher also claims a prediction about the path or about a disaster caused by the comet, that claim enters $D_S$ and a Conflict arises; if the preacher keeps to meaning and the physicist to the orbit, Independence holds.'
        correct: true
      - text: 'Both questions belong to $D_S$, since the comet is a physical object.'
        feedback: |
          The comet is physical, but "what it means for human life" is not settled by orbits and spectra. Whether a meaning question is one science can answer is itself part of the dispute among the four models.
      - text: 'Both questions belong to $D_R$, since the preacher asked them.'
        feedback: |
          Who asks a question does not decide which domain owns it. The path has a measurable answer, which places it in $D_S$.
    explanation: |
      The same case is Conflict or Independence depending on **what each speaker claims**. A preacher's claim that the comet *causes* a disaster is a claim about the world and can be tested; a claim about its meaning is not tested by a telescope. Note also the physicist's "means nothing at all": that is a further claim, about meaning, which no orbit can establish, and so it steps outside $D_S$.

  - type: mcq
    id: p1-evidence
    title: "What would change the reading?"
    prompt: |
      The two models predict different positions for the comet six months from now, one of them differing by a visible amount. What does this do to the dispute?
    options:
      - text: 'It supplies the demonstration the condition asks for: a prediction the rivals do not share, which the comet will either meet or miss. If one model misses, the other has passed a test the first failed.'
        correct: true
      - text: 'Nothing: models can never be told apart by observation.'
        feedback: |
          Underdetermination is about the evidence *so far*. A new observation on which the rivals disagree is exactly what breaks it, as with the parallax of nearby stars for the rival world systems.
      - text: 'It proves the surviving model true for all time.'
        feedback: |
          Passing one test makes the model better supported, not proved. A third model might fit as well, and the status stays "best supported so far".
    explanation: |
      A demonstration in this sense is a test that rivals fail differently. It raises support without ending inquiry, which is why the reading of the case is open to change.

  - type: mcq
    id: p1-laws
    title: "Does the lawgiver question change the test?"
    prompt: |
      Dr. Reyes calls the winning path "the law of this comet". Suppose she reads laws as decrees of a divine lawgiver (as Descartes did), and a colleague reads them as the simplest, strongest summary of the facts (the best-system view). Does the choice change what counts as a demonstration of the path?
    options:
      - text: 'No. Both read the same observations and the same test; they differ on what a law is, which is a layer 3 commitment, not on how the orbit is demonstrated.'
        correct: true
      - text: 'Yes: the lawgiver reading makes the path true without a test, because God decreed it.'
        feedback: |
          Descartes himself held that God's decrees are learned from the world, so the path still has to be found by observation. Which path was decreed is exactly what the test tells us.
      - text: 'Yes: on the best-system view no orbit can be demonstrated, since laws are only summaries.'
        feedback: |
          A summary can be better or worse supported. The best-system view changes what a law *is*, not whether the data can tell two summaries apart.
    explanation: |
      Both views agree on the evidence for the path and disagree on whether anything stands behind the law. The first is layer 1 to 2, the second layer 3.

  # ---------------- Problem 2 ----------------
  - type: text
    id: p2-setup
    title: "Problem 2 · Witnesses to a law-breaking event"
    body: |
      **Problem 2.** A report says that an event $M$ occurred which, if real, would break a known law. A skeptic sets the prior at $P(M)=10^{-8}$. Each witness, working independently, would falsely report $M$ with chance $q=2\times10^{-3}$ if it did not happen, and would report it for certain if it did, $P(E\mid M)=1$.

      Use the odds form and take the prior odds as $P(M)$, which is accurate for a prior this small.

  - type: numeric
    id: p2-lr
    title: "The weight of three witnesses"
    prompt: |
      Three independent witnesses report $M$. Find the likelihood ratio $1/q^{\,3}$, in units of $10^{8}$ (so $2.5$ would mean $2.5\times10^{8}$).
    answer: 1.25
    tolerance: 0.005
    answerText: '1.25'
    wrong:
      - { value: 5, feedback: 'You may have computed $1/q^{2}=2.5\times10^{5}$ or multiplied $q$ by 3. The ratio is $1/q^{3}$: $q^{3}=8\times10^{-9}$, so $1/q^{3}=1.25\times10^{8}$.' }
    hint: '$q^{3}=(2\times10^{-3})^{3}=8\times10^{-9}$.'
    explanation: |
      $$q^{3}=8\times10^{-9}\ \Rightarrow\ \frac1{q^{3}}=1.25\times10^{8}$$
      Each independent witness multiplies the weight by $1/q=500$, so three give $500^{3}=1.25\times10^{8}$.

  - type: numeric
    id: p2-n
    title: "How many witnesses are enough?"
    prompt: |
      Use $n\ge \ln(1/P(M))/\ln(1/q)$ to find the least whole number of independent witnesses for which the posterior odds reach 1 (even odds).
    answer: 3
    tolerance: 0.001
    answerText: '3'
    wrong:
      - { value: 2.96, feedback: 'That is the value of the formula; witnesses come whole, so round **up** to 3. Check: with 2 witnesses the ratio is $2.5\times10^{5}$, times the prior $10^{-8}$ gives odds of only $2.5\times10^{-3}$.' }
      - { value: 2, feedback: 'With 2 witnesses the posterior odds are $2.5\times10^{5}\times10^{-8}=2.5\times10^{-3}$, far below 1.' }
    hint: '$\ln(10^{8})\approx18.42$ and $\ln(500)\approx6.21$.'
    explanation: |
      $$n\ \ge\ \frac{\ln(10^{8})}{\ln(500)}\approx\frac{18.42}{6.215}\approx2.96$$
      so $n=3$. With three witnesses the posterior odds are $1.25\times10^{8}\times10^{-8}=1.25$, a probability of about $0.56$: barely better than even.

  - type: numeric
    id: p2-reliab
    title: "When witnesses are not certain"
    prompt: |
      Now suppose each truthful witness reports the real event only with chance $P(E\mid M)=0.9$. The likelihood ratio becomes $0.9^{\,n}/q^{\,n}$. What is the least whole $n$ for which the posterior odds reach 1?
    answer: 4
    tolerance: 0.001
    answerText: '4'
    wrong:
      - { value: 3, feedback: 'With $n=3$ the ratio is $0.729\times1.25\times10^{8}$, so the odds are $0.729\times1.25=0.91$, just under 1. A small drop in reliability pushes the answer from 3 up to 4.' }
    hint: 'Try $n=3$ and see whether the odds are above or below 1.'
    explanation: |
      For $n=3$: odds $=0.9^{3}\times1.25=0.911$, a probability of about $0.48$. For $n=4$: odds $=0.9^{4}/q^{4}\times10^{-8}=0.656\times6.25\times10^{2}\approx410$. The threshold is sensitive: the odds jump by a factor of about $500\times0.9=450$ per added witness, so one more witness is more than enough.

  - type: numeric
    id: p2-copy
    title: "Six witnesses, two sources"
    prompt: |
      Six people report $M$. On inspection, three of them heard the story from witness A and the other three from witness B, and A and B are independent. With $P(E\mid M)=1$ the effective number of independent witnesses is 2. Find the posterior odds, in units of $10^{-3}$ (so $2.5$ means $2.5\times10^{-3}$).
    answer: 2.5
    tolerance: 0.005
    answerText: '2.5'
    wrong:
      - { value: 1.25e5, feedback: 'That would count all six as independent, and the ratio would be $500^{6}$. Copies of a story add no new chance for an independent false report.' }
    hint: 'Count independent groups, not people.'
    explanation: |
      $$\frac1{q^{2}}\,P(M)=2.5\times10^{5}\times10^{-8}=2.5\times10^{-3}$$
      A probability of about $0.25\%$, far from even. Six reports of one story are weighed as two, which is the point of the independence condition (and of the criticism that supposedly independent witnesses often share a source).

  - type: mcq
    id: p2-open
    title: "The same data, two priors"
    prompt: |
      A theist, Dr. Okoye, holds that laws are *ontologically* open: nature is not complete in itself, and God can act without a violation, so she sets $P(M)=10^{-2}$. The skeptic keeps $10^{-8}$ and reads any unpredictability, as in chaos, as only *epistemic*. For the same $n=3$ witnesses ($1/q^{3}=1.25\times10^{8}$), the posterior odds are about $1.25\times10^{6}$ for Dr. Okoye and $1.25$ for the skeptic. What does this show?
    options:
      - text: 'The arithmetic agrees; the disagreement sits in the prior, which comes from a view of the laws (open or complete), a layer 3 commitment. The witnesses and $q$ alone do not settle it.'
        correct: true
      - text: 'Dr. Okoye has proved $M$, because her odds are higher.'
        feedback: |
          Her odds follow from her prior. Anyone who accepts the prior will accept the odds; the skeptic rejects the prior, not the arithmetic.
      - text: 'The skeptic has refuted $M$, since unpredictability in chaos is epistemic.'
        feedback: |
          Epistemic unpredictability does not show the laws are *closed* either. It is silent on whether the laws leave room; that is the further metaphysical step Polkinghorne makes and critics reject.
    explanation: |
      The inference is valid for both; its soundness turns on the prior. A prior of $10^{-2}$ from open laws and $10^{-8}$ from complete laws is not a measured number but a stand on a premise. A fair reader can say what each would need to change their mind, which is more useful than a verdict.

  # ---------------- Problem 3 ----------------
  - type: text
    id: p3-setup
    title: "Problem 3 · Two surveys of scientists"
    body: |
      **Problem 3.** Two surveys ask scientists whether they believe in God.

      - Survey A: 400 physicists who attended one conference, $p_A=0.28$ answered yes.
      - Survey B: a random list of 1600 university science faculty, $p_B=0.35$ answered yes.

      A newspaper writes "Scientists are split: physicists believe less than other scientists, and the surveys contradict each other." Your task: check the numbers, then the claims.

  - type: numeric
    id: p3-marginA
    title: "The margin of survey A"
    prompt: |
      Compute the 95% sampling margin $1.96\sqrt{p(1-p)/n}$ of survey A ($p=0.28$, $n=400$), in percentage points.
    answer: 4.4
    tolerance: 0.02
    answerText: '4.4'
    wrong:
      - { value: 2.3, feedback: 'That is the margin of survey B, with $n=1600$. Survey A has a quarter of the sample, so a margin twice as large.' }
    hint: '$p(1-p)=0.28\times0.72=0.2016$, and $0.2016/400=5.04\times10^{-4}$.'
    explanation: |
      $$1.96\sqrt{\frac{0.28\times0.72}{400}}=1.96\times0.0224=0.044$$
      so survey A reads $28\pm4.4$ points, a range of about 23.6% to 32.4%.

  - type: numeric
    id: p3-marginB
    title: "The margin of survey B"
    prompt: |
      Same formula for survey B ($p=0.35$, $n=1600$). Find the margin in percentage points.
    answer: 2.3
    tolerance: 0.02
    answerText: '2.3'
    hint: '$0.35\times0.65=0.2275$; divide by 1600 and take the square root.'
    explanation: |
      $$1.96\sqrt{\frac{0.35\times0.65}{1600}}=1.96\times0.01192=0.0234$$
      so survey B reads $35\pm2.3$ points, about 32.7% to 37.3%. The two ranges do not quite overlap (32.4 against 32.7), but that is still a statement about two *groups*, not about the same population.

  - type: mcq
    id: p3-compare
    title: "Do the surveys contradict each other?"
    prompt: |
      The sampling ranges do not overlap. Which conclusion is best supported?
    options:
      - text: 'They need not contradict. They sampled different groups (conference attendees against a random faculty list) with different question wording or response rates possible, so each result describes its own group. The gap may reflect a real difference between the groups, or selection, or wording; the numbers alone do not say which.'
        correct: true
      - text: 'They contradict, since the margins do not overlap, so one of the surveys is wrong.'
        feedback: |
          A margin describes sampling error *within one population*. Two surveys of two populations can both be right about their own group and still differ.
      - text: 'They are equal, because 28 and 35 are both under half.'
        feedback: |
          Both are under half, but the gap of 7 points is larger than either margin alone, so the data do point to a difference between the groups surveyed.
    explanation: |
      The question "do the two samples differ?" is separate from "does the difference tell us about physicists as such?" The first is answered by the margins, the second would need comparable samples drawn the same way.

  - type: mcq
    id: p3-notcover
    title: "What the margin does not cover"
    prompt: |
      Survey A drew attendees of a conference on science and religion. Which statement is correct?
    options:
      - text: 'The 4.4-point margin covers only chance variation among random samples. It does not cover the sampling frame (people who go to such a conference may be more, or less, inclined to believe), who chose to answer, or the wording of "believe in God".'
        correct: true
      - text: 'The margin covers every source of error, so the result is accurate to 4.4 points of all physicists.'
        feedback: |
          The formula assumes a random sample from the group of interest. A self-selected conference audience is not one, so the margin says little about "all physicists".
      - text: 'The margin shows the survey is biased by 4.4 points.'
        feedback: |
          The margin measures random scatter, not bias. A biased sample can have a small margin and still miss the truth by a lot.
    explanation: |
      Sampling error shrinks with $n$; bias does not. Quadrupling the sample halves the margin, but a bad frame stays bad. Making $n$ large is no cure for asking the wrong people.

  - type: numeric
    id: p3-plan
    title: "How big a sample for a tighter margin?"
    prompt: |
      A team wants a margin of about 2.2 points for $p=0.28$ from a proper random sample. Solve $1.96\sqrt{p(1-p)/n}=0.022$ for $n$ (round to the nearest hundred).
    answer: 1600
    tolerance: 0.01
    answerText: '1600'
    wrong:
      - { value: 800, feedback: 'Halving the margin needs four times as many people, not twice: $n$ appears under a square root, so $n$ goes from 400 to 1600.' }
    hint: 'Halving the margin from 4.4 to 2.2 needs how many times the sample?'
    explanation: |
      $$n=\frac{1.96^{2}\times0.28\times0.72}{0.022^{2}}\approx1600$$
      Margins shrink like $1/\sqrt n$, so halving it costs a fourfold sample, which is why surveys rarely go below about 2 points.

  - type: mcq
    id: p3-layers
    title: "Sort the claims by layer"
    prompt: |
      Which assignment of layers is right for these three claims? (a) "In survey B, 35% of the sampled faculty said yes." (b) "Scientists in elite groups are less religious because training in science weakens belief rather than because less religious people choose science." (c) "Laws of nature are the decrees of a lawgiver, so science is intelligible because God made it so."
    options:
      - text: '(a) established fact (about the people surveyed, within its margin); (b) live debate (training against selection, with a causal claim the data do not decide); (c) faith or metaphysical commitment (a lawgiver reading, against the best-system reading).'
        correct: true
      - text: '(a) established fact; (b) established fact, since it comes from a survey; (c) live debate.'
        feedback: |
          A survey establishes a rate, not a cause. And (c) is not tested by any survey or experiment: it is a commitment about what laws are, which rivals read differently.
      - text: 'All three are layer 3, since religion is involved.'
        feedback: |
          Layers are about the *kind of claim*, not the topic. (a) is a count and could in principle be checked by another survey.
    explanation: |
      The newspaper's headline slides between layers: from a count (a) to a causal story (b), and the Level's surveys never reach (c). Naming the layer of each sentence shows what would be needed to settle it: a better sample, a study of how belief changes, or a metaphysical argument.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Hypothesis versus demonstration.** Two models that fit equally are rivals, and the fit alone cannot choose (Bellarmine's condition, 1615: a hypothesis that saves the appearances is not yet physical truth). A demonstration is a prediction the rivals do not share. In the four models, preacher and physicist are in Conflict if both claim the path or a causal effect, and in Independence if one speaks of meaning and the other of orbits. The lawgiver and best-system readings of a law change what a law is, not how it is tested.
      - **Weighing witnesses.** Posterior odds equal likelihood ratio times prior odds. With $P(M)=10^{-8}$, $q=2\times10^{-3}$ and $P(E\mid M)=1$: $1/q^{3}=1.25\times10^{8}$, $n\ge\ln(10^{8})/\ln(500)\approx2.96$ so $n=3$, odds $1.25$. With $P(E\mid M)=0.9$ the odds for $n=3$ are $0.91$, so $n=4$ is needed. Six witnesses from two sources count as two: odds $2.5\times10^{-3}$. The prior is the layer 3 part: open laws ($10^{-2}$) and complete laws ($10^{-8}$) give odds $1.25\times10^{6}$ against $1.25$ from the same witnesses.
      - **Reading a survey.** The 95% margin is $1.96\sqrt{p(1-p)/n}$: $4.4$ points for $p=0.28$, $n=400$ and $2.3$ points for $p=0.35$, $n=1600$. It does not cover the frame, non-response or wording, and different groups need not contradict each other. A count is layer 1, a causal story is layer 2, and the reading of laws is layer 3.
      - **Method.** Name the status of the claim, find the one premise or prior that carries the disagreement, compute what the numbers do and do not say, and say which layer each conclusion belongs to.

      **Next:** part 2 has problems 4 and 5: a case that tests the origins of science and the theology of laws (Needham's question, laws as decrees) against survey evidence, and a final weighing in which a divine-action proposal is read against all four models and the odds form.
