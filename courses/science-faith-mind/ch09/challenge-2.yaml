id: ch09-challenge-2
title: "Level Challenge: Reading the Case (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: origins and a final weighing"
    body: |
      Two more invented cases, each read with the level's tools. The problems are independent, so the toolkit is restated. Every number is made up to practise the method.

      - **Origins of science.** According to Needham (1900-1995), China led Europe in technology yet did not produce mathematical physics, and he linked the Western idea of a law of nature to a celestial lawgiver. According to Sivin, "why did it not happen?" is a counterfactual about one history and may have no clean answer. According to Whitehead (1861-1947), the faith that nature is orderly was, in essence, an unconscious inheritance from medieval theology. According to Merton (1938), Puritan values were one important element in the growth of English science, not the only one.
      - **Laws.** According to Descartes (letter of 1630), God set the laws of nature as a king sets laws in his realm. According to the Humean best-system view (David Lewis), a law is a regularity in the simplest and strongest summary of all the facts, with no ruler behind it. For Kepler's third law, with period $T$ in years and semi-major axis $a$ in astronomical units,
      $$T^{2}=a^{3}$$
      - **Odds form.** For a hypothesis $H$ and evidence $E$, the posterior odds equal the likelihood ratio times the prior odds:
      $$\frac{P(H\mid E)}{P(\neg H\mid E)}=\frac{P(E\mid H)}{P(E\mid\neg H)}\cdot\frac{P(H)}{P(\neg H)}$$
      A ratio of 1 means the evidence does not move the odds.
      - **Survey margin.** For a random sample of size $n$ with share $p$, the 95% sampling margin is about
      $$1.96\sqrt{\frac{p(1-p)}{n}}$$
      It does not cover who was sampled, who answered, or how the question was worded.
      - **Divine action.** The four models (Conflict, Independence, Dialogue, Integration) are Barbour's. A proposal in which God acts without breaking the laws is **non-interventionist**. Chaos, where tiny differences grow, makes prediction fail, which is **epistemic** (a gap in our knowledge); a gap in the laws themselves is **ontological**. According to Polkinghorne (1930-2021), chaos points to ontological openness; according to Tracy, chaos theory presupposes determinism, so it does not supply openness.
      - **Three layers:** established fact, live debate, faith or metaphysical commitment.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · An essay on why science arose"
    body: |
      **Problem 4.** A student essay argues: "Modern science arose in early modern Europe because people there believed laws of nature are decrees of a lawgiver. This belief is still the root of science, as a survey shows: of 625 randomly chosen physics students in one country, 40% say laws of nature are decrees of a lawgiver."

      Two further pieces of evidence are offered. First, a catalogue of 60 early natural philosophers shows that nearly all were religious. Second, the essay says the idea of law grew from a lawgiver, which Needham thought Chinese thought lacked, so China had no science of the same kind.

      Her task: say what each piece of evidence can and cannot show, weigh the thesis with the odds form, and place the claims in the three layers.

  - type: mcq
    id: p4-survey
    title: "What the survey can show"
    prompt: |
      The essay's thesis is about the causes of the scientific revolution in the 1600s. The survey asked 625 present-day physics students what they think laws of nature are. What does it establish?
    options:
      - text: 'A fact about the views of these students today (within its sampling margin, if the sample is random). It does not show what caused science to arise 400 years earlier, because it measures present belief, not the beliefs and reasons of the people who made the revolution.'
        correct: true
      - text: 'That the lawgiver belief caused the rise of science, since 40% of today''s physicists hold it.'
        feedback: |
          A rate of belief today cannot show a cause in the 1600s. Even a high rate would be explained equally well if the belief is a *legacy* of that culture and not its source.
      - text: 'Nothing at all, since surveys can only be about the future.'
        feedback: |
          A survey describes a group at the time it is taken. It is good evidence about present views and poor evidence about past causes, which is a narrower complaint than "nothing".
    explanation: |
      Evidence has to be about the thing the thesis claims. The thesis is historical (what people believed and did in the 1500s and 1600s), so its evidence is texts, letters and institutions of that time. The survey belongs to a different question: how common the belief is now.

  - type: numeric
    id: p4-margin
    title: "The margin of the survey"
    prompt: |
      The random sample has $n=625$ and share $p=0.40$. Find the 95% margin $1.96\sqrt{p(1-p)/n}$ in percentage points (to one decimal).
    answer: 3.8
    tolerance: 0.05
    answerText: '3.8'
    wrong:
      - { value: 1.96, feedback: 'That is the factor 1.96 alone. The square root gives $\sqrt{0.24/625}=0.0196$, and multiplying by 1.96 gives $0.0384$, so 3.8 points.' }
    hint: '$p(1-p)=0.4\times0.6=0.24$, and $0.24/625=3.84\times10^{-4}$.'
    explanation: |
      $$1.96\sqrt{\frac{0.40\times0.60}{625}}=1.96\times0.0196=0.0384$$
      so the survey reads $40\pm3.8$ points, about 36.2% to 43.8%. This margin covers chance in a random sample only: it says nothing about the country chosen, the students who answered, or what "decree of a lawgiver" meant to each of them.

  - type: numeric
    id: p4-lr1
    title: "How much does 'nearly all were religious' weigh?"
    prompt: |
      Let $H$ be the thesis "belief in a lawgiver helped cause the rise of science". Let $E_1$ be "nearly all of 60 early natural philosophers were religious". Suppose that in a society where almost everyone is religious, $E_1$ is just as likely whether $H$ is true or false: $P(E_1\mid H)=0.95$ and $P(E_1\mid\neg H)=0.95$. Find the likelihood ratio $P(E_1\mid H)/P(E_1\mid\neg H)$.
    answer: 1
    tolerance: 0.001
    answerText: '1'
    wrong:
      - { value: 0.95, feedback: 'You gave one of the two probabilities. The likelihood ratio is their *quotient*: $0.95/0.95=1$.' }
    hint: 'If the rival says "everyone was religious anyway", the evidence is as expected under both.'
    explanation: |
      A ratio of 1 leaves the odds where they were. This is the critics' reply to the theological thesis: a religious age makes almost every early scientist religious, so their piety cannot separate "theology shaped science" from "everyone was religious and some of them did science". The evidence is real, but it is not *discriminating*.

  - type: mcq
    id: p4-which
    title: "Evidence that does discriminate"
    prompt: |
      Which further finding would favour the thesis most, while a rival ("the age was religious and the real causes lie elsewhere, such as institutions and trade") would not predict it?
    options:
      - text: 'Among the 60 philosophers, those who wrote explicitly that laws are decrees of a lawgiver were much more likely to state quantitative laws than those who did not.'
        correct: true
      - text: 'The society that founded the Royal Society on 28 November 1660 had many religious members.'
        feedback: |
          This is again the piety of an age. The rival also predicts it, so it does not tell the two apart.
      - text: 'Today 40% of surveyed physics students hold the lawgiver view.'
        feedback: |
          It is about the present, and both the thesis and its rival can explain a legacy of belief. It cannot separate the two accounts of the 1600s.
    explanation: |
      Evidence discriminates when the two hypotheses *disagree* about it. A link between a belief and the kind of work done, inside the same religious population, is exactly what the rival does not predict. Merton's 1938 study of Puritanism and English science is of this kind: he claimed one important element, not the whole story.

  - type: numeric
    id: p4-posterior
    title: "Weighing the thesis"
    prompt: |
      Suppose a careful study finds that, among early natural philosophers, those who wrote of laws as decrees of a lawgiver more often stated quantitative laws. Let $E_2$ be that finding, with $P(E_2\mid H)=0.6$ and $P(E_2\mid\neg H)=0.2$. A cautious historian starts with $P(H)=0.2$. Use the odds form to find $P(H\mid E_2)$, in percent (to one decimal).
    answer: 42.9
    tolerance: 0.1
    answerText: '42.9'
    wrong:
      - { value: 60, feedback: 'That is $P(E_2\mid H)$. The posterior mixes the likelihood ratio $3$ with the prior odds $0.25$.' }
      - { value: 75, feedback: 'That is the posterior *odds* $0.75$ read as a percentage. Convert with $P=\text{odds}/(1+\text{odds})$.' }
    hint: 'Prior odds $0.2/0.8=0.25$; likelihood ratio $0.6/0.2=3$.'
    explanation: |
      $$\text{odds}=3\times0.25=0.75$$
      $$P=\frac{0.75}{1.75}=0.429$$
      So the thesis moves from 20% to about 43%: a good study helps a lot, yet the historian is still short of certainty. The prior $0.2$ is a judgement, so this result says how far the finding moves *her*, and a colleague who starts at $0.05$ would end lower.

  - type: numeric
    id: p4-kepler
    title: "A law and its prediction"
    prompt: |
      Take Kepler's third law $T^{2}=a^{3}$ ($T$ in years, $a$ in astronomical units). A newly found planet around the same star has $a=9$. Find its period $T$ in years.
    answer: 27
    tolerance: 0.01
    answerText: '27'
    wrong:
      - { value: 81, feedback: 'That is $a^{2}$. The law says $T^{2}=a^{3}=729$, so $T=\sqrt{729}$.' }
      - { value: 4.5, feedback: 'The period is not proportional to $a$. Use $T=a^{3/2}=9\sqrt9$.' }
    hint: '$a^3=729$.'
    explanation: |
      $$T=\sqrt{a^{3}}=\sqrt{729}=27\ \text{years}$$
      A law like this is useful because one relation covers every planet around the star.

  - type: mcq
    id: p4-lawread
    title: "Does the prediction choose a reading of law?"
    prompt: |
      A descendant of Descartes reads $T^{2}=a^{3}$ as a decree of a lawgiver; a colleague reads it as part of the simplest, strongest summary of the facts (the best-system view). The planet turns up with period 27 years. What does this confirm?
    options:
      - text: 'It confirms the law as a description of the sky equally well on both readings. The readings differ about what a law *is* (a decree, or a summary), a layer 3 question this observation cannot decide.'
        correct: true
      - text: 'It confirms the lawgiver reading, because a decree would be obeyed by the new planet.'
        feedback: |
          A summary also fits the new planet, and the best-system supporter says the new fact just enlarges the data the summary covers. Both readings expected 27.
      - text: 'It confirms the best-system reading, because the law was simple.'
        feedback: |
          The lawgiver reading never said laws are complicated. Simplicity of the formula is something both sides accept.
    explanation: |
      The same observation passes through both readings with the same likelihood, which is a likelihood ratio of 1 between the two readings. That does not make the dispute empty; it means its resolution lies in arguments about explanation and about what could stand behind a law.

  - type: mcq
    id: p4-needham
    title: "The case of China"
    prompt: |
      The essay says that, as Needham thought, Chinese thought lacked a celestial lawgiver, so there was no science of the same kind. According to Sivin, why should the historian be careful with this argument?
    options:
      - text: 'Because "why did X not happen?" is a counterfactual about a single history. Many conditions differed between China and Europe, so one missing idea cannot be singled out as the cause, and the claim that Chinese thought lacked the lawgiver idea has itself been disputed.'
        correct: true
      - text: 'Because China had no technology, so the question is empty.'
        feedback: |
          Needham's question began from the fact that China was *ahead* in many technologies. Sivin's complaint is about the form of the question, not the history of invention.
      - text: 'Because Sivin showed that a lawgiver is not needed for any law of nature.'
        feedback: |
          Sivin made a historian''s point about explaining what did not happen, not a claim about what laws need. Whether laws need a lawgiver is the layer 3 dispute above.
    explanation: |
      Historians separate **what happened** (layer 1) from **why it did not happen elsewhere** (a counterfactual, live debate at best). The essay passes from a single missing idea to a verdict, which is a jump the evidence does not support.

  - type: mcq
    id: p4-layers
    title: "Sort the essay's claims by layer"
    prompt: |
      Which assignment of layers is right for these three claims? (a) "In a random sample of 625 physics students, 40% chose the lawgiver statement, with a margin of 3.8 points." (b) "Belief in a lawgiver helped cause the rise of science in the 1600s." (c) "Laws of nature are decrees, and science is intelligible because God made it so."
    options:
      - text: '(a) established fact (about the students, within the margin and the caveats on wording and sample); (b) live debate among historians (it is neither proved nor refuted); (c) faith or metaphysical commitment (rivals reject it without being refuted by any survey).'
        correct: true
      - text: '(a) live debate; (b) established fact, since all early scientists were religious; (c) faith or metaphysical commitment.'
        feedback: |
          A count is a fact about people, and the thesis (b) is not established: the piety of the age fits the rival equally well, as the likelihood ratio of 1 showed.
      - text: 'All three are established fact, because they come from history and a survey.'
        feedback: |
          (a) is a count, but (b) is a causal story still contested and (c) is a view about what laws are, which no data in the essay test.
    explanation: |
      The essay slides from (a) to (b) to (c) as if each supported the next. Naming the layer shows what would be needed: for (b) discriminating evidence from the 1600s, for (c) an argument about the nature of law.

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-setup
    title: "Problem 5 · A proposal about prayer and rain"
    body: |
      **Problem 5.** A theologian, Dr. Amara, proposes that God answers prayers for rain without breaking any law. Weather is chaotic, she says, so God could change the starting state of a weather system by a gap of one part in a billion, far below any measurement, and the equations then carry that change into rain a week later. Nothing in the laws is violated, and the rain statistics stay as meteorology says.

      A model of the idea: the logistic map $x_{n+1}=r\,x_n(1-x_n)$ with $r=3.9$ and start $x_0=0.2$. Two histories that start a gap $\delta_0$ apart, computed in ordinary double precision, count as visibly different at the first step where they differ by more than $0.1$. For $\delta_0=10^{-6}$ that first step is 22, and for $\delta_0=10^{-12}$ it is 44.

      Her task: classify the proposal, test what chaos gives it, weigh a rainy week as evidence, and place it among the four models.

  - type: mcq
    id: p5-kind
    title: "What kind of unpredictability?"
    prompt: |
      In Dr. Amara's model, the two histories are produced by the same deterministic map from different starts. What kind of gap is the unpredictability of the weather in this model, and what does her proposal need beyond it?
    options:
      - text: 'It is epistemic, a limit of our knowledge of the start, because the map itself fixes each history. Her proposal needs the further, ontological claim that the laws leave the true state open, so that God''s choice of the start is not itself already fixed by the laws.'
        correct: true
      - text: 'It is ontological already, because tiny differences grow, so the laws are open.'
        feedback: |
          Growth of small differences is a property of a deterministic map. It limits what *we* can predict, and says nothing yet about whether the laws leave anything open. That extra step is Polkinghorne''s, not a result of chaos theory.
      - text: 'It is neither, since a model on a computer says nothing about weather.'
        feedback: |
          A model can illustrate a mechanism (sensitivity to starts) without proving the weather works that way. Its role is to show what the proposal would need, and the kind of gap involved.
    explanation: |
      This is the dividing line of the level's divine-action lesson. According to Polkinghorne, chaos signals ontological openness; according to Tracy, chaos presupposes determinism, so it cannot supply the openness. The model displays the mechanism, and the dispute is about the extra premise.

  - type: numeric
    id: p5-steps
    title: "How far back can a tiny nudge matter?"
    prompt: |
      In the logistic model with $r=3.9$, $x_0=0.2$ and double precision, a start gap of $10^{-6}$ is first visible (more than $0.1$) at step 22, and a gap of $10^{-12}$ at step 44. Dr. Amara's gap is $10^{-9}$. Estimate the first visible step by assuming the number of steps grows in proportion to the number of decimal digits of smallness, and give the nearest whole step.
    answer: 33
    tolerance: 0.01
    answerText: '33'
    wrong:
      - { value: 66, feedback: 'You doubled the 33 or added the two steps, but the dependence is not on the gap itself: each factor of ten in the gap adds about the same number of steps, so a gap midway (in digits) lies midway between 22 and 44.' }
      - { value: 22, feedback: 'The gap $10^{-9}$ is smaller than $10^{-6}$, so the histories need more steps to separate, not the same number.' }
    hint: '$10^{-9}$ is halfway between $10^{-6}$ and $10^{-12}$ in digits: halfway between 22 and 44.'
    explanation: |
      Each factor of ten in the start gap adds about $22/6\approx3.7$ steps, so $10^{-9}$ lies at about $22+3\times3.7=33$. A direct run of the map gives the same: 33. A billionfold smaller start costs only a few dozen steps, which is why a nudge below any measurement could in principle matter within a week of weather steps. Real weather has its own sensitivity, and this toy map shows the mechanism only.

  - type: mcq
    id: p5-premise
    title: "The premise that carries the proposal"
    prompt: |
      Which premise decides whether Dr. Amara's proposal is non-interventionist and also gives God a real role?
    options:
      - text: 'That the laws leave the start of a chaotic system open (ontological openness), so that fixing it is not a violation. If the laws are complete and deterministic, the start is fixed by earlier states, and changing it would be intervention (or part of the original design from the beginning).'
        correct: true
      - text: 'That meteorologists cannot measure to one part in a billion.'
        feedback: |
          That is the epistemic fact the proposal starts from, and it is accepted by Polkinghorne and Tracy alike. It cannot supply openness: it describes our limits, not the laws.
      - text: 'That God exists.'
        feedback: |
          The proposal assumes a God who acts, for the sake of argument. What is open to dispute is whether a God who acts could do so *this way*, which depends on the openness premise.
    explanation: |
      Layer 3 enters here. Whether the laws are open or complete is a metaphysical premise, and the physics of chaos does not decide it. Tracy's reply is that a deterministic theory gives no room; Polkinghorne's is that determinism is a feature of the equations, not necessarily of the world.

  - type: numeric
    id: p5-lr
    title: "A rainy week as evidence: the interventionist reading"
    prompt: |
      Let $G$ be "God answers the prayer" and $E$ be "rain falls within a week of the prayer". Suppose God's answering would *change the odds of rain* to $P(E\mid G)=0.9$, while without it the base rate is $P(E\mid\neg G)=0.3$. Find the likelihood ratio $P(E\mid G)/P(E\mid\neg G)$.
    answer: 3
    tolerance: 0.001
    answerText: '3'
    wrong:
      - { value: 0.33, feedback: 'You inverted the ratio. The numerator is the probability of $E$ if $G$ is true: $0.9/0.3=3$.' }
    hint: 'Divide the chance of rain if God answers by the base rate.'
    explanation: |
      A ratio of 3 means a rainy week is three times as expected if God answers as if not. Under a detectable, interventionist action the evidence would favour $G$, and repeated trials could multiply the ratio.

  - type: numeric
    id: p5-lrquiet
    title: "The same week under the non-interventionist reading"
    prompt: |
      Dr. Amara's proposal says the rain statistics stay as meteorology says, whether or not God acts. Then $P(E\mid G)=P(E\mid\neg G)=0.3$. Find the likelihood ratio.
    answer: 1
    tolerance: 0.001
    answerText: '1'
    wrong:
      - { value: 3, feedback: 'That is the ratio of the interventionist reading. Here the proposal itself removes the difference, so the numerator is also $0.3$.' }
    hint: 'If the statistics are the same either way, what is the ratio?'
    explanation: |
      A ratio of 1 leaves the odds unchanged. A non-interventionist action that leaves no statistical signature cannot be supported by rain data, and it cannot be refuted by them either. This is the "no signature" cost met before: the proposal is safe from the laws because it is also silent in the data.

  - type: numeric
    id: p5-prior
    title: "What the prior decides"
    prompt: |
      Under the interventionist reading the likelihood ratio is 3. A skeptic starts with $P(G)=0.01$. Use the odds form to find $P(G\mid E)$, in percent (to one decimal).
    answer: 2.9
    tolerance: 0.05
    answerText: '2.9'
    wrong:
      - { value: 3, feedback: 'That is the likelihood ratio, not a probability. Prior odds $0.01/0.99\approx0.0101$, times $3$, gives odds $0.0303$.' }
      - { value: 75, feedback: 'That is the answer for a believer with prior $0.5$. The skeptic''s prior is $0.01$.' }
    hint: 'Prior odds $0.01/0.99=0.0101$; posterior odds $=3\times0.0101$.'
    explanation: |
      $$\text{odds}=3\times\frac{0.01}{0.99}=0.0303$$
      $$P=\frac{0.0303}{1.0303}=0.029$$
      so the skeptic moves from 1% to 2.9%, while a believer with prior $0.5$ (odds 1) moves to odds 3, which is 75%. The same evidence and the same ratio leave the two far apart: the gap lies in the priors, which are layer 3 commitments, so the weighing shows exactly where they enter and does not remove them.

  - type: mcq
    id: p5-models
    title: "Where does the proposal sit among the four models?"
    prompt: |
      Take the question "Does God act in particular events without breaking the laws?" Which reading of the four models is accurate?
    options:
      - text: 'Dialogue: a boundary question that science raises (are the laws open?) and that its own methods cannot settle, taken up by theology. According to Independence the question is outside $D_S$; according to Conflict an open-law claim that nothing could detect is a claim about nature without evidence; according to Integration it belongs to one picture of God and nature (a theology of nature).'
        correct: true
      - text: 'Conflict, because any divine action contradicts the laws of physics.'
        feedback: |
          Dr. Amara is claiming *no* contradiction (no law violated). A Conflict reading must say why even a hidden action in an open gap is excluded, which depends on the premise that laws are complete.
      - text: 'Independence, because science and religion never touch.'
        feedback: |
          The proposal is built on a result from science (sensitivity to starts) and asks a question about the laws, so it is not outside every overlap. A defender of Independence would say that this very step is a mistake, which is a view, not a description of the case.
    explanation: |
      A proposal is placed by what it claims. The four models are four verdicts on the same case, each with its own premise about the domains. That each verdict can be stated fairly is the point of the exercise.

  - type: order
    id: p5-order
    title: "Order a fair weighing"
    prompt: |
      Put the steps of a fair weighing of Dr. Amara's proposal in a sensible order.
    steps:
      - 'State exactly what is claimed: God acts by setting the start of a chaotic system inside a gap that no measurement can resolve, with no law broken.'
      - 'Separate the epistemic fact (tiny gaps grow, so prediction fails) from the ontological premise (the laws leave the start open).'
      - 'Ask what evidence the proposal predicts: with unchanged statistics the likelihood ratio from rain data is 1.'
      - 'See that priors, not the rain data, carry the disagreement, and name them as layer 3.'
      - 'Read the verdict of each of the four models and state the best reply of each.'
    hint: 'Claim first, then the premise, then the evidence, then the priors, then the models.'
    explanation: |
      The order moves from *what is claimed* to *what could count against it*, and ends with where the parties part ways. A weighing that starts with a verdict would already have taken a side.

  - type: mcq
    id: p5-parting
    title: "Where thoughtful people part ways"
    prompt: |
      A believer and a skeptic both read Dr. Amara's proposal carefully. Which pair of differences best explains why they may still disagree?
    options:
      - text: 'The metaphysical premise (are the laws open, or complete?) and the value or prior about divine action (must God''s action be detectable, or is hidden action enough?). Neither is settled by the physics or by rain data.'
        correct: true
      - text: 'The believer cannot do the arithmetic of the odds form.'
        feedback: |
          Both can. The arithmetic is shared; the disagreement is in the inputs, which the calculation takes as given.
      - text: 'One of them has not read the physics of chaos.'
        feedback: |
          Both accept the physics, including that tiny gaps grow. The dispute begins at the point where physics stops and a premise about the laws begins.
    explanation: |
      This is the dispute the level keeps meeting: two people can agree on every fact in layer 1 and on the method in layer 2 and differ in layer 3, where the premise and the prior live.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Origins of science.** A survey of today's views cannot show causes in the 1600s: it measures the present. A margin $1.96\sqrt{p(1-p)/n}$ gives $3.8$ points for $p=0.40$, $n=625$, and covers chance only. Piety of the age has likelihood ratio $0.95/0.95=1$, so it cannot separate "theology shaped science" from "everyone was religious"; a finding with likelihood ratio $0.6/0.2=3$ and prior $0.2$ gives posterior odds $0.75$, so $P=0.429$. The Needham question is a counterfactual, as Sivin observes.
      - **Laws.** Kepler's relation $T^2=a^3$ predicts $T=27$ years for $a=9$. The decree reading and the best-system reading both expect it, so the observation cannot choose between them: what a law is stays a layer 3 question.
      - **A divine-action proposal.** In the logistic model with $r=3.9$, $x_0=0.2$, a start gap of $10^{-9}$ shows after 33 steps ($22$ for $10^{-6}$, $44$ for $10^{-12}$). Growth of gaps is epistemic; the ontological openness it needs is Polkinghorne's premise, and Tracy denies that chaos supplies it. Interventionist rain data give likelihood ratio $0.9/0.3=3$, non-interventionist data give $1$. A prior of $0.01$ goes to $2.9\%$, a prior of $0.5$ to $75\%$.
      - **The four models.** The proposal is a boundary question: Dialogue takes it up, Independence puts it outside the domain of science, Conflict doubts an action without evidence, Integration builds it into one picture.
      - **Method.** State the claim, separate the epistemic fact from the metaphysical premise, ask what evidence the claim predicts, compute what the numbers do and do not say, and name the layer of each conclusion.

      **Next:** the next level, Consciousness, begins with the hard problem: why explaining behaviour is not yet explaining experience.
