id: ch09-galileo
title: "The Galileo Affair, Carefully"
kind: concept
own: |
  The setting: in 1616 and 1633 the Roman Catholic Church dealt with the astronomer Galileo Galilei (1564-1642) over **Copernicanism**, the view that the Earth moves around the Sun. Write $D_S$ for the set of questions science treats as its own and $D_R$ for the set a religion treats as its own, as in the typology of Barbour (Conflict, Independence, Dialogue, Integration).
  - **What is documented.** According to the trial record, Galileo was found "vehemently suspect of heresy" on 22 June 1633, abjured (formally renounced) Copernicanism, and lived under house arrest until his death in 1642. He was interrogated under threat of torture; no source checked reports torture applied; no source reports burning. Myths of torture, burning and a flat-Earth Church are false.
  - **Bellarmine's condition.** According to his letter of 12 April 1615, Cardinal Robert Bellarmine (1542-1621) allowed Copernicanism as a mathematical hypothesis that "saves the appearances" but required a real demonstration before reading it as physical truth, and then Scripture would have to be reinterpreted:
  {{ $$\text{demonstration of motion}\ \Rightarrow\ \text{reread Scripture}$$ }}
  - **Galileo on Scripture.** According to his *Letter to the Grand Duchess Christina* (1615), Scripture teaches how to go to heaven, not how the heavens go, so questions of the heavens' motion belong to the evidence of nature. In the typology: on the Earth's motion, he placed the question in $D_S$ and outside $D_R$:
  {{ $$\text{Earth's motion}\in D_S,\quad \text{Earth's motion}\notin D_R$$ }}
  - **The 1616 consultors' view.** On the same question, the Church's consultors judged that it clashed with the literal sense of Scripture (Joshua's sun standing still), which assumes the **Conflict** picture of a shared ground with incompatible answers:
  {{ $$D_S\cap D_R\neq\varnothing\ \text{ with incompatible answers}$$ }}
  - **Evidence on both sides.** According to Tycho Brahe's objection, an orbiting Earth predicts an annual shift of the stars' apparent positions (stellar parallax), and none was seen until Bessel's 1838 result; and Galileo's own tide argument (one tide a day, but two are observed) was wrong. A fair verdict keeps both: the Church's physics objection was reasonable, and Galileo was right about the Sun-centred system.
  - **Where historians part ways.** On how much was science, how much politics (Pope Urban VIII's anger over the *Dialogue*, patronage, court intrigue), and whether other motives (Redondi's atomism-and-Eucharist thesis, mostly rejected) lay behind it.
cards:
  - type: mcq
    id: hook
    title: "Guess: what happened to Galileo?"
    prompt: |
      Guess before any history. In 1633 Galileo Galilei (1564-1642), an Italian astronomer, was put on trial by the Roman Inquisition (the Church court that judged questions of doctrine). He had argued that the Earth moves around the Sun. What do you think was the outcome?
    options:
      - text: 'He was convicted, forced to renounce the view in public, and kept under house arrest for the rest of his life.'
        correct: true
        feedback: |
          Yes. He was found "vehemently suspect of heresy" (a milder charge than heresy itself), abjured (formally renounced) the view, and lived under house arrest, at first in Siena and then at his villa in Arcetri near Florence, until he died in 1642.
      - text: 'He was tortured until he confessed, then burned at the stake.'
        feedback: |
          This is the popular myth. The record shows an interrogation *under threat* of torture, and no source we checked reports that torture was applied. He was not burned: he died at home in 1642.
      - text: 'He was acquitted, because the Church had no objection to the Earth moving.'
        feedback: |
          The Church had acted against the view in 1616, and the 1633 court convicted him. The question is *why*, and that is what this lesson is about.
    explanation: |
      Two myths (torture and burning) sit on one side, a rosy "no problem" on the other. The documented story is between them, and it is more interesting than either.

  - type: mcq
    id: myth-sort
    title: "Myth or documented?"
    prompt: |
      Which of these claims about the Galileo affair are **documented** (rather than myths)? Select all that apply.
    multiple: true
    options:
      - text: 'In 1633 he was convicted of "vehement suspicion of heresy" and made to abjure Copernicanism.'
        correct: true
        feedback: |
          Documented in the sentence read on 22 June 1633.
      - text: 'He lived the rest of his life under house arrest, and the sentence banned his book the *Dialogue*.'
        correct: true
        feedback: |
          Documented. The sentence also forbade him to publish further works; imprisonment was commuted to house arrest.
      - text: 'He was burned at the stake.'
        feedback: |
          A myth. Galileo died at home in 1642.
      - text: 'The Church of his time taught that the Earth is flat, and he proved it round.'
        feedback: |
          A myth. The dispute was between a stationary Earth at the centre and a moving Earth; both sides took the Earth to be a sphere. Educated people had known its round shape for centuries, and the flat-Earth story is mostly a 19th-century invention.
      - text: 'As he left the court he muttered "Eppur si muove" ("and yet it moves").'
        feedback: |
          A legend. The earliest account appears about a century after his death; there is no evidence he said it.
    explanation: |
      Three myths here make the story simpler than it was: a martyr burned, a Church of flat-Earthers, a dramatic last line. The documented core is a trial and a sentence. The interesting question is what the dispute was about.

  - type: text
    id: timeline
    title: "Four dates"
    body: |
      Here is the skeleton, according to the standard accounts (the *Stanford Encyclopedia of Philosophy*, Wikipedia, the translations of the documents by the historian Maurice Finocchiaro).

      - **March 1610:** *Sidereus Nuncius* (*Starry Messenger*), Galileo's report of what his telescope showed, including moons circling Jupiter, evidence that not everything circles the Earth.
      - **1616:** the Church reviews Copernicanism. On 5 March the Congregation of the Index (the committee that banned books) bans books advocating it, and Copernicus's own book is suspended until corrected. Cardinal Bellarmine tells Galileo not to "hold or defend" the view.
      - **1632:** Galileo's *Dialogue Concerning the Two Chief World Systems*, written as a conversation among three friends, is printed in Florence. The Inquisition soon stops its sale.
      - **22 June 1633:** the sentence, then house arrest. He dies on 8 January 1642.

      Note: historians dispute whether in 1616 he was given the stronger order "not to hold, teach, or defend it in any way whatever". The wording matters, because it was used against him in 1633.

  - type: order
    id: timeline-order
    title: "Put the affair in order"
    prompt: |
      Put these events of the Galileo affair in the order they happened.
    steps:
      - 'Galileo publishes the *Starry Messenger* with his telescope observations (1610).'
      - 'The Church bans books that advocate Copernicanism and tells Galileo not to hold or defend it (1616).'
      - 'The *Dialogue Concerning the Two Chief World Systems* is printed in Florence (1632).'
      - 'Galileo is sentenced, abjures, and is placed under house arrest (1633).'
    hint: 'The book that mocks an argument has to exist before the trial that judges it.'
    explanation: |
      The order matters: the 1616 warning is the backdrop of the 1633 trial. In 1633 the court asked whether the *Dialogue*, a book that argues for the Earth's motion, broke the 1616 warning.

  - type: text
    id: bellarmine
    title: "The cardinal who warned him"
    image:
      src: img/bellarmine.webp
      alt: "Engraved portrait of Cardinal Robert Bellarmine in a cardinal's cap"
      caption: Robert Bellarmine (1542-1621) was a Jesuit theologian and cardinal; he was canonized in 1930.
      credit: "Engraving, Bibliothèque Sainte-Geneviève (Paris), CC0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Robertus_Bellarminus.png"
    body: |
      The man who spoke for the Church in 1616 was **Cardinal Robert Bellarmine**, a Jesuit (a member of the Society of Jesus, a Catholic order) and one of the most respected theologians of his day. Some years earlier, on 12 April 1615, he had written a letter to the priest Paolo Antonio Foscarini, who had defended Copernicus.

      According to that letter (in essence), Bellarmine gave two answers:

      - **As a hypothesis, fine.** To say that, *supposing* the Earth moves and the Sun stands still, the appearances in the sky are neatly "saved" (explained), is good mathematics and does no harm.
      - **As physical truth, dangerous.** To *assert* that the Sun really stands still at the centre is "a very dangerous thing". But if there were a true demonstration, one would have to reread the passages of Scripture that seem to say otherwise with great care; he did not believe such a demonstration existed, since none had been shown to him.

  - type: mcq
    id: bellarmine-q
    title: "What did Bellarmine ask for?"
    prompt: |
      According to Bellarmine's 1615 letter, which statement is the best summary of the Church's position on Copernicanism *as a matter of method*?
    options:
      - text: 'Use it as a calculating hypothesis freely; treat it as physical truth only once it is demonstrated, and then reread Scripture.'
        correct: true
        feedback: |
          Yes. His condition is about the *standard of proof*: a hypothesis that merely fits the appearances is not a demonstration. Whether he was too demanding is a fair debate; that he left a door open is documented.
      - text: 'Copernicanism must be rejected whatever evidence is found, because Scripture is always literal.'
        feedback: |
          Bellarmine explicitly allowed that a true demonstration would require rereading the apparently contrary passages. His text is not a flat "never".
      - text: 'Copernicanism is simply wrong mathematics, so astronomers should drop it.'
        feedback: |
          He said the opposite about the mathematics: treating the motion as a supposition is acceptable and useful.
    explanation: |
      Notice what is being asked: not "obey the Church over science" but "show a demonstration". This is a claim about evidence. Was there one in 1616? The next cards weigh it.

  - type: text
    id: christina
    title: "Galileo replies: two books"
    body: |
      Galileo's answer was his **Letter to the Grand Duchess Christina** (1615), an expansion of an earlier letter to his former student Benedetto Castelli.

      According to Galileo (in essence), nature and Scripture both come from God and so cannot truly contradict each other. But Scripture is written in the language of ordinary people and is meant to teach **salvation**, whereas the book of nature is read by observation and reasoning. Where a conclusion about nature is demonstrated, the passage in Scripture must be read in a way that fits it. He quotes a remark he attributes to Cardinal Cesare Baronio: Scripture teaches how one goes to heaven, not how the heavens go. (The attribution is customary but cannot be confirmed from documents.)

      The opposing reading, held by the 1616 consultors (the theologians who reviewed Copernicanism), was that the Sun's standing still in the biblical story of Joshua and similar passages should be taken at face value unless proved otherwise.

  - type: mcq
    id: christina-q
    title: "Who rereads whom?"
    prompt: |
      Galileo says: "Scripture teaches how one goes to heaven, not how the heavens go." On the question *Does the Earth move?*, what is he claiming about where the answer comes from?
    options:
      - text: 'It comes from observation and demonstration; Scripture is not meant to settle it.'
        correct: true
        feedback: |
          Right. For Galileo the question of the Earth's motion is empirical. Scripture's job is salvation and morals, not astronomy.
      - text: 'It comes from Scripture, and observation is irrelevant.'
        feedback: |
          That is the opposite of his claim, and closer to the literal-reading side he was arguing against.
      - text: 'It cannot be answered at all, so both science and Scripture should stay silent.'
        feedback: |
          He thought it *could* be answered, by demonstration, which is what he believed his arguments supplied.
    explanation: |
      This is a claim about where the line between science and religion falls. We will name it in the typology below.

  - type: text
    id: church-case
    title: "The Church's best argument was not Scripture"
    body: |
      It is tempting to read the affair as pure faith against pure evidence. A fair account separates three things.

      **The physics objection.** According to Tycho Brahe (a Danish astronomer), if the Earth really orbits the Sun, then looking at the stars from opposite sides of the orbit six months apart, nearby stars should seem to shift against the farther ones. This shift is **stellar parallax**. In Galileo's day no one saw it. The Copernican reply was that the stars are enormously far away. That reply was correct, but at the time it looked like an excuse. Parallax was first detected in 1838, when Friedrich Bessel published a measurement for the star 61 Cygni.

      So, according to the Church's side, the demand for a demonstration was not unreasonable: the best direct test failed.

  - type: mcq
    id: parallax-q
    title: "Why the missing shift mattered"
    prompt: |
      In 1633, no one had observed stellar parallax (the apparent yearly shift of nearby stars against distant ones if the Earth orbits the Sun). Which statement is a fair reading?
    options:
      - text: 'A reasonable physical objection to Copernicus at the time; the Copernican reply (stars are extremely far) was right but not yet testable.'
        correct: true
        feedback: |
          Yes. A missing predicted effect is a legitimate objection; the effect was too small for the instruments of the time and was detected only in 1838.
      - text: 'Proof that the Earth does not move.'
        feedback: |
          It is not proof: the shift would be tiny if the stars were far away, which they are. A failed prediction counts against a theory only if the effect should have been big enough to see.
      - text: 'An invention of the Church with no scientific basis.'
        feedback: |
          The objection came from astronomers, notably Tycho Brahe, not from theologians. It was genuine science.
    explanation: |
      The point is not that the Church was right (it was wrong on the Sun-centred system). It is that its resistance was not only dogma: part of it was a scientific objection that Galileo could not meet.

  - type: mcq
    id: tides-q
    title: "Galileo's own weak proof"
    prompt: |
      Galileo thought the tides were the demonstration Bellarmine asked for: the sea sloshes because the Earth moves. His account predicts **one** high tide per day, but in the Atlantic there are **two**. According to historians of science, what is the fair assessment?
    options:
      - text: 'His tide argument was wrong (the Moon is the main cause) and could not serve as the demonstration; he was right about the Earth moving, but not for this reason.'
        correct: true
        feedback: |
          Yes. Galileo tried to patch the two-tide problem with a secondary effect, and he dismissed the idea of the Moon's pull as occult. The conclusion he defended was correct; the argument he offered for it was not.
      - text: 'His tide argument was correct and the Church ignored it.'
        feedback: |
          Tides come mainly from the Moon's and the Sun's pull, not from the Earth's motion sloshing the sea. Galileo's theory also fits the observed timing poorly.
      - text: 'Tides had nothing to do with his argument.'
        feedback: |
          He considered it his strongest physical argument; the *Dialogue* was first titled as a dialogue on the tides, and the tides were removed from the title by order of the Inquisition.
    explanation: |
      Steelmanned from both sides: the Church's physics objection was reasonable, and Galileo's best "demonstration" was wrong. The Sun-centred picture was right, but a demonstration in Bellarmine's sense was not yet in hand.

  - type: text
    id: urban
    title: "The pope who had been a friend"
    image:
      src: img/urban8.webp
      alt: "Portrait of Pope Urban VIII by Bernini"
      caption: Maffeo Barberini (1568-1644), pope Urban VIII from 6 August 1623, was a friend of Galileo before the Dialogue.
      credit: "Gian Lorenzo Bernini, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Gian_Lorenzo_Bernini_-_Portrait_d%27Urbain_VIII.jpg"
    body: |
      The story of 1632 and 1633 is not only about astronomy. **Maffeo Barberini** had admired Galileo as a cardinal; when he became **Pope Urban VIII** in 1623, Galileo felt encouraged to write the *Dialogue*.

      The *Dialogue* is a conversation among three speakers about the two world systems; one of them is the Aristotelian **Simplicio**. According to the standard account, Urban came to believe that Simplicio voiced his own arguments and that Galileo was mocking him; the patronage broke. Other accounts stress court intrigue and the pope's fear for his own position.

      The sentence of 22 June 1633 found Galileo "vehemently suspect of heresy", banned the *Dialogue*, and forbade him to publish further.

  - type: mcq
    id: types-q
    title: "Which of Barbour's types?"
    prompt: |
      Recall the typology. Write $D_S$ for the set of questions science treats as its own and $D_R$ for the set religion treats as its own. **Conflict** says the two share ground with clashing answers: $D_S\cap D_R\neq\varnothing$. **Independence** says they have no shared ground: $D_S\cap D_R=\varnothing$.

      On the single question *Does the Earth move?*, Galileo's Letter to Christina puts it in $D_S$ and not in $D_R$. The 1616 consultors read Scripture (Joshua) as speaking about it. Which pair of types do the two positions assume?
    options:
      - text: 'Galileo: Independence on this question (it is not in $D_R$). The consultors: Conflict (a shared question with clashing answers).'
        correct: true
        feedback: |
          Yes, as a reading. Galileo's line is close to Independence for the question of the Earth's motion; the consultors' view assumes overlap with a clash. This is a historians'-style sorting, not a verdict on who was right.
      - text: 'Both assumed Independence; they only disagreed on dates.'
        feedback: |
          The consultors did not say Scripture was silent on the Earth: they read it as saying the Sun moves.
      - text: 'Both assumed Conflict, since each wanted the other to give way.'
        feedback: |
          Galileo's claim was that there is *no* real contest because Scripture is not about this question. Only one side assumed overlap.
    explanation: |
      Be careful, as the typology itself warns: this is a sorting tool applied to one question. Galileo also claimed more than Independence, since he wanted the Church to accept the physical result and reread its texts accordingly, which is closer to Dialogue.

  - type: mcq
    id: historians-q
    title: "Where historians part ways"
    prompt: |
      Historians still disagree about *why* the affair turned out as it did. Which statement is a fair description of the debate?
    options:
      - text: 'Most accounts weigh the scientific and scriptural arguments, the patronage and politics around Urban VIII, and Galileo''s clashes with philosophers; a few theses (such as an atomism-and-Eucharist motive) are mostly rejected.'
        correct: true
        feedback: |
          Yes. Pietro Redondi (1983) argued that the real motive was Galileo's atomism and its supposed conflict with the Eucharist; most Galileo scholars reject it. The mainstream gives weight to the scriptural question, politics and patronage together.
      - text: 'All historians agree it was purely religion against science.'
        feedback: |
          They do not. Politics, patronage and philosophical rivals all enter the standard accounts.
      - text: 'All historians agree it was purely personal politics and the science did not matter.'
        feedback: |
          The 1616 and 1633 documents are about Copernicanism and Scripture, so the science mattered.
    explanation: |
      Layers: the dates and the sentence are established fact. How to weigh the factors is a live debate among historians. Whether the Church was "right" to insist on Scripture over a physical claim is, for believers and non-believers, a question of premises.

  - type: mcq
    id: trap
    title: "Trap: the Church opposed all science"
    prompt: |
      A friend says: "The Galileo case shows that the Catholic Church opposed all science." Which fact best shows this overgeneralises?
    options:
      - text: 'The 1616 action was aimed at one specific doctrine (Copernicanism), and Jesuit astronomers repeated Galileo''s telescope observations.'
        correct: true
        feedback: |
          Yes. The affair was about a particular cosmological claim and what it implied for the reading of Scripture, not about science in general. Churchmen, notably Jesuits, did astronomy.
      - text: 'Galileo himself rejected all religion, so the Church had to oppose science.'
        feedback: |
          Nothing in the record says he rejected religion; his Letter to Christina argues from within it. The conflict was about one doctrine and how to read Scripture.
      - text: 'The Church never banned any book on astronomy.'
        feedback: |
          It did: the 1616 decree suspended Copernicus''s book until corrected, and the *Dialogue* was banned in 1633. The point is that this was not all of science.
    explanation: |
      The Church later dropped the general ban on heliocentric books from the Index (1758) and accepted heliocentrism as physical fact in the 1820 Settele case. Whether the earlier action was an error is argued differently by different Catholics, but "all science" is not the right description.

  - type: text
    id: summary
    body: |
      **Next:** the question that outlasted Galileo: Charles Darwin's theory of evolution by natural selection, the churches' responses to it, and how religious people in different traditions answered. The map of four types meets another real case.
