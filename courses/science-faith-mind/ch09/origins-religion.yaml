id: ch09-origins-religion
title: "Religious Scientists and Scientific Atheists"
kind: concept
own: |
  The setting: a **survey** asks a sample of people a question and reports the share who answer in each way. Here the question is whether scientists believe in God, and the samples are scientists in the United States.
  - **What the surveys found.** In May and June 2009 the Pew Research Center asked members of the American Association for the Advancement of Science (AAAS); {{ 33% said they believe in God }}, 18% in a universal spirit or higher power, and 41% in neither, against 83%, 12% and 4% for the US public in 2006. A 1996 survey of 1000 randomly chosen US scientists by Edward Larson and Larry Witham found 39.3% believers in a personal God; their 1998 survey of National Academy of Sciences members found only {{ 7% }}. Elaine Ecklund's study of elite-university scientists reported 36% believing in God.
  - **A percentage has two kinds of error.** Sampling error shrinks with the sample size $n$; for a random sample with share $p$, the 95% margin is about
  {{ $$1.96\sqrt{\frac{p(1-p)}{n}}$$ }}
  For $p=0.393$ and $n=1000$ this is about 3 percentage points. It does not cover bias: who was sampled, who answered, how the question was worded, and what "God" meant to the respondent.
  - **Different samples, different answers.** Members of a society (AAAS), a random list (American Men and Women of Science), an elite academy (NAS) and elite universities are different groups, so 33%, 39.3%, 7% and 36% do not contradict one another.
  - **Data about belief do not decide truth.** According to critics of the inference, "most scientists in group X hold a view" is a fact about people, so it does not show that the view is true; likewise one religious scientist shows that religion and science can be held together, not that religion is true.
  - **Reasons are separate from rates.** According to Francis Collins (b. 1950), geneticist, science and faith are complementary; according to Richard Dawkins (b. 1941), biologist, belief in God is a hypothesis that the evidence does not support. A survey counts the answers; it does not show the reasons behind them.
  - **Three layers.** The survey numbers are established fact; why they differ between fields and eras is live debate; whether belief or disbelief is the better response to the evidence is a metaphysical and personal commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: do scientists believe in God?"
    prompt: |
      In 2009 the Pew Research Center asked a large sample of American scientists whether they believe in God (a person-like creator), in some higher power, or in neither. Before any data, guess the shares for **belief in God itself**, among scientists and among the American public (asked in 2006).
    options:
      - text: 'Scientists about a third, the public more than four in five.'
        correct: true
        feedback: |
          Yes: 33% against 83%. Scientists are far less likely to say yes, but a third is still a lot of people, far from none.
      - text: 'Scientists almost none (under 5%), the public about half.'
        feedback: |
          The "almost none" picture is common but wrong for the large 2009 sample. Some elite groups do show very low rates, as the lesson will show, but scientists taken as a whole are not close to zero.
      - text: 'Scientists and the public about the same, near 80%.'
        feedback: |
          Many scientists do believe, so the picture of a strict divide is false. But the gap between the two groups is large in these data, about 50 percentage points.
    explanation: |
      Pew's AAAS survey found 33% of scientists believing in God, 18% in a universal spirit or higher power, and 41% in neither. The public figures were 83%, 12% and 4%. The rest of the lesson asks what such numbers can and cannot tell us.

  - type: text
    id: recall
    title: "Recall: where the conflict story comes from"
    body: |
      Recall two episodes from earlier lessons. Galileo (1564-1642) was tried by the Roman Inquisition in 1633 over his defence of a moving Earth, and Charles Darwin (1809-1882) published *On the Origin of Species* in 1859. Both are often told as "science against religion". The record is more mixed: Galileo's quarrel involved politics, personalities and the question of who may interpret Scripture, and in the decades after Darwin some Christian thinkers resisted the theory, some embraced it, and many argued first about the evidence. "Science against religion" is partly a later retelling.

      A different question is also worth asking: what do scientists themselves, today, say they believe? That is not history but measurement. Measurement has its own traps, and we start with what a survey is.

  - type: mcq
    id: measure
    title: "What does a survey measure?"
    prompt: |
      A survey reports that 33% of the people sampled "believe in God". Which of the following would change that number **without** any scientist changing their mind?
    multiple: true
    options:
      - text: 'Offering a second option, "a universal spirit or higher power", beside "God".'
        correct: true
        feedback: |
          Yes. Someone who would tick "God" when no alternative exists may prefer the second option when it is offered.
      - text: 'Surveying members of one society instead of a random list of scientists.'
        correct: true
        feedback: |
          Yes. A different sample is a different group of people, with a different share of believers.
      - text: 'Surveying chemists only instead of all fields.'
        correct: true
        feedback: |
          Yes. Pew found 41% of chemists believing in God, higher than the other major fields.
      - text: 'Writing the percentage with one decimal place instead of none.'
        feedback: |
          That changes the display, not the data (rounding moves the figure by less than a percentage point).
    explanation: |
      A survey number depends on four things: the **wording** of the question, the **sample** (who is asked), the **field**, and the **country and year**. Change any of them and the number can move, while every individual keeps the same view.

  - type: text
    id: pew
    title: "The Pew survey of 2009"
    body: |
      The Pew Research Center surveyed members of the American Association for the Advancement of Science (AAAS), the largest general scientific society in the world, with members from every field. Fieldwork took place in May and June 2009. The answers on belief:

      | | Scientists (AAAS, 2009) | US public (2006) |
      |---|---|---|
      | Believe in God | 33% | 83% |
      | Believe in a universal spirit or higher power | 18% | 12% |
      | Neither | 41% | 4% |

      Pew itself notes that the AAAS sample may not be representative of all US scientists. It also reports that younger scientists (ages 18 to 34) are more likely than older ones to believe in God or a higher power.

  - type: numeric
    id: some-power
    title: "Any kind of higher power"
    prompt: |
      In the 2009 Pew survey of AAAS scientists, 33% said they believe in God and 18% said they believe in a universal spirit or higher power. What percentage of these scientists believe in **some form** of deity or higher power?
    answer: 51
    tolerance: 0.5
    answerText: '51'
    hint: 'The two answers are different options, so no one is counted twice.'
    explanation: |
      $33+18=51$, so just over half. The same arithmetic for the public gives $83+12=95$. Counting "any higher power" shrinks the gap a lot compared with counting "God" alone, a first example of wording changing the story.

  - type: numeric
    id: gap
    title: "The size of a gap"
    prompt: |
      In the Pew data, 83% of the US public said they believe in God (2006) and 33% of AAAS scientists said so (2009). By how many **percentage points** do the two figures differ?
    answer: 50
    tolerance: 0.5
    answerText: '50'
    wrong:
      - value: 60.2
        feedback: |
          That is the relative drop, $50/83$ expressed as a percent, about 60%. A difference of percentages is in points; a relative change is a different statement.
    explanation: |
      $83-33=50$ points. Say "points" for a difference between two percentages. Note also that the two figures come from different years and different kinds of sample (a random public sample against members of one society), so even this plain subtraction compares unlike groups.

  - type: text
    id: larson
    title: "Larson and Witham, and Ecklund"
    body: |
      Other surveys ask other groups. Edward Larson and Larry Witham repeated, in 1996, a question first asked by the psychologist James Leuba early in the 20th century. In *Nature* (1997) they reported that of 1000 scientists drawn at random from the directory *American Men and Women of Science*, 39.3% believed in a personal God, 45.3% did not, and the rest were doubtful, close to Leuba's early result. In *Nature* (23 July 1998, "Leading scientists still reject God") they asked members of the National Academy of Sciences (NAS), an elite body chosen by election among scientists: 7.0% believed in a personal God, 72.2% did not, and 20.8% were doubtful. In the same table, the figure for the "greater scientists" Leuba surveyed in 1914 (his elite group) was 27.7%, against 15% in 1933.

      The sociologist Elaine Howard Ecklund surveyed about 1700 scientists at 21 elite US research universities (2005 to 2008) and interviewed 275 of them, reporting in *Science vs. Religion* (2010) that 36% believe in God, while about half call themselves religious in some sense.

  - type: mcq
    id: why-differ
    title: "Why 39.3%, 7% and 36%?"
    prompt: |
      Three studies of American scientists report belief in God of 39.3% (random list of working scientists, 1996), 7.0% (National Academy of Sciences members, 1998) and 36% (scientists at elite universities, 2005 to 2008). Which is the most reasonable way to read this?
    options:
      - text: 'The groups differ: an election-based academy of eminent scientists, a random list, and elite-university staff are not the same population, and the questions and years differ too. The studies need not contradict one another.'
        correct: true
        feedback: |
          Yes. Larson and Witham themselves noted that disbelief seems higher among the most eminent, and one author of that work noted that the Academy is a self-selecting body, not a random sample of top scientists.
      - text: 'At least two of the studies must be fabricated, since honest surveys of scientists would agree.'
        feedback: |
          Surveys agree only when they ask the same question of the same population. Nothing here suggests fraud; the differences have ordinary explanations.
      - text: 'Belief fell from 39.3% to 7% between 1996 and 1998.'
        feedback: |
          Two years is far too short for that, and the two studies sampled different people (the second only elite academy members). Reading two groups as one trend is a classic error.
    explanation: |
      The numbers sit side by side in many essays as if they measured the same thing. They do not. A careful reader writes "X% of group G, asked Q in year Y" and compares only like with like.

  - type: numeric
    id: moe
    title: "How precise is 39.3%?"
    prompt: |
      A random sample of $n=1000$ scientists gives a share $p=0.393$ answering yes. For a simple random sample, the 95% margin of error is about $1.96\sqrt{p(1-p)/n}$. Assume all 1000 answered. What is the margin, in percentage points, to the nearest tenth?
    answer: 3.0
    tolerance: 0.15
    answerText: '3.0'
    hint: 'First $p(1-p)=0.393\times0.607\approx0.2385$, then divide by 1000 and take the square root.'
    explanation: |
      $\sqrt{0.2385/1000}\approx0.0154$, and $1.96\times0.0154\approx0.030$, so the share is about 39.3% plus or minus 3 points. A bigger sample shrinks the margin only like $1/\sqrt n$: four times as many people halve it.

  - type: mcq
    id: moe-limit
    title: "What the margin does not cover"
    prompt: |
      A survey of AAAS members reports a margin of error of about 3 points. Pew also warns the sample "may not be representative of all scientists in the US". Which statement is correct?
    options:
      - text: 'The margin covers only chance variation in who was drawn from the group sampled; it says nothing about whether the group represents all scientists, whether members answered honestly, or what the question meant to them.'
        correct: true
        feedback: |
          Yes. These are bias, not sampling noise, and a bigger sample does not remove them.
      - text: 'With a margin of 3 points, the result holds for all scientists in the world.'
        feedback: |
          The margin concerns only the population from which the sample was drawn. Scientists outside it (other countries, non-members) may differ a great deal.
      - text: 'The margin shows that 33% is exact within 3 points for every possible wording of the question.'
        feedback: |
          Wording effects are not random draws. A different wording is a different measurement, as the two-option versus three-option example showed.
    explanation: |
      Sampling error is the part of uncertainty that arithmetic can size. The rest (coverage, response, wording, definitions) needs judgment, and it is usually larger.

  - type: text
    id: limits
    title: "Why the data do not settle the question"
    body: |
      Suppose the surveys were perfect. Three things would still stand between them and the questions people care about.

      **Definitions.** "God" can mean the personal creator of the Abrahamic traditions, the impersonal order of nature (as for Spinoza), or a ground of being. Someone who says no to the first may say yes to the last. Pew's separate "universal spirit or higher power" option shows the issue, and Ecklund found about half of her scientists religious in some sense while 36% believed in God.

      **Self-selection.** People are not assigned to science, or to belief, at random. Whatever draws a person to a career, or an upbringing that shapes both choices, can correlate with belief without causing it. Which way the arrow points (does science loosen belief, or do doubters enter science?) is exactly what a snapshot cannot say.

      **Truth.** A survey measures what people think. Whether the thing is true is a different question, answered by arguments and evidence of the kind the earlier levels examined.

  - type: mcq
    id: trap-atheism
    title: "Trap: the majority of experts"
    prompt: |
      Someone says: "In the National Academy of Sciences 72% disbelieve in a personal God, so atheism is shown to be true." What is the main flaw?
    options:
      - text: 'The percentage describes what a group believes, not what is the case; an argument from the beliefs of experts is only as strong as those experts are experts on this question, and the question here is philosophical or theological, not a lab measurement.'
        correct: true
        feedback: |
          Yes. A group of eminent physicists or biologists is expert on nature, but whether God exists is not settled by their research methods. The survey is evidence of how experts see it, nothing more.
      - text: 'The number must be wrong because Academy members are not scientists.'
        feedback: |
          Academy members are accomplished scientists, and the survey was real. The flaw is in the step from the number to the truth.
      - text: 'Atheism could never be true, so any data for it must be flawed.'
        feedback: |
          This assumes the answer. The point of the lesson is the same for both sides: the data cannot be used as an argument for or against the claim.
    explanation: |
      The same logic cuts the other way: "most Americans believe in God, so God exists" would be just as weak. Popularity and truth are different things, in any direction.

  - type: mcq
    id: trap-believer
    title: "Trap: the religious scientist"
    prompt: |
      Someone says: "A leading geneticist is a committed Christian, so religion must be compatible with the truth." What does the fact actually show?
    options:
      - text: 'That scientific ability and religious belief can coexist in one person, which counts against the claim that they are logically incompatible. It does not show that the belief is true.'
        correct: true
        feedback: |
          Yes. The example refutes "no good scientist can be religious" and leaves the truth of the religion to be argued on other grounds.
      - text: 'Nothing at all, since one case is only an anecdote.'
        feedback: |
          One case is enough to refute a universal claim such as "no good scientist can believe". It cannot prove a general claim about the truth of religion, but it does answer the claim of incompatibility.
      - text: 'That religion is true, since an expert accepts it.'
        feedback: |
          That is the mirror of the atheist trap. Expertise in genetics is not expertise in whether God exists.
    explanation: |
      Compare the two traps: the numbers of a group and the example of one person both show how people think. Neither shows how things are.

  - type: text
    id: religious
    title: "Reasons religious scientists give"
    body: |
      Why do some scientists hold a faith? A few of the reasons given, each stated as its defenders would.

      According to **Francis Collins** (b. 1950), the geneticist who led the Human Genome Project, in *The Language of God* (2006): belief in God is a rational choice, and the principles of faith complement those of science, with God creating through evolution. This is a form of the theistic evolution met in the lesson on Darwin.

      According to others, the order that science finds (laws that can be written in mathematics) fits a world made by a rational mind, a thought developed in the next lesson. Others say that science does not ask why there is anything at all, or what matters morally, and that faith answers those. For many scientists the root is simpler: upbringing, community, and religious experience.

      Each of these is an answer to a question about reasons, not a result of an experiment.

  - type: text
    id: atheist
    title: "Reasons scientific atheists give"
    body: |
      And for disbelief, as its defenders would put it.

      According to **Richard Dawkins** (b. 1941), the Oxford biologist, in *The God Delusion* (2006): the existence of a creator is a hypothesis about the world, which he calls the "God hypothesis", and the evidence does not support it; natural selection explains the appearance of design without a designer.

      According to others, science has explained step by step what once seemed to need a divine cause, so a god is an unnecessary extra assumption (the parsimony argument of Level 7). Others point to the problem of evil, or find that physical explanation needs no further layer.

      A third group says the whole contest is mistaken. Stephen Jay Gould (1941-2002) proposed in a 1997 essay, and in *Rocks of Ages* (1999), that science and religion are "non-overlapping magisteria", science dealing with the facts of nature and religion with values and meaning, so neither can refute the other. Critics reply that religions also make claims about the world (a creation, a miracle), so the two do overlap.

  - type: mcq
    id: reasons
    title: "Match the reason to the thinker"
    prompt: |
      A scientist says: "Whether God exists is a hypothesis about the world. I have looked at the evidence, and natural selection removes the main reason to suppose a designer." Whose view, **according to** the lesson, is this?
    options:
      - text: 'Richard Dawkins, in *The God Delusion*.'
        correct: true
        feedback: |
          Yes: the "God hypothesis" and natural selection as the answer to design.
      - text: 'Francis Collins, in *The Language of God*.'
        feedback: |
          Collins accepts evolution but reads it as the way God creates, and draws the opposite conclusion about the evidence.
      - text: 'Stephen Jay Gould, in his essay on non-overlapping magisteria.'
        feedback: |
          Gould held that science cannot settle the question of God at all, since religion deals with a different domain.
    explanation: |
      Notice that Collins and Dawkins accept the same biology. They differ on what it implies for God, so the disagreement is about interpretation and prior commitments, not about the facts.

  - type: mcq
    id: reasons-trap
    title: "Trap: the survey measures belief, not reasons"
    prompt: |
      Ecklund found that 36% of scientists at elite universities believe in God while about half call themselves religious in some sense. What can we conclude?
    options:
      - text: 'The numbers show belief and self-description, not the reasons: some scientists with a religious identity do not believe in God (for instance for cultural or family reasons), and a number says nothing about why a person believes or disbelieves.'
        correct: true
        feedback: |
          Yes. To learn reasons one needs interviews, arguments and texts, which is why Ecklund also interviewed 275 of her scientists.
      - text: 'The 14 percentage points between 36% and 50% are scientists who secretly believe but will not say.'
        feedback: |
          Nothing supports that. A religious identity without belief in God is a real and common position, held for cultural, ethnic or moral reasons.
      - text: 'Belief in God is the only reason anyone is religious.'
        feedback: |
          Religions involve practice, community, tradition and meaning, which people can value without the doctrine.
    explanation: |
      The difference between 36% and 50% is 14 points, a gap between identity and doctrine. It also shows how a sentence such as "half of scientists are religious" can be true and misleading at the same time.

  - type: mcq
    id: better-evidence
    title: "What would be better evidence?"
    prompt: |
      Which of these would tell us **more** about whether religion and science conflict for scientists, than another headline percentage?
    multiple: true
    options:
      - text: 'Interviews asking scientists how they reconcile their work and their faith, or why they left it.'
        correct: true
        feedback: |
          Yes: reasons come out of conversation, not a tick box.
      - text: 'The same questions asked of the same people over time, or of matched groups from several countries.'
        correct: true
        feedback: |
          Yes: this separates trends from the accident of a single sample and tests whether the pattern depends on place or generation.
      - text: 'A larger sample of the same self-selected group with the same wording.'
        feedback: |
          More people give a narrower sampling margin but leave the bias unchanged. Precision is not the same as accuracy.
    explanation: |
      Better design beats bigger numbers. Good studies vary the population, track people over time, and ask open questions as well as closed ones.

  - type: text
    id: part
    title: "Where thoughtful people part ways"
    body: |
      | Question | Views | Turns on |
      |---|---|---|
      | Why are scientists less religious than the public? | Science erodes belief, or doubters self-select into science | Causal direction, which a snapshot cannot show |
      | What does the data show about God? | Experts' disbelief is weak evidence for atheism, or experts' belief is weak evidence for theism | Whether experts on nature are experts on God |
      | Do science and religion conflict? | Yes, rival claims about the world, or no, different questions | Whether religion makes factual claims |

      The facts (the percentages, with their caveats) are not disputed. The disagreement is in the second and third columns: what the facts mean, and which questions science is able to answer.

  - type: text
    id: summary
    body: |
      **Next:** why did modern science arise where it did? A theology of science says that laws are divine thoughts; secular alternatives give other accounts, and the lesson **A Theology of Science** weighs them.
