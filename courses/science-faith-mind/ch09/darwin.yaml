id: ch09-darwin
title: "Darwin and the Religious Response"
kind: concept
own: |
  The setting: a population of organisms in which a heritable trait comes in two variants, A and B. Write $p$ for the fraction of the population carrying A, and $w>1$ for the relative reproductive success of A: each A-individual leaves $w$ offspring for every one left by a B-individual (a simple model with fixed $w$ and no mating). The theory in question is **evolution by natural selection**, proposed by Charles Darwin (1809-1882) and Alfred Russel Wallace (1823-1913) in 1858 and set out in Darwin's *On the Origin of Species* (1859).
  - **Natural selection** is variation among offspring, inheritance of traits, and unequal reproduction. After one generation the fraction carrying A is
  {{ $$p'=\frac{w\,p}{w\,p+(1-p)}$$ }}
  - **Random variation, non-random filtering.** Mutation supplies variants whose usefulness is not what makes them appear; selection is what makes useful ones spread. In the odds $p/(1-p)$, each generation multiplies the odds by $w$, so after $n$ generations:
  {{ $$\frac{p_n}{1-p_n}=w^{\,n}\,\frac{p_0}{1-p_0}$$ }}
  - **What was documented at Oxford.** On 30 June 1860 Bishop Samuel Wilberforce (1805-1873) and Thomas Henry Huxley (1825-1895) both spoke at the British Association meeting; no verbatim record exists, and the famous "monkey" exchange is reported in different versions. Wilberforce's objections were largely scientific; "science against religion" is a later retelling.
  - **Theistic evolution** (according to Asa Gray, 1810-1888): selection explains how species arise, and God is the author of the laws or variation behind it. Darwin, writing to Gray, said he was "inclined to look at everything as resulting from designed laws" but became "bewildered" about the details. Charles Hodge (1874) answered "What is Darwinism? It is Atheism", because it denied design in nature.
  - **Young-earth creationism and intelligent design.** Young-earth creationism reads Genesis literally and dates creation to about six thousand years ago (Ussher's chronology); measured by lead isotopes in meteorites, the Earth's age is
  {{ $$T_{\text{Earth}}\approx 4.55\times10^{9}\ \text{yr}$$ }}
  Intelligent design (Michael Behe, *Darwin's Black Box*, 1996) argues that some systems are irreducibly complex and so point to a designer; in *Kitzmiller v. Dover* (2005) a US court ruled it could not be taught as science in a public school, a legal ruling that takes no position on whether a designer exists.
  - **Three layers.** That life evolved is established science; whether evolution is purposed or purposeless is metaphysics; how to read Genesis is theology. Traditions answer the last two differently.
cards:
  - type: mcq
    id: hook
    title: "Guess: how did believers react?"
    prompt: |
      Charles Darwin (1809-1882), an English naturalist, published *On the Origin of Species* in 1859. It argued that living species descend from common ancestors and change by a process called natural selection. Before any history, guess: how did Christian thinkers of the following decades react?
    options:
      - text: 'They were divided: some attacked the theory, some accepted it and fitted it into their theology, and many first argued over the science.'
        correct: true
        feedback: |
          Yes. Documented examples are coming: the botanist Asa Gray defended Darwin and called himself a theist; the Princeton theologian Charles Hodge called Darwinism atheism; and Bishop Samuel Wilberforce raised scientific objections.
      - text: 'They all rejected it at once, as a direct attack on Genesis.'
        feedback: |
          A common picture, but not what the record shows. Several religious scientists and theologians accepted evolution early, and many objections were about evidence, not Scripture.
      - text: 'They all welcomed it, since a long, orderly process shows God''s wisdom.'
        feedback: |
          Some did argue this, but others thought the theory removed purpose from nature. The reaction was mixed, and the disagreement is the subject of this lesson.
    explanation: |
      The "science versus religion" story is too simple. This lesson separates the science of evolution from the positions people built on it, and keeps three layers apart: what is established, what is debated, and what rests on faith or metaphysics.

  - type: text
    id: claim
    title: "What Darwin actually claimed"
    body: |
      Darwin was not the only one who reached the idea. Alfred Russel Wallace (1823-1913) sent him an essay in June 1858 describing a very similar mechanism, and extracts of both men's work were read together at the Linnean Society of London on 1 July 1858. Darwin's book followed in November 1859.

      The claim has two parts. **Common descent**: living species share ancestors, so the tree of life branches. **Natural selection**: a mechanism for how adaptation arises, built from three facts that can each be observed.

      - Offspring **vary** from one another.
      - Much of the variation is **inherited**.
      - Some variants leave more offspring than others in their environment.

      Repeat that over many generations and traits that help survival and reproduction become common. Note the limits. Evolution describes how populations change over generations; it says nothing about whether a purpose lies behind the process, and it does not use any word such as "progress" in its definition.

  - type: order
    id: order-selection
    title: "One round of selection"
    prompt: |
      Put one round of natural selection in order, starting from a population of organisms.
    steps:
      - 'Offspring in the population differ from one another in some trait.'
      - 'Some of that variation is inherited from parents.'
      - 'Individuals with some variants survive and leave more offspring.'
      - 'The next generation has a larger share of the helpful variants.'
    hint: 'Variation has to exist before anything can be favoured.'
    explanation: |
      Variation, inheritance, differential reproduction, a changed population. Nothing in the list needs foresight; the filter is the environment.

  - type: mcq
    id: random-trap
    title: "Trap: evolution is just chance"
    prompt: |
      A critic says: "Evolution claims an eye arose by pure chance, and chance cannot build anything so intricate." Which reply describes the theory correctly?
    options:
      - text: 'New variants appear by mutation, whose appearance is not driven by how useful they would be; selection is not random, since useful variants spread more often. The two together are not "pure chance".'
        correct: true
        feedback: |
          Yes. Biologists call the first step random with respect to usefulness, and the second step non-random. Many small steps, each filtered, can build what one lucky leap could not.
      - text: 'Everything in evolution is chance, and the odds simply happened to be favourable.'
        feedback: |
          This grants the critic the picture he started with. Selection is a systematic filter, so the outcome is far from a single lucky draw.
      - text: 'Nothing in evolution is random; mutations arise in the direction the organism needs.'
        feedback: |
          Mutations do not arise because they would help. If they did, there would be nothing for selection to do. Randomness in the variation is part of the standard theory.
    explanation: |
      A fair critic can still ask whether the theory explains a given structure, and that is a question for evidence. But "pure chance" misdescribes the claim. The next two cards show how filtering amplifies a small advantage.

  - type: text
    id: odds
    title: "How a small edge accumulates"
    body: |
      Take a population with two variants, A and B, of a heritable trait. Let $p$ be the fraction carrying A, and let A-individuals leave $w$ offspring for every one that a B-individual leaves. This is a simple model: fixed $w$, offspring identical to the parent, no mating. Before selection, A-offspring number $w\,p$ and B-offspring number $1-p$ (per parent). So the new fraction of A is

      $$p'=\frac{w\,p}{w\,p+(1-p)}$$

      Look at the odds $p/(1-p)$ of A against B. Dividing $p'$ by $1-p'$ gives

      $$\frac{p'}{1-p'}=w\,\frac{p}{1-p}$$

      Each generation multiplies the odds by $w$. After $n$ generations the odds are multiplied by $w^n$. This is the same odds-times-ratio structure as Bayes' rule in odds form, applied to a population instead of a belief.

  - type: numeric
    id: one-gen
    title: "One generation"
    prompt: |
      A trait variant A is carried by a fraction $p = 0.1$ of a population. A-individuals leave $w = 1.1$ offspring for every one left by the others (a 10% edge). In the simple model, which fraction of the next generation carries A?
    answer: 0.1089
    tolerance: 0.0005
    answerText: '0.1089'
    wrong:
      - value: 0.11
        feedback: |
          That is $1.1\times 0.1$, which forgets that the whole population also has to sum to one. Divide by the total, $1.1\times0.1 + 0.9 = 1.01$.
      - value: 0.1
        feedback: |
          A 10% edge is a real change, small as it is: the fraction rises slightly each generation.
    hint: 'A-offspring: 1.1 times 0.1. Others: 0.9. Divide A by the total.'
    explanation: |
      A-offspring count $0.11$, the others $0.9$, total $1.01$, so the new fraction is $0.11/1.01 \approx 0.1089$. A tiny shift in one generation, but it repeats.

  - type: numeric
    id: fifty-gen
    title: "Fifty generations"
    prompt: |
      Same population: the fraction of A is $0.1$ at the start, and A leaves $1.1$ offspring for each one left by the others, in every generation. What fraction carries A after 50 generations?
    answer: 0.93
    tolerance: 0.005
    answerText: '0.93'
    wrong:
      - value: 0.2237
        feedback: |
          That is the value after 10 generations. The odds keep multiplying by 1.1, and fifty rounds multiply them by about 117.
      - value: 0.5
        feedback: |
          The fraction does not stop at one half; it keeps rising while A keeps its edge.
    hint: 'The odds $p/(1-p)$ start at $1/9$ and are multiplied by $1.1$ every generation. Convert the odds back to a fraction at the end.'
    explanation: |
      The starting odds are $0.1/0.9 = 1/9$. After 50 generations they are $1.1^{50}/9 \approx 117.4/9 \approx 13.04$, so the fraction is $13.04/14.04 \approx 0.929$. A 10% edge takes a rare variant to almost everyone within fifty generations. The model assumes the edge never changes, which real populations do not guarantee.

  - type: mcq
    id: theory-trap
    title: "Trap: just a theory"
    prompt: |
      A student says: "Evolution is only a theory, so it is only a guess." Which reply best matches how scientists use the word?
    options:
      - text: 'In science a theory is an explanation built from tested observations and hypotheses, not a hunch; calling it "a theory" says nothing about how well supported it is.'
        correct: true
        feedback: |
          Yes. The US National Academy of Sciences, in its 1998 booklet on teaching evolution, describes scientific theories as "explanations of natural phenomena built up logically from testable observations and hypotheses", and says "theory" in science does not mean a guess or hunch.
      - text: 'A theory is a guess that becomes a law once it is proved.'
        feedback: |
          A common school-level picture, but theories do not turn into laws. A law usually states a regularity (often in an equation); a theory explains why. They are different kinds of statement.
      - text: 'Evolution is a fact, so it cannot also be a theory.'
        feedback: |
          Common descent as a pattern in the history of life and natural selection as its explanation can both be said. "Fact" and "theory" are not opposites, since a theory explains facts.
    explanation: |
      The everyday sense of "theory" (a hunch) and the scientific sense (a tested explanation) differ, and the slogan trades on the mix-up. This does not say a theory cannot be wrong; geocentrism was once well supported. It says the word alone settles nothing.

  - type: mcq
    id: ladder-trap
    title: "Trap: the ladder of progress"
    prompt: |
      A newspaper headline says: "Humans evolved from monkeys, so why are there still monkeys?" Which statement corrects the picture?
    options:
      - text: 'The theory says humans and today''s monkeys and apes share ancestors; one branch does not turn into another. Evolution branches like a tree, with no ladder and no "most advanced" rung.'
        correct: true
        feedback: |
          Yes. The question is like asking why you still have cousins if you descend from your grandparents. All living species are at the tips of branches.
      - text: 'Evolution moves each lineage steadily toward more complex forms, ending in humans.'
        feedback: |
          The theory has no built-in direction toward complexity or humans. Selection favours what works in a local environment, and simpler forms often do very well.
      - text: 'Monkeys are failed humans, kept alive in places where nothing better evolved.'
        feedback: |
          This keeps the ladder. Monkeys are well adapted to their own ways of life, and selection does not aim at humans.
    explanation: |
      The ladder is the most widespread picture of evolution and the least faithful to the theory. It matters for the religious debate too: a ladder leading to humans sounds like purpose, a branching tree does not say anything about it.

  - type: mcq
    id: origin-life
    title: "Trap: evolution explains the origin of life"
    prompt: |
      A friend says: "If evolution is true, it must also explain how the first living thing appeared." What does the theory of evolution by natural selection actually cover?
    options:
      - text: 'It starts once there are self-copying, varying organisms and describes how they change; how life first arose from non-living chemistry is a separate research question, abiogenesis, which is unsettled.'
        correct: true
        feedback: |
          Yes. Selection needs copying, variation and inheritance, so it applies to the history of life after copying exists. The origin of the first copiers is studied separately, and nobody can honestly say it is solved.
      - text: 'It explains the origin of life completely, from the first molecule to humans.'
        feedback: |
          The theory is silent on the first step. This also matters philosophically: a person who says "evolution explains everything" claims more than the theory does.
      - text: 'It explains the origin of the universe, and then life follows.'
        feedback: |
          The origin of the universe is cosmology (see the level on origins). Evolution concerns living populations on Earth.
    explanation: |
      Keeping the borders right matters for fair argument. Evolution does not settle how life began, and it does not by itself say whether anything stands behind nature.

  - type: text
    id: oxford
    title: "A famous debate, and what is known"
    image:
      src: img/wilberforce.webp
      alt: "Portrait of Samuel Wilberforce, Bishop of Oxford, in clerical dress"
      caption: Samuel Wilberforce (1805-1873), Bishop of Oxford, reviewed the Origin for a leading magazine and spoke at the Oxford meeting.
      credit: "George Richmond, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Samuel_Wilberforce_(1805%E2%80%931873),_Bishop_of_Oxford,_by_George_Richmond_1868.jpg"
    body: |
      The best-known story: at a meeting of the British Association for the Advancement of Science at the Oxford University Museum, on Saturday 30 June 1860, **Samuel Wilberforce**, Bishop of Oxford, mocked Darwin's theory and asked Thomas Henry Huxley (1825-1895), Darwin's most combative defender, whether he descended from an ape on his grandfather's or his grandmother's side. Huxley, the story goes, answered that he would rather have an ape for an ancestor than a man who used great gifts to hide the truth. Science had crushed religion.

      Here is what historians can say. **No verbatim record exists**, and eyewitness versions of the exchange differ. Huxley's own letter written soon after does not mention the remark. Both sides claimed victory; the majority view is that Darwin's side did well, but that is a later judgment of a muddled afternoon. Wilberforce had reviewed the *Origin* in the *Quarterly Review*, and according to the account on Wikipedia, with coaching from the anatomist Richard Owen. His objections were mainly scientific: he argued that the facts did not support the theory, and he noted that the leading names in science opposed it.

  - type: mcq
    id: oxford-sort
    title: "Documented or retelling?"
    prompt: |
      Which of these statements about the 1860 Oxford meeting are **documented** (rather than later retelling)? Select all that apply.
    multiple: true
    options:
      - text: 'The meeting took place at the Oxford University Museum, seven months after the *Origin* appeared, and both Wilberforce and Huxley spoke.'
        correct: true
        feedback: |
          Documented. The *Origin* was published in November 1859, and the British Association met in Oxford in June 1860.
      - text: 'No verbatim record of what either man said exists.'
        correct: true
        feedback: |
          Documented. This is why versions of the exchange differ.
      - text: 'Huxley''s reply to the ape question is known word for word.'
        feedback: |
          Not so. The wording comes from later accounts, and it varies among them. Huxley''s own letter written soon after does not mention the remark.
      - text: 'Wilberforce attacked the theory only with Bible quotations and no scientific argument.'
        feedback: |
          Not what his review shows. His objections were largely about the evidence, and the review was reportedly coached by Owen.
      - text: 'Everyone present agreed that science had won.'
        feedback: |
          Both sides claimed victory at the time. "Science won" is a later judgment.
    explanation: |
      The scene is easy to turn into a parable of science against religion, which is why it was retold so often. The historical record shows a messy argument in which a bishop made scientific objections and scientists were divided too.

  - type: text
    id: gray
    title: "The botanist who was both"
    image:
      src: img/asagray.webp
      alt: "Photograph of Asa Gray, a bearded man in a dark coat"
      caption: Asa Gray (1810-1888), Harvard botanist, was Darwin's leading American supporter and an early advocate of theistic evolution.
      credit: "John A. Whipple, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Asa_Gray_by_John_Whipple,_1864.jpg"
    body: |
      **Asa Gray**, a Harvard botanist and a devout Christian, defended Darwin in America. Later he collected his essays in *Darwiniana* (1876). According to Gray, the theory can be read in a nontheistic way or in a theistic one, and he favoured the second: selection explains *how* species arise, and God is the author of the laws or the variation behind it. This position is called **theistic evolution**.

      Darwin and Gray wrote to each other. In a letter of 22 May 1860 Darwin said he was "inclined to look at everything as resulting from designed laws", but added "the more I think the more bewildered I become". In the same letter he said that he could not persuade himself that a beneficent and omnipotent God would have designedly created the Ichneumonidae, a family of wasps whose larvae feed inside living caterpillars.

      Notice who disagrees with whom. Gray and Darwin share the biology. They part ways on what the biology means for God: a question of metaphysics and theology, not of biology.

  - type: mcq
    id: layers
    title: "Which layer is the disagreement?"
    prompt: |
      Asa Gray and Charles Hodge, a Princeton theologian, both accepted that Darwin was an honest naturalist. In 1874 Hodge answered the question "What is Darwinism?" with "It is Atheism", because, he wrote, "the denial of design in nature is virtually the denial of God". Gray thought evolution fitted a belief in God. Which description of their disagreement is best?
    options:
      - text: 'They disagreed about whether natural selection is compatible with design by God, a question of theology and metaphysics, not about what the biology says.'
        correct: true
        feedback: |
          Yes. Hodge held that if purpose in nature is not needed to explain adaptation, God is left without a role. Gray held that God could act through the laws and variation behind selection. These are layer-3 positions applied to the same layer-1 facts, and both views are held by thoughtful people today.
      - text: 'They disagreed about the fossil evidence, and Gray had better fossils.'
        feedback: |
          The dispute in this letter exchange is about what the theory implies for God, not about specimens.
      - text: 'Hodge thought Darwin was himself an atheist and Gray thought he was a Christian.'
        feedback: |
          Hodge granted that Darwin personally believed in a creator. His claim was about what the *theory* implies, not about Darwin''s private belief.
    explanation: |
      A caution: Hodge's slogan is the best-known sentence of his book, but his argument is a chain: the theory removes design, and removing design is removing God. A theistic evolutionist rejects the first link (the laws themselves are designed) or the second (God can act through natural processes). Darwin was bewildered and stayed bewildered.

  - type: text
    id: creator
    title: "A small edit"
    body: |
      A small detail shows how careful Darwin was. According to the editorial introduction at Darwin Online, in the second edition of the *Origin*, published within weeks of the first, Darwin added the words "by the Creator" to the closing sentence of the book, the sentence about life's first forms. The first edition says the same without them.

      Why? Historians offer different readings: some say it was a concession to critics, others that it matched what he then believed. The edit itself is documented; the motive is interpretation.

  - type: text
    id: creationism
    title: "Young-earth creationism"
    body: |
      Another response: some Christians read Genesis as a literal history of six days and an early date for creation. In 1650 the Irish churchman James Ussher published a chronology (*Annales veteris testamenti*) that dated the creation to 4004 BCE, on his reading of the Old Testament genealogies. In the twentieth century this reading was revived as **young-earth creationism**. In 1961 John Whitcomb and Henry Morris published *The Genesis Flood*, which argued that the geological record is explained by a worldwide flood, and many later groups built on it.

      In 1925 Tennessee's Butler Act banned teaching human evolution in public schools; John Scopes was convicted at Dayton and fined 100 US dollars, but the conviction was set aside on a procedural ground (a fine over 50 dollars had to be set by a jury).

      According to its defenders, the starting point is **a theological commitment**: the Bible is the authority, read in its plain sense, and science must fit. According to scientists, the claims about the age of the Earth and the geological record are tested, and the tests disagree. Lead isotopes in a meteorite led Clair Patterson to an age for the Earth of 4.55 billion years (plus or minus 70 million) in 1956, and the value has barely changed.

  - type: mcq
    id: yec-layers
    title: "Science and theology in young-earth creationism"
    prompt: |
      Take the statement "the Earth is about six thousand years old". For a young-earth creationist, it comes from a reading of Genesis. Which analysis separates the layers correctly?
    options:
      - text: 'The age of the Earth is a question for evidence, and the measurements give about 4.55 billion years. How to read Genesis is a theological question. Other believers hold that Genesis is not a chronology, so the clash is with one reading, not with all religion.'
        correct: true
        feedback: |
          Yes. The measured age is layer 1. The literal reading is layer 3 (faith and interpretation), and many Jews and Christians read the early chapters of Genesis as something other than a timetable. The first layer cannot be settled by the third in either direction.
      - text: 'Since the claim comes from a religious text, it is not a claim about the world and cannot be tested.'
        feedback: |
          A claim that the Earth is six thousand years old is a claim about the world, so it can be tested; that is why the dispute is about evidence at all.
      - text: 'Since the claim is old, it must have been refuted in 1859 by Darwin.'
        feedback: |
          Darwin''s argument needs long time, but the age of the Earth is settled by geology and radiometric dating, not by his book.
    explanation: |
      This is the pattern of Barbour's typology: a conflict appears only where a religion's claims overlap the questions that science treats as its own. Young-earth creationism places its claim inside that overlap and takes the clash to be real; Gray and others read the text differently so that there is none.

  - type: text
    id: design
    title: "Intelligent design"
    body: |
      A third response returns to a theme from the lesson From Paley to Darwin: The Design Argument. William Paley (1743-1805) had argued that a watch shows a watchmaker, and living things show a designer. Darwin's alternative removed the need for one as an explanation of adaptation. **Intelligent design** (ID) is the late-twentieth-century movement that argues that some features of nature are better explained by a designing intelligence.

      The best-known version is by the biochemist **Michael Behe**. In *Darwin's Black Box* (1996) he defined a system as **irreducibly complex** if it has several interacting parts and the removal of any one stops its basic function; he argued that such systems, could not arise by a gradual Darwinian path. According to reviews of the book, Behe accepts common descent. So ID is not the same thing as young-earth creationism, though the two movements share supporters.

      Critics answer that parts can have other functions at earlier stages and be recruited later, and that "no known path" is not the same as "no path". Behe's side answers that this does not show a path was available. The disagreement is live among a few scientists and many philosophers, and the scientific mainstream rejects ID's claims.

  - type: mcq
    id: kitzmiller
    title: "What did the Dover court decide?"
    prompt: |
      In 2004 the school board of Dover, Pennsylvania, required high-school biology teachers to present intelligent design as an alternative to evolution. In *Kitzmiller v. Dover Area School District*, decided on 20 December 2005, Judge John E. Jones III ruled against the board. Which statement describes the ruling correctly?
    options:
      - text: 'The court found that teaching ID in a public-school science class as an alternative to evolution violated the US Constitution, and that ID is not science; it took no position on whether ID might be true.'
        correct: true
        feedback: |
          Yes. A US court decided a legal question about public schools; it also concluded that ID was a religious view and could not be taught as science there. The judge wrote that ID could still be studied and discussed elsewhere. A court cannot decide whether a designer exists.
      - text: 'The court proved scientifically that no designer exists.'
        feedback: |
          Courts do not settle metaphysics. The ruling concerned what may be taught as science in a public school, and the judge took no position on whether ID might be true.
      - text: 'The court ruled that evolution is the only theory that any school may mention.'
        feedback: |
          It ruled on the board''s policy requiring ID to be presented as an alternative in science class. The judge also said ID could be studied, debated and discussed elsewhere.
    explanation: |
      Two layers again. The legal ruling is established fact. Whether ID is good science is debated in a narrow band (a few scientists defend it, most reject it). Whether a designer lies behind the world, as the lesson on the design argument showed, is a question of metaphysics that biology alone does not settle.

  - type: mcq
    id: sort-views
    title: "Four views of the same science"
    prompt: |
      Which description fits **theistic evolution**, as Asa Gray held it?
    options:
      - text: 'Accepts evolution as science and holds that God works through its laws and variation; the biology is shared with Darwin, the metaphysics differs (Gray).'
        correct: true
        feedback: |
          Yes: this is **theistic evolution**. It sits near Integration or Dialogue in Barbour's typology: the science is accepted whole, and theology adds a layer on top.
      - text: 'Rejects the evolution of life because Genesis is read as literal history, and dates the Earth at about six thousand years.'
        feedback: |
          This is young-earth creationism, not theistic evolution. It puts a religious claim in the territory of science and takes the clash as real.
      - text: 'Accepts common descent and an old Earth, but argues that some structures are irreducibly complex and need a designer.'
        feedback: |
          This is intelligent design (Behe), not theistic evolution. It disputes that natural selection is enough, which theistic evolution does not.
    explanation: |
      Three positions, one science. The difference between them is not what the fossils show; it is which questions each one assigns to science, which to religion, and how many of them overlap.

  - type: text
    id: summary
    body: |
      **Next:** the claim that tests every picture of nature: a miracle, an event that breaks the laws. The next lesson follows David Hume's argument about when we should believe a report of one, and its Bayesian reading.
