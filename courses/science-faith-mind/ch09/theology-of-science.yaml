id: ch09-theology-of-science
title: "A Theology of Science"
kind: concept
own: |
  The setting: the **scientific revolution**, the period from the 1500s to the 1680s in which Europeans built the mathematical, experimental study of nature that became modern science. Historians ask why it happened where and when it did, and what a "law of nature" is.
  - **The Needham question.** According to the historian of China Joseph Needham (1900-1995), China was long ahead of Europe in technology yet did not produce mathematical physics of the Galileo-Newton kind; why not? According to Nathan Sivin, the question is a counterfactual about a single history, so it may have no clean answer.
  - **The theological thesis.** According to Alfred North Whitehead (1861-1947), the confidence that nature is orderly and can be understood was, in essence, an unconscious inheritance from {{ medieval theology }}: one rational creator, a world that is orderly but freely made, so it must be observed and not only deduced. Critics reply that other cultures and pre-Christian thinkers also sought order, and that a religious age makes every early scientist religious.
  - **Laws as decrees.** According to Descartes, God laid down the laws of nature as a king lays down laws in his kingdom; according to Needham, the Western idea of a law of nature grew from {{ a celestial lawgiver }}, which he thought Chinese thought lacked (a claim now disputed). Kepler's third law (1619) is the model of such a law: for planets orbiting the Sun, with period $T$ and semi-major axis $a$,
  {{ $$T^2 = k\,a^3$$ }}
  with $k$ the same for all planets ($k=1$ for $T$ in years and $a$ in astronomical units).
  - **What a law is.** According to the lawgiver reading, a law governs events. According to the Humean best-system view (David Lewis), a law is {{ a regularity in the simplest and strongest summary of all the facts }}, with no ruler behind it.
  - **Secular and institutional rivals.** According to Robert Merton (1938), Puritan values were one important element in the growth of science in 17th-century England, not the only one. The Royal Society was founded on 28 November 1660, and Ibn al-Haytham (c. 965-c. 1040) already tested optical claims by experiment in Cairo between 1011 and 1021.
  - **Why science is intelligible.** According to Einstein (1936), "the eternal mystery of the world is its comprehensibility". According to Alvin Plantinga (2011), science and theism show {{ superficial conflict but deep concord }}, while science and naturalism show the reverse; naturalists reply that comprehensibility can be a brute fact or a result of evolved minds.
  - **Three layers.** Dates, texts and institutions are established fact. How much religion, institutions and economics each contributed is live scholarly debate. Whether laws are God's thoughts is a metaphysical commitment, and neither the origin of science nor its success settles it.
cards:
  - type: mcq
    id: hook
    title: "Guess: what explains where science began?"
    prompt: |
      By about 1000 CE China had paper, printing, the compass and gunpowder, yet the mathematical physics of Galileo and Newton arose in Europe in the 1600s. Before any theory, guess: how well do historians agree on **why**?
    options:
      - text: 'They agree on one main cause, and only the details are open.'
        feedback: |
          Tempting, because a famous event seems to need one famous cause. But no single cause has won agreement; each proposal explains some facts and strains against others.
      - text: 'They have several candidate causes, each partly supported, and none is settled.'
        correct: true
        feedback: |
          Yes. Religion, institutions, trade, politics and the accident of individual lives are all argued, and the lesson asks what each candidate can and cannot show.
      - text: 'They know nothing: every proposal is equally good.'
        feedback: |
          Too pessimistic. Some proposals are better supported than others and some predictions can be tested against other cultures. "Open" does not mean "arbitrary".
    explanation: |
      This is a layer-2 question: scholars share the facts and weigh them differently. The aim here is to see which premises each answer rests on, not to crown a winner.

  - type: text
    id: needham
    title: "The Needham question"
    image:
      src: img/needham.webp
      alt: Black-and-white style portrait photograph of Joseph Needham seated in his office at Caius College, Cambridge, in 1965
      caption: Joseph Needham (1900-1995), a biochemist who became a historian of Chinese science, asked why modern science did not arise in China.
      credit: Kognos, CC BY-SA 4.0, via Wikimedia Commons
      link: https://commons.wikimedia.org/wiki/File:Joseph_Needham_in_Cambridge_1965_04_(cropped).jpg
    body: |
      Joseph Needham (1900-1995) was a British biochemist who, after wartime visits to China in the early 1940s, began the multivolume *Science and Civilisation in China*. His project raised a famous puzzle, now called the **Needham question**: why did Chinese science, which was often ahead of Europe for centuries, stay close to practical and empirical work, and what in Chinese civilisation held back the rise of modern science? A second form asks the mirror question: why did mathematical science rise in the West around the time of Galileo?

      Not every historian accepts the question. According to Nathan Sivin, a collaborator of Needham, it is a **counterfactual** (what would have happened if...), and such questions may not lead to a useful answer.

  - type: mcq
    id: counterfactual
    title: "Why is the question hard to settle?"
    prompt: |
      A historian wants to test the claim "factor X caused modern science to arise in Europe". What makes this much harder than testing a drug in a clinical trial?
    options:
      - text: 'There is only one history, and Europe and China differ in many ways at once, so each candidate cause is tangled with the others.'
        correct: true
        feedback: |
          Yes. We cannot rerun history while changing one thing. Comparisons between cultures help, but each culture differs in religion, politics, geography and trade together.
      - text: 'Historians have no written records from either side.'
        feedback: |
          Records exist in abundance, in Europe and China alike. The difficulty is not missing data but too many tangled differences and a single outcome.
      - text: 'Science is a purely random event, so no cause can exist.'
        feedback: |
          Randomness may play a part, but "no cause can be found" does not follow. The claim is only that isolating a cause is hard.
    explanation: |
      This is why the lesson keeps asking "what would count as evidence for or against this answer?". An answer that cannot be tested against any other case is a story, not yet an explanation.

  - type: text
    id: whitehead
    title: "A theological answer"
    body: |
      One famous answer is theological. Alfred North Whitehead (1861-1947), in the Lowell Lectures of 1925 published as *Science and the Modern World*, argued in essence that the confidence that nature is orderly, and that its details can be linked to their causes, was an unconscious derivative of medieval theology. People trained for centuries to believe in one rational God found it natural to expect a rational world. R. Hooykaas, in *Religion and the Rise of Modern Science* (1972), argued along related lines that the biblical idea of a free creator helped shape early science.

      The argument can be put as a chain. According to its defenders:

  - type: order
    id: chain
    title: "The chain of the theological thesis"
    prompt: |
      Put the steps of the thesis, as its defenders state it, in order.
    steps:
      - 'Medieval theology teaches one rational creator who made the world.'
      - 'So the world is expected to be orderly, with regularities to be found.'
      - 'The creator is free, so the order is not forced: it cannot be deduced from pure thought and must be observed.'
      - 'Minds made in the creator''s image are expected to be able to grasp that order.'
      - 'So a lifetime spent measuring nature is worth the effort, and early scientists began it.'
    hint: |
      Start with the belief, end with the practice. The word "free" explains why observation is needed.
    explanation: |
      The two halves matter. "Rational" gives the expectation of order; "free" gives the need to look instead of deduce. Defenders say the combination, and not either half alone, favoured experiment.

  - type: mcq
    id: critic
    title: "What would weaken the thesis?"
    prompt: |
      According to critics, the theological thesis claims that belief in a rational creator was important for modern science. Which findings would count **against** it, as distinct from merely failing to support it?
    multiple: true
    options:
      - text: 'A society that firmly believed in a rational creator for centuries and produced no interest in systematic study of nature.'
        correct: true
        feedback: |
          Yes. If the supposed cause is present for a long time without the effect, the claim that it is a main cause weakens.
      - text: 'A society with no creator at all that developed careful, lawlike science.'
        correct: true
        feedback: |
          Yes. It would show the belief is not needed, though the thesis only claims that it helped in one case, so defenders might reply that other roads exist.
      - text: 'The fact that most early scientists were religious.'
        feedback: |
          This fits the thesis but fits its rivals just as well: nearly everyone in the period was religious, so it cannot tell the theories apart.
      - text: 'The fact that Newton also wrote on theology.'
        feedback: |
          A scientist's private beliefs show that religion and science can live in one mind. They do not test whether one caused the other.
    explanation: |
      A test needs a case where the explanations predict different things. Being religious in a religious age predicts nothing that its rivals do not.

  - type: text
    id: decrees
    title: "Laws as decrees of a lawgiver"
    body: |
      A **law of nature** is a rule that the behaviour of things follows, such as "planets sweep equal areas in equal times". The very phrase is a metaphor from human law. According to Descartes (1596-1650), in a letter to Mersenne of 15 April 1630, God laid down the laws of nature just as a king lays down laws in his kingdom, and the mathematical truths depend entirely on God. To say they are independent of God would, he argued, make God subject to fate like Jupiter or Saturn. (This is how scholars report the letter; we paraphrase it in essence.)

      Isaac Newton, in the General Scholium added to the *Principia* in 1713 (second edition), argued in essence that the system of the Sun, planets and comets could only come from the counsel and dominion of an intelligent and powerful Being. Needham made a historical claim in 1951: the Western idea of laws of nature grew out of a **celestial lawgiver** legislating for nature, and he argued that Chinese thought lacked such an idea. Scholars dispute this; Guo Bixin (2024, preprint) argues that Chinese texts contain a notion of natural law in the words *dao* and *li*.

  - type: mcq
    id: king
    title: "What does the king analogy say?"
    prompt: |
      According to Descartes, how are the laws of nature related to God?
    options:
      - text: 'They are decrees that God laid down, as a king lays down laws in his kingdom, so they depend on God.'
        correct: true
        feedback: |
          Yes. The law is not a rule outside God that God must obey; it exists because God set it.
      - text: 'They are a fixed order outside God which even God must obey.'
        feedback: |
          Descartes rejects this. He said that treating truths as independent of God makes God like a pagan deity bound by fate.
      - text: 'They are chance regularities with no creator behind them.'
        feedback: |
          That is closer to the Humean view that appears later in the lesson. Descartes holds the opposite: a creator is the source.
    explanation: |
      On this view the success of mathematics in physics is not a coincidence. The same mind that set the laws made ours, so we can find them: the idea behind the saying often attributed to Kepler, "thinking God's thoughts after him". That wording is probably a later condensation, so we state only the idea.

  - type: text
    id: kepler
    title: "A law found in the data: Kepler's third law"
    body: |
      Johannes Kepler (1571-1630) published his third law in 1619, in *Harmonices Mundi* (The Harmony of the World). For planets orbiting the Sun, with orbital period $T$ and semi-major axis $a$ (half the longest width of the ellipse), it says

      $$T^2 = k\,a^3$$

      with the same constant $k$ for every planet. Measure $T$ in years and $a$ in astronomical units (AU, the Earth-Sun distance); then Earth ($T=1$, $a=1$) gives $k=1$. Mars has $a=1.52366$ AU and $T=1.881$ years. Then

      $$T^2 = 3.538, \qquad a^3 = 3.537,$$

      so $T^2/a^3 = 1.000$ to the precision of the data. That a single clean pattern ties every planet together is exactly what a lawgiver reader calls "a thought worth thinking after God", and what a sceptic calls "a regularity that happens to hold".

  - type: numeric
    id: jupiter
    title: "Use the law on Jupiter"
    prompt: |
      Kepler's third law says that for planets orbiting the Sun, $T^2 = a^3$ with $T$ in years and $a$ in AU. Jupiter's semi-major axis is about $a = 5.2$ AU. What is its orbital period $T$, in years?
    answer: 11.86
    tolerance: 0.03
    answerText: '11.86'
    wrong:
      - value: 27.04
        feedback: |
          That is $a^2 = 27.04$. The law squares the period and cubes the distance, so take $a^3 = 140.6$ first, then its square root.
      - value: 140.6
        feedback: |
          That is $a^3 = T^2$. The period is the square root of it.
    hint: |
      Cube 5.2, then take the square root.
    explanation: |
      $a^3 = 5.2^3 = 140.6$, so $T = \sqrt{140.6} \approx 11.86$ years. The observed period is 11.86 years, so one law fitted to Earth and Mars predicts a planet five times farther away.

  - type: mcq
    id: governs-or-summarises
    title: "Same law, two readings"
    prompt: |
      A believer in a divine lawgiver and a Humean philosopher both accept that $T^2 = a^3$ fits every planet. What do they disagree about?
    options:
      - text: 'Whether the law merely summarises the pattern or governs why the planets follow it.'
        correct: true
        feedback: |
          Yes. The lawgiver says the law is a decree that makes planets behave so. The Humean says the law is just the best way to describe how they do behave.
      - text: 'Whether the numbers fit the data.'
        feedback: |
          Both accept the fit. The disagreement is about what, if anything, stands behind the fit.
      - text: 'Whether Kepler lived in the 1600s.'
        feedback: |
          A matter of dates, not of what a law is.
    explanation: |
      The same observations are consistent with both readings, so the data alone cannot decide between them. That is why this is a metaphysical commitment and not an established fact.

  - type: text
    id: humean
    title: "Two ideas of what a law is"
    body: |
      The Stanford Encyclopedia of Philosophy describes two broad families. On the **Humean best-system** view, a law is a regularity that belongs to the true system of statements which best balances **simplicity** and **strength** (how much it says about the facts). The idea goes back to John Stuart Mill (1843) and Frank Ramsey (1928), and David Lewis defended it from his *Counterfactuals* (1973). Nothing stands behind the laws and nothing needs to: they are the economical summary of everything that happens.

      On the **governing** views, laws are more than summaries. According to David Armstrong's *What Is a Law of Nature?* (1983), and to Fred Dretske and Michael Tooley (both 1977), a law is a real relation between properties that makes the regularity hold. A divine lawgiver is the oldest governing picture, though these philosophers do not need God.

  - type: mcq
    id: best-system
    title: "What makes it a law?"
    prompt: |
      On the Humean best-system view (Lewis), what makes "$T^2 = k\,a^3$ for planets" a law and not a lucky coincidence?
    options:
      - text: 'It is a regularity in the simplest and strongest system that summarises all the facts.'
        correct: true
        feedback: |
          Yes. A coincidence would not earn a place in the economical summary, but a pattern that organises many facts at once does.
      - text: 'A lawgiver commands the planets to obey it.'
        feedback: |
          That is the governing picture in its theological form. The Humean view avoids any ruler behind the pattern.
      - text: 'It is true in every logically possible world.'
        feedback: |
          Laws are not logical truths: a world with a different exponent is conceivable. Some necessitarian views say otherwise, but not the best-system view.
    explanation: |
      Notice the price of each view. The Humean gets a simple metaphysics but must say why the universe is so regular; the governing view explains the regularity but adds something beyond the facts.

  - type: text
    id: rivals
    title: "Institutions, Puritans and a Cairo laboratory"
    body: |
      Other answers look elsewhere. Robert Merton, in his 1938 monograph on science in 17th-century England, argued that Puritan values were compatible with scientific values and encouraged science in that time and place. He hedged: in essence, Puritanism was only one important element in the growth of science. Historians still debate the **Merton thesis**.

      **Institutions** matter too. The Royal Society of London dates from 28 November 1660, when twelve men met at Gresham College after a lecture by Christopher Wren to found a college for "physico-mathematicall experimentall learning". Such a society gave scientists a way to check one another's results and to share instruments.

      And the story is not only European. Ibn al-Haytham (c. 965-c. 1040), working in Cairo, wrote a seven-volume *Book of Optics* between 1011 and 1021, in which experiments are used to decide between theories of light and vision. Historians debate how modern his method was, but it shows a strong experimental tradition in a monotheist society before the Royal Society.

  - type: mcq
    id: merton
    title: "What did Merton claim?"
    prompt: |
      According to Merton (1938), what was the role of Puritan values in the growth of science in 17th-century England?
    options:
      - text: 'They were compatible with scientific values and one important element in encouraging science.'
        correct: true
        feedback: |
          Yes. This is the modest form of the thesis, and Merton stated it himself.
      - text: 'They were the single cause of modern science.'
        feedback: |
          Merton did not claim this. A single-cause reading is the popular simplification that critics then attack.
      - text: 'They had nothing to do with it.'
        feedback: |
          That is the thesis of Merton's strongest critics, not Merton's own claim.
    explanation: |
      Always check what the person claimed. Merton also conceded that Puritan beliefs did not directly shape the content or method of science, so the thesis is about encouragement.

  - type: text
    id: comprehensible
    title: "Why is the world comprehensible?"
    body: |
      The theological thesis is about history. A second question is about the present: why does mathematics fit nature so well? Albert Einstein, in his 1936 essay *Physics and Reality*, wrote: "One may say 'the eternal mystery of the world is its comprehensibility.'" He added that this comprehensibility is a miracle.

      A theist like Alvin Plantinga (*Where the Conflict Really Lies*, 2011) argues that this is just what we would expect if a rational mind made both the world and ours: he calls the relation between science and theism one of **superficial conflict but deep concord**, and that between science and naturalism **superficial concord but deep conflict**. A naturalist replies that comprehensibility may be a brute fact needing no explanation, or that minds shaped by evolution fit the parts of nature that matter for survival, and that the further reach of mathematics is then partly luck and partly the habit of building ever better tools. The earlier lessons on the effectiveness of mathematics and on the argument from reason state each side in full.

  - type: mcq
    id: plantinga
    title: "Where does Plantinga place the conflict?"
    prompt: |
      According to Plantinga (2011), between which pair does a deep conflict lie?
    options:
      - text: 'Between science and naturalism (the view that nature is all there is).'
        correct: true
        feedback: |
          Yes. He argues that science and theistic belief fit together, while naturalism combined with evolution undermines our trust in our minds. Critics reply that evolution gives reliable enough minds.
      - text: 'Between science and theism.'
        feedback: |
          This is the popular conflict story. Plantinga argues the conflict is only superficial.
      - text: 'Between science and every worldview alike.'
        feedback: |
          He singles out naturalism, not all worldviews.
    explanation: |
      Whether this inverts the "science versus religion" story or only changes the question is itself disputed, as the closing card shows.

  - type: mcq
    id: trap-origin
    title: "Origin is not truth"
    prompt: |
      Suppose Whitehead is right that theology shaped the beginnings of science. What follows about whether laws are God's thoughts?
    options:
      - text: 'Nothing follows: where an idea came from does not settle whether it is true.'
        correct: true
        feedback: |
          Yes. The same holds in reverse: if science grew from a mix of causes with no religion in it, that would not show that there is no God. Origin and truth are separate questions.
      - text: 'It proves that laws are God''s thoughts.'
        feedback: |
          This is the genetic fallacy in its favourable form: an idea can come from a source that believed it for good or bad reasons and still be true or false on its own merits.
      - text: 'It proves that science depends on faith and is therefore unreliable.'
        feedback: |
          The origin of a method does not decide its reliability. We test a method by its results, whoever started it.
    explanation: |
      Keep the question "how did science begin?" apart from "is the lawgiver view true?". The first is history; the second is metaphysics.

  - type: mcq
    id: part-ways
    title: "Where thoughtful people part ways"
    prompt: |
      Two historians agree that modern science arose in Christian Europe. One stresses medieval theology, the other institutions and trade. Which difference best explains the disagreement?
    options:
      - text: 'They weigh different kinds of cause, and no clean test separates them, because the causes were present together.'
        correct: true
        feedback: |
          Yes. It is a disagreement about weights, and the evidence is one tangled history.
      - text: 'One of them has not read the sources.'
        feedback: |
          Specialists read the same texts and still differ. The disagreement is real, not a mistake of one side.
      - text: 'One of them is a believer and the other an atheist, so neither is reliable.'
        feedback: |
          Believers and non-believers are found on both sides. A historian is judged by evidence and argument, not by worldview.
    explanation: |
      The lesson's habit: name the premise, the value or the kind of evidence at which people part. Here it is how much weight ideas, institutions and trade get, in a case with no control group.

  - type: mcq
    id: layers
    title: "Sorting the claims by layer"
    prompt: |
      Which pairing of claim and layer is right?
    options:
      - text: 'The Royal Society dates from 28 November 1660: established fact. Religion mattered more than institutions: live scholarly debate. Laws are God''s thoughts: metaphysical commitment.'
        correct: true
        feedback: |
          Yes. A date, a weighing of causes, and a statement about what stands behind the laws belong to three different layers.
      - text: 'The Royal Society dates from 28 November 1660: metaphysical commitment. Laws are God''s thoughts: established fact.'
        feedback: |
          Reversed. A founding date is checked in records; "God's thoughts" is not settled by any record or experiment.
      - text: 'All three claims are established fact, since scholars have studied them.'
        feedback: |
          Studying a claim does not turn it into fact. Only the first is settled by records; the others are debated or are commitments.
    explanation: |
      Keeping the layers apart is what lets a believer, a sceptic and a historian read the same lesson and each find it fair.

  - type: text
    id: summary
    body: |
      **Next:** a round of fast questions on this level, each built on a common misconception about science and religion, from the Galileo myth to the miracle odds.
