id: ch09-miracles
title: "Miracles and the Laws of Nature"
kind: concept
own: |
  The setting: someone reports an event $M$ (a miracle, here "an event that breaks a law of nature") and the question is how far to believe the report. Let $E$ be the fact that a witness reports $M$. The philosopher **David Hume** (1711-1776), in Section X of his *Enquiry Concerning Human Understanding* (1748), defined a miracle as {{ "a violation of the laws of nature" }} and argued that the evidence for the laws is so strong that testimony can establish a miracle only if its falsehood would be more miraculous than the event.
  - **Hume's weighing.** Compare two improbabilities: that the event $M$ happened, against that the witness is mistaken or lying. Believe the report only if the second is smaller.
  - **Odds form.** With $P(M)$ the prior probability of the event (before hearing the witness), the odds after the report are
  {{ $$\frac{P(M\mid E)}{P(\neg M\mid E)}=\frac{P(E\mid M)}{P(E\mid \neg M)}\cdot\frac{P(M)}{P(\neg M)}$$ }}
  If a truthful witness certainly reports $M$ when it happened ($P(E\mid M)\approx1$), the likelihood ratio is $1/P(E\mid\neg M)$, so the report wins only when $P(E\mid\neg M)$ is smaller than the prior $P(M)$ (roughly, for small priors).
  - **Several witnesses.** If $n$ witnesses are independent, each false report having probability $q=P(E_i\mid\neg M)$, the likelihood ratio is
  {{ $$\frac{1}{q^{\,n}}$$ }}
  With a prior $10^{-6}$ and $q=10^{-3}$, two witnesses give even odds. Independence is the weak point: witnesses who copy each other count as one.
  - **Prior and worldview.** The same witness and the same likelihood ratio give different posteriors from different priors: for $q=10^{-3}$, a prior of $10^{-3}$ gives about $1/2$, a prior of $10^{-9}$ gives about $10^{-6}$. Where the prior comes from (is there a God who acts?) is a question of worldview, not of probability.
  - **Objections to Hume.** The circularity charge (Johnson 1999, Earman 2000): "uniform experience" against miracles assumes there are no reliable reports of them. The law-violation charge: a law that fails is no longer a law, or the event belongs to a wider law.
  - **Hume did not prove miracles impossible.** His argument is about when testimony is enough; a low prior is not zero, and enough independent, reliable evidence could in principle outweigh it.
cards:
  - type: mcq
    id: hook
    title: "Guess: when to believe a report"
    prompt: |
      A friend who gets such things right 99 times in 100 tells you she saw something that, as far as anyone knows, happens about once in a million times. Before any theory, guess: how far should you believe her?
    options:
      - text: 'Not much: a mistake by a good witness (1 time in 100) is far more likely than an event this rare (1 in a million).'
        correct: true
        feedback: |
          Yes. The comparison is between two improbabilities, and the smaller one is the better explanation. This is the core of the argument the lesson studies.
      - text: 'Fully: she is right 99 times in 100, so she is probably right now.'
        feedback: |
          Her record is good in general, but the 99 in 100 says how often she is right on *ordinary* reports. A claim a million times rarer than usual needs more than an ordinary record.
      - text: 'There is no way to guess; trust depends only on how you feel about her.'
        feedback: |
          There is a way: weigh how rare the event is against how often a good witness errs. The lesson makes that weighing exact.
    explanation: |
      Notice what you did without any formula: you set the rarity of the event against the chance of a mistake. David Hume made that comparison the heart of his essay on miracles, and the odds form of Bayes' rule makes it exact.

  - type: text
    id: definition
    title: "What is a miracle?"
    body: |
      The word has many uses. In everyday talk, "a miracle" is any wonderful and unlikely event. The philosopher **David Hume** (1711-1776), in Section X of his *An Enquiry Concerning Human Understanding* (1748), used a narrower meaning: "A miracle is a violation of the laws of nature". A rare event is not a miracle in this sense; a miracle is one that the laws of nature say cannot happen, brought about (Hume adds in a footnote) by the will of a deity or an invisible agent.

      Others define it differently. Richard Swinburne, in *The Concept of a Miracle* (1970), took a miracle to be a non-repeatable counter-instance to a law of nature that virtually always holds, and he argued the idea is not self-contradictory. A third reading: a miracle is an event that exceeds what nature's own powers could produce, without any law being "broken".

      These definitions matter, because what counts as a miracle changes how hard it is to believe in one.

  - type: mcq
    id: extraordinary
    title: "Rare, or a violation?"
    prompt: |
      Take Hume's meaning: a miracle is a violation of a law of nature. Which of these events is a **miracle in that sense**, rather than an extraordinary natural event?
    options:
      - text: 'A man who had been dead for three days, his heart stopped and his body cold, is walking and talking again with no natural cause at work.'
        correct: true
        feedback: |
          Yes. This is the sort of case Hume uses: it is contrary to what the laws and all experience say, and the report claims no natural cause at work.
      - text: 'A person wins a national lottery with odds of one in fifty million.'
        feedback: |
          Rare, but entirely within the laws of chance: someone wins, and each ticket had the same odds. An improbable event is not a violation.
      - text: 'A tumour in a patient disappears, and doctors have no explanation (a spontaneous remission).'
        feedback: |
          Tempting, but "no explanation yet" is not "no natural cause". Spontaneous remissions are documented in medicine, so this is an unexplained natural event, not by definition a violation.
    explanation: |
      Two different things are easy to run together: an event that is improbable, and one that breaks a law. A defender of miracles can add that an unexplained event is not a miracle yet either; showing that nature *could not* have produced it is a further step.

  - type: text
    id: argument
    title: "Hume's argument"
    body: |
      Hume starts from how we come to trust things. Our belief in a report, he says, rests on experience: how often witnesses in such cases have been right. And our belief in the laws of nature rests on experience too, on a very large body of it. He writes that "a firm and unalterable experience has established these laws", so that for a miracle the proof against it "is as entire as any argument from experience can possibly be imagined". The key premise is this: the evidence against a miracle is "a uniform experience against every miraculous event".

      Then he turns to the witness. His rule, the **maxim**: "no testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact, which it endeavours to establish". In practice, "When anyone tells me, that he saw a dead man restored to life, I immediately consider with myself, whether it be more probable, that this person should either deceive or be deceived, or that the fact, which he relates, should really have happened." And he concludes: "A wise man, therefore, proportions his belief to the evidence."

  - type: order
    id: order-argument
    title: "The shape of the argument"
    prompt: |
      Put the steps of Hume's reasoning about a reported miracle in order.
    steps:
      - 'A miracle is a violation of a law of nature, and experience has established the laws very firmly.'
      - 'So the evidence against any miracle is as strong as evidence from experience can be.'
      - 'A witness reports a miracle; weigh the chance that the witness is mistaken or lying against the chance that the miracle happened.'
      - 'Accept the report only if the falsehood of the testimony would be more miraculous than the event.'
    hint: 'First what the laws rest on, then what that does to the prior, then the witness, then the verdict.'
    explanation: |
      Notice the structure: a premise about the strength of the evidence against the event, then a comparison with the strength of the testimony. It is a weighing, not a ban.

  - type: text
    id: witnesses
    title: "What makes a witness reliable"
    body: |
      Hume also says what he thinks would make testimony strong. In Section X, Part II, he claims that in all history no miracle has been attested by a sufficient number of men

      - "of such unquestioned good-sense, education, and learning, as to secure us against all delusion in themselves";
      - "of such undoubted integrity, as to place them beyond all suspicion of any design to deceive others";
      - "of such credit and reputation in the eyes of mankind, as to have a great deal to lose in case of their being detected in any falsehood";
      - and "attesting facts performed in such a public manner and in so celebrated a part of the world, as to render the detection unavoidable".

      He adds that "all which circumstances are requisite to give us a full assurance in the testimony of men". Whether a given report ever met them is a question of history. What is worth noticing is that Hume's test is a list of *conditions that make a mistake or a lie unlikely*, which is exactly what the odds form will turn into a number.

  - type: mcq
    id: witness-check
    title: "Which reports are stronger?"
    prompt: |
      Following Hume's conditions, which of these changes would make a report of an extraordinary event **more** credible? Select all that apply.
    multiple: true
    options:
      - text: 'More witnesses who did not talk to each other before testifying.'
        correct: true
        feedback: |
          Yes. Independent witnesses are unlikely to share the same mistake or the same lie. Hume asks for "a sufficient number".
      - text: 'The event happened in public, where anyone could have checked it at once.'
        correct: true
        feedback: |
          Yes. Hume asks for facts "performed in such a public manner" that detection of a falsehood is "unavoidable". Easy checking raises the cost of a false report.
      - text: 'The witnesses have a strong wish for the event to be true and would gain from believers.'
        feedback: |
          This lowers credibility: a motive to deceive, or to see what one hopes to see, makes a mistake or lie more likely. Hume wants witnesses with "a great deal to lose".
      - text: 'The story has been told many times and has grown more detailed over the years.'
        feedback: |
          Repetition is not independent confirmation, and details added later raise the chance of embellishment. The number of *tellings* is not the number of *independent witnesses*.
    explanation: |
      Every condition makes "the witness is wrong" less probable. In the next cards that probability is given a name and a number.

  - type: text
    id: odds
    title: "Hume's weighing as odds"
    image:
      src: img/babbage.webp
      alt: "Portrait of Charles Babbage, a man in a dark coat, painted in middle age"
      caption: Charles Babbage (1791-1871), the mathematician and inventor, answered Hume in his Ninth Bridgewater Treatise (1837) with an argument from independent witnesses.
      credit: "Samuel Laurence, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Charles_Babbage_by_Samuel_Laurence.jpg"
    body: |
      Recall Bayes' rule in odds form: for two hypotheses, posterior odds equal the likelihood ratio times the prior odds. Let $M$ be "the miracle happened", $\neg M$ "it did not", and $E$ "a witness reports it". Then

      $$\frac{P(M\mid E)}{P(\neg M\mid E)}=\frac{P(E\mid M)}{P(E\mid \neg M)}\cdot\frac{P(M)}{P(\neg M)}$$

      The last factor is the prior odds of the event, before anyone speaks: this is Hume's "uniform experience". The first factor, the likelihood ratio, compares how likely the report is if the event happened (a truthful witness reports it, so about 1) with how likely it is if it did not (a mistake or a lie, call it $q=P(E\mid\neg M)$). So the likelihood ratio is about $1/q$.

      Hume's maxim, read this way, says: believe only if $1/q$ beats the prior odds against the event, that is, if a false report is *less likely than the event*. Richard Price answered Hume with probability theory in 1767, in *Four Dissertations*; Babbage, in 1837, argued that independent witnesses can add up to more than any improbability. Whether Hume himself meant something this mathematical is disputed, and so is the Bayesian reading.

  - type: numeric
    id: one-witness
    title: "One reliable witness"
    prompt: |
      A report of an event with prior probability $P(M)=10^{-6}$. The witness reports it truthfully if it happened, and falsely (by mistake or lie) in $0.1\%$ of cases where it did not, so $q=10^{-3}$. What is the probability, **in percent**, that the event really happened, given the report?
    answer: 0.1
    tolerance: 0.01
    answerText: '0.1 (about 0.0999)'
    wrong:
      - value: 99.9
        feedback: |
          That is the witness's reliability, not the probability of the event. The prior of one in a million still counts.
      - value: 0.0001
        feedback: |
          That is the prior probability in percent, with the evidence ignored. The report multiplies the odds by 1000.
    hint: 'Prior odds are about $10^{-6}$. The likelihood ratio is $1/q = 1000$. Multiply, then turn odds $o$ into a probability $o/(1+o)$.'
    explanation: |
      Posterior odds are $10^{-6}\times 1000 = 10^{-3}$, so the probability is $10^{-3}/(1+10^{-3})\approx 0.0999\%$. A very good witness raises the chance a thousandfold and still leaves the event at one in a thousand. Hume's maxim says the same in words: a false report (one in a thousand) is still more likely than the event (one in a million).

  - type: numeric
    id: threshold
    title: "How good must the witness be?"
    prompt: |
      Keep the prior $P(M)=10^{-6}$. For the report to make the event **even odds** (posterior odds of 1), the witness must produce a false report in only one case out of how many cases where the event did not happen? (Treat the prior odds as $10^{-6}$.)
    answer: 1000000
    tolerance: 1000
    answerText: '1,000,000'
    wrong:
      - value: 1000
        feedback: |
          That gives a likelihood ratio of 1000, enough to reach odds of $10^{-3}$, not 1.
    hint: 'You need likelihood ratio times prior odds to equal 1, with prior odds $10^{-6}$.'
    explanation: |
      The likelihood ratio must be $10^{6}$, so $q=10^{-6}$: one false report in a million. That is Hume's point made exact: to beat a prior of one in a million, the witness must be wrong less often than one time in a million, a standard hard to meet for any human.

  - type: numeric
    id: two-witnesses
    title: "Two independent witnesses"
    prompt: |
      Same prior $P(M)=10^{-6}$ and same $q=10^{-3}$ for each witness. Now **two independent** witnesses report the event. A false report from both has probability $q^2$. What is the probability, **in percent**, that the event happened?
    answer: 50
    tolerance: 0.5
    answerText: '50'
    wrong:
      - value: 0.2
        feedback: |
          That adds the two reports ($2\times 0.1\%$). Independent evidence multiplies the likelihood ratio, it does not add the probabilities.
      - value: 0.1
        feedback: |
          That counts one witness only. The second, independent witness multiplies the likelihood ratio by 1000 again.
    hint: 'The likelihood ratio for both is $1/q^2$. Multiply by the prior odds $10^{-6}$.'
    explanation: |
      The likelihood ratio is $1/q^2=10^{6}$, so the posterior odds are $10^{-6}\times10^{6}=1$, a probability of $50\%$. This is Babbage's point: independent witnesses multiply, so enough of them can beat any prior. A third gives odds of $1000$, about $99.9\%$.

  - type: mcq
    id: independence
    title: "Trap: many witnesses always beat the prior"
    prompt: |
      A newspaper says: "A thousand people reported the same extraordinary event, so by the multiplication rule the odds are overwhelming." Which reply is right?
    options:
      - text: 'The multiplication rule needs the witnesses to be independent. If they were influenced by each other, a rumour or a shared expectation, they count as little more than one witness.'
        correct: true
        feedback: |
          Yes. The $1/q^n$ rule applies to independent errors. A thousand people repeating one story told them by the same source have one chance to be wrong, not a thousand. Ahmed (2015) argues that independence is plausibly violated in the cases that matter.
      - text: 'More witnesses never help: Hume proved that testimony cannot outweigh the prior.'
        feedback: |
          Hume did not prove this, and the odds form shows why: independent reliable witnesses multiply the likelihood ratio, and enough of them can win.
      - text: 'The number of witnesses does not matter, only whether the best one is honest.'
        feedback: |
          Independent confirmation matters a lot. The point is not that numbers are useless but that *independent* numbers are what help.
    explanation: |
      Both sides can be right here: Babbage that independent witnesses add power, and Hume's defenders that independence is the weak spot in practice. The question for any case is how independent the reports really were.

  - type: text
    id: objections
    title: "Objections to Hume"
    body: |
      Hume's essay has had many critics, and the disagreements are live among philosophers. Three families of objection.

      **Circularity.** Hume says experience is uniformly against miracles. But, the charge runs, he can count the experience as uniform only by setting aside the reports of miracles, which are precisely what is in dispute. Critics who press this include Johnson (1999) and Earman (2000, *Hume's Abject Failure*). Defenders such as Fogelin (2003) answer that "experience" here means ordinary non-testimonial experience, so the premise does not assume the conclusion; and Millican has argued for reading Hume's proof as applying only where the evidence is uniform experience.

      **What a "law" is.** If a law is exceptionless, an event that violates it shows the law was misstated, so no violation is possible. If a law holds "when nothing interferes" (the reading associated with J. L. Mackie, 1982), a miracle is an event in which something outside nature interferes, and no law is broken.

      **The prior.** The probability of a miracle before the report is not given by the laws alone. Swinburne argued that it depends on whether God exists and is likely to act: given such a God, miracles are not improbable, and without one the prior is near zero. Hence a verdict on one report depends on earlier questions, such as the arguments for and against God.

  - type: mcq
    id: circularity
    title: "What is the circularity charge?"
    prompt: |
      Hume writes that the evidence against a miracle is "a uniform experience against every miraculous event". Which statement best captures the **circularity** objection raised against this premise?
    options:
      - text: 'The experience counts as uniform only if no miracle report is taken seriously, but whether such reports are credible is the very question under dispute.'
        correct: true
        feedback: |
          Yes. If some reports of miracles are good, experience is not uniformly against them, so the premise assumes the answer it needs. Hume's defenders reply that "experience" means non-testimonial experience of how nature behaves.
      - text: 'Hume uses the laws of nature to define miracles, and a definition is always circular.'
        feedback: |
          Defining a term by a concept is not circular. The charge is about the *premise* of uniform experience, not the definition.
      - text: 'Hume reasons from the Bible, which is the thing being tested.'
        feedback: |
          Hume uses no religious text as a premise. The charge is about how "uniform" experience is counted.
    explanation: |
      Notice the rival readings: a critic says the premise is question-begging; a defender says it is a reasonable statement about ordinary, non-testimonial experience. The disagreement is about what counts as the evidence, a layer-2 debate.

  - type: numeric
    id: worldviews
    title: "Same witness, different priors"
    prompt: |
      A believer who thinks a God who acts is plausible gives the event the prior $10^{-3}$; a sceptic who thinks the laws are never broken gives it $10^{-9}$ (both toy values). Both hear the same witness with $q=10^{-3}$, so a likelihood ratio of $1000$. About how many chances **in a million** does the **sceptic** now give the event? (Treat prior odds as equal to the prior.)
    answer: 1
    tolerance: 0.02
    answerText: '1'
    wrong:
      - value: 1000
        feedback: |
          That is the likelihood ratio itself. The sceptic's prior $10^{-9}$ times 1000 gives $10^{-6}$, that is one chance in a million.
    hint: 'Posterior odds = $10^{-9}\times 1000$. One in a million is $10^{-6}$.'
    explanation: |
      The sceptic gets odds of $10^{-6}$, about one in a million. The believer gets $10^{-3}\times1000=1$, even odds, about $50\%$. The evidence is identical and the conclusions are far apart, because of the prior. The probability rule is not the source of the disagreement: the priors are, and they come from earlier questions.

  - type: mcq
    id: trap-impossible
    title: "Trap: Hume proved miracles impossible"
    prompt: |
      A student says: "Hume proved that miracles cannot happen." Which reply is most accurate?
    options:
      - text: 'Hume argued about *belief in reports*: testimony can establish a miracle only if its falsehood would be more miraculous than the event. That is a standard to meet, and Hume held that none had met it.'
        correct: true
        feedback: |
          Yes. His claim is about evidence, not about what is possible.
      - text: 'Yes: since a miracle violates the laws, it cannot happen, and Hume showed that.'
        feedback: |
          A violation of a law is "impossible" only if laws are exceptionless by definition, which is the very point under dispute. Hume's argument compares evidence.
      - text: 'No: Hume actually believed in miracles.'
        feedback: |
          Hume was a sceptic about religion. The accurate summary is that he set a high standard of evidence, not that he endorsed miracles.
    explanation: |
      The slogan version of Hume is stronger than his argument. His essay claims that the evidence for a miracle has to beat enormous evidence against it, and that in his judgment history has no case that does.

  - type: mcq
    id: trap-prior
    title: "Trap: a low prior means impossible"
    prompt: |
      Someone says: "If the prior of an event is $10^{-9}$, then the event cannot happen, so no testimony could ever change my mind." In the odds form of Bayes' rule, which statement is correct?
    options:
      - text: 'A tiny prior is not zero: with a prior $10^{-9}$ and a likelihood ratio of $10^{12}$ (a report almost impossible to produce falsely) the odds would reach $1000$. Only a prior of exactly zero cannot be moved.'
        correct: true
        feedback: |
          Yes. Posterior odds are the likelihood ratio times the prior odds: $10^{12}\times10^{-9}=1000$. A prior of zero stays zero whatever the evidence, which is why choosing it is a serious commitment.
      - text: 'A tiny prior is the same as zero, since the event is too rare to count.'
        feedback: |
          Small and zero behave differently. The product with a large likelihood ratio can be large, as the example shows.
      - text: 'Priors are irrelevant: only the likelihood ratio matters.'
        feedback: |
          The prior sets the starting point, so the same likelihood ratio gives different conclusions for different priors (a prior $10^{-3}$ and a prior $10^{-9}$ with ratio $1000$ end near $1/2$ and near $10^{-6}$).
    explanation: |
      This is why a person who says "no evidence could convince me" is claiming a prior of exactly zero, not just a small one. Hume's argument does not require that; it requires only a standard of evidence.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      Three layers, as in earlier lessons. **Established:** the odds form of Bayes' rule; independent errors multiply and copied reports do not; a prior of zero cannot be raised. **Live debate among philosophers:** whether Hume's "uniform experience" assumes what it needs (Johnson and Earman say yes; Fogelin and Millican give a charitable reading); whether the Bayesian reading is faithful to Hume; whether a law that "fails" was ever a law.

      **Faith or worldview:** the prior. A person who holds that a God exists and acts may start from a probability for a miracle that is not tiny; a person who holds that nature is closed starts from one near zero. Neither can fault the other's arithmetic. They differ over a premise decided earlier, in the lessons on the arguments for and against God. The point is a fair one for each side: the believer cannot cite the witness alone to compel the sceptic, and the sceptic cannot cite the laws alone to refute the believer.

  - type: text
    id: summary
    body: |
      **Next:** a guided proof, *Weighing a Miracle Report*: derive exactly when testimony outweighs a tiny prior, and how many independent witnesses it takes, with numbers.
