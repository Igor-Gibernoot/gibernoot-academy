id: ch09-models
title: "Four Models: Conflict, Independence, Dialogue, Integration"
kind: concept
own: |
  The setting: **science** and **religion** can be related in more than one way. Write $D_S$ for the set of questions science treats as its own (what the universe is made of and why it works as it does) and $D_R$ for the set of questions a religion treats as its own (ultimate meaning, moral value, the sacred). According to Ian Barbour (1923-2013, physicist and theologian), the relations fall into four types; the typology is a scholarly tool for sorting positions, not a finding about facts.
  - **Conflict.** According to Barbour, both *scientific materialism* (only science gives knowledge, so religion is false) and *biblical literalism* (the Bible read literally overrides science) assume that the two make rival claims about the same ground. The shared assumption, in symbols:
  {{ $$D_S\cap D_R\neq\varnothing\ \text{ with incompatible answers}$$ }}
  - **Independence (NOMA).** According to Stephen Jay Gould (1941-2002, paleontologist), science and religion are *non-overlapping magisteria* (a magisterium is a domain of teaching authority): the net of science covers the empirical universe, the net of religion covers moral meaning and value, so no clash is possible:
  {{ $$D_S\cap D_R=\varnothing$$ }}
  Gould added that the two do not exhaust all inquiry (art is a further domain):
  {{ $$D_S\cup D_R\neq\text{all inquiry}$$ }}
  Weak spot, according to critics such as Richard Dawkins and Francis Collins: religions make claims about the world (a creation, a resurrection), so the domains do overlap.
  - **Dialogue.** The domains are mostly separate but meet at an edge: questions science raises and cannot answer (why there are laws at all) and parallels of method (models, analogies). Weak spot: it can stay vague about what the conversation yields, and critics find it hard to separate from integration.
  - **Integration.** According to Barbour, the two can be joined into one picture (natural theology, a theology of nature, or a systematic synthesis such as process thought). Weak spot: critics say it is not so easily achieved, and a theology tied to today's theory can age with it.
  - **Where people part ways.** On whether religion makes claims about the world (which decides overlap or not), and on whether the typology itself is useful or only a tidy label for a messy history.
cards:
  - type: mcq
    id: hook
    title: "Guess: same facts, opposite conclusions"
    prompt: |
      Guess before any theory. Two people accept exactly the same scientific facts: the Earth is about 4.5 billion years old and species evolved by natural selection. The first concludes: "So there is no need for God." The second concludes: "So this is how God's creation unfolds." Can two people who agree on every scientific fact still disagree about how science and religion relate?
    options:
      - text: 'Yes: the disagreement is not about the facts, it is about how to relate them to the question of God.'
        correct: true
        feedback: |
          Right. The data are shared; what differs is a further commitment (what science can show about God, and what religion is about). This is why a *map of the relations* is worth drawing before any historical case.
      - text: 'No: if they agree on all the facts, they must agree on everything that matters.'
        feedback: |
          The facts do not settle what they *mean* for a question like God. That step needs extra premises, and the premises can differ.
      - text: 'No: one of them must be misreading the science.'
        feedback: |
          Nothing in the stated facts is misread. The split sits after the facts, not in them.
    explanation: |
      Keep this pair in mind. At the end of the lesson we place them on a map with four regions.

  - type: text
    id: barbour
    title: "A physicist and theologian draws a map"
    image:
      src: img/barbour.webp
      alt: "Still image of Ian Barbour speaking, taken from an interview"
      caption: Ian Barbour (1923-2013) held a physics PhD (Chicago, 1950) and a divinity degree (Yale, 1956); his Gifford Lectures (Aberdeen, 1989-1991) became *Religion in an Age of Science* (1990).
      credit: "Closer To Truth, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Ian_Barbour_Web_Still.jpg"
    body: |
      Why a map? Because "science versus religion" is only one of several things people mean. **According to Ian Barbour**, the relations between science and religion fall into four types: **Conflict, Independence, Dialogue, Integration**. He used them in *Religion in an Age of Science* (1990), in *Religion and Science* (1997, a revised and expanded version) and in *When Science Meets Religion* (2000).

      Three notes, in the course's three layers:

      - **Established fact:** the four types exist as a typology and Barbour proposed it.
      - **Live debate:** whether the typology is a good tool. Critics (for example Cantor and Kenny, *Zygon*, 2001) find it of limited use for historians of past episodes; John Haught uses a similar fourfold scheme with other names (Conflict, Contrast, Contact, Confirmation).
      - **Faith or metaphysical commitment:** which type is *right* depends on what one thinks religion claims. The lesson does not pick.

      Write $D_S$ for the set of questions science treats as its own, and $D_R$ for the set of questions a religion treats as its own. The four types differ in what they say about $D_S$ and $D_R$.

  - type: text
    id: conflict
    title: "Type 1: Conflict"
    body: |
      **Conflict:** science and religion give rival answers about the same ground, and one must give way. According to Barbour there are two mirror-image versions:

      - **Scientific materialism:** only science gives real knowledge, so religious claims are false or empty.
      - **Biblical literalism:** the Bible, read as plain literal history, overrides any science that disagrees, such as an old Earth.

      Barbour's observation (in essence): the two sides look like enemies but share a premise, namely that science and the sacred text are *competing sources about the same questions*. In symbols, they both hold that

      $$D_S\cap D_R\neq\varnothing\ \text{ and the answers clash.}$$

      **Best case for it:** some religious claims really are testable (a young Earth, a global flood) and fail the test; and a person who holds a text as literally true must reject the science that contradicts it. **Weak spot:** the shared premise is itself contestable: many believers and scientists reject it.

  - type: mcq
    id: conflict-share
    title: "What do the two sides share?"
    prompt: |
      A biblical literalist says: "If the Earth is old, the Bible is false." A scientific materialist says: "If the Earth is old, the Bible is false, so religion is false." According to Barbour, what premise do the two sides *share*?
    options:
      - text: 'That the Bible and science give rival answers to the same question, so both cannot be right.'
        correct: true
        feedback: |
          Yes. They disagree on which side wins, but both treat the sacred text as competing with science on the same ground. A third position can reject exactly this premise.
      - text: 'That science is better than religion at every question.'
        feedback: |
          The literalist denies this: they put the text above science whenever the two clash. The shared premise is about *rivalry*, not about who wins.
      - text: 'That the Earth is old.'
        feedback: |
          The literalist denies it. What they share is the form of the argument, not the age of the Earth.
    explanation: |
      Once the shared premise is named, the other three types can be read as ways of rejecting or weakening it.

  - type: text
    id: independence
    title: "Type 2: Independence (NOMA)"
    body: |
      **Independence:** science and religion answer different questions, so they cannot truly clash. The best known version is by **Stephen Jay Gould** (1941-2002), Harvard paleontologist and writer. He put it in the essay "Nonoverlapping Magisteria" (*Natural History*, March 1997) and developed it in the book *Rocks of Ages* (1999). It had a context: Pope John Paul II had told the Pontifical Academy of Sciences on 22 October 1996 that "Truth Cannot Contradict Truth", accepting evolution as compatible with Catholic faith.

      A **magisterium** is, in Gould's words, "a domain where one form of teaching holds the appropriate tools for meaningful discourse and resolution". **NOMA** says the two magisteria do **not overlap**:

      - **Science** covers the empirical universe: what it is made of (fact) and why it works as it does (theory).
      - **Religion** covers questions of moral meaning and value.

      $$D_S\cap D_R=\varnothing$$

      The boundary cuts both ways: religion may not dictate the age of the Earth, and science may not dictate what is good. Gould also said the two do not cover *all* inquiry: the meaning of beauty belongs to art.

  - type: build
    id: noma-build
    title: "NOMA in symbols"
    prompt: |
      Let $D_S$ be the set of questions science treats as its own and $D_R$ the set religion treats as its own. Build Gould's claim that the two domains do not overlap.
    prefix: ''
    tiles: ['D_S', '\cap', 'D_R', '=\varnothing', '\cup', '\neq\varnothing']
    answers:
      - ['D_S', '\cap', 'D_R', '=\varnothing']
    wrong:
      - answer: ['D_S', '\cap', 'D_R', '\neq\varnothing']
        feedback: |
          That says the domains *do* overlap (the Conflict picture, or Dialogue at its edge). NOMA says the intersection is empty.
      - answer: ['D_S', '\cup', 'D_R', '=\varnothing']
        feedback: |
          The union is empty only if both sets are empty, meaning neither field has any questions. Non-overlap is about the *intersection* (the shared part), not the union.
    hint: 'No overlap means the part they share contains nothing.'
    explanation: |
      $D_S\cap D_R$ is the set of questions in both domains; NOMA says it is empty. Note that $D_S\cup D_R$ (all the questions covered by either) is not claimed to be everything: Gould left room for other domains, such as art.

  - type: mcq
    id: noma-sort
    title: "Which question is whose?"
    prompt: |
      By Gould's NOMA, which of these questions belongs to the **science** magisterium (the empirical universe: what it is made of, why it works as it does)? Select all that apply.
    multiple: true
    options:
      - text: 'How old is the Earth?'
        correct: true
        feedback: |
          Yes: an empirical question settled by measurement (rock dating).
      - text: 'Did humans and apes share a common ancestor?'
        correct: true
        feedback: |
          Yes: a factual question about the history of life, answered by fossils and genes. Gould said evolution is a matter for science.
      - text: 'Is it right to keep a promise when it costs you?'
        feedback: |
          This is a question of moral value, which Gould assigns to the religion magisterium (and, in practice, to ethics generally). Science can say what people do, not what they ought to do.
      - text: 'What does a life well lived mean?'
        feedback: |
          A question of meaning: Gould's religion magisterium.
    explanation: |
      Notice that the sorting works only if each question has a clear home. The next card is about the questions that seem to have two homes.

  - type: mcq
    id: noma-weak
    title: "The weak spot of NOMA"
    prompt: |
      Many religious traditions say that God created the world, or that a particular person rose from the dead. According to critics such as Richard Dawkins, why does this threaten NOMA?
    options:
      - text: 'These claims are claims about what happened in the world, so religion does overlap with the empirical domain of science.'
        correct: true
        feedback: |
          Yes, in essence Dawkins argues that religions make existence claims, which are in the end claims about the world. Francis Collins likewise holds that the two *partially overlap*, while agreeing that morality cannot be read off nature.
      - text: 'Because moral values are really facts, so science covers them.'
        feedback: |
          That is a different critique (one made by Sam Harris, who argues values depend on the wellbeing of conscious creatures). The creation and resurrection claims are *factual* in form, which is the point here.
      - text: 'Because science cannot say anything about how the universe began.'
        feedback: |
          Science can and does study cosmic history. The objection is that religion makes claims about the world, not that science is silent about it.
    explanation: |
      A reply open to Gould: religion's real subject is the *meaning* of such events, while the facts belong to science. Critics answer that believers often say the events happened. Stephen J. Pope even suggested the title should be "Partially Overlapping Magisteria". This is a **live debate**; the lesson on miracles returns to it.

  - type: mcq
    id: noma-cover
    title: "Does NOMA cover everything?"
    prompt: |
      Gould said the two magisteria do not overlap. Did he also claim that science plus religion together cover *all* inquiry?
    options:
      - text: 'No: he said the two do not encompass all inquiry, giving art and the meaning of beauty as a further domain.'
        correct: true
        feedback: |
          Yes. Non-overlap ($D_S\cap D_R=\varnothing$) is a different claim from exhaustion ($D_S\cup D_R=$ everything). NOMA asserts the first only.
      - text: 'Yes: everything is either a fact or a moral value.'
        feedback: |
          Gould explicitly left room for other domains.
      - text: 'Yes: since they do not overlap, nothing is left over.'
        feedback: |
          Non-overlap says the two sets share nothing, not that they fill the whole space.
    explanation: |
      Keeping *non-overlap* and *exhaustion* apart is a small logic point that avoids a common misreading.

  - type: text
    id: dialogue
    title: "Type 3: Dialogue"
    body: |
      **Dialogue:** the domains are mostly separate, but they meet at an edge, and each can learn from the other there. According to Barbour, the meeting points are two:

      - **Boundary questions:** questions science raises but cannot itself answer, for example *why there are laws of nature at all* or why the universe is intelligible. (Recall from the lessons on the beginning: science describes how the universe evolves; "why anything" is outside its method.)
      - **Methodological parallels:** both fields use models and analogies and aim at explanation, so the ways they reason can be compared.

      **Best case:** it respects each field's method and still lets them talk; it fits the many scientists who find a boundary question open. **Weak spot:** it can stay vague about what the conversation *yields*, and critics (Haught, for one) find the line between dialogue and integration hard to draw.

  - type: mcq
    id: dialogue-sort
    title: "Independence or dialogue?"
    prompt: |
      A cosmologist says: "Science explains how the universe evolves; why there are laws to evolve under is a question I cannot answer with my methods, and I am glad that theologians and philosophers discuss it." Which of Barbour's types fits this position best?
    options:
      - text: 'Dialogue: a boundary question is raised by science and handed over for conversation.'
        correct: true
        feedback: |
          Yes. The questions are not shared in method, but the boundary is a meeting point.
      - text: 'Independence: the two never speak to each other.'
        feedback: |
          Independence would say the question "why are there laws" is none of science's business and no conversation is needed. Here science opens the question and invites the talk.
      - text: 'Conflict: the cosmologist is rejecting the theologian.'
        feedback: |
          Nothing is rejected: the cosmologist welcomes the discussion.
    explanation: |
      A way to remember: Independence draws a wall; Dialogue puts a door in it.

  - type: text
    id: integration
    title: "Type 4: Integration"
    body: |
      **Integration:** go beyond conversation and join the two into one picture. Barbour counts three routes:

      - **Natural theology:** argue from features of nature, such as its order or its fine-tuning, to God (the arguments of the earlier levels).
      - **Theology of nature:** keep doctrine from tradition, but revise parts of it in the light of science (for instance, rethink creation as an unfolding evolution).
      - **Systematic synthesis:** build one metaphysics containing both; Barbour points to process thought, based on Whitehead, in which God and the world are both in process (recall the lesson on process theology).

      Barbour's own sympathies lean toward dialogue and integration, and he found independence unsatisfactory because a religion aims at an all-encompassing interpretation of experience.

      **Best case:** it fits religions that make claims about the world, and it treats one reality as one. **Weak spot:** critics say integration is not as easily achieved as he suggests, and a theology tied to a current scientific theory can age with the theory.

  - type: mcq
    id: integration-sort
    title: "Which route?"
    prompt: |
      A theologian writes: "Evolution shows creation is an ongoing process, not a single act; I therefore revise the doctrine of creation to fit, while keeping the tradition's idea that God is behind the world." Which of Barbour's integration routes is this?
    options:
      - text: 'A theology of nature: tradition kept, doctrine revised in the light of science.'
        correct: true
        feedback: |
          Yes. It starts from doctrine and reshapes part of it for the science.
      - text: 'Natural theology: God is inferred from nature alone, with no doctrine assumed.'
        feedback: |
          Here the doctrine is the starting point. Natural theology goes the other way, from nature to God.
      - text: 'Independence: doctrine is untouched by science.'
        feedback: |
          The doctrine is revised, so the two are not independent.
    explanation: |
      The three routes differ in where the argument starts: nature (natural theology), doctrine (theology of nature), or a system holding both (synthesis).

  - type: mcq
    id: resolve
    title: "Back to the two people"
    prompt: |
      Two people accept the same science (an old Earth, evolution by natural selection). One says: "So there is no need for God." The other says: "So this is how God's creation unfolds." Using Barbour's types, what best describes the difference between them?
    options:
      - text: 'They hold different relations: the first reads science as competing with God as an explanation (a Conflict-type view), the second joins the science to a doctrine of creation (an Integration-type view).'
        correct: true
        feedback: |
          Yes. The facts are shared, so the split is a **layer-3** one: what science can show about God, and whether religion makes claims about the world.
      - text: 'One of them has the science wrong.'
        feedback: |
          Both accept the same science; the difference is in the premises added afterwards.
      - text: 'They are both Independence: neither mentions facts about God.'
        feedback: |
          Independence would say science says nothing at all for or against God. The first speaker says it does (no need for God), the second says it fits a doctrine.
    explanation: |
      A third person, in the spirit of Gould, would say: "Both are overstepping. Science is silent on whether God exists; it tells you how the world works." That is Independence. Three people, one body of facts, three maps. The next lessons test the maps on real episodes.

  - type: mcq
    id: typology-worry
    title: "Is the map itself neutral?"
    prompt: |
      Barbour lists the four types in the order Conflict, Independence, Dialogue, Integration, and some critics (Cantor and Kenny, 2001) object that the order suggests a story of progress toward the last type. What is a fair version of the worry?
    options:
      - text: 'A tidy list can make historical episodes look cleaner than they were, and its order can quietly favour one conclusion.'
        correct: true
        feedback: |
          Yes. The typology is a sorting tool; using it as a verdict on which type is true, or as a history of progress, goes beyond it. A good habit: sort the case first, evaluate second.
      - text: 'The four types are logically inconsistent with each other.'
        feedback: |
          They are not inconsistent; they are different answers to one question. The worry is about use, not consistency.
      - text: 'Barbour made up the types with no relation to anyone''s real positions.'
        feedback: |
          They were drawn from positions actually held (materialists, literalists, neo-orthodox theologians, process thinkers). The critique is about how the map is used.
    explanation: |
      Where thoughtful people part ways: on whether religion makes claims about the world (which decides whether $D_S$ and $D_R$ overlap), and on whether any such typology helps more than it distorts.

  - type: text
    id: summary
    body: |
      **Next:** the map meets a real case. In the lesson on the Galileo affair, we ask which type each side of the 1633 trial assumed, and what actually happened.
