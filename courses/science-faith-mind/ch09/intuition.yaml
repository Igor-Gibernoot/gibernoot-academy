id: ch09-intuition
title: Quick Recall
kind: intuition

cards:
  - type: text
    id: welcome
    title: "Quick recall: science and religion"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: Bellarmine's condition in the Galileo affair, the four models (Barbour) and NOMA (Gould), the odds rule behind natural selection, Hume's weighing of testimony in odds form, Kepler's third law, epistemic against ontological openness, and what a survey margin does and does not cover.

      Three kinds of card: **mnemonics** (the shape of a definition), **build cards and checks** (assemble a formula, test a limit or a scaling) and, at the end, **numeric cards that give you data only**: you choose the rule yourself.

      As always, every answer is *according to* someone or some view. Nothing here asks you to decide whether God exists.

  - type: mcq
    id: bellarmine
    title: "Bellarmine in one line"
    prompt: |
      According to Cardinal Robert Bellarmine's letter of 12 April 1615 (in essence), what was the Church's condition on Copernicus's Sun-centred system, before Scripture would be reread?
    options:
      - text: 'As a mathematical hypothesis it is allowed; as physical truth it needs a real demonstration, and only then must Scripture be reinterpreted.'
        correct: true
      - text: 'It is forbidden even as a mathematical hypothesis, because the Earth is plainly at rest.'
        feedback: |
          Bellarmine allowed the hypothesis "that saves the appearances". The 1616 decree on Copernicus's book was stricter, but the letter drew the line between hypothesis and assertion of physical truth.
      - text: 'Scripture always wins over observation, so no demonstration could ever change the reading.'
        feedback: |
          He said that if a true demonstration existed, the passages would have to be reread with great care; his claim was that none had been shown to him. Galileo's tides argument, which was wrong, and the missing stellar parallax made that position less unreasonable than the myth suggests.
      - text: 'Galileo was to be tortured until he accepted it.'
        feedback: |
          Galileo was interrogated under threat of torture in 1633; no source checked reports that torture was applied, and the letter is from 1615 and is about method, not punishment.
    explanation: |
      Mnemonic: **hypothesis yes, truth needs demonstration, then reread Scripture**. In the typology of Barbour this lets the question stay open between Independence and Conflict.

  - type: mcq
    id: noma
    title: "NOMA: two different claims"
    prompt: |
      Write $D_S$ for the set of questions science treats as its own and $D_R$ for the set religion treats as its own. According to Stephen Jay Gould's *non-overlapping magisteria* (a magisterium is a domain of teaching authority), which pair of statements is right?
    options:
      - text: '$D_S\cap D_R=\varnothing$ (non-overlap), but $D_S\cup D_R$ need not be all inquiry (art is a further domain).'
        correct: true
      - text: '$D_S\cap D_R=\varnothing$ and $D_S\cup D_R$ is all inquiry, so nothing lies outside science and religion.'
        feedback: |
          Non-overlap is not exhaustion. Gould allowed other domains, art and beauty among them, so the union is not claimed to be everything.
      - text: '$D_S\cap D_R\neq\varnothing$: the domains overlap, which is why they conflict.'
        feedback: |
          That is the Conflict picture, and also what the critics of NOMA say. NOMA itself claims the intersection is empty.
      - text: '$D_S\cup D_R=\varnothing$: neither has any questions of its own.'
        feedback: |
          An empty union means both sets are empty. Non-overlap concerns the intersection, the shared part.
    explanation: |
      Mnemonic: **non-overlap is not exhaustion**. Critics (Dawkins, Collins, and others) reply that religions make claims about the world, a creation or a resurrection, so the intersection is not empty.

  - type: mcq
    id: barbour
    title: "Barbour's four types"
    prompt: |
      Match the type to its core idea, according to Ian Barbour.
    options:
      - text: 'Conflict: rival claims about the same ground. Independence: separate domains, separate methods. Dialogue: boundary questions and parallels of method. Integration: one joined picture (natural theology, theology of nature, systematic synthesis).'
        correct: true
      - text: 'Conflict: separate domains. Independence: rival claims about the same ground. Dialogue: one joined picture. Integration: boundary questions.'
        feedback: |
          Scrambled. Conflict is the only type that assumes both fields speak about the same ground with incompatible answers; Integration is the strongest form of joining.
      - text: 'Conflict: science and religion agree. Independence: one absorbs the other. Dialogue: both are silent. Integration: they never meet.'
        feedback: |
          None of these is a Barbour type. Each of his four names describes a relation between the two, from rivalry to unity.
      - text: 'Conflict and Integration both say the domains overlap; Independence says they do not; Dialogue says they meet only at an edge.'
        feedback: |
          The overlap part is partly right (Conflict and Integration both put the two fields on shared ground), but the answer does not say what each type claims. Conflict says the clash is real; Integration says the pieces fit.
    explanation: |
      Mnemonic, in order of closeness: **rivals, strangers, neighbours, partners**. The typology is a scholarly tool for sorting positions, not a finding about facts, and critics (Cantor and Kenny, 2001) doubt that it sorts well.

  - type: build
    id: selection-build
    title: "The odds rule of selection"
    prompt: |
      A heritable trait comes in two variants, A and B. Let $p$ be the fraction of the population carrying A, and $w$ the number of offspring an A-individual leaves for every one left by a B-individual (a simple model with fixed $w$). Build the rule for the odds of A after one generation, where $p'$ is the new fraction.
    prefix: "\\dfrac{p'}{1-p'}="
    tiles: ['w', '\dfrac{p}{1-p}', '\dfrac{1-p}{p}', '\dfrac{1}{w}', 'w\,p']
    answers:
      - ['w', '\dfrac{p}{1-p}']
      - ['\dfrac{p}{1-p}', 'w']
    wrong:
      - answer: ['w\,p']
        feedback: |
          $w\,p$ is only the number of A-offspring before dividing by the total. The odds compare A with B, so $p/(1-p)$ is the thing that gets multiplied.
      - answer: ['\dfrac{1}{w}', '\dfrac{p}{1-p}']
        feedback: |
          Dividing by $w$ would make A rarer. A has the edge, so the odds of A are multiplied by $w$.
    hint: 'Each generation multiplies the odds of A by one fixed factor.'
    explanation: |
      Mnemonic: **odds times $w$, every generation**, so after $n$ generations $\dfrac{p_n}{1-p_n}=w^{\,n}\dfrac{p_0}{1-p_0}$. It has the same shape as Bayes' rule in odds form.

  - type: mcq
    id: w-limit
    title: "Limit check: no edge"
    prompt: |
      In the same model, odds of A after one generation are $w$ times the odds before. What happens when $w=1$ (A and B leave equally many offspring), and why is that sensible?
    options:
      - text: 'The odds do not change, so the fraction $p$ stays put: with no edge there is nothing for selection to act on.'
        correct: true
      - text: 'A slowly takes over anyway, because it started first.'
        feedback: |
          Order of appearance gives no reproductive advantage here. With $w=1$ each generation multiplies the odds by 1.
      - text: 'A disappears, because $w=1$ is less than the $w>1$ that the model needs.'
        feedback: |
          $w<1$ would make A decline. At exactly $w=1$ the factor is 1: nothing grows and nothing shrinks.
      - text: 'The odds become zero.'
        feedback: |
          Multiplying by 1 leaves the odds as they were, not zero.
    explanation: |
      Limit check: **$w=1$ gives factor 1, no change**; $w>1$ raises the odds without limit while $w<1$ lowers them. In the real world the edge $w$ is not fixed, which the model ignores.

  - type: build
    id: hume-build
    title: "Hume's weighing in odds form"
    prompt: |
      Let $M$ be "the miracle happened", $E$ "a witness reports it", $P(M)$ the prior probability of $M$, and $q=P(E\mid\neg M)$ the chance that a witness reports $M$ when it did not happen. For $n$ independent, truthful witnesses (they certainly report $M$ if it happened) and a small prior, build the posterior odds of $M$, in the approximation prior odds $\approx P(M)$.
    prefix: "\\text{posterior odds}\\approx"
    tiles: ['\dfrac{1}{q^{\,n}}', 'P(M)', '\dfrac{q^{\,n}}{P(M)}', '\dfrac{P(M)}{q}', '\times']
    answers:
      - ['\dfrac{1}{q^{\,n}}', '\times', 'P(M)']
      - ['P(M)', '\times', '\dfrac{1}{q^{\,n}}']
    wrong:
      - answer: ['\dfrac{q^{\,n}}{P(M)}']
        feedback: |
          That compares the two chances the wrong way up: it would be large when a false report is likely, which is the opposite of evidence for $M$.
      - answer: ['\dfrac{P(M)}{q}']
        feedback: |
          This is right only for one witness. With $n$ independent witnesses the likelihood ratios multiply, and the factor becomes $1/q^{\,n}$.
    hint: 'Posterior odds are likelihood ratio times prior odds; independent witnesses multiply.'
    explanation: |
      Mnemonic: **posterior odds = $\dfrac{1}{q^{\,n}}\times$ prior odds**. It is Hume's maxim in numbers: the odds exceed 1 when the combined chance of a false report is smaller than the prior.

  - type: build
    id: witness-condition
    title: "The witness condition"
    prompt: |
      Same setting: $n$ independent witnesses with false-report chance $q$ each, truthful witnesses, a small prior $P(M)$. Build the condition under which the report makes $M$ more likely than not.
    prefix: ''
    tiles: ['q^{\,n}', '<', '>', 'P(M)', 'q', 'n\,q']
    answers:
      - ['q^{\,n}', '<', 'P(M)']
    wrong:
      - answer: ['q^{\,n}', '>', 'P(M)']
        feedback: |
          Turned round. If a false report from every witness is *more* likely than the event, the odds stay below 1.
      - answer: ['q', '<', 'P(M)']
        feedback: |
          That is the single-witness condition. With $n$ independent witnesses it is the combined false-report chance $q^{\,n}$ that counts.
      - answer: ['n\,q', '<', 'P(M)']
        feedback: |
          Adding the chances treats the witnesses as alternatives. All $n$ must err together, which for independent witnesses is the product $q^{\,n}$.
    hint: 'A false report from all of them must be less likely than the event.'
    explanation: |
      Mnemonic: **the falsehood of the testimony must be less likely than the event**. Solving for $n$ gives $n\ge \ln(1/P(M))/\ln(1/q)$: witnesses grow with the logarithm of the improbability.

  - type: mcq
    id: effective-n
    title: "Scaling check: counting witnesses"
    prompt: |
      Ten people report the same event. Nine of them heard it from the tenth and repeated it; the tenth saw it alone. Taking the likelihood ratio $1/q^{\,n}$ for independent witnesses, which $n$ is right?
    options:
      - text: '$n=1$: only independent sources count, and the nine repeaters add no independent evidence.'
        correct: true
      - text: '$n=10$: every person who reports counts once.'
        feedback: |
          The product rule needs independence. Repeaters copy a single source, so the nine add nothing new.
      - text: '$n=9$: the repeaters are the main evidence.'
        feedback: |
          They are echoes of the tenth person. If the tenth was mistaken, all nine are.
      - text: '$n=0$: reports from friends never count.'
        feedback: |
          The tenth person is a genuine, independent source. Dependence reduces the count; it does not remove it.
    explanation: |
      Check: **effective $n$ = number of independent sources**, not the number of people. For real witnesses, how independent they are is the hard empirical question (Ahmed, 2015, argues that non-collusive witnesses are plausibly not independent either).

  - type: mcq
    id: kepler-scaling
    title: "Scaling check: Kepler's third law"
    prompt: |
      For planets orbiting the Sun, with orbital period $T$ and semi-major axis $a$ (half the longest width of the ellipse), Kepler's third law reads $T^2=k\,a^3$ with the same constant $k$ for every planet. A planet is on an orbit with twice the semi-major axis of another. By what factor is its period larger?
    options:
      - text: '$2^{3/2}\approx2.83$.'
        correct: true
      - text: '$2$.'
        feedback: |
          That would hold if $T$ were proportional to $a$. Here $T^2$ is proportional to $a^3$, so $T$ grows like $a^{3/2}$.
      - text: '$8$.'
        feedback: |
          Eight is $2^3$, the factor for $T^2$. The period itself is its square root.
      - text: '$4$.'
        feedback: |
          Four is $2^2$, which would come from $T\propto a^2$. The law has $a^3$ on the right, so $T^2$ gets the factor 8 and $T$ gets $\sqrt8$.
    explanation: |
      Scaling: **$a\to 2a$ gives $T^2\to8T^2$, so $T\to 2.83\,T$**. Check with Earth and Jupiter: $a=5.2$ AU gives $T=5.2^{3/2}\approx11.86$ years. The law is a pattern found in the data (Kepler, 1619); whether it is "a thought of God" or "a regularity in the best summary" is the philosophical question of the lesson on laws.

  - type: mcq
    id: epistemic-ontological
    title: "Epistemic or ontological openness"
    prompt: |
      A chaotic system (such as the logistic map $x_{n+1}=r\,x_n(1-x_n)$) is unpredictable in practice because tiny gaps in the starting value grow quickly. According to critics such as Thomas Tracy, what does this show about divine action?
    options:
      - text: 'It shows only a limit of our knowledge (epistemic openness), since the equations are deterministic; an open place for God to act would need the further claim that the laws themselves leave outcomes open (ontological openness), which Polkinghorne adds.'
        correct: true
      - text: 'It shows that the laws are broken in chaotic systems, so God can act there.'
        feedback: |
          The equations hold exactly. Unpredictability here comes from sensitivity to the starting value, not from any violation.
      - text: 'It shows that chaotic systems are random, so determinism is false.'
        feedback: |
          A deterministic rule can give outcomes we cannot predict in practice. Randomness in the physical sense (ontological openness) is a different claim.
      - text: 'It shows that epistemic and ontological openness are the same thing.'
        feedback: |
          They differ: "we cannot know" against "there is nothing yet fixed". The step from the first to the second is a metaphysical premise, which is where people part ways.
    explanation: |
      Mnemonic: **epistemic = what we can know; ontological = what is there to be known**. In the example run, a start gap of $10^{-6}$ is visible after 22 steps and $10^{-12}$ after 44: a factor of a million in precision buys only twice the steps.

  - type: numeric
    id: selection-numeric
    title: "Two generations of an edge"
    prompt: |
      A variant A of a heritable trait is carried by a fraction $0.2$ of a population. In every generation, each individual with A leaves $1.5$ offspring for every one left by an individual without A. Offspring copy their parent, and there is no mating. What fraction carries A after two generations?
    answer: 0.36
    tolerance: 0.005
    answerText: '0.36'
    wrong:
      - value: 0.3
        feedback: |
          That multiplies $0.2$ by $1.5$ and stops. The whole population must still sum to one, so the A share cannot be scaled directly, and there are two generations.
      - value: 0.2727
        feedback: |
          That is the fraction after one generation. The edge acts again in the second.
      - value: 0.45
        feedback: |
          That multiplies the fraction by $1.5$ twice ($0.2\times1.5^2$), which ignores that the fraction is a share of a total. Work with a quantity that compares A with the rest.
    hint: 'Think of the ratio of A to the others, not of the share itself, and how an edge compounds. Convert back to a share at the end.'
    explanation: |
      The ratio of A to the others starts at $0.2/0.8=0.25$ and is multiplied by $1.5$ each generation: $0.375$, then $0.5625$. A ratio $0.5625$ means a share $0.5625/1.5625=0.36$.

  - type: numeric
    id: witness-numeric
    title: "Three reports, two sources"
    prompt: |
      A rare event has prior probability $10^{-4}$. Three people report it. Two of them are friends who discussed it beforehand and give one shared story; the third saw it independently. A person who was not at an event (or did not witness it) gives a false report with probability $10^{-2}$ per independent source, and a true event is always reported. What is the probability, in percent, that the event happened?
    answer: 50
    tolerance: 0.3
    answerText: '50 (about 50)'
    wrong:
      - value: 99.99
        feedback: |
          That counts three independent sources: three factors of a hundred would multiply the odds by a million. The two friends share one story, so they count as one source.
      - value: 1
        feedback: |
          That counts a single source. There are two independent ones: the friends' shared story and the third person.
    hint: 'How many independent sources are there? Each one multiplies the odds of the event by the same factor, which is how much more likely a true event is to be reported than a false one.'
    explanation: |
      Two independent sources, each a factor $1/10^{-2}=100$ in favour: $100^2=10^4$. The prior odds are about $10^{-4}$, so the posterior odds are about $1$, which is a probability of $50\%$. Counting all three as independent would have given a near certainty, and counting one source would have given about $1\%$.

  - type: numeric
    id: margin-numeric
    title: "A small survey"
    prompt: |
      A random sample of $400$ scientists is asked whether they believe in God, and half of them say yes. Assuming all answered, how large is the 95% margin of error due to sampling, in percentage points (to one decimal)? For a random sample, the 95% margin shrinks as one over the square root of the sample size and is largest when the answers split evenly.
    answer: 4.9
    tolerance: 0.15
    answerText: '4.9'
    wrong:
      - value: 2.45
        feedback: |
          That is the margin for a sample four times larger, $1600$ people. A sample of $400$ gives about twice that.
      - value: 49
        feedback: |
          That is the share multiplied by 100, not a margin. Uncertainty from sampling is a few points for a few hundred people.
    hint: 'The margin involves $\sqrt{p(1-p)/n}$ times the usual 95% multiplier of about two. Compare it with the earlier example of $1000$ people and a share near $0.4$, which gave about three points.'
    explanation: |
      $1.96\sqrt{0.5\times0.5/400}=1.96\times0.025=0.049$, so about $4.9$ points. Scaling: the margin goes like $1/\sqrt{n}$, so $1600$ people would give $2.45$ points. The margin covers only sampling chance, not who was sampled, who answered or what the question meant.

  - type: numeric
    id: gap-numeric
    title: "A gap between two groups"
    prompt: |
      A 1996 random survey of 1000 US scientists (Larson and Witham) found 39.3% believing in a personal God. Their 1998 survey of members of the National Academy of Sciences found 7.0%. By how many percentage points is the second lower than the first?
    answer: 32.3
    tolerance: 0.05
    answerText: '32.3'
    wrong:
      - value: 5.6
        feedback: |
          That is the ratio $39.3/7.0$. A gap in percentage points is a difference, not a quotient.
      - value: 46.3
        feedback: |
          That adds the two shares. A gap compares them, so subtract.
    hint: 'Both are shares of a group. A gap in percentage points is simply one share minus the other.'
    explanation: |
      $39.3-7.0=32.3$ points. The two groups differ (a random list of scientists against an elite academy), so the gap says something about the groups, not that one survey is wrong; and neither number says whether belief is true.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      The level's main rules, in the form to recall them.

      **Bellarmine (1615).** A hypothesis is allowed; physical truth needs a real demonstration, and only then is Scripture reread:

      $$\text{demonstration}\Rightarrow\text{reread Scripture}$$

      **NOMA and the four types.** Write $D_S$ for the set of questions science treats as its own and $D_R$ for the set religion treats as its own. According to Gould:

      $$D_S\cap D_R=\varnothing,\qquad D_S\cup D_R\neq\text{all inquiry}$$

      According to Barbour the relations are Conflict, Independence, Dialogue and Integration: rivals, strangers, neighbours, partners.

      **Selection.** For two variants A and B of a heritable trait, with $p$ the fraction carrying A and $w$ the offspring of an A-individual per offspring of a B-individual (fixed $w$), the odds of A are multiplied by $w$ each generation:

      $$\frac{p'}{1-p'}=w\,\frac{p}{1-p},\qquad \frac{p_n}{1-p_n}=w^{\,n}\,\frac{p_0}{1-p_0}$$

      **Hume's weighing.** Let $M$ be "the miracle happened", $E$ "a witness reports it", $q=P(E\mid\neg M)$ the false-report chance. For $n$ independent, truthful witnesses and a small prior, posterior odds are about $P(M)/q^{\,n}$, so the report makes $M$ more likely than not when

      $$q^{\,n}<P(M),\qquad n\ \ge\ \frac{\ln\,(1/P(M))}{\ln\,(1/q)}$$

      Only independent sources count in $n$.

      **Kepler's third law.** For planets orbiting the Sun, period $T$ and semi-major axis $a$:

      $$T^2=k\,a^3$$

      with the same $k$ for every planet ($k=1$ for years and astronomical units).

      **Openness and surveys.** A chaotic system is unpredictable because of limited knowledge (epistemic openness); that the laws themselves leave outcomes open is a further claim (ontological openness). A survey share $p$ from a random sample of size $n$ has a 95% margin of about $1.96\sqrt{p(1-p)/n}$, which covers sampling chance but not bias.

      **Next:** the content map of this level, where you rebuild the chapter's concept map box by box among look-alike decoys.
