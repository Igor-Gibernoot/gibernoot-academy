id: ch09-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: science and religion"
    body: |
      Fast round. Each question hides a **tempting shortcut** about the stories and arguments of this level: Galileo, the Oxford debate, the four types of Ian Barbour and Stephen Jay Gould's NOMA, evolution, Hume on miracles, divine action, what surveys of scientists show, and where modern science came from. Every shortcut is a *useful idea turned too far*, or a famous story told more neatly than the record allows.

      Nothing here asks whether God exists. Answers are given *according to* someone, and where thoughtful people differ the feedback shows both sides. Notation as in the lessons: $P(M)$ is the prior probability of an event $M$, $q$ the chance that a witness reports an event that did not happen, $w$ the offspring ratio of one variant to another.

  - type: mcq
    id: galileo-torture
    title: "Tortured and burned?"
    prompt: |
      A student says: "Galileo was tortured by the Inquisition until he renounced the Earth's motion, and then burned." According to the historical record, what is the best correction?
    options:
      - text: 'He was tried in 1633, found "vehemently suspect of heresy", made to renounce the view, and kept under house arrest until he died in 1642. He was interrogated under the *threat* of torture, and no source we checked reports that it was applied. He was not burned.'
        correct: true
        feedback: |
          Yes. The popular picture merges this with the fate of others in other cases. The documented story is serious enough without the myth.
      - text: 'Nothing to correct: the Church treated everyone who defended Copernicus this way.'
        feedback: |
          Copernicus's book was only suspended until corrected (1616), and Copernican astronomy was widely used. The 1633 trial was about Galileo, the Dialogue and his earlier warning, not a general policy of torture and burning.
      - text: 'He was acquitted, because the Church never objected to a moving Earth.'
        feedback: |
          This is the rosy opposite of the myth. The Church had acted against the view in 1616 and the 1633 court convicted him.
    explanation: |
      Two opposite simplifications exist: "tortured and burned" and "there was no problem". The record sits between them, which is why it is worth knowing in detail.

  - type: mcq
    id: galileo-proof
    title: "He had the proof, they refused to look?"
    prompt: |
      A student says: "Galileo had a proof that the Earth moves, and Cardinal Bellarmine simply refused to look." According to the lesson on Galileo, which reply fits the record?
    options:
      - text: 'Bellarmine (1615) allowed Copernicus as a calculating hypothesis and asked for a demonstration of physical truth. Galileo''s own best argument, the tides, had a flaw (it predicts one tide a day), and the missing stellar parallax was a real objection that was only answered in the 19th century.'
        correct: true
        feedback: |
          Yes. The dispute was partly about the standard of proof. Whether Bellarmine asked too much is a fair debate; that he named a condition is documented.
      - text: 'Bellarmine refused any reading of Scripture other than the literal one, whatever the evidence.'
        feedback: |
          His letter says that if a true demonstration existed, the apparently contrary passages would have to be reread with great care. It is not a flat "never".
      - text: 'Galileo''s tides argument was correct, and the Church knew it was correct.'
        feedback: |
          The tides argument gives one high tide a day, but the sea shows two, so it did not settle the question.
    explanation: |
      Seeing the affair as "evidence against authority" is tidy and partly wrong. Bessel measured the first parallax in 1838, long after the trial. Historians still differ on how much was science, how much politics and how much Galileo's quarrel with Pope Urban VIII.

  - type: mcq
    id: oxford
    title: "Oxford 1860: religion crushed?"
    prompt: |
      A student says: "At Oxford in 1860 Thomas Huxley demolished Bishop Wilberforce with the line that he would rather have an ape for an ancestor, and that ended the argument." Which statement matches the record?
    options:
      - text: 'No verbatim record exists, eyewitness versions differ, Huxley''s own letter written soon after does not mention the remark, both sides claimed victory, and Wilberforce''s objections were largely scientific. The "clean defeat" is a later retelling.'
        correct: true
        feedback: |
          Yes. The scene became a parable, and parables are tidier than minutes of a meeting.
      - text: 'The debate is fully documented word for word, and Huxley clearly won.'
        feedback: |
          No transcript survives, so the exact words come from later accounts that differ. "Huxley won" is a later judgment of a muddled afternoon.
      - text: 'Wilberforce attacked only with Bible quotations and no scientific argument.'
        feedback: |
          His review of the *Origin* in the *Quarterly Review* raised mainly scientific objections, and he noted that leading scientists opposed the theory.
    explanation: |
      Check any famous story by asking what the primary record says. Here the record is thin, and the neat science-against-religion picture comes largely from the retelling.

  - type: mcq
    id: noma-never
    title: "NOMA: they never touch?"
    prompt: |
      A student says: "Gould's NOMA (non-overlapping magisteria) says that science and religion have nothing to do with each other, and that together they cover all of human inquiry." Which reply is accurate?
    options:
      - text: 'Gould (1997) said each is a magisterium, a domain where one form of teaching holds the right tools: science for how nature is, religion for ethics and meaning. They do not overlap, but he said they do not exhaust inquiry either: art and the meaning of beauty lie beyond both. Critics ask whether religions make claims about the world, which would make an overlap.'
        correct: true
        feedback: |
          Yes. Non-overlap ($D_S\cap D_R=\varnothing$) is one claim and exhaustion ($D_S\cup D_R=$ everything) is another. NOMA asserts only the first, and its weak spot is whether religion makes factual claims.
      - text: 'NOMA says science and religion must agree, since truth cannot contradict truth.'
        feedback: |
          That is the language of dialogue and integration (and of a Pope''s address in 1996). NOMA gets its peace from separation, not from agreement.
      - text: 'NOMA says religion is false because it falls outside science.'
        feedback: |
          Gould did not say this. Being outside science's domain is not the same as being false; it only means science does not judge it.
    explanation: |
      The slogan is shorter than the claim. Whether the two domains really do not overlap is exactly what the other types of Barbour's map dispute.

  - type: mcq
    id: barbour-camps
    title: "Barbour: four rival camps?"
    prompt: |
      A student says: "Barbour's four types (conflict, independence, dialogue, integration) are four rival teams, and each thinker belongs to one team for life." What is the fairer reading of the typology?
    options:
      - text: 'They are four answers to one question, how science and religion relate, and a thinker can fit different types on different topics. Critics warn that the list can also make history look neater than it was, and its order can seem to favour the last type.'
        correct: true
        feedback: |
          Yes. A good habit: sort the case first, evaluate second. The map is a sorting tool, not a verdict.
      - text: 'They are four stages of history, and every culture moves from conflict to integration.'
        feedback: |
          This reads the order as a story of progress, which is the very worry critics raise. The types are not claimed to be historical stages.
      - text: 'Barbour invented the types without reference to any real position.'
        feedback: |
          They were drawn from positions actually held: scientific materialists and biblical literalists (conflict), neo-orthodox theologians (independence), process thinkers (integration).
    explanation: |
      Conflict, in Barbour's account, is shared by two opposite camps that both assume science and religion compete over the same ground. Seeing that shared assumption is part of what the map teaches.

  - type: mcq
    id: random
    title: "Evolution is just chance?"
    prompt: |
      A student says: "Evolution is just random mutations, so it can't build anything complex." Which reply is correct?
    options:
      - text: 'Mutation is random with respect to usefulness, but selection is not random: variants with an edge leave more offspring, and the effect compounds. In the simple model the odds of variant A against B are multiplied by $w$ every generation.'
        correct: true
        feedback: |
          Yes. The randomness is in what arises, the non-randomness in what survives and spreads. Whether that is the whole story of life is a further question people also argue about, but the "just chance" picture is not the theory.
      - text: 'Evolution is not random at all, because mutations are always useful.'
        feedback: |
          Most mutations are neutral or harmful. The theory needs variation that is random with respect to usefulness, and then a sorting process.
      - text: 'The theory says everything is decided by chance, and selection only describes the outcome.'
        feedback: |
          Selection is a cause in the model: it changes who leaves offspring, and so the next generation.
    explanation: |
      A coin tossed once is random, a coin tossed and then filtered by a rule is not. The accumulation of small edges is the point of the next question.

  - type: numeric
    id: compound
    title: "A 10% edge, seven generations"
    prompt: |
      Variant A and variant B start with equal fractions, $p=0.5$ each. In every generation A-individuals leave $w=1.1$ offspring for every one left by a B-individual (a 10% edge), and nothing else changes. What fraction of the population carries A after 7 generations, **in percent**?
    answer: 66
    tolerance: 1
    answerText: '66 (about 66.1)'
    wrong:
      - value: 97
        feedback: |
          That multiplies the *fraction* by $1.1^{7}\approx1.95$. A fraction cannot grow without limit. It is the odds $p/(1-p)$ that are multiplied by $1.1$ each generation, and the fraction comes from the odds.
      - value: 99
        feedback: |
          That adds 7% per generation to the fraction, which would reach almost everyone. The edge multiplies the odds, and the fraction rises more slowly.
    hint: 'The odds of A start at $1$ and are multiplied by $1.1$ each generation. Turn the final odds $o$ into a fraction with $o/(1+o)$.'
    explanation: |
      After 7 generations the odds are $1.1^{7}\approx1.949$, so the fraction is $1.949/2.949\approx0.661$, about 66%. A modest edge, compounded, shifts a population noticeably, and over fifty generations it would take a rare variant to nearly everyone. The model assumes a fixed edge, which real populations do not guarantee.

  - type: mcq
    id: theory
    title: "Only a theory?"
    prompt: |
      A student says: "Evolution is only a theory, not a fact." According to the National Academy of Sciences, what is wrong with the use of "theory" here?
    options:
      - text: 'In science a theory is an explanation of natural phenomena built up logically from testable observations and hypotheses, not a guess. Calling an explanation a theory says nothing about how well supported it is.'
        correct: true
        feedback: |
          Yes. In everyday talk "theory" can mean a hunch; in science it is the name for a well-tested explanatory structure. The strength of the evidence has to be judged separately.
      - text: 'A theory becomes a fact once enough evidence accumulates, so evolution is a theory that has been promoted.'
        feedback: |
          Theories do not turn into facts. Facts are observations; theories are explanations of them. They are different kinds of thing, not rungs of one ladder.
      - text: 'Scientific theories are guesses that cannot be tested.'
        feedback: |
          Testability is what makes a scientific theory scientific. The guess-like word is "hypothesis", and even a hypothesis has to be testable.
    explanation: |
      The question "is it well supported?" is answered by evidence, not by the word chosen. Whether evolution has theological implications is a separate argument, taken up in the lesson on Darwin.

  - type: mcq
    id: hume-impossible
    title: "Hume proved miracles impossible?"
    prompt: |
      A student says: "Hume proved that miracles cannot happen." According to the reading of Hume's maxim as odds, which statement is best?
    options:
      - text: 'Hume''s maxim says to believe a report only if its being false would be more surprising than the event. In odds form: posterior odds equal the likelihood ratio (about $1/q$) times the prior odds. A tiny prior needs a tiny $q$, which is hard to meet, but it is not a proof of impossibility.'
        correct: true
        feedback: |
          Yes. It is an argument about how much evidence a report must supply, and whether Hume meant something this mathematical is itself disputed.
      - text: 'Hume proved that no testimony can ever outweigh any prior.'
        feedback: |
          The odds form shows the opposite is possible: enough independent, reliable witnesses can multiply the likelihood ratio past a very small prior.
      - text: 'Hume showed that the prior probability of a miracle is exactly zero.'
        feedback: |
          A prior of zero would make every report useless whatever the evidence. A low prior is not zero, and the sceptic and the believer differ on how low it is and where it comes from.
    explanation: |
      The circularity charge says that using "uniform experience" against miracles already assumes none occurred. Hume's defenders reply that it only asks for proportion between belief and evidence. Both points are live.

  - type: numeric
    id: hume-number
    title: "A witness right 999 times in 1000"
    prompt: |
      A report of an event with prior probability $P(M)=10^{-6}$. The witness reports it truthfully if it happened, and falsely in 1 case out of 1000 where it did not, so $q=10^{-3}$. A student says: "The witness is 99.9% reliable, so the event is 99.9% likely." What is the actual probability, **in percent**, that the event happened?
    answer: 0.1
    tolerance: 0.01
    answerText: '0.1 (about 0.0999)'
    wrong:
      - value: 99.9
        feedback: |
          That is the witness's reliability, not the probability of the event. The prior of one in a million still counts, and the report multiplies the odds only by $1/q=1000$.
      - value: 0.0001
        feedback: |
          That is the prior in percent, with the report ignored. A reliable witness does raise the chance a thousandfold.
    hint: 'Prior odds $10^{-6}$, likelihood ratio $1/q=1000$. Multiply, then turn odds $o$ into a probability $o/(1+o)$.'
    explanation: |
      Posterior odds are $10^{-6}\times1000=10^{-3}$, a probability of about $0.0999\%$. Reliability of the witness and probability of the event are different quantities, which is why a very good witness may still leave a rare event unlikely.

  - type: mcq
    id: witnesses
    title: "A crowd always beats the prior?"
    prompt: |
      A student says: "By Babbage's rule, odds multiply with each witness, so two hundred witnesses beat any low prior." Which reply is right?
    options:
      - text: 'The factor $1/q^{\,n}$ holds for $n$ independent errors. If the witnesses repeated one source, or shared an expectation, they count as few independent sources, and what matters is that effective number.'
        correct: true
        feedback: |
          Yes. Two hundred people retelling the same story told by one person are one chance to be wrong, not two hundred. Ahmed (2015) argues that independence is plausibly violated in the cases that matter.
      - text: 'More witnesses never help at all, since each one adds the same doubt.'
        feedback: |
          Independent, reliable witnesses do help a great deal, multiplying the likelihood ratio. The point is that their independence is the weak spot, not that numbers are useless.
      - text: 'Only the most reliable witness counts, and the others can be ignored.'
        feedback: |
          Independent confirmation adds evidence even when each witness is imperfect. What does not add is a copy of an earlier report.
    explanation: |
      The question to ask of any case is how many independent sources there are. Babbage (1837) showed that independent witnesses can add up to more than any improbability; Hume's defenders reply that real witnesses are rarely independent.

  - type: mcq
    id: chaos
    title: "Chaos or quantum gaps: God acts for free?"
    prompt: |
      A student says: "Chaos theory and quantum theory both leave gaps in the laws, so God can act in the gaps without any cost to the physics." Which reply separates the two ideas of "openness"?
    options:
      - text: 'In classical chaos the rule is fixed and nearby starts diverge, so the gap is in what we can predict (epistemic). Only if the world itself is not fully fixed (ontological, as in some interpretations of quantum theory) is there real room, and then a proposal has costs, such as acting without any observable signature.'
        correct: true
        feedback: |
          Yes. Polkinghorne reads chaos as pointing to an ontological openness, and Tracy replies that chaos presupposes determinism. Both readings of the same facts exist, and neither is a measurement.
      - text: 'Chaos means the system is random, so nothing is determined and room is guaranteed.'
        feedback: |
          Chaos is sensitivity inside a deterministic rule. The widget used a fixed rule with no chance and still gave different outcomes for nearly equal starts.
      - text: 'Quantum gaps exist in every interpretation, so room is settled physics.'
        feedback: |
          Some interpretations (for example the Bohmian one) are deterministic, and collapse theories are not. Whether the chance is fundamental is itself an open question.
    explanation: |
      From a gap in our knowledge nothing follows about a gap in nature. And even if nature leaves room, saying that room is used is a further claim, not a result of physics.

  - type: mcq
    id: survey
    title: "33% against 7%: scientists are less religious than other scientists?"
    prompt: |
      Pew (2009) found that 33% of AAAS scientists believe in God. The National Academy of Sciences survey (1998) found that 7.0% of its members believe in a personal God. A student says: "So the AAAS scientists changed their mind between 1998 and 2009." What is the main flaw?
    options:
      - text: 'The two numbers come from different groups (a general scientific society against an elite academy), different years and different wordings ("God" against "a personal God"). They cannot be compared as one group changing.'
        correct: true
        feedback: |
          Yes. A survey number depends on the wording, the sample, the field and the year. Change any of them and the number moves while every individual keeps the same view.
      - text: 'Pew''s result is wrong, because 33% is above 7%.'
        feedback: |
          Neither survey is wrong. They answer different questions about different groups.
      - text: 'Surveys of scientists measure nothing about belief.'
        feedback: |
          They measure what people answered to a particular question. That is real information, but it has to be read with the wording and sample in view.
    explanation: |
      The same care applies to a gap between scientists and the public: the 83% (public, 2006) and 33% (scientists, 2009) come from different years and kinds of sample.

  - type: mcq
    id: margin
    title: "Margin of error covers everything?"
    prompt: |
      A random sample of 1000 scientists gives 39.3% believing in God, with a margin of about $\pm3$ percentage points at the usual confidence level. A student says: "So the true share among all scientists is between 36.3% and 42.3%, whatever the wording or who answered." What is wrong?
    options:
      - text: 'The margin measures only the chance fluctuation of drawing 1000 names at random. It says nothing about question wording, non-response, a sample that is not random, or whether "scientist" is defined the same way.'
        correct: true
        feedback: |
          Yes. With $1.96\sqrt{0.393\times0.607/1000}\approx0.030$ the arithmetic is right; the limit is what it covers.
      - text: 'The margin should be larger, since 1000 is a small number.'
        feedback: |
          The margin is correctly sized for a random sample of 1000. The problem is that sampling is only one source of error.
      - text: 'The margin means the answer could be anything from 0% to 100%.'
        feedback: |
          A margin of $\pm3$ points is quite narrow for sampling error. It is the other sources of error that it leaves out.
    explanation: |
      A precise number is not the same as a trustworthy number. A survey can have a small margin and still be answering a question different from the one you care about.

  - type: mcq
    id: religious-scientist
    title: "A believer or an atheist scientist settles it?"
    prompt: |
      Two students argue. One says: "A leading geneticist is a committed Christian, so religion must be true." The other says: "Most members of the National Academy of Sciences disbelieve, so atheism must be true." What do these facts show?
    options:
      - text: 'Both show how scientists think, not how things are. The first refutes "no good scientist can be religious" and the second refutes "no good scientist can be an atheist", but neither is a reason for or against God, because rates and examples are not arguments.'
        correct: true
        feedback: |
          Yes. The two traps are mirror images, and the same repair applies to both: ask for the reasons, not the headcount.
      - text: 'The first fact proves religion and the second proves atheism, so the question is settled for whoever has more experts.'
        feedback: |
          Expertise in genetics or physics is expertise about nature. Whether God exists is not settled by their research methods, and the experts themselves disagree.
      - text: 'Neither fact is of any interest.'
        feedback: |
          They are interesting, and they do answer something: the claim that science forces one answer. That claim is refuted by the existence of able scientists on both sides.
    explanation: |
      Surveys can tell you what scientists believe, and interviews can tell you why. Neither says whether the belief is true.

  - type: mcq
    id: origin
    title: "Theology made science, so science is faith?"
    prompt: |
      Suppose Whitehead and Hooykaas are right that the idea of a lawgiver helped modern science begin. A student concludes: "So science rests on faith and can't be trusted." What is the flaw?
    options:
      - text: 'Where an idea came from does not decide whether it is true or reliable. We test a method by its results, whoever started it; and in reverse, if science grew without religion that would not show there is no God.'
        correct: true
        feedback: |
          Yes. History answers "how did it begin?" and the tests answer "does it work?". These are separate questions, and mixing them is the genetic fallacy.
      - text: 'Religion cannot have influenced science at all, so the supposition is false.'
        feedback: |
          Whether it did is a live question among historians. The trap is in the step from origin to truth, not in the supposition.
      - text: 'The conclusion is right: anything that began in belief is belief.'
        feedback: |
          A method is judged by how it is tested now, whatever its beginnings.
    explanation: |
      A secular reply says the same from the other side: that science began in a mix of causes tells us nothing about whether its results are true. Keep history and truth apart.

  - type: mcq
    id: needham
    title: "The Needham question is settled?"
    prompt: |
      A student says: "Joseph Needham (1900-1995) asked why modern science arose in Europe and not in China, and the answer is that Europeans believed in a divine lawgiver." Which statement is the more careful?
    options:
      - text: 'The question and the answers are disputed. The lawgiver idea is one proposal, and critics (such as Sivin) object that the counterfactual cannot be tested, and other proposals point to institutions and social conditions. Merton''s own thesis about Puritanism was hedged: one important element in encouraging science.'
        correct: true
        feedback: |
          Yes. Always check what the person claimed. Merton said Puritan values were compatible with scientific values and encouraged science, not that they were its single cause.
      - text: 'It is settled: historians agree that religion alone caused modern science.'
        feedback: |
          Historians do not agree, and "alone" is the simplification critics attack. Even defenders of a theological influence speak of encouragement, not sole cause.
      - text: 'It is settled the other way: historians agree that religion played no role.'
        feedback: |
          That is a strong claim some critics make, not a consensus. The role of religion, institutions and other factors is a living debate.
    explanation: |
      A one-line cause for a large historical change is usually a sign that the debate has been squeezed. A good habit: ask who claimed what, and how hedged the original claim was.

  - type: text
    id: summary
    title: "What this round tested"
    body: |
      Each trap was a shortcut one step too far. **Galileo and Oxford**: check the record before the parable. **Barbour and NOMA**: a map and a slogan are shorter than the positions they sort. **Evolution**: random variation plus non-random selection, with the odds multiplied by $w$ each generation. **Hume**: an argument about proportion, with posterior odds equal to likelihood ratio times prior odds, and $1/q^{\,n}$ only for independent witnesses. **Divine action**: a gap in prediction is not a gap in nature, and room is not use. **Surveys and scientists**: wording, sample and year decide the number, a margin covers sampling only, and rates are not reasons. **Origins**: origin is not truth, and a hedged thesis should not be quoted as a flat one.

      Where thoughtful people part ways here is in the premises: whether religion makes claims about the world, whether the world is open to divine action, and how much weight testimony deserves against uniform experience.

      **Next:** a quick recall of the formulas of the level, and then its content map.
