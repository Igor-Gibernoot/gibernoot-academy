id: ch19-shinto
title: "Shinto and the Sacred in Nature"
kind: concept
own: |
  The setting: Shinto, the tradition of rites for the *kami* (sacred powers) at shrines across Japan, taught here according to the encyclopedic and scholarly accounts named in the lesson. Whether any kami exist is left to each reader.
  - **Practice before doctrine.** According to accounts of Shinto, it has no single founder and no single canonical text, and it is {{ concerned with ritual conduct more than with creed }}. Many people in Japan take part in Shinto and Buddhist activities alike, so asking "what do you believe?" may be the wrong question.
  - **Kami.** The scholar Motoori Norinaga (1730 to 1801) defined *kami*, in essence, as {{ any being with an eminent quality out of the ordinary that inspires awe }}: mountains, rivers, the sun, and some deceased humans such as Sugawara no Michizane (worshipped as Tenjin). Kami are not regarded as omnipotent or omniscient, and some must be appeased.
  - **Purity.** The ritual idea is *kegare* (pollution), a temporary condition removed by *harae* (purification), for example *misogi* (washing with water or salt). So the central contrast is {{ pollution and purification, not sin and forgiveness }}.
  - **Ise and renewal.** The Ise Grand Shrine, whose inner shrine honours the sun kami Amaterasu, has its buildings rebuilt on a cycle of {{ every 20 years }} (the 62nd time in 2013). One account links this to *tokowaka*, a renewal that keeps the shrine fresh, and to handing on building skills.
  - **History and the word.** The *Kojiki* (712) and *Nihon Shoki* (720) tell of the kami; the word "Shinto" appears in the Nihon Shoki and was used to set the native kami apart from Buddhism, with which kami worship later merged. The Meiji government separated them in 1868, built State Shinto, and the {{ Shinto Directive of 15 December 1945 }} ended state sponsorship.
  - **A live dispute.** Kuroda Toshio argued that before modern times Shinto did not exist as an independent religion; others hold that kami worship is old and continuous. This is {{ a debate among scholars and believers, not settled fact }}.
  - **Three layers.** Established: the texts, dates, rites, laws. Debated: whether Shinto is "a religion", how old it is as a unit. Faith: that kami are present in a mountain, a shrine or an ancestor.

cards:
  - type: mcq
    id: hook
    title: "Guess: what is the question to ask?"
    prompt: |
      Guessing is the point; no background is needed. A visitor at a shrine in Japan watches people bow, clap twice, and ask for luck in an exam. The visitor asks several of them, "Do you believe in the god of this shrine?" Many answer that they are "not religious", yet they come every year. What is the most likely reason the question gets such answers?
    options:
      - text: "The question assumes religion means accepting beliefs; for many visitors, taking part in a custom matters more than stating a belief."
        correct: true
        feedback: |
          This is close to how many scholars describe the tradition, which is why it is a good first guess. It is a generalisation, and the lesson asks how far it holds and who says so.
      - text: "They are hiding their real beliefs out of fear."
        feedback: |
          Nothing in the scene suggests fear. Taking the answers at face value, the puzzle is about what the word "religion" asks for.
      - text: "They do not know what the shrine is for, so their visit means nothing."
        feedback: |
          A visit can carry meaning, such as habit, family, season or hope, without a stated creed. Whether that counts as religion is exactly what the lesson examines.
    explanation: |
      The lesson keeps three questions. What are *kami*, and what do rites of purity do? How did a set of local practices come to be one thing called Shinto, and did it? And whose voice are we reading, a priest, a historian or a state? The habit of the course holds: facts, debates and faith commitments kept apart.

  - type: text
    id: what
    title: "A tradition of practice"
    body: |
      **Shinto** is a name for the rites and beliefs about the **kami** (sacred powers) at shrines in Japan. According to Wikipedia's article, it has no single founder and no single canonical text, and it focuses on ritual behaviour rather than doctrine. The article quotes the scholar Stuart Picken as saying that Shinto is interested "not in *credenda* but in *agenda*", that is, in what is to be done, not in what is to be believed. It reports that Japan has around 100,000 public shrines, about 80,000 of them affiliated with the Association of Shinto Shrines, and that most Japanese people take part in both Shinto and Buddhist activities.

      Two readings of this are common. One says that Shinto is a living religion whose centre is practice, so that asking for beliefs imports a Christian shape. The other says that the word "religion" itself, applied to Japan, came with the modern period, so that "is it a religion?" depends on a definition. Both agree that the visitor in the hook is not being evasive. This lesson does not pick between them.

  - type: mcq
    id: kami
    title: "What does kami name?"
    prompt: |
      According to Wikipedia's article on *kami*, the scholar Motoori Norinaga (1730 to 1801) defined kami in essence as any being with some eminent quality out of the ordinary that is awe-inspiring. Which of these is a good use of the word under that definition?
    options:
      - text: "A mountain, a river, the sun, or a deceased person of great virtue can each be called kami, because each strikes the beholder as awe-inspiring."
        correct: true
        feedback: |
          Yes. The article lists natural features, forces of nature and ancestral spirits, and says Sugawara no Michizane, worshipped as Tenjin, is one example of a person who became kami.
      - text: "Kami means a single, all-powerful creator who stands outside the world."
        feedback: |
          That is the shape of a different idea of God. According to the article, kami are not regarded as omnipotent or omniscient, and there are uncountably many.
      - text: "Kami means only the gods named in the old chronicles, never anything in nature."
        feedback: |
          The chronicles do name many kami, but the article also says kami include mountains, rivers, trees, wind and animals, which is what the Norinaga definition allows.
    explanation: |
      The English word "god" or "deity" can mislead, as the article itself notes some Shinto scholars say. A kami is better met as a presence that earns reverence than as a being defined by a list of powers. Whether any such presence exists is a layer-3 question.
    image:
      src: img/motoori.webp
      alt: "Painting of Motoori Norinaga seated at a red desk with books, beside a vase of cherry blossom, with lines of calligraphy above."
      caption: "Motoori Norinaga (1730 to 1801), whose definition of kami is quoted in the question; Commons records this as his self-portrait."
      credit: "Motoori Norinaga, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Motoori_Norinaga_self_portrait.jpg"

  - type: mcq
    id: kami-nature
    title: "Is a kami always kind?"
    prompt: |
      According to the Wikipedia account, kami have a gentle side (*nigi-mitama*) and an assertive, rough side (*ara-mitama*), and must be appeased, and they can have flaws. A friend says: "So if kami are sacred, they must be all-good and all-knowing." What is the best reply?
    options:
      - text: "Not according to the account: kami are not regarded as omnipotent, omniscient or necessarily good, so rites aim at keeping good relations, not at praising a perfect being."
        correct: true
        feedback: |
          Yes. This is the difference from the classical God of the earlier levels, who is defined by perfections. Here the sacred is a power to be treated rightly.
      - text: "Yes, all sacred beings are good in every tradition."
        feedback: |
          Traditions differ; the account says kami can be dangerous when neglected, which is why appeasement appears in the rites.
      - text: "Kami are only symbols, so goodness does not apply."
        feedback: |
          That is a modern interpretation held by some, not what the account says adherents hold. Describing the tradition on its own terms, kami are real presences to be approached with care.
    explanation: |
      Two readings sit side by side: a believer takes the kami as real powers, a scholar may read the rites as social and cultural practice. Both can describe the same shrine.

  - type: text
    id: purity
    title: "Purity, not sin"
    body: |
      According to the same article, Shinto centres on avoiding **kegare** (pollution or impurity) and on **harae** (purification). Kegare is treated as a temporary condition that harae can correct. One form is **misogi**, which uses fresh water, salt water or salt to remove kegare. The picture is of a stain to be washed, not of guilt to be forgiven.

      For a believer this is a way of keeping right relation with the kami. For a sceptical observer it can look like hygiene turned ritual. A third reading, common among historians of religion, is that it is a system that marks boundaries (clean and unclean, ordinary and sacred) as many societies do. The ritual is documented; what it does is the matter of interpretation.

  - type: mcq
    id: purity-q
    title: "Pollution is not a moral stain"
    prompt: |
      According to the account above, what is the best description of kegare and harae?
    options:
      - text: "Kegare is a temporary impurity, and harae (for example misogi, washing with water or salt) removes it; it is about being clean for the kami, not about guilt."
        correct: true
        feedback: |
          Yes. The condition is temporary and treatable, which is why rites of washing are central.
      - text: "Kegare is original sin inherited by every person, removed only by one saving act."
        feedback: |
          That is a different structure, found in some Christian accounts. The account describes pollution as temporary and corrected by ritual.
      - text: "Kegare is a punishment from the kami for disbelief."
        feedback: |
          Nothing in the account links it to unbelief. The condition is a state to be cleansed, not a verdict.
    explanation: |
      This helps explain the hook: a person can wash their hands at the shrine entrance, bow, and leave without stating any creed, because the act itself is the point.

  - type: text
    id: ise
    title: "Rebuilt every twenty years"
    body: |
      The inner shrine at **Ise**, according to Wikipedia's article, is dedicated to Amaterasu, the sun kami, whom the article calls probably Japan's most venerated. The buildings are rebuilt in a cycle called *Shikinen Sengū*, every 20 years, and the 2013 buildings were the 62nd rebuilding. The article reports that the first ceremonial rebuilding was by Empress Jitō in 692 and that the whole process takes about 17 years. It links the practice to the belief in *tokowaka*, renewing objects to keep them fresh, and to passing building techniques from one generation to the next, and it adds that the original purpose is unknown.

      A visitor sees an old tradition in a building that is only twenty years old. A believer may say the shrine is the same because the rite and the kami are the same. A historian may say the building is new and the continuity is in the practice and the skills. Which of these you call "the same shrine" is a question about what identity means, which the course met in the levels on mind and self.

  - type: mcq
    id: ise-q
    title: "Same shrine?"
    prompt: |
      At Ise the buildings are replaced every 20 years by new ones of the same design, with the rite continued. Which statement is a fair description of the disagreement about whether it is "the same shrine"?
    options:
      - text: "Some say it is the same because the kami, the site and the rite continue; others say the timber is new and the sameness lies in the practice and skills handed on. Both accept the documented rebuilding."
        correct: true
        feedback: |
          Yes. The rebuilding is a fact. What makes something "the same" is a question about identity, answered differently by believers and historians.
      - text: "It is a different shrine each time, because the old one was destroyed."
        feedback: |
          That reading is possible, but it is not what the account says adherents hold: the rite and the kami are taken to continue. It also ignores the practice that links each rebuilding to the last.
      - text: "The shrine is never rebuilt; the same timber has stood since the beginning."
        feedback: |
          That contradicts the documented cycle, 62 rebuildings by 2013.
    explanation: |
      The same structure as the ship of Theseus, where the parts change and the form persists. Here the form includes a ritual, and some would add a kami.

  - type: text
    id: history
    title: "Chronicles, a borrowed word and a merger"
    body: |
      The two oldest written accounts of the kami are the *Kojiki*, presented to Empress Genmei in 712 (written by Ō no Yasumaro from what Hieda no Are had memorised, according to Wikipedia), and the *Nihon Shoki*, compiled in 720. The word **Shinto** itself appears in the *Nihon Shoki*. According to a scholarly summary, it says of Emperor Yōmei (reigned 585 to 587) that he had faith in the Buddhist Dharma and revered Shinto (in essence; a paraphrase of the translation). A reference source adds that the word was borrowed from Chinese and set the native kami against the new "foreign" Buddhist ones. So at its first appearance the word is already defined by contrast.

      Over the following centuries kami worship and Buddhism became functionally inseparable (*shinbutsu-shūgō*). According to the Wikipedia article on the history of Shinto, one theory (*honji suijaku*) held that kami are temporary manifestations of Buddhist deities. Much later, Motoori Norinaga spent from 1764 to 1798 writing a commentary on the *Kojiki*, and criticised reading the old texts through Buddhism or Confucianism; he called the influence of a Chinese habit of thought *karagokoro*.

  - type: mcq
    id: history-q
    title: "Why the word came late"
    prompt: |
      According to the account above, the word "Shinto" first appears in the *Nihon Shoki* (720), set against Buddhism, and later kami worship and Buddhism merged. What does this suggest about "Shinto" as a name?
    options:
      - text: "The name arose by contrast with something foreign, and in practice the two traditions long overlapped, so it does not by itself show a separate, self-contained religion."
        correct: true
        feedback: |
          Yes. This is a cautious reading of the dates. It does not say the kami rites were new, only that the unit called Shinto was defined in relation to something else.
      - text: "Shinto was founded in 720 by the authors of the *Nihon Shoki*."
        feedback: |
          The chronicles record older material and the word, not a founding. The account stresses that there is no single founder.
      - text: "Shinto and Buddhism always opposed each other and never mixed."
        feedback: |
          The sources describe a merger (*shinbutsu-shūgō*) and the theory that kami are manifestations of Buddhist deities, so they mixed for long periods.
    explanation: |
      A rite can be very old while the name for it, and the idea that it forms one tradition, is later. The next card shows how a modern state used that gap.

  - type: text
    id: meiji
    title: "The state steps in"
    body: |
      In 1868 the Meiji government issued an order to separate kami from Buddhist deities, according to Wikipedia's article on State Shinto, aiming to tie the Emperor's lineage to Amaterasu. The state also took the line that shrine rites were a non-religious national cult, which the article describes as a way of appearing to support religious freedom while requiring shrine rites. The scholar Jason Ānanda Josephson, in *The Invention of Religion in Japan* (2012), argues that officials created the category of religion in Japan in these years, and placed Shinto outside it as national ideology.

      After the defeat of 1945 the occupation authorities (SCAP) issued the **Shinto Directive** on 15 December 1945, which ended government sponsorship and control of State Shinto and aimed to separate religion from the state. Private support of shrines remained allowed. Some Shinto authorities, according to the same article, reject the concept of "State Shinto", seeing it as an invention of the Directive; others hold the state did bend shrine practice to its ideology. That is a dispute among historians and believers, and this lesson does not settle it.

  - type: order
    id: timeline
    title: "Put the milestones in order"
    prompt: |
      Order these events in Japanese history from earliest to latest.
    steps:
      - "The *Kojiki* is presented to Empress Genmei (712)."
      - "The *Nihon Shoki* is compiled (720)."
      - "The Meiji government orders kami and Buddhist deities separated (1868)."
      - "The Shinto Directive ends state sponsorship of State Shinto (15 December 1945)."
    hint: |
      The two chronicles come in the eighth century, the other two events in the modern period.
    explanation: |
      Two chronicles in the eighth century, then an order in the Meiji period that tried to untangle kami and Buddhas, then the occupation's directive after the war. The long gap between them is why the word Shinto means different things in different centuries.

  - type: text
    id: kuroda
    title: "Is Shinto one old thing?"
    body: |
      The historian **Kuroda Toshio** argued in a 1981 essay, "Shinto in the History of Japanese Religion", that Shinto as a distinct, independent, organised religion is a modern construction, and that before modern times kami and shrines were part of a wider system dominated by Buddhism. Wikipedia quotes him as saying that before modern times Shinto did not exist as an independent religion. A 2002 journal issue reports that his criticism has been widely acclaimed and is the starting point of most Western studies of Shinto.

      The steelman of the other side, as practitioners put it, is that reverence for kami at particular places is old and continuous, and that the name came later than the practice. Scholar Byron Earhart, quoted in the article, finds Shinto "too complex" to label simply as an indigenous religion. The reply from Kuroda's side is that continuity of rites is not the same as the continuity of one self-conscious religion with a creed and identity.

  - type: mcq
    id: kuroda-q
    title: "Where do they actually differ?"
    prompt: |
      Kuroda says Shinto as an independent religion did not exist before modern times; a practitioner says reverence for kami at shrines is old and continuous. Which is the most accurate statement of where they differ?
    options:
      - text: "They may agree that the rites are old; they differ on whether those rites formed one distinct, self-aware religion before the modern period, which depends on what counts as 'a religion'."
        correct: true
        feedback: |
          Yes. The dispute turns on a definition and on how to read the evidence of the medieval period, not on whether shrines existed.
      - text: "Kuroda denies that shrines or kami worship existed before 1868."
        feedback: |
          He gave kami and shrines a central role in the medieval system, as the account of his work says. What he denied is an autonomous system.
      - text: "The practitioner denies that Buddhism ever influenced kami worship."
        feedback: |
          The sources describe a long merger, and a practitioner can accept that while holding the reverence for kami continuous.
    explanation: |
      A good habit: when two experts disagree, ask first whether they dispute the evidence or the definition. Here it is mainly the definition and the weighing of evidence.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    prompt: |
      Select every statement that is **established or documented** (not a matter of faith or live scholarly debate).
    multiple: true
    options:
      - text: "The Shinto Directive was issued on 15 December 1945 by the occupation authorities."
        correct: true
        feedback: |
          Yes: a documented event.
      - text: "The 2013 buildings of the Ise inner shrine were the 62nd rebuilding in the cycle of 20 years."
        correct: true
        feedback: |
          Yes: a documented fact about a building cycle, as reported in the encyclopedic account.
      - text: "Shinto has been one distinct, unified religion since ancient times."
        feedback: |
          This is the point Kuroda disputes; a live debate, so layer 2.
      - text: "Kami are present in mountains and shrines."
        feedback: |
          That many people hold this is a fact about communities; that it is so is a faith commitment, which a scientist or a believer would each judge by their own premises. Layer 3.
      - text: "Shinto is not a religion because it has no creed."
        feedback: |
          It depends on a definition of religion, so it is a debate about a category, not a fact. Layer 2.
    explanation: |
      Facts about events and buildings are layer 1. Whether the name picks out one old religion, or whether lack of a creed disqualifies it, are scholarly debates. What a mountain or a shrine actually holds is faith, in either direction.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** Whether "religion" is the right word for a tradition of rites; whether kami are real presences, symbols or social facts; whether Shinto is an old unified religion or a category shaped by contrast with Buddhism and by the modern state; and whether a rebuilt shrine is the same shrine. The reasons are different definitions of "religion", different weight given to continuity of practice versus continuity of a named system, and different metaphysical commitments about the sacred.
      **Next:** the lesson Gnosticism, Hermeticism and Western Esotericism turns to currents that claim hidden knowledge, and asks what they claim, how historians trace them, and how practitioners describe them.
