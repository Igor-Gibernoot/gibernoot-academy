id: ch19-shinto
title: "Shinto and the Sacred in Nature"
kind: concept
own: |
  The setting: Shinto, the tradition of rites for the *kami* (sacred powers) at shrines across Japan, taught here according to the encyclopedic and scholarly accounts named in the lesson. Whether any kami exist is left to each reader.
  - **Practice before doctrine.** According to accounts of Shinto, it has no single founder and no single canonical text, and it is {{ concerned with ritual conduct more than with creed }}. Most Japanese are involved in some form of shrine practice, as a scholarly introduction puts it, so asking "what do you believe?" may be the wrong question.
  - **Kami.** The scholar Motoori Norinaga (1730 to 1801) defined *kami*, in essence, as {{ any being with unusual, superlative power that inspires awe }}: people, animals and natural features such as mountains, and, in the Encyclopedia of Shinto's wording, "superlative" does not mean only good. Sugawara no Michizane, worshipped as Tenjin, is one human so honoured. A kami has a calm side (*nigimitama*) and a harsh side (*aramitama*), and appeasement and worship turn the harsh side calm.
  - **Purity.** The ritual idea is *kegare* (pollution), a condition that ritual washing, *misogi*, can generally remove, within the wider purification called *harae*. Shinto also knows transgression (*tsumi*), but the emphasis falls on {{ pollution and purification, more than sin and forgiveness }}.
  - **Ise and renewal.** The Ise Grand Shrine, whose inner shrine honours the sun kami Amaterasu, has its buildings rebuilt on a cycle of {{ every 20 years }} (the 62nd time in 2013). The regional tourism board says this keeps the shrine "everlasting youthful and vibrant" and hands on the skills of shrine carpenters.
  - **History and the word.** The *Kojiki* (712) and *Nihon Shoki* (720) tell of the kami; the word "Shinto" first appears in the Nihon Shoki, where it sits beside Buddhism, with which kami worship later merged. The Meiji government ordered them separated in 1868, State Shinto grew on the premise that shrines were not religious, and the {{ Shinto Directive of 15 December 1945 }} ended state sponsorship.
  - **A live dispute.** Kuroda Toshio argued that Shinto as a religious system of its own did not exist in any period of Japanese history before the Meiji era; others hold that kami worship is old and continuous. This is {{ a debate among scholars and believers, not settled fact }}.
  - **Three layers.** Established: the texts, dates, rites, laws. Debated: whether Shinto is "a religion", how old it is as a unit. Faith: that kami are present in a mountain, a shrine or an ancestor.

cards:
  - type: mcq
    id: hook
    title: "Guess: what is the question to ask?"
    prompt: |
      Guessing is the point; no background is needed. A visitor at a shrine in Japan watches people bow, clap twice, and ask for luck in an exam. The visitor asks several of them, "Do you believe in the god of this shrine?" Many answer that they are "not religious", yet they come every year. What is the most likely reason the question gets such answers?
    options:
      - text: "The question assumes religion means accepting beliefs; for many visitors, taking part in a custom matters more than stating a belief."
        correct: true
        feedback: |
          This is close to how many scholars describe the tradition, which is why it is a good first guess. It is a generalisation, and the lesson asks how far it holds and who says so.
      - text: "They are hiding their real beliefs out of fear."
        feedback: |
          Nothing in the scene suggests fear. Taking the answers at face value, the puzzle is about what the word "religion" asks for.
      - text: "They do not know what the shrine is for, so their visit means nothing."
        feedback: |
          A visit can carry meaning, such as habit, family, season or hope, without a stated creed. Whether that counts as religion is exactly what the lesson examines.
    explanation: |
      The lesson keeps three questions. What are *kami*, and what do rites of purity do? How did a set of local practices come to be one thing called Shinto, and did it? And whose voice are we reading, a priest, a historian or a state? The habit of the course holds: facts, debates and faith commitments kept apart.

  - type: text
    id: what
    title: "A tradition of practice"
    body: |
      **Shinto** is a name for the rites and beliefs about the **kami** (sacred powers) at shrines in Japan. Standard accounts, such as Wikipedia's article on Shinto, say it has no single founder and no single canonical text, and that it focuses on ritual behaviour rather than doctrine. Counts of shrines depend on what is counted. The government's Religion Yearbook lists about 81,000 registered shrines, as reported on one specialist site; the Association of Shinto Shrines counted about 79,000 member shrines in a 1992 figure and reports more than 78,000 members in 2025; Wikipedia gives around 100,000 as an estimate. Two scholars of Shinto write that most Japanese are involved in some form of shrine practice.

      Two readings of this are common. One says that Shinto is a living religion whose centre is practice, so that asking for beliefs imports a Christian shape. The other says that the word "religion" itself, applied to Japan, came with the modern period, so that "is it a religion?" depends on a definition. Both agree that the visitor in the hook is not being evasive. This lesson does not pick between them.

  - type: mcq
    id: kami
    title: "What does kami name?"
    prompt: |
      According to the Encyclopedia of Shinto, the scholar Motoori Norinaga (1730 to 1801) defined kami in essence as whatever has superlative power not normally found in the world and so inspires awe. Which of these is a good use of the word under that definition?
    options:
      - text: "A mountain, an animal, or a person can each be called kami, because each strikes the beholder as awe-inspiring."
        correct: true
        feedback: |
          Yes. The Encyclopedia of Shinto says the definition covers people, animals and natural features. Sugawara no Michizane, worshipped as Tenjin, is a person honoured as a kami, and there are more than 10,000 shrines to him.
      - text: "Kami means a single, all-powerful creator who stands outside the world."
        feedback: |
          That is the shape of a different idea of God. Norinaga's definition rests on awe at unusual power, not on a creator or on perfection, and it covers many beings.
      - text: "Kami means only the gods named in the old chronicles, never anything in nature."
        feedback: |
          The chronicles do name many kami, but the Encyclopedia of Shinto says the definition also covers animals and natural features, which is what Norinaga's wording allows.
    explanation: |
      The English word "god" or "deity" can mislead. A kami is better met as a presence that earns reverence than as a being defined by a list of powers. Whether any such presence exists is a layer-3 question.
    image:
      src: img/motoori.webp
      alt: "Painting of Motoori Norinaga seated at a red desk with books, beside a vase of cherry blossom, with lines of calligraphy above."
      caption: "Motoori Norinaga (1730 to 1801), whose definition of kami is quoted in the question; Commons records this as his self-portrait."
      credit: "Motoori Norinaga, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Motoori_Norinaga_self_portrait.jpg"

  - type: mcq
    id: kami-nature
    title: "Is a kami always kind?"
    prompt: |
      According to the Encyclopedia of Shinto, a spirit has a peaceful, calming aspect (*nigimitama*) and a harsh, raging aspect (*aramitama*), and worship and appeasement turn the second into the first. Norinaga also said "superlative" does not mean only good. A friend says: "So if kami are sacred, they must be all-good and all-knowing." What is the best reply?
    options:
      - text: "Not according to the account: what counts as kami is defined by awe at unusual power, which need not be good, so rites aim at keeping good relations, not at praising a perfect being."
        correct: true
        feedback: |
          Yes. This is the difference from the classical God of the earlier levels, who is defined by perfections. Here the sacred is a power to be treated rightly.
      - text: "Yes, all sacred beings are good in every tradition."
        feedback: |
          Traditions differ; in this account the harsh aspect of a spirit has to be calmed, which is why appeasement appears in the rites.
      - text: "Kami are only symbols, so goodness does not apply."
        feedback: |
          That is a modern interpretation held by some, not what the account says adherents hold. Describing the tradition on its own terms, kami are real presences to be approached with care.
    explanation: |
      Two readings sit side by side: a believer takes the kami as real powers, a scholar may read the rites as social and cultural practice. Both can describe the same shrine.

  - type: text
    id: purity
    title: "Purity, not sin"
    body: |
      According to the Encyclopedia of Shinto, **kegare** is a polluted condition, the opposite of purity, which was thought to bring calamity if it clung to a person. It can generally be cleansed by ritual ablutions, **misogi**, a washing of the whole body, and misogi belongs with **harae**, the wider rites of purification. The same entry separates kegare, which comes from natural events, from *tsumi*, transgression, which comes from human conduct. So the picture is mostly of a stain to be washed, with guilt a smaller part.

      For a believer this is a way of keeping right relation with the kami. For a sceptical observer it can look like hygiene turned ritual. A third reading, common among historians of religion, is that it is a system that marks boundaries (clean and unclean, ordinary and sacred) as many societies do. The ritual is documented; what it does is the matter of interpretation.

  - type: mcq
    id: purity-q
    title: "Pollution is not a moral stain"
    prompt: |
      According to the account above, what is the best description of kegare and its cleansing?
    options:
      - text: "Kegare is a polluted condition that rites such as misogi (ritual washing) can generally remove; it is mainly about being clean for the kami, not about guilt."
        correct: true
        feedback: |
          Yes. The condition is treatable, which is why rites of washing are central.
      - text: "Kegare is original sin inherited by every person, removed only by one saving act."
        feedback: |
          That is a different structure, found in some Christian accounts. The account describes pollution as cleansed by ritual.
      - text: "Kegare is a punishment from the kami for disbelief."
        feedback: |
          The account says kegare comes from natural events, not from unbelief. The condition is a state to be cleansed, not a verdict.
    explanation: |
      This helps explain the hook: a person can wash their hands at the shrine entrance, bow, and leave without stating any creed, because the act itself is the point.

  - type: text
    id: ise
    title: "Rebuilt every twenty years"
    body: |
      The shrine at **Ise** honours Amaterasu, the sun kami, whom the regional tourism board calls the most significant deity of Japanese mythology. The buildings are rebuilt in a cycle called *Shikinen Sengū*, every 20 years, and the 2013 buildings were the 62nd rebuilding. The Encyclopedia of Shinto says the rite was first performed under Empress Jitō, in 690 for the Inner Shrine and in 692 for the Outer Shrine. The tourism board says the rebuilding keeps the shrine "everlasting youthful and vibrant" and has played an important role in passing on the knowledge and skills of shrine carpenters.

      A visitor sees an old tradition in a building that is only twenty years old. A believer may say the shrine is the same because the rite and the kami are the same. A historian may say the building is new and the continuity is in the practice and the skills. Which of these you call "the same shrine" is a question about what identity means, which the course met in the levels on mind and self.

  - type: mcq
    id: ise-q
    title: "Same shrine?"
    prompt: |
      At Ise the buildings are replaced every 20 years by new ones of the same design, with the rite continued. Which statement is a fair description of the disagreement about whether it is "the same shrine"?
    options:
      - text: "Some say it is the same because the kami, the site and the rite continue; others say the timber is new and the sameness lies in the practice and skills handed on. Both accept the documented rebuilding."
        correct: true
        feedback: |
          Yes. The rebuilding is a fact. What makes something "the same" is a question about identity, answered differently by believers and historians.
      - text: "It is a different shrine each time, because the old one was destroyed."
        feedback: |
          That reading is possible, but it is not what the account says adherents hold: the rite and the kami are taken to continue. It also ignores the practice that links each rebuilding to the last.
      - text: "The shrine is never rebuilt; the same timber has stood since the beginning."
        feedback: |
          That contradicts the documented cycle, 62 rebuildings by 2013.
    explanation: |
      The same structure as the ship of Theseus, where the parts change and the form persists. Here the form includes a ritual, and some would add a kami.

  - type: text
    id: history
    title: "Chronicles, a borrowed word and a merger"
    body: |
      The two oldest written accounts of the kami are the *Kojiki*, presented to Empress Genmei in 712 (Ō no Yasumaro recorded it, and a court attendant, Hieda no Are, was reputed to recall anything he had heard), and the *Nihon Shoki*, compiled in 720. The word **Shinto** itself first appears in the *Nihon Shoki*. A 2002 article by Mark Teeuwen renders the passage as saying that Emperor Yōmei (585 to 587) "believed in the Buddhist Dharma, and respected shinto". The Encyclopedia of Shinto says the word is taken from a Chinese classic, and that its use served to distinguish the kami from the foreign religion of Buddhism. Teeuwen adds that the chronicle's use of the word was probably introduced by a Buddhist monk among its editors, and that in the chronicle it means shrines and their deities. So at its first appearance the word sits beside Buddhism and not apart from it.

      Over the following centuries kami worship and Buddhism became functionally inseparable (*shinbutsu-shūgō*). According to the Encyclopedia of Shinto, one theory (*honji suijaku*) held that Buddhist deities provisionally appear as kami in order to save beings in Japan. Much later, Motoori Norinaga spent some thirty years, beginning in the 1760s and ending in the 1790s (sources give 1763 or 1764 for the start and 1798 for the finish), writing a commentary on the *Kojiki*. The Stanford Encyclopedia of Philosophy says he held that Confucian and Buddhist categories had become so ingrained that people no longer noticed them, and he called this "Chinese mind", *karagokoro*.

  - type: mcq
    id: history-q
    title: "Why the word came late"
    prompt: |
      According to the account above, the word "Shinto" first appears in the *Nihon Shoki* (720), beside Buddhism, and later kami worship and Buddhism merged. What does this suggest about "Shinto" as a name?
    options:
      - text: "The name arose beside something foreign, and in practice the two traditions long overlapped, so it does not by itself show a separate, self-contained religion."
        correct: true
        feedback: |
          Yes. This is a cautious reading of the dates. It does not say the kami rites were new, only that the unit called Shinto was defined in relation to something else.
      - text: "Shinto was founded in 720 by the authors of the *Nihon Shoki*."
        feedback: |
          The chronicles record older material and the word, not a founding. The account stresses that there is no single founder.
      - text: "Shinto and Buddhism always opposed each other and never mixed."
        feedback: |
          The sources describe a merger (*shinbutsu-shūgō*, a combination of kami and buddhas) and a theory that Buddhist deities appear as kami, so they mixed for long periods.
    explanation: |
      A rite can be very old while the name for it, and the idea that it forms one tradition, is later. The next card shows how a modern state used that gap.

  - type: text
    id: meiji
    title: "The state steps in"
    body: |
      In 1868 the Meiji government issued edicts to separate kami from Buddhist deities (*shinbutsu bunri*); the Encyclopedia of Shinto dates the first to the seventeenth day of the third month of that year, and says it ordered the defrocking of Buddhist-garbed shrine priests. The state system that followed rested, in the same encyclopedia's words, on "the idea of shrines being non-religious entities", a premise from 1882. The scholar Jason Ānanda Josephson, in *The Invention of Religion in Japan* (2012), argues, according to a published review, that the Japanese state constructed the categories of religion, superstition and the secular, and defined Shinto as non-religious.

      After the defeat of 1945 the occupation authorities issued the **Shinto Directive** on 15 December 1945. Its text bars public funds and official ties to shrines, and says Shrine Shinto, once divorced from the state, may be recognised as a religion if its adherents wish. The Encyclopedia of Shinto adds that the term "State Shinto" came into common use only with the Directive, and that scholars have not agreed on how to define it. That is a dispute among historians and believers, and this lesson does not settle it.

  - type: order
    id: timeline
    title: "Put the milestones in order"
    prompt: |
      Order these events in Japanese history from earliest to latest.
    steps:
      - "The *Kojiki* is presented to Empress Genmei (712)."
      - "The *Nihon Shoki* is compiled (720)."
      - "The Meiji government orders kami and Buddhist deities separated (1868)."
      - "The Shinto Directive ends state sponsorship of State Shinto (15 December 1945)."
    hint: |
      The two chronicles come in the eighth century, the other two events in the modern period.
    explanation: |
      Two chronicles in the eighth century, then an order in the Meiji period that tried to untangle kami and Buddhas, then the occupation's directive after the war. The long gap between them is why the word Shinto means different things in different centuries.

  - type: text
    id: kuroda
    title: "Is Shinto one old thing?"
    body: |
      The historian **Kuroda Toshio** argued in a 1981 essay, "Shinto in the History of Japanese Religion" (*Journal of Japanese Studies*, volume 7), that Shinto did not exist as a religious system in any period before the Meiji era, and that before then kami and shrines were part of a wider system dominated by Buddhism. A 2002 journal introduction by Mark Teeuwen and Bernhard Scheid says his criticism of Shinto as a historical category "has been met with wide acclaim" and has formed the departing point of most Western studies of Shinto. It adds that Kuroda did not say kami cults or shrine worship are recent: what he rejected is Shinto as an autonomous system beside Buddhism.

      The steelman of the other side, as practitioners put it, is that reverence for kami at particular places is old and continuous, and that the name came later than the practice. The reply from Kuroda's side is that continuity of rites is not the same as the continuity of one self-conscious religion with a creed and identity.

  - type: mcq
    id: kuroda-q
    title: "Where do they actually differ?"
    prompt: |
      Kuroda says Shinto as an independent religion did not exist before modern times; a practitioner says reverence for kami at shrines is old and continuous. Which is the most accurate statement of where they differ?
    options:
      - text: "They may agree that the rites are old; they differ on whether those rites formed one distinct, self-aware religion before the modern period, which depends on what counts as 'a religion'."
        correct: true
        feedback: |
          Yes. The dispute turns on a definition and on how to read the evidence of the medieval period, not on whether shrines existed.
      - text: "Kuroda denies that shrines or kami worship existed before 1868."
        feedback: |
          He gave kami and shrines a central role in the medieval system, as the account of his work says. What he denied is an autonomous system.
      - text: "The practitioner denies that Buddhism ever influenced kami worship."
        feedback: |
          The sources describe a long merger, and a practitioner can accept that while holding the reverence for kami continuous.
    explanation: |
      A good habit: when two experts disagree, ask first whether they dispute the evidence or the definition. Here it is mainly the definition and the weighing of evidence.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    prompt: |
      Select every statement that is **established or documented** (not a matter of faith or live scholarly debate).
    multiple: true
    options:
      - text: "The Shinto Directive was issued on 15 December 1945 by the occupation authorities."
        correct: true
        feedback: |
          Yes: a documented event.
      - text: "The 2013 buildings of the Ise inner shrine were the 62nd rebuilding in the cycle of 20 years."
        correct: true
        feedback: |
          Yes: a documented fact about a building cycle, as reported in the encyclopedic account.
      - text: "Shinto has been one distinct, unified religion since ancient times."
        feedback: |
          This is the point Kuroda disputes; a live debate, so layer 2.
      - text: "Kami are present in mountains and shrines."
        feedback: |
          That many people hold this is a fact about communities; that it is so is a faith commitment, which a scientist or a believer would each judge by their own premises. Layer 3.
      - text: "Shinto is not a religion because it has no creed."
        feedback: |
          It depends on a definition of religion, so it is a debate about a category, not a fact. Layer 2.
    explanation: |
      Facts about events and buildings are layer 1. Whether the name picks out one old religion, or whether lack of a creed disqualifies it, are scholarly debates. What a mountain or a shrine actually holds is faith, in either direction.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** Whether "religion" is the right word for a tradition of rites; whether kami are real presences, symbols or social facts; whether Shinto is an old unified religion or a category shaped by contrast with Buddhism and by the modern state; and whether a rebuilt shrine is the same shrine. The reasons are different definitions of "religion", different weight given to continuity of practice versus continuity of a named system, and different metaphysical commitments about the sacred.
      **Next:** the lesson Gnosticism, Hermeticism and Western Esotericism turns to currents that claim hidden knowledge, and asks what they claim, how historians trace them, and how practitioners describe them.
