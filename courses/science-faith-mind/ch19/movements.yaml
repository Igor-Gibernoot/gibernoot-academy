id: ch19-movements
title: "Newer Movements: Baha'i, Mormonism, New Age"
kind: concept
own: |
  The setting: three movements of the last two centuries, taught here according to their members and according to historians, with the layers kept apart. Whether their revelations are true is left to each reader.
  - **Baha'i Faith.** According to its members, one God sends successive Manifestations (Buddha, Jesus, Muhammad, the Báb, Bahá'u'lláh), the doctrine called {{ progressive revelation }}. The Báb began his mission in 1844 and was executed in 1850; Bahá'u'lláh (1817 to 1892) announced his own claim in 1863. It has no clergy: elected nine-member Spiritual Assemblies govern, and since 1963 {{ the Universal House of Justice }} leads the faith.
  - **Mormonism (Latter-day Saints).** According to Joseph Smith (1805 to 1844), an angel led him to golden plates that he translated; the Book of Mormon went on sale on 26 March 1830. Most historians conclude that {{ Smith composed it himself from his 19th-century surroundings }}; believers hold it is an ancient record. Latter-day Saints speak of a restoration of the Christian gospel after an apostasy, and describe the Father, Son and Spirit as {{ distinct beings, one in purpose }}, which many other Christians dispute.
  - **New Age.** Wouter Hanegraaff (1996) traced it as a secularised form of older esoteric currents. It stresses holism (everything is one interconnected whole), channeling, and {{ personal experience as the main spiritual authority }}. With no central authority, scholars call it a milieu, not a church.
  - **Counting beliefs.** For a survey sample of $n$ people in which a share $p$ hold a belief, the expected number is
  $$N = np$$
  and for $n = 2000$ and $p = 0.4$ (Pew's rough share who accept psychics) this gives {{ $N = 800$ }}.
  - **Three layers.** Established: dates, texts, institutions, survey figures. Debated: how the Book of Mormon arose, whether "New Age" names one movement. Faith: that a Manifestation or an angel spoke, that the self is divine.

cards:
  - type: mcq
    id: hook
    title: "Guess: a religion with a paper trail"
    prompt: |
      Guessing is the point; no background is needed. Most old religions began before anyone kept records, so their origins are partly lost. Three movements are different: they began in the last two centuries, with named founders, printed books and dated events. A historian can therefore ask of them a question that is hard for older religions. What is it?
    options:
      - text: "What do the documents show about how it began, and does that match what its members say about it?"
        correct: true
        feedback: |
          Yes. A paper trail lets two accounts sit side by side: the members' own story and the historians' reconstruction. This lesson keeps both visible.
      - text: "Is it a real religion or only a fashion?"
        feedback: |
          That is a verdict, not a research question, and it depends on a definition of religion that scholars debate. The lesson comes back to it near the end.
      - text: "Which founder was the more honest?"
        feedback: |
          Judging character is not what documents mainly settle. Historians ask what was claimed, when and by whom, and what the claim implied.
    explanation: |
      Following the course's habit, each claim is taught according to someone: the movement's members, or historians. A fact (a date, a printed book) is one layer; what the book is, or who spoke to the founder, belongs to other layers.

  - type: text
    id: bahai
    title: "The Báb and Bahá'u'lláh"
    body: |
      According to the encyclopedic account in Wikipedia, the **Baha'i Faith** began in Iran. A merchant called the **Báb** (1819 to 1850), "the Gate", began his mission on 22 May 1844 in Shiraz and announced a coming figure; he was executed in 1850. **Bahá'u'lláh** (1817 to 1892), born in Tehran, first announced in 1863 in Baghdad that he was that figure, and died near ʻAkká (Acre). According to Baha'i sources the announcement was made privately, to a few followers, in a garden outside Baghdad during the twelve days of Ridván (22 April to 3 May 1863).

      Baha'is hold that a single God reveals religion in an orderly, progressive way through **Manifestations of God**, such as Buddha, Jesus and Muhammad, with the Báb and Bahá'u'lláh the most recent. This teaching is called **progressive revelation**: each Manifestation brings the teaching suited to its age, and the religions are one in essence.
    image:
      src: img/bahaullah.webp
      alt: "A black-and-white photograph of a bearded older man in a tall turban and long robe, seated."
      caption: "Bahá'u'lláh (1817 to 1892) in a photograph taken in Adrianople (modern Edirne) in 1868, one of the few photographs of a founder of a major religion."
      credit: "Unknown photographer, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Bah%C3%A1%27u%27ll%C3%A1h_(M%C3%ADrz%C3%A1_%E1%B8%A4usayn-%60Al%C3%AD_N%C3%BAr%C3%AD)_in_1868.jpg"

  - type: mcq
    id: progressive
    title: "What does progressive revelation imply?"
    prompt: |
      According to Baha'is, progressive revelation means the great religions share one source and differ in the stage of teaching. Some Muslims and others object that, on their reading of the Qur'an (for example, that Muhammad is the "seal of the prophets"), no messenger can come after him. Which statement states the disagreement fairly?
    options:
      - text: "Baha'is read the religions as chapters of one story and honour earlier founders; critics reply that a later revelation contradicts a tradition's own claim to finality. The two differ over what the older texts themselves say."
        correct: true
        feedback: |
          Yes. Both sides appeal to texts. For Baha'is the claim is inclusive (all earlier religions are true as far as they went); for critics it is a new claim that the older tradition rejects. Historians describe the disagreement without settling the theology.
      - text: "Progressive revelation says all religions are false except the newest one."
        feedback: |
          Baha'is teach the opposite: the earlier Manifestations are true messengers. The tension is over finality, not over denying earlier religions.
      - text: "Critics object only because the Baha'i Faith is small."
        feedback: |
          Size is not an argument either way. Scholars note that the finality question is central to the objection from Muslim critics.
    explanation: |
      The structure is a clash of claims about texts and authority (a layer-3 matter). Established: the Baha'i teaching exists and the objection exists. Whether the Qur'anic phrase excludes later messengers is argued by each side from its own reading.

  - type: mcq
    id: structure
    title: "A religion without priests"
    prompt: |
      According to the encyclopedic account, Baha'is have no clergy. Elected nine-member Spiritual Assemblies govern at local, regional and national levels, and the nine-member Universal House of Justice, elected every five years by the National Spiritual Assemblies, has led the faith since 1963. The faith began in Iran, where its members have faced persecution that human rights groups and some scholars describe in grave terms. Which sociological point does this structure illustrate?
    options:
      - text: "A new religion can organise by election and committee instead of by a priesthood, so its authority comes from elected bodies and from the founder's texts."
        correct: true
        feedback: |
          Yes. Authority is placed in the Writings and elected institutions. This is a descriptive point; members would add that it expresses their teachings.
      - text: "A religion without clergy cannot have any shared rules."
        feedback: |
          It has plenty: laws and administration set by the texts and the elected bodies. The absence of priests is not the absence of organisation.
      - text: "Persecution shows the founders' claims are true."
        feedback: |
          Persecution shows people were harmed for their faith, which is a serious historical and moral fact, but it does not decide whether a revelation is true. Many movements with opposite claims have been persecuted.
    explanation: |
      Two layers appear: the facts of organisation and persecution (established, according to the sources cited by historians and human rights groups), and the question of truth, which they do not settle.

  - type: text
    id: mormon
    title: "Joseph Smith and the golden plates"
    body: |
      **Joseph Smith** (born 23 December 1805 in Sharon, Vermont; killed 27 June 1844 in Carthage, Illinois) said that in 1823 an angel, later identified as Moroni, told him of a buried book of golden plates holding the history of an ancient American people, and that around September 1827 he recovered them. He described the **Book of Mormon** as his English translation. According to the encyclopedic account, it was published in Palmyra, New York, and went on sale on 26 March 1830; on 6 April 1830 Smith and his followers organised the Church of Christ, today the **Church of Jesus Christ of Latter-day Saints** (and other bodies, such as Community of Christ, also trace their origin to him).

      Eleven men signed written testimonies: three said an angel showed them the plates in a vision, eight said Smith showed them plates and they handled them. Members find these accounts weighty. Historians note that the witnesses were closely tied to Smith and that no one outside the circle examined the plates, which Smith said were returned to the angel.
    image:
      src: img/joseph-smith.webp
      alt: "A painted portrait of a young man with dark hair, in a dark coat with a high collar."
      caption: "Joseph Smith (1805 to 1844), in a painting made around 1842, near the end of his life."
      credit: "Unknown painter, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Joseph_Smith,_Jr._portrait_owned_by_Joseph_Smith_III.jpg"

  - type: numeric
    id: age
    title: "How old was the translator?"
    prompt: |
      Joseph Smith was born on 23 December 1805, and the Book of Mormon went on sale on 26 March 1830. How old was he, in whole years, when it went on sale?
    answer: 24
    tolerance: 0.001
    answerText: '24'
    wrong:
      - { value: 25, feedback: "He had not yet reached his 25th birthday: that came in December 1830, nine months after the sale began." }
      - { value: 23, feedback: "Subtract the years, 1830 - 1805 = 25, then remove one because his birthday in December had not yet come in March. That gives 24." }
    hint: |
      Count the years from December 1805 to December 1829, then ask whether the birthday of 1830 had happened by March.
    explanation: |
      1830 - 1805 = 25, but the 25th birthday falls on 23 December 1830, after the March sale, so he was 24. His youth is part of the story both sides tell: believers see an unlettered farm youth who could not have composed such a book, while historians see an inventive, energetic 19th-century mind working in a rich religious setting.

  - type: mcq
    id: origin
    title: "Two accounts of the same book"
    prompt: |
      According to Joseph Smith and Latter-day Saints, the Book of Mormon is a translation of an ancient record on golden plates. According to most historians, Smith composed it himself, drawing on the Bible and his 19th-century surroundings. Which statement about these two accounts is sound?
    options:
      - text: "They answer different questions about one book. Historians work from documents and ordinary causes; the believer's claim also includes a revelation, which historical method can neither prove nor disprove directly."
        correct: true
        feedback: |
          Yes. The method of the historian looks for natural explanations of how texts arise, which is why the consensus is as stated; the believer holds a further, faith-based commitment. Each side's claim should be labelled as what it is.
      - text: "Since the plates were never examined, nothing can be said either way about the book."
        feedback: |
          Much can be said: its language, its sources, its early manuscripts and its dictation can be studied. What cannot be examined is the plates themselves.
      - text: "The consensus of historians has proved that Smith faked a revelation."
        feedback: |
          The consensus concerns authorship, as natural historical method sees it. It does not by itself prove what Smith experienced or intended, and historians differ on that.
    explanation: |
      Established: the book, its publication and its early manuscripts. Scholarly consensus: Smith as author (the dictation, according to some accounts, was done with a seer stone in a hat). Faith: that an angel and an ancient record were involved.

  - type: mcq
    id: evidence
    title: "What would count?"
    prompt: |
      A believer and a historian are asked: "What kind of evidence would bear on the claim that the Book of Mormon is an ancient record?" Which answer shows that the claim can be discussed with evidence at all?
    multiple: true
    options:
      - text: "Archaeological or linguistic findings that match the book's named peoples, places and language, which supporters say exist and critics say do not."
        correct: true
        feedback: |
          Yes. A claim about ancient peoples in the Americas leaves traces, so it can be argued with finds. Supporters and critics read the same findings differently, which is why the dispute continues.
      - text: "Whether the plates, if they were ever found, would match their reported weight and size."
        correct: true
        feedback: |
          Yes, in principle: a physical object would be testable. Smith's account says the plates were not kept for examination, so this evidence is not available.
      - text: "The sincerity of a believer's feeling after prayer."
        feedback: |
          The feeling is a real experience and central to many members' reasons for faith, but it is a personal, not a public, evidence. It cannot settle a dispute between two people who do not share it.
    explanation: |
      The question separates public evidence (finds, texts, objects) from personal evidence (experience). Both matter to members; only the first can be checked by outsiders.

  - type: mcq
    id: restoration
    title: "Restoration and the doctrine of God"
    prompt: |
      Latter-day Saints teach that after the death of Jesus's first apostles the true church was lost and that Joseph Smith's work restored it (the "restoration"). They also teach that the Father, Son and Holy Spirit are distinct beings, one in purpose. According to the encyclopedic account, this is a form of social trinitarianism, different from the classical creeds' teaching that the three are one in substance. Why does this matter for how other Christians view them?
    options:
      - text: "Because the creeds of the early councils state the Trinity as the doctrine of God, many Christians hold that a different doctrine falls outside that tradition, while Latter-day Saints reply that they follow Christ and are Christians."
        correct: true
        feedback: |
          Yes. Both sides use the word Christian, and the word carries a contested definition: belonging by belief in Christ, or by acceptance of the historic creeds. Scholars describe this dispute without choosing.
      - text: "Because Latter-day Saints reject all of the Bible."
        feedback: |
          They accept the Bible as scripture (with the Book of Mormon and other works as further scripture). The disagreement is over doctrine and over added scripture and authority.
      - text: "Because the doctrine of the Trinity is stated in these words in the New Testament."
        feedback: |
          The word does not appear in the New Testament; the doctrine was worked out in the early centuries, in the councils, from texts read together. That is why Latter-day Saints and trinitarians can quote the same Bible and disagree.
    explanation: |
      Layer 2: how to define "Christian" is a live debate. Layer 3: whether the true church was lost and then restored is a faith commitment, accepted by members and not by other churches.

  - type: order
    id: timeline
    title: "A timeline of beginnings"
    prompt: |
      Put these events in the order in which they happened.
    steps:
      - "Joseph Smith is born (December 1805)."
      - "Bahá'u'lláh is born in Tehran (1817)."
      - "The Book of Mormon goes on sale in Palmyra (March 1830)."
      - "The Báb begins his mission in Shiraz (22 May 1844)."
      - "Joseph Smith is killed in Carthage, Illinois (27 June 1844)."
      - "Bahá'u'lláh announces his claim in Baghdad (1863)."
    hint: |
      The two founders' births come first, then the book, then 1844, which holds two events in a single summer.
    explanation: |
      Both of the first two movements formed in the decades around 1830 to 1860, in settings of religious ferment and the printing press. The same year, 1844, saw the Báb's first announcement and Smith's death, on two sides of the world, with no link between them.

  - type: text
    id: newage
    title: "The New Age: no founder, no book"
    body: |
      The third case has no founder. According to the encyclopedic account, belief in a coming "new age" grew in 1950s UFO-related groups, then in the 1960s counterculture, the Human Potential Movement and interest in Eastern spirituality, and became prominent in the 1970s, centred in Britain. Scholars date it differently: Gordon Melton to the early 1970s, Wouter Hanegraaff to the later 1970s with full growth in the 1980s.

      Hanegraaff's book *New Age Religion and Western Culture: Esotericism in the Mirror of Secular Thought* (Brill, 1996) presents it as a thoroughly secularised form of western esoteric traditions traceable to the Renaissance, the same currents met in the lesson on Gnosticism and Hermeticism. Common themes are **holism** (everything is part of one interconnected whole, and humans are divine in essence), **channeling** (a person acts as a conduit for guidance from gods, ascended masters or spirit guides) and individual experience as the main spiritual authority, which Paul Heelas called "unmediated individualism".

  - type: mcq
    id: authority
    title: "Who decides?"
    prompt: |
      In a church with a creed, authority sits in an institution or text. In much of the New Age, according to scholars such as Paul Heelas, the individual's own experience is the main authority. Which consequence follows?
    options:
      - text: "No body can declare a teaching wrong or a person outside the group; the movement spreads through books, workshops and personal choice, and varies from person to person."
        correct: true
        feedback: |
          Yes. That is what makes it hard to define, and it also means a critic can rarely say "the movement teaches X" without exceptions.
      - text: "All participants hold the same list of beliefs."
        feedback: |
          Without a central authority there is no shared list; many people draw on different sources and do not agree.
      - text: "It has leaders who enforce one doctrine."
        feedback: |
          Individual teachers and authors exist, but no one holds general authority, which is the very point of the label.
    explanation: |
      A description, not a verdict: members of the milieu would say that personal authority is a strength; critics from creed-based traditions that it lacks a standard. Both claims belong to the faith layer.

  - type: mcq
    id: milieu
    title: "Why call it a milieu?"
    prompt: |
      Many people the scholars place in the New Age reject the label. According to the encyclopedic account, sociologists and religion scholars have called it a milieu (Steve Bruce, "milieu"; Heelas and Woodhead, "holistic milieu"). Why is "milieu" a better word than "church" or "sect"?
    options:
      - text: "A milieu is a loose environment of overlapping ideas, practices and networks with no membership list, no central authority and fuzzy boundaries, which is how the New Age is observed."
        correct: true
        feedback: |
          Yes. The word fits what the evidence shows: many people share some ideas and practices without belonging to anything. Some scholars even doubt it is one movement.
      - text: "Because the movement is small and unimportant."
        feedback: |
          Size is not the point; surveys (below) find widespread such beliefs. The word describes structure, not weight.
      - text: "Because it is a deliberate hoax."
        feedback: |
          Scholars use outsider language that neither asserts nor denies the claims; "milieu" is a word about organisation, not honesty.
    explanation: |
      Choosing a word for a thing is a scholarly judgment (layer 2). A good term fits the observations and avoids both mockery and endorsement.

  - type: numeric
    id: pew
    title: "How many hold such beliefs?"
    prompt: |
      A Pew Research Center report (2018) says that about 40% of US adults accept psychics, about 40% accept spiritual energy in physical objects, 33% reincarnation and 29% astrology, and that roughly six in ten accept at least one of the four (Pew notes that these are "sometimes characterized as" New Age beliefs). In a sample of 2,000 US adults, about how many would you expect to accept the existence of psychics?
    answer: 800
    tolerance: 0.001
    answerText: '800'
    wrong:
      - { value: 1200, feedback: "That uses six in ten, which is the share for at least one of the four beliefs, not for psychics alone." }
      - { value: 80, feedback: "40% of 2,000 is 0.4 times 2,000, which is 800, not 80." }
    hint: |
      Multiply the sample size by the share who accept psychics.
    explanation: |
      Expected number $= np = 2000 \times 0.4 = 800$. The survey is a fact (layer 1); what it means is not. Some scholars note that holding one such belief does not make someone a member of a movement, and Pew's own wording is cautious.

  - type: mcq
    id: newreligion
    title: "What counts as a new religion?"
    prompt: |
      A student asks: "Are Baha'i, Mormonism and the New Age all new religions?" Which reply is fair?
    options:
      - text: "It depends on the definition: all three are recent, but they differ in organisation, claims and self-description; scholars use the label as a convenience and care about not implying that a young religion is less genuine."
        correct: true
        feedback: |
          Yes. "New religious movement" is a scholarly term for recent groups, and it avoids the loaded word "cult". Members would add that their religion is the fulfilment, or restoration, of an older one rather than new.
      - text: "Only religions with ancient founders are real religions."
        feedback: |
          Every old religion was new once. Age is a historical fact but not a test of seriousness or truth.
      - text: "A religion is new if people disagree about it."
        feedback: |
          Disagreement exists around old religions too (the Christian creeds, the Buddhist schools). Newness is about when it began.
    explanation: |
      Notice the three self-descriptions: Baha'is speak of a new revelation within one continuing religion, Latter-day Saints of a restoration, and many in the New Age of no religion at all, only spirituality. The scholars' category covers them but does not decide between them.

  - type: mcq
    id: layers
    title: "Sort the layers"
    prompt: |
      Which of these claims about the three movements belong to the layer of *established fact* (documents, dates, surveys), not to scholarly debate or faith?
    multiple: true
    options:
      - text: "The Book of Mormon went on sale in Palmyra, New York, on 26 March 1830."
        correct: true
        feedback: |
          Yes: a dated, documented event.
      - text: "The Báb began his mission on 22 May 1844 and was executed in 1850."
        correct: true
        feedback: |
          Yes: these dates are given in the standard accounts.
      - text: "An angel showed Joseph Smith where the golden plates were buried."
        feedback: |
          Smith said so, and believers accept it; historians treat it as a claim made by him. It is a faith commitment, not an established fact.
      - text: "Bahá'u'lláh is the latest Manifestation of God in a line that includes Jesus and Muhammad."
        feedback: |
          This is the Baha'i teaching: a faith commitment. The fact is that Baha'is hold it.
      - text: "The New Age is a single organised religion with one doctrine."
        feedback: |
          Scholars describe it as a loose milieu, and whether it is one movement at all is debated.
    explanation: |
      Dates and texts are layer 1. How the Book of Mormon arose, and what to call the New Age, are layer 2. That Smith saw an angel, or that Bahá'u'lláh was a Manifestation, are layer 3.

  - type: text
    id: summary
    body: |
      **Next:** the guided problem *Four Traditions, One Question About Death* takes one question, what happens at death, and puts it to four traditions you have met, each answering in its own terms. Keep the habit from this lesson: for each answer, ask according to whom, and which layer.
