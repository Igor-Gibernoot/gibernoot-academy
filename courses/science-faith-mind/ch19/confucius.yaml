id: ch19-confucius
title: "Confucius and the Ethics of Roles"
kind: concept
own: |
  The setting: the teaching attributed to Confucius (Kongzi, "Master Kong", traditionally 551 to 479 BCE, from what is now Shandong in eastern China), taught according to the *Analects* (*Lunyu*), a book of his sayings and conversations put together by later followers, and to the scholars who study it. Whether the teaching is wise is left to each reader.
  - **The problem is disorder, the remedy is character in relationships.** Confucius lived while the old Zhou order was breaking into rival states. According to the *Analects*, order comes less from laws and punishments than from {{ example and ritual that give people a sense of shame and of what is fitting }}.
  - ***Ren*, *li*, *junzi*.** *Ren* is humaneness, "caring for others"; *li* is ritual propriety, the shared forms (greetings, mourning, sacrifice, court manners) through which respect is shown; the *junzi* is the {{ exemplary person (literally "lord's son", later "gentleman") }} who embodies both.
  - **Roles carry the duties.** According to the text, "let the ruler be a ruler, the subject a subject, a father a father, and a son a son" (the reply to Duke Jing of Qi). Mencius lists five relationships: {{ father and son, ruler and minister, husband and wife, elder and younger, friends }}. Filial piety (*xiao*) is called the root of benevolent action.
  - ***Shu*, reciprocity.** Asked for one word to practise all one's life, the Master answers *shu* and explains it as: {{ what you do not want done to yourself, do not do to others }}. It is a negative form of the Golden Rule.
  - **Spirits and Heaven.** According to the *Analects*, Confucius turns questions about spirits and death back to the duties of life, yet speaks of *Tian* (Heaven) as a moral power. Scholars part ways on whether this makes Confucianism {{ a philosophy, a religion, or a tradition that does not fit that split }}.
  - **Two readings of the ethic.** Some scholars (Tiwald) read it as a kind of *virtue ethics*, where the person's character comes first; others (Ames and Rosemont) read it as *role ethics*, where a person is {{ the sum of their roles and relationships, not a separate individual }}.
  - **Three layers.** Established: the text of the *Analects*, the later canon and the examination system built on it. Debated: what Confucius himself said, and how far Han emperors made it state doctrine. Faith or value: that moral growth through roles and ritual is the way to live.

cards:
  - type: mcq
    id: hook
    title: "Guess: how do you keep a village in order?"
    prompt: |
      Guessing is the point; no background is needed. A village is growing fast and people are cheating each other. The elders can adopt one of two policies. Policy A: write clear laws and punish every breach. Policy B: set a good example, teach shared customs of respect, and let people feel ashamed when they fall short. A thinker of ancient China argued that one of these works deeper than the other. Which is the most reasonable first guess about what he said?
    options:
      - text: "B works deeper: punishment only teaches people to avoid being caught, while example and custom change what they want."
        correct: true
        feedback: |
          A good guess, and close to what the *Analects* attributes to Confucius. Keep one caution: he did not say laws are useless, and many later Chinese thinkers (the Legalists) argued for strict law. We will meet the passage itself and the rival view.
      - text: "A works deeper: people are only moved by fear, so laws are enough."
        feedback: |
          That is roughly the view of the rival school of Legalists, not of Confucius. It is a serious position, but the thinker we meet argued that fear alone leaves people without shame or inner restraint.
      - text: "Neither: a village cannot be ordered at all."
        feedback: |
          The tradition we study was a response to disorder, so it assumed order could be rebuilt. Despair was not its answer.
    explanation: |
      This lesson follows the answer in the *Analects*, the book of sayings of Confucius. Everything is taught according to that text and the scholars who study it; whether it is wise is for you to weigh.

  - type: text
    id: world
    title: "A teacher in a breaking world"
    image:
      src: img/confucius.webp
      alt: "Ink portrait of a standing, bearded Confucius in long robes with hands folded, in a Chinese linear style."
      caption: "A portrait of Confucius traditionally attributed to the Tang painter Wu Daozi (his dates are given variously around 680 to 760); the attribution is doubtful and the image is much later than Confucius, so it shows how later centuries pictured him, not his face."
      credit: "Wu Daozi (attributed), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Confucius_Tang_Dynasty.jpg"
    body: |
      **Confucius** is the Latin form of ***Kongzi*** ("Master Kong"). According to tradition he lived from 551 to 479 BCE, a date the Stanford Encyclopedia of Philosophy marks as traditional; he came from the region of today's Shandong province, in or beside the small state of Lu. The old **Zhou** kingdom, whose kings had once ruled much of northern China, had faded into a patchwork of states that fought each other. This is the setting in which several schools, among them Confucius's followers, later called the *ru*, tried to say how people should live and be governed.

      So the first thing to notice is the question. The tradition does not start from "what is God?" or "what is the self?". It starts from "how do we live together well, and how is a broken order repaired?".

  - type: mcq
    id: world-q
    title: "What kind of question comes first?"
    prompt: |
      According to scholars, the *Analects* grows out of an age of political disorder. Which description of its main concern is fairest?
    options:
      - text: "How people should act toward one another in family, society and government, so that order and decency can be restored."
        correct: true
        feedback: |
          Yes. The text is mostly short conversations about conduct, learning, government and character. Whether it also has a religious side is a real debate, which we reach later.
      - text: "A proof that a single creator god made the world."
        feedback: |
          No such argument appears in it. The text says little about the origin of the world, and when it speaks of Heaven (*Tian*) it does so in a moral setting.
      - text: "A theory of how the mind produces the world."
        feedback: |
          That belongs to other traditions we met (some Buddhist and Western idealist views). The *Analects* works with concrete duties, not a theory of mind.
    explanation: |
      The tradition is "more about how to live than about God", but note the wording: more, not only. Later cards separate what the text says about conduct, ritual and Heaven.

  - type: text
    id: analects
    title: "The book and its limits"
    body: |
      The *Analects* (*Lunyu*, "Selected Sayings") is short: brief remarks and dialogues, often with disciples such as Zigong and Zilu, in twenty books. According to the Han historian Ban Gu (39 to 92 CE), it was put together by first and second generation disciples and passed on in private for a time. Scholars agree it took shape gradually, from soon after his death into the Han dynasty (which began in 206 BCE), and that some parts are probably later than others. The Stanford Encyclopedia also records the view of Zhu Weizheng that its traditional early status was overrated.

      So we can say with confidence what the *Analects* says. How much of it goes back to Confucius himself is a live debate. Numbering varies as well: the same line may be 15.23 in the old translation by James Legge and 15.24 in more recent ones.

  - type: mcq
    id: analects-q
    title: "What does a quotation prove?"
    prompt: |
      A teacher says, "Confucius said that." According to what scholars say of the *Analects*, what is the most careful way to put it?
    options:
      - text: "The *Analects* says it, and the tradition attributes it to him; how far it goes back to his own words is debated."
        correct: true
        feedback: |
          Right. This is the habit of the whole course: say according to whom. The text was compiled by followers over generations, so the safe claim is about the text.
      - text: "He certainly said it word for word, since his students wrote it down on the day."
        feedback: |
          The sources describe a gradual compilation, not a transcript, and some parts are likely later. Certainty about the exact words is not available.
      - text: "Nothing in the book can be used, since nothing is certain."
        feedback: |
          Overcorrecting. Even a later compilation shows what a living tradition took him to teach, and that is the subject of this lesson.
    explanation: |
      Layer 1 (established): the text exists and has a long history of reading. Layer 2 (debate): how much comes from Confucius. Layer 3 (commitment): that he was a sage whose teaching is true to life.

  - type: text
    id: terms
    title: "Three words to carry"
    body: |
      Three Chinese terms, each glossed in plain words.

      ***Ren*** (仁) is usually translated "humaneness" or "benevolence". In one conversation (12.22) it is defined as "caring for others". It names the quality of a person who treats others as people.

      ***Li*** (禮) is "ritual propriety": the shared forms of conduct, such as how to greet a guest, mourn a parent, offer a sacrifice or behave at court. It reaches from ceremony to ordinary manners.

      The ***junzi*** (君子) is the ideal person. The word literally means "lord's son"; in the *Analects* it comes to mean the person of good character, and translators say "gentleman", "exemplary person" or (Tu Weiming) "profound person". Its opposite is the "small person" (*xiaoren*).

      Notice how the three fit: *ren* is the inner quality, *li* the outward form that trains and expresses it, and the *junzi* the person in whom they meet.

  - type: mcq
    id: laws-virtue
    title: "Laws or ritual? The passage"
    prompt: |
      Recall the village. In essence, Analects 2.3 says: if you lead the people by laws and keep them in line by punishments, they will try to avoid the punishment but have no sense of shame; if you lead them by moral force and keep them in line by ritual, they will have a sense of shame and will also become good. According to this passage, what does Confucius think punishment alone fails to produce?
    options:
      - text: "An inner sense of shame and an orientation toward what is right: people merely avoid being caught."
        correct: true
        feedback: |
          Yes. The contrast is between outward compliance and inward concern. Notice that the passage is a claim about what changes the person, and a critic can test it against evidence about how people actually behave.
      - text: "Any obedience at all, since punishments never work."
        feedback: |
          The passage grants that people will avoid punishment, so some obedience follows. Its complaint is about what is missing.
      - text: "Respect for the ruler's family."
        feedback: |
          Respect for family belongs to the next cards, but it is not what this passage says laws fail to give.
    explanation: |
      The rival reading. A Legalist would answer that example works only for a few exceptional people and that clear, reliably enforced rules protect a state at scale. Confucius's side replies that rules without moral growth breed evasion. Where thoughtful people part ways here is a mix of a factual question (what really changes behaviour?) and a value (what counts as a good society?).

  - type: text
    id: li
    title: "What ritual is for"
    body: |
      A modern reader may hear "ritual" as empty ceremony. According to the *Analects*, it is the opposite. Of Confucius's practice at sacrifices the text says, in Legge's translation, "He sacrificed to the dead, as if they were present. He sacrificed to the spirits, as if the spirits were present," and in his own voice he adds that if he does not take part himself, it is as if he had not sacrificed at all (3.12).

      The point is that the form has to be filled with real feeling, and the form is how that feeling is trained and shown. A scholar can read this in two ways: ritual is a human practice that makes social life graceful and meaningful (a mostly secular reading), or it is a way of standing in right relation to ancestors and Heaven (a more religious reading). The text itself supports both emphases.

  - type: mcq
    id: li-q
    title: "Empty form?"
    prompt: |
      A critic says: "Ritual is mere show, so a tradition built on it cannot teach real virtue." According to the *Analects* passage on sacrifice (3.12), which is the best reply on Confucius's behalf?
    options:
      - text: "The passage asks for sincere participation: the sacrifice counts only if the person is really there, with the right attitude."
        correct: true
        feedback: |
          Yes. The line "as if not sacrificing" at all if one is absent shows that outward form without presence is not enough. A critic may still ask whether forms can be sincere when social pressure demands them, and that is a fair open question.
      - text: "Ritual works automatically, whatever the person feels."
        feedback: |
          That is a magical view of ritual, and it is the very reading the passage pushes against by asking for the person's own presence.
      - text: "Ritual is for rulers only; ordinary people have no part in it."
        feedback: |
          The *Analects* treats ritual as reaching family life too: mourning, greetings, daily courtesy. The sacrifice passage is about a person's own attitude, not about rank.
    explanation: |
      Two views remain. Secular reading: li shapes habits and feelings in a shared practice. Religious reading: li connects the living to ancestors and Heaven. Both start from the same texts, as the Stanford Encyclopedia and Anna Sun's sociological work (below) note in different ways.

  - type: text
    id: roles
    title: "Roles carry the duties"
    body: |
      Confucius is asked by Duke Jing of Qi about government. In essence he replies that there is good government when the ruler is a ruler, the minister a minister, the father a father and the son a son (12.11). In the version given in the Internet Encyclopedia of Philosophy: "Let the ruler be a ruler, the subject a subject, a father a father, and a son a son."

      What does "be a father" mean? Each role carries expectations: a father cares and guides, a son shows reverence. The text calls **filial piety** (*xiao*), the son's respect and care for parents, and fraternal respect "the root" of benevolent action (1.2). The idea is that a person learns to care first in the family, where the bonds are strongest, and then extends the caring outward.

      Mencius (fourth century BCE, about a century after Confucius died) later listed five relationships (Mencius 3A4): between father and children, affection; between ruler and ministers, righteousness; between husband and wife, distinction of roles; between elder and younger, precedence; between friends, faithfulness.

  - type: mcq
    id: roles-q
    title: "Which relationship, which quality?"
    prompt: |
      According to Mencius (3A4), each of the five basic relationships has its own quality. Which pairing is right?
    options:
      - text: "Father and children: affection. Friends: faithfulness. Ruler and ministers: righteousness."
        correct: true
        feedback: |
          Yes. Note that the list mixes relationships of unequal rank (father, ruler) with equal ones (friends), and each carries duties for both sides, not only obedience from the lower one.
      - text: "Father and children: righteousness. Friends: affection. Ruler and ministers: precedence."
        feedback: |
          These qualities are shuffled. Mencius pairs affection with the parent and child, and righteousness with ruler and ministers.
      - text: "All five relationships are governed by obedience of the lower to the higher."
        feedback: |
          The usual simplification, and tempting because three of the five relationships are unequal. But friends are equals, and the qualities differ. Whether the roles are too hierarchical is a real critique, taken up later.
    explanation: |
      The same list is the ground of the "role" reading of Confucian ethics that we meet near the end: a person is understood as a father, a friend, a citizen, and morality is how well one does those roles.

  - type: text
    id: shu
    title: "One word for a whole life"
    body: |
      Zigong, a disciple, asks (Book 15, numbered 15.23 by Legge and 15.24 by most later editions): "Is there one word which may serve as a rule of practice for all one's life?" In Legge's translation the Master answers: "Is not 'reciprocity' such a word? What you do not want done to yourself, do not do to others."

      The word is ***shu***, here "reciprocity" (translators also say "consideration of others"). It is a **negative** form of the Golden Rule, phrased as what to avoid rather than what to do. The Golden Rule in its positive form appears in other traditions: "do to others what you would have them do to you" is a saying attributed to Jesus.

  - type: mcq
    id: shu-q
    title: "A rule with a catch?"
    prompt: |
      An objector says: "Do not do to others what you would not want done to yourself" fails if people have different tastes: someone who loves loud music might blast it at a neighbour, since he would not mind it himself. According to the logic of the rule itself, which reply helps most?
    options:
      - text: "The rule is phrased as what to avoid, so it works by imagining oneself in the other's place, and a thoughtful person adjusts to what the other person would dislike."
        correct: true
        feedback: |
          A fair reply, and a mild strength of the negative wording: it limits harm and does not tell you what to impose. A critic can still say it needs a further account of what people want, and that is why Confucian writers add *li* and cultivated judgement.
      - text: "The rule says to do to others what you like, so the objection is just wrong."
        feedback: |
          That is the positive form, which is exactly the version most open to the tastes objection. Confucius's version is about avoiding what you would not want.
      - text: "The rule only applies within one's own family."
        feedback: |
          The question asks for a rule "for all one's life", and Mencius's reply to the Mohists (in the explanation of the family-loyalty card) shows the tradition is concerned with how caring extends outward, not with a closed circle.
    explanation: |
      Two views: the rule is a limit on harm (the reading above), or it is only a first step in a longer training of judgement through ritual and role. Neither reading is forced by the text.

  - type: mcq
    id: filial
    title: "When family and justice pull apart"
    prompt: |
      In Analects 13.18 the Duke of She boasts that in his region there is an upright man who reported his own father for stealing a sheep. In essence Confucius replies that upright people in his region differ: fathers cover for sons and sons for fathers, and uprightness is found in that. Scholars read this in two main ways. Which pair is correct?
    options:
      - text: "One reading says it puts loyalty to kin above public justice. The other says that, for Confucius, genuine uprightness is rooted in natural family love, so reporting a father shows its absence."
        correct: true
        feedback: |
          Yes. The Stanford Encyclopedia ties the passage to "care with distinctions", and Huang Yong frames the debate as two senses of the word for uprightness: impartial justice versus the feeling that family members naturally have for each other. Neither reading is forced by the words.
      - text: "One reading says Confucius approves of theft; the other says he disapproves of sheep."
        feedback: |
          Neither. The case is about who should report whom, not about the theft being good.
      - text: "All scholars agree it simply teaches blind obedience."
        feedback: |
          They do not agree. The text does not say obey a father in wrongdoing (elsewhere, 4.18, it speaks of remonstrating gently), and the debate is real.
    explanation: |
      The rival philosopher Mozi (probably fifth century BCE, according to the Stanford Encyclopedia) held that partiality toward family and state is the root of conflict and urged impartial care for all (*jian ai*). Mencius replied (3A5) that care starts with those nearest, and so partiality can be justified. The dilemma between family loyalty and impartial justice is still debated in Chinese ethics today.

  - type: text
    id: heaven
    title: "Spirits, death and Heaven"
    body: |
      Does Confucius speak of God? The *Analects* has a famous exchange. Jilu (Zilu) asks about serving the spirits of the dead. In Legge's translation the Master answers: "While you are not able to serve men, how can you serve their spirits?" Asked about death, he says: "While you do not know life, how can you know about death?" (11.12, or 11.11 in some editions). In another passage (6.22) he says, in essence, that showing reverence for ghosts and spirits while keeping one's distance may be called wisdom.

      Yet the text also speaks of **Tian**, "Heaven". Legge's translation has Confucius say "He who offends against Heaven has none to whom he can pray" (3.13). The Stanford Encyclopedia notes that in 7.23, in essence, he says Heaven gave birth to the virtue in him, so what can a man who threatens him do to him? And in 11.9 he cries, in the Internet Encyclopedia's rendering, "Heaven has abandoned me!"

  - type: mcq
    id: heaven-q
    title: "Religion, philosophy, or something else?"
    prompt: |
      Scholars have argued for over a century about whether Confucianism is a religion. According to a City University of Hong Kong write-up of the debate and to sociologist Anna Sun's book *Confucianism as a World Religion* (Princeton, 2013), which statement is fair?
    options:
      - text: "It is contested: early twentieth-century Chinese intellectuals denied it is a religion because it lacks a concern with individual salvation, while others point to the state cult of Confucius, and some argue the very split between 'religion' and 'philosophy' is a Western habit that fits it poorly."
        correct: true
        feedback: |
          Yes. Anna Sun compares it to the religions of ancient Greece and Rome before Christianity: less institutional, no required membership. Whether you call it a religion depends on your definition of the word.
      - text: "It is settled that Confucianism is purely a philosophy because Confucius never mentioned Heaven."
        feedback: |
          He did, in the passages we read (3.13, 7.23, 11.9). Even those who stress its humanism do not deny that.
      - text: "It is settled that Confucianism is a religion identical in form to Christianity."
        feedback: |
          Sun and others note that it has no required membership, no creed in the Christian sense and no single church. Calling it identical to Christianity would be a category mistake in the other direction.
    explanation: |
      Two views, both fair: a humanist reading (the text is about conduct and avoids speculation about spirits) and a religious reading (ritual, Heaven and ancestors form a religious practice even without a creed). The honest answer depends on what "religion" means, and that is a layer-2 question.

  - type: text
    id: nature
    title: "Is human nature good? Mencius and Xunzi"
    body: |
      Confucius left a puzzle: if people can become good through learning and ritual, what are they like to begin with? Two later followers answered in opposite ways.

      **Mencius** (*Mengzi*, fourth century BCE) held that human nature (*xing*) is good, in the sense that everyone has four "sprouts": compassion, disdain for wrong, respect and a sense of right and wrong, which must be cultivated like a plant. His example (2A6) is a person who suddenly sees a child about to fall into a well: alarm and compassion arise at once, not from hope of reward or fame.

      **Xunzi** (*Xun Kuang*, third century BCE, born perhaps around 310 BCE) held that human nature is bad in the sense that inborn desires, left alone, lead to conflict (chapter 23, "Human Nature is Evil"). Goodness comes from conscious effort and from the rituals and teachers of the sage kings.

  - type: mcq
    id: nature-q
    title: "What do they share?"
    prompt: |
      Mencius says human nature is good; Xunzi says it is bad. According to the Stanford Encyclopedia of Philosophy, what do they nevertheless share?
    options:
      - text: "Both hold that anyone can become good through effort and self-cultivation; they differ on what the starting point is and whether the models are within or outside the person."
        correct: true
        feedback: |
          Yes. Mencius looks inward to the four beginnings of the heart; Xunzi places the models of good conduct outside, in ritual and teachers. Both keep the Confucian hope of moral growth.
      - text: "Both hold that human nature is fixed and cannot be changed."
        feedback: |
          Both stress change: Mencius by cultivating sprouts, Xunzi by transforming inborn tendencies through effort.
      - text: "Both hold that ritual is unnecessary."
        feedback: |
          Xunzi gives ritual a central place, and Mencius also treats respect and propriety as virtues to be developed.
    explanation: |
      A way to see why it matters: the education you design depends on the nature you assume. If the sprouts are there, you water them; if the tendencies are harmful, you need strong structure. Later Confucians mostly followed Mencius (Zhu Xi grouped the *Mencius* among the Four Books), but Xunzi's emphasis on structure also shaped Han thinking.

  - type: text
    id: history
    title: "From a teacher to an institution"
    body: |
      Over the next two thousand years the school grew into the backbone of Chinese education and government. The Han emperor Wu (reigned 141 to 87 BCE) is traditionally credited with giving Confucian learning an imperial academy with specialists in the classics, though historians dispute how complete the "victory" was and when it came: the slogan "reject the hundred schools" is a later summary, and some argue the shift came after his reign.

      Later Neo-Confucian scholars such as **Zhu Xi** (1130 to 1200; some sources give 1139 as a start) grouped four texts as the *Four Books* (the *Analects*, the *Mencius*, and two chapters, the *Great Learning* and the *Doctrine of the Mean*, taken from the *Book of Rites*), and his commentaries became the basis of the imperial civil service examinations from the early fourteenth century (sources give 1313 or 1315) until they ended in 1905.

      So the same tradition was a school of a private teacher, a system of state education and a moral vocabulary for families. A claim about "Confucianism" needs to say which of these it means.

  - type: mcq
    id: reading
    title: "Virtue or role ethics?"
    prompt: |
      Scholars read Confucian ethics in different ways. According to the Stanford Encyclopedia's survey, which description is fair?
    options:
      - text: "Some (such as Tiwald) accept 'virtue ethics' with qualifications; others (Ames, Rosemont, Neville) reject the virtue label as presupposing isolated individuals with context-free traits, and offer 'role ethics' where a person is constituted by relationships."
        correct: true
        feedback: |
          Yes. Rosemont and Ames set out the role reading in *Confucian Role Ethics* (2016), against a liberal picture of persons as separate, autonomous individuals. A middle position says virtue language can be used if it keeps the relational character of virtue.
      - text: "All scholars agree that Confucian ethics is exactly like Aristotle's."
        feedback: |
          The comparison with virtue ethics is debated, not agreed; the role reading was developed to avoid it.
      - text: "All scholars agree that Confucian ethics is purely about obeying superiors."
        feedback: |
          That caricature is exactly what the scholarly debate moves beyond. Even the harshest critics discuss the text's own limits on obedience, such as remonstrating with parents.
    explanation: |
      A fair objection to the role view: if the person is just a bundle of roles, what grounds a criticism of an unjust role, such as a ruler who abuses his office? Defenders answer that the roles carry standards (a ruler "being a ruler") by which one can fault the one who fails them. This leaves open how far these roles may be criticised or reformed, which is where feminist and liberal critics press hardest.

  - type: mcq
    id: layers
    title: "Sort the claims"
    prompt: |
      Mark every claim that belongs to layer 1, established fact (texts and history), rather than debate or faith.
    multiple: true
    options:
      - text: "The *Analects* contains a passage, usually numbered 15.24 or 15.23, giving *shu* as a rule for life."
        correct: true
        feedback: |
          Yes: this is a statement about the text.
      - text: "Zhu Xi's commentaries on the Four Books were the basis of imperial examinations until 1905."
        correct: true
        feedback: |
          Yes: historical, with a small dating variance (1313 or 1315) for the start.
      - text: "Confucius himself said every line of the *Analects*."
        feedback: |
          Debated: the book was compiled by later followers, and scholars disagree on how far it goes back to him.
      - text: "Confucianism is a religion."
        feedback: |
          Layer 2 at best: it depends on how religion is defined, and scholars disagree.
      - text: "Moral growth through roles and ritual is the best way to live."
        feedback: |
          Layer 3: a commitment of value, which each reader weighs.
    explanation: |
      Keeping the layers apart is the whole method: a text is not a transcript, a debate is not a fact, and a way of life is not a proof.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** Whether laws or character do the deeper work; whether the *Analects* describes a philosophy, a religion or neither; whether family loyalty can override impartial justice; whether roles give persons a rich identity or bind them to hierarchy. The reasons are different premises about human nature and different values.

      **Next:** the Way (*Dao*) in another Chinese tradition. Where Confucius asks how to live by roles and ritual, the Daoists ask what is lost when we fix names and categories at all.
