id: ch19-esoteric
title: "Gnosticism, Hermeticism and Western Esotericism"
kind: concept
own: |
  The setting: a family of currents that claim hidden knowledge (Gnostic texts, Hermetic writings, alchemy, astrology, tarot), taught here according to the historians and the test named in the lesson. Whether their claims are true is left to each reader.
  - **Gnosticism is a contested label.** The Nag Hammadi library (12 papyrus codices and fragments of a thirteenth, reportedly found in Egypt in 1945, in Coptic) holds 52 texts, many of them Gnostic, among them the Gospel of Thomas and the Apocryphon of John. Michael Williams (1996) and Karen King (2003) argue that {{ "Gnosticism" is a modern category, not one ancient religion }}; David Brakke (2010) keeps the name for {{ a specific school of thought known to Irenaeus }}.
  - **Hermetic dating by language.** Marsilio Ficino translated the Corpus Hermeticum into Latin, and the Renaissance took Hermes Trismegistus to be older than Moses; Isaac Casaubon's book of 1614 argued from the Greek that the texts are {{ from the early Christian centuries, not from remote antiquity }}. Reference works give the second and third centuries CE for the Corpus.
  - **Alchemy was "chymistry".** Historians such as William Newman use the old spelling because alchemy and chemistry overlapped: distilling, pigments, drugs and attempts at transmuting metals. Newton left at least a million words on it.
  - **Astrology and chance.** Take a test where each of $n$ charts is matched to one of 3 profiles. Guessing succeeds with probability $p = 1/3$, so the expected number of hits and the spread are
  $$\mu = np \qquad \sigma = \sqrt{np(1-p)}$$
  and for $n = 120$ this gives {{ $\mu = 40$ hits, $\sigma \approx 5.2$ }}. Carlson's double-blind test (Nature, 1985) reported results consistent with chance, and astrologers later disputed the design.
  - **Tarot began as a card game.** The oldest surviving decks include the Visconti-Sforza tarots, dated to {{ about 1460, the mid-15th century, in northern Italy }}; Court de Gébelin's claim of an Egyptian origin dates from 1781, and Etteilla's divination method from 1783.
  - **Western esotericism as a category.** Wouter Hanegraaff's book *Esotericism and the Academy: Rejected Knowledge in Western Culture* (2012) traces how scholars and intellectuals pictured these currents as {{ the domain of the Other }}, the thing "we" are not. He leaves open how much truth lies in those pictures. Historians use outsider (historical) language and avoid asserting or denying the claims.
  - **Three layers.** Established: dates, finds, texts, test results. Debated: whether "Gnosticism" names one movement, how Hermetic texts relate to Egypt. Faith: that hidden knowledge saves, or that the stars shape character.

cards:
  - type: mcq
    id: hook
    title: "Guess: religion, philosophy or method?"
    prompt: |
      Guessing is the point; no background is needed. A text opens with a promise: it contains hidden knowledge, a *gnosis* (Greek for "knowledge"), and whoever grasps it will be saved, but only a few can. Another book claims a way to make gold, a third reads character from the position of the planets at birth. A shelf in a bookshop puts all of them under one label, "esoteric". What is the first sensible question to ask about such a shelf?
    options:
      - text: "For each item: what exactly does it claim, who says so, and what would count as a test of it?"
        correct: true
        feedback: |
          Yes, and it is the habit of this lesson. A claim to hidden knowledge can be a religion, a philosophy, a craft or a prediction method, and each kind is checked differently.
      - text: "Which of them is true? Pick one and discard the rest."
        feedback: |
          Truth is the end of an inquiry, not its start, and the items differ in kind. A text about salvation cannot be tested the way a prediction can.
      - text: "None needs study, because anything called hidden is nonsense."
        feedback: |
          Whether the claims are true is one question; what the texts say, when they were written and how people used them is another, and historians study it carefully.
    explanation: |
      The lesson keeps the course's three layers apart: what is established (finds, dates, test results), what scholars debate (even whether the labels are fair), and what rests on faith or a metaphysical commitment.

  - type: text
    id: gnosis
    title: "Gnosis and a jar in the desert"
    body: |
      *Gnosis* is Greek for knowledge. According to the historian David Brakke, scholars meeting at Messina in 1966 agreed to use "Gnosis" for knowledge reserved for an elite group. For centuries most of what was known about such groups came from their opponents. The bishop Irenaeus of Lyons wrote *Against Heresies*, dated about 175 to 185 CE in one reference work, to refute followers of Valentinus and others who claimed secret teaching.

      In 1945, reportedly, farmers near the Upper Egyptian town of Nag Hammadi found a set of ancient books, though the circumstances are questioned. According to Biblical Archaeology Society, it was twelve papyrus volumes and fragments of another, 52 texts in all (48 distinct titles), among them an edited copy of Plato's *Republic*. The collection includes an excerpt of the *Asclepius*, a teaching of Hermes Trismegistus, met later in this lesson. They are in Coptic, were collected and written down in the mid-fourth century, and the works themselves were composed in the first three Christian centuries. For the first time scholars could read these writers in their own words.
    image:
      src: img/nag-hammadi-codex.webp
      alt: "A papyrus page of Coptic script from Nag Hammadi Codex II, headed by the title of the Apocryphon of John."
      caption: "Page 32 of Codex II, in Coptic, carrying the end of the Apocryphon of John; the codices were reportedly found in Egypt in 1945."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Nag_Hammadi_Codex_II.jpg"
      place: bottom

  - type: mcq
    id: category
    title: "One movement or a label?"
    prompt: |
      Scholars disagree about the word "Gnosticism". Michael Williams (*Rethinking "Gnosticism"*, 1996) argued that the modern category is not supported by any ancient self-description. Karen King (*What Is Gnosticism?*, 2003) argued that it is a modern reification that grew out of the early Christian discourse of orthodoxy and heresy, with writers such as Irenaeus and Tertullian as examples. David Brakke (*The Gnostics*, 2010) argued that the name fits one ancient school of thought, the "Gnostic school of thought" that Irenaeus describes. Which summary is fair?
    options:
      - text: "They all read the same Nag Hammadi texts; they disagree whether a single label fits the variety, and on whom the label describes."
        correct: true
        feedback: |
          Yes. The finds are not in dispute. The dispute is about the category: a modern construct for Williams and King, a usable name for a specific group for Brakke.
      - text: "Williams and King deny that the Nag Hammadi texts exist."
        feedback: |
          Nobody disputes the codices. They doubt that one definition of "Gnosticism" fits all the texts and groups gathered under it.
      - text: "Brakke holds that every ancient Christian text is Gnostic."
        feedback: |
          His point is the opposite: a narrower use of the name for a specific school of thought, distinct from other Christians who rejected and reworked its ideas.
    explanation: |
      Notice the structure of the debate: shared evidence, different category. This is the usual way scholarly disputes in this field run, and it is a layer-2 matter, neither fact nor faith.

  - type: text
    id: thomas
    title: "Two texts, two kinds of claim"
    body: |
      The **Gospel of Thomas** is a list of 114 sayings (the numbering is modern) attributed to Jesus. In the translation quoted by the Center for Online Judaic Studies, its prologue begins "These are the secret sayings which Jesus the Living spoke", and in Bentley Layton's translation saying 1 says that whoever finds the meaning of these sayings "will not taste death". Reference works estimate its composition between about 50 and 140 CE, and the question is debated. Three Greek papyri from Oxyrhynchus, dated from shortly after 200 CE to the mid third century, hold parts of it, and Nag Hammadi has a full Coptic version.

      The **Apocryphon of John** tells a story. A reference page dates it between 120 and 180 CE, and its editor Wisse writes that its main teachings existed before 185 CE. According to Brakke, Wisdom (in Greek, Sophia) produced a thought on her own, without the consent of her male consort, and cast it out, naming it Ialdabaoth (also spelled Yaldabaoth). He is the ignorant maker and ruler of the material universe, the God of Genesis. In this myth the material world arises from that flaw.

      Against claims of secret teaching, Irenaeus appealed in *Against Heresies* (Book III, chapter 3) to the succession of bishops from the apostles. He argued that if the apostles had known hidden mysteries taught privately to the perfect, they would have handed them to their successors.

  - type: mcq
    id: thomas-q
    title: "Is Thomas Gnostic?"
    prompt: |
      The Gospel of Thomas was found among the Nag Hammadi texts, and many early readers called it a Gnostic gospel. According to April DeConick, who writes that in Thomas there is no Sophia, Demiurge, Pleroma, Error, Aeons or Archons, it lacks the Gnostic story just described. Which observation supports the critics?
    options:
      - text: "The text never mentions a fallen Sophia or an evil demiurge, the very figures of the myth in the Apocryphon of John."
        correct: true
        feedback: |
          Yes. A saying collection can talk of hidden meaning without containing the full myth. Other scholars still see Gnostic influence in its dualism, so scholars part here.
      - text: "It was found in Egypt, so it cannot be Christian."
        feedback: |
          Egypt had many Christian communities; the place of discovery says little about content.
      - text: "It has 114 sayings, so it must be a complete canonical gospel."
        feedback: |
          The number of sayings is a modern convention, and the text is a list of sayings, with no story of Jesus's life.
    explanation: |
      Finding place does not fix a text's kind. Reading the content against the Gnostic story is the careful method, and even then scholars weigh it differently.

  - type: text
    id: hermes
    title: "Hermes Thrice-Great"
    body: |
      The **Corpus Hermeticum** is a set of Greek treatises, the *Poimandres* among them, speaking in the voice of **Hermes Trismegistus** ("Thrice-Greatest"), a legendary figure that, according to Encyclopedia.com, joins the Egyptian god Thoth with the Greek Hermes. Marsilio Ficino (1433 to 1499), working for his patron Cosimo de' Medici in Florence, translated these treatises into Latin. According to Hanegraaff, the Renaissance pictured the wisdom given by Poimandres to Hermes as coming long before the time of Moses.

      If Hermes had lived before Moses and Plato, then Greek philosophy and Christianity could be seen as echoes of a very old wisdom. That belief shaped a good deal of Renaissance thought. In 1614 the classical scholar Isaac Casaubon (1559 to 1614) published a long work in which, in essence, he examined the Greek and concluded that the texts come from the early Christian centuries, not from remote antiquity. Sources give his range as the second and third centuries CE.
    image:
      src: img/casaubon.webp
      alt: "Portrait of the scholar Isaac Casaubon in dark dress with a small cap and a white collar."
      caption: "Isaac Casaubon (1559 to 1614), who published his study of the Hermetic writings in 1614, the year he died."
      credit: "Anonymous, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Isaac_Casaubon_from_NPG.jpg"

  - type: order
    id: dating
    title: "Dating a text by its language"
    prompt: |
      A scholar wants to test whether a Greek treatise really dates from remote antiquity, as the Renaissance believed. Put the reasoning in order, as in Casaubon's kind of argument.
    steps:
      - "State the claim to test: the treatise was written long before Plato and Moses."
      - "List the words, phrases and ideas of the Greek text and compare each with datable writings of known periods."
      - "Find that the vocabulary and the ideas match the early centuries CE, and are not found in the early periods."
      - "Conclude that the text was probably written then, and that the claim of great age fails."
    hint: |
      Start with the claim, collect the evidence, compare, and only then conclude.
    explanation: |
      Language changes in ways that can be dated, so a text cannot easily use words that did not yet exist. Encyclopedia.com dates the Corpus to the second and third centuries CE.

  - type: mcq
    id: hermes-q
    title: "What does the later date show?"
    prompt: |
      Casaubon's dating means the Hermetic treatises were not written by an ancient Egyptian sage before Moses. A student concludes: "So the Hermetic texts have nothing to do with Egypt, and the Renaissance enthusiasm was based on nothing." Which reply is fair?
    options:
      - text: "A later date refutes the claim of great age, but not every link to Egypt: later scholars, such as Christian Bull (2018), have argued in essence that Hellenized Egyptian priests led small groups that produced the texts."
        correct: true
        feedback: |
          Yes. The date of the writing and the origin of the ideas are two questions. Some scholars find more continuity with Egyptian culture than earlier ones assumed, though how much is debated.
      - text: "A later date proves the texts were a deliberate forgery by Christians."
        feedback: |
          Dating does not show motive. Texts of the early Christian centuries were written in a context that mixed Greek, Egyptian and other traditions, and a pseudonym was a common way to give a voice authority.
      - text: "Dating by language is unreliable, so the claim of great age stands."
        feedback: |
          The method is standard, and reference works report Casaubon's dating as correct. A claim can be defended on other grounds, but not by dropping the evidence of the language.
    explanation: |
      This case shows a fair-minded pattern: the old belief fails on one question (date) while another question (where the ideas came from) stays open.

  - type: text
    id: alchemy
    title: "Alchemy and Newton's papers"
    body: |
      **Alchemy** is best known for the aim of turning base metals into gold and for the **philosopher's stone**. According to the historians William Newman and Lawrence Principe, in the early modern period "alchemy" and **chymistry** (the old spelling of chemistry) were largely the same field. It included distilling, making pigments, refining salts and making drugs as well as attempts to transmute metals. A university course page adds that the strongly negative sense of "alchemy" dates only from the eighteenth century.

      Isaac Newton (1642 to 1727) is the famous case. Newman writes that at least a million words in Newton's hand survive on alchemical themes. Part of his papers were sold at Sotheby's on 13 and 14 July 1936, according to the Newton Project, and John Maynard Keynes bought many of the alchemical ones. He called Newton "the last of the magicians". Historians say Newton united his chymistry with other interests, such as optics.

  - type: mcq
    id: chymistry
    title: "Why the old spelling?"
    prompt: |
      Newman and Principe write "chymistry" for the practice of Newton's day. What is the best reason?
    options:
      - text: "In that period one field covered what we now separate into chemistry (distilling, pigments, drugs) and alchemy (transmutation), so a modern split would misdescribe it."
        correct: true
        feedback: |
          Yes. Using the old spelling keeps the historian from judging the past by a later boundary between a science and a pseudo-science.
      - text: "Because Newton invented the word to hide his work."
        feedback: |
          It was a common period spelling. Newton did use private symbols and vague terms, but that is a different matter.
      - text: "Because alchemy was always only about spiritual symbolism, never about experiments."
        feedback: |
          Newton's papers record experiments and recipes. Some alchemists read their texts spiritually, but the historians' point is that practice and theory were mixed.
    explanation: |
      A historian can say that a practice produced real knowledge (distillation, pigments) without saying its aim of transmutation was achieved. Description and endorsement are different acts.

  - type: text
    id: astrology
    title: "Astrology and a double-blind test"
    body: |
      **Astrology** claims that the positions of the sun, moon and planets at a person's birth relate to character and life, shown in a birth chart (a **natal chart**). Practitioners differ about whether the link is a physical influence, a symbolic correspondence, or simply a useful language.

      In 1985 the physicist Shawn Carlson published "A double-blind test of astrology" in *Nature*. According to Carlson's paper, advisers from the National Council for Geocosmic Research reviewed the design, and 28 astrologers took part. They had to match natal charts to personality profiles from the California Personality Inventory (CPI), a standard questionnaire; Carlson obtained 116 usable subjects for this part. The advisory astrologers were satisfied that it was a fair test of astrology, and they predicted a correct choice half the time or more, against one third by chance. **Double-blind** means neither the subject nor the person judging knew which chart belonged to whom. The result: the astrologers' first choices were correct 40 times among 116, against 38.5 expected by chance. Carlson wrote that the experiment clearly refutes the astrological hypothesis.

  - type: numeric
    id: chance
    title: "What does chance predict?"
    prompt: |
      An invented test, with the same logic. Each of 120 natal charts is matched by an astrologer to one of 3 personality profiles (one of the three is the true one). A person who knows nothing guesses at random. How many correct matches should be expected from guessing alone?
    answer: 40
    hint: |
      Each guess has probability $1/3$, so the expected number of hits is the number of trials times the probability.
    explanation: |
      Expected hits are $np = 120 \times \tfrac13 = 40$. Even by pure chance, the count varies from one trial to another, with spread $\sigma = \sqrt{np(1-p)} = \sqrt{120 \cdot \tfrac13 \cdot \tfrac23} \approx 5.2$, so 45 or 35 would not be surprising.

  - type: mcq
    id: chance-q
    title: "Reading a result"
    prompt: |
      In the invented test with 120 charts and 3 profiles, chance gives 40 hits with a spread of about 5.2. One astrologer gets 47 right, another gets 60. Which statement is fair?
    options:
      - text: "47 is about 1.4 spreads above 40 and could easily be luck; 60 is nearly 4 spreads above and would be hard to explain by chance."
        correct: true
        feedback: |
          Yes: $(47-40)/5.2 \approx 1.4$ and $(60-40)/5.2 \approx 3.9$. A result is judged by how far it sits from the chance expectation, in units of the spread.
      - text: "Both beat 40, so both astrologers show real skill."
        feedback: |
          Above the average is expected half the time even for pure guessing. What matters is how far above, compared with the spread.
      - text: "Only a perfect score of 120 would count as evidence."
        feedback: |
          A far smaller excess over 40 can already be too large for luck. Perfect scores are not needed to see an effect.
    explanation: |
      Critics of the test argue in essence that a chart reading is holistic and not a forced choice among profiles. Carlson's paper says the advisers' suggestions were followed where they could be without biasing the experiment. The reasoning above shows what any such test needs: an agreed prediction, a chance baseline, and a result compared with it.

  - type: text
    id: tarot
    title: "Tarot: a game before a prophecy"
    body: |
      According to a history of tarot on the wopc.co.uk site, tarot began in Italy as a card game of the 15th century, and the Visconti-Sforza tarocchi date from about 1460. The same account says tarot was not widely used for divination until the eighteenth century.

      Divination with tarot is documented in the 18th century. In 1781 Antoine Court de Gébelin published an essay in his *Monde primitif* that treated the cards as an Egyptian book, and the encyclopedia Universalis says Etteilla (Jean-Baptiste Alliette) appealed to him in 1783 to offer a method of divination with tarot. One history calls that Egyptian origin speculative rather than historically grounded.
    image:
      src: img/tarot-visconti.webp
      alt: "A hand-painted Justice trump card, a crowned figure with sword and scales, from a 15th-century Italian tarot deck."
      caption: "A Justice trump from a hand-painted Visconti-Sforza tarot deck, made in northern Italy in the mid-15th century, for card games."
      credit: "Anonymous, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Visconti-Sforza_tarot_deck._Justice.jpg"
      place: bottom

  - type: mcq
    id: tarot-q
    title: "Old claim, young evidence"
    prompt: |
      A reader says: "Tarot is thousands of years old and was made from the start to tell the future." Which part does the documented history support?
    options:
      - text: "The earliest surviving decks are 15th-century Italian game cards; divination use is documented later, in the 18th century, with the claim of Egyptian origin made in 1781."
        correct: true
        feedback: |
          Yes. Whether the cards can tell anything is a separate question, which no history answers; but the claim of ancient divinatory origin is not supported by the records.
      - text: "The oldest decks are Egyptian, from the time of the pharaohs."
        feedback: |
          This is the kind of claim made in Paris in 1781, which one history calls speculative rather than historically grounded. The oldest surviving decks are Italian.
      - text: "Tarot was invented by Etteilla in the 1780s."
        feedback: |
          The cards were older; Etteilla offered a method of divination with them, but he did not invent the deck.
    explanation: |
      The pattern of the lesson: separate the age of an object, the age of a use, and the truth of a claim. A card used for centuries as a game may later be used for reflection or prediction, and each use has its own test.

  - type: text
    id: category-western
    title: "Western esotericism as a field of study"
    body: |
      All these currents are gathered by scholars under **Western esotericism**. Wouter Hanegraaff, a historian at the University of Amsterdam, wrote in *Esotericism and the Academy: Rejected Knowledge in Western Culture* (Cambridge University Press, 2012) that he does not map the field or write its history. He writes the history of how scholars and intellectuals have imagined it, always as the domain of the Other, and he notes that academic identity depends partly on rejecting that mirror image.

      A practitioner may describe the same currents from the inside: as a tradition of wisdom reached by inner experience. The historian describes them from the outside, and takes in essence a stance of not ruling on truth: he says how much truth lies in those perceptions of otherness is an open question that he will not try to answer directly. This course follows that stance: report what the people claim without ruling on whether it is true.

  - type: mcq
    id: insider
    title: "Inside or outside?"
    prompt: |
      Two statements about the Hermetic texts. A: "These texts transmit a primordial wisdom that the modern world forgot." B: "These texts were written in Greek, in the second and third centuries CE, and were read in the Renaissance as very ancient." Which is the historian's outsider voice, in the sense of reporting claims without ruling on them?
    options:
      - text: "B: it reports dates and reception, and neither asserts nor denies that the wisdom is real."
        correct: true
        feedback: |
          Yes. A is an insider claim, a layer-3 commitment. A historian can quote it as what practitioners say without endorsing it.
      - text: "A: because it describes the texts' contents."
        feedback: |
          A makes a claim about reality ("a primordial wisdom"), which an agnostic method would only report as a claim.
      - text: "Both, because any statement about religion is outsider."
        feedback: |
          Insider and outsider voices differ by whether they commit to the truth of the tradition's own claims.
    explanation: |
      Neither voice is better in general: the insider can say what the practice means to those in it, the outsider can check dates and sources. This course asks for both, kept apart.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    prompt: |
      Select every statement that is **established or documented** (not a matter of faith or live scholarly debate).
    multiple: true
    options:
      - text: "The Nag Hammadi codices were reportedly found in Egypt in 1945 and are written in Coptic."
        correct: true
        feedback: |
          Yes: a documented find.
      - text: "Casaubon published his study of the Hermetic writings in 1614 and argued they date from the early Christian centuries."
        correct: true
        feedback: |
          Yes: a dated publication and its stated argument.
      - text: "In Carlson's 1985 test, astrologers did no better than chance."
        correct: true
        feedback: |
          Yes, that is the reported result. Whether the test was a fair test of astrology is disputed, which is layer 2.
      - text: "There was one ancient movement called Gnosticism."
        feedback: |
          This is the point Williams and King dispute and Brakke defends in narrower form: layer 2.
      - text: "Hidden knowledge, once found, brings salvation."
        feedback: |
          A claim of faith in the Gnostic texts, layer 3, which a historian reports and does not test.
    explanation: |
      Finds, dates and reported results are layer 1. Whether the label fits, how the Hermetic texts relate to Egypt, and whether the test was fair are layer 2. Salvation by gnosis, or influence from the stars, are layer 3.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** Whether "Gnosticism" names one ancient movement or a modern label; whether the Hermetic and alchemical traditions are best read as lost wisdom, as part of the history of science, or as an old religious current; whether Carlson's test was a fair test of astrology; and whether tarot is a game that became divination, a reflective tool, or something more. The reasons are different definitions of the category, different weight given to the practitioners' own account, and different metaphysical commitments about hidden knowledge.

      **Next:** the lesson Newer Movements: Baha'i, Mormonism, New Age turns to traditions that began in the last two centuries, with founders and texts we can date, and asks how scholars study a religion still being written.
