id: ch19-challenge-2
title: "Level Challenge: Four Answers to One Question (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: a possible borrowing, a history and a closing weighing"
    body: |
      Problems 4 and 5 use **real** debates, each stated *according to* the scholars named, and a few simple numbers from dates and counts. Nothing here asks you to decide whether any tradition is true.

      - **Problem 4 · Did a Persian idea reach a Jewish text?** A timeline, the criteria for saying "this was borrowed", the weakest premise, and Hellenism as a possible link.
      - **Problem 5 · Shinto and its history.** Practice before doctrine, the old chronicles, the Shinto Directive of 1945, and a count of shrines.
      - **The closing weighing** of the whole level.

      **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. Each problem ends by asking where thoughtful people part ways and why.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      Tools from the level, each stated so it can be used alone.

      - **Zoroastrianism.** An Iranian tradition that looks back to Zarathustra (Greek form Zoroaster). Its oldest texts are the *Gathas*, poems in Old Avestan. According to Wikipedia's account, Mary Boyce placed him between 1700 and 1000 BCE and later narrowed it to about 1500 to 1000 BCE; Jean Kellens (2011) wrote that a general consensus has gradually emerged for about 1000 BCE for the Gathas; Zoroastrian tradition places him in the 7th and 6th centuries BCE.
      - **The influence debate.** According to Boyce, Zoroaster first taught a final judgement and a resurrection of the dead that later became familiar in Judaism, Christianity and Islam. According to commentators on James Barr's article (*Journal of the American Academy of Religion*, 1985), Barr held that influence is plausible in principle but must be shown, with a mechanism and a motive, and that lists of shared features do not by themselves show it. Lester Grabbe grants that Persian influence on Judaism is generally accepted and asks where and how much. Some argue that Hellenism (Greek culture after Alexander) was the link.
      - **Cyrus.** The Persian king Cyrus took Babylon in 539 BCE; the Hebrew Bible calls him God's anointed.
      - **Shinto.** According to encyclopedic accounts, a tradition of rites for the *kami* (sacred powers) at shrines in Japan, with no single founder or canonical text, focused on ritual conduct more than on doctrine. The *Kojiki* was presented in 712 and the *Nihon Shoki* completed in 720. The Meiji government separated kami worship from Buddhism in 1868 and built State Shinto; the Shinto Directive of 15 December 1945 ended state sponsorship. Kuroda Toshio noted that before modern times Shinto did not exist as an independent religion.
      - **Layers.** Fact, debate, commitment.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · A text that could have borrowed"
    body: |
      **Problem 4.** The *Book of Daniel* in the Hebrew Bible has, in its last chapter (Daniel 12:2), what the Wikipedia article calls the earliest clear biblical statement of the resurrection of the dead: "Many of those who sleep in the dust of the earth shall awake, some to everlasting life." According to the article, the consensus of modern scholarship dates the book to about 167 to 163 BCE, in the time of the king Antiochus IV Epiphanes. The Gathas, on the Kellens reading, are from about 1000 BCE, and Zoroastrian texts speak of the dead rising at the renewal of the world.

      A simplified timeline: Gathas about 1000 BCE; Cyrus takes Babylon 539 BCE; Daniel about 165 BCE (the middle of the range).

      The task: ask whether a Persian idea could have reached Daniel, what would have to be shown, which premise is weakest, and where thoughtful people part.

  - type: numeric
    id: p4-gap
    title: "How long a gap?"
    prompt: |
      Use 1000 BCE for the Gathas and 165 BCE for Daniel. How many years separate them? (BCE years count down toward the present.)
    answer: 835
    tolerance: 5
    answerText: '835'
    wrong:
      - { value: 1165, feedback: 'That adds the two numbers, as if one were CE. Both are BCE, so the gap is a subtraction.' }
    hint: Both dates are on the same BCE scale; subtract the smaller from the larger.
    explanation: |
      $1000 - 165 = 835$ years. The gap is long, so a parallel in ideas is not a link: something has to carry the idea across 835 years, and the detailed Zoroastrian story of the end is found in books much later than the Gathas.

  - type: numeric
    id: p4-contact
    title: "How long after Cyrus?"
    prompt: |
      Cyrus took Babylon in 539 BCE, which is when Jews in Babylon came under Persian rule. Daniel is dated about 165 BCE. How many years after Cyrus's conquest was Daniel written?
    answer: 374
    tolerance: 5
    answerText: '374'
    wrong:
      - { value: 704, feedback: 'That adds the dates. On a BCE scale the elapsed time is the difference.' }
    hint: Subtract the later BCE date from the earlier one.
    explanation: |
      $539 - 165 = 374$ years. Contact with Persian culture is real and early; the gap shows that if a Persian idea entered Daniel, it did so over centuries, which makes "who carried it, and when" the hard question, as Grabbe's "where and how much" says.

  - type: order
    id: p4-order
    title: "Building the case for a borrowing"
    prompt: "Put the steps of a careful argument that one tradition borrowed an idea from another in a sound order."
    steps:
      - "Show that the two ideas are really the same kind of idea, not only alike in a word or two."
      - "Show that the two communities were in contact, in a place and time where the idea could pass."
      - "Show that the direction is right: the source idea is older than the receiving text."
      - "Offer a mechanism and a motive: who carried it and why the receiving tradition would take it."
      - "Ask whether the receiving tradition could have developed the idea itself, and state only what the evidence supports."
    hint: Sameness, contact, order in time, carrier, and then the rival explanation.
    explanation: |
      Barr's demand for a mechanism and a motive is the fourth step. The fifth step is the rival hypothesis: some scholars argue that the hope of resurrection in Second Temple Judaism grew inside Judaism itself. A list of shared features supplies only the first step.

  - type: mcq
    id: p4-weak
    title: "Which premise is weakest?"
    prompt: |
      Boyce's case runs: (P1) the Gathic and later Zoroastrian teaching has a resurrection and a final judgement; (P2) Jews lived under Persian rule; (P3) so the Jewish idea came from Persia. Barr, as commentators report, accepts that influence is plausible in principle but wants a mechanism and a motive shown. What does this ask of the argument?
    options:
      - text: "That the step from P1 and P2 to P3 be earned. Contact (P2) and a similar idea (P1) make influence possible, not shown; the argument needs a carrier, a motive and the right direction in time, and must exclude an inner Jewish development."
        correct: true
        feedback: |
          Yes. The premises can be true and the conclusion still open: contact is not copying. This is a check of the step, not a claim that P3 is false.
      - text: "That P2 be rejected, since Jews were never under Persian rule."
        feedback: |
          Jews in Babylon were under Persian rule after Cyrus took the city in 539 BCE. Neither side denies this.
      - text: "That P3 is simply false, because Judaism never changed."
        feedback: |
          Neither Barr nor Grabbe says this. Grabbe grants that Persian influence is generally accepted over the centuries; the debate is which developments, how much, and by what route.
    explanation: |
      Label: **debate**. A shared idea and a historical contact are layer 1 and layer 2 facts; "this came from that" is a causal claim, which needs more. Note also the direction of dating: the oldest Gathic poems are old, but the detailed Zoroastrian story of the end (the sequence of ages, the Chinvat bridge) comes from later texts such as the *Bundahishn*, c. ninth century CE, so the stronger evidence for the details is later than Daniel, and the dating itself is part of the debate.

  - type: mcq
    id: p4-hellenism
    title: "Hellenism as a link"
    prompt: |
      Some scholars suggest the link was Hellenism, the Greek culture that spread after Alexander, and that the immortality of the soul probably came from Greek thought while bodily resurrection may have come from Zoroastrian doctrine. A student says: "A parallel between Daniel 12:2 and a Zoroastrian text proves a Persian origin." What does a parallel show, and what does it not?
    options:
      - text: "It shows that two traditions share an idea, which makes borrowing a candidate. It does not show the direction, the route (Persian, Greek or inner Jewish) or that the idea is not independent; each of those has to be argued."
        correct: true
        feedback: |
          Yes. Daniel was written in the time of Antiochus IV, when Greek culture was strong, so a Greek route must be weighed too, and the Bible's own earlier hints of resurrection (such as Isaiah 26:19, as commentators note) allow an inner development.
      - text: "It shows the later text copied the earlier one, because the earlier one came first."
        feedback: |
          An earlier text is not a source merely by being earlier. The gap and the route still have to be bridged.
      - text: "It shows nothing at all, so no parallel is ever evidence."
        feedback: |
          A parallel is evidence that makes borrowing worth testing. It is a weak premise when treated as proof, not as no premise.
    explanation: |
      Label: **debate**. Three routes stay on the table: Persian, Greek, inner Jewish. Each fits the same text; they differ on what carries the idea and when.

  - type: mcq
    id: p4-weigh
    title: "Weighing Problem 4"
    prompt: |
      A follower of Boyce, a follower of Barr and a historian who stresses an inner Jewish development all read Daniel 12:2. Where do thoughtful people part ways, and why?
    options:
      - text: "On **what counts as enough evidence for borrowing** (whether a similar idea plus possible contact is enough, or a mechanism and a motive are required) and on **how much weight the dates carry**. The text of Daniel, its date and the Persian rule are agreed."
        correct: true
        feedback: |
          Yes. The facts are shared; the parting is about a standard of proof and about which of three routes best fits. Whether the resurrection hope is true is a further, layer 3 question this debate does not touch.
      - text: "On whether Daniel 12:2 exists."
        feedback: |
          The verse is there; no one disputes it.
      - text: "On whether a Persian origin would make the belief false."
        feedback: |
          An origin, Persian or Jewish, does not settle truth. That is the genetic fallacy, the mistake of judging a claim by where it came from.
    explanation: |
      Label: layer 2 (debate) for the origin; layer 1 for the texts and dates; layer 3 for whether the hope is true, left to each reader.

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-setup
    title: "Problem 5 · Shinto and the Directive"
    body: |
      **Problem 5.** According to Wikipedia's account of Shinto, there are around 100,000 public shrines in Japan, about 80,000 of them affiliated with the Association of Shinto Shrines. It has no single founder or canonical text and focuses on ritual behaviour more than doctrine. The chronicles *Kojiki* (presented 712) and *Nihon Shoki* (completed 720) tell of the kami. In 1868 the state issued the Kami and Buddhas Separation Order; later, under the name State Shinto, the state administered shrines. On 15 December 1945 the occupation headquarters issued the Shinto Directive, which ended state sponsorship.

      The task: ask what a visitor's question assumes, where the history is established and where debated, what the shrine count shows, and where thoughtful people part.

  - type: mcq
    id: p5-question
    title: "What does the question assume?"
    prompt: |
      A survey asks Japanese visitors to shrines: "Do you believe in the kami?" Many say no, or "I am not religious", yet visit at New Year. According to accounts that stress practice over doctrine, what is the best reading?
    options:
      - text: "The question assumes that religion means holding stated beliefs. If the centre of the tradition is taking part in rites, the question may measure the wrong thing; it does not show the visits are empty."
        correct: true
        feedback: |
          Yes. The survey answer is a layer 1 fact about what people say. The reading of what it means is layer 2: other scholars note that the word "religion" itself came into Japan in the modern period and that its use is partly a matter of definition.
      - text: "The visitors are insincere, so their visits do not count as religion."
        feedback: |
          Nothing shows insincerity. This also assumes belief is what makes a visit count, which is the premise in question.
      - text: "Shinto is only a social custom and has nothing religious in it."
        feedback: |
          That is a classification, not a result. Shinto has priests, shrines, purification rites and offerings; whether to call it a religion depends on the definition used.
    explanation: |
      Label: **debate**. The picture is close to Picken's remark, quoted in Wikipedia's account, that Shinto is concerned "not in *credenda* but in *agenda*": with what is done, not what is to be believed.

  - type: numeric
    id: p5-gap
    title: "From the chronicles to the Separation Order"
    prompt: |
      The *Nihon Shoki* was completed in 720 CE and the Kami and Buddhas Separation Order was issued in 1868 CE. How many years lie between them?
    answer: 1148
    tolerance: 0.5
    answerText: '1148'
    wrong:
      - { value: 148, feedback: 'That drops a thousand. 1868 - 720 is over a thousand years.' }
    hint: Both dates are CE, so subtract the earlier from the later.
    explanation: |
      $1868 - 720 = 1148$ years. Kami worship and Buddhism had merged over much of this time (the word *Shinto* appears in the *Nihon Shoki* itself, but mostly as a name that set the native kami apart from Buddhism). The 1868 order tried to separate them, which is part of why a single "Shinto" is a more recent shape.

  - type: numeric
    id: p5-state
    title: "How long did the state system last?"
    prompt: |
      Counting from the Separation Order of 1868 to the Shinto Directive of 15 December 1945, in whole years about how long is the period in which the government administered shrines and shaped what was called State Shinto?
    answer: 77
    tolerance: 0.5
    answerText: '77'
    wrong:
      - { value: 45, feedback: 'That is the years from 1900 to 1945, which is when Sakamoto, as Wikipedia reports, says the system existed. The question asks for the span from 1868.' }
    hint: Subtract 1868 from 1945.
    explanation: |
      $1945 - 1868 = 77$ years. The scholar Sakamoto Koremaru, as Wikipedia reports, argues that the State Shinto system existed only from 1900 to 1945, which would be 45 years: the length depends on what counts as the start. Ashizu Uzuhiko, Sakamoto and Nitta Hitoshi argue that the government's funding and control of shrines was never adequate to justify the term.

  - type: mcq
    id: p5-directive
    title: "Is State Shinto partly the Directive's creation?"
    prompt: |
      The Directive of 15 December 1945 defined State Shinto as a branch of Shinto that official acts had separated from sect Shinto and classed as a "non-religious national cult", and ended state sponsorship. According to Wikipedia, some contemporary Shinto authorities reject the concept and see it mainly as an invention of the Directive. Which statement keeps the layers apart?
    options:
      - text: "That the Directive was issued on 15 December 1945, and that the state sponsored shrines from 1868, are established. Whether 'State Shinto' names a real, unified system or a label made by the Directive is a debate; whether any kami exist is a matter of faith."
        correct: true
        feedback: |
          Yes. Dates and laws are layer 1; the unity of the system is layer 2; kami are layer 3. The debate is about the concept's fit, not about the shrines or the laws.
      - text: "That State Shinto was a single unified system is established, because the Directive named it."
        feedback: |
          A name in a legal order shows what the authors meant, not that the thing was as unified as the name suggests. This is the very point scholars debate.
      - text: "That State Shinto never existed, because some Shinto authorities reject the term."
        feedback: |
          Rejecting the term is a position in the debate, not a refutation. The state's support and control of shrines in these decades is documented; how to describe it is the question.
    explanation: |
      Label: **debate**. Two stories read the same laws: a state system with a clear shape that the Directive ended, or a set of measures that the Directive's wording unified after the fact.

  - type: numeric
    id: p5-shrines
    title: "How many shrines stand outside the association?"
    prompt: |
      Around 100,000 public shrines are reported, about 80,000 affiliated with the Association of Shinto Shrines. About how many are not affiliated, and what percentage of the total are affiliated? Enter the number not affiliated.
    answer: 20000
    tolerance: 500
    answerText: '20,000'
    wrong:
      - { value: 80, feedback: 'That is the affiliated percentage, 80 percent. The question asks for the number of unaffiliated shrines.' }
    hint: Subtract the affiliated shrines from the total.
    explanation: |
      $100{,}000 - 80{,}000 = 20{,}000$ unaffiliated, and $80{,}000 / 100{,}000 = 0.80$, so about 80 percent are affiliated. The counts are rounded ("around", "about"), so only the order of magnitude and the share are reliable.

  - type: mcq
    id: p5-count
    title: "What does a shrine count show?"
    prompt: |
      A writer says: "With about 100,000 shrines, Japan has about 100,000 communities of believers in the kami, so Shinto is clearly a creed-based religion." Which reply is fairest?
    options:
      - text: "The count is a fact about buildings, not about beliefs or members. A shrine can be a small roadside site tended by a family or a major site, and most people who take part also take part in Buddhist activities. It shows that shrines are widespread, not what anyone believes."
        correct: true
        feedback: |
          Yes. Buildings are layer 1; what visitors believe is a separate question, and the lesson's own question was whether belief is the right thing to count.
      - text: "The count is false, since nobody can count shrines."
        feedback: |
          The figure is rounded and sources differ, but a count of public shrines is a checkable kind of fact.
      - text: "The count proves Shinto is not a religion, since there is no creed."
        feedback: |
          A missing creed does not settle the word. Whether to call it a religion depends on the definition used, as in the first problem of part 1.
    explanation: |
      A count of shrines, like the census of Parsis in the lesson on Zoroastrianism, is a fact about a population or a place. What it means for belief is a further step.

  - type: mcq
    id: p5-weigh
    title: "Weighing Problem 5"
    prompt: |
      A priest who stresses the old and continuous worship of the kami, and a historian who follows Kuroda Toshio's remark that before modern times Shinto did not exist as an independent religion, both read the same chronicles and the same history of 1868 and 1945. Where do thoughtful people part ways, and why?
    options:
      - text: "On **what counts as one tradition** (whether practices of worship that went on for centuries, often alongside Buddhism, add up to one thing called Shinto) and on **whether the modern word 'religion' fits**. The texts, dates, laws and counts are agreed."
        correct: true
        feedback: |
          Yes. The disagreement is about a definition and about how to draw a line around a practice. Whether the kami exist is a layer 3 question that neither history settles.
      - text: "On whether the Kojiki and Nihon Shoki were written at all."
        feedback: |
          Those works and their eighth-century dates are not in dispute.
      - text: "On whether the Directive was issued in 1945."
        feedback: |
          That is a documented date, agreed.
    explanation: |
      Label: layer 2 for the unity and the label; layer 1 for the texts, dates and laws; layer 3 for the kami.

  # ---------------- Closing weighing ----------------
  - type: text
    id: close-setup
    title: "The closing weighing of the level"
    body: |
      The level asked one question, again and again: what do people live by, and how do we study it fairly? Four answers recur across the traditions:

      - **A way of life, not a creed** (Confucius, the Dao, Shinto, many Indigenous and African traditions).
      - **A dualism or a choice** (Zoroastrianism: good and evil as opposed, with a choice to make).
      - **Law, scripture and the path of a community** (Sikhs, Jains with their code of non-harm, newer movements).
      - **A hidden or inner knowledge** (esoteric currents, from Hermetic writings to astrology and tarot).

      The label "religion", the evidence and the layers decide how each is described.

  - type: mcq
    id: close-label
    title: "The label"
    prompt: |
      Across the level the word "religion" fits some traditions easily and others awkwardly. According to Smith and to Appiah, which approach is fairest?
    options:
      - text: "Use the word with care, testing it for each case and listening to how people describe their own way of life; do not let a definition made for one tradition decide whether another counts."
        correct: true
        feedback: |
          Yes. Smith warns against turning a way of life into a thing; Appiah holds the word still does useful work if used carefully. Both ask for the particular case.
      - text: "Drop the word everywhere; no tradition should be called a religion."
        feedback: |
          Smith's concern is about its use, and Appiah keeps it. Dropping it is one proposal, not the consensus.
      - text: "Apply the word to every tradition by one fixed definition, so they can be compared."
        feedback: |
          A single fixed definition is just what many scholars doubt, because it tends to import the shape of one tradition (often a creed-based one) into others.
    explanation: |
      The same care applies to the other labels of the level: "philosophy", "cult", "magic", "esoteric", "State Shinto".

  - type: mcq
    id: close-evidence
    title: "Kinds of evidence"
    prompt: |
      Match the question to the kind of reason that can bear on it. Which pairing is best?
    options:
      - text: "A date of a text: language, manuscripts and dated sources. A chance result: counts and probability. Whether a tradition is true: faith, argument and personal reasons, not a survey or a date."
        correct: true
        feedback: |
          Yes. Casaubon's dating by language, Carlson's matching test, and a survey like Hallow Reach's each answer a limited question. None of them decides what is true about God, the dead or the kami.
      - text: "All questions about a tradition can be settled by dating its texts."
        feedback: |
          A date tells when a text was written, not whether what it teaches is true or how old the teaching is.
      - text: "A large number of followers shows that a tradition is true."
        feedback: |
          A count is a fact about people. Truth is not settled by numbers, in either direction.
    explanation: |
      The method of the level: ask what kind of claim it is, then what kind of evidence could bear on it.

  - type: mcq
    id: close-weigh
    title: "Where thoughtful people part ways"
    prompt: |
      Across Confucian, Daoist, Zoroastrian, Shinto, Indigenous, esoteric and newer traditions, where do careful and fair-minded readers part ways, and why?
    options:
      - text: "On definitions (what a religion is), on standards of evidence (how much a parallel, a date or a count shows) and on metaphysical commitments (whether the sacred, the dead or the spirits are real). The texts, dates and counts are shared."
        correct: true
        feedback: |
          Yes. These are the three places the level kept finding the parting: the label, the evidence and the layers.
      - text: "They part because one side has not read the texts."
        feedback: |
          Careful readers of the same texts reach different conclusions, inside and outside each tradition.
      - text: "They part only on dates."
        feedback: |
          Dates are debated in ranges and usually settled by evidence. The deeper parting is about definitions, standards and commitments.
    explanation: |
      Layers: established (texts, dates, laws, counts); debate (labels, influence, unity of a tradition, what a test shows); faith (what is sacred, what happens at death).

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Part 2 used the same method on a possible borrowing and a history: find the hidden premise, separate the layers, and ask what kind of evidence is on the table.

      **Problem 4 (a possible Persian idea in Daniel).** On the timeline of the Gathas (about 1000 BCE), Cyrus taking Babylon (539 BCE) and the Book of Daniel (about 165 BCE),
      $$1000 - 165 = 835, \qquad 539 - 165 = 374$$
      (years).
      According to Boyce, Zoroaster first taught a final judgement and a resurrection that later passed to Judaism, Christianity and Islam; according to commentators on Barr (1985), influence is plausible in principle but needs a mechanism and a motive, and lists of shared features do not show it; according to Grabbe, Persian influence is generally accepted and the question is where and how much; some add Hellenism as a link. A parallel shows that borrowing is a candidate, not its direction or route. Origin does not settle truth.

      **Problem 5 (Shinto).** According to encyclopedic accounts, Shinto has no single founder or canonical text and centres on ritual. The *Kojiki* (712) and *Nihon Shoki* (720), the Separation Order of 1868 and the Shinto Directive of 15 December 1945 are documented:
      $$1868 - 720 = 1148, \qquad 1945 - 1868 = 77$$
      (years).
      Whether State Shinto names a real system or a label of the Directive is debated, as is Kuroda's claim that Shinto before modern times was not an independent religion. A count of about 100,000 shrines (about 80,000 affiliated, so $80{,}000 / 100{,}000 = 0.8$ affiliated) counts buildings, not beliefs.

      **The whole level.** Parting happens on the label (Smith, Appiah), on standards of evidence (dates, parallels, tests, counts) and on commitments about the sacred and the dead. Every claim sits in one of three layers: established, debated, or a matter of faith.

      **Next:** the Level Review replays this level's questions at spaced intervals. After the review comes the partial exam, Partial Exam 3: Texts and Traditions, which covers the traditions from the Torah to these newer movements.
