id: ch19-jain
title: "Jainism and Nonviolence"
kind: concept
own: |
  The setting: Jainism, an Indian tradition taught here according to encyclopedia accounts (the Stanford and Internet Encyclopedias of Philosophy, Wikipedia) and the scholars they cite. Its teachers are called *tirthankaras* ("ford-makers"), 24 in each cosmic cycle, the last being Mahavira. Whether its picture of the world is true is left to each reader.
  - **Ahimsa and the vows.** *Ahimsa* is non-violence, the first of five vows (*mahavratas*, "great vows") that Jain monks and nuns take: non-violence, truth, not stealing, celibacy, non-possession. Householders take lighter forms, the *anuvratas*. According to the Stanford Encyclopedia, monastics try to avoid harming even one-sensed beings, while lay obligations concern beings with two or more senses. So the rule is {{ no harm to any living being, in mind, speech and action, with a stricter reach for monastics than for laypeople }}.
  - **Soul and karma.** According to the Jain texts, every living thing has a soul (*jiva*), and *karma* is {{ a subtle kind of matter that binds to the soul because of its actions and draws it back into a body }}. Release comes by ceasing to take in new karma and purging the old. This differs from presenting karma only as a moral law of cause and result.
  - **Many-sidedness.** *Anekantavada* says that {{ reality has many aspects, so any single statement captures only one side }}. *Nayavada* says each statement is true from one standpoint (*naya*). *Syadvada* adds *syat*, "in some respect", to a claim, so that "the pot exists" becomes "in some respect, the pot exists". Jain texts count seven forms of such a claim, from "in some respect a is F" to "in some respect a is indescribable, and both F and not-F".
  - **Two readings of its aim.** Some modern writers present many-sidedness as a basis for tolerance between views. The scholars Cort and Dundas, as reported in Wikipedia, call that a later reading, since the doctrine was originally metaphysical and Jain authors argued sharply against rivals. A critic from the Hindu side, Shankara, objected that it is inconsistent; defenders answer that each claim is tagged with its respect. Whether it ends in {{ relativism }} is debated; scholars such as Koller stress that it is not meant as relativism.
  - **Three layers.** Established: the texts, the vows and the history of the Digambara ("sky-clad") and Svetambara ("white-clad") branches. Debated: Mahavira's dates (traditionally 599 to 527 BCE, by some scholars about a century later) and the right reading of many-sidedness. Faith or value: that one should never harm a living being.

cards:
  - type: mcq
    id: hook
    title: "Guess: how far can not-harming go?"
    prompt: |
      Guessing is the point; no background is needed. Imagine a rule: you must never knowingly kill or harm any living being, not even an ant, a gnat or a worm. Think of walking, eating, farming and breathing. Which is the most reasonable first guess about daily life under such a rule?
    options:
      - text: "It would reshape almost everything: food, work, travel and even how you move, since harming tiny creatures is hard to avoid."
        correct: true
        feedback: |
          A good guess, and it is close to how the Jain tradition sees it. Its answer is not to give up, but to reduce harm as far as one's way of life allows, with the strictest care from monks and nuns.
      - text: "It would be easy: you would simply avoid hitting people."
        feedback: |
          The rule as stated reaches far beyond people. The question is how far, and what it costs.
      - text: "It could never be taken seriously by anyone."
        feedback: |
          Millions of people have tried to live by versions of it. Whether it can be fully achieved is a fair question, but it has been a living practice, not a thought experiment.
    explanation: |
      This lesson follows Jainism according to encyclopedia accounts and the scholars they cite. We ask how far a duty not to harm can reach, what the Jain picture of the soul and karma has to do with it, and why the same tradition also teaches that truth has many sides.

  - type: text
    id: mahavira
    title: "Mahavira and the ford-makers"
    image:
      src: img/mahavira-statue.webp
      alt: "Photograph of a small seated statue of a calm figure with crossed legs and hands resting in the lap, made of yellow-brown stone."
      caption: "A statue of Mahavira from Gujarat, dated to 1470 and held in Brussels; Jain images of the *tirthankaras* show them seated in meditation or standing, calm and unclothed or plainly marked."
      credit: "Vassil, CC0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Mahavira_Bruxelles_02_10_2011.jpg"
    body: |
      **Jainism** is an Indian tradition with a long monastic and lay community. Its teachers are called *tirthankaras* ("ford-makers", those who show a way across the river of rebirth) or *jinas* ("victors"). According to the Stanford Encyclopedia of Philosophy, the doctrine is taught in each cosmic cycle by 24 such omniscient Jinas, and **Mahavira** is the last of the current cycle. The encyclopedia gives his traditional dates as 599 to 527 BCE (some give 510 for his death). Many scholars place him later, as a contemporary of the Buddha, because the Buddha's dates are tied to his; estimates around 540 to 470 BCE appear in reference works. The 23rd *tirthankara*, **Parshvanatha**, is placed by historians in the eighth or seventh century BCE.

      The tradition has two main branches: the **Digambara** ("sky-clad") and the **Svetambara** ("white-clad"), names that refer to the clothing, or lack of it, of their monks. Accounts of how and when they split differ and are traditional rather than settled. Both share the vows below.

  - type: mcq
    id: mahavira-q
    title: "What can be claimed about Mahavira?"
    prompt: |
      A teacher says, "Mahavira lived from 599 to 527 BCE, and that is established history." According to the sources above, which reply is the most careful?
    options:
      - text: "Those are the traditional dates; many scholars think they are too early, and the safest historical claim is that he was a teacher of about the time of the Buddha."
        correct: true
        feedback: |
          Yes. Layer 1: he is widely accepted as a historical person near the Buddha's time. Layer 2: the exact dates, which depend on the Buddha's own disputed chronology.
      - text: "The dates are certain because Jain tradition counts years exactly."
        feedback: |
          A tradition counting years is evidence of what the tradition holds, not independent confirmation. Historians compare it with other records.
      - text: "Mahavira never existed, since the dates differ."
        feedback: |
          A disagreement about dates is not a doubt about existence. Most scholars accept him as historical.
    explanation: |
      Same pattern as in the lessons on Confucius and Daoism: the text and the practice are facts, the biography is a live question, and the tradition's own account is worth stating as the tradition's.

  - type: text
    id: ahimsa
    title: "Ahimsa: the first vow"
    body: |
      Jainism teaches five ethical duties, called vows. For monks and nuns they are the **mahavratas** ("great vows"): *ahimsa* (non-violence), *satya* (truth), *asteya* (not taking what is not given), *brahmacharya* (celibacy) and *aparigraha* (non-possession). Householders take the same five in a lighter form, the *anuvratas* ("small vows"), fitted to family and work.

      The Internet Encyclopedia of Philosophy calls ahimsa the cardinal rule of how to treat other souls, tied to avoiding harm that comes from anger or ignorance. The Jainpedia site explains that the vow is kept in mind, speech and body, and also covers not causing others to harm and not approving of harm.

      How far does it reach? The Stanford Encyclopedia notes that the monastic community is supposed to avoid harming even the one-sensed beings (such as plants, which have only touch, as the Internet Encyclopedia describes), while the lay community's obligations concern beings with two or more senses. Beings are ranked by how many senses they have, and the more senses, the more ways they can be harmed.

  - type: mcq
    id: ahimsa-q
    title: "What does ahimsa claim?"
    prompt: |
      A friend says, "Ahimsa is just pacifism: not fighting wars, and that is all." According to the sources above, which reply is the fairest?
    options:
      - text: "It reaches further: harm to any living being counts, including by thought, word and deed, and the duty is stricter for monks than for householders."
        correct: true
        feedback: |
          Yes. The vow concerns all living beings and also the inner states (anger, ignorance) behind harm, and it is graded: a householder cannot live like a monk and is asked for less.
      - text: "Your friend is right: ahimsa is only about war between humans."
        feedback: |
          The tradition counts animals and, for monastics, even one-sensed beings, so the scope is far wider than war.
      - text: "Ahimsa applies only to monks; laypeople are not bound by it."
        feedback: |
          Laypeople take the lighter *anuvratas*, which include ahimsa in a form suited to household life.
    explanation: |
      A critic can ask whether a rule that no one can fully keep is useful. Jain defenders reply that it is an ideal approached in degrees, with intention and care counting, and the vows are graded for exactly that reason.

  - type: text
    id: soul-karma
    title: "Why harm matters: soul and karma"
    body: |
      Why should a gnat's life count? According to Jain philosophy, as the Internet Encyclopedia puts it, the basic constituents of reality are souls (*jiva*), and every living thing has one. The Stanford Encyclopedia describes the self as unobstructed consciousness, and everything else as non-self (*ajiva*), the matter and the principles that organise it.

      Now the distinctive step. According to the same sources, Jains conceive **karma** as a subtle type of matter that fills all cosmic space and binds to the soul, a material substance that draws the soul back into a body after death. The soul's own actions are what bind it to this matter. All Jain ethics, in this account, aims at ceasing to take in new karma and purging what has been taken in, until the soul is released.

      So harm matters twice over: it hurts the one harmed, and it binds the one who harms. In the lesson Karma, Samsara, Moksha we met karma as a moral law of action and result. Here it is also, quite literally, stuff.

  - type: mcq
    id: karma-q
    title: "Karma as matter"
    prompt: |
      According to the Jain accounts above, what is distinctive about their view of karma, compared with presenting karma only as a moral law?
    options:
      - text: "Karma is a subtle kind of matter that binds to the soul because of its actions, so liberation means stopping its intake and purging it."
        correct: true
        feedback: |
          Yes. The moral language (good and bad deeds) is kept, but the mechanism is described as material, which is why even good karma still binds and release means freeing the soul from all of it.
      - text: "Karma is only a symbol: Jains deny that anything binds the soul."
        feedback: |
          The texts say the opposite: the soul is bound, and the whole path is about release.
      - text: "Karma is a reward given to the soul at death, and good karma ends rebirth."
        feedback: |
          According to the Internet Encyclopedia, all karma, good or bad, leads to rebirth. Release needs freedom from all of it.
    explanation: |
      Where thoughtful people part ways: a physicalist asks how "subtle matter" could carry moral weight, since ordinary matter is morally neutral. Jain thinkers would reply that the soul and its passions are real causes, and that the matter is the way the soul's states leave a lasting trace. Whether such a picture is true is a metaphysical question, not settled by the texts.

  - type: text
    id: anekanta
    title: "Many-sidedness"
    image:
      src: img/jain-anekanta.webp
      alt: "Temple painting of several men touching different parts of an elephant, each with a different expression."
      caption: "A Jain temple painting of the parable of the blind men and the elephant, used in the tradition to illustrate that each partial view grasps only one side of a thing."
      credit: "romana klee from usa, CC BY-SA 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Medieval_Jain_temple_Anekantavada_doctrine_artwork.jpg"
    body: |
      A second famous Jain idea is about knowledge. The Stanford Encyclopedia calls it the doctrine of the many-sidedness of things, ***anekantavada***: reality has many aspects, so no single description captures all of them. Wikipedia credits the word to the Jain teacher Siddhasena Divakara.

      The Internet Encyclopedia links it to the story of **blind men and an elephant**: for example, one touches the leg and says "a pillar", another the tail and says "a rope", another the side and says "a wall". Each is right about the part and wrong to deny the others. Jain texts use this parable, and the 13th-century Mallisena used it to say that clinging to one partial view and rejecting all others is a defective view.

      Each partial view is a ***naya*** ("standpoint"), and ***nayavada*** is the doctrine that every judgement is true from its own standpoint. ***Syadvada*** is the way of speaking that goes with it: add ***syat***, "in some respect" (the Internet Encyclopedia renders it "perhaps" or "from a perspective"), to a claim.

  - type: mcq
    id: anekanta-q
    title: "What is the aim of many-sidedness?"
    prompt: |
      Reading A: many-sidedness is a call for humility and respect between rival views, a basis for tolerance. Reading B: it is first of all a claim about reality, that things really have many aspects, and the parable is about the elephant, not about manners. According to Wikipedia's account of the scholars Cort and Dundas, which comment is fair?
    options:
      - text: "A is a modern reading that some writers favour; Cort and Dundas call it a misreading, since the doctrine was originally metaphysical and Jain authors criticised Buddhist and Hindu views sharply. B has a stronger base in the old texts, though a tolerant attitude can still be drawn from it."
        correct: true
        feedback: |
          Fair to both. Note that Gandhi, as reported in the same article, called himself a follower of the doctrine in his own sense and tied it to non-violence, so the tolerant use has a famous history even if it is not the original one.
      - text: "A is the original meaning and B was invented by modern critics."
        feedback: |
          The scholars cited say nearly the reverse: the metaphysical sense is earlier, and the tolerance reading is more modern (the article traces it to 1933).
      - text: "Both readings are the same, so there is nothing to debate."
        feedback: |
          They differ in what the doctrine is about (people's attitudes or the world), and in how much weight it gives to rival views.
    explanation: |
      Layer 2 (live debate) and layer 3 (value). Whether one should treat one's own view as one side among several is a commitment; whether the Jain texts meant that is a historical question.

  - type: text
    id: sapta
    title: "Seven ways to say it"
    body: |
      Jain philosophers went further and listed the forms such a claim can take. According to the Internet Encyclopedia of Philosophy, each is introduced by *syat* ("perhaps", or "in some respect"). Take a claim "a is F":

      1. Perhaps a is F.
      2. Perhaps a is not-F.
      3. Perhaps a is both F and not-F.
      4. Perhaps a is indescribable.
      5. Perhaps a is indescribable and F.
      6. Perhaps a is indescribable and not-F.
      7. Perhaps a is indescribable, and both F and not-F.

      The article presents these as seven types of predication, not seven truth values. A toy case: Ravi is a father (in respect of his daughter) and is not a father (in respect of his own father, to whom he is a son). The respect is part of the claim.

  - type: mcq
    id: sapta-q
    title: "Does this allow contradictions?"
    prompt: |
      A student says, "Syadvada lets you say that Ravi is a father and is not a father at once, so it allows contradictions." Which reply is the most accurate to the toy case above?
    options:
      - text: "No: 'is a father' is said in respect of his daughter, and 'is not a father' in respect of his own father. With the respect stated, the claims are about different things and do not clash."
        correct: true
        feedback: |
          Yes. That is the defender's point: each claim is tagged with its respect, so there is no assertion of F and not-F in the same respect.
      - text: "Yes: syadvada means every claim is half true, so any claim is acceptable."
        feedback: |
          That is the relativist caricature. Scholars such as Koller stress that the doctrine does not say all views are equally valid.
      - text: "No: syadvada only applies to religious questions."
        feedback: |
          The standard examples are ordinary: a pot, a person, a number. The doctrine is about how to speak of anything with many aspects.
    explanation: |
      A critic presses further. The Internet Encyclopedia notes that Shankara and others charged the view with inconsistency, and Wikipedia reports the self-application objection: is many-sidedness itself true only in some respect? The article's own verdict is that what begins as fallibilism can end as relativism, if no claim is allowed to stand. Defenders reply that the doctrine is a realist one about complex things, not a refusal to assert.

  - type: mcq
    id: knowledge-link
    title: "A link to underdetermination"
    prompt: |
      Recall the lesson When Data Cannot Decide: different theories can fit the same data, so the data alone do not pick one. A student says that many-sidedness is "the same idea". Which comparison is the fairest?
    options:
      - text: "They share a warning against taking one view for the whole, but differ in kind: underdetermination is about theories and evidence, many-sidedness is, according to the Jain sources, mainly a claim that things themselves have many aspects."
        correct: true
        feedback: |
          Fair. The Stanford Encyclopedia describes Jain epistemology as realist, so the claim is not that nothing is known but that a thing is richer than any single description.
      - text: "They are identical, and Jains discovered the underdetermination of theories."
        feedback: |
          Parallels are suggestive but not identical. Underdetermination is a thesis about the relation of theory to data; the Jain doctrine has a different home in a metaphysics of many-aspected things.
      - text: "They have nothing in common."
        feedback: |
          Both remind us that a single viewpoint can be partial, which is why the comparison is worth making.
    explanation: |
      A scientist will add a test: a many-sided claim can be refined by checking each respect, which is the part that sounds like good scientific practice. Whether the metaphysical claim itself can be tested is a further question.

  - type: mcq
    id: layers
    title: "Sort the claims"
    prompt: |
      Mark every claim that belongs to layer 1, established fact (texts, practice and history), rather than debate or faith.
    multiple: true
    options:
      - text: "Jain monks and nuns take five great vows, the first of which is *ahimsa*."
        correct: true
        feedback: |
          Yes: a fact about the tradition's own rules, as reported by the encyclopedias.
      - text: "The tradition has a Digambara branch and a Svetambara branch."
        correct: true
        feedback: |
          Yes. Accounts of the split are debated, but the existence of the two branches is not.
      - text: "Mahavira lived exactly from 599 to 527 BCE."
        feedback: |
          Traditional dates; many scholars think they are too early. Layer 2.
      - text: "Everything with a soul is bound by subtle karmic matter."
        feedback: |
          Layer 3: a metaphysical commitment of the tradition, taught as theirs.
      - text: "Many-sidedness was meant from the start as a lesson in tolerance."
        feedback: |
          Debated: scholars cited above call that reading modern.
    explanation: |
      Keeping the layers apart is the method: a rule of life is a fact about a community, a date is a historical estimate, and a view of the soul is a commitment.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** Whether a duty of non-harm can be kept when life itself requires some harm, and whether it should reach plants and tiny creatures; whether karma as subtle matter makes sense of moral responsibility; whether many-sidedness is a realist claim about the world, a call for tolerance, or a slide toward relativism. The reasons are different premises about souls and matter, about what counts as a fair test of a view, and different values about harm.

      **Next:** the lesson Sikhism turns to the Punjab in the fifteenth century, to Guru Nanak, one God, and a community that rejected caste distinctions.
