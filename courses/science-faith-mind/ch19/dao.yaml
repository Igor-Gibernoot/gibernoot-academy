id: ch19-dao
title: "Daoism: The Way"
kind: concept
own: |
  The setting: the Chinese tradition called Daoism, taught according to two early books, the *Daodejing* (attributed to Laozi, "Old Master") and the *Zhuangzi* (named for Zhuang Zhou), and to the scholars and adherents who read them. Whether their picture of the world is true is left to each reader.
  - **Words and the Way.** The *Daodejing* opens, in one translation, "The Tao that can be trodden is not the enduring and unchanging Tao." According to this text, *Dao* (the Way, the course of things) is {{ not captured by any fixed name or description }}, and a name cuts the world into pieces the Way does not respect.
  - ***De*, *wu wei*, *ziran*.** *De* is the inner power or "virtue" a being gets from the Dao; *ziran* is "so of itself", spontaneity or naturalness; *wu wei* is {{ effortless, non-forcing action, acting without tampering with the flow of things }}, not doing nothing.
  - **Two views of fixed categories.** According to the *Analects*, order comes from roles and ritual that name what each person owes. According to the Daoist texts, as scholars read them, fixed names and norms can {{ harden into rigid distinctions that distort how things really go }}. They are rival diagnoses, and each side has replies.
  - **Zhuangzi's stories, read two ways.** In the butterfly dream, Zhuang Zhou wakes unsure whether he is a man who dreamed a butterfly or a butterfly dreaming a man. A *skeptical* reading takes it as doubt about how sure any viewpoint can be; a *transformation* reading takes it as {{ the fluid passing of one thing into another, to be met calmly }}. Cook Ding's knife, kept sharp for nineteen years by following the animal's natural openings, shows skill that works with the grain; the useless tree, safe because of no use to carpenters, shows that usefulness is a human measure.
  - ***Daojia* and *daojiao*.** *Daojia* ("school of the Dao") is a label made by the historian Sima Tan in the second century BCE for early thinkers such as Laozi and Zhuangzi; *daojiao* ("teaching of the Dao") names the organised religion from the second century CE on, with the {{ Celestial Masters, temples, ritual and alchemy aimed at long life }}. Many scholars now hold that splitting "philosophy" from "religion" reflects Western categories more than Daoism itself.
  - **Three layers.** Established: the texts, their manuscripts (Guodian, about 300 BCE; Mawangdui, sealed 168 BCE) and the history of the Celestial Masters. Debated: whether Laozi lived at all, how the *Daodejing* was composed, and how to read Zhuangzi's skepticism. Faith or value: that living by the Way, with less forcing, is wise.

cards:
  - type: mcq
    id: hook
    title: "Guess: does a name spoil what it names?"
    prompt: |
      Guessing is the point; no background is needed. Think of a river. You call it "the river", but the water in it is never the same twice, and no single word or photo holds all of it. An early Chinese book begins by saying something striking about words and the deepest reality. Which is the most reasonable first guess?
    options:
      - text: "The deepest reality cannot be fully captured in words or fixed names."
        correct: true
        feedback: |
          A good guess: the book is the *Daodejing*, and its first line is about exactly this. Be careful with the next step: it does not say words are useless, only that they fall short of what they point at.
      - text: "Words capture reality completely, so naming everything is the way to understand it."
        feedback: |
          Many thinkers held something like this, and we met that confidence in other lessons. This book opens with the opposite warning.
      - text: "Reality is made of words."
        feedback: |
          Some modern philosophers say something like this, but it is not the claim of this early book, which treats words as the thin layer and the Way as what they fail to reach.
    explanation: |
      This lesson follows the *Daodejing* and the *Zhuangzi*, taught according to those texts and the scholars who read them. Whether the Way exists is a question of metaphysics and faith that each reader weighs.

  - type: text
    id: laozi
    title: "Two books and a legend"
    image:
      src: img/laozi.webp
      alt: "Ink and light-color painting of an old bearded man in loose robes riding an ox, holding a scroll."
      caption: "Laozi riding an ox through the border pass, by the Ming painter Zhang Lu (active around 1500, dates given variously); it illustrates a legend that is much later than any book, so it shows how later centuries pictured him."
      credit: "Zhang Lu, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Zhang_Lu-Laozi_Riding_an_Ox_(cropped).jpg"
    body: |
      The *Daodejing* (also spelled *Tao Te Ching*, "Classic of the Way and of Virtue") is a short book of 81 brief chapters in two parts. Tradition attributes it to **Laozi** ("Old Master"). According to the historian Sima Qian (about 145 to 86 BCE), Laozi was leaving the western border when a gatekeeper named Yin Xi asked him to write down his teaching; he wrote a book of about five thousand characters and was never seen again. Tradition places him in the sixth century BCE, as an elder of Confucius.

      Scholars see it differently. The Stanford Encyclopedia of Philosophy reports that some modern scholars consider Laozi entirely legendary, and that the sayings were probably written down from the later fifth century BCE, gathered in the fourth, and settled by the mid third century BCE. The oldest manuscripts are strips from a tomb at Guodian, dated to about 300 BCE, and silk copies from Mawangdui, sealed in 168 BCE.

      The second book is the *Zhuangzi*, named for **Zhuang Zhou** (Zhuangzi, "Master Zhuang"), who flourished in the later fourth century BCE. Only the first seven chapters, the "Inner Chapters", are attributed to the period of his own lifetime, and even his authorship of them is a hypothesis.

  - type: mcq
    id: laozi-q
    title: "What can be claimed about Laozi?"
    prompt: |
      A teacher says, "Laozi, a contemporary of Confucius, wrote the *Daodejing* in the sixth century BCE." According to the scholarship just described, which reply is the most careful?
    options:
      - text: "That is the traditional account; some scholars doubt that Laozi existed, and the book itself seems to have been gathered over the fifth to third centuries BCE."
        correct: true
        feedback: |
          Right. Layer 1: the book and its early manuscripts exist. Layer 2: whether there was a historical Laozi and how the text grew. The tradition's own account is worth stating as the tradition's.
      - text: "False: the book was written in the Han dynasty by Confucians."
        feedback: |
          The Guodian strips, from a tomb of about 300 BCE, already contain material matching parts of the book, so it is older than that.
      - text: "True: archaeology has confirmed the sixth-century author."
        feedback: |
          The manuscripts are from about 300 BCE and later. They do not show who the author was or when he lived.
    explanation: |
      The pattern repeats from the lesson on Confucius: the safe claim is about the text, and the person behind it is a live debate.

  - type: text
    id: opening
    title: "The first line"
    body: |
      Here is the opening of the *Daodejing* in James Legge's 1891 translation:

      > "The Tao that can be trodden is not the enduring and unchanging Tao. The name that can be named is not the enduring and unchanging name."

      Another standard translation puts the first line as "The Way that can be spoken of is not the constant Way". *Dao* (道, spelled *Tao* in older books) literally means "road" or "way". Legge's word "trodden" keeps that picture of a path; "spoken of" keeps the picture of words. The text does not stop at the opening: it goes on to praise what words leave out, and in chapter 2 it says existence and non-existence "give birth the one to (the idea of) the other" (Legge), that is, each is understood only through the other.

  - type: mcq
    id: opening-q
    title: "What is the first line claiming?"
    prompt: |
      Recall the line: the Way that can be spoken of is not the constant Way, and the name that can be named is not the constant name. According to a common reading of this text, what is the claim about language?
    options:
      - text: "Any fixed description of the Way leaves something out, so words point toward it without exhausting it."
        correct: true
        feedback: |
          Yes. Note the irony the text itself uses: it says this in words. Defenders reply that a signpost can point at a place without being the place.
      - text: "Nothing at all can be said about the Way, so the book should have been silent."
        feedback: |
          If that were the claim, the book would be self-defeating, and a critic presses exactly this. Defenders answer that the book gives images (water, the uncarved block) as pointers, not definitions.
      - text: "Names are bad, and people should stop using language."
        feedback: |
          The text criticises taking a name for the whole thing, but it still uses names throughout.
    explanation: |
      Where thoughtful people part ways: a critic asks whether a book can say "words fail" without contradiction; a defender says the claim concerns *constant* names, fixed once and for all, not every use of language. The theme also appears in the lesson Saying What God Is Not, where some Western theologians reach for similar limits on speech about God.

  - type: text
    id: terms
    title: "Four words to carry"
    body: |
      ***Dao*** (道): the Way, the course along which things go, which the book treats as the source and pattern of the world. Whether this is a deity, a principle or a process is read differently by different interpreters.

      ***De*** (德): usually "virtue", but also "potency" or "integrity"; in the book it is the inner power a being receives from the Dao.

      ***Ziran*** (自然): "so of itself", usually "naturalness" or "spontaneity": things happening by their own nature, without anyone forcing them.

      ***Wu wei*** (無為): literally "no doing". Scholars stress that it does not mean total inaction; the Internet Encyclopedia of Philosophy renders it as "effortless action" or "non-willful action", acting without tampering with the flow of reality. In Legge's rendering, "The Tao in its regular course does nothing (for the sake of doing it)" (chapter 37). Water is the book's favourite image: chapter 8 says "The highest excellence is like (that of) water", which yields and benefits all things.

  - type: mcq
    id: wuwei-q
    title: "What does wu wei mean?"
    prompt: |
      A friend says, "Daoists teach wu wei, so they teach lying on the couch and doing nothing." According to the scholars above, what is the best reply?
    options:
      - text: "Wu wei is acting without forcing or self-serving striving, as water follows its course; it is effortless action, not idleness."
        correct: true
        feedback: |
          Yes. A good picture is a skilled swimmer who moves with the current rather than against it: much happens, with little strain.
      - text: "Your friend is right: wu wei means to do nothing at all."
        feedback: |
          This is the most common translation slip ("non-action"). The scholarly renderings are "effortless" or "non-coercive" action, and the book's own sages govern and teach.
      - text: "Wu wei means obeying every order from the ruler."
        feedback: |
          Nothing in the idea says this; it concerns the manner of acting, not obedience.
    explanation: |
      A critic replies that "effortless" can sound like an excuse for neglect, and that a state cannot be run on spontaneity. Defenders answer that the book aims its advice at rulers who over-regulate, and that the sage's restraint is a skill, not laziness.

  - type: mcq
    id: contrast
    title: "Roles or spontaneity?"
    prompt: |
      Recall the lesson on Confucius: the *Analects* teaches roles and ritual, such as "let the ruler be a ruler, the subject a subject, a father a father, and a son a son". The Daoist texts, read by scholars, are often more wary of fixed norms and distinctions. Which statement fairly sets out the disagreement?
    options:
      - text: "Confucian texts build order by training people in named roles and rituals; Daoist texts worry that rigid names and norms distort the natural course and breed strife, and prefer responding to the situation as it is."
        correct: true
        feedback: |
          A fair summary of two rival diagnoses. Both are about how to live, and each answers the other: Confucians say that without trained roles people lack direction; Daoists say that over-regulation is the problem, not the cure.
      - text: "The Confucians believe in a god and the Daoists do not."
        feedback: |
          Neither side is defined by that. Confucian texts speak of Heaven (*Tian*) in a moral way, and Daoism later developed gods and temples. The disagreement here is about norms and names.
      - text: "Daoists reject all morality and say anything goes."
        feedback: |
          That is a caricature. The *Daodejing* praises kindness, modesty and restraint; what it doubts is that fixed rules produce goodness.
    explanation: |
      Layer 2 (debate) and layer 3 (value). Whether natural responsiveness or trained roles gives a better life is not settled by texts alone. It depends on what one thinks about human nature and on what one wants from a society.

  - type: text
    id: butterfly
    title: "Zhuangzi: the butterfly"
    image:
      src: img/zhuangzi-butterfly.webp
      alt: "Brush drawing of a seated man dozing under a tree while a butterfly flies near."
      caption: "Zhuangzi dreaming of a butterfly, painted by the Japanese artist Ike no Taiga (1723 to 1776): the story kept inspiring artists long after its composition."
      credit: "Ike no Taiga, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Zhuangzi-Butterfly-Dream.jpg"
    body: |
      The *Zhuangzi* is written as stories, jokes and dialogues. The best known comes at the end of chapter 2. In Herbert Giles's translation it begins:

      > "Once upon a time, I, Chuang Tzŭ, dreamt I was a butterfly, fluttering hither and thither,"

      and goes on that, on waking, he did not know whether he had been

      > "a man dreaming I was a butterfly, or whether I am now a butterfly dreaming I am a man."

      In another standard rendering the passage ends by saying there must be some distinction between Zhuang Zhou and the butterfly, which it calls a "transformation of things".

  - type: mcq
    id: butterfly-q
    title: "Two readings of the dream"
    prompt: |
      Scholars read the butterfly dream in at least two ways. Reading A: it shows doubt, since from inside a viewpoint you cannot be certain it is the real one. Reading B: it shows transformation, since a being passes into another form, and the wise person meets such change calmly. Which test best separates the readings?
    options:
      - text: "The closing sentence about a distinction and a transformation of things fits B more directly; A stresses the opening doubt, so the dispute is over which part carries the point."
        correct: true
        feedback: |
          Yes. Both readings use the text; they weight different lines, and the scholarly article on Zhuangzi treats his skepticism as a live debate (some favour a mild skepticism that still lets us act).
      - text: "Reading A is right because the dream proves we cannot know anything."
        feedback: |
          A story cannot prove that. Even the skeptical reading is usually moderate: doubt about one's viewpoint, not about everything.
      - text: "Only reading B is allowed, since the text mentions transformation."
        feedback: |
          Allowed by the words, yes; but nothing in the text forbids A, and readers have held it for centuries.
    explanation: |
      This is the course habit: two readings, each with textual support, and a clear sense of what decides between them. The dream is not an argument; it is a story that provokes both a doubt and an attitude to change.

  - type: text
    id: ding
    title: "Cook Ding and the useless tree"
    body: |
      Two more stories from the *Zhuangzi*. In chapter 3 a cook cutting up an ox for a prince explains his skill. In Giles's translation, he says he has had the chopper nineteen years and cut up many thousand bullocks, and that now

      > "I work with my mind and not with my eye. I follow such openings or cavities as there may be, according to the natural constitution of the animal."

      The blade finds the gaps, so it never dulls. The prince concludes that he has learned how to nourish life.

      In chapter 1 (Giles) a giant tree is called useless by a carpenter, but there it would be safe from the axe, for

      > "being of no use to others, itself would be free from harm."

      Notice how the two stories pull in different directions: the cook is admired for great skill, the tree for having none.

  - type: mcq
    id: ding-q
    title: "What do these stories teach?"
    prompt: |
      Reading A of Cook Ding: skill comes from long practice until action flows without strain, so *wu wei* is trained, not lazy. Reading B of the useless tree: the point is that human usefulness is only one measure, and a thing can have worth outside it. Which pair of objections is fair, one to each reading?
    options:
      - text: "To A: nineteen years of practice is the opposite of spontaneity. To B: a tree safe from the axe is safe only by luck, and the same story could teach hiding from duty."
        correct: true
        feedback: |
          Yes, and each has a reply: for A, defenders say the skill becomes so absorbed that effort no longer shows, which is the point; for B, they say the story questions what we count as useful, rather than urging retreat. Stories like these resist one final reading.
      - text: "To A: the cook was a butcher, so the story is about food. To B: trees do not talk."
        feedback: |
          These miss the point. Both stories are parables, and what matters is the lesson drawn.
      - text: "No objection can be made to either reading."
        feedback: |
          Any reading of a short parable has fair objections. Seeing them is how you tell understanding from agreement.
    explanation: |
      Both stories fit the text's wider theme: do not force things against their grain. Whether they recommend retreat from social life, as the tree might suggest, or skilled engagement within it, as the cook suggests, is a live question among readers.

  - type: mcq
    id: names
    title: "Why would a fixed category mislead?"
    prompt: |
      Daoist texts suggest that fixed names carve the world into sharp categories (useful and useless, right and wrong, this and that) when things shade into each other. A modern parallel: colours form a smooth range, yet a word like "red" draws a line. Recall the lesson Emptiness: Nagarjuna, where a Buddhist thinker argued that things have no fixed own-nature. Which claim fairly compares the two?
    options:
      - text: "Both warn against treating our categories as if they were fixed features of the world, though they come from different traditions with different aims and arguments."
        correct: true
        feedback: |
          Fair. Parallels are suggestive, not proof of influence or agreement: the two traditions use different texts, terms and goals, and scholars warn against merging them.
      - text: "Nagarjuna was a Daoist, so the two are the same view."
        feedback: |
          Nagarjuna belongs to the Indian Buddhist tradition. Buddhism later met Daoism in China, but the two are distinct.
      - text: "Neither says anything about categories."
        feedback: |
          Both do: that is why the comparison is interesting.
    explanation: |
      A scientist will add that categories can be useful because they are conventions: a line drawn in a smooth range is still a tool. Daoist texts, on the common reading, warn against forgetting that it is a tool. That is a point about attitude, not a claim that sorting is impossible.

  - type: text
    id: religion
    title: "Philosophy or religion?"
    body: |
      Look at the label. According to the Internet Encyclopedia of Philosophy, ***daojia*** ("school of the Dao") was a term made by the historian Sima Tan in the second century BCE to group earlier writings; the article calls it a retroactive grouping. ***Daojiao*** ("teaching of the Dao") names the religious movements from the second century CE on.

      The first of these was the Way of the Celestial Masters, credited to Zhang Daoling around 142 CE, after a revelation attributed to Laozi, who came to be worshipped as divine. Later came alchemy: Ge Hong (283 to 343 CE) experimented with substances such as cinnabar in pursuit of immortality, and meditation schools turned alchemy inward. Wang Zhe (1113 to 1170 CE) founded the Quanzhen ("Complete Perfection") school with monasteries.

      Some older scholars called the religion a decline from a purer philosophy. Later scholars argue this overlooks links between the classical texts and the later practice, and that the split reflects Western categories more than Daoism itself. Daoists themselves, the article notes, have been less interested in the split than modern Western scholars.

  - type: mcq
    id: religion-q
    title: "Two readings of one tradition"
    prompt: |
      Reading P: "Real Daoism is the philosophy of Laozi and Zhuangzi; the temples and alchemy are a later corruption." Reading R: "Daoism is one tradition in which the books, ritual and long-life practice belong together." According to the scholarship above, which comment is fairest?
    options:
      - text: "P was common among earlier scholars; many recent ones prefer R, because the classical texts were read and used within the religious tradition, and the philosophy/religion split is a Western category."
        correct: true
        feedback: |
          Yes. A defender of P can reply that the early texts contain little ritual or cosmology, which is a real point; the choice depends partly on what one means by "religion".
      - text: "P is established fact and R is mere opinion."
        feedback: |
          Both are interpretations. The fact is the history; how to describe it is the debate.
      - text: "Neither can be held: the tradition has no texts."
        feedback: |
          The texts exist and are well attested; this is exactly what the debate is about.
    explanation: |
      Adherents mostly see one living tradition of teaching and practice, and treat the question differently from Western scholars. Presenting only P or only R would be unfair to one side.

  - type: mcq
    id: layers
    title: "Sort the claims"
    prompt: |
      Mark every claim that belongs to layer 1, established fact (texts and history), rather than debate or faith.
    multiple: true
    options:
      - text: "Silk manuscripts of the *Daodejing* were found at Mawangdui in a tomb sealed in 168 BCE."
        correct: true
        feedback: |
          Yes: an archaeological fact, as reported by the Stanford Encyclopedia of Philosophy.
      - text: "Zhang Daoling is credited with founding the Celestial Masters movement around 142 CE."
        correct: true
        feedback: |
          Yes, as a historical statement about what the tradition credits and when it arose (the date is approximate).
      - text: "A man called Laozi wrote the whole *Daodejing* in the sixth century BCE."
        feedback: |
          Debated: some scholars consider Laozi legendary, and the text seems to have grown over generations.
      - text: "The butterfly dream shows that we cannot know anything."
        feedback: |
          An interpretation, and a strong one, not a fact about the text.
      - text: "Living with less forcing, like water, is the wise way to live."
        feedback: |
          Layer 3: a commitment of value.
    explanation: |
      Keeping the layers apart is the method: a manuscript is not a biography, a reading is not a fact, and a way of life is not a proof.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** Whether a book can say that words fail without contradicting itself; whether fixed roles or natural responsiveness gives a better life; whether Zhuangzi's stories teach doubt, calm acceptance of change, or both; whether Daoism is a philosophy, a religion, or a tradition where that split does not apply. The reasons are different premises about language and human nature, and different values.

      **Next:** the lesson Jainism and Nonviolence turns to India again, to a tradition for which not harming any living thing is the first duty, and which holds that the truth about things has many sides.
