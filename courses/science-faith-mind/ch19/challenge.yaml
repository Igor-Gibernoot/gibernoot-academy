id: ch19-challenge
title: "Level Challenge: Four Answers to One Question (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: a label, a test and a death"
    body: |
      Problems 1 to 3 use **invented** traditions, readers, surveys and numbers, built to practise on cases you have never seen; nothing in them is a claim about a real community or a real study. Where a real scholar or text appears, it is named as "according to ...".

      - **Problem 1 · A tradition found in a valley.** Does the word "religion" fit, which claims are fact, and what a language test of a manuscript can and cannot show.
      - **Problem 2 · A reader of sealed letters and a saying.** A blind matching test with numbers, then one saying read in two ways.
      - **Problem 3 · Four claims about death and a town survey.** Which view of the person each claim needs, and what a count can show.

      **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. Each problem ends by asking where thoughtful people part ways and why. Problems 4 and 5 (a debate over a possible Zoroastrian influence, the history of Shinto, and the weighing of the whole level) come in part 2.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      Five tools from the level, each stated so it can be used alone.

      - **"Religion" as a word.** According to Wilfred Cantwell Smith (*The Meaning and End of Religion*, 1962), "religion" is a late European habit of treating a way of life as a thing; he proposed "faith" (a person's own response) and "cumulative tradition" (the public record of practices, texts and teachings) instead. Kwame Anthony Appiah holds that the word is still needed if used with care. Many traditions have no creed, founder or word for "religion".
      - **Dating by language.** Isaac Casaubon (1614) argued from the Greek that the Hermetic writings belong to the early Christian centuries and not to remote antiquity. A word or form that cannot be older than some date sets a lower limit on the date of any text that uses it.
      - **Chance in a matching test.** If each of $n$ trials is guessed with probability $p$ of success, the expected hits are $np$ and the typical spread is $\sqrt{np(1-p)}$. In Carlson's double-blind test of astrology (*Nature*, 1985) the astrologers' matches were reported as no better than chance, though others disputed the design.
      - **One saying, two readings.** Scholars read the Analects as a virtue ethics (it trains traits such as *ren*, *shu*) or, with Roger Ames and Henry Rosemont, as a role ethics (a person is the roles lived in relations).
      - **Four answers on death.** Judaism and Christianity: God will raise the dead. Hindu thought (Vedanta): the self (*atman*) is reborn through karma until release. Buddhism: no self, a causal stream is reborn through karma. All answer first what a person is.

  # ---------------- Problem 1 ----------------
  - type: text
    id: p1-setup
    title: "Problem 1 · The Orrin way"
    body: |
      **Problem 1.** An invented valley. Visitors report a people, the Orrin, who tend 14 springs, mark each new year at the first thaw and speak to the dead of the valley when they pass a certain stone. They have no founder, no creed and no priests; teaching passes in the family. They have no word that translates "religion": the nearest, *orra*, means "the way we keep the water". A scholar newly arrived finds a bundle of leaves, the *Kettle Leaves*, which the elders say were written "in the year 1200, in the time of the first keeper".

      The task: decide what a careful reader may say about the label, sort the claims by layer, and test the date.

  - type: mcq
    id: p1-label
    title: "Does 'religion' fit?"
    prompt: |
      A newspaper headline calls the Orrin "the oldest religion of the valley". An Orrin elder says: "We do not have a religion; we keep the water." According to Smith and to Appiah, what is the fairest reading of this exchange?
    options:
      - text: "The word is a tool with a European history. It may fit or distort here, and that has to be tested for these people, listening to how they describe their own way of life, and not settled by the headline or by the elder alone."
        correct: true
        feedback: |
          Yes. Smith warns that "religion" can turn a way of life into a thing with doctrines; Appiah holds that the word, used carefully, still does useful work. Both ask for care with the particular case.
      - text: "The elder is simply wrong: any group that speaks to the dead has a religion, by definition."
        feedback: |
          That settles the question by fixing a definition in advance. Scholars do not agree on one definition, and the elder's view is itself evidence to weigh.
      - text: "The headline is false, because a religion needs a creed and the Orrin have none."
        feedback: |
          That makes a creed necessary, which is a feature of some traditions (many Christian ones) and not of all. The next card asks which premise this move hides.
    explanation: |
      Label: **debate**. Scholars part on whether the word travels, not on what the Orrin do. The practices reported are layer 1 (as far as the visitors are reliable); whether they are "a religion" is layer 2.

  - type: mcq
    id: p1-premise
    title: "Which premise is hidden?"
    prompt: |
      An argument: "The Orrin have no creed. A tradition with no creed is not a religion. So the Orrin have no religion." The step is valid. Which premise would a critic reject, and why?
    options:
      - text: "The second: it assumes that a creed is necessary for a religion. That shape comes from the history of some traditions, and a critic can point to others, such as Shinto, where practice and ritual matter more than doctrine."
        correct: true
        feedback: |
          Yes. The validity is fine; the truth of the second premise is the issue. The course has met several traditions where practice leads and belief follows.
      - text: "The first: it is false that the Orrin have no creed, because everyone believes something."
        feedback: |
          Everyone holds beliefs, but a creed is a stated list of required doctrines. The report says there is none, and the story gives no reason to doubt it.
      - text: "The argument is invalid, because the conclusion does not follow from the premises."
        feedback: |
          It follows. Given both premises, the conclusion is forced; the weakness is in the second premise, not in the step.
    explanation: |
      The same check applies to the opposite move, "they speak to the dead, so they have a religion": it hides the premise that speaking to the dead is what makes a religion. Either way the argument is only as strong as the definition it smuggles in.

  - type: mcq
    id: p1-layers
    title: "Sort the claims by layer"
    multiple: true
    prompt: |
      Four claims about the Orrin. Select all that are **layer 1** (established, as far as the visitors' reports hold) and not a debate or a faith claim.
    options:
      - text: "The Orrin tend 14 springs and mark the first thaw."
        correct: true
        feedback: |
          Yes: a reported practice, which another visitor can check.
      - text: "The Orrin have no word that translates 'religion'; the nearest, orra, glosses as 'the way we keep the water'."
        correct: true
        feedback: |
          Yes: a report of language, which a linguist can check, even if how to translate is itself debatable.
      - text: "The Orrin are not really a religion, only a culture."
        feedback: |
          This is a classification, layer 2: it depends on a definition of religion that scholars dispute.
      - text: "The valley's dead hear the Orrin when they pass the stone."
        feedback: |
          This is a faith claim, layer 3. That the Orrin believe it, and say so, is layer 1; that it is true is not settled by the report.
    explanation: |
      Notice the difference between "the Orrin say the dead hear them" (layer 1, a report of belief) and "the dead hear them" (layer 3). A careful scholar keeps the first and, as the course does with every tradition, leaves the second to the reader.

  - type: numeric
    id: p1-date
    title: "How much later than the claim?"
    prompt: |
      The elders say the *Kettle Leaves* were written in the year 1200. A linguist notes that the leaves use the word *marro*, "iron pot", seven times, and that *marro* is known from other dated sources to have entered the valley's speech no earlier than the year 1480. At least how many years later than the elders' date must the leaves have been written?
    answer: 280
    tolerance: 0.5
    answerText: '280'
    wrong:
      - { value: 2680, feedback: 'That adds the two years. Both are dates on the same calendar, so the gap is a subtraction.' }
    hint: A word cannot be used before it exists; subtract the claimed year from the earliest year of the word.
    explanation: |
      $1480 - 1200 = 280$ years. The word gives a **lower limit**: the leaves cannot be older than 1480, so the claim "1200" fails unless a later copyist changed the wording. This is Casaubon's kind of reasoning.

  - type: mcq
    id: p1-dating
    title: "What dating shows, and what it does not"
    prompt: |
      The linguist's result puts the *Kettle Leaves* in 1480 or later. A student concludes: "So the teaching in them is only 540-odd years old at most, and the elders' claim of a first keeper is false." What is the fair reply?
    options:
      - text: "The result dates this **written copy** (or its wording). It does not date the teaching, which may have been passed on by speech and put in writing late, and it does not show the elders were wrong about a first keeper. It does show that the leaves cannot be a witness from the year 1200."
        correct: true
        feedback: |
          Yes. Casaubon showed that the Hermetic texts were written in late antiquity, which did not by itself decide what they contain or whether their ideas were old. The same limit applies here.
      - text: "Dating by language is unreliable, so it tells us nothing about the leaves."
        feedback: |
          Dating by language is a respected method; one dated word sets a firm lower limit. Its limits are the ones in the correct reply, not that it fails.
      - text: "If a late word appears, the whole text is a forgery."
        feedback: |
          A later copyist may have modernised the wording of an older text. "Late" is not the same as "fake".
    explanation: |
      Label: layer 1 for the date of the wording; layer 2 for what it means for the teaching (oral transmission and later redaction are debated for many texts); layer 3 if one insists the leaves must be ancient because the tradition is sacred.

  - type: order
    id: p1-order
    title: "Casaubon's kind of argument"
    prompt: "Put a dating-by-language argument, applied to the *Kettle Leaves*, in a sound order."
    steps:
      - "Find a word or form in the text (here, marro) that appears in it."
      - "Find independent, dated sources that show when that word entered use (no earlier than 1480)."
      - "Conclude that the wording cannot be older than that date: a lower limit."
      - "Ask whether a later copyist could have updated the wording of an older text."
      - "State only what follows: this copy or wording is from 1480 or later; the age of the teaching stays open."
    hint: Evidence first, then the limit, then the objection, then the careful claim.
    explanation: |
      The fourth step keeps the argument honest. A language test sets a floor for the writing, never a ceiling for the ideas.

  - type: mcq
    id: p1-weigh
    title: "Weighing Problem 1"
    prompt: |
      A scholar who follows Smith, one who follows Appiah and a visiting journalist look at the Orrin and their leaves. Where do thoughtful people part ways, and why?
    options:
      - text: "On the **word** (a premise about what a religion must have, and whether a European word fits) and on **what a late date shows** (a premise about how teaching passes). The reports and the linguist's lower limit are agreed."
        correct: true
        feedback: |
          Yes. The facts (practices, the word marro, the limit of 1480) are shared; the disagreement is about definitions and about what a date says about content.
      - text: "On whether the Orrin tend 14 springs."
        feedback: |
          That is a report, checkable and agreed.
      - text: "On whether marro is a word."
        feedback: |
          Everyone grants that. The dispute is about what its date shows.
    explanation: |
      Label: layers 1 and 2; layer 3 enters only if someone treats the claim "the dead hear the Orrin" as settled by the scholarship, in either direction.

  # ---------------- Problem 2 ----------------
  - type: text
    id: p2-setup
    title: "Problem 2 · A reader of sealed letters"
    body: |
      **Problem 2.** An invented test. A reader, Ismene, claims that she can sense a person's temperament from a sealed letter written by them. There are 4 temperament profiles, equally common. In a double-blind test (the person handling the letters and the person scoring the results do not know which letter belongs to which profile), 96 sealed letters are given to her one at a time, and for each she names one of the 4 profiles. She names the right one for **33** of the 96.

      The task: say what chance alone would give, how far 33 is from it, what the result supports, and then read one saying of the Analects in two ways.

  - type: numeric
    id: p2-mu
    title: "The expected hits"
    prompt: |
      If Ismene is only guessing, each letter has probability $1/4$ of being right. Among 96 letters, what number of right matches would she get on average?
    answer: 24
    tolerance: 0.01
    answerText: '24'
    wrong:
      - { value: 33, feedback: 'That is what she actually scored. The question is the average for a pure guess.' }
    hint: Each of the 96 guesses has a one-in-four chance.
    explanation: |
      $\mu = np = 96 \times \tfrac14 = 24$ right matches on average under guessing.

  - type: numeric
    id: p2-sigma
    title: "The typical spread"
    prompt: |
      Under pure guessing the number of right matches among 96 letters, each right with probability $1/4$, varies from one run to the next. Using the spread formula from the toolkit, what is the typical spread, to one decimal?
    answer: 4.2
    tolerance: 0.05
    answerText: '4.2'
    wrong:
      - { value: 18, feedback: 'That is $np(1-p)$, the quantity under the square root. The spread is its square root.' }
    hint: $\sqrt{np(1-p)}$ with $n = 96$, $p = 1/4$.
    explanation: |
      $\sigma = \sqrt{96 \times \tfrac14 \times \tfrac34} = \sqrt{18} \approx 4.24$. A result of 33 is $33 - 24 = 9$ above the average, which is about $9/4.24 \approx 2.1$ spreads.

  - type: mcq
    id: p2-support
    title: "What does 33 support?"
    prompt: |
      By exact count, the chance that pure guessing gives 33 or more right matches among 96 is about 0.025. Ismene's supporters say "she beat chance". A sceptic says "one run is not enough". What is the fair statement of what this single result supports?
    options:
      - text: "A result this high would be unusual under pure guessing (about one run in forty), so it is a reason to test again under the same design. It does not show that she senses temperament, since chance has not been ruled out as a possible cause and other explanations (leaks, luck, a flaw in the design) remain."
        correct: true
        feedback: |
          Yes. The honest wording is that guessing alone is a somewhat unlikely explanation, so the result invites a repeat, not a verdict.
      - text: "It proves she senses temperament, because 0.025 is below 0.05."
        feedback: |
          A small chance under guessing does not prove a specific alternative. Other explanations, including undetected cues in the letters, can also produce it.
      - text: "It shows nothing at all, because 33 is not exactly 24."
        feedback: |
          Results are never exactly the average. How far a result is from it, in units of spread, is the point; here it is about 2.1 spreads, which is unusual.
    explanation: |
      Label: layer 1 for the count and the chance; layer 2 for what the result means; layer 3 if one insists either that such powers must exist or must not. The same habit as in the study of Carlson's astrology test: a design is judged before its result is.

  - type: numeric
    id: p2-many
    title: "Twenty readers"
    prompt: |
      A town fair invites 20 different readers, who all guess blindly on 96 letters each, independently of each other. For one blind guesser, the chance of reaching 33 or more right is 0.0253. What is the chance that **at least one** of the 20 reaches 33 or more, to two decimals?
    answer: 0.4
    tolerance: 0.01
    answerText: '0.40'
    wrong:
      - { value: 0.0253, feedback: 'That is the chance for one reader. With 20 readers there are 20 chances.' }
      - { value: 0.506, feedback: 'That is 20 times 0.0253, which adds the chances as if they could not overlap. The correct way is to find the chance that nobody reaches 33 and subtract it from 1.' }
    hint: Work out the chance that all 20 miss, then take one minus that.
    explanation: |
      Each blind guesser misses the mark with probability $1 - 0.0253 = 0.9747$. All 20 miss with probability $0.9747^{20} \approx 0.60$, so at least one reaches it with probability $1 - 0.60 \approx 0.40$. A "striking" result found among many tries is much less striking than one named in advance.

  - type: mcq
    id: p2-design
    title: "What a fair design needs"
    multiple: true
    prompt: |
      Ismene's supporters say the test was fair; others disagree. Which design points make a result like 33 more informative? Select all that apply.
    options:
      - text: "She, and the person who scores, do not know the right answers while she chooses (double-blind)."
        correct: true
        feedback: |
          Yes. Otherwise a hint, even an unconscious one, can pass from the handler to the reader.
      - text: "The pass mark is written down **before** the test, and the letters are the same kind of object for every trial."
        correct: true
        feedback: |
          Yes. A pass mark chosen after seeing the result can always be set to make the result look good.
      - text: "The letters are in the handwriting of friends of hers, so she knows what to expect."
        feedback: |
          That gives her information about the people, which makes a score above chance possible without any special power.
      - text: "Only her best-scoring run out of several is reported."
        feedback: |
          Reporting only the best run hides how often she scored lower; it is the same flaw as the twenty readers above.
    explanation: |
      A claim that a design is fair, as with Carlson's test where some astrologers said theirs was not, is part of the debate itself. Agreeing on the design before the result is how both sides can accept it.

  - type: mcq
    id: p2-saying
    title: "One saying, two readings"
    prompt: |
      Take the saying, in essence, "What you do not want done to yourself, do not do to others" (the Analects, in the passage often glossed as *shu*, reciprocity). According to one reading (virtue ethics, as Tiwald presents it), what is the saying mainly doing? According to the other (role ethics, as Ames and Rosemont argue), what is it doing?
    options:
      - text: "Virtue reading: it names a **trait of character** to cultivate, a habit of considering others. Role-ethics reading: it guides how to carry out **the roles one lives in** (parent, child, ruler, friend), since a person is constituted by those relations."
        correct: true
        feedback: |
          Yes. Both readings take the saying seriously; they differ on what the basic unit of ethics is, a person's traits or a person's roles in relations.
      - text: "Virtue reading: it is a rule backed by punishment. Role-ethics reading: it is advice about food."
        feedback: |
          Neither reading says this. The saying is a principle of conduct; the two readings differ in what they treat as the foundation.
      - text: "Both readings say it is a theory of God's commands."
        feedback: |
          The saying is not tied to a command of a deity in either reading. The debate is about persons, traits and roles.
    explanation: |
      Label: **debate**. Scholars part on whether "virtue ethics" or "role ethics" is the fairer label for the Analects; Ames and Rosemont themselves resist fitting it into a familiar Western category.

  - type: mcq
    id: p2-test
    title: "What would favour one reading?"
    prompt: |
      Suppose a passage showed Confucius giving **different** advice to two disciples who ask the same question, depending on their positions. Which reading does it, taken alone, favour more, and what keeps it from settling the matter?
    options:
      - text: "It favours the role reading somewhat, since advice follows the person's roles; but a virtue theorist replies that a good teacher also tailors advice to each pupil's traits, so one passage does not decide it."
        correct: true
        feedback: |
          Yes. A single passage fits both readings with a small adjustment, which is why the debate persists. It takes patterns across many passages, and the whole text, to weigh them.
      - text: "It proves the virtue reading wrong."
        feedback: |
          A virtue theorist can accommodate the passage, so it does not prove anything wrong.
      - text: "It shows the Analects has no ethics at all."
        feedback: |
          Different advice for different people is a mark of an ethics attentive to persons, not the absence of one.
    explanation: |
      This is a hypothetical test, to practise asking what would count as evidence, not a claim about a particular passage.

  - type: mcq
    id: p2-weigh
    title: "Weighing Problem 2"
    prompt: |
      A believer in Ismene's gift, a sceptic and a statistician review the sealed-letter test, and two scholars argue about the saying. Where do thoughtful people part ways, and why?
    options:
      - text: "On the **test**: what counts as a fair design and how strong a result must be before it is believed, which are choices about standards of evidence; and on the **saying**: whether the basic unit is a person's traits or roles, which is a premise about what ethics is about. The arithmetic (24, 4.2, 33, 0.40) is agreed."
        correct: true
        feedback: |
          Yes. The numbers are shared. The disagreement is about standards of evidence and about premises, not about a calculation.
      - text: "On whether 96 times one quarter is 24."
        feedback: |
          That is arithmetic and agreed.
      - text: "On whether the Analects exists."
        feedback: |
          Everyone grants that. The dispute is how to read it.
    explanation: |
      Label: layers 1 and 2 for the test; layer 2 for the saying; layer 3 would enter if someone held that any test of such a power must succeed or must fail before it is run.

  # ---------------- Problem 3 ----------------
  - type: text
    id: p3-setup
    title: "Problem 3 · Four claims about death"
    body: |
      **Problem 3.** An invented town of 800 adults, Hallow Reach, takes a survey with one question: "What do you think happens to a person at death?" The town has a Jewish congregation, a Christian church, a Vedanta study circle and a Buddhist meditation group. The task: match each claim about death to the view of the person it needs, check one chain, read the survey and sort the claims by layer.

  - type: mcq
    id: p3-match
    title: "Which view of the person does each claim need?"
    prompt: |
      Four claims, according to the four traditions in the lesson on Four Traditions, One Question About Death. Which pairing of **claim** with **what it needs a person to be** is right?
    options:
      - text: "(A) God will raise the dead: the person is a whole body-and-life that God can restore. (B) The self is reborn through karma: a lasting self (atman) travels between bodies. (C) A causal stream is reborn: a person is a changing stream of events with no lasting self. (D) Death is the end: a person is what the living brain does."
        correct: true
        feedback: |
          Yes. Each claim about death rests on a premise about the person; D is the physicalist contrast voice, according to physicalists.
      - text: "(A) God will raise the dead: the person is a lasting self that moves into a new body by itself. (B) The self is reborn: a person is only a body. (C) A causal stream is reborn: a lasting self. (D) Death is the end: a soul."
        feedback: |
          Each pairing here is swapped: raising is not the migration of a self by itself, atman is not a body, and the stream view denies a lasting self.
      - text: "All four claims need the same view of the person, and they differ only in the date of the end."
        feedback: |
          They need different views, which is why the four answers conflict, and why the first question is always what a person is.
    explanation: |
      Label: the claims are layer 3 (faith or metaphysical commitment); the premises they rest on are layer 2 where scholars discuss them (for example, how raising relates to the survival of a soul in Judaism and Christianity).

  - type: order
    id: p3-chain
    title: "The Buddhist chain after death"
    prompt: "According to the early Buddhist texts, put the sequence in order, from a life lived to release."
    steps:
      - "A person is five changing groups (the aggregates), with no lasting self behind them"
      - "Actions done with intention (karma) condition what comes next"
      - "At death the conditions give rise to a new life, a stream continuing without a self that moves"
      - "The cycle (samsara) continues while craving and ignorance last"
      - "Ending craving, by insight, brings release (nirvana)"
    hint: Begin with what a person is, then the conditioning, then death and rebirth, then release.
    explanation: |
      Compare the Vedanta chain: both have action, results, death and a new life, and both end in release. The difference is the first line: a lasting self (atman) in one chain, no self in the other. Nagasena's image is a flame passed from one candle to another: "neither the same nor another".

  - type: numeric
    id: p3-count
    title: "What the survey counts"
    prompt: |
      Of the 800 adults of Hallow Reach, 40% answered that God will raise the dead, 25% that a person is reborn, 15% that death is the end and 20% that they do not know. How many of the 800 hold that a person in some form **survives** death (raised or reborn)?
    answer: 520
    tolerance: 0.5
    answerText: '520'
    wrong:
      - { value: 320, feedback: 'That counts only the 40% who said raised. Survival in some form includes the reborn too.' }
      - { value: 680, feedback: 'That adds the "do not know" answers to the others. Someone who does not know has not said that a person survives.' }
    hint: Add the two shares that say a person survives, then take that share of 800.
    explanation: |
      $0.40 + 0.25 = 0.65$, and $0.65 \times 800 = 520$ adults. A count like this says what people in the town think; it says nothing on whether the claims are true.

  - type: numeric
    id: p3-sd
    title: "How sure is that share?"
    prompt: |
      Suppose the true share who hold "raised" is 40% and a fresh random sample of 800 adults is asked. The number who say "raised" would vary from sample to sample. In percentage points of the sample share, what is the typical spread of that share, to two decimals?
    answer: 1.73
    tolerance: 0.02
    answerText: '1.73'
    wrong:
      - { value: 13.86, feedback: 'That is the spread of the **count** (about 13.9 people). The question asks for the spread of the **share**, which is that count divided by 800, times 100.' }
    hint: Think of each person as a trial with success probability 0.4 and use the same family of formula as in the sealed-letter test, then divide by 800.
    explanation: |
      For a count with $n = 800$ and $p = 0.4$, the spread is $\sqrt{800 \times 0.4 \times 0.6} = \sqrt{192} \approx 13.86$ people, which is $13.86/800 \approx 0.0173$ of the sample, that is, about 1.73 percentage points. So a survey figure of 40% is shaky by a point or two, not by ten.

  - type: mcq
    id: p3-layers
    title: "Sort the claims by layer"
    prompt: |
      Three statements about Hallow Reach. Which assignment of layers is right? (A) "520 of the 800 adults say a person survives death." (B) "Scholars debate whether Jewish ideas of resurrection were influenced by Persian (Zoroastrian) thought." (C) "A person is raised by God, or is reborn."
    options:
      - text: "A is layer 1 (a survey count), B is layer 2 (a live scholarly debate), C is layer 3 (faith or metaphysical commitment)."
        correct: true
        feedback: |
          Yes. The count is a fact about the town; the history is a debate among historians; the claim about what happens at death is a commitment that data from a survey cannot settle.
      - text: "A, B and C are all layer 1, since each could be written in a book."
        feedback: |
          Being printed is not what makes something layer 1. A survey count can be checked; a claim about what happens at death cannot be tested the same way.
      - text: "A is layer 3, since people hold their views on faith."
        feedback: |
          That people hold a view is layer 1; the count of them is a fact. Whether the view is true is a different question.
    explanation: |
      Keeping apart "how many believe", "how scholars debate the history" and "what is true" is the habit the whole course trains.

  - type: mcq
    id: p3-weigh
    title: "Weighing Problem 3"
    prompt: |
      The members of Hallow Reach's four groups, and the physicalist who answers "the end", all read the survey. Where do thoughtful people part ways, and why?
    options:
      - text: "On **what a person is** (a body raised, a lasting self, a causal stream, or what a brain does) and on **what kind of reason can bear on that**, such as revelation, tradition, argument or science. These are premises and values; the counts (520, 1.73) are agreed."
        correct: true
        feedback: |
          Yes. The four answers agree on the survey and on the facts of death; they disagree about the person and about which kinds of reason count.
      - text: "On whether the town has 800 adults."
        feedback: |
          That is a fact of the story, agreed.
      - text: "On the arithmetic of the survey percentages."
        feedback: |
          That is agreed. The parting is about premises, not sums.
    explanation: |
      Label: layers 2 and 3; layer 1 only for the counts and the sources.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Part 1 used one method three ways: find the hidden premise, separate the layers, and ask what kind of evidence is on the table.

      **Problem 1 (the Orrin).** According to Smith, "religion" can distort a way of life; according to Appiah, it is still needed with care; so the word is tested case by case. "No creed, so no religion" hides the premise that a religion needs a creed. A dated word sets a lower limit:
      $$1480 - 1200 = 280\ \text{years later than claimed},$$
      which dates the wording, not the teaching, as with Casaubon's dating of the Hermetic texts.

      **Problem 2 (sealed letters and a saying).** For 96 trials with success probability $1/4$ under guessing,
      $$\mu = np = 24, \qquad \sigma = \sqrt{np(1-p)} \approx 4.2,$$
      so 33 is about 2.1 spreads above the average, unusual but not proof, and among 20 blind guessers
      $$1 - (1 - 0.0253)^{20} \approx 0.40$$
      reach it. The Analects saying can be read as virtue ethics (traits) or role ethics (roles in relations).

      **Problem 3 (Hallow Reach).** Each claim about death needs a view of the person: raised by God, a lasting self reborn, a causal stream reborn, or the end with the brain. A survey counts opinions: $0.65 \times 800 = 520$ say a person survives, with a share spread of $\sqrt{800 \times 0.4 \times 0.6}/800 \approx 1.7$ percentage points.

      **Where people part ways:** on definitions (is it a religion?), on standards of evidence (how strong a test), on whether persons are traits, roles, selves or streams. **Next:** part 2, a debate over a possible Zoroastrian influence, the history of Shinto, and the weighing of the whole level; then the level review and the partial exam.
