id: ch19-sikh
title: "Sikhism"
kind: concept
own: |
  The setting: Sikhism, a tradition that began in the Punjab (north-west India and Pakistan today) in the late fifteenth century, taught here according to Sikh tradition and the encyclopedia accounts and scholars cited in the lesson. Whether its claims about God are true is left to each reader.
  - **The Gurus and the Khalsa.** According to Sikh tradition, Guru Nanak (1469 to 1539) was the first of ten human Gurus, and the tenth, Guru Gobind Singh, founded the *Khalsa* ("the pure", the community of initiated Sikhs) in {{ 1699 }}. Historians add that the details of Nanak's life come mostly from later devotional life stories (*Janamsakhis*), so they are a layer of tradition, not of record.
  - **One God.** The scripture opens with the symbol *Ik Onkar*, read as "there is one God", followed by the *Mool Mantar*, a list of attributes of that one (creator, without fear, without hatred, not born, self-existent). According to the encyclopedic account, God is both {{ beyond all attributes (*nirgun*) and present in creation (*sargun*) }}, and is not thought to take birth in human form.
  - **The living Guru.** The *Adi Granth* was compiled under Guru Arjan and completed in 1604; its hymns come from the Sikh Gurus and also from Hindu and Muslim saints such as Kabir, Ravidas and Farid. In 1708, according to Sikh tradition, Guru Gobind Singh declared it the Guru for all time, and it is then called the {{ *Guru Granth Sahib* }}, treated in the gurdwara as a living Guru. Scholars debate how its text took shape, not whether Sikhs revere it.
  - **Equality and its tension.** Guru Nanak rejected caste hierarchy, and the *langar* is {{ a free communal meal served to all, seated together regardless of caste }}. Scholars such as McLeod read the Gurus as rejecting caste's vertical ranking while accepting its horizontal links (marriage within a group); and village studies in Punjab record caste distinctions in practice, so the ideal and the social facts differ.
  - **Practice.** Three guides of daily life are *naam japna* (remembering God's Name), *kirat karni* (honest work) and *vand chakna* (sharing with others). The Khalsa wear the {{ five Ks: *kesh*, *kangha*, *kara*, *kachera*, *kirpan* }}, which tradition dates to 1699.
  - **Three layers.** Established: the scripture, the gurdwara practice, the community's history from about 1500. Debated: how Nanak's biography and the Granth's text developed, and how far the egalitarian ideal was realised. Faith: that the Gurus spoke with divine authority and that the scripture is the eternal Guru.

cards:
  - type: mcq
    id: hook
    title: "Guess: a faith built on 'no Hindu, no Muslim'"
    prompt: |
      Guessing is the point; no background is needed. According to Sikh tradition, a teacher in north India about 1500, after a spiritual experience, said in essence that there is no Hindu and no Muslim. Suppose a new faith grew from that saying, in a land where both communities lived side by side. Which is the most reasonable first guess about it?
    options:
      - text: "It would stress what both communities share (one God, humility, honest life) and look for a path that belongs to neither label alone."
        correct: true
        feedback: |
          A good guess, and close to the Sikh account. We will see that it also became a separate community with its own scripture, rules and identity, so the story has a tension in it.
      - text: "It would simply merge the two religions into one with no distinct beliefs."
        feedback: |
          The tradition did not stay a blend. It developed its own scripture, institutions and identity, and Sikhs today regard it as a distinct religion.
      - text: "It would reject God altogether, since both communities believe in God."
        feedback: |
          The opposite holds: Sikhism puts one God at the centre. The saying is read as being about the divisions between people, not about God.
    explanation: |
      The lesson follows Sikhism according to Sikh tradition and the encyclopedic and scholarly accounts cited. Three questions: who were the Gurus, what does the tradition say about God and its scripture, and how does the ideal of equality meet the facts of Punjabi society?

  - type: text
    id: nanak
    title: "Punjab, Guru Nanak and the ten Gurus"
    image:
      src: img/guru-nanak-woodcut.webp
      alt: "Old printed picture in black ink of a seated bearded man under a tree, with followers and attendants around him."
      caption: "A woodcut printed in Amritsar in the 1870s showing Guru Nanak under a tree among followers: a later devotional picture, not a portrait from his lifetime."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Woodcut_of_Guru_Nanak_with_followers.jpg"
    body: |
      **Sikhism** began in the **Punjab**, the region of the north-west of the Indian subcontinent, in the late fifteenth century. According to Britannica, **Guru Nanak** (1469 to 1539) is revered as its founder and first Guru, born near Lahore, and the little that is known of his life was handed down mainly through legend and tradition. The traditional life stories are called the *Janamsakhis*; they are devotional and were written after his lifetime. The saying about "no Hindu and no Muslim" comes from them, so the exact wording and setting are not historically certain.

      According to Sikh tradition, Nanak was followed by nine more Gurus, ending with **Guru Gobind Singh**. Britannica adds that the spiritual authority of the Guru was passed from each Guru to the next. In **1699**, according to Wikipedia's account, Gobind Singh founded the **Khalsa** ("the pure"), the order of initiated Sikhs, who adopted the names *Singh* and *Kaur*.

  - type: mcq
    id: nanak-q
    title: "Tradition and history on Nanak"
    prompt: |
      A student writes: "Guru Nanak said on the day of his spiritual experience, word for word, that there is no Hindu and no Muslim, and this is recorded history." According to the sources above, which reply is the most careful?
    options:
      - text: "Sikhs hold that Nanak taught this, and the saying is traditionally attributed to him through devotional life stories written later, so its exact wording and setting are not historically certain."
        correct: true
        feedback: |
          Yes. Layer 1: Nanak was a historical teacher in the Punjab, c. 1469 to 1539. Layer 2: how much of the later life stories is biography. Layer 3: for Sikhs, that he spoke with divine authority.
      - text: "It is false, because no Hindu and Muslim communities existed in Punjab in 1500."
        feedback: |
          Both communities were there. The doubt concerns the later life stories, not the setting.
      - text: "Since the stories are devotional, historians conclude Nanak never existed."
        feedback: |
          A source being devotional makes it a source of a certain kind, not a fiction. Britannica and others treat Nanak as a historical person; only the details are hard to separate.
    explanation: |
      The same method as for Mahavira and Confucius: the practice and the texts are facts, the biography is a layer of tradition, and the claim of divine authority is a matter of faith, taught as the tradition's own.

  - type: text
    id: god
    title: "One God: Ik Onkar and the Mool Mantar"
    body: |
      The Sikh scripture opens with the symbol **Ik Onkar**. *Ik* means "one", and the whole phrase is read as "there is one God". Directly after comes the **Mool Mantar** ("root verse"), which is repeated before many hymns. According to the Wikipedia article on it, Eleanor Nesbitt renders its opening as "There is one god" and Pashaura Singh as "There is one supreme being"; the next words are attributes (*sat nam*, "true name", then creator, without fear, without hatred, not born, self-existent). The article stresses that it is a list of qualities, not a plain sentence about facts.

      Notice what it is *not*. This one God is "not born" (*ajuni*), and according to the encyclopedic account Sikhism rejects the idea that God takes human form. Compare the lesson One God in Three Traditions, where the oneness of God is the Abrahamic starting point, and the lesson Brahman and Atman, where the ultimate is one but the soul is, in Advaita, identical with it. According to the Wikipedia article on God in Sikhism, in Sikhism the soul is *not* identical with God.

  - type: mcq
    id: god-q
    title: "Beyond and present"
    prompt: |
      According to the Wikipedia account of God in Sikhism, God is both *nirgun* (without attributes) and *sargun* (with attributes, present in creation). Which statement fits that picture best?
    options:
      - text: "God is beyond every description, yet also pervades the world and can be known by those who remember the Name."
        correct: true
        feedback: |
          Yes. The article calls this a panentheistic view: God is greater than creation yet pervades it. Whether that is the best name for it is for scholars of religion to say.
      - text: "God made the world and left it, staying distant and unknowable."
        feedback: |
          That is a deist picture. Sikh sources say God is present in creation and can be known in devotion (the Name).
      - text: "God and the world are simply identical, so no distinction exists."
        feedback: |
          That would be pantheism. The article says Sikhism rejects pure pantheism: God pervades creation and also goes beyond it.
    explanation: |
      A critic from a strict monotheism may ask whether "beyond yet pervading" keeps God distinct enough; a Sikh reply is that the scripture speaks of both together. Where thoughtful people part ways here is the word chosen (panentheism, monotheism) and whether the labels, made in Western or other traditions, fit.

  - type: text
    id: granth
    title: "The Guru Granth Sahib"
    image:
      src: img/harmandir-sahib.webp
      alt: "Photograph of a gold-covered building standing in the middle of a rectangular pool of water, with a white causeway leading to it."
      caption: "The Harmandir Sahib in Amritsar (the Golden Temple), where, according to the Wikipedia account, the Adi Granth was installed in 1604."
      credit: "Dey.sandip, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Harmandir_Sahib,_Amritsar,_India.jpg"
    body: |
      According to the Wikipedia article on the scripture, **Guru Arjan** (the fifth Guru) compiled the **Adi Granth** ("first book"), with Bhai Gurdas as scribe, completed in 1604 and installed in the Harmandir Sahib. The article says Guru Gobind Singh, with Bhai Mani Singh, added the hymns of Guru Tegh Bahadur in 1704, giving the final edition. In **1708**, Sikhs hold, Gobind Singh declared the scripture to be the Guru after him, so it is called the **Guru Granth Sahib**, the "final, sovereign and eternal Guru" of the Sikhs.

      Its 1,430 pages (*angs*) hold hymns of six Sikh Gurus (Arjan wrote most, then Nanak and Amar Das) and also of Hindu *bhakti* ("devotional") saints such as Kabir and Ravidas, the Muslim Sufi saint Farid, and court poets. In a gurdwara (a Sikh place of worship) it rests on a raised platform under a canopy; a fan-whisk (*chaur*) is waved over it, and each morning it is opened to a page whose verse is read as the day's guidance.

  - type: mcq
    id: granth-q
    title: "A book or a Guru?"
    prompt: |
      A visitor to a gurdwara sees people bow to the Guru Granth Sahib and asks whether Sikhs worship a book. According to the account above, which statement is fairest?
    options:
      - text: "Sikhs hold that the scripture is the living Guru, the ongoing voice of the line of Gurus, so it is treated with the honours a Guru would receive."
        correct: true
        feedback: |
          Yes. From inside, it is the Guru, not an object; from outside, a historian can describe the practice (canopy, fan, daily opening) without taking a side on the claim.
      - text: "It is an ordinary anthology, and Sikhs treat it like any library book."
        feedback: |
          The practice contradicts this: it has its own seat, canopy and rituals, and in the Sikh view it is the Guru.
      - text: "Only the verses of the Sikh Gurus are in it, as in a family diary."
        feedback: |
          It also contains hymns of Hindu and Muslim saints such as Kabir, Ravidas and Farid, which is part of why it is read as speaking to both communities.
    explanation: |
      Keeping three things apart is the method. Fact: the contents and the rituals. Scholarly debate: how the text took shape (Pashaura Singh sees collaborative editing and cites the Kartarpur manuscript's several scribal hands; others, such as Balwant Singh Dhillon, argue for a single early tradition). Faith: that it is the eternal Guru.

  - type: text
    id: equality
    title: "Equality, langar and caste"
    body: |
      In the Punjab of Nanak's time, society was divided by **caste**: hereditary groups ranked by birth, which governed marriage, food and work. According to Wikipedia's account, Guru Nanak rejected caste hierarchy and held that all humans share one divine essence. The **langar** (the free communal kitchen in every gurdwara) is its everyday form: people of every background sit in rows and eat the same food together. The inclusion of the hymns of Ravidas, a poet of a low-ranked community, and the Harmandir Sahib's four doors, which according to the same article signal openness to all, are read in the same spirit.

      But the picture has a second half. The same sources say all the Gurus came from the Khatri caste and married within it, and that **W. H. McLeod** argues that the Gurus rejected caste's vertical ranking but not its horizontal links such as marriage groups. Jat Sikhs are the largest caste among Sikhs (about a third, according to the article) and dominate rural landholding. Village studies it cites (by I. P. Singh and Joyce Pettigrew) record members of the Mazhabi community excluded from village feasts, and in some villages separate gurdwaras for different castes exist; Asia Times in 2018 reported Sikh committees urging villages to end this.

  - type: mcq
    id: equality-q
    title: "The ideal and the facts"
    prompt: |
      Which is the fairest summary of Sikhism and caste, according to the sources above?
    options:
      - text: "The founding teaching rejects caste hierarchy and the langar enacts that, while scholars and village studies also record caste distinctions among Sikhs in the Punjab."
        correct: true
        feedback: |
          Yes: the teaching and the social facts are two different layers, and the gap between them is itself a subject of study, as with many traditions.
      - text: "Sikhism has no caste at all in practice, so the question does not arise."
        feedback: |
          The sources report caste groups and separate gurdwaras among Sikhs in parts of the Punjab. Saying the ideal exists is not saying it is fully realised.
      - text: "Sikhism endorses caste hierarchy, like the society around it."
        feedback: |
          The scripture and the Gurus' teaching, as the sources report, reject hierarchy by birth. Scholars debate how far, but not that rejection.
    explanation: |
      Where thoughtful people part ways: a believer may say the practice fails a standard the tradition itself sets; a sceptic may say a doctrine that fails to change society was weak; a historian (McLeod, Jodhka) asks what "caste" meant for the Gurus and how it changed with land and politics. All three can be fair.

  - type: text
    id: practice
    title: "Three guides and the five Ks"
    body: |
      According to Wikipedia's account, a Sikh life is organised around three guides: **naam japna** (remembering God's Name, by meditation and singing hymns), **kirat karni** (earning by honest work) and **vand chakna** (sharing with those in need). Notice that they tie devotion to ordinary life: Nanak is said to have stressed the life of a householder over withdrawal from the world.

      The **Khalsa** wear five articles of faith, the **five Ks** (all begin with *k* in Punjabi): *kesh* (uncut hair), *kangha* (a wooden comb), *kara* (a steel bracelet), *kachera* (a particular undergarment) and *kirpan* (a small sword, a duty to protect others). Tradition says Guru Gobind Singh required them in 1699. Not every Sikh is initiated into the Khalsa; those who follow the Guru Granth Sahib without taking initiation are called *sahajdhari*.

  - type: mcq
    id: practice-q
    title: "Which guide is which?"
    prompt: |
      A Sikh runs a small bakery and gives a share of each day's bread to the gurdwara's langar. Which pair of the three guides (*naam japna*, remembering God's Name; *kirat karni*, honest work; *vand chakna*, sharing) does this illustrate?
    options:
      - text: "Honest work (*kirat karni*) and sharing (*vand chakna*)."
        correct: true
        feedback: |
          Yes: earning by honest work, and giving from what is earned.
      - text: "Remembering the Name (*naam japna*) and sharing."
        feedback: |
          Sharing is there, but the bakery is the work. Naam japna would be daily remembrance of God's Name, which the story does not mention.
      - text: "Only honest work."
        feedback: |
          The gift to the langar is the second guide, sharing.
    explanation: |
      The three guides are meant to be lived together, which is why scholars call the tradition worldly and not only contemplative.

  - type: mcq
    id: kirpan-q
    title: "A common slip about the Ks"
    prompt: |
      A newspaper says, "All Sikhs wear the five Ks as a mark of a warrior sect." Which correction fits the sources?
    options:
      - text: "The five Ks are worn by the initiated Khalsa, tradition dates them to 1699, and the kirpan is explained as a duty to protect others; not all Sikhs are initiated."
        correct: true
        feedback: |
          Yes. It separates the group (Khalsa, not all Sikhs), the date (tradition) and the meaning as Sikhs explain it.
      - text: "They are worn only by monks, as in other Indian traditions."
        feedback: |
          The sources above describe the Khalsa as a community of initiated Sikhs, not a monastic order, and stress the life of a householder.
      - text: "They were invented in the twentieth century."
        feedback: |
          Sikh tradition places them in 1699. Some scholars trace parts earlier or debate details of origin, but no source above supports so late a date.
    explanation: |
      A claim like "tradition dates them to 1699" is exactly what the layers separate: the practice is a fact today, its origin is a historical question, and the command of the Guru is held by faith.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    prompt: |
      Select every statement that is **established or documented** (not a matter of faith or live scholarly debate).
    multiple: true
    options:
      - text: "The Guru Granth Sahib contains hymns of Sikh Gurus and of Kabir, Ravidas and Farid."
        correct: true
        feedback: |
          Yes, a fact about the contents, as reported by the encyclopedic accounts.
      - text: "The langar serves free meals to all in the gurdwara."
        correct: true
        feedback: |
          Yes, a fact about practice.
      - text: "Guru Nanak said, word for word, that there is no Hindu and no Muslim."
        feedback: |
          Tradition holds it; the sources are later devotional life stories, so the wording is not secure. Layer 2.
      - text: "In 1708 Guru Gobind Singh made the scripture the eternal Guru."
        feedback: |
          That Sikhs hold this is a fact about the community; that it was so is part of the tradition's own account, accepted in faith. Layer 3.
      - text: "Caste distinctions have vanished among Punjabi Sikhs."
        feedback: |
          Contradicted by the village studies and reports above.
    explanation: |
      The method again: contents and practice are facts, biography is a layer of tradition and scholarship, authority claims are faith, and sweeping social claims must be checked against evidence.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** Whether Sikhism is a blend of Hindu and Muslim currents or a new revelation, as Sikhs hold; how much of Nanak's life can be known from later life stories; whether "beyond and present" God is best called monotheism or panentheism; and how far a tradition that rejected caste hierarchy has realised it. The reasons are different premises about revelation, different standards for historical sources, and different values about what counts as success for an ideal.

      **Next:** the lesson Zoroastrianism and Ancient Dualism turns to Iran, to a prophet named Zarathustra, and to the old question of whether good and evil are cosmic powers.
