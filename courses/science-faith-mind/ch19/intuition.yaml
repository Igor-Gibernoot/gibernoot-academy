id: ch19-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: the world's other traditions as met in this level (Confucian, Daoist, Jain, Sikh, Zoroastrian, Indigenous and African, Shinto, Gnostic and Hermetic, newer movements), each taught *according to* its texts, its members and the scholars who study it. Whether any of it is true is left to each reader.
  - **Three layers.** Established: texts, dates, finds, rites, survey figures. Debated: how scholars read them (dates, categories, influence). Faith: what a tradition holds about God, souls, karma or revelation. The question to ask of any claim is {{ according to whom, about which people, from what text and what date }}.
  - **Confucian terms.** *Ren* is humaneness, *li* ritual propriety, the *junzi* the exemplary person, *shu* reciprocity: what you do not want done to yourself, do not do to others. Two readings of the ethic: virtue ethics (character first) and role ethics (a person is the sum of their roles).
  - **Daoist terms.** *Dao* is the Way, not captured by a fixed name; *de* is inner power, *ziran* naturalness, *wu wei* effortless, non-forcing action. *Daojia* is the early "school" label and *daojiao* the organised religion from the second century CE.
  - **Jain ahimsa.** Five great vows for monastics: non-violence, truth, not stealing, celibacy, non-possession. Non-violence is graded: monastics avoid harming even {{ one-sensed beings }}, while lay duties concern beings with two or more senses. Many-sidedness (*anekantavada*) says reality has many aspects, so one claim shows only one side.
  - **Sikh practice.** Ten human Gurus from Nanak (1469 to 1539) to Gobind Singh; the Khalsa, the community of initiated Sikhs, founded in {{ 1699 }}; the Guru Granth Sahib is the Guru for all time from 1708. Daily guides: *naam japna*, *kirat karni*, *vand chakna*. The five Ks are worn by the initiated Khalsa.
  - **Zoroastrian shape.** *Asha* (truth, right order) against *druj* (the Lie). Three ages:
    $$\text{creation} \;\to\; \text{mixture} \;\to\; \text{separation}$$
    The Parsi count in the Indian census fell from 114,890 in 1941 to 57,264 in 2011, about {{ half }}. Whether Persian ideas shaped later religions is a live debate.
  - **Contested labels.** "Gnosticism" is a modern category for some scholars (Williams, King) and a specific school for others (Brakke). Hermetic texts: Ficino in 1463 thought them ancient; Casaubon in 1614 showed from the Greek they are {{ from the early Christian centuries }}.
  - **Four answers to death, four premises.** Judaism and Christianity: God raises the person. Hindu thought: the self (*atman*) is reborn by karma. Buddhism: a causal stream continues, with no self passed along. Each needs a premise about {{ what the person is }}.
  - **Guessing and chance.** For $n$ trials each succeeding with probability $p$ by chance, the expected hits are $\mu = np$ and the spread is $\sigma = \sqrt{np(1-p)}$.

cards:
  - type: text
    id: welcome
    title: "Quick recall: other traditions"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main shapes: the three layers, Confucian and Daoist terms, the Jain vows, the Sikh Gurus and the Khalsa, the Zoroastrian ages, the contested labels of Gnosticism and Hermeticism, and the four answers to death.

      Three kinds of card: **mnemonics**, **build, order and match cards**, and **numeric cards that give you data only**: you choose the method yourself. Guessing is fine: a wrong guess is shown with its reason.

      Every answer is *according to* some text, tradition or scholar. Nothing here asks which tradition is true.

  - type: mcq
    id: layers
    title: "Fact, debate or faith"
    prompt: |
      In this level every claim is sorted into one of three layers: established fact, scholarly debate, or faith. Which sorting of the three examples is right?
    options:
      - text: 'Fact: the Indian census counted 57,264 Parsis in 2011. Debate: whether Persian ideas shaped later religions. Faith: that Ahura Mazda is the good creator and evil will be defeated.'
        correct: true
      - text: 'Fact: Persian ideas shaped later religions. Debate: the census count of Parsis. Faith: that Ahura Mazda is the good creator.'
        feedback: |
          Shuffled. A census count is a record; scholars still disagree about influence, so that sits in the middle layer.
      - text: 'Fact: Ahura Mazda is the good creator. Debate: the census count. Faith: that Persian ideas shaped later religions.'
        feedback: |
          A claim about a god's nature is a faith or metaphysical commitment, never a plain fact in either direction.
    shuffle: false
    hint: 'Records first, scholars next, commitments last.'
    explanation: |
      Mnemonic: **record, reading, commitment**. Passing a layer-3 claim off as layer 1, in either direction, is the mistake the course keeps warning about.

  - type: mcq
    id: whom
    title: "Four questions to ask"
    prompt: |
      A friend says: "Shinto teaches that every mountain is sacred." Before accepting or rejecting it, which set of questions best sorts the claim?
    options:
      - text: 'According to whom (a text, a scholar, worshippers), about which people and shrines, and from what text and date?'
        correct: true
      - text: 'Is it true or false, and which religion is best?'
        feedback: |
          These questions ask for a verdict, but this course asks what the claim is, who makes it and on what ground. Verdicts on a tradition are left to each reader.
      - text: 'Is it in a book? If yes it is fact.'
        feedback: |
          A text is evidence of what a tradition says, not proof of its content. What a text says and whether it is so are separate questions.
    shuffle: false
    hint: 'Ask who says it, about whom, and on what record.'
    explanation: |
      Mnemonic: **who says, about whom, from what, when**. Here the Japanese scholar Motoori Norinaga defined *kami* as beings with an eminent quality that inspires awe, and mountains are among them; that is one tradition's account, not a rule for all of Japan.

  - type: mcq
    id: confucian-terms
    title: "Confucian terms"
    prompt: |
      According to the *Analects*, which matching of Confucian term and meaning is right?
    options:
      - text: '*Ren* is humaneness, "caring for others". *Li* is ritual propriety, the shared forms through which respect is shown. The *junzi* is the exemplary person. *Shu* is reciprocity: what you do not want done to yourself, do not do to others.'
        correct: true
      - text: '*Ren* is ritual propriety. *Li* is humaneness. The *junzi* is the ruler. *Shu* is obedience to the father.'
        feedback: |
          Two terms swapped, and the *junzi* is a person of character, not a rank. *Shu* is a two-way rule, a negative Golden Rule, not obedience.
      - text: '*Ren* is the law of the state. *Li* is punishment. The *junzi* is a judge. *Shu* is filial piety.'
        feedback: |
          According to the *Analects*, order comes less from laws and punishment than from example and ritual. Filial piety is *xiao*, called the root of benevolent action.
    shuffle: false
    hint: 'Inner care, outer forms, a person who embodies both, and a one-word rule for life.'
    explanation: |
      Mnemonic: **care, form, model, mirror**. Two readings of how it works: virtue ethics (character comes first, Tiwald) and role ethics (a person is the sum of their roles and relationships, Ames and Rosemont).

  - type: mcq
    id: dao-terms
    title: "Daoist terms"
    prompt: |
      According to the *Daodejing* and the *Zhuangzi*, which matching is right?
    options:
      - text: '*Dao* is the Way, not captured by any fixed name. *De* is the inner power a being gets from the Dao. *Ziran* is "so of itself", naturalness. *Wu wei* is effortless, non-forcing action, not doing nothing.'
        correct: true
      - text: '*Dao* is a god who made the world. *De* is a ritual. *Ziran* is a law. *Wu wei* is doing nothing at all.'
        feedback: |
          The Dao is the course of things, not a creator. *Wu wei* is not idleness: Cook Ding works all day, with the grain of the animal.
      - text: '*Dao* is a fixed list of rules. *De* is the name of a place. *Ziran* is the school of Confucius. *Wu wei* is strict obedience to ritual.'
        feedback: |
          A fixed list of rules is just what the Daoist texts warn about: fixed names and norms can harden into distinctions that distort how things go.
    shuffle: false
    hint: 'The Way, its power, its spontaneity, and acting without forcing.'
    explanation: |
      Mnemonic: **way, power, so-of-itself, no forcing**. *Daojia* is the early "school of the Dao" label from the historian Sima Tan; *daojiao* is the organised religion from the second century CE on.

  - type: order
    id: vows
    title: "The five great vows"
    prompt: |
      According to Jain tradition, monks and nuns take five great vows (*mahavratas*). Put them in the order given in the lesson, starting with the first.
    steps:
      - 'Non-violence (*ahimsa*).'
      - 'Truth.'
      - 'Not stealing.'
      - 'Celibacy.'
      - 'Non-possession.'
    hint: 'The first is the one the whole tradition is known for.'
    explanation: |
      Mnemonic: **harm, speak, take, desire, own**. Householders take lighter forms of the vows, the *anuvratas*.

  - type: mcq
    id: ahimsa
    title: "How far does non-violence reach?"
    prompt: |
      According to the Stanford Encyclopedia of Philosophy's account of Jain ethics, how is non-violence graded between monastics and laypeople?
    options:
      - text: 'No harm to any living being, in mind, speech and action, with a stricter reach for monastics, who try to avoid harming even one-sensed beings, than for laypeople, whose duties concern beings with two or more senses.'
        correct: true
      - text: 'The same rule for everyone: nobody may harm any being, so laypeople and monks must live identically.'
        feedback: |
          The tradition grades the vow. Householders take lighter forms, so a farmer and a nun are not held to the same reach.
      - text: 'It applies only to humans, since only humans have souls.'
        feedback: |
          According to the Jain texts, every living thing has a soul (*jiva*), including animals and plants, which is why the reach goes beyond humans.
    shuffle: false
    hint: 'Count the senses: one, or two and more.'
    explanation: |
      Mnemonic: **everyone, in thought, word and deed; monks furthest**. In the same tradition *karma* is a subtle kind of matter that binds to the soul, which is why harm matters so much to it.

  - type: mcq
    id: sikh
    title: "Gurus, Khalsa and the five Ks"
    prompt: |
      According to Sikh tradition, Guru Nanak (1469 to 1539) was the first of ten human Gurus, and the tenth, Guru Gobind Singh, founded the Khalsa in 1699. Which statement is right?
    options:
      - text: 'The Khalsa is the community of initiated Sikhs, and its members wear the five Ks (*kesh*, *kangha*, *kara*, *kachera*, *kirpan*). After the tenth Guru, tradition holds that the scripture, the Guru Granth Sahib (1708), is the Guru for all time.'
        correct: true
      - text: 'The Khalsa is the name for all Sikhs, so every Sikh in history has worn the five Ks since Nanak.'
        feedback: |
          Tradition dates the five Ks to 1699, over two centuries after Nanak, and ties them to the Khalsa, the initiated community.
      - text: 'After the tenth Guru, an eleventh human Guru was chosen, and the Guru Granth Sahib is only a hymnbook.'
        feedback: |
          According to Sikh tradition, Guru Gobind Singh declared the scripture the Guru for all time in 1708. In the gurdwara it is treated as a living Guru.
    shuffle: false
    hint: 'Initiated community, five items, and a scripture that is itself the Guru.'
    explanation: |
      Mnemonic: **ten Gurus, 1699 Khalsa, 1708 Granth**. The three daily guides: remembering God's Name (*naam japna*), honest work (*kirat karni*), sharing (*vand chakna*). Historians add that details of Nanak's life come mostly from later devotional life stories.

  - type: build
    id: ages
    title: "The three ages"
    prompt: |
      According to the *Bundahishn*, a ninth-century book in Middle Persian, Zoroastrian history has three ages. Build the sequence from the tiles, in order.
    prefix: ''
    suffix: ''
    tiles: ['\text{creation}', '\to', '\text{mixture}', '\to', '\text{separation}', '\text{judgement}']
    answers:
      - ['\text{creation}', '\to', '\text{mixture}', '\to', '\text{separation}']
    wrong:
      - answer: ['\text{creation}', '\to', '\text{separation}', '\to', '\text{mixture}']
        feedback: |
          The ages are creation, then a mixture of good and evil, then the separation, in which evil is defeated and the world is made fresh (*frashokereti*).
    hint: 'Good and evil are first apart in the sense of untouched, then tangled, then sorted.'
    explanation: |
      Mnemonic: **made, mixed, sorted**. The Gathas stress *frashokereti* and each person's own choice; the detailed sequence and the *Chinvat* bridge come from later texts.

  - type: mcq
    id: asha
    title: "Asha and druj"
    prompt: |
      In the Zoroastrian moral axis, *asha* stands against *druj*. According to one common reading of Yasna 30.3, the choice between the two spirits is of what kind?
    options:
      - text: '*Asha* is truth and right order, *druj* is the Lie, disorder. The choice is a moral one, not a split between spirit and matter. Jean Kellens reads the stanza instead as a psychology of ritual choice.'
        correct: true
      - text: '*Asha* is matter and *druj* is spirit, so the world itself is evil.'
        feedback: |
          The common reading is an ethical dualism: the choice is between truth and the Lie, not between spirit and matter. Matter is not condemned.
      - text: '*Asha* is the evil spirit and *druj* the good creator Ahura Mazda.'
        feedback: |
          Ahura Mazda is the wise Lord, the good creator, and stands on the side of *asha*. The Destructive Spirit is the opposed one.
    shuffle: false
    hint: 'One word means truth, the other the Lie.'
    explanation: |
      Mnemonic: **asha is right, druj is the Lie**. Scholars disagree whether the whole is called dualist or monotheist (Skjærvø, Hintze, Mehr); it depends on what *monotheism* is taken to require.

  - type: mcq
    id: gnostic
    title: "Is Gnosticism one thing?"
    prompt: |
      The Nag Hammadi library was found in Egypt in late 1945 and holds 52 mostly Gnostic treatises. About the label "Gnosticism", which statement matches the scholarly debate?
    options:
      - text: 'Michael Williams (1996) and Karen King (2003) argue it is a modern category, not one ancient religion; David Brakke (2010) keeps the name for a specific school of thought known to Irenaeus.'
        correct: true
      - text: 'All scholars agree it was one organised church with one creed, founded by a single teacher.'
        feedback: |
          That is just what Williams and King dispute. They say the label lumps together varied groups and texts.
      - text: 'All scholars agree the name should be dropped, so nobody uses it.'
        feedback: |
          Brakke keeps it for a specific school. The debate is over what the word should cover, not whether the texts exist.
    shuffle: false
    hint: 'Two scholars doubt the category, one keeps it for a narrower use.'
    explanation: |
      Mnemonic: **a label, not a church**. The finds (the codices) are established; whether they form one movement is debated; that hidden knowledge saves is a matter of faith.

  - type: mcq
    id: hermetic
    title: "Dating by language"
    prompt: |
      Marsilio Ficino translated the Corpus Hermeticum in 1463, believing Hermes Trismegistus to be very ancient. In 1614 Isaac Casaubon argued from the Greek of the texts. What did he conclude, and what do modern scholars say?
    options:
      - text: 'That the texts are from the early Christian centuries, not from remote antiquity. Modern scholars date most of them to about 100 to 300 CE.'
        correct: true
      - text: 'That the texts are older than the Hebrew Bible, a view modern scholars confirm.'
        feedback: |
          That was the older belief Casaubon argued against. The style of the Greek showed the language of a later age.
      - text: 'That the texts are medieval forgeries, a view modern scholars confirm.'
        feedback: |
          Casaubon dated them to the early Christian centuries, not to the Middle Ages, and modern dating agrees with him.
    shuffle: false
    hint: 'Language changes over time, so style can date a text.'
    explanation: |
      Mnemonic: **style dates the text**. Such a date is a scholarly argument from evidence, not a verdict on whether the teaching is wise.

  - type: mcq
    id: death
    title: "Four answers, four premises"
    prompt: |
      Four traditions answer what happens to a person at death. Which matching of answer and the premise about the person it **needs** is right?
    options:
      - text: 'Judaism and Christianity: God raises the person, which needs the person to be a unit God can restore. Hindu thought: the self (*atman*) is reborn by karma, which needs a lasting self. Buddhism: a causal stream is reborn, which needs only cause and effect with no self passed along.'
        correct: true
      - text: 'Judaism and Christianity: the person is reborn by karma. Hindu thought: God raises the person. Buddhism: the lasting self lives forever.'
        feedback: |
          Shuffled. The two rebirth traditions are Hindu thought and Buddhism; the two raising-by-God traditions are Judaism and Christianity. Buddhism teaches no lasting self.
      - text: 'All four say the same: an immortal soul escapes the body, so they differ only in names.'
        feedback: |
          The premises differ: a body-and-mind unit raised by God, a lasting self that travels, or a stream with no self. Even the Christian hope was never simply Plato's.
    shuffle: false
    hint: 'Ask what each answer needs the person to be.'
    explanation: |
      Mnemonic: **raised, reborn-with-self, reborn-without-self**. Each premise is a faith or metaphysical commitment, which is why the four can disagree and none of the speakers be foolish.

  - type: numeric
    id: parsi
    title: "A shrinking community"
    prompt: |
      The Indian census counted 114,890 Zoroastrians in 1941 and 57,264 in 2011. By what percentage did the count fall? Give the nearest whole percent.
    answer: 50
    answerText: '50'
    wrong:
      - { value: 100, feedback: 'You may have given the ratio of the two counts as a percent, or something near it. The question asks for the fall.' }
      - { value: 57626, feedback: 'That is the drop in people, not in percent.' }
    hint: 'Change as a share of the starting value.'
    explanation: |
      The drop was 114,890 minus 57,264, which is 57,626 people. Divided by the starting 114,890 this is about 0.50, so the count fell by about half in seventy years.

  - type: numeric
    id: dating-gap
    title: "How many years between?"
    prompt: |
      Ficino translated the Corpus Hermeticum in 1463. Casaubon's book dating the texts by their Greek appeared in 1614. How many years lie between the two dates?
    answer: 151
    answerText: '151'
    wrong:
      - { value: 150, feedback: 'Close: subtract the two years exactly.' }
      - { value: 160, feedback: 'Check the subtraction: 1614 minus 1463.' }
    hint: 'A plain difference of two years.'
    explanation: |
      1614 minus 1463 is 151 years. Nearly a century and a half passed before the language argument was made.

  - type: numeric
    id: astro
    title: "Guessing at astrology"
    prompt: |
      In a test, 75 charts are each matched to one of 3 profiles. A person guesses at random, so each chart has a one in three chance of being right, and charts are independent. What is the spread (standard deviation) of the number of hits? Give two decimal places.
    answer: 4.08
    answerText: '4.08'
    wrong:
      - { value: 25, feedback: 'That is the expected number of hits, not its spread.' }
      - { value: 5, feedback: 'The root of the expected hits would ignore the chance of a miss on each chart.' }
    hint: 'Counts of independent yes-or-no outcomes with the same chance follow a known family; look up its spread.'
    explanation: |
      Each chart is a yes-or-no trial with chance 1/3, so the expected hits are 75 times 1/3, which is 25. The spread is the square root of 75 times 1/3 times 2/3, the square root of 16.67, about 4.08. A result far above 25, by many spreads, would be hard to put down to chance.

  - type: numeric
    id: pew
    title: "A survey sample"
    prompt: |
      A survey asks 1,500 people whether they accept psychics, and 40 percent say yes. About how many people in the sample is that?
    answer: 600
    answerText: '600'
    wrong:
      - { value: 40, feedback: 'That is the percent, not the head count.' }
      - { value: 60, feedback: 'Check the place value: 40 percent of 1,500 is more than 40.' }
    hint: 'A share of a whole.'
    explanation: |
      40 percent of 1,500 is 0.4 times 1,500, which is 600. This is a count in a sample; what it shows about the whole population depends on how the sample was chosen.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **What you now own.**

      - Sort every claim by layer: established (texts, dates, finds, counts), debated (how scholars read them), faith (what a tradition holds). Ask: according to whom, about which people, from what text and what date.
      - Confucian: *ren* humaneness, *li* ritual propriety, *junzi* exemplary person, *shu* reciprocity (do not do to others what you do not want done to yourself). Daoist: *Dao*, *de*, *ziran*, *wu wei* (non-forcing, not idle).
      - Jain: five great vows, graded non-violence (monastics reach one-sensed beings). Sikh: ten Gurus, Khalsa 1699, Guru Granth 1708. Zoroastrian: asha against druj, and three ages:
      $$\text{creation} \;\to\; \text{mixture} \;\to\; \text{separation}$$
      - Labels are contested: "Gnosticism" (Williams, King, Brakke), Hermetic dating by language (Ficino 1463, Casaubon 1614, texts about 100 to 300 CE).
      - Four answers to death each need a premise about what a person is. For $n$ chance trials of probability $p$: $\mu = np$ and $\sigma = \sqrt{np(1-p)}$.

      **Next:** the content map of Level 19, where you rebuild, box by box, how these traditions and the layers fit together. After the map come the automatic review and the level challenge, and then the third partial exam.
