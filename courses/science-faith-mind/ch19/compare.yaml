id: ch19-compare
title: "Guided problem: Four Traditions, One Question About Death"
kind: guided
cards:
  - type: text
    id: hook
    title: "Four answers to one question"
    body: |
      This lesson is one problem with its own setting. **The visitor, Mara, is invented.** Her mother has just died, and Mara, who belongs to no tradition, decides to ask four people the same question: *what happens at death?* She asks a rabbi, a Christian priest, a Hindu teacher of Vedanta and a Buddhist monk. Each answers sincerely, from the texts and teachers of a tradition we have met in Levels 14 to 18.

      The course never says who is right. The task is different: to see what each answer **needs to be true** before it can be given, what kind of reason supports it, and where thoughtful people part. Guessing first is welcome. Before reading on, think about which of Mara's questions has to be answered before any of the four can speak: what dies, what goes on, or what a person *is*.

  - type: mcq
    id: first-question
    title: "What must an answer settle first?"
    prompt: |
      Mara asks four people what happens to her mother at death. Whatever they reply, one question must already have an answer in the background, because "what happens to her" only makes sense once it is settled. Which one?
    options:
      - text: "What a person is: a body, a soul, a stream of events, or something else."
        correct: true
        feedback: |
          Yes. To say that something survives, is raised, is reborn or ends, you must say what the "something" is. The four traditions answer this differently, and their answers about death follow from it.
      - text: "How long death takes."
        feedback: |
          Medicine and law have conventions about this, but the traditions are not divided by it. Their disagreement lies in what, if anything, continues.
      - text: "Whether the brain stops working at death."
        feedback: |
          All four accept that the body stops. The question they answer is what that means for the person, so the ordinary brain facts do not separate them.
      - text: "Which of the four traditions is oldest."
        feedback: |
          Age is a historical question and does not decide what the person is. A younger answer is not thereby false, and an older one not thereby true.
    explanation: |
      Questions about death are questions about personal identity in disguise (the topic of the lesson Souls, Afterlife and Rebirth, and of the lessons on the self). We will therefore read each tradition for its answer to "what is the person?" first.

  - type: text
    id: table
    title: "The four answers side by side"
    body: |
      Each row says what a tradition's texts and teachers say, according to that tradition. Within each, schools and thinkers differ; the row gives a common core.

      | Tradition | According to its texts and teachers | What is said to go on |
      |---|---|---|
      | Judaism | The Hebrew Bible speaks of the dead in *Sheol*; later texts and the rabbis teach a raising of the dead by God | The person, raised by God at a future time (views vary today) |
      | Christianity | According to its creeds, "the resurrection of the body" and everlasting life | The person, raised by God, with a changed body |
      | Hindu thought | According to the Upanishads and the Gita, the self (*atman*) takes new bodies by *karma*, until *moksha* | The self, reborn, until released |
      | Buddhism | According to the early texts, there is no lasting self (*anatta*), yet action has results across lives | A causal stream, rebirth with nothing passed along |

      Read the table once and notice the split. Two answers expect **God to raise the dead**; two expect **rebirth through cause and effect**. Each pair also disagrees inside: the Hindu and the Buddhist agree on rebirth and disagree on whether a self makes the journey.

  - type: text
    id: judaism
    title: "Judaism: from Sheol to the raising of the dead"
    body: |
      *Sheol* (Hebrew *she'ol*) is the Hebrew Bible's word for the underworld of the dead, a place of stillness and darkness. According to the Psalms, those there are cut off from God's praise. In the English Standard Version, Psalm 6:5 reads: "For in death there is no remembrance of you; in Sheol who will give you praise?" Scholars debate whether Sheol is a real place or a poetic name for the grave.

      The idea that God will **raise the dead** comes later. According to historians, the earliest clear statement is in the Book of Daniel (chapter 12, verse 2), written in the 160s BCE, which says many who sleep in the dust will wake, some to everlasting life and others to shame. In the first century CE, according to the New Testament and Josephus, the Pharisees and the Sadducees disagreed about this: the Sadducees rejected an afterlife, while the Pharisees (from whom rabbinic Judaism descends) affirmed it. According to Maimonides (1138 to 1204), the resurrection of the dead is the thirteenth of his thirteen principles of faith.

  - type: mcq
    id: torah-sheol
    title: "What does a Sheol verse show?"
    prompt: |
      Psalm 6:5 (English Standard Version) says: "For in death there is no remembrance of you; in Sheol who will give you praise?" A student says: "So the Hebrew Bible teaches that the dead are raised on a final day." Which reply is fair to the text?
    options:
      - text: "The verse describes the dead as silent and cut off from praise. It is not about a raising, which scholars find first clearly in Daniel, much later."
        correct: true
        feedback: |
          Yes. The verse is a prayer: do not let me die, because the dead cannot praise you. Reading it as a promise of resurrection puts a later belief into an earlier poem, a mistake historians of religion take care to avoid.
      - text: "It proves that Jews never believed in any life after death."
        feedback: |
          Overreach in the other direction. The verse shows one early view; Daniel and later rabbinic Judaism developed another, and today's Jewish views vary.
      - text: "It is a Christian addition to the Psalms."
        feedback: |
          The Psalms are part of the Hebrew Bible, long before Christianity. Christians later read the Psalms as their scripture too, but the text is Jewish.
    explanation: |
      According to scholars, beliefs about death changed within the Hebrew Bible and after it. A fair reading keeps the layers apart: the verse (what the text says), the dating of Daniel (scholarly consensus about when the first clear resurrection text was written), and the belief that God will raise the dead (a faith commitment of the later tradition).

  - type: text
    id: christianity
    title: "Christianity: the body is raised"
    body: |
      Christians take the raising of the dead as their central hope, and they ground it in what they hold happened to Jesus (the lesson on the resurrection). According to the Apostles' Creed, Christians affirm "the resurrection of the body, and the life everlasting". In the Nicene Creed, the wording is "We look for the resurrection of the dead, and the life of the world to come" in many English versions. According to Paul (1 Corinthians 15), what is sown as a natural body is raised a *spiritual body*, which Christians have read in different ways.

      Christians differ on what happens in between: many speak of the soul being with God until the final raising, others stress that the whole person waits. What the creeds fix is the destination, a raised person and not only a surviving soul.

  - type: mcq
    id: creed-wording
    title: "What the creed wording rules out"
    prompt: |
      A friend says: "The Christian hope is the same as Plato's, that an immortal soul escapes the body." According to the creeds' wording "the resurrection of the body" and Paul's "spiritual body", which reply is fair?
    options:
      - text: "The creeds speak of the whole person being raised, with a body, not only of a soul released from one. Plato's soul needs no body; the creeds do not drop the body."
        correct: true
        feedback: |
          Yes. That is why the Christian hope was never simply Plato's, though early Christian thinkers used his ideas to explain it. The puzzle for resurrection is identity: what makes the raised person the same person who died.
      - text: "They are identical: Christians only use the word body as a symbol for the soul."
        feedback: |
          Some Christian thinkers read the language in a more spiritual way, but the creed's words and Paul's discussion do not support calling them identical; they keep the body in the hope.
      - text: "Christians believe the dead are reborn on earth as new babies."
        feedback: |
          That is the rebirth teaching of Hindu and Buddhist thought. The creeds speak of a single raising at the end, not a cycle of births.
    explanation: |
      Two readings sit side by side here. Those who hold the resurrection of the body say the person is one thing, a living body-and-mind unit, so only a raising keeps the person. Those who lean on the soul's survival say the soul is what lasts and the body joins it later. Both are held by Christians, and a lesson earlier in the course showed why the identity puzzle is the difficulty of the first.

  - type: text
    id: hindu
    title: "Hindu thought: the self changes bodies"
    body: |
      According to Advaita Vedanta, the school of Shankara, the real self (*atman*) is not the body or the mind, and in the end it is identical with *Brahman* (the one reality). The Upanishads and the Gita teach *samsara*, the cycle of birth, death and rebirth, and *karma*, that actions have results which shape what comes next. According to the *Brihadaranyaka Upanishad* (4.4), at death the self passes on like a caterpillar that reaches the end of one blade of grass and draws itself to the next. In essence, the Gita (2.22) compares the self's change of body to putting on new clothes in place of worn ones. *Moksha* ("release") is the end of the cycle, by knowing the self.

  - type: order
    id: chain
    title: "The Vedanta chain after death"
    prompt: "According to Advaita Vedanta as taught in the Upanishads and the Gita, put the sequence in order, from a life lived to release."
    steps:
      - "A person acts, shaped by desire and intention"
      - "The actions leave results (karma) that shape what comes next"
      - "At death the body ends and the self (atman) takes a new body"
      - "The cycle (samsara) repeats while desire and ignorance last"
      - "Knowing the self to be Brahman brings release (moksha)"
    hint: "Action comes first, then its results, then death and a new body; release ends the sequence."
    explanation: |
      Notice what the chain needs: a self that lasts through the changes of body (atman), and a moral law that works across lives (karma). Remove either and the chain breaks. Other Hindu schools, such as those of Ramanuja and Madhva, keep the cycle and describe the release differently.

  - type: mcq
    id: gita-clothes
    title: "What the clothes image assumes"
    prompt: |
      In essence, the Gita (2.22) says that the self puts on new bodies as a person puts on new clothes and discards worn ones. A critic wants to name what the comparison **assumes**. Which is it?
    options:
      - text: "That there is a wearer who stays the same while the clothes (bodies) change: a lasting self."
        correct: true
        feedback: |
          Yes. The image only works if the self is distinct from the body and continues through it. That is the premise a critic, such as a physicalist or a Buddhist, would examine.
      - text: "That clothes can be proved to exist in the next life."
        feedback: |
          The image is an illustration, not an experiment. It does not claim observation of a next life.
      - text: "That the body is eternal."
        feedback: |
          The opposite: bodies are the worn clothes. What the image treats as lasting is the self.
    explanation: |
      An analogy illustrates a claim but does not prove it; the claim it illustrates is that a lasting self exists. A Hindu teacher would add that this is known through the Upanishads and by realisation. The next tradition denies exactly this premise.

  - type: text
    id: buddhism
    title: "Buddhism: rebirth without a self that travels"
    body: |
      According to the early Buddhist texts, what we call a person is five changing groups (the *aggregates*), with no lasting self behind them: *anatta*, "not-self". Yet the same texts teach *karma* and rebirth. The question "then who is reborn?" is old. In the *Milindapanha*, a text dated by scholars between about 100 BCE and 200 CE, the monk Nagasena is asked whether the one who is reborn is the same as the one who died. He answers, in the translation of Rhys Davids, "Neither the same nor another", and uses the image of a lamp burning through the night: the flame is not a second lamp, yet no single stretch of fire stays the same. In the same spirit, the commentator Buddhaghosa compares rebirth to a flame passed from one candle to another.

  - type: mcq
    id: flame
    title: "What the flame is meant to show"
    prompt: |
      According to the Buddhist reply, a new life is like a flame lit from another flame. A student says: "So a soul jumps from the old candle to the new one." What does the image actually say?
    options:
      - text: "Nothing is passed along: the later flame depends on the earlier one without being the same flame, so the later being is neither the same as nor wholly different from the earlier."
        correct: true
        feedback: |
          Yes. A flame lit from another is caused by it, and no thing crosses over. That is what the Buddhist teacher means by rebirth without a soul.
      - text: "A small part of the first flame moves to the second."
        feedback: |
          That is the soul-passing picture the image is chosen to avoid. Nothing needs to be transferred for the second flame to depend on the first.
      - text: "The second flame has no connection to the first."
        feedback: |
          Then there would be no reason for karma to carry across. The claim is dependence without identity, which is why both "same" and "another" are refused.
    explanation: |
      A sceptic can say that the image only moves the difficulty: whether rebirth happens at all is a matter of faith, not of observation. Secular Buddhists such as Stephen Batchelor keep the teaching on suffering and the self while staying agnostic about rebirth. Both views are held by people who call themselves Buddhists.

  - type: mcq
    id: audit
    title: "A premise about the self for each tradition"
    prompt: |
      Match each tradition to the premise about the self that its answer **needs**, according to its own teachers. Which pairing is accurate?
    options:
      - text: "Judaism and Christianity: the person is raised by God. Hindu thought: a lasting self (atman) changes bodies. Buddhism: no lasting self, only a causal stream."
        correct: true
        feedback: |
          Yes. Each answer rests on one premise about what the person is, and each premise is a faith or metaphysical commitment, which is why the four can disagree without anyone being foolish.
      - text: "Buddhism needs a lasting atman, and Hindu thought needs none."
        feedback: |
          Reversed. Advaita Vedanta holds the atman is the real self; the Buddhist tradition denies a lasting self.
      - text: "All four need an immortal soul separable from the body."
        feedback: |
          No. The creeds name the raising of the body; the Buddhist texts deny a soul that travels. Only some versions of Jewish, Christian and Hindu thought lean on a separable soul.
      - text: "None of the four make any claim about what the person is."
        feedback: |
          Each does; an answer about death cannot avoid one, as the first question showed.
    explanation: |
      A fifth voice, physicalism, belongs on the table for contrast: according to physicalists, the person is the working body and brain, so death ends the person. It too is a premise about what the person is, supported by the dependence of mind on brain, and its critics deny that the dependence is total.

  - type: numeric
    id: tally
    title: "A small tally"
    prompt: |
      Mara's four answers are: Judaism (God will raise the dead), Christianity (God will raise the dead), Hindu thought (the self is reborn through karma), Buddhism (a causal stream is reborn through karma). How many of the four teach **rebirth into another earthly life**, as a main doctrine?
    answer: 2
    answerText: "2"
    hint: "Count only the two that speak of a cycle of lives, not a single raising."
    wrong:
      - value: 4
        feedback: "That counts the two traditions that speak of a single raising by God as if they taught a cycle. They teach one raising at the end, not repeated births."
      - value: 1
        feedback: "That counts only one of the two rebirth traditions. Hindu thought and Buddhism both teach rebirth; they differ on whether a lasting self makes the trip."
    explanation: |
      Two teach rebirth (Hindu thought and Buddhism) and two a raising by God (Judaism and Christianity). The tally is a reminder that the tidy grouping hides a deep split inside each pair: a self that travels or not, a soul that waits or a whole person raised.

  - type: mcq
    id: evidence
    title: "What kind of reason does each cite?"
    prompt: |
      Asked "how do you know?", each of the four points to something different. Which statement describes the kinds of reason fairly?
    options:
      - text: "Mostly sacred texts, the teaching of a tradition and, for some, the experience of its teachers: reasons that are not experiments, though each tradition also gives arguments."
        correct: true
        feedback: |
          Yes. The Hebrew Bible and rabbinic teaching, the creeds and the reports about Jesus, the Upanishads and the experience of knowing the self, the Buddha's teaching and meditation: all rest on texts, tradition and experience, and they argue within those. This does not make them foolish, but it places them in layer three for the question of what happens after death.
      - text: "Each is established by laboratory measurements of what happens after death."
        feedback: |
          No such measurements settle the question. Studies of near-death experiences, discussed next, give limited evidence and are read in competing ways.
      - text: "None of them offers any reasons at all."
        feedback: |
          Each gives reasons from texts, tradition, argument and experience; philosophers of each tradition have argued for them at length. Calling them unreasoned would be unfair.
    explanation: |
      According to the course's method, separate the layers. That the texts say these things is established fact. How scholars date and interpret the texts is a live debate. That the dead are raised or reborn is a faith commitment, which adherents hold for reasons they find good and which others find insufficient.

  - type: text
    id: nde
    title: "Can brain science or near-death studies settle it?"
    body: |
      Recall from the lesson Near-Death and Out-of-Body Experiences: in AWARE, a study of 2060 cardiac arrests, about 2% of interviewed survivors described seeing and hearing the resuscitation, and one account was checked against a recorded sound; in AWARE-II, no survivor named a hidden picture. Researchers and critics read such reports in competing ways: as glimpses of a mind working apart from the body, or as products of a brain under extreme stress.

  - type: mcq
    id: nde-q
    title: "What would such a result bear on?"
    prompt: |
      Suppose a careful study found a verified case of a patient accurately describing a hidden picture during a cardiac arrest with a flat brain trace. Which statement is the fairest about what this would show for Mara's four answers?
    options:
      - text: "It would challenge the claim that consciousness depends wholly on the working brain, which all four answers resist, but it would not by itself favour raising over rebirth, or any one tradition."
        correct: true
        feedback: |
          Yes. A verified case would bear on a premise shared by survival views, that the person is not only the working brain. Which kind of survival follows is a separate question the data would not answer, and a physicalist would look first for an overlooked ordinary cause.
      - text: "It would prove that Christianity is true."
        feedback: |
          It could not. The data would be equally compatible with a rebirth view, a Platonic soul or a view none of the four holds.
      - text: "It would prove the Buddhist reply, because nothing was transferred."
        feedback: |
          A person perceiving during arrest says nothing about whether a self exists or a stream is reborn. It would not decide between the traditions.
    explanation: |
      Notice how little a single kind of evidence can do. The question of whether a premise is shared is separate from whether the particular teaching built on it is true. As of AWARE-II, no verified hidden-picture case was reported, so the question is open and the traditions rest on their own grounds.

  - type: mcq
    id: layers
    title: "Sort the claims by layer"
    prompt: |
      Three claims about the four answers. Which assignment of layers is right: (A) "Psalm 6:5 speaks of the dead in Sheol"; (B) "scholars date the first clear Jewish resurrection text, Daniel, to the 160s BCE"; (C) "God will raise the dead, or the self is reborn."
    options:
      - text: "A: established (what the text says). B: scholarly consensus. C: faith or metaphysical commitment."
        correct: true
        feedback: |
          Yes. A can be read in the text; B is the working view of historians, open to revision; C is held by adherents and cannot be settled by texts or dates alone.
      - text: "A, B and C are all established fact."
        feedback: |
          C is the very point at issue. A fact about a text does not make what the text teaches a fact about the world.
      - text: "A is faith, B is consensus, C is established fact."
        feedback: |
          Reversed. Passing C off as established is the slip the course asks us to avoid, whichever side makes it.
    explanation: |
      The slip also runs the other way: a critic who says "the dead are not raised and no one is reborn" holds a layer-three claim too, one that rests on a view of the person as the working brain.

  - type: mcq
    id: part-ways
    title: "Where thoughtful people part"
    prompt: |
      Mara asks, "So who is right?" Which reply best fits this course?
    options:
      - text: "They part over which premise about the person they accept, which values (what must be preserved, the person or the self) they weigh, and which kinds of evidence they trust (texts and experience, or only measurement)."
        correct: true
        feedback: |
          Yes. A believer in any one of the four, an atheist and an agnostic can each say that is fair, and each can name where they would press: the premise, the value or the evidence.
      - text: "The oldest tradition is right, so Mara should follow it."
        feedback: |
          Age is no test of truth in either direction. Each of the four claims a deep origin.
      - text: "Since the four disagree, none can be right, and all are mistaken."
        feedback: |
          Disagreement shows that not all are right, not that all are wrong; the four could also be partly right, or one could be. The course names the disagreement and leaves the weighing to the reader.
    explanation: |
      Questions for Mara to carry: what is a person, what kind of reason would count for you, and what comforts you without asking you to believe more than you can. The course gives you the questions, not the verdict.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **The method.** Put one question to several traditions, always *according to* each. Ask first what a person is, for every answer about death rests on that. Then name the premise, the kind of reason, and the layer of each claim: established, scholarly debate, or faith.

      **The four answers** (each with views inside it):

      | Tradition | Premise about the person | What goes on |
      |---|---|---|
      | Judaism | A whole person | Raised by God |
      | Christianity | A whole person | Raised, changed body |
      | Hindu thought | A lasting self | Reborn until moksha |
      | Buddhism | No lasting self | Causal stream reborn |

      The reasons cited are texts, tradition and experience: Scripture and the rabbis, the creeds and Gospels, the Upanishads and the Gita, the early Buddhist texts and meditation.

      **What stays open.** Whether the person is more than the working brain, and which tradition, if any, describes what follows. Near-death research and brain science bear on the first question and not directly on the second.

      **Next:** the traps round of this level, fast questions on the common mistakes made about these traditions and the new religious movements: calling a tradition a single thing, mistaking a later belief for an early one, or reading a symbol as a claim.
