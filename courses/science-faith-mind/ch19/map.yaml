id: ch19-map
title: "Content Map: Other Traditions"
kind: map
name: Level 19, other traditions (Confucius, Daoism, Jainism, Sikhism, Zoroastrianism, Indigenous and African traditions, Shinto, Gnosticism and Western esotericism, newer movements, and four answers to one question about death)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of the level on other traditions one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a label stretched too far, two views swapped, a later belief read back into an early text), and every wrong pick comes with a reason.

  Everything is taught according to the texts, the traditions and the scholars who study them; which view is right is left to each reader. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: confucius
    title: Confucius and the ethics of roles
    row: 1
    col: 1
    body: |
      According to the *Analects*, **Confucius** (traditionally 551 to 479 BCE) answered the **disorder** of a breaking Zhou world with **character in relationships**: order comes from **example and ritual (*li*)** more than from punishment. ***Ren*** is humaneness, ***junzi*** the exemplary person, and ***shu*** is **"what you do not want done to yourself, do not do to others"**. Scholars read the ethic two ways: as **virtue ethics** (character first) or as **role ethics** (a person is the sum of roles). Whether Confucianism is **a philosophy, a religion, or neither** is debated.
    decoys:
      - body: |
          According to the *Analects*, **Confucius** (traditionally 551 to 479 BCE) answered the **disorder** of a breaking Zhou world with **strict written law**: order comes from **punishment and fear** more than from example. ***Ren*** is humaneness, ***junzi*** the exemplary person, and ***shu*** is **"what you do not want done to yourself, do not do to others"**. Scholars read the ethic two ways: as **virtue ethics** (character first) or as **role ethics** (a person is the sum of roles). Whether Confucianism is **a philosophy, a religion, or neither** is debated.
        feedback: |
          That is the position of the rival Legalists. The *Analects* attributes to Confucius the view that example and ritual give people a sense of shame and of what is fitting, while fear alone leaves them without inner restraint.
      - body: |
          According to the *Analects*, **Confucius** (traditionally 551 to 479 BCE) answered the **disorder** of a breaking Zhou world with **character in relationships**: order comes from **example and ritual (*li*)** more than from punishment. ***Ren*** is humaneness, ***junzi*** the exemplary person, and ***shu*** is **"do to others whatever you want done to you"**. Scholars read the ethic two ways: as **virtue ethics** (character first) or as **role ethics** (a person is the sum of roles). Whether Confucianism is **certainly a religion, since Heaven is a creator** is debated.
        feedback: |
          *Shu* is given in the negative form, what you do not want done to you. And the *Analects* speaks of Heaven (*Tian*) as a moral power, not as a creator, so whether the tradition counts as a religion is a real debate, not a settled yes.
    explanation: |
      The first of the Chinese answers: how a broken order is repaired. It sets the contrast the next box takes up, since the Daoist texts treat fixed names and norms with suspicion.

  - id: dao
    title: Daoism, the Way
    row: 1
    col: 2
    body: |
      The *Daodejing* (attributed to **Laozi**, probably gathered **between the fifth and third centuries BCE**) and the *Zhuangzi* say that the **Way (*Dao*) cannot be captured by a fixed name**. ***Wu wei*** is **effortless, non-forcing action**, not doing nothing, and ***ziran*** is "so of itself". Fixed names and norms, on this view, can **harden into rigid distinctions**, a rival diagnosis to the roles of the *Analects*. The butterfly dream is read two ways: as **skepticism** or as **calm acceptance of transformation**. ***Daojia*** is the early school of thought and ***daojiao*** the **organised religion** (Celestial Masters, from the second century CE).
    decoys:
      - body: |
          The *Daodejing* (attributed to **Laozi**, **certainly written in the sixth century BCE by a contemporary of Confucius**) and the *Zhuangzi* say that the **Way (*Dao*) is fully captured by the right names**. ***Wu wei*** is **effortless, non-forcing action**, not doing nothing, and ***ziran*** is "so of itself". Fixed names and norms, on this view, can **harden into rigid distinctions**, a rival diagnosis to the roles of the *Analects*. The butterfly dream is read two ways: as **skepticism** or as **calm acceptance of transformation**. ***Daojia*** is the early school of thought and ***daojiao*** the **organised religion** (Celestial Masters, from the second century CE).
        feedback: |
          The book opens with the opposite warning, that the Way is not captured by any fixed name. And the dating is tradition: some scholars consider Laozi legendary, and the manuscripts (Guodian, about 300 BCE) point to a text that grew over time.
      - body: |
          The *Daodejing* (attributed to **Laozi**, probably gathered **between the fifth and third centuries BCE**) and the *Zhuangzi* say that the **Way (*Dao*) cannot be captured by a fixed name**. ***Wu wei*** is **doing nothing at all, withdrawing from action**, and ***ziran*** is "so of itself". Fixed names and norms, on this view, can **harden into rigid distinctions**, a rival diagnosis to the roles of the *Analects*. The butterfly dream is read two ways: as **skepticism** or as **calm acceptance of transformation**. ***Daojia*** is the **organised religion** and ***daojiao*** the **early school of thought**.
        feedback: |
          *Wu wei* is effortless action without tampering, as in Cook Ding's knife following the natural openings, not inaction. And the two labels are swapped: *daojia* is the early school, *daojiao* the organised religion; many scholars add that the split itself reflects Western categories.
    explanation: |
      A rival answer to the same Chinese disorder, and the first hint of a theme that returns: a clean split between "philosophy" and "religion" may be a Western habit more than the tradition's own.

  - id: jain
    title: Jainism and nonviolence
    row: 1
    col: 3
    body: |
      Jain teachers are the **tirthankaras**, 24 in each cosmic cycle, the last being **Mahavira** (traditionally 599 to 527 BCE, **by many scholars a contemporary of the Buddha**). The first of the five vows is ***ahimsa***, **non-violence**, stricter for monks and nuns than for householders. Every living thing has a soul (*jiva*), and **karma is a subtle matter that binds to the soul**. ***Anekantavada*** says **reality has many aspects**, so a single claim captures one side; *syat* means "in some respect". Some modern writers use it to teach tolerance, while Cort and Dundas call that **a later reading**.
    decoys:
      - body: |
          Jain teachers are the **tirthankaras**, 24 in each cosmic cycle, the last being **Mahavira** (traditionally 599 to 527 BCE, **a date established beyond doubt**). The first of the five vows is ***ahimsa***, **non-violence**, **the same for monks and householders**. Every living thing has a soul (*jiva*), and **karma is a subtle matter that binds to the soul**. ***Anekantavada*** says **reality has many aspects**, so a single claim captures one side; *syat* means "in some respect". Some modern writers use it to teach tolerance, while Cort and Dundas call that **a later reading**.
        feedback: |
          The dates are traditional and depend on the Buddha's own disputed chronology. And the vows come in two strengths: monks and nuns take the great vows, householders the lighter anuvratas, with a stricter reach for monastics.
      - body: |
          Jain teachers are the **tirthankaras**, 24 in each cosmic cycle, the last being **Mahavira** (traditionally 599 to 527 BCE, **by many scholars a contemporary of the Buddha**). The first of the five vows is ***ahimsa***, **non-violence**, stricter for monks and nuns than for householders. Every living thing has a soul (*jiva*), and **karma is only a moral law of cause and result**. ***Anekantavada*** says **there is no truth, so every claim is equally good**; *syat* means "in some respect". Some modern writers use it to teach tolerance, while Cort and Dundas call that **the original meaning**.
        feedback: |
          In the Jain texts karma is a subtle kind of matter that binds to the soul. And many-sidedness is not meant as relativism: each claim is tagged with its respect. Cort and Dundas hold that the tolerance reading came later, since the doctrine was first metaphysical.
    explanation: |
      Where the duty not to harm meets a picture of soul and karma, and where a doctrine can be read as metaphysics or as a lesson in tolerance.

  - id: shinto
    title: Shinto and the sacred in nature
    row: 2
    col: 1
    body: |
      According to accounts of **Shinto**, it has **no single founder and no single canon**, and it is **concerned with ritual conduct more than creed**. **Motoori Norinaga** (1730 to 1801) defined ***kami*** in essence as **any being with an eminent quality that inspires awe**, from mountains to some deceased humans. The ritual contrast is ***kegare* (pollution) and *harae* (purification)**, not sin and forgiveness. The Ise Grand Shrine is **rebuilt every 20 years**. The Meiji government built State Shinto in 1868, and the **Shinto Directive of 15 December 1945** ended state sponsorship. Whether Shinto existed as **one independent religion before modern times** is disputed (Kuroda Toshio says not).
    decoys:
      - body: |
          According to accounts of **Shinto**, it has **a single founder and a single canon**, and it is **concerned with creed more than ritual conduct**. **Motoori Norinaga** (1730 to 1801) defined ***kami*** in essence as **any being with an eminent quality that inspires awe**, from mountains to some deceased humans. The ritual contrast is ***kegare* (pollution) and *harae* (purification)**, not sin and forgiveness. The Ise Grand Shrine is **rebuilt every 20 years**. The Meiji government built State Shinto in 1868, and the **Shinto Directive of 15 December 1945** ended state sponsorship. Whether Shinto existed as **one independent religion before modern times** is disputed (Kuroda Toshio says not).
        feedback: |
          Shinto is usually described as having no founder and no single canonical text (the *Kojiki* and *Nihon Shoki* tell of the kami but are not a creed), and it is centred on rites. So "what do you believe?" may be the wrong question.
      - body: |
          According to accounts of **Shinto**, it has **no single founder and no single canon**, and it is **concerned with ritual conduct more than creed**. **Motoori Norinaga** (1730 to 1801) defined ***kami*** in essence as **any being that is omnipotent and created the world**, from mountains to some deceased humans. The ritual contrast is ***kegare* (pollution) and *harae* (purification)**, not sin and forgiveness. The Ise Grand Shrine is **rebuilt every 20 years**. The Meiji government built State Shinto in 1868, and the **Shinto Directive of 15 December 1945** ended state sponsorship. Whether Shinto existed as **one independent religion before modern times** is disputed (Kuroda Toshio says not).
        feedback: |
          Kami are not regarded as omnipotent or as creators of everything; on Motoori's definition they are beings with an eminent quality that inspires awe, and some must be appeased.
    explanation: |
      A tradition of practice before doctrine, which makes the next box urgent: if "what do you believe?" is the wrong question, is the word "religion" the right tool?

  - id: indigenous
    title: Indigenous and African traditions, and the word "religion"
    row: 2
    col: 2
    body: |
      Wilfred Cantwell Smith (*The Meaning and End of Religion*, 1962) argued that **"religion" is a late European habit** and proposed **"cumulative tradition" and "faith"**; others hold the word is still needed if used with care. John Mbiti (1931 to 2019) described the **living-dead**, remembered dead who stay in the family, and the time words ***sasa*** and ***zamani***; Gyekye replied that this is **false for the Akan language and too general**. Place-based traditions tie **land to origins and kin**, and a *jali* keeps history by **trained oral recitation**. Africa's many languages make **"the African religion" a mistake of scale**.
    decoys:
      - body: |
          Wilfred Cantwell Smith (*The Meaning and End of Religion*, 1962) argued that **"religion" is a timeless category found in every culture** and proposed **"cumulative tradition" and "faith"**; others hold the word is still needed if used with care. John Mbiti (1931 to 2019) described the **living-dead**, remembered dead who stay in the family, and the time words ***sasa*** and ***zamani***; Gyekye replied that this is **false for the Akan language and too general**. Place-based traditions tie **land to origins and kin**, and a *jali* keeps history by **trained oral recitation**. Africa's many languages make **"the African religion" a mistake of scale**.
        feedback: |
          Smith argued the opposite: that "religion" as a thing is a late European habit, and he proposed "cumulative tradition" and "faith" instead.
      - body: |
          Wilfred Cantwell Smith (*The Meaning and End of Religion*, 1962) argued that **"religion" is a late European habit** and proposed **"cumulative tradition" and "faith"**; others hold the word is still needed if used with care. John Mbiti (1931 to 2019) described the **living-dead**, remembered dead who stay in the family, and the time words ***sasa*** and ***zamani***; Gyekye **confirmed it for all of Africa**. Place-based traditions tie **land to origins and kin**, and a *jali* keeps history by **writing it down in a fixed canon**. Africa's many languages make **"the African religion" a mistake of scale**.
        feedback: |
          Gyekye criticised the account as too general and false for the Akan language. And a *jali* (griot) memorises and performs history aloud, often with music, steadied by metre and repetition; the stories do shift in the telling.
    explanation: |
      The level's hinge on method: the word "religion" is a tool that has to be tested tradition by tradition, and early writing about these traditions often came through missionaries and officials.

  - id: sikh
    title: Sikhism
    row: 2
    col: 3
    body: |
      According to Sikh tradition, **Guru Nanak** (1469 to 1539) was the first of **ten Gurus**, and the tenth founded the **Khalsa in 1699**. The scripture opens with ***Ik Onkar***, "there is one God", and the ***Mool Mantar***, a list of attributes; God is both **beyond attributes (*nirgun*) and present in creation (*sargun*)**, and is **not born in human form**. The *Adi Granth* (1603 to 1604) includes **hymns of Hindu and Muslim saints such as Kabir, Ravidas and Farid**, and in 1708 it became the **Guru Granth Sahib**, the living Guru. The *langar* is a **free communal meal for all**; yet village studies record **caste distinctions in practice**.
    decoys:
      - body: |
          According to Sikh tradition, **Guru Nanak** (1469 to 1539) was the first of **ten Gurus**, and the tenth founded the **Khalsa in 1699**. The scripture opens with ***Ik Onkar***, "there is one God", and the ***Mool Mantar***, a list of attributes; God is both **beyond attributes (*nirgun*) and present in creation (*sargun*)**, and is **born again in each Guru**. The *Adi Granth* (1603 to 1604) includes **hymns of the Sikh Gurus only**, and in 1708 it became the **Guru Granth Sahib**, the living Guru. The *langar* is a **free communal meal for all**; yet village studies record **caste distinctions in practice**.
        feedback: |
          The tradition does not hold that God takes birth in human form, and the Gurus are not treated as incarnations. And the *Adi Granth* also contains hymns of Hindu and Muslim saints such as Kabir, Ravidas and Farid.
      - body: |
          According to Sikh tradition, **Guru Nanak** (1469 to 1539) was the first of **ten Gurus**, and the tenth founded the **Khalsa in 1699**. The scripture opens with ***Ik Onkar***, "there is one God", and the ***Mool Mantar***, a list of attributes; God is both **beyond attributes (*nirgun*) and present in creation (*sargun*)**, and is **not born in human form**. The *Adi Granth* (1603 to 1604) includes **hymns of Hindu and Muslim saints such as Kabir, Ravidas and Farid**, and in 1708 it became the **Guru Granth Sahib**, the living Guru. The *langar* is a **meal served by caste, in separate rows**; the **ideal and practice agree fully**.
        feedback: |
          The langar is served to all, seated together regardless of caste. Scholars add that Punjab village studies record caste distinctions in practice, so the ideal and the social facts differ.
    explanation: |
      A tradition born in the Punjab late in the fifteenth century, with a scripture that gathers voices from several backgrounds, and a clear gap between an egalitarian ideal and social practice.

  - id: zoroaster
    title: Zoroastrianism and ancient dualism
    row: 3
    col: 1
    body: |
      The oldest layer of the *Avesta* is the ***Gathas***, five poems in **Old Avestan**, traditionally ascribed to **Zarathustra**, whose date scholars place **around 1500 to 1000 BCE** (many now about 1000), the tradition's own 6th century being the late option. ***Ahura Mazda*** is the wise Lord and good creator; the moral axis is ***asha* (truth) against *druj* (the Lie)**. Whether this is **monotheism with an ethical dualism**, or something else, depends on what *monotheism* requires. The three ages **creation, mixture, separation** and the Chinvat bridge come from **later texts**. Persian influence on Judaism is **a live debate**.
    decoys:
      - body: |
          The oldest layer of the *Avesta* is the ***Gathas***, five poems in **Middle Persian**, traditionally ascribed to **Zarathustra**, whose date scholars place **around 1500 to 1000 BCE** (many now about 1000), the tradition's own 6th century being the late option. ***Ahura Mazda*** is the wise Lord and good creator; the moral axis is ***asha* (truth) against *druj* (the Lie)**. Whether this is **monotheism with an ethical dualism**, or something else, depends on what *monotheism* requires. The three ages **creation, mixture, separation** and the Chinvat bridge come from **later texts**. Persian influence on Judaism is **a live debate**.
        feedback: |
          The Gathas are in Old Avestan. Middle Persian is the language of later books such as the *Bundahishn*, a ninth-century work.
      - body: |
          The oldest layer of the *Avesta* is the ***Gathas***, five poems in **Old Avestan**, traditionally ascribed to **Zarathustra**, whose date scholars place **around 1500 to 1000 BCE** (many now about 1000), the tradition's own 6th century being the late option. ***Ahura Mazda*** is the wise Lord and good creator; the moral axis is ***asha* (truth) against *druj* (the Lie)**. Whether this is **monotheism with an ethical dualism**, or something else, depends on what *monotheism* requires. The three ages **creation, mixture, separation** and the Chinvat bridge are **all stated in the Gathas themselves**. Persian influence on Judaism is **proved**.
        feedback: |
          The detailed sequence of ages and the Chinvat bridge come from later texts; the Gathas stress the renewal of the world and each person's choice. And influence on Judaism is argued (Boyce for it, Barr and others cautious), generally accepted in some form but disputed in where and how much, not proved.
    explanation: |
      The ancient case of a good-against-evil picture, and the model of a question the level keeps asking: what is early text, what is later tradition, and what is argued influence.

  - id: esoteric
    title: Gnosticism and Western esotericism
    row: 3
    col: 2
    body: |
      The **Nag Hammadi library**, found in Egypt in **late 1945**, holds **52 mostly Gnostic treatises** in Coptic, among them the Gospel of Thomas. Williams (1996) and King (2003) argue that **"Gnosticism" is a modern category**, while Brakke (2010) keeps the name for **a specific school known to Irenaeus**. Ficino translated the *Corpus Hermeticum* in 1463; **Casaubon in 1614 argued from the Greek that it is early Christian era, not remote antiquity**. Astrology can be tested against chance: for 120 charts matched to 3 profiles, guessing gives **40 hits with spread about 5.2**. Hanegraaff treats esotericism as **"rejected knowledge"**.
    decoys:
      - body: |
          The **Nag Hammadi library**, found in Egypt in **late 1945**, holds **52 mostly Gnostic treatises** in Coptic, among them the Gospel of Thomas. Williams (1996) and King (2003) argue that **"Gnosticism" is one ancient religion with a single creed**, while Brakke (2010) keeps the name for **a specific school known to Irenaeus**. Ficino translated the *Corpus Hermeticum* in 1463; **Casaubon in 1614 argued from the Greek that it is early Christian era, not remote antiquity**. Astrology can be tested against chance: for 120 charts matched to 3 profiles, guessing gives **40 hits with spread about 5.2**. Hanegraaff treats esotericism as **"rejected knowledge"**.
        feedback: |
          Williams and King argued the reverse: that "Gnosticism" is a modern category, a label that lumps together varied ancient currents, partly shaped by the way opponents such as Irenaeus described them.
      - body: |
          The **Nag Hammadi library**, found in Egypt in **late 1945**, holds **52 mostly Gnostic treatises** in Coptic, among them the Gospel of Thomas. Williams (1996) and King (2003) argue that **"Gnosticism" is a modern category**, while Brakke (2010) keeps the name for **a specific school known to Irenaeus**. Ficino translated the *Corpus Hermeticum* in 1463; **Casaubon in 1614 argued from the Greek that it dates from remote Egyptian antiquity**. Astrology can be tested against chance: for 120 charts matched to 3 profiles, guessing gives **60 hits with spread about 10**. Hanegraaff treats esotericism as **"rejected knowledge"**.
        feedback: |
          Casaubon's argument from the Greek vocabulary was that the texts are not ancient Egyptian but from the early Christian centuries. And with $p = 1/3$ and $n = 120$, $\mu = np = 40$ and $\sigma = \sqrt{np(1-p)} \approx 5.2$.
    explanation: |
      Hidden-knowledge currents examined by historians: a contested label, a dating by language, and a claim (astrology) that can be set against chance, all without asserting or denying the claims themselves.

  - id: movements
    title: Newer movements
    row: 3
    col: 3
    body: |
      According to its members, the **Baha'i Faith** teaches **progressive revelation**: one God sends successive Manifestations, the Báb (mission 1844) and **Bahá'u'lláh (1817 to 1892)** being the latest, with **no clergy and elected Spiritual Assemblies**, and since 1963 a Universal House of Justice. **Joseph Smith** (1805 to 1844) said an angel led him to golden plates; most historians conclude he **composed the Book of Mormon himself**, believers hold it is an ancient record, and Latter-day Saints describe the Father, Son and Spirit as **distinct beings, one in purpose**. **New Age** is, for Hanegraaff, a secularised form of esoteric currents, a **milieu with no central authority**.
    decoys:
      - body: |
          According to its members, the **Baha'i Faith** teaches **that only one prophet ever spoke**: one God sends successive Manifestations, the Báb (mission 1844) and **Bahá'u'lláh (1817 to 1892)** being the latest, with **no clergy and elected Spiritual Assemblies**, and since 1963 a Universal House of Justice. **Joseph Smith** (1805 to 1844) said an angel led him to golden plates; most historians conclude he **composed the Book of Mormon himself**, believers hold it is an ancient record, and Latter-day Saints describe the Father, Son and Spirit as **distinct beings, one in purpose**. **New Age** is, for Hanegraaff, a secularised form of esoteric currents, a **milieu with no central authority**.
        feedback: |
          The doctrine is the opposite: progressive revelation, a series of Manifestations (Buddha, Jesus, Muhammad, the Báb, Bahá'u'lláh), each bringing a message for his time.
      - body: |
          According to its members, the **Baha'i Faith** teaches **progressive revelation**: one God sends successive Manifestations, the Báb (mission 1844) and **Bahá'u'lláh (1817 to 1892)** being the latest, with **no clergy and elected Spiritual Assemblies**, and since 1963 a Universal House of Justice. **Joseph Smith** (1805 to 1844) said an angel led him to golden plates; most historians conclude he **composed the Book of Mormon himself**, believers hold it is an ancient record, and Latter-day Saints describe the Father, Son and Spirit as **one being in three modes, as the Nicene creed says**. **New Age** is, for Hanegraaff, **a single church with a central authority**.
        feedback: |
          Latter-day Saints describe three distinct beings one in purpose, which many other Christians dispute as departing from the creeds. And New Age has no central authority, which is why scholars call it a milieu.
    explanation: |
      Movements of the last two centuries, each with a claim of new revelation or authority: what members hold, what historians conclude, and the three layers kept apart.

  - id: compare
    title: Four answers to one question about death
    row: 4
    col: 2
    body: |
      Put one question to several traditions, always *according to* each. **First ask what a person is**, since each answer rests on that premise. **Judaism**: a whole person, raised by God (the Psalms speak of Sheol, **Daniel 12:2** is the earliest clear biblical statement of resurrection). **Christianity**: a whole person, **raised in a changed body**, as the creeds say. **Hindu thought**: a lasting self (*atman*) **reborn until *moksha***. **Buddhism**: no lasting self, so a **causal stream reborn**, like a flame passed between candles. Brain science and near-death studies bear on **what the person is**, not directly on **which tradition describes what follows**.
    decoys:
      - body: |
          Put one question to several traditions, always *according to* each. **First ask what a person is**, since each answer rests on that premise. **Judaism**: a whole person, raised by God (the Psalms speak of Sheol, **Daniel 12:2** is the earliest clear biblical statement of resurrection). **Christianity**: **an immortal soul that leaves the body, with no bodily resurrection**, as the creeds say. **Hindu thought**: a lasting self (*atman*) **reborn until *moksha***. **Buddhism**: no lasting self, so a **causal stream reborn**, like a flame passed between candles. Brain science and near-death studies bear on **what the person is**, not directly on **which tradition describes what follows**.
        feedback: |
          The creeds speak of the resurrection of the body (the Apostles' Creed) and the resurrection of the dead. Christian views on how the whole person is raised in a changed body differ in detail, but the creeds do not drop the body.
      - body: |
          Put one question to several traditions, always *according to* each. **First ask what a person is**, since each answer rests on that premise. **Judaism**: a whole person, raised by God (the Psalms speak of Sheol, **Daniel 12:2** is the earliest clear biblical statement of resurrection). **Christianity**: a whole person, **raised in a changed body**, as the creeds say. **Hindu thought**: a lasting self (*atman*) **reborn until *moksha***. **Buddhism**: **the same soul passes unchanged into a new body**, like a flame passed between candles. Brain science and near-death studies **settle which tradition is right**.
        feedback: |
          Buddhism denies a lasting self: what continues is a stream of conditions, neither the same nor another, as the flame image is meant to show. And brain studies and near-death research bear on what a person is, not directly on which tradition describes what follows.
    explanation: |
      The level's method in one box: name the premise about the self, the kind of reason each tradition cites, and the layer of each claim, and then say where thoughtful people part.

