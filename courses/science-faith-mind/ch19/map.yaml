outroTitle: Other traditions in one picture
outro: |
  Confucius and the Daoist books answer the same Chinese disorder in opposite ways, roles and ritual against suspicion of fixed names, and the Daoist case already shows how doubtful a clean line between philosophy and religion can be. Shinto, a tradition of rite more than creed, and the Indigenous and African traditions press the point: the word "religion" is a tool to be tested tradition by tradition, and early writing about these traditions often came through outsiders. Jainism and Sikhism, born in India, show a duty not to harm and an ideal of equality, each with a gap or a debate about how the teaching is read. Zoroastrianism brings an early picture of good against evil and a live question about influence. Gnosticism, Hermetic writings and the newer movements ask what is early and what is later, what members hold and what historians conclude. Four answers to one question about death rest on four premises about the person. Throughout, texts and dates are established, readings are debated, and claims about gods, ancestors, revelations and what follows death are matters of faith.
