id: ch19-indigenous
title: "Indigenous and African Traditions"
kind: concept
own: |
  The setting: the many Indigenous and African traditions of the world, which scholars study through the writing of insiders and outsiders alike, and which are taught here according to the sources named in the lesson. Which of their claims about ancestors, land or the world are true is left to each reader.
  - **The word "religion".** In *The Meaning and End of Religion* (1962) Wilfred Cantwell Smith argued that "religion" is a late European habit of treating a way of life as a thing, and proposed {{ "cumulative tradition" and "faith" }} instead. Others, including Kwame Anthony Appiah, hold that the word is still needed if used with care. So the word is {{ a useful tool for some scholars and a distortion for others }}, and it has to be tested language by language and people by people.
  - **Ancestors and time.** The Kenyan scholar John Mbiti (1931 to 2019), in *African Religions and Philosophy* (1969), described the "living-dead": dead relatives who are still remembered by name and still part of the family. In his scheme of time, *sasa* is the present with its near future and *zamani* is the great store of the past, and a remembered person is in sasa until nobody who knew them is alive, when they pass into zamani. Critics such as Kwame Gyekye replied that this is {{ false for the Akan language and too general, built on a small part of Africa }}.
  - **Land and kin.** According to accounts of the Aboriginal Australian Dreaming (a term devised by early anthropologists; Warlpiri say *Jukurrpa*), places are tied to their origins and the land is treated as kin, not as a commodity. W. E. H. Stanner called it the "everywhen", and the groups concerned, about 250 language groups on the count Wikipedia cites, do not all use one word or one story. Place-based traditions usually do not seek to {{ convert the world or speak for all humanity }}.
  - **Oral knowledge.** A *jali* (West African griot) memorises and performs history, often with music. Oral traditions steady themselves by metre, stock phrases and repeated trained recitation, yet stories do shift in the telling. Nunn and Reid (2016) argued that 21 Aboriginal coastal stories record flooding by rising seas {{ more than 7,000 years ago }}; the historian David Henige replied that this {{ can neither be verified nor falsified }}.
  - **Diversity and bias.** Africa's languages are estimated at 1,250 to 2,100, by some counts over 3,000, so "the African religion" is a mistake of scale. Much of the early writing came through missionaries and colonial officials: E. B. Tylor built his theory of animism (spirit-belief as the root of religion) on a missionary's report of Zulu dreams, and left out a detail that did not fit.
  - **Three layers.** Established: the texts, recordings and practices, who wrote what and when. Debated: whether "religion" is a fair label, how general Mbiti's account is, how old an oral memory can be. Faith: that ancestors still take part in the family, or that the land holds the law of its makers.

cards:
  - type: mcq
    id: hook
    title: "Guess: what is at the centre?"
    prompt: |
      Guessing is the point; no background is needed. Imagine a way of life with no single founder, no sacred book and no everyday word that means "religion". Its knowledge is spoken, not written, and it is tied to one homeland and one set of families. Which description of its centre would you most expect?
    options:
      - text: "A way of living with kin, ancestors and a particular place, carried out in practice rather than believed as a list of doctrines."
        correct: true
        feedback: |
          This is close to how many scholars and many members of such communities describe it, which is why it is a good first guess. It is a generalisation, and the rest of the lesson asks how far it holds, for whom, and who is describing it.
      - text: "A list of doctrines that every member must accept, as in a creed."
        feedback: |
          This is the shape the word "religion" has in much of European history, which is exactly why the guess is tempting. The lesson asks whether that shape fits a tradition with no creed and no founder.
      - text: "Nothing: with no book, no founder and no word for it, it cannot be a serious tradition."
        feedback: |
          This mistakes the form of the evidence for its absence. Many traditions of this kind are carried by memory, ritual and family, and their members and scholars treat them as full traditions.
    explanation: |
      The lesson keeps three questions. Why does the word "religion" fit awkwardly, and who says so? What do accounts of ancestors, land and oral memory claim, and where do scholars part ways? And whose voice are we reading? It follows the habit of the course: facts, debates and faith commitments kept apart.

  - type: text
    id: word
    title: "Why the word fits awkwardly"
    body: |
      The English word *religion* has a history. According to Wikipedia's account, the Latin *religio* meant roughly a sense of duty or obligation, "religion" entered English around the 1200s for a life bound by monastic vows, and the idea of a separate domain apart from ordinary life was not used before the 1500s. The same article reports that there is no precise equivalent in Hebrew, and that the *Encyclopaedia of the Qur'an* says English "religion" had no direct Arabic equivalent before the twentieth century. Whether the same holds for a particular Indigenous or African language has to be checked for that language, and this lesson does not claim it for all.

      The Canadian scholar **Wilfred Cantwell Smith** (1916 to 2000) made the point famous in *The Meaning and End of Religion* (1962). As Kwame Anthony Appiah summarises him, Smith traced the late European emergence of the concept, argued that "religion" lumped together too many things, and urged using **faith** (a person's own response to what they take to be ultimate) and **cumulative tradition** (the visible record of practices, buildings and texts) instead. **Brent Nongbri**, in *Before Religion* (2013), shows that the Romans had no category matching our modern one, and **Talal Asad** traced both "religion" and "the secular" to the habits of Western modernity. Appiah himself concludes that the word resists definition yet remains necessary, because it still does work in law, research and personal life, and should be used carefully and case by case.

  - type: mcq
    id: word-q
    title: "A fair statement"
    prompt: |
      Which statement of the dispute about the word "religion" would both a defender and a critic of the word accept as fair?
    options:
      - text: "Some scholars argue that the word carries a European shape (creed, founder, a domain apart from life) that distorts traditions lacking it; others reply that it still works if used carefully, so it is a tool for some purposes and a distortion for others."
        correct: true
        feedback: |
          Yes. It names both sides and keeps the layer visible: a scholarly debate about a category, not a fact about any one tradition.
      - text: "The word is simply wrong, so these traditions are not religions and have no spiritual life."
        feedback: |
          Smith and Asad question the category, not the depth of the traditions. Saying a word fits badly does not say that what it points to is empty.
      - text: "The word fits everything perfectly, because every people everywhere has a religion in the European sense."
        feedback: |
          This passes a contested assumption off as fact. The history of the word and the lack of exact equivalents in several languages are exactly what the critics point to.
    explanation: |
      Compare the lesson Where Religion Comes From and the tours of the large traditions, where the same word was used without pause. Here we slow it down: a category can help a comparison and still bend what it compares.

  - type: text
    id: mbiti
    title: "Ancestors and the living-dead"
    body: |
      The Kenyan scholar **John Mbiti** (1931 to 2019) published *African Religions and Philosophy* in 1969. According to the Wikipedia page on him, it challenged the Christian assumption that traditional African ideas were demonic, and it contains his line "Wherever the African is, there is religion". He wrote openly from a Christian standpoint. His key idea here is the **living-dead**: relatives who have died but are still remembered by the living, still part of the family. As quoted in a 2026 study, he wrote:

      > "The living-dead are still part of their human families, and people have personal memories of them."

      Mbiti linked this to a view of time. As one reading of him puts it, *sasa* is the dimension of the present and the immediately possible future, and *zamani* is a final storehouse of past events, which he likened to a kind of graveyard of time. A dead person who is still remembered by someone alive belongs to sasa; as one summary of his scheme says, when nobody is left to remember them they move back from sasa into zamani. He also wrote that time is "a two-dimensional phenomenon, with a long past, a present, and virtually no future" (as Moses Òkè quotes him).

  - type: mcq
    id: mbiti-q
    title: "Remembered, then not"
    prompt: |
      A woman died thirty years ago. Her daughter, who remembers her well, is still alive. According to Mbiti's scheme as summarised above, which description is right, and what will happen when the daughter dies and no one else knew the woman?
    options:
      - text: "She is among the living-dead now, in sasa, because she is remembered; when no one remembers her she passes into zamani, the great store of the past."
        correct: true
        feedback: |
          Yes. Remembering by name is what keeps a person in sasa. Passing into zamani is not nothingness; one summary says the person then becomes a full spirit.
      - text: "She is simply dead and gone from the day of her death; the daughter keeps only a private memory."
        feedback: |
          That is a different view of death. In Mbiti's account the remembered dead still belong to the family, which is why the card speaks of the living-dead.
      - text: "She remains among the living-dead forever, however long ago and whether or not anyone remembers her."
        feedback: |
          In Mbiti's scheme it is remembering that holds a person in sasa, so the status changes when the last person who knew her dies.
    explanation: |
      This is Mbiti's account, taught according to him. Whether it is a fair picture of any one people, or of all of them, is the next question, and Mbiti's own critics ask it.

  - type: text
    id: critics
    title: "The critics of Mbiti"
    body: |
      The claim that Africans have "virtually no future" in their idea of time drew sharp replies. **Kwame Gyekye** reviewed the book in 1975; according to Moses Òkè's summary, Gyekye argued from the Akan language that Mbiti was **false** (the Akan did have the concept of future time) and **fallacious** (he generalised too hastily from a very small part of Africa to the whole continent). Òkè himself concluded that the most one can say is that Africans lack "time-discipline", not the concept of the future. **D. A. Masolo** is reported as saying that Mbiti described beliefs without philosophical analysis, and **Segun Gbadegesin** called the thesis a report of a communal worldview without an attempt to evaluate it. **Okot p'Bitek** argued that Mbiti cast his arguments in Western-established terms and made African ideas of God look like the Christian God, a point the Wikipedia page notes Mbiti never answered, according to the historian Derek Peterson.

      The critics do not deny that many peoples honour their dead. They question the step from a few peoples' ideas to "the African view" and the step from description to a claim about all of Africa. A fair reading of Mbiti keeps both: a pioneering and influential account, and a contested generalisation.

  - type: mcq
    id: critics-q
    title: "What does Gyekye's reply say?"
    prompt: |
      According to Moses Òkè's summary, which is the best statement of Gyekye's objection to Mbiti's account of time?
    options:
      - text: "From the Akan language, Africans did have a concept of future time, so Mbiti's claim is false; and he generalised from a very small part of Africa to the whole continent."
        correct: true
        feedback: |
          Yes. There are two parts: a factual claim about the Akan, and a charge of over-generalising.
      - text: "Gyekye held that ancestors do not matter to African peoples at all."
        feedback: |
          He objected to the claim about time and its scope, not to the importance of ancestors in many African societies.
      - text: "Gyekye accepted Mbiti's account in full and only asked for more examples."
        feedback: |
          His review called the account false and fallacious. Other critics, such as Gbadegesin, asked for evaluation, but that is a different complaint.
    explanation: |
      A good habit for any "African view of X": ask whose language, which people, and from what evidence. The same habit applies to "the Aboriginal view" in the next card.

  - type: text
    id: dreaming
    title: "Land, place and kin: the Dreaming"
    body: |
      The example is the **Dreaming** (also "Dreamtime") of Aboriginal Australians. According to Wikipedia's article, it is a term devised by early anthropologists (Francis Gillen used it in 1896, Spencer and Gillen popularised it) for a worldview in which ancestral beings made the land and set patterns for life; groups use their own words, such as *Jukurrpa* among the Warlpiri. The article says it ties people, plants, animals and land features together and explains how these relationships arose and must be kept up, that particular places carry a Dreaming origin, and that land is a kin relation rather than a commodity.

      The anthropologist **W. E. H. Stanner** called it the **everywhen**, a reality in which past, present and future coexist, not a far distant past. Wikipedia also reports that some Aboriginal people object to the word "Dreaming" because it sounds like something unreal, that Strehlow wrote in 1908 that the Arrernte knew nothing of "dreamtime" as a period of their history, and that the article cites the Australian Institute of Aboriginal and Torres Strait Islander Studies (AIATSIS) for about 250 distinct language groups, so the concept varies. This lesson does not describe ceremonies or sacred sites, since many are not for outsiders.

  - type: mcq
    id: dreaming-q
    title: "A careful reply"
    prompt: |
      A visitor says: "Aboriginal religion is about a distant past called the Dreamtime, so it is basically a set of old myths about long ago, the same everywhere in Australia." According to the sources above, which reply is the most careful?
    options:
      - text: "Stanner called it the everywhen, not a far past; the English word is a translation some people dispute; and with about 250 language groups, the concept varies from one people to another."
        correct: true
        feedback: |
          Yes. It corrects the time picture, notes that the word is outsiders' and disputed, and refuses to flatten many peoples into one.
      - text: "Yes: all groups use the word Dreamtime for a single creation story."
        feedback: |
          Groups use their own words, such as Jukurrpa, and the word "Dreamtime" was devised by early anthropologists.
      - text: "The Dreaming is only a story about nature and has nothing to do with how people live or relate to each other."
        feedback: |
          According to the same article it sets patterns for life and relates people to land, plants and animals, so it is bound up with kin and conduct.
    explanation: |
      Layer 1: that the term exists and has this history. Layer 2: how best to translate and generalise it. Layer 3: that the ancestral beings made the land, which is a belief held by those who live this tradition, not a claim this lesson tests.

  - type: mcq
    id: place-q
    title: "Place-based or universal?"
    prompt: |
      Many traditions tied to a homeland and its families do not usually try to convert outsiders, while Christianity and Islam address all people. Wikipedia's article on religion in Africa, for instance, says the West African traditions it describes have no missionaries and no intent to proselytise. Which statement draws the contrast fairly?
    options:
      - text: "Place-based traditions usually tie their obligations and meaning to particular land and kin, so they do not ordinarily aim to speak for all humanity; universal traditions claim truths for everyone. That is a generalisation with exceptions, and neither shape says anything about whether a tradition is true."
        correct: true
        feedback: |
          Yes. It states a tendency, admits exceptions, and does not turn a difference in aim into a verdict on truth.
      - text: "A tradition tied to a place is local and therefore less true than one that claims to be universal."
        feedback: |
          Reach is not evidence. A claim can be universal and false, or local and true. Neither shape decides the question.
      - text: "A tradition that does not convert others has no claims about the world at all."
        feedback: |
          These traditions make many claims about ancestors, land and the order of things. They simply do not usually ask outsiders to accept them.
    explanation: |
      This is a point about how a claim is aimed, not about its truth. It matters later in the course: a universal claim can be tested against any person's evidence, while a place-bound one raises other questions (what the land owes the people and the people owe the land).

  - type: text
    id: oral
    title: "Oral knowledge: memory, music and trained keepers"
    image:
      src: img/jali-kora.webp
      alt: "A man in a red robe seated and playing a large round-bodied kora, a West African harp-lute with many strings, behind a microphone."
      caption: "Jali Fily Cissokho, a Mandinka kora player from Senegal, performing at the Pitt Rivers Museum in 2008. A jali is, according to Wikipedia, a West African specialist in memorising and performing history, often with music."
      credit: "kevinzim, CC BY 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Jali_Fily_Cissokho_-_Kora-Player.jpg"
    body: |
      A tradition without a written scripture still has a way to keep what matters. According to Wikipedia, a **griot** (in the Manding languages a **jali** or *jeli*) is a West African historian, storyteller, praise singer and musician who preserves history and tradition orally, and is found among the Mande, Wolof, Hausa and other peoples. Training is by observation, repetition and guided participation, and the article notes that performers adapt a telling to the audience, so versions can vary.

      Scholars of oral tradition name several devices that steady a spoken text. Rhythm, alliteration, repetition and proverbs help recall, and a fixed metre lets a performer notice a wrong line. Milman Parry and Albert Lord found that Homeric verse was composed with **stock phrases** that fit the metre, not word-for-word memorisation. The Vedic texts of India were kept by several recitation methods that cross-check each other. The same article adds that stories are often altered at each telling, so long as the overall meaning is kept.

  - type: mcq
    id: oral-q
    title: "What steadies a spoken story?"
    prompt: |
      Select every device that, according to the account above, helps an oral tradition keep a story stable.
    multiple: true
    options:
      - text: "A fixed metre or rhythm, so that a changed line breaks the pattern and can be noticed."
        correct: true
        feedback: |
          Yes. Verse with an exact beat acts as a check on itself.
      - text: "Stock phrases that fit the metre and can be reused, as Parry and Lord found in Homeric verse."
        correct: true
        feedback: |
          Yes. They are building blocks, so the performer composes within a pattern.
      - text: "Training by repetition and guided participation, with a teacher passing the performance on."
        correct: true
        feedback: |
          Yes. This is how the article describes a griot learning.
      - text: "Word-for-word memorisation of a fixed script, performed identically every time."
        feedback: |
          Parry and Lord found the opposite for Homeric verse: composition from formulas, not rote memory. Stories are also adapted to audiences, so identical performance is not the norm.
      - text: "Each performer deliberately changing the story so that it never repeats."
        feedback: |
          That would erase the tradition. Changes happen, but the aim is to keep the meaning.
    explanation: |
      What writing changes is the kind of check: a page can be compared with another page, while a performance is compared with a trained memory. What it does not change is the need to ask who kept the text, with what motive and how it shifted. The contrast is not "reliable writing, unreliable speech", since written copies also vary (see the lessons The Torah and the Documentary Hypothesis and The Synoptic Problem and the Gospels).

  - type: text
    id: deep
    title: "How far back can a memory reach?"
    body: |
      In 2016 **Patrick Nunn and Nicholas Reid** published a paper in *Australian Geographer* in which they matched 21 Aboriginal stories from 21 coastal locations around the Australian mainland against sea-level reconstructions. They argued that the stories describe the flooding of land by the rising sea at the end of the last ice age, and that they have endured since between about 7,250 and 13,070 years ago, which would make them among the oldest memories of any people. Nineteen of the stories came from written sources collected over about two centuries, two from interviews.

      The historian **David Henige** of the University of Wisconsin–Madison replied that very, very few oral traditions have escaped changing over even brief observable periods, and that a claim of more than 7,000 years "can neither be verified nor falsified". The archaeologist **Elizabeth Barber** found the study persuasive, since the people concerned could have seen the new islands and channels the sea made. The paper itself notes that many scholars treat oral transmission as reliable for only about 500 to 800 years.

  - type: mcq
    id: deep-q
    title: "A fair summary"
    prompt: |
      Which statement of the sea-level stories debate is fair to both Nunn and Reid and to Henige?
    options:
      - text: "Nunn and Reid argue that the stories match ancient floods and so preserve memory for over 7,000 years; Henige replies that such a claim cannot be verified or falsified and that traditions change. It is a live scholarly debate, not a settled result."
        correct: true
        feedback: |
          Yes. It gives the evidence offered, the objection, and the layer.
      - text: "The stories have proved that oral tradition never changes."
        feedback: |
          Nobody claims this; even supporters accept that stories adapt, and the debate is about how much stays.
      - text: "Oral tradition cannot preserve any real event beyond a single generation."
        feedback: |
          Even sceptics put the limit in centuries, not one generation, and the stories above are argued to be far older. The disagreement is over how far.
    explanation: |
      The method is the one used for any ancient memory: which stories, from where, how recorded, what the independent evidence says, and who benefits from believing it. For the people concerned, the stories may also carry meanings that no date could test.

  - type: text
    id: voices
    title: "Diversity and whose voice we read"
    body: |
      Two cautions complete the picture. First, scale. According to Wikipedia, the number of languages natively spoken in Africa is variously estimated at 1,250 to 2,100, and by some counts at over 3,000, and the article on religion in Africa says there is no single unified religion across a continent of many nations. So "the African religion" is a mistake of scale. The same goes for "Native American" or "Aboriginal" taken as one thing: the 250-or-so language groups of Australia alone are a reminder.

      Second, whose account we read. **E. B. Tylor** (a nineteenth-century anthropologist) built his theory of **animism**, spirit-belief as the root of religion, partly on the account of Zulu dreams by the Anglican missionary Callaway in Natal, who got it from a Christian convert, Mbande. Johan Strijdom, summarising David Chidester, calls this a process of triple mediation, and reports that Tylor left out a detail in Mbande's story, dreams of ancestral spirits who came to kill the dreamer, and kept only the part that fitted his theory. Mbiti, too, wrote as a Christian, and p'Bitek charged that he bent African ideas to fit it. Insiders speak too, in their own voices and not always agreeing, and a careful reader asks of every source: who is speaking, to whom, and through how many hands?

  - type: mcq
    id: voices-q
    title: "A weak sentence"
    prompt: |
      A textbook says: "African religion teaches that the dead live in the village and have no future." What is the main problem with this sentence, according to the lesson?
    options:
      - text: "It treats a continent of many peoples and languages as one tradition, and may rest on accounts filtered through missionaries or outsiders; it should say which people and whose account."
        correct: true
        feedback: |
          Yes. Scale and source are the two checks. A better version names a people ("among the Akan...", "Mbiti describes...") and the source.
      - text: "It is wrong because Africans do not honour their dead."
        feedback: |
          Many peoples do honour their dead, as Mbiti and his critics agree. The fault is the sweeping form, not the topic.
      - text: "It is fine, because a short summary has to simplify."
        feedback: |
          A short summary may simplify, but not by turning the very many peoples of a continent into one view. That is the mistake Gyekye accuses Mbiti of making.
    explanation: |
      The rewriting rule of this course applies: "according to whom, about which people". It is a courtesy to the living and a check on the claim.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    prompt: |
      Select every statement that is **established or documented** (not a matter of faith or live scholarly debate).
    multiple: true
    options:
      - text: "Mbiti published *African Religions and Philosophy* in 1969."
        correct: true
        feedback: |
          Yes: a documented fact about a book.
      - text: "Griots are West African specialists who preserve history by memorising and performing it."
        correct: true
        feedback: |
          Yes: a documented description of a practice, as reported by the encyclopedic account.
      - text: "Africans have virtually no concept of future time."
        feedback: |
          This is Mbiti's thesis, and Gyekye and Òkè reply that it is false or over-general. Layer 2.
      - text: "Aboriginal coastal stories record sea-level rise more than 7,000 years ago."
        feedback: |
          Argued by Nunn and Reid, answered by Henige. A live debate, so layer 2.
      - text: "The dead remain active guardians of their families."
        feedback: |
          That many people hold this is a fact about communities; that it is so is a faith commitment. Layer 3.
    explanation: |
      Facts about books, performers and communities are layer 1. Whether a thesis generalises, or how old a memory is, are scholarly debates. What the dead or the land actually are is faith, in either direction: believers and sceptics both go beyond the evidence there.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** Whether "religion" is a fair label for a way of life with no creed or founder, and what to use instead; whether Mbiti's account of the living-dead and of time fits one people or many; how far an oral memory can reach; how much we can know about peoples whose early reports came from missionaries. The reasons are different definitions of the word, different amounts of evidence about particular peoples, and different views of how reliable memory is.
      **Next:** the lesson Shinto and the Sacred in Nature turns to Japan, where sacred powers are met in places and rituals, and asks what the word *kami* names and how a tradition of ritual and purity lives alongside others.
