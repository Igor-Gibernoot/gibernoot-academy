id: ch19-zoroaster
title: "Zoroastrianism and Ancient Dualism"
kind: concept
own: |
  The setting: Zoroastrianism, an Iranian tradition that looks back to a teacher called Zarathustra (Greek form Zoroaster), taught here according to Zoroastrian tradition and to the encyclopedic accounts and scholars cited in the lesson. Whether its claims about God, evil and the end of the world are true is left to each reader.
  - **Texts and date.** The oldest layer of the *Avesta* (the Zoroastrian scripture) is the *Gathas*, five groups of hymns in {{ Old Avestan }}, traditionally ascribed to Zarathustra. Dates differ: Wikipedia reports Mary Boyce at 1500 to 1000 BCE, the Encyclopaedia Iranica (Manfred Hutter) puts him in the last centuries of the second millennium BCE, and Prods Skjærvø notes two dates scholars use, about the 13th century BCE or 700 years later, in the 6th century BCE. The tradition's own date is the 6th century BCE. Little is known of his life beyond these texts, and what the Avesta says about the later cosmic story is mostly from later layers.
  - **Two spirits and a choice.** *Ahura Mazda* (often translated "Wise Lord") is the good creator. Opposed to him is the Dark or Destructive Spirit, called *Angra Mainyu* in Avestan and *Ahriman* in later Middle Persian. The moral axis is *asha* (truth, right order) against *druj* (the Lie, disorder). According to one common reading (monotheism with an *ethical dualism*), the key Gathic stanza (Yasna 30.3) shows good and evil arising from a choice between two spirits, a {{ moral choice, not a split between spirit and matter }}. Jean Kellens and those who follow him read that stanza instead as a psychology of ritual choice, not a dualism.
  - **Dualist or monotheist?** Scholars disagree. Skjærvø finds a dualism in the cosmology and a polytheism that in some sense never disappeared, and calls the early religion a monotheism only in the sense of henotheism (one chief god among others); Almut Hintze argues that Zoroastrianism has its own particular form of monotheism. The answer depends on what the word *monotheism* is taken to require, and whether evil counts as a second power.
  - **Cosmic history.** According to the *Bundahishn* (a book in Middle Persian, probably compiled in the eighth and ninth centuries CE), history has three ages:
    $$\text{creation} \;\to\; \text{mixture} \;\to\; \text{separation}$$
    In the third age evil is defeated, the dead rise, and the world is made fresh, *frashokereti*. The Gathas already look to {{ *frashokereti*, the renewal of the world, and each person's own choice }}, while the detailed sequence and the *Chinvat* bridge of judgement (which narrows to a razor's edge for the wicked) are described in later texts.
  - **The influence thesis.** The Persian king Cyrus took Babylon in 539 BCE and the Hebrew Bible praises him as God's anointed (Isaiah 45:1). Mary Boyce wrote that Zoroaster was the first to teach an individual judgement, heaven and hell, the resurrection of the body and a last judgement, doctrines that became familiar through borrowings by Judaism, Christianity and Islam. James Barr's 1985 essay is called the standard critique of this field, and a survey in *Bible Interpretation* says the question of Iranian influence has been neither proved nor disproved. Bart Ehrman wrote in 2025 that he once thought the influence likely but no longer thinks we can know. This is {{ a live debate: contested, not settled }}.
  - **Today.** Zoroastrians live mainly in India (the *Parsis*), Iran and the diaspora. The Indian census counted 57,264 in 2011, down from about 114,800 in 1941 (reports give 114,791 or 114,890), so the Parsi population roughly {{ halved in seventy years }}. Their fire temples keep a sacred fire. *Manichaeism* (from Mani, born 216 CE) was a separate dualist religion in which light and darkness are two principles struggling in the world.
  - **Three layers.** Established: the texts and their languages, the community's history and practice. Debated: Zarathustra's date, the Gathas' dualism, the later date of the eschatology, Persian influence on Judaism. Faith: that Ahura Mazda is the good creator and that evil will be defeated.

cards:
  - type: mcq
    id: hook
    title: "Guess: where does evil come from?"
    prompt: |
      Guessing is the point; no background is needed. Suppose one all-good Creator made the world, and yet suffering and cruelty exist. A thinker might answer in different ways. Which of these would you most expect from a faith that took evil very seriously and wanted God to be completely good?
    options:
      - text: "Evil is a separate, opposed power, so God is good but not the author of evil, and the world is a battlefield between the two."
        correct: true
        feedback: |
          This is the move that the faith in this lesson is known for, and it is a reasonable guess. It buys God's goodness by limiting what God controls or by letting evil be older or independent. We will see how the tradition and its scholars qualify that picture.
      - text: "Evil is just an illusion, so nothing needs explaining."
        feedback: |
          Some traditions say something like this, but a faith that fights evil would hardly call it unreal. Here evil is real and to be resisted.
      - text: "Evil is God's own choice, a punishment for every single sufferer."
        feedback: |
          That would make God the source of evil, which the question tried to avoid. Other traditions in this course discuss it; here the guess should protect God's goodness.
    explanation: |
      The lesson follows Zoroastrianism according to its texts, tradition and the scholars cited. It connects to the lessons The Logical Problem of Evil and The Evidential Problem of Evil, where the same question appears as an argument. Three questions: what do the texts say and how old are they, is the picture dualist or monotheist, and did it influence the traditions around it?

  - type: text
    id: zarathustra
    title: "Zarathustra and the Gathas"
    body: |
      **Zoroastrianism** is the tradition that looks back to **Zarathustra** (the Greek form is *Zoroaster*), an Iranian prophet and poet. The Zoroastrian scripture is the **Avesta**, written in an old Iranian language called Avestan. Its oldest part is the **Gathas**, seventeen hymns grouped in five sections, in an archaic form called *Old Avestan* and traditionally credited to Zarathustra himself (Manfred Hutter, in the Encyclopaedia Iranica, argues he can be credited with them, while Jean Kellens questions that any single author can be identified). The later parts of the Avesta are in a younger form of the language.

      When did he live? Wikipedia reports no consensus. **Mary Boyce** first suggested a range such as 1700 to 1000 BCE and later 1500 to 1000 BCE; the article cites Jean Kellens (2011) for a gradual consensus around 1000 BCE for the Gathas, and notes that tradition itself places him in the 6th century BCE, a date many scholars have moved away from. The Encyclopaedia Iranica article by Manfred Hutter rules out the 6th century and says the most suitable date lies in the last centuries of the second millennium BCE. His homeland is also uncertain: Hutter writes that Avestan geography refers only to eastern Iranian regions and favours a place in the northeast, near ancient Chorasmia, though the later tradition also names western Iran. Almost everything known of him comes from these few hymns.

  - type: mcq
    id: zarathustra-q
    title: "What is known?"
    prompt: |
      A student writes: "Zarathustra lived exactly in 600 BCE in Persia, and the whole Avesta is his own writing." According to the sources above, which reply is the most careful?
    options:
      - text: "The Gathas are the oldest layer and are traditionally ascribed to him; his date is debated (about 1000 BCE or the last centuries of the second millennium BCE for many, the 6th century BCE for the tradition), his homeland is probably eastern, and the rest of the Avesta is later."
        correct: true
        feedback: |
          Yes. Layer 1: the texts exist, in Old Avestan, with younger parts added later. Layer 2: the date and homeland. Layer 3: for Zoroastrians, that he received a revelation from Ahura Mazda.
      - text: "He is certainly a legend; no historian thinks such a person existed."
        feedback: |
          The sources treat him as a historical figure who is hard to date, because the Gathas are old poems with little biography; the doubt is about dates and biography, not about whether a teacher stood behind the oldest texts.
      - text: "The tradition and the historians agree on the date, so the question is closed."
        feedback: |
          They do not. The tradition's date and the scholars' favoured date are centuries apart, which is exactly why the claim is labelled layer 2.
    explanation: |
      The method for any ancient teacher: separate the texts from the biography, and the biography from the claim of divine authority. Here a gap of several centuries between the tradition's date and many scholars' date is a good example of a live debate.

  - type: text
    id: spirits
    title: "Ahura Mazda, the Destructive Spirit, asha and druj"
    image:
      src: img/faravahar-persepolis.webp
      alt: "Stone relief of a bearded figure rising from a pair of wide outstretched wings, with a tail below, under a reddish sky with a few birds."
      caption: "A winged figure carved at Persepolis (an edited photograph). Today it is the best-known Zoroastrian emblem, but what the ancient Persian original meant is debated: Ahura Mazda, or the royal divine glory (khvarenah), are the two main readings."
      credit: "Roodiparse, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Farvahar001.JPG"
    body: |
      **Ahura Mazda** is the supreme god and the good creator. His name is often translated "Wise Lord", though Skjærvø cautions that by the later Avesta it was probably just a name whose meaning was no longer understood. Against him stands the **Dark Spirit** (Avestan *angra mainyu*, Middle Persian **Ahriman**). In Yasna 30 the two spirits are called twins, and the good and evil spirits differ in thought, word and act.

      Two more terms carry the moral picture. **Asha** (truth, right order, harmony) and **druj** (the Lie, deception, chaos) are the two principles between which a person is placed: in Skjærvø's account, those who follow the Lie are possessed by it, and by choosing between the two spirits all beings determine whether new existence is healthy or dying. Wikipedia's article on ethical dualism calls Zoroastrianism one of the clearest cases of it, the choice between good and evil being each person's own (it quotes a verse of Yasna 30 that each man and woman is to select one of the two). But this is a reading, not a settled fact: in the journal *Iranian Studies* (2013), Amir Ahmadi sets out two accounts of the stanza Yasna 30.3, one of monotheism with ethical dualism, the other, from Jean Kellens and those following him, of a psychology of how a person makes a choice of ritual conduct.

  - type: mcq
    id: dual-q
    title: "Dualism or monotheism?"
    prompt: |
      Skjærvø finds dualism in the cosmology and a polytheism that in some sense never disappeared, calling the early religion a monotheism only in the sense of henotheism, while Almut Hintze argues that Zoroastrianism has its own particular form of monotheism. What is the best explanation of why serious scholars can read the same religion in different ways?
    options:
      - text: "The word *monotheism* can be defined as one God alone, or as one supreme and ultimately victorious God, and each reading counts the evil spirit and the lesser divine beings differently."
        correct: true
        feedback: |
          Yes. If monotheism means no other divine being at all, an independent evil spirit is a problem. If it means one supreme, finally victorious God, Ahura Mazda may qualify. The disagreement is partly about definitions, not only about the texts.
      - text: "Some of them have not read the Gathas."
        feedback: |
          They have; the dispute is among specialists. That is why the card calls it a live debate rather than ignorance.
      - text: "Zoroastrianism has no texts, so every reading is a guess."
        feedback: |
          The Avesta exists and the Gathas are in a surviving language. What is hard is interpreting a very old, short and difficult poetry, and later layers that read it differently.
    explanation: |
      Compare One God in Three Traditions: there too, "one God" hides a question of what exactly is being counted. According to Skjærvø, Martin Haug in the nineteenth century singled out the Gathas as the oldest part of the Avesta and read a monotheistic philosophy in them, a reminder that interpretations have a history.

  - type: text
    id: cosmic
    title: "Cosmic history and the bridge"
    body: |
      The **Bundahishn** is a Middle Persian book probably compiled in the eighth and ninth centuries CE. It divides the history of the world into three periods of three thousand years: the age of **creation** (everything goes by Ohrmazd's will, Ohrmazd being the Middle Persian form of Ahura Mazda), the age of **mixture** (good and evil entangled, our age), and the age of **separation**, when the evil spirit is disabled. At the end the *Saoshyant*, a saviour figure, and his companions raise the dead and deprive the Dark Spirit of command, according to Skjærvø. The renewal of the world is called **frashokereti** ("making fresh"). In the Gathas, as one encyclopedia entry puts it, frashokereti is felt to be near, while the detailed sequence is known from the later texts: Skjærvø notes that the cosmology and eschatology are today mostly quoted from the Bundahishn and the Selections of Zadspram, and warns against reading the Sasanian system back into earlier layers.

      Death has its own scene. The **Chinvat bridge** (the "bridge of judgement") must be crossed by every soul. According to Encyclopedia.com, the soul's *daena* (its inner self, which can appear as a beautiful maiden or a horrible witch) guides it, the bridge narrows to a razor's edge for those who followed the Lie, and they fall into hell, while the others reach paradise. In the Old Avesta, Skjærvø notes, the daena is a mental faculty that "sees" in the other world and guides the sacrifice past the "Ford of the Accountant" (Yasna 46.11). The full picture of the bridge belongs to later layers.

  - type: order
    id: ages-order
    title: "The three ages"
    prompt: |
      According to the Bundahishn, put the three ages of the world in order, from first to last.
    steps:
      - "The age of creation: the world begins good."
      - "The age of mixture: good and evil are entangled, and people choose between them."
      - "The age of separation: evil is defeated and the world is renewed."
    hint: "Think of it as a story: a good start, a struggle, then a resolution."
    explanation: |
      The shape is a story with a beginning, a struggle and an end, unlike pictures of endless cycles in some other traditions in this course. That linear shape matters for the next question about influence.

  - type: mcq
    id: cosmic-q
    title: "How old is each claim?"
    prompt: |
      A reader says: "The Gathas contain the full story of three ages, the Chinvat bridge and the resurrection, in the form the Bundahishn gives." According to the sources above, which reply is most accurate?
    options:
      - text: "No: the Gathas look to frashokereti and the human choice, while the full sequence, the bridge details and the resurrection scenes are mostly in later layers, such as the Pahlavi books like the Bundahishn."
        correct: true
        feedback: |
          Yes. Skjærvø notes that we have no systematic, detailed description of the belief system until the Pahlavi books; so the date of each idea has to be asked separately.
      - text: "Yes: the whole Avesta was written at one time by Zarathustra."
        feedback: |
          The Avesta has layers: Old Avestan Gathas, younger Avestan, then Middle Persian books.
      - text: "None of these ideas are in any Zoroastrian text."
        feedback: |
          They are, only in different layers. The point is which layer, and that matters when one asks who influenced whom.
    explanation: |
      This is the key to the next card: to say that Zoroastrianism influenced Judaism, one must say which Zoroastrian idea, in which text, existed before which Jewish text. When the most detailed Zoroastrian sources are late, the dating becomes a real problem.

  - type: text
    id: influence
    title: "Cyrus and the influence thesis"
    body: |
      In October 539 BCE the Persian king **Cyrus the Great** took Babylon (Livius.org). In the Hebrew Bible, Ezra 1 has Cyrus allow the exiles to go up to Jerusalem and rebuild the house of the Lord, and Isaiah 45:1 begins, "Thus says the Lord to his anointed, to Cyrus". The Persian period that followed is where the thesis looks for Iranian sources of Jewish ideas such as the hope of resurrection and a final judgement.

      The **influence thesis** says some of these came from Iran. **Mary Boyce** (*Zoroastrians: Their Religious Beliefs and Practices*, p. 29, as quoted on two secondary pages) wrote that Zoroaster "was thus the first to teach the doctrines of an individual judgment, Heaven and Hell, the future resurrection of the body, the general Last Judgment", and that these doctrines became familiar "through borrowings by Judaism, Christianity and Islam". **James Barr** (1985, *Journal of the American Academy of Religion*) wrote what a *Bible Interpretation* survey calls the standard critique of the field; the same survey says the issue of Iranian influence "can yet in no way be said to have been proved or disproved". **Bart Ehrman**, in his blog, answers a reader in 2025 that he used to think the influence likely but now simply does not think we can know, and he adds that the outside influence at the time was entirely Greek, and the Greeks did not expect a resurrection. Skjærvø adds a warning on method: the Sasanian system should not be read back into the Avestan one, or the Avestan into the Achaemenid, as scholars do when they search for Iranian influence in the Bible. The dating problem from the last card is part of why the argument is hard.

  - type: mcq
    id: influence-q
    title: "A fair statement"
    prompt: |
      Which statement of the influence thesis would both a defender and a critic accept as fair?
    options:
      - text: "Some scholars argue that Persian-period contact shaped Jewish ideas about resurrection and a final judgement, while others reply that the Zoroastrian sources are late or the Jewish ideas can be explained from within, so it is a contested debate and not an established fact."
        correct: true
        feedback: |
          Yes. It names both sides and labels the layer: live debate. A defender would add the cases they find strongest; a critic would add the dating problem.
      - text: "Judaism simply copied its ideas of resurrection and final judgement from Zoroastrianism."
        feedback: |
          This passes a contested thesis off as fact, and ignores the critics and the survey's verdict that the issue is neither proved nor disproved. It also treats a tradition as a passive copier.
      - text: "Judaism and Zoroastrianism never met, so there is nothing to discuss."
        feedback: |
          They did meet: Cyrus took Babylon and, in Ezra 1, lets the exiles go back to Jerusalem, so Jews lived under Persian rule, and the question is how far ideas moved, not whether any contact occurred.
    explanation: |
      The same shape of argument appears for Jewish and Christian ideas of evil: to infer influence one needs a clear source, a clear route and a date order. Even if influence is granted, it would not say whether the borrowed idea is true or false; that would be the genetic fallacy, the same worry as in the lesson Does Explaining Belief Explain It Away?.

  - type: text
    id: living
    title: "Parsis, fire temples and Manichaeism"
    image:
      src: img/yazd-atash-behram.webp
      alt: "A cream-coloured temple building with a pillared porch, seen from the front, with a symbol of a winged figure above the entrance."
      caption: "The Atash Behram, a fire temple in Yazd, Iran. Atash Behram means 'Victorious Fire', the highest grade of temple fire, and non-Zoroastrians cannot enter the sanctum (one tour source says only Zoroastrians may, a news report only priests)."
      credit: "Bernard Gagnon, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Zoroastrian_Fire_Temple,_Yazd_02.jpg"
    body: |
      Zoroastrianism is a living religion, and fire temples keep a sacred fire. The **Parsis** are the Zoroastrians of India, who by their tradition came from Iran after the Arab defeat of the last Sasanian king. A history site notes that many historians looked at this story with some scepticism until the Sanjan excavations of 2002 to 2004, which confirmed a Zoroastrian settlement whose earliest levels date to the 8th century CE. India's 2011 census counted 57,264 Parsis and Zoroastrians.

      A neighbour: **Mani** (born in 216 CE near Ctesiphon, in the Sasanian empire) founded **Manichaeism**, a dualism of a good world of light and an evil world of darkness. A history site writes that Zoroastrian priests, notably the grand priest Kartir, disliked his message, that King Bahram I had him chained and imprisoned, and that he died in 274 or 277 CE (sources differ). The contrast: in Zoroastrian texts evil is finally defeated by Ahura Mazda in the age of separation, while in Manichaeism light is slowly freed from matter. Augustine of Hippo was for nine years a Manichaean hearer; he turned to Christianity in the late summer of 386 and was baptised by Ambrose on Easter eve in 387, and he later wrote against Manichaeism.

  - type: numeric
    id: parsi-num
    title: "The Parsi population"
    prompt: |
      According to census-based reports, India counted about 114,800 Parsis in 1941 (114,791 in one report, 114,890 in another) and 57,264 in 2011. By what percentage did the number fall between the two? Give the answer in percent, rounded to the nearest whole number.
    answer: 50
    tolerance: 1
    answerText: '50'
    hint: "Divide the 2011 count by the 1941 count, then take the complement."
    explanation: |
      The ratio is $57264/114800 \approx 0.499$, so the count fell by about $1 - 0.499 = 0.501$, that is, about 50 percent: roughly halved in seventy years. The two reported 1941 figures give the same result to the nearest percent. A census count says nothing by itself of the causes; this is a layer-1 number and any explanation is a layer-2 matter.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    prompt: |
      Select every statement that is **established or documented** (not a matter of faith or live scholarly debate).
    multiple: true
    options:
      - text: "The Gathas are in Old Avestan, an archaic Iranian language, and are the oldest layer of the Avesta."
        correct: true
        feedback: |
          Yes: a fact about the texts, as reported by the encyclopedic accounts.
      - text: "India's census counted 57,264 Parsis and Zoroastrians in 2011."
        correct: true
        feedback: |
          Yes: a documented count.
      - text: "Zarathustra lived in 1000 BCE."
        feedback: |
          Many scholars favour about 1000 BCE for the Gathas, but others allow a wide range and tradition says the 6th century BCE. Layer 2.
      - text: "Ahura Mazda is the good creator and will triumph over evil."
        feedback: |
          That Zoroastrians hold this is a fact about the community; that it is so is faith. Layer 3.
      - text: "Judaism took its idea of resurrection from Persia."
        feedback: |
          A live debate (Boyce for, Barr's critique, Ehrman unsure). Layer 2.
    explanation: |
      The same method as in every lesson of this level: texts and counts are facts, dates and influence are scholarly debates, and claims of divine truth or final victory are faith. A sentence that moves a layer-2 claim to layer 1, as in the last option, is the usual mistake.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** Whether Zarathustra lived near 1000 BCE or in the 6th century BCE; whether the Gathas teach a real cosmic dualism or an ethical choice; whether the faith counts as dualist, polytheist, monotheist or some mix, and why the word matters; whether Persian contact shaped Jewish ideas of resurrection and a final judgement. The reasons are different dates for the sources, different definitions of the key words, and different standards for what proves influence.

      **Next:** the lesson Indigenous and African Traditions leaves the written scriptures behind and asks what a religion is when it is carried by ancestors, land and spoken memory, and why the word religion fits them awkwardly.
