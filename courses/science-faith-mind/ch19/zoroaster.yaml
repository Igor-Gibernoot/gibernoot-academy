id: ch19-zoroaster
title: "Zoroastrianism and Ancient Dualism"
kind: concept
own: |
  The setting: Zoroastrianism, an Iranian tradition that looks back to a teacher called Zarathustra (Greek form Zoroaster), taught here according to Zoroastrian tradition and to the encyclopedic accounts and scholars cited in the lesson. Whether its claims about God, evil and the end of the world are true is left to each reader.
  - **Texts and date.** The oldest layer of the *Avesta* (the Zoroastrian scripture) is the *Gathas*, five poems in {{ Old Avestan }}, traditionally ascribed to Zarathustra. According to Mary Boyce he lived roughly 1500 to 1000 BCE; many scholars today favour about 1000 BCE, and the tradition's own date, 7th to 6th century BCE, is the late option. Little is known of his life beyond these texts, and what the Avesta says about the later cosmic story is mostly from later layers.
  - **Two spirits and a choice.** *Ahura Mazda* is the wise Lord, the good creator. Opposed to him is the Destructive Spirit, later called *Angra Mainyu* or *Ahriman*. The moral axis is *asha* (truth, right order) against *druj* (the Lie, disorder). According to the Encyclopaedia Iranica, the Gathic dualism is ethical: a choice between two spirits, truth or falsehood, {{ not a split between spirit and matter }}.
  - **Dualist or monotheist?** Scholars disagree. Skjærvø calls it dualistic and polytheistic with one supreme god; Hintze, a form of monotheism combining dualism and polytheism; Mehr, principally monotheistic with dualistic elements. The answer depends on what the word *monotheism* is taken to require, and whether evil counts as a second power.
  - **Cosmic history.** According to the *Bundahishn* (a ninth-century book in Middle Persian), history has three ages:
    $$\text{creation} \;\to\; \text{mixture} \;\to\; \text{separation}$$
    In the third age evil is defeated, the dead rise, and the world is made fresh, *frashokereti*. The Gathas stress {{ *frashokereti*, the renewal of the world, and each person's own choice }}, while the detailed sequence and the *Chinvat* bridge of judgement (wide for the righteous, narrow for the wicked) come from later texts.
  - **The influence thesis.** The Persian king Cyrus took Babylon in 539 BCE and the Hebrew Bible praises him as God's anointed (Isaiah 45:1). Boyce and Foltz argue that the Persian period shaped Jewish ideas of angels, a satan and resurrection; Barr (1985) argued the case is weak by strict criteria; Ehrman now finds the evidence thin; Shaked notes that scholars of Iran and of Judaism tend to differ. This is {{ a live debate: contested, not settled }}.
  - **Today.** Zoroastrians live mainly in India (the *Parsis*), Iran and the diaspora. The Indian census counted 57,264 in 2011, down from 114,890 in 1941, so the Parsi population roughly {{ halved in seventy years }}. Their fire temples keep a sacred fire as a symbol of Ahura Mazda. *Manichaeism* (from Mani, born 216 CE) was a separate dualist religion in which light and darkness are two principles struggling in the world.
  - **Three layers.** Established: the texts and their languages, the community's history and practice. Debated: Zarathustra's date, the Gathas' dualism, the later date of the eschatology, Persian influence on Judaism. Faith: that Ahura Mazda is the good creator and that evil will be defeated.

cards:
  - type: mcq
    id: hook
    title: "Guess: where does evil come from?"
    prompt: |
      Guessing is the point; no background is needed. Suppose one all-good Creator made the world, and yet suffering and cruelty exist. A thinker might answer in different ways. Which of these would you most expect from a faith that took evil very seriously and wanted God to be completely good?
    options:
      - text: "Evil is a separate, opposed power, so God is good but not the author of evil, and the world is a battlefield between the two."
        correct: true
        feedback: |
          This is the move that the faith in this lesson is known for, and it is a reasonable guess. It buys God's goodness by limiting what God controls or by letting evil be older or independent. We will see how the tradition and its scholars qualify that picture.
      - text: "Evil is just an illusion, so nothing needs explaining."
        feedback: |
          Some traditions say something like this, but a faith that fights evil would hardly call it unreal. Here evil is real and to be resisted.
      - text: "Evil is God's own choice, a punishment for every single sufferer."
        feedback: |
          That would make God the source of evil, which the question tried to avoid. Other traditions in this course discuss it; here the guess should protect God's goodness.
    explanation: |
      The lesson follows Zoroastrianism according to its texts, tradition and the scholars cited. It connects to the lessons The Logical Problem of Evil and The Evidential Problem of Evil, where the same question appears as an argument. Three questions: what do the texts say and how old are they, is the picture dualist or monotheist, and did it influence the traditions around it?

  - type: text
    id: zarathustra
    title: "Zarathustra and the Gathas"
    body: |
      **Zoroastrianism** is the tradition that looks back to **Zarathustra** (the Greek form is *Zoroaster*), an Iranian prophet and poet. The Zoroastrian scripture is the **Avesta**, written in an old Iranian language called Avestan. According to Wikipedia's account, its oldest and most central part is the **Gathas**, five poems of seventeen hymns, in an archaic form called *Old Avestan* and traditionally credited to Zarathustra himself. The later parts of the Avesta are in a younger form of the language.

      When did he live? Wikipedia reports no consensus. **Mary Boyce** first suggested a range such as 1700 to 1000 BCE and later 1500 to 1000 BCE; the article cites Jean Kellens (2011) for a gradual consensus around 1000 BCE for the Gathas, and notes that tradition itself places him in the 6th century BCE, a date many scholars have moved away from. His homeland is also uncertain: most proposals are in the east of the Iranian world, such as Bactria, and the Encyclopaedia Iranica is cited as seeing agreement that he did not live in western Iran. Almost everything known of him comes from these few hymns.

  - type: mcq
    id: zarathustra-q
    title: "What is known?"
    prompt: |
      A student writes: "Zarathustra lived exactly in 600 BCE in Persia, and the whole Avesta is his own writing." According to the sources above, which reply is the most careful?
    options:
      - text: "The Gathas are the oldest layer and are traditionally ascribed to him; his date is debated (many favour about 1000 BCE, tradition says the 6th century BCE), his homeland is probably eastern, and the rest of the Avesta is later."
        correct: true
        feedback: |
          Yes. Layer 1: the texts exist, in Old Avestan, with younger parts added later. Layer 2: the date and homeland. Layer 3: for Zoroastrians, that he received a revelation from Ahura Mazda.
      - text: "He is certainly a legend; no historian thinks such a person existed."
        feedback: |
          The sources treat him as a historical figure who is hard to date, because the Gathas are old poems with little biography; the doubt is about dates and biography, not about whether a teacher stood behind the oldest texts.
      - text: "The tradition and the historians agree on the date, so the question is closed."
        feedback: |
          They do not. The tradition's date and the scholars' favoured date are centuries apart, which is exactly why the claim is labelled layer 2.
    explanation: |
      The method for any ancient teacher: separate the texts from the biography, and the biography from the claim of divine authority. Here a gap of several centuries between the tradition's date and many scholars' date is a good example of a live debate.

  - type: text
    id: spirits
    title: "Ahura Mazda, the Destructive Spirit, asha and druj"
    image:
      src: img/faravahar-persepolis.webp
      alt: "Stone relief of a bearded figure rising from a pair of wide outstretched wings, with a tail below, under a reddish sky with a few birds."
      caption: "A winged figure carved at Persepolis (an edited photograph). Today it is the best-known Zoroastrian emblem, but what the ancient Persian original meant is debated: Ahura Mazda, or the royal divine glory (khvarenah), are the two main readings."
      credit: "Roodiparse, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Farvahar001.JPG"
    body: |
      According to Wikipedia's account, **Ahura Mazda** ("Wise Lord" or "Lord of Wisdom", since scholars read the grammar of the name two ways) is the supreme god, benevolent and uncreated. Against him stands the **Destructive Spirit**, called in later Middle Persian texts **Angra Mainyu** or **Ahriman**, an independent entity, not a creation of Ahura Mazda.

      Two more terms carry the moral picture. **Asha** (truth, right order, harmony) and **druj** (the Lie, deception, chaos) are the two principles between which, according to the same article, a person is placed. According to the Encyclopaedia Iranica, the Gathic dualism is *ethical* and not a dualism of spirit against matter: it is a dualism between two spirits who choose between asha and druj, and the Iranica notes that Jean Kellens does not accept an ethical dualism in the Gathas, a minority view.

  - type: mcq
    id: dual-q
    title: "Dualism or monotheism?"
    prompt: |
      According to Wikipedia's survey, Skjærvø calls Zoroastrianism a dualistic and polytheistic religion with one supreme god, Hintze describes its own form of monotheism that combines dualism and polytheism, and Farhang Mehr calls it principally monotheistic with dualistic elements. What is the best explanation of why serious scholars can read the same religion in different ways?
    options:
      - text: "The word *monotheism* can be defined as one God alone, or as one supreme and ultimately victorious God, and each reading counts the evil spirit and the lesser divine beings differently."
        correct: true
        feedback: |
          Yes. If monotheism means no other divine being at all, an independent evil spirit is a problem. If it means one supreme, finally victorious God, Ahura Mazda may qualify. The disagreement is partly about definitions, not only about the texts.
      - text: "Some of them have not read the Gathas."
        feedback: |
          They have; the dispute is among specialists. That is why the card calls it a live debate rather than ignorance.
      - text: "Zoroastrianism has no texts, so every reading is a guess."
        feedback: |
          The Avesta exists and the Gathas are in a surviving language. What is hard is interpreting a very old, short and difficult poetry, and later layers that read it differently.
    explanation: |
      Compare One God in Three Traditions: there too, "one God" hides a question of what exactly is being counted. According to the Wikipedia article, the monotheist reading was shaped in the nineteenth century by Martin Haug, a reminder that interpretations have a history.

  - type: text
    id: cosmic
    title: "Cosmic history and the bridge"
    body: |
      According to the **Bundahishn**, a Middle Persian book which Wikipedia dates to about the ninth century CE, history has three ages: the age of **creation**, the age of **mixture** (good and evil entangled, our age), and the age of **separation**. At its end the *Saoshyant*, a saviour figure, helps bring about the resurrection of the dead and the final defeat of evil. The renewal of the world is called **frashokereti** ("making fresh"). According to the article, the Gathas themselves stress frashokereti as a renovation driven by human thoughts, words and deeds, while the detailed sequence is known mainly from the later texts.

      Death has its own scene. The **Chinvat bridge** (the "bridge of judgement") must be crossed by every soul. According to Wikipedia, it is wide for the righteous, whom a spirit called the *Daena* leads to the House of Song; it seems narrow to the wicked, who fall into the House of Lies. The most detailed account is in the Vendidad and the Bundahishn, the Yasna mentions the crossing, and a later short text describes its width; the article cautions that some of the picture is later than the Gathas.

  - type: order
    id: ages-order
    title: "The three ages"
    prompt: |
      According to the Bundahishn as Wikipedia reports it, put the three ages of the world in order, from first to last.
    steps:
      - "The age of creation: the world begins good."
      - "The age of mixture: good and evil are entangled, and people choose between them."
      - "The age of separation: evil is defeated and the world is renewed."
    hint: "Think of it as a story: a good start, a struggle, then a resolution."
    explanation: |
      The shape is a story with a beginning, a struggle and an end, unlike pictures of endless cycles in some other traditions in this course. That linear shape matters for the next question about influence.

  - type: mcq
    id: cosmic-q
    title: "How old is each claim?"
    prompt: |
      A reader says: "The Gathas contain the full story of three ages, the Chinvat bridge and the resurrection, in the form the Bundahishn gives." According to the sources above, which reply is most accurate?
    options:
      - text: "No: the Gathas stress frashokereti and the human choice, while the full sequence, the bridge details and the resurrection scenes are mostly in later layers, such as the Vendidad and the ninth-century Bundahishn."
        correct: true
        feedback: |
          Yes. Wikipedia notes that the detailed eschatology is mainly known from the later texts and only alluded to in the surviving older Avestan texts; so the date of each idea has to be asked separately.
      - text: "Yes: the whole Avesta was written at one time by Zarathustra."
        feedback: |
          The Avesta has layers: Old Avestan Gathas, younger Avestan, then Middle Persian books.
      - text: "None of these ideas are in any Zoroastrian text."
        feedback: |
          They are, only in different layers. The point is which layer, and that matters when one asks who influenced whom.
    explanation: |
      This is the key to the next card: to say that Zoroastrianism influenced Judaism, one must say which Zoroastrian idea, in which text, existed before which Jewish text. When the most detailed Zoroastrian sources are late, the dating becomes a real problem.

  - type: text
    id: influence
    title: "Cyrus and the influence thesis"
    body: |
      Around 539 BCE the Persian king **Cyrus the Great** took Babylon. According to Wikipedia, the Hebrew Bible describes him freeing the Jews from Babylon, and Isaiah calls him anointed by God, which the article notes is the only such honour for a non-Jew. The Persian period that followed (the Second Temple period begins in it) is when some scholars see new ideas in Judaism: angels with ranks, a figure called *the satan* who opposes, the hope of resurrection, a final judgement.

      The **influence thesis** says some of these came from Iran. According to a summary of the debate, **Boyce** and **Foltz** argue that Judaism changed under Persian influence; **James Barr** (1985, *Journal of the American Academy of Religion*) argued that when measured against strict criteria the case for influence on canonical Judaism is highly questionable; and **Bart Ehrman** writes that he once thought influence likely but is now less sure, since he knows of no clear Persian influence in third-century Judea, while Greek influence is plentiful. **Shaul Shaked** notes that scholars of Iranian religion tend to assume substantial influence, while scholars of Judaism tend to explain Judaism from its own development. The dating problem from the last card is part of why the argument is hard.

  - type: mcq
    id: influence-q
    title: "A fair statement"
    prompt: |
      Which statement of the influence thesis would both a defender and a critic accept as fair?
    options:
      - text: "Some scholars argue that Persian-period contact shaped Jewish ideas about angels, a satan and resurrection, while others reply that the Zoroastrian sources are late or the Jewish ideas can be explained from within, so it is a contested debate and not an established fact."
        correct: true
        feedback: |
          Yes. It names both sides and labels the layer: live debate. A defender would add the cases they find strongest; a critic would add the dating problem.
      - text: "Judaism simply copied its ideas of Satan and resurrection from Zoroastrianism."
        feedback: |
          This passes a contested thesis off as fact, and ignores Barr and others. It also treats a tradition as a passive copier.
      - text: "Judaism and Zoroastrianism never met, so there is nothing to discuss."
        feedback: |
          They did meet: Jews lived under Persian rule, Aramaic and Hebrew texts carry Persian loanwords (noted by Shaked), and the question is how far ideas moved, not whether any contact occurred.
    explanation: |
      The same shape of argument appears for Jewish and Christian ideas of evil: to infer influence one needs a clear source, a clear route and a date order. Even if influence is granted, it would not say whether the borrowed idea is true or false; that would be the genetic fallacy, the same worry as in the lesson Does Explaining Belief Explain It Away?.

  - type: text
    id: living
    title: "Parsis, fire temples and Manichaeism"
    image:
      src: img/yazd-atash-behram.webp
      alt: "A cream-coloured temple building with a pillared porch, seen from the front, with a symbol of a winged figure above the entrance."
      caption: "The Atash Behram, a fire temple in Yazd, Iran. According to Wikipedia it houses a fire of the highest grade, called the Victorious Fire, and only Zoroastrians may enter the sanctum."
      credit: "Bernard Gagnon, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Zoroastrian_Fire_Temple,_Yazd_02.jpg"
    body: |
      Zoroastrianism is a living religion. According to Wikipedia, fire is held sacred as a symbol of Ahura Mazda, and fire temples are the focus of worship. The **Parsis** are the Zoroastrians of India, who by their tradition came from Iran after the Muslim conquest; the article notes that scholars question that story, since Zoroastrians traded with India long before. India's 2011 census counted 57,264 Parsis and Zoroastrians, and a 2012 survey estimated the world total at between about 112,000 and 122,000.

      A neighbour: **Mani** (born 216 CE) founded **Manichaeism**, a dualism of a good world of light and an evil world of darkness. Wikipedia says he presented his teaching to the Sasanian king Shapur I as a reform of Zoroaster's, that the Zoroastrian priest Kartir later rose in influence, and that Mani died in prison. The contrast: in Zoroastrian texts evil is finally defeated by Ahura Mazda in the age of separation, while in Manichaeism light is slowly freed from matter. Augustine of Hippo was for nine or ten years a Manichaean hearer, before he turned to Christianity in 387, and later wrote against it.

  - type: numeric
    id: parsi-num
    title: "The Parsi population"
    prompt: |
      According to the census figures reported by Wikipedia, India counted 114,890 Parsis in 1941 and 57,264 in 2011. By what percentage did the number fall between the two? Give the answer in percent, rounded to the nearest whole number.
    answer: 50
    tolerance: 1
    answerText: '50'
    hint: "Divide the 2011 count by the 1941 count, then take the complement."
    explanation: |
      The ratio is $57264/114890 \approx 0.498$, so the count fell by about $1 - 0.498 = 0.502$, that is, about 50 percent: roughly halved in seventy years. A census count says nothing by itself of the causes (the Wikipedia article, for instance, mentions other estimates for the same date); this is a layer-1 number and any explanation is a layer-2 matter.

  - type: mcq
    id: layers
    title: "Sorting the claims"
    prompt: |
      Select every statement that is **established or documented** (not a matter of faith or live scholarly debate).
    multiple: true
    options:
      - text: "The Gathas are in Old Avestan, an archaic Iranian language, and are the oldest layer of the Avesta."
        correct: true
        feedback: |
          Yes: a fact about the texts, as reported by the encyclopedic accounts.
      - text: "India's census counted 57,264 Parsis and Zoroastrians in 2011."
        correct: true
        feedback: |
          Yes: a documented count.
      - text: "Zarathustra lived in 1000 BCE."
        feedback: |
          Many scholars favour about 1000 BCE for the Gathas, but others allow a wide range and tradition says the 6th century BCE. Layer 2.
      - text: "Ahura Mazda is the good creator and will triumph over evil."
        feedback: |
          That Zoroastrians hold this is a fact about the community; that it is so is faith. Layer 3.
      - text: "Judaism took its idea of resurrection from Persia."
        feedback: |
          A live debate (Boyce and Foltz for, Barr and Ehrman doubtful). Layer 2.
    explanation: |
      The same method as in every lesson of this level: texts and counts are facts, dates and influence are scholarly debates, and claims of divine truth or final victory are faith. A sentence that moves a layer-2 claim to layer 1, as in the last option, is the usual mistake.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** Whether Zarathustra lived near 1000 BCE or in the 6th century BCE; whether the Gathas teach a real cosmic dualism or an ethical choice; whether the faith counts as dualist, polytheist, monotheist or some mix, and why the word matters; whether Persian contact shaped Jewish angels, a satan and resurrection. The reasons are different dates for the sources, different definitions of the key words, and different standards for what proves influence.

      **Next:** the lesson Indigenous and African Traditions leaves the written scriptures behind and asks what a religion is when it is carried by ancestors, land and spoken memory, and why the word religion fits them awkwardly.
