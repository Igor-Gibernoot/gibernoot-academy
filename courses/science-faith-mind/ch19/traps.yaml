id: ch19-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: Other Traditions and New Movements"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: Confucius and the Way, Jain and Sikh teaching, Zoroaster, indigenous traditions, Shinto, Gnostic and Hermetic texts, new religious movements, and what each tradition says about death. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone, and the feedback keeps the course's three layers apart: **established fact** (texts, dates, numbers), **scholarly debate** (say which), and **faith commitment** (what a tradition holds). $c.$ means about; BCE is before the common era.

  - type: mcq
    id: trap-confucian
    title: "Religion or philosophy, pick one?"
    prompt: |
      A student says: "Confucianism must be either a religion or a philosophy, and scholars have simply not decided which." Which reply is best?
    options:
      - text: "The either-or depends on how 'religion' is defined. According to scholars cited in the lesson on Confucius, some early twentieth-century Chinese intellectuals denied it was a religion because it lacks a concern with individual salvation, others point to the state cult of Confucius, and some argue the question itself carries a European category. So the dispute is partly about a word."
        correct: true
        feedback: |
          Yes. Once the definition is fixed the evidence can be sorted; without it two people can agree on every fact and still answer differently.
      - text: "It is a philosophy, because it has no gods."
        feedback: |
          The *Analects* speak of Heaven (*Tian*), and the state cult of Confucius existed. A missing creed or god does not settle the word, since the category 'religion' was shaped on other cases.
      - text: "It is a religion, because anything with rituals is a religion."
        feedback: |
          Rituals (*li*) are central, but that test would also count many practices nobody calls religion. The word needs a stated definition, not a one-line test.
    explanation: |
      Layers: the texts, rites and history are established; whether to call the whole a religion is a scholarly debate about a category; whether its way of life is right is a commitment.

  - type: mcq
    id: trap-wuwei
    title: "Wu wei means doing nothing?"
    prompt: |
      A friend says: "The Daoist idea *wu wei*, literally 'no doing', tells a ruler to do nothing at all." According to the scholarly renderings in the lesson on the Way, which reply is best?
    options:
      - text: "Literal translation misleads here. The Internet Encyclopedia of Philosophy renders it as 'effortless action' or 'non-willful action': acting without forcing, as water follows its course. The book's own sages govern and teach."
        correct: true
        feedback: |
          Yes. A skilled swimmer in a current does a great deal with little strain. A critic can still ask whether this is enough to run a state; defenders reply that the advice targets rulers who over-regulate.
      - text: "It is correct: wu wei is total inaction, and that is the whole point of Daoism."
        feedback: |
          Total inaction is the most common slip of translation. The texts praise restraint and spontaneity, not idleness.
      - text: "It means obeying the ruler without question."
        feedback: |
          The idea concerns the *manner* of acting (without forcing), not whom to obey.
    explanation: |
      The shortcut comes from reading two Chinese characters one by one. Meaning in a classic comes from its use in the text, which is why scholars quote chapters, not dictionaries alone.

  - type: mcq
    id: trap-laozi
    title: "One author, one sitting?"
    prompt: |
      A guidebook says: "The *Daodejing* was written by Laozi, a contemporary of Confucius, in one sitting at a mountain pass." Which reply is most careful?
    options:
      - text: "That is the traditional story told by the historian Sima Qian. Some modern scholars think Laozi was legendary, and the text seems to have been written down from the later fifth century BCE, gathered in the fourth and settled by the mid third. What exists as fact is the book and its early manuscripts."
        correct: true
        feedback: |
          Yes. The tradition's story is worth telling as the tradition's, and the safe fact is about the text.
      - text: "False: the book was written in the Han dynasty by Confucians."
        feedback: |
          The Guodian strips, from a tomb of about 300 BCE, already contain material matching parts of the book, so it is older than that.
      - text: "True: the Mawangdui silk copies show Laozi wrote it."
        feedback: |
          Those copies were sealed in a tomb in 168 BCE. They show what circulated then, not who wrote the sayings or when.
    explanation: |
      Layers: manuscripts are established; whether there was a historical Laozi and how the text grew are scholarly debates; that the book carries wisdom is a commitment.

  - type: numeric
    id: trap-gap
    title: "How much older is the tomb of Guodian?"
    prompt: |
      Two early copies of the *Daodejing* are mentioned in the lesson on the Way: bamboo strips from a tomb at Guodian, dated to about 300 BCE, and silk copies from Mawangdui, sealed in 168 BCE. By how many years is the Guodian tomb older than the Mawangdui sealing?
    answer: 132
    tolerance: 0.5
    answerText: '132'
    wrong:
      - { value: 468, feedback: 'That adds the two dates. Both are years counted back from the same point (BCE), so you subtract the smaller from the larger.' }
    hint: |
      Both are BCE: subtract 168 from 300.
    explanation: |
      $300 - 168 = 132$ years. The gap matters for the trap before: the oldest manuscripts are already more than a century and a half away from the sixth century BCE of the traditional Laozi, so they cannot by themselves show who the author was.

  - type: mcq
    id: trap-ahimsa
    title: "Ahimsa is vegetarianism?"
    prompt: |
      A friend says: "Jain *ahimsa* (non-violence) just means being vegetarian." According to the sources in the lesson on Jainism, which reply is best?
    options:
      - text: "Vegetarianism is one consequence, but the vow reaches further: harm to any living being counts, in thought, word and deed, with anger and ignorance behind harm included. It is graded: monks and nuns avoid harming even one-sensed beings such as plants, while laypeople are held to the lighter vows concerning beings with two or more senses."
        correct: true
        feedback: |
          Yes. The rule is a way of treating souls, and it is lived in degrees, which is why one diet does not capture it.
      - text: "Ahimsa is pacifism, so it only forbids war between humans."
        feedback: |
          Jain sources count animals and, for monastics, even plants. War is a small part of what it covers.
      - text: "Ahimsa applies to monks only, so laypeople may eat anything."
        feedback: |
          Laypeople take the lighter vows (*anuvratas*), including ahimsa in a form suited to household life.
    explanation: |
      A critic asks whether an ideal no one can fully keep is useful; Jain defenders reply that it is approached in degrees, with intention and care counting.

  - type: mcq
    id: trap-anekanta
    title: "Many-sidedness means every view is as good?"
    prompt: |
      A student says: "Anekantavada, Jain many-sidedness, says every opinion is equally true, so Jainism is just relativism." Which reply is best?
    options:
      - text: "The doctrine says reality has many aspects, so each partial view (*naya*) is true from its own standpoint and wrong when it denies the others. The blind men are each right about the part and wrong to deny the rest. The Jain authors also criticised Buddhist and Hindu views sharply, and Cort and Dundas call the tolerance reading a misreading of the original, metaphysical doctrine."
        correct: true
        feedback: |
          Yes. Partial truth is not equal truth: the claim 'an elephant is a rope' is false as a whole description. Some defenders still draw a tolerant attitude from it, as Gandhi did.
      - text: "Yes: the Jain texts say all views are equally true, which is why Jains never argued with anyone."
        feedback: |
          Jain authors argued with rival schools and held some views defective. 'From a standpoint' is a restriction, not a blanket pass.
      - text: "No: it says only the Jain view is true, and others are simply false."
        feedback: |
          Each rival view is held to grasp one aspect truly. What is denied is that one aspect is the whole.
    explanation: |
      Layers: the texts and the parable are established; whether the doctrine is about humility or about reality is a live debate; whether partial views are really partial is a metaphysical commitment.

  - type: mcq
    id: trap-khalsa
    title: "All Sikhs are Khalsa?"
    prompt: |
      A newspaper says: "All Sikhs wear the five Ks, the marks of the Khalsa, a warrior brotherhood founded by Guru Gobind Singh." Which correction fits the sources?
    options:
      - text: "The five Ks are worn by the initiated Khalsa, which tradition says Guru Gobind Singh founded in 1699. Not every Sikh is initiated; those who follow the Guru Granth Sahib without initiation are called *sahajdhari*. The kirpan is explained by Sikhs as a duty to protect others."
        correct: true
        feedback: |
          Yes. It separates the group (the Khalsa, not all Sikhs), the date (tradition) and the meaning as Sikhs explain it.
      - text: "They are worn only by monks, as in other Indian traditions."
        feedback: |
          The Khalsa is a community of initiated Sikhs, not a monastic order, and Nanak stressed the life of a householder.
      - text: "They were invented in the twentieth century."
        feedback: |
          Sikh tradition places them in 1699. No source in the lesson supports so late a date.
    explanation: |
      Layers: today's practice is a fact; its origin is a historical question; that the Guru commanded it is held by faith.

  - type: mcq
    id: trap-blend
    title: "Sikhism is a Hindu-Muslim blend?"
    prompt: |
      A textbook says: "Sikhism is just a mixture of Hinduism and Islam, made by Nanak to reconcile two communities." Which reply is fairest?
    options:
      - text: "Some scholars read the early teaching as drawing on currents of both, and the Guru Granth Sahib includes hymns by Hindu and Muslim saints such as Kabir and Farid. But the tradition developed its own scripture, institutions and identity, and Sikhs hold it a distinct revelation, so 'blend' is one outside reading, not the settled description."
        correct: true
        feedback: |
          Yes. The debate is between an historian's reading of influences and a believer's claim of revelation. Both can accept that the Punjab had Hindu and Muslim neighbours.
      - text: "It is established fact that Nanak founded Sikhism to unite Hindus and Muslims."
        feedback: |
          His motives are known only through devotional life stories written after his lifetime (the *Janamsakhis*). 'No Hindu and no Muslim' is traditionally attributed to him, and its wording and setting are not historically certain.
      - text: "Sikhs reject all connection with other traditions, so no influence is possible."
        feedback: |
          The scripture itself carries hymns by Kabir, Ravidas and Farid. Whether that is influence or a shared truth is the dispute.
    explanation: |
      Layers: the hymns in the scripture are established; 'blend' versus 'new revelation' is a debate; whether Nanak spoke with divine authority is a commitment.

  - type: mcq
    id: trap-dualism
    title: "Good god against bad god?"
    prompt: |
      A student says: "Zoroastrianism is simply dualism: a good god and an evil god fighting, and monotheism does not come into it." According to Wikipedia's survey of scholars in the lesson on Zoroaster, which reply is best?
    options:
      - text: "Specialists read it differently: Skjaervo calls it dualistic and polytheistic with one supreme god, Hintze a form of monotheism combining dualism and polytheism, Farhang Mehr principally monotheistic with dualistic elements. The Gathas stress a choice between *asha* (truth) and *druj* (the Lie) made by each person, while later Middle Persian books such as the Bundahishn describe a cosmic struggle with Angra Mainyu. Much of the disagreement is how one defines 'monotheism'."
        correct: true
        feedback: |
          Yes. 'Dualism' also covers two ideas: an ethical choice and an independent evil spirit. The shortcut mixes them, and the definition of monotheism does the rest.
      - text: "It is pure monotheism, since the evil spirit is just a creation of Ahura Mazda."
        feedback: |
          In the later texts Angra Mainyu is an independent entity, not a creation of Ahura Mazda, which is exactly what makes the label difficult.
      - text: "It is pure polytheism, since it names many divine beings."
        feedback: |
          Ahura Mazda is supreme and uncreated, and the scholars' views differ on how to count the others. Only some call the whole polytheistic.
    explanation: |
      Layers: the texts are established; how to classify them is a live debate; whether the cosmos has a good ground is a commitment.

  - type: mcq
    id: trap-borrow
    title: "Judaism copied Zoroastrianism?"
    prompt: |
      A student says: "Mary Boyce showed that Judaism and Christianity simply copied heaven, hell, Satan and resurrection from Zoroastrianism." Which reply is fairest?
    options:
      - text: "Boyce argued that Zoroaster first taught individual judgement, heaven and hell and bodily resurrection, which later traditions took up. Barr thought influence plausible in principle but argued that listing shared features does not show it; critics add that the Zoroastrian sources are late and the Jewish ideas can be explained from within. It is a contested thesis, and even granted, it would not say the borrowed ideas are true or false."
        correct: true
        feedback: |
          Yes. To infer influence you need a source, a route and a date order, and the genetic fallacy (judging an idea by its origin) must be avoided either way.
      - text: "Judaism and Zoroastrianism never met, so no influence is possible."
        feedback: |
          Jews lived under Persian rule after Cyrus took Babylon in 539 BCE. Grabbe and others accept some influence. The question is how much.
      - text: "Boyce's thesis was disproved, so there is no case for influence."
        feedback: |
          It is disputed, not disproved: some scholars accept influence in some areas, others doubt it.
    explanation: |
      Layers: contact under Persian rule is established; how much influence is debated; and whether an idea is true does not follow from where it came from.

  - type: mcq
    id: trap-african
    title: "The African religion?"
    prompt: |
      A textbook says: "In African religion, the dead live in the village and nobody thinks about the future." What is the main problem with this sentence, according to the lesson on indigenous traditions?
    options:
      - text: "It treats a continent of many peoples and languages (estimated at 1,250 to 2,100, by some counts over 3,000) as one tradition, and may rest on an outsider's report. Gyekye argued from Akan that Mbiti's claim about time was false and over-generalised. A better sentence names the people and the source: 'among the Akan...', 'Mbiti describes...'."
        correct: true
        feedback: |
          Yes. Scale and source are the two checks: which people, and whose account (even Tylor's animism rested on an account filtered through a missionary and a convert).
      - text: "It is wrong because Africans do not honour their dead."
        feedback: |
          Many peoples honour their dead, as Mbiti and his critics agree. The fault is the sweeping form.
      - text: "It is fine, because short summaries have to simplify."
        feedback: |
          Simplifying is fine; turning many peoples into one view is the very mistake Gyekye charges.
    explanation: |
      A courtesy and a check: 'according to whom, about which people'. The same applies to 'the Aboriginal view' or 'Native American religion'.

  - type: mcq
    id: trap-animism
    title: "Primitive animism?"
    prompt: |
      A student says: "Indigenous religions are primitive animism, the first stage from which real religions grew." Which reply best fits the lesson on indigenous traditions?
    options:
      - text: "That is E. B. Tylor's nineteenth-century theory, which built animism partly on an account filtered through a missionary and a convert, and left out a detail of the convert's report. Scholars today ask whose account, and the word 'religion' itself has a European history (Smith, Nongbri). Nothing shows these traditions to be earlier or simpler than others."
        correct: true
        feedback: |
          Yes. 'Primitive' hides an assumption of one ladder of progress that the evidence does not establish; living traditions have long histories of their own.
      - text: "Animism is established as the origin of all religions."
        feedback: |
          It is a theory of the nineteenth century, still discussed, but not settled fact. The sources for it were thin.
      - text: "Indigenous traditions have no beliefs about spirits at all."
        feedback: |
          Many describe ancestors and spirits, as Mbiti reports. The mistake is the ladder, not the topic.
    explanation: |
      Layers: what peoples say and do is established by fieldwork; theories of origin are debate; whether any spirit exists is a commitment.

  - type: mcq
    id: trap-shinto
    title: "Shinto has a creed, and kami means god?"
    prompt: |
      A visitor asks a priest at a Japanese shrine for 'the Shinto creed' and is told 'kami means god, so it is like Christianity.' According to the lesson on Shinto, what is wrong with this exchange?
    options:
      - text: "Shinto has no single founder and no canonical text, and focuses on ritual more than doctrine (Picken: 'not in credenda but in agenda'). By Motoori Norinaga's definition, kami is anything with an eminent, awe-inspiring quality, including mountains, rivers and venerated people, and kami are not regarded as omnipotent, omniscient or necessarily good. 'God' imports another shape."
        correct: true
        feedback: |
          Yes. Asking for a creed assumes belief comes first; here practice does. Kuroda adds that Shinto as a separate organised religion may be a modern construction, while practitioners hold that reverence at shrines is old and continuous.
      - text: "Shinto has a written creed, but only priests may read it."
        feedback: |
          No source reports one. The account stresses practice and the absence of one canon.
      - text: "Kami means a single creator outside the world."
        feedback: |
          That is the shape of a different idea of God. Kami are uncountably many and not omnipotent.
    explanation: |
      Layers: shrines, rites and the definition are established; whether Shinto counts as 'a religion' depends on a definition; whether kami are real presences is a commitment.

  - type: mcq
    id: trap-gnostic
    title: "Gnostic means one sect?"
    prompt: |
      A student says: "Gnostics were a single ancient sect with one set of beliefs, and the Nag Hammadi books are its scripture." Which reply is fairest?
    options:
      - text: "The finds are not in doubt: a jar found in late 1945 held twelve codices and part of a thirteenth, with 52 mostly Gnostic treatises. But Williams and King argue that 'Gnosticism' is a modern category built largely out of Christian opponents such as Irenaeus, and its supposed shared traits often fail on inspection; Brakke argues for using the name carefully for one ancient school. The evidence is shared; the category is disputed."
        correct: true
        feedback: |
          Yes. 'Gnosis' (knowledge) is a word the texts use, but a single organised sect with one creed is not what the sources show.
      - text: "Williams and King say the Nag Hammadi texts do not exist."
        feedback: |
          Nobody doubts the codices. They doubt that one definition fits all texts and groups gathered under the label.
      - text: "There was a single Gnostic church, and Irenaeus described it fairly."
        feedback: |
          Irenaeus wrote against followers of Valentinus as an opponent, which is why scholars treat him as a polemic source, not a neutral description.
    explanation: |
      Layer 2: a debate about a category, with the same evidence on every side.

  - type: mcq
    id: trap-hermes
    title: "Hermetic texts are ancient Egyptian wisdom?"
    prompt: |
      A bookshop blurb says: "The Hermetic texts are the lost wisdom of ancient Egypt, older than Moses." What does Casaubon's dating show, and what does it leave open?
    options:
      - text: "In 1614 Casaubon compared the Greek of the texts with datable writing and concluded they date to the early Christian centuries; scholars now put most Hermetic treatises at about 100 to 300 CE. That refutes the claim of great age, but not every Egyptian link: Christian Bull (2018) argued Egyptian priests may have written in Greek philosophical terms."
        correct: true
        feedback: |
          Yes. The date of the writing and the origin of its ideas are two questions. Renaissance readers such as Ficino, who set Plato aside for Hermes, assumed great age without this test.
      - text: "It proves the texts were a Christian forgery."
        feedback: |
          Dating does not show motive. Writing under a famous name was a common way to give a voice authority.
      - text: "Dating by language is unreliable, so the claim of great age stands."
        feedback: |
          Language changes in ways that can be dated; the method is standard. A claim can be defended on other grounds, but not by dropping the evidence.
    explanation: |
      Layers: manuscripts and the dating are established; how Egyptian the ideas are is a debate; whether the wisdom is real is a commitment, which a historian of esotericism reports without ruling on (methodological agnosticism).

  - type: mcq
    id: trap-cult
    title: "A new religion is a cult?"
    prompt: |
      A student says: "Baha'i, Mormonism and the New Age are all recent, so we can judge them as cults and ask which are fake." Which reply is fairest?
    options:
      - text: "'New religious movement' is the scholars' term for recent groups; it avoids the loaded word 'cult'. All three began within about two centuries but differ: Baha'is speak of a new revelation within one continuing religion, Latter-day Saints of a restoration, and much of the New Age is a loose milieu with no founder or membership. Age is not a test of truth, and historians, members and critics each answer a different question, so their verdicts should not be merged."
        correct: true
        feedback: |
          Yes. A historian studies sources and causes, a member holds a revelation, and a critic may judge doctrine; each claim should be labelled as its own layer.
      - text: "Only religions with an ancient founder are real religions."
        feedback: |
          Every old religion was new once. Age is a fact of history, not a measure of seriousness.
      - text: "All new religions are equally true, since nobody can test them."
        feedback: |
          Historical claims (a book's authorship, a date) can be tested; the revelation behind them cannot be tested directly. 'Cannot be tested' does not mean 'equally true'.
    explanation: |
      A fair account of Smith's book, for example: the book and its publication are established, most historians hold that he composed it, and Latter-day Saints hold it a translation of an ancient record. Three layers, all labelled.

  - type: mcq
    id: trap-pew
    title: "Believing one thing means believing all?"
    prompt: |
      A Pew Research Center report (2018) found about 40% of US adults accept psychics, about 40% spiritual energy in physical objects, 33% reincarnation and 29% astrology, and roughly six in ten accept at least one of the four. A columnist writes: "So 142% of Americans hold New Age beliefs, and all of them belong to a New Age movement." What is wrong?
    options:
      - text: "The shares overlap and cannot be added, since one person can hold several; six in ten accept at least one. And holding one belief does not make someone a member of a movement: the New Age is a loose milieu without membership, and Pew itself says these are 'sometimes characterized as' New Age beliefs."
        correct: true
        feedback: |
          Yes. The survey is a fact; what it means is not. Adding overlapping percentages double-counts anyone who holds more than one belief.
      - text: "Nothing: the shares add up because each belief is separate."
        feedback: |
          Shares of the same people overlap. A total above 100% of the population is the signal that they were added wrongly.
      - text: "Pew counted only members of New Age groups."
        feedback: |
          It surveyed US adults at large, which is why the numbers say nothing about group membership.
    explanation: |
      Check: $40 + 40 + 33 + 29 = 142$, impossible as a share of people, so the four groups must overlap, and 'at least one' is the figure that answers the question. Of 2,000 adults, six in ten is about 1,200, not 2,840.

  - type: mcq
    id: trap-death
    title: "Same words about death, same view?"
    prompt: |
      A student says: "Hindu thought and Buddhism both teach rebirth, so they agree about what a person is." According to the lesson on four answers to death, which reply is best?
    options:
      - text: "They agree that a life continues in another, but disagree about what continues. Hindu thought (Advaita Vedanta, for example) holds that a lasting self (*atman*) goes from body to body, while the early Buddhist texts teach *anatta*, no lasting self, only a causal stream, like a flame lit from another flame: neither the same nor another. Every answer about death rests on a premise about what a person is."
        correct: true
        feedback: |
          Yes. The same word 'rebirth' sits on two different premises, and Judaism and Christianity add a third, a whole person raised by God.
      - text: "Yes: both hold that an immortal soul travels from body to body."
        feedback: |
          The Buddhist texts deny a soul that travels. That is the point of the image of the flame.
      - text: "No: Buddhism teaches no rebirth, so there is nothing to compare."
        feedback: |
          Early Buddhist texts teach karma and rebirth. Secular Buddhists such as Batchelor stay agnostic about it, which is a different, modern position.
    explanation: |
      Layers: what the texts teach is established; whether the person is more than the working body and brain is open, and each premise is a faith or metaphysical commitment.

  - type: mcq
    id: trap-layers
    title: "Sort the claims"
    prompt: |
      Mark every claim that is **established fact** (texts, dates, history) rather than scholarly debate or faith.
    multiple: true
    options:
      - text: "A jar found near Nag Hammadi in late 1945 held twelve codices and part of a thirteenth."
        correct: true
        feedback: |
          Yes: the find and its contents are documented.
      - text: "Guru Nanak said word for word that there is no Hindu and no Muslim."
        feedback: |
          Only traditionally attributed, through devotional life stories written after his lifetime; the wording and setting are not historically certain.
      - text: "Laozi wrote the whole *Daodejing* in the sixth century BCE."
        feedback: |
          Debated: some scholars consider Laozi legendary and the text grew over centuries.
      - text: "Casaubon published a dating of the Hermetic writings in 1614."
        correct: true
        feedback: |
          Yes: a documented publication, though what it shows is a separate question.
      - text: "Shinto is the original religion of Japan, unchanged since ancient times."
        feedback: |
          Debated: Kuroda argues Shinto as a separate organised religion is a modern construction, and sources describe a long merger with Buddhism.
    explanation: |
      The method of the whole level: a text is not a transcript, a tradition's story is the tradition's, a category is a scholar's tool, and a way of life is not a proof.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **The shortcuts to drop.** Confucianism is not decided by one word, *religion*; *wu wei* is effortless action, not idleness; the *Daodejing* is a book with a legend about its author; Jain *ahimsa* is graded and wider than diet, and many-sidedness is not relativism; the Khalsa is not all Sikhs, and 'blend' is one outside reading of Sikhism; Zoroastrian dualism splits into an ethical choice and a cosmic struggle, and influence on Judaism is contested; 'the African religion' and 'primitive animism' ignore scale and source; Shinto asks for practice before creed, and kami is not 'god'; 'Gnostic' is a disputed category and Hermetic texts date to about 100 to 300 CE; a new religion is not a cult by default; Pew shares overlap and do not give membership; and rebirth means different things on different premises about the person.

      **The habit.** Before accepting a sweeping claim about a tradition, ask: according to whom, about which people, from what text and date, and which layer (fact, debate or faith).

      **Next:** a quick-recall round on the level's main ideas, with mnemonics, distinctions and a small worked example.
