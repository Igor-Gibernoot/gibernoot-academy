source_hash: 3c2d18fddb07
id: ch02-falsification
title: Popper e o cisne negro
kind: concept
own: |
  - **A assimetria.** Tome a afirmação universal "todos os cisnes são brancos". Nenhum número de cisnes brancos **prova** essa afirmação (o próximo cisne pode ser diferente), mas um único cisne negro a **refuta**. Contar casos que confirmam nunca resolve uma afirmação universal; um único contraexemplo claro resolve. Os cisnes negros foram encontrados por europeus na Austrália na década de 1690.
  - **A proposta de Popper.** Segundo **Popper** (1902-1994), em *Logik der Forschung* (*A Lógica da Pesquisa Científica*, 1934), a ciência avança por **conjecturas e refutações**: propõe teorias ousadas e se esforça para refutá-las. O passo de refutação é o argumento válido (*modus tollens*), em que $T$ é uma teoria e $O$ uma previsão observável:
  {{ $$\begin{gathered}T \Rightarrow O \\ \text{not } O \\ \therefore\ \text{not } T\end{gathered}$$ }}
  - **Demarcação.** Uma afirmação é **falsificável** quando {{ alguma observação possível a contradiria }}. Segundo Popper, é isso, e não "foi confirmada", que marca uma afirmação como científica. "Vai chover ou não vai chover" não proíbe nada, então não é falsificável; "todos os cisnes são brancos" é. Uma previsão **ousada** arrisca muito (a deflexão da luz por Einstein em 1919), uma previsão segura não arrisca nada. Passar num teste severo torna uma teoria **corroborada**, não provada.
  - **A resposta de Duhem.** Uma teoria nunca encontra a observação sozinha: uma previsão precisa da teoria $T$ mais **hipóteses auxiliares** $A$ (sobre os instrumentos, os dados, outros corpos). Então o argumento real é
  {{ $$\begin{gathered}(T \wedge A) \Rightarrow O \\ \text{not } O \\ \therefore\ \text{not } (T \wedge A)\end{gathered}$$ }}
  e uma previsão falha mostra que {{ pelo menos um de T ou A é falso, mas não qual deles }}. A órbita de Urano contrariou as previsões newtonianas nos anos 1840; a culpa recaiu sobre um planeta não visto (Netuno, encontrado em 1846), e não sobre Newton. Para a órbita de Mercúrio, a mesma jogada (um planeta "Vulcano") fracassou; a relatividade geral (1915) a explicou.
  - **Poderosa, mas incompleta.** A falsificação é um teste limpo para afirmações universais, mas: afirmações probabilísticas não proíbem nenhum resultado isolado; afirmações de "existe" (um cisne negro existe) podem ser confirmadas, mas não refutadas por uma busca finita; e uma afirmação não falsificável ainda pode ser significativa, como muitos defendem sobre a ética ou a metafísica.
  - **Onde pessoas atentas se separam.** Se a falsificabilidade é o **critério** da ciência (Popper), apenas um **teste** útil entre outros (muitos filósofos da ciência), e se afirmações não falsificáveis são sem sentido ou apenas um outro tipo de afirmação (camada 2, um debate em aberto, e não camada 1).
cards:
  - type: mcq
    id: hook
    title: "Mil cisnes brancos"
    prompt: |
      Durante séculos, todos os cisnes que alguém na Europa tinha visto eram brancos. Suponha que você tenha visto pessoalmente 1.000 cisnes brancos e nenhum de outra cor. Antes de qualquer teoria, **chute**: quanto isso prova a afirmação "todos os cisnes são brancos"?
    options:
      - text: 'Torna a afirmação provável, mas não a prova: o próximo cisne ainda pode ser diferente.'
        correct: true
      - text: 'Prova a afirmação: 1.000 em 1.000 é tão bom quanto a certeza.'
        feedback: |
          Mil é muito, mas a afirmação é sobre *todos* os cisnes, inclusive os que estão muito longe de você. Um registro de 1.000 casos iguais é compatível com um mundo em que o cisne número 1.001 é negro.
      - text: 'Não prova nada e nem sequer torna a afirmação mais provável.'
        feedback: |
          Isso vai longe demais. Cada cisne branco dá pelo menos algum apoio, como na vida cotidiana. A pergunta real é se um apoio pode, algum dia, somar-se até chegar a uma prova.
    explanation: |
      A maioria das pessoas sente a força dos dois lados: apoio forte, mas nenhuma prova. A questão desta lição é o que *fazer* com essa lacuna. O filósofo **Karl Popper** deu uma resposta surpreendente: pare de tentar provar e tente **refutar**.

  - type: widget
    id: sampler-swans
    widget: sequence-sampler
    config:
      rule: rate
      p: 0.03
      seed: 4
      symbols: ["⚪", "⚫"]
      claim: "Todos os cisnes são brancos."
      max: 200
      show: { streak: false }
      labels:
        next: "Próximo cisne"
        ten: "Dez cisnes"
        reset: "Recomeçar"
        empty: "Nenhum cisne observado ainda."
      presets:
        - { label: "Outra sequência oculta", rule: rate, p: 0.03, seed: 9 }
    body: |
      Neste mundo de brinquedo, cada novo cisne é negro com uma pequena probabilidade oculta. Pressione **Próximo cisne** ou **Dez cisnes** e observe a afirmação "Todos os cisnes são brancos". Repare em como ela se sustenta enquanto o registro for todo branco, e o que acontece no primeiro cisne negro.

  - type: mcq
    id: asymmetry
    title: "Um contra mil"
    prompt: |
      Um mundo de brinquedo tem uma única afirmação: "todos os cisnes são brancos". Você viu 1.000 cisnes brancos e depois um cisne negro. Qual afirmação está correta?
    options:
      - text: 'O cisne negro refuta a afirmação para sempre, não importa quantos cisnes brancos tenham sido vistos; os 1.000 cisnes brancos nunca a provaram.'
        correct: true
      - text: 'A afirmação ainda é muito provavelmente verdadeira: 1.000 cisnes brancos pesam mais do que um cisne negro.'
        feedback: |
          Pesar funciona para uma *tendência* ("a maioria dos cisnes é branca"). Mas a afirmação diz **todos**, e um cisne negro claro é um caso em que ela é falsa. Pesar não se aplica a uma afirmação sem exceções.
      - text: 'A afirmação agora está meio refutada e meio confirmada, então não podemos dizer nada.'
        feedback: |
          O cisne negro não deixa a afirmação meio verdadeira. "Todos os cisnes são brancos" é uma afirmação sem exceções, e uma exceção a encerra. (Uma afirmação mais fraca, "a maioria dos cisnes é branca", sobrevive.)
    explanation: |
      Esta é a **assimetria** entre confirmar e refutar uma afirmação universal. Nenhum conjunto finito de cisnes brancos prova "todos os cisnes são brancos", mas um cisne negro a refuta. A refutação é um passo lógico; a confirmação nunca é.

  - type: text
    id: popper
    title: "A proposta de Popper"
    image:
      - src: img/blackswan.webp
        alt: Cisne negro de bico vermelho nadando na água
        caption: O cisne negro (*Cygnus atratus*) é nativo da Austrália; marinheiros holandeses sob o comando de Willem de Vlamingh os registraram no rio Swan em janeiro de 1697, muito depois de a Europa ter se acomodado com "todos os cisnes são brancos".
        credit: Charles J. Sharp, CC BY-SA 4.0, via Wikimedia Commons
        link: https://commons.wikimedia.org/wiki/File:Black_swan_(Cygnus_atratus)_Scottsdale.jpg
      - src: img/popper.webp
        alt: "Fotografia de Karl Popper, já idoso, de cabelos brancos, tirada antes de 1987"
        caption: "Karl Popper (1902-1994), filósofo da ciência nascido na Áustria, escreveu *Logik der Forschung* em 1934; ele sustentava que a ciência avança tentando refutar conjecturas ousadas."
        credit: "DorianKBandy, CC BY-SA 4.0, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Photo_of_Karl_Popper.jpg"
        place: bottom
    body: |
      Os cisnes negros foram encontrados por europeus na Austrália: a expedição holandesa de **Willem de Vlamingh** subiu o que ele batizou de rio Swan em janeiro de 1697 e os viu (eles não foram os primeiros europeus a ver cisnes negros, mas essa viagem é a famosa). "Todos os cisnes são brancos" tinha se sustentado num registro ininterrupto, e caiu de imediato.

      **Karl Popper** (1902-1994), filósofo austro-britânico, transformou essa assimetria numa visão da ciência. Em *Logik der Forschung* (escrito em 1934, publicado em 1935; depois *A Lógica da Pesquisa Científica*) e em *Conjectures and Refutations* (*Conjecturas e Refutações*, 1963), ele argumentou, em paráfrase:

      - Não obtemos teorias por indução; nós as **chutamos**: são **conjecturas**.
      - Em seguida as testamos, tentando **refutá-las** com observações.
      - Uma teoria que sobrevive a testes severos não é provada, apenas **corroborada** ("até agora invicta").

      A lógica de uma refutação tem um nome latino, ***modus tollens*** ("o modo que nega"): se uma teoria $T$ implica um resultado observável $O$, e $O$ não é observado, então $T$ é falsa.

  - type: order
    id: tollens-order
    prompt: |
      Ponha em ordem a refutação de "todos os cisnes são brancos", como um argumento válido (uma teoria $T$ e uma previsão $O$).
    steps:
      - 'Se "todos os cisnes são brancos" for verdadeiro, então todo cisne encontrado na Austrália será branco.'
      - 'Um cisne encontrado no rio Swan é negro.'
      - 'Logo, nem todo cisne encontrado na Austrália é branco.'
      - 'Logo, "todos os cisnes são brancos" é falso.'
    hint: 'Comece pela teoria e sua previsão, depois pela observação, e então pela conclusão.'
    explanation: |
      Primeiro a previsão ($T$ implica $O$), depois a observação (não $O$), depois a conclusão (não $T$). Esta forma é válida: se as premissas forem verdadeiras, a conclusão não pode ser falsa. Compare com a forma "confirmadora", "se $T$ então $O$; $O$; logo $T$", que **não** é válida (muitas teorias podem prever o mesmo $O$).

  - type: mcq
    id: falsifiable
    title: "Poderia ser pego em erro?"
    prompt: |
      Uma afirmação é **falsificável** se alguma observação possível a contradisser. Qual destas **não** é falsificável?
    options:
      - text: 'Amanhã vai chover em São Paulo ou não vai chover.'
        correct: true
      - text: 'Amanhã vai chover em São Paulo.'
        feedback: |
          Um dia seco contradiria essa afirmação. Ela pode muito bem ser falsa, e é exatamente isso que a torna falsificável.
      - text: 'Todo metal se expande quando aquecido.'
        feedback: |
          Um metal que encolhe ao ser aquecido contradiria a afirmação. Uma lei universal é o caso modelo de afirmação falsificável.
      - text: 'Todo planeta orbita o Sol numa elipse.'
        feedback: |
          Um planeta com uma órbita claramente diferente contradiria a afirmação. É uma afirmação universal ousada, por isso falsificável.
    explanation: |
      "Chova ou não chova" é verdadeiro em todo tempo possível, então nenhuma observação poderia contradizê-la: ela não diz nada sobre o mundo. Segundo Popper, esse é o problema das afirmações que se ajustam a tudo. A **demarcação** é o antigo problema de traçar uma linha entre ciência e não ciência, e a linha de Popper é a falsificabilidade. Quanto mais vaga a formulação de uma afirmação, menos observações ela proíbe.

  - type: mcq
    id: bold
    title: "Ousada ou segura?"
    prompt: |
      Dois previsores. Ana diz "amanhã a temperatura em São Paulo vai ficar entre 5 e 40 graus Celsius". Bruno diz "amanhã a máxima será de 27 a 28 graus". Segundo Popper, qual previsão é mais científica, e por quê?
    options:
      - text: 'A de Bruno: ela proíbe muito mais resultados, então arrisca a refutação; sobreviver a ela nos diria muito mais.'
        correct: true
      - text: 'A de Ana: ela quase certamente está certa, e acertar é o objetivo.'
        feedback: |
          Acertar é o objetivo, mas uma afirmação quase certa de acertar, por proibir quase nada, ensina quase nada. Segundo Popper, uma boa teoria é **ousada**: ela se expõe.
      - text: 'Nenhuma, porque nenhuma previsão sobre o futuro pode ser testada.'
        feedback: |
          Previsões são testadas esperando. A máxima de amanhã será 27,5 ou não será, e a previsão é julgada então.
    explanation: |
      Conteúdo e risco andam juntos: quanto mais uma afirmação proíbe, mais ela diz e mais fácil é refutá-la. Uma teoria que passa por um teste *severo* (um que provavelmente teria falhado se fosse falsa) é **corroborada**. A corroboração é um registro de desempenho passado, não uma prova para o futuro, e é assim que Popper responde a Hume (ver a lição sobre indução).

  - type: text
    id: examples
    title: "Os exemplos do próprio Popper"
    image:
      src: img/eclipse1919-iau.webp
      alt: Fotografia em preto e branco do eclipse solar total de 1919, um disco escuro cercado pela coroa solar brilhante
      caption: Um negativo do eclipse solar total de 29 de maio de 1919, dos relatórios das expedições de Dyson, Eddington e Davidson; estrelas fotografadas em torno do Sol escurecido, em placas como esta, tiveram suas posições comparadas com a previsão.
      credit: F. W. Dyson, A. S. Eddington, and C. Davidson, CC BY 4.0, via Wikimedia Commons
      link: https://commons.wikimedia.org/wiki/File:1919_eclipse_(iau1907c).tif
    body: |
      Popper disse que se impressionou com o contraste entre dois tipos de teoria.

      - **A relatividade geral de Einstein.** Ela previu que a luz das estrelas que passa perto do Sol é desviada por uma quantidade definida. Em **1919**, durante o eclipse solar de 29 de maio, expedições lideradas por **Arthur Eddington** (1882-1944) e outros fotografaram estrelas perto do Sol. Se as estrelas tivessem permanecido onde as ideias newtonianas as colocavam, a teoria de Einstein teria sido refutada. Ela arriscou muito, e sobreviveu.
      - **A história marxista e a psicanálise freudiana** (os alvos de Popper). Ele admirava a ambição delas, mas argumentou que seus defensores podiam ler *qualquer* evento como confirmação: um paciente que se comporta de um jeito, ou do jeito oposto, "encaixa" na teoria. Uma teoria que consegue explicar todo desfecho não proíbe nenhum, e por isso, segundo Popper, não é testada pelos desfechos.

      Os defensores responderam que Popper julgava as teorias pelas versões populares mais frouxas. Marxistas e psicanalistas de um tipo mais cuidadoso de fato fizeram afirmações arriscadas (algumas das quais se revelaram falsas), e a teoria psicanalítica, segundo eles, é uma forma de compreender significados que não se reduz à previsão. Ambos são debates em aberto; o que está claro é o *teste* de Popper: perguntar "o que contaria contra ela?".

  - type: mcq
    id: examples-q
    title: "O que contaria contra ela?"
    prompt: |
      Um amigo diz: "Minha teoria explica tudo. Se você tiver sucesso, é porque a teoria está certa; se fracassar, é justamente o que a teoria diz que acontece quando as pessoas são teimosas." Segundo Popper, o que há de errado nisso?
    options:
      - text: 'Como ela se ajusta a todo desfecho, nenhum desfecho poderia contar contra ela, então ela não foi testada.'
        correct: true
      - text: 'Está errada porque é uma teoria sobre pessoas, e não sobre física.'
        feedback: |
          O teste de Popper diz respeito à forma lógica de uma afirmação (o que ela proíbe), não ao assunto. Uma teoria sobre pessoas pode ser ousada se nomear desfechos que proíbe.
      - text: 'Está errada porque ainda não foi provada.'
        feedback: |
          Para Popper, nada é jamais provado. O problema é o oposto: ela nunca pode ser pega em erro.
    explanation: |
      Todo "sim" e todo "não" se encaixam, então a teoria do amigo está a salvo de refutação. Para Popper, essa segurança é uma fraqueza, não uma força.

  - type: text
    id: duhem
    title: "Uma armadilha: nunca é uma afirmação isolada"
    image:
      src: img/duhem.webp
      alt: Fotografia de retrato de Pierre Duhem, homem de barba, por volta de 1900
      caption: Pierre Duhem (1861-1916), que argumentou em *La théorie physique* (1906) que uma hipótese física nunca é testada isoladamente.
      credit: Unknown author, Public domain, via Wikimedia Commons
      link: https://commons.wikimedia.org/wiki/File:Pierre_Duhem_1900_(cropped).jpg
    body: |
      O físico e filósofo francês **Pierre Duhem** (1861-1916) apontou uma armadilha que Popper depois precisou enfrentar. Uma teoria quase nunca prevê algo **sozinha**. Para prever o que um telescópio mostra, você também supõe como o telescópio funciona, o que o ar faz com a luz, como os dados são lidos e quais outros corpos existem. Essas são as **hipóteses auxiliares**, $A$.

      Então o argumento real é: se ($T$ e $A$) então $O$; não $O$; logo **não** ($T$ e $A$). Algo é falso, mas o argumento não diz qual parte.

      **Um caso famoso.** Por volta dos anos 1840, a órbita de Urano não coincidia com as previsões newtonianas. **Urbain Le Verrier** (1811-1877) supôs que Newton estava certo e que um planeta não visto puxava Urano; calculou onde ele deveria estar, e em **1846** astrônomos em Berlim encontraram Netuno a cerca de um grau da posição calculada. Le Verrier então tentou a mesma jogada com Mercúrio, cuja órbita também não se encaixava: propôs um planeta interior não visto, "Vulcano". Ele nunca foi encontrado. A anomalia de Mercúrio foi explicada em **1915** pela nova teoria de Einstein, não por um novo planeta.

  - type: mcq
    id: duhem-q
    title: "Qual premissa falha?"
    prompt: |
      A gravitação newtoniana ($T$) mais "os planetas conhecidos são tudo o que existe" ($A$) previu uma órbita errada para Urano. Qual conclusão a previsão falha força logicamente?
    options:
      - text: 'Pelo menos um de $T$ e $A$ é falso; a previsão sozinha não diz qual.'
        correct: true
      - text: 'A gravitação newtoniana ($T$) é falsa.'
        feedback: |
          Essa é uma possibilidade, e Mercúrio mostra que pode ser a correta. Mas, para Urano, o culpado acabou sendo $A$: havia outro planeta. A lógica diz apenas que o *par* falha.
      - text: 'Os planetas conhecidos não são tudo o que existe ($A$ é falsa).'
        feedback: |
          Verdadeiro para Urano (Netuno existe), mas não forçado pela lógica. Para Mercúrio, a culpa recaiu sobre $T$. O argumento não escolhe.
    explanation: |
      A refutação é um passo válido apenas para o conjunto inteiro. Qual membro abandonar é um juízo adicional, que depende de como cada um se saiu em outros casos. É por isso que dois cientistas podem ver a mesma previsão falha e culpar partes diferentes.

  - type: mcq
    id: duhem-q2
    title: "Escapar da refutação"
    prompt: |
      Alguém mostra que, sempre que uma previsão falha, sempre é possível culpar uma hipótese auxiliar e manter a teoria. Qual conclusão é **melhor sustentada**?
    options:
      - text: 'A refutação nunca é totalmente conclusiva, então o que importa é se o resgate é testável de modo independente (Netuno era; "Vulcano" não era).'
        correct: true
      - text: 'A falsificação é inútil, porque qualquer teoria pode ser mantida para sempre.'
        feedback: |
          Uma teoria *pode* ser mantida culpando outra coisa, mas o resgate tem um custo: precisa ser testado por seus próprios méritos. Netuno teve um lugar indicado para procurar e foi encontrado; o resgate de Vulcano foi tentado e fracassou. Popper chamava de "ad hoc" os resgates sem teste independente, e não gostava deles.
      - text: 'Os cientistas devem abandonar uma teoria na primeira previsão falha.'
        feedback: |
          Isso teria descartado a teoria de Newton por causa de Urano, e Netuno nunca teria sido encontrado. A primeira falha pede investigação, não rendição automática.
    explanation: |
      As duas visões aqui são defensáveis. Os falsificacionistas estritos dizem que um resgate precisa aumentar a testabilidade da teoria, ou é ad hoc. Os seguidores de Duhem (e depois Quine) enfatizam que o teste é de uma rede inteira de crenças, então nenhuma refutação isolada é tão limpa quanto o caso dos cisnes.

  - type: text
    id: objection
    title: "Poderosa, mas é completa?"
    body: |
      O teste de Popper é claro e influenciou muito os cientistas. Três pontos de pressão são frequentemente levantados:

      - **Afirmações probabilísticas.** "Esta moeda dá cara metade das vezes" não proíbe nenhuma sequência isolada de lançamentos. Até 100 caras seguidas são possíveis, só que extremamente improváveis. Então a refutação precisa de uma regra para "improvável o bastante", que a estatística fornece, mas a lógica estrita não.
      - **Afirmações de "existe".** "Há um cisne negro em algum lugar" é confirmada ao se encontrar um, mas uma busca finita que não encontra nenhum não a refuta. A lógica é a imagem espelhada de "todos os cisnes são brancos".
      - **Significativa, mas não falsificável?** O próprio Popper disse que afirmações não falsificáveis (metafísica, ética, muitas ideias religiosas) não são necessariamente sem sentido; apenas não fazem parte da ciência empírica. Outros, como os positivistas lógicos antes dele, consideraram sem sentido as afirmações não verificáveis. Ainda outros dizem que algumas ideias metafísicas (por exemplo, o atomismo) foram úteis muito antes de poderem ser testadas.

  - type: mcq
    id: objection-q
    title: "Qual é a lacuna?"
    prompt: |
      "Existe um planeta além de Netuno cuja órbita leva mais de 10.000 anos" não pode ser refutada por olhar para o céu durante uma década sem encontrar nada. Qual é a lacuna?
    options:
      - text: 'É uma afirmação de "existe": uma busca finita fracassada não a refuta, embora um achado a confirmasse.'
        correct: true
      - text: 'É uma afirmação probabilística, então nenhum desfecho a contradiz.'
        feedback: |
          A afirmação não é sobre chances. Um único achado claro a resolveria; é uma afirmação de existência simples.
      - text: 'Não tem sentido, porque não pode ser refutada.'
        feedback: |
          Não é sem sentido: fica claro como seria encontrá-lo. Só que uma busca negativa nunca pode encerrar o caso. O teste de Popper dá um veredito sobre afirmações universais; esta tem a lógica espelhada.
    explanation: |
      Afirmações universais ("todos") podem ser refutadas, mas nunca confirmadas por um registro finito; afirmações de existência ("algum") podem ser confirmadas, mas nunca refutadas por um. A ciência usa os dois tipos, então um único teste não pode fazer todo o trabalho.

  - type: mcq
    id: meaningful
    title: "Duas visões sobre o não falsificável"
    prompt: |
      "A crueldade é errada" não é falsificável por nenhuma observação. Qual das leituras a seguir a visão própria de Popper permite?
    options:
      - text: 'Não é uma afirmação da ciência empírica, mas isso não a torna sem sentido nem sem importância.'
        correct: true
      - text: 'É falsa, porque nada pode confirmá-la.'
        feedback: |
          Não ser falsificável não torna uma afirmação falsa. Apenas a coloca fora do que os experimentos podem decidir. Chamá-la de falsa exigiria um argumento próprio.
      - text: 'É um absurdo sem sentido, porque só afirmações testáveis têm sentido.'
        feedback: |
          Essa é a visão mais estrita dos positivistas lógicos, que Popper rejeitou. Ele usou a falsificabilidade para delimitar a *ciência*, não para decidir o que é significativo.
    explanation: |
      Popper separou duas questões: o que conta como **ciência** empírica (seu critério), e o que conta como **significativo** (ele não igualava as duas). Outros as igualam, e o desacordo é vivo. Isso importa para níveis posteriores, em que afirmações sobre Deus, a mente e a ética precisam ser julgadas por critérios próprios.

  - type: mcq
    id: layers
    title: "Três camadas"
    prompt: |
      Qual destas afirmações sobre Popper é um **debate em aberto** (camada 2), e não fato estabelecido (camada 1) nem compromisso (camada 3)?
    options:
      - text: 'Se a falsificabilidade é o critério certo para distinguir ciência de não ciência.'
        correct: true
      - text: 'Que um único cisne negro claro torna "todos os cisnes são brancos" falsa.'
        feedback: |
          É lógica somada a uma observação: se o cisne for de fato negro e de fato um cisne, a afirmação é falsa. Camada 1.
      - text: 'Que Popper escreveu *Logik der Forschung* em 1934.'
        feedback: |
          Um fato simples da história. Camada 1.
    explanation: |
      A lógica da refutação não está em disputa. O que está em disputa é até onde ela vai: se ela demarca a ciência, como lidar com hipóteses auxiliares e o que dizer sobre afirmações que não podem ser testadas. Isso é camada 2.

  - type: mcq
    id: return
    title: "De volta aos cisnes"
    prompt: |
      Encontra-se um cisne negro. Qual resposta melhor corresponde à imagem da ciência de Popper?
    options:
      - text: 'Abandonar "todos os cisnes são brancos" e propor um substituto mais ousado, por exemplo "a cor dos cisnes depende da região", que pode ser testado por sua vez.'
        correct: true
      - text: 'Manter "todos os cisnes são brancos" e declarar que os cisnes negros não são cisnes de verdade.'
        feedback: |
          Redefinir "cisne" para excluir o caso contrário salva a afirmação esvaziando-a: agora ela não proíbe nada. Esse é o movimento ad hoc contra o qual Popper alertava.
      - text: 'Desistir dos cisnes: nenhuma afirmação sobre a natureza pode ser conhecida.'
        feedback: |
          A visão de Popper é o oposto: aprendemos encontrando erros. Uma refutação é progresso, porque nos diz o que é falso.
    explanation: |
      Para Popper, um erro encontrado é conhecimento ganho. Nunca chegamos à certeza, mas podemos nos aproximar da verdade eliminando falsidades. Se isso é resposta suficiente ao problema de Hume é, como disse a lição sobre indução, ainda debatido.

  - type: text
    id: summary
    body: |
      **Próximo:** Popper imagina a ciência como uma sequência constante de chutes ousados e refutações. O historiador **Thomas Kuhn** (1922-1996) observou como a ciência era de fato praticada e viu algo diferente: longos períodos calmos e mudanças súbitas de visão de mundo inteira. O que acontece com a refutação quando os pressupostos compartilhados de uma comunidade são justamente o que está em questão?
