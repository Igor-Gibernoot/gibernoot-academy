source_hash: 653026e59c64
id: ch02-paradigms
title: "Kuhn: quando a ciência muda de ideia"
kind: concept
own: |
  - **O enigma.** Segundo Popper (1902-1994), uma única previsão falha deveria afundar uma teoria. Mesmo assim, cientistas muitas vezes mantêm uma teoria depois de uma previsão falha: para a órbita de Urano (anos 1840) culparam um planeta não visto, e a gravitação newtoniana foi mantida. O historiador **Thomas Kuhn** (1922-1996), em *The Structure of Scientific Revolutions* (*A Estrutura das Revoluções Científicas*, 1962), perguntou como a ciência é de fato praticada.
  - **Paradigma e ciência normal.** Segundo Kuhn, um **paradigma** é {{ o pacote compartilhado de exemplos, teorias, métodos e padrões dentro do qual uma comunidade científica trabalha }}. Na maior parte do tempo, os cientistas fazem **ciência normal**: {{ resolução de quebra-cabeças dentro do paradigma, que não está ele mesmo em julgamento }}. Um quebra-cabeça que falha costuma ser atribuído ao cientista ou ao instrumento, e não ao paradigma.
  - **O ciclo.** As anomalias (resultados que o paradigma não consegue explicar) se acumulam; a maioria é deixada de lado. Algumas se tornam uma **crise**; uma **revolução** então substitui o paradigma por um rival, e começa uma nova ciência normal:
  {{ $$\begin{gathered}\text{normal science} \to \text{anomalies} \to \text{crisis} \\ \to \text{revolution} \to \text{new normal science}\end{gathered}$$ }}
  Exemplos: a astronomia geocêntrica de Ptolomeu para Copérnico (*De revolutionibus*, 1543); Newton (*Principia*, 1687) para Einstein (relatividade geral, 1915).
  - **Incomensurabilidade: duas visões.** Segundo Kuhn, paradigmas rivais podem ser **incomensuráveis**: diferem em {{ os problemas que consideram importantes, os padrões de uma boa resposta e até o significado de termos-chave }}, então não há uma régua neutra para uma comparação ponto a ponto (compare com a **mudança de gestalt**, como no desenho do pato-coelho: as mesmas linhas, vistas como outra coisa). Segundo os críticos (Popper, Lakatos entre eles), isso é exagerado: teorias rivais ainda fazem previsões que podem ser comparadas.
  - **Não é mero relativismo.** Pela resposta de Kuhn, os cientistas compartilham **valores** que orientam a escolha entre paradigmas: {{ precisão, alcance, simplicidade, consistência e fecundidade }}. Cientistas diferentes os pesam de modos diferentes, então a escolha não é mecânica, mas também não é arbitrária.
  - **Onde pessoas atentas se separam.** Se a ciência é **cumulativa** (cada teoria melhora a anterior, visão comum) ou avança por **revoluções** (Kuhn); se a mudança de teoria nos aproxima da verdade ou apenas de uma ferramenta melhor (realistas contra instrumentalistas, um debate em aberto, camada 2); e se escolher por valores compartilhados conta como racional (Kuhn: sim; alguns críticos: não o bastante).
cards:
  - type: mcq
    id: hook
    title: "Uma previsão falha"
    prompt: |
      A teoria da gravitação de Newton prevê a órbita de Mercúrio. Durante décadas do século XIX, a órbita medida diferiu da previsão por uma pequena quantidade, e os astrônomos continuaram usando a teoria de Newton para todo o resto. Antes de qualquer teoria da ciência, **chute**: por que eles simplesmente não a abandonaram?
    options:
      - text: 'Porque a teoria tinha funcionado muito bem em outros casos, e uma discrepância num caso podia vir de outra coisa (um planeta não visto, dados ruins) ou de uma lacuna ainda a ser compreendida.'
        correct: true
      - text: 'Porque os cientistas são teimosos e ignoram evidências de que não gostam.'
        feedback: |
          Às vezes é verdade para indivíduos, mas aqui os astrônomos levaram a discrepância a sério e trabalharam nela por décadas. Julgaram que uma anomalia não superava um enorme histórico de sucesso. Isso é um julgamento, não mera teimosia.
      - text: 'Porque a discrepância não era realmente uma previsão falha, apenas um erro de arredondamento.'
        feedback: |
          A diferença era real e medida (cerca de 43 segundos de arco por século, um ângulo minúsculo, mas bem acima dos erros). Era uma anomalia genuína.
    explanation: |
      Abandonar uma teoria no instante em que uma previsão falha não é como os cientistas se comportam, e não só por teimosia. O ponto de Duhem, da lição Popper e o cisne negro, explica parte disso: uma previsão repousa sobre a teoria mais hipóteses auxiliares. O historiador **Thomas Kuhn** foi além e perguntou o que uma comunidade científica faz quando mantém uma teoria através de anomalias, e quando, raramente, a descarta.

  - type: text
    id: kuhn
    title: "Thomas Kuhn"
    image:
      src: img/kuhn2.webp
      alt: Retrato ilustrado, em estilo de aquarela, de Thomas Kuhn usando óculos de armação grossa
      caption: Thomas Kuhn (1922-1996), em um retrato ilustrado moderno; publicou *The Structure of Scientific Revolutions* (*A Estrutura das Revoluções Científicas*) em 1962.
      credit: Davi.trip, CC BY-SA 4.0, via Wikimedia Commons
      link: https://commons.wikimedia.org/wiki/File:Thomas-kuhn-portrait.png
    body: |
      **Thomas Kuhn** (1922-1996) formou-se em física e tornou-se historiador e filósofo da ciência. Em ***The Structure of Scientific Revolutions*** (*A Estrutura das Revoluções Científicas*, 1962) argumentou, em paráfrase, que a imagem da ciência presente nos livros didáticos, como um acúmulo constante de fatos, está errada; a história mostra longos períodos calmos interrompidos por sobressaltos súbitos.

      Sua palavra-chave é **paradigma** (do grego *paradeigma*, "padrão, exemplo"). Em palavras simples, um paradigma é o pacote inteiro que uma comunidade científica compartilha: seus exemplos marcantes de problemas resolvidos, suas teorias principais, seus métodos e instrumentos, e sua noção do que é uma boa resposta. A mecânica newtoniana foi um; a astronomia geocêntrica de Ptolomeu também foi.

      Lembre-se das três camadas. Que os cientistas trabalham dentro de estruturas compartilhadas é **história** (camada 1). Se isso significa que a ciência não é simplesmente cumulativa é **um debate em aberto** (camada 2), e esta lição apresenta os dois lados.

  - type: mcq
    id: normal
    title: "O que a maioria dos cientistas faz"
    prompt: |
      Segundo Kuhn, a **ciência normal** é a maior parte do que os cientistas fazem. Um químico, trabalhando dentro da teoria aceita dos átomos, passa anos medindo como um novo composto reage e tenta fazer os números se encaixarem na teoria. Qual descrição se encaixa na "ciência normal" de Kuhn?
    options:
      - text: 'Resolução de quebra-cabeças: trabalhar nos detalhes de problemas que o paradigma diz ter resposta, com o próprio paradigma tomado como dado.'
        correct: true
      - text: 'Teste constante da teoria básica, na esperança de refutá-la o quanto antes.'
        feedback: |
          Isso descreve o ideal de Popper. Segundo Kuhn, uma comunidade em atividade não passa os dias tentando derrubar a própria estrutura; se fizesse isso, avançaria pouco nos detalhes.
      - text: 'Chutar às cegas, sem suposições compartilhadas.'
        feedback: |
          O oposto. A ciência normal é disciplinada por suposições compartilhadas sobre o que conta como problema, método e solução.
    explanation: |
      Kuhn a comparou a resolver uma palavra cruzada ou um quebra-cabeça: você supõe que o problema tem solução e que as regras são fixas. Quando um quebra-cabeça falha, a culpa recai sobre quem resolve ou sobre o instrumento, não sobre as regras. Duas visões: Kuhn diz que é por isso que a ciência é produtiva; seguidores de Popper respondem que a ciência deveria ser mais autocrítica do que isso. A resposta de Kuhn é que, sem a estrutura compartilhada, não haveria quebra-cabeça preciso em que pudesse falhar.

  - type: mcq
    id: anomaly
    title: "Anomalias são deixadas de lado"
    image:
      src: img/leverrier.webp
      alt: "Gravura de retrato do astrônomo Urbain Le Verrier"
      caption: "Urbain Le Verrier (1811-1877) calculou a posição de um planeta não visto a partir da órbita de Urano; Johann Galle o encontrou ali, em Berlim, em 23 de setembro de 1846."
      credit: "Magnus Manske, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Urbain_Le_Verrier.jpg"
    prompt: |
      Nos anos 1840, a órbita de Urano não coincidia com as previsões newtonianas. Astrônomos (Le Verrier na França, Adams na Inglaterra) supuseram um planeta não visto e calcularam onde ele deveria estar; Netuno foi encontrado ali em 1846. Segundo Kuhn, por que é normal que a maioria das **anomalias** (resultados que o paradigma não consegue explicar) seja deixada de lado ou explicada à parte, no começo?
    options:
      - text: 'Porque o paradigma tem um grande histórico de sucesso, então um quebra-cabeça que falha costuma ser atribuído a algo corrigível, como no caso de Urano; a maioria das anomalias é, de fato, resolvida dentro do paradigma.'
        correct: true
      - text: 'Porque anomalias nunca são evidência real.'
        feedback: |
          As anomalias são reais. O ponto é que a comunidade não trata nenhuma delas isoladamente como decisiva. Netuno foi encontrado *porque* os astrônomos levaram a anomalia de Urano a sério.
      - text: 'Porque os cientistas não as perceberam.'
        feedback: |
          Geralmente perceberam. A história de Kuhn mostra que as anomalias costumavam ser conhecidas por muito tempo (a órbita de Mercúrio por décadas) antes de importarem.
    explanation: |
      Kuhn acrescenta uma reviravolta ao ponto de Duhem: uma anomalia é um quebra-cabeça até ser vista como uma crise. No caso de Mercúrio, a mesma estratégia (um planeta não visto, chamado Vulcano) foi tentada e fracassou, e a anomalia permaneceu. Essa é exatamente a diferença entre um quebra-cabeça que é resolvido dentro do paradigma e um que começa a corroê-lo.

  - type: order
    id: cycle
    prompt: |
      Segundo Kuhn, a ciência avança num ciclo. Ponha suas etapas em ordem.
    steps:
      - 'Ciência normal: resolução de quebra-cabeças dentro de um paradigma aceito.'
      - 'As anomalias se acumulam: resultados que o paradigma não consegue explicar, e que resistem aos remédios habituais.'
      - 'Crise: a comunidade perde a confiança, e surge um paradigma rival.'
      - 'Revolução: a comunidade muda sua adesão para o paradigma rival.'
      - 'Nova ciência normal: resolução de quebra-cabeças dentro do novo paradigma.'
    hint: 'Primeiro a calma, depois o problema, depois a agitação, e então a calma de novo.'
    explanation: |
      Exemplos estudados por Kuhn: a astronomia geocêntrica de Ptolomeu, cheia de círculos extras para ajustar as observações, cedeu lugar ao sistema heliocêntrico de Copérnico (*De revolutionibus*, 1543); a mecânica de Newton (*Principia*, 1687) reinou por mais de dois séculos, até a relatividade e a teoria quântica (a relatividade geral de Einstein, 1915, explicou a órbita de Mercúrio). Os historiadores ainda debatem o quanto cada caso se encaixa de forma limpa no ciclo.

  - type: mcq
    id: gestalt
    title: "As mesmas linhas, uma nova imagem"
    image:
      src: img/duckrabbit.webp
      alt: Antigo desenho de linhas que pode ser lido como um pato voltado para a esquerda ou um coelho voltado para a direita
      caption: O desenho apareceu na revista de humor alemã *Fliegende Blätter* em 23 de outubro de 1892, sob a pergunta de quais dois animais mais se parecem.
      credit: Unknown artist, Public domain, via Wikimedia Commons
      link: https://commons.wikimedia.org/wiki/File:Kaninchen_und_Ente.png
    prompt: |
      Imagine o conhecido desenho em que as mesmas linhas podem ser vistas como um pato voltado para a esquerda ou como um coelho voltado para a direita. Você vê apenas o pato; então alguém aponta o coelho e, de repente, você não consegue deixar de vê-lo também. Kuhn usou essa **mudança de gestalt** (do alemão *Gestalt*, "forma, figura inteira") como analogia para uma revolução. Qual é a analogia?
    options:
      - text: 'Os dados (as linhas) permanecem os mesmos, mas os cientistas passam a vê-los como outro padrão, e não é um argumento passo a passo que faz a troca.'
        correct: true
      - text: 'Novos dados substituem os antigos, por isso a imagem muda.'
        feedback: |
          No desenho, as linhas não mudam nada. O ponto de Kuhn é que as mesmas observações podem ser organizadas de dois modos, e a mudança está na organização.
      - text: 'Os cientistas simplesmente escolhem a imagem de que gostam mais.'
        feedback: |
          A analogia diz respeito a como a troca *parece* (súbita, da figura inteira). Não diz que a escolha é um capricho: as próximas cartas perguntam o que orienta a escolha.
    explanation: |
      Exemplos de Kuhn: antes e depois de Copérnico, os astrônomos olhavam para o mesmo céu; um peso oscilante era um corpo em queda restringido para os aristotélicos e um pêndulo para Galileu. A resposta de um crítico: uma analogia não é um argumento, e os cientistas de fato dão razões para mudar, às quais as cartas seguintes se voltam.

  - type: mcq
    id: incommensurable
    title: "Nenhuma régua neutra?"
    prompt: |
      Segundo Kuhn, paradigmas rivais podem ser **incomensuráveis** (do latim e do grego, "sem uma medida comum"). Por exemplo, "massa" significa uma coisa em Newton (uma quantidade fixa) e outra em Einstein (está ligada à energia). Qual é a afirmação de Kuhn, e o que os críticos respondem?
    options:
      - text: 'Kuhn: os paradigmas rivais diferem em problemas, padrões e até significados, então não existe comparação neutra ponto a ponto. Críticos: isso é exagerado, já que teorias rivais ainda fazem previsões sobre observações que podem ser comparadas.'
        correct: true
      - text: 'Kuhn: quaisquer duas teorias são igualmente boas. Críticos: não são.'
        feedback: |
          Kuhn negou isso explicitamente. Incomensurabilidade é uma afirmação sobre a dificuldade de comparar, não que toda teoria seja tão boa quanto qualquer outra. A próxima carta traz a resposta dele à acusação de relativismo.
      - text: 'Kuhn: um paradigma pode ser derivado do outro. Críticos: não pode.'
        feedback: |
          É quase o inverso. Os defensores da continuidade (como em muitos livros didáticos) dizem que a teoria de Newton é um caso limite da de Einstein; Kuhn responde que, mesmo assim, os *significados* de seus termos mudam.
    explanation: |
      Duas visões, ambas vivas. Kuhn: a tradução entre paradigmas nunca é perfeita, e os argumentos tendem a falar um ao lado do outro. Seus críticos (Popper, Lakatos, muitos filósofos posteriores): quando as duas teorias preveem a mesma coisa mensurável, a evidência ainda pode decidir, então a comparação é possível. O próprio Kuhn depois suavizou a afirmação, limitando-a a certos termos-chave.

  - type: mcq
    id: relativism
    title: "É só relativismo?"
    prompt: |
      Objeção: se os paradigmas não podem ser comparados de modo neutro, então escolher entre eles é uma questão de moda ou de poder, e a ciência não é mais racional do que qualquer outro sistema de crenças. Como Kuhn respondeu?
    options:
      - text: 'Os cientistas compartilham valores (precisão, alcance, simplicidade, consistência, fecundidade) que orientam a escolha; eles os pesam de modos diferentes, então não há uma regra mecânica, mas a escolha não é arbitrária.'
        correct: true
      - text: 'Ele concordou: não há base racional para a escolha.'
        feedback: |
          Kuhn rejeitou explicitamente essa leitura do seu livro. Chamou a ciência de um modelo de racionalidade e disse que valores compartilhados fazem um trabalho que um algoritmo não consegue fazer.
      - text: 'Ele disse que a teoria antiga sempre perde, por definição.'
        feedback: |
          Não é assim. Os valores compartilhados podem favorecer qualquer um dos lados; o ponto de Kuhn é que as comunidades decidem pesando-os, e os pesos podem variar.
    explanation: |
      Vista pelos defensores de Kuhn, esta é a melhor versão a seu favor: há razões, embora elas não sejam uma fórmula. Vista por alguns críticos, "pese os valores como achar melhor" deixa espaço demais para influências pessoais ou sociais. Qual visão está certa é um debate em aberto (camada 2), e isso importa para níveis posteriores: molda como se pergunta se uma teoria da mente, ou da origem do universo, é melhor do que outra.

  - type: mcq
    id: popper-vs-kuhn
    title: "Popper e Kuhn lado a lado"
    image:
      src: img/popper.webp
      alt: "Fotografia de Karl Popper, já idoso, de cabelos brancos, tirada antes de 1987"
      caption: "Karl Popper (1902-1994), filósofo da ciência nascido na Áustria, publicou *Logik der Forschung* em 1934; ele sustentava que a ciência avança tentando refutar conjecturas ousadas."
      credit: "DorianKBandy, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Photo_of_Karl_Popper.jpg"
    prompt: |
      Qual par contrasta corretamente Popper e Kuhn, segundo os próprios escritos deles?
    options:
      - text: 'Popper: a ciência avança por conjectura ousada e tentativa de refutação, e uma refutação clara conta contra a teoria. Kuhn: a maior parte da ciência é resolução de quebra-cabeças dentro de um paradigma, e um paradigma só é abandonado numa crise, em favor de um rival.'
        correct: true
      - text: 'Popper: os cientistas se apegam às teorias qualquer que seja a evidência. Kuhn: os cientistas abandonam teorias na primeira anomalia.'
        feedback: |
          Invertido. Popper pedia que se abandonasse a teoria refutada; Kuhn descreveu uma comunidade que se mantém através das anomalias.
      - text: 'Popper: a ciência é relativa à cultura. Kuhn: a ciência é um empreendimento puramente lógico.'
        feedback: |
          Nenhum dos dois se encaixa: Popper enfatizou a lógica e o teste; Kuhn enfatizou a história e a comunidade, mas não o relativismo.
    explanation: |
      O relato de Popper diz como a ciência *deveria* ser feita (uma norma), e o de Kuhn diz como ela *é* feita (história), embora Kuhn achasse que sua descrição também tinha força normativa. Podem ser parcialmente conciliados: um paradigma se mantém até que um rival prometa mais, e uma refutação pesa mais quando um rival está pronto. Vê-los como rivais ou como complementares é, de novo, uma questão em aberto.

  - type: mcq
    id: layers
    title: "Três camadas"
    prompt: |
      Qual destas é um **debate em aberto** (camada 2), e não fato estabelecido (camada 1) nem compromisso (camada 3)?
    options:
      - text: 'Se a história da ciência é mais bem descrita como um acúmulo constante ou como uma série de revoluções.'
        correct: true
      - text: 'Que Copérnico publicou *De revolutionibus* em 1543.'
        feedback: |
          Um fato simples da história. Camada 1.
      - text: 'Que a previsão newtoniana para Mercúrio diferia ligeiramente da órbita medida, e que a relatividade geral (1915) deu conta disso.'
        feedback: |
          Observação e cálculo, amplamente estabelecidos. Camada 1. (O que isso mostra sobre o *progresso* é onde o debate começa.)
    explanation: |
      As datas e o resultado de Mercúrio não são contestados. O debate é sobre o padrão: as teorias se somam (cada uma inclui a anterior como caso especial, como Newton em Einstein para baixas velocidades), ou ocorre algo mais parecido com uma mudança de visão de mundo? E há uma camada mais profunda: se essa mudança nos aproxima da verdade (os realistas dizem que sim) ou apenas de instrumentos melhores (os instrumentalistas), o que muitas vezes é um compromisso de camada 3 sobre para que servem as teorias.

  - type: mcq
    id: return
    title: "De volta a Mercúrio"
    prompt: |
      A gravitação newtoniana continuou sendo usada enquanto a órbita de Mercúrio era uma anomalia, e só foi deslocada quando a relatividade geral ofereceu um rival que explicava Mercúrio (e fazia novas previsões, como a deflexão da luz das estrelas confirmada em 1919). Qual leitura se encaixa no quadro de Kuhn?
    options:
      - text: 'Mercúrio foi um quebra-cabeça no início e só se tornou parte de uma crise quando um paradigma rival o explicou e foi além; a comunidade mudou de adesão então, e não na primeira falha.'
        correct: true
      - text: 'Os astrônomos deveriam ter abandonado Newton nos anos 1850, assim que a discrepância apareceu.'
        feedback: |
          A norma de Popper, lida de forma estrita, poderia dizer isso; mas, sem um rival pronto, abandonar a teoria deixaria os astrônomos sem nada para calcular. Kuhn: um paradigma só é rejeitado quando outro toma o seu lugar.
      - text: 'Einstein provou que Newton nunca foi verdadeiro em nenhum sentido.'
        feedback: |
          As leis de Newton continuam sendo excelentes aproximações em velocidades cotidianas e são usadas todos os dias; o que caiu foi apenas a afirmação de que eram a verdade final. Como descrever melhor isso faz parte do debate sobre o progresso cumulativo.
    explanation: |
      Isto retorna ao enigma inicial: uma teoria é mantida através de uma anomalia porque está funcionando, e é abandonada quando surge um rival melhor. Popper se concentrou na lógica de um único teste; Kuhn, na comunidade decidindo entre estruturas inteiras. Ambos capturam algo real.

  - type: text
    id: summary
    body: |
      **Próximo:** Kuhn mostra que os cientistas pesam a evidência para uma estrutura inteira, e não para uma afirmação de cada vez, e a regra de Bayes é uma forma precisa de descrever exatamente esse peso. Como um grau de crença deve mudar quando chega a evidência? Essa é a lição **A evidência como atualização da crença**.
