source_hash: 358af88406dd
id: ch02-realism
title: "A ciência descreve a realidade?"
kind: concept
own: |
  - **Duas visões sobre o que são as teorias.** Seja $T$ uma teoria científica bem-sucedida (cujas previsões foram confirmadas repetidas vezes). Segundo o **realismo científico**, {{ uma teoria bem-sucedida é aproximadamente verdadeira, e suas coisas inobserváveis (elétrons, campos, genes) realmente existem }}. Segundo o **instrumentalismo**, uma teoria é uma ferramenta para prever e organizar observações, e perguntar se seus inobserváveis são "reais" não é necessário (ou não tem resposta). Os instrumentalistas não dizem que a ciência é inútil: dizem que seu valor é o seu sucesso preditivo.
  - **O argumento sem milagres** (Hilary Putnam, 1975). Seja $S$ "a teoria tem sucesso empírico" e $R$ "a teoria é aproximadamente verdadeira". O argumento se lê assim:
  $$\begin{aligned}\text{P1: }&R \text{ would explain } S\\ \text{P2: }&\text{no rival explains } S \text{ as well}\\ \text{C: }&\text{so, probably, } R\end{aligned}$$
  É uma inferência para a melhor explicação. Um crítico pode rejeitar P2 (teorias falsas podem ter sucesso, ver abaixo) ou duvidar de que o argumento não seja circular, pois usa uma inferência explicativa para defender a inferência explicativa.
  - **A meta-indução pessimista** (Larry Laudan, 1981). Muitas teorias do passado foram bem-sucedidas e hoje são julgadas falsas (o calórico, o flogisto, o éter luminífero). Logo, por indução sobre a história da ciência,
  {{ nossas teorias bem-sucedidas atuais provavelmente também são falsas }}
  e o sucesso não é um sinal confiável de verdade. Este é um argumento indutivo sobre teorias, então o problema de Hume da indução também se aplica a ele.
  - **Respostas dos realistas.** *Realismo seletivo*: só as partes de uma teoria que fizeram o trabalho em seus sucessos merecem crença. *Realismo estrutural* (John Worrall, 1989): o que sobrevive a uma mudança de teoria é {{ a estrutura matemática, as equações, e não a natureza das coisas subjacentes }}. Exemplo: as equações de Fresnel para a reflexão da luz foram mantidas na teoria de Maxwell, embora o éter elástico sobre o qual foram construídas originalmente tenha sido abandonado.
  - **Empirismo construtivo** (Bas van Fraassen, nascido em 1941): a ciência visa a teorias **empiricamente adequadas** (corretas quanto ao que é observável), e aceitar uma teoria é acreditar apenas nisso, e não que seus inobserváveis existam. Um realista responde que a linha entre observável e inobservável é vaga (telescópio, microscópio), então a crença não deveria parar num ponto arbitrário.
  - **Onde pessoas atentas se separam.** Se o sucesso é melhor explicado pela verdade ou pela seleção (as teorias que fracassaram foram descartadas, então só vemos os sobreviventes), e se a história da ciência ensina cautela ou continuidade. Camadas: a história das teorias abandonadas é estabelecida; se o realismo ou o instrumentalismo é melhor é um debate em aberto, apoiado num compromisso metafísico sobre o que a explicação mostra.
cards:
  - type: mcq
    id: hook
    title: "Uma teoria que funcionou e depois foi abandonada"
    prompt: |
      Por volta de 1800, a **teoria do calórico** dizia que o calor é um fluido sem peso, chamado calórico, que flui de corpos quentes para corpos frios. Ela previu corretamente, por décadas, quanto calor é liberado em muitos processos (por exemplo, a velocidade do som no ar, depois da correção de Laplace). Por volta de meados do século XIX, o calor passou a ser entendido como movimento de átomos, e o calórico foi abandonado. Antes de qualquer teoria: chute. A teoria do calórico era *verdadeira* enquanto teve sucesso?
    options:
      - text: 'Sim, totalmente verdadeira: ela previu corretamente, então sua imagem de um fluido de calor estava certa.'
        feedback: |
          Um realista forte não diria isso. Se o sucesso preditivo provasse a imagem, a imagem não poderia ser abandonada depois; mas o calor não é um fluido. Sucesso e imagem se separaram.
      - text: 'Não, e ela nunca foi útil: uma teoria falsa não consegue prever nada.'
        feedback: |
          Teorias falsas podem prever bem dentro de certo alcance: a gravitação de Newton não é a última palavra (a relatividade geral a substituiu) e ainda orienta naves espaciais. A previsão exige apenas alguma correspondência com o mundo, não verdade total.
      - text: 'Em parte: acertou algo (muitos resultados sobre calor), enquanto sua imagem de fluido estava errada; como descrever isso é a questão.'
        correct: true
    explanation: |
      A teoria do calórico era uma boa ferramenta para muitos problemas de calor, e estava errada sobre o que o calor é. **Uma teoria bem-sucedida nos diz como o mundo é, ou apenas como prever o que ele faz?** Os filósofos da ciência chamam a primeira resposta de *realismo* e a segunda de *instrumentalismo*. Esta lição apresenta o melhor argumento de cada uma.

  - type: text
    id: define
    title: "Duas visões, definidas"
    body: |
      **Realismo científico** (segundo seus defensores): nossas melhores teorias são descrições *aproximadamente verdadeiras* do mundo, inclusive das partes que não podemos observar diretamente, como elétrons ou campos. Uma teoria é **aproximadamente verdadeira** quando suas afirmações estão próximas de como as coisas são, mesmo que alguns detalhes estejam errados.

      **Instrumentalismo** (segundo seus defensores): uma teoria é uma *ferramenta*, um instrumento, para prever e organizar o que podemos observar. Perguntar se elétrons "realmente existem" é ou sem resposta possível ou fora de propósito.

      Duas observações. Um instrumentalista não diz que a ciência é inútil; diz que seu valor *é* o poder preditivo. E um realista não afirma que toda teoria atual é exatamente verdadeira; a afirmação é "aproximadamente verdadeira, e melhorando".

      Estas são um *compromisso metafísico* (camada 3 neste curso): os fatos da história da ciência são consensuais; como lê-los é debatido.

  - type: text
    id: nma
    title: "O argumento sem milagres"
    image:
      src: img/putnam.webp
      alt: "Fotografia do filósofo Hilary Putnam, homem mais velho sentado"
      caption: "Hilary Putnam (1926-2016), filósofo americano, apresentou em 1975 o argumento sem milagres a favor do realismo científico."
      credit: "Unknown author, CC BY-SA 2.5, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Hilary_Putnam.jpg"
    body: |
      Segundo Hilary Putnam (1926-2016), em 1975, a melhor razão para o realismo é que ele torna o sucesso da ciência algo que não é milagre. Apresentado como uma prova guiada:

      - **P1.** Nossas melhores teorias são empiricamente bem-sucedidas: preveem resultados novos e surpreendentes.
      - **P2.** A melhor explicação desse sucesso é que as teorias são aproximadamente verdadeiras.
      - **C.** Logo, provavelmente, as teorias são aproximadamente verdadeiras.

      O passo de P1 e P2 para C é a **inferência para a melhor explicação**: escolher a explicação que dá conta dos fatos melhor do que seus rivais. O passo é válido *se* for uma boa regra; se é, justamente o que os críticos questionam.

  - type: mcq
    id: nma-q
    title: "Qual premissa um crítico rejeitaria?"
    prompt: |
      O argumento de Putnam tem P1 (as melhores teorias são bem-sucedidas) e P2 (a melhor explicação desse sucesso é a verdade aproximada). Qual premissa um instrumentalista rejeitaria, e por quê?
    options:
      - text: 'P1: nenhuma teoria é de fato bem-sucedida.'
        feedback: |
          Os instrumentalistas aceitam o sucesso; é todo o seu argumento a favor do valor da teoria. P1 é o ponto de partida comum aos dois lados.
      - text: 'P2: o sucesso pode ser explicado sem verdade (por exemplo, guardamos só as teorias que funcionaram, ou a teoria é adequada às observações), então a verdade não é a *única* boa explicação.'
        correct: true
      - text: 'Só a conclusão C, aceitando P1, P2 e a inferência.'
        feedback: |
          Se P1, P2 e a regra de inferência são todas aceitas, C segue (provavelmente). Um crítico precisa rejeitar uma premissa ou a regra; aceitar as três e negar C é inconsistente.
    explanation: |
      O instrumentalista concede P1 e ataca P2 (ou a regra da inferência para a melhor explicação). Um realista responde que as alternativas explicam menos. Repare que os dois lados **concordam sobre os fatos** e divergem sobre o que conta como a melhor explicação.

  - type: mcq
    id: nma-circ
    title: "O argumento é circular?"
    prompt: |
      Um crítico diz: "Para defender o realismo, você usa a inferência para a melhor explicação. Mas se esse tipo de inferência leva à verdade é exatamente o que realistas e instrumentalistas disputam." Qual é a queixa do crítico?
    options:
      - text: 'O argumento é circular: ele usa, como regra, aquilo que pretende mostrar ser confiável.'
        correct: true
      - text: 'O argumento é inválido, já que C não segue de P1 e P2 por nenhuma regra.'
        feedback: |
          A queixa não é sobre a forma da prova, mas sobre se sua regra principal pode ser confiável sem já pressupor o realismo. (O problema de Hume para a indução tem o mesmo sabor: justificar uma regra usando-a.)
      - text: 'O argumento é verdadeiro por definição, então não precisa de premissas.'
        feedback: |
          Nenhum dos lados pensa isso. O argumento tem premissas empíricas (P1) e uma premissa disputada (P2).
    explanation: |
      Um realista responde que toda regra básica de raciocínio enfrenta a mesma preocupação, então alguma circularidade é inevitável e inofensiva; o crítico responde que isso torna o argumento incapaz de convencer alguém que duvida da regra. As duas respostas são sérias.

  - type: text
    id: pmi
    title: "A meta-indução pessimista"
    body: |
      Larry Laudan (1941-2022), em 1981, respondeu a Putnam com uma lista de teorias que tiveram sucesso em seu tempo e hoje são consideradas falsas: a teoria do **calórico** sobre o calor, o **flogisto** (uma substância que se acreditava liberada na queima, substituída pela explicação de Lavoisier sobre o oxigênio nas décadas de 1770 e 1780) e o **éter luminífero** (um meio que se pensava transportar as ondas de luz, abandonado depois do resultado nulo de Michelson e Morley em 1887 e da relatividade de Einstein em 1905).

      O argumento é uma indução **sobre teorias** (uma "meta-indução"):

      - **P1.** Muitas teorias do passado foram empiricamente bem-sucedidas e hoje são julgadas falsas.
      - **P2.** Nossas teorias atuais não são obviamente diferentes em tipo dessas.
      - **C.** Logo, provavelmente muitas de nossas teorias bem-sucedidas atuais também são falsas, e o sucesso é um sinal ruim de verdade.

  - type: order
    id: pmi-order
    title: "A história do éter em ordem"
    prompt: |
      Ponha estes episódios na ordem em que aconteceram.
    steps:
      - 'Fresnel constrói uma teoria ondulatória da luz bem-sucedida, que trata a luz como ondas num éter (anos 1810-1820).'
      - 'Maxwell mostra que a luz é uma onda eletromagnética (anos 1860).'
      - 'Michelson e Morley não conseguem detectar movimento através do éter (1887).'
      - 'A relatividade restrita de Einstein torna o éter desnecessário (1905).'
    hint: |
      Primeiro a teoria ondulatória da luz, depois a teoria eletromagnética, depois o experimento fracassado, e então a relatividade.
    explanation: |
      O éter foi útil por cerca de um século. Esse é o ponto do pessimista: um longo histórico de sucesso não salvou a entidade central. Repare também no que a história contém: as equações de Fresnel para a *quantidade* de luz refletida sobreviveram à teoria de Maxwell sem mudança. Esse detalhe alimenta a melhor resposta dos realistas.

  - type: mcq
    id: pmi-q
    title: "Quão forte é o argumento pessimista?"
    prompt: |
      Um realista objeta: "A lista de Laudan são alguns casos famosos; há milhares de teorias que nunca pensaríamos em abandonar (a Terra gira em torno do Sol, o DNA carrega a hereditariedade)." Qual é o resumo justo desse debate?
    options:
      - text: 'Os pessimistas vencem: qualquer teoria abandonada refuta o realismo para sempre.'
        feedback: |
          O realismo afirma a verdade *aproximada* de teorias *maduras*, não que toda teoria já proposta seja verdadeira. Alguns fracassos não o refutam; apenas o tornam menos seguro.
      - text: 'Os realistas vencem: os exemplos são apenas anedotas, então o argumento pessimista não tem força.'
        feedback: |
          Uma indução sobre teorias é exatamente uma afirmação sobre o histórico. Se o histórico contém muitos casos de sucesso seguido de rejeição, a preocupação permanece até que alguém explique por que as teorias atuais são diferentes (as próximas cartas).
      - text: 'Depende de como os casos são contados e de quais teorias contam como maduras e bem-sucedidas; o realista precisa mostrar que as teorias atuais são diferentes em tipo.'
        correct: true
    explanation: |
      Este é um debate vivo. Os realistas argumentam que a comparação certa é com teorias *maduras* que fizeram previsões novas e surpreendentes, e que essas raramente desaparecem por completo. Os pessimistas respondem que o calórico e o éter também tiveram previsões novas. Contar casos é tarefa dos historiadores, e não uma prova para nenhum dos lados.

  - type: mcq
    id: selective
    title: "Uma resposta realista: o realismo seletivo"
    prompt: |
      Um realista seletivo diz: "Devemos acreditar não no todo de uma teoria bem-sucedida, mas apenas nas partes que fizeram o trabalho nas suas previsões." Aplicado às histórias do calórico e do éter, o que ele diria?
    options:
      - text: 'As equações do fluxo de calor (as partes usadas para prever) merecem alguma crença; a imagem de um fluido de calor invisível não.'
        correct: true
      - text: 'Nada em nenhuma teoria merece crença, então só restam as observações.'
        feedback: |
          Essa é a posição instrumentalista, e não a do realista seletivo: o realista seletivo mantém a crença nas partes que funcionam.
      - text: 'A teoria inteira merece crença; a parte abandonada nunca foi realmente parte dela.'
        feedback: |
          Isso seria uma reescrita histórica: a teoria do calórico *era* uma teoria de fluido. Os realistas seletivos precisam separar a teoria *antes* da revolução, e não depois, ou a posição não pode ser testada.
    explanation: |
      A dificuldade do realismo seletivo é dizer, *de antemão*, quais partes fazem o trabalho. Os críticos dizem que as partes que funcionam só são identificadas depois, com a visão retrospectiva. Os defensores dizem que o estudo cuidadoso das derivações pode mostrá-lo.

  - type: mcq
    id: structural
    title: "Outra resposta realista: o realismo estrutural"
    prompt: |
      Worrall (1989) aponta: as equações pelas quais Fresnel calculou quanta luz é refletida e refratada numa superfície sobrevivem sem mudança na teoria de Maxwell, embora o éter elástico para o qual foram derivadas originalmente tenha sido abandonado. O que conclui o **realista estrutural**?
    options:
      - text: 'Devemos acreditar na estrutura matemática (relações entre quantidades), que sobrevive à mudança de teoria, e não na natureza das coisas subjacentes.'
        correct: true
      - text: 'O éter ainda existe, disfarçado, então nada foi abandonado.'
        feedback: |
          Os realistas estruturais aceitam que o éter foi abandonado; esse é o ponto. Eles mantêm a estrutura e deixam de lado as afirmações sobre como são as coisas.
      - text: 'As equações são verdadeiras apenas porque são simples, então a navalha de Ockham prova o realismo.'
        feedback: |
          A afirmação de Worrall diz respeito à continuidade da estrutura entre teorias, e não à simplicidade. (A simplicidade como sinal de verdade é o tema disputado da lição Quando os dados não decidem.)
    explanation: |
      O realismo estrutural é um caminho do meio: realismo sobre a **estrutura**, ceticismo sobre a **natureza**. Uma preocupação rival (às vezes apresentada por filósofos como Psillos) é que a distinção é difícil de traçar, já que a estrutura é sempre a estrutura *de* algo. A posição volta no Nível 4, Matemática e Por Que Ela Funciona.

  - type: text
    id: instr
    title: "A versão mais forte do instrumentalismo"
    body: |
      Segundo Bas van Fraassen (nascido em 1941), cuja visão se chama **empirismo construtivo**, a ciência visa a teorias **empiricamente adequadas**: verdadeiras quanto ao que é observável. *Aceitar* uma teoria é acreditar nisso, e usar sua imagem das coisas inobserváveis sem acreditar nessa imagem. Isso difere do instrumentalismo mais antigo, que dizia que falar de inobserváveis não pretende ser verdadeiro ou falso; van Fraassen o toma literalmente e suspende a crença.

      Seu argumento: a evidência que temos se ajusta à parte observável de muitas teorias possíveis (subdeterminação, ver a lição Quando os dados não decidem), então crer além do observável vai além da evidência. Não perdemos nada na prática: a teoria é tão utilizável quanto antes.

      A melhor resposta realista: a linha entre observável e inobservável não é nítida, e a crença sobre o inobservável é o que faz as teorias *explicar*, e não apenas resumir.

  - type: mcq
    id: observable
    title: "Onde fica a linha?"
    image:
      src: img/hacking.webp
      alt: "Fotografia do filósofo Ian Hacking falando num simpósio, 2009"
      caption: "Ian Hacking (1936-2023), filósofo canadense, argumentou em *Representing and Intervening* (1983) que acreditamos nas entidades que podemos usar para manipular outras coisas."
      credit: "Ludvig Hertzberg, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Ian_Hacking_(cropped).jpg"
    prompt: |
      Van Fraassen considera **observável** o que pode ser visto pelos sentidos sem auxílio (talvez de uma posição mais próxima). Um realista pergunta sobre casos intermediários: as luas de Júpiter vistas por um telescópio, bactérias vistas por um microscópio, rastros num detector de partículas. Qual é o argumento do realista?
    options:
      - text: 'Esses casos formam uma sequência gradual, de ver a olho nu a ver com instrumentos, então um corte nítido em "sem auxílio" parece arbitrário.'
        correct: true
      - text: 'Qualquer coisa vista com um instrumento é certa, então toda teoria é confirmada.'
        feedback: |
          Instrumentos podem enganar (artefatos de lente, ruído do detector). O realista argumenta que a *linha* é arbitrária, e não que os instrumentos são infalíveis.
      - text: 'Nada é observável, nem mesmo a olho nu, então van Fraassen não tem argumento.'
        feedback: |
          A resposta de van Fraassen ao argumento da sequência gradual é que fronteiras vagas não abolem a diferença entre casos claros, como em "careca". O desacordo é sério dos dois lados.
    explanation: |
      Van Fraassen responde que uma linha vaga ainda é uma linha: as luas de Júpiter poderiam, em princípio, ser vistas a olho nu de uma nave espacial, ao passo que um elétron não poderia. O filósofo Ian Hacking (1936-2023) apresentou um argumento realista diferente: quando físicos usam elétrons para *fazer* coisas (lançá-los sobre um alvo para mudar a carga dele), os elétrons são tão reais quanto qualquer coisa que manipulamos. São duas outras visões, sem consenso.

  - type: mcq
    id: virtues
    title: "Ligação com a subdeterminação"
    prompt: |
      Duas teorias se ajustam igualmente bem a todos os dados, mas uma é mais simples e explica mais. Segundo um realista, o que essas virtudes extras indicam? E segundo um instrumentalista?
    options:
      - text: 'Realista: são sinais de verdade. Instrumentalista: são razões para preferir a teoria pelo uso e pela beleza, e não sinais de verdade.'
        correct: true
      - text: 'Realista: são apenas questões de gosto. Instrumentalista: são sinais de verdade.'
        feedback: |
          Invertido. O realista usa virtudes como simplicidade e poder explicativo como evidência sobre o mundo; o instrumentalista as trata como práticas ou estéticas.
      - text: 'Os dois concordam que as virtudes são sinais de verdade, então as teorias não são equivalentes.'
        feedback: |
          Os dois concordam que as teorias não são *equivalentes no uso*; divergem sobre se as virtudes apontam para a verdade, que é toda a disputa.
    explanation: |
      O debate sobre o realismo e o debate sobre a subdeterminação são uma mesma questão vista duas vezes. Se as virtudes acompanham a verdade, os dados mais as virtudes podem destacar uma teoria, e a crença no inobservável se justifica. Se não acompanham, os dados deixam a escolha em aberto, e a crença deveria parar no que é observado.

  - type: mcq
    id: traps
    title: "Duas leituras equivocadas"
    multiple: true
    prompt: |
      Selecione toda afirmação que **descreve mal** uma posição desta lição.
    options:
      - text: 'Os realistas científicos dizem que toda teoria atual é exatamente verdadeira.'
        correct: true
        feedback: |
          Descrição equivocada: os realistas dizem *aproximadamente* verdadeira, e sobretudo para teorias maduras e bem testadas, com revisão esperada.
      - text: 'Os instrumentalistas acham que a ciência é inútil ou que seus resultados são falsos.'
        correct: true
        feedback: |
          Descrição equivocada: os instrumentalistas valorizam a ciência por suas previsões e tecnologia; apenas se recusam a acreditar nas partes inobserváveis.
      - text: 'Um realista estrutural sustenta que a estrutura matemática de uma teoria é o que sobrevive à mudança de teoria.'
        feedback: |
          Esta é uma descrição correta.
      - text: 'A meta-indução pessimista argumenta que o sucesso não é um sinal confiável de verdade, usando a história das teorias abandonadas.'
        feedback: |
          Esta é uma descrição correta.
    explanation: |
      As duas leituras equivocadas transformam o oponente num espantalho. Um debate justo começa pela melhor versão de cada lado, e as melhores versões compartilham muito: ambas aceitam o sucesso da ciência, ambas usam seus resultados e ambas revisam suas teorias à luz da evidência.

  - type: mcq
    id: layers
    title: "Três camadas"
    prompt: |
      Classifique a afirmação "O calórico foi uma teoria bem-sucedida que depois foi substituída" e a afirmação "Teorias bem-sucedidas descrevem a realidade inobservável de modo aproximadamente verdadeiro".
    options:
      - text: 'A primeira: fato estabelecido (história). A segunda: um compromisso metafísico, debatido.'
        correct: true
      - text: 'As duas são fatos estabelecidos, já que a ciência as apoia.'
        feedback: |
          A história é fato; a segunda afirmação diz respeito ao que o sucesso *significa*, e a ciência sozinha não resolve isso: realistas e instrumentalistas aceitam os mesmos experimentos.
      - text: 'A primeira: um compromisso de fé. A segunda: fato estabelecido.'
        feedback: |
          Invertido. A primeira é história documentada; a segunda é a interpretação contestada.
    explanation: |
      O realismo é um compromisso de camada 3 sobre a explicação. Pode ser apoiado por argumentos (o sem milagres) e atacado por outros (a indução pessimista); não pode ser lido diretamente de um experimento. Repare que os níveis posteriores usam o mesmo movimento para outras grandes questões.

  - type: mcq
    id: return
    title: "De volta ao calórico"
    prompt: |
      Volte à teoria do calórico: bem-sucedida por décadas, depois abandonada. Como um realista seletivo ou estrutural, e um instrumentalista, leriam esse caso?
    options:
      - text: 'O realista: a parte que fez o trabalho (as relações quantitativas do calor) sobreviveu na termodinâmica; só a imagem do fluido foi embora. O instrumentalista: foi uma boa ferramenta até chegar uma ferramenta melhor; nunca foi preciso acreditar num fluido.'
        correct: true
      - text: 'O realista: o calórico foi verdadeiro o tempo todo. O instrumentalista: foi sempre falso.'
        feedback: |
          Nenhuma das duas se encaixa: o realista concede que a imagem do fluido estava errada, e o instrumentalista não chama de falsa uma boa ferramenta.
      - text: 'Realista e instrumentalista concordam em todas as questões sobre ele, então o debate é vazio.'
        feedback: |
          Concordam sobre a história e as previsões, e divergem sobre qual crença o sucesso justificava. Isso é uma diferença real, que aparece em como cada um trataria as teorias de hoje.
    explanation: |
      Duas leituras de uma mesma história. O realista enfatiza o que sobreviveu; o instrumentalista enfatiza o que nunca foi necessário. A tarefa do leitor é saber qual deveria ser cada premissa para que a sua própria visão se sustente.

