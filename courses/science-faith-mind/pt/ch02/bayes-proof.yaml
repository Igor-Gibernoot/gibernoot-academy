source_hash: a1a81153407e
id: ch02-bayes-proof
title: "Prova guiada: a evidência favorece a teoria que a previu"
kind: guided
proof: true
own: |
  - **Cenário.** Duas teorias rivais $H_1$ e $H_2$ e um pedaço de evidência $E$ (um resultado observado). $P(H)$ é a a priori, $P(E\mid H)$ a verossimilhança (quão provável é $E$ se $H$ for verdadeira) e $P(H\mid E)$ a a posteriori; $P(E)$ é a probabilidade total da evidência. A regra de Bayes diz
  $$P(H\mid E)=\frac{P(E\mid H)\,P(H)}{P(E)}$$
  - **A lei (forma da razão de verossimilhanças).** Dividir a regra de Bayes para $H_1$ pela regra de Bayes para $H_2$ cancela $P(E)$:
  {{ $$\frac{P(H_1\mid E)}{P(H_2\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_2)}\cdot\frac{P(H_1)}{P(H_2)}$$ }}
  Em palavras: as chances a posteriori são iguais à {{ razão de verossimilhanças vezes as chances a priori }}. A evidência favorece $H_1$ sobre $H_2$ exatamente quando a razão de verossimilhanças está acima de $1$, isto é, quando $H_1$ tornou $E$ mais provável do que $H_2$ tornou.
  - **Prever conta pelo quanto se arriscou.** Se $H$ prevê $E$ ($P(E\mid H)=0.9$), mas os rivais raramente produziriam esse resultado ($P(E\mid\neg H)=0.02$, em que $\neg H$ significa "$H$ é falsa"), a razão de verossimilhanças é
  $$\frac{P(E\mid H)}{P(E\mid \neg H)}=\frac{0.9}{0.02}=45$$
  e uma a priori de $10\%$ sobe para $83\%$. Se $E$ fosse igualmente provável quer $H$ seja verdadeira, quer não, a razão é {{ $1$ e a evidência não muda nada }}. Os bayesianos leem as "conjecturas ousadas" de Popper dessa forma; o próprio Popper não atribuía probabilidades às teorias.
  - **Objeção 1: evidência antiga.** Se $E$ já é conhecida, $P(E)=1$ e a regra dá
  $$P(H\mid E)=\frac{P(E\mid H)\,P(H)}{1}=P(H)$$
  (já que $P(E\mid H)=1$ também): nenhum apoio, embora a teoria de Einstein de 1915 aparentemente tenha ganho com a anomalia de Mercúrio, conhecida há muito tempo. Duas respostas: perguntar qual teria sido a a priori {{ se $E$ tivesse ficado de fora do que sabemos (a a priori contrafactual) }}; ou dizer que o que se aprende não é $E$, mas que $H$ implica $E$ (a visão do ajuste explicativo).
  - **Objeção 2: as prioris.** A lei dá chances a posteriori só se uma a priori for fornecida, e as prioris diferem. Respostas: a razão de verossimilhanças mede a força da evidência à parte da a priori; e evidência compartilhada submerge prioris moderadas (sete resultados independentes, cada um com razão $3$, levam $1\%$ a cerca de $96\%$), embora uma a priori de exatamente $0$ nunca se mova.
  - **Camadas.** A identidade das chances é {{ um teorema da probabilidade (estabelecido) }}; se a confiança de um cientista deve obedecê-la é um debate em aberto (camada 2); a a priori dada a uma afirmação grandiosa, como uma visão de mundo inteira, é onde pessoas atentas mais se separam (camadas 2 e 3).
cards:
  - type: mcq
    id: hook
    title: "Dois resultados, uma teoria"
    prompt: |
      A Teoria A e seus rivais são testados por dois experimentos. O resultado X é algo que a Teoria A previu, mas os rivais lhe davam apenas 5% de chance. O resultado Y é algo que a Teoria A previu e que todos os rivais também consideravam 95% provável. Os dois resultados saem como previsto. Antes de qualquer fórmula, **chute**: qual resultado dá à Teoria A o maior impulso sobre os rivais?
    options:
      - text: 'O resultado X: os rivais não esperavam por ele.'
        correct: true
      - text: 'O resultado Y: uma previsão de 95% é mais confiável do que uma de 5%.'
        feedback: |
          Os 95% são uma boa razão para confiar na previsão, mas Y era esperado por *todas* as teorias, então não consegue separar a A de seus rivais. O que importa é a *diferença* entre o que a A e os rivais esperavam.
      - text: 'Os dois igualmente: cada um simplesmente concorda com a Teoria A.'
        feedback: |
          Concordar com a A não basta, pois Y também concorda com os rivais. A evidência ajuda uma teoria contra rivais apenas na medida em que os rivais *não* a esperavam.
    explanation: |
      O resultado X é o mais forte: um resultado que os rivais achavam improvável e que a Teoria A achava provável as separa. Esta lição transforma esse palpite num argumento curto, testa cada premissa e depois enfrenta duas objeções famosas.

  - type: text
    id: recall
    title: "Lembrete: regra de Bayes e chances"
    body: |
      **Lembrete.** $H$ é uma hipótese (uma teoria) e $E$ a evidência (um resultado observado). $P(H)$ é a **a priori**: quão provável é $H$ antes da evidência. $P(E\mid H)$ é a **verossimilhança**: quão provável é $E$ se $H$ for verdadeira. $P(H\mid E)$ é a **a posteriori**: quão provável é $H$ depois de $E$. A regra de Bayes (Thomas Bayes, 1701-1761, publicada em 1763) é
      $$P(H\mid E)=\frac{P(E\mid H)\,P(H)}{P(E)}$$
      onde $P(E)$ é a probabilidade total da evidência. As **chances** de $H_1$ contra $H_2$ são $P(H_1):P(H_2)$, por exemplo $1:3$ para probabilidades de $25\%$ e $75\%$.

  - type: order
    id: derive
    title: "P1: da regra de Bayes à forma de chances"
    prompt: |
      Duas hipóteses rivais $H_1$ e $H_2$ e uma evidência $E$. Ponha em ordem os passos que transformam a regra de Bayes numa afirmação sobre as chances a posteriori de $H_1$ contra $H_2$.
    steps:
      - 'Escreva a regra de Bayes para $H_1$: $P(H_1\mid E)=P(E\mid H_1)\,P(H_1)/P(E)$.'
      - 'Escreva a regra de Bayes para $H_2$ do mesmo modo, com o mesmo $P(E)$ embaixo.'
      - 'Divida a primeira equação pela segunda, para obter a razão das a posteriori.'
      - 'Cancele $P(E)$, que aparece em cima e embaixo e é o mesmo para as duas hipóteses.'
      - 'Agrupe o que sobrou: a razão das verossimilhanças vezes a razão das prioris.'
    hint: |
      O $P(E)$ total é difícil de conhecer. O truque é um passo que o elimina.
    explanation: |
      Depois de dividir e cancelar:
      $$\frac{P(H_1\mid E)}{P(H_2\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_2)}\cdot\frac{P(H_1)}{P(H_2)}$$
      Leia assim: **chances a posteriori = razão de verossimilhanças × chances a priori**. O fator do meio é a **razão de verossimilhanças**: quantas vezes mais provável $E$ é sob $H_1$ do que sob $H_2$. Esta é a premissa P1 abaixo, e é um teorema, não uma opinião.

  - type: text
    id: argument
    title: "O argumento"
    body: |
      Eis a afirmação, como um argumento com premissas numeradas. Segundo os **bayesianos** (os que tratam graus de crença como probabilidades), é por isso que um resultado que uma teoria previu e que os rivais não esperavam conta a favor da teoria.

      - **P1.** Para hipóteses rivais $H_1$, $H_2$ e evidência $E$: chances a posteriori = razão de verossimilhanças × chances a priori (a identidade que acabamos de derivar).
      - **P2.** Os graus de crença de uma pessoa racional obedecem às regras da probabilidade, então aprender $E$ move a crença da a priori para a a posteriori pela regra de Bayes.
      - **P3.** As teorias fixam as verossimilhanças: $P(E\mid H_1)>P(E\mid H_2)$.
      - **C.** Aprender $E$ eleva as chances de $H_1$ contra $H_2$, exatamente pelo fator $P(E\mid H_1)/P(E\mid H_2)$.

  - type: mcq
    id: critic
    title: "Qual premissa um crítico rejeitaria?"
    prompt: |
      No argumento acima, P1 é a identidade das chances, P2 diz que crenças racionais obedecem às regras da probabilidade e se atualizam pela regra de Bayes, e P3 diz que as teorias dão a $E$ uma verossimilhança maior sob $H_1$ do que sob $H_2$. Qual premissa um filósofo da ciência tem mais probabilidade de rejeitar *por princípio* (em todos os casos, não só neste)?
    options:
      - text: 'P2: por exemplo, porque cientistas reais não sustentam probabilidades numéricas precisas para teorias, ou não mudam de ideia por essa regra.'
        correct: true
      - text: 'P1: a identidade é falsa para algumas teorias.'
        feedback: |
          P1 segue da definição de probabilidade condicional pela álgebra que acabamos de fazer. Ninguém a contesta, desde que as probabilidades estejam definidas.
      - text: 'P3: uma teoria nunca pode dar uma verossimilhança a um resultado.'
        feedback: |
          Às vezes ela falha num caso particular (uma teoria vaga não dá uma verossimilhança clara, ou os rivais discutem o que ela prevê). Mas isso é uma disputa caso a caso, não um princípio contra o argumento inteiro; onde uma teoria prevê um número, P3 pode ser verificada.
    explanation: |
      A matemática (P1) é segura; a filosofia está em P2. **Segundo os bayesianos**, graus de crença devem obedecer à probabilidade, pois de outro modo um apostador poderia fazer você perder aconteça o que acontecer (o argumento do "livro holandês"). **Segundo os críticos** (Popper, muitos frequentistas e seguidores de Kuhn), as teorias não são o tipo de coisa que tem uma probabilidade, ou a ciência real pesa valores e estruturas, não números. Mantenha P2 em mente: a validade do argumento não a resolverá.

  - type: widget
    id: mixer
    widget: belief-mixer
    config:
      causes:
        - { name: "Teoria 1", prior: 0.5, evidence: 0.9 }
        - { name: "Teoria 2", prior: 0.5, evidence: 0.9 }
      sharp: true
      toggle: false
      labels:
        prior: "A priori: quão provável cada teoria parecia antes"
        evidence: "Verossimilhança: quão provável é o resultado se aquela teoria for verdadeira"
        belief: "Crença depois de ver o resultado"
        reset: "Reiniciar"
      presets:
        - { label: "As duas esperavam", prior: [0.5, 0.5], evidence: [0.9, 0.9] }
        - { label: "Só a Teoria 1 previu", prior: [0.5, 0.5], evidence: [0.9, 0.1] }
        - { label: "Teoria 1 um pouco melhor", prior: [0.5, 0.5], evidence: [0.9, 0.6] }
        - { label: "Teoria 2 previu melhor", prior: [0.5, 0.5], evidence: [0.3, 0.7] }
        - { label: "Prioris desiguais", prior: [0.3, 0.7], evidence: [0.8, 0.2] }
    body: |
      Duas teorias rivais. Os controles de cima: quão provável cada uma parecia antes (**a priori**). Os controles do meio: quão provável é o resultado observado se aquela teoria for verdadeira (**verossimilhança**). As barras mostram a parcela de crença de cada teoria depois do resultado: a a priori vezes a verossimilhança, reescalada para somar $100\%$, que é a lei das chances disfarçada.

      Experimente: (1) toque os predefinidos um a um; (2) com prioris iguais, torne as duas verossimilhanças iguais e veja o que as barras fazem; (3) arraste uma verossimilhança para cima e para baixo.

  - type: numeric
    id: mixer-number
    title: "Aplique a lei ao exemplo"
    prompt: |
      Duas teorias, $H_1$ e $H_2$, são as únicas candidatas. Antes, $P(H_1)=0.3$ e $P(H_2)=0.7$. Um resultado $E$ tem verossimilhança $P(E\mid H_1)=0.8$ e $P(E\mid H_2)=0.2$. Depois de ver $E$, qual é $P(H_1\mid E)$ como **porcentagem**? (Dê um número como 12,5.)
    answer: 63.16
    tolerance: 0.2
    answerText: '12/19, cerca de 63,2%'
    wrong:
      - { value: 80, feedback: 'Isso é a verossimilhança $P(E\mid H_1)$, não a a posteriori. A a priori $0.3$ contra $0.7$ precisa entrar na conta.' }
      - { value: 30, feedback: 'Isso é a a priori: ignora a evidência. A razão $0.8:0.2=4:1$ precisa multiplicar as chances a priori.' }
    hint: |
      As chances a priori são $0.3:0.7=3:7$. Multiplique pela razão de verossimilhanças e depois transforme as chances em probabilidade.
    explanation: |
      Chances a priori $3:7$; razão de verossimilhanças $0.8/0.2=4$; chances a posteriori $12:7$. Probabilidade:
      $$P(H_1\mid E)=\frac{12}{12+7}=\frac{12}{19}\approx 63.2\%$$
      A evidência favoreceu $H_1$ quatro vezes, mas sua a priori baixa impediu que ela chegasse a $80\%$.

  - type: widget
    id: grid
    widget: frequency-grid
    config:
      N: 1000
      prior: 0.3
      sens: 0.6
      fpr: 0.6
      sliders:
        sens: { fixed: true }
        fpr: { fixed: true }
      show: { posterior: true }
      reset: false
      labels:
        prior: "A teoria é verdadeira"
        sens: "O resultado ocorre se a teoria for verdadeira"
        fpr: "O resultado ocorre se a teoria for falsa"
        tp: "Verdadeira e com resultado"
        fn: "Verdadeira, sem resultado"
        fp: "Falsa e com resultado"
        tn: "Falsa, sem resultado"
        posterior: "Verdadeira, dado o resultado"
    body: |
      Cada ponto é um mundo imaginário. O resultado ocorre em $60\%$ dos mundos em que a teoria é verdadeira e também em $60\%$ dos mundos em que ela é falsa (esses dois controles estão travados). Arraste o primeiro controle (a parcela de mundos em que a teoria é verdadeira). Olhe os mundos em que o resultado ocorre (verdes e vermelhos) e compare a parcela de verdes com a parcela com que você começou.
    review: false

  - type: mcq
    id: grid-lesson
    title: "Um resultado que todos esperavam"
    prompt: |
      Um resultado $E$ tem a mesma probabilidade quer a teoria $H$ seja verdadeira, quer seja falsa: $P(E\mid H)=P(E\mid\neg H)$ (aqui $\neg H$ significa "$H$ é falsa"). A a priori é $P(H)=30\%$. Qual é $P(H\mid E)$?
    options:
      - text: '$30\%$: a razão de verossimilhanças é $1$, então as chances não mudam.'
        correct: true
      - text: 'Mais de $30\%$: o resultado é compatível com $H$, então deve ajudar $H$ um pouco.'
        feedback: |
          Compatível não é o mesmo que favorável. Como o resultado era igualmente provável se $H$ for falsa, vê-lo não consegue distinguir os dois casos.
      - text: 'Menos de $30\%$: $E$ não é específica de $H$, então conta contra ela.'
        feedback: |
          Um resultado que não é mais provável sob o rival também não conta *contra* $H$. Só uma razão de verossimilhanças abaixo de $1$ faria isso.
    explanation: |
      Razão de verossimilhanças $=1$ dá chances a posteriori iguais às chances a priori. Na grade, a parcela verde dos resultados permaneceu igual à parcela de mundos verdadeiros. Esta é a chave da lição: **a evidência conta pelo quanto separa a teoria de seus rivais**, não pelo quanto se ajusta à teoria sozinha.

  - type: numeric
    id: surprising
    title: "Uma previsão arriscada"
    prompt: |
      Uma teoria $H$ tem a priori $P(H)=10\%$. Ela prevê um resultado $E$: $P(E\mid H)=0.9$. Se $H$ for falsa, tal resultado seria raro: $P(E\mid\neg H)=0.02$ (aqui $\neg H$ significa "$H$ é falsa"). O resultado é observado. Qual é $P(H\mid E)$ como **porcentagem**?
    answer: 83.33
    tolerance: 0.2
    answerText: '5/6, cerca de 83,3%'
    wrong:
      - { value: 90, feedback: 'Isso é a verossimilhança $P(E\mid H)$. Ignora a a priori de $10\%$ e a chance de os rivais produzirem $E$ de qualquer forma.' }
      - { value: 45, feedback: '$45$ é a razão de verossimilhanças $0.9/0.02$, que multiplica as *chances*, não a probabilidade.' }
    hint: |
      Razão de verossimilhanças de $H$ contra "não $H$": $0.9/0.02$. Chances a priori: $10:90$. Multiplique e depois converta.
    explanation: |
      Chances a priori $1:9$; razão de verossimilhanças $0.9/0.02=45$; chances a posteriori $45:9=5:1$. Logo
      $$P(H\mid E)=\frac{5}{5+1}=\frac{5}{6}\approx 83.3\%$$
      Uma previsão que os rivais dificilmente produziriam eleva uma a priori modesta a um patamar bem alto.

  - type: mcq
    id: risky-safe
    title: "Ousada contra segura"
    prompt: |
      A mesma teoria $H$ (a priori $10\%$, $P(E'\mid H)=0.9$) é agora testada por um resultado $E'$ que seria igualmente provável se $H$ fosse falsa: $P(E'\mid\neg H)=0.9$. O resultado é observado como previsto. O que acontece com a crença em $H$, e o que isso diz sobre previsões "ousadas"?
    options:
      - text: 'Ela permanece em $10\%$: uma previsão segura, esperada de qualquer forma, não custa nada à teoria nem lhe rende nada. Só previsões arriscadas podem confirmar.'
        correct: true
      - text: 'Ela sobe para $90\%$: a teoria previu o resultado corretamente.'
        feedback: |
          Acertar a previsão, sozinho, não basta. O resultado era igualmente esperado se $H$ for falsa, então a razão de verossimilhanças é $0.9/0.9=1$.
      - text: 'Ela cai, porque o resultado não é específico de $H$.'
        feedback: |
          Não cai: a razão é $1$, então nada muda. Uma queda exige uma razão abaixo de $1$.
    explanation: |
      Karl Popper (1902-1994) pedia que os cientistas fizessem **conjecturas ousadas**: afirmações que proíbem muito e poderiam falhar com facilidade. Os bayesianos leem o ponto dele pela razão de verossimilhanças: uma previsão ousada tem um $P(E\mid\neg H)$ pequeno, então o sucesso dá uma razão grande. **Duas visões:** os bayesianos consideram isso confirmação que eleva a probabilidade; o próprio Popper rejeitou probabilidades para teorias e falou apenas em *corroboração* (uma teoria que sobrevive a testes severos). Eles concordam no conselho prático e divergem sobre o que significa a sobrevivência.

  - type: text
    id: old-evidence
    title: "Objeção 1: evidência antiga"
    body: |
      Uma objeção famosa (o **problema da evidência antiga**, formulado nesses termos pelo filósofo Clark Glymour, em 1980). Astrônomos sabiam, desde o trabalho de Le Verrier (1859), que a órbita de Mercúrio gira mais do que o cálculo newtoniano permite; o excesso foi depois refinado para cerca de $43$ segundos de arco por século. Em 1915, a relatividade geral de Einstein (uma teoria da gravidade) mostrou-se capaz de dar exatamente esse valor. Muitos cientistas sentiram que isso era um apoio forte.

      Mas leve a regra de Bayes ao pé da letra. O resultado $E$ já era conhecido, então $P(E)=1$, e como $E$ é certo, $P(E\mid H)=1$ também. Então
      $$P(H\mid E)=\frac{1\cdot P(H)}{1}=P(H)$$
      A evidência antiga não produz atualização alguma. **A lei parece negar que evidência antiga apoie uma teoria**, contra o que os cientistas dizem.

  - type: mcq
    id: old-replies
    title: "Duas respostas"
    prompt: |
      Os bayesianos respondem à objeção da evidência antiga de duas maneiras principais. Qual par as descreve corretamente?
    options:
      - text: '(a) **A a priori contrafactual:** perguntar quão provável $E$ teria sido, e qual teria sido a a priori, se ainda *não* conhecêssemos $E$. (b) **Ajuste explicativo:** o que se aprende em 1915 não é $E$, mas que a teoria *implica* $E$, um novo fato lógico.'
        correct: true
      - text: '(a) Negar que $P(E)=1$ para qualquer evidência real. (b) Dizer que os cientistas deveriam simplesmente ignorar a evidência antiga.'
        feedback: |
          Nenhuma das duas é a resposta padrão. Evidência já conhecida pode de fato ter probabilidade $1$ para uma pessoa, e ignorá-la seria rejeitar o julgamento dos cientistas em vez de explicá-lo.
      - text: '(a) Substituir a regra de Bayes pela regra de que uma teoria é confirmada sempre que se ajusta aos dados. (b) Usar frequências, não probabilidades.'
        feedback: |
          Abandonar a regra seria abandonar a estrutura em vez de defendê-la. E "se ajustar aos dados" é exatamente o que a razão de verossimilhanças refina: um ajuste que todos os rivais também fazem não dá apoio algum.
    explanation: |
      **(a)** retira $E$ do conhecimento de fundo e pergunta quão bem $H$ a teria previsto: os $43$ segundos de arco de Mercúrio não eram explicados pelos rivais, então a razão de verossimilhanças é grande. Um crítico responde que o "contrafactual" é vago: não podemos dizer com segurança o que teríamos acreditado. **(b)** desloca a atualização para a descoberta de que $H\Rightarrow E$. Um crítico responde que a probabilidade padrão supõe que já conhecemos todas as consequências lógicas, então isso exige um bayesianismo estendido. As duas respostas são propostas vivas (camada 2); nenhuma é aceita por todos.

  - type: mcq
    id: priors-objection
    title: "Objeção 2: a a priori de quem?"
    multiple: true
    prompt: |
      Um crítico diz: "A lei dá chances *a posteriori* apenas se você fornecer chances a priori, e as prioris são pessoais. Então a conclusão depende de um ponto de partida arbitrário." Quais das opções a seguir são respostas que um bayesiano pode oferecer? (Marque todas as que se aplicam.)
    options:
      - text: 'A razão de verossimilhanças mede a força da evidência separadamente da a priori, então pessoas com prioris diferentes ainda podem concordar sobre quão fortemente $E$ favorece $H_1$.'
        correct: true
      - text: 'Com evidência compartilhada suficiente, prioris moderadas são submersas: as a posteriori de pessoas que começaram distantes se aproximam.'
        correct: true
      - text: 'As prioris podem ser escolhidas depois dos dados, de modo que a teoria preferida acabe provável.'
        feedback: |
          Isso derrotaria o propósito. Uma a priori fixada *depois* de ver a resposta é apenas a resposta reescrita; os bayesianos exigem que a a priori seja definida antes da evidência (ou pelo raciocínio contrafactual da objeção anterior).
    explanation: |
      A primeira resposta faz da lei uma medida da força evidencial; a segunda diz que a discordância se desfaz com os dados. Os críticos respondem que as pessoas podem *discordar também sobre as verossimilhanças* (o que a teoria prevê), e que uma a priori de exatamente $0$ ou $1$ nunca se move. **Segundo os bayesianos subjetivistas**, qualquer a priori coerente é permitida; **segundo os bayesianos objetivistas**, regras como a indiferença a restringem. Isso é um debate em aberto.

  - type: numeric
    id: swamping
    title: "Quanta evidência basta?"
    prompt: |
      Uma teoria começa com $P(H)=1\%$. Cada resultado independente tem razão de verossimilhanças $3$ a seu favor (três vezes mais provável se $H$ for verdadeira do que se for falsa). Depois de quantos desses resultados $P(H\mid\text{all})$ ultrapassa pela primeira vez $90\%$? (Dê um número inteiro.)
    answer: 7
    tolerance: 0.01
    wrong:
      - { value: 6, feedback: 'Depois de seis resultados as chances são $729:99\approx 7.4$, uma probabilidade de cerca de $88\%$, logo abaixo de $90\%$.' }
      - { value: 3, feedback: 'Três resultados multiplicam as chances por $27$, de $1:99$ para $27:99$, só cerca de $21\%$. Cada resultado multiplica as *chances* por $3$, não a probabilidade.' }
    hint: |
      Chances a priori $1:99$. Uma probabilidade acima de $90\%$ significa chances acima de $9:1$. Cada resultado multiplica as chances por $3$.
    explanation: |
      Depois de $n$ resultados as chances são $3^n/99$. É preciso $3^n/99>9$, logo $3^n>891$:
      $$3^6=729<891<2187=3^7$$
      Depois de 7 resultados: chances $2187/99\approx22.1$, uma probabilidade de cerca de $95.7\%$. Um cético que começa em $1\%$ acaba convencido se os resultados continuarem chegando e forem independentes. Ressalvas: uma a priori de exatamente $0$ nunca subiria (qualquer produto com $0$ é $0$), e os resultados raramente são totalmente independentes.

  - type: mcq
    id: validity
    title: "Válido não é verdadeiro"
    prompt: |
      Suponha que o argumento (P1, P2, P3, logo C) seja **válido**: se todas as premissas forem verdadeiras, C deve ser verdadeira. Um crítico acredita que P2 é falsa. O que se segue?
    options:
      - text: 'Nada sobre C se segue só da validade: C é garantida apenas se toda premissa for verdadeira, e C ainda pode ser verdadeira por outras razões.'
        correct: true
      - text: 'C é falsa, porque uma premissa é falsa.'
        feedback: |
          Uma premissa falsa não torna a conclusão falsa: a partir de uma premissa falsa, um argumento válido deixa C indecisa, e C pode ser verdadeira por outras razões.
      - text: 'O argumento não era válido, afinal.'
        feedback: |
          A validade diz respeito à *forma*: se a conclusão segue caso as premissas valham. Ela é separada de as premissas serem verdadeiras. Os críticos de P2 aceitam a validade e contestam a verdade.
    explanation: |
      O curso mantém essas coisas separadas. O argumento é válido; P1 é um teorema; P3 é verificada caso a caso. A disputa está em P2. Um crítico de P2 ainda pode aceitar o ponto prático mais fraco de que um resultado esperado pelos rivais não apoia uma teoria contra eles.

  - type: mcq
    id: layers
    title: "Três camadas"
    prompt: |
      Qual atribuição de camadas às afirmações está correta?
    options:
      - text: 'A identidade das chances: estabelecida (um teorema). Se a confiança dos cientistas reais a segue: debate em aberto. A a priori de uma visão de mundo inteira: debate em aberto e compromisso.'
        correct: true
      - text: 'A identidade das chances: debate em aberto. Se os cientistas reais a seguem: estabelecido. A a priori de uma visão de mundo: estabelecida.'
        feedback: |
          Invertido. A identidade é provada pela álgebra; como as pessoas de fato raciocinam, e como fixar prioris para afirmações grandiosas, são exatamente o que pessoas atentas discutem.
      - text: 'As três são estabelecidas: a probabilidade é matemática.'
        feedback: |
          A matemática é estabelecida só no que diz respeito à identidade. Que mentes ou a ciência *devam* segui-la (P2), e que número dar a uma visão de mundo, são afirmações filosóficas, não matemáticas.
    explanation: |
      Manter as camadas separadas é o hábito do curso: a matemática é segura, seu uso como modelo da ciência e da crença é debatido, e a a priori de uma afirmação grandiosa se apoia em compromissos que a evidência sozinha não consegue fornecer.

  - type: text
    id: summary
    body: |
      **Próximo:** "Quando os dados não decidem". Se a mesma evidência se ajusta igualmente bem a muitas teorias (todas as verossimilhanças são iguais), a lei não consegue separá-las. Duhem e Quine perguntam o que mais, como a simplicidade ou a fecundidade, pode então escolher uma teoria.
