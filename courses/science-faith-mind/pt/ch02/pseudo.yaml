source_hash: 06b5eef81b3f
id: ch02-pseudo
title: "Ciência, pseudociência e afirmações marginais"
kind: concept
own: |
  - **O problema da demarcação** é a pergunta sobre o que, se é que algo, separa a ciência da pseudociência (um campo que toma emprestada a aparência da ciência sem seus controles). Segundo Karl Popper (1902-1994), a linha é {{ a falsificabilidade: uma afirmação deve proibir alguma observação possível }}. Segundo Thomas Kuhn (1922-1996), uma ciência madura se organiza em torno da resolução de quebra-cabeças dentro de um paradigma compartilhado. Segundo Imre Lakatos (1922-1974), a unidade a ser julgada é um *programa de pesquisa*, que é *progressivo* quando prevê fatos novos e *degenerativo* quando apenas se remenda depois de falhas.
  - **Marcas da pseudociência** (um conjunto, não uma lista de verificação), segundo Popper e Lakatos: afirmações que {{ nenhuma observação possível poderia refutar }}; resgates *ad hoc*, isto é, remendos que apenas salvam a afirmação e não preveem nada novo; ausência de progresso por longos períodos; e ausência de verificação independente (cegamento, replicação, crítica aberta).
  - **Testes justos de afirmações estranhas.** A astrologia é testável e foi testada: num teste de correspondência duplo-cego publicado em 1985 (Shawn Carlson, *Nature*), 28 astrólogos associaram mapas natais a perfis de personalidade tão bem quanto o acaso (cerca de um em cada três acertos) (os astrólogos tinham concordado antecipadamente que o teste era justo). A diluição "30C" da homeopatia significa 30 passos de 1 parte em 100, então o fator é
  $$100^{30} = 10^{60}$$
  e, com cerca de $6\times10^{23}$ moléculas num mol, {{ o número esperado de moléculas originais restantes é cerca de $6\times10^{-37}$, essencialmente nenhuma }}. Os homeopatas respondem com a ideia de uma "memória da água", que é uma afirmação para a qual a química não tem mecanismo; os ensaios clínicos são o juiz justo.
  - **Evidência fraca mal move uma a priori baixa.** Na forma de chances, com probabilidade a priori $P(H)=1\%$ e razão de verossimilhanças $\mathrm{LR}=P(E\mid H)/P(E\mid \neg H)$:
  $$\text{posterior odds} = \mathrm{LR}\times\text{prior odds}$$
  {{ com uma LR de $1.1$, a a posteriori fica em cerca de $1.1\%$ }}, e com uma LR de $3$, cerca de $2.9\%$. Daí o valor de testes fortes e cegados, que dão uma LR grande.
  - **A linha é nebulosa.** Duas visões: um critério nítido (Popper) contra um *conjunto de marcas de semelhança de família* (Larry Laudan, 1983, argumentou que nenhum critério único funciona). Casos difíceis: a deriva continental no início (Alfred Wegener, 1912; rejeitada, e depois aceita nos anos 1960 com a tectônica de placas), a teoria das cordas (debatida: matematicamente rica, poucas previsões testáveis até agora, segundo os críticos), a psicanálise. {{ Uma ideia rejeitada ou não comprovada não é automaticamente pseudociência }}; o que importa é como o campo responde aos testes e aos fracassos.
  - **Camadas.** Que o teste de correspondência da astrologia deu resultados de acaso e que 30C não deixa moléculas são fatos estabelecidos; como traçar a linha da ciência e como classificar a teoria das cordas são debates em aberto; se uma visão de mundo merece respeito além de suas afirmações testáveis é um compromisso.
cards:
  - type: mcq
    id: hook
    title: "Três afirmações, um rótulo?"
    prompt: |
      Três afirmações:

      **A.** A sua data de nascimento e a posição dos planetas naquele momento moldam a sua personalidade e a sua vida (astrologia).

      **B.** Um remédio diluído até quase não restar substância ativa cura doenças, e quanto mais diluído, mais forte (homeopatia).

      **C.** Existe uma partícula pesada demais para ser produzida em qualquer máquina que possamos construir, e ela explica a matéria escura (uma ideia especulativa da física).

      Antes de qualquer teoria: chute. Qual é o melhor primeiro passo para decidir quais merecem ser chamadas de ciência?
    options:
      - text: 'Escolher pelo assunto: afirmações de física são ciência, as outras não.'
        feedback: |
          Tentador, mas uma ideia de física pode ser não testável, e uma afirmação "alternativa" pode ser testada. A afirmação C pode ser difícil de testar; as afirmações A e B foram testadas e fracassaram. O assunto não decide.
      - text: 'Escolher pelo quanto a afirmação soa maluca.'
        feedback: |
          Afirmações estranhas já estiveram certas (a deriva continental soava absurda em 1912). A estranheza é um mau guia; as verificações são um guia melhor.
      - text: 'Perguntar o que cada afirmação proíbe, como foi testada, e o que seus seguidores fazem quando um teste falha.'
        correct: true
    explanation: |
      Se um campo é científico é julgado pelos seus **hábitos de verificação**, e não pelo assunto nem por quão estranho soa. Esta lição dá as melhores ferramentas para fazer isso com justiça, inclusive com afirmações que muitos de nós achamos esquisitas. Pseudociência, aqui, significa um campo que toma emprestada a aparência da ciência (jargão, gráficos, jalecos) sem seus controles.

  - type: text
    id: demarcation
    title: "O problema da demarcação"
    body: |
      **Demarcação** significa traçar uma fronteira: o que separa a ciência do não científico e da pseudociência? Três respostas, relembradas:

      - **Falsificabilidade** (Karl Popper, 1902-1994): uma afirmação é científica se *proíbe* alguma observação possível, de modo que um resultado poderia refutá-la. "Amanhã vai chover ou não vai chover" não proíbe nada.
      - **Resolução de quebra-cabeças** (Thomas Kuhn, 1922-1996): uma ciência madura trabalha dentro de um *paradigma* compartilhado (um modelo de como são os problemas e as respostas) e resolve quebra-cabeças; a astrologia, disse ele, não tinha uma tradição de resolução de quebra-cabeças, já que seus fracassos eram atribuídos ao astrólogo.
      - **Programas de pesquisa** (Imre Lakatos, 1922-1974): julgue um programa inteiro ao longo do tempo. Ele é **progressivo** se prevê fatos novos que depois se confirmam, **degenerativo** se apenas acrescenta remendos depois de cada falha.

      Repare que os três se sobrepõem, mas não são o mesmo teste. Vamos usá-los como uma caixa de ferramentas.

  - type: text
    id: marks
    title: "Quatro marcas, segundo Popper e Lakatos"
    body: |
      Juntando as ideias deles, obtêm-se quatro **marcas** frequentemente encontradas na pseudociência. São sinais, não uma lista de verificação: uma ciência real pode apresentar uma delas por pouco tempo, e as marcas importam como um *conjunto* que persiste.

      1. **Não falsificável**: nenhuma observação possível contaria contra a afirmação.
      2. **Resgate *ad hoc*** (latim: "para esta finalidade"): depois de uma falha, acrescenta-se um remendo que salva a afirmação mas não prevê nada novo.
      3. **Ausência de progresso**: as mesmas afirmações por décadas ou séculos, sem previsões novas e testadas.
      4. **Ausência de verificação independente**: sem cegamento, sem replicação por céticos, com a crítica mantida afastada.

      Seguem quatro casos curtos, um para cada marca.

  - type: mcq
    id: mark-unfalsifiable
    title: "Marca 1"
    prompt: |
      Um horóscopo diz: "Você vai enfrentar um desafio hoje, e a forma como responder revelará o seu caráter." Aconteça o que acontecer naquele dia, o leitor pode dizer que combina. Qual marca da pseudociência isto é, segundo Popper?
    options:
      - text: 'Não falsificável: não proíbe nada, então nenhum dia poderia refutá-lo.'
        correct: true
      - text: 'Ausência de progresso: não mudou em um século.'
        feedback: |
          Essa é outra marca (pode valer também para horóscopos), mas o problema desta carta é que nenhum resultado fica excluído, e não que a afirmação seja antiga.
      - text: 'Resgate ad hoc: foi remendado depois de uma falha.'
        feedback: |
          Não houve falha para remendar: a frase é construída de modo que nenhuma falha seja possível. O resgate ad hoc exige uma afirmação que antes dissesse algo definido.
    explanation: |
      O ponto de Popper é que uma afirmação que se ajusta a todo desfecho não diz nada sobre o mundo. Uma observação justa: os astrólogos também fazem afirmações *específicas* (por exemplo, que um mapa corresponde a uma personalidade), e essas podem ser testadas, como mostram as cartas seguintes. O horóscopo vago é a face não falsificável da prática; a afirmação de correspondência é a sua face testável.

  - type: mcq
    id: mark-adhoc
    title: "Marca 2"
    prompt: |
      Dois resgates de uma teoria depois de uma previsão falha. (i) Nos anos 1840, astrônomos viram Urano sair de sua trajetória prevista e propuseram um planeta não visto; ele indicava onde procurar, e Netuno foi encontrado em 1846. (ii) O tratamento de um curandeiro falha num ensaio, e diz-se que ele precisa da "energia certa, que não pode ser medida". Qual descreve o resgate *ad hoc*?
    options:
      - text: 'Só o (i): acrescentou um planeta não visto para salvar a teoria.'
        feedback: |
          Acrescentar algo não visto não é o problema. O resgate (i) produziu uma previsão nova e arriscada (olhe *ali*) e foi confirmado. É um remendo progressivo.
      - text: 'Só o (ii): o remendo salva a afirmação e não prevê nada que possa ser verificado.'
        correct: true
      - text: 'Os dois: qualquer resgate depois de uma falha é ad hoc.'
        feedback: |
          Se fosse assim, quase toda teoria real seria pseudocientífica, pois toda ciência remenda suas teorias. O teste é se o remendo faz uma *previsão nova e testável*.
    explanation: |
      A distinção de Lakatos: um resgate é aceitável quando traz **conteúdo empírico excedente** (diz algo novo que poderia falhar). Uma observação justa: Le Verrier tentou a mesma jogada para Mercúrio (um planeta não visto, "Vulcano"), e ela fracassou; a jogada era legítima, só que o mundo discordou.

  - type: mcq
    id: mark-progress
    title: "Marca 3"
    prompt: |
      Compare dois campos nos últimos dois séculos. O campo X mantém as mesmas afirmações centrais e não acrescentou nenhuma previsão nova confirmada. O campo Y começou com poucas afirmações e, passo a passo, previu fatos novos (novas partículas, novas camadas de rocha, novos efeitos de remédios) que depois foram encontrados. Segundo Lakatos, qual é *degenerativo*?
    options:
      - text: 'O campo Y: ele continua mudando as suas afirmações.'
        feedback: |
          Mudar não é degenerar. O Y muda *prevendo fatos novos que se confirmaram*, que é a marca de um programa progressivo.
      - text: 'O campo X: nenhuma previsão nova confirmada por muito tempo, apenas a defesa das afirmações antigas.'
        correct: true
      - text: 'Nenhum: só um único teste falho pode distinguir progresso de declínio.'
        feedback: |
          Lakatos insistia que testes isolados raramente decidem; quem decide é a história de um programa. Também por isso o julgamento leva tempo.
    explanation: |
      Uma advertência: "ausência de progresso" deve ser julgada num intervalo longo e levando em conta os recursos e as ferramentas do próprio campo. Um campo jovem ou pequeno pode ser lento sem ser pseudocientífico.

  - type: mcq
    id: mark-peers
    title: "Marca 4"
    prompt: |
      Um grupo testa seu remédio com pacientes que sabem o que recebem, sem grupo de controle, e publica apenas no seu próprio periódico, que não aceita revisores céticos. Um cético pede para repetir o teste às cegas e é recusado. Qual marca é a mais clara?
    options:
      - text: 'Ausência de verificação independente: as checagens que poderiam expor o erro são evitadas.'
        correct: true
      - text: 'Não falsificável: é impossível testar remédios.'
        feedback: |
          Remédios podem ser testados muito bem (é isso que os ensaios clínicos fazem). O problema é que essas pessoas evitam o teste, e não que testar seja impossível.
      - text: 'É uma visão minoritária, e isso por si só a torna pseudociência.'
        feedback: |
          Ser minoritária não é uma marca. Muitas ideias corretas começaram como visões minoritárias. A marca é *evitar* as verificações, como o cegamento e a replicação.
    explanation: |
      A ciência é um processo social: erros são encontrados porque outros tentam quebrar o seu resultado. Um campo que se organiza para não ser quebrado perde o que torna seus resultados confiáveis, mesmo que seus membros sejam sinceros.

  - type: text
    id: astrology
    title: "Astrologia: testável, e testada"
    body: |
      Um tratamento justo começa pelo que os astrólogos afirmam: que o mapa natal de uma pessoa (as posições do Sol, da Lua e dos planetas no nascimento) se correlaciona com o seu caráter e a sua vida. Isso é uma **afirmação testável**, então a astrologia não é não falsificável *em princípio*.

      Um teste bem conhecido: Shawn Carlson, na *Nature* em 1985, desenhou um **teste de correspondência duplo-cego** (nem os participantes nem os experimentadores que manuseiam os dados sabem qual é qual). Ele foi desenhado junto com astrólogos indicados pelo National Council for Geocosmic Research, que concordaram antecipadamente que o teste era justo. No teste principal, 28 astrólogos receberam, cada um, um mapa e tiveram de escolher o perfil de personalidade correspondente (de um questionário padrão) entre três (os perfis vinham do California Psychological Inventory). Acertaram **um em cada três**, o que é o acaso. Carlson concluiu que o resultado refuta claramente a hipótese astrológica tal como testada.

      Segundo astrólogos que discordam, o teste não captou como a astrologia é de fato usada (com o consulente presente, lendo o mapa inteiro). Um cético responde que isso é uma nova afirmação, que deveria ser testada por sua vez, e que os astrólogos tinham aprovado o desenho do teste.

  - type: mcq
    id: astrology-q
    title: "O que este teste mostra?"
    prompt: |
      Num teste justo e duplo-cego, astrólogos associaram mapas natais a perfis de personalidade na taxa esperada pelo acaso (cerca de um em cada três). Qual conclusão é a mais bem sustentada?
    options:
      - text: 'Ficou demonstrado que a astrologia é falsa, para sempre, em todas as formas.'
        feedback: |
          Forte demais: um teste verifica uma forma da afirmação. Os defensores podem propor outras formas, que então deveriam ser testadas; é assim que uma afirmação continua sendo justa para discussão.
      - text: 'A astrologia não é falsificável, então nenhum teste poderia mostrar nada.'
        feedback: |
          O oposto: esta afirmação foi testada, e o resultado poderia ter lhe sido favorável. O fato de o teste poder falhar é o que o torna um teste.
      - text: 'A afirmação testada (que essas correspondências entre mapa e personalidade podem ser feitas acima do acaso) fracassou; para manter a astrologia, seus defensores precisam dizer o que mais ela prevê e aceitar um teste disso.'
        correct: true
    explanation: |
      Repare na estrutura: afirmação testável, teste justo, fracasso. O que transforma uma afirmação fracassada em pseudociência é a *resposta*: se o campo redefine a afirmação a cada vez (resgate ad hoc) e evita novos testes, as marcas se acumulam. O mesmo teste é justo para um crente: foi acordado antecipadamente.

  - type: text
    id: homeopathy
    title: "Homeopatia: a aritmética da diluição"
    body: |
      Samuel Hahnemann (1755-1843) fundou a homeopatia sobre "o semelhante cura o semelhante" e sobre a diluição: uma substância é diluída e agitada (*succussão*) em passos, com a crença de que isso *fortalece* o remédio. Na **escala C**, cada passo é **1 parte em 100**: um remédio "30C" foi diluído 30 vezes, cada vez por um fator de 100.

      Em símbolos, 30C é um fator de diluição de $100^{30}$. E o **número de Avogadro**, cerca de $6\times10^{23}$, é o número de moléculas em um *mol* (uma quantidade fixa e grande de uma substância, por exemplo 18 gramas de água).

  - type: numeric
    id: homeopathy-n
    title: "Fator de diluição"
    prompt: |
      Um remédio homeopático "30C" é feito diluindo 30 vezes, cada passo 1 parte em 100. O fator total de diluição é $100^{30} = 10^{n}$. Qual é $n$?
    answer: 60
    hint: |
      $100 = 10^2$, então $100^{30} = (10^2)^{30}$.
    explanation: |
      $100^{30} = (10^{2})^{30} = 10^{60}$. Parta de um mol inteiro da substância ativa, $6\times10^{23}$ moléculas. Depois da diluição, o número esperado de moléculas originais é
      $$6\times10^{23}\times10^{-60} \approx 6\times10^{-37}$$
      muito menos que uma. (Já em 12C, com fator $10^{24}$, as moléculas de um mol se esgotam.)

  - type: mcq
    id: homeopathy-q
    title: "O que os números implicam?"
    prompt: |
      Partindo de um mol da substância ativa (cerca de $6\times10^{23}$ moléculas), um remédio 30C tem $6\times10^{-37}$ moléculas originais esperadas em toda a preparação. Os homeopatas respondem que o remédio age por uma "memória" da água. Qual resposta é justa com os dois lados?
    options:
      - text: 'Os números provam que os homeopatas estão mentindo.'
        feedback: |
          Praticantes sinceros podem acreditar na ideia da memória; a aritmética mostra apenas que não resta nenhuma dose *química*. Acusar de mentira é injusto e também não vem ao caso.
      - text: 'A aritmética é estabelecida; a "memória da água" é outra afirmação, sem mecanismo conhecido na química, e o juiz justo sobre se os remédios funcionam é um ensaio cego (revisões de ensaios, como uma da NHMRC australiana em 2015, não encontraram evidência confiável de eficácia, embora críticos contestem os critérios usados na revisão).'
        correct: true
      - text: 'A diluição não pode importar, porque muitos medicamentos são eficazes em doses minúsculas.'
        feedback: |
          Alguns são potentes em doses minúsculas, mas uma dose de *zero moléculas* é outro caso: a potência por molécula não compensa a ausência total de moléculas.
    explanation: |
      Camada 1 (fato): a aritmética da diluição. Camada 2 (a literatura científica se firmou em não haver efeito além do placebo, embora o debate público continue): se algum efeito existe. A ideia da "memória" é uma afirmação separada e testável, então também pode ser testada. A justiça exige tratá-la como uma hipótese real com um teste real, e aceitar o resultado do teste.

  - type: order
    id: fair-test
    title: "Passos de um teste justo"
    prompt: |
      Ponha em uma ordem razoável os passos de um teste justo de um remédio.
    steps:
      - 'Declare antecipadamente que resultado contaria como sucesso e como ele será medido (pré-registro).'
      - 'Divida os participantes ao acaso em um grupo tratado e um grupo de controle.'
      - 'Cegue-os: nem os participantes nem os que julgam os desfechos sabem quem recebeu o quê.'
      - 'Colete os desfechos e então compare os grupos com a medida definida antes.'
      - 'Publique o resultado, seja ele qual for, para que outros possam repeti-lo.'
    hint: |
      Decida a regra antes de ver os dados; depois sorteie, depois esconda, depois meça, e por fim compartilhe.
    explanation: |
      Cada passo bloqueia um erro conhecido: escolher o critério de sucesso depois de ver os dados (encontrar padrões por acaso), grupos desiguais, expectativas colorindo os resultados (cegamento) e esconder desfechos negativos. São exatamente a marca da "verificação independente" ao contrário.

  - type: numeric
    id: bayes-prior
    title: "Evidência fraca, a priori baixa"
    prompt: |
      Uma afirmação $H$ começa com probabilidade a priori de $1\%$. Um indício de apoio é apenas 3 vezes mais provável se $H$ for verdadeira do que se for falsa (razão de verossimilhanças 3). Qual é a probabilidade a posteriori de $H$, em porcentagem? (Use chances: chances a posteriori = LR vezes chances a priori.)
    answer: 2.9
    tolerance: 0.1
    answerText: '2.9'
    hint: |
      Chances a priori $1:99$, vezes 3 dá $3:99$; depois a probabilidade $=3/(3+99)$.
    explanation: |
      As chances a priori são $1/99$. Vezes 3 dá $3/99$, então a probabilidade é $3/102 \approx 2.9\%$. Com uma razão de verossimilhanças de apenas $1.1$ (um anedotário fraco), seria cerca de $1.1\%$; com $10$, cerca de $9.2\%$. **Moral**: para uma afirmação que conflita com muito conhecimento bem testado, uma a priori baixa é razoável, e evidências fracas (um depoimento, um caso isolado) mal a alteram; testes fortes e cegados, que têm uma razão de verossimilhanças grande, é o que a movem.

  - type: mcq
    id: two-views
    title: "Linha nítida ou semelhança de família?"
    prompt: |
      Uma visão: existe um critério nítido (falsificabilidade) que separa limpamente a ciência da pseudociência. Outra: não há um critério único, apenas um *conjunto* de marcas, como as características que tornam parecidos os jogos (uma "semelhança de família"). Qual raciocínio sustenta a segunda visão?
    options:
      - text: 'A física e a sociologia são o mesmo tipo de ciência.'
        feedback: |
          Nenhuma das visões afirma isso. A visão do conjunto trata da *fronteira* com a pseudociência, não de igualar as ciências.
      - text: 'Cada critério único proposto falha num caso claro: a falsificabilidade parece excluir boa ciência (as teorias precisam de hipóteses auxiliares, então nenhum resultado isolado as refuta) e admitir algumas afirmações ruins (uma afirmação falsa e plenamente testável).'
        correct: true
      - text: 'Os cientistas não conseguem concordar em nada, então não há marcas.'
        feedback: |
          Os cientistas concordam em muita coisa. A visão do conjunto afirma que as marcas existem e são úteis, apenas que nenhuma delas, sozinha, é necessária e suficiente.
    explanation: |
      Segundo Larry Laudan (1983), o problema da demarcação deveria ser abandonado: separar boas de más *afirmações* pela evidência que as sustenta, em vez de classificar rótulos. Segundo os defensores de Popper, um critério refinado ainda pode servir. O resultado prático é compartilhado: julgue pelo conjunto de marcas e pela evidência.

  - type: mcq
    id: blurry
    title: "Casos nebulosos"
    prompt: |
      Em 1912, Alfred Wegener propôs que os continentes se movem (deriva continental). Foi amplamente rejeitada (sobretudo na América do Norte), porque nenhum bom mecanismo era conhecido, e foi aceita nos anos 1960 com a tectônica de placas. O que isso ensina sobre rejeição e pseudociência?
    options:
      - text: 'Uma ideia rejeitada é pseudociência, e Wegener errou em 1912 ao propô-la.'
        feedback: |
          A ideia de Wegener era testável (encaixar rochas e fósseis através dos oceanos) e fazia previsões; foi rejeitada por falta de mecanismo, não por evitar testes.
      - text: 'Uma ideia rejeitada não é automaticamente pseudociência: ela pode ser testável e justa, e ser aceita quando surgirem a evidência e um mecanismo.'
        correct: true
      - text: 'Ideias rejeitadas costumam ser aceitas depois, então deveríamos aceitar todas elas.'
        feedback: |
          Quase todas as ideias rejeitadas continuam rejeitadas. Wegener é uma exceção memorável, não a regra.
    explanation: |
      Dois outros casos difíceis, cada um com duas visões. **Teoria das cordas**: os críticos dizem que ela não fez nenhuma previsão confirmada em décadas (um possível programa degenerativo); os defensores dizem que ela é matematicamente fecunda e que o teste pode demorar mais. **Psicanálise**: Popper sustentava que suas explicações se encaixam em qualquer comportamento; outros argumentam que ela faz afirmações testáveis, algumas das quais fracassaram. Como classificá-las é um debate em aberto, não um fato assentado.

  - type: mcq
    id: traps
    title: "Três erros"
    prompt: |
      Selecione toda afirmação que é um **erro**.
    multiple: true
    options:
      - text: '"Não comprovado significa pseudociência."'
        correct: true
        feedback: |
          A ciência de fronteira não é comprovada por definição. A diferença está em saber se a afirmação pode ser testada e como o campo reage.
      - text: '"Se a corrente principal a sustenta, então é verdadeira."'
        correct: true
        feedback: |
          As visões dominantes são as mais bem testadas que temos, e também já estiveram erradas (o calórico, o éter). O consenso é uma forte evidência, não uma prova.
      - text: '"As pessoas que acreditam em afirmações marginais são tolas."'
        correct: true
        feedback: |
          Muitas são inteligentes e sinceras, muitas vezes atraídas por experiências reais ou pela desconfiança nas instituições. Critique as afirmações, não as pessoas.
      - text: '"Uma afirmação pode fracassar num teste justo sem que seus defensores sejam pseudocientistas."'
        feedback: |
          Isto está correto, não é um erro: afirmações individuais fracassadas são normais na ciência. As marcas dizem respeito a como um campo responde ao longo do tempo.
    explanation: |
      Cada armadilha confunde uma *propriedade de uma afirmação ou de uma pessoa* com os *hábitos de um campo*. Um bom julgamento olha para a evidência e para o modo como as verificações são cumpridas, e se mantém respeitoso.

  - type: mcq
    id: layers
    title: "Fato, debate ou compromisso?"
    prompt: |
      Qual afirmação é uma afirmação de camada 2 (consenso acadêmico ou debate em aberto), e não fato estabelecido nem compromisso de fé ou metafísico?
    options:
      - text: 'Uma diluição 30C tem fator $10^{60}$.'
        feedback: |
          Isso é aritmética: camada 1, fato estabelecido.
      - text: 'A teoria das cordas é (ou não é) um programa de pesquisa degenerativo.'
        correct: true
      - text: 'Tudo o que não pode ser medido não existe.'
        feedback: |
          Isto é uma postura filosófica (de tipo positivista), e não um resultado dos dados: camada 3, um compromisso. O próprio Popper a rejeitou, pois separava a ciência do sentido.
    explanation: |
      Manter as camadas separadas é o hábito que a lição treina: a aritmética e o teste dos astrólogos são camada 1; se a teoria das cordas está progredindo é camada 2; o que fazer das experiências que a ciência não consegue testar é camada 3.

  - type: text
    id: summary
    body: |
      **De volta ao ponto de partida.** A astrologia e a homeopatia fazem afirmações testáveis que foram testadas e fracassaram; a partícula especulativa não é comprovada e pode ou não ser testável. Nenhuma é julgada pelo assunto ou pela estranheza, mas pelo que proíbe, como foi testada e como o seu campo reage.

      **Próximo:** a lição *O que a ciência pode e não pode dizer* pergunta quais perguntas a ciência consegue responder, e o que fica além do seu alcance.
