source_hash: cb0c3b570b02
id: ch02-intuition
title: Recordação Rápida
kind: intuition

cards:
  - type: text
    id: welcome
    title: "Recordação rápida: como a ciência aprende, testa e pesa"
    body: |
      Esta rodada **não deriva nada**. Serve para recordar rapidamente as ideias principais do nível: as respostas a Hume, a lógica do teste, a regra de Bayes, as imagens do que são as teorias e os limites do método.

      Quatro tipos de carta: **mnemônicos** (a forma de uma ideia), **cartas de montagem** (monte uma fórmula), **verificações** (a fórmula se comporta de modo sensato nos extremos?) e **distinções** (quem diz o quê). Depois, casos aplicados pequenos dão apenas dados: escolha você mesmo a ferramenta certa.

      Como sempre, as respostas são dadas *segundo* um pensador ou uma regra. Nada aqui pergunta se alguma religião é verdadeira.

  - type: mcq
    id: four-replies
    title: "Quatro respostas a Hume"
    prompt: |
      Hume (1711-1776) argumentou que a indução (raciocinar a partir de casos vistos para casos não vistos) não pode ser justificada sem circularidade. Qual par de resposta e ideia central está correto?
    options:
      - text: Contornar (Popper) significa que a ciência nunca precisa da indução, apenas de conjecturas ousadas testadas por dedução; justificar (Reichenbach) significa que, se algum método funciona, a indução funciona, então é a melhor aposta.
        correct: true
      - text: Contornar (Reichenbach) significa que a ciência nunca precisa da indução; justificar (Popper) significa que a indução se prova correta por seu sucesso passado.
        feedback: |
          Os nomes estão trocados, e "provada pelo sucesso passado" é exatamente o círculo que Hume apontou. Popper (1902-1994) é quem contorna; Reichenbach (1891-1953) oferece a justificação pragmática.
      - text: Reformular significa que a indução dá certeza depois de casos suficientes; explicar à parte significa que o problema é real e insolúvel.
        feedback: |
          Reformular significa abrir mão da certeza e pedir apenas probabilidades (estilo bayesiano); explicar à parte significa descrever, como psicologia, por que formamos esses hábitos. Nenhuma promete certeza.
      - text: Todas as quatro respostas concordam que a indução é logicamente válida, e diferem apenas nos exemplos usados.
        feedback: |
          Elas aceitam que a indução não é dedutivamente válida. Diferem sobre o que fazer a respeito: deixá-la de lado, defendê-la pragmaticamente, enfraquecer o objetivo ou explicar o hábito.
    explanation: |
      Mnemônico: **C-J-R-E**: *contornar* (Popper), *justificar* (Reichenbach), *reformular* (probabilidade em vez de certeza), *explicar à parte* (um fato sobre as mentes humanas). Cada uma tem sua melhor objeção; nenhuma dá certeza.

  - type: mcq
    id: tollens
    title: "Qual direção é válida?"
    prompt: |
      Uma teoria $T$ prevê uma observação $O$, então $T \Rightarrow O$. Qual inferência é válida?
    options:
      - text: "$T \\Rightarrow O$ e não-$O$, logo não-$T$ (modus tollens)."
        correct: true
      - text: "$T \\Rightarrow O$ e $O$, logo $T$ (afirmação do consequente)."
        feedback: |
          Outras teorias podem prever o mesmo $O$, então ver $O$ não pode provar $T$. Pode elevar a probabilidade dela, o que é uma afirmação diferente e mais fraca.
      - text: "$T \\Rightarrow O$ e não-$T$, logo não-$O$ (negação do antecedente)."
        feedback: |
          $O$ pode ser verdadeiro por outras razões mesmo que $T$ seja falsa.
      - text: Os dois primeiros são válidos.
        feedback: |
          Só o primeiro. Mnemônico: uma previsão falha pode refutar; uma bem-sucedida não pode provar.
    explanation: |
      A refutação é dedutiva; a confirmação não é. Testes reais acrescentam hipóteses auxiliares, que é a próxima carta.

  - type: order
    id: duhem-chain
    title: "A cadeia de Duhem"
    prompt: |
      Ponha em ordem o raciocínio quando uma previsão falha, segundo Duhem (1861-1916). Aqui $T$ é uma teoria, $A$ as hipóteses auxiliares (os instrumentos funcionam, nada mais interfere) e $O$ a observação prevista.
    steps:
      - "Juntas, $T$ e $A$ implicam $O$: $(T \\wedge A) \\Rightarrow O$."
      - "O experimento mostra não-$O$."
      - "Pelo modus tollens, a conjunção $T \\wedge A$ é falsa."
      - "Logo, pelo menos um de $T$ ou $A$ é falso; a lógica sozinha não diz qual."
    hint: Primeiro a previsão, depois o resultado, depois o que o modus tollens atinge, e por fim o que fica em aberto.
    explanation: |
      A inferência válida recai sobre o conjunto. Culpar $A$ (Netuno, 1846) pode ser boa ciência; culpar $A$ sempre, sem uma verificação independente, é ad hoc.

  - type: build
    id: bayes-rule
    title: "Monte a regra de Bayes"
    prompt: |
      Monte a probabilidade a posteriori de uma hipótese $H$ dada a evidência $E$: a probabilidade de $E$ se $H$ for verdadeira, vezes a a priori de $H$, dividida pela probabilidade total de $E$.
    prefix: 'P(H\mid E)='
    tiles: ['P(E\mid H)', 'P(H)', 'P(E)', 'P(H\mid E)', '\times', '\div']
    answers:
      - ['P(E\mid H)', '\times', 'P(H)', '\div', 'P(E)']
      - ['P(H)', '\times', 'P(E\mid H)', '\div', 'P(E)']
    wrong:
      - answer: ['P(H\mid E)', '\times', 'P(H)', '\div', 'P(E)']
        feedback: |
          Isso usa a a posteriori para se definir a si mesma. O numerador precisa da verossimilhança $P(E\mid H)$, a chance da evidência se $H$ fosse verdadeira.
    hint: Verossimilhança vezes a priori, sobre a probabilidade da evidência.
    explanation: |
      $P(H)$ é a a priori, $P(E\mid H)$ a verossimilhança, $P(E)$ a chance total da evidência somando todas as hipóteses, e $P(H\mid E)$ a a posteriori.

  - type: build
    id: odds-form
    title: "Monte a forma de chances"
    prompt: |
      Duas hipóteses $H_1$ e $H_2$ competem pela mesma evidência $E$. Monte como as chances se atualizam.
    prefix: '\text{posterior odds}='
    tiles: ['\text{LR}', '\text{prior odds}', '\times', '+', '\div']
    answers:
      - ['\text{LR}', '\times', '\text{prior odds}']
      - ['\text{prior odds}', '\times', '\text{LR}']
    wrong:
      - answer: ['\text{LR}', '+', '\text{prior odds}']
        feedback: |
          A evidência multiplica as chances, não as soma. Uma razão de verossimilhanças igual a 1 não pode mudar nada, e somar 1 mudaria as chances.
    hint: Aqui LR é a razão de verossimilhanças $P(E\mid H_1)/P(E\mid H_2)$.
    explanation: |
      $\text{LR} = P(E\mid H_1)/P(E\mid H_2)$ mede o quanto $H_1$ previu $E$ melhor do que $H_2$ previu. Chances de $a$ para $b$ se transformam na probabilidade $a/(a+b)$.

  - type: build
    id: laplace
    title: "Monte a regra de Laplace"
    prompt: |
      Depois de $n$ tentativas, todas com sucesso, Laplace (1749-1827) deu a probabilidade de sucesso na próxima tentativa, partindo de ignorância completa. Monte-a.
    prefix: '\Pr(\text{next})='
    tiles: ['\dfrac{n+1}{n+2}', '\dfrac{n}{n+1}', '\dfrac{n}{n+2}', '\dfrac{n+1}{n}']
    answers:
      - ['\dfrac{n+1}{n+2}']
    wrong:
      - answer: ['\dfrac{n}{n+1}']
        feedback: |
          Tentadora (também tende a 1), mas dá zero depois de zero tentativas. A ignorância completa deveria dar metade em $n=0$.
    hint: Em $n=0$ a resposta precisa ser metade, e ela deve subir rumo a 1 sem nunca alcançá-lo.
    explanation: |
      Para $n=0$ dá $1/2$; para $n=10$ dá $11/12$. Nunca chega a 1, que é a face probabilística do ponto de Hume.

  - type: build
    id: dilution
    title: "Monte uma diluição 30C"
    prompt: |
      Na preparação homeopática (Hahnemann, 1755-1843), "30C" significa 30 diluições sucessivas, cada uma por um fator de 100. Monte o fator total de diluição.
    prefix: '\text{factor}='
    tiles: ['100^{30}', '30^{100}', '100\times30', '10^{30}']
    answers:
      - ['100^{30}']
    wrong:
      - answer: ['100\times30']
        feedback: |
          Diluições repetidas se multiplicam: 100 vezes 100, trinta vezes. Um único produto de 100 e 30 seria o fator de apenas alguns passos.
    hint: Cada passo multiplica a diluição pelo mesmo fator.
    explanation: |
      $100^{30} = 10^{60}$. Um mol tem cerca de $6\times10^{23}$ moléculas, então, em média, resta muito menos que uma molécula da substância original em uma dose.

  - type: mcq
    id: lr-one
    title: "Verificação: razão de verossimilhanças igual a 1"
    prompt: |
      As hipóteses $H_1$ e $H_2$ estão em chances de 3 para 2. Uma nova evidência $E$ é exatamente tão provável sob $H_1$ quanto sob $H_2$. Como devem ficar as chances depois?
    options:
      - text: 3 para 2, sem mudança.
        correct: true
      - text: Maiores para $H_1$, já que $E$ foi observada e $H_1$ é a hipótese líder.
        feedback: |
          A evidência só favorece uma hipótese que a previu melhor do que o rival. Se ambas a previram igualmente, ela não discrimina.
      - text: Chances iguais, 1 para 1.
        feedback: |
          Nada na atualização puxa para chances iguais. Um resultado neutro deixa a a priori onde estava.
    explanation: |
      Verificação de escala: LR $=1$ deixa as chances fixas. Por isso uma previsão "segura", que todos os rivais também fazem, não confirma nada em particular.

  - type: mcq
    id: rare-prior
    title: "Verificação: uma condição rara"
    prompt: |
      Uma condição afeta 1 pessoa em cada 100. Um teste é razoavelmente preciso (aponta 90% das pessoas doentes e 9% das saudáveis). Alguém testa positivo uma vez. Sem calcular, o que você deve esperar sobre a chance de essa pessoa estar doente?
    options:
      - text: Ainda bem abaixo da metade, porque a maioria dos positivos vem das muitas pessoas saudáveis.
        correct: true
      - text: Cerca de 90%, a precisão do teste.
        feedback: |
          Isso confunde $P(\text{positive}\mid\text{sick})$ com $P(\text{sick}\mid\text{positive})$. Quando a condição é rara, a maioria saudável produz mais positivos do que a minoria doente.
      - text: Cerca de 50%, já que o teste ou aponta ou não aponta.
        feedback: |
          Dois desfechos não tornam duas chances iguais; a a priori de 1% puxa a resposta para baixo.
    explanation: |
      Verificação de escala: uma a priori pequena mantém a a posteriori baixa, a menos que a evidência seja muito forte. No quadro de 1000 pessoas, 9 positivos doentes enfrentam 89 saudáveis, então 9 em 98.

  - type: mcq
    id: many-repeats
    title: "Verificação: a priori pequena, evidência fraca"
    prompt: |
      Uma hipótese começa com uma a priori de 1%. Cada resultado confirmador independente multiplica suas chances pelo mesmo fator modesto de 3. Qual expectativa está certa?
    options:
      - text: São necessários vários resultados repetidos para que ela se torne provável, já que cada um apenas multiplica as chances iniciais pequenas por 3.
        correct: true
      - text: Um resultado basta para torná-la provável, já que qualquer confirmação conta.
        feedback: |
          Um resultado leva as chances de cerca de 1 para 99 a cerca de 3 para 99, em torno de 3%. Cada resultado ajuda, mas o buraco inicial é fundo.
      - text: Nenhum número de resultados repetidos jamais a tornará provável.
        feedback: |
          Chances multiplicadas repetidamente crescem sem limite, então resultados independentes suficientes vencem. A questão é quantos, não se.
    explanation: |
      Verificação de escala: as chances crescem como o fator elevado ao número de resultados, então prioris pequenas precisam de muitas repetições, ou de um único resultado com uma razão muito grande.

  - type: mcq
    id: weak-strong
    title: "Subdeterminação fraca e forte"
    prompt: |
      Qual par de afirmações separa corretamente os dois tipos de subdeterminação da teoria pelos dados?
    options:
      - text: Fraca significa que os dados até agora se ajustam a várias teorias, e mais dados poderiam separá-las; forte significa que até todos os dados possíveis se ajustariam a teorias rivais.
        correct: true
      - text: Fraca significa que os dados se ajustam a uma única teoria; forte significa que não se ajustam a nenhuma.
        feedback: |
          Os dois tipos dizem respeito a mais de uma teoria se ajustando. A diferença está em saber se *mais dados* poderiam, em princípio, decidir.
      - text: Fraca diz respeito à religião, forte diz respeito à física.
        feedback: |
          Os dois aparecem em qualquer campo. A subdeterminação forte é uma afirmação filosófica (Quine, 1908-2000, numa leitura radical), não um tema.
      - text: Fraca significa que as teorias estão erradas, forte significa que estão certas.
        feedback: |
          Nenhuma das duas é um veredito sobre a verdade; ambas descrevem o quanto os dados fixam uma teoria.
    explanation: |
      A fraca é a ciência de rotina (colete mais dados). A forte é contestada: os críticos dizem que a simplicidade e outros valores desempatam, e discordam sobre se eles acompanham a verdade ou apenas a conveniência.

  - type: mcq
    id: realist-trio
    title: "Realista, instrumentalista, empirista construtivo"
    prompt: |
      Sobre uma teoria que prevê bem coisas invisíveis, como os elétrons, qual descrição está certa?
    options:
      - text: O realista diz que ela é aproximadamente verdadeira; o instrumentalista diz que é uma ferramenta útil, sem afirmação sobre a verdade; o empirista construtivo (van Fraassen, nascido em 1941) diz que seu objetivo é apenas ser empiricamente adequada, verdadeira quanto ao que é observável, permanecendo aberta quanto ao resto.
        correct: true
      - text: O realista diz que ela é apenas uma ferramenta; o instrumentalista diz que é aproximadamente verdadeira.
        feedback: |
          Invertido. Os realistas tomam o sucesso como sinal de verdade aproximada (o argumento sem milagres, Putnam, 1926-2016).
      - text: O empirista construtivo diz que os elétrons certamente não existem.
        feedback: |
          Isso é negação, e van Fraassen não a afirma. Ele suspende a crença sobre o inobservável.
      - text: As três concordam sobre a verdade das afirmações inobserváveis e diferem apenas sobre matemática.
        feedback: |
          Diferem exatamente sobre o que acreditar a respeito do inobservável.
    explanation: |
      Os realistas citam o sucesso; a meta-indução pessimista (Laudan, 1941-2022) responde que teorias bem-sucedidas do passado foram abandonadas. Os realistas estruturais (Worrall, 1989) mantêm a estrutura, já que as equações de Fresnel sobreviveram na teoria de Maxwell.

  - type: mcq
    id: naturalisms
    title: "Dois naturalismos"
    prompt: |
      Qual afirmação separa corretamente o naturalismo metodológico do metafísico?
    options:
      - text: O naturalismo metodológico é uma regra de método (explicar com causas naturais dentro da ciência); o naturalismo metafísico é a afirmação de que nada existe além da natureza, o que a ciência sozinha não estabelece.
        correct: true
      - text: São a mesma tese em dois vocabulários.
        feedback: |
          Um método pode ser adotado tanto por um crente quanto por um ateu; a afirmação metafísica é exatamente o que os dois disputam.
      - text: O naturalismo metodológico afirma que Deus não existe.
        feedback: |
          Isso é a afirmação metafísica, ou seja, o ateísmo. A regra metodológica diz apenas o que conta como explicação científica.
      - text: O naturalismo metafísico é o método científico.
        feedback: |
          O método, por si só, não implica um veredito sobre tudo o que existe.
    explanation: |
      Mantê-los separados evita dois deslizes: tratar o método como prova do ateísmo, e tratar o método como hostil à crença. Gould (1941-2002) propôs que a ciência e a religião cobrem magistérios separados (NOMA); os críticos respondem que as religiões também fazem afirmações factuais.

  - type: mcq
    id: is-ought
    title: "A lacuna do ser-dever"
    prompt: |
      Segundo Hume (*Tratado*, 1739), o que há de errado em passar de "é assim que as coisas são" para "portanto, é isso que devemos fazer"?
    options:
      - text: Uma conclusão sobre o que deve ser precisa de pelo menos uma premissa sobre valores; fatos sozinhos não a fornecem.
        correct: true
      - text: Nada; fatos sempre implicam valores.
        feedback: |
          A observação de Hume é que os autores escorregam do "é" para o "deve" sem notar a premissa de valor que falta. Outros respondem que alguns fatos sobre o bem-estar têm relação com os valores.
      - text: Fatos são irrelevantes para a ética.
        feedback: |
          Longe demais. Os fatos importam muito (quais ações causam o quê), mas não decidem sozinhos a premissa de valor.
    explanation: |
      A ciência pode dizer o que um remédio faz; decidir se tomá-lo também depende de valores. Alguns pensadores contestam a lacuna, então é um debate em aberto, e não um fato assentado.

  - type: mcq
    id: three-kinds
    title: "Três tipos de pergunta"
    prompt: |
      Classifique a pergunta "É certo privar de um remédio o grupo de controle num ensaio?" em um dos três tipos: empírica (o que é o caso), normativa (o que deve ser) ou metafísica (o que existe em última instância).
    options:
      - text: Normativa, uma pergunta sobre o que devemos fazer; a ciência a informa, mas não a resolve sozinha.
        correct: true
      - text: Empírica, já que um ensaio é um experimento.
        feedback: |
          O desenho do ensaio é empírico, mas se é certo privar do remédio é uma questão de valores.
      - text: Metafísica, sobre o que existe em última instância.
        feedback: |
          Nada aqui pergunta o que existe; pergunta o que deve ser feito.
    explanation: |
      Muitas questões difíceis misturam os três tipos; separá-los diz qual tipo de evidência se aplica.

  - type: numeric
    id: two-positives
    title: "Dois positivos"
    prompt: |
      Uma condição afeta 1% de uma população. Um teste aponta 90% das pessoas doentes e 9% das saudáveis. Alguém testa positivo duas vezes, em duas aplicações independentes do teste. Qual é a chance, em porcentagem, de que essa pessoa esteja doente?
    answer: 50.25
    tolerance: 0.5
    answerText: '50.3%'
    wrong:
      - { value: 9.18, feedback: "Isso é a chance depois de um único positivo. Um segundo positivo independente é mais evidência e deve elevá-la." }
      - { value: 90, feedback: "Isso é a sensibilidade do teste, e não a chance de estar doente dados os resultados." }
    hint: Trabalhe com chances e com o quanto "doente" prevê melhor um positivo do que "saudável"; pense na família "evidência independente repetida".
    explanation: |
      As chances a priori são 1 para 99. Cada positivo tem razão de verossimilhanças $0.90/0.09=10$ para "doente", então dois dão $100$, e as chances passam a $100$ para $99$, uma probabilidade de $100/199 \approx 50.3\%$. Um positivo deu apenas $9.2\%$; o segundo mais que quintuplica a chance.

  - type: numeric
    id: rms
    title: "Quão longe está a curva?"
    prompt: |
      Uma curva erra três pontos de dados por $1.0$, $1.7$ e $2.2$ (erros nas mesmas unidades). Dê o erro quadrático médio (RMS) da curva nesses pontos, com duas casas decimais.
    answer: 1.71
    tolerance: 0.01
    answerText: '1.71'
    wrong:
      - { value: 1.63, feedback: "Isso é a média simples dos três erros. O RMS eleva cada erro ao quadrado primeiro, o que dá mais peso aos grandes." }
    hint: O RMS é um "tamanho típico" construído com quadrados; o sinal de um erro não importa.
    explanation: |
      Eleve os erros ao quadrado: $1.00$, $2.89$, $4.84$. A média deles é $8.73/3=2.91$, e a raiz quadrada é cerca de $1.71$. Uma curva que passa bem mais perto dos mesmos pontos (um RMS muito menor) ainda pode ir pior em dados novos, reservados: isso é sobreajuste.

  - type: numeric
    id: repeats
    title: "Quantas confirmações?"
    prompt: |
      Uma hipótese começa com uma a priori de 1%. Cada novo resultado independente é três vezes mais provável se a hipótese for verdadeira do que se for falsa. Qual é o menor número de resultados depois do qual sua probabilidade passa de 95%?
    answer: 7
    tolerance: 0.01
    answerText: '7'
    wrong:
      - { value: 6, feedback: "Seis resultados chegam a apenas cerca de 88%. Confira a probabilidade, e não apenas as chances." }
    hint: Cada resultado multiplica as chances pelo mesmo fator; descubra onde as chances passam de 19 para 1 (95% em forma de chances).
    explanation: |
      As chances a priori são $1$ para $99$. Depois de $k$ resultados as chances são $3^k/99$. Para $k=6$ isso dá $7.36$, ou $88.0\%$; para $k=7$ dá $22.1$, ou $95.7\%$. Logo, 7 resultados.

  - type: mcq
    id: layers
    title: "Qual camada?"
    multiple: true
    prompt: |
      Este nível separa três camadas de qualquer afirmação: fato estabelecido, debate acadêmico, e fé ou compromisso metafísico. Selecione **todas** as afirmações abaixo que pertencem à terceira camada.
    options:
      - text: Nada existe além da natureza (naturalismo metafísico).
        correct: true
      - text: Só os métodos da ciência dão conhecimento real (cientificismo forte).
        correct: true
      - text: Num teste duplo-cego de 1985, astrólogos associaram mapas natais a perfis de personalidade não melhor do que o acaso.
        feedback: |
          Isso é um resultado documentado (Carlson, *Nature*, 1985): fato estabelecido, embora um único estudo não seja a história inteira.
      - text: Se teorias científicas bem-sucedidas são aproximadamente verdadeiras (realismo contra instrumentalismo).
        feedback: |
          Isso é um debate acadêmico vivo, com argumentos sérios de cada lado, e não um compromisso de fé; cada lado oferece razões tiradas da história da ciência.
    explanation: |
      As duas primeiras vão além do que qualquer experimento pode mostrar, então são compromissos, e os críticos de cada uma podem enunciar a objeção mais forte. Misturar as camadas, em qualquer direção, é o deslize comum.

  - type: text
    id: summary
    title: "O que você agora domina"
    body: |
      - **O problema de Hume e quatro respostas:** a indução não pode ser justificada sem circularidade; Popper a contorna, Reichenbach a justifica, os probabilistas a reformulam, os naturalistas a explicam à parte.
      - **Testar:** com $T$ uma teoria, $A$ suas hipóteses auxiliares e $O$ uma previsão, o modus tollens refuta, enquanto a afirmação do consequente ($T\Rightarrow O$ e $O$, logo $T$) não prova. Testes reais refutam apenas o conjunto (Duhem):
      $$(T\wedge A)\Rightarrow O,\quad \text{not } O\ \therefore\ \text{not }(T\wedge A).$$
      - **Bayes:** para hipóteses $H_1,H_2$ e evidência $E$, a a posteriori é proporcional à verossimilhança vezes a a priori, e as chances se atualizam pela razão de verossimilhanças:
      $$\frac{P(H_1\mid E)}{P(H_2\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_2)}\cdot\frac{P(H_1)}{P(H_2)}.$$
      Uma razão de $1$ não muda nada; prioris pequenas precisam de resultados fortes ou de muitos resultados.
      - **O que são as teorias:** subdeterminação fraca e forte; realista, instrumentalista, empirista construtivo; o ciclo de Kuhn e Lakatos sobre o progresso.
      - **Limites:** naturalismo metodológico versus metafísico; ser e dever; perguntas empíricas, normativas e metafísicas.
      - **Camadas:** fato, debate, compromisso, sempre rotulados.

      **Próximo:** o mapa de conteúdo, em que você reconstrói o mapa conceitual deste nível caixa por caixa.
