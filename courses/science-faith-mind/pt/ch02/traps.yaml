source_hash: cbf2525e671f
id: ch02-traps
title: Armadilhas
kind: traps

cards:
  - type: text
    id: welcome
    title: "Rodada de armadilhas: como a ciência, a evidência e o método dão errado"
    body: |
      Rodada rápida. Cada pergunta esconde um **atalho tentador** sobre como a ciência funciona: como ela aprende com a experiência, como testa, como pesa a evidência, o que consegue e não consegue resolver. Cada atalho é uma *ideia útil levada longe demais*, e cada um pode pegar um cientista, um crente e um cético igualmente.

      Nada aqui pergunta se alguma religião é verdadeira. Como sempre, as respostas são dadas *segundo* alguém (Hume, Popper, Kuhn, a regra de Bayes, um realista, um instrumentalista...), e onde pessoas atentas discordam, o feedback mostra as duas visões.

  - type: mcq
    id: sun-certain
    title: "Cinco mil nascimentos do Sol"
    prompt: |
      Alguém argumenta: "O Sol nasce todos os dias há cerca de 5000 anos de história registrada, então ele é *certo* de nascer amanhã." Segundo Hume (1711-1776), o que há de errado com a palavra "certo"?
    options:
      - text: O registro passado torna o nascer do Sol de amanhã muito provável, mas o passo de "até agora" para "sempre" não é garantido dedutivamente; supor que a natureza permanece uniforme é, em si, algo que o registro passado não consegue provar sem circularidade.
        correct: true
      - text: Nada está errado; 5000 anos de evidência bastam para a certeza.
        feedback: |
          Qualquer registro finito é compatível com uma mudança amanhã (uma galinha alimentada todos os dias durante um ano aprende o padrão do fazendeiro, até o dia em que não é mais alimentada). Muitos nascimentos do Sol tornam o próximo muito provável; não o implicam logicamente.
      - text: O registro não nos diz nada sobre o amanhã, então não deveríamos esperar que o Sol nasça.
        feedback: |
          O ponto de Hume é sobre *justificação*, não sobre o que esperar. Até Hume disse que não podemos deixar de esperar regularidade. O deslize é pular de "não é certo" para "não há razão", quando uma alta probabilidade é exatamente o que esse registro dá (a regra de Laplace dá chances de cerca de 1,8 milhão para 1).
      - text: O problema é só que as pessoas do passado mediram mal.
        feedback: |
          A qualidade da medição não é o problema. Mesmo registros perfeitos do passado deixam em aberto a pergunta "o futuro vai se parecer com o passado?".
    explanation: |
      A armadilha é misturar **certeza** com **alta probabilidade**. A indução (raciocinar a partir de casos observados para casos não observados) pode tornar uma conclusão muito provável; não pode torná-la logicamente certa. As respostas a Hume (o contorno de Popper, a justificação de Reichenbach, a reformulação probabilística, a explicação naturalizada) aceitam isso, e cada uma responde de um modo diferente.

  - type: mcq
    id: failed-prediction
    title: "A previsão falhou"
    prompt: |
      Uma teoria $T$, junto com algumas suposições de fundo $A$ (os instrumentos funcionam, nada mais interfere), prevê um resultado $O$. O experimento mostra não-$O$. Um estudante conclui: "Então $T$ está refutada." Qual é a lacuna, segundo Duhem (1861-1916)?
    options:
      - text: A lógica só mostra que a *conjunção* de $T$ e $A$ falha. Ou $T$ ou alguma hipótese auxiliar em $A$ poderia ser a culpada, então é preciso mais trabalho para dizer qual.
        correct: true
      - text: Não há lacuna; uma previsão falha sempre refuta a teoria sozinha.
        feedback: |
          O modus tollens se aplica a "$(T \wedge A) \Rightarrow O$", então refuta o *par*. A órbita de Urano falhou nas previsões newtonianas nos anos 1840, e o culpado foi um planeta não visto (Netuno, 1846), e não Newton. A órbita de Mercúrio também falhou, e ali o culpado acabou sendo a teoria.
      - text: Uma previsão falha nunca pode contar contra uma teoria.
        feedback: |
          Longe demais. Um fracasso é evidência real contra a conjunção e, muitas vezes, contra $T$ em si; a lição é que ele não aponta *automaticamente* para $T$. Os cientistas pesam o quanto as auxiliares são apoiadas de modo independente.
      - text: Previsões só importam se derem certo.
        feedback: |
          Os fracassos são informativos, e por isso Popper insistia nas previsões arriscadas. O cuidado necessário está em *atribuir* a culpa, e não em ignorar a falha.
    explanation: |
      A falsificação é logicamente válida (se $T \Rightarrow O$ e não-$O$, então não-$T$), mas os testes reais têm **hipóteses auxiliares**, então a inferência válida recai sobre um conjunto. Resgatar uma teoria mudando as auxiliares às vezes é boa ciência (Netuno) e às vezes é ad hoc (ver a armadilha da pseudociência abaixo).

  - type: mcq
    id: many-confirmations
    title: "Continua funcionando"
    prompt: |
      Uma teoria $T$ prevê $O$, e $O$ é observado repetidas vezes. Um estudante raciocina: "$T \Rightarrow O$, e $O$ é verdadeiro, então $T$ está provada." Como se chama este padrão, e por que ele falha?
    options:
      - text: Afirmação do consequente. Outras teorias poderiam prever o mesmo $O$, então observar $O$ não as exclui; confirmações elevam a probabilidade de $T$ sem prová-la.
        correct: true
      - text: Modus tollens, e ele é válido, então $T$ está provada.
        feedback: |
          O modus tollens vai de não-$O$ para não-$T$. Aqui o raciocínio vai de $O$ para $T$, na direção errada.
      - text: Falha porque observações repetidas nunca contam como evidência.
        feedback: |
          Elas contam: se $T$ torna $O$ mais provável do que seus rivais, cada sucesso eleva a probabilidade de $T$ (regra de Bayes). Só não podem levá-la à certeza.
      - text: Não falha; a ciência funciona provando teorias.
        feedback: |
          Popper e os bayesianos concordam aqui: teorias nunca são provadas pelos dados, apenas corroboradas (sobrevivem a testes) ou tornadas mais prováveis. A mecânica newtoniana foi confirmada por 200 anos e, ainda assim, revelou-se uma aproximação.
    explanation: |
      "$T \Rightarrow O$; $O$; logo $T$" é a falácia da **afirmação do consequente**. Uma confirmação forte, sobretudo de previsões *surpreendentes*, ainda pode tornar uma teoria altamente crível; a armadilha é chamá-la de prova.

  - type: mcq
    id: kuhn-irrational
    title: "Revoluções"
    prompt: |
      Um leitor de Kuhn (1922-1996) diz: "Kuhn mostrou que os cientistas trocam de paradigma como trocam de moda, então a ciência é só opinião, e uma visão é tão boa quanto outra." Qual resposta é mais justa com Kuhn?
    options:
      - text: Kuhn descreveu as mudanças de paradigma como envolvendo mais do que a lógica sozinha, mas também nomeou valores compartilhados (precisão, alcance, simplicidade, consistência, fecundidade) que orientam a escolha; ele negou que a ciência seja arbitrária. Críticos como Popper e Lakatos ainda argumentaram que ele tornava o progresso racional difícil de defender.
        correct: true
      - text: Kuhn de fato disse que a ciência é irracional e arbitrária.
        feedback: |
          Kuhn rejeitou explicitamente essa leitura em trabalhos posteriores. Ele argumentou que os cientistas escolhem usando valores que são boas razões, embora os valores possam puxar em direções diferentes e não fixem uma única resposta por regra.
      - text: Kuhn disse que a ciência é perfeitamente racional, com uma regra mecânica que sempre escolhe o vencedor.
        feedback: |
          Também não é Kuhn. Ele sustentava que nenhum algoritmo neutro resolve a escolha de paradigma, e é exatamente por isso que os críticos temiam o relativismo.
      - text: Kuhn disse que os paradigmas só mudam quando os cientistas velhos morrem, sem papel para a evidência.
        feedback: |
          A evidência importa: anomalias (resultados que o paradigma não consegue absorver, como a órbita de Mercúrio, cerca de 43 segundos de arco por século acima do valor newtoniano) se acumulam e criam uma crise. A observação sobre gerações é um comentário sociológico, não todo o seu relato.
    explanation: |
      Duas visões da mesma história: (1) a de Kuhn: a escolha racional é orientada por valores, mas não fixada por regras; (2) a dos críticos: isso deixa pouco para explicar o progresso. Nenhuma diz "opinião". Faça a versão mais forte das duas antes de tomar partido.

  - type: numeric
    id: bayes-base-rate
    title: "Um teste 90% preciso"
    prompt: |
      Uma condição afeta 1 pessoa em cada 100. Um teste a detecta em 90% das pessoas que a têm, e erradamente aponta 9% das pessoas que não a têm. Imagine 1000 pessoas: 10 têm a condição e 9 delas testam positivo, enquanto cerca de 89 das 990 saudáveis também testam positivo. Um estudante diz: "O teste é 90% preciso, então um resultado positivo significa 90% de chance de ter a condição." Entre todos que testam positivo, qual **porcentagem** realmente tem a condição? (Dê uma casa decimal.)
    answer: 9.2
    tolerance: 0.3
    answerText: '9,2 (isto é, 9 em 98)'
    wrong:
      - { value: 90, feedback: "Isso confunde P(positivo | doente) = 90% com P(doente | positivo). O segundo depende de quão comum é a condição (a a priori), não apenas da taxa de acerto do teste." }
      - { value: 50, feedback: "Dividir em 50-50 ignora as contagens. Entre os 98 positivos, 89 são pessoas saudáveis e apenas 9 estão doentes." }
    hint: "Conte os positivos: verdadeiros positivos mais falsos positivos. Depois tome a fração que está doente."
    explanation: |
      Positivos: $9 + 89 = 98$, dos quais 9 estão doentes, então a chance é $9/98 \approx 9.2\%$. Em termos da regra de Bayes: chances a priori $1:99$ vezes a razão de verossimilhanças $0.9/0.09 = 10$ dá chances $10:99$. A armadilha é a **falácia da taxa de base**: esquecer a a priori. Uma condição rara com um bom teste ainda produz, sobretudo, alarmes falsos.

  - type: mcq
    id: lr-one
    title: "Foi prevista"
    prompt: |
      Uma hipótese $H$ tem probabilidade a priori de 10%. Ela previu um resultado $E$, e $E$ acontece. Mas a hipótese rival $\neg H$ (não-$H$) previu $E$ com a mesma força, então $P(E\mid H)/P(E\mid \neg H) = 1$. Um estudante diz: "$H$ previu, e se confirmou, então $H$ agora deve ser mais provável." O que diz a regra de Bayes?
    options:
      - text: A probabilidade de $H$ permanece em 10%. A evidência apoia $H$ apenas quando é *mais esperada* sob $H$ do que sob seus rivais (razão de verossimilhanças acima de 1).
        correct: true
      - text: A probabilidade de $H$ sobe, porque uma previsão correta sempre ajuda.
        feedback: |
          Chances depois = razão de verossimilhanças vezes chances antes. Com razão 1, as chances não se movem. Uma previsão "segura", que todos os rivais também fazem, não testa nada.
      - text: A probabilidade de $H$ cai, já que uma razão igual a 1 significa que a evidência é neutra contra ela.
        feedback: |
          Evidência neutra deixa as coisas onde estavam; não as reduz. Uma queda exigiria uma razão abaixo de 1.
      - text: A probabilidade se torna 100%, porque a previsão estava certa.
        feedback: |
          Mesmo uma razão forte nunca dá certeza a partir de uma a priori estritamente entre 0 e 1.
    explanation: |
      A regra de Bayes na forma de chances: chances a posteriori = razão de verossimilhanças $\times$ chances a priori. O que ajuda é a **discriminação**, um resultado que a hipótese esperava e os rivais não. Uma previsão ousada e arriscada (o eclipse de Eddington, de 1919) tem uma razão grande; uma previsão segura tem razão próxima de 1.

  - type: mcq
    id: old-evidence
    title: "Já sabíamos disso"
    prompt: |
      A órbita de Mercúrio (um avanço extra, depois refinado para cerca de 43 segundos de arco por século) era conhecida desde 1859. A relatividade geral (1915) a explicou. Um crítico diz: "Evidência antiga não pode confirmar nada, porque sua probabilidade já era 1 antes da teoria." Segundo os defensores da confirmação bayesiana, qual é a melhor resposta?
    options:
      - text: Perguntar o que acreditaríamos *sem* a teoria, ou quão bem a teoria explica o fato. A anomalia de Mercúrio não tinha explicação antes de 1915, e a teoria a deu sem nenhum parâmetro ajustável, por isso os cientistas a contaram como apoio forte.
        correct: true
      - text: O crítico tem razão, então Mercúrio não deu apoio nenhum à relatividade geral.
        feedback: |
          A comunidade de física a contou como apoio real. O crítico aponta um verdadeiro quebra-cabeça para o bayesianismo simples (Glymour, 1980), e não uma prova de que a evidência antiga não vale nada.
      - text: Evidência antiga é sempre mais forte do que evidência nova.
        feedback: |
          Nenhuma é automaticamente mais forte. O que importa é quanto a verossimilhança da teoria para a evidência supera a dos rivais, e se o ajuste foi forçado ou construído depois.
      - text: As datas nunca importam na ciência.
        feedback: |
          O momento pode importar de outro modo: um ajuste construído *depois* de ver os dados (ajustando botões para casar com eles) é mais fraco do que uma previsão que saiu da teoria sem forçar nada.
    explanation: |
      O **problema da evidência antiga** é real, e há duas respostas comuns: a resposta do a priori contrafactual (retire a evidência do nosso conhecimento de fundo e pergunte o que pensaríamos então) e a do ajuste explicativo (a teoria *unificou* um fato já conhecido). As duas estão vivas; nenhuma torna a evidência antiga inútil.

  - type: mcq
    id: equally-true
    title: "Duas teorias, um conjunto de dados"
    prompt: |
      Duas teorias diferentes se ajustam igualmente bem a todos os dados coletados até agora. Um estudante conclui: "Então elas são igualmente verdadeiras, e escolher entre elas é puro gosto." Qual é a posição mais cuidadosa?
    options:
      - text: Ajustar-se igualmente aos mesmos dados até agora não torna as teorias igualmente *apoiadas*. Elas podem diferir em novos dados, em simplicidade, no ajuste com outras teorias bem apoiadas, ou em quanto explicam. Se essas características acompanham a verdade (realista) ou são apenas convenientes (instrumentalista, ou van Fraassen) é um debate em aberto.
        correct: true
      - text: Ajuste igual significa verdade igual, sempre, então o estudante está certo.
        feedback: |
          A subdeterminação (Duhem, Quine) diz que os dados podem não *forçar* uma única teoria. Não diz que todas as teorias que se ajustam são igualmente boas: uma curva complicada que passa por cinco pontos pode se ajustar a eles perfeitamente e falhar no ponto seguinte (sobreajuste).
      - text: Uma das duas deve ser falsa e a outra verdadeira, o que os dados já revelam.
        feedback: |
          Os dados até agora não revelam isso. As duas podem ser falsas, ou as duas aproximadamente verdadeiras. É por isso que novos testes e critérios adicionais importam.
      - text: Só a teoria mais simples pode ser verdadeira.
        feedback: |
          A simplicidade é um guia útil, mas se a própria natureza é simples é outra suposição. Os realistas muitas vezes tratam a simplicidade como sinal de verdade; outros a tratam como conveniência.
    explanation: |
      Mesmos dados, apoio diferente: mantenha separados (1) o ajuste aos dados que se tem, (2) a previsão de novos dados, (3) virtudes extras como simplicidade e unificação. A subdeterminação é uma razão para humildade, não para "vale tudo".

  - type: mcq
    id: success-true
    title: "Funciona, logo é verdadeira"
    prompt: |
      Um realista (como Putnam, 1975) argumenta: "O sucesso da ciência seria um milagre se as teorias não fossem aproximadamente verdadeiras." Laudan (1981) responde com a meta-indução pessimista. Qual é a melhor formulação da disputa?
    options:
      - text: O realista lê o sucesso como melhor explicado pela verdade. Laudan lista teorias outrora bem-sucedidas e hoje rejeitadas (o calórico, o flogisto, o éter) e pergunta por que as de hoje deveriam ser diferentes. Os realistas estruturais respondem que a *estrutura* (como as equações de Fresnel) sobreviveu; os antirrealistas dizem que o histórico ainda aconselha cautela.
        correct: true
      - text: O sucesso prova que uma teoria é exatamente verdadeira, e a lista de Laudan é irrelevante.
        feedback: |
          O sucesso é evidência, não prova, e a lista importa: a teoria do calórico previu fenômenos reais de calor e hoje é rejeitada como descrição do que o calor é.
      - text: Laudan mostrou que teorias bem-sucedidas nunca são verdadeiras.
        feedback: |
          Laudan apenas argumentou que o sucesso não tem acompanhado de modo confiável a verdade no passado, então inferir verdade a partir do sucesso é frágil. Ele não afirmou que o sucesso é evidência de falsidade.
      - text: Realismo e instrumentalismo discordam sobre se os experimentos funcionam.
        feedback: |
          Os dois concordam que os experimentos funcionam. Divergem sobre o que isso *significa*: que a teoria descreve uma realidade inobservável, ou apenas que prevê bem os observáveis.
    explanation: |
      Duas visões: (1) o argumento sem milagres: a verdade explica o sucesso; (2) a indução pessimista: sucessos passados foram depois rejeitados. Respostas intermediárias: o realismo estrutural (manter a estrutura) e o realismo de entidades de Hacking (se você pode usar elétrons para fazer coisas, eles são reais).

  - type: mcq
    id: instrumentalist-denies
    title: "Está tudo na mente?"
    prompt: |
      Um estudante diz: "Um instrumentalista acha que o mundo não existe de verdade; as teorias são apenas histórias." Isso é justo com os instrumentalistas e com empiristas construtivos como van Fraassen (nascido em 1941)?
    options:
      - text: Não. Eles aceitam que um mundo observável existe. Divergem sobre afirmações *inobserváveis*. Para os instrumentalistas, as teorias são ferramentas de previsão; para van Fraassen, o objetivo é ser empiricamente adequado (correto sobre os observáveis), permanecendo agnóstico sobre o inobservável.
        correct: true
      - text: Sim; os instrumentalistas sustentam que nada existe fora de nossas mentes.
        feedback: |
          Isso descreve o idealismo, outra posição. O instrumentalismo trata do *estatuto das teorias*, não de existirem mesas, planetas ou pessoas.
      - text: Sim; eles negam que as teorias possam prever algo.
        feedback: |
          Eles enfatizam a previsão: é o que dizem que as teorias são para.
      - text: Não; eles acreditam que toda afirmação inobservável é verdadeira.
        feedback: |
          Isso seria um realismo forte. Eles retêm a crença sobre os inobserváveis.
    explanation: |
      Fazendo a versão mais forte: a cautela do antirrealista se aplica a elétrons e quarks, não a cadeiras. Um realista responde que a linha entre "observável" e "inobservável" não é nítida (microscópios, telescópios). Essa é a disputa.

  - type: mcq
    id: unproven-pseudo
    title: "Rejeitada, logo pseudociência?"
    prompt: |
      Em 1912, Wegener propôs que os continentes se deslocam. Muitos geólogos a rejeitaram por décadas, e depois ela foi confirmada (tectônica de placas). Um estudante diz: "Se a maioria dos especialistas rejeita uma ideia, ela é pseudociência." O que o caso de Wegener mostra?
    options:
      - text: Não ser comprovada ou ser impopular não é a marca da pseudociência. As marcas propostas por Popper e Lakatos dizem respeito ao comportamento, isto é, se as afirmações são testáveis, se os fracassos são enfrentados com revisão honesta ou com resgate ad hoc, se o programa progride e se aceita a verificação independente. A ideia de Wegener podia ser testada, e foi.
        correct: true
      - text: Mostra que os especialistas estão sempre errados quando rejeitam uma ideia.
        feedback: |
          Não. A maioria das ideias rejeitadas continua rejeitada. O caso mostra apenas que a rejeição, por si só, não classifica uma ideia.
      - text: Mostra que a deriva continental era pseudociência até ser confirmada.
        feedback: |
          A ideia era testável desde o início. O que faltava, no começo, era um mecanismo convincente e dados, o que é a incompletude científica comum.
      - text: Mostra que não há diferença entre ciência e pseudociência.
        feedback: |
          Laudan (1983) argumentou que o rótulo é difícil de definir com nitidez, mas a maioria dos filósofos mantém um conjunto de marcas e o usa como questão de grau.
    explanation: |
      As marcas (não falsificável, resgate ad hoc, ausência de progresso, ausência de verificação independente) funcionam como um **conjunto**, não como uma votação. Mesmo a proposta de Laudan de abandonar a palavra é uma visão sobre se *um* critério nítido existe.

  - type: mcq
    id: homeopathy-untestable
    title: "Não testável?"
    prompt: |
      A homeopatia (fundada por Hahnemann, 1755-1843) sustenta que diluições extremas de uma substância podem tratar doenças; no "30C" um comprimido é diluído $100^{30} = 10^{60}$ vezes, então, tipicamente, nem uma molécula da substância original resta. Um estudante diz: "A homeopatia é pseudociência porque não é testável." Qual afirmação é mais precisa?
    options:
      - text: Suas afirmações eram testáveis e foram testadas (por exemplo, em ensaios duplo-cegos), e revisões não encontraram efeito além do placebo. A crítica é que o mecanismo colide com a química bem apoiada e que os defensores muitas vezes resgataram a teoria de modo ad hoc depois de testes fracassados, e não que ela não possa ser testada.
        correct: true
      - text: É não testável, então nada pode ser dito sobre ela.
        feedback: |
          A afirmação "este comprimido trata esta doença melhor que um placebo" é exatamente o tipo de afirmação que um ensaio duplo-cego pode testar, e muitos foram feitos.
      - text: Os ensaios provaram que a homeopatia nunca pode funcionar.
        feedback: |
          Os ensaios mostram ausência de efeito detectável além do placebo; "nunca pode funcionar" vai além disso. A objeção também se apoia na a priori muito baixa vinda da química (nenhuma molécula restante), que um bayesiano combina com os resultados dos ensaios.
      - text: Os testes não importam, porque os pacientes relatam que se sentem melhor.
        feedback: |
          Sentir-se melhor é real, mas também acontece com placebo e com a recuperação natural, então o ensaio compara com os dois.
    explanation: |
      Uma afirmação pode ser falsificável e ainda assim estar errada. O rótulo "não testável" deixaria a homeopatia escapar com leveza demais: ela fez afirmações testáveis e as **viu fracassar**. A acusação mais precisa é o resgate ad hoc depois da falha.

  - type: mcq
    id: naturalism-atheism
    title: "Método ou visão de mundo?"
    prompt: |
      Um estudante diz: "Os cientistas só procuram causas naturais em seu trabalho, então todo cientista está comprometido com o ateísmo." Qual distinção responde a isso?
    options:
      - text: O naturalismo metodológico (a ciência procura apenas explicações naturais como regra de trabalho) é diferente do naturalismo metafísico (nada existe além da natureza). Muitos cientistas teístas aceitam o primeiro sem o segundo; o segundo é uma visão de mundo que a ciência sozinha não estabelece.
        correct: true
      - text: Não há diferença; as duas coisas são a mesma.
        feedback: |
          Uma regra sobre como investigar não é uma afirmação sobre tudo o que existe. Um jogador de xadrez que considera apenas lances legais não está afirmando que só existe xadrez.
      - text: Os cientistas negam que algum ser sobrenatural possa existir.
        feedback: |
          Alguns negam; muitos não. O método não decide a questão, e é por isso que há cientistas crentes ao longo de toda a história.
      - text: O naturalismo metodológico prova que a natureza é tudo o que existe.
        feedback: |
          Um método não pode provar o próprio alcance. Os críticos também perguntam se ele supõe o que pretende mostrar; os defensores dizem que ele é simplesmente a regra que produziu resultados testáveis.
    explanation: |
      Duas visões sobre o próprio método: (1) ele é uma regra pragmática; (2) ele é orientado pela evidência, porque explicações sobrenaturais não têm um modo aceito de serem testadas. Se isso fecha a porta para Deus é uma questão **metafísica**, fora do método.

  - type: mcq
    id: is-ought
    title: "Dos fatos aos deveres"
    prompt: |
      Uma agência de saúde informa: "Fumar reduz a vida em cerca de uma década, em média." Um orador conclui: "Então todos devem parar de fumar, e a ciência provou isso." Segundo o ponto de Hume sobre ser e dever (*Tratado*, 1739), o que falta?
    options:
      - text: Uma premissa de valor, como "devemos valorizar muito a vida longa (ou a saúde)". Os fatos sustentam a conclusão só junto com esse valor, que a ciência não mediu.
        correct: true
      - text: Nada falta; fatos sozinhos implicam deveres.
        feedback: |
          Hume argumentou que nenhuma lista de afirmações de "é" implica um "deve" sem alguma premissa de "dever". Muitas pessoas compartilham o valor aqui, o que esconde a lacuna.
      - text: Os fatos são falsos, então o argumento falha.
        feedback: |
          O fato está bem estabelecido. A lacuna está no passo até um dever, não nos dados.
      - text: A ciência não diz nada sobre decisões de saúde.
        feedback: |
          A ciência diz muita coisa: fornece os fatos e os prováveis efeitos de cada opção. Só não escolhe quais resultados preferir. Alguns filósofos argumentam que a lacuna pode ser transposta (ética naturalizada); é um debate em aberto.
    explanation: |
      Os fatos são essenciais para boas escolhas, e os valores são essenciais para fazê-las. Uma pessoa que valoriza uma vida curta e intensa pode aceitar o mesmo fato e escolher de outro modo.

  - type: mcq
    id: scientism-proven
    title: "A ciência diz que só a ciência é verdadeira"
    prompt: |
      Um orador afirma: "Só são verdadeiras as afirmações que a ciência pode verificar. A própria ciência mostrou isso." Qual é o problema da autorreferência para o cientificismo forte?
    options:
      - text: A afirmação "só são verdadeiras as afirmações verificáveis cientificamente" não é, ela mesma, um resultado científico; então, pelo seu próprio critério, ela seria não verdadeira. É uma tese filosófica. Um cientificismo moderado (a ciência é nosso *melhor* guia para os fatos sobre o mundo) evita esse problema.
        correct: true
      - text: Não há problema; a ciência provou experimentalmente que só a ciência dá verdade.
        feedback: |
          Nenhum experimento testa essa frase. É uma posição filosófica sobre o conhecimento, e defendê-la usa argumento, não resultados de laboratório.
      - text: O problema é que a ciência esteve errada no passado.
        feedback: |
          Isso é a indução pessimista, um desafio diferente (e justo). O problema da autorreferência diz respeito à tese falhar no próprio teste.
      - text: O cientificismo forte é um problema só para os crentes.
        feedback: |
          É um problema lógico para qualquer um que o sustente, seja qual for a sua religião.
    explanation: |
      O cientificismo vem em graus: o **forte** (só a ciência produz conhecimento) enfrenta a autorreferência; o **moderado** (a ciência é a fonte mais confiável de conhecimento factual) é uma aposta defensável que ainda deixa a ética, a lógica e o sentido para outros métodos.

  - type: mcq
    id: layers
    title: "Fato, debate ou compromisso?"
    prompt: |
      Três camadas de afirmação: fato estabelecido, debate acadêmico vivo, fé ou compromisso metafísico. Selecione **todas** as afirmações abaixo que são *debate acadêmico vivo* (nem fato assentado, nem simplesmente um compromisso de fé).
    multiple: true
    options:
      - text: Se as teorias bem-sucedidas são aproximadamente verdadeiras (realismo científico).
        correct: true
      - text: Se o Sol nasceu em cada um dos últimos dias.
        feedback: |
          É um fato observado, a primeira camada.
      - text: Se a indução pode ser justificada sem circularidade.
        correct: true
      - text: Se existe uma realidade divina além do que a ciência pode testar.
        feedback: |
          É um compromisso metafísico ou de fé (a terceira camada); pessoas atentas dos dois lados o sustentam como compromisso, e não como resultado de um experimento.
      - text: Se a mudança de paradigma é totalmente governada por regras.
        correct: true
    explanation: |
      **Fato estabelecido** (observação, dados, história); **debate acadêmico** (realismo, a justificação da indução, a racionalidade de Kuhn, o estatuto da simplicidade); **compromisso de fé ou metafísico** (se a natureza é tudo o que existe). Não passe uma camada por outra, em nenhum sentido.

  - type: text
    id: summary
    title: "O que você agora domina"
    body: |
      Quatorze armadilhas, um padrão: cada uma transformou uma ideia *útil* num atalho.

      - **Muitas confirmações elevam a probabilidade, não à certeza**; a lacuna de Hume permanece.
      - **Uma previsão falha atinge um conjunto** (teoria mais auxiliares); e o sucesso não prova uma teoria (afirmação do consequente).
      - **Kuhn não é "opinião"**: valores compartilhados orientam a escolha, embora não por regra.
      - **Bayes**: lembre-se da taxa de base ($9/98 \approx 9.2\%$, não 90%); uma previsão que todos os rivais também fazem (razão 1) não muda nada; evidência antiga ainda pode contar.
      - **Ajuste igual não é apoio igual**; o sucesso sugere, mas não prova, a verdade; os antirrealistas duvidam dos inobserváveis, não das mesas.
      - **Pseudociência é um conjunto de comportamentos**, não "impopular" ou "não comprovada"; a homeopatia foi testada e fracassou.
      - **Método não é visão de mundo**; **fatos precisam de uma premissa de valor** para gerar deveres; **o cientificismo forte se refuta a si mesmo**.

      **Próximo:** *Recordação Rápida*, as fórmulas principais e as distinções do Nível 2 de relance.
