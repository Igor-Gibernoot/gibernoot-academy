outroTitle: O Nível 2 num quadro
outro: |
  **O problema de Hume** (nenhuma prova do passado para o futuro) recebe quatro respostas. **Popper** oferece a falsificação, que testa afirmações e marca a pseudociência, mas é limitada pelas **auxiliares de Duhem**; **Kuhn** descreve como a ciência de fato se move; **Bayes** pesa a evidência pela razão de verossimilhanças, e uma razão igual a 1 deixa a **subdeterminação**. O que decide os empates divide **realistas**, **instrumentalistas** e **empiristas construtivos**. A ciência tem **limites**, e as **três camadas** mantêm separados fato, debate e compromisso. A seguir: a Revisão do Nível e, depois, o Desafio do Nível.
