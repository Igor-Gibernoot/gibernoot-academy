source_hash: 247709c94356
id: ch02-map
title: "Mapa de Conteúdo: Como a Ciência Sabe"
kind: map
name: Nível 2, Como a Ciência Sabe (indução, falsificação, paradigmas, Bayes, subdeterminação, realismo, pseudociência, limites)

intro: |
  Um **mapa de conteúdo** mostra como as ideias de um nível se encaixam. Cada caixa é uma ideia, escrita em poucas frases. Uma seta vai de uma ideia até outra que se apoia nela, e um rótulo na seta diz como.

  Você vai reconstruir o mapa do Nível 2 uma caixa de cada vez. Para cada caixa que brilha, escolha a carta que pertence a ela. As outras cartas se parecem, mas cada uma esconde um erro clássico das armadilhas (um argumento válido trocado por um inválido, duas probabilidades confundidas, uma visão atribuída ao pensador errado), e cada escolha errada vem com a razão.

  Toque numa caixa concluída a qualquer momento para reler a carta dela.

cols: 3
nodes:
  - id: induction
    title: O problema de Hume
    row: 1
    col: 1
    span: 3
    body: |
      Segundo **Hume**, raciocinar do passado para o futuro precisa da premissa "o futuro vai se parecer com o passado", e a única evidência para ela é que funcionou antes, o que é **circular**. Quatro respostas, nenhuma decisiva: **Popper** (a ciência não usa indução), **Reichenbach** (uma justificação: nada se perde usando-a), prioris **bayesianas** e **inferência para a melhor explicação**.
    decoys:
      - body: |
          Segundo **Hume**, raciocinar do passado para o futuro precisa da premissa "o futuro vai se parecer com o passado", e essa premissa é uma **verdade da lógica**, pois negá-la é uma contradição. O problema é que temos poucas observações. Quatro respostas: **Popper**, **Reichenbach**, prioris **bayesianas** e **inferência para a melhor explicação**.
        feedback: |
          Negar a uniformidade da natureza não é uma contradição; é exatamente por isso que ela precisa de apoio. E o problema não desaparece com mais observações: a galinha de Russell teve milhares.
      - body: |
          Segundo **Hume**, raciocinar do passado para o futuro precisa da premissa "o futuro vai se parecer com o passado", e a única evidência para ela é que funcionou antes, o que é **circular**. Cada uma das quatro respostas (**Popper**, **Reichenbach**, prioris **bayesianas**, **melhor explicação**) **resolve** o problema por completo, então o problema está encerrado.
        feedback: |
          Nenhuma é decisiva. A resposta de Popper ainda precisa de confiança em teorias testadas, a priori bayesiana já supõe um mundo regular, e a "melhor explicação" é julgada usando justamente a regularidade em questão.
    explanation: |
      Esta é a raiz do nível: toda ideia posterior é uma forma de conviver com, ou contornar, a lacuna entre os casos observados e os casos não observados.

  - id: falsification
    title: Falsificação
    row: 2
    col: 1
    body: |
      Segundo **Popper**, uma afirmação é científica quando alguma observação possível a contrariaria. O passo válido é o **modus tollens**: se $T$ prevê $O$ e $O$ não ocorre, então $T$ é falsa. Um cisne negro refuta "todos os cisnes são brancos"; mil cisnes brancos não provam a afirmação.
    decoys:
      - body: |
          Segundo **Popper**, uma afirmação é científica quando foi confirmada muitas vezes. O passo válido é a **afirmação do consequente**: se $T$ prevê $O$ e $O$ acontece, então $T$ é verdadeira. Mil cisnes brancos provam "todos os cisnes são brancos".
        feedback: |
          A afirmação do consequente é inválida: outras teorias também poderiam prever $O$. E confirmações nunca provam uma afirmação universal; essa assimetria é justamente o ponto de Popper.
      - body: |
          Segundo **Popper**, uma afirmação é científica quando nenhuma observação pode contrariá-la, o que a torna segura. O passo válido é o **modus tollens**: se $T$ prevê $O$ e $O$ não ocorre, então $T$ é falsa.
        feedback: |
          Invertido. Uma afirmação que não proíbe nada ("vai chover ou não vai chover") é a não científica. Estar a salvo de refutação é uma fraqueza, não uma força.
    explanation: |
      A falsificação responde a Hume abandonando a esperança de provar teorias verdadeiras. Ela também nos dá um teste para a pseudociência.

  - id: paradigms
    title: Paradigmas de Kuhn
    row: 2
    col: 2
    body: |
      Segundo **Kuhn**, os cientistas fazem sobretudo **ciência normal**, resolvendo quebra-cabeças dentro de um **paradigma** compartilhado. As anomalias se acumulam numa **crise**, uma **revolução** substitui o paradigma, e paradigmas rivais podem ser **incomensuráveis**. **Valores** compartilhados (precisão, alcance, simplicidade) ainda orientam a escolha.
    decoys:
      - body: |
          Segundo **Popper**, os cientistas fazem sobretudo **ciência normal**, resolvendo quebra-cabeças dentro de um **paradigma** compartilhado. As anomalias se acumulam numa **crise**, uma **revolução** substitui o paradigma, e paradigmas rivais podem ser **incomensuráveis**. **Valores** compartilhados (precisão, alcance, simplicidade) ainda orientam a escolha.
        feedback: |
          Pensador errado. Paradigmas, ciência normal e revoluções são de Kuhn. Popper queria que os cientistas atacassem suas teorias de imediato, e esse é o contraste que Kuhn apontou.
      - body: |
          Segundo **Kuhn**, os cientistas fazem sobretudo **ciência normal**, resolvendo quebra-cabeças dentro de um **paradigma** compartilhado. As anomalias se acumulam numa **crise**, uma **revolução** substitui o paradigma, e como os paradigmas são **incomensuráveis**, a escolha entre eles é **mero gosto**, sem valores compartilhados.
        feedback: |
          Kuhn rejeitou explicitamente essa leitura. Os cientistas compartilham valores que orientam a escolha, embora possam pesá-los de modos diferentes; incomensurável não quer dizer arbitrário.
    explanation: |
      Kuhn descreve como a ciência se comporta; Popper diz como ela deveria se comportar. Comparar os dois é um dos debates vivos do nível.

  - id: bayes
    title: Regra de Bayes e chances
    row: 2
    col: 3
    body: |
      A evidência $E$ atualiza uma hipótese $H$ pela regra de Bayes. Na **forma de chances**:
      $$\text{posterior odds} = \text{LR}\times\text{prior odds}$$
      onde a **razão de verossimilhanças** $\text{LR}=P(E\mid H_1)/P(E\mid H_2)$ diz o quanto $E$ é mais esperado sob $H_1$. Com $\text{LR}=1$, a evidência não muda nada.
    decoys:
      - body: |
          A evidência $E$ atualiza uma hipótese $H$ pela regra de Bayes. Na **forma de chances**:
          $$\text{posterior odds} = \text{LR}\times\text{prior odds}$$
          onde $\text{LR}=P(H_1\mid E)/P(H_2\mid E)$ diz quão provável é $H_1$ depois que $E$ é conhecida. Com $\text{LR}=1$, a evidência não muda nada.
        feedback: |
          Essa razão é a própria chance a posteriori. A razão de verossimilhanças compara quão provável é a *evidência* sob cada hipótese, não quão prováveis são as hipóteses.
      - body: |
          A evidência $E$ atualiza uma hipótese $H$ pela regra de Bayes. Na **forma de chances**:
          $$\text{posterior odds} = \text{LR}\times\text{prior odds}$$
          onde $\text{LR}=P(E\mid H_1)/P(E\mid H_2)$. Um teste com $P(E\mid H)$ alto, portanto, torna $P(H\mid E)$ alto, qualquer que seja a probabilidade a priori.
        feedback: |
          Esta é a falácia do promotor. $P(E\mid H)$ e $P(H\mid E)$ são diferentes, e uma a priori baixa pode manter a a posteriori baixa mesmo quando o teste é preciso.
    explanation: |
      Bayes é a resposta a Hume que trabalha com graus de crença, e ela mostra como previsões ousadas ganham apoio: uma LR grande.

  - id: pseudo
    title: Marcas da pseudociência
    row: 3
    col: 1
    body: |
      A pseudociência é um **conjunto de marcas**, não um único teste: afirmações que nenhuma observação poderia refutar, ***ad hoc*** resgates que não preveem nada novo, ausência de progresso, nenhuma verificação independente. Uma ideia rejeitada (a deriva continental no início) não é automaticamente pseudociência; o que importa é como ela responde aos testes.
    decoys:
      - body: |
          A pseudociência é um **único teste**: qualquer afirmação que a comunidade ainda não aceita. A deriva continental, rejeitada no início, era portanto pseudociência até a chegada da tectônica de placas, nos anos 1960.
        feedback: |
          Ser rejeitada ou não comprovada não é a marca. A ideia de Wegener era testável e foi confirmada depois. O que importa é como um campo responde aos testes e aos fracassos.
      - body: |
          A pseudociência é um **conjunto de marcas**: afirmações que nenhuma observação poderia refutar, resgates ***ad hoc***, ausência de progresso, nenhuma verificação independente. Qualquer afirmação que foi **testada e fracassou** (a astrologia no teste de correspondência de 1985) conta, portanto, como não testável.
        feedback: |
          A astrologia fez afirmações testáveis e fracassou no teste; isso é a ciência funcionando. Ela se torna pseudociência quando os defensores a resgatam com remendos ad hoc ou recusam o teste.
    explanation: |
      Isto aplica a falsificação e o quebra-cabeça de Kuhn a casos reais, com os programas de pesquisa progressivos versus degenerativos de Lakatos como a ferramenta mais afiada.

  - id: duhem
    title: Hipóteses auxiliares de Duhem
    row: 3
    col: 2
    body: |
      Uma teoria encontra a observação só com **hipóteses auxiliares** $A$ (sobre instrumentos, dados, outros corpos). Uma previsão falha refuta apenas o conjunto:
      $$\begin{gathered}(T\wedge A)\Rightarrow O,\ \text{not } O\\ \therefore\ \text{not}(T\wedge A)\end{gathered}$$
      ou seja, pelo menos um de $T$ ou $A$ é falso, mas não se sabe qual.
    decoys:
      - body: |
          Uma teoria encontra a observação só com **hipóteses auxiliares** $A$ (sobre instrumentos, dados, outros corpos). Uma previsão falha refuta a própria teoria:
          $$\begin{gathered}(T\wedge A)\Rightarrow O,\ \text{not } O\\ \therefore\ \text{not } T\end{gathered}$$
          então $A$ fica inocentada e a culpa recai sobre $T$.
        feedback: |
          A conclusão válida é apenas $\text{not}(T\wedge A)$. O comportamento errático de Urano foi atribuído a um planeta não visto (uma hipótese auxiliar), e Netuno foi encontrado em 1846.
      - body: |
          Uma teoria encontra a observação só com **hipóteses auxiliares** $A$ (sobre instrumentos, dados, outros corpos), então uma previsão falha não mostra nada, e o cientista pode manter $T$ aconteça o que acontecer.
        feedback: |
          Forte demais. A falha mostra, sim, que $T$ ou $A$ é falsa, e a culpa pode ser testada (procure o planeta). Manter $T$ aconteça o que acontecer é o movimento ad hoc.
    explanation: |
      Duhem limita Popper: a refutação nunca é tão limpa quanto um modus tollens aplicado a uma teoria isolada.

  - id: underdet
    title: Ajustes rivais
    row: 3
    col: 3
    body: |
      Várias teorias podem se ajustar aos mesmos dados. Quando elas preveem os dados igualmente bem, a **razão de verossimilhanças é 1**, então as chances permanecem as das prioris, e o empate precisa ser decidido por outra coisa (simplicidade, alcance, mais dados). *Fraca*: mais dados podem separá-las. *Forte*: nenhum dado possível jamais as separa.
    decoys:
      - body: |
          Várias teorias podem se ajustar aos mesmos dados. Uma curva com **erro zero** nos dados usados para construí-la é, portanto, o melhor preditor, já que seu erro típico (RMS) em novos pontos também deve ser zero.
        feedback: |
          Sobreajuste. Uma curva muito ondulada pode acertar exatamente os pontos antigos e errar feio nos pontos reservados; uma curva mais simples costuma prever melhor os pontos novos.
      - body: |
          Várias teorias podem se ajustar aos mesmos dados. Quando elas preveem os dados igualmente bem, a **razão de verossimilhanças é 1**, então as chances permanecem as das prioris, e a subdeterminação *forte* significa apenas que **ainda não coletamos dados suficientes**.
        feedback: |
          Isso descreve o tipo fraco. A subdeterminação forte é a afirmação de que mesmo todas as observações possíveis não separariam as teorias.
    explanation: |
      O ponto de Duhem (qualquer falha pode ser atribuída a uma auxiliar) e o elo com Bayes (uma razão igual a 1 não muda nada) levam os dois aqui.

  - id: limits
    title: Limites da ciência
    row: 4
    col: 1
    body: |
      As questões são *empíricas*, *normativas* ou *metafísicas*. O **naturalismo metodológico** (uma regra de método: explicar com causas naturais) não é o **naturalismo metafísico** (a natureza é tudo o que existe). A lacuna de Hume: $\text{facts only}\not\Rightarrow\text{an ought}$.
    decoys:
      - body: |
          As questões são *empíricas*, *normativas* ou *metafísicas*. O **naturalismo metodológico** (uma regra de método) **prova** o **naturalismo metafísico** (a natureza é tudo o que existe), já que a ciência encontra apenas causas naturais. A lacuna de Hume: $\text{facts only}\not\Rightarrow\text{an ought}$.
        feedback: |
          Um método que procura apenas causas naturais não consegue encontrar causas sobrenaturais, então seus resultados não mostram que elas não existem. A segunda afirmação é uma visão de mundo, não um achado.
      - body: |
          As questões são *empíricas*, *normativas* ou *metafísicas*. O **naturalismo metodológico** (uma regra de método) não é o **naturalismo metafísico**. A lacuna de Hume: $\text{facts only}\Rightarrow\text{an ought}$, logo a ciência sozinha pode resolver a ética.
        feedback: |
          O ponto de Hume é o oposto: é preciso uma premissa de valor. Fatos científicos informam a ética, mas não fornecem sozinhos o que devemos fazer.
    explanation: |
      A caixa da pseudociência diz o que a ciência é; esta diz o que ela não consegue resolver: o sentido, os valores e a natureza mais profunda da existência.

  - id: realism
    title: Realismo e seus rivais
    row: 4
    col: 3
    body: |
      **Realistas** sustentam que teorias bem-sucedidas são aproximadamente verdadeiras e que seus inobserváveis existem (o argumento "sem milagres" de Putnam). **Instrumentalistas** tratam as teorias como ferramentas de previsão. **Empirismo construtivo de Van Fraassen**: aceitar uma teoria acreditando apenas que ela é empiricamente adequada.
    decoys:
      - body: |
          **Realistas** sustentam que teorias bem-sucedidas são aproximadamente verdadeiras (o argumento "sem milagres" de Putnam). **Instrumentalistas** sustentam que a ciência é inútil. **Empirismo construtivo de Van Fraassen**: acreditar apenas que a teoria é empiricamente adequada.
        feedback: |
          Instrumentalistas não dizem que a ciência é inútil; valorizam seu sucesso preditivo e duvidam que seus inobserváveis precisem ser reais.
      - body: |
          **Realistas** se apoiam na *meta-indução pessimista* de Laudan (teorias bem-sucedidas do passado foram depois abandonadas, logo as nossas provavelmente são verdadeiras). **Instrumentalistas** tratam as teorias como ferramentas. **Van Fraassen**: acreditar apenas na adequação empírica.
        feedback: |
          O argumento de Laudan é um problema para o realista, não um apoio: teorias bem-sucedidas do passado foram abandonadas, logo as nossas provavelmente também são falsas. O argumento "sem milagres" de Putnam apoia o realismo.
    explanation: |
      Se a simplicidade sinaliza verdade (realista) ou apenas utilidade (pragmática) é exatamente o que a subdeterminação deixa em aberto.

  - id: layers
    title: Três camadas
    row: 4
    col: 2
    body: |
      Toda afirmação ocupa uma camada: **fato estabelecido** (a identidade das chances, o teste da astrologia), **debate em aberto** (o peso da simplicidade, onde traçar a fronteira da ciência) ou **compromisso** (o realismo, se a natureza é tudo o que existe). Nunca passe uma camada por outra.
    decoys:
      - body: |
          Toda afirmação ocupa uma camada: **fato estabelecido**, **debate em aberto** ou **compromisso**. Uma afirmação de uma camada inferior é *menos verdadeira*, então os compromissos podem ser ignorados quando raciocinamos.
        feedback: |
          As camadas dizem que tipo de apoio uma afirmação tem, não quão verdadeira ela é. Os compromissos são mantidos por razões, e todos têm alguns; o gesto honesto é rotulá-los.
      - body: |
          Toda afirmação ocupa uma camada: **fato estabelecido**, **debate em aberto** ou **compromisso**. Qualquer afirmação que a ciência **testou** torna-se um fato, e uma afirmação que a ciência não consegue testar é, portanto, falsa.
        feedback: |
          Não ser testável não quer dizer ser falso. Algumas questões (o sentido, os valores, por que há algo em vez de nada) estão fora do método, que é silencioso sobre elas, não contrário a elas.
    explanation: |
      O hábito final de todo o curso: diga em qual camada uma afirmação está e onde pessoas atentas se separam.

