source_hash: 3256a63dcd0e
id: ch02-challenge
title: "Desafio do Nível: É ciência? (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Desafio, parte 1: julgue a afirmação"
    body: |
      Cada problema apresenta uma afirmação com ar de real para julgar em três passos: **é testável**, **é apoiada**, e **em que medida**. Os problemas são independentes, então aqui está o conjunto de ferramentas do Nível 2, retomado.

      - **Falsificável** (segundo Popper): uma afirmação é testável se alguma observação possível pudesse contrariá-la. Uma afirmação que sobrevive a todo resultado imaginável não diz nada sobre o mundo.
      - **O ponto de Duhem**: uma previsão vem de uma teoria $T$ *mais* hipóteses auxiliares $A$ (sobre instrumentos, contexto, outros objetos). Uma previsão falha refuta o conjunto $T \wedge A$; não diz qual parte abandonar.
      - **Bayes, forma de chances**: a evidência move a crença pela razão de verossimilhanças.

      $$\frac{P(H\mid E)}{P(\neg H\mid E)}=\frac{P(E\mid H)}{P(E\mid \neg H)}\cdot\frac{P(H)}{P(\neg H)}$$

      Uma razão de $1$ não move nada; uma razão grande move muito, a partir da a priori com que você começou.
      - **Sobreajuste**: uma curva flexível pode acertar com perfeição os dados a que foi ajustada e ainda errar novos dados. Compare os ajustes em pontos **reservados**.
      - **Camadas**: rotule cada afirmação como (1) fato estabelecido, (2) consenso acadêmico ou debate em aberto, ou (3) fé ou compromisso metafísico.

      Três problemas aqui. Os problemas 4 e 5 vêm na parte 2.

  - type: mcq
    id: p1-claim
    title: "Problema 1 · Um remédio natural"
    prompt: |
      **Problema 1.** Três vendedores descrevem cada um um remédio natural. Qual afirmação pode de fato ser colocada à prova por um estudo justo?
      - **Vendedor A:** "O extrato de gengibre encurta um resfriado comum em cerca de um dia, em média."
      - **Vendedor B:** "Minha tintura age por meio de uma energia vital sutil. Ela funciona para todos, nenhum instrumento consegue detectar a energia, e se um estudo não mostrar nada, isso apenas prova que a energia foi bloqueada."
      - **Vendedor C:** "A cura funciona para pessoas do tipo de energia certo. Você é do tipo certo exatamente quando a cura funciona para você."
    options:
      - text: Só o A. Um estudo pode medir a duração do resfriado com e sem gengibre, e um resultado nulo claro contaria contra ele.
        correct: true
      - text: O A e o B. Ambos preveem que as pessoas vão se sentir melhor.
        feedback: |
          O B tem uma cláusula de escape para cada resultado: o sucesso mostra que a energia funciona, o fracasso mostra que ela foi bloqueada. Uma afirmação que nenhum resultado pode constranger não é posta em risco por nenhum estudo, por mais bem conduzido que seja.
      - text: O A e o C. Ambos tratam de quem melhora.
        feedback: |
          O C define "o tipo certo" pelo fato de a cura funcionar, então nunca pode falhar: quem ela não ajuda simplesmente não era do tipo certo. A afirmação é verdadeira pela forma como é definida, não pela forma como o mundo é.
      - text: Todos os três. Qualquer afirmação pode ser testada se você reunir pessoas suficientes.
        feedback: |
          Mais pessoas não ajudam quando nenhum resultado contaria contra a afirmação. O problema do B e do C está na lógica da afirmação, não no tamanho do estudo.
    explanation: |
      Segundo Popper, o que importa é se algum resultado possível contaria *contra* a afirmação. O A de fato se expõe. O B e o C são **não falsificáveis** tal como formulados, o que é diferente de serem falsos: um crente no B pode responder que a energia pode ser real, e uma resposta justa é "então diga o que mudaria, que um ensaio possa ver". Nada aqui diz que os vendedores são desonestos, só que suas afirmações, como redigidas, não podem ser checadas.

  - type: mcq
    id: p1-refute
    title: "O que refutaria o A?"
    prompt: |
      O vendedor A afirma que o extrato de gengibre encurta um resfriado comum em cerca de um dia, em média. Qual resultado contaria **contra** essa afirmação?
    options:
      - text: Um ensaio cego e randomizado (as pessoas são designadas por sorteio e não sabem se receberam gengibre ou um placebo parecido), com centenas de pessoas por grupo, não encontra diferença na duração do resfriado além do que o acaso produz.
        correct: true
      - text: Um amigo tomou o extrato e mesmo assim ficou resfriado por sete dias.
        feedback: |
          A afirmação é sobre uma média. Os resfriados variam em dias de pessoa para pessoa, então um caso é compatível tanto com uma economia de um dia quanto com nenhuma. Além disso, é um caso único, sem grupo de comparação.
      - text: Um laboratório descobre que nenhuma substância do gengibre mata o vírus do resfriado numa placa de cultura.
        feedback: |
          A afirmação é sobre o desfecho em pessoas, não sobre um mecanismo. O gengibre poderia encurtar um resfriado pela resposta do corpo sem matar o vírus numa placa, então isso não decide a questão (embora possa reduzir a a priori, como razão para esperar um efeito).
      - text: Nenhum cientista testou ainda.
        feedback: |
          A ausência de um teste não é apoio nem refutação. Ela apenas nos diz que não temos evidência de nenhum dos lados.
    explanation: |
      Um resultado nulo claro e com poder estatístico suficiente é o tipo de evidência que conta contra uma afirmação de efeito médio. Mesmo assim, vale o ponto de Duhem: um crítico pode perguntar sobre a dose, o extrato, o tipo de resfriado (as hipóteses auxiliares). Isso é razão para fazer mais ensaios, não para tornar a afirmação não falsificável.

  - type: widget
    id: p1-grid
    title: "Uma clínica vende o remédio a quem testa positivo"
    widget: frequency-grid
    config:
      N: 1000
      prior: 0.01
      sens: 0.9
      fpr: 0.09
      sliders:
        prior: { fixed: true }
        sens: { fixed: true }
        fpr: { fixed: true }
      show: { posterior: false }
      reset: false
      labels:
        prior: "Tem a condição"
        sens: "Positivo se doente"
        fpr: "Positivo se saudável"
        tp: "Doente e positivo"
        fn: "Doente, negativo"
        fp: "Saudável, positivo"
        tn: "Saudável, negativo"
        posterior: "Doente, dado positivo"
    body: |
      Uma clínica testa uma condição que 1 pessoa em cada 100 tem, e vende o seu remédio a todos que testam positivo. O teste dá positivo para 90% das pessoas doentes e para 9% das saudáveis. Aqui estão 1000 pessoas. Conte os pontos verdes e vermelhos (os positivos).

  - type: numeric
    id: p1-post
    prompt: |
      Uma condição afeta 1 pessoa em cada 100. Um teste dá positivo para 90% das pessoas doentes e para 9% das saudáveis. De 1000 pessoas, 10 estão doentes e 990 são saudáveis; 9 doentes e 89 saudáveis testam positivo. Qual porcentagem das pessoas que testam **positivo** está de fato doente?
    answer: 9.2
    tolerance: 0.2
    answerText: '9/98 ≈ 9.2%'
    wrong:
      - { value: 90, feedback: "Isso é a chance de um positivo dada a doença (sensibilidade), não a chance de doença dado um positivo. A maioria dos positivos vem do grupo saudável, bem maior." }
      - { value: 9, feedback: "9 é o número de verdadeiros positivos. A pergunta pede a fração entre todos os 98 positivos (9 doentes mais 89 saudáveis)." }
    hint: Conte todos que testam positivo e depois pergunte que fração deles está doente.
    explanation: |
      $$\frac{9}{9+89}=\frac{9}{98}\approx 9.2\%$$
      Mesmo um teste que pega 90% dos doentes produz sobretudo alarmes falsos quando a condição é rara. Uma clínica que vende o remédio a todos os positivos está, em sua maioria, vendendo a pessoas saudáveis, e um depoimento de "cura" delas não prova nada, já que elas nunca estiveram doentes.

  - type: numeric
    id: p1-lr
    prompt: |
      Uma condição tem chances a priori de $10:99$ para uma pessoa que acabou de testar positivo (cerca de 9%). O teste tem razão de verossimilhanças $\frac{0.9}{0.09}=10$ (um positivo é dez vezes mais provável se a pessoa estiver doente do que se estiver saudável). A pessoa faz um segundo teste independente, do mesmo tipo, e ele também dá positivo. Qual é agora a probabilidade de doença, em porcentagem?
    answer: 50.3
    tolerance: 0.2
    answerText: '100/199 ≈ 50.3%'
    wrong:
      - { value: 90, feedback: "90% é de novo a sensibilidade. A a posteriori vem das chances, não de uma das taxas do próprio teste." }
      - { value: 91, feedback: "91% é o que um único positivo dá a partir de uma a priori de 50%. Aqui a a priori é só cerca de 9% antes do segundo positivo." }
    hint: Multiplique as chances pela razão de verossimilhanças e depois transforme as chances $a:b$ em $a/(a+b)$.
    explanation: |
      As chances passam de $10:99$ para $10\cdot 10:99 = 100:99$, então a probabilidade é
      $$\frac{100}{100+99}=\frac{100}{199}\approx 50.3\%.$$
      Um teste com LR $10$ é evidência forte, mas, a partir de um início de 1%, são necessários dois positivos para chegar às chances iguais. Segundo os bayesianos, é assim que "apoiado" e "em que medida" recebem um número. Um crítico do método responde que a a priori e a independência dos dois testes são, elas mesmas, suposições.

  - type: mcq
    id: p1-layers
    title: "Camadas"
    prompt: |
      Classifique: "O remédio funciona porque restaura a energia vital do corpo, que nenhum instrumento consegue medir." Qual descrição se encaixa melhor?
    options:
      - text: 'Um compromisso metafísico (camada 3), tal como enunciado. Ele passa para a camada 1 ou 2 somente se previr algo que um estudo possa ver, como um efeito mensurável que difira de um placebo parecido.'
        correct: true
      - text: 'Fato estabelecido (camada 1): muitas pessoas relatam se sentir melhor.'
        feedback: |
          Relatos de se sentir melhor são dados, e valem a pena ser estudados, mas não mostram *por que*; as pessoas também se sentem melhor depois de pílulas inertes. A afirmação sobre a energia vital vai além dos relatos.
      - text: 'Consenso acadêmico (camada 2): a comunidade médica aceita a ideia.'
        feedback: |
          É o contrário: a energia, como descrita, não é aceita na medicina convencional. Algumas tradições a sustentam, e isso é um compromisso dessas tradições, a ser descrito como tal.
    explanation: |
      A camada 3 não é um insulto: segundo as tradições que a ensinam, a energia é real e é conhecida pela prática. O rótulo honesto diz que *tipo* de afirmação é essa. Sustentada como fé ou visão de mundo, ela não é testada por ensaios; oferecida como medicina, deve aceitar o padrão da medicina, que é um teste capaz de dar resultado contrário.

  - type: mcq
    id: p2-bundle
    title: "Problema 2 · Uma teoria sobrevive a uma previsão falha"
    prompt: |
      **Problema 2.** Nos anos 1840, astrônomos calcularam a órbita de Urano a partir da teoria da gravitação de Newton $T$, mais a hipótese $A$ de que o Sol e os sete planetas conhecidos são as únicas massas relevantes. A previsão falhou: Urano se desviou de sua trajetória calculada. Qual descrição é a melhor?
    options:
      - text: A falha refuta o conjunto $T \wedge A$. A lógica sozinha não diz se se deve abandonar $T$ ou revisar $A$ (acrescentando uma massa).
        correct: true
      - text: A falha refuta de imediato a teoria de Newton $T$, porque $T$ fez a previsão.
        feedback: |
          A previsão veio de $T$ e $A$ juntas. Se $A$ for falsa (um planeta não visto puxa Urano), $T$ pode estar bem. Escolher de quem é a culpa exige razões além da previsão falha.
      - text: A falha não mostra nada, já que todas as previsões falham às vezes.
        feedback: |
          Um desvio sistemático é uma informação: algo no conjunto está errado. A questão é onde, não se.
      - text: A falha refuta apenas a hipótese $A$, porque $T$ é uma lei.
        feedback: |
          Ser uma lei não torna uma teoria imune; leis também podem ser refutadas. A história manteve Newton aqui, mas a órbita de Mercúrio depois mostrou um tipo de falha semelhante, que não foi resolvido por acrescentar um planeta.
    explanation: |
      Este é o ponto de Duhem num caso real: o que se confronta com a experiência é o conjunto. Em 1845 e 1846, Le Verrier (1811-1877) e Adams atribuíram a falha a $A$ e calcularam onde um oitavo planeta deveria estar. Outros poderiam ter atribuído a falha a $T$. As duas jogadas estavam logicamente abertas.

  - type: mcq
    id: p2-patch
    title: "Dois remendos"
    prompt: |
      Após a falha de uma previsão, são oferecidos dois remendos à teoria.
      - **Remendo 1** (Urano): "Um oitavo planeta não visto está puxando Urano; deve estar nesta parte do céu, com este brilho. Olhem ali."
      - **Remendo 2** (outra teoria): "O efeito falha sempre que céticos estão na sala, porque a dúvida deles o perturba." A teoria não prevê mais nada.
      Segundo Lakatos (1922-1974), qual é progressivo e qual é degenerativo?
    options:
      - text: O remendo 1 é progressivo, porque faz uma previsão nova e arriscada. O remendo 2 é degenerativo, porque apenas explica a falha e não acrescenta nada que um teste possa captar.
        correct: true
      - text: 'Os dois são degenerativos: qualquer remendo acrescentado depois de uma falha é ad hoc.'
        feedback: |
          O momento, sozinho, não é a marca. Um remendo acrescentado depois de uma falha pode ser excelente se prever algo novo e sobreviver. O remendo 1 o fez: o planeta foi encontrado em 1846, a menos de cerca de um grau do lugar previsto.
      - text: 'Os dois são progressivos: cada um salvou a teoria.'
        feedback: |
          Salvar a teoria é barato; qualquer teoria pode ser salva por uma cláusula de escape. Segundo Lakatos, a questão é se o remendo ganha conteúdo **novo** que pode ser testado.
      - text: O remendo 2 é progressivo, porque é mais difícil de refutar.
        feedback: |
          Ser difícil de refutar é o oposto da virtude. Um remendo que torna a teoria imune à falha, e a qualquer outro resultado, comprou segurança ao abrir mão de conteúdo.
    explanation: |
      Um remendo que apenas absorve a falha é **ad hoc**: cobre uma lacuna e não diz nada mais. Um remendo com uma previsão nova é um risco assumido. Justiça com o outro lado: um remendo não é ruim *por causa* de proteger uma teoria. Os defensores de uma teoria mais antiga têm razão ao dizer que abandonar uma teoria bem testada na primeira anomalia seria imprudente (a ciência normal de Kuhn); o teste do remendo é o que ele prevê em seguida. A mesma forma de remendo fracassou no caso de Mercúrio: propôs-se um planeta "Vulcano" para explicar sua órbita, que nunca foi encontrado, e a anomalia foi resolvida em 1915 por outra teoria (a relatividade geral).

  - type: numeric
    id: p2-bayes
    prompt: |
      Uma teoria mais um remendo tem probabilidade a priori de $20\%$. O remendo prevê algo novo e arriscado que apareceria com probabilidade $0.8$ se a teoria remendada estiver certa, e apenas $0.05$ se estiver errada. A previsão é verificada e se confirma. Qual é agora a probabilidade da teoria remendada, em porcentagem?
    answer: 80
    tolerance: 0.5
    answerText: '80%'
    wrong:
      - { value: 20, feedback: "20% é a resposta para um remendo cujo sucesso já era conhecido, em que a razão de verossimilhanças é 1 e nada se move. Aqui o resultado era novo e arriscado, então a razão é grande." }
      - { value: 94, feedback: "94% é $0.8/(0.8+0.05)$, que esquece a a priori. As chances a priori são $1:4$ e precisam ser multiplicadas pela razão." }
    hint: A razão é $0.8/0.05$; as chances a priori são $20:80$.
    explanation: |
      A razão de verossimilhanças é $\frac{0.8}{0.05}=16$ e as chances a priori são $1:4$, então
      $$\text{odds}=16\cdot\frac14=4:1$$
      logo
      $$P=\frac{4}{5}=80\%.$$
      Compare com um remendo feito apenas para ajustar dados já conhecidos (sem previsão nova): então $P(E\mid H)=P(E\mid\neg H)$ para esses dados, a razão é $1$ e a crença permanece em $20\%$. Na leitura bayesiana, "progressivo" é o remendo que ganha uma razão grande; "ad hoc" é o que não ganha nenhuma. Os críticos acrescentam que o quanto um remendo ganha depende da a priori que lhe foi dada, e a lógica não a fixa.

  - type: mcq
    id: p2-layers
    title: "Camadas"
    prompt: |
      Classifique: "A descoberta de Netuno mostra que a gravidade de Newton é aproximadamente verdadeira em relação à realidade, e não apenas útil para cálculos." Em qual camada está a afirmação?
    options:
      - text: 'Um debate em aberto (camada 2). Que Netuno foi encontrado onde previsto em 1846 é fato estabelecido (camada 1); o que esse sucesso mostra sobre a realidade é disputado entre realistas e instrumentalistas.'
        correct: true
      - text: 'Fato estabelecido (camada 1): o planeta foi encontrado.'
        feedback: |
          Que o planeta foi encontrado é camada 1, mas a frase diz mais: que o sucesso mostra *verdade* aproximada. Esse passo é a parte contestada.
      - text: 'Compromisso de fé (camada 3): nenhuma afirmação científica pode ser sobre a realidade.'
        feedback: |
          Os realistas sustentam que a ciência fala sobre a realidade e apresentam argumentos para isso (como o sucesso das previsões); os instrumentalistas apresentam argumentos contra. É um debate com razões dos dois lados, não um compromisso puro.
    explanation: |
      Segundo os realistas, uma teoria que prevê um novo planeta seria um milagre se não fosse aproximadamente verdadeira. Segundo os instrumentalistas, o sucesso mostra que a teoria é uma boa ferramenta, e a história de teorias bem-sucedidas abandonadas (o calórico, o éter) adverte contra a inferência. Sabe-se hoje que a própria teoria de Newton é aproximada: a relatividade geral a corrige.

  - type: widget
    id: p3-fit
    title: "Problema 3 · Seis medições, três curvas"
    widget: curve-fit-lab
    config:
      points: [[1, 0.8], [2, 1.9], [4, 2.0], [6, 3.3], [8, 3.4], [9, 4.6]]
      xRange: [0, 10.5]
      yRange: [-5, 11]
      degree: 1
      degreeRange: [1, 5]
      compare: [2, 5]
      tolerance: 0.4
      holdout: 10
      edit: false
      show:
        simplest: true
        tolerance: false
    body: |
      **Problema 3.** Uma clínica registra uma nota de melhora (vertical) após $x$ meses num programa (horizontal), para seis clientes. As curvas são ajustes polinomiais de graus diferentes (grau = a maior potência de $x$; grau 1 é uma reta). Arraste o controle de grau e observe os ajustes e a linha vertical tracejada no mês 10, uma consulta ainda não medida.

  - type: mcq
    id: p3-perfect
    prompt: |
      As notas dos seis clientes são ajustadas por uma reta (erro de cerca de $0.35$, em unidades de nota) e por uma curva de grau 5 que passa por todos os seis pontos (erro $0$). No mês 10, a reta prevê cerca de $4.7$ e a curva de grau 5 cerca de $10.6$. Qual afirmação é a melhor?
    options:
      - text: 'O ajuste perfeito prova pouco: com seis pontos, uma curva de grau 5 consegue acertar quaisquer seis números. Para comparar as duas, teste em consultas novas, não usadas no ajuste.'
        correct: true
      - text: A curva de grau 5 é a melhor, porque seu erro nos dados é zero.
        feedback: |
          Erro zero nos dados usados no ajuste é o que uma curva com seis números livres obtém de graça. Isso não mostra que ela capta o padrão em vez do ruído.
      - text: A reta é a melhor, porque o simples sempre vence.
        feedback: |
          A simplicidade é uma razão para preferir uma curva em muitas visões, mas "sempre" é forte demais. Se consultas novas seguissem a curva sinuosa, a reta seria a escolha errada. Os dados podem derrubar a simplicidade.
      - text: Nenhuma pode ser julgada, porque os dados não podem ser repetidos.
        feedback: |
          Repetir é exatamente o que pode ser feito: mais meses, mais clientes. Dados reservados dão uma comparação justa mesmo quando os seis primeiros pontos não conseguem discriminar.
    explanation: |
      Isto é **sobreajuste**: acompanhar o ruído junto com o padrão. Os dados se ajustam às três curvas de modo quase igual no sentido que importa (nenhuma é refutada pelos seis pontos), mas as curvas discordam sobre o mês 10, então os dados **não determinam** a escolha. O que desempata é uma nova evidência ou uma razão para preferir uma das curvas.

  - type: numeric
    id: p3-rms
    prompt: |
      A curva de grau 5 se ajusta aos seus seis pontos de treino com erro $0$. Depois, três novos clientes são medidos, e a curva erra as notas deles por $0.3$, $0.4$ e $0.5$ (em unidades de nota). Qual é o erro quadrático médio (RMS, da sigla em inglês) nesses três pontos reservados, com duas casas decimais?
    answer: 0.41
    tolerance: 0.01
    answerText: '$\sqrt{0.5/3}\approx 0.41$'
    wrong:
      - { value: 0.4, feedback: "0.4 é a média simples das três diferenças. O RMS eleva ao quadrado primeiro, então a diferença maior pesa mais; o resultado fica um pouco acima da média." }
      - { value: 0, feedback: "0 é o erro nos pontos de treino. A pergunta é sobre os pontos reservados, em que ele costuma ser maior." }
    hint: Eleve cada diferença ao quadrado, tire a média dos quadrados e depois a raiz quadrada.
    explanation: |
      Some os quadrados, divida por 3 e tire a raiz:
      $$0.09+0.16+0.25=0.50$$
      $$\text{RMS}=\sqrt{\tfrac{0.50}{3}}\approx 0.41$$
      Uma curva com erro de treino $0$ e erro reservado $0.41$ sobreajustou; uma reta com erro de treino $0.35$ e erro reservado perto de $0.4$ não sobreajustou. Comparar os erros de treino e os reservados é como separamos padrão de ruído.

  - type: mcq
    id: p3-tie
    title: "O que desempata?"
    prompt: |
      Suponha que duas curvas se ajustem igualmente bem aos seis clientes e que, até agora, novos clientes não consigam distingui-las. Duas visões sobre a escolha: os **realistas** (segundo aqueles que sustentam que as teorias visam à verdade) dizem que a simplicidade é evidência de que uma curva acompanha o mundo; os **empiristas construtivos**, como van Fraassen (nascido em 1941), dizem que a simplicidade é uma conveniência e só conta a concordância com os dados observáveis. Qual afirmação é justa com as duas?
    options:
      - text: Ambos concordam que novas observações que discriminem as curvas decidem entre elas quando chegarem. Divergem sobre se, enquanto o empate durar, preferir a curva mais simples é um guia para a verdade ou apenas para a conveniência.
        correct: true
      - text: Os realistas dizem que curvas simples são sempre verdadeiras; os empiristas dizem que são sempre falsas.
        feedback: |
          Nenhum dos dois diz isso. Os realistas tratam a simplicidade como um guia falível, e os empiristas simplesmente se recusam a contá-la como evidência sobre o inobservável.
      - text: Os empiristas dizem que o empate não pode ser desfeito nem em princípio, então a ciência é arbitrária.
        feedback: |
          Os empiristas aceitam que novos dados são decisivos sobre o que é observável. O que recusam é uma afirmação de *verdade* baseada só na simplicidade; ainda escolhem a curva mais simples por razões práticas.
      - text: Os realistas dizem que os dados decidem e a simplicidade é irrelevante.
        feedback: |
          Isso inverte a posição realista tal como descrita: os realistas usam a simplicidade como razão além dos dados, justamente o que o empirista recusa fazer.
    explanation: |
      Note o quanto as duas visões compartilham: os mesmos dados, a mesma preferência prática pela curva mais simples, a mesma disposição de mudar se os dados do mês 10 discordarem. O desacordo está no que a preferência *significa*: uma pista sobre a realidade (segundo os realistas) ou uma escolha que funciona (segundo os empiristas construtivos). Uma terceira visão, a de Quine, acrescenta que nenhuma afirmação é testada isoladamente, então as escolhas entre curvas também são escolhas sobre o resto da nossa teia de crenças.

  - type: mcq
    id: p3-layers
    title: "Camadas"
    prompt: |
      Classifique: "A própria natureza é simples, então a curva mais simples que se ajusta provavelmente é a verdadeira." Em qual camada está a afirmação?
    options:
      - text: 'Um compromisso metafísico (camada 3). Usar o ajuste mais simples como regra prática é terreno comum; que a natureza seja simples é uma visão sobre a realidade que os dados não conseguem provar, embora a ciência muitas vezes a tenha recompensado.'
        correct: true
      - text: 'Fato estabelecido (camada 1): a ciência mostrou que a natureza é simples.'
        feedback: |
          Algumas leis são impressionantemente simples, mas outras são confusas, e o que conta como simples depende da descrição. O histórico é evidência, não prova de que a natureza é simples.
      - text: 'Consenso assentado (camada 2): os filósofos concordam.'
        feedback: |
          Não concordam. Se a simplicidade é um guia para a verdade ou apenas uma conveniência é um dos debates deste problema.
    explanation: |
      A mesma frase mistura uma regra prática (um debate de camada 2 sobre sua justificativa) e uma afirmação sobre o mundo (camada 3). Separá-las mantém as duas honestas: você pode manter a regra e sustentar a afirmação com cautela, e um teísta, um ateu e um cientista agnóstico podem todos usá-la por razões próprias.

  - type: text
    id: summary
    title: "O que você agora domina"
    body: |
      - **Testável ou não**: uma afirmação só está em risco se algum resultado possível contasse contra ela. Cláusulas de escape ("só funciona quando funciona") removem o risco, e isso é um defeito da afirmação, não prova de que ela é falsa.
      - **Apoiada em que medida**: a evidência move a crença pela razão de verossimilhanças, na forma de chances $\frac{P(H\mid E)}{P(\neg H\mid E)}=\frac{P(E\mid H)}{P(E\mid \neg H)}\cdot\frac{P(H)}{P(\neg H)}$. Um teste com razão $10$ a partir de um início de 1% dá 9,2% após um positivo e 50,3% após dois.
      - **Remendos**: uma previsão falha refuta o conjunto $T \wedge A$. Um remendo é progressivo quando prevê algo novo e arriscado (Netuno), e degenerativo quando apenas absorve a falha.
      - **Sobreajuste e subdeterminação**: um ajuste perfeito aos dados usados no ajuste prova pouco; compare em dados reservados, e reconheça que ajustes igualmente bons ainda podem divergir onde não há dados.
      - **Camadas**: fatos, debates em aberto e compromissos permanecem rotulados em todo problema.

      O que continua em aberto: se a simplicidade acompanha a verdade, e o que um remendo bem-sucedido mostra sobre a realidade.

      **Próximo:** a parte 2 tem os problemas 4 e 5. O problema 4 pergunta o quão realista é uma afirmação da ciência (o que o sucesso de uma teoria mostra), e o problema 5 pergunta onde estão os limites da ciência, com o NOMA de Gould e os três tipos de pergunta.
