source_hash: 553519f13087
id: ch02-challenge-2
title: "Desafio do Nível: É ciência? (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Desafio, parte 2: o quão real, e até onde vai"
    body: |
      Dois problemas, independentes da parte 1. O conjunto de ferramentas do Nível 2, retomado:

      - **Realismo científico** (segundo seus defensores): as teorias bem-sucedidas da ciência madura são aproximadamente verdadeiras, inclusive no que dizem sobre coisas que não podemos ver. **Instrumentalismo** (segundo seus defensores): uma teoria é uma ferramenta para prever observações, e seu valor é o seu sucesso, não uma afirmação sobre uma realidade oculta.
      - **Argumento sem milagres** (Putnam, 1975): uma teoria que prevê com precisão e com frequência seria um milagre se não fosse aproximadamente verdadeira.
      - **Meta-indução pessimista** (Laudan, 1981): muitas teorias bem-sucedidas do passado (o calórico, o flogisto, o éter) foram depois abandonadas como falsas, então as teorias bem-sucedidas de hoje também podem ser abandonadas.
      - **Três tipos de pergunta**: empírica (resolvida pela observação), normativa (o que devemos fazer ou valorizar), metafísica (como é a realidade além do que a observação pode resolver).
      - **NOMA** (Gould, 1997): ciência e religião são "magistérios não sobrepostos", cada um com seu próprio domínio de autoridade. **Lacuna do ser-dever** (Hume): fatos sozinhos nunca implicam um "dever". **Cientificismo**: a visão de que a ciência é a única fonte de conhecimento real.
      - **Camadas**: (1) fato estabelecido, (2) consenso acadêmico ou debate em aberto, (3) fé ou compromisso metafísico.

  - type: mcq
    id: p4-nma
    title: "Problema 4 · Luz e o éter"
    prompt: |
      **Problema 4.** Augustin Fresnel (1788-1827) tratou a luz como uma onda num meio elástico, o **éter**, e derivou equações para a quantidade de luz que uma superfície reflete. Elas coincidiram com medições cuidadosas. Em incidência normal, do ar para um material de índice de refração $n$, elas dão a fração refletida

      $$R=\left(\frac{n-1}{n+1}\right)^2$$

      Segundo um defensor do argumento sem milagres, o que esse sucesso sugere?
    options:
      - text: Previsões tão precisas seriam um milagre se a teoria não fosse aproximadamente verdadeira, então o quadro de Fresnel, com o éter incluído, provavelmente está próximo de como a luz realmente é.
        correct: true
      - text: Nada sobre a realidade, porque uma teoria só pode ser uma ferramenta para prever.
        feedback: |
          Essa é a leitura do instrumentalista, não a do realista. O argumento sem milagres afirma o oposto: que o sucesso preciso é melhor explicado pela verdade aproximada.
      - text: Que a teoria é exatamente verdadeira, de modo que nunca pode ser substituída.
        feedback: |
          Os realistas afirmam verdade *aproximada*, não exata, e aceitam que teorias posteriores melhorem as anteriores. "Exatamente verdadeira e definitiva" não é o que o argumento diz.
      - text: Que o éter deve ser visível com um microscópio bom o suficiente.
        feedback: |
          O argumento é uma inferência para a melhor explicação do sucesso, não uma previsão sobre microscópios. O éter foi postulado justamente porque não podia ser visto diretamente.
    explanation: |
      O argumento sem milagres é uma **inferência para a melhor explicação**: de todas as maneiras de explicar o sucesso preciso de uma teoria, a verdade aproximada parece a menos estranha. Sua melhor objeção vem a seguir.

  - type: mcq
    id: p4-pmi
    title: "As respostas à meta-indução"
    prompt: |
      A teoria de Maxwell (anos 1860 e 1870) depois explicou a luz como uma onda no campo eletromagnético, sem um éter elástico, e o éter foi abandonado. Segundo a meta-indução pessimista, o que se segue?
    options:
      - text: A teoria de Fresnel foi muito bem-sucedida, mas sua entidade central não existe; logo, o sucesso não sinalizou de modo confiável a verdade no passado, e o mesmo pode valer para nossas melhores teorias de hoje.
        correct: true
      - text: As medições de Fresnel estavam erradas, já que o éter não existe.
        feedback: |
          As medições de reflexão se mantêm; a teoria de Maxwell as reproduz. A objeção é que o sucesso e uma imagem errada da realidade ocorreram juntos, não que os dados tenham falhado.
      - text: Toda teoria antiga deveria ser descartada e todas as teorias novas deveriam ser confiáveis.
        feedback: |
          O argumento vai no sentido oposto: se teorias antigas bem-sucedidas foram depois abandonadas, as novas também podem ser. É uma razão para cautela com toda teoria.
      - text: A ciência não consegue fazer previsão alguma.
        feedback: |
          O argumento aceita as previsões. Ele questiona o que elas mostram sobre entidades inobserváveis e sobre a verdade.
    explanation: |
      Laudan lista vários casos (o calórico, o flogisto, o éter) em que o sucesso e uma rejeição posterior coexistiram. O argumento é uma indução sobre a história da ciência: uma indução pessimista, dirigida à premissa do realista de que o sucesso indica verdade aproximada.

  - type: numeric
    id: p4-water
    title: "O número que sobreviveu"
    prompt: |
      A fórmula de reflexão de Fresnel dá, para a luz que passa do ar para um material de índice $n$ em incidência normal, a fração refletida $R=\big(\tfrac{n-1}{n+1}\big)^2$. Para a água, $n=1.33$. Que porcentagem da luz ela reflete? (Responda em porcentagem, com uma casa decimal.)
    answer: 2.0
    tolerance: 0.05
    answerText: '2.0'
    wrong:
      - { value: 33, feedback: 'Isso é $n-1$ em porcentagem. A fórmula divide por $n+1$ e depois eleva ao quadrado.' }
      - { value: 14.2, feedback: 'Você esqueceu de elevar ao quadrado a razão $(0.33/2.33)=0.142$. Elevando ao quadrado, obtém-se $0.020$.' }
    hint: 'Calcule primeiro $(1.33-1)/(1.33+1)$ e depois eleve ao quadrado.'
    explanation: |
      $(0.33/2.33)^2 \approx 0.0201$, então a água reflete cerca de 2,0% em incidência normal. A teoria de campo de Maxwell, sem éter elástico, dá **exatamente a mesma fórmula** a partir de suas próprias condições de contorno. O número sobreviveu à mudança de quadro, e é essa observação que o próximo cartão constrói.

  - type: mcq
    id: p4-keep
    title: "O que um realista estrutural mantém"
    prompt: |
      John Worrall (1989) propôs o **realismo estrutural**. Usando Fresnel e Maxwell, qual afirmação melhor capta a posição dele, segundo seus defensores?
    options:
      - text: O que passa da teoria antiga para a nova é a estrutura matemática (as equações que relacionam as grandezas). O sucesso mostra que essa estrutura é aproximadamente verdadeira, enquanto afirmações sobre o que são as entidades, como um éter elástico, podem ser abandonadas.
        correct: true
      - text: Tudo na teoria antiga era verdadeiro, inclusive o éter, e Maxwell apenas acrescentou algo a ela.
        feedback: |
          A teoria de Maxwell não tem éter elástico. Um realista sobre *tudo* da teoria antiga é exatamente a posição que a história refuta.
      - text: A teoria antiga era inteiramente falsa e seu sucesso foi sorte.
        feedback: |
          Então a fórmula idêntica nas duas teorias seria uma coincidência sem explicação. O realista estrutural usa a sobrevivência das equações como evidência de que algo real foi captado.
      - text: Só as coisas observáveis são reais, então não há nada a manter.
        feedback: |
          Isso está mais perto do empirismo construtivo (van Fraassen, nascido em 1941). O realista estrutural acredita na estrutura inobservável; a discordância é apenas sobre o que, na teoria, se acredita.
    explanation: |
      A proposta de Worrall é um compromisso: mantém a resposta do realista ao enigma do sem milagres (a fórmula não é sorte), enquanto responde à meta-indução pessimista (o éter se foi, as equações ficaram). Seus críticos perguntam se "estrutura" pode ser separada daquilo de que ela é a estrutura, e se toda mudança de teoria realmente mantém as equações.

  - type: mcq
    id: p4-fair
    title: "As duas visões, expostas com justiça"
    prompt: |
      Um estudante escreve um resumo do debate sobre o realismo a partir de Fresnel e Maxwell. Qual frase é justa com os dois lados?
    options:
      - text: Os realistas dizem que o sucesso preciso da teoria e a sobrevivência de suas equações são melhor explicados pela verdade aproximada, pelo menos da estrutura; os instrumentalistas respondem que o sucesso se explica pelo fato de a teoria prever bem, que a história das entidades abandonadas adverte contra acreditar no que não podemos observar, e que nenhuma afirmação adicional é necessária.
        correct: true
      - text: Os realistas são ingênuos em relação à história, e os instrumentalistas são os únicos pensadores cuidadosos.
        feedback: |
          Realistas como Worrall enfrentam a história diretamente, e têm uma resposta elaborada para ela. Um resumo justo não chama nenhum dos lados de ingênuo.
      - text: Os instrumentalistas negam que a ciência funcione.
        feedback: |
          Eles aceitam que a ciência funciona. Negam que esse sucesso nos obrigue a acreditar em entidades inobserváveis.
      - text: O realismo é fato estabelecido, já que as equações dão previsões corretas.
        feedback: |
          Todos concordam que as previsões estão corretas. Se isso apoia a *verdade sobre o inobservável* é o debate em aberto.
    explanation: |
      Uma versão mais forte aceita a evidência do outro lado e enuncia exatamente o desacordo: os dois concordam sobre os dados e a história, e se separam sobre o que o sucesso mostra sobre o inobservável.

  - type: mcq
    id: p4-layers
    title: "Camadas"
    prompt: |
      Selecione as afirmações que são um **debate em aberto** (camada 2), e não fato estabelecido (camada 1).
    multiple: true
    options:
      - text: 'O sucesso das teorias maduras é boa evidência de que elas são aproximadamente verdadeiras.'
        correct: true
      - text: 'A fórmula de Fresnel dá a fração refletida $R=\big(\tfrac{n-1}{n+1}\big)^2$ em incidência normal, e a teoria de Maxwell dá a mesma fórmula.'
        feedback: |
          As duas afirmações podem ser verificadas por derivação e por medição: fato estabelecido.
      - text: 'Um realista estrutural acerta ao acreditar na estrutura de uma teoria, e não nas suas entidades.'
        correct: true
      - text: 'A teoria de Maxwell não tem éter elástico.'
        feedback: |
          É um fato simples sobre o conteúdo da teoria, não um debate.
    explanation: |
      A história e a matemática estão na camada 1. Se o sucesso mostra verdade, e se a estrutura é aquilo em que vale a pena acreditar, são questões debatidas entre filósofos da ciência; para onde cada um pende também depende de seus compromissos metafísicos mais amplos (camada 3).

  - type: mcq
    id: p5-parts
    title: "Problema 5 · Uma afirmação composta"
    prompt: |
      **Problema 5.** Um orador diz: "A ciência mostra que a oração não serve para nada, então devemos parar de financiar capelães de hospitais." Qual divisão em partes é a mais precisa?
    options:
      - text: 'Empírica: se a oração muda os desfechos médicos. Metafísica: se a oração é "sem serventia" num sentido mais amplo (se há alguém que a ouça, o que ela significa para quem reza). Normativa: se os capelães devem ser financiados.'
        correct: true
      - text: 'As três partes são empíricas, já que capelães podem ser contados e a oração pode ser estudada.'
        feedback: |
          Contar capelães é empírico, mas "devemos financiá-los" pergunta o que devemos fazer e quais valores contam (conforto, dignidade, custo). Contar não pode resolver um "dever".
      - text: 'A afirmação inteira é metafísica, porque menciona a oração.'
        feedback: |
          Parte dela é empírica: um ensaio pode testar se a oração feita por estranhos muda a recuperação. Só uma parte do que "sem serventia" significa vai além da observação.
      - text: 'A afirmação inteira é normativa, porque termina em "devemos".'
        feedback: |
          Só a última oração é normativa. O restante faz afirmações factuais e mais amplas, que precisam de atenção separada.
    explanation: |
      Dividir é o primeiro movimento para julgar uma afirmação composta. A palavra "sem serventia" esconde duas tarefas: uma afirmação factual estreita (nenhum efeito médico) e uma ampla (nenhum valor ou sentido), e a política precisa, além disso, de uma premissa de valor.

  - type: mcq
    id: p5-gap
    title: "Do fato à política"
    prompt: |
      Suponha que um ensaio grande e bem conduzido não encontre efeito médico da oração intercessória (oração feita por outros por um paciente). Segundo a lacuna do ser-dever de Hume, o que esse resultado, sozinho, permite?
    options:
      - text: Ele apoia uma conclusão factual sobre desfechos médicos. Uma conclusão política sobre o financiamento de capelães também precisa de uma premissa de valor, como "a capelania só deve ser financiada se melhorar os desfechos médicos".
        correct: true
      - text: Ele estabelece que os capelães devem perder o financiamento.
        feedback: |
          Isso salta do "é" para o "deve". Capelães costumam ser financiados pelo conforto, pela dignidade ou pelo apoio às famílias, não como tratamento médico, e o ensaio não mediu nada disso.
      - text: Ele estabelece que os capelães devem manter o financiamento.
        feedback: |
          A mesma lacuna funciona nos dois sentidos: o ensaio não implica política alguma em nenhuma direção.
      - text: Nada, porque ensaios não dizem nada sobre a oração.
        feedback: |
          Um ensaio pode dizer algo definido sobre uma pergunta estreita (desfechos médicos). A lacuna diz respeito ao que se segue, não a se o ensaio tem algum significado.
    explanation: |
      Hume (*Tratado*, 1739) observou que os autores escorregam de afirmações de "é" para afirmações de "deve" sem dizer qual premissa extra as sustenta. Tornar explícita a premissa de valor permite que pessoas que concordam sobre os fatos discordem abertamente sobre o valor.

  - type: mcq
    id: p5-step
    title: "Um teste estreito"
    prompt: |
      O ensaio STEP (Benson e colaboradores, 2006) acompanhou 1.802 pacientes submetidos a cirurgia cardíaca e não encontrou benefício em ser objeto de orações de grupos distantes. Qual conclusão ele apoia?
    options:
      - text: Naquele contexto, ser objeto de oração intercessória à distância não melhorou a recuperação. Ele não testa se a oração tem outros sentidos para quem reza, nem se alguém a ouve.
        correct: true
      - text: Fica demonstrado que a oração não tem sentido algum.
        feedback: |
          O ensaio mediu um desfecho de um tipo de oração. O sentido para quem reza, ou a existência de alguém que ouve, estavam fora de seu alcance.
      - text: Deus não existe.
        feedback: |
          Nenhum ensaio desse tipo poderia resolver isso. Alguns crentes também objetam que Deus não pode ser submetido a teste, então um resultado nulo ali não é uma refutação para eles; céticos respondem que, então, a alegação de um efeito médico também não seria testável. As duas leituras concordam sobre o que o ensaio mediu.
      - text: O ensaio prova que a oração ajuda quem reza em outras circunstâncias.
        feedback: |
          Nada num resultado nulo apoia um benefício em outro lugar também.
    explanation: |
      Um teste bem desenhado ganha uma conclusão estreita e nada além disso. Manter pequeno o alcance de um resultado faz parte do julgamento de uma afirmação abrangente.

  - type: mcq
    id: p5-noma
    title: "A proposta de Gould e seus críticos"
    prompt: |
      Stephen Jay Gould (1941-2002) propôs o NOMA em 1997: a ciência cobre o domínio empírico, a religião cobre as questões de sentido e valor, e nenhuma das duas pode anular a outra. Qual é a *objeção* mais forte, segundo os críticos, apresentada de modo justo?
    options:
      - text: Muitas religiões fazem afirmações factuais (sobre origens, curas, milagres), que caem dentro do domínio da evidência, então os domínios se sobrepõem. Um defensor do NOMA responde que essas afirmações são melhor lidas como expressões de sentido, embora muitos crentes rejeitem essa leitura.
        correct: true
      - text: O NOMA é falso porque a religião não tem questões de valor.
        feedback: |
          Os críticos não dizem isso. A objeção é sobre afirmações factuais dentro das religiões, não sobre se a religião trata de valor.
      - text: O NOMA é falso porque a ciência também responde perguntas de valor.
        feedback: |
          Até muitos cientistas aceitam a lacuna do ser-dever, então esta não é a objeção usual. A usual é que as religiões também afirmam fatos.
      - text: O NOMA é falso porque Gould não era religioso.
        feedback: |
          Quem propõe um argumento não decide se ele funciona. A questão é se os domínios realmente não se sobrepõem.
    explanation: |
      O NOMA é uma proposta de paz, e atrai pessoas dos dois lados. Funciona melhor para questões de sentido e valor, e pior onde uma tradição afirma que um evento particular aconteceu. Se isso é um argumento contra o NOMA ou contra ler a afirmação literalmente faz parte do debate.

  - type: mcq
    id: p5-scientism
    title: "Até onde a ciência pode ir?"
    prompt: |
      O cientificismo forte diz: "Só são significativas ou conhecidas as afirmações que a ciência pode testar." O cientificismo moderado diz: "Para perguntas sobre o mundo natural, a ciência é nosso método mais confiável." Qual comentário é justo?
    options:
      - text: 'O cientificismo moderado é amplamente compartilhado, inclusive por muitos crentes. O cientificismo forte enfrenta um problema de autorreferência: a afirmação "só são conhecidas as afirmações testáveis" não é, ela mesma, testável por um experimento.'
        correct: true
      - text: As duas versões têm a mesma força, já que ambas elogiam a ciência.
        feedback: |
          A versão forte exclui a ética, a matemática e a filosofia como fontes de conhecimento. A versão moderada afirma apenas que a ciência é a melhor para um domínio.
      - text: O cientificismo forte é a única posição honesta para um cientista.
        feedback: |
          Muitos cientistas a rejeitam, e alguns sustentam a versão moderada aceitando que a ética e a matemática precisam de outros métodos.
      - text: O cientificismo moderado prova que Deus não existe.
        feedback: |
          Ele não diz nada sobre Deus. Se há um ser além da natureza é uma pergunta metafísica que essa afirmação deixa em aberto.
    explanation: |
      A objeção da autorreferência não torna falsa a visão forte, apenas a deixa sem sustentação segundo o seu próprio critério. Seus defensores podem responder que a afirmação é uma tese filosófica apoiada pelo sucesso da ciência.

  - type: mcq
    id: p5-layers
    title: "Camadas"
    prompt: |
      Classifique: "Não há nada além da natureza, então as perguntas sobre o que está além dela não têm resposta." Em qual camada ela está?
    options:
      - text: 'Um compromisso metafísico (camada 3), sustentado por razões filosóficas. Um teísta sustenta o compromisso oposto, e nenhum dos dois é estabelecido por um experimento.'
        correct: true
      - text: 'Fato estabelecido (camada 1), porque a ciência não encontrou nada além da natureza.'
        feedback: |
          "Não encontrou nada" é um fato sobre o que os métodos conseguem detectar na natureza. "Não há nada" é uma afirmação adicional que os próprios métodos não podem decidir.
      - text: 'Consenso assentado (camada 2), já que a maioria dos cientistas concorda.'
        feedback: |
          Muitos cientistas adotam o naturalismo metodológico (trabalhar como se só causas naturais operassem), que é uma regra de trabalho. O naturalismo metafísico é uma tese mais forte, e os cientistas divergem sobre ela.
    explanation: |
      Manter o naturalismo metodológico (uma regra de método) separado do naturalismo metafísico (uma tese sobre a realidade) permite que crentes e não crentes façam a mesma ciência.

  - type: order
    id: method
    title: "Um método para qualquer afirmação"
    prompt: |
      Ponha em ordem um método para julgar qualquer afirmação abrangente, usando as ferramentas do nível.
    steps:
      - 'Enuncie a afirmação e pergunte qual resultado possível a contrariaria (ela é testável?).'
      - 'Liste as hipóteses auxiliares que vêm agregadas a ela, já que uma previsão falha refuta o conjunto.'
      - 'Pese o quanto a evidência a apoia, por quanto ela move a crença a partir do ponto de partida (a razão de verossimilhanças).'
      - 'Verifique-a em testes reservados ou arriscados, e não apenas nos dados que ela foi construída para ajustar.'
      - 'Rotule cada parte como fato, debate em aberto ou compromisso, e diga que tipo de pergunta ela é.'
    hint: 'Comece perguntando se a afirmação pode falhar, e termine rotulando o que encontrou.'
    explanation: |
      A testabilidade vem primeiro, porque uma afirmação que não pode falhar não pode ser apoiada. O conjunto vem depois, para que uma falha não seja atribuída à parte errada. Depois, a quantidade de apoio; em seguida, a verificação com dados reservados; e por fim, rotular as camadas, para que a conclusão seja enunciada com seus limites.

  - type: text
    id: summary
    title: "O que você agora domina"
    body: |
      - **Quão real é o sucesso?** Segundo o argumento sem milagres (Putnam), o sucesso preciso é melhor explicado pela verdade aproximada. Segundo a meta-indução pessimista (Laudan), muitas teorias bem-sucedidas foram abandonadas, então o sucesso pode não sinalizar verdade. Segundo o realismo estrutural (Worrall, 1989), o que sobrevive a uma mudança de teoria é a estrutura: a fórmula de Fresnel $R=\big(\tfrac{n-1}{n+1}\big)^2$ (2,0% para a água, $n=1.33$) permaneceu na teoria de Maxwell enquanto o éter se foi.
      - **Onde a ciência para**: divida uma afirmação composta em partes empíricas, normativas e metafísicas. Um fato nunca implica um "deve" sem uma premissa de valor (Hume). Um teste estreito, como o ensaio STEP (1.802 pacientes), apoia uma conclusão estreita. O NOMA (Gould) e sua crítica, e o cientificismo forte versus o moderado, são debates em aberto.
      - **Um método**: testável, conjunto, quanto apoio, reservado, camadas.

      O que continua em aberto: se o sucesso mostra verdade sobre o inobservável, se a estrutura pode ser separada daquilo de que ela é a estrutura, se os domínios da ciência e da religião se sobrepõem, e se o cientificismo forte pode se sustentar.

      **Próximo:** *Visões da Realidade*: materialismo, idealismo, dualismo, panpsiquismo e o que a mecânica quântica obriga e não obriga a aceitar.
