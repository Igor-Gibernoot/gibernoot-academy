source_hash: 2ab283b9b889
id: ch02-induction
title: Por que o Sol vai nascer amanhã
kind: concept
own: |
  - **Dois tipos de argumento.** Um argumento **dedutivo** é aquele em que, se as premissas forem verdadeiras, a conclusão não pode ser falsa (todos os metais se expandem; o ferro é um metal; logo, o ferro se expande). Um argumento **indutivo** nos leva de casos que vimos a casos que não vimos: "o Sol nasceu todos os dias até agora, logo vai nascer amanhã". A indução é como a ciência, e a vida cotidiana, vão além da evidência que se tem em mãos.
  - **O problema de Hume.** Segundo **Hume** (1711-1776), o passo do passado para o futuro precisa de uma premissa-ponte, o princípio da uniformidade:
  $$\text{the future will resemble the past}$$
  Não é uma verdade da lógica (negá-lo não é contradição), e a única evidência para ele é que funcionou antes, o que é {{ circular: usa a indução para justificar a indução }}. Então, argumenta Hume, {{ nenhum argumento do passado para o futuro escapa da circularidade }}. A resposta do próprio Hume: esperamos o futuro por **costume ou hábito**, não por razão.
  - **A galinha de Russell.** A galinha, alimentada toda manhã, fica a cada dia mais certa de que será alimentada, até o dia em que o fazendeiro lhe torce o pescoço. Segundo **Russell** (1872-1970), um longo registro sem quebras aumenta a confiança, mas {{ não mostra que o padrão não pode mudar }}.
  - **Respostas, nenhuma decisiva.** (1) **Popper** (1902-1994): a ciência não usa indução; ela {{ propõe conjecturas ousadas e tenta refutá-las }}. (2) **Reichenbach** (1891-1953), uma justificação: não podemos provar que a indução funciona, mas {{ se algum método puder encontrar regularidades, a indução as encontrará; logo nada se perde usando-a }}. (3) **Bayesiana**: partir de probabilidades a priori e atualizá-las pela regra de Bayes. A regra de Laplace diz que, depois de $n$ sucessos em $n$ tentativas, sem nenhuma falha,
  $$P(\text{success next}) = \frac{n+1}{n+2}$$
  mas isso se apoia numa a priori que já supõe que o mundo é regular, então a suposição apenas se deslocou, sem desaparecer. (4) **Inferência para a melhor explicação**: a melhor explicação do registro é uma lei estável, mas "melhor" é julgado usando justamente a regularidade em questão.
  - **O novo enigma de Goodman** (1955). Fixe um instante $t$. Um objeto é **grue** se é *verde quando examinado pela primeira vez antes de $t$, e azul quando examinado depois*. Toda esmeralda vista até agora é verde e também grue, então a evidência {{ se ajusta igualmente a "todas as esmeraldas são verdes" e a "todas as esmeraldas são grue" }}, embora elas prevejam cores diferentes depois de $t$. A indução precisa de um modo de dizer quais padrões podem ser projetados, e os dados sozinhos não dizem.
  - **Onde pessoas atentas se separam.** Se o problema é um buraco real na ciência (a leitura cética), uma exigência de certeza que nada poderia satisfazer (a leitura prática), ou resolvido por aceitar uma confiança básica na ordem da natureza como um **compromisso de tipo fé**, no qual a própria ciência se apoia (camada 3, e não camada 1).
cards:
  - type: mcq
    id: hook
    title: "O Sol vai nascer amanhã?"
    prompt: |
      Todos os dias da sua vida, e da vida de cada pessoa que você conhece, o Sol nasceu. Antes de qualquer teoria, **chute**: qual é a melhor razão que temos para esperar que ele nasça amanhã?
    options:
      - text: 'Ele sempre nasceu antes, então esperamos que o padrão continue.'
        correct: true
      - text: 'A astronomia prova com certeza, então não há razão para duvidar.'
        feedback: |
          A astronomia dá razões muito boas, mas veja o que ela usa: leis como a gravitação, que foram testadas no passado. Se elas continuarão valendo amanhã é justamente a questão. Então "prova com certeza" afirma mais do que o registro pode dar.
      - text: 'Não há razão; é apenas um palpite.'
        feedback: |
          Não é um palpite cego: temos um registro enorme. O enigma é como um registro do passado pode *justificar* uma afirmação sobre o futuro, e isso é mais difícil do que parece.
    explanation: |
      A maioria das pessoas responde com o registro. A pergunta desta lição é se o registro pode mesmo nos levar até amanhã. Este velho enigma tem nome: o **problema da indução**.

  - type: widget
    id: sampler-sun
    widget: sequence-sampler
    config:
      rule: change
      changeAt: 37
      seed: 1
      symbols: ["☀", "🌑"]
      claim: "O Sol nasce todos os dias."
      max: 80
      labels:
        next: "Próximo dia"
        ten: "Dez dias"
        reset: "Recomeçar"
        empty: "Nenhum dia observado ainda."
      presets:
        - { label: "Outra regra oculta", rule: change, changeAt: 14, seed: 2 }
    body: |
      Um mundo de brinquedo tem uma regra oculta para o seu Sol. Pressione **Próximo dia** ou **Dez dias** e observe a afirmação "O Sol nasce todos os dias." Pare sempre que sentir que tem certeza de que o Sol nascerá no **próximo** dia, e anote quantos dias você já tinha visto. Depois continue.

  - type: mcq
    id: sampler-q
    prompt: |
      Num mundo de brinquedo, o Sol nasceu em cada um dos primeiros 30 dias. Uma regra oculta pode quebrar o padrão em algum dia posterior, digamos o dia 37. Olhando apenas esses 30 dias, qual afirmação está correta?
    options:
      - text: 'Os 30 dias se ajustam tanto a "o padrão vale para sempre" quanto a "o padrão muda no dia 37", então o registro sozinho não consegue distingui-las.'
        correct: true
      - text: 'O registro mostra que o padrão vale para sempre, já que todos os 30 dias concordam.'
        feedback: |
          Trinta em trinta é muito, mas uma regra que quebra no dia 37 dá exatamente os mesmos primeiros 30 dias. O registro não diz qual regra está por trás.
      - text: 'O registro mostra que o padrão vai quebrar em breve, porque longas sequências nunca duram.'
        feedback: |
          Nada em 30 nascimentos do Sol diz isso também. Longas sequências às vezes terminam e às vezes não; o registro não anuncia qual.
    explanation: |
      Todo registro sem quebras é compatível com uma regra que continua e com regras que mudam depois. O registro não consegue escolher entre elas sem a ajuda de algo mais. Encontrar esse "algo mais" é o problema.

  - type: text
    id: kinds
    title: "Dois tipos de argumento"
    body: |
      Um argumento **dedutivo** é aquele em que, se as premissas forem verdadeiras, a conclusão *não pode* ser falsa:

      > Todo metal se expande quando aquecido. O ferro é um metal. Logo, o ferro se expande quando aquecido.

      Um argumento **indutivo** vai de casos que vimos a casos que não vimos:

      > Todo nascer do Sol até agora foi seguido de outro. Logo, o nascer do Sol de amanhã vai acontecer.

      A indução pode tornar uma conclusão provável, mas nunca *garantida* do modo como a dedução a garante. Ainda assim, a ciência (cada lei é testada em alguns casos e aplicada a todos) e a vida cotidiana (o pão te alimentou ontem) se apoiam nela o tempo todo.

  - type: mcq
    id: kinds-q
    title: "Dedução ou indução?"
    prompt: |
      Qual destes é **indutivo**?
    options:
      - text: 'Todo cisne que vi é branco, então o próximo cisne que eu vir será branco.'
        correct: true
      - text: 'Todas as aves têm penas; um cisne é uma ave; logo, um cisne tem penas.'
        feedback: |
          Se as duas premissas forem verdadeiras, a conclusão não pode ser falsa. Isso é dedução.
      - text: 'Ou a loja está aberta ou está fechada; ela não está aberta; logo, está fechada.'
        feedback: |
          De novo a conclusão segue com certeza das premissas: dedução.
    explanation: |
      A marca da indução: a conclusão diz **mais** do que as premissas. "O próximo cisne" é um caso que as premissas nunca mencionam. Esse alcance extra é o que torna a indução útil, e o que a torna arriscada.

  - type: text
    id: hume
    title: "A pergunta de Hume"
    image:
      src: img/hume.webp
      alt: "Retrato pintado de David Hume, de casaco marrom e boné vermelho, por Allan Ramsay"
      caption: "David Hume (1711-1776), aqui no retrato de Allan Ramsay, publicou seu *Treatise of Human Nature* (*Tratado da Natureza Humana*) em 1739, aos 28 anos."
      credit: "Allan Ramsay, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Allan_Ramsay_-_David_Hume,_1711_-_1776._Historian_and_philosopher_-_PG_3521_-_National_Galleries_of_Scotland.jpg"
    body: |
      **David Hume** (1711-1776), filósofo escocês, levantou a questão em seu *Treatise of Human Nature* (*Tratado da Natureza Humana*, 1739) e de forma mais breve em seu *Enquiry concerning Human Understanding* (*Investigação sobre o Entendimento Humano*, 1748). Em paráfrase do argumento dele:

      - **P1.** Para ir de "o Sol nasceu todos os dias até agora" a "ele vai nascer amanhã", precisamos de uma premissa-ponte: **o futuro vai se parecer com o passado** (o *princípio da uniformidade*).
      - **P2.** Isso não é uma verdade da lógica: "o futuro não vai se parecer com o passado" *não* é uma contradição, pois podemos imaginá-lo.
      - **P3.** Então precisamos de **evidência** para ele. A única evidência é que o futuro se pareceu com o passado *até agora*.
      - **P4.** Mas usar essa evidência para concluir que ele continuará assim é, por si só, um passo indutivo.
      - **C.** Logo, toda tentativa de justificar a indução *pressupõe* a indução. Nenhum argumento do passado para o futuro escapa da circularidade.

      Hume não disse que devemos parar de esperar o nascer do Sol. Disse que a **razão** não pode ser o que justifica essa expectativa.

  - type: mcq
    id: circular-q
    title: "Encontre o círculo"
    prompt: |
      Alguém responde a Hume: "A indução tem funcionado muito bem no passado: previu eclipses, pontes que continuam de pé, remédios que funcionam. Então a indução vai continuar funcionando." Qual é a objeção de Hume?
    options:
      - text: 'Isso é um argumento indutivo em si (funcionou antes, então vai funcionar de novo), e assim pressupõe justamente o que deveria justificar.'
        correct: true
      - text: 'Os exemplos são falsos: a indução nunca previu eclipses.'
        feedback: |
          Os exemplos são verdadeiros, e Hume os aceitaria. O ponto dele é sobre a *forma* da resposta, não sobre os fatos.
      - text: 'Hume não tem objeção; uma longa lista de sucessos é exatamente o que significa justificar.'
        feedback: |
          Uma longa lista de sucessos é o que eleva a expectativa, mas, para transformá-la numa justificação *para o futuro*, a resposta usa "sucesso passado prevê sucesso futuro", que é o princípio em questão.
    explanation: |
      Um argumento **circular** tem a conclusão já dentro de uma premissa. Aqui a premissa "sucesso passado prevê sucesso futuro" é indução, e a conclusão "a indução vai continuar funcionando" é sobre a indução.

  - type: order
    id: hume-order
    prompt: |
      Ponha em ordem os passos do argumento de Hume: por que nenhum argumento do passado para o futuro escapa da circularidade.
    steps:
      - 'Para passar de "o Sol sempre nasceu" a "ele vai nascer amanhã", precisamos de uma ponte: o futuro vai se parecer com o passado.'
      - 'A ponte não é uma verdade da lógica: negá-la não é contradição.'
      - 'Logo, qualquer apoio a ela deve vir da experiência: ela valeu até agora.'
      - 'Concluir, a partir de "valeu até agora", que "vai valer amanhã" é, por si só, um passo indutivo.'
      - 'Logo, a justificação pressupõe o que deveria justificar: é circular.'
    hint: Comece pelo vão, depois pergunte o que poderia preenchê-lo.
    explanation: |
      O argumento primeiro nomeia a ponte que falta, depois verifica as duas fontes possíveis de apoio: a lógica (indisponível) e a experiência (circular).

  - type: mcq
    id: critic
    title: "Qual premissa um crítico rejeitaria?"
    prompt: |
      Um crítico quer resistir à conclusão de Hume dizendo: "Um argumento que se sustenta a si mesmo, como *a indução funcionou, logo a indução é confiável*, não é vicioso só por ser circular desse modo." Qual passo do argumento de Hume este crítico pressiona?
    options:
      - text: 'P4: usar o sucesso passado para apoiar o princípio seria, afinal, um passo legítimo.'
        correct: true
      - text: 'P2: eles afirmam que o princípio é uma verdade da lógica.'
        feedback: |
          Isso seria outra resposta (e uma difícil: é fácil imaginar o princípio falhando sem contradição). Este crítico aceita que o princípio não é lógico e pressiona como ele é sustentado.
      - text: 'A conclusão C: eles afirmam que devemos parar de esperar o nascer do Sol.'
        feedback: |
          Ninguém, nem mesmo Hume, diz isso. A disputa é sobre *o que justifica* a expectativa, não sobre se devemos mantê-la.
    explanation: |
      As respostas a Hume diferem no passo que pressionam: negar P2 (o princípio é uma verdade lógica ou embutida), negar que P4 seja vicioso (argumentos que se sustentam a si mesmos), ou aceitar a conclusão e perguntar o que fazer com ela. As próximas cartas apresentam as principais.

  - type: mcq
    id: chicken
    title: "A galinha de Russell"
    image:
      src: img/russell.webp
      alt: "Fotografia do filósofo Bertrand Russell, de terno de três peças, em 1929"
      caption: "Bertrand Russell (1872-1970), fotografado no Caltech em outubro de 1929; ele usou a história da galinha para mostrar que um longo registro de confirmações não garante o caso seguinte."
      credit: "Los Angeles Times, CC BY 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Bertrand_Russell_at_Cal_Tech.jpg"
    prompt: |
      **Bertrand Russell** (1872-1970) contou a história de uma galinha que o fazendeiro alimentava toda manhã. A cada dia ela fica mais certa de que será alimentada de novo, até o dia em que o fazendeiro lhe torce o pescoço. O que a história ilustra sobre a indução?
    options:
      - text: 'Um longo registro sem quebras aumenta a confiança, mas não pode mostrar que o padrão não pode mudar; o próprio registro não revela uma quebra iminente.'
        correct: true
      - text: 'A indução está sempre errada.'
        feedback: |
          A galinha esteve certa todos os dias, exceto no último. A indução costuma funcionar; a história mostra seu limite lógico, não que ela costuma falhar.
      - text: 'Uma galinha esperta teria visto a quebra chegando apenas pelo registro de alimentação.'
        feedback: |
          Só pelo registro de alimentação, nenhum padrão diz "amanhã é diferente". Uma galinha mais esperta precisaria de conhecimento extra (sobre fazendas), e isso é conhecimento vindo de fora do registro.
    explanation: |
      A melhor evidência da galinha é um registro longo e perfeito. Sua confiança era razoável, e ela estava errada. Se, com o Sol, estamos na posição da galinha depende de um conhecimento que vai além do registro, exatamente o que Hume nos pede para justificar.

  - type: text
    id: replies
    title: "O que fazemos a respeito?"
    body: |
      Os filósofos deram vários tipos de resposta. Nenhuma fez o problema desaparecer, e pessoas atentas discordam sobre qual delas chega mais perto. Aqui estão quatro, cada uma na forma que seus defensores aceitariam.

      1. **Contornar** (Popper): a ciência não precisa da indução.
      2. **Justificar** (Reichenbach): não podemos mostrar que ela funciona, mas podemos mostrar que usá-la é a melhor aposta.
      3. **Reformular** (raciocínio bayesiano): tratar a crença como probabilidade e atualizá-la com a evidência.
      4. **Explicar à parte** (inferência para a melhor explicação): uma lei estável explica o registro melhor do que qualquer rival.

      As próximas cartas as examinam uma a uma, com a melhor objeção a cada uma.

  - type: mcq
    id: popper
    title: "O contorno de Popper"
    image:
      src: img/popper.webp
      alt: "Fotografia de Karl Popper, já idoso, de cabelos brancos, tirada antes de 1987"
      caption: "Karl Popper (1902-1994), filósofo da ciência nascido na Áustria, escreveu *Logik der Forschung* em 1934; ele sustentava que a ciência avança tentando refutar conjecturas ousadas."
      credit: "DorianKBandy, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Photo_of_Karl_Popper.jpg"
    prompt: |
      **Karl Popper** (1902-1994) disse: os cientistas não verificam teorias por indução; propõem conjecturas ousadas e tentam com afinco refutá-las. Uma teoria que sobrevive é *corroborada* (passou em testes), nunca provada. Segundo Popper, como o problema de Hume é evitado?
    options:
      - text: 'A ciência nunca precisou de um passo indutivo de "visto até agora" para "sempre verdadeiro"; a refutação (um passo dedutivo a partir de um único caso contrário) faz o trabalho real.'
        correct: true
      - text: 'Provando que o futuro precisa se parecer com o passado.'
        feedback: |
          Popper aceita a conclusão de Hume de que isso não pode ser provado. A jogada dele é dizer que a ciência não se apoia nisso.
      - text: 'Mostrando que uma teoria é verdadeira assim que passa em cem testes.'
        feedback: |
          Popper insiste que passar em testes nunca torna uma teoria verdadeira; apenas não a refutou até agora.
    explanation: |
      Um cisne negro refuta "todos os cisnes são brancos" com certeza; nenhum número de cisnes brancos a prova. Popper constrói a ciência sobre essa assimetria. A próxima lição, sobre Popper e o cisne negro, testa essa ideia.

  - type: mcq
    id: popper-obj
    title: "A objeção mais forte ao contorno"
    prompt: |
      Uma teoria sobreviveu a todos os testes até agora. Construímos uma ponte sobre ela, confiando que ela vai se sustentar amanhã. Um crítico diz que o contorno de Popper ainda deixa algo de fora. O quê?
    options:
      - text: 'Confiar numa teoria corroborada para amanhã já trata sua sobrevivência passada como guia para o futuro, o que parece indução de novo.'
        correct: true
      - text: 'A refutação não é logicamente válida.'
        feedback: |
          A refutação é válida: se uma teoria implica um resultado e o resultado falha, a teoria falha (supondo que o teste foi montado como descrito). O problema está no uso das teorias sobreviventes, não em refutá-las.
      - text: 'Os cientistas não tentam refutar suas teorias.'
        feedback: |
          Muitos tentam, e o ponto de Popper diz respeito tanto ao que eles deveriam fazer quanto ao que fazem. A objeção aqui é sobre o que a teoria sobrevivente autoriza.
    explanation: |
      A resposta de Popper: não *acreditamos* na teoria; a escolhemos como a mais bem testada. Seus críticos acham que "mais bem testada, logo a melhor em que se apoiar" reintroduz o passo que ele queria evitar. Se isso é um dano ou apenas uma questão prática é um debate em aberto.

  - type: mcq
    id: reichenbach
    title: "A justificação de Reichenbach"
    prompt: |
      **Hans Reichenbach** (1891-1953) argumentou: suponha que a natureza tenha *alguma* regularidade que um método possa encontrar. Então a indução (estender o padrão visto até agora) acabará se aproximando dela. Se a natureza não tiver nenhuma, nenhum método consegue prever nada. Segundo Reichenbach, o que isso nos dá?
    options:
      - text: 'Não uma prova de que a indução funciona, mas um argumento prático: se algum método pode ter sucesso, a indução terá, então usá-la não custa nada comparada às alternativas.'
        correct: true
      - text: 'Uma prova de que a natureza é regular.'
        feedback: |
          O argumento é condicional: *se* houver uma regularidade. Ele não diz que há uma.
      - text: 'Uma prova de que a indução é circular e deve ser abandonada.'
        feedback: |
          A justificação aceita o ponto de Hume de que a razão não pode justificar a indução, e faz outra pergunta: existe uma aposta melhor? Ele argumenta que não há.
    explanation: |
      A melhor objeção: "acabará se aproximando" é um consolo frio, pois muitos métodos rivais (como "estender o padrão até o dia 37 e depois mudar") também se saem bem a longo prazo. O argumento não nos diz o que esperar em um dia específico.

  - type: numeric
    id: laplace
    title: "Uma resposta bayesiana"
    image:
      src: img/laplace.webp
      alt: "Retrato pintado de Pierre-Simon Laplace por Johann Ernst Heinsius"
      caption: "Pierre-Simon Laplace (1749-1827), matemático e astrônomo francês, aplicou a probabilidade à astronomia e a perguntas como o próximo nascer do Sol."
      credit: "Johann Ernst Heinsius, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Pierre-Simon_de_Laplace_by_Johann_Ernst_Heinsius_(1775).jpg"
    prompt: |
      **Pierre-Simon Laplace** (1749-1827) deu uma regra para a abordagem bayesiana: comece sem nenhuma preferência sobre quão provável é um nascer do Sol (uma a priori plana) e, depois de $n$ nascimentos do Sol sem nenhuma falha, a probabilidade de que o próximo aconteça é
      $$\frac{n+1}{n+2}$$
      Um recém-chegado viu $n=10$ nascimentos do Sol e nenhuma falha. Pela regra de Laplace, qual é a probabilidade de um 11º nascer do Sol, como decimal entre 0 e 1?
    answer: 0.9167
    tolerance: 0.001
    answerText: '11/12 ≈ 0.917'
    wrong:
      - { value: 1, feedback: "Um registro finito nunca dá certeza sob essa regra; a fórmula sempre deixa uma lacuna de $1/(n+2)$." }
      - { value: 0.9091, feedback: "Isso é $10/11$, ou seja, $n/(n+1)$. A regra de Laplace soma 1 ao numerador e 2 ao denominador." }
    hint: Coloque $n=10$ na fórmula.
    explanation: |
      $\dfrac{10+1}{10+2}=\dfrac{11}{12}\approx0.917$. Para a ilustração do próprio Laplace (cerca de 5.000 anos de história registrada, aproximadamente 1.826.213 dias), a mesma regra dá chances de cerca de 1.826.214 para 1 a favor do nascer do Sol de amanhã.

  - type: mcq
    id: laplace-obj
    title: "O que o bayesiano supôs?"
    prompt: |
      A regra de Laplace dá um número claro depois de qualquer registro. Segundo os críticos, por que ela não dissolve o problema de Hume?
    options:
      - text: 'A a priori plana trata cada dia como igual, com uma única chance fixa e desconhecida de sucesso; isso já supõe que o mundo é regular.'
        correct: true
      - text: 'A probabilidade não pode ser usada em eventos como nascimentos do Sol.'
        feedback: |
          Pode ser usada; a disputa é sobre as suposições iniciais, e não sobre se a matemática se aplica.
      - text: 'A regra de Bayes não é válida.'
        feedback: |
          A regra de Bayes é um teorema e está correta. O que os críticos questionam é a *a priori* que entra nela, e não a regra.
    explanation: |
      A regra de Bayes nos diz como atualizar. Ela não diz de onde vêm as probabilidades iniciais. Partindo de uma a priori que espera regularidade, a evidência confirma a regularidade; partindo de uma que espera mudança em qualquer dia, nenhum registro elevaria as chances para amanhã. Então a suposição se deslocou para a a priori, em vez de desaparecer. Os defensores respondem que as prioris estão abertas a revisão pela evidência, e que ninguém parte do nada.

  - type: mcq
    id: ibe
    title: "A melhor explicação"
    prompt: |
      Uma quarta resposta: a melhor explicação de uma longa sequência de nascimentos do Sol é uma lei estável (a Terra gira de modo constante), então podemos inferir que ela continuará girando. Qual é a objeção padrão?
    options:
      - text: 'Para julgar uma lei estável "melhor" do que "funciona até o dia 37", já confiamos que relatos simples e regulares são mais prováveis, e isso é justamente o que a indução supõe.'
        correct: true
      - text: 'Não existe explicação para os nascimentos do Sol.'
        feedback: |
          A astronomia oferece uma explicação detalhada. A objeção é sobre como classificamos explicações.
      - text: 'As explicações nunca são úteis na ciência.'
        feedback: |
          Elas são centrais para a ciência. A preocupação é sobre o que faz uma explicação ser "melhor" e se isso supõe regularidade.
    explanation: |
      Os defensores respondem que simplicidade e ajuste ao resto do que sabemos são marcas reais de uma boa explicação, e não mero hábito. Os críticos respondem que por que essas marcas apontam para a verdade é o mesmo enigma de novo.

  - type: text
    id: grue
    title: "Um enigma mais novo: grue"
    body: |
      **Nelson Goodman** (1906-1998) acrescentou uma reviravolta em 1955 (*Fact, Fiction, and Forecast*). Escolha um instante fixo $t$, digamos o ano 3000. Chame um objeto de **grue** se ele for *verde quando examinado pela primeira vez antes de $t$, e azul quando examinado depois*.

      Toda esmeralda já examinada é verde. Logo, ela também é grue, porque todas foram examinadas antes de $t$.

      Assim, a mesma evidência apoia duas generalizações: "todas as esmeraldas são verdes" e "todas as esmeraldas são grue". Depois de $t$ elas discordam: a primeira diz que uma esmeralda examinada mais tarde será verde; a segunda diz que será azul.

  - type: mcq
    id: grue-q
    title: "Qual delas a evidência favorece?"
    prompt: |
      Todas as esmeraldas examinadas até agora (antes do instante $t$) eram verdes. Tanto "todas as esmeraldas são verdes" quanto "todas as esmeraldas são grue" (verdes se examinadas antes de $t$, azuis depois) se ajustam a cada uma delas. O que se segue?
    options:
      - text: 'A evidência sozinha não consegue escolher entre elas; algo além dos dados precisa dizer por que "verde" é o padrão a ser estendido.'
        correct: true
      - text: 'A evidência favorece "verde", porque as esmeraldas verdes são mais numerosas.'
        feedback: |
          Toda esmeralda verde examinada também é grue, então as contagens são idênticas. A evidência trata as duas igualmente.
      - text: 'Nenhuma das generalizações pode ser testada.'
        feedback: |
          As duas podem ser testadas, mas só depois do instante $t$. Até lá os dados não as separam.
    explanation: |
      Sentimos que "verde" é a escolha natural porque "grue" menciona um instante. O ponto de Goodman: esse sentimento é justamente o que precisa ser explicado. Uma regra de indução ("estender o padrão") precisa dizer *quais* padrões podem ser projetados, e os dados não nos dizem.

  - type: mcq
    id: grue-reply
    title: "Grue é apenas uma palavra ruim?"
    prompt: |
      Alguns respondem que "grue" é um predicado ruim porque seu significado depende de um instante. Defina **bleen** como *azul quando examinado antes de $t$, verde depois*. Por que a resposta não é decisiva?
    options:
      - text: 'Quem fala "grue" e "bleen" pode definir "verde" como "grue antes de $t$, bleen depois": quais palavras parecem dependentes do tempo depende do vocabulário escolhido.'
        correct: true
      - text: 'O tempo não existe.'
        feedback: |
          Nada no enigma nega o tempo. O truque está apenas em como escolhemos as palavras.
      - text: 'As cores não são reais, então o enigma não tem sentido.'
        feedback: |
          Aqui cor vale por qualquer propriedade medida; o mesmo enigma funciona para massa, carga ou qualquer outra grandeza.
    explanation: |
      A resposta do próprio Goodman: os predicados que podemos projetar são os que têm um histórico de terem sido projetados ("enraizamento"). Outros dizem que espécies naturais ou leis mais simples decidem. São propostas vivas, não respostas assentadas.

  - type: mcq
    id: hume-own
    title: "O que o próprio Hume concluiu?"
    prompt: |
      Hume não disse que devemos parar de esperar o nascer do Sol. Segundo Hume, qual é a fonte da nossa expectativa?
    options:
      - text: 'Costume ou hábito: depois de muitas repetições, a mente espera o próximo, e isso é um fato sobre a natureza humana, não um resultado da razão.'
        correct: true
      - text: 'Uma prova vinda da astronomia.'
        feedback: |
          A astronomia também se apoia na indução, então não pode ser o fundamento independente.
      - text: 'Uma promessa divina de que o mundo é ordenado.'
        feedback: |
          Alguns pensadores seguem esse caminho (a ordem da natureza como dádiva de um criador), mas não era o de Hume. Para Hume, é uma observação sobre como a mente funciona.
    explanation: |
      O veredito de Hume tem dois lados: a indução não pode ser justificada pela razão, e não podemos deixar de usá-la. Alguns leem isso como ceticismo; outros, como um lembrete de que o raciocínio começa com uma confiança que não escolhemos.

  - type: mcq
    id: layers
    title: "Fato, debate ou compromisso?"
    prompt: |
      A lição separa três camadas: fato estabelecido, debate em aberto, e fé ou compromisso metafísico. Qual destas afirmações é **fato estabelecido**, e não debate nem compromisso?
    options:
      - text: 'Hume argumentou, em 1739 e em 1748, que a experiência passada não pode justificar o princípio da uniformidade sem circularidade.'
        correct: true
      - text: 'A indução é, portanto, irracional.'
        feedback: |
          Isto é um debate em aberto. O próprio Hume não disse isso, e muitos sustentam que "justificado" pode significar algo diferente de "provado por dedução".
      - text: 'O mundo é ordenado, então a indução é justificada.'
        feedback: |
          Isto é um compromisso de fé ou metafísico: afirma uma ordem que alcança amanhã e a usa para justificar a indução, mas o registro não pode mostrá-la.
    explanation: |
      O que Hume argumentou é um fato histórico. Se o argumento dele tem sucesso é debatido. Se a natureza é ordenada de um modo que alcança amanhã é, para muitos, um compromisso em que a ciência se apoia, e não um resultado que a ciência prova.

  - type: mcq
    id: resolve
    title: "De volta ao Sol"
    prompt: |
      Volte ao ponto de partida: qual é a melhor razão para esperar o Sol amanhã, agora que encontramos Hume?
    options:
      - text: 'Um registro muito grande somado a leis bem testadas o torna extremamente provável. Se isso *justifica* a expectativa, ou apenas descreve nosso hábito, é a questão em aberto, e depende de qual resposta parece convincente.'
        correct: true
      - text: 'É certo, porque o argumento contra a indução é claramente falho.'
        feedback: |
          Ninguém mostrou que ele é falho além de qualquer disputa. Várias respostas são respeitáveis; nenhuma é aceita por todos.
      - text: 'É cara ou coroa, porque Hume provou que não sabemos nada sobre o futuro.'
        feedback: |
          Hume não provou nada disso. Argumentou que a razão não pode justificar o passo; nunca sugeriu que as chances sejam iguais.
    explanation: |
      Note as duas camadas. A expectativa prática é extremamente forte, e todos agem com base nela. A questão filosófica sobre o que a fundamenta continua aberta: céticos, popperianos, defensores da justificação, bayesianos e os que a apoiam na confiança na ordem da natureza dão respostas diferentes, cada uma com algum custo.

  - type: text
    id: summary
    body: |
      **Próximo:** a ideia de refutação de Popper, o cisne negro, e onde a falsificabilidade é poderosa, mas incompleta.
