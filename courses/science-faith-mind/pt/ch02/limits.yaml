source_hash: 7f8ca22121bb
id: ch02-limits
title: "O que a ciência pode e não pode dizer"
kind: concept
own: |
  - **Três tipos de pergunta.** Perguntas *empíricas* perguntam o que é o caso e podem ser verificadas por observação ("qual é a carga do elétron?"); perguntas *normativas* perguntam o que deve ser ("mentir é errado?"); perguntas *metafísicas* perguntam sobre a natureza mais profunda do que existe ("por que há algo em vez de nada?"). Segundo a maioria dos filósofos, a ciência é a melhor ferramenta para o primeiro tipo e, no máximo, um insumo para os outros.
  - **Dois naturalismos.** O *naturalismo metodológico* é uma regra do método: {{ a ciência explica com causas naturais e testes, e deixa de lado apelos a causas sobrenaturais, sem afirmar que elas não existem }}. O *naturalismo metafísico* (filosófico) é uma afirmação sobre a realidade: {{ a natureza é tudo o que existe }}. Muitos crentes aceitam o primeiro e rejeitam o segundo; o segundo é uma visão de mundo, não um resultado do método.
  - **A lacuna de Hume.** Segundo David Hume (1711-1776, *Treatise* 3.1.1), conclusões morais parecem ser acrescentadas a uma lista de fatos sem justificação. O padrão é
  $$\text{facts only} \not\Rightarrow \text{an ought}$$
  então {{ fatos sozinhos não implicam valores: é preciso uma premissa de valor }}. Respostas: alguns filósofos aceitam a lacuna; outros constroem a ética a partir de fatos sobre o bem-estar (com um valor escondido em "bem-estar").
  - **Ciência e religião.** Stephen Jay Gould (1941-2002) propôs o *NOMA*, {{ magistérios não sobrepostos: a ciência cobre o empírico, a religião cobre o sentido e os valores }} (1997). Os críticos respondem que muitas religiões fazem afirmações factuais (sobre a história, a idade da Terra, curas), e essas podem ser examinadas. Assim, a ciência pode falar sobre afirmações religiosas *testáveis* (por exemplo, o ensaio STEP de 2006 não encontrou benefício da oração intercessória na recuperação de cirurgia cardíaca), mas não sobre se Deus existe ou sobre o que dá sentido à vida.
  - **O cientificismo** é a visão de que {{ só a ciência dá conhecimento }}. Sua melhor objeção: essa afirmação não é, ela mesma, resultado de nenhum experimento, então, segundo o seu próprio critério, não é conhecimento (autorreferência). Uma versão moderada (a ciência é nosso método mais confiável para perguntas empíricas) evita o problema.
  - **Camadas.** Que a ciência responde perguntas empíricas por meio de testes, e que Hume apontou a lacuna entre ser e dever, são fatos estabelecidos; até onde a ciência alcança a ética, o sentido e a religião é um debate em aberto; se a natureza é tudo o que existe é um compromisso.
cards:
  - type: mcq
    id: hook
    title: "Três perguntas, um laboratório?"
    prompt: |
      Três perguntas:

      **A.** Qual é a carga elétrica do elétron?

      **B.** É errado mentir para um amigo para poupar os sentimentos dele?

      **C.** Por que há algo em vez de nada?

      Antes de qualquer teoria: chute. Se déssemos à ciência verba e tempo ilimitados, para quais destas perguntas os experimentos dariam a resposta?
    options:
      - text: 'Todas as três: com tempo suficiente, a ciência responde tudo.'
        feedback: |
          Esta é a visão confiante chamada *cientificismo* (explicada logo abaixo), e algumas pessoas atentas a sustentam. Mas veja a B: mesmo que medíssemos todos os efeitos de mentir sobre cada amigo, ainda precisaríamos decidir quais efeitos importam e quanto. A lição examina se essa decisão é ela mesma uma medição.
      - text: 'Só a A: a medição resolve; a B e a C precisam de outras ferramentas.'
        correct: true
      - text: 'Nenhuma: a ciência apenas descreve, nunca resolve nada.'
        feedback: |
          Pessimista demais. A carga do elétron é conhecida com precisão extrema; um experimento a estabeleceu. A ciência resolve perguntas empíricas.
    explanation: |
      A pergunta A é **empírica**: a observação pode decidi-la. A B pergunta o que *devemos* fazer, e a C pergunta sobre a natureza mais profunda da realidade. Se a ciência tem algo a dizer sobre a B e a C é exatamente o que pessoas atentas debatem. Esta lição traça o mapa, sem dizer quem tem razão.

  - type: text
    id: kinds
    title: "Três tipos de pergunta"
    body: |
      Uma primeira classificação útil, usada por muitos filósofos:

      - Perguntas **empíricas** perguntam *o que é o caso* e, em princípio, podem ser verificadas por observação ou experimento (a carga do elétron, a idade do universo, se um remédio funciona).
      - Perguntas **normativas** perguntam *o que deve ser* (mentir é errado? o que é uma lei justa?). *Normativo* significa apenas "sobre normas, valores, deveres".
      - Perguntas **metafísicas** perguntam sobre a natureza mais profunda do que existe (por que há algo em vez de nada? existe uma mente separada do cérebro?). *Metafísica* é o estudo de como é a realidade no nível mais geral.

      Segundo a maioria dos filósofos, a ciência é excelente no primeiro tipo. Se ela pode responder aos outros dois, ou apenas alimentá-los, é o tema desta lição. Os tipos também se confundem: "quando o universo começou?" é empírica, "por que há um universo?" é metafísica.

  - type: mcq
    id: kinds-check
    title: "Qual tipo?"
    prompt: |
      Tome a pergunta "É moralmente aceitável comer animais?". Qual tipo de pergunta é o seu **núcleo**, e o que a ciência pode contribuir?
    options:
      - text: 'Normativa em seu núcleo; a ciência contribui com fatos (dor animal, saúde, meio ambiente) que pesam na questão.'
        correct: true
      - text: 'Empírica: um estudo grande o bastante sobre animais a resolveria.'
        feedback: |
          Um estudo pode dizer o que os animais sentem, e isso é empírico e relevante. Mas "então quanto a dor deles deve pesar contra o nosso paladar?" pergunta o que *deve* pesar, e uma medição não fornece isso.
      - text: 'Metafísica: depende de como a realidade é em última instância.'
        feedback: |
          Algumas visões ligam a ética à metafísica (por exemplo, uma religião em que almas passam de um corpo a outro). Mas a pergunta, tal como feita, é sobre valores, então é normativa em seu núcleo.
    explanation: |
      O quadro usual: a ciência fornece **insumos** (fatos) para uma pergunta normativa, não o veredito. Se ela poderia fornecer o veredito é o debate sobre ser e dever algumas cartas abaixo.

  - type: text
    id: naturalism
    title: "Dois naturalismos"
    body: |
      *Naturalismo* é a postura de que a natureza é o campo da explicação. Ele vem em duas versões muito diferentes, e confundi-las gera muitas discussões.

      **Naturalismo metodológico** (uma regra do método): ao fazer ciência, explique usando causas naturais, leis e testes, e não coloque "um agente sobrenatural fez isso" numa explicação. Um defensor, como muitos cientistas que são crentes, diz: "Isto é uma regra do jogo, porque um apelo sobrenatural não pode ser testado nem prever nada. Não diz nada sobre se Deus existe."

      **Naturalismo metafísico** (ou *filosófico*), uma afirmação sobre a realidade: a natureza, o mundo físico e suas leis, é tudo o que existe. Um defensor diz: "Tudo o que já encontramos tem uma explicação natural, então concluo que nada mais existe."

      A melhor objeção do crente à segunda versão: isso é uma visão de mundo, não um resultado experimental, pois o método não consegue encontrar o que lhe foi dito para não procurar. A melhor resposta do naturalista: o histórico de explicações naturais é, ele mesmo, a evidência. As duas posições são levadas a sério na literatura acadêmica.

  - type: mcq
    id: naturalism-check
    title: "Qual naturalismo?"
    prompt: |
      Uma pesquisadora de câncer explica um tumor apenas por células, genes e química no seu laboratório, e aos domingos reza na sua igreja. Um colega diz: "O trabalho dela é ciência, mas ela é inconsistente." Qual resposta é justa?
    options:
      - text: 'Ela é consistente: sua prática de laboratório segue o naturalismo metodológico, que não faz afirmação alguma sobre o que existe fora do método.'
        correct: true
      - text: 'Ele tem razão: usar explicações naturais o compromete com o naturalismo metafísico.'
        feedback: |
          Isso é o deslizamento do método para a visão de mundo. Uma regra de método ("explique naturalmente, teste") não diz, por si só, que nada mais existe, assim como um detetive que trabalha só com pistas físicas não declarou que não existem motivos.
      - text: 'Ela é inconsistente só se rezar pelos pacientes com câncer.'
        feedback: |
          Rezar pelos pacientes é outra questão; é um ato religioso, e a lição vai examinar o que a ciência pode dizer sobre a *afirmação* de que a oração cura. Não entra em choque, por si só, com o uso de métodos naturais no laboratório.
    explanation: |
      Misturar os dois é um deslize comum, nos dois sentidos: alguns ateus afirmam que a ciência prova o naturalismo metafísico, e alguns crentes afirmam que o naturalismo metodológico é ateísmo disfarçado. Cada um lê o método além do que ele diz.

  - type: text
    id: noma
    title: "O NOMA de Gould, e uma crítica"
    body: |
      Stephen Jay Gould (1941-2002), paleontólogo, argumentou em 1997 (e no livro *Rocks of Ages*, 1999) que a ciência e a religião têm cada uma um *magistério*, um domínio de autoridade para ensinar, e que os dois **não se sobrepõem**: este é o **NOMA**, "magistérios não sobrepostos".

      - **Ciência**: o domínio empírico, do que o universo é feito e como funciona.
      - **Religião**: as questões de sentido último e valor moral.

      O apelo: a paz entre dois campos poderosos. A crítica padrão (feita tanto por crentes quanto por não crentes): *as religiões muitas vezes fazem afirmações factuais*, como um evento da história, a idade da Terra, uma cura, uma vida após a morte. Se essas afirmações fazem parte da religião, os magistérios se sobrepõem, e a ciência e a história podem dizer algo sobre elas. Os defensores respondem que, em muitas tradições, essas afirmações pertencem à parte de "sentido" da religião, muitas vezes lida de modo simbólico.

  - type: mcq
    id: noma-check
    title: "O NOMA se sustenta?"
    prompt: |
      Uma tradição ensina que a Terra tem 6.000 anos, como fato literal. Segundo os críticos do NOMA, o que se segue?
    options:
      - text: 'A afirmação é sobre o mundo físico, então cai no domínio empírico, e a geologia pode testá-la. O NOMA falha para afirmações desse tipo.'
        correct: true
      - text: 'A ciência deve ficar calada, porque a religião tem autoridade sobre seus próprios ensinamentos.'
        feedback: |
          Isso é um NOMA mais forte que o de Gould. Os magistérios dele são *não sobrepostos* porque perguntam coisas diferentes; quando uma religião afirma um fato físico, ela entrou no domínio empírico.
      - text: 'A afirmação não tem sentido, já que todas as afirmações religiosas não têm sentido.'
        feedback: |
          Não é assim: uma idade literal para a Terra é uma afirmação perfeitamente clara e testável (e os testes dizem que ela tem cerca de 4,5 bilhões de anos). Muitas pessoas religiosas, nesta e em outras tradições, leem os mesmos textos como não destinados a ensinar geologia; essa é a leitura compatível com o NOMA.
    explanation: |
      Duas visões lado a lado: **(1)** a leitura do NOMA, em que o texto ensina sentido e não geologia; **(2)** a leitura literal, que faz uma afirmação testável e então perde para a evidência. Qual leitura é certa para um texto dado é uma questão para os próprios estudiosos daquela tradição, não para esta lição.

  - type: text
    id: hume
    title: "A lacuna ser-dever de Hume"
    image:
      src: img/hume.webp
      alt: "Retrato pintado de David Hume, de casaco marrom e boné vermelho, por Allan Ramsay"
      caption: "David Hume (1711-1776), aqui no retrato de Allan Ramsay, publicou seu *Treatise of Human Nature* (*Tratado da Natureza Humana*) em 1739, aos 28 anos."
      credit: "Allan Ramsay, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Allan_Ramsay_-_David_Hume,_1711_-_1776._Historian_and_philosopher_-_PG_3521_-_National_Galleries_of_Scotland.jpg"
    body: |
      Fatos sozinhos podem alguma vez dar um valor? David Hume (1711-1776) notou, em seu *Tratado da Natureza Humana* (1739, Livro 3, Parte 1, Seção 1), que os autores de moral costumam começar com afirmações sobre o que *é* (Deus existe, as pessoas fazem isto) e depois, sem aviso, passam para o que *deveria ser*. Ele pediu uma explicação de como o novo "deve" decorre do velho "é".

      O padrão, em lógica simples:

      - P1. Mentir causa sofrimento às pessoas. (*fato*)
      - P2. Mentir é comum nos negócios. (*fato*)
      - C. Portanto, não devemos mentir. (*valor*)

      A conclusão acrescenta algo novo, um valor, que não está nas premissas. Acrescente a premissa "não devemos causar sofrimento às pessoas" e o argumento se torna válido, mas essa premissa é ela mesma um "deve". A lacuna: **fatos sozinhos não implicam valores**. É preciso uma premissa de valor. Alguns filósofos aceitam a lacuna; outros tentam fechá-la com fatos sobre o bem-estar, embora um crítico responda que "o bem-estar importa" é, de novo, um valor.

  - type: mcq
    id: hume-check
    title: "Encontre a premissa escondida"
    prompt: |
      Um argumento: "Estudos mostram que o exercício regular prolonga a vida. Portanto, as pessoas devem se exercitar." Segundo a lacuna de Hume, o que falta para que o argumento seja válido?
    options:
      - text: 'Uma premissa de valor, como "as pessoas devem fazer o que prolonga a sua vida".'
        correct: true
      - text: 'Outro estudo mostrando o mesmo efeito, para tornar os fatos certos.'
        feedback: |
          Mais fatos, por mais certos que sejam, continuam sendo fatos: fatos sozinhos não implicam um dever. A lacuna diz respeito ao tipo, não a quantos fatos temos.
      - text: 'Nada: a conclusão é um fato sobre saúde, não um valor.'
        feedback: |
          "As pessoas devem se exercitar" é uma afirmação de dever. Até "o exercício faz bem a você" esconde o valor de que a vida longa ou a saúde é o que importa (alguém pode colocar o prazer de uma vida mais curta acima disso).
    explanation: |
      Isso não torna a ética arbitrária. Diz que a *premissa de valor* precisa ser defendida por si mesma. Onde pessoas atentas se separam: se essa premissa é um fato sobre a natureza humana, uma decisão compartilhada, um mandamento divino ou outra coisa. Visões diferentes, a mesma lacuna.

  - type: mcq
    id: religious-claims
    title: "O que a ciência pode dizer sobre afirmações religiosas?"
    prompt: |
      Qual destas afirmações **pode** ser examinada por métodos empíricos? Selecione todas que se aplicam.
    multiple: true
    options:
      - text: 'Orar por estranhos internados num hospital acelera a recuperação de cirurgia cardíaca (testado no ensaio STEP de 2006, com 1.802 pacientes, que não encontrou benefício).'
        correct: true
      - text: 'O universo tem cerca de 13,8 bilhões de anos (13,787 ± 0,020 bilhões de anos, pelo satélite Planck, no modelo cosmológico padrão).'
        correct: true
      - text: 'Um evento histórico específico, como a existência de certa cidade, aconteceu (arqueologia e textos podem ter relação com isso).'
        correct: true
      - text: 'A vida tem um propósito dado por Deus.'
        feedback: |
          Segundo os crentes, isso é verdadeiro; segundo os não crentes, falso; e nenhum experimento é conhecido que os distinguiria. É uma afirmação de sentido e metafísica, fora do método empírico.
      - text: 'É um dever moral ajudar os pobres.'
        feedback: |
          Normativa: fatos sobre a pobreza pesam em como ajudar, mas o "dever" é uma premissa de valor (a lacuna de Hume).
    explanation: |
      A ciência fala sobre afirmações religiosas **testáveis** (curas, idades, história), e os resultados podem surpreender os dois lados. Ela não resolve, por si só, o propósito último nem o dever moral. Note que o ensaio STEP testou uma afirmação estreita (oração intercessória, por estranhos, num ambiente hospitalar); muitos crentes dizem que a oração nunca foi destinada a funcionar como tratamento, uma segunda visão sobre para que serve a oração.

  - type: mcq
    id: method-limits
    title: "Os limites do próprio método"
    prompt: |
      Por que nenhum experimento, nem em princípio, pode resolver todas as questões sobre o primeiríssimo momento do universo? Selecione todas que se aplicam.
    multiple: true
    options:
      - text: 'Não podemos repetir o evento nem variar suas condições, então inferimos a partir da evidência presente.'
        correct: true
      - text: 'Algumas condições podem estar além do que qualquer instrumento consegue observar, então os modelos delas permanecem não confirmados.'
        correct: true
      - text: 'Seria antiético realizar o experimento.'
        feedback: |
          A ética limita muitos experimentos com pessoas (não podemos designar pessoas para fumar por décadas), mas não é a razão pela qual não podemos testar o início do universo. Mantenha os dois tipos de limite separados: prático ou ético, versus de princípio.
      - text: 'Como o início é um evento sobrenatural, a ciência proíbe estudá-lo.'
        feedback: |
          A ciência não proíbe o estudo; cosmólogos modelam ativamente o universo primitivo. O limite do método é de evidência, não uma proibição.
    explanation: |
      Vale separar três tipos de limite: **evidência** (coisas não repetíveis ou inobserváveis são inferidas, não testadas diretamente), **ética** (não fazemos alguns experimentos com pessoas) e **alcance** (métodos empíricos não resolvem valores nem sentido último). Os dois primeiros às vezes podem ser amenizados por instrumentos e desenhos melhores; o terceiro é o que está em jogo no debate sobre o cientificismo.

  - type: text
    id: scientism
    title: "Cientificismo, e sua objeção autorreferencial"
    body: |
      **Cientificismo** é a visão de que a ciência é a *única* fonte de conhecimento real. Seus defensores mais fortes dizem: "A ciência tem o melhor histórico entre todos os métodos para descobrir como o mundo funciona; afirmações que escapam a seus testes costumam ser wishful thinking ou não testáveis. Só acredito no que pode ser testado."

      A melhor objeção é **autorreferencial** (a afirmação se aplica a si mesma): a frase "só o que a ciência pode testar é conhecimento" não é um resultado científico, e nenhum experimento poderia testá-la. Pelo seu próprio critério, ela não seria conhecimento.

      Respostas possíveis: uma forma **moderada** ("a ciência é nosso método mais confiável para perguntas *empíricas*, e devemos ser cautelosos com afirmações que não podem ser testadas") evita o problema, e não diz que outros campos não dão conhecimento. Muitos estudiosos separam essa visão moderada (amplamente aceita) da forte (amplamente debatida).

  - type: mcq
    id: scientism-check
    title: "Ela se autodestrói?"
    prompt: |
      O cientificismo forte diz: "Só afirmações confirmadas por métodos científicos contam como conhecimento." Segundo a objeção autorreferencial, qual é o problema?
    options:
      - text: 'A própria afirmação não é confirmada por métodos científicos, então, pela sua própria regra, não é conhecimento.'
        correct: true
      - text: 'A ciência cometeu erros no passado, então não podemos confiar nela.'
        feedback: |
          Essa é outra objeção (falibilidade), e vale para todo método. A objeção autorreferencial diz respeito a se a tese cumpre o próprio padrão.
      - text: 'Os cientistas costumam ser religiosos, então o cientificismo é falso.'
        feedback: |
          Quantos cientistas têm uma visão religiosa não diz nada sobre a tese ser consistente consigo mesma. É um fato sobre pessoas, não um argumento contra a tese.
    explanation: |
      Uma leitura justa: esta objeção refuta a tese *forte*, não a afirmação de que a ciência é um método confiável. Um defensor pode responder que a tese é uma *proposta* adotada porque funciona, e um crítico pode responder que adotá-la exige razões além de "funciona" para as perguntas empíricas em que ela se baseia.

  - type: mcq
    id: lenses
    title: "Qual lente lidera?"
    prompt: |
      Associe cada pergunta à lente que lidera nela (ciência, filosofia, teologia), admitindo que as outras podem contribuir. Selecione as afirmações que são **justas**.
    multiple: true
    options:
      - text: 'Quantos anos tem a Terra? A ciência lidera (datação radiométrica, geologia).'
        correct: true
      - text: 'A mentira é alguma vez justificada? A filosofia lidera (teorias éticas, argumentos), com a ciência fornecendo fatos sobre os efeitos.'
        correct: true
      - text: 'O que uma certa tradição ensina sobre a vida após a morte? A teologia lidera (os textos da tradição e seus intérpretes).'
        correct: true
      - text: 'Por que há algo em vez de nada? A ciência lidera, já que a cosmologia estuda o início.'
        feedback: |
          A cosmologia estuda como o universo evoluiu a partir de um estado inicial; "por que há qualquer coisa" pergunta por que as leis e a matéria existem em primeiro lugar. Muitos filósofos chamam isso de metafísica. Alguns físicos argumentam que a física pode dizer mais, e outros negam; é um debate em aberto, não um resultado de laboratório.
      - text: 'Qual religião é verdadeira? A ciência lidera, contando milagres.'
        feedback: |
          A ciência pode testar afirmações específicas e testáveis (uma cura, uma idade), mas "qual religião é verdadeira" reúne história, filosofia e compromissos de fé; nenhuma medição única a decide.
    explanation: |
      As lentes são ferramentas, não rivais: cada uma é melhor em algumas perguntas. Os desacordos entre as pessoas geralmente remontam a uma **premissa**, um **valor** ou um **tipo de evidência** que elas aceitam. Nomear qual deles é muitas vezes o passo mais útil.

  - type: mcq
    id: traps
    title: "Quais afirmações estão erradas?"
    prompt: |
      Selecione as afirmações que **confundem** o que o método pode fazer. (Várias podem se aplicar.)
    multiple: true
    options:
      - text: '"A ciência mostrou que nada sobrenatural existe."'
        correct: true
        feedback: |
          O naturalismo metodológico deixa de lado afirmações sobrenaturais; pelas suas próprias regras, ele não pode concluir que elas são falsas. *Afirmações* sobrenaturais específicas, com efeitos testáveis, podem ser testadas.
      - text: '"A religião não diz nada verdadeiro sobre o mundo físico, por definição."'
        correct: true
        feedback: |
          Muitas tradições fazem afirmações factuais (sobre história, curas, a origem do mundo). Se alguma delas é verdadeira é outra questão, mas não podem ser excluídas por definição (a crítica ao NOMA).
      - text: '"O laboratório encontrou a causa da dor, então sabemos o que devemos fazer a respeito."'
        correct: true
        feedback: |
          Fatos sobre causas não dão o dever; é preciso uma premissa de valor (aliviar a dor? a que custo?).
      - text: '"A ciência não pode testar se a oração tem efeitos mensuráveis sobre a recuperação."'
        feedback: |
          Pode: é isso que ensaios como o STEP fizeram. Eles testaram uma afirmação estreita e mensurável.
    explanation: |
      Três deslizes numa só carta: ler o método como visão de mundo, definir a religião para o silêncio e passar do ser para o dever. A quarta afirmação é o deslize oposto, pensar que a ciência não pode testar nada religioso. Os dois sentidos ocorrem na prática.

  - type: mcq
    id: layers
    title: "Camadas"
    prompt: |
      Classifique: "A ciência, por seus próprios métodos, acabará explicando tudo, inclusive valores e sentido." Em qual camada isso está?
    options:
      - text: 'Um compromisso de fé ou metafísico (camada 3): o histórico é evidência, mas a afirmação vai além dele.'
        correct: true
      - text: 'Fato estabelecido (camada 1): a ciência já explicou a maior parte das coisas.'
        feedback: |
          "Já explicou uma grande parte do mundo empírico" é estabelecido; "vai explicar tudo, inclusive valores" é uma previsão sobre questões cujo tipo é exatamente o que está em disputa.
      - text: 'Consenso acadêmico assentado (camada 2): os filósofos concordam com isso.'
        feedback: |
          Os filósofos não concordam: a lacuna ser-dever, a objeção autorreferencial e o NOMA são debates em aberto.
    explanation: |
      A mesma frase pode ser sustentada com razões (o sucesso da ciência) e ainda assim ser um compromisso. Chamá-la assim não é um insulto; apenas mantém as camadas separadas. Um crente que diz "Deus existe" está, igualmente, afirmando um compromisso, apoiado nas razões que ele considera convincentes.

  - type: text
    id: summary
    body: |
      **Próximo:** a rodada de armadilhas e a recordação rápida deste nível, depois o mapa de conteúdo. Em seguida, o curso pergunta do que a realidade é feita (matéria, mente, ou ambas), levando uma ferramenta daqui: perguntar que tipo de pergunta cada afirmação é, e que tipo de evidência ela precisa.
