title: "Ciência, Fé e Mente"
overview:
  text: >-
    O que é real? Como sabemos qualquer coisa? Existe Deus? O que é uma mente, e o que acontece nela durante um sonho, uma oração ou uma viagem psicodélica? Essas perguntas são mais antigas que a ciência e ainda importam para quase todo mundo. Este curso as explora com cuidado e sem tomar partido: como a ciência realmente funciona, os melhores argumentos a favor e contra Deus, as grandes tradições religiosas e seus textos, e as filosofias pelas quais as pessoas vivem. Cada posição é apresentada de forma justa e depois posta à prova com perguntas, para que você termine capaz de pensar com clareza sobre as grandes questões e de conversar sobre elas com quem as vê de outro modo.
  sources:
    - { who: "Textos primários e obras de referência padrão", what: "Russell, Popper, Kuhn, Hume, Chalmers, James, Wittgenstein, Rawls, Nagel e muitos outros, além da Stanford Encyclopedia of Philosophy e da Internet Encyclopedia of Philosophy. Cada nível lista suas próprias referências." }

levels:
  ch01: { title: "As Grandes Perguntas", blurb: "Um passeio leve: o que é real, como sabemos, existe Deus, o que é uma mente? Primeiro chute, sem teoria nenhuma, e veja quantas maneiras há de perguntar." }
  ch02: { title: "Como a Ciência Sabe", blurb: "Indução, falsificação, paradigmas e atualização bayesiana: o que torna uma afirmação científica, como a evidência sustenta uma teoria e onde a ciência para." }
  ch03: { title: "Visões da Realidade", blurb: "Materialismo, idealismo, dualismo, panpsiquismo e realismo estrutural, e o que a mecânica quântica força e não força sobre nós." }
  ch04: { title: "Matemática e Por Que Ela Funciona", blurb: "O enigma de Wigner: por que a matemática descreve tão bem o mundo? Platonismo, formalismo, Gödel e a ideia de que a realidade é matemática." }
  ch05: { title: "Origens e Ajuste Fino", blurb: "O universo teve um começo? Por que estas leis e constantes? Cosmologia, princípio antrópico, multiverso e o problema da medida." }
  ch06: { title: "Argumentos a Favor de Deus", blurb: "Os argumentos cosmológico, kalam, ontológico, do desígnio e moral, cada um construído com suas premissas à mostra e posto à prova contra sua melhor objeção." }
  ch07: { title: "Argumentos Contra Deus", blurb: "O problema do mal, o ocultamento divino, a parcimônia e a aposta de Pascal: os casos mais fortes contra a crença, e as respostas dos crentes." }
  exam-partial1: { eyebrow: "Prova parcial", title: "Prova Parcial 1: Conhecer, Realidade, Origens e Deus", blurb: "Uma prova cronometrada sobre os Níveis 2 a 7: como a ciência sabe, visões da realidade, matemática, origens e os argumentos a favor e contra Deus. Sem feedback até você enviar; depois, sua nota e uma revisão de cada resposta." }
  ch08: { title: "A Natureza de Deus", blurb: "O que as tradições querem dizer com Deus? Teísmo clássico, a Trindade e o *tawhid*, teologia do processo, panteísmo, panenteísmo e o Deus de Einstein." }
  ch09: { title: "Ciência e Religião", blurb: "Conflito, independência, diálogo, integração: quatro modelos e os casos históricos (Galileu, Darwin) que os põem à prova." }
  ch10: { title: "Consciência", blurb: "O problema difícil, a ciência do cérebro, o livre-arbítrio e o que as religiões dizem sobre a alma." }
  ch11: { title: "Estados Alterados da Mente", blurb: "Meditação, psicodélicos, transe, mediunidade e parapsicologia: o que as melhores evidências dizem e como examinar afirmações extraordinárias." }
  ch12: { title: "Experiência Religiosa e Misticismo", blurb: "Uma experiência profunda de Deus, de unidade ou de sentido é evidência de alguma coisa? James, Otto, os místicos e as melhores críticas." }
  ch13: { title: "Por Que os Humanos Acreditam", blurb: "Evolução, cognição e cultura da religião: detecção de agência, ritual, seleção de grupo e o que explicar uma crença faz, ou não faz, com a sua verdade." }
  exam-partial2: { eyebrow: "Prova parcial", title: "Prova Parcial 2: Natureza de Deus, Ciência, Mente e Crença", blurb: "Uma prova cronometrada sobre os Níveis 8 a 13: a natureza de Deus, ciência e religião, consciência, estados alterados, experiência e crença. Sem feedback até você enviar; depois, sua nota e uma revisão de cada resposta." }
  ch14: { title: "Judaísmo e a Torá", blurb: "A Bíblia Hebraica e a tradição judaica: como a Torá foi feita, o que a história e a arqueologia dizem, como o Judaísmo rabínico a leu e os pensadores judeus que discutiram com Deus e entre si." }
  ch15: { title: "Cristianismo e os Evangelhos", blurb: "O mundo judaico de Jesus, os Evangelhos e o Jesus histórico, Paulo, o cânon, os concílios e os ramos do Cristianismo, como contam os estudiosos e como contam os crentes." }
  ch16: { title: "Islã e o Alcorão", blurb: "A Arábia antes do Islã, Maomé, o Alcorão e sua transmissão, *hadith*, direito, teologia, filosofia e sufismo, como contam os estudiosos e como contam os muçulmanos." }
  ch17: { title: "Pensamento Hindu", blurb: "Vedas, Upanixades, as muitas escolas e a questão do uno e do múltiplo: *Brahman*, *atman*, carma, renascimento e libertação." }
  ch18: { title: "Pensamento Budista", blurb: "O diagnóstico do Buda, o não-eu, a origem dependente, a vacuidade, o Zen e o diálogo do Budismo com a ciência." }
  ch19: { title: "Outras Tradições pelo Mundo", blurb: "Confucionismo, Taoísmo, Xintoísmo, Jainismo, Sikhismo, Zoroastrismo, tradições indígenas e africanas e movimentos mais novos: quanto da humanidade responde a essas perguntas de outro modo, mais uma vez." }
  exam-partial3: { eyebrow: "Prova parcial", title: "Prova Parcial 3: Textos e Tradições", blurb: "Uma prova cronometrada sobre os Níveis 14 a 19: Judaísmo, Cristianismo, Islã, pensamento hindu e budista e outras tradições pelo mundo. Sem feedback até você enviar; depois, sua nota e uma revisão de cada resposta." }
  ch20: { title: "Espiritismo", blurb: "A doutrina de Allan Kardec, seu método mediúnico, seu lugar no Brasil e como ela pode ser examinada com as ferramentas da história, da ciência e da filosofia." }
  ch21: { title: "Alienígenas e a Perspectiva Cósmica", blurb: "Quão provável é haver outra vida, o que isso significaria para a religião e o que realmente sabemos sobre fenômenos não identificados?" }
  ch22: { title: "Linguagem, Significado e Linguagem Religiosa", blurb: "Como palavras podem significar algo sobre Deus, a alma ou o sagrado? Significado e uso, verificação, analogia, metáfora, mito, fala ritual, interpretação e tradução, cada um segundo seus pensadores." }
  ch23: { title: "Fé, Razão e Conhecimento", blurb: "Acreditar sem prova é irracional? Evidencialismo, epistemologia reformada, pragmatismo, dúvida e como sustentar convicções com responsabilidade." }
  ch24: { title: "Filosofias de Vida", blurb: "Niilismo, absurdismo, existencialismo, essencialismo, estoicismo, epicurismo, humanismo e mais: como os pensadores responderam ao que fazer com uma vida, cada um a partir de suas próprias premissas." }
  ch25: { title: "Sentido, Ética e Morte", blurb: "O que torna uma vida significativa, de onde vem a ética e como tradições e filósofos encaram a morte." }
  exam-final: { eyebrow: "Prova final", title: "Prova Final: Espiritismo, o Cosmos e Viver com as Perguntas", blurb: "Uma prova cronometrada sobre os Níveis 20 a 25: Espiritismo, alienígenas e a perspectiva cósmica, linguagem religiosa, fé e conhecimento, filosofias de vida, sentido, ética e morte. Sem feedback até você enviar; depois, sua nota e uma revisão de cada resposta." }

lessons:
  ch01-bubble: { title: "Fora da Nossa Bolha", summary: "A maior parte do que acreditamos vem de onde nascemos e de quem conhecemos; o que é preciso para fazer uma pergunta com honestidade." }
  ch01-lenses: { title: "Quatro Lentes para uma Pergunta", summary: "Por que existe algo em vez de nada? Vista pela ciência, pela filosofia, pela teologia e pela experiência vivida." }
  ch01-reasons: { title: "O Que Conta como Boa Razão?", summary: "Evidência, argumento, testemunho, experiência e confiança: os tipos de razão que usamos e onde cada um pode falhar." }
  ch01-tour: { title: "Um Enigma para Cada Nível", summary: "Um enigma de adivinhação para cada nível seguinte, e uma tabela ligando cada enigma ao nível que o abre." }
  ch01-traps: { title: "Armadilhas", summary: "Perguntas rápidas, cada uma baseada em um equívoco comum." }
  ch01-map: { title: "Mapa de Conteúdo", summary: "Reconstrua o mapa de conceitos do nível caixa por caixa, entre iscas parecidas." }
  ch01-review: { title: "Revisão do Nível" }
  ch01-challenge: { title: "Desafio do Nível: Classifique as Perguntas (1)", summary: "Problemas 1-3: classificar perguntas reais pelo tipo de resposta, escolher a lente ou as lentes, dividir uma pergunta composta. (Aprofundamento.)" }
  ch01-challenge-2: { title: "Desafio do Nível: Classifique as Perguntas (2)", summary: "Problemas 4-5: julgar razões dentro de um debate mais longo e depois desmontar você mesmo uma pergunta final. (Aprofundamento.)" }

  ch02-induction: { title: "Por Que o Sol Nascerá Amanhã", summary: "O problema da indução de Hume: nenhum argumento do passado para o futuro evita a circularidade, e o que fazemos a respeito." }
  ch02-falsification: { title: "Popper e o Cisne Negro", summary: "A falseabilidade como teste de uma teoria, e por que ela é ao mesmo tempo poderosa e incompleta." }
  ch02-paradigms: { title: "Kuhn: Quando a Ciência Muda de Ideia", summary: "Ciência normal, anomalias e revoluções; o progresso é cumulativo ou uma mudança de visão de mundo?" }
  ch02-bayes: { title: "Evidência como Atualização da Crença", summary: "Probabilidade a priori, verossimilhança e probabilidade a posteriori em um modelo simples; como a mesma evidência move probabilidades a priori diferentes." }
  ch02-bayes-proof: { title: "Prova guiada: A Evidência Favorece a Teoria que a Previu", summary: "Prova guiada: deduza a lei da razão de verossimilhanças, com as objeções da evidência antiga e da dependência da probabilidade a priori." }
  ch02-underdetermination: { title: "Quando os Dados Não Decidem", summary: "Duhem e Quine: muitas teorias se ajustam aos mesmos dados; o que escolhe uma (simplicidade, fertilidade, gosto?)." }
  ch02-realism: { title: "A Ciência Descreve a Realidade?", summary: "Realismo, instrumentalismo e a indução pessimista; o que uma teoria bem-sucedida nos diz." }
  ch02-pseudo: { title: "Ciência, Pseudociência e Afirmações Marginais", summary: "Astrologia, homeopatia e casos parecidos: marcas de um campo que toma emprestada a aparência da ciência sem seus controles, e por que a linha é borrada." }
  ch02-limits: { title: "O Que a Ciência Pode e Não Pode Dizer", summary: "Naturalismo metodológico versus metafísico, e quais perguntas ficam fora do método." }
  ch02-traps: { title: "Armadilhas", summary: "Perguntas rápidas, cada uma baseada em um equívoco comum sobre este nível." }
  ch02-intuition: { title: "Recordação Rápida", summary: "Mnemônicos, distinções e um pequeno exemplo resolvido para as ideias principais do nível." }
  ch02-map: { title: "Mapa de Conteúdo", summary: "Reconstrua o mapa de conceitos do nível caixa por caixa, entre iscas parecidas." }
  ch02-review: { title: "Revisão do Nível" }
  ch02-challenge: { title: "Desafio do Nível: Isso É Ciência? (1)", summary: "Problemas 1-3: julgar a alegação de um remédio natural, uma teoria salva por um remendo e curvas rivais pelos mesmos dados. (Aprofundamento.)" }
  ch02-challenge-2: { title: "Desafio do Nível: Isso É Ciência? (2)", summary: "Problemas 4-5: o que o sucesso de uma teoria mostra sobre a realidade, e onde ficam os limites da ciência. (Aprofundamento.)" }

  ch03-materialism: { title: "A Matéria É Tudo o Que Existe?", summary: "O fisicalismo enunciado com cuidado, seus sucessos, e o que “físico” significa quando a física não para de mudar." }
  ch03-idealism: { title: "A Mente Primeiro: Idealismo", summary: "Berkeley, Kant e os idealismos modernos: o melhor argumento de que a matéria não é fundamental." }
  ch03-dualism: { title: "Dois Tipos de Substância: Dualismo", summary: "Descartes, o problema da interação e o que um dualista moderno responde." }
  ch03-panpsychism: { title: "Mente em Tudo? Panpsiquismo e Monismo Neutro", summary: "Russell, Espinosa e a ideia de que a experiência é básica; seu problema da combinação." }
  ch03-emergence: { title: "Emergência e Redução", summary: "O todo pode ter propriedades que as partes não têm? Emergência fraca e forte, com um exemplo resolvido." }
  ch03-quantum: { title: "O Que a Mecânica Quântica Diz e Não Diz", summary: "Copenhague, muitos mundos, onda piloto, QBismo: no que concordam, onde diferem e o que o problema da medição deixa em aberto." }
  ch03-bell: { title: "Problema guiado: A Desigualdade de Bell com Números", summary: "Problema guiado (um caso, o par singleto, com seus próprios números): calcule o limite CHSH, 2 contra 2 raiz de 2, e veja o que isso descarta e o que não descarta." }
  ch03-simulation: { title: "Estamos em uma Simulação?", summary: "O argumento da simulação como probabilidade, suas suposições e sua relação com ideias antigas sobre a realidade." }
  ch03-structure: { title: "Realismo Estrutural: O Que Sobrevive à Mudança de Teoria?", summary: "Se os objetos mudam entre teorias mas as equações sobrevivem, a estrutura é o que é real?" }
  ch03-traps: { title: "Armadilhas", summary: "Perguntas rápidas, cada uma baseada em um equívoco comum sobre este nível." }
  ch03-intuition: { title: "Recordação Rápida", summary: "Mnemônicos, distinções e um pequeno exemplo resolvido para as ideias principais do nível." }
  ch03-map: { title: "Mapa de Conteúdo", summary: "Reconstrua o mapa de conceitos do nível caixa por caixa, entre iscas parecidas." }
  ch03-review: { title: "Revisão do Nível" }
  ch03-challenge: { title: "Desafio do Nível: Em Que Mundo Estamos? (1)", summary: "Problemas 1-3: pôr à prova as visões da realidade contra o fechamento causal, um teste de Bell quântico, e simulação e estrutura, com números. (Aprofundamento.)" }
  ch03-challenge-2: { title: "Desafio do Nível: Em Que Mundo Estamos? (2)", summary: "Problemas 4-5: os enigmas restantes das visões da realidade, e onde pessoas ponderadas se separam. (Aprofundamento.)" }

  ch04-wigner: { title: "A Eficácia Irrazoável", summary: "Exemplos em que uma matemática inventada por um motivo previu algo novo na física; por que isso é estranho." }
  ch04-platonism: { title: "Platonismo, Formalismo, Intuicionismo", summary: "Três respostas a “o que é um número?”, cada uma com seu melhor argumento e sua pergunta mais difícil." }
  ch04-diagonal: { title: "Prova guiada: Alguns Infinitos São Maiores", summary: "Prova guiada: o argumento diagonal de Cantor de que os reais não podem ser listados, e o que isso diz sobre prova e verdade." }
  ch04-godel: { title: "Gödel e os Limites da Prova", summary: "O que os teoremas da incompletude dizem de fato, e as muitas coisas que dizem erroneamente que eles provam." }
  ch04-explaining: { title: "Explicações da Eficácia", summary: "Evolução, viés de seleção, compartilhamento de estrutura e desígnio: as principais tentativas de dissolver ou explicar o enigma de Wigner." }
  ch04-universe: { title: "A Realidade É Matemática?", summary: "Pitágoras, o livro da natureza de Galileu e Tegmark: o universo matemático e seus críticos." }
  ch04-traps: { title: "Armadilhas", summary: "Perguntas rápidas, cada uma baseada em um equívoco comum sobre este nível." }
  ch04-intuition: { title: "Recordação Rápida", summary: "Mnemônicos, distinções e um pequeno exemplo resolvido para as ideias principais do nível." }
  ch04-map: { title: "Mapa de Conteúdo", summary: "Reconstrua o mapa de conceitos do nível caixa por caixa, entre iscas parecidas." }
  ch04-review: { title: "Revisão do Nível" }
  ch04-challenge: { title: "Desafio do Nível: Inventada ou Descoberta? (1)", summary: "Problemas 1-3: o teste da Lua como caso de seleção, uma lista pelo argumento diagonal, e qual teorema de Gödel se aplica, com as escolas discordando. (Aprofundamento.)" }
  ch04-challenge-2: { title: "Desafio do Nível: Inventada ou Descoberta? (2)", summary: "Problemas 4-5: duas civilizações chegando a um mesmo teorema (inventado ou descoberto?), e depois a Hipótese do Universo Matemático posta à prova contra suas objeções e rivais. (Aprofundamento.)" }

  ch05-bigbang: { title: "O Universo Tem uma História", summary: "A expansão, a radiação de fundo e Lemaître: o que a evidência diz sobre o universo primitivo e o que ela não diz." }
  ch05-beginning: { title: "O Tempo Teve Começo?", summary: "Teoremas de singularidade, cosmologia quântica, inflação eterna e modelos cíclicos: o que “começo” pode significar." }
  ch05-something: { title: "Por Que Algo em Vez de Nada?", summary: "A pergunta de Leibniz, o “nada” na física versus na filosofia, e a existência necessária versus contingente." }
  ch05-entropy: { title: "Por Que o Universo Primitivo Era Tão Ordenado?", summary: "A seta do tempo e o início de baixa entropia: o enigma, com a ordem de grandeza das chances." }
  ch05-constants: { title: "Ajuste Fino: Os Números", summary: "Quais constantes são sensíveis, em quanto, e quais afirmações são bem estabelecidas e quais são disputadas." }
  ch05-anthropic: { title: "O Princípio Antrópico e os Efeitos de Seleção", summary: "Versões fraca e forte; a previsão de Weinberg para a constante cosmológica; o que um efeito de seleção pode e não pode explicar." }
  ch05-multiverse: { title: "O Multiverso e o Problema da Medida", summary: "Inflação, a paisagem, e por que contar universos é mais difícil do que parece." }
  ch05-finetuning-proof: { title: "Prova guiada: Bayes e o Ajuste Fino", summary: "Prova guiada: o argumento da razão de verossimilhanças a partir do ajuste fino, com as objeções da normalização, da classe de referência e do multiverso expostas." }
  ch05-traps: { title: "Armadilhas", summary: "Perguntas rápidas, cada uma baseada em um equívoco comum sobre este nível." }
  ch05-intuition: { title: "Recordação Rápida", summary: "Mnemônicos, distinções e um pequeno exemplo resolvido para as ideias principais do nível." }
  ch05-map: { title: "Mapa de Conteúdo", summary: "Reconstrua o mapa de conceitos do nível caixa por caixa, entre iscas parecidas." }
  ch05-review: { title: "Revisão do Nível" }
  ch05-challenge: { title: "Desafio do Nível: Origens e Ajuste Fino (1)", summary: "Pesar os argumentos do começo, do ajuste fino e do multiverso, com números honestos e objeções honestas. (Aprofundamento.) Parte 1: chances da entropia, limite de Weinberg, medida." }
  ch05-challenge-2: { title: "Desafio do Nível: Origens e Ajuste Fino (2)", summary: "Problemas 4 e 5: o começo e o argumento da contingência, e depois o ajuste fino contra seus rivais, com números e premissas." }

  ch06-theism: { title: "O Que Se Está Defendendo?", summary: "Teísmo, deísmo, panteísmo e ateísmo definidos com cuidado; o que os argumentos pretendem mostrar e o que não podem mostrar." }
  ch06-cosmological: { title: "Prova guiada: O Argumento Cosmológico", summary: "Prova guiada: da contingência e do princípio da razão suficiente a um ser necessário, passo a passo." }
  ch06-kalam: { title: "O Argumento Kalam", summary: "Tudo o que começa tem uma causa; o universo começou; logo, tem uma causa. O caso de cada premissa e as objeções da física." }
  ch06-ontological: { title: "Prova guiada: O Argumento Ontológico", summary: "Prova guiada: Anselmo, Gaunilo e a versão modal; o que exatamente está sendo suposto." }
  ch06-design: { title: "De Paley a Darwin: O Argumento do Desígnio", summary: "O relógio, a resposta de Hume, a evolução, e a mudança moderna para as leis e o ajuste fino." }
  ch06-moral: { title: "O Argumento Moral", summary: "Valores morais objetivos e Deus: o argumento, a resposta do Eutífron e as explicações seculares da moralidade." }
  ch06-reason: { title: "A Própria Razão É uma Pista?", summary: "O argumento evolutivo de Plantinga contra o naturalismo e o argumento da razão, com as respostas." }
  ch06-traps: { title: "Armadilhas", summary: "Perguntas rápidas, cada uma baseada em um equívoco comum sobre este nível." }
  ch06-intuition: { title: "Recordação Rápida", summary: "Mnemônicos, distinções e um pequeno exemplo resolvido para as ideias principais do nível." }
  ch06-map: { title: "Mapa de Conteúdo", summary: "Reconstrua o mapa de conceitos do nível caixa por caixa, entre iscas parecidas." }
  ch06-review: { title: "Revisão do Nível" }
  ch06-challenge: { title: "Desafio do Nível: Pese o Argumento (1)", summary: "Achar a premissa mais fraca de cada argumento e dizer o que um defensor e um crítico fariam em seguida. (Aprofundamento.) Parte 1: contingência, desígnio contra seleção, o argumento moral." }
  ch06-challenge-2: { title: "Desafio do Nível: Pese o Argumento (2)", summary: "Problemas 4 e 5: o kalam e o argumento ontológico modal, depois o argumento da razão, e uma pesagem final dos argumentos do nível." }

  ch07-evil-logical: { title: "Prova guiada: O Problema Lógico do Mal", summary: "Prova guiada: a inconsistência de Mackie, a defesa do livre-arbítrio e o que um argumento de mundos possíveis mostra." }
  ch07-evil-evidence: { title: "O Problema Evidencial do Mal", summary: "O cervo de Rowe, o sofrimento natural e a probabilidade de que um Deus bom o permitisse." }
  ch07-theodicy: { title: "Teodiceias e Seus Críticos", summary: "Formação da alma, bens maiores, teísmo cético, visões do processo: o que cada uma tenta fazer e onde cada uma sofre tensão." }
  ch07-hiddenness: { title: "Ocultamento Divino", summary: "O argumento de Schellenberg da não-crença não resistente, e respostas sobre liberdade e relacionamento." }
  ch07-parsimony: { title: "Ockham, Ônus da Prova e Naturalismo", summary: "O que a parcimônia pode e não pode decidir; quem precisa argumentar e por quê." }
  ch07-wager: { title: "Prova guiada: A Aposta de Pascal", summary: "Prova guiada: valor esperado com ganhos infinitos, a objeção dos muitos deuses e a teoria da decisão com números." }
  ch07-agnostic: { title: "O Agnosticismo e Suas Variedades", summary: "Agnosticismo forte, fraco e prático; quando suspender o juízo é a resposta honesta?" }
  ch07-traps: { title: "Armadilhas", summary: "Perguntas rápidas, cada uma baseada em um equívoco comum sobre este nível." }
  ch07-intuition: { title: "Recordação Rápida", summary: "Mnemônicos, distinções e um pequeno exemplo resolvido para as ideias principais do nível." }
  ch07-map: { title: "Mapa de Conteúdo", summary: "Reconstrua o mapa de conceitos do nível caixa por caixa, entre iscas parecidas." }
  ch07-review: { title: "Revisão do Nível" }
  ch07-challenge: { title: "Desafio do Nível: Pese a Objeção (1)", summary: "Emparelhar cada objeção com sua melhor resposta e julgar o que cada uma deixa de pé. (Aprofundamento.) Parte 1: que problema é este, uma defesa forte demais, a aposta contra uma navalha." }
