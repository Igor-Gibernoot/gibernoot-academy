source_hash: 7c6b61c3e331
id: ch01-lenses
title: Quatro Lentes para Uma Pergunta
kind: concept
own: |
  - **Uma pergunta, quatro lentes.** Tome a pergunta "por que existe algo em vez de nada?". Uma **lente** é um modo de olhar, com suas próprias ferramentas e seu próprio tipo de resposta. Segundo a **ciência** (o estudo da natureza por observação, medição e teorias testáveis), o quadro mais bem sustentado é que o **universo** (tudo o que existe no espaço e no tempo) se desenvolveu ao longo de cerca de $13.8$ bilhões de anos a partir de um estado inicial quente e denso; a ciência descreve {{ como o universo se desenvolveu, mas um estado de "nada" não pode ser testado }}, de modo que a pergunta de por que existe alguma coisa fica no limite da ciência ou além dele.
  - **Filosofia e teologia respondem de outro modo.** A **filosofia** (pensar com cuidado sobre as perguntas mais básicas) pergunta o que a pergunta pressupõe. Segundo o **princípio da razão suficiente** (tudo o que existe tem uma explicação), {{ a própria existência do universo precisa de uma explicação }}; um crítico responde que o princípio pode valer para as coisas dentro do universo mas não para o todo, ou que "nenhuma explicação" pode ser o fim da linha. A **teologia** (raciocinar dentro de uma fé sobre o que o seu Deus é e faz) diz, segundo os **teístas** (pessoas que sustentam que Deus existe), que {{ Deus é a fonte de todo o ser, e o universo existe porque Deus lhe dá existência }}; isto é um compromisso de fé, e "de qual Deus" importa (o Deus do judaísmo, do cristianismo e do islã não é o *Brahman* do pensamento hindu).
  - **A experiência vivida** é a lente do espanto: a admiração que faz a pergunta importar. Ela não dá uma explicação, mas {{ mostra por que as pessoas perguntam e o que a resposta significaria para elas }}.
  - **Lentes diferentes dão tipos diferentes de resposta**, então uma resposta numa não é automaticamente resposta noutra. Pessoas ponderadas discordam sobre qual {{ premissa (tudo precisa de explicação?), valor (o que conta como resposta satisfatória?) e tipo de evidência }} aceitam.
cards:
  - type: text
    id: welcome
    title: "Adivinhar continua sendo o objetivo"
    body: |
      A mesma promessa de antes: em toda lição do Nível 1, **adivinhar é o objetivo**. Você será questionado sobre coisas que não aprendeu, palpites errados são esperados, e cada um vem com uma razão. Toda palavra técnica é explicada na primeira vez em que aparece.

      Esta lição pega uma pergunta enorme e a olha de quatro maneiras. O objetivo não é achar o vencedor, mas ver **quão diferentes são as maneiras de olhar**.

  - type: mcq
    id: hook
    title: "O enigma mais antigo"
    prompt: |
      Eis a pergunta: **"Por que existe algo em vez de nada?"** Por que existe um universo (o *universo* é tudo o que existe no espaço e no tempo), quando poderia não haver nada?

      Antes de qualquer teoria, **adivinhe**: quatro maneiras de olhar são a ciência (o estudo da natureza por observação e experimento), a filosofia (pensar com cuidado sobre as perguntas mais básicas), a teologia (raciocinar dentro de uma fé sobre o que o seu Deus é e faz) e a experiência vivida (o espanto e a admiração que levam uma pessoa a perguntar). Quais delas têm algo a dizer sobre esta pergunta? Marque todas as que se aplicam.
    options:
      - text: A ciência, o estudo da natureza por observação e experimento.
        correct: true
        feedback: A ciência tem muito a dizer sobre como o universo se desenvolveu, como os próximos cartões mostram.
      - text: A filosofia, o pensar com cuidado sobre as perguntas mais básicas.
        correct: true
        feedback: A filosofia tem muito a dizer sobre o que a própria pergunta pressupõe.
      - text: A teologia, o raciocínio dentro de uma fé sobre o que o seu Deus é e faz.
        correct: true
        feedback: A teologia tem muito a dizer sobre o que é dado como fonte do ser.
      - text: A experiência vivida, o espanto e a admiração que levam uma pessoa a perguntar.
        correct: true
        feedback: A experiência vivida é de onde a pergunta vem, em primeiro lugar.
      - text: Nenhuma delas; uma pergunta tão grande não tem nada de útil a ser dito sobre ela.
        feedback: Tentador, porque a pergunta é muito grande. Mas cada maneira de olhar pode dizer alguma coisa, mesmo que seja só sobre o que a pergunta pressupõe ou por que ela importa.
    multiple: true
    explanation: |
      Cada uma das quatro tem algo a dizer, mas cada uma diz um **tipo diferente de coisa**. Essa diferença é o tema da lição. Qual lente uma pessoa acha mais promissora muitas vezes depende do que ela considera uma resposta satisfatória.

  - type: text
    id: science
    title: "Lente 1: a ciência"
    body: |
      A **ciência** é o estudo da natureza por observação, medição e teorias que podem ser testadas. Segundo os cosmólogos (cientistas que estudam o universo como um todo), o **universo** se desenvolveu ao longo de cerca de $13.8$ bilhões de anos a partir de um estado inicial extremamente quente e denso, e desde então vem se expandindo e esfriando. Isso é uma descrição de *como* ele se desenvolveu, apoiada em muitas observações independentes.

      Mas o "nada" é difícil de alcançar para a ciência. A ciência trabalha com coisas que pode observar ou prever. Um estado de ausência total de espaço, tempo, matéria ou leis não é algo que um experimento possa preparar ou medir. Assim, segundo muitos cientistas, a pergunta "por que existe alguma coisa?" fica no limite do que a ciência pode testar, ou além dele. Uma segunda visão: alguns físicos propõem que o universo poderia surgir de um "nada" que ainda tem leis físicas (o vácuo quântico, um estado vazio que ainda tem regras). Os críticos respondem que esse "nada" já é alguma coisa.

  - type: mcq
    id: science-q
    prompt: |
      Segundo muitos cientistas, por que "por que existe algo em vez de nada?" é difícil de a ciência responder diretamente?
    options:
      - text: Um estado de nada absoluto, sem espaço, tempo, matéria nem leis, não pode ser observado nem testado, então a ciência não tem dados sobre ele.
        correct: true
      - text: Porque os cientistas não se interessam por grandes perguntas.
        feedback: |
          Muitos cientistas se interessam muito; alguns escrevem livros inteiros sobre isso. O limite é sobre o que pode ser testado, não sobre interesse.
      - text: Porque o universo sempre existiu, então a pergunta não tem sentido.
        feedback: |
          Se o universo teve um começo é, em si, discutido. Muitos cosmólogos descrevem um estado inicial quente e denso há cerca de $13.8$ bilhões de anos, embora o que veio antes, se é que algo veio, seja uma questão aberta. De qualquer modo, essa não é a razão dada.
      - text: Porque a ciência já mostrou que o universo veio do nada.
        feedback: |
          Não é um resultado estabelecido. Algumas propostas partem de um estado "vazio" que ainda tem leis físicas, e os críticos notam que isso não é realmente nada. A pergunta continua em aberto.
    explanation: |
      A ciência diz muito sobre *como* o universo se desenvolveu. O passo de lá até *por que existe alguma coisa* exige um estado de nada para examinar, e a ciência não tem como observar um. Isso é uma afirmação sobre os limites da ferramenta, não uma derrota dela.

  - type: text
    id: philosophy
    title: "Lente 2: a filosofia"
    image:
      src: img/russell.webp
      alt: Fotografia do filósofo Bertrand Russell em pé, de terno de três peças, 1929
      caption: Bertrand Russell (1872-1970), fotografado no Caltech em outubro de 1929; num debate de rádio da BBC com o jesuíta Frederick Copleston, em 28 de janeiro de 1948, ele disse, em essência, que o universo simplesmente está aí.
      credit: "Los Angeles Times, CC BY 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Bertrand_Russell_at_Cal_Tech.jpg"
      place: bottom
    body: |
      A **filosofia** é o pensar com cuidado sobre as perguntas mais básicas, usando **argumentos** (uma cadeia de razões que leva a uma conclusão). Ela não faz experimentos. Pergunta o que uma pergunta *pressupõe* e o que contaria como resposta.

      A pergunta pressupõe que a existência do universo precisa de uma explicação. Um princípio famoso diz isso: o **princípio da razão suficiente** diz que tudo o que existe tem uma explicação. O filósofo Gottfried Leibniz (1646-1716) o usou para fazer exatamente a nossa pergunta.

      Duas visões. **Segundo os defensores do princípio**, se algumas coisas têm explicações e o universo inteiro não tem, isso seria uma lacuna sem explicação. **Segundo os críticos**, como Bertrand Russell (1872-1970), num famoso debate de rádio: o universo pode simplesmente estar "aí", e pedir uma explicação do todo pode ser pedir mais do que o princípio pode dar: ele pode valer para as coisas *dentro* do universo e não para o todo.

  - type: mcq
    id: philosophy-q
    prompt: |
      O princípio da razão suficiente diz que tudo o que existe tem uma explicação. Um crítico diz: "Isso funciona para as coisas dentro do universo, mas não para o universo como um todo. O universo pode simplesmente ser, sem nenhuma explicação adicional." O que exatamente o crítico contesta?
    options:
      - text: Se o princípio se aplica ao universo inteiro e não só às coisas dentro dele.
        correct: true
      - text: Se o universo existe.
        feedback: |
          O crítico concorda que o universo existe. O que se discute é se a existência dele exige uma explicação.
      - text: Se os filósofos deveriam pensar em grandes perguntas.
        feedback: |
          O crítico está fazendo filosofia: argumenta sobre o que um princípio abrange. A disputa é sobre o princípio, não sobre se devemos pensar.
      - text: Se a ciência pode explicar as coisas dentro do universo.
        feedback: |
          O crítico aceita que as coisas dentro do universo têm explicações. O ponto é sobre o todo.
    explanation: |
      A filosofia não responde medindo. Ela torna visível uma **premissa** (uma afirmação de partida de um argumento): a de que tudo precisa de explicação. Quem aceita essa premissa sente a força da pergunta; quem a rejeita para o universo inteiro pode achar que a pergunta não tem resposta, e que isso é aceitável.

  - type: text
    id: theology
    title: "Lente 3: a teologia"
    body: |
      A **teologia** é o raciocínio dentro de uma fé sobre o que o seu Deus é e faz. Um **teísta** é uma pessoa que sustenta que Deus existe, e a palavra *Deus* pede cuidado: o Deus do judaísmo, do cristianismo e do islã, um único criador, não é a mesma ideia que, por exemplo, o *Brahman* em algumas tradições hindus, a realidade última por trás de tudo. De qual Deus se fala importa.

      **Segundo muitos teístas** (nas tradições judaica, cristã e islâmica), a resposta é que Deus é a fonte de todo o ser: o universo existe porque Deus lhe dá existência, e Deus existe de outra maneira, sem precisar de uma causa. Isto é um **compromisso de fé**, não o resultado de uma medição.

      Uma segunda visão, de alguns **não teístas**: mesmo aceitando a resposta, a mesma pergunta pode ser feita sobre Deus ("por que existe um Deus em vez de nada?"), e dizer que Deus não precisa de causa pode apenas deslocar o mistério. Os teístas respondem que Deus não é mais uma coisa dentro do universo, então a pergunta se aplica de outro modo. Se essa resposta funciona é um debate em aberto.

  - type: mcq
    id: theology-q
    prompt: |
      Segundo muitos teístas nas tradições judaica, cristã e islâmica, como eles respondem "por que existe algo em vez de nada?"
    options:
      - text: O universo existe porque Deus, que não precisa de causa, lhe dá existência.
        correct: true
      - text: O universo existe porque experimentos provaram que Deus existe.
        feedback: |
          Os teístas não dizem que isso é um resultado experimental. Eles o apresentam como um compromisso de fé, às vezes apoiado por argumentos filosóficos, que níveis posteriores vão examinar.
      - text: O universo existe por acaso, e não há outra resposta.
        feedback: |
          Isso se aproxima de uma resposta não teísta (a de que o universo pode simplesmente ser). Não é a resposta dada pelos teístas em questão.
      - text: A pergunta não tem sentido, então não deve ser feita.
        feedback: |
          Alguns filósofos dizem isso, mas os teístas tomam a pergunta como significativa e a respondem com Deus como fonte do ser.
    explanation: |
      Note o *tipo* de resposta: ela nomeia uma fonte de tudo, em vez de descrever como o universo se desenvolveu. Se a resposta convence depende das premissas que se aceitam, e é por isso que filósofos e teólogos a debatem.

  - type: text
    id: lived
    title: "Lente 4: a experiência vivida"
    image:
      src: img/wittgenstein.webp
      alt: Retrato fotográfico em preto e branco do filósofo Ludwig Wittgenstein em 1930
      caption: Ludwig Wittgenstein (1889-1951), fotografado em 1930 por Moritz Nähr; em seu Tractatus Logico-Philosophicus (1921) ele escreveu que o místico não é como o mundo é, mas que ele é.
      credit: "Moritz Nähr, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Ludwig_Wittgenstein_(3x4_cropped).jpg"
    body: |
      A quarta lente não é uma teoria. A **experiência vivida** é como é ser uma pessoa que pergunta. Muita gente diz que a pergunta a atinge primeiro como **espanto** ou **admiração**, à noite sob as estrelas, num nascimento, numa morte, quando de repente parece assombroso que exista alguma coisa. O filósofo Ludwig Wittgenstein (1889-1951) escreveu que o assombroso não é como o mundo é, mas *que* ele é.

      Duas visões do que esse sentimento mostra. **Segundo alguns**, a admiração é um indício, um sinal que aponta para algo além do cotidiano. **Segundo outros**, o sentimento é real e valioso, mas é um fato sobre *nós*: explica por que perguntamos, não qual é a resposta.

  - type: mcq
    id: match
    title: "Tipos de resposta"
    prompt: |
      Associe cada lente ao *tipo de resposta* que ela dá a "por que existe algo em vez de nada?". Qual associação está certa?
    options:
      - text: 'Ciência: como o universo se desenvolveu. Filosofia: o que a pergunta pressupõe. Teologia: uma fonte do ser, segundo uma fé. Experiência vivida: por que a pergunta importa para uma pessoa.'
        correct: true
      - text: 'Ciência: a razão final de haver um universo. Filosofia: um teste de laboratório. Teologia: uma medição. Experiência vivida: uma prova.'
        feedback: |
          Cada lente recebe o tipo errado de resposta. A ciência descreve e testa; a filosofia examina pressupostos; a teologia nomeia uma fonte dentro de uma fé; a experiência mostra por que importa. Misturá-las é o erro de que esta lição trata.
      - text: 'Ciência: por que a pergunta importa para uma pessoa. Filosofia: como o universo se desenvolveu. Teologia: o que a pergunta pressupõe. Experiência vivida: uma fonte do ser.'
        feedback: |
          Estas estão embaralhadas. Como o universo se desenvolveu é ciência; por que a pergunta importa é experiência vivida; nomear uma fonte do ser é teologia.
      - text: As quatro dão o mesmo tipo de resposta, com palavras diferentes.
        feedback: |
          Não dão. Uma descrição de como as coisas se desenvolveram, um exame de pressupostos, uma afirmação sobre uma fonte do ser e um sentimento de espanto são quatro tipos diferentes de coisa.
    explanation: |
      Quatro lentes, quatro tipos de resposta. Nenhuma é automaticamente errada por ser de outro tipo; cada uma responde a uma versão diferente de "por quê".

  - type: mcq
    id: cannot
    prompt: |
      Qual afirmação diz corretamente o que uma lente **não** pretende?
    options:
      - text: A ciência, ao descrever como o universo se desenvolveu, não pretende mostrar se há um Deus ou um propósito por trás dele; ela não testa isso.
        correct: true
      - text: A teologia, ao nomear Deus como fonte do ser, pretende tê-lo medido em laboratório.
        feedback: |
          A teologia raciocina dentro de uma fé; não pretende uma medição de laboratório.
      - text: A filosofia pretende resolver a pergunta de uma vez por todas por experimento.
        feedback: |
          A filosofia trabalha por argumento e não faz experimentos; suas conclusões são debatidas, não decididas por experimento.
      - text: A experiência vivida pretende ser uma teoria científica.
        feedback: |
          A admiração não é uma teoria. É uma resposta humana.
    explanation: |
      Ver o que uma lente *não* pretende é tão útil quanto ver o que ela pretende. Um cientista que diz "a ciência não testa Deus" não está dizendo que não há Deus, e um crente que diz "Deus é a fonte do ser" não está afirmando um resultado de medição.

  - type: mcq
    id: parting
    title: "Onde pessoas ponderadas se separam"
    prompt: |
      Duas pessoas ponderadas olham a mesma pergunta. Uma diz "o universo simplesmente é, e isso não precisa de explicação". A outra diz "o universo precisa ter uma explicação fora de si mesmo". Elas leram a mesma ciência. Qual é a fonte mais provável do desacordo?
    options:
      - text: Uma premissa diferente, se tudo precisa de uma explicação, junto com um senso diferente do que conta como resposta satisfatória.
        correct: true
      - text: Uma delas não leu a ciência.
        feedback: |
          Dissemos que elas leram a mesma ciência. A ciência descreve como o universo se desenvolveu; não decide essa premissa.
      - text: Uma delas não é ponderada.
        feedback: |
          Pessoas ponderadas sustentam as duas posições há séculos. Discordar não significa que um dos lados não pensou.
      - text: A ciência mostra claramente qual delas tem razão.
        feedback: |
          A ciência é a mesma para as duas e não alcança o estado de nada. O desacordo está em outro lugar: em premissas e valores.
    explanation: |
      Três coisas costumam separar as pessoas aqui: uma **premissa** (tudo precisa de explicação?), um **valor** (o que torna uma resposta satisfatória: uma descrição, uma causa primeira ou a aceitação do mistério?) e o **tipo de evidência** que a pessoa aceita (medição, argumento, tradição, experiência). Nomear qual deles está em jogo é metade de entender o desacordo.

  - type: mcq
    id: trap
    title: "Um deslize comum"
    prompt: |
      Um estudante diz: "A ciência explicou como o universo se desenvolveu, então a ciência respondeu por que existe algo em vez de nada." O que há de errado nisso?
    options:
      - text: Uma resposta a "como ele se desenvolveu?" não é automaticamente uma resposta a "por que existe alguma coisa?"; são perguntas diferentes, respondidas por tipos diferentes de razões.
        correct: true
      - text: Nada; se a ciência explica como, explica por quê.
        feedback: |
          "Como ele se desenvolveu?" parte de um universo que já existe. "Por que existe alguma coisa?" pergunta sobre a própria existência. Uma resposta à primeira deixa a segunda de pé para quem a faz.
      - text: A ciência provou que o universo não tem propósito.
        feedback: |
          A ciência não testa propósito. Esta é uma afirmação de outro tipo, e a lição mostra por que ela não pode ser tomada emprestada da ciência.
      - text: O estudante deveria ter usado a teologia, porque ela sempre dá respostas melhores.
        feedback: |
          Nenhuma lente sempre vence. Usar a teologia para responder a uma pergunta de "como" seria o mesmo deslize no sentido contrário.
    explanation: |
      O deslize funciona nos dois sentidos: um resultado numa lente não é automaticamente resposta noutra. "A ciência diz" não decide sozinho uma questão de propósito, e "minha fé diz" não decide sozinho uma questão sobre a idade do universo.

  - type: text
    id: summary
    body: |
      **A seguir:** *O Que Conta como Boa Razão?* Cada lente usou algum tipo de razão: evidência, argumento, testemunho, experiência, confiança. O que são elas, e onde cada uma pode falhar?
