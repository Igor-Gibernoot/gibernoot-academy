source_hash: 249d1b66d9a7
id: ch01-bubble
title: Fora da Nossa Bolha
kind: concept
own: |
  - **A maioria das crenças é herdada.** Uma **crença** é algo que você considera verdadeiro; uma **visão de mundo** é o quadro inteiro da realidade (Deus ou nenhum Deus, o que é uma pessoa, o que importa) que suas crenças formam juntas. Pesquisas sobre religião mostram, de forma consistente, que a visão de mundo que as pessoas têm na vida adulta segue a visão em que foram criadas com muito mais frequência do que o acaso daria. Misturar uma expectativa inicial (a **probabilidade a priori**: quão comum é cada visão ao seu redor) com uma evidência leve (qualquer coisa que conte a favor ou contra uma visão) funciona assim:
    $$\text{belief} \;\propto\; \text{prior} \times \text{evidence},$$
    onde $\propto$ significa "proporcional a" e as parcelas são reescaladas para somar $100\%$. Exemplo: três visões A, B, C com probabilidades a priori $0.8,\,0.1,\,0.1$ e evidências $0.5,\,0.6,\,0.55$ dão à Visão A uma parcela de
    $$\frac{0.8\times0.5}{0.8\times0.5+0.1\times0.6+0.1\times0.55}\approx 78\%,$$
    de modo que {{ uma evidência leve mal move uma crença que começa com uma probabilidade a priori forte; só uma evidência forte, ou um começo plano, deixa a evidência decidir }}.
  - **Herdado não é o mesmo que falso, e confiar nos outros é normal.** **Testemunho** é acreditar em algo porque outra pessoa lhe disse. Quase tudo o que você sabe (a Lua está a cerca de $384{,}000$ km) se apoia nele. Segundo Hume (1711-1776), confiamos no testemunho porque a experiência mostra que ele costuma ser confiável; segundo Reid (1710-1796), confiamos por padrão, a menos que haja uma razão para não confiar. De qualquer modo, a pergunta de verdade é {{ quão confiável é a fonte }}.
  - **Por que alguém acredita é uma pergunta diferente de se é verdade.** Argumentar que uma crença é falsa só por causa de onde ou como alguém chegou a ela é a **falácia genética** (uma *falácia* é um padrão de raciocínio que parece bom, mas falha). Isso vale para os dois lados: {{ não pode mostrar que uma crença é falsa, nem para um crente nem para um cético }}. Alguns filósofos respondem que a origem pode importar quando o processo que produziu a crença a teria produzido {{ fosse ela verdadeira ou não }}; este é um debate em aberto.
  - **Uma pergunta honesta** exige disposição para estar errado (saber o que mudaria a sua opinião), uma **versão mais forte (steelman)** de cada visão (apresentá-la na forma que seus melhores defensores aceitariam, o oposto de um espantalho) e o hábito de dizer {{ "segundo" }} quem faz a afirmação. O curso busca as perguntas certas, não declarar um vencedor.
cards:
  - type: text
    id: welcome
    title: "Adivinhar é o objetivo"
    body: |
      Bem-vindo à primeira lição de um curso sobre as maiores perguntas: o que é real, como sabemos, existe um Deus, o que é uma mente?

      **O Nível 1 é um passeio leve e, em todas as lições dele, adivinhar é o objetivo.** Você será questionado sobre coisas que ainda não aprendeu. Palpites errados são esperados, cada um vem com uma razão, e nada aqui é nota de prova sobre o que você já sabe. Toda palavra técnica é explicada na primeira vez em que aparece, e não é preciso nenhum conhecimento prévio nem matemática.

      Mais uma promessa. Este curso procura mostrar **várias maneiras de ver cada pergunta**, na forma que os melhores defensores de cada visão aceitariam. Ele não diz a você o que concluir. Um crente, um ateu e um agnóstico devem poder lê-lo e dizer "isso é justo".

  - type: mcq
    id: hook
    title: "Nascer aqui ou ali"
    prompt: |
      Imagine gêmeos separados ao nascer. Um é criado numa cidade onde quase todos têm um mesmo quadro do mundo, chame-o de **Visão A** (uma *visão de mundo* é um quadro inteiro da realidade: se há um Deus, o que é uma pessoa, o que importa). O outro é criado numa cidade distante onde quase todos têm um quadro diferente, a **Visão B**.

      Antes de qualquer teoria, **adivinhe**: quando os gêmeos forem adultos, o que é mais provável?
    options:
      - text: Cada um provavelmente tem a visão da cidade em que cresceu, embora alguns de cada lado mudem de ideia.
        correct: true
      - text: O lugar de nascimento não faz diferença. Os dois acabam com a mesma visão, porque a verdade é a mesma para todos.
        feedback: |
          Tentador, porque a verdade *é* a mesma para todos. Mas aquilo em que as pessoas acabam *acreditando* é outra coisa, e depende do que ouviram, em quem confiaram e do que lhes pareceu normal. Se uma crença é verdadeira é uma pergunta separada de como as pessoas chegam a ela (voltaremos a isso).
      - text: Cada um com certeza tem a visão da cidade em que cresceu. Ninguém nunca muda.
        feedback: |
          Forte demais. Muita gente muda de visão de mundo na vida adulta, algumas depois de muito pensar. A criação é um empurrão forte, não uma prisão.
      - text: Cada um tende a rejeitar a visão da cidade em que cresceu, porque as pessoas se rebelam.
        feedback: |
          Algumas pessoas se rebelam, sim, mas são minoria. Pesquisas sobre religião em muitos países mostram que a maioria dos adultos mantém a visão de mundo geral da sua criação.
    explanation: |
      Pesquisas em muitos países mostram que a religião (ou a ausência dela) que as pessoas têm na vida adulta segue aquela em que cresceram com muito mais frequência do que o acaso daria, com uma minoria real que muda. Isso é uma observação estabelecida. O que ela *significa* é uma pergunta que começamos a abrir aqui.

  - type: widget
    id: mixer-bubble
    widget: belief-mixer
    config:
      causes:
        - { name: "Visão A", prior: 0.8, evidence: 0.5 }
        - { name: "Visão B", prior: 0.1, evidence: 0.6 }
        - { name: "Visão C", prior: 0.1, evidence: 0.55 }
      sharp: true
      toggle: false
      labels:
        prior: "Ao seu redor: quão comum é cada visão onde você cresceu"
        evidence: "Uma evidência leve: quão bem cada visão se encaixa nela"
        belief: "No que você acaba acreditando"
        reset: "Reiniciar"
      presets:
        - { label: "Cresceu entre a Visão A", prior: [0.8, 0.1, 0.1] }
        - { label: "Cresceu entre a Visão B", prior: [0.1, 0.8, 0.1] }
        - { label: "Uma cidade mista", prior: [0.4, 0.3, 0.3] }
    body: |
      Um brinquedo para ver o enigma dos gêmeos em números. Três visões imaginárias, A, B e C. Os **controles deslizantes de cima** mostram quão comum era cada visão onde você cresceu (sua expectativa inicial). Os **do meio** mostram quão bem cada visão se encaixa numa **evidência** leve (qualquer coisa que conte a favor ou contra uma visão) que você encontra depois; aqui as três se encaixam quase igualmente, com B e C um pouco melhor que A. As **barras** mostram em que você acaba acreditando.

      Experimente: (1) aperte os três botões de predefinição e observe as barras; (2) arraste um controle de cima e veja o quanto as barras acompanham; (3) arraste um controle do meio para cima e veja quanto é preciso para mudar o resultado.

  - type: numeric
    id: bubble-number
    review: false
    prompt: |
      Três visões A, B, C. Uma pessoa cresceu onde as visões eram comuns nas proporções $0.8$, $0.1$ e $0.1$ (sua expectativa inicial). Depois ela encontra uma evidência leve que se encaixa nas visões $0.5$, $0.6$ e $0.55$. A parcela de crença de cada visão é sua expectativa vezes seu encaixe, reescalada para que as três parcelas somem $100\%$.

      Que porcentagem de crença a Visão A mantém? (Arredonde para um número inteiro.)
    answer: 78
    tolerance: 1
    wrong:
      - { value: 80, feedback: 'Essa é a expectativa inicial. A evidência a moveu um pouco, de $80\%$ para cerca de $78\%$: as parcelas precisam ser reescaladas depois da multiplicação.' }
      - { value: 33, feedback: 'Essa seria a parcela se as três visões começassem igualmente prováveis. Esta pessoa cresceu onde a Visão A era comum, e essa expectativa inicial conta.' }
    hint: Multiplique cada expectativa inicial pelo seu encaixe ($0.8\times0.5$, $0.1\times0.6$, $0.1\times0.55$) e depois divida o produto da Visão A pela soma dos três.
    explanation: |
      Os três produtos são $0.40$, $0.06$ e $0.055$, que somam $0.515$. A Visão A mantém $0.40/0.515\approx 77.7\%\approx 78\%$.

      A lição do número: uma evidência que se encaixa nas três visões de modo quase igual mal move uma pessoa que começa com uma expectativa forte.

  - type: widget
    id: mixer-outside
    widget: belief-mixer
    config:
      causes:
        - { name: "Visão A", prior: 0.34, evidence: 0.5 }
        - { name: "Visão B", prior: 0.33, evidence: 0.6 }
        - { name: "Visão C", prior: 0.33, evidence: 0.55 }
      sharp: true
      toggle: false
      labels:
        prior: "Fora de qualquer bolha: nenhuma visão é mais comum"
        evidence: "A evidência: quão bem cada visão se encaixa nela"
        belief: "No que você acaba acreditando"
        reset: "Reiniciar"
      presets:
        - { label: "Começo neutro, evidência leve", prior: [0.34, 0.33, 0.33], evidence: [0.5, 0.6, 0.55] }
        - { label: "Começo neutro, evidência forte a favor de B", prior: [0.34, 0.33, 0.33], evidence: [0.2, 0.9, 0.2] }
        - { label: "Cresceu entre A, evidência forte a favor de B", prior: [0.8, 0.1, 0.1], evidence: [0.2, 0.9, 0.2] }
        - { label: "Cresceu entre A, evidência esmagadora a favor de B", prior: [0.8, 0.1, 0.1], evidence: [0.05, 0.95, 0.05] }
    body: |
      Agora imagine estar **fora da bolha**: os controles de cima começam planos, como se nenhuma visão fosse mais comum que outra ao seu redor. Compare as predefinições. O que decide o resultado quando o começo é plano? E quão forte precisa ser a evidência para mover alguém que cresceu entre a Visão A?

  - type: mcq
    id: bubble-lesson
    prompt: |
      Um modelo de brinquedo mistura a expectativa inicial de uma pessoa (quão comum era cada visão ao seu redor) com a evidência de cada visão, e mostra que quem cresceu entre a Visão A tende a acabar com a Visão A mesmo quando a evidência é leve. O que esse brinquedo mostra?
    options:
      - text: Como uma crença pode se formar e por que a criação pesa tanto; ele não mostra que a Visão A é verdadeira nem falsa.
        correct: true
      - text: Que a Visão A é falsa, porque foi mantida apenas por razões de criação.
        feedback: |
          O brinquedo descreve *como* as crenças se formam, não *se* são verdadeiras. Uma pessoa criada entre a Visão A e outra criada entre a Visão B são ambas empurradas pelo ambiente; então, se "empurrado pelo ambiente" provasse falsidade, provaria que toda visão é falsa, inclusive a da própria pessoa.
      - text: Que a evidência nunca importa.
        feedback: |
          Não é assim. Com um começo plano a evidência decide, e uma evidência forte o bastante move até uma expectativa inicial forte. Quanto mais forte a expectativa, mais evidência é preciso.
      - text: Que a Visão A deve ser verdadeira, já que a maioria das pessoas ao seu redor a tem.
        feedback: |
          Quão comum é uma visão ao seu redor diz algo sobre o seu ambiente, não diretamente sobre o mundo. Muitas visões antes comuns foram depois abandonadas. A popularidade pode ser um indício (pode significar que muita gente tinha boas razões), mas não é prova.
    explanation: |
      O brinquedo separa duas perguntas fáceis de confundir: **como cheguei a acreditar nisto?** e **isto é verdade?** A primeira é sobre causas na minha vida; a segunda é sobre o mundo. O resto da lição mantém as duas separadas.

  - type: text
    id: testimony
    title: "Quase tudo o que você sabe, lhe foi contado"
    image:
      - src: img/hume.webp
        alt: Retrato pintado de David Hume com casaco marrom e gorro vermelho, por Allan Ramsay
        caption: David Hume (1711-1776), filósofo escocês, aqui no retrato de Allan Ramsay; ele sustentava que a confiança no testemunho se apoia na experiência de quão confiáveis as fontes foram.
        credit: "Allan Ramsay, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Allan_Ramsay_-_David_Hume,_1711_-_1776._Historian_and_philosopher_-_PG_3521_-_National_Galleries_of_Scotland.jpg"
        place: bottom
      - src: img/reid.webp
        alt: Retrato pintado de Thomas Reid com roupas escuras, por Henry Raeburn
        caption: Thomas Reid (1710-1796), filósofo escocês, no retrato de Henry Raeburn; ele sustentava que confiamos por padrão no que nos dizem e só abandonamos essa confiança quando encontramos uma razão para duvidar.
        credit: "Henry Raeburn, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Henry_Raeburn_(1756-1823)_-_Thomas_Reid_(1710%E2%80%931796),_Professor_of_Moral_Philosophy_at_Glasgow_University_-_84.30_-_Fyvie_Castle.jpg"
        place: bottom
        beside: true
    body: |
      Veja quantas das suas crenças você mesmo verificou. Que a Lua está a cerca de $384{,}000$ km, que existe uma cidade que você nunca visitou, que a Terra tem cerca de $4.5$ bilhões de anos: para quase tudo isso você depende de **testemunho**, uma palavra que significa que você acredita em algo *porque outra pessoa lhe disse*, num livro, numa aula, numa reportagem ou numa conversa.

      Isso não é um defeito. Ninguém conseguiria verificar tudo sozinho. Os filósofos que estudam o testemunho dão duas visões de por que confiar nos outros pode ser razoável:

      - Segundo **David Hume** (1711-1776), temos razão em confiar no testemunho porque a experiência nos mostra que pessoas e fontes de um dado tipo são *geralmente* confiáveis. A confiança se apoia num histórico.
      - Segundo **Thomas Reid** (1710-1796), confiar no que nos dizem é um padrão natural com que começamos, e só devemos abandoná-lo quando encontramos uma razão para duvidar.

      Os dois concordam no que mais importa: não *se* uma crença veio dos outros, mas **quão confiável é a fonte**.

  - type: mcq
    id: testimony-q
    prompt: |
      Você acredita que a Lua está a cerca de $384{,}000$ km da Terra, mas nunca mediu. Alguém diz: "Você só acredita nisso porque os professores lhe disseram, então é apenas uma crença herdada." Segundo Hume e Reid, qual é a melhor resposta?
    options:
      - text: Acreditar em algo porque uma fonte confiável lhe disse é um modo normal e muitas vezes bom de saber; o que importa é quão confiáveis são as fontes, e esta foi verificada de muitas maneiras independentes.
        correct: true
      - text: Só as crenças que você mesmo verificou contam como conhecimento, então eu deveria medir ou deixar de acreditar.
        feedback: |
          Se só as verificações em primeira mão contassem, quase ninguém "saberia" quase nada: nem a distância da Lua, nem a existência de outros países. Nem Hume nem Reid pedem isso. Eles perguntam quão confiável é a fonte.
      - text: Crenças herdadas são sempre verdadeiras, porque as gerações anteriores eram mais sábias.
        feedback: |
          Crenças herdadas podem ser verdadeiras ou falsas; as que você mesmo elaborou também. Ser transmitida não diz nada a favor nem contra. O teste é a confiabilidade da cadeia por trás dela.
      - text: Os professores nunca erram, então não há nada a responder.
        feedback: |
          As fontes podem errar, e as boas são corrigidas com o tempo. A resposta não é "as fontes são perfeitas", mas "as fontes podem ser avaliadas quanto à confiabilidade, e estas são boas".
    explanation: |
      Hume acrescentaria que você pode apontar um histórico (a distância foi medida por ecos de radar e de laser, entre outros métodos); Reid acrescentaria que você tem o direito de confiar a menos que lhe deem uma razão para duvidar. Nas duas visões, a pergunta útil é *quão confiável é a fonte?*, nunca apenas *de onde veio a crença?*

  - type: mcq
    id: genetic-1
    title: "Um deslize comum"
    prompt: |
      Alguém argumenta: "Você acredita na sua religião só porque seus pais o criaram nela. Então a sua crença é falsa."

      O que esse argumento realmente mostra?
    options:
      - text: Nada sobre se a religião é verdadeira. Mostra por que a pessoa tem a crença (uma causa na vida dela), não se a crença está correta.
        correct: true
      - text: Que a crença é falsa, já que uma crença com uma causa dessas não pode ser verdadeira.
        feedback: |
          Uma crença pode ter uma causa comum e ainda assim ser verdadeira: você pode acreditar que a Lua está longe porque seu professor disse, e isso é verdade. A causa de uma crença e a verdade da crença são coisas diferentes.
      - text: Que a crença é verdadeira, porque os pais devem ter tido boas razões.
        feedback: |
          Um deslize espelhado. Os pais podem ter tido boas razões ou más; o fato de terem passado uma crença adiante não a decide em nenhum dos sentidos.
      - text: Que a pessoa não pode examinar a crença depois.
        feedback: |
          O contrário: a observação é uma boa *razão para examinar*. Ela só não pode substituir o exame.
    explanation: |
      Argumentar que uma crença é falsa *por causa de como alguém chegou a ela* chama-se **falácia genética** (uma *falácia* é um padrão de raciocínio que parece bom, mas falha; "genética" aqui se refere à *origem* da crença). A origem de uma crença é uma pergunta; sua verdade é outra, e precisa ser decidida por evidência e argumento.

  - type: mcq
    id: genetic-2
    prompt: |
      O mesmo argumento, apontado para o outro lado. Alguém diz a um cientista: "Você acredita em átomos só porque seus professores e livros-texto lhe disseram. Então os átomos não existem." Qual afirmação é o melhor julgamento desse argumento?
    options:
      - text: 'Ele falha pela mesma razão: como o cientista chegou a acreditar em átomos não mostra se os átomos existem. As razões do cientista (experimentos, previsões) é que devem ser examinadas.'
        correct: true
      - text: Ele é bem-sucedido, porque uma crença que vem de professores não é evidência independente.
        feedback: |
          Os professores são uma forma de *transmitir* evidência, como experimentos que qualquer pessoa pode repetir. Uma crença recebida de professores ainda pode se apoiar em evidência forte; a pergunta é qual é a evidência, não quem a entregou.
      - text: Ele falha, mas só porque átomos são ciência e a ciência está isenta desse tipo de pergunta.
        feedback: |
          Nenhuma afirmação está isenta. O argumento falha para qualquer crença, científica ou religiosa, pela mesma razão lógica. O que a ciência oferece é evidência que pode ser examinada, não imunidade a perguntas.
      - text: Ele é bem-sucedido para os átomos, mas falharia para a religião.
        feedback: |
          O argumento tem exatamente a mesma forma nos dois casos, então se sustenta ou cai do mesmo modo nos dois. Uma regra usada contra um lado e dispensada para o outro não é uma regra.
    explanation: |
      Note a simetria. Se "você acredita por causa da sua criação" funcionasse como prova de falsidade, refutaria **toda** crença, inclusive as de quem usa o argumento. Então ele não prova nada contra ninguém, crente ou cético. O que *funciona* é olhar as razões.

  - type: mcq
    id: debunk
    prompt: |
      Alguns filósofos respondem ao ponto acima. Eles aceitam que "você acredita por causa da sua criação" não torna a crença falsa, mas sustentam que a origem *pode* importar. Segundo esses filósofos, quando ela dá uma razão real para duvidar?
    options:
      - text: Quando o processo que produziu a crença a teria produzido fosse ela verdadeira ou não (por exemplo, um processo que daria a mesma crença em qualquer cidade, verdadeira ou não).
        correct: true
      - text: Sempre que a crença foi aprendida de outras pessoas.
        feedback: |
          Isso condenaria quase todo o conhecimento (veja a distância da Lua). A preocupação é só com processos que não acompanham a verdade.
      - text: Sempre que a crença é reconfortante.
        feedback: |
          O conforto sozinho não torna uma crença falsa nem duvidosa; uma crença reconfortante pode ser verdadeira. Ele se torna razão para cuidado quando é a *razão* de a crença ser mantida e nada acompanha a verdade.
      - text: Nunca. As origens são sempre irrelevantes.
        feedback: |
          Essa é a versão estrita do ponto sobre a falácia genética, e muitos filósofos a sustentam. A resposta deste cartão é a visão rival: a de que algumas origens carregam informação sobre a confiabilidade. Qual visão é melhor é um debate em aberto, e níveis posteriores voltam a ele.
    explanation: |
      Aqui estão duas visões, ambas defendidas por pensadores sérios. **Estrita:** a origem nunca influi na verdade; só as razões. **Qualificada:** a origem influi na verdade quando mostra que o processo era pouco confiável (um termômetro travado em 20 graus marcaria "20" em qualquer sala, então sua leitura nada diz sobre esta sala). Qual delas se ajusta melhor às crenças religiosas, às morais, às científicas é uma questão aberta que pessoas ponderadas ainda debatem (não um fato estabelecido), e níveis posteriores voltam a ela.

  - type: text
    id: honest
    title: "O que uma pergunta honesta exige"
    body: |
      Então, onde isso deixa uma pergunta como "existe um Deus?" ou "o que é uma mente?" Três hábitos tornam uma pergunta honesta, e este curso os usa o tempo todo:

      1. **Disposição para estar errado.** Antes de olhar, pergunte: *o que mudaria a minha opinião?* Se a resposta é "nada", ainda não é uma pergunta.
      2. **Uma versão mais forte (steelman) de cada visão.** Um **espantalho** é uma versão fraca de uma visão rival, fácil de derrubar. Um **steelman** é o oposto: a visão apresentada na forma mais forte que seus melhores defensores aceitariam. Você só entende uma visão quando os defensores dela dizem "sim, é isso que queremos dizer".
      3. **"Segundo".** Toda afirmação vem de alguém: um pensador, um texto, uma tradição, um experimento. Nomear a fonte torna visível o limite da resposta.

  - type: mcq
    id: honest-q
    multiple: true
    prompt: |
      Quais destes são hábitos de uma pergunta honesta (marque todos os que se aplicam)?
    options:
      - text: Perguntar de antemão que evidência mudaria a minha opinião.
        correct: true
      - text: Apresentar uma visão rival na forma que seus melhores defensores aceitariam.
        correct: true
      - text: Dizer de quem é a afirmação ("segundo este texto", "segundo este cientista").
        correct: true
      - text: Escolher a resposta primeiro e depois procurar apoio para ela.
        feedback: |
          Isso é o que uma pergunta honesta evita. Se a resposta é escolhida de antemão, nada poderia contar contra ela, e a busca é só enfeite.
      - text: Descrever a visão rival na sua forma mais fraca para que o contraste fique claro.
        feedback: |
          Isso é o espantalho. Faz a sua própria visão parecer boa, mas não ensina nada sobre a outra, e o outro lado não a reconheceria.
      - text: Presumir que quem discorda não pensou no assunto.
        feedback: |
          Pessoas ponderadas discordam sobre essas questões por causa de premissas, valores e tipos de evidência diferentes. Descobrir qual é o caso faz parte do trabalho.
    explanation: |
      Os três hábitos não são regras de boa educação; são o que permite que uma pergunta tenha resposta. Uma pergunta em que você não pode estar errado, ou que combate apenas uma versão fraca do outro lado, não pode ensinar nada.

  - type: mcq
    id: steelman-1
    prompt: |
      Um crítico diz: "Pessoas religiosas acreditam em coisas sem nenhuma razão." Qual reformulação se aproxima mais de como muitas pessoas religiosas ponderadas expressariam a própria visão (um steelman)?
    options:
      - text: 'Elas sustentam que suas razões são de um tipo diferente da prova de laboratório: argumentos da filosofia, experiência pessoal e compartilhada, o testemunho de uma tradição e o senso de significado, que consideram razoáveis mesmo não podendo ser medidos.'
        correct: true
      - text: Elas acreditam porque têm medo da morte.
        feedback: |
          Algumas pessoas podem encontrar conforto na religião, mas isto é uma afirmação sobre *motivos*, não uma apresentação da visão na forma que seus defensores aceitam. (E é um movimento de falácia genética se usado para dizer que a crença é falsa.)
      - text: Elas acreditam no que seus líderes mandam acreditar.
        feedback: |
          Muitos crentes de fato se apoiam na autoridade de uma tradição, mas os mais ponderados costumam dizer que também pesam argumentos e experiência. Esta versão deixa de fora as melhores razões, e é isso que a torna um espantalho.
      - text: Elas acreditam em alguma coisa, então deve haver alguma verdade em todas as religiões.
        feedback: |
          Isso não é o que a maioria dos defensores de uma religião diria, e muitos o rejeitariam. Um steelman é a visão *como seus defensores a expressam*, não uma visão mais agradável inventada para eles.
    explanation: |
      Um steelman não significa concordar. Você pode achar as razões fracas. Mas precisa ser capaz de expô-las de um modo que o crente reconheça, antes de responder. (Se essas razões são boas é justamente o tipo de pergunta que o curso vai examinar, caso a caso.)

  - type: mcq
    id: steelman-2
    prompt: |
      O caso espelhado. Um crente diz: "Ateus acreditam que a vida não tem sentido e que tudo é permitido." Qual reformulação se aproxima mais de como muitos ateus ponderados expressariam a própria visão (um steelman)?
    options:
      - text: 'Eles sustentam que não há Deus, e muitos dizem que sentido e moral não precisam de um: que podemos encontrar propósito nas relações, no trabalho, na curiosidade e no cuidado com os outros, e raciocinar sobre o certo e o errado sem um mandamento divino.'
        correct: true
      - text: Eles sustentam que nada importa, e vivem de acordo com isso.
        feedback: |
          Poucos pensadores defendem uma visão sombria, mas a maioria dos ateus diz o oposto e vive uma vida cheia de sentido. Isto é a caricatura, não a visão como seus defensores a expressam.
      - text: Eles sustentam que todas as pessoas religiosas são tolas.
        feedback: |
          Muitos ateus têm profundo respeito por amigos religiosos e por pensadores religiosos; a afirmação de que todos os crentes são tolos é um espantalho da atitude do ateu.
      - text: Eles não olharam os argumentos.
        feedback: |
          Muitos ateus estudaram os argumentos longamente, assim como muitos crentes. Presumir que o outro lado não pensou é um modo de fugir da pergunta.
    explanation: |
      O mesmo hábito, do outro lado. Note também que "ateu" significa alguém que sustenta que não há Deus, e "agnóstico" alguém que sustenta que não se sabe de um jeito nem de outro (alguns dizem que não se pode saber de modo algum, outros apenas que eles mesmos não sabem); as duas são posições com argumentos, e níveis posteriores as examinam com justiça.

  - type: mcq
    id: according-to
    prompt: |
      Compare duas frases. (1) "Não existe um eu permanente e imutável." (2) "Segundo o ensinamento budista, não existe um eu permanente e imutável." O que acrescentar "segundo o ensinamento budista" faz?
    options:
      - text: Mostra de quem é a afirmação, para que o leitor veja os limites da resposta e a pese contra outras visões; ainda não diz nada sobre se a afirmação é verdadeira.
        correct: true
      - text: Significa que a afirmação provavelmente é falsa.
        feedback: |
          Não significa. "Segundo" não é um aviso. A frase "segundo a astronomia moderna, a Terra orbita o Sol" é verdadeira; ela só diz qual é a fonte.
      - text: Significa que a afirmação é só uma opinião, que não vale discutir.
        feedback: |
          Muitas afirmações, em todas as tradições e na ciência, são cuidadosamente argumentadas. Nomear a fonte permite verificar as razões; não as rebaixa.
      - text: Torna a frase vaga, então uma afirmação clara é melhor sem isso.
        feedback: |
          Torna a frase mais exata: a frase (1) soa como um fato do mundo; a (2) diz quem a sustenta. Perguntas sobre essa afirmação podem então ser feitas àquela tradição ("qual é o seu argumento?") e postas ao lado de visões rivais.
    explanation: |
      Você verá "segundo" ao longo de todo o curso, para religiões e para a ciência igualmente. É a linguagem de uma pergunta honesta: *esta fonte diz isto; eis por quê; eis o que os rivais dizem.*

  - type: text
    id: summary
    body: |
      **A seguir:** *Quatro Lentes para Uma Pergunta*. Pegue uma pergunta enorme, **por que existe algo em vez de nada?**, e veja como a ciência, a filosofia, a teologia e a experiência vivida a encaram. Primeiro, um palpite: qual das quatro você acha que terá mais a dizer?
