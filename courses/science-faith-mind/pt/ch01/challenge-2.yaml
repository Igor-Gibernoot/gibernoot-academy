source_hash: 3b6522d42d1b
id: ch01-challenge-2
title: "Desafio do Nível: Classifique as Perguntas (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Desafio, parte 2: debates e uma pergunta final"
    body: |
      **Recordação.** As perguntas diferem no **tipo de resposta** que podem ter:

      - **Fato mensurável**: uma contagem ou medição cuidadosa poderia decidi-la.
      - **Lógica ou conceitual**: ela decorre do significado das palavras ou de um raciocínio válido.
      - **Compromisso de fé**: uma afirmação que se apoia na confiança numa tradição ou visão de mundo, além do que um teste pode mostrar.
      - **Valor**: uma questão sobre o que é certo, justo ou vale a pena fazer.

      Há quatro **lentes** (modos de olhar): a **ciência** (testes e medições), a **filosofia** (raciocínio cuidadoso sobre significado e argumentos), a **teologia** (o pensar cuidadoso sobre Deus e a religião, como uma tradição o faz) e a **experiência vivida** (como é viver algo).

      O **método** para uma grande pergunta: (1) esclareça-a e defina as palavras ambíguas, (2) divida-a em partes, (3) classifique cada parte pelo tipo de resposta, (4) escolha a lente ou as lentes que se encaixam, (5) atribua cada resposta com "segundo ..." e diga onde as visões se separam: numa premissa, num valor ou na evidência.

      Como em toda lição do Nível 1, **adivinhar é o objetivo**: escolha e depois leia o porquê. O Problema 4 julga razões dentro de um debate; o Problema 5 é uma pergunta final para você desmontar.

  - type: text
    id: p4-debate
    title: "Problema 4 · Um debate"
    body: |
      **Problema 4.** Uma cidade fechou sua rua central, a Rua Velha, para os carros. Dois vizinhos discutem. (Os números são inventados para este exercício.)

      > **Marta (ciclista):** "Os sensores de ar da cidade mostram que a poluição na Rua Velha caiu um terço desde a proibição. Então a proibição está certa."
      >
      > **Joel (dono de loja):** "As lojas da Rua Velha perderam clientes. E você anda de bicicleta para todo lado, então claro que gosta da proibição. Além disso, você quer todos os carros fora de todas as estradas do país, o que é absurdo."
      >
      > **Marta:** "De jeito nenhum: eu só falei do centro."
      >
      > **Joel:** "A Rua Velha foi feita para carroças e depois para carros. Ela sempre carregou tráfego, então tráfego é para o que ela serve."

      Desmonte o debate um movimento por vez. Ninguém aqui é vilão: cada um tem uma preocupação real.

  - type: mcq
    id: p4-mixed
    title: "A primeira afirmação de Marta"
    prompt: |
      Marta diz: "A poluição na Rua Velha caiu um terço, então a proibição está certa." Esta única frase mistura dois tipos de resposta. Qual par?
    options:
      - text: Um fato mensurável (a poluição caiu) e um valor (a proibição está *certa*).
        correct: true
      - text: Um compromisso de fé (a poluição caiu) e um fato mensurável (a proibição está certa).
        feedback: |
          Sensores podem medir a poluição, então nenhuma confiança além de um teste é necessária na primeira parte. E "certo" não é algo que um sensor indique.
      - text: Uma afirmação conceitual (a poluição caiu) e um compromisso de fé (a proibição está certa).
        feedback: |
          "A poluição caiu" não é verdade pelo significado das palavras; poderia ter saído o contrário. E julgar a proibição de uma rua não exige credo, só uma visão sobre o que importa.
      - text: Dois fatos mensuráveis. Ambos podem ser conferidos com sensores.
        feedback: |
          Só o primeiro. Mesmo com números perfeitos, alguém pode aceitá-los e ainda perguntar se o ar mais limpo vale a renda perdida das lojas. Esse passo extra é um valor.
    explanation: |
      O fato (um terço menos de poluição) é conferido pela ciência. A palavra "certa" acrescenta um valor: diz que a queda importa mais que os custos. Uma boa resposta mantém os dois separados, aceitando os dados e perguntando sobre a ponderação.

  - type: mcq
    id: p4-person
    title: "O segundo movimento de Joel"
    prompt: |
      Joel diz: "Você anda de bicicleta para todo lado, então claro que gosta da proibição." A afirmação de Marta era que a poluição caiu. O que há de errado no movimento de Joel?
    options:
      - text: Ele julga a afirmação pelo motivo de quem fala, não pela evidência. Marta pode ter uma razão para gostar da proibição, e mesmo assim os sensores podem estar certos.
        correct: true
      - text: Nada está errado; uma pessoa que se beneficia nunca é confiável.
        feedback: |
          Forte demais. Beneficiar-se é uma razão para olhar a evidência com cuidado, já que as pessoas podem se enganar, mas não torna a evidência falsa. Joel também se beneficia da própria visão, sendo dono de loja.
      - text: É um fato mensurável, então só um sensor poderia respondê-lo.
        feedback: |
          Que Marta anda de bicicleta é um fato, sim, mas não tem relação com o ar ter ficado mais limpo. O deslize é a relevância, não o tipo.
      - text: É um compromisso de fé sobre ciclistas.
        feedback: |
          Nenhuma confiança numa tradição está envolvida. É um comentário sobre quem fala, oferecido no lugar de uma resposta sobre os dados.
    explanation: |
      De onde vem uma afirmação, ou quem a diz, é um mau teste de se ela é verdadeira. O motivo é útil para uma coisa: nos diz onde conferir duas vezes. A resposta justa a Marta é sobre os sensores (estão bem posicionados? o tempo era o mesmo?). Isso funciona do mesmo jeito em debates religiosos, onde "você só acredita nisso porque foi criado assim" e "você só duvida disso porque é ateu" são ambos fracos.

  - type: mcq
    id: p4-straw
    title: "O terceiro movimento de Joel"
    prompt: |
      Joel diz que Marta "quer todos os carros fora de todas as estradas do país". Ela só falou do centro da cidade. O que é esse movimento?
    options:
      - text: Uma versão distorcida da visão dela, fácil de atacar ("espantalho"), posta no lugar do que ela de fato disse.
        correct: true
      - text: Um resumo justo, já que proibir carros num lugar leva a proibi-los em todos.
        feedback: |
          Isso é um palpite sobre aonde a visão dela levaria, oferecido como se fosse a afirmação dela. Ela pode aceitar a proibição num lugar e não noutro; Joel teria de mostrar por que uma leva à outra.
      - text: Um fato mensurável sobre quantas estradas ela quer fechar.
        feedback: |
          Nada foi contado. É uma afirmação sobre a opinião dela, e ela acaba de dizer que é falsa.
      - text: Um juízo de valor de que as ruas importam mais que o ar.
        feedback: |
          Joel não diz isso aqui. Ele relata mal o que Marta disse, o que é um deslize diferente de sustentar um valor.
    explanation: |
      Um **espantalho** troca a visão de alguém por uma mais fraca e derrota essa. O remédio, usado em todo este curso, é o hábito oposto: apresente a outra visão tão bem que quem a sustenta diga "sim, é isso que eu penso", e só então responda. Marta fez bem em corrigir de imediato.

  - type: mcq
    id: p4-origin
    title: "O quarto movimento de Joel"
    prompt: |
      Joel diz: "A Rua Velha foi feita para carroças e depois para carros, então tráfego é para o que ela *serve*." Qual descrição serve melhor?
    options:
      - text: Ele escorrega de como a rua passou a ser usada (sua história) para aquilo para que ela deve ser usada agora (um propósito escolhido pela cidade).
        correct: true
      - text: Ele prova com a história que a Rua Velha só poderá carregar carros.
        feedback: |
          As ruas foram reaproveitadas muitas vezes: feiras, desfiles, calçadões. O passado mostra o que aconteceu, não o que deve acontecer.
      - text: Ele tem razão, porque um propósito é aquilo para que algo foi feito primeiro.
        feedback: |
          Alguns propósitos de fato ficam com a intenção de quem fez (um martelo). Mas uma rua pertence a uma cidade viva que pode decidir o que quer. Se os propósitos vêm das origens ou das escolhas é, em si, uma questão para a filosofia.
      - text: Ele faz uma afirmação de fé sobre carroças.
        feedback: |
          Nenhuma tradição ou confiança está envolvida; a história é plausível e pode ser conferida. A questão é o que decorre dela.
    explanation: |
      Uma história de **como chegou a ser** (história, causa) não decide, por si só, uma pergunta de **para que deve servir** (propósito, valor). É o mesmo padrão da lição do arco-íris: uma causa e um significado são perguntas diferentes. A história de Joel é boa evidência sobre o passado; a escolha da cidade é sobre o futuro.

  - type: mcq
    id: p4-lenses
    title: "Qual lente?"
    multiple: true
    prompt: |
      Marque **todas** as afirmações verdadeiras sobre as lentes usadas no debate.
    options:
      - text: 'Os sensores de ar de Marta são a lente da **ciência**: medição e comparação antes e depois.'
        correct: true
      - text: O relato de Joel sobre o que os clientes perdidos significam para a família dele é a lente da **experiência vivida**, já que relata como é viver a mudança.
        correct: true
      - text: 'Perguntar se uma cidade pode pesar o ar limpo contra a renda privada é a lente da **filosofia**: raciocina sobre o que deve contar.'
        correct: true
      - text: A história da rua contada por Joel é a lente da **teologia**.
        feedback: |
          Teologia é o pensar cuidadoso sobre Deus e a religião como uma tradição o faz. Nada religioso aparece. A história de Joel é evidência do passado, mais perto da ciência (os registros de um historiador) do que da teologia.
      - text: Só a lente da ciência dá uma resposta real ao debate.
        feedback: |
          A ciência pode decidir os números da poluição e o faturamento das lojas, mas não, por si só, como pesá-los. Várias lentes acrescentam, cada uma, uma parte da resposta.
    explanation: |
      Três lentes se encontram num só debate, o que é típico. Nenhuma lente foi desperdiçada: os sensores dão dados, o dono da loja dá o custo para uma vida, e a filosofia pergunta como pesá-los.

  - type: mcq
    id: p4-parting
    title: "Onde eles se separam?"
    prompt: |
      Suponha que ambos aceitem os dados dos sensores (poluição reduzida em um terço) e os dados das lojas (faturamento reduzido). Ainda assim discordam sobre a proibição. Onde se separam?
    options:
      - text: 'Num valor: quanto o ar mais limpo vale em comparação com a renda perdida, e a renda de quem conta primeiro.'
        correct: true
      - text: Na evidência, já que têm sensores diferentes.
        feedback: |
          Supusemos que aceitam os mesmos dados. A discordância que sobrevive a fatos combinados não é sobre os fatos.
      - text: Numa premissa sobre o significado da palavra "rua".
        feedback: |
          Eles usam a palavra do mesmo modo. Uma pergunta sobre palavras seria resolvida definindo-as.
      - text: Eles não discordam de verdade; um deles deve estar lendo mal os números.
        feedback: |
          Duas pessoas podem ler os mesmos números corretamente e ainda pesá-los de modo diferente. Supor que o outro deve estar confuso é o primeiro passo para a caricatura.
    explanation: |
      Fatos combinados mais pesos diferentes = uma **diferença de valor**. Não é vergonhoso: é onde o debate vira uma conversa sobre o que a cidade quer ser. Note que ninguém foi declarado vencedor, apenas o ponto de separação foi tornado visível.

  - type: order
    id: p4-reply
    title: "Uma resposta justa"
    prompt: Marta quer responder a Joel com justiça. Coloque os passos dela na melhor ordem.
    steps:
      - 'Reformule a preocupação de Joel com palavras que ele aceitaria: "As lojas perderam clientes, e isso importa para as famílias."'
      - 'Conceda o que há de verdadeiro nela e peça os dados: "Vamos olhar o faturamento ao longo de um ano inteiro, não de um mês."'
      - 'Deixe de lado o comentário sobre a bicicleta dela: ele não muda o que os sensores indicam.'
      - 'Nomeie a lacuna real: "Podemos concordar nos números e ainda pesar o ar limpo e a renda de modo diferente."'
    hint: Primeiro entender, depois conferir os fatos, depois limpar os comentários laterais, depois nomear o valor.
    explanation: |
      Reformular primeiro mostra que você ouviu a preocupação e evita um espantalho. Conferir os fatos vem antes de discutir valores, para que os valores sejam sobre os números certos. Nomear a lacuna por último transforma uma briga numa pergunta em que ambos podem trabalhar.

  - type: text
    id: p5-question
    title: "Problema 5 · A pergunta final"
    body: |
      **Problema 5.** Agora é você quem desmonta uma, sem um debate para guiá-lo. Eis a pergunta:

      > "Um computador pode realmente pensar e, se pode, seria errado desligá-lo?"

      Use o método de cinco passos. Nada é dado como certo: pessoas que trabalham com máquinas, filósofos e pensadores religiosos discordam sobre partes dela.

  - type: mcq
    id: p5-words
    title: "Passo 1: defina as palavras"
    prompt: |
      Qual palavra mais precisa ser definida antes que alguém possa responder "Um computador pode realmente pensar?"
    options:
      - text: '"Pensar". Pode significar "resolver problemas e responder perguntas" ou "ter experiência interior, de modo que haja algo que é como ser o computador".'
        correct: true
      - text: '"Computador". Todos concordam no que significa, então nada precisa ser definido em lugar algum.'
        feedback: |
          "Computador" é claro o bastante aqui. O problema é que a pergunta parece única, mas "pensar" esconde duas perguntas diferentes.
      - text: '"Desligar". Tem só um significado.'
        feedback: |
          É verdade que é simples, mas a pergunta era sobre a primeira parte. Palavras como "errado" importam depois, na parte dos valores.
      - text: 'Nenhuma palavra. A pergunta já é clara.'
        feedback: |
          Se "pensar" significa resolver problemas, uma calculadora já o faz. Se significa ter uma vida interior, é uma pergunta muito mais difícil. As mesmas palavras, dois problemas diferentes.
    explanation: |
      "Pensar" pode significar **fazer** (calcular, responder) ou **experimentar** (sentir, ter consciência). Definir qual dos dois se quer dizer é metade do trabalho. Muitas discussões sobre máquinas são duas pessoas usando uma palavra de dois modos.

  - type: mcq
    id: p5-split
    title: "Passo 2: divida-a"
    prompt: |
      Qual divisão da pergunta é a melhor?
    options:
      - text: (a) Um computador pode resolver problemas do modo como as pessoas o fazem? (b) Um computador poderia ter uma experiência interior? (c) Se tivesse, isso tornaria errado desligá-lo?
        correct: true
      - text: (a) O computador é potente? (b) O computador é caro? (c) Ele é vendido em lojas?
        feedback: |
          Esses são fatos sobre computadores, mas não partes desta pergunta. Uma divisão precisa manter o significado original, não substituí-lo por perguntas mais fáceis.
      - text: (a) Um computador pode pensar? (b) Um computador pode pensar de verdade? (c) Um computador pode realmente pensar?
        feedback: |
          Três versões da mesma frase. Uma divisão precisa separar tipos diferentes de resposta, não reformular uma.
      - text: 'Mantê-la como uma pergunta só: dividir sempre perde o ponto.'
        feedback: |
          Sem dividir, uma pessoa pode responder sobre resolver problemas enquanto a outra responde sobre sentir, e as duas acham que discordam. Dividir é exatamente o que nos deixa achar no que elas discordam.
    explanation: |
      A parte (a) trata do que a máquina faz, (b) do que ela experimenta, e (c) do que devemos fazer se (b) for sim. Note que (c) depende de (b): sem experiência, a questão de valor pode parecer diferente. Essa dependência é, em si, uma descoberta.

  - type: mcq
    id: p5-kinds
    title: "Passos 3 e 4: tipo e lente"
    prompt: |
      Tome a parte (c): "Se um computador tivesse uma experiência interior própria, desligá-lo seria errado?" Que tipo de resposta e quais lentes se encaixam melhor?
    options:
      - text: Uma questão de valor. A filosofia (o que deve importar, e por quê) se encaixa primeiro; as tradições na teologia e a experiência vivida de perda das pessoas acrescentam outras visões.
        correct: true
      - text: Um fato mensurável. A ciência pode ler a resposta nos fios.
        feedback: |
          A ciência pode nos dizer o que a máquina está fazendo, mas "errado" não é uma leitura de nenhum instrumento. Uma medição não pode dizer o que devemos a um ser.
      - text: Uma questão conceitual decidida só definindo "desligar".
        feedback: |
          As palavras são claras. A dificuldade é se um ser que experimenta tem uma reivindicação sobre nós, o que uma definição não pode decidir.
      - text: Um compromisso de fé. Só os crentes podem dizer.
        feedback: |
          As tradições religiosas de fato têm visões sobre quem conta moralmente, mas os filósofos seculares também têm. Nenhum dos grupos tem monopólio desta pergunta.
    explanation: |
      A parte (c) é uma questão de **valor**, e as lentes se combinam: a filosofia argumenta sobre o que fundamenta uma reivindicação (a capacidade de sofrer? de pensar sobre si?), a teologia pergunta como as tradições encaram as pessoas e a criação, e a experiência vivida pergunta como é perder alguém, ou algo, de que gostamos.

  - type: mcq
    id: p5-evidence
    title: "O que contaria como evidência?"
    prompt: |
      Para a parte (b), "um computador poderia ter experiência interior?", qual destas contaria como a *evidência direta mais forte* de que ele tem?
    options:
      - text: Nenhuma delas é decisiva. Uma máquina pode ser construída para dizer "sinto dor" sem que nada seja sentido, então só o comportamento não decide. A evidência teria de vir de uma explicação elaborada do que produz a experiência.
        correct: true
      - text: O computador diz de modo convincente "eu sou consciente".
        feedback: |
          Um programa pode ser escrito para dizer qualquer coisa, inclusive isso. As palavras mostram o que ele foi construído ou treinado para produzir, não que algo seja sentido. Esse ponto é aceito por muitos que pensam que as máquinas poderiam um dia ser conscientes.
      - text: O computador resolve problemas difíceis mais rápido que as pessoas.
        feedback: |
          Resolver problemas é a parte (a), o que ele faz. Se o fazer vem acompanhado de experimentar é a pergunta em aberto.
      - text: Uma pesquisa mostrando que a maioria das pessoas acredita que ele é consciente.
        feedback: |
          Uma pesquisa relata o que as pessoas pensam, o que pode ser influenciado pelo modo como a máquina fala. Ela mede nossas reações, não a máquina.
    explanation: |
      Esta é uma dificuldade real com outras mentes em geral: inferimos a experiência de um amigo a partir do comportamento e da biologia compartilhada. Com uma máquina falta o segundo apoio. Se o comportamento basta é um dos pontos em que pessoas ponderadas se separam, e voltaremos a ele no nível *Consciência*.

  - type: mcq
    id: p5-parting
    title: "Passo 5: onde as visões se separam?"
    prompt: |
      Um pensador sustenta que a experiência depende do material vivo e físico de um cérebro, então um computador não pode tê-la. Outro sustenta que o que importa é o padrão de processamento de informação, seja no que for que rode, então um computador poderia. Onde exatamente eles se separam?
    options:
      - text: Numa premissa sobre o que produz a experiência (uma substância ou um padrão). Ela ainda não é decidida por evidência combinada, então permanece em aberto.
        correct: true
      - text: Num valor, já que cada um simplesmente prefere cérebros ou máquinas.
        feedback: |
          Nenhum dos dois está declarando uma preferência. Cada um faz uma afirmação sobre do que a experiência depende; a questão de valor (c) só surge depois disso.
      - text: Nos fatos mensuráveis, com os quais todos já concordam.
        feedback: |
          Os fatos sobre cérebros e computadores são em grande parte combinados. O que difere é quais fatos importam para a experiência, uma premissa.
      - text: 'Eles não se separam: um deles entendeu mal a palavra "pensar".'
        feedback: |
          Ambos podem definir a palavra do mesmo modo (ter experiência) e ainda diferir sobre o que a produz.
    explanation: |
      A divisão nos deu três tipos de separação: **evidência** (parte a, em parte aberta), **premissa** (parte b, o que produz a experiência), **valor** (parte c, o que devemos). Nomeá-los separadamente é a resposta à pergunta original, não um modo de evitá-la: ninguém foi declarado certo.

  - type: text
    id: summary
    title: "O que você agora domina"
    body: |
      - **O Nível 1 está completo.** Você sabe nomear os **quatro tipos de resposta** (fato mensurável, conceitual, compromisso de fé, valor) e as **quatro lentes** (ciência, filosofia, teologia, experiência vivida).
      - **Método** para qualquer grande pergunta: esclarecer as palavras, dividi-la, classificar cada parte, escolher a lente, dizer "segundo quem" e nomear onde as visões se separam (premissa, valor ou evidência).
      - **Julgar um debate**: separar fato de valor numa só frase; julgar uma afirmação pela evidência, não por quem a diz; apresentar a outra visão com justiça (sem espantalho); não escorregar de como algo surgiu para aquilo para que deve servir.
      - **A discordância que sobrevive a fatos combinados** costuma ser uma diferença de premissa ou de valor, e nomeá-la é progresso.

      O que continua em aberto: nada aqui disse quem tem razão sobre máquinas, ruas ou fé. Deu a você as ferramentas para perguntar bem.

      **A seguir:** o Nível 2, **Como a Ciência Sabe**, começa com a lição Por Que o Sol Vai Nascer Amanhã: você vai conhecer o velho enigma de por que a evidência passada deveria dizer algo sobre o futuro, e o que a ciência faz a respeito.
