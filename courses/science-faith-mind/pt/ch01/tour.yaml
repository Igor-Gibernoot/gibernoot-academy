source_hash: 49d84050dd05
id: ch01-tour
title: Um Enigma para Cada Nível
kind: concept
own: |
  - **Todo nível posterior parte de uma pergunta que você já consegue sentir.** O passeio deu um enigma de adivinhação para cada um deles, e as respostas não eram o ponto: o ponto era ver {{ de qual premissa, valor ou tipo de evidência a resposta depende }}.
  - **Bons testes podem falhar.** Segundo o filósofo **Karl Popper** (1902-1994), um teste é informativo quando {{ poderia ter mostrado que a ideia estava errada }}, então testar só os casos que se encaixam ensina pouco. Um **efeito de seleção** é um viés sobre quais casos chegamos a ver, como quando só restam os sobreviventes, os vencedores ou os observadores para perguntar.
  - **Quadros dos mesmos fatos podem diferir.** Exames de imagem do cérebro, uma chaleira fervendo, uma história num texto antigo ou um sentimento de unidade podem ser lidos de duas ou mais maneiras (física ou não física, "como" ou "por quê", literal ou interpretada). Segundo pensadores diferentes, cada leitura é razoável, e os dados sozinhos muitas vezes {{ não decidem entre elas }}.
  - **Origem não é verdade.** Explicar por que as pessoas têm uma crença (o alarme de um caçador, uma infância, uma cultura) é uma pergunta diferente de perguntar se a crença é verdadeira; cada uma precisa do seu próprio tipo de evidência, e a primeira não decide a segunda por si só.
  - **Onde pessoas ponderadas se separam.** Ao longo do curso as discordâncias se resumem a três coisas: uma {{ premissa }} que um lado aceita e o outro rejeita, um {{ valor }} pesado de modo diferente, ou um {{ tipo de evidência }} contado mais ou menos. Nomear qual delas está em jogo é o primeiro passo de todo nível.
cards:
  - type: text
    id: welcome
    title: "Um enigma para cada nível"
    body: |
      A mesma promessa, numa linha: em toda lição do Nível 1, **adivinhar é o objetivo**, e palpites errados vêm com uma razão.

      Esta lição é um passeio. O curso tem muitos níveis depois deste, e para cada um você vai encontrar **um pequeno enigma** que pode tentar só com o bom senso. Nenhuma resposta é anunciada como vencedora: onde pessoas ponderadas discordam, a explicação diz sobre o que elas discordam. Toda palavra técnica é explicada na primeira vez em que aparece.

  - type: mcq
    id: p-science
    title: "Enigma: testando uma regra"
    image:
      src: img/popper.webp
      alt: Fotografia de Karl Popper já idoso, de cabelo branco, tirada antes de 1987
      caption: Karl Popper (1902-1994), filósofo da ciência nascido na Áustria, argumentou que um bom teste científico é aquele que poderia mostrar que uma ideia está errada.
      credit: "DorianKBandy, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Photo_of_Karl_Popper.jpg"
    prompt: |
      Tenho uma regra secreta para três números. A trinca **2, 4, 6** a satisfaz. Você palpita que a regra é "cada número é 2 a mais que o anterior". Você pode testar mais uma trinca e eu direi sim ou não. Que teste poderia ensinar mais?
    options:
      - text: "5, 3, 1 (descendo), porque um \"não\" não o surpreenderia, mas um \"sim\" mostraria que o seu palpite é estreito demais."
        correct: true
      - text: "10, 12, 14, porque segue o seu palpite."
        feedback: |
          Se a resposta for "sim", você aprende quase nada: o seu palpite já previa isso. Testes que só podem concordar com a sua ideia são fracos.
      - text: "8, 10, 12, porque é uma trinca diferente de 2, 4, 6."
        feedback: |
          É uma trinca nova, mas ainda segue "some 2", então não consegue separar o seu palpite de regras mais amplas, como "quaisquer números crescentes".
      - text: "Nenhum teste ajuda, já que uma regra nunca pode ser conhecida."
        feedback: |
          Nunca podemos ter certeza, mas alguns testes ensinam mais que outros. Essa diferença é a ideia inteira.
    explanation: |
      Um bom teste é aquele que **poderia ter ido contra você**. O filósofo Karl Popper (1902-1994) fez disso algo central para a ciência. Outros, incluindo seguidores de Thomas Kuhn (1922-1996), ressaltam que os cientistas também trabalham dentro de quadros compartilhados. O nível *Como a Ciência Sabe* estuda como as duas visões se encaixam.

  - type: mcq
    id: p-reality
    title: "Enigma: o que mostra um exame do cérebro?"
    prompt: |
      Um aparelho mostra que um determinado padrão de atividade cerebral aparece toda vez que uma pessoa sente alegria, e nunca fora disso. Qual afirmação é a **mais segura** de tirar apenas do exame?
    options:
      - text: "A alegria e esse padrão cerebral andam juntos; o exame sozinho não nos diz se a alegria *é* o padrão, é causada por ele, ou é outra coisa que o acompanha."
        correct: true
      - text: "A alegria nada mais é que esse padrão, então não existe sentimento interior."
        feedback: |
          Segundo os **materialistas** (os que sustentam que só existem a matéria e seu comportamento) isso pode estar certo, mas o exame não o prova. Ele mostra uma correlação, e outras leituras se encaixam nos mesmos dados.
      - text: "A alegria é uma coisa separada, não física, que o cérebro apenas recebe."
        feedback: |
          Segundo alguns **dualistas** (os que sustentam que mente e matéria são dois tipos de coisa) esta é uma visão coerente, mas o exame também não a prova.
      - text: "O exame prova que a alegria não é real."
        feedback: |
          Um padrão no cérebro não torna o sentimento irreal; no máximo diz o que o acompanha.
    explanation: |
      Os mesmos fatos, várias leituras: o nível *Visões da Realidade* as põe lado a lado (materialismo, idealismo, dualismo e outras) e pergunta o que cada uma pressupõe.

  - type: mcq
    id: p-math
    title: "Enigma: um hotel lotado com quartos sem fim"
    image:
      src: img/hilbert.webp
      alt: Fotografia do matemático David Hilbert de meia-idade, por volta de 1900
      caption: O matemático alemão David Hilbert, fotografado por volta de 1900; o enigma do hotel que leva seu nome é um experimento mental sobre como coleções infinitas diferem das finitas.
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:David_Hilbert,_c._1900.png"
    prompt: |
      Um hotel tem infinitos quartos, numerados 1, 2, 3 e assim por diante, e todos estão ocupados. Chega um novo hóspede. A gerente diz: "Sem problema." Como ela poderia arranjar um quarto, sem despejar ninguém?
    options:
      - text: "Pedir ao hóspede do quarto 1 que vá para o quarto 2, ao do quarto 2 que vá para o 3, e assim por diante: todos sobem um quarto e o quarto 1 fica livre."
        correct: true
      - text: "Ela não pode: hotel lotado é hotel lotado."
        feedback: |
          Isso vale para um hotel com um número finito de quartos. Com quartos sem fim, todo hóspede ainda pode ter um quarto seguinte para onde ir.
      - text: "Pôr o novo hóspede no último quarto."
        feedback: |
          Não existe último quarto: os números nunca acabam. É exatamente isso que torna o truque possível.
      - text: "Pedir que metade dos hóspedes vá embora."
        feedback: |
          Ninguém precisa sair. Cada hóspede simplesmente vai para o quarto de número seguinte.
    explanation: |
      Um enigma clássico muitas vezes atribuído ao matemático David Hilbert (1862-1943). Ele mostra que coleções infinitas se comportam diferente das finitas. O nível *Matemática e Por Que Ela Funciona* segue perguntando como fatos tão abstratos podem descrever o mundo, e se a matemática é inventada ou descoberta: os **platonistas** (que sustentam que os objetos matemáticos existem independentemente de nós) e os **formalistas** (que tratam a matemática como regras de um jogo) respondem de modo diferente.

  - type: mcq
    id: p-origins
    title: "Enigma: um universo de sorte?"
    prompt: |
      Uma loteria tem 1.000.000 de bilhetes e um vencedor. O vencedor exclama: "Entre um milhão, fui eu! Isto deve ter sido arranjado para mim." Qual resposta é a **mais razoável**?
    options:
      - text: "Alguém tinha que ganhar; surpreender-se com o fato de *o vencedor* ser o vencedor não mostra um arranjo. Precisaríamos saber como o sorteio foi conduzido."
        correct: true
      - text: "Sim: um evento de uma em um milhão só pode acontecer se foi arranjado."
        feedback: |
          Eventos raros acontecem o tempo todo quando há muitas chances: todo sorteio possível é igualmente raro. A raridade sozinha não mostra um plano.
      - text: "Não há nada de surpreendente nisso, então não sobra pergunta alguma."
        feedback: |
          Rápido demais. Se o sorteio fosse manipulado, o mesmo resultado seria esperado. A pergunta de *como ele foi conduzido* permanece.
      - text: "O bilhete deve ter sido especial."
        feedback: |
          Se o sorteio é justo, nenhum bilhete é especial de antemão.
    explanation: |
      Esta é a forma de um argumento do nível *Origens e Ajuste Fino*: as constantes da física parecem "na medida certa" para a vida. Segundo alguns pensadores isso sugere um desígnio; segundo outros, reflete um **efeito de seleção** (só universos com observadores têm alguém perguntando) ou muitos universos. O nível pergunta que pressupostos cada resposta exige.

  - type: mcq
    id: p-godfor
    title: "Enigma: dominós sem começo"
    prompt: |
      Cada dominó caiu porque o anterior o empurrou. Um filósofo argumenta: "Então deve ter havido um primeiro empurrão." O que esse argumento pressupõe discretamente?
    options:
      - text: "Que uma cadeia de 'porquês' não pode voltar para sempre, ou, se pode, ainda precisa de algo fora dela."
        correct: true
      - text: "Que os dominós são pesados."
        feedback: |
          O peso não tem papel. O argumento é sobre a *forma* da cadeia de causas, não sobre os objetos.
      - text: "Nada: segue só pela lógica."
        feedback: |
          Olhe de novo: nada em "cada dominó foi empurrado pelo anterior" obriga a existir um primeiro. Uma fila sem fim não tem primeiro dominó e cada um ainda tem quem o empurre. A afirmação precisa de uma premissa extra.
      - text: "Que o primeiro empurrão foi um acidente."
        feedback: |
          Nada se diz sobre acidente ou propósito. O argumento só afirma que existe um primeiro empurrão.
    explanation: |
      Segundo os defensores de um argumento da **causa primeira** (os argumentos cosmológico e kalam, estudados em *Argumentos a Favor de Deus*), uma cadeia sem fim não explica nada, então algo não causado deve existir; **Deus** aqui é a palavra para um ser supremo, cuja natureza difere entre as tradições. Segundo os críticos, uma cadeia sem fim não é uma contradição, ou a causa primeira não precisa ser Deus. O desacordo é sobre uma **premissa** (uma afirmação de partida), que é o que o nível pede que você encontre.

  - type: mcq
    id: p-godagainst
    title: "Enigma: um pai ou mãe que pode impedir"
    prompt: |
      Imagine um pai que sabe tudo, pode tudo e ama perfeitamente a criança. A criança sofre terrivelmente sem nenhuma razão que alguém consiga ver. Qual destas é **uma saída real** que pessoas ponderadas propuseram? Escolha a que não simplesmente nega o problema.
    options:
      - text: "O pai pode ter razões fora do nosso alcance, por exemplo um bem que não poderia existir sem o sofrimento (muitos teístas respondem assim)."
        correct: true
      - text: "O sofrimento não existe de verdade."
        feedback: |
          Algumas tradições dizem que o mundo não é o que parece, mas essa resposta costuma negar os fatos em vez de responder ao enigma como posto, em que o sofrimento é dado.
      - text: "Amar alguém significa querer que essa pessoa sofra."
        feedback: |
          Quase nenhuma posição defende isso; muda a palavra "ama" até que ela signifique outra coisa.
      - text: "Saber tudo e poder tudo é o mesmo que amar."
        feedback: |
          Poder e conhecimento não são amor. O enigma exige que os três valham juntos.
    explanation: |
      Este é o **problema do mal**, central no nível *Argumentos Contra Deus*. Segundo os **ateus** (os que sustentam que nenhum deus existe) é uma razão para duvidar de tal ser; segundo os teístas, ele pode ser respondido (livre-arbítrio, um bem maior, limites ao que pode ser conhecido). Onde se separam: se podemos saber que razões um ser teria para agir.

  - type: mcq
    id: p-natgod
    title: "Enigma: o problema da pedra"
    prompt: |
      Um ser todo-poderoso pode criar uma pedra tão pesada que ele mesmo não consiga levantá-la? Qual visão lida melhor com o enigma?
    options:
      - text: "Segundo muitos filósofos, 'uma pedra que um ser todo-poderoso não consegue levantar' é uma autocontradição, como um círculo quadrado, então não conseguir fazê-lo não é falta de poder."
        correct: true
      - text: "Sim, pode, e então não consegue levantá-la, então não é todo-poderoso."
        feedback: |
          As duas respostas parecem quebrar a ideia. É por isso que o enigma é famoso. A visão acima evita a armadilha perguntando o que "todo-poderoso" deveria significar.
      - text: "Não, não pode, o que prova que tal ser não existe."
        feedback: |
          Isso só se segue se "todo-poderoso" significar capaz de fazer até contradições. Muitos teólogos não querem dizer isso.
      - text: "A pergunta não tem relação com o que as religiões ensinam."
        feedback: |
          Crentes de várias tradições há muito discutem o que o poder divino inclui, e é por isso que o enigma é útil.
    explanation: |
      O nível *A Natureza de Deus* estuda tais atributos (poder, conhecimento, bondade, eternidade). Segundo alguns pensadores o poder de Deus é limitado só pela lógica; segundo outros, um ser além da lógica é possível, ou as palavras vão além do sentido comum. Uma palavra como "todo-poderoso" precisa ser definida antes de ser discutida.

  - type: mcq
    id: p-sciref
    title: "Enigma: por que a chaleira está fervendo?"
    prompt: |
      Duas respostas a "Por que a chaleira está fervendo?": (a) "Porque a chama do gás aquece a água até que suas moléculas se movam rápido o bastante para virar vapor." (b) "Porque eu quero uma xícara de chá." Qual está certa?
    options:
      - text: "As duas: respondem a perguntas diferentes, como acontece e para que serve."
        correct: true
      - text: "Só a (a), porque é física, e querer não é uma causa real."
        feedback: |
          Querer chá é a razão de *você* ter acendido a chama. Ignorar isso deixa de fora uma parte real da história.
      - text: "Só a (b), porque propósitos explicam mais que moléculas."
        feedback: |
          A história molecular explica a fervura em si. Sem ela, o propósito não aqueceria nada.
      - text: "Elas se contradizem, então uma deve ser falsa."
        feedback: |
          Não se contradizem: são dois níveis de explicação de um mesmo evento.
    explanation: |
      Alguns pensadores aplicam isso a *Ciência e Religião*: a ciência responde às perguntas de "como", a religião às de "por quê" ou "para quê", então não entram em conflito (uma visão muitas vezes chamada de "magistérios não sobrepostos", segundo Stephen Jay Gould, 1941-2002). Outros respondem que as religiões também fazem afirmações sobre como o mundo é, por exemplo sobre origens ou milagres, então podem entrar em conflito. O nível compara quatro maneiras de relacionar as duas.

  - type: mcq
    id: p-mind
    title: "Enigma: Mary e a cor vermelha"
    prompt: |
      Mary é uma cientista brilhante que viveu a vida toda num quarto em preto e branco. Ela conhece todos os fatos físicos sobre cor e visão: luz, olhos e cérebros. Um dia ela sai e vê um tomate maduro. Ela aprende algo novo?
    options:
      - text: "Parece que sim (ela aprende como o vermelho se parece), e esse é o enigma: ou há fatos além dos fatos físicos, ou aprender como é uma experiência não é aprender um fato novo."
        correct: true
      - text: "Não: ela já sabia tudo, então não resta nada a aprender."
        feedback: |
          Esta é uma resposta séria (alguns filósofos a dão), mas precisa explicar por que ver o vermelho ainda parece uma descoberta. Muita gente acha "nada de novo" difícil de aceitar no começo.
      - text: "Ela aprende que os tomates são vermelhos."
        feedback: |
          Ela poderia saber por descrições que os tomates são chamados de vermelhos; o enigma é sobre a *experiência* do vermelho.
      - text: "O enigma mostra que a cor não existe."
        feedback: |
          Nada na história diz isso. A pergunta é sobre o que o conhecimento físico deixa de fora, se é que deixa algo.
    explanation: |
      Este é o experimento mental do filósofo Frank Jackson (1982). Ele abre o nível *Consciência*, que trata da **consciência** (o fato de haver algo que é como ser você). Segundo os fisicalistas, os fatos físicos são todos os fatos; segundo outros, eles deixam de fora como a experiência é sentida. Mantemos as duas na mesa.

  - type: mcq
    id: p-altered
    title: "Enigma: um sonho que parece real"
    prompt: |
      Num sonho vívido, tudo parece completamente real: você tem certeza de que está acordado. O que esse sentimento de certeza lhe diz sobre se o sonho é real?
    options:
      - text: "Muito pouco: o cérebro pode produzir o sentimento de certeza sem que nada fora dele corresponda, então a certeza sozinha não é um teste."
        correct: true
      - text: "Muito: um sentimento tão forte não seria produzido à toa."
        feedback: |
          Sentimentos fortes aparecem em sonhos, no medo e em ilusões. A força do sentimento não é um registro do que há fora.
      - text: "Prova que o sonho é real."
        feedback: |
          Então todo sonho seria real. O sentimento acompanha experiências reais e irreais igualmente.
      - text: "Prova que tudo o que experimentamos é um sonho."
        feedback: |
          Longe demais. O sonho mostra que sentimentos de realidade podem enganar, não que toda experiência engana.
    explanation: |
      O nível *Estados Alterados da Mente* (sonhos, meditação, drogas e experiências de quase morte) pergunta o que tais estados mostram. A mesma lição ajuda: o que foi **documentado** (relatos, medições cerebrais) se separa do que é **interpretado** (se a experiência foi de algo real). Pesquisadores e as pessoas que têm essas experiências muitas vezes leem o mesmo relato de modo diferente.

  - type: mcq
    id: p-mystic
    title: "Enigma: pessoas diferentes compartilham uma mesma experiência?"
    prompt: |
      Pessoas de religiões muito diferentes relatam um profundo sentimento de unidade ou paz. Suponha que você queira saber se isso sugere um **núcleo comum** por trás de suas experiências. Qual achado contaria como o indício mais forte?
    options:
      - text: "Pessoas que nunca ouviram falar das tradições umas das outras descrevem as mesmas características, com palavras espontâneas."
        correct: true
      - text: "Pessoas da mesma tradição a descrevem com as palavras da própria tradição."
        feedback: |
          Esperado de qualquer modo: as pessoas usam a linguagem que conhecem. Isso não separa um núcleo comum de uma tradição que molda a experiência.
      - text: "Uma pessoa famosa diz que todas as religiões são iguais."
        feedback: |
          Autoridade não é evidência do que os outros experimentaram.
      - text: "Todos concordam que a experiência foi agradável."
        feedback: |
          Um sentimento de bem-estar é comum a muitas experiências, religiosas ou não, e diz pouco sobre sua fonte.
    explanation: |
      Segundo a visão do "núcleo comum" (**perenialismo**), os místicos de todas as tradições encontram a mesma realidade com palavras diferentes. Segundo os **construtivistas**, a tradição molda a própria experiência, então não há um único núcleo. O nível *Experiência Religiosa e Misticismo* testa as duas visões contra relatos.

  - type: mcq
    id: p-why
    title: "Enigma: o farfalhar no capim"
    prompt: |
      Nossos ancestrais ouviram um farfalhar no capim. Podia ser o vento (inofensivo) ou um predador escondido (mortal). Confundir o vento com um predador custa um pouco de energia; confundir um predador com o vento pode custar uma vida. Que tipo de mente isso favorece?
    options:
      - text: "Uma que tende a ver alguém ou algo por trás dos eventos, mesmo quando não há nada (um viés de detectar agentes em excesso)."
        correct: true
      - text: "Uma que nunca reage a sons."
        feedback: |
          Essa mente seria devorada. Deixar passar um predador real custa muito mais que um alarme falso.
      - text: "Uma que espera uma prova antes de reagir."
        feedback: |
          Esperar a prova é lento, e nesse cenário lento pode ser fatal.
      - text: "Uma que não distingue vento de predadores de modo algum."
        feedback: |
          A tendência não é cegueira, mas um viés numa direção: alarmes falsos são baratos.
    explanation: |
      Segundo alguns pesquisadores da **ciência cognitiva da religião**, tal viés pode ajudar a explicar por que os humanos imaginam com facilidade mentes por trás dos eventos. O nível *Por Que os Humanos Acreditam* pergunta o que tais explicações mostram. Uma visão estrita diz que explicar a **origem** de uma crença nada nos diz sobre se ela é verdadeira; uma visão qualificada diz que isso pode diminuir nossa confiança no processo por trás da crença. Este é o debate origem versus verdade que você encontrou em *Fora da Nossa Bolha*, e é um debate em aberto.

  - type: mcq
    id: p-torah
    title: "Enigma: olho por olho"
    prompt: |
      Uma lei antiga da Bíblia Hebraica (Êxodo 21:24) diz "olho por olho". Suponha que você precise aplicá-la com justiça num tribunal de verdade. Que dificuldade surge se você a tomar **ao pé da letra**?
    options:
      - text: "É difícil tornar o dano exatamente igual: uma pessoa que já perdeu um olho é mais prejudicada ao perder o outro do que uma pessoa com dois."
        correct: true
      - text: "Não há dificuldade: uma leitura literal é fácil de aplicar."
        feedback: |
          Tente: como você tira "o mesmo" de uma pessoa a quem já falta um membro, ou de alguém cuja lesão não pode ser repetida? Dano igual não é tão simples.
      - text: "A lei não pode se aplicar a olhos, só a dentes."
        feedback: |
          A frase lista várias partes do corpo; a dificuldade é sobre dano igual, não sobre qual parte.
      - text: "Qualquer leitura deve estar errada."
        feedback: |
          Muitas leituras são possíveis; a pergunta é como uma comunidade decide entre elas.
    explanation: |
      Segundo a tradição rabínica (a Mixná, tratado Bava Kamma 8:1, e o Talmude, Bava Kamma 83b-84a), o versículo é lido como exigindo compensação em dinheiro por um dano. Outros leitores o entenderam como um limite literal à vingança. O nível *Judaísmo e a Torá* mostra como funciona uma tradição de interpretação, e por que ela discute o sentido por séculos.

  - type: mcq
    id: p-gospels
    title: "Enigma: quatro testemunhas"
    prompt: |
      Quatro testemunhas descrevem a mesma batida de carros. Elas discordam sobre a cor do carro e sobre quem falou primeiro, mas todas dizem que a batida aconteceu no mesmo cruzamento. O que um investigador cuidadoso concluiria?
    options:
      - text: "O núcleo (uma batida naquele cruzamento) é bem sustentado porque relatos independentes concordam nele; as diferenças nos detalhes precisam de explicação à parte, como memória ou ponto de vista."
        correct: true
      - text: "Nada aconteceu, já que as testemunhas discordam."
        feedback: |
          Discordar nos detalhes é normal. A concordância no núcleo é o sinal mais forte.
      - text: "A testemunha mais detalhista deve estar certa em tudo."
        feedback: |
          Mais detalhe não é mais exatidão; detalhes vívidos podem ser inventados pela memória.
      - text: "A discordância prova que as quatro estavam mentindo."
        feedback: |
          Testemunhas honestas muitas vezes diferem. Mentir é uma explicação entre muitas, não o padrão.
    explanation: |
      Os historiadores que estudam os quatro Evangelhos (os primeiros relatos cristãos da vida de Jesus) usam esse tipo de raciocínio: onde os relatos concordam, onde diferem, e por quê? Segundo os cristãos, os Evangelhos são testemunho inspirado de eventos reais; os historiadores, como historiadores, perguntam o que pode ser estabelecido com a evidência. O nível *Cristianismo e os Evangelhos* mantém visíveis esses dois tipos de afirmação.

  - type: mcq
    id: p-quran
    title: "Enigma: mantendo um texto exato"
    image:
      src: img/quran-topkapi.webp
      alt: Uma folha de um manuscrito antigo do Alcorão escrita em caligrafia cúfica angular com faixas decorativas
      caption: Uma folha do manuscrito de Topkapı, um Alcorão copiado à mão muito antigo, em escrita cúfica, hoje guardado em Istambul, datado pelos estudiosos de cerca do século VIII EC.
      credit: "Unknown artist, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Topkapi_92.8-93.6.png"
    prompt: |
      Um texto longo é transmitido por memória e recitação antes de qualquer cópia ser amplamente escrita. Qual prática o protegeria melhor de mudanças lentas?
    options:
      - text: "Muitas pessoas o memorizam, o recitam juntas e se conferem umas às outras, de modo que o erro de uma é pego pelas demais."
        correct: true
      - text: "Uma pessoa de confiança o memoriza e todos os outros perguntam a ela."
        feedback: |
          Uma fonte única pode se enganar, e ninguém confere o texto com mais nada.
      - text: "Todos o recontam com as próprias palavras."
        feedback: |
          Então a redação mudaria rápido. Uma redação fixa exige uma conferência fixa.
      - text: "Ninguém o aprende, já que pode ser consultado."
        feedback: |
          Isso não mantém nenhuma conferência oral e depende inteiramente de cópias escritas.
    explanation: |
      Segundo a tradição muçulmana, o Alcorão foi recitado e memorizado desde a época do Profeta Maomé (c. 570-632 EC) e depois reunido por escrito; a recitação por muitos fiéis é uma das formas de preservá-lo. Os historiadores estudam o processo de sua escrita e as primeiras cópias, e alguns debatem detalhes da cronologia. O nível *Islã e o Alcorão* separa o que a tradição sustenta do que os estudiosos encontram nos manuscritos.

  - type: mcq
    id: p-self
    title: "Enigma: onde está a carruagem?"
    prompt: |
      Desmonte uma carruagem: rodas, eixo, estrutura, rédeas, tudo em pilhas separadas. Pergunte: "A carruagem são as rodas? o eixo? a estrutura?" Cada resposta é não. Onde está, então, **a carruagem**? Qual resposta lhe parece mais natural?
    options:
      - text: "'Carruagem' é um nome para as partes reunidas de um certo modo; não há nenhuma coisa extra além delas."
        correct: true
      - text: "A carruagem é um objeto escondido dentro das partes."
        feedback: |
          Nada é encontrado quando as partes são vasculhadas. Esta é a resposta que o enigma quer pôr em questão.
      - text: "A carruagem está na mente do dono."
        feedback: |
          Uma carruagem pode ser puxada por cavalos seja o que for que alguém pense, então o nome não é só uma coisa mental.
      - text: "O enigma mostra que não há partes."
        feedback: |
          As partes são bem reais; o enigma é sobre se o todo é algo mais.
    explanation: |
      Segundo um antigo texto budista, as *Perguntas do Rei Milinda*, este é o argumento usado para dizer que não há um **eu** imutável (*anatta*, "não-eu") por trás das partes de uma pessoa: corpo, sentimentos, pensamentos. Segundo as Upanixades e o pensamento hindu posterior, existe tal eu (*atman*) que é o mesmo através das mudanças. Os dois níveis *Pensamento Hindu* e *Pensamento Budista* exploram essas duas respostas a uma só pergunta: o que, se é que algo, é "você"?

  - type: mcq
    id: p-world
    title: "Enigma: uma história antiga e uma linha de costa"
    prompt: |
      Muitas comunidades transmitem histórias de boca em boca. Algumas histórias aborígenes australianas falam de costas que já foram terra seca. Uma equipe de pesquisadores comparou 21 dessas histórias com o registro geológico. Se uma história realmente guardou a memória de eventos, o que você esperaria encontrar?
    options:
      - text: "Uma correspondência entre detalhes da história e evidência independente sobre a terra e o mar daquela época, por exemplo uma linha de costa que se moveu."
        correct: true
      - text: "Nenhuma correspondência: histórias nunca guardam nada de verdadeiro."
        feedback: |
          Forte demais. Histórias podem guardar informação real por muito tempo, embora por quanto tempo, e com que confiabilidade, seja debatido.
      - text: "Uma correspondência é garantida: toda história antiga é exata."
        feedback: |
          Não. Histórias também mudam e acrescentam coisas. Uma correspondência precisa ser verificada, não presumida.
      - text: "A história prova o que as pessoas acreditam sobre o sagrado."
        feedback: |
          Uma correspondência com a costa poderia apoiar a memória de eventos da história; crenças sobre o sagrado são outro tipo de afirmação.
    explanation: |
      Patrick Nunn e Nicholas Reid (2016) argumentaram que tais histórias são compatíveis com a subida do mar após a última era glacial, há mais de 7.000 anos; essa afirmação é debatida entre estudiosos da tradição oral. O nível *Outras Tradições pelo Mundo* descreve as tradições como seus membros o fazem, e diz com clareza o que é documentado e o que é fé.

  - type: mcq
    id: p-spirit
    title: "Enigma: distinguir um médium de um bom adivinhador"
    image:
      src: img/kardec.webp
      alt: Fotografia de estúdio do século XIX de Allan Kardec, um homem de testa alta e casaco escuro
      caption: Allan Kardec (1804-1869) foi o pseudônimo do professor francês Hippolyte Léon Denizard Rivail, que expôs o Espiritismo em O Livro dos Espíritos (1857).
      credit: "Unknown author (Gallica, Bibliothèque nationale de France), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Photo_Kardec.jpg"
    prompt: |
      Uma médium diz que está transmitindo mensagens de uma pessoa que morreu. Ela dá detalhes que espantam quem ouve: um nome, uma música favorita. Como um teste poderia separar informação real de adivinhação esperta (ler sinais e fazer afirmações amplas)?
    options:
      - text: "Pedir detalhes específicos que ninguém presente poderia saber ou consultar, e fazer o ouvinte julgar às cegas qual entre vários conjuntos de mensagens era destinado a ele."
        correct: true
      - text: "Perguntar se o ouvinte se emocionou com a mensagem."
        feedback: |
          Emocionar-se é real, mas um bom adivinhador pode emocionar as pessoas. O sentimento não separa as duas explicações.
      - text: "Contar quantas afirmações estavam certas, ignorando as erradas."
        feedback: |
          Isso é escolher a dedo: contar os acertos e ignorar os erros faz qualquer adivinhador parecer bom.
      - text: "Aceitar, porque nenhum teste é possível."
        feedback: |
          Testes são possíveis, e tanto espíritas quanto críticos propuseram alguns.
    explanation: |
      O **Espiritismo** (a doutrina exposta por Allan Kardec, 1804-1869) sustenta que os espíritos dos mortos podem se comunicar com os vivos. Segundo seus seguidores, os médiuns deram informação genuína; segundo os críticos, os resultados se explicam por leitura fria e acaso. O nível *Espiritismo* pergunta: o que é afirmado, o que é documentado e o que contaria como um teste justo.

  - type: numeric
    id: p-aliens
    title: "Enigma: quantos vizinhos?"
    image:
      src: img/fermi.webp
      alt: Fotografia do físico Enrico Fermi de meia-idade, de terno e gravata
      caption: Enrico Fermi (1901-1954), físico ítalo-americano e Prêmio Nobel (1938), fez sua famosa pergunta sobre civilizações extraterrestres numa conversa durante um almoço em Los Alamos, no verão de 1950.
      credit: "Department of Energy. Office of Public Affairs, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Enrico_Fermi_1943-49_(cropped).jpg"
      place: bottom
    prompt: |
      Nossa galáxia, a Via Láctea, tem cerca de 100 bilhões de estrelas. Suponha, como um mero palpite, que só **uma estrela em um bilhão** acabe com uma civilização capaz de se comunicar pelo espaço. Cerca de quantas dessas civilizações haveria?
    answer: 100
    tolerance: 0.001
    answerText: '100'
    hint: "Uma em um bilhão de 100 bilhões: quantos bilhões cabem em 100 bilhões?"
    explanation: |
      100 bilhões divididos por 1 bilhão dá 100. Mude o palpite para uma em um trilhão e a resposta cai para um décimo de uma civilização. O resultado oscila com um palpite que ninguém pode verificar, e é por isso que o nível *Alienígenas e a Perspectiva Cósmica* examina a equação de Drake (um modo de organizar esses palpites) e a pergunta de Fermi, "onde está todo mundo?" (Enrico Fermi, 1950).

  - type: mcq
    id: p-language
    title: "Enigma: 'ama' significa o mesmo?"
    image:
      src: img/aquinas.webp
      alt: Retrato pintado de Tomás de Aquino em hábito dominicano preto e branco sobre fundo dourado, por Carlo Crivelli
      caption: Tomás de Aquino (1225-1274), frade dominicano e teólogo italiano, num painel que Carlo Crivelli pintou em 1476 (National Gallery, Londres); sua Suma Teológica está entre as obras medievais mais influentes sobre como palavras humanas podem falar de Deus.
      credit: "Carlo Crivelli, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Aquinas_by_Carlo_Crivelli.png"
      place: bottom
    prompt: |
      Um crente diz "Deus nos ama". Uma mãe diz "eu amo meu filho". A palavra "ama" é usada exatamente no mesmo sentido?
    options:
      - text: "Possivelmente não: alguns pensadores dizem que a palavra é usada por analogia (parecida, não idêntica), outros que é um símbolo ou uma imagem, e outros que é dita em sentido literal."
        correct: true
      - text: "Sim, exatamente, já que uma palavra tem só um significado."
        feedback: |
          As palavras mudam com a coisa que descrevem: "saudável" significa coisas diferentes para uma pessoa, uma dieta e um clima.
      - text: "Não, e então a frase não diz nada."
        feedback: |
          Uma frase pode ter significado mesmo que a palavra seja esticada. Se tem aqui é o objeto do debate.
      - text: "Não importa o que 'ama' significa."
        feedback: |
          Importa: o que queremos dizer decide o que poderia contar como evidência a favor ou contra a afirmação.
    explanation: |
      Segundo Tomás de Aquino (1225-1274), tais palavras se aplicam a Deus por **analogia**. Segundo outros, a linguagem religiosa é simbólica ou expressa atitudes em vez de fatos; outros sustentam que é literal. O nível *Linguagem, Significado e Linguagem Religiosa* compara essas visões.

  - type: mcq
    id: p-faith
    title: "Enigma: você sabe que o seu bilhete perde?"
    prompt: |
      Você tem um bilhete numa loteria justa de um milhão de bilhetes. Você está quase certo de que ele vai perder. Você **sabe** que ele vai perder?
    options:
      - text: "Depende do que 'saber' exige: se saber exige descartar qualquer chance de erro, então não; se alta certeza basta, então sim. Pessoas ponderadas discordam sobre o padrão."
        correct: true
      - text: "Sim, já que as chances são de 999.999 para 1."
        feedback: |
          Chances altas são fortes, mas muita gente hesita em dizer "eu sei" sobre um bilhete, e o enigma pergunta por quê.
      - text: "Não, já que qualquer coisa pode acontecer."
        feedback: |
          Levado a sério, isso significaria que não sabemos quase nada, inclusive fatos comuns. A maioria dos pensadores busca um caminho do meio.
      - text: "A pergunta não tem resposta possível."
        feedback: |
          Tem várias respostas, cada uma ligada a uma visão do que o conhecimento exige.
    explanation: |
      Em relação a isso, *Fé, Razão e Conhecimento* pergunta como a fé (confiança, esperança, crença sem prova completa) difere do conhecimento e quanta certeza qualquer crença pode ter. Os **falibilistas** aceitam que podemos saber coisas mesmo restando alguma chance de erro; visões mais estritas exigem mais.

  - type: mcq
    id: p-life
    title: "Enigma: a máquina de experiências"
    prompt: |
      Uma máquina pode lhe dar qualquer vida que você escolher, perfeitamente agradável e com aparência de completamente real, mas é uma simulação e você não se lembraria de tê-la escolhido. Suponha que você recusaria. Que crença sobre uma boa vida a sua recusa sugere?
    options:
      - text: "Que uma boa vida é mais que sentimentos agradáveis: também queremos de fato fazer coisas e estar em contato com a realidade."
        correct: true
      - text: "Que o prazer é a única coisa que importa."
        feedback: |
          Se o prazer fosse tudo o que importa, a máquina seria a melhor oferta sobre a mesa.
      - text: "Que a máquina não funcionaria de verdade."
        feedback: |
          O enigma estipula que ela funciona. O teste é se sentir é tudo o que você quer.
      - text: "Que recusar não prova nada sobre valores."
        feedback: |
          As pessoas discordam sobre o que isso mostra, mas a sua escolha é pelo menos um indício do que você valoriza.
    explanation: |
      O filósofo Robert Nozick (1938-2002) propôs isso em 1974 contra a visão de que só o prazer importa (**hedonismo**, da palavra grega para prazer). Segundo os hedonistas, a intuição pode ser explicada de outro modo; outros a tomam como mostrando outros bens. O nível *Filosofias de Vida* põe várias dessas visões lado a lado.

  - type: mcq
    id: p-death
    title: "Enigma: a morte é ruim para quem morre?"
    image:
      src: img/epicurus.webp
      alt: Busto de mármore de Epicuro, um homem barbado de expressão pensativa
      caption: Uma cópia romana em mármore (hoje no Museu Britânico) de um retrato grego perdido de Epicuro, que ensinou em Atenas que a morte não é nada para quem morre.
      credit: "ChrisO, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Epicurus_bust.jpg"
    prompt: |
      O filósofo antigo Epicuro (341-270 AEC) argumentou, numa carta, com palavras próximas destas: quando eu existo, a morte não está aqui, e quando a morte está aqui, eu não existo; então a morte não é nada para mim. Que resposta muitos filósofos dão?
    options:
      - text: "A morte pode ser ruim por nos privar da boa vida que de outro modo teríamos tido, mesmo que nunca sintamos a perda."
        correct: true
      - text: "Epicuro tem razão e não há mais nada a dizer."
        feedback: |
          Muitos filósofos aceitaram a visão dele, mas outros a acham incompleta. Ela deixa de fora o que o morrer tira.
      - text: "A morte é ruim porque morrer dói."
        feedback: |
          Morrer pode doer, mas Epicuro fala de estar morto, não da dor de morrer.
      - text: "Não podemos falar de morte de modo algum."
        feedback: |
          Filósofos e tradições falam dela há milhares de anos.
    explanation: |
      Esta é a resposta da **privação** (defendida por Thomas Nagel, nascido em 1937). O nível *Sentido, Ética e Morte* a examina ao lado do que as religiões e as visões seculares dizem, incluindo a crença numa vida após a morte (segundo muitas tradições) e a aceitação sem ela (segundo outras).

  - type: text
    id: summary
    body: |
      **O passeio, em forma de tabela.** Cada enigma volta no nível indicado ao lado.

      | Enigma | Nível que o abre |
      |---|---|
      | Testando uma regra secreta | Como a Ciência Sabe |
      | O que mostra um exame do cérebro | Visões da Realidade |
      | Um hotel lotado com quartos sem fim | Matemática e Por Que Ela Funciona |
      | Um universo de sorte | Origens e Ajuste Fino |
      | Dominós sem começo | Argumentos a Favor de Deus |
      | Um pai ou mãe que pode impedir | Argumentos Contra Deus |
      | O problema da pedra | A Natureza de Deus |
      | Por que a chaleira está fervendo? | Ciência e Religião |
      | Mary e a cor vermelha | Consciência |
      | Um sonho que parece real | Estados Alterados da Mente |
      | Pessoas diferentes compartilham uma mesma experiência? | Experiência Religiosa e Misticismo |
      | O farfalhar no capim | Por Que os Humanos Acreditam |
      | Olho por olho | Judaísmo e a Torá |
      | Quatro testemunhas | Cristianismo e os Evangelhos |
      | Mantendo um texto exato | Islã e o Alcorão |
      | Onde está a carruagem? | Pensamento Hindu e Pensamento Budista |
      | Uma história antiga e uma linha de costa | Outras Tradições pelo Mundo |
      | Um médium ou um bom adivinhador | Espiritismo |
      | Quantos vizinhos? | Alienígenas e a Perspectiva Cósmica |
      | "Ama" significa o mesmo? | Linguagem, Significado e Linguagem Religiosa |
      | Você sabe que o seu bilhete perde? | Fé, Razão e Conhecimento |
      | A máquina de experiências | Filosofias de Vida |
      | A morte é ruim para quem morre? | Sentido, Ética e Morte |

      **A seguir:** *Armadilhas*: perguntas rápidas, cada uma construída sobre um equívoco comum deste nível.
