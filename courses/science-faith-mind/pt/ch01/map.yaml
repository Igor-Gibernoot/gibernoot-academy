  - { from: traps, to: parting }

outroTitle: O Nível 1 numa imagem
outro: |
  Uma pergunta honesta (steelman, "segundo") examina as **crenças herdadas**, as **quatro lentes** e os **tipos de razão**. Origens e atalhos são os deslizes de sempre, e no fim as visões se separam por uma **premissa**, um **valor** ou um **tipo de evidência**. A seguir: a Revisão do Nível e depois o Desafio do Nível.
