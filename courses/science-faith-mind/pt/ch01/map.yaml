source_hash: a295ab19aa05
id: ch01-map
title: "Mapa de Conteúdo: As Grandes Perguntas"
kind: map
name: Nível 1, As Grandes Perguntas (como perguntar com honestidade sobre ciência, fé e mente)

intro: |
  Um **mapa de conteúdo** mostra como as ideias de um nível se encaixam. Cada caixa é uma ideia, escrita numa frase. Uma seta vai de uma ideia para outra que se apoia nela, e o rótulo da seta diz como.

  Você vai reconstruir o mapa deste nível uma caixa por vez. Para cada caixa brilhante, escolha o cartão que pertence a ela. Como em toda lição do Nível 1, **adivinhar é o objetivo**: os outros cartões se parecem, mas cada um esconde um erro clássico (uma ligação errada, uma meia-verdade, uma palavra usada para algo que ela não significa), e toda escolha errada vem com uma razão.

  Toque numa caixa pronta a qualquer momento para reler seu cartão.

cols: 3
nodes:
  - id: honest
    title: Uma pergunta honesta
    row: 1
    col: 1
    span: 3
    body: |
      Uma pergunta honesta exige disposição para estar errado, uma **versão mais forte (steelman)** de cada visão (uma visão apresentada como seus melhores defensores a aceitariam) e o hábito de dizer "**segundo**" quem faz a afirmação.
    decoys:
      - body: |
          Uma pergunta honesta exige um **espantalho** de cada visão (uma visão apresentada na forma mais fraca, para que seja fácil de testar) e o hábito de dizer "**todo mundo sabe**" de quem é a afirmação.
        feedback: |
          Um espantalho é o oposto de um steelman: vencer uma versão fraca de uma visão não mostra nada sobre a visão real. E "todo mundo sabe" esconde a fonte, enquanto "segundo" mostra o limite da resposta.
      - body: |
          Uma pergunta honesta exige uma resposta firme escolhida de antemão, um **steelman** só das visões que já compartilhamos e o hábito de dizer "**segundo**" quem faz a afirmação.
        feedback: |
          Uma resposta escolhida de antemão não é uma pergunta. O steelman precisa ser justo com toda visão, sobretudo com as que não compartilhamos.
    explanation: |
      Esta caixa é a raiz: toda outra ideia do nível é uma ferramenta para perguntar com honestidade.

  - id: bubble
    title: Crenças herdadas
    row: 2
    col: 1
    body: |
      A maioria das nossas **crenças** (o que consideramos verdadeiro) é herdada do lugar onde nascemos e das pessoas que conhecemos. Isso não é o mesmo que falso: quase tudo o que sabemos se apoia em **testemunho** (acreditar no que os outros nos dizem), então a pergunta de verdade é quão confiável é a fonte.
    decoys:
      - body: |
          A maioria das nossas **crenças** é escolhida livremente depois de pesar toda a evidência. Uma crença herdada é falsa, porque nunca foi testada.
        feedback: |
          As pesquisas mostram que os adultos mantêm, na maioria, a visão de mundo em que foram criados. E herdado não significa falso: uma crença pode ser transmitida e ainda assim ser verdadeira.
      - body: |
          A maioria das nossas **crenças** é herdada, então o **testemunho** nunca é uma razão: só o que verificamos nós mesmos conta como conhecimento.
        feedback: |
          Ninguém verifica que a Lua está a cerca de 384.000 km. Quase todo conhecimento se apoia em testemunho; o que importa é quão confiável é a fonte.
    explanation: |
      Hume e Reid discordam sobre por que podemos confiar no testemunho (histórico versus confiança por padrão), mas ambos perguntam pela fonte.

  - id: lenses
    title: Quatro lentes
    row: 2
    col: 2
    body: |
      Uma mesma pergunta pode ser vista por quatro **lentes**: ciência, filosofia, teologia e experiência vivida. Cada uma tem suas ferramentas e seu tipo de resposta, então uma resposta numa lente não é automaticamente resposta noutra.
    decoys:
      - body: |
          Uma mesma pergunta pode ser vista por quatro **lentes**: ciência, filosofia, teologia e experiência vivida. Só uma está certa, e as outras são maneiras equivocadas de perguntar.
        feedback: |
          As lentes não disputam um mesmo prêmio. Elas perguntam coisas diferentes: como algo se desenvolveu, o que uma pergunta pressupõe, o que uma fé sustenta, por que isso importa para nós.
      - body: |
          Uma mesma pergunta pode ser vista por quatro **lentes**: ciência, filosofia, teologia e experiência vivida. Todas dão o mesmo tipo de resposta, então a ordem das lentes não importa.
        feedback: |
          Suas respostas diferem em tipo. A ciência descreve o como, a filosofia examina pressupostos, a teologia fala dentro de uma fé, e a experiência vivida mostra por que as pessoas perguntam.
    explanation: |
      Exemplo: "Por que existe algo em vez de nada?" A ciência descreve como o universo se desenvolveu, mas um estado de "nada" não pode ser testado.

  - id: reasons
    title: Tipos de razão
    row: 2
    col: 3
    body: |
      Uma **razão** pode ser **evidência**, **argumento**, **testemunho**, **experiência** ou **confiança**, e cada uma tem sua falha típica: evidência escolhida a dedo, argumento circular, testemunha enganada, ilusão ou erro de memória, confiança numa fonte que não pode saber.
    decoys:
      - body: |
          Uma **razão** pode ser **evidência**, **argumento**, **testemunho**, **experiência** ou **confiança**, e só a evidência pode falhar: as outras quatro são seguras quando são sinceras.
        feedback: |
          Todo tipo pode falhar. Uma testemunha sincera pode se enganar, e uma experiência pode ser uma ilusão que parece exatamente como a coisa real.
      - body: |
          Uma **razão** pode ser **evidência**, **argumento**, **testemunho**, **experiência** ou **confiança**, e um argumento é circular quando uma de suas premissas é falsa.
        feedback: |
          Uma premissa falsa é outra falha. Um argumento é circular quando sua conclusão já está pressuposta numa premissa.
    explanation: |
      A confiança pode até pesar mais que uma evidência fraca no modo como a crença se comporta. Se deveria é um dos pontos em que pessoas ponderadas se separam.

  - id: genetic
    title: Origem não é verdade
    row: 3
    col: 1
    body: |
      Por que alguém acredita é uma pergunta diferente de se é verdade. Argumentar que uma crença é falsa só por causa de onde ela veio é a **falácia genética**, e vale para os dois lados: ela não pode refutar nem um crente nem um cético.
    decoys:
      - body: |
          Por que alguém acredita é uma pergunta diferente de se é verdade. Argumentar que uma crença é falsa só por causa de onde ela veio é **escolher a dedo**, e só funciona contra crentes.
        feedback: |
          Escolher a dedo é mostrar só os casos que se encaixam. Argumentar pela origem é a falácia genética, e ela falha contra qualquer lado.
      - body: |
          Por que alguém acredita é a mesma pergunta que se é verdade: uma crença que podemos explicar pela criação é sempre falsa.
        feedback: |
          A criação explica por que mantemos uma crença, não se ela é verdadeira. Alguns filósofos argumentam que uma origem pode importar em casos especiais, mas nunca como refutação automática.
    explanation: |
      Compare com a lente da filosofia: a pergunta "é verdade?" pede razões, não uma história de vida.

  - id: traps
    title: Atalhos que falham
    row: 3
    col: 3
    body: |
      Armadilhas comuns transformam uma ideia útil num atalho: uma história vívida acima de uma comparação justa, **escolher a dedo** (só os acertos), um argumento **circular** e "raro, logo planejado" (o ganhador de uma loteria era improvável, mas alguém tinha que ganhar).
    decoys:
      - body: |
          Armadilhas comuns transformam uma ideia útil num atalho: uma história vívida acima de uma comparação justa, um **steelman** só do próprio lado e "raro, logo impossível".
        feedback: |
          Eventos raros acontecem o tempo todo: algum bilhete de loteria sempre ganha. E um steelman só do próprio lado não é um steelman.
      - body: |
          Armadilhas comuns transformam uma ideia útil num atalho: uma história vívida acima de uma comparação justa, **escolher a dedo** (só os erros) e "discordância, logo ninguém tem razão".
        feedback: |
          Escolher a dedo mostra só os casos que se encaixam, em geral os acertos. E a discordância só mostra que uma pergunta é difícil ou que as pessoas pesam premissas, valores ou evidências de modo diferente.
    explanation: |
      Cada armadilha é um deslize de raciocínio que pode pegar um crente, um cético e um cientista igualmente.

  - id: parting
    title: Onde as visões se separam
    row: 4
    col: 1
    span: 3
    body: |
      Pessoas ponderadas se separam por uma **premissa** (uma afirmação de partida que aceitam ou rejeitam), um **valor** (o que conta como resposta satisfatória) ou um **tipo de evidência** que aceitam. Mapear esse ponto exato é o progresso que o curso busca, em vez de declarar um vencedor.
    decoys:
      - body: |
          Pessoas ponderadas que discordam devem ser desonestas ou mal informadas. A discordância mostra que a pergunta não tem resposta, então o curso busca declarar um vencedor.
        feedback: |
          Pessoas honestas e bem informadas podem discordar porque partem de premissas diferentes ou pesam a evidência de modo diferente. Difícil não é o mesmo que sem resposta.
      - body: |
          Pessoas ponderadas se separam só pelos **fatos**, nunca por valores: quando todos os dados estão em mãos, toda pessoa honesta chega ao mesmo lugar.
        feedback: |
          Os valores também importam (o que conta como resposta satisfatória), e também a escolha de quais tipos de evidência aceitar.
    explanation: |
      Este é o objetivo do curso: as perguntas certas, com o ponto exato em que as visões se dividem.

edges:
  - { from: honest, to: bubble }
  - { from: honest, to: lenses }
  - { from: honest, to: reasons }
  - { from: bubble, to: genetic, label: alerta para }
  - { from: reasons, to: traps, label: falham como }
  - { from: genetic, to: parting }
