source_hash: 4da586d108c1
id: ch01-traps
title: Armadilhas
kind: traps

cards:
  - type: text
    id: welcome
    title: "Rodada de armadilhas: adivinhar continua sendo o objetivo"
    body: |
      Rodada rápida. Cada pergunta esconde um **erro tentador** que pessoas cuidadosas cometem sobre crenças e razões. Como em toda lição do Nível 1, **adivinhar é o objetivo**: escolha depressa e depois leia o feedback, principalmente quando você acertou por uma razão frágil.

      Nada aqui pergunta se alguma religião ou visão de mundo é verdadeira. Toda armadilha é sobre **como raciocinamos**, e cada uma pode pegar um crente, um cético e um cientista igualmente.

  - type: mcq
    id: story-vs-data
    title: "A história vívida"
    prompt: |
      Uma estudante diz: "Minha amiga usou meias da sorte numa prova e tirou a nota mais alta. Outro estudo, com 500 estudantes, concluiu que a escolha das meias não faz diferença nas notas. Mas eu *vi* funcionar, então confio mais na história da minha amiga do que no estudo." Qual é o erro?
    options:
      - text: Um único caso vívido parece mais forte do que é. Um sucesso é o que o acaso sozinho produz de vez em quando; o estudo com 500 mostra o que costuma acontecer.
        correct: true
      - text: Não há erro; ver algo vale mais que ler a respeito.
        feedback: |
          Ver um caso é informação real, mas é um caso único. Entre muitos estudantes, alguns vão bem usando quaisquer meias, e cada um deles tem uma história vívida.
      - text: Histórias nunca podem ser evidência de nada.
        feedback: |
          Forte demais. Uma história pode ser um bom indício de partida (pode sugerir o que testar). O deslize é deixá-la pesar mais que uma comparação justa de muitos casos.
      - text: O estudo deve estar errado, porque objetos da sorte realmente funcionam.
        feedback: |
          Nada no enunciado diz que o estudo tem falhas. Duvidar dele só porque contraria uma história põe o caso vívido acima dos dados.
    explanation: |
      **Evidência** é um fato que torna uma afirmação mais ou menos provável. Uma história é a ponta memorável de uma pilha de casos, e nunca vemos os casos em que as meias não fizeram nada. Pergunte: *de quantos?* e *comparado com o quê?*

  - type: mcq
    id: genetic
    title: "De onde veio"
    prompt: |
      Alguém diz: "Você só acredita na sua religião porque nasceu numa família que a pratica. Então a sua crença é falsa." (Troque "religião" por qualquer visão de mundo: a mesma frase pode ser dirigida à crença de um cientista em átomos ou à descrença de um cético.) Qual é a melhor resposta?
    options:
      - text: 'Como uma crença foi adquirida não decide, por si só, se ela é verdadeira. Para julgá-la, precisamos olhar as razões que a sustentam agora.'
        correct: true
      - text: 'A pessoa tem razão: toda crença que vem da criação é falsa.'
        feedback: |
          Então a sua crença de que a Terra é redonda também seria falsa, já que a maioria de nós a ouviu primeiro de pais e professores. A criação é um caminho, não um veredito.
      - text: 'A frase está certa, mas só quando dirigida à religião.'
        feedback: |
          A lógica não depende do assunto. Se ela falha contra os átomos, falha contra a religião, e se funcionasse contra a religião funcionaria contra os átomos.
      - text: 'As origens nunca importam, então não há nada a discutir.'
        feedback: |
          Longe demais. Alguns filósofos argumentam que, se uma crença seria mantida *qualquer que fosse* a verdade, porque só a criação a produziu, isso enfraquece nossa confiança nela (um argumento "desmascarador"). É um debate em aberto sobre o quanto enfraquece, não uma prova de falsidade.
    explanation: |
      O passo tentador "veio de lá, então é falso" chama-se **falácia genética** (uma *falácia* é um padrão de raciocínio que parece correto, mas não é). A visão estrita diz que a origem é irrelevante para a verdade; uma visão qualificada diz que a origem pode ser uma razão para *reexaminar* uma crença. As duas concordam que ela não pode, sozinha, mostrar que a crença é falsa.

  - type: mcq
    id: strawman
    title: "De quem é a visão?"
    prompt: |
      Num debate, Dana diz: "Os céticos acham que tudo o que não cabe num tubo de ensaio não vale nada, então não conseguem apreciar música nem amor." Qual descrição serve para o movimento de Dana, e o que faria uma versão justa (steelman)?
    options:
      - text: 'É um espantalho (uma caricatura fraca, fácil de derrubar). Um steelman apresentaria a visão do cético como um cético ponderado a aceitaria, por exemplo: afirmações sobre o mundo devem ser apoiadas por evidência, enquanto música e amor podem ter valor sem serem afirmações desse tipo.'
        correct: true
      - text: 'É um steelman, porque deixa a visão do cético tão clara e forte quanto possível.'
        feedback: |
          Um steelman é a forma mais forte *que seus defensores aceitariam*. Poucos céticos aceitariam "não vale nada", então isto é o oposto de um steelman.
      - text: 'É justo, já que alguns céticos dizem isso.'
        feedback: |
          Uns poucos podem dizer, mas o teste é se os *melhores* defensores aceitariam a descrição. Argumentar contra a versão mais fraca prova pouco sobre a visão em si.
      - text: 'Um steelman teria de concordar com o cético.'
        feedback: |
          Não. Fazer um steelman é apresentar uma visão em sua forma mais forte, não aceitá-la. Você pode depois discordar por razões mais fortes.
    explanation: |
      Julgue uma visão só depois de reapresentá-la de modo que seus melhores defensores digam "sim, é isso que queremos dizer". Isso vale para toda posição deste curso, seja quem for que a sustente.

  - type: mcq
    id: all-same
    title: "Todos os caminhos, um só cume?"
    prompt: |
      Um palestrante diz: "Todas as grandes religiões ensinam a mesma coisa no fundo, então suas discordâncias não importam." Qual é a resposta mais cuidadosa?
    options:
      - text: 'Segundo alguns pensadores (perenialistas) há um núcleo comum, mas muitos estudiosos e muitos crentes respondem que as tradições diferem em questões básicas, como se Deus é uma pessoa, se vivemos uma vez ou muitas vidas e qual é o objetivo da vida. Se o núcleo comum pesa mais que as diferenças é um debate em aberto.'
        correct: true
      - text: 'O palestrante tem razão: as tradições são idênticas em seus ensinamentos.'
        feedback: |
          As tradições coincidem em alguns ensinamentos morais, mas discordam em questões que elas mesmas consideram centrais (por exemplo, uma vida ou muitas). "Idênticas" é muito mais forte do que qualquer estudioso afirma.
      - text: 'O palestrante está errado: as tradições não têm nada em comum.'
        feedback: |
          Também forte demais. Muitas compartilham, por exemplo, a preocupação com a compaixão. O erro é a forma tudo ou nada.
      - text: 'As discordâncias não importam, porque a verdade não pode ser conhecida.'
        feedback: |
          Essa é outra posição (uma forma de ceticismo) e precisa do seu próprio argumento. Os crentes de cada tradição costumam achar que as discordâncias importam muito.
    explanation: |
      "Todas dizem o mesmo" soa respeitoso, mas pode esconder diferenças reais, e os crentes muitas vezes sentem que isso apaga o que faz da sua tradição a sua. Olhe o que cada tradição diz *segundo ela mesma* antes de comparar.

  - type: mcq
    id: science-god
    title: "A ciência resolveu?"
    prompt: |
      Alguém diz: "A ciência provou que Deus não existe." Outro diz: "A ciência provou que Deus existe." Qual afirmação sobre as duas é a melhor?
    options:
      - text: 'As duas exageram. A ciência testa afirmações sobre coisas mensuráveis na natureza; se existe um ser além da natureza não é, segundo muitos cientistas e filósofos, algo que seus métodos possam decidir num sentido ou no outro. Outros sustentam que algumas versões de Deus podem ser testadas, então até onde a ciência alcança aqui é, em si, debatido.'
        correct: true
      - text: 'A primeira tem razão, porque a ciência explica tudo sem Deus.'
        feedback: |
          Explicar muitas coisas sem mencionar Deus não mostra que não há Deus, assim como explicar um carro sem mencionar quem o projetou não mostra que ele não teve projetista. Se resta uma pergunta adicional é exatamente o que as pessoas debatem.
      - text: 'A segunda tem razão, porque a ciência não consegue explicar tudo.'
        feedback: |
          Lacunas na explicação não provam nada; uma lacuna pode ser preenchida depois, ou a pergunta pode ser de outro tipo. "Não conseguimos explicar" não é evidência para uma resposta em particular.
      - text: 'As duas têm razão, já que ciência e religião são a mesma coisa.'
        feedback: |
          São empreendimentos diferentes, com métodos e objetivos diferentes; mesmo quem as vê como parceiras amigáveis não afirma que são a mesma coisa.
    explanation: |
      "A ciência diz" precisa de um objeto preciso: *qual* afirmação, testada *como*? Afirmações como a idade do universo são científicas. Afirmações sobre propósito ou sobre um ser além da natureza levantam questões de outro tipo, e como elas se ligam à ciência é um debate que encontraremos mais tarde.

  - type: mcq
    id: trust-evidence
    title: "Confiança não é medição"
    prompt: |
      Um homem diz: "Confio plenamente na minha médica, então tudo o que ela diz já está provado." O que isso entende errado?
    options:
      - text: 'A confiança é uma razão para *aceitar* o que uma fonte diz, não uma prova de que está correto. A boa confiança depende de a fonte ter probabilidade de saber, e ainda pode ser conferida (uma segunda opinião, um exame).'
        correct: true
      - text: 'Nada; se você confia plenamente em alguém, o que essa pessoa diz é verdade por definição.'
        feedback: |
          Confiar nos faz *aceitar* uma afirmação; não a torna verdadeira. Até médicos excelentes cometem erros, e é por isso que existem segundas opiniões.
      - text: 'A confiança nunca é uma razão, então ele não deveria acreditar em nada do que ela diz até verificar tudo sozinho.'
        feedback: |
          Ninguém consegue verificar tudo. Segundo Reid (1710-1796), a confiança por padrão no que nos dizem é razoável até que haja razão para duvidar; segundo Hume (1711-1776), a confiança deve se apoiar num histórico. Ambos tratam a confiança como uma razão, de força diferente.
      - text: 'A confiança só importa para a religião.'
        feedback: |
          Contamos com a confiança o tempo todo: na medicina, nos mapas, na história, em boa parte da ciência que não testamos pessoalmente.
    explanation: |
      A confiança está por trás da maior parte do que sabemos, então conta como razão. Mas "confio na fonte" e "a fonte está certa" são afirmações diferentes; o intervalo entre elas é a razão de perguntarmos se uma fonte realmente poderia saber.

  - type: mcq
    id: hits-misses
    title: "Conte os erros também"
    prompt: |
      Um previsor diz: "No ano passado previ 100 eventos. Estes 5 aconteceram, então sou um ótimo previsor!" Ele mostra só os 5 acertos. Qual é o problema?
    options:
      - text: 'É escolher a dedo: sem os outros 95 erros, 5 acertos podem ser apenas o que o acaso produz. Um registro justo mostra acertos e erros juntos.'
        correct: true
      - text: 'Não há problema; 5 sucessos são 5 sucessos.'
        feedback: |
          Cinco acertos em 100 é um aproveitamento de 5%, que pode não ser melhor que chutar. O número sozinho não significa nada sem o total.
      - text: 'Ele deve estar mentindo sobre os 5 acertos.'
        feedback: |
          Os 5 acertos podem ser todos verdadeiros. O problema é o que a apresentação deixa de fora, e é assim que a evidência seletiva engana com honestidade.
      - text: 'Previsões nunca podem ser julgadas.'
        feedback: |
          Podem, mantendo o registro inteiro. É exatamente isso que ele evita.
    explanation: |
      **Escolher a dedo** é mostrar só os casos que se encaixam. O mesmo deslize aparece quando lembramos das vezes em que um palpite se confirmou e esquecemos das vezes em que não. Peça o registro inteiro, acertos e erros.

  - type: mcq
    id: circle
    title: "Em círculos"
    prompt: |
      Alguém argumenta: "Meu horóscopo é preciso, porque o astrólogo que o escreveu diz que é, e o astrólogo é confiável porque horóscopos como o meu são precisos." O que há de errado?
    options:
      - text: 'O argumento é circular: cada afirmação é sustentada só pela outra, então quem duvida de uma não tem razão para aceitar a outra. Precisamos de apoio de fora do círculo.'
        correct: true
      - text: 'Uma de suas premissas é verdadeira, então o argumento é bom.'
        feedback: |
          Uma premissa verdadeira não salva um círculo. Mesmo que as duas afirmações fossem verdadeiras, o argumento não dá nenhuma razão independente para acreditar em nenhuma delas.
      - text: 'Não é circular, já que tem duas afirmações diferentes.'
        feedback: |
          Duas afirmações diferentes ainda podem formar um círculo quando cada uma é justificada só pela outra.
      - text: 'Todos os argumentos são circulares, então este não é pior que os outros.'
        feedback: |
          Alguns filósofos dizem que um ponto de partida totalmente livre de círculo pode não existir, mas mesmo assim buscam apoio externo. Este círculo não oferece nenhum: nunca encontra o mundo.
    explanation: |
      Um **argumento circular** pressupõe numa premissa o que quer provar. Um bom teste: um cético paciente, partindo da dúvida, poderia ser movido por ele? Aqui, não.

  - type: mcq
    id: sincere
    title: "Sincero não é o mesmo que certo"
    prompt: |
      Uma testemunha diz: "Vi claramente uma figura alta na estrada à noite, e eu juraria." Duas pessoas que ouvem isso discutem. Quem raciocina melhor?
    options:
      - text: 'Quem diz que a sinceridade torna provável que a testemunha relate o que experimentou, mas que ser sincero não torna a experiência exata: pouca luz, expectativa e memória podem produzir uma imagem vívida e equivocada.'
        correct: true
      - text: 'Quem diz que uma testemunha sincera não pode estar errada.'
        feedback: |
          A sinceridade diz respeito à honestidade, não à exatidão. Uma pessoa pode ser completamente honesta e completamente enganada.
      - text: 'Quem diz que a testemunha deve estar mentindo, porque ninguém vê coisas à noite.'
        feedback: |
          Não há razão para suspeitar de mentira, e as pessoas veem coisas à noite. A pergunta é quão confiável é um relato assim, não se é desonesto.
      - text: 'Quem diz que o relato não vale nada, já que é só de uma pessoa.'
        feedback: |
          Um relato é fraco, mas não inútil. Pode ser um indício, e fica mais forte se testemunhas independentes concordam.
    explanation: |
      **Testemunho** é o que alguém nos diz que viu ou sabe. Ele pode falhar de dois modos: a testemunha é desonesta, ou está honestamente enganada. A sinceridade exclui só o primeiro.

  - type: mcq
    id: experience
    title: "Sem valor ou conclusiva?"
    prompt: |
      Duas pessoas discutem sobre alguém que diz: "Senti uma presença forte no quarto." Anna diz: "Experiência não vale nada; está tudo na cabeça." Ben diz: "A experiência é a melhor prova que existe; eu senti, então é real." Qual comentário descreve melhor as duas?
    options:
      - text: 'As duas vão longe demais. A experiência é um tipo real de razão para quem a tem, mas pode ser uma ilusão que parece exatamente como a coisa real, então os outros podem pedir mais. O que ela mostra, e para quem, é um debate em aberto.'
        correct: true
      - text: 'Anna tem razão: como as experiências podem ser ilusões, elas não contam para nada.'
        feedback: |
          A visão também pode nos enganar, e não dizemos que ver não vale nada. Falível não é o mesmo que inútil; damos peso a uma experiência e a conferimos onde podemos.
      - text: 'Ben tem razão: se pareceu real, é real.'
        feedback: |
          Os sonhos parecem reais enquanto duram. Parecer real faz parte do que é uma ilusão.
      - text: 'Nenhuma: nunca deveríamos falar de experiências.'
        feedback: |
          As experiências estão entre as razões mais básicas que temos, então evitá-las deixaria de fora boa parte do que as pessoas de fato seguem.
    explanation: |
      Muitas pessoas tratam a própria experiência como uma razão forte para si mesmas, enquanto para os outros ela conta mais como um relato a ser pesado. Tanto Anna quanto Ben transformam "pode estar errada" ou "pode estar certa" em "sempre".

  - type: mcq
    id: only-opinion
    title: "Só uma opinião?"
    prompt: |
      Numa discussão alguém diz: "Isso é só a sua opinião, e todos têm direito à sua opinião, então não podemos dizer que uma visão é melhor que outra." Qual é o deslize?
    options:
      - text: 'Ter o direito de sustentar uma opinião não torna todas as opiniões igualmente bem apoiadas. As visões podem ser comparadas por suas razões: evidência, solidez do argumento, como lidam com objeções.'
        correct: true
      - text: 'Não há deslize; se todos podem sustentar uma visão, todas as visões são igualmente boas.'
        feedback: |
          Ter direito a uma visão é questão de liberdade, não de qualidade. Alguém pode acreditar livremente que a Lua é de queijo; isso não torna a visão tão boa quanto as outras.
      - text: 'As opiniões deveriam ser proibidas quando não são provadas.'
        feedback: |
          Ninguém precisa de prova para ter permissão de ter uma opinião. O ponto é apenas que as opiniões diferem em quão bem são apoiadas.
      - text: 'O deslize é pensar que razões importam nesses assuntos.'
        feedback: |
          Isso é só mais uma visão, e também precisa de razões para ser acreditada. A maioria das pessoas, de todos os lados, dá razões para o que sustenta.
    explanation: |
      Esta é a armadilha oposta à arrogância: usar "todo mundo tem uma visão" para evitar comparar razões. Podemos respeitar as pessoas e ainda assim perguntar quais visões são mais bem apoiadas.

  - type: mcq
    id: lottery
    title: "Improvável demais para ser acaso?"
    prompt: |
      Uma loteria tem 10 milhões de bilhetes, e um é sorteado. O vencedor exclama: "A chance de *este* bilhete ganhar era de uma em dez milhões, então o sorteio deve ter sido manipulado para mim!" O que há de errado nesse raciocínio?
    options:
      - text: 'Alguém tinha que ganhar, e todos os bilhetes eram igualmente improváveis. Um resultado muito improvável não é evidência de planejamento, a menos que tenhamos razão para esperar um planejamento (ou um modo de comparar as duas histórias).'
        correct: true
      - text: 'Nada; um evento de uma em dez milhões não pode acontecer por acaso.'
        feedback: |
          Eventos raros acontecem o tempo todo: *algum* bilhete sempre ganha. A raridade pertence ao vencedor específico, não ao fato de haver um vencedor.
      - text: 'O vencedor deveria concluir que o sorteio foi justo, porque ele ganhou.'
        feedback: |
          Ganhar também não é evidência de justiça. O deslize é tirar uma conclusão só da raridade, em qualquer dos sentidos.
      - text: 'Probabilidades não podem ser usadas para eventos únicos.'
        feedback: |
          Podem; o problema não é usar probabilidade, mas concluir planejamento a partir de um número pequeno sem compará-lo com o que um sorteio manipulado preveria.
    explanation: |
      Improvável não significa planejado. Níveis posteriores voltam a esta forma de argumento para o próprio universo ("ajuste fino"), onde as pessoas se separam sobre exatamente como ela se compara à loteria. A armadilha aqui é só o atalho: **raro, logo planejado**.

  - type: mcq
    id: disagree
    title: "Se eles discordam..."
    prompt: |
      Pessoas ponderadas e honestas discordam sobre se há um Deus. Alguém conclui: "Então ninguém tem razão, ou pelo menos ninguém pode dizer quem tem." Qual é o erro?
    options:
      - text: 'A discordância mostra que a pergunta é difícil ou que as pessoas pesam premissas, valores ou evidências de modo diferente. Não mostra que não há resposta nem que todas as respostas são igualmente boas. Mapear onde e por que as pessoas se separam é como progredimos.'
        correct: true
      - text: 'Não há erro: se os especialistas discordam, não há verdade a encontrar.'
        feedback: |
          Os especialistas já discordaram sobre se os continentes se movem, e a questão foi resolvida pela evidência. A discordância pode persistir porque uma pergunta é difícil, não porque ela não tem resposta.
      - text: 'O erro é que as pessoas que discordam não são honestas.'
        feedback: |
          Pessoas honestas e bem informadas ainda podem discordar, muitas vezes porque partem de premissas diferentes ou dão pesos diferentes à mesma evidência.
      - text: 'O erro é que um dos lados deve simplesmente ser ignorado.'
        feedback: |
          Ignorar um lado não ajuda; a melhor maneira de ver por que as pessoas diferem é apresentar cada lado como seus melhores defensores o fariam.
    explanation: |
      Este é o objetivo do curso: não declarar um vencedor, mas encontrar o ponto exato em que as visões se dividem: uma **premissa** (uma afirmação de partida), um valor ou um tipo de evidência.

  - type: text
    id: summary
    title: "O que você agora domina"
    body: |
      Treze armadilhas, um só padrão: cada uma transformou uma ideia *útil* num atalho.

      - **Uma história vívida não é uma tendência**; pergunte *de quantos*, *comparado com o quê*.
      - **A origem não decide a verdade** (a falácia genética), embora possa motivar um segundo olhar.
      - **Apresente as visões como seus melhores defensores o fariam** (steelman, não espantalho); nenhuma tradição é simplesmente "igual" às outras.
      - **"A ciência provou (ou refutou) Deus"** precisa de uma afirmação precisa e de um teste preciso.
      - **Confiança, sinceridade e experiência são razões reais**, mas não provas.
      - **Escolher a dedo e argumentos circulares** escondem o que falta.
      - **Todos podem ter uma opinião, mas as opiniões diferem em apoio**; **raro não é planejado**; **a discordância é um mapa, não um veredito**.

      **A seguir:** o *Mapa de Conteúdo*. Reconstrua o mapa inteiro do Nível 1, caixa por caixa, entre iscas parecidas.
