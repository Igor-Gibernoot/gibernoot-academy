source_hash: ddc06395b689
id: ch01-reasons
title: O Que Conta como Boa Razão?
kind: concept
own: |
  - **Cinco tipos de razão.** Uma **razão** é algo que nos dá fundamento para sustentar uma afirmação. **Evidência** é um fato que torna uma afirmação mais ou menos provável (uma medição, um registro, um padrão em muitos casos). Um **argumento** é uma cadeia de razões: afirmações de partida chamadas **premissas** levam a uma **conclusão**. **Testemunho** é o que outra pessoa nos diz que viu ou sabe. **Experiência** é o que nós mesmos percebemos ou vivemos. **Confiança** é nossa disposição de depender de uma fonte, e está por trás da maior parte do testemunho, já que raramente verificamos o que nos dizem.
  - **Cada tipo tem uma falha típica.** A evidência falha quando é {{ escolhida a dedo (só os casos que se encaixam foram mostrados) ou escassa demais }}. Um argumento falha quando é {{ circular (a conclusão já está pressuposta numa premissa) ou quando uma premissa é falsa }}. O testemunho falha quando a testemunha se engana ou é desonesta, mesmo sendo sincera. A experiência falha por {{ ilusão e erro de memória, que parecem exatamente como a coisa real }}. A confiança falha quando é depositada numa fonte que não tem como saber.
  - **A confiança pode pesar mais que uma evidência fraca.** Num brinquedo com duas afirmações, suponha que confiamos na fonte da afirmação 1 e na da afirmação 2 nas proporções $0.9$ e $0.1$, e que a evidência se encaixa nelas $0.4$ e $0.6$. A parcela de crença de cada afirmação é sua confiança vezes seu encaixe, reescalada para somar $100\%$:
  $$\frac{0.9\times 0.4}{0.9\times 0.4+0.1\times 0.6}\approx 86\%$$
  Assim a afirmação 1 mantém cerca de $86\%$ embora a evidência favoreça levemente a afirmação 2. Isso descreve como a crença pode se comportar; não diz que ela deve se comportar assim.
  - **Duas visões sobre a confiança.** Segundo **Reid** (1710-1796), {{ a confiança por padrão no que nos dizem é razoável até que haja razão para duvidar }}. Segundo **Hume** (1711-1776), {{ a confiança deve se apoiar num histórico: quantas vezes a fonte acertou }}. Onde pessoas ponderadas se separam: quanta confiança pode contar como razão em si, e se a experiência, um caso único, é evidência para os outros.
cards:
  - type: text
    id: welcome
    title: "Adivinhar continua sendo o objetivo"
    body: |
      A mesma promessa de antes: em toda lição do Nível 1, **adivinhar é o objetivo**. Palpites errados são esperados, e cada um vem com uma razão. Toda palavra técnica é explicada na primeira vez em que aparece.

      Esta lição faz uma pergunta simples: quando dizemos "tenho uma razão para acreditar nisso", **que tipos de razão existem, e como cada um pode dar errado?**

  - type: mcq
    id: hook
    title: "Dois argumentos, um vencedor?"
    prompt: |
      Duas pessoas tentam convencer você de que um chá de ervas cura resfriados.

      **Anna** conta uma história vívida: a tia dela tomou o chá e, dois dias depois, o resfriado passou. **Ben** diz: "Um hospital deu o chá a 1.000 pessoas com resfriado e uma bebida comum, sem sabor, a outras 1.000, sem dizer quem tomou o quê. Os resfriados duraram o mesmo tempo nos dois grupos."

      Antes de qualquer teoria, **adivinhe**: a razão de quem é mais forte, e por quê?
    options:
      - text: A de Ben, porque compara muitas pessoas com uma base justa, então sobra pouco espaço para sorte e coincidência.
        correct: true
      - text: A de Anna, porque uma pessoa real que realmente melhorou convence mais que números.
        feedback: |
          A história é vívida, e o que é vívido parece forte. Mas resfriados costumam passar sozinhos em poucos dias, então a tia poderia ter se recuperado com ou sem o chá. Um único caso não consegue distinguir as duas hipóteses.
      - text: São igualmente fortes, já que cada uma é só a opinião de uma pessoa.
        feedback: |
          Ben não está dando uma opinião sobre uma pessoa. Ele relata o que aconteceu com 2.000 pessoas, com um grupo de comparação. É um tipo diferente de razão, e pesa mais.
      - text: Nenhuma das duas diz coisa alguma sobre o chá.
        feedback: |
          As duas dizem alguma coisa. A história de Anna é fraca, mas não inútil (poderia motivar um teste). A de Ben é muito mais forte.
    explanation: |
      Uma história vívida parece forte porque a imaginamos, mas uma história é **um caso**. O resultado de Ben é uma **comparação** de muitos casos: a mesma doença, com e sem o chá. Essa comparação é o que torna difícil culpar a coincidência. Nem toda razão é igualmente boa, e esta lição dá nome aos tipos.

  - type: text
    id: kinds
    title: "Cinco tipos de razão"
    body: |
      Uma **razão** é algo que nos dá fundamento para sustentar uma afirmação. As pessoas usam sobretudo cinco tipos.

      - **Evidência**: um fato que torna uma afirmação mais ou menos provável, como uma medição, um registro ou um padrão visto em muitos casos.
      - **Argumento**: uma cadeia de razões. As afirmações de partida se chamam **premissas**; elas levam a uma **conclusão**. ("Todos os metais se dilatam quando aquecidos; o ferro é um metal; logo o ferro se dilata quando aquecido.")
      - **Testemunho**: o que outra pessoa nos diz que viu ou sabe. ("A loja fecha às seis.")
      - **Experiência**: o que nós mesmos percebemos ou vivemos. ("Senti o chão tremer.")
      - **Confiança**: nossa disposição de depender de uma fonte sem verificá-la nós mesmos. Não é um quinto fato sobre o mundo; é o que faz o testemunho funcionar.

      As conversas reais misturam todos. Os próximos cartões pedem que você os distinga.

  - type: mcq
    id: kinds-q
    title: "Que tipo é?"
    prompt: |
      Uma médica diz: "A tomografia mostra uma pequena fratura, então você não deve correr por seis semanas." Qual descrição serve melhor?
    options:
      - text: 'A tomografia é evidência; a frase como um todo é um argumento (premissa: o exame mostra uma fratura; conclusão: não corra); e você depende da médica por confiança.'
        correct: true
      - text: É só experiência, porque a médica viu o exame.
        feedback: |
          O olhar da própria médica sobre o exame é experiência para ela. Para você, que não o viu, o relato da médica é testemunho, e o exame em si é evidência.
      - text: É só confiança; evidência e argumento não aparecem.
        feedback: |
          A confiança está presente, já que você provavelmente não sabe ler o exame. Mas o exame é um fato que torna a fratura provável, e "então você não deve correr" é um passo desse fato até uma conclusão.
      - text: É só um argumento, porque uma médica falou.
        feedback: |
          Falar não faz de algo um argumento. Aqui há um argumento, mas ele se apoia em evidência (o exame) e na sua confiança na médica.
    explanation: |
      A maioria das razões do dia a dia são **pacotes**. Separá-las é a habilidade: qual é o fato, qual é o passo do fato à conclusão, e na palavra de quem estamos confiando?

  - type: mcq
    id: testimony-q
    prompt: |
      Um amigo lhe diz: "A linha de trem está fechada hoje." Você não viu a estação. Que tipo de razão você tem, e do que ela depende?
    options:
      - text: 'Testemunho, que depende de quanto você confia no seu amigo: se ele estava em posição de saber e se é honesto.'
        correct: true
      - text: Evidência com a mesma força de um horário de trens que você mesmo leu, já que é o mesmo fato.
        feedback: |
          O fato é o mesmo, mas o caminho até você não é. Um amigo pode estar enganado ou ter lido mal uma placa. Pese a fonte, não só a afirmação.
      - text: Experiência, porque agora você acredita.
        feedback: |
          Experiência significa perceber algo você mesmo. Ouvir de um amigo é testemunho.
      - text: Nenhuma razão, já que você não verificou por conta própria.
        feedback: |
          Quase tudo o que você sabe sobre lugares que não visitou chegou assim. O testemunho é uma razão real, embora sua força dependa da fonte.
    explanation: |
      O testemunho é como o conhecimento viaja: história, geografia, notícias, boa parte dos livros-texto de ciência. Isso faz da **confiança** um dos tipos de razão mais importantes e mais discutidos.

  - type: text
    id: fail
    title: "Todo tipo pode falhar"
    body: |
      Cada tipo de razão tem seu modo típico de dar errado. Tente adivinhar antes de ler os próximos cartões.

      - A **evidência** pode ser **escolhida a dedo** (só os casos que se encaixam são mostrados) ou escassa demais (um punhado de casos).
      - Um **argumento** pode ser **circular** (uma premissa já pressupõe a conclusão) ou pode partir de uma premissa falsa.
      - O **testemunho** pode falhar porque a testemunha se engana ou é desonesta; uma testemunha sincera ainda pode estar errada.
      - A **experiência** pode ser uma ilusão ou uma memória falha, que parecem exatamente como a coisa real.
      - A **confiança** pode ser depositada numa fonte que não tem como saber.

  - type: mcq
    id: cherry
    title: "Ache a falha: evidência"
    prompt: |
      Um anúncio diz: "Quatro clientes que usaram nosso plano de dieta perderam 10 quilos cada um!" Ele não diz quantos clientes usaram o plano. Qual é a fraqueza mais provável?
    options:
      - text: 'A evidência pode ter sido escolhida a dedo: se milhares usaram o plano, quatro sucessos dizem pouco sobre como um cliente típico se sai.'
        correct: true
      - text: Nenhuma; quatro pessoas bastam para provar que um plano funciona.
        feedback: |
          Quatro casos podem ser um começo, mas sem saber quantos tentaram e quantos não perderam peso, eles não nos dizem o que costuma acontecer.
      - text: Os clientes devem estar mentindo.
        feedback: |
          Nada sugere mentira. O problema pode existir mesmo que cada palavra seja verdadeira: mostrar só os sucessos esconde o resto.
      - text: Planos de dieta nunca podem ser testados.
        feedback: |
          Podem, com uma comparação como o teste do chá de Ben. O anúncio só não apresenta uma.
    explanation: |
      Escolher a dedo permite que afirmações verdadeiras somem um quadro enganoso. A pergunta a fazer é sempre: **de quantos?** e **comparado com o quê?**

  - type: mcq
    id: circular
    title: "Ache a falha: argumento"
    prompt: |
      Alguém argumenta: "Este livro está sempre certo, porque o próprio livro diz que está sempre certo." Que tipo de falha é essa, e há uma segunda maneira de ver?
    options:
      - text: 'É circular: a premissa ("o livro diz que está sempre certo") só ajuda se já confiamos no livro. Os defensores de um livro assim respondem que um círculo é difícil de evitar para qualquer fonte que usamos para julgar a si mesma, e buscam também apoio externo.'
        correct: true
      - text: 'É uma premissa falsa: livros nunca dizem nada sobre si mesmos.'
        feedback: |
          Livros podem dizer coisas sobre si mesmos. A premissa pode ser verdadeira; o problema é que ela só convence quem já acredita na conclusão.
      - text: É perfeitamente correto, já que a premissa apoia a conclusão.
        feedback: |
          Um passo com aparência válida não basta. Se aceitar a premissa já exige aceitar a conclusão, o argumento não dá nenhuma razão nova a um leitor que duvida.
      - text: Não é um argumento, porque não tem premissas.
        feedback: |
          Tem uma premissa e uma conclusão. A fraqueza é que uma se apoia na outra.
    explanation: |
      Segundo os críticos, argumentos circulares não podem mover quem parte da dúvida. Uma segunda visão, defendida por alguns filósofos, observa que **toda** maneira de checar nosso raciocínio (até a lógica ou os sentidos) é julgada com algo do mesmo tipo, então um ponto de partida perfeitamente livre de círculo pode não existir. A resposta usual é buscar apoio fora do círculo, não desistir das razões.

  - type: mcq
    id: witness
    title: "Ache a falha: testemunho e experiência"
    prompt: |
      Duas testemunhas honestas de um acidente de carro dão versões diferentes sobre a cor do carro. Nenhuma está mentindo. O que isso mostra?
    options:
      - text: 'Sinceridade não é exatidão: uma testemunha pode relatar com sinceridade uma memória ou percepção errada.'
        correct: true
      - text: Pelo menos uma delas deve estar mentindo.
        feedback: |
          Memória e percepção não são gravações. Pessoas honestas podem lembrar ou perceber mal, sobretudo num momento de estresse, sem mentira alguma.
      - text: O testemunho nunca vale nada.
        feedback: |
          Forte demais. A concordância de várias testemunhas independentes, ou detalhes que podem ser checados, podem tornar o testemunho forte. O ponto é pesá-lo, não descartá-lo.
      - text: A cor não pode ser vista, então ninguém poderia saber.
        feedback: |
          As pessoas veem bem as cores com boa luz. A diferença aqui vem da memória e das circunstâncias, não de a cor ser incognoscível.
    explanation: |
      O mesmo vale para a nossa própria **experiência**: uma ilusão ou uma memória errada parece, por dentro, exatamente como a coisa real. É por isso que buscamos uma segunda fonte (outra testemunha, um registro, um instrumento) quando há muito em jogo.

  - type: widget
    id: mixer-trust
    widget: belief-mixer
    config:
      causes:
        - { name: "Claim 1", prior: 0.9, evidence: 0.4 }
        - { name: "Claim 2", prior: 0.1, evidence: 0.6 }
      sharp: true
      toggle: false
      labels:
        prior: "Trust: how much you trust the source of each claim"
        evidence: "Evidence: how well each claim fits the facts"
        belief: "What you end up believing"
        reset: "Reset"
      presets:
        - { label: "Trust source 1, thin evidence", prior: [0.9, 0.1], evidence: [0.4, 0.6] }
        - { label: "Equal trust, same evidence", prior: [0.5, 0.5], evidence: [0.4, 0.6] }
        - { label: "Trust source 1, strong evidence for 2", prior: [0.9, 0.1], evidence: [0.05, 0.95] }
    body: |
      Um brinquedo com duas afirmações imaginárias. Você confia muito na fonte da Afirmação 1 e pouco na da Afirmação 2 (**controles de cima**). Os fatos se encaixam na Afirmação 2 só um pouco melhor (**controles do meio**). As **barras** mostram onde a crença termina: confiança vezes encaixe, reescalada para que as duas somem $100\%$.

      Experimente: (1) aperte as três predefinições, uma de cada vez; (2) arraste um controle de cima e veja o quanto as barras acompanham; (3) arraste um controle do meio para cima e veja quanta evidência é preciso para mover um leitor confiante.

  - type: numeric
    id: mixer-number
    review: false
    prompt: |
      Duas afirmações. Um leitor confia em suas fontes nas proporções $0.9$ e $0.1$. Os fatos se encaixam nas duas afirmações $0.4$ e $0.6$. A parcela de crença de cada afirmação é sua confiança vezes seu encaixe, reescalada para que as duas parcelas somem $100\%$.

      Que porcentagem de crença a Afirmação 1 mantém? (Arredonde para um número inteiro.)
    answer: 86
    tolerance: 1
    hint: |
      Multiplique confiança por encaixe para cada afirmação: $0.9\times0.4$ e $0.1\times0.6$. Depois divida o primeiro pela soma dos dois.
    explanation: |
      A Afirmação 1 pontua $0.9\times0.4=0.36$ e a Afirmação 2 pontua $0.1\times0.6=0.06$. A soma é $0.42$, então a Afirmação 1 mantém $0.36/0.42\approx 86\%$. A confiança, por um fator de $9$, pesou mais que uma evidência que favorecia a Afirmação 2 só por um fator de $1.5$.

  - type: mcq
    id: trust-views
    title: "Isso é razoável?"
    prompt: |
      No brinquedo, um leitor confiante mantém a Afirmação 1 em cerca de $86\%$ embora os fatos favoreçam levemente a Afirmação 2. Dois pensadores discordam sobre se isso é razoável. **Segundo Thomas Reid** (1710-1796), temos razão em confiar no que nos dizem a menos que haja motivo para duvidar. **Segundo David Hume** (1711-1776), a confiança deve se apoiar num histórico. Qual afirmação corresponde a Hume?
    options:
      - text: Confie numa fonte na medida em que ela acertou antes; uma fonte sem histórico merece menos confiança.
        correct: true
      - text: A confiança é razoável por padrão; o ônus cabe a quem quer que duvidemos.
        feedback: |
          Essa é a visão de Reid: confiança por padrão, retirada só quando há razão para duvidar.
      - text: Nunca confie em ninguém; só verifique as coisas você mesmo.
        feedback: |
          Nenhum dos dois pensadores diz isso. Quase nada do que sabemos poderia ser verificado por uma pessoa numa vida.
      - text: A confiança é um sentimento e não pode ser razoável nem irrazoável.
        feedback: |
          Os dois pensadores tratam a confiança como algo que pode ser melhor ou pior justificado. Eles discordam sobre o que a justifica.
    explanation: |
      Este é um **debate em aberto** (um desacordo real entre pessoas ponderadas). A visão de Reid combina com o modo como as crianças aprendem a língua e os fatos; a de Hume combina com a cautela que usamos com estranhos ou com afirmações incomuns. No brinquedo, a leitura mais forte de Hume é que o $0.9$ deveria ser conquistado por um histórico, não concedido por padrão.

  - type: mcq
    id: trap-anecdote
    title: "Ache a falha: um único caso"
    prompt: |
      Alguém diz: "Meu avô nunca usou cinto de segurança e viveu até os 90, então cinto não vale a pena." Qual é a melhor resposta?
    options:
      - text: Um caso não mostra o que acontece em média; a afirmação trata de um risco entre muitos motoristas, e os sobreviventes têm mais chance de contar sua história.
        correct: true
      - text: O avô deve estar mentindo sobre a idade.
        feedback: |
          Nada sugere isso. O caso pode ser verdadeiro e ainda assim não sustentar a conclusão.
      - text: Histórias pessoais nunca significam nada.
        feedback: |
          Forte demais. Uma história pode ser verdadeira, pode levantar uma pergunta e pode ser um primeiro indício. Só não pode decidir uma questão sobre médias.
      - text: O cinto vale a pena porque a maioria das pessoas diz isso.
        feedback: |
          Popularidade é outra razão fraca. O argumento a favor do cinto se apoia em dados de colisões de muitos acidentes, não em quantas pessoas acreditam.
    explanation: |
      Esta é a história do chá de Anna de novo: vívida, verdadeira e um só caso. A qualidade da razão depende da pergunta. Para "o que acontece em média?", muitos casos com uma comparação justa carregam o peso.

  - type: mcq
    id: experience-views
    title: "Minha experiência conta como evidência?"
    prompt: |
      Uma pessoa diz: "Senti uma paz profunda ao rezar, e isso é evidência para mim de que existe algo maior." Duas visões são comuns. Qual par de visões está descrito corretamente?
    options:
      - text: Alguns filósofos sustentam que uma experiência vívida é, em si, uma razão para quem a tem, a menos que haja motivo para duvidar dela. Outros respondem que, como as experiências podem ser ilusões e diferem entre as pessoas, uma experiência só é evidência depois de checada contra outras fontes.
        correct: true
      - text: Todos os filósofos concordam que as experiências não contam como evidência alguma.
        feedback: |
          Eles não concordam nisso. Muitos sustentam que a própria percepção é uma experiência, então rejeitar toda experiência também rejeitaria ver e ouvir.
      - text: Todos os filósofos concordam que a experiência é tão forte quanto a medição de um instrumento.
        feedback: |
          Não é assim. Até quem conta a experiência como razão costuma admitir que ela pode estar errada e a pesa.
      - text: A única disputa é se a pessoa é sincera.
        feedback: |
          A sinceridade não é a questão. A disputa é sobre o que uma experiência sincera mostra, à pessoa e aos outros.
    explanation: |
      Este é um **debate em aberto**, e um nível posterior o estuda a fundo (Experiência Religiosa). Note o que os dois lados compartilham: nenhum zomba da experiência. Eles diferem sobre se ela é uma razão por si só, e sobre o que ela sustenta: um sentimento de paz, ou uma afirmação sobre o mundo. Nomear essa diferença é mais útil do que escolher um lado agora.

  - type: text
    id: summary
    body: |
      **A seguir:** *Um Enigma para Cada Nível*. Agora que temos os tipos de razão, um enigma de adivinhação para cada nível do curso mostra que perguntas vêm pela frente.
