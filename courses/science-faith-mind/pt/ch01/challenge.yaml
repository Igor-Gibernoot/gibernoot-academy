source_hash: b727b3849dc9
id: ch01-challenge
title: "Desafio do Nível: Classifique as Perguntas (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Desafio, parte 1: classificando perguntas"
    body: |
      O Nível 1 deu a você quatro **lentes** (modos de olhar uma pergunta): a **ciência**, a **filosofia**, a **teologia** (o pensar cuidadoso sobre Deus e a religião, como uma tradição o faz) e a **experiência vivida** (como é viver algo). Este desafio as usa em perguntas novas. Como em toda lição do Nível 1, **adivinhar é o objetivo**: escolha e depois leia o porquê.

      As perguntas também diferem no **tipo de resposta** que podem ter:

      - **Fato mensurável**: uma contagem ou medição cuidadosa poderia decidi-la.
      - **Lógica ou conceitual**: ela decorre do significado das palavras ou de um raciocínio válido.
      - **Compromisso de fé**: uma afirmação que se apoia na confiança numa tradição ou numa visão de mundo, além do que um teste pode mostrar.
      - **Valor**: uma questão sobre o que é certo, justo ou vale a pena fazer.

      São três problemas aqui: classificar pelo tipo de resposta, escolher as lentes e depois dividir uma pergunta em partes. Os problemas 4 e 5 vêm na parte 2.

  - type: mcq
    id: p1-fact
    title: "Problema 1 · Classificando pelo tipo de resposta"
    prompt: |
      **Problema 1.** Cinco perguntas, cinco classificações. Primeira: *"Adultos que dormem 5 horas por noite têm notas mais baixas num teste de memória do que adultos que dormem 8 horas?"* Que tipo de resposta ela pode ter?
    options:
      - text: Um fato mensurável. Teste os dois grupos na mesma tarefa de memória e compare as notas.
        correct: true
      - text: Um valor. Se o sono importa é questão de gosto.
        feedback: |
          Se você *gosta* de dormir é gosto, mas a pergunta é sobre notas, que podem ser contadas. Nada nela é sobre "certo" ou "justo".
      - text: Um compromisso de fé. Ninguém pode saber o que o sono faz a uma mente.
        feedback: |
          Muito se sabe testando. Um compromisso de fé é uma afirmação que um teste não alcança; aqui um teste é exatamente o que a decidiria.
      - text: Lógica. Decorre do significado da palavra "sono".
        feedback: |
          A palavra "sono" não contém notas de memória. A resposta poderia ter saído de qualquer jeito, e esse é o sinal de que devemos olhar o mundo.
    explanation: |
      Uma pergunta cuja resposta **poderia ter saído diferente** e pode ser conferida por contagem é um fato mensurável. Nada aqui diz que a resposta é fácil, só que uma comparação justa entre muitas pessoas poderia decidi-la.

  - type: mcq
    id: p1-logic
    title: "Pergunta 2"
    prompt: |
      *"Poderia existir um solteirão (um homem não casado) que é casado?"* Que tipo de resposta ela pode ter?
    options:
      - text: Lógica ou conceitual. A palavra "solteirão" já significa não casado, então a ideia se contradiz.
        correct: true
      - text: Um fato mensurável. Teríamos de pesquisar todos os homens do mundo.
        feedback: |
          Uma pesquisa não encontraria nenhum, mas nenhuma pesquisa é necessária: a resposta decorre do que a palavra significa. Uma pesquisa concluída não poderia tornar possível um solteirão casado.
      - text: Um valor. Algumas pessoas achariam injusto.
        feedback: |
          A justiça não tem papel aqui. O problema é um choque dentro das próprias palavras.
      - text: Um compromisso de fé. Depende da visão de mundo em que você confia.
        feedback: |
          Crentes e céticos concordam igualmente. Quando todos que entendem as palavras precisam concordar, a pergunta é sobre significado, não sobre confiança.
    explanation: |
      Uma pergunta **conceitual** é decidida pelo significado dos termos ou por raciocínio válido, não olhando o mundo. O mesmo tipo de pergunta aparece depois na filosofia: se uma ideia é autocontraditória ou apenas estranha.

  - type: mcq
    id: p1-mixed
    title: "A pergunta 3 mistura tipos"
    prompt: |
      *"É certo multar motoristas que passam do limite de velocidade?"* Uma frase só, mas ela esconde mais de um tipo de resposta. Qual descrição é a melhor?
    options:
      - text: Mistura dois tipos. Se as multas reduzem acidentes é um fato mensurável; se é justo punir as pessoas assim é um valor.
        correct: true
      - text: É puramente um fato mensurável. Se as multas reduzem acidentes, elas são certas.
        feedback: |
          Os fatos alimentam a resposta, mas "certo" também exige um valor: alguém que se importa mais com a liberdade pessoal do que com menos acidentes pode aceitar os mesmos dados e ainda assim discordar.
      - text: É puramente um valor. Fatos sobre acidentes são irrelevantes.
        feedback: |
          Se as multas não fizessem diferença para a segurança, a maioria dos defensores delas perderia sua melhor razão. Os fatos importam, só não terminam o trabalho.
      - text: É um compromisso de fé, porque as leis vêm de autoridades.
        feedback: |
          As leis vêm de autoridades, mas a pergunta é se a regra é *certa*. Isso é uma questão de valor, ajudada por fatos.
    explanation: |
      Muitas perguntas do dia a dia são **mistas**: os fatos nos dizem o que uma regra faria, os valores nos dizem se esse resultado é o que queremos. Duas pessoas podem concordar em todos os fatos e ainda se separar no valor. Notar qual parte de um argumento é qual é a primeira habilidade deste nível.

  - type: mcq
    id: p1-faith
    title: "Pergunta 4"
    prompt: |
      *"Existe alguma forma de vida após a morte?"* Que tipo de resposta ela pode ter?
    options:
      - text: Principalmente um compromisso de fé (ou sua rejeição). Segundo muitas tradições a resposta é sim, em formas diferentes; segundo os naturalistas (que sustentam que só existe o mundo natural) é não; um teste não alcança a pergunta como posta.
        correct: true
      - text: Um fato mensurável, já que a morte pode ser observada.
        feedback: |
          Podemos observar o fim das funções do corpo. Se *algo continua* depois é exatamente o que nenhum instrumento mede, então a afirmação vai além dos dados. Alguns pesquisadores estudam relatos de experiências de quase morte, mas esses relatos são sobre o que as pessoas lembram de um estado próximo, que os dois lados leem de modo diferente.
      - text: Lógica. Decorre da palavra "vida".
        feedback: |
          Nada na palavra "vida" decide a questão. Os filósofos discutem o assunto (uma mente é a mesma coisa que um cérebro?), mas isso é um debate sobre premissas, não um resultado de definições.
      - text: Um valor. É só sobre o que esperamos.
        feedback: |
          A esperança entra, mas tanto as tradições quanto os céticos pretendem dizer o que *é assim*, não só o que é bom. A afirmação é sobre a realidade, mesmo que um teste não possa confirmá-la.
    explanation: |
      Aqui ajuda manter três coisas separadas (um hábito deste curso): o que **observamos** (os corpos param de funcionar), o que é **debatido** (o que é uma mente, como ler os relatos de quase morte) e o **compromisso** (continua ou não). Rotulamos a última como um compromisso de fé ou de visão de mundo, em qualquer dos sentidos, não como fato estabelecido.

  - type: mcq
    id: p1-multi
    title: "Pergunta 5"
    multiple: true
    prompt: |
      Quais destas podem, **em princípio**, ser decididas só por medição? Marque todas as que se aplicam.
    options:
      - text: "A espécie de árvore mais alta da Terra tem mais de 100 metros?"
        correct: true
      - text: "O Monte Everest é mais alto que a montanha K2?"
        correct: true
      - text: "Uma manhã tranquila de domingo é melhor que uma noite agitada de sábado?"
        feedback: |
          "Melhor" depende do que a pessoa valoriza. Pessoas que concordam em todos os fatos (barulho, custo, tempo) ainda escolhem de modo diferente. É um valor.
      - text: "Um triângulo plano desenhado numa folha pode ter ângulos que somam 200 graus?"
        feedback: |
          Na geometria plana isto é decidido por raciocínio a partir das definições, não medindo triângulos desenhados (os desenhados nunca são exatos). É conceitual. (Superfícies curvas se comportam de outro modo, um assunto posterior.)
    explanation: |
      Alturas são mensuráveis: as árvores mais altas, as sequoias da costa, medem mais de 100 m, e o Everest é mais alto que o K2. Gosto e definições não se medem, embora cada um possa ainda ser bem ou mal argumentado.

  - type: mcq
    id: p2-prayer
    title: "Problema 2 · Escolhendo a lente"
    prompt: |
      **Problema 2.** Alguém pergunta: *"A oração funciona?"* Qual é o melhor primeiro passo?
    options:
      - text: Perguntar o que "funciona" significa e depois dar a cada significado a sua lente. Por exemplo, "reduz o estresse ou acelera a recuperação" é uma pergunta para a ciência; "Deus responde" é para a teologia e a filosofia; "o que ela faz numa vida" é para a experiência vivida.
        correct: true
      - text: Deixar a ciência responder a pergunta toda, já que "funciona" significa "tem um efeito".
        feedback: |
          A ciência pode testar efeitos que consegue medir (pressão arterial, estresse, recuperação). Muitos crentes querem dizer outra coisa com "funciona": ser ouvido, ou ser transformado. Um resultado científico responde então a apenas um dos significados.
      - text: Deixar a teologia responder a pergunta toda, já que a oração é um ato religioso.
        feedback: |
          A teologia diz para que uma tradição sustenta que serve a oração. Se a oração muda algo *de forma mensurável* é uma afirmação separada, e um crente ponderado pode receber bem que ela seja estudada, ou pode objetar a testá-la. De qualquer modo as perguntas precisam ser separadas.
      - text: Dizer que é só opinião e nenhuma lente se aplica.
        feedback: |
          Partes dela são mensuráveis e partes são cuidadosamente argumentáveis. "Só opinião" pula a classificação que este nível ensina.
    explanation: |
      Palavras ambíguas ("funciona") escondem várias perguntas. **Defina as palavras primeiro**; depois a classificação fica fácil. Crentes e céticos ganham com esse passo, já que ele impede duas pessoas de discutir duas perguntas diferentes.

  - type: mcq
    id: p2-trial
    title: "Um grande teste da oração"
    prompt: |
      Um grande estudo dos EUA publicado em 2006 (o estudo STEP) acompanhou cerca de 1.800 pacientes de cirurgia cardíaca. Desconhecidos em grupos de oração rezaram por alguns deles; um grupo de comparação não teve essas orações. Não se encontrou redução de complicações no grupo pelo qual se rezou. O que esse resultado aborda?
    options:
      - text: 'Um significado estreito: se orações de desconhecidos reduziram de modo mensurável as complicações. Ele deixa em aberto o que a oração faz por quem reza, e se Deus responde às orações de maneiras que um estudo não pode detectar.'
        correct: true
      - text: Se qualquer oração em qualquer sentido é inútil.
        feedback: |
          O estudo mediu um resultado sob um desenho. Ele não diz nada sobre conforto, sentido ou disciplina, que é o que muitos que rezam têm em mente.
      - text: Nada, já que a ciência não pode estudar a religião.
        feedback: |
          Ele estudou uma afirmação definida (orações de desconhecidos reduzem complicações) e não encontrou nada. A ciência pode testar a parte mensurável de uma afirmação sem decidir sobre o resto.
      - text: Que os crentes devem ter razão desde sempre.
        feedback: |
          Um resultado nulo (não encontrar efeito) não dá apoio a isso. A leitura rival, defendida por alguns crentes, é que Deus não é uma alavanca para ser testada; isso é uma posição teológica, não um resultado do estudo.
    explanation: |
      Segundo os céticos, o estudo é evidência justa sobre a afirmação mensurável. Segundo muitos crentes, ele testa a coisa errada, porque a oração é uma relação e não um tratamento. Os dois podem dizer que o resultado é o que é; eles se separam em **o que é a oração**, uma premissa, não nos dados.

  - type: mcq
    id: p2-meat
    title: "É errado comer carne?"
    prompt: |
      Tome outra grande pergunta: *"É errado comer carne?"* Qual descrição do que cada lente acrescenta é a melhor?
    options:
      - text: A ciência fornece fatos (o que os animais sentem, nutrição, efeitos sobre o clima). A filosofia examina os argumentos (o sofrimento animal conta, e quanto?). A teologia relata o que as tradições sustentam. A experiência vivida mostra como a escolha se encaixa em cultura, família e consciência. Nenhuma lente sozinha a decide.
        correct: true
      - text: A ciência a decide, porque só os fatos podem mostrar se algo é errado.
        feedback: |
          Os fatos dizem o que acontece aos animais, mas "errado" é um valor. Os mesmos dados levam uma pessoa a abandonar a carne e outra a continuar comendo. A ciência informa a pergunta sem encerrá-la.
      - text: A teologia a decide, porque certo e errado vêm só da religião.
        feedback: |
          Algumas pessoas fundamentam a ética na religião e outras não. Mesmo dentro das religiões as respostas diferem: algumas tradições, como o jainismo, ensinam a não violência contra os animais e muitos seguidores hindus e budistas evitam a carne, enquanto outras tradições a permitem com regras. Então a teologia dá várias respostas, não uma.
      - text: A experiência vivida a decide, porque todo mundo simplesmente come o que cresceu comendo.
        feedback: |
          O hábito é poderoso e parte da história, mas não nos diz se o hábito é justificado. Os filósofos perguntam exatamente isso.
    explanation: |
      Uma **combinação de lentes** é muitas vezes a ferramenta certa. Note o padrão: a ciência dá fatos, a filosofia testa as razões, a teologia dá a visão de uma tradição e a experiência dá o contexto da pessoa. A conclusão ainda precisa de um valor, que nenhuma lente fornece de graça.

  - type: mcq
    id: p2-according
    title: "Segundo quem?"
    prompt: |
      Duas frases sobre comer carne. **(A)** Segundo o filósofo Peter Singer (nascido em 1946), o que importa é o sofrimento de qualquer criatura que possa sofrer, então o modo como os animais são criados conta moralmente. **(B)** Segundo Gênesis 9:3, dito à família de Noé depois do dilúvio, "todo ser vivo que se move será alimento para vocês." Qual associação de lente e tipo de afirmação se encaixa melhor?
    options:
      - text: "(A) filosofia, um argumento ético a partir de um valor; (B) teologia, uma declaração da escritura de uma tradição. Respondem a partir de fundamentos diferentes e nenhuma refuta a outra."
        correct: true
      - text: "(A) ciência, uma medição; (B) experiência vivida, uma anotação de diário."
        feedback: |
          A afirmação de Singer é um argumento sobre o que deveria importar, não uma medição. Gênesis é um texto sagrado de uma tradição, não um relato pessoal.
      - text: "As duas são filosofia, então só uma pode estar certa."
        feedback: |
          Vêm de fontes diferentes. Uma é um argumento a partir de um valor, a outra é escritura. Tradições diferentes leem e pesam a escritura de modo diferente, e muitos que compartilham (B) aceitam limites sobre como os animais devem ser tratados.
      - text: "(B) é ciência porque descreve o que os animais são."
        feedback: |
          O versículo diz o que os humanos podem fazer, não o que os animais são. É uma permissão, dada dentro de uma fé.
    explanation: |
      O hábito de dizer "**segundo**" mostra onde cada afirmação se situa. Cada visão é forte a partir de dentro da sua própria fonte, e quando as visões colidem, pergunte qual **premissa ou valor** elas não compartilham, em vez de qual lado fala mais alto.

  - type: mcq
    id: p2-parting
    title: "Onde se separam"
    prompt: |
      Dois amigos concordam em todos os fatos: porcos sentem dor, as fazendas causam algum sofrimento, a carne fornece proteína. Um continua comendo carne; o outro parou. Onde eles provavelmente se separam?
    options:
      - text: Num valor ou premissa, como quanto o sofrimento animal deve pesar contra a tradição, o gosto e as necessidades humanas.
        correct: true
      - text: Num fato, já que pessoas com os mesmos fatos devem chegar à mesma decisão.
        feedback: |
          O enunciado diz que concordam nos fatos. Os mesmos fatos podem sustentar decisões diferentes porque os fatos não dizem quanto cada coisa deve pesar.
      - text: Num erro lógico, já que um deles deve estar raciocinando mal.
        feedback: |
          Os dois podem raciocinar validamente a partir de pontos de partida diferentes. Um argumento válido a partir de valores diferentes chega a conclusões diferentes.
      - text: Eles na verdade não discordam; ambos têm razão.
        feedback: |
          Eles discordam sobre o que fazer. Entender a fonte da discordância não a faz desaparecer, mas mostra a que uma conversa poderia se dirigir.
    explanation: |
      As discordâncias se separam em três lugares: uma **premissa** (o que supomos ser assim), um **valor** (o que importa, e quanto) ou a **evidência** (quais são os fatos ou como lê-los). Achar qual deles está em jogo é o principal serviço deste curso.

  - type: mcq
    id: p3-split
    title: "Problema 3 · Dividindo uma pergunta composta"
    prompt: |
      **Problema 3.** *"Os sonhos preveem o futuro, e devo prestar atenção aos meus?"* São na verdade várias perguntas. Qual divisão dá a cada parte uma lente e um tipo de evidência adequados?
    options:
      - text: "(a) Os conteúdos dos sonhos coincidem com eventos posteriores mais do que o acaso daria? Ciência, registros e contagens. (b) O que são os sonhos, como atividade cerebral? Ciência. (c) Os sonhos têm significado para quem sonha? Experiência vivida e psicologia, relatos e interpretação. (d) Algumas tradições leem os sonhos como mensagens? Teologia, segundo cada tradição."
        correct: true
      - text: "Uma pergunta só, respondida perguntando às pessoas se os sonhos delas se realizaram."
        feedback: |
          As pessoas lembram dos acertos e esquecem dos erros, então essa é a armadilha de escolher a dedo vista antes neste nível. Ela também junta três perguntas diferentes numa só.
      - text: "(a) Ciência para tudo, já que os sonhos acontecem num cérebro."
        feedback: |
          A atividade cerebral é uma questão científica. Se um sonho *significa* algo para você, ou o que uma tradição diz sobre ele, não é decidido por exames do cérebro.
      - text: "(a) Teologia para tudo, já que os sonhos são misteriosos."
        feedback: |
          Mistério não é uma lente. Algumas partes são abertas à contagem, e a lente de cada parte decorre do tipo de resposta que essa parte pode ter.
    explanation: |
      Dividir significa perguntar, parte por parte: **que tipo de resposta** isto pode ter, e **o que contaria como evidência**? A parte (a) quer acertos e erros contados; a parte (c) quer relatos cuidadosos do que as pessoas vivem; a parte (d) quer os textos e mestres da própria tradição.

  - type: numeric
    id: p3-chance
    title: "Parte (a): quantos acertos por sorte?"
    prompt: |
      Uma verificação de brinquedo para a parte (a). Suponha que **10.000** pessoas se lembrem cada uma de **um** sonho esta noite, e que para qualquer sonho haja **1 chance em 1.000** (pura sorte) de que ele se pareça vagamente com algum evento do noticiário dentro de uma semana. Cerca de quantos "sonhos que se realizaram" devemos esperar só pela sorte?
    answer: 10
    hint: Contagem esperada = número de sonhos vezes a chance de cada um.
    explanation: |
      $10{,}000 \times \tfrac{1}{1000} = 10$. Mesmo que cada sonho tenha pouquíssima chance de coincidir, com milhares de sonhadores alguns acertos **são esperados pela sorte**, e cada um vira uma história vívida. Então o teste certo conta acertos **e erros** em todos e compara com o nível da sorte. (Números de brinquedo, não uma taxa medida.)

  - type: mcq
    id: p3-howwhy
    title: "Uma armadilha de como versus por quê"
    prompt: |
      Alguém diz: "A ciência explicou como um arco-íris se forma, gotas de água curvando e separando a luz do Sol, então perguntar o que um arco-íris *significa* não tem sentido." Qual é o deslize?
    options:
      - text: Trata uma resposta a "como acontece?" como se respondesse "o que significa para nós, ou há um propósito?". As perguntas diferem, então uma resposta não precisa cancelar a outra.
        correct: true
      - text: Não há deslize; uma vez conhecida a causa, nenhuma outra pergunta resta.
        feedback: |
          A causa responde ao "como". Se um arco-íris é belo, ou é um sinal numa tradição (como em Gênesis 9, onde é um sinal de uma promessa, segundo esse texto), é outra pergunta.
      - text: O falante deveria ter dito que a ciência não consegue explicar o arco-íris.
        feedback: |
          A ciência explica muito bem o como. O deslize é afirmar que essa explicação decide as outras perguntas.
      - text: O deslize é que um arco-íris não tem causa.
        feedback: |
          Ele tem uma causa física bem compreendida. O deslize está no salto dessa causa para "nenhum significado".
    explanation: |
      Uma explicação de **como** (o processo) e uma de **por quê** (um propósito ou significado) podem ambas ser verdadeiras. O deslize inverso também existe: usar "tem um propósito" para negar que tenha causa física. Se existe algum propósito é um ponto em que as visões se separam, e o encontraremos em níveis posteriores.

  - type: order
    id: p3-method
    title: "Um método para qualquer grande pergunta"
    prompt: Coloque em ordem os passos do método de classificação.
    steps:
      - 'Enuncie a pergunta numa frase clara e defina as palavras ambíguas.'
      - 'Divida-a em partes se ela for na verdade várias perguntas.'
      - 'Para cada parte, pergunte que tipo de resposta ela pode ter: fato, conceitual, compromisso de fé ou valor.'
      - 'Escolha a lente ou as lentes que se encaixam e diga o que contaria como evidência ali.'
      - 'Diga segundo quem cada resposta é dada e onde as visões se separam: premissa, valor ou evidência.'
    hint: Esclarecer, dividir, classificar, escolher e depois atribuir.
    explanation: |
      A ordem importa: classificar uma pergunta confusa dá resultados confusos, e escolher uma lente antes de saber o tipo de resposta pode significar responder bem à pergunta errada.

  - type: text
    id: summary
    title: "O que você agora domina"
    body: |
      - **Quatro tipos de resposta**: fato mensurável, conceitual (do significado ou do raciocínio), compromisso de fé (confiança além de um teste) e valor (o que é certo ou vale a pena fazer). Muitas perguntas do dia a dia os misturam.
      - **Quatro lentes**: ciência, filosofia, teologia e experiência vivida, muitas vezes combinadas; cada uma acrescenta uma parte diferente de uma resposta.
      - **Dividir e definir as palavras** (como "funciona") transforma uma pergunta confusa em várias claras, cada uma com a sua evidência.
      - **Como versus por quê**: uma causa não cancela um significado, e um significado não cancela uma causa.
      - **Onde as visões se separam**: numa premissa, num valor ou na evidência, e dizer "segundo quem" mostra qual.

      O que continua em aberto: nada aqui disse quais respostas às grandes perguntas são verdadeiras; só deu a você as ferramentas para fazê-las bem.

      **A seguir:** a parte 2 do desafio traz os problemas 4 e 5, que combinam tudo: distinguir uma boa razão de uma má dentro de um debate mais longo, e uma pergunta final para você desmontar sozinho.
