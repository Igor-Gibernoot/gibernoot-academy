id: ch23-humility
title: "Intellectual Humility and Honest Doubt"
kind: concept
own: |
  The setting: a person holds beliefs about science, God or morals, and asks how firmly to hold them and how to speak with people who hold others. Each account is told *according to* its source.
  - **Intellectual humility.** According to Whitcomb, Battaly, Baehr and Howard-Snyder (2017), it is a disposition to {{ attend to and own one's intellectual limitations }}: mistakes, gaps in knowledge, weak skills. It is not low self-esteem, not silence, and not the view that all opinions are equally good. A humble person can hold a view firmly and still be ready to revise it.
  - **Fallibilism.** According to the *Internet Encyclopedia of Philosophy*, it is the thesis that {{ no belief can be conclusively justified }}, so a possible doubt always remains. One common way to say it with numbers (our gloss): for a belief $p$, the credence (degree of confidence) stays strictly between 0 and 1.
  $$0 < \Pr(p) < 1$$
  Fallibilism allows a credence of 0.99; it does not say every belief is doubtful.
  - **Socrates.** In Plato's *Apology* (21d, Jowett's translation) Socrates says of a man reputed wise, "I neither know nor think that I know". The popular line {{ "I know that I know nothing" }} is a later shortening, and some scholars (Gail Fine, 2008, among those who discuss it) ask whether Socrates claims that at all.
  - **Calibration.** Let $c$ be the average confidence a person states over a set of claims and $a$ the share of those claims that turn out true. Overconfidence is
  $$c - a > 0.$$
  Svenson (1981) found 93% of the American drivers he surveyed rating themselves above the median driver, which cannot be true of 93% of them. The Dunning-Kruger result (1999: low scorers overrated their rank) is {{ debated: critics say much of it is a statistical artifact }}, while Dunning and Kruger have replied to such critiques.
  - **Honest doubt.** According to Tennyson (*In Memoriam A.H.H.*, 1850, section 96), "There lives more faith in honest doubt, / Believe me, than in half the creeds". Doubt appears inside traditions: Job and Thomas in the Bible, and, according to the letters published as *Come Be My Light* (2007), Mother Teresa's long spiritual darkness. Believers read these cases differently from critics.
  - **Doubt, denial, agnosticism.** *Doubt* is withholding full confidence; *denial* is asserting that a claim is false; an *agnostic* in Huxley's sense (coined 1869) {{ refuses to claim a conclusion that has not been shown }}.
  - **Peers.** For two equal peers with credences $c_A$ and $c_B$, giving weight $r$ to the other gives
  $$c_A' = (1-r)\,c_A + r\,c_B.$$
  Here $r = \tfrac12$ is a split and $r = 0$ is holding firm. Where thoughtful people part ways: how large $r$ should be, and whether humility about one's own religion extends to the tradition's central claims.

cards:
  - type: text
    id: hook
    title: "Who is overconfident?"
    body: |
      Most of us feel sure that our own beliefs are the sensible ones. Yet people on every side of every question feel exactly this. Both cannot be right about the same facts, and each can see the other's mistake much more easily than their own.

      This lesson asks a plain question: how should anyone hold views on science, God and meaning? Firmly enough to act on them, loosely enough to learn. It does not say who is right. It is about the manner of holding, which believers, atheists and agnostics can each judge by their own standards.

  - type: mcq
    id: guess
    title: "Guess: the average driver"
    prompt: |
      In 1981 the psychologist Ola Svenson asked drivers to compare their driving skill with that of the median driver in their group. Of the American drivers he surveyed, about what share rated themselves *above* the median?
    options:
      - text: "About 50%, since half of any group lies above the median."
        feedback: |
          That is what a perfectly calibrated group would show, and it is the tempting guess. The study found the answer was far from it.
      - text: "About 93%."
        correct: true
        feedback: |
          Yes. About 93% of the American sample (69% in the Swedish sample) placed themselves above the median, which cannot be true of that many people.
      - text: "About 10%, because people tend to be modest."
        feedback: |
          Modesty is the common assumption, and the data say the opposite for skills people care about.
    explanation: |
      By definition, at most half of any group is above its median. When far more than half say they are, many must be wrong about themselves. Later work has replicated the pattern in the driving case (Koppel and colleagues, 2023).

  - type: text
    id: define
    title: "What intellectual humility is"
    body: |
      According to the philosophers Dennis Whitcomb, Heather Battaly, Jason Baehr and Daniel Howard-Snyder (*Philosophy and Phenomenological Research*, 2017), **intellectual humility** is a disposition to attend to one's intellectual limitations and to own them: one's mistakes, one's gaps in knowledge, one's weak skills.

      Notice what is not in that definition. It does not say to be timid, to stay silent, or to think poorly of yourself. It does not say that all opinions are equally good, which is called **relativism** (the view that the truth of a claim depends only on who holds it). A person can hold a view with great confidence because the evidence is strong, and still be humble, as long as the confidence matches the evidence and the person would change their mind if the evidence changed.

  - type: mcq
    id: define-q
    title: "Which person is humble?"
    prompt: |
      Four people are asked whether a well-tested medicine works. According to the account above, who shows intellectual humility?
    options:
      - text: "Ana says: \"The trials are large and agree. I am very confident, and I would change my view if a bigger trial found otherwise.\""
        correct: true
        feedback: |
          Yes. High confidence that follows strong evidence, with a stated way to be wrong, is humility about her own limits. It is not timidity.
      - text: "Ben says: \"Nobody can really know anything, so all views here are equally good.\""
        feedback: |
          That is relativism, and it ignores a limitation of its own: it claims to know that nobody knows. Humility owns particular limits; it does not erase differences in evidence.
      - text: "Carla says: \"I never speak in meetings, in case I am wrong.\""
        feedback: |
          Silence from fear is timidity. It does not attend to what she does or does not know, and it blocks the way others might correct her.
      - text: "Dev says: \"I am right and the rest are fools.\""
        feedback: |
          That is the opposite trait: no attention to his own possible errors.
    explanation: |
      Humility is about the fit between confidence and evidence, and about readiness to revise. It is not a fixed level of confidence.

  - type: text
    id: fallibilism
    title: "Fallibilism"
    body: |
      The philosophical idea behind the attitude is **fallibilism**. According to the *Internet Encyclopedia of Philosophy*, it is the thesis that no belief can ever be rationally supported or justified in a conclusive way, so that a possible doubt about its truth always remains. The term comes from the American philosopher Charles Sanders Peirce (1839 to 1914), though the basic idea is much older.

      A way to put it in numbers (our gloss, not the encyclopedia's): give each belief $p$ a credence, a degree of confidence from 0 to 1. Fallibilism says no belief reaches either end for good reasons.

      $$0 < \Pr(p) < 1$$

      Credence 0.99 still counts. The idea is not that everything is doubtful, but that nothing is beyond question.

  - type: mcq
    id: fallibilism-q
    title: "What does fallibilism say?"
    prompt: |
      A student says: "If fallibilism is true, I should be unsure of everything, including that 2 + 2 = 4 and that I exist." Is that what the thesis says?
    options:
      - text: "No. It says no belief is conclusively justified, which is compatible with very high confidence in well-supported beliefs."
        correct: true
        feedback: |
          Yes. A credence of 0.999 is still fallible and still a reason to act. Some philosophers do hold that certain beliefs are certain; they are rivals of fallibilism, not users of it.
      - text: "Yes. If a belief might be false, it should be given credence near 0.5."
        feedback: |
          This confuses "might be false" with "is probably false". Almost every well-tested belief can be wrong in principle and is still very likely true.
      - text: "Yes. Fallibilism says all beliefs are equally uncertain."
        feedback: |
          Fallibilism says none is conclusive; it does not say they are equal. Evidence still ranks them.
    explanation: |
      Layer: that the thesis exists and what it says is fact about the literature; whether it is true (or whether a few beliefs are certain) is a live debate.

  - type: text
    id: socrates
    title: "Socrates and the line he never quite said"
    body: |
      The best-known ancestor is Socrates (469 to 399 BCE; some sources give c. 470 for his birth). In Plato's *Apology* he tells the jury of questioning a man with a reputation for wisdom, and finds that the man thinks he knows what he does not. In Benjamin Jowett's translation (*Apology* 21d) Socrates reasons: "I neither know nor think that I know", and so he seems to have slightly the advantage of that man.

      The famous line "I know that I know nothing" is a later shortening and does not appear in that form in Plato's text. Some scholars, among them Gail Fine (*Oxford Studies in Ancient Philosophy*, 2008, whose article asks exactly this), discuss whether Socrates claims to know that he knows nothing at all. One reading is that he disclaims *wisdom of the highest kind*, not all knowledge. Elsewhere in the same dialogue (29b) he says he does know that doing wrong and disobeying one's superior, god or man, is wicked and shameful, so a strong "I know nothing" is hard to match to the text.

  - type: mcq
    id: socrates-q
    title: "Socrates: what is the advantage?"
    prompt: |
      According to the *Apology* passage, in what way does Socrates have "slightly the advantage" over the man reputed wise?
    options:
      - text: "He does not think he knows what he does not know, while the other man does."
        correct: true
        feedback: |
          Yes. The advantage is accurate self-assessment of one gap, not a pile of knowledge.
      - text: "He knows more facts than the other man."
        feedback: |
          Socrates denies that. His edge is about the awareness of limits, not the amount known.
      - text: "He is sure that nothing at all can be known."
        feedback: |
          That is the later slogan, and a doubtful reading. He says "I neither know nor think that I know" about the particular matters at issue (the highest questions), not about everything.
    explanation: |
      Two readings exist: a sweeping "I know nothing" and a narrower modesty about the highest kind of wisdom. The passage supports the narrow one more directly, and the reading is debated.

  - type: text
    id: overconfidence
    title: "Why humility needs a name: overconfidence"
    body: |
      Psychologists measure whether people's confidence matches reality. Let $c$ be the average confidence someone states over a set of claims (as a share), and $a$ the share of those claims that turn out true. The gap is a measure of overconfidence.

      $$c - a$$

      A person who says "90% sure" on a hundred claims and is right on seventy has a gap of 20 points. Such a person is *miscalibrated*: their confidence is not a good guide to their accuracy.

      In 1999 David Dunning and Justin Kruger (*Journal of Personality and Social Psychology*) reported that participants who scored in the bottom quarter on tests of humor, grammar and logic grossly overestimated their performance: by the paper's abstract their scores put them in the 12th percentile and they estimated themselves at the 62nd. This is the **Dunning-Kruger effect**. It is contested. Gignac and Zajenkowski (2020) argued it is mostly a statistical artifact (regression to the mean plus the common better-than-average bias); a later replication with a nationally representative sample (Dunkel and colleagues, 2023) found a statistically significant effect of minimal size, which they said brings its meaningfulness into question; Kruger and Dunning replied to the regression critique in 2002. The robust part is the first one, in Svenson's study and its replications: people often overrate themselves.

  - type: numeric
    id: overconfidence-q
    title: "Compute the gap"
    prompt: |
      A forecaster rates 200 claims, stating 80% confidence in each. Of the 200, 130 turn out true. Using the gap defined as stated confidence minus the share true, in percentage points, what is it?
    answer: 15
    tolerance: 0.01
    answerText: '15'
    wrong:
      - { value: 50, feedback: "The gap compares 80 with the share that was right (130 of 200 = 65%), not with a count of claims." }
      - { value: -15, feedback: "The sign is reversed. Overconfidence means confidence above accuracy, so the gap is positive here." }
    hint: "First convert 130 of 200 to a percentage, then subtract it from 80."
    explanation: |
      The share true is $130/200 = 65\%$, and the gap is $80 - 65 = 15$ points: overconfident. A forecaster who stated 65% would have been calibrated, though not more accurate.

  - type: mcq
    id: dk-q
    title: "Reading a contested result"
    prompt: |
      A magazine writes: "Science proves that the incompetent always think they are experts." Given the state of the debate described above, what is the fairest response?
    options:
      - text: "The original claim is contested in size and cause, and \"always\" is too strong; the better-supported core is that people often overrate themselves."
        correct: true
        feedback: |
          Yes. This keeps the part that has replicated and drops the overreach, which is itself an act of humility about a result.
      - text: "The effect has been shown to be completely false, so ignore it."
        feedback: |
          Critics argue much of the pattern is statistical, but a later replication found a statistically significant (though minimal) effect, and Kruger and Dunning replied to the regression critique in 2002. "Completely false" overstates the critics too.
      - text: "The effect has been settled by the 1999 study."
        feedback: |
          One study rarely settles a question, and this one has drawn serious statistical criticism.
    explanation: |
      Layer: the 1999 data are fact; how much of the pattern is psychology and how much statistics is a live debate.

  - type: text
    id: doubt-bible
    title: "Doubt inside the traditions: Job and Thomas"
    body: |
      Honest doubt is not only a modern, secular habit. It appears inside religious texts. In the Book of Job, Job demands an answer from God for his suffering. According to the text (Job 38:1 to 4, NRSV), God answers from a whirlwind: "Who is this that darkens counsel by words without knowledge?" and asks where Job was when the earth's foundations were laid. In chapter 42 Job says he had known God only by hearing, and now sees. Readers differ on what the ending means. Some read it as a rebuke that teaches human limits; others read God's reply as an honest answer that the question of suffering is not one humans can master.

      In the Gospel of John (20:24 to 29), Thomas, absent when Jesus first appeared to the disciples, says he will not believe unless he sees and touches the marks of the nails. A week later Jesus invites him to do so, and Thomas answers "My Lord and my God!" Many Christians read the story as showing that Jesus meets honest doubt with evidence; others stress the closing blessing on those who believe without seeing. The popular label "doubting Thomas" gives only half of the scene.

  - type: mcq
    id: doubt-bible-q
    title: "Two readings of Thomas"
    prompt: |
      The Thomas story can be read two ways. Which pair states them correctly?
    options:
      - text: "Reading 1: Jesus answers Thomas's demand for evidence by giving it. Reading 2: the closing words value belief without seeing."
        correct: true
        feedback: |
          Yes. Both are in the same passage, and a lesson that kept only one would be unfair to the other.
      - text: "Reading 1: Thomas is condemned for doubting. Reading 2: Thomas is praised for doubting."
        feedback: |
          Neither is stated outright. Jesus invites Thomas to examine his hands and side, and the blessing is on those who believe without seeing; the text does not praise or condemn the doubt in those words.
      - text: "Reading 1: Thomas never doubted. Reading 2: Thomas doubted for a year."
        feedback: |
          The text says that Thomas doubted, and the interval is a week.
    explanation: |
      According to the account itself, the doubt is answered with an invitation, not punished. Whether that makes doubt a virtue or only a stage is where traditions and readers differ.

  - type: text
    id: doubt-teresa
    title: "Mother Teresa and Tennyson"
    image:
      src: img/tennyson.webp
      place: bottom
      alt: "Portrait print of Alfred, Lord Tennyson, an older man with a long beard and dark clothing, looking to one side"
      caption: "Alfred, Lord Tennyson (1809 to 1892), whose poem for a dead friend became an English classic about faith that lives with doubt."
      credit: "George Frederic Watts / Paul Dujardin, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Portrait_of_Alfred,_Lord_Tennyson_(4674734).jpg"
    body: |
      Teresa of Calcutta, founder of the Missionaries of Charity (canonized by Pope Francis on 4 September 2016), asked her confidants to destroy her letters. Many did not. Edited by the priest Brian Kolodiejchuk and published in 2007 as *Come Be My Light*, they show, according to reviews, a sense of spiritual emptiness lasting some 45 years (Christian Century). In essence she wrote of a heart without felt faith or love, together with pain, while she kept working. Kolodiejchuk argued that this darkness does not lessen her holiness and may deepen it, while critics read the letters differently. One fact, two interpretations, and the letters themselves cannot settle which.

      The poet Alfred, Lord Tennyson (1809 to 1892) wrote a long elegy for his friend Arthur Henry Hallam (died 1833), *In Memoriam A.H.H.* (1850). In section 96 the speaker answers someone who says doubt comes from the devil, and recalls a friend perplexed in faith but pure in deeds:

      > There lives more faith in honest doubt, / Believe me, than in half the creeds.

      The word that matters is *honest*. Tennyson praises doubt that is faced and examined, not doubt used as an excuse.

  - type: mcq
    id: honest-q
    title: "What makes doubt honest?"
    prompt: |
      According to the Tennyson lines above, which kind of doubt is worth more than "half the creeds"?
    options:
      - text: "Doubt that is faced and tested, held by someone willing to follow the question and keep acting well."
        correct: true
        feedback: |
          Yes. The friend in the poem is "perplext in faith, but pure in deeds": doubt joined to integrity.
      - text: "Any doubt at all, since faith is always a mistake."
        feedback: |
          Tennyson is writing within Christian belief, and the line says there is faith *in* honest doubt. He does not call faith a mistake.
      - text: "Doubt that proves the creeds are false."
        feedback: |
          The lines praise doubt as a way of holding faith, not as a refutation of the creeds. The poem's wider course moves from despair toward hope.
    explanation: |
      Believers and critics use the same lines differently: some take them as encouragement to question inside a tradition, others as a sign that sincere questioning matters more than the answer.

  - type: text
    id: doubt-denial
    title: "Doubt, denial and the agnostic stance"
    image:
      src: img/huxley.webp
      alt: "Studio photograph of Thomas Henry Huxley, an older man with white side-whiskers, seated and looking at the camera"
      caption: "Thomas Henry Huxley (1825-1895), the English biologist who coined the word agnostic."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Henry_Huxley_1874.JPG"
    body: |
      Three attitudes are easy to blur. **Doubt** is holding less than full confidence in a claim. **Denial** is asserting that the claim is false, which is a claim in its own right and needs its own support. **Agnosticism**, according to Britannica, takes its name from Huxley's coinage of *agnostic* in 1869, built as the opposite of *gnostic*, one who claims to know. Huxley's point was a rule of method: do not claim a conclusion that has not been shown.

      A theist, an atheist and an agnostic can each be humble or proud. A believer can hold that God exists with firm faith and still say "I might be mistaken, and I do not understand everything". An atheist can say the same of the opposite view. An agnostic can be proud of a stance that is sometimes used to avoid thinking. Humility cuts across the three labels; it is not a fourth label.

  - type: mcq
    id: sort-q
    title: "Doubt or denial?"
    prompt: |
      Select every statement that is a **doubt** (withholding full confidence), not a denial.
    multiple: true
    options:
      - text: "\"I find the argument for the claim interesting, but I am only about 60% convinced.\""
        correct: true
        feedback: |
          Yes: partial confidence, no claim that the proposition is false.
      - text: "\"There is no such thing, and anyone who says otherwise is mistaken.\""
        feedback: |
          That is denial: a claim that the proposition is false, which would need its own evidence.
      - text: "\"I cannot see how anyone could settle this, so I hold no firm view.\""
        correct: true
        feedback: |
          Yes: suspending judgment, which is the agnostic stance in Huxley's sense.
      - text: "\"I am certain this is false.\""
        feedback: |
          Certainty that a claim is false is a firm denial.
    explanation: |
      Denial is not forbidden. It is a position, and like any position it can be held humbly or proudly.

  - type: text
    id: peers
    title: "Back to peers and to fundamentalism"
    body: |
      Recall: in the lesson *Guided proof: Disagreement Among Equals*, two peers (equal ability, same evidence, independent minds) hold credences $c_A$ and $c_B$ in the same claim. Giving the other weight $r$ gives

      $$c_A' = (1-r)\,c_A + r\,c_B$$

      with $r = \tfrac12$ the split and $r = 0$ holding firm. Humility is one answer to how large $r$ should be: not zero, since a thoughtful peer is evidence that you may have erred, and not a rule that always yields to the other, since the other may be miscalibrated.

      Recall also the lesson *Fundamentalism and Religious Politics*: its movements share, according to the scholars who use the term, a sharp line between good and evil and an absolute authority. Both camps in that debate can be humble or proud: a scholar can apply a label too widely, and a believer can reject the label too quickly. Humility asks each side to hear the other describe itself.

  - type: mcq
    id: peers-q
    title: "Humility with a peer"
    prompt: |
      Two equal peers examine the same evidence. Ana's credence in a claim is 0.9 and Ben's is 0.5. Ana decides not to move at all ($r = 0$), saying "I am humble, I just trust my reasoning." What is the best comment?
    options:
      - text: "She has used humility as a label while her behavior shows none: a peer's disagreement is evidence she may be the one in error."
        correct: true
        feedback: |
          Yes. With $r = 0$, no peer evidence can ever change her view. Humility shows in whether she can be moved, not in what she says about herself.
      - text: "She is right, since a humble person never changes credence under pressure."
        feedback: |
          A peer's reasoned view is not pressure; it is evidence. And humility is exactly readiness to revise on good grounds.
      - text: "She should adopt Ben's 0.5 at once, since humility means giving way."
        feedback: |
          Giving way every time is not humility either: Ben might be wrong, and the weight depends on how far he is a true peer. Even a split would land at $0.7$, not at Ben's $0.5$.
    explanation: |
      The split gives $\tfrac12(0.9 + 0.5) = 0.7$. Whether peers should split, and how much weight to give, is a live debate.

  - type: mcq
    id: noconviction-q
    title: "Humility means having no convictions?"
    prompt: |
      A critic says: "Intellectual humility just means having no convictions; people with strong faith or strong atheism cannot have it." Which reply is best?
    options:
      - text: "Humility concerns how convictions are held (confidence tracking evidence, readiness to revise, willingness to hear others), not whether one has any."
        correct: true
        feedback: |
          Yes. On this account a strong conviction is compatible with humility if it is open to challenge. Whether religious commitments can stay open in this way is where thoughtful people disagree.
      - text: "The critic is right: strong convictions always show pride."
        feedback: |
          That is the critic's claim restated. A person can hold a firm view for good reasons and own its limits.
      - text: "Humility means treating all views as equally likely to be true."
        feedback: |
          That is relativism. Evidence still ranks views.
    explanation: |
      The remaining disagreement is about premises: believers point to faith as commitment under uncertainty, critics worry that some claims (for example, revelation taken as final) are held beyond revision. Neither is settled by the definition.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** a round of fast questions on the whole level, each built on a common misconception about knowledge, evidence, faith, pluralism and public life.
