id: ch23-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: knowledge, faith and public life"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: what knowledge is, how much evidence belief needs, whether faith can be rational, how to treat disagreement, what atheism, pluralism, secularism and fundamentalism mean, and what humility asks. Every shortcut is a *useful idea pushed too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone, and the feedback keeps three layers apart: **established fact** (dates, texts, studies), **scholarly debate** (say which), and **faith or metaphysical commitment**. Guess before you read the options.

  - type: mcq
    id: trap-plato
    title: "Plato's definition?"
    prompt: |
      A student writes: "Plato defined knowledge as justified true belief, and that settled it for 2,000 years." What is the fairest correction?
    options:
      - text: "The three-part analysis is often traced to Plato's Theaetetus, but the dialogue tries it and similar accounts and ends without a firm answer (aporetic). Calling it Plato's settled definition overstates the text."
        correct: true
        feedback: |
          Yes. In the Theaetetus, Socrates and Theaetetus test "knowledge is true belief" and "true belief with an account" and the dialogue closes unresolved. The tidy JTB formula is a later, textbook summary.
      - text: "Plato defined knowledge as justified true belief and the Theaetetus proves it."
        feedback: |
          The dialogue examines this kind of account and leaves it in difficulty. It does not end by endorsing it.
      - text: "Plato said knowledge has nothing to do with truth."
        feedback: |
          The dialogue starts from the link between knowledge and true belief. The question is what must be added, not whether truth matters.
      - text: "JTB was invented by Gettier in 1963."
        feedback: |
          Gettier attacked the analysis in 1963; he did not invent it. It was the standard target he was answering.
    explanation: |
      Layers: the text of the Theaetetus and the 1963 paper are documented; how far Plato endorsed any account is scholarly debate. The trap is to turn a textbook formula into a settled ancient doctrine.

  - type: mcq
    id: trap-gettier
    title: "What did Gettier show?"
    prompt: |
      Someone says: "Gettier showed that knowledge does not need justification." What did his 1963 cases actually target?
    options:
      - text: "They aimed to show that justified true belief is not sufficient for knowledge: a belief can have all three marks and still be true by luck."
        correct: true
        feedback: |
          Yes. The claim concerns sufficiency. Justification can still be necessary, and many replies add a fourth condition rather than drop the third.
      - text: "That justification is useless, so belief plus truth is enough."
        feedback: |
          Gettier's cases give beliefs that are justified and true and still look like luck. They do not argue for removing justification.
      - text: "That true belief is not needed for knowledge."
        feedback: |
          The cases keep a true belief. The worry is a missing link between the justification and the truth.
      - text: "That nobody knows anything."
        feedback: |
          The paper is about what analysis of knowledge fits our cases, not scepticism about whether we know.
    explanation: |
      Layers: the paper and its cases are documented; what to add to JTB (a fourth condition, reliability, no false lemmas) is live debate. Keep apart "not sufficient" and "not necessary".

  - type: mcq
    id: trap-clifford
    title: "A crime to believe?"
    prompt: |
      A reader sums up Clifford (1877): "Believing anything without proof is a crime." Which correction fits his essay The Ethics of Belief best?
    options:
      - text: "His principle is ethical and concerns believing on insufficient evidence. The shipowner is wrong because he stifled his doubts and let a belief guide an action that put lives at risk, not because belief without certainty is forbidden."
        correct: true
        feedback: |
          Yes. Clifford asks for evidence proportioned to the stakes and the belief's effects, and he allows trusting well-grounded testimony. The target is believing on poor grounds, not lacking a proof.
      - text: "He meant that any belief without a mathematical proof is a crime."
        feedback: |
          His wording is about insufficient evidence, and he accepts ordinary good evidence and reliable authority.
      - text: "He only claimed that false beliefs are crimes, so the shipowner was blameless if the ship arrived."
        feedback: |
          He says the shipowner's guilt is the same if the ship arrives safely, because the fault lay in how the belief was formed.
      - text: "Clifford argued that evidence is irrelevant when morals are at stake."
        feedback: |
          The reverse: moral stakes raise the demand on evidence.
    explanation: |
      Layers: Clifford's text is documented; whether his principle is too strict or defeats itself is live debate (William James replied, Plantinga and others also). The trap is to read "insufficient evidence" as "no proof".

  - type: mcq
    id: trap-groundless
    title: "Groundless belief?"
    prompt: |
      A critic says: "Plantinga claims belief in God is groundless, held with no reason at all." What is the best correction?
    options:
      - text: "For Plantinga, belief in God can be properly basic: not inferred from other beliefs, yet grounded in an experience or a faculty (the sensus divinitatis, after Calvin). Basic does not mean groundless."
        correct: true
        feedback: |
          Yes. A memory belief or a perceptual belief is also held without inference, and it is grounded in memory or perception. The claim is that belief in God can be similar, with its ground in a faculty working as designed.
      - text: "He claims such belief is groundless but still rational."
        feedback: |
          That drops the ground. On his view the belief is formed by a faculty, which is what gives it warrant.
      - text: "He claims it must be proved from the cosmological argument first."
        feedback: |
          That is the classical-foundationalist demand he rejects: that every rational belief be inferred or self-evident.
      - text: "He claims that every belief is as acceptable as belief in God."
        feedback: |
          The next card is about this reply, the Great Pumpkin objection. He does not say anything goes.
    explanation: |
      Layers: the structure of the view is documented; whether the sensus divinitatis exists is a metaphysical commitment, and whether the parity with perception holds is live debate.

  - type: mcq
    id: trap-defeat
    title: "Basic means unrefutable?"
    prompt: |
      A student says: "If a belief is properly basic, nothing can ever show it false or lower its rational standing." According to the reformed epistemologists, what is wrong?
    options:
      - text: "Properly basic beliefs are open to defeaters: new evidence or arguments can remove their warrant, just as a perceptual belief about a parked car is weakened by learning that it was moved. The belief starts without argument, but it can be argued against."
        correct: true
        feedback: |
          Yes. Properly basic means not needing support from other beliefs to start with, not immunity from reasons against it.
      - text: "Properly basic beliefs are always false."
        feedback: |
          The label is about the structure of support, not truth or falsehood.
      - text: "They can be defeated only by other properly basic beliefs."
        feedback: |
          Defeaters can be inferred beliefs, such as testimony or evidence, as well.
      - text: "Nothing is wrong: basic beliefs are exempt from criticism."
        feedback: |
          If that held, a belief in the Great Pumpkin would also be safe. Defeaters are what stop that.
    explanation: |
      Layers: the notion of defeaters is standard in epistemology; whether the usual arguments against belief in God are defeaters is live debate.

  - type: mcq
    id: trap-wager
    title: "Does the wager prove God?"
    prompt: |
      Someone says: "Pascal's wager proves that God exists." What does the argument actually try to do?
    options:
      - text: "It is a decision argument: if the payoff of belief is infinite and the cost small, believing maximizes expected value even at low probability. It says nothing about whether God exists. The many-gods objection asks which god to wager on."
        correct: true
        feedback: |
          Yes. The wager is about what to do under uncertainty, so it cannot raise the probability that God exists. Critics also press infinite payoffs and the many-gods problem: rival gods with rival rewards leave the matrix open.
      - text: "It proves God exists because the payoff is infinite."
        feedback: |
          A payoff is not evidence. The argument assumes a probability above zero and then says what to do.
      - text: "It shows God does not exist because belief for reward is selfish."
        feedback: |
          The wager makes no claim of that kind. Whether belief for reward can count is a separate debate (and James's reply to Pascal).
      - text: "It only works if the probability of God is above one half."
        feedback: |
          With an infinite payoff any positive probability suffices. With a finite payoff, the break-even is $p = c/(g+c)$, as in the toy examples.
    explanation: |
      Layers: the argument's form is documented; the choice of probabilities and the many-gods objection are live debate. A decision argument is not an existence argument.

  - type: mcq
    id: trap-fideism
    title: "Fideism hates reason?"
    prompt: |
      Someone says: "Fideism is the view that reason is the enemy of faith." Which statement best matches how the lesson sorts the term?
    options:
      - text: "Fideism covers different claims: reason cannot establish faith, reason is irrelevant to it, or reason is hostile to it. Only the last is anti-reason. Kierkegaard and Wittgenstein are often put in the first two, though both are disputed as fideists."
        correct: true
        feedback: |
          Yes. The sorting into three senses is the course's own, and it makes the charge precise. Nielsen coined "Wittgensteinian fideism" as a charge, and Phillips rejects the label.
      - text: "Fideism is the view that faith is proven by reason."
        feedback: |
          That is the opposite family, closer to rational theology or evidentialist apologetics.
      - text: "Fideism is the same as the wager."
        feedback: |
          The wager appeals to reasons of prudence. A fideist need not argue like Pascal.
      - text: "Fideists say Tertullian wrote credo quia absurdum."
        feedback: |
          The phrase is not in Tertullian in that wording; it is a later compression.
    explanation: |
      Layers: the texts of Kierkegaard (under pseudonyms) and Wittgenstein (lecture notes) are documented; whether either is a fideist is scholarly debate. Check which sense a speaker means.

  - type: mcq
    id: trap-split
    title: "Always split the difference?"
    prompt: |
      A rule says: "When an equal peer disagrees with you, always move halfway." What does the weighted rule $c_A' = (1-r)\,c_A + r\,c_B$ show?
    options:
      - text: "The split is the special case $r = \tfrac12$. The weight $r$ is how much you give the peer. Views differ on its value, and the peer conditions (equal ability, same evidence, independence) decide whether it applies at all."
        correct: true
        feedback: |
          Yes. The equal weight view sets $r=\tfrac12$ for true peers. Kelly's total evidence view and Lackey's justificationist view allow other weights.
      - text: "Every rule must give $r=1$: you must adopt the peer's view."
        feedback: |
          That treats yourself as having no evidence of your own. Even the equal weight view gives the peer a half, not all.
      - text: "$r$ must be $0$ because you know your own reasoning best."
        feedback: |
          That is the steadfast end of the range, and it needs a reason why your own judgment outweighs the equal peer's.
      - text: "The rule shows disagreement can be ignored."
        feedback: |
          The rule is a way to take disagreement into account, with the weight in doubt.
    explanation: |
      Layers: the equal weight view and its rivals are live debate. The formula is a model, not a theorem. The trap is to treat one value of $r$ as the rule.

  - type: numeric
    id: trap-pool
    title: "Two witnesses, one average?"
    prompt: |
      Two witnesses, each reading **independent** evidence, start from even odds ($o_0=1$) on a statement $S$. Each reaches odds $o_A = o_B = 4$ in favour (credence $0.8$). If their evidence is truly independent, pooled odds are $o_A\,o_B/o_0$. What credence in $S$ should the pooled odds give? (Give a decimal to two places.)
    answer: 0.94
    tolerance: 0.005
    wrong:
      - { value: 0.8, feedback: "That averages the two credences, which is right only when both read the same evidence. With independent evidence each witness adds something the other lacks." }
    hint: "Pooled odds are $4\\cdot 4/1$. Then credence is $o/(1+o)$."
    explanation: |
      Pooled odds are $16$, so credence is $16/17 \approx 0.94$. Averaging to $0.8$ would be right if each had read the same evidence. Independence is why the answer rises above both. Which case holds in a real disagreement (shared or separate evidence) is part of what peers argue about.

  - type: mcq
    id: trap-atheism
    title: "Atheism means certainty?"
    prompt: |
      A debater says: "Atheism is the certainty that God does not exist, so agnosticism is a third belief in between." Which correction fits the lesson?
    options:
      - text: "Atheism has two senses: lacking belief that God exists (psychological, weak, negative) and holding that God does not exist (metaphysical, strong, positive). Flew proposed the negative sense as a default for debate. Agnosticism concerns what is known, so it can combine with either."
        correct: true
        feedback: |
          Yes, according to the Stanford Encyclopedia of Philosophy, philosophers usually mean the metaphysical sense, and the psychological one fits many self-described atheists. Agnosticism is about knowledge, not a middle credence in the same dimension.
      - text: "Atheism is only the psychological sense; the metaphysical one is called agnosticism."
        feedback: |
          Denying that $G$ is true is the metaphysical atheism, which philosophers recognize. Agnosticism is a different question: whether it is known.
      - text: "Certainty is part of every definition of atheism."
        feedback: |
          Neither sense requires certainty. One can deny $G$ while allowing one might be wrong.
      - text: "Atheists, by definition, hold the burden of proof alone."
        feedback: |
          Who carries the burden is debated, and it depends on the sense used. A negative atheist claims no proposition to defend.
    explanation: |
      Layers: the definitions are documented, though usage varies; the burden-of-proof question is live debate. Always ask which sense is meant.

  - type: mcq
    id: trap-pluralism
    title: "Pluralism is tolerance?"
    prompt: |
      A speaker says: "I am a religious pluralist, which means I respect everyone's religion." In the typology exclusivism, inclusivism, pluralism, what is the issue?
    options:
      - text: "In this typology pluralism is a theory about the truth of religions: several traditions are real paths to the same ultimate reality (Hick's Real). Respect is compatible with exclusivism, and pluralism is not the only way to tolerate."
        correct: true
        feedback: |
          Yes. An exclusivist can be kind and civil, and a pluralist may reform doctrines. The word names a view about truth and salvation, not about manners.
      - text: "Pluralism means all religions say the same thing."
        feedback: |
          Hick holds they differ in their pictures of the Real, and that each is a path; he does not hold the doctrines coincide.
      - text: "Pluralism means no religion is true."
        feedback: |
          Hick claims several have real contact with the Real.
      - text: "Pluralism is the view that only one religion is true."
        feedback: |
          That is exclusivism.
    explanation: |
      Layers: the typology (Race, 1983) is documented; the tricycle and elephant objections are live debate. Pluralism in the philosophical sense and pluralism as a social fact (many religions living together) are different uses of the word.

  - type: mcq
    id: trap-secular
    title: "Secular means anti-religious?"
    prompt: |
      Someone says: "A secular state is one hostile to religion." What does the lesson's vocabulary say?
    options:
      - text: "Secularism (a doctrine about the state) and secularity (a condition of society) are not hostility. A state can be neutral in two ways: even-handed, supporting all alike, or hands-off, supporting none. According to each country's own model, France, the US, Turkey and India differ here."
        correct: true
        feedback: |
          Yes. A secular state may be friendly to religion (India's principled distance, according to Bhargava), strict (French laicite) or in between. Anti-religious policies are a further choice, not part of the word.
      - text: "Secular means the state officially backs one religion."
        feedback: |
          That is establishment.
      - text: "Secular states must ban all religious symbols in public."
        feedback: |
          Some do restrict them (France in schools, 2004, according to the law's own scope), while the US lets pupils wear them. The word does not decide this.
      - text: "Secular means the society has no religious people."
        feedback: |
          Secularity concerns the place of religion, not its absence. Many societies are secular in law and religious in practice.
    explanation: |
      Layers: laws and dates are documented; which model of neutrality is best is live debate and partly a value choice.

  - type: mcq
    id: trap-violence
    title: "Fundamentalism means violence?"
    prompt: |
      A headline says: "Fundamentalism: when faith turns to violence." According to the Fundamentalism Project and the term's history, what is the error?
    options:
      - text: "The term was proposed in 1920 by Curtis Lee Laws as a neutral, inclusive name for conservatives ready to defend the fundamentals. The Project's family-resemblance traits (reaction to marginalization, selective use of tradition and modern tools and similar) do not include violence. Some movements use violence and many do not."
        correct: true
        feedback: |
          Yes. Violence is a fact about some groups, not a part of the trait list. Equating the two makes the word an insult and stops us from describing movements.
      - text: "The word was invented by sociologists as an insult."
        feedback: |
          It began in 1920 as a neutral, inclusive name chosen by a Baptist editor, and its meaning shifted after the Scopes trial and later usage.
      - text: "Fundamentalism exists only in Christianity."
        feedback: |
          The Project studied movements in several traditions. Whether one word fits all is debated.
      - text: "All fundamentalists reject modern technology."
        feedback: |
          The trait list says the opposite: selective use of modern tools.
    explanation: |
      Layers: the term's origin and the Project are documented; whether the label fits across traditions and how to use it are live debate. The lesson cautions that trait wording and count vary between summaries.

  - type: mcq
    id: trap-noconviction
    title: "Humility means no convictions?"
    prompt: |
      A critic says: "Humility is only having no strong convictions." What is the best reply?
    options:
      - text: "Humility concerns how a conviction is held: confidence that fits the evidence, readiness to revise, willingness to hear others. A strong conviction can be held humbly, and a weak one arrogantly."
        correct: true
        feedback: |
          Yes. This account separates humility from timidity and from relativism. Whether committed faith can stay this open is where thoughtful people differ.
      - text: "Humility requires splitting every disagreement in half."
        feedback: |
          That confuses humility with one answer to peer disagreement, and the weight depends on the case.
      - text: "Humility means admitting you know nothing."
        feedback: |
          Socrates, in Plato's Apology, says he neither knows nor thinks he knows what he does not; the later slogan "I know that I know nothing" is a shortening. Admitting some limits is not denying all knowledge.
      - text: "Humility is avoiding all public debate."
        feedback: |
          Humility is a way of holding views, not silence.
    explanation: |
      Layers: the account of intellectual humility is a scholarly one; the application to faith and to atheism is debated. Doubt, denial and agnosticism are different states.

  - type: mcq
    id: trap-dk
    title: "Dunning-Kruger, settled?"
    prompt: |
      A post says: "The Dunning-Kruger effect proves that incompetent people always think they are experts." Which reading is fairest?
    options:
      - text: "The 1999 study reported that low scorers overrated their standing, but its size and cause are contested (some critics point to statistical artifacts, others find a significant but minimal effect). It is not settled, and 'always' is too strong."
        correct: true
        feedback: |
          Yes. A calibration lesson applied to the research itself: keep what has held up, mark what is disputed.
      - text: "The effect was refuted and is a myth."
        feedback: |
          Critics argue the shape is partly statistical, but later work finds a statistically significant but minimal pattern, and Dunning replied to the critics. "Myth" overstates it.
      - text: "The effect is proven for every skill and every person."
        feedback: |
          Nothing in the debate supports "every". Results vary by task and sample.
      - text: "The study measured whether people believe in God."
        feedback: |
          It tested self-assessment on tasks such as logic, grammar and humor.
    explanation: |
      Layers: the 1999 paper and its critics are documented; the best account of the effect is live debate. Humility about a result is itself an act of the virtue.

  - type: mcq
    id: trap-layers
    title: "Sorting the three layers"
    multiple: true
    prompt: |
      Which of these statements is **established fact** (layer 1) rather than scholarly debate or metaphysical commitment? Select all that apply.
    options:
      - text: "Gettier's paper appeared in 1963 and argued that justified true belief is not sufficient for knowledge."
        correct: true
        feedback: |
          Yes. The publication and the thesis it argued are documented. Whether the argument succeeds is debate.
      - text: "Curtis Lee Laws proposed the word 'Fundamentalist' in 1920 as a neutral, inclusive name."
        correct: true
        feedback: |
          Yes. A dated, documented use of the word.
      - text: "Humans have a sensus divinitatis that delivers belief in God."
        feedback: |
          This is Plantinga's claim after Calvin, a metaphysical commitment (layer 3). Whether the faculty exists is what is disputed.
      - text: "Equal peers should give each other equal weight."
        feedback: |
          This is the equal weight view, one side of a live debate (layer 2).
      - text: "All religions are paths to the same Real."
        feedback: |
          This is Hick's pluralist thesis, a metaphysical commitment, with strong objections (layer 3 with layer 2 around it).
    explanation: |
      The sorting is a habit worth keeping: dates and texts are one layer, positions in a live debate are another, and claims about ultimate reality are a third. A trap usually slides a claim from one layer into the one above.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Each trap took a useful idea one step too far: JTB as Plato's settled word, Gettier as dropping justification, Clifford as "no proof, no belief", properly basic as groundless or unrefutable, the wager as a proof of God, fideism as hatred of reason, the split as the only rule, atheism as certainty, pluralism as manners, secular as hostile, fundamentalism as violence, humility as having no convictions, and a contested study as settled.

      A quick check for any such claim: ask which sense of the word is meant, which layer the claim belongs to, and what a thoughtful critic on the other side would say.

      **Next:** Quick Recall, the main rules and formulas of this level in a few fast cards.
