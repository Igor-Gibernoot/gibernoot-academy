id: ch23-pluralism
title: "Religious Pluralism: Many Faiths, One Truth?"
kind: concept
own: |
  The setting: several religious traditions make claims about the divine and about salvation (the final good a tradition promises, such as release or life with God) that cannot all be literally true at once. Philosophers of religion sort the possible responses into three kinds, a typology set out by the Anglican theologian Alan Race in 1983. Each answer is told *according to* the people who hold it.
  - **Exclusivism.** According to its defenders, {{ one's own tradition is the truth, or closer to the truth than any rival, and where rivals contradict it they are mistaken }}. The philosopher Alvin Plantinga (b. 1932) defends it as not necessarily a moral or intellectual failure: one can take other faiths seriously and admit one has no proof that would convince a thoughtful dissenter.
  - **Inclusivism.** According to Karl Rahner (1904-1984), {{ grace in Christ can reach people who never heard of Christ, so a sincere seeker in another faith may be an "anonymous Christian" }}. The Second Vatican Council's constitution *Lumen Gentium* (1964) allows that those who, through no fault of their own, do not know the Gospel can be saved if they seek God and follow conscience. Objection: the label is not one the other faith would accept.
  - **Pluralism.** According to John Hick (1922-2012), the major traditions are different human responses to one ultimate reality, {{ the Real, which in itself cannot be called personal or impersonal, one or many, and appears only through culturally shaped concepts }}. He borrows Kant's contrast between how a thing is in itself (noumenal) and how it appears to us (phenomenal). Objections: calling the Real ineffable already says something about it (Plantinga's point), and the picture may not respect what each faith itself claims.
  - **The elephant story.** Blind men each touch one part of an elephant and disagree. It appears in Buddhist (the *Udana*, a Buddhist text), Jain, Hindu and Sufi (Rumi, Sanai) sources, with different morals. Critics (the theologian Lesslie Newbigin, in essence) say the narrator who sees the whole elephant claims the view that pluralism denies to everyone else.
  - **Disagreement among traditions.** With equal weight (the rule that equal peers split the difference), a believer meeting a peer of another faith should lower confidence. Exclusivists reply that the other person is not a peer in the needed sense; pluralists say the clash lies in how the one Real appears, not in what it is.
  - **Three layers.** Fact: who argued what, what the sources say. Debate: whether pluralism is coherent, whether the traditions' claims conflict. Commitment: whether one's own tradition has a better grip on the truth.

cards:
  - type: text
    id: hook
    title: "Four travellers, one question"
    body: |
      Four travellers share a long train journey and, over several days, each says what they take to be true about the divine. A Muslim says there is one God, who has no partners and sent the Qur'an. A Christian says God is one in three persons, and that Christ is the way. A Hindu says the ultimate reality is *Brahman*, and that each soul is reborn many times. A secular friend says there is no god at all.

      Taken literally, these claims cannot all be true together. God cannot both have three persons and be strictly one, and there cannot be both one life and many lives. Before any theory, a guess. Guessing first is the point. The lesson sets out three answers that thoughtful people give, in the words of their own defenders, and checks what each one says about the disagreement.

  - type: mcq
    id: guess
    title: "Guess: can they all be right?"
    prompt: |
      Each of the four travellers has sincerely described what they take to be true, and the claims about God, souls and the afterlife differ. Which response is the most natural first thought?
    options:
      - text: "At least some of them must be mistaken, if the claims are meant literally."
        correct: true
        feedback: |
          Yes, if the claims are read literally. Two statements that cannot both be true cannot both be right. Notice what the rest of the lesson asks: *which* ones are mistaken, or whether they are meant literally at all.
      - text: "All of them are right, since each is sincere."
        feedback: |
          Sincerity is about the speaker, truth is about the claim. A sincere person can be wrong. Some thinkers do try to say all are right, but only by reading the claims in a particular way, which we meet below.
      - text: "None of them is right, so the question has no answer."
        feedback: |
          Some secular thinkers say so. But that is itself one answer to the question, not a way of avoiding it.
    explanation: |
      The lesson turns on a distinction: whether the traditions' claims are being read as literal claims that can conflict, or as different pictures of one reality. The three views below differ most on that.

  - type: text
    id: three
    title: "Three answers"
    body: |
      The usual classification comes from the Anglican theologian Alan Race, in his 1983 book *Christians and Religious Pluralism*. Following the Stanford Encyclopedia of Philosophy, the three views are these.

      | View | Short statement |
      |---|---|
      | Exclusivism | One's own religion is the truth, or at least closer to it than any rival |
      | Inclusivism | One's own religion has the fullest understanding of ultimate reality, while others hold a partly true one |
      | Pluralism | No one religion has primacy; they offer incomplete understandings of the same reality |

      A caution about the word. In this lesson *pluralism* means a theory about the truth of religions. It is not the same as the plain fact that many religions exist, or as civic tolerance, which a member of any of the three views can support.

  - type: mcq
    id: sort-1
    title: "Which view?"
    prompt: |
      A speaker says: "My tradition gives the fullest picture of ultimate reality. The other traditions hold real but partial truths, and some of their followers may be saved too." Which of the three views is this?
    options:
      - text: "Inclusivism."
        correct: true
        feedback: |
          Yes. The home tradition is the fullest, the others are partly right. That is the middle position.
      - text: "Exclusivism."
        feedback: |
          An exclusivist holds that their own view is the truth or the closest to it, and where rivals contradict it, they are mistaken. This speaker grants real truth to the others, which is the inclusivist move.
      - text: "Pluralism."
        feedback: |
          A pluralist denies that any one tradition has primacy. This speaker still ranks their own as fullest.
    explanation: |
      The test is whether the home tradition keeps a privileged place (exclusivism, inclusivism) and whether the others are credited with any truth.

  - type: mcq
    id: sort-2
    title: "Which view, again?"
    prompt: |
      A speaker says: "Christianity, Islam, Hinduism and the rest are different human responses to one ultimate reality. None of them is the one best picture." Which view is this?
    options:
      - text: "Pluralism."
        correct: true
        feedback: |
          Yes. No tradition has primacy, and all respond to the same reality.
      - text: "Inclusivism."
        feedback: |
          Inclusivism keeps one tradition as the fullest. This speaker does not.
      - text: "Exclusivism."
        feedback: |
          Exclusivism holds that one tradition is the truth, or closest to it. This speaker denies any such primacy.
    explanation: |
      Pluralism is the only one of the three that gives up any privileged place for the home tradition.

  - type: text
    id: exclusivism
    title: "Exclusivism as its holders state it"
    body: |
      Exclusivists hold that their own tradition has the truth, or is closer to it than any rival. They do not need to say that others are fools, or that nothing true is found elsewhere. They say that where the traditions contradict each other on a central claim, the claim of their own tradition is the true one. Many exclusivists add that their tradition gives the only route to salvation, though that is an extra thesis, not part of the definition.

      The internal grounds differ. A Christian exclusivist may point to what they take God to have revealed in Christ, a Muslim exclusivist to the Qur'an, and so on. Alvin Plantinga (b. 1932), a Christian philosopher, argues that exclusivism is not necessarily a moral or intellectual failure. On his account the exclusivist can take other religions seriously and recognise real piety in them, and can admit that they have no proof that would convince a thoughtful person who disagrees.

  - type: mcq
    id: accident
    title: "The accident of birth"
    prompt: |
      A critic, following John Hick, says that for almost everyone the religion they hold depends on where they were born. Someone born in India would probably be a Hindu, and someone born in Egypt probably a Muslim. The critic concludes that the exclusivist's belief that their own tradition is the true one is arbitrary. Which reply is the sort Plantinga gives?
    options:
      - text: "The same reasoning would undermine any conviction that depends on one's upbringing, such as opposition to racism, so it proves too much."
        correct: true
        feedback: |
          Yes. This is the "proves too much" reply: the origin of a belief does not by itself show it is false or unjustified. The critic's reply is that religious claims differ because the traditions' disagreement is so wide and so evenly matched. The debate continues there.
      - text: "Birth has no influence on what religion people hold."
        feedback: |
          That is false and no one in the debate says it. Everyone grants the influence of birth. The question is what follows.
      - text: "People born into other faiths are simply not sincere."
        feedback: |
          Plantinga explicitly grants real piety to other religions. Dismissing their sincerity is no part of the defence.
    explanation: |
      The objection and the reply are both about what the origin of a belief shows. For the exclusivist, the origin does not settle its truth. For the critic, the symmetry across traditions is a reason to doubt that any one of them has a better grip on the truth.

  - type: text
    id: inclusivism
    title: "Inclusivism: Rahner and the Council"
    image:
      src: img/rahner.webp
      alt: "Black and white portrait of Karl Rahner, an older man with glasses."
      caption: "Karl Rahner (1904-1984), a Jesuit theologian, argued that God's grace in Christ may reach people who never heard of Christ."
      credit: "Gabriel Sozzi, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Karl_Rahner_-_Monochrome_representation.jpg"
    body: |
      Inclusivists keep their own tradition as the fullest account of ultimate reality, while crediting others with a partial grasp. The best-known Christian form is that of the Jesuit theologian Karl Rahner (1904-1984). According to Rahner, if salvation comes through Christ, and many people have never heard of him, then a person who sincerely seeks truth and goodness may already respond to God's grace without knowing it. He called such a person an "anonymous Christian".

      The Second Vatican Council's constitution *Lumen Gentium* (promulgated on 21 November 1964), paragraph 16, says in essence that people who, through no fault of their own, do not know the Gospel can attain salvation if they sincerely seek God and follow their conscience. Whether Rahner's own idea is the same as the Council's is debated.

  - type: mcq
    id: anon-objection
    title: "Is the label fair?"
    prompt: |
      The theologian Hans Küng is reported to have objected that a sincere Jew, Muslim or atheist would not accept being called an "anonymous Christian". What is the best statement of this objection?
    options:
      - text: "The label describes other people in terms of the home tradition, which they themselves reject, so it may not respect their own self-understanding."
        correct: true
        feedback: |
          Yes. The worry is about respect and about whose categories are used. Rahner's reply, in essence, is that if all salvation depends on Christ and many never meet him explicitly, some such notion follows from Christian belief itself. It is meant as a statement of what Christians believe, not as an insult.
      - text: "The label shows that Rahner did not believe in Christ."
        feedback: |
          It is the reverse: the label comes from a strong claim about Christ's role in salvation.
      - text: "The label would make it impossible for anyone to be a Christian."
        feedback: |
          It does not. It concerns what happens to people who are not explicit Christians.
    explanation: |
      Küng's remark is a secondary report here, so we state it in essence. The point to keep is the structure: an inclusivist describes others in the home tradition's terms, and others may not recognise themselves there.

  - type: text
    id: pluralism
    title: "Pluralism: Hick's Real"
    body: |
      John Hick (1922-2012), a British philosopher of religion, defended the third view in *An Interpretation of Religion* (1989), based on his Gifford Lectures. He says religious differences reflect the different ways cultures have conceived and experienced one ultimate reality, which he calls the *Real*. His move is borrowed from Kant (1724-1804): there is a difference between a thing as it is in itself (the *noumenal*) and the same thing as it appears to us through our concepts (the *phenomenal*).

      For Hick, personal descriptions (God as a loving Father) and impersonal ones (Brahman, the Dharmakaya) are phenomenal: ways the Real appears in different cultures. The Real in itself is ineffable. According to his *Interpretation*, it cannot be said to be one or many, person or thing, and only purely formal descriptions apply, such as being the ground of religious experience. He also holds that each major tradition is an authentic path of salvation, and that doctrines that clash with a shared ethical ideal should be reformed.

  - type: order
    id: hick-order
    title: "Order Hick's argument"
    prompt: |
      Put the steps of Hick's pluralist argument, as stated in essence, in order.
    steps:
      - "People in many cultures report encountering a transcendent reality and are changed by it."
      - "No tradition shows itself clearly better than the others at transforming people from self-centredness."
      - "So the best explanation is that one ultimate reality is experienced through different culturally shaped concepts."
      - "So the pictures of that reality (personal, impersonal) describe how it appears, not what it is in itself."
    hint: "First what is reported, then what is observed about the traditions, then the explanation, then what it implies about the pictures."
    explanation: |
      The argument is an inference to the best explanation. The weight rests on the second step, which a critic can dispute: whether the traditions really are equal in their fruits, and how that would be judged.

  - type: mcq
    id: tricycle
    title: "Is the Real really ineffable?"
    prompt: |
      Plantinga objects to Hick's claim that none of our concepts applies literally to the Real. His example: the Real is not a tricycle. If that is true, a concept (being a tricycle) has been denied of it. What is the best statement of the problem?
    options:
      - text: "Saying that no concept applies to the Real seems to apply concepts to it, such as 'ineffable' and 'ground of religious experience', so the claim looks self-undermining."
        correct: true
        feedback: |
          Yes. A pluralist can reply that only purely formal concepts apply, and that this is a modest restriction. Critics reply that this still lets some substantive claims through, and the line is hard to draw.
      - text: "Kant never distinguished noumenal from phenomenal."
        feedback: |
          Kant did. The dispute is about how Hick uses the distinction, not whether it exists. Plantinga also notes that Hick's use is not clearly the same as Kant's.
      - text: "The Real cannot exist because it is not a tricycle."
        feedback: |
          This is a joke of the example, not the argument. The point is about the logic of denying all applicable concepts.
    explanation: |
      The objection is a self-reference problem. The pluralist reply is that the claim is only about which kinds of concept apply. The critic replies that the difference between "formal" and "substantive" needs careful defence.

  - type: mcq
    id: respect
    title: "Does pluralism respect each faith?"
    prompt: |
      A second objection says Hick's view, though meant to be generous, does not respect what each faith itself claims. A Muslim, for instance, holds that God is personal and has revealed the Qur'an, not that God is one phenomenal appearance of an unknowable Real. Which statement fits this objection best?
    options:
      - text: "Pluralism offers an interpretation of the traditions that most of them do not themselves accept, so it may be a rival view and not a neutral one. Some critics call it inclusivism in disguise."
        correct: true
        feedback: |
          Yes. The Stanford Encyclopedia reports that Heim argues unitary pluralists like Hick are "really inclusivists in disguise": they place their own theory above the traditions, as the home view that ranks the others.
      - text: "Pluralism is true only if all religions have the same doctrines."
        feedback: |
          The reverse: pluralism is meant to explain differing doctrines. The objection is that its explanation overrides how believers read their own faith.
      - text: "Pluralism cannot be stated in words."
        feedback: |
          That is the ineffability objection, a different one. This one concerns respect for the traditions' self-understanding.
    explanation: |
      The two objections are separate. The first (the tricycle) asks whether the theory is coherent. The second asks whether it is neutral, or whether it quietly ranks the traditions by its own standard.

  - type: text
    id: elephant
    title: "The elephant"
    image:
      src: img/blind-monks-elephant.webp
      alt: "Japanese woodblock print of blind monks feeling an elephant, each touching a different part."
      caption: "A print by Hanabusa Itchō (1652-1724) of blind monks examining an elephant, each touching a different part."
      credit: "Hanabusa Itchō, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Blind_monks_examining_an_elephant.jpg"
    body: |
      Pluralists often use a story. Blind men meet an elephant, and each touches one part. The one who feels a leg says it is a pillar, the one who feels the trunk says a snake, and so on. Each is right about a part and wrong about the whole.

      The story is old and travels between traditions. The earliest written version we have is Buddhist, in the *Udana* (the Tittha Sutta), dated by tradition to the Buddha's lifetime, around 500 BCE. There the Buddha uses it to mock quarrelling teachers. Jain texts use it for *anekantavada*, "many-sidedness": in the 13th century Mallisena used it to say that full understanding takes in all viewpoints. The Persian Sufi poets Sanai (11th to 12th century) and Rumi (13th century) told it too; Rumi's version puts men in a dark room. Which tradition told it first is disputed. Note that the morals differ: the Buddhist one is about quarrelling, not about religions being equal.

  - type: mcq
    id: elephant-critique
    title: "Who sees the elephant?"
    prompt: |
      The missionary theologian Lesslie Newbigin is reported to have objected to the elephant story as used for religions. In essence: the story is told from the point of view of someone who can see the whole elephant. What is the objection?
    options:
      - text: "To say each tradition sees only a part, the teller must claim a view of the whole, which is the privileged view the story says nobody has."
        correct: true
        feedback: |
          Yes. A pluralist can reply that the story is only a picture, and that Hick's claim rests on an argument from religious experience and moral fruits, not on a view from above. Critics say the argument still needs a vantage point from which the traditions are compared.
      - text: "Elephants are not found in every culture."
        feedback: |
          Irrelevant to the logic. The point concerns who can know that the parts belong to one whole.
      - text: "The story proves exclusivism is true."
        feedback: |
          The objection is that the story begs the question against exclusivism and inclusivism, not that it proves either.
    explanation: |
      This is a secondary report of Newbigin; read it in essence. A second critique says the story implies that every blind man is mistaken about what the elephant is, so every tradition would be wrong, not partly right.

  - type: mcq
    id: conflict
    title: "Which claims truly conflict?"
    prompt: |
      Three claims. (a) According to many Christian and Muslim teachers, each person lives one earthly life and is then judged. (b) According to Hindu teaching, each soul is reborn many times. (c) According to a secular naturalist, there is no soul to be judged or reborn. Read literally, what is the relation among them?
    options:
      - text: "Each pair contradicts, so at most one of the three can be literally true."
        correct: true
        feedback: |
          Yes. One life contradicts many lives, and both contradict having no soul at all. Pluralists then choose: read such claims as culturally shaped pictures and not literal statements, or hold that they concern matters outside what saves, or accept that some are mistaken. Exclusivists and inclusivists take the conflict at face value.
      - text: "(a) and (b) agree, since both speak of what happens after death."
        feedback: |
          Speaking of the same topic is not agreeing. One life and many lives are incompatible answers to it.
      - text: "Only (c) conflicts with the others."
        feedback: |
          (a) and (b) also contradict each other, so the conflict is not only between religion and secularism.
    explanation: |
      Hick wrote on conflicting truth claims (1983), and the issue is central: how can the traditions be responses to one reality if they say literally incompatible things? Each view answers differently: the exclusivist picks one side, the inclusivist ranks them, the pluralist reads many claims as culturally shaped images.

  - type: text
    id: disagree
    title: "Disagreement among the traditions"
    body: |
      Now apply the lesson Guided proof: Disagreement Among Equals. There, two peers are in an equally good epistemic position with respect to a statement, and the equal weight view says each should move to the midpoint of their credences. The rule needs the independence condition: reasons to discount the peer must not rest on the disagreement itself.

      Apply it to a believer who meets an equally informed, equally careful believer of another faith. If they are peers, equal weight says both should lower their confidence in the contested claims. That points toward humility, and toward pluralism or agnosticism. But the answer depends on whether the two really are peers.

  - type: mcq
    id: peers-faith
    title: "A peer of another faith"
    prompt: |
      A Christian and a Muslim, equally learned, honest and careful, disagree about whether Christ is divine. Under the equal weight view, what follows, if they are peers on this question?
    options:
      - text: "Each should lower their confidence, since an equally good judge disagrees."
        correct: true
        feedback: |
          Yes. That is the rule. The defender of one's own faith can reply that the other is not a peer in the needed sense: that they lack some evidence, such as the inner witness Plantinga describes, so the independence condition does not force the split. Whether that reply is allowed is the central dispute.
      - text: "Each should become certain, since the other person must be wrong."
        feedback: |
          That is the opposite of equal weight. It lets the disagreement itself count as evidence of the other's mistake, which the independence condition forbids.
      - text: "Nothing follows, since religion is not a matter of belief."
        feedback: |
          Many religious people disagree: for them the belief is central. The rule applies to whatever credence one has.
    explanation: |
      The equal weight view puts the weight on the question of peerhood. Plantinga, according to the Stanford Encyclopedia, argues that Christian exclusivists need not admit true epistemic parity, since they may have been favoured by something like the Internal Witness of the Holy Spirit. Alston, by contrast, holds that without common ground for settling religious disputes, the only rational course for exclusivists is to sit tight.

  - type: mcq
    id: disagree-grid
    title: "Three answers to disagreement"
    prompt: |
      Match each view to its typical way of handling a disagreement between two traditions. Which pairing is right?
    options:
      - text: "Exclusivism: one side is mistaken, and it is the other. Inclusivism: each side holds part of the truth, and the home tradition holds most of it. Pluralism: both describe one reality, and the clash lies in how it appears, not in what it is."
        correct: true
        feedback: |
          Yes. Each is a different way of reading the clash, and each pays a price: the exclusivist must answer the symmetry objection, the inclusivist the objection about labels, the pluralist the objections about coherence and respect.
      - text: "Exclusivism: both sides are right. Inclusivism: both are wrong. Pluralism: one is right."
        feedback: |
          This is reversed. Only pluralism says both are, in some sense, right about the same reality.
      - text: "All three views say the traditions do not really disagree."
        feedback: |
          Only some pluralists say that, and even they usually admit conflicts of literal claims. Exclusivists and inclusivists take the conflicts at face value.
    explanation: |
      The three views are best seen as three answers to one question: what makes the conflicting claims compatible, if anything does?

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Match the statement to its layer. "Alan Race set out the threefold typology in 1983."
    options:
      - text: "Established fact (who wrote what)."
        correct: true
        feedback: "Yes. It is a matter of the record."
      - text: "Live debate."
        feedback: "The attribution is not debated; what is debated is whether the three categories divide the field well. Some scholars argue they should be rethought."
      - text: "Faith or metaphysical commitment."
        feedback: "It is a historical claim, not a commitment."
    explanation: |
      Compare: whether pluralism is coherent is a live debate, and whether one's own tradition grasps the truth best is a commitment each person makes, or declines to make.

  - type: mcq
    id: layers-2
    title: "Which layer is this?"
    prompt: |
      "The major traditions are equally good responses to one ultimate Real." Which layer is this claim?
    options:
      - text: "Faith or metaphysical commitment, backed by an argument from experience and moral fruits that is itself debated."
        correct: true
        feedback: |
          Yes. It is neither a datum nor a consensus. Hick argued for it, and critics deny it on grounds of coherence and respect for the traditions.
      - text: "Established fact."
        feedback: "It is not data. No experiment or text settles it."
      - text: "Scholarly consensus."
        feedback: "Scholars in the field disagree widely on it."
    explanation: |
      The same holds for the other two views as claims about ultimate truth: they sit at the layer of commitment with arguments attached.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the lesson on *Secularism, Church and State* asks a different question: given that people disagree this deeply, how should a state treat religion?
