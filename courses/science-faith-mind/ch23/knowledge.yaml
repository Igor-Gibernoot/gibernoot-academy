id: ch23-knowledge
title: "What Is Knowledge?"
kind: concept
own: |
  The setting: a person $S$ and a statement $p$, such as "it is two o'clock" or "God exists". Write $B(S,p)$ for "$S$ believes $p$", $T(p)$ for "$p$ is true", $J(S,p)$ for "$S$ is justified in believing $p$" (has good grounds), and $K(S,p)$ for "$S$ knows $p$". The question is what $K$ needs. Each answer below is told *according to* its thinkers.
  - **Justified true belief (JTB)**, the definition often traced to Plato's *Theaetetus* (which itself ends without a definition). Knowing is believing something true on good grounds:
    {{ $$K(S,p)\iff B(S,p)\wedge T(p)\wedge J(S,p)$$ }}
  - **Gettier** (Edmund Gettier, 1927 to 2021, "Is Justified True Belief Knowledge?", *Analysis*, 1963). The three conditions can all hold without knowledge, because justification can be had for a false statement and passes along a valid deduction. Smith's belief "the man who gets the job has ten coins" is true only by luck:
    {{ $$B(S,p)\wedge T(p)\wedge J(S,p)\ \not\Rightarrow\ K(S,p)$$ }}
    Russell's stopped clock (1948), Chisholm's sheep (1966) and Goldman's fake barns (1976) share the pattern: good grounds and truth come apart, then meet by accident.
  - **Reliabilism** (Alvin Goldman, 1938 to 2024, "What Is Justified Belief?", 1979). Justification is a matter of how the belief was produced, not of what the believer can cite. A process is reliable when it has a high truth-ratio (outputs are the beliefs it produces):
    {{ $$\text{truth-ratio}=\frac{\text{true outputs}}{\text{all outputs}}$$ }}
    A belief is justified when it comes from such a process. A stopped clock is an unreliable process, so Gettier's clock reader is not justified in this sense.
  - **Objections to reliabilism.** The generality problem (Conee and Feldman, 1998): the same belief comes from many processes of different widths, with different truth-ratios. The new evil demon problem (Cohen, 1984): a victim of deception seems as justified as we are, though their processes are unreliable.
  - **Three layers.** Fact: who argued what and when. Debate: whether any repair of JTB works, and whether justification is about grounds in the mind or reliability in the world. Commitment: how much knowledge claims in religion need, which the next lessons take up.

cards:
  - type: text
    id: hook
    title: "A clock that stopped"
    image:
      src: img/stopped-clock.webp
      alt: A public street clock on a corner whose hands are fixed, as the clock has stopped
      caption: A stopped clock shows a fixed time, and so it is right once or twice a day by pure coincidence.
      credit: "Jaggery, CC BY-SA 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Stopped_clock_on_an_Oldfield_Park_corner,_Bath_-_geograph.org.uk_-_5308870.jpg"
    body: |
      Ana walks past a street clock that she has always found right. It shows two o'clock, she believes it is two o'clock, and it is two o'clock. What she does not know is that the clock stopped exactly one day ago, at the same time. She was lucky to look at the one moment of the day when it is right.

      Bertrand Russell (1872 to 1970), in *Human Knowledge: Its Scope and Limits* (1948), gave a case of this kind: in essence, a man looks at a stopped clock at the right moment, gets a true belief, and cannot be said to have knowledge. Before any theory, a guess. Guessing first is the point, and nothing here asks you to believe or doubt anything religious: the lesson asks what we mean when we say "I know".

  - type: mcq
    id: guess
    title: "Guess: does Ana know?"
    prompt: |
      Ana believes it is two o'clock, it is two o'clock, and she has good grounds: the clock has always been right. But the clock has in fact stopped, and she happened to look at the right moment. What is the most natural verdict?
    options:
      - text: "She has a true belief, but she does not really know the time: she was lucky."
        correct: true
        feedback: |
          Yes, this is the common reaction. It is the seed of the whole lesson: something more than a true belief with good grounds seems to be missing, and it has to do with luck.
      - text: "She knows the time, because her belief is true."
        feedback: |
          If a true belief were enough, a person who guessed the time and was right would know it. Most people deny that, and the stopped clock is a guess in disguise.
      - text: "She knows the time, because she had good reasons."
        feedback: |
          Good reasons are not enough on their own either: here they led to a true belief only by accident. Keep this tension, it is the Gettier problem below.
      - text: "Nobody can know the time, so the question has no answer."
        feedback: |
          Doubt about all knowledge is a real position (a later level takes up doubt), but the case does not need it. Ana's trouble is specific: luck between her grounds and the truth.
    explanation: |
      Keep the guess and its reason. The question "what does knowledge need beyond true belief?" goes back to Plato, and three words carry most of it: belief, truth and justification.

  - type: text
    id: plato
    title: "Where the idea begins"
    image:
      src: img/theaetetus-1578.webp
      alt: A printed page of Plato's Theaetetus from the 1578 edition of Henri Estienne, Greek text in two columns with Latin beside it
      caption: A page of Plato's Theaetetus in the 1578 edition of Henri Estienne, the edition whose page numbers scholars still use to cite Plato.
      credit: "Platon, Herri Estienne, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Henri_Estienne,_Plat%C3%B3n,_Di%C3%A1logo_de_Teeteto_p%C3%A1gina142.jpg"
    body: |
      In Plato's dialogue the *Theaetetus*, Socrates and a young mathematician look for a definition of knowledge (*episteme*, the Greek word usually translated "knowledge"). According to the Stanford Encyclopedia of Philosophy, one answer they test (201c to 210a) is "true belief with an account" (*logos*, here an explanation or reason). Before that, at 200d to 201c, Socrates argues that true belief alone is not enough: a clever speaker can bring a jury to a true belief about a crime without giving them knowledge.

      The dialogue is *aporetic* (a Greek word meaning "without a way through"): it tries three definitions, rejects each, and ends without an answer. So "knowledge is true belief with a reason" is a view often *traced to* Plato's text, not a result he settled. We call it **justified true belief**, or JTB: the three ingredients are *belief*, *truth* and *justification* (having good grounds or reasons).

  - type: mcq
    id: truth-q
    title: "Why truth is on the list"
    prompt: |
      A medieval scholar sincerely believes, on the best evidence of his day, that the Sun goes around the Earth. He has strong grounds and no doubts. Which statement fits the idea that knowledge needs truth?
    options:
      - text: "He believed it and was justified, but since it is false he did not know it; he thought he knew it."
        correct: true
        feedback: |
          Yes. We often say "I knew it was safe" after finding it was not, and then we mean we *thought* we knew. Philosophers say knowledge is *factive* (it implies the fact): to know that $p$, $p$ must be so.
      - text: "He knew it, because knowledge only needs strong grounds."
        feedback: |
          Then people could "know" things that are false, and "he knew it but it was false" would not sound odd. It does sound odd, and that is the evidence that truth is part of knowing.
      - text: "He knew it for his time, and it is true for his time."
        feedback: |
          This swaps knowledge for what was believed. Some thinkers do relativise truth, but the standard view of JTB is that the claim must be true, whatever the era.
      - text: "He did not believe it, because beliefs must be true."
        feedback: |
          Beliefs can be false. Believing is a state of the person, not a success, and the false belief is exactly what the scholar had.
    explanation: |
      So truth is a condition of knowledge, belief is a condition (you cannot know what you do not accept), and what remains is the third ingredient.

  - type: mcq
    id: just-q
    title: "Why justification is on the list"
    prompt: |
      A person flips a coin to decide whether a stranger's lottery ticket is a winner. The coin says yes, she believes it, and the ticket indeed wins. She has a belief and it is true. What does the JTB definition say, and why?
    options:
      - text: "She does not know: her belief is true and held, but she has no good grounds, so the third condition fails."
        correct: true
        feedback: |
          Yes. This is the job of the third ingredient: it separates knowing from a lucky guess.
      - text: "She knows, because the ticket won."
        feedback: |
          This counts only truth. A lucky guess that comes out right would then count as knowledge, and most people deny that.
      - text: "She knows, because she believed it strongly."
        feedback: |
          Strength of feeling is not a ground. A very sure guess is still a guess.
      - text: "She does not know, because lottery tickets cannot be known about."
        feedback: |
          Many facts about tickets can be known, such as the draw result after it is announced. Her problem is the grounds, not the subject matter.
    explanation: |
      JTB says: $S$ knows $p$ exactly when $S$ believes $p$, $p$ is true, and $S$ is justified. It was long accepted as the best account, and it handles the lucky guess.

  - type: order
    id: jtb-check
    title: "Testing a case against JTB"
    prompt: |
      According to the JTB definition, put in order the checks that decide whether a person $S$ knows a statement $p$.
    steps:
      - "Ask whether $S$ actually believes $p$ (accepts it, relies on it)."
      - "Ask whether $p$ is true."
      - "Ask whether $S$ has good grounds for believing $p$."
      - "If all three hold, the definition says $S$ knows $p$; if one fails, it says $S$ does not."
    hint: "The three ingredients come first, the verdict last."
    explanation: |
      The order of the first three checks does not matter, only that all three are done. The definition says "if all three, then knowledge": that last step is the one Gettier tested.

  - type: text
    id: gettier
    title: "Gettier, 1963"
    image:
      src: img/gettier.webp
      alt: Photograph of Edmund Gettier
      caption: Edmund Gettier (1927 to 2021), whose three-page paper of 1963 changed how philosophers define knowledge.
      credit: "DaveGettier, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Edmund_L_Gettier_III_ca_1960s_umass_(cropped).jpg"
    body: |
      **Edmund Gettier** (1927 to 2021), an American philosopher then at Wayne State University, published "Is Justified True Belief Knowledge?" in the journal *Analysis* in 1963 (volume 23, pages 121 to 123). It is about three pages long. According to Gettier, a person can have a justified true belief without knowing.

      His first case: Smith and Jones both apply for a job. Smith has been told by the company president that Jones will get it, and he has counted ten coins in Jones's pocket. So Smith is justified in believing "Jones will get the job and Jones has ten coins in his pocket". From this he deduces "the man who will get the job has ten coins in his pocket". But in fact Smith gets the job, and, without knowing it, Smith himself has ten coins in his pocket. So the deduced statement is true.

  - type: mcq
    id: gettier-q
    title: "Does Smith know?"
    prompt: |
      In the job case, Smith believes "the man who gets the job has ten coins in his pocket". The statement is true (Smith gets the job and has ten coins). Smith deduced it from strong evidence about Jones. Which verdict fits Gettier's argument?
    options:
      - text: "All three JTB conditions hold, yet Smith does not know: the statement is true because of Smith's own coins, which his evidence never touched."
        correct: true
        feedback: |
          Yes. Belief, truth and justification are all present. The grounds (Jones's coins) and the truth-maker (Smith's coins) have nothing to do with each other. JTB says "knowledge" and our judgment says "luck".
      - text: "Smith knows, since the definition says so."
        feedback: |
          Gettier's point is that the definition's verdict clashes with what we judge. If we defer to the definition we make the case a non-problem, but then we also call a lucky coincidence knowledge.
      - text: "Smith's belief is not true, so JTB is not tested."
        feedback: |
          It is true: Smith gets the job and has ten coins. The falsehood is in the premise he deduced from, not in the conclusion.
      - text: "Smith's belief is not justified, because it came from a false premise."
        feedback: |
          This is the reply some philosophers make, and it is a live one (see the next card). But Gettier's argument assumes that a justified belief can be deduced from a false but well-supported premise.
    explanation: |
      Notice how the argument runs: take a justified false belief, deduce a true consequence, and the consequence is true by accident. The next card names the two assumptions.

  - type: mcq
    id: assump-q
    title: "Which assumption would a critic reject?"
    prompt: |
      Gettier's cases rest on two points. Point A: a person can be justified in believing a statement that is in fact false. Point B: if $S$ is justified in believing $P$, $P$ entails $Q$, and $S$ deduces $Q$ from $P$ and accepts it, then $S$ is justified in believing $Q$. A critic wants to escape the cases without giving up JTB. What could the critic say?
    options:
      - text: "Reject Point A: justification in the sense that knowledge needs cannot attach to a false statement, so Smith was never justified in the first place."
        correct: true
        feedback: |
          Yes, this is one way out, and some philosophers have argued it. The price is steep: our best evidence is sometimes misleading, and it seems odd to say we were then never justified.
      - text: "Reject both points because logic is unreliable."
        feedback: |
          Deduction is not under attack. Point B is a claim about justification passing along valid deduction, and the critic would need a reason to reject that specific claim.
      - text: "Accept both points and deny that Smith believes anything."
        feedback: |
          Smith plainly believes the deduced statement: he is willing to act on it. Denying belief does not touch the case.
      - text: "Say that Smith is an unusual case, so it does not matter."
        feedback: |
          Chisholm's sheep and Goldman's fake barns (next) are ordinary-looking cases of the same pattern, so rarity does not rescue JTB.
    explanation: |
      The critic could also reject Point B. Most philosophers kept both points and concluded that JTB is not sufficient. That is a live debate: the layer of fact is Gettier's argument, the layer of debate is whether either point must go.

  - type: text
    id: gettier2
    title: "A second case and a pattern"
    body: |
      Gettier's second case uses a disjunction (a statement of the form "A or B", true if at least one part is true). Smith has strong evidence that Jones owns a Ford. From it he deduces "Jones owns a Ford, or Brown is in Barcelona", where Brown is an acquaintance whose whereabouts Smith has no information about. The first part is false: Jones does not own a Ford. But Brown happens to be in Barcelona, so the disjunction is true. Smith's grounds support only the first part, and the truth comes from the second.

      Other philosophers built simpler cases. According to the Internet Encyclopedia of Philosophy, in Roderick Chisholm's version (*Theory of Knowledge*, 1966) you see what looks like a sheep in a field; it is a dog disguised as a sheep, but a real sheep stands behind a hill. Your belief "there is a sheep in the field" is true and justified, yet lucky. Alvin Goldman (1976) credited to Carl Ginet the case of a driver who looks at a real barn in a county full of barn facades. The pattern is the same. Linda Zagzebski (1994, "The Inescapability of Gettier Problems") argued that the pattern arises for any account of knowledge that adds to true belief a condition not guaranteeing truth.

  - type: mcq
    id: pattern-q
    title: "What do the cases share?"
    prompt: |
      In the stopped clock, the job and coins, the sheep-dog and the fake barns, a person has a true belief and good grounds. Which feature do all four share, according to the pattern described above?
    options:
      - text: "The grounds and the truth are linked only by luck: the belief would probably have been false, but something else makes it true."
        correct: true
        feedback: |
          Yes. In each case something goes wrong with the usual link (the clock is stopped, the evidence is about Jones, the animal is a dog, the barns are mostly fake), and a different fact rescues the truth. The common thread is luck in how the truth is reached.
      - text: "The believer has a false belief somewhere in the argument or the scene."
        feedback: |
          Often yes (the stopped clock is believed to work), but the barn driver reasons from no false premise. So falsehood in the reasoning cannot be the common feature.
      - text: "The believer is irrational."
        feedback: |
          The believers are reasonable: they use ordinary grounds that usually work. That is why the cases bite.
      - text: "The believers are all missing a sense, such as hearing."
        feedback: |
          Nothing in the cases depends on a faculty missing. Their senses work as usual.
    explanation: |
      Hence the next question: how to say what is missing. Several repairs have been tried; here are two of them.

  - type: numeric
    id: luck-num
    title: "How lucky was Ana?"
    prompt: |
      A stopped clock with a 12-hour dial shows one fixed time. Ana looks at a random moment and reads the time to the nearest minute. The clock is correct for one minute out of every 12 hours. Her belief is true only if she happens to look in that minute. Out of how many equally likely minutes is it right once?
    answer: 720
    answerText: '720'
    wrong:
      - { value: 1440, feedback: "1440 minutes is a full day, but a 12-hour dial repeats every 12 hours, so the dial is right once in each 12-hour cycle: $12\times60=720$." }
      - { value: 60, feedback: "60 is the minutes in one hour. The dial runs through 12 hours before it repeats." }
    hint: "Count the minutes in the 12 hours of the dial."
    explanation: |
      $12\times60=720$ minutes, so the chance of a correct reading is $1/720$, about $0.14\%$. The truth of her belief was a long shot even though her grounds were ordinary.

  - type: text
    id: reliabilism
    title: "A repair: reliabilism"
    body: |
      One family of answers keeps true belief and changes how justification is understood. Alvin Goldman (1938 to 2024) proposed a causal condition in "A Causal Theory of Knowing" (1967): the fact known must be linked by a suitable chain to the belief. In "What Is Justified Belief?" (1979) he gave **reliabilism**, which defines justification by how the belief was *produced*. A **process** is a way of forming beliefs, such as seeing in daylight, remembering or guessing. According to Goldman, a belief is justified when it is produced by a process with a high **truth-ratio** (the outputs are the beliefs the process produces):

      $$\text{truth-ratio}=\frac{\text{true outputs}}{\text{all outputs}}$$

      The believer need not be able to cite the grounds; what counts is the reliability of the process in the world. Another repair, offered by various philosophers, requires that the belief not be inferred from any falsehood. That handles the job case, whose conclusion rests on a false belief about Jones, but the barn driver reasons from no falsehood at all.

  - type: mcq
    id: rel-q
    title: "Reliabilism and the stopped clock"
    prompt: |
      Reliabilism says a belief is justified when it comes from a process with a high truth-ratio. Ana forms her belief by "trusting a street clock", and on this occasion the clock is stopped. What does reliabilism say, and which rival reading is natural?
    options:
      - text: "If the process is 'reading a stopped clock', its truth-ratio is tiny, so she is not justified; if the process is 'trusting street clocks', its ratio is high, so she is. The verdict depends on how the process is described."
        correct: true
        feedback: |
          Yes. This is exactly the **generality problem**: one belief is produced by many processes of different widths, with different truth-ratios, and the theory must say which one counts. Our application, not a quotation from Goldman.
      - text: "Reliabilism says she knows, because the clock is usually right."
        feedback: |
          This picks the widest process without argument. A theorist could also say the relevant process is the narrower 'reading this stopped clock'. Both are on the table.
      - text: "Reliabilism says nothing, because reliability cannot be measured."
        feedback: |
          Truth-ratios can be measured for well-specified processes. The difficulty is deciding *which* process to measure, not measuring.
      - text: "Reliabilism says she is justified because she believed it strongly."
        feedback: |
          Strength of conviction is not what reliabilism counts. The process and its truth-ratio are.
    explanation: |
      Earlier, the common reaction was that Ana does not know. A reliabilist can capture it by choosing the narrow process, but must then defend that choice. That defence is the generality problem, pressed by Earl Conee and Richard Feldman in 1998 ("The Generality Problem for Reliabilism").

  - type: numeric
    id: barn-num
    title: "Fake barns by the numbers"
    prompt: |
      In a county where 8 of every 10 barn-looking buildings by the road are facades, a driver forms, at a glance, the belief "that is a barn" about each one. Use the truth-ratio, true beliefs divided by all beliefs the process produces. What is the truth-ratio of this glance-process in that county?
    answer: 0.2
    tolerance: 0.001
    answerText: '0.2'
    wrong:
      - { value: 0.8, feedback: "0.8 is the share of facades, which are false beliefs. The truth-ratio counts the true ones: $2/10$." }
    hint: "Two in ten are real barns."
    explanation: |
      True beliefs: 2 of 10, so $2/10=0.2$. In a county with no facades the same glance-process would score near 1. That the verdict shifts with the surroundings, though the driver's experience is the same, is why such cases are often cited as a puzzle for how to type the process (our reading). Goldman (1976) credits the case to Carl Ginet.

  - type: mcq
    id: demon-q
    title: "The new evil demon"
    prompt: |
      Stewart Cohen (1984, "Justification and Truth") pressed a case. Picture a person whose experiences are exactly like yours but who is systematically deceived by an evil demon, so almost all their beliefs are false. Reliabilism says their processes have a low truth-ratio. What is the objection?
    options:
      - text: "The deceived person seems as justified as you are, since they reason as carefully as you do, yet reliabilism says they are not."
        correct: true
        feedback: |
          Yes. This is the **new evil demon problem**. A reliabilist can reply that justification tracks reliability in the world, so the deceived person is simply unlucky, or can adjust the theory. Either way the case shows where the disagreement is: grounds inside the mind or reliability outside it.
      - text: "The person is not conscious, so nothing can be said."
        feedback: |
          The case stipulates that the person has experiences like yours. That is what makes the intuition strong.
      - text: "The objection shows that reliable processes do not exist."
        feedback: |
          It does not: it shows a possible mismatch between reliability and our judgments of justification, in one imagined world.
      - text: "The objection only applies to religion."
        feedback: |
          The case is general to all belief. It matters for religion only because religious believers and sceptics both ask what makes their beliefs justified.
    explanation: |
      Two pictures of justification meet here. According to **internalists**, justification depends only on factors internal to the thinker, so two thinkers who are internal duplicates are justified alike. **Externalists** deny this, and reliabilism is an externalist theory. Reliabilists have replied to the demon case in two ways: refine reliability (for example, reliability in normal environments), or deny that the deceived person is justified. Philosophers still part ways on which is right.

  - type: mcq
    id: trap-q
    title: "What Gettier did and did not show"
    prompt: |
      A student says: "Gettier proved that nobody knows anything." What is the best correction?
    options:
      - text: "Gettier argued only that belief, truth and justification together are not sufficient for knowledge. He did not say they are not necessary, nor that knowledge is impossible."
        correct: true
        feedback: |
          Yes. After 1963 most philosophers kept the three as necessary and looked for a fourth condition or a replacement for justification. The paper itself is a counterexample to sufficiency.
      - text: "Gettier showed that truth is not required for knowledge."
        feedback: |
          His cases all have true beliefs. They show that truth plus the others is still not enough, not that truth can be dropped.
      - text: "Gettier showed that justification is useless."
        feedback: |
          The cases presuppose justification as part of the story, and the repairs keep some form of it. The argument is that it is not all that is needed.
      - text: "Gettier proved that knowledge is just luck."
        feedback: |
          The lesson of the cases is the reverse: knowledge seems to exclude luck of this kind.
    explanation: |
      This is a common slip. The difference between "not sufficient" and "not necessary" is the heart of the argument, and the same logic returns in the next lessons about faith.

  - type: mcq
    id: faith-q
    title: "Why this matters for faith and reason"
    prompt: |
      A believer says "I know that God exists", and a sceptic says "you only believe it". Using only this lesson, which two questions would a careful listener raise before judging between them?
    options:
      - text: "Is the claim true (a question the lesson cannot settle), and what kind of grounds or process is claimed to make the belief justified, internal evidence or a reliable process?"
        correct: true
        feedback: |
          Yes. Truth is one condition, and justification is another, with at least two theories of what it is. Whether the belief is true is the layer of metaphysical commitment, which different traditions answer differently, and this course does not decide it.
      - text: "Only whether the believer feels sure."
        feedback: |
          Feeling sure is neither of the conditions. A person can be sure and wrong or sure and lucky.
      - text: "Whether the sceptic has a university degree."
        feedback: |
          Credentials do not enter any of the three conditions, though they can bear on grounds.
      - text: "Whether the Gettier cases prove that religious belief is false."
        feedback: |
          They say nothing about God. They are about the *structure* of knowledge, and apply to belief about clocks and barns as much as to anything else.
    explanation: |
      Each side can be fair here. A believer may claim a reliable source or direct experience (externalist style); a sceptic may demand evidence one can cite (internalist style). The lesson does not choose, and the next lesson takes the second path: how much evidence a person owes.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** On whether JTB can be repaired at all, on whether justification is about grounds in the mind or reliability in the world, and on how much knowledge claims in religion require. Open: no analysis of knowledge is accepted by all.

      **Next:** the lesson Evidentialism: Clifford asks whether it is ever wrong to believe on thin evidence, and William Kingdon Clifford answered in an essay of 1877, "The Ethics of Belief".
