id: ch23-challenge
title: "Level Challenge: How Should One Believe?"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge: a case file from Halde"
    body: |
      Every problem here uses an **invented** town, Halde, a quarry town with a mill bridge, a school, a harbour clock and two rival places of worship. Nothing in it is a claim about a real town or a real tradition. Where a real thinker appears, the view is taught as "according to ...".

      - **Problem 1 · Three beliefs about the time.** Plain knowledge, a Gettier case, or reliable-process knowledge.
      - **Problem 2 · The mill bridge.** An odds update, and whether that much evidence is "sufficient".
      - **Problem 3 · Stakes.** How much chance is enough, and a wager with many gods.
      - **Problem 4 · Two surveyors.** Split the difference, give a weight, or add the evidence.
      - **Problem 5 · Two faiths, one school.** Exclusivist, inclusivist or pluralist replies, and what the state may do.

      **Three layers.** Established fact; scholarly consensus or live debate; faith or metaphysical commitment. Each problem ends by sorting its claims into these layers. The problems ask what each norm of belief requires, never whether a religion is true.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      Seven tools from the level, each stated so it can be used alone.

      - **Knowledge.** According to the tradition traced to Plato's *Theaetetus*, knowing is **justified true belief** (JTB): believing something true on good grounds. According to Edmund Gettier ("Is Justified True Belief Knowledge?", *Analysis*, 1963), all three can hold without knowledge, when the truth comes by luck. According to Alvin Goldman ("What Is Justified Belief?", 1979), a belief is justified when a **reliable process** produced it, one whose outputs are mostly true.
      - **Evidence.** According to William Kingdon Clifford ("The Ethics of Belief", 1877), it is wrong to believe on insufficient evidence. Evidence can be weighed in odds form:
        $$\text{posterior odds}=\text{LR}\times\text{prior odds},$$
        where the likelihood ratio LR is the probability of the observation if the claim is true divided by its probability if false.
      - **Stakes.** According to William James ("The Will to Believe", 1896), a choice is a **genuine option** when it is live, forced and momentous, and then one may believe before the evidence settles it. A toy version: commit when
        $$p>\frac{c}{g+c},$$
        where $p$ is your chance that the hypothesis is true, $g$ the gain if it is, and $c$ the loss if not.
      - **The wager.** According to Blaise Pascal, wagering for God has expected value $\mathrm{EV}=\sum_j p_jx_j$ (each payoff times the chance of its state). The **many gods** objection says that other possible gods, who might punish this wager, can cancel the gain.
      - **Disagreement.** According to defenders of the **equal weight view** (Adam Elga; David Christensen defends a looser version), peers who disagree should each move halfway between the two credences. A credence is a degree of belief between $0$ and $1$. With weight $r$ on the other, $c_A'=(1-r)c_A+r\,c_B$. If the credences come from independent evidence, the odds multiply instead.
      - **Traditions.** According to Alan Race (*Christians and Religious Pluralism*, 1983), views on other faiths are **exclusivist** (one tradition has the truth), **inclusivist** (one tradition has the fullest truth but others share in it) or **pluralist** (several traditions respond to one ultimate reality).
      - **The state.** The French law of 1905 says the Republic "ne reconnaît, ne salarie ni ne subventionne aucun culte" (recognises, pays and subsidises no form of worship). The First Amendment to the US Constitution says Congress shall make no law respecting an establishment of religion, or prohibiting its free exercise.

  # ---------------- Problem 1 ----------------
  - type: mcq
    id: p1-timetable
    title: "Problem 1 · The timetable"
    prompt: |
      **Problem 1.** Three people in Halde (invented) each believe they know the time. First, Ada reads the printed timetable at the station, which is correct and up to date, and believes the barge leaves at 9:15. It does leave at 9:15. Which label fits Ada's belief best?
    options:
      - text: "Justified true belief that is ordinary knowledge: good grounds, true, and nothing odd connecting them."
        correct: true
        feedback: |
          Yes. Her grounds are good and they are the reason the belief is true, so truth and grounds are tied together. This is the case JTB was built for.
      - text: "A Gettier case: it is justified and true, so it must be luck."
        feedback: |
          Being justified and true is not enough for a Gettier case. Gettier's cases have a gap between the grounds and the truth: the belief is true by accident. Here the timetable is accurate, so the truth flows from the grounds.
      - text: "Reliable-process knowledge only: Ada can give no grounds."
        feedback: |
          Ada can cite her grounds, the timetable. A reliabilist would also count the belief as justified, since reading an accurate timetable is a reliable process, but "only" fails because the plain account works as well.
      - text: "Not knowledge: only a person who could never be wrong knows."
        feedback: |
          That demands certainty. Neither JTB nor reliabilism asks for it. Good grounds that happen to be tied to the truth are enough.
    explanation: |
      Ada's case is the baseline: grounds, truth and the link between them. The next two cases each take away one thing.

  - type: mcq
    id: p1-clock
    title: "The harbour clock"
    prompt: |
      Teo glances at the harbour clock, which shows 3:10, and believes it is 3:10. The clock has in fact been stopped since yesterday at 3:10, and by coincidence it really is 3:10. Teo had no reason to think it stopped. Which label fits Teo's belief best?
    options:
      - text: "A Gettier case: justified and true, but true by luck, so many philosophers deny it is knowledge."
        correct: true
        feedback: |
          Yes. Looking at a clock is normally a good ground, and the belief is true, yet the clock gives no link to the time. The truth is an accident. This is the pattern of Russell's stopped clock.
      - text: "Ordinary knowledge: he looked at a clock and the time matched."
        feedback: |
          The match is the problem. The clock would have shown 3:10 whatever the time. A belief true by coincidence is exactly what Gettier cases isolate.
      - text: "Reliable-process knowledge: looking at clocks is usually reliable."
        feedback: |
          The general process, reading clocks, is mostly reliable, which is the difficulty the generality problem names. But the process that actually produced this belief used a stopped clock, whose truth-ratio is poor. Goldman's account can also deny knowledge here.
      - text: "Not even a belief: he did not check the clock."
        feedback: |
          Teo does believe it is 3:10. Belief needs only that he takes it to be so.
    explanation: |
      JTB says Teo knows; most people say he does not. That clash is Gettier's point. Whether the repair is a fourth condition or a different account of justification is a live debate.

  - type: mcq
    id: p1-pilot
    title: "The ferry pilot"
    prompt: |
      Ines is a ferry pilot who "feels" a storm coming. She cannot say why. Across 20 years, her feeling has been right on 95 of every 100 nights it came. Tonight she feels it, believes a storm is coming, and one comes. According to reliabilism (Goldman), what is Ines's belief?
    options:
      - text: "Justified, and knowledge: it comes from a process with a high truth-ratio, even though she cannot cite grounds."
        correct: true
        feedback: |
          Yes. For the reliabilist, what makes a belief justified is how it was produced, not what the believer can say. A process right 95% of the time counts as reliable.
      - text: "Not justified: she cannot state any grounds."
        feedback: |
          That is the internalist reply (justification needs grounds the believer can cite). It is a real rival, but the question asks what reliabilism says, and for it the missing grounds do not matter.
      - text: "A Gettier case: she could not have known it."
        feedback: |
          Gettier cases need a lucky gap between grounds and truth. Here nothing is lucky: the feeling tracks storms across 20 years.
      - text: "Knowledge only if the feeling is right 100 times in 100."
        feedback: |
          Reliabilism asks for a high truth-ratio, well above one half, not perfection.
    explanation: |
      The same belief is justified for the reliabilist and doubtful for the internalist. This is the split in the level: grounds in the mind, or reliability in the world.

  - type: mcq
    id: p1-layers
    title: "Three layers in Problem 1"
    prompt: |
      Sort these three claims about Halde's clock and pilot. Which one is a **layer-3** claim (a commitment that evidence from the cases cannot settle)?
    options:
      - text: "A person must be able to state their grounds for a belief to count as knowing."
        correct: true
        feedback: |
          Yes. Whether knowledge needs accessible grounds (internalism) or only a reliable process (reliabilism) is a position about what knowledge is, and the cases themselves cannot force either.
      - text: "Gettier published his paper in *Analysis* in 1963."
        feedback: |
          That is layer 1, an established fact about a publication.
      - text: "Most philosophers say the clock reader does not know."
        feedback: |
          That is layer 2, a report of where scholars stand, checkable by surveying them.
      - text: "The clock in the case was stopped."
        feedback: |
          That is a stipulated fact of the case, not a commitment.
    explanation: |
      Layer 1 here is who wrote what and what the cases stipulate. Layer 2 is that most philosophers judge the clock reader ignorant and that no repair of JTB has won general agreement. Layer 3 is whether grounds must be available to the believer.

  # ---------------- Problem 2 ----------------
  - type: numeric
    id: p2-odds
    title: "Problem 2 · The mill bridge"
    prompt: |
      **Problem 2.** The old mill bridge in Halde (invented) is sound or unsound. Before any test, the engineers put the odds at 4 to 1 that it is sound. A tap test passes a sound bridge 72% of the time and an unsound one 4% of the time. The bridge passes. The likelihood ratio is $0.72/0.04=18$. By the odds form of Bayes' rule, posterior odds $=\text{LR}\times$ prior odds. What are the posterior odds for "sound", written as a number to 1?
    answer: 72
    tolerance: 0.5
    answerText: '72 to 1'
    wrong:
      - { value: 22, feedback: 'That adds, $4+18$. Evidence multiplies the odds, it does not add to them.' }
      - { value: 4.5, feedback: 'That divides, $18/4$. The posterior odds are the likelihood ratio times the prior odds.' }
      - { value: 18, feedback: 'That is the likelihood ratio alone, which forgets the prior. The prior odds of 4 to 1 still count.' }
    hint: Multiply $18$ by $4$.
    explanation: |
      $$18\times4=72.$$
      The odds for "sound" are 72 to 1.

  - type: numeric
    id: p2-unsound
    title: "How likely is it unsound?"
    prompt: |
      Posterior odds of 72 to 1 for "the bridge is sound". What is the chance, in percent, that it is unsound? Odds $a$ to 1 for a claim mean a chance $a/(a+1)$ for it. Give the percent to one decimal.
    answer: 1.4
    tolerance: 0.06
    answerText: '1.4 (1 in 73)'
    wrong:
      - { value: 5.3, feedback: 'That is $1/19$, using the likelihood ratio as if it were the odds. The prior and the test combine to 72, so the chance of unsound is $1/73$.' }
      - { value: 20, feedback: 'That is the prior chance of unsound, 1 in 5, before the test. The pass has since lowered it.' }
    hint: The chance of unsound is $1/(72+1)$.
    explanation: |
      $$\frac{1}{73}\approx0.0137\approx1.4\%.$$
      A second independent pass multiplies the odds again, to $18\times72=1296$ to 1, about $0.08\%$ unsound ($1/1297$).

  - type: mcq
    id: p2-sufficient
    title: "Is that enough?"
    prompt: |
      A hay cart wants to cross the bridge, and later the whole school wants to walk over it. The unsound chance is $1.4\%$ in both cases. According to Clifford, believing on insufficient evidence is wrong. Does the number $1.4\%$ settle whether "the bridge is safe" may be believed?
    options:
      - text: "No. What counts as sufficient is a choice about stakes, so the same 1.4 percent may be enough for the hay cart and too much for the school."
        correct: true
        feedback: |
          Yes. The arithmetic gives the strength of the evidence. Clifford's rule needs a further judgment, how strong is strong enough, and moderate evidentialists let it grow with what is at risk. James then adds that when evidence cannot decide a momentous, forced choice, one may go beyond it.
      - text: "Yes. Any chance of error under 5% is sufficient, as a rule of logic."
        feedback: |
          No rule of logic sets 5%. That cut-off is a convention in some sciences, and even there it is chosen, not derived.
      - text: "Yes. Under Clifford, any evidence short of certainty is insufficient, so belief is forbidden."
        feedback: |
          That reading would forbid nearly all belief. Clifford's examples (the shipowner) concern evidence that was not honestly examined, and he allows belief on good evidence.
      - text: "No. Probabilities cannot be applied to bridges."
        feedback: |
          They can: the test gave a likelihood ratio and the update is legitimate. The open question is how much is enough, not whether numbers apply.
    explanation: |
      Clifford and James agree on the odds. They part on two points: how strong the evidence must be, and whether anything beyond evidence may ever tip a belief.

  - type: mcq
    id: p2-layers
    title: "Three layers in Problem 2"
    prompt: |
      Which of these claims about the mill bridge and its test is a **layer-1** claim, established once the numbers are given?
    options:
      - text: "With prior odds 4 to 1 and a likelihood ratio of 18, the posterior odds are 72 to 1."
        correct: true
        feedback: |
          Yes. It follows from the rule and the numbers, by arithmetic. Anyone who accepts the setup must accept it.
      - text: "A belief with a 1.4 percent chance of error is sufficiently supported."
        feedback: |
          That is a commitment about how much is enough (layer 3), the one the numbers do not make.
      - text: "Clifford's strict rule is correct for beliefs about bridges."
        feedback: |
          That is a normative position about duty, which philosophers dispute (layer 2 as a debate, and for each person layer 3).
      - text: "Most evidentialists let the required amount rise with the stakes."
        feedback: |
          That is a claim about where scholars stand (layer 2), not a computed fact.
    explanation: |
      The arithmetic is layer 1. Whether moderate or strict evidentialism is right is a live debate (layer 2). How much risk one will accept is a commitment (layer 3).

  # ---------------- Problem 3 ----------------
  - type: widget
    id: p3-threshold
    title: "Problem 3 · Stakes"
    widget: decision-matrix
    config:
      actions: ["Commit to believing H", "Withhold belief"]
      states: ["H is true", "H is false"]
      payoffs: [[6, -2], [0, 0]]
      probs: [0.5, 0.5]
      threshold: true
      labels:
        corner: "Act / State"
      presets:
        - { label: "g = 6, c = 2", payoffs: [[6, -2], [0, 0]] }
        - { label: "g = 1, c = 9", payoffs: [[1, -9], [0, 0]] }
    body: |
      **Problem 3.** A Halde apprentice must decide whether to commit to a hypothesis $H$ (an invented one: that a hidden spring lies under the quarry) before anyone can test it. Committing gains $g$ if $H$ is true and costs $c$ if false; withholding pays $0$ either way. Drag the chance and read the break-even chance in the readout, for both presets.

  - type: numeric
    id: p3-james
    title: "How much chance is enough?"
    prompt: |
      An apprentice may commit to $H$. Committing gains $g=6$ if $H$ is true and costs $c=2$ if $H$ is false; withholding pays $0$. Using James's toy rule (commit when $p>c/(g+c)$), at what chance $p$ do the two acts have equal expected value? Give a decimal.
    answer: 0.25
    tolerance: 0.005
    answerText: '2/8 = 0.25'
    wrong:
      - { value: 0.333, feedback: 'That is $c/g=2/6$. The expected-value condition $pg=(1-p)c$ gives $p=c/(g+c)$, with the gain in the denominator too.' }
      - { value: 0.5, feedback: 'That is the answer when gain and loss are equal. Here the gain is three times the loss, so less chance is needed.' }
    hint: Set $6p-2(1-p)=0$.
    explanation: |
      $$6p-2(1-p)=0\ \Rightarrow\ 8p=2\ \Rightarrow\ p=\frac14.$$
      Raising the loss $c$ raises the threshold; raising the gain $g$ lowers it. The evidence fixes $p$, while $g$ and $c$ express what one values.

  - type: widget
    id: p3-gods
    title: "A wager with two gods"
    widget: decision-matrix
    config:
      actions: ["Wager for god A", "Wager against"]
      states: ["A exists", "B exists (punishes the wager for A)", "Neither"]
      payoffs: [[1000, -1000, -10], [0, 0, 0]]
      probs: [0.03, 0.01, 0.96]
      threshold: false
      labels:
        corner: "Act / State"
      presets:
        - { label: "A likelier than B", probs: [0.03, 0.01, 0.96] }
        - { label: "A and B equal", probs: [0.02, 0.02, 0.96] }
    body: |
      Pascal's wager with a rival. Wagering for god A gains $1000$ if A exists, costs $1000$ if a rival god B exists who punishes that wager, and costs $10$ (things given up) if neither exists. Wagering against pays $0$ in every state. Move the weights, or use the presets, and watch which act has the larger expected value.

  - type: numeric
    id: p3-ev
    title: "The expected value of the wager"
    prompt: |
      Wagering for god A pays $1000$ if A exists, $-1000$ if a rival B who punishes it exists, and $-10$ if neither exists. Wagering against pays $0$. The chances are $0.03$ for A, $0.01$ for B and $0.96$ for neither. What is the expected value of wagering for A?
    answer: 10.4
    tolerance: 0.05
    answerText: '10.4'
    wrong:
      - { value: -9.6, feedback: 'That is the value when A and B have equal chances of $0.02$ each ($20-20-9.6$). Here A is three times as likely as B.' }
      - { value: 30, feedback: 'That is only the first term, $0.03\times1000$. The rival and the cost of the empty state must be added.' }
      - { value: 20, feedback: 'That drops the cost in the state where neither exists, $0.96\times(-10)=-9.6$.' }
    hint: 'Three terms: $0.03\times1000$, $0.01\times(-1000)$ and $0.96\times(-10)$.'
    explanation: |
      $$30-10-9.6=10.4.$$
      Add a rival and the sign of the answer depends on the relative chances of A and B, not on the size of the prize. With equal chances for A and B it is $-9.6$, as the preset shows.

  - type: mcq
    id: p3-premise
    title: "Which premise would a critic reject?"
    prompt: |
      A defender of the wager says: "P1: the only live possibilities are that god A exists or that nothing like a god does. P2: wagering for A gains a great deal if A exists. P3: it costs little if not. C: wager for A." According to the many gods objection, which premise would a critic reject, and why?
    options:
      - text: "P1: there are other possible gods, such as a B who punishes this wager, so the list of live possibilities is incomplete and the matrix changes."
        correct: true
        feedback: |
          Yes. The arithmetic in P2 and P3 is fine given P1. The critic denies that the matrix lists all the possibilities. This is a rejection of a premise, and the validity of the step from premises to conclusion is separate.
      - text: "P2: no reward could be large."
        feedback: |
          That is not the many gods objection. It accepts the size of the prize and says the same size is on offer elsewhere or reversed.
      - text: "C: the conclusion does not follow from P1 to P3 even if they are true."
        feedback: |
          Given P1 to P3 the conclusion follows by expected value. The critic's complaint is about a premise.
      - text: "None: the objection only shows that people disagree about gods."
        feedback: |
          Disagreement alone is not the point. The objection shows that a missing possibility can reverse the sign of the expected value, as the widget did.
    explanation: |
      Defenders reply that rival gods need not be as probable, or that some gods share a common core, so that the wager still favours belief in a "bare" God. Whether that works is debated.

  - type: mcq
    id: p3-layers
    title: "Three layers in Problem 3"
    prompt: |
      Which of these is a **layer-3** matter in the problems about stakes and the wager?
    options:
      - text: "How much the possible good of a belief weighs against the risk of error, the values $g$ and $c$."
        correct: true
        feedback: |
          Yes. James says the values reflect temperament and what one cares about. The arithmetic tells what follows from the values, not what they should be.
      - text: "The break-even chance for $g=6$ and $c=2$ is $0.25$."
        feedback: |
          That is arithmetic from the stated numbers (layer 1).
      - text: "Diderot is usually credited with the many gods objection."
        feedback: |
          That is a historical claim, layer 1 in kind, and it is checkable. It is not part of this challenge's commitments.
      - text: "Philosophers disagree whether any religious choice is a genuine option in James's sense."
        feedback: |
          That is a report of a live debate (layer 2).
    explanation: |
      Layer 1: the break-even chance and the expected values. Layer 2: whether religious choices satisfy James's conditions and whether the many gods objection is decisive. Layer 3: how much one values the good against the error.

  # ---------------- Problem 4 ----------------
  - type: widget
    id: p4-widget
    title: "Problem 4 · Two surveyors"
    widget: peer-credence
    config:
      peers: ["Ola", "Pia"]
      a: 0.9
      b: 0.75
      rule: split
      evidence: false
      evidenceToggle: true
      prior: 0.5
      presets:
        - { label: "Firm", rule: firm }
        - { label: "Split", rule: split }
        - { label: "Weighted", rule: weighted, r: 0.2 }
    body: |
      **Problem 4.** Two equally trained surveyors in Halde (invented), Ola and Pia, each give a credence that the hidden spring exists: Ola $0.9$ and Pia $0.75$. A **credence** is a degree of belief between $0$ and $1$. Try the three rules. Then press the evidence button, which shows what happens if each credence came from independent evidence on a shared prior chance of $0.5$.

  - type: numeric
    id: p4-weighted
    title: "A little weight on the peer"
    prompt: |
      Ola's credence is $0.9$ and Pia's is $0.75$ in the same statement. Ola gives Pia a weight $r=0.2$ and keeps $0.8$ on her own: $c_A'=(1-r)c_A+r\,c_B$. What credence does Ola hold afterwards? Give a decimal.
    answer: 0.87
    tolerance: 0.003
    answerText: '0.87'
    wrong:
      - { value: 0.825, feedback: 'That is the split, $r=\tfrac12$. Here Ola gives Pia only $0.2$.' }
      - { value: 0.9, feedback: 'That is no movement at all, the firm rule ($r=0$). With $r=0.2$ she moves a fifth of the way toward Pia.' }
    hint: Compute $0.8\times0.9+0.2\times0.75$.
    explanation: |
      $$0.8\times0.9+0.2\times0.75=0.72+0.15=0.87.$$
      The split would give $0.825$. A weight below one half needs a reason to trust oneself more that does not itself depend on the disagreement; otherwise it begs the question.

  - type: numeric
    id: p4-pooled
    title: "Add the evidence, do not average it"
    prompt: |
      Suppose Ola and Pia each looked at *independent* evidence for a statement whose prior chance was $0.5$ (odds $1$). Ola now holds $0.9$, odds $9$ (odds are $c/(1-c)$). Pia holds $0.75$, odds $3$. Independent evidence multiplies the odds: $o_{\text{pooled}}=o_A\,o_B/o_0$. What credence do they reach together? Give a decimal to three places.
    answer: 0.964
    tolerance: 0.003
    answerText: '27/28 ≈ 0.964'
    wrong:
      - { value: 0.825, feedback: 'That averages. Averaging is for peers with the same evidence, where agreement is a sign of error. Independent evidence adds on the odds scale.' }
      - { value: 0.9, feedback: 'That ignores Pia. Her independent evidence adds a factor of 3 to the odds.' }
    hint: 'Pooled odds are $9\times3/1=27$; the credence is $27/(27+1)$.'
    explanation: |
      $$o_{\text{pooled}}=\frac{9\times3}{1}=27,\qquad c=\frac{27}{28}\approx0.964.$$
      Same evidence read differently: split or weigh. Different evidence learned independently: add on the odds scale. Real disagreements about God rarely fit either model cleanly, and that is itself a point of debate.

  - type: mcq
    id: p4-layers
    title: "Three layers in Problem 4"
    prompt: |
      Which of these is a **layer-3** matter in the problem about two surveyors?
    options:
      - text: "Whom one counts as an equal peer in the first place."
        correct: true
        feedback: |
          Yes. The rules assume peers (equal ability and the same evidence). Deciding that a person of another faith, or of none, is or is not a peer is a commitment, and one can hide a great deal in it.
      - text: "The split of $0.9$ and $0.75$ is $0.825$."
        feedback: |
          That is arithmetic (layer 1).
      - text: "Elga and Christensen defend the equal weight view."
        feedback: |
          That is a fact about who argued what (layer 1).
      - text: "Philosophers disagree on whether to split at all (steadfast views reject it)."
        feedback: |
          That is a report of a live debate (layer 2).
    explanation: |
      Layer 1 is the arithmetic and who holds which view. Layer 2 is whether to split, and whether real disagreements meet the conditions for peers. Layer 3 is whom you count as a peer.

  # ---------------- Problem 5 ----------------
  - type: mcq
    id: p5-sort
    title: "Problem 5 · Two faiths, one school"
    prompt: |
      **Problem 5.** Halde's school (invented) serves families of the Northern chapel and of the Valley temple. Three parents speak. Mara: "Only our way is fully true; yet the Valley people are sincere, and I respect them." Noor: "Our way has the fullest truth, and good Valley people may share in it without knowing." Sam: "Both ways are human answers to one reality beyond either." According to Alan Race's threefold typology, which is the **inclusivist**?
    options:
      - text: "Noor: the fullest truth is in one tradition, and others may share in it."
        correct: true
        feedback: |
          Yes. Inclusivism says one tradition has the fullest truth and that the others have a real, partial share in it (Karl Rahner's "anonymous Christian" is the standard example).
      - text: "Mara: she respects the others, so she accepts them as true."
        feedback: |
          Respect is not agreement. Mara is the **exclusivist**: where the traditions conflict, hers is the truth. Exclusivists need not despise others; Alvin Plantinga argues it is not a moral failure.
      - text: "Sam: he finds some truth in both."
        feedback: |
          Sam is the **pluralist** (John Hick's view): the traditions are different responses to one ultimate reality, with none privileged.
      - text: "None: the typology covers only Christian parents."
        feedback: |
          Race built it for Christian theology, but the three types are used for any tradition's view of the others.
    explanation: |
      Mara, exclusivist; Noor, inclusivist; Sam, pluralist. Each faces a charge: the exclusivist, that the stance is arrogant; the inclusivist, that insiders cannot accept being "included"; the pluralist, that standing above the traditions is itself a view that no tradition holds.

  - type: mcq
    id: p5-state
    title: "What may the town do?"
    prompt: |
      The Halde council (invented) considers two measures. (a) Pay the Northern chapel's priest from the town budget. (b) Ban the Valley temple's festival procession. Which pairing is right?
    options:
      - text: "(a) is what Article 2 of the French law of 1905 rules out (the Republic pays no form of worship); (b) is what the Free Exercise Clause of the First Amendment bars Congress from doing."
        correct: true
        feedback: |
          Yes, in each tradition's own terms. In France the state pays, recognises and subsidises none; in the American text, Congress may not prohibit free exercise. Whether (a) also breaks the Establishment Clause is itself debated between strict separationists and accommodationists.
      - text: "(a) is required by both, since a fair state supports all faiths equally."
        feedback: |
          Neither text says so. French law forbids paying any worship. In the US, whether equal aid is allowed is contested, and not required.
      - text: "(b) is allowed in both, since public order outranks every religion."
        feedback: |
          Both countries allow limits on practice for reasons such as safety, and courts weigh them, but a ban on a procession because of its religion is the kind of measure the free exercise guarantee targets. The question is what the texts say, not a blanket ranking.
      - text: "Both measures are allowed everywhere that has a state religion."
        feedback: |
          That describes establishment, where the state backs one religion. It would allow (a) but not clearly (b), and the question concerns the two named models.
    explanation: |
      The two answers show two ways of keeping a state fair among faiths: by not funding any (France), or by barring both establishment and interference (US). A third model, India's principled distance, would ask whether each measure respects all faiths equally. Which is best is a layer-3 question.

  - type: mcq
    id: p5-layers
    title: "Three layers in Problem 5"
    prompt: |
      Which of these is a **layer-2** claim (a live debate or scholarly view) about faiths and the state?
    options:
      - text: "Whether pluralism is coherent, given that it describes every tradition from a position none of them holds."
        correct: true
        feedback: |
          Yes. Scholars argue over it. Hick's defenders say one Real lies behind the diversity; critics, Plantinga among them, argue that the view is logically inconsistent, and Hick replies that such categories do not apply to the Real.
      - text: "Article 2 of the 1905 French law says the Republic pays no form of worship."
        feedback: |
          That is layer 1, the text of a law.
      - text: "One's own tradition grasps the truth better than the others."
        feedback: |
          That is a faith commitment (layer 3).
      - text: "The First Amendment restricts Congress."
        feedback: |
          That is layer 1, a fact about the text.
    explanation: |
      Layer 1: what the laws and the typology say. Layer 2: whether pluralism is coherent, and whether strict separation protects or burdens religion. Layer 3: whether one's own tradition has a better grip on the truth.

  # ---------------- Closing weighing ----------------
  - type: mcq
    id: close-weigh
    title: "Where the thoughtful part"
    prompt: |
      A Halde citizen asks: "How should I believe about the hidden spring, or about my faith?" Using what the five problems showed, which reply is most useful?
    options:
      - text: "Ask of each belief which norm you are using (grounds, reliability, evidence sized to the stakes, deference to peers) and which layer each step belongs to: fact, live debate or commitment."
        correct: true
        feedback: |
          Yes. The problems showed that the same belief can pass one norm and fail another, and that the numbers settle only the first layer. Naming the norm and the layer makes the remaining disagreement visible.
      - text: "Believe whatever the best arithmetic says, since numbers settle belief."
        feedback: |
          The arithmetic settled the odds, not what counts as enough, how much error one will risk, or whom to treat as a peer.
      - text: "Suspend judgment on everything, since thoughtful people disagree."
        feedback: |
          Even the equal weight view only asks you to move toward peers on a given question. It does not demand silence on all.
      - text: "Follow your tradition without asking, since doubt is a failing."
        feedback: |
          That is one reading (some fideists and reformed epistemologists would defend a version of it), but it is a position among the others, not what the problems show.
    explanation: |
      Reasonable people part at several places: whether knowledge needs accessible grounds, how much evidence is enough, what to value, whom to count as a peer, and how to see other faiths. Each is a premise or a value, and naming it is the work of this level.

  - type: text
    id: close
    title: "What you now own"
    body: |
      The method, in prose: for any belief, ask which norm of belief you are applying, then compute what the norm gives, then ask which of its steps is fact, which is live debate and which is commitment.

      Tools used. Knowledge: justified true belief, Gettier's lucky truths, Goldman's reliable processes. Evidence, in odds form:
      $$\text{posterior odds}=\text{LR}\times\text{prior odds}.$$
      Stakes, James's toy threshold:
      $$p>\frac{c}{g+c}.$$
      The wager and its rival gods, through expected value:
      $$\mathrm{EV}=\sum_j p_jx_j.$$
      Disagreement, with weight $r$ on a peer, and the pooled case for independent evidence:
      $$c_A'=(1-r)\,c_A+r\,c_B,\qquad o_{\text{pooled}}=\frac{o_A\,o_B}{o_0}.$$
      Faiths in the same town: exclusivist, inclusivist and pluralist replies, and two ways a state can stay fair.

      What stays open: whether knowledge needs grounds one can cite, how much evidence is enough, how to weigh a possible good against a possible error, who counts as a peer, and whether one's own tradition sees further than the others.

      **Next:** the level on the philosophies of life asks what to do with a life once the questions of belief are open: nihilism, absurdism, existentialism, Stoicism and others, each by its own premises.
