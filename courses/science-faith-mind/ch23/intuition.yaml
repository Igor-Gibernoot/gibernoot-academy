id: ch23-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: a person $S$ and a statement $p$ (such as "God exists"), and the question of what it takes to know, believe, doubt or disagree about it. Each view below is told *according to* its thinker; none is declared the winner.
  - **Knowledge as justified true belief (JTB).** Write $K$ for "$S$ knows $p$", $B$ for "$S$ believes $p$", $T$ for "$p$ is true" and $J$ for "$S$ is justified in believing $p$". The definition often traced to Plato's *Theaetetus* is
    {{ $$K\iff B\wedge T\wedge J$$ }}
    Gettier (1963) attacked *sufficiency*: all three can hold by luck without knowledge. Plantinga's *properly basic* beliefs are held directly and rationally, and a *defeater* is a reason to drop one.
  - **Clifford's evidence, weighed by odds.** Odds are the chance a statement is true divided by the chance it is false. For a hypothesis and its rival, a test with likelihood ratio LR (how much likelier the result is if the hypothesis holds than if the rival does) gives
    {{ $$\text{posterior odds}=\text{LR}\times\text{prior odds}$$ }}
    For a ship sound with prior odds $4$ and a pass with $\text{LR}=18$, the posterior odds are $72$, so the chance it is unsound is $1/73$.
  - **James's break-even.** Committing to $H$ gains $g$ if $H$ is true and costs $c$ if $H$ is false; withholding pays $0$. With $p$ the chance that $H$ is true, committing is worth it when
    {{ $$p>\frac{c}{g+c}$$ }}
    The threshold falls toward $0$ as the gain $g$ grows and rises toward $1$ as the cost $c$ grows. Fideists ask whether faith is a bet at all, and sort views as reason *unable*, *irrelevant* or *hostile* to faith.
  - **Disagreement.** Two equal peers hold credences $c_A$ and $c_B$ in $H$. If A gives B the weight $r$ (from $0$ to $1$),
    {{ $$c_A'=(1-r)\,c_A+r\,c_B$$ }}
    with $r=0$ holding firm, $r=\tfrac12$ the split and $r=1$ giving in. If the two credences come from independent evidence on a shared prior with odds $o_0$, the evidence pools as
    {{ $$o_{\text{pooled}}=\frac{o_A\,o_B}{o_0}$$ }}
  - **Calibration.** With $c$ the average stated confidence and $a$ the share of claims that are true, the gap is $c-a$, and a positive gap is overconfidence.
  - **Vocabulary.** Exclusivism, inclusivism and pluralism (Race, 1983) sort answers to rival faiths. Separation, establishment, neutrality, secularism (a doctrine) and secularity (a condition) sort church-state relations. Atheism, agnosticism, apatheism and ignosticism sort kinds of nonbelief.

cards:
  - type: text
    id: welcome
    title: "Quick recall: knowing, believing and disagreeing"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: **knowledge as justified true belief**, **evidence weighed by odds**, **James's break-even chance**, **disagreement between equals**, **calibration**, and the **vocabulary** of faith, pluralism, church and state, and nonbelief.

      Three kinds of card: **mnemonics and distinctions**, **build cards** for the main formulas, and **applied cards that give you data only**: you choose the rule yourself. Guessing is fine: a wrong guess is shown with its reason. Views are told *according to* their thinkers, none declared the winner.

  - type: build
    id: jtb-build
    title: "Knowing, three parts"
    prompt: |
      Write $K$ for "$S$ knows $p$", $B$ for "$S$ believes $p$", $T$ for "$p$ is true" and $J$ for "$S$ is justified in believing $p$". Build the definition often traced to Plato's *Theaetetus*: knowing is believing something true on good grounds.
    prefix: 'K\iff'
    tiles: ['B', 'T', 'J', '\wedge', '\wedge', '\vee', '\vee']
    answers:
      - ['B', '\wedge', 'T', '\wedge', 'J']
      - ['B', '\wedge', 'J', '\wedge', 'T']
      - ['T', '\wedge', 'B', '\wedge', 'J']
      - ['T', '\wedge', 'J', '\wedge', 'B']
      - ['J', '\wedge', 'B', '\wedge', 'T']
      - ['J', '\wedge', 'T', '\wedge', 'B']
    wrong:
      - answer: ['B', '\vee', 'T', '\vee', 'J']
        feedback: |
          "Or" would let a person know something by believing it alone, or by its being true alone. Each of the three parts is asked for at once, so they are joined by "and".
    hint: 'All three must hold together.'
    explanation: |
      Mnemonic: **believe, true, justified, all three**. The Theaetetus itself ends without a definition, so "often traced to" is the careful wording.

  - type: mcq
    id: gettier-mnemonic
    title: "What Gettier attacks"
    prompt: |
      Edmund Gettier (1963) gave cases of a person who believes a true statement on good grounds and still does not seem to know it, as when the grounds point to the truth only by accident. Which claim about the three conditions does this target?
    options:
      - text: 'Sufficiency: believing, truth and justification together may hold without knowledge.'
        correct: true
      - text: 'Necessity: knowing does not even need belief, truth or justification.'
        feedback: |
          The cases keep all three conditions in place. They show the three are not enough, not that any of them can be dropped.
      - text: 'Truth: a justified belief can never be true.'
        feedback: |
          In the cases the belief is true and justified. What fails is the link between the two, which is luck.
    shuffle: false
    hint: 'All three conditions are present in the cases. Is that enough?'
    explanation: |
      Mnemonic: **Gettier: not enough**. Replies add a fourth condition or change the account of justification, as reliabilism does by asking how the belief was produced. Whether any repair works is debated.

  - type: mcq
    id: plantinga-mnemonic
    title: "Basic, defeater, warrant"
    prompt: |
      According to Alvin Plantinga, belief in God may be held directly, as memory and perception are. Match the three terms: properly basic, defeater, warrant.
    options:
      - text: 'Properly basic: held directly, without inference, and rationally. Defeater: a reason to drop the belief. Warrant: what turns true belief into knowledge.'
        correct: true
      - text: 'Properly basic: held on no grounds at all. Defeater: a proof that the belief is false. Warrant: a conclusion reached by argument.'
        feedback: |
          For Plantinga a basic belief is grounded in circumstances (the night sky, guilt, danger), not groundless. A defeater need only give *reason* to drop it, not prove it false, and warrant is externalist, tied to faculties working properly.
      - text: 'Properly basic: true by definition. Defeater: any disagreement. Warrant: the believer''s ability to cite evidence.'
        feedback: |
          Proper basicness is about the rationality of holding a belief directly, not truth by definition. Warrant for Plantinga depends on proper function and may be had without being able to cite evidence.
    shuffle: false
    hint: 'Direct and rational; a reason to drop; knowledge-making.'
    explanation: |
      Mnemonic: **direct, drop, know**. Critics, among them the Great Pumpkin objection, ask whether this opens the door to any belief; Plantinga replies that proper basicness is learned from cases and stays open to defeat.

  - type: build
    id: odds-build
    title: "Evidence in odds form"
    prompt: |
      Recall the shipowner of Clifford's essay. Odds are the chance a statement is true divided by the chance it is false. A test has likelihood ratio LR: how much likelier its result is if the ship is sound than if it is unsound. Build how the odds after a pass follow from the odds before.
    prefix: '\text{posterior odds}='
    tiles: ['\text{LR}', '\text{prior odds}', '\times', '+']
    answers:
      - ['\text{LR}', '\times', '\text{prior odds}']
      - ['\text{prior odds}', '\times', '\text{LR}']
    wrong:
      - answer: ['\text{LR}', '+', '\text{prior odds}']
        feedback: |
          Adding would make a test with $\text{LR}=1$ (one that tells nothing) change the odds. A useless test must leave the odds alone, and multiplying by $1$ does.
    hint: 'A test with LR = 1 should change nothing.'
    explanation: |
      Mnemonic: **odds multiply, chances do not add**. With prior odds $4$ and $\text{LR}=18$ for a pass, the odds become $72$, so the chance of an unsound ship is $1/73\approx1.4\%$. These numbers are an illustration, not Clifford's.

  - type: build
    id: breakeven-build
    title: "James's break-even chance"
    prompt: |
      Committing to a hypothesis $H$ gains $g$ if $H$ is true and costs $c$ if $H$ is false; withholding pays $0$ either way. Setting the two expected values equal, committing is worth it when the chance $p$ that $H$ is true exceeds a threshold. Build it.
    prefix: 'p>'
    tiles: ['\dfrac{c}{g+c}', '\dfrac{g}{g+c}', '\dfrac{c}{g}']
    answers:
      - ['\dfrac{c}{g+c}']
    wrong:
      - answer: ['\dfrac{g}{g+c}']
        feedback: |
          Swapped. A larger gain should make committing easier, so the threshold should fall as $g$ grows; this one rises.
      - answer: ['\dfrac{c}{g}']
        feedback: |
          This is the ratio of the loss to the gain, which can exceed $1$ and is not a chance. Solving $pg=(1-p)c$ gives $p=c/(g+c)$.
    hint: 'The threshold must fall when the gain grows.'
    explanation: |
      Mnemonic: **loss over total stake**. From $pg=(1-p)c$ we get $p(g+c)=c$.

  - type: mcq
    id: scaling-check
    title: "Scaling check on the threshold"
    prompt: |
      Take the break-even chance $c/(g+c)$ for committing to a hypothesis $H$ (gain $g$ if true, loss $c$ if false). Which of these checks hold? Select all that apply.
    multiple: true
    options:
      - text: 'If $g$ is made very large with $c$ fixed, the threshold falls toward $0$.'
        correct: true
      - text: 'If $c$ is made very large with $g$ fixed, the threshold rises toward $1$.'
        correct: true
      - text: 'If $g=c$, the threshold is $\tfrac12$.'
        correct: true
      - text: 'If $g$ and $c$ are both multiplied by $10$, the threshold changes by a factor of $10$.'
        feedback: |
          The factor cancels: $10c/(10g+10c)=c/(g+c)$. Only the ratio of gain to loss matters, not their size.
    hint: 'Put a huge value in one of the two and see what remains.'
    explanation: |
      Mnemonic: **big gain, low bar; big loss, high bar; only the ratio counts**. With $g=10$ and $c=1$ the threshold is $1/11$; with $g=1$ and $c=100$ it is $100/101$; with $g=50$ and $c=10$ it is $1/6$. Whether the stakes of faith can be set at all is what fideists question.

  - type: build
    id: weight-build
    title: "Weighing a peer"
    prompt: |
      Peer A holds credence $c_A$ and peer B holds credence $c_B$ in the same statement. A gives B the weight $r$ (between $0$ and $1$) and keeps the rest. Build A's revised credence $c_A'$.
    prefix: "c_A' ="
    tiles: ['(1-r)', 'r', 'c_A', 'c_B', '+']
    answers:
      - ['(1-r)', 'c_A', '+', 'r', 'c_B']
      - ['r', 'c_B', '+', '(1-r)', 'c_A']
    wrong:
      - answer: ['r', 'c_A', '+', '(1-r)', 'c_B']
        feedback: |
          The weights are on the wrong credences. With $r=0$ (holding firm) this would give $c_B$, which is giving in.
    hint: 'At r = 0, A should keep c_A.'
    explanation: |
      Mnemonic: **keep the rest, add the share**.

  - type: mcq
    id: weight-limits
    title: "Limit checks on the weight"
    prompt: |
      Use $c_A'=(1-r)\,c_A+r\,c_B$ for A's revised credence after meeting a peer B. Which statements about its limits are right? Select all that apply.
    multiple: true
    options:
      - text: 'At $r=0$, $c_A'' = c_A$: A holds firm.'
        correct: true
      - text: 'At $r=\tfrac12$, $c_A'' = (c_A+c_B)/2$: the split.'
        correct: true
      - text: 'At $r=1$, $c_A'' = c_B$: A gives in completely.'
        correct: true
      - text: 'For any $r$ between $0$ and $1$, $c_A''$ lies outside the interval between $c_A$ and $c_B$.'
        feedback: |
          A weighted average always lies between its two ingredients. This is why the rule can never make A more extreme than both peers.
    hint: 'Put in r = 0, 1/2 and 1 one at a time.'
    explanation: |
      Mnemonic: **0 firm, half split, 1 give in**. How large $r$ should be for a real peer is where thoughtful people differ; the rule only states the family.

  - type: build
    id: pool-build
    title: "Pooling independent evidence"
    prompt: |
      Two people look at independent evidence on one statement whose prior odds are $o_0$. After their own evidence they hold odds $o_A$ and $o_B$. Build the odds that result when both pieces of evidence are counted once.
    prefix: 'o_{\text{pooled}}='
    tiles: ['\dfrac{o_A\,o_B}{o_0}', '\dfrac{o_A\,o_0}{o_B}', '\dfrac{o_A+o_B}{2}']
    answers:
      - ['\dfrac{o_A\,o_B}{o_0}']
    wrong:
      - answer: ['\dfrac{o_A+o_B}{2}']
        feedback: |
          This is the split, right when both read the same evidence. With independent evidence the two factors multiply, and dividing by $o_0$ counts the shared starting point once.
    hint: 'Each piece of evidence multiplies the prior odds by its own factor.'
    explanation: |
      Mnemonic: **odds multiply, divide the common start once**. The rule needs independent evidence; if both reasoned from the same evidence it would count it twice.

  - type: build
    id: gap-build
    title: "The calibration gap"
    prompt: |
      Let $c$ be the average confidence a person states over a set of claims, and $a$ the share of those claims that turn out true. Build the overconfidence gap, which is positive when the person is overconfident.
    prefix: '\text{gap}='
    tiles: ['c', 'a', '-', '+']
    answers:
      - ['c', '-', 'a']
    wrong:
      - answer: ['a', '-', 'c']
        feedback: |
          Reversed sign. Stating more confidence than the hit rate supports (large $c$, small $a$) should give a positive gap.
    hint: 'Stated confidence minus the share that is true.'
    explanation: |
      Mnemonic: **claimed minus earned**. A forecaster who states 80% and is right on 65% of claims has a gap of 15 points.

  - type: mcq
    id: fideism-sorting
    title: "Three senses of fideism"
    prompt: |
      Fideism (from Latin *fides*, faith) names views that rest religious commitment on faith rather than on reasons. Sorted by how they see the relation of reason to faith, three senses appear. Which pairing is right?
    options:
      - text: 'Reason is unable to reach the truth of faith; reason is irrelevant to it, because faith answers to other standards; reason is hostile to it.'
        correct: true
      - text: 'Reason is unable to reach it; reason is always sufficient for it; reason is a bet with a threshold.'
        feedback: |
          "Always sufficient" is the opposite of fideism, and the bet model with a threshold is the picture that fideists question, not a sense of the word.
      - text: 'Fideism means faith is a bet with a chance $p$ above a threshold, which is what James and Pascal held.'
        feedback: |
          James and Pascal treat faith as a choice under a chance, which is the picture fideists deny. Kierkegaard calls it a leap, not the end of a calculation.
    shuffle: false
    hint: 'Three relations between reason and faith: cannot reach, does not apply, opposes.'
    explanation: |
      Mnemonic: **unable, irrelevant, hostile**. The sorting is the course's own, not a standard classification. Whether Wittgenstein's view counts as fideist is debated, and D. Z. Phillips rejects the label.

  - type: mcq
    id: pluralism-sorting
    title: "Exclusivism, inclusivism, pluralism"
    prompt: |
      Alan Race (1983) sorted answers to the question of rival faiths into three kinds. Which pairing of kind and thinker is right?
    options:
      - text: 'Exclusivism: one tradition is the truth (Plantinga defends it as not a failure). Inclusivism: grace can reach beyond it (Rahner, "anonymous Christian"). Pluralism: many traditions respond to one Real (Hick).'
        correct: true
      - text: 'Exclusivism: all faiths are equally true. Inclusivism: only one is true. Pluralism: no faith is true.'
        feedback: |
          Scrambled. Pluralism, as a theory, holds that the traditions are different human responses to one ultimate reality, not that all or none are true. It is a theory about truth, not a synonym for tolerance.
      - text: 'Pluralism means that people of different faiths should be tolerated; the other two kinds oppose toleration.'
        feedback: |
          Tolerance is a political attitude that any of the three can hold. The typology is about the truth and salvation claims of religions.
    shuffle: false
    hint: 'One says mine, one says mine plus others, one says one Real behind many.'
    explanation: |
      Mnemonic: **mine, mine and more, one behind many**. Objections: Rahner's label is not one other faiths accept, and calling the Real ineffable already says something about it.

  - type: mcq
    id: secular-terms
    title: "Church and state, five terms"
    prompt: |
      Which pairing of term and meaning is right?
    options:
      - text: 'Separation: religious bodies and state kept apart in funding and authority. Establishment: the state officially backs one religion. Neutrality: the state takes no side. Secularism: a doctrine. Secularity: a condition of society.'
        correct: true
      - text: 'Separation: the state backs one religion. Establishment: religion and state kept apart. Secularism: a condition of society. Secularity: a doctrine.'
        feedback: |
          Two swaps. Establishment is the state backing one religion, and secularity (Charles Taylor''s term) is the condition of society while secularism is the political doctrine.
      - text: 'Neutrality always means that the state keeps out of religion altogether.'
        feedback: |
          Neutrality has two readings: treating all alike (even-handed) or keeping out of religion (hands-off). The two can give different answers, as in France and India.
    shuffle: false
    hint: 'Apart, backs one, takes no side; a doctrine versus a condition.'
    explanation: |
      Mnemonic: **apart, backs one, no side; doctrine versus condition**. Country models are told according to each country: France's 1905 law, the First Amendment, Turkey's state control, India's principled distance.

  - type: mcq
    id: atheism-terms
    title: "Kinds of nonbelief"
    prompt: |
      Match the term to its meaning: agnostic (Huxley, 1869), presumption of atheism (Flew), apatheism, ignosticism.
    options:
      - text: 'Agnostic: do not claim a conclusion that has not been shown. Presumption of atheism: start without belief, as the law starts with innocence. Apatheism: not caring whether gods exist. Ignosticism: the question is premature because "God" lacks a clear meaning.'
        correct: true
      - text: 'Agnostic: certain that no god exists. Presumption of atheism: a proof that no god exists. Apatheism: hatred of religion. Ignosticism: belief in an unnamed god.'
        feedback: |
          Agnosticism claims no verdict either way. Flew's presumption fixes where to start, not a proof. Apatheism is indifference, not hostility, and ignosticism questions the meaning of the word, it does not affirm a god.
      - text: 'Atheism and agnosticism answer the same question, so a person is one or the other and never both.'
        feedback: |
          According to the Stanford Encyclopedia, belief and knowledge are different questions. A person can lack belief in God and also not claim to know, which is agnostic atheism.
    shuffle: false
    hint: 'Withhold a claim; start without belief; do not care; question the word.'
    explanation: |
      Mnemonic: **withhold, start, shrug, word**. The Epicurean puzzle about evil and Rowe's friendly, unfriendly and indifferent atheists are further ways the level sorts nonbelief.

  - type: numeric
    id: apply-ship
    title: "A second ship"
    prompt: |
      Before inspection, a ship of a certain old type is sound with chance $0.75$. An inspection passes a sound ship $80\%$ of the time and an unsound ship $10\%$ of the time. After one pass, what is the chance, in percent, that the ship is unsound?
    answer: 4
    tolerance: 0.05
    answerText: '4%'
    wrong:
      - { value: 10, feedback: "10% is how often the test passes an unsound ship, not the chance the ship is unsound after a pass." }
      - { value: 25, feedback: "25% is the chance of an unsound ship before the test. A pass is evidence and should lower it." }
    hint: 'Write the odds before the test, find how much likelier a pass is for a sound ship, then turn the new odds into a chance.'
    explanation: |
      The prior odds of sound to unsound are $0.75/0.25=3$, and a pass is $0.8/0.1=8$ times likelier for a sound ship. The odds become $3\times8=24$, so the chance of an unsound ship is $1/25=4\%$.

  - type: numeric
    id: apply-threshold
    title: "Where is the tipping chance?"
    prompt: |
      A person may commit to a hypothesis $H$ or withhold. Committing pays $30$ if $H$ is true and costs $20$ if $H$ is false; withholding pays $0$ either way. At what chance that $H$ is true do the two acts have the same expected value? Give a decimal.
    answer: 0.4
    tolerance: 0.001
    answerText: '0.4'
    wrong:
      - { value: 0.6, feedback: "$0.6$ is the share of the total stake that is the gain. The bar for committing is lower when the gain is larger, so it should be below $0.5$ here." }
      - { value: 0.5, feedback: "$0.5$ would be right if the gain and the loss were equal. Here the gain is larger, so less chance is needed." }
    hint: 'Set the expected value of committing equal to the expected value of withholding and solve for the chance.'
    explanation: |
      Setting $30p=20(1-p)$ gives $50p=20$, so $p=0.4$. Above $0.4$, committing has the higher expected value on these numbers.

  - type: numeric
    id: apply-peer
    title: "A weighted peer"
    prompt: |
      Cal holds credence $0.9$ in a statement and his equal peer Dee holds $0.5$. Cal decides to give Dee a weight of $0.25$ and keep the rest for his own view. What is Cal's new credence?
    answer: 0.8
    tolerance: 0.001
    answerText: '0.8'
    wrong:
      - { value: 0.7, feedback: "$0.7$ is the plain split, which would give Dee a weight of one half. Cal gives her a quarter." }
      - { value: 0.6, feedback: "This swaps the weights, giving Dee three quarters and Cal one quarter. Dee gets the smaller share." }
    hint: 'A weighted average of the two credences, with Dee''s share 0.25.'
    explanation: |
      Cal keeps $0.75$ of his own view and adds $0.25$ of Dee's: $0.75\times0.9+0.25\times0.5=0.675+0.125=0.8$. He moved by one tenth of the gap.

  - type: numeric
    id: apply-pool
    title: "Two independent witnesses"
    prompt: |
      A statement starts with chance $0.2$. Ann studies one body of evidence and now holds credence $0.5$. Ben studies a separate, independent body of evidence and also holds credence $0.5$. If both are counted once, what credence should a third person who hears both reach? Give a decimal.
    answer: 0.8
    tolerance: 0.001
    answerText: '0.8'
    wrong:
      - { value: 0.5, feedback: "$0.5$ is what each holds and also what a plain average gives. But each moved up from $0.2$ by different evidence, and the two moves add up." }
      - { value: 4, feedback: "That is the odds. Convert to a chance before answering." }
    hint: 'Work in odds, not chances: find the odds at the start, how far each witness moved them, and combine the moves.'
    explanation: |
      The starting odds are $0.2/0.8=0.25$ and each witness is at odds $1$, a factor of $4$ above the start. Independent evidence gives $0.25\times4\times4=4$, so the credence is $4/5=0.8$, higher than either witness.

  - type: numeric
    id: apply-calibration
    title: "Stated against earned"
    prompt: |
      A forecaster states an average confidence of $85\%$ over $80$ claims, and $60$ of them turn out true. By how many percentage points does the stated confidence exceed the share true?
    answer: 10
    tolerance: 0.001
    answerText: '10'
    wrong:
      - { value: 25, feedback: "That subtracts the count of misses from the percentage. First turn $60$ of $80$ into a percentage." }
      - { value: -10, feedback: "The sign is reversed. The forecaster states more than is earned, so the excess is positive." }
    hint: 'Convert 60 of 80 into a percentage first.'
    explanation: |
      The share true is $60/80=75\%$, and $85-75=10$ points: overconfident. A forecaster who had stated $75\%$ would have been calibrated.

  - type: mcq
    id: apply-sentences
    title: "Which stance is this?"
    prompt: |
      Four people speak about God.
      (A) "I don't believe in God, but I won't claim to know that none exists."
      (B) "I can't say whether God exists, because I don't know what the word is supposed to mean."
      (C) "My belief in God is not the end of an argument; I hold it directly, the way I hold that I had breakfast."
      (D) "My own faith has the truth; where other faiths disagree with it, they are mistaken."
      Which sentence is best matched by **ignosticism**?
    options:
      - text: '(B)'
        correct: true
      - text: '(A)'
        feedback: |
          (A) separates belief from knowledge: lacking belief while not claiming knowledge is agnostic atheism, not a question about meaning.
      - text: '(C)'
        feedback: |
          (C) is Plantinga's properly basic belief: held directly, not inferred. It says nothing about the word "God" lacking meaning.
      - text: '(D)'
        feedback: |
          (D) is exclusivism, an answer about rival faiths, not about whether the word "God" has a clear meaning.
    shuffle: false
    hint: 'Look for the speaker who objects to the question itself.'
    explanation: |
      (B) calls the question premature because "God" lacks a clear meaning (Sherwin Wine, mid 1960s). (A) is agnostic atheism, (C) is a properly basic belief and (D) is exclusivism. One word of speech, four families: belief versus knowledge, direct versus inferred, and kind of answer about rivals.

  - type: text
    id: summary
    body: |
      **Next:** the **Content Map** asks you to rebuild this level's concept map box by box among look-alike decoys.
