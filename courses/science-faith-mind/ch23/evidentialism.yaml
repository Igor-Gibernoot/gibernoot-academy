id: ch23-evidentialism
title: "Evidentialism: Clifford"
kind: concept
own: |
  The setting: a person $S$ and a statement $p$ (for example "this ship is sound" or "God exists"). Write $B(S,p)$ for "$S$ believes $p$", $J(S,p)$ for "$S$ is justified in believing $p$", and $E_S$ for the evidence $S$ has at that time. The question is when believing is allowed. Each answer is told *according to* its thinkers.
  - **Clifford's principle** (William Kingdon Clifford, 1845 to 1879, "The Ethics of Belief", 1877). According to Clifford, belief is a matter of duty: how a belief was formed decides whether the believer is guilty, not whether it turned out true or sincere. His rule, in his words, is that it is wrong always, everywhere and for anyone to believe on insufficient evidence:
    {{ $$\text{believe }p\ \Rightarrow\ E_S\text{ sufficient}$$ }}
  - **His three arguments.** Belief shapes action and character; belief is held as a public trust (a shared inheritance passed on to others); credulity (believing too easily) weakens the habit of testing claims. Each is about consequences for people, so the rule is an ethical claim about conduct.
  - **Evidentialism as a theory of justification** (Richard Feldman and Earl Conee, "Evidentialism", 1985). A related but separate view, about justification and not about guilt. It says that $S$ is justified in believing $p$ exactly when the evidence $S$ has supports $p$. It is an internalist view, since evidence is what is in the believer's mind:
    {{ $$J(S,p)\iff E_S\ \text{supports}\ p$$ }}
  - **Evidence as odds.** Evidence can be weighed with Bayes' rule in odds form. For a ship that is sound or unsound, with prior odds of 4 to 1 for sound and a test that passes a sound ship 90% of the time and an unsound one 5% of the time, the likelihood ratio is $0.9/0.05=18$:
    {{ $$\text{posterior odds}=\text{LR}\times\text{prior odds}$$ }}
    $$=18\times 4=72\qquad(\text{LR}=\text{likelihood ratio})$$
    One pass leaves about a 1.4% chance that the ship is unsound; two independent passes leave about 0.08%. How much is "sufficient" is a choice that the numbers do not make for us.
  - **Objections.** Strict evidentialism may demand an endless chain (evidence that the evidence is sufficient, and so on). "Sufficient" is vague, and moderate versions let the amount depend on the stakes. William James (1896, "The Will to Believe") argued that in some choices the evidence cannot decide and one may believe; a later lesson takes it up.
  - **Religion.** Clifford held that clinging to an inherited belief while stifling doubts is wrong. Believers reply in two ways: evidence is broader than proof (experience counts), or belief in God needs no evidence at all, as Plantinga argues in a later lesson.
  - **Three layers.** Fact: who argued what and when. Debate: whether evidence alone should govern belief, and how much is enough. Commitment: whether religious belief is the kind of belief the principle governs.

cards:
  - type: text
    id: hook
    title: "A sincere shipowner"
    body: |
      A shipowner has an old ship that is about to carry families across the ocean. Years ago it was well built, but it has been through many storms and some people say it needs a costly refit. He has doubts. Then he thinks of all the voyages it survived, tells himself that it was built by good workmen and that a kind providence will protect it, and gradually he feels certain it is sound. He sends it to sea and it sinks.

      Before any theory, a guess. Guessing first is the point, and nothing here asks you to believe or doubt anything religious: the lesson asks when it is wrong to believe something, and the answer is not obvious.

  - type: mcq
    id: guess
    title: "Guess: is he blameless?"
    prompt: |
      The owner sincerely believed that the ship was sound, so he did not know of any danger. What is the most natural verdict on how much blame he deserves for the deaths?
    options:
      - text: "He is to blame, because he let himself believe it without proper grounds and so did not look hard enough."
        correct: true
        feedback: |
          This is the verdict reached by William Kingdon Clifford, and it is common. The sincerity of the belief does not close the question, because the question is how the belief was reached.
      - text: "He is blameless, because he sincerely believed the ship was sound."
        feedback: |
          Sincerity is a fact about how strongly he believed, not about how he came to believe. A person can be sincere and careless at once, and Clifford's case is built to show that.
      - text: "He is blameless, because nobody can control what they believe."
        feedback: |
          This is a real position (that belief is not under the will). But the owner did things that led to the belief: he avoided checking the ship and pushed his doubts aside. Those were acts.
      - text: "He is to blame only because the ship sank."
        feedback: |
          Hold this one: it is the very point the next cards test. A verdict that depends on how things turned out makes blame depend on luck.
    explanation: |
      Most readers lean towards blame, and the reasons differ. Keep your guess: the lesson asks whether the blame lies in the sinking, in the sincerity, or in how the belief was formed.

  - type: text
    id: clifford-case
    title: "Clifford's shipowner"
    image:
      src: img/clifford.webp
      alt: Oil portrait of William Kingdon Clifford, a young man with dark hair and a short beard, seen from the chest up
      caption: William Kingdon Clifford (1845 to 1879), English mathematician and philosopher, painted by John Collier; he died of tuberculosis at 33.
      credit: "John Collier (died 1934), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:William_Kingdon_Clifford_by_John_Collier.jpg"
    body: |
      The case is told by William Kingdon Clifford (1845 to 1879), a mathematician and philosopher, in the essay "The Ethics of Belief" (*Contemporary Review*, January 1877). According to Clifford, the shipowner is about to send an old emigrant ship to sea, has doubts about her seaworthiness, and silences them. He collects the insurance when she goes down.

      Clifford's verdict is harsh: the owner is guilty of the deaths, because, in Clifford's words, "he had no right to believe on such evidence as was before him." The belief was sincere, but he did not earn it by inquiry. He acquired it by pushing his doubts away.

  - type: mcq
    id: safe-ship
    title: "Suppose the ship had arrived"
    prompt: |
      Clifford then changes the story: the ship crosses safely, and the owner collects nothing but his fares. According to Clifford, how does his guilt change?
    options:
      - text: "It does not change: how the belief was formed is the same, so he is as much in the wrong, only he was not found out."
        correct: true
        feedback: |
          Yes. Clifford says that the owner is just as guilty (SEP gives his words as "not one jot" less). On his view, rightness and wrongness belong to the way the belief was acquired, not to later luck.
      - text: "He becomes innocent, because nobody was hurt."
        feedback: |
          This makes blame depend on luck outside his control. Clifford refuses that: the harm did not happen, but the risk he ran with other people's lives was the same.
      - text: "He is guilty only of a small mistake."
        feedback: |
          Clifford does not grade the guilt by the outcome. The wrong is in the belief's origin, and that is identical in both versions.
      - text: "Clifford says nothing about this case."
        feedback: |
          He raises it himself, to separate the origin of a belief from its truth.
    explanation: |
      This is Clifford's central move. Moral evaluation of a belief looks backwards, at how it was formed and what the believer owed in inquiry, and not forwards, at whether it turned out true. A critic can ask whether holding people to that standard is fair, and the objections below do.

  - type: text
    id: principle
    title: "The principle"
    body: |
      From the case Clifford draws a general rule. In his words: "It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence." Call it **Clifford's principle**. Three things stand out. *Always* and *everywhere*: no exceptions of time or place. *For anyone*: it binds scientist and farmer alike. *Anything*: no subject is exempt, from ships to the deepest questions.

      The word that carries the load is **insufficient**. Clifford treats evidence as the grounds for a belief: what you have seen, tested, been told by people you have reason to trust. He also says a doubt that arises must be answered, not stifled. The next two cards test where he draws the line.

  - type: mcq
    id: who-violates
    title: "Who breaks the rule?"
    prompt: |
      Three people each believe "this bridge is safe to cross". According to Clifford's principle, which one believes on insufficient evidence?
    options:
      - text: "Dana, who has noticed cracks, feels uneasy, and tells herself that bridges like this never fall."
        correct: true
        feedback: |
          Yes. She has doubts and quiets them without inquiry, which is the owner's pattern. Her belief is comfortable, not earned.
      - text: "Eli, who read a recent engineer's inspection report from an authority he has reason to trust."
        feedback: |
          Clifford allows reliance on testimony when there are reasonable grounds to think the person really knows the matter (the section of his essay on the weight of authority). The report is part of Eli's evidence.
      - text: "Fay, who crossed it daily for ten years without any sign of trouble, and has no doubts."
        feedback: |
          Ten years of safe use is evidence, though not proof. Clifford asks for sufficient evidence, and the amount here is a matter of judgement, but her belief is not of the stifled-doubt kind.
      - text: "All three, since none of them tested the bridge themselves."
        feedback: |
          Clifford does not require that each person test everything personally: that would make shared knowledge impossible. What he requires is good grounds, which can include trusted testimony.
    explanation: |
      The principle does not say "check everything yourself". It says to have grounds that are sufficient, to answer doubts when they arise, and not to believe because it is comforting. What "sufficient" means is left for the numbers below.

  - type: mcq
    id: busy
    title: "No time to inquire"
    prompt: |
      A man says: "I have no time to examine whether the claim is true, but I believe it." What would Clifford say, in essence?
    options:
      - text: "Then he has no right to believe it: lacking time to inquire is a reason to withhold belief, not a licence to hold it."
        correct: true
        feedback: |
          Yes. As we read the essay, Clifford says in essence that someone with no time to inquire should have no time to believe. The duty to inquire goes with the right to believe.
      - text: "He may believe it, because a busy person cannot be asked to inquire."
        feedback: |
          Clifford answers this excuse head-on and rejects it. Being busy limits what we can investigate, so it limits what we may believe.
      - text: "He may believe it if the claim is probably true."
        feedback: |
          The test is the evidence the believer has, not whether the claim happens to be true. A true belief reached by stifled doubt is, for Clifford, still a wrong one.
      - text: "He must disbelieve it."
        feedback: |
          Clifford's rule is about believing, not a duty to deny. Withholding judgement is the third option, and it is the one left open here.
    explanation: |
      This card marks the real bite of the principle: it is not satisfied by good intentions. It also shows the third attitude, **suspension of judgement** (neither believing nor disbelieving), which will matter when the principle meets religion.

  - type: text
    id: arguments
    title: "Why he thinks so"
    body: |
      Clifford does not just assert the principle. According to the essay, he gives reasons, and they are about consequences for people.

      First, **belief shapes action and character**. Every belief, even a small one, feeds into the web of beliefs that guides what we do, and each habit of believing leaves a mark on the person. Someone already convinced cannot inquire as fairly as someone who is in doubt.

      Second, **belief is a public trust**. Our words and ways of thinking are a common inheritance, and Clifford says each person's beliefs are held not only for themselves but for humanity, to be passed on, ideally improved.

      Third, **credulity weakens the habit of inquiry**. A person who believes too easily becomes credulous, and a society that loses the habit of testing claims declines. Carelessness about our own beliefs also makes us careless about the truth of what others tell us.

  - type: mcq
    id: arguments-q
    title: "Which argument is not Clifford's?"
    prompt: |
      According to the essay, which of these is *not* a reason Clifford gives for the principle?
    options:
      - text: "A belief is wrong whenever it turns out to be false, so the rule is just 'avoid false beliefs'."
        correct: true
        feedback: |
          Right, this is not his argument. His own ship case shows it: the belief stays wrong even when the ship arrives safely and the belief turns out true.
      - text: "Beliefs feed into action and shape the character of the believer."
        feedback: |
          This is his first reason. It is why he refuses to separate belief from action.
      - text: "Beliefs are a shared inheritance, held as a trust for others."
        feedback: |
          This is his second reason, the public side of belief.
      - text: "Credulity weakens the habit of testing claims, in a person and in a society."
        feedback: |
          This is his third reason, the effect on the habit of inquiry.
    explanation: |
      Notice the shape of the case. All three reasons point to harms and duties among people, so Clifford's principle is an *ethical* claim. That separates it from the theory of knowledge in the previous lesson, though the two meet in the next card.

  - type: text
    id: knowledge-link
    title: "Evidence and justification"
    body: |
      Recall from the lesson What Is Knowledge?: $J(S,p)$ means that a person $S$ is justified in believing a statement $p$, the third condition of justified true belief, and an **internalist** account says that what justifies is something inside the believer's own mind (grounds they can reach by reflection), while an **externalist** account such as reliabilism says it is how the belief was produced in the world.

      A later view, **evidentialism**, was defended as a theory of justification by Richard Feldman and Earl Conee in "Evidentialism" (*Philosophical Studies*, 1985). Writing $E_S$ for the evidence a person $S$ has at that time, it says that $S$ is justified in believing $p$ when that evidence supports $p$:

      $$J(S,p)\iff E_S\ \text{supports}\ p$$

      According to the Internet Encyclopedia of Philosophy, the evidence is counted from the person's own mental states, such as experiences and what they already believe, which is an internalist restriction. Two things to keep apart: Feldman and Conee's thesis is about *when a belief is justified*, while Clifford's principle is about *what we ought to do*. The first can be held without the second, and a believer could accept one and reject the other.

  - type: mcq
    id: link-q
    title: "Which condition does evidence fill?"
    prompt: |
      A reliabilist and an evidentialist agree that a stopped-clock reader lacks knowledge, but they explain justification differently. Which pair is right?
    options:
      - text: "The evidentialist says justification depends on the evidence the person has (internal); the reliabilist says it depends on how reliable the process that produced the belief is (external)."
        correct: true
        feedback: |
          Yes. Both are accounts of the justification condition $J$. They part ways on whether what justifies is the believer's evidence or the track record of the belief's source.
      - text: "The evidentialist says belief needs no justification; the reliabilist says it needs a lot."
        feedback: |
          Both accept a justification condition. They differ about what fills it.
      - text: "The evidentialist is about truth ($T$); the reliabilist is about belief ($B$)."
        feedback: |
          Neither account replaces the truth or belief conditions. Both address justification.
      - text: "The two are the same view in different words."
        feedback: |
          They can disagree. In the new evil demon case, the evidentialist says the deceived person has the same evidence as you and so is equally justified, while the reliabilist, on the face of it, says not.
    explanation: |
      So evidence is one candidate answer to what justification is. Clifford's principle then adds a moral demand to it: do not believe beyond your evidence.

  - type: text
    id: objections
    title: "Objections"
    body: |
      Three objections are standard, according to the Stanford Encyclopedia of Philosophy and the essay's readers.

      **Regress.** If the principle says you must have sufficient evidence for every belief, you must also believe that your evidence is sufficient, and that needs evidence too, and so on without end. The Stanford Encyclopedia notes that strict evidentialism faces this infinite regress. A related worry, which we put as a question, is whether the principle itself rests on evidence. Clifford's own support is the three arguments above, which are about consequences, so a critic can ask whether those premises are themselves established by the standard they set.

      **How much is enough.** "Sufficient" is vague. A moderate evidentialist lets the amount depend on the stakes, and the line between this and the view that evidence need not govern at all is, in the Stanford Encyclopedia's words, rather blurry.

      **Counterexamples where believing beyond the evidence helps.** William James (1842 to 1910), in "The Will to Believe" (1896), argued that in some choices the evidence cannot decide and our wishes and hopes may; a later lesson takes up his reply. Another example given in the Stanford Encyclopedia is a patient who believes they will recover from an illness, where hope may help.

  - type: mcq
    id: obj-q
    title: "Which objection is which?"
    prompt: |
      A critic says: "Clifford demands evidence for every belief. But to know that my evidence is sufficient I need further evidence, and to know that, more again." Which objection is this?
    options:
      - text: "The regress objection: the demand for evidence about evidence has no end."
        correct: true
        feedback: |
          Yes. Defenders can reply that the principle applies to beliefs, not to endless higher-order beliefs, or that some evidence needs no further evidence. The reply is part of the live debate.
      - text: "The stakes objection: how much evidence depends on what is at risk."
        feedback: |
          That one is about how much, not about the endless chain. It comes from the same family but is a different step.
      - text: "James's objection: some questions cannot be decided by evidence."
        feedback: |
          That targets cases where evidence is silent. This critic is saying the demand for evidence cannot be met even in principle.
      - text: "The objection that Clifford never defined belief."
        feedback: |
          Not the point here. The critic accepts the principle's wording and presses on what it requires.
    explanation: |
      Each objection has replies, and thoughtful people differ on whether any of them breaks the principle or only forces a more careful version.

  - type: text
    id: odds
    title: "Weighing evidence by odds"
    body: |
      To see what "sufficient" might mean, take the shipowner and put numbers on his case. Recall Bayes' rule in odds form: for a statement and its rival,

      $$\frac{P(H_1\mid E)}{P(H_2\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_2)}\cdot\frac{P(H_1)}{P(H_2)}$$

      so posterior odds equal the **likelihood ratio** (how much more likely the evidence $E$ is if $H_1$ holds than if $H_2$ does) times the prior odds. Here $H_1$ is "the ship is sound" and $H_2$ is "the ship is unsound". Suppose that, before any test, an old ship of this type is unsound with probability $0.2$, so $P(H_1)=0.8$ and the prior odds of sound to unsound are $0.8/0.2=4$. An inspection passes a sound ship 90% of the time and an unsound one 5% of the time, so a pass has likelihood ratio $0.9/0.05=18$.

      These numbers are an illustration of ours, not Clifford's. The ingredient we compute next is the chance the ship is unsound after the inspection passes it.

  - type: numeric
    id: one-pass
    title: "After one pass"
    prompt: |
      Using the setup (prior odds $4$ for sound, a pass has likelihood ratio $18$), the posterior odds of sound to unsound are $4\times18=72$. What is the chance, in percent, that the ship is *unsound* after one pass? Round to one decimal.
    answer: 1.4
    tolerance: 0.05
    answerText: '1.4'
    wrong:
      - { value: 98.6, feedback: '98.6% is the chance that the ship is sound. The question asks for the unsound one: $1/73$.' }
      - { value: 5, feedback: '5% is how often the test passes an unsound ship, which is the likelihood, not the chance the ship is unsound after a pass.' }
    hint: "Odds of $72$ to $1$ mean $73$ equal parts, one of them unsound."
    explanation: |
      Odds $72:1$ split into $73$ parts, one unsound, so the chance is $1/73\approx0.0137$, about $1.4\%$. A test that fails only 5% of the time on bad ships still leaves a real risk, because bad ships were not rare to start with.

  - type: numeric
    id: passes-needed
    title: "How many passes?"
    prompt: |
      The owner decides that he can only send 300 people to sea if the chance of an unsound ship is below one in a thousand ($0.1\%$). Assume each inspection is independent and passes with the same likelihood ratio $18$. How many passes in a row must the ship earn?
    answer: 2
    answerText: '2'
    wrong:
      - { value: 1, feedback: 'One pass leaves $1/73\approx1.4\%$, far above $0.1\%$.' }
      - { value: 3, feedback: 'Three would do, but two already suffice: $4\times18^2=1296$, so the chance of unsound is $1/1297\approx0.08\%$, under $0.1\%$.' }
    hint: "Each pass multiplies the odds by 18. You need odds of sound to unsound above 999."
    explanation: |
      After two passes the odds are $4\times18\times18=1296$, so the chance of an unsound ship is $1/1297\approx0.077\%$, under $0.1\%$. One pass gives $72$, not enough. The independence of the inspections is an assumption: two looks by the same careless inspector would not multiply.

  - type: mcq
    id: threshold-q
    title: "Who sets the threshold?"
    prompt: |
      The arithmetic shows how evidence accumulates. Does it also tell the owner that $0.1\%$ is the right threshold of "sufficient"?
    options:
      - text: "No. The arithmetic gives the chance for each amount of evidence; where to put the line is a further judgement, which depends on the stakes."
        correct: true
        feedback: |
          Yes. For a rowboat with one passenger the owner might accept a larger risk than for 300 emigrants. A moderate evidentialist accepts this; strict readings of Clifford's wording, which says *anyone, everywhere*, are sometimes read as asking for the same standard (our reading, the Stanford Encyclopedia notes the later parts of the essay suggest a more moderate view).
      - text: "Yes: probability theory fixes the threshold at $0.1\\%$."
        feedback: |
          Probability theory only converts evidence into chances. The $0.1\%$ was the owner's choice in the prompt.
      - text: "Yes: a threshold of $0\\%$ is the only one Clifford allows."
        feedback: |
          Almost no belief about the world reaches $0\%$ chance of error, so this would forbid nearly all belief. Even Clifford allows grounds that are good enough rather than certain.
      - text: "No, so thresholds do not matter and anything may be believed."
        feedback: |
          That does not follow. That the line is a judgement does not make every line equally good: the owner's doubts still had to be answered.
    explanation: |
      This is where evidentialists and their critics often part ways: on how much evidence, and who decides. The numbers sharpen the question but do not settle it.

  - type: text
    id: religion
    title: "Does it reach religion?"
    body: |
      Clifford did not stop at ships. According to the essay, he applied the principle to inherited religious belief: holding a traditional belief while stifling doubts, shunning books and people that challenge it, and treating questions as impious is, in his view, a lasting wrong against humanity. He notes that this is harsh on those who were never taught otherwise.

      Believers can reply in several ways, and this course does not choose among them. One reply is that **evidence is broader than proof**: religious experience, the testimony of a tradition and the sense that something is so can count as evidence, and the Internet Encyclopedia of Philosophy says that experiences and seemings are standard kinds of evidence for evidentialists. Another reply, by Alvin Plantinga, is that the principle itself is the problem: belief in God may be held without evidence from arguments and still be rational. That is the topic of the next lesson. A third reply is James's, that some momentous questions are not settled by evidence at all.

  - type: mcq
    id: religion-q
    title: "Which reply is which?"
    prompt: |
      A believer says: "I do have evidence: a lifetime of experience of the divine, and the testimony of a tradition I trust. You are using too narrow a notion of evidence." Which reply to Clifford's principle is this?
    options:
      - text: "Accepting the principle but widening what counts as evidence."
        correct: true
        feedback: |
          Yes. The believer agrees that belief should fit the evidence and argues that experience and testimony are evidence. The sceptic's rejoinder is to ask how strong such evidence is and whether people of other traditions have equal claims, which is a debate about weight, not about the principle.
      - text: "Rejecting the principle: belief in God needs no evidence at all."
        feedback: |
          That is the other reply, Plantinga's, which the next lesson takes up. This believer *offers* evidence.
      - text: "Conceding the principle and giving up belief."
        feedback: |
          That is a possible response (and Clifford's own conclusion for those without evidence), but it is not what this believer says.
      - text: "Saying the principle does not apply to religion."
        feedback: |
          This believer does apply it, and claims that the condition is met.
    explanation: |
      Both sides can be fair here. The disagreement can be about how to count evidence, about how much is enough, or about whether the principle applies at all.

  - type: mcq
    id: layers-q
    title: "Fact, debate or commitment?"
    prompt: |
      Sort the statement "Clifford argued in 1877 that believing on insufficient evidence is wrong, and held that the ship would not change the owner's guilt even if it arrived safe" among the three layers of a claim.
    options:
      - text: "Established fact: it records who argued what and when, checkable in the essay."
        correct: true
        feedback: |
          Yes. It is a claim about a text. Whether Clifford was *right* is a different, layer-two or three, question.
      - text: "Live debate: scholars disagree about whether he argued this."
        feedback: |
          The argument is in his essay; scholars disagree about whether it works and how strict he is, not about whether he made it.
      - text: "Faith commitment: it depends on one's worldview."
        feedback: |
          Reporting a text does not depend on worldview. What one thinks of the principle might.
      - text: "None: it is a value judgement."
        feedback: |
          It is a report. The judgement that the principle is right or wrong is the part that goes beyond it.
    explanation: |
      Keep this separation: what Clifford argued is fact. Whether evidence alone should govern belief, and how much is enough, is live debate. Whether religious belief is the kind of belief the principle governs is, for many, a matter of deeper commitment.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** On whether the duty to proportion belief to evidence has no exceptions or depends on the stakes, on what counts as evidence (proof, experience, testimony), and on whether belief in God is the kind of belief the duty governs. Open: none of these has a settled answer.

      **Next:** the lesson Reformed Epistemology asks whether belief in God can be rational without any argument, and what the Great Pumpkin objection says against that.
