id: ch23-fideism
title: "Fideism, Leap and Doubt"
kind: concept
own: |
  The setting: a person considers committing to a statement $H$ (for example "God exists"). The lesson asks whether that commitment is a bet at all. Each answer is told *according to* its thinker, and **fideism** (from Latin *fides*, faith) names the family of views that rest religious commitment on faith rather than on reasons, in the formula Alvin Plantinga is cited as using, on "exclusive or basic reliance upon faith alone".
  - **The bet model that fideists question** (William James, 1842 to 1910; Blaise Pascal, 1623 to 1662). Write $p=P(H)$ for the chance given to $H$, $g$ for the gain if $H$ is true and $c$ for the loss if $H$ is false. James's rule says committing is worth it when
    {{ $$p>\frac{c}{g+c}$$ }}
    and Pascal's expected value of a wager, with payoff $x_1$ if $H$ is true and $x_2$ if not, is
    {{ $$\mathrm{EV}=p\,x_1+(1-p)\,x_2$$ }}
    With $g=50$ and $c=10$ the threshold is
    $$\frac{10}{60}=\frac16$$
    so any $p$ above $1/6$ licenses committing. Both thinkers treat faith as a choice made under a chance $p$.
  - **Kierkegaard's leap** (Søren Kierkegaard, 1813 to 1855). According to the Stanford Encyclopedia of Philosophy, he holds that faith requires a decision, a "qualitative leap", not the last step of a calculation. In *Fear and Trembling* (1843, by the pseudonym Johannes de silentio) Abraham's readiness to sacrifice Isaac has no public justification, a "teleological suspension of the ethical". In the *Concluding Unscientific Postscript* (1846, pseudonym Johannes Climacus) faith is held with passion against objective uncertainty, so no value of $p$ turns a doubt into faith.
  - **Wittgenstein's reading** (Ludwig Wittgenstein, 1889 to 1951, student notes of lectures given in 1938, published 1966). In his Last Judgment example, a believer and a nonbeliever do not simply hold opposite hypotheses: the believer's sentence regulates how a life is lived. Readers such as D. Z. Phillips (1934 to 2006) draw from this that religious language has its own use inside a {{ **form of life** }}. Kai Nielsen's essay of 1967 named the charge {{ **Wittgensteinian fideism** }}: religion becomes cut off from outside criticism. Phillips rejects the label as unfair.
  - **Three senses of fideism** (the lesson's own sorting). Reason is *unable* to reach the truth of faith, or it is *irrelevant* to it because faith answers to other standards, or it is *hostile* to it. Tertullian (c. 155 to c. 220 CE, dates given only approximately) is often cited for "I believe because it is absurd", yet that wording is a later paraphrase of what he wrote.
  - **Doubt.** According to the Kierkegaardian picture, doubt is the condition in which faith is held, not an enemy of faith; Pascal's "reasons of the heart" say, in essence, that the heart has reasons that reason does not know. James differs: for him the evidence is silent only for now and for this option, and evidence stays the default.
  - **Two objections.** *Self-defeat*: an argument that reason cannot ground faith uses reason. *Which faith?*: if faith needs no evidence, a rival faith is as immune as one's own. Replies exist for both and are disputed.
  - **Three layers.** Fact: who wrote what and when. Debate: whether Wittgenstein's view is fideist, and whether Kierkegaard rejects reason or only its claim to reach faith. Commitment: whether faith should answer to evidence at all.

cards:
  - type: text
    id: hook
    title: "Is love a hypothesis?"
    body: |
      Ana has been married for twenty years. At a dinner a guest, curious and friendly, asks her: "What is your evidence that you love your husband? How likely is it, say in percent, that you are right?"

      Ana laughs, then stops. The question feels strange, and not only because it is rude. Before any theory, a guess. Guessing first is the point: the lesson is about whether trusting a person, keeping a promise or holding a faith is the kind of thing that evidence can support, the way a weather forecast is supported.

  - type: mcq
    id: guess
    title: "What does the guest assume?"
    prompt: |
      Ana is asked for her evidence and a percentage that she loves her husband. What does the guest's question take for granted about her love?
    options:
      - text: "That her love is a claim that could be true or false and that evidence could support or undermine, like a forecast."
        correct: true
        feedback: |
          Yes. To ask for a probability is to treat the love as a statement with a chance of being right. Whether that is the right way to see love is exactly what the lesson will ask about faith.
      - text: "That Ana has no feelings and is only pretending."
        feedback: |
          The guest says nothing like that. The question could be asked kindly; the assumption is about the kind of thing love is.
      - text: "That love cannot be discussed in words."
        feedback: |
          The opposite: the guest wants an answer in numbers. A person who held that view would not have asked.
    explanation: |
      Keep your own answer to whether the question fits. A defender of the guest says that any commitment makes claims about the world, so it can be weighed; Ana might reply that her love is a way of living with someone, not a bet on how he will turn out. The thinkers below split along this line.

  - type: text
    id: recall
    title: "Recall: faith as a bet"
    body: |
      Recall from the lesson Will to Believe: James and Pascal. Suppose a person considers committing to a statement $H$ (for example "God exists") before the evidence settles it. William James (1842 to 1910) argued, in "The Will to Believe" (1896), that when an option is **genuine** (live, forced and momentous) and cannot be decided by evidence, a person may let their wishes decide. Write $p=P(H)$ for the chance the person gives $H$, $g$ for the gain if $H$ is true and $c$ for the loss if $H$ is false. Committing is worth it when
      $$p>\frac{c}{g+c}$$

      Blaise Pascal (1623 to 1662) argued in the *Pensées*, published after his death, that one must wager. If wagering for God pays $x_1$ when God exists and $x_2$ when not, its expected value is
      $$\mathrm{EV}=p\,x_1+(1-p)\,x_2$$
      Both thinkers treat faith as a choice made under a chance $p$, with weights on possible gain and loss. This lesson meets thinkers who deny that picture.

  - type: numeric
    id: threshold
    title: "The bet model in numbers"
    prompt: |
      A person may commit to a statement $H$. Committing gains $g=50$ if $H$ is true and costs $c=10$ if $H$ is false; withholding pays $0$ either way. By James's rule, committing is worth it when $p>c/(g+c)$, where $p$ is the chance given to $H$. What is the break-even value of $p$?
    answer: 0.1667
    tolerance: 0.001
    answerText: '1/6'
    wrong:
      - { value: 0.2, feedback: "That is $c/g=10/50$. The denominator is the gain plus the loss, $g+c=60$." }
      - { value: 0.8333, feedback: "That is $g/(g+c)$, the chance needed to *avoid* committing. The rule has the loss $c$ on top." }
    hint: "Divide $c=10$ by $g+c$."
    explanation: |
      $c/(g+c)=10/60=1/6\approx0.167$. On this model, a person who gives $H$ a chance above $1/6$ is allowed to commit, and the more evidence raises $p$, the easier the choice. Keep this picture in mind: the thinkers below say faith is not a number that crosses a threshold.

  - type: text
    id: kierkegaard
    title: "Kierkegaard and the leap"
    image:
      src: img/kierkegaard.webp
      alt: "Oil portrait of Søren Kierkegaard seated at a tall writing desk"
      caption: "Søren Kierkegaard (1813-1855) of Copenhagen, painted at his high desk by the later Danish painter Luplau Janssen; he published much of his work under invented names, so the views of those authors are not simply his own."
      credit: "Luplau Janssen, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Kierkegaard_portrait.jpg"
    body: |
      Søren Kierkegaard (born in Copenhagen on 5 May 1813, died there on 11 November 1855) wrote many of his best-known books under **pseudonyms**, invented author names. According to the Stanford Encyclopedia of Philosophy, in the *Concluding Unscientific Postscript* (1846) the author is Johannes Climacus and Kierkegaard appears only as editor. So "according to Climacus" is the careful way to report its claims.

      Climacus argues that reflection alone cannot lead to a choice: at some point a person must will to stop reflecting and identify with a possibility. According to the Encyclopedia's entry on fideism, Kierkegaard describes faith as requiring a decision, a "qualitative leap", and as "believing against the understanding", while distinguishing it from nonsense. In the Postscript, in essence, faith is held fast with the passion of inwardness against objective uncertainty, not after the uncertainty has been removed.

      Compare the bet model. There, more evidence raises $p$ until the threshold is crossed. On this view no value of $p$ is the faith: faith is the act of committing, with the doubt still present.

  - type: text
    id: abraham
    title: "Abraham, Isaac and a story with no public reason"
    body: |
      In *Fear and Trembling* (1843), written under the pseudonym Johannes de silentio ("John of the silence"), Kierkegaard's author retells Genesis 22. God commands Abraham to sacrifice his son Isaac. Abraham sets out, and God stops him at the last moment; a ram is sacrificed instead.

      Johannes contrasts Abraham with Agamemnon, the Greek king who sacrifices his daughter for the sake of his army and can defend it by a public duty. Abraham has no such defence. According to the Encyclopedia, Johannes asks whether the story contains a "teleological suspension of the ethical", meaning an aim higher than ordinary morality that can override it, and calls Abraham's faith a purely personal virtue that looks absurd to an outsider like himself. Johannes also says he cannot understand Abraham.

  - type: mcq
    id: abraham-mcq
    title: "What is the story for?"
    prompt: |
      A reader says: "Fear and Trembling teaches that anyone who feels God commands something may do it, however harmful." According to the work's pseudonymous author Johannes de silentio, which reply is fairest?
    options:
      - text: "The book does not offer a rule others can use: its author says Abraham's act has no public justification and that he himself cannot understand it, so it exposes the limits of reasons rather than licensing acts."
        correct: true
        feedback: |
          Yes. The claim that Abraham cannot justify himself to anyone is the point of the work. It does not follow that anyone else's claim to be commanded is true, and critics note that nothing in the story lets a bystander tell Abraham from a murderer.
      - text: "The book proves by argument that God exists, so Abraham is right."
        feedback: |
          Nothing in it is a proof. Its author says the faith it describes looks absurd from outside, which is a different claim.
      - text: "The book argues that Abraham was mistaken and ought to have refused."
        feedback: |
          Johannes treats Abraham as a "knight of faith", not as a man in error, though he finds the story terrifying.
    explanation: |
      Two readings exist. Some readers take the work as a defence of faith that goes beyond ethics; others take it as a warning, by its pseudonymous author, of how frightening such faith would be. Scholars do not agree on which Kierkegaard intended, partly because he spoke through Johannes.

  - type: mcq
    id: leap-mcq
    title: "Why does a leap remain?"
    prompt: |
      A person gives $H$ ("God exists") a chance $p=0.9$, far above any threshold $c/(g+c)$ from James's rule. Climacus says reflection alone cannot lead to a choice and that faith is held with passion against objective uncertainty. According to Climacus, what follows?
    options:
      - text: "A high $p$ does not by itself make the person a believer: faith is the act of committing, and some uncertainty always stays."
        correct: true
        feedback: |
          Yes. On this reading, no amount of evidence removes the need for the decision, and the decision, with the doubt still there, is faith.
      - text: "The person already has faith, since $p$ is high."
        feedback: |
          That is the bet model's answer. Climacus denies that faith is a degree of probability.
      - text: "The person should lower $p$ on purpose, to make faith harder."
        feedback: |
          Climacus does not ask for a lower $p$. He says faith is not measured by $p$ in the first place.
    explanation: |
      A critic replies, as the Encyclopedia reports, that the leap is a kind of Russian roulette: with no way to tell a good leap from a bad one, the advice has no content. Defenders reply that Christianity looks ungrounded only from the outside. The Stanford Encyclopedia entry on Kierkegaard adds that his word for contradiction means a tension or incongruity, not only a logical contradiction, so scholars dispute whether he rejects reason or only its claim to reach faith.

  - type: text
    id: wittgenstein
    title: "Wittgenstein and the Last Judgment"
    image:
      src: img/wittgenstein.webp
      alt: "Black-and-white portrait photograph of the philosopher Ludwig Wittgenstein in 1930"
      caption: "Ludwig Wittgenstein (1889-1951), photographed in 1930 by Moritz Nähr; his remarks on religion survive mostly as notes taken by students."
      credit: "Moritz Nähr, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Ludwig_Wittgenstein_(3x4_cropped).jpg"
    body: |
      Ludwig Wittgenstein (1889 to 1951) gave lectures on religious belief at Cambridge in 1938. They survive as notes taken by students (Yorick Smythies, Rush Rhees and James Taylor, according to the editor Cyril Barrett) and were published in 1966 in *Lectures and Conversations on Aesthetics, Psychology and Religious Belief*. Commentators disagree about who took which notes, so every quotation is a student's report.

      In one example, someone believes in the Last Judgment, and Wittgenstein does not. Does that mean Wittgenstein believes the opposite, that there will be no such thing? In essence, he answers: not at all, or not always. A believer and a nonbeliever may think about the matter in different ways, and the believer's belief regulates how the believer lives. He adds that he would not say "No, I don't believe there will be such a thing", which would seem to him utterly crazy, and that he cannot contradict the believer.

      According to readers such as D. Z. Phillips, this suggests that religious belief is not a hypothesis weighed against evidence. It has a use in the life of a community, its **form of life**, a pattern of living and speaking in which the words get their meaning.

  - type: mcq
    id: lastjudgment
    title: "Do they contradict each other?"
    prompt: |
      A says: "There will be a Last Judgment." B says: "I do not believe in a Last Judgment." According to the reading of Wittgenstein's example above, what is the best description of how B stands to A?
    options:
      - text: "B need not be asserting the opposite claim: the two may use the sentence differently, since for A it regulates how a life is lived."
        correct: true
        feedback: |
          Yes, in essence this is Wittgenstein's "not at all, or not always". The two may be talking past each other if B treats the sentence as a forecast.
      - text: "B is asserting the opposite, as in the pair 'it will rain tomorrow' and 'it will not rain tomorrow'."
        feedback: |
          That is the ordinary case, the one Wittgenstein says need not apply here. If the Last Judgment were a forecast, this answer would be right, and it is the answer that rival readers give.
      - text: "B is wrong, because the sentence is a plain empirical claim that evidence will settle."
        feedback: |
          This treats the sentence as a hypothesis. Wittgenstein's remark is a reason to doubt that this is the right way to read it.
    explanation: |
      A critic presses this: if believer and nonbeliever do not contradict each other, what is the believer's claim? Philosophers of religion such as Kai Nielsen say the answer risks making religion unanswerable to anything outside it. Phillips's side replies that the believer's sentences are still answerable to the standards of sense of their own practice.

  - type: text
    id: label
    title: "The label and its critics"
    body: |
      Kai Nielsen, in the essay "Wittgensteinian Fideism" (*Philosophy*, 1967), gave a name to a view he attributed to some Wittgensteinian philosophers of religion, among them Norman Malcolm and Peter Winch. According to the Encyclopedia's entry on fideism, the view is usually stated in a few theses, among them that religion is logically cut off from other parts of life and cannot be criticized from outside. The same entry says Wittgenstein probably would not endorse these theses.

      Phillips rejected the label: he held that it misdescribes his work. Nielsen and Phillips later published a joint volume titled *Wittgensteinian Fideism?* (2005). So the dispute is partly about whether anyone holds the view, not only about whether the view is true.

  - type: mcq
    id: label-mcq
    title: "What the critic charges"
    prompt: |
      Which statements does Nielsen's charge of "Wittgensteinian fideism" attribute to the view it targets? Select all that apply.
    multiple: true
    options:
      - text: "Religion is logically cut off from other aspects of life."
        correct: true
        feedback: |
          Yes. This is one of the theses the Encyclopedia lists as the view's core.
      - text: "Religious belief cannot be criticized from outside the religion."
        correct: true
        feedback: |
          Yes. This is the part critics find most worrying, since it would protect any practice from any objection.
      - text: "Religious belief is a hypothesis that science has refuted."
        feedback: |
          This is the opposite of the target view, which denies that religion is a hypothesis in the first place.
      - text: "Wittgenstein himself clearly held all these theses."
        feedback: |
          The Encyclopedia says he probably would not endorse them, and Phillips rejects the label.
    explanation: |
      Two layers meet here. That the label exists and who coined it is fact. Whether Wittgenstein or Phillips deserves it is live debate.

  - type: text
    id: senses
    title: "Three senses of fideism"
    body: |
      The word *fideism* comes from Latin *fides*, faith. According to the Stanford Encyclopedia, Alvin Plantinga defines it as "exclusive or basic reliance upon faith alone", which involves downgrading reason, and the entry says philosophers disagree about who counts as a fideist; it names Pascal, Kierkegaard, James and Wittgenstein as the four most often associated with it.

      The word hides three claims, and this lesson sorts them as follows (the sorting is the lesson's own, not a standard list). **Reason is unable**: it cannot reach the truth of faith. **Reason is irrelevant**: faith answers to its own standards, so reason's verdict is beside the point. **Reason is hostile**: reason is an obstacle and faith must overcome it. A famous line often cited for the third is "I believe because it is absurd". According to the Encyclopedia, that is not Tertullian's wording: the theologian from Carthage (c. 155 to c. 220 CE, dates given only approximately) wrote, in his *On the Flesh of Christ*, that the death of the Son of God is by all means to be believed because it is absurd, and the popular line is a later paraphrase.

  - type: mcq
    id: sort
    title: "Unable, irrelevant or hostile?"
    prompt: |
      Three readings are described. (1) Someone says reason can take a person only so far, then reaches a limit where it cannot decide. (2) Someone says religious sentences get their meaning from the practice they belong to, so asking for evidence misunderstands them. (3) Someone says that to believe truly one must give up trusting one's own reasoning. Which matches, in order, to unable, irrelevant and hostile?
    options:
      - text: "(1) unable, (2) irrelevant, (3) hostile."
        correct: true
        feedback: |
          Yes. A limit is a claim of inability; a different standard makes reason beside the point; giving up reasoning treats reason as an obstacle.
      - text: "(1) hostile, (2) unable, (3) irrelevant."
        feedback: |
          Reason that "can only go so far" does not oppose faith, it falls short of it. That is inability, not hostility.
      - text: "(1) irrelevant, (2) hostile, (3) unable."
        feedback: |
          Reading (2) does not call reason an obstacle; it says reason asks a question that does not fit. That is irrelevance.
    explanation: |
      Real thinkers do not sit in one box. Pascal says in the wager passage that reason cannot decide whether God exists, which fits "unable"; the Wittgensteinian reading fits "irrelevant"; the popular "I believe because it is absurd" fits "hostile", and it is not what Tertullian wrote.

  - type: text
    id: doubt
    title: "Doubt as part of faith"
    body: |
      Pascal wrote, in essence, that the heart has its reasons which reason does not know. Readers disagree about what his "heart" is: scholars often take it to mean a kind of intuition, not mere feeling. On that reading the heart is a source of conviction that reason alone does not supply, and Pascal does not say that emotion beats reason.

      On the Kierkegaardian picture, faith is held with the doubt still in view. A believer who feels doubt has not failed: the uncertainty is what makes holding on a decision. James would reply that the case differs. According to James the evidence is silent only for this option, and evidence remains the default for every other belief; Kierkegaard's gap is not a temporary shortage of evidence to be filled later.

  - type: mcq
    id: versus-james
    title: "How fideism differs from James"
    prompt: |
      James says a person may let wishes decide a genuine option that evidence cannot settle. Climacus says faith is held with passion against objective uncertainty. Which statement marks the difference between them?
    options:
      - text: "For James the permission is narrow (live, forced, momentous, undecidable by evidence) and evidence stays the default; for Climacus the leap belongs to faith itself, whatever the evidence."
        correct: true
        feedback: |
          Yes. James still weighs, through $p$, $g$ and $c$; Climacus denies that faith is a weighing.
      - text: "James thinks evidence is irrelevant to religion; Climacus thinks it decides everything."
        feedback: |
          Reversed and too strong. James holds that evidence governs most beliefs, and Climacus does not say evidence decides everything.
      - text: "There is no difference: both say anyone may believe whatever they like."
        feedback: |
          Neither says that. James limits the permission to genuine options, and Climacus describes a costly commitment, not a free choice of a comfortable belief.
    explanation: |
      Both James and Kierkegaard are often called fideists, as the Stanford Encyclopedia notes, and the label hides these differences.

  - type: mcq
    id: self-defeat
    title: "Does the argument defeat itself?"
    prompt: |
      A critic says: "A fideist argues that reason cannot ground faith. But that is an argument, so the fideist trusts reason after all." Which reply is the most careful?
    options:
      - text: "It depends on the sense: a fideist who says reason is hostile or unable uses reason to say so and must explain why this use is sound, while one who says reason is irrelevant to faith's standards may claim only that the question does not apply."
        correct: true
        feedback: |
          Yes. The objection bites hardest on the strong senses, where reason's verdict is both used and denied. The "irrelevant" view can answer that it argues about what kind of thing faith is, not about whether faith is true.
      - text: "The objection is plainly mistaken, since no one can use an argument against arguments."
        feedback: |
          People do use arguments to show limits of arguments (a proof of an unprovable statement is an example). The question is whether this particular use is consistent.
      - text: "The objection settles the matter: fideism is refuted."
        feedback: |
          Too fast. It forces a fideist to say which of the three senses is meant and what role reason keeps, and some views survive the demand.
    explanation: |
      This objection is the lesson's own wording of a standard line of criticism. Some careful fideists reply that reason can be used to show its own limits.

  - type: mcq
    id: which-faith
    title: "How does a fideist tell faiths apart?"
    prompt: |
      A fideist says: "Faith needs no support from evidence." A friend replies: "Then a rival religion's faith is just as immune, and nothing separates yours from theirs." What does the friend's objection press?
    options:
      - text: "If evidence is set aside, the believer lacks a way to say why this faith and not another, and the same move is open to every tradition."
        correct: true
        feedback: |
          Yes. The Encyclopedia raises the same worry in its discussion of Pascal's wager, where rival gods each offering a reward leave it unclear that one religion is more rational than another.
      - text: "That faith is only a feeling."
        feedback: |
          The objection does not say what faith is. It asks what chooses between faiths.
      - text: "That all religions are false."
        feedback: |
          Nothing of the kind follows. The objection is about method, not about whether any faith is true.
    explanation: |
      Replies differ. A Kierkegaardian says the faith is a personal commitment, not a comparison. A Wittgensteinian says the question "which is right?" misunderstands each form of life. A critic answers that these replies leave disagreement between traditions without any way to settle or even to discuss it, a problem the later lessons on disagreement and pluralism take up.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Which of these is a matter of fact (layer 1), not live debate or personal commitment?
    options:
      - text: "Nielsen published an essay titled 'Wittgensteinian Fideism' in 1967, and Phillips rejected the label."
        correct: true
        feedback: |
          Yes. This is publication history, checked in sources.
      - text: "Wittgenstein's remarks on the Last Judgment show that religious belief is not a hypothesis."
        feedback: |
          This is live debate: it is one reading, and critics read the same notes differently.
      - text: "Faith should not have to answer to evidence."
        feedback: |
          This is a commitment about what faith is, which depends on one's values and premises.
      - text: "Kierkegaard rejects reason."
        feedback: |
          Scholars dispute this, since his word for contradiction means a tension and not only a logical contradiction.
    explanation: |
      The lesson settles who wrote what. It leaves open whether faith is a bet, a leap or a form of life, and whether it should answer to evidence. Those depend on premises and values, which is where thoughtful people part ways.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** Even if faith were a bet or a leap, people who hold different views meet, and sometimes they are equally well informed. The next lesson, Guided proof: Disagreement Among Equals, asks what it requires of you when an equally capable person disagrees.
