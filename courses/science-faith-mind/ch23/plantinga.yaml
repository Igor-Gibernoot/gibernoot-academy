id: ch23-plantinga
title: "Reformed Epistemology"
kind: concept
own: |
  The setting: a person $S$ and a statement $p$ (for example "I had breakfast today" or "God exists"). Write $B(S,p)$ for "$S$ believes $p$". A belief is **basic** for $S$ when $S$ holds it directly, not because of other beliefs, and **inferred** (non-basic) when it rests on others. A belief is **properly basic** when holding it directly is rational. Each view is told *according to* its thinkers.
  - **The evidentialist objection and its premise.** Evidentialists in the line of Clifford hold that belief in God is rational only if supported by evidence or argument. The objection rests on {{ classical foundationalism }}, which allows only three kinds of properly basic belief (evident to the senses, incorrigible, self-evident):
    {{ $$\begin{aligned}p\text{ properly basic}\ \Rightarrow\ &p\text{ self-evident, or}\\&p\text{ incorrigible, or}\\&p\text{ evident to the senses}\end{aligned}$$ }}
    Belief in God is none of these, so it would need support from other beliefs.
  - **Plantinga's diagnosis** (Alvin Plantinga, in "Reason and Belief in God", in *Faith and Rationality*, 1983, edited with Nicholas Wolterstorff). Classical foundationalism fails its own test: the criterion is neither self-evident, nor incorrigible, nor evident to the senses, and it excludes beliefs nearly everyone holds directly (memory, other minds). So the objection that depends on it is not established. This does not show that belief in God is rational, only that this objection fails.
  - **Properly basic belief in God.** Plantinga's positive proposal is that belief in God can be properly basic, as memory and perception are. Following John Calvin (1509 to 1564), he speaks of a *sensus divinitatis* ("sense of divinity"), a faculty that, in circumstances such as the night sky, guilt or danger, produces belief in God directly:
    {{ $$\begin{aligned}\text{circumstances}\ &\longrightarrow\ \textit{sensus divinitatis}\\&\longrightarrow\ \text{belief in God}\end{aligned}$$ }}
    The belief is grounded in those circumstances, not groundless.
  - **The Great Pumpkin objection and the reply.** Critics ask why, if belief in God may be basic, a belief such as "the Great Pumpkin returns every Halloween" may not be basic too. According to Plantinga, giving up the classical criteria does not leave us with no criteria: what is properly basic is learned from cases, as with memory and perception, and a basic belief remains open to defeat.
  - **Defeaters.** A {{ defeater }} is something that, once met, gives $S$ reason to drop a belief. A properly basic belief can be defeated, and a further consideration (a defeater-defeater) can restore it.
  - **Warrant and externalism.** Plantinga calls {{ warrant }} whatever turns true belief into knowledge. In *Warranted Christian Belief* (2000) he holds that a belief has warrant when it is produced by faculties working properly, in the environment they fit, according to a design plan aimed at truth. This is externalist: warrant depends on facts the believer may not be able to check.
  - **Three layers.** Fact: who argued what and when. Debate: whether the criteria fail, whether the Great Pumpkin reply works, and whether warrant is the right notion. Commitment: whether there is a *sensus divinitatis* at all, since Plantinga holds that whether belief in God has warrant depends on whether it is true.

cards:
  - type: text
    id: hook
    title: "No argument for breakfast"
    body: |
      This morning you had breakfast, or you did not. Either way you believe it. Now ask: what is your argument for it? Probably you have none. You do not list premises and conclude. You simply remember, and the belief is there.

      Before any theory, a guess. Guessing first is the point, and nothing here asks you to believe or doubt anything religious: the lesson asks whether a belief needs an argument to be rational.

  - type: mcq
    id: guess
    title: "Guess: must a rational belief rest on an argument?"
    prompt: |
      You believe you had breakfast, you can give no argument, and you are not irrational. What is the most natural explanation?
    options:
      - text: "Some beliefs can be rational without resting on other beliefs; memory is one of them."
        correct: true
        feedback: |
          This is the idea the lesson builds on. Philosophers call such beliefs *basic*: held directly, not inferred from other beliefs.
      - text: "You do have an argument, but you cannot remember it."
        feedback: |
          Possible for some beliefs, but it is odd for breakfast: nothing suggests a hidden argument. Notice that this reply would turn almost every belief into an argument nobody can state.
      - text: "You are irrational, but it does not matter for such a small belief."
        feedback: |
          Almost nobody accepts this. If remembering breakfast counts as irrational, the notion of rationality has gone wrong.
      - text: "A belief is rational only if it is true."
        feedback: |
          Rationality is about how the belief is held, not only about the result. A true guess is not a rational belief.
    explanation: |
      Keep your guess. The lesson follows one thinker, Alvin Plantinga, who asks whether belief in God can be basic in the same way, and what the objection against it assumes.

  - type: text
    id: recall
    title: "Recall: the objection"
    body: |
      Recall from the lesson Evidentialism: Clifford. William Kingdon Clifford (1845 to 1879) held, in "The Ethics of Belief" (1877), that it is wrong always, everywhere and for anyone to believe anything on insufficient evidence. Write $B(S,p)$ for "$S$ believes $p$" and $E_S$ for the evidence $S$ has. The principle says roughly: if $S$ believes $p$ then $E_S$ must be sufficient. Applied to religion, this gives the **evidentialist objection**: belief in God is rational only if it is supported by evidence or arguments.

      In the volume *Faith and Rationality* (1983), edited by Alvin Plantinga and Nicholas Wolterstorff, a group of Reformed philosophers answered this objection. According to the Internet Encyclopedia of Philosophy, that volume is where their view, called Reformed epistemology, was first clearly stated. Plantinga's own chapter in it is called "Reason and Belief in God". The name *Reformed* reflects the view's inspiration in the Reformed (Calvinist) tradition more than its core claims.

  - type: text
    id: foundations
    title: "Basic and inferred beliefs"
    body: |
      To see what the objection assumes, take **foundationalism**, a theory about how beliefs hold each other up. Think of a building. Some beliefs are the foundation: they are held *directly*, not because of other beliefs. Call them **basic**. The rest are **inferred** (non-basic): they are rational only if supported by beliefs below them. A belief that is basic *and* rational to hold that way is **properly basic**.

      Example (ours): you believe "the library is closed today". You infer it from the basic belief that you read a sign saying so, and that belief you hold directly, because you see the sign. The question for any foundationalist is which beliefs are allowed into the foundation.

  - type: mcq
    id: basic-q
    title: "Basic or inferred?"
    prompt: |
      Mia believes that her neighbour is at home. She believes it because she sees the neighbour's lights on and reasons that people turn lights on when they are in. Which description fits her belief about the neighbour?
    options:
      - text: "Inferred: it rests on another belief (the lights are on) plus a general idea about lights."
        correct: true
        feedback: |
          Yes. A belief held *because of* other beliefs is not basic. Her belief that the lights are on, however, is one she may hold directly by seeing them.
      - text: "Basic: she is quite sure of it."
        feedback: |
          Being sure is about confidence. Basic means held directly, without resting on other beliefs, and Mia's belief rests on the lights.
      - text: "Basic, because it is true."
        feedback: |
          Truth does not decide whether a belief is basic. The question is about how it is held.
      - text: "Neither: only beliefs about God are classified this way."
        feedback: |
          The classification applies to all beliefs. Foundationalism is a general theory, and the lesson then asks where belief in God falls.
    explanation: |
      Basic means held directly, inferred means held because of others. This is a distinction about structure, not about confidence or truth.

  - type: text
    id: classical
    title: "Classical foundationalism"
    body: |
      Which beliefs may sit in the foundation? According to the Internet Encyclopedia of Philosophy, **classical foundationalism** admits only three kinds as properly basic: beliefs that are **self-evident** (seen to be true just by understanding them, like "two plus three is five"), **incorrigible** (about one's own present mental state, where one cannot be mistaken, like "I seem to see red"), and **evident to the senses** (like "there is a tree outside"). Every other belief is rational only if it is supported by these.

      The evidentialist objection to belief in God then runs as an argument. P1: a belief is rational only if it is properly basic or supported by properly basic beliefs. P2: only the three kinds above are properly basic. P3: belief in God is none of the three, and the arguments for it are not strong enough. C: belief in God is not rational.

  - type: mcq
    id: critic-q
    title: "Which premise would a critic reject?"
    prompt: |
      A believer wants to resist the conclusion that belief in God is not rational. Without denying that the argument is valid, which premise is the natural target for a believer who thinks belief in God may be held directly?
    options:
      - text: "P2: that only self-evident, incorrigible and sensory beliefs are properly basic."
        correct: true
        feedback: |
          Yes. If more kinds of belief can be properly basic, belief in God might be one of them. This is the premise Plantinga attacks, and the argument stays valid: the fault, if any, lies in the truth of P2.
      - text: "C: the conclusion, by saying it is too harsh."
        feedback: |
          A conclusion is not refuted by finding it unwelcome. A critic must find a false premise or an invalid step.
      - text: "P1: the idea that beliefs are either basic or supported."
        feedback: |
          This is the basic shape of foundationalism, which Plantinga accepts. His quarrel is with which beliefs go in the foundation.
      - text: "The validity: the conclusion does not follow from the premises."
        feedback: |
          The step from the premises to C is valid. Questions of truth and of validity are separate, and the validity step is not where the dispute lies.
    explanation: |
      The dispute is about P2. A sceptic can reply that P2 is plausible and that a wider foundation lets in too much. The next cards show Plantinga's argument against P2 and the reply to that worry.

  - type: text
    id: selfref
    title: "Plantinga's diagnosis"
    body: |
      According to Plantinga, P2 fails a test it sets itself. Ask: is P2 self-evident? Incorrigible? Evident to the senses? It is none of these. Most people do not see it to be true just by understanding it, and many thoughtful people reject it. By its own rule, then, P2 is not properly basic, and nobody has given an argument for it from beliefs that are. A criterion of rationality that is itself irrational by its own standard is **self-referentially incoherent**.

      There is a second problem. By the same criterion, beliefs that nearly everyone holds directly would count as irrational: that the world existed five minutes ago (memory), that other people have minds, that we chose to do something. The Internet Encyclopedia of Philosophy lists these among Plantinga's examples. The arguments offered for them are weak, yet we are not irrational to believe them.

  - type: order
    id: diagnosis-order
    title: "Plantinga's argument against P2"
    prompt: |
      Put in order the steps by which Plantinga argues that the evidentialist objection, as stated, is not established.
    steps:
      - "The objection relies on a rule: only self-evident, incorrigible and sensory beliefs are properly basic."
      - "Apply the rule to itself: is the rule self-evident, incorrigible or evident to the senses?"
      - "It is none of the three, and no argument from such beliefs is given for it."
      - "So by its own standard the rule is not rationally held, and the objection that rests on it is not established."
    hint: "State the rule, test it, record the result, then conclude."
    explanation: |
      Note what the argument does *not* show: that belief in God is rational. It shows only that this objection fails. Alston and Wolterstorff, according to the Internet Encyclopedia of Philosophy, make the same limited point: this version of the evidentialist objection fails, which is not the same as showing that evidentialism is false.

  - type: mcq
    id: limit-q
    title: "What has been shown?"
    prompt: |
      Suppose Plantinga's self-reference argument against P2 is correct. What follows?
    options:
      - text: "The evidentialist objection, as stated with the classical criteria, is not established. It does not follow that belief in God is rational."
        correct: true
        feedback: |
          Yes. Removing a bad argument against a view does not give an argument for it. The positive case needs more, and the next cards give Plantinga's.
      - text: "Belief in God is shown to be true."
        feedback: |
          Rationality of a belief is a separate matter from its truth, and this argument addresses neither.
      - text: "Every belief is properly basic."
        feedback: |
          Nothing follows about *every* belief. The Great Pumpkin objection below is exactly this worry, and has a reply.
      - text: "Evidence is no longer relevant to belief."
        feedback: |
          Plantinga does not say this. Many beliefs are properly held on evidence, and basic beliefs can still be defeated by it.
    explanation: |
      The result is modest, and honest defenders say so. The step to "belief in God is properly basic" needs its own support.

  - type: text
    id: basic-god
    title: "Belief in God as properly basic"
    image:
      src: img/institutes.webp
      alt: Title page of a Latin edition of Calvin's Institutes of the Christian Religion, printed at Geneva
      caption: The 1559 Latin edition of John Calvin's Institutes, the work where Calvin argued that people have a natural sense of the divine.
      credit: "Jean Calvin, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Calvin_Institutio_christianae_religionis_1559.jpg"
    body: |
      Plantinga's positive proposal: belief in God can be properly basic, like belief in other minds, in the past, or in what one sees. In his earlier book *God and Other Minds* (1967), he had argued that if one's belief in other minds is rational, so is one's belief in God. Later he gave up this parity argument as his reply to the evidentialist and no longer treated arguments as the only route.

      He took from John Calvin (1509 to 1564), the Reformation theologian whose *Institutes of the Christian Religion* first appeared in 1536 (final Latin edition 1559), the idea of a *sensus divinitatis*, a "sense of divinity". According to Plantinga in *Warranted Christian Belief* (2000), it is a disposition to form beliefs about God in various circumstances: the grandeur of nature, guilt, danger, gratitude. It works as an input-output device: circumstances in, belief in God out, without an inference. A person who looks at the stars and finds herself believing in God is, on this model, in the position of a person who sees a tree and believes it is there.

      Plantinga insists that such belief is not *groundless*. It is grounded in the circumstances that trigger it. What it lacks is inference from other beliefs, as memory lacks it.

  - type: mcq
    id: sensus-q
    title: "What the sensus divinitatis is meant to do"
    prompt: |
      According to Plantinga, which description of the *sensus divinitatis* is right?
    options:
      - text: "A faculty that, in certain circumstances, produces belief in God directly, as memory and perception produce their beliefs."
        correct: true
        feedback: |
          Yes. The model is explicitly built on those faculties, which is why parity with memory and perception is the heart of the proposal.
      - text: "A new argument for God from the beauty of nature."
        feedback: |
          Beauty may be the circumstance that triggers the belief, but the point is that no argument is involved: the belief arises directly.
      - text: "A proof that God exists."
        feedback: |
          Plantinga does not offer it as a proof. It is a model of how belief in God could be rational and warranted if God exists.
      - text: "A feeling that has no connection to the world."
        feedback: |
          The model says the opposite: the faculty is a belief-forming mechanism, which, if it works properly, connects us to the truth about God.
    explanation: |
      Keep the layers apart. That Plantinga proposed this model is fact. Whether such a faculty exists is, for believers, a matter of faith commitment, and for sceptics a question to explain differently, for example by the cognitive science of religion (see the lesson The Same Argument Against Atheism).

  - type: text
    id: pumpkin
    title: "The Great Pumpkin objection"
    body: |
      If belief in God may be basic without argument, critics ask, why not anything? The standard form of the worry uses a deliberately silly example: a person says that the Great Pumpkin returns every Halloween, and holds this directly too. If Plantinga's proposal lets belief in God count as properly basic, it seems to let the Great Pumpkin in, and then nothing is left to tell good basic beliefs from bad. Plantinga stated this **Great Pumpkin objection** himself, in "Reason and Belief in God".

      A harder version is due to Michael Martin: if each religious community may treat its own central beliefs as properly basic, many communities with incompatible beliefs would be equally entitled to do so. According to the Internet Encyclopedia of Philosophy, Plantinga himself named it the "Son of Great Pumpkin" objection.

  - type: mcq
    id: pumpkin-q
    title: "A reply to the Great Pumpkin"
    prompt: |
      Which is Plantinga's reply, in essence?
    options:
      - text: "Giving up the classical criteria does not mean there are no criteria: we learn what is properly basic from clear cases, and a basic belief is still open to defeat."
        correct: true
        feedback: |
          Yes. He compares this to how Descartes and Locke could hold that some beliefs are basic without saying that just any belief is. We can tell clear cases from clear non-cases, as we can tell that "'Twas brillig" is nonsense without a complete theory of meaning (an example the Internet Encyclopedia of Philosophy reports).
      - text: "The Great Pumpkin belief is basic too, and that is no problem."
        feedback: |
          Plantinga does not accept the Great Pumpkin belief as properly basic. He denies that his view forces this.
      - text: "Belief in God is basic because everyone believes it."
        feedback: |
          Plantinga does not rest his case on how many people believe. The claim is about the faculty that produces the belief and the circumstances.
      - text: "Beliefs are properly basic only if science confirms them."
        feedback: |
          This would make them depend on evidence, which is exactly the classical view he rejects.
    explanation: |
      A critic can answer that the reply leaves the line between good and bad basic beliefs unclear, and that the clear cases are exactly where the communities disagree. Zagzebski, according to the Internet Encyclopedia of Philosophy, presses the principle that if a belief is rational, its rationality should in principle be recognisable by rational people in other cultures. Plantinga's side replies that this principle is itself in question. Thoughtful people part ways here.

  - type: text
    id: defeaters
    title: "Properly basic, but open to defeat"
    body: |
      Properly basic does not mean untouchable. A **defeater** is something that, once you meet it, gives you reason to give up a belief. Example (ours): you remember parking on the third floor, and a friend who was with you says, "No, we parked on the second." Your memory is basic, but the friend's report is a defeater. If you then find your car on the second floor, the belief is gone. If instead you find a ticket stamped "third floor" in your pocket, that is a **defeater-defeater**: it takes away the force of the defeater and restores the belief.

      According to the Internet Encyclopedia of Philosophy, Plantinga says the same of belief in God: it is properly basic but open to defeat. If a defeater arises, the belief must be dropped unless a defeater-defeater restores it. What counts as a defeater, such as the problem of evil or conflicts with science, is where critics and believers contest, and the lessons on those topics take up the cases.

  - type: mcq
    id: defeater-q
    title: "Which is the defeater?"
    prompt: |
      Raj believes he locked the door. Later his flatmate says, "I came in and the door was open." Which statement fits?
    options:
      - text: "The flatmate's remark is a defeater for Raj's belief, which was basic (from memory). Raj should check, and if he finds a record of locking it, that record would be a defeater-defeater."
        correct: true
        feedback: |
          Yes. A basic belief can be rationally held and still lose that status when a defeater arrives. Which defeater is strong enough is a judgement.
      - text: "Raj's belief was irrational all along, because he had no argument."
        feedback: |
          That is the classical view Plantinga disputes. Memory beliefs are held without argument and are not irrational.
      - text: "A basic belief can never be given up."
        feedback: |
          The opposite. Being properly basic means rational to hold directly, not immune from evidence against it.
      - text: "The flatmate's remark is irrelevant because Raj remembers clearly."
        feedback: |
          Clear memory is not immune from being wrong. Treating all felt certainty as immune would make defeaters impossible.
    explanation: |
      This is why the view is not a licence to believe anything: a belief held basically stays answerable to later evidence. Critics ask how strong that constraint is in religious cases, and that is the live debate.

  - type: text
    id: warrant
    title: "Warrant and externalism"
    body: |
      Recall from the lesson What Is Knowledge? that an **internalist** holds that what makes a belief justified is something the believer can reach by reflection (evidence, reasons), while an **externalist** allows facts outside the believer's view, such as whether the belief was produced reliably.

      Plantinga's name for what turns true belief into knowledge is **warrant**. According to *Warranted Christian Belief* as the Internet Encyclopedia of Philosophy reports it, a belief has warrant when it is produced by cognitive faculties functioning properly, in the environment they were designed for, according to a design plan aimed at truth, with a high chance of yielding true beliefs. This is an **externalist** account: whether your belief has warrant depends on facts you may be unable to check, such as whether your faculties are working properly.

      That is why Plantinga holds that whether belief in God has warrant depends on whether it is true: if there is a God who made us with a *sensus divinitatis* aimed at truth, the belief can have warrant, and if not, it does not. Critics reply that this makes the question of rationality collapse into the question of truth, so it cannot serve as a neutral defence. Defenders reply that this is just what externalism means.

  - type: mcq
    id: warrant-q
    title: "Same evidence, different warrant"
    prompt: |
      Two people, Ana and Ben, both firmly seem to remember eating breakfast. Ana's memory works normally. Ben has taken a drug that creates vivid false memories, and he did not eat. Their inner experience is the same. How would an externalist about warrant such as Plantinga and an internalist about justification differ?
    options:
      - text: "The internalist says they are equally justified, since their reasons and experience are the same. Plantinga says only Ana's belief has warrant, since only her faculty is working properly."
        correct: true
        feedback: |
          Yes. This is the point of the contrast: the internalist looks at what is available to the believer, the externalist at how the belief was produced.
      - text: "Both say that Ben is better off, since he is more certain."
        feedback: |
          Nothing in the case says that Ben is more certain. And neither view equates certainty with justification or warrant.
      - text: "Both say that neither belief is rational, since neither has an argument."
        feedback: |
          Both can allow memory to be basic. The difference is about how to judge the two cases.
      - text: "Plantinga says both have warrant, because both believe sincerely."
        feedback: |
          Sincerity is not warrant. Ben's faculty is not working properly, so his belief lacks warrant on Plantinga's account.
    explanation: |
      The example uses memory, not religion, on purpose: the distinction is general. The religious question is then whether belief in God is more like Ana's case or like Ben's, and that question is where the debate over the *sensus divinitatis* sits.

  - type: mcq
    id: layers-q
    title: "Fact, debate or commitment?"
    prompt: |
      Sort the statement "Plantinga held that belief in God can be properly basic, grounded in circumstances and not inferred from arguments" among the three layers.
    options:
      - text: "Established fact: it reports what Plantinga argued, checkable in his texts."
        correct: true
        feedback: |
          Yes. Whether he was right is another question: whether the criteria fail is debate, and whether there is a *sensus divinitatis* is, for many, a matter of commitment.
      - text: "Live debate: scholars disagree about whether he said it."
        feedback: |
          They disagree about whether his view succeeds, not about whether he held it.
      - text: "Faith commitment: it depends on one's religion."
        feedback: |
          Reporting a position does not depend on one's religion. Accepting it might.
      - text: "None: it is a mere opinion."
        feedback: |
          It is a report of a documented position.
    explanation: |
      Keep the three separate: what he argued is fact, whether the classical criteria fail is debate, whether God exists is a commitment that this lesson neither assumes nor decides.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** On whether classical foundationalism is refuted by its own test; on whether the Great Pumpkin reply separates good basic beliefs from bad ones; on whether warrant depends on the truth of the belief, which sceptics say begs the question and Plantinga's side says is what externalism means; and on whether there is a *sensus divinitatis* at all. Open: none of these has a settled answer.

      **Next:** the lesson Will to Believe: James and Pascal asks a different question. Even if evidence cannot settle the matter, may we choose to believe because of what is at stake?
