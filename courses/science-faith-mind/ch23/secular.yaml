id: ch23-secular
title: "Secularism, Church and State"
kind: concept
own: |
  The setting: people in one country hold different, often incompatible, religious and non-religious beliefs, and the state makes laws that bind all of them. Every state must therefore decide how it relates to religion. Each model below is told *according to* the people who hold it.
  - **Five terms.** *Separation*: religious bodies and state institutions are kept apart in funding and authority. *Establishment*: the state officially backs one religion, for instance by naming it as the state religion or paying its clergy. *Neutrality*: the state does not take sides among religions, or between religion and non-religion, which can be read as treating all alike or as keeping out of religion altogether. *Secularism* is a political doctrine about this relation; *secularity* (Charles Taylor's term) is a condition of society, discussed in the last bullet.
  - **France.** According to the 1905 law on the separation of Churches and State, {{ the Republic neither recognises, pays nor subsidises any religion }}, while guaranteeing freedom of conscience. Alsace-Moselle keeps an older arrangement. A 2004 law bars conspicuous religious symbols for pupils in public primary and secondary schools. Defenders see a reassertion of neutrality in schools; critics say it stigmatises Muslim pupils and treats some citizens as outsiders.
  - **United States.** The First Amendment (ratified 1791) says that Congress shall make no law respecting an establishment of religion (the *Establishment Clause*) or prohibiting its free exercise (the *Free Exercise Clause*). *Separationists* read it as {{ a high wall between church and state }} (Jefferson's 1802 phrase, used in *Everson v. Board of Education*, 1947). *Accommodationists* hold that the state may make room for religious practice and is not required to be hostile to religion.
  - **Turkey.** Atatürk's *laiklik* removed Islam as the state religion (1928) and wrote secularism into the constitution (1937), but it works by {{ state control of religion }}: the Presidency of Religious Affairs (*Diyanet*, founded 1924) administers Islam. Later governments moved toward more public religion, as in the 2020 conversion of the Hagia Sophia from museum to mosque.
  - **India.** According to Rajeev Bhargava, Indian secularism is {{ principled distance }}: not a strict wall but an equal respect for all faiths, with the state intervening in or staying out of religion as the principle of equal respect requires. Personal laws (marriage, divorce, inheritance, by religious community) are its hardest case.
  - **Islamic states.** They range from a constitutional role for the sharia (Islamic law) as in Saudi Arabia, Iran or Egypt's "main source of legislation" clause, to Indonesia's Pancasila belief in one God without any named state religion. Each is described as its own holders describe it.
  - **Locke.** In his *Letter Concerning Toleration* (written in exile in 1685-86, published 1689), John Locke argued in essence that {{ force cannot produce belief, so the magistrate has no business with the care of souls }}, and that churches are voluntary societies. He excluded atheists, and probably Catholics, from toleration.
  - **Rawls.** In *Political Liberalism* (1993) John Rawls (1921-2002) argued that, given reasonable disagreement, political power is legitimate when it rests on *public reason* (reasons all citizens can share, not one doctrine) and on an *overlapping consensus*: {{ each citizen endorses the same political conception of justice from within their own doctrine }}.
  - **Critics.** Jürgen Habermas allows religious language in informal public debate but asks that it be translated into secular terms in formal state decisions. Charles Taylor distinguishes the public sphere emptied of religion, the decline of belief, and a condition in which belief is one option among others. Talal Asad argues that the secular is not a neutral successor to religion but a category with its own history.
  - **Three layers.** Fact: what each law and book says. Debate: whether neutrality is possible and whether strict separation protects or burdens religion. Commitment: how much public weight one's own convictions should carry.

cards:
  - type: text
    id: hook
    title: "The same scarf, four official answers"
    body: |
      A girl walks into a public school wearing a headscarf. A boy wears a small cross. A coach kneels to pray after the match and some players join him. Three small scenes, one question: what may the state allow, forbid or itself do about religion?

      Different countries give different official answers, and each answer has a serious argument behind it. Before any theory, a guess. Guessing first is the point. The lesson sets out the main models, in the words of the people who defend them, and then the arguments of Locke, Rawls and their critics.

  - type: mcq
    id: guess
    title: "Guess: which country?"
    prompt: |
      Since 2004 one of these countries has had a national law forbidding pupils in public primary and secondary schools from wearing conspicuous religious symbols. Which one?
    options:
      - text: "France."
        correct: true
        feedback: |
          Yes. The law is Law 2004-228 of 15 March 2004, in force from September 2004. It bears on pupils in public schools, not on universities or private schools.
      - text: "The United States."
        feedback: |
          No. American public schools generally let pupils wear religious dress, because the First Amendment protects free exercise; the argument there is about what the *school* may do, such as lead prayer.
      - text: "India."
        feedback: |
          No. India's constitution guarantees every person the right to practise their religion, subject to public order, morality and health.
    explanation: |
      The French answer comes from a particular idea of how the state should relate to religion. The rest of the lesson meets that idea and its rivals.

  - type: text
    id: terms
    title: "Five words, five meanings"
    body: |
      Debates about church and state go wrong when the words slide. Here is how this lesson uses them.

      | Word | Meaning |
      |---|---|
      | Separation | Religious bodies and state institutions are kept apart in funding and authority |
      | Establishment | The state officially backs one religion, for instance by naming it the state religion or paying its clergy |
      | Neutrality | The state takes no side among religions, or between religion and non-religion |
      | Secularism | A political doctrine about how state and religion relate |
      | Secularity | A condition of a society, such as how much belief there is and how it is lived |

      Two cautions. Neutrality is read in two ways: *even-handed* (treat every faith alike, funding or helping all) or *hands-off* (do not touch religion at all). And a state can be separate from religion without being neutral in the first sense, which the cases below show.

  - type: text
    id: france
    title: "France: laïcité"
    body: |
      France's model is called *laïcité*. Its base is the law of 9 December 1905 on the separation of the Churches and the State. Article 2 says that the Republic ne reconnaît, ne salarie ni ne subventionne aucun culte: it neither recognises, pays nor subsidises any religion. The same law guarantees freedom of conscience and the free exercise of worship. The law does not apply in Alsace and Moselle, where an older arrangement between state and churches remains.

      In 2004 a further law banned conspicuous religious symbols for pupils in public primary and secondary schools. Supporters described it, in the words of one analyst, as a narrow reassertion of religious neutrality in public schools. Critics point out that many democracies, including the United States, let pupils wear such symbols. Critics add that it stigmatises Muslim pupils and treats them as outsiders. So the same law is read as protecting neutrality or as breaching it, depending on what neutrality is taken to mean.

  - type: mcq
    id: france-q
    title: "France: what does Article 2 do?"
    prompt: |
      According to the 1905 law, which description fits what the French state does about worship?
    options:
      - text: "It neither recognises, pays nor subsidises any religion, while guaranteeing free exercise."
        correct: true
        feedback: |
          Yes. Separation is in the funding and recognition, and freedom of worship is kept.
      - text: "It names one church as official and pays its clergy."
        feedback: |
          That is *establishment*, the arrangement the 1905 law ended.
      - text: "It forbids private worship so that public life is free of religion."
        feedback: |
          No. The law guarantees free exercise; the 2004 law bears on pupils' symbols in public schools, not on private worship.
    explanation: |
      Defenders of laïcité say a common public space needs neutral rules. Critics reply that rules framed as neutral may fall unevenly on minorities. Both agree on what the text says; they differ on whether it is applied fairly.

  - type: text
    id: us
    title: "United States: two clauses"
    body: |
      The First Amendment, ratified on 15 December 1791, opens: "Congress shall make no law respecting an establishment of religion, or prohibiting the free exercise thereof." The first half is the *Establishment Clause*, the second the *Free Exercise Clause*. Since *Everson v. Board of Education* (1947) the Establishment Clause also binds the states.

      Two readings compete. *Separationists* start from Jefferson's 1802 letter to the Danbury Baptists, which speaks of "a wall of separation between church and State"; *Everson* said the wall must be kept high. They argue that keeping the state out of religion also protects religion from the state. *Accommodationists* hold that the state may make room for private religious practice, that the Free Exercise Clause can require this, and that the Constitution does not demand hostility to religion (the Court said so in *Zorach v. Clauson*, 1952). In 1985 Justice Rehnquist argued that the Framers did not intend the wall that *Everson* constitutionalised. In *Kennedy v. Bremerton School District* (2022) the Court held that a public school coach could pray at midfield after games, a ruling commentators read as a step toward the accommodationist side.

  - type: mcq
    id: us-q
    title: "United States: which reading?"
    prompt: |
      A defender of the wall of separation says: "A state that pays for or leads prayer, even mildly, has taken a side, and so religion itself is put at risk." Which clause and reading is this?
    options:
      - text: "The Establishment Clause, read in the separationist way."
        correct: true
        feedback: |
          Yes. It treats any state backing of religion as a breach, and says separation protects religion too.
      - text: "The Free Exercise Clause, read in the accommodationist way."
        feedback: |
          Free exercise protects an individual's right to practise. The speaker is warning against state action, which is the Establishment Clause's concern.
      - text: "Neither: the United States has an established church."
        feedback: |
          It does not. The Establishment Clause was written to prevent a national church, and *Everson* extended it to the states.
    explanation: |
      An accommodationist replies that allowing a coach's private prayer, or a school's equal access for religious clubs, is not backing a faith but leaving room for it. The two sides read the same two clauses with different weights.

  - type: text
    id: turkey
    title: "Turkey: laiklik and the state"
    body: |
      Turkey's *laiklik* (from the French *laïcité*) belongs to the republic founded by Mustafa Kemal Atatürk. The 1924 constitution named Islam as the state religion; a 1928 amendment removed that clause, and "laicism" was added in 1937. At the same time the state set up the Presidency of Religious Affairs, the *Diyanet*, on 3 March 1924, to administer Islamic faith and worship. Analysts therefore call the model "active neutrality": separation in law, but with the state regulating and organising religion.

      According to its defenders, this protected a modernising republic from clerical power. According to critics, it put religion under state control and restricted believers: restrictions on the headscarf were applied sharply after the 1997 military memorandum and were lifted for public employees in 2013. Later governments moved toward more public religion. On 10 July 2020 the president converted the Hagia Sophia, a museum since 1931, into a mosque; some analysts, such as Ahmet Kuru, read this as a change from assertive secularism to populist Islamism, while supporters saw a reversal of an earlier imposition.

  - type: mcq
    id: turkey-q
    title: "Turkey: what is distinctive?"
    prompt: |
      What mainly separates the Turkish model from the French one, according to those who study both?
    options:
      - text: "The Turkish state organises and funds the administration of one religion (Islam) through the Diyanet, while claiming secularism."
        correct: true
        feedback: |
          Yes. Separation of religion from political authority goes with state control of religion, which is why analysts use the phrase "active neutrality".
      - text: "Turkey never separated state and religion."
        feedback: |
          It did: Islam ceased to be the state religion in 1928 and secularism entered the constitution in 1937. The debate is about the kind of separation.
      - text: "Turkey has a state church that all citizens must join."
        feedback: |
          No. The Diyanet administers Islam; it is not a compulsory membership body.
    explanation: |
      A defender of the Turkish model says a state that controls religion prevents it from controlling the state. A critic says control and neutrality do not go together, since the state is itself acting on religion.

  - type: text
    id: india
    title: "India: principled distance"
    body: |
      India's constitution guarantees freedom of conscience and the right to profess, practise and propagate religion (Article 25), subject to public order, morality and health. The word "secular" was added to the Preamble by the 42nd Amendment in 1976, and the Supreme Court has treated secularism as part of the constitution's basic structure; in November 2024 it dismissed a challenge to the 1976 insertion.

      The political theorist Rajeev Bhargava calls the model *principled distance*. In his account, the Indian state does not build a strict wall. It treats all faiths with equal respect, and sometimes it stays out of religion and sometimes it steps in, according to what equal respect and equal freedom require. For example, it cannot tolerate untouchability, and it cannot leave all personal laws as they are. Personal laws, which give each religious community its own rules on marriage, divorce and inheritance, are the model's hardest case. Defenders see a way to respect diverse communities; critics see inconsistency, since the state both keeps some religious law and reforms some, and some call for a uniform civil code.

  - type: mcq
    id: india-q
    title: "India: separation or distance?"
    prompt: |
      According to Bhargava, how does the Indian state differ from a strict wall of separation?
    options:
      - text: "It may intervene in religious matters, or hold back, depending on what equal respect for all faiths requires."
        correct: true
        feedback: |
          Yes. The test is a principle, equal respect, not a fixed rule of non-involvement.
      - text: "It supports Hinduism as the state religion but tolerates others."
        feedback: |
          No. The constitution names no state religion and treats all faiths equally in principle. Critics sometimes say practice falls short, which is a different claim.
      - text: "It keeps every religious matter out of law, including marriage."
        feedback: |
          No. Personal laws, which are religious-community rules on marriage and inheritance, remain, which is why they are the hardest case.
    explanation: |
      A critic from the strict separationist side says principled distance gives the state too much discretion. A defender replies that a wall would leave inequalities inside religions untouched.

  - type: text
    id: islamic
    title: "Islamic states: a range, not one model"
    body: |
      States with a Muslim majority arrange the relation differently, and the holders of each arrangement describe it in their own terms.

      Saudi Arabia's Basic Law of Governance (1992) states that its constitution is the Book of God and the Sunnah of His Messenger, the Qur'an and the Prophet's traditions. Iran's constitution (adopted by referendum in December 1979, amended 1989) makes the sharia the standard for laws and sets up guardianship by a leading Islamic jurist (*velayat-e faqih*) and a Guardian Council of jurists to check laws against Islamic criteria. Egypt's constitution (2014) says the principles of the Islamic sharia are the main source of legislation, which makes sharia a reference for law without making it the whole of law. Indonesia rests on Pancasila, whose first principle is belief in the One and Only God; sources say it names no state religion and leaves open how "one God" is read.

      Defenders of constitutional roles for the sharia say a believing community may reasonably want its law to follow its faith. Critics argue that this risks coercing believers and minorities, and Muslim writers can be found on both sides of the question.

  - type: mcq
    id: islamic-q
    title: "Islamic states: match the text"
    prompt: |
      A constitution says that the principles of the Islamic sharia are "the main source of legislation", so Islamic law guides lawmaking, but the text sets up no ruling jurist. Which country's article does that describe (Egypt 2014, Iran 1979 or Indonesia's Pancasila)?
    options:
      - text: "Egypt (Article 2 of the 2014 constitution)."
        correct: true
        feedback: |
          Yes. Sharia is a main reference for legislation, without a body of jurists over the government.
      - text: "Iran."
        feedback: |
          Iran's constitution does set up a ruling jurist (*velayat-e faqih*) and a Guardian Council of jurists, which is a stronger arrangement.
      - text: "Indonesia."
        feedback: |
          Indonesia's first Pancasila principle is belief in one God; it does not name sharia as the source of law nor any state religion.
    explanation: |
      The range runs from constitutional supremacy of sharia, through sharia as a main source of law, to a one-God principle with no named religion. Calling all of these "the Islamic model" hides that range.

  - type: mcq
    id: sort
    title: "Sort the model"
    prompt: |
      Match the description to the country. "The state keeps a distance from all religions in principle, but steps in where equal respect requires, including in religious personal laws."
    options:
      - text: "India."
        correct: true
        feedback: |
          Yes: principled distance, with personal laws as the hard case.
      - text: "France."
        feedback: |
          France's model is separation by the 1905 law (no recognition, pay or subsidy), with a strict neutrality in public schools, not distance with personal laws.
      - text: "Turkey."
        feedback: |
          Turkey separates religion from political authority but organises Islam through the Diyanet,.
      - text: "The United States."
        feedback: |
          The US debates wall against accommodation under two clauses; it has no system of religious personal laws.
    explanation: |
      A good habit is to ask of any country two things: what the state refuses to do for religion, and what it does to religion. The answers differ, and the models differ with them.

  - type: text
    id: locke
    title: "Locke's case for toleration"
    image:
      src: img/locke.webp
      alt: "Painted portrait of John Locke in plain dark clothing, by Godfrey Kneller, 1697"
      caption: "John Locke (1632-1704), painted by Godfrey Kneller in 1697; his Letter Concerning Toleration was written in Latin in exile in the winter of 1685-86 and published in 1689."
      credit: "Godfrey Kneller, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:%27John_Locke%27_by_Godfrey_Kneller,_1697,_Hermitage.JPG"
    body: |
      John Locke (1632-1704) wrote his *Letter Concerning Toleration* in Latin in Holland in the winter of 1685-86 (dated 1685 in some accounts), soon after France revoked the Edict of Nantes, and it appeared in 1689. In essence, he argued from the nature of belief and of government.

      The magistrate (the ruler) has only one tool, force. But true religion, Locke held, lives in inward persuasion of the mind, and force cannot persuade. So forcing a faith cannot bring anyone to the true one. Neither God nor the consent of the people entrusted the care of souls to the magistrate, since people cannot choose to believe at will and so could not have handed that power over. And rulers themselves hold many different religions, so a rule to enforce the ruler's faith would not reliably advance the true one. Churches, for Locke, are voluntary societies, with no power of force over their members or outsiders.

      The Letter has limits. Locke would not tolerate atheists, because he thought they could not be bound by promises and oaths. Many readers add Catholics, who owed allegiance to a foreign prince, though some scholars argue that he left them room if they renounced that allegiance. His case is a founding argument for separation, resting on the claim that belief cannot be commanded.

  - type: order
    id: locke-order
    title: "Locke's argument in order"
    prompt: |
      Put Locke's main argument, in essence, in order.
    steps:
      - "True religion is a matter of inward persuasion of the mind."
      - "The magistrate's only tool is force."
      - "Force cannot produce inward persuasion, so it cannot bring anyone to the true religion."
      - "So the care of souls was not given to the magistrate, and he should not enforce a faith."
    hint: |
      Start with what religion is, then what the ruler can do, then compare.
    explanation: |
      The argument is valid, and a critic must deny a premise. One critic's route: force might still shape habits and conditions under which belief later arises. Another: the argument covers belief but not public acts such as worship in public. Locke's exclusion of atheists shows his own limit.

  - type: text
    id: rawls
    title: "Rawls: public reason"
    body: |
      The lesson *Religious Pluralism: Many Faiths, One Truth?* looked at three answers to the question of how the traditions' claims relate. The state faces a different question: given that thoughtful people do disagree, on what grounds may it use force against all of them?

      John Rawls (1921-2002), in *Political Liberalism* (1993), answered in essence like this. In a free society there is *reasonable pluralism*: many religious, moral and philosophical doctrines, each of which accepts toleration and democratic essentials. Rawls calls the difficulty of judging deep questions the *burdens of judgment*, since conscientious people reach different answers from different lives. So the state's coercive power is legitimate only if it can be justified by *public reason*: reasons and standards citizens can share, not the doctrine of one group. This is a duty of civility for officials, judges and legislators, not a legal rule. Rawls allows religious language in public debate if the claims can also be backed by public values (the proviso; the example discussed is Lincoln's use of biblical language against slavery).

      Stability comes from an *overlapping consensus*: each citizen endorses the same political conception of justice from within their own doctrine, a believer for religious reasons, a secular citizen for others. Rawls contrasts this with a *modus vivendi*, a truce that holds only while the balance of power does.

  - type: mcq
    id: rawls-q
    title: "Overlapping consensus or truce?"
    prompt: |
      Two groups agree to tolerate each other only because neither is strong enough to win. If one grows stronger, the tolerance ends. In Rawls's terms, which is this?
    options:
      - text: "A *modus vivendi*, a truce that depends on the balance of power."
        correct: true
        feedback: |
          Yes. An overlapping consensus would hold because each group endorses toleration from within its own beliefs, whatever the balance of power.
      - text: "An overlapping consensus."
        feedback: |
          In an overlapping consensus, each group backs the shared principles for reasons of its own, so strength would not decide. Here only the balance of power keeps the peace.
      - text: "Public reason."
        feedback: |
          Public reason concerns how political power is justified (reasons all can share), not why groups keep a peace.
    explanation: |
      Critics ask whether religious citizens can really split their reasons in two. Rawls's reply is that the proviso lets them speak in their own terms, provided they can also show public grounds.

  - type: text
    id: critics
    title: "Critics: translation, condition and genealogy"
    body: |
      Jürgen Habermas, who responded to Rawls, set out an "institutional translation proviso" in a 2006 essay: citizens may use religious language in informal public debate, but must have it translated into secular terms in the formal decisions of the state. Critics argue that a translation demand is itself not neutral, and some propose two-way translation, in which secular citizens also work to understand religious reasons.

      Charles Taylor (b. 1931), in *A Secular Age* (2007), separates three senses of "secular". The first is the retreat of faith from public life. The second is a decline of belief and practice among individuals. The third, the one he studies, is a condition of experience in which belief and unbelief are both real options. A state can be secular in the first sense while its people are not secular in the second.

      Talal Asad, in *Formations of the Secular* (2003), distinguishes secularism as a political doctrine from the secular as a category, and argues the secular is not a neutral successor to religion nor simply the side of reason, but has a multi-layered history that is tied to modernity.

  - type: mcq
    id: critics-q
    title: "Who says what?"
    prompt: |
      One thinker holds that the secular is not a neutral successor to religion, but a category with its own history. Another distinguishes public secularity, the decline of belief and a condition in which belief is one option among others. Which pair is correct?
    options:
      - text: "Asad for the first, Taylor for the second."
        correct: true
        feedback: |
          Yes. Asad's genealogy of the secular and Taylor's three senses.
      - text: "Taylor for the first, Asad for the second."
        feedback: |
          Reversed. Taylor's three senses (public sphere, decline of belief, condition of belief as an option) match the second description; Asad's history of the category matches the first.
      - text: "Rawls for the first, Habermas for the second."
        feedback: |
          Rawls is about the justification of political power by public reason, and Habermas about translating religious reasons for formal decisions; neither is the claim described.
    explanation: |
      The two views serve different aims. Taylor describes how belief is lived in a secular age. Asad asks whether the idea of the secular carries assumptions that a neutral state should not inherit. A believer, a secularist and an agnostic can each learn from both.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Match the statement to its layer. "A state should keep its laws free of reasons that only members of one religion can accept."
    options:
      - text: "Faith or metaphysical commitment, backed by arguments such as Rawls's that are themselves debated."
        correct: true
        feedback: |
          Yes. It is neither a datum nor a consensus. It rests on a view of legitimacy and of what citizens owe each other, which defenders and critics argue about.
      - text: "Established fact."
        feedback: |
          It is a normative claim about what states should do, not a record of what any state does. What states do, such as France's 1905 law, is the fact layer.
      - text: "Scholarly consensus."
        feedback: |
          Scholars disagree widely: Habermas, Taylor and Asad each qualify it differently.
    explanation: |
      Fact: what each law and book says. Debate: whether neutrality is possible and whether strict separation protects or burdens religion. Commitment: how much public weight one's own convictions should carry.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the lesson on *Fundamentalism and Religious Politics* asks what happens when religious groups organise to shape the state, and how scholars tell that from ordinary religious conviction.
