id: ch23-atheism
title: "Atheism, Agnosticism and Nonbelief"
kind: concept
own: |
  The setting: let $G$ be the statement "God exists" (the God of classical theism, as in the earlier levels) and $E$ all the evidence a person has. Each view below is told *according to* the people who hold it, and the lesson asks what separates the kinds of nonbelief, not which is right.
  - **Two questions, not one.** According to the Stanford Encyclopedia of Philosophy, **theism** is the proposition that $G$ is true, **atheism** is either lacking the belief in $G$ (the psychological sense) or the proposition that $G$ is false (the sense philosophers usually use), and **agnosticism** is the view that neither theism nor atheism is known. So a person answers a *belief* question (do I believe $G$?) and a *knowledge* question (do I claim to know whether $G$?), and the four cells are {{ **agnostic atheist, gnostic atheist, agnostic theist, gnostic theist** }}.
  - **Words with a date.** Thomas Henry Huxley (1825 to 1895) coined {{ **agnostic** }} in 1869 (according to Britannica, at the Metaphysical Society in London; the exact occasion is disputed) as a rule of method: do not claim conclusions that are not demonstrated. Antony Flew (1923 to 2010), in a 1972 paper, argued for a {{ **presumption of atheism** }}, by analogy with the presumption of innocence in law; theists reply that belief in God can be reasonable without a prior argument.
  - **The oldest argument.** Epicurus (341 to c. 270 BCE) held that gods exist but do not care about us; the four questions called Epicurean are attributed to him (the attribution is uncertain) and are quoted by Philo in Hume's *Dialogues* (published 1779). With $A$ = "the being is able to prevent evil", $W$ = "the being is willing to prevent evil" and $V$ = "evil exists", the core is
    {{ $$(A\land W)\Rightarrow\lnot V$$ }}
    and since $V$ holds, at least one of $A$, $W$ fails. Replies deny the bridge or give a greater good.
  - **Russell and Dawkins.** Bertrand Russell (1872 to 1970) said that to a philosophical audience he would call himself an agnostic and to the person in the street an atheist, because he found the Christian God no more probable than the Homeric gods. Richard Dawkins puts the same attitude on a seven-point scale of probability, where point 6 is a *de facto* atheist who thinks God very improbable but not impossible.
  - **Other kinds.** William Rowe (1979) sorted atheists as *friendly* (God does not exist, yet some theists are rationally justified), *unfriendly* (no theistic belief is justified) and *indifferent*. **Apatheism** is {{ a disinclination to care whether gods exist }} (Jonathan Rauch, 2003). **Ignosticism** (Sherwin Wine, 1964) holds that the question is premature because the word "God" lacks a clear meaning.
  - **Burden of proof.** The presumption fixes where one starts, not where one ends. In the odds form of Bayes' rule
    {{ $$\frac{P(G\mid E)}{P(\lnot G\mid E)}=\frac{P(E\mid G)}{P(E\mid\lnot G)}\times\frac{P(G)}{P(\lnot G)}$$ }}
    the last factor is the starting odds and the first is how well each side explains $E$. Both sides owe reasons for their likelihoods.
  - **Three layers.** Fact: who coined or wrote what, and when. Debate: which default stance is neutral, and how strong the best arguments are. Commitment: whether $G$ is true.

cards:
  - type: text
    id: hook
    title: "Four answers to one question"
    body: |
      At a dinner four friends are asked: "Do you believe in God?"

      Ava says: "No. I have never really thought about it." Ben says: "No. I have read the arguments and I am sure there is no God." Cai says: "No. I do not know, and I think nobody can know." Dee says: "No. But I could not honestly say I know there is no God."

      Before any definitions, a guess. Guessing first is the point of this lesson, and the lesson tells each view as the people who hold it would tell it, so that a believer and a nonbeliever could both say "that is fair".

  - type: mcq
    id: guess
    title: "One position or several?"
    prompt: |
      Ava, Ben, Cai and Dee all answered "No" to "Do you believe in God?". How many different positions do their full answers express?
    options:
      - text: "At least three: they differ in what they claim (Ben denies God, Cai claims nobody can know, Ava has no view at all) and in how sure they are."
        correct: true
        feedback: |
          Yes. The single word "no" hides several claims. Ben asserts something about reality, Cai asserts something about what can be known, Ava asserts nothing, and Dee withholds belief without claiming to know.
      - text: "One: they all say no, so they are all atheists of the same kind."
        feedback: |
          They share an answer to one question, but their reasons and claims differ. Ben says "no God" is true, which is a claim that needs support; Ava makes no claim at all.
      - text: "Two: atheists and agnostics, and nothing else."
        feedback: |
          That sorting is common, but it mixes two different questions (what you believe, and what you claim to know). The next cards separate them, and more kinds appear.
    explanation: |
      The lesson sorts these answers by two questions and then looks at the history of the main kinds and the best argument each offers. Where thoughtful people part ways: how to use the word "atheist" at all, since the same word is used for Ava and for Ben.

  - type: text
    id: defs
    title: "Three words, defined"
    body: |
      Take $G$ to mean "God exists" (the God of classical theism, as in the lesson "What Is Being Argued For?"). According to the Stanford Encyclopedia of Philosophy (SEP):

      - **Theism** is the proposition that $G$ is true.
      - **Atheism** has two senses. In the *psychological* sense it is lacking the belief that $G$ is true, which fits Ava. In the *metaphysical* sense it is the proposition that $G$ is false, which fits Ben. The entry says the second sense is the one philosophers standardly use.
      - **Agnosticism**, in the epistemological sense, is the view that neither theism nor atheism is known (or has some other positive epistemic status), which fits Cai.

      In debates the two senses of atheism are often called **weak** (lacking belief) and **strong** (denying $G$), or *negative* and *positive*. The terms are not used the same way by everyone, so check which sense a speaker means. A *gnostic* in this lesson is not an ancient sect: it only means "claims to know".

  - type: text
    id: huxley
    title: "Huxley and the word"
    image:
      src: img/huxley.webp
      alt: "Studio photograph of Thomas Henry Huxley, an older man with white side-whiskers, seated and looking at the camera"
      caption: "Thomas Henry Huxley (1825-1895), the English biologist who coined the word agnostic."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Henry_Huxley_1874.JPG"
    body: |
      The word **agnostic** was coined by the English biologist Thomas Henry Huxley (1825 to 1895). According to Britannica it was first used in public in 1869 at the Metaphysical Society in London. The exact occasion is disputed: the Oxford English Dictionary's earliest citation is a note of 29 May 1869, and Huxley may have used it at an organising meeting on 21 April, while Huxley himself said only that he invented it for that Society.

      He built it from the Greek *a-* ("without") and *gnosis* ("knowledge"). It names a rule of method, not a belief: do not claim a conclusion that has not been shown. So the word was born to answer the *knowledge* question, not to name a third belief about God.

  - type: text
    id: flew
    title: "Flew and the presumption of atheism"
    body: |
      Antony Flew (1923 to 2010) published "The Presumption of Atheism" in the *Canadian Journal of Philosophy*, volume 2, number 1 (1972), pages 29 to 46. According to summaries of the paper, he argued that the debate about God should start, like a trial, from a presumption: as the law presumes innocence until guilt is shown, we should presume the *negative* atheist position, that of someone who is simply not a theist, until reasons are given. The burden then falls on the theist. A reply by Donald Evans in the same issue argued that putting the onus on the theist does not exclude the possibility that a theist can meet it with a proof.

      Many agnostics ask for a more even start: "open", not "not believing". Many theists reply that belief in God can be reasonable without a prior argument, as the lesson Reformed Epistemology shows, and that a presumption against it is itself a substantive claim.

  - type: mcq
    id: flew-mcq
    title: "What does the presumption do?"
    prompt: |
      According to Flew's defenders, which statement fits the presumption of atheism best?
    options:
      - text: "It is a rule about where the debate starts and who must give reasons first, much like the presumption of innocence; it does not itself say that God does not exist."
        correct: true
        feedback: |
          Yes. A presumption of innocence does not say the accused is innocent; it says who must produce evidence. The theist can meet the burden, for example by arguments, or deny that the starting point is neutral.
      - text: "It proves that God does not exist, since no evidence has been shown."
        feedback: |
          Not even its defender claims that. Absence of shown evidence is a reason to withhold belief at most; the narrow denial would need its own support.
      - text: "It forces every agnostic to become a theist."
        feedback: |
          The opposite. The presumption protects the stance "I am not convinced", which an agnostic shares.
    explanation: |
      Where thoughtful people part ways: whether "not believing" is the neutral default, and whether the starting point of an argument can be neutral at all. Both questions are about procedure, not about the evidence itself.

  - type: mcq
    id: grid
    title: "Sort by two questions"
    prompt: |
      Two questions separate the four friends and others. The *belief* question: do I believe $G$ ("God exists")? The *knowledge* question: do I claim to know whether $G$? Four people: Ava lacks belief in $G$ and claims no knowledge either way. Ben believes $G$ is false and claims to know it. Dee believes $G$ but admits she does not know it for certain. Gil believes $G$ and claims to know it. Which sorting is right, using the broad sense of atheism (lacking belief)?
    options:
      - text: "Ava: agnostic atheist. Ben: gnostic atheist. Dee: agnostic theist. Gil: gnostic theist."
        correct: true
        feedback: |
          Yes. The first word answers the knowledge question and the second the belief question. Ava and Dee are agnostic because they claim no knowledge; Ava lacks belief, Dee has it.
      - text: "Ava: agnostic. Ben: atheist. Dee: theist. Gil: theist."
        feedback: |
          One word for each answers only one question and loses the difference between Dee and Gil, and between Ava and Cai-like views. Each person needs a label for belief and one for knowledge.
      - text: "Ava: gnostic atheist. Ben: agnostic atheist. Dee: gnostic theist. Gil: agnostic theist."
        feedback: |
          The knowledge labels are swapped. Ben claims to know there is no God, so he is the gnostic atheist; Ava claims nothing, so she is the agnostic one.
      - text: "Dee cannot be a theist, because a theist must be certain."
        feedback: |
          Theism is about belief, not certainty. Many believers call their belief faith and do not claim certain knowledge.
    explanation: |
      Under the narrow sense of atheism, Ava would be an agnostic who is neither theist nor atheist, and the grid would lose a cell. That is a reason many philosophers keep both senses and say which they use. Cai, who says nobody can know, holds a *strong* form of agnosticism; Ava's is *weak*, meaning only "I do not know".

  - type: text
    id: epicurus
    title: "The oldest case: Epicurus and Hume"
    image:
      - src: img/epicurus.webp
        alt: "Marble bust of Epicurus, a bearded man with a thoughtful expression"
        caption: "A Roman marble copy, now in the British Museum, of a lost Greek portrait of Epicurus."
        credit: "ChrisO, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Epicurus_bust.jpg"
        beside: true
      - src: img/hume.webp
        alt: "Painted portrait of David Hume in a brown coat and red cap, by Allan Ramsay"
        caption: "David Hume (1711-1776), Scottish philosopher, in Allan Ramsay's portrait; his Dialogues were published after his death."
        credit: "Allan Ramsay, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Allan_Ramsay_-_David_Hume,_1711_-_1776._Historian_and_philosopher_-_PG_3521_-_National_Galleries_of_Scotland.jpg"
        beside: true
    body: |
      Epicurus (born c. 341 BCE, died c. 270 BCE) taught in Athens in a school called the Garden. According to the Internet Encyclopedia of Philosophy (IEP) he did not deny the gods: he held that gods exist as supremely blessed beings who take no interest in human affairs. The IEP also calls him one of the earliest philosophers we know of to have raised the **problem of evil**, against a providential, loving deity. So the oldest argument often used by nonbelievers comes from someone who was not an atheist in the modern sense.

      The famous four questions are attributed to him, though whether he wrote them is uncertain. David Hume (1711 to 1776) has his character Philo say, in the *Dialogues Concerning Natural Religion* (published after his death, in 1779): "Epicurus's old questions are yet unanswered." They run: "Is he willing to prevent evil, but not able? then is he impotent. Is he able, but not willing? then is he malevolent. Is he both able and willing? whence then is evil?" Philo is the sceptic of the *Dialogues* and is often taken to be the closest to Hume's own view, though scholars read the dialogue form with care.

  - type: order
    id: epicurus-order
    title: "The argument in order"
    prompt: |
      Let $A$ = "a being is able to prevent evil", $W$ = "it is willing to prevent evil" and $V$ = "evil exists". Put the Epicurean argument, as its holders state it, in order.
    steps:
      - 'Bridge: a being that is both able ($A$) and willing ($W$) to prevent evil would prevent it, so $(A\land W)\Rightarrow\lnot V$.'
      - 'Fact: evil exists, so $V$ is true.'
      - 'By modus tollens (deny the result, deny the cause), the conjunction $A\land W$ is false.'
      - 'So the being lacks the ability or the will: it is impotent or malevolent, or there is no such being.'
    hint: "State the general rule first, then the observed fact, then the logical step, then the reading in words."
    explanation: |
      The step from the first two lines to the third is valid. The fight is over the bridge: theists reply that a good being may allow evil for a greater good, or for the sake of free creatures, and ask whether a being can be "able" to remove evil without losing something it values. The holders of the argument answer that some evils seem to serve no such good. This is taught as a guided proof in the lesson "The Logical Problem of Evil"; here it matters as the oldest and most durable reason for nonbelief.

  - type: text
    id: russell
    title: "Russell: agnostic or atheist?"
    image:
      src: img/russell.webp
      alt: "Photograph of the philosopher Bertrand Russell standing in a three-piece suit, 1929"
      caption: "Bertrand Russell (1872-1970), photographed at Caltech in 1929; he told different audiences that he was an agnostic and an atheist."
      credit: "Los Angeles Times, CC BY 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Bertrand_Russell_at_Cal_Tech.jpg"
    body: |
      Bertrand Russell (1872 to 1970) wrote an essay dated 1947, "Am I an Atheist or an Agnostic?". In it he says, in essence, that speaking to a philosophical audience he ought to call himself an agnostic, because he knows of no conclusive argument that proves there is no God. Speaking to an ordinary person, he thinks he ought to say he is an atheist, because he does not consider the Christian God more probable than the gods of Homer.

      In an article written in 1952 for the magazine *Illustrated*, "Is There a God?", Russell used the image of a china teapot orbiting the Sun, too small to be seen. Nobody can disprove it, but no one would say the burden falls on a person who doubts it. His aim was to put the burden of proof on the person who asserts. Critics, among them Alvin Plantinga, reply that the analogy assumes there is no evidence for God, which is what theists dispute.

  - type: mcq
    id: russell-mcq
    title: "One mind, two words"
    prompt: |
      Russell called himself an agnostic to a philosophical audience and an atheist to the person in the street. Which reading is fairest to what he said?
    options:
      - text: "He held one attitude (no proof either way, but the Christian God no more probable than the Homeric gods) and chose the word that would give each audience the right impression."
        correct: true
        feedback: |
          Yes. The state of his mind did not change. "Agnostic" fits the claim that no conclusive disproof exists; "atheist" fits the practical fact that he lives and thinks as if the Christian God does not exist.
      - text: "He changed his mind depending on the audience, so he had no real view."
        feedback: |
          He says the opposite: his view is fixed and the choice of word is a matter of conveying it. The case shows how much the label depends on which question the listener has in mind.
      - text: "He proved that God does not exist, but did not want to say so to philosophers."
        feedback: |
          He says he cannot prove it, which is the reason for the philosophical word. The teapot concerns where the burden of proof lies, not a proof of non-existence.
    explanation: |
      On the two-question grid, Russell answers the belief question "no, in practice" and the knowledge question "I do not claim certainty". The same person can fall under different labels depending on whether a speaker means the narrow or the broad sense of the word.

  - type: text
    id: dawkins
    title: "The modern scientific case, as a scale"
    body: |
      Richard Dawkins, an evolutionary biologist, argued in *The God Delusion* (2006) that the God hypothesis should be judged like any other hypothesis about the world, by evidence and by what it explains. On page 50 he proposes a seven-point scale of belief: 1 is a strong theist ("I do not believe, I know", Dawkins quotes Carl Jung), 4 is completely impartial, 6 is a *de facto atheist* who thinks God very improbable but not impossible, and 7 is a strong atheist who claims to know there is no God. In the book he describes himself as a 6.

      So the case is stated as a *degree of probability*, not as a denial: nature appears to be explained without a designer, and this lowers the chance given to God. A theist replies that there are other kinds of evidence (the beginning of the universe, fine-tuning, experience), which the earlier levels examined, and that the starting probability is not low to begin with.

  - type: mcq
    id: dawkins-mcq
    title: "Which point on the scale?"
    prompt: |
      A person says: "I think God is very unlikely, but I would not say the chance is zero." On Dawkins's seven-point scale (1 = strong theist, 4 = impartial, 7 = strong atheist), which point is this?
    options:
      - text: "6, the *de facto* atheist."
        correct: true
        feedback: |
          Yes. Point 6 is "very low probability, but short of zero". Point 7 would be the claim to know there is no God.
      - text: "7, the strong atheist."
        feedback: |
          Point 7 claims certainty. The speaker explicitly refuses a zero chance.
      - text: "5, leaning towards atheism."
        feedback: |
          Point 5 means a probability lower than a half but not very low. "Very unlikely" is further along.
    explanation: |
      The scale is a one-axis picture of *credence*. It does not capture, by itself, the difference between lacking belief and denying: the person above has a very low credence, not a belief in the denial. That is why the two-question grid and the scale are used together.

  - type: text
    id: args
    title: "Best arguments, and the best replies"
    body: |
      Each kind of nonbeliever offers reasons. The main ones, stated as their holders state them, each with the best reply from the other side:

      - **The problem of evil.** In essence: a being able and willing to prevent evil would do so, and evil exists. *Reply*: free will, or a greater good, or limits on what we can know about God's reasons.
      - **Parsimony, or lack of evidence.** In essence: a claim to existence needs a reason, as with Russell's teapot; without one, withhold belief. The SEP records an Ockham-style version of this (McLaughlin, 1984) and a reply (Morris, 1985) that the same rule would deny intelligent life in distant galaxies we cannot observe. *Reply*: Plantinga says there is evidence for God, and that belief can be properly basic.
      - **Divine hiddenness.** In essence (J. L. Schellenberg): a loving God would make himself evident to anyone open to him, and some open people do not believe. *Reply*: the SEP, summarising Gutting (2013), notes the argument supports at best a *local* atheism, about a particular kind of God.
      - **The naturalist case.** In essence: nature can be explained without a designer, so the God hypothesis is unnecessary. *Reply*: the explanation is incomplete at the beginning of the universe and in its laws, and the *why* question is not answered by physics.

      Who is right is not settled here. The point is that each argument has a form and a weak premise.

  - type: mcq
    id: args-mcq
    title: "Match the reply"
    prompt: |
      A nonbeliever says: "I do not believe in any god, because I have seen no evidence for one, just as I have none for a teapot orbiting the Sun." Which reply does the argument most directly invite?
    options:
      - text: "A theist can say that the teapot case assumes there is no evidence for God, and that is exactly the point in dispute: there are arguments, and belief may be reasonable without one."
        correct: true
        feedback: |
          Yes. The reply targets the premise "no evidence". If there is some evidence, the teapot comparison fails, which is why critics such as Plantinga press it.
      - text: "A theist can say that evil proves there is a God."
        feedback: |
          That is no reply to this argument, and evil is normally used against belief.
      - text: "A theist can say that a teapot cannot be seen, so the nonbeliever has proved God must exist."
        feedback: |
          Nothing follows from an unseen teapot to God. The analogy is about where the burden lies, not about the teapot.
    explanation: |
      The nonbeliever in turn can answer that the arguments offered have been weighed and fall short, which returns the debate to the evidence. This is the pattern of the whole lesson: both sides have a premise they treat as a default.

  - type: text
    id: kinds
    title: "Other kinds of nonbelief"
    body: |
      *Friendly, unfriendly, indifferent.* William Rowe (1931 to 2015), in a paper of 1979, sorted atheists by what they think of theists. A **friendly** atheist holds that God does not exist yet that some thoughtful theists are rationally justified in believing in him. An **unfriendly** atheist holds that no theistic belief is justified. An **indifferent** atheist is neither: a psychological state, not a claim.

      *Apatheism.* Jonathan Rauch used the word in an essay called "Let It Be" in *The Atlantic* in May 2003, for a disinclination to care much about whether gods exist, one's own or others'. It is about importance, not about the truth of $G$.

      *Ignosticism.* Sherwin Wine, a rabbi who founded Humanistic Judaism, coined the word in 1964. An ignostic holds that the question "does God exist?" cannot be answered until the word "God" is given a clear meaning. Paul Kurtz saw the view as consistent with weak atheism and with agnosticism; Theodore Drange separates it from agnosticism, because an agnostic accepts that the sentence is meaningful.

      And the *reasons* differ: some nonbelief starts from a lack of evidence, some from the problem of evil, some from finding the whole idea unclear, and some from indifference.

  - type: mcq
    id: kinds-mcq
    title: "Which kind is which?"
    prompt: |
      Three people. Hal says: "The word 'God' is used so differently that the question has no clear meaning yet." Ida says: "Whether there is a God changes nothing I do, so I do not spend time on it." Jo says: "I think there is no God, but I think a careful believer can be perfectly reasonable." Which sorting is right?
    options:
      - text: "Hal: ignostic. Ida: apatheist. Jo: friendly atheist."
        correct: true
        feedback: |
          Yes. Hal questions the meaning of the question, Ida its importance to her, and Jo, in Rowe's sense, holds a view about God and thinks theists can be justified.
      - text: "Hal: apatheist. Ida: ignostic. Jo: unfriendly atheist."
        feedback: |
          Hal and Ida are swapped, and Jo grants that believers can be reasonable, so Jo is friendly, not unfriendly.
      - text: "Hal: strong agnostic. Ida: weak atheist. Jo: friendly agnostic."
        feedback: |
          A strong agnostic says nobody can know, and Hal says something different: the question is not yet clear. Jo does believe there is no God, so is not an agnostic.
    explanation: |
      Notice that each kind changes a different thing: the meaning of the question (Hal), how much it matters (Ida), how the person views believers (Jo). None of them is simply a stronger or weaker version of the others.

  - type: text
    id: burden
    title: "Who owes the argument?"
    body: |
      A presumption is a rule about where to start. Write $G$ for "God exists" and $E$ for all a person's evidence. Bayes' rule in odds form says
      $$\frac{P(G\mid E)}{P(\lnot G\mid E)}=\frac{P(E\mid G)}{P(E\mid\lnot G)}\times\frac{P(G)}{P(\lnot G)}$$
      The last factor is the **starting odds**; the first is the **likelihood ratio**, how much better $G$ predicts $E$ than $\lnot G$ does. A presumption of atheism sets the starting odds low; a theist who holds belief to be properly basic sets them high, or denies that the question is a matter of odds. Neither has won the argument: the likelihood ratio still has to be argued, and the *narrow* atheist, who says $G$ is false, also makes a claim about reality and owes reasons for it.

  - type: mcq
    id: burden-mcq
    title: "What the presumption settles"
    prompt: |
      Two people have the same evidence $E$ but different starting odds $P(G)/P(\lnot G)$ for "God exists" ($G$). The likelihood ratio $P(E\mid G)/P(E\mid\lnot G)$ is the same for both. What follows from the odds form of Bayes' rule?
    options:
      - text: "Their final odds differ by the same factor as their starting odds, so the debate about the default is a debate about where each starts, and the evidence can still move both in the same direction."
        correct: true
        feedback: |
          Yes. The final odds are the likelihood ratio times the starting odds, so a shared likelihood ratio moves both people the same factor, and a gap in starting odds becomes the same gap at the end.
      - text: "The one with the lower starting odds must be right."
        feedback: |
          The formula says nothing about who is right. It shows how evidence updates odds from a starting point, and the starting point is exactly what is disputed.
      - text: "The evidence cannot change either person's odds, because the starting odds are fixed."
        feedback: |
          Evidence multiplies the starting odds by the likelihood ratio, so it moves them whenever that ratio is not one.
    explanation: |
      This is why the burden-of-proof dispute does not end the debate: a presumption fixes the start, and both sides still owe an argument for the likelihood ratio. Where thoughtful people part ways: whether any starting odds are neutral, and what counts as $E$.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Three claims from this lesson. (1) Huxley coined "agnostic" in 1869, as Britannica reports, although the exact occasion is disputed. (2) The default for the debate about God should be "not believing" rather than "open". (3) God does not exist. Which sorting into layers (fact, live debate, faith or metaphysical commitment) is right?
    options:
      - text: "(1) fact, with a disputed detail; (2) live debate; (3) commitment."
        correct: true
        feedback: |
          Yes. (1) can be checked in historical sources. (2) is argued by philosophers on both sides. (3) is a metaphysical commitment, which the same sentence reversed ("God exists") is as well.
      - text: "(1) debate; (2) fact; (3) fact."
        feedback: |
          Whether (3) is a fact is exactly what the debate is about, and (2) is a choice of procedure, not a fact. Passing a commitment off as fact is the slip the three layers guard against.
      - text: "(1) commitment; (2) commitment; (3) debate."
        feedback: |
          (1) is a historical claim that can be checked, and (2) is a methodological question; neither is a faith commitment.
    explanation: |
      A believer, an atheist and an agnostic can agree on layer 1, argue over layer 2, and part ways on layer 3, each for reasons they can state.

  - type: text
    id: summary
    body: |
      **Next:** the next lesson, *Religious Pluralism: Many Faiths, One Truth?*, turns from nonbelief to the question of many traditions: if several faiths each claim to know the truth about God, how can they all be right, and how does each view handle the disagreement?
