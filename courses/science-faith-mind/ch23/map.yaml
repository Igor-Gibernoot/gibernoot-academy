outroTitle: Level 23 in one picture
outro: |
  Knowledge needs more than true belief with good grounds (Gettier), and reliabilists such as Goldman look to the process that produced the belief. Clifford and the evidentialists say belief needs evidence; Plantinga replies that the demand rests on a criterion that fails its own test, so belief in God can be properly basic; James and Pascal ask what to do when evidence cannot settle a momentous choice; Kierkegaard treats faith as a leap, not a calculation. When equal peers disagree, the equal weight view says to split the difference, and steadfast views say not necessarily. The same questions meet the nonbeliever (atheism, agnosticism), the diversity of faiths (exclusivism, inclusivism, pluralism), the state (Locke, Rawls, the French and American models) and a contested word (fundamentalism). Intellectual humility is the manner of holding any of these answers.

  Through all of them, keep three layers apart: the fact of who argued what, the live debate about how well it works, and the personal commitment of what one then believes. The level named the question and the best answers; it did not say which one to take.
