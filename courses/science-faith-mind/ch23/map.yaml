id: ch23-map
title: "Content Map: How Should One Believe?"
kind: map
name: Level 23, How Should One Believe? (what knowledge is, evidentialism, Reformed epistemology, pragmatic arguments, fideism, disagreement, atheism and agnosticism, pluralism, secularism, fundamentalism, intellectual humility)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the level on how one should hold beliefs about God and the world, from memory, one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a condition swapped with its opposite, a thinker given the rival's view, a rule turned upside down), and every wrong pick comes with a reason.

  Everything is taught according to the thinkers named in each box; whether belief in God is rational, or true, is left open. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: knowledge
    title: What is knowledge?
    row: 1
    col: 2
    body: |
      The classical analysis, often traced to Plato's *Theaetetus*, says that to know $p$ is to hold a **true belief** that is **justified**. **Gettier** (*Analysis*, 1963) gave cases where all three conditions hold and yet the belief is true **only by luck**, so they are **not sufficient** for knowledge. **Goldman** ("What Is Justified Belief?", 1979) proposed **reliabilism**: a belief is justified when it comes from a **reliable process**, whatever the believer can cite.
    decoys:
      - body: |
          The classical analysis, often traced to Plato's *Theaetetus*, says that to know $p$ is to hold a **true belief** that is **justified**. **Gettier** (*Analysis*, 1963) gave cases where one of the three conditions is missing and the belief is **still knowledge**, so they are **not necessary** for knowledge. **Goldman** ("What Is Justified Belief?", 1979) proposed **reliabilism**: a belief is justified when it comes from a **reliable process**, whatever the believer can cite.
        feedback: |
          Gettier's cases run the other way. In each one the belief is true and justified, so all three conditions hold, yet the belief is true only by luck and does not count as knowledge. The conditions look necessary but are not enough.
      - body: |
          The classical analysis, often traced to Plato's *Theaetetus*, says that to know $p$ is to hold a **true belief** that is **justified**. **Gettier** (*Analysis*, 1963) gave cases where all three conditions hold and yet the belief is true **only by luck**, so they are **not sufficient** for knowledge. **Goldman** ("What Is Justified Belief?", 1979) proposed **reliabilism**: a belief is justified when **the believer can cite good grounds from within**, whatever process produced it.
        feedback: |
          That is the rival picture, in which justification is what the believer can show from the inside. Goldman's reliabilism ties justification to the process that produced the belief: perception, memory and good reasoning are reliable, wishful thinking is not, and the believer need not be able to say so.
    explanation: |
      The root of the map. Every later box asks when a belief is in good standing, and this box says what that standing might be: grounds in the mind, or a reliable process in the world.

  - id: evidentialism
    title: Evidentialism
    row: 2
    col: 1
    body: |
      **Clifford** ("The Ethics of Belief", 1877) held that it is **wrong always, everywhere and for anyone to believe anything on insufficient evidence**: a claim about **duty**, told through a shipowner who ignores his doubts. **Feldman and Conee** ("Evidentialism", 1985) hold a separate, epistemic thesis: a belief is **justified when it fits the evidence the believer has**.
    decoys:
      - body: |
          **Clifford** ("The Ethics of Belief", 1877) held that it is **wrong everywhere and for anyone to believe on insufficient evidence, unless the belief is sincere**: a claim about **duty**, told through a shipowner who ignores his doubts. **Feldman and Conee** ("Evidentialism", 1985) hold a separate, epistemic thesis: a belief is **justified when it fits the evidence the believer has**.
        feedback: |
          Clifford allows no such exception. His wording is "always, everywhere, and for anyone", and the shipowner shows why: he sincerely believed the ship was sound because he stifled his doubts, and Clifford holds him to blame for how the belief was formed.
      - body: |
          **Clifford** ("The Ethics of Belief", 1985) held that a belief is **justified when it fits the evidence the believer has**, a claim about **justification**. **Feldman and Conee** ("Evidentialism", 1877) hold a separate, ethical thesis: it is **wrong always, everywhere and for anyone to believe anything on insufficient evidence**.
        feedback: |
          The two are swapped. Clifford (1877) gave the ethical rule about duty and guilt. Feldman and Conee (1985) gave the epistemic theory that justification is a matter of fit with the believer's evidence. A shared name hides two different questions.
    explanation: |
      The first answer to the root: belief is in good standing when the evidence supports it. Everything after this box either accepts that standard, replaces it, or asks who applies it.

  - id: plantinga
    title: Reformed epistemology
    row: 2
    col: 2
    body: |
      The evidentialist objection to belief in God rests on **classical foundationalism**: only beliefs that are **self-evident, incorrigible or evident to the senses** are properly basic. **Plantinga** ("Reason and Belief in God", in *Faith and Rationality*, 1983) argued that this criterion **fails its own test**, so the objection is not established. He proposed that belief in God can be **properly basic**, produced by a ***sensus divinitatis*** (a notion from Calvin), and replied to the **Great Pumpkin** objection that basic beliefs remain **open to defeat**.
    decoys:
      - body: |
          The evidentialist objection to belief in God rests on **classical foundationalism**: only beliefs that are **self-evident, incorrigible or evident to the senses** are properly basic. **Plantinga** ("Reason and Belief in God", in *Faith and Rationality*, 1983) argued that this criterion **passes its own test, since it is self-evident**, but that belief in God meets it too. He proposed that belief in God can be **properly basic**, produced by a ***sensus divinitatis*** (a notion from Calvin), and replied to the **Great Pumpkin** objection that basic beliefs remain **open to defeat**.
        feedback: |
          Plantinga argued the opposite. The criterion is not self-evident, not incorrigible and not evident to the senses, so by its own rule it would not be properly basic. Applied to itself it fails, and this is why he thinks the objection built on it is not established.
      - body: |
          The evidentialist objection to belief in God rests on **classical foundationalism**: only beliefs that are **self-evident, incorrigible or evident to the senses** are properly basic. **Plantinga** ("Reason and Belief in God", in *Faith and Rationality*, 1983) argued that this criterion **fails its own test**, so the objection is not established. He proposed that belief in God can be **properly basic**, produced by a ***sensus divinitatis*** (a notion from Calvin), and replied to the **Great Pumpkin** objection that a properly basic belief **can never be defeated**.
        feedback: |
          Plantinga's reply keeps defeat in play. A properly basic belief is not immune: if a defeater appears (a reason to drop the belief), it may have to go, and a defeater-defeater may restore it. That is how he separates belief in God from the Great Pumpkin without a fixed list of criteria.
    explanation: |
      The second answer: keep the demand for good standing but deny that good standing needs evidence in the form of arguments. It answers the evidentialist box directly and prepares the question of who is a fair judge when others disagree.

  - id: pragmatic
    title: Pragmatic arguments
    row: 2
    col: 3
    body: |
      **James** ("The Will to Believe", 1896) calls an option **genuine** when it is **live, forced and momentous**, and says that when intellect cannot decide a genuine option, our **passional nature** may. **Pascal's wager** (*Pensées*) compares expected values of wagering for God or not; the **many gods** objection (Diderot) says rival gods with rival rewards can cancel the gain.
    decoys:
      - body: |
          **James** ("The Will to Believe", 1896) calls an option **genuine** when it is **live, forced and trivial**, and says that when intellect cannot decide a genuine option, our **passional nature** may. **Pascal's wager** (*Pensées*) compares expected values of wagering for God or not; the **many gods** objection (Diderot) says rival gods with rival rewards can cancel the gain.
        feedback: |
          James requires the option to be momentous: a big or unique stake, one that cannot be undone. A trivial choice can wait for evidence or be reversed, so there is no case for letting the passional nature decide.
      - body: |
          **James** ("The Will to Believe", 1896) calls an option **genuine** when it is **live, forced and momentous**, and says that **even when intellect can decide**, our **passional nature** may overrule it. **Pascal's wager** (*Pensées*) compares expected values of wagering for God or not; the **many gods** objection (Diderot) says rival gods with rival rewards can cancel the gain.
        feedback: |
          James limits the permission to options that the intellect cannot decide on its own. Where the evidence settles a question, he gives the passions no right to overrule it, which is what separates his reply to Clifford from wishful thinking.
    explanation: |
      The third answer: if evidence cannot settle a momentous question, may we decide by stakes and temperament? This is the answer to Clifford, and the next boxes ask what faith is if it is not such a bet.

  - id: fideism
    title: Fideism and the leap
    row: 3
    col: 1
    body: |
      **Fideism** (from Latin *fides*) rests religious commitment on faith, not on reasons. **Kierkegaard**, in the *Concluding Unscientific Postscript* (1846, pseudonym Johannes Climacus), describes faith as passionate commitment and a **qualitative leap**, not the end of a calculation; *Fear and Trembling* (1843, Johannes de silentio) asks whether Abraham's act involves a **teleological suspension of the ethical**. **Nielsen** (1967) named the charge of **Wittgensteinian fideism**: religion cut off from outside criticism, a label Wittgensteinians often reject.
    decoys:
      - body: |
          **Fideism** (from Latin *fides*) rests religious commitment on faith, not on reasons. **Kierkegaard**, in the *Concluding Unscientific Postscript* (1846, pseudonym Johannes Climacus), describes faith as passionate commitment and a **qualitative leap**, not the end of a calculation; *Fear and Trembling* (1843, **Johannes Climacus**) asks whether Abraham's act involves a **teleological suspension of the ethical**. **Nielsen** (1967) named the charge of **Wittgensteinian fideism**: religion cut off from outside criticism, a label Wittgensteinians often reject.
        feedback: |
          The pseudonyms are mixed. *Fear and Trembling* (1843) was published under Johannes de silentio; Johannes Climacus is the name on the *Postscript* (1846). Kierkegaard wrote much of his work under pseudonyms.
      - body: |
          **Fideism** (from Latin *fides*) rests religious commitment on faith, not on reasons. **Kierkegaard**, in the *Concluding Unscientific Postscript* (1846, pseudonym Johannes Climacus), describes faith as passionate commitment and a **qualitative leap**, not the end of a calculation; *Fear and Trembling* (1843, Johannes de silentio) asks whether Abraham's act involves a **teleological suspension of the ethical**. **Nielsen** (1967) named the **Wittgensteinian fideism** charge, **which Wittgensteinians accept as an accurate summary of their view**.
        feedback: |
          Wittgensteinians often reject the label as a caricature. The charge is that religion becomes self-contained and cannot be criticised from outside; defenders reply that this misreads what they say about religious language having its own use.
    explanation: |
      The fourth answer is a refusal: faith is not the last step of a calculation of grounds or stakes. The fideist box sits beside evidentialism as its sharpest rival, and it raises the question of whether faith should answer to reasons at all.

  - id: disagreement
    title: Disagreement among equals
    row: 3
    col: 2
    body: |
      According to the Stanford Encyclopedia, **epistemic peers** are in **an equally good epistemic position** with respect to a statement. The **equal weight view** (**Elga, Christensen**) joins three claims: **defeat** (a peer's disagreement is a reason to doubt yourself), **equal weight** (the peer's opinion counts as much as yours) and **independence** (reasons to discount the peer must **not come from the disagreement itself**). For credences $0.8$ and $0.4$ it gives $0.6$ for both. **Steadfast** views deny one of these claims.
    decoys:
      - body: |
          According to the Stanford Encyclopedia, **epistemic peers** are in **an equally good epistemic position** with respect to a statement. The **equal weight view** (**Elga, Christensen**) joins three claims: **defeat** (a peer's disagreement is a reason to doubt yourself), **equal weight** (the peer's opinion counts as much as yours) and **independence** (reasons to discount the peer **may come from your own reasoning about the disputed statement**). For credences $0.8$ and $0.4$ it gives $0.6$ for both. **Steadfast** views deny one of these claims.
        feedback: |
          Independence says the opposite. If you could discount the peer because your own reasoning shows the peer is wrong, you would be using the very point in dispute, and anyone could dismiss every disagreement that way.
      - body: |
          According to the Stanford Encyclopedia, **epistemic peers** are in **an equally good epistemic position** with respect to a statement. The **equal weight view** (**Elga, Christensen**) joins three claims: **defeat** (a peer's disagreement is a reason to doubt yourself), **equal weight** (the peer's opinion counts as much as yours) and **independence** (reasons to discount the peer must **not come from the disagreement itself**). For credences $0.8$ and $0.4$ it gives $0.6$ for both. **Steadfast** views hold that **you must always move to the midpoint**.
        feedback: |
          That is the equal weight view, not the steadfast one. Steadfast views hold that learning of a peer's disagreement need not require any change of belief, and they reach this by denying defeat, equal weight or independence.
    explanation: |
      This box applies the standard of good standing to a social fact. Once one meets a peer who disagrees, the earlier boxes (evidence, basic belief, faith) all have to be weighed against the other person's equal position.

  - id: atheism
    title: Atheism and agnosticism
    row: 3
    col: 3
    body: |
      According to the Stanford Encyclopedia, **theism** is the view that God exists; **atheism** is either **lacking the belief** (psychological sense) or the **proposition that God does not exist**. **Huxley** coined **agnostic** in **1869** (Britannica: at the Metaphysical Society; the exact occasion is disputed). **Flew** (1972) argued for a **presumption of atheism**, and **Rowe** (1979) defined **friendly atheism**: God does not exist, yet some informed people are justified in believing that God does.
    decoys:
      - body: |
          According to the Stanford Encyclopedia, **theism** is the view that God exists; **atheism** is either **lacking the belief** (psychological sense) or the **proposition that God does not exist**. **Huxley** coined **agnostic** in **1969** (Britannica: at the Metaphysical Society; the exact occasion is disputed). **Flew** (1972) argued for a **presumption of atheism**, and **Rowe** (1979) defined **friendly atheism**: God does not exist, yet some informed people are justified in believing that God does.
        feedback: |
          The date is a century off. Huxley's word is from 1869, in the Victorian debates between science and belief; the sources disagree only on where and when in that year he first used it.
      - body: |
          According to the Stanford Encyclopedia, **theism** is the view that God exists; **atheism** is either **lacking the belief** (psychological sense) or the **proposition that God does not exist**. **Huxley** coined **agnostic** in **1869** (Britannica: at the Metaphysical Society; the exact occasion is disputed). **Flew** (1972) argued for a **presumption of theism**, and **Rowe** (1979) defined **friendly atheism**: God does not exist, and **no informed person is justified in believing that God does**.
        feedback: |
          Two slips. Flew argued for a presumption of atheism, by analogy with the presumption of innocence. And Rowe's friendly atheist grants that some informed people are justified in believing in God, which is what makes the atheism friendly.
    explanation: |
      Nonbelief is not one position. This box applies the evidential and pragmatic questions to the person who does not believe, and who also has a duty to say what they know and what they only lack.

  - id: pluralism
    title: Many faiths
    row: 4
    col: 1
    body: |
      **Race** (*Christians and Religious Pluralism*, 1983) set out three responses to religious diversity: **exclusivism**, **inclusivism** and **pluralism**. **Plantinga** defends exclusivism, holding that the exclusivist need not grant **epistemic parity** to those who disagree. **Rahner** is a leading inclusivist, who spoke of **anonymous Christians**. **Hick** treats the faiths as responses to one **Real**, seen through culturally shaped concepts, on a Kantian contrast of **noumenal** and **phenomenal**.
    decoys:
      - body: |
          **Race** (*Christians and Religious Pluralism*, 1983) set out three responses to religious diversity: **exclusivism**, **inclusivism** and **pluralism**. **Plantinga** defends exclusivism, holding that the exclusivist **must grant epistemic parity** to those who disagree. **Rahner** is a leading inclusivist, who spoke of **anonymous Christians**. **Hick** treats the faiths as responses to one **Real**, seen through culturally shaped concepts, on a Kantian contrast of **noumenal** and **phenomenal**.
        feedback: |
          Plantinga argues the other way: a Christian exclusivist may reasonably believe she is epistemically favoured, for example through what her tradition calls the internal witness of the Holy Spirit, so she need not treat the dissenter as an equal in the disagreement sense.
      - body: |
          **Race** (*Christians and Religious Pluralism*, 1983) set out three responses to religious diversity: **exclusivism**, **inclusivism** and **pluralism**. **Plantinga** defends exclusivism, holding that the exclusivist need not grant **epistemic parity** to those who disagree. **Rahner** is a leading **exclusivist**, who spoke of **anonymous Christians**. **Hick** treats the faiths as responses to one **Real**, seen through culturally shaped concepts, on a Kantian contrast of **noumenal** and **phenomenal**.
        feedback: |
          Rahner is classed as an inclusivist: salvation comes through Christ, but people outside the Church may share in it, which is why he spoke of "anonymous Christians". Exclusivists deny that route, and Hick's pluralism goes further than either.
    explanation: |
      Here the disagreement box meets the traditions themselves. Whether a believer should lower confidence on meeting a thoughtful believer of another faith depends on which of these three answers one gives.

  - id: secular
    title: Church and state
    row: 4
    col: 2
    body: |
      **Locke** (*Letter Concerning Toleration*, 1689) argued that the **magistrate has no authority over the care of souls**, since **force cannot produce belief**. **France's 1905 law** (Article 2) says the Republic **does not recognise, pay or subsidise any religion**. The **First Amendment** (1791) bars an **establishment** of religion and protects its **free exercise**. **Rawls** (*Political Liberalism*, 1993) rests legitimacy on **public reason** and an **overlapping consensus** of doctrines.
    decoys:
      - body: |
          **Locke** (*Letter Concerning Toleration*, 1689) argued that the **magistrate has authority over the care of souls**, since **force can produce belief**. **France's 1905 law** (Article 2) says the Republic **does not recognise, pay or subsidise any religion**. The **First Amendment** (1791) bars an **establishment** of religion and protects its **free exercise**. **Rawls** (*Political Liberalism*, 1993) rests legitimacy on **public reason** and an **overlapping consensus** of doctrines.
        feedback: |
          Locke's argument runs the other way. Because the understanding cannot be compelled to believe by outward force, penalties cannot make anyone sincerely believe, and so the magistrate has no business with the care of souls.
      - body: |
          **Locke** (*Letter Concerning Toleration*, 1689) argued that the **magistrate has no authority over the care of souls**, since **force cannot produce belief**. **France's 1905 law** (Article 2) says the Republic **recognises and pays one official religion**. The **First Amendment** (1791) bars an **establishment** of religion and protects its **free exercise**. **Rawls** (*Political Liberalism*, 1993) rests legitimacy on **public reason** and an **overlapping consensus** of doctrines.
        feedback: |
          Article 2 of the 1905 law says the opposite: the Republic neither recognises, pays nor subsidises any religion. That law ended the arrangement under which the state recognised and paid certain churches.
    explanation: |
      The social side of the level: how a state treats belief when its citizens disagree. It draws on the pluralism box (many faiths) and the disagreement box (reasonable people disagreeing), and Rawls offers one way to live with both.

  - id: fundamentalism
    title: Fundamentalism
    row: 4
    col: 3
    body: |
      **Curtis Lee Laws**, a Baptist editor, proposed the name **Fundamentalists** in **1920** for those who would "do battle royal" for the fundamentals, meaning it as a **compliment**. **Marty and Appleby** (the Fundamentalism Project, 1991 to 1995) treat fundamentalism as a **family resemblance** concept across religions, a use that critics such as **Watt** call a distortion. Movements called by the word often **reject the label**.
    decoys:
      - body: |
          **Curtis Lee Laws**, a Baptist editor, proposed the name **Fundamentalists** in **1920** for those who would "do battle royal" for the fundamentals, meaning it as an **insult**. **Marty and Appleby** (the Fundamentalism Project, 1991 to 1995) treat fundamentalism as a **family resemblance** concept across religions, a use that critics such as **Watt** call a distortion. Movements called by the word often **reject the label**.
        feedback: |
          Laws meant it in compliment, not disparagement: it was a name for conservatives to wear with pride. Critics turned it into an insult within a few years, which is why the word has two lives.
      - body: |
          **Curtis Lee Laws**, a Baptist editor, proposed the name **Fundamentalists** in **1920** for those who would "do battle royal" for the fundamentals, meaning it as a **compliment**. **Marty and Appleby** (the Fundamentalism Project, 1991 to 1995) treat fundamentalism as **one fixed doctrine shared by every movement**, a use that critics such as **Watt** call a distortion. Movements called by the word often **reject the label**.
        feedback: |
          A family resemblance concept has no single trait that all members share; the members overlap in several. That is how Marty and Appleby could group movements in different religions, and it is the point critics press when they ask whether one word can fit them all.
    explanation: |
      A case study in the whole level. A word starts as a self-chosen name, becomes a label put on others, and then raises the question of who has the right to define a belief: the believer, the scholar or the critic.

  - id: humility
    title: Intellectual humility
    row: 5
    col: 1
    body: |
      According to **Whitcomb, Battaly, Baehr and Howard-Snyder**, intellectual humility is **attentiveness to and ownership of one's intellectual limitations**: mistakes, gaps in knowledge, weak skills. It does not mean thinking all opinions equally good, and a humble person can hold a view **firmly yet stay ready to revise it**. In the model of two peers with credences $c_A$ and $c_B$, the weight $r$ given to the other is how that readiness is measured: $r=\tfrac12$ splits, $r=0$ holds firm.
    decoys:
      - body: |
          According to **Whitcomb, Battaly, Baehr and Howard-Snyder**, intellectual humility is **low confidence in oneself and a reluctance to state a view**: mistakes, gaps in knowledge, weak skills. It does not mean thinking all opinions equally good, and a humble person can hold a view **firmly yet stay ready to revise it**. In the model of two peers with credences $c_A$ and $c_B$, the weight $r$ given to the other is how that readiness is measured: $r=\tfrac12$ splits, $r=0$ holds firm.
        feedback: |
          Their account is about owning limitations, not about timidity. A person can state a view clearly, act on it and still be humble, provided they attend to where they might be wrong and are willing to say so.
      - body: |
          According to **Whitcomb, Battaly, Baehr and Howard-Snyder**, intellectual humility is **attentiveness to and ownership of one's intellectual limitations**: mistakes, gaps in knowledge, weak skills. It means **thinking all opinions equally good**, and a humble person **holds views loosely**. In the model of two peers with credences $c_A$ and $c_B$, the weight $r$ given to the other is how that readiness is measured: $r=\tfrac12$ splits, $r=0$ holds firm.
        feedback: |
          Humility is not relativism. Owning one's limits is compatible with thinking some views better supported than others, and a firm view is not a failure of humility if one stays ready to revise it.
    explanation: |
      The manner of holding the beliefs of every earlier box. Whichever answer one gives on evidence, faith, disagreement or the traditions, humility asks how firmly to hold it and how to speak with those who differ.

  - id: layers
    title: Three layers
    row: 5
    col: 2
    span: 2
    body: |
      **Fact** (what was written, said or enacted): what Clifford, James and Plantinga argued, how Gettier's cases are built, what the 1905 French law says. **Debate** (live disagreement among thoughtful people): whether any repair of the classical analysis works, whether equal weight or a steadfast view is right, whether the label *fundamentalism* fits. **Commitment** (a stance a person takes): whether there is a *sensus divinitatis*, whether to wager, how much weight to give a peer of another faith.
    decoys:
      - body: |
          **Fact** (what was written, said or enacted): what Clifford, James and Plantinga argued, **that believing on insufficient evidence is wrong**, what the 1905 French law says. **Debate** (live disagreement among thoughtful people): whether any repair of the classical analysis works, whether equal weight or a steadfast view is right, whether the label *fundamentalism* fits. **Commitment** (a stance a person takes): whether there is a *sensus divinitatis*, whether to wager, how much weight to give a peer of another faith.
        feedback: |
          That believing on insufficient evidence is wrong is Clifford's thesis, and evidentialists and their critics still argue over it, so it belongs in the debate layer. That Clifford argued it in 1877 is the fact.
      - body: |
          **Fact** (what was written, said or enacted): what Clifford, James and Plantinga argued, how Gettier's cases are built, what the 1905 French law says. **Debate** (live disagreement among thoughtful people): **when Gettier's paper appeared**, whether equal weight or a steadfast view is right, whether the label *fundamentalism* fits. **Commitment** (a stance a person takes): whether there is a *sensus divinitatis*, whether to wager, how much weight to give a peer of another faith.
        feedback: |
          The date of a paper is a fact that anyone can check (Gettier's appeared in *Analysis* in 1963). Debate concerns questions where informed people still disagree, such as whether any repair of the classical analysis works.
    explanation: |
      The thread through the whole map. Every box mixes a fact (who said it, when), a debate (how well it works) and a commitment (what a believer, an atheist or an agnostic then makes of it), and the level's aim is to keep the three apart.

