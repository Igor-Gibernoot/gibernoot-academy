id: ch23-pragmatic
title: "Will to Believe: James and Pascal"
kind: concept
own: |
  The setting: a person must decide whether to commit to a statement $H$ (for example "God exists") before the evidence settles it. Write $p=P(H)$ for the chance the person gives $H$, and let committing pay a gain $g$ if $H$ is true and cost a loss $c$ if $H$ is false, while withholding pays $0$ either way. Each answer below is told *according to* its thinker.
  - **James's genuine option** (William James, 1842 to 1910, "The Will to Believe", an address to the philosophical clubs of Yale and Brown, published June 1896). An option is a choice between two hypotheses. It is {{ **genuine** when it is live (a real possibility for you), forced (no way of not choosing) and momentous (a big or unique stake) }}. According to James, when an option is genuine and cannot by its nature be decided on intellectual grounds, the believer's "passional nature" may and must decide it.
  - **His reply to Clifford** (William Kingdon Clifford, 1845 to 1879, "The Ethics of Belief", 1877: believing on insufficient evidence is always wrong). James says "Believe truth!" and "Shun error" are two separable laws, and Clifford puts all the weight on the second. Weighing them, committing is worth it when
    {{ $$p>\frac{c}{g+c}$$ }}
    so a larger gain $g$ or a smaller loss $c$ lowers the chance needed. The evidence fixes $p$; the weights $g$ and $c$ are a matter of temperament and values.
  - **Pascal's wager** (Blaise Pascal, 1623 to 1662, *Pensées*, published after his death). The acts are wagering for God or against; the states are God exists or not. If $p$ is the chance that God exists, wagering for God has expected value
    $$\mathrm{EV}=p\,x_1+(1-p)\,x_2$$
    where $x_1$ is its payoff if God exists and $x_2$ its payoff if not. With a finite reward (gain $1000$, cost $10$) the break-even chance is $10/1010\approx0.0099$. If the reward is infinite, then for any {{ $p>0$ }} the expected value is infinite, so the size of $p$ stops mattering.
  - **Objections to the wager.** *Many gods*: a rival god B who punishes wagering for God A can cancel the gain (with chances $0.02$, $0.02$ and $0.96$ and payoffs $1000$, $-1000$, $-10$, the expected value is $-9.6$). *Infinite utility*: expected value cannot rank two infinite rewards. *Believing at will*: according to Bernard Williams, someone who could believe at will would believe regardless of whether the claim seemed true, which conflicts with what belief is, so it cannot be adopted on command; Pascal replies that one can act as if one believed and let the passions fade.
  - **James on Pascal.** James calls the wager an argument "for others" and says Pascal's own belief had "far other springs". His own case needs the hypothesis to be {{ live }} for the person, which a belief taken on for payoff alone is not.
  - **Three layers.** Fact: who argued what, and the numbers. Debate: whether any religious choice is genuine in James's sense, and how to weigh risk of error against risk of missing a good. Commitment: how much one values the possible good against the possible error.

cards:
  - type: text
    id: hook
    title: "Before the evidence arrives"
    body: |
      Mara has an offer to teach in a city she has never visited. She must answer by Friday. Nothing she can learn before Friday will tell her whether she will be happy there: it depends on friends she has not met and on a school she has not seen. Her family says "do not decide until you know more", but she knows that if she waits past Friday the offer goes to someone else.

      Before any theory, a guess. Guessing first is the point. The lesson is about choices like this one, where a person has to act before the evidence is in, and about what that does to the question of whether it is wrong to believe without proof.

  - type: mcq
    id: guess
    title: "Guess: is waiting a neutral act?"
    prompt: |
      Mara decides to wait for more evidence and lets Friday pass. What best describes what she has done?
    options:
      - text: "She has made a choice anyway: letting the offer lapse is the same outcome as refusing it."
        correct: true
        feedback: |
          Yes. When refusing to choose has the same result as one of the options, there is no neutral place to stand. This is the idea the lesson will name.
      - text: "She has done nothing, so she cannot be blamed for either outcome."
        feedback: |
          Tempting, because doing nothing feels safe. But the offer was lost because she let the date pass, so the outcome follows from what she did.
      - text: "She has kept her options open, since she can still accept later."
        feedback: |
          Only if the offer waits for her. In this story it does not, so the option closed.
    explanation: |
      Keep your answer. The question that follows is what to do, and what to believe, when waiting is itself a way of choosing.

  - type: text
    id: james
    title: "William James and the address of 1896"
    image:
      src: img/james.webp
      alt: "Portrait photograph of the philosopher William James, around 1907"
      caption: "William James (1842-1910), American psychologist and philosopher at Harvard, photographed about 1907 by Alice Boughton."
      credit: "Alice Boughton, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:William_James_by_Alice_M._Boughton,_c._1907,_platinum_print,_from_the_National_Portrait_Gallery_-_NPG-NPG_87_37James-000001_(cropped).jpg"
    body: |
      Recall from the lesson Evidentialism: Clifford. William Kingdon Clifford (1845 to 1879) held, in "The Ethics of Belief" (1877), that it is wrong always, everywhere and for anyone to believe anything on insufficient evidence.

      William James (1842 to 1910), an American psychologist and philosopher, replied in "The Will to Believe", an address to the philosophical clubs of Yale and Brown universities, published in *The New World* in June 1896. His reply is narrow on purpose. According to James, Clifford's rule is right for most beliefs, and wrong for a special kind of choice. To say which kind, he sorts choices between two hypotheses (he calls such a choice an **option**) along three pairs.

  - type: text
    id: three-pairs
    title: "Live or dead, forced or avoidable, momentous or trivial"
    body: |
      According to James, a hypothesis is **live** when it appeals to you as a real possibility, and **dead** when it does not. His example is a request to believe in the Mahdi (a figure expected in some Muslim traditions): for most of his audience, he says, the notion makes no connection with their nature, so the hypothesis is dead for them. Liveness depends on the person, not on the truth.

      An option is **forced** when it is a complete either/or with no possibility of not choosing, and **avoidable** otherwise. An option is **momentous** when the stake is large or the chance will not come again, and **trivial** when it is small or can be repeated. James calls an option **genuine** when it is live, forced and momentous.

  - type: mcq
    id: classify
    title: "Which choice is genuine?"
    prompt: |
      Four choices. According to James's three pairs, which one is a genuine option for the person described?
    options:
      - text: "Mara must say yes or no to the distant job by Friday, and both answers are real possibilities for her."
        correct: true
        feedback: |
          Yes. Both hypotheses are live for her, the choice is forced (letting Friday pass is a no), and the stake is large and not repeatable.
      - text: "A friend asks Mara to believe that a king who died four thousand years ago will return, and she has never heard of him."
        feedback: |
          For her this is a dead hypothesis, like James's Mahdi: it makes no claim on her. A choice with a dead side is not genuine.
      - text: "Mara may pick tea or coffee this morning, or neither, and tomorrow she can choose again."
        feedback: |
          It is avoidable (she can pick neither) and trivial (the stake is small and repeatable).
      - text: "A scientist can wait ten years for a better experiment before accepting a theory, and nothing depends on it meanwhile."
        feedback: |
          This is avoidable and not momentous in the sense James needs. He agrees that here the sensible course is to withhold belief until the evidence comes.
    explanation: |
      All three pairs have to hold. This is why James's claim is narrow: most of what we are asked to believe fails at least one test.

  - type: text
    id: thesis
    title: "James's thesis"
    body: |
      James's claim is that where an option is genuine, and cannot by its nature be decided on intellectual grounds, we are allowed, and in fact obliged, to let our wishes and fears decide. In his words, "Our passional nature not only lawfully may, but must, decide an option between propositions, whenever it is a genuine option that cannot by its nature be decided on intellectual grounds". If evidence could settle the matter, he says, the old rule applies: wait for it.

      Two things are needed together. The option must be genuine, and the evidence must be unable to decide it. According to James, a religious hypothesis can meet both conditions for some people: it is momentous, it cannot be put off for good (a life lived without it is also a choice), and it is not settled by evidence on which everyone agrees. Whether religion does meet them is a point where thoughtful people differ.

  - type: mcq
    id: scope
    title: "What James does not allow"
    prompt: |
      A friend says: "James proved that anyone may believe whatever they like when the evidence is mixed." Which reply fits James's thesis?
    options:
      - text: "James limits the permission to genuine options that evidence cannot decide; for an avoidable or trivial question, or one the evidence settles, he agrees with Clifford."
        correct: true
        feedback: |
          Yes. The two conditions do the work. Without them his claim would turn into wishful thinking, which he does not defend.
      - text: "James allows belief whenever it makes the believer happier."
        feedback: |
          Happiness alone is not his test. The option must also be live, forced and momentous.
      - text: "James rejects the idea that evidence matters at all."
        feedback: |
          He holds that evidence governs most beliefs. His complaint is about a rule that would forbid belief even where evidence cannot speak.
      - text: "James says Clifford's rule is false for every belief."
        feedback: |
          He accepts much of it. He calls Clifford's attitude an excess, not an error throughout.
    explanation: |
      This is a layer-2 point (live debate): critics say the conditions are too easy to meet, and defenders say they are quite strict.

  - type: text
    id: dupe
    title: "The reply to Clifford: two laws"
    body: |
      Clifford's slogan puts all the weight on avoiding error. James says that "We must know the truth; and we must avoid error" are two separable laws, not two ways of stating one. "Believe truth!" tells us to gain true beliefs. "Shun error" tells us to avoid false ones. You can follow the second perfectly by believing nothing, and so lose every truth.

      According to James, someone who says "Better go without belief forever than believe a lie!" merely shows a strong private horror of becoming a dupe (someone fooled). James asks in return: "Dupery for dupery, what proof is there that dupery through hope is so much worse than dupery through fear?" If you refuse to believe a true thing out of fear of error, you have also been fooled, and by your own caution.

      He adds that in some cases faith can help create the fact it trusts. In his own example, a train of passengers who are each brave enough will still be robbed by a few highwaymen if none expects the others to join in resisting; if each trusts the others, they resist, and the trust was right because it was held.

  - type: widget
    id: weights
    title: "Two weights, one chance"
    widget: decision-matrix
    config:
      actions: ["Commit to believing H", "Withhold belief"]
      states: ["H is true", "H is false"]
      payoffs: [[1, -100], [0, 0]]
      probs: [0.5, 0.5]
      threshold: true
      labels:
        corner: "Act / State"
      presets:
        - { label: "Weights: avoid error", payoffs: [[1, -100], [0, 0]] }
        - { label: "Weights: seek truth", payoffs: [[10, -1], [0, 0]] }
        - { label: "Seek truth, forced", payoffs: [[10, -1], [-10, 0]] }
    body: |
      A toy model of the disagreement, not James's own calculation. Let $H$ be a hypothesis with chance $p$. Committing pays a gain if $H$ is true and costs a loss if $H$ is false; the matrix lets you type both. Try the three presets and drag the chance slider: the readout says at what chance committing starts to beat withholding. In the last preset, withholding loses the good when $H$ is true, as in a forced option.

  - type: numeric
    id: break-even
    title: "How much chance is enough?"
    prompt: |
      Committing to a hypothesis $H$ pays a gain $g=10$ if $H$ is true and costs a loss $c=1$ if $H$ is false; withholding pays $0$ either way. At what chance $p=P(H)$ do the two acts have the same expected value? Give $p$ as a decimal to three places.
    answer: 0.091
    tolerance: 0.001
    answerText: '1/11 ≈ 0.091'
    wrong:
      - { value: 0.5, feedback: "This is the answer when gain and loss are equal. Here the gain is ten times the loss, so less chance is needed." }
      - { value: 0.909, feedback: "That is $g/(g+c)$, the chance at which it is the loss that matters most. Set $pg-(1-p)c=0$ and solve for $p$." }
    hint: "Set $10p-(1-p)\\cdot1=0$."
    explanation: |
      Setting the expected values equal gives $pg=(1-p)c$, so $p=c/(g+c)=1/11\approx0.091$. With Clifford-style weights ($g=1$, $c=100$) the same formula gives $100/101\approx0.99$. The evidence can fix $p$; it cannot say whether $g$ or $c$ is the larger, and that is James's point about temperament and values. Critics reply that in matters of belief the loss $c$ (being wrong) should not be set by one's hopes.

  - type: mcq
    id: clash
    title: "What do they disagree about?"
    prompt: |
      Suppose Clifford and James both accept that the evidence leaves $p=0.3$ for a hypothesis $H$. According to the toy model, what could still make one of them commit and the other withhold?
    options:
      - text: "They weigh the loss from error and the gain from truth differently, so they put the break-even chance at different places."
        correct: true
        feedback: |
          Yes. With avoid-error weights the break-even chance is near 1, so $p=0.3$ is far too low; with seek-truth weights it is low, so $p=0.3$ is enough.
      - text: "One of them has misjudged the evidence."
        feedback: |
          They were stipulated to agree on $p$. The model locates the difference elsewhere.
      - text: "James believes that wishing makes $H$ true."
        feedback: |
          James allows only that, in some cases such as the train example, trust can help bring a fact about. He does not claim it for all hypotheses.
    explanation: |
      This is a disagreement of values about risk, not of data. A critic of James can still ask which weights are rational; a critic of Clifford can ask why error should weigh so much more than missed truth.

  - type: text
    id: pascal
    title: "Pascal and a forced choice"
    image:
      src: img/pascal.webp
      alt: "Painted portrait of Blaise Pascal in a dark robe and white collar"
      caption: "Blaise Pascal (1623-1662), French mathematician and writer, whose notes for a defence of Christianity were published after his death as the Pensées."
      credit: "unknown; copy of a painting by François II Quesnel, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Blaise_Pascal_Versailles.JPG"
    body: |
      Recall from the lesson Guided Proof: Pascal's Wager. Blaise Pascal (1623 to 1662) argued, in a note of the *Pensées* published after his death, that one must wager on whether God exists. According to the Stanford Encyclopedia of Philosophy he says "you must wager. It is not optional": the choice is forced in James's sense, since living as a nonbeliever is also a wager.

      Treat it as a decision problem. The **acts** are wager for God and wager against. The **states** are that God exists or that God does not. The expected value of an act is
      $$\mathrm{EV}=p\,x_1+(1-p)\,x_2$$
      where $p$ is the chance that God exists, $x_1$ the payoff if God exists and $x_2$ the payoff if not. Take the toy payoffs of that lesson: wagering for God gains $1000$ if God exists and costs $10$ (things given up) if not; wagering against pays $0$ either way.

  - type: widget
    id: wager-finite
    title: "A finite reward"
    widget: decision-matrix
    config:
      actions: ["Wager for God", "Wager against"]
      states: ["God exists", "God does not exist"]
      payoffs: [[1000, -10], [0, 0]]
      probMode: log
      probMin: -4
      probs: [0.001, 0.999]
      threshold: true
      presets:
        - { label: "p = 0.001", prob: 0.001 }
        - { label: "p = 0.01", prob: 0.01 }
        - { label: "p = 0.5", prob: 0.5 }
    body: |
      Drag the chance that God exists (the slider is logarithmic) and watch the expected value of each act and the break-even chance in the readout.

  - type: numeric
    id: ev-small
    title: "A one-in-a-thousand chance"
    prompt: |
      Wagering for God gains $1000$ if God exists and costs $10$ if not; wagering against pays $0$ either way. If your chance that God exists is $p=0.001$, what is the expected value of wagering for God?
    answer: -8.99
    tolerance: 0.01
    wrong:
      - { value: 1, feedback: "That is only the first term, $0.001\\times1000$. The cost in the other state, weighted by $0.999$, must be subtracted." }
      - { value: 990, feedback: "That ignores the weights. Each payoff is multiplied by the chance of its state." }
    hint: "Compute $0.001\\times1000+0.999\\times(-10)$."
    explanation: |
      $0.001\times1000=1$ and $0.999\times(-10)=-9.99$, so the expected value is $1-9.99=-8.99$. With a finite reward, a small enough chance makes the wager a bad bet: the break-even chance is $10/1010\approx0.0099$. This is why Pascal's argument depends on the next step.

  - type: widget
    id: wager-infinite
    title: "An endless reward"
    widget: decision-matrix
    config:
      actions: ["Wager for God", "Wager against"]
      states: ["God exists", "God does not exist"]
      payoffs: [[.inf, -10], [0, 0]]
      probMode: log
      probMin: -9
      probs: [1.0e-6, 0.999999]
      threshold: true
      presets:
        - { label: "p = 0.000001", prob: 1.0e-6 }
        - { label: "p = 0", prob: 0 }
        - { label: "Both infinite", payoffs: [[.inf, -10], [.inf, 0]] }
    body: |
      Now the reward for wagering for God, if God exists, is infinite. Slide the chance down, then to zero, then try the third preset, where wagering against also has an infinite reward in the state where God exists.

  - type: mcq
    id: infinite
    title: "What the infinity does"
    prompt: |
      Wagering for God has payoff $+\infty$ if God exists and $-10$ if not; wagering against pays $0$ either way. For which chances $p$ that God exists does the expected value rule favour wagering for God?
    options:
      - text: "For every $p>0$, however small; at $p=0$ the infinite term drops out and the rule favours wagering against."
        correct: true
        feedback: |
          Yes. Any positive chance times an infinite payoff is infinite, which beats every finite number. At exactly zero the infinite payoff is never received.
      - text: "Only when $p$ is above $10/1010$."
        feedback: |
          That is the break-even chance for the finite reward. With an infinite reward the threshold disappears.
      - text: "For no $p$, because an infinite number cannot be weighed."
        feedback: |
          That worry is real (see the objections below), but with a single infinite payoff the weighing is clear: the expected value is infinite whenever $p>0$.
    explanation: |
      This is Pascal's central step, which later writers call the generalized expectation argument. Premises: the reward is infinite, the chance is above zero, and one ranks acts by expected value. A critic may reject any of the three. Note that the conclusion is about what to do, not a proof that God exists.

  - type: text
    id: objections
    title: "Three objections"
    body: |
      **Many gods.** According to Denis Diderot (1746), an imam could reason just as well; J. L. Mackie (1982) noted that the church outside which there is said to be no salvation is not necessarily the Church of Rome. If another god B might punish those who wager for God A, the reward for wagering for A is no longer clear. **Infinite utility.** If two acts each carry an infinite reward in some state, expected value cannot rank them; Alan Hájek (2003), making the same point as Duff (1986), argued that the wager is therefore invalid as stated, because mixed strategies (choosing by chance) also reach an infinite reward. **Believing at will.** Pascal's own interlocutor says "I am so made that I cannot believe"; Pascal answers that one can act as if one believed (the Stanford Encyclopedia gives taking holy water and having masses said) and the passions that block belief will lessen.

      The next card puts the first objection into numbers.

  - type: widget
    id: many-gods
    title: "Add a second god"
    widget: decision-matrix
    config:
      actions: ["Wager for A", "Wager against"]
      states: ["God A exists", "No god"]
      payoffs: [[1000, -10], [0, 0]]
      probs: [0.02, 0.96]
      extraStates:
        - { label: "God B exists", prob: 0.02, payoffs: [-1000, 0] }
      extraToggle: true
      extraShown: false
      labels:
        extra_on: "Show god B"
        extra_off: "Hide god B"
    body: |
      Wagering for god A gains $1000$ if A exists and costs $10$ if no god exists. The button adds a third state: a god B who punishes those who wagered for A, with payoff $-1000$. Press it and watch the expected value of wagering for A.

  - type: numeric
    id: ev-two-gods
    title: "Expected value with a rival god"
    prompt: |
      Three states: god A exists (chance $0.02$), god B exists (chance $0.02$), no god exists (chance $0.96$). Wagering for A pays $1000$, $-1000$ and $-10$ in those states; wagering against pays $0$ in all three. What is the expected value of wagering for A?
    answer: -9.6
    tolerance: 0.01
    wrong:
      - { value: 10.4, feedback: "That drops god B. The chance of B times its payoff, $0.02\\times(-1000)=-20$, must be added." }
      - { value: 0, feedback: "The gain and the punishment cancel ($20-20$), but the cost in the no-god state remains, $0.96\\times(-10)$." }
    hint: "Compute $0.02\\times1000+0.02\\times(-1000)+0.96\\times(-10)$."
    explanation: |
      $20-20-9.6=-9.6$. The rival god cancels the gain and leaves only the cost, so wagering for A now loses to wagering against. Defenders of the wager reply that the two gods are not equally credible, or that the God of the wager has special standing; critics reply that any such reply must be argued, not assumed. Either way the table, and not just the infinity, decides the outcome.

  - type: mcq
    id: at-will
    title: "Can one decide to believe?"
    prompt: |
      According to James, the wager is an argument "for others", and Pascal's own belief "had far other springs". Which objection to the wager does this remark press, and how does James's own thesis avoid it?
    options:
      - text: "The objection that belief cannot be taken on at will; James requires the hypothesis to be live for the person, so he does not ask anyone to believe on command."
        correct: true
        feedback: |
          Yes. James notes that we cannot, by willing it, believe that Abraham Lincoln's existence is a myth. A hypothesis that is dead for you cannot be made live by a payoff. According to Bernard Williams, someone who could believe at will would believe regardless of whether the claim seemed true, which conflicts with what belief is, so belief cannot be adopted on command for another reason.
      - text: "The many-gods objection; James requires there be only one god."
        feedback: |
          James's remark is about how belief is acquired, not about the number of gods.
      - text: "The infinite-utility objection; James rejects infinite payoffs."
        feedback: |
          James does not discuss the mathematics of infinite expected value in this passage.
      - text: "None: James accepts the wager as sound."
        feedback: |
          According to the Stanford Encyclopedia, James observed that a God might not reward infinitely those who believe only for the mercenary reasons Pascal gives. He does not accept the wager as sound.
    explanation: |
      The two thinkers differ in kind. Pascal's wager gives reasons from payoff to act in ways that may lead to belief. James's argument says that, for a live and genuine option, believing without decisive evidence is permitted. A critic of both can ask whether either gives belief's own standard, truth, its due.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Which of these is a matter of fact (layer 1), not live debate or personal commitment?
    options:
      - text: "James addressed the philosophical clubs of Yale and Brown in 1896, and published the essay that June in *The New World*."
        correct: true
        feedback: |
          Yes. This is history, checked in the published text.
      - text: "A religious choice is a genuine option in James's sense."
        feedback: |
          This is live debate: it depends on whether religion is live for the person and whether evidence can decide it.
      - text: "Fear of error should count for more than the hope of truth."
        feedback: |
          This is a value judgement, so a commitment, not a fact.
      - text: "God's existence has a probability high enough to make the wager worthwhile."
        feedback: |
          Whatever its answer, this rests on how $p$ is set, which is itself disputed or a commitment.
    explanation: |
      The lesson settles who argued what. It leaves open whether any religious option is genuine and how to weigh risk of error against risk of missing a good. Those depend on premises and values, which is where thoughtful people part ways.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** James says reason cannot always decide. The next lesson, Fideism, Leap and Doubt, asks about thinkers for whom faith is not a bet at all: Kierkegaard's leap and Wittgenstein's view that religious belief is not a hypothesis.
