id: ch23-fundamentalism
title: "Fundamentalism and Religious Politics"
kind: concept
own: |
  The setting: "fundamentalism" is a word with two lives. It began as a proud name that some American Protestants gave themselves, and it became a comparative label that scholars and journalists apply to movements in many religions, often over the objections of the people so labelled. Each account below is told *according to* its holders.
  - **Origin.** According to Curtis Lee Laws, a Baptist editor, writing on 1 July 1920 in *The Watchman-Examiner*, those who {{ mean to do battle royal for the fundamentals }} should be called *Fundamentalists*, a name he meant as neutral and inclusive. The name drew on *The Fundamentals* (twelve volumes of essays, 1910 to 1915) and on the five articles the Presbyterian Church in the U.S.A. required for ordination in 1910: inerrancy of Scripture, the virgin birth, the atoning death, the bodily resurrection and the reality of miracles. After the Scopes trial (Dayton, Tennessee, July 1925) the word became, in the public mind, a term of ridicule.
  - **Marty and Appleby.** The Fundamentalism Project (University of Chicago Press, volumes from 1991 to 1995), directed by Martin Marty and R. Scott Appleby, speaks of a "hypothetical family" of movements in different religions. The publisher's description of the project's fifth volume says its beginning premise was that fundamentalisms in all faiths share certain "family resemblances". Read with Wittgenstein's idea of *family resemblance* (overlapping traits, so that {{ no single trait is required in every case }}), this gives a loose category rather than a definition. Summaries of the project list traits such as a reaction to the marginalization of religion, a selective use of tradition and of modern tools, a sharp divide between good and evil, an absolute authority for a sacred text or teaching, sharp boundaries around the group, and strict behavioural rules (wording and count vary between summaries).
  - **Armstrong.** In *The Battle for God* (2000) Karen Armstrong argues that the movements she studies, among American Protestants, religious Zionists and Islamists, are {{ a reaction to modernity }}. She uses *mythos* (the language of meaning, ritual and symbol) and *logos* (the language of reasoning, evidence and practical results): in her account modern societies prize logos, and fundamentalists, by reading their *mythos* as if it were *logos*, turn symbol into literal fact.
  - **Four cases, in their own terms.** American Protestants gather round the authority of the Bible. The Muslim Brotherhood (founded in Ismailia, Egypt, in 1928 by Hassan al-Banna) uses the slogan "{{ Islam is the solution }}" and runs schools and clinics. Gush Emunim (founded in 1974, some sources say 1973, under the spiritual leadership of Rabbi Zvi Yehuda Kook) holds that settling the land won in 1967 serves a divine purpose. Hindutva (a term first used in a nationalist political context by Vinayak Savarkar in his 1923 booklet *Essentials of Hindutva*) is a disputed case. The political scientist Arun Swamy writes that Hindu nationalism is "most assuredly not 'fundamentalist'", because it concerns the unity of Hindus as a political community, not forms of worship. Giovanni Bulian (Ca' Foscari University of Venice) writes that it can be labelled fundamentalism because it presupposes eternal, originally pure roots of identity that must be protected.
  - **The believers' reply.** David Harrington Watt, in *Antifundamentalism in Modern America* (2017), argues that the word {{ has never been a neutral category of analysis }}: writers such as Harry Emerson Fosdick, Talcott Parsons and Richard Hofstadter taught many Americans to see fundamentalists as backward, and after 1979 the label was extended to Muslims, Jews, Hindus and others. Sathianathan Clarke, in *Competing Fundamentalisms* (2017), instead treats violent extremism in Christianity, Islam and Hinduism as fundamentalisms that have more in common across religions than with other members of their own faith.
  - **Three layers.** Fact: who founded which movement, and what each wrote and did. Debate: whether one category fits movements so unlike each other, and whether "reaction to modernity" explains them. Commitment: whether one's own tradition is being preserved, distorted or insulted by the word.

cards:
  - type: text
    id: hook
    title: "A word that began as a compliment"
    body: |
      Open a newspaper almost anywhere and you will find the word *fundamentalist*, usually as a criticism. It is applied to some Protestants in the United States, to some Muslims, Jews, Hindus and Buddhists, and sometimes to people with no religion at all. Is it one thing in all these places, or one word for many things?

      Before any theory, a guess. Guessing first is the point. The lesson follows the word from its start, then sets scholars' accounts beside the answers of the people they describe. It does not decide who is right about any religion's claims. It asks what the word is good for.

  - type: mcq
    id: guess
    title: "Guess: who first used the word?"
    prompt: |
      The English word *fundamentalist* was introduced in 1920. Who introduced it, and in what spirit?
    options:
      - text: "A Baptist newspaper editor, as a name for conservative Christians to wear with pride."
        correct: true
        feedback: |
          Yes. Curtis Lee Laws, editor of *The Watchman-Examiner*, proposed it in 1920 for those who "mean to do battle royal for the fundamentals", and meant it as a name to wear with pride.
      - text: "Journalists after the 1979 revolution in Iran, as a label for Muslim radicals."
        feedback: |
          Many people assume this because the word became common in news about Islam then. But it is older by almost sixty years and began among American Protestants.
      - text: "Liberal theologians, as an insult for those who rejected modern science."
        feedback: |
          Critics did turn it into an insult within a few years, but the first use was by a conservative, as a friendly name for his own side.
    explanation: |
      The history of the word matters because its first meaning (a self-chosen name) is not the meaning most readers hear today (a label put on others).

  - type: text
    id: origins
    title: "The Fundamentals and the five articles"
    body: |
      The name came from a book series. Between 1910 and 1915 two oil-company brothers, Lyman and Milton Stewart, paid for *The Fundamentals*, twelve volumes of about ninety essays defending the authority of Scripture and other Christian doctrines. The publishers' own foreword to the last volume reports about two and a half million copies circulated, nearly three million with reprints, sent free to pastors, missionaries and other Christian workers. In 1910 the General Assembly of the Presbyterian Church in the U.S.A. required five articles of those it ordained: the inerrancy of the original manuscripts of Scripture, Christ's virgin birth, his atoning death, his bodily resurrection, and the reality of miracles. These later became known as the "five points of fundamentalism".

      In 1920, after a Baptist conference on the fundamentals of the faith, the editor Curtis Lee Laws wrote (*The Watchman-Examiner*, 1 July 1920) that those who "mean to do battle royal for the fundamentals" should be called *Fundamentalists*. The movement was a defence of what its members saw as the essentials of the faith against liberal readings of the Bible and against Darwinian evolution.

  - type: mcq
    id: origins-q
    title: "Origins: what did the word mean?"
    prompt: |
      According to Laws, what did calling someone a *Fundamentalist* say in 1920?
    options:
      - text: "That the person held to certain essential Christian doctrines and was ready to defend them."
        correct: true
        feedback: |
          Yes. It was a statement about doctrines, with a note of readiness to fight for them.
      - text: "That the person wanted a Christian state."
        feedback: |
          The 1920 use was about church doctrine and denominational fights (Laws was writing about the Northern Baptist Convention), not about government. Political activity on a large scale came later, in the late twentieth century.
      - text: "That the person rejected all modern technology."
        feedback: |
          No. The movement used mass printing and mailing; *The Fundamentals* itself reached millions of readers by post.
    explanation: |
      That last point returns later: the movement used modern tools from its first days. Whether that fits the picture of a movement that "rejects modernity" is one of the questions of the lesson.

  - type: text
    id: scopes
    title: "Dayton, 1925: the word becomes an insult"
    image:
      src: img/scopes-trial.webp
      alt: "Black and white photograph of two men outdoors during a trial, one seated and being questioned by the other, with spectators behind them."
      caption: "Clarence Darrow (defence) questions William Jennings Bryan (prosecution, called as a witness) outdoors at the Rhea County courthouse, Dayton, Tennessee, 20 July 1925."
      credit: "Smithsonian Institution from United States, No restrictions, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Clarence_S._Darrow_interrogating_William_Jennings_Bryan,_Scopes_trial,_Dayton,_Tennessee,_July_20,_1925._(4324506037).jpg"
    body: |
      Tennessee's Butler Act forbade teaching human evolution in public schools. The American Civil Liberties Union offered to defend any teacher charged under it. In Dayton, John T. Scopes was tried from 10 to 21 July 1925. William Jennings Bryan, a former secretary of state, helped the prosecution; Clarence Darrow led the defence. The jury found Scopes guilty and the fine was 100 dollars. In January 1927 the Tennessee Supreme Court upheld the law but overturned the conviction on a technicality (the state constitution let only a jury set a fine above 50 dollars). Tennessee repealed the Butler Act in 1967.

      Historians note that fundamentalists were ridiculed in the press during and after the trial, and that this fixed a public picture of them as unsophisticated and hostile to science. Many fundamentalists, by contrast, saw the trial as a win for their side, since Scopes was convicted. Same event, two memories.

  - type: mcq
    id: scopes-q
    title: "Dayton: what does the trial show?"
    prompt: |
      Which statement is supported by the record described above?
    options:
      - text: "The trial ended in a conviction, yet it also gave the word *fundamentalist* its public image as anti-science."
        correct: true
        feedback: |
          Yes. A legal win and a loss in public image went together, which is why the same trial is remembered so differently.
      - text: "The jury acquitted Scopes, so the Butler Act was struck down at once."
        feedback: |
          No. Scopes was found guilty and fined 100 dollars. The conviction was later set aside on a technicality, but the law was upheld and stayed until 1967.
      - text: "The trial settled whether evolution is true."
        feedback: |
          A court cannot settle that, and this one did not try to. The question was whether Scopes had broken a state law.
    explanation: |
      Layers: the dates and verdict are fact; whether the press coverage was fair to fundamentalists is a live debate among historians; what the trial *shows* about science and faith is a commitment on which readers differ.

  - type: text
    id: travel
    title: "The word travels"
    body: |
      From the 1920s the word spread to journalism, and later to other religions. In the late 1980s the American Academy of Arts and Sciences sponsored the Fundamentalism Project, led by Martin Marty of the University of Chicago and R. Scott Appleby of the University of Notre Dame. It produced a series of volumes from the University of Chicago Press, from *Fundamentalisms Observed* (1991) to *Fundamentalisms Comprehended* (1995), comparing movements in many religions.

      The project did not claim that all such movements believe the same things; the concluding chapter of the first volume speaks of a "hypothetical family". One way to read that is through *family resemblance* (the phrase is Wittgenstein's, from *Philosophical Investigations*, 1953, where he applies it to games): members of a family look alike through overlapping traits, though no single feature is shared by all. A trait list works as a sketch of the family face, not as a definition that each case must pass.

  - type: mcq
    id: family-q
    title: "Family resemblance: what follows?"
    prompt: |
      A group shows five of the traits on a project's list but lacks a sixth. According to the family-resemblance idea, what follows?
    options:
      - text: "Nothing decisive: resemblance is a matter of degree, and no single trait is required."
        correct: true
        feedback: |
          Yes. That is the strength (it allows for variety) and the weakness (it is hard to say where the family ends).
      - text: "The group is not a fundamentalism, because it fails the definition."
        feedback: |
          That treats the list as a definition with necessary conditions. The family idea denies exactly that.
      - text: "The group is certainly a fundamentalism, because five is more than half."
        feedback: |
          A count is not a rule in this approach either. The question is how well the whole pattern fits, and critics say that gives little guidance at the edges.
    explanation: |
      Critics reply that a concept without sharp edges can be stretched to cover anything one dislikes. Defenders reply that many useful concepts (game, language, species) work like this.

  - type: text
    id: traits
    title: "The family face"
    body: |
      Summaries of the project list traits like these (a review of the first volume confirms reaction, selective recovery of tradition alongside modern techniques, and boundaries; the others rest on secondary summaries). The exact wording and the count vary between summaries, so read them as the *kind* of thing the project looked for.

      | Trait | Plain meaning |
      |---|---|
      | Reaction to marginalization | A response to religion being pushed out of public life |
      | Selective use of tradition and of modern tools | Recovers some parts of the past, and uses media, schools and politics of today |
      | Moral dualism | Sharp contrast between good and evil, often cosmic |
      | Absolute authority | A text or teaching taken as inerrant or beyond question |
      | Sharp boundaries | Clear lines between members and outsiders |
      | Strict rules | Required behaviour, dress or discipline |

      Marty and Appleby's claim, in this layer, is a *scholarly proposal* (layer 2). Whether a given movement fits is a matter of facts about that movement.

  - type: mcq
    id: selective-q
    title: "Which trait is this?"
    prompt: |
      A movement says it restores the pure faith of its founders, but runs television channels, social media accounts and political parties to do it. Which trait on the list does this show most directly?
    options:
      - text: "Selective use of tradition and of modern tools."
        correct: true
        feedback: |
          Yes. Scholars note that these movements are modern in their methods even when they claim to be ancient in their aims.
      - text: "Moral dualism."
        feedback: |
          That trait concerns a sharp good-evil contrast, not the use of media or parties.
      - text: "Reaction to marginalization."
        feedback: |
          The movement may well be a reaction, but the facts in the question (using modern media and parties to restore the past) show the *selective* use of the modern and the old.
    explanation: |
      Believers in such movements often answer that using a tool does not change the message: the faith is the same, the means are new. Scholars reply that the means shape what the movement becomes. Both are claims about what is central.

  - type: text
    id: cases
    title: "Four movements, in their own terms"
    body: |
      The category is easiest to test on cases. Each line says how the movement describes itself, and then what scholars add.

      | Movement | In its own terms | Scholars add |
      |---|---|---|
      | American Protestants (from the 1910s) | Defending the essentials and the authority of the Bible | Reaction to liberal theology and to evolution, with large mass media |
      | Muslim Brotherhood (1928, Ismailia, Egypt, Hassan al-Banna) | "Islam is the solution" (its best-known slogan): social welfare and moral reform, with a mosque, schools, clinics and hospitals | An encyclopedia entry calls it the first modern Islamic mass movement, pragmatic about using Western ideas and technology, with tension between moderate and militant currents |
      | Gush Emunim (1974, led spiritually by Zvi Yehuda Kook) | Settle the land won in 1967, in the service of a divine purpose | A religious-Zionist movement that backed a national religious party from the early 1980s |
      | Hindutva (Savarkar, 1923; RSS, 1925, K. B. Hedgewar) | National and cultural identity, not doctrine | Described in one encyclopedia as a right-wing ethno-nationalist ideology that defines India's cultural identity through Hinduism; whether "fundamentalist" fits is disputed among scholars (see below) |

      Armstrong's book covers religious Zionists in Israel and Islamists in Egypt and Iran, the settings of the first two movements above. The Hindutva case shows the dispute most clearly, since Hinduism is a diverse collection of doctrines, which raises the question whether the category fits at all. In a survey of the research, Deepa Reddy reports that scholars of the late 1980s and early 1990s often placed Hindutva among the fundamentalisms, that others looked to India's own history instead, and that Mark Juergensmeyer called the label less descriptive than accusatory. Arun Swamy argues that Hindu nationalists have not tried to impose a view of Hindu religion on Hindus or to punish those who break its precepts: for them "there are traitors, but not apostates". Giovanni Bulian, in a teaching text, answers that the label fits because the movement presupposes pure roots of identity that must be restored, while granting that it is not only religious. Swamy also notes that outside observers have found it too easy to treat Hindu nationalism as the Hindu version of Islamic radicalism.

  - type: mcq
    id: cases-q
    title: "Cases: which description fits?"
    prompt: |
      A supporter of Hindutva says: "Our movement is about the nation and its culture, not about religious doctrine, so the label *fundamentalist* does not apply." What is the best response from someone who thinks the label can apply?
    options:
      - text: "A movement can use religion to build identity and organisation without being about doctrine; the family-resemblance approach looks at that use, not at doctrine."
        correct: true
        feedback: |
          Yes. That is the family-resemblance reading: the resemblance is in a shared attitude toward religion and in how movements use it, not in matching beliefs.
      - text: "The supporter is lying about the movement's aims."
        feedback: |
          Nothing in the dispute requires that. The two sides differ on what the *word* should cover, not on whether anyone is honest.
      - text: "Only movements with an inerrant text can be fundamentalist, so Hinduism is out."
        feedback: |
          That is the *opposing* position (the label does not fit because Hinduism has no such text). It is a fair argument but it rejects the label rather than defending it.
    explanation: |
      Both sides can agree on the facts (founding, texts, organisation) and still disagree on the label. Whether it helps depends on what one wants the category to explain.

  - type: mcq
    id: traps-q
    title: "Common slips"
    prompt: |
      Which of these statements about fundamentalism is a slip, according to the account above?
    multiple: false
    options:
      - text: "Fundamentalism is just literal reading of a sacred text, so any literalist is a fundamentalist."
        correct: true
        feedback: |
          This is the slip. A group can read a text literally without the other traits (reaction, boundaries, a political programme), and a movement such as the Muslim Brotherhood or Gush Emunim is described by scholars through its response to modern life and its use of tradition, not by a single rule of reading.
      - text: "The word began as a name that some Christians chose for themselves."
        feedback: |
          True (Laws, 1920), so not a slip.
      - text: "Scholars disagree about whether one category fits movements in many religions."
        feedback: |
          True (Marty and Appleby on one side, Watt on the other), so not a slip.
    explanation: |
      A second slip to watch for is "fundamentalist means violent". The traits in the summaries of the project concern attitudes and organisation; violence is not on the list.

  - type: text
    id: armstrong
    title: "Armstrong: mythos and logos"
    body: |
      Karen Armstrong's *The Battle for God* (2000) follows movements in Judaism, Christianity and Islam from about 1870: American Protestant patriots, religious Zionists in Israel, and Islamists in Egypt and Iran.

      Her thesis uses two terms. *Mythos* is the language of meaning: story, ritual and symbol, which says what a life is for. *Logos* is the language of reasoning and practical results: evidence, argument, technology. According to Armstrong, modern societies came to trust only logos, so religion lost its old standing. Fundamentalists, in her account, answered by turning their *mythos* into *logos*: they read stories and symbols as literal facts, as if they were claims of science. She treats this as an effect of modernity and not as a return to the past.

  - type: mcq
    id: armstrong-q
    title: "Armstrong: what is the thesis?"
    prompt: |
      According to Armstrong, why are fundamentalist movements *modern* even when they claim to defend the old?
    options:
      - text: "They answer the dominance of logos by reading their own mythos as if it were logos."
        correct: true
        feedback: |
          Yes. In her account the movement borrows the modern standard (literal, testable, practical) and applies it to symbol and story.
      - text: "They use modern machines such as printing presses and the Internet."
        feedback: |
          Scholars do note that. But it is not Armstrong's thesis, which is about the *way of reading* and the kind of claim made, not the tools used.
      - text: "They are founded after the 1900s, so everything about them is new."
        feedback: |
          Dates are not her argument. She says each movement is an answer to modern conditions, which came to different places at different times.
    explanation: |
      One reviewer, Bruce Lawrence, finds the scheme too neat and says that she criticizes the ideology as totalitarian yet too readily applauds fundamentalist correctives to secularist excesses. Whether "mythos" and "logos" are the right terms is a live debate (layer 2).

  - type: text
    id: reply
    title: "The believers' reply"
    body: |
      Many people whom the word describes do not accept it. David Harrington Watt's *Antifundamentalism in Modern America* (2017) argues that fundamentalism has never been a neutral category of analysis. He traces how writers such as Harry Emerson Fosdick, Talcott Parsons and Richard Hofstadter led many Americans to see fundamentalists as backward, intolerant and anti-intellectual, and how, after the 1979 Iranian revolution, the word was extended to Muslims, Jews, Hindus, Sikhs and Buddhists.

      On the other side, Sathianathan Clarke (*Competing Fundamentalisms*, 2017) looks at violent extremism in Christianity, Islam and Hinduism, and argues that globalization drives these movements. The two books give contrasting answers to what the word should cover.

  - type: mcq
    id: watt-q
    title: "Whose objection?"
    prompt: |
      A critic says: "A word coined to describe American Baptists in 1920 cannot be moved to Islam or Hinduism without bending it; asking which Muslims are fundamentalists is like asking which Christians are Sunni or Shi'a." Which part of the lesson's debate does this belong to?
    options:
      - text: "Watt's objection to using one category worldwide."
        correct: true
        feedback: |
          Yes. In essence, Watt argues that the word has never been a neutral category and was extended far beyond its American origin.
      - text: "Marty and Appleby's proposal of a family of movements."
        feedback: |
          That is the proposal the critic is questioning, not the critic's own view.
      - text: "Armstrong's account of mythos and logos."
        feedback: |
          Armstrong accepts the category and tries to explain it. This speaker questions the category itself.
    explanation: |
      A fair reading keeps both: the word began somewhere specific (Watt's point), and some resemblances across movements are real enough to need a name (Clarke's point). Which weighs more depends on what the word is to be used for.

  - type: text
    id: politics
    title: "Religious politics: where the question moves"
    body: |
      The earlier lesson Secularism, Church and State asked what a state should do about religion. Fundamentalism turns the question around: what do religious movements do when they enter politics? The cases above answer in different ways. The Muslim Brotherhood began with preaching, schools and charity and later entered politics. Gush Emunim built settlements. American Protestants went from controversy inside denominations in the 1920s to organised political activity in the late twentieth century (the Moral Majority of Jerry Falwell, the Christian Coalition of Pat Robertson, after Supreme Court decisions on school prayer in 1962 and 1963).

      Rawls's idea of public reason (from that earlier lesson) gives one way to frame it: a movement can take part in democratic politics while giving reasons all citizens can share, or it can ask for laws on reasons only its members accept. Which movements do which, and when, is a matter of fact about each. Whether it is wrong to ask for laws on religious reasons is, in this course's terms, a layer-3 question on which thoughtful people differ: some say that religious citizens must translate their reasons, others that they may argue from their own doctrine like anyone else.

  - type: mcq
    id: layers-q
    title: "Sort the claim by layer"
    prompt: |
      Match the claim to its layer: "Fundamentalism is mainly a reaction to modernity."
    options:
      - text: "Live debate among scholars (layer 2)."
        correct: true
        feedback: |
          Yes. It is Armstrong's thesis and it is widely discussed, but scholars such as Watt question how well one explanation fits movements so unlike each other.
      - text: "Established fact (layer 1)."
        feedback: |
          A fact is a date, a text or an event. A general explanation of why movements arise is an interpretation.
      - text: "Faith commitment (layer 3)."
        feedback: |
          It does not rest on a claim about God or ultimate reality, so it is a scholarly, not a faith, claim. The commitment layer enters when someone says whether the movements are right.
    explanation: |
      Keeping the layers apart lets a believer, a sceptic and a historian agree on the facts of Dayton or of the 1974 founding of Gush Emunim and still differ on what they mean.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** Intellectual humility and honest doubt: after learning how each side can be right about some things and unfair about others, what attitude should one take to one's own convictions?
