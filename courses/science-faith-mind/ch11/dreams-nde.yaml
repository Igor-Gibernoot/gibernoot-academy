id: ch11-dreams-nde
title: "Near-Death and Out-of-Body Experiences"
kind: concept
own: |
  The setting: people who come close to death, for example in a cardiac arrest (the heart stops pumping), and who later report an experience, and the question of what causes those reports and how studies can test them. Of $n$ survivors interviewed, let $k$ be the number who give a given report.
  - **Reports.** According to Raymond Moody (1975), accounts of near-death experiences share features such as peace, a sense of being outside the body, a tunnel, a light and a review of one's life. Bruce Greyson's scale (1983) turns this into a score $S$ from 0 to 32 (16 items, each scored 0, 1 or 2), and an experience counts as a near-death experience when
  {{ $$S\ge 7$$ }}
  - **Rates.** A rate is the share of the $n$ interviewed who report something:
  {{ $$\text{rate}=\frac{k}{n}$$ }}
  In the AWARE II study, $k=6$ of $n=28$ interviewed survivors, about $21\%$, described a transcendent experience of death.
  - **Brain explanations.** According to Blanke and colleagues (2002), electrical stimulation of the right angular gyrus in one epilepsy patient produced a sensation of seeing herself from above. According to Nelson and colleagues (2006), {{ **REM intrusion** }} (waking-state features of dreaming sleep) was reported by 60% of 55 people with a near-death experience against 24% of 55 matched controls. According to Borjigin and colleagues (2013), rats showed a surge of synchronous gamma activity within 30 seconds of cardiac arrest. Each is a correlate or a model, not a demonstration of what a human report is.
  - **Tests of perception.** According to the AWARE studies (Parnia and colleagues, 2014 and 2023), hidden targets were placed where only a viewer near the ceiling could see them. No survivor identified a hidden target, but most arrests occurred where targets were not placed, so the test could rarely be run.
  - **Strength of evidence.** Let $E$ be the observed result, $H_A$ the reading that the person perceived from above, and $H_B$ the reading that the brain produced the experience. The result favours $H_A$ over $H_B$ by the likelihood ratio
  {{ $$\mathrm{LR}=\frac{P(E\mid H_A)}{P(E\mid H_B)}$$ }}
  and when few targets can be tested, $P(E\mid H_A)$ is high even if $H_A$ is true, so LR is close to 1 and no hits are weak evidence either way.
  - **Two readings.** According to Mobbs and Watt (2011), the features come from ordinary brain function disturbed by dying. According to Greyson, Kelly and colleagues, the brain filters or transmits mind rather than producing it, and vivid experience while brain function is impaired is hard for the first reading. Each has an objection to answer.
  - **Three layers.** That people report these features, and that some brain states can produce body-leaving sensations, is established; whether dying brains can explain the whole pattern is a live debate; whether mind outlasts or exceeds the brain is a commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: tunnel, light, calm"
    prompt: |
      Guessing is the point; no theory yet. Many people who were close to death (for example after their heart stopped) later describe moving through a tunnel toward a light, feeling calm, and sometimes floating above their own body. What is the most natural first explanation?
    options:
      - text: 'They really left the body and saw what lies beyond death.'
        feedback: |
          This is a serious reading, held by some researchers, and the lesson gives it its best form. But it is one of several, and the same reports could also come from a stressed brain, so it is not the only natural one.
      - text: 'It is only a dying brain playing tricks, so there is nothing to study.'
        feedback: |
          Dismissing it as "only" settles the question in advance. Even if the brain explanation is right, it has to say which brain states produce which parts of the report, and that is real research.
      - text: 'Several explanations compete, and different kinds of evidence bear on each: reports, brain stimulation, and tests of what people could perceive.'
        correct: true
        feedback: |
          This is the stance of the lesson. A person can be sincere about a vivid experience and we can still ask what caused it.
    explanation: |
      The lesson sorts the claims into three layers: what is established, what scholars debate, and what rests on a commitment.

  - type: text
    id: recall
    title: "Recall: states, correlates, expectation"
    body: |
      Recall: according to Charles Tart (1972), a **state of consciousness** is an overall pattern of how the mind functions (attention, memory, sense of self, sense of control). In the lessons A Map of Conscious States, What Meditation Does and Psychedelics and the Mind we met two cautions. A brain measure that changes with an experience is a **correlate**, not yet an explanation of what the experience is. And a measured effect can mix the thing studied with the **expectation** people bring to it.

      Every claim can be sorted into three layers: **established fact** (data), **live debate** (scholars disagree) and **commitment** (a faith or metaphysical premise). Near-death reports test this sorting hard, because they bear on a question many people care about: what happens at death.

  - type: text
    id: reported
    title: "What is reported"
    image:
      src: img/moody.webp
      alt: "Photograph of Raymond Moody, a man with white hair, speaking at a workshop"
      caption: "Raymond Moody (born 1944), an American philosopher and physician, introduced the term near-death experience in his 1975 book."
      credit: "Ehabich, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Raymond_Moody_2_(cropped).jpg"
    body: |
      A **near-death experience** (NDE) is an experience, often vivid, reported by someone who was close to death or believed to be. The term comes from Raymond Moody's book *Life After Life* (1975), which collected accounts from about 150 people. According to that book, accounts return again and again to a few features: deep peace and freedom from pain, a sense of being outside the body, moving through darkness like a tunnel, a golden light, meeting a "being of light", a rapid review of one's life, and a beautiful other world. Critics such as the skeptic Paul Kurtz noted that the book rested on interviews, without statistical analysis.

      Researchers then asked how to measure such accounts. According to Kenneth Ring's book *Life at Death* (1980), the experience tends to unfold in stages, starting with peace and a separation from the body. In 1983 Bruce Greyson published a questionnaire, the **Near-Death Experience Scale**: 16 items, each scored 0, 1 or 2, so the total runs from 0 to 32. Its items fall into four groups (thinking, feelings, paranormal-type and transcendental features), and studies commonly count a total of **7 or more** as a near-death experience.

  - type: mcq
    id: report-vs-reading
    title: "Report or interpretation?"
    prompt: |
      A survivor says: "I floated above the bed and watched the team work. Then a being of light told me it was not my time, and I knew it was God." Which analysis is fair?
    options:
      - text: 'All of it is one report, so all of it must be taken as true or all dismissed.'
        feedback: |
          A report can be sorted into parts. Believing that the person had the experience does not oblige anyone to accept the meaning they give it.
      - text: 'That the person had an experience of floating, and of a presence speaking, is the report; that the presence was God is the person''s interpretation, which depends on their beliefs.'
        correct: true
        feedback: |
          Yes. Describing what was experienced is one task; saying what it was is another. The interpretation draws on the person''s tradition: a Christian, a Hindu and an atheist may describe the same presence differently.
      - text: 'Nothing here is checkable, so none of it is data.'
        feedback: |
          The fact that people give such accounts, and how often and with what features, is data. What is hard to check is what the account says about the world, and the later cards ask which parts can be tested.
    explanation: |
      Keeping the report and its reading apart is the first step. Questionnaires such as the Greyson scale measure the report only.

  - type: numeric
    id: greyson-score
    title: "Scoring the scale"
    prompt: |
      On the Near-Death Experience Scale each of 16 items is scored 0 (not present), 1 (somewhat) or 2 (present). A survivor scores 2 on three items, 1 on two items, and 0 on the rest. What is the total score $S$? (Studies commonly count $S\ge7$ as a near-death experience.)
    answer: 8
    hint: Add the points from each group of items.
    explanation: |
      Three items at 2 points give 6, two items at 1 point give 2, and the rest give 0, so $S=6+2=8$. Since $8\ge 7$, this survivor would count. The threshold is a convention chosen so that the scale separates clear cases from vague ones; a score of 6 and a score of 8 describe very similar experiences.

  - type: text
    id: obe
    title: "Out-of-body experiences"
    image:
      src: img/blanke.webp
      alt: "Portrait photograph of Olaf Blanke, a man with short grey hair"
      caption: "Olaf Blanke, a neurologist and neuroscientist at EPFL in Lausanne, studies how the brain builds the sense of where one's body and self are."
      credit: "EPFL-MEDIACOM, CC BY 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:EPFL_2020_Olaf_BLanke_Portrait.jpg"
    body: |
      An **out-of-body experience** (OBE) is the sense of being located outside one's own body, often looking down on it. It can occur on its own as well as in an NDE.

      According to Olaf Blanke and colleagues (2002, *Nature*), a woman being evaluated for epilepsy surgery had electrodes placed on the surface of her brain. When the surgeons stimulated the right **angular gyrus** (a fold of cortex where the temporal and parietal lobes meet) with a weak current, she reported sinking into the bed or falling from a height; with a stronger current she reported seeing herself lying in bed from above. The authors suggested that such experiences may reflect a failure of the brain to combine information from the body senses and from the balance system (the vestibular system).

      So a sense of seeing oneself from above can be switched on by stimulating one region. It needs, in Blanke's reading, only that the brain's model of where the self is gets disturbed.

  - type: mcq
    id: blanke-q
    title: "What the stimulation shows"
    prompt: |
      Stimulating one brain region in one epilepsy patient produced a sensation of seeing herself from above. What does this fairly show?
    options:
      - text: 'That every out-of-body experience, including those in cardiac arrest, is produced by that region.'
        feedback: |
          One patient with epilepsy, stimulated on purpose, cannot establish the cause of experiences that happen spontaneously in other people in very different conditions. It shows what a region can do, not that this is what happened in them.
      - text: 'That a body-leaving sensation can be produced by changing brain activity, so such a sensation does not by itself show that anything left the body.'
        correct: true
        feedback: |
          Yes. It is an existence proof: the sensation has at least one brain route. A believer can reply that the brain may be the route by which a real event is experienced, as a radio produces sound from a signal, so it does not settle whether anything real was perceived.
      - text: 'That the experience was not real to her.'
        feedback: |
          The experience was real as an experience. The question is what it was an experience of, and stimulation does not answer that.
    explanation: |
      A brain intervention that produces an experience shows a causal route. Whether the route is the whole story or a channel is the question the two readings later disagree about.

  - type: text
    id: brain
    title: "Brain explanations, each with its limit"
    body: |
      Several proposals try to explain the features. According to Dean Mobbs and Caroline Watt (2011, *Trends in Cognitive Sciences*), the tunnel and the light may come from a breakdown of the visual system when the brain gets too little oxygen, the out-of-body sensation from a failure to combine senses, and the calm and the visions from chemicals the brain releases under stress. They conclude that NDEs reflect normal brain function disturbed during a trauma.

      According to Kevin Nelson and colleagues (2006, *Neurology*), 55 people who had had an NDE were compared with 55 controls matched for age and sex. REM intrusion, a state in which features of dreaming sleep such as paralysis and vivid imagery occur while awake, was reported by 60% of the NDE group and 24% of the controls. The authors suggested that a person whose arousal system lets REM features intrude may be more likely to have such an experience. The limits: the data are self-reports, the groups were not recruited the same way, and a link does not show cause.

      According to Jimo Borjigin and colleagues (2013, *PNAS*), in rats whose hearts were stopped, a brief burst of synchronised high-frequency (gamma) brain activity appeared within about 30 seconds, before the signal went flat, stronger than in waking. They suggested that a dying brain can show correlates of heightened processing. The limit: nobody can ask a rat what it experienced.

  - type: mcq
    id: rats-q
    title: "What a surge in rats shows"
    prompt: |
      A surge of synchronous gamma activity appeared in rats just after cardiac arrest. What does it show, and what does it not show, about human near-death reports?
    options:
      - text: 'It shows that human near-death experiences are produced by a gamma surge.'
        feedback: |
          Rats gave no report, and no one has shown that humans have the same surge with the same timing or that it matches experience. Greyson, Kelly and Dunseath (2013) also noted that the rat pattern was not seen under anesthesia, so it may not carry over.
      - text: 'It shows that a dying brain can be strongly active, which makes a brain-based explanation of vivid late experience conceivable. It does not show what a human experienced or that a surge is the NDE.'
        correct: true
        feedback: |
          Yes. It answers the objection that a brain with no blood flow must be silent, but it is a model, and a correlate in an animal.
      - text: 'It shows nothing, because rats are not people.'
        feedback: |
          Animal models are a standard way to learn what brains can do. The limit is on what they can show, not a reason to ignore them.
    explanation: |
      Results in animals extend what is possible. Linking them to a human report needs further steps: the same pattern in people, a link to what they reported, and a ruling out of other causes.

  - type: text
    id: tests
    title: "Tests of perception: AWARE"
    body: |
      Reports of seeing the room from above raise a testable claim: if the person perceived events from above, they could see what a sensor-based brain could not. According to Sam Parnia and colleagues (2014, *Resuscitation*), the **AWARE** study followed 2060 cardiac arrests at 15 hospitals in the UK, USA and Austria. Of the 140 survivors, 101 completed a second interview. About 46% reported memories of some kind, about 9% an NDE, and about 2% a clear recall of seeing and hearing events during resuscitation. Shelves holding hidden images, facing up so that only someone near the ceiling could see them, were installed in key areas, but 78% of the arrests happened in rooms without them. No survivor reported seeing the images. One case of a report that matched events during the arrest was judged verified, and it concerned sounds, not sights.

      In AWARE II (2023, *Resuscitation*), 567 in-hospital cardiac arrests at 25 US and UK hospitals gave 53 survivors, of whom 28 were interviewed; 6 described what the study called a transcendent experience of death. None identified the hidden images. In the 85 patients whose brain activity was recorded, nearly 40% showed activity returning to normal or near-normal, in some cases up to an hour into CPR. The authors say that research so far has neither proved nor disproved the reality or meaning of these experiences.

  - type: numeric
    id: rate
    title: "A rate"
    prompt: |
      In AWARE II, 28 survivors were interviewed and 6 of them described a transcendent experience of death. What percent of the interviewed survivors is that, to the nearest whole number?
    answer: 21
    tolerance: 1
    hint: Divide the number who report it by the number interviewed.
    explanation: |
      The rate is $k/n$ with $k=6$ and $n=28$, so $6/28\approx 0.214$, about $21\%$. Notice what the number is a rate of: survivors who were interviewed, not everyone who arrested, since fewer than one in ten patients survived to discharge. A report rate among survivors cannot say how many of those who died would have reported anything.

  - type: numeric
    id: testable
    title: "How many could be tested?"
    prompt: |
      In the first AWARE study, 78% of arrests happened in rooms without the shelves holding hidden images. Suppose 10 survivors say they watched their resuscitation from above, and where an arrest happens does not depend on whether a person has such a report. About how many of the 10 were in a room where the test could even be run?
    answer: 2.2
    tolerance: 0.1
    hint: First find the share of arrests in rooms with shelves.
    explanation: |
      The share in rooms with shelves is $1-0.78=0.22$, so the expected number is $10\times 0.22=2.2$. In practice, only a couple of reports would have had a target to read, so a null result rests on very few chances.

  - type: mcq
    id: zero-hits
    title: "What a null result means"
    prompt: |
      Suppose reports of seeing from above are real perceptions, but only 2 of 10 reporters were in rooms with a hidden target, and each of those 2 reads it with a modest chance. Suppose instead the reports are produced by the brain alone. In both cases the likely outcome is that no one reads the target. What does "no one read the target" show?
    options:
      - text: 'It refutes the reading that people perceive from above.'
        feedback: |
          Under that reading, no hits are still likely when so few targets can be tested. A result that is likely under both readings changes the odds very little.
      - text: 'It confirms the reading that people perceive from above, because the hidden targets were out of view.'
        feedback: |
          Missing targets do not confirm anything. They only mean the test had little power. A result that fits both readings equally well cannot favour either.
      - text: 'It is weak evidence either way: the result is likely under both readings, so it hardly moves the odds. A larger test with many targets in view could do more.'
        correct: true
        feedback: |
          Yes. In the odds form of Bayes'' rule, evidence favours a reading only through the ratio $P(E\mid H_A)/P(E\mid H_B)$, and when that ratio is near 1 the odds barely change.
    explanation: |
      This is why design matters: a test is informative when the readings predict different outcomes. In AWARE the readings predicted nearly the same outcome, no hits, because so few targets were in view.

  - type: numeric
    id: lr
    title: "A likelihood ratio"
    prompt: |
      A made-up case. Two reporters were in rooms with a hidden target. Under reading A (they perceive from above), each reads the target with probability $0.3$, independently. Under reading B (the brain produces the experience), neither can. The observed result $E$ is that neither read it. Using $\mathrm{LR}=P(E\mid H_A)/P(E\mid H_B)$, what is LR?
    answer: 0.49
    tolerance: 0.01
    hint: Under A, each reporter fails with probability $1-0.3$; under B, failing is certain.
    explanation: |
      Under A, $P(E\mid H_A)=0.7\times0.7=0.49$. Under B, $P(E\mid H_B)=1$. So $\mathrm{LR}=0.49$. Even though no one read the target, the odds in favour of A are only cut roughly in half, not wiped out. With 20 reporters in rooms with targets the same reasoning would give $0.7^{20}\approx0.001$, and a null would then count heavily against A (with those made-up numbers).

  - type: mcq
    id: counts-as
    title: "What would count"
    prompt: |
      A future study places a randomly chosen picture on a ceiling shelf after each patient is admitted and sealed from the room's staff, and many arrests happen in these rooms. Which result would be hardest for the reading that the brain alone produces the experience?
    options:
      - text: 'Many survivors describe the resuscitation in general terms.'
        feedback: |
          Hearing and bodily awareness can give general descriptions, and teams follow standard routines that people can guess. This is what both readings expect, so it does not discriminate between them.
      - text: 'Several survivors who report seeing from above name the hidden picture correctly, and survivors who do not report it never do.'
        correct: true
        feedback: |
          Yes. The brain-state reading predicts chance-level naming, since the picture was out of sight. Matching a random picture, with controls and records made before the interviews, would be hard to explain without an extra route to the information. Defenders of the brain reading would then look for leaks, such as a staff member seeing the picture.
      - text: 'Survivors report that the experience felt more real than ordinary life.'
        feedback: |
          Felt realness is a feature of the report, and psychedelics, dreams and brain stimulation also produce it. It does not separate the readings.
    explanation: |
      An informative test has a prediction that one reading makes and the other does not, and it controls leaks. The result must also be recorded before the interviews, so it cannot be fitted afterwards.

  - type: order
    id: design-order
    title: "Order a hidden-target test"
    prompt: Put the steps of a hidden-target test in a sensible order.
    steps:
      - 'Place randomly chosen pictures on shelves in the rooms where arrests are likely, out of view from the floor.'
      - 'Resuscitate patients as usual and note in which room each arrest happened.'
      - 'Interview survivors, asking open questions about what they perceived.'
      - 'Compare each described target with the true picture, and count matches.'
      - 'Compare the match rate with the rate expected by chance.'
    hint: A result is only as good as the records made before anyone knows the outcome.
    explanation: |
      Targets are fixed first and picked at random, so the targets cannot be guessed. Interviews come after, with open questions, so that matches are not led. The match rate is then judged against chance.

  - type: text
    id: reading-brain
    title: "Reading one: the dying brain"
    body: |
      **According to physicalists** such as Mobbs and Watt, an NDE is the experience of an impaired but active brain: low oxygen, stress chemicals and misfiring regions explain the tunnel, the light and the sense of leaving the body, and the stimulation and REM results show brain routes to each part. This is a reading that makes use of known mechanisms, and its best defenders say the proposal is testable.

      The best objection comes from Bruce Greyson, Edward Kelly and colleagues. They argue that near-death accounts can be vivid, orderly and clear-thinking during periods when brain function should be badly reduced, and that no existing physical account covers all the features at once (Greyson, Holden and van Lommel replied in 2012 to Mobbs and Watt along these lines). The best reply is that nobody knows when during the episode the experience occurred: it may have been formed as the brain was recovering, when activity could have returned, and memories of such a time can be reconstructed. The AWARE II recordings of activity returning during resuscitation are consistent with that reply.

  - type: text
    id: reading-mind
    title: "Reading two: mind not reduced to brain"
    body: |
      **According to Greyson, Kelly and colleagues** (*Irreducible Mind*, 2007), the brain may act more as a filter or channel for mind than as its producer, an idea they trace to F. W. H. Myers and William James. On this reading, a disturbed brain might loosen the filter and let in more, so vivid experience at a time of weak brain function is not a paradox.

      The best objection: damage to the brain changes the mind in specific, reliable ways, and a filter model must explain why, and say what result would count against it, or it fits any outcome. Reviewers of the book also said it leaned on anecdotal reports. The best reply is that a filter model predicts that dependence (a damaged filter transmits differently), and that the reading is testable by the same hidden-target design, whose positive result it would need and whose long run of null results would count against it.

      Both readings agree on the observations so far. They disagree about which hypothesis the observations support, and about what the burden of proof is, which depends on a prior commitment about what minds are.

  - type: mcq
    id: layers-final
    title: "Sorting claims"
    prompt: |
      Sort three claims. (a) Stimulating the right angular gyrus in one patient produced a sensation of seeing herself from above. (b) A dying brain can fully explain every feature of near-death reports. (c) The mind continues after the brain stops. Which sorting fits the three layers?
    options:
      - text: '(a) established fact, (b) live debate, (c) commitment.'
        correct: true
        feedback: |
          Yes. (a) is a reported experimental result, (b) is debated because the explanations cover some features and the data are limited, and (c) rests on a premise about minds that these data neither confirm nor exclude.
      - text: '(a) live debate, (b) established fact, (c) commitment.'
        feedback: |
          (b) is not settled: the proposed mechanisms cover parts of the pattern, and defenders of the other reading dispute that they cover all of it. (a) is a firmer result.
      - text: '(a) established fact, (b) commitment, (c) live debate.'
        feedback: |
          Whether brain explanations suffice is an empirical question that more studies can address, so (b) is not a mere commitment. (c) turns on a view about what minds are, which is a commitment.
    explanation: |
      Someone can accept (a) and reject (c), or accept (a) and (c) together. The three claims are logically separate.

  - type: text
    id: summary
    body: |
      **Next:** Mediumship and Trance. Another state, where a person speaks as if a different mind were using their voice, brings equally strong claims. We look at historical cases, how a skilled performer can seem to know hidden facts, dissociation, and the tests that were tried on mediums.
