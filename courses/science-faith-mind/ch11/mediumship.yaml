id: ch11-mediumship
title: "Mediumship and Trance"
kind: concept
own: |
  The setting: a sitting in which a **medium** (a person who says they receive messages from the dead) gives a reading to a **sitter** (the person who attends), and the question of how such readings can be explained and how they can be tested.
  - **Cases.** According to Spiritualists, the Fox sisters' raps (1848) began modern communication with the dead; according to Margaret Fox's 1888 statement, she made them with her joints, a statement she withdrew in 1889. According to Richard Hodgson, the Boston medium Leonora Piper gave information she could not have had normally; according to William James, telepathy was the better explanation. According to Théodore Flournoy (1900), the "Martian" messages of Hélène Smith came from her own unconscious mind. According to Allan Kardec (1857), spirits answer questions through mediums.
  - **Chance fit.** If one statement fits a random person with probability $p$, a reading of $n$ independent statements is expected to fit
  {{ $$\text{expected fits}=n\,p$$ }}
  so ten statements that each fit 40% of people give 4 fits by chance alone.
  - **Why satisfaction is weak.** A vague statement that sounds personal but fits almost everyone is called the {{ **Barnum (Forer) effect** }}; in Forer's 1949 demonstration students rated one text, the same for all, at 4.26 out of 5. A sitter's feeling of recognition does not show that the medium knew anything.
  - **Two explanations of trance.** According to the spirit view of Spiritism, a spirit uses the medium. According to the sociocognitive view, a learned role plus **dissociation** (a split among normally joined functions such as memory, identity and sense of control) produces a real experience of being spoken through, with the content coming from the person. Automatic writing and table tilting can be produced by the **ideomotor effect**, small movements made without intending them (Faraday, 1853).
  - **A blinded test.** If a sitter must choose which of two transcripts, the one meant for them or a control, fits better, and chooses at random, then all $m$ choices are right with probability
  {{ $$P=\left(\tfrac12\right)^{m}$$ }}
  - **Strength of evidence.** Let $E$ be the result, $H_A$ the reading that information reached the medium by a non-ordinary channel, and $H_B$ the reading that it came from ordinary means (cold reading, prior information, chance, judging bias). The result favours $H_A$ over $H_B$ by
  {{ $$\mathrm{LR}=\frac{P(E\mid H_A)}{P(E\mid H_B)}$$ }}
  Even a clean positive result could not separate survival of the dead from information gained by the living (the authors call this super-psi).
  - **Three layers.** That people have these experiences, and that sitters are easily satisfied by vague statements, is established; whether any blinded result exceeds chance is a live debate; whether the dead communicate is a commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: how can a stranger know?"
    prompt: |
      Guessing is the point; no theory yet. You visit a stranger who says they speak with the dead. After an hour they say: "There is an older man close to you, gone some years now, who worried about his chest." You feel a chill, because it fits your grandfather. What is the best first move in thinking about it?
    options:
      - text: 'It fits, so the stranger must have received it from your grandfather.'
        feedback: |
          This is how many sitters and many mediums read it, and the lesson gives that view its best form. But the fit alone cannot decide, because we have not yet asked how many people such a sentence would fit.
      - text: 'It is a trick, so there is nothing to study.'
        feedback: |
          Even if tricks explain a great deal, someone has to say which tricks, how they work and what a test that excludes them would show. "Only a trick" is also a claim that needs evidence.
      - text: 'Ask what else could produce that sentence (cues, vague statements, prior information, a real channel) and what test would tell them apart.'
        correct: true
        feedback: |
          Yes. A sincere sitter can feel a real chill and the stranger can be sincere too, and we can still ask what produced the sentence and how to find out.
    explanation: |
      The lesson sorts the claims into three layers: what is established, what scholars debate, and what rests on a commitment.

  - type: text
    id: recall
    title: "Recall: states, correlates, expectation, likelihood ratio"
    body: |
      Recall: according to Charles Tart (1972), a **state of consciousness** is an overall pattern of how the mind functions (attention, memory, sense of self, sense of control). A brain measure that changes with an experience is a **correlate**, not yet an explanation, and a measured effect can mix the thing studied with the **expectation** people bring to it. Every claim sits in one of three layers: **established fact**, **live debate** or **commitment**.

      From the lesson Near-Death and Out-of-Body Experiences: the strength of a result for a hypothesis $H_A$ against a rival $H_B$ is the **likelihood ratio**

      $$\mathrm{LR}=\frac{P(E\mid H_A)}{P(E\mid H_B)}$$

      where $E$ is what was observed and $P(E\mid H)$ is the probability of seeing it if $H$ were true. A ratio near 1 means the result barely separates the two. Mediumship is a good place to use it, because the same reading can come from very different causes.

  - type: text
    id: fox
    title: "Hydesville, 1848"
    image:
      src: img/fox.webp
      alt: "Old photograph of three women in dark dresses, the Fox sisters, seated and standing close together"
      caption: "The Fox sisters (Leah, Kate and Margaret), whose raps in 1848 started the movement called Spiritualism."
      credit: "unknown, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Fox_sisters.jpeg"
    body: |
      Mediumship is far older than any one case, but modern Western mediumship starts with a house in Hydesville, New York. According to the account in the Society for Psychical Research's encyclopedia, percussive sounds were first heard in the Fox family home towards the end of March 1848. The two younger sisters, Margaret (Maggie) and Kate, were girls of roughly eleven and fourteen (sources differ on ages). **Spiritualism**, the belief that the living can communicate with the dead, then spread in the United States and Britain.

      On 21 October 1888 Margaret read a statement at the New York Academy of Music, first published that morning in the *New York World*, saying the raps had been made on purpose. She said Kate had found they could make sounds with their joints, and by the toes. In November 1889 Margaret withdrew the confession, saying it had been made under pressure from opponents of Spiritualism. Kate died in 1892 and Margaret in 1893.

  - type: mcq
    id: fox-q
    title: "What the confession shows"
    prompt: |
      In 1888 Margaret Fox said the Hydesville raps were made by cracking joints; in 1889 she withdrew this, saying she had been pressured. Which analysis is fair?
    options:
      - text: 'The confession proves that all later mediumship is fraud.'
        feedback: |
          It concerns one set of raps, in one family. Even if it is accepted in full, it says nothing about a different medium using a different method.
      - text: 'It is one witness with possible motives on both sides (money, pressure, belief), so it is evidence about the raps, not a settled verdict, and it does not reach other mediums.'
        correct: true
        feedback: |
          Yes. Skeptics cite the confession and note that the raps can be produced by joint cracking; Spiritualists say it was recanted and that the sisters' age makes it doubtful. Both can agree that the question of how the raps were made is open to testing.
      - text: 'The recantation cancels the confession, so the raps were real.'
        feedback: |
          A withdrawn statement is not proof of the opposite. It leaves two conflicting statements by the same person, and the question has to be answered by a test of how the sounds can be made.
    explanation: |
      Keeping apart the claim (the raps were spirit communication), the report (what the sisters said at different times) and the interpretation (what that shows) is the first step with every case in this lesson.

  - type: text
    id: piper
    title: "Leonora Piper, Boston"
    image:
      src: img/piper.webp
      alt: "Old photograph of Leonora Piper, a woman with her hair pinned up, in a dark dress"
      caption: "Leonora Piper (1859-1950), a Boston trance medium studied for years by William James and Richard Hodgson."
      credit: "Anonymous (photography), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Leonorapiper.jpg"
    body: |
      A **trance medium** is a person who appears to lose their usual self and speak or write as another being, called a **control** or communicator. Leonora Piper (1859-1950; some sources give 1857) was the most studied one. According to the Psi Encyclopedia of the Society for Psychical Research (founded in London in 1882, with Henry Sidgwick as its first president, to study such claims scientifically), William James had a sitting with her after relatives visited her in autumn 1885, and he came to think she knew things she could not have learned normally. He did not conclude that spirits were speaking, and favoured telepathy (the supposed passing of thought from one mind to another without the senses). In essence, James said that one white crow is enough to disprove the rule that all crows are black, and he regarded Piper as his candidate (wordings of this remark vary, so it is paraphrased here).

      Richard Hodgson, an Australian-born investigator, held his first sitting with Piper on 4 May 1887 without giving his name, and studied her for years. Myers reports that Hodgson had private detectives follow Piper and her husband for weeks and found nothing suspicious. According to Hodgson's report of 1897, the sittings convinced him that she communicated with the dead, especially the "George Pelham" personality, who appeared in 1892 and recognised many acquaintances of the young writer George Pellew, who had died that year. Critics noted that her earlier control "Phinuit" seemed to fish for information, and the psychologist G. Stanley Hall, after six sittings in 1909, concluded that she was an unusual case of a secondary personality with no sign of the paranormal.

  - type: text
    id: smith
    title: "Hélène Smith and a language of Mars"
    image:
      src: img/flournoy.webp
      alt: "Title page of Théodore Flournoy's book Des Indes à la planète Mars, 1900"
      caption: "The title page of Flournoy's study of a medium who spoke of lives in India and on Mars; he traced the contents to her own mind."
      credit: "Théodore Flournoy, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Th%C3%A9odore_Flournoy_Des_Indes_%C3%A0_la_plan%C3%A8te_Mars_1900_Title.jpg"
    body: |
      Théodore Flournoy (1854-1920), professor of psychology at the University of Geneva, attended for about five years the sittings of a medium he called Hélène Smith (the pseudonym of Catherine Müller, 1861-1929). In his book *Des Indes à la planète Mars* (*From India to the Planet Mars*, 1900; some sources give 1899) he described her trance personalities. One was an Indian princess of the fifteenth century, another spoke a "Martian" language. According to Flournoy, the Martian language turned out to be built on the structure of French, and he explained the whole as creations of her **subliminal** (below the level of awareness) mind, along with **cryptomnesia**, a hidden memory that returns without being recognised as a memory.

      So the same kind of trance that Hodgson read as contact with the dead, Flournoy read as the mind composing characters. Newspapers, for their part, sometimes read his book as support for her claims, and Hélène Smith, who disliked his reading, broke off their relation after it appeared.

  - type: text
    id: kardec
    title: "Kardec and Spiritism"
    body: |
      **Spiritism** is a different tradition from English-speaking Spiritualism, and it deserves to be described as its followers describe it. According to Spiritists, Allan Kardec put written questions about life and the universe to spirits through two young mediums, and the answers, received by table raps and planchette (a small board that writes), were compiled in *Le Livre des Esprits* (*The Spirits' Book*, 18 April 1857, 1,018 questions and answers). Spiritism teaches that spirits improve through many lives (reincarnation) and that mediums can communicate with spirits, within a moral teaching in a Christian setting. Kardec defined it as a science of the nature, origin and destiny of spirits. Today Brazil is its largest centre, with a 2010 census count of over 3.8 million Spiritists.

      Historians treat it as a nineteenth-century movement and study it as such; this lesson reads its claims as claims: what is said, what could test it. It does not take them lightly, and it does not settle them by label.

  - type: text
    id: cold
    title: "Cold reading, hot reading, and the Barnum effect"
    body: |
      How could a sincere or a skilled person say things that seem to fit a stranger? Skeptical researchers describe three routes that need no special channel.

      A **cold reading** is a technique in which a performer uses what can be seen and heard in the sitter (age, clothes, reactions to guesses) and makes statements that fit many people, adjusting when the sitter's face or words answer them. A **hot reading** uses information gathered in advance (talk beforehand, records, a helper). And the **Barnum effect**, also called the Forer effect, is the habit of rating vague, general statements as a close description of oneself. According to Bertram Forer's classroom study (1949, *Journal of Abnormal and Social Psychology*), he gave each student the same paragraph of general statements, taken from an astrology column and said to be based on a personality test, and the students rated how well it fitted them from 0 to 5. The mean rating was 4.26. The term Barnum effect is credited to Paul Meehl (1956).

      None of this says that every mediumistic reading is cold reading. It says what a test has to exclude before a hit means anything.

  - type: numeric
    id: chance-fit
    title: "Chance fits"
    prompt: |
      A reading makes 10 statements about the sitter's late father, each vague, such as "he had trouble with his health" or "there was an argument that was never settled". Suppose each statement fits a randomly chosen person with probability 0.4, independently of the others. How many statements are expected to fit by chance alone?
    answer: 4
    hint: Expected count is the number of statements times the chance each fits.
    explanation: |
      With $n=10$ statements, each fitting with probability $p=0.4$, the expected number of fits is $np=10\times0.4=4$. So four hits would not surprise anyone, and a sitter who remembers those four and forgets the six misses will feel the reading was accurate. A reading is worth noticing only if it beats what vague statements would give anyway.

  - type: mcq
    id: satisfied
    title: "A satisfied sitter"
    prompt: |
      After a sitting, a sitter says: "She told me things nobody could possibly have known." Why is this weak evidence that the medium received information from outside?
    options:
      - text: 'Because grieving people always lie about what they heard.'
        feedback: |
          Most sitters are sincere. The problem is not honesty but how recall and fitting work: a sincere person can feel sure and still be mistaken about what was specific.
      - text: 'Because the feeling of fit does not show how many other people the same statements would fit, nor how many misses were forgotten, nor how much the sitter supplied.'
        correct: true
        feedback: |
          Yes. A statement can feel exact because the sitter's mind fills in the detail, and people count hits more than misses. What is needed is a comparison: how well the same reading fits someone else.
      - text: 'Because sitters are never satisfied by a real medium.'
        feedback: |
          This is not the point. A real channel could produce satisfaction too. The point is that satisfaction appears with or without one, so it cannot tell them apart.
    explanation: |
      A measurement that comes out high under both hypotheses has a likelihood ratio near 1. Satisfaction is such a measurement, which is why research uses controls, shown in the cards ahead.

  - type: text
    id: dissociation
    title: "Trance and dissociation: two views"
    body: |
      The experience of the medium is real as an experience: many report that the words come without their intending them. What is it?

      **Dissociation** is a split among functions that usually work together (memory, identity, perception, sense of control). It runs from everyday absorption in a film to rare disorders. According to Spiritism and other traditions of mediumship, the trance is the state in which a spirit can use the medium's voice or hand, and mediumship is a faculty that can be trained and used well or badly. According to the **sociocognitive** view met in the lesson A Map of Conscious States for hypnosis, a person who has learned what a medium is, from a culture, a group and a teacher, enacts that role, and the experience of being spoken through is a real one produced by expectation and dissociation, with the content drawn from the person's own memory and imagination.

      The two views are not tested by feelings, which agree with both. They differ in what each would let us find. Peres and colleagues (2012, *PLoS ONE*) scanned ten psychographers (mediums who write in trance) with SPECT (a scan of blood flow in the brain) while they wrote in trance and in an ordinary state. In the experienced group, activity in several regions, including the left hippocampus, the left anterior cingulate and the right superior temporal gyrus, was lower during psychography than during normal writing. The authors called the result preliminary.

  - type: mcq
    id: dissociation-q
    title: "What the scan can show"
    prompt: |
      A scan study found that experienced mediums writing in trance had lower activity in some brain regions than when writing normally. What does this fairly show?
    options:
      - text: 'That a spirit is guiding the hand, because the brain is quiet.'
        feedback: |
          A quiet region is a correlate. A sociocognitive reader expects a change of attention and self-monitoring in any trance, with no spirit at all, so the same scan fits both views.
      - text: 'That the writing is faked, because the brain changes.'
        feedback: |
          The changed activity does not show deception. People in absorbed or automatic states show changes too. It shows that the trance state differs measurably from ordinary writing, no more.
      - text: 'That trance writing differs from ordinary writing in measurable brain activity, which both views can accept, without telling what the source of the content is.'
        correct: true
        feedback: |
          Yes. The scan describes the state (a correlate), and the question of where the content comes from needs a different kind of test, one that checks the content against facts the medium could not have had.
    explanation: |
      State measures and content tests answer different questions. This is the same distinction as between a correlate and an explanation in the lessons on meditation and on psychedelics.

  - type: text
    id: ideomotor
    title: "Automatic writing and moving tables"
    body: |
      In the early 1850s sitters in Europe and America rested their hands on a table and it tilted or turned, sometimes spelling out messages. In 1853 Michael Faraday tested this. According to the report published in *The Times* on 30 June 1853, he fitted a light lever that showed whether the table or the hands moved first, and found that the sitters' hands moved the table, without their knowing it. This is called **unconscious muscular action**. William Carpenter, a physiologist, had described a year earlier (1852) what is now called the **ideomotor effect**: the thought of a movement, or an expectation, can set off small muscle movements that the person does not feel as chosen.

      The same effect can drive a planchette or a pointer on a letter board, and automatic writing (writing that seems to happen without intent). According to those who defend mediumship, this explains tilting and pointing, but not messages that contain facts the sitters did not know. The Psi Encyclopedia also notes that Faraday's work could not account for reports of tables moving without being touched.

  - type: mcq
    id: ideomotor-q
    title: "Ideomotor or outside source?"
    prompt: |
      A group with fingers on a pointer spells out the name of a sitter's dead friend. Which test best separates an ideomotor explanation from an outside source?
    options:
      - text: 'Ask the group whether they felt they were pushing.'
        feedback: |
          The ideomotor effect is, by definition, movement not felt as chosen. Feelings of not pushing are exactly what both views predict.
      - text: 'Ask a question whose answer no one present knows and that can be checked afterwards, with the letters hidden from the sitters.'
        correct: true
        feedback: |
          Yes. If the sitters' expectations drive the pointer, they can spell only what someone present knows or guesses, and with the letters hidden they cannot steer it. A correct answer to a question that nobody knew would count for an outside source, and a record of wrong or merely plausible answers would count against it.
      - text: 'Repeat the session with more people.'
        feedback: |
          More people give more hands and more expectations, which strengthens the ideomotor route. The test has to change what the sitters can know or see.
    explanation: |
      A good test makes the two explanations predict different things. Chance and ideomotor movement predict answers limited to what the sitters know; a real outside source predicts that it can go beyond.

  - type: text
    id: tests
    title: "Tests of mediums"
    body: |
      Tests grew more careful over time. Hodgson's early work with Piper used anonymous sitters and detectives; Hall's later sittings looked for a secondary personality. In modern studies the aim is to remove each ordinary route, so that only a real channel could give a hit.

      According to Beischel and Schwartz (2007, *Explore*), eight mediums who had earlier shown accuracy in a lab gave readings about eight deceased people for sitters who were absent. An experimenter who knew nothing of the sitters or the deceased served as a proxy sitter, so the medium could not get cues from a face or from feedback (a **triple-blind** design: medium, experimenter and rater all unaware of who is who). Each deceased person was paired with a different one, and each sitter got two transcripts, the one meant for them and the control, and scored both and chose which fitted. The authors report higher ratings for the intended readings ($p=0.007$) and above-chance choices ($p=0.01$). In 2015 Beischel and colleagues reported a replication with 20 mediums and 86 readings.

      The limits matter. The mediums were chosen because they had done well before; the sitters (university students) were chosen for an openness to the idea of an afterlife; the first study was small; and the authors themselves say that the result cannot tell survival of the dead from **super-psi** (the living gaining information by some psychic route). According to O'Keeffe and Wiseman (2005, *British Journal of Psychology*), who built a method meant to avoid the weaknesses of earlier studies and tested several professional mediums, the results did not support the existence of genuine mediumistic ability. Whether the positive results hold up under independent repetition is the question of the next lesson.

  - type: order
    id: design
    title: "Design of a blinded reading"
    prompt: Put the steps of a blinded reading in a sensible order, so that cues from the sitter cannot help the medium and the sitter cannot tell which reading is theirs.
    steps:
      - 'A helper who never meets the medium collects facts about each sitter''s deceased person.'
      - 'Two deceased people who clearly differ (age, cause of death, hobbies) are paired, so a control reading exists.'
      - 'A medium who knows nothing of the sitters gives a reading about one person by phone to a proxy who also knows nothing, answering fixed questions.'
      - 'The reading is typed out, with the items listed.'
      - 'Each sitter receives two typed readings in random order, the one meant for them and the control, scores each and chooses the better fit.'
      - 'The choices are compared with the 50% expected by chance.'
    hint: Facts first, then pairing, then the blind reading, then judging, then comparison with chance.
    explanation: |
      Collecting facts away from the medium prevents hot reading, the proxy and the phone prevent cold reading, and the pair of transcripts means vague statements that fit everyone fit both readings and cancel out. Only the comparison with chance makes the result a number.

  - type: numeric
    id: chance-picks
    title: "Choosing at random"
    prompt: |
      In a blinded design, each of 6 sitters must pick which of two transcripts, the one for them or a control, fits better. If every sitter picks at random, with probability $\tfrac12$ each, what is the probability that all 6 pick the intended one? Give a decimal or a fraction.
    answer: 0.015625
    tolerance: 0.0005
    answerText: '1/64'
    hint: Multiply the chance for each sitter.
    explanation: |
      Independent picks multiply: $\left(\tfrac12\right)^6=\tfrac1{64}\approx0.0156$, about 1.6%. A result this lucky would happen by chance once in 64 such studies, which is why a small number of sitters can already be informative, and also why a handful of runs, some unreported, can produce one lucky study.

  - type: numeric
    id: lr-readings
    title: "A likelihood ratio"
    prompt: |
      In the design above, let $E$ be "all 6 sitters picked the intended transcript". Let $H_B$ be ordinary means only (the chance computed above, $\tfrac1{64}$). Let $H_A$ be a real channel, and suppose that if it were real, the probability of $E$ would be 0.5 (the information is often unclear). What is $\mathrm{LR}=P(E\mid H_A)/P(E\mid H_B)$?
    answer: 32
    hint: Divide 0.5 by the probability of $E$ under chance.
    explanation: |
      $\mathrm{LR}=0.5\div\tfrac1{64}=32$. The result is 32 times more probable under a real channel than under chance. This is strong in favour of $H_A$ **against that particular rival**. It does not say $H_A$ is probable, because the prior odds matter, and because $H_B$ here covers only chance and not leaks, errors in the procedure, or unreported studies that came out differently. A critic and a believer will start from very different prior odds, and so may part ways even on the same data.

  - type: text
    id: readings
    title: "Two readings, each with an objection"
    body: |
      **According to the survival view**, held by Hodgson and by Spiritists, some readings contain information that the medium could not have had and that fits the communicators who claim to speak, as in the Pelham case. The best objection: the information could come from the living, either the sitters' memories by telepathy (William James's view) or any psychic source (super-psi), and then it shows a strange ability of the living, not survival. The best reply of the survival view: the more elaborate such a reach has to be (tapping the minds or records of many people at a distance, selecting the right ones), the less it differs from survival in practice, and it should itself be testable. A critic answers that this reply makes the two views hard to separate, and that is exactly what the results show.

      **According to the sociocognitive and subliminal view**, held in essence by Flournoy and later skeptical researchers, the content comes from the person's own memory and imagination, shaped by the roles and expectations around them, together with cold reading and the Barnum effect for what sitters add. The best objection: this was shown for cases like Hélène Smith, but it does not by itself account for blinded results above chance, if those are real. The best reply: those results are few, small, with selected mediums, and have not yet been reproduced by independent skeptical teams (O'Keeffe and Wiseman found none), so the explanation has not yet been asked to cover them.

      Both views agree on the observations: sincere people, vivid experiences, and some blinded results that are disputed. They disagree about how to weigh the disputed results and what the burden of proof is, which depends on a prior view about minds.

  - type: mcq
    id: layers-final
    title: "Sorting claims"
    prompt: |
      Sort three claims. (a) Students who were given one and the same general personality text rated it, on average, 4.26 out of 5 as a description of themselves. (b) Blinded readings by selected mediums exceed chance. (c) The dead communicate through mediums. Which sorting fits the three layers?
    options:
      - text: '(a) established fact, (b) live debate, (c) commitment.'
        correct: true
        feedback: |
          Yes. (a) is a repeated experimental result; (b) is reported by some studies and not found by others, so it is debated; (c) rests on a premise about minds and death that no single result here confirms or excludes.
      - text: '(a) live debate, (b) established fact, (c) commitment.'
        feedback: |
          (b) is not established: the results come from a few small studies with selected mediums and are contested. (a) has been repeated many times.
      - text: '(a) established fact, (b) commitment, (c) live debate.'
        feedback: |
          Whether blinded results exceed chance is an empirical question that further studies can settle, so (b) is not a commitment. (c) turns on what minds are, which is a commitment even when argued carefully.
    explanation: |
      A person can accept (a), doubt (b) and hold (c) on other grounds, or reject (c) and still find (b) puzzling. The three claims are logically separate.

  - type: text
    id: summary
    body: |
      **Next:** Parapsychology and the Replication Problem. If a study of telepathy or of mediums reports a result above chance, how often does it come out again when others repeat it? We look at the claims of telepathy and precognition, the studies of Daryl Bem, statistical power, and what the failure of many results to replicate taught science about itself.
