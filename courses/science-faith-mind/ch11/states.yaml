id: ch11-states
title: "A Map of Conscious States"
kind: concept
own: |
  The setting: one person's ordinary day and night, and the question of what changes in the brain and in experience when the person is awake, dreaming, lucidly dreaming, in flow, or hypnotised. A **state of consciousness** is, according to Charles Tart (1972), an overall pattern of how the mind functions (attention, memory, sense of self, control), and not a single feature or a single piece of content.
  - **Sleep is a cycle, and dreams are not only REM.** Eugene Aserinsky and Nathaniel Kleitman (1953) found periods of rapid eye movement (REM) in sleep, in which sleepers woken up often reported dreams. Adult sleep alternates REM and non-REM stages in cycles of about $90$ minutes. According to Siclari and colleagues (2017), dreaming of any kind, in REM or not, goes with a drop of slow activity in a posterior "hot zone" of the cortex:
  {{ $$\text{dream report}\ \Leftrightarrow\ \text{posterior hot zone active}$$ }}
  - **Two views of the dream.** According to Hobson and McCarley (1977), dreams are the forebrain's story built from brainstem signals during REM. According to the later findings, a dream is better tied to a posterior cortical zone than to a sleep stage.
  - **Lucid dreaming is checked by signals.** A lucid dream is a dream in which the dreamer knows it is a dream. Since a report made after waking could be a false memory, researchers (Hearne 1975, LaBerge and colleagues 1981) asked dreamers to send a pre-agreed eye signal during REM sleep and compared it with the recorded sleep. In a 2021 study of two-way communication, dreamers answered correctly in $18.4\%$ of $158$ attempts, so
  {{ $$0.184\times158\approx 29\ \text{correct answers}$$ }}
  and the most common outcome was no response.
  - **Flow.** According to Mihaly Csikszentmihalyi (1990), flow is complete absorption in an activity, and it needs a balance between challenge and skill:
  {{ $$\text{flow}\ \Leftarrow\ \text{challenge}\approx\text{skill}$$ }}
  If the task is far too easy or far too hard, flow does not occur. Arne Dietrich (2003) proposed that altered states share a temporary reduction of activity in prefrontal cortex (transient hypofrontality); that is a hypothesis, not a settled result.
  - **Trance and hypnosis.** The state view (Hilgard's neodissociation) says hypnosis divides the control systems of the mind. The sociocognitive view (Kirsch, Lynn, Spanos) says ordinary expectation, role and motivation explain it. Both can read the same result, such as the 2005 study by Raz, Fan and Posner in which a suggestion reduced the Stroop colour-word conflict (and conflict activity in the anterior cingulate cortex) in highly suggestible people.
  - **Three layers.** That brain activity and experience change across these states is established fact. Whether hypnosis is a special state is a live debate. Whether any state gives access to a reality beyond the brain is a metaphysical commitment, which later lessons examine by naming what each claim predicts.
cards:
  - type: mcq
    id: hook
    title: "Guess: a brain that dreams"
    prompt: |
      Guessing is the point here; no theory yet. A person is deep in a vivid dream, lying still with eyes closed, not responding to anyone in the room. What is the brain most probably doing?
    options:
      - text: 'Switched off, like a computer in standby, until the person wakes.'
        feedback: |
          This is the old everyday picture. The dreamer's experience (images, fear, plot) happens at that moment, so something in the brain is clearly working, even if the body is still and the outside world is shut out.
      - text: 'Active, with its own internal activity producing the experience, while input from the senses and output to the muscles are largely cut off.'
        correct: true
        feedback: |
          This is the picture sleep research arrived at, and the lesson shows how it was found and what is still disputed.
      - text: 'Exactly as active as when awake, with no difference at all.'
        feedback: |
          If waking and dreaming looked the same from inside and outside, nobody would ever doubt which they were in. The brain is active, but the pattern differs, and the differences are what the lesson maps.
    explanation: |
      A dreamer is not simply "off" and not simply "awake". The lesson maps the several states between, using three layers throughout: what is established, what is debated, and what is a commitment beyond the data.

  - type: text
    id: state
    title: "What is a state of consciousness?"
    body: |
      Consciousness here means experience: what it is like to be someone at a moment. Two things can vary. The **content** is what you experience (a face, a thought). The **state** is the overall way your mind is working while you have it. According to Charles Tart (1972, in *Science*), a state of consciousness is defined by the overall patterning of psychological functioning (attention, memory, sense of self, sense of control), and not by one behaviour, one brain measure or one content.

      On this view thinking about lunch while awake is a change of content, while dreaming of lunch is a change of state, because dreaming changes how attention, memory and self work. The word **altered** only means "different from ordinary waking". It does not say better, worse or more real.

  - type: mcq
    id: state-q
    title: "Content or state?"
    prompt: |
      According to Tart's idea of a state as an overall pattern of mental functioning, which change is most clearly a change of *state* and not only of content?
    options:
      - text: 'An awake person stops looking at a tree and looks at a river.'
        feedback: |
          Only the content changed. Attention, memory and sense of self are working in the usual way.
      - text: 'An awake person, still reasoning normally, remembers a holiday.'
        feedback: |
          A different content again; remembering is a normal waking function.
      - text: 'A person falls asleep and dreams: attention turns inward, the sense of self and of control changes, and later memory of the experience is poor.'
        correct: true
        feedback: |
          Yes. Several functions change together, which is what makes it a different pattern.
    explanation: |
      A state is a package of functions, which is why researchers compare states by many measures at once (brain activity, reports, behaviour). Whether each state is a sharp category or a range is itself debated.

  - type: text
    id: sleep
    title: "Sleep is a cycle, and the eyes gave it away"
    image:
      src: img/hypnogram.webp
      alt: "A hypnogram chart: sleep stage against time from midnight to about seven in the morning, stepping between NREM 1 to 3, REM and brief awakenings"
      caption: "A hypnogram plots the stage of one night's sleep over time, here with deep non-REM sleep early in the night and REM episodes marked in red."
      credit: "RazerM, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Sleep_Hypnogram.svg"
    body: |
      Sleep looks like one long blank from outside. In 1953 Eugene Aserinsky and his supervisor Nathaniel Kleitman published in *Science* that sleep contains regular periods when the eyes move rapidly under the lids. Sleepers woken in those periods often said they had been dreaming. This is **rapid eye movement (REM) sleep**. Sleep without it is **non-REM (NREM)**, in stages from light (1) to deep (3).

      Through the night the two alternate in cycles of roughly 90 minutes in an adult, as the chart shows. During REM the body's muscles are almost completely paralysed (REM atonia), so the sleeper lies still while the experience goes on. The eyes are the visible exception, and that will matter for lucid dreaming below.

  - type: mcq
    id: sleep-q
    title: "Why wake them?"
    prompt: |
      Aserinsky and Kleitman saw bursts of eye movement in sleepers' recordings and woke sleepers during them to ask what they had been experiencing. Why was this a sensible method for studying dreaming?
    options:
      - text: 'It lets the experimenter see the dream directly on the recording.'
        feedback: |
          Nothing in the recording shows the dream's content. Only the sleeper can say what the experience was.
      - text: 'A recording marks when something is happening in the brain, and a report right after gives the best available access to experience; comparing reports from woken and unwoken periods ties the two together.'
        correct: true
        feedback: |
          Yes. Brain recordings give timing and reports give content. The method rests on trusting reports, which have limits (memory fades, reports can be shaped by the question).
      - text: 'Dreams only happen in the seconds just before waking, so waking sleepers captures all of them.'
        feedback: |
          Not the claim. Dreams are not limited to the moment before waking, and woken sleepers do not always recall one. The point was to tie a report to a measured period.
    explanation: |
      Every study of dreaming relies on reports after the fact, which is why the lucid dreaming experiments below try to get a signal out during the dream.

  - type: text
    id: dream-views
    title: "What makes a dream: two views"
    body: |
      In 1977 J. Allan Hobson and Robert McCarley (*American Journal of Psychiatry*) proposed the **activation-synthesis hypothesis**: during REM sleep, circuits in the brainstem activate the forebrain automatically, and the forebrain synthesises a story from those signals, drawing on memory. According to Hobson, it was a way to link dreaming to REM physiology. Critics objected that it assumes dreams belong to REM, and that it said too little about dreams having meaning. Hobson later revised the theory.

      In 2017 Francesca Siclari and colleagues (*Nature Neuroscience*) used high-density EEG (many electrodes on the scalp) to compare sleepers woken with and without a dream, in both REM and NREM sleep. According to them, dreams occurred in both stages, and whether a person reported dreaming went with a local drop of slow activity in a **posterior hot zone** of the cortex, at the back of the brain. This is an established finding about a correlation; the lesson on neural correlates showed why a correlation is not yet an identity.

  - type: mcq
    id: dream-views-q
    title: "What the hot zone result counts against"
    prompt: |
      A sleep researcher claims that dreaming is the same as REM sleep: no REM, no dream. According to Siclari and colleagues' 2017 results (dream reports in both REM and NREM, tied to a posterior cortical zone), what follows?
    options:
      - text: 'The claim is in trouble: reports of dreaming occurred outside REM, so the sleep stage is not the best marker of dreaming.'
        correct: true
        feedback: |
          Yes. A marker of dreaming should be present when dreams are reported, and the stage is not, while the cortical zone tracked reports across stages.
      - text: 'The claim is proved, because REM is where the most vivid dreams happen.'
        feedback: |
          Even if vivid dreams are more common in REM, the claim says no REM means no dream, and a dream outside REM refutes it.
      - text: 'Nothing follows, because reports of dreams cannot be trusted at all.'
        feedback: |
          Reports are imperfect, but without them no result about dreaming could ever be stated. Researchers cross-check them with recordings and, below, with signals sent from inside a dream.
    explanation: |
      Both views are still discussed. Activation-synthesis explains why REM is dream-rich, and the hot zone work explains dream experience across stages. A cautious reader keeps both and notes that each rests on dream reports.

  - type: text
    id: lucid
    title: "Lucid dreaming: a dream that knows it is one"
    body: |
      A **lucid dream** is a dream in which the dreamer knows they are dreaming, and often can steer it. Many people report them. The difficulty is evidence: a report after waking could be a false memory, so how can a researcher check that it was lucid while it happened? The answer used since the 1970s is to make the dreamer send a message out.

      In April 1975 Keith Hearne recorded the eye movements of a lucid dreamer, Alan Worsley, who made a pre-agreed pattern of eye movements during sleep. In 1981 Stephen LaBerge and colleagues at Stanford reported signals of the same kind from selected subjects during clear REM sleep, recorded by the sleep laboratory's instruments. The eyes were used because they keep moving in REM while the rest of the body is paralysed.

  - type: order
    id: lucid-order
    title: "Design the check"
    prompt: |
      Put in order the steps of an experiment that checks lucid dreaming with an eye signal.
    steps:
      - 'While awake, the volunteer agrees on a signal with the experimenter, such as left-right-left-right eye movements.'
      - 'The volunteer sleeps with electrodes that record brain activity and eye movements, so the sleep stage is known.'
      - 'During recorded REM sleep the dreamer realises they are dreaming and makes the signal.'
      - 'After the night, the signal in the recording is located and matched to the sleep stage.'
      - 'The volunteer tells what they remember of the dream, and the report is compared with the recording.'
    hint: 'The agreement comes before sleep, the signal comes during sleep, and the matching comes after.'
    explanation: |
      Agreeing the signal in advance is what makes the check fair: nobody can invent a signal afterwards. Recording the sleep stage shows it was REM and not waking.

  - type: mcq
    id: lucid-q
    title: "What the signal shows, and what it does not"
    prompt: |
      A pre-agreed eye signal is recorded during REM sleep. What does this show about the dream, according to the researchers who use the method?
    options:
      - text: 'That the dreamer was aware of dreaming and able to act on a plan while the dream went on.'
        correct: true
        feedback: |
          Yes. The signal was sent in sleep, by a plan made while awake, so awareness inside the dream is shown without relying on later memory.
      - text: 'That what the dreamer saw in the dream was real or happened somewhere.'
        feedback: |
          The signal says only that awareness and intention exist in the dream. It is silent on whether dream content corresponds to anything outside the sleeper's brain.
      - text: 'That the dreamer was awake and only pretending to be asleep.'
        feedback: |
          The recordings show REM sleep, with its pattern of brain activity and muscle atonia. The method is built to separate a signal in sleep from waking behaviour.
    explanation: |
      A signal gives evidence about awareness and control. The content of the dream still comes only through the dreamer's report.

  - type: text
    id: lucid-brain
    title: "What the lucid brain looks like, and a two-way test"
    body: |
      According to Ursula Voss, Allan Hobson and colleagues (*Sleep*, 2009), lucid dreaming looked like a mixture of waking and non-lucid dreaming: activity in lucid REM was higher than in ordinary REM in the gamma band (fast activity, centred around 40 Hz), strongest at the front of the head. It was a small study, so the result needs replication, and scalp recordings at the front are easily contaminated by eye and muscle activity, which critics note.

      In 2021 Karen Konkoly, Ken Paller and colleagues (*Current Biology*) went further: they put questions to sleepers during recorded REM sleep, such as simple sums and yes-or-no questions, and some dreamers answered with eye or face-muscle signals. Across 36 participants, in 158 attempts at two-way communication, 18.4% produced a correct answer, and the most common outcome was no response at all. So the finding is real but rare, and it shows a dreamer can sometimes hear and answer from inside a dream.

  - type: numeric
    id: lucid-num
    title: "How many answers?"
    prompt: |
      In a 2021 study, researchers tried two-way communication with dreamers in recorded REM sleep $158$ times, and $18.4\%$ of the attempts produced a correct answer. About how many attempts produced a correct answer?
    answer: 29
    tolerance: 0.6
    answerText: '29'
    wrong:
      - { value: 18.4, feedback: 'That is the percentage, not a count. Take $18.4\%$ of the $158$ attempts.' }
      - { value: 139, feedback: 'That is closer to the number of attempts that did not give a correct answer. Compute $0.184\times158$.' }
    hint: 'Multiply the number of attempts by the share that was correct, written as a decimal.'
    explanation: |
      $0.184\times158 = 29.07$, so about $29$ attempts. The same data say that about four in five attempts did not produce a correct answer, which is why the authors call it a proof of concept and not a routine tool.

  - type: text
    id: flow
    title: "Flow: absorbed and awake"
    image:
      src: img/csikszentmihalyi.webp
      alt: "Portrait photograph of Mihaly Csikszentmihalyi"
      caption: "Mihaly Csikszentmihalyi (1934-2021), a Hungarian-American psychologist, named and studied flow."
      credit: "Ehirsh, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Mihaly_Csikszentmihalyi.jpg"
    body: |
      Not every unusual state involves sleep. Mihaly Csikszentmihalyi (1934-2021), a Hungarian-American psychologist, described **flow** in *Flow: The Psychology of Optimal Experience* (1990): a state of complete absorption in an activity, so that nothing else seems to matter, as in a climber on a route, a musician in a piece, or a programmer at a problem.

      According to Csikszentmihalyi, flow needs a balance between the challenge of the task and the skill of the person. If the task is far too easy for the skill, flow does not occur, and if it is far too hard, it does not either. In 2003 Arne Dietrich proposed in *Consciousness and Cognition* that altered states share **transient hypofrontality**: a temporary reduction of activity in the prefrontal cortex (the front of the brain, linked to planning, self-monitoring and deliberate control), which could explain why self-consciousness and the sense of time fade in flow. It is a hypothesis that tries to unify many states, and whether it fits all of them is tested case by case.

  - type: mcq
    id: flow-q
    title: "When flow fails"
    prompt: |
      According to the challenge-skill account of flow, a very skilled pianist plays a simple children's tune for the hundredth time. Which prediction does the account make?
    options:
      - text: 'Flow is unlikely, because the challenge is far below the skill.'
        correct: true
        feedback: |
          Yes. The account needs a balance. A task far below one's skill tends to bring boredom or apathy.
      - text: 'Flow is most likely, because the pianist can do it perfectly.'
        feedback: |
          Skill alone is not enough. The account says it is the balance with the challenge that matters; mastery of a trivial task leaves nothing to be absorbed in.
      - text: 'Flow is likely if the tune is made much harder than anything the pianist can play.'
        feedback: |
          A challenge far above skill produces anxiety or frustration in this account, and not flow.
    explanation: |
      The account is testable: change the difficulty, ask people how absorbed they feel, and see whether the balance predicts it. As with Dietrich's hypothesis, what is established is the pattern of reports, and the brain explanation is still being tested.

  - type: text
    id: trance
    title: "Trance and hypnosis: a special state, or not?"
    body: |
      **Hypnosis** is a procedure in which a person is given suggestions (for example that an arm is getting light, or that a word will not be read) after an induction that asks them to focus. People differ widely in how much they respond. A "trance" is the name for the supposed special state.

      Two schools read the same facts differently. According to **state theorists** such as Ernest Hilgard (neodissociation), hypnosis divides the mind's control systems, so that one part acts on a suggestion while another part registers what is happening without guiding the action. According to **sociocognitive theorists** such as Irving Kirsch, Steven Jay Lynn and Nicholas Spanos, no special state is needed: expectation, the role the person takes, and motivation explain most responses. Both agree that heightened suggestibility is central. Researchers such as John Kihlstrom hold that the two views complement each other.

  - type: mcq
    id: trance-q
    title: "One result, two readings"
    prompt: |
      In 2005 Amir Raz, Jin Fan and Michael Posner (*PNAS*) gave highly suggestible people a posthypnotic suggestion aimed at the Stroop task (naming the ink colour of a colour word, where the word and the ink can conflict). The conflict effect shrank, and brain activity linked to conflict in the anterior cingulate cortex was reduced. What can a sociocognitive theorist reply?
    options:
      - text: 'Nothing: a brain change proves that a special trance state exists.'
        feedback: |
          A brain change shows that suggestion can change processing. It does not by itself show a distinct state, because strong expectation and focus could also change brain activity.
      - text: 'That the result is real and shows what suggestion can do, but a strong ordinary mechanism, such as motivated attention guided by expectation, could produce it without a special state.'
        correct: true
        feedback: |
          Yes. This is the usual reply. The disagreement is about whether the result needs a special state, and not about whether the result happened.
      - text: 'That the study was only a single study with a small group of volunteers, so it must be false.'
        feedback: |
          A small sample calls for replication, but it is not a refutation. The sociocognitive reply keeps the result and offers another explanation of it.
    explanation: |
      A state theorist replies that the reduced conflict activity fits a division of control. Neither reading is forced by this one result, which is why the debate continues.

  - type: mcq
    id: layers
    title: "Sort the claim by layer"
    prompt: |
      Which of these claims about altered states is a *metaphysical commitment* (not established fact, not an open scientific debate)?
    options:
      - text: 'Brain activity and reports of experience change between waking, REM sleep and lucid dreaming.'
        feedback: |
          This is established fact: it is measured and replicated.
      - text: 'Hypnosis is a special state of consciousness and not a product of expectation and role.'
        feedback: |
          This is a live scientific debate between state and sociocognitive researchers, with evidence cited on both sides.
      - text: 'In some state, the mind perceives a spiritual world that exists independently of the brain.'
        correct: true
        feedback: |
          Yes. This goes beyond what the measurements say, so a person holds it, or rejects it, on grounds of a wider view of mind. The later lessons ask what such a claim predicts and how it could be tested.
    explanation: |
      The same three layers will sort every claim in the level: established fact, live debate, commitment. A strange experience can be fully real as an experience while its interpretation is still open.

  - type: text
    id: standards
    title: "Honest standards for strange experiences"
    body: |
      The level that follows covers meditation, psychedelics, near-death experiences, mediumship and parapsychology. A fair reader asks four things of each claim: what exactly is claimed, what is documented, what would test it, and what the tests found. This lesson already showed the pattern. Lucid dreaming was once doubted as a mere impression on waking; an eye signal turned it into a recorded fact, without settling what dreams are.

      Two readers can agree on all the data and still differ. A physicalist says a state is a pattern of brain activity and nothing more. Others hold that some states open a view onto more than the brain; this is a commitment about the mind, as the lesson on souls showed. The data of this lesson fit the first reading comfortably. They do not exclude the second, because what a brain does while an experience occurs does not settle what the experience is of.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the lesson What Meditation Does asks what attention training changes, separates short-term effects from lasting ones, and looks at how good the research is.
