id: ch11-intuition
title: Quick Recall
kind: intuition

cards:
  - type: text
    id: welcome
    title: "Quick recall: altered states"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: state against content, sleep and dreaming, the effect size and its uncertainty, the three layers of a claim, rates, many chances, the odds form of Bayes' rule, and the design of a blinded test.

      Three kinds of card: **mnemonics** (the shape of a distinction), **build cards** (assemble a formula) and **numeric cards that give you data only**: you choose the rule yourself.

      As always, every answer is *according to* someone or some view. Nothing here asks you to decide whether any altered state reveals a reality beyond the brain.

  - type: mcq
    id: state-content
    title: "State against content"
    prompt: |
      A volunteer under a high dose of psilocybin says, "I felt that everything was one and sacred." According to Charles Tart's idea of a state of consciousness, which statement fits best?
    options:
      - text: 'The state is the overall pattern of how the mind is functioning (attention, memory, sense of self, control). The report is content, and whether it is true is judged apart from the state.'
        correct: true
      - text: 'The state is the content of the experience, so a report of unity is the state.'
        feedback: |
          Content is what is experienced; the state is the pattern of functioning in which it is experienced. The same content (a feeling of unity) can occur in different states.
      - text: 'A vivid report shows the state is a window onto reality.'
        feedback: |
          Vividness is a feature of the experience. Whether it tracks anything outside the brain is a separate claim, and the report alone cannot decide it.
      - text: 'A state is a single brain region switching on.'
        feedback: |
          Tart's idea is of an overall pattern, not one region. Single-region stories (such as hypofrontality) are hypotheses about one possible ingredient.
    explanation: |
      Mnemonic: **state = pattern of functioning; content = what shows up in it**. A report is data about the state, and its truth is a further question.

  - type: mcq
    id: rem-dream
    title: "REM is a stage, a dream is a report"
    prompt: |
      Sleepers woken from REM sleep often report dreams, but sleepers woken from non-REM sleep sometimes do as well. How should the two words be kept apart?
    options:
      - text: 'REM is a stage of sleep, measured by eye movements and brain activity. Dreaming is an experience, known by a report. The two overlap a lot but are not the same thing.'
        correct: true
      - text: 'REM and dreaming are two names for the same thing.'
        feedback: |
          Dream reports also come from non-REM sleep, and some REM awakenings produce no report. If they were the same, neither could happen.
      - text: 'Dreams occur only in REM, and non-REM reports are mistakes.'
        feedback: |
          That was an early view. Later studies (Siclari and colleagues, 2017) tied dreaming of any kind to a posterior cortical hot zone, whatever the stage.
      - text: 'Dreaming is measured with the EEG, and REM is known only by asking.'
        feedback: |
          Reversed. The stage is read from recordings; the dream is known by asking.
    explanation: |
      Mnemonic: **stage is measured, dream is reported**. Aserinsky and Kleitman (1953) found REM; later work tied the dream to the posterior hot zone rather than to the stage.

  - type: mcq
    id: lucid-signal
    title: "What the eye signal shows"
    prompt: |
      Dreamers who know they are dreaming (lucid dreamers) send a pre-agreed pattern of eye movements during REM sleep, and the signal is found on the recording. What does it establish?
    options:
      - text: 'That the person was aware, during sleep, that they were dreaming, since the signal was timed on the recording before any waking memory could be distorted. It says nothing about whether what they dreamed was real.'
        correct: true
      - text: 'That the dream content was true, such as a place or person seen in the dream.'
        feedback: |
          The signal shows awareness of dreaming, not that the content matched anything outside. Content is judged apart from the state.
      - text: 'Nothing, because a report after waking is the only possible evidence.'
        feedback: |
          A report after waking could be a false memory. The signal is the stronger check, because it is made during sleep and is recorded.
      - text: 'That the sleeper was awake, since eye movements need an awake person.'
        feedback: |
          Eye muscles are spared by the sleep paralysis of REM, which is why they can carry the signal while the sleeper stays asleep.
    explanation: |
      Mnemonic: **the signal verifies awareness, not content**. In a 2021 study of two-way communication, dreamers answered correctly in $18.4\%$ of $158$ attempts, and the most common outcome was no response.

  - type: build
    id: effect-build
    title: "Build the effect size"
    prompt: |
      Two groups of people are tested on a score (for example, a meditation group and a comparison group on anxiety). Build the effect size $d$, which measures the difference in units of the spread of the scores.
    prefix: 'd='
    tiles: ['\dfrac{\text{mean}_1-\text{mean}_2}{\text{SD}}', '\dfrac{\text{SD}}{\text{mean}_1-\text{mean}_2}', '\text{mean}_1-\text{mean}_2', '\dfrac{\text{mean}_1+\text{mean}_2}{\text{SD}}']
    answers:
      - ['\dfrac{\text{mean}_1-\text{mean}_2}{\text{SD}}']
    wrong:
      - answer: ['\text{mean}_1-\text{mean}_2']
        feedback: |
          That is the raw difference. It has the units of the score, so it cannot be compared across studies that use different scales. Dividing by the standard deviation (SD) removes the units.
      - answer: ['\dfrac{\text{SD}}{\text{mean}_1-\text{mean}_2}']
        feedback: |
          Upside down. A bigger difference should give a bigger $d$, and a larger spread should make the same difference count for less.
    hint: 'A difference measured in units of the spread of the scores.'
    explanation: |
      $d$ is the difference between the two group means divided by the standard deviation (SD) of the scores. A value of $0.38$ means the groups differ by about four tenths of a spread.

  - type: mcq
    id: se-scaling
    title: "Uncertainty of an effect size"
    prompt: |
      A trial with $37$ people per group estimates an effect size $d$, and the uncertainty of the estimate (its standard error) comes out at about $0.23$. The uncertainty shrinks like one over the square root of the number $n$ of people per group. About how many people per group are needed to cut the uncertainty in half?
    options:
      - text: 'About $148$ per group, four times as many.'
        correct: true
      - text: 'About $74$ per group, twice as many.'
        feedback: |
          Doubling $n$ divides the uncertainty by $\sqrt2\approx1.41$, not by $2$. A square root is slow.
      - text: 'About $19$ per group, half as many.'
        feedback: |
          Fewer people make the estimate less certain, never more.
      - text: 'About $1{,}369$ per group, the square of $37$.'
        feedback: |
          Squaring $n$ is not the rule. Halving $1/\sqrt n$ needs $\sqrt n$ to double, so $n$ to quadruple.
    explanation: |
      Mnemonic: **half the error costs four times the people**. This is why a single small trial cannot tell a modest effect from zero, and why the sample size should be fixed in advance.

  - type: mcq
    id: effect-limits
    title: "Two limits of the effect size"
    prompt: |
      Consider the two limits of $d$ for a comparison of a treatment group with a control group, with a small number of people per group. Which pair of statements is right?
    options:
      - text: 'At $d=0$ the group averages are the same; and a large $d$ from a few people can still be uncertain, because the estimate carries its own error.'
        correct: true
      - text: 'At $d=0$ the treatment does nothing to anyone; and a large $d$ proves the treatment works.'
        feedback: |
          $d=0$ speaks of averages, so some people could improve and others worsen. And a large $d$ from a small trial can come from chance or from a flawed design.
      - text: 'At $d=0$ the study is invalid; and a large $d$ is always replicable.'
        feedback: |
          A $d$ of zero is a legitimate result. Large effects from small studies are often the ones that fail to replicate, since low power overstates the effects it finds.
      - text: 'At $d=1$ everyone in the treatment group is better than everyone in the control group.'
        feedback: |
          Even a large effect leaves the two score distributions overlapping, so many control members score better than many treated members.
    explanation: |
      Mnemonic: **zero means equal averages; large does not mean certain**. Always read $d$ together with its uncertainty and the quality of the design.

  - type: mcq
    id: three-layers
    title: "Fact, debate or commitment"
    prompt: |
      Take three statements about unusual experiences. (a) People who nearly die often report peace and a sense of leaving the body. (b) Dying brains can explain the whole pattern of these reports. (c) Mind outlasts the brain. Which is the correct sorting into established fact, live debate and metaphysical commitment?
    options:
      - text: '(a) established fact, (b) live debate, (c) metaphysical commitment.'
        correct: true
      - text: '(a) live debate, (b) established fact, (c) metaphysical commitment.'
        feedback: |
          That people give these reports is documented. That brain explanations account for the whole pattern is still argued.
      - text: '(a) established fact, (b) metaphysical commitment, (c) live debate.'
        feedback: |
          Whether dying brains explain the pattern is a question evidence can bear on, so it is debate. Whether mind outlasts the brain depends on what one takes mind to be, so it is a commitment.
      - text: 'All three are established fact, since each has been published.'
        feedback: |
          Publication does not make a claim established. The layers separate what is documented, what is argued and what rests on a worldview.
    explanation: |
      Mnemonic: **happened, how, and what it means**. The same sorting works for a psychedelic report: that it changes experience is fact, how much is drug and how much expectation is debate, and what it reveals about reality is a commitment.

  - type: build
    id: rate-build
    title: "Build the rate"
    prompt: |
      Of $n$ survivors interviewed, $k$ give a particular report. Build the rate, the share of those interviewed who give it.
    prefix: '\text{rate}='
    tiles: ['\dfrac{k}{n}', '\dfrac{n}{k}', 'k-n', 'k\times n']
    answers:
      - ['\dfrac{k}{n}']
    wrong:
      - answer: ['\dfrac{n}{k}']
        feedback: |
          Upside down: that is the number of people interviewed per report. A share must be at most $1$.
    hint: 'A share is a part divided by the whole it is a part of. Which number is the whole?'
    explanation: |
      The rate is $k/n$, and the denominator matters: $6$ of $28$ is $21\%$, but the same $6$ among $53$ survivors is $11\%$, and among $567$ arrests it is about $1\%$. Always ask what the denominator counts.

  - type: numeric
    id: chances-numeric
    title: "Twenty chances at noise"
    prompt: |
      A lab tests a claim in which there is no real effect. It runs $20$ independent analyses, and each one has a $5\%$ chance of coming out "significant" by luck alone. What is the chance, in percent, that at least one analysis comes out significant? Give it to the nearest whole percent.
    answer: 64
    tolerance: 0.5
    answerText: '64'
    wrong:
      - value: 100
        feedback: |
          Twenty tries at $5\%$ each does not add to $100\%$. Adding probabilities double counts the cases where several succeed.
      - value: 5
        feedback: |
          That is the chance for one analysis. Each extra analysis is another chance to get lucky.
      - value: 36
        feedback: |
          That is the chance that none comes out significant, the complement of what is asked.
    hint: 'Find the chance that none is significant first; the chances multiply for independent analyses. Then take what is left.'
    explanation: |
      Each analysis stays below the threshold with probability $0.95$, so all twenty do with $0.95^{20}\approx0.36$, and at least one significant result has probability about $0.64$. This is why choosing the outcome after seeing the data (p-hacking) acts like running extra tests.

  - type: build
    id: odds-build
    title: "Build the odds form of Bayes' rule"
    prompt: |
      A claim $H$ has prior odds $P(H)/P(\neg H)$, and a result $E$ has a likelihood ratio $\mathrm{LR}=P(E\mid H)/P(E\mid\neg H)$. Build the odds of the claim after the result.
    prefix: '\text{posterior odds}='
    tiles: ['\mathrm{LR}', '\times', '\text{prior odds}', '+', '\div']
    answers:
      - ['\mathrm{LR}', '\times', '\text{prior odds}']
      - ['\text{prior odds}', '\times', '\mathrm{LR}']
    wrong:
      - answer: ['\mathrm{LR}', '+', '\text{prior odds}']
        feedback: |
          Evidence does not add to the odds; it scales them. A result that is ten times more likely under $H$ makes the odds ten times larger, whatever they were.
      - answer: ['\text{prior odds}', '\div', '\mathrm{LR}']
        feedback: |
          Dividing would make a result that favours $H$ lower its odds. The likelihood ratio multiplies.
    hint: 'Each result multiplies the odds by how much more likely it is under the claim than under its rival.'
    explanation: |
      Posterior odds equal the likelihood ratio times the prior odds. Mnemonic: **start odds, times what the evidence says**. Two independent results multiply twice.

  - type: numeric
    id: posterior-numeric
    title: "A toy update"
    prompt: |
      Before a test, a claim is thought to be true in $1$ case out of $201$ similar cases (so $1$ true for every $200$ false). The test comes out positive with probability $0.8$ if the claim is true, and with probability $0.02$ if the claim is false. After a positive test, what is the probability that the claim is true, in percent? Give it to one decimal place.
    answer: 16.7
    tolerance: 0.1
    answerText: '16.7'
    wrong:
      - value: 80
        feedback: |
          That is the chance of a positive test if the claim is true. The question asks for the chance the claim is true given a positive test, which also depends on how rare true claims are.
      - value: 20
        feedback: |
          That is the posterior odds ($0.2$), not a probability. Odds of $1$ to $5$ correspond to $1$ in $6$.
      - value: 40
        feedback: |
          That is how much the test favours the claim over its rival. It must still be applied to the prior, which is small.
    hint: 'Compare how likely the positive test is under each reading, apply that to the starting odds, then convert the odds to a probability.'
    explanation: |
      The test is $0.8/0.02=40$ times more likely if the claim is true. Starting odds of $1$ to $200$ become $40/200=0.2$, and odds of $0.2$ mean $0.2/1.2\approx16.7\%$. A strong test does not rescue a rare claim.

  - type: mcq
    id: bayes-limits
    title: "Two limits of the update"
    prompt: |
      Take the update of a claim's odds by a result. Two limits: a person whose prior probability for the claim is exactly zero, and a study of a claim in which almost no cases can be tested, so that a null result is nearly as likely whether the claim is true or false. What happens?
    options:
      - text: 'A zero prior stays zero whatever evidence arrives, since zero times any ratio is zero. A null result with few testable cases has a likelihood ratio near $1$, so the odds hardly move in either direction.'
        correct: true
      - text: 'A zero prior rises quickly with enough evidence; and a null result with few testable cases strongly lowers the odds.'
        feedback: |
          Zero times any ratio remains zero, so no evidence can move a prior of exactly zero (which is why it is a commitment, not a conclusion). And a test that could rarely have caught a hit says almost nothing when it finds none.
      - text: 'A zero prior is the safest scientific stance; and a null result always refutes the claim.'
        feedback: |
          A prior of zero closes the question in advance, which is a commitment. A null result refutes only to the extent the test would likely have found the effect if it were real.
      - text: 'Both limits make the likelihood ratio infinite.'
        feedback: |
          The ratio is finite in both. What differs is the prior (zero) and the ratio itself (near $1$).
    explanation: |
      Mnemonic: **zero stays zero; a weak test leaves the odds where they were**. For the AWARE hidden-target test, most arrests happened where no target was placed, so an absence of hits told little either way.

  - type: numeric
    id: replication-numeric
    title: "Six replications with a shared cause"
    prompt: |
      A claim is tested in $6$ replications that all succeed. If the claim is true, all six succeed (take that as probability $1$). If it is false and the experiments are independent, each succeeds by luck with probability $0.04$. But there is also a $1\%$ chance that all six share one design flaw, which makes every run succeed whatever the truth. About how many times more likely are six successes if the claim is true than if it is false? Give the nearest whole number.
    answer: 100
    tolerance: 1
    answerText: '100'
    wrong:
      - value: 244140625
        feedback: |
          That treats the six runs as fully independent for a false claim, $1/0.04^6$. A shared flaw makes all six succeed together at once, with probability $0.01$, and that route dominates by far.
      - value: 25
        feedback: |
          That is the ratio for a single run, $1/0.04$. Six independent runs would multiply it, but the shared flaw prevents that.
    hint: 'When a false claim can produce all the successes through one shared cause, how likely are six successes under the false reading? Compare the two routes.'
    explanation: |
      Under the false reading, six successes arise either through the flaw, with probability $0.01$, or by six independent flukes, with probability $0.99\times0.04^{6}\approx4\times10^{-9}$, which is negligible. So the ratio is about $1/0.01=100$. More replications that share the cause cannot lift it beyond about $1/c$, where $c$ is the probability of the flaw.

  - type: order
    id: blinded-order
    title: "A blinded reading test"
    prompt: |
      Put the steps of a blinded test of a medium in order, so that the result could be judged fairly.
    steps:
      - 'Fix in advance the number of readings, the scoring rule and what will count as a hit.'
      - 'Obtain the sitter''s name only and give the medium no other information; the person who meets the medium does not know the sitter.'
      - 'The medium gives a reading, which is written down as a transcript.'
      - 'Each sitter receives two transcripts, the one meant for them and a control, in random order and without knowing which is which.'
      - 'The sitter picks the one that fits better, and the number of correct picks is compared with chance, $(1/2)^m$ for $m$ picks all right.'
    hint: 'Rules first, then the information given to the medium, then the reading, then blind judging, then comparison with chance.'
    explanation: |
      Mnemonic: **fix the rules, starve the cold reader, blind the judge, compare with chance**. Each step closes a route by which ordinary means (cold reading, prior information, judging bias) could produce a hit.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **State and content.** A state of consciousness is, according to Charles Tart (1972), an overall pattern of functioning (attention, memory, sense of self, control); a report is content, judged apart from the state. REM is a stage, measured; a dream is a report. A pre-agreed eye signal shows awareness of dreaming, not that the content was real.

      **Effect size and its uncertainty.** For two groups of scores,

      $$d=\frac{\text{mean}_1-\text{mean}_2}{\text{SD}}$$

      and its uncertainty falls like

      $$\frac{1}{\sqrt{n}}$$

      so half the error costs four times the people. Zero means equal averages; large does not mean certain.

      **Rates and many chances.** A rate is $k/n$, so always ask what $n$ counts ($6/28\approx21\%$, $6/53\approx11\%$). With $k$ independent tests at the $5\%$ level and no real effect, the chance of at least one false positive is

      $$1-0.95^{k}$$

      which is $64\%$ for $k=20$.

      **Odds form.** For a claim $H$, its rival $\neg H$ and a result $E$,

      $$\frac{P(H\mid E)}{P(\neg H\mid E)}=\mathrm{LR}\cdot\frac{P(H)}{P(\neg H)}$$

      where $\mathrm{LR}=P(E\mid H)/P(E\mid\neg H)$. Prior odds of $1$ to $200$ and $\mathrm{LR}=40$ give odds $0.2$, about $16.7\%$. A zero prior stays zero; a test that rarely could have found the effect has $\mathrm{LR}$ near $1$; replications with a shared cause of probability $c$ cap the ratio near $1/c$ (here $100$).

      **Blinded tests and layers.** Fix the rules, limit the information, blind the judge, compare with chance $(1/2)^m$. Every claim sorts into fact (it is reported), live debate (how it is explained) or commitment (what it means).

      **Next:** the content map of this level, where you rebuild the chapter's concept map box by box among look-alike decoys.
