id: ch11-meditation
title: "What Meditation Does"
kind: concept
own: |
  The setting: people who practise meditation, from Buddhist and Hindu settings and from the secular clinical courses built on them, and the question of what the practice does to attention, mood and the brain, and how well studies can show it. A **state** effect is a change during the practice; a **trait** effect is a lasting change outside it. An **effect size** $d$ measures a difference between two groups in units of the spread of the scores:
  {{ $$d=\frac{\text{mean}_1-\text{mean}_2}{\text{standard deviation}}$$ }}
  - **Kinds of practice.** According to Lutz, Slagter, Dunne and Davidson (2008), focused attention holds the mind on one object, open monitoring watches whatever arises without reacting, and loving-kindness (*metta*, goodwill) directs wishes of wellbeing to others.
  - **Brain findings are correlations.** In Lutz and colleagues (2004), eight long-term Buddhist practitioners showed far more gamma-band activity than ten students taught for a week, and the gap was already present at rest. In Brewer and colleagues (2011), experienced meditators showed lower activity in the default mode network (the brain's mind-wandering and self-related network) during practice. A group difference in experts can come from training or from who becomes an expert:
  {{ $$\text{group difference}\ \not\Rightarrow\ \text{practice caused it}$$ }}
  - **Trials.** According to Goyal and colleagues (2014), 47 randomized trials with active controls (3,515 people) gave moderate evidence that mindfulness programs reduce anxiety ($d=0.38$ at 8 weeks), depression ($d=0.30$) and pain ($d=0.33$), and no evidence of being better than an active treatment. With $n$ people per group, an effect size has an uncertainty
  {{ $$\text{SE}(d)\approx\sqrt{\frac{2}{n}+\frac{d^2}{4n}}$$ }}
  so with $n=37$ one trial cannot tell $d=0.38$ from zero.
  - **Quality of the field.** According to Van Dam and colleagues (2018), loose definitions, weak controls and hype are problems; Coronado-Montoya and colleagues (2016) found $108$ of $124$ trials reported a positive outcome, against about $66$ expected from the effect sizes. Unpleasant experiences were reported by $25.6\%$ of regular meditators in a survey (Schlosser and colleagues, 2019), which does not show that meditation caused them.
  - **Two readings of insight.** As a psychological skill, insight is noticing thoughts and feelings as events; it is testable. As a claim about reality (*anatta*, non-self, according to Buddhist teaching: no permanent self-substance), it is a metaphysical commitment that trials of stress cannot decide.
  - **Three layers.** That practice changes attention, mood and brain measures is established at a modest size; how big, for whom and compared with what is a live debate; what meditation reveals about the self or reality is a commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: eight weeks of sitting"
    prompt: |
      Guessing is the point; no theory yet. Adults with no experience sit for about 10 to 45 minutes a day for eight weeks, following guided instructions in a weekly group. Compared with similar adults who did something else for those weeks, what do you expect on average?
    options:
      - text: 'No measurable difference in anything, since sitting still does nothing.'
        feedback: |
          Many people expect this, and some careful reviewers come close to it for several outcomes. But for anxiety, depression and pain, controlled trials reported small to moderate improvements, so "nothing" overstates the case.
      - text: 'Small to moderate improvements in some things (anxiety, low mood, pain), and no clear change in others, with real doubts about how solid it all is.'
        correct: true
        feedback: |
          This is roughly where the trial literature stands, as the lesson shows, along with the reasons for caution.
      - text: 'Large, dramatic changes in attention, happiness and the brain for everyone.'
        feedback: |
          This is the popular picture. The trials found modest average effects, and much of the early excitement came from small studies of experts.
    explanation: |
      The lesson separates what meditation is, what it seems to do, and how well we know it, in three layers: established fact, live debate, and commitment.

  - type: text
    id: recall
    title: "Recall: states and layers"
    body: |
      Recall: according to Charles Tart (1972), a **state of consciousness** is an overall pattern of how the mind functions (attention, memory, sense of self, sense of control), not a single content or brain measure. Every claim about a state can be sorted into three layers: **established fact** (data), **live debate** (scholars disagree), and **commitment** (a faith or metaphysical premise).

      Meditation is a practice that aims to change that pattern on purpose. This lesson asks what it is, what it changes, and how well we can know it.

  - type: text
    id: kinds
    title: "What is meditation?"
    image:
      src: img/kabat-zinn.webp
      alt: "Photograph of Jon Kabat-Zinn speaking, seated, wearing a dark jacket and a name badge"
      caption: "Jon Kabat-Zinn (born 1944) founded a stress reduction clinic at the University of Massachusetts in 1979 and shaped an eight-week course from meditation practice, framed in science rather than religion."
      credit: "Mari Smith, CC BY 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Jon_Kabat-Zinn.jpg"
    body: |
      "Meditation" names many practices in many settings, and the research cannot be read without sorting them. According to Antoine Lutz, Heleen Slagter, John Dunne and Richard Davidson (2008), two broad families are **focused attention**, where you hold attention on one object (the breath, a sound) and bring it back when it wanders, and **open monitoring**, where you watch whatever arises in experience from moment to moment without reacting to it. A third, **loving-kindness** (*metta* in Pali, a word for goodwill), directs wishes of wellbeing to oneself, to others, then to difficult people. According to Buddhist teaching, *metta* is one of the four "sublime abodes" with compassion, sympathetic joy and equanimity.

      The settings differ. According to the Hindu text called the Yoga Sutras, attributed to Patanjali, the later limbs of yoga are *dharana* (holding attention on one object), *dhyana* (an unbroken flow of attention on it) and *samadhi* (absorption). The clinical setting is secular: Jon Kabat-Zinn, who trained in Zen, founded the Stress Reduction Clinic at the University of Massachusetts in 1979 and developed an eight-week course, now called mindfulness-based stress reduction (MBSR), which he presents within a scientific rather than a religious frame. The same breathing exercise can therefore mean liberation to one person and blood-pressure care to another.

  - type: mcq
    id: kinds-q
    title: "Which family?"
    prompt: |
      According to the distinction of Lutz and colleagues (2008), a person sits and notices thoughts, sounds and sensations as they arise, without choosing any one to hold or reacting to them. Which family is this?
    options:
      - text: 'Focused attention, because the person is paying attention.'
        feedback: |
          Both families involve attention. Focused attention means holding one chosen object and returning to it. Here nothing is chosen.
      - text: 'Open monitoring, because experience is watched as it arises without holding one object.'
        correct: true
        feedback: |
          Yes. 
      - text: 'Loving-kindness, because it is a kind of calm.'
        feedback: |
          Loving-kindness means directing wishes of goodwill to someone. Calm may come with any practice, but it does not define this one.
    explanation: |
      A study of "meditation" says little until it says which practice, for how long, taught by whom. A rival way to carve the field is by tradition (Buddhist, Hindu, secular) rather than by mental technique; both carvings appear in the literature.

  - type: text
    id: state-trait
    title: "State and trait effects"
    body: |
      Two different questions hide in "does meditation change the brain?". A **state effect** is a change during the practice itself, which ends when the practice does. A **trait effect** is a lasting change in how a person is outside the practice, such as lower baseline anxiety. According to researchers who study this (Davidson and Kaszniak, 2015), testing adept practitioners during meditation mixes the two, which is why such studies are best read as state-trait interactions.

      A trait effect is the interesting one for health, but it is the harder one to show, because it needs people followed over time or compared fairly.

  - type: mcq
    id: state-trait-q
    title: "Trait or state?"
    prompt: |
      A study scans a person during a loving-kindness session and sees a pattern of brain activity that disappears when the session ends. Another study finds that after eight weeks of practice people score lower on an anxiety questionnaire in daily life. Which is which?
    options:
      - text: 'The first is a state effect, the second a trait effect.'
        correct: true
        feedback: |
          Yes. One lasts as long as the practice, the other persists outside it.
      - text: 'Both are trait effects, because both involve the brain.'
        feedback: |
          All effects involve the brain in some sense. The distinction is about duration and setting, not location.
      - text: 'The first is a trait effect, since it is easier to measure.'
        feedback: |
          Ease of measurement does not decide it. A pattern that vanishes when the session ends is a state.
    explanation: |
      Keeping the two apart prevents a common slide from "the brain looks different during meditation" to "meditation makes you a different person".

  - type: text
    id: brain
    title: "What brain studies found"
    body: |
      In 2004 Lutz, Greischar, Rawlings, Ricard and Davidson compared eight long-term Buddhist practitioners (mean age 49) with ten students (mean age 21) taught the practice for about a week. During a loving-kindness and compassion meditation, the practitioners' EEG showed sustained, high-amplitude gamma-band oscillations (25 to 42 Hz) and strong synchrony between distant scalp regions, far greater than in the students. The practitioners also had a higher ratio of gamma to slow activity *before* meditating, and it correlated with their hours of practice. The authors noted that muscle activity could partly contaminate such signals and used checks for it.

      In 2011 Brewer and colleagues scanned experienced meditators and meditation-naive controls during concentration, loving-kindness and choiceless awareness. The **default mode network**, a set of regions (medial prefrontal and posterior cingulate cortex) that is active when the mind wanders and thinks about itself, was less active in the experienced meditators across all three practices. The authors read the pattern as consistent with less mind-wandering.

  - type: mcq
    id: brain-q
    title: "What an expert group cannot show"
    prompt: |
      Experienced Buddhist practitioners show a higher resting gamma ratio than students, and the ratio grows with hours of practice. A friend concludes that years of meditation raised the practitioners' gamma activity. What most limits this conclusion?
    options:
      - text: 'Gamma activity is not a real brain signal.'
        feedback: |
          Gamma-band activity is a real, measured signal. The problem is the inference, not the existence of the measure.
      - text: 'The groups may have differed before any practice: people who stay with meditation for decades may be unusual in the first place (a selection effect), and the groups also differ in age.'
        correct: true
        feedback: |
          Yes. Davidson and Kaszniak (2015) point out that committing so much of one's life to practice is rare and is probably tied to existing individual differences. The correlation with hours is suggestive, but people who like it more may also practise more.
      - text: 'Meditation cannot affect the brain, so any difference must be a mistake.'
        feedback: |
          Nothing in the design rules an effect out; it simply cannot establish one. Experience changes the brain in many domains, so a training effect is plausible.
    explanation: |
      A fair reading keeps two views: the data fit a training effect and a selection effect equally. What would separate them is a randomized trial, where people are assigned to practise or not, which is the next kind of evidence.

  - type: text
    id: trials
    title: "Trials: what randomized studies found"
    body: |
      A randomized trial assigns people by chance to a meditation course or to a comparison, so the groups start alike. Results are reported as an **effect size** $d$, the difference between group means in units of the spread of the scores:

      $$d=\frac{\text{mean}_1-\text{mean}_2}{\text{standard deviation}}$$

      By a convention going back to Jacob Cohen (1988), meant only as a rough guide, around $0.2$ is called small, $0.5$ medium and $0.8$ large. In 2014 Goyal and colleagues pooled 47 randomized trials with active controls (3,515 people) in *JAMA Internal Medicine*. They reported moderate evidence that mindfulness programs improved anxiety ($d=0.38$ at 8 weeks, $0.22$ at 3 to 6 months), depression ($d=0.30$ and $0.23$) and pain ($d=0.33$). They found low evidence for stress and mental-health quality of life, and low or insufficient evidence for attention, positive mood, sleep and weight. Mantra meditation improved none of the outcomes examined, and they found no evidence that meditation programs beat active treatments such as drugs, exercise or other behavioural therapies.

  - type: numeric
    id: se
    title: "How far can one small trial be trusted?"
    prompt: |
      Goyal and colleagues found trials of about $37$ people per group. For two groups of $n$ people each and an observed effect size $d$, a rough uncertainty (standard error) is

      $$\text{SE}(d)\approx\sqrt{\frac{2}{n}+\frac{d^2}{4n}}$$

      and a 95% interval runs from $d-1.96\,\text{SE}$ to $d+1.96\,\text{SE}$. One such trial observes $d=0.38$ with $n=37$. What is the lower end of its 95% interval? (Give it to two decimals.)
    answer: -0.08
    tolerance: 0.02
    hint: |
      Compute $2/37$ and $0.38^2/(4\cdot37)$, add them, take the square root, multiply by $1.96$ and subtract from $0.38$.
    wrong:
      - value: 0.38
        feedback: |
          That is the observed value itself, the middle of the interval. The lower end subtracts $1.96$ standard errors.
      - value: 0.84
        feedback: |
          That is the upper end, $0.38+1.96\,\text{SE}$. The question asks for the lower end.
    explanation: |
      $\text{SE}=\sqrt{0.0541+0.0010}\approx0.235$, so the interval is about $-0.08$ to $0.84$. One trial of this size cannot distinguish a moderate effect from none, which is why the field relies on pooling many trials, and why pooled estimates matter more than a single headline study.

  - type: text
    id: quality
    title: "How good is the evidence?"
    body: |
      According to critics and defenders alike, several features of the field limit what can be concluded. **Blinding is hard**: people know whether they are meditating, so expectation may drive reported benefits. **Controls matter**: a waiting list controls for nothing but time, while an active control (a health education course, exercise) is a fairer comparison, and Goyal and colleagues restricted their main results to those. **Publication bias** may fill journals with positive results: Coronado-Montoya and colleagues (2016) found that 108 of 124 published trials of mindfulness-based mental health interventions (87%) reported a positive outcome in the abstract, about 1.6 times the number expected from the typical effect sizes, and that 13 of 21 registered trials were still unpublished 30 months after completion.

      In 2018 Nicholas Van Dam and colleagues, in "Mind the Hype", argued that the field suffers from unclear definitions of "mindfulness", weak measures, and media claims that outrun the data, and called for better methods and honest reporting of costs as well as benefits. Defenders of the field reply that it is young and improving, and that the Goyal results already rest on active controls; the disagreement is about how much of the positive literature survives.

  - type: mcq
    id: control-q
    title: "The fairest comparison"
    prompt: |
      A researcher wants to test whether an eight-week mindfulness course reduces anxiety beyond the effect of simply joining a friendly group and expecting to improve. Which comparison group is best?
    options:
      - text: 'A waiting list: people who get the course later.'
        feedback: |
          This shows that doing something beats doing nothing, but it cannot separate the ingredient of meditation from group contact, expectation and attention from an instructor.
      - text: 'An active control that matches time, group meetings and instructor contact but has no meditation (for example a health education course).'
        correct: true
        feedback: |
          Yes. Whatever difference remains is more plausibly due to the meditation itself, although blinding remains imperfect because people can guess which course is "the real one".
      - text: 'No comparison group, just measuring the course group before and after.'
        feedback: |
          People often improve over time anyway (anxiety fluctuates, and those who sign up are often at a low point), so a before-after gain alone cannot be credited to the course.
    explanation: |
      A fair reading of any positive trial asks "compared with what?". The 2014 meta-analysis made its main comparisons against active controls for this reason.

  - type: numeric
    id: pubbias
    title: "Too many positive results"
    prompt: |
      Coronado-Montoya and colleagues counted $108$ positive trials among $124$ published, while the typical effect sizes and trial sizes predicted only about $65.7$ positive ones. By what factor did the observed count exceed the expected count? (Give it to one decimal.)
    answer: 1.6
    tolerance: 0.05
    hint: |
      Divide the observed number of positive trials by the expected number.
    explanation: |
      $108/65.7\approx1.64$. Because even real effects fail to reach significance in small trials some of the time, a literature with almost no failures is a warning. The authors say this may overstate what would happen in practice. How much this inflates the published picture is a live debate.

  - type: text
    id: harm
    title: "Adverse effects"
    body: |
      Meditation is often described as harmless relaxation, but it is also reported to bring difficulty for some. In 2017 Jared Lindahl, Willoughby Britton and colleagues (*PLoS ONE*) interviewed Western Buddhist practitioners and teachers and catalogued many such meditation-related challenges, with 26 categories of influencing factors; the sample was mostly white and highly educated. In 2019 Schlosser and colleagues surveyed 1,232 regular meditators: 315 of them (25.6%) reported a particularly unpleasant experience that they thought might be related to their practice. Reports were more common among those with more repetitive negative thinking, those who practised only deconstructive styles such as *vipassana*, and those who had attended a retreat.

      Goyal and colleagues found that few trials reported harms at all: of the nine that did, none reported any.

  - type: mcq
    id: harm-q
    title: "What 25.6% means"
    prompt: |
      In the survey of 1,232 regular meditators, 25.6% reported a particularly unpleasant experience they thought might be related to meditation. A headline says "Meditation harms a quarter of all practitioners." What is the fair reading?
    options:
      - text: 'The headline is correct: a quarter were harmed by meditation.'
        feedback: |
          The survey asked one question and was cross-sectional, so it cannot show that meditation caused the experiences, nor how severe they were.
      - text: 'The survey shows unpleasant experiences are common enough among regular meditators to deserve study, but it cannot show cause, severity or the rate in the general population.'
        correct: true
        feedback: |
          Yes. The authors themselves called for longitudinal research, and it is a sample of people who already meditate regularly.
      - text: 'The figure means nothing, because unpleasant experiences are normal in life anyway.'
        feedback: |
          Unpleasant experiences are normal, but the question asked about experiences the person linked to practice, and the comparison with non-meditators is missing rather than shown to be equal. A sound reading takes the report seriously without overreading it.
    explanation: |
      Two errors are symmetrical: reading a survey as proof of harm, and dismissing reports because they do not prove it.

  - type: text
    id: insight
    title: "Two readings of insight"
    body: |
      Contemplative traditions speak of **insight**, a seeing that changes how one lives. It can be read at two levels. **As a psychological skill**, insight means noticing thoughts, feelings and urges as passing events rather than as orders or facts about oneself. According to clinical teachers, that is the useful part, and its effects (on anxiety, say) can be tested with trials like those above.

      **As a claim about reality**, insight has a metaphysical edge. According to Buddhist teaching, one of the three marks of existence is *anatta*, "non-self": there is no permanent, underlying self-substance, only five constantly changing factors (the *khandhas*) of body, feeling, perception, mental formations and awareness. A meditator may say they have seen this directly. According to Britannica, *anatta* departs from the Hindu teaching of *atman*, the enduring self, so a reader in a Hindu tradition may interpret the same absorption differently, and a materialist may say the sense of a fixed self is a model built by the brain (a view the lesson on the self discussed). The three readings use the same experience.

      A trial can show that learning to watch one's thoughts reduces anxiety. It cannot show that there is no self, because a brain-based explanation of the experience is compatible with several metaphysical views.

  - type: mcq
    id: insight-q
    title: "Which layer?"
    prompt: |
      Sort three statements. (a) Pooled trials with active controls found lower anxiety after mindfulness programs ($d=0.38$ at 8 weeks). (b) Whether such trials are large and unbiased enough to trust is disputed. (c) According to Buddhist teaching, careful meditation reveals that there is no permanent self. Which assignment of layers is right?
    options:
      - text: '(a) established finding of the trials, (b) live debate, (c) commitment of a tradition that experience can bear out.'
        correct: true
        feedback: |
          Yes. (a) rests on data, with a size and uncertainty; (b) is scholarly disagreement; (c) is a claim about reality whose truth the trials do not test, even if a practitioner finds it convincing by direct experience.
      - text: '(a), (b) and (c) are all established, because all are reported by scientists or monks.'
        feedback: |
          Who says it does not set the layer. (b) is a debate by its very wording, and (c) goes beyond what measures of stress can reach.
      - text: '(c) is established because many people report the experience, while (a) is only a commitment.'
        feedback: |
          Many people reporting an experience is data about reports, which is fact. Whether the experience reveals reality is another layer. And (a) is a measured result, not a commitment.
    explanation: |
      Neither side needs to lose here. A practitioner can accept the trial results and hold the metaphysical claim by faith or experience; a sceptic can accept the trial results and hold that the experience says only something about the brain. The difference is a premise, not the data.

  - type: mcq
    id: fair-q
    title: "A fair summary"
    multiple: true
    prompt: |
      Which statements fairly summarise the research on meditation described in this lesson? Select all that apply.
    options:
      - text: 'Randomized trials with active controls found small to moderate benefits for anxiety, depression and pain (Goyal and colleagues, 2014).'
        correct: true
      - text: 'Brain differences in long-term practitioners show that meditation reshapes the brain.'
        feedback: |
          Those studies compare groups that may have differed from the start (a selection effect), so they are suggestive, not proof of causation.
      - text: 'There is no evidence that meditation programs beat active treatments, and many trials were small.'
        correct: true
      - text: 'Meditation is risk-free, since few trials reported harms.'
        feedback: |
          Few trials looked for harms, and surveys and interviews report unpleasant experiences in a substantial minority of regular meditators, with cause and size unsettled.
      - text: 'Critics such as Van Dam and colleagues (2018) say that hype and weak methods outrun the data.'
        correct: true
    explanation: |
      A fair summary has three parts: a modest benefit seen in trials, honest limits (small samples, blinding, publication bias), and open questions about harms and mechanisms.

  - type: text
    id: summary
    body: |
      **Next:** Psychedelics and the Mind. Meditation changes the mind slowly and through practice; psychedelic drugs change it within hours, and the studies of them face the same questions of controls, expectation and what the experience shows about reality, with a new one: how do you blind a trial when the drug is unmistakable?
