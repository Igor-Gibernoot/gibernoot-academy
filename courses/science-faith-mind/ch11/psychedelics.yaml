id: ch11-psychedelics
title: "Psychedelics and the Mind"
kind: concept
own: |
  The setting: people who take a classic psychedelic (psilocybin, LSD, mescaline, DMT) in traditional rituals or in supervised clinical trials, and the question of what the drug does to the mind, how well trials can show it, and what the "mystical" experiences it can occasion mean. A trial compares an outcome in a drug group with the same outcome in a comparison group; with $p_1$ the share of the drug group and $p_2$ the share of the comparison group with the outcome (for example remission from depression), the trial reports
  {{ $$\text{difference}=p_1-p_2$$ }}
  - **Mechanism.** According to Vollenweider and colleagues (1998), the {{ **serotonin 2A receptor (5-HT2A)** }} is needed for psilocybin's psychological effects, since the blocker ketanserin stopped them. What happens next is a live debate: the entropic brain and REBUS readings (Carhart-Harris, Friston) say the brain's priors loosen, a plasticity reading (Ly and colleagues, 2018) says neurons grow new connections. A brain measure that changes is a correlate, not an explanation of the experience.
  - **Trials.** According to Griffiths and colleagues (2016), 51 patients with life-threatening cancer who received a high dose of psilocybin had large drops in depression and anxiety, and about 80% still showed clinically significant improvement at 6 months. According to Carhart-Harris and colleagues (2021), psilocybin did not differ significantly from the antidepressant escitalopram on the main depression score ($59$ patients), though remission was {{ $57\%$ against $28\%$ }} in secondary results (uncorrected for multiple comparisons).
  - **Blinding.** The drug is unmistakable, so participants and staff can often tell who got it. Then the measured effect mixes the drug and the expectation it brings:
  {{ $$\begin{aligned}\text{measured effect}={}&\text{drug effect}\\&+\text{expectation effect}\end{aligned}$$ }}
  and a trial cannot separate the two unless it measures expectation and unblinding.
  - **Set and setting.** According to Leary, Litwin and Metzner (1963), the experience depends on the person's mindset ({{ **set** }}) and on the physical and social surroundings ({{ **setting** }}), not on the drug alone.
  - **Mystical-type experience.** Questionnaires score features such as unity, sacredness and a sense of deep truth. According to Griffiths and colleagues (2006), a high dose given under supportive conditions occasioned experiences rated, two months later, as personally meaningful and spiritually significant. In the 2016 trial, a mystical-type experience on the session day mediated the effect of dose on outcome.
  - **Two readings of the content.** According to Huxley (1954), drawing on Broad and Bergson, the brain is a reducing valve that limits "Mind at Large", and the drug opens it: the experience glimpses more of reality. According to a materialist reading, the drug alters brain function and the vivid sense of truth is a feature of that state. Both predict the same reports, so the reports cannot decide.
  - **Risks and limits.** The main acute risk is overwhelming distress; trials typically exclude people with personal or family histories of psychosis, and give preparation and support, so their results may not carry over to everyone.
  - **Three layers.** That psilocybin changes experience and brain measures, and that small trials report benefit, is established; how large the benefit is once expectation is counted, and by what route, is a live debate; what the experiences reveal about reality is a commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: one session"
    prompt: |
      Guessing is the point; no theory yet. A person takes one large dose of a drug in a single supervised session lasting about six hours. Months later, many say it was among the most meaningful experiences of their lives. Which explanation do you find most natural?
    options:
      - text: 'The drug must have shown them something real that ordinary life hides.'
        feedback: |
          This is one serious reading, held by Aldous Huxley and others, and the lesson gives it its best form. But a vivid sense of meaning is also what a strongly altered brain state could produce, so it is not the only natural reading.
      - text: 'It is only a sense of meaning produced by an altered brain, and it is not worth studying.'
        feedback: |
          Dismissing it as "only" settles a question the lesson keeps open. Even if the brain explanation is right, lasting changes in mood and outlook are real outcomes that clinical trials measure.
      - text: 'It is hard to say yet: the experience may be a brain effect, a glimpse of reality, or partly expectation, and different evidence bears on each.'
        correct: true
        feedback: |
          This is the stance of the lesson. A person can be sincere about a deep experience and still be unsure what it shows.
    explanation: |
      The lesson sorts the evidence on psychedelics into three layers: what is established, what scholars debate, and what rests on a commitment.

  - type: text
    id: recall
    title: "Recall: states, practice and layers"
    body: |
      Recall: according to Charles Tart (1972), a **state of consciousness** is an overall pattern of how the mind functions (attention, memory, sense of self, sense of control), not one content or one brain measure. The lesson on meditation showed how a practice can change that pattern slowly and how hard it is to say by how much.

      A drug changes the pattern fast. Every claim about it can be sorted into three layers: **established fact** (data), **live debate** (scholars disagree), and **commitment** (a faith or metaphysical premise). The task here is to apply that sorting to a drug whose reports sound like religion.

  - type: text
    id: what
    title: "Classic psychedelics, old and new"
    image:
      src: img/hofmann.webp
      alt: "Photograph of Albert Hofmann, an elderly man with white hair, seen in conversation"
      caption: "Albert Hofmann (1906-2008), a chemist at Sandoz in Basel, first made LSD in 1938 and learned its effects by taking a dose himself in 1943."
      credit: "Philip H. Bailey (E-mail), CC BY-SA 2.5, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Albert_Hofmann_Oct_1993.jpg"
    body: |
      A **psychedelic** is a drug that produces a large change in perception, thought and sense of self. The **classic** ones are psilocybin (from certain mushrooms), LSD (made from a compound in the ergot fungus), mescaline (from the peyote cactus) and DMT (in the Amazonian brew ayahuasca, among other sources). Chemists note that they are related in action: all act on the serotonin system.

      Their use is old in some traditions. According to its members, the Native American Church uses peyote as a sacrament. According to Berkeley's psychedelics center, Amazonian peoples have used ayahuasca in healing and religious ritual for a very long time. The Mazatec healing vigil, the *velada*, uses mushrooms; R. Gordon Wasson described it for a wide audience in *Life* magazine in 1957.

      The modern laboratory story starts with Albert Hofmann. According to the standard account, he first made LSD in 1938, and on 19 April 1943 he deliberately swallowed 250 micrograms and rode home by bicycle, which gave the day its name. Hofmann's laboratory also worked on psilocybin in the 1950s.

  - type: mcq
    id: layers-q
    title: "Two ways to describe peyote"
    prompt: |
      A report says: "The Native American Church uses peyote as a sacrament, and its main active compound is mescaline." Which description of the two halves is fair?
    options:
      - text: 'Both halves are established fact in the same sense.'
        feedback: |
          They are both facts, but of different kinds. That the Church uses peyote as a sacrament is a fact about a community and its practice; whether the sacrament is what its members say is a commitment of the tradition, which the report does not claim.
      - text: 'The first states what a community does and holds; the second is a chemical fact. Neither says whether the experiences reveal anything about reality.'
        correct: true
        feedback: |
          Yes. Describing a tradition as its adherents do is not the same as asserting its metaphysics, and a chemical fact about the compound does not decide that either.
      - text: 'The second half refutes the first: a compound is a chemical, so the sacrament is nothing more.'
        feedback: |
          That inference needs a premise that a chemical route to an experience rules out its being meaningful or revealing. Believers can reply that a sacrament often uses a material means. The premise is a commitment, not a finding.
    explanation: |
      Keeping the claim about a practice, the claim about chemistry, and the claim about reality apart is the discipline of the whole lesson.

  - type: text
    id: mechanism
    title: "What the drug does in the brain"
    body: |
      The best-supported step concerns a receptor. A **receptor** is a protein on a cell that a molecule binds to, changing what the cell does. According to Vollenweider and colleagues (1998), in healthy volunteers the drug ketanserin, which blocks the **serotonin 2A receptor** (5-HT2A), stopped psilocybin's psychological effects. So that receptor is needed for the experience.

      Beyond that, readings differ. According to Robin Carhart-Harris and colleagues' **entropic brain** hypothesis (2014), ordinary waking consciousness keeps brain activity in a tightly organised regime, and psychedelics raise its disorder (entropy), loosening the default mode network, the brain network active in self-related mind wandering. In 2019, Carhart-Harris and Karl Friston proposed **REBUS** ("relaxed beliefs under psychedelics"): the brain works by predictions, and psychedelics relax the weight on overly rigid high-level predictions, which they suggest could help in mental illness. According to Ly, Olson and colleagues (2018), serotonergic psychedelics also promoted growth of neuron branches and synapses in cultured neurons and in animals, a **plasticity** reading. These are not rivals in every respect, but each puts the key effect in a different place.

  - type: mcq
    id: ketanserin-q
    title: "What the blocker shows"
    prompt: |
      Ketanserin blocks the serotonin 2A receptor and stopped psilocybin's psychological effects in volunteers. What does this fairly show?
    options:
      - text: 'That the experience is located in the 5-HT2A receptor, so the receptor is the experience.'
        feedback: |
          A receptor is a switch, not a place where an experience lives. Blocking it removes the experience, but the same would be true of any necessary step in a long causal chain.
      - text: 'That the receptor is a necessary step for the effect. How the experience arises from it, and what it is, is a separate question.'
        correct: true
        feedback: |
          Yes. It is a causal fact about the drug's route. It is compatible with materialist readings, with dualist ones (the brain as a receiver, as in Huxley's picture) and with agnosticism about both.
      - text: 'That psilocybin works by plasticity, since the receptor is on neurons.'
        feedback: |
          The plasticity reading is a separate hypothesis tested in other experiments, partly in cells and animals. A receptor being involved does not say which downstream route matters.
    explanation: |
      Philosophers of mind call the step from "this brain event is necessary" to "this is what the experience is" the explanatory gap. The lesson on the hard problem treated it in detail.

  - type: mcq
    id: imaging-q
    title: "What a brain measure shows"
    prompt: |
      Schartner and colleagues (2017) reanalysed recordings of brain activity from people given LSD, psilocybin or ketamine, and found higher "signal diversity" (a measure of how varied and unpredictable the signal is) than under placebo, and for some measures it tracked how intense people said the experience was. Which statement goes beyond what this shows?
    options:
      - text: 'Signal diversity is higher during the drug state and relates to reported intensity.'
        feedback: |
          This is what the measurement found. It is a correlation between a brain measure and a report.
      - text: 'High signal diversity is the experience, so a brain with that signal must be having a psychedelic experience.'
        correct: true
        feedback: |
          Yes, this goes too far. A correlate may be a cause, a consequence, or a byproduct of the experience, and the measure also rose under ketamine, a different drug with different effects. Whether such a measure could ever be the experience is the question of the lesson on consciousness and the brain.
      - text: 'Further studies with other measures and designs would be needed to learn more.'
        feedback: |
          This is a fair statement, not an overreach. A single measure from three small datasets is a start.
    explanation: |
      Neuroscience of psychedelics supplies correlates and causal manipulations (blocking a receptor, giving a dose). Neither alone says what the experience is.

  - type: mcq
    id: necessary-q
    title: "Is the experience part of the cure?"
    prompt: |
      Researchers disagree on a clinical question. Yaden and Griffiths argue that the strong subjective experience is necessary for the lasting benefit. Olson argues that some benefits, from the plasticity effects, may not depend on it. Which finding would most directly favor Olson's view?
    options:
      - text: 'A compound that promotes neural plasticity but causes no hallucinations, and still relieves depression in a trial.'
        correct: true
        feedback: |
          Yes. It would separate the plasticity effect from the experience. Such a test needs a good trial, including a blinded comparison.
      - text: 'People who had stronger mystical-type experiences improved more.'
        feedback: |
          This correlation is what Yaden and Griffiths cite. Critics note it does not show the experience caused the benefit: a better responder may also have a stronger experience.
      - text: 'People report the experience as meaningful two months later.'
        feedback: |
          A report of meaning is compatible with both views, so it cannot choose between them.
    explanation: |
      According to a conversation published by the ALIUS research group, the two researchers agree that the experience probably matters for full and lasting effects and that some benefit may occur without it. The disagreement is one of degree, which is typical of a live debate.

  - type: text
    id: trials
    title: "What the trials found"
    body: |
      According to Roland Griffiths and colleagues (2016), 51 patients with life-threatening cancer and depression or anxiety took part in a randomized, double-blind crossover trial: each received a very low dose of psilocybin (1 or 3 mg per 70 kg) and a high dose (22 or 30 mg per 70 kg), in random order, about five weeks apart, with preparation and support. The high dose produced large decreases in depression and anxiety, and about 80% of participants showed clinically significant improvement at the 6-month follow-up. The authors report that a mystical-type experience on the session day mediated the effect of dose.

      According to Carhart-Harris and colleagues (2021), 59 adults with long-standing moderate to severe depression were randomized for six weeks: 30 received two 25 mg doses of psilocybin three weeks apart with a daily placebo, and 29 received two 1 mg doses, too low to expect an effect, with a daily course of escitalopram, a standard antidepressant. The trial found no significant difference on its main depression score. Secondary results favored psilocybin: remission in 57% against 28% and response in 70% against 48%. The authors state that these secondary comparisons were not corrected for multiple comparisons.

  - type: numeric
    id: remission-n
    title: "Reading the remission numbers"
    prompt: |
      In the 2021 trial, remission was reported for 57% of the 30 patients in the psilocybin group and 28% of the 29 patients in the escitalopram group. About how many more patients were in remission in the psilocybin group than in the escitalopram group? Round each group to a whole number of patients.
    answer: 9
    tolerance: 0.01
    wrong:
      - { value: 29, feedback: "That is the percentage-point gap (57 - 28). The question asks for a count of patients: take 57% of 30 and 28% of 29 separately." }
    hint: "Multiply each percentage by its group size, then round and subtract."
    explanation: |
      $0.57\times 30\approx 17$ patients and $0.28\times 29\approx 8$ patients, so about $9$ more. With groups of this size one or two patients change the percentages by several points, and the result is secondary and uncorrected, so it is a hint for a larger trial, not a proof.

  - type: mcq
    id: trial-read-q
    title: "A fair headline"
    prompt: |
      The 2021 psilocybin-versus-escitalopram trial: main depression score not significantly different; secondary measures favored psilocybin; the escitalopram course lasted only six weeks, short for that drug. Which headline is fairest?
    options:
      - text: '"Psilocybin beats antidepressants."'
        feedback: |
          The main comparison was not significant, and the secondary measures were uncorrected and from a small trial. The headline treats a hint as a result.
      - text: '"Psilocybin and escitalopram did not differ significantly on the main score; secondary results favored psilocybin, and a larger, longer trial is needed."'
        correct: true
        feedback: |
          Yes. It reports the primary result first, flags the secondary ones as less secure, and notes the limits the authors themselves gave.
      - text: '"Psilocybin does nothing, since the main result was not significant."'
        feedback: |
          Not significant in a small trial means the trial could not tell; it does not show the effect is zero. The confidence interval for the difference was wide, running from -5.0 to 0.9 points in the report, which includes sizeable benefit and a small disadvantage.
    explanation: |
      A non-significant result in a small trial is "undecided", not "no effect", just as in the lesson on meditation, where a trial with 37 per group could not tell $d=0.38$ from zero.

  - type: text
    id: blinding
    title: "The blinding problem"
    body: |
      A **blinded** trial hides who got the drug so that expectation cannot colour the result. A high dose of a psychedelic is unmistakable, and even a low dose is often noticed, so many participants and staff guess correctly. When a participant knows they got the real drug, hope and expectation may add to the measured benefit:

      $$\begin{aligned}\text{measured effect}={}&\text{drug effect}\\&+\text{expectation effect}\end{aligned}$$

      According to Muthukumaraswamy and colleagues (2021), who reviewed psychedelic and ketamine trials from 1990 to 2020, the trials they examined did not report participants' expectations before the trial or whether the blinding worked, and they recommend measuring both. Rival view: Butler, Jelen and Rucker (2022) agree that trials probably overestimate the effect for this reason but argue that this is not unique to psychedelics and should not by itself bar a treatment from approval. Both views accept the problem; they differ on what to do about it.

  - type: mcq
    id: blind-q
    title: "Why unblinding matters"
    prompt: |
      In a trial, most participants given a high dose of psilocybin correctly guess they received it, and most given the comparison guess they did not. Why does this weaken the trial's conclusion about the drug itself?
    options:
      - text: 'It proves the drug has no real effect.'
        feedback: |
          It proves nothing of the kind. A real effect and a placebo effect can both be present; unblinding just makes them hard to separate.
      - text: 'The groups now differ in expectation as well as in the drug, so a difference in outcome could come from either.'
        correct: true
        feedback: |
          Yes. With expectation unbalanced between groups, the comparison no longer isolates the drug. This is why researchers suggest measuring expectation before the trial and asking everyone what they think they got.
      - text: 'Only the participants matter, since staff cannot influence results.'
        feedback: |
          Staff expectations can colour ratings and the support participants receive, so the problem is not limited to participants.
    explanation: |
      A fair reading of a psychedelic trial asks two questions: how large is the effect, and how much of it could be expectation? The second has no clean answer yet.

  - type: text
    id: mystical
    title: "The mystical-type experience"
    body: |
      A high dose can produce experiences that people describe as **mystical**: a sense of unity beyond the self, of sacredness, of encountering something deeply true, and a feeling that words cannot capture it. William James (1902) listed ineffability and a *noetic quality*, a sense of gaining knowledge, among the marks of mystical states, and researchers built questionnaires on such features.

      According to Griffiths and colleagues (2006), in a double-blind study volunteers who took a high dose of psilocybin under supportive conditions, compared with methylphenidate (a stimulant), reported mystical-type experiences, and two months later they rated the session as personally meaningful and spiritually significant. The volunteers were adults with no earlier psychedelic experience who took part in religious or spiritual activities, which matters for how far the result carries.

      The drug does not act alone. According to Leary, Litwin and Metzner (1963), the experience depends on the **set**, the mindset and expectations a person brings, and the **setting**, the physical and social surroundings. Modern trials respond with preparation sessions, a calm room, and trained guides who stay present.

  - type: mcq
    id: setting-q
    title: "Set and setting in a study"
    prompt: |
      Two groups take the same dose of psilocybin. Group A first meets two trained guides, prepares for several sessions, and takes the drug in a calm room. Group B takes it in a noisy room after a short briefing. Which prediction follows from the idea of set and setting?
    options:
      - text: 'The reports of the two groups should be the same, since the dose is the same.'
        feedback: |
          This is the view the idea of set and setting opposes. The drug sets the range of possible experience, but the mindset and surroundings strongly shape which one occurs.
      - text: 'The reports may differ systematically, so a result found under one set of conditions does not automatically transfer to another.'
        correct: true
        feedback: |
          Yes. This is also a limit on what trials show: a benefit found with careful preparation and support may not appear in a careless setting.
      - text: 'Group B will have no experience, since the drug needs a calm room.'
        feedback: |
          The drug has strong effects in any setting. The claim is that the character of the experience, including anxiety, depends partly on set and setting, not that setting switches the drug on or off.
    explanation: |
      Set and setting is also why the "drug effect" and the "care effect" are hard to separate in therapy trials: preparation and support are part of the treatment.

  - type: text
    id: readings
    title: "Two readings of the content"
    body: |
      What should we make of the sense of deep truth? According to Aldous Huxley, who took mescaline in 1953 and described it in *The Doors of Perception* (1954), drawing on the philosophers C. D. Broad and Henri Bergson, the brain works as a **reducing valve**: it filters a vast "Mind at Large" down to what survival needs, and mescaline opens the valve a little. On this reading the experience is a wider view of reality, and a mind that sees through the narrow filter is nearer the truth. James took a similar attitude toward nitrous oxide and mystical states: they show that ordinary waking consciousness is one type among others, though he drew no firm conclusion about what they reveal.

      According to a materialist reading, such as the one in REBUS, the drug loosens the brain's habitual predictions, producing an unusual state with vivid imagery and a strong sense that it matters. A sense of truth is a feeling the brain can generate, like the feeling of certainty in a dream. The experience then reveals how minds work, not what the world is like.

      Objections run both ways. To Huxley, a critic asks how we know the loosened-filter view is more adequate to reality rather than less. To the materialist, a defender asks why a feeling's being produced by the brain shows it is false; seeing is also produced by the brain.

  - type: mcq
    id: readings-q
    title: "What would separate the readings?"
    prompt: |
      Both the reducing-valve reading and the materialist reading predict that a person on a high dose will report a vivid sense of unity and of deep truth. What kind of evidence could favor one over the other?
    options:
      - text: 'More reports of the sense of truth, since a large number of sincere reports settles it.'
        feedback: |
          Both readings predict these reports, so adding more of them cannot decide. Sincerity is not in doubt; the question is what causes the experience and whether it carries information.
      - text: 'A report containing verified information the person could not have had by ordinary means, which a filter-removal view might allow and a pure brain-state view does not.'
        correct: true
        feedback: |
          Yes, such evidence would bear on it, which is a point on which both sides can agree about what would count. The materialist replies that no well-controlled case of this kind has been established, and defenders of the valve reading usually rest their view on argument and on the experience itself, a commitment.
      - text: 'Showing that the brain is active during the experience.'
        feedback: |
          Both readings expect brain activity. Huxley's reading says the brain mediates the experience; it does not say the brain is idle.
    explanation: |
      The point is not to pick a winner but to see which observations would discriminate. Many experiences claimed as mystical are described as ineffable, so the reports alone leave the metaphysical question open.

  - type: text
    id: risks
    title: "Risks and limits"
    body: |
      The main acute risk is **overwhelming distress**, often called a "bad trip": fear, confusion or paranoia that could lead a person to act dangerously. According to the safety guidelines of Johnson, Richards and Griffiths (2008), trials respond with careful screening, preparation, a safe room and at least two monitors in the session. They recommend excluding volunteers with a personal or family history of psychotic or other severe psychiatric disorders, because the drugs can rarely trigger prolonged psychosis, and they advise checking for hallucinogen persisting perception disorder (lasting visual disturbances) at follow-up.

      Exclusion is standard in psychedelic trials, but how firmly the risk is established is debated. A 2025 preprint on trial design calls the assumption that psychedelics induce psychosis in predisposed people inconclusive, and Downey and colleagues (2024) argue for a graded risk assessment for people with a family history of bipolar disorder rather than blanket exclusion. Careful screening also means the trial participants may differ from the people who would take the drug outside a clinic.

  - type: mcq
    id: limits-q
    title: "Who do the results speak for?"
    prompt: |
      A trial gave psilocybin with extended preparation and trained guides to patients free of any psychotic disorder and without such disorders in their families. A news story says "psilocybin cures depression". Which limit is most directly in the design?
    options:
      - text: 'The result may not carry over to people the trial excluded, or to settings without that preparation and support.'
        correct: true
        feedback: |
          Yes. The trial shows what happened for that kind of patient under those conditions. Other groups and settings need their own evidence, and exclusions are often there to protect people whose risk is not yet known.
      - text: 'The trial shows psilocybin is dangerous for everyone.'
        feedback: |
          The exclusions reflect precaution about specific risks, not a finding of danger for everyone. The trials reported mostly mild, short-lived effects under supervision, though the follow-up periods were limited.
      - text: 'There is no limit, since a randomized trial always applies to everyone.'
        feedback: |
          Randomization protects against bias within the trial's own sample. It does nothing about whom the trial let in or how the drug was given.
    explanation: |
      Internal validity (was the comparison fair?) and external validity (to whom does it apply?) are separate questions, and a news story often merges them.

  - type: mcq
    id: layers-final
    title: "Sorting claims"
    prompt: |
      Sort three claims. (a) Blocking the 5-HT2A receptor stops psilocybin's psychological effects in volunteers. (b) Psilocybin's benefit in depression, once expectation is counted, is large. (c) The mystical experience under mescaline is a glimpse of a wider reality. Which sorting fits the three layers?
    options:
      - text: '(a) established fact, (b) live debate, (c) commitment.'
        correct: true
        feedback: |
          Yes. (a) is an experimental result, (b) is debated because of small trials and unblinding, and (c) rests on a metaphysical premise that neither side can currently test with these trials.
      - text: '(a) live debate, (b) established fact, (c) commitment.'
        feedback: |
          Trials suggest benefit, but blinding and sample size leave its size open, so (b) is not settled. Meanwhile the receptor result in (a) is firmer.
      - text: '(a) established fact, (b) commitment, (c) live debate.'
        feedback: |
          The size of a benefit is an empirical question that further trials can answer, so (b) is not a commitment. (c) can be argued about, but it turns on a premise about reality that evidence from these trials does not settle.
    explanation: |
      Notice that someone who accepts (a) and (b) can accept or reject (c). The claims are logically separate.

  - type: text
    id: summary
    body: |
      **Next:** Near-Death and Out-of-Body Experiences. Another state, reported by people near death or in a body-leaving sensation, comes with equally strong claims about what it reveals. We ask what is reported, what brain explanations offer, and which studies tried to test the claims.
