id: ch11-map
title: "Content Map: Altered States and Anomalous Claims"
kind: map
name: Level 11, Altered States and Anomalous Claims (states of consciousness, sleep and dreams, hypnosis and flow, meditation, psychedelics, near-death experiences, mediumship, parapsychology, the odds form of Bayes' rule, replication and shared causes, the three layers)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 11 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a state confused with its content, a correlation read as a cause, a rate computed the wrong way, a probability turned upside down), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: states
    title: States of consciousness
    row: 1
    col: 2
    body: |
      According to Charles Tart (1972), a **state of consciousness** is an overall **pattern of functioning** of the mind (attention, memory, sense of self, control), not a single feature. The **content** of an experience (what you dream about, what you see) is a different thing from the **state** in which it occurs. That brain activity and experience change across states is **established fact**.
    decoys:
      - body: |
          According to Charles Tart (1972), a **state of consciousness** is a single **content** of the mind (what you dream about, what you see), not a pattern of functioning. The **state** of an experience is the same thing as its **content**. That brain activity and experience change across states is **established fact**.
        feedback: |
          State and content are kept apart. A state is the overall pattern of how the mind works; the same content (a face, a place) can turn up in different states, and the same state can carry any content.
      - body: |
          According to Charles Tart (1972), a **state of consciousness** is an overall **pattern of functioning** of the mind (attention, memory, sense of self, control), not a single feature. The **content** of an experience (what you dream about, what you see) is a different thing from the **state** in which it occurs. That **each state gives access to a reality beyond the brain** is **established fact**.
        feedback: |
          That experience and brain activity change across states is the established layer. Whether a state reveals a reality beyond the brain is a metaphysical commitment, and it has to be labelled as one.
    explanation: |
      The root of the level: every later box is a state of consciousness or a claim made about one, and the first question is what is a state and what is only its content.

  - id: sleep
    title: Sleep and dreams
    row: 2
    col: 1
    body: |
      Aserinsky and Kleitman (1953) found **REM** sleep, in a cycle of about 90 minutes with non-REM stages. According to Siclari and colleagues (2017), a dream report of any kind goes with activity in a **posterior hot zone** of the cortex, in REM or not:
      $$\begin{gathered}\text{dream report}\\ \Leftrightarrow\\ \text{posterior hot zone active}\end{gathered}$$
      A **lucid dream** is checked by a pre-agreed **eye signal** sent during REM sleep; in a 2021 study dreamers answered correctly in 18.4% of 158 attempts (about 29), and the most common outcome was no response.
    decoys:
      - body: |
          Aserinsky and Kleitman (1953) found **REM** sleep, in a cycle of about 90 minutes with non-REM stages. According to Siclari and colleagues (2017), dreams occur **only in REM**, so a dream report goes with the REM stage:
          $$\begin{gathered}\text{dream report}\\ \Leftrightarrow\\ \text{REM stage}\end{gathered}$$
          A **lucid dream** is checked by a pre-agreed **eye signal** sent during REM sleep; in a 2021 study dreamers answered correctly in 18.4% of 158 attempts (about 29), and the most common outcome was no response.
        feedback: |
          Dreams are also reported after waking from non-REM sleep. The finding of Siclari and colleagues is that the report follows the posterior hot zone, not the sleep stage, which is why the stage is a poor stand-in for the dream.
      - body: |
          Aserinsky and Kleitman (1953) found **REM** sleep, in a cycle of about 90 minutes with non-REM stages. According to Siclari and colleagues (2017), a dream report of any kind goes with activity in a **posterior hot zone** of the cortex, in REM or not:
          $$\begin{gathered}\text{dream report}\\ \Leftrightarrow\\ \text{posterior hot zone active}\end{gathered}$$
          A **lucid dream** is checked by the dreamer's **report on waking**; in a 2021 study dreamers answered correctly in 18.4% of 158 attempts (about 150), so most attempts succeeded.
        feedback: |
          A report after waking could be a false memory, so researchers use a pre-agreed eye signal sent during the sleep itself. And 18.4% of 158 is about 29, with no response the most common outcome: the method works, but rarely.
    explanation: |
      The first case study of a state with a measurable marker, and a lesson in checking a private report against a record made at the time.

  - id: hypnosis
    title: Hypnosis and flow
    row: 2
    col: 2
    body: |
      Two readings of hypnosis: the **state** view (Hilgard) says it divides the control systems of the mind; the **sociocognitive** view (Kirsch, Lynn, Spanos) says expectation, role and motivation explain it. Both can read the same result (Raz and colleagues 2005, a suggestion reducing Stroop conflict), so it is a **live debate**. **Flow** (Csikszentmihalyi) needs a balance:
      $$\text{flow}\ \Leftarrow\ \text{challenge}\approx\text{skill}$$
    decoys:
      - body: |
          Two readings of hypnosis: the **sociocognitive** view (Hilgard) says it divides the control systems of the mind; the **state** view (Kirsch, Lynn, Spanos) says expectation, role and motivation explain it. Both can read the same result (Raz and colleagues 2005, a suggestion reducing Stroop conflict), so it is a **live debate**. **Flow** (Csikszentmihalyi) needs a balance:
          $$\text{flow}\ \Leftarrow\ \text{challenge}\approx\text{skill}$$
        feedback: |
          The names are swapped. Hilgard's neodissociation is the state view; Kirsch, Lynn and Spanos give the sociocognitive reading with ordinary expectation and role.
      - body: |
          Two readings of hypnosis: the **state** view (Hilgard) says it divides the control systems of the mind; the **sociocognitive** view (Kirsch, Lynn, Spanos) says expectation, role and motivation explain it. The Raz result **settles the debate** for the state view. **Flow** (Csikszentmihalyi) is greatest when the task is far harder than the skill:
          $$\text{flow}\ \Leftarrow\ \text{challenge}\gg\text{skill}$$
        feedback: |
          Both camps read the Raz result their own way, so it settles nothing. And flow needs challenge and skill in balance: a task far too hard brings anxiety, one far too easy brings boredom.
    explanation: |
      A state that people can induce in themselves or others, and a dispute about whether it is a special state at all, kept separate from the data both sides accept.

  - id: meditation
    title: Meditation
    row: 2
    col: 3
    body: |
      A **state** effect is a change during the practice, a **trait** effect a lasting change outside it. A group difference in experts can come from who becomes an expert (a **selection effect**):
      $$\begin{gathered}\text{group difference}\\ \not\Rightarrow\\ \text{practice caused it}\end{gathered}$$
      Goyal and colleagues (2014) found small to moderate effects, $d\approx0.3$ for anxiety, depression and pain, no better than an active treatment. With $n$ per group,
      $$\text{SE}(d)\approx\sqrt{\frac{2}{n}+\frac{d^2}{4n}}$$
      so one trial with $n=37$ cannot tell $d=0.38$ from zero.
    decoys:
      - body: |
          A **state** effect is a change during the practice, a **trait** effect a lasting change outside it. A group difference in experts shows the **practice caused it**:
          $$\begin{gathered}\text{group difference}\\ \Rightarrow\\ \text{practice caused it}\end{gathered}$$
          Goyal and colleagues (2014) found large effects, $d\approx0.3$ for anxiety, depression and pain, **better than an active treatment**. With $n$ per group,
          $$\text{SE}(d)\approx\sqrt{\frac{2}{n}+\frac{d^2}{4n}}$$
          so one trial with $n=37$ cannot tell $d=0.38$ from zero.
        feedback: |
          Experts may differ because of who takes up the practice, so the difference alone does not show a cause. And $d\approx0.3$ is small to moderate, with no evidence of beating an active treatment.
      - body: |
          A **state** effect is a change during the practice, a **trait** effect a lasting change outside it. A group difference in experts can come from who becomes an expert (a **selection effect**):
          $$\begin{gathered}\text{group difference}\\ \not\Rightarrow\\ \text{practice caused it}\end{gathered}$$
          Goyal and colleagues (2014) found small to moderate effects, $d\approx0.3$ for anxiety, depression and pain, no better than an active treatment. With $n$ per group,
          $$\text{SE}(d)\approx\sqrt{\frac{2}{n}+\frac{d^2}{4n}}$$
          so a trial with $n=37$ **settles that $d=0.38$ is not zero**.
        feedback: |
          With $n=37$ the standard error is about 0.23, so the interval runs from about $-0.08$ to $0.84$ and includes zero. A single small trial cannot settle it.
    explanation: |
      The same logic of group comparison that returns in every later box: a difference is not a cause, and an effect size comes with an uncertainty that shrinks only as the groups grow.

  - id: psychedelics
    title: Psychedelics
    row: 3
    col: 3
    body: |
      According to Vollenweider and colleagues (1998), the **5-HT2A** receptor is needed for psilocybin's effects, since the blocker ketanserin stopped them. Trials are hard to blind, so
      $$\begin{aligned}\text{measured}={}&\text{drug}\\&+\text{expectation}\end{aligned}$$
      The experience depends on **set** (mindset) and **setting** (surroundings). According to Huxley's **reducing valve** reading the drug opens the brain to more of reality; the **materialist** reading says the drug alters brain function. Both predict the same reports.
    decoys:
      - body: |
          According to Vollenweider and colleagues (1998), the **5-HT2A** receptor is needed for psilocybin's effects, since the blocker ketanserin stopped them. Trials are easy to blind, so the measured effect is the **drug effect alone**. The experience depends on **set** (surroundings) and **setting** (mindset). According to Huxley's **reducing valve** reading the drug opens the brain to more of reality; the **materialist** reading says the drug alters brain function. Both predict the same reports.
        feedback: |
          The drug is unmistakable, so participants and staff often know who got it, and the measured effect mixes drug and expectation. Set is the mindset and setting the surroundings, not the reverse.
      - body: |
          According to Vollenweider and colleagues (1998), the **5-HT2A** receptor is needed for psilocybin's effects, since the blocker ketanserin stopped them. Trials are hard to blind, so
          $$\begin{aligned}\text{measured}={}&\text{drug}\\&+\text{expectation}\end{aligned}$$
          The experience depends on **set** (mindset) and **setting** (surroundings). According to Huxley's **reducing valve** reading the drug opens the brain to more of reality; the **materialist** reading says the drug alters brain function. The vivid reports **favour the reducing valve** over the materialist reading.
        feedback: |
          Both readings predict the same reports, a vivid sense of truth included, so the reports cannot decide between them. That is why the question is labelled a commitment and not a result.
    explanation: |
      A drug that produces states on demand, tested in trials where the blinding fails; the same reports are read in two opposite ways.

  - id: nde
    title: Near-death experiences
    row: 3
    col: 1
    body: |
      Greyson's scale has 16 items scored 0, 1 or 2, a total $S$ from 0 to 32, and an experience counts as an NDE when $S\ge7$. With $k$ reports among $n$ interviewed,
      $$\text{rate}=\frac{k}{n}$$
      (AWARE II: 6 of 28, about 21%). Brain explanations (right angular gyrus, REM intrusion, a surge at cardiac arrest) are correlates and models. In the AWARE hidden-target test no survivor identified a target, but few arrests occurred where targets were placed, so the likelihood ratio is **near 1**.
    decoys:
      - body: |
          Greyson's scale has 16 items scored 0, 1 or 2, a total $S$ from 0 to 32, and an experience counts as an NDE when $S\ge7$. With $k$ reports among $n$ interviewed,
          $$\text{rate}=\frac{n}{k}$$
          (AWARE II: 28 of 6, about 4.7). Brain explanations (right angular gyrus, REM intrusion, a surge at cardiac arrest) are correlates and models. In the AWARE hidden-target test no survivor identified a target, but few arrests occurred where targets were placed, so the likelihood ratio is **near 1**.
        feedback: |
          A rate is the share of those interviewed who report something, $k/n$, so 6 of 28 is about 21%. A value of 4.7 cannot be a share.
      - body: |
          Greyson's scale has 16 items scored 0, 1 or 2, a total $S$ from 0 to 32, and an experience counts as an NDE when $S\ge7$. With $k$ reports among $n$ interviewed,
          $$\text{rate}=\frac{k}{n}$$
          (AWARE II: 6 of 28, about 21%). Brain explanations (right angular gyrus, REM intrusion, a surge at cardiac arrest) **demonstrate** what a dying brain does. In the AWARE hidden-target test no survivor identified a target, which **strongly favours** the brain reading.
        feedback: |
          Each brain finding is a correlate or a model, not a demonstration of the whole pattern. And with few testable cases a null result would be likely under either reading, so the likelihood ratio is close to 1, weak evidence both ways.
    explanation: |
      A report that cannot be checked from outside, turned into a rate and a test, and then into a likelihood ratio that shows how little a null result says when few cases can be tested.

  - id: mediumship
    title: Mediumship
    row: 3
    col: 2
    body: |
      Vague statements that fit almost everyone give the **Barnum (Forer) effect**; with $n$ statements each fitting a share $p$ of people, a reading is expected to fit $np$ by chance. According to the sociocognitive view, a learned role plus **dissociation** produces a real experience of being spoken through, with content from the person. In a **blinded** pair test with $m$ choices at random,
      $$P=\left(\tfrac12\right)^{m}$$
      and even a clean result could not separate survival from information gained by the living (super-psi).
    decoys:
      - body: |
          **Specific** statements that fit almost no one give the **Barnum (Forer) effect**; with $n$ statements each fitting a share $p$ of people, a reading is expected to fit $np$ by chance. According to the sociocognitive view, a learned role plus **dissociation** produces a real experience of being spoken through, with content from the person. In a **blinded** pair test with $m$ choices at random,
          $$P=\left(\tfrac12\right)^{m}$$
          and even a clean result could not separate survival from information gained by the living (super-psi).
        feedback: |
          The Barnum effect comes from vague statements that sound personal but fit nearly everyone, which is why a sitter's recognition is weak evidence.
      - body: |
          Vague statements that fit almost everyone give the **Barnum (Forer) effect**; with $n$ statements each fitting a share $p$ of people, a reading is expected to fit $np$ by chance. According to the sociocognitive view, **dissociation** shows that a spirit speaks through the medium. In a **blinded** pair test with $m$ choices at random,
          $$P=\frac{1}{2m}$$
          and a clean result would show that the dead communicate.
        feedback: |
          Dissociation is a split among normally joined functions, which the sociocognitive view reads without spirits. Guessing right $m$ times in a row has probability $(1/2)^m$, not $1/(2m)$, and a clean result would still leave super-psi as a rival.
    explanation: |
      A claim to receive information from the dead, with a ready ordinary explanation (cold reading and vague statements) and a design that can in principle test it.

  - id: parapsychology
    title: Parapsychology
    row: 4
    col: 2
    body: |
      The **p-value** is the probability of a result at least this extreme if only chance acts:
      $$p=P(\text{result}\mid\text{chance})$$
      not the probability that chance caused it. Low **power** misses real effects. With $k$ tests at the 5% level and no real effect, the chance of at least one false positive is
      $$1-(0.95)^{k}$$
      (64% for $k=20$). With 10 true ideas in 1,000, power 50% and $\alpha=0.05$ the share of significant results that are real is about 9%. The Open Science Collaboration (2015) replicated about 36% of 97 significant originals, and Bem's precognition results failed to replicate.
    decoys:
      - body: |
          The **p-value** is the probability that **chance caused the result**:
          $$p=P(\text{chance}\mid\text{result})$$
          Low **power** misses real effects. With $k$ tests at the 5% level and no real effect, the chance of at least one false positive is
          $$1-(0.95)^{k}$$
          (64% for $k=20$). With 10 true ideas in 1,000, power 50% and $\alpha=0.05$ the share of significant results that are real is about 9%. The Open Science Collaboration (2015) replicated about 36% of 97 significant originals, and Bem's precognition results failed to replicate.
        feedback: |
          The p-value runs the other way: it assumes chance and asks how surprising the result is. It is not the probability that chance is the cause, which would also need a prior.
      - body: |
          The **p-value** is the probability of a result at least this extreme if only chance acts:
          $$p=P(\text{result}\mid\text{chance})$$
          not the probability that chance caused it. Low **power** misses real effects. With $k$ tests at the 5% level and no real effect, the chance of at least one false positive is
          $$1-(0.05)^{k}$$
          (about 0 for $k=20$). With 10 true ideas in 1,000, power 50% and $\alpha=0.05$ the share of significant results that are real is about **95%**. The Open Science Collaboration (2015) replicated about **97%** of 97 significant originals, and Bem's precognition results failed to replicate.
        feedback: |
          The chance of no false positive in $k$ tests is $0.95^k$, so at least one has probability $1-0.95^k$ (64% for 20). With few true ideas, most significant results are false (about 9% real). And only about 36% of the originals replicated.
    explanation: |
      The same statistics that make a claim look strong also show how often a small, flexible, selectively reported study produces a false positive, which is why replication became the test.

  - id: odds
    title: Odds form of Bayes
    row: 5
    col: 1
    body: |
      With $H$ the claim, $\neg H$ its rival and $E$ the result, evidence multiplies the prior odds by the likelihood ratio:
      $$\begin{aligned}\frac{P(H\mid E)}{P(\neg H\mid E)}={}&\frac{P(E\mid H)}{P(E\mid\neg H)}\\&\cdot\frac{P(H)}{P(\neg H)}\end{aligned}$$
      A **zero prior** stays zero however large the ratio, and a **weak test** has a ratio near 1 and barely moves the odds. A small p-value is not the posterior: with prior odds $10^{-6}$, power 0.5 and $P(E\mid\neg H)=0.01$ the posterior odds are only $5\times10^{-5}$.
    decoys:
      - body: |
          With $H$ the claim, $\neg H$ its rival and $E$ the result, evidence **adds** the likelihood ratio to the prior odds:
          $$\begin{aligned}\frac{P(H\mid E)}{P(\neg H\mid E)}={}&\frac{P(E\mid H)}{P(E\mid\neg H)}\\&+\frac{P(H)}{P(\neg H)}\end{aligned}$$
          A **zero prior** stays zero however large the ratio, and a **weak test** has a ratio near 1 and barely moves the odds. A small p-value is not the posterior: with prior odds $10^{-6}$, power 0.5 and $P(E\mid\neg H)=0.01$ the posterior odds are only $5\times10^{-5}$.
        feedback: |
          Odds are multiplied, not added. With prior odds $10^{-6}$ and a ratio of 50 the product is $5\times10^{-5}$; adding would give about 50.
      - body: |
          With $H$ the claim, $\neg H$ its rival and $E$ the result, evidence multiplies the prior odds by the likelihood ratio:
          $$\begin{aligned}\frac{P(H\mid E)}{P(\neg H\mid E)}={}&\frac{P(E\mid H)}{P(E\mid\neg H)}\\&\cdot\frac{P(H)}{P(\neg H)}\end{aligned}$$
          A **zero prior** can be overcome by a large enough ratio, and a **weak test** has a ratio near 1 and **moves the odds a lot**. A small p-value is the posterior probability of $H$.
        feedback: |
          Zero times any ratio is zero, so a zero prior never moves. A ratio near 1 leaves the odds almost unchanged. And a small p-value is $P(\text{result}\mid\text{chance})$, not $P(H\mid E)$.
    explanation: |
      The rule that turns the level's questions into one calculation: how strange the claim is before the result, and how much more likely the result is if the claim is true.

  - id: replication
    title: Replications and shared cause
    row: 5
    col: 3
    body: |
      $n$ independent, clean replications multiply the likelihood ratio, so the odds grow as
      $$\mathrm{LR}^{\,n}\cdot\frac{P(H)}{P(\neg H)}$$
      With $\mathrm{LR}=50$ and prior odds $10^{-6}$, even odds need $n=4$. If a **shared flaw** (present with probability $c$) makes every run succeed whatever the truth, the runs are not independent and the likelihood ratio is **capped near $1/c$** however many are added.
    decoys:
      - body: |
          $n$ independent, clean replications multiply the likelihood ratio, so the odds grow as
          $$\mathrm{LR}^{\,n}\cdot\frac{P(H)}{P(\neg H)}$$
          With $\mathrm{LR}=50$ and prior odds $10^{-6}$, even odds need $n=4$. If a **shared flaw** (present with probability $c$) makes every run succeed whatever the truth, the runs are still independent and the likelihood ratio **keeps growing without limit** as more are added.
        feedback: |
          A shared flaw ties the runs together: if it is present, every run succeeds whether or not the claim is true. Then the extra runs add almost no information and the ratio stops near $1/c$.
      - body: |
          $n$ independent, clean replications **add** to the likelihood ratio, so the odds grow as
          $$n\cdot\mathrm{LR}\cdot\frac{P(H)}{P(\neg H)}$$
          With $\mathrm{LR}=50$ and prior odds $10^{-6}$, even odds need $n=4$. If a **shared flaw** (present with probability $c$) makes every run succeed whatever the truth, the likelihood ratio is **capped near $1/c$** however many are added.
        feedback: |
          Independent results multiply: $50^4=6.25\times10^{6}$, which beats $10^{6}$ and gives even odds at $n=4$. Adding would need about $20{,}000$ replications.
    explanation: |
      Why many replications can be worth a great deal, and why they are worth much less when every run shares the same weakness.

  - id: layers
    title: Three layers
    row: 6
    col: 2
    body: |
      Every claim in the level is sorted: **established fact** (reports, brain changes across states, vague statements satisfying sitters, false positives from flexible studies), **live debate** (whether hypnosis is a special state, how large the benefits are, whether any ganzfeld result survives fair tests), and **faith or metaphysical commitment** (whether any state reaches beyond the brain, whether the dead communicate). A commitment is never passed off as a fact, in either direction.
    decoys:
      - body: |
          Every claim in the level is sorted: **established fact** (whether any state reaches beyond the brain, whether the dead communicate), **live debate** (whether hypnosis is a special state, how large the benefits are, whether any ganzfeld result survives fair tests), and **faith or metaphysical commitment** (reports, brain changes across states, false positives from flexible studies). A commitment is never passed off as a fact, in either direction.
        feedback: |
          The layers are swapped. That people report these experiences and that brain measures change is the established layer; whether any state reaches beyond the brain or the dead communicate is the commitment.
      - body: |
          Every claim in the level is sorted: **established fact** (reports, brain changes across states, vague statements satisfying sitters, false positives from flexible studies), **live debate** (whether hypnosis is a special state, how large the benefits are, whether any ganzfeld result survives fair tests), and **faith or metaphysical commitment** (whether any state reaches beyond the brain, whether the dead communicate). A commitment may be **presented as a fact** when most experts agree with it.
        feedback: |
          The sorting is the discipline of the course: agreement among experts changes the layer only if the evidence does. A commitment stays a commitment, and calling it a fact (or calling a fact a mere opinion) mixes the layers.
    explanation: |
      Where the level lands: what is documented, what is still argued, and what each person brings from outside the data.

