outroTitle: Level 11 in one picture
outro: |
  A **state of consciousness** is a pattern of functioning, apart from its content (Tart). **Sleep** shows a cycle and a dream report tied to a posterior hot zone, with lucid dreams checked by eye signals; **hypnosis** is read as a special state or as ordinary expectation, and **flow** needs challenge and skill in balance. **Meditation** separates state from trait and warns that $\text{group difference}\not\Rightarrow\text{practice caused it}$, with effects near $d\approx0.3$ and an uncertainty $\text{SE}(d)$ that shrinks with $n$. **Psychedelics** mix drug and expectation effects and invite two readings (reducing valve, materialist) that predict the same reports. **Near-death experiences** are counted by a rate $k/n$ and tested with hidden targets whose likelihood ratio is near 1. **Mediumship** meets cold reading, Barnum statements and a blinded test with chance $(1/2)^m$. **Parapsychology** teaches the p-value, power, $1-0.95^k$ and the replication crisis. The **odds form** multiplies prior odds by the likelihood ratio, a zero prior stays zero, and **shared causes** cap what replications can add near $1/c$. People part ways on the prior, on the rival explanation, and on whether any state reaches beyond the brain. The level challenge applies all of this to real claims about unusual experiences.
