id: ch11-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: altered states of mind"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: states of consciousness, sleep and dreams, meditation, psychedelics, near-death and out-of-body experiences, mediumship, parapsychology, and how to weigh extraordinary claims. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone, and where thoughtful people differ the feedback shows both sides. Notation as in the lessons: $d$ is an effect size (a difference between group means measured in standard deviations), $p$ is a p-value, and an odds ratio of evidence is written LR (likelihood ratio).

  - type: mcq
    id: altered-impaired
    title: "Altered means worse?"
    prompt: |
      A student says: "An altered state of consciousness is a broken one: the mind is impaired, and anything it reports can be ignored." According to Charles Tart (1972), who defined a state of consciousness as an overall pattern of mental functioning, what is the best correction?
    options:
      - text: 'A state is a whole pattern of functioning (attention, memory, sense of self, thought), and "altered" only says the pattern differs from the ordinary waking baseline. Some alterations impair (deep intoxication), some change the balance without a general loss, and flow, where challenge and skill match, can go with excellent performance. The content of a report is judged separately from the state it came from.'
        correct: true
        feedback: |
          Yes. "Altered" is a description of difference, not a verdict of worth. Whether a report made in the state is reliable is a further question, answered by testing it.
      - text: 'Altered states are always more insightful than waking life, which is why people seek them.'
        feedback: |
          That reverses the shortcut but keeps its error: it grades the state as a whole. Some reports from altered states are accurate, some are not, and each has to be checked.
      - text: 'A state and its content are the same thing, so a strange state means strange content.'
        feedback: |
          The lesson separated them. The same content (a face, a thought) can occur in different states, and a state can carry ordinary content. Strangeness of the state does not fix the truth of what is reported.
    explanation: |
      Calling a state "altered" says how the pattern of functioning differs from the baseline. Impairment, enhancement and plain difference are all possible, and the accuracy of what a person reports is a separate matter.

  - type: mcq
    id: rem-dreaming
    title: "REM is dreaming, dreaming is REM?"
    prompt: |
      A student says: "Rapid eye movement (REM) sleep is the stage of dreaming, so if you are woken from non-REM sleep you will report nothing, and a dream means REM happened." Which comment fits the evidence?
    options:
      - text: 'REM sleep was described by Aserinsky and Kleitman in 1953 and goes with vivid dreams, but dream-like experience is also reported after awakenings from non-REM sleep. Siclari and colleagues (2017) found that dreaming, in either stage, goes with activity in a posterior "hot zone" of the cortex. The older activation-synthesis view (Hobson and McCarley, 1977) tied dreams more tightly to REM-linked brainstem activity.'
        correct: true
        feedback: |
          Yes. REM is a stage defined by eye movements, brain activity and loss of muscle tone. Dreaming is an experience. They overlap strongly without being the same thing.
      - text: 'Dreaming never happens in REM, only in deep sleep.'
        feedback: |
          Vivid dreams are reported most often after REM awakenings. The correction is that REM is not the only place, not that REM is excluded.
      - text: 'Dreaming is only a memory made at the moment of waking, so it has no link to any sleep stage.'
        feedback: |
          Recall at waking is a real limit of dream research, but the posterior hot zone result links reported dreaming to brain activity during sleep, and different stages differ in how often dreams are reported.
    explanation: |
      A stage is defined by measurements; a dream is defined by report. The two are correlated, and the correlation is not an identity. The lesson A Map of Conscious States made the same point for other states.

  - type: mcq
    id: lucid-verified
    title: "Eye signals verify the dream?"
    prompt: |
      In a lucid dream the sleeper knows they are dreaming. Researchers (Keith Hearne in 1975, Stephen LaBerge in 1981) had dreamers agree beforehand to make a pattern of left-right eye movements, which a recording of eye muscles can show. A student says: "So the recording verifies everything the dreamer later reports about the dream." What is the right reading?
    options:
      - text: 'The pre-agreed signal shows that the sleeper was asleep, in REM, and aware enough to carry out the plan at that moment. What happened in the dream, and how it looked, is still a later self-report. Newer work (Konkoly and colleagues, 2021) exchanged questions and answers with dreamers, and in 158 attempts about 18% were answered correctly (roughly 29), with no response the most common outcome. So two-way contact is possible but unreliable.'
        correct: true
        feedback: |
          Yes. The signal verifies the awareness and the timing, not the dream content. Content is checked only when it is part of the planned exchange.
      - text: 'The signal proves nothing, because anyone could fake eye movements while awake.'
        feedback: |
          The recording also shows the sleep stage, so a wake-state fake would be visible in the sleep record. The signal does verify something real, namely awareness during REM.
      - text: 'Lucid dreams are fully verified, so dreams in general can be reported reliably.'
        feedback: |
          The signal covers only the planned moment. Most dream reports are still memories written after waking, with the usual limits of memory.
    explanation: |
      Verification has a size. The eye signal turns "I was lucid" from a private report into a recorded event, and leaves the rest of the dream where it was.

  - type: mcq
    id: meditation-cure
    title: "d = 0.3 means it works for everyone?"
    prompt: |
      A review of 47 randomised trials of mindfulness programmes (Goyal and colleagues, 2014) found moderate evidence of small improvements, with $d$ about 0.3 for anxiety, depression and pain. A student says: "A 0.3 effect means meditation cures about a third of anxious people." What is the best correction?
    options:
      - text: '$d$ is a difference between group means in standard deviations. A value of 0.3 means the average treated person ends up about 0.3 spread-widths better than the average control, with large overlap between the groups. It says nothing about a fraction cured. Also, that review found no evidence that the programmes were better than other active treatments.'
        correct: true
        feedback: |
          Yes. A small average shift can come from a few people improving a lot or from many improving a little. The effect size is a statement about group averages, and a rough convention (Cohen) calls 0.2 small and 0.5 medium.
      - text: '$d = 0.3$ means 30% of people improve and 70% do not.'
        feedback: |
          $d$ is not a percentage of people. It is a distance between averages, measured in units of the spread of the scores.
      - text: 'A small $d$ proves meditation does nothing.'
        feedback: |
          A small average effect is still an effect, and with about 37 people per group, as in a typical trial here, the uncertainty is large. The honest summary is "small, uncertain, not clearly better than active alternatives".
    explanation: |
      Effect sizes describe averages and carry uncertainty. For a typical group of 37 the 95% interval around $d = 0.38$ runs from about $-0.08$ to $0.84$, so a single small trial can hardly tell a modest effect from none.

  - type: mcq
    id: meditation-expert
    title: "Experts differ, so practice caused it?"
    prompt: |
      A study compares the brains of 8 long-term Buddhist practitioners (mean age 49) with 10 novice students (mean age 21) and finds stronger gamma-band activity in the practitioners during meditation (Lutz and colleagues, 2004). A student says: "This shows that meditation practice changes the brain." What is the main caution?
    options:
      - text: 'The groups were not assigned at random. People who stay with decades of practice may differ from the start (temperament, lifestyle, age, health), so a difference between groups can reflect who becomes an expert (a selection effect) rather than what practice did. The study did find a correlation with hours of practice, which fits the causal reading but does not exclude selection. A trial that assigns novices to practice or to a control tests causation directly.'
        correct: true
        feedback: |
          Yes. A correlation within experts helps, and random assignment of beginners helps more. Davidson and Kaszniak (2015) discuss this limit for contemplative research.
      - text: 'Gamma activity cannot be measured in people who meditate.'
        feedback: |
          It can be measured, and the study measured it. The problem is the comparison between non-random groups, not the instrument.
      - text: 'Experts are always unreliable witnesses to their own states.'
        feedback: |
          The caution concerns the design of the comparison, not the honesty of the practitioners.
    explanation: |
      Two groups that differ in many ways cannot show which way causation runs. Random assignment of beginners, or following the same people over years, is how practice and selection are told apart.

  - type: mcq
    id: unblinding
    title: "The drug works because the patient felt it?"
    prompt: |
      In a psilocybin trial for depression, patients on the active drug nearly all guess correctly that they received it, since the effects are strong. A student says: "Then the benefit must be only expectation, and the drug does nothing." Which comment is best?
    options:
      - text: 'The measured benefit is the drug effect plus the expectation effect. Failed blinding means the two cannot be cleanly separated, so the design may overstate the drug. It does not show that the drug effect is zero. Muthukumaraswamy and colleagues (2021) found that most trials did not assess expectancy; Butler, Jelen and Rucker (2022) discuss ways to handle it, such as active placebos, low-dose arms and measuring expectation.'
        correct: true
        feedback: |
          Yes. The data are compatible with a real drug effect, with expectation, or with both, and a better design is needed to apportion them. Griffiths (2016) and Carhart-Harris (2021) are examples of trials where the comparison and its limits matter.
      - text: 'Blinding does not matter in psychology, because all effects are expectation.'
        feedback: |
          Expectation is one component among others. Blinding exists to measure the part that is not expectation, and that is why failures of it matter.
      - text: 'Since patients can tell, the trial is worthless and its numbers should be discarded.'
        feedback: |
          The numbers still say something, with a wider margin for error. The result is reported with its limit, not thrown away.
    explanation: |
      Unblinding creates a confound, a second explanation for the same result. A confound lowers how much a number can be trusted without turning it into zero.

  - type: mcq
    id: mystical-source
    title: "A mystical experience proves its source?"
    prompt: |
      Volunteers given psilocybin in a controlled setting often report an experience of unity and sacredness, which scales such as Griffiths's call mystical-type. A student says: "The report itself proves the source: either it shows ultimate reality, or it shows that reality is only chemistry." According to the philosophers who disagree most here, what is the right reply?
    options:
      - text: 'Both camps predict the same reports. On the filter view (Huxley''s "reducing valve", after Bergson and Broad) the brain normally limits awareness and the drug loosens the limit, so unity is seen. On the materialist view the drug alters brain activity and the experience is produced by it. Because the report is expected under both, it cannot choose between them. A different kind of evidence, such as a verified piece of information that could not have come through the senses, would be needed.'
        correct: true
        feedback: |
          Yes. A report that two rival views both predict has a likelihood ratio near 1, so it moves nobody who understands both views. The choice rests on other considerations and on commitments.
      - text: 'The report proves reality is chemistry, because drugs caused it.'
        feedback: |
          The filter view also says the drug is a cause, namely a cause that loosens the filter. A cause of the experience is not yet a cause of what the experience is about.
      - text: 'The report proves ultimate reality, because it felt more real than ordinary life.'
        feedback: |
          Feeling certain (William James called it the noetic quality) is itself something a drug can produce, and it is predicted by the materialist reading as well.
    explanation: |
      The experience is established fact; the interpretation is debate or commitment. Asking "what would the other side predict?" shows quickly whether a report separates the views.

  - type: mcq
    id: nde-count
    title: "A count read as a rate"
    prompt: |
      A hospital study of cardiac arrest (AWARE II, Parnia and colleagues, 2023) followed 567 patients, of whom 53 survived; 28 survivors were interviewed, and 6 of them reported a transcendent near-death-type experience. A student says: "So 6 patients in 567, about 1%, have such experiences in cardiac arrest." Which statement is right?
    options:
      - text: 'A rate needs the right denominator. Of the 28 interviewed, 6 is 21%. Of the 53 survivors, 6 is about 11% if the others had none, which the study could not say since 25 were not interviewed. Of all 567, the dead cannot report, so 1% mixes two different things. The count 6 stays the same, while the rate depends on whom you count as at risk.'
        correct: true
        feedback: |
          Yes. A rate is a ratio, and each choice of denominator answers a different question. The honest sentence is "of those interviewed, about a fifth".
      - text: 'The rate is 6 in 28, which is exactly the rate for all cardiac arrest patients.'
        feedback: |
          28 survivors who agreed to an interview are a selected group. People with experiences may be more or less likely to be interviewed, so 21% need not hold for every arrest.
      - text: 'A count of 6 is too small to say anything, so the study should be ignored.'
        feedback: |
          A small count limits precision, but it is still data. The point is to report it with its denominator and its uncertainty.
    explanation: |
      Always ask "6 out of what?". The same count gives about 21%, 11% or 1% under three denominators, and only one of them matches the question being asked.

  - type: mcq
    id: obe-memory
    title: "A vivid memory means the body left?"
    prompt: |
      A person recalls floating above their own body and seeing the room from above, in an out-of-body experience (OBE), and is sure it was real. A student says: "The memory is so vivid that the person's awareness must have left the body." What does the evidence say?
    options:
      - text: 'Vividness measures the memory, not its cause. In 2002 Olaf Blanke and colleagues reported a patient who, when a region near the right angular gyrus was electrically stimulated during epilepsy surgery planning, felt herself sinking or falling and saw her body from above, which suggests that the brain can produce the feeling. In the AWARE studies, shelf targets visible only from above were placed in some rooms, and no patient identified one. Defenders of a filter reading reply that few arrests happened in rooms with targets, so the test was weak.'
        correct: true
        feedback: |
          Yes. Producing the feeling by stimulation shows that it can arise in the brain, not that all OBEs do. The shelf test could have shown something, but it did not, and because few cases were testable, it shifts belief little.
      - text: 'The stimulation result proves that every OBE is a seizure.'
        feedback: |
          One patient and one stimulated site show that the brain can generate the feeling. They do not show that every report has that source.
      - text: 'Because no one saw the hidden targets, the AWARE studies proved that nobody ever leaves the body.'
        feedback: |
          Few arrests happened in the equipped rooms (about 78% occurred elsewhere), so the studies could test only a small number of cases. A null result on few testable cases is weak evidence.
    explanation: |
      A vivid memory is data about experience. What caused it is decided by tests in which the claim could fail, and those tests are hard to run. The final part of this round returns to the weight of a null result.

  - type: mcq
    id: medium-hits
    title: "A high hit rate proves a gift?"
    prompt: |
      A medium gives a sitter 20 statements, and the sitter rates 14 of them as fitting a deceased relative. A student says: "That is 70% right, far above chance, so the medium must have a real source." Which comment is best?
    options:
      - text: 'Without a blinded control there is no chance level to compare with. Cold reading uses general statements and the sitter''s reactions, and the Barnum effect makes vague statements feel personal: in Bertram Forer''s 1949 classroom test, students rated one text from an astrology column at 4.26 out of 5 as a description of themselves, though all got the same text. A proper design has several sitters rate all readings, not knowing which was meant for them, so a chance rate can be calculated.'
        correct: true
        feedback: |
          Yes. A hit rate means something only against a baseline from the same procedure with the information removed. The blinded pair design supplies it.
      - text: 'Seventy percent is a fraud, since no real medium would score so high.'
        feedback: |
          Nothing in a hit rate shows fraud. The point is that without a baseline the number cannot be interpreted, either way.
      - text: 'The rating is by the sitter, who knows the relative best, so it is the best possible test.'
        feedback: |
          The sitter knowing the relative is exactly the difficulty: a sitter who wants contact fits vague statements to memories. Blinding removes that help.
    explanation: |
      A fit is only as strong as the chance of fitting without the claim. A blinded design, where the sitter rates readings without knowing which was meant for them, lets that chance be counted, as in the lesson Mediumship and Trance.

  - type: mcq
    id: cryptomnesia
    title: "A message with unknown facts is from a spirit?"
    prompt: |
      A medium in trance speaks fluently about something the medium says they never learned. A student says: "Since the medium has no memory of learning it, the information must come from outside the medium." What is the competing explanation, and what example supports it?
    options:
      - text: 'Cryptomnesia: a memory that returns without being recognised as a memory. Théodore Flournoy (1900) studied the medium known as Hélène Smith, who described life on Mars and spoke a "Martian" language. He concluded that the Martian was built on French grammar and word patterns, so the material came from her own mind. Mediumship defenders reply that this case shows one medium can produce fiction, not that all do.'
        correct: true
        feedback: |
          Yes. Not remembering where one learned something is common, and the mind can also invent. A case of unknown facts proves an outside source only if the facts are checked, found correct, and shown to be unavailable to the medium.
      - text: 'There is no competing explanation, because fraud is the only alternative.'
        feedback: |
          Cryptomnesia and a sincere secondary personality need no fraud. Flournoy considered Smith sincere.
      - text: 'Flournoy proved that all mediums are using cryptomnesia.'
        feedback: |
          He studied one case closely. Defenders of survival, such as those who favoured Leonora Piper''s sittings, point to cases where they hold the facts could not have been known, so each case is weighed separately.
    explanation: |
      "I do not remember learning it" is a report about memory, and memory is exactly what cryptomnesia says is faulty. The question is whether the information was verifiably unavailable to the medium.

  - type: numeric
    id: p-ninety-nine
    title: "p < 0.01 means 99% true?"
    prompt: |
      A student says: "The result has $p<0.01$, so there is a 99% chance the claim is true." Test it with a field where only 10 of every 1,000 tested claims are true. Studies have power 0.5 (a true claim gives a significant result half the time), and the false-positive rate is $\alpha = 0.05$ (a false claim gives a significant result 5% of the time). Among all significant results, what percentage are true claims? (Answer to one decimal place.)
    answer: 9.2
    tolerance: 0.3
    answerText: '9.2'
    wrong:
      - value: 99
        feedback: |
          That is the shortcut itself. A p-value is the chance of data this extreme if the claim is false. It is not the chance that the claim is true, which also depends on how many tested claims were true to begin with.
      - value: 50
        feedback: |
          The power 0.5 is the chance that a true claim is detected, not the fraction of significant results that are true. Count both kinds: true claims that come out significant, and false ones that do as well.
    hint: |
      Count true positives: 10 true claims times 0.5. Count false positives: 990 false claims times 0.05. Then divide true positives by all significant results.
    explanation: |
      True positives: $10\times0.5=5$. False positives: $990\times0.05=49.5$. Among $54.5$ significant results, the fraction true is $5/54.5\approx9.2\%$. A p-value answers "how surprising is this data if the claim is false?", and the share of significant results that are true also depends on the prior fraction of true claims and on the power. The lesson Parapsychology and the Replication Problem derived this.

  - type: mcq
    id: replication-multiplies
    title: "Four replications, four times the evidence?"
    prompt: |
      One experiment gives a likelihood ratio of 50 for a claim, and each of four independent clean replications would multiply the odds by 50 again. A student says: "Four replications in the same lab, with the same method, count as $50^4$ (about 6 million) in favour." What is the flaw?
    options:
      - text: 'Multiplying assumes the replications can go wrong independently. Replications that share a cause of error (the same lab, equipment, analysis habit, or a fraud) will all fail together. If the chance of such a shared flaw is $c$, the combined likelihood ratio cannot exceed about $1/c$. With $c=10^{-3}$ and four replications the ratio is about 1,000, far below 6 million.'
        correct: true
        feedback: |
          Yes. Independent replications by different labs with different methods multiply. Copies of one procedure behave as a single study with respect to a shared flaw.
      - text: 'Replications add nothing, because one result already counts.'
        feedback: |
          Independent replications do add evidence, and they are how science separates a fluke from a finding. The flaw is in treating dependent ones as independent.
      - text: 'The flaw is that $50^4$ should be $50\times4=200$, since evidence adds up.'
        feedback: |
          For independent results the odds multiply (the log-odds add). The shortcut errs in the independence assumption, not in multiplying.
    explanation: |
      Evidence from different sources is strong because the sources fail separately. When one hidden cause can sink them all, the total is capped by how likely that cause is.

  - type: numeric
    id: twenty-analyses
    title: "Twenty analyses, one hit: a fluke?"
    prompt: |
      A team runs 20 independent analyses on data where there is no real effect, each judged at $p<0.05$ (so a 5% false-positive chance each), and reports the one that is significant. A student says: "One hit in 20 is just what chance predicts, so the hit is a fluke and tells us nothing." Another says: "It is significant, so it is real." What is the chance that at least one of the 20 analyses comes out significant by luck alone? Answer as a percentage to one decimal place.
    answer: 64.2
    tolerance: 0.3
    answerText: '64.2'
    wrong:
      - value: 5
        feedback: |
          5% is the chance for one planned analysis. With 20 attempts, the chance that at least one succeeds is much larger.
      - value: 100
        feedback: |
          Twenty attempts at 5% do not guarantee a hit. Compute the chance that all 20 fail, and subtract it from 1.
    hint: |
      Chance that all 20 fail: $0.95^{20}$. Then take one minus that.
    explanation: |
      $1-0.95^{20}\approx0.642$, so 64.2%. The two students make mirror errors. Having 20 tries makes a hit likely by luck, so the reported hit is weak evidence (the effective false-positive rate $\varepsilon$ rises to 0.64). That does not make the effect false either: it means this result, with this procedure, cannot separate the claim from chance. Pre-registering one analysis restores the 5%.

  - type: mcq
    id: prior-fraud
    title: "A high prior for fraud proves fraud?"
    prompt: |
      A sceptic says: "Before looking at this medium's results, I think fraud is nine times as likely as genuine ability (prior odds 9 to 1 for fraud). So fraud is proved." The sitter's rating data turn out to be 5 times as likely if the medium is genuine as if fraudulent. What do the odds say?
    options:
      - text: 'A prior is a starting point, and evidence updates it. Odds of 9 to 1 for fraud, multiplied by $1/5$ for the data, give posterior odds of 1.8 to 1, about 64% fraud and 36% genuine. Fraud is still favoured, but nothing is proved, and a second such result would reverse it: $1.8/5=0.36$, which is odds of about 0.36 to 1 for fraud, or 26% fraud. The proper complaint about a strong prior is that it should be stated and open to being moved by evidence.'
        correct: true
        feedback: |
          Yes. The prior is a judgement, the likelihood ratio is the evidence, and the posterior combines them. A prior of exactly zero, which no evidence can move, is a different matter.
      - text: 'Priors are meaningless, so the sceptic''s 9 to 1 should be ignored.'
        feedback: |
          Priors are the starting point of every update, and ignoring one means using some other one silently. The remedy is to state it and test how much the conclusion depends on it.
      - text: 'The data favour genuine ability 5 to 1, so the medium is genuine.'
        feedback: |
          The 5 to 1 is the evidence alone. It must be multiplied with the prior odds, and 9 is larger than 5.
    explanation: |
      Posterior odds are prior odds times the likelihood ratio. A high prior for fraud is not a proof of fraud, and a favourable data point is not a proof of ability. The numbers decide how far each side moves.

  - type: numeric
    id: null-few-cases
    title: "A null result with few testable cases"
    prompt: |
      Suppose a hidden-target test could only be passed in the few cases where the patient was in the right kind of room. If the claim "awareness can leave the body" is true, the chance that the study ends with no verified target is 0.95, because almost no case was testable. If the claim is false, the chance of no verified target is 0.99. Compute the likelihood ratio $\mathrm{LR}=P(E\mid H)/P(E\mid\neg H)$ for the result $E=$ "no verified target", to two decimal places.
    answer: 0.96
    tolerance: 0.01
    answerText: '0.96'
    wrong:
      - value: 0
        feedback: |
          A ratio of 0 would mean the claim makes this result impossible. Here the claim makes it nearly as likely as the rival does.
      - value: 1.04
        feedback: |
          You have inverted the ratio. $\mathrm{LR}$ puts the chance under the claim on top: $0.95/0.99$.
    hint: |
      Divide the chance of the result if the claim is true by the chance of the result if it is false.
    explanation: |
      $0.95/0.99\approx0.96$, very close to 1. A result that is almost equally likely whether the claim is true or false hardly moves the odds, so "nothing was found" cannot refute the claim here, and it cannot support it either. A null refutes only when the test had a good chance of finding the effect if it was there. The AWARE target studies had few testable cases, so each reader should state how much that weakens the null.

  - type: mcq
    id: unexplained-x
    title: "Unexplained means explained by my idea?"
    prompt: |
      A study finds one case that current science cannot explain (for example, an experience during cardiac arrest with no known mechanism). A student says: "Science cannot explain it, so it proves my favourite explanation, spirit survival" (or, from the other side, "so it proves that the brain made it up"). What is the best response?
    options:
      - text: 'An unexplained case is a gap, and a gap supports a specific explanation only if that explanation predicted the case better than the rivals. Spirit survival, undiscovered brain mechanisms, memory errors and chance might all fit one anomalous case. Each should be asked what else it predicts that could be checked. Gaps do get closed by later science, but they are also sometimes where a new idea is found, so a gap alone justifies neither confidence nor dismissal.'
        correct: true
        feedback: |
          Yes. Evidence for a hypothesis is how much better it predicts the data than its rivals do, and "my rivals cannot explain it" is only half of that comparison.
      - text: 'Anything unexplained will be explained by the brain in the end.'
        feedback: |
          That is a commitment about the future, not a result. Science has often closed gaps, but it cannot promise that every one closes the same way.
      - text: 'Unexplained cases should simply be ignored, because science deals only with explained facts.'
        feedback: |
          Science often advances at unexplained cases. The question is what to infer from them, and the answer is, at first, little beyond "look closer".
    explanation: |
      From "no known explanation" it does not follow that "my explanation is right". The step needs the likelihood of the case under my explanation and under the others, which is the comparison the guided proof on extraordinary claims made.

  - type: mcq
    id: zero-prior
    title: "A zero prior can't be moved"
    prompt: |
      A reader says: "I give the claim exactly zero probability before I look, so no evidence could ever change my mind." Another reader says: "Then the reader's position is the most rigorous one possible." What does Bayes' rule in odds form say about this?
    options:
      - text: 'Posterior odds are prior odds times the likelihood ratio, so a prior of exactly zero gives posterior odds of zero whatever the evidence, even a thousand clean replications. The position cannot be tested, so it is a commitment rather than a conclusion from evidence. A tiny prior such as $10^{-6}$ is different: it is hard to move, but a large enough likelihood ratio can still move it.'
        correct: true
        feedback: |
          Yes. Keeping a small non-zero prior preserves the ability to learn, and this is why the lesson on extraordinary claims used $10^{-6}$ rather than 0. Whether zero is ever justified (for a logical contradiction, say) is a separate question from using it for a contested empirical claim.
      - text: 'Zero is the most rigorous prior, because it avoids all error.'
        feedback: |
          It avoids one kind of error and guarantees another: if the claim were true, no evidence could show it. A rule that cannot be corrected by data is closer to dogma than to rigour.
      - text: 'A prior of zero turns into 50% as soon as the first study appears.'
        feedback: |
          Multiplying zero by any finite likelihood ratio still gives zero. Nothing in the rule creates probability from nothing.
    explanation: |
      The rule treats everyone alike: a non-zero prior can move, a zero prior cannot. The same holds for a prior of exactly one on the other side, so a commitment that no evidence can touch is a different thing from a belief that has been weighed.

  - type: mcq
    id: sort-claims
    title: "Sort the claims by layer"
    multiple: true
    prompt: |
      This course separates claims in three layers: established fact, scholarly debate, and faith or metaphysical commitment. Which of the following belong in the first layer, **established fact**? Select all that apply.
    options:
      - text: 'Aserinsky and Kleitman reported rapid eye movement sleep in 1953, and a cycle of sleep stages repeats about every 90 minutes.'
        correct: true
        feedback: |
          Yes: a documented observation and a standard finding of sleep research.
      - text: 'In a 2014 review of 47 randomised trials, mindfulness programmes showed moderate evidence of small effects (about $d=0.3$) on anxiety, depression and pain, with no evidence that they beat other active treatments.'
        correct: true
        feedback: |
          Yes: this describes what the review found, with its size and limit. Interpreting it is a further step.
      - text: 'In the Open Science Collaboration (2015), about 36% of 97 originally significant psychology results replicated with a significant result.'
        correct: true
        feedback: |
          Yes: a reported finding of a large replication project (the interpretation of the gap is debated, but the result is data).
      - text: 'Psychedelic experiences reveal reality as it truly is.'
        feedback: |
          That is a metaphysical commitment. The reports are established, the claim that they show the truth about reality is a commitment (the filter view) that materialists reject.
      - text: 'Near-death experiences are produced by a dying brain alone (or: they show that a mind can survive death).'
        feedback: |
          Either form is beyond the data: it is a live debate (Mobbs and Watt against Greyson and Kelly) tied to one's view of mind and brain. The reported experiences are fact, the cause is open.
    explanation: |
      Facts are what was observed and measured, with their size and limits. Interpretations of the same facts are debates, and the final step from an interpretation to a worldview is a commitment. Keeping the layers apart is the habit this level was built to train.

  - type: text
    id: summary
    title: "What this round tested"
    body: |
      Each trap was a shortcut one step too far. **States**: "altered" describes a different pattern of functioning, not a worse one, and a report is judged apart from its state. **Sleep**: REM and dreaming overlap strongly but are not identical. **Lucid dreams**: an eye signal verifies awareness at a moment, not the dream's content. **Meditation**: $d\approx0.3$ is a small average shift with large overlap and no edge over active treatments, and expert-versus-novice differences may be selection. **Psychedelics**: failed blinding mixes drug and expectation without proving the drug does nothing, and a mystical report fits both the filter view and the materialist view. **Near-death and out-of-body**: a count is not a rate until the denominator is named, and a vivid memory does not fix its cause. **Mediumship**: a hit rate needs a blinded baseline (cold reading, the Barnum effect, $np$ expected fits), and cryptomnesia explains unknown-but-stored facts. **Statistics**: a p-value is not the chance the claim is true (a share of about $9.2\%$ in the example), 20 tries give $1-0.95^{20}\approx64\%$ for a lucky hit, and replications sharing a cause do not multiply. **Weighing claims**: posterior odds equal prior odds times the likelihood ratio, a null result with few testable cases has LR near 1, "unexplained" supports no particular explanation, and a prior of exactly zero is a commitment, not a conclusion.

      Where thoughtful people part ways is in the priors and in what counts as a fair test: whether a mind can be loosened from the body, whether odd claims deserve higher standards, and what a negative result is worth.

      **Next:** a quick recall of the level's main formulas and distinctions, and then its content map.
