id: ch11-parapsychology
title: "Parapsychology and the Replication Problem"
kind: concept
own: |
  The setting: **parapsychology** is the scientific study of claimed psi (telepathy, precognition and similar), and its best-known tests are guessing tasks in which chance sets a known success rate, such as 25% when the target is one of four pictures, and the question is when a rate above chance means something.
  - **p-value.** For a result, the p-value is the probability of a result at least this extreme if only chance acts:
  {{ $$p=P(\text{result}\mid\text{chance})$$ }}
  It is not the probability that chance is the cause. For $n$ guesses with chance rate $p_0$, the observed rate $\hat p$ lies
  $$z=\frac{\hat p-p_0}{\sqrt{p_0(1-p_0)/n}}$$
  standard errors above chance, so the same rate is more convincing with more trials.
  - **Power.** The **power** of a study is the probability that it gives a significant result when the effect is real. To detect a true shift $\delta$ in a rate with spread $\sigma$ at 80% power and a one-sided 5% threshold, the number of trials is about
  {{ $$n=\left(\frac{(1.645+0.84)\,\sigma}{\delta}\right)^{2}$$ }}
  so a 3-point effect on a 50% chance rate ($\sigma=0.5$) needs about 1,700 guesses. Low-power studies miss real effects and overstate the ones they find.
  - **Many chances.** If $k$ independent tests are each run at the 5% level with no real effect anywhere, the chance of at least one false positive is
  {{ $$P=1-(0.95)^{k}$$ }}
  which is 64% for $k=20$. Choosing the outcome, the sample size or the exclusions after seeing the data (**p-hacking**) acts like extra tests, and publishing only the significant ones (**publication bias**, the file drawer) hides the rest.
  - **Share of true positives.** If a fraction of tested ideas is true, with power $1-\beta$ and threshold $\alpha$, the share of significant results that are real is
  {{ $$\frac{\text{true}\cdot(1-\beta)}{\text{true}\cdot(1-\beta)+\text{false}\cdot\alpha}$$ }}
  which is about 9% when 10 of 1,000 ideas are true, power is 50% and $\alpha=0.05$.
  - **What replication taught.** According to the Open Science Collaboration (2015), 100 published psychology studies were repeated; 97 originals had been significant, about 36% of the replications were, and effects were about half as large. Bem's nine precognition experiments (2011) failed independent replications (Ritchie, Wiseman and French 2012; Galak and colleagues 2012; the multi-lab Transparent Psi Project 2023: 49.89% against Bem's 53.07%, chance 50%). A fair test fixes the analysis and sample size in advance, with critics and proponents, and shares all data.
  - **Three layers.** That small, flexible, selectively reported studies can produce false positives is established; whether any ganzfeld or precognition result survives fair tests is a live debate; whether the mind can reach beyond the senses is a commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: twenty labs, no effect"
    prompt: |
      Guessing is the point; no formulas yet. Suppose telepathy does not exist. Twenty labs each run the same guessing test. A lab calls its result "significant" only when chance alone would produce a result that strong less than 5% of the time. What is the chance that at least one of the twenty labs gets a significant result?
    options:
      - text: 'About 5%, because each lab has a 5% chance and they are all running the same test.'
        feedback: |
          That is the chance for one lab. Twenty tries at a 5% chance each add up, so the chance that at least one succeeds is much larger.
      - text: 'About 25%.'
        feedback: |
          It is a natural middle guess, but the lesson computes it exactly and it is higher.
      - text: 'About 64%, nearly two chances in three.'
        correct: true
        feedback: |
          Yes. The chance that all twenty fail is $0.95^{20}\approx0.36$, so at least one succeeds with chance $0.64$. The lesson comes back to this.
      - text: 'Close to 100%.'
        feedback: |
          Twenty is not enough for that. At the 5% level, certainty needs a great many more labs.
    explanation: |
      One lab that "finds" an effect is not rare when many labs look. What readers of journals see depends on which labs publish, and that is the thread of this lesson.

  - type: text
    id: recall
    title: "Recall: likelihood ratio and the three layers"
    body: |
      Recall: the strength of a result $E$ for a hypothesis $H_A$ against a rival $H_B$ is the **likelihood ratio**

      $$\mathrm{LR}=\frac{P(E\mid H_A)}{P(E\mid H_B)}$$

      where $P(E\mid H)$ is the probability of seeing $E$ if $H$ were true. Every claim also sits in one of three layers: **established fact**, **live debate** or **commitment**.

      This lesson looks at the parapsychology of **telepathy** (supposed transfer of thought between minds without the senses) and **precognition** (supposed knowledge of a future event that cannot be inferred). It asks less whether psi exists than what it takes for a result to count, and what psychology learned when it asked the same question of itself.

  - type: text
    id: zener
    title: "Guessing cards in the 1930s"
    image:
      src: img/zener.webp
      alt: "Five card symbols in a row: a circle, a plus sign, three wavy lines, a square and a star"
      caption: "The five Zener card symbols: with five of each in a deck of 25, a guesser with no information is right one time in five."
      credit: "Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Cartas_Zener.svg"
    body: |
      Modern laboratory parapsychology starts with simple designs whose chance level is known. According to the Wikipedia account of Zener cards, the perceptual psychologist Karl Zener (1903-1964) designed the cards in the early 1930s with the parapsychologist J. B. Rhine (1895-1980). A deck has 25 cards, five of each of five symbols (circle, plus, wavy lines, square, star). A **sender** looks at a card and a **receiver** names the symbol, or a person simply tries to guess the order.

      The method matters because it sets a **chance baseline**: the success rate of a guesser who has no information at all. Everything later depends on the claim that the observed rate is above that baseline by more than luck would allow.

  - type: numeric
    id: expected-hits
    title: "Hits by luck"
    prompt: |
      A receiver names the symbol on each of the 25 cards of a Zener deck (five symbols, five of each), with no information about the cards. Out of 25 guesses, how many correct answers are expected by chance alone?
    answer: 5
    answerText: '5'
    wrong:
      - { value: 12.5, feedback: 'That would be right for a choice between only two symbols. With five equally likely symbols the chance of a hit is one in five.' }
      - { value: 25, feedback: 'That would mean every guess is right. Chance alone gives one hit in five.' }
    hint: |
      Multiply the number of guesses by the probability that a single guess is right.
    explanation: |
      Each guess is right with probability $1/5$, so $25\times\tfrac15=5$. Seeing 6 or 7 hits would not surprise anyone; seeing 15 would.

  - type: text
    id: pvalue
    title: "What a p-value says"
    body: |
      How many hits count as more than luck? Statisticians answer with a **p-value**: the probability, if only chance acts, of getting a result at least as extreme as the one observed. In symbols

      $$p=P(\text{result}\mid\text{chance})$$

      A small $p$ means the result would be rare under chance alone. By long convention a result with $p<0.05$ is called **statistically significant**, a threshold written $\alpha=0.05$.

      A p-value is a statement about the data given chance. It is not a statement about the hypothesis given the data, which is why the likelihood ratio and Bayes' rule come back later.

  - type: mcq
    id: p-misread
    title: "Reading p = 0.03"
    prompt: |
      A guessing study of telepathy reports a result with $p=0.03$. Which reading is correct?
    options:
      - text: 'There is a 97% chance that telepathy is real.'
        feedback: |
          This turns "probability of the data given chance" into "probability of the hypothesis given the data". Those differ, and the second needs a prior: how plausible telepathy was before the study.
      - text: 'If only chance were acting, a result at least this extreme would occur about 3% of the time.'
        correct: true
        feedback: |
          Yes. That is all the number says. Whether telepathy is the better explanation depends also on rival explanations (errors, bias, selective reporting) and on the prior.
      - text: 'There is a 3% chance that the result is a mistake.'
        feedback: |
          Mistakes, flaws and cheating are not measured by $p$. It assumes the study was run correctly and asks only how rare the numbers are under chance.
    explanation: |
      The same $p$ can come from a strong effect in a small, careful study or from a weak effect found by trying many analyses, and the p-value alone cannot tell them apart.

  - type: text
    id: ganzfeld
    title: "The ganzfeld experiment"
    body: |
      The best-known later design is the **ganzfeld** (German for "whole field") experiment. According to the Wikipedia account, it grew out of Wolfgang Metzger's work on perception in uniform visual fields, and Charles Honorton adapted it in the 1970s. A receiver rests with halved ping-pong balls over the eyes under a red light, with steady noise in headphones, which is a mild sensory deprivation said to make faint impressions easier to notice. A sender in another room looks at a target picture. Afterwards the receiver sees four pictures, the target and three decoys, and picks the one that matches best. Chance is **25%**.

      According to the debate summarised there, Honorton's 1985 review of earlier studies argued for psi, Ray Hyman (a skeptic) found flaws in randomisation, judging and documentation, and in 1986 the two agreed on stricter standards. A new computer-controlled version, the autoganzfeld, reported by Bem and Honorton in 1994, found a hit rate of about 32%. Later, Milton and Wiseman (1999) pooled 30 studies from 1987 to 1997 and found a nonsignificant effect size of 0.013, while Storm, Tressoldi and Di Risio (2010) reported a 32.2% hit rate across 29 studies. According to researchers who accept the results, the difference reflects studies that kept the standard protocol; according to critics, it reflects choices of which studies to include and possible sensory leakage in the early work.

  - type: numeric
    id: z-score
    title: "How far above chance?"
    prompt: |
      In a ganzfeld-style test with four choices, chance is $p_0=0.25$. A lab runs $n=100$ trials and the hit rate is $\hat p=0.32$. The standard error of a hit rate under chance is $\sqrt{p_0(1-p_0)/n}$, and the distance of the result above chance in standard errors is $z=(\hat p-p_0)/\mathrm{SE}$. Find $z$ (one decimal).
    answer: 1.6
    tolerance: 0.06
    answerText: '1.6'
    wrong:
      - { value: 7, feedback: 'That is the difference in percentage points, 32 minus 25. The standard error rescales it by how much a hit rate fluctuates in 100 trials.' }
      - { value: 0.07, feedback: 'That is the difference as a fraction. Divide it by the standard error to get $z$.' }
    hint: |
      The standard error is $\sqrt{0.25\times0.75/100}\approx0.043$.
    explanation: |
      $\mathrm{SE}=\sqrt{0.1875/100}\approx0.0433$ and $z=0.07/0.0433\approx1.6$, short of the usual $z\approx1.65$ for a one-sided 5% threshold. With $n=400$ trials the same 32% would give $z\approx3.2$. A larger sample makes the same rate more convincing, which is also why a small study with a big rate says little.

  - type: text
    id: bem
    title: "Daryl Bem and the precognition study"
    image:
      src: img/bem.webp
      alt: "Portrait photograph of Daryl Bem, a man with glasses, at a conference in 1983"
      caption: "Daryl Bem (born 1938), a social psychologist at Cornell, photographed at a 1983 conference."
      credit: "Robert Sheaffer, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Daryl_Bem.jpg"
    body: |
      In 2011 the social psychologist Daryl Bem (born 1938, Cornell University) published "Feeling the Future" in the *Journal of Personality and Social Psychology*, one of the main journals of the field. It reported nine experiments with more than 1,000 participants, which time-reversed ordinary psychology tasks so that the stimulus came after the response. Eight of the nine experiments were reported as significant.

      In the first, a participant saw two curtains side by side on a screen and clicked the one they thought hid a picture. Only afterwards did the computer pick at random which curtain hid it. According to Bem, in 100 sessions the hit rate on erotic pictures was 53.1%, against 50% by chance, while it was 49.8% on non-erotic pictures. According to Bem, the participants had sensed the future. The paper was important because it used the standard methods of psychology, so any flaw in it was a flaw in the methods too.

  - type: mcq
    id: bem-critique
    title: "Two readings of the same data"
    prompt: |
      Wagenmakers and colleagues (2011) reanalysed Bem's data with a Bayesian test and argued that the evidence for psi was weak or absent. Their main complaints were that parts of the work looked exploratory and that Bem used one-sided p-values. Bem, Utts and Johnson replied that the reanalysis was mistaken. What is the most useful lesson for a reader?
    options:
      - text: 'Statistics settle every dispute, so one side must have made an arithmetic error.'
        feedback: |
          The two sides did not disagree on arithmetic but on method: which tests to use, what counts as planned, and what prior to give psi. That is why the answer cannot be read from one table.
      - text: 'Whether a result is convincing depends on choices made before and during analysis, which is why a fixed, agreed plan matters.'
        correct: true
        feedback: |
          Yes. If the analysis was chosen after seeing the data, the stated $p$ is too optimistic. A new study with a plan that all sides accept resolves what reanalysis cannot.
      - text: 'A surprising conclusion proves that the methods are wrong.'
        feedback: |
          A surprise is a reason to check the methods, not a proof of error. The check is a replication that follows a plan set in advance.
    explanation: |
      According to critics, studies that explore many outcomes and report those that worked behave like several tests, which the lesson turns to next.

  - type: text
    id: power
    title: "Statistical power"
    body: |
      A different question: if an effect is real, how likely is a study to detect it? That probability is the **power** of the study. It depends on the size of the real effect, the number of trials and the threshold.

      Take a true hit rate of 53% against a chance rate of 50%, and a study with 100 guesses and a one-sided 5% threshold. Under chance the hit rate varies by $\sqrt{0.5\times0.5/100}=0.05$, so the study needs a rate above $0.5+1.645\times0.05\approx0.58$ to be significant. The real rate of 0.53 reaches that only about 15% of the time. Such a study has **15% power**: it misses a real effect of this size 85 times in 100.

      Conversely, power can be bought with trials. For a shift $\delta$ in a rate with spread $\sigma$, 80% power at a one-sided 5% threshold needs about

      $$n=\left(\frac{(1.645+0.84)\,\sigma}{\delta}\right)^{2}$$

      trials, where 1.645 and 0.84 are the standard-normal cut points for the 5% threshold and 80% power.

  - type: numeric
    id: power-n
    title: "Guesses for 80% power"
    prompt: |
      A real effect is suspected to lift a 50% chance rate by $\delta=0.03$ (three percentage points). The spread of one guess is $\sigma=0.5$. Using $n=\left(\frac{(1.645+0.84)\,\sigma}{\delta}\right)^{2}$, how many guesses give 80% power (nearest ten)?
    answer: 1720
    tolerance: 40
    answerText: '1720'
    wrong:
      - { value: 100, feedback: 'With 100 guesses the power is only about 15%, as the power paragraph worked out for a 3-point effect.' }
      - { value: 41, feedback: 'That is the quantity inside the brackets. The formula squares it.' }
    hint: |
      Compute $(2.485\times0.5/0.03)$ first, then square it.
    explanation: |
      $2.485\times0.5/0.03\approx41.4$ and $41.4^2\approx1{,}715$ (about 1,720 with the cut points rounded as in the prompt). Halving the effect would need four times as many guesses, which is why small effects need big, costly studies.

  - type: mcq
    id: winners-curse
    title: "A significant result from a weak study"
    prompt: |
      A study has low power for the true effect, yet it reports a significant result with a large estimated effect. Which statement is most justified?
    options:
      - text: 'The large estimate shows the true effect must be large.'
        feedback: |
          With low power, only the lucky samples cross the threshold, so a significant result tends to overstate the true effect (the "winner's curse"). A large estimate from a small study is a weak guide to the truth.
      - text: 'Significant results from low-power studies tend to overstate the effect and are more often false alarms among those that pass.'
        correct: true
        feedback: |
          Yes. When power is low, true effects are rarely detected, while false alarms still pass at about the 5% rate, so a larger share of the significant results are errors, and the real ones are exaggerated.
      - text: 'Low power cannot produce significant results at all.'
        feedback: |
          Low power means a small chance, not zero. And chance alone produces significant results about 5% of the time at that threshold.
    explanation: |
      This is one of the reasons small studies of subtle effects are hard to trust, in psychology as in parapsychology.

  - type: text
    id: phack
    title: "Many ways to get p < 0.05"
    body: |
      Researchers choose many things: how many people to test, which outcome to measure, which participants to exclude, which comparison to report. When these choices are made after looking at the data, each acts like another test. This is called **p-hacking**, or using "researcher degrees of freedom".

      According to Simmons, Nelson and Simonsohn (2011, *Psychological Science*), their simulations showed that combining four such flexible practices could produce a false-positive result in about 61% of studies where nothing real was happening. They also reported, as a demonstration, that listening to a Beatles song made listeners become younger.

      With $k$ independent tests at the 5% level and no real effect, the chance of at least one false positive is

      $$P=1-(0.95)^{k}$$

      since $0.95^k$ is the chance that all $k$ tests fail.

  - type: build
    id: build-false-positive
    title: "The hook, resolved"
    prompt: |
      Twenty labs each test a nonexistent effect at the 5% level. Build the chance that at least one lab gets a significant result.
    prefix: 'P ='
    suffix: ''
    tiles: ['1-', '(0.95)^{20}', '(0.05)^{20}', '20\times0.05']
    answers:
      - ['1-', '(0.95)^{20}']
    wrong:
      - { answer: ['1-', '(0.05)^{20}'], feedback: 'That is one minus the chance that all twenty labs get a significant result. The chance that all twenty fail is $0.95^{20}$.' }
      - { answer: ['20\times0.05'], feedback: 'Adding the chances counts overlaps twice. It gives 100% here, which cannot be a probability of that kind. Use the chance that all fail.' }
    hint: |
      "At least one" is one minus "none".
    explanation: |
      The chance that a single lab does not get a significant result is $0.95$, so for all twenty it is $0.95^{20}\approx0.36$, and $P\approx0.64$, as the hook said. The same holds for one lab making twenty comparisons.

  - type: mcq
    id: phack-select
    title: "Which practices inflate false positives?"
    prompt: |
      A team studies a guessing task where, unknown to them, there is no effect. Which practices raise their chance of a false significant result above 5%? Select all that apply.
    multiple: true
    options:
      - text: 'Testing after every ten participants and stopping when $p<0.05$.'
        correct: true
        feedback: |
          Yes. Each peek is another chance for luck to cross the threshold.
      - text: 'Measuring six outcomes and reporting the one that reached $p<0.05$.'
        correct: true
        feedback: |
          Yes. Six outcomes act as six tests, as in the formula $1-0.95^k$.
      - text: 'Writing down the sample size and the single test before collecting data, then running exactly that.'
        feedback: |
          This is the protection against the other two. A single test fixed in advance keeps the false-positive rate at its stated 5%.
      - text: 'Dropping the trials that "look like errors" after seeing which ones hurt the result.'
        correct: true
        feedback: |
          Yes. Exclusions chosen after seeing the effect on the result favour the hypothesis.
    explanation: |
      None of these needs bad intentions. Honest researchers can drift into them, which is why plans written in advance are valued.

  - type: text
    id: filedrawer
    title: "The file drawer and the odds that a finding is true"
    body: |
      Even without p-hacking, which studies are published matters. According to Robert Rosenthal (1979, *Psychological Bulletin*), the "file drawer problem" is that journals may print the studies that reach significance while those that do not stay in a drawer, so that a field's published record can be mostly positive though every effect is null. Of 100 labs testing a nonexistent effect, about 5 get $p<0.05$, and if only those 5 are printed, readers see five positive studies and no negatives.

      According to Chris French, Ritchie, Wiseman and French's failed replication of Bem (below) was rejected by three journals, among them the one that published Bem, before PLoS ONE accepted it.

      John Ioannidis argued in 2005 (*PLoS Medicine*, "Why Most Published Research Findings Are False") that the probability that a significant result is true depends on study power, bias, how many teams are testing and the proportion of tested ideas that are true. When true effects are rare, even a good threshold lets many false positives in. With

      $$\frac{\text{true}\cdot(1-\beta)}{\text{true}\cdot(1-\beta)+\text{false}\cdot\alpha}$$

      for the share of significant results that are real, where $1-\beta$ is the power, $\alpha$ the threshold and "true" and "false" count the tested ideas of each kind.

  - type: numeric
    id: share-true
    title: "How many significant results are real?"
    prompt: |
      A field tests 1,000 ideas, of which 10 are true. Power is $1-\beta=0.5$ and the threshold is $\alpha=0.05$. The share of significant results that are real is $\dfrac{\text{true}\cdot(1-\beta)}{\text{true}\cdot(1-\beta)+\text{false}\cdot\alpha}$ with "false" the number of false ideas. Give this share in percent (nearest whole number).
    answer: 9
    tolerance: 0.6
    answerText: '9'
    wrong:
      - { value: 50, feedback: 'That is the power: the share of true ideas that reach significance. Among all significant results you must also count the false alarms from the 990 false ideas.' }
      - { value: 95, feedback: 'That is one minus the threshold. It is the share of false ideas that do not pass, not the share of passing results that are real.' }
    hint: |
      True ideas that pass: $10\times0.5$. False ideas that pass: $990\times0.05$.
    explanation: |
      Of the true ideas, $10\times0.5=5$ pass. Of the 990 false ones, $990\times0.05=49.5$ pass. The real share is $5/(5+49.5)\approx9\%$. With a lower prior, as for an extraordinary claim, the share falls further, and the next lesson works this out with Bayes' rule.

  - type: text
    id: crisis
    title: "What psychology learned"
    body: |
      In 2015 the Open Science Collaboration, led by Brian Nosek, reported in *Science* an attempt to repeat 100 published psychology studies, with 270 contributing authors and designs as close to the originals as possible. According to the report, 97 of the originals had found significant effects, only about 36% of the replications were significant, and the replication effects were about half as large. This is what is meant by the **replication crisis**. Gilbert, King, Pettigrew and Wilson (2016) answered that the statistics were mishandled and the data are consistent with higher reproducibility, and the original authors replied that neither optimistic nor pessimistic conclusions are warranted. A failed replication, then, is a piece of evidence, not a verdict.

      Several accounts, including some from parapsychologists themselves, treat Bem's paper as one of the sparks of this reckoning, because it passed the field's standards while claiming something most scientists doubted. Independent replications followed: Ritchie, Wiseman and French (2012) tried three times in three labs to repeat Bem's recall experiment, with 150 participants in all, and found no effect (combined one-tailed $p=0.83$). Galak and colleagues (2012) ran seven experiments with 3,289 participants and found none. Bem, Tressoldi, Rabeyron and Duggan in turn assembled a meta-analysis of 90 experiments from 33 laboratories in 14 countries (12,406 participants) and reported a small positive effect, a result that critics note is not independent of the original author and may reflect the file drawer.

  - type: text
    id: fair
    title: "What a fair test looks like"
    body: |
      The Transparent Psi Project (Kekecs and colleagues, *Royal Society Open Science*, 2023) tried to settle the argument over Bem's first experiment by design. A consensus panel of researchers who supported and who doubted Bem's hypothesis agreed the protocol before any data were taken. The study used several labs, data deposited directly and openly as they were produced, and external auditors. The hit rate was 49.89%, against 53.07% reported by Bem and 50% by chance, so Bem's finding was not replicated.

      A parapsychologist can reply that psi may be elusive, or may appear only under conditions no protocol has yet captured, and a skeptic can reply that a claim which no fair test can ever fail does not say anything. What the project shows is not that psi is impossible but what it takes for a result to bind both sides: agree in advance what would count as success and what as failure.

  - type: order
    id: fair-order
    title: "Order a fair test"
    prompt: |
      Put the steps of a fair test of a surprising claim in a sensible order.
    steps:
      - 'Proponents and critics agree on what result would count as success and what as failure.'
      - 'The design, the single main analysis and the sample size (chosen from power) are written down and registered.'
      - 'The data are collected exactly as planned, with the raw data deposited as they come.'
      - 'The pre-registered analysis is run and all results are reported, including the failures.'
    hint: |
      Decisions that could bend the result come before the data, not after.
    explanation: |
      Each step removes a way for a hopeful reading to enter: choosing the analysis after seeing the data, stopping when the numbers look good, or leaving a null result in the drawer.

  - type: text
    id: summary
    body: |
      **Next:** the lesson Extraordinary Claims and Bayes puts numbers on when to believe: how a low prior, the chance of fraud or error, and repeated trials combine, and why a result with $p<0.05$ can leave a surprising claim improbable.
