id: ch12-perennial
title: "The Perennial Philosophy and Its Critics"
kind: concept
own: |
  The setting: reports of mystical experience come from several traditions (call them $i = 1, \dots, 5$: Sufi, Kabbalistic, Christian, Hindu, Buddhist), and $T_i$ is the set of features reported in tradition $i$ (ineffability, a changed sense of self, a personal God, and so on). The question is whether the reports have a shared core.
  - **The perennial philosophy.** The phrase *philosophia perennis* comes from Agostino Steuco (*De perenni philosophia*, 1540) and was taken up by Leibniz (1646-1716). According to Aldous Huxley (1894-1963), whose book *The Perennial Philosophy* appeared in 1945, the world's great mystical traditions point to one divine Reality underlying things, and he drew on mystical experience for it.
  - **Stace's common core.** According to Walter Stace (1886-1967, *Mysticism and Philosophy*, 1960), there are two universal types: extrovertive (the oneness of the world seen through the senses) and introvertive (pure consciousness with no content). A common core is what all traditions share:
  {{ $$\text{core} = T_1 \cap T_2 \cap T_3 \cap T_4 \cap T_5$$ }}
  Stace holds that a report is that core plus a later interpretation added by the mystic's tradition:
  $$\text{report}_i = \text{core} + \text{interpretation}_i$$
  - **Katz's contextualism.** According to Steven Katz (1978), the mystic's concepts shape the experience itself. Let $S_i$ be the conceptual scheme (beliefs, practices, expectations) of tradition $i$. In essence his argument is:
  {{ $$S_i \neq S_j \;\Rightarrow\; \text{experience}_i \neq \text{experience}_j$$ }}
  So the traditions have different experiences, not one experience in five vocabularies.
  - **Proudfoot.** According to Wayne Proudfoot (1985), no experience is religious in itself: it counts as religious through the concepts the subject or group applies to it, so a report cannot be cleanly split into raw experience and added interpretation.
  - **Forman's reply.** According to Robert Forman (1990), a pure consciousness event (PCE) is {{ a wakeful state with no object and no content }}, so there is nothing for concepts to shape. Constructivists reply that a report of it is made afterwards, with concepts, and that this makes it no longer "pure".
  - **Hidden favourite.** Some critics (Ferrer, in essence) say perennialism ranks traditions by their closeness to non-dual views such as Advaita Vedanta, so it is not neutral.
  - **Three layers.** That the reports exist and share some formal features is established; whether there is one core experience is a live debate; whether the core is contact with a divine or ultimate reality is a metaphysical commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: one mountain, many paths?"
    prompt: |
      Guessing is the point; no theory yet. Many people say: "All religions are different paths up the same mountain, and the mystics are the ones who reached the top and saw the same view." Which first reaction is the fairest?
    options:
      - text: 'It is an attractive guess that says something checkable (mystics in different traditions describe a shared experience), so we should ask what could count for or against it.'
        correct: true
        feedback: |
          Yes. The image is a claim about experiences, and claims about experiences can be compared. This lesson meets the people who defended the claim and the people who attacked it.
      - text: 'It must be true, because kind and wise people in every religion say similar things.'
        feedback: |
          Similar words may come from different experiences, or from the same human need to speak about something hard to describe. Resemblance is a clue, not a proof.
      - text: 'It must be false, because religions disagree about God, the afterlife and what to do.'
        feedback: |
          The claim is about the mystics' experiences, not about the doctrines. Two traditions can disagree on doctrine and still, according to the claim, describe the same experience in different words. Whether they do is the question.
    explanation: |
      Keep both pulls in mind: a family resemblance among reports and real differences among traditions. A careful reader asks which one is the better guide, and what evidence could decide.

  - type: text
    id: steuco
    title: "Where the phrase comes from"
    image:
      src: img/leibniz.webp
      alt: "Painted portrait of Gottfried Wilhelm Leibniz in a long wig and dark coat"
      caption: "Gottfried Wilhelm Leibniz (1646-1716), who took up the Latin phrase philosophia perennis, 'the perennial philosophy', in the early 1700s."
      credit: "Christoph Bernhard Francke, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Christoph_Bernhard_Francke_-_Bildnis_des_Philosophen_Leibniz_(ca._1695)_(cropped).jpg"
    body: |
      The **perennial philosophy** is the idea that one core of wisdom runs through the world's religions and philosophies. *Perennial* means lasting, always returning, as a perennial plant does.

      The Latin phrase *philosophia perennis* goes back to Agostino Steuco, whose book *De perenni philosophia* (1540) argued, in essence, for a basic agreement between Christian teaching and the wisdom of other peoples. According to scholars of the term, Steuco saw it as a truth God revealed at the beginning, while Gottfried Wilhelm Leibniz (1646-1716) took up the phrase in the early 1700s with a different sense: truths that are present in seed form and grow over history.

      Notice that this older idea was about *doctrines* (what is taught), not about experiences. The twentieth century moved it toward experience.

  - type: text
    id: huxley
    title: "Huxley, 1945"
    image:
      src: img/aldous-huxley.webp
      alt: "Black-and-white photograph of the young Aldous Huxley, seated and looking to the side"
      caption: "Aldous Huxley (1894-1963), photographed in 1925, long before he wrote the book that made the phrase famous."
      credit: "Henri Manuel, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Aldous_Huxley_-_photo_Henri_Manuel.jpg"
    body: |
      The phrase became famous through **Aldous Huxley** (1894-1963), the English writer of *Brave New World*. His book *The Perennial Philosophy* (1945) is mainly an anthology: short passages from the religious writings of many centuries and traditions, arranged by theme, with his comments.

      According to Huxley, the great traditions share a metaphysic (a view of what is ultimately real) that recognises a divine Reality underlying the world of things, lives and minds. According to critics, among them reviewers of his own day, his treatment is shaped by his own commitment to the view. Huxley also stressed mystical experience, more than earlier users of the phrase, as the way the Reality is known.

      So the claim has two parts: that the traditions' *doctrines* have a common core, and that the mystics' *experiences* do. The rest of this lesson is about the second part.

  - type: mcq
    id: origin-q
    title: "What changed with Huxley?"
    prompt: |
      According to scholars of the term, Steuco and Leibniz used "perennial philosophy" for a truth found in teachings (doctrines) of many peoples. Which description of Huxley's change of emphasis is most accurate?
    options:
      - text: 'He stressed mystical experience as the way the common Reality is known, not only the agreement of doctrines.'
        correct: true
        feedback: |
          Yes. The claim became, in essence: mystics in different traditions have met the same Reality, and their different doctrines are different vocabularies for it.
      - text: 'He dropped the idea of a common core and defended the uniqueness of each religion.'
        feedback: |
          The opposite. His anthology was assembled to show common ground across traditions.
      - text: 'He proved the common core by laboratory experiments on mystics.'
        feedback: |
          The book is an anthology of religious writings with commentary, not a laboratory study. Whether experience can be tested in such a way is a later part of the debate.
    explanation: |
      Moving from doctrines to experiences made the claim more testable (compare what people report) and also more contested (reports are words, and words come from a tradition).

  - type: text
    id: stace
    title: "Stace: two types and a core"
    body: |
      The most careful philosophical defence is by Walter T. Stace (1886-1967), who spent about two decades in the civil service in Ceylon and then taught philosophy at Princeton. In *Mysticism and Philosophy* (1960) he asked what a common core would have to look like, and answered with two types.

      According to Stace, **extrovertive** mysticism finds the oneness of all things *through* the senses, looking outward: the world seems one and alive. **Introvertive** mysticism looks inward and has no sensory content at all: a "pure consciousness" with nothing in it but awareness itself. He held both types to be universal, and the introvertive the deeper.

      His key move is a split between **experience** and **interpretation**. According to Stace, a theistic mystic, such as a Christian or a Sufi, has the same empty experience as anyone, and then *adds* a theistic reading afterwards: "this was God". If so, the differences among traditions are in the interpretations, and the core is the experience.

      As a toy picture, with the real claim being richer:
      $$\text{report}_i = \text{core} + \text{interpretation}_i$$

  - type: mcq
    id: stace-q
    title: "Stace on Teresa's marriage"
    prompt: |
      Teresa of Avila (1515-1582) described the seventh mansion of her *Interior Castle* as a spiritual marriage of the soul with a God who stays distinct. According to Stace's split between experience and interpretation, how should a defender of the common core read her report?
    options:
      - text: 'As an introvertive core experience, with the language of a divine partner added afterwards by her Christian reading of it.'
        correct: true
        feedback: |
          Yes. That is the logic of Stace's view: the personal-God picture is interpretation laid on top of an experience that is the same across traditions.
      - text: 'As a different experience from the Buddhist one, because the words differ.'
        feedback: |
          This is the opposite view, which is Katz's. For Stace, differences in words are the main sign of differences in interpretation, not of experience.
      - text: 'As evidence that the introvertive type does not exist.'
        feedback: |
          Nothing in her report removes it. A defender of Stace would say her report fits the pattern: a core plus an interpretation.
    explanation: |
      Notice what makes this move possible, and also what makes it risky: it needs a clean line between "the experience" and "the reading of it". The critics attack exactly that line.

  - type: mcq
    id: types-q
    title: "Which type is this?"
    prompt: |
      According to Stace's two types, which report fits the **introvertive** type?
    options:
      - text: 'A person in meditation says that, for a time, there was awareness with no object, no thought and no sense of a separate self.'
        correct: true
        feedback: |
          Yes. Introvertive: inward, with no sensory content, "pure consciousness".
      - text: 'A person walking in a forest says that every tree, stone and bird suddenly seemed to be one living whole.'
        feedback: |
          This is the extrovertive type: oneness found through the senses, looking outward at the world.
      - text: 'A person in prayer says that God spoke to her and told her what to do.'
        feedback: |
          Neither type: this is a report of an encounter with a distinct other, which is closer to what Otto called the numinous. Stace's types are about unity.
    explanation: |
      The two types differ in where the unity is found (in the sensed world, or in awareness with nothing in it). The next card shows what Stace's critics did with such sorting.

  - type: text
    id: katz
    title: "Katz: no unmediated experience"
    body: |
      In 1978 the American scholar Steven T. Katz published the essay "Language, Epistemology, and Mysticism" as the lead chapter of the volume *Mysticism and Philosophical Analysis*, which he edited. It is the standard statement of **contextualism** (also called constructivism), and Stace's view is one of its main targets.

      According to Katz, no mystical experience is *unmediated*: the mystic's concepts, beliefs and training in a tradition shape the experience itself, not only the words afterwards. A Buddhist trained to expect no self and a Christian trained to expect a loving God do not have the same experience that they then describe differently. As scholars summarise the argument, it has three steps:

      - **A.** The mystic's conceptual scheme shapes the content of the experience.
      - **B.** The conceptual schemes of the traditions differ pervasively.
      - **C.** So there is no common experience across traditions.

      In the notation of the previous lesson, Mystics Across Traditions, let $T_i$ be the set of features reported in tradition $i$, for the five traditions $i = 1, \dots, 5$ (Sufi, Kabbalistic, Christian, Hindu, Buddhist). Stace's common core is the intersection

      $$\text{core} = T_1 \cap T_2 \cap T_3 \cap T_4 \cap T_5$$

      and Katz's claim is that this core is empty or trivial as *experience*. What looks like overlap is overlap in the words (for instance "ineffable").

  - type: order
    id: katz-order
    title: "Katz's argument in order"
    prompt: |
      Put the steps of Katz's argument against a common core of mystical experience in order.
    steps:
      - 'The mystic''s conceptual scheme (beliefs, practices, expectations) shapes the content of the experience itself.'
      - 'The conceptual schemes of the traditions differ pervasively.'
      - 'So the experiences of the traditions differ, and there is no common experience across them.'
      - 'The overlap in reports (such as "ineffable") is then an overlap in words, not evidence of one experience.'
    hint: |
      Premise about the mind first, premise about the traditions second, then the conclusion, then what follows for the evidence.
    explanation: |
      The argument is valid if both premises hold, so the debate moves to the premises. Which premise would a defender of the core reject? Mostly the first: perhaps only some layers of experience are shaped by concepts.

  - type: text
    id: proudfoot
    title: "Proudfoot: who decides what counts?"
    body: |
      Wayne Proudfoot's book *Religious Experience* (1985) adds a different objection. According to Proudfoot, no experience is religious or mystical in itself. It becomes "religious" when the person, or the group, *applies* a concept to it ("this was the presence of God", "this was the self dissolving"). So what a person reports is already shaped by the concepts used to classify it.

      That bears on Stace's split. If the classification is part of what makes the experience the experience it is, then "the raw experience, plus a reading afterwards" is not a clean description. There is no neutral report to compare across traditions.

      Proudfoot also made a point about ineffability. According to him, saying "it cannot be put into words" can work as a protective move: it keeps the experience from being questioned. Others reply that ineffability occurs in ordinary life too, in music or the taste of coffee, so it need not be protective.

  - type: mcq
    id: proudfoot-q
    title: "What does the objection target?"
    prompt: |
      A defender of a common core says: "The experience is the same; the words are different." According to Proudfoot's line, which is the best statement of the problem for that defender?
    options:
      - text: 'The "raw experience" cannot be separated from how it is classified, so comparing reports does not reach a neutral core.'
        correct: true
        feedback: |
          Yes. If concepts take part in making the experience what it is, a report of "the same experience in different words" assumes the very separation that is in dispute.
      - text: 'Mystics are lying, so no report can be trusted.'
        feedback: |
          Proudfoot does not accuse mystics of lying. The point is about how experiences come to count as religious, not about honesty.
      - text: 'Only scientists can have mystical experiences.'
        feedback: |
          Nothing in the objection says this. It concerns the role of concepts, not who is qualified to have the experience.
    explanation: |
      Notice the structure: Katz argues from difference among traditions, Proudfoot from the way classification works. Both aim at the same target, the clean line between experience and interpretation.

  - type: text
    id: favourite
    title: "The hidden favourite"
    body: |
      A third criticism is about fairness. The philosopher and transpersonal theorist Jorge Ferrer, in *Revisioning Transpersonal Theory* (2001), argues, as his work is summarised, that perennialism claims to include all traditions but in practice ranks them, with those closest to the non-dual view of Advaita Vedanta (the Hindu school for which the self and ultimate reality are one) at the top and theistic traditions lower. If so, the "common core" is not found neutrally: it is a favourite view dressed as a neutral one.

      Stace's own scheme gives something to this worry. According to him, theistic reports are an empty experience plus an interpretation, so the interpretation is what traditions add, and the introvertive pure consciousness is what is deepest. A theist might say the reverse: the personal meeting is the experience, and an "empty" reading is the interpretation.

      A defender of the core can answer that a ranking is not a bias if it follows from the evidence of the reports. The hard part is that the ranking must be shown from the reports, and not assumed in how they were sorted.

  - type: mcq
    id: favourite-q
    title: "What would the charge need?"
    prompt: |
      The charge says a perennialist's core is a favourite view in neutral dress. Which finding would best support the charge?
    options:
      - text: 'When two reports conflict (one personal, one impersonal), the perennialist always counts the impersonal one as the experience and the personal one as interpretation.'
        correct: true
        feedback: |
          Yes. A systematic one-way rule for deciding which part is "experience" would show the core was chosen in advance, not found.
      - text: 'Perennialists quote mystics from many different traditions.'
        feedback: |
          Wide quotation does not show a favourite. A fair collector could also quote widely. What matters is how conflicts between the quotations are settled.
      - text: 'Some mystics are not religious.'
        feedback: |
          That is a separate question about who counts as a mystic. It says nothing about whether a favourite is being slipped in.
    explanation: |
      A fair test has to treat the personal and the impersonal readings symmetrically, and ask what in the evidence breaks the tie.

  - type: text
    id: forman
    title: "The perennialist reply: pure consciousness"
    body: |
      Robert Forman, in essays collected in *The Problem of Pure Consciousness* (1990), replied to Katz with the **pure consciousness event** (PCE): a state that is wakeful but has no object, no thought and no content, reported in several traditions. Here is the best form of his reply.

      Katz's claim, as Forman reads it, is that concepts shape the *content* of an experience. But a PCE, by report, has no content. There is nothing in it for a concept to shape, so at least this one event is not constructed by the tradition. If the same contentless event turns up in Buddhist, Hindu and Christian practice, there is a common core, even if the interpretations around it differ. According to Forman, this holds whether we look at the content, the form, or the process by which the experience takes shape.

      Note the strength of the reply: it does not deny that most experiences are shaped by concepts. It claims only that one, a very thin one, is not.

  - type: text
    id: counter
    title: "The constructivist counter-reply"
    body: |
      The best constructivist answer has three parts.

      First, according to Proudfoot, an event becomes an *experience* only when it is conceptualised, at which point it is no longer "pure". The PCE is then an event the person later reports, using concepts, and the report cannot be taken as a window on a concept-free moment.

      Second, critics of Forman point out that he relies on states such as the Buddhist *nirodha-samapatti* (a state of cessation reached in meditation) which may not fit his model, so the claim of one shared event across traditions may be broader than the evidence.

      Third, the neuroscience does not settle it: different practices show different brain patterns, and even a shared brain basis would not show identical felt experience.

      Notice what each side has now conceded. The perennialist concedes that most experience is shaped by concepts. The constructivist can allow that some very thin features (a changed sense of self, no ordinary thought) may be common, but denies that they amount to "one mountain".

  - type: mcq
    id: evidence-q
    title: "What would count?"
    multiple: true
    prompt: |
      Which findings would count **against** strong constructivism (the claim that each tradition's concepts shape the experience, so there is no common experience)? Select all that apply.
    options:
      - text: 'Practitioners from several traditions, asked for a plain description before any doctrine is added, give closely matching accounts.'
        correct: true
        feedback: |
          Yes. A shared thin description that appears before the tradition's vocabulary is added is what a common core would predict and strong constructivism would not.
      - text: 'Mystics in different traditions use their own traditions'' words.'
        feedback: |
          Both sides expect this. A perennialist says the words are interpretation; a constructivist says the words come from the experience. It does not separate them.
      - text: 'Practitioners with no training in any tradition, who have a contentless state, describe it as the practitioners of several traditions do.'
        correct: true
        feedback: |
          Yes. If the state shows up without the tradition's concepts being in place, concepts cannot be the whole explanation of it.
      - text: 'Reports of the same state from one tradition agree with one another.'
        feedback: |
          Agreement inside a tradition is just what training and shared concepts would produce, so it favours constructivism at least as much as it favours a core.
    explanation: |
      The test is a prediction that the two views make differently. Which findings would go against the perennialist? Reports that stay different even in the thin, pre-doctrinal descriptions, or contentless states that turn out to carry the tradition's mark.

  - type: mcq
    id: trap-q
    title: "Two tempting leaps"
    multiple: true
    prompt: |
      Select every statement that is a **mistake**.
    options:
      - text: 'If mystics share a core experience, all religions must be equally true.'
        correct: true
        feedback: |
          Even a perfect core experience would not decide whether it is contact with reality, and doctrines outside the core could still conflict. Common experience is one thing, truth of the doctrines another.
      - text: 'If Katz is right that experience is shaped by concepts, then mystical experiences are illusions.'
        correct: true
        feedback: |
          Katz's thesis is about what shapes the experience, not about whether it is veridical. Ordinary perception is also shaped by concepts, and we do not conclude that it is an illusion.
      - text: 'If the debate is unresolved, neither side has given any reason.'
        correct: true
        feedback: |
          Each side gives real reasons, and the open question is how strong they are. Not yet settled is different from no argument at all.
      - text: 'The perennialist and the constructivist can agree that reports from the traditions differ in words.'
        feedback: |
          This is correct, and both agree on it. They differ on what it shows: different words for one experience, or different experiences.
    explanation: |
      Three leaps to avoid: from "common core" to "all religions true", from "shaped by concepts" to "illusion", and from "undecided" to "empty". Each skips a layer between the data, the interpretation and the commitment.

  - type: numeric
    id: core-count
    title: "A toy core"
    prompt: |
      A toy table of reported features (not real data). Features: ineffability, changed sense of self, unity, personal God, bliss.

      - Sufi: all five.
      - Kabbalistic: ineffability, changed self, personal God, bliss.
      - Christian: all five.
      - Hindu: ineffability, changed self, unity, bliss.
      - Buddhist: ineffability, changed self, bliss.

      With $T_i$ the set of features of tradition $i$ in this order, how many features are in $T_1 \cap T_2 \cap T_3 \cap T_4 \cap T_5$?
    answer: 3
    wrong:
      - { value: 5, feedback: 'Five is the size of the largest set. A feature must be in every set to be in the intersection, and the Buddhist set lacks two.' }
      - { value: 2, feedback: 'Recount: ineffability, changed self and bliss are all in all five sets.' }
    hint: |
      Go through the five features one at a time and ask whether every tradition lists it.
    explanation: |
      Ineffability, changed sense of self and bliss are in every set. Unity is missing from the Kabbalistic and Buddhist sets, and the personal God from the Hindu and Buddhist sets, so the core has 3 features. Notice how fragile it is: if the Buddhist set also lacked bliss, the core would have 2. How the features are described (coarsely or finely) decides the size, which is exactly where Stace and Katz part ways.

  - type: mcq
    id: layers-q
    title: "Which layer?"
    prompt: |
      The course sorts every claim into three layers: (1) established fact, (2) scholarly debate, (3) faith or metaphysical commitment. Which statement is a **layer 3** claim?
    options:
      - text: 'The shared core of the mystics'' reports is contact with the one divine Reality behind all things.'
        correct: true
        feedback: |
          Yes. Even if a common core were shown, that it reaches the Reality is a metaphysical commitment, held by Huxley and denied, for instance, by those who read the core as a brain state.
      - text: 'Stace and Katz disagree about whether mystical experience across traditions has a common core.'
        feedback: |
          This is established, a fact about the debate (layer 1). Whether the core exists is layer 2.
      - text: 'Whether a pure consciousness event is the same across traditions is disputed among scholars.'
        feedback: |
          This is layer 2: a live scholarly debate, with evidence on both sides.
    explanation: |
      The same sorting applies to your own view: which of the three layers is each of your beliefs about the mountain?

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** a guided proof, Experience as Evidence. If mystical experiences, with or without a common core, are ever evidence for something, what is the principle that says so, how is it like ordinary perception, and what do the diversity of the traditions and the possibility of defeaters do to it?
