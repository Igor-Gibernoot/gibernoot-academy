id: ch12-neuro-religion
title: "The Brain on Religious Experience"
kind: concept
own: |
  The setting: a person has an experience $E$ that seems to be of some presence $X$ (God, an ultimate reality), and a brain scientist finds a brain state that accompanies $E$. The question is what that finding does to the evidence $E$ gives for $X$. Write $P(E \mid X)$ for how likely the experience is if $X$ is there and $P(E \mid \text{not } X)$ for how likely it is if $X$ is not there.
  - **A correlate is not a verdict.** A brain state that accompanies an experience is a {{ **correlate** }}. It fits three readings: the brain *produces* the experience, the brain is a *channel* for something real, or the two merely go together. Every experience, including seeing a tree, has a brain state.
  - **When a brain explanation defeats.** The evidential force of $E$ is the likelihood ratio:
  {{ $$\text{LR}=\frac{P(E\mid X)}{P(E\mid \text{not }X)}$$ }}
  A brain explanation defeats the experience (it is a defeater, in Swinburne's fourth kind: the presence did not cause the experience) only if it makes $E$ equally likely without $X$, that is, {{ $\text{LR}=1$ }}. Then the odds do not move:
  {{ $$\text{posterior odds}=\text{prior odds}\times\text{LR}$$ }}
  A brain state that accompanies $E$ but would be there equally if $X$ were present (as a channel) leaves $\text{LR}>1$.
  - **Temporal lobe claims.** According to Persinger (1983), religious experiences are artifacts of temporal lobe function (brief microseizures). According to Granqvist and colleagues (2005), a double-blind test with 89 people found no effect of the weak magnetic field of Persinger's helmet: reports of a sensed presence were predicted by suggestibility, not by the field. Persinger replied that the exposure was not adequate. The matter is disputed.
  - **Scan studies.** According to Newberg and colleagues (2001, 2003), scans of meditating Tibetan Buddhists and praying Franciscan nuns (eight meditators and three nuns) showed changed blood flow in frontal and parietal regions, small preliminary studies. They show a correlate, not which reading is right.
  - **Two readings.** According to the reductive reading, the brain state produces the experience, and the presence is added by interpretation. According to the receptive reading (Huxley, 1954, after Bergson and Broad), the brain is a {{ **reducing valve** }} that filters a larger reality, so a changed brain state may let more through. Both predict the same scans, so scans alone cannot decide.
  - **Three layers.** That brain states accompany religious experiences is established; whether a particular helmet or region produces them, and how strong a defeater a brain explanation is, is a live debate; whether the presence is real is a commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: a scan lights up during prayer"
    prompt: |
      Guessing is the point; no theory yet. A brain scan shows that certain regions become more active while a person prays and says they feel God's presence. A headline says: "Brain scan shows religious experience is only brain activity." Which first reaction is the fairest?
    options:
      - text: 'The scan shows that the experience has a brain state, which is true of every experience; whether that makes it "only" the brain is a further question.'
        correct: true
        feedback: |
          Yes. Seeing a tree also lights up the brain. A brain state shows that the experience is *accompanied* by something physical; it does not by itself say what the experience is of, or whether anything outside the head matches it.
      - text: 'The headline is right: if the brain does it, nothing else is involved.'
        feedback: |
          This quietly assumes that a brain state and an outside cause exclude each other. Perception of a tree has a brain state and an outside cause. Whether prayer is like that or not is exactly the question.
      - text: 'The scan proves God is real, because the experience is real enough to measure.'
        feedback: |
          The experience is real (people have it, and the brain changes). That does not show what it is of. This inference is the mirror image of the headline: both jump from a brain state to a verdict.
    explanation: |
      Keep two things apart all lesson: *that* an experience has a brain correlate, and *what that shows* about the presence the experience seems to be of.

  - type: text
    id: why
    title: "Why this topic exists"
    body: |
      In the lesson Experience as Evidence, Richard Swinburne's principle of credulity said, in essence: if it seems to a person that something is present, then probably it is, unless a **defeater** applies, meaning a special reason to doubt. He lists four kinds. The fourth is that even if the object was there, it probably did not *cause* the experience.

      Critics have pointed to the brain as exactly such a reason: if neuroscience can say which brain state goes with an experience of God, perhaps that state, and not a presence, explains it. Neuroscience of religion is the study of these brain states. Three relations are possible, and the lesson is mostly about telling them apart:

      - the brain state *causes* the experience, with nothing real behind it;
      - the brain state is a *channel* through which something real is perceived;
      - the two simply go together, and the data do not say which.

  - type: mcq
    id: radio
    title: "A radio and a brain"
    prompt: |
      When a radio plays a symphony, its internal circuits change in step with the music. An observer who knows only that the circuits change might say: "the music is produced inside the box." Which statement about this is fairest?
    options:
      - text: 'The changing circuits fit two stories (the box makes the music, or the box receives it), so the circuit data alone cannot decide between them.'
        correct: true
        feedback: |
          Yes. Opening the radio and finding circuits that track the music is what *both* stories predict. Other evidence has to decide, such as what happens when you move the radio or change the station.
      - text: 'The circuits prove the radio produces the music, since the music changes when the circuits change.'
        feedback: |
          A receiver also changes in step with what it receives. Tracking is a correlate. Breaking the circuit silences the music in both stories, so even that does not decide.
      - text: 'The circuits show nothing, because a radio is not a brain.'
        feedback: |
          The analogy is imperfect, but the logical point is real: a correlate between internal states and an experience leaves several readings open. Whether the brain resembles a receiver is itself the disputed part.
    explanation: |
      The picture is only an analogy, and each side attacks it differently. The point is the logic: finding the mechanism of an experience is not the same as finding its source.

  - type: text
    id: tle
    title: "Temporal lobe epilepsy and religion"
    body: |
      Epilepsy is a condition in which sudden bursts of electrical activity occur in the brain. In *temporal lobe epilepsy*, the bursts start in the temporal lobes, the regions of the brain near the ears, involved in memory and emotion. Some patients report, around a seizure, intense feelings of presence, meaning or the divine.

      According to the neurologist Norman Geschwind and colleagues (the syndrome is often dated to 1975), some people with this epilepsy show, between seizures, a cluster of traits, among them a deep interest in religion and philosophy and a tendency to write a great deal. It is called **Geschwind syndrome**. According to reviewers, how well the link between this epilepsy and religiosity holds up is disputed, and similar traits have also been reported after other brain conditions.

      So the established fact is limited: *some* patients link seizures with religious feeling, and a *syndrome* with religious interest has been proposed and debated. It is not established that religious experience in general is epilepsy.

  - type: mcq
    id: tle-q
    title: "What would the epilepsy link show?"
    prompt: |
      Suppose it were firmly established that some temporal lobe seizures produce experiences of a divine presence. A defender of the brain-explains-it view says this shows that all religious experience is a seizure. What is the best objection?
    options:
      - text: 'Most people with religious experiences have no epilepsy, so a seizure explains at most some cases; and a cause for an experience in patients does not show that the same experience in others has no outside source.'
        correct: true
        feedback: |
          Yes. There are two gaps: from *some* cases to *all*, and from a brain cause to the absence of an object. A defender would still say the seizure cases show how easily the brain can make such experiences, which counts a little against trusting them.
      - text: 'Epilepsy is not a real medical condition.'
        feedback: |
          It is a well-established condition. The dispute is about the inference from it to religious experience in general, not about whether epilepsy exists.
      - text: 'Seizures are too rare to matter.'
        feedback: |
          Rarity is not the main problem. Even common causes would leave open whether *this* experience, in a healthy person, has the same cause.
    explanation: |
      The pattern repeats in the rest of the lesson: a finding about one group or one case, and a step to a general verdict that the finding does not carry by itself.

  - type: text
    id: helmet
    title: "Persinger's helmet and its test"
    body: |
      The psychologist Michael Persinger (Laurentian University, Canada) proposed in 1983 a general hypothesis: religious and mystical experiences are artifacts of temporal lobe function, caused by brief microseizures there, and are most likely in personal crises. Later he used a helmet that applies very weak, complex magnetic fields to the temporal lobes, and reported that many participants sensed a presence in the room.

      A Swedish team led by Pehr Granqvist (Uppsala University) tested this in a double-blind study published in 2005. **Double-blind** means that neither the participants nor the experimenters knew who received the real field. Of 89 volunteers, 43 got the field and 46 wore the helmet with no field. According to the authors, the field made no difference: the reports of a presence were predicted by how suggestible people were and by their personality, not by the field.

      Persinger replied that the team had not replicated his work, arguing, in essence, that the exposure was too short to produce an effect. The Swedish group answered that he had agreed to their method beforehand. According to a summary of later studies, results went both ways and the matter is disputed.

  - type: mcq
    id: helmet-q
    title: "What does the helmet dispute show?"
    prompt: |
      In the double-blind test of Persinger's helmet, 43 volunteers received a weak magnetic field and 46 wore the helmet with no field. The two groups reported presence experiences about equally often, and suggestibility predicted the reports. Which conclusion is best supported?
    options:
      - text: 'In this test the field was not needed for the reports; expectation and suggestibility can produce a sensed presence, and the original claim is contested.'
        correct: true
        feedback: |
          Yes, while noting the open dispute about exposure. The result also shows something general: a sensed presence can arise from the setting and the person's expectations, which is a point about suggestion, not yet about magnetism.
      - text: 'It proves that no religious experience has a physical cause.'
        feedback: |
          Nothing of the sort. The test asked about one device. Showing that one cause fails does not show that none exists.
      - text: 'It proves that all religious experiences are caused by suggestion.'
        feedback: |
          The test shows that suggestion can produce a sensed presence in a lab. It says nothing about a mountain-top experience that no one expected.
    explanation: |
      Even if the helmet had worked, a field that produces a *sense of presence* would show that the brain can generate the feeling. It would not show that a real presence cannot also be sensed through the brain.

  - type: text
    id: scans
    title: "Scans of prayer and meditation"
    body: |
      A different approach looks at ordinary practitioners. The neuroscientist Andrew Newberg (University of Pennsylvania) and colleagues used **SPECT**, a scan that shows where blood flow is higher in the brain, which is a sign of activity. In a 2001 study (*Psychiatry Research: Neuroimaging*), eight experienced Tibetan Buddhist meditators were scanned at the peak of meditation. Blood flow rose in frontal regions, and a change in the left superior parietal lobe, a region involved in orienting oneself in space, went in the opposite direction from a frontal change. The authors suggested this might relate to an altered sense of space and called the study preliminary.

      In a 2003 study (*Perceptual and Motor Skills*), three Franciscan nuns repeated a phrase silently in a meditative prayer. Blood flow rose in prefrontal and parietal regions, with again an inverse relation between a prefrontal and a parietal change; the paper itself speaks of preliminary findings and methodological issues. The popular book *Why God Won't Go Away* (Newberg, d'Aquili and Rause, 2001) argued that the brain is built to have such experiences.

      These are very small studies on practice, not on the rare experience of a presence itself.

  - type: mcq
    id: scans-q
    title: "What a scan can say"
    prompt: |
      A small scan study finds that in a group of meditators, blood flow changes in the parietal lobe at the peak of their meditation. Which conclusion goes furthest beyond the data?
    options:
      - text: 'The parietal region is a "God spot", so the experience is produced by it and nothing real lies behind it.'
        correct: true
        feedback: |
          Yes, this goes furthest. A change in one region is a correlate; many regions change at once; a small sample is preliminary; and a "spot" says where something happens, not why it happens or what it is of.
      - text: 'In these meditators, brain activity changed in parietal and frontal regions during the practice.'
        feedback: |
          This is what was measured, and it is a fair description of the data (a layer 1 claim), if cautious about the small sample.
      - text: 'More research with larger groups would be needed before drawing a firm picture.'
        feedback: |
          This is cautious and fair: the studies call themselves preliminary.
    explanation: |
      Notice how the wrong conclusion has two steps the scan did not take: from a correlate to a cause, and from a cause to the absence of anything outside the head.

  - type: text
    id: readings
    title: "Two readings of one finding"
    body: |
      Suppose the brain state is real and reliable. There are two classic ways to read it.

      **The reductive reading.** According to those who hold it, the brain state produces the experience, and the sense of presence is part of what the state feels like. The presence is then added by interpretation, as a dream's events are added by a sleeping brain. The best reply to the objection "every experience has a brain state" is that, for these experiences, the state is *sufficient*: you can have the experience, as with the helmet or a seizure, without the presence.

      **The receptive reading.** Aldous Huxley (1954), drawing on Henri Bergson and C. D. Broad, proposed that the brain works as a **reducing valve**: it limits a larger "Mind at Large" down to what is useful for survival, and a changed brain state, such as in meditation or with a drug, may let more through. On this view a brain correlate is just what a channel looks like from outside. The best reply to the objection "then the brain is just a filter nobody can test" is to point to predictions, and critics reply that the picture so far makes none that differ from the reductive one.

      The scans fit both.

  - type: mcq
    id: readings-q
    title: "Which finding could separate them?"
    prompt: |
      The reductive reading says a brain state *produces* a religious experience. The receptive reading says the brain state is *a channel* for something real. A scan shows a brain state that reliably accompanies the experience. Which statement is correct?
    options:
      - text: 'Both readings predict this scan, so the scan cannot choose; a finding would have to be one the two readings predict differently.'
        correct: true
        feedback: |
          Yes. Evidence only favours a reading if it is more probable under one reading than under the other. A shared prediction cancels, which is exactly the likelihood-ratio idea from the lesson Experience as Evidence.
      - text: 'The scan supports the reductive reading, since a physical state was found.'
        feedback: |
          The receptive reading never denied a physical state: it says the state is how the channel works. So finding one does not favour the reductive reading.
      - text: 'The scan supports the receptive reading, since the experience felt real to the person.'
        feedback: |
          Feeling real is shared by dreams and by genuine perceptions. It does not favour a channel over a producer.
    explanation: |
      This is why both sides appeal to other considerations: the prior plausibility of each picture, whether the experience gave information the person could not have had, and what the experience does to a life (the next lesson).

  - type: order
    id: inference
    title: "The inference and its missing premise"
    prompt: |
      Put in order the argument "a brain state accompanies the experience, so the experience gives no evidence of the presence", with the premise that is often left out.
    steps:
      - 'The experience $E$ seems to be of a presence $X$, and a brain state $B$ accompanies $E$.'
      - 'Missing premise: $B$ would produce $E$ in the same way if $X$ were not there.'
      - 'So $E$ is as likely without $X$ as with it, that is $P(E\mid X)=P(E\mid \text{not }X)$ and $\text{LR}=1$.'
      - 'So $E$ does not raise the odds of $X$: the brain explanation is a defeater.'
    hint: |
      The first step is only the observation. The conclusion needs a bridge about what would happen in the absence of the presence.
    explanation: |
      Without the second step, the argument is invalid: $B$ accompanies $E$ equally well if $X$ is there and acts through $B$. The whole debate is about whether the missing premise is true, and nothing in a scan can tell, since a scan does not remove $X$.

  - type: numeric
    id: lr-one
    title: "Equal likelihoods"
    prompt: |
      A person's prior probability for a presence $X$ is $0.2$. An experience $E$ is then reported. Suppose a brain explanation shows that $E$ is just as likely without $X$ as with it: $P(E \mid X) = P(E \mid \text{not }X) = 0.5$. The posterior odds are the prior odds times the likelihood ratio $\text{LR}=P(E\mid X)/P(E\mid \text{not }X)$, and probability is odds$/(1+\text{odds})$. What is the probability of $X$ after $E$?
    answer: 0.2
    tolerance: 0.005
    wrong:
      - { value: 0.5, feedback: 'The 0.5 is a likelihood, not a probability of $X$. With LR = 1 the prior odds $0.25$ stay $0.25$, which is a probability of $0.2$.' }
    hint: |
      Prior odds are $0.2/0.8$. Compute the LR first.
    explanation: |
      $\text{LR}=0.5/0.5=1$, so the odds stay $0.2/0.8=0.25$ and the probability stays $0.25/1.25=0.2$. This is what "defeater" means here: the experience carries no evidence, though the prior remains whatever it was for other reasons.

  - type: numeric
    id: lr-channel
    title: "A channel instead"
    prompt: |
      Same prior $P(X)=0.2$. Now suppose the brain state explains *how* the experience happens, but if $X$ is present the experience is more likely: $P(E\mid X)=0.5$ and $P(E\mid \text{not }X)=0.25$. Use posterior odds $=$ prior odds $\times$ LR, with $\text{LR}=P(E\mid X)/P(E\mid \text{not }X)$. What is the probability of $X$ after $E$, to three decimals?
    answer: 0.333
    tolerance: 0.005
    answerText: '0.333'
    wrong:
      - { value: 0.5, feedback: 'You may have taken the odds $0.25\times 2=0.5$ as a probability. Convert: $0.5/1.5=0.333$.' }
    hint: |
      Prior odds are $0.25$. LR is $2$.
    explanation: |
      $\text{LR}=0.5/0.25=2$, posterior odds $=0.25\times 2=0.5$, probability $=0.5/1.5\approx0.333$. A brain state that accompanies $E$ does not by itself make the LR equal to 1: that depends on whether $E$ would occur without $X$. The numbers are toy values, chosen only to show the mechanics.

  - type: mcq
    id: defeater-q
    title: "Which defeater, and does it apply?"
    prompt: |
      According to Swinburne, one kind of defeater says: even if the object were there, it probably did not cause the experience. A critic says a brain explanation fits this kind. Which reply is the best statement of the believer's position?
    options:
      - text: 'A brain explanation is a defeater only if it shows the experience would occur without the presence; if the presence acts *through* the brain, as an object does in ordinary perception, the brain state is part of how it causes the experience.'
        correct: true
        feedback: |
          Yes. In seeing a tree, light, retina and brain are the cause chain. The brain state is not a rival to the tree but a link. Whether religious experience is like this is, again, the live question.
      - text: 'A brain explanation is never relevant, because God is not physical.'
        feedback: |
          It is relevant: if the brain state is fully sufficient for the experience with or without a presence, the experience loses force. The believer's point is about when it is sufficient, not that it never matters.
      - text: 'Brain explanations always defeat experiences, since nothing happens outside the brain.'
        feedback: |
          This is a physicalist commitment (layer 3), not a result of any scan. It assumes what is being tested.
    explanation: |
      The critic's best reply is to ask what is special about these experiences: according to critics, they can be produced by stimulation, drugs and suggestion, which ordinary perceptions of a tree cannot, and that is why the "sufficient" claim is not silly.

  - type: mcq
    id: traps
    title: "Spot the slips"
    prompt: |
      Select every statement that makes a mistake of the kind this lesson warns about.
    multiple: true
    options:
      - text: 'A brain region is active during prayer, so the region causes the experience.'
        correct: true
        feedback: |
          Correlation is not cause: activity could be a result of the experience, a part of a wider process, or one link in a chain.
      - text: 'A region is active during prayer, so God exists.'
        correct: true
        feedback: |
          A mirror image of the headline: from a brain state to a verdict on the presence. Neither direction is licensed by a scan.
      - text: 'The experience has a brain correlate, so it must be illusory.'
        correct: true
        feedback: |
          Every experience has one, including accurate perceptions. Without the missing premise, the step is invalid.
      - text: 'A small scan study should be treated as preliminary.'
        feedback: |
          This is a cautious reading, and the studies say so themselves.
      - text: 'A double-blind design helps separate a field effect from the effect of expectation.'
        feedback: |
          True: it is why the Swedish test could show that suggestibility predicted the reports.
    explanation: |
      Three slips, and all three jump from "this brain state accompanies that experience" to a conclusion about what the experience is of. The two cautious statements are what a careful reader of these studies can say.

  - type: mcq
    id: layers-q
    title: "Which layer?"
    prompt: |
      Statements about the brain and religious experience can be sorted into three layers: (1) established fact, (2) scholarly debate, (3) faith or metaphysical commitment. Which one is **layer 2**?
    options:
      - text: 'Whether a weak magnetic field can induce a sense of presence in healthy people.'
        correct: true
        feedback: |
          Yes. The original reports and the double-blind test disagree, and the dispute is open.
      - text: 'Brain activity changes during meditation and prayer.'
        feedback: |
          This is layer 1, established, though the details vary by method and group.
      - text: 'The brain is a reducing valve that filters a larger reality.'
        feedback: |
          This is layer 3, a metaphysical picture. It was proposed by Huxley and rejected by materialists, and no scan decides it.
    explanation: |
      Sorting your own claims this way is the habit this course is after: it shows where more data could help (layer 2) and where the disagreement is about commitments (layer 3).

  - type: mcq
    id: what-next
    title: "What would settle it?"
    prompt: |
      A believer and a sceptic both accept every scan result in this lesson. Which kind of consideration could still separate their readings?
    options:
      - text: 'Considerations that the two pictures predict differently or weigh differently: how plausible each is on other grounds, whether experiences yield information the person could not have had, and what the experiences do to lives.'
        correct: true
        feedback: |
          Yes. These are where the debate actually continues: the prior, the claims of veridical information (which are contested and rarely tested), and the fruits. The last is the topic of the next lesson.
      - text: 'More scans of the same kind, with better machines.'
        feedback: |
          Sharper scans refine the correlate, which both readings already accept. They may help in other ways (for instance, showing which regions a stimulation changes), but not decide channel against producer.
      - text: 'Nothing: the two readings are the same view in different words.'
        feedback: |
          They differ on what is real, and each can say what it would expect elsewhere. It is not easy to find a test that separates them, but that is a different claim from saying they do not differ.
    explanation: |
      This leaves the question open on purpose: thoughtful people part ways at the prior, at how much to trust the experiences, and at what the brain evidence is taken to be evidence of.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** Do Experiences Change Lives? If brain states cannot settle what an experience is of, perhaps its effects can say something: what happens to people's lives after a mystical or conversion experience, how a study could measure it, and what such effects would and would not show.
