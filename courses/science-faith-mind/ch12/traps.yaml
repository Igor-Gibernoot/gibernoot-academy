id: ch12-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: religious experience"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: James and the varieties of religious experience, Otto's numinous, mystics across traditions, the perennial philosophy and its critics, experience as evidence, the brain and religious experience, and what experiences do to lives. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone, and where thoughtful people differ the feedback shows both sides. Notation as in the lessons: LR is a likelihood ratio, $\text{LR}=P(E\mid X)/P(E\mid \text{not }X)$ for an experience $E$ of a presence $X$, and posterior odds equal prior odds times LR.

  - type: mcq
    id: private-worthless
    title: "Private, so worthless?"
    prompt: |
      A student says: "A mystical experience happens inside one person and others cannot check it, so it has no value for anyone but its owner, and none even for the owner." According to William James (1842-1910), which reading is closest to his view?
    options:
      - text: 'In essence, James held that such states are usually authoritative for the person who has them, that others are under no obligation to accept their content, and that their existence still counts against the claim that ordinary waking reason alone decides what is credible.'
        correct: true
        feedback: |
          Yes. This is respect without obligation: authority for the owner, no compulsion for outsiders, and no easy dismissal either. A critic adds that fevers and drugs also feel like insight, so the third point is contested.
      - text: 'Because the experience is private it binds everyone who hears the report.'
        feedback: |
          This reverses the shortcut and keeps its error. According to James, outsiders need not accept the content; they may weigh it as evidence.
      - text: 'A private experience is meaningless unless a laboratory can reproduce it on demand.'
        feedback: |
          Reproducibility is a strong test, but James did not make it the only route to value. He asked about luminousness, reasonableness and helpfulness, and about how the experience fits with the rest of life.
    explanation: |
      "Cannot be checked by me" is weaker than "worthless". Private evidence can be weighed by others as testimony, with its limits, and later lessons ask how much it should move us.

  - type: mcq
    id: roots-fruits
    title: "A natural origin cancels the value?"
    prompt: |
      A student says: "Religious feelings come from the body and nervous system, so James's own approach shows they are nothing more than symptoms." In The Varieties of Religious Experience (1902), James called this style of argument "medical materialism". What was his reply?
    options:
      - text: 'James held that judging a state by its roots (its bodily origin) is a different question from judging it by its fruits (its effects and fit with the rest of life), and that origin alone cannot settle value. All our states, including a scientist''s thoughts, have bodily conditions.'
        correct: true
        feedback: |
          Yes. If a bodily origin cancelled worth, it would cancel every thought, including the critic's. How the origin bears on *truth* is a further question, which the lesson on the brain took up with likelihood ratios.
      - text: 'James held that religious feelings have no bodily conditions at all.'
        feedback: |
          He did not deny conditions. His point was that having a condition says nothing by itself about whether the state is valuable or true.
      - text: 'James held that only the effects matter, so a false belief with good effects is as good as a true one.'
        feedback: |
          James cared about effects, but later lessons show why good effects alone do not fix truth: a sincere belief in a false presence could help too.
    explanation: |
      Roots and fruits are two questions. A natural origin is expected on almost every view, so it cannot be the whole argument against, or for, a state.

  - type: mcq
    id: numinous-fear
    title: "The numinous is just fear?"
    prompt: |
      A student says: "Rudolf Otto's numinous is simply fear of something dangerous, written in religious words." According to Otto (Das Heilige, 1917), what is the best correction?
    options:
      - text: 'Otto described the numinous as a mystery felt as wholly other, with two sides: the tremendum (awefulness, overpowering majesty, urgency) and the fascinans (a pull that attracts). The dread arises before something that is not an ordinary danger, and it comes together with fascination.'
        correct: true
        feedback: |
          Yes. A bear in the road gives fear without fascination and without the sense of the wholly other. Otto called the response creature-feeling: a sense of one's own smallness before something greater.
      - text: 'Otto agreed that the numinous is fear, and only added that the object is God.'
        feedback: |
          Otto insisted that the feeling is of its own kind and cannot be reduced to fear or to any other ordinary emotion.
      - text: 'Otto held that the numinous is a purely pleasant feeling of calm.'
        feedback: |
          The fascinans is attractive, but the tremendum is part of the same experience. Dropping it loses the mixture that Otto thought was the mark of the numinous.
    explanation: |
      Fear has a definite danger as its object. The numinous, according to Otto, has an object felt as beyond comparison, and it draws as much as it dismays.

  - type: mcq
    id: awe-explained
    title: "A psychology of awe cancels its object?"
    prompt: |
      Dacher Keltner and Jonathan Haidt (2003) described awe as an emotion built on two appraisals: perceived vastness and a need for accommodation, that is, a need to revise one's mental picture to fit what was met. A student says: "Since awe has a psychological description, no one can have been in awe *of* anything real." Which reply is best?
    options:
      - text: 'A description of how awe works in a person does not decide whether its object is real. We also have psychological descriptions of seeing a mountain, and the mountain stays. The question of the object is left open and is asked again with evidence.'
        correct: true
        feedback: |
          Yes. This is the point that a mechanism is not by itself a defeater. Whether it is one depends on whether the experience would occur just as well without the object, which later lessons express as LR equal to 1.
      - text: 'Psychology cannot describe awe, because it is a religious feeling only.'
        feedback: |
          Keltner and Haidt study awe in many settings, from nature to music to great ideas. A scientific description is possible, and it is not an attack on religion.
      - text: 'If awe is explained, the person was mistaken about feeling it.'
        feedback: |
          Explaining a feeling does not show the person did not have it. The feeling is real; what is debated is what it is a feeling of.
    explanation: |
      How an experience arises and what it is of are separate questions. A believer can accept the psychology and hold that it is the way a real object is met; a skeptic can accept the same psychology and hold that nothing more is needed.

  - type: mcq
    id: union-same
    title: "All mystics meet God?"
    prompt: |
      Sufis speak of fana, Teresa of Avila of union and spiritual marriage, Meister Eckhart of a ground shared with God, Advaita Vedanta of the identity of the self with Brahman, and Buddhists of awakening. A student says: "They all use the language of union, so they all describe meeting God." What is the best correction?
    options:
      - text: 'The word "union" covers different things: a marriage of two (Teresa), a shared ground (Eckhart), an identity (Advaita), the loss of the sense of a separate self (fana, as read by some), and in Buddhism there is no God as the partner. Whether the differences are only in the words is the debate of the lesson.'
        correct: true
        feedback: |
          Yes. The reports invite comparison, but a shared word is not a shared object. Whether the differences are the tradition's interpretation laid over a common core is the question that follows.
      - text: 'Mystics in different traditions describe nothing in common.'
        feedback: |
          This goes too far. There are striking similarities, such as a sense of unity and ineffability, which is why the perennial view has defenders. The trap is to treat them as already settled.
      - text: 'Only mystics inside one tradition are reliable, so only their word counts.'
        feedback: |
          Nothing in the comparison says that. It asks what the reports share and where they differ, not whose tradition is correct.
    explanation: |
      Resemblance in vocabulary is where the comparison starts. Whether the reports share a core, and whether the core is contact with anything, are the steps that come after.

  - type: mcq
    id: core-true
    title: "A shared core means all religions are equally true?"
    prompt: |
      Suppose Walter Stace (1960) is right that mystical experiences in many traditions share a core, and the differences come from interpretation. A student says: "So every religion is equally true." Which statement exposes the leap?
    options:
      - text: 'A shared experience would not by itself show that it is contact with a real thing, and the doctrines outside the core, about creation, a personal God or the afterlife, could still conflict. Common experience and true doctrines are different things.'
        correct: true
        feedback: |
          Yes. Aldous Huxley (The Perennial Philosophy, 1945) went further and took the core as contact with one divine Reality, which is a metaphysical commitment, not a finding. Critics, for instance those who read the core as a brain state, deny it.
      - text: 'If there is a shared core, then the interpretations are all false.'
        feedback: |
          Nothing follows about the interpretations from the core alone. They may be mistaken, partly right, or right about different aspects.
      - text: 'A shared core can never be found, because every report is in words.'
        feedback: |
          Words are a real obstacle, and Steven Katz (1978) pressed it, but it is a claim about the shape of the evidence, not a proof that no core exists.
    explanation: |
      Three steps hide in the student's sentence: there is a core, the core is contact with reality, and the doctrines agree. Each needs its own support.

  - type: mcq
    id: katz-illusion
    title: "Concepts shape experience, so it is an illusion?"
    prompt: |
      Steven Katz (1978) argued that there are no unmediated experiences: what a mystic meets is shaped by the concepts, practices and expectations the mystic brings. A student says: "So mystical experiences are illusions." What is the best reply?
    options:
      - text: 'Katz''s claim is that experiences differ because concepts differ, which weakens the idea of one common core. It is not a claim that experiences are illusions. Ordinary seeing is also shaped by concepts, and we do not conclude that seeing is an illusion.'
        correct: true
        feedback: |
          Yes. Katz challenges the perennial reading, not the reality of the experiences. A critic can add that if every experience is built by its tradition, then agreement between traditions is hard to expect; a defender of a core, such as Robert Forman with pure consciousness events, replies that some experiences lack content to be shaped.
      - text: 'Katz held that all mystical experiences are identical.'
        feedback: |
          That is the position he opposed. He held that different concepts give different experiences.
      - text: 'Katz proved that mystics cannot be trusted.'
        feedback: |
          His argument concerns the role of concepts, not the honesty of mystics. It leaves open whether a shaped experience is also an experience of something.
    explanation: |
      "Shaped by concepts" is true of nearly all experience. What matters is how much shaping, and whether any part of what is reported survives the change of tradition.

  - type: numeric
    id: core-count
    title: "Core or union?"
    prompt: |
      Three traditions describe their mystical states with these features. Tradition 1: unity, stillness, light, joy, no self. Tradition 2: stillness, light, joy, a loving presence. Tradition 3: light, joy, no self, an overwhelming peace. A common core is the set of features that **all three** share. How many features are in the common core?
    answer: 2
    tolerance: 0.001
    wrong:
      - { value: 7, feedback: 'That counts the features of any of the three (the union). A common core needs a feature in every tradition.' }
      - { value: 3, feedback: 'Recount: unity appears only in tradition 1, no self is missing from tradition 2, and so on. Check each feature against all three lists.' }
    hint: 'Go through the features of tradition 1 and keep each one that also appears in the other two.'
    explanation: |
      Only light and joy appear in all three, so the core has 2 features. The union has 7 (unity, stillness, light, joy, no self, a loving presence, an overwhelming peace). The size of a core shrinks as traditions are added, and it depends on how finely the features are described, which is a point both sides of the debate use.

  - type: mcq
    id: credulity-all
    title: "Credulity means believe every report?"
    prompt: |
      Richard Swinburne's principle of credulity says, in essence, that if it seems to a person that something is present, then probably it is present, unless there is a reason to think otherwise. A friend says: "So if a mystic says she met God, that settles it, and anyone with a report must be believed." Which reply is best?
    options:
      - text: 'The principle gives a seeming the weight of good evidence that holds unless a defeater applies. The result is a probability that can be lowered by a low prior or cancelled by a defeater, not a proof, and it applies to every seeming, including those that conflict.'
        correct: true
        feedback: |
          Yes. The argument concludes "probably", and its force is graded by the likelihood ratio and the prior.
      - text: 'The principle is false, because things sometimes seem one way and are another.'
        feedback: |
          That is why the principle is *defeasible*. Mirages show that seemings can be cancelled, which the principle already allows; they do not show that seemings carry no weight.
      - text: 'The principle applies only to religious experience.'
        feedback: |
          It is a general principle about perception and seeming, and a defender argues that treating religious experience differently needs a reason.
    explanation: |
      "Innocent until defeated" is a rule about the default, not about the verdict. The same default also covers the seemings of the skeptic.

  - type: numeric
    id: no-defeater
    title: "No defeater, so how likely?"
    prompt: |
      No defeater applies to a mystic's experience $E$ of a presence $X$, and its likelihood ratio is $\text{LR}=20$. A reader's prior probability for $X$ is $0.01$. Using posterior odds $=$ prior odds $\times$ LR, what is the probability of $X$ after $E$? (To three decimals.)
    answer: 0.168
    tolerance: 0.003
    answerText: '0.168'
    wrong:
      - { value: 0.2, feedback: 'You have the posterior odds ($0.0101\times 20\approx 0.202$) but have not converted them to a probability: $0.202/1.202\approx0.168$.' }
      - { value: 0.95, feedback: 'That would be the result from a prior near one half. With a prior of $0.01$ the odds start at about $0.0101$.' }
    hint: 'Prior odds are $0.01/0.99$. Multiply by 20, then use probability $=$ odds$/(1+\text{odds})$.'
    explanation: |
      Prior odds $0.01/0.99\approx0.0101$, posterior odds $\approx0.202$, probability $\approx0.168$. A strong ratio, with no defeater, still leaves the claim unlikely when the prior is low. A believer will say the prior should not be so low; the arithmetic shows why that is where the argument moves. The numbers are toy values.

  - type: mcq
    id: diversity-all
    title: "Different traditions, so every experience is worthless?"
    prompt: |
      Experiences in different traditions seem to be of different things: a personal God, an impersonal Brahman, no God. A student says: "Because they conflict, none of them can be evidence." How do William Alston (Perceiving God, 1991) and John Hick (1989) answer in essence?
    options:
      - text: 'Alston held that each tradition has its own practice with its own checks, and that conflict makes the matter hard but does not erase the evidence; Hick took the traditions as different cultural responses to one ultimate Real. Both treat diversity as a challenge to weigh, though critics call it a prima facie defeater.'
        correct: true
        feedback: |
          Yes. The replies differ (Alston keeps the claims of one practice, Hick softens all of them), and whether either works is one of the live debates of the level.
      - text: 'They both held that conflicting experiences cancel out to zero evidence.'
        feedback: |
          Neither did. Both were defending the evidential force of religious experience against this very objection.
      - text: 'They both held that diversity never happens.'
        feedback: |
          Both accept diversity as a fact. The disagreement is about what it implies.
    explanation: |
      Conflicting reports lower the weight of each one, but a conflict about details can sit within agreement that something was met. How much it lowers them is the debate.

  - type: mcq
    id: brain-only
    title: "A brain correlate means it is only the brain?"
    prompt: |
      A scan shows that a region of the temporal lobe is active when a person has an intense sense of presence. A student says: "So the experience is nothing but that region, and there is nothing more to it." What is the best correction?
    options:
      - text: 'A correlate shows that the brain takes part, not that nothing else does. It might be cause, effect or one link in a chain; and in ordinary perception the brain state is part of how an object is seen, so the brain being involved does not remove the object.'
        correct: true
        feedback: |
          Yes. Whether the brain state would produce the experience *without* the presence is what decides if it is a defeater, and a scan does not remove the presence to find out.
      - text: 'Scans of the brain tell us nothing about religious experience.'
        feedback: |
          They tell us a good deal, such as which regions change during prayer or meditation (Newberg and colleagues' small SPECT studies are an example, called preliminary by their own authors). The error is in the step from correlate to "nothing but".
      - text: 'A scan proves the experience was caused by the presence.'
        feedback: |
          The mirror-image error. A scan alone does not decide the cause either way.
    explanation: |
      "Nothing but the brain" is a physicalist commitment (faith layer), not a result of a scan. The believer's reply and the skeptic's reply both use the same scans.

  - type: mcq
    id: helmet-fail
    title: "One failed replication ends the field?"
    prompt: |
      In a double-blind test (Granqvist and colleagues, 2005, Uppsala) of Michael Persinger's helmet, 43 volunteers received a weak magnetic field and 46 wore the helmet with no field (89 in all). Reports of a sensed presence did not depend on the field; they were predicted by suggestibility. A student says: "So the neuroscience of religion is disproved." Which reply is best?
    options:
      - text: 'The test addressed one claim about one device. It does not touch other lines of work, such as studies of temporal lobe epilepsy or of brain activity in prayer and meditation. Persinger disputed that the test replicated his exposure, and later studies went both ways, so the helmet claim itself remains contested.'
        correct: true
        feedback: |
          Yes. A failed test of one mechanism shows suggestion can produce the sense of presence, which is itself a finding. Other findings stand or fall on their own evidence.
      - text: 'The test proves that suggestion explains all religious experience.'
        feedback: |
          The test shows suggestion can produce a sensed presence in a lab. It says nothing about experiences that no one expected.
      - text: 'The test shows the helmet works, since some people did report a presence.'
        feedback: |
          Reports occurred in both groups, with and without the field, which is the point: the field was not needed.
    explanation: |
      Neuroscience of religion is many questions, not one. Judging a field by the fate of its most famous experiment confuses a claim with a research programme.

  - type: numeric
    id: lr-one
    title: "LR of one means false?"
    prompt: |
      A brain explanation shows that an experience $E$ would occur just as often without a presence $X$ as with it, so $\text{LR}=1$. A reader's prior probability for $X$ is $0.3$. What is the probability of $X$ after hearing of $E$?
    answer: 0.3
    tolerance: 0.005
    wrong:
      - { value: 0, feedback: 'LR of 1 means the experience carries no evidence either way; it does not make $X$ impossible. Posterior odds equal prior odds times 1.' }
      - { value: 0.5, feedback: 'The odds do not reset to even. With LR equal to 1 they stay at the prior odds.' }
    hint: 'Multiplying the prior odds by 1 changes nothing.'
    explanation: |
      Prior odds $0.3/0.7\approx0.4286$; times 1 leaves them; probability $0.3$. A defeater of this kind removes the experience as a *reason*, but the prior, built from other considerations, is untouched. That is why believers and skeptics can agree on the LR and still disagree about $X$.

  - type: numeric
    id: good-outcome
    title: "A good outcome, so true?"
    prompt: |
      Start with probability $0.5$ that a presence $X$ is real. After an experience, a lasting good outcome $G$ has probability $0.9$ if $X$ is real, and $0.8$ if $X$ is not real but the person sincerely believes it is. What is the probability that $X$ is real after seeing $G$? (To three decimals.)
    answer: 0.529
    tolerance: 0.004
    answerText: '0.529'
    wrong:
      - { value: 0.9, feedback: 'That is $P(G\mid X)$, not a probability of $X$. Compare it with $P(G\mid\text{not }X)=0.8$.' }
      - { value: 1.125, feedback: 'That is the likelihood ratio $0.9/0.8$. With prior odds 1, the posterior odds are 1.125; convert to a probability: $1.125/2.125$.' }
    hint: 'LR is $0.9/0.8$. Prior odds are 1. Then odds$/(1+\text{odds})$.'
    explanation: |
      $\text{LR}=1.125$, posterior odds $1.125$, probability $1.125/2.125\approx0.529$. A benefit that is common whether or not the presence is real hardly moves the estimate. Believers reply that a real presence best explains deep and lasting benefit, which means arguing that the denominator is smaller; that is a claim to defend with evidence. The numbers are toy values.

  - type: mcq
    id: harm-false
    title: "A harm, so false?"
    prompt: |
      Some participants in the Good Friday study (Walter Pahnke, 20 April 1962, 20 divinity students given psilocybin or niacin) had acute anxiety during the session, and one was restrained after leaving the chapel. A critic says: "That harm shows the experience was not of anything real." Which reply is best?
    options:
      - text: 'Harm and truth are separate: a real thing can be frightening, as the numinous shows, and a false belief can be pleasant. Distress is evidence about risk and care, not about the source, and the same logic that blocks "good, so true" blocks "bad, so false".'
        correct: true
        feedback: |
          Yes. Distress matters a great deal for how such studies must be run, but it is silent on whether anything was met.
      - text: 'Harm is irrelevant to everything and should be ignored.'
        feedback: |
          Harm matters for ethics and for safe design. It is only silent on the truth of the source.
      - text: 'Only good outcomes count as data about the experience.'
        feedback: |
          That would pick the evidence to suit a conclusion. A fair study counts good, bad and neutral outcomes.
    explanation: |
      Effects of an experience are gathered from everyone who had it. What the effects say about the source depends on the likelihood ratio, and for harm, as for benefit, that ratio may be near 1.

  - type: mcq
    id: conversion-all
    title: "Conversion changes everything, or nothing?"
    prompt: |
      Raymond Paloutzian, James Richardson and Lewis Rambo (1999) reviewed research on religious conversion and personality. A student says: "Either a real conversion changes the whole person, or it changes nothing and was a sham." In essence, what did the review conclude?
    options:
      - text: 'Conversion tends to change the middle layers of a person (purposes, values, identity, what one cares about) more than core traits such as sociability or openness. So both can hold at once: a real change in values and stable temperament.'
        correct: true
        feedback: |
          Yes. "Did the person change?" has no single answer: it depends on which layer is measured, and a study of core traits alone can miss a real change in values.
      - text: 'Conversion changes every trait equally.'
        feedback: |
          That is the first half of the student's false choice. The review found changes concentrated in some layers.
      - text: 'Conversion never changes anything measurable.'
        feedback: |
          That is the second half of the false choice. Changes in values and purposes are measurable and were reported.
    explanation: |
      When reading a study of change, ask which part of the person was measured and how. James noted, from Starbuck, that some conversions fade, and others last; the layers help explain why a trait score can stay while a life changes direction.

  - type: mcq
    id: small-study
    title: "A small self-report study proves the effect?"
    prompt: |
      In a 2008 follow-up by Roland Griffiths and colleagues, 36 religiously active, drug-naive volunteers who had received psilocybin in a double-blind trial against methylphenidate were asked 14 months later about the session. 58% rated it among the five most personally meaningful experiences of their lives. A student says: "So psilocybin experiences reliably change lives." What is the best correction?
    options:
      - text: 'The group was small and selected, prepared for many hours and expecting something meaningful, and the ratings are self-reports. A fair reading is: in this group, under these conditions, many people kept calling the session meaningful. Other groups, settings and objective measures would be needed for more.'
        correct: true
        feedback: |
          Yes. Selection, expectation and self-report mark where the finding stops. It does not cancel the finding.
      - text: 'The study is worthless because 58% is less than 100%.'
        feedback: |
          A majority rating is a real result. The issue is how far it carries, not whether it counts.
      - text: 'The study shows nothing because people cannot judge their own experiences.'
        feedback: |
          Self-report is the right data for a question about meaning. Its limit is generalizing from a selected group.
    explanation: |
      A percentage of a small group moves a lot with a few people: 58% of 36 is about 21 people. Findings of this kind are a starting point for larger and more varied studies, not a general law.

  - type: mcq
    id: sort-claims
    title: "Sort the claims by layer"
    multiple: true
    prompt: |
      This course separates claims in three layers: established fact, scholarly debate, and faith or metaphysical commitment. Which of the following belong in the first layer, **established fact**? Select all that apply.
    options:
      - text: 'Raymond Paloutzian, James Richardson and Lewis Rambo reviewed research on conversion and concluded, in essence, that conversion changes the middle layers of a person more than core traits.'
        correct: true
        feedback: |
          Yes, as a report of what the review concluded. How far to trust the conclusion is a further step.
      - text: 'In a 2005 double-blind test, 43 volunteers received a weak magnetic field and 46 wore a helmet with no field, and presence reports did not depend on the field.'
        correct: true
        feedback: |
          Yes: the result as reported by its authors. Whether the original helmet claim is wrong is disputed.
      - text: 'Mystical experiences in all traditions are contact with one divine Reality.'
        feedback: |
          A metaphysical commitment (Huxley held it; others deny it). The reports are fact; what they are of is a commitment.
      - text: 'A brain explanation of an experience always defeats it as evidence.'
        feedback: |
          A debated claim at best: it defeats only if the experience would occur just as well without the presence (LR equal to 1), and whether that is so is the live question.
    explanation: |
      Facts are what was observed, with their size and limits. Interpretations of the same facts are debates, and the final step from an interpretation to a worldview is a commitment.

  - type: text
    id: summary
    title: "What this round tested"
    body: |
      Each trap was a shortcut one step too far. **James**: a private experience is authoritative for its owner and not binding on others, not worthless; and a bodily root does not decide the value of fruits. **Otto**: the numinous is a mystery felt as wholly other, with dread and attraction together, not plain fear; and a psychological account of awe (vastness plus a need to accommodate) leaves its object open. **Mystics**: a shared word such as union covers a marriage, a shared ground, an identity and, in Buddhism, no God as partner; a common core is the intersection of the traditions' features (here $2$ features, against a union of $7$), and even a real core would not make every doctrine true; Katz's claim that concepts shape experience weakens the idea of one core but does not make experience an illusion. **Evidence**: a seeming is good evidence unless a defeater applies, which is a probability and not a proof (a prior of $0.01$ with LR $20$ gives about $0.168$), diversity of traditions is a challenge to weigh, and the answers differ. **The brain**: a correlate does not make the experience "nothing but" the brain, one failed helmet test (43 field, 46 sham, 89 in all) does not end a field, and LR equal to $1$ leaves the prior as it was ($0.3$ stays $0.3$). **Lives**: a good outcome moves the odds only by its LR (prior $0.5$ with LR $1.125$ gives about $0.529$), a harm does not show the source false, conversion changes some layers more than others, and a small selected self-report study marks where a finding stops.

      Where thoughtful people part ways is in the prior given to a presence, in whether the brain acts as a channel or as a full cause, and in how far reports from different traditions can be pooled.

      **Next:** a quick recall of the level's main formulas and distinctions, and then its content map.
