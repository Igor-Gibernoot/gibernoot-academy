id: ch12-mysticism
title: "Mystics Across Traditions"
kind: concept
own: |
  The setting: people in five traditions (Sufi, Kabbalistic, Christian, Hindu, Buddhist) report experiences in which the usual sense of a separate self fades or is changed. The question is whether these are one kind of experience described in five vocabularies, or five different experiences.
  - **Union against distance.** According to Rudolf Otto, the numinous keeps the person and the holy apart, in dread and attraction. {{ According to many mystics the distance seems to vanish or shrink, as a drop in the sea or as a marriage. }}
  - **Sufi.** According to Sufis, *fana* ("passing away") is the fading of the self's awareness of anything but God, and *baqa* is abiding in God afterwards. Opponents of al-Hallaj (executed in Baghdad in 922) took his cry *Ana al-Haqq*, "I am the Truth", as a claim to be God. His defenders took it as union.
  - **Kabbalah.** According to Kabbalists, *devekut* (from *davak*, "to cleave") is attachment to God, as constant awareness of God and sometimes an ecstatic state. The word "cleave" names two things joined.
  - **Christian.** According to Teresa of Avila (1515-1582), the deepest union is a "spiritual marriage" in the seventh mansion of her *Interior Castle* (written 1577), like rain falling into a river. According to Meister Eckhart (c. 1260-1328), the soul has a ground that is one with the ground of God.
  - **Hindu.** According to Advaita Vedanta (Shankara, 8th century), the individual self $\mathrm{ātman}$ and ultimate reality $\mathrm{Brahman}$ are identical, and *moksha* (liberation) is knowing it. The Chandogya Upanishad's *tat tvam asi* ("that you are") is read this way. According to devotional schools, loving service of a personal God is the surest route.
  - **Buddhist.** According to Buddhist teaching, *anatta* says a person has no lasting underlying self (only five changing groups of factors), and *nirvana* ("blowing out") is the going out of craving, aversion and ignorance. There is no self to unite with anything.
  - **Common core by intersection.** Let $T_i$ be the set of features reported in tradition $i$. A common core is what all five share:
  {{ $$\text{core} = T_1 \cap T_2 \cap T_3 \cap T_4 \cap T_5$$ }}
  Whether the core is large and meaningful, or thin (ineffability, a changed sense of self), depends on how coarsely the reports are described.
  - **Two readings.** According to those who see a common core, the traditions describe one experience in different words. According to Steven Katz (1978), {{ there are no pure, unmediated experiences: each tradition's concepts shape the experience itself }}, so the differences are real.
  - **Three layers.** That such reports exist and share some formal features is established; whether there is one core experience is a live debate; whether any of them is contact with the divine or with reality is a commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: one experience or five?"
    prompt: |
      Guessing is the point; no theory yet. A Sufi says she was "lost in God". A Hindu monk says "the self is Brahman, the whole". A Buddhist monk says "there was no self at all, only a going out". A Christian nun says "God and I were like rain in a river". Which guess seems most natural?
    options:
      - text: 'Hard to tell: the words overlap (the self fades) but the pictures differ (God, whole, nothing), and that is exactly the question.'
        correct: true
        feedback: |
          Yes. There is a resemblance and a difference, and the lesson asks which one tells us more. Neither can be assumed at the start.
      - text: 'They must be one experience, since all four describe the self fading.'
        feedback: |
          A shared feature is a clue, not a proof. Two people can both say "I felt small" about very different events, and the Buddhist report says there is no one to be united with, which is not the Christian picture.
      - text: 'They must be four unrelated experiences, since the words and the gods differ.'
        feedback: |
          Differences in words do not by themselves show differences in experience: people describe one sunset in different languages. The words may also shape what is felt, which is the live debate here.
    explanation: |
      Keep both pulls in mind: the family resemblance and the real differences. A careful reader asks what each tradition says, and then what could decide between "same" and "different".

  - type: text
    id: distance
    title: "From dread to union"
    body: |
      In the previous lesson, Rudolf Otto (1869-1937) described the numinous as a mystery that both repels and draws, and in it the person and the holy stay apart: the person is "dust and ashes" before something wholly other.

      According to many reports of **mysticism** (a word for experiences, and the traditions around them, in which a person seems to meet the ultimate directly, not through words or rites), the distance seems to shrink or vanish. The person is not before the holy but in it, or the sense of a separate "I" fades. William James listed the marks of such states: ineffable (hard to put into words), noetic (felt as knowledge), usually brief, and passive.

      This lesson visits five traditions, each told according to its own texts and teachers, and then asks what, if anything, the reports share. A short answer: not as much as one hopes, and not as little as one fears.

  - type: text
    id: sufi
    title: "Sufi: fana and baqa"
    body: |
      **Sufism** is the name for the mystical paths within Islam. Sufis speak of two linked states. ***Fana*** is "passing away": according to the early Sufi al-Sarraj, the fading of awareness of anything other than God. ***Baqa*** is "subsistence": abiding in the awareness of God afterwards. The Iranian reference work *Encyclopaedia Iranica* warns against reading fana as simple annihilation.

      Sufis themselves read fana in several ways. Some, such as al-Bistami and al-Hallaj, are associated with the view that it is a union (*ittihad*). Others, among them al-Ghazali, are linked with a more modest reading: seeing God as the only real agent, so that the self's own agency fades from view.

      Al-Hallaj (858-922) is the famous test case. His cry *Ana al-Haqq*, "I am the Truth", was taken by opponents as a claim to be God, and he was executed in Baghdad in 922. His supporters read it as a claim of union with God, and not as self-deification. Accounts of the trial and of the method of execution differ, so here we keep to the main fact.

  - type: mcq
    id: sufi-q
    title: "Two readings of one cry"
    prompt: |
      According to those who defended al-Hallaj, how should *Ana al-Haqq* ("I am the Truth") be read?
    options:
      - text: 'A boast by an ordinary person that he had become divine.'
        feedback: |
          This is how his opponents took it, and it explains why the cry was thought blasphemous. His defenders say it was not a boast but a statement of union.
      - text: 'An expression of union with God, not a claim that he himself was God.'
        correct: true
        feedback: |
          Yes. On this reading the sentence describes a state of union, not a claim of rank. Opponents read the same words as blasphemy.
      - text: 'A scientific claim about the nature of the universe.'
        feedback: |
          It is a religious utterance made in an ecstatic state, not a theory offered for testing.
    explanation: |
      Notice the structure that returns in every tradition: a report in strong words, and two readings of it.

  - type: text
    id: kabbalah
    title: "Kabbalah: devekut"
    body: |
      **Kabbalah** is the mystical tradition of Judaism. Its central book, the **Zohar** ("Splendour"), appeared in Spain in the late thirteenth century. Tradition holds that it was written by the second-century sage Simeon ben Yohai. According to the scholar Gershom Scholem, and the entry in the *Encyclopaedia Britannica*, its author was the Spanish Kabbalist Moses de Leon (c. 1250-1305). Many traditional scholars still hold the older view.

      The key term is ***devekut***, from the Hebrew *davak*, "to cleave". According to the Oxford companion *The Jewish Religion*, it names chiefly the constant awareness of God and sometimes also the ecstatic state that comes from such communion. Maimonides read the biblical "cleave to Him" as remembering God constantly, and the Talmudic rabbis linked it with study of the Torah.

      The word itself is worth a pause: to cleave is to hold fast to something, which suggests two things joined, not one. Whether that picture survives the strongest experiences is a question Kabbalists themselves discuss, and one we cannot settle here.

  - type: text
    id: teresa
    title: "Christian: Teresa's marriage"
    image:
      src: img/teresa.webp
      alt: "Painted portrait of Teresa of Avila in a Carmelite habit and white mantle, looking at the viewer"
      caption: "Teresa of Avila (1515-1582), painted in Seville in the 1570s by Fray Juan de la Miseria (some sources give 1570, others 1576), who had her sit for it."
      credit: "Juan de la Miseria, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Teresa_de_Jes%C3%BAs_(cropped).jpg"
    body: |
      Teresa of Avila (1515-1582) was a Spanish Carmelite nun, reformer of her order, and in 1970 the first woman made a Doctor of the Church. In 1577 she wrote *The Interior Castle* (first printed in 1588), picturing the soul as a castle with seven mansions, God dwelling at the center.

      According to Teresa, in the seventh mansion the soul reaches what she calls **spiritual marriage**. She separates it from an earlier and briefer *union*: that favour generally passes quickly, whereas in the marriage the soul remains at its center with God. To show the difference she uses the picture of rain falling into a river, where the rain and the river water cannot afterwards be told apart.

      Notice her choice of words: a marriage joins two partners. Many Christians read her as describing the closest possible union with a God who stays distinct from the soul.

  - type: text
    id: eckhart
    title: "Christian: Eckhart's ground"
    body: |
      Meister Eckhart (c. 1260-1328), a German mystic and preacher, taught in a bolder vocabulary. According to Eckhart, the soul has an innermost **ground** that is not created, and that is one with the ground of God. He also distinguishes **God**, the personal God of the Trinity, from the **Godhead**, the silent and simple depth from which the Trinity comes.

      According to scholars such as Bernard McGinn, this ground is the center of Eckhart's mysticism. Some of the claims drawn from his preaching were condemned by the church after his death. More recent scholarship argues that he did not dismiss reason and understood the ground as intellect, so his defenders deny that he meant a human being becomes the Creator.

      So even inside one religion we find two pictures: a marriage that keeps two partners, and a ground in which the partners are hard to tell apart. Christian sources do not agree on the best name for the second.

  - type: mcq
    id: christian-q
    title: "Same religion, same account?"
    prompt: |
      Teresa of Avila (spiritual marriage, rain in a river) and Meister Eckhart (the ground of the soul is one with the ground of God) were both Catholic mystics. Which statement fits the evidence best?
    options:
      - text: 'They use different pictures of closeness, and readers disagree about how far apart the soul and God remain in each.'
        correct: true
        feedback: |
          Yes. Same religion, but a marriage and a shared ground are different images, and scholars and believers debate both. Teresa speaks of two partners, Eckhart of a ground that is hard to divide.
      - text: 'They give identical accounts, since both are Christian.'
        feedback: |
          Sharing a religion does not make two mystics say the same thing. Some claims drawn from Eckhart's preaching were condemned after his death.
      - text: 'Only Eckhart describes union; Teresa describes no union at all.'
        feedback: |
          Teresa says that in the seventh mansion the soul is united with God and uses the word "marriage" and the image of rain in a river. Her union is described as close, not as absent.
    explanation: |
      The first lesson of this chapter: before comparing traditions, compare the mystics inside one.

  - type: text
    id: hindu
    title: "Hindu: Advaita and moksha"
    body: |
      In the Chandogya Upanishad (a text of about 600 BCE), a teacher, Uddalaka Aruni, tells his son Shvetaketu a series of images and ends each with *tat tvam asi*, "that you are".

      According to **Advaita Vedanta** (a school whose best-known teacher, Shankara, is dated by Britannica to the 8th century, with uncertain years), the sentence states an identity: the individual self ($\mathrm{ātman}$) is the same as ultimate reality ($\mathrm{Brahman}$), and the world's variety comes from ignorance. ***Moksha***, "liberation", is freedom from the cycle of death and rebirth; for Advaita it is a change of insight, a waking up to what one already is, not a journey to somewhere.

      Two other views are on record. Devotional schools such as Vaishnavism hold that loving service of a personal God is the surest route to moksha. And the translators Patrick Olivelle and Joel Brereton argue that the Sanskrit words *tat tvam asi* should read "in that way are you", which weakens the Advaita reading.

  - type: text
    id: buddhist
    title: "Buddhist: anatta and nirvana"
    body: |
      According to Buddhist teaching, the experience of liberation does not unite a self with anything, because there is no lasting self to unite. ***Anatta*** ("not-self") says a person is made of five changing groups of factors (*khandha*, in Pali) and has no unchanging substance underneath. ***Nirvana*** (Pali *nibbana*) means "blowing out", as of a flame: the going out of craving, aversion and ignorance. Tradition distinguishes nirvana during life from final nirvana at death.

      Readers disagree on what this means. On one reading, anatta teaches that there is no self at all. On another, it is a strategy for loosening attachment, and the Buddha did not state a doctrine of no-self. Scholars also note a puzzle: if there is no self, then who is liberated? Buddhists answer in several ways.

      For our comparison the point is simple: the Buddhist report does not contain a second party. No God, no whole to merge with.

  - type: text
    id: table
    title: "The five side by side"
    body: |
      According to each tradition, the experience in its own vocabulary:

      | Tradition | Key term | What the self does |
      |---|---|---|
      | Sufi | *fana*, *baqa* | passes away, then abides in God |
      | Kabbalah | *devekut* | cleaves to God |
      | Christian | marriage, ground | is united with God, or shares his ground |
      | Hindu (Advaita) | *tat tvam asi* | is found to be Brahman |
      | Buddhist | *anatta*, *nirvana* | is seen not to be a lasting self |

  - type: mcq
    id: sorting
    title: "What do the reports share?"
    multiple: true
    prompt: |
      Writers who compare these traditions often list features that appear in many of the reports and features that differ. Select all that are claimed in the accounts you just read in at least four of the five traditions (Sufi, Kabbalistic, Christian, Hindu, Buddhist).
    options:
      - text: 'The experience is hard to put into words.'
        correct: true
        feedback: |
          Yes. Ineffability is reported in all five, and it was one of James's marks.
      - text: 'The ordinary sense of a separate self is changed, loosened or fades.'
        correct: true
        feedback: |
          Yes. It is expressed as passing away, cleaving, marriage, identity or not-self, but in each case the self is no longer felt as before.
      - text: 'The person is united with a personal God who stays distinct from the world.'
        feedback: |
          Only in some. Sufi, Kabbalistic and Christian accounts speak of God, and Advaita identifies the self with an impersonal Brahman. Buddhist accounts have no such God as the partner.
      - text: 'The person sees that there is no lasting self.'
        feedback: |
          This is the Buddhist teaching of anatta, and Advaita agrees that the ordinary person is not the final self. The theistic traditions say the opposite: the soul is real and loved by God.
    explanation: |
      The shared set is real but thin: ineffability and a changed sense of self. That is the intersection the lesson calls the core. The cases that differ are the ones that carry the most doctrine.

  - type: text
    id: readings
    title: "Two ways to read the pattern"
    body: |
      Let $T_i$ be the set of features reported in tradition $i$ (ineffability, a changed sense of self, a personal God, and so on). A **common core** is what every tradition shares:

      $$\text{core} = T_1 \cap T_2 \cap T_3 \cap T_4 \cap T_5$$

      According to those who find a **common core** (the view the next lesson calls the perennial philosophy), the core is one experience that each tradition describes in the words and images it already has. Its supporters point to the overlap of ineffability and a changed self.

      According to **Steven Katz**, in a 1978 essay, "Language, Epistemology, and Mysticism", in a volume he edited, there are no pure, unmediated experiences: a person's concepts and training shape the experience itself, not only its description. A Buddhist trained in not-self and a Christian trained in a God who loves her will not have the same experience, and the sameness of the words is misleading.

      Both sides see the overlap. They differ on what the overlap is: the visible tip of one thing, or a shared surface over different things.

  - type: mcq
    id: readings-q
    title: "What would count?"
    prompt: |
      Katz holds that concepts shape the experience. Which finding would be hardest for his view to explain?
    options:
      - text: 'Two people with no religious training and no shared vocabulary independently report matching experiences, and the match survives careful questioning.'
        correct: true
        feedback: |
          Yes. If the concepts shape the experience, untrained people should not match. Defenders of Katz reply that no one is untrained, and that questionnaires hide differences.
      - text: 'A Sufi and a Christian use different words for what they felt.'
        feedback: |
          This is exactly what Katz predicts: different training, different vocabulary. It does not trouble his view.
      - text: 'A Buddhist monk says the experience confirmed what his teachers had told him to expect.'
        feedback: |
          This is expected on Katz's view, since training shapes the experience. A critic notes that it is equally expected if the monk simply described the experience in the vocabulary he knew.
    explanation: |
      Each reading has a finding that would trouble it. A good habit is to ask in advance what would count, and how a believer, a skeptic and a scholar each would answer.

  - type: order
    id: chronology
    title: "Order the sources in time"
    prompt: |
      Put these sources in order, earliest first.
    steps:
      - 'The Chandogya Upanishad, where *tat tvam asi* appears (about 600 BCE)'
      - 'The execution of al-Hallaj in Baghdad (922 CE)'
      - 'The Zohar appears in Spain (late 13th century)'
      - 'Teresa of Avila writes The Interior Castle (1577)'
    hint: |
      Upanishads first, then the Sufi at the start of the tenth century, then the thirteenth, then the sixteenth.
    explanation: |
      The reports span about two thousand years, so each tradition has its own history of commentary. Calling them all "the mystics" blurs those histories.

  - type: numeric
    id: gap
    title: "How far apart in time?"
    prompt: |
      Al-Hallaj was executed in 922 CE. Teresa of Avila wrote The Interior Castle in 1577 CE. How many years lie between these two events?
    answer: 655
    tolerance: 0.5
    hint: 'Subtract the earlier year from the later one.'
    explanation: |
      $1577 - 922 = 655$ years. A comparison of mystics is also a comparison across centuries, languages and cultures, which is part of why the question of sameness is hard.

  - type: mcq
    id: traps
    title: "Which of these is a mistake?"
    multiple: true
    prompt: |
      Select all that are mistakes.
    options:
      - text: 'Mystics in all traditions meet God, since they all speak of union.'
        correct: true
        feedback: |
          A mistake. Buddhist teaching has no God as the partner, and Advaita speaks of an impersonal Brahman. Even "union" means different things: a marriage, a shared ground, an identity.
      - text: 'Fana means that the Sufi is annihilated, as in death.'
        correct: true
        feedback: |
          A mistake. The reference works describe fana as the passing away of the self's awareness of anything but God, followed by baqa, abiding. Even those who read it as union keep a state that the Sufi comes back from.
      - text: 'The same words in two traditions guarantee the same experience.'
        correct: true
        feedback: |
          A mistake. Words are shaped by doctrine ("self", "union", "emptiness"), and Katz's point is that so may be the experience.
      - text: 'Some features, such as ineffability, are reported in all five traditions.'
        feedback: |
          Not a mistake: it is an observation about reports. What it shows is the open question.
    explanation: |
      The slip behind the first three is the same: letting a shared word stand for a shared thing.

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Which of these sentences is a layer-3 claim (a faith or metaphysical commitment), as opposed to established fact or a live scholarly debate?
    options:
      - text: 'Mystics in these five traditions report that the ordinary sense of a separate self is changed.'
        feedback: |
          Layer 1: an established fact about what people report.
      - text: 'These reports describe one common experience, shaped afterwards by each tradition''s vocabulary.'
        feedback: |
          Layer 2: a live scholarly debate. Katz and the perennialists disagree, and each side has findings that would trouble it.
      - text: 'In these experiences the person is in contact with the ultimate reality, however it is named.'
        correct: true
        feedback: |
          Layer 3: it asserts a real object and that the person reaches it. A believer may hold it, a skeptic may read the reports as brain states, and neither the reports nor the comparison settle it.
    explanation: |
      Ask of each sentence what it would take to show it: a survey, an argument about experience and concepts, or a commitment about what exists.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** A believer in one tradition may read other mystics as pointing, imperfectly, to the same ultimate reality, or may hold that only their own tradition describes it truly. A skeptic may read all of them as remarkable states of the brain described in inherited words. A scholar of religion asks what the texts say and how training shapes the report. The data stop at a thin shared core and a thick set of differences; what the core means is where commitments begin.

      **Next:** The Perennial Philosophy and Its Critics. The idea that one core lies under all religions has a history and a name, and it has strong critics, Katz among them. Who proposed it, what exactly does it claim, and how does it stand up?
