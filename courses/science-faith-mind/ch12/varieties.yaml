id: ch12-varieties
title: "The Varieties of Religious Experience"
kind: concept
own: |
  The setting: a person reports a religious experience (a conversion, a sense that someone is present, a mystical state), and the question is how to describe it and how to judge it. The reference case is William James's *The Varieties of Religious Experience* (1902), which collects first-person reports and sorts them.
  - **Roots and fruits.** According to James, what caused an experience (its roots, say in the body) and what it is worth (its fruits) are two questions, and a physical cause does not settle the second, since every state has one. He offers three tests of a religious opinion: {{ immediate luminousness, philosophical reasonableness and moral helpfulness }}.
  - **Sense of presence.** According to James, many people report a felt presence (a person, a spirit, God) that no ordinary sense delivers, yet is vivid as perception. The report is the same whether it tracks something real or is produced inside the mind, so the feeling alone does not decide between the two readings.
  - **Conversion.** According to James, conversion is the process by which a divided self becomes unified, happy and consciously right. Following Starbuck he distinguishes the {{ **volitional type** (built up piece by piece by effort) and the **type by self-surrender** (the will is given up) }}. To compare a reported age window with chance, divide what is observed by what an even spread would give:
  {{ $$R=\frac{\text{observed in the window}}{\text{expected if spread evenly}}$$ }}
  where $R=1$ means no concentration. Starbuck's age pattern fits adolescent growth, and the same pattern does not tell whether the process is only natural.
  - **Mystical states.** According to James, a state is mystical if it has {{ **ineffability** (it defies expression) and **noetic quality** (it seems to give knowledge) }}; transiency (it fades, in an hour or two at most) and passivity (the will seems in abeyance) usually accompany it.
  - **Authority.** According to James, such states are usually authoritative for those who have them; they give others no duty to accept them, yet they do break the claim that only ordinary, rational consciousness counts.
  - **Three layers.** That such experiences occur and change lives is established; whether they point to something beyond the person is a live debate that rests on what is assumed about minds; that they do is a commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: a vision, and what it is worth"
    prompt: |
      Guessing is the point; no theory yet. A woman says that one night, in great distress, she felt with complete certainty that someone loving was in the room with her, and that afterwards she lived more patiently and kindly for years. A doctor says the episode fits a stress reaction. What is the best first move in thinking about her experience?
    options:
      - text: 'Her certainty shows the presence was real, so the doctor must be wrong.'
        feedback: |
          Certainty is part of the report, and people feel certain about things that turn out false too. The strength of a feeling cannot by itself say what caused it.
      - text: 'The doctor is right, so the experience is worthless.'
        feedback: |
          Even if the stress explanation is entirely right, it says what produced the episode, not what the episode did or whether it is good. Those are different questions.
      - text: 'Treat two questions separately: what caused the experience, and what it is worth (what it leads to, how it fits with other things we know).'
        correct: true
        feedback: |
          Yes. This split is the heart of the lesson. It lets the believer and the doctor both be taken seriously, because each answers a different question.
    explanation: |
      The lesson follows William James, who asked these two questions apart and then sorted the kinds of experience people report. Where thoughtful people part ways is on how much the first question matters for the second.

  - type: text
    id: james
    title: "James and his catalogue"
    image:
      src: img/james.webp
      alt: "Portrait photograph of the philosopher William James, around 1907"
      caption: "William James (1842-1910) in a photograph of about 1907 by Alice Boughton; his Edinburgh lectures were published in 1902."
      credit: "Alice Boughton, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:William_James_by_Alice_M._Boughton,_c._1907,_platinum_print,_from_the_National_Portrait_Gallery_-_NPG-NPG_87_37James-000001_(cropped).jpg"
    body: |
      William James (1842-1910) was an American psychologist and philosopher who taught at Harvard. In 1901-1902 he gave the Gifford Lectures on natural religion at Edinburgh, twenty lectures published in 1902 as *The Varieties of Religious Experience: A Study in Human Nature*. Britannica calls it his most famous work.

      His method was to collect first-person reports (letters, diaries, autobiographies, questionnaires) and to read them as data about human nature, without asking the reader to share any one creed. He chose the more vivid cases, written by articulate people, on the grounds that the extreme form shows what the feature is. According to James, the subject is the religious feelings and impulses of individuals, not church organisation or doctrine.

      He met at once a view he called **medical materialism**: the idea that a religious state is explained away once it is traced to a bodily cause (a nervous disorder, a digestive upset). According to James, this proves too much, since every state of mind, the scientist's included, has bodily conditions, and he proposed to judge religious opinions by what they do and how they hold together, not by their roots.

  - type: mcq
    id: roots
    title: "Roots and fruits"
    prompt: |
      A critic argues: "That prophet's visions began during a fever, so nothing he taught can be worth anything." Which reply fits James's reasoning best?
    options:
      - text: 'A fever cannot cause any vision, so the critic is wrong about the cause.'
        feedback: |
          This denies the physical fact, which is not James's move. He grants that states have bodily conditions and asks what follows from that.
      - text: 'The cause of an experience does not by itself decide the value of what comes from it; teachings should be tested by their fruits and their coherence, since every mental state has some physical basis.'
        correct: true
        feedback: |
          Yes. According to James, "by their fruits ye shall know them, not by their roots". The same argument applies to a mathematician's insight, which also arrives through a brain in some state.
      - text: 'Any teaching that helps people is true, whatever caused it.'
        feedback: |
          James does not say that. Helpfulness is one of three tests, and it sits beside coherence with the rest of what we know and the inner force of the experience.
    explanation: |
      Notice that the reasoning cuts both ways. A divine cause claimed for a vision would not by itself prove the teaching good either, since that would also be a claim about roots. A critic of James replies that causes do matter: if a state is known to be produced by something that makes it unreliable, its content deserves less trust.

  - type: text
    id: criteria
    title: "Three tests of a religious opinion"
    body: |
      According to James, **immediate luminousness, philosophical reasonableness and moral helpfulness** are the only available criteria for judging a religious opinion. Put in plain words:

      **Immediate luminousness** is the inner force of an idea for the person: it feels clear and convincing in itself. **Philosophical reasonableness** is whether it fits with the rest of what the person knows and can be argued for. **Moral helpfulness** is whether living by it makes a person and their relations better.

      Each can be applied by a believer or a skeptic. Each can also fail: luminousness is shared by delusions, reasonableness depends on what you already believe, and helpfulness depends on who decides what is good.

  - type: mcq
    id: criteria-q
    title: "Which test?"
    prompt: |
      Three comments on the same claim, "a loving presence cares for me". (a) "It felt clearer than anything I have ever known." (b) "It fits what I know of the world and what my tradition teaches." (c) "Since I took it seriously I have been more patient with my children." Which is the correct match to James's three tests?
    options:
      - text: '(a) luminousness, (b) reasonableness, (c) helpfulness.'
        correct: true
        feedback: |
          Yes. (a) is the inner force of the idea, (b) is its fit with other beliefs and arguments, (c) is its effect on conduct.
      - text: '(a) helpfulness, (b) luminousness, (c) reasonableness.'
        feedback: |
          Helpfulness is about what living by the idea does, which is (c). Luminousness is about how the idea feels from inside, which is (a).
      - text: '(a) reasonableness, (b) helpfulness, (c) luminousness.'
        feedback: |
          Reasonableness is a matter of argument and fit with other beliefs, which is (b). A feeling of clarity is not an argument.
    explanation: |
      Each test can pass while another fails, and the lesson uses that to ask, case by case, which tests a reported experience really passes.

  - type: text
    id: presence
    title: "The sense of presence"
    body: |
      In the lecture called *The Reality of the Unseen*, James describes a very common report, the **sense of presence**: a felt nearness of someone or something that no sense delivers, yet that is as vivid as perception. According to James, it behaves more like a sense than like a thought. A scientist friend wrote to him that he had several times felt "the so-called consciousness of a presence", and that he "did not recognize it by any ordinary sense". A clergyman, in a case from Starbuck's collection, wrote that "the darkness held a presence that was all the more felt because it was not seen."

      According to James, the feeling is there before any reasoning and does not need an argument; it is a form of conviction that behaves like a sense. The believer reads it as perception of something real (a person, a spirit, God). The skeptic reads it as something the mind can generate, and notes that it also appears in grief, fear, solitude and exhaustion.

  - type: mcq
    id: presence-q
    title: "What a felt presence can show"
    prompt: |
      A sleepless traveller on a lonely road senses someone walking beside them, with no sight or sound. A believer says this shows a real companion. A skeptic says the mind can produce such a feeling. What is the strongest conclusion that the report alone supports?
    options:
      - text: 'That a real companion was present, since feelings of presence are always accurate.'
        feedback: |
          Feelings of presence are not always accurate: the same vividness is reported by people who later find nobody was there. A feeling that can be wrong in some cases cannot guarantee the others.
      - text: 'That nothing happened, because only senses can detect something outside us.'
        feedback: |
          This assumes the conclusion. Something happened, namely the experience, and the question is what produced it. Even the skeptic accepts the experience as real.
      - text: 'That the traveller had a vivid, real experience, and the report is the same under both readings, so more is needed (the circumstances, other witnesses, what the traveller later learned) to decide between them.'
        correct: true
        feedback: |
          Yes. The experience is data. Which reading is better depends on additional tests and on prior commitments about what minds can do.
    explanation: |
      This is the problem of two readings that predict the same report. It returns in the lesson on mystical states.

  - type: text
    id: conversion
    title: "Conversion: a divided self made one"
    body: |
      According to James, to be **converted**, to be regenerated, to receive grace, to experience religion, to gain an assurance, are phrases for the process by which a self hitherto divided, conscious of being wrong, inferior and unhappy, becomes unified and consciously right, superior and happy, in consequence of its firmer hold on religious realities. The process may be gradual or sudden.

      He follows the American psychologist Edwin Starbuck (*The Psychology of Religion*, 1899), who from questionnaires distinguished two types. In the **volitional type**, the change is built up piece by piece, through a conscious effort at new habits. In the type **by self-surrender**, the person gives up the effort and the will, and the change comes as if from outside. According to James, self-surrender is nearly always needed at the final step.

      A well-known case in the lecture is that of Stephen Bradley, who in 1829 came to believe he had been converted at fourteen, after seeing the Saviour in his room for about one second. Another is that of Alphonse Ratisbonne, a French Jew who, according to the account James cites, became a Catholic at Rome in 1842 and later a priest. The religious tradition reads such cases as the action of grace; psychologists read them as the working of the unconscious mind, which James calls the subliminal region, a term of F. W. H. Myers.

  - type: mcq
    id: conversion-q
    title: "Two types"
    prompt: |
      According to Starbuck, a conversion can be of the volitional type or of the type by self-surrender. Ana tries for a year to rebuild her life, step by step, with new habits and daily practice, and by the end feels she has become a different person. Ben struggles for months, collapses in exhaustion, stops trying, and in that moment feels a sudden peace. Which is correct?
    options:
      - text: 'Ana is volitional and Ben is self-surrender.'
        correct: true
        feedback: |
          Yes. Ana's change is built up by effort, piece by piece. Ben's comes when the will is given up. James notes that even in volitional cases self-surrender is usually needed at the final stage.
      - text: 'Ana is self-surrender and Ben is volitional.'
        feedback: |
          The names refer to how the change comes: by effort (Ana) or through giving the effort up (Ben). Ben struggled, but the change came when he stopped.
      - text: 'Both are self-surrender, because every conversion is a sudden event.'
        feedback: |
          James includes gradual conversions in the definition. Starbuck's volitional type is gradual, built piece by piece.
    explanation: |
      Neither type says what the cause is. A believer reads self-surrender as opening to grace, a psychologist as the end of an inner conflict. The classification describes what the person lives through.

  - type: text
    id: starbuck
    title: "When do conversions happen?"
    body: |
      Starbuck's data showed that conversions of the evangelical youth he studied clustered in adolescence, roughly between fourteen and seventeen. According to James, conversion is in its essence a normal adolescent phenomenon, tied to the move from childhood to a more self-aware life. Starbuck also found that the later fluctuation in feeling was common, a "backsliding of some sort in nearly all the cases", and James argued that this did not cancel the experience, because it shows what the high-water mark of a person's spiritual capacity is.

      To test a concentration against chance we compare the observed count to the count expected if conversions were spread evenly over the ages studied:

      $$R=\frac{\text{observed in the window}}{\text{expected if spread evenly}}$$

      where $R=1$ means no concentration. (The numbers in the practice question below are invented, not Starbuck's.)

  - type: numeric
    id: ratio
    title: "How concentrated?"
    prompt: |
      In an invented sample of 200 reported conversions, ages run from 10 to 49 (40 years). Of the 200, 130 happened between ages 14 and 17 inclusive, a window of 4 years. If conversions were spread evenly across the 40 years, the expected number in a 4-year window is $200\times 4/40=20$. What is $R=\text{observed}/\text{expected}$ for the window?
    answer: 6.5
    tolerance: 0.01
    hint: Divide the observed 130 by the expected 20.
    explanation: |
      $R=130/20=6.5$. A concentration of more than six times what an even spread gives is far from chance. It does not say why: adolescence is a time of identity change (James's reading), and it is also a time when many traditions invite the commitment (a social reading). A religious reader may add that openness is greatest then. The ratio shows the pattern is real and leaves its meaning open.

  - type: mcq
    id: starbuck-q
    title: "What does the age pattern show?"
    prompt: |
      Conversions cluster in adolescence. Which conclusion does the pattern alone support?
    options:
      - text: 'Conversion is nothing but a stage of growth, so it cannot be a real contact with God.'
        feedback: |
          This slides from "it follows a natural pattern" to "it is only natural". A believer can say that grace works through natural development, just as a natural process can carry out a divine plan. The pattern cannot decide that.
      - text: 'Conversion shows adolescent crisis is the cause of belief, and religious teaching plays no part.'
        feedback: |
          The data say nothing about a single cause. Age, family, community and teaching all vary together with adolescence.
      - text: 'The experience is tied to a stage of life, which fits the natural reading, but whether anything more is at work is not settled by the age distribution.'
        correct: true
        feedback: |
          Yes. A pattern with a natural account does not exclude a further reading, and does not support it either.
    explanation: |
      Again two readings share one set of observations, the same structure as the sense of presence. The way out is to ask what each reading predicts that the other does not.

  - type: text
    id: mystical
    title: "Mystical states and their four marks"
    body: |
      The longest part of James's catalogue is on mysticism (Lectures XVI and XVII). According to James, a state is **mystical** when it has two characters, and usually shows two more:

      **Ineffability.** The state defies expression and no adequate report of its contents can be given in words. In this it is more like a feeling than like an intellectual state.

      **Noetic quality.** Though like a feeling, the state seems to those who live it to be also a state of knowledge: "states of insight into depths of truth unplumbed by the discursive intellect". (*Noetic* comes from the Greek *nous*, mind.)

      **Transiency.** Such states cannot be sustained for long; half an hour, or at most an hour or two, is the limit.

      **Passivity.** The mystic feels as if his own will were in abeyance, and sometimes as if held by a superior power, even if the state was prepared by meditation or other practice.

      According to James, the first two characters will entitle any state to be called mystical; the last two are less sharply marked but are usually found. He also reports that his own experiments with nitrous oxide showed him that our normal waking consciousness is but one special type of consciousness.

  - type: mcq
    id: marks-q
    title: "Which marks?"
    prompt: |
      A man says of a one-hour sense of unity during a walk: "I cannot describe it, though I tried for days; and I was certain I understood something about life that I had never seen before. It happened to me; I did nothing. It faded within the hour." According to James, which marks are the necessary pair that make the state mystical?
    options:
      - text: 'Transiency and passivity.'
        feedback: |
          These two usually accompany mystical states, but according to James they are less sharply marked and not what entitle a state to the name. Many transient, passive states (a faint, a sneeze) are not mystical.
      - text: 'Ineffability and noetic quality.'
        correct: true
        feedback: |
          Yes. "I cannot describe it" is ineffability; "I understood something I had never seen before" is the sense of knowledge. The hour-long fading is transiency and "it happened to me" is passivity: present, but not the defining pair.
      - text: 'Ineffability and transiency.'
        feedback: |
          Ineffability is one of the pair, but the second is noetic quality, the sense that the state is knowledge. Without it a state could be a mere mood.
    explanation: |
      James's list is a description of how such states are reported, not a test of whether what they report is true. That second question is the one about authority.

  - type: text
    id: authority
    title: "How much authority has a mystical state?"
    body: |
      James draws three conclusions at the end of Lecture XVII. According to him, (1) mystical states of a well-pronounced sort are usually authoritative over those who have them: for the person, the experience is not just an opinion. (2) Non-mystics are under no obligation to acknowledge in them a superior authority, since they can be rejected by those outside as simply an insight of a feeling mind. (3) Yet the existence of mystical states overthrows the pretension of non-mystical states, of ordinary rational consciousness, to be the sole and ultimate dictator of what we may believe.

      So James neither tells the skeptic to give in nor lets the skeptic dismiss the experience as meaningless. A critic of James replies that point (3) is too generous, because other altered states (a fever, a drug) also feel like insight and are rarely trusted.

  - type: mcq
    id: authority-q
    title: "Your friend's experience"
    prompt: |
      A friend had an hour-long mystical experience and says: "You must accept that what I learned is true, since you have not had it yourself and cannot judge." According to James, what is the fair response?
    options:
      - text: 'Accept it completely, since the experience is knowledge.'
        feedback: |
          According to James, the state is authoritative over the person who has it, not over others, who are under no obligation to accept it.
      - text: 'Reject it, since an experience that others cannot test says nothing.'
        feedback: |
          According to James, outsiders need not accept it, but its existence does count against the claim that ordinary consciousness alone decides what is credible. Dismissing it entirely goes further than James.
      - text: 'You can honour that the experience is authoritative for your friend, without being obliged to accept its content, and still ask how it fits with other evidence.'
        correct: true
        feedback: |
          Yes. This is the position of respect without obligation, and it applies in both directions: a skeptic's certainty is not binding on the friend either.
    explanation: |
      A believer replies that the friend's experience is evidence for others to weigh; a skeptic adds that reports of opposed contents (different gods, no god) show the experiences do not agree. Both replies are the subject of the next lessons.

  - type: order
    id: method
    title: "James's method, in order"
    prompt: |
      Put the steps of the reasoning James recommends for a reported religious experience in a sensible order.
    steps:
      - 'Collect the first-person report and take the experience itself as real data.'
      - 'Describe its kind (conversion, presence, mystical) and its marks.'
      - 'Note its possible bodily or psychological causes, without treating the cause as the verdict.'
      - 'Judge the opinion it supports by its luminousness, its reasonableness and its fruits for conduct.'
    hint: Describe before explaining, and explain before judging.
    explanation: |
      The order matters: judging before describing mixes the report with the judge's prior view, and treating the cause as the verdict skips the third and fourth steps.

  - type: mcq
    id: fruits
    title: "The fruits test, and its limit"
    prompt: |
      A critic of the fruits test says: "A belief can make a person kinder and still be false. Helpfulness does not show truth." Which reply best defends James?
    options:
      - text: 'There is no difference between a belief being useful and being true.'
        feedback: |
          This would make the test trivial, and it is a thesis James's critics often attribute to him but he does not state in the lectures in this form. A defender can say more modestly what follows.
      - text: 'Fruits are one test among three, together with luminousness and reasonableness, and James used them to judge the worth of a religious opinion for life; they are not a proof of any metaphysical claim.'
        correct: true
        feedback: |
          Yes. The test says which opinions to take seriously as ways of living. The critic is right that it does not prove that a presence exists, and James's own conclusions are guarded.
      - text: 'A belief that harms someone can still be true, so only harmful beliefs can be false.'
        feedback: |
          This reverses the logic. The critic's point is that fruits and truth can come apart in either direction, so fruits cannot settle truth by themselves.
    explanation: |
      A second objection is about who decides what counts as good fruit: a tradition's saint can look excessive to an outsider. So the test borrows a standard of value that is itself disputed.

  - type: mcq
    id: layers-final
    title: "Sorting claims"
    prompt: |
      Sort three claims. (a) Many people, in many cultures, report a felt presence, a conversion or a mystical state, and these reports often change their lives. (b) These experiences are best explained as brain states with no object beyond the person. (c) These experiences are best explained as perception of a reality beyond the person. Which sorting fits the three layers?
    options:
      - text: '(a) established fact, (b) and (c) each a live debate that rests on a commitment about minds.'
        correct: true
        feedback: |
          Yes. (a) is a matter of reports and records, even if their interpretation is open. (b) and (c) are rival readings of the same reports, and each depends on a view of what minds and the world can contain.
      - text: '(a) live debate, (b) established fact, (c) commitment.'
        feedback: |
          That experiences are reported and change lives is not in dispute. And (b), though respectable, is also a reading and not a settled result.
      - text: '(a) commitment, (b) established fact, (c) live debate.'
        feedback: |
          (a) is a plain matter of record, and the claim in (b) is not established by the reports, which fit both (b) and (c).
    explanation: |
      Note that (b) and (c) are not equal in how they are held by all scholars; the point is that neither follows from the reports alone.

  - type: text
    id: summary
    body: |
      **Next:** The Numinous and Awe. James sorted religious experience by its kinds and its fruits. Rudolf Otto asked a different question: what is the *quality* of the experience of the holy, and is it a feeling of the sacred that is neither fear nor wonder alone? We meet his idea of the numinous, then look at awe in secular settings (a mountain, the night sky, a birth), and at what it means to speak of the sacred.
