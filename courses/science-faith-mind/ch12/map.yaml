id: ch12-map
title: "Content Map: Religious Experience"
kind: map
name: Level 12, Religious Experience (the marks of mystical states, tests of an experience, the numinous, mystical traditions, common core and constructivism, pure consciousness events, the argument from credulity and its defeaters, the odds form of Bayes' rule, the brain and religious experience, transformation, the three layers)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 12 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a mark swapped for another, the wrong aspect of the numinous, a tradition's word given the wrong meaning, a likelihood ratio read the wrong way, a layer mislabelled), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: marks
    title: Marks of mystical states
    row: 1
    col: 2
    body: |
      According to William James (1902), a state is **mystical** when it has two defining marks, **ineffability** (it defies adequate report in words) and **noetic quality** (it feels like knowledge, insight into depths of truth). Two further marks are **usual** but not required: **transiency** (it rarely lasts more than an hour or two) and **passivity** (the person feels held by a power not their own).
    decoys:
      - body: |
          According to William James (1902), a state is **mystical** when it has two defining marks, **transiency** (it rarely lasts more than an hour or two) and **passivity** (the person feels held by a power not their own). Two further marks are **usual** but not required: **ineffability** (it defies adequate report in words) and **noetic quality** (it feels like knowledge).
        feedback: |
          The marks are swapped. For James, ineffability and noetic quality are the ones that entitle a state to the name; transiency and passivity usually accompany it but are not needed.
      - body: |
          According to William James (1902), a state is **mystical** when it has all four marks, and an experience that lasts a whole day, or in which the person feels in control, is **not mystical** whatever else it feels like: **ineffability**, **noetic quality**, **transiency** and **passivity** are all required.
        feedback: |
          James calls two of the marks usual, not required. A long state or an active one can still be mystical if it has ineffability and noetic quality; making all four necessary turns a description into a test.

    explanation: |
      The root of the level: before asking what an experience shows, say what makes it the kind of experience in question.

  - id: tests
    title: Tests of an experience
    row: 1
    col: 1
    body: |
      According to James, the origin of an experience (a tired body, a drug, a temperament) does not settle its worth: that mistake is **medical materialism**. Judge it by its **fruits**, not its **roots**, with three tests: **immediate luminousness**, **philosophical reasonableness** and **moral helpfulness**. He concludes that the experience is authoritative for the person who has it, but gives no binding authority to others.
    decoys:
      - body: |
          According to James, the origin of an experience (a tired body, a drug, a temperament) settles its worth: its **roots** decide, and the **fruits** are only a side effect. The tests are **immediate luminousness**, **philosophical reasonableness** and **moral helpfulness**, and a good result gives binding authority to everyone.
        feedback: |
          James reverses this. Roots do not decide worth (he calls the opposite mistake medical materialism), fruits are the test, and the experience is authoritative for the one who has it, not binding on others.
      - body: |
          According to James, the origin of an experience (a tired body, a drug, a temperament) does not settle its worth: judge it by its **fruits**, not its **roots**. The only test is **moral helpfulness**: if the person's life is better, the experience is **true**, and a good result gives binding authority to everyone.
        feedback: |
          James names three tests, and a good life shows the experience was useful, not that its content is true. He also denies that the result binds others.
    explanation: |
      The first answer to the level's question, and the sentence the later lessons keep returning to when a brain explanation or a life change is offered.

  - id: numinous
    title: The numinous
    row: 1
    col: 3
    body: |
      According to Rudolf Otto (1917), the **numinous** is a non-rational feeling with its own character, made of **mysterium** (the *wholly other*, what is beyond the familiar), **tremendum** (awefulness, overpowering majesty and urgent energy) and **fascinans** (an attraction that allures with potent charm). The **creature-feeling** is the sense of being small before it.
    decoys:
      - body: |
          According to Rudolf Otto (1917), the **numinous** is a non-rational feeling with its own character, made of **mysterium** (the *wholly other*, what is beyond the familiar), **tremendum** (an attraction that allures with potent charm) and **fascinans** (awefulness, overpowering majesty and urgent energy). The **creature-feeling** is the sense of being small before it.
        feedback: |
          Tremendum and fascinans are swapped. Tremendum is the shuddering side (awefulness, majesty, energy), fascinans the drawing side: the numinous both repels and attracts.
      - body: |
          According to Rudolf Otto (1917), the **numinous** is a feeling of **moral duty** that reason can fully explain, made of **mysterium** (what is familiar and ordinary), **tremendum** and **fascinans**. The **creature-feeling** is the sense of being in control of it.
        feedback: |
          For Otto the numinous is non-rational and irreducible to morality or reason, and mysterium means the wholly other, not the familiar. The creature-feeling is smallness before it, not control.
    explanation: |
      Where James describes marks any state can be checked for, Otto names the quality of the feeling itself.

  - id: traditions
    title: Mystical traditions
    row: 2
    col: 2
    body: |
      Traditions give their own words. In Sufism, *fana* is "passing away" (the fading of awareness of anything but God) and *baqa* is abiding in God afterwards; in Kabbalah, *devekut* is "cleaving" to God; in Teresa of Avila's *Interior Castle* (1577) the soul moves through mansions, and the seventh is the **spiritual marriage**, lasting where earlier union passes quickly. These are the traditions' own accounts, read in more than one way.
    decoys:
      - body: |
          Traditions give their own words. In Sufism, *baqa* is "passing away" (the fading of awareness of anything but God) and *fana* is abiding in God afterwards; in Kabbalah, *devekut* is "cleaving" to God; in Teresa of Avila's *Interior Castle* (1577) the soul moves through mansions, and the seventh is the **spiritual marriage**, lasting where earlier union passes quickly.
        feedback: |
          The two Sufi terms are swapped. Fana is the passing away, baqa the subsistence that follows.
      - body: |
          Traditions give their own words. In Sufism, *fana* is "passing away" (the fading of awareness of anything but God) and *baqa* is abiding in God afterwards; in Kabbalah, *devekut* is "cleaving" to God; in Teresa of Avila's *Interior Castle* (1577) the first mansion is the **spiritual marriage**, and union fades by the seventh. These are the traditions' own accounts, and all agree on a single reading.
        feedback: |
          In Teresa's castle the spiritual marriage is the seventh and last mansion, where union lasts. And the traditions are read in more than one way: Sufis themselves read fana as union or as a modest loss of the self's own agency.
    explanation: |
      The raw material of the debate that follows: each tradition describes the experience in its own vocabulary.

  - id: core
    title: A common core
    row: 2
    col: 1
    body: |
      According to Walter Stace (1960) and Aldous Huxley (1945), mystics of different traditions report the **same experience** under different interpretations:
      $$\text{report}_i=\text{core}+\text{interpretation}_i$$
      The **common core** is what the reports share, a feature set that is the **intersection** $T_1\cap\dots\cap T_5$ of the traditions' sets. Stace separates **extrovertive** (unity seen through the senses) from **introvertive** (pure consciousness with no content) experience.
    decoys:
      - body: |
          According to Walter Stace (1960) and Aldous Huxley (1945), mystics of different traditions report the **same experience** under different interpretations:
          $$\text{report}_i=\text{core}+\text{interpretation}_i$$
          The **common core** is every feature any tradition reports, a feature set that is the **union** $T_1\cup\dots\cup T_5$ of the traditions' sets. Stace separates **extrovertive** (unity seen through the senses) from **introvertive** (pure consciousness with no content) experience.
        feedback: |
          The core is what all the reports share, an intersection. The union collects everything any tradition says, including what only one adds, which is the interpretation.
      - body: |
          According to Walter Stace (1960) and Aldous Huxley (1945), mystics of different traditions report **different experiences**, and the interpretation is the whole report:
          $$\text{report}_i=\text{interpretation}_i$$
          The **common core** is what the reports share, a feature set that is the **intersection** $T_1\cap\dots\cap T_5$ of the traditions' sets.
        feedback: |
          That is closer to the constructivist view. The common-core view keeps a shared part under the interpretations: report equals core plus interpretation.
    explanation: |
      The first side of the debate: if the traditions differ in words but not in experience, the experience may point to one reality.

  - id: construct
    title: Constructivism
    row: 2
    col: 3
    body: |
      According to Steven Katz (1978), there is **no unmediated experience**: the concepts a person brings shape the experience itself, so
      $$S_i\neq S_j\ \Rightarrow\ \text{experiences differ}$$
      where $S_i$ and $S_j$ are the tradition-shaped backgrounds of two mystics. A shared word then hides different events. Stace is one of his main targets. Proudfoot (1985) adds that an event is an *experience* only once it is conceptualised.
    decoys:
      - body: |
          According to Steven Katz (1978), there is **no unmediated experience**: the concepts a person brings shape only the report, never the experience, so
          $$S_i\neq S_j\ \Rightarrow\ \text{same experience}$$
          where $S_i$ and $S_j$ are the tradition-shaped backgrounds of two mystics. A shared word then names the same event. Stace is one of his main targets.
        feedback: |
          Katz argues the opposite: different backgrounds give different experiences, not only different reports. That is exactly what he uses against a shared core.
      - body: |
          According to Steven Katz (1978), mystical experience is **unmediated** and every mystic in every tradition reaches the same state, so
          $$S_i\neq S_j\ \Rightarrow\ \text{experiences differ}$$
          where $S_i$ and $S_j$ are the tradition-shaped backgrounds of two mystics. Stace is one of his allies.
        feedback: |
          This is the view Katz attacks. For him no experience is unmediated, and Stace, with his core, is a main target, not an ally.
    explanation: |
      The rival reading of the same reports: the two views predict that the traditions' words match, and they differ on what lies under them.

  - id: pce
    title: Pure consciousness events
    row: 3
    col: 3
    body: |
      According to Robert Forman (1990), a **pure consciousness event** (PCE) is a **wakeful** state with **no object and no content**, reported in several traditions. With no content, he argues, there is nothing for concepts to shape, so at least this event is not constructed. A constructivist replies that the **report** is made afterwards, with concepts.
    decoys:
      - body: |
          According to Robert Forman (1990), a **pure consciousness event** (PCE) is a **sleeping** state with **no object and no content**, reported in several traditions. With no content, he argues, there is nothing for concepts to shape, so at least this event is not constructed. A constructivist replies that the **report** is made afterwards, with concepts.
        feedback: |
          A PCE is wakeful, not sleep: awareness remains, with nothing in it. That is what makes it a challenge to the claim that concepts shape every experience.
      - body: |
          According to Robert Forman (1990), a **pure consciousness event** (PCE) is a **wakeful** state of **vivid imagery**, reported in several traditions. Its content is shaped by each tradition, so it supports Katz. A constructivist replies that the **report** is made afterwards, with concepts.
        feedback: |
          A PCE has no content at all, no imagery. Forman uses it against Katz: with no content, there is nothing for concepts to shape.
    explanation: |
      Forman answers Katz at the point where it is hardest to answer: an event with nothing in it for a concept to shape.

  - id: credulity
    title: Credulity and defeaters
    row: 3
    col: 1
    body: |
      According to Richard Swinburne, the **principle of credulity** says: if it seems to a subject that $x$ is present, then probably $x$ is present, **unless a defeater** applies. A **defeater** is a reason to doubt, such as unreliable conditions (alcohol, LSD), a kind of object whose reports are often false, or knowledge against it. A defeater pushes the likelihood ratio **toward 1**.
    decoys:
      - body: |
          According to Richard Swinburne, the **principle of credulity** says: if it seems to a subject that $x$ is present, then $x$ is present, **whatever else is known**. A **defeater** is a reason to doubt, such as unreliable conditions (alcohol, LSD) or knowledge against it. A defeater pushes the likelihood ratio **toward 1**.
        feedback: |
          The principle is defeasible: probably, and only if no defeater applies. If it held whatever else is known, a vision under LSD would count the same as sober sight.
      - body: |
          According to Richard Swinburne, the **principle of credulity** says: if it seems to a subject that $x$ is present, then probably $x$ is present, **unless a defeater** applies. A **defeater** is a reason to doubt, such as unreliable conditions (alcohol, LSD) or knowledge against it. A defeater pushes the likelihood ratio **away from 1**, toward a huge value.
        feedback: |
          A defeater makes the experience equally likely whether or not the object is there, so the ratio goes toward 1, where the evidence stops moving the odds.
    explanation: |
      Turns an experience into evidence, and shows how it can be cancelled; the odds form measures how much.

  - id: odds
    title: Prior and likelihood ratio
    row: 3
    col: 2
    body: |
      The **odds form** of Bayes' rule multiplies:
      $$\text{posterior odds}=\text{prior odds}\times\text{LR}$$
      where $\text{LR}=P(E\mid H)/P(E\mid\text{not }H)$. With prior $0.1$ (odds $1/9$) and $\text{LR}=20$ the posterior is $0.69$; with $\text{LR}=1.5$ it is $0.14$; with $\text{LR}=1$ it stays $0.1$. A weak prior needs a large LR to reach even odds.
    decoys:
      - body: |
          The **odds form** of Bayes' rule multiplies:
          $$\text{posterior odds}=\text{prior odds}\times\text{LR}$$
          where $\text{LR}=P(E\mid H)/P(E\mid\text{not }H)$. With prior $0.1$ (odds $1/9$) and $\text{LR}=20$ the posterior is $\mathbf{0.95}$, the experience being **strong enough to override** a weak prior.
        feedback: |
          Prior $0.1$ is odds $1/9$; times 20 gives odds $2.22$, a probability of $0.69$. The prior is not erased: 0.95 would need prior odds near 1.
      - body: |
          The **odds form** of Bayes' rule multiplies:
          $$\text{posterior odds}=\text{prior odds}\times\text{LR}$$
          where $\text{LR}=P(\text{not }E\mid H)/P(\text{not }E\mid\text{not }H)$. With prior $0.1$ (odds $1/9$) and $\text{LR}=1$ the posterior is $0.5$.
        feedback: |
          The ratio compares how likely the evidence $E$ itself is under each hypothesis, not the evidence being absent. And an LR of 1 leaves the odds unchanged: the posterior stays $0.1$.
    explanation: |
      Shared with the previous level: the same tool, now applied to the experience of a believer rather than to a claim of the extraordinary.

  - id: neuro
    title: The brain and religious experience
    row: 4
    col: 1
    body: |
      Persinger (1983) proposed that religious experience is an artifact of **temporal lobe** function; Granqvist and colleagues (2005) ran a **double-blind** test with 89 people (43 field, 46 sham) and found **no effect of the field**, only **suggestibility** predicting reports. Newberg's SPECT scans of meditators and nuns were **preliminary**. A brain explanation defeats the experience only if the **LR is 1**: that the brain is involved is expected either way.
    decoys:
      - body: |
          Persinger (1983) proposed that religious experience is an artifact of **temporal lobe** function; Granqvist and colleagues (2005) ran a **double-blind** test with 89 people (43 field, 46 sham) and found a **strong effect of the field**, while suggestibility did not matter. Newberg's SPECT scans of meditators and nuns **proved** the experience is only brain activity.
        feedback: |
          Granqvist's team found no effect of the field and suggestibility as the predictor. Newberg's scans were preliminary, and a brain correlate shows the brain is involved, not that nothing else is.
      - body: |
          Persinger (1983) proposed that religious experience is an artifact of **temporal lobe** function; Granqvist and colleagues (2005) ran a **double-blind** test with 89 people (43 field, 46 sham) and found **no effect of the field**, only **suggestibility** predicting reports. A brain explanation defeats the experience **whenever the brain is involved**.
        feedback: |
          The brain is involved in everything, so involvement has an LR near 1 and defeats nothing by itself. A defeat needs the brain story to be far more likely without the object than with it.
    explanation: |
      The commonest defeater offered, tested against the odds form: what matters is the likelihood ratio, not the presence of a brain correlate.

  - id: transform
    title: Transformation
    row: 4
    col: 3
    body: |
      In the Marsh Chapel experiment (Pahnke, 20 April 1962) 20 divinity students got psilocybin or niacin; Griffiths and colleagues (2008) gave 36 volunteers psilocybin or methylphenidate, and **58%** rated it among their top five most personally meaningful experiences at 14 months. A good outcome $G$ is **fruit**, but if $P(G\mid X)$ is only a little above $P(G\mid\text{not }X)$ the **LR is near 1** and the fruit proves little about its source.
    decoys:
      - body: |
          In the Marsh Chapel experiment (Pahnke, 20 April 1962) 20 divinity students got psilocybin or niacin; Griffiths and colleagues (2008) gave 36 volunteers psilocybin or methylphenidate, and **58%** rated it among their top five most personally meaningful experiences at 14 months. A good outcome $G$ is **fruit**, so it **proves** the experience came from God.
        feedback: |
          A good outcome shows the experience mattered, not where it came from. A drug-induced experience can give the same fruit, so the likelihood ratio is what decides how much it shows.
      - body: |
          In the Marsh Chapel experiment (Pahnke, 20 April 1962) 20 divinity students got psilocybin or niacin; Griffiths and colleagues (2008) gave 36 volunteers psilocybin or methylphenidate, and **58%** rated it among their top five most personally meaningful experiences at 14 months. A good outcome $G$ is **fruit**, but if $P(G\mid X)=0.8$ and $P(G\mid\text{not }X)=0.7$ the **LR is 8/7 = 1.14**, so the fruit **settles** the source.
        feedback: |
          An LR of 1.14 is near 1: from prior $0.5$ the posterior is only $0.53$. Fruits can matter greatly for a life while saying little about their cause.
    explanation: |
      The fruits test of James meets the odds form: the life change is real evidence of value, and weak evidence of origin.

  - id: layers
    title: The three layers
    row: 4
    col: 2
    body: |
      The course sorts every claim into three layers: **(1) established fact** (a reported study result, a date, a text); **(2) scholarly debate** (what the result means, common core or constructivism); **(3) faith or metaphysical commitment** (whether an experience reaches a divine Reality). A claim from layer 3 must never pass as layer 1, from a believer or a sceptic.
    decoys:
      - body: |
          The course sorts every claim into three layers: **(1) established fact** (a reported study result, whether an experience reaches a divine Reality); **(2) scholarly debate** (what the result means); **(3) faith or metaphysical commitment** (a date, a text). A claim from layer 3 must never pass as layer 1, from a believer or a sceptic.
        feedback: |
          Two items sit in the wrong layer. Whether an experience reaches a divine Reality is a metaphysical commitment, and a date or a text is established fact.
      - body: |
          The course sorts every claim into three layers: **(1) established fact** (a reported study result, a date, a text); **(2) scholarly debate** (what the result means, common core or constructivism); **(3) faith or metaphysical commitment** (whether an experience reaches a divine Reality). Only a **believer** can pass a layer 3 claim off as layer 1.
        feedback: |
          The slip runs both ways: a sceptic who says experience is nothing but the brain also states a layer 3 commitment as if it were fact.
    explanation: |
      The close of the level, as in every level: what is settled, what is argued, and what rests on commitment.

