outroTitle: Level 12 in one picture
outro: |
  According to James, a state is **mystical** by **ineffability** and **noetic quality** (transiency and passivity are usual), and it is judged by its **fruits** (luminousness, reasonableness, helpfulness) and not its **roots**. Otto's **numinous** joins **mysterium**, **tremendum** and **fascinans**. Traditions use their own words (*fana*, *devekut*, the seventh mansion of Teresa). Stace and Huxley read the reports as $\text{core}+\text{interpretation}_i$; Katz answers that $S_i\neq S_j$ means different experiences, and Forman replies with the **pure consciousness event**. Swinburne's **credulity** gives an experience evidential weight until a **defeater** pushes the likelihood ratio toward 1, and the odds form $\text{posterior odds}=\text{prior odds}\times\text{LR}$ measures what remains. A brain correlate defeats only if the LR is 1, and **transformation** is strong fruit but weak evidence of source. People part ways on the prior, on whether a core lies under the words, and on whether any experience reaches beyond the brain. The level challenge applies all of this to real accounts.
