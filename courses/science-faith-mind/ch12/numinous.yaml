id: ch12-numinous
title: "The Numinous and Awe"
kind: concept
own: |
  The setting: a person reports an experience of the holy (in a temple, on a mountain, in the night), and the question is what kind of experience it is and what it can show. The reference cases are Rudolf Otto's *Das Heilige* (1917; English *The Idea of the Holy*, 1923) and the psychology of awe after Keltner and Haidt (2003).
  - **The numinous.** According to Otto, religious experience has a core that is not a concept or an argument but a felt quality, which he named {{ **the numinous** (from Latin *numen*, a divine power) }}. He calls it non-rational (beyond reason, not against it), and holds it is sui generis, meaning it cannot be reduced to any other feeling and can only be evoked.
  - **Mysterium tremendum et fascinans.** According to Otto, the numinous is a mystery ({{ *mysterium*: the wholly other, beyond the sphere of the usual }}) that both repels and draws:
  {{ $$\text{numinous} = \text{tremendum} + \text{fascinans}$$ }}
  where *tremendum* is dread, with three sides (awefulness, *majestas* or overpoweringness, and energy or urgency), and *fascinans* is the pull toward it, which "allures with a potent charm".
  - **Creature-feeling.** According to Otto, the subjective side of the numinous is the feeling of being a creature, "dust and ashes" before what is overwhelming. He holds it differs from ordinary fear, and that it follows from meeting the numinous object, not the other way round.
  - **Two readings.** According to Otto and his defenders the numinous is a basic category that points to its own object. According to reductive critics it is a blend of familiar parts (fear plus wonder) that the mind interprets as sacred. The report is the same under both, so it cannot settle the question alone.
  - **Awe.** According to Keltner and Haidt, clear cases of awe have two core appraisals: {{ **perceived vastness** (something much larger than the self or its usual frame) and a **need for accommodation** (the experience does not fit existing mental structures) }}. Awe can appear with no religion, in nature, art, great ideas or great people, and studies link it with a smaller sense of self.
  - **What studies show.** That awe occurs, can be triggered and measured, and shapes how people feel is established; whether a religious report of the numinous is more than awe is a live debate; that it is the voice of the divine is a commitment. To count reports that show at least one of two features, add the two counts and subtract the overlap:
  {{ $$N(D \text{ or } F) = N_D + N_F - N_{DF}$$ }}
  where $N_D$ counts reports with dread, $N_F$ reports of being drawn, $N_{DF}$ reports with both.
cards:
  - type: mcq
    id: hook
    title: "Guess: a cliff edge at night"
    prompt: |
      Guessing is the point; no theory yet. A hiker stands alone at a cliff edge at night, under an enormous sky, and reports that she felt something she had no word for. She says it was not just fear (she was not in danger), and not just wonder (it was not pleasant like a view). Which description of her state seems most natural?
    options:
      - text: 'A clash: part of her wanted to step back and part wanted to stay and look, at the same moment.'
        correct: true
        feedback: |
          Yes, that is how many people describe such moments: a pull and a recoil together, with the sense of facing something much bigger than oneself. The lesson gives this a name and asks what it is.
      - text: 'Ordinary fear, because only danger makes the body react that strongly.'
        feedback: |
          She was not in danger, and she says the feeling was unlike fear. Fear is a good first guess, but it fails to account for the wish to stay.
      - text: 'Ordinary wonder, because a starry sky is simply beautiful.'
        feedback: |
          Beauty alone does not explain the recoil and the sense of being small that she reports. Wonder is part of the picture, not all of it.
    explanation: |
      The lesson follows Rudolf Otto, who thought such moments are a clue to what religious feeling is, and then the psychologists who study awe without assuming any religion.

  - type: text
    id: otto
    title: "Rudolf Otto and the holy"
    image:
      src: img/otto.webp
      alt: "Portrait photograph of the theologian Rudolf Otto"
      caption: "Rudolf Otto (1869-1937), a German Protestant theologian who held the chair of systematic theology at Marburg from 1917, the year his best-known book appeared."
      credit: "Contemporary photograph, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:RudolfOtto.jpg"
    body: |
      Rudolf Otto (1869-1937) was a German Lutheran theologian and historian of religion. In 1917 he published *Das Heilige* ("the holy"), translated into English in 1923 as *The Idea of the Holy*. It has never gone out of print and is among the most widely read twentieth-century books on religion.

      Otto's worry was that talk about God had become all concepts: God is good, powerful, wise. According to Otto, those are the rational side of the holy, and they leave out what a person feels in front of it. He wanted to describe that felt side, and he admitted from the start that it cannot be defined, only pointed to, by asking the reader to recall a moment when they felt it.

  - type: text
    id: numinous
    title: "The numinous: a non-rational category"
    body: |
      Otto needed a word for the holy with the moral and rational meanings taken out. He took the Latin *numen*, a divine power or presence, and made it **the numinous**. A *category* here is a basic kind of value or feeling, like beauty or the comic. A **non-rational** quality is one that is neither deduced from reasons nor against them: it is felt directly, and reasons come afterwards.

      According to Otto, the numinous is **sui generis** ("of its own kind"): it cannot be defined through other concepts and cannot be taught by a definition. A person can only be helped to have it, as one explains the taste of salt by pointing to salt. He adds that it is felt as having an object outside the self, not only as a mood inside.

  - type: mcq
    id: nonrational
    title: "Non-rational is not irrational"
    prompt: |
      Otto calls the numinous non-rational. Which reading of that word is closest to what he means?
    options:
      - text: 'It is absurd or contrary to reason, so it should be rejected by any careful thinker.'
        feedback: |
          That is "irrational". Otto deliberately avoids it: he says the holy has a rational side too (goodness, will, purpose), and the numinous sits beside that side without contradicting it.
      - text: 'It is a felt quality that is not reached by argument or definition, though reasons can later be given about it.'
        correct: true
        feedback: |
          Yes. A critic can still ask what, if anything, the feeling shows. Non-rational describes where the quality comes from, not whether it deserves to be trusted.
      - text: 'It is a mere emotion with nothing outside the person that it responds to.'
        feedback: |
          Otto says the opposite: the feeling is directed at an object felt as outside the self. Whether that object exists is the question left open, which a later card takes up.
    explanation: |
      Notice the two separate questions again, as in the lesson on James: what the quality is like, and what it is worth as evidence.

  - type: text
    id: mysterium
    title: "Mysterium tremendum et fascinans"
    body: |
      Otto's Latin formula for the numinous is ***mysterium tremendum et fascinans***: a mystery that is terrifying and fascinating. It has three parts.

      The ***mysterium*** is the **wholly other** (German *ganz Andere*): what lies quite beyond the sphere of the usual and familiar, so that it cannot be compared with anything known.

      The ***tremendum*** is the side that repels, a religious dread, which Otto splits into three. **Awefulness** is the sense of absolute unapproachability. ***Majestas*** (majesty) is overpoweringness, the feeling that one is nothing next to this might. **Energy**, or urgency, is the sense of a living force, seen above all in the language of wrath.

      The ***fascinans*** is the side that draws: according to Otto the numinous also allures with a potent charm, so one wants to approach what one also fears.

  - type: mcq
    id: classify
    title: "Which side is it?"
    prompt: |
      Three short reports, each stressing one side of Otto's formula. (a) "I wanted to leave the cave, and could not stop looking into the dark." (b) "It was not like anything I had met; there was nothing to compare it to." (c) "I felt like a speck, as if one breath of it could end me." Which is the best match with, in order, the sides of the formula that each one stresses most?
    options:
      - text: '(a) fascinans together with tremendum, (b) mysterium (wholly other), (c) majestas (overpoweringness).'
        correct: true
        feedback: |
          Yes. (a) holds both the recoil and the pull. (b) is incomparability, the wholly other. (c) is the feeling of being nothing before an overpowering might.
      - text: '(a) majestas, (b) fascinans, (c) mysterium.'
        feedback: |
          Majestas is about being overpowered, which is report (c). Report (a) is about wanting to leave and wanting to look, a mixed pull. Report (b) is incomparability, not attraction.
      - text: '(a) mysterium, (b) majestas, (c) fascinans.'
        feedback: |
          Report (c) speaks of being a speck before might, which is overpoweringness, not attraction. Report (b) is about having nothing to compare it to, which is the wholly other.
    explanation: |
      Real reports often mix the sides, which is why Otto speaks of one formula and not three separate feelings.

  - type: text
    id: creature
    title: "Creature-feeling"
    body: |
      The feeling that matches the tremendum in the person is what Otto calls **creature-feeling** (*Kreaturgefühl*). He describes it as the sense of one's own nothingness, of being only "dust and ashes" before what is overpowering. The phrase "dust and ashes" is the one Abraham uses before God in the book of Genesis, 18:27.

      The idea answers an older one. Friedrich Schleiermacher, a German theologian, had described the root of religion as a feeling of **absolute dependence**: one's existence rests on something beyond oneself. According to Otto, dependence is the wrong kind of feeling to put at the root. He holds that creature-feeling is a response that follows from meeting the numinous object, a sense of one's own insignificance before something overpowering, so the object comes first. Some scholars reply that Schleiermacher was closer to Otto than Otto allowed.

  - type: mcq
    id: creature-q
    title: "Fear or something else?"
    prompt: |
      A critic says: "Creature-feeling is just fear of a powerful being; a child feels it before a large dog." How would a defender of Otto answer?
    options:
      - text: 'It is fear, but fear of a higher intensity, so the difference is only one of degree.'
        feedback: |
          A defender who said this would concede the critic's point. Otto's claim is that the difference is one of kind, not of degree.
      - text: 'The child fears a danger that can be understood and avoided; the numinous overpowers without any danger being named, and brings dread together with attraction and a sense of the wholly other.'
        correct: true
        feedback: |
          Yes. According to Otto, ordinary fear is of a threat in the natural world, while the numinous dread is a different feeling, directed at the wholly other and mixed with fascination.
      - text: 'The feeling is not fear at all, so there is no fear involved in religion.'
        feedback: |
          Otto does not deny a dread in it, he names it tremendum. He denies that it is only the ordinary fear of a danger.
    explanation: |
      The critic has a reply: a mix of fear and fascination is known in ordinary life too (a storm, a horror film), so appeal to the mixture alone does not show a new kind of feeling. That is the next topic.

  - type: text
    id: readings
    title: "Two readings of the same report"
    body: |
      Take a report of the numinous: dread and attraction in front of something felt as wholly other. There are two ways to read it.

      **Reading 1 (Otto and his defenders).** The numinous is a category of its own, not built from other feelings. Like seeing red or hearing a note, it is a basic way something shows up, and it points to its own object. A defender can add that someone who denies it may simply not have had the experience, in the way a person who has never heard music misses something.

      **Reading 2 (reductive critics).** The numinous is fear plus wonder plus a sense of smallness, all familiar parts, put together by a mind that has been taught to call the result "sacred". Some scholars add that many reported religious experiences contain little dread at all, so Otto's picture may fit only some of them.

      Both readings accept that the experience occurs and that it is vivid. They differ on whether it is a new kind of feeling and on what it shows.

  - type: mcq
    id: readings-q
    title: "What would separate the readings?"
    prompt: |
      A defender of Reading 1 and a defender of Reading 2 both read the same report of dread and attraction before the wholly other. Which of the following would be the most useful test between them?
    options:
      - text: 'Asking the person how sure they feel; more certainty favours Reading 1.'
        feedback: |
          Certainty is part of the report and is equally present under both readings, so it cannot separate them.
      - text: 'Whether the feeling can be fully reproduced by known ingredients (a mix of fear, wonder and smallness) with nothing left over, and whether anyone can find what is left over.'
        correct: true
        feedback: |
          Yes. If the known parts fully reproduce the feeling, Reading 2 gains. If something stubborn remains that the parts do not capture, Reading 1 gains. Even then it only shows a distinct feeling, not that its object exists.
      - text: 'Whether the person is religious; only religious people can have the numinous.'
        feedback: |
          Many non-religious people report awe, and the question is about the nature of the feeling, so using belief as the test would assume the answer.
    explanation: |
      The test here decides between two readings of the feeling. A separate step is needed to move from "a distinct feeling" to "a real object that causes it", and that step is where the commitments of believers and skeptics differ.

  - type: text
    id: awe
    title: "Awe without religion"
    body: |
      Outside theology, psychologists study the same family of states under the name **awe**. In 2003 Dacher Keltner and Jonathan Haidt published "Approaching awe, a moral, spiritual, and aesthetic emotion" in the journal *Cognition and Emotion*, which proposed a working definition.

      According to Keltner and Haidt, clear cases of awe have two core appraisals (ways of reading a situation). The first is **perceived vastness**: something much larger than oneself or one's usual frame of reference. It can be physical, like a mountain range, or social, like great power or prestige. The second is a **need for accommodation**: the experience cannot be fitted into what one already understands, so one's mental structures must stretch or break. According to them, whether the effort succeeds may partly explain why awe can feel terrifying in one case and enlightening in another.

      Later studies have often found that awe goes with a feeling of a smaller self and a stronger link to other people.

  - type: mcq
    id: awe-q
    title: "Which situation is awe?"
    prompt: |
      Using only the two core appraisals of Keltner and Haidt (perceived vastness, and a need for accommodation), which situation fits awe best?
    options:
      - text: 'A mathematician reads a proof that connects fields she thought were unrelated, and finds she must rethink how she sees them.'
        correct: true
        feedback: |
          Yes. Vastness here is conceptual (a far larger structure than she had in mind), and she needs to reorganise her understanding. No religion is needed.
      - text: 'A person eats a good meal and feels content.'
        feedback: |
          Pleasant, but nothing is perceived as vast and nothing needs rethinking, so neither core appraisal is present.
      - text: 'A person sees a small, tidy garden and thinks it looks nice.'
        feedback: |
          Beauty alone is not awe by this definition: there is no vastness and no strain on understanding.
    explanation: |
      The definition is deliberately wide. It lets researchers compare awe at nature, music, great leaders and ideas, and it leaves open how the religious cases relate to the rest.

  - type: numeric
    id: count
    title: "Counting overlapping reports"
    prompt: |
      An invented toy sample, to practise counting, not a real study. A researcher reads 40 written reports of overwhelming moments. Of these, 12 mention dread, 30 mention feeling drawn toward the thing, and 8 mention both. A report counts as showing at least one of the two features if it mentions dread, or being drawn, or both. How many of the 40 reports show at least one?
    answer: 34
    hint: |
      The 8 reports with both are included in the 12 and also in the 30, so adding 12 and 30 counts them twice.
    wrong:
      - { value: 42, feedback: 'You added 12 and 30 and counted the 8 reports with both twice. They sit in both groups, so subtract them once.' }
      - { value: 8, feedback: 'That is only the reports with both features. The question asks for those with at least one.' }
      - { value: 26, feedback: 'You subtracted 8 twice, or removed the overlap from each group. Subtract it once from the sum.' }
    explanation: |
      Add the two counts and subtract the overlap once:
      $$N(D \text{ or } F) = N_D + N_F - N_{DF}$$
      Here $N_D = 12$, $N_F = 30$, $N_{DF} = 8$, so $12 + 30 - 8 = 34$. Reports with dread only are $12 - 8 = 4$, those with attraction only are $30 - 8 = 22$, those with both are $8$, and $4 + 22 + 8 = 34$. The remaining $40 - 34 = 6$ show neither. The fact that 8 reports mix both features is the kind of observation Otto's formula is about, but a count like this cannot say whether the mixture is a new feeling.

  - type: mcq
    id: awe-limits
    title: "What awe studies can and cannot show"
    prompt: |
      A study finds that people who feel more awe in nature also report feeling less self-important and more generous. A newspaper headline says "Science proves the sacred is real." What is the soundest comment?
    options:
      - text: 'The headline is right: if awe changes people, the thing that causes it must be sacred.'
        feedback: |
          Many things cause awe, a mountain, a proof or a great performance, and calling each of them sacred would stretch the word. An effect on people does not by itself say what kind of object caused it.
      - text: 'The study can show a link between awe and certain effects on people; whether any religious object is behind some awe is a separate question that the study does not test.'
        correct: true
        feedback: |
          Yes. A correlation or even a cause between awe and behaviour is data about people. It is compatible with the believer's reading (a real encounter) and with the skeptic's (a human response to vastness).
      - text: 'The study shows the opposite: awe is explained by psychology, so religious experience is nothing but awe.'
        feedback: |
          This overreaches in the other direction. Showing that a feeling has a psychological description does not show that it has no further object, just as a visual theory of seeing does not show there is nothing to see.
    explanation: |
      This repeats a point from the lesson on James: roots do not decide fruits, and a description of the mind does not decide what the experience is of. Each side's reading of the data adds its own commitment.

  - type: order
    id: awe-order
    title: "How awe works, by Keltner and Haidt"
    prompt: Put the account of awe in order, from first to last.
    steps:
      - 'A person meets something perceived as vast: large in size, power or idea.'
      - 'Existing mental structures cannot take it in, which creates a need for accommodation.'
      - 'The mind tries to stretch or reorganise its understanding to fit the experience.'
      - 'The outcome shapes the feeling: success can feel enlightening, failure can feel frightening.'
    hint: Start with what is out in the world, then what the mind does about it.
    explanation: |
      The order follows the two core appraisals: vastness comes first, and the need for accommodation follows from it. According to Keltner and Haidt, the success of the attempt to accommodate may partly explain why awe can be both terrifying and enlightening, the same pair of sides Otto saw in the numinous.

  - type: mcq
    id: james-otto
    title: "James and Otto compared"
    multiple: true
    prompt: |
      Select all the statements that correctly compare James's catalogue of religious experience (the lesson on James) with Otto's account of the numinous.
    options:
      - text: 'James sorts many kinds of experience (conversion, presence, mystical states); Otto isolates one quality he thinks lies in the core of all of them.'
        correct: true
        feedback: |
          Yes. James is a wide catalogue, Otto is a search for a single essence.
      - text: 'Both treat the experience as data that needs to be described before it can be judged, and neither equates a vivid feeling with proof.'
        correct: true
        feedback: |
          Yes, with a caution: Otto holds that the numinous points to its own object, which is a stronger claim than James makes about the feeling alone.
      - text: 'James says the cause of an experience decides its worth, while Otto says it does not.'
        feedback: |
          The reverse of James: he holds that roots do not decide fruits. Otto is also concerned with what the feeling is, not with its cause.
      - text: 'Otto accepts only the experiences of mystics who report union, since James restricted his study to ordinary believers.'
        feedback: |
          Neither claim is right. James collected many mystical cases, and Otto's numinous is about awe before the wholly other, which keeps a distance between the person and the object, not union.
    explanation: |
      One way to put it: James shows how many shapes religious experience takes, Otto asks what is in all of them, and the lesson on mystics returns to whether there is such a common core.

  - type: mcq
    id: traps
    title: "Traps"
    multiple: true
    prompt: |
      Select every statement that is a misconception.
    options:
      - text: 'The numinous is the same as being scared of something dangerous.'
        correct: true
        feedback: |
          A misconception. According to Otto, the numinous dread comes with fascination, and is felt before the wholly other, without any specific danger.
      - text: 'If awe has a psychological description, then no religious experience can be of something real.'
        correct: true
        feedback: |
          A misconception. A mental account of how a state arises says what the state is like in the mind, and does not by itself exclude an object that the state is of.
      - text: 'Non-rational means the same as irrational.'
        correct: true
        feedback: |
          A misconception. Non-rational is not reached by argument; irrational is against reason.
      - text: 'Keltner and Haidt define awe so that it can occur without any religion.'
        feedback: |
          This is correct: vastness and need for accommodation can be present in nature, art or ideas.
      - text: 'Otto thought the numinous can be fully defined in a sentence.'
        correct: true
        feedback: |
          A misconception. According to Otto it cannot be strictly defined and can only be evoked.
    explanation: |
      Four of these five lean on one shortcut: collapsing two things (fear and awe, non-rational and irrational, cause and object, definable and felt).

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Which of these sentences is a layer-3 claim (a faith or metaphysical commitment), as opposed to established fact or a live scholarly debate?
    options:
      - text: 'Many people report a mixture of dread and attraction in front of something that overwhelms them.'
        feedback: |
          Layer 1: an established fact about reports.
      - text: 'The numinous is a basic category of feeling, not reducible to fear plus wonder.'
        feedback: |
          Layer 2: a live debate between Otto's defenders and reductive critics, which depends on what counts as reducing a feeling.
      - text: 'In the numinous, the person is in contact with a holy reality that exists apart from the mind.'
        correct: true
        feedback: |
          Layer 3: it asserts a real object. A believer may hold it, and a skeptic may reject it, but neither the reports nor the awe studies settle it.
    explanation: |
      Check each statement by asking what it would take to show it. A count of reports can establish the first. The second needs arguments about reduction. The third needs commitments about what exists.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Where thoughtful people part ways.** A believer reads the numinous as a perception of the holy. A skeptic reads it as a human response to vastness. Both accept the experience and its force. They differ on whether the feeling is a new kind, and on whether it needs an object beyond the mind. That second point is where the data stop and commitments begin.

      **Next:** Mystics Across Traditions. Otto's numinous keeps the person and the holy apart, in dread and attraction. Many mystics report the opposite, a union in which the distance disappears. Is there a common core across Sufi, Kabbalistic, Christian, Hindu and Buddhist accounts, or only similar words for different experiences?
