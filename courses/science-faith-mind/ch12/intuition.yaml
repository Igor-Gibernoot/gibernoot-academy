id: ch12-intuition
title: Quick Recall
kind: intuition

cards:
  - type: text
    id: welcome
    title: "Quick recall: religious experience"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: the marks of mystical states, the numinous, roots against fruits, a ratio for a pattern in data, the common core of mystical reports, the odds form of Bayes' rule, the argument from credulity and its defeaters, and the three layers of a claim.

      Three kinds of card: **mnemonics** (the shape of a distinction), **build and order cards**, and **numeric cards that give you data only**: you choose the rule yourself.

      As always, every answer is *according to* someone or some view. Nothing here asks you to decide whether any experience reached a divine reality.

  - type: mcq
    id: marks
    title: "The marks of mystical states"
    prompt: |
      According to William James (1842-1910), a state of mind has four marks that mark it as mystical. Two of them are what **entitle** a state to be called mystical, and two are **usual** but not required. Which pair entitles?
    multiple: true
    options:
      - text: 'Ineffability (it cannot be put fully into words)'
        correct: true
      - text: 'Noetic quality (it feels like knowledge, insight into depths of truth)'
        correct: true
      - text: 'Transiency (it does not last long)'
        feedback: |
          Transiency is usual, not required: James says such states seldom last more than an hour or two, but a state is not disqualified for lasting longer.
      - text: 'Passivity (the person feels grasped by a power beyond the will)'
        feedback: |
          Passivity is usual too. Prayer and meditation may be prepared by effort, yet the person often feels the state is given, not made. It is not what entitles the state.
    explanation: |
      Mnemonic: **I and N entitle; T and P are usual**. Ineffability and noetic quality come first; transiency and passivity usually come with them.

  - type: mcq
    id: numinous-map
    title: "The numinous in three words"
    prompt: |
      According to Rudolf Otto (1869-1937), the numinous, the feeling of the holy that is not a moral or rational idea, has three aspects. Which pairing of Latin word and meaning is right?
    options:
      - text: '*Mysterium* is the wholly other; *tremendum* is awefulness and overpowering majesty; *fascinans* is the attraction, the pull toward it.'
        correct: true
      - text: '*Mysterium* is the attraction; *tremendum* is the wholly other; *fascinans* is awefulness.'
        feedback: |
          Scrambled. The attraction is *fascinans* (from "to fascinate"), and the wholly other is *mysterium*.
      - text: '*Tremendum* is only fear of punishment; *fascinans* is moral approval; *mysterium* is a puzzle to be solved.'
        feedback: |
          Otto separates the numinous from the moral and the rational. *Tremendum* is awe before overpowering presence, not fear of punishment, and *mysterium* is the wholly other, not a puzzle that more thinking would solve.
      - text: '*Mysterium*, *tremendum* and *fascinans* are three different religions.'
        feedback: |
          They are three aspects of one feeling, which Otto says is felt together: dread and attraction in the same moment.
    explanation: |
      Mnemonic: **M is the other, T is the trembling, F is the fascination**. The paradox of the numinous is that T and F are felt together.

  - type: mcq
    id: roots-fruits
    title: "Roots and fruits"
    prompt: |
      A critic says: "That vision came from a few nights of fasting, so it is worthless." According to William James, in essence, how should a religious state be judged?
    options:
      - text: 'By its fruits (what it does in the person''s life, and how it stands up to reason and to what else we know), not by its roots (what physical conditions it came from).'
        correct: true
      - text: 'By its roots alone: if the cause is bodily, the state is explained away.'
        feedback: |
          James calls this move medical materialism and rejects it: every state of mind has bodily roots, including the critic's own scientific beliefs, so roots alone cannot sort true from false.
      - text: 'By how intense it felt, since intensity is the only test.'
        feedback: |
          Intensity is part of the first test (luminousness), but James adds reasonableness and helpfulness. Intensity alone would also certify visions that contradict one another.
      - text: 'By whether the person is a believer, since only believers can judge.'
        feedback: |
          James judges by tests open to anyone: how the state fits with the rest of what we know, and what it does.
    explanation: |
      Mnemonic: **roots are causes, fruits are consequences**. James's three tests are luminousness, reasonableness and helpfulness. Whether good fruits support truth is a further question, taken up under the odds below.

  - type: numeric
    id: ratio
    title: "A ratio for a concentration"
    prompt: |
      An invented sample of reported conversions: $130$ of them fall in one four-year age window. If conversions were spread evenly over all ages, that window would hold $20$. By what factor is the observed count above what an even spread gives?
    answer: 6.5
    tolerance: 0.01
    answerText: '6.5'
    wrong:
      - { value: 110, feedback: 'That is the difference $130-20$, a number of conversions. A factor compares by dividing: how many times as many.' }
      - { value: 0.1538, feedback: 'Upside down: this is expected over observed. A concentration should give a number above 1.' }
    hint: 'Compare the observed count with the count expected from an even spread, as a multiple.'
    explanation: |
      $130/20=6.5$: the window holds $6.5$ times what an even spread gives. A value of $1$ would mean no concentration at all. The ratio shows the pattern is real; it does not say why. James reads adolescence as a time of identity change, and a social reading points to the commitments traditions ask at that age.

  - type: mcq
    id: core-sets
    title: "Core against union"
    prompt: |
      Three toy traditions report these features: tradition 1 has $\{p,q,r,s\}$, tradition 2 has $\{q,r,s,t\}$ and tradition 3 has $\{r,s,t,u\}$. The **common core** is what all three share; the **union** is everything reported by at least one. Which pair is right?
    options:
      - text: 'Core $\{r,s\}$ (two features); union $\{p,q,r,s,t,u\}$ (six features).'
        correct: true
      - text: 'Core $\{p,q,r,s,t,u\}$; union $\{r,s\}$.'
        feedback: |
          Swapped. What all share is the intersection, the smaller set. What at least one reports is the union, the larger set.
      - text: 'Core $\{q,r,s\}$; union $\{p,q,r,s,t,u\}$.'
        feedback: |
          $q$ is in traditions 1 and 2 but not in 3, so it is not shared by all three.
      - text: 'Core $\{r,s,t\}$; union $\{r,s\}$.'
        feedback: |
          $t$ is missing from tradition 1. And the union can never be smaller than the core.
    explanation: |
      Mnemonic: **core is the intersection $T_1\cap T_2\cap T_3$; the union is the overlap-plus-extras**. A perennialist like Stace points to the core; a constructivist like Katz points to the differences left over.

  - type: mcq
    id: core-scaling
    title: "Adding traditions"
    prompt: |
      Now a fourth, fifth and sixth tradition are added to the toy table, one at a time. What can you say, without knowing their features, about the size of the common core and of the union?
    options:
      - text: 'The core can only stay the same or shrink; the union can only stay the same or grow.'
        correct: true
      - text: 'The core grows, because more traditions give more agreement.'
        feedback: |
          Each new tradition is one more set that a feature must be in. A feature already in the core stays only if the newcomer has it too.
      - text: 'Both stay the same, because the first three traditions already decided them.'
        feedback: |
          A newcomer lacking $r$ removes it from the core; a newcomer with a new feature adds it to the union.
      - text: 'The core and the union both shrink.'
        feedback: |
          Adding a set never removes a feature from the union.
    explanation: |
      Scaling check: **more traditions, a thinner core**. This is why the answer depends on how finely features are described, which is where Stace and Katz part ways: a coarse feature ("some change of self") survives more traditions than a fine one.

  - type: build
    id: report-build
    title: "Build the decomposition"
    prompt: |
      According to the perennialist reading, the report from tradition $i$ combines what all traditions share with what that tradition adds. Build the line.
    prefix: '\text{report}_i ='
    tiles: ['\text{core}', '+', '\text{interpretation}_i', '\times', '\text{core}_i']
    answers:
      - ['\text{core}', '+', '\text{interpretation}_i']
      - ['\text{interpretation}_i', '+', '\text{core}']
    wrong:
      - answer: ['\text{core}', '\times', '\text{interpretation}_i']
        feedback: |
          The perennialist picture is additive: a shared part plus a tradition's own part. A product would mean the two cannot be separated, which is closer to Katz's claim that interpretation shapes the experience itself.
    hint: 'One shared term, plus one term that carries the tradition''s own words and doctrine.'
    explanation: |
      The decomposition is a hypothesis, not a finding. If the constructivist is right, the interpretation is part of the experience and no clean $\text{core}$ term can be subtracted.

  - type: build
    id: odds-build
    title: "Build the update rule"
    prompt: |
      For a claim $X$ and a new piece of evidence, build the rule that gives the odds after the evidence from the odds before it and the likelihood ratio (LR).
    prefix: 'posterior odds ='
    tiles: ['\text{prior odds}', '\times', '\text{LR}', '+', '\text{LR}^{-1}']
    answers:
      - ['\text{prior odds}', '\times', '\text{LR}']
      - ['\text{LR}', '\times', '\text{prior odds}']
    wrong:
      - answer: ['\text{prior odds}', '+', '\text{LR}']
        feedback: 'Evidence scales odds, it does not shift them. With LR $=1$ (no evidence) the odds must stay the same, and adding $1$ would change them.'
    hint: 'No evidence means LR $=1$ and the odds must stay as they were.'
    explanation: |
      Odds are the probability of the claim divided by the probability of its rival, $p/(1-p)$. The LR is $P(E\mid X)/P(E\mid\neg X)$.

  - type: numeric
    id: odds-a
    title: "Strong evidence, low start"
    prompt: |
      Before any experience is considered, the probability that a presence $X$ is real is $0.1$. Then a person has an experience that seems to be of $X$, and such an experience is $20$ times as likely if $X$ is real as if it is not. What is the probability that $X$ is real after the experience?
    answer: 0.69
    tolerance: 0.01
    answerText: '0.69'
    wrong:
      - { value: 2, feedback: 'That is $0.1\times20$, a product that treats the probability as if it were odds. A probability cannot exceed 1.' }
      - { value: 2.22, feedback: 'That is the posterior **odds**. Turn odds back into a probability by dividing by one plus the odds.' }
    hint: 'Turn the $0.1$ into odds first, scale by the factor, then turn the odds back into a probability.'
    explanation: |
      Prior odds are $0.1/0.9=1/9$. Scaled by $20$ they become $20/9\approx2.22$. The probability is $2.22/3.22\approx0.69$. A strong ratio moved a low start a long way, but not to certainty. The numbers are toy values.

  - type: numeric
    id: odds-b
    title: "Evidence that cannot discriminate"
    prompt: |
      The probability of a presence $X$ is $0.2$ before an experience. The experience would seem just as vivid whether $X$ is real or not (the two cases are equally likely to produce it, for instance because of a drug known to produce such experiences). What is the probability of $X$ after the experience?
    answer: 0.2
    tolerance: 0.005
    answerText: '0.2'
    wrong:
      - { value: 0.5, feedback: 'Equal likelihoods do not mean fifty-fifty about $X$. They mean the experience does not discriminate, so the earlier $0.2$ stays.' }
    hint: 'How many times likelier is the experience if $X$ is real than if it is not?'
    explanation: |
      Equal likelihoods give a ratio of $1$, and a ratio of $1$ leaves the odds, so the probability, at $0.2$. This is what a **defeater** does: it pushes the ratio toward $1$. The experience is not worthless as a report, but it no longer moves the estimate.

  - type: numeric
    id: odds-c
    title: "A benefit that comes either way"
    prompt: |
      The probability of a presence $X$ is $0.5$ before we look at outcomes. A person has a good life outcome. Such an outcome occurs in $80\%$ of people for whom $X$ is real and in $70\%$ of people for whom it is not (sincere belief helps either way). What is the probability of $X$ after learning of the good outcome? Give it to three decimals.
    answer: 0.533
    tolerance: 0.002
    answerText: '0.533'
    wrong:
      - { value: 0.8, feedback: 'That is the chance of a good outcome if $X$ is real, not the chance of $X$ given the outcome. Mixing these two directions is the classic slip.' }
      - { value: 0.1, feedback: 'That is the difference $0.8-0.7$. What matters for the update is how many times likelier, not the gap.' }
    hint: 'Start from a family of updates that multiplies odds, and compare the two chances by their ratio.'
    explanation: |
      The ratio is $0.8/0.7\approx1.143$. Prior odds are $1$, so posterior odds are $1.143$ and the probability is $1.143/2.143\approx0.533$. A benefit that is likely with or without the presence barely moves the estimate: it supports the value of the practice more than the truth of what it is about. Believers reply that a real presence best explains deep, lasting benefit; that is a claim that the denominator is smaller, to be defended with evidence.

  - type: order
    id: credulity-order
    title: "The argument from credulity"
    prompt: |
      Put Richard Swinburne's argument from religious experience in order, from the starting point to the conclusion.
    steps:
      - 'It seems, to a person, that a presence $X$ is there.'
      - 'The principle of credulity: if it seems that something is present, then probably it is present, unless special considerations apply.'
      - 'No defeater applies to this case (no unreliable conditions, no better explanation that would have produced the seeming anyway).'
      - 'So, probably, the presence is there.'
    hint: 'A seeming first, then the general rule, then a check on exceptions, then the conclusion.'
    explanation: |
      The shape is seems, credulity, no defeater, probably. A critic can reject the rule itself, or deny the third step for the case at hand. The argument does not say the conclusion is certain, only that the seeming gives some support.

  - type: mcq
    id: defeater-why
    title: "What a defeater defeats"
    prompt: |
      A person has an experience of a presence in a room after taking a drug known to cause such experiences. In the odds form, what does this defeater do?
    options:
      - text: 'It brings the likelihood ratio toward $1$: the experience is expected whether or not the presence is real, so the odds stay near the prior.'
        correct: true
      - text: 'It proves the presence is not there.'
        feedback: |
          A defeater removes the support the experience gave. It does not show the presence absent: the odds simply return toward where they started.
      - text: 'It sets the prior odds to zero.'
        feedback: |
          The prior comes from the rest of what the person knows. A defeater acts on the likelihood ratio.
      - text: 'It raises the likelihood ratio, since the drug makes the experience more vivid.'
        feedback: |
          Vividness is not the question. The ratio compares how likely the experience is with and without the presence, and a known cause makes it likely without.
    explanation: |
      Rule of thumb: **defeater means LR toward 1; and LR $=1$ means posterior odds equal prior odds**.

  - type: mcq
    id: layers-a
    title: "Sorting into layers"
    prompt: |
      The course sorts a claim into (1) established fact, (2) scholarly debate or (3) faith or metaphysical commitment. Which of the following is a **layer 2** claim?
    options:
      - text: 'Whether mystical experiences across traditions share a common core, or are shaped by each tradition''s concepts from the start.'
        correct: true
      - text: 'In a double-blind study of 89 people (43 with a weak magnetic field, 46 with a sham), the field did not produce the reported sense of presence.'
        feedback: |
          This is layer 1: a reported result of a study (Granqvist and colleagues, 2005). Its meaning for the temporal lobe theory is a layer 2 question.
      - text: 'The mystic''s report is a contact with a divine Reality.'
        feedback: |
          This is layer 3. Even if a common core were shown, that it reaches a divine Reality is a metaphysical commitment, held by believers and denied by others.
    explanation: |
      Sorting: **study result is fact; what it means is debate; what it ultimately reveals is commitment**. Keep the layers apart, in both directions: a layer 3 claim passed off as layer 1 misleads, from a believer or a sceptic.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Marks of mystical states** (James, 1842-1910). Ineffability and noetic quality entitle a state to be called mystical; transiency and passivity are usual. Test a state by its fruits, not its roots.

      **The numinous** (Otto, 1869-1937). *Mysterium* (the wholly other), *tremendum* (awefulness and overpowering majesty), *fascinans* (attraction), felt together.

      **A ratio for a pattern.** Compare what is observed with what an even spread would give:

      $$R=\frac{\text{observed}}{\text{expected if spread evenly}}$$

      so $130/20=6.5$. A ratio of $1$ means no concentration. It shows a pattern, not its cause.

      **Common core.** For features $T_i$ reported by tradition $i$,

      $$\text{core}=T_1\cap T_2\cap\dots\cap T_n$$

      only shrinks as traditions are added, while the union only grows. The perennialist reading is

      $$\text{report}_i=\text{core}+\text{interpretation}_i$$

      and the constructivist denies that the two can be separated.

      **Odds form.** For a claim $X$ and evidence $E$,

      $$\text{posterior odds}=\text{prior odds}\times\text{LR}$$

      with $\text{LR}=P(E\mid X)/P(E\mid\neg X)$. Prior $0.1$ and LR $20$ give $0.69$. LR $=1$ leaves the prior ($0.2$ stays $0.2$). A good outcome with chances $0.8$ and $0.7$ moves $0.5$ only to $0.533$.

      **Credulity and defeaters** (Swinburne, born 1934). Seems, credulity, no defeater, probably. A defeater pushes the LR toward $1$.

      **Layers.** A study result is fact; its meaning is debate; what it ultimately reveals is commitment.

      **Next:** the content map of this level, where you rebuild the chapter's concept map box by box among look-alike decoys.
