id: ch12-challenge
title: "Level Challenge: What Does an Experience Show? (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: three accounts, one toolkit"
    body: |
      Each problem hands you an account of a religious or mystical experience and asks what it can and cannot support. The accounts and all their numbers are invented to practise the method. The problems are independent, so the toolkit is restated here.

      - **James's four marks.** According to William James (1902), a state is called mystical when it has *ineffability* (it cannot be put into words) and a *noetic quality* (it feels like knowledge, an insight into depths). Two further marks are usual but not required: *transiency* (it passes, typically within half an hour or an hour or two) and *passivity* (it comes over the person).
      - **Three tests, roots and fruits.** James judges a religious opinion by *immediate luminousness* (inner force), *philosophical reasonableness* (fit with what else is known) and *moral helpfulness*. What caused a state (its roots) and what it is worth (its fruits) are two questions. He dismissed explaining a state away by its body as "medical materialism".
      - **Enrichment.** For a group,
      $$R=\frac{\text{observed reports}}{\text{expected if spread evenly}}$$
      - **Credulity and defeaters.** Richard Swinburne's principle: if it seems to a person that something is present, then, absent a defeater, probably it is. A defeater is a reason the seeming is less trustworthy. In odds form, with $X$ the presence and $E$ the report,
      $$\begin{aligned}\text{posterior odds}={}&\frac{P(E\mid X)}{P(E\mid\neg X)}\\&\times\text{prior odds}\end{aligned}$$
      and a defeater works by pulling the likelihood ratio toward $1$. A brain explanation defeats only if it makes $E$ no likelier given $X$ than given $\neg X$.
      - **Common core.** Walter Stace (1960): $\text{report}_i=\text{core}+\text{interpretation}_i$. Steven Katz (1978): concepts shape the experience itself, so different concepts mean different experiences. Robert Forman (1990): a *pure consciousness event* is wakeful but has no object and no content.
      - **Three layers:** established fact, live debate, faith or metaphysical commitment.

      Three problems here. Problems 4 and 5 come in part 2.

  # ---------------- Problem 1 ----------------
  - type: text
    id: p1-setup
    title: "Problem 1 · The night watch"
    body: |
      **Problem 1.** Dara sails alone across an ocean. On the fourth night, after about two days of broken sleep, Dara writes in the log:

      > "Around three in the morning I felt someone standing in the cockpit behind me, kind and entirely certain. I saw and heard nothing. It lasted perhaps twenty minutes and then it was only wind again. I cannot put into words what I knew, only that I knew it. I did not choose it; it came over me."

      In the following year Dara stops drinking and makes peace with an estranged brother. Raised without religion, Dara now says: "Something looked after me." (The account is invented.)

      Your task: mark it against James, apply his tests, and say what it can and cannot support.

  - type: mcq
    id: p1-marks
    title: "Which phrases carry the defining marks?"
    multiple: true
    prompt: |
      According to James, two marks entitle a state to be called mystical and two more are usual but not required. Select **all** the phrases in Dara's log that show the two marks that **entitle**.
    options:
      - text: '"I cannot put into words ..."'
        correct: true
        feedback: |
          Yes. This is ineffability: the report says the content cannot be given in words.
      - text: '"... what I knew, only that I knew it."'
        correct: true
        feedback: |
          Yes. This is the noetic quality: the state feels like knowing, not like a mere mood.
      - text: '"It lasted perhaps twenty minutes ..."'
        feedback: |
          This is transiency, which James calls usual. A state that lasted longer would still count if it had the two defining marks.
      - text: '"... it came over me."'
        feedback: |
          This is passivity, usual but not required. Many reports of meditators describe effort that comes first, and James still counts them.
    explanation: |
      The log shows all four marks: two that entitle (ineffability, noetic quality) and two that are usual (transiency, passivity). A log that showed only the two usual marks, a short passive episode with no sense of knowing, would be a strong feeling but not mystical in James's sense.

  - type: mcq
    id: p1-tests
    title: "Match the details to the three tests"
    prompt: |
      Take these three details: (a) Dara says the presence felt certain, more than any thought. (b) Dara has since stopped drinking and mended a family tie. (c) Whether the experience fits what is known about nights alone, without sleep, at sea. According to James, which is the correct match to his three tests?
    options:
      - text: '(a) immediate luminousness, (b) moral helpfulness, (c) philosophical reasonableness.'
        correct: true
      - text: '(a) philosophical reasonableness, (b) immediate luminousness, (c) moral helpfulness.'
        feedback: |
          Certainty is the inner force of the experience, which is luminousness. Reasonableness asks whether the claim fits the rest of what is known.
      - text: '(a) moral helpfulness, (b) philosophical reasonableness, (c) immediate luminousness.'
        feedback: |
          Helpfulness is about what living by the experience does for a person's conduct and relations, which is detail (b), not the felt certainty.
    explanation: |
      The felt certainty is luminousness, the changed life is helpfulness, and the fit with known facts about fatigue and solitude is reasonableness. The tests pull apart here: the first two are strong, the third is the one a sceptic presses.

  - type: mcq
    id: p1-fruits
    title: "What do the fruits show?"
    prompt: |
      A friend says: "Dara's year of good changes proves a presence was really there." A sceptic says: "Sleep loss explains the night, so the year of changes is worth nothing." According to James, what is the fair verdict on both?
    options:
      - text: 'The changes are fruits and show the experience was worth something for Dara. The sleep loss is a root and does not by itself settle that worth. Neither side has shown whether the presence was real, which is a separate question.'
        correct: true
      - text: 'The friend is right: good fruits can only come from a true cause.'
        feedback: |
          A false belief can also lead to good conduct, and good fruit is compatible with several causes. Fruits speak to worth, not to whether the cause was a presence.
      - text: 'The sceptic is right: once a bodily cause is named, the experience has no worth.'
        feedback: |
          This is what James called medical materialism. Every state has a bodily root, including the states the sceptic trusts, so naming it does not decide worth.
    explanation: |
      James keeps two questions apart: what caused the state, and what it is worth. The changes answer a little about the second and nothing decisive about whether the presence was real.

  - type: numeric
    id: p1-enrich
    title: "How much does sleep loss enrich reports?"
    prompt: |
      A survey of $500$ solo sailors finds that $60$ report a sense of presence on a crossing. Of the $500$, $100$ had gone more than $48$ hours with very little sleep, and $45$ of the $60$ reports came from those $100$. Compute the enrichment ratio $R$ for the sleep-deprived group, observed reports over the reports expected if the $60$ were spread evenly. Give a number to two decimals.
    answer: 3.75
    tolerance: 0.01
    answerText: '3.75'
    hint: |
      If reports were spread evenly, a group of $100$ out of $500$ would hold the same share of the $60$ reports as its share of the sailors.
    wrong:
      - { value: 0.75, feedback: "That is 45 out of 60, the share of reports in the group. Compare it with the group's share of sailors (one fifth) to get the enrichment." }
      - { value: 0.45, feedback: "That is the rate within the group (45 of 100). The enrichment compares it with the overall rate of 60 in 500." }
    explanation: |
      Evenly spread, the group would hold $60\times100/500=12$ reports. It holds $45$, so $R=45/12=3.75$. Equivalently, the rate is $45\%$ in the group against $12\%$ overall. Reports are about four times as common after heavy sleep loss.

  - type: mcq
    id: p1-defeater
    title: "Does the enrichment defeat the seeming?"
    prompt: |
      Sleep loss makes reports of a presence about $3.75$ times as common. Swinburne lists four kinds of defeater of a religious experience. Which kind is closest to sleep loss, and what would it take for it to defeat Dara's report?
    options:
      - text: 'Unreliable conditions, like alcohol or drugs. It defeats only if, under such conditions, a report is about as likely whether or not a presence is there, so that $P(E\mid X)/P(E\mid\neg X)$ falls toward $1$.'
        correct: true
      - text: 'A presence that is not the cause. It defeats whenever any bodily factor, such as lack of sleep, raises how often reports occur.'
        feedback: |
          A bodily factor that makes reports more common does not alone show that a presence is not the cause. It matters only for the likelihood ratio: if a real presence would also be noticed best by a tired, quiet mind, the ratio need not fall.
      - text: 'Knowledge against the claim. It defeats whenever the person has not studied the question.'
        feedback: |
          That defeater is about well-supported knowledge that contradicts what the experience claims. Having read little is not a defeater.
    explanation: |
      Enrichment is a clue and not yet a verdict. Two readings stay open: tiredness produces the presence whether or not there is one, or tiredness lowers the guard so a real presence is noticed. They give different likelihood ratios, and the data above cannot tell them apart.

  - type: order
    id: p1-ladder
    title: "Put the argument from Dara's log in order"
    prompt: |
      Order the steps of a careful argument from Dara's log to a conclusion, from the first step to the last.
    steps:
      - 'It seems to Dara, with certainty, that a presence is there.'
      - 'Absent a defeater, by the principle of credulity a presence is probably there.'
      - 'Check for defeaters: two days of broken sleep and solitude make such seemings far more common.'
      - 'If the seeming would be as likely without a presence, the likelihood ratio falls toward $1$ and the support shrinks to little.'
    hint: |
      The principle sets a default, then the defeaters are checked, then the update is made.
    explanation: |
      The order is seeming, default trust, check for defeaters, then the weakened update. The argument is not over when the default is stated: it is the check that decides how much support remains.

  - type: mcq
    id: p1-verdicts
    title: "Sort the three layers"
    prompt: |
      Sort three sentences into the three layers: (a) Dara wrote this log, and in the next year stopped drinking and reconciled with a brother. (b) Whether sleep loss and solitude weaken the log as evidence of a presence. (c) A presence beside Dara in the cockpit was real.
    options:
      - text: '(a) established fact (as a report of what was written and done); (b) live debate (it depends on the likelihood ratio and on how the conditions are read); (c) a faith or metaphysical commitment.'
        correct: true
      - text: '(a) live debate; (b) established fact; (c) established fact.'
        feedback: |
          The log and the changes are records, not debate. And (c) is no matter of record: the log reports a seeming, not a presence.
      - text: '(a) established fact; (b) established fact; (c) live debate.'
        feedback: |
          (b) turns on a likelihood ratio that people estimate differently. It is a debate, not a settled fact. And (c) goes beyond any weighing of the log.
    explanation: |
      The account supports, at most, a modest claim: a person, in conditions that make such reports common, had a vivid and certain seeming that changed their life. It does not support, nor rule out, a presence. Where people part ways is the estimate of $P(E\mid X)$ against $P(E\mid\neg X)$ and the prior they begin with.

  # ---------------- Problem 2 ----------------
  - type: text
    id: p2-setup
    title: "Problem 2 · Fana and devekut"
    body: |
      **Problem 2.** Two people, one in a Sufi (Islamic mystical) tradition and one in a Kabbalistic (Jewish mystical) tradition, describe a night of intense practice. The accounts are invented in the manner of their traditions.

      **The Sufi** describes *fana*, "passing away" of the self: "First I saw myself praying, then I saw only the prayer, then there was no one praying. Only He remained, and I did not remain to say so. I knew it was true. It was peace beyond words. Afterwards what was left of me was given back, and I walked home in the morning."

      **The Kabbalist** describes *devekut*, from the Hebrew for "to cleave": "In the middle of my study my mind cleaved to the One, as a flame cleaves to the wick. I did not vanish: I was the one who clung. It was sweet beyond saying, and I knew it was true. In the morning the letters were the same letters, and I was bound to them more."

      Take seven features: A, it cannot be put into words; B, it feels like knowing; C, deep peace or sweetness; D, the sense of self dissolves; E, no distinction is left between self and the divine; F, the person clings to the divine and the self remains; G, the divine is named ("He", "the One"). The Sufi report has the features $\{A,B,C,D,E,G\}$ and the Kabbalist report has $\{A,B,C,F,G\}$. A third report, from a Buddhist meditator, has $\{A,B,C,D\}$.

  - type: mcq
    id: p2-read
    title: "One event or two?"
    prompt: |
      Read the two accounts in their own words. Which statement is the fairest first description of how they differ and agree?
    options:
      - text: 'They agree in the felt qualities (beyond words, a sense of knowing, peace or sweetness) and the way the divine is named, and they differ on what happens to the self: it passes away in one, it remains and clings in the other. Whether that difference is only in the telling is exactly what is disputed.'
        correct: true
      - text: 'They describe the same event in different words, since both mention peace, so there is nothing to explain.'
        feedback: |
          That is the conclusion of one side of the dispute, not a reading both sides must accept. The accounts differ on the self, and whether that difference is in the experience or in the words is the question.
      - text: 'They describe different events, since the Sufi says the self passes away and the Kabbalist says it remains, so nothing can be shared.'
        feedback: |
          That is the conclusion of the other side. They do share reported features, and the dispute is about what that sharing means.
    explanation: |
      Each framing hides a premise. The task of this problem is to put the premises on the table.

  - type: numeric
    id: p2-two
    title: "The overlap of two reports"
    prompt: |
      The Sufi report has the features $\{A,B,C,D,E,G\}$ and the Kabbalist report has $\{A,B,C,F,G\}$. How many features do the two reports have in common?
    answer: 4
    tolerance: 0
    hint: |
      List the letters that appear in both sets.
    explanation: |
      The common features are $A,B,C,G$, so there are $4$. The overlap is the intersection $\{A,B,C,F,G\}\cap\{A,B,C,D,E,G\}=\{A,B,C,G\}$. The Sufi alone has $D$ and $E$; the Kabbalist alone has $F$.

  - type: numeric
    id: p2-three
    title: "Add a third tradition"
    prompt: |
      Add the Buddhist report $\{A,B,C,D\}$ to the Sufi $\{A,B,C,D,E,G\}$ and the Kabbalist $\{A,B,C,F,G\}$. How many features are common to all three reports?
    answer: 3
    tolerance: 0
    hint: |
      A feature has to be in all three sets. The naming of the divine (G) is missing in the Buddhist report.
    explanation: |
      Only $A,B,C$ are in all three, so there are $3$. Adding a tradition cannot enlarge the intersection; it can only keep it or shrink it. The naming of the divine drops out here because the Buddhist report does not name one.

  - type: mcq
    id: p2-shrink
    title: "What does the shrinking show?"
    prompt: |
      Suppose a fourth report, a terrifying vision, had only $\{A,B,D\}$ and so no peace. The common core of four reports would be $\{A,B\}$, and of five or six more it might be smaller still. What is a fair conclusion?
    options:
      - text: 'The size of the core depends on which reports are admitted. A perennialist must say why the terrifying vision is not a mystical state of the same kind, and a critic can say a core that keeps shrinking is too thin to carry any doctrine about the divine.'
        correct: true
      - text: 'The core is proved to be exactly $\{A,B\}$, the true essence of all mysticism.'
        feedback: |
          The core is only what the chosen sample shares. A different sample gives a different core, so it proves nothing about all mysticism.
      - text: 'Intersections are not a good way to compare reports, so the whole idea should be dropped.'
        feedback: |
          The intersection is precisely the tool the common-core view uses. The lesson is how its result depends on the sample, not that it is useless.
    explanation: |
      The common-core view is a claim about sets, and sets change when members change. Admit a Sufi, a Kabbalist, a Buddhist and a terrified visionary and the core is $\{A,B\}$; admit only the first two and it is $\{A,B,C,G\}$. Which reports count is part of the theory.

  - type: mcq
    id: p2-katz
    title: "The Katz reply"
    prompt: |
      A defender of the common core points to $A$, $B$, $C$ in all three reports. According to Steven Katz (1978), what is the weakness in moving from shared words to a shared experience?
    options:
      - text: 'The three people were trained in different concepts, which shape the experience itself and not only its description. If the Sufi was taught fana and the Kabbalist devekut, the experiences differ, and the shared words ("beyond words", "peace") may cover different things.'
        correct: true
      - text: 'Katz holds that the three people were lying about their experiences.'
        feedback: |
          Katz does not accuse them of lying. His claim is that the experiences themselves are formed by concepts the person already has.
      - text: 'Katz holds that experiences cannot be compared because words can never describe anything.'
        feedback: |
          That is a different and far wider claim. Katz's point is narrower: different concepts lead to different experiences, so agreement in words is not agreement in experience.
    explanation: |
      Katz's argument, in essence: there are no pure, unmediated experiences, and the concepts a person brings overdetermine the experience. The defender of the core can reply that the training differs but a common experience is underneath. Both replies are live in the literature.

  - type: build
    id: p2-build
    title: "Stace's picture"
    prompt: |
      Build Stace's picture of the $i$-th report, with the traditions' vocabulary as the part that varies.
    prefix: '\text{report}_i ='
    tiles: ['\text{core}', '+', '\text{interpretation}_i', '\times', '\cap']
    answers:
      - ['\text{core}', '+', '\text{interpretation}_i']
      - ['\text{interpretation}_i', '+', '\text{core}']
    wrong:
      - answer: ['\text{core}', '\cap', '\text{interpretation}_i']
        feedback: 'An intersection would keep only what core and interpretation share. Stace adds: every report is a common core together with its own interpretation.'
    hint: |
      The core is common to all reports; the interpretation belongs to report $i$.
    explanation: |
      On Stace's picture the core is the same in every tradition and each report adds its tradition's interpretation. Katz's reply amounts to saying there is no way to take the second term away and still have an experience.

  - type: mcq
    id: p2-forman
    title: "Do pure consciousness events change anything?"
    prompt: |
      According to Robert Forman (1990), a pure consciousness event is wakeful but has no object and no content, so there is nothing for concepts to shape. Does this change what we should say about the Sufi and Kabbalist accounts above?
    options:
      - text: 'Not for these two accounts, because each has an object and content ("He", "the One"), so neither is a pure consciousness event by its own report. Forman''s claim concerns other, contentless events and would at most give a narrow core (wakeful and without content), not the shared naming or doctrine. Constructivists also reply that the report of such an event is made afterwards with concepts.'
        correct: true
      - text: 'Yes: it proves the Sufi and the Kabbalist had the same event and that Katz is wrong.'
        feedback: |
          Forman''s case rests on contentless events, and these two accounts name an object. It cannot be stretched to prove that their events are the same.
      - text: 'Yes: it shows concepts play no role in any religious experience.'
        feedback: |
          Forman need not say this. His claim concerns one kind of event, the contentless one, and leaves room for concepts in the contentful ones.
    explanation: |
      Forman's move changes the debate only if some reports describe contentless events. Even then, the core he can defend is thin and does not carry the doctrine that the traditions name the same divine reality. Whether a report made afterwards can speak for what was "pure" is where the constructivists press.

  - type: mcq
    id: p2-verdicts
    title: "Sort the three layers"
    prompt: |
      Sort: (a) Both reports say the experience was beyond words and felt like knowing. (b) The Sufi and the Kabbalist had, at bottom, the same experience, differently described. (c) What they met was the ultimate reality of the universe.
    options:
      - text: '(a) established fact (as what the reports say); (b) live debate between common-core views (Stace, Huxley, in part Forman) and constructivist views (Katz); (c) a faith or metaphysical commitment.'
        correct: true
      - text: '(a) live debate; (b) established fact; (c) live debate.'
        feedback: |
          What the reports say is a matter of record. And (b) is the very point at issue between Stace and Katz, so it is not settled.
      - text: '(a) established fact; (b) established fact; (c) established fact.'
        feedback: |
          Only (a) is a matter of record. Calling (b) and (c) established would pass a debate and a commitment off as facts.
    explanation: |
      The same sample supports opposite readings depending on one premise: whether concepts shape the experience itself or only its description. Where people part ways is that premise.

  # ---------------- Problem 3 ----------------
  - type: text
    id: p3-setup
    title: "Problem 3 · The silent retreat"
    body: |
      **Problem 3.** At a ten-day silent retreat, $120$ of $400$ attendees report a sensed presence at some time during the stay. Researchers then run two studies at the retreat. The study and its numbers are invented.

      **Field study.** They recruit $80$ volunteers and assign each at random to $40$ minutes in a dim room wearing a helmet that produces a weak magnetic field (the field group, $40$) or one that produces none (the sham group, $40$). As in Granqvist's 2005 double-blind study, neither the volunteers nor the staff handling them know which is which. A sensed presence is reported by $14$ of the $40$ in the field group and $13$ of the $40$ in the sham group.

      **Scan.** Ten attendees are scanned during a sitting in which they report a presence, and nine show raised activity in a region of the right temporal lobe. Ten more are scanned during an ordinary task of vivid imagining, and eight show it too.

      Your task: take a reader who gives a presence a prior of $10\%$ and see where the evidence leaves them.

  - type: numeric
    id: p3-sham
    title: "What does the sham group tell us?"
    prompt: |
      In the sham group, $13$ of $40$ report a sensed presence although there was no magnetic field. What percentage of the sham group reported one? Give the percentage.
    answer: 32.5
    tolerance: 0.1
    answerText: '32.5'
    hint: |
      Divide $13$ by $40$ and multiply by $100$.
    explanation: |
      $13/40=0.325$, so $32.5\%$. The field group gave $14/40=35\%$. With no field at all, about a third report a presence, so dim light, silence, expectation and suggestibility produce reports at a high rate without any helmet effect.

  - type: mcq
    id: p3-readsham
    title: "Reading the two groups"
    prompt: |
      The field group reports $35\%$ and the sham group $32.5\%$. What is the fair reading of the helmet study?
    options:
      - text: 'The field does not add noticeably to reports, so the helmet explains little of the retreat. What it does show is that the setting alone produces reports at a high rate, a rate to be set against the retreat figure of $30\%$.'
        correct: true
      - text: 'The helmet works, since the field group is higher than the sham group.'
        feedback: |
          A gap of $2.5$ points from $40$ people per group is well inside what chance gives. Granqvist found no field effect in a similar double-blind design, and suggestibility predicted the reports.
      - text: 'The study shows that the retreat reports are all due to suggestion and none to a presence.'
        feedback: |
          The sham rate shows that suggestion alone can produce reports at this rate. It does not show that a real presence would produce none. That depends on the likelihood ratio, which comes next.
    explanation: |
      The helmet is not the cause, which is useful: it removes one brain explanation. But the sham group shows something else, a base rate: with no field, $32.5\%$ of people in this setting report a presence anyway. That base rate is what the likelihood ratio needs.

  - type: numeric
    id: p3-lr
    title: "The likelihood ratio of a report"
    prompt: |
      Take the sham rate, $32.5\%$, as the chance $P(E\mid\neg X)$ that an attendee reports a presence when none is there. A reader who believes in a presence thinks that if one were there about $65\%$ of attendees would notice it, so $P(E\mid X)=0.65$. What is the likelihood ratio of a report?
    answer: 2
    tolerance: 0.01
    answerText: '2'
    hint: |
      The likelihood ratio compares how likely a report is if the presence is there with how likely it is if not.
    wrong:
      - { value: 0.5, feedback: "That is the ratio turned upside down: it divides the chance if there is no presence by the chance if there is one." }
      - { value: 20, feedback: "That is the ratio assumed before any defeater: the toy credulity step of $20$. The sham group shows that reports are common even without a presence, so the ratio is much lower." }
    explanation: |
      $0.65/0.325=2$. A report is twice as likely if a presence is there as if not. The principle of credulity alone might suggest a ratio like $20$, but the sham base rate is the defeater at work: reports are so common without a presence that each one carries little weight.

  - type: numeric
    id: p3-post
    title: "Where the reader ends"
    prompt: |
      The reader starts with a prior probability of $0.10$ for a presence, then updates on a report with likelihood ratio $2$. What is the posterior probability? Give it to two decimals.
    answer: 0.18
    tolerance: 0.005
    answerText: '0.18'
    hint: |
      Convert the prior probability to odds ($0.10$ is $1$ to $9$), multiply by the ratio, then convert back to a probability.
    wrong:
      - { value: 0.69, feedback: "That is the update with a likelihood ratio of $20$ (from $0.1$). The ratio here is $2$." }
      - { value: 0.2, feedback: "That doubles the probability. The ratio doubles the odds, and the odds are $1/9$, not $0.1$." }
    explanation: |
      Prior odds are $0.1/0.9=1/9$. Times $2$ gives odds $2/9$, and the probability is $(2/9)/(1+2/9)=2/11\approx0.18$. For comparison, a ratio of $20$ would have given $0.69$. The defeater moved the posterior from about two in three to under one in five.

  - type: widget
    id: p3-widget
    widget: odds-updater
    config:
      prior: 0.1
      lr: 2
      lrSlider: false
      presets:
        - { label: "Prior 1%", prior: 0.01 }
        - { label: "Prior 10%", prior: 0.1 }
        - { label: "Prior 50%", prior: 0.5 }
    body: |
      The likelihood ratio of a report is fixed at $2$. Click the three priors and watch how little the posterior moves for each starting point.

  - type: numeric
    id: p3-ceiling
    title: "Could any report rate reach even odds?"
    prompt: |
      The reader's prior is $0.10$ (odds $1$ to $9$), so to reach even odds the ratio would have to be $9$. The chance $P(E\mid\neg X)$ stays at $0.325$ and $P(E\mid X)$ cannot exceed $1$. What is the **largest** likelihood ratio any belief about $P(E\mid X)$ could give? Give it to two decimals.
    answer: 3.08
    tolerance: 0.01
    answerText: '3.08'
    hint: |
      Take $P(E\mid X)$ as large as it can be.
    explanation: |
      The largest is $1/0.325\approx3.08$. Even if the reader thought a real presence would be noticed by everyone, the ratio is at most about $3$, which from a prior of $0.10$ gives odds of $0.342$ and a probability of about $0.25$. The retreat's report rate cannot, by itself, lift a doubtful reader to even odds. A starting prior near $0.5$ gives $2/3$ with ratio $2$.

  - type: mcq
    id: p3-scan
    title: "What does the scan add?"
    prompt: |
      Nine of ten scans taken during a reported presence show raised right temporal activity, and eight of ten taken during vivid imagining do too. A reader says: "A brain pattern appears, so the presence is explained away." Another says: "It appears, so the presence is a brain event and nothing more." What does the scan, taken alone, add to the likelihood ratio of the report?
    options:
      - text: 'Very little: a presence, if real, would be experienced through a brain, so the pattern is expected whether or not a presence is there, and it appears in vivid imagining too. It leaves the ratio near $1$ and does not move the posterior. It also is no proof that nothing is there.'
        correct: true
      - text: 'A great deal: a brain pattern shows the experience has a natural cause, so the ratio falls to $0$.'
        feedback: |
          A natural cause of the experience is compatible with a presence acting through that cause. A brain explanation defeats only if it makes the report no likelier with a presence than without, and that is the ratio the scan leaves near $1$.
      - text: 'A great deal in the other direction: a pattern in the very region linked to religious feeling shows a presence is acting there.'
        feedback: |
          The pattern also appears in vivid imagining with no claimed presence ($8$ of $10$ against $9$ of $10$). A pattern that appears in both cases cannot favour a presence.
    explanation: |
      By the lesson's rule, a brain explanation defeats only if the likelihood ratio becomes $1$. Here the scan itself has a ratio near $1$ ($9/10$ against $8/10$ is about $1.1$ on a sample of $10$), and so it leaves the posterior at about $0.18$. Roots do not settle the worth or the truth of the experience, either way.

  - type: mcq
    id: p3-verdicts
    title: "Sort the three layers"
    prompt: |
      Sort: (a) In the sham group $13$ of $40$ reported a sensed presence, and in the field group $14$ of $40$. (b) After these results a reader with a prior of $0.10$ should end near $0.18$. (c) A presence acts through the brain in these experiences.
    options:
      - text: '(a) established fact (as the study''s counts); (b) live debate (it depends on the prior and on the estimate $P(E\mid X)$, though not much on the data); (c) a faith or metaphysical commitment.'
        correct: true
      - text: '(a) live debate; (b) established fact; (c) established fact.'
        feedback: |
          The counts are a record. And (b) rests on a prior and on a judgment of $P(E\mid X)$ that people make differently, so it is not a fact of the study.
      - text: '(a) established fact; (b) established fact; (c) live debate.'
        feedback: |
          (b) needs a prior, which the study does not supply. And (c) goes beyond what any such study can settle.
    explanation: |
      The study leaves the posterior low for a doubtful reader without refuting a believer, who may start from a high prior or think $P(E\mid X)$ differs. The calculation shows what the data do: with this base rate no report rate can lift a reader from a prior of $0.10$ past about $0.25$.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Weighing one account.** James's two entitling marks are ineffability and a noetic quality; transiency and passivity are usual. The three tests (luminousness, reasonableness, helpfulness) look at an opinion's worth, while the roots of a state do not settle it. For a group, enrichment $R=\text{observed}/\text{expected}$ was $45/12=3.75$ for the sleep-deprived sailors.
      - **Weighing a defeater.** A defeater works by pulling the likelihood ratio toward $1$:
      $$\begin{aligned}\text{posterior odds}={}&\frac{P(E\mid X)}{P(E\mid\neg X)}\\&\times\text{prior odds}\end{aligned}$$
      With $P(E\mid\neg X)=0.325$ from the sham group and $P(E\mid X)=0.65$ the ratio is $2$, and a prior of $0.10$ ends at $2/11\approx0.18$. With $P(E\mid X)$ at its largest, $1$, the ratio is $1/0.325\approx3.08$ and the posterior stays under $0.26$. A brain finding such as the scan ($9/10$ against $8/10$) leaves the ratio near $1$.
      - **Weighing a core.** Stace's $\text{report}_i=\text{core}+\text{interpretation}_i$ gave $\{A,B,C,G\}$ for the Sufi and the Kabbalist ($4$ features) and $\{A,B,C\}$ once a Buddhist report is added ($3$), so the core depends on the sample. Katz replies that concepts shape the experience itself; Forman's pure consciousness event (wakeful, no content) gives at most a thin core.
      - **Method.** Sort each sentence into established fact, live debate, or faith commitment, and say which premise the parting of ways turns on.

      **Next:** part 2 weighs two further cases: a retreat follow-up with a good-outcome rate against a placebo group, and a closing weighing of what the level's experiences can and cannot show.
