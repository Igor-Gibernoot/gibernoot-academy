id: ch12-evidence
title: "Guided proof: Experience as Evidence"
kind: guided
proof: true
own: |
  The setting: a person $S$ has an experience that seems to them to be of a presence $X$ (a tree, or, for a mystic, God). The question is how far "it seems to $S$ that $X$ is there" is evidence that $X$ is there. The course sorts claims in three layers: established fact, live scholarly debate, and faith or metaphysical commitment.
  - **The principle of credulity.** According to Richard Swinburne (born 1934, *The Existence of God*, 1979, second edition 2004), in essence: if it seems (epistemically) to a subject that $x$ is present, then probably $x$ is present, unless special considerations apply.
  {{ $$\begin{aligned}&\text{it seems to } S \text{ that } x \text{ is present}\\ &\Rightarrow\ \text{probably } x \text{ is present}\end{aligned}$$ }}
  Here the arrow is "is good (defeasible) evidence for", not a proof.
  - **The argument.** P1: some people have experiences that seem to be of $X$. P2: the principle of credulity. P3: no defeater applies to the case at hand. C: probably $X$ is present. The step from P1 to P3 to C is valid; whether it is sound depends on P2 and P3, where the sides part ways.
  - **In odds form.** Let $E$ be "it seems to $S$ that $X$ is present". Posterior odds are the likelihood ratio times the prior odds:
  {{ $$\frac{P(X\mid E)}{P(\neg X\mid E)}=\frac{P(E\mid X)}{P(E\mid\neg X)}\cdot\frac{P(X)}{P(\neg X)}$$ }}
  The principle of credulity says the likelihood ratio $P(E\mid X)/P(E\mid\neg X)$ is well above $1$; the prior $P(X)$ comes from the worldview, so two people can accept the same experience as evidence and still end far apart.
  - **Defeaters.** According to Swinburne, special considerations include conditions known to be unreliable (such as drugs), an object of a kind for which such claims have proved false, other well-supported knowledge making the presence very unlikely, and good reason to think $X$ did not cause the experience. A defeater applied to the case pushes the likelihood ratio toward $1$, which leaves the odds at the prior:
  {{ $$\text{LR}\to 1\ \Rightarrow\ \text{posterior odds}\to\text{prior odds}$$ }}
  - **Perception analogy and diversity.** According to William Alston (*Perceiving God*, 1991), we cannot show without circularity that sense perception is reliable, yet we rightly trust it; religious experience, he argued, stands in the same position. Critics reply that perception is public and cross-checkable and mystical reports are not. Conflicting reports from different traditions are a diversity challenge: John Hick answers that they are different responses to one Real, others that each tradition has its own standards.
  - **Three layers.** That people have such experiences is established; whether the principle of credulity applies to them, and whether defeaters apply, is live debate; the prior, and what the presence is, is a metaphysical commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: two seemings"
    prompt: |
      Guessing is the point; no theory yet. You are walking and it seems to you that a tree stands ahead. Elsewhere, a mystic says it seemed to her that she met God. Before any theory, which first reaction is the fairest?
    options:
      - text: 'Both are "seemings", and the question is whether each deserves trust *unless* there is a reason to doubt it; the interesting work is finding such reasons or showing they are absent.'
        correct: true
        feedback: |
          Yes. This is the question the lesson turns into an argument: does how things seem count as evidence by default, and what would take that evidence away?
      - text: 'The tree seeming is knowledge and the mystic''s seeming is only a feeling, with no need to ask anything.'
        feedback: |
          That settles the issue by assumption. Some philosophers do draw this line, but they give reasons (perception can be checked by others), and the lesson will weigh those reasons rather than start from them.
      - text: 'Both are equally certain, because whatever seems true to someone is true for them.'
        feedback: |
          "Seems" and "is" can come apart (a stick looks bent in water). The question is how much a seeming is worth as evidence, not whether it is automatically true.
    explanation: |
      Two ways to read the question: "do seemings count by default?" and "does this particular seeming survive the reasons to doubt it?". The lesson separates them.

  - type: text
    id: swinburne
    title: "The principle of credulity"
    image:
      src: img/swinburne.webp
      alt: "Photograph of the philosopher Richard Swinburne in a bookshop"
      caption: "Richard Swinburne (born 1934), British philosopher of religion, who gave the principle of credulity its name and applied it to religious experience."
      credit: "Ziel, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Richard_Swinburne_2009_(3x4_cropped).jpg"
    body: |
      According to the philosopher **Richard Swinburne** (born 1934), in his book *The Existence of God* (first edition 1979, second edition 2004), there is a general rule about experience that he calls the **principle of credulity**. In essence: if it seems (epistemically) to a person that something $x$ is present, then probably $x$ is present, unless there are special considerations. *Epistemically* means that the seeming is the person's ground for believing, not just a mood.

      Notice what the rule says and what it does not. It does not say that every seeming is true. It says that, as a starting point, a seeming is **good evidence**, and that the evidence can be cancelled by a reason to doubt, which philosophers call a **defeater**. The burden then falls on whoever claims a defeater applies.

      According to Swinburne, the rule is not special to religion: we use it for the tree, the table and the face of a friend. The live question is whether it carries over to experiences that seem to be of God.

  - type: text
    id: argument
    title: "The argument, with numbered premises"
    body: |
      Here is the use of the principle as an argument. Let $X$ be the presence the experience seems to show (for a mystic, God), and let $S$ be a person who has the experience.

      **P1 (the experience).** It seems to $S$ that $X$ is present.

      **P2 (credulity).** If it seems to a subject that $x$ is present, then probably $x$ is present, unless a defeater applies.

      **P3 (no defeater).** No defeater applies to this experience.

      **C (the conclusion).** Probably $X$ is present.

      Two jobs follow, as for every classical argument: check that C follows from P1 to P3 (validity), then ask whether P1 to P3 are true (soundness). Note the word *probably*: the conclusion is modest. According to Swinburne himself, religious experience works as one strand in a cumulative case, not as a lone proof.

  - type: mcq
    id: p1-critic
    title: "P1: is it in dispute?"
    prompt: |
      P1 says: it seems to $S$ that $X$ is present. Which statement about P1 is the fairest?
    options:
      - text: 'P1 is a report of how things seemed, so it is usually granted; the disputes are about what the seeming is worth (P2) and whether anything cancels it (P3).'
        correct: true
        feedback: |
          Yes. A critic seldom doubts that mystics sincerely report such experiences (that is established). What they dispute is the step from the seeming to the presence.
      - text: 'P1 is the point of the whole argument: if the mystic really had an experience, the presence is proved.'
        feedback: |
          That treats P1 as C. Having an experience that seems to be of $X$ does not by itself show $X$ is there, as an illusion or a dream also seems to be of something.
      - text: 'P1 is false, because nobody has ever had an experience of God.'
        feedback: |
          That denies the report itself, which is documented in many traditions. A critic can say the experience was real but had another cause; that targets P2 or P3, not P1.
    explanation: |
      Keep two things apart: that the experience happened (layer 1, established) and that it was an experience *of* $X$ (the open question).

  - type: mcq
    id: p2-critic
    title: "P2: who pushes back?"
    prompt: |
      A critic says: "The principle of credulity works for perception because the rule is tested daily: if I think I see a chair, I can touch it, others can see it, and I seldom go wrong. Mystical seemings have no such track record." Which premise does the critic target, and how?
    options:
      - text: 'P2: the critic says the principle is justified for ordinary perception by checks that mystical experience lacks, so it should not be carried over to it.'
        correct: true
        feedback: |
          Yes. The reply of the other side (Swinburne, Alston) is that the principle is a basic rule of reasoning we cannot justify by tests without using it, so it applies to every kind of experience unless a defeater appears.
      - text: 'P1: the critic says the mystic did not really have the experience.'
        feedback: |
          The critic here does not doubt the experience, only what it is worth as evidence.
      - text: 'P3: the critic names a specific defeater, such as a drug.'
        feedback: |
          No drug is named. The critic attacks the rule itself (P2), not its application to a case (P3).
    explanation: |
      The pattern repeats through the lesson: P2 is about the rule in general, P3 about whether a cancelling reason applies to this case.

  - type: mcq
    id: p3-critic
    title: "P3: who pushes back?"
    prompt: |
      A critic says: "This mystic had the experience after three days of fasting and sleeplessness, and, the critic adds, such conditions can produce vivid false experiences." Which premise does the critic target?
    options:
      - text: 'P3: the critic claims a defeater (conditions known to be unreliable) applies to this case.'
        correct: true
        feedback: |
          Yes. The critic accepts the principle for ordinary cases (P2) and says that here a special consideration cancels it. Whether the claim about fasting is true of this case is then an empirical question.
      - text: 'P2: the critic rejects the principle of credulity altogether.'
        feedback: |
          The critic uses the idea of "known to be unreliable conditions", which is one of the exceptions *built into* the principle. That accepts P2.
      - text: 'C: the critic says the conclusion does not follow from the premises.'
        feedback: |
          The critic does not challenge the logic. The argument is valid; the fight is over whether P3 is true.
    explanation: |
      A defeater is accepted by the principle itself; the fight is whether it applies. If it does not apply, the evidence stands.

  - type: order
    id: order-validity
    title: "Checking validity apart from truth"
    prompt: |
      Put in order the way to evaluate the argument from experience.
    steps:
      - 'Write the premises: P1 (it seems that $X$ is present), P2 (credulity), P3 (no defeater applies).'
      - 'Check validity: if P1, P2 and P3 were all true, would C (probably $X$ is present) follow?'
      - 'It does: P2 says a seeming gives probable presence unless a defeater applies, P1 gives the seeming, P3 removes the exception.'
      - 'Only now ask about truth: which premise is open to doubt (P2 for the rule, P3 for the case)?'
      - 'Conclude: the argument is valid; it is sound only if P2 and P3 are true, so its force depends on them.'
    hint: 'Logic first (if the premises were true), truth second.'
    explanation: |
      Validity is about the shape of the argument, soundness about the truth of the premises. An argument can be valid and unsound, so a critic who rejects P2 or P3 has not found a logical flaw.

  - type: text
    id: alston
    title: "The analogy with perception"
    body: |
      According to the philosopher **William Alston** (*Perceiving God*, Cornell University Press, 1991), we can ask whether sense perception is reliable, but any proof we give uses perception (we check one sight against another sight or a touch). So we cannot show without **circularity** that perception is reliable, and yet we rightly trust it. In essence, he argued that the practice of forming beliefs from experiences of God is in the same position: a long-established practice, with its own standards and defeaters, that cannot be justified without circularity either, and that yields mostly consistent beliefs within a tradition.

      Two views meet here. The **analogy view** says that, if we do not demand a circle-free proof from perception, it is unfair to demand one from religious experience. The **disanalogy view** says perception is public and checkable (other people can see the tree and instruments can record it), while mystical reports are private and cannot be cross-checked in the same way. According to the Stanford Encyclopedia of Philosophy, Alston himself granted that other religious practices could make the same argument.

  - type: mcq
    id: alston-q
    title: "What does the analogy show?"
    prompt: |
      Alston argues that no one can prove perception reliable without circularity. A critic replies: "Perception is public and checkable; mystical experience is not." Which statement is the most accurate?
    options:
      - text: 'The analogy shows that "no circle-free proof" is not by itself a reason to reject religious experience; the critic''s reply adds a different point, that perception has outside checks, and whether that difference matters is the live question.'
        correct: true
        feedback: |
          Yes. The two points answer different things: Alston removes one objection, the critic puts forward another.
      - text: 'The analogy proves that religious experience is as reliable as perception.'
        feedback: |
          It does not prove reliability. It argues that both practices are in the same logical position about circularity, which is a much weaker claim.
      - text: 'The reply wins at once, since an experience nobody else can check has no evidential value.'
        feedback: |
          Private experiences (a pain, a dream) can still be evidence for the person, and the lack of outside checks lowers their force rather than removing it. How much it lowers it is part of the debate.
    explanation: |
      Another way to say it: the analogy argues about the rule (P2), the reply about how well the rule is supported in this area.

  - type: text
    id: diversity
    title: "The objection from diversity"
    body: |
      Mystics in different traditions report different things: a personal God, an impersonal ground of being, emptiness. If one report is right, it seems the incompatible ones are wrong, and then conflicting reports would **cancel** one another, as when two eyewitnesses contradict each other. According to the Stanford Encyclopedia of Philosophy, the diversity of religions is a *prima facie* defeater, meaning a defeater at first sight, which may be answered.

      Two replies. According to **John Hick** (*An Interpretation of Religion*, 1989), the traditions are culturally shaped responses to one ultimate reality, which none grasps directly, so the reports differ in form but do not truly contradict. According to Swinburne (as summarised in the literature), many descriptions of the supernatural refer to the same reality in different vocabularies. A second reply, from Alston and Plantinga, says each tradition gives its members resources that outsiders lack, so one can reasonably hold that some are right and others wrong. Each reply has a cost: Hick's view seems to say that no tradition's own claims are exactly true, and the second reply can be turned round by every tradition.

  - type: mcq
    id: diversity-q
    title: "Which reply is it?"
    prompt: |
      A philosopher says: "The reports of the traditions differ because each is shaped by its own culture; they are different responses to one ultimate reality that none grasps directly." Which reply to the diversity objection is this, and what is its main cost?
    options:
      - text: 'Hick''s pluralist reply; the cost is that it seems to deny that any tradition''s own description of the ultimate is literally true.'
        correct: true
        feedback: |
          Yes. Many believers hold that their description is literally true (God as a person, for instance), so the reply asks them to give that up, and critics say it should explain how conflicting truth claims can be authentic manifestations of one Real.
      - text: 'Alston''s and Plantinga''s reply that each tradition has its own epistemic resources; the cost is that other traditions can say the same.'
        feedback: |
          That is the second reply, which grants that the traditions conflict. The reply described here says the conflict is only in form, which is Hick''s.
      - text: 'The principle of credulity itself, which says every seeming is true.'
        feedback: |
          The principle does not say every seeming is true, and it is the thing the objection attacks. Diversity is a challenge to it, not a reply.
    explanation: |
      Notice that neither reply makes the diversity vanish; each says what diversity should be taken to show.

  - type: text
    id: defeaters
    title: "Defeaters"
    body: |
      According to Swinburne, there are four kinds of special consideration that can cancel the principle for a given experience: (1) it occurred under conditions known to be unreliable, such as drunkenness or a drug like LSD; (2) the person claims to perceive an object of a kind for which such claims have often been shown false; (3) other well-supported knowledge makes it very unlikely that the object was there; (4) even if the object was there, it probably did not cause the experience. He holds that these do not apply to all, or perhaps most, religious experiences.

      Critics suggest candidates: drugs, a brain state that a stimulus could produce, suggestion by a group's expectations. The reply to each is the same in form: a defeater counts only if it **applies to the case**. That drugs can produce experiences like some mystical ones does not show that this experience, with no drug, was drug-caused. And, according to one standard reply, the fact that every experience has a brain state does not by itself show it is illusory, just as having a visual brain state does not show the tree is not there.

  - type: mcq
    id: defeater-q
    title: "Which kind of defeater?"
    prompt: |
      A person reports an experience of a presence in a room, after taking a drug known to cause such experiences. In Swinburne's list of special considerations, which kind applies, and what must be shown for it to defeat the report?
    options:
      - text: 'Conditions known to be unreliable; one must show that this experience came under such conditions and that they affect the content, not just that drugs can cause some experiences.'
        correct: true
        feedback: |
          Yes. The defeater is about this case: the drug was taken, and drugs of that kind are known to produce this sort of experience. Then the likelihood ratio drops, because the experience is expected even if the presence is absent.
      - text: 'Other well-supported knowledge; the drug proves the presence is impossible.'
        feedback: |
          A drug cannot prove that nothing was in the room. The drug is a reason for the experience to occur whatever is there, which is a different kind of defeater.
      - text: 'No defeater, because feeling a presence is itself the evidence.'
        feedback: |
          That ignores the cancelling reason. The principle itself lists unreliable conditions as an exception.
    explanation: |
      The next cards turn this into numbers: the experience is evidence because it is more likely if the presence is there; a defeater makes it about equally likely either way.

  - type: widget
    id: widget-defeater
    title: "What a defeater does to the odds"
    widget: odds-updater
    config:
      prior: 0.1
      lr: 20
      priorSlider: false
      presets:
        - { label: "No defeater: LR 20", lr: 20 }
        - { label: "Drug-like defeater: LR 1.5", lr: 1.5 }
        - { label: "Full defeater: LR 1", lr: 1 }
    body: |
      A toy case. The prior probability that $X$ is present is $0.1$. The likelihood ratio (LR) is how many times likelier the seeming is if $X$ is present than if it is absent. Drag the LR slider, then press the presets. Watch the orange row (what the experience adds) shrink as a defeater lowers the LR, and the posterior fall back toward the prior.
    review: false

  - type: numeric
    id: post-no-defeater
    title: "Posterior with no defeater"
    prompt: |
      Toy numbers: the prior probability that $X$ is present is $0.1$, and the seeming is $20$ times likelier if $X$ is present than if it is absent. By posterior odds $=$ LR $\times$ prior odds, what is the posterior probability that $X$ is present (as a decimal)?
    answer: 0.69
    tolerance: 0.01
    answerText: '0.69'
    wrong:
      - { value: 0.5, feedback: 'Even odds would need an LR of $9$, not $20$. The prior odds are $0.1/0.9=1/9$, and multiplying by $20$ gives odds $20/9$.' }
      - { value: 0.18, feedback: 'That uses $0.1\times 20 = 2$ as if it were odds. The prior *odds* are $1/9$, not $0.1$.' }
    hint: 'Prior odds are $p/(1-p)$; multiply by the LR; turn the odds $o$ back into $o/(1+o)$.'
    explanation: |
      Prior odds $0.1/0.9=1/9$. Posterior odds $20/9\approx2.22$. Posterior probability $2.22/3.22\approx0.69$. The experience raised the probability from $0.1$ to about $0.69$.

  - type: numeric
    id: post-defeater
    title: "Posterior with a defeater"
    prompt: |
      Same prior ($0.1$). Now the person took a drug that makes such a seeming nearly as likely whether or not $X$ is present, so the LR falls to $1.5$. What is the posterior probability that $X$ is present (decimal)?
    answer: 0.14
    tolerance: 0.005
    answerText: '0.14'
    wrong:
      - { value: 0.69, feedback: 'That is the posterior with LR $20$, as if the drug made no difference. The defeater is exactly what lowers the LR.' }
    hint: 'Posterior odds $=1.5\times 1/9=1/6$.'
    explanation: |
      Posterior odds $1.5/9=1/6$, probability $(1/6)/(7/6)=1/7\approx0.143$. The defeater did not make the experience worthless, since $1.5>1$, but it almost removed what it added. A full defeater gives LR $1$ and posterior $0.1$.

  - type: widget
    id: widget-prior
    title: "Same evidence, different priors"
    widget: odds-updater
    config:
      prior: 0.5
      lr: 20
      lrSlider: false
      presets:
        - { label: "Prior 0.5", prior: 0.5 }
        - { label: "Prior 0.01", prior: 0.01 }
        - { label: "Prior 0.001", prior: 0.001 }
    body: |
      Now the LR is fixed at $20$ (the experience counts as evidence, with no defeater), and only the prior moves. Press the three presets and read the posterior probability. Two people who agree the experience is evidence can still end far apart.
    review: false

  - type: numeric
    id: lr-needed
    title: "How strong must the experience be?"
    prompt: |
      A person starts with prior probability $0.01$ that $X$ is present (prior odds $1/99$). What likelihood ratio would make the posterior exactly even odds?
    answer: 99
    tolerance: 0.5
    answerText: '99'
    wrong:
      - { value: 100, feedback: 'Close, but the prior odds are $0.01/0.99=1/99$, not $1/100$.' }
      - { value: 20, feedback: 'With LR $20$ the posterior odds are $20/99\approx0.2$, only about $17\%$.' }
    hint: 'Even odds means posterior odds $=1$, so LR $\times \tfrac1{99}=1$.'
    explanation: |
      Posterior odds $=$ LR $\times\,1/99=1$ gives LR $=99$. A low prior demands a strong experience, which is how a sceptic and a believer can both be consistent with the same report. For the principle of credulity the live question is how large the LR of a mystical seeming is, and that is where the sides differ.

  - type: mcq
    id: trap-seems
    title: "Trap: seems is not is"
    prompt: |
      A friend says: "The principle of credulity says that whatever seems true to you is true, so if the mystic says she met God, that settles it." Which statement corrects the friend best?
    options:
      - text: 'The principle says a seeming is good *evidence* that holds *unless a defeater applies*; the result is a probability that can be cancelled or outweighed by a low prior, not a proof.'
        correct: true
        feedback: |
          Yes. The argument concludes "probably", and its force is graded by the likelihood ratio and the prior.
      - text: 'The principle is false because things sometimes seem to be one way and are another.'
        feedback: |
          That is why the principle is *defeasible*. Mirages do not show that seemings are worthless as evidence; they show that seemings can be cancelled, which the principle already allows.
      - text: 'The friend is right, because only the person who has the experience can judge it.'
        feedback: |
          Others can judge the reasons: whether a defeater applies, what the prior is, how the report fits others. A seeming is evidence for the one who has it, but it is not self-certifying.
    explanation: |
      Seeming gives probability, not certainty, and probability depends on defeaters and priors.

  - type: mcq
    id: trap-nodefeater
    title: "Trap: no defeater is not a proof"
    multiple: true
    prompt: |
      Suppose no defeater applies to a mystic's experience. Select **all** the statements that are correct.
    options:
      - text: 'The seeming remains good evidence that $X$ is present.'
        correct: true
        feedback: |
          Right: without a defeater the likelihood ratio stays above $1$.
      - text: 'The posterior probability can still be low if the prior is very low.'
        correct: true
        feedback: |
          Right: with a prior of $0.001$ and LR $20$ the posterior is only about $0.02$.
      - text: 'It follows that $X$ is certainly present.'
        feedback: |
          The argument concludes "probably", and only given a prior that is not too small. "No defeater" removes a reason against, not all reasons against.
      - text: 'Two people with different priors may both reason correctly and still disagree.'
        correct: true
        feedback: |
          Right: the odds form multiplies the same LR by different prior odds. The disagreement is then about the prior, which comes from the whole worldview.
    explanation: |
      "No defeater" means the argument is not blocked, not that it is finished. The prior and the strength of the LR still decide where one ends.

  - type: mcq
    id: layers
    title: "Where thoughtful people part ways"
    prompt: |
      The course sorts claims into three layers: (1) established fact, (2) live scholarly debate, (3) faith or metaphysical commitment. Which statement is a **layer 2** claim?
    options:
      - text: 'The principle of credulity applies to religious experience as it does to sense perception.'
        correct: true
        feedback: |
          Yes. Philosophers defend it (Swinburne, Alston) and reject it (those who stress the lack of checks), with arguments on both sides.
      - text: 'Many people in many traditions report experiences that seem to them to be of a divine presence.'
        feedback: |
          This is established (layer 1), a fact about reports.
      - text: 'The presence they report is God as a person.'
        feedback: |
          This is a metaphysical or faith commitment (layer 3), held by some traditions and denied by others, including those who read the same experience differently.
    explanation: |
      The sides part ways in three places: whether P2 holds for religious experience, whether a defeater applies (P3), and what prior one brings. Each is a different kind of disagreement.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** a concept lesson, The Brain on Religious Experience. If a brain state accompanies every experience, what do brain scans, seizures and electrical stimulation show about religious experience, and how far do they act as the defeater this lesson described?
