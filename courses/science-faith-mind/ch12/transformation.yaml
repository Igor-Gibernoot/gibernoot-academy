id: ch12-transformation
title: "Do Experiences Change Lives?"
kind: concept
own: |
  The setting: a person has a religious or mystical experience $E$ that seems to be of some presence $X$ (God, an ultimate reality), and later their life changes, for better or worse. Two questions must be kept apart: whether $E$ changes lives (an empirical question) and whether the change shows that $X$ is real (a question of evidence). Write $G$ for a good outcome, $P(G\mid X)$ for how likely it is if $X$ is real and $P(G\mid \text{not }X)$ for how likely it is if $X$ is not real but the person sincerely believes.
  - **What studies found.** According to Pahnke's Good Friday study (1962), 20 divinity students received psilocybin or niacin (an active placebo) in a chapel service, and according to Doblin's follow-up (1991) the psilocybin group still described a genuine mystical experience about 25 years later, though the blinding was flawed. According to Griffiths and colleagues (2008), of 36 religiously active volunteers given psilocybin under supportive conditions, 58% rated the session among the five most personally meaningful experiences of their lives 14 months later, a self-report from selected volunteers.
  - **Conversion changes goals more than traits.** According to Paloutzian, Richardson and Rambo (1999), conversion tends to change the middle layers of personality (purposes, values, identity, ultimate concern) more than core traits.
  - **A good outcome has weak force for truth.** Its evidential force is the likelihood ratio:
  {{ $$\text{LR}=\frac{P(G\mid X)}{P(G\mid \text{not }X)}$$ }}
  If sincere belief in a false $X$ would produce the same benefit, then $\text{LR}\approx 1$ and the odds barely move:
  {{ $$\text{posterior odds}=\text{prior odds}\times\text{LR}$$ }}
  Toy case: prior $0.5$, $P(G\mid X)=0.8$, $P(G\mid\text{not }X)=0.7$ gives $\text{LR}\approx1.14$ and posterior $\approx0.53$.
  - **Fruits and roots.** A fruit (the effect on a life) can show that an experience is *worth having*, which is a claim about value. It does not by itself show the experience is *true*, and a harm does not by itself show it false. {{ **Value and truth are different questions** }}, and a good study separates them with controls, blinding and comparison groups.
  - **Three layers.** That some experiences are followed by lasting self-reported benefit is established in some groups; how much is due to the experience, expectation or selection is a live debate; whether the benefit reflects a real presence is a commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: a retreat changed her"
    prompt: |
      Guessing is the point; no theory yet. A friend came back from a silent retreat convinced she had felt a divine presence. Ten years later she is kinder, calmer and still talks about it. A relative says: "A change that good could not come from a mistake, so her experience must have been real." Which first reaction is the fairest?
    options:
      - text: 'Her life really changed, and that matters; but a good result can follow from a mistaken belief too, so it is a further step to say the belief was true.'
        correct: true
        feedback: |
          Yes. Two claims are mixed: that the experience did her good (a claim about her life) and that what it seemed to show was real (a claim about the world). The first can be well supported while the second stays open.
      - text: 'Her change proves nothing at all, because people always imagine such improvements.'
        feedback: |
          This is too strong. Lasting change in values, habits and well-being can be measured and is real in many cases. The point is only that it does not settle what caused it or what it was of.
      - text: 'If she were wrong she would not have become kinder, so the experience was surely real.'
        feedback: |
          This is the relative's step in other words. People are sometimes helped by false beliefs (a placebo works without the drug), so benefit alone cannot separate the two cases.
    explanation: |
      Keep two questions apart all lesson: *what do experiences do to lives?* and *what does that show about what they were of?*

  - type: text
    id: why
    title: "Why this topic exists"
    body: |
      In the lesson The Varieties of Religious Experience, William James proposed, in essence, that religious states should be judged by their fruits, not their roots, using the old saying "by their fruits ye shall know them": by what they do in a life, not by where they came from. Fruits are therefore a natural test, and the lesson Experience as Evidence asked what evidence an experience gives. This lesson asks what the *long-term effects* add.

      James's own data point both ways. According to Starbuck's surveys, which James reports, a conversion often brought a high point of feeling that did not last, and backsliding followed in nearly all the cases he studied. So "do experiences change lives?" has an empirical answer that is partly yes, partly no, and it depends on the person, the setting and how it is measured. The second question, "does a good change show the experience was true?", is a question of logic about evidence.

  - type: text
    id: goodfriday
    title: "The Good Friday experiment"
    body: |
      On Good Friday, 20 April 1962, in the Marsh Chapel of Boston University, the physician Walter Pahnke ran an experiment for his Harvard doctorate, supervised by Timothy Leary and Richard Alpert. Twenty graduate divinity students, randomly split into two groups, listened to a service. Half received psilocybin, the active compound of "magic mushrooms". The others received a large dose of niacin (a vitamin that makes the skin flush and tingle), an **active placebo**: a pill with a noticeable body effect, so that people cannot tell at once which group they are in.

      According to the accounts, almost all of the psilocybin group reported profound religious experiences.

  - type: mcq
    id: placebo-q
    title: "Why niacin?"
    prompt: |
      In a study of whether a drug produces religious experiences in a chapel, half the divinity students get psilocybin and half get niacin, which makes the face flush and the skin tingle. Why use niacin rather than a pill with no effect at all?
    options:
      - text: 'A pill with no effect would let people guess they got a placebo, and expecting nothing would itself change the report; niacin makes both groups feel that something is happening.'
        correct: true
        feedback: |
          Yes. If the comparison group knows it got nothing, the groups differ in expectation as well as in the drug. An active placebo reduces that gap, though it cannot remove it, since some niacin recipients may still guess.
      - text: 'Niacin is a mild religious drug and shows that all substances cause such experiences.'
        feedback: |
          Niacin is a vitamin; the study chose it for its body effects, not for religious ones.
      - text: 'It makes the study cheaper than a real placebo.'
        feedback: |
          Cost played no part in the logic. The point was to keep the two groups equally expectant.
    explanation: |
      The question is always what the *comparison group* is a comparison for. A good control equalizes everything except the factor under test.

  - type: text
    id: doblin
    title: "Twenty-five years later"
    body: |
      Rick Doblin, then a student at New College of Florida, traced the participants about 25 years later and published the result in 1991 in the *Journal of Transpersonal Psychology*. According to his follow-up, all the psilocybin subjects but one described their experience as having elements of a genuine mystical nature, and many called it a high point of their spiritual lives. He concluded that the study cast considerable doubt on the claim that drug-induced mystical experiences are inferior to non-drug ones.

      Doblin also criticized the original study: the double-blind (neither side knowing who received which pill) had been carried out incorrectly, some questionnaire items were imprecise, and several participants had acute anxiety during the session, one so severely that he was restrained and given a sedative after leaving the chapel.

  - type: mcq
    id: doblin-q
    title: "What can twenty-five-year recall show?"
    prompt: |
      Twenty-five years after the Good Friday study, former psilocybin students said the session was a high point of their spiritual lives. Which statement is best supported by this alone?
    options:
      - text: 'It shows that these people, looking back, value the session highly; it does not show how much it changed their lives, because memory, later events and a flawed blinding could all contribute.'
        correct: true
        feedback: |
          Yes. A long-term report is a *self-report from memory*, and the sample is small (20 people, not all of them reached). The finding is real but modest; it is suggestive that the experience stayed meaningful.
      - text: 'It proves the drug opened a real contact with God.'
        feedback: |
          Even a perfect study of effects would not show the source. And this study had known flaws. The inference jumps from value to truth.
      - text: 'It proves nothing, because the study had flaws.'
        feedback: |
          Flaws limit what can be concluded; they do not turn a finding into nothing. The students did report lasting meaning, and that is data about the experience, even if weak data about causes.
    explanation: |
      Both extremes (proves everything, proves nothing) skip the work of saying exactly what the data support.

  - type: text
    id: griffiths
    title: "A better-controlled test"
    body: |
      A team at Johns Hopkins led by Roland Griffiths ran a more carefully controlled study, published in 2006: a double-blind trial of a high dose of psilocybin against methylphenidate (a stimulant), given to volunteers under supportive conditions. In 2008 the team reported a follow-up of 36 of these volunteers, adults with no earlier experience of such drugs who took part regularly in religious or spiritual activities.

      According to the 2008 abstract, 14 months after the session 58% of the volunteers rated it among the five most personally meaningful experiences of their lives, and 67% among the five most spiritually significant. In the authors' analysis, the mystical-type experience on the session day was central to those high ratings. The authors noted that the setting was set up to favour positive experiences, with many hours of preparation.

  - type: numeric
    id: griffiths-n
    title: "How many people is 58%?"
    prompt: |
      In a follow-up of 36 volunteers, 58% rated a session among the five most personally meaningful experiences of their lives. About how many of the 36 volunteers is that? (Give the nearest whole number.)
    answer: 21
    tolerance: 0.5
    wrong:
      - { value: 58, feedback: 'That is the percentage itself. A percentage of 36 people gives a count smaller than 36.' }
      - { value: 36, feedback: 'That is everyone. 58% is a bit more than half of the group.' }
    hint: 'Take 58 hundredths of 36.'
    explanation: |
      $0.58\times36=20.88$, so about 21 people. The count shows how small the groups behind such percentages are: a few people more or less change the percentage by several points.

  - type: mcq
    id: griffiths-q
    title: "Reading the follow-up fairly"
    prompt: |
      In the 2008 follow-up, volunteers who were religiously active, chosen for the study and prepared for many hours, mostly rated a psilocybin session as highly meaningful 14 months later. Which limit is the most important for judging what this shows about the experience in general?
    options:
      - text: 'The volunteers were selected, prepared and expecting something meaningful, and the ratings are self-reports, so the result may not carry over to other people or settings.'
        correct: true
        feedback: |
          Yes. Selection (who is in the sample), expectation (what they were prepared to find) and self-report (how the outcome is measured) are the three standard limits. They do not cancel the finding; they mark where it stops.
      - text: 'Psilocybin is illegal, so the data are worthless.'
        feedback: |
          Legal status is not a reason to doubt the numbers. The question is how the study was built and whom it covers.
      - text: 'Nobody can rate the meaning of their own experience.'
        feedback: |
          People can report their own evaluations, and those reports are the right data for a question about meaning. The limit is generalizing from a selected group, not the possibility of rating.
    explanation: |
      A fair reading says: in this group, under these conditions, many people kept calling the session meaningful. A further study would ask whether other groups, other settings and objective measures agree.

  - type: text
    id: conversion
    title: "Conversion and personality"
    body: |
      Psychologists have also studied **religious conversion**: a deep change of religious commitment. Raymond Paloutzian, James Richardson and Lewis Rambo (1999, *Journal of Personality*) reviewed whether conversion changes personality. In essence, they concluded that conversion changes the middle layers of a person (purposes, values, identity, what the person ultimately cares about) more than the core traits, such as how outgoing or open someone is. A person who was sociable before conversion is likely still sociable afterwards, but may now spend that sociability on different goals.

  - type: mcq
    id: conversion-q
    title: "Which change would count?"
    prompt: |
      After a conversion, a person's goals, values and sense of identity change, but their scores on a standard measure of sociability stay the same. According to the review of conversion research, how does this fit?
    options:
      - text: 'It fits: conversion tends to reshape purposes and values more than core traits, so both findings can hold at once.'
        correct: true
        feedback: |
          Yes. "Did the person change?" has no single answer: it depends on which layer is measured. A study that measures only core traits can miss a real change in values.
      - text: 'It shows the conversion was fake, because a real change must alter every trait.'
        feedback: |
          Nothing requires change in every layer. People can change what they strive for while keeping a temperament.
      - text: 'It shows the person was lying about the values.'
        feedback: |
          A stable trait score is not evidence against changed values; different measures track different layers.
    explanation: |
      The practical lesson for reading studies: ask which part of the person was measured and how.

  - type: text
    id: fruits
    title: "What a good outcome can and cannot show"
    body: |
      Suppose the best studies agree that an experience does good: higher well-being, kinder behaviour, lasting meaning. The remaining question is what this shows about the presence $X$ the experience seemed to be of. Write $G$ for a good outcome. Its evidential force is the ratio of how likely it is if $X$ is real to how likely it is if $X$ is not real:

      $$\text{LR}=\frac{P(G\mid X)}{P(G\mid \text{not }X)}$$

      The key is the denominator. If a person who sincerely *believes* in a presence, even a false one, would benefit about as much, then the two probabilities are close and the ratio is near 1. A good outcome then tells us that belief and practice can help, which is a claim about value, not about truth.

      Believers reply that a real presence best explains why the benefit is deep and lasting, so the denominator is smaller than skeptics think. That is a substantive claim, to be argued with evidence, not assumed.

  - type: numeric
    id: fruits-n
    title: "How much should a good outcome move you?"
    prompt: |
      Start with probability $0.5$ that a presence $X$ is real. A lasting good outcome $G$ has probability $0.8$ if $X$ is real, and $0.7$ if $X$ is not real but the person sincerely believes it is. What is the probability that $X$ is real after seeing $G$? (Give a decimal.)
    answer: 0.533
    tolerance: 0.005
    wrong:
      - { value: 0.8, feedback: 'That is $P(G\mid X)$, not the posterior. You need to weigh it against $P(G\mid\text{not }X)$.' }
      - { value: 0.7, feedback: 'That is the chance of a good outcome without the presence. The posterior compares both cases.' }
    hint: 'Prior odds are 1 to 1. Multiply by the ratio $0.8/0.7$, then turn odds into a probability.'
    explanation: |
      The ratio is $\text{LR}=0.8/0.7\approx1.143$. Prior odds are $1$, so posterior odds are $1.143$, and the probability is $1.143/(1+1.143)\approx0.533$. A benefit that is likely with or without the presence barely moves the estimate, from $0.5$ to $0.53$.

  - type: build
    id: odds-b
    title: "Build the update rule"
    prompt: |
      Posterior odds are the prior odds scaled by how well the evidence favours the hypothesis over its rival. Build the rule, using the likelihood ratio LR.
    prefix: 'posterior odds ='
    tiles: ['\text{prior odds}', '\times', '\text{LR}', '+', '\text{LR}^{-1}']
    answers:
      - ['\text{prior odds}', '\times', '\text{LR}']
      - ['\text{LR}', '\times', '\text{prior odds}']
    wrong:
      - { answer: ['\text{prior odds}', '+', '\text{LR}'], feedback: 'Odds are scaled, not shifted: evidence multiplies them. Adding would not give 1 for no evidence.' }
    hint: 'No evidence means LR = 1 and the odds must stay as they were.'
    explanation: |
      Multiplying by $\text{LR}=1$ leaves the odds unchanged, which is why a benefit that appears with or without the presence moves nothing.

  - type: mcq
    id: harm-q
    title: "The reverse mistake"
    prompt: |
      Some participants in the Good Friday study had acute anxiety during the session, and one was restrained after leaving the chapel. A critic says: "That harm shows the experience was not of anything real." Which reply is best?
    options:
      - text: 'Harm and truth are separate: a real thing can be frightening (the lesson The Numinous and Awe described awe that includes dread), and a false belief can be pleasant. Distress is evidence about risk, not about the source.'
        correct: true
        feedback: |
          Yes. The same logic that blocks "good, so true" blocks "bad, so false". Distress is important data about safety and about how to run such studies, which is how the later trials were designed.
      - text: 'Harm is irrelevant to everything, so it should be ignored.'
        feedback: |
          Harm matters a great deal for ethics and for whether such experiences should be sought or studied. It is only silent on the truth of the source.
      - text: 'Only good outcomes count as data about the experience.'
        feedback: |
          That would select the evidence. A fair study counts good, bad and neutral outcomes.
    explanation: |
      Evidence about effects must be gathered from everyone who had the experience, not only from those who found it beneficial.

  - type: mcq
    id: views
    title: "Where thoughtful people part ways"
    prompt: |
      Everyone agrees that some experiences are followed by lasting benefit. A theist, a pragmatist and a skeptic read that fact differently. Which pairing of reading and premise is correct?
    options:
      - text: 'The theist reads the benefit as fitting a real presence; the pragmatist values the benefit whatever its source; the skeptic says the same benefit would follow from sincere belief in a false presence.'
        correct: true
        feedback: |
          Yes. They agree on the data and differ on one premise: the size of $P(G\mid\text{not }X)$ for the theist and skeptic, and for the pragmatist whether the truth question has to be answered at all to value the fruit.
      - text: 'The skeptic denies that anyone benefits, the theist says all benefit, and the pragmatist says no one can tell.'
        feedback: |
          These are caricatures. The live disagreement is about what the benefit shows, not about whether it occurs.
      - text: 'All three say the benefit proves the presence is real.'
        feedback: |
          Only some versions of the first view say this, and careful versions of it argue for it rather than assuming it.
    explanation: |
      The disagreement is located in a premise, which is what the course asks you to find.

  - type: order
    id: design
    title: "Design a fair test of long-term effects"
    prompt: |
      A team wants to test whether a one-day experience lastingly changes well-being. Put the steps of a fair design in order.
    steps:
      - 'Measure well-being in everyone before the session (a baseline).'
      - 'Assign people to the experience or an active comparison at random.'
      - 'Keep participants and raters blind to who received which, as far as possible.'
      - 'Run the session under the same conditions for both groups.'
      - 'Measure well-being again after months, with the same instruments, for everyone.'
    hint: 'You cannot see a change without a before; you cannot compare without a fair split; the later measure comes last.'
    explanation: |
      The baseline lets you see change, random assignment spreads selection evenly, blinding limits expectation, equal conditions isolate the factor, and the follow-up measures the long term. Even this design leaves the truth of the experience's content untouched: it answers the question about effects.

  - type: mcq
    id: summary-q
    title: "One sentence"
    prompt: |
      Which sentence best sums up what long-term studies of religious experience can do?
    options:
      - text: 'They can show what experiences do to lives and under what conditions; they cannot, by themselves, show whether the presence the experience seemed to be of is real.'
        correct: true
        feedback: |
          Yes. Effects are an empirical question for psychology; the truth of the content is a further question for evidence and argument, of the sort in the earlier lessons on evidence.
      - text: 'They can show that the experiences are true when the outcomes are good.'
        feedback: |
          This is the step the lesson warned against: it ignores that the benefit might follow equally from a mistaken belief.
      - text: 'They can show that the experiences are false when the studies have flaws.'
        feedback: |
          Flaws in a study limit its conclusions; they do not refute the content of the experience.
    explanation: |
      Value and truth are different questions, and a study of effects answers only the first.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** a round of traps on everything in this level, each built on a common slip, from "a brain scan explains it away" to "a good result proves it".
