id: ch25-death
title: "Facing Death"
kind: concept
own: |
  The setting: a person who knows they will die asks what death is, whether it is bad, and how to meet it. Answers are told *according to* the thinkers and traditions named, not as the course's verdict.
  - **Epicurus.** According to Epicurus, only experiences matter, and death ends experience, so death is nothing to us:
  {{ $$\begin{aligned}&\text{when we are, death is not;}\\&\text{when death is, we are not}\end{aligned}$$ }}
  - **Nagel's deprivation reply (1970).** According to Nagel, death is bad when and because it removes goods the life would have held, even though the dead person feels nothing:
  {{ $$\begin{aligned}&\text{badness of death}\\&=\text{value of the life it removes}\end{aligned}$$ }}
  - **Williams's Makropulos case (1973).** According to Williams, an endless life would be unattractive: a person who stays the same person eventually has no *categorical desires* left (desires that give a reason to go on living, not conditional on being alive), so {{ endless life ends in boredom, or in a change so deep that it is no longer the same person }}. Critics such as Fischer reply that a life need not go dull.
  - **Stoics.** According to Epictetus, what is up to us is our judgments, not death itself. Fear rests on the judgment that death is terrible, and the exercise is to keep death in view each day (*premeditatio*, rehearsing a misfortune in advance) so that it holds less power over our judgments.
  - **Abrahamic hereafters.** Hebrew Bible: the dead go to Sheol, a shadowy realm; later texts (Daniel) and rabbinic Judaism add {{ resurrection of the dead and the world to come }}. Christians confess {{ the resurrection of the dead and the life of the world to come }}, and differ on whether the soul survives in between. Muslims hold a death, a waiting state (*barzakh*), resurrection and judgment.
  - **Rebirth.** Hindu traditions: an unchanging self (*atman*) passes through rebirth (*samsara*) shaped by karma, until liberation (*moksha*). Buddhist traditions: with no unchanging self (*anatta*), what continues is a causal stream of {{ conditioned states, like a flame passed from candle to candle }}, until nirvana ends rebirth.
  - **Where thoughtful people part ways.** Fact: who held which view and what the texts say. Live debate: whether death harms the dead, whether endless life would be tedious, how to read texts on the hereafter. Commitment: whether anything survives death.

cards:
  - type: text
    id: hook
    title: "The pill"
    body: |
      Someone offers you a pill. If you take it, you stop ageing and cannot die of illness or time. You can still be killed by accident, but if you are careful you may live for thousands of years. There is no catch about health.

      Before any theory, decide: do you take it? And would you still want it after a thousand years, and after ten thousand?

      This lesson sets out what philosophers and religious traditions say about death: whether it is bad, whether endless life would be good, and what each tradition teaches about what comes after. Each is told in its own terms, *according to* those who hold it, and the lesson does not choose.

  - type: mcq
    id: guess
    title: "Guess first"
    multiple: true
    prompt: |
      Suppose a friend refuses the pill. Which of these reasons would you count as a serious philosophical candidate? Select every one you would consider.
    options:
      - text: "After enough centuries I would run out of things I want, and life would go flat."
        correct: true
        feedback: |
          A serious candidate. It is the line of Bernard Williams's essay on immortality, taken up below.
      - text: "The person who lives on after many centuries might hardly be me."
        correct: true
        feedback: |
          A serious candidate. It is the second half of Williams's argument, and it connects to the puzzle of personal identity.
      - text: "Death gives a life its shape, so a life without end could lose its meaning."
        correct: true
        feedback: |
          A position people often raise. A critic replies that meaning needs good activity, not an ending.
      - text: "The pill would not work, because science has shown that no pill can ever stop ageing."
        feedback: |
          Not a philosophical reason. Nobody has shown that, and the question assumes the pill works. Thought experiments ask what follows if it did.
    explanation: |
      The first three are real arguments about whether endless life is good. A person may also say yes to the pill for good reasons. The lesson first asks whether death is bad at all, then whether its absence would be good, and then what traditions say about what lies beyond.

  - type: text
    id: epicurus
    title: "Death is nothing to us"
    image:
      src: img/epicurus.webp
      alt: "Marble bust of Epicurus, a bearded man with a thoughtful expression"
      caption: "A Roman marble copy of a lost Greek portrait of Epicurus, who founded the Garden in Athens and taught that death is nothing to us."
      credit: "ChrisO, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Epicurus_bust.jpg"
    body: |
      Recall the argument of Epicurus from the lesson Epicureanism and Hedonism. **P1:** only experiences matter, since good and bad lie in sensation. **P2:** death ends all experience. **C:** so death is nothing to us. According to the Stanford Encyclopedia of Philosophy, Epicurus's line is that when we are, death is not, and when death is present, we are not.

      The poet Lucretius added a *symmetry argument*. Before we were born we did not exist for a very long time, and nobody minds that. The time after death will be just as empty, so there is nothing to mind there either.

      Here is the question to carry forward. If you accept the symmetry, what would still need to be true for the argument to work? And is anything missing from the two empty stretches, the one before birth and the one after death?

  - type: mcq
    id: symmetry
    title: "Before birth, after death"
    prompt: |
      Lucretius says: "I do not mind the endless time before I was born, so I should not mind the endless time after I die." Which reply, as the Stanford Encyclopedia reports it, points to a real difference between the two?
    options:
      - text: "Birth begins a life that is good, while death ends one, so the two are not alike. We also have a reasonable preference about our future over our past."
        correct: true
        feedback: |
          Yes. These are replies the encyclopedia lists: death takes goods away that we would have had, while the time before birth takes nothing from us, and caring more about the future than the past is not obviously irrational.
      - text: "We do mind the time before birth as much as the time after death."
        feedback: |
          Hardly anyone reports this, and the symmetry argument depends on it being false. The reply here is that the two stretches differ, not that we should mourn both.
      - text: "Death is painful, and the time before birth is not."
        feedback: |
          A reply that Epicurus can accept, since pain would be an experience. The reply that matters is about what is lost, even when nothing is felt.
      - text: "After death there are experiences, and there were none before birth."
        feedback: |
          This is the reply of someone who believes in an afterlife. It denies P2, which is a different objection. The reply asked about accepts that death ends experience.
    explanation: |
      The reply accepts that the dead feel nothing. It says that something can still be bad for a person without being felt: the future that was taken.

  - type: text
    id: nagel
    title: "Nagel: death as deprivation"
    image:
      src: img/nagel.webp
      alt: "Portrait photograph of the philosopher Thomas Nagel"
      caption: "Thomas Nagel, American philosopher, whose 1970 paper 'Death' argued that death is bad because it deprives us of goods."
      credit: "Nagelt, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Nagel_(cropped).jpg"
    body: |
      Thomas Nagel's paper "Death" (*Noûs*, 1970) gives the best known answer. According to Nagel, as later writers summarise him, death is bad for the one who dies because it **deprives** them of the goods they would otherwise have had. Nothing needs to be felt. Think of a person who is cheated of an inheritance and never finds out. Nothing hurts, yet something bad has happened to them.

      On this view the badness of a death is the **value of the life it removes**. A death at 20 takes more than a death at 90. Death is not bad because the dead suffer, and it is not bad because the living grieve. The Stanford Encyclopedia of Philosophy calls this the **deprivation** account and notes that it needs no painful experience of being dead.

      The account rejects P1 of Epicurus, the premise that only experiences matter. A person can be harmed by what they never feel. A critic can still ask how something can be bad for someone who does not exist when it happens. Nagel and his followers have answers, and the debate is live.

  - type: mcq
    id: nagel-q
    title: "Why is death bad?"
    prompt: |
      According to Nagel's deprivation account, why is death bad for the person who dies?
    options:
      - text: "It takes away goods that the person's life would otherwise have held, even though the dead person feels nothing."
        correct: true
        feedback: |
          Yes. The harm is the loss of the future, judged by what the life would have contained.
      - text: "Dying is usually painful, and the pain is the harm."
        feedback: |
          On Nagel's view, pain is not the point. A painless death in sleep is still bad if it removes years of good life.
      - text: "The dead person is aware of the loss and suffers for it."
        feedback: |
          If the dead were aware of anything, there would be an afterlife. Nagel's account assumes the dead feel nothing, and still finds a harm.
      - text: "Death is bad only for the people who loved the dead person."
        feedback: |
          Their grief is real, but the account is about harm to the one who dies, not only to the survivors.
    explanation: |
      Both sides agree that the dead feel nothing. Epicurus says that makes death nothing to us. Nagel says it does not, because a loss need not be felt. They part ways on one premise: whether only experiences matter.

  - type: text
    id: williams
    title: "Williams: would endless life be good?"
    body: |
      If death is bad because it takes goods away, would having no death be good? Bernard Williams (1929 to 2003) argued otherwise in "The Makropulos Case", an essay of 1973 in his book *Problems of the Self*. The title refers to a play by Karel Čapek, first staged in 1922, and the opera Leoš Janáček made of it. In the story, Elina Makropulos takes an elixir that keeps her alive and, in the play, she is over 300 years old, and she has grown tired of life.

      According to Williams, a life is worth continuing only while we have **categorical desires**, desires that are not conditional on being alive but give us a reason to go on. A father's wish to see his daughter flourish is an example. Williams argues that an endless life must run out of them. This gives a dilemma. Either the person stays the same, and eventually every project is done and life goes flat, or the person keeps finding new desires, but changes so much that it is hardly the same person living on.

      Critics reply. The Stanford Encyclopedia of Philosophy notes that desires could change gradually and still satisfy both of Williams's conditions, and that Fischer and others hold that the life of an endless liver need not become dull. Others say Williams's case is about living too long, and not about immortality as such. Both Williams and the critics are talking about a thought experiment, not a real pill.

  - type: mcq
    id: williams-q
    title: "What is Williams's worry?"
    prompt: |
      Which statement is closest to Williams's argument in "The Makropulos Case", according to the Stanford Encyclopedia of Philosophy and other summaries?
    options:
      - text: "An endless life would run out of categorical desires. Either one stays the same person and becomes bored, or one changes so much that it is hardly the same person."
        correct: true
        feedback: |
          Yes. This is the dilemma. A critic can reply that desires could change gradually, or that a life need not go dull, and those replies aim at one horn or the other.
      - text: "Death is good because it ends suffering."
        feedback: |
          Williams does not say this. He also holds that dying young is a misfortune. His claim is that endless life, which seems an obvious good, is not.
      - text: "Anyone who takes the pill will suffer from a body that cannot stay young."
        feedback: |
          The thought experiment fixes the body. The problem he raises is about what a mind could keep wanting.
      - text: "People who fear death are irrational."
        feedback: |
          That is Epicurus's claim. Williams in fact joins Nagel in treating death as a real loss, while holding that endless life would not be a gain.
    explanation: |
      Notice what Williams and Nagel do not contradict. Dying early can be a misfortune, and endless life may still not be wanted. A life that ends at a good time might be a middle view, and writers disagree about what such a time would be.

  - type: text
    id: stoics
    title: "The Stoics: keep death in view"
    body: |
      Recall the **dichotomy of control** from the lesson on Stoicism: according to Epictetus, our judgments, pursuits, desires and aversions are up to us, and body, property and reputation are not. Death falls on the second side. What is up to us is how we judge it.

      The Enchiridion (in Carter's translation) says in section 5 that men are disturbed "not by things, but by the principles and notions which they form concerning things", and cites Socrates as someone who found death not terrible. The fear comes from the judgment that death is terrible. Section 21 advises keeping death in view: "Let death and exile, and all other things which appear terrible be daily before your eyes." The Internet Encyclopedia of Philosophy reports that Seneca rejects the idea that death is an evil.

      The exercise is called *premeditatio malorum* ("rehearsing future evils in advance"). The label is partly modern shorthand. Cicero describes a similar practice in his *Tusculan Disputations*, book 3, and some accounts trace it to earlier schools, the Cyrenaics. Seneca is its best-known Stoic advocate. The aim, according to the Stoics, is not gloom: a death we have thought about and accepted as part of nature should shake us less. Critics say that rehearsal can feed anxiety, and an Epicurean could answer that there is no need to rehearse what is nothing to us.

  - type: mcq
    id: stoics-q
    title: "What does the exercise aim at?"
    prompt: |
      According to the Stoic texts, why practise keeping death in view each day?
    options:
      - text: "To weaken the false judgment that death is terrible, and so to hold our desires and attachments with an open hand."
        correct: true
        feedback: |
          Yes. The practice trains judgment, which the Stoics say is up to us, and it prepares us for losses we cannot control.
      - text: "To become indifferent to the people we love, so that their deaths will not matter."
        feedback: |
          A common misreading. Stoics hold that we owe duties to others, and the exercise is about not being thrown by loss. Whether the line between acceptance and coldness is sharp is a fair objection.
      - text: "To prove that death is physically harmless."
        feedback: |
          The exercise does not claim any fact about the body. It targets the judgment that death is a great evil.
      - text: "To make sure we pay no attention to life now."
        feedback: |
          Not the aim. The exercise steadies our judgments, which we use in living now, and nothing in it tells us to ignore life.
    explanation: |
      Both Stoics and Epicureans want calm in the face of death, but by different routes. The Epicurean says death is nothing, since there is no experience. The Stoic says death is not a true evil, since only virtue is good.

  - type: text
    id: judaism
    title: "Judaism: Sheol, then resurrection and the world to come"
    body: |
      *According to the Hebrew Bible and the traditions built on it*, the early picture is **Sheol**, the realm of the dead, described as a place of stillness and darkness under the earth. According to the encyclopedia article on Sheol, the texts seem to send both righteous and wicked there, and scholars disagree about whether it is a literal afterlife place or a way of speaking about the grave.

      Later texts add hope. The book of Daniel speaks of the dead rising, and according to a standard encyclopedic summary this text is reserved for the most righteous and the most sinful. One reading takes this as the resurrection of individuals. Another, defended by some scholars, takes related passages such as Ezekiel's valley of dry bones as pictures of the nation's renewal. By the Second Temple period the Pharisees held to resurrection and the Sadducees rejected it. The Mishnah lists belief in the resurrection of the dead among essential beliefs, and the Amidah prayer mentions it.

      Rabbinic Judaism also speaks of the **world to come** (*olam ha-ba*), a phrase that is not in the Hebrew Bible, and of Gehinnom, which many rabbinic sources describe as a place of limited punishment and purification. Traditional teaching holds that the living cannot know what the world to come is like. Reform and Reconstructionist liturgies changed the Amidah blessing "who gives life to the dead" to "who gives life to all", and Reform Judaism stresses the present life over reward and punishment. Jews therefore hold a range of views, from literal resurrection to a more modest hope.

  - type: text
    id: christianity
    title: "Christianity: resurrection or immortal soul?"
    body: |
      Christian teaching, as most churches state it, is about the **resurrection of the body**. Many English versions of the Nicene Creed end by saying "We look for the resurrection of the dead, and the life of the world to come". In 1 Corinthians 15 Paul speaks of a "spiritual body", and scholars disagree about what that means: some read it as a body without flesh, others as the physical body transformed.

      A second idea has a different source. In Plato's *Phaedo* Socrates gives arguments that the soul cannot die, and the Greek tradition stressed that the soul survives while the body does not. According to the encyclopedia article on resurrection, second-century writers such as Irenaeus and Justin Martyr insisted that the person is soul and body together, against views that only the soul is saved.

      Churches combine the two in different ways. The Catholic Catechism holds that at death the soul is separated from the body and later joined to a glorified body. N. T. Wright describes a conscious but sleep-like waiting state, followed by resurrection into new bodies. **Mortalists**, such as Seventh-day Adventists, Christadelphians and Jehovah's Witnesses, deny that humans have an immortal soul and hold that the dead wait until a physical resurrection. The traditions differ on purgatory, on how long the intermediate state lasts and on what the new body is.

  - type: mcq
    id: abrahamic-q
    title: "Resurrection or immortal soul?"
    prompt: |
      A student says: "Jews and Christians teach that the immortal soul leaves the body at death and lives on, which is the same as resurrection." Which reply is fairest?
    options:
      - text: "Resurrection, the rising of the person, and the survival of an immortal soul are different ideas. Some Jews and Christians hold one, some the other, and many churches combine them."
        correct: true
        feedback: |
          Yes. The Catholic Catechism combines them, mortalists keep only resurrection, and a Greek tradition stressed the soul. Within Judaism too, views range from literal resurrection to more modest hopes.
      - text: "Judaism and Christianity both teach the immortal soul and nothing else."
        feedback: |
          Both traditions include resurrection of the dead in their central texts or creeds, and some Christian groups reject an immortal soul altogether.
      - text: "The Hebrew Bible clearly teaches resurrection from its first pages."
        feedback: |
          According to the encyclopedia articles, the early picture is Sheol, and the clearest resurrection text, Daniel, is later. Some read earlier passages as hinting at hope, but that is a reading.
      - text: "Christianity has one view of what happens between death and resurrection."
        feedback: |
          The views differ: souls with God now, a sleep-like waiting, purification, or no soul that survives. Churches disagree.
    explanation: |
      The two ideas answer different worries. Resurrection says the whole person matters and is restored. Immortal soul says what matters in us does not depend on the body. Both traditions have wrestled with how they fit.

  - type: text
    id: islam
    title: "Islam: death, barzakh, resurrection, judgment"
    body: |
      *According to the Qur'an and Islamic tradition*, every person dies and will be raised. Sahih International renders 21:35 "Every soul will taste death", and 3:185 begins "Every soul will taste death, and you will only be given your [full] compensation on the Day of Resurrection."

      Between death and that Day lies the **barzakh**, a word meaning "barrier" or "partition". It occurs three times in the Qur'an, and 23:100 is the verse most often tied to the waiting state. In the Yusuf Ali translation it reads "Before them is a Partition till the Day they are raised up." According to the encyclopedia article on Islamic eschatology, tradition describes the dead as waiting, with something like peace for the righteous and a "punishment of the grave" for the sinful, though how to understand this is debated, and some Shia scholars hold that it is not like physical pain or pleasure.

      The Day of Resurrection brings judgment: a book of deeds for each person, a weighing, a bridge (*as-Sirat*), and then Paradise (*Jannah*) or Hell (*Jahannam*). Most Islamic scholars and philosophers hold that the resurrection is bodily, with different theories about the nature of the body. The article reports that Avicenna (Ibn Sina) rejected bodily resurrection, and that some modern and Sufi thinkers read descriptions of Paradise and Hell as pictures of inner states, while classical literalist schools such as the Ash'arites took them literally. On whether Hell is eternal, there is also debate.

  - type: mcq
    id: islam-q
    title: "Where is the soul between death and judgment?"
    prompt: |
      According to Islamic tradition as the encyclopedia article on Islamic eschatology reports it, which statement is right?
    options:
      - text: "After death the person waits in the barzakh until the Day of Resurrection, and then a judgment follows. How the waiting state is experienced is debated."
        correct: true
        feedback: |
          Yes. The Qur'an speaks of a partition until the Day they are raised, and the tradition describes the waiting state in more detail, with debate on how.
      - text: "Judgment happens at the moment of death, and nothing follows."
        feedback: |
          Islamic teaching places the final judgment on the Day of Resurrection, after a waiting state. The Qur'an says people are given their full compensation on that Day (3:185).
      - text: "All Muslim scholars agree that resurrection is only spiritual."
        feedback: |
          Most scholars and philosophers hold a bodily resurrection. Avicenna is reported as a notable exception, and views on the nature of the body differ.
      - text: "The barzakh is a third place where everyone stays forever."
        feedback: |
          The barzakh is temporary. It ends with the resurrection, according to the article.
    explanation: |
      Islam shares with Judaism and Christianity the idea of a final resurrection and judgment, but each tradition tells it differently and in its own vocabulary. The fair step is to say what each holds, not to merge them.

  - type: text
    id: rebirth
    title: "Hindu and Buddhist traditions: rebirth and liberation"
    image:
      src: img/bhavachakra.webp
      alt: "A wall mural of the Buddhist wheel of life, held by a fanged figure, with a Buddha figure beside it pointing the way out"
      caption: "In murals of the wheel of life (*bhavacakra*), a figure for impermanence holds the cycle of rebirth, while a Buddha points to the way out."
      credit: "Wonderlane from Seattle, USA, CC BY 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Traditional_bhavachakra_wall_mural_of_Yama_holding_the_wheel_of_life,_Buddha_pointing_the_way_out.jpg"
      place: bottom
    body: |
      Here death is not the end but a door. Both traditions teach **samsara**, the cycle of death and rebirth: beings are born, die and are reborn, with the realm of the next life shaped by **karma**, the results of actions. Both aim at liberation from the cycle, called *moksha* in Hindu traditions and **nirvana** in Buddhist ones.

      They differ on what is reborn. According to Hindu traditions, the *atman*, an unchanging self, passes from body to body. According to Buddhist traditions, there is no such self (*anatta*, non-self): a person is a stream of changing physical and mental states, and what continues across death is a causal link. Scholars note that Buddhism rejected both eternalism (an eternal soul) and annihilationism (nothing survives). The commentator Buddhaghosa is reported to have compared the link to a flame passed from one candle to another, and Theravada teachers to a seal pressed into wax, where nothing crosses over but the pattern does. Other schools proposed a store of karmic "seeds" (the Yogacara *alaya-vijnana*), and the Pudgalavada school posited an inexpressible person, an idea others rejected. What counts as nirvana also varies: in Theravada it is the end of craving and of rebirth.

      Critics ask what the link is if no self crosses, and what evidence there is for rebirth at all. The traditions answer in their own terms, and the facts that bear on it are a live debate. The texts and their history are established.

  - type: mcq
    id: rebirth-q
    title: "What is reborn?"
    prompt: |
      A friend says: "Buddhists believe your soul moves into a new body when you die." According to Buddhist traditions, what is the fairest correction?
    options:
      - text: "Most Buddhist traditions teach rebirth but deny an unchanging self that moves. What continues is a causal stream of conditioned states, like a flame passed from one candle to another."
        correct: true
        feedback: |
          Yes. Hindu traditions hold the atman passes on; Buddhist traditions teach not-self and describe a continuity of cause. Some schools, such as the Pudgalavada, held other views.
      - text: "Buddhists deny rebirth altogether, since they deny the self."
        feedback: |
          They teach both. The Buddha is reported to reject eternalism and annihilationism together, so rebirth remains without a persisting self.
      - text: "Buddhists and Hindus hold the same view of what is reborn."
        feedback: |
          They share karma, rebirth and liberation, but they split over the self. Hindu traditions assert the atman and Buddhist traditions deny it.
      - text: "Nirvana is a place where the soul goes after death."
        feedback: |
          In the traditions, nirvana is the end of craving and of rebirth, usually not described as a place that a soul enters. How to describe it, and whether it is more than an end, is itself discussed.
    explanation: |
      The point of the correction is to keep two ideas apart: a self that moves, and a causal chain that continues. Which one is true, or whether either is, is a question of commitment and live debate, not of the texts alone.

  - type: mcq
    id: case
    title: "One question, many answers"
    multiple: true
    prompt: |
      A dying woman asks: "Is death bad for me, and is there anything after?" Select every answer that fairly states a view as its own tradition or thinker holds it.
    options:
      - text: "Epicurus: since death ends experience, it is nothing to us, and there is nothing to fear."
        correct: true
        feedback: |
          A fair statement of the argument. Nagel and believers dispute its premises.
      - text: "Nagel: death is bad for her because it takes the goods her life would have held, even if she feels nothing."
        correct: true
        feedback: |
          A fair statement of the deprivation account.
      - text: "Epictetus: the fear comes from judging death terrible, and judgment is up to her."
        correct: true
        feedback: |
          A fair statement of the Stoic approach, from the Enchiridion.
      - text: "Many Christians and Muslims: death is followed by a waiting state and then resurrection and judgment."
        correct: true
        feedback: |
          Fair as a broad statement. The details of the waiting state, the body and the judgment differ across churches and schools.
      - text: "Many Buddhist teachers: there is no unchanging self, yet a causal stream may continue, and nirvana ends rebirth."
        correct: true
        feedback: |
          A fair statement of mainstream teaching. Other Buddhist schools state it differently.
      - text: "All the traditions above teach that an immortal soul leaves the body and lives on."
        feedback: |
          Epicurus denies any survival, mortalist Christians deny an immortal soul, and Buddhist traditions deny an unchanging self. The traditions differ on exactly this point.
    explanation: |
      The question has two parts: whether death is bad, and what survives. Philosophers answer the first with premises about what matters, and the traditions answer the second with their texts and commitments. A fair answer says whose view each is.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      *Facts* are settled by sources: what Epicurus, Nagel, Williams and Epictetus argued, what the Hebrew Bible, the creeds, the Qur'an and the Buddhist texts say, and how each tradition describes its own doctrine. *Live debates* include whether death harms the dead (whether only experiences matter), whether endless life would go flat, how to read Sheol and Daniel, how Paul's "spiritual body" should be understood, whether bodily resurrection is the best reading of the Qur'an, and what, if anything, continues if there is no self. *Commitments* decide the rest: whether anything survives death, and which tradition's account, if any, to trust.

      A believer may find in a tradition a hope that philosophy cannot supply. A naturalist may find Nagel or Epicurus enough. A Stoic may care less about what follows death than about how to face it. Each rests on a premise another rejects, and the course does not pick among them.

  - type: text
    id: summary
    body: |
      **Next:** can morality stand without God? One side argues that moral truths hold with or without any divine source, and the other replies that they need one. Both arguments are set out and checked premise by premise.
