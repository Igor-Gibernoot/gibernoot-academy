id: ch25-synthesis
title: "Where We Stand: A Map of Open Questions"
kind: concept
own: |
  The setting: the course asked six families of questions about knowing, reality, God, texts and experience, mind, and meaning. This lesson draws them as a map and gives no verdict. Each view is told *according to* those who hold it.
  - **Three kinds of disagreement.** Two people can part ways over the evidence (what the data or texts say), over a premise or an interpretation (how to read that evidence or which assumption to grant), or over a commitment (what to value or trust before any argument). Labelling which kind is at work shows what a conversation could settle:
  {{ $$\begin{aligned}&\text{evidence, premise, commitment:}\\&\text{ask which one separates us}\end{aligned}$$ }}
  - **Six fault lines.** The map has six regions: what counts as a good reason (knowing), what exists and what mind is (reality and mind), why there is something at all (origins), whether God exists (arguments for and against), how to read texts and experiences (traditions and belief), and what to make of meaning, ethics and death. In each region several positions stay live among informed people.
  - **Positions are mostly independent.** With $q$ questions and $k$ live positions on each, there are $k^q$ combinations. For $q=6$ and $k=3$:
  {{ $$3^6=729$$ }}
  This counts combinations before ruling out any that conflict, so it is an upper bound. The map is a grid, not two camps.
  - **A shared answer is not a shared reason.** People who agree on a position can hold it for different reasons, and people who disagree can share most of their facts. Fair description of a view is one that its best defenders accept:
  {{ $$\begin{aligned}&\text{same position}\\&\not\Rightarrow\ \text{same reason}\end{aligned}$$ }}
  - **What stays open.** Fact: the findings and texts the course set out. Live debate: how to weigh them in each region. Commitment: which kinds of evidence one is willing to treat as decisive. The course does not say which positions are right.

cards:
  - type: text
    id: hook
    title: "Lena and the line"
    body: |
      Imagine one invented story. After a long course on science, faith and mind, a student named Lena is asked a single question by a friend: "So which side are you on?" She realises she has no single answer. On the origin of the universe she is unsure. On whether minds are only brains she leans one way. On ethics she leans another. On the Gospels she has read both believers and sceptical historians.

      Before any theory, guess: is Lena's difficulty a sign that she has not made up her mind, or a sign that "which side" is a poor question?

      This last concept lesson of the course draws one map of the questions you met and the live positions on each. It gives no verdict, and it does not rank the positions.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Lena's questions are about the origin of the universe, the nature of mind, the grounds of ethics and the reading of old texts. If she answers each one separately, which is the best prediction about her set of answers?
    options:
      - text: "They can form many different patterns. Answers to different questions are linked only in part, so the same person can combine answers in ways that no simple two-sided picture predicts."
        correct: true
        feedback: |
          Yes. Some answers do constrain others, but fewer than the two-camp picture suggests. The lesson makes this precise with a count.
      - text: "They must all fall on one side, because the questions are all really one question about God."
        feedback: |
          The course showed that a view about mind or ethics can be held with or without belief in God. Some links exist, but they are not forced.
      - text: "They will be random, since none of the questions is connected to any other."
        feedback: |
          Too strong the other way. Some answers do raise or lower the plausibility of others, for example a view that mind is only brain and a view of what happens at death.
      - text: "They show that Lena has not thought enough, since a thoughtful person has one consistent worldview."
        feedback: |
          A consistent worldview is possible, but nothing in logic requires one picture across all these questions, and informed people differ in how closely their answers cohere.
    explanation: |
      Two camps are a simplification. The map below keeps the questions apart so each can be seen on its own.

  - type: text
    id: kinds
    title: "Where people part ways: three kinds"
    body: |
      In every lesson the course named where thoughtful people part ways and why. Three kinds of reason recur.

      **Evidence.** The disagreement is about what the data or the texts say: a measured number, a manuscript reading, the result of a study. This kind can often be reduced by checking the facts.

      **Premise or interpretation.** The facts are shared and the disagreement is about how to read them or which assumption to grant, for example whether a gap in an explanation counts for or against a view. The course asked this as "which premise would a critic reject, and why?"

      **Commitment.** The disagreement is about what to trust or value before the argument starts, for example whether religious experience may count as evidence at all. These are the layer-3 claims of the course: faith or metaphysical commitments, held by believers and non-believers alike.

      Sorting a disagreement into one of these kinds does not decide it. It tells you what a conversation could and could not settle.

  - type: mcq
    id: kinds-q
    title: "Which kind?"
    prompt: |
      Two readers study the same list of fine-tuning numbers and agree on every value. One says the numbers call for an explanation beyond chance and the other says an unobserved range of possible universes could explain them without design. According to the three kinds above, what separates them?
    options:
      - text: "A premise or interpretation: the same facts are read through different assumptions about what needs explaining and what counts as an explanation."
        correct: true
        feedback: |
          Yes. They agree on the evidence. They differ on how to read it, and possibly on commitments behind that reading, which is why the course kept the numbers and the interpretation apart.
      - text: "Evidence, because one of them must have the numbers wrong."
        feedback: |
          The case says they agree on every value, so the facts are shared.
      - text: "Nothing, because two honest readers of the same numbers must reach the same view."
        feedback: |
          Shared facts do not force one reading. Informed people differ in what they take to need explaining.
      - text: "Only mood or taste, so the disagreement has no content."
        feedback: |
          It has content: the readers can state and test their premises, and the course did exactly that in the lessons on fine-tuning and on the multiverse.
    explanation: |
      Most disagreements on the map mix the kinds. Naming the main one is a first step toward a fair conversation.

  - type: text
    id: line-knowing
    title: "Fault line 1: What counts as a good reason?"
    body: |
      The first region is about knowing itself. In the lessons Why the Sun Will Rise Tomorrow, Popper and the Black Swan, and Kuhn: When Science Changes Its Mind, the course met science as a method with strengths and limits. In Evidence as Updating Belief it met Bayes' rule:

      $$P(H\mid E)=\dfrac{P(E\mid H)\,P(H)}{P(E)}$$

      Here $H$ is a hypothesis, $E$ is evidence, $P(H)$ is the prior credence in $H$ before the evidence, and $P(H\mid E)$ is the credence after.

      The live positions differ on what may serve as $E$ and as a starting prior. According to evidentialists (Evidentialism: Clifford), belief should be proportioned to evidence available to all. According to defenders of Reformed Epistemology, belief in God can be properly basic without an argument. According to fideists (Fideism, Leap and Doubt), some commitments are not the kind of thing evidence settles. The lesson What Science Can and Cannot Say adds a question: how far does the reach of science extend?

      This is mainly a commitment-level disagreement, so shared facts do not make it disappear.

  - type: text
    id: line-reality
    title: "Fault line 2: What exists, and what is mind?"
    image:
      src: img/chalmers.webp
      alt: "A portrait photograph of David Chalmers"
      caption: "David Chalmers, whose 1995 term the hard problem names the question of why physical processes come with experience at all."
      credit: "DannyGolcman, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:David_chalmers.jpg"
    body: |
      The second region asks what there is. In the lessons Matter Is All There Is?, Mind First: Idealism, Two Kinds of Stuff: Dualism and Mind in Everything? Panpsychism and Neutral Monism the course set out four families of answer. The question narrows in the lesson The Hard Problem: the Stanford Encyclopedia of Philosophy attributes the phrase "the hard problem" to Chalmers (1995), and the contrast it draws is between explaining how the brain performs functions and explaining why there is experience, "what it is like", at all.

      According to physicalists, experience is a physical or functional process that science will explain in the end. According to dualists, experience is a different kind of thing from matter. According to panpsychists, experience is a basic feature of the world. The lessons Global Workspace and Higher-Order Theories and Integrated Information and Other Rivals gave scientific theories that fit these pictures differently.

      Part of this is evidence (what the brain shows), but the weight of the disagreement is premise and commitment: whether a complete physical account would leave anything out.

  - type: mcq
    id: reality-q
    title: "Does the hard problem choose a side?"
    prompt: |
      Someone says: "If the hard problem is real, then there must be a soul, and so religion is true." What is the best reply, according to the course?
    options:
      - text: "The step from the hard problem to a soul is a further premise. Panpsychists and neutral monists accept that experience is not explained by structure alone and still reject a separate soul, and some physicalists reject the problem."
        correct: true
        feedback: |
          Yes. The hard problem is a question that rival positions answer differently. It does not by itself select dualism, and even dualism does not by itself select a religion.
      - text: "The hard problem has been solved, so the question no longer arises."
        feedback: |
          The course gave live rival theories, not a solution that every informed person accepts.
      - text: "The inference is valid, because only a soul could explain experience."
        feedback: |
          That premise is exactly what panpsychists and neutral monists deny.
      - text: "Questions about mind have nothing to do with religion."
        feedback: |
          They connect to it, for example through views on the soul and the afterlife, but the link is not a logical entailment.
    explanation: |
      The same shape recurs across the map: a question narrows the options but rarely forces one.

  - type: text
    id: line-origins
    title: "Fault line 3: Why is there anything?"
    body: |
      The third region asks about origins. The lessons The Universe Has a History, Did Time Begin?, Why Something Rather Than Nothing? and the fine-tuning lessons set out what cosmology says and where it stops. According to the translation quoted on a university course page, Leibniz wrote in his Principles of Nature and Grace (1714) that once the principle of sufficient reason is granted, the first question we have a right to ask is why there is something rather than nothing.

      Three live answers appear. According to many theists, the world depends on a necessary being, which is the pattern of the Cosmological Argument and the Kalam Argument. According to many naturalists, the totality of things may simply be a brute fact, or the demand for an explanation of the whole may be misplaced. According to some cosmologists and philosophers, a multiverse or a quantum origin changes the question, though the lessons The Multiverse and the Measure Problem and The Anthropic Principle and Selection Effects showed that each of these has its own open problems.

      The facts of cosmology are agreed. The parting of ways is on whether the demand for an ultimate explanation is legitimate: a premise about explanation.

  - type: text
    id: line-god
    title: "Fault line 4: Does God exist, and which God?"
    body: |
      The fourth region is the best known. The lessons of Arguments for God (the cosmological, kalam, ontological, design and moral arguments) and Arguments Against God (the problems of evil, hiddenness, Occam and Pascal's wager) each ran as a set of premises with a question about which a critic would reject.

      Believers, atheists and agnostics (Agnosticism and Its Varieties, Atheism, Agnosticism and Nonbelief) stand at different points here. The lesson Which God Is Being Discussed? in the level on the nature of God added a warning: the question changes with the meaning of "God", whether the God of classical theism, of process theology, of Spinoza, or of a tradition's own texts.

      According to many theists, the arguments together make belief reasonable. According to many atheists, the problem of evil and the burden of proof tell against it. According to agnostics, the evidence leaves the question open or beyond reach. A fair map lists all three and does not choose.

  - type: mcq
    id: god-q
    title: "Reading an argument fairly"
    prompt: |
      A classical argument for or against God can fail in three different ways. Which list names them correctly, as the course used them?
    options:
      - text: "A premise can be false or unproven, the step from premises to conclusion can be invalid, or the conclusion can be weaker than the claim it was meant to support."
        correct: true
        feedback: |
          Yes. The course checked validity separately from the truth of the premises, and a further question was always whether the conclusion reached the God of a particular tradition.
      - text: "It can be too old, too popular or too complicated."
        feedback: |
          None of these affects whether the argument is sound.
      - text: "It can have been refuted once by anyone, after which it is dead."
        feedback: |
          Refutation depends on premises that remain disputed, which is why many classical arguments are still discussed in revised forms.
      - text: "It can fail only if its conclusion is false."
        feedback: |
          An argument can have a true conclusion and still fail, because the premises may not support it.
    explanation: |
      This pattern, premise, validity and reach, applies equally to arguments for and arguments against.

  - type: text
    id: line-texts
    title: "Fault line 5: Texts, experience and why people believe"
    image:
      src: img/barbour.webp
      alt: "Still image of Ian Barbour speaking, taken from an interview"
      caption: "Ian Barbour, whose four types of relation between science and religion (conflict, independence, dialogue, integration) appear again here as a map of this region."
      credit: "Closer To Truth, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Ian_Barbour_Web_Still.jpg"
    body: |
      The fifth region covers the traditions and the human side of belief. The traditions levels (Judaism, Christianity, Islam, Hindu thought, Buddhism, other traditions and Spiritism) asked how texts were made, what history and archaeology say, and how each tradition reads its own writings. The lessons Altered States of Mind, Religious Experience and Mysticism and Why Humans Believe asked what experiences show and how belief can be explained.

      Two live questions run through it. First, how to read a text: literally, allegorically or historically (Interpretation: Literal, Allegorical, Historical). Second, whether explaining belief explains it away (Guided proof: Does Explaining Belief Explain It Away?, and its mirror, The Same Argument Against Atheism). The lesson Four Models: Conflict, Independence, Dialogue, Integration used Barbour's four types of relation between science and religion (the Stanford Encyclopedia cites Barbour 2000 for them).

      Here evidence is plentiful (manuscripts, studies, histories), and still thoughtful readers part ways, mainly on interpretation and on whether experience can count as evidence at all.

  - type: text
    id: line-meaning
    title: "Fault line 6: Meaning, ethics and death"
    body: |
      The sixth region is the one of this level. The lessons Is There Meaning?, Where Does Ethics Come From?, Facing Death, Guided proof: Morality Without God?, Suffering and What Traditions Do With It and Interfaith Humility and Shared Goods set out the positions.

      On meaning, objective, subjective and hybrid theories differ on what a meaningful life needs from the universe. On ethics, divine command, natural law, consequences, duty and virtue name different sources of wrongness. On death, Epicureans, Stoics, the Abrahamic hereafters and rebirth traditions answer differently. And on shared goods, people can agree on acts and rules while differing on reasons.

      Each of these is largely a commitment-level disagreement, and the course asked you to state it so that its best defenders would say, "that is fair".

  - type: mcq
    id: sort-q
    title: "Which region?"
    prompt: |
      Match the question to the region of the map where it mainly lives. "Is a life spent counting blades of grass meaningful if the counter enjoys it?"
    options:
      - text: "Meaning, ethics and death: it asks what a meaningful life needs, which subjective, objective and hybrid views answer differently."
        correct: true
        feedback: |
          Yes. It is the test case that separates views of what meaning requires.
      - text: "Origins: it asks why there is something rather than nothing."
        feedback: |
          That is the origins region. This question is about what makes a life worthwhile.
      - text: "Knowing: it asks what counts as evidence."
        feedback: |
          It does not turn on evidence but on what meaning requires of a life.
      - text: "Reality and mind: it asks whether experience is physical."
        feedback: |
          The question presupposes an experiencing person and asks about the value of the life, not the nature of experience.
    explanation: |
      Sorting a question to its region is the first move in a fair discussion of it.

  - type: text
    id: independence
    title: "The map is a grid, not two camps"
    body: |
      Take the six regions as six questions. Suppose that on each of them there are $k$ positions that informed people hold, for example three. A person's overall outlook picks one position per question. With $q$ questions and $k$ positions each, the number of possible combinations is

      $$k^{q}$$

      Here $q$ counts the questions (the six regions) and $k$ counts the positions on each. This is an upper bound: some combinations conflict, and the rest are not equally common. But the count shows why a single line from "religious" to "secular" cannot hold the whole map.

      Some answers do constrain others. A person who holds that mind is only the brain has a harder time holding that the mind survives death, though traditions and philosophers have argued about whether that tension is real. Constraints narrow the grid. They do not collapse it to two points.

  - type: numeric
    id: count
    title: "How many outlooks?"
    prompt: |
      Take $q=6$ questions with $k=3$ live positions on each, and treat the answers as independent, so the number of combinations is $k^q$. How many combinations are there?
    answer: 729
    answerText: '729'
    wrong:
      - { value: 18, feedback: "That is $6\times 3$, which would add the positions. A combination picks one position for every question, so the counts multiply." }
      - { value: 216, feedback: "That is $6^3$, which swaps the roles of $q$ and $k$. Here there are three positions on each of six questions, so $3^6$." }
    hint: "Each of the 6 questions can be answered in 3 ways, one after the other."
    explanation: |
      $3^6=3\cdot3\cdot3\cdot3\cdot3\cdot3=729$. Real outlooks cluster, so the number actually held is far smaller, but the possibilities are many.

  - type: mcq
    id: bundle-q
    title: "A bundle is not a package"
    prompt: |
      Someone says: "If you accept the cosmological argument you must accept every claim of Christianity." According to the course's map, what is wrong with this?
    options:
      - text: "A conclusion about a necessary being, even if granted, is one position on one question. Which God, which texts and which ethics are further questions, and the same argument has been used by thinkers in several traditions."
        correct: true
        feedback: |
          Yes. The course kept these questions apart: the reach of an argument, the reading of a tradition's texts, and the grounding of ethics are separate regions.
      - text: "Nothing is wrong: accepting one argument commits you to the whole tradition."
        feedback: |
          Accepting an argument commits you to its conclusion and what follows from it, not to every claim of any tradition that likes it.
      - text: "It is wrong because no one accepts the cosmological argument."
        feedback: |
          Many thinkers do accept versions of it, and many reject it. That is part of the live debate.
      - text: "It is wrong because Christianity makes no claims about the origin of the universe."
        feedback: |
          Christian thinkers do make such claims. The flaw is the jump from one conclusion to an entire tradition.
    explanation: |
      Disentangling the bundle is the main service of the map: each position is judged on its own premises.

  - type: mcq
    id: movers
    title: "What would move you?"
    prompt: |
      A fair practice, according to the course, is to ask of any position, including your own: what would count as evidence against it? Which of the following is the best example of answering that question honestly?
    options:
      - text: "Naming a kind of result, such as a failed replication, a manuscript find or a new argument, that would lower your confidence, and stating how much."
        correct: true
        feedback: |
          Yes. A view that can state what would count against it can be discussed. This is a test of how a view is held, not of which view is true.
      - text: "Saying that nothing could ever count against it, because it is certain."
        feedback: |
          Then the view is not responsive to evidence, which the course marked as a commitment-level stance, held openly or not at all.
      - text: "Saying that anything at all counts against it, so it is empty."
        feedback: |
          If every result counts against a view, it forbids nothing and says nothing. The course called this the opposite failure.
      - text: "Declining to say, since the question is rude."
        feedback: |
          The question is a standard of fairness, and it applies equally to believers, atheists and agnostics.
    explanation: |
      Believers, atheists, agnostics and scientists can each answer it, and the answers show how each position is actually held.

  - type: mcq
    id: trap
    title: "A tempting inference"
    prompt: |
      Someone looks at the whole map and says: "So many thoughtful people disagree, so no position is better than another." What is the weakest step?
    options:
      - text: "From the fact of disagreement to the claim that all positions are equally good. Disagreement shows a question is open, not that every answer is equally supported, and the course left that weighing to each reader."
        correct: true
        feedback: |
          Yes. The course neither says one position wins nor says all are equal. It says how to see what each needs, and this is the point of a map.
      - text: "The claim that thoughtful people disagree."
        feedback: |
          The disagreement is real, as the six regions show. The flaw is what is concluded from it.
      - text: "Nothing is wrong: disagreement proves relativism."
        feedback: |
          Disagreement about an answer does not show there is no better or worse answer. The lesson Guided proof: Disagreement Among Equals treated what rational disagreement does and does not imply.
      - text: "The word 'thoughtful', which cannot be defined."
        feedback: |
          The word may be hard to define, but the weak step is the jump from disagreement to equality.
    explanation: |
      A map with no verdict is not a map that says all routes are equally good. It says where the routes divide.

  - type: text
    id: summary
    body: |
      **Next:** the level's last lessons are Traps, Quick Recall and the Content Map of the level, then the level challenge Living With the Questions, and after that the final exam.
