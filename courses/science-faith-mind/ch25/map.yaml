outroTitle: Level 25 in one picture
outro: |
  The level starts from the difference between the meaning of life and meaning in a life. Subjectivists, objectivists and hybrid theorists disagree on what makes a life matter, and Frankl and Nagel offer two ways to live with the question. Where ethics comes from is answered by divine command (with the Euthyphro dilemma), natural law, consequences, duty and virtue, and the evolutionary question separates the origin of a belief from its justification. The argument for morality without God turns on a bridge premise. Death and suffering are met by philosophers, by traditions and by secular thinkers in different ways, and shared goods can be held for different reasons. Where thoughtful people part ways: whether a life can matter only if the universe has a purpose, whether morality needs a source beyond the world, and whether anything survives death. This level does not say which answer is right.
