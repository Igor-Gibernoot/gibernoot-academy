id: ch25-map
title: "Content Map: Meaning, Ethics and Death"
kind: map
name: Level 25, Meaning, Ethics and Death (meaning of and in life, the source of ethics, morality without God, death, suffering, shared goods, open questions)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the level on meaning, ethics and death, from memory, one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a thinker given the rival's answer, two terms swapped, a claim turned around), and every wrong pick comes with a reason.

  Everything is taught according to the thinkers and traditions named in each box. The map gives no verdict on what makes a life matter, where morality comes from, or what happens at death. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: meaning
    title: Meaning of and in life
    row: 1
    col: 2
    body: |
      **Meaning of life** asks whether human existence or the universe has a point. **Meaning in life** asks what makes one person's life meaningful. **Subjectivism** says it depends on the person's own attitudes, **objectivism** says some things have worth whatever anyone feels, and a **hybrid** view needs both. According to **Wolf**, meaning arises when **subjective attraction meets objective attractiveness**, so feeling that a life is meaningful is **not a reliable sign** that it is.
    decoys:
      - body: |
          **Meaning of life** asks what makes one person's life meaningful. **Meaning in life** asks whether human existence or the universe has a point. **Subjectivism** says it depends on the person's own attitudes, **objectivism** says some things have worth whatever anyone feels, and a **hybrid** view needs both. According to **Wolf**, meaning arises when **subjective attraction meets objective attractiveness**, so feeling that a life is meaningful is **not a reliable sign** that it is.
        feedback: |
          The two questions are swapped. Meaning of life is about existence or the universe as a whole; meaning in life is about what makes an individual life meaningful.
      - body: |
          **Meaning of life** asks whether human existence or the universe has a point. **Meaning in life** asks what makes one person's life meaningful. **Subjectivism** says it depends on the person's own attitudes, **objectivism** says some things have worth whatever anyone feels, and a **hybrid** view needs both. According to **Wolf**, meaning arises when **subjective attraction meets objective attractiveness**, so feeling that a life is meaningful is **a sure sign** that it is.
        feedback: |
          Wolf says the opposite: because objective worth is also needed, thinking or feeling that a life is meaningful does not make it so. The grass counter who feels absorbed is her kind of test case.
    explanation: |
      The root of the map. The later boxes ask what these views need from the universe, and what follows for how to act, how to die and how to live with others.

  - id: frankl
    title: Frankl
    row: 2
    col: 1
    body: |
      According to **Frankl**, in *Man's Search for Meaning*, the question is **turned round**: in essence, **life questions us, and we answer by being responsible for our lives**. He names three ways to find meaning: **a deed or task, an experience such as love, and the attitude taken toward unavoidable suffering**.
    decoys:
      - body: |
          According to **Frankl**, in *Man's Search for Meaning*, the question is **kept as it is**: in essence, **we question life, and it owes us an answer**. He names three ways to find meaning: **a deed or task, an experience such as love, and the attitude taken toward unavoidable suffering**.
        feedback: |
          That is the question Frankl turns round. For him the person is the one questioned, and the answer is given by how one lives and takes responsibility.
      - body: |
          According to **Frankl**, in *Man's Search for Meaning*, the question is **turned round**: in essence, **life questions us, and we answer by being responsible for our lives**. He names three ways to find meaning: **wealth, success, and the avoidance of every suffering**.
        feedback: |
          Frankl's three ways are a deed or task, an experience such as love, and the attitude taken toward suffering that cannot be avoided. None of them is a reward that comes from outside.
    explanation: |
      A reply to the question of what makes a life meaningful that works from within the life, even under suffering. It returns in the suffering box.

  - id: needs
    title: What meaning needs
    row: 2
    col: 2
    body: |
      According to the Stanford Encyclopedia, **supernaturalism** says **God or a soul is needed** for meaning, or for great meaning. **Naturalism** says the **physical world, as the sciences describe it, is enough**. **Nihilism** says what would make a life meaningful **cannot obtain for anyone**. The three differ on what the universe must supply.
    decoys:
      - body: |
          According to the Stanford Encyclopedia, **supernaturalism** says the **physical world, as the sciences describe it, is enough**. **Naturalism** says **God or a soul is needed** for meaning, or for great meaning. **Nihilism** says what would make a life meaningful **cannot obtain for anyone**. The three differ on what the universe must supply.
        feedback: |
          The first two are swapped. Supernaturalism is the view that meaning needs God or a soul; naturalism is the view that the natural world is enough.
      - body: |
          According to the Stanford Encyclopedia, **supernaturalism** says **God or a soul is needed** for meaning, or for great meaning. **Naturalism** says that **without God nothing can be meaningful**. **Nihilism** says what would make a life meaningful **cannot obtain for anyone**. The three differ on what the universe must supply.
        feedback: |
          That is a mistake about naturalism, which is not nihilism. A naturalist holds that meaning is possible without God or a soul, and nihilism is the separate claim that it is impossible for everyone.
    explanation: |
      Where the commitments start. Whether a life can matter only if the universe has a purpose is the point where thoughtful people part ways.

  - id: nagel
    title: Nagel on the absurd
    row: 2
    col: 3
    body: |
      According to **Nagel** ("The Absurd", 1971), the absurd comes from a **clash inside us**: we take our lives seriously, yet we can step back to a standpoint from which **everything can look arbitrary**. It is not a clash between us and a silent world. His answer is that **irony fits better than heroic defiance**.
    decoys:
      - body: |
          According to **Nagel** ("The Absurd", 1971), the absurd comes from a **clash between us and the world**: we demand a meaning, yet the world is silent. It is not a clash inside us. His answer is that **irony fits better than heroic defiance**.
        feedback: |
          That is Camus's framing. Nagel places the absurd inside us, in the pull between taking life seriously and being able to see it as arbitrary.
      - body: |
          According to **Nagel** ("The Absurd", 1971), the absurd comes from a **clash inside us**: we take our lives seriously, yet we can step back to a standpoint from which **everything can look arbitrary**. It is not a clash between us and a silent world. His answer is that **heroic defiance fits better than irony**.
        feedback: |
          The answer is reversed. Nagel finds defiance to make too much of the clash and recommends irony.
    explanation: |
      A second voice on the same worry as the Frankl box, but one that does not try to remove the clash.

  - id: divine
    title: Divine command and Euthyphro
    row: 3
    col: 1
    body: |
      Is an act good **because God commands it**, or does God command it **because it is good**? The first horn seems to make morality **arbitrary**; the second puts goodness **before** God's command. According to **Robert Adams**, as the Stanford Encyclopedia reports, God is benevolent and just, so God's commands flow from **God's good and just nature** and are **not arbitrary**.
    decoys:
      - body: |
          Is an act good **because God commands it**, or does God command it **because it is good**? The first horn seems to make morality **arbitrary**; the second puts goodness **before** God's command. According to **Robert Adams**, as the Stanford Encyclopedia reports, God's commands are **free of any nature**, so they are **not arbitrary**.
        feedback: |
          Adams's reply rests on God's nature: God is benevolent and just, so the commands flow from a good and just character. Commands with no nature behind them would be exactly the arbitrary ones the first horn describes.
      - body: |
          Is an act good **because God commands it**, or does God command it **because it is good**? The first horn seems to make morality **before** God's command; the second puts goodness **arbitrary**. According to **Robert Adams**, as the Stanford Encyclopedia reports, God is benevolent and just, so God's commands flow from **God's good and just nature** and are **not arbitrary**.
        feedback: |
          The horns are mixed up. If goodness depends on the command alone, morality looks arbitrary; if God commands what is already good, goodness stands before the command.
    explanation: |
      The theistic answer to where wrongness comes from. A critic asks whether God's nature escapes the arbitrariness charge or only moves it back a step.

  - id: theories
    title: Natural law, consequences, duty, virtue
    row: 3
    col: 2
    body: |
      **Natural law** (Aquinas): reason grasps basic goods, and the first precept is that **good is to be done and pursued, and bad avoided**. **Consequences** (Mill, 1861): an act is right **in proportion as it tends to promote happiness**. **Duty** (Kant): judge the **maxim**, and never treat humanity **merely as a means**. **Virtue** (Aristotle): ask what **kind of person** to be, as a person of good character and practical wisdom would act.
    decoys:
      - body: |
          **Natural law** (Aquinas): reason grasps basic goods, and the first precept is that **good is to be done and pursued, and bad avoided**. **Consequences** (Kant): an act is right **in proportion as it tends to promote happiness**. **Duty** (Mill, 1861): judge the **maxim**, and never treat humanity **merely as a means**. **Virtue** (Aristotle): ask what **kind of person** to be, as a person of good character and practical wisdom would act.
        feedback: |
          Mill and Kant are swapped. Mill's utilitarianism judges acts by their tendency to promote happiness; Kant judges the maxim and the treatment of humanity as an end.
      - body: |
          **Natural law** (Aquinas): reason grasps basic goods, and the first precept is that **good is to be done and pursued, and bad avoided**. **Consequences** (Mill, 1861): an act is right **in proportion as it tends to promote happiness**. **Duty** (Kant): judge the **results**, and never treat humanity **merely as a means**. **Virtue** (Aristotle): ask which **rule** to follow, whatever the character of the agent.
        feedback: |
          Two slips. Kant judges the maxim, the rule acted on, not the results. And virtue ethics asks what kind of person to be, not only which rule to follow.
    explanation: |
      Four secular-friendly answers to the same question as the divine command box. Aquinas ties natural law to God's eternal law but says reason reaches it.

  - id: street
    title: Origin is not justification
    row: 3
    col: 3
    body: |
      Evolutionary accounts explain how our moral feelings may have arisen. **How we came to hold a belief does not settle whether it is justified**, and arguing otherwise is the **genetic fallacy**. According to **Street** (2006), if moral truths are independent of us and evolution shaped our beliefs for survival, a match between them would be a **coincidence**. She concludes we **lack justified confidence** in such beliefs, **not that morality is false**.
    decoys:
      - body: |
          Evolutionary accounts explain how our moral feelings may have arisen. **How we came to hold a belief settles whether it is justified**, so an evolutionary origin shows the belief is false. According to **Street** (2006), if moral truths are independent of us and evolution shaped our beliefs for survival, a match between them would be a **coincidence**. She concludes we **lack justified confidence** in such beliefs, **not that morality is false**.
        feedback: |
          That is the genetic fallacy. The origin of a belief is a separate question from its justification, and a belief can be true whatever its history.
      - body: |
          Evolutionary accounts explain how our moral feelings may have arisen. **How we came to hold a belief does not settle whether it is justified**, and arguing otherwise is the **genetic fallacy**. According to **Street** (2006), if moral truths are independent of us and evolution shaped our beliefs for survival, a match between them would be a **coincidence**. She concludes that **morality is false**.
        feedback: |
          Street's conclusion is about justified confidence, not falsity. She argues that we lack good reason to trust moral beliefs if they track independent truths, which targets realists, not morality as such.
    explanation: |
      The evolutionary question about ethics: it does not refute morality by itself, but it presses on views that make moral truths independent of us.

  - id: proof
    title: Morality without God?
    row: 4
    col: 2
    body: |
      The argument: **P1** some moral claims are objectively true; **P2** their authority does not depend on a commander; **P3** humans can know them by reason and experience; **P4** (the bridge, ours) nothing else in God, such as God's nature, is needed to ground them. Then **C**: morality stands without theism, and **without P4 the step is invalid**. Three questions must be kept apart: **ground**, **knowledge** and **motivation**.
    decoys:
      - body: |
          The argument: **P1** some moral claims are objectively true; **P2** their authority does not depend on a commander; **P3** humans can know them by reason and experience; **P4** (the bridge, ours) nothing else in God, such as God's nature, is needed to ground them. Then **C**: morality stands without theism, and **P4 is not needed for the step**. Three questions must be kept apart: **ground**, **knowledge** and **motivation**.
        feedback: |
          P2 only rules out commands as the ground. God's nature could still be the ground, so without the bridge P4 the step from P1 to P3 to C is invalid.
      - body: |
          The argument: **P1** some moral claims are objectively true; **P2** their authority does not depend on a commander; **P3** humans can know them by reason and experience; **P4** (the bridge, ours) nothing else in God, such as God's nature, is needed to ground them. Then **C**: morality stands without theism, and **without P4 the step is invalid**. Three questions must be kept apart: **ground**, **taste** and **law**.
        feedback: |
          The three questions are what makes a claim true (ground, or ontology), how we come to know it (knowledge) and why we act on it (motivation).
    explanation: |
      Meeting point of the three boxes above. Theists such as Adams reject P4; secular realists such as Wielenberg accept basic moral facts and pay the cost of Mackie's charge that they are queer.

  - id: death
    title: "Death: Epicurus, Nagel, Williams"
    row: 5
    col: 1
    body: |
      According to **Epicurus**, only experiences matter and death ends experience, so **death is nothing to us**. According to **Nagel**, death is bad because it **removes the goods the life would have held**, even though the dead person feels nothing. According to **Williams** (the Makropulos case), an **endless life** would end in **boredom or in a change so deep that it is no longer the same person**, since the person runs out of categorical desires.
    decoys:
      - body: |
          According to **Epicurus**, death is bad because it **removes the goods the life would have held**. According to **Nagel**, only experiences matter and death ends experience, so **death is nothing to us**. According to **Williams** (the Makropulos case), an **endless life** would end in **boredom or in a change so deep that it is no longer the same person**, since the person runs out of categorical desires.
        feedback: |
          The attributions are swapped. Epicurus says death is nothing to us; the deprivation account is Nagel's.
      - body: |
          According to **Epicurus**, only experiences matter and death ends experience, so **death is nothing to us**. According to **Nagel**, death is bad because it **removes the goods the life would have held**, even though the dead person feels nothing. According to **Williams** (the Makropulos case), an **endless life** would be **the best possible one**, since desires then never run out.
        feedback: |
          Williams argues the reverse: an endless life would be unattractive, because a person who stays the same person eventually has no categorical desires left. Critics such as Fischer reply that a life need not go dull.
    explanation: |
      Philosophical answers to what death is and whether it is bad. They rest on whether only experiences matter and whether an endless life would be good.

  - id: afterlife
    title: Hereafters and rebirth
    row: 5
    col: 2
    body: |
      **Hebrew Bible**: the dead go to **Sheol**; later texts add **resurrection** and the world to come. **Christians** confess the resurrection of the dead and the life of the world to come. **Muslims** hold death, a waiting state (***barzakh***), resurrection and judgment. **Hindu** traditions: an unchanging self (***atman***) passes through rebirth (***samsara***) until ***moksha***. **Buddhist** traditions: with no self (***anatta***), a **causal stream** continues until nirvana.
    decoys:
      - body: |
          **Hebrew Bible**: the dead go to **Sheol**; later texts add **resurrection** and the world to come. **Christians** confess the resurrection of the dead and the life of the world to come. **Muslims** hold death, a waiting state (***barzakh***), resurrection and judgment. **Hindu** traditions: with no self (***anatta***), a **causal stream** passes through rebirth until ***moksha***. **Buddhist** traditions: an unchanging self (***atman***) continues until nirvana.
        feedback: |
          The two rebirth views are swapped. Hindu traditions hold an unchanging self (atman); Buddhist traditions deny such a self (anatta) and speak of a stream of conditioned states.
      - body: |
          **Hebrew Bible**: the dead go to **Sheol**; later texts add **resurrection** and the world to come. **Christians** confess the resurrection of the dead and the life of the world to come. **Muslims** hold death, a waiting state (***barzakh***), resurrection and judgment. **Hindu** traditions: an unchanging self (***atman***) passes through rebirth (***samsara***) until ***moksha***. **Buddhist** traditions: the **same soul** passes from body to body until nirvana.
        feedback: |
          For Buddhist traditions there is no unchanging self. What continues is a causal stream of conditioned states, like a flame passed from candle to candle.
    explanation: |
      Traditions' answers to what, if anything, survives death. Whether anything does is the commitment where people part ways.

  - id: suffering
    title: Suffering in traditions
    row: 5
    col: 3
    body: |
      According to **Epictetus**, what disturbs us is not events but **our judgments** about them. According to the first sermon, ordinary life is marked by ***dukkha***, which has a **cause (craving), can end and has a path**: a diagnosis with a cure. In **Job**, God says the friends have not spoken rightly, while Job's protest is not condemned, so **lament can be faithful speech**. In the Qur'an (2:155-156) the response to testing is **patience (*sabr*)**, steadfastness and trust.
    decoys:
      - body: |
          According to **Epictetus**, what disturbs us is **the events themselves**, not our judgments. According to the first sermon, ordinary life is marked by ***dukkha***, which has a **cause (craving), can end and has a path**: a diagnosis with a cure. In **Job**, God says the friends have not spoken rightly, while Job's protest is not condemned, so **lament can be faithful speech**. In the Qur'an (2:155-156) the response to testing is **patience (*sabr*)**, steadfastness and trust.
        feedback: |
          Epictetus says the reverse: men are disturbed not by things but by the principles and notions they form about them. That is why the Stoic exercise is to sort what is up to us from what is not.
      - body: |
          According to **Epictetus**, what disturbs us is not events but **our judgments** about them. According to the first sermon, ordinary life is marked by ***dukkha***, which has **no cause and no end**: life is only pain. In **Job**, God says the friends have not spoken rightly, while Job's protest is not condemned, so **lament can be faithful speech**. In the Qur'an (2:155-156) the response to testing is **patience (*sabr*)**, steadfastness and trust.
        feedback: |
          Dukkha in the first sermon has a cause, can end and has a path. It is a diagnosis with a cure, not the claim that life is only pain.
    explanation: |
      Responses to suffering as lived, side by side. Secular thinkers join in too: Frankl chooses an attitude, Camus answers by revolt and solidarity, with no cosmic purpose.

  - id: humanity
    title: Shared goods without one reason
    row: 6
    col: 2
    body: |
      Hillel, the Confucian Analects, Matthew 7:12 and a hadith each state a **close relative** of the Golden Rule, but each sits inside its **own account of why it binds**. People can agree on **acts**, on **rules or rights** (Article 1 of the UDHR, 1948) and on **reasons**, and agreement on rules **does not entail** agreement on reasons. According to **Rawls**, an **overlapping consensus** is the same rules endorsed for different reasons, unlike a **modus vivendi**, held only by a balance of power.
    decoys:
      - body: |
          Hillel, the Confucian Analects, Matthew 7:12 and a hadith each state a **close relative** of the Golden Rule, but each sits inside its **own account of why it binds**. People can agree on **acts**, on **rules or rights** (Article 1 of the UDHR, 1948) and on **reasons**, and agreement on rules **entails** agreement on reasons. According to **Rawls**, an **overlapping consensus** is the same rules endorsed for different reasons, unlike a **modus vivendi**, held only by a balance of power.
        feedback: |
          Agreement on rules does not entail agreement on reasons. A shared sentence is not a shared reason, and Maritain reported that people of opposed outlooks agree on the rights but on condition that no one asks why.
      - body: |
          Hillel, the Confucian Analects, Matthew 7:12 and a hadith each state a **close relative** of the Golden Rule, but each sits inside its **own account of why it binds**. People can agree on **acts**, on **rules or rights** (Article 1 of the UDHR, 1948) and on **reasons**, and agreement on rules **does not entail** agreement on reasons. According to **Rawls**, an **overlapping consensus** is a settlement **held only by a balance of power**, unlike a **modus vivendi**, the same rules endorsed for different reasons.
        feedback: |
          The terms are swapped. An overlapping consensus is the same rules endorsed for different reasons from each doctrine; a modus vivendi is the settlement held by a balance of power.
    explanation: |
      Where ethics meets living together: what can be shared, and what it would take to share a reason too.

  - id: synthesis
    title: Where thoughtful people part ways
    row: 7
    col: 1
    span: 3
    body: |
      Two people can part ways over the **evidence**, over a **premise or interpretation**, or over a **commitment** (what to value or trust before any argument). Naming which kind is at work shows what a conversation could settle. With $q$ questions and $k$ live positions on each there are $k^q$ combinations, so $3^6=729$ is an **upper bound**: the map is a **grid, not two camps**. **Same position** does not mean **same reason**.
    decoys:
      - body: |
          Two people can part ways over the **evidence**, over a **premise or interpretation**, or over a **commitment** (what to value or trust before any argument). Naming which kind is at work shows what a conversation could settle. With $q$ questions and $k$ live positions on each there are $k^q$ combinations, so $3^6=729$ is an **upper bound**: the map is **two camps**. **Same position** means **same reason**.
        feedback: |
          Two slips. The grid count shows that positions mostly vary independently, so the map is not two camps. And people can hold the same position for different reasons.
      - body: |
          Two people can part ways over the **evidence**, over a **premise or interpretation**, or over a **commitment** (what to value or trust before any argument). Naming which kind is at work shows what a conversation could settle. With $q$ questions and $k$ live positions on each there are $k^q$ combinations, so $3^6=18$ is an **upper bound**: the map is a **grid, not two camps**. **Same position** does not mean **same reason**.
        feedback: |
          The count is k to the power q, not k times q. With q = 6 and k = 3 it is 3^6 = 729, before ruling out any combinations that conflict.
    explanation: |
      The last box of the level: a way to say what separates two people before arguing. The course does not say which positions are right.

