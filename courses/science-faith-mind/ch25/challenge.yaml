id: ch25-challenge
title: "Level Challenge: Living With the Questions"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge: the hospice hall"
    body: |
      One **invented** case runs through every problem. Alder House is an invented hospice. Ana, 80, a retired gardener, is a resident with a few months to live. A committee of five must write one short sentence for the front hall. It has a Christian chaplain, a Muslim nurse, a Buddhist volunteer, a doctor who reads the Stoics, and a secular philosopher. Nothing here is real, and the problems never ask who is right, only what each view assumes.

      - **Problem 1 · Meaning.** Was Ana's life meaningful, and by what standard?
      - **Problem 2 · Death.** Epicurus, deprivation and the tedium of endless life.
      - **Problem 3 · Ethics.** Why is "do not abandon the dying" binding?
      - **Problem 4 · Suffering.** A roommate asks "why me?" and each tradition answers differently.
      - **Problem 5 · The sentence.** What can all five sign, and what stays unsaid?

      Each view is told *according to* its source. Each problem ends by separating fact, live debate and commitment.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      - **Meaning.** According to the Stanford Encyclopedia of Philosophy, meaning in a life is explained by **subjectivism** (it depends on one's attitudes), **objectivism** (it is partly independent of them) or a **hybrid** view. According to Susan Wolf, a hybrid view needs both: being drawn to something and its being worth being drawn to. According to Viktor Frankl, life asks something of each person, and meaning can be found through a deed, an experience, or an attitude toward unavoidable suffering. According to Thomas Nagel ("The Absurd", 1971), the absurd comes from taking life seriously while being able to step back and see the seriousness as arbitrary.
      - **Death.** According to Epicurus, death is nothing to us: when we are, death is not, and when death is present, we are not. According to Nagel ("Death", 1970), death is bad when it **deprives** a person of goods they would have had. According to Bernard Williams ("The Makropulos Case", 1973), an endless life would run out of **categorical desires**, the desires that give a reason to go on.
      - **Ethics.** According to the Euthyphro question: is an act good because it is commanded, or commanded because it is good? According to Robert Adams, goodness is tied to God's own character. According to Erik Wielenberg, some moral truths are basic and need no further ground. According to Sharon Street (2006), if evolution shaped our moral dispositions for survival, a match with moral truth would be a coincidence.
      - **Suffering.** According to Epictetus, people are disturbed by the judgments they form about things. According to the first sermon of the Buddha, suffering (*dukkha*) has a cause, craving, and can end. According to the Book of Job, God answers from the whirlwind with wisdom and power, not an explanation. According to the Qur'an (2:155), people are tested, and *sabr* is patience.
      - **Shared goods.** Three levels: **acts**, **rules or rights**, and **reasons**. Traditions agree widely on the first two and part ways on the third. According to John Rawls, an **overlapping consensus** is endorsed by each person from within their own view, unlike a **modus vivendi**, which a balance of power holds in place.

  - type: mcq
    id: hook
    title: "Guess first"
    prompt: |
      The five committee members must agree on one sentence for the hall of a hospice. Before any analysis, guess: how hard will it be for them to agree on a sentence about what to do for the dying, and how hard to agree on why?
    options:
      - text: "Agreeing on what to do will be easier than agreeing on why: the actions can overlap while the reasons differ."
        correct: true
        feedback: |
          That is the guess the problems will test. People can agree not to leave a dying person alone while giving a religious, a rational or a humane reason.
      - text: "Agreeing on why will be as easy as agreeing on what to do, because both come from the same belief."
        feedback: |
          The five hold different beliefs. Sharing a conclusion does not mean sharing the premises behind it.
      - text: "They will agree on neither, because five different views share nothing."
        feedback: |
          Views with different foundations can still recommend the same act. Overlap in practice with disagreement in reasons is common.
    explanation: |
      Keep the guess. Each problem takes one question the five answer differently.

  # ---------------- Problem 1 ----------------
  - type: mcq
    id: p1-garden
    title: "Problem 1 · Meaning"
    prompt: |
      **Problem 1.** Ana tended one large garden for fifty years. She loved the work, and neighbours came to rest in it. The three families of theories ask what makes a life meaningful. Her brother Leo spent fifty years counting the blades of grass on one lawn. He loved it, and nobody else benefits. Which families say that Leo's life is meaningful?
    options:
      - text: "Subjectivism only: he cared about it and pursued it, and that is all this view asks."
        correct: true
        feedback: |
          Yes. Subjectivism makes meaning depend on the person's attitudes. Objectivism asks for a worthwhile object, and the hybrid view asks for both attraction and worth, so both deny it for Leo.
      - text: "Subjectivism and the hybrid view: both count his love of the task."
        feedback: |
          The hybrid view needs the love and the worth of the object. Counting grass fails the second part, so the hybrid view does not count his life as meaningful on this basis.
      - text: "All three, because all three count what a person cares about."
        feedback: |
          Only subjectivism stops at what a person cares about. The other two add a standard outside the person's attitudes.
    explanation: |
      Ana's garden passes every test (loved, and worth loving). Leo's lawn splits the three families, which is why this case separates them.

  - type: mcq
    id: p1-wolf
    title: "Which does Ana need?"
    prompt: |
      Ana is told her garden mattered, but she cannot feel it today because she is tired and in pain. According to Wolf's hybrid view, meaning arises when subjective attraction meets objective attractiveness. According to Wolf, what follows about her garden?
    options:
      - text: "Her tiredness today does not undo the meaning: the garden was loved and worth loving, whatever she feels now."
        correct: true
        feedback: |
          Yes. In Wolf's lecture, thinking or feeling that a life is meaningful does not make it so, and by the same logic not feeling it today does not unmake it. The conditions concern a life's attraction and worth, not a passing mood.
      - text: "The meaning is gone, because a feeling of meaning is required at every moment."
        feedback: |
          The hybrid view does not make a feeling the test. A feeling can come and go while the life's meaning depends on engagement with something worthwhile.
      - text: "The meaning depends only on what the neighbours think of the garden."
        feedback: |
          Other people's opinions are neither the attraction nor the worth. Wolf's two conditions are the person's engagement and the object's real worth.
    explanation: |
      A critic of Wolf replies that "worth" must be explained: what makes an object worthwhile without God, or without a feeling? That is a live debate, and a believer answers it differently from a naturalist.

  - type: mcq
    id: p1-nagel
    title: "So what, in a hundred years?"
    prompt: |
      Ana says: "In a hundred years no one will know the garden existed, so what was it for?" According to Nagel ("The Absurd", 1971), the absurd arises when we take life seriously and can still step back to a view from which the seriousness looks unjustified. Which reading of Nagel fits?
    options:
      - text: "Her question is the step back. It does not cancel the seriousness she felt, and Nagel suggests meeting the clash with irony, not with heroism or despair."
        correct: true
        feedback: |
          Yes. The step back and the seriousness both stay. Nagel's suggestion is a stance toward the clash, not a proof that her life lacked meaning.
      - text: "Nagel concludes that the question proves her garden meant nothing."
        feedback: |
          Nagel does not say the outside view proves meaninglessness. He says the two views clash, and the clash is the absurd.
      - text: "Nagel says she should refuse to ask the question, because stepping back is a mistake."
        feedback: |
          He holds the opposite: stepping back is natural to us, and that is why the clash cannot be avoided.
    explanation: |
      A believer answers Ana differently: a God who knows the garden means it was not forgotten. Whether such a God exists is a commitment the case cannot settle.

  - type: mcq
    id: p1-frankl
    title: "When she can no longer garden"
    prompt: |
      Ana can no longer walk to the garden. According to Frankl, meaning can come through a deed, an experience, or an attitude toward unavoidable suffering. Her illness cannot be avoided, and she chooses to meet it with patience and to tell her stories to the staff. Which of Frankl's three ways does choosing her stance toward the illness correspond to?
    options:
      - text: "The attitude toward unavoidable suffering: the circumstance is fixed, and the stance is what she can still choose."
        correct: true
        feedback: |
          Yes. In essence, Frankl holds that when suffering cannot be avoided, a person can still choose the stance taken toward it.
      - text: "A deed: any choice she makes counts as a deed in his sense."
        feedback: |
          A deed is something done in the world, such as creating a work. His third way is the one for what cannot be changed, which is her case.
      - text: "Frankl's view does not apply, because he held that meaning needs health."
        feedback: |
          His claim goes the other way: even with fixed, unavoidable suffering, a person can choose a stance.
    explanation: |
      A critic worries this could ask the suffering to accept more than they should. Frankl's claim concerns suffering that cannot be avoided, not suffering that can be removed.

  # ---------------- Problem 2 ----------------
  - type: mcq
    id: p2-epicurus
    title: "Problem 2 · Death"
    prompt: |
      **Problem 2.** Ana says: "I do not mind being dead. I mind the things left undone." Take Epicurus's argument: P1, only experiences matter; P2, death ends all experience; C, death is nothing to us. According to Nagel's deprivation account, which premise fails, and what makes her regret reasonable?
    options:
      - text: "P1 fails: a person can be harmed by what they never feel, because death takes goods the life would have had."
        correct: true
        feedback: |
          Yes. On the deprivation account the badness of death is the value of the life it removes, and no experience of being dead is needed.
      - text: "P2 fails: death does not end experience, so there is something to fear."
        feedback: |
          Nagel's account does not need an afterlife. It accepts that death ends experience and denies that only experiences matter.
      - text: "The step from P1 and P2 to C fails: the argument is invalid."
        feedback: |
          The step is valid. If both premises were true, C would follow. The reply is to reject P1.
    explanation: |
      A defender of Epicurus replies that a harm needs someone to be harmed, and the dead are not there. Whether the deprivation account answers that is a live debate.

  - type: mcq
    id: p2-williams
    title: "Would she want it to go on forever?"
    prompt: |
      Ana adds, half joking: "Given the choice I would live forever." According to Williams, an endless life would run out of categorical desires and go flat, or would change the person until it was no longer her. Can a reader hold both Nagel's view that Ana's death takes goods from her and Williams's view that endless life would be bad?
    options:
      - text: "Yes: Nagel's point is about the goods this life still had, and Williams's point is about a life with no end at all. A death can be a loss without immortality being a gain."
        correct: true
        feedback: |
          Yes. Williams himself counts an early death as a misfortune while arguing that endless life would be tedious. The two claims are about different things.
      - text: "No: if death is a loss, then endless life must be good, or the loss is not real."
        feedback: |
          That step does not follow. A person can lose something worth having without an endless supply of it being a good.
      - text: "No: Williams says death is never a loss, so he agrees with Epicurus."
        feedback: |
          Williams does not agree with Epicurus here. He holds that a death can be a misfortune, and he argues that endlessness would not be better.
    explanation: |
      Critics of Williams reply that an endless life need not be dull, and Fischer is among those who say a long life could stay engaging. That is a live debate, and what to want from time is a commitment.

  - type: mcq
    id: p2-views
    title: "Four voices at the bedside"
    prompt: |
      The committee members each describe what happens after death, according to their tradition. Select every statement that is correct *according to the tradition named*.
    multiple: true
    options:
      - text: "Buddhist traditions: there is no unchanging self; what continues across death is a causal link in a stream of changing states."
        correct: true
        feedback: |
          Yes. According to Buddhist traditions, non-self (*anatta*) replaces the idea of an unchanging soul.
      - text: "Islamic tradition: after death the person waits in the *barzakh*, a partition, until the Day of Resurrection."
        correct: true
        feedback: |
          Yes, in the tradition's own terms. The Qur'an's word *barzakh* means a barrier or partition, and 23:100 is tied to the waiting state.
      - text: "Most Christian churches: the hope is for the resurrection of the body, as the creeds state it."
        correct: true
        feedback: |
          Yes. Christian teaching is mainly about resurrection, and scholars disagree about what Paul's "spiritual body" means.
      - text: "Hindu traditions: there is no self, and nothing at all continues."
        feedback: |
          The Hindu traditions in the lesson hold the opposite: the *atman*, an unchanging self, does not die with the body and finds another.
    explanation: |
      The four views cannot all be true in the same sense, and the case cannot choose among them. That is a layer-3 matter. What the committee can do is describe each fairly.

  # ---------------- Problem 3 ----------------
  - type: mcq
    id: p3-euthyphro
    title: "Problem 3 · Ethics"
    prompt: |
      **Problem 3.** The chaplain says the duty not to abandon the dying rests on God. The philosopher asks the Euthyphro question: is it right because God commands it, or does God command it because it is right? If it is right only because God commands it, the commands look arbitrary. According to Adams, how does a theist answer?
    options:
      - text: "Goodness is tied to God's own character, so it is neither a whim of God nor a standard above God."
        correct: true
        feedback: |
          Yes. In Adams's account, goodness is likeness to God, who is essentially good, and God's commands aim at the good.
      - text: "God's commands are arbitrary, and that is acceptable."
        feedback: |
          Adams does not accept arbitrariness. His point is that God's nature, not a whim, grounds the good.
      - text: "Goodness is a standard that exists above God and that God merely reports."
        feedback: |
          That is the other horn of the dilemma. Adams avoids it by placing goodness in God's character.
    explanation: |
      The secular reply is that if God's nature is good because it is just and kind, then justice and kindness are good in themselves, and could be so without God. Each side can state the other's objection.

  - type: mcq
    id: p3-street
    title: "A challenge to the philosopher"
    prompt: |
      The philosopher holds that "do not abandon the dying" is an objective moral truth. The chaplain cites Sharon Street's argument: evolution shaped our moral dispositions for survival and reproduction, so if our moral beliefs match objective moral truth, that match would be a coincidence. What does the argument show?
    options:
      - text: "It does not show the duty is false. It challenges the realist to explain why our beliefs would match moral truth."
        correct: true
        feedback: |
          Yes. The argument targets the realist's explanation of the match, and realists reply in several ways. It does not claim morality is false.
      - text: "It shows the duty is only a product of evolution, so it has no force."
        feedback: |
          That is the genetic fallacy: a belief's origin is a cause, and whether it is justified is a question of reasons. Street's argument is more careful than that.
      - text: "It shows that the chaplain's view is correct, since God must have guided evolution."
        feedback: |
          The argument says nothing about God. The Stanford Encyclopedia presents it as a challenge to realist theories of value, theistic or not.
    explanation: |
      Whether the challenge succeeds is a live debate (layer 2).

  - type: mcq
    id: p3-craig
    title: "Where would a critic push back?"
    prompt: |
      The chaplain gives a version of William Lane Craig's argument: P1, if God does not exist, objective moral values and duties do not exist; P2, they do exist; C, God exists. It is valid in form. The philosopher accepts P2. Which premise does the philosopher, following Wielenberg, reject, and does Craig claim that nonbelievers cannot be moral?
    options:
      - text: "P1: moral truths can be basic and stand without God. Craig does not say that people must believe in God to live well; his claim is about the ground of morality."
        correct: true
        feedback: |
          Yes. The disagreement is about ground, not about whether nonbelievers can act well.
      - text: "P2: the philosopher denies objective moral values, and Craig says nonbelievers cannot be moral."
        feedback: |
          The philosopher accepts P2, and Craig explicitly does not say nonbelievers cannot know right from wrong.
      - text: "The validity of the form: it is a fallacy, and Craig says belief is needed for morality."
        feedback: |
          The form is valid, so the debate is about premises. Craig's claim concerns what grounds morality.
    explanation: |
      Layers: that Craig states the argument is layer 1. Whether P1 is true is a live debate. Whether God exists is a layer-3 commitment.

  # ---------------- Problem 4 ----------------
  - type: mcq
    id: p4-job
    title: "Problem 4 · Suffering"
    prompt: |
      **Problem 4.** Ana's roommate asks: "Why is this happening to me?" The chaplain recalls the Book of Job. According to the book, Job's three friends argue that he must have sinned, Job refuses, and God answers from a whirlwind. What does God's speech give Job, and what does the epilogue say about the friends?
    options:
      - text: "A speech about divine wisdom and power, not an explanation of his suffering. The epilogue says the friends have not spoken rightly of God, as Job has."
        correct: true
        feedback: |
          Yes. According to the book, the friends are rebuked and Job is not, so the view that suffering always signals sin is not the book's last word.
      - text: "A clear explanation: Job's suffering was a punishment for a hidden sin."
        feedback: |
          The book gives no such explanation, and it rebukes the friends who said so.
      - text: "A promise that Job's suffering will pass, and nothing else."
        feedback: |
          The speech is about God's wisdom and power. The book does restore Job in the epilogue, but the whirlwind speech itself is not a promise.
    explanation: |
      Readers take the book in more than one way: as a protest that is answered, or as a rebuke to easy answers. How to read it is a live debate.

  - type: mcq
    id: p4-buddhist
    title: "A different kind of answer"
    prompt: |
      The Buddhist volunteer does not answer "why me?" with a reason from God. According to the first sermon, there is a cause of *dukkha*, which is craving, and the suffering can end by the path. What kind of answer is this?
    options:
      - text: "A diagnosis, cause, prognosis and treatment, like a physician's, and not a claim that nothing good ever happens."
        correct: true
        feedback: |
          Yes. It answers how suffering arises and how it can end, and it does not say why this person was chosen.
      - text: "A claim that suffering is an illusion, so nothing needs treating."
        feedback: |
          The first truth lists real suffering: birth, aging, sickness and death. The teaching is not that it is an illusion.
      - text: "A claim that suffering is a test sent by God."
        feedback: |
          That is the Qur'anic frame (2:155), told according to Islam. The Buddhist teaching is a different shape of answer.
    explanation: |
      A critic of the Buddhist view may say that it does not speak to a person asking "why me?". A defender replies that the question itself may rest on a craving for things to be otherwise. Which reply is better is a matter of one's commitments.

  - type: mcq
    id: p4-voices
    title: "What each voice says"
    prompt: |
      At the bedside the committee hears several responses to suffering. Select every statement that is correct *according to the source named*.
    multiple: true
    options:
      - text: "Epictetus: people are disturbed by the judgments they form about things, and some things are up to us while the body is not."
        correct: true
        feedback: |
          Yes. The Stoic practice is to examine the judgment and act well on what is up to us. It does not deny that illness is painful.
      - text: "The Qur'an: suffering can be a test (2:155), and *sabr*, patience, covers both choices and enduring what happens."
        correct: true
        feedback: |
          Yes. According to IslamWeb, *sabr* includes persevering in worship, which is a choice, and enduring decrees, which is not.
      - text: "Christians: in the cross, God shares human suffering, as the cry in Mark 15:34 recalls."
        correct: true
        feedback: |
          Yes, as Christians hold it. The cry echoes Psalm 22, and how Paul's words in Colossians 1:24 should be read is disputed.
      - text: "Frankl: suffering is always meaningful, so no one should try to avoid it."
        feedback: |
          Frankl's claim is narrower. It concerns the stance one can choose toward suffering that cannot be avoided, not suffering that can be removed.
    explanation: |
      None of these answers the question "why" in the same way. Some give a reason (a test), some a response (a stance), some a presence (God shares it). Which kind of answer a person needs is part of the disagreement.

  # ---------------- Problem 5 ----------------
  - type: mcq
    id: p5-levels
    title: "Problem 5 · The sentence"
    prompt: |
      **Problem 5.** The committee drafts three candidate sentences. A: "No one in this house dies alone." B: "Treat others as you would wish to be treated." C: "Every person here bears God's image, and this is why we care for them." Using the three levels (acts, rules, reasons), which can all five members sign?
    options:
      - text: "A and B: an act and a rule that all five can accept for their own reasons. C states a reason that only some hold."
        correct: true
        feedback: |
          Yes. The wide agreement is at the levels of acts and rules. A reason that rests on one tradition's doctrine will not be shared by the secular members.
      - text: "All three, because all three say the same thing."
        feedback: |
          They are on different levels. C adds a reason the others do not state, and members who do not hold it cannot sign it honestly.
      - text: "Only C, because it is the only one that explains why."
        feedback: |
          Explaining why is exactly what divides the five. A sentence that gives one reason is the one most members would have to reject or reinterpret.
    explanation: |
      The shared sentence names agreement at the first two levels and makes no claim about the third.

  - type: mcq
    id: p5-golden
    title: "The Golden Rule in four texts"
    prompt: |
      The members bring four versions of the Golden Rule. In the translations read for the course, Hillel says "What is hateful to you, do not to your neighbor". Confucius in the Analects (Legge) says "What you do not want done to yourself, do not do to others". Matthew 7:12 (World English Bible) says "whatever you desire for men to do to you, you shall also do to them", and the hadith of Anas says that none of you will have faith till he loves for his brother what he loves for himself. Which two are phrased as a prohibition, and what does this show?
    options:
      - text: "Hillel and Confucius are phrased as what not to do; Matthew and the hadith as what to do. The wording differs and the family resemblance remains."
        correct: true
        feedback: |
          Yes. A committee can sign a rule in its own wording, and a critic can ask whether the negative and positive forms always give the same result.
      - text: "Matthew and the hadith are phrased as prohibitions, and the other two as commands."
        feedback: |
          It is the other way round. The Matthew and hadith lines say what to want for others, while Hillel and Confucius say what to avoid.
      - text: "All four are prohibitions, so they are one text."
        feedback: |
          They are four texts from four traditions, and the wording differs. A family of sayings is not one saying.
    explanation: |
      Agreement here is wording-sensitive. It is real, and it is not identity.

  - type: numeric
    id: p5-count
    title: "How many ways to agree?"
    prompt: |
      Four committee members all accept the same act, caring for the dying. Each gives one of three reasons: God, reason, or shared human nature. If each member chooses independently, how many different combinations of reasons could the four hold?
    answer: 81
    answerText: '$3^4 = 81$'
    wrong:
      - { value: 12, feedback: "That is 4 times 3, which counts one reason per person added up. Each of the four members picks one of three, and choices multiply: $3\\times3\\times3\\times3$." }
      - { value: 64, feedback: "That is $4^3$, which swaps members and reasons. The four members each choose among three reasons, so the count is $3^4$." }
    hint: |
      Each member has three options, independently of the others.
    explanation: |
      Each of four members has 3 options, so there are $3^4 = 81$ combinations of reasons, and all 81 can lead to the same act. That is why a shared act tells you little about the reasons behind it.

  - type: mcq
    id: p5-rawls
    title: "Why do they sign?"
    prompt: |
      The five sign the sentence. According to Rawls, in an **overlapping consensus** each citizen endorses a shared core from within their own view of life, and a **modus vivendi** is a settlement held in place by a balance of power. Suppose the chaplain signs because her own faith commands it, the nurse because of the Qur'an, the volunteer because of compassion, the doctor because of Stoic duty, and the philosopher because of a basic moral truth. What is this?
    options:
      - text: "An overlapping consensus: each signs for reasons drawn from their own view."
        correct: true
        feedback: |
          Yes. The agreement does not rest on a balance of power, and each affirms the rule from within.
      - text: "A modus vivendi: they signed to avoid trouble."
        feedback: |
          A modus vivendi rests on power or convenience. Here each member has an inside reason, which is the mark of an overlapping consensus.
      - text: "Neither: agreement needs a single shared reason."
        feedback: |
          That is the claim an overlapping consensus rejects. It needs a shared core, not a shared ground.
    explanation: |
      Whether such a consensus is stable, and whether it is possible in every case, are live debates. Rawls himself does not claim it is possible in every liberal society.

  # ---------------- Closing ----------------
  - type: mcq
    id: close-part
    title: "Closing weighing"
    prompt: |
      Across the case, thoughtful people part ways at several points. Which of these is a **layer-3** claim (a commitment that the case cannot settle)?
    options:
      - text: "A God exists who grounds meaning and morality, or no such God exists."
        correct: true
        feedback: |
          Yes. The committee members hold different answers, and nothing in the case forces one of them.
      - text: "According to Williams, an endless life would run out of categorical desires."
        feedback: |
          That is layer 1, what a source argues.
      - text: "Philosophers disagree on whether the deprivation account answers Epicurus."
        feedback: |
          That is layer 2, a report of a live debate.
    explanation: |
      The level does not say which way to live or believe is best. It shows where the disagreement sits: in sources (layer 1), in live debates such as deprivation against Epicurus and the Street challenge (layer 2), and in commitments such as whether God exists and what a good life is for (layer 3).

  - type: text
    id: summary
    title: "What you now own"
    body: |
      The method: take one hard case, ask which view answers each part, name the premise or value on which each answer rests, and sort the claims into source, live debate and commitment.

      Tools used. Meaning: subjectivism, objectivism and Wolf's hybrid view (attraction meeting worth), Frankl's three ways (deed, experience, attitude), Nagel's clash and irony. Death: Epicurus's argument
      $$\text{P1} \wedge \text{P2} \Rightarrow \text{C}$$
      with P1 (only experiences matter), P2 (death ends experience) and C (death is nothing to us), the deprivation reply that rejects P1, and Williams's categorical desires against endless life. Ethics: the Euthyphro question, Adams's answer in God's character, Wielenberg's basic truths, and Street's challenge to realism. Suffering: Stoic judgment, the Buddha's diagnosis, Job's whirlwind, *sabr*, the cross, Frankl's stance. Shared goods: acts, rules and reasons, and an overlapping consensus against a modus vivendi. With $m$ members each choosing one of $k$ reasons, the number of reason profiles is
      $$k^m.$$

      What stays open: whether meaning needs God, whether death is a loss, why morality binds, what suffering is for, and whether agreement on acts can be stable without agreement on reasons.

      **Next:** the final exam on Spiritism, the cosmos and living with the questions.
