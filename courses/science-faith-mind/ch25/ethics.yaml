id: ch25-ethics
title: "Where Does Ethics Come From?"
kind: concept
own: |
  The setting: a person asks why an act such as a village stoning a thief is wrong, if it is. Five answers, told *according to* the thinkers named, each saying where the wrongness comes from.
  - **Divine command and the Euthyphro dilemma.** Is an act good because God commands it, or does God command it because it is good? The first horn seems to make morality arbitrary; the second puts goodness before God's command. According to Robert Adams, as the Stanford Encyclopedia reports, God is benevolent and just, so God's commands flow from {{ God's good and just nature }}, and are not arbitrary.
  - **Natural law (Aquinas, ST I-II q.94).** Reason grasps basic human goods (life, family, knowledge, fellowship) and the first precept:
  {{ $$\begin{aligned}&\text{Good is to be done and pursued,}\\&\text{and bad avoided}\end{aligned}$$ }}
  Aquinas ties this law to God's eternal law, but holds that it is reached by reason.
  - **Consequences (Bentham, Mill).** According to Mill's *Utilitarianism* (first published in 1861), an act is right
  {{ $$\begin{aligned}&\text{in proportion as it tends}\\&\text{to promote happiness}\end{aligned}$$ }}
  Bentham counts pleasures by amount; Mill says some are better in kind. Only the total outcome counts, whoever bears the cost.
  - **Duty (Kant).** An act is judged by its maxim (the rule you act on), not its results. According to Kant, one test is whether you could will the maxim as a universal law; another is that you must {{ never treat humanity merely as a means, but always also as an end }}.
  - **Virtue (Aristotle).** Ask what kind of person to be, not which rule to follow. According to Aristotle, virtues are stable traits of character that serve a flourishing life (*eudaimonia*). The guide is {{ what a person of good character and practical wisdom would do }}.
  - **Evolved morality.** Evolutionary accounts explain how our moral feelings may have arisen. The *origin* of a belief is a different question from its *justification*, so {{ how we came to hold a moral belief does not settle whether it is justified }}. Arguing otherwise is the genetic fallacy.
  - **Where thoughtful people part ways.** Fact: who held which theory. Live debate: whether God's nature escapes the arbitrariness charge, which of the four ethical theories is right, and whether an evolutionary origin undermines moral truth. Commitment: whether morality needs a source beyond the world.

cards:
  - type: text
    id: hook
    title: "A village decides"
    body: |
      A village catches a thief who stole a goat. By custom the crowd stones him to death. Nobody doubts that he stole it, and the village has done this for generations.

      Before any theory, decide for yourself: is the stoning wrong? And if you say it is, what is the *source* of the wrongness? God's command, nature, the pain caused, a duty, the kind of people the villagers have become, or only how our species happens to feel?

      This lesson sets out five answers to that last question, each as its best defenders state it, and asks what each one assumes.

  - type: mcq
    id: guess
    title: "Guess first"
    multiple: true
    prompt: |
      Suppose you think the stoning is wrong. Which of these reasons would you count as a serious candidate? Select every one you would consider.
    options:
      - text: "It breaks a command that comes from God."
        correct: true
        feedback: |
          A serious candidate, held by many believers. Divine command theory is the first theory below.
      - text: "It violates what human reason can see is good for human beings, such as life."
        correct: true
        feedback: |
          A serious candidate. This is the natural law tradition, which many believers and some non-believers share.
      - text: "It causes far more suffering than any good it brings."
        correct: true
        feedback: |
          A serious candidate. This is the consequences view, utilitarianism.
      - text: "It treats a person as a mere tool for the crowd's purposes, whatever the results."
        correct: true
        feedback: |
          A serious candidate. This is the idea behind Kant's ethics of duty.
      - text: "A decent person would not do it, because it shows cruelty."
        correct: true
        feedback: |
          A serious candidate. This is virtue ethics.
      - text: "The village approves of it, so it is right for the village and nothing more can be said."
        feedback: |
          This is a real view, called cultural relativism, but it is not one of this lesson's five. Notice that it cannot say the village is mistaken, which is what many people want to say about a stoning.
    explanation: |
      The first five are the lesson's five families, each a candidate source of wrongness. Nobody has to pick one now. The point is to see what each needs: a God, a human nature, a count of wellbeing, a duty or a character.

  - type: order
    id: euthyphro
    title: "The Euthyphro dilemma"
    prompt: |
      In Plato's dialogue *Euthyphro* (usually counted among his early dialogues), Socrates asks whether the pious is loved by the gods because it is pious, or pious because it is loved by the gods. Applied to morality, put this argument in order: the question first, then the first horn with its problem, then the second horn with its problem.
    steps:
      - "Ask: is an act good because God commands it, or does God command it because it is good?"
      - "First horn: an act is good because God commands it, so goodness just is what God commands."
      - "Problem: had God commanded cruelty for its own sake, cruelty would be good, so morality looks arbitrary."
      - "Second horn: God commands an act because it is good, so goodness is there before the command."
      - "Problem: goodness then stands apart from God, and God is no longer its source."
    hint: |
      A dilemma poses a question, takes one answer and draws its cost, then takes the other answer and draws its cost.
    explanation: |
      Plato's question was about the gods and the pious. Later writers apply it to a single God and to goodness in general. Which horn a believer takes, and whether there is a third option, is the next card.

  - type: text
    id: dct
    title: "Divine command theory"
    body: |
      **Divine command theory** says that what makes an act morally right or wrong is God's command or will. Told *according to* its defenders, it gives morality a firm source outside human opinion: if God forbids cruelty, cruelty is wrong whatever any village decides.

      The first objection is the first horn of the dilemma. If goodness is whatever God commands, the commands look arbitrary: God could have commanded something monstrous, and then it would have been good. The Stanford Encyclopedia of Philosophy lists this *arbitrariness* objection, and a second, the "God is good" objection: if goodness only means "what God commands", saying that God is good says little, since God would only be measuring up to a standard God sets.

      The best known reply is that God's commands are not arbitrary because they flow from God's nature. According to Robert Adams, as the encyclopedia reports, God is to be understood as benevolent and just. On this view goodness is not a standard above God and not a whim: it is the character of God, and God's commands express it. The encyclopedia also notes that the objection weakens when God's will explains fewer moral properties, for instance only obligation and not all of goodness.

      A critic can still press: if God's character is good *because* it is just and benevolent, then justice and benevolence seem to be good independently, which is the second horn again. A defender answers that these are simply what goodness is, found in God as their source. Which of the two readings is stronger is a live debate.

  - type: mcq
    id: dct-reply
    title: "The believer's reply"
    prompt: |
      A believer says: "God's commands are not arbitrary, because God cannot command cruelty for its own sake." Which idea carries this reply?
    options:
      - text: "God's commands flow from God's good and just nature, so goodness is neither a whim nor a standard above God."
        correct: true
        feedback: |
          Yes. This is the reply Adams is reported to give: the good is grounded in God's nature, and the commands express it.
      - text: "Humans vote on which commands are good, so they cannot be arbitrary."
        feedback: |
          That replaces the source of morality with human opinion, which is a different theory and not a reply for the divine command theorist.
      - text: "Arbitrary commands would still be good, because all that matters is that God issues them."
        feedback: |
          That accepts the first horn and the objection together. The reply tries to avoid the charge, and does not embrace it.
      - text: "The dilemma is invalid, because nothing is ever good by being commanded."
        feedback: |
          That would be a rejection of divine command theory, not a reply from inside it.
    explanation: |
      A critic's follow-up is the same dilemma one step back: is God's nature good because it is just, or just because it is God's? Believers and critics part ways here, and the lesson does not settle it.

  - type: text
    id: natural-law
    title: "Natural law"
    image:
      src: img/aquinas.webp
      alt: "Panel painting of Thomas Aquinas in a Dominican habit holding a book, by Carlo Crivelli"
      caption: "Thomas Aquinas (c. 1225 to 1274), an Italian Dominican friar, in a panel Carlo Crivelli painted in 1476; his account of natural law is in the Summa Theologiae."
      credit: "Carlo Crivelli, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Aquinas_by_Carlo_Crivelli.png"
    body: |
      **Natural law** theory says moral truths are found in human nature and grasped by reason. According to Thomas Aquinas (Summa Theologiae I-II, question 94), the first precept of practical reason, in the Stanford Encyclopedia's translation, is that good is to be done and pursued, and bad avoided. This is not yet a rule such as "do not steal". It is the starting point from which reason works out rules.

      The encyclopedia lists the basic human goods that reason grasps as worth pursuing: life, marriage and bringing up children, knowledge (including knowing the ultimate source of things), fellowship with others, and practical reasonableness itself. Acts that damage such goods are wrong; acts that respect them are right. The stoning kills a person for a theft, which a natural law thinker would test against the good of life.

      Aquinas also holds that law is an ordinance of reason for the common good, and that the natural moral law is a participation in God's *eternal law*, the way God governs creation. So the source of ethics is in God, but the *knowledge* of it is open to human reason. That is why many non-believers have also defended versions of natural law.

  - type: mcq
    id: natural-law-mcq
    title: "Natural does not mean what animals do"
    prompt: |
      A student says: "Natural law means that whatever happens in nature is right, and it can only be known from scripture." Which correction fits Aquinas's view as the Stanford Encyclopedia reports it?
    options:
      - text: "It says reason can grasp basic human goods such as life and knowledge, and ties the law to God's eternal law."
        correct: true
        feedback: |
          Yes. The law is about what is good for human beings as rational agents, and it is reached by reason, though its ground is said to be in God.
      - text: "It says whatever is common among animals defines what is right for us."
        feedback: |
          That is the slip in the student's version. The goods in question are goods for rational human beings, and being found in nature is not the test.
      - text: "It says the law is a set of arbitrary orders that God gives and reason cannot examine."
        feedback: |
          That sounds like the first horn of the dilemma. On this view, the precepts are an ordinance of reason, which reason can study.
      - text: "It says moral truths depend on what each society has decided."
        feedback: |
          That is the cultural relativism of the first card. Natural law holds that the goods of life or knowledge do not depend on any society's vote.
    explanation: |
      Critics reply that the step from "this is natural" to "this is good" needs defence, and that people disagree on what human nature requires. Defenders answer that the goods are about flourishing, not about statistics of behaviour.

  - type: text
    id: consequences
    title: "Judge by outcomes"
    image:
      src: img/mill.webp
      alt: "Portrait of John Stuart Mill by George Frederic Watts"
      caption: "John Stuart Mill (1806 to 1873), painted by G. F. Watts; his Utilitarianism was first published in 1861, in magazine instalments, and as a book in 1863."
      credit: "George Frederic Watts, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Stuart_Mill_G_F_Watts.jpg"
    body: |
      **Utilitarianism** says that the right act is the one with the best consequences for wellbeing. According to Jeremy Bentham (1748 to 1832), in the *Introduction to the Principles of Morals and Legislation* (printed 1780, published 1789), nature has placed humankind under two sovereign masters, pain and pleasure, and the principle of utility approves an act by whether it adds to or subtracts from the happiness of those concerned. He proposed to weigh pleasures and pains by features such as intensity, duration, certainty and how many people are affected.

      According to John Stuart Mill, in *Utilitarianism* (first published in 1861), actions are right in proportion as they tend to promote happiness. Mill held that pleasures differ in quality as well as in amount: in essence, it is better to be a dissatisfied Socrates than a satisfied fool. Whether that fits with a pure pleasure count is debated.

      The key feature is that only the total outcome counts. The theory has no place for a rule that holds whatever the results, and it does not ask whose wellbeing is traded for whose. That is its strength, since it treats everyone's wellbeing alike, and its most pressed objection.

  - type: numeric
    id: dam
    title: "A small count"
    prompt: |
      A council can open a flood channel that saves 300 downstream households from a flood, but it will flood 40 households in the channel's path. Each saved household avoids a loss of 2 units of wellbeing. Each flooded household suffers a loss of 5 units. If the council does nothing, the 300 households lose 2 each and the 40 lose nothing. Counting only total wellbeing, how many units better is opening the channel than doing nothing?
    answer: 400
    answerText: '400'
    wrong:
      - value: 600
        feedback: |
          That counts only the 300 x 2 = 600 units saved and forgets the 40 x 5 = 200 units lost in the channel.
      - value: 200
        feedback: |
          That is only the loss in the channel. The gain from the 300 saved households must be counted too.
    hint: |
      Count the units saved, subtract the units lost, and compare with doing nothing.
    explanation: |
      Saved: 300 x 2 = 600. Lost: 40 x 5 = 200. Net gain: 600 - 200 = 400 units, so a utilitarian says open the channel. A critic says the 40 households were treated only as a cost to be paid. That is exactly the point where the next theory objects.

  - type: text
    id: kant
    title: "Duty, whatever the results"
    image:
      src: img/kant.webp
      alt: "Portrait of Immanuel Kant, about 1790"
      caption: "Immanuel Kant (1724 to 1804) published the Groundwork of the Metaphysics of Morals in 1785."
      credit: "Unknown, possibly Elisabeth von Stägemann (Anton Graff school), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Immanuel_Kant_portrait_c1790.jpg"
    body: |
      According to Immanuel Kant, in the *Groundwork of the Metaphysics of Morals* (1785), the moral worth of an act lies in its **maxim**, the rule you act on, and not in its results. Morality gives **categorical imperatives**: commands that bind a rational agent whatever ends the agent happens to have. A **hypothetical imperative** binds only if you want the end ("if you want to pass, study").

      One formulation, as the Stanford Encyclopedia gives it, says to act only in accordance with that maxim through which you can at the same time will that it become a universal law. Take the maxim "I will make a false promise whenever it gets me money". If everyone acted on it, no promise would be believed, and the practice of promising, on which the maxim depends, would collapse. So the maxim fails the test.

      A second formulation says that we should never treat humanity, in ourselves or in others, merely as a means, but always also as an end in itself. Applied to the flood channel, the question is not only the total of 400 units, but whether the 40 households are being used merely as a means. Kant's followers do not say the total is irrelevant. They say it cannot be the whole story.

  - type: mcq
    id: kant-mcq
    title: "Which question belongs to which theory?"
    prompt: |
      Facing the flood channel, one person asks: "Could I will that everyone act on the rule I am following, and am I treating the 40 households merely as a means?" Which theory is this question from?
    options:
      - text: "Kant's ethics of duty."
        correct: true
        feedback: |
          Yes. Testing a maxim as a universal law and the humanity formulation are the two Kantian tests.
      - text: "Utilitarianism."
        feedback: |
          A utilitarian asks for the total change in wellbeing, which gave +400 and ignores whose it is.
      - text: "Virtue ethics."
        feedback: |
          A virtue ethicist asks what a person of good character and practical wisdom would do, not whether a maxim can be universalized.
      - text: "Divine command theory."
        feedback: |
          That theory asks what God commands. A Kantian test can be run by someone with no view on God at all.
    explanation: |
      Kant himself held that morality is available to reason as such. Critics ask what to do when duties conflict or when a rule leads to disaster, and defenders have replies; the question stays open.

  - type: text
    id: virtue
    title: "Character, not rules"
    image:
      src: img/aristotle.webp
      alt: "Marble bust of Aristotle, a Roman copy after Lysippos"
      caption: "Aristotle (384 to 322 BCE), in a Roman copy of a Greek portrait; his Nicomachean Ethics makes character central to ethics."
      credit: "After Lysippos, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Aristotle_Altemps_Inv8575.jpg"
    body: |
      **Virtue ethics** changes the question. Instead of "which act is right?", it asks "what kind of person should I be?". According to the Stanford Encyclopedia, a virtue is an excellent trait of character, a deep disposition and not a habit such as tea-drinking. An honest person tells the truth because "that would be a lie", not because honesty pays or because she fears being caught.

      Recall from the lesson on essence and existence that Aristotle, in the *Nicomachean Ethics*, argued that a human being has a function (*ergon*) of acting with reason. He took the highest good to be *eudaimonia*, usually translated "flourishing" or "happiness", and tied it to virtue: a stable trait, formed by practice and choice. Aristotle held that virtue is necessary for flourishing but not enough, since friends and some external goods matter too.

      The guide to action is **practical wisdom** (*phronesis*), the skill of seeing which features of a situation matter. A common caricature is "find a good person and copy them". The encyclopedia says this misreads the view, since virtue words such as honest, kind and unjust also give concrete guidance. A critic replies that without a rule, hard cases leave us unsure. A defender replies that rules also need judgment to apply.

  - type: text
    id: evolved
    title: "Where our moral feelings came from"
    body: |
      A fifth answer starts from biology. According to evolutionary accounts, as the Stanford Encyclopedia reports, the human capacity for moral judgement may have arisen because it helped cooperation and social life. Our disgust at cruelty and our sense of fairness would then have a history, like our eyes.

      Two questions must be kept apart. The **origin** question asks why we came to hold a moral belief. The **justification** question asks whether the belief is true or well supported. The encyclopedia stresses that a cause for a judgement is not the same as the reasons for it. A mathematician's ability to count also has an evolutionary history, but that does not show that 2 + 2 = 4 is false. Reasoning that a belief is wrong because of where it came from is the **genetic fallacy**.

      This does not end the debate. In the lesson on debunking, we met Sharon Street's Darwinian dilemma, which claims that if moral truths are independent of us, evolution would have tuned our beliefs to survival and not to them, making a match a coincidence. That is a stronger claim than "origin shows illusion": it is an argument with premises, which realists reply to. The lesson Morality Without God? takes up the question of whether moral truths can stand without God. Here we need only the distinction: an origin story is not a verdict.

  - type: mcq
    id: case
    title: "One case, five lenses"
    multiple: true
    prompt: |
      A pharmacist, Marta, can get a medicine to a patient who cannot pay by quietly falsifying a form. The patient will recover. If the form is audited, the clinic may lose its licence. Select every statement that fits what the theory asks.
    options:
      - text: "Divine command theory asks whether a command of God, as the believer's tradition reads it, forbids falsifying records."
        correct: true
        feedback: |
          Yes. The theory's question is about God's command, and traditions read commands differently, which is a reason for disagreement inside it.
      - text: "Natural law asks whether the act respects or damages basic goods such as life and honest dealing with others, and must weigh them."
        correct: true
        feedback: |
          Yes. Here life is served and honest dealing is harmed, so the theory has to say how the goods are ranked.
      - text: "A utilitarian weighs the patient's recovery against the chance the clinic loses its licence and the harm that causes to many other patients."
        correct: true
        feedback: |
          Yes. The answer depends on the numbers and probabilities, which is why a utilitarian cannot decide it from the story alone.
      - text: "A Kantian tests the maxim 'falsify a form whenever it helps someone I care about' and asks whether such forms could still be trusted if everyone did it."
        correct: true
        feedback: |
          Yes. As with the lying promise, a universal practice of falsifying would destroy what makes forms useful.
      - text: "A virtue ethicist asks what a compassionate, honest person with practical wisdom would do, and may feel the pull of both virtues."
        correct: true
        feedback: |
          Yes. The theory names the virtues in tension and trusts judgement to weigh them.
      - text: "All five theories must give the same verdict, otherwise the theories are not about ethics."
        feedback: |
          They can differ, and that is the use of the comparison. Sometimes they agree on an act for different reasons, and sometimes they diverge.
    explanation: |
      The case is invented. Each statement only describes the theory's *question*, not a verdict. The same act can be forbidden by two theories for different reasons, which tells us something about what each theory needs.

  - type: mcq
    id: no-god
    title: "A common claim"
    prompt: |
      Someone says: "If there is no God, anything is permitted." Which reply is fair?
    options:
      - text: "It is a thesis that needs an argument, and it is disputed: the consequences, duty, virtue and natural law traditions each offer grounds for ethics, and believers also debate how far God is needed."
        correct: true
        feedback: |
          Yes. That is a fair statement of where the debate stands. The thesis depends on a premise, that morality needs a divine source, and critics reject that premise while some believers defend it.
      - text: "It is obviously true, because without a lawgiver there are no laws."
        feedback: |
          That assumes morality is a kind of law with a lawgiver, which is the very premise the other theories deny. The claim may be defended, but not by assuming it.
      - text: "It is obviously false, because nobody who disbelieves in God ever acts well."
        feedback: |
          That confuses two things. How people behave and what grounds morality are different questions, and the claim in question is about the second.
      - text: "It shows that unbelievers have no morality of their own."
        feedback: |
          Even defenders of divine command theory do not usually say that. Their claim is about the ultimate ground of moral facts, not about whether non-believers act well.
    explanation: |
      Whether moral truths can stand without theism, and the best theistic reply, is the subject of the later guided proof Morality Without God? Here we only note that the slogan hides a premise.

  - type: mcq
    id: illusion
    title: "Origin proves illusion?"
    prompt: |
      A friend says: "Evolution explains why we have moral feelings, so morality is an illusion." What is the best response?
    options:
      - text: "The origin of a belief is not a verdict on its truth, so an argument is needed. Debunking arguments such as Street's supply premises, and those premises are disputed."
        correct: true
        feedback: |
          Yes. It separates the genetic fallacy from the more careful debunking argument, which can be assessed on its premises.
      - text: "Evolution has nothing at all to say about morality."
        feedback: |
          Too strong. Evolutionary accounts may well explain our moral capacities and part of their content. The dispute is what follows from that.
      - text: "Since moral feelings help survival, they must be true."
        feedback: |
          This is the same fallacy reversed. Usefulness for survival does not show truth either.
      - text: "Moral feelings are a gift from God, so they have no evolutionary history."
        feedback: |
          That is a faith claim and it rejects the evolutionary story. A believer can also hold that God works through evolution, so the two need not conflict.
    explanation: |
      A fair statement: origin and justification are different questions, and an argument is needed to connect them. The next lessons on morality without God take this up.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      *Facts* are settled by sources: who held which theory, what Aquinas, Mill, Kant and Aristotle wrote, what the Stanford Encyclopedia reports. *Live debates* include whether God's nature answers the arbitrariness charge, which of the four ethical theories is best (and whether they can be combined), and whether an evolutionary origin undermines moral truth. *Commitments* decide the rest: whether morality needs a source beyond the world.

      A believer may hold that goodness is grounded in God and that reason can know much of it. A secular ethicist may hold that wellbeing, duty or virtue need no God. An evolutionary thinker may hold that morality is real and also a product of evolution. Each rests on a premise another rejects, and the course does not pick among them.

  - type: text
    id: summary
    body: |
      **Next:** Facing death. Epicurus, the Stoics, the Abrahamic hereafters, rebirth and nirvana each answer the question of what death is, and how to meet it.
