id: ch25-evolved-morality
title: "Guided proof: Morality Without God?"
kind: guided
proof: true
own: |
  The setting: two people agree that torturing someone for fun is wrong but disagree about what makes it wrong. The proof asks whether moral truths can stand without theism (the belief that God exists). Four premises, numbered P1 to P4, lead to a conclusion C. Each side is told *according to* the thinkers named.
  - **The argument.** P1: some moral claims are objectively true, whatever anyone thinks. P2: their authority does not depend on a commander, so no one's orders make them true. P3: humans can know them by reason and experience. P4 (the bridge): nothing else in God, such as God's nature, is needed to ground them either. Then
  {{ $$\begin{aligned}&\text{P1, P2, P3, P4}\\&\Rightarrow\ \text{C: morality}\\&\text{stands without theism}\end{aligned}$$ }}
  Without P4 the step is invalid, because P2 only rules out commands.
  - **Three questions.** What makes a moral claim true is a question about its {{ **ground** (ontology) }}. How we come to know it is a question of knowledge. Why we act on it is a question of motivation. According to William Lane Craig's own words, his argument is about the first, and he calls it arrogant and ignorant to claim that people cannot be good without belief in God.
  - **Theistic reply (Adams, Craig).** Robert Adams ties goodness to {{ likeness to God, who is essentially good }}, so P4 fails. According to Craig's first premise, objective moral values and duties need God. Critics reject that premise.
  - **Secular reply (Wielenberg).** According to Erik Wielenberg, moral truths can be basic facts, with no God behind them. The cost, in the Stanford Encyclopedia's reading, is the charge made by the philosopher J. L. Mackie against such facts: they seem {{ "queer", unlike anything else in the world }}.
  - **Street's debunking argument.** According to Sharon Street (2006), evolution shaped our moral beliefs for survival, so if moral truths are independent of us, a match between them and our beliefs would be a coincidence. It concludes that we lack justified confidence in such beliefs, not that morality is false:
  {{ $$\begin{aligned}&\text{independent moral truths}\\&+\ \text{evolved beliefs}\\&\Rightarrow\ \text{match is a coincidence}\end{aligned}$$ }}
  - **Where thoughtful people part ways.** Fact: who argued what. Live debate: whether goodness can be basic, whether God's nature adds any explanation, whether realists answer Street. Commitment: whether morality needs a source beyond the world.

cards:
  - type: text
    id: hook
    title: "Two people, one verdict"
    body: |
      Ines and Paulo both say that torturing someone for fun is wrong. They would both stop anyone who tried. Ines adds: "It is wrong because God forbids cruelty." Paulo says: "It is wrong because of what it does to the person, and that is true whether or not any God exists."

      They agree on the verdict and disagree on its *ground*. Before any theory, guess which of them needs God to be right. This lesson is a guided proof: we state an argument that moral truths can stand without theism, test each premise, and then give the best theistic replies and the secular answers to them. Each side is told in its own terms, and the lesson does not pick one.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Ines and Paulo agree that torturing someone for fun is wrong. Which question actually separates them?
    options:
      - text: "What *makes* it wrong: whether the wrongness needs God as its ground."
        correct: true
        feedback: |
          Yes. They share the verdict and part on the ground of the wrongness, which philosophers call a question of ontology (what makes a moral claim true).
      - text: "Whether it is wrong at all."
        feedback: |
          They agree on that. The disagreement starts one step later.
      - text: "Whether either of them is able to tell that it is wrong."
        feedback: |
          Both can tell, and neither doubts it. How we know a moral truth is a different question from what makes it true, and the lesson keeps them apart.
    explanation: |
      Three questions are easy to blur: what makes a moral claim true (ground), how we know it (knowledge), and why anyone acts on it (motivation). William Lane Craig, in a debate text on his own site, separates the question of whether people can be good without belief in God, which he says they can, from the question of what grounds objective moral value. A paper in the journal *Religious Studies* describes his argument as an account of the ontological foundation of morality. Whether the three really come apart is part of the debate.

  - type: text
    id: argument
    title: "The argument for secular morality"
    body: |
      Here is a reconstruction in the spirit of what the Stanford Encyclopedia of Philosophy calls "godless normative realism", defended by Erik Wielenberg in *Robust Ethics* (Oxford University Press, 2014). The numbering and wording are ours, not a quotation.

      **P1.** Some moral claims are objectively true: they hold whatever any person or society thinks. (For example, torturing someone for fun is wrong.)

      **P2.** The authority of those truths does not depend on a commander. No one's orders, human or divine, make them true.

      **P3.** Human beings can know such truths by reason and experience, such as by seeing what cruelty does.

      **C.** Morality stands without theism.

      The four claims are short, so each can be tested. We test the order of the reasoning first, then who would reject what.

  - type: order
    id: order
    title: "Put the reasoning in order"
    prompt: |
      Put the argument for morality without theism in the order the reasoning builds, from the first claim to the conclusion.
    steps:
      - "P1: some moral claims are objectively true, whatever anyone thinks."
      - "P2: their authority does not depend on a commander."
      - "P3: humans can know them by reason and experience."
      - "C: morality stands without theism."
    hint: |
      First there must be something true, then what it does not need, then how we reach it, and only then the conclusion.
    explanation: |
      Each premise closes one way a believer might say God is needed: as a source of truth, as a commander, and as a teacher. The next cards ask whether anything is left over.

  - type: mcq
    id: reject
    title: "Which premise would a critic reject?"
    prompt: |
      J. L. Mackie (1977) argued that there are no objective moral values, since objective values would be "queer", unlike anything else in the world. Which premise of the argument does his error theory reject, and what does that mean for the argument?
    options:
      - text: "P1. If no moral claim is objectively true, the argument never starts, and it says nothing for or against theism."
        correct: true
        feedback: |
          Yes. Mackie's error theory denies objective moral truths, so it rejects P1. Note that it rejects them for secular and theistic ground alike, so it is a rival to both sides here.
      - text: "P3. He holds that humans cannot know moral truths without God."
        feedback: |
          That is not his argument. His complaint is that objective moral properties would be strange, not that we lack a teacher.
      - text: "C. He accepts all the premises but denies that they give the conclusion."
        feedback: |
          He denies the first premise, so the question of the conclusion does not arise.
      - text: "P2. He holds that God's command is needed to make moral claims true."
        feedback: |
          This is close to the theist's reply, not his. He denies that objective values exist, whoever might command them.
    explanation: |
      The Stanford Encyclopedia reports Mackie's "queerness" objection and also notes that it presses on godless realism. Subjectivists and expressivists also reject P1. Believers who accept P1 are the ones who reply on P2.

  - type: mcq
    id: bridge
    title: "A gap in the proof"
    prompt: |
      The premises say that moral truths are objective (P1), are not made true by a commander (P2), and can be known by reason (P3). A theist objects that the conclusion "morality stands without theism" still does not follow. What extra premise would make the step valid?
    options:
      - text: "P4: nothing else in God, such as God's nature, is needed to ground moral truths either."
        correct: true
        feedback: |
          Yes. P2 rules out only commands. A believer can accept that commands do not make a claim true and still say that God's good nature does.
      - text: "P4: God does not exist."
        feedback: |
          That would make the argument valid, but it begs the question: the aim was to show that morality does not depend on the answer.
      - text: "P4: all people agree on the basic moral truths."
        feedback: |
          Agreement is a fact about us. It does not show what grounds the truths.
      - text: "P4: atheists behave as well as believers."
        feedback: |
          That bears on motivation, not on what makes moral claims true.
    explanation: |
      The proof needs P4. Whether P4 is plausible is the whole debate, and it is the target of the first theistic reply.

  - type: text
    id: adams
    title: "Theistic reply: the ground is God's nature"
    body: |
      According to the Stanford Encyclopedia, Robert Adams (in *Finite and Infinite Goods*, 1999) holds that violations of obligations appropriately incur blame, and that obligations are constituted by broadly social requirements, which in his theistic account are the commands of a loving God. He explains goodness differently, as likeness to God, who is essentially good. On this view goodness is neither a whim of God nor a standard above God: it is tied to God's own character.

      This is an attack on P4. It grants that commands are not what makes a claim true, and it adds that God's nature does. It also answers the Euthyphro charge of arbitrariness, because God's character is not arbitrary.

      The Encyclopedia also reports Adams's argument (in an essay of 1987) that if people think the universe has no moral order, they may become demoralized in their pursuit of morality. That is a claim about motivation, and critics note it is a different question from what makes moral claims true.

  - type: mcq
    id: adams-q
    title: "What does the reply change?"
    prompt: |
      A believer says: "I agree that God's orders do not make cruelty wrong. Cruelty is wrong because it goes against God's good nature, which is the standard of goodness." Which part of the secular argument does this reject?
    options:
      - text: "P4, the bridge: it holds that something in God, namely God's nature, is needed as the ground."
        correct: true
        feedback: |
          Yes. It accepts P1 and P2 in the form stated, and it denies that morality stands without anything in God.
      - text: "P1: it denies that moral claims are objectively true."
        feedback: |
          The reply affirms objectivity. It is a defence of objective morality, grounded in God.
      - text: "P3: it denies that humans can know moral truths."
        feedback: |
          Nothing is said against knowledge. Many believers hold that reason can know much of morality, as in natural law.
      - text: "None: it concedes the conclusion."
        feedback: |
          It denies that morality stands without theism, since God's nature is its ground.
    explanation: |
      The reply moves the debate from commands to grounds. A critic's answer comes in the card on the secular reply.

  - type: text
    id: craig
    title: "Theistic reply: objectivity needs a foundation"
    image:
      src: img/craig.webp
      alt: Head and shoulders photograph of William Lane Craig, an older man with grey hair
      caption: William Lane Craig, who states the moral argument for God with premises that critics test one by one.
      credit: "ReasonableFaith.org, CC BY 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:William_Lane_Craig_(3x4_cropped).jpg"
    body: |
      William Lane Craig states a moral argument in which the first premise is: "If God does not exist, objective moral values and duties do not exist." The second premise is that objective moral values and duties do exist, and the conclusion is that God exists. The argument is valid in form, so the debate is about the premises.

      In a 2014 reply to a reader, Craig writes that God's nature grounds moral values and God's commands constitute moral duties. He also says that on the theistic view God holds all persons morally accountable for their actions. He does not claim that people must believe in God to know right from wrong or to live well. His claim is about the ground of morality.

      The Stanford Encyclopedia gives a general template of the same kind: P1, there are objective moral facts; P2, God provides the best explanation of them; so, probably, God exists. Notice what this does to the lesson's argument. Both sides accept P1. They disagree on whether the best explanation of objective morality is God, or whether such truths are basic and need no explanation beyond themselves.

  - type: text
    id: secular
    title: "Secular reply: Euthyphro and basic truths"
    image:
      src: img/plato.webp
      alt: Marble bust of the philosopher Plato, a Roman copy of a Greek original
      caption: Plato, in whose dialogue Euthyphro Socrates asks whether the pious is loved by the gods because it is pious, or pious because it is loved.
      credit: "Silanion, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Head_Platon_Glyptothek_Munich_548.jpg"
    body: |
      According to defenders of godless realism such as Wielenberg, moral truths can be basic: they hold necessarily and need no further ground, just as some truths of logic or mathematics do. The Euthyphro question is their lever. If God commands cruelty to be wrong *because* it is wrong, goodness is already there before the command. If goodness is just whatever God wills, commands look arbitrary. Adams answers that goodness is God's nature. The secular reply is that if God's nature is good *because* it is just and kind, then justice and kindness are good in themselves, and they can be so without God.

      The theist's counter is that a necessary moral truth with no ground is a strange thing, and that grounding it in a perfectly good being explains why it exists and why we can know it. The Encyclopedia says many will see godless realism's brute moral facts as a heavy price and that they face Mackie's queerness objection. Which side bears the heavier cost is a live debate.

  - type: mcq
    id: euth
    title: "Whose lever is Euthyphro?"
    prompt: |
      "If God commands an act because it is good, goodness is there before God's command." Who can use this sentence, and for what?
    options:
      - text: "A secular realist can use it to argue that goodness does not need God as its source. A divine nature theorist replies that goodness is God's nature, and so is not outside God."
        correct: true
        feedback: |
          Yes. The second horn is the secular lever, and God's-nature grounding is the believer's reply to it.
      - text: "It proves that atheists are right."
        feedback: |
          It speaks only about the relation of goodness and God's will. It does not decide whether God exists.
      - text: "It shows that believers cannot be moral."
        feedback: |
          It shows nothing of the kind. Believers can act well on either view of the ground.
      - text: "It is a trap only for atheists."
        feedback: |
          It poses a question to any view that makes goodness depend on God, and the believer has replies to it.
    explanation: |
      The dilemma frames the debate but does not end it. What each side must pay for its answer is a more telling comparison than a quick win.

  - type: text
    id: street
    title: "The evolutionary challenge"
    body: |
      Sharon Street's "A Darwinian Dilemma for Realist Theories of Value" (*Philosophical Studies* 127(1), 2006) is the sharpest challenge to P1 on the realist reading. The lesson on debunking recalled it. According to the Stanford Encyclopedia, the argument runs as follows. Evolution shaped our evaluative dispositions for survival and reproduction. Realism says moral truth is independent of those effects. So if our moral beliefs do match moral truth, the match would be a sheer coincidence. The conclusion is that we lack justified confidence that our beliefs track such truths, and that antirealism looks better.

      Notice that the argument does not claim that morality is false. It claims that realists cannot explain the match between belief and truth.

      Realists reply in several ways. According to David Enoch (*Taking Morality Seriously*, 2011), roughly, survival is good, so beliefs tuned to survival are tuned to something good; a reviewer says the reply leaves open what licenses such a starting point and how moral knowledge is possible. According to Wielenberg, the natural laws that gave us our moral beliefs may themselves be necessary. According to the line of reply developed by FitzPatrick (2014 to 2017), as the Encyclopedia reports, many moral beliefs rest on reflection about plain wrong-making features, such as suffering, so the debunking claim does not reach them.

      The Encyclopedia notes that the argument gets its force from evolution together with naturalism. A theist can say that God made sure our moral sense is reliable, and a secular realist replies that this needs independent support. Both claims stay disputed.

  - type: mcq
    id: street-q
    title: "What does Street conclude?"
    prompt: |
      According to Street's argument, as the Stanford Encyclopedia reports it, what follows if realism is true and evolution shaped our moral beliefs for survival?
    options:
      - text: "A match between our moral beliefs and the independent moral truths would be a coincidence, so we lack justified confidence in them."
        correct: true
        feedback: |
          Yes. It is an argument about justification, not a proof that moral claims are false.
      - text: "Moral claims are false."
        feedback: |
          Street does not say that. That would be the genetic fallacy, judging a claim by its origin alone. Her argument is about what realists can explain.
      - text: "God must have designed our moral sense."
        feedback: |
          That is a reply some theists give, not a conclusion Street draws. She aims at realism, and the aim holds for the theist's God only if a further premise is added.
      - text: "Morality has no evolutionary origin."
        feedback: |
          The argument takes the evolutionary origin as its premise.
    explanation: |
      A fair summary: Street's argument is a serious challenge to independent moral truths, and replies to it are disputed. It does not turn on whether God exists, though how a theist and a naturalist would answer it differs.

  - type: mcq
    id: case
    title: "Two societies, one cruel custom"
    prompt: |
      Two invented societies keep the custom of driving widows from their homes. Aval teaches that its moral rules come from God. Brenn teaches that they come from no one but its own members. Visiting reformers in both say the custom is wrong. Which statement is fair?
    options:
      - text: "Each reformer can say the custom is wrong if they hold P1: the divine-source reformer by God's nature or commands, the secular realist by basic moral truths. A subjectivist reformer can condemn it by their own standards but not claim a truth independent of everyone's attitudes."
        correct: true
        feedback: |
          Yes. Condemnation is open to all, and what differs is what each calls the ground of the condemnation, which is the lesson's question.
      - text: "Only the reformer in Aval can say the custom is wrong, since Brenn has no source."
        feedback: |
          That assumes that morality needs a source outside the society, which is the disputed premise. A secular realist or a constructivist reformer can condemn the custom too.
      - text: "Neither custom can be called wrong, since each society makes its own rules."
        feedback: |
          That is cultural relativism. It is a real view, but it is a rival to both the theistic and the secular realist, and it cannot call the custom wrong in any sense independent of the society.
      - text: "Aval's custom must be right, because God's source guarantees what it teaches."
        feedback: |
          A society can be wrong about what its God commands or what goodness is. A source does not guarantee a correct reading of it.
    explanation: |
      The case shows where the theories differ: not in whether the custom is condemned, but in what the condemnation rests on, and in whether a reformer may claim the society is mistaken.

  - type: mcq
    id: slogan1
    title: "A slogan: no God, no morals"
    prompt: |
      A speaker says: "Without God there can be no morality." Which reading of this is the strongest version a thoughtful believer would accept?
    options:
      - text: "Without God, moral truths would lack their ultimate ground. Atheists can still know and do what is right."
        correct: true
        feedback: |
          Yes. This is the ontological claim, which, as Craig's own remarks show, he separates from claims about knowledge or behaviour.
      - text: "Atheists cannot tell right from wrong."
        feedback: |
          A claim about knowledge, which the strongest theistic arguments do not make. Atheists and believers often share moral judgements, and the dispute is about the ground.
      - text: "Atheists are less likely to behave well."
        feedback: |
          That is an empirical claim about motivation, not an argument about the ground, and it would need evidence.
      - text: "Morality is whatever each person decides."
        feedback: |
          That is subjectivism, which is not what the believer claims either.
    explanation: |
      The slogan blurs ground, knowledge and motivation. The secular reply is that ground does not need God, and this stays disputed.

  - type: mcq
    id: slogan2
    title: "A slogan: believers are good only from fear"
    prompt: |
      A critic says: "Believers are only good because they fear divine punishment." What is wrong with this as an account of the theistic position?
    options:
      - text: "Many theistic views ground morality in God's goodness and love, and not in threat of punishment. Whether divine reward and punishment motivate people is a separate empirical question."
        correct: true
        feedback: |
          Yes. Adams's account makes goodness likeness to God, not obedience for reward. Motive and ground are different questions.
      - text: "Believers never fear punishment."
        feedback: |
          Some do, in some traditions. The point is that this is not the only or main source of the moral view.
      - text: "It is wrong because atheists are good only from fear too."
        feedback: |
          That has nothing to do with the claim. The slip is mixing motive and ground.
      - text: "It is true, since without punishment no one is moral."
        feedback: |
          Evidence on motivation is mixed and is beyond this lesson. The claim as a description of the theory is wrong.
    explanation: |
      The two slogans mirror each other: one says atheists have no morals, one says believers have only fear. Each confuses the ground of morality with the motive for acting.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      *Facts* are settled by sources: who argued what. Craig's first premise, Adams's grounding in God's nature, Wielenberg's basic moral truths, Mackie's queerness and Street's dilemma are on the record. *Live debates* include whether goodness can be basic, whether God's nature adds an explanation or only moves the question, and whether realists can answer Street. *Commitments* decide the rest: whether morality needs a source beyond the world.

      A believer may hold that goodness is grounded in God, and that reason can know much of it. A secular realist may hold that moral truths are basic and that God would add nothing. An antirealist may hold that the question rests on a mistake. Each rests on a premise another rejects, and the course does not pick among them.

  - type: text
    id: summary
    body: |
      **Next:** Suffering and What Traditions Do With It. Why do people suffer, and how do Stoics, Buddhists, Jews, Christians, Muslims and secular thinkers each respond?
