id: ch25-meaning
title: "Is There Meaning?"
kind: concept
own: |
  The setting: philosophers ask two questions. **Meaning of life** asks whether human existence as a whole, or the universe, has a point. **Meaning in life** asks what makes one person's life meaningful. Told *according to* the thinkers named.
  - **Three theories of meaning in a life.** According to the Stanford Encyclopedia, **subjectivism** says meaning depends on a person's own attitudes and goals; **objectivism** says some things have worth whatever anyone feels; a **hybrid** view needs both. According to Susan Wolf (*Meaning in Life and Why It Matters*, 2010), as quoted there:
  $$\begin{aligned}\text{meaning}\ &\text{arises when}\\ &\text{subjective attraction meets}\\ &\text{objective attractiveness}\end{aligned}$$
  So a hybrid view says a life is meaningful insofar as {{ its attractions are to things or goals that are objectively worthwhile }}.
  - **The test cases.** A counter of blades of grass can feel absorbed; a subjectivist counts the life as meaningful, an objectivist or hybrid theorist does not, unless the pursuit has worth. According to Wolf, {{ feeling that a life is meaningful is not a reliable sign that it is }}.
  - **Frankl.** According to Viktor Frankl (1905 to 1997), in *Man's Search for Meaning*, the question is turned round: in essence, {{ life questions us, and we answer by being responsible for our lives }}. He names three ways to find meaning: a deed or task, an experience such as love, and the attitude taken toward unavoidable suffering.
  - **Nagel.** According to Thomas Nagel ("The Absurd", 1971), the absurd comes from a clash inside us between taking our lives seriously and being able to step back to a standpoint from which {{ everything can look arbitrary }}.
  - **What each needs from the universe.** According to the Stanford Encyclopedia, **supernaturalism** says {{ God or a soul is needed for meaning, or for great meaning }}; **naturalism** says the physical world, as the sciences describe it, {{ is enough }}; **nihilism** says what would make a life meaningful cannot obtain for anyone.
  - **Where thoughtful people part ways.** Fact: who held what. Live debate: whether feeling is enough, whether objective worth exists without God, whether the two questions can be kept apart. Commitment: whether a life can matter only if the universe has a purpose.

cards:
  - type: text
    id: hook
    title: "Four lives"
    image:
      src: img/titian-sisyphus.webp
      alt: "Oil painting by Titian of the muscular figure Sisyphus bent under a huge stone, seen from below"
      caption: "Titian painted Sisyphus in 1548 to 1549, one of a series of mythic punishments ordered by Mary of Hungary; in the myth the stone is a sentence, not a choice."
      credit: "Titian, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Titian_-_Sisyphus_-_Madrid_-_Prado.jpg"
    body: |
      Before any theory, take four lives and decide for yourself.

      **Life A.** A man spends his days counting the blades of grass on lawns. He is calm and absorbed, and he would not trade his days for any others.

      **Life B.** The gods condemn Sisyphus to roll a stone up a hill forever, and it always rolls back. Then they tinker with him: they plant in his mind a deep, strong desire to roll stones, so that he now loves the work.

      **Life C.** Sisyphus is freed to roll many stones up the hill, and he builds with them a cathedral that people will visit and love for centuries. He is proud of it.

      **Life D.** A nurse works nights in a poor clinic. She helps many people, but on her worst weeks she feels nothing, only tired.

      Which of these lives are meaningful? Notice what you used to decide: the feelings of the person, the value of what they did, or both.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Think of Lives A to D. Which single rule would you use to say that a life is meaningful?
    options:
      - text: "A life is meaningful when the person feels it is, whatever the activity."
        feedback: |
          This is a real position (subjectivism) and it is the one we test first. It says Life A is as meaningful as Life C. If that bothers you, you already feel the pull of the second ingredient. Keep the idea and check it below.
      - text: "A life is meaningful when it serves something truly worthwhile, whatever the person feels."
        feedback: |
          This is a real position too (objectivism). It counts Life D even in her worst week. Does it still seem right when a person feels nothing at all toward what she does? That is the pressure on this rule, and we meet it below.
      - text: "A life is meaningful when the person cares about something that really is worthwhile."
        correct: true
        feedback: |
          This is close to the view of the philosopher Susan Wolf, which we meet next. It is not the only fair answer: the first two have careful defenders, and we state them at full strength.
    explanation: |
      Nobody has to pick one now. The lesson names three families of view and what each needs from the world. The aim is to see which premise each one rests on.

  - type: text
    id: two-questions
    title: "Two different questions"
    body: |
      The phrase "the meaning of life" hides two questions. According to the Stanford Encyclopedia of Philosophy entry on the meaning of life, philosophers distinguish meaning **of** life from meaning **in** life. The first asks whether human existence as a whole is meaningful, whether the universe has a point. The second asks what it is for an individual person to have a meaningful life. Most analytic philosophers now work on the second.

      The two can come apart. You might think the universe has no purpose and yet hold that a life spent raising children or curing disease has meaning. You might also think the universe has a purpose and that a particular life still wastes it. Whether they really come apart is itself disputed, and that dispute is the heart of this lesson.

      A word of caution before we go on: "meaning" here is not a synonym for "happiness" or for "morality". A life can be happy and empty, or hard and full of meaning. The question is what *makes* a life meaningful, not how it feels.

  - type: mcq
    id: sort
    title: "Of life or in life?"
    prompt: |
      Which of these questions asks about meaning **in** a life, not the meaning **of** life as a whole?
    options:
      - text: "Does the way I spend my days give my own life meaning?"
        correct: true
        feedback: |
          Yes. It is about one person's life and what it is built from.
      - text: "Does the universe, or human existence as a whole, have a point?"
        feedback: |
          That is the question of meaning of life, the cosmic one. A person can answer it one way and the personal question another way.
      - text: "Did the gods intend humans to exist?"
        feedback: |
          Another question about the whole of human existence, and it assumes there are gods who intend things, which is a further commitment.
    explanation: |
      Layer: the distinction is documented in the SEP entry (layer 1). Whether personal meaning needs cosmic meaning is a live debate (layer 2) and, for many, a commitment (layer 3).

  - type: text
    id: three-theories
    title: "Three theories of meaning in a life"
    body: |
      According to the same Stanford entry, theories of meaning in a life fall into three families.

      **Subjectivism** holds that meaning depends on a person's own attitudes, such as the goals she pursues and the things she loves. Roughly, something is meaningful for her if she aims at it and gets it. There is then no standard outside the person, so what is meaningful can differ from one person to another.

      **Objectivism** holds that meaning is at least partly independent of anyone's attitudes. Some activities, such as discovering truth, creating beauty or helping others, have worth in themselves, and a life is meaningful by being connected to them.

      A **hybrid** view says you need both. The philosopher Susan Wolf, in *Meaning in Life and Why It Matters* (Princeton University Press, 2010), is the best known defender. The Stanford entry quotes her as holding that "Meaning arises when subjective attraction meets objective attractiveness." Here *subjective attraction* is your being drawn to, absorbed in and caring about something, and *objective attractiveness* is its really being worth that care. The Stanford entry itself lists Wolf among the objectivist theories, because of the second ingredient.

      Each ingredient can be present without the other, and the four lives are built to show that.

  - type: mcq
    id: grass
    title: "The grass counter"
    prompt: |
      A man is absorbed in counting blades of grass on lawns and loves it. Which theory says his life is meaningful *because of his absorption alone*?
    options:
      - text: "Subjectivism."
        correct: true
        feedback: |
          Yes. If meaning depends only on what a person is attracted to and gets, absorption is enough. Critics treat this as the standard embarrassment for the view: the Stanford entry mentions cases of this kind, such as counting the hairs on one's head, collecting string or spitting long distances.
      - text: "Objectivism, because the grass is real."
        feedback: |
          Objectivism asks whether the activity has worth in itself, not whether its object exists. A defender will ask whether counting blades of grass is worth a life, and many will say no, however absorbed the counter is.
      - text: "A hybrid view such as Wolf's."
        feedback: |
          A hybrid view needs the second ingredient too. Without objective worth the counter has the attraction but not the fit. A defender of the hybrid view may reply that a community could give such a pursuit worth, as it has for some hobbies, so the verdict can change with the details.
    explanation: |
      A subjectivist can reply that we should not look down on a person's chosen life. That reply matters, and it is why the hybrid view keeps the first ingredient: attraction is necessary, even if it is not sufficient.

  - type: build
    id: wolf-build
    title: "Wolf's formula"
    prompt: |
      Build Wolf's hybrid claim, as quoted in the Stanford Encyclopedia, from the tiles.
    prefix: 'Meaning arises when'
    suffix: ''
    tiles: ['subjective attraction', 'meets', 'objective attractiveness', 'follows', 'majority approval']
    answers:
      - ['subjective attraction', 'meets', 'objective attractiveness']
    wrong:
      - answer: ['subjective attraction', 'follows', 'majority approval']
        feedback: |
          Wolf asks that the thing really is worth caring about, not that many people approve of it. A popular pursuit can still be worthless, and an unpopular one can be worth a life.
    hint: |
      Two ingredients meeting: one in the person, one in the thing.
    explanation: |
      One ingredient belongs to the person (being drawn, absorbed, caring) and one to what she is drawn to (being worth it). Take either away and, on this view, the meaning fails.

  - type: mcq
    id: sisyphus
    title: "Sisyphus in two versions"
    prompt: |
      Apply the hybrid view to Lives B and C above. Sisyphus is given a planted love of rolling stones that always roll back (B), or builds a cathedral he is proud of (C). What does a hybrid theorist say, taking the cathedral to be worthwhile?
    options:
      - text: "B has attraction but little worth, so it falls short; C has both, so it is meaningful."
        correct: true
        feedback: |
          Yes. This is our application of the hybrid view, not a quotation from Wolf. Note that it does not deny that B is happy. It says happiness and meaning are different things.
      - text: "Both are meaningful, since in both Sisyphus is attracted to what he does."
        feedback: |
          That is the subjectivist verdict. The hybrid view adds that the thing must also be worth the attraction.
      - text: "Neither is meaningful, because a punishment cannot give meaning."
        feedback: |
          Nothing in the hybrid view says so. In C the project is his own, and a gift of the gods can be worthwhile. What matters is whether the work has worth and whether he is drawn to it.
    explanation: |
      According to summaries of Richard Taylor's essay on the meaning of life (dated to *Good and Evil*, 1970, in one source and to his *Metaphysics*, 1963, in another), Taylor used Sisyphus in both ways. He imagined a Sisyphus given an irrational desire to push stones, and one whose stones become a temple. Taylor's own conclusion was a more subjectivist one about the first case and about creativity in the second, so the hybrid reading is one answer among several. We rely here on summaries, not on the essay itself.

  - type: text
    id: frankl
    title: "Meaning as an answer"
    image:
      src: img/frankl.webp
      alt: "Portrait photograph of Viktor Frankl in 1965, an older man in a suit looking at the camera"
      caption: "Viktor Frankl (1905 to 1997), a Vienna psychiatrist who survived Theresienstadt, Auschwitz and two other camps and wrote about meaning afterwards."
      credit: "Prof. Dr. Franz Vesely, CC BY-SA 3.0 de, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Viktor_Frankl2.jpg"
    body: |
      So far we asked what a life contains. Viktor Frankl, a Viennese neurologist and psychiatrist (born 26 March 1905, died 2 September 1997), turned the question round. He spent three years in four concentration camps, including Theresienstadt and Auschwitz, and described what he saw there in *Man's Search for Meaning* (German edition 1946; English edition 1959, first under the title *From Death-Camp to Existentialism*). He went on to found **logotherapy**, a school of psychotherapy that treats the search for meaning as a central human motive.

      His move, in essence, is this. It is of little use to ask what we expect from life. Life asks something of us, and each person answers by taking responsibility for her own life. Because circumstances differ, the answer differs from person to person and from moment to moment. This is why he refuses a single, general answer to "what is the meaning of life?"

      According to common summaries of his work, he named three ways to find meaning: a deed or task that makes a difference in the world, an experience such as loving someone, and the attitude one takes toward suffering that cannot be avoided.

      Our paraphrase of his reversal rests on secondary pages that quote the book, whose wording differs between editions: in one quoted line, it did not really matter what we expected from life, but what life expected from us.

  - type: mcq
    id: frankl-q
    title: "Frankl's reversal"
    prompt: |
      According to Frankl, in essence, how should a person approach the question of what her life means?
    options:
      - text: "As a question life puts to her, which she answers by how she acts and takes responsibility."
        correct: true
        feedback: |
          Yes. Meaning is something she responds to, one situation at a time, rather than something she first has to invent or read off the universe.
      - text: "As something she must invent from nothing, since the universe supplies none."
        feedback: |
          This is closer to Sartre in the previous level than to Frankl. Frankl speaks of answering what a situation asks, not of making meaning from nothing.
      - text: "As a single answer, the same for everyone, that a thinker can state in a sentence."
        feedback: |
          Frankl rejects this: in essence, the task differs from person to person and moment to moment.
    explanation: |
      Where Frankl sits among the three theories is itself debated. A reader may find a subjective side (a person's own answer) and an objective side (the situation really calls for something). One worry about any view that rests on a person's own answer is that it does not by itself separate good commitments from bad ones. That is the worry that leads Wolf to ask for objective worth. (Frankl's critics, such as Lawrence Langer, raise a different objection, about his tone and his use of the camps to promote logotherapy.)

  - type: text
    id: nagel
    title: "Stepping back"
    body: |
      A different worry comes from standing back. Recall Thomas Nagel (born 1937) and his essay "The Absurd" (*Journal of Philosophy*, 1971). According to summaries of it, the absurd arises from a clash inside us: we take our lives very seriously, yet we can always step back to a point of view from which everything looks arbitrary and the seriousness looks unjustified. His book *The View from Nowhere* (1986) develops that outside standpoint, which the Stanford Encyclopedia describes as an extremely external one from which a person can view her own life.

      Why does this matter here? It suggests that two perspectives pull in different ways. From inside a life, Life C looks meaningful. From the widest view, a cathedral is a small thing among many. Nagel describes the outside view as at once sobering and comical, and notes that seeing our pursuits as arbitrary does not make us leave life, since the two viewpoints coexist. We use him here only to show that the two standpoints exist, not to place him among the three theories.

  - type: mcq
    id: nagel-q
    title: "Where is the clash?"
    prompt: |
      According to summaries of Nagel's "The Absurd", where does the sense of the absurd come from?
    options:
      - text: "From the clash inside us between taking life seriously and being able to step back and see it as arbitrary."
        correct: true
        feedback: |
          Yes. It is a relation between two standpoints, not only a fact about the universe.
      - text: "From the universe lacking a purpose, and from nothing else."
        feedback: |
          That reading would make the absurd a plain fact about the world. In summaries of Nagel, the absurd lives in our two standpoints, so it would not disappear if one simply changed one's beliefs about cosmic purpose.
      - text: "From a failure of science to explain consciousness."
        feedback: |
          Nagel wrote on consciousness too, but that is a different essay. The absurd is about meaning and standpoints.
    explanation: |
      Layer: the structure of the argument is documented through secondary summaries; whether the absurd is real is a live debate.

  - type: text
    id: universe
    title: "What each view needs from the universe"
    body: |
      Now ask what the universe must be like for each view to hold. According to the Stanford entry, there are three broad positions on this.

      | Position | What it says | What it needs |
      |---|---|---|
      | Supernaturalism | God or a soul is central to meaning | A God or a soul to exist |
      | Naturalism | The physical world known by the sciences is enough | Creatures who care, and facts about what is worth caring about |
      | Nihilism | What would make a life meaningful cannot obtain for anyone | Nothing, since it says the conditions fail |

      Notice the layers. Whether God or a soul exists is a faith or metaphysical question (layer 3). Whether worth can exist without God is a live debate (layer 2). The entry also separates extreme versions (a God or soul is needed for *any* meaning) from moderate ones (they are needed only for *great* or ultimate meaning). On the naturalist side, an extreme version holds that a God would take meaning away, and a moderate one holds it could add some.

      The three theories of the earlier cards connect to these positions. A subjectivist needs only creatures who care. An objectivist needs real worth, which a believer may ground in God and a naturalist in the natural world. A nihilist denies that any of the conditions is met.

  - type: mcq
    id: needs
    title: "What does it need?"
    prompt: |
      A naturalist who holds Wolf's hybrid view says a life can be meaningful if a person cares about something truly worthwhile. What must the universe supply, on her view?
    options:
      - text: "Creatures who can care, and real worth in some things, with no God or soul needed."
        correct: true
        feedback: |
          Yes. That is what separates it from supernaturalism. A critic may ask where objective worth comes from if not from God; the naturalist answers from facts about what benefits creatures and what is valuable in itself, and this is a live debate.
      - text: "A God who assigns each life its purpose."
        feedback: |
          That is a supernaturalist requirement. Wolf's hybrid view does not ask for it, though a believer can hold a hybrid view too and ground the worth in God.
      - text: "Nothing at all, since meaning is whatever one feels."
        feedback: |
          That is subjectivism. The hybrid view asks for worth outside the person's feelings.
    explanation: |
      Notice that a hybrid view is not tied to atheism. It says what a meaningful life needs, and a believer and a naturalist may agree on that while disagreeing on where worth comes from.

  - type: mcq
    id: misconception-purpose
    title: "A tempting step"
    prompt: |
      Someone argues: "If the universe has no purpose, then no human life can have meaning." Which reply from this lesson answers it?
    options:
      - text: "Meaning in a life and the meaning of life are different questions, so the first may hold without the second."
        correct: true
        feedback: |
          Yes. A naturalist replies that the premise (no cosmic purpose means no personal meaning) is the step in dispute. A believer who accepts it will reject the first part and say there is a purpose.
      - text: "The universe does have a purpose, so the argument is unsound."
        feedback: |
          That rejects the first premise, which is a faith claim, not a reply from this lesson. It is a fair reply for a believer, but it does not meet the objection on its own terms.
      - text: "Feelings are all that matter, so purpose is irrelevant."
        feedback: |
          That is a subjectivist reply and it has its own embarrassment: it must count the grass counter's life as meaningful.
    explanation: |
      The structure matches Level 24's nihilism argument: values rested on God, belief faded, so values lose their ground. Here, personal meaning is said to rest on cosmic purpose. Believers can deny the premise that it fails; naturalists deny the link.

  - type: mcq
    id: feeling
    title: "Feeling or being?"
    multiple: false
    prompt: |
      A person joins a group and feels, for ten years, that her life has never been more meaningful. Later she sees that the group was a fraud and she regrets those years. According to Wolf, what does this show?
    options:
      - text: "Feeling that a life is meaningful is not a reliable sign that it is."
        correct: true
        feedback: |
          Yes. This is one of Wolf's reasons for the second ingredient. A pure subjectivist can reply that the years had meaning for her then, and the regret is a later judgment; the hybrid theorist says the later judgment points to something real.
      - text: "Feelings are irrelevant to meaning."
        feedback: |
          Wolf does not say this. The first ingredient, attraction, is required. The point is that it is not enough.
      - text: "Groups can never give a life meaning."
        feedback: |
          Nothing here says so. Groups can be worth joining; this one was not.
    explanation: |
      Layer: the example is ours, close to Wolf's own point that feeling that one's life is meaningful does not make it so, and that one can be mistaken about whether a project has the right kind of value. The philosophical question, whether the feeling alone can make the years meaningful, stays live.

  - type: mcq
    id: case
    title: "A case to judge"
    multiple: true
    prompt: |
      Ines is an accountant. Evenings and weekends she makes a flawless catalogue of her own collection of bottle caps and feels deeply satisfied. Her brother Paulo teaches adults to read at a night school and often feels empty and unsure that it matters. Select every statement that fits the three theories.
    options:
      - text: "A subjectivist counts Ines's life as meaningful, and Paulo's only if he comes to care about the teaching."
        correct: true
        feedback: |
          Yes. On subjectivism, meaning follows the person's attractions and their fulfilment.
      - text: "An objectivist who thinks teaching reading is worthwhile counts Paulo's work as meaningful even on days he feels empty."
        correct: true
        feedback: |
          Yes. For the objectivist the worth lies in the work. A critic asks whether this leaves out the person's own engagement.
      - text: "A hybrid theorist sees Paulo's work as worthwhile but missing the attraction on bad days, and may see Ines's caps as attraction without much worth."
        correct: true
        feedback: |
          Yes. Hybrid view: both pieces are needed. A defender may add that a loving, long-lasting collector community could change the verdict on Ines.
      - text: "All three theories give the same verdict on Ines and Paulo."
        feedback: |
          They differ, which is the use of the distinction. The cases are built to separate them.
    explanation: |
      The case is invented. No theory here is forced; each follows from its own rule, and thoughtful people disagree on which rule is right.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      Look at what is open. *Facts* are settled by the sources: who held which view, what the Stanford entry says, what Frankl wrote. *Live debates* include whether feeling alone can make a life meaningful, whether objective worth exists without God, and whether meaning in a life can be separated from the meaning of life. *Commitments* decide the rest: whether a life can matter only if the universe has a purpose.

      A believer may say that meaning, at the deepest level, needs God. A naturalist may answer that a life of love and worthwhile work matters without any cosmic plan. A nihilist may say that neither is met. Each rests on a premise another rejects, and the course does not pick among them.

  - type: text
    id: summary
    body: |
      **Next:** Where does ethics come from? Divine command, natural law, consequences, virtue and evolved morality each answer the question differently, and each says what the universe must supply.
