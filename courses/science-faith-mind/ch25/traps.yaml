id: ch25-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: meaning, morals, death and the map"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: the meaning of life, where morality comes from, what death is, how traditions face suffering, what they share, and what a map of open questions does and does not show. Every shortcut is a *useful idea pushed too far*.

      Nothing here asks you to adopt a view. Answers are given *according to* someone, and the feedback keeps three layers apart: **established fact** (dates, texts), **scholarly or philosophical debate**, and **faith or metaphysical commitment**. Guess before you read the options.

  - type: mcq
    id: trap-of-in
    title: "One question or two?"
    prompt: |
      A student says: "If the universe as a whole has no point, then no individual life can have meaning." According to the Stanford Encyclopedia of Philosophy's way of separating the question, what is the best reply?
    options:
      - text: "It runs two questions together. 'Meaning of life' asks about human life as a whole, and 'meaning in life' asks what makes one person's life meaningful. Some philosophers hold that the first answer settles the second, but others hold that a life can be meaningful even if the whole has no cosmic purpose."
        correct: true
        feedback: |
          Yes. The step from "no cosmic point" to "no meaning in any life" is a premise, not a logical consequence. Supernaturalists accept it for some forms of meaning and naturalists deny it, so the premise is where they part ways.
      - text: "It is correct, because meaning can only come from outside the person."
        feedback: |
          That is the supernaturalist's premise, held by some and denied by others. It is not a fact that follows from the definitions.
      - text: "It is false, because meaning is whatever a person feels it to be."
        feedback: |
          That is one theory (subjectivism), and the next question shows why it too is pushed too far.
      - text: "It is meaningless, because 'meaning' is not a word philosophers use."
        feedback: |
          Philosophers do use it, and they distinguish several things it can ask. The distinction is the useful part.
    explanation: |
      Layers: the distinction between the two questions is documented in the philosophical literature. Whether meaning in a life needs a cosmic point is live debate, and a supernaturalist and a naturalist each give a reasoned answer.

  - type: mcq
    id: trap-wolf
    title: "Meaning is how it feels?"
    prompt: |
      A friend sums up Susan Wolf: "A life is meaningful if the person feels it is." What is the fairest correction?
    options:
      - text: "In Wolf's Tanner Lecture, thinking or feeling that one's life is meaningful does not make it so. On her hybrid view, meaning arises when subjective attraction (the person is engaged and cares) meets objective attractiveness (the activity is worth caring about)."
        correct: true
        feedback: |
          Yes. Both conditions matter. A person absorbed in counting blades of grass can feel fulfilled, yet on Wolf's view something objectively worthwhile is missing.
      - text: "Wolf says meaning is purely objective, so how the person feels is irrelevant."
        feedback: |
          Her hybrid view also requires the person's engagement, so how the person relates to the activity matters.
      - text: "Wolf says meaning comes only from God."
        feedback: |
          Wolf's view is that both subjective and objective conditions are needed. It does not depend on a supernatural source.
      - text: "Wolf says nothing is worth caring about, so meaning is an illusion."
        feedback: |
          That is a nihilist position. Her view is that some things are worth caring about and that meaning lies where caring meets worth.
    explanation: |
      Layers: Wolf's wording is documented in her lecture. Whether the objective condition can be defended without a supernatural ground, and what makes an activity objectively attractive, is live debate.

  - type: mcq
    id: trap-frankl
    title: "Frankl: invent your own meaning?"
    prompt: |
      A reader says: "Frankl taught that each of us should look inside and decide what life means." According to Frankl's logotherapy as summarized in the sources the lesson used, what is the better description?
    options:
      - text: "He turned the question around. In essence, life asks each of us a question, and we answer by what we do. What is asked differs from person to person and from moment to moment, and he named three ways: a deed, an experience or a love, and the attitude taken toward unavoidable suffering."
        correct: true
        feedback: |
          Yes. Meaning is found as an answer to a concrete situation, not invented in the abstract and not one general formula. This is a paraphrase of secondary summaries, since the book itself was not read.
      - text: "He taught that suffering is good in itself, so one should seek it."
        feedback: |
          The summaries describe the third way as an attitude toward suffering that cannot be avoided, not as a reason to seek suffering.
      - text: "He taught that life has the same single meaning for every person."
        feedback: |
          The summaries stress the opposite: the meaning of a moment differs from person to person and from moment to moment.
      - text: "He taught that nothing can be asked of a person who has lost everything."
        feedback: |
          The summaries list a person's attitude toward unavoidable suffering as one of the three ways, so something is still asked of the person.
    explanation: |
      Layers: Frankl's biography and the title of his book are documented. Whether his claims about meaning are true is debated, and so is how far a view formed in extreme conditions generalizes.

  - type: mcq
    id: trap-nagel
    title: "Why is life absurd for Nagel?"
    prompt: |
      A student says: "According to Nagel, life is absurd because the universe is huge and we are tiny." What does his 1971 essay "The Absurd" actually place the clash in?
    options:
      - text: "In a collision inside us. We take our lives seriously, yet we can step back to a view from which that seriousness looks arbitrary. He writes that the outside view is at once sobering and comical, and his tone is closer to irony than to heroic defiance."
        correct: true
        feedback: |
          Yes. Size and time alone do not do the work. The absurdity is the mismatch between two standpoints that both stay with us.
      - text: "In the silence of God, who has not answered our questions."
        feedback: |
          That is closer to Camus's picture of demand and silence. Nagel's absurd does not need a missing answer from outside.
      - text: "In the fact that we will die, so that nothing we do survives."
        feedback: |
          His argument places the clash in the two standpoints, not in how long a life lasts.
      - text: "In the physical size of the cosmos, which makes human actions too small to matter."
        feedback: |
          That is the tempting reading. In the lesson's reading of the essay, the clash comes from the act of stepping back, not from size alone.
    explanation: |
      Layers: the essay's wording and place of publication are documented. Whether the clash is a real defect or a sign of human reach is the debate, and Nagel himself chose irony over despair.

  - type: mcq
    id: trap-naturalism
    title: "Without God, no meaning?"
    prompt: |
      Someone says: "Naturalism, the view that the physical world is all there is, means life cannot be meaningful." According to the Stanford Encyclopedia's definitions of the positions, what is wrong with this?
    options:
      - text: "Naturalists hold that meaning can be found in the physical world, in what people do, love and create. The claim that meaning needs God or a soul is the supernaturalist's premise. Nihilism arises only if that premise is joined to the belief that neither exists."
        correct: true
        feedback: |
          Yes. Three positions need different things from the universe: supernaturalism needs a spiritual realm, naturalism needs only the natural one, and nihilism says the needed conditions are not met. The shortcut treats the first as if it were the definition of meaning.
      - text: "Naturalists agree that meaning needs God but deny that God exists, so they are nihilists."
        feedback: |
          Many naturalists deny the first half. They do not take God to be necessary for meaning.
      - text: "Naturalists are right that meaning is an illusion, since science finds no purposes."
        feedback: |
          Science describes what happens. Whether a life has meaning is a question of value, and naturalists answer it in many ways.
      - text: "Supernaturalists agree that the physical world can supply meaning, so the two views are the same."
        feedback: |
          The supernaturalist says the physical world alone cannot supply the central kind of meaning. The disagreement is real.
    explanation: |
      Layers: the definitions of the positions are documented. Whether a natural world can ground full meaning is live debate. Whether a spiritual realm exists is a commitment.

  - type: mcq
    id: trap-euthyphro
    title: "Euthyphro ends morality from God?"
    prompt: |
      A student says: "The Euthyphro dilemma refutes any morality based on God." According to the Stanford Encyclopedia's account of theological voluntarism, what is the better statement?
    options:
      - text: "The dilemma is a challenge, not a proof. If God's commands make acts right, critics say the commands look arbitrary and 'God is good' loses content. Adams replies that God's commands come from a loving and just nature, and that the objection is weaker the fewer properties the theory explains by command."
        correct: true
        feedback: |
          Yes. The dilemma asks the believer to say whether the good comes before God's will or after it. Adams takes the view that goodness lies in God's nature, so the answer is neither of the two horns taken in their simplest form. Critics ask whether that move only relocates the question.
      - text: "The dilemma is Plato's argument that there are no gods."
        feedback: |
          In Plato's dialogue, Socrates asks whether the pious is loved by the gods because it is pious or pious because it is loved. The dialogue is about holiness and does not argue for atheism.
      - text: "The dilemma shows that morality is only a human invention."
        feedback: |
          It leaves that open. It is a question for views that tie morality to a command, and a non-theist realist can also be asked what grounds moral truths.
      - text: "The dilemma has been settled, since every philosopher accepts Adams's reply."
        feedback: |
          The reply is widely discussed and still contested. Some critics hold that it only moves the question to God's nature.
    explanation: |
      Layers: Plato's text and Adams's published position are documented. Whether the nature-based reply succeeds is live debate. Whether God exists is a commitment.

  - type: mcq
    id: trap-genetic
    title: "Evolution explains morals, so morals are fake?"
    prompt: |
      A reader says: "Evolution explains why we have moral feelings, so moral claims are illusions." What is the best response?
    options:
      - text: "That moves from a cause to a verdict. Explaining where a belief came from does not by itself show it false, in the way that learning mathematics in school as a child does not make arithmetic wrong. Debunking arguments such as Street's need a further premise about how the causes and the truths could be related."
        correct: true
        feedback: |
          Yes. The slip is called the genetic fallacy when the origin alone is used as the reason. Street's 2006 argument is narrower: if evolution shaped our evaluative dispositions for fitness, a match with independent moral truths would be a coincidence, so a realist lacks justified confidence in them. She does not claim morality is false.
      - text: "Evolution has nothing to do with morality, so the question does not arise."
        feedback: |
          Evolutionary accounts of cooperation are well studied, and the debate is about what they show, not whether they exist.
      - text: "Evolution proves that moral claims are objectively true, since they helped survival."
        feedback: |
          That runs the same shortcut in the other direction. Survival value does not by itself show truth. Enoch's reply, for instance, argues that survival is good, and critics ask what licenses that premise.
      - text: "Moral claims are illusions, but harmless ones, so we may keep them."
        feedback: |
          That is a position (a kind of error theory), not a logical consequence of the origin story, and it needs its own argument.
    explanation: |
      Layers: the existence of evolutionary accounts and Street's 2006 paper are documented. Whether evolution undermines moral realism is live debate. Which theory of moral truth is correct is a philosophical commitment.

  - type: mcq
    id: trap-grounds
    title: "Three questions about morality"
    multiple: true
    prompt: |
      The slogan "without God there is no morality" can mean three different questions. Select every statement that fits one of them correctly.
    options:
      - text: "Ground: what, if anything, makes an act wrong, apart from human opinion?"
        correct: true
        feedback: |
          Yes. This is the ontological question, and it is the one Craig's moral argument addresses.
      - text: "Knowledge: how can anyone come to know what is right?"
        correct: true
        feedback: |
          Yes. Many theists and non-theists alike hold that reasoning and conscience give moral knowledge.
      - text: "Motivation: what gives a person a reason to act well?"
        correct: true
        feedback: |
          Yes. A theist may point to divine judgment or love of God, and a non-theist to empathy, reasons or character.
      - text: "Ability: whether a person who does not believe in God can behave well at all."
        feedback: |
          This is the slogan's weakest reading, and Craig's own debate page calls the claim that people cannot be good without belief arrogant and ignorant. The serious debate concerns the other three questions.
    explanation: |
      Separate the three before judging the slogan. The ground question is metaethical and contested. The knowledge and motivation questions have answers on both sides of the God question. That "atheists cannot be good" is not what the moral argument claims.

  - type: mcq
    id: trap-williams
    title: "Williams wants us to die?"
    prompt: |
      A reader says: "Bernard Williams argued that endless life would be a bore, so death is a good thing and nobody should mind it." What is the fairest correction?
    options:
      - text: "In 'The Makropulos Case' (1973) Williams holds two things together: a premature death is a misfortune, and an endless life would be intolerable. He argues that an endless life would run out of categorical desires, the desires that give a person a reason to go on living, so it ends in boredom or in becoming someone else."
        correct: true
        feedback: |
          Yes. The paper does not say that death is good. It says that we have reason to want more life and also reason not to want unending life, which is an uncomfortable pair. Critics such as Fischer reply that long lives need not be dull.
      - text: "Williams argued, like Epicurus, that death cannot harm anyone."
        feedback: |
          Williams calls a premature death a misfortune. The harm is one he takes seriously.
      - text: "Williams showed that bodies cannot last forever, so immortality is impossible."
        feedback: |
          His argument is about whether an endless life would be worth wanting, not about whether it is physically possible.
      - text: "Williams argued that a long life is better, since there is always more to do."
        feedback: |
          That is close to what his critics argue. Williams argues the reverse: that categorical desires would eventually run out.
    explanation: |
      Layers: the paper, its date and its place in Problems of the Self are documented. Whether categorical desires can be renewed forever is live debate.

  - type: mcq
    id: trap-nagel-death
    title: "Is death bad only if it hurts?"
    prompt: |
      Someone says: "According to Epicurus, death is nothing to us, and Nagel agrees that it cannot be bad if the dead feel nothing." What does Nagel's 1970 paper claim?
    options:
      - text: "Nagel disagrees. Death is bad, he argues, because it deprives the person of the goods a continued life would have held, even though the dead feel no pain. The badness of death is the value of the life that is removed."
        correct: true
        feedback: |
          Yes. This is called the deprivation account. It denies the premise that only experiences can make something bad for us. Epicureans reject that premise, and the debate continues.
      - text: "Nagel says death is bad because dying hurts."
        feedback: |
          His account is about what death removes, not about the pain of dying.
      - text: "Nagel says death is neither good nor bad."
        feedback: |
          That is closer to the Epicurean line, which Nagel's argument is written against.
      - text: "Nagel says death is bad because it means the soul is lost."
        feedback: |
          His argument does not depend on a soul. It works on the loss of the goods of a life.
    explanation: |
      Layers: the paper (Nous, 1970) and the conclusion that death is deprivation are documented. Whether a harm can reach someone who no longer exists is live debate.

  - type: mcq
    id: trap-rebirth
    title: "Rebirth means a soul moves house?"
    prompt: |
      A student says: "In both Hindu and Buddhist traditions, the same soul moves from body to body." What is the fairest correction?
    options:
      - text: "According to Hindu traditions that teach rebirth, an unchanging self (atman) passes through samsara shaped by karma until liberation (moksha). According to Buddhist traditions there is no unchanging self (anatta), so what continues is a causal stream of conditioned states, like a flame passed from one candle to another."
        correct: true
        feedback: |
          Yes. The two traditions share the vocabulary of rebirth and karma but differ on what is reborn, and the difference is central. The flame passed from candle to candle is one traditional image for continuity without an unchanging self.
      - text: "Both traditions teach reincarnation of one identical soul, and differ only in the names."
        feedback: |
          The disagreement about the self is the point of the Buddhist teaching of anatta.
      - text: "Neither tradition has any account of what is reborn."
        feedback: |
          Both give accounts, and they differ.
      - text: "Buddhists say that nothing continues at all after death."
        feedback: |
          They hold that a stream of causes continues until nirvana ends the cycle. Whether that counts as 'someone' continuing is exactly the question the flame image addresses.
    explanation: |
      Layers: the terms and images are documented in the traditions' texts and teachers. How to compare them, and whether Buddhist 'no-self' leaves anything to survive, is scholarly and philosophical debate. Whether rebirth happens is a faith commitment.

  - type: mcq
    id: trap-christian-afterlife
    title: "Christians: souls in heaven?"
    prompt: |
      A student says: "All Christians believe the immortal soul leaves the body and lives on in heaven, and that is the whole Christian hope." What is the fairest correction?
    options:
      - text: "According to the Stanford Encyclopedia, the standard view in the theistic traditions is bodily resurrection. The Catechism of the Catholic Church says the soul awaits reunion with a glorified body, and Christians differ on what happens in between (conscious waiting, rest, or something else) and on whether the soul can exist apart from the body."
        correct: true
        feedback: |
          Yes. The hope is usually described as resurrection of the whole person, and the immortal-soul picture is one strand with a long history. The Stanford Encyclopedia also notes a link between the soul picture and dualism, and speaks of a Platonic import.
      - text: "Christians believe the body is only a prison, so the afterlife has no body."
        feedback: |
          That is a Platonic-style picture. The Catechism speaks of resurrection and a glorified body, so the body is not dropped.
      - text: "Christians hold that nothing survives death."
        feedback: |
          Some Christians hold mortalism, a pause until resurrection, but the hope there is still resurrection, not nothing.
      - text: "Christians hold that rebirth into new lives is the main teaching."
        feedback: |
          Rebirth belongs to Hindu and Buddhist traditions. Christian traditions teach resurrection and judgment.
    explanation: |
      Layers: the Catechism sections is documented. How to understand the in-between state, and what a 'spiritual body' is, is debated among theologians. That any of it happens is a faith commitment.

  - type: mcq
    id: trap-sheol
    title: "Judaism always had heaven and hell?"
    prompt: |
      A student says: "The Hebrew Bible teaches heaven and hell from its first pages." According to the encyclopedia sources the lesson used, what is the better description?
    options:
      - text: "The early picture is Sheol, a realm of silence and darkness under the earth, where the texts seem to send righteous and wicked alike. Scholars disagree about whether it is a literal place or a way of speaking about the grave. Later texts such as Daniel 12:2 add hope of rising, and by the Second Temple period the Pharisees held to resurrection while the Sadducees did not."
        correct: true
        feedback: |
          Yes. The ideas developed over time, and rabbinic Judaism later built the world to come on them. Jewish movements today still differ on how to read these hopes.
      - text: "The Hebrew Bible teaches reincarnation."
        feedback: |
          Rebirth as taught in Hindu and Buddhist traditions is not the picture of the early texts described here.
      - text: "The Hebrew Bible says nothing at all about death."
        feedback: |
          It speaks of Sheol in many places, including Psalms and Ecclesiastes.
      - text: "Sheol is a place of torment for the wicked only."
        feedback: |
          According to the encyclopedia article, the texts seem to send both the righteous and the wicked there.
    explanation: |
      Layers: the verses and the rabbinic sources are documented. The dating and meaning of Daniel 12:2 and the Sheol language are scholarly debate. Whether the dead will rise is a faith commitment.

  - type: mcq
    id: trap-job
    title: "Job: his friends were right?"
    prompt: |
      A reader says: "The Book of Job ends by showing that suffering is a punishment, as Job's friends said." According to the text of Job's last chapter, what happens at the end?
    options:
      - text: "God does not side with the friends. In Job 42:7 and following, God says to Eliphaz that he and his friends have not spoken of God rightly as God's servant Job has, and tells Job to pray for them. The friends' claim that Job's suffering must be his punishment is the view the ending does not endorse."
        correct: true
        feedback: |
          Yes. The poem lets Job protest, and the epilogue rebukes the friends. What the book finally says about why the innocent suffer is read differently by Jewish and Christian readers, and some find in the whirlwind speech an answer that is not an explanation.
      - text: "God confirms that Job sinned and was punished for it."
        feedback: |
          The prologue and the ending point away from that. The ending rebukes the friends who said so.
      - text: "Job concludes that God does not exist."
        feedback: |
          Job keeps addressing God, even in protest. The book does not end with disbelief.
      - text: "The book gives a clear reason for every suffering."
        feedback: |
          Many readers find that the whirlwind speeches give no such reason. Maimonides, in the Guide, reads the story as a way of presenting different opinions on providence.
    explanation: |
      Layers: the text of Job 42 is documented. How to read the poem, the prologue and the end together is scholarly debate (the ending of Job 42:6 is itself disputed). Whether suffering has a purpose is a commitment.

  - type: mcq
    id: trap-sabr
    title: "Sabr: just put up with it?"
    prompt: |
      Someone says: "In Islam, *sabr* means passive resignation to whatever happens." According to the sources in the lesson on suffering, what is the fairer description?
    options:
      - text: "Sabr, usually translated as patience, is described as steadiness in worship and in avoiding sin as well as enduring what cannot be changed. Resignation to what has been decreed is one part of it, not all of it, and the Qur'an, for example in 2:153, pairs patience with prayer."
        correct: true
        feedback: |
          Yes. The sources the lesson read describe sabr as active steadfastness on a right path, and say patience is joined with thankfulness. The word is not a command to stop trying to improve things.
      - text: "Sabr forbids any complaint or grief."
        feedback: |
          The lesson's sources describe patience as steadiness on a right path, not as a ban on feeling.
      - text: "Sabr is only a Sufi idea, unknown to the Qur'an."
        feedback: |
          The Qur'an uses the word, and verses on patience are among those quoted in the lesson.
      - text: "Sabr means seeking revenge when wronged."
        feedback: |
          That reverses the sense. The virtue is steadiness under hardship.
    explanation: |
      Layers: the verses are documented. How a specific scholar or school ranks patience among the virtues is scholarly debate. That trials come from God is a faith commitment of those who hold it.

  - type: mcq
    id: trap-golden
    title: "Golden Rule: proof of one religion?"
    prompt: |
      A speaker says: "The Golden Rule appears in the Jewish, Confucian, Christian and Islamic sources, so all religions teach the same thing." What is the fairest correction?
    options:
      - text: "The four sources use different wording and frames: Hillel says what is hateful to you do not do to your neighbor, the Analects calls reciprocity the word to follow, Matthew states it positively, and a hadith ties it to faith and love for one's brother. They are a family resemblance, not one rule, and they sit inside very different pictures of the world."
        correct: true
        feedback: |
          Yes. The overlap at the level of acts is real and worth noting. The reasons, the authority and the wider teaching differ, and the rule does not settle hard cases on its own.
      - text: "The wording is identical in all four, so the rule was copied."
        feedback: |
          The wordings differ, and nothing in the lesson's sources shows copying.
      - text: "None of the sources contain anything like it."
        feedback: |
          All four are documented in the lesson, with their texts.
      - text: "The overlap proves that morality needs religion."
        feedback: |
          Secular statements such as the Universal Declaration of Human Rights also express shared goods, and the overlap does not by itself show a common ground.
    explanation: |
      Layers: the four texts are documented. Whether they express one underlying idea is scholarly and philosophical debate. Whether any of them is divinely given is a faith commitment.

  - type: mcq
    id: trap-reasons
    title: "Same rights, same reasons?"
    prompt: |
      The 1948 Universal Declaration of Human Rights was drafted by people from different traditions. A student says: "Since they agreed on the rights, they must have agreed on why." What is the best reply?
    options:
      - text: "Agreement can occur at three levels: acts, rules or rights, and reasons. The first two can be shared while reasons differ. A remark by Jacques Maritain from the time, paraphrased in essence, says that people agree about the rights on condition that no one asks them why."
        correct: true
        feedback: |
          Yes. Shared goods in the lesson's sense are agreement on acts and rules, which is a real and useful thing, but it does not require shared grounds. The grounds are where traditions and secular views part ways.
      - text: "They must have agreed, since a document needs one foundation."
        feedback: |
          A document can state rules that people support for different reasons. That is the point of a consensus.
      - text: "They did not agree on anything, and the declaration is empty."
        feedback: |
          The agreement on rules was real and had large effects. It was just not agreement on every reason.
      - text: "They all agreed because all religions say the same thing."
        feedback: |
          The declaration is a secular statement, and the religions differ in their reasons.
    explanation: |
      Layers: the date (10 December 1948), the resolution and the Article 1 wording are documented. How far a shared list of rights can be stable without shared reasons is live debate.

  - type: mcq
    id: trap-humility
    title: "Interfaith humility = relativism?"
    prompt: |
      A critic says: "To be humble about religion you must say that all religions are equally true." What does interfaith humility, as the lesson describes it, actually ask?
    options:
      - text: "It asks you to hold your own claim, grant that others are sincere, and allow that you may be wrong. It does not say the claims are all true or all false. Relativism would be a separate thesis, with its own arguments."
        correct: true
        feedback: |
          Yes. The A Common Word letter shows the stance in practice: it states that Islam and Christianity are different religions and that formal differences should not be minimised, while naming love of the One God and love of the neighbour as common ground.
      - text: "It asks you to drop your own claim in order to avoid conflict."
        feedback: |
          Dropping your claim is a change of position, not humility. Humility is compatible with firm belief.
      - text: "It asks you to treat every claim as equally supported by evidence."
        feedback: |
          Different claims do have different support, and a humble person can say so.
      - text: "It asks you never to compare traditions."
        feedback: |
          Comparison is part of it. The lesson compares them fairly.
    explanation: |
      Layers: the letter and its wording are documented. Whether religions can all be true in some sense (a pluralist view) is debated. Which tradition, if any, is correct is a commitment.

  - type: mcq
    id: trap-consensus
    title: "Peace shows shared reasons?"
    prompt: |
      A citizen says: "Our society is stable, so we must all share the same deepest reasons." In Rawls's terms, as the Stanford Encyclopedia presents them, what is the best response?
    options:
      - text: "Stability can have two sources. A modus vivendi is a truce held only while power balances, while an overlapping consensus is support for the same political principles, each from within one's own comprehensive view, so that stability rests on the right reasons. In both cases the deepest reasons can still differ."
        correct: true
        feedback: |
          Yes. Rawls does not claim that an overlapping consensus is possible in every society. His claim is that a stable order does not need one shared comprehensive doctrine.
      - text: "Rawls says a stable society needs everyone to hold one religion."
        feedback: |
          It is the opposite of the idea behind an overlapping consensus.
      - text: "Rawls says stability never depends on reasons."
        feedback: |
          His point is that stability for the right reasons differs from a mere standoff.
      - text: "Rawls says deep differences make any stable society impossible."
        feedback: |
          His project is the claim that stability can survive such differences, under some conditions.
    explanation: |
      Layers: Rawls's terms are documented. Whether any real society reaches an overlapping consensus is a matter of political and historical debate.

  - type: mcq
    id: trap-map
    title: "Open questions: anything goes?"
    prompt: |
      After the course, a student says: "If thoughtful people still disagree on every question, then all positions must be equally good." What is the best reply?
    options:
      - text: "Disagreement shows only that the questions are hard, or that people differ in premises or commitments. Positions can still differ in evidence, consistency and the quality of their arguments. The map lists live positions without ranking them, which is a different thing from saying none is better."
        correct: true
        feedback: |
          Yes. The first job is to ask which kind of disagreement is at work: evidence, premise or interpretation, or commitment. A fair map describes each view as its best defenders would, and the work of comparing arguments is still open to you.
      - text: "Disagreement proves that every question is a matter of taste."
        feedback: |
          Some disagreements are about evidence and can be reduced with more data. Treating all as taste is an extra thesis.
      - text: "Disagreement means that the question has no answer."
        feedback: |
          Hard questions can still have answers, even when informed people have not yet agreed on them.
      - text: "Disagreement means you must pick one of two sides."
        feedback: |
          The lesson counts how many combinations of positions are possible: with six questions and three positions each, as many as 729 before any are ruled out. It is a grid, not two camps.
    explanation: |
      Layers: the survey of positions is documented in earlier lessons. Which positions are best supported is the live debate, and the course gives no verdict.

  - type: mcq
    id: trap-layers
    title: "Sort the layers"
    multiple: true
    prompt: |
      Select every statement that is **established fact** (a documented date, text or practice), not debate or commitment.
    options:
      - text: "The Universal Declaration of Human Rights was adopted on 10 December 1948 (resolution 217 A (III))."
        correct: true
        feedback: |
          Yes. A documented date and resolution. What justifies the rights is the debate.
      - text: "Job 42:7 reports God saying to Eliphaz that he and his friends have not spoken of God rightly as Job has."
        correct: true
        feedback: |
          Yes. That is what the text says. How to read the whole book is the debate.
      - text: "Nagel's essay 'The Absurd' appeared in the Journal of Philosophy in 1971."
        correct: true
        feedback: |
          Yes. A documented publication. Whether its argument succeeds is the debate.
      - text: "Death harms a person even if she feels nothing."
        feedback: |
          This is Nagel's claim, contested by Epicureans. A live philosophical debate.
      - text: "An overlapping consensus is possible in every society."
        feedback: |
          Rawls does not claim this. Whether it is achievable in a given society is an empirical and political question.
      - text: "Life has a meaning given by God."
        feedback: |
          A faith commitment, held by supernaturalists and denied by naturalists.
    explanation: |
      Dates, texts and documented publications are one layer. Positions in a live debate are another. Claims about ultimate value or what exists beyond nature are a third. A trap usually slides a claim from one layer into the one above.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Each trap took a useful idea one step too far: "no cosmic point" as "no meaning in any life", meaning as a feeling, Frankl as "invent your own", Nagel's absurd as a matter of size, naturalism as nihilism, Euthyphro as a refutation, evolutionary origin as proof of illusion, "no God, no morals" as "atheists cannot be good", Williams as pro-death, Nagel as agreeing with Epicurus, rebirth as one soul moving house, the Christian hope as only an immortal soul, the Hebrew Bible as having heaven and hell from the start, Job's friends as vindicated, sabr as passivity, the Golden Rule as proof of one teaching, shared rights as shared reasons, humility as relativism, stability as shared depth, and open questions as equal answers.

      A quick check for any claim about meaning, morals or death: ask what exactly the source says, which layer the claim belongs to (fact, debate or commitment), and what a thoughtful critic on the other side would reply.

      **Next:** Quick Recall, the main ideas and distinctions of this level in a few fast cards.
