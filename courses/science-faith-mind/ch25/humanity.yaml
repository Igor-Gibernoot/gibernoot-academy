id: ch25-humanity
title: "Interfaith Humility and Shared Goods"
kind: concept
own: |
  The setting: people from different religious traditions and from secular ethics live side by side and ask what they can share without pretending to agree on everything. Each claim is told *according to* the source named.
  - **The Golden Rule in several traditions.** Hillel (Shabbat 31a), the Confucian Analects (15.24 in some numberings), Matthew 7:12 and a hadith reported by Bukhari and Muslim each state a close relative of one idea, though in different frames and in negative or positive form:
  {{ $$\begin{aligned}&\text{treat another as you}\\&\text{would want to be treated}\end{aligned}$$ }}
  A shared sentence is not a shared reason: each text sits inside its own account of why it binds.
  - **Three levels of agreement.** People can agree on acts (do not kill the innocent), on rules or rights (Article 1 of the Universal Declaration of Human Rights, 1948), or on reasons (why persons have dignity). Agreement on the first two does not entail agreement on the third:
  {{ $$\begin{aligned}&\text{agreement on rules}\\&\not\Rightarrow\ \text{agreement on reasons}\end{aligned}$$ }}
  Maritain reported the remark that people of opposed outlooks agree on the rights but on condition that no one asks why.
  - **Overlapping consensus and modus vivendi.** According to Rawls (Political Liberalism, 1993), citizens with different comprehensive doctrines (whole views of life) can each endorse the same political principles for reasons from their own doctrine. This differs from a modus vivendi, a settlement held only by a balance of power:
  {{ $$\begin{aligned}&\text{overlapping consensus}\\&=\text{same rules, different reasons}\end{aligned}$$ }}
  - **Humility without relativism.** Interfaith humility means holding one's own truth claims while accepting that others are sincere, can be right about particular things, and should be understood in their own terms. The 2007 Muslim letter *A Common Word Between Us and You* shows the pattern: it says the two faiths are obviously different religions and their formal differences are not to be minimised, yet love of God and love of the neighbour are common ground:
  {{ $$\begin{aligned}&\text{common ground}\\&\neq\ \text{same religion}\end{aligned}$$ }}
  - **Where thoughtful people part ways.** Fact: what the texts and declarations say. Live debate: whether the Golden Rule is one rule or several, and whether a thin shared ethic is stable or too vague to guide. Commitment: whether the shared goods are grounded in God, in reason, in sentiment or in nothing deeper.

cards:
  - type: text
    id: hook
    title: "Four neighbours and a well"
    body: |
      Imagine one invented story. A small town has one well. Four neighbours must write its rules: Ruth, who follows Judaism; Daniel, a Christian; Amina, a Muslim; and Tomas, a secular humanist who believes in no god. They disagree on God, on the afterlife and on what the scriptures mean.

      Before any theory, guess: how many of the rules for the well will they be able to agree on, and will they agree for the same reasons?

      This lesson asks what traditions and secular ethics can share, and gives a fair statement of what they do not.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Ruth, Daniel, Amina and Tomas agree on a rule: no one may foul the well. What can we infer about their reasons?
    options:
      - text: "Nothing yet. They may agree for different reasons, or for the same reason, and the rule alone does not say which."
        correct: true
        feedback: |
          Right. A shared rule leaves open what each person takes to be its ground. The lesson returns to this gap again and again.
      - text: "They must share one reason, since people cannot agree on a rule without agreeing on why."
        feedback: |
          People often agree on a rule from different premises. A neighbour may obey because it is God's command, another because it harms people, another because the town votes for it.
      - text: "They must have different reasons, since religious and secular people never agree on anything."
        feedback: |
          They can and do agree on many rules. The point is that agreement on a rule does not by itself reveal the reasons.
      - text: "Their reasons do not matter, because only the rule affects the well."
        feedback: |
          Reasons matter when the rule is tested: when it is costly, when a new case arises, or when someone asks why they should obey.
    explanation: |
      Three things can be shared or not: the act, the rule and the reason. The rest of the lesson keeps them apart.

  - type: text
    id: golden
    title: "One idea, four sources"
    image:
      src: img/confucius.webp
      alt: "A painting of Confucius, a bearded man in a long robe with hands folded"
      caption: "A Tang dynasty painting of Confucius, made long after his life, so it shows how later artists pictured him."
      credit: "Wu Daozi, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Confucius_Tang_Dynasty.jpg"
    body: |
      The best known meeting point is a family of sayings often called the Golden Rule. Four, each told according to its tradition.

      In the Talmud (Shabbat 31a), a man asks to be taught the whole Torah while standing on one foot. According to the translation read for this lesson, Hillel answers: "What is hateful to you, do not to your neighbor: that is the whole Torah; the rest is commentary; go and learn it."

      In the Analects, Confucius is asked whether one word can guide a whole life. In James Legge's translation he answers: "Is not 'reciprocity' such a word? What you do not want done to yourself, do not do to others." Chapter and verse numbers differ between translations.

      In Matthew 7:12, in the World English Bible, Jesus says: "Therefore whatever you desire for men to do to you, you shall also do to them; for this is the law and the prophets."

      In the Forty Hadith of an-Nawawi, number 13, a saying reported by Anas bin Malik and recorded by Bukhari, in one English rendering, reads: "None of you will have faith till he loves for his believing brother what he loves for himself."

  - type: mcq
    id: golden-q
    title: "Same words, same role?"
    prompt: |
      Read the four sayings again: Hillel's "whole Torah", Confucius's "one word for a whole life", Matthew's "the law and the prophets", and the hadith's "none of you will have faith till...". What do they share, and what do they not?
    options:
      - text: "They share a close idea (regard another as you regard yourself), but each sits in a different frame: a summary of the Torah, a rule of conduct, a summary of the law and prophets, a mark of faith."
        correct: true
        feedback: |
          Yes. That is the fair statement: a real family resemblance, and different roles inside different systems.
      - text: "They are four copies of one identical rule, so the traditions agree on ethics entirely."
        feedback: |
          Overstated. The sayings differ in form (hateful versus desire, a negative or a positive rule) and in who counts: the hadith speaks of a believing brother, Hillel of a neighbour. Resemblance is not identity.
      - text: "They share nothing, since each depends on its own revelation or tradition."
        feedback: |
          Overstated the other way. Their closeness is real, and it is why the Golden Rule is the usual starting point of interfaith talks.
      - text: "They prove that all four traditions have the same God."
        feedback: |
          They do not. A shared moral sentence says nothing about whether the traditions mean the same God, a question about which they themselves disagree.
    explanation: |
      Layers: it is established fact that these texts say these things. Whether they amount to one rule is a live debate, and whether it shows anything about God is a matter of commitment.

  - type: mcq
    id: golden-test
    title: "Does the rule work alone?"
    prompt: |
      A critic of the positive Golden Rule ("do to others what you desire for yourself") says: a person who loves loud music at midnight, or who would welcome being bribed, could apply it and do harm. Which reply is a fair one?
    options:
      - text: "The rule needs a background of what counts as good for persons, so each tradition ties it to its wider account, and it works as a check on self-serving exceptions, not as a complete ethic."
        correct: true
        feedback: |
          A fair reply, and it is one reason the sayings sit inside larger teachings. The rule tests partiality: would I accept this if I were the one affected?
      - text: "The critic is wrong, because anything a person desires for themselves is good for everyone."
        feedback: |
          That is the premise the example attacks. Desires differ, and some are harmful.
      - text: "The critic is right, so the rule is useless and should be dropped."
        feedback: |
          Too quick. A rule can be a useful test without being the whole of ethics.
      - text: "The rule is only about religion and does not apply to the example."
        feedback: |
          Nothing in the sayings restricts them to religious matters.
    explanation: |
      The point is the limit: even a shared saying needs a wider account to apply, and that wider account is where traditions and secular ethics differ.

  - type: text
    id: udhr
    title: "A secular statement of shared goods"
    image:
      src: img/eleanor-roosevelt.webp
      alt: "Eleanor Roosevelt holding a large poster printed with the English text of the Universal Declaration of Human Rights"
      caption: "Eleanor Roosevelt with the English poster of the Declaration, at Lake Success, New York, in November 1949."
      credit: "FDR Presidential Library & Museum, CC BY 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Eleanor_Roosevelt_UDHR.jpg"
    body: |
      A second meeting point is not a religious text. The United Nations General Assembly adopted the Universal Declaration of Human Rights on 10 December 1948, as resolution 217 A (III). Its Article 1 reads: "All human beings are born free and equal in dignity and rights. They are endowed with reason and conscience and should act towards one another in a spirit of brotherhood."

      The article states that every human has dignity and equal rights. It does not say why. People hold this for different reasons: according to many Christians, Jews and Muslims, because humans are made by God; according to Kantians, because humans are rational agents who can set themselves ends; according to many secular humanists, because humans can suffer and flourish.

      Writing the introduction to a UNESCO volume on human rights, the philosopher Jacques Maritain reported a remark in essence like this: yes, we agree about the rights, but on condition that no one asks us why.

  - type: mcq
    id: udhr-q
    title: "What does the remark say?"
    prompt: |
      Maritain's reported remark is that people of opposed outlooks agreed on a list of rights, on condition that no one asked why. What does it show?
    options:
      - text: "Agreement on a list of rights can coexist with disagreement on the reasons that ground them."
        correct: true
        feedback: |
          Yes. Maritain used it to describe a practical agreement that did not need agreement on theory.
      - text: "The rights are arbitrary, since nobody can say why they hold."
        feedback: |
          The remark says people disagree on the reasons, not that no reasons exist. Whether one of the offered grounds is correct is a separate question.
      - text: "The drafters of the Declaration were hypocrites."
        feedback: |
          Nothing in the remark says that. It describes a deliberate choice to agree on rules without settling the grounds, and some thinkers see that as wise.
      - text: "All the signers shared the same theology."
        feedback: |
          The remark was made because they did not.
    explanation: |
      Whether such an agreement is stable, or whether the hidden disagreement will return, is itself debated. Some defenders see practical agreement as the achievable good, and some critics worry that unexamined reasons leave the agreement weak.

  - type: text
    id: three-levels
    title: "Three levels of agreement"
    body: |
      Three levels are worth keeping apart.

      The first level is **acts**: do not murder, do not steal, care for the helpless. Many traditions and secular ethics condemn the same acts.

      The second level is **rules or rights**: a statement such as Article 1, or the Golden Rule in its several forms. Agreement here is also wide, though it is wording-sensitive.

      The third level is **reasons**: why persons have dignity, why the rule binds, where morality comes from. This is where traditions part ways with each other and with secular ethics, as the lesson Guided proof: Morality Without God? showed for the question of ground.

      The word "shared goods" in this lesson names agreement at the first two levels. It makes no claim about the third.

  - type: mcq
    id: levels-q
    title: "Which level?"
    prompt: |
      Ruth, a Jew, says: "We must care for the stranger, because our people were strangers in Egypt, as the Torah reminds us." Tomas, a secular humanist, says: "We must care for the stranger, because they can suffer as we can." At which level do they agree, and at which do they differ?
    options:
      - text: "They agree on the act and the rule (care for the stranger) and differ on the reason."
        correct: true
        feedback: |
          Yes. The act and the rule are shared, while the grounds come from different sources: a history told in a tradition, and a view about suffering.
      - text: "They differ on the act, since religious and secular ethics always conflict."
        feedback: |
          They agree on the act here. Conflict is possible elsewhere, but not in this pair of sentences.
      - text: "They agree on the reason, since both mention the stranger."
        feedback: |
          Mentioning the stranger is the shared act. The reasons offered are different: one is about a remembered history, the other about a capacity to suffer.
      - text: "They agree on all three levels."
        feedback: |
          Not on the third. Their reasons differ, even though they could work together happily.
    explanation: |
      A single sentence can hide the level. Asking "which level is this?" is the habit the lesson builds.

  - type: text
    id: global-ethic
    title: "Religions write a shared ethic"
    body: |
      Religious leaders have also tried to write shared goods down. The Parliament of the World's Religions presented a document titled *Towards a Global Ethic (An Initial Declaration)* at its Chicago gathering in September 1993. According to a Georgetown University Berkley Center account, Hans Küng wrote one section of it and others wrote the other, the text drew feedback from more than a hundred religious leaders and scholars, and it rests on the Golden Rule and on the mandate to treat all human beings humanely.

      In the text as reproduced by Kosmos journal, the Golden Rule appears as "We must treat others as we wish others to treat us", and the aim is stated as that every person be treated humanely, "without exception."

      Defenders say the general wording lets each tradition restate the ethic in its own terms. A critic could reply that wording this general may not settle the hard cases. Both views are live.

  - type: mcq
    id: global-q
    title: "Thin or thick?"
    prompt: |
      A shared ethic can be thin (a few broad commitments such as nonviolence and fairness) or thick (detailed rules on family, worship, diet, speech). Which is a fair claim about the Global Ethic and a thin shared ethic in general?
    options:
      - text: "A thin ethic is easier to share across traditions, and each tradition still has to supply the thick detail from its own sources, where disagreement is larger."
        correct: true
        feedback: |
          Yes. Breadth costs detail. The shared part is real and small enough to be shared, and the rest is left to each tradition or each person.
      - text: "A thin ethic replaces each tradition's own detailed teaching."
        feedback: |
          It does not claim to. It is offered as common ground beside the traditions, not instead of them.
      - text: "A thick ethic is shared by all religions, and only the thin one divides them."
        feedback: |
          Reversed. Detailed rules vary most between traditions.
      - text: "A thin ethic shows that every tradition's ethic is the same."
        feedback: |
          It shows only what is shared at the broad level.
    explanation: |
      The tradeoff is real: more detail means more guidance and less agreement.

  - type: text
    id: rawls
    title: "Same rules, different reasons"
    body: |
      The philosopher John Rawls, in *Political Liberalism* (1993), gave this situation a name. According to the Stanford Encyclopedia of Philosophy, in an **overlapping consensus** citizens all endorse a core set of laws, each for reasons from their own comprehensive doctrine, by which we mean a whole view of life, religious or not.

      Rawls contrasts it with a **modus vivendi** (Latin, "way of living"): a settlement held in place by a balance of power among groups with competing views. The encyclopedia says that stability in an overlapping consensus is meant to be better than a mere balance of power, since power shifts and a modus vivendi can collapse when it does, while citizens in an overlapping consensus affirm the political rules from within their own view. The same entry notes that Rawls does not claim such a consensus is possible in every liberal society.

      Take Ruth, Daniel, Amina and Tomas again. If each backs equal rights because their own view requires it, that is an overlapping consensus. If each obeys only because the others are strong enough to force it, that is a modus vivendi.

  - type: mcq
    id: rawls-q
    title: "Consensus or standoff?"
    prompt: |
      In a town, two groups hold opposed views. Each tolerates the other only because neither can win a conflict. If one group became stronger, it would stop tolerating the other. According to Rawls's distinction, what is this?
    options:
      - text: "A modus vivendi: a settlement resting on a balance of power."
        correct: true
        feedback: |
          Yes. Its support disappears when the balance shifts.
      - text: "An overlapping consensus, since both groups currently agree to tolerate."
        feedback: |
          Present behaviour is not enough. In an overlapping consensus each group endorses tolerance from its own view, so it would hold even if it gained power.
      - text: "A comprehensive doctrine, since both hold strong views."
        feedback: |
          A comprehensive doctrine is a whole view of life. The question is about what holds the settlement together.
      - text: "A proof that tolerance is false."
        feedback: |
          The case does not touch the truth of tolerance. It describes what keeps the peace.
    explanation: |
      Rawls hopes for the first kind of agreement being the second. Whether that hope is realistic is a live debate, and the encyclopedia notes he does not say it always works.

  - type: text
    id: humility
    title: "What interfaith humility is, and is not"
    body: |
      Recall the lessons Intellectual Humility and Honest Doubt and Religious Pluralism: Many Faiths, One Truth?: a person can hold a belief firmly and still allow they may be wrong, and the main stances on other religions are exclusivism, inclusivism and pluralism.

      **Interfaith humility** can be stated as follows: hold your own truth claims, accept that people of other views are sincere and can be right about particular things, and describe their views in terms they would accept. It is not relativism, which says all views are equally true, and it is not timidity.

      A Muslim example from inside a tradition is the 2007 open letter *A Common Word Between Us and You*, addressed to Christian leaders. Its text says love of the One God and love of the neighbour are part of the foundational principles of both faiths, and calls this "the common ground". It also says that Islam and Christianity "are obviously different religions" and that "there is no minimising some of their formal differences". The lesson reports what the letter says, not a verdict on it.

  - type: mcq
    id: humility-q
    title: "Humble or relativist?"
    prompt: |
      Daniel, a Christian, says: "I believe Jesus is the Son of God, and I think you are mistaken, Amina. But I think you are sincere, I want to understand your view as you state it, and I may be wrong." Which description fits?
    options:
      - text: "Interfaith humility: he holds his claim, grants sincerity, and allows he may be wrong."
        correct: true
        feedback: |
          Yes. Holding a claim does not require contempt for those who differ.
      - text: "Relativism, because he does not call Amina wrong in an insulting way."
        feedback: |
          Relativism would say both views are equally true. Daniel says he thinks she is mistaken.
      - text: "Hypocrisy, since a person who thinks others mistaken cannot respect them."
        feedback: |
          Respect and disagreement can coexist, as they do in any serious debate between friends.
      - text: "A denial of his own faith."
        feedback: |
          He affirms it in the first clause.
    explanation: |
      The same sentence in the mouth of Amina, Ruth or Tomas would fit equally. Humility here is about manner and openness, not about giving up the claim.

  - type: text
    id: differences
    title: "A fair statement of what they do not share"
    body: |
      Interfaith respect is not served by hiding differences. A fair statement names them as the traditions themselves would.

      They differ about **ground**: whether morality rests on God, on reason, on human nature or on something else (the question of the lesson Guided proof: Morality Without God?). They differ about **what a good life is for**, whether it ends in union with God, liberation, a good human community, or nothing beyond this life, as the lessons Facing Death and Is There Meaning? showed. They differ about **authority**: which texts or teachers count, and how to read them. And they differ in **detailed rules**, which is the thick level of detailed rules met above.

      Some of these differences matter little at the well and a great deal at a funeral or a wedding. Shared goods are not a claim that the differences are small. The claim is that a common life is possible without settling them.

  - type: mcq
    id: differences-q
    title: "Which sentence is fairest?"
    prompt: |
      Which closing statement about traditions and secular ethics would a believer, an atheist and an agnostic each be most likely to accept as fair?
    options:
      - text: "They overlap on many acts and rules, such as care for the vulnerable and some version of reciprocity, and they differ on the ground of morality, on the purpose of life, and on detailed rules."
        correct: true
        feedback: |
          Yes. It credits the overlap, names the disagreements, and picks no winner.
      - text: "They all say the same thing in different words, so the differences are only about language."
        feedback: |
          Believers and secular thinkers would reject this: the differences about God, authority and purpose are real.
      - text: "They share nothing, so cooperation across them is a pretence."
        feedback: |
          The sayings and declarations above are real overlaps, and cooperation does not depend on settling every difference.
      - text: "Religious ethics is the only real ethics and secular ethics only borrows from it."
        feedback: |
          This is a claim of one side. Secular thinkers hold that their ethics has its own grounds (see the lesson Guided proof: Morality Without God?), and the lesson does not decide.
    explanation: |
      A fair statement is one that each side recognises as describing it. That is the test used throughout the course.

  - type: mcq
    id: trap
    title: "A tempting inference"
    prompt: |
      Someone says: "Every religion teaches some version of the Golden Rule, so all religions are really the same underneath." What is the weakest step?
    options:
      - text: "From a shared saying to a shared core: the sayings sit in different frames, and religions differ on God, authority and purpose, which the saying does not touch."
        correct: true
        feedback: |
          Yes. Also, "every religion" would need a check of every tradition, and the lesson looked at only four.
      - text: "The claim that any religion teaches reciprocity at all."
        feedback: |
          The four sayings read above show it is real for those four. The weak step is the move to "the same underneath."
      - text: "The word 'religion', which cannot be defined."
        feedback: |
          Defining religion is debated, but that is not the main flaw of this inference.
      - text: "Nothing is wrong with it."
        feedback: |
          The inference slides from overlap at one level to identity at all levels.
    explanation: |
      Overlap is a fact worth stating. Identity is a further claim that the evidence does not support.

  - type: text
    id: summary
    body: |
      **Next:** the closing lesson, Where We Stand: A Map of Open Questions, gathers the questions of the whole course and the live positions on each, with no verdict.
