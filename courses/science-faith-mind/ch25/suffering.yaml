id: ch25-suffering
title: "Suffering and What Traditions Do With It"
kind: concept
own: |
  The setting: a person is struck by serious loss or illness and asks what to do with the suffering. Each answer below is told *according to* the tradition or thinker named, not as the course's verdict.
  - **Stoics.** According to Epictetus (Enchiridion, in Carter's translation), what disturbs us is not events but our judgments about them, so the exercise is to separate what is up to us from what is not:
  {{ $$\begin{aligned}&\text{disturbance}\\&=\text{our judgment}\\&\quad\text{about the event}\end{aligned}$$ }}
  Stoics aim at freedom from destructive passions, not at feeling nothing.
  - **Buddhists.** According to the first sermon, ordinary life is marked by *dukkha* (suffering, unsatisfactoriness), which has a cause, can end, and has a path:
  {{ $$\begin{aligned}&\text{suffering}\to\text{craving}\\&\to\text{its end}\to\text{path}\end{aligned}$$ }}
  Dukkha is a diagnosis with a cure, not the claim that life is only pain.
  - **Jews.** In the Book of Job, a man who loses everything protests and asks God for an account. According to the epilogue of Job, God says the friends who defended God with neat explanations have not spoken rightly, while Job's protest is not condemned: {{ lament and protest are a form of faithful speech }}.
  - **Christians.** Christians hold that God shared suffering in the cross, so suffering is not outside God's reach; they differ on whether, and how, suffering can be united with Christ's (the reading of Colossians 1:24 is disputed), and on theodicy (a defence of God's goodness in the face of evil).
  - **Muslims.** According to the Qur'an (2:155-156), people are tested, and the response is patience (*sabr*) and trust: {{ "Indeed we belong to Allah, and indeed to Him we will return" }}. Sabr is steadfastness, not only passive resignation.
  - **Secular thinkers.** According to Frankl, suffering that cannot be avoided can still be met by choosing an attitude toward it. According to Camus, the world gives no reason for suffering, and one answers by revolt and solidarity, not by finding a cosmic purpose.
  - **Where thoughtful people part ways.** Fact: what each text and thinker says. Live debate: how to read Job's ending and Colossians 1:24, how far Stoic control reaches. Commitment: whether suffering has a purpose at all.

cards:
  - type: text
    id: hook
    title: "One diagnosis, six responses"
    body: |
      Imagine one invented story. A woman, Marta, is told she has a serious illness. Six friends each respond differently.

      The first says, "Notice what is yours to decide here: how you judge this, not whether it came." The second says, "Look at how much of the pain is the clinging to the life you wanted." The third says, "Shout at God if you must. You are allowed." The fourth says, "God is with you, and was on the cross." The fifth says, "We belong to God and we return to God. Be patient, and pray." The sixth says, "There is no plan behind this. Choose what to do with the days."

      Before any theory, guess: which response would help most? The lesson does not choose. It sets out what each tradition claims, in its own words, and where they part ways.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Do you expect the traditions and thinkers in this lesson to give one shared answer to "why do people suffer"?
    options:
      - text: "No. Some say it has a purpose, some say it has a cause that can be removed, some say it must be borne, and some say it has no cosmic reason."
        correct: true
        feedback: |
          Right. The answers are different kinds of answers, not only different answers. The lesson sorts them by what each one claims.
      - text: "Yes. Every tradition teaches that suffering is a punishment for wrongdoing."
        feedback: |
          Some voices say this, and the Book of Job exists partly to argue against it. No tradition below is reducible to it.
      - text: "Yes. Every tradition teaches that suffering is an illusion."
        feedback: |
          Buddhists teach that suffering is real and has a cause. Stoics, Jews, Christians and Muslims treat it as real too. The claim fits some schools of some traditions at most.
      - text: "No. Only religions answer, while secular thinkers say nothing about suffering."
        feedback: |
          Secular thinkers answer as well: Frankl wrote about meeting unavoidable suffering, and Camus about revolt and solidarity.
    explanation: |
      The traditions differ on whether suffering has a reason, a cause, a lesson, or none, and on what a person should do. Each is taken in its own terms below.

  - type: text
    id: words
    title: "Pain, suffering, evil"
    body: |
      Three words are easy to run together. In this lesson they are used as follows, as working definitions, not as any one tradition's vocabulary.

      **Pain** is the felt hurt, bodily or mental. **Suffering** is the wider distress of a person facing pain, loss, fear or the collapse of a plan: it includes what the pain means to them. **Evil**, in the problem of evil met in Level 7, is the question of whether something that happens ought not to be, and how that fits with a good and powerful God.

      The same event can be all three, yet each word raises its own question: how to treat it, how to bear it, and what it says about the world. The traditions mostly speak to the second question, and some also take up the third.

  - type: mcq
    id: words-q
    title: "Which question is this?"
    prompt: |
      A man says: "The pain is manageable. What I cannot bear is that I no longer know what my days are for." Which of the three words best names what he is describing?
    options:
      - text: "Suffering: distress about what the pain means to him and to his life."
        correct: true
        feedback: |
          Yes. He separates the pain, which he can manage, from the distress, which is about meaning.
      - text: "Pain: the felt bodily hurt."
        feedback: |
          He says the pain is manageable. What troubles him is something else.
      - text: "Evil: the problem of reconciling the event with a good God."
        feedback: |
          He raises no question about God. A person can suffer without asking the problem of evil, and a philosopher can discuss evil without any suffering person in the room.
      - text: "None of these: pain, suffering and evil are the same thing."
        feedback: |
          They overlap but ask different questions. Telling them apart is what lets each tradition below be heard as speaking to one of them.
    explanation: |
      The words are the course's working use. Some traditions treat suffering mainly as a practical problem to solve, others as a question to put to God.

  - type: text
    id: stoics
    title: "Stoics: judgments, not events"
    image:
      src: img/epictetus.webp
      alt: "Engraved portrait of the philosopher Epictetus, a bearded man in a robe"
      caption: "Epictetus (c. 55 to c. 135 CE), in an engraving by Henri Bonnart made about 1700, long after his death."
      credit: "Henri Bonnart, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Epictetus_-_Henri_Bonnart_engraving_c._1700.png"
    body: |
      Recall Epictetus from the lesson on Stoicism. His *Enchiridion* (the Handbook) opens, in Elizabeth Carter's translation: "Some things are in our control and others not." Our opinions, choices, desires and aversions are ours. Our body, property and reputation are not.

      In section 5 Epictetus says, in the same translation: "Men are disturbed, not by things, but by the principles and notions which they form concerning things." According to the Stoics, when a loss troubles us, the trouble is carried by a judgment, such as "this is a terrible thing that should not happen to me". The practice is to examine the judgment, and to act well on what is up to us.

      A Stoic does not say that illness is not painful. The Stoic claim is that how far it disturbs the mind depends on the judgment. A critic replies that grief and fear are not only judgments, and that some losses should shake us. The Stoic reply is that the aim is to avoid destructive passion, not to feel nothing.

  - type: mcq
    id: stoic-q
    title: "What troubles us?"
    prompt: |
      According to Epictetus, a friend learns that he must leave his home city. What, on the Stoic view, is the first thing to examine?
    options:
      - text: "His judgment that leaving is a terrible evil, since judgments are up to him and the event is not."
        correct: true
        feedback: |
          Yes. The Stoic exercise starts with the judgment and with the question of what is in his control.
      - text: "Whether the city can be persuaded to let him stay, since the exercise is to change events."
        feedback: |
          He may try, but for Epictetus the outcome is not up to him. The practice does not start there.
      - text: "How to feel no pain about leaving, by suppressing the feeling."
        feedback: |
          This is the popular picture of Stoicism, and it is not what the Stoics teach. They aim to change the judgment that feeds the distress, not to bury a feeling.
      - text: "Whether leaving is a punishment sent to him for wrongdoing."
        feedback: |
          Epictetus does not argue this way. The Stoic question is about the judgment and what is in our control.
    explanation: |
      For the Stoics, the first step is to sort what is up to us from what is not. Whether the sorting leaves enough room for grief is where critics and Stoics disagree.

  - type: text
    id: buddhists
    title: "Buddhists: suffering has a cause and an end"
    image:
      src: img/buddha-sarnath.webp
      alt: "Seated stone Buddha with hands in the teaching gesture, carved in sandstone, in a museum."
      caption: "A sandstone Buddha in the teaching gesture, found at Sarnath, where tradition places his first sermon; it was made many centuries after his life, so it shows how later devotees pictured him."
      credit: "พระมหาเทวประภาส วชิรญาณเมธี, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Buddha_in_Sarnath_Museum_(Dhammajak_Mutra).jpg"
    body: |
      Recall the first sermon, preserved in the Pali text *Dhammacakkappavattana Sutta* (SN 56.11). It sets out four noble truths about ***dukkha***, a word usually translated as suffering or unsatisfactoriness. In Piyadassi Thera's translation on Access to Insight, the first truth lists "Birth is suffering, aging is suffering, sickness is suffering, death is suffering," and also "not to receive what one desires is suffering."

      The second truth gives the cause. In the same translation: "It is this craving (thirst) which produces re-becoming." The third says that dukkha ends with the "complete cessation of that very craving." The fourth names the path, the Noble Eightfold Path.

      Notice the shape. It is a diagnosis, a cause, a prognosis and a treatment, like a physician's. According to Buddhist teachers, the claim is not that nothing good happens, but that clinging to what changes sets up distress. The truths are not an answer to "why did this happen to me", which Buddhist texts often decline to answer. They are an answer to "what can be done".

  - type: order
    id: truths
    title: "The shape of the teaching"
    prompt: |
      Put the four noble truths in the order of the first sermon, as a physician's sequence.
    steps:
      - "Suffering (dukkha) is part of ordinary life."
      - "Suffering has a cause: craving."
      - "Suffering can end, when craving ends."
      - "There is a path to that end: the Noble Eightfold Path."
    hint: |
      Think of a physician: symptom, cause, whether it can be cured, then the treatment.
    explanation: |
      The order is diagnosis, cause, prognosis, treatment. It explains why Buddhists describe the teaching as practical: its aim is the end of suffering, not a theory of why suffering exists.

  - type: text
    id: job
    title: "Jews: Job, lament and protest"
    body: |
      The Book of Job tells of a man who loses property, children and health. In the prose opening he says, in the World English Bible, "Yahweh gave, and Yahweh has taken away." In the poetic centre his tone changes: "I will not keep silent. I will speak in the anguish of my spirit" (Job 7:11, same translation). Three friends, Eliphaz, Bildad and Zophar, argue that he must have sinned. Job refuses and asks for an account from God.

      God answers from a whirlwind, from chapter 38 on and again at 40:6, with a speech about divine wisdom and power, not an explanation of Job's suffering. In the epilogue (42:7), according to the book, God tells Eliphaz that he and his two friends have not spoken of God "the thing that is right, as my servant Job has", and Job is asked to pray for them. They are rebuked, and Job is not.

      The Psalms carry the same idea in short form. Psalm 13 begins, in the same translation: "How long, Yahweh? Will you forget me forever?" Many readers find in these texts a tradition that allows lament and protest as part of faith. Jewish readings of Job have also differed. According to the Jewish Encyclopedia's summary of the Talmud, Rabbi Eliezer said that Job blasphemed (he wished to "upset the dish"), while Joshua ben Hyrcanus held that Job served God out of love. Maimonides, in the Guide for the Perplexed (III.22), treated the story's basis as a fiction told to set out different opinions about divine providence.

  - type: mcq
    id: job-q
    title: "What does the ending say?"
    prompt: |
      According to the Book of Job's epilogue, how does God treat Job's three friends, who had argued that his suffering must be a punishment for sin?
    options:
      - text: "God rebukes them for not speaking rightly of God, as Job has."
        correct: true
        feedback: |
          Yes. The friends' tidy explanation is the one the book does not endorse. Readers still disagree about what the rest of the book answers.
      - text: "God praises the friends for defending divine justice."
        feedback: |
          The reverse. Defending God with a neat explanation is exactly what the epilogue rebukes.
      - text: "God explains to Job that his suffering was a punishment for secret sin."
        feedback: |
          The whirlwind speeches give no such explanation. The book sets the friends' view of punishment against Job's claim of innocence and does not endorse the friends.
      - text: "God does not speak in the book, and Job's questions are unanswered."
        feedback: |
          God does speak, from the whirlwind, but about divine wisdom and power, not about the reason for Job's loss. Whether that counts as an answer is a live question among readers.
    explanation: |
      Readers differ on what the book teaches: that suffering is not always punishment, that protest is permitted, or that God's ways exceed our grasp. All agree that the friends' neat explanation is set aside.

  - type: text
    id: christians
    title: "Christians: God in suffering"
    body: |
      Recall from the lesson on theodicy that Hick's soul-making view, Augustine's privation view and the free-will defence are attempts to say why a good God permits evil, each with objections.

      Christians add a claim about God's own place in suffering. According to the Gospel of Mark (15:34), Jesus on the cross cried out "Eloi, Eloi, lama sabachthani?", words that echo Psalm 22 and that the Gospel translates as a question to God about being forsaken. Christians hold that in the cross God shares human suffering, so it is not outside God's reach.

      A second theme is that suffering can be joined to Christ's. Paul writes (Colossians 1:24) that he rejoices in his sufferings for the church's sake and fills up "that which is lacking" in Christ's afflictions. How to read this is disputed. According to a Catholic Answers article, two readings are legitimate: Paul's sufferings carry Christ's Passion to others, or, as Augustine read it, Christ's afflictions are those of his body the church, so Christians who unite their sufferings to Christ continue them. According to a Ligonier devotional, nothing is lacking in the cross, and the "lack" refers to the troubles that God's people face before the kingdom comes.

      So there is no single Christian answer to why people suffer. There is a shared claim that God is not absent, with different accounts of what suffering is for.

  - type: mcq
    id: christian-q
    title: "A fair summary"
    prompt: |
      Which statement fairly describes what Christians say about the cross in relation to suffering?
    options:
      - text: "Christians hold that God shares suffering in the cross, and they differ on whether human suffering can be offered up and on what it is for."
        correct: true
        feedback: |
          Fair. The shared claim is that God is present in suffering. The readings of Colossians 1:24 and of the value of suffering differ across churches and writers.
      - text: "Christians teach that all suffering is a punishment for the sufferer's own sin."
        feedback: |
          Some voices have said so, but the Book of Job, which Christians also read, argues against such claims. It is not the shared view.
      - text: "Christians teach that suffering is an illusion and the cross shows this."
        feedback: |
          The cross is taken as real suffering. The claim that suffering is an illusion belongs to other schools, not to the Christian creeds.
      - text: "Christians agree on a single theory of why God permits suffering."
        feedback: |
          They do not. Theodicies such as Hick's and Augustine's differ, and some Christian thinkers decline to give any theory.
    explanation: |
      The Christian response stresses presence over explanation: God is said to be in the suffering, not behind a reason for it.

  - type: text
    id: muslims
    title: "Muslims: trial and patience"
    body: |
      The Qur'an speaks of suffering as a test. In the Saheeh International translation, 2:155 says: "And We will surely test you with something of fear and hunger and a loss of wealth and lives and fruits." The next verse describes those who are patient as those who, "when disaster strikes them, say, 'Indeed we belong to Allah, and indeed to Him we will return.'" Muslims use this verse at moments of loss.

      The word for patience is ***sabr***. According to IslamWeb, it covers persevering in worship and avoiding sin, which are choices, and also enduring what happens by divine decree, which is not a choice. IslamOnline describes it as enduring hardship and being steadfast on the right path. Verse 2:153 says: "Indeed, Allah is with the patient." Two further verses are often cited: "Allah does not charge a soul except [with that within] its capacity" (2:286), and "Indeed, with hardship [will be] ease" (94:6).

      So the response to suffering is trust and steadfast action, together with the belief that the test is within a person's capacity and that ease follows hardship. IslamOnline lists resignation to divine decrees as one category of patience among several, which shows that Muslim writers discuss how far patience is acceptance and how far it is effort.

  - type: mcq
    id: sabr-q
    title: "What is sabr?"
    prompt: |
      A critic says: "Sabr means passively accepting whatever happens." According to the sources in the lesson, how should this be answered?
    options:
      - text: "Sabr is described as steadiness in worship and in avoiding sin, together with enduring what cannot be changed, so resignation to divine decrees is one part of it."
        correct: true
        feedback: |
          Fair. The word covers both acceptance of what cannot be changed and active perseverance, and writers weigh them differently.
      - text: "The critic is right: sabr means doing nothing."
        feedback: |
          The sources describe sabr as active, as well as including acceptance. Seeing it only as passivity misses half of the meaning.
      - text: "Sabr means anger at God, which the Qur'an encourages."
        feedback: |
          The verses speak of patience and trust, not anger. How far complaint to God is allowed is discussed in Muslim writing and is not settled by these verses.
      - text: "Sabr applies to the poor only, since the Qur'an says wealth is a test but not hunger."
        feedback: |
          Verse 2:155 lists both loss of wealth and hunger, among fear, lives and fruits. It addresses everyone.
    explanation: |
      The verses name the test, the response and the promise. The word sabr is wider than the English "patience", which is why translations differ.

  - type: text
    id: secular
    title: "Secular thinkers: meaning without a cosmic reason"
    image:
      src: img/frankl.webp
      alt: "Portrait photograph of Viktor Frankl in 1965, an older man in a suit looking at the camera"
      caption: "Viktor Frankl (1905 to 1997), a Vienna psychiatrist who survived Theresienstadt, Auschwitz and two other camps and wrote about meaning afterwards."
      credit: "Prof. Dr. Franz Vesely, CC BY-SA 3.0 de, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Viktor_Frankl2.jpg"
    body: |
      Recall Viktor Frankl, who spent three years in four camps and wrote *Man's Search for Meaning* (German 1946, English 1959). According to common summaries, his logotherapy names three ways to find meaning: a deed, an experience, and an attitude toward unavoidable suffering. His claim, in essence, is that when suffering cannot be avoided, a person can still choose the stance taken toward it.

      Recall Albert Camus from the lesson on the absurd. According to Camus, the absurd is the clash between our longing for meaning and the silence of the world. He does not look for a hidden purpose behind suffering. In essence, he answers by revolt and by solidarity with others who suffer, and he asks us to imagine Sisyphus happy.

      Both accept that the universe gives no reason for suffering, and both reject despair. They part at what replaces a cosmic reason: for Frankl, a chosen meaning in the person's own situation; for Camus, lucid revolt. Critics reply that a meaning one chooses cannot console as a purpose one finds could, and defenders reply that a purpose that is not there cannot console at all.

  - type: mcq
    id: secular-q
    title: "Frankl and Camus"
    prompt: |
      According to Frankl and Camus, what do they share about suffering?
    options:
      - text: "Both hold that suffering has no cosmic reason that explains it, and both reject despair, in different ways."
        correct: true
        feedback: |
          Fair. Frankl stresses the attitude chosen, Camus revolt and solidarity.
      - text: "Both hold that suffering is a punishment that teaches a hidden lesson."
        feedback: |
          Neither looks for a hidden lesson in the event. Frankl treats the attitude as the point and Camus denies a purpose.
      - text: "Both hold that suffering should be removed by changing what we want, as Buddhists teach."
        feedback: |
          That is the Buddhist pattern. Neither Frankl nor Camus tells us to remove desire.
      - text: "Both hold that suffering is an illusion produced by judgment, as Stoics teach."
        feedback: |
          Neither says that. For Frankl and Camus the suffering is real, and the response is meaning or revolt.
    explanation: |
      They agree on the absence of a cosmic reason and differ on what replaces it. Believers and Buddhists answer that suffering has a place in a larger order or a path, and the lesson leaves that open.

  - type: mcq
    id: buddha-trap
    title: "Does Buddhism say life is only pain?"
    prompt: |
      A reader says: "Buddhism teaches that life is only pain, so it is a gloomy religion." According to Buddhist teachers and the sermon read above, what is wrong with this?
    options:
      - text: "Dukkha is a wider word (suffering, unsatisfactoriness), and the teaching is a diagnosis with a cause, an end and a path, not a claim that nothing is good."
        correct: true
        feedback: |
          Fair. The four truths are a physician's sequence, and a teaching about the end of suffering is hopeful in form.
      - text: "Buddhism denies that suffering is real, so the reader is wrong in the other direction."
        feedback: |
          The first truth says suffering is real. What Buddhists deny is that it is the whole story or that it cannot end.
      - text: "Buddhism says suffering is good for us, so the reader has it backwards."
        feedback: |
          Buddhist teachers do not call suffering good. They teach that it has a cause that can be removed.
      - text: "The reader is right, because the first truth says life is only pain."
        feedback: |
          The first truth lists forms of suffering, including birth, sickness, death and not getting what one wants, but the sermon goes on to its cause, its end and the path.
    explanation: |
      Dukkha names an unease that comes with clinging to things that change. Joy exists in the traditions, and the aim of the teaching is to end the cause of dukkha.

  - type: mcq
    id: stoic-trap
    title: "Do Stoics suppress feeling?"
    prompt: |
      A reader says: "Stoics tell us to suppress all feeling." According to the Stoic sources read in the course, what is the better description?
    options:
      - text: "Stoics aim at freedom from destructive passions, which they treat as false judgments, and allow good feelings such as joy and goodwill."
        correct: true
        feedback: |
          Fair. The Stoic term for this freedom is *apatheia*, and they distinguish passions from the good feelings called *eupatheiai*.
      - text: "Stoics say all feeling is good and should be expressed fully."
        feedback: |
          That is the opposite view. Stoics hold that passions rest on mistaken judgments.
      - text: "Stoics say that nothing is bad because nothing is real."
        feedback: |
          They do not deny reality. They hold that only virtue is good and that external events are not in our control.
      - text: "Stoics say that we should avoid pain by avoiding people."
        feedback: |
          Stoics stressed duties to others. Their advice is about judgment, not withdrawal.
    explanation: |
      The popular word "stoic" means unfeeling. The school's own claim is narrower: do not let a mistaken judgment run the mind.

  - type: mcq
    id: sort
    title: "Fair pairings"
    multiple: true
    prompt: |
      Back to Marta, told she has a serious illness. Select every pairing that fairly states a response as its own tradition or thinker holds it.
    options:
      - text: "A Stoic: ask which part is up to her, her judgment about it, and act well on that."
        correct: true
        feedback: |
          Fair, as Epictetus teaches in the Enchiridion.
      - text: "A Buddhist teacher: see how clinging to the life she wanted adds to her distress, and follow the path that loosens it."
        correct: true
        feedback: |
          Fair as a statement of the second truth and the path, in teachers' words.
      - text: "A Jewish reader of Job: she may protest and lament, and a tidy explanation is not owed."
        correct: true
        feedback: |
          Fair as one reading, found in the book and in the Psalms. Not all Jewish readers read Job the same way.
      - text: "A Christian: God shares suffering in the cross, and God is not absent."
        correct: true
        feedback: |
          Fair as the shared claim. Details about the value of suffering differ.
      - text: "A Muslim: this is a test, say that we belong to Allah and return to Him, and be patient and pray."
        correct: true
        feedback: |
          Fair, from Qur'an 2:153 to 2:156.
      - text: "A Stoic: she should feel nothing about it."
        feedback: |
          Not fair. Stoics aim at freedom from destructive passions, not at feeling nothing.
    explanation: |
      Each answer has its own logic: sort judgments, remove clinging, protest, find God present, or trust and endure. A person may find more than one useful, which does not make the traditions the same.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      *Facts* are settled by sources: what Epictetus, the first sermon, the Book of Job, the Gospel of Mark, the Qur'an, Frankl and Camus say. *Live debates* include how to read Job's ending and Colossians 1:24, whether sabr is more acceptance or effort, how far the Stoic line between what is and is not in our control can be drawn, and whether a chosen meaning can console as a found purpose would. *Commitments* decide the rest: whether suffering has a purpose in a larger order, and whether there is a God who shares it.

      A believer may find in Job or the cross a companion for protest, and in the Qur'an a call to steadfastness. A Buddhist may find a practical path. A Stoic may find a discipline of judgment, and a secular thinker may find a way to live with no cosmic reason. Each answer stands on a premise another rejects, and the course does not pick among them.

  - type: text
    id: summary
    body: |
      **Next:** the traditions and the secular views of this level disagree, but they also share some goods, such as care for the suffering and humility about their own claims. The lesson Interfaith Humility and Shared Goods asks what can be held in common without erasing the differences.
