id: ch25-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: the level asked what makes a life meaningful, where ethics comes from, how to face death and suffering, what people of different outlooks can share, and how the open questions of the course fit together. Each view is told *according to* its thinker or tradition; none is declared the winner.
  - **Meaning of life and in life.** **Meaning of life** asks whether human existence as a whole has a point; **meaning in life** asks what makes one person's life meaningful. A hybrid view says a life is meaningful insofar as {{ its attractions are to things that are objectively worthwhile }}, so a feeling of meaning alone is not enough.
  - **Where wrongness comes from.** Five answers: God's commands (the Euthyphro dilemma asks whether an act is good because God commands it or God commands it because it is good), natural law, consequences, duty and virtue. Whether a moral belief is justified is a different question from how we came to hold it:
  {{ $$\begin{aligned}&\text{origin of a belief}\\&\neq\ \text{its justification}\end{aligned}$$ }}
  - **Street's argument.** According to Sharon Street, if moral truths are independent of us and our moral beliefs were shaped by evolution, a match between them would be a coincidence:
  $$\begin{aligned}&\text{independent moral truths}\\&+\ \text{evolved beliefs}\\&\Rightarrow\ \text{match is a coincidence}\end{aligned}$$
  It concludes that we lack justified confidence in such beliefs, not that morality is false.
  - **Death.** According to Nagel, death is bad when and because it removes goods the life would have held, even if the dead person feels nothing:
  {{ $$\begin{aligned}&\text{badness of death}\\&=\text{value of the life it removes}\end{aligned}$$ }}
  According to Epicurus, death is nothing to us because only experience matters and death ends experience.
  - **Suffering.** According to the Buddha's first sermon, *dukkha* (suffering, unsatisfactoriness) has a cause, an end and a path, a diagnosis with a cure:
  {{ $$\begin{aligned}&\text{suffering}\to\text{craving}\\&\to\text{its end}\to\text{path}\end{aligned}$$ }}
  According to Epictetus, what disturbs us is our judgment about events, which is up to us, and not the events.
  - **What we can share.** People can agree on acts, on rules or rights, or on reasons. Agreement on the first two does not entail agreement on the third:
  {{ $$\begin{aligned}&\text{agreement on rules}\\&\not\Rightarrow\ \text{agreement on reasons}\end{aligned}$$ }}
  - **The map of open questions.** With $q$ questions and $k$ live positions on each, there are $k^q$ combinations before ruling any out. For $q=6$ and $k=3$:
  {{ $$3^6=729$$ }}
  This is an upper bound: the map is a grid, not two camps, and disagreement does not show all positions are equally good.

cards:
  - type: text
    id: welcome
    title: "Quick recall: meaning, ethics, death and what we share"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: **meaning of life and in life**, **where wrongness comes from**, **Street's argument**, **Nagel and Epicurus on death**, **how traditions meet suffering**, **three levels of agreement**, and **the grid of open questions**.

      Three kinds of card: **mnemonics and distinctions**, **build cards** for the main chains, and **applied cards that give you a case or numbers only**: you choose the idea yourself. A wrong guess is shown with its reason. Views are told *according to* their thinkers, none declared the winner.

  - type: mcq
    id: of-in
    title: "Of life or in life"
    prompt: |
      Philosophers who write on meaning separate two questions. Which pairing is right?
    options:
      - text: 'Meaning of life: does human existence as a whole, or the universe, have a point? Meaning in life: what makes one person''s life meaningful?'
        correct: true
      - text: 'Meaning of life: what makes one person''s life meaningful? Meaning in life: does the universe have a point?'
        feedback: |
          Swapped. "Of life" is the large question about the whole; "in life" is about what gives a single life its meaning.
      - text: 'They are one question in two phrasings, so any answer to one answers the other.'
        feedback: |
          They can come apart. A person may think the universe has no purpose and still hold that a life of care and good work is meaningful. Whether they can be kept apart is itself debated.
    shuffle: false
    hint: 'The whole, versus one life.'
    explanation: |
      Mnemonic: **of = whole, in = one life**. Subjectivism says meaning depends on a person's own attitudes, objectivism says some things have worth whatever anyone feels, and a hybrid view needs both.

  - type: mcq
    id: grass
    title: "The absorbed grass counter"
    prompt: |
      A man spends his days counting blades of grass and feels deeply absorbed and fulfilled. How do the three theories of meaning in a life judge it?
    options:
      - text: 'Subjectivism: meaningful, since he is attracted to it. Objectivism: not meaningful, since the pursuit has no worth. Hybrid: not meaningful, since attraction alone is not enough.'
        correct: true
      - text: 'All three say meaningful, since he feels it is.'
        feedback: |
          Only subjectivism lets feeling settle the question. Objectivists and hybrid theorists say a feeling of meaning is not a reliable sign that a life is meaningful.
      - text: 'All three say not meaningful, since no one else benefits.'
        feedback: |
          A subjectivist does not need anyone else to benefit: his own attitude is the test. And benefit to others is not the only thing an objectivist counts as worth.
    shuffle: false
    hint: 'Does feeling alone settle it?'
    explanation: |
      Mnemonic: **feel only, worth only, both**. According to Wolf, as reported in the lesson, a hybrid view needs the attraction to meet something objectively worthwhile.

  - type: mcq
    id: frankl
    title: "Frankl turns the question round"
    prompt: |
      According to Viktor Frankl, what changes when we ask "What is the meaning of my life?"
    options:
      - text: 'In essence, the question is turned round: life questions us, and we answer by being responsible for our lives, through a deed, an experience such as love, or the attitude taken to unavoidable suffering.'
        correct: true
      - text: 'In essence, we should look for the one meaning that the universe has stored for each person, and wait until it is delivered.'
        feedback: |
          Frankl does not describe a wait. We answer life's questions by what we do, love and the stance we take.
      - text: 'In essence, meaning is a feeling, and we should find the activities that produce it most.'
        feedback: |
          This is closer to a subjectivist view. Frankl names three ways to find meaning, and one is the attitude we take toward suffering we cannot avoid, which is not a pleasant feeling.
    shuffle: false
    hint: 'Who asks whom?'
    explanation: |
      Mnemonic: **life asks, we answer**. The wording is the lesson's paraphrase, not a quotation.

  - type: mcq
    id: five-sources
    title: "Five answers about wrongness"
    prompt: |
      Match the answer to what it says makes an act wrong.
    options:
      - text: 'Divine command: it breaks what God commands. Natural law: it goes against basic human goods grasped by reason. Utilitarianism: it fails to promote happiness. Kant: its maxim cannot be willed as a universal law, or it treats humanity merely as a means. Virtue: a person of good character would not do it.'
        correct: true
      - text: 'Divine command: it harms people. Natural law: it breaks a social contract. Utilitarianism: a person of good character would not do it. Kant: it breaks what God commands. Virtue: it fails to promote happiness.'
        feedback: |
          Scrambled. Harm to the total is the utilitarian test, the maxim is Kant's test, and character is the virtue route.
      - text: 'All five say an act is wrong when most people dislike it.'
        feedback: |
          None of the five rests on majority feeling. Each names a source of wrongness that is meant to hold whatever people feel.
    shuffle: false
    hint: 'God, goods, outcome, maxim, character.'
    explanation: |
      Mnemonic: **God, goods, outcome, maxim, character**. The Euthyphro dilemma presses the first: is an act good because God commands it, or does God command it because it is good? Robert Adams replies that God's commands flow from God's good and just nature.

  - type: mcq
    id: genetic
    title: "Origin and justification"
    prompt: |
      Someone says: "Your belief that cruelty is wrong came from evolution, so it must be unjustified." What is the slip, and what remains of the evolutionary worry?
    options:
      - text: 'How we came to hold a belief does not by itself settle whether it is justified (the genetic fallacy). The worry that remains is Street''s: it needs an argument about coincidence, not the origin alone.'
        correct: true
      - text: 'There is no slip: a belief with a natural cause is always unjustified.'
        feedback: |
          Our belief that 2 + 2 = 4 also has a natural cause. A cause of a belief does not decide whether it is justified.
      - text: 'There is no worry at all: evolution has nothing to say about moral beliefs.'
        feedback: |
          Street argues that it does, if moral truths are independent of us. Whether realists can answer her is debated.
    shuffle: false
    hint: 'Where a belief came from, versus whether it is justified.'
    explanation: |
      Mnemonic: **origin is not justification, but ask about the match**.

  - type: build
    id: street-build
    title: "Street's chain"
    prompt: |
      According to Sharon Street, suppose moral truths are independent of us and our moral beliefs were shaped by evolution for survival. Build what she says follows about the match between the two.
    prefix: '\text{independent truths}+\text{evolved beliefs}\Rightarrow'
    tiles: ['\text{match is a coincidence}', '\text{morality is false}', '\text{match is guaranteed}']
    answers:
      - ['\text{match is a coincidence}']
    wrong:
      - answer: ['\text{morality is false}']
        feedback: |
          Street's conclusion is that we lack justified confidence in such beliefs, not that morality is false.
      - answer: ['\text{match is guaranteed}']
        feedback: |
          Survival pressure rewards useful beliefs, not true ones about independent facts, so a match would be luck.
    hint: 'Survival is not aimed at independent moral facts.'
    explanation: |
      Mnemonic: **independent plus evolved gives luck**. Replies exist: Wielenberg's necessary moral truths, Enoch's survival argument, FitzPatrick's appeal to reflection. Their force is debated.

  - type: mcq
    id: three-questions
    title: "Ground, knowledge, motivation"
    prompt: |
      Three people argue. (a) "Without God, what makes cruelty wrong?" (b) "Without God, how could anyone know cruelty is wrong?" (c) "Without God, why would anyone refrain from cruelty?" Which question concerns the **ground** of morality?
    options:
      - text: '(a): it asks what makes a moral claim true. (b) is about knowledge and (c) is about motivation.'
        correct: true
      - text: '(b): it asks how we know, which is the ground of morality.'
        feedback: |
          How we know is a question of knowledge. The ground is what makes the claim true.
      - text: '(c): it asks why people act, which is the ground of morality.'
        feedback: |
          Why people act is motivation. A person can be motivated to act well whether or not God grounds morality.
    shuffle: false
    hint: 'What makes the claim true?'
    explanation: |
      Mnemonic: **ground, know, move**. According to Craig's own words, his argument is about ground, and he calls it arrogant and ignorant to claim that people cannot be good without belief in God.

  - type: build
    id: nagel-build
    title: "The deprivation account"
    prompt: |
      According to Nagel, death can harm a person even if she feels nothing at the time. Build what the badness of death is on this account.
    prefix: '\text{badness of death}='
    tiles: ['\text{value of the life it removes}', '\text{pain felt at dying}', '\text{length of the life}']
    answers:
      - ['\text{value of the life it removes}']
    wrong:
      - answer: ['\text{pain felt at dying}']
        feedback: |
          If death felt like nothing it would then be harmless, which is Epicurus' view. The deprivation account says the harm is the goods taken away.
      - answer: ['\text{length of the life}']
        feedback: |
          The account counts the value lost, not the years lived. A short life full of promise loses more than a long one with little left to gain.
    hint: 'Think of what a person would have had.'
    explanation: |
      Mnemonic: **bad for what it takes**. Epicurus' argument: only experiences matter, death ends experience, so death is nothing to us.

  - type: mcq
    id: williams
    title: "Would endless life be good?"
    prompt: |
      According to Bernard Williams, why would an endless life be unattractive?
    options:
      - text: 'A person who stays the same person eventually has no categorical desires left (desires that give a reason to go on, not conditional on being alive), so endless life ends in boredom or in a change so deep that it is no longer the same person.'
        correct: true
      - text: 'Because death is a good thing in itself, which every person should want.'
        feedback: |
          Williams does not say death is good in itself. His point is about what an endless life would lack, namely reasons to go on.
      - text: 'Because the dead feel nothing, so nothing could be lost.'
        feedback: |
          This is Epicurus' view. Williams' argument concerns the endless life, not the harm of death.
    shuffle: false
    hint: 'What would run out?'
    explanation: |
      Mnemonic: **bored or no longer you**. Critics such as Fischer reply that a life need not go dull.

  - type: mcq
    id: rebirth
    title: "Self and what continues"
    prompt: |
      According to Hindu traditions and Buddhist traditions, what passes through rebirth?
    options:
      - text: 'Hindu: an unchanging self (*atman*) passes through rebirth (*samsara*) shaped by karma, until liberation (*moksha*). Buddhist: with no unchanging self (*anatta*), a causal stream of conditioned states continues, like a flame passed from candle to candle.'
        correct: true
      - text: 'Hindu: no self, only a stream. Buddhist: an unchanging self passes through rebirth.'
        feedback: |
          Swapped. *Anatta* is the Buddhist denial of an unchanging self, and *atman* is the Hindu term for one.
      - text: 'Both say nothing continues after death.'
        feedback: |
          Both speak of rebirth, though they describe what continues differently. Mortalism is a different view, held by some Christians and by secular thinkers.
    shuffle: false
    hint: 'Self, or stream.'
    explanation: |
      Mnemonic: **atman = self, anatta = no self, flame = stream**. Where these views part is a matter of commitment.

  - type: build
    id: dukkha-build
    title: "The physician's sequence"
    prompt: |
      According to the first sermon, ordinary life is marked by *dukkha* (suffering, unsatisfactoriness). Build the sequence as a physician would read it: the illness, its cause, its end, the path.
    prefix: ''
    tiles: ['\text{suffering}', '\text{craving}', '\text{its end}', '\text{path}', '\to', '\to', '\to']
    answers:
      - ['\text{suffering}', '\to', '\text{craving}', '\to', '\text{its end}', '\to', '\text{path}']
    wrong:
      - answer: ['\text{craving}', '\to', '\text{suffering}', '\to', '\text{its end}', '\to', '\text{path}']
        feedback: |
          The sequence starts with the illness itself, then names its cause. The order is diagnosis, cause, cure, path.
    hint: 'Diagnosis first.'
    explanation: |
      Mnemonic: **illness, cause, cure, path**. Dukkha is a diagnosis with a cure, not the claim that life is only pain.

  - type: mcq
    id: suffering-match
    title: "What each tradition does with suffering"
    prompt: |
      Match each source to its answer when suffering strikes.
    options:
      - text: 'Epictetus: separate what is up to us from what is not, since our judgments disturb us. Job: lament and protest are a form of faithful speech. Qur''an: patience (*sabr*) and trust, which is steadfastness, not only passive resignation. Frankl: choose the attitude toward suffering that cannot be avoided.'
        correct: true
      - text: 'Epictetus: protest to God. Job: patience. Qur''an: separate what is up to us. Frankl: revolt against the world.'
        feedback: |
          Scrambled. Protest is the Job pattern, the dichotomy is Stoic and the revolt belongs to Camus.
      - text: 'All four say suffering has a purpose that explains it.'
        feedback: |
          Not all. Camus, for instance, says the world gives no reason, and Job's friends who gave neat explanations were rebuked in the epilogue.
    shuffle: false
    hint: 'Sort, protest, patience, attitude.'
    explanation: |
      Mnemonic: **sort, protest, steadfast, choose**. Where the views part: whether suffering has a purpose at all is a matter of commitment.

  - type: mcq
    id: three-levels
    title: "Three levels of agreement"
    prompt: |
      People of many outlooks can agree on three different things: on acts, on rules or rights, or on reasons. Which statement is right?
    options:
      - text: 'Agreement on acts and on rules or rights is possible while reasons differ. Agreement on rules does not entail agreement on reasons.'
        correct: true
      - text: 'If people agree on the rules they must hold the same reasons.'
        feedback: |
          They need not. Hillel, a Confucian text, Matthew and a hadith state a close relative of the Golden Rule, yet each sits inside its own account of why it binds.
      - text: 'Disagreement on reasons means they cannot agree on any act or rule.'
        feedback: |
          People with different reasons often agree on rules, such as the rights in Article 1 of the Universal Declaration of Human Rights (1948).
    shuffle: false
    hint: 'A shared sentence is not a shared reason.'
    explanation: |
      Mnemonic: **acts, rules, reasons; reasons can differ**. Rawls' overlapping consensus is the pattern: the same rules, held for different reasons from each doctrine. A modus vivendi is a settlement held only by a balance of power.

  - type: build
    id: agreement-build
    title: "Rules without reasons"
    prompt: |
      Build the claim that agreement on rules does not by itself give agreement on reasons.
    prefix: '\text{agreement on rules}'
    tiles: ['\not\Rightarrow', '\Rightarrow', '\text{agreement on reasons}']
    answers:
      - ['\not\Rightarrow', '\text{agreement on reasons}']
    wrong:
      - answer: ['\Rightarrow', '\text{agreement on reasons}']
        feedback: |
          This says agreement on rules always carries agreement on reasons. Overlapping consensus is the counterexample: same rules, different reasons.
    hint: 'Does the arrow hold?'
    explanation: |
      Mnemonic: **same rules, different reasons**. Interfaith humility means holding one's own truth claims while accepting that others are sincere and may be right about particular things, which is not relativism.

  - type: numeric
    id: grid-count
    title: "Counting the grid"
    prompt: |
      The course asked six families of open questions. Suppose that on each one three positions stay live among informed people, and that a person may take any position on any question independently. How many different overall combinations of positions are there?
    answer: 729
    wrong:
      - { value: 18, feedback: 'That adds 6 questions times 3 positions. Each combination picks one position on every question, so the choices multiply.' }
      - { value: 216, feedback: 'That is 6 cubed. There are 6 questions with 3 choices each, not 3 questions with 6 choices.' }
    hint: 'One choice per question; the choices are independent.'
    explanation: |
      Each of the 6 questions has 3 choices and they are independent, so the count is 3 multiplied by itself 6 times: 729. It is an upper bound, since some combinations may conflict. The map is a grid, not two camps.

  - type: numeric
    id: grid-count-2
    title: "A smaller grid"
    prompt: |
      Mia sorts the debate about meaning into five questions and finds four live positions on each, taken independently. How many combinations, before ruling any out?
    answer: 1024
    wrong:
      - { value: 20, feedback: 'That adds 5 questions times 4 positions. The choices multiply, since each combination takes one position on every question.' }
      - { value: 625, feedback: 'That is 5 to the power 4. Here there are 5 questions with 4 choices each, so 4 is the base.' }
    hint: 'One choice per question, independent.'
    explanation: |
      Five questions with 4 choices each, so 4 multiplied by itself 5 times: 1024.

  - type: mcq
    id: apply-rules
    title: "A hospital for refugees"
    prompt: |
      A Muslim neighbour, a Catholic neighbour and a secular humanist neighbour all support opening a clinic for refugees. The first speaks of the duty to the stranger, the second of every person made in God's image, the third of human dignity without any God. Which description fits best?
    options:
      - text: 'They agree on an act and a rule of care, but hold different reasons. This looks like an overlapping consensus, not a shared religion.'
        correct: true
      - text: 'Since they agree on the clinic they must all share one underlying reason.'
        feedback: |
          Their stated reasons differ. Agreement on an act or rule does not entail agreement on reasons.
      - text: 'Since their reasons differ they cannot cooperate on the clinic.'
        feedback: |
          Cooperation does not require shared reasons. Each can endorse the same rule from inside their own view.
    shuffle: false
    hint: 'Same act, different reasons.'
    explanation: |
      Common ground is not the same as one religion or one theory. Each hold their view and grant the others' sincerity.

  - type: mcq
    id: apply-ethics
    title: "Two replies at a village meeting"
    prompt: |
      At a village meeting someone proposes hanging a thief. Two replies.
      (A) "Count what each choice brings: the harm to the thief and his family against the safety of the village. Choose what does the most overall good."
      (B) "Ask what rule could be willed for everyone, and whether we treat the thief merely as a means. Hanging fails that test."
      Which reply is best matched by the utilitarian route, and which by Kant?
    options:
      - text: 'Utilitarian: (A). Kant: (B).'
        correct: true
      - text: 'Utilitarian: (B). Kant: (A).'
        feedback: |
          Swapped. (A) weighs total outcomes, the utilitarian test. (B) asks about the maxim and treating a person merely as a means, the Kantian test.
      - text: 'Both are Kantian, since both give reasons.'
        feedback: |
          Both give reasons, but of different kinds. (A) counts results; (B) judges the maxim and the treatment of a person.
    shuffle: false
    hint: 'One counts outcomes, the other tests the maxim.'
    explanation: |
      Only the sorting is needed, with no formula. Different routes can reach the same verdict, and which route is right is a live debate.

  - type: text
    id: summary
    body: |
      **Next:** the content map of the level: rebuild, box by box, how meaning, ethics, death, suffering and the shared goods fit together among look-alike decoys.
