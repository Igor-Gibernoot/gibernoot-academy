id: ch10-map
title: "Content Map: Consciousness and Mind"
kind: map
name: Level 10, Consciousness and Mind (easy and hard problems, the three replies, the zombie argument, neural correlates, global workspace and higher-order theories, integrated information, predictive processing and Orch OR, free will, the self, souls and afterlife, machines)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 10 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a theory given the definition of its rival, a premise rejected by the wrong critic, correlation mistaken for identity, a position swapped with its opposite), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: hard
    title: Easy and hard problems
    row: 1
    col: 2
    body: |
      According to Chalmers (1995), the **easy problems** ask how the brain performs functions (discriminating, reporting, controlling behaviour); the **hard problem** asks why performing them is accompanied by experience at all. His claim, a live debate and not a fact, is
      $$\begin{gathered}\text{functions explained}\\ \not\Rightarrow\\ \text{experience explained}\end{gathered}$$
    decoys:
      - body: |
          According to Chalmers (1995), the **hard problems** ask how the brain performs functions (discriminating, reporting, controlling behaviour); the **easy problem** asks why performing them is accompanied by experience at all. His claim, a live debate and not a fact, is
          $$\begin{gathered}\text{functions explained}\\ \not\Rightarrow\\ \text{experience explained}\end{gathered}$$
        feedback: |
          The two are swapped. The easy problems are the functional ones, hard in practice but of a kind science knows how to attack. The hard problem is why any of it is accompanied by experience.
      - body: |
          According to Chalmers (1995), the **easy problems** ask how the brain performs functions (discriminating, reporting, controlling behaviour); the **hard problem** asks why performing them is accompanied by experience at all. His claim, **established by the lab**, is
          $$\begin{gathered}\text{functions explained}\\ \Rightarrow\\ \text{experience explained}\end{gathered}$$
        feedback: |
          The arrow is the very thing Chalmers denies, and it is a philosophical claim and not a laboratory result. Explaining every function leaves open why the functions are felt.
    explanation: |
      The root of the level: every later box is a way of answering the hard problem, of arguing about it, or of testing a theory of what makes a system conscious.

  - id: replies
    title: Three replies
    row: 2
    col: 1
    body: |
      According to **Dennett** and illusionists such as Frankish, the sense that something is left over is itself a **misleading appearance** to be explained. Other physicalists accept an **epistemic** gap, a limit on how we understand, not on what exists. According to Chalmers the gap is **real**, so experience needs new fundamental ingredients (property dualism or panpsychism).
    decoys:
      - body: |
          According to **Chalmers** and illusionists such as Frankish, the sense that something is left over is itself a **misleading appearance** to be explained. Other physicalists accept an **epistemic** gap, a limit on how we understand, not on what exists. According to Dennett the gap is **real**, so experience needs new fundamental ingredients (property dualism or panpsychism).
        feedback: |
          The names are swapped. Dennett treats the leftover as an illusion to be explained; Chalmers takes it to be real and looks for new fundamental ingredients.
      - body: |
          According to **Dennett** and illusionists such as Frankish, the sense that something is left over is itself a **misleading appearance** to be explained. Other physicalists accept an **epistemic** gap, a limit on **what exists**, not on how we understand. According to Chalmers the gap is **real**, so experience needs new fundamental ingredients (property dualism or panpsychism).
        feedback: |
          Epistemic means about knowledge and understanding. A gap in what exists would be the ontological, real gap that Chalmers holds and these physicalists deny.
    explanation: |
      The three ways thoughtful people answer the hard problem: dissolve it, call it a limit of understanding, or take it at face value. Each later box leans on one of them.

  - id: zombie
    title: The zombie argument
    row: 2
    col: 2
    body: |
      Chalmers's argument: zombies (physically identical to us, no experience) are **conceivable**; the conceivable in this full sense is **possible**; if they are possible, **physicalism is false**:
      $$\begin{gathered}\text{conceivable}\Rightarrow\text{possible}\\ \Rightarrow\text{physicalism false}\end{gathered}$$
      The steps are valid, so the dispute is over the premises: **Dennett** denies the first (no real zombie has been conceived), physicalists following **Kripke** deny the second (some truths are necessary yet known only by evidence).
    decoys:
      - body: |
          Chalmers's argument: zombies (physically identical to us, no experience) are **conceivable**; the conceivable in this full sense is **possible**; if they are possible, **physicalism is false**:
          $$\begin{gathered}\text{conceivable}\Rightarrow\text{possible}\\ \Rightarrow\text{physicalism false}\end{gathered}$$
          The steps are valid, so the dispute is over the premises: physicalists following **Kripke** deny the first (no real zombie has been conceived), **Dennett** denies the second (some truths are necessary yet known only by evidence).
        feedback: |
          The critics are swapped. Dennett's reply is that the zombie hunch is a failure to imagine everything a full physical duplicate does (premise one). The Kripke-style reply says conceivability does not guarantee possibility (premise two), as with Hesperus and Phosphorus.
      - body: |
          Chalmers's argument: zombies (physically identical to us, no experience) are **conceivable**; the conceivable in this full sense is **possible**; if they are possible, **physicalism is false**:
          $$\begin{gathered}\text{conceivable}\Rightarrow\text{possible}\\ \Rightarrow\text{physicalism false}\end{gathered}$$
          If a premise is false the argument is **invalid**, and it claims that real people are zombies. **Dennett** denies the first premise, physicalists following **Kripke** the second.
        feedback: |
          A false premise makes an argument unsound, not invalid: the steps still follow. And the claim is about what is possible, not that anyone real lacks experience.
    explanation: |
      The hard problem turned into a proof, checked premise by premise, with validity kept apart from truth.

  - id: neuro
    title: Neural correlates
    row: 2
    col: 3
    body: |
      The **neural correlate** of an experience is the smallest brain activity that suffices for it. The **contrastive method** keeps the stimulus fixed and changes only the experience (masking, rivalry, blindsight). With $B$ the brain activity and $E$ the experience, evidence can support
      $$\begin{gathered}B\ \text{goes with}\ E\\ E\ \text{depends on}\ B\\ E\ \text{is the same thing as}\ B\end{gathered}$$
      The data support the first two well. They do not decide the third, since physicalists and dualists predict the same correlations.
    decoys:
      - body: |
          The **neural correlate** of an experience is the smallest brain activity that suffices for it. The **contrastive method** keeps the stimulus fixed and changes only the experience (masking, rivalry, blindsight). With $B$ the brain activity and $E$ the experience, evidence can support
          $$\begin{gathered}B\ \text{goes with}\ E\\ E\ \text{depends on}\ B\\ E\ \text{is the same thing as}\ B\end{gathered}$$
          The data support all three well, since physicalists and dualists predict **different** correlations.
        feedback: |
          Both camps predict the same recordings, anaesthesia effects and lesion effects, so the data cannot separate identity from a close tie between two things. That step belongs to philosophy.
      - body: |
          The **neural correlate** of an experience is the smallest brain activity that suffices for it. The **contrastive method** keeps the **experience** fixed and changes only the stimulus (masking, rivalry, blindsight). With $B$ the brain activity and $E$ the experience, evidence can support
          $$\begin{gathered}B\ \text{goes with}\ E\\ E\ \text{depends on}\ B\\ E\ \text{is the same thing as}\ B\end{gathered}$$
          The data support the first two well. They do not decide the third, since physicalists and dualists predict the same correlations.
        feedback: |
          The method is reversed. To find what tracks the experience, the stimulus stays the same while the experience changes (seen versus unseen), so any brain difference is a candidate.
    explanation: |
      The first test of the hard problem against data: the lab shows what goes with experience and what it depends on, and stops short of showing what experience is.

  - id: gwt
    title: Workspace and higher-order theories
    row: 3
    col: 3
    body: |
      According to **global workspace theory** (Baars, Dehaene), a content is conscious when it wins the competition and is **broadcast** to many specialist processes (in the brain, a late all-or-none ignition). According to **higher-order theories** (Rosenthal), a state is conscious when its owner has a thought that **"I am in this state"**. The standard objections are that ignition may track **being reported**, and that a higher-order thought may have **no state to be about** (misrepresentation).
    decoys:
      - body: |
          According to **global workspace theory** (Rosenthal), a content is conscious when its owner has a thought that **"I am in this state"**. According to **higher-order theories** (Baars, Dehaene), a state is conscious when it is **broadcast** to many specialist processes. The standard objections are that ignition may track **being reported**, and that a higher-order thought may have **no state to be about** (misrepresentation).
        feedback: |
          The definitions are given to the wrong theories. Broadcast is the workspace idea (Baars, Dehaene); the thought about one's own state is the higher-order idea (Rosenthal).
      - body: |
          According to **global workspace theory** (Baars, Dehaene), a content is conscious when it wins the competition and is **broadcast** to many specialist processes (in the brain, a late all-or-none ignition). According to **higher-order theories** (Rosenthal), a state is conscious when its owner has a thought that **"I am in this state"**. The standard objections are that ignition may track **a missing thought**, and that broadcast may have **no state to be about** (misrepresentation).
        feedback: |
          The objections are scrambled. Misrepresentation is aimed at higher-order theories (a thought with nothing to be about); the worry for the workspace is that the ignition may mark reportability and not experience.
    explanation: |
      Two functional answers to which process makes a state conscious. They come apart on cases of broadcast without a thought about it and of a thought without a state.

  - id: iit
    title: Integrated information
    row: 4
    col: 3
    body: |
      According to Tononi, $\Phi$ is the integration left at the **weakest cut**: it is large only if every cut into independent pieces loses much. In the lesson's toy score (smallest total link weight crossing a split) a chain of five nodes scores 1 and a ring of five scores 2. A feed-forward network or a cerebellum is expected to have **no integration of its own**. The number of ways to split $n$ nodes into two non-empty groups is
      $$2^{\,n-1}-1$$
    decoys:
      - body: |
          According to Tononi, $\Phi$ is the integration left at the **strongest cut**: it is large if some cut loses much. In the lesson's toy score (smallest total link weight crossing a split) a chain of five nodes scores 1 and a ring of five scores 2. A **cerebellum**, having most of the brain's neurons, is expected to have **high integration**. The number of ways to split $n$ nodes into two non-empty groups is
          $$2^{\,n-1}-1$$
        feedback: |
          The measure looks at the weakest cut, the split that costs least; if even that one loses little, the system is not really one thing. Neuron count does not matter: a cerebellum is made of nearly independent modules and is expected to score low.
      - body: |
          According to Tononi, $\Phi$ is the integration left at the **weakest cut**: it is large only if every cut into independent pieces loses much. In the lesson's toy score (smallest total link weight crossing a split) a chain of five nodes scores 2 and a ring of five scores 1. A feed-forward network or a cerebellum is expected to have **no integration of its own**. The number of ways to split $n$ nodes into two non-empty groups is
          $$2^{\,n}-1$$
        feedback: |
          Cutting a chain anywhere crosses one link, while a ring must be cut in two places, so the chain scores 1 and the ring 2. And splitting into two non-empty groups counts each split once, giving $(2^n-2)/2=2^{n-1}-1$ (15 for $n=5$).
    explanation: |
      A theory that starts from properties of experience and asks what a system must be like to match them. It is the rival of the workspace picture, and it is the one whose exact value cannot be computed for real brains.

  - id: other
    title: Predictive processing and Orch OR
    row: 5
    col: 3
    body: |
      According to Clark, Friston and Seth, the brain constantly **predicts** its input and is corrected by **prediction error**; Seth calls perception a controlled hallucination. According to Penrose and Hameroff (**Orch OR**), consciousness involves quantum collapse in microtubules. Tegmark estimated that coherence in the warm brain lasts only $10^{-13}$ to $10^{-20}$ s, against neural timescales of $10^{-3}$ to $10^{-1}$ s; Hagan, Hameroff and Tuszynski recalculated much longer times. It is contested, not established.
    decoys:
      - body: |
          According to Penrose and Hameroff, the brain constantly **predicts** its input and is corrected by **prediction error**; Penrose calls perception a controlled hallucination. According to Clark, Friston and Seth (**Orch OR**), consciousness involves quantum collapse in microtubules. Tegmark estimated that coherence in the warm brain lasts only $10^{-13}$ to $10^{-20}$ s, against neural timescales of $10^{-3}$ to $10^{-1}$ s. It is contested, not established.
        feedback: |
          The proposals are swapped. Prediction and error correction belong to Clark, Friston and Seth; the quantum collapse in microtubules is Orch OR, by Penrose and Hameroff.
      - body: |
          According to Clark, Friston and Seth, the brain constantly **predicts** its input and is corrected by **prediction error**; Seth calls perception a controlled hallucination. According to Penrose and Hameroff (**Orch OR**), consciousness involves quantum collapse in microtubules. Tegmark estimated that coherence in the warm brain lasts $10^{-3}$ to $10^{-1}$ s, against neural timescales of only $10^{-13}$ to $10^{-20}$ s, so it **would** be long enough. It is contested, not established.
        feedback: |
          The scales are swapped. Tegmark's point was that coherence would vanish in $10^{-13}$ to $10^{-20}$ s, far shorter than the $10^{-3}$ to $10^{-1}$ s on which neurons work, so it could not matter. Others recalculated much longer times.
    explanation: |
      Two further proposals with different standing: one a general theory of how the brain works, the other a speculative physics link that has been contested on numbers.

  - id: self
    title: What is the self?
    row: 3
    col: 1
    body: |
      According to **Locke**, a person is the same as far back as memory reaches; **Reid** replied that if $c=b$ and $b=a$ but $c$ remembers nothing of $a$, direct memory fails the transitivity of identity. According to **Olson's animalism**, we are human organisms and persist as long as the animal life goes on. According to **Parfit**, what matters in survival is connectedness and continuity, not identity: with $90\%$ of memories kept each year, direct links to $n$ years ago fall as $0.9^{\,n}$ ($0.9^{10}\approx0.35$) while the chain stays unbroken.
    decoys:
      - body: |
          According to **Locke**, a person is the same as far back as memory reaches; **Reid** replied that if $c=b$ and $b=a$ but $c$ remembers nothing of $a$, direct memory fails the transitivity of identity. According to **Olson's animalism**, we are the memories and character, so a brain moved into another body **carries the person**. According to **Parfit**, what matters in survival is connectedness and continuity, not identity: with $90\%$ of memories kept each year, direct links to $n$ years ago fall as $0.9^{\,n}$ ($0.9^{10}\approx0.35$) while the chain stays unbroken.
        feedback: |
          That is the psychological view animalism opposes. For Olson we are organisms, so a transplanted brain is an organ and the person stays with the body that keeps living.
      - body: |
          According to **Locke**, a person is the same as far back as memory reaches; **Reid** replied that if $c=b$ and $b=a$ but $c$ remembers nothing of $a$, direct memory fails the transitivity of identity. According to **Olson's animalism**, we are human organisms and persist as long as the animal life goes on. According to **Parfit**, what matters in survival is **identity**: with $90\%$ of memories kept each year, direct links to $n$ years ago fall as $0.1^{\,n}$ while the chain is **broken**.
        feedback: |
          Parfit argued the opposite: in cases where identity gives no answer, connectedness and continuity still matter. Keeping $90\%$ gives $0.9^{\,n}$ ($0.9^{10}\approx0.35$), and the overlapping chain of links stays unbroken.
    explanation: |
      From the replies to the hard problem to the subject that is supposed to have experience: what makes it one and the same over time, and what if there is none.

  - id: free
    title: Free will
    row: 4
    col: 1
    body: |
      Determinism says $(H\wedge L)\Rightarrow P$ for the past $H$, the laws $L$ and any later fact $P$; it is **not fatalism**. In Libet's task the readiness potential began about 550 ms before the movement, the reported urge about 200 ms before; later work reads this differently and it does not show that deliberate decisions play no role. **Libertarians** (Kane) say free will needs more than determinism allows; **hard incompatibilists** (Pereboom) say it is lost either way; **compatibilists** (Hume, Dennett) say a free act can flow from one's own reasons even if determinism is true.
    decoys:
      - body: |
          Determinism says $(H\wedge L)\Rightarrow P$ for the past $H$, the laws $L$ and any later fact $P$; it is **not fatalism**. In Libet's task the readiness potential began about 550 ms before the movement, the reported urge about 200 ms before; later work reads this differently and it does not show that deliberate decisions play no role. **Compatibilists** (Kane) say free will needs more than determinism allows; **hard incompatibilists** (Pereboom) say it is lost either way; **libertarians** (Hume, Dennett) say a free act can flow from one's own reasons even if determinism is true.
        feedback: |
          Two positions are swapped. Libertarians hold that free choice requires that determinism be false; compatibilists hold that freedom is compatible with determinism.
      - body: |
          Determinism says $(H\wedge L)\Rightarrow P$ for the past $H$, the laws $L$ and any later fact $P$; it is **fatalism**: what happens regardless of what you do. In Libet's task the readiness potential began about 550 ms before the movement, the reported urge about 200 ms before, which **shows that conscious decisions play no role**. **Libertarians** (Kane) say free will needs more than determinism allows; **hard incompatibilists** (Pereboom) say it is lost either way; **compatibilists** (Hume, Dennett) say a free act can flow from one's own reasons even if determinism is true.
        feedback: |
          Fatalism says outcomes come regardless of what you do; determinism says what you do is part of the chain that fixes the outcome. And the readiness-potential result has later readings (random fluctuations crossing a threshold) and concerned a trivial, arbitrary task, so it does not show that deliberate decisions play no role.
    explanation: |
      The same brain evidence as before meets a different question: not what makes a state conscious but whether the person who acts is responsible for the choice. Experiments and definitions of "free" have to be kept apart.

  - id: machines
    title: Machines and minds
    row: 3
    col: 2
    body: |
      According to Putnam's **functionalism**, same function gives the same mental state, whatever the material. **Turing** replaced "can machines think?" by the imitation game, which gives behavioural evidence. **Searle's** Chinese room argues $\text{syntax}\not\Rightarrow\text{semantics}$ and that brains cause minds by biological powers. The 2023 report of Butlin, Long and others derived 14 indicator properties and concluded that no current AI system is conscious, with no obvious technical barriers to building one.
    decoys:
      - body: |
          According to Putnam's **functionalism**, same function gives the same mental state, whatever the material. **Turing** replaced "can machines think?" by the imitation game, which **proves experience**. **Searle's** Chinese room argues $\text{syntax}\Rightarrow\text{semantics}$ and that brains cause minds by biological powers. The 2023 report of Butlin, Long and others derived 14 indicator properties and concluded that no current AI system is conscious, with no obvious technical barriers to building one.
        feedback: |
          Two slips. The imitation game gives behavioural evidence, and says nothing direct about experience. And Searle argues that syntax is not enough for semantics: the person in the room shuffles symbols by their shapes and understands no Chinese.
      - body: |
          According to Putnam's **functionalism**, same function gives the same mental state, whatever the material. **Turing** replaced "can machines think?" by the imitation game, which gives behavioural evidence. **Searle's** Chinese room argues $\text{syntax}\not\Rightarrow\text{semantics}$ and that brains cause minds by biological powers. The 2023 report of Butlin, Long and others derived 14 indicator properties and concluded that **current AI systems are conscious**, with **clear technical barriers** to going further.
        feedback: |
          The report concluded the reverse: no current system is a strong candidate, and no obvious technical barriers stand in the way of building ones that meet the indicators. Fluent reports are weak evidence, since a system trained on human text would produce them either way.
    explanation: |
      Theories of consciousness give different answers to whether a silicon system could be conscious: workspace and higher-order views look at organisation, Searle and integrated information at the substrate.

  - id: souls
    title: Souls and afterlife
    row: 4
    col: 2
    body: |
      According to **Plato's** Phaedo the soul resembles the unchanging Forms and so can outlast the body; according to **Descartes**, with $m$ the mind and $b$ the body, mind indivisible and body divisible give $m\neq b$; according to **Aristotle** the soul is the form of a living body. The argument from brain damage needs a further premise, that the dependence is **total and permanent**. In AWARE (2060 cardiac arrests) about 2% of interviewed survivors described the resuscitation, one account being checked against a recorded sound; in AWARE-II no survivor named a hidden picture and $11/28\approx39\%$ reported memories suggesting consciousness.
    decoys:
      - body: |
          According to **Aristotle's** Phaedo the soul resembles the unchanging Forms and so can outlast the body; according to **Descartes**, with $m$ the mind and $b$ the body, mind indivisible and body divisible give $m\neq b$; according to **Plato** the soul is the form of a living body. The argument from brain damage needs a further premise, that the dependence is **total and permanent**. In AWARE (2060 cardiac arrests) about 2% of interviewed survivors described the resuscitation, one account being checked against a recorded sound; in AWARE-II no survivor named a hidden picture and $11/28\approx39\%$ reported memories suggesting consciousness.
        feedback: |
          The philosophers are swapped. The Phaedo is Plato's, with a soul that outlasts the body; Aristotle's soul is the form of the living body and in general has no existence apart from it.
      - body: |
          According to **Plato's** Phaedo the soul resembles the unchanging Forms and so can outlast the body; according to **Descartes**, with $m$ the mind and $b$ the body, mind indivisible and body divisible give $m\neq b$; according to **Aristotle** the soul is the form of a living body. The argument from brain damage **needs no further premise**. In AWARE (2060 cardiac arrests) about 2% of interviewed survivors described the resuscitation, **every account being checked** against a recording; in AWARE-II no survivor named a hidden picture and $11/28\approx39\%$ reported memories suggesting consciousness.
        feedback: |
          The argument runs from dependence in this life to the claim that mental life cannot continue, which needs the premise that the dependence is total and permanent; a dualist denies it. And in AWARE only one account was checked against a recorded sound.
    explanation: |
      The oldest answers to what survives death, set beside the rebirth traditions (the self as atman in Advaita Vedanta, a causal stream in Buddhism, a progressing spirit in Spiritism), and tested against what brain evidence and near-death reports can show.

