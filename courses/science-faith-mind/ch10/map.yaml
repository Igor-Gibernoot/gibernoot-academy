outroTitle: Level 10 in one picture
outro: |
  **Chalmers** splits the *easy problems* (functions) from the *hard problem* (why they are felt), and three replies answer it: illusion (Dennett), an epistemic gap, a real gap. The **zombie argument** goes from conceivable to possible to physicalism false, and is rejected at the first premise (Dennett) or the second (Kripke-style physicalists). **Neural correlates** show what goes with and depends on experience, not that experience is identical to the brain. **Workspace** (broadcast), **higher-order** (a thought that "I am in this state") and **integrated information** (large $\Phi$ at the weakest cut) answer what makes a state conscious; **predictive processing** and **Orch OR** are further proposals. **Free will** sorts libertarians, hard incompatibilists and compatibilists, with $(H\wedge L)\Rightarrow P$ kept apart from fatalism. The **self** is memory (Locke), organism (Olson), connectedness and continuity (Parfit), or none (Hume, anatta). **Machines** test functionalism against Searle's $\text{syntax}\not\Rightarrow\text{semantics}$, and **souls** range over separable, form of the body, resurrection and rebirth, with the brain-damage premise and AWARE as evidence. People part ways on whether the hard problem is real, which premise of the zombie argument fails, which theory fits the data, whether freedom needs alternatives, and what a self is for. The level challenge puts the theories to the same cases: anaesthesia, split brains, machines and animals.
