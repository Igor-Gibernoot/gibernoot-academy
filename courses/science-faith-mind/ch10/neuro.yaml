id: ch10-neuro
title: "What the Brain Shows"
kind: concept
own: |
  The setting: a person who sees something (a face on a screen, say) while scientists record the activity of the brain, and the question of what such recordings can and cannot tell us about experience. **Experience** means there being something it is like to be the subject; the **physicalist** holds that experience is physical or fixed by physical facts.
  - **Neural correlate of consciousness (NCC).** According to Christof Koch and colleagues, the NCC of a particular experience is the minimal set of neural events and mechanisms that together suffice for it, as in
  {{ the smallest brain activity that is enough for this one experience (say, seeing a face) }}
  Researchers separate it from the background conditions (such as being awake).
  - **Contrastive method.** Keep the stimulus fixed and change only the experience, using masking (a brief target followed by a mask), binocular rivalry (a different image to each eye) or blindsight (a patient with a damaged primary visual cortex who guesses well about what he says he does not see). The brain difference that tracks the experience is the candidate:
  {{ $$\begin{gathered}\text{same stimulus,}\\ \text{seen vs unseen}\\ \Downarrow\\ \text{brain difference}\end{gathered}$$ }}
  - **Anaesthesia and lesions.** Under a general anaesthetic the same brain goes from awake to unresponsive and back; damage to a cortical area can remove one kind of experience (colour, faces) and leave the rest. According to researchers these show that experience *depends on* the brain. They also warn that unresponsive is not the same as unconscious (volunteers given ketamine later reported vivid dreams).
  - **Three relations.** Evidence can support three different claims about brain activity $B$ and experience $E$:
  $$\begin{gathered}B\ \text{goes with}\ E\\ E\ \text{depends on}\ B\\ E\ \text{is the same thing as}\ B\end{gathered}$$
  The data of this lesson support the first two well. {{ They do not decide the third: physicalists and dualists predict the same correlations }}.
  - **Open.** Which brain activity is the NCC is a live scientific debate; whether any NCC explains why it feels like something, or is identical to experience, is the hard problem again, a commitment of metaphysics and not a result of the lab.
cards:
  - type: mcq
    id: hook
    title: "Guess: does tracking the seeing show what produces it?"
    prompt: |
      A scientist records your brain while you look at a face on a screen. Whenever you report seeing the face, a certain patch of cortex becomes active; when you do not, it stays quiet. Before any theory, guess: does this show that the brain activity **produces** your seeing?
    options:
      - text: 'Yes: activity that always goes with the seeing is the seeing being produced.'
        feedback: |
          Tempting, and many scientists treat it as a working assumption. But "always goes with" is only correlation, and a correlation can have several explanations. The lesson sorts them.
      - text: 'It shows a tight link. Whether the link is cause, dependence or identity needs more than the recording.'
        correct: true
        feedback: |
          Yes. A recording shows that two things go together; further experiments (switching the activity off, damage, drugs) and a further philosophical step are needed to say what the link is.
      - text: 'No: brain activity has nothing to do with seeing.'
        feedback: |
          Too strong. Almost everyone, dualists included, accepts that brain activity and experience are closely tied. The debate is about what kind of tie.
    explanation: |
      The question of the lesson: how much do recordings, drugs and damage to the brain establish about experience, and where does the evidence stop and the philosophy begin?

  - type: text
    id: recall
    title: "Recall: the hard problem and the zombie"
    body: |
      Two ideas from earlier lessons are used here. By **consciousness** or **experience** we mean that there is something it is like to be the subject. According to David Chalmers, the *easy problems* ask how the brain performs functions (discriminating, reporting, controlling behaviour); the *hard problem* asks why performing them is accompanied by experience at all.

      The **zombie argument** (Chalmers) runs: P1, a being physically identical to us but with no experience is conceivable; P2, what is conceivable in this way is metaphysically possible; P3, if such a being is possible, then **physicalism** (the view that experience is physical, or fixed by the physical facts) is false. Critics reject P1 (Dennett) or P2 (those who note that some identities are discovered by science, not by thought alone).

      This lesson asks what the *brain sciences* can add. Their findings are real data. Whether they touch the premises is the question.

  - type: text
    id: ncc
    title: "Looking for the neural correlate"
    image:
      src: img/koch.webp
      alt: "Photograph of the neuroscientist Christof Koch smiling, in a jacket"
      caption: "Christof Koch (born 1956), neuroscientist who with Francis Crick launched the modern search for the neural correlate of consciousness."
      credit: "Romanpoet, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:ChristofKoch.jpg"
    body: |
      In 1990 Francis Crick (1916-2004), famous for the structure of DNA, and Christof Koch (born 1956) published "Towards a neurobiological theory of consciousness" in *Seminars in the Neurosciences*. They argued that the problem could in the long run be solved only by explanations at the neural level, and they chose to study **visual awareness**, since vision is the best understood sense.

      The programme looks for the **neural correlate of consciousness** (NCC). In the wording Koch later used with Tononi (2008), the NCC of a specific experience is the *minimal* set of neural events and mechanisms *jointly sufficient* for it. "Minimal" removes everything that merely tags along. "Sufficient" means that, with this activity present, the experience occurs. Researchers also separate the NCC of a particular content (a face, a colour) from the **background conditions** that must hold for any experience, such as being awake.

      This is a research programme, not a theory of why there is experience. It asks *where and what*, not *why*.

  - type: mcq
    id: ncc-q
    title: "What is an NCC?"
    prompt: |
      According to Koch and colleagues, what is the neural correlate of consciousness (NCC) of seeing a particular face?
    options:
      - text: 'All the brain activity that occurs while the person sees the face.'
        feedback: |
          Too much. Much of that activity (breathing control, background hum) has nothing to do with the face. The definition asks for the *minimal* set.
      - text: 'The smallest set of neural events that is enough, by itself, for that experience of the face.'
        correct: true
        feedback: |
          Yes: minimal, and jointly sufficient for that specific experience.
      - text: 'The brain region that explains why the face looks the way it does.'
        feedback: |
          The NCC is a claim about what goes with the experience, not an explanation of why it feels as it does. Whether a correlate could explain that is the hard problem.
      - text: 'The brain activity that is needed for the person to be awake at all.'
        feedback: |
          That is a background condition. The NCC of a specific content is what distinguishes seeing *this* face from seeing something else.
    explanation: |
      A correlate is a map entry: this activity, this experience. It is the starting point of the programme, and the next cards ask how the entries are found.

  - type: text
    id: masking
    title: "Same picture, seen or not seen"
    image:
      src: img/dehaene.webp
      alt: "Photograph of the neuroscientist Stanislas Dehaene speaking at a lectern"
      caption: "Stanislas Dehaene (born 1965), French cognitive neuroscientist at the Collège de France, who used masking to study what changes when a stimulus becomes conscious."
      credit: "Per Henning/NTNU, CC BY 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Stanislas_Dehaene_2014.jpg"
    body: |
      To find a correlate, change the experience and keep everything else fixed. Stanislas Dehaene (born 1965; *Consciousness and the Brain*, 2014) describes **masking** as perhaps the simplest way to do it. A target (a word, a face) is flashed briefly on a screen and followed by a **mask**, another image that interrupts it. With one timing the viewer reports seeing the target; with another the viewer reports seeing nothing, even though the target was on the screen both times.

      Because the stimulus is the same, any difference in the brain between the two trials goes with the difference in experience. According to Dehaene's review, a masked target can still be processed unconsciously to some degree, so the unseen trials are not simply "nothing happened". The research question becomes what extra process occurs when the target is seen.

  - type: mcq
    id: masking-q
    title: "Which comparison isolates the experience?"
    prompt: |
      A lab wants the brain difference that goes with *seeing* a face, and nothing else. Which comparison is cleanest?
    options:
      - text: 'Brain activity while looking at a face against brain activity while looking at a blank screen.'
        feedback: |
          Here the stimulus differs as well as the experience, so the difference could be about the stimulus (a face is on the screen) and not about seeing it.
      - text: 'Brain activity when the same face is flashed and reported seen, against when it is flashed and masked so that it is reported unseen.'
        correct: true
        feedback: |
          Yes. Same physical stimulus, different experience: the difference is a candidate for what goes with the seeing.
      - text: 'Brain activity of two people, one who loves faces and one who does not.'
        feedback: |
          People differ in countless ways, so the comparison is swamped by other differences.
      - text: 'Brain activity at the start of the experiment against the end.'
        feedback: |
          Tiredness, learning and boredom change over time, so this mixes many differences.
    explanation: |
      This is called the **contrastive method**. Its weak point, noted by Aru, Bachmann, Singer and Melloni (2012), is that the seen trials may differ from the unseen ones in things *before* the experience (such as attention) or *after* it (such as preparing to report), not only in the experience itself.

  - type: text
    id: blindsight
    title: "Blindsight"
    body: |
      A second way to separate seeing from processing is to find a person in whom they come apart. **Blindsight** was named by Lawrence Weiskrantz and colleagues, who published their first studies in 1974 (Weiskrantz, Warrington, Sanders and Marshall, *Brain*).

      Their best known patient is called D.B. (the initials used in the literature). Surgery to remove a vascular malformation in his right occipital lobe destroyed the right **primary visual cortex** (V1, the first cortical stage of vision), leaving him blind in the left half of his visual field. In his blind field he reported seeing nothing. Yet when asked to *guess* between choices (is there a stimulus, where is it, what orientation), he did far better than chance, and the results held up under repeated testing. This **forced-choice** testing showed that information from the blind field still reached his behaviour.

      Some researchers suggest that other pathways, which bypass V1, carry the information. The sources differ on details of D.B.'s history, and not every patient with such damage shows blindsight to the same degree.

  - type: mcq
    id: blindsight-q
    title: "What does blindsight separate?"
    prompt: |
      D.B. guesses the position of a light in his blind field well above chance, and says he sees nothing there. According to those who study him, what does this suggest about the brain?
    options:
      - text: 'That the information was processed and guided behaviour without being experienced, so processing alone is not enough for experience.'
        correct: true
        feedback: |
          Yes. Processing and guidance of action went on, while by his report experience was absent. That gives a clue about what is *extra* when experience is present, for instance the contribution of V1 and the areas it feeds.
      - text: 'That D.B. was lying about seeing nothing.'
        feedback: |
          He consistently denied seeing anything in that field, and nothing in the studies requires lying. A report can always be questioned, though: some critics ask whether his experience was just very weak.
      - text: 'That the eyes work without the brain.'
        feedback: |
          The eyes alone cannot guide behaviour; the point is that a pathway bypassing V1 apparently still works.
      - text: 'That the primary visual cortex is the seat of the soul.'
        feedback: |
          V1 is one stage of vision, and the studies suggest it matters for visual experience, but nothing in them speaks of a soul.
    explanation: |
      A critic may reply that D.B. has a very weak experience that he declines to call seeing. That reply is a good example of the problem of using *reports* as the measure of experience, which returns in the trap cards.

  - type: text
    id: rivalry
    title: "Binocular rivalry"
    body: |
      A third method keeps the stimulus constant for a long time. In **binocular rivalry** each eye is shown a different picture, say a face to one eye and a house to the other. The viewer does not see a blend. Instead the experience alternates: first the face, then the house, each dominating for a stretch of several seconds before the other takes over, while the images on the screen never change. The effect has been known since the 16th century (Giambattista della Porta, 1593) and was described clearly by Charles Wheatstone in 1838.

      In 1998 Frank Tong, Nakayama, Vaughan and Kanwisher used fMRI (a scan that tracks blood flow in the brain) while a face was shown to one eye and a house to the other. Activity in a face-sensitive area (the fusiform face area) and in a house-sensitive area (the parahippocampal place area) followed what the observers *reported* seeing at each moment, and not what was physically on the screen (*Neuron* 21, 1998). Monkey experiments (Logothetis and Schall, *Science*, 1989) had asked the same question of single neurons.

  - type: order
    id: rivalry-order
    title: "Reasoning from the rivalry experiment"
    prompt: |
      Put the logic of the binocular rivalry experiment in order, from set-up to conclusion.
    steps:
      - 'Show a face to one eye and a house to the other, and keep the pictures unchanged.'
      - 'Ask the observer to report, moment by moment, whether the face or the house is seen.'
      - 'Record activity in a face-sensitive area and a house-sensitive area at the same time.'
      - 'Line up the recorded activity with the reports.'
      - 'Conclude that, in these areas, activity follows what is experienced and not what is shown.'
    hint: |
      The stimulus is fixed, so the thing that changes is the experience, and the brain recording is compared with the reports.
    explanation: |
      Because the physical input never changes, a change in activity that follows the reports cannot come from the input. That is why rivalry is a favourite design. Note what the design does not do: it never shows that the activity *makes* the experience, only that they track each other.

  - type: text
    id: anaesthesia
    title: "Anaesthesia: the same brain, on and off"
    body: |
      Under a general anaesthetic such as propofol a patient becomes unresponsive and later reports no memory of the operation. For the study of consciousness this is a gift: the *same* brain goes from awake to unresponsive and back, by a dose of a drug.

      Michael Alkire, Hudetz and Tononi (*Science*, 2008) argued that anaesthetics seem to cause unconsciousness by disrupting the brain's ability to integrate information, with the back of the cortex central. In 2013 Casali and colleagues (*Science Translational Medicine*) gave the cortex a magnetic pulse and recorded the EEG echo. A measure of how complex the echo is (the **perturbational complexity index**) was high in healthy awake people and low in sleep and anaesthesia.

      The same literature warns of a trap. Sanders, Tononi, Laureys and Sleigh (*Anesthesiology*, 2012) argued that being unresponsive is not the same as being unconscious. In a study by Sarasso and colleagues (*Current Biology*, 2015) 18 healthy volunteers were made unresponsive with propofol, xenon or ketamine. After propofol and xenon they reported no experience; after ketamine they described long, vivid dreams, and the brain echo stayed complex.

  - type: mcq
    id: anaesthesia-q
    title: "What does anaesthesia show?"
    prompt: |
      Select **all** the conclusions that the anaesthesia findings support, according to the researchers described.
    multiple: true
    options:
      - text: 'Experience depends on the state of the brain: change the brain with a drug and the experience goes.'
        correct: true
        feedback: |
          Yes. A controlled intervention on one variable changes the other, which is stronger than a correlation.
      - text: 'Behaviour alone does not tell us whether someone is experiencing: some unresponsive people report vivid dreams.'
        correct: true
        feedback: |
          Yes. After ketamine the volunteers were unresponsive but reported rich dreams, so unresponsive does not mean unconscious.
      - text: 'The brain and experience are the same thing.'
        feedback: |
          A drug that changes the brain and thereby experience fits this, but it fits equally well an account on which the brain is needed for experience without being identical to it. The finding does not choose between them.
      - text: 'Experience is produced only in the part of the brain the drug touches.'
        feedback: |
          Nothing in the studies locates experience in one spot; the researchers talk of widespread interactions in the cortex, and the details are still debated.
    explanation: |
      Anaesthesia gives good evidence of **dependence** (experience goes when the brain is changed) and an instructive warning about behavioural tests. A dualist may reply that the brain is a necessary condition of experience without being the same thing, and a physicalist that dependence is just what identity would predict. The data do not separate the two.

  - type: text
    id: lesions
    title: "When part of the brain is lost"
    body: |
      Damage to the brain is the oldest source of evidence. In **cerebral achromatopsia** the eyes work, but damage to the cortex (typically in the lower, back part of the brain) removes colour from experience. In the case reported by Oliver Sacks and Robert Wasserman (1987), "Mr. I.", a painter, saw the world in greys after a car accident, and he could no longer even imagine colour. In **prosopagnosia** a person sees faces but cannot recognise them, a condition that often accompanies achromatopsia.

      Such cases suggest that particular kinds of experience depend on particular regions. They also come with cautions. Damage often spreads over more than one region, so a missing ability cannot always be pinned to one place. And a missing area shows it is *needed*, not that it is the whole story: removing a car's spark plugs stops the car, but the plugs are not the whole car.

  - type: mcq
    id: lesions-q
    title: "What a lesion shows"
    prompt: |
      A person loses colour experience after damage to one cortical area while the eyes remain healthy. What does this show most directly?
    options:
      - text: 'That this area is needed, in this brain, for colour experience.'
        correct: true
        feedback: |
          Yes: removing it removes the experience, so the experience depends on it (as a car depends on spark plugs).
      - text: 'That this area alone produces colour experience.'
        feedback: |
          Needed is not the same as enough. The area may be one link in a chain, and other regions may do essential work.
      - text: 'That colour experience is identical to the activity of this area.'
        feedback: |
          Dependence is weaker than identity. A radio needs its power supply, but sound is not the power supply.
      - text: 'That colour does not exist in the world.'
        feedback: |
          Nothing follows about the world. The eyes still receive light of different wavelengths; what is lost is the experience.
    explanation: |
      Lesions show dependence of one kind of experience on one part of the brain. Whether dependence reaches identity is a further question.

  - type: text
    id: relations
    title: "Correlation, dependence, identity"
    body: |
      The findings so far support claims of different strength about brain activity $B$ and experience $E$.

      | Claim | What would support it | Example |
      |---|---|---|
      | $E$ goes with $B$ (correlation) | Recordings that line up | Rivalry: activity follows reports |
      | $E$ depends on $B$ (dependence) | Changing $B$ changes $E$ | Anaesthesia, lesions |
      | $E$ is the same thing as $B$ (identity) | An argument, not a recording | Physicalism |

      The first two are laboratory results. The third is what physicalists (the view that experience is physical) assert and some dualists deny. A scientist can believe in the third on the grounds of simplicity, as science has found identities before (heat with molecular motion), but the lab cannot show it by recordings alone, because a dualist who accepts every correlation and dependence is not contradicted by any of them.

  - type: mcq
    id: relations-q
    title: "Sorting a finding"
    prompt: |
      Stimulating a patch of cortex with a weak current makes a patient report seeing a flash of light. Which claim does this support most directly?
    options:
      - text: 'Dependence: changing that brain activity changes the experience.'
        correct: true
        feedback: |
          Yes. An intervention on the brain changes the report, so the experience depends on the activity at least in this respect.
      - text: 'Only correlation: stimulation tells us nothing more than a recording.'
        feedback: |
          Stimulation is an intervention. Setting the activity ourselves and seeing the experience follow is stronger than watching them co-occur.
      - text: 'Identity: the flash is the current.'
        feedback: |
          The current is an electrical event in tissue; whether the experience is the same thing as the resulting activity is exactly the philosophical question the finding does not settle.
      - text: 'Nothing: it shows only that the patient is reporting what the experimenter wants.'
        feedback: |
          Possible in sloppy experiments, but the example describes a change that follows the stimulation, and controls (stimulating at other sites, blinding the patient) address this worry.
    explanation: |
      Lining up recordings, intervening, and arguing about identity are three separate steps. Many popular claims ("scientists have found where consciousness is made") jump from the first to the third.

  - type: mcq
    id: trap-explain
    title: "Trap: finding the correlate explains it"
    prompt: |
      A headline says: "Scientists find the neural correlate of seeing red, so the mystery of why red looks as it does is solved." What is wrong with the inference?
    options:
      - text: 'Nothing: once the correlate is found, the experience has been explained.'
        feedback: |
          This runs together *which* activity goes with red and *why* it is accompanied by experience that looks red. The first is a map; the second is the hard problem.
      - text: 'A correlate says which activity goes with red, not why that activity should be accompanied by an experience, or why one that looks like this.'
        correct: true
        feedback: |
          Yes. Defenders of the programme answer that finding the correlates is a first step and that the explanation may follow, as it did for heat and life. A critic replies that the gap in this case is of a different kind. That reply and the hope are both live positions.
      - text: 'Correlates cannot be found for experiences.'
        feedback: |
          They can, and the lesson has shown how. The point concerns what finding them accomplishes.
      - text: 'Red is not a real colour.'
        feedback: |
          Irrelevant to the inference.
    explanation: |
      Finding correlates is real and valuable science. Whether it can in the end close the explanatory gap is a separate question on which, according to the hard-problem lesson, thoughtful people disagree.

  - type: mcq
    id: trap-report
    title: "Trap: no report, no experience"
    prompt: |
      In a study published in *Science* in 2006, Owen and colleagues scanned a 23-year-old woman who met the clinical criteria for a vegetative state (no sign of awareness at the bedside). When asked to imagine playing tennis, a part of her brain involved in movement planning (the supplementary motor area) became active, as in 12 healthy volunteers asked the same. What follows?
    options:
      - text: 'That she certainly had full conscious experience, as in a healthy person.'
        feedback: |
          Too strong: this is a single case, the activity could be argued to be partly automatic response to words, and "full" experience is not shown.
      - text: 'That a lack of bodily response does not by itself prove a lack of experience, though one case and its interpretation remain contested.'
        correct: true
        feedback: |
          Yes. The finding gave a reason to doubt that behaviour is the last word, and it led to wider tests of patients, but the authors and others stressed caution.
      - text: 'That brain scans can never tell us anything about awareness.'
        feedback: |
          The study used a scan to find a response that bedside tests missed, so scans can add information.
      - text: 'That the supplementary motor area is the seat of consciousness.'
        feedback: |
          It is a movement-planning region, and it was active in the imagery task, which is a different matter.
    explanation: |
      The trap is "no report means no experience", and its opposite, "any activity means experience". The same worry applies to the whole programme: most NCC studies rely on reports. Tsuchiya, Wilke, Frässle and Lamme (2015) argued that this has biased the search and proposed *no-report* designs, while Block (2019) replied that removing the report does not remove later processing that follows an experience. Both views are live.

  - type: mcq
    id: zombie-link
    title: "Do correlates settle the zombie premise?"
    prompt: |
      Suppose the NCC of every kind of experience is mapped completely. Does this settle whether P2 of the zombie argument ("what is conceivable in this way is metaphysically possible") is true?
    options:
      - text: 'Yes: a complete map shows that experience is physical, so zombies are impossible.'
        feedback: |
          A complete map shows a perfect correlation. A dualist or panpsychist can accept the same map and hold that the correlation is a fundamental law, not an identity. That is the very dispute.
      - text: 'No: the same map is predicted by identity and by a view on which experience is distinct but lawfully tied to the brain, so it cannot decide between them.'
        correct: true
        feedback: |
          Yes. This is the usual verdict of philosophers on both sides. A physicalist adds that identity is the simpler reading, and a dualist that the map leaves the explanatory gap open.
      - text: 'No: because correlates are impossible to measure.'
        feedback: |
          The lesson showed they can be measured. The reason is logical: the data do not discriminate.
      - text: 'Yes: a complete map shows zombies are possible, since the map describes only physical facts.'
        feedback: |
          The map describes physical facts and their link to reports of experience. That does not show that a being with the same physical facts could lack the experience; that is what the argument must show.
    explanation: |
      According to Chalmers, the premises of the zombie argument concern what is possible in principle, which no amount of data on actual brains can settle. According to Dennett, the more that science explains the functions of the brain, the less the zombie seems conceivable, so for him science erodes P1 over time. The disagreement is about how to read the data, not about the data.

  - type: text
    id: parting
    title: "Where people part ways"
    body: |
      Almost everyone in this debate accepts the findings: experience and the brain are tightly tied, and changes to the brain change experience. The parting is over three questions.

      - **Established:** that experience correlates with and depends on brain activity, in the cases shown by rivalry, masking, anaesthesia and lesions.
      - **Live scientific debate:** which activity is the NCC. Some researchers place it mostly at the back of the cortex, others also give the front a role, and whether reports distort the search is argued.
      - **Metaphysical commitment:** whether dependence amounts to identity. Physicalists say yes, as the simplest reading; dualists and panpsychists say the data are compatible with something further; illusionists say the question of why it feels like something is itself to be explained away.

      The next lessons look at the main scientific *theories* that try to say what the correlate does: one says consciousness is information broadcast across the brain, another that it is the brain monitoring itself.

  - type: text
    id: summary
    body: |
      **Next:** the global workspace theory and the higher-order theories, two accounts of what the brain's activity does when it goes with experience.
