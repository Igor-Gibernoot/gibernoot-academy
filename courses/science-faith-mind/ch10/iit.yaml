id: ch10-iit
title: "Integrated Information and Other Rivals"
kind: concept
own: |
  The setting: a **theory of consciousness** says which physical or functional feature of a system makes it have experience (there being something it is like to be it). Brain recordings alone only show which activity goes with experience in people who can report it; a theory has to say *why that feature*, and so what to expect of a photodiode, a cerebellum or a computer.
  - **Integrated information theory (IIT).** According to Giulio Tononi (2004; version 4.0 in 2023), start from five properties of every experience (it exists for itself, is structured, is specific, is unified, is definite) and ask what a physical system must be like to match them. The answer: a system whose parts, taken as a whole, make a difference to themselves that no cut into independent pieces preserves. Its measure is $\Phi$ (phi), the integration left at the weakest cut:
  {{ $$\begin{gathered}\Phi\ \text{large}\ \Leftrightarrow\\ \text{every cut loses much}\end{gathered}$$ }}
  The lesson's toy version scores a network of linked nodes by the smallest total link weight crossing any split into two groups (a chain of five nodes scores 1, a ring of five 2). It is a stand-in, not real $\Phi$, which uses directed causes and effects.
  - **What IIT predicts, and what critics say.** According to Tononi and Koch, a cerebellum (made of small, nearly independent modules) and any purely feed-forward network have {{ no integration of their own }}, while a recurrent cortex does. Critics reply that the verdict then depends on the physical wiring and not on behaviour (the unfolding argument), that very simple dense grids would score high (Aaronson), and that the panpsychist-sounding implications are hard to test. In 2023 a letter signed by 124 scholars said the theory as a whole deserved the label pseudoscience until it is empirically testable; others called that too strong.
  - **Testing.** A large preregistered adversarial test of IIT against global workspace theory (Cogitate, *Nature*, 2025, 256 participants) found that the data fit parts of each theory and challenged key claims of both. Computing $\Phi$ exactly is out of reach for real brains: the number of ways to split $n$ nodes into two non-empty groups is
  {{ $$2^{\,n-1}-1$$ }}
  which for the 86 billion neurons of a human brain is a number with about 26 billion digits, before counting the other things $\Phi$ requires.
  - **Predictive processing.** According to Andy Clark, Karl Friston and Anil Seth, the brain constantly predicts its sensory input and is corrected by prediction error; Seth calls perception a {{ *controlled hallucination* }}, and argues that experience is rooted in the brain regulating the living body (the *beast machine*). It is a general theory of how the brain works; whether it explains why anything is felt is disputed.
  - **Quantum proposals.** According to Roger Penrose and Stuart Hameroff (Orch OR), consciousness involves quantum collapse in microtubules inside neurons. Max Tegmark (2000) estimated that quantum coherence in the warm brain would last only $10^{-13}$ to $10^{-20}$ seconds, far shorter than neural timescales of about $10^{-3}$ to $10^{-1}$ seconds; Hagan, Hameroff and Tuszynski (2002) recalculated much longer times. The proposal is contested, not established.
  - **Open.** Each theory says what would count as a test of it, and the tests so far favour none of them. Even a confirmed theory of which systems have experience is compatible with physicalists, dualists and idealists, who differ on *why*: that is the hard problem again, a commitment of metaphysics and not a result of the lab.
cards:
  - type: mcq
    id: hook
    title: "Guess: how would you find out?"
    prompt: |
      A thermostat, a photodiode (a light sensor that outputs one bit: light or dark), a thin slice of brain kept alive in a dish, and the cerebellum (the "little brain" at the back of the head, which holds most of the brain's neurons). Before any theory: which of these has some experience, if any? Nobody knows, and the question this lesson starts from is *how anyone could find out*. What would you need?
    options:
      - text: 'More recordings of the human brain in people who can report what they feel.'
        feedback: |
          Such recordings are essential, and they tell us which activity goes with experience *in us*. But they cannot by themselves say which feature of that activity matters. Is it the number of neurons, the broadcasting, the self-monitoring, the wiring? A photodiode has none of our features and all of them in some small form, so the recordings leave its case open.
      - text: 'Ask the photodiode or the slice to report.'
        feedback: |
          Report is the only direct evidence we have in people, and these systems cannot give it. That is the whole difficulty: a method that relies on report cannot be applied where report is impossible (infants, animals, patients who cannot move, machines).
      - text: 'A theory that says *which feature* of a physical system makes experience, tested first where we can ask, then applied where we cannot.'
        correct: true
        feedback: |
          Yes. That is the role of a theory of consciousness: not only a correlate (what goes with experience here), but a claim about the feature that matters, so that it can be applied to a cerebellum or a machine. The theories below disagree on what that feature is.
      - text: 'Nothing: it is obvious which of them are conscious.'
        feedback: |
          Intuitions differ and have been wrong before. Most people are sure about a thermostat and unsure about a cerebellum, and the theories below give different verdicts on both.
    explanation: |
      A correlate tells you where to look in a system you already believe is conscious. A theory has to reach the cases where you do not.

  - type: text
    id: recall
    title: "Recall: correlates, workspace and self-monitoring"
    body: |
      By **consciousness** or **experience** we mean that there is something it is like to be the subject. A **neural correlate of consciousness** is the minimal brain activity that goes with a given experience, usually found by the contrastive method (the same stimulus, seen versus unseen). A **theory of consciousness** goes further and says which process makes a state conscious.

      Two theories from the lesson Global Workspace and Higher-Order Theories: according to global workspace theory, a content is conscious when it is broadcast to many specialist processors; according to higher-order theories, a state is conscious when its owner has a thought that they are in it. Both say what consciousness *does*, in terms of how information is used.

      The rivals here start elsewhere. Integrated information theory asks what a physical system must *be like*, in its causal wiring. Predictive processing asks what the brain is *doing* when it perceives. Quantum proposals ask whether the brain uses a physics that ordinary neuroscience leaves out.

  - type: text
    id: tononi
    title: "Tononi: start from experience, not from the brain"
    image:
      src: img/tononi.webp
      alt: "Photograph of the neuroscientist Giulio Tononi in a dark jacket and tie"
      caption: "Giulio Tononi (born 1960), psychiatrist and neuroscientist at the University of Wisconsin-Madison, who proposed integrated information theory."
      credit: "NIH, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Giulio_Tononi_at_NIH_PioneerAwardg_2005.jpg"
    body: |
      Giulio Tononi proposed **integrated information theory** (IIT) in a 2004 paper, "An information integration theory of consciousness" (*BMC Neuroscience*). In essence: the amount of consciousness of a system corresponds to its capacity to integrate information, a quantity he calls $\Phi$ (the Greek letter phi). A much expanded version, IIT 4.0, was published in 2023 (Albantakis and colleagues, with Tononi as last author, in *PLOS Computational Biology*).

      The method is unusual. Instead of looking at brains and searching for a correlate, IIT starts from what every experience is like, its **axioms**, and then asks what a physical system must be like to match them. The five properties it names are:

      - **Intrinsic existence:** an experience exists for itself, from its own point of view, not only for an outside observer.
      - **Composition:** it is structured, made of distinctions (a mug, to the left of a book) and the relations between them.
      - **Information:** it is specific, what it is by differing from the other experiences it could have been.
      - **Integration:** it is unified; seeing a blue book is not seeing a grey book plus, separately, the colour blue.
      - **Exclusion:** it is definite, with its own borders in what it includes and in the time it spans.

      Sources describe the naming and order of these slightly differently across versions, and the theory later turns each property into a requirement on physical systems.

  - type: mcq
    id: axiom-q
    title: "Which property is the blue book?"
    prompt: |
      Integrated information theory points out that seeing a blue book is not the same as seeing a grey book and, separately, the colour blue. Which of its five properties of experience does this illustrate?
    options:
      - text: 'Integration: an experience is unified and cannot be split into independent parts without loss.'
        correct: true
        feedback: |
          Yes. The blue book is one experience, not two stuck together. The theory turns this into a requirement: a physical system matching it must also not fall apart into independent pieces.
      - text: 'Information: an experience is specific, differing from other possible experiences.'
        feedback: |
          Specificity is also true of the blue book (it is not the grey book), but the point of the example is the *unity* of the colour and the object, which is integration.
      - text: 'Exclusion: an experience has definite borders.'
        feedback: |
          Exclusion concerns what is in the experience and over what span of time, one definite answer. The blue-book example is about parts being bound together.
    explanation: |
      From this property comes IIT's central idea: if experience is unified, the physical system that supports it should be unified too, in the sense that cutting it into independent halves would lose something. The widget turns that idea into something you can poke.

  - type: text
    id: phi-idea
    title: "The weakest cut"
    body: |
      Take a system of units that act on each other. Cut it into two groups and ask how much of what the whole does is lost when each group is left to itself. Try every way of cutting; the cut that loses the *least* is the weakest link in the system's unity. According to IIT, the integration of the system is what survives even at that weakest cut. If some cut loses nothing, the system was really two systems, and there is no single experience to speak of.

      The real $\Phi$ is defined with directed causes and effects between the units, and the system's own current state. That is hard, so the next widget uses a **toy** version, not real $\Phi$: a network of nodes joined by links, where the **toy integration** is the smallest number of links crossing any split into two groups. Click a link to switch it on or off.

  - type: widget
    id: chain
    title: "Toy integration: a chain"
    widget: integration-demo
    config:
      links: [[0,1],[1,2],[2,3],[3,4]]
      cutList: 4
      show: {cutValue: true, reset: true}
    body: |
      Five nodes in a chain. The widget tries every split into two groups, counts the links crossing it, and shows the smallest (the weakest cut, its dashed links, and the four smallest splits). Try adding the link E-A to close a ring, then add a few more links, and watch the score. Then remove links until the network splits in two.

  - type: mcq
    id: chain-q
    title: "Why a chain scores 1 and a ring scores 2"
    prompt: |
      In the toy model, a network is scored by the smallest number of links that any split into two groups must cut. A chain of five nodes (A-B, B-C, C-D, D-E) scores 1. A ring of five nodes (the same links plus E-A) scores 2. Why?
    options:
      - text: 'In the chain, cutting any single link splits it in two; in the ring, any split cuts at least two links.'
        correct: true
        feedback: |
          Yes. The ring has no single weak link: separating it into two groups means cutting the loop in two places. More alternative routes between the parts means a higher score, which is the idea of integration.
      - text: 'The ring simply has more nodes.'
        feedback: |
          Both have five nodes. The score depends on how the nodes are connected, not on how many there are.
      - text: 'The ring has a link that the chain lacks, so the score is the number of links.'
        feedback: |
          The score is not a count of links: five links in a ring give 2, and ten links among five nodes give 4. It is the smallest number crossing a split.
    explanation: |
      Integration, here, is the cost of the cheapest way to pull the system apart. This also shows why the quantity is not the same as size or complexity: a long chain is large and has a weak point.

  - type: widget
    id: clusters
    title: "Toy integration: two dense clusters"
    widget: integration-demo
    config:
      nodes: [{label: A, x: 0.1, y: 0.15}, {label: B, x: 0.1, y: 0.85}, {label: C, x: 0.35, y: 0.5}, {label: D, x: 0.65, y: 0.5}, {label: E, x: 0.9, y: 0.15}, {label: F, x: 0.9, y: 0.85}]
      links: [[0,1],[0,2],[1,2],[3,4],[3,5],[4,5],[2,3]]
      show: {cutValue: true, reset: true}
    body: |
      Six nodes: A, B, C all linked together, D, E, F all linked together, and a single link between C and D. Each cluster is highly connected, yet the toy score is low. Find the weakest cut, then add a second bridge between the clusters (for instance B-F) and see what changes.

  - type: numeric
    id: clusters-q
    title: "A second bridge"
    prompt: |
      Two triangles of linked nodes, A-B-C and D-E-F (every pair inside a triangle is linked), joined by one bridge link C-D. The toy integration (smallest number of links crossing a split into two groups) is 1, by cutting the bridge. You add a second bridge link B-F. What is the toy integration now?
    answer: 2
    answerText: '2'
    wrong:
      - value: 1
        feedback: |
          With two bridges, cutting one of them still leaves the other joining the clusters. The weakest split now has to cut both bridges, or isolate a single node.
      - value: 3
        feedback: |
          Isolating a node of a triangle cuts only its two triangle links, plus possibly a bridge; the cheapest split is still smaller than 3.
    hint: 'Try the split of the two triangles, and also the split that isolates one node, and take the smaller.'
    explanation: |
      The split into the two triangles now cuts two links (C-D and B-F). Isolating node A cuts its two links (A-B and A-C), also 2; isolating C cuts C-A, C-B and C-D, which is 3. No split cuts fewer than 2, so the toy integration is 2. The lesson of the picture is that a system can be dense inside and still weakly integrated as a whole: what matters is the weakest cut.

  - type: text
    id: toy-limits
    title: "What the toy leaves out"
    body: |
      Treat the widget as a picture of one idea only. Real $\Phi$ is not a count of links. It uses **directed** causal influences (what the units do to each other's next state, in one direction), the system's own current state, and the structure of causes and effects the system specifies. The links in the widget are undirected, so the toy cannot even tell a feed-forward network from a recurrent one. That is exactly the difference IIT cares most about, and the next card is about it.

  - type: text
    id: predictions
    title: "What IIT says about brains and machines"
    body: |
      IIT says consciousness depends on how a physical system is wired, so it gives verdicts that differ from what behaviour or neuron counts would suggest. According to Tononi and Koch (*Philosophical Transactions of the Royal Society B*, 2015):

      - The **cerebellum** holds about 69 of the brain's 86 billion neurons, yet people who lose much of it have movement problems and not a loss of consciousness. IIT's explanation: its circuitry is made of small modules that work largely independently, so the cerebellum is not one integrated whole. The **cortex**, richly recurrent, is.
      - A **feed-forward** network, in which signals only travel one way from input to output, has no integration of its own, however large. Even one that matched a brain's behaviour exactly would, in their words in essence, be a perfect zombie with $\Phi = 0$.
      - A **digital computer** simulating a brain would, they argue, experience next to nothing: its physical hardware is not wired like the brain, whatever the program does. They add that conscious artifacts could in principle be built with the right physical wiring.
      - Even simple circuits such as a **photodiode** can have a minimal amount of experience (the distinction "this rather than not this").

      Note the layers. That the cerebellum has most of the neurons is established; that IIT's explanation is right is a live debate, and the Stanford Encyclopedia of Philosophy notes that Aaronson and others have contested the cerebellum argument.

  - type: mcq
    id: cerebellum-q
    title: "Why the cerebellum does not count"
    prompt: |
      The cerebellum has most of the brain's neurons, and losing much of it does not remove consciousness. According to integrated information theory, what explains this?
    options:
      - text: 'Its neurons are arranged in small, largely independent modules, so it is not a single integrated whole.'
        correct: true
        feedback: |
          Yes. Number of neurons is not the measure; integration is. A million independent modules is a million small systems, not one large one.
      - text: 'It has fewer neurons than the cortex.'
        feedback: |
          The reverse: the cerebellum holds roughly 69 of the brain''s 86 billion neurons. The explanation must be about how they are connected.
      - text: 'It does not take part in any movement or behaviour.'
        feedback: |
          It is deeply involved in coordinating movement. IIT does not say the cerebellum is useless, only that its function does not come with experience.
    explanation: |
      This is a case where a theory is useful beyond correlation: it explains why a huge, busy part of the brain is not part of the experience, by a feature (wiring) and not by an arbitrary label. Critics ask whether the cerebellum is really so modular, and whether wiring is the right feature.

  - type: mcq
    id: unfolding-q
    title: "Same behaviour, different verdict"
    prompt: |
      Take a recurrent network (signals loop back) and build a feed-forward network that gives exactly the same outputs for every input, by unfolding the loops in time. IIT gives the first a high $\Phi$ and the second $\Phi = 0$. Doerig, Schurger, Hess and Herzog (2019, *Consciousness and Cognition*) argue this unfolding is a problem. What is their point?
    options:
      - text: 'No experiment on behaviour or input-output can tell the two apart, so the claim that one is conscious and the other not cannot be tested that way.'
        correct: true
        feedback: |
          Yes. In essence they argue that theories tied only to causal structure are either false or outside science, since two systems with identical behaviour get different verdicts. IIT defenders reply that this is the point: consciousness belongs to the physical causal structure, not to function.
      - text: 'The feed-forward network will be more conscious than the recurrent one.'
        feedback: |
          IIT says the opposite: the unfolded version has $\Phi = 0$. The objection is about what can be tested, not about reversing the verdict.
      - text: 'Recurrent networks cannot be unfolded in time.'
        feedback: |
          Their argument is that they can, and the unfolded copy reproduces the outputs. That is what makes the verdicts hard to test.
    explanation: |
      It also shows the two ways of seeing the issue. If you think a theory of consciousness must be a theory of what a system does (workspace, higher-order, predictive views), behaviour matters and the unfolding is a counterexample to IIT. If you think it is about what a system physically is, the verdict can differ with no change in behaviour, and the price is that behaviour alone can never settle it.

  - type: text
    id: critics
    title: "The criticisms, and the 2023 letter"
    body: |
      Three lines of criticism are worth keeping apart.

      **Counterintuitive verdicts.** On his blog (21 May 2014), the computer scientist Scott Aaronson argued, using IIT's own measure, that simple systems such as large grids of logic gates (and certain expander graphs) can have very high $\Phi$ while being, he says, obviously not conscious. According to Aaronson, Tononi replied that one must begin from the inside, from the properties of experience, and accepted that a large enough simple arrangement would be conscious. Aaronson found that reply unpersuasive, since a theory built from phenomenology can still be tested against clear cases; others see this as IIT's price for taking experience seriously.

      **Panpsychist-sounding implications.** If a photodiode has a little experience, much matter might. Tononi and Koch reply that IIT says clearly that not everything is conscious, but that it does side with the intuition that experience is widespread among animals.

      **Status as science.** In September 2023, a preprint titled "The Integrated Information Theory of Consciousness as Pseudoscience", with Fleming, Lau and other authors, signed by 124 scholars, argued in essence that the label should apply until the theory as a whole is empirically testable. The authors added that they did not say IIT lacked intellectual merit, and objected to the theory being described in the press as leading or well established. Others, among them David Chalmers and Erik Hoel, called the charge disproportionate. The Cogitate experiment below was part of the background.

  - type: text
    id: cogitate
    title: "A test: Cogitate, IIT against the workspace"
    body: |
      Cogitate was an **adversarial collaboration**: proponents of rival theories agree in advance, in writing, on predictions that each side accepts as a fair test, and a neutral team runs it. Cogitate pitted IIT against the global neuronal workspace theory (the Dehaene and Changeux ignition view from the previous lesson). Its results were published in *Nature* on 30 April 2025 (the Cogitate Consortium, with Lucia Melloni a senior author): 256 participants, three brain-measurement methods (fMRI, MEG and intracranial recording), preregistered predictions.

      What it reported, in essence: information about what people consciously saw appeared in visual, ventrotemporal and inferior frontal cortex. IIT predicted sustained synchronization across the back of the cortex, and that was not found. The workspace theory struggled with a weak ignition at the end of the stimulus and with limited prefrontal representation of some conscious features. The authors say some predictions of each held, key claims of each were challenged, and that the lessons reach other theories sharing the same predictions. IIT's proponents argue that the results still support its central claim about the back of the cortex.

      So the first large adversarial test did not crown a winner. Whether that is a defeat for both theories, or a sign that the predictions tested were not the theories' core, is itself disputed.

  - type: numeric
    id: intractable
    title: "Counting the cuts"
    prompt: |
      To find the weakest cut of a network of $n$ nodes, one tries every way of splitting the nodes into two non-empty groups. Each node goes in one group or the other: $2^n$ assignments. Two of them leave a group empty, and swapping the names of the groups gives the same split, so the number of splits is $2^{\,n-1}-1$. How many splits does a network of 10 nodes have?
    answer: 511
    answerText: '511'
    wrong:
      - value: 1023
        feedback: |
          That is $2^{10}-1$: it counts a split and its mirror image (group names swapped) as different. Divide by two first.
      - value: 1024
        feedback: |
          That is all $2^{10}$ assignments, including the two with an empty group and with every split counted twice.
    hint: 'Remove the two assignments with an empty group, then halve.'
    explanation: |
      $(2^{10}-2)/2 = 511$. Ten nodes are easy; the number doubles with every node added. For a few hundred nodes the count is astronomically large ($2^{301}$ is about $4\times10^{90}$, for a network of only 302 nodes), and for the 86 billion neurons of a human brain it is a number with about 26 billion digits. Tegmark (*PLOS Computational Biology*, 2016) notes that the measure IIT proposes is computationally infeasible for large systems, growing faster than exponentially with the system's information content. And this counts only splits; the real $\Phi$ needs much more at each one. So IIT's measure has been computed only for small systems, and claims about whole brains rest on approximations and arguments. That is a practical barrier to testing, not a refutation.

  - type: text
    id: predictive
    title: "Predictive processing: perception as a controlled hallucination"
    image:
      src: img/seth.webp
      alt: "Photograph of the neuroscientist Anil Seth speaking at a conference"
      caption: "Anil Seth, neuroscientist at the University of Sussex and author of Being You (2021), who connects predictive processing with the experience of being a living body."
      credit: "Carlos Figueroa Rojas, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Congreso_Futuro_-_2019-01-14_-_09.jpg"
    body: |
      A second family says little about wiring and much about what the brain is doing. In **predictive processing**, the brain is a prediction machine: higher levels send down guesses about what the senses should be reporting, and what travels up is only the **prediction error**, the mismatch. Perception is the best guess that keeps the error small. Andy Clark's *Surfing Uncertainty* (Oxford University Press, 2016) presents this view, and Karl Friston's free-energy principle (*Nature Reviews Neuroscience*, 2010) is a mathematical version, in which the brain minimises a bound on surprise. Friston's own title asks whether it is a unified brain theory, with a question mark.

      Anil Seth (*Being You*, 2021) turns it into a view of consciousness. In essence, what we see is the brain's best guess, held in check by the senses: a **controlled hallucination**. The self too is a perception, a guess about the body. His **beast machine** idea says experience is rooted in the brain's job of keeping a living body alive (its heartbeat, temperature, balance), so that being conscious is tied to being alive and not to being intelligent. On that view, a very clever machine would not by that fact be conscious.

      How would it be tested? Predictive processing makes many testable claims about perception (expectations should shape what is seen, errors should be signalled in the brain). The harder part is the extra step to *consciousness*: unconscious perception is also predictive, so the theory needs a further claim about why some predictions are felt.

  - type: mcq
    id: pp-q
    title: "What predictive processing does and does not settle"
    prompt: |
      A critic says: "Predictive processing describes how the brain perceives, but unconscious perception works that way too, so by itself it does not tell us why some of it is experienced." How would a defender such as Seth reply, in essence?
    options:
      - text: 'By adding a claim about what the predictions are for: regulating the living body, so that experience is rooted in being alive.'
        correct: true
        feedback: |
          Yes. The beast machine idea is the extra step: according to Seth, the felt quality of experience comes from predictions about the body's own state, which matter to survival. Whether this closes the explanatory gap or only relocates it is disputed.
      - text: 'By denying that unconscious perception exists.'
        feedback: |
          Seth does not deny unconscious processing. The theory's own claim is that the brain predicts at every level, which is why it needs more than prediction to mark the conscious part.
      - text: 'By agreeing that it is not a theory of consciousness at all.'
        feedback: |
          That is a view some hold, but Seth offers it as a route to a science of consciousness: explain the properties of experience one by one one by one instead of facing the hard problem head on.
    explanation: |
      Compare the other theories on this point. The workspace theory marks the conscious part by broadcasting, IIT by integration, and predictive processing needs its own marker. Each theory's answer to "what is the extra ingredient?" is where it differs from the rest.

  - type: text
    id: orch
    title: "Quantum proposals: Penrose and Hameroff"
    image:
      src: img/hameroff.webp
      alt: "Photograph of Stuart Hameroff at a conference"
      caption: "Stuart Hameroff (born 1947), anesthesiologist at the University of Arizona, who proposed with Roger Penrose that quantum events in neuron microtubules matter for consciousness."
      credit: "Zereshk, CC BY 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Stuart_Hameroff_TASC2008.JPG"
    body: |
      The physicist Roger Penrose argued in *The Emperor's New Mind* (1989) and *Shadows of the Mind* (1994), roughly, from Gödel's incompleteness theorems that human mathematical insight cannot be fully captured by rules a computer follows, so that consciousness involves something **non-computable**. His candidate is a proposed form of wave-function collapse, which he calls objective reduction (OR), neither random nor algorithmic. The anesthesiologist Stuart Hameroff suggested that **microtubules**, tiny protein tubes inside neurons, could host the quantum states involved. Together they built **Orch OR** ("orchestrated objective reduction"): quantum states orchestrated in microtubules collapse by OR, and each collapse is a moment of experience.

      The standard objection is **decoherence**: a quantum superposition is destroyed when it interacts with its warm, wet surroundings, in a time called the decoherence time. In *Physical Review E* (2000) Max Tegmark estimated this time for brain processes at about $10^{-13}$ to $10^{-20}$ seconds, much shorter than the $10^{-3}$ to $10^{-1}$ seconds of neural events, and concluded that the brain's cognitive variables behave classically. Hagan, Hameroff and Tuszynski (*Physical Review E*, 2002) replied that Tegmark modelled a different system than Orch OR, and recalculated times of about $10^{-5}$ to $10^{-4}$ seconds, possibly longer with further effects. Critics find that still too short or the extra mechanisms undemonstrated.

      So the claim is clear, and in principle testable (does quantum coherence survive in microtubules in living neurons long enough to matter?), but it is not an established result, and the Gödel step is itself disputed by logicians and philosophers.

  - type: numeric
    id: orch-q
    title: "Decoherence against neurons"
    prompt: |
      Tegmark's estimate for the decoherence time of a quantum state in a brain process is $10^{-13}$ seconds. A neural event of interest lasts about $10^{-3}$ seconds. The neural event is longer than the decoherence time by a factor of $10^{k}$. What is $k$?
    answer: 10
    answerText: '10'
    wrong:
      - value: 16
        feedback: |
          Sixteen is the sum of the exponents with signs dropped ($13+3$). A ratio of powers of ten subtracts exponents: $10^{-3}/10^{-13}=10^{-3+13}$.
      - value: -10
        feedback: |
          The sign is reversed: the neural event ($10^{-3}$ s) is the longer time, so the ratio of neural time to decoherence time is greater than 1.
    hint: 'Divide: $10^{-3}$ over $10^{-13}$.'
    explanation: |
      $10^{-3}/10^{-13} = 10^{10}$. On Tegmark's estimate the quantum state would be gone ten orders of magnitude before the neural event is over, which is why he treated the brain as classical. Hagan and colleagues' recalculated times of $10^{-5}$ to $10^{-4}$ seconds narrow this gap to about a factor of $10^{1}$ to $10^{2}$ at the end, and they say further effects could close it. That is a quantitative disagreement about a physical number, which is what makes this proposal more testable than many.

  - type: text
    id: compare
    title: "What would count as a test?"
    body: |
      A useful way to compare the rivals is to ask of each: *what finding would count against it?*

      | Theory | Experience is... | A test that could hurt it |
      |---|---|---|
      | IIT | integration in a physical system's causal structure | back-of-cortex activity not showing sustained integration (Cogitate); high $\Phi$ with clear absence of experience |
      | Workspace | broadcast to many specialists | seen stimuli without late, widespread ignition; ignition without report |
      | Predictive processing | the brain's controlled guess, rooted in the body | perception that does not follow expectation; no link of experience to bodily regulation |
      | Orch OR | collapse in microtubules | no quantum coherence in microtubules in living neurons over the needed time |

      The rows differ in how easy the test is. Some, such as the Orch OR coherence question, are sharp but unmet. Some, such as IIT's $\Phi$, are hard to compute and so hard to test directly. Some, such as predictive processing, are well tested for perception but have a gap to experience.

  - type: mcq
    id: faith-q
    title: "Would a winning theory settle whether mind is more than matter?"
    prompt: |
      Suppose a future experiment confirmed one of these theories as the correct account of *which* systems have experience. Does that settle whether mind is more than matter?
    options:
      - text: 'Not by itself: physicalists, dualists and idealists could each accept the same list of which systems are conscious and differ on why.'
        correct: true
        feedback: |
          Yes. A theory that says which physical or functional features go with experience is a theory of correlates and conditions. Whether those features *are* experience, *produce* it, or are *how* something non-physical shows up is the question the hard problem raises. It is a metaphysical commitment, layer three, not a result of the lab.
      - text: 'Yes: it would show that mind is nothing over and above matter.'
        feedback: |
          This overclaims. A physicalist would read the result as support, but a dualist can say the physical features are what experience is correlated with, and an idealist that they are how experience appears. The data fit all three; they differ on interpretation.
      - text: 'Yes: it would show that mind is more than matter, since the theories are so strange.'
        feedback: |
          Strangeness is not evidence. IIT, predictive processing and Orch OR are all proposals about physical or functional features; none of them was built to show an extra non-physical ingredient.
    explanation: |
      Where thoughtful people part ways here is on a premise, not on data: whether explaining which systems are conscious would also explain why it feels like something. The theories can narrow the factual question (what goes with experience) and leave the philosophical one open.

  - type: mcq
    id: traps
    title: "Which statements are fair?"
    multiple: true
    prompt: |
      Select all the statements that are accurate.
    options:
      - text: 'IIT says only biological brains can be conscious.'
        feedback: |
          IIT ties consciousness to a physical system''s causal structure, not to biology. Tononi, in 2004, already said conscious artifacts should be buildable, while arguing that an ordinary digital computer simulating a brain would have next to none.
      - text: 'The weakest-cut quantity $\Phi$ has been computed for human brains with current methods.'
        feedback: |
          It is computationally infeasible for large systems, because the number of cuts alone grows faster than exponentially. Only small systems are computed exactly.
      - text: 'The 2025 Cogitate results matched some predictions of each of IIT and the workspace theory, and challenged key claims of both.'
        correct: true
        feedback: |
          Yes: in essence what the authors report. It did not crown a winner.
      - text: 'Orch OR is an established part of neuroscience.'
        feedback: |
          It is a proposal. The decoherence estimates of Tegmark and of Hagan and colleagues disagree by many orders of magnitude, and no accepted evidence shows the needed coherence in living neurons.
      - text: 'Finding the brain activity that goes with an experience is not yet an explanation of why that activity is experienced.'
        correct: true
        feedback: |
          Yes. A correlate says where to look; a theory says which feature matters; the hard problem asks why that feature should feel like anything. Each step is a different claim.
    explanation: |
      Each wrong option is a common shortcut: IIT is about brains only, the measure is easy, one test has decided between the theories, a proposal is a result, correlation is explanation.

  - type: text
    id: summary
    body: |
      **Next:** the lesson Free Will: if the brain's activity goes with, or is, our experience, what is left of the idea that we choose? what the main philosophical positions say about choice and responsibility, and what experiments can and cannot show about it.
