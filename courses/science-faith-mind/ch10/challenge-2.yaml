id: ch10-challenge-2
title: "Level Challenge: Where Is the Mind? (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: an animal, a choice, a self"
    body: |
      Two more invented cases, in the style of the level. Every animal, lab and number here is made up to practise the method, and the problems are independent, so the toolkit is restated. **Consciousness** means there being something it is like to be the subject.

      - **Markers of experience in animals.** Researchers who ask whether an animal feels pain list markers, none of which proves it alone. Examples: behaviour aimed at the injury, relief when a pain-killing drug is given, learned avoidance of a place, and **motivational trade-off**, where the animal weighs the harm of a stimulus against the value of a reward. A reflex is a fixed response that weighs nothing. The more independent markers an animal shows, the stronger the case.
      - **Theories.** Global workspace theory (GWT, Baars, Dehaene): conscious when a content is broadcast to many processors. Higher-order theories (HOT, Rosenthal): conscious when the owner has a thought that it is in the state. Integrated information theory (IIT, Tononi): conscious when a system's causal structure cannot be cut into independent parts without losing its integration; the lesson's toy score is the smallest number of links crossing any split.
      - **The Libet gap.** Libet (1983) reported a slow signal, the readiness potential (RP), starting about 550 ms before a movement, and the reported urge $W$ about 200 ms before it. With both times counted backwards from the movement, the gap is
      $$G = t_{\text{RP}} - t_{W}$$
      so Libet's gap was $550-200=350$ ms.
      - **Determinism.** $(H \wedge L) \Rightarrow P$: the past $H$ plus the laws $L$ fix the present $P$. Compatibilists (Hume, Frankfurt, Dennett) say free will is acting from one's own reasons without coercion. Libertarians (Kane, Reid, Chisholm) say free will needs a choice not fixed by the past. Hard incompatibilists (Pereboom) say the kind of free will behind deserved blame is lacking either way.
      - **Self.** Locke ties a person to memory, Olson to the living organism, Parfit holds that what matters is connectedness (direct links, such as memories) and continuity (an overlapping chain of them), and Dennett calls the self a centre of narrative gravity.
      - **Three layers:** established fact, live debate, faith or metaphysical commitment.

      Problems 1 to 3 are in part 1. Two problems here.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-setup
    title: "Problem 4 · The lanternfoot"
    body: |
      **Problem 4.** An invented sea animal, the **lanternfoot**, has a small central brain and eight arms, and most of its neurons sit in clusters inside the arms. A team runs a test. The animal lives in a tank with a food chamber at one end. Before each trial the food chamber is heated to a chosen level, and the team records whether the animal enters to eat. They run 120 trials at each heat level.

      | Heat level | Trials it entered (of 120) |
      |---|---|
      | Low | 96 |
      | Medium | 54 |
      | High | 12 |

      The same animal, a different day: the team also notes that a lanternfoot burned on one arm guards and rubs that arm for hours, and that a pain-killing drug dissolved in the water reduces the guarding but not its ordinary swimming. Your task: read what the data can and cannot show, and what each theory would expect.

  - type: mcq
    id: p4-reflex
    title: "Reflex or evidence?"
    prompt: |
      A lanternfoot is tested in a tank. Its arm pulls away at once when touched with a hot probe, even in the first minutes after the arm is cut free of the animal. Which is the best statement about what the *arm-pulling-away* and the *entering table* show about experience?
    options:
      - text: 'The quick pull-away is what a reflex produces, so it is weak evidence. The entering rate falling as the heat rises, and rising again when the reward grows, is stronger evidence, because a fixed reflex does not weigh a harm against a reward.'
        correct: true
      - text: 'Any avoidance of harm proves the animal feels pain, so both show it.'
        feedback: |
          Very simple creatures, and even a severed arm, avoid harm by reflex. Avoidance is what experience would produce, but it is also what a mechanism produces, so it does not tell the two apart.
      - text: 'A cut arm pulling away shows the animal has no experience, since the brain is not involved.'
        feedback: |
          A reflex in an arm does not show that there is no experience elsewhere in the animal. It simply fails to tell us either way, which is why a stronger marker is needed.
      - text: 'Neither shows anything, because behaviour can never bear on experience.'
        feedback: |
          Behaviour is the evidence available for animals, and markers add up. The difficulty is that each one is compatible with a mechanism, not that behaviour is irrelevant.
    explanation: |
      Markers are ranked by how hard they are to explain with a fixed response. A reflex is fast and fixed. Weighing harm against reward, with a graded response, is flexible, which is why researchers treat trade-off as a more telling marker than withdrawal.

  - type: numeric
    id: p4-pay
    title: "How often does it pay the cost?"
    prompt: |
      In the lanternfoot test, the animal entered the heated food chamber in 54 of 120 trials at the Medium heat level. As a percentage of the 120 trials, how often did it pay the cost of the heat? Give a number between 0 and 100.
    answer: 45
    tolerance: 0.01
    answerText: '45'
    wrong:
      - { value: 55, feedback: 'That is the share of trials in which it did not enter (66 of 120). The question asks for the trials in which it entered.' }
    hint: The share is the number of trials it entered divided by the number of trials, times 100.
    explanation: |
      The share is

      $$p=\frac{k}{n}=\frac{54}{120}=0.45$$

      so 45%. At Low heat it is 96/120 = 80% and at High heat 12/120 = 10%: the rate falls step by step as the cost rises, which is what weighing a cost against a reward looks like.

  - type: numeric
    id: p4-boost
    title: "What does a bigger reward do?"
    prompt: |
      At the High heat level the lanternfoot entered in 12 of 120 trials with the usual food. When the team doubled the food, it entered in 42 of 120 trials. By how many **percentage points** did doubling the reward raise the share of trials in which it paid the cost?
    answer: 25
    tolerance: 0.01
    answerText: '25'
    wrong:
      - { value: 30, feedback: 'That is the rise in the number of trials (42 minus 12). The question asks for the rise in the share of the 120 trials, in percentage points.' }
    hint: Turn both counts into a percentage of 120 first, then subtract.
    explanation: |
      The shares are $12/120=10\%$ and $42/120=35\%$, so the rise is $35-10=25$ percentage points. The rate moved with the size of the reward, not only with the heat: the choice is graded in both. A fixed reflex would not respond to the amount of food.

  - type: mcq
    id: p4-markers
    title: "Which findings would add to the case?"
    multiple: true
    prompt: |
      Researchers who ask whether an animal feels pain add up independent markers. Select **all** the findings below about a lanternfoot that would count as a marker of the kind described in the toolkit.
    options:
      - text: 'It guards and rubs an injured arm for hours afterwards.'
        correct: true
        feedback: |
          Yes. Behaviour directed at the injury, lasting long after the stimulus, is harder to explain as a one-off reflex.
      - text: 'A pain-killing drug reduces the guarding but leaves ordinary swimming unchanged.'
        correct: true
        feedback: |
          Yes. If a drug that relieves pain in other animals changes just the injury-directed behaviour, this fits a state that the drug acts on. It is still a marker, not a proof.
      - text: 'After one burn in a place, it avoids that place on later days even when food is there.'
        correct: true
        feedback: |
          Yes. A learned avoidance that outlasts the stimulus, and is balanced against food, goes beyond a fixed reflex.
      - text: 'A cut-off arm curls away from a pinch in the first minutes.'
        feedback: |
          This is what a reflex arc in the arm produces and says nothing either way about experience in the animal.
      - text: 'It has a very large number of neurons.'
        feedback: |
          Neuron counts are not a marker. Large numbers sit in organs with no sign of experience, and none of the three theories uses a count.
    explanation: |
      A marker is a finding that is hard to explain by a fixed mechanism and fits an experience of the harm. Each marker is open to a mechanical reading, which is why the case grows with their number and independence, and why none of them settles the matter alone.

  - type: mcq
    id: p4-theories
    title: "A distributed nervous system, three theories"
    prompt: |
      The lanternfoot has most of its neurons in the arms, linked to the central brain and to one another. Which is the best statement of what each theory would ask about it? (Wording is conditional because the animal is invented and the theories are contested.)
    options:
      - text: 'GWT would ask whether contents from the arms and the senses are broadcast to many processors in one workspace. HOT would ask whether the animal has states that represent its own states, which is more demanding. IIT would ask how tightly the parts act on one another, so that it cannot be cut into independent pieces.'
        correct: true
      - text: 'All three would say that arms with their own neurons make the animal conscious, because they count neurons.'
        feedback: |
          None of the theories counts neurons. Each names a different feature: broadcast, a thought about one's own state, integration.
      - text: 'All three would deny experience to any animal whose neurons are not mostly in one brain.'
        feedback: |
          The theories ask about broadcast, higher-order representation and integration, not about where the cell bodies sit. A distributed system could in principle have them.
      - text: 'GWT and IIT would say yes, HOT would say no, because only humans can think about their own states.'
        feedback: |
          Whether a given animal has any higher-order representation of its own states is an empirical question, and HOT versions differ on how demanding they are. The statement settles by decree what the theory leaves open.
    explanation: |
      The same animal sets three different tests. The verdicts depend on findings not yet in: whether the arms broadcast to a common workspace, whether the animal represents its own states, and how strongly the parts depend on one another. The theories disagree about what matters, and the animal does not decide between them.

  - type: mcq
    id: p4-arms
    title: "How many subjects?"
    prompt: |
      Suppose later work shows that the lanternfoot's arms are linked to each other and to the central brain only by weak connections, and that an arm trained to avoid heat does not pass the lesson to the other arms. Which is the fairest conclusion?
    options:
      - text: 'The toy integration idea says weak links across a cut give a low score for the whole, and a workspace view says there is little broadcast across the arms. This raises the question, as in the split brain, of one subject or several, and the data alone do not decide it.'
        correct: true
      - text: 'Each arm is a separate conscious subject.'
        feedback: |
          The finding fits that reading, but it also fits a single subject with a loose body plan, or no subject at all. How many subjects there are depends on a theory of what a subject is.
      - text: 'The animal is a single subject, since it has one body.'
        feedback: |
          One body does not settle the number of subjects. A split-brain patient has one body too, and researchers still disagree about one subject or two.
      - text: 'The finding shows the animal has no experience at all.'
        feedback: |
          Weak links between the parts count against a unified experience, not against any experience. Each part, or the central brain alone, might still have it on some views.
    explanation: |
      Distributed nervous systems bring back the question raised by the split brain: whether there is one subject, none, or several. The findings tell us how the parts depend on one another, and the count of subjects needs an account of what a subject is.

  - type: mcq
    id: p4-declaration
    title: "What does a famous statement show?"
    prompt: |
      In 2012 a group of neuroscientists meeting in Cambridge signed a public declaration that the weight of evidence indicates humans are not unique in having the neurological substrates that generate consciousness, and it named octopuses among the animals that have them. Which reading is right?
    options:
      - text: 'It is an expert statement of a scientific judgement, which is a live debate and not a measurement. It speaks of the neural substrates, and it does not say that every behaviour of every such animal is felt.'
        correct: true
      - text: 'It is an established fact, since scientists signed it.'
        feedback: |
          A signature records a judgement. The underlying observations are facts; the step from them to experience is the part people dispute.
      - text: 'It is a faith claim, because nobody can observe an animal''s experience.'
        feedback: |
          That overstates the point. It is a judgement from evidence (neural and behavioural), which one can argue with by pointing to a premise, so it is not a mere article of faith.
      - text: 'It proves that the animal in Problem 4 is conscious.'
        feedback: |
          The lanternfoot is invented, and a general statement about a group of animals cannot settle a particular case without the case's own evidence.
    explanation: |
      Distinguish the observations (neural features, behaviour), the judgement drawn from them (a live debate), and the metaphysical question of what experience is. The statement lives in the middle layer, so it can be weighed and challenged, and it does not close the question.

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-setup
    title: "Problem 5 · The button study"
    body: |
      **Problem 5.** An invented lab repeats a study of the Libet type. Volunteers watch a fast clock and press a button whenever they feel like it. Afterwards they report where the clock hand was when they first felt the urge to press. Times are counted backwards from the press, so a larger number is earlier. The team records the slow signal from the scalp (the RP) and finds it begins **640 ms** before the press, while the volunteers place the urge at **170 ms** before the press.

      Then a second team runs a different version: volunteers choose left or right, and a classifier trained on brain activity predicts the choice before the volunteers report having chosen. In 200 trials it is right 126 times, where pure guessing gives 100 on average.

      Your task: read the numbers, then the readings that different schools give to the same result, and who it is that is choosing.

  - type: numeric
    id: p5-gap
    title: "The gap"
    prompt: |
      In the button study the RP begins 640 ms before the press and the reported urge is 170 ms before the press (both counted backwards from the press). What is the gap $G=t_{\text{RP}}-t_W$ in milliseconds?
    answer: 470
    tolerance: 0.01
    answerText: '470'
    wrong:
      - { value: 810, feedback: 'That adds the two times. Both are measured from the press, so the gap between them is their difference.' }
    hint: Both times are measured from the press. The gap is how much earlier the signal starts than the urge.
    explanation: |
      Both times are counted backwards from the press, so

      $$G=t_{\text{RP}}-t_{W}=640-170=470\ \text{ms}$$

      The signal starts 470 ms before the volunteers place the urge. Libet's 1983 values give 350 ms, so this invented study has a longer gap.

  - type: numeric
    id: p5-error
    title: "How safe is the gap against a clock error?"
    prompt: |
      A critic notes that reporting the clock-hand position can be off by up to 50 ms either way. The RP time is not in doubt. What is the **smallest** gap $G$ in milliseconds that is still consistent with the report?
    answer: 420
    tolerance: 0.01
    answerText: '420'
    wrong:
      - { value: 520, feedback: 'That is the largest gap. The smallest gap comes from the urge being as early as the error allows (220 ms before the press), which brings it closer to the RP.' }
    hint: The gap is smallest when the urge really happened as early as the error allows.
    explanation: |
      If the true urge was 50 ms earlier than reported, it was $170+50=220$ ms before the press, and

      $$G=640-220=420\ \text{ms}$$

      The gap shrinks but does not close. A timing error of this size would not by itself erase it, so critics turn to other replies: what the signal means, and what the report measures.

  - type: numeric
    id: p5-soon
    title: "How far above guessing is the classifier?"
    prompt: |
      A classifier predicts a left or right choice in 200 trials and is right 126 times. If it guessed, it would be right in 100 of 200 on average. How many correct predictions per 200 trials does it get **above** chance?
    answer: 26
    tolerance: 0.01
    answerText: '26'
    wrong:
      - { value: 63, feedback: 'That is its accuracy in percent (126/200). The question asks for the number of extra correct predictions beyond the 100 expected by chance.' }
    hint: Subtract the number expected by guessing from the number it got right.
    explanation: |
      The classifier is right $126/200=63\%$ of the time, and chance gives 50%. The excess is

      $$126-100=26$$

      correct predictions per 200 trials. That is above chance and far from certain: the activity shifts the odds of the choice and does not fix it.

  - type: mcq
    id: p5-soonmcq
    title: "What does a 63% prediction show?"
    prompt: |
      Which is the fairest description of what a classifier that predicts a left or right choice 63% of the time, before the volunteer reports choosing, shows?
    options:
      - text: 'Early brain activity carries some information about the coming choice and tilts the odds. It does not show that the choice was fixed, since the prediction fails about a third of the time.'
        correct: true
      - text: 'It shows that the choice was made unconsciously, 100% fixed, before the volunteer was aware of it.'
        feedback: |
          A 63% hit rate is not 100%. A fixed choice would be predicted every time, apart from measurement noise, and the authors of the original study themselves said such work does not settle the free-will question.
      - text: 'It shows nothing, since 63% is close to guessing.'
        feedback: |
          With 200 trials, 126 hits is well above the 100 expected from guessing, so there is real information. The difficulty is in what it means, not whether it exists.
      - text: 'It shows that the volunteer was consciously deciding earlier than reported.'
        feedback: |
          The classifier reads brain activity and not conscious decisions. Nothing in the result says when, or whether, an earlier conscious decision occurred.
    explanation: |
      Prediction above chance is evidence of an earlier influence on the choice. The size of the hit rate bears on how strong the influence is, and the philosophical reading still requires a premise about what an influence of that kind implies.

  - type: mcq
    id: p5-schurger
    title: "Reading the signal differently"
    prompt: |
      Schurger, Sitt and Dehaene (2012) modelled the movement as the moment when a randomly fluctuating brain signal drifts up to a threshold. How does this change the reading of the RP in the button study?
    options:
      - text: 'When trials are averaged backwards from the press, the fluctuations that happen to cross the threshold produce a slow rising curve like the RP, even if no decision had been made earlier. The signal need not be a decision under way.'
        correct: true
      - text: 'It shows that the RP does not exist.'
        feedback: |
          The curve is there in the averaged data. The proposal concerns what it means, not whether it is recorded.
      - text: 'It shows that the volunteers consciously decided at the start of the RP.'
        feedback: |
          The model says the opposite of a hidden early decision: the build-up can come from noise and averaging, and the choice is closer to the crossing itself.
      - text: 'It shows that determinism is true.'
        feedback: |
          The model concerns how the average is shaped and not the laws of nature. It is silent about determinism.
    explanation: |
      On this reading the 470 ms gap is not an early decision that the person learns about late. It is a feature of how a set of noisy trials is lined up. The reply is a model and not a final answer: other work has tested it, and the debate remains open.

  - type: order
    id: p5-order
    title: "Order the assessment"
    prompt: |
      Put in a sensible order the steps for assessing a claim such as "a brain signal shows the decision was made before you knew it".
    steps:
      - 'State the measurement: the signal starts 470 ms before the press and the urge is reported 170 ms before it.'
      - 'Check how the urge time was measured and how large its error could be.'
      - 'Ask whether the signal is a decision under way or a feature of noise and averaging.'
      - 'State the premise the philosophical reading needs, for example that the conscious urge must come first to count as free.'
      - 'Name the layer of each claim: fact, live debate or metaphysical commitment.'
    hint: Go from what was measured to what is claimed about it, and end by sorting the claims.
    explanation: |
      Measurement comes first, then the reliability of the measurement, then the interpretation of the signal, then the premise that turns a finding into a verdict about free will, and finally the layer of each step. Skipping to the premise is how a measurement is made to carry more than it can.

  - type: mcq
    id: p5-readings
    title: "One result, three readings"
    prompt: |
      Take the result as stated: a brain signal begins before the reported urge. Which is a fair match of reading to school?
    options:
      - text: 'A compatibilist says the result is not a threat, since the signal is part of the person''s own reasoning and free will is acting from one''s own reasons. A libertarian says it threatens free will only if the signal fixes the choice, and the 63% shows it only tilts the odds. A hard incompatibilist says it adds little, since on their view the free will behind deserved blame is lacking whether the brain is deterministic or not.'
        correct: true
      - text: 'A compatibilist says the result shows there is no free will; a libertarian says it shows there is; a hard incompatibilist says it is irrelevant to everything.'
        feedback: |
          Compatibilists hold that free will survives a prior cause, so the result does not refute it for them. Libertarians do not say the result proves free will, and hard incompatibilists do not call it irrelevant to everything.
      - text: 'All three say the result decides the question, and differ only in which side they take.'
        feedback: |
          The three schools disagree before any data arrives, about what free will requires. The result bears on it differently, depending on the requirement.
      - text: 'A libertarian says the result is irrelevant, since free will is a matter of faith and not of evidence.'
        feedback: |
          Many libertarians, such as Kane, work with the science and claim that some choices are undetermined. They say the result must show a fixing of the choice to count against them.
    explanation: |
      The result is the same for all three schools. What it means depends on what each takes free will to require: not being coerced, being undetermined, or being the ultimate source. This is why the debate continues with the data in hand.

  - type: mcq
    id: p5-self
    title: "Who is choosing?"
    prompt: |
      Someone concludes from the button study: "My brain decided before I did." What does the sentence quietly assume about the self?
    options:
      - text: 'That "I" am something apart from the brain processes, an inner observer who should have come first, so that the brain beat me to it. Animalism, Parfit''s view and Dennett''s each deny this in their own way.'
        correct: true
      - text: 'That my memories are connected over time.'
        feedback: |
          That is Parfit's theme, but the sentence does not assume it. It places the brain on one side and 'I' on the other.
      - text: 'That the signal was measured correctly.'
        feedback: |
          That is a premise of the data, and a fair thing to check. The sentence's quiet assumption concerns what the self is.
      - text: 'That animals have no self.'
        feedback: |
          The sentence says nothing about animals. Its hidden assumption concerns what 'I' refers to.
    explanation: |
      If I am the living organism (Olson), the brain activity before the urge is me beginning to act. If I am a chain of connected psychological states (Parfit), the earlier states belong to the same chain. If the self is a centre of narrative gravity (Dennett), there is no inner observer whom the signal could have beaten. The worry is strongest for a view in which the self is a separate watcher of the brain.

  # ---------------- Final weighing ----------------
  - type: mcq
    id: final-weigh
    title: "Weighing the two problems"
    prompt: |
      Problems 4 and 5 each had a clear measured result: a graded trade-off in the animal, and a signal before the reported urge. Which is the fairest summary of what they show together?
    options:
      - text: 'In each case the marker is real and measurable, but the step from the marker to a conclusion (the animal feels, free will is an illusion, the self is not what it seems) needs a premise from a theory, and thoughtful people differ on the premise.'
        correct: true
      - text: 'The animal feels pain, free will is an illusion and the self is a fiction; the data settle all three.'
        feedback: |
          Each of the three needs a premise beyond the data: a theory of consciousness for the first, a view of what free will requires for the second, an account of the self for the third.
      - text: 'None of the three has any evidence at all, since experience cannot be measured.'
        feedback: |
          There are markers and signals, and they are evidence. They bear on the answer differently depending on the theory.
      - text: 'The animal feels pain and free will is real; only the self is open.'
        feedback: |
          Neither of the first two is settled by the data. Choosing which to count as closed and which as open is itself a judgement that needs a reason.
    explanation: |
      The method is the same in both problems: find the measured result, find the premise that links it to the philosophical conclusion, and say where people part ways and why. Doing this keeps the facts, the debate and the commitments separate.

  - type: mcq
    id: sort-against
    title: "Which finding would count against which view?"
    multiple: true
    prompt: |
      Every view should say what would count against it. Select **all** the pairs in which the finding would, if established, count against the view named.
    options:
      - text: 'GWT: an animal verified as feeling pain on independent grounds, with no sign of any broadcast-like event in its nervous system.'
        correct: true
        feedback: |
          Yes. GWT ties experience to broadcast, so verified experience without it would be a counterexample.
      - text: 'IIT: a tightly integrated network verified, on independent grounds, as having no experience at all.'
        correct: true
        feedback: |
          Yes. IIT ties experience to integration, so a highly integrated system without any would count against it.
      - text: 'Libertarian free will: a demonstration that every choice, including hard ones the person agonises over, is fixed by the earlier state of the brain.'
        correct: true
        feedback: |
          Yes. The libertarian needs some choices not fixed by the past, so such a demonstration would be a direct counterexample.
      - text: 'Compatibilism: a prior brain event that raises the chance of the choice.'
        feedback: |
          Compatibilists expect brain events before choices. Their claim is that free will is acting from one's own reasons, which such an event does not remove.
      - text: 'Any theory of animal experience: a lanternfoot that trades off harm against reward.'
        feedback: |
          Trade-off is a marker. A marker does not count against a theory unless the theory forbids it, and none of the three does.
    explanation: |
      A view is hurt by a finding about the very feature it makes central: broadcast, integration, an undetermined choice. A finding that every view can absorb, such as a trade-off or a prior brain event, does not separate them.

  - type: mcq
    id: sort-layers
    title: "Sort the claims by layer"
    prompt: |
      Which assignment of layers is right? (a) "In studies of the Libet type, a slow signal begins hundreds of milliseconds before the reported urge." (b) "That signal is the brain starting to make the decision." (c) "Free will is possible only for a self that is more than its brain."
    options:
      - text: '(a) established fact, as reported by the researchers; (b) live debate, since the noise-and-averaging reading disputes it; (c) faith or metaphysical commitment, a premise that compatibilists and others reject.'
        correct: true
      - text: '(a) live debate; (b) established fact, since it follows from (a); (c) established fact, since the libertarian view is established.'
        feedback: |
          The recording in (a) is the fact. (b) is an interpretation that one model explicitly challenges, so it cannot be a fact. (c) is a claim about what the self is, which no experiment decides.
      - text: 'All three are established facts, since they come from the same experiment.'
        feedback: |
          One experiment gives a measurement. The readings of it and the metaphysical premises that go with them belong to other layers.
    explanation: |
      The layers show what would settle each sentence: a replication for (a), a test that separates the readings of the signal for (b), and for (c) an argument about premises, since no recording decides it.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **An animal.** Experience in an animal is argued from markers: behaviour directed at an injury, relief by a drug, learned avoidance, and motivational trade-off. With $k$ trials entered out of $n$,
      $$p=\frac{k}{n}$$
      and in the invented lanternfoot test $54/120=45\%$ at medium heat and a doubled reward at high heat raised the share from $10\%$ to $35\%$, a rise of $25$ percentage points. A graded response is stronger evidence than a reflex. A global workspace view asks about broadcast, a higher-order view about a thought concerning one's own state, and integrated information theory about how tightly the parts act on one another. A distributed body, as in the split brain, raises the question of one subject or several.
      - **A choice.** The gap between the readiness signal $t_{\text{RP}}$ and the reported urge $t_{W}$, both counted backwards from the press, is
      $$G=t_{\text{RP}}-t_{W}$$
      which was $640-170=470$ ms in the invented study (and $350$ ms in Libet's 1983 values). A clock error of $50$ ms leaves it at least $420$ ms. A classifier right $126$ of $200$ times is $26$ above chance: it tilts the odds and does not fix the choice. Schurger and colleagues propose that the average of noisy trials can make a ramp without an early decision.
      - **Three schools, one result.** A compatibilist counts acting from one's own reasons as free will, so a prior brain event is no threat. A libertarian needs some choice not fixed by the past, so the result matters only if it shows every choice fixed. A hard incompatibilist holds that the free will behind deserved blame is lacking either way.
      - **Who chooses.** "My brain decided before I did" assumes an inner observer apart from the brain. The organism view (Olson), Parfit's chain of connected states and Dennett's centre of narrative gravity each reject it, in different ways.
      - **Method.** Find the measured result, find the premise that links it to the conclusion, say which finding would count against each view, and name the layer of each claim: fact, live debate or metaphysical commitment.

      **Next:** the Level Review comes up automatically, followed by the Level 10 audit. Level 11, Altered States of Mind, asks what meditation, psychedelics, trance and reports of the paranormal show about the mind, and how to examine extraordinary claims.
