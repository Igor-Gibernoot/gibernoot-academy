id: ch10-machines
title: "Could a Machine Be Conscious?"
kind: concept
own: |
  The setting: a computer program, or a robot, that answers questions as fluently as a person. The question is whether there is something it is like to be that system (**consciousness**, in the sense of experience), and what we would have to know in order to say.
  - **Functionalism.** According to Hilary Putnam (1960s), a mental state is defined by its causal role, what it does within the system, and not by what the system is made of. Since the same role can be played by different materials (multiple realisability), a silicon system with the right organisation would have the same mental states:
  {{ $$\text{same function}\ \Rightarrow\ \text{same mental state}$$ }}
  - **Turing test.** According to Alan Turing (1950), the question "can machines think?" can be replaced by the imitation game, in which an interrogator talks by text to a person and a machine and tries to tell them apart. Critics reply that behaviour is evidence of intelligence only if nothing else could produce it, and that it says nothing direct about experience.
  - **Chinese room.** According to John Searle (1980), a person who follows English rules to shuffle Chinese symbols can give correct Chinese answers and still understand no Chinese, so
  {{ $$\text{syntax}\ \not\Rightarrow\ \text{semantics}$$ }}
  where syntax means rules about the shapes of symbols and semantics means their meaning. The systems reply says the whole room understands; Searle answers that he could memorise the rules and still not understand. The robot reply says that adding sensors and a body would supply meaning; Searle answers that the inputs are still only symbols.
  - **Biological naturalism.** According to Searle, brains cause minds through their specific biological powers, and a computer running a program only simulates them. Integrated information theory agrees in outcome by another route: Tononi and Koch expect a conventional digital computer to have very low $\Phi$ (the integration of the system's causes and effects) whatever program it runs. Global workspace and higher-order theories, in contrast, look at how information is organised, so they allow a machine that has the right architecture.
  - **Replacement.** In Chalmers's thought experiment (1995), neurons in a brain are replaced one by one by chips that do the same job. If experience faded while behaviour stayed the same, the person would be wrong about their own experience; Chalmers finds this implausible and argues that
  {{ $$\begin{gathered}\text{same organisation}\\ \Rightarrow\ \text{same experience}\end{gathered}$$ }}
  He says the argument is not a proof, and a biological naturalist can reject its starting assumptions.
  - **Present AI.** The 2023 report by Butlin, Long and co-authors derived $14$ indicator properties from leading theories and concluded that no current AI system is conscious, and that there are no obvious technical barriers to building systems that meet the indicators. Fluent reports from a system trained on human text are weak evidence, because it would produce such reports whether or not it had experience.
  - **Open.** Each view says what would count against it. Functionalism is challenged by a system that matches a brain's organisation and clearly lacks experience, biological naturalism by an artificial system whose experience is established by independent grounds. The disagreement is about premises and not about data.
cards:
  - type: mcq
    id: hook
    title: "Guess: does it feel anything?"
    prompt: |
      A computer program talks about its day, says it feels lonely when nobody writes to it, and answers every follow-up question as a thoughtful person would. Guessing is the point here; no theory yet. Does the program feel anything?
    options:
      - text: 'No: it only produces words, however good, and words are not feelings.'
        feedback: |
          This is a serious view with strong defenders. Notice what it assumes: that producing the right words is something that could happen with no experience behind it.
      - text: 'Yes: if it behaves in every way as a feeling being does, there is nothing more to ask for.'
        feedback: |
          This is also a serious view. Notice what it assumes: that feeling is nothing over and above the right behaviour, or the right working inside.
      - text: 'It depends on what feeling requires, and thoughtful people disagree on that, so the first job is to say what each view requires.'
        correct: true
        feedback: |
          Yes. The answer turns on what experience depends on: the material, the pattern of what the system does, the way it is built, or something else.
    explanation: |
      The lesson takes each view in the form its defenders would accept, and asks what it needs for consciousness and what would count against it. It does not say which is right.

  - type: text
    id: recall
    title: "Recall: what we have so far"
    body: |
      From the lesson Souls, Afterlife and Rebirth: mental life depends on the brain in this life, since anaesthesia and brain damage switch it off or change it. Plato's soul is separable from the body, while Aristotle's soul is the form of the body, its organisation, as a shape belongs to bronze. This lesson asks the question that follows: does experience depend on the material of the brain, or on the pattern of what it does?

      From the lesson The Hard Problem: **experience** is what it is like to see red or feel pain, and the hard problem asks why physical processes come with it.

      From the lesson Global Workspace and Higher-Order Theories: global workspace theory says a content is conscious when it is broadcast to many specialist processes, and higher-order theories say a state is conscious when its owner has a thought that they are in it. Both look at how information is used.

      From the lesson Integrated Information and Other Rivals: integrated information theory says a system is conscious to the degree that it is integrated, so that every cut into independent pieces loses much. A feed-forward network or a cerebellum scored low, however well it performs.

  - type: text
    id: functionalism
    title: "Functionalism: the mind as what a system does"
    body: |
      Why not think that a mind is a kind of material? In the 1960s Hilary Putnam (1926-2016) argued against that. Take pain. Humans feel it, and an octopus very probably does too, with a very different nervous system. If pain were one particular brain chemistry, only creatures with that chemistry could feel it. Putnam's reply, in "Psychological Predicates" (1967), was that **pain is defined by its role**: what causes it (damage), what it causes (avoidance, a cry, a wish for it to stop) and how it links to other states. Many different materials could fill that role. This is **multiple realisability**: one mental state, many possible physical bodies.

      This view is **functionalism**. It is where the whole question of machine minds begins, because if a mind is the right organisation of causes and effects, then neurons are not the only thing that could carry it. A silicon system with the same organisation would have the same mental states. Notice what is being claimed: not that any computer is conscious, but that the *kind* of material is not what matters. Putnam himself later gave this view up.

  - type: mcq
    id: functionalism-q
    title: "Same role, different stuff"
    prompt: |
      A functionalist about mind says that being in pain is whatever plays the pain role in a system (caused by damage, causing avoidance and distress). Which statement follows from this view?
    options:
      - text: 'Any system that says "ouch" when it is hit is in pain.'
        feedback: |
          Saying "ouch" is one tiny part of the role. The role is the whole pattern of causes and effects inside the system, and a recording that plays "ouch" has almost none of it.
      - text: 'Only a system made of neurons can be in pain, because the role is defined by neurons.'
        feedback: |
          This is what the view denies. The role is described by what the parts do, and it does not name the material.
      - text: 'A system built of different material, but with the same organisation of causes and effects, would be in pain too.'
        correct: true
        feedback: |
          Yes. This is multiple realisability: the mental state is fixed by the role, so any material that fills the role gives the state.
    explanation: |
      Functionalism makes the material irrelevant and the organisation decisive. That is why it is the starting point for asking whether a machine could have a mind.

  - type: text
    id: turing
    title: "Turing: replace the question with a game"
    image:
      src: img/turing.webp
      alt: "Black and white studio portrait photograph of Alan Turing"
      caption: "Alan Turing (1912-1954), a British mathematician, proposed his imitation game in a paper published in the journal Mind in 1950."
      credit: "Elliott & Fry, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Alan_Turing_(1951).jpg"
    body: |
      In "Computing Machinery and Intelligence" (*Mind*, 1950), Alan Turing set aside the question "can machines think?" as too vague to argue about and offered a game in its place. An interrogator, in a separate room, types questions to two hidden players, a person and a machine, and must decide which is which. The machine wins if it is taken for the person. Turing predicted that in about fifty years machines would play so well that an average interrogator would have no more than a 70 percent chance of identifying the machine after five minutes of questions.

      The **Turing test** has a clear strength: it makes the question public and testable, and it stops us from ruling machines out merely because they are made of metal. It also has a limit that follows from the hook. The test looks only at behaviour, and what we asked at the start was whether there is something it is like to be the machine. A critic says that behaviour is evidence of a mind only when nothing else could produce it, and a program could be built to produce the right words by means that have nothing to do with understanding.

  - type: mcq
    id: turing-q
    title: "What does passing show?"
    prompt: |
      A program passes a long Turing test: no interrogator can tell it from a person. Which conclusion does the test, by itself, support?
    options:
      - text: 'The program is conscious, since consciousness is just good conversation.'
        feedback: |
          Some functionalists would hold something close to this, but the test itself does not say it. It measures conversation, and whether conversation is all there is to consciousness is exactly what is in dispute.
      - text: 'The program is not conscious, since it is a machine.'
        feedback: |
          This reasons from the material. The test shows nothing about whether being a machine rules out experience; that is the question, not an answer to it.
      - text: 'The program behaves as a person does in conversation. Whether that behaviour comes with understanding or experience is a further question the test does not settle.'
        correct: true
        feedback: |
          Yes. The test gives good evidence of conversational ability, and it leaves open whether anything is felt. Whether behaviour is enough is a premise one accepts or rejects.
    explanation: |
      Turing wanted to replace the question about thinking with one about behaviour. Whether that replacement loses what we cared about is the point at which functionalists and their critics part.

  - type: text
    id: searle
    title: "Searle's Chinese room"
    image:
      src: img/searle.webp
      alt: "Photograph of John Searle speaking at a lectern, in a talk at Google"
      caption: "John Searle (1932-2025), who taught at the University of California, Berkeley, published the Chinese room argument in the journal Behavioral and Brain Sciences in 1980."
      credit: "FranksValli, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:John_Searle_speaking_at_Google_2.jpg"
    body: |
      In "Minds, Brains, and Programs" (1980), John Searle aimed at the claim that running the right program is enough for a mind. Picture a person who understands no Chinese, shut in a room with boxes of Chinese symbols and a book of rules, written in English, for putting symbols together. Slips of Chinese questions come in; by following the rules the person passes back slips of Chinese answers. To someone outside the room the answers are those of a fluent speaker. Inside, the person understands nothing: they only match shapes.

      Searle draws the general point: **syntax**, the rules about the shapes of symbols, is not enough for **semantics**, what the symbols mean. A computer program is only syntax. So, he argues, running a program cannot be enough for understanding, whatever the program does. The target is the view that the right program is a mind, and not the claim that machines could never be conscious.

  - type: mcq
    id: room-q
    title: "What is the point of the room?"
    prompt: |
      In Searle's Chinese room, the person follows English rules to answer Chinese questions correctly and understands no Chinese. Which premise does the argument most need?
    options:
      - text: 'Anything that gives correct answers must understand the language.'
        feedback: |
          This is what the argument attacks. The room gives correct answers by assumption, and the claim is that understanding is still missing.
      - text: 'What the person in the room lacks is what the program, which is only rules about symbol shapes, would also lack.'
        correct: true
        feedback: |
          Yes. The argument works by saying the person does everything the program does, so if the person understands nothing, the program alone does not understand either. A critic can reject that step, which the next card does.
      - text: 'Machines made of silicon can never be conscious.'
        feedback: |
          The argument does not go that far. It concerns a program, which is syntax. Searle allowed that something built to have the brain's causal powers could think.
    explanation: |
      The argument is a claim about programs, not about all machines. It stands or falls on whether the person in the room really does everything the program does.

  - type: text
    id: replies
    title: "Two replies and Searle's answers"
    body: |
      Many objections have been made. Two are standard.

      The **systems reply** grants that the person does not understand Chinese, but says the person is only one part. The whole system, person, rulebook, boxes of symbols and scratch paper together, understands, as no single neuron understands English although a brain does. Searle answers that the person could memorise the rules and the symbol boxes and do it all in the head, and still would not understand Chinese; the system is then just the person.

      The **robot reply**, defended by Jerry Fodor, grants that symbols alone are not enough and adds a body: put the computer in a robot with cameras and motors, so that the symbols are linked to things in the world. Searle answers that the inputs from the camera are only more symbols for the person in the room to shuffle, so nothing changes.

      Both replies still have defenders and critics, and neither is regarded as settling the matter.

  - type: mcq
    id: replies-q
    title: "Which reply is it?"
    prompt: |
      A critic of Searle says: "Understanding Chinese was never supposed to be in the person alone. It belongs to the whole arrangement of person, rules and symbols working together." Which reply is this, and what is Searle's standard answer?
    options:
      - text: 'The robot reply; Searle answers that sensors give only more symbols.'
        feedback: |
          The robot reply adds a body with sensors. This critic adds nothing, and instead moves understanding from the part to the whole.
      - text: 'The systems reply; Searle answers that the person could memorise everything and still not understand.'
        correct: true
        feedback: |
          Yes. The systems reply puts understanding in the whole, and Searle's answer is that the whole can be taken inside the person.
      - text: 'The systems reply; Searle answers that systems cannot exist.'
        feedback: |
          Searle does not deny that the system exists. He denies that it understands anything the person does not.
    explanation: |
      The two replies pull in different directions: one widens what counts as the thinker, the other adds a link to the world. Searle's answers each say that what is added is still only syntax.

  - type: text
    id: bio
    title: "Biological naturalism, and what the other theories say"
    body: |
      Searle's own positive view is **biological naturalism**: brains cause minds, in the way stomachs cause digestion, through their specific physical and chemical powers. A computer simulation of a brain, like a simulation of a storm, reproduces the pattern and not the thing. On this view, a machine could be conscious only if it had the brain's causal powers, and a program on a conventional computer does not supply them.

      Compare the theories of consciousness met earlier in this level.Integrated information theory reaches a similar verdict by a different route. Tononi and Koch argued in 2015 that a conventional digital computer has very low integration whatever program it runs, because its parts are wired in a way that has little feedback, so even a perfect simulation of a brain would experience next to nothing. Its verdict depends on the hardware and not on behaviour. Global workspace and higher-order theories are closer to functionalism: they ask whether information is broadcast to many processes, or whether the system has thoughts about its own states, and a machine could in principle have both.

      So the question "could a machine be conscious?" has no single answer, because the theories say different things about what to look for.

  - type: mcq
    id: bio-q
    title: "Same machine, different verdicts"
    prompt: |
      A conventional digital computer runs a program that simulates a human brain very faithfully and talks exactly as a person does. Which theory would say that this system is probably not conscious, whatever its behaviour?
    options:
      - text: 'Global workspace theory, because it does not care about behaviour.'
        feedback: |
          Global workspace theory cares about how information is organised, and it asks about broadcast to many processes. A program that has such an architecture could meet it.
      - text: 'Integrated information theory, because the verdict depends on the physical causal structure, and a conventional computer has very little integration.'
        correct: true
        feedback: |
          Yes. For this theory the program is not what counts; the physical wiring is, and a conventional digital computer, on Tononi and Koch's estimate, has very low integration.
      - text: 'Functionalism, because a simulation is not the real thing.'
        feedback: |
          This is Searle's line and not the functionalist's. The functionalist holds that if the organisation is the same, the mental state is the same, simulated or not.
    explanation: |
      Searle and integrated information theory reach a similar verdict for different reasons: one from the causal powers of biology, the other from the physical integration of the hardware. Both say that behaviour and program alone are not decisive.

  - type: text
    id: replacement
    title: "Chalmers: swap the neurons one by one"
    body: |
      David Chalmers (1995) offered a thought experiment that puts the functionalist and the biological naturalist on the same ground. Suppose one neuron in your brain is replaced by a chip that does exactly the same job: it receives the same signals and sends the same signals out. You feel no difference, and nothing in your behaviour changes. Then another, and another, until every neuron is a chip. Behaviour stays the same at every step, by construction, since each chip does the same job. The question is what happens to your experience.

      Chalmers considers two options. In **fading qualia**, experience slowly dims while you carry on saying, with the same confidence, that everything looks as vivid as before. Then you would be badly wrong about your own experience, though you reason as well as ever. In **dancing qualia**, the experience flips, say from red to blue, when a switch changes which circuit is active, while your reports stay the same and you notice nothing. Chalmers finds both very implausible and concludes that the sensible view is the **principle of organisational invariance**: a system with the same fine-grained organisation has the same experience. He says himself that the arguments are not a conclusive proof.

  - type: mcq
    id: replacement-q
    title: "Where might a critic step off?"
    prompt: |
      In the replacement thought experiment, each chip does exactly the same job as the neuron it replaces, so behaviour never changes. A biological naturalist wants to say that experience would fade anyway. What must they accept, and what do they reject?
    options:
      - text: 'They must accept that the person would, at the midpoint, be wrong about their own experience while reasoning well, and reject that this is hard to believe.'
        correct: true
        feedback: |
          Yes. Behaviour and reports are by construction the same, so if experience fades, the person is mistaken about it without any change in reasoning. The biological naturalist accepts this cost, or says the chips cannot do the same job in the way a neuron does.
      - text: 'They must accept that behaviour changes, and reject that the chips copy the neurons.'
        feedback: |
          The thought experiment fixes that behaviour does not change. A critic may deny that such chips could exist, but that is rejecting the starting assumption and not answering the argument.
      - text: 'They must accept that there was never any experience in the first place.'
        feedback: |
          This is a different view, illusionism. The biological naturalist thinks there is experience and that the chips would not carry it.
    explanation: |
      The argument works by making the alternatives costly, and it does not make them impossible. Each side can pay a price, and what price one is willing to pay shows which premises one holds.

  - type: text
    id: present
    title: "What about today's AI systems?"
    body: |
      Present-day large language models are programs trained on very large amounts of human text to continue sentences in a plausible way. They often produce sentences such as "I feel curious", and some people take these reports as evidence of feeling. What can be concluded?

      Little, for a simple reason. A system trained on human writing would produce such sentences whether or not it had any experience, because the writing it learned from is full of people describing their feelings. So the reports are about as informative as a recording of a person describing their pain: they show the system can talk like us, which we knew. The test gets harder as the system gets better at imitation, since a better imitator passes with or without experience. The 2023 report by Patrick Butlin, Robert Long and 17 co-authors makes the same point in its own words: AI systems may be trained to mimic human behaviour while working in very different ways, so behaviour alone is not a good guide.

      What the report did instead was start from theories. It derived $14$ **indicator properties** from leading scientific theories of consciousness (recurrent processing, global workspace, higher-order, predictive processing, attention schema), as checkable features of a system's architecture, and adopted computational functionalism as a working hypothesis for practical reasons. Its conclusion was that no current AI system is conscious, and that there are no obvious technical barriers to building systems that meet the indicators. Notice what this rests on: if functionalism is false, the indicators are the wrong things to look for.

  - type: mcq
    id: reports-q
    title: "Why reports are weak evidence"
    prompt: |
      A language model trained on human text writes, "When you leave, I feel a little sad." A reader says this is good evidence that it feels sad. What is the best reply?
    options:
      - text: 'It is evidence of nothing, because machines cannot feel.'
        feedback: |
          This assumes the answer. Whether machines can feel is what is disputed, and the reply should not depend on it.
      - text: 'A system trained on human writing would write such a sentence whether or not it felt anything, so the sentence barely separates the two possibilities.'
        correct: true
        feedback: |
          Yes. Good evidence is something we would expect much more if the claim were true than if it were false. Here the sentence is expected in both cases.
      - text: 'It is strong evidence, because the model has no reason to lie.'
        feedback: |
          Lying is not the issue. The sentence is produced by learned patterns of human speech, which would yield it with or without feeling, so honesty does not enter.
    explanation: |
      Evidence is useful when it is much more likely under one hypothesis than under the other. Fluent self-reports from an imitator of human speech are about equally likely either way.

  - type: mcq
    id: report-q
    title: "What did the 2023 report conclude?"
    prompt: |
      A newspaper says: "Scientists have proved that AI can never be conscious." Compared with what the 2023 indicator-based report by Butlin, Long and co-authors actually concluded, what is wrong with this headline?
    options:
      - text: 'The report concluded that present AI systems are already clearly conscious.'
        feedback: |
          It concluded the opposite for present systems: that none is a strong candidate. The headline is wrong in the other direction.
      - text: 'The report concluded that no current AI system is conscious, but found no obvious technical barriers to building systems that meet its indicators, and it assumed computational functionalism as a working hypothesis.'
        correct: true
        feedback: |
          Yes. It said not now, and left open that future systems could meet the indicators. It did not treat the question as settled, since the indicators depend on a theory that may be false.
      - text: 'The report did not discuss any theory of consciousness.'
        feedback: |
          It was built on theories: it took indicators from recurrent processing, global workspace, higher-order, predictive processing and attention schema theories.
    explanation: |
      The report is a cautious, theory-relative assessment. It is neither a proof that machines cannot be conscious nor a claim that they already are.

  - type: text
    id: table
    title: "The views side by side"
    body: |
      Each row names the view, what it needs for consciousness, and what would count against it. The right column is the test, not a verdict.

      | View | What is needed | What would count against it |
      |---|---|---|
      | Functionalism | The right organisation of causes and effects, in any material | A system with a brain's organisation and clearly no experience |
      | Global workspace and higher-order | Broadcast to many processes, or thoughts about one's own states | Systems with these features that lack experience on independent grounds |
      | Integrated information | High integration in the physical causal structure | A low-integration system shown to have experience |
      | Biological naturalism (Searle) | The specific causal powers of a living brain | An artificial system with independently established experience |

      A column the table cannot fill is the one for the hard problem: each view says what to look for, and none by itself says why that thing should be accompanied by experience.

  - type: mcq
    id: misconceptions
    title: "Spot the mistakes"
    multiple: true
    prompt: |
      Select all the statements that are mistakes.
    options:
      - text: 'Searle claimed that no machine could ever think.'
        correct: true
        feedback: |
          A mistake. He argued that running a program is not enough for understanding, and allowed that a machine with the brain's causal powers could think. The brain, he said, is such a machine.
      - text: 'A system that passes the Turing test has been shown to be conscious.'
        correct: true
        feedback: |
          A mistake. The test measures conversation. Whether conversation is enough for experience is a further premise.
      - text: 'Functionalism says every computer is conscious.'
        correct: true
        feedback: |
          A mistake. It says the right organisation is what matters, and an ordinary computer may lack it.
      - text: 'A fluent report of feelings from a language model is strong evidence that it has them.'
        correct: true
        feedback: |
          A mistake. A system trained on human text would produce such reports with or without feeling.
      - text: 'The 2023 indicator-based report proved that machines can never be conscious.'
        correct: true
        feedback: |
          A mistake. It concluded that no current AI system is conscious and that there are no obvious technical barriers to building systems that meet the indicators.
      - text: 'Integrated information theory judges a system by its physical wiring, and not only by its behaviour.'
        feedback: |
          This is not a mistake. It is why the theory can say that a conventional computer has little integration however well it behaves.
    explanation: |
      Five are common mistakes: reading Searle as against all machines, treating the Turing test as a proof, caricaturing functionalism, trusting fluent reports and overreading the 2023 report. The last statement is accurate.

  - type: text
    id: summary
    body: |
      **Next:** the Level traps round. It collects the common misconceptions about consciousness from this level: that the brain's activity and experience are the same thing, that a theory of access solves the hard problem, that a report is the experience, and others, each as a fast question.
