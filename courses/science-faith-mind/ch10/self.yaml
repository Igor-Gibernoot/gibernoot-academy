id: ch10-self
title: "What Is the Self?"
kind: concept
own: |
  The setting: a person at one time, called $A$, and a person at a later time, called $B$, and the question is whether $A$ and $B$ are one and the same person. Two nearby questions are kept apart: what makes a person the same **over time**, and what makes experiences at one moment belong to **one** subject.
  - **Memory view.** According to John Locke, a person is the same as far back as their consciousness, in practice their memory, reaches. According to Thomas Reid (1785), this breaks the transitivity of identity: if $c$ is the general, $b$ the officer and $a$ the schoolboy, with $c=b$ and $b=a$ but $c$ remembering nothing of $a$, then identity by direct memory fails to give
  {{ $$(c=b) \wedge (b=a) \Rightarrow c=a$$ }}
  and so memory alone cannot be what identity consists in.
  - **Animalism.** According to Eric Olson (1997), we are {{ human organisms }}, and we persist as long as our animal life goes on, with or without our memories and character. On this view, a brain moved into another body is a transplanted organ, and the person stays with the body that keeps living.
  - **Split brain.** After the nerve bundle joining the two hemispheres was cut to treat severe epilepsy, Roger Sperry and Michael Gazzaniga found that a word or picture shown only to the left half of the visual field, which feeds the right hemisphere, could not be named aloud, yet the left hand could pick the matching object. Gazzaniga described the left hemisphere's habit of making up reasons for what it did not cause as the {{ interpreter }}. Whether this shows two subjects or one subject with divided perception is disputed.
  - **Parfit.** According to Derek Parfit (1984), in a case where one person would be continuous with two later people, neither is identical to the original, yet what matters in survival is
  {{ psychological connectedness and/or continuity }}
  not identity. Connectedness is direct links such as memories, and continuity is an overlapping chain of them. In a toy model where a person keeps $90\%$ of what they remembered the year before, direct memory links to oneself $n$ years ago fall as
  {{ $$0.9^{\,n}, \qquad 0.9^{10} \approx 0.35$$ }}
  while the chain stays unbroken.
  - **No-self and constructed-self views.** According to Hume (1739), looking inward he found only particular perceptions, never a self apart from them. According to Buddhist teaching of *anatta*, the five groups that make up a person (body, feeling, perception, mental formations, consciousness) are each not a self. According to Metzinger (2003), selves are not things; what we have is a model the brain makes of itself. According to Dennett, the self is a centre of narrative gravity, an abstraction like a centre of gravity.
  - **Open.** The views answer different questions with different tests (memory, body, chains of psychology, none), and a thought experiment such as the teleporter gets a different verdict from each. What decides between them is what we want a self to be for: responsibility, survival, or the unity of experience.
cards:
  - type: mcq
    id: hook
    title: "Guess: is the copy you?"
    prompt: |
      A teleporter scans every atom of your body, destroys the body, and builds an atom-for-atom copy on Mars. The copy walks out with all your memories, your character, even your hunger for breakfast. Guessing is the point here; no theory yet. Is the person on Mars you?
    options:
      - text: 'Yes: what makes me me is my memories and character, and they arrived.'
        feedback: |
          This is a serious view, and the lesson gives it its best form. But notice what it assumes: that a copy of the memories is enough, even though the original body and brain are gone. A test case later in the lesson shows how this view struggles if the machine makes two copies.
      - text: 'No: I was destroyed, and the person on Mars is a new person who only seems to be me.'
        feedback: |
          This is also a serious view, and the lesson gives it its best form. But it assumes that the matter or the living body is what matters. Atoms in the body are replaced over the years anyway, so the view needs more than the atoms.
      - text: 'It depends on what "you" is supposed to mean, and thoughtful people disagree on that.'
        correct: true
        feedback: |
          Yes. The case does not settle itself, because each side reads "same person" with a different test: memory and character, the living body, or something else. The lesson takes the tests in turn and then puts them side by side on this same case.
    explanation: |
      Thought experiments are tools: they pull apart things that normally travel together (your body, your brain, your memories, your sense of being one). What we say when they are pulled apart shows which one we were counting on.

  - type: text
    id: recall
    title: "Recall: who is the chooser?"
    body: |
      From the lesson Free Will: **free will** here means the control over our acts that makes us responsible for them, and **responsibility** needs someone to be responsible. The debate there asked what kind of control a person has. It took for granted that "the person" is a single thing that lasts from the choice to its consequences.

      From the lesson The Hard Problem: **experience** is what it is like to see red or to feel pain, and the question was why physical processes come with it. That lesson asked why there is experience at all. This one asks a different question: whose experience is it, and what makes it the same subject today and tomorrow?

  - type: text
    id: why
    title: "Why the question exists"
    body: |
      Two puzzles sit under the word "self".

      The first is **identity over time**. You are very different from the child in your oldest photograph: a different body, almost no shared memories, other beliefs. Yet we say it is the same person, and we hold you responsible for promises you made years ago. What makes the later person the same as the earlier one? **Personal identity** is the name for this problem.

      The second is **unity at a time**. Right now you see this page, feel your seat, and hear the room, and it all seems to belong to one subject. What makes many experiences belong to one subject, and could it fail?

      Both matter beyond philosophy. Law and morality assume that a person who acts is the person who is punished or rewarded later. Religions ask what survives death. And medicine meets cases, such as memory loss and a cut between the brain halves, where the usual signs of one lasting subject come apart.

  - type: mcq
    id: which-question
    title: "Which puzzle is it?"
    prompt: |
      Two people ask a question each. Maria asks: "Am I the same person who made that promise twenty years ago, when I remember almost nothing of that year?" Tomás asks: "Right now, do my feeling of the chair and my view of the room belong to one subject, or to two?" Which puzzles are they raising?
    options:
      - text: 'Maria asks about identity over time; Tomás asks about unity at a time.'
        correct: true
        feedback: |
          Yes. A view can answer one puzzle and say little about the other, which is why the lesson keeps them apart.
      - text: 'Both ask about identity over time.'
        feedback: |
          Tomás's question has no earlier and later person in it: it concerns one moment and whether its experiences share one subject.
      - text: 'Maria asks about unity at a time; Tomás asks about identity over time.'
        feedback: |
          This swaps them. Maria compares herself across twenty years (over time); Tomás looks at a single moment (at a time).
    explanation: |
      Identity over time compares a person at two different times. Unity at a time asks whether the experiences of one moment have one owner. The split-brain cases later press hardest on the second, the teleporter on the first.

  - type: text
    id: locke
    title: "Locke: the person is the one who remembers"
    body: |
      John Locke (1632-1704) added a chapter on identity to the second edition of his *Essay Concerning Human Understanding* in 1694. It is the first sustained answer. Locke separates three things: the same **man** (the living human animal), the same **substance** (whatever stuff or soul it is made of), and the same **person**. A person, he says, is a thinking being with reason and reflection that can think of itself as the same thinker at different times and places, and this is done by consciousness.

      Personal identity then reaches back as far as consciousness reaches to past actions and thoughts. Memory is how it reaches back, though scholars debate whether Locke simply equates consciousness with memory. His example: if the soul of a prince, carrying the prince's thoughts, entered the body of a cobbler, the person with the prince's memories would be the prince, even in a cobbler's body. So the same person need not be the same body.

      Why does it matter? For Locke, a **person** is also what responsibility attaches to: we are rightly punished for what we are conscious of having done.

  - type: text
    id: reid
    title: "Reid's brave officer"
    body: |
      Thomas Reid (1710-1796) objected in his *Essays on the Intellectual Powers of Man* (1785). A boy is flogged at school for robbing an orchard. As a young officer he takes a standard from the enemy, and he remembers the flogging. As an old general he remembers taking the standard, but he has forgotten the flogging.

      If a person is the same person just as far as memory reaches, then the officer is the same person as the boy, and the general is the same person as the officer. Identity is **transitive**: if $c=b$ and $b=a$ then $c=a$. So the general is the same person as the boy. But the general does not remember the flogging, so by the memory test he is not. The memory test has given both answers.

  - type: mcq
    id: reid-q
    title: "A reply for the memory view"
    prompt: |
      Reid's case makes a memory view of personal identity say that the general both is and is not the boy. A defender of a psychological view could reply in several ways. Which reply keeps the spirit of the memory view and removes the contradiction?
    options:
      - text: 'Say the general is the boy because the body is the same.'
        feedback: |
          This gives up the memory view for a bodily one, so it does not defend it. It is the rival view of the next card.
      - text: 'Count the general as the boy when a chain of overlapping memories links them: the general remembers the officer, and the officer remembers the boy.'
        correct: true
        feedback: |
          Yes. Direct memory is not transitive, but a chain of direct memories is, so the test becomes "linked by a chain" rather than "remembers directly". This is the idea Parfit later calls continuity, in contrast with direct links (connectedness).
      - text: 'Deny that the general was ever the officer.'
        feedback: |
          That throws away the case instead of answering it, and it also breaks the plain thought that a person can age and forget.
    explanation: |
      The repair keeps what was attractive in memory (our sense of being linked to our past) and drops the demand for a direct link. The price is that the test now depends on how long a chain may be and how strong each link must be, a point that comes back with Parfit.

  - type: text
    id: animalism
    title: "The rival: the body or the animal"
    body: |
      A different answer says we are, first of all, living animals. **Animalism** holds that we human people are organisms; Eric Olson defended it in *The Human Animal: Personal Identity Without Psychology* (1997). For Olson, one survives as long as one's animal functions, such as metabolism, breathing and the circulation of blood, continue. Psychology is not needed: a human in a permanent coma is still the same organism, and a person who lost all memories would still be the same animal.

      How does this treat a brain transplant? Olson argues that moving a brain is more like moving an organ than moving a person. The cerebrum alone is no more an organism than a liver is, and the animal that is left behind, with the life-support functions, is the one we were.

      This view fits what we say of newborns and of people with advanced dementia, who are still the same human. It sits less easily with the intuition that we would "go with" our memories into a new body. It also has an answer for the old puzzle of the ship whose planks are replaced: the organism persists through change of matter because its life goes on.

  - type: mcq
    id: animal-q
    title: "A brain moves"
    prompt: |
      Surgeons move a person's whole brain, with all its memories and character, into a new body, and the old body is kept alive without a working cerebrum. Where is the original person, according to a memory view in Locke's tradition and according to Olson's animalism?
    options:
      - text: 'Both say the person goes with the brain.'
        feedback: |
          The memory view says that. Animalism does not: the brain is an organ moved away, and the animal that keeps living is the one we were.
      - text: 'The memory view says the person is in the new body; animalism says the person is the animal that stays in the old body.'
        correct: true
        feedback: |
          Yes. The case makes the two tests give different answers, which is why it is used to compare them.
      - text: 'Both say the person is in the old body.'
        feedback: |
          The memory view tracks memory and character, which went with the brain. Only animalism says the person stays with the living old body.
    explanation: |
      Cases are useful because they separate the things that travel together every day. After the split, the memory view follows the psychology and animalism follows the organism, so each view must be defended against the intuition behind the other.

  - type: text
    id: split
    title: "Split brains"
    image:
      src: img/sperry.webp
      alt: "Black and white portrait photograph of Roger Sperry"
      caption: "Roger Sperry (1913-1994) shared the 1981 Nobel Prize in Physiology or Medicine for work on how the two hemispheres of the brain specialize."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Roger_Wolcott_Sperry.jpg"
    body: |
      Now to a question about unity at a time. The brain has two halves, the **hemispheres**, joined by a thick bundle of nerve fibres, the **corpus callosum**. For some patients with severe epilepsy, surgeons cut it (a callosotomy) as a last resort to limit the spread of seizures. In daily life these patients usually seem normal.

      Roger Sperry, with his student Michael Gazzaniga (born 1939) and others at Caltech, designed tests that send information to only one hemisphere. Each hemisphere mostly handles the opposite side of the body and of the visual field, and speech is usually produced by the left hemisphere. So when a picture is shown only in the left half of the visual field, the right hemisphere gets it, and the speaking hemisphere does not. The patient cannot say what it was, but the left hand, controlled by the right hemisphere, can pick out the matching object from a set.

      A 1967 article by Gazzaniga in *Scientific American*, "The Split Brain in Man", described such patients. A famous follow-up, as it is commonly told, showed a chicken claw to the speaking hemisphere and a snow scene to the other. The left hand chose a shovel, and the patient, asked why, said the shovel was for cleaning out a chicken shed. Gazzaniga took this to show a left-hemisphere **interpreter** that invents a plausible reason for what it did not cause.

  - type: mcq
    id: split-q
    title: "What the left hand can do"
    prompt: |
      In a split-brain test an object is flashed only in the left half of the visual field, which feeds the right hemisphere. The speech centres are in the left hemisphere. Asked what was shown, what typically happens?
    options:
      - text: 'The patient names the object correctly, and the left hand cannot find it.'
        feedback: |
          This reverses the pattern. The hemisphere that saw the object is the one without speech, so the answer is not spoken.
      - text: 'The patient cannot name it, but the left hand can pick the matching object from a set.'
        correct: true
        feedback: |
          Yes. The right hemisphere saw the object and controls the left hand, so it can act on what it saw, but it cannot reach the speech centres across the cut.
      - text: 'The patient neither names it nor finds it, since the hemispheres share everything.'
        feedback: |
          After the cut, the hemispheres do not share this information (that is the point of the test). If they still shared everything, a callosotomy would have no effect to study.
    explanation: |
      The two kinds of response, speech and the left hand, are controlled by different hemispheres, and after the cut each response only reflects what its own hemisphere received.

  - type: text
    id: split-readings
    title: "One subject or two?"
    body: |
      Does the finding mean that the operation made two people, each with its own experience? Two readings are discussed.

      **Two subjects.** Sperry and others proposed that each hemisphere has its own awareness: the speaking left one and a right one that can read and act but cannot say what it knows. On this reading, the operation cut one subject into two.

      **One subject, divided perception.** In 2017 Pinto and colleagues, in the journal *Brain*, tested two split-brain patients (DDC and DDV) and argued that perception is divided but there is a single conscious agent. Volz and Gazzaniga replied the same year, arguing against that reading. Both readings agree on the behaviour; they differ on how to interpret it, and the study used only two patients, who had their operations decades earlier.

      Notice that both fit the same data, so the data alone does not choose. What decides is the further question: what is it for experiences to "belong to one subject"? That is the question from the lesson Integrated Information and Other Rivals, now at the level of a single person.

  - type: mcq
    id: split-multi
    title: "What the finding supports"
    multiple: true
    prompt: |
      Which of these claims does the split-brain evidence, taken alone, establish? Select all that apply.
    options:
      - text: 'Cutting the connection between the hemispheres changes what a patient can say about information shown to one side.'
        correct: true
        feedback: |
          Established: this is the basic result, shown many times.
      - text: 'Each hemisphere has its own separate stream of experience.'
        feedback: |
          This is one reading, not a result. The one-subject reading fits the same behaviour, and the two-subject reading needs an argument about what behaviour shows about experience.
      - text: 'The left hemisphere can offer an explanation for an act it did not cause.'
        correct: true
        feedback: |
          Established in the reported cases, with the caution that the best-known examples come from a few patients.
      - text: 'A self is nothing over and above the brain.'
        feedback: |
          This is a metaphysical claim, not an experimental result. The data are open to a reading on which the self is a physical process and to readings on which it is not.
    explanation: |
      The experiments give behavioural facts. The claims about how many subjects there are, and what a self is, are interpretations added to those facts, and thoughtful readers add different ones.

  - type: text
    id: parfit
    title: "Parfit: what matters is not identity"
    image:
      src: img/parfit.webp
      alt: "Photograph of Derek Parfit speaking at a lecture"
      caption: "Derek Parfit (1942-2017), an Oxford philosopher whose book Reasons and Persons (1984) turned the puzzle cases of personal identity into an argument about what we should care about."
      credit: "Anna Riedl, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Derek_Parfit_at_Harvard-April_21,_2015-Effective_Altruism_(cropped).jpg"
    body: |
      Derek Parfit's *Reasons and Persons* (1984) gives the teleporter its best-known form: a machine puts you to sleep, records every atom, and a second machine rebuilds you on Mars while the original is destroyed. Is that travel, or death and replacement? Then he changes the machine: the original is not destroyed, and the machine can build several copies, each remembering entering it. This is a **branching** case.

      A related case in the literature asks the same about the brain itself. Suppose each half of one person's brain is moved into a different body, and both recipients wake up with the original's memories and character. Both are psychologically continuous with the original. They cannot both be the original, because identity is one-to-one: two different people cannot both be one person. Choosing one of them is arbitrary. So neither is identical to the original.

      Parfit takes the lesson to be that **identity is not what matters** in survival. What matters is psychological **connectedness**, direct links such as memories, intentions and character, and **continuity**, an overlapping chain of such links. These can hold in the branching case, even though identity cannot. In his view, when the relation holds without branching, it is as good as ordinary survival.

  - type: order
    id: fission
    title: "Build the branching argument"
    prompt: |
      Put the branching argument in order, from the setup to the conclusion about what matters.
    steps:
      - 'Both later people are psychologically continuous with the original.'
      - 'Identity is one-to-one, so the original cannot be identical to two different people.'
      - 'Nothing favours one later person over the other, so choosing one would be arbitrary.'
      - 'So the original is identical to neither of them.'
      - 'Yet the continuity is what we cared about in survival, so what matters is not identity.'
    hint: Start with the facts of the case, then the rule about identity, then what follows for each of the two, and last what is left to care about.
    explanation: |
      The argument turns on two facts that come apart: psychological continuity can hold with two later people, while identity cannot. Whoever holds that identity is what matters must say that the original has lost something important in this case, and Parfit says nothing important was lost.

  - type: numeric
    id: chain
    title: "Links that weaken, a chain that holds"
    prompt: |
      A toy model of memory: each year you keep $90\%$ of the memories of yourself that you had the year before, and the losses of different years are independent. What fraction of the memories you had of yourself ten years ago do you still have today? Give a decimal, to two places.
    answer: 0.35
    tolerance: 0.005
    answerText: '0.35'
    wrong:
      - { value: 0.9, feedback: 'That is the fraction kept after one year. Ten years of independent losses compound.' }
      - { value: 0, feedback: 'The fraction falls steadily but is not zero after ten years; the model keeps $90\%$ each year.' }
      - { value: 0.1, feedback: 'That is the fraction lost in one year, not the fraction left after ten.' }
    hint: Each year multiplies what is left by $0.9$; do it ten times.
    explanation: |
      After one year $0.9$ of the memories remain, after two years $0.9\times0.9$, and after ten years $0.9^{10}\approx0.35$. So direct connection to yourself ten years ago has dropped to about a third, and after forty years it would be about $0.9^{40}\approx0.015$, yet at every step the chain of links stays unbroken. This is the sense in which connectedness comes in degrees and continuity is a chain, so the person at the end of the chain is linked to the person at the start without strong direct links.

  - type: text
    id: bundle
    title: "No self, or a self made up"
    body: |
      Some views go further and doubt that there is a lasting self to be identical to at all. Each is stated here as its supporters state it.

      **Hume.** In the *Treatise of Human Nature* (1739), David Hume wrote that when he entered most intimately into what he called himself, he always stumbled on some particular perception or other, never catching himself without a perception. He concluded that the rest of mankind are nothing but a bundle or collection of different perceptions. The mind, he said, is like a theatre where perceptions successively appear, with the warning that the comparison must not make us think of a stage. He revisited the question in an appendix to the work.

      **Buddhist anatta.** In the early Buddhist teaching, a person is analysed into five groups (*khandhas*, often translated aggregates): bodily form, feeling, perception, mental formations and consciousness. According to the Anattalakkhana Sutta (SN 22.59), none of them is a self, because each changes. Later tradition illustrates it with the chariot in the dialogue between the monk Nagasena and King Milinda: no part of the chariot is the chariot, yet "chariot" is a useful name. Scholars differ on whether the teaching says "there is no self" or "none of these is the self"; adherents hold that clinging to a lasting self is a source of suffering.

      **Constructed selves.** Thomas Metzinger, in *Being No One* (2003), argues that there are no selves, only a model of the organism that the brain builds and that we do not experience as a model. The model exists; a self as a thing does not. Daniel Dennett, in *Consciousness Explained* (1991) and an essay of 1992, calls the self a centre of narrative gravity: an abstraction, like a centre of gravity, which is useful for predicting a body's behaviour although nobody can point to it as a part.

  - type: mcq
    id: noself-q
    title: "What do these views deny?"
    prompt: |
      Hume, early Buddhist teaching, Metzinger and Dennett are often grouped as "no-self" views. What do they, as they state themselves, deny?
    options:
      - text: 'That there is any experience, since the self is the one who has it.'
        feedback: |
          They accept that experience occurs: Hume finds perceptions, the Buddhist texts list feeling and consciousness, Metzinger accepts the self-model. What they question is a lasting owner behind the experiences.
      - text: 'That there is a lasting, unchanging thing behind the stream of experience that is the owner of it.'
        correct: true
        feedback: |
          Yes. They differ on what is left: a bundle (Hume), five changing groups (Buddhism), a model the brain makes (Metzinger), a useful abstraction (Dennett). All accept something that functions as a self in daily life; they deny a hidden, lasting object.
      - text: 'That a person can be held responsible for anything they did.'
        feedback: |
          The views do not say that. Dennett, for one, keeps a role for the self in responsibility as a useful and real abstraction. Whether responsibility needs a lasting self is a further question.
    explanation: |
      "No-self" is shorthand for a denial of one thing: a hidden, lasting subject behind experience. The views differ on what takes its place, and some resist the label "no self" for that reason.

  - type: text
    id: table
    title: "One case, five answers"
    body: |
      The same cases, answered by each view. These are the answers each view tends to give, as its defenders put it, and individual authors differ.

      | View | Teleporter | Split brain |
      |---|---|---|
      | Memory | Copy is you | Hard case |
      | Animalism | Copy is new | One animal |
      | Parfit | Copy has what matters | Identity not key |
      | Hume, anatta | No thing to ask of | Bundles |
      | Constructed | Copy has own model | Two models? |

      Rows: the memory view of Locke, Olson's animalism, Parfit, the no-self views of Hume and Buddhism, and the constructed-self views. On **death**, the memory view says the person ends if memory ends; animalism, with the organism; Parfit, that a chain of links ends, a lesser loss than it seems; Hume and anatta, that the groups disperse (rebirth is a further, separate claim); the constructed-self views, that the model ends with the brain.

      The rows differ on what they take the self to be, and so on what the cases test. Each is answerable in its own terms. None of the rows can be read off the data by itself.

  - type: mcq
    id: traps
    title: "Misconceptions"
    prompt: |
      Which of these statements are mistakes, in light of what the lesson established? Select all that apply.
    multiple: true
    options:
      - text: 'Split-brain surgery was shown to split one person into two persons.'
        correct: true
        feedback: |
          A mistake. The behaviour is clear, but whether there are two subjects is an interpretation, and a 2017 study argued for one conscious agent with divided perception.
      - text: 'If the self is a construction, nobody has experiences.'
        correct: true
        feedback: |
          A mistake. The constructed-self views deny a lasting thing behind experience, not the experiences themselves. Metzinger accepts the self-model; the Buddhist texts list consciousness and feeling.
      - text: 'Parfit held that after teleportation the copy is the same person, strictly speaking.'
        correct: true
        feedback: |
          A mistake. Parfit's argument is that identity may fail (in branching cases) yet what matters is kept, so he says identity is not what matters.
      - text: 'Reid showed that memory is of no use in telling whether two people are the same.'
        correct: true
        feedback: |
          A mistake. Reid's case shows that direct memory cannot be what identity consists in; he held memory has a conceptual and evidential link to identity.
      - text: 'Animalism says a human who has lost all memory is the same animal as before.'
        feedback: |
          This statement is correct, so it is not a mistake. For animalists, persistence follows animal life, not psychology.
    explanation: |
      Four are common mistakes: overreading split brains, confusing no-self with no-experience, misreporting Parfit, and overreading Reid. The remaining one is an accurate statement of animalism.

  - type: text
    id: summary
    body: |
      **Next:** Souls, Afterlife and Rebirth. If the self is a body, a pattern of memory, a bundle or a model, what could survive death, and what do the traditions mean when they say a soul does? The lesson takes the claims of each tradition in its own terms and sets next to them what the brain evidence says.
