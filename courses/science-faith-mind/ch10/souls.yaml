id: ch10-souls
title: "Souls, Afterlife and Rebirth"
kind: concept
own: |
  The setting: a person who dies, and the question of whether anything of that person goes on. A **soul** here means whatever a view says would survive, and each view names a different thing.
  - **Separable soul (Plato, Descartes).** According to Plato's *Phaedo*, the soul is like the unseen, unchanging Forms, and the body like the visible, changing things, so the soul is more likely to outlast the body. According to Descartes, the mind has no parts while the body is divisible, so they are different substances. If $m$ is the mind and $b$ the body, his argument is
  {{ $$\text{mind indivisible},\ \text{body divisible}\ \Rightarrow\ m \neq b$$ }}
  A physicalist replies that the first premise is doubtful, since brain damage removes particular abilities.
  - **Soul as form (Aristotle).** According to Aristotle, the soul is {{ the form of a living body }}, as a shape belongs to bronze, so in general it has no existence apart from the body. Whether the intellect is an exception is left unclear.
  - **Resurrection (Judaism, Christianity, Islam).** According to these traditions as their adherents hold them, the dead will be raised by God at a final day. The philosophical puzzle is identity: what makes the raised person the same person whose body decayed.
  - **Rebirth (Hindu and Buddhist).** According to Advaita Vedanta, the self ($\bar{a}tman$) is identical with Brahman and passes through many bodies. According to Buddhist teaching, there is no self, and rebirth is {{ a causal stream }} in which a later life is neither the same as the earlier one nor wholly different. Spiritism (Kardec, 1857) also teaches rebirth, with a spirit that progresses through many lives and can communicate through mediums.
  - **Brain evidence.** Anaesthesia, brain damage and dementia change or switch off the mind, so mental life depends on the brain in this life. The argument from brain damage adds a premise, that the dependence is total and permanent. A dualist denies that premise.
  - **Near-death experiences and rebirth claims.** In AWARE, a study of $2060$ cardiac arrests, about $2\%$ of the interviewed survivors described seeing and hearing the resuscitation, and one account was checked against a recorded sound. In AWARE-II, no survivor named a hidden picture, and
  {{ $$\frac{11}{28} \approx 39\%$$ }}
  of the interviewed survivors reported memories suggesting consciousness. Stevenson collected about $3000$ cases of children who speak of a past life. He said the evidence does not compel belief, and critics point to leading questions, shared culture and forgotten exposure.
  - **Open.** Each view says what would count against it. Physicalism is challenged by verified perception from a stopped brain, and Spiritism by repeated failed tests of mediums. Resurrection and rebirth are held on faith or tradition, with evidence that does not settle them.
cards:
  - type: mcq
    id: hook
    title: "Guess: what survives?"
    prompt: |
      A person's heart stops, and a few minutes later their brain activity stops too. Guessing is the point here; no theory yet. What, if anything, goes on?
    options:
      - text: 'Nothing: the person is gone, just as a flame is gone when the candle burns out.'
        feedback: |
          This is a serious view, held by many scientists and philosophers, and the lesson gives it its best form. Notice what it assumes: that the mind is something the brain does, so that nothing is left when the doing stops.
      - text: 'Something, a soul, goes on, and it is the person themselves.'
        feedback: |
          This is also a serious view, held in many forms. Notice what it assumes: that there is something in a person that is more than the body and can work apart from it. The lesson asks what the tests for that would be.
      - text: 'It depends on what "the person" is, and on what kind of evidence we accept, and thoughtful people disagree on both.'
        correct: true
        feedback: |
          Yes. The answers differ because the traditions mean different things by "soul", and because they rest on different kinds of reasons: argument, scripture, experience or experiment.
    explanation: |
      The lesson takes each view in the form its followers would accept, then asks of each: what survives, and what would count against it. It does not try to say which is true.

  - type: text
    id: recall
    title: "Recall: the self and the hard problem"
    body: |
      From the lesson What Is the Self?: **personal identity** asks what makes a person at one time the same person as a person at a later time. There were rival answers. Locke said memory, so the person is the same as far back as their memories reach. Olson (animalism) said the living animal. Parfit said what matters is not identity but chains of memory and character. And Hume and Buddhist teaching of *anatta* (no-self) said that looking inward one finds only passing experiences, no lasting self.

      From the lesson The Hard Problem: **experience** is what it is like to see red or feel pain, and the question was why physical processes come with it.

      This lesson asks the question that sits on top of both: when the body dies, does the one who had the experiences go on, and in what sense?

  - type: text
    id: phaedo
    title: "Plato: the soul is like the unseen"
    body: |
      The *Phaedo* is set on the last day of Socrates, who is about to drink hemlock. He gives several arguments that the soul survives, and the one called the **affinity argument** goes like this. Some things are visible, composite and always changing, like a body. Others are unseen, simple and unchanging, like the Forms (the perfect patterns, such as Equality itself, which Plato thinks the mind grasps by thought alone). The soul, which thinks, is more like the second kind. Things of the second kind do not fall apart, so the soul is more likely to outlast the body.

      Two friends object. Simmias says the soul might be like the **attunement of a lyre**: a harmony that depends on the instrument and ends when it breaks. Cebes says the soul might be like a weaver who wears out many cloaks: it outlasts many bodies and still dies after the last one.

      Many commentators judge the affinity argument one of Plato's weaker arguments. It does show clearly what a *separable* soul would have to be: a thing with its own nature that does not depend on the body for its existence.

  - type: mcq
    id: phaedo-q
    title: "Harmony or soul?"
    prompt: |
      Simmias says the soul is to the body as the harmony is to a lyre. Which consequence makes this a threat to the Phaedo's hope that the soul survives?
    options:
      - text: 'A harmony can exist before the lyre and after it breaks, so the soul would survive.'
        feedback: |
          This reverses Simmias's point. A harmony is something the instrument does when it is in tune, so there is no harmony without the lyre.
      - text: 'A harmony depends on the instrument being in working order, so when the body breaks, the soul would end.'
        correct: true
        feedback: |
          Yes. If the soul is an effect of the body's organisation, destroying the organisation destroys the soul. This is the earliest form of the physicalist idea that mind depends on body.
      - text: 'A harmony is unseen, so the soul would be one of the Forms.'
        feedback: |
          Being unseen is the feature Plato leans on in the affinity argument. Simmias uses the same image to show that something unseen can still depend on a visible thing.
    explanation: |
      Simmias's picture makes the soul depend on the body, as the music depends on the strings. Plato has Socrates answer it, and later thinkers return to the same worry when brain damage is discussed.

  - type: text
    id: aristotle
    title: "Aristotle: the soul as the form of a body"
    body: |
      Aristotle (384-322 BCE) took another road in *De Anima* (*On the Soul*). For him, every living thing, plant, animal or human, has a soul, and the soul is its **form**: the way its matter is organised so that it can do the things life does (nourish, move, perceive, think). The soul is the first actuality of a natural body that has organs, in the language of the translations. His comparison is a shape and the bronze it shapes: nobody asks whether the shape and the bronze are two things.

      On this view a soul is not a passenger inside the body. Take away the body and, in general, nothing is left of the form, just as nothing is left of a statue's shape when the bronze is melted. Aristotle does say that the intellect (*nous*) is special: it is not mixed with the body and uses no bodily organ. Whether this means the intellect survives is a question his readers have argued about ever since, and he leaves the passage unclear.

  - type: mcq
    id: aristotle-q
    title: "Same word, different view"
    prompt: |
      Plato and Aristotle both say that humans have a soul. A student says: "So both of them believe the soul leaves the body at death and goes on." What is the best correction?
    options:
      - text: 'Plato holds that the soul is separable and can outlast the body; Aristotle holds that in general the soul is the form of the body and does not exist apart from it, with the intellect an unclear exception.'
        correct: true
        feedback: |
          Yes. The word "soul" names a principle of life for Aristotle, which plants share, and a separable thinking thing for Plato in the *Phaedo*.
      - text: 'Aristotle held that animals have souls and humans do not.'
        feedback: |
          Aristotle gave all living things a soul, humans included. What differs among them is which capacities the soul has.
      - text: 'Plato held that the soul is the form of the body and Aristotle that it is separable.'
        feedback: |
          This swaps them. The form view is Aristotle's, and the separable soul is Plato's.
    explanation: |
      The word "soul" carries different claims in different views. A later question is therefore always: which view of the soul is meant, and does it allow survival at all?

  - type: text
    id: abrahamic
    title: "Judaism, Christianity and Islam: being raised"
    body: |
      Many followers of these traditions expect not only that something of the person goes on, but that God will **raise the dead** on a final day. In Judaism, Maimonides made the resurrection of the dead one of his thirteen principles of faith. Historians note that the Hebrew Bible has no clear doctrine of it before about 200 BCE, and Jewish views today vary. In Christianity, the Nicene Creed affirms the resurrection of the dead, and Paul describes the raised body as imperishable in 1 Corinthians 15. Early Christian writers such as Irenaeus and Justin Martyr rejected the idea that only the soul survives, though Christians today differ on how death and resurrection fit together. In Islam, the Day of Resurrection is one of the six articles of faith: bodies are raised, judged and sent to paradise or hell.

      Notice what is claimed. It is the *person* who is raised, with a body, by an act of God. That differs from the Phaedo, where the soul goes on by its own nature. According to the traditions as adherents hold them, survival does not rest on a natural property of the soul, but on what God does.

  - type: mcq
    id: resurrection-q
    title: "A puzzle for resurrection"
    prompt: |
      Suppose a body decays completely, and God later makes a body just like it, with the same memories and character. A philosopher asks whether that new person is the same person who died or only an exact copy. Why is this puzzle sharper for a resurrection view than for Plato's soul?
    options:
      - text: 'Because Plato held that bodies cannot be copied.'
        feedback: |
          Plato does not say this. The point is that on his view the same soul simply continues, so nothing needs to be copied.
      - text: 'Because on a resurrection view the body stops existing, so what makes the later person the same one is exactly the question of personal identity from the previous lesson.'
        correct: true
        feedback: |
          Yes. Proposals include that God preserves a core part, or that identity is secured by divine decree, and each has critics. For a separable soul the identity question is easier, but a question of how we could know it remains.
      - text: 'Because no tradition says the raised person has memories.'
        feedback: |
          Most traditions hold that the raised person is recognisable and accountable, which is why the identity question matters to them.
    explanation: |
      Here the debate about the self meets the debate about death. A resurrection view needs an answer to Locke's and Parfit's question: which later person is the same person.

  - type: text
    id: eastern
    title: "Rebirth: a self that moves, or a stream"
    body: |
      In the Hindu tradition, the self, the **atman**, is the innermost essence of a living being. In the Advaita school of Vedanta, the atman is identical with **Brahman**, the one ultimate reality, while other schools keep individual selves distinct from God. In every school the individual passes through a cycle of births called **samsara**. The *Bhagavad Gita* compares this to changing worn-out clothes for new ones. Freedom from the cycle, **moksha**, comes through knowledge of the self or, in some schools, through God's grace.

      Buddhist teaching also holds that there is rebirth, but denies a self that moves from life to life (*anatta*, no-self, from the previous lesson). How is that possible? In the *Milindapanha*, the monk Nagasena says that a person is reborn without anything passing over, as a flame lit from another candle is neither the same flame nor wholly another. A life is a **causal stream**: what a person intends and does shapes the next life in the stream, without a lasting self in between. In this view the later person is neither the same as the earlier one nor wholly different.

  - type: mcq
    id: eastern-q
    title: "What is carried over?"
    prompt: |
      A Hindu teacher of Advaita and a Buddhist teacher both say that a death is followed by a new life. What is the main difference between what they say passes from one life to the next?
    options:
      - text: 'Advaita says the lasting self (atman) is reborn in a new body; the Buddhist says nothing lasting passes over, only a causal stream of intentions and effects.'
        correct: true
        feedback: |
          Yes. The two share the word rebirth and the hope of release, and disagree about whether there is anything that is reborn.
      - text: 'The Hindu denies rebirth and the Buddhist asserts it.'
        feedback: |
          Both assert rebirth. The disagreement is over what, if anything, is reborn.
      - text: 'Both say the same individual self moves unchanged from body to body.'
        feedback: |
          Only the Hindu views say this. Buddhist teaching rejects a lasting self, so the later life is linked to the earlier by cause and effect, not by identity.
    explanation: |
      The same word, rebirth, covers a view with a self that survives and a view with none. The no-self reading of the earlier lesson is what makes the Buddhist version possible.

  - type: text
    id: spiritism
    title: "Spiritism: spirits that return and communicate"
    body: |
      **Spiritism** was set out by Allan Kardec (the pen name of Hippolyte Léon Denizard Rivail) in *The Spirits' Book*, published on 18 April 1857. According to Kardec, its questions and answers were given by spirits through mediums in sessions in the 1850s, and he grouped the answers by theme. Its followers hold two central teachings. The first is **plurality of existences**: a spirit lives many lives, in this world and others, growing in knowledge and goodness as it goes. The second is that spirits of the dead can **communicate** with the living through mediums.

      Spiritism differs from older Spiritualism mainly in teaching rebirth. It also differs from the Hindu view in its stress on moral progress from life to life. For its followers, the evidence is mediums' messages and the moral coherence of the doctrine. Critics reply that messages can be explained by cold reading (guessing from the sitter's reactions), by chance, or by information the medium already had. What is claimed, then, can be put to a test, and the next question is what a fair test looks like.

  - type: mcq
    id: spiritism-q
    title: "A fair test of a message"
    prompt: |
      A medium reports a message from a dead man: his name, the street where he lived and a small private habit. Which way of checking would count as a fair test of the claim that the message came from him?
    options:
      - text: 'Ask the family whether the message "feels right"; if it does, count it as confirmed.'
        feedback: |
          Feelings of rightness are easy to produce when the message is vague or the family helps. This is the situation where cold reading works best.
      - text: 'Write the specific claims down before checking, check each against records the medium could not have seen, and compare with what guessers who never knew the man produce.'
        correct: true
        feedback: |
          Yes. Writing down first stops the claims from drifting to fit the facts, independent records stop leakage, and a comparison group shows what chance and general knowledge can do.
      - text: 'Accept the message if at least one detail turns out to be true.'
        feedback: |
          One hit among many guesses is expected by chance, so counting only the hits ignores the misses and the vague statements.
    explanation: |
      The same three ingredients return in every claim of this kind: specific claims fixed in advance, independent checking, and a baseline of what ordinary routes can produce.

  - type: text
    id: dualism
    title: "Philosophical dualism and its replies"
    body: |
      The lesson Two Kinds of Stuff: Dualism introduced Descartes (his *Meditations* appeared in 1641). Among his arguments is one from divisibility: the body can be divided into parts, but the mind seems to have none, so they cannot be the same thing. Written with $m$ for the mind and $b$ for the body, it says that if the mind has no parts and the body has parts, then $m \neq b$. If mind and body are distinct, the mind could in principle exist without the body, so survival is at least possible. The *Stanford Encyclopedia of Philosophy* calls dualism the more survival-friendly view, while noting that it does not guarantee survival.

      Physicalists reply in two ways. The first attacks a premise: the mind does seem to have parts in the sense that brain damage removes particular abilities and a split brain divides some of them. The second is the old interaction worry, pressed by Princess Elisabeth of Bohemia from 1643: how can something with no extension push on matter? Dualists have answers to both, and the answers are the substance of the dualism lesson. Here the point is the structure: dualism makes survival *possible*; it does not by itself show survival *happens*.

  - type: mcq
    id: dualism-q
    title: "Which premise?"
    prompt: |
      Descartes's argument says: the mind has no parts, the body has parts, so the mind is not the body. A critic points to patients whose brain damage removes the ability to recognise faces but leaves speech untouched. Which premise is the critic aiming at?
    options:
      - text: 'That the body has parts.'
        feedback: |
          Nobody doubts that a body has parts. The patient case is about the mental side.
      - text: 'That the mind has no parts: abilities of the mind separate under damage, which suggests it has parts after all.'
        correct: true
        feedback: |
          Yes. A dualist may answer that only the *expression* of the mind needs the brain, or that unity of consciousness still holds, and a physicalist answers that the case shows the parts are in the brain.
      - text: 'That things that are the same share all their properties.'
        feedback: |
          This is a rule of logic that both sides accept. A critic of the argument works on the premises about mind and body.
    explanation: |
      An argument is valid if its conclusion follows, and sound if its premises are also true. Most of the debate about the divisibility argument is over whether the premise about the mind is true.

  - type: text
    id: brain
    title: "What the brain evidence shows"
    body: |
      It is an established fact that mental life depends on the brain in this life. A general anaesthetic switches off awareness, and it returns when the drug wears off. Damage to certain regions removes particular abilities, such as the use of language or the recognition of faces. In advanced dementia, memory and personality decline as brain tissue is lost. Drugs such as ketamine change experience.

      Some philosophers, such as Gennaro and Fishman, argue from these facts that the mind ends when the brain stops, and call this the **argument from brain damage**. Others see a gap. Dependence in this life does not show that the dependence is total or permanent. A dualist may reply that the brain is needed to *express* the mind here, as a radio set is needed to hear a broadcast, so damaging the set changes the sound without destroying the station. A physicalist replies that this makes the soul an extra which explains nothing and that the data fit simpler.

      What the evidence does not show on its own is that the mind is *identical* to the brain: dependence and identity are different claims, as the lesson on the neural correlates of consciousness stressed. What it does show is that any view of survival must say what the soul does in this life, since many functions we thought were its own depend on the brain.

  - type: mcq
    id: brain-q
    title: "What follows from brain dependence?"
    multiple: true
    prompt: |
      Select all the statements that the brain evidence (anaesthesia, damage, dementia) supports without adding a further premise.
    options:
      - text: 'Mental life in this life depends on the working of the brain.'
        correct: true
        feedback: |
          Yes. This is the established core: change the brain and you change the mind.
      - text: 'Awareness can be switched off and then return, so it depends on a process that can be restored.'
        correct: true
        feedback: |
          Yes. Anaesthesia shows that awareness follows a reversible brain state.
      - text: 'There cannot be a soul that survives death.'
        feedback: |
          This needs a further premise, that the dependence is total and permanent. A dualist denies that premise, so the conclusion is argued for, not observed.
      - text: 'The mind is nothing over and above the brain.'
        feedback: |
          Dependence is not identity. Many dualists and property dualists accept the dependence and deny the identity.
    explanation: |
      Two statements are data. The other two are conclusions that need extra premises, and those premises are where the views divide.

  - type: text
    id: nde
    title: "Near-death experiences and the AWARE study"
    body: |
      A **near-death experience** (NDE) is a vivid experience reported by some people who came close to death, for example in cardiac arrest. Common features are peace, a feeling of leaving the body, a tunnel, a bright light and a review of one's life. People often say it changed them. Believers in survival read these as glimpses of what comes after, or as proof that consciousness can operate away from a working brain. Critics point to the dying brain: drugs and low oxygen can produce some of the features, the content varies with culture, and similar experiences occur in people who only believed they were near death.

      The most direct way to test the claim is the **AWARE** study (AWAreness during REsuscitation). In its first part, researchers followed $2060$ cardiac arrest events in 15 hospitals in the UK, US and Austria. Of the survivors, $140$ completed a first interview and $101$ a second. About $46\%$ of those interviewed had memories, mostly not of the classic kind: fear, persecution, animals and plants, or family. About $9\%$ described an experience compatible with an NDE, and about $2\%$ described seeing and hearing actual resuscitation events. One person's account of the arrest was checked against a recorded sound and matched, over about three minutes without a heartbeat. The authors said that the small share with such recall made it impossible to prove or disprove the experiences.

      AWARE-II (2023) placed hidden pictures on shelves above the beds that could only be seen from above, and monitored the brain during CPR. Out of $567$ in-hospital arrests, $53$ people survived and $28$ were interviewed. Eleven of them reported memories suggesting consciousness. None identified the hidden picture, and one of the $28$ identified the recorded sound. Despite very low oxygen in the brain, a normal-looking EEG appeared in some patients between 35 and 60 minutes into CPR. The authors read this as consciousness being possible during arrest, and readers differ on what it means.

  - type: mcq
    id: aware-q
    title: "What AWARE does and does not show"
    prompt: |
      Which summary of the AWARE results is the most accurate?
    options:
      - text: 'AWARE proved that consciousness leaves the body during death.'
        feedback: |
          No test of this kind was passed. In AWARE-II, no survivor identified a hidden picture, and in AWARE-I the share with explicit recall was too small to settle the question.
      - text: 'AWARE proved that all near-death experiences are hallucinations.'
        feedback: |
          Also too strong. The studies found that some people have complex experiences during cardiac arrest, and that one account matched a recorded sound. They did not show where those experiences come from.
      - text: 'Some survivors report experiences, a small number report seeing or hearing the resuscitation, one account matched a recorded sound, and no hidden picture was identified, so the question of perception without a working brain is open but unsupported by these tests.'
        correct: true
        feedback: |
          Yes. A test was designed and run, which is why the study matters. Its result is that the hidden-picture test found nothing, and the rest is open to different readings.
    explanation: |
      Good evidence in this field means a design in which the claim could fail. The hidden picture was such a test. Reports of experiences are real data about what survivors say, and different views explain them differently.

  - type: numeric
    id: aware-num
    title: "What share survived?"
    prompt: |
      In AWARE-II, $567$ people had a cardiac arrest in hospital and $53$ of them survived. What percentage survived? Give it to one decimal place.
    answer: 9.35
    tolerance: 0.1
    answerText: '9.3% to 9.4%'
    hint: |
      Divide the survivors by the arrests and multiply by $100$.
    wrong:
      - { value: 93.5, feedback: 'That is ten times too large. $53/567$ is about $0.093$, and as a percentage about $9.3\%$.' }
    explanation: |
      $$\frac{53}{567} \approx 0.0935$$
      so about $9.3\%$ survived. Because so few survived, and only $28$ of them were interviewed, any subgroup is small, which limits what any such study can show.

  - type: text
    id: stevenson
    title: "Children who remember: Stevenson's cases"
    body: |
      Ian Stevenson (1918-2007) was a psychiatrist at the University of Virginia, where he founded the Division of Perceptual Studies. From 1960 he studied children, mostly in South Asia and the Middle East, who speak of a past life. His first book was *Twenty Cases Suggestive of Reincarnation* (1966), and accounts of his collection give about $3000$ cases over roughly four decades. A recurring pattern is a child who names a place and a family, gives details, and then meets people who say the details fit a person who died. In a later book, *Reincarnation and Biology* (1997), he reported children with birthmarks or defects that matched wounds on the person they spoke of.

      Stevenson was cautious in his own words: he said the evidence was not flawless and does not compel belief, while holding that reincarnation was the best, though not the only, explanation for his strongest cases. Critics give several reasons for doubt. Families may have asked **leading questions** or shaped the story. A culture that believes in rebirth supplies the idea, and details spread between families. The child may have heard of the dead person and **forgotten** doing so (cryptomnesia). Interviews came long after the first statements. Some critics, such as Leonard Angel, C. T. K. Chari and Paul Edwards, judged his methods too weak. Stevenson's defenders replied that statements were often recorded before the match was found, and that coaching does not explain how the parents themselves got the information. Some critics who accept the data propose that the child gets the facts through extrasensory perception from living people, which keeps rebirth out of the explanation.

  - type: order
    id: stevenson-order
    title: "Order a fair test of a memory claim"
    prompt: |
      A child says he lived before and gives a name, a village and the manner of his death. Put in order the steps of a test that would let the claim fail.
    steps:
      - 'Write down what the child says, dated and with the witnesses, before anyone searches for a match.'
      - 'Look for a person who died and who fits those statements, without telling the other family what was said.'
      - 'Check each recorded statement against independent records of that person.'
      - 'Count hits and misses, and compare with what common facts of the region or good guesses would give.'
      - 'Ask how the child could have learned the facts by ordinary means.'
    hint: |
      The claim must be fixed before the search, or any match can be bent to fit.
    explanation: |
      Recording first stops the story from drifting toward what is found. Independent records stop leakage. A baseline shows what chance gives, and the last step considers the ordinary routes (the family, village talk, television), which are where critics say most cases are explained.

  - type: text
    id: table
    title: "The views side by side"
    body: |
      Each row names the view, what survives according to it, and what would count against it. The right column is the test, not a verdict.

      | View | What survives | What would count against it |
      |---|---|---|
      | Plato (separable soul) | The soul, apart from the body | Showing that mind depends wholly on the brain |
      | Aristotle (form) | In general nothing apart from the body | Evidence of a mind working without its body |
      | Resurrection (Jewish, Christian, Islamic) | The person, raised by God | Not testable by science; the identity puzzle is internal |
      | Hindu (atman) | The self, through many bodies | Showing that no lasting self is found, as Hume and Buddhist teaching claim |
      | Buddhist (no-self) | A causal stream, not a self | Rebirth claims failing under fair tests |
      | Spiritism (Kardec) | A progressing spirit that can communicate | Mediums failing tests repeatedly |
      | Physicalism | Nothing of the person | Verified perception from a stopped brain |

      A column the table cannot fill is the one for faith: resurrection and rebirth are held by tradition and revelation as well as argument, and scientific tests were never the only reason adherents give.

  - type: mcq
    id: misconceptions
    title: "Spot the mistakes"
    multiple: true
    prompt: |
      Select all the statements that are mistakes.
    options:
      - text: 'Buddhists believe in an immortal soul that moves from one body to the next.'
        correct: true
        feedback: |
          A mistake. Buddhist teaching denies a lasting self (anatta); rebirth is a causal stream. Some later Buddhist texts have self-like ideas, but they are disputed inside the tradition.
      - text: 'Aristotle thought the soul is a ghost living inside the body.'
        correct: true
        feedback: |
          A mistake. He took the soul to be the form of a living body, as a shape belongs to bronze, and it is a principle of life that plants share.
      - text: 'Resurrection of the body and the immortality of the soul are the same doctrine.'
        correct: true
        feedback: |
          A mistake. In one the soul survives by its nature; in the other the whole person is raised by God. Many believers combine them, but they are different claims.
      - text: 'Because brain damage changes the mind, a soul cannot exist.'
        correct: true
        feedback: |
          A mistake. The argument needs a further premise, that dependence is total and permanent, and a dualist denies it. The inference is an argument, not an observation.
      - text: 'In AWARE-II, survivors correctly identified the hidden pictures.'
        correct: true
        feedback: |
          A mistake. No survivor identified the hidden visual image.
      - text: 'Stevenson said the evidence from his cases does not compel belief in reincarnation.'
        feedback: |
          This is not a mistake. He said the evidence was not flawless and did not compel belief, while holding that reincarnation was the best explanation for his strongest cases.
    explanation: |
      Five are common mistakes: confusing no-self with a travelling soul, reading Aristotle as Plato, merging two doctrines, overreading brain dependence and overreading AWARE. The last is an accurate statement.

