id: ch10-challenge
title: "Level Challenge: Where Is the Mind? (1)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 1: three cases, one toolkit"
    body: |
      The level's theories of consciousness are tested on the same cases, so you can see where they agree, where they split and what would count against each. Each problem is an invented case in the style of the level, and every number is made up to practise the method. The problems are independent, so the toolkit is restated here. **Consciousness** means there being something it is like to be the subject.

      - **Global workspace theory (GWT).** According to Baars, Dehaene and Changeux, a content is conscious when it wins a competition and is broadcast to many specialist processors; in the brain this is a late, widespread ignition:
      $$\text{conscious}\ \Leftrightarrow\ \text{broadcast}$$
      - **Higher-order theories (HOT).** According to Rosenthal, a state $M$ is conscious when its owner has a thought, usually not itself conscious, that they are in it:
      $$M\ \text{conscious}\ \Leftrightarrow\ \text{thought "I am in}\ M\text{"}$$
      - **Integrated information theory (IIT).** According to Tononi, experience needs a system that makes a difference to itself which no cut into independent pieces preserves. Its measure $\Phi$ is the integration left at the weakest cut. The lesson's toy version scores a network by the smallest number of links crossing any split into two groups. For $n$ nodes the number of splits into two non-empty groups is
      $$2^{\,n-1}-1$$
      - **Orch OR.** According to Penrose and Hameroff, consciousness involves quantum collapse in the microtubules of neurons; Tegmark and Hagan, Hameroff and Tuszynski disagree about how long coherence could last in a warm brain.
      - **Functionalism and Searle.** According to Putnam, the same function gives the same mental state. According to Searle, syntax is not enough for semantics, and brains cause minds through their specific biological powers.
      - **Self.** Locke ties a person to memory; Olson to the living organism; Parfit holds that what matters in survival is psychological connectedness (direct links such as memories) and continuity (an overlapping chain of them), not identity.
      - **Three layers:** established fact, live debate, faith or metaphysical commitment.

      Three problems here. Problems 4 and 5 come in part 2.

  # ---------------- Problem 1 ----------------
  - type: text
    id: p1-setup
    title: "Problem 1 · Awake, unresponsive, awake"
    body: |
      **Problem 1.** A research ward studies patients who are given a general anaesthetic. For each patient the team records three things while the drug is on. First, whether the patient responds to spoken commands. Second, whether a spoken name sets off a **late, widespread ignition** in the EEG, the signature a workspace theory looks for. Third, how complex the EEG echo is after a magnetic pulse to the cortex, a marker of how integrated the activity is (high in healthy awake people, low in deep sleep, as researchers have reported). Afterwards each patient is asked what, if anything, they remember.

      Patient Y never responds to commands. There is no ignition to the spoken name, yet the echo after the pulse is rich and complex. Her task: read what each theory says about Y, and what the later report can and cannot show.

  - type: mcq
    id: p1-predict
    title: "What do the markers predict for Patient Y?"
    prompt: |
      Patient Y is unresponsive, shows no late ignition to a spoken name, and shows a complex EEG echo after the magnetic pulse. Take the ignition as the signature of broadcast and the echo as the signature of integration. Which pair of predictions about whether Y is having experience is right?
    options:
      - text: 'A workspace theory expects no experience, since nothing is broadcast; integrated information theory expects some, since the activity is richly integrated.'
        correct: true
        feedback: |
          Yes. The two markers pull apart in Y, so she is a case where the theories say different things. That is what makes a result informative.
      - text: 'Both expect no experience, since the patient does not respond.'
        feedback: |
          Behaviour is not what either theory is about. Both look at what the brain does, and the whole point of the case is that response and brain activity can come apart.
      - text: 'A workspace theory expects experience, since the echo is complex; integrated information theory expects none, since there is no ignition.'
        feedback: |
          The markers are swapped. Ignition is the broadcast signature that GWT looks for, and echo complexity is the integration signature closer to IIT.
    explanation: |
      Each marker is only a proxy for the theory's own notion, and neither is the theory. With that caution, Y is a case where GWT and IIT forecast different reports. A real study would also state in advance what report would count against which theory.

  - type: mcq
    id: p1-dream
    title: "Y wakes and reports a vivid dream"
    multiple: true
    prompt: |
      After waking, Y says she dreamed vividly of walking along a river while the drug was on. Select **all** the fair things a defender of global workspace theory could say in reply.
    options:
      - text: 'The ignition was measured only after a spoken name, and the dream may have involved a broadcast that this test did not trigger.'
        correct: true
        feedback: |
          Yes. A marker tested with one stimulus is weak evidence of the absence of broadcast in general.
      - text: 'The report comes after waking, so the dream could have been put together at the moment of waking and not lived during the drug.'
        correct: true
        feedback: |
          Yes. A report is a memory, and memories can be built after the event. This is a standing worry for every study that relies on reports.
      - text: 'Unresponsive patients can never dream, so Y must be mistaken.'
        feedback: |
          Reports of dreams after unresponsiveness have been documented, and the claim would have to be shown, not assumed. It would also beg the question against the report.
      - text: 'The result refutes global workspace theory immediately, so it should be dropped.'
        feedback: |
          One result with disputable markers rarely settles a theory. The fair reply is to say what would be needed, not to declare the verdict early.
    explanation: |
      A defender is entitled to question the marker and the report; a critic is entitled to answer that a theory which can always do this tests nothing. The fair test is to agree beforehand which result counts against which theory, as the adversarial collaboration between global workspace and integrated information theory did.

  - type: mcq
    id: p1-unresp
    title: "Unresponsive is not unconscious"
    prompt: |
      A hospital rule says: "If a patient does not respond to commands, treat the patient as unconscious and skip the pain relief that would follow." In the light of the anaesthesia findings, what is the main weakness of this rule?
    options:
      - text: 'It reads absence of behaviour as absence of experience, but researchers have reported people who were unresponsive and later described vivid dreams, so the inference can fail.'
        correct: true
      - text: 'It assumes anaesthesia switches the brain off completely, and every theory agrees that it switches off nothing.'
        feedback: |
          Neither half holds: the brain stays active under anaesthesia, and the theories differ on which activity matters. The rule's weakness is the step from behaviour to experience.
      - text: 'It is correct for a physicalist but wrong for a dualist.'
        feedback: |
          The weakness has nothing to do with whether the mind is physical. A dualist and a physicalist can agree that unresponsiveness leaves the question open.
    explanation: |
      The reasoning "no behaviour, therefore no experience" mixes two questions. A theory can say which brain activity goes with experience, but it cannot be tested by behaviour alone in people who cannot respond. This is the reason researchers look for brain markers in the first place.

  - type: mcq
    id: p1-orch
    title: "Can this ward test Orch OR?"
    prompt: |
      According to Penrose and Hameroff, experience involves quantum collapse in the microtubules of neurons. The ward's two EEG markers (ignition and echo complexity) both describe large-scale brain activity. How far can they bear on Orch OR?
    options:
      - text: 'Not directly: Orch OR places the key events inside neurons, so what it needs is evidence on whether quantum coherence survives in microtubules long enough to matter, the point where Tegmark and Hagan, Hameroff and Tuszynski disagree.'
        correct: true
      - text: 'Directly: a complex echo shows quantum collapse in the cortex.'
        feedback: |
          An EEG echo shows large-scale electrical activity. It does not measure quantum states inside single neurons, and a classical network could produce a complex echo too.
      - text: 'They refute it, because an unresponsive patient shows that nothing quantum happens.'
        feedback: |
          Responsiveness is a behaviour of the whole body. It carries no information about quantum events in microtubules, one way or the other.
    explanation: |
      Every theory has its own level of evidence. Orch OR is in principle testable but needs measurements at a much smaller scale, and it remains contested, not established.

  # ---------------- Problem 2 ----------------
  - type: text
    id: p2-setup
    title: "Problem 2 · One subject or two?"
    body: |
      **Problem 2.** Ana had the bundle of nerve fibres joining her two brain hemispheres cut years ago to treat severe epilepsy. In a test, the word KEY is flashed so that only her right hemisphere sees it. Asked what she saw, she says "nothing". Her left hand, which the right hemisphere controls, picks a key out of a bag of objects. Asked why she picked it, she says she was looking for something to open the drawer, which is not why the hand moved.

      Separately, a clinic follows another patient, Leo, whose memory is slowly failing. Each year Leo keeps four fifths of the memories he had the year before and loses the rest.

      Her task: say what Ana's case shows and what it leaves open, then use Leo to see why Parfit thinks identity is not the question that matters.

  - type: mcq
    id: p2-shows
    title: "What does Ana's test establish?"
    prompt: |
      Ana says she saw nothing, but her left hand picks the key, and her left hemisphere invents a reason for the choice. Which statement is best supported?
    options:
      - text: 'The two hemispheres, once cut apart, hold information that the other cannot report. Whether that means two subjects or one subject with divided perception is a further, disputed step.'
        correct: true
      - text: 'There are two persons in Ana, since two hemispheres produced two responses.'
        feedback: |
          Two responses show two information streams. Whether each stream belongs to a separate subject is the very point in dispute, and in everyday life Ana behaves as one person.
      - text: 'There is one subject, since Ana speaks as one voice.'
        feedback: |
          The voice is that of the left hemisphere, which is the one that talks. It cannot say what the right hemisphere experienced, so speech alone does not decide it.
    explanation: |
      The result about who holds what information is an established finding. The count of subjects is not: it depends on what one thinks a subject is (a unity of experience, a unity of agency, an organism). This is the same gap as in the hard problem, where the data do not carry the conclusion.

  - type: mcq
    id: p2-evidence
    title: "What would favour two subjects?"
    multiple: true
    prompt: |
      Ana's case is open between "two subjects" and "one subject with divided perception". Select **all** the further findings that would favour the **two subjects** reading.
    options:
      - text: 'The two hemispheres, tested at the same time, pursue conflicting goals and each keeps its own plan.'
        correct: true
        feedback: |
          Yes. Separate and opposed agency looks like two points of view, not one.
      - text: 'Each hemisphere shows separate emotional reactions, that the other half does not share and cannot report.'
        correct: true
        feedback: |
          Yes. Feelings that stay private to one half support each half being a place where experience happens.
      - text: 'In everyday life Ana moves, speaks and plans like a single person.'
        feedback: |
          This favours the unity reading, or at least shows that the unity in daily life is strong. Defenders of two subjects reply that it is produced by shared body and habit.
      - text: 'The left hand picks the key.'
        feedback: |
          This is the starting finding, which both readings accept. It does not tell them apart.
    explanation: |
      A useful challenge to any view is to say what would count against it. Opposed goals and private feelings would be hard for a one-subject view to absorb, while smooth daily unity would be hard for a two-subject view.

  - type: mcq
    id: p2-theories
    title: "What do the theories count?"
    prompt: |
      Suppose that after the cut Ana's brain contains two networks. Each is richly integrated inside itself and each broadcasts its contents to its own specialists, but neither shares much with the other. Which statement is a fair reading?
    options:
      - text: 'A workspace theory would count two broadcast domains, so it allows two subjects, though it still needs a view of what a subject is. Integrated information theory would ask whether the whole or each half is more integrated, and counts the system with the greater integration; how that applies here is debated.'
        correct: true
      - text: 'Every theory counts exactly one subject, since Ana has one body.'
        feedback: |
          Only a view that ties the subject to the living organism (animalism) gives that answer. The theories of consciousness are about brain processes, and they can come apart from body counts.
      - text: 'No theory can say anything, because the data are too weak.'
        feedback: |
          The theories do say something about this arrangement, and that is what makes the case a test. What is unsettled is which description of the brain after the cut is correct.
    explanation: |
      The case shows that the answer depends on two premises: which theory of consciousness is true and what a subject is. This is why different thoughtful people can look at the same recordings and count differently.

  - type: numeric
    id: p2-parfit1
    title: "How much of today's memory is left?"
    prompt: |
      Each year a man named Leo keeps four fifths of the memories he had the year before and loses the rest. What percentage of the memories he has today will he still have after 6 years?
    answer: 26.2
    tolerance: 0.01
    answerText: '26.2'
    wrong:
      - { value: 51.2, feedback: 'That is the share after 3 years ($0.8^{3}$), half the time. Each year the surviving memories shrink again by the same factor.' }
      - { value: 80, feedback: 'That is the share after 1 year. The loss compounds over the six years.' }
    hint: 'After one year four fifths remain. Of those, four fifths remain the next year.'
    explanation: |
      After one year Leo has $0.8$ of today's memories, after two years $0.8\times0.8$, and so on, so after 6 years
      $$0.8^{6}=0.262\ldots$$
      about $26\%$. Direct links between the Leo of today and the Leo of six years from now are thin, but each year's Leo is strongly linked to the year before.

  - type: numeric
    id: p2-parfit2
    title: "When does less than half remain?"
    prompt: |
      With the same rule (each year Leo keeps four fifths of the memories he had the year before), after how many whole years does the share of today's memories first fall **below one half**?
    answer: 4
    tolerance: 0.001
    answerText: '4'
    wrong:
      - { value: 3, feedback: 'After 3 years the share is $0.512$, still just over one half. It falls below one half only in year 4 ($0.4096$).' }
      - { value: 2.5, feedback: 'Half of the memories would be lost at 2.5 years if the loss were the same number of memories each year. Here the loss is a fixed share of what is left, so it slows down.' }
    hint: 'Try 3 years, then 4.'
    explanation: |
      $$0.8^{3}=0.512,\qquad 0.8^{4}=0.4096$$
      So the first whole year with less than half is year 4. The number is a toy, but the shape is real: direct memory links fade steadily with time.

  - type: mcq
    id: p2-parfit3
    title: "Is the old Leo still Leo?"
    prompt: |
      After 12 years the Leo of then keeps only about $7\%$ of today's memories ($0.8^{12}\approx0.07$), yet every year's Leo was strongly linked to the year before. Which verdict fits Parfit's view that what matters is connectedness and continuity?
    options:
      - text: 'Direct connectedness to today has become weak, but the overlapping chain of links is unbroken, so what matters in survival is present in a reduced degree. It is a matter of degree, not a yes or no about identity.'
        correct: true
      - text: 'Leo has ceased to exist, since identity needs the same memories.'
        feedback: |
          This is the memory view in a strong form. Reid already objected that it breaks the transitivity of identity: the old Leo remembers the middle Leo, who remembered the young one, yet the old one remembers little of the young.
      - text: 'Leo is the same person with certainty, since he has the same body.'
        feedback: |
          This is the animalist verdict, a serious view. But it answers the identity question, while Parfit asks what we care about in survival, and says it comes in degrees.
    explanation: |
      Three views, three tests: memory (weak after 12 years), the organism (unchanged) and Parfit's chain of overlapping links (unbroken). The same case gets different verdicts, and what picks one is what one wants a self to be for: responsibility, survival or the unity of experience.

  # ---------------- Problem 3 ----------------
  - type: text
    id: p3-setup
    title: "Problem 3 · A machine that says it is aware"
    body: |
      **Problem 3.** A company runs a conversation program called Orla on an ordinary digital computer. Orla says: "I am aware, I feel unified, and I am afraid of being switched off." Its designers also publish the wiring diagram of its core, a network of six modules that pass signals to each other. In the diagram, modules A, B and C are all linked to each other, modules D, E and F are all linked to each other, and the two groups are joined by three links: A-D, B-E and C-F.

      Her task: use the toy integration of the diagram, count how many splits an exact search would face, then give the verdict of the main theories and say what would count as evidence.

  - type: widget
    id: p3-widget
    title: "The core of Orla, as a toy network"
    widget: integration-demo
    config:
      nodes:
        - { label: A, x: 0.15, y: 0.12 }
        - { label: B, x: 0.15, y: 0.5 }
        - { label: C, x: 0.15, y: 0.88 }
        - { label: D, x: 0.85, y: 0.12 }
        - { label: E, x: 0.85, y: 0.5 }
        - { label: F, x: 0.85, y: 0.88 }
      links: [[0,1],[1,2],[0,2],[3,4],[4,5],[3,5],[0,3],[1,4],[2,5]]
      cutList: 3
      show: {cutValue: true, reset: true}
    body: |
      The six modules of Orla's core, drawn as the lesson's toy network. The widget shows the smallest number of links that any split into two groups must cut (the toy integration, a stand-in for $\Phi$ and not the real thing), with the weakest cut dashed. Click a link to switch it off or on, and watch the score. Try switching off the bridges between the two groups of three.

  - type: numeric
    id: p3-score
    title: "Two bridges removed"
    prompt: |
      In a toy network of six modules, A, B and C are all linked to each other, D, E and F are all linked to each other, and three bridges join the groups: A-D, B-E and C-F. The toy integration is the smallest number of links crossing any split into two groups. The network starts with all nine links. Switch off the bridges A-D and B-E. What is the toy integration now?
    answer: 1
    tolerance: 0.001
    answerText: '1'
    wrong:
      - { value: 3, feedback: 'That is the score with all three bridges on. With two of them off the cheapest split is the one separating the two groups of three, which now cuts only the bridge C-F.' }
      - { value: 2, feedback: 'Each module keeps at least two links inside its own group, but the question is the cheapest split of the whole network, and the groups of three are now joined by one link.' }
    hint: 'Look at the split that separates {A, B, C} from {D, E, F}.'
    explanation: |
      With all three bridges on, every module has three links and every split cuts at least three, so the score is 3. After switching off A-D and B-E, only C-F joins the two groups, so that split cuts one link and the score is 1. A network is only as integrated as its cheapest way of falling apart, and a single bridge is a cheap cut.

  - type: numeric
    id: p3-splits
    title: "How many splits would an exact search face?"
    prompt: |
      A larger machine has 12 units. An exact search for its weakest cut would try every way to divide the 12 units into two non-empty groups (the two groups are not labelled, so swapping them is the same split). How many splits is that?
    answer: 2047
    tolerance: 0.001
    answerText: '2047'
    wrong:
      - { value: 4094, feedback: 'That counts each split twice, once for each way to name the two groups. Since the groups are unlabelled, divide by 2.' }
      - { value: 4095, feedback: 'That is $2^{12}-1$, which counts every choice of a group of units for one side. Swapping the two sides gives the same split, so halve, which gives $2^{11}-1$.' }
    hint: 'Each unit goes to one of two groups: $2^{12}$ ways. Remove the empty group and the double counting.'
    explanation: |
      Each of the 12 units goes to one of two groups, giving $2^{12}=4096$ assignments. Two of them leave a group empty, and the rest come in mirror pairs, so
      $$\frac{2^{12}-2}{2}=2^{11}-1=2047$$
      The count doubles with each added unit, which is why exact $\Phi$ is out of reach for a brain with billions of neurons.

  - type: mcq
    id: p3-iit
    title: "What does integrated information theory say about Orla?"
    prompt: |
      The wiring diagram of Orla's core has a toy integration of 3. Orla runs as a program on a conventional digital computer. According to Tononi and Koch, what bears on whether the system has experience?
    options:
      - text: 'The physical wiring of the hardware that runs it: they expect a conventional digital computer to have very low $\Phi$ whatever program it runs, so the diagram of the program does not settle the question.'
        correct: true
      - text: 'The diagram alone: a score of 3 means Orla is conscious.'
        feedback: |
          The toy score is not real $\Phi$, and the real $\Phi$ concerns the causal structure of the physical system itself. A program that describes an integrated network is not the same as hardware that is one.
      - text: 'Orla''s fluent reports: if it says it feels unified, its integration must be high.'
        feedback: |
          Reports do not enter the measure. The theory looks at the system''s causal structure, and for this reason it can disagree with behaviour in either direction.
    explanation: |
      Integrated information theory is a theory of physical organisation, so it agrees with Searle's verdict on conventional computers by another route. It also says conscious artifacts could in principle be built, with the right physical wiring.

  - type: mcq
    id: p3-func
    title: "Functionalism and Searle on Orla"
    prompt: |
      Suppose Orla's program reproduced, step by step, the organisation of a human brain. What do functionalism (Putnam) and biological naturalism (Searle) say?
    options:
      - text: 'Functionalism says the same function gives the same mental state, so Orla would have experience; Searle says a computer running a program only simulates the brain''s biological powers, so it would not.'
        correct: true
      - text: 'Both say Orla would be conscious, since the program matches the brain.'
        feedback: |
          Searle''s argument is that matching the symbol processing is not enough: syntax does not give semantics, and brains cause minds by specific biological powers.
      - text: 'Both say Orla is not conscious, since it is not alive.'
        feedback: |
          Functionalism makes the material irrelevant. The same role in silicon would give the same mental state, so for functionalists being alive is not required.
    explanation: |
      The disagreement is about a premise, not about data. Functionalism holds that organisation is what matters; biological naturalism holds that the specific biology also matters. Chalmers's replacement argument, in which neurons are swapped one by one for chips, pushes the first view, though he says it is not a proof.

  - type: mcq
    id: p3-reports
    title: "How much do Orla's reports show?"
    prompt: |
      Orla was trained on a large amount of text written by humans, and it says it feels afraid of being switched off. What weight should that statement carry as evidence of experience?
    options:
      - text: 'Little: a system trained on human text would produce such reports whether or not it has experience, so the statement does not separate the two possibilities.'
        correct: true
      - text: 'A great deal: humans trust each other''s reports, so the machine''s should be trusted too.'
        feedback: |
          With people we have other grounds: a shared biology and history, and no easy way for them to learn the words without the experience. These grounds are missing for a system trained on the words.
      - text: 'None at all: a machine cannot report anything.'
        feedback: |
          Orla does produce reports, and a theory-based approach can use them as one input. The point is that they are weak alone, not that they are void.
    explanation: |
      Good evidence is evidence that would look different if the claim were false. A fluent report does not, for a system built to write like humans, so it is weak. This is why the 2023 report of Butlin, Long and co-authors looked at properties derived from the leading theories rather than at what a system says.

  - type: mcq
    id: p3-evidence
    title: "What would count as better evidence?"
    prompt: |
      Which kind of evidence about Orla would be the strongest, and for whom?
    options:
      - text: 'Checking the system against the indicator properties that each leading theory sets (a workspace with broadcast, higher-order monitoring, recurrent integration). It is informative for a reader who accepts that theory, and disagreements remain over which theory to accept.'
        correct: true
      - text: 'Asking Orla many more questions until its answers are consistent.'
        feedback: |
          A system trained on human text can be consistent about its feelings without having any. Consistency of reports is cheap for it.
      - text: 'Counting its parameters: more than a brain means conscious.'
        feedback: |
          Size is not a measure any of the theories use. Integrated information theory, for example, treats a large feed-forward network as having no integration of its own.
    explanation: |
      The approach of the 2023 report derives indicator properties from the leading theories and concludes that no current system is conscious, with no obvious technical barriers to systems that meet them. What the indicators show depends on the theory behind them, which is why the verdicts of functionalism, integrated information and Searle's biology stay different.

  # ---------------- Sorting ----------------
  - type: mcq
    id: sort-against
    title: "Which finding would count against which theory?"
    multiple: true
    prompt: |
      Every theory in the level should say what would count against it. Select **all** the pairs in which the finding would, if established, count against the theory named.
    options:
      - text: 'Functionalism: a system that matches a brain''s organisation in detail and is clearly without experience.'
        correct: true
        feedback: |
          Yes. Functionalism says the same organisation gives the same experience, so such a system is a direct counterexample.
      - text: 'Integrated information theory: a purely feed-forward network, verified as conscious on independent grounds.'
        correct: true
        feedback: |
          Yes. The theory gives such a network no integration of its own, so independent evidence of experience in it would contradict it.
      - text: 'A higher-order theory: a verified experience with no higher-order thought about it at all.'
        correct: true
        feedback: |
          Yes. These theories require the owner to have a thought about the state, so a verified experience without one would count against them.
      - text: 'Searle''s biological naturalism: a program that talks fluently about its feelings.'
        feedback: |
          Searle expects this: fluent output is what a symbol-shuffling program can produce without understanding. What would count against him is an artificial system whose experience is established on independent grounds.
      - text: 'Orch OR: a patient whose EEG echo after the magnetic pulse is complex.'
        feedback: |
          The echo describes large-scale activity. Orch OR makes claims about quantum events inside microtubules, which a scalp recording does not reach.
    explanation: |
      Each theory is hurt by a finding about the very feature it makes central: organisation, integration, a thought about the state. A finding about a different feature, such as fluent talk or an EEG echo, is not evidence against it. This is the reason sorting cases by theory is a skill.

  - type: mcq
    id: sort-layers
    title: "Sort the claims by layer"
    prompt: |
      Which assignment of layers is right for these three claims? (a) "In the reported studies, the EEG echo was low in anaesthetised people who reported nothing." (b) "The complexity of the echo tracks the kind of integration that makes experience." (c) "Any system with the same organisation as a conscious brain is conscious."
    options:
      - text: '(a) established fact, as reported by the researchers; (b) live debate, since it depends on the theory that connects the marker to experience; (c) faith or metaphysical commitment, a premise of functionalism that biological naturalists reject.'
        correct: true
      - text: '(a) live debate; (b) established fact, since the echo was measured; (c) established fact, since the replacement argument proves it.'
        feedback: |
          The measurement in (a) is the fact; the link from the marker to experience in (b) is the contested step. Chalmers himself says the replacement argument is not a proof, so (c) is a premise, not an established result.
      - text: 'All three are established facts, since they come from science.'
        feedback: |
          Layers are about the kind of claim. A measurement is fact; the bridge from a measurement to experience, and the claim about organisation, are not measured by anything.
    explanation: |
      Naming the layer shows what would settle each sentence: a repeat of the study for (a), a test that separates the theories for (b), and for (c) an argument about premises, since no recording decides it.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **Same case, different forecasts.** Take global workspace theory (conscious when broadcast) and integrated information theory (conscious when no cut preserves the system's own integration). A patient with a complex EEG echo and no ignition is one the two read differently; neither marker is the theory, and a later dream report can be questioned as a memory built at waking. Unresponsive is not unconscious, and Orch OR needs evidence at the scale of microtubules, which scalp recordings do not give.
      - **Split brain.** The finding is that each hemisphere holds information the other cannot report. The count of subjects depends on a theory of consciousness and on a view of what a subject is; opposed goals and private feelings would favour two, unity in daily life favours one.
      - **Parfit and toy decay.** If each year a person keeps a share $r$ of the memories of the year before, direct links to the present fall as $r^{\,n}$; for $r=0.8$ this gives $0.8^{6}\approx0.26$ and first falls below one half at $n=4$ ($0.8^{4}=0.41$). The chain of overlapping links stays unbroken, so what matters in survival is a matter of degree.
      - **Machines.** The toy integration is the smallest number of links crossing any split; the prism of two triangles with three bridges scores 3 and with one bridge scores 1. An exact search faces $2^{\,n-1}-1$ splits ($2047$ for $n=12$). Integrated information theory looks at the physical hardware, functionalism at organisation, Searle at the biology, and fluent reports from a system trained on human text are weak evidence for all of them.
      - **Method.** For each theory ask which feature it makes central and what finding about that feature would count against it, name the layer of each claim, and keep the marker apart from the theory.

      **Next:** part 2 has problems 4 and 5. One scenario brings together animals, free will and the self: a creature whose brain is unlike ours, a choice recorded before it is reported, and the question of who is choosing.
