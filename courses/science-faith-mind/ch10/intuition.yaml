id: ch10-intuition
title: Quick Recall
kind: intuition

cards:
  - type: text
    id: welcome
    title: "Quick recall: mind and self"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: the three replies to the hard problem, the zombie argument, correlation against identity, workspace against higher-order theories, toy integration, the positions on free will, personal identity, the views of the soul and the questions about machines.

      Three kinds of card: **mnemonics** (the shape of a distinction), **build cards** (assemble a count) and, at the end, **numeric cards that give you data only**: you choose the rule yourself.

      As always, every answer is *according to* someone or some view. Nothing here asks you to decide what consciousness is.

  - type: mcq
    id: three-replies
    title: "Three replies to the hard problem"
    prompt: |
      The hard problem asks why the functions of the brain (discriminating, reporting, attending) are accompanied by experience. Match each reply to its core move.
    options:
      - text: 'Illusion (Dennett, Frankish): the puzzle comes from a misleading picture of our own states. Gap to be closed (a type of physicalist): the gap is in our concepts and knowledge, not in the world. Real (Chalmers): experience is a further feature, so physics alone is not enough.'
        correct: true
      - text: 'Illusion: experience is a further feature of the world. Gap: the brain is an illusion. Real: the puzzle comes from a misleading picture.'
        feedback: |
          Scrambled. Only the third reply says experience is a further feature, and nobody says the brain is an illusion.
      - text: 'Illusion: experience does not exist, so nobody is ever in pain. Gap: the pain is only a report. Real: pain is a function.'
        feedback: |
          Illusionists deny that experience has the puzzling intrinsic features philosophers attribute to it, not that creatures suffer or report pain. And "pain is a function" is the easy-problem answer, which leaves the hard problem open.
      - text: 'All three replies say the hard problem is solved once the easy problems are solved.'
        feedback: |
          Only the first comes close, by saying the remaining puzzle is a mistake. The other two take the leftover question seriously.
    explanation: |
      Mnemonic: **illusion, gap, real**: the puzzle is *mistaken*, *temporary* (a gap in our understanding, to be closed), or *a fact about the world*.

  - type: order
    id: zombie-order
    title: "The zombie argument"
    prompt: |
      According to Chalmers, put the steps of the zombie argument in order.
    steps:
      - 'It is conceivable that there is a being physically identical to a conscious person but with no experience (a zombie).'
      - 'Whatever is conceivable in this full sense is metaphysically possible.'
      - 'So zombies are possible.'
      - 'If a world with the same physics can lack experience, the physical facts do not fix the experiential facts.'
      - 'So physicalism, which says they do, is false.'
    hint: 'Conceivability, then the bridge to possibility, then the consequence.'
    explanation: |
      Mnemonic: **conceivable, so possible, so physicalism fails**. A critic rejects the first step (Dennett's zombic hunch) or the bridge (necessary a posteriori identities such as Hesperus and Phosphorus, which seem conceivably distinct yet are not).

  - type: mcq
    id: relations
    title: "Correlation, dependence, identity"
    prompt: |
      A complete map shows that a specific experience always occurs together with a specific neural event, and that disrupting the event removes the experience. Which statement does the map, by itself, support?
    options:
      - text: 'Correlation, and probably dependence of the experience on the event. Whether the experience *is* the event (identity) is an argued philosophical claim, not something a recording can show.'
        correct: true
      - text: 'Identity, because correlation this tight leaves no other possibility.'
        feedback: |
          Dualists and panpsychists accept tight correlation and deny identity. The map cannot tell "is" from "always accompanies".
      - text: 'Nothing, since correlation never suggests dependence.'
        feedback: |
          Disrupting the event and losing the experience is a manipulation, which is stronger evidence than a bare correlation. It supports dependence, though not which kind.
      - text: 'It settles the zombie argument, because the map shows zombies cannot exist.'
        feedback: |
          Even a complete map does not touch the second premise of the zombie argument: whether what always goes together in our world could come apart in a possible one.
    explanation: |
      Mnemonic: **goes with, depends on, is**: three rungs, and recordings climb only the first two.

  - type: mcq
    id: workspace-hot
    title: "Broadcast or a thought about the state"
    prompt: |
      A face flashes on a screen. Its image is processed in visual areas, then amplified and made available to memory, speech and planning, but nothing in the subject represents "I am seeing a face". According to the two theories, is it conscious?
    options:
      - text: 'Global workspace theory says yes (it was broadcast). A higher-order theory says no (no thought says the subject is in that state).'
        correct: true
      - text: 'Both say yes, since the face was processed and amplified.'
        feedback: |
          Higher-order theories need a thought about the state, and here there is none. Processing and broadcast alone are not enough for them.
      - text: 'Both say no, since nobody reported it.'
        feedback: |
          Global workspace theory counts broadcast, not report. Report is the usual evidence, not the definition.
      - text: 'Global workspace theory says no and higher-order theory says yes.'
        feedback: |
          Reversed. Workspace theory looks for broadcast, which is present; higher-order theory looks for a thought about the state, which is absent.
    explanation: |
      Mnemonic: **workspace = broadcast to many users; higher-order = a thought about the state**. Cases like this one are where the criteria part ways, which is why the theories can be tested against each other.

  - type: mcq
    id: toy-cut
    title: "Toy integration"
    prompt: |
      In the lesson's toy model, a network of nodes joined by links is scored by the smallest number of links crossing any split of the nodes into two groups (the weakest cut). It is a stand-in for integrated information, not the real measure. A chain of five nodes A-B-C-D-E scores $1$ and a ring of five scores $2$. What does a higher score mean in the toy?
    options:
      - text: 'The network is harder to cut into independent halves: more is lost whatever way it is divided.'
        correct: true
      - text: 'The network has more nodes.'
        feedback: |
          A chain and a ring of the same five nodes score differently. The score reflects how the nodes are linked.
      - text: 'The network is conscious, as the model proves.'
        feedback: |
          The toy proves nothing about consciousness. Tononi's real measure uses directed causes and effects; the toy only shows what "integration" is getting at.
      - text: 'The network has more links in total.'
        feedback: |
          Total links do not decide it: a star with many links on one node still has an easy cut separating a leaf. What counts is the weakest way to split.
    explanation: |
      Mnemonic: **a network is as integrated as its weakest cut**. A chain breaks by cutting one link; a ring needs two cuts.

  - type: build
    id: splits-build
    title: "Counting the splits"
    prompt: |
      A network has $n$ nodes. A split is a way to divide them into two non-empty groups (swapping the two groups gives the same split). Build the number of splits.
    prefix: "\\text{splits}="
    tiles: ['2^{\,n-1}', '-1', '2^{\,n}', '+1', 'n^2']
    answers:
      - ['2^{\,n-1}', '-1']
    wrong:
      - answer: ['2^{\,n}', '-1']
        feedback: |
          $2^n-1$ would be about right if the two groups were told apart (which side is "first"), up to the empty one. Swapping the groups gives the same split, which halves the count.
      - answer: ['2^{\,n-1}']
        feedback: |
          This still includes the split with all nodes in one group and none in the other. That is not a split into two non-empty groups.
    hint: 'Each node goes to one of two sides; fix one node to remove the swap; remove the case with an empty group.'
    explanation: |
      Each of the $n$ nodes takes one of two sides ($2^n$ ways); swapping sides gives the same split, so $2^{n-1}$; one of those has an empty group. For five nodes this gives $15$ splits. Check: $n=2$ gives $1$, the only way to separate two nodes.

  - type: mcq
    id: free-will-sort
    title: "Three positions on free will"
    prompt: |
      Determinism says the past and the laws fix every future event. Sort the positions according to their standard defenders.
    options:
      - text: 'Libertarians (Kane, Chisholm): free will is real and determinism is false. Hard incompatibilists (Pereboom): free will is incompatible with determinism, and we lack it. Compatibilists (Hume, Frankfurt, Dennett): free will is compatible with determinism.'
        correct: true
      - text: 'Libertarians: free will is compatible with determinism. Compatibilists: determinism is false. Hard incompatibilists: we lack it only if it is true.'
        feedback: |
          Scrambled. The libertarian and the hard incompatibilist agree that free will excludes determinism; they differ on whether we have it. The compatibilist denies the exclusion.
      - text: 'All three say determinism is true; they differ only in vocabulary.'
        feedback: |
          They differ in substance. Libertarians deny determinism, and the other two split on what free will requires.
      - text: 'Compatibilists deny that people ever choose anything.'
        feedback: |
          Compatibilists say people choose and are responsible; they hold that choosing, in the sense that matters, is not undone by determinism.
    explanation: |
      Mnemonic: **two questions**: does free will exclude determinism? is determinism true? Libertarian: excludes, false. Hard incompatibilist: excludes, so we lack it. Compatibilist: does not exclude.

  - type: mcq
    id: fatalism
    title: "Determinism is not fatalism"
    prompt: |
      A person says: "If determinism is true, whatever I choose, the same thing would have happened, so deliberating is pointless." Which reply is the compatibilist one?
    options:
      - text: 'Determinism says your deliberation is one of the causes of what happens; fatalism says the outcome happens whatever you do. Only the second makes deliberating pointless.'
        correct: true
      - text: 'Determinism and fatalism are the same thing, and both are false.'
        feedback: |
          They differ in whether your choices are among the causes. Fatalism removes them from the chain; determinism includes them.
      - text: 'Deliberation is pointless, but we cannot stop doing it.'
        feedback: |
          That concedes the objection. The compatibilist says deliberating is part of how the outcome is produced, so it is not pointless.
      - text: 'Determinism lets deliberation change the laws.'
        feedback: |
          Nothing changes the laws. Deliberation is an event inside the world the laws govern, and what you decide depends on it.
    explanation: |
      Mnemonic: **determinism: caused through your choices; fatalism: happens despite them**. The incompatibilist objection is not that deliberation is pointless but that the choices themselves were fixed before you were born.

  - type: mcq
    id: parfit
    title: "Connectedness and continuity"
    prompt: |
      According to Derek Parfit, a person at a later time is *connected* to an earlier self through direct links (a memory, an intention carried out, a shared trait), and *continuous* with it through an overlapping chain of such links. Which pair is right?
    options:
      - text: 'Connectedness is direct and comes in degrees; continuity is a chain of overlapping connections. A distant self can be continuous with an earlier one though they share almost no direct links.'
        correct: true
      - text: 'Connectedness is the chain; continuity is the single direct link.'
        feedback: |
          Reversed. Direct links are connections; the chain is what continuity means.
      - text: 'Both are all-or-nothing, so a person either is or is not the same one.'
        feedback: |
          Parfit stressed that both come in degrees, and argued that what matters in survival is the degree of connection and continuity, not an all-or-nothing identity.
      - text: 'Connectedness needs the same body; continuity does not.'
        feedback: |
          Neither is defined by the body. They concern psychological links; whether the body matters is the animalist question.
    explanation: |
      Mnemonic: **connected = direct, continuous = chained**. Parfit's claim that identity is not what matters is a philosophical position that others reject, Olson (animalism) among them.

  - type: mcq
    id: brain-damage
    title: "The brain-damage argument for no soul"
    prompt: |
      A critic of the separable soul argues: damage to the brain changes memory, character and consciousness; so the mind depends on the brain; so the mind does not survive the brain's death. According to defenders of a soul (or of survival), which unstated premise carries the move from dependence to the death of the mind?
    options:
      - text: 'That the dependence is total and permanent: that nothing of the mind, in any state, can continue without the brain.'
        correct: true
      - text: 'That damage to the brain never changes anything.'
        feedback: |
          The argument uses the opposite fact. The damage evidence is its starting point.
      - text: 'That the soul is made of matter.'
        feedback: |
          The argument does not need that. Some defenders of the soul accept that the brain is a necessary instrument now and deny that it is the only possible one.
      - text: 'That near-death experiences prove survival.'
        feedback: |
          That is a premise of the other side, and the evidence from the studies is much weaker.
    explanation: |
      Mnemonic: **depends on is not the same as depends entirely**. A radio's sound depends on the receiver, yet the broadcast exists without it; the defender claims only that this is possible, and the critic replies that the model adds an entity the evidence does not need.

  - type: mcq
    id: machines-sort
    title: "What each machine view claims"
    prompt: |
      A program passes the imitation game and also meets a long list of indicator properties drawn from the scientific theories of consciousness. Match the view to what it says.
    options:
      - text: 'Turing: an overall behaviour test replaces the vague question "can it think". Searle: a program on its own manipulates symbols without meaning, so it is not enough for a mind. The indicator report (Butlin, Long et al.): under computational functionalism, a list of properties is evidence, not proof, of consciousness.'
        correct: true
      - text: 'Turing: passing proves consciousness. Searle: any program that passes has a mind. The indicator report: a list of properties settles it.'
        feedback: |
          Turing proposed replacing the question by a test, not proving experience; Searle argued the opposite of what is given; and the report calls its list evidence under a working assumption.
      - text: 'Turing: only brains can think. Searle: behaviour tests are the only evidence. The indicator report: no property could ever count.'
        feedback: |
          Searle's biological naturalism is the view that brains cause minds, but Turing argued nothing like that, and the report lists properties precisely because they could count.
      - text: 'All three agree that functional organisation is irrelevant.'
        feedback: |
          Turing and the report lean on function. Searle says function (the program) is not enough.
    explanation: |
      Mnemonic: **behaviour (Turing), syntax is not semantics (Searle), indicators under a hypothesis (the report)**. The point of disagreement is whether the right organisation is sufficient, not whether machines are possible.

  - type: numeric
    id: splits-numeric
    title: "Splits of a bigger network"
    prompt: |
      A network has $8$ nodes. In how many different ways can the nodes be divided into two non-empty groups, when swapping the two groups counts as the same division?
    answer: 127
    wrong:
      - value: 255
        feedback: |
          That treats the groups as labelled. Swapping them gives the same division, which halves the number, up to the one case with an empty group.
      - value: 128
        feedback: |
          This includes the case with all eight nodes in one group and none in the other.
      - value: 64
        feedback: |
          Eight nodes on two sides: think of each node's choice, then correct for the swap and for the empty group.
    hint: 'Count the ways each node picks a side, then remove what counts twice and what is not allowed.'
    explanation: |
      Each node takes one side: $2^8=256$ ways. Swapping gives the same division, so $128$. One of those has an empty group, leaving $127$.

  - type: numeric
    id: complete-numeric
    title: "Weakest cut of a complete network"
    prompt: |
      Five nodes, and every pair is joined by one link (10 links in all). The toy score is the smallest number of links crossing any split into two non-empty groups. What is the toy score?
    answer: 4
    wrong:
      - value: 6
        feedback: |
          That is the number of links crossing a split with $2$ nodes on one side ($2\times3$). A split with one node alone crosses fewer.
      - value: 10
        feedback: |
          That is all the links. A split leaves the links inside each group uncut.
      - value: 1
        feedback: |
          One crossing link is a chain's score. Here each node is joined to all the others.
    hint: 'Try splits of sizes $1$ and $4$, and $2$ and $3$, and count the links that cross each.'
    explanation: |
      A split with $k$ nodes on one side and $5-k$ on the other crosses $k(5-k)$ links: $4$ for $k=1$ and $6$ for $k=2$. The smallest is $4$, the weakest cut isolates one node.

  - type: numeric
    id: libet-numeric
    title: "How long before the movement?"
    prompt: |
      In Libet's 1983 experiment, a slow build-up of brain activity (the readiness potential) began, on average in the simple case, about $550$ ms before a finger movement. Subjects placed their first awareness of the urge to move at about $200$ ms before the movement. How many milliseconds earlier did the brain activity begin?
    answer: 350
    wrong:
      - value: 750
        feedback: |
          That adds the two times. Both are measured backwards from the movement, so the difference is what separates them.
      - value: 200
        feedback: |
          That is the reported awareness time, measured from the movement. The question asks for the gap between the two earlier events.
    hint: 'Both times are measured back from the movement; compare them.'
    explanation: |
      $550-200=350$ ms. Whether this gap shows that decisions are made before we know it is disputed: the build-up may be background noise (Schurger, Sitt and Dehaene), and the reported time of awareness is hard to measure.

  - type: numeric
    id: decay-numeric
    title: "Links with your earlier self"
    prompt: |
      A toy model of psychological links: each day, $90\%$ of the memories a person has one day are still held the next day, and the loss is the same each day. What fraction of a person's memories from today are still held ten days later? Give it to two decimal places.
    answer: 0.35
    tolerance: 0.005
    answerText: '0.35'
    wrong:
      - value: 0.9
        feedback: |
          That is the fraction after one day. The loss acts again on each of the ten days.
      - value: 0
        feedback: |
          A daily loss of $10\%$ does not remove everything in ten days: each day only a tenth of what is left goes.
      - value: 0.1
        feedback: |
          That would be a total loss of $90\%$ in one step. The loss is $10\%$ of what is left, each day.
    hint: 'A fixed fraction kept each day compounds; think of repeated scaling.'
    explanation: |
      Each day keeps $0.9$ of what was held, so after ten days $0.9^{10}\approx0.35$. The chain stays continuous throughout, even though today's self and the self ten days on share only about a third of the direct links: Parfit's connectedness fades while continuity does not break.

  - type: numeric
    id: aware-numeric
    title: "AWARE-II survivors"
    prompt: |
      In AWARE-II, $567$ people had a cardiac arrest in hospital and $53$ of them survived to be considered for interview. What percentage survived? Give it to one decimal place.
    answer: 9.3
    tolerance: 0.05
    answerText: '9.3'
    wrong:
      - value: 10.7
        feedback: |
          That is $567/53$, the number of arrests per survivor, not a percentage.
      - value: 0.093
        feedback: |
          That is the fraction. Multiply by $100$ for percent.
    hint: 'Survivors out of all arrests, as a percent.'
    explanation: |
      $53/567\approx0.0935$, about $9.3\%$. Of those survivors, $28$ were interviewed and $11$ reported memories; none identified the hidden picture.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Hard problem and replies.** The easy problems are about functions; the hard problem asks why they are accompanied by experience. Replies: it is an illusion (Dennett, Frankish), a gap in our understanding to be closed, or a real feature (Chalmers).

      **Zombie argument.** Conceivable, so possible, so physicalism fails:

      $$\begin{aligned}\text{conceivable}&\Rightarrow\text{possible}\\&\Rightarrow\text{physicalism false}\end{aligned}$$

      Critics reject the first step or the bridge. Neural correlates give correlation and dependence, never identity by themselves.

      **Theories and the toy.** Global workspace: a state is conscious when it is broadcast. Higher-order: when a thought says one is in it. In the toy model of integration, with $n$ nodes joined by links, the score is the number of links crossing the weakest split, and the number of splits into two non-empty groups is

      $$2^{\,n-1}-1$$

      A chain of five scores $1$, a ring of five $2$. It is a stand-in, never the real measure.

      **Free will, self, soul, machines.** Libertarian, hard incompatibilist and compatibilist differ on whether free will excludes determinism and whether it is real; determinism is not fatalism. Libet's readiness potential began about $550-200=350$ ms before the reported awareness. Parfit: connectedness is direct, continuity is a chain, and a decay of $90\%$ per day leaves $0.9^{10}\approx0.35$ after ten days. The brain-damage argument needs the premise that dependence is total and permanent. Turing tests behaviour, Searle says syntax is not semantics, and the indicator report treats properties as evidence under computational functionalism. In AWARE-II, $53/567\approx9.3\%$ survived.

      **Next:** the content map of this level, where you rebuild the chapter's concept map box by box among look-alike decoys.
