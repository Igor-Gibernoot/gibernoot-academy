id: ch10-free-will
title: "Free Will"
kind: concept
own: |
  The setting: a person chooses something (raises an arm, signs a contract) and we ask whether the choice was **free**, meaning the kind of control that makes the person responsible for it. Two questions are tangled together: what the brain does before a choice (a question for experiment), and what freedom requires (a question for argument).
  - **Determinism.** According to the standard definition, determinism says that the state of the world at one time plus the laws of nature fix everything that follows. Writing $H$ for a full description of the distant past, $L$ for the laws of nature and $P$ for any true statement about what a person does later, determinism is the claim
  {{ $$(H \wedge L) \Rightarrow P$$ }}
  Determinism is not fatalism (what happens regardless of what you do) and not predictability (nobody need be able to compute it).
  - **Libet and after.** According to Benjamin Libet (1983), in a task where people flexed a wrist when they felt like it, a slow brain signal (the readiness potential, RP) began about 550 ms before the movement, while the reported moment of the urge was about 200 ms before it. Later work reads this differently: Schurger, Sitt and Dehaene (2012) argued that the RP, averaged backwards from the movement, can arise from random fluctuations crossing a threshold; Soon et al. (2008) predicted a left or right press from brain activity several seconds ahead, but only above chance, not perfectly. Neither shows that conscious decisions play no role in deliberate choices that matter.
  - **Three positions.** According to {{ **libertarians** }} (for example Robert Kane), free will needs more than determinism allows, so determinism is false for free choices. According to **hard determinists or hard incompatibilists** (for example Derk Pereboom), determinism or indeterminism leaves no free will worth the name. According to **compatibilists** (Hume, Dennett), a free act is one that flows from the agent's own reasons and wishes without compulsion, and that can be true even if determinism is true.
  - **The consequence argument.** According to Peter van Inwagen (1983), if determinism holds, our acts follow from the remote past and the laws, which were fixed before we were born and are not up to us; so our acts are not up to us either. Critics reject the step that passes "not up to us" along a chain of consequences (rule Beta), or say that "could have done otherwise" means "would have, had one chosen otherwise".
  - **Frankfurt cases.** According to Harry Frankfurt (1969), a person can be responsible for an act even if they could not have done otherwise: a hidden backup (Black) would have forced the same act, but never needed to act. If so, responsibility needs the act to come from the agent, and not {{ the ability to do otherwise }}.
  - **Religious angle.** According to Calvin (1559), God's eternal decree predestines each person; Reformed writers add that the will is still voluntary though bound. According to the Ash'ari school in Islam, God creates all acts and humans "acquire" them (*kasb*); the Mu'tazila held that humans create their own acts. These are faith commitments about God and freedom, kept apart from the experimental and philosophical results.
  - **Open.** Each view says what would count against it, and the lab does not decide between them: the parties differ mainly on what "free" must mean and on whether responsibility needs alternatives or only sourcehood.
cards:
  - type: mcq
    id: hook
    title: "Guess: does the head start threaten freedom?"
    prompt: |
      You decide to raise your arm, and you feel that you did it freely. Suppose scientists could show that a part of your brain began preparing the movement a fraction of a second *before* you felt the urge to move. Before any theory: what would that show about whether you acted freely?
    options:
      - text: 'That the act was not free, since the brain started it before I knew.'
        feedback: |
          This is the tempting reading, and it is the one the experiment is famous for. But it assumes that "free" means "started by my conscious feeling of deciding", and that the early signal is already the decision. Both assumptions need an argument, and the lesson shows that each is disputed.
      - text: 'Nothing at all, since I felt free.'
        feedback: |
          Feeling free is evidence, but weak evidence about what causes the act: we also feel certain of things that turn out false. A fair answer has to look at what the signal is and what freedom is supposed to require.
      - text: 'It depends on two things: what the early signal really is (a decision, or only a preparation or a fluctuation), and what freedom requires in the first place.'
        correct: true
        feedback: |
          Yes. One question is about the experiment and the other about the concept of freedom, and thoughtful people differ on both. The lesson takes them in that order and then lets the positions meet.
    explanation: |
      Two questions are tangled: an experimental one (what happens in the brain, and when) and a conceptual one (what would make an act free, and what is responsibility for). Neither can be answered by the other alone.

  - type: text
    id: recall
    title: "Recall: the brain goes with experience"
    body: |
      From the lessons What the Brain Shows and Integrated Information and Other Rivals: a **neural correlate** of an experience is brain activity that reliably goes with it, found by comparing what the brain does when the person does and does not report the experience. Correlates say *that* the brain and experience go together and *when*; they do not by themselves say which of the two produces the other, or whether the one is the other.

      Free will adds a new twist. Here the timing of brain activity is compared with the timing of a person's *decision*, and the question is who is in charge. A reminder of terms: **free will** here means the kind of control over our acts that makes us responsible for them; a person is **morally responsible** for an act when praise or blame for it is fitting.

  - type: text
    id: determinism
    title: "Determinism, and what 'could have done otherwise' means"
    body: |
      According to the Stanford Encyclopedia of Philosophy, **determinism** says that the state of the world at one time, together with the laws of nature, fixes everything that comes after. In symbols, with $H$ a complete description of the distant past, $L$ the laws and $P$ any truth about what you do later:

      $$(H \wedge L) \Rightarrow P$$

      Two things it does not say. It is not **predictability**: Laplace imagined a mind that knew all forces and positions and could foresee everything, but determinism is a claim about the world, not about anyone's ability to compute it. And it is not **fatalism**, the claim that things happen whatever you do: in a deterministic world your choices are among the causes.

      Whether our world is deterministic is open. Quantum mechanics is often called indeterministic, but according to the same source this depends on the interpretation: those with a collapse of the wavefunction (such as the Copenhagen view) are indeterministic, while many-worlds and Bohmian mechanics are deterministic.

      Now the phrase at the centre. "I could have done otherwise" can mean three different things. *Unconditional*: with the past and laws exactly as they were, a different act was really possible. *Conditional*: had I wanted or chosen differently, I would have acted differently. *Responsiveness*: I would have acted differently had I had a good enough reason. Much of the debate is about which of these freedom needs.

  - type: text
    id: libet
    title: "The Libet experiment"
    image:
      src: img/libet-clock.webp
      alt: "A clock face with marks at 0, 15, 30 and 45 seconds and a red dot near the 30 mark"
      caption: "A Libet clock: a dot circles a clock face, and the person reports where it was at the moment they first felt the urge to move."
      credit: "Tesseract2, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:LibetClock.jpg"
    body: |
      Benjamin Libet (1916-2007) was a physiologist at the University of California, San Francisco. With Gleason, Wright and Pearl he published in 1983 an experiment in the journal *Brain*. People were asked to flex a wrist whenever they felt like it, with no plan about when, while watching a spot circle a clock face. Afterwards each person said where the spot had been when they first felt the urge or intention to move. Electrodes on the scalp recorded a slow negative drift of electrical activity, the **readiness potential** (RP), and a record of the muscle gave the moment of movement.

      In the commonly cited summary of the results, the RP began about 550 ms before the movement, while the reported moment of the urge, called W, came about 200 ms before it. The paper itself reports the gap in series with no preplanning as about 350 ms on average, and a longer gap (about 800 ms) in series where the people said they had preplanned. Libet's reading: the brain initiates the act before the person is aware of wanting it.

      | Time before the movement | Event |
      |---|---|
      | about 550 ms | readiness potential begins (averaged over many trials) |
      | about 200 ms | the reported urge, W |
      | 0 ms | the movement |

  - type: numeric
    id: gap
    title: "How long was the head start?"
    prompt: |
      In the commonly cited summary of Libet's task, the readiness potential began about 550 ms before the movement and the reported urge came about 200 ms before the movement. How many milliseconds before the reported urge did the readiness potential begin?
    answer: 350
    tolerance: 0.5
    wrong:
      - { value: 750, feedback: 'That adds the two times. Both are measured backwards from the movement, so the gap between them is a difference.' }
      - { value: 200, feedback: 'That is the time from the reported urge to the movement, not the gap between the RP and the urge.' }
    hint: Both times are measured backwards from the same moment, the movement.
    explanation: |
      The RP began 550 ms before the movement and the urge 200 ms before it, so the RP came first by $550 - 200 = 350$ ms. This matches the gap of about 350 ms that the 1983 paper reports for the series without preplanning.

  - type: mcq
    id: libet-q
    title: "What exactly was measured?"
    prompt: |
      In Libet's 1983 experiment, how was the moment of the "urge to move" found?
    options:
      - text: 'A brain recording showed a spike when the person became aware of the urge.'
        feedback: |
          No such spike is known. The RP is a slow drift that starts earlier; the moment of awareness had to come from the person.
      - text: 'The person reported, after each movement, where the spot on the clock had been when they first felt the urge.'
        correct: true
        feedback: |
          Yes. W is a recalled report, with the usual limits of timing a private feeling: it depends on attention, memory and the clock. Libet himself corrected for a bias of about 50 ms in people's timing of skin stimuli. The RP, in contrast, is an average of many trials time-locked to the movement.
      - text: 'The experimenter predicted the movement from the RP and asked the person to confirm it.'
        feedback: |
          In this design the RP could not be seen on a single trial; it appears only after averaging many trials aligned to the movement. So the experimenters could not predict each movement from it.
    explanation: |
      Two measurements with different natures are compared: a physical average of many trials, and a recalled report of a private feeling. Any argument built on their gap inherits the weaknesses of both.

  - type: text
    id: reread
    title: "How later work reads the signal"
    body: |
      According to Libet (1985, in a later paper), the 200 ms between the urge and the movement still leaves a window to **veto** the act, to cancel it at the last moment. Critics such as Alfred Mele reply that this is hard to test with a design that records the movement itself, and that a veto does not remove the earlier unconscious start.

      Four lines of later work shape the current debate. **Soon, Brass, Heinze and Haynes (2008, *Nature Neuroscience*)**: people freely chose a left or right button press, and a pattern classifier could predict the choice from activity in prefrontal and parietal cortex up to about 10 seconds before the person reported deciding, above chance but far from perfect. The authors themselves noted that the work does not settle the free-will question. **Fried, Mukamel and Kreiman (2011, *Neuron*)**: recording 1019 neurons in twelve people, they found neurons gradually recruited over about 1500 ms before the reported decision, enough to predict its time to within a few hundred ms.

      **Schurger, Sitt and Dehaene (2012, *PNAS*)** gave a rival reading. In a model where random fluctuations of neural activity drift toward a threshold and the movement happens when it is crossed, averaging the trials backwards from the movement produces a slow rising curve like the RP, even though no earlier decision was made. On this reading the RP is not a decision signal but a feature of how the average is made. **Maoz, Yaffe, Koch and Mudrik (2019, *eLife*)** found readiness potentials before arbitrary choices but not before deliberate ones (which of two non-profit organizations should get a 1000-dollar donation), suggesting that the classical experiments are about a particular kind of choice, the kind with no reason to prefer either option.

  - type: mcq
    id: shows
    title: "What does the experiment show, and not show?"
    prompt: |
      Which of these claims are supported by the Libet-style results, read as carefully as the later work allows? Select all that apply.
    multiple: true
    options:
      - text: 'In a task with no reason to choose one moment over another, some brain activity precedes the reported urge.'
        correct: true
        feedback: |
          Yes. This is the robust empirical core, on which both the original reading and the fluctuation reading agree, though they differ on what the activity is.
      - text: 'Conscious decisions never cause any action.'
        feedback: |
          This overreaches. The task used arbitrary wrist flexes with no stakes, and the 2019 study found no RP before deliberate choices. A result about arbitrary timing does not cover choosing a career or a vote.
      - text: 'The readiness potential, averaged over trials, is by itself proof that the decision was already made.'
        feedback: |
          Not shown. If the RP is an artifact of averaging noisy fluctuations, as Schurger and colleagues propose, it can look like a build-up toward a decision when no decision has yet been made.
      - text: 'Whether such results bear on free will depends partly on what freedom is taken to require.'
        correct: true
        feedback: |
          Yes. A libertarian who requires that the choice be uncaused by prior events will read early brain activity differently from a compatibilist, for whom a choice made from one's own reasons is free whatever precedes it.
    explanation: |
      Layer 1 (established): there is brain activity before the reported urge in this task. Layer 2 (live debate): what that activity is. Layer 3 (philosophical commitment): what freedom requires, which no recording can settle by itself.

  - type: text
    id: hard
    title: "Position one: hard determinism and hard incompatibilism"
    body: |
      **Incompatibilists** hold that free will and determinism cannot both be true. Those who add that we lack free will are called **hard determinists** when they think determinism is true, and, in Derk Pereboom's version (*Living Without Free Will*, 2001), **hard incompatibilists**: he argues that factors beyond our control, whether deterministic or chance, produce all our acts, so we are not morally responsible for them in the deepest sense.

      The best case: if my act is the outcome of my genes, upbringing and the situation, none of which I chose, then it is hard to see how I could deserve ultimate credit or blame. Pereboom adds a manipulation argument: someone who is manipulated by neuroscientists into having the very reasons and desires that cause an act is plainly not responsible, and he asks what difference it makes that in the real case the manipulating factors are natural.

      On responsibility, adherents say that we can drop retribution (punishing because the person deserves to suffer) and keep other aims of law and ethics, such as protecting others and reforming offenders.

  - type: mcq
    id: hard-q
    title: "Where does the hard incompatibilist argument push?"
    prompt: |
      According to Pereboom, someone is manipulated into having exactly the desires that cause an act. He argues the person is not responsible, and that a natural cause chain with the same structure is no different. What would a compatibilist most likely reply?
    options:
      - text: 'In the natural case the desires are the agent''s own and respond to reasons; in the manipulation case they were installed to bypass the agent''s reasoning, so the cases differ.'
        correct: true
        feedback: |
          Yes. This is the standard compatibilist reply: what matters is whether the act flows from the agent's own reasons-responsive mechanism, and manipulation can destroy that without determinism doing so.
      - text: 'Manipulated people are always responsible.'
        feedback: |
          Few compatibilists say this. The reply is that manipulation removes responsibility *because* it bypasses the agent's reasons, not because the act is caused.
      - text: 'Determinism is false, so the case does not arise.'
        feedback: |
          That is the libertarian answer, not the compatibilist one. A compatibilist accepts the possibility of determinism and denies that it removes freedom.
    explanation: |
      The dispute is over what the manipulation case removes: the causal history as such (the hard incompatibilist) or the agent's own reasoning (the compatibilist).

  - type: text
    id: libertarian
    title: "Position two: libertarianism"
    body: |
      In this context **libertarianism** has nothing to do with politics. It says that free will is real, that it is incompatible with determinism, and so that determinism is false at least where free choices are made. The Stanford Encyclopedia distinguishes versions.

      **Event-causal** libertarians, such as Robert Kane (*The Significance of Free Will*, 1996), say that rare, difficult choices made while torn between competing aims are undetermined, and by making them we shape the character that later choices flow from. **Agent-causal** libertarians, such as Thomas Reid (1788) and Roderick Chisholm (1966), say that the agent herself is a cause beyond her reasons and the prior events. **Non-causal** versions hold that a choice is ours simply because it occurs in us.

      The best objection is **luck**: if nothing before the choice settles which way it goes, why is the outcome not just chance, and how can chance be what makes me responsible? Defenders reply, for example, that the agent's reasons and effort still shape the outcome, or that the agent is a real cause. Another objection is empirical: whether our brains leave room for such undetermined choices is open.

  - type: mcq
    id: lib-q
    title: "The luck objection"
    prompt: |
      A libertarian says that a free choice is not determined by earlier events. The luck objection says this makes the choice a matter of chance. Which reply fits event-causal libertarianism, such as Kane's?
    options:
      - text: 'The choice is undetermined, but the agent''s reasons and effort help bring it about, so the outcome is not mere chance.'
        correct: true
        feedback: |
          Yes. Kane describes a person torn between aims, each of which they are trying to realise; whichever way the choice goes, it expresses an effort of the agent, so it is the agent's choice and not just a coin toss.
      - text: 'Chance is always compatible with responsibility, so the objection does not matter.'
        feedback: |
          This is not the reply: the objection says chance seems to *remove* control, and the defender has to argue that it does not in these cases.
      - text: 'The agent is a being outside the causal order who is not touched by chance.'
        feedback: |
          That is closer to the agent-causal version, which Kane does not hold. His view keeps the choice within the causal order, with indeterminism in the effort of will.
    explanation: |
      Every position has one objection it must answer: libertarians owe an account of control without determination; hard determinists, an account of why responsibility talk is not simply false; compatibilists, why the freedom they offer is worth wanting.

  - type: text
    id: compat
    title: "Position three: compatibilism"
    body: |
      **Compatibilism** holds that free will is compatible with determinism. According to the Stanford Encyclopedia, **classical** compatibilists such as Hobbes and Hume (1711-1776) said that freedom is the ability to do what one wants without impediments such as compulsion. Hume argued that the idea of liberty in the sense of acts with no cause would make acts mere chance, and so would remove responsibility.

      Later versions refine this. Harry Frankfurt (1971) said that a free act flows from a will the agent *wants* to have, a wish about one's wishes. Daniel Dennett (1942-2024, *Elbow Room*, 1984) argued that the kinds of free will worth wanting do not need the ability to do otherwise in the unconditional sense, and **reasons-responsive** views say that an agent is responsible when their mechanism of choice would respond to good reasons had there been any.

      The best objection is that this changes the subject: the "freedom" on offer is just acting on one's desires, which in a deterministic world were fixed long ago. Compatibilists reply that this is the freedom we actually use in ordinary life to distinguish the free from the coerced, the addicted or the insane, and that the distinction matters even if the causes go back to the Big Bang.

  - type: mcq
    id: compat-q
    title: "Same act, three verdicts"
    prompt: |
      Imagine a world that is fully deterministic. A person, after calm thought, signs a contract that they wished to sign. A second person signs at gunpoint. According to compatibilists, what is the difference that matters between them?
    options:
      - text: 'The first act flowed from the person''s own reasons and wishes; the second was forced by a threat that overrode them.'
        correct: true
        feedback: |
          Yes. Compatibilists locate freedom in this difference, which exists in a deterministic world as much as in any other. A hard incompatibilist would add that both chains of causes trace back beyond the person; a libertarian, that the first act is free only if it was not determined.
      - text: 'The first act was uncaused; the second was caused.'
        feedback: |
          Compatibilists deny that the first act is uncaused. They say both acts have causes and differ in *what kind*: the person's own reasoning, or someone else's coercion.
      - text: 'There is no difference, since in a deterministic world both were fixed.'
        feedback: |
          This is the hard determinist's reply. Compatibilists answer that being fixed by one's own reasons and being fixed by a gun are different, and that this is the difference the word "free" tracks.
    explanation: |
      Three positions, three verdicts on one case. The disagreement is about what the word "free" is for.

  - type: text
    id: consequence
    title: "The consequence argument"
    body: |
      The most discussed argument for incompatibilism is Peter van Inwagen's (born 1942), in *An Essay on Free Will* (1983). In plain steps, with $H$, $L$ and $P$ as before:

      **P1.** If determinism is true, then $H$ and $L$ together entail $P$, every truth about what I do.

      **P2.** No one has any choice about $H$, the remote past: it was settled before anyone was born.

      **P3.** No one has any choice about $L$, the laws of nature.

      **P4.** If I have no choice about $H$ and $L$, and they entail $P$, then I have no choice about $P$.

      **C.** So if determinism is true, I have no choice about anything I do.

      The step from P1 to the conclusion is valid if P4 is: it passes "no choice about it" along an entailment (this is the principle called rule Beta). Each premise can be questioned. A critic might reject P3 (Lewis argued that, had I acted differently, the laws would have been slightly different, so I can do what would require a law to be broken without causing that), or P4, since McKay and Johnson showed that rule Beta in its original form has a problem (it implies that "no choice about $p$" and "no choice about $q$" give "no choice about $p$ and $q$", which fails in a coin-toss case), and van Inwagen later accepted that it had to be revised. The argument was never about physics: it is about the logic of "up to me".

  - type: mcq
    id: critic
    title: "Which premise would a critic reject?"
    prompt: |
      A compatibilist who reads "I could have done otherwise" as "if I had chosen otherwise, I would have acted otherwise" accepts that I have no choice about the past and the laws. Which part of the consequence argument do they reject?
    options:
      - text: 'The step from "no choice about the past and laws" to "no choice about my act" (the rule that passes lack of choice along an entailment).'
        correct: true
        feedback: |
          Yes. On the conditional reading, my act can still be one I could have done otherwise, since the relevant choice-conditional is about what I would do, not about changing the past. This is the move critics made against the argument, though incompatibilists reply that the conditional reading has trouble in cases where an agent cannot try.
      - text: 'P2, the claim that no one has any choice about the remote past.'
        feedback: |
          Almost nobody denies this. Rejecting it would mean we can now affect events before our birth.
      - text: 'The definition of determinism in P1.'
        feedback: |
          Compatibilists accept the definition and say that freedom survives it. The argument is not aimed at the definition.
    explanation: |
      The argument is valid if its transfer rule is, so the debate is over whether "no choice about it" really transfers along entailments, and over what counts as "having a choice".

  - type: text
    id: frankfurt
    title: "Frankfurt cases: is responsibility about alternatives?"
    body: |
      Many people have the intuition that we are responsible for an act only if we could have done otherwise (the **principle of alternate possibilities**). In "Alternate Possibilities and Moral Responsibility" (*Journal of Philosophy*, 1969), Harry Frankfurt (1929-2023) challenged it with a type of example.

      Jones is deciding whether to do something. Black wants Jones to do it, and has a device that would force Jones to do it if Black saw that Jones was about to choose otherwise. But Jones decides on his own to do it, so Black never intervenes. Jones could not have done otherwise, because Black would have stopped him, yet it seems that Jones is responsible: nothing Black did played any part in what he did.

      If this works, responsibility depends on where the act comes from (the agent's own reasoning) and not on the existence of alternatives, which helps compatibilists, since determinism threatens exactly the alternatives. Critics (the "flicker of freedom" reply) answer that Jones still has some small alternative, such as the early sign that would have made Black step in, and that this is all responsibility needs.

  - type: mcq
    id: frankfurt-q
    title: "What does the Frankfurt example aim to show?"
    prompt: |
      In Frankfurt's example, Black would have forced Jones to act but never needed to. What is the conclusion Frankfurt draws?
    options:
      - text: 'A person can be morally responsible for an act even if they could not have done otherwise.'
        correct: true
        feedback: |
          Yes. It targets the principle that responsibility requires alternate possibilities. Whether it succeeds is disputed, because of the "flicker of freedom" reply.
      - text: 'Determinism is true.'
        feedback: |
          The example says nothing about determinism. It is about whether responsibility requires alternatives, which bears on whether determinism could remove responsibility.
      - text: 'People are never responsible for what they do.'
        feedback: |
          The opposite: Jones is judged responsible, and that is the point.
    explanation: |
      Notice how this changes the stakes. If alternatives are not needed, then a world without alternatives (a deterministic one) need not remove responsibility. If they are needed, the consequence argument bites.

  - type: text
    id: religion
    title: "Religious angle: foreknowledge and predestination"
    body: |
      This section reports what two traditions teach, as adherents state it, and keeps it apart from the scholarly debate above. These are faith commitments (layer 3), and the lesson does not judge between them.

      **Christianity, Reformed (Calvinist) tradition.** John Calvin (1509-1564), in the 1559 edition of the *Institutes of the Christian Religion*, taught that predestination is God's eternal decree about what becomes of each person, made before the foundation of the world and not on the basis of human merit. Reformed writers add that the human will is always voluntary and so responsible, though bound by sin: they distinguish necessity from coercion.

      **Islam, theological schools.** Muslim theologians debated *qadar* (divine decree). According to the Mu'tazila, humans create their own acts, which protects God's justice in judging them. Abu al-Hasan al-Ash'ari (c. 874-936) held that God creates all acts, and humans "acquire" them (*kasb*), which protects God's omnipotence; critics said this was hard to tell from determinism, and the Ash'aris presented it as a middle path between the Mu'tazila and strict fatalism.

      Some traditions stress foreknowledge more than decree: Mishnah Avot 3:15, attributed to Rabbi Akiva, is usually rendered in essence as "everything is foreseen, yet freedom of choice is given". Commentators read the two halves in several ways.

  - type: mcq
    id: religion-q
    title: "Same question, different shape"
    prompt: |
      According to the Ash'ari school, God creates all acts and humans "acquire" them. Which statement best describes how this differs from a plain claim that God's knowing a person's choice in advance makes the choice unfree?
    options:
      - text: 'The Ash''ari view is about God''s *creating* acts, a question about power; foreknowledge is about God''s *knowing* them, a question about knowledge. Each raises its own puzzle about human freedom.'
        correct: true
        feedback: |
          Yes. Decree or creation asks how human responsibility fits with God's power; foreknowledge asks whether being known in advance makes an act unavoidable. Traditions answer each differently, as the Reformed, Ash'ari, Mu'tazila and Akiva texts show.
      - text: 'They are the same claim in different words.'
        feedback: |
          They differ. One could hold that God knows all acts without causing them, or that God causes them without that being a matter of prior knowledge. The traditions separate them.
      - text: 'The Ash''ari view denies that humans act at all.'
        feedback: |
          The Ash'ari school offered *kasb* precisely to say that humans do act and are responsible, though God is the creator of the act; critics doubted it succeeded.
    explanation: |
      Notice the structural parallel with the scholarly debate: whether responsibility needs alternatives, or only that the act comes from the agent in the right way, is also what traditions are debating in their own terms.

  - type: text
    id: table
    title: "What would count as evidence?"
    body: |
      A map of the views, with what each says about responsibility and what could count for or against it.

      | View | Free will and determinism | What counts for or against it |
      |---|---|---|
      | Libertarian | Free will needs indeterminism | For: indeterminism in the brain at the right place, and an account of control. Against: a deterministic brain, or a successful luck objection |
      | Hard incompatibilist | No free will in the deep sense | For: a successful manipulation or sourcehood argument. Against: a convincing account of control that survives it |
      | Compatibilist | Free will is compatible with determinism | For: that ordinary distinctions (free, coerced, addicted) survive determinism. Against: the claim that this freedom is not worth wanting |
      | Frankfurt-style | Responsibility needs no alternatives | For: cases where alternatives are absent but responsibility stays. Against: the flicker of freedom reply |

      On law: legal systems generally ask whether the person had the mental state for the offence (*mens rea*) and the capacity and control, which sits easily with compatibilism. Greene and Cohen argued that neuroscience will change law by changing intuitions toward consequentialist aims such as protecting others, away from retribution; others, such as Stephen Morse, have argued that the law's concepts of responsibility survive and that neuroscience cannot by itself identify who should be excused.

  - type: mcq
    id: traps
    title: "Misconceptions"
    prompt: |
      Which of these statements are mistakes, in light of what the lesson established? Select all that apply.
    multiple: true
    options:
      - text: 'Determinism means that nothing you do matters, since the result is fixed.'
        correct: true
        feedback: |
          A mistake, and it is called fatalism. In a deterministic world your choices are among the causes of what happens. Determinism says the whole is fixed, not that the outcome comes regardless of your deliberation.
      - text: 'The readiness potential showed that conscious decisions play no role in any action.'
        correct: true
        feedback: |
          A mistake. The task used arbitrary flexes, the RP is an average that may reflect noise crossing a threshold, and the 2019 study found no RP before deliberate choices.
      - text: 'Compatibilists believe in uncaused free choices.'
        correct: true
        feedback: |
          A mistake. They say free acts are caused, in the right way, by the agent's own reasons and wishes.
      - text: 'Libertarianism is a claim that free will exists and requires indeterminism at the point of choice.'
        feedback: |
          This statement is correct, so it is not a mistake: it is what libertarianism says in this debate.
      - text: 'Whether determinism is true is settled by quantum mechanics.'
        correct: true
        feedback: |
          A mistake. According to the Stanford Encyclopedia, it depends on the interpretation of quantum mechanics, and some interpretations are deterministic.
    explanation: |
      Four of the five repeat common errors: fatalism, overreading Libet, misdescribing compatibilism, and treating quantum mechanics as having settled determinism. The remaining one is an accurate statement of the libertarian view.

