id: ch10-zombie
title: "Guided Proof: The Zombie Argument"
kind: guided
proof: true
own: |
  The setting: **physicalism** is the view that everything about a person, including experience, is fixed by the physical facts (brain, body, laws). A **philosophical zombie** is a being that is physically identical to a conscious person, down to every atom, and behaves just as the person does, yet has no experience: there is nothing it is like to be it. According to David Chalmers (b. 1966, *The Conscious Mind*, 1996), building on Robert Kirk's zombies of 1974, zombies give an argument against physicalism.
  - **The argument.** P1: zombies are conceivable (picturing one reveals no contradiction). P2: whatever is conceivable in this full sense is metaphysically possible (could have been the case). P3: if a zombie world is possible, then the physical facts do not fix the experience facts, so physicalism is false. Hence
  {{ $$\begin{gathered}\text{zombies conceivable}\\ \Rightarrow\text{zombies possible}\\ \Rightarrow\text{physicalism false}\end{gathered}$$ }}
  - **Validity versus truth.** The steps from the premises to the conclusion are valid, so the debate is over whether P1 and P2 are true. A false premise makes the argument unsound, not invalid.
  - **Reply 1: deny P1** (Daniel Dennett, 1942-2024, in *Sweet Dreams*, 2005). The "zombic hunch" is {{ a failure to imagine all that a full physical duplicate would do, so no real zombie has been conceived }}.
  - **Reply 2: deny P2** (physicalists who use Saul Kripke's *Naming and Necessity*, 1980). Some truths are {{ necessary but known only by evidence (a posteriori) }}, for example that Hesperus (the evening star) is Phosphorus (the morning star), both being Venus. We could conceive them apart before we knew, yet they cannot differ. The phenomenal concept strategy (Brian Loar, 1997) adds that our concepts of experience are special, which explains why a zombie is conceivable though impossible.
  - **Chalmers's own view.** He accepts P1 and P2: according to him experience is a further fundamental feature of the world, tied to physical processes by laws of nature. This leaves the worry that a zombie twin would make exactly the same claims about experience, so our reports seem explained without it. A live debate, not a result.
  - **What it is not.** It is {{ a claim about what is possible, not a claim that real people lack experience }}.

cards:
  - type: mcq
    id: hook
    title: "Guess: a copy of you with the lights off"
    prompt: |
      Guess before any theory; there is no wrong way to start. Imagine a being that is a perfect physical copy of you: same atoms, same brain, same behaviour. It laughs at jokes, says "ouch" when pinched, and argues about consciousness. Yet inside, there is no experience at all, nothing it is like to be it. Which statement fits your first reaction best?
    options:
      - text: 'I can picture it without any visible contradiction, but whether such a being could really exist is a separate question.'
        correct: true
        feedback: |
          Yes. "I can picture it" and "it could exist" are two different claims, and the whole argument of this lesson lives in the gap between them.
      - text: 'It is plainly impossible: a perfect copy would have to feel what I feel.'
        feedback: |
          Many physicalists say exactly this about whether it could exist. But notice the question was first whether you can picture it. Whether picturing settles anything is what the lesson tests.
      - text: 'It is plainly possible: picturing it is enough to know that it could exist.'
        feedback: |
          This is the tempting shortcut, and it is the step a critic will attack. Some things we can picture turn out to be impossible, as we will see.
    explanation: |
      The **zombie argument** takes our ability to picture such a copy and asks what it would show. We follow it as a proof, premise by premise, and ask at each step what a critic would reject.

  - type: text
    id: recall
    title: "Recall: where the argument comes from"
    body: |
      *Recall.* **Consciousness** here means experience: there is something it is like to be the subject. According to **David Chalmers** (born 1966), the *easy problems* ask how the brain performs functions (discriminating, reporting, controlling behaviour); the *hard problem* asks why performing them is accompanied by experience. **Joseph Levine** (1983) noticed an *explanatory gap*: "heat is molecular motion" explains why heat behaves as it does, but "pain is the firing of C-fibres" (a kind of nerve fibre) leaves open why that firing feels like pain. **Frank Jackson**'s Mary (1982), who knows all the physical facts about colour but has never seen colour, asks whether physical knowledge is all the knowledge there is.

      Three replies were on the table. *Illusionists* such as **Daniel Dennett** (1942-2024) say the sense of a leftover mystery is itself a misleading appearance. Other physicalists say the gap is *epistemic*, a limit on our understanding and not on what exists. Chalmers and others say it is *real*. The zombie argument is the sharpest way of saying the third reply.

      *Layer labels.* That brains correlate with experience is established. Whether the argument below succeeds is a **live debate**. Whether physicalism is true is a **metaphysical commitment**. The lesson takes no side; it says who argues what.

  - type: mcq
    id: define
    title: "What is a philosophical zombie?"
    prompt: |
      In philosophy a **zombie** is not a film monster. According to the philosophers who use the word (it entered this debate through Robert Kirk's papers of 1974), which description is right?
    options:
      - text: 'A being physically identical to a conscious person in every respect, behaving just like the person, but with no experience at all.'
        correct: true
        feedback: |
          Yes. The physical identity is essential: the argument needs a copy that differs from us in no physical way.
      - text: 'A robot that behaves like a person but is built of different parts.'
        feedback: |
          A copy of behaviour only would not prove anything: a physicalist can agree that a differently built machine might lack experience. The argument needs a full physical duplicate.
      - text: 'A person in a deep sleep or under anaesthetic.'
        feedback: |
          A sleeping person lacks experience for a while, but also differs physically (and behaves differently) from an awake one. A zombie is awake in behaviour and identical in physics.
      - text: 'A person who has lost the ability to report what they feel.'
        feedback: |
          That describes a person who may still feel but cannot say so. A zombie reports exactly as we do; it just has nothing it is like to be it.
    explanation: |
      So a zombie shares our brain, our atoms, our behaviour and our words, and differs only in lacking experience. It is a thought experiment about **what physics leaves open**, not a prediction that such creatures exist.

  - type: mcq
    id: conceivable
    title: "Picturing something is not the same as it being possible"
    image:
      src: img/kripke.webp
      alt: "Portrait photograph of the philosopher Saul Kripke during a seminar"
      caption: "Saul Kripke (1940-2022), American philosopher and logician, argued that some truths are necessary even though only observation can tell us they are true."
      credit: "Sascia Pavan, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Saul_Kripke.jpg"
    prompt: |
      For centuries, people saw a bright "evening star" (Hesperus) and a bright "morning star" (Phosphorus). Later astronomers discovered that both are the planet Venus. Before that discovery, someone could picture, without contradiction, that Hesperus and Phosphorus are two different bodies. According to Saul Kripke (*Naming and Necessity*, 1980, from lectures of 1970), what does this example show?
    options:
      - text: 'Something can be conceivable (we find no contradiction) and yet not possible: since Hesperus is Phosphorus, they could not have been two different things.'
        correct: true
        feedback: |
          Yes. Kripke's point is that "Hesperus is Phosphorus" is true in every possible world where the planet exists, yet we know it only by observation. Conceiving the opposite was an illusion of coherence.
      - text: 'Whatever we can picture is possible, so Hesperus and Phosphorus could have been different planets.'
        feedback: |
          This is the shortcut under test. Both names name Venus, and one thing cannot be two different things; our being able to picture otherwise came from not knowing the facts.
      - text: 'Astronomers were wrong to say that both are Venus.'
        feedback: |
          They were right. The example does not challenge the discovery; it asks what our earlier picturing was worth.
    explanation: |
      Philosophers call such a truth **necessary a posteriori**: *necessary* because it could not have been otherwise, *a posteriori* because only evidence reveals it. Keep this example: it is the best weapon against the argument's second premise, and a good test of how much to trust "I can imagine it".

  - type: mcq
    id: p1
    title: "P1: zombies are conceivable"
    image:
      src: img/chalmers.webp
      alt: "Photograph of the philosopher David Chalmers speaking, 2021"
      caption: "David Chalmers (born 1966), philosopher, developed the zombie argument in his book The Conscious Mind (Oxford University Press, 1996)."
      credit: "DannyGolcman, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:David_chalmers.jpg"
    prompt: |
      Chalmers's argument (1996) has three premises. The first is **P1: zombies are conceivable**, meaning that a world physically identical to ours but with no experience can be described and thought through without finding a contradiction. According to Chalmers, what kind of support does P1 have?
    options:
      - text: 'The explanatory gap: even a complete physical story does not seem to entail experience, so nothing in it rules the zombie out.'
        correct: true
        feedback: |
          Yes. If the physical facts logically implied experience, imagining them without it would show a contradiction, as imagining a triangle with four sides does. Chalmers says no such contradiction is found.
      - text: 'Laboratory observation of creatures with no experience that act normally.'
        feedback: |
          No one has observed a zombie, and none could be told apart from a person by behaviour. P1 is about what we can coherently think, not about what we have found.
      - text: 'The definition of consciousness, which says consciousness and the brain are different things.'
        feedback: |
          That would assume the conclusion. P1 is meant to be accepted by a neutral reader before anyone chooses a view of what consciousness is.
    explanation: |
      Chalmers calls P1 a claim of **conceivability**, in a full sense: after careful reflection, with no hidden contradiction. A critic can reject it by saying the contradiction is there but hard to see.

  - type: mcq
    id: p2
    title: "P2: conceivable means possible"
    prompt: |
      **P2: if zombies are conceivable (in this full sense), they are metaphysically possible.** "Metaphysically possible" means that the world could have been that way, not merely that today's laws of physics allow it. The Venus example showed conceivability can mislead. According to Chalmers, drawing on Kripke, why is the experience case supposed to be different?
    options:
      - text: 'For experience, how something appears is what it is: pain just is the feeling of pain. So there is no hidden fact to correct our picture, as the discovery that both stars are Venus corrected the old one.'
        correct: true
        feedback: |
          Yes. With Hesperus, the appearance (a bright star in the evening) and the nature (Venus) come apart, which is why we could be mistaken. Chalmers argues that with experience they do not come apart.
      - text: 'Because physics has proved that experience is non-physical.'
        feedback: |
          Physics has proved no such thing, and this would assume the conclusion. P2 is a premise about the link between thinking and possibility, not a result of physics.
      - text: 'Because anything anyone has ever imagined has turned out to be possible.'
        feedback: |
          False: people have imagined perpetual motion machines and the squaring of the circle, which are impossible. The support for P2 has to be an argument about this particular case.
    explanation: |
      P2 is the most disputed premise. Its defender says the usual escape (a hidden necessity discovered by observation) fails for experience. Its critics say that is just what a physicalist denies.

  - type: mcq
    id: p3
    title: "P3: from a possible zombie to false physicalism"
    prompt: |
      **P3: if zombies are possible, physicalism is false.** Physicalism says the physical facts fix everything else about the world, so any two worlds with exactly the same physical facts must be alike in experience too (philosophers say experience *supervenes* on the physical). Suppose a possible world is physically identical to ours but contains zombies. What follows?
    options:
      - text: 'There is a world with the same physical facts but different facts about experience, so the physical facts do not fix experience, and physicalism is false.'
        correct: true
        feedback: |
          Yes. Physicalism claimed that no such pair of worlds exists; one possible zombie world is a counterexample.
      - text: 'Nothing follows, because the zombie world is not our world.'
        feedback: |
          That is the point: physicalism is a claim about *what the physical facts fix*, in any world. A single possible world with the same physics and different experience shows they fix nothing.
      - text: 'Experience must be a physical thing that the zombie world lacks.'
        feedback: |
          If it were physical, the zombie world, which is physically identical, would have it. The argument concludes the opposite: experience is not fixed by the physical.
    explanation: |
      P3 is the least contested step. Most disputes are over P1 and P2, since the physicalist accepts that if physical duplicates could differ in experience, physicalism would be in trouble.

  - type: order
    id: argument
    title: "Assemble the argument"
    prompt: |
      Put the zombie argument in order, from first premise to conclusion.
    steps:
      - 'P1: A world physically identical to ours but with no experience is conceivable.'
      - 'P2: Whatever is conceivable in this full sense is metaphysically possible.'
      - 'So: such a zombie world is metaphysically possible.'
      - 'P3: If a zombie world is possible, the physical facts do not fix the facts about experience.'
      - 'C: Physicalism, which says they do, is false.'
    hint: |
      Two premises give an intermediate result about possibility; then a third premise turns it into a claim about physicalism.
    explanation: |
      Two premises (P1, P2) give the intermediate claim that zombies are possible. P3 then moves from that to the failure of physicalism. This is the structure to carry into every reply.

  - type: mcq
    id: validity
    title: "Valid is not the same as sound"
    prompt: |
      Suppose a critic shows that P2 is false. A friend says: "So the zombie argument is invalid." Which response is correct?
    options:
      - text: 'The argument is still valid, because if all three premises were true the conclusion would have to be true. It is unsound, because a premise is false, so the conclusion is not established.'
        correct: true
        feedback: |
          Yes. *Valid* is about the steps; *sound* is valid with true premises. Almost all of the debate here is over whether P1 and P2 are true, not about the logic.
      - text: 'Yes, invalid: an argument with a false premise is always invalid.'
        feedback: |
          Validity and truth are separate. "All fish live on land; whales are fish; so whales live on land" is valid and has false premises. An argument with a false premise is unsound, not necessarily invalid.
      - text: 'The conclusion is now shown to be false.'
        feedback: |
          A failed argument does not prove its conclusion false. Physicalism might still be false for other reasons; the argument simply does not establish it.
    explanation: |
      This is why we ask of each reply: which premise does it reject? A reply that targets the logic would be a very different kind of objection, and very few are made.

  - type: mcq
    id: dennett
    title: "Reply 1: deny P1"
    prompt: |
      According to **Daniel Dennett**, people who say they can conceive of zombies are mistaken about what they have conceived. In *Sweet Dreams* (2005) he calls the pull to imagine a zombie "the zombic hunch". What is his reply to P1?
    options:
      - text: 'A full physical duplicate would do everything a conscious person does, including thinking it is conscious and saying so; imagining it still has no experience adds something the description rules out, so no coherent zombie has really been conceived.'
        correct: true
        feedback: |
          Yes, in essence. For Dennett the zombie is a hunch that dissolves once one tries to work out all that a perfect duplicate would have, such as its reactions and its judgments about itself.
      - text: 'Zombies are conceivable, but they are impossible.'
        feedback: |
          That is a different reply, aimed at P2 (see the next cards). Dennett attacks P1: he says the conceiving was not carried through.
      - text: 'Zombies exist among us, so P1 is trivially true.'
        feedback: |
          Nobody in this debate claims that. The argument is about what is possible, and Dennett denies that the zombie is genuinely conceivable at all.
    explanation: |
      A critic who denies P1 says the picture is only a *seeming* coherence, as a long arithmetic error can seem fine until it is checked. Defenders answer that if this reply works, it removes the hard problem too, and that is exactly Dennett's view.

  - type: mcq
    id: kripke-reply
    title: "Reply 2: deny P2 with necessary a posteriori truths"
    prompt: |
      A physicalist accepts that zombies are conceivable (P1) but denies P2. She says: "A brain state may just be an experience, as Hesperus just is Phosphorus. Before we know the identity, we can picture one without the other, and that picturing tells us nothing about what is possible." Which premise does she reject, and what does her case copy from the Venus example?
    options:
      - text: 'P2. She copies the idea of a necessary truth known only by evidence: the identity of experience and brain state could be of that kind, so conceiving them apart does not show they could be apart.'
        correct: true
        feedback: |
          Yes. The reply says conceivability is a fallible guide whenever an identity is discovered by evidence, and experience may be such a case.
      - text: 'P1. She says zombies cannot be pictured.'
        feedback: |
          She accepts P1 (we can picture them). Her disagreement is over what the picturing shows.
      - text: 'P3. She says physicalism is false even if zombies are impossible.'
        feedback: |
          She holds physicalism is true. She blocks the argument before it reaches P3, by denying that conceivable means possible.
    explanation: |
      Chalmers's rejoinder is the point of P2 above: with experience, appearance and reality do not come apart as they do with the evening star. The physicalist answers that this is exactly the question at stake. Each side has a reason; neither has a decisive one, according to the current literature.

  - type: mcq
    id: concepts
    title: "The phenomenal concept strategy"
    prompt: |
      A physicalist who denies P2 owes an explanation: if experience is physical, why does the zombie *seem* so clearly conceivable? The **phenomenal concept strategy** (developed for example by Brian Loar, 1997) answers: we think about our own experiences with special, direct concepts (the concept of this very feeling) that are quite different in form from the third-person concepts of neuroscience. Which statement describes the strategy?
    options:
      - text: 'The gap between feeling and brain description comes from the special nature of our concepts, not from experience being a further non-physical thing; the same state can be thought of in two very different ways.'
        correct: true
        feedback: |
          Yes. According to its supporters, the zombie seems conceivable because the two concepts do not make the identity obvious, as with the two names of Venus.
      - text: 'Experience is an illusion, so there is nothing for the zombie to lack.'
        feedback: |
          That is the illusionist reply (Dennett and Frankish). The phenomenal concept strategy accepts that experience is real; it says it is physical, and explains why it does not look so.
      - text: 'Our concepts of experience are meaningless words.'
        feedback: |
          The strategy treats phenomenal concepts as perfectly meaningful, even especially direct. Their special form is what explains the seeming gap.
    explanation: |
      Critics reply that the strategy must still explain why such concepts exist and what they refer to, and they dispute whether it succeeds. This is an active research front, with no agreed result.

  - type: mcq
    id: chalmers-view
    title: "Chalmers's own position and its price"
    prompt: |
      Chalmers accepts both P1 and P2, so according to him physicalism is false and experience needs something more: fundamental laws that tie experience to physical processes (he has called this naturalistic dualism). He also holds that zombies, though possible in the sense of P2, probably do not exist in our world with its laws. Critics raise this worry: a zombie twin, physically identical, would say exactly what you say, including "I am conscious" and "I have a hard problem". What is the worry?
    options:
      - text: 'If every word and action is explained by physical processes, then our claims about experience seem to be explained without experience, which makes experience look idle (epiphenomenal: a by-product that causes nothing).'
        correct: true
        feedback: |
          Yes. If the zombie says what we say for purely physical reasons, why should we think our saying it is caused by real experience? Chalmers has replied to this problem (the "paradox of phenomenal judgment"); how well it works is disputed.
      - text: 'The twin would have more experience than us.'
        feedback: |
          By definition the twin has none. The worry is that it would nevertheless talk exactly as we do.
      - text: 'Physics forbids any law connecting experience to the brain.'
        feedback: |
          Nothing in physics forbids it. The difficulty is philosophical: what experience would then do.
    explanation: |
      Epiphenomenalism is one of the options that follow if zombies are possible; the others, as surveyed in the Stanford Encyclopedia, include interactionism and panpsychism, and none is easy. The disagreement here is a live one.

  - type: mcq
    id: trap
    title: "Trap: do zombies claim that people lack experience?"
    prompt: |
      A student says: "The zombie argument says some real people are zombies, with no inner life, so it is insulting and silly." Which reply is correct?
    options:
      - text: 'The argument does not say any real person lacks experience. It uses an imagined zombie world to ask whether physics alone fixes experience.'
        correct: true
        feedback: |
          Yes. Defenders of the argument use the zombie as a device for testing a theory, like an ideal frictionless plane in physics.
      - text: 'Yes, defenders of the argument believe that many people are zombies.'
        feedback: |
          No one in the debate claims this. The question is about what the physical facts alone settle.
      - text: 'The argument shows that zombies exist because they are conceivable.'
        feedback: |
          Conceivable at most gives *possible*, never *actual*. And whether it gives possible is the second premise, under dispute.
    explanation: |
      Keeping *possible* and *actual* apart prevents most misreadings of the argument. It is a claim about what could have been, and what that would show about the nature of experience.

  - type: mcq
    id: which-premise
    title: "Which premise does each critic reject?"
    prompt: |
      Match the critics. (1) Dennett: "No one has really conceived a zombie." (2) A physicalist who uses Kripke: "Conceivable does not mean possible for experience either." Which pair is correct?
    options:
      - text: '(1) rejects P1; (2) rejects P2.'
        correct: true
        feedback: |
          Yes. The first denies the conceiving, the second the step from conceiving to possibility.
      - text: '(1) rejects P2; (2) rejects P1.'
        feedback: |
          This swaps them. Dennett doubts that the zombie was conceivable; the Kripke-style critic grants it and doubts what it shows.
      - text: '(1) rejects P3; (2) rejects P3.'
        feedback: |
          Neither attacks the link from possible zombies to false physicalism. Both stop the argument earlier.
    explanation: |
      Placing each reply on a premise is the skill this lesson trains. It also shows where the real disagreement lies: not in the logic but in two judgments about imagination.

  - type: mcq
    id: part-ways
    title: "Where thoughtful people part ways"
    prompt: |
      A defender and a critic of the zombie argument both accept that it is valid and both agree on the physics. According to the discussion in this lesson, why do they still disagree about the conclusion?
    options:
      - text: 'They disagree about what imagining can show: whether a carefully imagined physical duplicate with no experience is a coherent possibility, or a mistake about what we have conceived.'
        correct: true
        feedback: |
          Yes. The disagreement is over P1 and P2, two claims about the power of conceiving, which neither side can settle by an experiment.
      - text: 'They disagree about the arithmetic of the argument.'
        feedback: |
          There is no arithmetic. The logic is shared; the premises are the issue.
      - text: 'One of them has not understood what a zombie is.'
        feedback: |
          The disagreement persists among philosophers who understand the thought experiment perfectly. That is why it stays a live debate.
    explanation: |
      A defender takes the felt gap between physical description and experience as evidence for a real difference; a critic takes the same gap as evidence about our concepts. Which reading is better depends partly on one's prior view of the mind, a layer-3 commitment, so a good student can state both and say what would change their mind.

  - type: mcq
    id: resolve
    title: "Back to the copy of you"
    prompt: |
      Return to the opening question: a perfect physical copy of you with no experience. After this lesson, which statement is the most accurate?
    options:
      - text: 'Being able to picture it raises the question whether it is possible, and whether it is possible is exactly what the premises P1 and P2 dispute; if it were possible, physicalism would be false.'
        correct: true
        feedback: |
          Yes. The picture is the start of the argument, not its end.
      - text: 'Being able to picture it proves physicalism false.'
        feedback: |
          Only if both P1 and P2 are true, and P2 is exactly what physicalists deny, with the Venus example as their model.
      - text: 'Being able to picture it proves nothing, so the argument is a trick.'
        feedback: |
          The argument is valid and carefully built, and it has shaped the debate since 1996. It is not a trick; its premises are simply contested.
    explanation: |
      The argument turns a vague feeling of a gap into premises that can be examined one at a time. That is why it is a model for how to argue about the mind, whichever side one takes.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** *What the Brain Shows.* Philosophy asks what could have been. Neuroscience asks what is actually found: which brain activity goes with experience, what anaesthesia and brain damage reveal, and what a correlation can and cannot establish about the zombie question.
