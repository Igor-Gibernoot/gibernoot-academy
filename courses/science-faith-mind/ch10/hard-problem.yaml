id: ch10-hard-problem
title: "The Hard Problem"
kind: concept
own: |
  The setting: a person (or an animal, or a machine) that perceives, remembers, reports and acts, and the question of what an explanation of all that would and would not cover. Two words first: **consciousness** here means *experience*, there being something it is like to be the subject, and **qualia** (singular *quale*) are the felt qualities of experience, such as the way red looks or the way a pain feels.
  - **Easy and hard problems** (David Chalmers, b. 1966, 1995). The *easy problems* ask how the brain performs functions: discriminating stimuli, integrating information, reporting mental states, controlling attention and behaviour. According to Chalmers they are hard to solve in practice but are the kind science knows how to attack. The *hard problem* is
  {{ why the performance of these functions is accompanied by experience at all }}
  Chalmers's claim, a live debate and not a fact, is
  $$\begin{gathered}\text{functions explained}\\ \not\Rightarrow\\ \text{experience explained}\end{gathered}$$
  - **Nagel's bat** (Thomas Nagel, b. 1937, 1974). In essence: a creature has conscious states if there is something it is like to be that creature. Bats navigate by echolocation (sonar), and a complete third-person description of their sonar brain would still leave open {{ what it is like, from the bat's point of view, to perceive by sonar }}. According to Nagel, objective descriptions leave out this subjective character.
  - **The explanatory gap** (Joseph Levine, 1983). An identity is *explanatory* when it shows why the physical state plays the role we associate with the thing. "Heat is molecular motion" does: it explains expansion, flow of warmth and so on. "Pain is the firing of C-fibres" (a kind of nerve fibre) leaves a gap:
  {{ it does not explain why that firing feels the way pain feels }}
  Levine drew the conclusion that this is a problem of explanation, and did not himself conclude that experience is non-physical.
  - **Mary** (Frank Jackson, 1982). Mary knows every physical fact about colour vision but has lived in a black and white room. If on leaving she learns what red looks like, then, according to Jackson's original argument, {{ physical knowledge was not all the knowledge there is }}. Jackson later changed his mind.
  - **Three replies.** According to **Dennett** (Daniel Dennett, 1942-2024) and illusionists such as Keith Frankish, the hard problem is a collection of easy problems that only seems separate: {{ the sense that something is left over is itself to be explained as a misleading appearance }}. Other physicalists accept the gap as **epistemic** (a limit on how we understand, not on what exists). Chalmers and others hold it is **real**, so that experience needs {{ new fundamental ingredients (property dualism or panpsychism) }}.
  - **Three layers.** That brains correlate with experience is established; whether the gap is illusion, ignorance or a real feature of the world is a live debate; which reply is right depends on metaphysical commitments.
cards:
  - type: mcq
    id: hook
    title: "Guess: would a complete brain science settle what red looks like?"
    prompt: |
      Imagine neuroscience finished. Every neuron, signal and circuit in your brain is described, and the whole chain from light hitting the eye to you saying "that is red" is explained. Before any theory, guess: would that complete account **also** explain why seeing red *feels* the way it does?
    options:
      - text: 'Yes: once every process is explained, nothing about the experience is left to explain.'
        feedback: |
          This is a serious position, defended by some philosophers (the lesson meets it as the first reply). It is not obvious, though, and the lesson asks what exactly would be explained.
      - text: 'It would explain how the brain produces the *words and actions*, but whether it explains the felt look of red is exactly the open question.'
        correct: true
        feedback: |
          This is the spirit of the problem. Everyone agrees such a science would explain behaviour; the debate is whether anything is left over.
      - text: 'No: science can never say anything about experience.'
        feedback: |
          Too strong. Science already links brain states to reports of experience. The question is whether the link is *explained*, not whether it can be studied.
    explanation: |
      There is no settled answer, and the lesson does not give one. It names the question precisely, shows the best arguments that something is left over, and then the three main ways thoughtful people respond.

  - type: text
    id: easy-hard
    title: "Easy problems and the hard problem"
    body: |
      In 1995 the philosopher David Chalmers (born 1966) published "Facing Up to the Problem of Consciousness" in the *Journal of Consciousness Studies*, and in 1996 the book *The Conscious Mind*. He separated two kinds of question.

      The **easy problems** ask how the brain does things: how it discriminates and reacts to stimuli, integrates information, makes mental states reportable, accesses its own states, focuses attention, controls behaviour, and differs between sleeping and waking. He called them easy only in comparison. They are hard to solve in practice, but we know what a solution looks like: a mechanism that performs the function.

      The **hard problem**, in his words, "is the problem of *experience*". Even after the functions are explained, he writes, a further question may remain: *why is the performance of these functions accompanied by experience?* A function can be described by what it does. Experience, he argues, is something else: what it is like for the subject.

  - type: mcq
    id: sort
    title: "Which question is the hard one?"
    prompt: |
      According to Chalmers, which of these questions is the **hard problem**, as opposed to an easy problem?
    options:
      - text: 'How does the brain tell a red light from a green one and steer the hand to brake?'
        feedback: |
          This is a function (discrimination and control of behaviour). It is difficult science, but Chalmers counts it among the easy problems: we know what kind of answer, a mechanism, would solve it.
      - text: 'Why does the discrimination of red from green come with a felt look of red at all?'
        correct: true
        feedback: |
          Yes. The question is no longer how the function is done but why it is accompanied by experience.
      - text: 'How does the brain turn the word "red" into speech?'
        feedback: |
          Reportability of mental states is on Chalmers's own list of easy problems.
      - text: 'How does the brain stay awake instead of asleep?'
        feedback: |
          The difference between wakefulness and sleep is also on his list of easy problems.
    explanation: |
      "Easy" does not mean simple. It means that a mechanism would count as a solution. The hard problem is whether any mechanism could, by itself, explain why there is experience.

  - type: text
    id: bat
    title: "Nagel's bat"
    image:
      src: img/nagel.webp
      alt: "Portrait photograph of the philosopher Thomas Nagel"
      caption: "Thomas Nagel (born 1937), American philosopher at New York University, asked in 1974 what it is like to be a bat."
      credit: "Nagelt, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Nagel_(cropped).jpg"
    body: |
      Twenty years earlier the philosopher Thomas Nagel (born 1937) had given the problem its most famous picture, in "What Is It Like to Be a Bat?" (*The Philosophical Review*, 1974). In essence, his claim is that a creature has conscious mental states if and only if there is something it is like to be that creature, something it is like *for* it.

      His example is the bat. Bats are mammals, so we presume they have experience, but they find their way by **echolocation** (sonar): they send out high-pitched calls and perceive the world from the echoes. That is unlike any sense we have. We can imagine hanging upside down or flying, but that only tells us what it would be like for *us* to behave like a bat, not what it is like for a bat to be a bat.

      Now suppose we learn everything physical about the bat's sonar: the calls, the echoes, the brain circuits. According to Nagel, such objective facts, true from nobody's point of view in particular, leave out the essential feature of the experience, its **subjective character**, the view from the inside.

  - type: mcq
    id: bat-q
    title: "What is left out?"
    prompt: |
      A team maps every neuron and every echo in a bat's sonar system and predicts perfectly how the bat will fly. According to Nagel's argument, what would this still **not** tell us?
    options:
      - text: 'How the bat will behave in a new situation.'
        feedback: |
          The map was said to predict behaviour perfectly. Nagel does not deny that science can explain behaviour.
      - text: 'What it is like, for the bat, to perceive by sonar.'
        correct: true
        feedback: |
          Yes. That is the subjective character he says objective descriptions leave out.
      - text: 'Whether bats have brains.'
        feedback: |
          Nothing in the argument doubts that bats have brains; the map is a map of one.
      - text: 'Whether bats are mammals.'
        feedback: |
          Irrelevant: Nagel takes it for granted that they are.
    explanation: |
      Nagel's conclusion is modest in one way: he does not claim that experience is non-physical. He claims that we do not now know what it would mean for an objective physical theory to include the subjective point of view, so that physicalism, he says, is imperfectly understood. A physicalist replies that "what it is like" may be a feature of the brain that we cannot yet picture.

  - type: text
    id: gap
    title: "The explanatory gap"
    body: |
      In 1983 the philosopher Joseph Levine, in "Materialism and Qualia: The Explanatory Gap", gave the worry a sharper form. Compare two statements.

      "Heat is the motion of molecules" is an identity that **explains**. Once we know how molecules move, we can see why a hot gas expands, why warmth flows to a cold object, why a thermometer rises. The molecular story plays exactly the role that we associate with heat.

      "Pain is the firing of C-fibres" (C-fibres are a kind of pain-carrying nerve fibre) may well be true. But Levine says it leaves a gap: it does not make intelligible why that firing should *feel* the way pain feels, rather than feel different or not feel at all. Learning more about the fibres does not help.

      Notice what Levine claimed. The gap is a gap in **explanation**. He did not conclude that experience is non-physical, and later wrote that he was reluctant to draw anti-physicalist conclusions. How big a gap it is, and what follows, is what the replies below argue about.

  - type: mcq
    id: gap-q
    title: "Why is heat different from pain?"
    prompt: |
      According to Levine, why does "heat is molecular motion" explain heat, while "pain is the firing of C-fibres" leaves a gap?
    options:
      - text: 'Heat is real but pain is not.'
        feedback: |
          Levine does not say pain is unreal. He says the identity does not make its felt character intelligible.
      - text: 'Molecular motion accounts for what heat does (expansion, flow of warmth), whereas C-fibre firing does not account for why pain feels as it does.'
        correct: true
        feedback: |
          Yes. In the first case the role we associate with the thing is fully filled by the physical story; in the second the felt quality is not.
      - text: 'Nobody has yet measured C-fibres, so the identity is only a guess.'
        feedback: |
          The gap would remain even with perfect measurement: the point is about explanation, not about missing data.
      - text: 'Because physics forbids identities between mental and physical states.'
        feedback: |
          Levine does not say identities are impossible. He says this one is not explanatory, at least not yet.
    explanation: |
      Whether the gap will close with more knowledge or marks a permanent limit is a live debate, taken up in the replies below.

  - type: text
    id: qualia
    title: "Qualia"
    body: |
      The felt qualities that the bat, Nagel and Levine point to are called **qualia** (singular *quale*, Latin for "of what kind"): the way red looks, the way coffee smells, the way a sharp pain feels. In the broad sense the word covers what it is like, subjectively, to undergo an experience. Some philosophers use it in a narrower sense, as intrinsic, indescribable properties we know with certainty; denying qualia in *that* sense is not denying that there is experience, a point that matters for the replies.

  - type: mcq
    id: qualia-q
    title: "Which feature is subjective?"
    prompt: |
      You look at a ripe tomato. Which of these features belongs to the **subjective character** of the experience (a quale in the broad sense), rather than to something an outside observer could measure?
    multiple: true
    options:
      - text: 'How the red of the tomato looks to you.'
        correct: true
        feedback: |
          Yes: the look itself, from the inside.
      - text: 'The wavelength of the light the tomato reflects.'
        feedback: |
          A measurable property of the light, available to any instrument.
      - text: 'The firing pattern of neurons in your visual cortex.'
        feedback: |
          Measurable from outside (in principle). Whether the felt look is *the same thing as* this pattern is the very question.
      - text: 'Your saying "that is ripe".'
        feedback: |
          Behaviour: recordable by anyone present. It is evidence of the experience, not the experience.
    explanation: |
      The line is between what anyone can observe or measure (light, neurons, speech) and what it is like for the one subject. The hard problem asks whether the second is explained by the first.

  - type: text
    id: mary
    title: "A teaser: Mary's room"
    body: |
      One more picture, told here only briefly (the lesson The Zombie Argument takes up this kind of argument in full). The philosopher Frank Jackson, in "Epiphenomenal Qualia" (*Philosophical Quarterly*, 1982), imagines Mary, a brilliant scientist who is forced to investigate the world from a black and white room through a black and white television. She comes to know all the physical information about colour vision. Then she is let out and sees a ripe tomato. Does she learn something?

      Jackson's original answer was yes: she learns what red looks like, so her complete physical knowledge was not all the knowledge there is. He later changed his mind. Other philosophers say she learns only a new ability, or knows an old fact in a new way. The story shows how the gap can be turned into an argument, and how it can be answered.

  - type: mcq
    id: mary-q
    title: "What would Mary's surprise show?"
    prompt: |
      Suppose Mary, who knew every physical fact about colour vision, is truly surprised when she first sees red. Which conclusion follows **if** the argument of Jackson's original version is accepted?
    options:
      - text: 'There is a fact about experience that physical knowledge alone did not include, so physicalism is incomplete.'
        correct: true
        feedback: |
          Yes, that is the original argument. Its premise (she learns a *new fact*) is what the replies attack.
      - text: 'Colour does not exist.'
        feedback: |
          Nothing is said about colours not existing. The argument is about what knowledge covers.
      - text: 'Mary was not a good scientist.'
        feedback: |
          The story stipulates that she knows *all* the physical information; the point is what is left.
    explanation: |
      Note the conditional: **if** the surprise is real and is a new fact. A reply can deny either, as the next cards show: she might gain only an ability, or the "new" fact might be an old physical one known in a new way.

  - type: text
    id: reply-illusion
    title: "Reply 1: the problem is a mistake"
    body: |
      Three main replies follow. None is declared the winner here.

      **Reply 1** is that of the philosopher Daniel Dennett (1942-2024), the author of *Consciousness Explained* (1991), and later of illusionists such as Keith Frankish (2016, "Illusionism as a Theory of Consciousness"). According to them, the hard problem is not a separate problem. Explain everything the brain does, including why we are convinced that we have inner, ineffable qualities, and nothing is left over. Dennett called the feeling that a zombie (a being with all the behaviour and no experience) is possible a *hunch* to be overcome. The strongest objection, urged by critics: that the account explains why we *say* there is experience, but sidesteps experience itself, so that "it is an illusion" seems to deny the one thing we are most sure of. Illusionists reply that the strength of that conviction is the very thing the illusion explains.

  - type: text
    id: reply-epistemic
    title: "Reply 2: the gap is only in our understanding"
    body: |
      **Reply 2** accepts that the gap is real as a gap in *understanding* but denies that it shows experience to be non-physical. According to these physicalists, experience *is* a brain process, and the gap arises from the way our concepts work: our concept of "what red looks like" is a first-person concept and our concept of a neural state is a third-person one, so no inference leads from one to the other even though they apply to the same thing. As Levine himself saw it, this is an epistemological, not a metaphysical, problem.

      The strongest objection: other identities (water and H$_2$O, heat and molecular motion) became intelligible as we learned more, whereas here we cannot even say what would make the identity intelligible. The reply is that this is a fact about us, not about the world.

  - type: text
    id: reply-real
    title: "Reply 3: the gap is real and needs new fundamentals"
    body: |
      **Reply 3** takes the gap at face value. According to Chalmers, no account of structure and function can explain experience, so experience must be added to the basic ingredients of the world, as a fundamental feature with its own laws (property dualism, met earlier in the lesson Two Kinds of Stuff: Dualism), or as something present in matter itself (panpsychism, which Chalmers has considered). Nagel's conclusion in 1974 is more modest: in essence, that physicalism is imperfectly understood until we can say how the subjective and the objective fit together.

      The strongest objection: it adds something to nature that science has not detected, and it faces the question of how experience and physical processes are related (does experience cause anything?). The reply is that every explanation must stop somewhere, and that mass and charge are also taken as basic.

  - type: mcq
    id: match
    title: "Which reply says that?"
    prompt: |
      Three people respond to the claim "even after every function is explained, something is left over". Match the statement to the reply it belongs to.

      *A:* "Nothing is left over; the feeling that something is, is what needs explaining."
      *B:* "Something is left over, because experience is a basic part of the world besides matter's structure and behaviour."
      *C:* "Something is left over in our understanding, but experience is still a physical process."

      Which assignment is correct?
    options:
      - text: 'A is the illusion reply, B the real-gap reply, C the epistemic reply.'
        correct: true
        feedback: |
          Yes. A denies the leftover, B makes it fundamental, C keeps it as a limit of our concepts.
      - text: 'A is the epistemic reply, B the illusion reply, C the real-gap reply.'
        feedback: |
          A says nothing is left over, which the epistemic reply does not say; it grants a leftover in understanding.
      - text: 'A is the real-gap reply, B the epistemic reply, C the illusion reply.'
        feedback: |
          The real-gap reply is the one that makes experience a basic ingredient (B), not the one that denies a leftover (A).
    explanation: |
      The three replies differ on two questions: *is something really left over?* and *if so, is it a feature of the world or of our understanding?* Illusion: no. Epistemic: yes, of our understanding. Real: yes, of the world.

  - type: mcq
    id: trap
    title: "Trap: behaviour is not the question"
    prompt: |
      A robot says "ouch" when struck, withdraws its arm, avoids the hammer later, and reports being in pain. A critic says: "That shows the hard problem is already solved for this robot, since it behaves as if in pain." What is wrong with this?
    options:
      - text: 'Nothing: if the behaviour is complete, the question is settled.'
        feedback: |
          This is Dennett's kind of view, but it is a *reply* to the hard problem, not a point against its being a question. The hard problem asks exactly whether behaviour settles it.
      - text: 'Behaviour and reports are exactly the functions of the easy problems; the hard problem asks why, or whether, such functions are accompanied by experience, which behaviour alone does not show.'
        correct: true
        feedback: |
          Yes. The critic assumes that behaviour decides what is in dispute. A defender of Reply 1 may then say it does; a defender of Reply 3 says it does not. Either way the question is not closed by pointing at behaviour.
      - text: 'The hard problem is only about humans, never machines.'
        feedback: |
          The question applies to any system: bats, machines, other people. Whether a robot has experience is one of its uses.
      - text: 'The hard problem is hard only because the brain is so complicated.'
        feedback: |
          Complexity makes the *easy* problems hard in practice. The hard problem is hard for a different reason, claims Chalmers: even a complete mechanism seems to leave the why of experience unexplained.
    explanation: |
      Keeping apart "does it behave as if conscious?" and "is it conscious?" is the first skill of this topic. Even those who think the two coincide must argue for it.

  - type: mcq
    id: part
    title: "Where thoughtful people part ways"
    prompt: |
      Return to the opening question. Which statement is a **fair** summary of where thoughtful people part ways?
    options:
      - text: 'Everyone agrees that brain science will explain experience; they disagree only about when.'
        feedback: |
          Not so. The three replies disagree about whether anything is left over at all, and what it would be.
      - text: 'They agree that brains and experience go together, and part over whether a complete account of function would leave something unexplained, and whether that something is an illusion, a limit of our understanding, or a fundamental feature of the world.'
        correct: true
        feedback: |
          Yes. The correlation is established; the three replies differ on whether there is a residue and on its nature, and each rests on a premise a critic can reject.
      - text: 'Scientists say the hard problem is solved and philosophers say it is not.'
        feedback: |
          False as stated: there is no consensus among scientists or among philosophers, and some of each hold each reply.
    explanation: |
      Layer 1 (established): brain states and reports of experience are linked in detail. Layer 2 (live debate): whether the gap is illusion, ignorance or real. Layer 3 (commitment): which of these one adopts depends on prior views about what an explanation must deliver and what the world is made of.

  - type: text
    id: summary
    body: |
      **Next:** the zombie argument. Chalmers turns the gap into a proof: if a being physically just like us but without experience is conceivable, what follows about physicalism? A guided proof sets out the premises, and asks which one a critic would reject.
