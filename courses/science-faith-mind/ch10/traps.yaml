id: ch10-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: mind, self and machines"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: the hard problem and the zombie argument, neural correlates, global workspace and higher-order theories, integrated information, free will, personal identity, souls and the afterlife, and machine consciousness. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to pick a theory of consciousness. Answers are given *according to* someone, and where thoughtful people differ the feedback shows both sides. Notation as in the lessons: $\Phi$ (Greek letter phi) is the measure of integrated information proposed by integrated information theory (IIT), and "toy integration" is a simplified stand-in, not $\Phi$ itself.

  - type: mcq
    id: ncc-identity
    title: "Correlate means identical?"
    prompt: |
      A student says: "Neuroscientists have found the neural correlate of seeing a face, so they have shown that the experience simply is that brain activity." What is the best correction?
    options:
      - text: 'A neural correlate of consciousness (NCC) is a minimal set of neural events that goes with a specific experience. Finding one is a record of correlation, and perhaps dependence. That the experience is identical to the activity is a further claim, argued for on philosophical grounds, and not read off the data.'
        correct: true
        feedback: |
          Yes. Correlation, dependence and identity are three different relations. A complete map of correlates would still leave open whether a zombie (a physical duplicate without experience) is possible.
      - text: 'Correlates are useless, because brain activity has nothing to do with experience.'
        feedback: |
          Contrastive experiments (masking, rivalry, blindsight) show that experience tracks brain activity closely. The caution is about what the correlation proves, not about whether it exists.
      - text: 'A correlate is the cause of the experience, so identity and causation are the same claim.'
        feedback: |
          If activity causes experience, they are two things, one producing the other. If experience is the activity, there is one thing. The two readings differ, and data on correlation alone do not choose between them.
    explanation: |
      The lesson on neural correlates separated what the instruments record from what a theory adds. Physicalists, dualists and others can all accept the same correlation table and read it differently.

  - type: mcq
    id: reports-hard
    title: "Explain the reports, solve the problem?"
    prompt: |
      A student says: "Once we explain how the brain accesses information and produces verbal reports, the hard problem of consciousness is solved." According to David Chalmers, who coined the phrase, what is the right reply?
    options:
      - text: 'Access, reports, attention and control are the "easy problems": functions we can in principle explain by mechanisms. The hard problem asks why performing these functions is accompanied by experience at all, so explaining the functions leaves that question standing. Others (Daniel Dennett, Keith Frankish) answer that this question rests on an illusion.'
        correct: true
        feedback: |
          Yes. Whether the leftover question is real is exactly where the views part: a real extra problem (Chalmers), a gap in our understanding only (some physicalists), or a mistaken question (illusionists).
      - text: 'Chalmers agrees: for him the functions are all there is, so the problem disappears.'
        feedback: |
          That is closer to the illusionist reply. Chalmers holds that the problem is real and that explaining functions does not touch it.
      - text: 'The reports cannot be explained by the brain, which is why the problem is hard.'
        feedback: |
          The easy problems are called easy because mechanisms for them are expected. The difficulty claimed is about experience, not about reports.
    explanation: |
      "Easy" means "of a kind we know how to attack", not "simple". The hard problem is a claim that something is left over after all the functions are explained, and the argument is about whether that claim is right.

  - type: mcq
    id: zombie-possible
    title: "Conceivable, therefore possible?"
    prompt: |
      A student says: "I can imagine a zombie, a being physically identical to me with no experience, so a zombie is possible, and physicalism is false." Which comment on the zombie argument is most accurate?
    options:
      - text: 'The step from "conceivable" to "possible" is a premise (P2), not a logical truth. Critics note that Hesperus being distinct from Phosphorus was conceivable before astronomers learned both are Venus, yet they cannot differ. Chalmers replies that experience is a special case, so the gap is not like the Venus case. Others deny the first premise, that a full zombie is really conceivable.'
        correct: true
        feedback: |
          Yes. The argument is valid: if its premises are true, the conclusion follows. All the work is in whether P1 and P2 are true.
      - text: 'Since the argument is valid, physicalism is refuted.'
        feedback: |
          Validity only carries truth from premises to conclusion. A valid argument with a doubtful premise establishes nothing yet.
      - text: 'Since we have never met a zombie, the argument cannot work at all.'
        feedback: |
          The argument does not claim zombies exist, only that they are possible. A defender of it would say that a possible case is enough to make the point about physicalism.
    explanation: |
      Both shortcuts, "it follows, so it is true" and "it is imaginary, so it is worthless", skip the premises. A good habit is to ask which premise a critic would reject and why.

  - type: order
    id: zombie-order
    title: "The zombie argument, in order"
    prompt: |
      Put the steps of Chalmers's zombie argument against physicalism in order.
    steps:
      - 'P1: a zombie (physically identical to us, with no experience) is conceivable.'
      - 'P2: whatever is conceivable in this full sense is metaphysically possible.'
      - 'So a zombie world is possible.'
      - 'P3: if a zombie world is possible, the physical facts do not fix the facts about experience.'
      - 'So physicalism is false.'
    hint: Two premises give a possibility, and a third turns the possibility into a conclusion about physicalism.
    explanation: |
      The first two premises give the intermediate conclusion that a zombie world is possible. P3 then links that possibility to physicalism. Replies attack P1 (Dennett's zombic hunch), or P2 (a posteriori identities such as Hesperus and Phosphorus, and the phenomenal concept strategy).

  - type: mcq
    id: gwt-hot
    title: "Workspace theory or higher-order theory?"
    prompt: |
      A student says: "Global workspace theory and higher-order theories are the same idea: both say a state is conscious when the brain notices it." Which comparison is accurate?
    options:
      - text: 'In global workspace theory (Baars; Dehaene and colleagues), a state is conscious when it is broadcast to many specialised systems at once. In a higher-order theory (Rosenthal), a state is conscious when the subject has a thought that it is in that state. A state can be broadcast with no such thought, or (on some versions) have such a thought without wide broadcast, so the two can give different verdicts.'
        correct: true
        feedback: |
          Yes. One is about availability to many systems, the other about a thought directed at the state. They often go together in healthy adults, which is why experiments struggle to separate them.
      - text: 'Both say a state is conscious only if it is first put into words.'
        feedback: |
          Neither makes speech the criterion. Reportability is evidence in practice, and critics worry that ignition of the workspace is confused with the act of reporting.
      - text: 'Global workspace theory says consciousness is located in one brain area, a higher-order theory says it is spread everywhere.'
        feedback: |
          It is nearly the reverse. A workspace is a network that broadcasts, and a higher-order theory is defined by the kind of thought involved, not by where it sits.
    explanation: |
      The difference is the criterion: broadcast against a thought about the state. Which one is right, or whether either is, is a live debate.

  - type: mcq
    id: phi-toy
    title: "Is the toy score the real measure?"
    prompt: |
      A student says: "In the lesson's network widget, a chain of five nodes scores 1 and a ring of five scores 2, so $\Phi$ is easy to measure: just count links across the weakest cut." Which correction is best?
    options:
      - text: 'The score was a toy: the smallest number of links crossing any split. The real $\Phi$ of integrated information theory uses directed causes and effects, the system''s own current state, and a structure of causes and effects, and it is computationally infeasible for large systems. Estimates for brains rest on approximations and arguments.'
        correct: true
        feedback: |
          Yes. The toy teaches one idea, that integration is set by the weakest cut, not by how dense each part is. It is not a recipe for measuring $\Phi$.
      - text: 'The toy is exact, and real $\Phi$ is the same count for any network.'
        feedback: |
          The toy links are undirected, so it cannot tell a feed-forward network from a recurrent one, a difference IIT cares about most.
      - text: 'Because $\Phi$ is hard to compute, integrated information theory has been refuted.'
        feedback: |
          A practical barrier to testing is not a refutation. Critics of the theory give other, separate arguments, and its defenders answer them.
    explanation: |
      Keep the picture and the theory apart. "Weakest cut" is a good picture of why integration is more than density. The measure itself is far harder than the picture.

  - type: numeric
    id: splits
    title: "How many splits to check?"
    prompt: |
      To find the weakest cut of a network of $n$ nodes one tries every way of splitting the nodes into two non-empty groups, where swapping the names of the two groups gives the same split. The number of splits is $2^{\,n-1}-1$. How many splits does a network of $n=7$ nodes have?
    answer: 63
    wrong:
      - { value: 127, feedback: 'That is $2^{7}-1$. Swapping the group names gives each split twice, so one factor of 2 is divided out: $2^{6}-1$.' }
      - { value: 64, feedback: 'That is $2^{6}$ and forgets to remove the one assignment that leaves a group empty.' }
      - { value: 126, feedback: 'That is $2^{7}-2$, which counts each split twice because it treats the two groups as labelled.' }
    hint: Each node goes in one of two groups, then remove the empty case and the double counting.
    explanation: |
      There are $2^{7}=128$ assignments of 7 nodes to two labelled groups. Two of them leave a group empty, giving $126$, and each split appears twice (once per labelling), so $126/2=63=2^{6}-1$. The count doubles with every node added, which is one reason the real measure is infeasible for large systems.

  - type: mcq
    id: libet
    title: "Libet: no free will?"
    prompt: |
      A student says: "In Benjamin Libet's experiment the readiness potential (a slow build-up of brain activity) begins hundreds of milliseconds before the person reports deciding to move, so the brain decides first and free will is disproved." Which reply is the most careful?
    options:
      - text: 'The result is not an agreed disproof. The timing of the reported decision is itself a difficult measurement. Schurger and colleagues (2012) proposed that the readiness potential may reflect random fluctuations in a build-up toward a threshold, not a decision. Maoz and colleagues (2019) found it absent before deliberate choices of consequence. Soon and colleagues (2008) reported earlier predictive signals, and their authors said this does not settle free will. And whether free will needs a conscious decision at a given moment is itself disputed.'
        correct: true
        feedback: |
          Yes. There are two separate questions, what the data show about timing and what free will requires. Libertarians, compatibilists and hard incompatibilists answer the second differently.
      - text: 'The experiment is fraud, and its data are invented.'
        feedback: |
          Nothing of the kind is claimed. The recordings stand, and the dispute is about their interpretation.
      - text: 'It proves free will, because the person did choose to move.'
        feedback: |
          This is the opposite overreach. That the person moved does not answer whether the choice was free in the sense a theory demands.
    explanation: |
      A signal that predicts an action is not yet a decision. Whether it counts against free will depends on what one thinks free will is, which is the next trap.

  - type: mcq
    id: determinism
    title: "Determinism means fatalism?"
    prompt: |
      A student says: "If the laws of nature and the past fix everything (determinism), then whatever I do, the outcome was going to happen anyway, so my deliberating is pointless and nobody is responsible." Which reply is most accurate?
    options:
      - text: 'Determinism says my choices are among the causes of what happens, fixed by earlier causes, not that outcomes happen whatever I choose. Whether determinism removes responsibility is the open question: hard incompatibilists (such as Pereboom) say yes, libertarians say it does so we must deny determinism for free choices, and compatibilists (such as Hume, Frankfurt and Dennett) say freedom and responsibility are compatible with it.'
        correct: true
        feedback: |
          Yes. Fatalism says the outcome is independent of what I do. Determinism says what I do is part of how the outcome is produced. Treating them as one is the slip.
      - text: 'Determinism is proven false by quantum mechanics, so the question does not arise.'
        feedback: |
          Whether the world is deterministic depends on the interpretation of quantum mechanics, which is unsettled. And indeterminism alone does not give control: a random event is not obviously a free choice.
      - text: 'All philosophers agree that determinism removes responsibility.'
        feedback: |
          Compatibilists reject this. They hold that being free means acting from one's own reasons, which can happen in a deterministic world.
    explanation: |
      The route "determined, hence pointless" assumes that my deliberation does not matter. In a deterministic world, deliberation is one of the determining causes.

  - type: mcq
    id: compatibilism
    title: "Compatibilism denies determinism?"
    prompt: |
      A student says: "Compatibilists believe free will exists, so they must be hiding a denial of determinism somewhere." What does compatibilism actually claim?
    options:
      - text: 'Compatibilism is the view that free will and moral responsibility are compatible with determinism, so a compatibilist can accept that the laws and the past fix every event. What matters for them is the kind of cause: acting on one''s own reasons and values without coercion, as in Harry Frankfurt''s account of what a person wants to want.'
        correct: true
        feedback: |
          Yes. Compatibilists and hard determinists accept the same physics and differ on what the word "free" needs. Libertarians are the ones who deny determinism for free choices.
      - text: 'It claims that the laws of nature are not deterministic.'
        feedback: |
          That describes libertarianism (for instance Robert Kane) at most. Compatibilism is neutral on whether the world is deterministic.
      - text: 'It claims that free will is an illusion, though a useful one.'
        feedback: |
          That sounds like hard incompatibilism or illusionism. A compatibilist holds that the free will worth wanting is real.
    explanation: |
      Three questions are tangled in the free will debate: is the world deterministic, is freedom compatible with it, and does responsibility need more. Each position answers them differently.

  - type: mcq
    id: identity
    title: "Three theories of the same person"
    prompt: |
      A person is rebuilt in a perfect copy with all memories while the original body is destroyed. Which pairing of verdict and theory is correct?
    options:
      - text: 'John Locke''s memory criterion says the copy is the same person if it is conscious of the same past. Eric Olson''s animalism says that you are an animal and persist while that animal''s life continues, so the copy is not you. Derek Parfit says the question of identity is not what matters, and what matters is psychological connectedness and continuity, which the copy has.'
        correct: true
        feedback: |
          Yes. The case does not have a neutral answer: each theory gives one, and the disagreement is about what we are.
      - text: 'All three say the copy is the same person, since all of them are about memory.'
        feedback: |
          Animalism is about the continuing life of the organism, not memory. Parfit's view separates identity from what matters.
      - text: 'All three say the copy is a new person, since the body was destroyed.'
        feedback: |
          Locke's criterion is the consciousness of the past, not the body, so on his view the copy plausibly qualifies. Thomas Reid's officer objection shows where memory alone is awkward.
    explanation: |
      The same story, three verdicts. Parfit's reply is to drop the demand for a yes-or-no answer about identity and ask what we really care about in survival.

  - type: numeric
    id: decay
    title: "Ten years of forgetting"
    prompt: |
      In a toy model of Parfit's connectedness, a person keeps $90\%$ of what they remembered the year before, and the losses of different years compound. What fraction of the memories they had ten years ago do they still directly connect to today? Give the answer as a decimal with two digits.
    answer: 0.35
    tolerance: 0.01
    wrong:
      - { value: 0.9, feedback: 'That is the fraction kept after one year. Ten years of independent losses compound.' }
      - { value: 0.1, feedback: 'That is the share lost in a single year. After ten years the loss is not simply 10%.' }
      - { value: 0, feedback: 'The direct links are thinner but not gone: $0.9^{10}$ is about a third.' }
    hint: Each year multiplies what is left by $0.9$; do it ten times.
    explanation: |
      After one year $0.9$ remains, after two $0.9\times0.9$, and after ten $0.9^{10}\approx0.35$. Direct connectedness fades, yet every year's link to the next stays strong, so continuity (the overlapping chain) holds throughout. That is why Parfit separates connectedness, which comes in degrees, from continuity.

  - type: mcq
    id: split-brain
    title: "Split brain, two persons?"
    prompt: |
      A student says: "Patients whose corpus callosum (the bundle of fibres joining the two hemispheres) was cut show that one brain contains two persons." Which statement is most accurate?
    options:
      - text: 'In experiments, information shown to only one hemisphere can drive behaviour the other side cannot report, so some unity breaks down. Whether that means two subjects or one subject with divided perception is disputed: Pinto and colleagues (2017) argued for one agent with split perception, and Volz and Gazzaniga replied. The patients live as single individuals in daily life.'
        correct: true
        feedback: |
          Yes. The data are striking, and the count of subjects depends on what one counts as a subject.
      - text: 'The data show that the left hemisphere is the real person and the right is a machine.'
        feedback: |
          No such conclusion is accepted. Both hemispheres show intentional behaviour, and the disagreement is about unity, not about ranking.
      - text: 'The data show nothing about the self, because the operation was only a surgical detail.'
        feedback: |
          The tests are the best case where a single mind seems to come apart under lab conditions, which is why philosophers use them.
    explanation: |
      Our word "person" assumes one subject per body. The split-brain cases pull the two apart and leave the question of how to count open.

  - type: mcq
    id: anatta
    title: "No-self means no continuity?"
    prompt: |
      A student says: "In Buddhism, no-self (anatta) means that nothing continues, or else that a soul travels to the next life." According to Buddhist teaching as presented in the lesson, which is the right description?
    options:
      - text: 'Buddhist traditions deny a permanent, unchanging self, and describe rebirth as a causal stream, where each moment conditions the next, as one candle flame lights another without anything travelling across. The Milindapanha uses this kind of image. So there is continuity without a transmigrating soul.'
        correct: true
        feedback: |
          Yes. It differs both from "nothing continues" and from a soul that travels. Hindu traditions, by contrast, speak of the atman, which does continue through samsara.
      - text: 'Buddhism teaches an atman that moves from body to body, as Hindu traditions do.'
        feedback: |
          This is the view the Buddhist doctrine of no-self rejects. Hindu traditions in general do teach the atman.
      - text: 'Buddhism teaches that death ends everything, with no rebirth.'
        feedback: |
          Traditional Buddhism teaches rebirth, but of a causal stream, not a persisting soul-thing. Modern Buddhists differ on how literally to take it.
    explanation: |
      "No self" and "no continuity" are different claims. The Buddhist picture is continuity as causal connection, which resembles in spirit what Parfit later argued about connectedness.

  - type: mcq
    id: brain-damage
    title: "Brain damage, therefore no soul?"
    multiple: true
    prompt: |
      An argument says: "Brain damage changes or removes mental abilities, so there is no soul that survives death." Select **all** the statements that are correct.
    options:
      - text: 'The dependence of mental life on the brain in this life is well documented: anaesthesia, lesions and dementia all show it.'
        correct: true
        feedback: |
          Yes. That is the established part. Dualists accept it too, as in the Phaedo's lyre objection, to which Plato gives a reply.
      - text: 'The argument needs an extra premise, that the dependence is total and permanent, so that nothing mental can continue without the brain.'
        correct: true
        feedback: |
          Yes. A dualist can reply that the brain is a channel or instrument for a soul in this life, as a damaged radio need not destroy the broadcast. Whether that reply is plausible is the dispute.
      - text: 'The observed facts, taken alone, logically prove that no soul can exist.'
        feedback: |
          They support a premise of the argument. The conclusion about survival also needs the total-dependence premise, which the facts alone do not give.
      - text: 'Because the argument is not a proof, it gives no reason at all to doubt a soul that survives.'
        feedback: |
          Too far the other way. Even defenders of survival accept that the dependence data weigh against some versions, for instance a soul that holds all of one's memories independently of the brain.
    explanation: |
      Evidence of dependence is strong. Whether it reaches the conclusion depends on a premise about the form of the dependence, and resurrection, causal-stream and no-afterlife views each react to it differently.

  - type: numeric
    id: aware
    title: "AWARE-II: who survived?"
    prompt: |
      In the AWARE-II study of in-hospital cardiac arrests, $567$ people had an arrest and $53$ survived. What percentage of the arrests ended with a survivor? Give the answer to one decimal place.
    answer: 9.3
    tolerance: 0.1
    wrong:
      - { value: 4.9, feedback: 'That is $28/567$: the share of arrests whose survivor was interviewed, not the survivors.' }
      - { value: 93, feedback: 'That is a factor of ten off: $53/567\approx0.093$, which is $9.3\%$.' }
    hint: Divide survivors by arrests, then multiply by 100.
    explanation: |
      $53/567\approx0.093$, so about $9.3\%$ survived. Of those, $28$ were interviewed and $11$ reported memories suggesting consciousness. None identified the hidden picture placed where it could only be seen from above. The authors read the data as consciousness being possible during arrest, and readers differ on what that means for survival. Neither "it proves survival" nor "it proves nothing" follows from the numbers alone.

  - type: mcq
    id: turing
    title: "Passing the test means conscious?"
    prompt: |
      A student says: "If a program passes the Turing test, it is conscious." What does the test, as Alan Turing proposed it in 1950, actually address?
    options:
      - text: 'Turing replaced "Can machines think?" with an imitation game: could a machine answer a questioner so well that after five minutes the questioner identifies it correctly no more than about 70% of the time? It tests behaviour. Whether behaviour suffices for thought or experience is the question that functionalists answer yes and critics such as Searle answer no.'
        correct: true
        feedback: |
          Yes. Passing would show a behavioural skill. The jump to consciousness needs a theory that links the behaviour to experience, and a fluent chatbot may have learned to imitate human text without that link.
      - text: 'The test measures the number of neurons in the machine.'
        feedback: |
          Turing's game says nothing about hardware. That indifference to the material is part of why it fits functionalism.
      - text: 'Turing proved that machines are conscious and the test shows how.'
        feedback: |
          He argued the question "Can machines think?" was too vague, and proposed a test to replace it.
    explanation: |
      A test of behaviour gives behavioural evidence. Fluent output by a system trained on human text is weaker evidence of experience than the same output from a system that did not learn from our writing, so the report "I feel" needs care.

  - type: mcq
    id: searle
    title: "Searle: no machine can think?"
    prompt: |
      A student says: "John Searle's Chinese room argument shows that no machine can ever think, and the systems reply and the robot reply are decisive objections." Which statement is accurate?
    options:
      - text: 'Searle argued that running a program (syntax, symbol manipulation) is not sufficient for understanding (semantics). He did not say that no machine could think: on his biological naturalism, brains cause minds, and a brain is a machine of a kind. The systems reply (the whole room understands) is met by his answer that he could memorise the rules and still not understand, and the robot reply (add sensors and a body) is met by the point that sensor data are only more symbols. Neither side has settled it.'
        correct: true
        feedback: |
          Yes. The target is the claim that the right program is all it takes. Whether his answers to the replies work is where readers split.
      - text: 'Searle argued that only humans can think, and that animals and machines cannot.'
        feedback: |
          He held that biological brains have causal powers that produce minds. That covers other animals, and he did not rule out artificial systems with the right causal powers.
      - text: 'Searle''s argument was refuted by the systems reply, and that is now agreed.'
        feedback: |
          Many philosophers find the systems reply strong, but others find Searle's answer to it persuasive. It is not agreed.
    explanation: |
      The argument concerns programs, not machines in general. Functionalists, who say the right organisation is enough, and biological naturalists, who say the physical substrate matters, differ on what is missing.

  - type: mcq
    id: butlin
    title: "What the 2023 indicator report said"
    prompt: |
      A student says: "The 2023 report by Patrick Butlin, Robert Long and colleagues on consciousness in AI concluded that today's AI is conscious" (or, the opposite: "that machines can never be conscious"). Which description of the report fits?
    options:
      - text: 'The report assessed AI systems against 14 indicator properties drawn from several scientific theories of consciousness. It took computational functionalism as a working hypothesis, concluded that no current AI system is a strong candidate, and found no obvious technical barriers to building systems that satisfy the indicators.'
        correct: true
        feedback: |
          Yes. It neither declares today's systems conscious nor rules out machine consciousness. It also warns that systems trained to mimic human behaviour may produce reports that sound conscious without being evidence of it.
      - text: 'It proved that machines are conscious because they speak fluently.'
        feedback: |
          Fluency was treated as weak evidence, because a system trained on human text can imitate such reports.
      - text: 'It proved that machines cannot be conscious because they lack biology.'
        feedback: |
          The report started from computational functionalism, the view that the right computation is enough, which does not require biology. That starting point is a hypothesis, which others reject.
    explanation: |
      The report is conditional: if computational functionalism holds, here are theory-based indicators, and today's systems fall short. Reject the premise, as biological naturalists do, and the conclusion about the future changes.

  - type: text
    id: summary
    title: "What this round tested"
    body: |
      Each trap was a shortcut one step too far. **Correlates**: a neural correlate is a record of correlation, and identity is a further, argued claim. **Hard problem**: explaining access and reports leaves the question of why there is experience, which illusionists dispute. **Zombies**: the argument is valid, and its premises P1 and P2 carry the load. **Theories**: broadcast (workspace) and a thought about the state (higher-order) are different criteria. **Integration**: the toy "weakest cut" count is a picture, not $\Phi$, and the number of splits grows as $2^{\,n-1}-1$. **Free will**: a signal that predicts a movement is not a verdict, determinism is not fatalism, and compatibilism accepts determinism. **Self**: memory, animal and Parfit views give three verdicts on the same case, with $0.9^{10}\approx0.35$ for fading connectedness. **Souls**: dependence on the brain is well documented, and the step to no survival needs a total-dependence premise. **Machines**: the Turing test addresses behaviour, Searle's target is the program alone, and the 2023 indicator report says no current AI is a strong candidate and sees no obvious technical barrier.

      Where thoughtful people part ways is in the premises: whether conceivability reaches possibility, whether freedom needs more than acting on one's reasons, what a person is, and whether the right organisation is enough for experience.

      **Next:** a quick recall of the level's main formulas and distinctions, and then its content map.
