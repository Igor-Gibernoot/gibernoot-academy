id: ch10-gwt
title: "Global Workspace and Higher-Order Theories"
kind: concept
own: |
  The setting: a person sees a word flashed on a screen, and a **theory of consciousness** says which process in the brain makes that seeing conscious. **Consciousness** here means there being something it is like to have the experience. Both theories below are *functionalist* in spirit: they say what consciousness does or consists in, in terms of how information is used.
  - **Global workspace theory (GWT).** According to Bernard Baars (1988), many specialist processors work unconsciously and in parallel; a content is conscious when it wins the competition and is **broadcast** to all of them, as on a lit stage seen by a whole audience. According to Dehaene and Changeux, in the brain this is a late, all-or-none **ignition** (around 200 to 400 ms after the word) across a network including prefrontal and parietal cortex:
  {{ $$\begin{gathered}\text{conscious}\\ \Leftrightarrow\ \text{broadcast to}\\ \text{many specialists}\end{gathered}$$ }}
  - **Higher-order theories (HOT).** According to David Rosenthal, a mental state is conscious when its owner has a thought, usually not itself conscious, that they are in it. Hakwan Lau's perceptual reality monitoring theory is a higher-order view in which the brain monitors how reliable its own sensory signals are:
  {{ $$\begin{gathered}\text{state}\ M\ \text{is conscious}\\ \Leftrightarrow\ \text{a thought that}\\ \text{"I am in}\ M\text{"}\end{gathered}$$ }}
  - **The two come apart.** A content can be broadcast with no thought about it (conscious for GWT, not for HOT), and a thought about a state can occur with no state to be about (the misrepresentation problem). Each has a standard objection: for HOT, {{ misrepresentation: a higher-order thought with no first-order state to be about }}; for GWT, {{ ignition may track being reported, not being experienced }}.
  - **Access is not yet the hard problem.** Ned Block (1995) separates *access consciousness* (information available for reasoning, report and control) from *phenomenal consciousness* (what it is like). A theory of access answers an easy problem; whether it also answers the hard problem is what people dispute.
  - **Open.** Which theory fits the data is a live scientific debate. Whether either explains why it feels like something is the hard problem again, a commitment of metaphysics and not a result of the lab.
cards:
  - type: mcq
    id: hook
    title: "Guess: broadcast or self-knowledge?"
    prompt: |
      You see a red light. Two guesses about what makes that seeing *conscious* are on the table. (A) The red information is **broadcast** to the whole brain, so memory, planning, speech and action can all use it. (B) The brain **knows that it is seeing** red: some part represents "I am seeing red". Before any theory, which looks more promising to you?
    options:
      - text: '(A): consciousness is information made available to everything.'
        feedback: |
          This is the family of the global workspace theories. It fits the feeling that what we are conscious of is what we can talk about, remember and act on. It is a serious candidate, not yet a verdict: the lesson tests it against a case where it may fail.
      - text: '(B): consciousness is the brain being aware of its own state.'
        feedback: |
          This is the family of the higher-order theories. It fits the feeling that to be conscious of something is to be aware of it. The lesson tests it against a case where it may fail.
      - text: 'Neither can be right: consciousness cannot be explained by what the brain does.'
        feedback: |
          That is a live position (the hard problem, and some replies to it), but it is a conclusion, not a starting point. The lesson asks what each of the two proposals gets right before judging them.
      - text: 'Both are serious candidates, and I will weigh them against cases.'
        correct: true
        feedback: |
          Yes: both are live scientific and philosophical proposals, and the lesson puts each to the test.
    explanation: |
      Both guesses are serious scientific and philosophical proposals, and there is no consensus between them. Guessing is how the lesson starts: it lets you see later which of your intuitions each theory keeps and which it drops.

  - type: text
    id: recall
    title: "Recall: correlates, the hard problem"
    body: |
      Three ideas from earlier lessons are used here. By **consciousness** or **experience** we mean that there is something it is like to be the subject. According to David Chalmers, the *easy problems* ask how the brain performs functions (discriminating, reporting, controlling behaviour); the *hard problem* asks why performing them is accompanied by experience at all (the lesson The Hard Problem).

      The **neural correlate of consciousness** is the minimal brain activity that suffices for a given experience. The **contrastive method** keeps the stimulus fixed and compares *seen* with *unseen* trials, for instance a masked word (a flashed word followed by an interrupting image). Evidence can support three claims: brain activity *goes with* experience, experience *depends on* it, or experience *is the same thing as* it. Recordings support the first two well and do not decide the third (the lesson What the Brain Shows).

      A **theory of consciousness** goes one step further than a correlate: it says *which process* makes a state conscious, and why that process.

  - type: text
    id: baars
    title: "Baars: a stage and an audience"
    image:
      src: img/theatre.webp
      alt: "Diagram of a spotlight on a stage lighting up one actor, with an audience of figures around it"
      caption: "The theatre picture often used for global workspace theory: a spotlight selects one content, which the whole audience of specialist processors can then use."
      credit: "Drking1234, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Theatre_metaphor.jpg"
    body: |
      The psychologist Bernard Baars (born 1946) set out the **global workspace theory** in his book *A Cognitive Theory of Consciousness* (Cambridge University Press, 1988). His picture, in essence: the mind is made of many **specialist processors** (for vision, language, memory, movement), each fast and each working unconsciously and in parallel. They cannot all speak at once. They compete for access to a limited **global workspace**, and what wins is **broadcast** to all the specialists. According to Baars, a content is *conscious* when it is in the workspace and so available to the whole system.

      Baars uses the metaphor of a theatre. The bright spot on the stage is what we are conscious of, the dark audience is the many unconscious specialists that receive it, and attention is the spotlight. Note what the metaphor is *not*: there is no extra viewer sitting somewhere watching the stage. The audience is the rest of the system.

  - type: mcq
    id: baars-q
    title: "What does the workspace do?"
    prompt: |
      In global workspace theory, a face is recognised by a visual specialist, and at that moment the information is also available to memory, speech and planning. According to Baars, what makes the face *conscious*?
    options:
      - text: 'That the visual specialist processed it very accurately.'
        feedback: |
          Accurate processing happens unconsciously all the time (the specialists work out of view). On this theory what matters is not how well a specialist processes the content but whether it reaches the workspace.
      - text: 'That the content wins the competition and is broadcast to many specialists at once.'
        correct: true
        feedback: |
          Yes. Consciousness, on this view, is global availability: one content shared across the system.
      - text: 'That a small inner observer looks at the content on the stage.'
        feedback: |
          This is the picture of a "Cartesian theatre" that the theory is built to avoid. The audience is the other specialists, not a single viewer.
    explanation: |
      The theory identifies a *function* (broadcasting for flexible use) with consciousness. Whether that identification explains why it feels like something is a separate question, taken up below.

  - type: text
    id: gnw
    title: "Dehaene and Changeux: ignition in the brain"
    image:
      src: img/dehaene.webp
      alt: "Photograph of the neuroscientist Stanislas Dehaene speaking at a lectern"
      caption: "Stanislas Dehaene (born 1965), who with Jean-Pierre Changeux developed the global neuronal workspace theory."
      credit: "Per Henning/NTNU, CC BY 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Stanislas_Dehaene_2014.jpg"
    body: |
      Stanislas Dehaene, with Michel Kerszberg and Jean-Pierre Changeux (1998), proposed a neural version: a **global neuronal workspace**, a set of neurons with long-range connections, concentrated in prefrontal and parietal cortex, linking the specialist processors. In their review in *Neuron* (2011), Dehaene and Changeux compare brain activity for words that are reported and words that are not. They argue that early processing in sensory areas occurs in both cases, but that for a seen word there is a **late amplification**, roughly 200 to 400 milliseconds after the word, that spreads across a widespread network including prefrontal cortex.

      They call it **ignition**: below a threshold activity stays local and fades; above it the network lights up as a whole, like a fire catching. It is all-or-none. Ignition, they propose, is what conscious access looks like in the brain, and it goes with the content being **reportable**: the subject can say what they saw.

  - type: mcq
    id: gnw-q
    title: "Seen versus unseen, according to the workspace"
    prompt: |
      The same word is flashed twice with different masks. On one trial the person reports seeing it, on the other not. According to the global neuronal workspace theory, what should differ in the brain?
    options:
      - text: 'In both trials the early sensory areas respond; only on the seen trial does the late, widespread ignition including prefrontal cortex occur.'
        correct: true
        feedback: |
          Yes. The theory expects some unconscious processing in both trials and a threshold-crossing, global event only when the word is consciously accessed.
      - text: 'On the unseen trial the word causes no brain activity at all.'
        feedback: |
          Masked words are still processed to some degree in the sensory areas. What the theory ties to consciousness is the extra global event, not the first response.
      - text: 'The seen trial shows a little more activity in the same sensory area, growing smoothly with how well the word was seen.'
        feedback: |
          The theory predicts a *non-linear*, all-or-none jump (ignition) beyond a threshold, with a widespread network involved, not a small smooth increase in one area. Whether the data fit the jump or a smooth change is part of the debate.
    explanation: |
      This is the contrastive method applied to a theory: the stimulus is fixed, the report changes, and the theory says which brain event should change with it.

  - type: text
    id: hot
    title: "Higher-order theories: being aware of being in a state"
    image:
      src: img/rosenthal.webp
      alt: "Photograph of the philosopher David Rosenthal"
      caption: "David Rosenthal, philosopher at the City University of New York Graduate Center, the main proponent of the higher-order thought theory."
      credit: "AnnoyedCitationchecker, CC BY 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:DR-fixed.png"
    body: |
      The second family starts from a different thought: a conscious state is one *we are aware of being in*. A state you are in but are in no way aware of, such as a belief you have not noticed, is not a conscious state. **Higher-order theories** (HOT) turn this into a claim about structure: a mental state is conscious when it is the object of a **higher-order representation**, a further mental state about it.

      David Rosenthal, in "Two Concepts of Consciousness" (*Philosophical Studies*, 1986) and later works, holds the **higher-order thought** version. A state M is conscious when its owner has a thought, arising without conscious inference, that they are in M ("I am seeing red"). According to the theory, that thought can itself be unconscious, otherwise we would need a third thought to explain it, and so on.

      A recent variant is the **perceptual reality monitoring** theory of the neuroscientist Hakwan Lau (set out in a 2019 paper, and in his 2022 book *In Consciousness We Trust*). In essence, the brain has a mechanism that judges whether its sensory signals are reliable, a *reality* check, and consciousness goes with that monitoring and not with the sensory signal alone.

  - type: mcq
    id: hot-q
    title: "What does a state need to be conscious?"
    prompt: |
      A person has a visual state of red, and the brain has no thought of any kind about that state. According to Rosenthal's higher-order thought theory, is the state conscious?
    options:
      - text: 'Yes: a visual state is conscious whenever it carries information about red.'
        feedback: |
          That is a first-order view. On the higher-order theory carrying information is not enough: many states (in blindsight, say) carry information without being conscious.
      - text: 'No: without a higher-order thought that one is in it, the state is not conscious.'
        correct: true
        feedback: |
          Yes. The theory makes awareness *of the state* the extra ingredient. The state may still influence behaviour, but it is not a conscious state.
      - text: 'Yes, if it is broadcast to memory and speech.'
        feedback: |
          That is the workspace criterion, not the higher-order one. Wide use of a state does not by itself make anyone aware of being in it.
    explanation: |
      The two theories can say different things about the same case, which is why experiments could in principle tell them apart.

  - type: mcq
    id: contrast
    title: "Broadcast without self-awareness"
    prompt: |
      Suppose a state is broadcast widely (it guides memory, speech and action) but there is no thought *about* the state. Which pair of verdicts do the two theories give?
    options:
      - text: 'Workspace theory: conscious. Higher-order thought theory: not conscious.'
        correct: true
        feedback: |
          Yes. The first only asks for broadcasting; the second asks for a thought about the state. The theories can disagree on the very same case.
      - text: 'Both: conscious.'
        feedback: |
          Only the workspace criterion is met. The higher-order thought theory demands a thought *about* the state, not only wide use of it.
      - text: 'Workspace theory: not conscious. Higher-order thought theory: conscious.'
        feedback: |
          Reversed. Wide broadcasting is exactly what the workspace theory counts; the higher-order theory sees no thought about the state.
      - text: 'Both: not conscious.'
        feedback: |
          The workspace theory counts a broadcast content as conscious without anything more.
    explanation: |
      Defenders of each side may deny that the case ever occurs in the brain. The point of the card is only that the *criteria* differ, so evidence can bear on them differently.

  - type: text
    id: objections
    title: "Each theory's hardest objection"
    body: |
      Every theory gets a strongest objection. For the **higher-order** view it is **misrepresentation**. Suppose a higher-order thought says "I am seeing red" while no state of seeing red exists (a mistaken or *targetless* thought). If the thought is what makes a state conscious, the subject should seem to see red, with nothing there to be conscious. According to the Stanford Encyclopedia, Rosenthal and Lycan accept that such cases are possible and say the subject is then conscious as *it seems* (Rosenthal's examples include dental patients who feel pain although the nerve is destroyed). Critics reply that this shows the thought, not the state, is doing the work, or that the illusion has another explanation.

      For the **workspace** view the objection is that **ignition may track report, not experience**. Participants in these studies are asked to report what they saw, and reporting needs the very frontal machinery the theory points to. So the ignition might be the brain *getting ready to say* "I saw it", not the seeing. Experimenters answer with **no-report** designs, in which the experience is inferred from other signs (eye movements, say) instead of asked for, and see whether the ignition survives.

  - type: mcq
    id: miss-q
    title: "Reading the misrepresentation case"
    prompt: |
      A higher-order theorist (Rosenthal) is told: "a higher-order thought 'I am in pain' can occur with no pain state. Then your theory says a person can be conscious of a pain that does not exist." What reply is open to him?
    options:
      - text: 'Agree, and say the subject is then conscious as it seems to them: what matters for consciousness is how things appear through the thought.'
        correct: true
        feedback: |
          Yes, this is the reply the Stanford Encyclopedia reports for Rosenthal. Critics find it costly because it lets the thought, and not a state, be what feels like something.
      - text: 'Deny that higher-order thoughts can ever be mistaken.'
        feedback: |
          Rosenthal does not need that; he accepts that they can misrepresent. Denying it would be a different, much stronger theory.
      - text: 'Say the case shows that the workspace theory is correct.'
        feedback: |
          A reply to an objection must answer it, not change the subject. One theory facing a problem does not make its rival true.
    explanation: |
      Whether the reply is satisfactory depends on whether you think seeming is enough for experience, which is itself a disputed premise.

  - type: mcq
    id: report-q
    title: "Does ignition need report?"
    prompt: |
      A critic of the workspace theory says: "ignition may just be reporting." Which result would support the critic?
    options:
      - text: 'When the person is not asked to report and the experience is inferred from other signs, the late widespread ignition largely disappears while the experience seems to remain.'
        correct: true
        feedback: |
          Yes. That would suggest ignition goes with preparing or making a report, not with the experience.
      - text: 'When the person reports seeing the word, ignition occurs.'
        feedback: |
          That is just the original finding. It is what both sides agree on and cannot separate seeing from reporting.
      - text: 'A masked word that is unseen shows only early sensory activity.'
        feedback: |
          Also in line with the original finding, and with the workspace theory itself. It does not test whether report is the cause of the ignition.
    explanation: |
      This is the reports problem again: without a report, how do we know about the experience? The two sides read the same no-report data differently, and the debate is live.

  - type: text
    id: trap1
    title: "Trap: access is not yet the hard problem"
    body: |
      Ned Block, in "On a confusion about a function of consciousness" (*Behavioral and Brain Sciences*, 1995), separated two things often run together. **Access consciousness** is information available for use in reasoning, report and the control of action. **Phenomenal consciousness** is what it is like to have an experience. According to Block, the first has an obvious function and the second does not, and errors come from carrying the function of one over to the other.

      The workspace theory is a theory of *access*: it says which information is available to the whole system. The tempting step is to say it has therefore solved the hard problem.

  - type: mcq
    id: trap1-q
    title: "Trap: 'A theory of access answers the hard problem'"
    prompt: |
      Someone says: "Global workspace theory shows how a content becomes broadcast, so it has explained why that content *feels like* something." What is the best assessment?
    options:
      - text: 'It explains broadcasting, an easy-problem function. Whether it also explains why that is accompanied by experience is the open question, and many dispute it.'
        correct: true
        feedback: |
          Yes. Defenders reply that nothing more is needed (phenomenal consciousness *is* access), and critics reply that a gap remains. That disagreement is the hard problem restated.
      - text: 'It is plainly false, since broadcasting has nothing to do with consciousness.'
        feedback: |
          Too strong. Even critics grant that broadcasting is a good correlate of reportable experience. The dispute is about what the correlation shows.
      - text: 'It is plainly true, since consciousness is by definition broadcasting.'
        feedback: |
          Some defenders do say this, but it is a substantive identification, not a definition. Block's distinction is exactly the claim that the two concepts differ.
    explanation: |
      A theory can be a good account of access and still leave the question of phenomenal consciousness where it was. Whether it does is what the lesson The Hard Problem called the gap.

  - type: mcq
    id: trap2-q
    title: "Trap: 'The workspace is a place in the brain'"
    prompt: |
      A student writes: "The global workspace is the one region of the brain where consciousness happens, like a room with a screen." What is wrong with this?
    options:
      - text: 'In the theory the workspace is a pattern of activity linking many areas, a way information is shared, not a single room with a viewer.'
        correct: true
        feedback: |
          Yes. The neuronal version describes long-range connections between many areas. Consciousness is the content being globally available, not an event on a screen.
      - text: 'Nothing: that is exactly what the theory says.'
        feedback: |
          The theatre picture is a metaphor. In the theory the "stage" is a dynamic broadcast, and a single place with an inner viewer is what the theory is designed to avoid.
      - text: 'The workspace is not in the brain at all but in the mind.'
        feedback: |
          The neuronal theory is about brain networks (prefrontal, parietal and others). A dualist could add a mind, but that is not what the theory claims.
    explanation: |
      Prefrontal and parietal cortex are said to be especially involved, which is a claim about where the long-range connections are dense, not a claim that consciousness sits in one spot.

  - type: mcq
    id: predict
    title: "Which finding would press which theory?"
    prompt: |
      Suppose a study found that people with damage to prefrontal cortex still report ordinary experiences of colour and shape. Both the global neuronal workspace theory (prefrontal and parietal network) and a prefrontal version of the higher-order theory point to prefrontal cortex. Which description is right?
    multiple: false
    options:
      - text: 'It would put pressure on both, and they could reply differently (the damage was incomplete, or the experience is not the full conscious state).'
        correct: true
        feedback: |
          Yes. Critics such as Block argue that basic sensory experience does not need prefrontal cortex; defenders of both theories dispute how the lesion data are read. The Stanford Encyclopedia calls this contested.
      - text: 'It would confirm both theories, since both involve the brain.'
        feedback: |
          Both theories do involve the brain, but they claim *prefrontal* involvement. A finding of intact experience without it is what each needs to explain away.
      - text: 'It would be irrelevant to both, since lesions cannot test theories.'
        feedback: |
          Lesion data are one kind of evidence that bears on theories, though it is often hard to read (what exactly was damaged, and what the person can truly report).
    explanation: |
      The two theories overlap in predicting prefrontal involvement, so the evidence that separates them has to be found elsewhere, in cases like broadcasting without self-monitoring.

  - type: mcq
    id: part
    title: "Where people part ways"
    prompt: |
      Two researchers agree on all the brain data. One prefers the workspace theory, the other a higher-order theory. Which is the most likely source of the disagreement?
    options:
      - text: 'What consciousness fundamentally is: availability to the whole system, or awareness of one''s own state.'
        correct: true
        feedback: |
          Yes. The data underdetermine the choice; each side starts from a different idea of what the explanandum is.
      - text: 'Only whether the brain is physical.'
        feedback: |
          Both theories are compatible with physicalism, and both are functional. Their disagreement is inside the functional camp.
      - text: 'Only which of them has a bigger lab.'
        feedback: |
          Not a serious source. Disputes among theories turn on what counts as the thing to be explained and on how to read the same data.
    explanation: |
      Beyond these two, thoughtful people also part ways on whether any functional theory can address the hard problem at all (illusionists say there is nothing more to explain; Chalmers says a gap remains). That is a premise, not a lab result.

  - type: text
    id: summary
    body: |
      **Next:** the rivals that do not start from broadcasting or self-awareness: integrated information theory, predictive processing and quantum proposals, what each claims and how each could be tested.
