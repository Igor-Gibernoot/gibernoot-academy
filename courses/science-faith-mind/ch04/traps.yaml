id: ch04-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: mathematics and reality"
    body: |
      Fast round. Each question hides a **tempting shortcut** about the puzzle of why mathematics fits the world: Wigner's puzzle, Platonism, formalism and intuitionism, Cantor's diagonal argument, Godel's theorems, the replies to the puzzle, and the Mathematical Universe Hypothesis. Every shortcut is a *useful idea turned too far*.

      Nothing here asks which view is true. As always, answers are given *according to* someone (Wigner, Hamming, Benacerraf, Hilbert, Brouwer, Cantor, Godel, Tegmark...), and where thoughtful people differ the feedback shows both sides.

  - type: mcq
    id: useful-is-puzzle
    title: "What exactly is the puzzle?"
    prompt: |
      A student says: "Wigner's puzzle is just that mathematics is useful. Of course tools are useful." According to Wigner (1960), what is missing from this?
    options:
      - text: 'The puzzle is that structures made for their own sake (beauty, logic, curiosity) keep turning out to describe, and even predict, the physical world, often long after they were made.'
        correct: true
      - text: 'Nothing is missing; Wigner only meant that mathematics is handy for engineers.'
        feedback: |
          Wigner's essay is about physics at its deepest, not engineering convenience. Handy tools made for a job are not surprising; the surprise is a fit nobody built in.
      - text: 'Wigner argued that mathematics is useless in physics except for counting.'
        feedback: |
          The opposite: he called its usefulness "bordering on the mysterious" and found no rational explanation for it.
      - text: 'Wigner proved that the world is a mathematical object.'
        feedback: |
          He proved nothing of the kind. He posed a puzzle and left it open; the claim that the world *is* mathematical is a later, bolder proposal (Tegmark).
    explanation: |
      The trap is flattening the puzzle into "tools are useful". If mathematics had been *made for* physics, the fit would be no mystery. The cases in the lesson (conic sections and Kepler's orbit, non-Euclidean geometry and general relativity, Dirac's equation and the positron) are surprising because the mathematics came first and later also predicted something new.

  - type: numeric
    id: moon-gap
    title: "Is a small gap a failure?"
    prompt: |
      In the Moon test, the Moon's measured acceleration toward the Earth is $2.72\times10^{-3}$ m/s$^2$, and an inverse-square law from surface gravity predicts $2.69\times10^{-3}$ m/s$^2$. A critic says: "The numbers are not equal, so the law fails." By what **percentage** do they differ (the gap divided by the predicted value)?
    answer: 1.1
    tolerance: 0.2
    answerText: '1.1 (about 1%)'
    wrong:
      - { value: 0.03, feedback: "That is the gap in units of $10^{-3}$ m/s$^2$, not a percentage. Divide it by the predicted value, $0.03/2.69$, and multiply by 100." }
      - { value: 99, feedback: "That is how much *agrees*, not how much differs, and it is slightly off. The gap is the small number, about 1%." }
    hint: "Gap = $2.72 - 2.69 = 0.03$ (in units of $10^{-3}$ m/s$^2$). Divide by $2.69$."
    explanation: |
      $0.03/2.69 \approx 0.011$, about 1.1%. A measured quantity and a predicted one are never equal to all digits; the question is whether they agree within the uncertainty of the data. A 1% agreement from a law invented for falling apples is the sort of fit that made the puzzle vivid. Whether it *needs* an explanation is a live debate (see the replies to the puzzle).

  - type: mcq
    id: platonism-is-plato
    title: "Is Platonism what Plato taught?"
    prompt: |
      A student says: "Mathematical Platonism is simply what Plato taught, so to evaluate it we read Plato." According to the standard modern survey, what is the correction?
    options:
      - text: 'Platonism in this sense is a modern position: there are mathematical objects, they are abstract (outside space and time, causing nothing) and they exist independently of minds, language and practice. It is not a report of what Plato himself taught.'
        correct: true
      - text: 'Platonism says mathematical objects exist only in human minds.'
        feedback: |
          That is a mind-made view (intuitionism is the classical example). Platonism says the opposite: independence of minds.
      - text: 'Platonism says mathematical objects are very small physical things, like atoms.'
        feedback: |
          Platonists call the objects *abstract*: outside space and time, so no size and no location at all.
      - text: 'Platonism says mathematics is a game of symbols with no objects behind it.'
        feedback: |
          That is formalism, the rival of Platonism.
    explanation: |
      The name is historical, the thesis is modern: *existence*, *abstractness* and *independence*. The trap is to settle a modern question by quoting an ancient author. The best arguments are objectivity (everyone who checks gets the same answer) and indispensability (according to Quine and Putnam, science needs mathematics, so we should believe in what it is about).

  - type: mcq
    id: platonism-price
    title: "The price of Platonism"
    prompt: |
      According to Benacerraf (1973), which question is the hardest one for the Platonist?
    options:
      - text: 'How can we know about objects that are outside space and time and cause nothing in us?'
        correct: true
      - text: 'Why does mathematics apply so well to the physical world?'
        feedback: |
          That is Frege's objection to *formalism* (if mathematics is only a game of symbols, why does it fit the world?). A Platonist has a ready answer to applying, the objects are real; the Platonist's cost is *access*.
      - text: 'How much of classical mathematics survives if we drop the law of excluded middle?'
        feedback: |
          That is the price of *intuitionism*: some classical mathematics is lost or must be redone.
      - text: 'Why do different mathematicians get different answers to the same calculation?'
        feedback: |
          They do not, and that agreement is Platonism's best argument (objectivity), not its problem.
    explanation: |
      Each school pays a different price: Platonism in **access**, formalism in **application**, intuitionism in **how much classical mathematics survives**. A common slip is to attach the wrong price to the wrong school. Platonists reply in various ways (for example, with a perception-like analogy for mathematical intuition, as Godel suggested); whether any reply works is a live debate.

  - type: mcq
    id: formalism-useless
    title: "Is a formalist's mathematics a pointless game?"
    prompt: |
      In Hilbert's version of formalism, mathematics is a game of symbols and rules, and a proof is a chain of allowed moves. A student says: "So the formalist must think mathematics is useless." Which reply is fair to both sides?
    options:
      - text: 'A formalist can value mathematics highly; the thesis is about what it is (a rule-governed practice with no realm of objects behind it), not about its worth. The sharp question, due to Frege, is why a game of symbols *applies* to the physical world so well, and formalists must answer it.'
        correct: true
      - text: 'Yes; formalists deny that any mathematical statement can be proved.'
        feedback: |
          Formalists have proofs at the centre: a proof is a chain of allowed moves. What they deny is a realm of objects the symbols are about.
      - text: 'Frege’s objection is that formalism cannot be written down with rules.'
        feedback: |
          Frege’s objection is about *application*, not about whether rules can be written. The rules are the whole point of the formalist picture.
      - text: 'Formalism is refuted by the fact that mathematics has any use at all.'
        feedback: |
          Too fast. Formalists have replies (the rules were shaped by the world, for example); the objection is a hard question, not a refutation.
    explanation: |
      The trap is to read "game" as "worthless". Hilbert wanted to *secure* mathematics by proving the game consistent with finitary means, a programme that Godel's theorems of 1931 are usually read as showing cannot be completed as originally aimed. The price of formalism is application, not value.

  - type: numeric
    id: constructive-witness
    title: "A witness, not a trick"
    prompt: |
      Intuitionists distrust a proof that something exists if it names no example. A classical proof shows that irrational numbers $x, y$ exist with $x^y$ rational, using the law of excluded middle and naming no witness. A direct construction takes $x = \sqrt2$ and $y = 2\log_2 3$ (both irrational). What is the value of $x^y = (\sqrt2)^{2\log_2 3}$?
    answer: 3
    tolerance: 0.001
    answerText: '3'
    wrong:
      - { value: 6, feedback: "This multiplies $2$ and $3$. Use $(\\sqrt2)^2 = 2$ and then $2^{\\log_2 3}$." }
      - { value: 9, feedback: "This squares $3$. The factor $2$ in the exponent pairs with $\\sqrt2$ to give $2$, not with $3$." }
    hint: "$(\\sqrt2)^{2\\log_2 3} = \\big((\\sqrt2)^2\\big)^{\\log_2 3}$."
    explanation: |
      $(\sqrt2)^{2\log_2 3} = \big((\sqrt2)^2\big)^{\log_2 3} = 2^{\log_2 3} = 3$, a rational number. This is a *constructive* proof: it names the witness. The trap is to think intuitionists reject proofs by contradiction wholesale or doubt that $2+2=4$. What they do not accept for every statement $A$ is "$A$ or not-$A$" as a law, since for an open problem we may hold neither a proof of $A$ nor a refutation. The price: some classical mathematics is lost or must be redone.

  - type: mcq
    id: evens-fewer
    title: "Are there fewer even numbers?"
    prompt: |
      A student says: "The even numbers are only part of the whole numbers, so there must be fewer of them." According to Cantor's definition of "same size" for infinite collections, what is wrong?
    options:
      - text: 'Two collections have the same size when a one-to-one matching pairs every element of one with exactly one element of the other with none left over; $n \mapsto 2n$ does this for all whole numbers and the evens, so they have the same size even though the evens are a part.'
        correct: true
      - text: 'The even numbers are not really part of the whole numbers.'
        feedback: |
          They are: every even number is a whole number. The point is that for infinite collections, being a proper part does not force being smaller.
      - text: 'Infinite sets cannot be compared at all.'
        feedback: |
          They can; Cantor’s matching test is exactly such a comparison, and it even finds sets of different sizes (the reals versus the whole numbers).
      - text: 'There are more even numbers, because each whole number has an even double.'
        feedback: |
          The matching $n \mapsto 2n$ uses every even number once and every whole number once; it shows *equal* size, not more.
    explanation: |
      For finite sets "part means fewer" holds; for infinite sets it fails, and that is not a paradox but a feature of the definition. A set is **countable** when it can be matched with $1, 2, 3, \dots$, that is, written as a list. The positive fractions are countable too, by a zigzag walk through a grid.

  - type: mcq
    id: add-d-to-list
    title: "Just add the missing number"
    prompt: |
      In the diagonal argument, a list $x_1, x_2, \dots$ claimed to contain every real number between 0 and 1 is shown to miss a number $d$ (it differs from the $k$-th number in digit $k$). A student says: "Then put $d$ at the top of the list and the list is complete." What is wrong?
    options:
      - text: 'The argument works on *any* list: apply the same construction to the new list and a new missing number appears. No list, however it is repaired, contains every real number between 0 and 1.'
        correct: true
      - text: 'Nothing is wrong; adding $d$ repairs the list.'
        feedback: |
          It repairs the old list only. The recipe for $d$ depends on the list, so the longer list has its own diagonal and its own missing number.
      - text: 'The new number $d$ is not between 0 and 1, so it cannot be added.'
        feedback: |
          It is: $d = 0.d_1d_2d_3\dots$ with every digit chosen from $1, \dots, 8$, so it lies between 0 and 1.
      - text: 'A list can only be repaired by deleting numbers.'
        feedback: |
          Deleting makes the list shorter, not complete. The theorem says no matching of the whole numbers with all the reals in $(0,1)$ exists at all.
    explanation: |
      The trap is to read the proof as showing one unlucky list. It is a proof by contradiction about *every* list: assume a complete list, build $d$, check $d$ is a real number with one expansion (digits from $1$ to $8$ avoid the double-expansion problem $0.0999\ldots = 0.1000\ldots$) and is not on the list. So the reals between 0 and 1 are **uncountable**.

  - type: mcq
    id: bigger-physical
    title: "Is the bigger infinity out there?"
    prompt: |
      A student says: "Cantor proved there are more real numbers than whole numbers, so physical space must contain a bigger infinity of points than the number of things we can count." What does the theorem actually state?
    options:
      - text: 'It states that no matching exists between the whole numbers and the real numbers in $(0,1)$; "bigger infinity" is a name for that fact. It is a theorem about mathematical sets, not a measurement of physical space.'
        correct: true
      - text: 'It states that physical space is made of uncountably many points.'
        feedback: |
          Nothing in the proof speaks of physical space. Whether space is a continuum at the smallest scales is a question for physics, with its own evidence and open problems.
      - text: 'It states that uncountable sets are physically larger than countable ones.'
        feedback: |
          "Larger" here is defined by matching, not by length or volume. An interval of length $1$ and one of length $2$ already have the same size in Cantor’s sense.
      - text: 'It states that counting is impossible.'
        feedback: |
          Counting works fine on countable sets; the theorem says one particular set cannot be counted by any list.
    explanation: |
      Platonists read the theorem as discovering that a definite totality of reals is larger than the whole numbers; formalists as a theorem of the symbol game; intuitionists in Brouwer’s tradition keep the construction (from any list one can produce a number missing from it) but not the picture of finished infinite totalities ranked by size. The disputed step is the meaning of "all the real numbers", not the digit trick.

  - type: numeric
    id: power-set-count
    title: "How many subsets?"
    prompt: |
      The **power set** of a set $S$ is the set of all subsets of $S$ (including the empty set and $S$ itself). For $S = \{a, b, c, d, e\}$, with $5$ elements, how many subsets are there? A student guesses $10$ ("double the elements").
    answer: 32
    tolerance: 0.001
    answerText: '32 (that is $2^5$)'
    wrong:
      - { value: 10, feedback: "That is $2\\times5$. Each element is *in* or *out* of a subset, independently: two choices for each of $5$ elements, multiplied." }
      - { value: 25, feedback: "That is $5^2$. The exponent and base are swapped: it is $2^5$ (two choices, five times)." }
    hint: "For each element choose: in the subset, or out."
    explanation: |
      Two choices per element give $2\times2\times2\times2\times2 = 2^5 = 32$ subsets. For a set with $n$ elements, $|\mathcal{P}(S)| = 2^n$. Cantor’s theorem says the strict growth holds for infinite sets as well: no matching of $S$ with $\mathcal{P}(S)$ exists, so there is no largest infinity.

  - type: mcq
    id: godel-unprovable-absolute
    title: "True but unprovable, full stop?"
    prompt: |
      A student says: "Godel showed there are true mathematical statements that can never be proved by anyone, by any means." Which correction is accurate for his first incompleteness theorem?
    options:
      - text: 'The theorem is about a particular formal system $F$ (consistent, effectively axiomatised, containing enough arithmetic): there is a sentence $G_F$ that $F$ does not prove and that is true. It says nothing about unprovability in any absolute sense; a stronger system can prove $G_F$.'
        correct: true
      - text: 'Nothing needs correcting; this is exactly the theorem.'
        feedback: |
          The theorem is relative to a system $F$ with stated conditions. The sentence $G_F$ is unprovable *in $F$*; the stronger system $F + G_F$, with $G_F$ added as an axiom, proves it trivially.
      - text: 'The theorem says some statements are neither true nor false.'
        feedback: |
          The sentence $G_F$ is a statement about the ordinary natural numbers, and it is true (provided $F$ is consistent). The theorem is about provability, not about truth values failing.
      - text: 'The theorem says every system is inconsistent.'
        feedback: |
          No: it assumes consistency. Under that assumption $F$ is incomplete.
    explanation: |
      The standard survey warns against this misreading: the theorems concern particular systems and do not show truth is unprovable in some absolute sense. Platonists read them as truth outrunning proof; formalists as the original aim of Hilbert’s programme failing; intuitionists deny that truth outruns constructive proof.

  - type: mcq
    id: godel-consistency
    title: "Can a system vouch for itself?"
    prompt: |
      The second incompleteness theorem says: if $F$ is consistent (and effectively axiomatised, with enough arithmetic), then $F \nvdash \mathrm{Con}(F)$, where $\mathrm{Con}(F)$ is the arithmetical sentence "$F$ is consistent". A student says: "So arithmetic is probably inconsistent, since it cannot prove it isn't." What is the flaw?
    options:
      - text: 'The theorem is conditional: *if* $F$ is consistent, it cannot prove so. Failing to prove consistency is not evidence of inconsistency; it only means that a consistency proof must come from outside $F$, which is why the theorem is a serious problem for Hilbert’s programme.'
        correct: true
      - text: 'There is no flaw; a system that cannot prove itself consistent is inconsistent.'
        feedback: |
          The logic runs the other way: if $F$ is consistent then it cannot prove $\mathrm{Con}(F)$. The theorem gives no way to move from "cannot prove" to "is inconsistent".
      - text: 'The theorem proves that mathematics is consistent.'
        feedback: |
          It proves no such thing. It shows what a system cannot do about itself.
      - text: 'The theorem applies only to systems that are inconsistent.'
        feedback: |
          Reversed. An inconsistent system proves every sentence, including $\mathrm{Con}(F)$; the interesting case is the consistent one.
    explanation: |
      Hilbert hoped to secure mathematics by a finitary proof of consistency; the second theorem is usually read as showing that this cannot be done for a system strong enough, by means the system itself can formalise. The theorems also do not apply to weak systems such as Presburger arithmetic (addition only), which is complete.

  - type: mcq
    id: godel-minds-machines
    title: "Do the theorems show minds beat machines?"
    prompt: |
      A popular claim: "Godel proved that human minds can see truths no machine can, so the mind is not a machine." According to the Lucas-Penrose argument and its critics, which description is fair?
    options:
      - text: 'It is a live debate, not a theorem. Lucas (1961) and Penrose argued from Godel’s theorems to the conclusion that minds are not machines; critics reply, among other things, that the argument needs us to know that the machine’s system is consistent, which we may not be able to do. The theorems alone do not settle it.'
        correct: true
      - text: 'Godel himself proved it in his 1931 paper.'
        feedback: |
          The 1931 paper is about formal systems of arithmetic. The step to minds is a later philosophical argument, and a controversial one.
      - text: 'It is refuted: everyone agrees the argument fails for a trivial reason.'
        feedback: |
          Too fast. The argument is very controversial, and critics give several different objections; there is no single agreed one-line refutation.
      - text: 'It is established fact, since computers cannot prove their own consistency.'
        feedback: |
          Unable to prove its own consistency is a fact about formal systems, and it applies to humans only if the human is assumed to be such a system, which is exactly what is in dispute.
    explanation: |
      Layers: the incompleteness theorems are established mathematics; whether they say anything about minds is a live debate; one's view of the mind (a machine or more than one) is a metaphysical commitment. The theorems say nothing by themselves about science, God or relativism either.

  - type: numeric
    id: selection-rate
    title: "How many hits, out of how many tries?"
    prompt: |
      Hamming suggested that we create and select the mathematics that fits. Suppose $30$ of $12{,}000$ mathematical structures that people tried turned out to describe nature. What **percentage** of the tried structures fit, and does that make the famous hits less surprising?
    answer: 0.25
    tolerance: 0.01
    answerText: '0.25 (so selection makes the hits less surprising, but does not explain all of them)'
    wrong:
      - { value: 2.5, feedback: "That is $30/1200$. With $12{,}000$ tries the fraction is ten times smaller: $30/12000 = 0.0025$, that is $0.25\\%$." }
      - { value: 0.0025, feedback: "That is the fraction, not the percentage. Multiply by $100$ to get $0.25\\%$." }
    hint: "$30/12000$, then multiply by $100$."
    explanation: |
      $30/12000 = 0.0025 = 0.25\%$. A low hit rate means the hits we remember are a filtered sample, so success is less surprising than the few famous cases suggest. But selection targets only one premise: it does not say why *any* structure fits, nor why a structure chosen for other reasons predicted a *new* phenomenon, as Dirac’s equation did with the positron. Hamming judged his partial replies unsatisfactory when taken together.

  - type: mcq
    id: evolution-explains-all
    title: "Evolution made us good at it"
    prompt: |
      A student says: "Evolution explains the puzzle entirely: brains that tracked the world survived, so mathematics must fit the world." According to the critics of this reply, what is its limit?
    options:
      - text: 'It can account for basic counting, shape and regularity at the scale of our ancestors, but nothing in it explains why the same minds succeed with spacetime curvature or quantum fields, far from anything those ancestors met.'
        correct: true
      - text: 'Evolution is false, so the reply fails.'
        feedback: |
          The reply does not need to deny evolution; the objection accepts it and asks how much it explains.
      - text: 'The reply has no limit; it is the accepted solution.'
        feedback: |
          Quine and Hamming offer it as a partial explanation, and Hamming judged his four partial replies insufficient together. There is no accepted solution.
      - text: 'It explains the physics but not the mathematics.'
        feedback: |
          Reversed in spirit: it is easiest for elementary arithmetic and geometry; the hard cases are the far-from-experience theories in which advanced mathematics is used.
    explanation: |
      Each reply targets one premise of the puzzle (P1: mathematics is developed for its own reasons; P2: a substantial share later describes nature; P3: such a fit would be improbable without an explanation). Evolution targets P3 and works best near experience. Abstraction from experience (Mill) targets P1, and fails for later mathematics such as complex numbers and non-Euclidean geometry, built before their uses.

  - type: mcq
    id: design-result
    title: "Does the Moon test prove a designer?"
    prompt: |
      One reply says the world is mathematical because it was made so (Galileo’s "book of nature", theistic readings). A student says: "The Moon test agrees to about 1%, so this reply is confirmed by experiment." Which statement keeps the layers apart?
    options:
      - text: 'The Moon test is established fact about the Moon; the design reply is a faith or metaphysical commitment that accepts the puzzle’s premises and answers by a designer. A critic asks whether it explains too easily, since it would fit any mathematics that was found.'
        correct: true
      - text: 'The design reply is a scientific result, because it explains a measured number.'
        feedback: |
          The measurement is the same whoever the believer or sceptic is. The design reply does not predict the 1% agreement better than its rivals; it is a way of reading the whole fit.
      - text: 'The design reply is refuted by the Moon test.'
        feedback: |
          The test does not refute it either. A designer who made a mathematical world is compatible with any agreement found.
      - text: 'Only believers may discuss the design reply.'
        feedback: |
          The course asks everyone to steelman each position, believer or not; the reply can be examined as an argument with premises like any other.
    explanation: |
      Layer 1: the Moon test. Layer 2: how far selection, evolution and shared structure account for the fit (live debate). Layer 3: a designer, or the lack of one, as a commitment. The same data are taken by thoughtful people on every side; they part ways on what, if anything, is left to explain after the partial replies.

  - type: mcq
    id: galileo-is-tegmark
    title: "Describes versus is"
    prompt: |
      A student says: "Galileo said the book of nature is written in the language of mathematics, so he held the same view as Tegmark's Mathematical Universe Hypothesis." What is the difference?
    options:
      - text: 'Galileo’s claim (1623) is the modest reading: mathematics *describes* the world, as a map describes a territory. Tegmark’s hypothesis is the bold reading: the physical world *is* a mathematical structure (in his words, existing mathematically is existing physically).'
        correct: true
      - text: 'There is no difference; both say the world is a mathematical object.'
        feedback: |
          A language that nature is "written in" is a claim about how the world can be described. Tegmark’s claim is about what the world is.
      - text: 'Galileo held the bold reading and Tegmark the modest one.'
        feedback: |
          Reversed. Tegmark takes the world to be a mathematical structure; Galileo’s phrase is about the language of its description.
      - text: 'Tegmark argues that mathematics does not describe the world.'
        feedback: |
          He says it describes the world perfectly, because the world is the structure.
    explanation: |
      The MUH starts from the External Reality Hypothesis (a physical reality independent of humans exists) and argues that, with a broad enough definition of mathematics, it is an abstract mathematical structure. It needs something like Platonism, so a formalist or intuitionist rejects it at the first step. Map-territory objection (Korzybski): a perfect description is not the thing described; the reply is that if only structure is left over, there is no extra thing.

  - type: mcq
    id: measure-problem
    title: "Every structure exists: so what is typical?"
    prompt: |
      Tegmark’s Level IV multiverse says every mathematical structure exists physically. A student proposes: "Give each of the $N$ structures the same probability $1/N$, and 'typical' is solved." Why does this fail when there are infinitely many structures?
    options:
      - text: 'For finite $N$ the $N$ equal weights $1/N$ add to $1$, but with infinitely many structures every weight would have to be $0$, and the total is then $0$, or any positive equal weight makes the total infinite. Equal weights cannot be normalised to total probability $1$, so "typical" needs a further rule.'
        correct: true
      - text: 'Probabilities cannot be assigned to structures at all.'
        feedback: |
          They can; the point is that a *uniform* rule cannot be normalised over an infinite collection. Other rules are proposed (and Schmidhuber’s measure objection with Tegmark’s reply is part of that debate).
      - text: 'It fails because $1/\infty$ is exactly $1$.'
        feedback: |
          $1/N$ shrinks to $0$ as $N$ grows; it never becomes $1$.
      - text: 'It does not fail; uniform weights work for any infinite collection.'
        feedback: |
          They work for a finite collection. For an infinite one, no equal positive weight can sum to $1$.
    explanation: |
      This is the **measure problem**. It is one of four objections (observers, Godel, the measure problem, testability), and Tegmark’s Computable Universe Hypothesis answers the Godel objection by keeping only computable structures, at a cost in how much mathematics is allowed. Whether a complete description of the world’s structure leaves nothing out, or leaves out what the world is made of, is a metaphysical commitment, not a result of any experiment so far.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Eighteen traps, one pattern: each turned a *useful* idea into a shortcut.

      - **Wigner’s puzzle** is not "mathematics is useful"; it is that structures made for their own sake fit and even predict. A 1% Moon-test gap ($2.72$ against $2.69\times10^{-3}$ m/s$^2$) is agreement, not failure.
      - **Platonism** is a modern thesis (abstract, independent objects), not a report of Plato; its price is *access* (Benacerraf), formalism’s is *application* (Frege), intuitionism’s is *how much classical mathematics survives* ($(\sqrt2)^{2\log_2 3} = 3$ as a witness).
      - **Cantor**: same size means a matching ($n \mapsto 2n$); adding $d$ to the list does not repair it; "bigger infinity" is a theorem about sets, not about space; $|\mathcal{P}(S)| = 2^n$.
      - **Godel** is about particular systems, not absolute unprovability; the second theorem is conditional ($F \nvdash \mathrm{Con}(F)$ if $F$ is consistent); minds beating machines is a live debate.
      - **Replies**: selection ($30/12000 = 0.25\%$) and evolution are partial, and design is a commitment, not a result of the Moon test.
      - **Tegmark**: describes is not is; uniform weights $1/N$ cannot be normalised over infinitely many structures.

      **Next:** *Quick Recall*, the main formulas and distinctions of Level 4 at a glance.
