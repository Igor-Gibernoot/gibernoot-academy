id: ch04-universe
title: "Is Reality Mathematics?"
kind: concept
own: |
  - **From "described by" to "is".** Wigner's puzzle (why mathematics built for other reasons fits nature; model case, the Moon test, in which orbit data give the Moon's acceleration $a = 4\pi^2 r/T^2 \approx 2.72\times10^{-3}$ m/s$^2$, with $r$ the orbital radius and $T$ the period, against $2.69\times10^{-3}$ m/s$^2$ from an inverse-square law) can be answered in two ways. The **modest** reading: mathematics *describes* the world, as a map describes a territory. The **bold** reading: the world *is* a mathematical structure. Galileo's "book of nature written in the language of mathematics" (1623) is a claim of the first kind; Pythagoras is credited by later tradition with the second, though what he himself taught is uncertain.
  - **Tegmark's Mathematical Universe Hypothesis (MUH)** (Max Tegmark, paper 2008, book 2014): starting from the **External Reality Hypothesis** (a physical reality exists independent of humans), he argues that with a broad enough definition of mathematics our physical world is an abstract mathematical structure, so that, in words,
  {{ $$\text{exists mathematically} = \text{exists physically}$$ }}
  and observers are "self-aware substructures" inside it. Its natural companion, the Level IV multiverse, says every mathematical structure exists physically. It needs something like **Platonism** (structures exist independently of us), so a formalist or intuitionist, as in the lesson Platonism, Formalism, Intuitionism, rejects it at the first step.
  - **Four objections.** (1) Observers: why does a structure contain minds? (2) Godel (the lesson Godel and the Limits of Proof): no consistent, effectively axiomatised system for arithmetic proves all arithmetical truths; Tegmark's reply, the **Computable Universe Hypothesis**, keeps only {{ computable structures }}, at a cost in how much mathematics is allowed. (3) The **measure problem**: with infinitely many structures, equal weights $1/N$ with $N\to\infty$ cannot be {{ normalised to total probability $1$ }}, so "typical" needs a rule. (4) Testability: Tegmark's stated prediction, that more mathematical regularities will be found, is one that almost every view of science also expects.
  - **Rivals.** *Structural realism* (Worrall 1989, epistemic: we know the structure of the world; Ladyman 1998, ontic: structure is all there is) is close to the MUH, but does not say the structure is an abstract object existing in every possible form. The **map-territory** objection (a phrase of Alfred Korzybski, 1879-1950): a perfect description is not the thing described; the MUH answers that if nothing but structure is left over, there is no extra "thing".
  - **Where people part ways:** whether a complete description of the world's structure {{ leaves nothing out, or leaves out what the world is made of }}. That is a **faith or metaphysical commitment**, not a result of the Moon test or of any experiment so far.
cards:
  - type: mcq
    id: hook
    title: "Guess: made of numbers?"
    prompt: |
      Guess before any theory. Mathematics fits nature astonishingly well. Which statement about the universe seems most natural to you at first?
    options:
      - text: 'The universe is described by mathematics, the way a map describes a country; the country is not made of the map.'
        correct: true
        feedback: |
          The modest reading, held by many scientists and philosophers. It is tested below against the bold one.
      - text: 'The universe is made of mathematics: matter, forces and space are numbers and relations, nothing more.'
        feedback: |
          The bold reading, defended by Max Tegmark in the form studied below. It is a serious position, with a price examined in this lesson.
      - text: 'The question has no content: "is" and "is described by" cannot be told apart by any experiment.'
        feedback: |
          Some philosophers say exactly this. The lesson asks whether the two readings really differ, and where.
    explanation: |
      There is no right guess yet. The point of the lesson is to see what each answer commits you to, and what could count for or against it.

  - type: text
    id: recall
    title: "Recall: the puzzle and the replies"
    body: |
      **Recall:** Eugene Wigner (1902-1995) asked, in 1960, why mathematics built for its own sake fits nature. Model case, the Moon test: with $r$ the Moon's orbital radius and $T$ its period, orbit data give its acceleration toward the Earth,
      $$a = \frac{4\pi^2 r}{T^2} \approx 2.72\times10^{-3}\ \text{m/s}^2$$
      while an inverse-square law (surface gravity $9.81$ m/s$^2$ divided by the square of $r/R_E \approx 60.3$, with $R_E$ the Earth's radius) predicts
      $$a \approx 2.69\times10^{-3}\ \text{m/s}^2$$
      The lesson Explanations of the Effectiveness put the puzzle as an argument: **P1** much mathematics is developed for internal reasons; **P2** a substantial share later describes nature; **P3** such a fit would be improbable without explanation; **C** so it calls for an explanation. Selection, evolution, abstraction from experience and shared structure each answered one premise.

      All those replies assume that mathematics *describes* the world. This lesson asks about a bolder reply: that the world *is* mathematics.

  - type: text
    id: pythagoras
    title: "Pythagoras: all is number?"
    body: |
      The oldest form of the bold idea is tied to Pythagoras of Samos (about 570 to about 490 BCE, according to the Stanford Encyclopedia of Philosophy). Later tradition credits him with discovering that the main musical intervals are simple whole-number ratios of string lengths: the octave $2:1$, the fifth $3:2$, the fourth $4:3$. If harmony is number, perhaps everything is.

      But the historical picture is more careful. **Established fact:** Pythagoras apparently wrote nothing, and the early evidence ties him to the immortality and transmigration of the soul and to a strict way of life, not to a mathematical physics. **Live scholarly debate:** the number doctrine is reported through Aristotle, who writes about "the so-called Pythagoreans" and what they held, and scholars link it to later followers such as Philolaus of Croton. The Stanford Encyclopedia notes that the only early source connecting Pythagoras himself to the musical ratios is Xenocrates, a member of Plato's Academy, and that the famous blacksmith's-hammer story is false.

      So the careful claim is: *according to Aristotle, the Pythagoreans* held that things are numbers, in some sense that is still disputed (numbers as the stuff of things, or as their essence).

  - type: mcq
    id: pythagoras-q
    title: "Who said all is number?"
    prompt: |
      Which statement about the idea "all is number" is the best-supported?
    options:
      - text: 'According to Aristotle, the Pythagoreans held that things are numbers; whether Pythagoras himself taught this, and in what sense, is disputed.'
        correct: true
      - text: 'Pythagoras wrote the doctrine in a treatise, and the Pythagorean theorem is the proof that all is number.'
        feedback: |
          He apparently wrote nothing, and there is no early evidence that he proved the theorem named after him, nor that the theorem would establish a doctrine about number.
      - text: 'The idea comes from Tegmark and has no ancient ancestor.'
        feedback: |
          Tegmark's version is modern and technical, but the thought that number is the nature of things is ancient, at least in Aristotle's report of the Pythagoreans.
    explanation: |
      Name the source in the sentence: "according to Aristotle, the Pythagoreans". It keeps the limit of the claim visible, which is the habit this course trains.

  - type: text
    id: galileo
    title: "Galileo: the book of nature"
    image:
      src: img/galileo.webp
      alt: "Oil portrait of an elderly Galileo Galilei by Justus Sustermans"
      caption: "Galileo Galilei (1564-1642), painted in Florence by Justus Sustermans around 1636; he held that the book of nature is read in the language of mathematics."
      credit: "Justus Sustermans, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Justus_Sustermans_-_Portrait_of_Galileo_Galilei,_1636.jpg"
    body: |
      In *The Assayer* (1623), Galileo Galilei (1564-1642) wrote in essence that the book of nature is written in the language of mathematics. This is a claim about how nature **is to be read**. The reading can be taken in two ways.

      - **Modest:** the world has regularities, and mathematics is the best language for describing them. A map can be exact without the territory being made of paper.
      - **Bold:** the world is, at bottom, a mathematical structure. Every property of a thing is a relation among numbers.

      Johannes Kepler (1571-1630) shows how the two can blur. His nested regular solids (1596) were a mathematical idea about *what the world is shaped like*, and they failed against observation, while his ellipses worked. The difference between "it fits" and "it is" shows up as the difference between a model that can fail and a claim about what exists.

      **Faith or metaphysical commitment:** whichever reading a thinker adopts, the Moon test does not decide it, because both readings agree about every number in it.

  - type: mcq
    id: galileo-q
    title: "Does the Moon test decide?"
    prompt: |
      The Moon test gives $2.72\times10^{-3}$ m/s$^2$ from orbit data and $2.69\times10^{-3}$ m/s$^2$ from an inverse-square law. A defender of the modest reading ("mathematics describes the world") and a defender of the bold reading ("the world is a mathematical structure") both look at it. What is the fairest conclusion?
    options:
      - text: 'Both readings predict the same numbers, so the test cannot settle between them. The dispute is about what the fit means, not about the fit.'
        correct: true
      - text: 'The close match proves the bold reading, since only a mathematical thing could obey mathematics so well.'
        feedback: |
          The modest reading also expects the match: a good description of a regular world will fit. A match is evidence that the laws are right, not by itself that the world is made of them.
      - text: 'The close match proves the modest reading, since a map matches only if there is a separate territory.'
        feedback: |
          That assumes what the bold reading denies, namely that there is "stuff" beyond the structure. The match alone cannot show it.
    explanation: |
      Two views with identical predictions differ in what they say exists. That makes the debate philosophical in a strict sense: more evidence of the same kind cannot move it, and so the question is where arguments, not data, have to do the work.

  - type: text
    id: tegmark
    title: "Tegmark's hypothesis"
    image:
      src: img/tegmark.webp
      alt: "Portrait photograph of physicist Max Tegmark"
      caption: "Max Tegmark (born 1967), a physics professor at MIT, proposes that the physical universe is itself a mathematical structure."
      credit: "Bengt Oberger, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Max_Tegmark_01.jpg"
    body: |
      The physicist Max Tegmark (born 1967, professor at MIT) defended the bold reading in the paper "The Mathematical Universe" (*Foundations of Physics* 38, 2008) and in the book *Our Mathematical Universe* (Knopf, 2014). In essence:

      - **ERH, the External Reality Hypothesis:** there exists a physical reality completely independent of humans.
      - **MUH, the Mathematical Universe Hypothesis:** with a sufficiently broad definition of mathematics, the ERH leads to the view that our physical world is an abstract mathematical structure. Mathematical existence is physical existence, and every mathematical structure exists physically (the **Level IV multiverse**).
      - Observers, including us, are what he calls **self-aware substructures**: parts of the structure that perceive themselves as living in a physical world.

      **Layer:** the MUH is a *metaphysical hypothesis* offered by a working physicist. Tegmark argues it has no free parameters to fit and is not ruled out by observation; critics reply that this makes it unfalsifiable rather than true.

  - type: order
    id: tegmark-order
    title: "The line of the argument"
    prompt: |
      Put the steps of Tegmark's argument for the Mathematical Universe Hypothesis in order, as the paper presents it in essence.
    steps:
      - 'Assume the External Reality Hypothesis: a physical reality exists independent of humans.'
      - 'Argue that, with a broad enough definition of mathematics, such a reality is an abstract mathematical structure.'
      - 'Conclude that mathematical existence is physical existence: every mathematical structure exists physically.'
      - 'Place observers inside it as self-aware substructures that perceive a physical world.'
    hint: 'The first step is an assumption; the last says where we ourselves are in the picture.'
    explanation: |
      The argument starts from an assumption many scientists accept (a reality independent of us) and moves, by a contested step, to a very strong conclusion. The contested step is the second: a critic asks why a description of the world being mathematical means that the world is.

  - type: mcq
    id: exists-q
    title: "What would 'exists' mean?"
    prompt: |
      The MUH says every mathematical structure exists physically. From the lesson Platonism, Formalism, Intuitionism: Platonism says mathematical objects exist independently of us; formalism says mathematics is a game of symbols and rules; intuitionism says it is a construction of the mind. Which view of mathematics does the MUH most naturally need, and why?
    options:
      - text: 'Platonism: structures must exist independently of any mind or symbol system, or the physical world could not be one.'
        correct: true
      - text: 'Formalism: if mathematics is symbols and rules, the world made of it is a world of symbols.'
        feedback: |
          A tempting reading, but a symbol game is something we play; the MUH needs structures that exist whether anyone writes them down. Formalists usually deny that mathematical structures exist in that sense.
      - text: 'Intuitionism: the universe is a construction, so it exists only as long as someone constructs it.'
        feedback: |
          That would make the universe depend on minds, but the MUH starts from a reality independent of humans. Intuitionism is the view hardest to combine with it.
    explanation: |
      The MUH is a Platonism with a physical twist: abstract structures exist, and one of them is us and our world. That means the lesson's objections to Platonism (how we could know such a realm, the access problem) travel with it, while a formalist or intuitionist has a reason to reject the first step.

  - type: text
    id: objections
    title: "Four objections, four replies"
    body: |
      Critics press the MUH at four points, and each has a reply, with a price.

      1. **Observers.** Why would a structure contain beings who perceive it? Reply: some structures are rich enough to contain self-aware substructures. Price: the notion of "self-aware" is assumed, not derived, which is the hard problem of consciousness again.
      2. **Godel** (the lesson Godel and the Limits of Proof): no consistent, effectively axiomatised system strong enough for arithmetic proves all arithmetical truths, yet the MUH says all structures exist. Tegmark's paper hypothesised that only **computable** structures exist (the Computable Universe Hypothesis), and his abstract speaks of structures that are computable and decidable in Godel's sense. Price: much of the mathematics used in physics falls outside that set, and the restriction weakens the original bold claim.
      3. **Measure.** If every structure exists, what makes "typical" observers like us typical? Jurgen Schmidhuber (2000, 2002) argued that there is no way to give equal non-vanishing weight to infinitely many structures, and proposed weighting formally describable ones by their simplicity. Tegmark replied that the measure problem is unsolved even for the inflationary landscape, so it is not a special defeat for his hypothesis.
      4. **Testability.** George Ellis, Ulrich Kirchner and William Stoeger (2004) argued that disconnected universes are untestable. Tegmark claims the MUH predicts that more mathematical regularities will be found in nature. Critics reply that nearly every view of science predicts that too.

  - type: mcq
    id: godel-q
    title: "Matching objection and reply"
    prompt: |
      An objector says: "If every mathematical structure exists, then structures that no consistent, effectively axiomatised system can fully capture exist too, and Godel's theorems limit what any formal description of the universe could prove." Which reply, and which cost, does Tegmark's paper offer?
    options:
      - text: 'Restrict existence to computable structures (the Computable Universe Hypothesis); the cost is that this excludes much of the mathematics used in physics, so the bold claim shrinks.'
        correct: true
      - text: 'Deny Godel''s theorems; the cost is that arithmetic becomes inconsistent.'
        feedback: |
          Nobody denies the theorems, and Tegmark does not. They are accepted results about formal systems, as established in the lesson Godel and the Limits of Proof.
      - text: 'Say Godel''s theorems only apply to God; the cost is theology.'
        feedback: |
          The theorems concern formal systems, not God or minds as such. Mixing them up is a common misuse the lesson warns against.
    explanation: |
      The reply fits the objection: if the problem comes from structures too rich to be computed, drop them. The price shows the general pattern of the lesson: each fix buys safety by giving up some of the original boldness.

  - type: numeric
    id: measure-num
    title: "A toy measure problem"
    prompt: |
      A toy ensemble has $8$ equally weighted structures, and exactly $2$ of them contain observers like us. What is the probability, in percent, that a randomly chosen structure is one of those $2$? (Enter the percentage, a number.)
    answer: 25
    tolerance: 0.001
    answerText: '25'
    wrong:
      - { value: 2, feedback: 'That is the count of observer structures, not a percentage. Divide by $8$ and multiply by $100$.' }
      - { value: 0.25, feedback: 'That is the fraction $2/8$; the question asks for the percentage, so multiply by $100$.' }
    hint: 'Probability = favourable divided by total, times 100.'
    explanation: |
      $$\frac{2}{8} = 0.25 = 25\%$$
      The numbers are invented for illustration. With $N$ equally weighted structures each gets weight $1/N$; as $N$ grows without limit that weight goes to $0$, so the weights cannot add up to $1$. That is the heart of the measure problem: "typical" needs a rule for weighting infinitely many structures, and the rule is a choice.

  - type: mcq
    id: testable-q
    title: "What would count as evidence?"
    prompt: |
      Tegmark says the MUH predicts that physics will keep finding mathematical regularities in nature. A critic says this does not favour the MUH. What is the critic's best point?
    options:
      - text: 'Nearly every view of science, including the modest "mathematics describes the world" reading, expects the same, so finding regularities does not favour one over the other.'
        correct: true
      - text: 'Regularities are never found, so the prediction is false.'
        feedback: |
          Regularities are found constantly; that is the Wigner puzzle itself. The point is that the prediction does not discriminate between views.
      - text: 'Predictions are not allowed in philosophy.'
        feedback: |
          Philosophy of science asks precisely which predictions would separate rival views. A prediction both views share simply does not separate them.
    explanation: |
      A hypothesis gains from evidence only if it makes that evidence more likely than its rivals do (the Bayesian idea from the lesson Evidence as Updating Belief: a likelihood ratio near $1$ moves nothing). Here the ratio is close to $1$.

  - type: text
    id: rivals
    title: "Rival views"
    body: |
      **Structural realism** (the lesson Structural Realism: What Survives Theory Change?): John Worrall (1989) held that what survives theory change, and what we can know, is the *structure* of the world, the equations and relations. James Ladyman (1998) pushed this to the **ontic** version: structure is all there is. That sounds like the MUH, and the two are neighbours. The difference is what is added: ontic structural realists need not say that the structure is an abstract object, nor that every possible structure exists as the Level IV multiverse does.

      **Map and territory.** Alfred Korzybski (1879-1950), in the work that became *Science and Sanity* (1933), made the phrase famous: the map is not the territory. Applied here, mathematics is our best map, and a perfect map is still a map: confusing a description with the thing described is a category mistake. A reply from the MUH side: if the description is complete and nothing else is left over, what exactly is the "territory" supposed to contain beyond it?

      Both rivals are serious. Neither is settled by observation, because (as in the Moon test) both agree about every measurement.

  - type: mcq
    id: rivals-q
    title: "Which rival says what?"
    prompt: |
      Three thinkers react to "the universe is a mathematical structure": (A) a structural realist who says only the structure of the world is real, (B) a map-territory objector, (C) Tegmark. Which description is correct?
    options:
      - text: 'A says structure is what is real (without necessarily claiming every possible structure exists); B says a description, however exact, is not the thing described; C says the world is an abstract structure and every structure exists physically.'
        correct: true
      - text: 'A, B and C all say the same thing in different words.'
        feedback: |
          They differ at exactly the point the lesson is about: whether structure leaves something out, and whether other structures exist.
      - text: 'B says mathematics is useless; A says the world is made of matter; C says numbers are physical objects like stones.'
        feedback: |
          None of these is what they say. B thinks mathematics is excellent as a description; A thinks matter is known only through its structure; C does not say numbers are like stones, but that physical existence is mathematical existence.
    explanation: |
      Reading each view in the form its best defenders accept is the first step in judging it. Their disagreement is not about mathematics working, but about what the success of a description shows.

  - type: mcq
    id: trap-1
    title: "Trap: description is identity"
    prompt: |
      A student says: "The laws of physics are mathematical and match the data almost perfectly, so the universe is made of mathematics." Which reply is correct?
    options:
      - text: 'The step from "described by mathematics" to "is mathematics" needs an extra premise; the modest reading explains the fit just as well, so the fit alone does not support the bold claim.'
        correct: true
      - text: 'It is correct, since a perfect fit proves identity.'
        feedback: |
          A perfect fit shows the description is accurate. Whether the described thing has any further nature is exactly what the bold and modest readings dispute.
      - text: 'It is false, since mathematics cannot describe physical things at all.'
        feedback: |
          That denies the Wigner puzzle's starting fact. Mathematics does describe nature remarkably well; the issue is what that shows.
    explanation: |
      The valid part is "mathematics describes the world". The extra premise needed is "a complete description leaves nothing out", and that is the layer-3 commitment.

  - type: mcq
    id: trap-2
    title: "Trap: hypothesis or result?"
    prompt: |
      A headline reads "Physicist proves the universe is a mathematical structure". According to Tegmark's own presentation, what is the status of the MUH?
    options:
      - text: 'A hypothesis, argued from an assumption (an external reality) with a contested step; it has not been shown by experiment, and critics dispute its testability.'
        correct: true
      - text: 'A theorem, proved from the laws of physics.'
        feedback: |
          Tegmark calls it a hypothesis, and the argument rests on an assumption and a broad definition of mathematics, not on a derivation from the laws.
      - text: 'An experimental result, measured by the Planck satellite.'
        feedback: |
          No experiment measures it. The Planck satellite measured cosmological parameters, such as the age of the universe, not the nature of reality.
    explanation: |
      Keep claims in their layer: a *fact* is data, a *debate* is a live scholarly question, a *commitment* is a position taken on grounds beyond the data. The MUH is best placed in the third layer, even though it is proposed by a physicist.

  - type: mcq
    id: layers-q
    title: "Label the layers"
    prompt: |
      Which of these three claims is a layer-3 claim (a faith or metaphysical commitment), not an established fact or a live scholarly debate?
    options:
      - text: 'Physical reality has no property over and above its mathematical structure.'
        correct: true
      - text: 'An inverse-square law predicts about $2.69\times10^{-3}$ m/s$^2$ for the Moon, close to the $2.72\times10^{-3}$ m/s$^2$ from its orbit.'
        feedback: |
          This is an established fact (layer 1): a calculation from data, checkable by anyone.
      - text: 'Physicists and philosophers disagree about whether a restriction to computable structures saves the MUH from Godel.'
        feedback: |
          This is a live scholarly debate (layer 2): a real, ongoing disagreement within the field.
    explanation: |
      The first claim cannot be tested by any measurement so far and is held on philosophical grounds: layer 3. Keeping the layers apart lets a believer and a skeptic agree on the first two and still differ on the third.

  - type: mcq
    id: parting-q
    title: "Where people part ways"
    prompt: |
      A modest-reading physicist and a Tegmark-style physicist agree on every number in every experiment. Where exactly do they part ways?
    options:
      - text: 'On whether a complete description of the structure leaves anything out: the first says the world is something that the mathematics describes, the second says nothing is left over, so the world is the structure.'
        correct: true
      - text: 'On the value of the gravitational constant.'
        feedback: |
          They agree on every number, so no measured value separates them.
      - text: 'On whether the Moon test works.'
        feedback: |
          Both accept the Moon test. The test cannot settle between them, as the card on the Moon test showed.
    explanation: |
      The parting point is a premise about what exists, not a datum. A person may weigh it by simplicity (the MUH has no extra stuff to explain), by access (how could we know such a realm?), or by what mathematics is (Platonism or not). That weighing is a matter of values and philosophical commitment.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** the traps round of this level, fast questions that each rest on one of the misconceptions you have met in these six lessons (from "mathematics is just a language" to "Godel proved God").
