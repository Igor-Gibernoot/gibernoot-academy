id: ch04-wigner
title: "The Unreasonable Effectiveness"
kind: concept
own: |
  - **Wigner's puzzle.** According to the physicist Eugene Wigner (1902-1995), in his 1960 essay "The Unreasonable Effectiveness of Mathematics in the Natural Sciences", the usefulness of mathematics in physics is "bordering on the mysterious", and he found no rational explanation for it. The puzzle is not that mathematics is useful, but that {{ structures made for their own sake (beauty, logic, curiosity) keep turning out to describe, and even predict, the physical world }}.
  - **Three marks of the cases.** In the cases of the lesson (conic sections and Kepler's orbit, non-Euclidean geometry and Einstein's general relativity, Dirac's equation and the positron, number theory and cryptography) the mathematics was (1) developed without the application in mind, (2) later found to fit, and (3) often *predicted* something new. Newton's Moon test shows the precision. With $r$ the Moon's orbital radius, $T$ its period and $R_E$ the Earth's radius, the Moon's acceleration toward the Earth is
  $$a = \frac{4\pi^2 r}{T^2} \approx 2.72\times10^{-3}\ \text{m/s}^2$$
  and an inverse-square law with surface gravity $g = 9.81$ m/s$^2$ predicts
  $$a = \frac{g}{(r/R_E)^2} \approx 2.69\times10^{-3}\ \text{m/s}^2$$
  where $r/R_E \approx 60.3$: {{ the two agree to about 1% }}.
  - **Deflationary replies.** Skeptics (among them Richard Hamming, 1980) offer partial explanations: **selection** (we remember and keep the mathematics that fits, and discard the rest), **physics-first** (much mathematics was built to describe the world), and **evolved minds** (our reasoning was shaped by this world). Defenders answer that these cover part of the cases, and that {{ predictions of new phenomena from mathematics chosen for other reasons are not explained by selection alone }}.
  - **Where people part ways.** Three families of answer, previewed here: **Platonists** (mathematical objects exist and we discover them), **mind-made views** (mathematics is our construction, so it fits because we shaped it) and **structural views** (the world itself is structure, so the fit is no surprise). Layers: the cases are established history; whether they need an explanation at all is a live debate; each answer carries a metaphysical commitment.
cards:
  - type: mcq
    id: hook
    title: "A curve, a cone and Mars"
    prompt: |
      Guess before any theory. Ancient Greek geometers studied the **ellipse** (an oval, like a stretched circle) purely as a shape obtained by slicing a cone, for the beauty of the geometry. Nearly two thousand years later, in his book *Astronomia nova* (1609), the astronomer Johannes Kepler (1571-1630) concluded from observations of Mars that Mars moves on an ellipse around the Sun. How would you react?
    options:
      - text: 'It is surprising: nothing about slicing a cone obviously has to do with planets, so why did that curve turn out to be the right one?'
        correct: true
      - text: 'It is no surprise at all: every curve describes some planet, so any shape would have worked.'
        feedback: |
          This is false: a circle is a poor fit for Mars (Kepler's work was a long fight against that very guess), and a random curve fits no orbit. The fit of one particular curve is the interesting fact.
      - text: 'It proves that the Greeks already knew about planetary orbits.'
        feedback: |
          Nothing suggests this. The geometers were studying the curve for its own sake; the link to planets came about 1800 years later.
    explanation: |
      The first option is the start of the puzzle, not yet its answer. Some will say "of course, planets move on simple curves"; the lesson asks what is hidden in that "of course", and what a good explanation would have to say.

  - type: text
    id: wigner
    title: "Wigner's puzzle"
    image:
      src: img/wigner.webp
      alt: "Black-and-white portrait photograph of Eugene Wigner in 1963"
      caption: "Eugene Wigner (1902-1995) in 1963, the year he shared the Nobel Prize in Physics for applying group theory (the mathematics of symmetry) to the atomic nucleus."
      credit: "Nobel Foundation, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Wigner.jpg"
    body: |
      In 1960 the physicist **Eugene Wigner** (1902-1995, Nobel Prize in Physics 1963) published an essay called "The Unreasonable Effectiveness of Mathematics in the Natural Sciences" (*Communications on Pure and Applied Mathematics* 13). Its claim, in his words, is that the usefulness of mathematics in the natural sciences is "something bordering on the mysterious", and that there is "no rational explanation for it". He ends by calling the fit between the language of mathematics and the laws of physics a miracle. Galileo (in *The Assayer*, 1623) had already said that the book of nature is written in mathematical language, with triangles, circles and other geometric figures as its characters.

      The puzzle needs care. It is *not*: "mathematics is useful" (a ruler is useful). It is: **why does mathematics developed for other reasons (beauty, logic, curiosity) fit nature so well, even in detail, and even where nobody expected it?**

      Four cases will make it concrete, then objections and rival answers.

  - type: text
    id: moon
    title: "Case 1: the Moon and the apple"
    body: |
      The law of gravitation, as Newton wrote it, says the pull falls as $1/r^2$ with distance $r$ from the Earth's centre. Take a test. An apple at the Earth's surface falls with $g = 9.81$ m/s$^2$, at distance $R_E = 6.371\times10^{6}$ m from the centre. The Moon is at $r = 3.844\times10^{8}$ m, about 60.3 times farther. If the *same* law governs both, the Moon's acceleration toward the Earth should be $g$ divided by $60.3^2$.

      Independently, the Moon moves on (nearly) a circle of radius $r$ in a period $T = 27.32$ days $= 2.360\times10^{6}$ s. A body on a circle with speed $v = 2\pi r/T$ is accelerated inward by $v^2/r$, which is
      $$a = \frac{4\pi^2 r}{T^2}$$
      That is a measurement of orbit data alone: no law of gravity is used.

  - type: numeric
    id: moon-a
    title: "The Moon's acceleration, from its orbit"
    prompt: |
      The Moon moves on a circle of radius $r = 3.844\times10^{8}$ m with period $T = 2.360\times10^{6}$ s. Using $a = 4\pi^2 r/T^2$, what is its acceleration toward the Earth, in units of $10^{-3}$ m/s$^2$?
    answer: 2.72
    tolerance: 0.02
    hint: '$4\pi^2 \approx 39.48$. The top is about $1.518\times10^{10}$, and $T^2 \approx 5.570\times10^{12}$.'
    explanation: |
      $$\begin{aligned} a &= \frac{4\pi^2 r}{T^2} \\ &\approx \frac{39.48 \times 3.844\times10^{8}}{5.570\times10^{12}} \\ &\approx 2.72\times10^{-3}\ \text{m/s}^2 \end{aligned}$$

  - type: numeric
    id: moon-pred
    title: "What the inverse-square law predicts"
    prompt: |
      An apple at the Earth's surface falls with $g = 9.81$ m/s$^2$. The Moon is $60.34$ Earth radii from the Earth's centre. If the pull falls as $1/r^2$, what acceleration should the Moon have, in units of $10^{-3}$ m/s$^2$?
    answer: 2.69
    tolerance: 0.02
    wrong:
      - { value: 163.4, feedback: 'That divides $g$ by $60$ (a pull falling as $1/r$) instead of by $60^2$. The law is inverse-*square*: twice as far, a quarter as strong.' }
    hint: 'Divide $9.81$ by $60.34^2 \approx 3641$.'
    explanation: |
      $$\begin{aligned} a &= \frac{g}{(r/R_E)^2} \\ &= \frac{9.81}{60.34^2} \\ &\approx 2.69\times10^{-3}\ \text{m/s}^2 \end{aligned}$$

      The orbit measurement gave $2.72$: the two agree to about 1%.

  - type: mcq
    id: moon-q
    title: "Why the match matters"
    prompt: |
      One number came from the Moon's orbit (period and radius). The other came from apples, the Earth's size and a $1/r^2$ law. They agree to about 1%. What does this agreement show?
    options:
      - text: 'A simple formula, fitted to things near the ground, also governs a body 60 Earth radii away: it was not tuned to the Moon, yet it works there.'
        correct: true
      - text: 'That the Moon is made of the same material as apples.'
        feedback: |
          Gravity here depends only on mass and distance, not on what a body is made of. The test is about how the pull changes with distance.
      - text: 'Nothing: with enough free constants any law can be made to fit one number.'
        feedback: |
          There is no free constant here: $g$, $R_E$, $r$ and $T$ were measured separately and the exponent 2 was fixed beforehand. A one-number match with no adjustable parameter is a real test (a critic may still ask why such a simple exponent is right, which is the puzzle).
    explanation: |
      Wigner's own wording is that Newton's law, extended from falling bodies to the planets, "proved accurate beyond all reasonable expectations". The surprise is the extrapolation: simple mathematics read off one corner of nature holds far away.

  - type: numeric
    id: mars
    title: "Kepler's rule for the planets"
    prompt: |
      Kepler's third law (published 1619) says that the square of a planet's orbital period $T$ is proportional to the cube of the semi-major axis $a$ (half the long axis of its ellipse). In years and astronomical units ($1$ AU = the Earth's distance from the Sun) the law reads $T^2 = a^3$. Mars has $a = 1.524$ AU. What is its period in years?
    answer: 1.88
    tolerance: 0.01
    wrong:
      - { value: 3.54, feedback: 'That is $a^3$, which equals $T^2$. Take the square root to get $T$.' }
      - { value: 1.524, feedback: 'That is $a$ itself. The law links $T^2$ to $a^3$, so $T$ is $a^{3/2}$.' }
    hint: '$1.524^3 \approx 3.54$, then take the square root.'
    explanation: |
      $$T = a^{3/2} = 1.524^{1.5} \approx 1.88\ \text{years}$$

      The measured period of Mars is $1.881$ years (687 days). One short formula, built from planetary data, works for every planet.

  - type: text
    id: dirac
    title: "Case 2: an equation with a twin"
    image:
      src: img/dirac.webp
      alt: "Black-and-white portrait photograph of Paul Dirac in 1933"
      caption: "Paul Dirac (1902-1984) shared the 1933 Nobel Prize in Physics (with Erwin Schrödinger); the positron his equation implied was found by Carl Anderson in 1932."
      credit: "Nobel Foundation, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Paul_Dirac,_1933.jpg"
    body: |
      In 1928 the physicist **Paul Dirac** (1902-1984) wrote down an equation for the electron that respected both quantum mechanics and special relativity (Einstein's theory of space and time at high speeds). The mathematics also had solutions with *negative* energy that he had not designed in. In 1931 he interpreted them as a particle like the electron but with the opposite (positive) charge, the **positron**. In 1932 the physicist Carl Anderson, photographing cosmic rays in a cloud chamber (a device that shows particle tracks), saw a track bending the wrong way in a magnetic field: a positron.

      This is the pattern at its sharpest: the mathematics *gave back more than was put in*, and nature agreed. (Historians note that others were close to the discovery too, and that Dirac's own path to the prediction was not straight; the core sequence below is standard.)

  - type: order
    id: dirac-order
    title: "From equation to track"
    prompt: Put the positron story in order.
    steps:
      - 'Dirac writes an equation for the electron that respects quantum mechanics and relativity (1928).'
      - 'Its mathematics contains unexpected negative-energy solutions.'
      - 'Dirac reads them as a positively charged twin of the electron (1931).'
      - 'Anderson finds a track in a cosmic-ray cloud chamber that bends the wrong way in a magnetic field (1932).'
    hint: 'Equation first, odd solutions next, interpretation third, experiment last.'
    explanation: |
      The experiment came *last*. That is what makes it a prediction: the existence of the positron was a consequence of the mathematics before anyone had seen one.

  - type: text
    id: geometry
    title: "Case 3: curved space before curved spacetime"
    body: |
      For two thousand years geometers asked whether the **parallel postulate** (through a point outside a line there is exactly one parallel line) follows from Euclid's other assumptions. By the 1820s and 1830s János Bolyai and Nikolai Lobachevsky, independently, had built consistent geometries in which more than one parallel exists (Gauss said he had had such ideas earlier but did not publish). In his 1854 lecture the mathematician Bernhard Riemann (1826-1866) went further, allowing a space to curve from place to place. These were mathematical explorations of what is logically possible.

      In 1915 Einstein's general relativity described gravity as the curvature of space and time, using exactly this kind of geometry (a version adapted to time, which Einstein learned with help from the mathematician Marcel Grossmann).

  - type: mcq
    id: geometry-q
    title: "Why this case is hard to explain away"
    prompt: |
      A critic says: "Of course mathematics fits physics, because physicists simply choose the mathematics that fits." For the case of non-Euclidean geometry (explored in the 1820s-1850s, used in 1915), which fact makes this reply harder to apply?
    options:
      - text: 'The geometry was developed as a study of logical possibility, long before anyone needed it, so physicists did not so much choose it as find it already waiting.'
        correct: true
      - text: 'Einstein invented non-Euclidean geometry himself in order to describe gravity.'
        feedback: |
          Einstein used geometry that others had developed decades earlier (Riemann in 1854; Grossmann helped Einstein learn it). That timing is exactly what makes the case striking.
      - text: 'Non-Euclidean geometry was soon found to be false, so it never mattered.'
        feedback: |
          Non-Euclidean geometries are consistent mathematics; the question is which one describes space and time. General relativity says space and time are curved.
    explanation: |
      Selection is still part of a critic's answer (physicists *did* choose this geometry from a large menu), but the menu was built beforehand for other reasons. How large and how arbitrary that menu is becomes the heart of the dispute.

  - type: text
    id: more
    title: "Case 4 and a warning from Maxwell"
    body: |
      **Maxwell.** James Clerk Maxwell (his 1865 paper) combined the known laws of electricity and magnetism, adding a term to one of them. The equations then implied electromagnetic *waves* travelling at the speed of light, so that light itself is such a wave. Heinrich Hertz detected these waves in laboratory experiments in the late 1880s.

      **Number theory.** The mathematician G. H. Hardy (1877-1947), in *A Mathematician's Apology* (1940), treated number theory as the kind of pure mathematics with no practical use. In 1978 Rivest, Shamir and Adleman published the **RSA** system of encryption, whose security rests on the fact that multiplying two large primes is easy but recovering them from the product is extremely hard. Hardy's example became part of everyday security (a point history cannot undo, though it does not show that Hardy's *taste* was mistaken).

  - type: mcq
    id: puzzle
    title: "Which question is Wigner's?"
    prompt: |
      Which of these is the puzzle Wigner is raising?
    options:
      - text: 'Why do abstract structures, chosen for reasons unrelated to physics, describe and predict physical phenomena so accurately?'
        correct: true
      - text: 'How can anyone prove a mathematical theorem?'
        feedback: |
          That is a question about proof (it returns in the lessons on Godel and on Cantor's diagonal argument). Wigner's question is about the *fit* between mathematics and nature.
      - text: 'Why do physicists use mathematics at all, since it is a convenient way to calculate?'
        feedback: |
          Convenience is not in doubt. The puzzle is the *surprising accuracy and predictive power*, not the use of calculation.
      - text: 'Why is physics sometimes wrong?'
        feedback: |
          This is a different problem (theory change, met in the lessons on paradigms and structural realism). Wigner's puzzle is about why it is so often right in a mathematical way.
    explanation: |
      Wigner treats the effectiveness as an empirical fact with no rational explanation. Whether "no explanation" is too strong is part of the debate.

  - type: mcq
    id: selection
    title: "Reply 1: survivors only"
    prompt: |
      Imagine mathematicians invent 10,000 different structures. Physicists try them on the world and keep the few that fit. Later, we notice that "mathematics fits the world". According to the **selection** reply, what is wrong with being amazed?
    options:
      - text: 'We only see the structures that fit, because we throw away the rest: the fit is partly built into how we count.'
        correct: true
      - text: 'There were only a few structures, so it is not remarkable that one fits.'
        feedback: |
          The reply says the opposite: there were *many* tries, so a few hits are expected. The reply is about the large menu and the discarded failures.
      - text: 'Physicists invented all the mathematics themselves, so it cannot fail to fit.'
        feedback: |
          That is a different reply (physics-first). The selection reply allows that mathematicians built structures for other reasons, and stresses that only successes are remembered.
    explanation: |
      Wigner's reply to this kind of worry, in essence, is that the cases are too many, too exact and too unexpected: a few hits among thousands would not give a prediction agreeing to many digits, or a positron. Whether that settles it is debated.

  - type: mcq
    id: who-first
    title: "Math first, or physics first?"
    multiple: true
    prompt: |
      A second reply says much mathematics was built *to describe the world*, so its fit is no surprise. Which of these cases do the critics find hard to put in that category, because the mathematics was developed *without* any physical application in view? Select all that apply.
    options:
      - text: 'Conic sections (the ellipse) studied by Greek geometers, then used for planetary orbits'
        correct: true
      - text: 'Non-Euclidean geometries explored for logical reasons, then used in general relativity'
        correct: true
      - text: 'Number theory (primes), then used in RSA encryption'
        correct: true
      - text: 'Maxwell''s equations, which combined known experimental laws of electricity and magnetism'
        feedback: |
          Here the mathematics was built to describe observed electric and magnetic effects, so physics-first is a fair description. What stays surprising is the *extra* result: waves at the speed of light, found in Hertz's experiments.
    explanation: |
      The physics-first reply explains many cases (much of calculus, for example, grew from problems of motion) but, say the defenders of Wigner's puzzle, not the three math-first ones. Maxwell shows the other puzzle: even physics-first mathematics returns more than was put in.

  - type: text
    id: einstein
    title: "Einstein's version of the question"
    body: |
      Albert Einstein posed the same enigma in his 1921 address "Geometry and Experience": how can it be that mathematics, a product of human thought independent of experience, is so admirably appropriate to the objects of reality? His own answer in that address is a split. Insofar as mathematical statements refer to reality, they are not certain; and insofar as they are certain, they do not refer to reality.

      On that view *pure* geometry (a system of definitions and logical consequences) is certain but silent about the world, while *practical* geometry, which says that rigid rods and light rays behave in a certain way, is a physical claim to be tested by experience.

  - type: mcq
    id: einstein-q
    title: "Pure versus applied claims"
    prompt: |
      In the style of Einstein's split, take two claims. (A) "In Euclid's geometry, the angles of a triangle sum to $180^\circ$." (B) "The angles of a triangle formed by three light rays in space near the Sun sum to exactly $180^\circ$." Which is which?
    options:
      - text: '(A) is certain, as a consequence of the axioms, but says nothing yet about the world; (B) is a claim about the world that experiment can test.'
        correct: true
      - text: 'Both are certain, since they are both about triangles.'
        feedback: |
          Same words, different status. (A) follows from the axioms; (B) says that light rays in real space satisfy those axioms, which might be false. General relativity says space near a mass is curved, so (B) can fail.
      - text: 'Both can only be tested by experiment, even (A).'
        feedback: |
          (A) is proved from the axioms, no experiment needed. An experiment can test whether *space* follows the axioms, not whether the proof is valid.
    explanation: |
      This split does not dissolve the puzzle, but it sharpens it: it places the mystery in the *applicability* of the certain part, not in the certainty.

  - type: mcq
    id: views
    title: "Three families of answers"
    prompt: |
      Match the answer. A philosopher says: "Mathematical objects (numbers, shapes, structures) exist independently of us, and physics is the part of that realm that our universe instantiates, so no wonder the fit." Which family is this?
    options:
      - text: 'Platonism: mathematical objects exist and are discovered; physical laws are about some of them.'
        correct: true
      - text: 'A mind-made view: mathematics is a construction of human minds, so it fits because we shaped it for the world.'
        feedback: |
          That family says the *opposite*: mathematical objects do not exist apart from us. It explains the fit by our shaping, then must say how a construction predicts a positron.
      - text: 'A selection view: only the mathematics that fits survives, so the fit is expected.'
        feedback: |
          Selection is a reply to the surprise, but it is not an answer about what mathematics *is*. The described view says mathematical objects exist apart from us.
    explanation: |
      The three families, previewed here and taken up in the lesson Platonism, Formalism, Intuitionism: **Platonist** (discover), **mind-made** (invent, and it fits because we shaped it), and **structural** (the world is structure, as in the lesson Structural Realism, so mathematics is the natural language of what there is). Each has a price: the Platonist must say how we know a realm we cannot see, the mind-made view must explain predictions, the structural view must say what the structure is a structure *of*.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** *Platonism, Formalism, Intuitionism*. Three answers to "what is a number?", each with its best argument and its hardest question; they are the raw material for explaining Wigner's puzzle.
