id: ch04-platonism
title: "Platonism, Formalism, Intuitionism"
kind: concept
own: |
  - **The question.** "What is a number?" has three classic answers, each with a best argument and a hardest question. Layers: what each school says is established history; which is right is a live debate and a metaphysical commitment.
  - **Platonism** (modern sense, according to the standard survey): there are mathematical objects, they are abstract (outside space and time, causing nothing) and they exist independently of minds, language and practice. Best arguments: **objectivity** (everyone who checks gets the same answer) and **indispensability** (according to Quine and Putnam, {{ science needs mathematics, so we should believe in what the mathematics is about }}). Hardest question, from Benacerraf (1973): {{ how can we know about objects that are outside space and time and cause nothing in us? }} It is a modern position, not a report of what Plato himself taught.
  - **Formalism** (Hilbert's version): mathematics is a game of symbols and rules, and a "proof" is a chain of allowed moves, with no realm of objects behind it. Best argument: no mysterious realm. Hardest question (Frege's objection): {{ if mathematics is only symbol games, why does it apply so well to the physical world? }} Hilbert's programme wanted to secure the whole game by a finitary proof that it is consistent (never yields both a statement and its negation); Godel's theorems of 1931, taken up in a later lesson, are usually read as showing the original aim cannot be reached.
  - **Intuitionism** (Brouwer, 1881-1966): mathematics is a mental construction, so a statement is true when we can construct a proof of it. Consequence: the law of excluded middle,
  $$A \lor \lnot A \quad (\text{"}A\text{ or not }A\text{"})$$
  is {{ not accepted for every statement $A$ }}, since for an open problem we may hold neither a proof of $A$ nor a refutation. Example: the classical proof that irrational numbers $x, y$ exist with $x^y$ rational uses the law and names no witness, while $x = \sqrt2$, $y = 2\log_2 3$ gives
  $$x^y = 3$$
  as a direct construction. Price: some classical mathematics is lost or must be redone.
  - **Where people part ways.** The three prices: Platonism pays in **access** (how do we know?), formalism in **application** (why does it fit the world, the puzzle of Wigner, whose Moon test is $a = 4\pi^2 r/T^2 \approx 2.72\times10^{-3}$ m/s$^2$ against $g/(r/R_E)^2 \approx 2.69\times10^{-3}$ m/s$^2$?), intuitionism in **how much classical mathematics survives**.
cards:
  - type: mcq
    id: hook
    title: "Does the number 7 exist?"
    prompt: |
      Guess before any theory. You can see seven apples and write the symbol 7, but neither the apples nor the ink is *the number* seven. Does the number 7 itself exist? If so, where?
    options:
      - text: 'It exists, but not in space or time: it is an abstract thing that was there before anyone counted, and we discover facts about it.'
        correct: true
        feedback: |
          A reasonable first guess (the Platonist's), though not the only one.
      - text: 'It exists only as a human creation: a symbol system we built (a game, a mental construction) and nothing more.'
        feedback: |
          Also a serious guess (the formalist's and intuitionist's start), with its own difficulties below. Neither first move is simply wrong; the lesson compares them.
      - text: 'The question has a quick, settled answer that all mathematicians and philosophers accept.'
        feedback: |
          It does not: this is one of the oldest open disputes in philosophy. Mathematicians agree on *what is true* about 7 (it is prime, it is odd) while disagreeing, or declining to say, what 7 *is*.
    explanation: |
      There is no single correct pick among the first two: they are the opening moves of two of the three schools in this lesson (Platonism and the mind-made views). The point is that mathematicians agree on the facts about 7 yet philosophers do not agree on what kind of thing 7 is.

  - type: text
    id: recall
    title: "Recall: Wigner's puzzle"
    body: |
      **Recall:** the physicist Eugene Wigner (1902-1995) asked, in 1960, why mathematics built for its own sake fits the physical world so well. Newton's Moon test is the model case. With $r$ the Moon's orbital radius, $T$ its period and $R_E$ the Earth's radius, orbit data alone give the Moon's acceleration toward the Earth as
      $$a = \frac{4\pi^2 r}{T^2} \approx 2.72\times10^{-3}\ \text{m/s}^2$$
      while an inverse-square law with surface gravity $g = 9.81$ m/s$^2$ and $r/R_E \approx 60.3$ predicts
      $$a = \frac{g}{(r/R_E)^2} \approx 2.69\times10^{-3}\ \text{m/s}^2$$
      The two agree to about 1%. Other cases: conic sections and Kepler's orbit, non-Euclidean geometry and general relativity, Dirac's equation and the positron, number theory and encryption.

      That lesson previewed three families of answer. This lesson takes the classical **philosophies of mathematics** behind them, one at a time, each with its best argument and its hardest question. Each is given in the form its defenders would accept.

  - type: text
    id: families
    title: "Three answers to 'what is a number?'"
    body: |
      Some words first. Something is **abstract** if it is not located in space or time and does not push or pull anything. An **axiom** is a starting assumption of a theory, and a **proof** is a chain of steps from axioms to a result.

      Around 1900 to 1930 mathematicians, shaken by paradoxes in the foundations of set theory, argued over what mathematics rests on. Three views of this period became classics (a fourth, logicism, tried to reduce mathematics to logic and is set aside here):

      - **Platonism**: numbers and other mathematical objects exist, abstract and independent of us.
      - **Formalism**: mathematics is a game of symbols and rules.
      - **Intuitionism**: mathematics is a construction of the mind.

      For each we ask: what does it say, what is its best argument, what is its hardest question?

  - type: text
    id: platonism
    title: "Platonism: numbers exist"
    body: |
      According to the standard survey of the subject, **mathematical Platonism** is the conjunction of three claims: **Existence** (there are mathematical objects), **Abstractness** (they are outside space and time and cause nothing) and **Independence** (they exist independently of intelligent agents and their language, thought and practices).

      On this view, "7 is prime" is true because of how 7 is, as "the Moon orbits the Earth" is true because of how the Moon is. We **discover** mathematics, as explorers map a country that was already there.

      **Best argument 1, objectivity.** Anyone, in any country or century, who checks whether 7 is prime gets the same answer, and nobody can *decide* that it is not. Platonists say this fits best a fact that is not up to us.

  - type: mcq
    id: objectivity
    title: "Nobody can change the primes"
    prompt: |
      A Platonist says: "No community, however powerful, could vote that 7 is not prime." A critic who is not a Platonist replies that this fact has another explanation. Which reply would that critic give?
    options:
      - text: 'The agreement comes from shared definitions and rules: once the meaning of "prime" and the rules of arithmetic are fixed, the answer follows by logic, with no realm of objects needed.'
        correct: true
      - text: 'The agreement shows that 7 is a physical object that everyone has seen.'
        feedback: |
          Nobody claims this. Physical collections of seven things exist, but the number is not one of them: that is what the hook says. The critic's point is about rules, not about a hidden physical object.
      - text: 'There is no agreement: mathematicians disagree about whether 7 is prime.'
        feedback: |
          They do not. Disagreement is about open problems and about foundations (what a number *is*), not about whether 7 is prime. Objectivity of results is common ground; the dispute is about its explanation.
    explanation: |
      Objectivity of mathematical results is accepted by almost everyone. The dispute is what *explains* it: a realm independent of us (Platonism), or fixed rules and definitions (formalists, and in another way intuitionists). Neither side denies the fact; it supports Platonism only if the rival explanations fail.

  - type: order
    id: indispensability
    title: "Best argument 2: indispensability"
    prompt: |
      The **indispensability argument**, according to the survey attributed to Quine (1908-2000) and Putnam (1926-2016), runs in three steps. Put it in order.
    steps:
      - 'P1: We should believe the parts of our best scientific theories that are indispensable to them.'
      - 'P2: Large amounts of mathematics, about numbers, functions and spaces, are indispensable to those theories.'
      - 'C: So we should believe in the mathematics, and in the objects it is about.'
    hint: 'A general principle comes first, the fact about mathematics second, the conclusion last.'
    explanation: |
      The argument is valid: if both premises hold, the conclusion follows. The debate is about the premises. Critics reject P2 (say that mathematics is a convenient tool, and that science could be rewritten without it, or without believing in its objects) or P1 (we may use a theory without believing everything it says). Note what it adds: it ties the *existence* of mathematical objects to the success of science, which is why it also touches Wigner's puzzle.

  - type: text
    id: benacerraf
    title: "The hardest question: access"
    body: |
      The philosopher Paul Benacerraf, in his 1973 paper "Mathematical Truth" (*Journal of Philosophy* 70), set two demands against each other. We want one uniform account of truth (a sentence like "there is a prime number greater than 11" should be true in the same way as "there is a city larger than Rome"), and we want an account of how we *come to know* mathematical truths.

      If numbers are abstract objects outside space and time, then (given a causal theory of knowledge, on which knowing a thing needs some link to it) it is hard to see how our brains, which are physical, could be linked to them. This is the **access problem** for Platonism, in the form of a dilemma between the first demand and the second.

      A common modern form (Field, 1989): mathematicians are reliable (what they accept is almost always true), and we should be able to explain that reliability, but a Platonist seems unable to explain it.

  - type: mcq
    id: benacerraf-q
    title: "A reply and its price"
    prompt: |
      According to Kurt Godel (1906-1978), in the revised 1964 version of his essay on Cantor's continuum problem, despite their distance from sense experience we have *something like a perception* of the objects of set theory: the axioms "force themselves upon us" as true. How does this reply meet the access problem, and what does a critic still ask?
    options:
      - text: 'It says we have a faculty of mathematical intuition, a kind of "seeing" with the mind that is trustworthy; a critic still asks how such a faculty could work, since nothing physical connects us to abstract objects.'
        correct: true
      - text: 'It says numbers are physical objects, so they are seen by the eyes; a critic asks why we cannot see them.'
        feedback: |
          Godel does not say this: for him the objects are abstract, and the perception is of a different kind. The critic's question is how an intuition of the *abstract* could be reliable.
      - text: 'It drops Platonism: numbers are made by us, so there is no access problem.'
        feedback: |
          That is the answer of the rival views (formalism, intuitionism), at the price of other questions below. Godel stays a Platonist and answers by adding a faculty.
    explanation: |
      Scholars disagree on how literally to read Godel's analogy (he does not call the faculty mysterious, and he adds that fruitfulness of an axiom can also count in its favour). Another reply, from defenders of the indispensability argument, is that our knowledge of mathematics is tied to our knowledge of science, so access is through the success of the theories. Whether either reply works is a live debate.

  - type: mcq
    id: heaven
    title: "Trap: Platonism is Plato's heaven"
    prompt: |
      A student says: "Mathematical Platonism is the claim that Plato was right: there is a heavenly world of perfect Forms, and mathematics describes it." According to the standard survey, what is wrong with this?
    options:
      - text: 'The modern position is a claim about mathematics only (objects that are abstract and independent of us). It is inspired by Plato''s theory of eternal Forms but is not a report of Plato''s view, and few defenders claim to be interpreting Plato.'
        correct: true
      - text: 'Plato never wrote about mathematics.'
        feedback: |
          False: Plato founded the Academy in Athens, and mathematics matters in his dialogues. The issue is that modern Platonism is a separate, narrower position.
      - text: 'Platonism says mathematical objects exist only in the minds of mathematicians.'
        feedback: |
          That is the opposite: Independence says they do *not* depend on minds. A view on which they exist only in minds belongs to the mind-made family.
    explanation: |
      According to Plato (c. 427-347 BCE, traditional dates), the Forms are eternal, unchanging patterns known by reason, of which things we sense are imitations. Modern mathematical Platonists keep the idea of abstract, independent objects, but not the further doctrines of Plato's metaphysics. Also, "heaven" is a metaphor for "outside space and time", not a place.

  - type: text
    id: formalism
    title: "Formalism: mathematics is a game"
    body: |
      **Formalism** (game formalism) says mathematics is the manipulation of strings of symbols by fixed rules. A "theorem" is a string reachable by the rules from the starting strings. No numbers need exist: the symbols are not *about* anything.

      The mathematician **David Hilbert** (1862-1943) gave the view its best-known form. According to the survey, he divided mathematics into a **finitary** part (statements about concrete symbols that have clear content) and an **ideal** part (infinite sets and the like), which he treated as a useful game. His programme of the early 1920s asked for a proof, by finitary methods alone, that the whole game is **consistent** (never yields both a statement and its negation). If so, the ideal part would be safe to use, and no mysterious realm would be needed.

      **Best argument:** no mysterious realm and no access problem: we know the rules because we made them, and we know that a chain of moves is correct by looking at it.

  - type: numeric
    id: game
    title: "A small symbol game"
    prompt: |
      A game uses the letters $a$ and $b$. It starts from the string $a$. Two moves are allowed, each applied once to one place in the string: **move 1**, replace the letter $a$ by $ab$; **move 2**, replace one letter $b$ by $bb$. What is the smallest number of moves needed to produce the string $abbb$?
    answer: 3
    wrong:
      - { value: 2, feedback: 'Two moves give at most $abb$ (move 1, then move 2). Each move adds exactly one letter, and $abbb$ has four letters starting from one.' }
    hint: 'Each move adds one letter. Start from $a$ (one letter) and count how many letters must be added.'
    explanation: |
      $$a \to ab \to abb \to abbb$$
      (move 1, then move 2 twice). In the formalist's picture, "$abbb$ is derivable" is a fact about the rules alone: nothing says what $a$ or $b$ mean, and no object is needed. Mathematics, they say, is like this with richer rules.

  - type: mcq
    id: frege
    title: "The hardest question: application"
    prompt: |
      According to Gottlob Frege's objection to the formalists, if mathematics is a calculus of symbols with no meaning, its applications in physics are unexplained: in essence, only applicability raises arithmetic from a game to a science. Which fact about our $a = 4\pi^2 r/T^2$ Moon test makes this objection bite?
    options:
      - text: 'A formula obtained by symbol manipulation from a rule gave a number measured in nature to about 1%: a pure game has no reason to match anything outside it.'
        correct: true
      - text: 'The formula contains the symbol $\pi$, which is not a game piece.'
        feedback: |
          A formalist can treat $\pi$ as one more symbol with rules. The objection is not about which symbols appear but about why the rules' results match measurements.
      - text: 'The test fails, so the formalist is refuted.'
        feedback: |
          The test succeeds (2.72 against 2.69). The objection is that success needs an explanation that a bare game does not supply; formalists have replies (for instance that the physical theory is what applies, and that the game was chosen to model the world), but the question remains.
    explanation: |
      Hilbert's programme itself is usually read as having failed in its original form: Godel's second incompleteness theorem (1931), met in a later lesson, shows that a system of arithmetic cannot prove its own consistency by its own means. The weaker versions of the programme and the applicability question are both still discussed.

  - type: text
    id: intuitionism
    title: "Intuitionism: mathematics is built in the mind"
    image:
      src: img/brouwer.webp
      alt: "Small portrait photograph of L. E. J. Brouwer"
      caption: "L. E. J. Brouwer (1881-1966), a Dutch mathematician, argued that mathematics is a free activity of the mind and that the law of excluded middle cannot be assumed for every statement."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Luitzen_Egbertus_Jan_Brouwer.jpg"
    body: |
      The Dutch mathematician **L. E. J. Brouwer** (1881-1966) held, according to the survey, that **mathematics is a creation of the mind**. A statement is true when we have carried out a **mental construction** that proves it; truth is not a property of statements waiting in a realm.

      A consequence: the **law of excluded middle**, "$A$ or not $A$", $A \lor \lnot A$, is not valid for every statement $A$. For an open problem such as the Riemann hypothesis, we hold neither a proof nor a refutation, so the intuitionist does not yet assert "it is true or it is false". Once a proof or refutation is found, the "or" becomes assertable. (For simple statements that can be checked completely, the law holds.)

      Intuitionists also reject proofs that show something exists without constructing it, and the notion of a completed infinity. Classical mathematicians accept both; intuitionists say they are not constructions.

  - type: mcq
    id: lem
    title: "Open problems and 'or'"
    prompt: |
      About the Riemann hypothesis (a famous unsolved problem in number theory), let $R$ be the statement that it is true. A classical mathematician asserts "$R$ or not $R$" at once. According to an intuitionist, why is that assertion not yet justified?
    options:
      - text: 'To assert "$R$ or not $R$" one needs a construction giving a proof of $R$ or a refutation of $R$, and at present we have neither.'
        correct: true
      - text: 'Because $R$ is probably false.'
        feedback: |
          The intuitionist makes no guess about the outcome. The issue is the *kind of justification* needed for an "or", not which side is likely.
      - text: 'Because intuitionists deny that $R$ is either true or false in any logic, now and forever.'
        feedback: |
          Not so: if someone proves $R$ or refutes it, the intuitionist then accepts the corresponding statement. The law is not asserted for *every* statement in advance, not denied for any particular one.
    explanation: |
      Classical logic reads "or" as "one of the two is the case, whichever we can show". Intuitionism reads it as "we can show one". On a stable, checkable statement the two agree; on open problems they differ.

  - type: text
    id: sqrt2
    title: "Proof by cases without a witness"
    body: |
      A classical proof that there are **irrational** numbers $x$ and $y$ (numbers that are not fractions) with $x^y$ rational runs as follows. Let $r = \sqrt2^{\sqrt2}$. Either $r$ is rational or it is not.

      - If $r$ is rational, take $x = y = \sqrt2$.
      - If $r$ is irrational, take $x = r$ and $y = \sqrt2$, so that $x^y = (\sqrt2^{\sqrt2})^{\sqrt2} = \sqrt2^{2} = 2$.

      Either way a pair exists. But the proof never says *which* pair, and it uses "$r$ is rational or not" as an excluded-middle step. An intuitionist asks for a construction. A direct one: take $x = \sqrt2$ and $y = 2\log_2 3$ (the power of 2 giving 3, doubled), both irrational. Then
      $$x^y = (2^{1/2})^{2\log_2 3} = 2^{\log_2 3} = 3$$

  - type: numeric
    id: witness
    title: "A direct witness"
    prompt: |
      Take $x = \sqrt2$ and $y = 2\log_2 3 \approx 3.17$. What is $x^y$? (Use $x = 2^{1/2}$.)
    answer: 3
    wrong:
      - { value: 2, feedback: 'That is the value in the *second* case of the classical proof. Here $y = 2\log_2 3$, so $x^y = 2^{(1/2)\cdot 2\log_2 3}$.' }
    hint: 'Combine the exponents: $(1/2)\times 2\log_2 3 = \log_2 3$, and $2^{\log_2 3}$ is the number whose base-2 logarithm is $\log_2 3$.'
    explanation: |
      $$x^y = 2^{\frac12\cdot 2\log_2 3} = 2^{\log_2 3} = 3$$
      Checked numerically, $1.41421^{3.16993} \approx 3.0000$. This proof names its witnesses, so the intuitionist accepts it. The classical proof proves existence without producing an example, and the dispute is whether that counts as a proof of the same quality (the classical side says yes, it is valid logic; the intuitionist says it gives less than a construction).

  - type: mcq
    id: answers
    title: "Three answers to Wigner's puzzle"
    prompt: |
      Wigner's puzzle: why does mathematics, built for other reasons, fit nature so well? Match each school to its *kind* of answer.
    options:
      - text: 'Platonism: nature is (in part) an instance of the abstract structures, so the mathematics was always about what is; formalism: the fit is not guaranteed by the game, and needs a separate, physical explanation; intuitionism: our constructions are shaped by our experience of a world with counting, order and continuity.'
        correct: true
      - text: 'Platonism: the fit is an accident of selection; formalism: numbers are discovered by experiments; intuitionism: nature itself is the mathematician.'
        feedback: |
          These are mixed up. Platonism takes the fit as pointing to a real structure; formalism does not claim numbers are discovered by experiment; and "nature as mathematician" is not an intuitionist idea.
      - text: 'All three say the puzzle is not real, because mathematics is only a tool.'
        feedback: |
          They do not: each school has to say something, and each answer carries a price (the hardest question its defenders must answer). Calling mathematics "only a tool" is the deflationary reply, which is a separate position.
    explanation: |
      These are the *kinds* of answer, in the form their defenders would accept; each is a sketch, not a full theory. The ideas of Wigner's puzzle return in a later lesson on explanations of the effectiveness, where the replies are compared in detail.

  - type: mcq
    id: evidence
    title: "What would count as evidence?"
    prompt: |
      Take the disagreement "mathematical objects exist independently of us" (Platonism) against "mathematics is our construction". Which discovery would a defender of the first view count as *favouring* it?
    options:
      - text: 'Independent communities, with no contact, arriving at the same results (the same primes, the same geometry) and then finding that the same structures describe nature.'
        correct: true
      - text: 'A proof that two plus two is five in some other culture.'
        feedback: |
          This would be evidence *against* objectivity. No such case is known; and a dispute about meanings (what "two" and "plus" mean) is a different thing from a different result with the same meanings.
      - text: 'A computer that follows a set of symbol-game rules (like replacing $a$ by $ab$) without any understanding.'
        feedback: |
          A machine playing a game shows rules can be followed mechanically, which suits formalism. It says nothing for or against a realm of objects.
    explanation: |
      A remark on evidence: it is hard to find a decisive test, because each school can absorb the same observations (convergence, for instance, is also explained by shared definitions and by common human minds). The honest summary is that the evidence is *weak between* the views, and the choice rests on which price one prefers to pay.

  - type: mcq
    id: prices
    title: "Where people part ways: the three prices"
    prompt: |
      Match each view to its main price (the hardest question that its defenders must answer).
    options:
      - text: 'Platonism: access, because it is hard to say how we know about objects outside space and time. Formalism: application, because it is hard to say why a symbol game fits the world. Intuitionism: how much classical mathematics survives, because rejecting excluded middle and non-constructive proofs gives up part of it.'
        correct: true
      - text: 'Platonism: application. Formalism: access. Intuitionism: consistency.'
        feedback: |
          Mixed. Platonism has no special application problem (objects fit the world by being its structure); formalism has no access problem (we make the rules); and consistency is the main worry of Hilbert's programme, not of intuitionism.
      - text: 'Each view has no price: one of them has simply been proved right.'
        feedback: |
          No school has been settled by proof. Which price is worth paying depends on what one values (a rich classical mathematics, a modest ontology, a good account of knowledge or of application), and thoughtful people differ.
    explanation: |
      The three prices summarise where thoughtful people part ways, and why: which premise or value each rejects. Platonists accept the existence of abstract objects to keep classical mathematics and its objectivity. Formalists give up meaning to keep a plain ontology. Intuitionists give up part of classical mathematics to keep mathematics in the mind.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **Next:** *Guided proof: Some Infinities Are Bigger*. Is there really a list of all real numbers? Cantor's diagonal argument says no, and the proof will test what each of these three views calls a legitimate proof and a legitimate object.
