id: ch04-explaining
title: "Explanations of the Effectiveness"
kind: concept
own: |
  - **The puzzle as an argument.** Wigner's puzzle (why mathematics built for its own sake fits nature; model case, the Moon test, in which orbit data give the Moon's acceleration $a = 4\pi^2 r/T^2 \approx 2.72\times10^{-3}$ m/s$^2$ and an inverse-square law gives $g/(r/R_E)^2 \approx 2.69\times10^{-3}$ m/s$^2$) rests on three premises: **P1** much mathematics is developed for reasons internal to mathematics; **P2** a substantial share of it, not a few chosen cases, later describes nature accurately; **P3** such a fit would be {{ improbable without some explanation }}. Each reply rejects or answers one of them.
  - **Selection** (Hamming's "we create and select the mathematics that fits"): we keep the structures that work and forget the rest. Example: if $20$ of $10{,}000$ tried structures fit nature, the hit rate is
  $$\frac{20}{10{,}000} = {{ 0.2\% }}$$
  so success is {{ less surprising than the few famous hits suggest }}. It targets **P2**. Limit: it does not say why *any* structure fits, nor why a structure chosen for other reasons predicted a *new* phenomenon.
  - **Evolution** (Quine, Hamming): brains that tracked medium-sized objects (counting, shape, regularity) survived, so basic arithmetic and geometry fit by selection of minds. It targets **P3**. Limit: nothing in it explains why the same minds succeed with spacetime curvature or quantum fields, far from anything our ancestors met.
  - **Abstraction from experience** (Mill, empiricism): counting and geometry were drawn from the world. It targets **P1**. Limit: {{ later mathematics such as complex numbers and non-Euclidean geometry was built before its uses }}.
  - **Shared structure** (structural realism, from the lesson Structural Realism: What Survives Theory Change?): mathematics studies structures, and the world has structure, so the fit is expected. It targets **P3**, but moves the question to why the world has structure at all.
  - **Design** (Galileo's "book of nature", theistic readings): the world is mathematical because it was made so. It accepts all three premises and answers P3 by a designer: a **faith or metaphysical commitment**, not a result of the Moon test. A critic asks whether it explains too easily, since it would fit any mathematics found.
  - **Dissolving it.** Hamming judged his four partial replies insufficient together; Steiner (1998) split the puzzle in two and noted that Wigner ignores failures. **Where people part ways:** how much of the fit is {{ selection and history, and how much is left over }}, which is a mix of evidence and metaphysical commitment.
cards:
  - type: mcq
    id: hook
    title: "Guess: why does it fit?"
    prompt: |
      Guess before any theory. Mathematicians studied conic sections (ellipses and similar curves) for their own beauty, for centuries before anyone thought of planets. Then it turned out that planets move on ellipses. Which explanation seems most natural to you at first?
    options:
      - text: 'Luck and selection: we remember the cases that fit and forget the many that did not.'
        correct: true
        feedback: |
          A serious first guess, tested below. It will turn out to explain part of the fit and leave part open.
      - text: 'Our minds were shaped by this world, so what feels natural to us tends to fit it.'
        feedback: |
          Also a serious first guess (the evolutionary reply), with a limit examined below.
      - text: 'Mathematics and the world share something deep, or the world was made mathematical.'
        feedback: |
          Also a serious first guess (the structural and design replies), each with its own price below.
    explanation: |
      None of these is simply right. The lesson takes each of the main explanations in turn, in its best form, and asks what it explains and what it leaves open. Your first guess is a good place to start: the point is to see where each reply stops working.

  - type: text
    id: recall
    title: "Recall: the puzzle and the tools"
    body: |
      **Recall:** the physicist Eugene Wigner (1902-1995) asked, in 1960, why mathematics built for its own sake fits the physical world so well. Model case, the Moon test: with $r$ the Moon's orbital radius, $T$ its period and $R_E$ the Earth's radius, orbit data give the Moon's acceleration toward the Earth as
      $$a = \frac{4\pi^2 r}{T^2} \approx 2.72\times10^{-3}\ \text{m/s}^2$$
      while an inverse-square law with surface gravity $g = 9.81$ m/s$^2$ and $r/R_E \approx 60.3$ predicts
      $$a = \frac{g}{(r/R_E)^2} \approx 2.69\times10^{-3}\ \text{m/s}^2$$
      Three philosophies of mathematics were compared in the lesson Platonism, Formalism, Intuitionism: **Platonism** (abstract objects, independent of us), **formalism** (a game of symbols and rules) and **intuitionism** (a construction of the mind). Another lesson, Godel and the Limits of Proof, showed that no consistent, effectively axiomatised system strong enough for arithmetic proves all arithmetical truths.

      The puzzle can be put as an argument, with a conclusion that something needs explaining:

      - **P1** Much mathematics is developed for reasons internal to mathematics (beauty, proof, generality).
      - **P2** A substantial share of it, not a few chosen cases, later describes nature accurately.
      - **P3** Such a fit would be improbable without some explanation.
      - **C** So the fit calls for an explanation.

      Each explanation below rejects or answers one of these premises.

  - type: text
    id: evolution
    title: "Evolution: minds shaped by the world"
    body: |
      The **evolutionary reply** says our ability to reason was shaped by natural selection in this world. The philosopher W. V. Quine (1908-2000), in his 1969 essay "Natural Kinds", argued in this spirit about induction: creatures whose inductions were badly wrong tended to die before they reproduced, so our sense of what is similar to what is, on the whole, tuned to the world. Hamming (1980) offered a version for mathematics: the earliest forms of life already carried the seeds of the ability to follow long chains of reasoning.

      Applied to the puzzle, the idea is this. Our ancestors lived among medium-sized objects at modest speeds. Counting a herd, judging a distance and following a regularity all rewarded minds whose "mathematics" matched the world. So simple arithmetic and geometry **fit because they were selected for**.

      **Established fact:** natural selection shapes brains. **Live debate:** how far it explains abstract mathematics. The strongest objection: our ancestors never met curved spacetime or quantum fields. Why would a mind tuned to herds and rivers handle them?

  - type: mcq
    id: evolution-q
    title: "What does the evolutionary reply reach?"
    prompt: |
      An evolutionist says: "Counting and elementary geometry fit the world because minds that got them wrong died out." A critic replies with the fact that general relativity was written in the mathematics of curved spaces, which no ancestor ever needed. What is the fairest summary of this exchange?
    options:
      - text: 'The reply explains why basic arithmetic and geometry come naturally to us, but does not by itself explain why mathematics far from everyday experience also fits; defenders add that those later theories grow out of the basic ones step by step, and critics ask whether that is enough.'
        correct: true
      - text: 'The reply is refuted, because evolution cannot shape a brain that does mathematics.'
        feedback: |
          Too strong. Nobody doubts that brains were shaped by selection. The question is how far that explains the fit of *advanced* mathematics.
      - text: 'The reply fully explains Wigner''s puzzle, since every mathematician has a brain made by evolution.'
        feedback: |
          Too strong the other way. Having an evolved brain does not by itself explain why curved-space mathematics, chosen for other reasons, later described gravity.
    explanation: |
      Fair assessment: partial. Evolution covers the *start* (counting, shape, regularity). The disputed part is the long chain from there to curved spacetime and quantum fields: defenders say each step extends the last and was tested against the world, critics say that is where the puzzle sits.

  - type: text
    id: selection
    title: "Selection bias: we keep what works"
    body: |
      The **selection reply** says the fit is overrated because of what we notice. Think of survivorship: if we only see the planes that returned from a mission, we draw wrong conclusions about the planes. Likewise, mathematicians invent a huge number of structures; physicists try them on the world; the few that fit are taught, praised and remembered. The many that did not fit are quietly dropped. Hamming (1980) listed this among his partial explanations: humans create and select the mathematics that fits a situation, and when existing mathematics does not fit, new mathematics (vectors, tensors) is invented.

      The strongest counter-example comes from the past. In 1596 Johannes Kepler (1571-1630) proposed in *Mysterium Cosmographicum* that the spacing of the six known planetary orbits followed from nesting the five regular solids, one inside the next. It is a beautiful piece of mathematics that **failed** to match more accurate observations, and he later gave it up for ellipses.

  - type: numeric
    id: selection-num
    title: "How many attempts fit?"
    prompt: |
      Suppose mathematicians and physicists tried $10{,}000$ different mathematical structures as models of nature, and $20$ of them fitted well. What percentage of the attempts fitted? (Enter the percentage, a number.)
    answer: 0.2
    tolerance: 0.001
    answerText: '0.2'
    wrong:
      - { value: 20, feedback: 'That is the number of successes, not the percentage. Divide by the $10{,}000$ attempts and multiply by $100$.' }
      - { value: 2, feedback: 'Check the arithmetic: $20/10{,}000 = 0.002$, which is $0.2\%$.' }
    hint: 'Percentage = successes divided by attempts, times 100.'
    explanation: |
      $$\frac{20}{10{,}000} = 0.002 = 0.2\%$$
      The numbers are invented for illustration, not a count from history. The point is the shape of the argument: if most attempts fail and only successes are remembered, "mathematics fits the world" is a statement about the survivors.

  - type: mcq
    id: selection-q
    title: "What the Kepler case shows"
    prompt: |
      Kepler's nested regular solids (1596) were a mathematical idea that did not describe the planets accurately. A defender of the selection reply and a defender of Wigner both cite this case. Which use of it is correct?
    options:
      - text: 'The selection defender: it shows that mathematical ideas about nature can fail, so a story that counts only the hits overstates the fit. Wigner''s defender: it does not remove the cases where mathematics chosen for other reasons *predicted* something new, which selection alone does not explain.'
        correct: true
      - text: 'The selection defender: it proves that mathematics never describes nature. Wigner''s defender: it proves that every mathematical idea fits.'
        feedback: |
          Both claims are far too strong, and no serious defender says either. Kepler also found the ellipse, which did fit.
      - text: 'It shows that Kepler was a bad mathematician, so it says nothing about selection.'
        feedback: |
          His mathematics was fine. The point is that the idea was one of many tried, and the failed ones are rarely mentioned.
    explanation: |
      The selection reply is strongest against the *count* of hits (**P2**) and weakest against single striking predictions. Both sides agree that failures exist; they differ on how much of the remaining fit selection can absorb. The philosopher Mark Steiner (1998) made the related point that Wigner ignores the cases where scientists fail to find a mathematical description.

  - type: text
    id: empiricism
    title: "Abstraction from experience"
    body: |
      The **empiricist reply** says mathematics is not independent of the world at all. John Stuart Mill (1806-1873), in *A System of Logic* (1843), held that mathematics is a very general empirical science: its basic truths are generalizations from repeated experience, such as seeing that two groups of objects together make one larger group. Counting and geometry were drawn from the world, so it is no surprise that they fit it. This reply denies **P1**.

      The standard objections: Gottlob Frege (1848-1925) argued in *The Foundations of Arithmetic* (1884) that Mill confuses the *applications* of arithmetic with the *evidence* for it, and that the account fails for very large numbers and for zero. Another: observed lines always have thickness, but geometry's lines have none, so geometry is not read off what we see.

  - type: mcq
    id: empiricism-q
    title: "Mathematics before its use"
    prompt: |
      The empiricist says: "Mathematics came from experience, so it fits experience." Historians record that Cardano published the formula for cubic equations in 1545 and Bombelli (1572) showed how to calculate with square roots of negative numbers, for algebra's own sake. In the twentieth century the equation of quantum theory (Schrodinger's) turned out to contain the imaginary unit $i$, with $i^2 = -1$. What does this case suggest?
    options:
      - text: 'It is hard for the empiricist: the numbers were built for reasons inside algebra, nobody had experienced them, and the world later used them. The empiricist can reply that the use came through a long chain of steps linking them to measurable results.'
        correct: true
      - text: 'It refutes the empiricist at once, because quantum theory cannot be tested.'
        feedback: |
          Quantum theory is among the best tested theories. The case presses the empiricist on **P1** (origin), not on whether the physics works.
      - text: 'It supports the empiricist: people experienced imaginary quantities every day.'
        feedback: |
          Nobody counts or measures an "imaginary" quantity directly, which is why the name stuck. The case is a difficulty, not a support.
    explanation: |
      Complex numbers and non-Euclidean geometry (Lobachevsky and Bolyai around 1830, Riemann in 1854, general relativity in 1915) are the standard examples of mathematics that *preceded* its uses. The empiricist can say experience shaped the *basic* parts and later mathematics extends them, but this concedes that much of the fit is not read off experience directly.

  - type: text
    id: structure
    title: "Shared structure"
    body: |
      The **structural reply** (see the lesson Structural Realism: What Survives Theory Change?) says that mathematics is the study of **structures**: systems of objects defined by the relations among them, not by what the objects are. The physical world also has structure (relations of distance, order, symmetry). If what physics gets right is exactly this structure, then the fit is expected: two things with the same structure match.

      This reply denies **P3**: the fit would not be improbable. Its price: it moves the puzzle back one step. Why does the world have a structure that human mathematics can describe? And, as the lesson on structure noted, saying exactly which structure is real is a live debate.

  - type: order
    id: structure-order
    title: "The structural reply, in order"
    prompt: |
      Put the structural reply to the puzzle in order.
    steps:
      - 'Mathematics studies structures: patterns of relations among things, whatever the things are.'
      - 'The physical world also has structure, such as relations of order, distance and symmetry.'
      - 'A mathematical structure and a physical structure can be the same pattern, as when the same equations describe two different systems.'
      - 'So a fit between mathematics and nature is not a coincidence but a sharing of pattern; what remains open is why the world has such structure at all.'
    hint: 'Define the first term, state the fact about the world, then the match, then the remaining question.'
    explanation: |
      The argument rejects **P3** by making the fit expected, but it needs two further claims: that physics really captures structure, and that the structure is describable by mathematics. Each is a live debate, not a result.

  - type: text
    id: design
    title: "Design: the world was made mathematical"
    body: |
      The **design reply** says the world is mathematical because it was made so. Galileo (1564-1642), in *The Assayer* (1623), argued in essence that the book of nature is written in mathematical terms and can be read only by those who know mathematics. Einstein, in his 1936 essay "Physics and Reality", wrote that "the eternal mystery of the world is its comprehensibility"; he used the remark to mark what needs explaining, not to assert a particular answer.

      **The believer's best form:** a rational Creator would make an ordered world and minds able to grasp it, so the fit is what we should expect, and a world without the fit would be the surprise. **The non-believer's best reply:** the explanation fits *any* result (if the world had been messy, "God wanted it messy" would do), so it explains little unless it says why *this* mathematics; and a designer adds a further mystery, where the designer's rationality comes from. **The believer answers:** that is a general feature of explanations that end in a first reason, not special to this case.

      **Established fact:** the fit exists. **Live debate:** whether it needs any explanation beyond the earlier replies. **Faith or metaphysical commitment:** that the fit is evidence of a mind behind the world, or that it is not. The Moon test cannot decide this: it is the same number in every case.

  - type: mcq
    id: design-q
    title: "What would a fair critic and a fair believer say?"
    prompt: |
      A student says: "The fit of mathematics to nature proves there is a Creator." A second says: "The design reply is worthless, since it explains everything and so nothing." Which assessment is fairest?
    options:
      - text: 'The first overstates: the fit is compatible with design, but design is one explanation among several, and the choice between them depends on prior commitments. The second overstates too: an explanation can be live without being testable by the Moon test, and a believer can say why a rational designer would favour comprehensible laws.'
        correct: true
      - text: 'The first is right: the fit is a scientific proof, and science has shown a Creator.'
        feedback: |
          A layer-3 claim passed off as layer 1. Science establishes the fit, and the replies above give non-design explanations of part of it; whether the rest points to a designer is a metaphysical commitment, in either direction.
      - text: 'The second is right: any explanation that cannot be tested by experiment is meaningless.'
        feedback: |
          Too quick. Many serious philosophical explanations (including the structural one) are not decided by one experiment, and whether untestable claims are meaningless is itself a philosophical position, one that many philosophers reject.
    explanation: |
      Each side's best version accepts the established fact (the fit) and disagrees on the layer-3 step. A believer should not call design "proved", and a critic should not call it "empty": it is a coherent, non-scientific answer whose weight depends on one's other commitments.

  - type: text
    id: dissolve
    title: "Dissolving the puzzle"
    body: |
      Richard Hamming (1915-1998), in his 1980 reply to Wigner, discussed four partial explanations and judged them unsatisfactory when taken together: (1) **we see what we look for**, since science is only partly grounded in experiment; (2) **we create and select the mathematics that fits**; (3) **mathematics addresses only a part of human experience**, so to say the whole world can be explained by it is an act of faith; (4) **evolution has primed us to think mathematically**.

      The **dissolving** strategy says: do not look for one grand explanation, because there is no single puzzle. Mark Steiner (1998) put it differently, splitting the puzzle in two: Wigner overlooks the many cases in which scientists fail to find a mathematical description, and some successes may not depend on the mathematics itself. Whether, after these partial answers, any residue remains is the core of the dispute: some say none, some say the *predictions of new phenomena* are a residue that no partial reply explains.

  - type: mcq
    id: trap-1
    title: "Trap: evolution explains the positron"
    prompt: |
      A student writes: "Evolution explains Wigner's puzzle completely. Dirac's equation of 1928 predicted the positron because human brains evolved to do mathematics." Why does this overreach?
    options:
      - text: 'Evolution explains why we can reason and count at all, but Dirac''s prediction used mathematics far beyond anything our ancestors met, and the reply does not say why a mind shaped by selection for survival would find laws that govern unseen particles.'
        correct: true
      - text: 'Evolution is a false theory, so it cannot explain anything.'
        feedback: |
          Evolution by natural selection is well established science (established fact). The overreach is in stretching it to cover advanced physics.
      - text: 'Dirac did not use mathematics, only experiments.'
        feedback: |
          False: the equation was written to combine relativity and quantum theory, and its mathematics suggested the positron before the 1932 observation (the history has priority nuances, but the equation came first).
    explanation: |
      The reply is partial: strong for the *start*, weak for the *far end*. Always ask what range of cases an explanation covers.

  - type: mcq
    id: trap-2
    title: "Trap: selection means mathematics is arbitrary"
    prompt: |
      A student writes: "If selection bias explains the fit, then the mathematics we use is an arbitrary human choice and has no connection to reality." What is wrong?
    options:
      - text: 'Selection only says we keep the structures that match nature, which means the surviving ones do match it. That is a connection to reality, even if it does not show that every mathematical idea matches.'
        correct: true
      - text: 'Nothing is wrong: selection shows that mathematics cannot match reality.'
        feedback: |
          If a structure was kept *because* it matches observation, the match is real. Selection explains why we *notice* the hits, not that the hits are fake.
      - text: 'Selection bias is a fallacy that scientists never commit.'
        feedback: |
          Selection effects are real and well studied. The error in the student''s sentence is the step from "we keep what fits" to "what we keep is arbitrary".
    explanation: |
      Selection **filters**: it makes the fit less surprising, not unreal. Whether the filter leaves a residue unexplained is the live question.

  - type: order
    id: premises
    title: "Rebuild the puzzle as an argument"
    prompt: |
      Put the argument for Wigner's puzzle in order (premises first, conclusion last).
    steps:
      - 'P1: Much mathematics is developed for reasons internal to mathematics.'
      - 'P2: A substantial share of it later describes nature accurately.'
      - 'P3: Such a fit would be improbable without some explanation.'
      - 'C: So the fit calls for an explanation.'
    hint: 'Origin of mathematics first, then the fit, then the claim about improbability, then the conclusion.'
    explanation: |
      The argument is valid as written: if the three premises hold, the conclusion follows. The replies in this lesson differ in *which premise* they reject: the next two questions test that.

  - type: mcq
    id: reject-1
    title: "Which premise does each reply reject?"
    prompt: |
      In the argument P1 (much mathematics is developed for internal reasons), P2 (a substantial share later fits nature accurately), P3 (such a fit would be improbable without explanation), which premise does the **empiricist** reply (counting and geometry were drawn from experience) reject?
    options:
      - text: 'P1: it denies that mathematics arose mainly for internal reasons.'
        correct: true
      - text: 'P2: it denies that mathematics fits nature.'
        feedback: |
          The empiricist accepts the fit; the claim is that it is no surprise, because mathematics came from the world. Denying P2 is the selection reply.
      - text: 'P3: it says the fit would be probable because minds were shaped by selection.'
        feedback: |
          That is the evolutionary reply. The empiricist attacks the origin of mathematics (P1).
    explanation: |
      Summary of the replies. **Empiricism** rejects P1. **Selection** attacks P2 (the count of hits). **Evolution** and **structure** reject P3 (the fit is expected, in different ways). **Design** accepts all three and answers C with a designer.

  - type: mcq
    id: reject-2
    title: "Selection and structure"
    prompt: |
      Using the same argument (P1 internal origin, P2 substantial fit, P3 improbable without explanation), which pair is correct?
    options:
      - text: 'Selection attacks P2 (the fit is overstated because we count only hits); the structural reply rejects P3 (mathematics and the world share structure, so the fit is expected).'
        correct: true
      - text: 'Selection attacks P1; the structural reply attacks P2.'
        feedback: |
          Not quite. Selection says nothing about where mathematics came from (P1). The structural reply accepts the fit (P2) and explains it.
      - text: 'Both reject the conclusion C without rejecting any premise.'
        feedback: |
          If the argument is valid and C is false, at least one premise must be false or doubtful. Each reply says which one.
    explanation: |
      Good test of the logic: a valid argument is answered by rejecting a premise (or by accepting the conclusion and explaining it, as design does). Naming the premise makes the dispute precise.

  - type: mcq
    id: partways
    title: "Where people part ways"
    prompt: |
      Two thoughtful people accept the Moon test and the history. One says the fit is largely explained by selection, evolution and shared structure; the other says a residue remains and points to something deeper. Which is the best description of their disagreement?
    options:
      - text: 'They disagree on how much is left over after the partial explanations, and on whether that remainder needs a metaphysical answer; part of this is evidence (how many failures, how many predictions) and part is prior commitment.'
        correct: true
      - text: 'One of them has not looked at the facts.'
        feedback: |
          They can share every fact in the lesson. The difference is in weighing the partial replies and in what they take an explanation to require.
      - text: 'They disagree about whether the Moon test works.'
        feedback: |
          Both accept it. The numbers $2.72\times10^{-3}$ and $2.69\times10^{-3}$ m/s$^2$ are common ground.
    explanation: |
      This is the pattern throughout the course: shared evidence, different weighing, and a layer-3 step on which honest people differ. The lesson does not choose a side.

  - type: text
    id: summary
    body: |
      **Next:** *Is Reality Mathematics?* Instead of explaining why mathematics fits the world, one bold family of views says the world **is** mathematical: Pythagoras, Galileo's book of nature and the modern mathematical universe hypothesis of Max Tegmark. We will meet it and its critics.
