outroTitle: Level 4 in one picture
outro: |
  **Wigner's puzzle** (mathematics made for its own sake fits and predicts), with the **Moon test** as its model case, has deflationary **replies** (selection, evolution, abstraction, shared structure) and a design reply that is a faith commitment. Three schools answer what mathematics is: **Platonism** (discovered; price: access), **formalism** (a game; price: application) and **intuitionism** (constructed; price: lost classical mathematics). **Cantor's diagonal** and **Godel's theorems** show the schools reading the same results differently, and the **Mathematical Universe Hypothesis** answers the puzzle boldly with Platonism, facing objections from observers, Godel, measure and testability. All of it sits in the **three layers** of fact, debate and commitment. Next: the Level Review, then the Level Challenge.
