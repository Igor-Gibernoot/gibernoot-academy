id: ch04-map
title: "Content Map: Is Mathematics Invented or Discovered?"
kind: map
name: Level 4, Invented or Discovered? (Wigner's puzzle, the Moon test, replies, Platonism, formalism, intuitionism, Cantor's diagonal, Godel, the Mathematical Universe Hypothesis, objections)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the map of Level 4 one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the traps (a price paid to the wrong school, a theorem stretched too far, a reply answering the wrong premise), and every wrong pick comes with a reason.

  Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: puzzle
    title: Wigner's puzzle
    row: 1
    col: 2
    body: |
      **Wigner** (1960): mathematics made for its own sake (beauty, logic, curiosity) keeps **describing and even predicting** the physical world, "bordering on the mysterious". Three marks: developed without the application in mind, later found to fit, often predicting something **new**. Whether it needs an explanation at all is a live debate.
    decoys:
      - body: |
          **Wigner** (1960): mathematics is **useful** in physics, and that alone is the puzzle: a tool that works is always surprising. Three marks: developed without the application in mind, later found to fit, often predicting something **new**. Whether it needs an explanation at all is a live debate.
        feedback: |
          Usefulness is not the puzzle. Tools built for a purpose working for that purpose is no surprise. The puzzle is that structures made for *other* reasons fit, and predict.
      - body: |
          **Wigner** (1960): mathematics made for its own sake keeps describing and even predicting the physical world, so Wigner **proved** that mathematics is discovered, "bordering on the mysterious". Three marks: developed without the application in mind, later found to fit, often predicting something **new**.
        feedback: |
          Wigner posed a puzzle and said he found no rational explanation. He proved nothing about invention or discovery; each answer in this level carries its own metaphysical commitment.
    explanation: |
      The root of the level. Every other box is an attempt to explain, dissolve or test it.

  - id: moon
    title: The Moon test
    row: 1
    col: 1
    body: |
      The model case. With $r$ the Moon's orbital radius, $T$ its period and $R_E$ the Earth's radius, orbit data give $a = 4\pi^2 r/T^2 \approx 2.72\times10^{-3}$ m/s$^2$, and an inverse-square law with surface gravity gives $g/(r/R_E)^2 \approx 2.69\times10^{-3}$ m/s$^2$ (with $r/R_E\approx 60$): they **agree to about 1%**.
    decoys:
      - body: |
          The model case. With $r$ the Moon's orbital radius, $T$ its period and $R_E$ the Earth's radius, orbit data give $a = 4\pi^2 r/T^2 \approx 2.72\times10^{-3}$ m/s$^2$, and an inverse-square law gives $g/(r/R_E)^2 \approx 2.69\times10^{-3}$ m/s$^2$ (with $r/R_E\approx 60$): they **differ by a factor of about 60**.
        feedback: |
          The factor 60 is the ratio $r/R_E$ of the distances; the law divides $g$ by its square (about 3600), and the result agrees with the orbit to about 1%. That agreement is the point of the test.
      - body: |
          The model case. With $r$ the Moon's orbital radius, $T$ its period and $R_E$ the Earth's radius, orbit data give $a = 4\pi^2 r/T^2 \approx 2.72\times10^{-3}$ m/s$^2$, and a **linear** law, $g/(r/R_E)$, gives about $0.16$ m/s$^2$: they agree to about 1%.
        feedback: |
          Gravity falls off as the inverse *square* of distance. A linear law would give a number 60 times too large; only the inverse square matches the orbit.
    explanation: |
      The Moon test shows the *precision* of the fit that Wigner's puzzle is about. It is a number, not a philosophy.

  - id: replies
    title: The replies
    row: 1
    col: 3
    body: |
      The puzzle rests on P1 (mathematics is built for internal reasons), P2 (a substantial share fits) and P3 (such a fit would be improbable without explanation). **Selection** targets P2, **evolution** and **shared structure** target P3, **abstraction** targets P1, and **design** accepts all three and adds a designer (a faith commitment).
    decoys:
      - body: |
          The puzzle rests on P1 (mathematics is built for internal reasons), P2 (a substantial share fits) and P3 (such a fit would be improbable without explanation). **Selection** targets P1, **evolution** and **shared structure** target P3, **abstraction** targets P2, and **design** accepts all three and adds a designer (a faith commitment).
        feedback: |
          Swapped. Selection says the share that fits is small once we count the failures (P2). Abstraction says mathematics came from experience, denying that it was built for internal reasons (P1).
      - body: |
          The puzzle rests on P1 (mathematics is built for internal reasons), P2 (a substantial share fits) and P3 (such a fit would be improbable without explanation). **Selection** targets P2, **evolution** and **shared structure** target P3, **abstraction** targets P1, and **design** is a result of the Moon test.
        feedback: |
          Design is a faith or metaphysical commitment: it would explain any mathematics found to fit. The Moon test is data, and every reply reads the data.
    explanation: |
      Each reply keeps part of the answer and leaves a limit (new phenomena predicted from mathematics chosen for other reasons). Together they are not judged enough.

  - id: platonism
    title: Platonism
    row: 2
    col: 1
    body: |
      Mathematical objects exist, are **abstract** (outside space and time, causing nothing) and exist **independently** of minds. Best arguments: objectivity and **indispensability** (Quine, Putnam). Price: **access**, Benacerraf's question, how can we know them? A modern position, not a report of Plato's teaching.
    decoys:
      - body: |
          Mathematical objects exist, are **physical** (spread through space and time, causing things) and exist independently of minds. Best arguments: objectivity and **indispensability** (Quine, Putnam). Price: **access**, Benacerraf's question, how can we know them?
        feedback: |
          Platonism makes them abstract, outside space and time and causally inert. That is exactly what creates the access problem: a physical object could be seen or measured.
      - body: |
          Mathematical objects exist, are **abstract** (outside space and time, causing nothing) and exist independently of minds. Best arguments: objectivity and **indispensability**. Price: **application**, Frege's question, why does mathematics fit the physical world?
        feedback: |
          That is the formalist's price. The Platonist's hardest question is access: how can we know objects that cause nothing in us (Benacerraf, 1973).
    explanation: |
      The "discovered" pole, and the base of the Mathematical Universe Hypothesis.

  - id: formalism
    title: Formalism
    row: 2
    col: 2
    body: |
      Hilbert's version: mathematics is a **game of symbols and rules**, a proof is a chain of allowed moves, and no realm of objects stands behind it. Best argument: no mysterious realm. Price: **application**, Frege's question, why does it fit the world? Hilbert's programme wanted a finitary consistency proof.
    decoys:
      - body: |
          Hilbert's version: mathematics is a **game of symbols and rules**, a proof is a chain of allowed moves, and no realm of objects stands behind it. Best argument: no mysterious realm. Price: **access**, Benacerraf's question, how can we know the objects? Hilbert's programme wanted a finitary consistency proof.
        feedback: |
          Formalism has no realm of objects to access. The question it faces is application (Frege): if it is only symbol games, why does it apply so well to the world?
      - body: |
          Hilbert's version: mathematics is a **game of symbols and rules**, a proof is a chain of allowed moves, and no realm of objects stands behind it. Best argument: no mysterious realm. Price: application. Hilbert's programme wanted a finitary proof that mathematics is **complete**, with every statement settled.
        feedback: |
          The programme aimed at a finitary proof of *consistency* (never both a statement and its negation), not completeness. Godel's theorems of 1931 are usually read as showing that aim cannot be reached.
    explanation: |
      The "game" pole. Its safety net, the consistency proof, is what Godel's second theorem attacks.

  - id: intuitionism
    title: Intuitionism
    row: 2
    col: 3
    body: |
      Brouwer: mathematics is a **mental construction**, so a statement is true when we can construct a proof of it. The law of excluded middle, $A \lor \lnot A$, is **not accepted for every $A$**. Price: some classical mathematics is lost or must be redone, e.g. $x=\sqrt2$, $y=2\log_2 3$ gives $x^y=3$ by construction.
    decoys:
      - body: |
          Brouwer: mathematics is a **mental construction**, so a statement is true when it is **true of objects outside the mind**. The law of excluded middle, $A \lor \lnot A$, is not accepted for every $A$. Price: some classical mathematics is lost or must be redone.
        feedback: |
          That is the Platonist's truth. For the intuitionist, truth means a constructed proof, which is why a statement with neither proof nor refutation is not yet true or false.
      - body: |
          Brouwer: mathematics is a **mental construction**, so a statement is true when we can construct a proof of it. The law of excluded middle, $A \lor \lnot A$, holds for every $A$, but **proofs by contradiction are rejected**. Price: some classical mathematics is lost or must be redone.
        feedback: |
          It is the law itself that is not accepted for every statement. Because of that, an existence proof that only shows "not nothing" gives no witness and is not enough.
    explanation: |
      The "constructed" pole. Its price is the amount of classical mathematics that survives.

  - id: diagonal
    title: Cantor's diagonal
    row: 3
    col: 1
    body: |
      From any list $x_1, x_2, \dots$ of reals in $(0,1)$ build $d$ with digit $d_k \ne x_{kk}$ (using only 1 to 8), so $d$ is **missing from the list**: the reals are **uncountable**, and no matching with $1,2,3,\dots$ exists. A theorem about sets, not a measurement of physical space. Intuitionists keep the construction, not the finished totality.
    decoys:
      - body: |
          From any list $x_1, x_2, \dots$ of reals in $(0,1)$ build $d$ with digit $d_k \ne x_{kk}$ (using only 1 to 8), so $d$ is missing from the list: the reals are uncountable. It **measures how big physical space is**, showing that space has more points than counting can reach.
        feedback: |
          The theorem is about mathematical sets and matchings. It says nothing by itself about whether physical space is a continuum of points.
      - body: |
          From any list $x_1, x_2, \dots$ of reals in $(0,1)$ build $d$ with digit $d_k \ne x_{kk}$ (using only 1 to 8), so $d$ is missing from the list: the reals are uncountable. It **only works for Platonists**; for formalists it is not a valid proof.
        feedback: |
          The proof is valid in the symbol game too. The schools differ on what the result *means* (a discovery, a derived label, a construction) and not on the digit trick.
    explanation: |
      The same self-reference trick, applied to lists, that Godel applies to proofs. It is also how the schools show their different readings.

  - id: godel
    title: Godel's theorems
    row: 3
    col: 2
    body: |
      For a consistent, effectively axiomatised system $F$ with enough arithmetic: **first**, some true arithmetical sentence $G_F$ has $F \nvdash G_F$ (loosely, "I am not provable"); **second**, $F \nvdash \mathrm{Con}(F)$. They are about particular systems, and weak ones (Presburger) escape. Mind-beats-machine is a live debate.
    decoys:
      - body: |
          For a consistent, effectively axiomatised system $F$ with enough arithmetic: **first**, some true arithmetical sentence $G_F$ has $F \nvdash G_F$; **second**, $F \nvdash \mathrm{Con}(F)$. So **truth cannot be proved by anyone**, and science and God are beyond reasoning.
        feedback: |
          Stretched. The theorems concern particular formal systems, not provability in an absolute sense, and they say nothing about science, God or relativism.
      - body: |
          For a consistent, effectively axiomatised system $F$ with enough arithmetic: **first**, some false arithmetical sentence $G_F$ is **provable** in $F$; **second**, $F \nvdash \mathrm{Con}(F)$. They hold for **every** system, even weak ones such as Presburger arithmetic.
        feedback: |
          Wrong direction and wrong scope. $G_F$ is true but unprovable, and the theorems need enough arithmetic: Presburger arithmetic (addition only) is complete.
    explanation: |
      Formalists read it as the original aim failing, Platonists as truth outrunning proof, intuitionists deny that truth outruns constructive proof.

  - id: muh
    title: The Mathematical Universe Hypothesis
    row: 3
    col: 3
    body: |
      **Tegmark**: from the External Reality Hypothesis he argues that the physical world **is** an abstract mathematical structure, "exists mathematically" equals "exists physically", with observers as substructures. Its companion, Level IV, says every structure exists. It needs something like **Platonism**, and it is a metaphysical commitment, not a result.
    decoys:
      - body: |
          **Tegmark**: from the External Reality Hypothesis he argues that mathematics merely **describes** the physical world, as a map describes a territory, so "exists mathematically" is weaker than "exists physically". Its companion, Level IV, says every structure exists.
        feedback: |
          That is the modest reading (Galileo's book of nature). The MUH is the bold one: the world *is* the structure.
      - body: |
          **Tegmark**: from the External Reality Hypothesis he argues that the physical world is an abstract mathematical structure, an **experimentally confirmed** result of the Moon test, with observers as substructures. It needs something like Platonism.
        feedback: |
          No experiment confirms it. Its stated prediction (more regularities will be found) is one almost every view of science expects, and it remains a metaphysical commitment.
    explanation: |
      The bold answer to Wigner's puzzle: the fit is no surprise if the world is mathematics.

  - id: objections
    title: The objections
    row: 4
    col: 3
    body: |
      **Observers** (why does a structure contain minds?), **Godel** (answered by the Computable Universe Hypothesis, at a cost), **measure** (equal weights $1/N$ with $N\to\infty$ cannot be normalised to $1$) and **testability** (the prediction is shared by nearly every view). They press on a structure, not on the Moon test.
    decoys:
      - body: |
          **Observers** (why does a structure contain minds?), **Godel** (answered by the Computable Universe Hypothesis, which allows **more** mathematics), **measure** (equal weights $1/N$ with $N\to\infty$ cannot be normalised to $1$) and **testability**.
        feedback: |
          The Computable Universe Hypothesis keeps only computable structures, so it allows *less* mathematics. That is its cost.
      - body: |
          **Observers** (why does a structure contain minds?), **Godel** (answered by the Computable Universe Hypothesis, at a cost), **measure** (with infinitely many structures, equal weights $1/N$ **sum to $1$ in the limit**) and **testability**.
        feedback: |
          They do not: $N$ weights of $1/N$ sum to $1$ for each finite $N$, but as $N\to\infty$ each weight is zero and the total is zero, so "typical" needs a rule.
    explanation: |
      Four pressure points on the bold answer. Each is a reason thoughtful people part ways with Tegmark.

edges:
