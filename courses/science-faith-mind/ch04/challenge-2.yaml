id: ch04-challenge-2
title: "Level Challenge: Invented or Discovered? (2)"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge, part 2: the agreement test and the stress test"
    body: |
      Two more problems, independent of part 1. The toolkit, restated.

      - **Three schools.** *Platonism* (modern sense): mathematical objects exist, are abstract (outside space and time, causing nothing) and exist independently of minds. *Formalism* (Hilbert's version): mathematics is a game of symbols and rules, with no realm of objects behind it. *Intuitionism* (Brouwer): mathematics is a mental construction, so a statement is true when we can construct a proof of it, and the law of excluded middle $A \lor \lnot A$ is not accepted for every statement $A$. Example of the price: the classical proof that irrational $x, y$ exist with $x^y$ rational uses that law and names no witness, while $x = \sqrt2$, $y = 2\log_2 3$ gives $x^y = 3$ directly.
      - **Replies to Wigner's puzzle** (why mathematics built for its own reasons keeps fitting nature): *selection* (Hamming: we keep the mathematics that fits), *evolution* (Quine, Hamming: minds that tracked medium-sized objects survived), *abstraction from experience* (Mill), *shared structure* (structural realism), *design* (a metaphysical commitment).
      - **Mathematical Universe Hypothesis (MUH)** (Max Tegmark, 2008): our physical world is an abstract mathematical structure, so "exists mathematically" equals "exists physically". Four objections: observers, Godel, measure, testability. Rivals: *structural realism* (Worrall 1989: we know the structure; Ladyman 1998: structure is all there is) and the *map-territory* objection (Alfred Korzybski: a description is not the thing described).
      - **Godel** (1931): for a consistent, effectively axiomatised system $F$ with enough arithmetic, some true sentence $G_F$ is not provable in $F$.
      - **Layers**: label each claim as (1) established fact, (2) live debate, or (3) metaphysical commitment.

  # ---------------- Problem 4 ----------------
  - type: text
    id: p4-recall
    title: "Problem 4 · Two civilisations, one theorem"
    body: |
      **Recall.** The *agreement argument* for discovery: mathematicians everywhere who check a result get the same answer, so (says the Platonist) they are exploring something that is there. Formalists and intuitionists accept the agreement and explain it differently. Selection and evolution are rivals that explain *some* agreement without a realm of objects.

      **Problem 4.** An invented case. Two civilisations, on different planets, never in contact, each develop arithmetic. Both come to the same two results. **Result A:** the sum of the first $n$ odd numbers is $n^2$. **Result B:** a set with $n$ members has exactly $2^n$ subsets (the empty set and the whole set included). Is the agreement evidence of discovery?

  - type: numeric
    id: p4-odd
    title: "Result A, by hand"
    prompt: |
      Result A says $1 + 3 + 5 + \dots + (2n-1) = n^2$. Add the first $10$ odd numbers directly, from $1$ to $19$. What is the sum?
    answer: 100
    wrong:
      - { value: 190, feedback: 'That is the sum $1 + 2 + \dots + 19$, all the whole numbers. Only the odd ones are added here.' }
      - { value: 19, feedback: 'That is the last term. The result concerns the whole sum, not its largest term.' }
    hint: The first 10 odd numbers end at $2\cdot10-1 = 19$. Pair them from the two ends of the list.
    explanation: |
      Pair $1$ with $19$, $3$ with $17$, and so on: five pairs, each summing to $20$, so $5\times20 = 100 = 10^2$. A picture proof: each new odd number adds an L-shaped border to a square of dots, turning an $(n-1)\times(n-1)$ square into an $n\times n$ one. The check is easy for any civilisation that can count, which is the point of the agreement argument.

  - type: numeric
    id: p4-subsets
    title: "Result B, by hand"
    prompt: |
      Result B says a set with $n$ members has $2^n$ subsets. A civilisation has $6$ distinct tools. In how many ways can it choose a team of tools, from none of them (the empty choice) up to all six?
    answer: 64
    wrong:
      - { value: 36, feedback: 'That is $6^2$. Each tool is not paired with another; each tool is independently in or out, which gives $2$ choices per tool, multiplied six times.' }
      - { value: 63, feedback: 'That leaves out the empty team. Result B counts the empty subset, and so does this question ("from none of them").' }
      - { value: 12, feedback: 'That is $2\times6$. The choices multiply: $2$ options for the first tool, times $2$ for the second, and so on.' }
    hint: "For each tool, there are two choices, in the team or out."
    explanation: |
      $$2\times2\times2\times2\times2\times2 = 2^6 = 64$$
      The reasoning does not depend on what the tools are, nor on who counts them, which is why both civilisations should reach it.

  - type: mcq
    id: p4-reads
    title: "Three readings of the agreement"
    prompt: |
      Both civilisations reach Results A and B. Which pairing of school and explanation of the agreement is right?
    options:
      - text: 'Platonist: both explored the same abstract objects (the numbers), so they find the same facts. Formalist: both chose similar rules (the same counting and "in or out" steps), so the same moves lead to the same results. Intuitionist: both are minds that can construct the same steps, and the constructions succeed.'
        correct: true
      - text: 'Platonist: both invented the same rules by luck. Formalist: both explored the same objects. Intuitionist: both read the result off the physical world.'
        feedback: |
          Scrambled. A Platonist does not rely on luck: the objects are the common cause. A formalist denies there are objects to explore, and an intuitionist grounds mathematics in mental construction, not in the physical world.
      - text: 'None of the schools can explain the agreement, so it favours a fourth view that is not discussed.'
        feedback: |
          Each school has an explanation. Whether one is better is the live question; none is ruled out by the agreement itself.
      - text: 'All three say the agreement is a coincidence.'
        feedback: |
          No school says that. Each gives a common cause: the same objects, the same rules, or the same kind of constructing minds.
    explanation: |
      The agreement is **layer 1** (the results are checkable and the same). That it signals discovery is **layer 3**, because the rivals have their own common cause for it. A fair test of the argument asks: where would the schools predict *disagreement*?

  - type: mcq
    id: p4-split
    title: "Where the civilisations could differ"
    prompt: |
      Suppose civilisation B refuses to use the law of excluded middle for statements about infinite sets, while civilisation A accepts it. Which of the following is the best description of their situation?
    options:
      - text: 'They still agree on Results A and B, which are about finite sets and are proved by explicit constructions. They would differ on classical proofs that need the law to settle a statement about infinite totals, as in the proof that names no witness for $x^y$ rational.'
        correct: true
      - text: 'They would disagree on every result, since without the law nothing can be proved.'
        feedback: |
          Intuitionists prove a great deal. Results about finite counting are constructive. The loss is of some classical proofs, not of all mathematics.
      - text: 'They disagree only about words: any classical proof can be turned into a constructive one with no change.'
        feedback: |
          Not in general. Some classical results have no known constructive version, which is why intuitionism has a price (and why the classical proof of the $x^y$ example had to be replaced by a direct witness).
    explanation: |
      Disagreement here is itself informative. A Platonist says B has restricted its reach (or that the objects are there even if B cannot construct them); a formalist says B uses a different rule set; an intuitionist says A claims more than can be constructed. This shows the three schools differ in what they accept, not in the finite arithmetic everyone checks.

  - type: numeric
    id: p4-witness
    title: "The constructive witness"
    prompt: |
      An intuitionist offers $x = \sqrt2$ and $y = 2\log_2 3$ as a direct witness that an irrational to an irrational power can be rational. What is $x^y$? (Use $\sqrt2 = 2^{1/2}$.)
    answer: 3
    wrong:
      - { value: 9, feedback: 'That would follow from $y = 4\log_2 3$. With $\sqrt2 = 2^{1/2}$ the exponent halves: $(2^{1/2})^{2\log_2 3} = 2^{\log_2 3}$.' }
      - { value: 6, feedback: 'The logarithm turns the power of $2$ back into $3$; nothing is multiplied by $2$ at the end.' }
      - { value: 1.5, feedback: 'The exponent is $2\log_2 3$, not $\log_2 3$ divided by $2$, so the half in $\sqrt2$ is cancelled by the $2$ in $y$.' }
    hint: Write $\sqrt2 = 2^{1/2}$, multiply the exponents, then use $2^{\log_2 3} = 3$.
    explanation: |
      $$(\sqrt2)^{2\log_2 3} = \left(2^{1/2}\right)^{2\log_2 3} = 2^{\log_2 3} = 3$$
      Both numbers are irrational and the result is $3$, rational, with no appeal to excluded middle. A Platonist loses nothing by accepting this proof as well; the difference is that the intuitionist cannot accept the other one.

  - type: mcq
    id: p4-select
    title: "The selection and evolution replies"
    prompt: |
      A critic of Platonism says: "The two civilisations agree on Results A and B because any minds that survived had to count and compare quantities. Nothing is discovered; survival shaped us." Which is the fair verdict on this reply?
    options:
      - text: 'It is a serious rival for results as elementary as A and B, which concern things like counting and choosing. Its limit is that it says little about results far from anything ancestors met, such as properties of infinite sets, where the agreement also holds.'
        correct: true
      - text: 'It refutes Platonism, because a cause in evolution leaves no room for objects.'
        feedback: |
          A Platonist can reply that evolution explains why we *find* some truths, not why they are true. A cause of belief does not show the belief false (a point that cuts both ways).
      - text: 'It has no force, since evolution has nothing to do with mathematics.'
        feedback: |
          It has some force: it is the reply Quine and Hamming took seriously for elementary mathematics. Dismissing it skips the question of how our minds became reliable.
    explanation: |
      The pattern from Level 4: evolution answers the *basic* fit and leaves the *advanced* fit (spacetime curvature, quantum fields, infinite sets) open. **Layer:** a live debate. Both sides use the same premise, that our mathematical beliefs are reliable, and differ on what explains the reliability.

  - type: order
    id: p4-order
    title: "Rebuild the agreement argument"
    prompt: |
      Put the argument from agreement to discovery in order, from the evidence to the conclusion, including the step a critic attacks.
    steps:
      - 'Two isolated civilisations prove the same results (A and B) by different routes.'
      - 'P1: the best explanation of independent agreement is a common cause outside both.'
      - 'P2: the only candidate for a common cause outside both is a realm of mathematical objects that both explored.'
      - 'So (C): the objects exist and mathematics is discovered.'
      - 'A critic attacks P2: a common cause may be the same rules, the same kind of minds, or survival pressures, none of which needs objects.'
    hint: Evidence, then the rule of explanation, then the claim that only objects fit, then the conclusion, then the attack.
    explanation: |
      The argument is valid: if P1 and P2 are true, C follows. The dispute is about **P2**. This separates the validity of the steps from the truth of the premises, as in every argument in this course.

  - type: mcq
    id: p4-parting
    title: "Where thoughtful people part ways"
    prompt: |
      Everyone in Problem 4 accepts the same calculations. Which pairing of a disagreement with its source (a premise, a value, or a kind of evidence) is right?
    options:
      - text: 'Platonist and formalist: they differ on a premise (whether the only common cause of agreement is a realm of objects). The Platonist and the intuitionist: they differ in what they value (how much classical mathematics to keep versus how much to demand by way of construction). Platonist and evolutionist: they differ in what counts as an explanation of our reliability (truth of the objects, or survival of the minds).'
        correct: true
      - text: 'They differ over a result that one of them has computed wrongly.'
        feedback: |
          The sums and the counts are checked and agreed. The disagreement is about what the agreement means.
      - text: 'They differ only in vocabulary: all of them say "discovered" and "invented" mean the same.'
        feedback: |
          They answer different questions: do the objects exist, what makes a proof valid, what explains the reliability of our minds. Those are not wording differences.
    explanation: |
      Facts: layer 1. Premise P2 and the role of evolution: layer 2. Whether abstract objects exist: layer 3. A fair statement of each school mentions the price it pays: access (Platonism), application (formalism), reach (intuitionism).

  # ---------------- Problem 5 ----------------
  - type: text
    id: p5-recall
    title: "Problem 5 · Stress-testing the Mathematical Universe Hypothesis"
    body: |
      **Recall.** The MUH says our physical world *is* an abstract mathematical structure (observers are "self-aware substructures" inside it), and its companion, the Level IV multiverse, says every mathematical structure exists physically. It starts from the External Reality Hypothesis (a physical reality exists independent of humans). Tegmark's four objections: **observers**, **Godel**, **measure**, **testability**. The Computable Universe Hypothesis (keep only computable structures) is his answer to the Godel worry.

      **Problem 5.** Take the four objections in turn, then set them against structural realism and the map-territory objection, and give each school's verdict.

  - type: mcq
    id: p5-needs
    title: "What the hypothesis needs first"
    prompt: |
      According to the MUH, what is the first thing a formalist or an intuitionist is likely to reject, before any of the four objections?
    options:
      - text: 'The assumption that mathematical structures exist independently of us (something like Platonism), because for them mathematics is symbols and rules or a mental construction.'
        correct: true
      - text: 'The Moon test, since it is not a real calculation.'
        feedback: |
          The Moon test is a checked calculation ($2.72\times10^{-3}$ against $2.69\times10^{-3}$ m/s$^2$). The MUH uses the fit, but the schools do not dispute the number.
      - text: 'The claim that the Moon exists.'
        feedback: |
          The MUH does not deny the Moon; it says what the Moon is: part of a structure.
    explanation: |
      This is why a verdict on the MUH is partly a verdict on the Platonism question from earlier in the level. **Layer:** a metaphysical commitment on each side.

  - type: mcq
    id: p5-observers
    title: "Objection 1: observers"
    prompt: |
      A critic asks: "A structure is a set of relations among abstract points. How can such a thing contain minds, who feel and see?" Which reply fits the MUH, and which worry remains?
    options:
      - text: 'Reply: if a structure is rich enough to contain the relations a brain has, then the "self-aware substructure" is what those relations are, seen from within, just as a physicalist says a brain is. Worry that remains: it assumes the explanatory gap closes, which physicalism, dualism and panpsychism (Level 3) dispute.'
        correct: true
      - text: 'Reply: the MUH does not claim observers exist. Worry: none.'
        feedback: |
          The MUH is meant to include observers as substructures. If it left them out it would not describe our world.
      - text: 'Reply: observers are not part of any structure, so they cannot be explained by one. Worry: none.'
        feedback: |
          That would make observers a leftover, which is what the critic says the MUH cannot allow. The MUH has to include them.
    explanation: |
      This objection is the hard problem of consciousness (Level 3) again, now with a mathematical setting. It is a **live debate**; the MUH inherits whatever difficulty physicalism has, and neither side has settled it.

  - type: numeric
    id: p5-measure
    title: "Objection 3: the measure, with toy numbers"
    prompt: |
      Toy model: there are $N = 10^6$ structures, all given the same weight $1/N$, and exactly $50$ of them contain observers like us. What is the total weight of those $50$, in percent?
    answer: 0.005
    tolerance: 0.0003
    answerText: '$\dfrac{50}{10^6} = 5\times10^{-5} = 0.005\%$'
    wrong:
      - { value: 50, feedback: 'That is the count, not the weight. Each structure has weight $1/10^6$, so $50$ of them weigh $50/10^6$.' }
      - { value: 5, feedback: 'That is $50/1000$ in percent, which would be the answer for $N=10^3$. Here $N = 10^6$.' }
      - { value: 0.00005, feedback: 'That is the weight as a fraction ($5\times10^{-5}$), not in percent. Multiply by $100$.' }
    hint: Total weight = number of structures counted times $1/N$. Then convert to percent.
    explanation: |
      $$\frac{50}{10^6} = 5\times10^{-5} = 0.005\%$$
      With equal weights, the share of structures with observers is just their fraction of the whole.

  - type: numeric
    id: p5-measure2
    title: "Letting N grow"
    prompt: |
      Keep the same $50$ structures with observers, but let the total number of equally weighted structures grow from $N = 10^6$ to $N = 10^9$. By what factor does their total weight shrink?
    answer: 1000
    wrong:
      - { value: 3, feedback: 'That is the change in the exponent ($6$ to $9$). The weight is $50/N$, so it shrinks by the ratio of the $N$s, not by the difference of their exponents.' }
      - { value: 1, feedback: 'The count of observer structures stays $50$, but the weight of each shrinks with $N$, so the total does change.' }
    hint: Weight $= 50/N$. Divide the old weight by the new one.
    explanation: |
      $$\frac{50/10^6}{50/10^9} = \frac{10^9}{10^6} = 1000$$
      As $N \to \infty$ the weight of any fixed finite set goes to $0$, and equal weights $1/N$ cannot add up to total probability $1$ over an infinite set of structures (each weight would have to be $0$, and the total would be $0$, or each positive and the total infinite). So "typical" needs another rule, which is the measure problem.

  - type: mcq
    id: p5-measure3
    title: "What the measure problem does and does not show"
    prompt: |
      Which statement about the measure objection is right?
    options:
      - text: 'It shows that "equal weights" cannot define what is typical when there are infinitely many structures; the hypothesis needs a further rule for weighting them, and critics (such as Jurgen Schmidhuber, who proposed a simpler-structures-weigh-more rule) say that rule is not given by the hypothesis itself.'
        correct: true
      - text: 'It shows that the hypothesis is false.'
        feedback: |
          An open problem in a theory is not a refutation. It is a cost: the theory is not yet able to say what it predicts is typical.
      - text: 'It shows only that probabilities are always undefined in mathematics.'
        feedback: |
          Probabilities are well defined on finite sets and on many infinite ones (with unequal weights). What fails is a uniform weight over infinitely many structures.
    explanation: |
      **Layer:** a live debate about whether a rule can be justified. A defender replies that the same problem faces any multiverse proposal; a critic replies that this makes it a shared difficulty, not a solved one.

  - type: mcq
    id: p5-godel
    title: "Objection 2: Godel and the price of the reply"
    prompt: |
      Godel's theorem says a consistent, effectively axiomatised system $F$ with enough arithmetic has true sentences $F$ cannot prove. How does this bear on the claim that *every* mathematical structure exists, and what does the Computable Universe Hypothesis cost?
    options:
      - text: 'Some structures cannot be fully captured by any formal system of that kind, so "all structures" is a vaguer collection than it seems. The reply keeps only computable structures, which avoids the problem but gives up the claim that every mathematical structure exists physically.'
        correct: true
      - text: 'Godel''s theorem proves that no mathematical structure exists, so the MUH is false.'
        feedback: |
          The theorems are about what a formal system can prove, not about what exists. They do not refute the existence of structures.
      - text: 'Godel''s theorem is irrelevant, because the MUH is not a formal system.'
        feedback: |
          The worry is about whether a formal description can capture all of what the hypothesis claims; that is why Tegmark responded to it. Irrelevance would need a reason, and the reply to the objection concedes it matters.
    explanation: |
      Unprovability is relative to $F$, and the theorems do not say mathematics is mystical or that truth is beyond reach. The cost of the reply is a smaller hypothesis. **Layer:** the theorems are fact; their bearing on the MUH is a live debate.

  - type: mcq
    id: p5-test
    title: "Objection 4: testability"
    prompt: |
      Tegmark's stated test: if the MUH is true, more and more mathematical regularities will be found in nature. Why do critics say this does not test it?
    options:
      - text: 'Because almost every view of science, whether or not it holds the MUH, expects more regularities. A prediction that every rival makes cannot favour one of them: its likelihood ratio is close to $1$.'
        correct: true
      - text: 'Because regularities are never found in nature.'
        feedback: |
          Plenty of regularities are found (the Moon test is one). The point is that they do not discriminate between views.
      - text: 'Because testing is impossible in physics.'
        feedback: |
          Many physical claims are testable. The complaint concerns this particular prediction, which does not separate the MUH from its rivals.
    explanation: |
      In Bayes's terms, evidence $E$ favours $H_1$ over $H_2$ only when $P(E\mid H_1)/P(E\mid H_2)$ differs from $1$. Here it is near $1$. A sharper test would say what *cannot* be found if the MUH is true. Untestability does not make it false; it makes it a **layer 3** claim, argued by costs.

  - type: mcq
    id: p5-rivals
    title: "Structural realism and the map and the territory"
    prompt: |
      Which pairing of rival and relation to the MUH is right?
    options:
      - text: 'Structural realism (Ladyman''s ontic version): structure is all there is, which is close to the MUH, but it does not claim the structure is an abstract object that exists in every possible form. Map-territory (Korzybski): a complete description is still a description, so a perfect map would not be the country; the MUH answers that if only structure is left over, there is no extra thing for the map to miss.'
        correct: true
      - text: 'Structural realism is the same as the MUH. The map-territory objection is a result of physics.'
        feedback: |
          The two are close but not the same: structural realism does not need Platonism about structures. And "a map is not its territory" is a philosophical point (a phrase of Korzybski), not a result of physics.
      - text: 'Structural realism refutes the MUH, and the map-territory objection supports it.'
        feedback: |
          Structural realism is a neighbour, not a refutation, and the map-territory objection is the main challenge to the "is" in the MUH, so it presses against it.
    explanation: |
      The map-territory dispute is whether a complete description of the structure of the world *leaves nothing out*, or leaves out what the world is made of. The MUH says the first, its critics the second. **Layer:** a metaphysical commitment on both sides.

  - type: mcq
    id: p5-verdicts
    title: "Each school's verdict"
    prompt: |
      Which set of verdicts on the MUH is a fair reading of what each school would say?
    options:
      - text: 'Platonist: the nearest friend, since structures exist independently, though some Platonists deny the step to "physical existence". Formalist: rejects it at the start, as there are no mathematical objects to be the world. Intuitionist: rejects it, since a world that exists independent of our constructions is not a construction. Structural realist (ontic): partly sympathetic, without the multiverse of all structures. Modest "map" reader: the world is described by mathematics but not made of it.'
        correct: true
      - text: 'All schools accept it, since all agree mathematics describes nature.'
        feedback: |
          "Describes" is the modest reading; the MUH is the bold one ("is"). Accepting the first does not commit anyone to the second.
      - text: 'All schools reject it because of the measure problem.'
        feedback: |
          The measure problem concerns a version of the hypothesis (all structures, equal weight). A Platonist can treat it as a technical gap rather than a rejection.
    explanation: |
      These are fair readings, not quotations of any one person; individuals inside a school may differ. The verdict depends first on the Platonism question and second on whether a description can be the thing.

  - type: mcq
    id: p5-parting
    title: "Where thoughtful people part ways"
    prompt: |
      Everyone in Problem 5 accepts the same objections and the same checked numbers. Which pairing of a disagreement with its source (a premise, a value, or a kind of evidence) is right?
    options:
      - text: 'Platonist and formalist: a premise (whether mathematical structures exist independently). Defender and critic of the MUH on measure and Godel: a value (how much to pay in restrictions and in unsolved technical problems for a unified picture). Defender and critic on testability: a view of evidence (whether a hypothesis that cannot be told from its rivals by observation can still be rationally held).'
        correct: true
      - text: 'They differ over a fact in physics that remains to be measured.'
        feedback: |
          The measure problem, the Godel worry and the map-territory point do not wait on a measurement. They concern what the theory says and what counts as evidence.
      - text: 'They differ only because some of them are religious and others are not.'
        feedback: |
          Believers and non-believers are on both sides of every question here. The sources of disagreement are premises, values and views of evidence, not the label.
    explanation: |
      This is the method of the course: find where views part, name its layer, and see what each choice costs. The MUH is a serious proposal, argued by a physicist, and also an open one.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      - **The agreement test.** Two isolated civilisations that count reach, for example, that the sum of the first $n$ odd numbers is
      $$1 + 3 + \dots + (2n-1) = n^2$$
      and that a set with $n$ members has
      $$2^n \qquad (n=6:\ 64)$$
      subsets. The agreement is a fact. Whether it shows *discovery* depends on the premise that only a realm of objects can explain it; formalists (same rules), intuitionists (same constructing minds) and evolutionists (survival shaped us, strongest for elementary results) reject that premise. The intuitionist witness $x = \sqrt2$, $y = 2\log_2 3$ gives $x^y = 3$ with no excluded middle.
      - **The MUH under pressure.** With $N$ equally weighted structures each weighs $1/N$; a fixed set of $50$ weighs $50/N$ (from $0.005\%$ at $N = 10^6$ to a thousand times less at $N=10^9$), so equal weights cannot define "typical" over infinitely many structures. Godel's theorem is answered by keeping only computable structures at the price of a smaller hypothesis. The test "more regularities will be found" has a likelihood ratio near $1$. Observers bring back the hard problem of consciousness.
      - **Verdicts.** Platonists are the nearest friends (with a gap between "exists" and "physically exists"); formalists and intuitionists reject its first step; structural realists keep the structure and drop the multiverse; the modest reading says mathematics describes the world without being it. The map-territory point asks whether a complete description leaves out what the world is made of.
      - **Layers.** Calculations and theorems are fact; the agreement argument, the replies and the objections are live debate; whether numbers exist and whether the world is a structure are commitments.

      **Next:** after the level review comes Level 5, **Origins and Fine-Tuning**, which starts with the question of whether the universe had a beginning, and what, if anything, can be said about why it exists at all.
