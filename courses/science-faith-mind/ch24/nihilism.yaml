id: ch24-nihilism
title: "Nihilism and \"God Is Dead\""
kind: concept
own: |
  The setting: **nihilism** is the worry that nothing has ultimate value or meaning. Told *according to* its sources, it has several kinds, a famous nineteenth-century diagnosis by Nietzsche, and replies from believers and nonbelievers.
  - **Kinds.** *Existential* nihilism says life has no objective meaning or purpose. *Moral* nihilism says there are no moral facts. *Epistemological* nihilism says knowledge is not possible. *Political* nihilism wants established institutions torn down. They are separate claims: one can hold one without the others.
  - **Nietzsche's diagnosis (1844-1900).** In *The Gay Science* (1882, section 125) a madman announces that God is dead and that we have killed him. According to Nietzsche, this does not say atheism is proved. It says that {{ belief in the Christian God has become unbelievable }}, and that Europe has not yet noticed what follows. The reasoning, with P1 = the values rested on God, P2 = that belief has collapsed, C = the values lose their ground:
  $$\text{P1} \wedge \text{P2} \Rightarrow \text{C}.$$
  Nietzsche calls the result nihilism: {{ the highest values devalue themselves }}.
  - **Nietzsche's reply.** In *Thus Spoke Zarathustra* (1883-85) he asks us to create new values and overcome the old human type, the *Overman* (*Übermensch*). Scholars debate what the Overman is, and the idea was distorted after his death.
  - **Believer reply.** Reject P2: according to theists, {{ meaning is rooted in God, and a tradition may name the doubt itself (Ecclesiastes) }}.
  - **Nonbeliever replies.** Keep P2 and reject the step to C. Sartre: meaning is *made* by a free person (existence before essence). Naturalist objectivists: meaning is *found* in what is worth caring about. According to the philosopher Susan Wolf, as summarised by the Stanford Encyclopedia of Philosophy:
  $$\text{meaning} = \text{subjective attraction} + \text{objective worth}.$$
  Here *subjective attraction* is being drawn to something and *objective worth* is its being worthwhile whatever anyone feels. Meaning as {{ felt is not the same as meaning as grounded }}.
  - **Where thoughtful people part ways.** Fact: who wrote what, and when. Live debate: how Nietzsche's tone and the Overman should be read, and whether meaning must be felt, grounded or both. Commitment: whether God exists, which decides P2.

cards:
  - type: text
    id: hook
    title: "If nothing is ultimately meant"
    body: |
      Suppose the universe has no purpose of its own. Stars form, life appears, life ends, and nothing written in the cosmos says any of it was for something.

      Does it follow that nothing you do matters? Or that cruelty is no worse than kindness? Or that you cannot know anything? These are three different worries, and people often run them together.

      This lesson separates them. It then follows one famous diagnosis, Nietzsche's announcement that "God is dead", and the replies of believers and nonbelievers. It does not say who is right. It shows which premise each reply rejects.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Before any theory: suppose there is no ultimate, cosmic purpose to human life. Which reaction seems most reasonable to you?
    options:
      - text: "Then nothing really matters: values, choices and projects are all arbitrary."
        feedback: |
          This is one serious position, called nihilism. The lesson asks which premise it needs: that only a cosmic purpose could make things matter.
      - text: "Things still matter, because a person can give her own life a purpose."
        feedback: |
          This is another serious position, the one Sartre defended in his 1945 lecture *Existentialism Is a Humanism*. It rejects the premise that meaning must come from outside us.
      - text: "Things still matter, because what is worthwhile is worthwhile whatever the universe is for."
        feedback: |
          This is a third serious position, held by many naturalists. It says value does not need a cosmic author.
      - text: "It depends on a premise that can be named and examined; the answer is not given by the bare fact of no cosmic purpose."
        correct: true
        feedback: |
          Yes, and that is the method of the lesson. The first three options are real positions, each resting on a different premise about where meaning comes from.
    explanation: |
      Layer: whether the universe has a purpose is a commitment (faith or metaphysics). Whether meaning needs one is live debate.

  - type: text
    id: kinds
    title: "Four things people call nihilism"
    body: |
      According to the usual overviews (Wikipedia's article on nihilism lists these four), the word names several separate claims.

      | Kind | What it says |
      |---|---|
      | Existential | Life has no objective meaning or purpose. |
      | Moral | There are no moral facts; morality has no objective basis. |
      | Epistemological | Knowledge, or objective knowledge, is not possible. |
      | Political | Existing institutions should be torn down. |

      They come apart. Someone can think life has no cosmic purpose and still hold that cruelty is wrong. Someone can doubt that knowledge is possible and care a great deal about justice. The definitions are disputed, and different sources draw the lines a little differently.

  - type: mcq
    id: sort
    title: "Which kind is it?"
    prompt: |
      Nihilism has an *existential* kind (life has no objective meaning), a *moral* kind (there are no moral facts), an *epistemological* kind (knowledge is not possible) and a *political* kind (tear down the established order). A philosopher writes: "Nothing is objectively right or wrong; moral claims state nothing true. Yet I find my work deeply meaningful." Which kind does she hold?
    options:
      - text: "Moral nihilism only."
        correct: true
        feedback: |
          Yes. She denies moral facts but affirms that her life has meaning, so she is not an existential nihilist.
      - text: "Existential nihilism, because denying moral facts means nothing matters."
        feedback: |
          That step is exactly the run-together the lesson warns about. She says her work is meaningful, so she denies the existential claim.
      - text: "Epistemological nihilism, because she says moral claims are not true."
        feedback: |
          She doubts that moral claims state truths, not that knowledge in general is possible. A moral nihilist can trust physics.
      - text: "Political nihilism, because she rejects the usual moral order."
        feedback: |
          Rejecting the claim that moral facts exist is a view about what is true. Political nihilism is a programme for tearing down institutions.
    explanation: |
      The four kinds are separate claims, so each case needs sorting by what it actually denies.

  - type: text
    id: madman
    title: "Nietzsche's madman"
    image:
      src: img/nietzsche.webp
      alt: "Photograph of Friedrich Nietzsche around 1875, a man with a large moustache and a serious gaze"
      caption: "Friedrich Nietzsche (1844-1900), a German philosopher who held that the main values of Europe were losing their ground."
      credit: "Friedrich Hermann Hartmann, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Nietzsche187a.jpg"
    body: |
      Friedrich Nietzsche (1844-1900) published *The Gay Science* in 1882. A second edition appeared in 1887 with a new preface, a fifth book and an appendix of songs. Section 125, called "The Madman", is where the famous phrase appears most vividly.

      A madman lights a lantern in the morning and runs into a marketplace shouting that he seeks God. The crowd, according to the text, are people who do not believe in God, and they laugh. He tells them, in Walter Kaufmann's translation:

      > "God is dead. God remains dead. And we have killed him."

      He asks what the churches now are, if not "the tombs and sepulchers of God". At the end he says he has "come too early", and that his time is not yet: the news has not yet reached the people it concerns.

  - type: mcq
    id: madman-q
    title: "What is the madman claiming?"
    prompt: |
      According to scholarly readings of *The Gay Science*, section 125 (the madman who announces "God is dead") and section 343, what does "God is dead" mainly claim?
    options:
      - text: "That belief in the Christian God has become unbelievable for European culture, so the morality built on it is in trouble."
        correct: true
        feedback: |
          Yes. The Stanford Encyclopedia reads it this way: not a proof of atheism but a diagnosis of a cultural event and its consequences.
      - text: "That Nietzsche has a scientific proof that no God exists."
        feedback: |
          The madman speaks to people who already do not believe, and he says that they do not yet grasp what they have done. The phrase is a pronouncement about culture, not a proof.
      - text: "That God once lived and was literally killed by a person."
        feedback: |
          It is a figure of speech. "We have killed him" is read as saying that belief has ceased to be credible to the culture.
    explanation: |
      Layer: what the text says is fact. Whether the diagnosis is true of Europe is live debate. Whether God exists is a commitment, and the madman does not settle it.

  - type: mcq
    id: tone
    title: "Celebration or warning?"
    prompt: |
      A student says: "Nietzsche wrote 'God is dead' to cheer for atheism and to mock believers." Which reply is closest to the text of section 125?
    options:
      - text: "The madman is not cheering. He asks who will cleanse the killers of the deed and whether they must themselves become gods to be worthy of it; the passage is a warning about a loss, not a victory lap."
        correct: true
        feedback: |
          Yes. In the passage, the people who killed God are the ones who do not yet see what they have done. Scholars still discuss how much release Nietzsche also finds in the event (he writes of cheerfulness in section 343), so the tone is mixed.
      - text: "The madman is a believer who weeps and wants the old faith back."
        feedback: |
          Nietzsche was not defending the old faith. The point is that the crowd of unbelievers has not noticed what follows from losing it.
      - text: "The madman is only a comic figure; the passage has no serious point."
        feedback: |
          The marketplace crowd laughs, but the madman's question about what the loss means is the point of the passage.
    explanation: |
      Reading the tone is a matter of interpretation, so we say "according to" the text and its scholars. Both "boast" and "pure lament" are misreadings.

  - type: text
    id: chain
    title: "Why the loss threatens values"
    body: |
      Why should losing belief in God shake anything else? Nietzsche's answer, as the Stanford Encyclopedia reports it, is that belief in the Christian God has become unbelievable, so the morality built on it is headed for collapse. Set out as a chain:

      - **P1.** The values of European culture (its morality) rested on belief in God.
      - **P2.** That belief has become unbelievable.
      - **C.** So those values lose their ground.

      Written as one line, with $\wedge$ for "and" and $\Rightarrow$ for "therefore":

      $$\text{P1} \wedge \text{P2} \Rightarrow \text{C}.$$

      Nietzsche names the result **nihilism**. In the Stanford Encyclopedia's account, a crisis in which the highest values devalue themselves. The argument is valid. Whether it is sound depends on P1 and P2.

  - type: mcq
    id: chain-q
    title: "Which premise would a critic reject?"
    prompt: |
      The chain is: P1, the values of a culture (such as compassion) rest on belief in God; P2, belief in God has collapsed; C, so those values lose their ground. Which replies resist C? Select all that apply.
    multiple: true
    options:
      - text: "Reject P1: some values can rest on something else, such as human needs, reason or shared life, so they need no divine ground."
        correct: true
        feedback: |
          Yes. This is the main reply of many nonbelievers. It keeps P2 and says compassion survives.
      - text: "Reject P2: according to theists, belief in God has not become unbelievable, and the ground still stands."
        correct: true
        feedback: |
          Yes. This reply accepts P1 and the validity. It rests on a faith commitment, not on a neutral fact.
      - text: "Reject the validity: P1 and P2 cannot lead to C."
        feedback: |
          The step is valid: if values rest on a thing and that thing is gone, they lose their ground. A critic must attack a premise.
    explanation: |
      Validity and truth are separate checks. A believer and an atheist can both reject the conclusion C, each by attacking a different premise.

  - type: text
    id: nietzsche-reply
    title: "Nietzsche's own reply: create"
    body: |
      Nietzsche did not want people to hide from the problem. According to the Stanford Encyclopedia, he treated affirming life as the response to nihilism, and the Internet Encyclopedia of Philosophy adds that when inherited values stop serving life, people must use their creative capacity to build new ones.

      Two forms of nihilism are often distinguished in his thought. According to the overviews, a *passive* nihilist resigns, pessimistic and hopeless, while hiding the rejection of life behind old forms. An *active* nihilist accepts the loss and uses it to clear away old values, as a step toward something new.

      In *Thus Spoke Zarathustra* (written 1883-85) the prophet Zarathustra teaches, in Thomas Common's translation:

      > "Man is something that is to be surpassed."

      The figure of what comes next is the *Overman* (German *Übermensch*; Common writes "Superman"). Scholars disagree about what this figure is, an ideal to strive toward or something less clear. They agree that the picture of a master race is a distortion: Elisabeth Förster-Nietzsche, his sister, edited his notes in a way that Britannica says was largely responsible for the later view of him as a forerunner of fascism.

  - type: mcq
    id: overman-q
    title: "Reading the Overman"
    prompt: |
      A friend says: "Nietzsche's Overman means a race of people who may dominate others, so his philosophy is a political programme for the strong." According to the sources reported above, what is the best response?
    options:
      - text: "In Zarathustra the Overman is a figure of human self-overcoming, scholars debate its meaning, and the racial and political version owes much to the editing and use of his notes after his death."
        correct: true
        feedback: |
          Yes. The claim that he endorsed the later fascist uses is a distortion according to Britannica, and the meaning of the Overman remains contested among scholars.
      - text: "The Overman is simply a name for God, so Nietzsche was a believer after all."
        feedback: |
          In Zarathustra the Overman is what humans may become by self-overcoming. It is not another name for God.
      - text: "Nobody knows anything about what the Overman means, so any reading is as good as any other."
        feedback: |
          Scholars disagree on the details, but the text constrains the readings: the Overman is tied to overcoming and to creating values, and the racial reading is a known distortion.
    explanation: |
      Layer: that Zarathustra speaks of overcoming is fact. What the Overman is, exactly, is live debate.

  - type: text
    id: believer
    title: "The reply from believers"
    body: |
      A believer can answer in two ways, and each keeps a different premise.

      The first is to reject P2. According to theists, God is alive and the ground stands. The Stanford Encyclopedia of Philosophy calls one family of views *supernaturalism*: a spiritual realm, usually God or a soul, is central to meaning. Its extreme form says that without such a realm no life has meaning, and its moderate form says that such a realm greatly enhances meaning but is not strictly required.

      The second is a point about the tradition itself. The book of Ecclesiastes (Hebrew *Qohelet*, "teacher") opens with a verse often rendered "vanity of vanities". The Hebrew word *hevel* means "breath" or "vapour", and some modern translations render the verse as "Meaningless!" The book stands inside the Bible, so a believer can say that the doubt is voiced within the tradition itself, and that the sense of futility is not by itself a proof that the faith is false. This is an interpretation, not a claim about every tradition.

  - type: mcq
    id: believer-q
    title: "What does the believer keep?"
    prompt: |
      A theist replies to Nietzsche: "Meaning is rooted in God, so the ground of values has not collapsed." Which premise of the chain (P1 values rest on God; P2 belief in God has collapsed; C values lose their ground) is the believer rejecting?
    options:
      - text: "P2: for the believer, belief in God has not become unbelievable."
        correct: true
        feedback: |
          Yes. The believer keeps P1 and the validity and denies P2. The disagreement with Nietzsche is a disagreement about whether God exists or can be believed.
      - text: "P1: values do not rest on God."
        feedback: |
          That is the nonbeliever's reply. The theist in this card says meaning is rooted in God, which is P1.
      - text: "The validity: P1 and P2 do not give C."
        feedback: |
          The step is valid. The reply works by attacking a premise.
    explanation: |
      Layer: a faith commitment about P2, not a neutral fact.

  - type: text
    id: recall-essence
    title: "Recall, then the nonbeliever replies"
    body: |
      Recall from the lesson Essence and Existence: according to Sartre's 1945 lecture *Existentialism Is a Humanism*, if there is no God to conceive human beings, then *existence precedes essence*. A person first exists and then defines herself by what she makes of herself, and there is no human nature given in advance.

      A nonbeliever who keeps P2 can reject the step to C in two ways.

      **Meaning is made.** On the Sartrean line, no given purpose does not mean no purpose. The loss of a given essence leaves a person free to choose a project and to answer for it. This also answers the chain: values are not found in the world, they are created and owned.

      **Meaning is found.** According to naturalist objectivists, some things are worthwhile whatever the universe is for: understanding, love, justice, creative work. The Stanford Encyclopedia describes this as the view that some meaning-conferring conditions are valuable in themselves, whatever anyone feels about them.

  - type: mcq
    id: made-found
    title: "Made or found?"
    prompt: |
      Two nonbelievers accept that there is no God. One says: "I give my life meaning by choosing a project and committing to it." The other says: "Helping a stranger is worthwhile whatever anyone chooses, and I discover that." Which pairing is right?
    options:
      - text: "The first holds that meaning is made (as in Sartre); the second holds that meaning is found (naturalist objectivism)."
        correct: true
        feedback: |
          Yes. The two agree against Nietzsche's chain that godlessness does not empty life of meaning, and disagree on where meaning comes from.
      - text: "Both hold that meaning is found, because neither needs God."
        feedback: |
          The first speaker says she gives meaning by choosing. That is made, not found.
      - text: "Both hold that meaning is made, since nonbelievers deny any objective value."
        feedback: |
          Many nonbelievers accept objective value without God. The second speaker holds that.
    explanation: |
      Layer: both positions are live debate. They differ on a premise about the source of value, not on any fact.

  - type: text
    id: felt-grounded
    title: "Felt or grounded?"
    body: |
      A different line of reply is psychological, and it separates two senses of "meaningful". A life can *feel* meaningful: you are absorbed, committed, glad to get up. And a life can have meaning in a *grounded* sense: what you are devoted to is actually worthwhile.

      The Stanford Encyclopedia describes the two camps. *Subjectivism* makes meaning depend on a person's own goals, cares and loves. Its critics say it counts trivial pursuits as meaningful. *Objectivism* holds that some conditions are valuable whatever anyone feels. It also sums up the philosopher Susan Wolf's hybrid view in her words: meaning arises when subjective attraction meets objective attractiveness.

      $$\text{meaning} = \text{subjective attraction} + \text{objective worth}.$$

      Subjective attraction means being drawn to something. Objective worth means that it is worthwhile whatever anyone feels. On this view, a nihilist who says "nothing could matter" is right only if neither half can ever be met. A believer, Nietzsche and Sartre can all be read as disputing the second half: where objective worth comes from.

  - type: mcq
    id: felt-q
    title: "A case to sort"
    prompt: |
      Someone spends every day counting the blades of grass on her lawn and finds it deeply absorbing. Using the view that meaning needs both subjective attraction (being drawn to the activity) and objective worth (it is worthwhile whatever anyone feels), which description fits?
    options:
      - text: "She has the first half, but whether the second half holds is exactly what is disputed; a pure subjectivist says her life is meaningful, and Wolf's hybrid view says it needs more."
        correct: true
        feedback: |
          Yes. The case separates the camps: a subjectivist counts the absorption alone, and the hybrid view asks whether the activity is also worthwhile.
      - text: "She has both halves, because anything that absorbs a person is worthwhile."
        feedback: |
          That assumes the second half follows from the first. The hybrid view keeps them apart, because absorption is felt and worth is grounded.
      - text: "She has neither half, because nobody can be absorbed by counting."
        feedback: |
          The case says she is absorbed, so she has the first half. The open question is the second.
    explanation: |
      Layer: that she is absorbed is fact in the story. Whether counting grass can be worthwhile is live debate and rests on a view about value.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Which one of these statements is a layer-3 claim (a faith or metaphysical commitment), rather than established fact or a live scholarly debate?
    options:
      - text: "God exists, so the ground of values has not collapsed."
        correct: true
        feedback: |
          Yes. It is a metaphysical commitment, and it is the one that decides P2.
      - text: "Nietzsche published The Gay Science in 1882 and a second edition with a fifth book in 1887."
        feedback: |
          That is established fact about publication.
      - text: "Scholars disagree about whether the Overman is an ideal to strive for."
        feedback: |
          That is a live scholarly debate, a report of what scholars say.
    explanation: |
      Keeping the three layers apart is the habit of the course: the same sentence can be fact, debate or commitment depending on what it claims.

  - type: text
    id: summary
    body: |
      **Next:** nihilism says nothing ultimately matters. The next lesson, Absurdism and Existentialism, asks what a person can do when the cosmos gives no answer and the question will not go away: Camus's revolt, Kierkegaard's leap, and Beauvoir's ethics of ambiguity.
