id: ch24-absurd
title: "Absurdism and Existentialism"
kind: concept
own: |
  The setting: **absurdism** and **existentialism** are twentieth-century replies to the worry that the universe hands us no ready-made meaning. Told *according to* their authors: Albert Camus (1913-1960), Søren Kierkegaard (1813-1855), Jean-Paul Sartre (1905-1980) and Simone de Beauvoir (1908-1986).
  - **The absurd (Camus, *The Myth of Sisyphus*, 1942).** According to Camus it lives in neither the world alone nor us alone, but in the relation between them. Let D = our demand for meaning and S = the silence of the world, which gives no answer we can find:
  $$D + S \Rightarrow \text{the absurd}.$$
  So the absurd is {{ the clash between our demand for meaning and the silence of the world }}.
  - **Two exits Camus refuses.** *Physical suicide* ends the person who asks, so it removes one side of the clash instead of facing it. The *leap* is the move to a meaning beyond reason (a God, a doctrine); Camus calls it {{ philosophical suicide }}, because it escapes the clash by giving up lucid thought.
  - **Camus's answer.** Stay inside the clash and live with it. His three consequences are revolt (refusing both escapes), freedom (no hope of an eternal meaning to obey) and passion (living as fully as possible):
  $$\text{absurd} \Rightarrow \text{revolt} + \text{freedom} + \text{passion}.$$
  The essay ends with Sisyphus, condemned to push a rock up a hill forever, and the line "One must imagine Sisyphus happy". Whether that step follows is examined in the next lesson.
  - **Kierkegaard's reply (a believer's).** In *Fear and Trembling* (1843, under the pseudonym Johannes de silentio) faith can look absurd to an outsider, as Abraham's does. Camus reads this as a leap. Defenders answer that Kierkegaard presents {{ faith as a passion, not as a conclusion that reason has proved }}.
  - **Sartre and Beauvoir.** According to Sartre, *existence precedes essence*: a person has no fixed nature and makes meaning by free choice, and *bad faith* is the self-deception of denying that freedom. According to Beauvoir (*The Ethics of Ambiguity*, 1947), freedom is not secured alone: it {{ needs the freedom of others }}. Camus himself rejected the label "existentialist".
  - **Where thoughtful people part ways.** Fact: who wrote what, and when. Live debate: whether Camus's revolt is a real answer or a mood, and whether Kierkegaard's faith is a leap. Commitment: whether the world's silence is final, which a believer and a nonbeliever read differently.

cards:
  - type: text
    id: hook
    title: "Wake, work, sleep, repeat"
    body: |
      You wake up, travel to work, do the tasks, come home, eat, sleep. The next day is the same, and so is the next week. Most of the time this feels fine. Then, once in a while, a question arrives from nowhere: *why am I doing all this?*

      Here is a puzzle. The question is only a question. Nothing in the world changed when you asked it. So does asking it make life absurd? And if it does, what do you do next: stop asking, stop living, or find a third way?

      A French writer in 1942 built a whole philosophy on this moment. This lesson follows his answer, the replies of three other thinkers, and the premise on which each one splits from the others. It does not say who is right.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Before any theory: you are sure that the universe has no purpose built into it, and you also cannot stop wanting your life to mean something. Which description fits that situation best?
    options:
      - text: "A mistake: the wish for meaning is false and should simply be dropped."
        feedback: |
          Some thinkers say this, but note that the wish does not go away when we call it a mistake. The thinkers of this lesson start from the fact that it stays.
      - text: "A tension between two true things: the wish is real, and the world does not answer it."
        correct: true
        feedback: |
          This is the structure the lesson follows. Camus gave this tension a name, the absurd, and the thinkers differ on what to do with it.
      - text: "A proof that God exists, because the wish would not exist without something to satisfy it."
        feedback: |
          This is an argument some believers make, and it is a different step: it asks what the wish shows about the world. The lesson first asks what to do while the tension is felt.
    explanation: |
      Layer: that people feel the wish is a fact. Whether it points beyond the universe is a commitment.

  - type: text
    id: camus
    title: "Camus and the absurd"
    body: |
      Albert Camus (born 7 November 1913 in Mondovi, Algeria; died 4 January 1960 in a car accident) was a French novelist, essayist and playwright. In *The Myth of Sisyphus* (*Le Mythe de Sisyphe*, 1942) he opened with a bold claim: the central philosophical question is whether life is worth living, which means the question of suicide.

      Then he defined the **absurd**. According to the Stanford Encyclopedia of Philosophy, it is the clash between our longing for meaning and a world that stays silent, "the unreasonable silence of the world". On this reading the absurd is not a fact about the universe, and not a fact about us. It is a feature of the *relation* between the two.

      Write $D$ for our demand for meaning and $S$ for the silence of the world. Then:

      $$D + S \Rightarrow \text{the absurd}$$

      Notice what this does. A universe with no demand-makers in it would not be absurd, only indifferent. A person who needed no meaning would not feel it either. Take away either side and the clash disappears, which is why the tempting exits all try to remove one side.

  - type: mcq
    id: where
    title: "Where does the absurd live?"
    prompt: |
      According to Camus as read by the Stanford Encyclopedia of Philosophy, where does the absurd live?
    options:
      - text: "In the world: the universe is itself absurd, whatever anyone thinks of it."
        feedback: |
          Camus does not say this. A universe with no one in it to ask would be silent, not absurd. The absurd needs the asking.
      - text: "In us: it is a mood or illness of the mind that therapy can cure."
        feedback: |
          Camus treats the demand for meaning as real and lasting, not a defect to remove. If the demand were cured, the clash would end, and that is the kind of exit he refuses.
      - text: "In the relation between our demand for meaning and the world's silence."
        correct: true
        feedback: |
          Yes. The absurd is a clash, and a clash needs two sides.
    explanation: |
      Layer: this is what Camus argued (fact about the text). Whether the world is truly silent is a commitment: a believer may say it is not.

  - type: text
    id: exits
    title: "Two exits Camus refuses"
    body: |
      If the absurd is a clash, there are two obvious ways to end it, and Camus refuses both.

      **Physical suicide** ends the person who asks. According to the Stanford Encyclopedia, Camus rejected it as an answer; its reasoning in a later book, *The Rebel*, is that denying life removes the very questioner whose question started the problem. In the lesson's own words: it does not solve the clash, it deletes one side of it. The premise it needs is that, since life gives no meaning, life is not worth living. Camus accepts the first half of that premise and rejects the step.

      **Philosophical suicide** is Camus's name, according to the Internet Encyclopedia of Philosophy, for escaping the absurd by a leap to religion or to something beyond reason. In the essay itself Camus names Jaspers, Chestov (also spelled Shestov) and Kierkegaard among those who make it. The premise it needs is that a meaning exists beyond what reason can see, and that we may trust it anyway. Camus calls it suicide because, in his view, it kills lucid thought instead of facing the clash.

  - type: mcq
    id: exits-q
    title: "What does each exit assume?"
    prompt: |
      Camus rejects *physical suicide* and the *leap* (philosophical suicide). Which pair of premises does each one need, in that order?
    options:
      - text: "Suicide: life without cosmic meaning is not worth living. Leap: a meaning exists beyond what reason can find, and we may trust it."
        correct: true
        feedback: |
          Yes. Camus accepts neither step: life stays worth living, and the leap trusts a meaning that the silence does not show.
      - text: "Suicide: God has commanded it. Leap: science has proved that the universe has a purpose."
        feedback: |
          Neither fits. Camus's suicide is a response to meaninglessness, not a command, and the leap is not a scientific conclusion: it is made precisely where reason runs out.
      - text: "Suicide: the world is secretly meaningful. Leap: life is not worth living."
        feedback: |
          These are swapped and distorted. The leap does look for hidden meaning, but physical suicide starts from the opposite thought, that there is none.
    explanation: |
      Seeing each exit's premise shows where a critic can push back: a believer rejects the idea that the silence is final, and a defender of life rejects "not worth living".

  - type: text
    id: revolt
    title: "Revolt, freedom, passion"
    body: |
      What is left once both exits are shut? According to the Internet Encyclopedia of Philosophy, Camus answers with **revolt** (a defiant stance, a refusal to give in to either escape), **freedom** and **passion** (an intense experience of life).

      Freedom, here, means there is no eternal meaning to obey: you are not working toward an eternal plan, so you choose how to live now. Passion means living as fully as you can, since this life is all that is given.

      The image is Sisyphus, from Greek myth: condemned to push a rock up a hill, watch it roll down, and push again forever. The essay ends with a sentence that Camus's readers still argue about, in the usual English wording: "One must imagine Sisyphus happy."

      Is that a good argument, or only a good image? The next lesson is a guided proof of exactly that step. Here we only note that Camus answers the question "what do we do with the clash?" by keeping it alive.

  - type: mcq
    id: revolt-q
    title: "What does Camus's revolt mean?"
    prompt: |
      Which description of Camus's "revolt" is closest to what he argued?
    options:
      - text: "Overthrowing the government because life is unfair."
        feedback: |
          Camus did write on political revolt in a later book, but in *The Myth of Sisyphus* the revolt is a stance toward the absurd itself: to keep the clash in view and refuse to resolve it falsely.
      - text: "Refusing to escape the clash, by either suicide or a leap, and living lucidly inside it."
        correct: true
        feedback: |
          Yes. The revolt is to stay in the tension with open eyes.
      - text: "Rebelling against reason, and trusting faith instead."
        feedback: |
          That is the opposite of Camus's stance. In his reading, the leap of faith gives up lucid thought, which he refuses to do.
    explanation: |
      Layer: what Camus meant is textual fact. Whether lucid revolt is psychologically possible, or an answer at all, is live debate.

  - type: text
    id: kierkegaard
    title: "Kierkegaard and the leap"
    image:
      src: img/kierkegaard.webp
      alt: "Oil portrait of Søren Kierkegaard seated at a tall writing desk"
      caption: "Søren Kierkegaard (1813-1855) of Copenhagen, painted at his high desk by the later Danish painter Luplau Janssen; he published much of his work under invented names, so the views of those authors are not simply his own."
      credit: "Luplau Janssen, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Kierkegaard_portrait.jpg"
    body: |
      Søren Kierkegaard (born 5 May 1813 in Copenhagen, died 11 November 1855) was a Danish thinker, often called the father of existentialism. He was a Christian writer, so he is the believer of the group.

      In *Fear and Trembling* (1843), published under the pseudonym Johannes de silentio, the author looks at Abraham, who is told to sacrifice his son. The "knight of faith" trusts God's promise in a way that, to an outsider like the narrator, looks absurd. The narrator says he cannot understand it.

      Camus read this as a leap: the believer meets the silence of the world and answers it by affirming a God above reason. According to the Stanford Encyclopedia, defenders of Kierkegaard reply that this misreads him. For Kierkegaard, they argue, faith is a passion that does not claim to be proved by reason, and it competes with offence as a rival passion; neither is fully justified by reason. The popular phrase "leap of faith" is a later summary: that article does not use it, and the "leap" Kierkegaard's authors discuss is tied to free action and to anxiety, not to a single formula.

  - type: mcq
    id: leap-q
    title: "Camus versus Kierkegaard"
    prompt: |
      Camus and Kierkegaard both refuse physical suicide and both feel the clash between reason and the world. Where do they split?
    options:
      - text: "Camus says stay in the clash with open eyes; Kierkegaard, as Camus reads him, resolves it by faith."
        correct: true
        feedback: |
          Yes, and note the qualifier: that is Camus's reading. Defenders of Kierkegaard say his faith does not pretend to resolve the clash by reason, so the disagreement is partly about how to read him.
      - text: "Camus believes in God and Kierkegaard does not."
        feedback: |
          Reversed. Kierkegaard was a Christian writer; Camus did not make a religious claim of this kind in the essay.
      - text: "Kierkegaard accepts the absurd as a final fact and Camus tries to end it."
        feedback: |
          Also reversed. Camus insists on keeping the absurd alive. Kierkegaard's faith, as Camus reads it, is the move that tries to end it.
    explanation: |
      Layer: both views are real positions with named sources. Whether the faith is a leap away from reason or a different use of reason is live debate.

  - type: text
    id: sartre-recall
    title: "Recall: Sartre on freedom"
    body: |
      Recall from the lesson Essence and Existence: according to Jean-Paul Sartre (1905-1980), *existence precedes essence*. A person has no fixed nature handed down from a maker. We first exist, then make ourselves by choosing. *Bad faith*, in his *Being and Nothingness* (1943), is the self-deception of hiding from that freedom, by treating oneself as a thing with a fixed nature or as having no past at all.

      Compare Camus. Both start from a world with no built-in meaning. But Sartre's answer stresses *making* meaning by free choice, while Camus's stresses *living lucidly in the clash* without any made-up meaning. The Stanford Encyclopedia records that Sartre called Camus's thought a "philosophy of the absurd", distinct from the existentialism Sartre accepted for himself. The Internet Encyclopedia adds that Camus repeatedly rejected the existentialist label, and that he believed in a common human nature, against the motto that existence precedes essence.

  - type: mcq
    id: label-q
    title: "Was Camus an existentialist?"
    prompt: |
      A quiz says: "Camus was an existentialist, and he agreed with Sartre that existence precedes essence." Which correction is closest to the sources?
    options:
      - text: "Camus rejected the existentialist label and, according to the Internet Encyclopedia of Philosophy, believed in a common human nature against that motto."
        correct: true
        feedback: |
          Yes. Many people group them together because both write about meaninglessness, but Camus himself denied the label.
      - text: "Camus agreed with Sartre on everything except politics."
        feedback: |
          Camus and Sartre differed on more than politics: the sources record a difference on the existentialist label and on human nature.
      - text: "Camus was Sartre's student and took his philosophy from him."
        feedback: |
          Not supported. Camus wrote *The Myth of Sisyphus* in 1942 (finished in 1941 according to the Stanford Encyclopedia), a year before Sartre's *Being and Nothingness*.
    explanation: |
      Naming a group of thinkers as one school is a common shortcut. A card or a textbook that says "existentialists" should be read as "thinkers often grouped together".

  - type: text
    id: beauvoir
    title: "Beauvoir: freedom needs others"
    image:
      src: img/beauvoir.webp
      alt: "Photograph of Simone de Beauvoir in 1967, a woman with her hair tied up"
      caption: "Simone de Beauvoir (1908-1986), the French philosopher and novelist whose Ethics of Ambiguity (1947) argued that my freedom is tied to the freedom of others."
      credit: "Moshe Milner, CC BY-SA 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Simone_De_Beauvoir_(cropped).jpg"
    body: |
      Simone de Beauvoir (9 January 1908 to 14 April 1986) was a French philosopher, novelist and feminist. In *The Ethics of Ambiguity* (*Pour une morale de l'ambiguïté*, 1947), according to the Stanford Encyclopedia, she argues that freedom cannot be affirmed without affirming the freedom of others. Evil lies in denying freedom, and we are responsible for the material and political conditions that let people be free.

      She also holds that human existence is *ambiguous*: we can never fully satisfy our desire for meaning, so we must accept failure and finitude. And she rejects ethical absolutes, whether God or an abstract Humanity, as ways of dodging responsibility. A believer would reply that God is not a way of dodging it. The disagreement is about the premise, not about whether responsibility matters.

      The reply to meaninglessness here is not only private. If I will myself free, I must will that others be free too, so the meaning I make is bound up with theirs.

  - type: mcq
    id: sort-four
    title: "Four replies to meaninglessness"
    prompt: |
      Match each thinker to the main reply this lesson gives. Which list is right?
    options:
      - text: "Camus: live lucidly inside the clash (revolt, freedom, passion). Kierkegaard: faith, which Camus reads as a leap. Sartre: make meaning by free choice. Beauvoir: freedom cannot be won entirely alone, it needs others' freedom too."
        correct: true
        feedback: |
          Yes. Each reply keeps the starting point, a world that does not hand us meaning, and answers differently.
      - text: "Camus: faith in God. Kierkegaard: revolt. Sartre: freedom needs others. Beauvoir: make meaning by free choice."
        feedback: |
          These are scrambled. The faith belongs to Kierkegaard, the revolt to Camus, and the "others" to Beauvoir.
      - text: "All four say nothing matters, and they differ only in tone."
        feedback: |
          None of the four says nothing matters. Each offers a way to live that matters, and they disagree about which.
      - text: "Camus: the meaning is in the world. Kierkegaard: the meaning is a mood. Sartre: no meaning, no choice. Beauvoir: no meaning, no ethics."
        feedback: |
          Sartre and Beauvoir stress *choice* and *ethics*, not their absence, and Camus starts from the world's silence, not from meaning in it.
    explanation: |
      The point of the survey is to compare replies by the premise they reject or accept, not to rank them.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Which pairing of claim and layer is right?
    options:
      - text: "Fact: Camus published *The Myth of Sisyphus* in 1942. Live debate: whether Camus's revolt answers the clash or only names a mood. Commitment: whether the world's silence is final."
        correct: true
        feedback: |
          Yes. The first is a record, the second is argued among scholars and readers, and the third is where a believer and a nonbeliever differ at the base.
      - text: "Fact: Kierkegaard's faith is a leap. Debate: Camus was born in 1913. Commitment: Beauvoir wrote in 1947."
        feedback: |
          Dates and titles are records (fact). Whether Kierkegaard's faith is a leap is the debated point, so these are in the wrong layers.
      - text: "Fact: the world is silent. Debate: Camus was a French writer. Commitment: Sisyphus lived."
        feedback: |
          Whether the world is silent is itself a commitment, not a fact the lesson can supply. That Camus was a French-language writer is a record.
    explanation: |
      Keeping the layers apart lets a believer and a nonbeliever agree on the first and be honest about where the second and third begin.

  - type: text
    id: summary
    body: |
      **Next:** the lesson Guided proof: Must We Imagine Sisyphus Happy? takes Camus's last step, from the absurd to revolt, freedom and passion, lays out its premises, and asks which one a critic would reject.
