id: ch24-transhuman
title: "Transhumanism: Escaping Death by Technology"
kind: concept
own: |
  The setting: **transhumanism** is a movement that holds that technology should be used to enhance human beings, above all to overcome ageing and death. Told *according to* the thinkers named, with their rivals.
  - **The claim.** According to Bostrom (*Transhumanist Values*, 2005), ageing is the leading cause of death in the developed world, so anti-ageing medicine is a priority, and the aim is a longer {{ healthspan, the span of active health, not only more years of frailty }}. According to the Transhumanist Declaration (adopted by Humanity+ in 2009), humanity's potential is still mostly unrealized.
  - **Three routes.** Anti-ageing research (outcomes open), **cryonics** (preserving a body at very low temperature in the hope of future revival; practised since 1967, revival not demonstrated), and **mind uploading** (copying a mind into a computer; {{ does not exist today, only partial simulations of animals }}).
  - **Is death bad?** According to Epicurus, death is nothing to us, since the dead have no experience. According to Nagel (1970), the **deprivation account** says death is bad because it takes away goods the person would have had:
  $$\begin{aligned}\text{badness of death}&=\text{value of}\\&\quad\text{the life it removes}\end{aligned}$$
  - **Is the upload you?** According to the **psychological continuity** view (Locke, Parfit), you are whoever continues your memories, character and intentions. According to **animalism** (Olson), you are a living organism. {{ Under animalism an upload is not you; under psychological continuity it may be, unless two continuers exist at once }}.
  - **Religious replies.** According to Plato's *Phaedo*, the soul survives death. According to the Nicene Creed, Christians look for the resurrection of the dead. Critics say technological immortality is {{ self-achieved and bodiless, unlike a gift of God }}; some religious transhumanists reply that enhancement fits their faith.
  - **Objections.** According to SEP's *Human Enhancement* entry, critics warn of a divide between an enhanced elite and everyone else. According to Williams (1973), an endless life would become tedious; according to critics such as Fischer, one can change interests and projects and {{ avoid boredom while staying the same person }}.
  - **Where thoughtful people part ways.** Fact: who wrote what, that cryonics is practised, that uploading does not exist. Live debate: whether ageing is a problem to fix, what makes a person persist, whether endless life would be good. Commitment: whether death is natural and given, or an evil to defeat.

cards:
  - type: text
    id: hook
    title: "Two offers"
    body: |
      Suppose two offers arrive on the same day. The first is a treatment that stops your body from ageing: you stay as you are, and nothing but accident or disease can end you. The second is a safe procedure that scans your brain in full, builds a perfect working copy of your mind inside a computer, and keeps it running for as long as the machines run. In both cases you will remember today and go on thinking as you do now.

      Would you accept either? And in the second case, is the one who wakes up in the computer *you*, or someone who only thinks they are? Notice that there are two questions here: whether death is something worth escaping, and what it takes for *you* to survive at all.

      These questions belong to **transhumanism**. As in every lesson, we meet what its defenders hold, what its critics hold and why, and we do not choose a side.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Before any definition, what do you think transhumanism is mainly about?
    options:
      - text: "A movement holding that technology should be used to enhance human abilities and to overcome limits such as ageing."
        correct: true
        feedback: |
          Yes, in essence, according to Bostrom and the Humanity+ Declaration, which we read next. People disagree about whether this is wise, but this is what the movement says it is.
      - text: "A religion that worships machines as gods."
        feedback: |
          This is a common caricature. Transhumanism presents itself as a philosophy and a movement about human enhancement. Whether some of its hopes resemble religious ones is a real debate we meet below, but it does not worship machines.
      - text: "A branch of medicine that treats only illness."
        feedback: |
          Defenders go further: they favour enhancing people who are healthy, not only treating disease. Whether that step is wise is one of the live debates.
    explanation: |
      Layer: the self-description of the movement is documented (layer 1). Whether its aims are good is a live debate (layer 2) and rests on values (layer 3).

  - type: text
    id: claim
    title: "What transhumanists claim"
    image:
      src: img/bostrom.webp
      alt: "Portrait photograph of the philosopher Nick Bostrom"
      caption: "Nick Bostrom, a philosopher then at the University of Oxford, co-founded the World Transhumanist Association in 1998, according to his own history of the movement."
      credit: "Future of Humanity Institute, CC BY 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Prof_Nick_Bostrom_324-1.jpg"
    body: |
      The word **transhumanism** goes back to Julian Huxley, who used it in *New Bottles for New Wine* (1957), according to Bostrom's *A History of Transhumanist Thought* (*Journal of Evolution and Technology*, 2005). There Huxley describes "man remaining man, but transcending himself, by realizing new possibilities of and for his human nature".

      The modern movement is better described by its own documents. The **Transhumanist Declaration**, first drafted in 1998 by an international group that included Nick Bostrom and adopted by the Humanity+ board in March 2009, says that "Humanity stands to be profoundly affected by science and technology in the future." It states that "humanity's potential is still mostly unrealized", and in point 8 it favours "wide personal choice" over how individuals enable their lives, with life extension and cryonics among its examples.

      In *Transhumanist Values* (2005), according to Bostrom's text, human nature is treated as unfinished: some valuable ways of being may lie beyond our present capacities. He names ageing as the leading cause of death in the developed world, so anti-ageing medicine is a priority, and the aim is to lengthen periods of active health, not only to add years of frailty at the end of life.

  - type: mcq
    id: healthspan
    title: "Healthspan"
    prompt: |
      According to Bostrom's *Transhumanist Values*, what does the goal of extending **healthspan** (as opposed to lifespan) mean?
    options:
      - text: "Lengthening the period of active health, not only adding years of frailty at the end."
        correct: true
        feedback: |
          Yes. A critic of long life often pictures a long decline. According to Bostrom, the aim is more years of health, and a world with only more years of frailty would not meet it.
      - text: "Making sure that people live exactly as long as nature intended."
        feedback: |
          The opposite. The claim is that the usual length of life is not a limit to respect but a problem to work on. Whether it is a problem is one of the debates below.
      - text: "Treating healthy people only after they fall ill."
        feedback: |
          That describes ordinary medicine. Healthspan is about preventing decline, and the movement also favours enhancing the healthy.
    explanation: |
      Layer: the wording of the goal is documented (layer 1). Whether healthspan can really be extended is an empirical question that is open.

  - type: text
    id: routes
    title: "Three routes, three layers"
    body: |
      Three routes to escaping death are discussed. They differ greatly in what is known.

      **Anti-ageing research** aims to slow or reverse ageing in the living. It is a research programme, and how far it can go is an open scientific question (layer 2).

      **Cryonics** is the preservation of a body or brain at very low temperature after legal death, in the hope that future technology will revive it. According to Bostrom's history, Robert Ettinger's *The Prospect of Immortality* (a preliminary version printed privately in 1962, commercial edition 1964) launched the idea. The first person preserved was James Bedford, a retired psychology professor, in January 1967, according to Inside Science and the Smithsonian. The practice is real (layer 1); the revival is not demonstrated. According to Wikipedia's summary of critics, scientists such as the Society for Cryobiology regard it as speculation or hope, not science, and revival technology remains speculative; defenders reply that the preservation is meant as a bet on future technology, not a claim about today.

      **Mind uploading** is the copying of a mind into a computer. According to Wikipedia's overview, it does not exist today: only partial or whole simulations of some animals have been built, to various degrees. Whether a simulation of a mind would be a mind, and whether it would be *you*, are questions of layer 2 and layer 3 (below).

  - type: mcq
    id: routes-mcq
    title: "Sorting the routes by evidence"
    prompt: |
      Which statement best fits the evidence for cryonics today?
    options:
      - text: "Bodies have been preserved since 1967, but no one has been revived, so revival remains a speculation."
        correct: true
        feedback: |
          Yes. The practice is documented (layer 1). Revival is a hope about future technology (layers 2 and 3). A critic stresses the lack of any demonstration; a defender says the bet is cheap compared with certain death.
      - text: "It has been shown to work: frozen people have been brought back."
        feedback: |
          No revival of a preserved person has been reported in the sources we checked. Confusing preservation with revival is the central slip about cryonics.
      - text: "It is impossible, and this has been proved."
        feedback: |
          Critics call it unproven and implausible, and some scientists say revival is impossible with current knowledge. A proof of impossibility for all future technology is a stronger claim than the sources make.
    explanation: |
      Layer: preservation is fact; revival is speculative. Keep "has been done" (preserving) apart from "can be done" (reviving).

  - type: text
    id: dragon
    title: "The Fable of the Dragon-Tyrant"
    body: |
      Bostrom made his case for ageing as a problem in a fable, published in the *Journal of Medical Ethics* (2005, vol. 31, no. 5). A giant dragon rules the planet from a mountain and demands a daily tribute of people, delivered at dusk. The number starts at ten thousand men and women and grows over time. People accept it as unchangeable. Generations later, inventors build a projectile that can pierce its scales. The king delays, a last train is not recalled, the dragon falls, and the king grieves that the work began so late.

      The fable's point, in essence and according to Bostrom's own gloss: ageing is the dragon. People accept it as a fact of life, though it is a major cause of suffering and death, and it deserves urgent scientific effort. The fable warns against resignation, against the idea that technology cannot change what has always been so, and against rhetoric that hides the stakes.

  - type: mcq
    id: dragon-mcq
    title: "Argument or illustration?"
    prompt: |
      A critic says: "The fable proves that ageing is a problem we should fix." What is the best reply?
    options:
      - text: "A fable illustrates a claim; the claim that ageing is like the dragon still needs argument (ageing is not an enemy that arrives from outside, and defenders and critics disagree about what an enhanced life would be)."
        correct: true
        feedback: |
          Yes. The fable is a rhetorical tool that makes the defender's view vivid. It does not show the analogy holds, and the rival view says that ageing differs from a tyrant: it is part of what a human life is, not a force that attacks it. Steelmanning both: the fable asks whether our resignation comes from reason or only from habit; the critic asks whether a metaphor can settle that.
      - text: "Nothing: since the dragon kills people, ageing must be the same."
        feedback: |
          That is just the analogy restated. The question is whether ageing is *like* the dragon in the way that matters, and that needs an argument.
      - text: "Fables never carry any philosophical weight."
        feedback: |
          They do: thought experiments and fables help us test intuitions. The point is that they illustrate, and the test is whether the intuition survives scrutiny.
    explanation: |
      Layer: that Bostrom wrote the fable is fact; whether ageing is rightly treated as a harm to fight is live debate (layer 2) with a commitment about what life is for (layer 3).

  - type: text
    id: bad
    title: "Is death bad at all?"
    image:
      src: img/nagel.webp
      alt: "Portrait photograph of the philosopher Thomas Nagel"
      caption: "Thomas Nagel (born 1937), American philosopher who argued in 1970 that death is bad because it deprives us of goods."
      credit: "Nagelt, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Nagel_(cropped).jpg"
    body: |
      The case for escaping death assumes that death is bad for the person who dies. That is itself disputed, as the lessons Epicureanism and Hedonism and Stoicism showed.

      **Epicurus.** According to the Stanford Encyclopedia's entry "Death", Epicurus held that pleasure and pain are the only intrinsic goods and evils, and death is not an experience, so it is neither good nor bad for the one who dies. On this view, the fear of death is a mistake and the dragon is a shadow.

      **Nagel.** According to Thomas Nagel in "Death" (*Noûs*, 1970), death is bad because it deprives us of the goods that the life would have contained. Something can be bad for a person without being felt. This **deprivation account** supports the transhumanist case: if death is bad because it takes good life away, then more good years are better.

      Both agree that the dead feel nothing. They disagree about whether harm requires experience.

  - type: mcq
    id: bad-mcq
    title: "Whose argument?"
    prompt: |
      A transhumanist says, "Every extra year of good life is a gain." Which view of death does this fit best, and what would an Epicurean answer?
    options:
      - text: "It fits the deprivation account; the Epicurean replies that since death is no experience, losing years is nothing to us and the fear is a mistake."
        correct: true
        feedback: |
          Yes. Both views are serious. Deprivationists say that the goods lost are the harm. Epicureans say that harm needs experience, so the dead have nothing to regret and the living should not fear.
      - text: "It fits Epicurus, who held that death is the greatest evil."
        feedback: |
          Epicurus held the opposite: that death is nothing to us.
      - text: "It fits no view, because everyone agrees death is bad."
        feedback: |
          Not everyone does. The Epicurean tradition denies it, and the Stoic tradition treats death as something to accept. The claim is philosophical, not a given.
    explanation: |
      Layer: the positions are documented (layer 1). Whether death is bad is a live debate (layer 2) resting on a view about what harms a person (layer 3).

  - type: text
    id: identity
    title: "The identity problem"
    image:
      src: img/parfit.webp
      alt: "Photograph of Derek Parfit speaking at a lecture"
      caption: "Derek Parfit (1942-2017), an Oxford philosopher whose book Reasons and Persons (1984) turned the puzzle cases of personal identity into an argument about what we should care about."
      credit: "Anna Riedl, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Derek_Parfit_at_Harvard-April_21,_2015-Effective_Altruism_(cropped).jpg"
    body: |
      Now the second question from the hook. Suppose a machine records every atom of your brain and body and builds a copy elsewhere. In Derek Parfit's version in *Reasons and Persons* (1984), the original may be destroyed (the teletransporter), or in a variant the original survives while the copy is made. An upload is a close cousin: the copy runs in a computer.

      **View 1: psychological continuity.** According to this view, associated with Locke and Parfit (Stanford Encyclopedia), you persist by being psychologically connected to a later being, through memories, character and intentions. A perfect copy inherits all that, so it can be you. If two beings continue you at once, as in Parfit's non-branching version, neither is strictly identical to you; Parfit himself held that identity matters less than psychological connection.

      **View 2: animalism or the body view.** According to Olson (1997), as the Stanford Encyclopedia reports, we are living organisms. A copy in a computer is a different thing, so an upload is not you. The usual objection is the brain transplant: it seems that you would go with your brain, not stay behind in an empty head. Animalists reply that the fact that we seem to be organisms outweighs this.

  - type: mcq
    id: identity-mcq
    title: "Is the upload you?"
    prompt: |
      A copy of your mind runs in a computer, and your original body is gone. According to **animalism**, is the upload you? According to the **psychological continuity** view?
    options:
      - text: "Animalism: no, you are an organism and the upload is not. Psychological continuity: it may be you, since it continues your memories and character."
        correct: true
        feedback: |
          Yes. The two views split exactly here, and both are held by serious philosophers. Neither is settled by the technology: the question is a question about what a person is.
      - text: "Both views say yes, since the upload remembers everything."
        feedback: |
          Only the psychological continuity view counts memory as what matters. Animalism says what matters is the continued life of the organism.
      - text: "Both views say no, because a copy is never the original."
        feedback: |
          According to psychological continuity, a copy that continues the right connections can count as you. Parfit also argued that identity may matter less than that continuity.
    explanation: |
      Layer: the two views and who held them are documented (layer 1). Which view is correct is live debate (layer 2) and shapes whether uploading counts as escaping death or as making a successor.

  - type: mcq
    id: branch-mcq
    title: "The original survives"
    prompt: |
      You are scanned, and the original body is not destroyed: you wake up in the same body, and a copy also wakes up elsewhere, with the same memories. According to Parfit's non-branching idea, in essence as the Stanford Encyclopedia describes it, what follows for the copy?
    options:
      - text: "Two beings continue you at once, so neither is strictly identical to you; the view that a copy is you can no longer hold of one of them alone."
        correct: true
        feedback: |
          Yes. Identity is one-to-one: two different beings cannot both be you. Parfit drew the conclusion that what matters in survival is not strict identity. Critics reply that this leaves the question of the original's future unresolved.
      - text: "The copy is you and the original body is no longer you."
        feedback: |
          Nothing in the view says which of the two is you. Picking the copy or the original would be arbitrary.
      - text: "The copy is not you only because it is made of different atoms."
        feedback: |
          The psychological continuity view does not rest on the atoms. The problem here is that two beings continue you at once.
    explanation: |
      Layer: the thought experiment and its two readings are documented. Whether branching shows that identity does not matter is live debate.

  - type: text
    id: religion
    title: "Religious replies"
    body: |
      Religions have long promised an end to death, and replies to transhumanism begin there. Two views.

      **Immortality as a gift.** According to Plato's *Phaedo*, set on the last day of Socrates' life, the soul survives death, and Socrates offers several arguments (the cycle of opposites, recollection, the soul's likeness to the unchanging). According to the Nicene Creed, in the traditional English of the Book of Common Prayer, Christians "look for the resurrection of the dead, and the life of the world to come". On these views, endless life is given, and bodily or spiritual life after death does not depend on technology.

      **Immortality as a project.** According to transhumanist authors, the promise can be pursued by science: the Declaration's point 5 calls for "the development of means for the preservation of life and health" as an urgent priority. Some religious writers accept enhancement as compatible with faith,.

      Critics from within Christianity say, according to Plough and Church Life Journal essays, that technological immortality treats the body as disposable (an old Gnostic temptation), or that Christians seek salvation from sin, not endless life, and that the change is received from Christ, not achieved by us. Defenders of religious transhumanism reply that enhancement is a use of the gifts God gave.

  - type: mcq
    id: religion-mcq
    title: "Replies to the promise"
    prompt: |
      According to Christian critics of transhumanism, what is the main difference between technological immortality and the resurrection of the dead?
    options:
      - text: "The first is self-achieved and may treat the body as disposable; the second is a gift from God and includes the body."
        correct: true
        feedback: |
          Yes, in essence. Religious transhumanists dispute this and say that science can be a means God allows. Both positions are held by believers.
      - text: "The first is real and the second has been disproved by science."
        feedback: |
          Science does not address the resurrection one way or the other: it is a religious commitment (layer 3). And uploading is not yet real.
      - text: "They are the same idea in different words."
        feedback: |
          Critics and defenders alike treat them as different: one is a gift, the other a project. Whether technology could ever bring about something like the other is the live debate.
    explanation: |
      Layer: the creed and the critics' arguments are documented. Whether technology could fulfil religious hopes is a commitment, not a finding.

  - type: text
    id: objections
    title: "Objections: justice and meaning"
    body: |
      Two serious objections come from outside religion.

      **Inequality.** According to the Stanford Encyclopedia's *Human Enhancement* entry, critics warn that enhancements could divide society into an enhanced elite and an underprivileged class, and that enhanced persons might claim greater rights. Defenders reply that new technologies usually spread, and that the answer to inequality is access, not prohibition. Critics such as Kass (enhancement goes "beyond therapy") and Fukuyama (genetic enhancement threatens our humanity) add a deeper worry, also according to the entry.

      **Meaning.** According to Bernard Williams (1929 to 2003), in "The Makropulos Case: Reflections on the Tedium of Immortality" (1973, in *Problems of the Self*), a life of endless length would become tedious. Elina Makropulos is the long-lived heroine of Karel Čapek's play and Janáček's opera, whose case Williams uses. In essence, Williams argues that our "categorical" desires, the ones that give a reason to go on living, would run out, and a life that stayed recognisably ours would be unbearably repetitive.

      **The reply.** According to the Stanford Encyclopedia, critics such as Fischer argue that "superseniors" need not become dull: one can change interests and projects gradually and keep continuity. Williams's own aim was not to deny that death is a misfortune; he held that premature death is.

  - type: mcq
    id: objections-mcq
    title: "Williams and his critics"
    prompt: |
      According to the Stanford Encyclopedia, what is the central disagreement between Williams and his critics about endless life?
    options:
      - text: "Whether a person could keep finding projects worth pursuing without either becoming a different person or running out of reasons to go on."
        correct: true
        feedback: |
          Yes. Williams says no: the desires that make us who we are would be used up, or we would become someone else. Critics say we can change gradually and stay ourselves. Neither side has an empirical test, so this is live debate.
      - text: "Whether death is good for the person who dies."
        feedback: |
          That is Epicurus's question. Williams held that premature death is a misfortune; his claim is about endless life.
      - text: "Whether the opera or the play came first."
        feedback: |
          This is a history question and does not affect the argument. Williams used the opera's heroine as a case, not as evidence.
    explanation: |
      Layer: that Williams wrote this and what he argued is documented. Whether endless life would be tedious is a live debate (layer 2) and depends on a view of what makes a life worth living (layer 3).

  - type: mcq
    id: layers
    title: "Which layer is the claim?"
    prompt: |
      Label each claim: (1) established fact, (2) live debate, (3) commitment. Which claim belongs to layer 3, commitment?
    options:
      - text: "That death is an evil to be defeated, and not a natural and given part of life to be accepted."
        correct: true
        feedback: |
          Yes. It rests on a view of what life and death are for, held by transhumanists and rejected by Epicureans, Stoics and many religious thinkers, who see death differently.
      - text: "That mind uploading does not exist today."
        feedback: |
          That is a documented fact about the present (layer 1).
      - text: "Whether a perfect copy of a mind would be the same person."
        feedback: |
          That is a live debate (layer 2) between psychological continuity and animalist views, argued with cases.
    explanation: |
      Transhumanism sits at all three layers. The history and the state of the technology are fact. Whether copies are persons and whether endless life is good are debate. Whether death is an evil to defeat is a commitment.

  - type: text
    id: summary
    body: |
      **Back to the hook.** The two offers: a treatment that stops ageing and an upload. According to Bostrom and the Declaration, the aim is more healthy life, and ageing is a problem to work on, as the dragon fable urges. According to Epicurus, death is nothing to us; according to Nagel, it is bad because it deprives us. Whether the upload is you depends on a view of persons: according to psychological continuity it may be; according to animalism it is not. According to the *Phaedo* and the Creed, endless life is given, and Christian critics say the project is self-achieved. According to Williams, endless life would become tedious; critics reply that interests may change and the person remain.

      **What stays open:** whether ageing can be slowed far, whether a copy is a person, whether endless life would be good, and whether death is an evil to defeat or a given to accept.

      **Next:** the Traps round of this level, fast questions each built on a common misconception about these philosophies of life.
